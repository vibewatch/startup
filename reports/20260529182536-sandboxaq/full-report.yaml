      - number: '3.5'
        title: GPS-Denied Navigation and Quantum Sensing Competitors
        blocks:
          - type: paragraph
            body: >-
              In GPS-denied navigation and quantum sensing, SandboxAQ competes through magnetic navigation systems that
              do not rely on GPS, with defense contracts including the US Air Force. The competitive set spans classical
              inertial navigation incumbents, quantum-native sensing startups, and defense prime integrators.

              Advanced Navigation, an Australian company, raised $110M in a Series C round in March 2026 led by Airtree
              Ventures with strategic participation from In-Q-Tel and the Australian National Reconstruction Fund. With
              over 100,000 inertial navigation systems deployed globally and 80%+ of revenue from the US and Europe,
              Advanced Navigation is establishing PNT Centers of Excellence in the US and European markets. Customers
              include Anduril, NOAA, Hanwha, BHP, Rheinmetall, and Intuitive Machines. Its CEO describes the era of
              relying on a single GPS source as over, a message directly aligned with SandboxAQ's magnetic navigation
              positioning. Advanced Navigation's software fusion engine (AdNav Intelligence) competes on non-quantum
              inertial + AI fusion, while SandboxAQ differentiates on quantum magnetic sensing.

              Q-CTRL, an Australian quantum control infrastructure software company, launched Ironstone Opal—a compact
              quantum navigation system suitable for drones, autonomous cars, and commercial airliners. TIME named
              Ironstone Opal one of the Best Inventions of 2025, indicating commercial readiness signals in the same
              GPS-denied navigation market SandboxAQ is targeting. Q-CTRL's Fire Opal product also addresses quantum
              computing performance, meaning Q-CTRL competes with SandboxAQ in both navigation sensing and quantum
              algorithm optimization.

              Honeywell Aerospace and other defense prime integrators represent the status-quo incumbent threat—deeply
              embedded in defense and commercial aviation navigation supply chains with certification histories that new
              entrants must replicate. The switching cost in military navigation systems (DO-178C software
              certification, hardware qualification, integration testing) is a significant barrier that simultaneously
              protects incumbents and slows adoption of quantum-native alternatives.
            claimRefs:
