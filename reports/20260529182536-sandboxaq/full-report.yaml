      - number: '8.4'
        title: Strategic Optionality, Upside, and Downside Risks
        blocks:
          - type: paragraph
            body: >
              SandboxAQ's valuation is supported by structural optionality that pure revenue multiples cannot fully
              capture at this stage. The company competes simultaneously in at least four markets — post-quantum
              cryptography software, AI-driven drug discovery, quantum-sensing navigation, and magnetocardiography
              medical devices — each with independent potential to justify a multi-billion-dollar enterprise value at
              commercial scale. The inclusion of Google and NVIDIA as Series E investors is a particularly strong
              signal: both companies have deep technical diligence capability and strategic interest in SandboxAQ's
              Large Quantitative Models as complements to their respective AI ecosystems. BNP Paribas joined
              specifically to explore AI and quantum techniques in financial services, adding a major institutional
              partner with deployment capability. Ray Dalio's participation, per his public statement in the press
              release, reflects conviction in the SandboxAQ team's quantitative AI approach. Government contract
              visibility — including multi-year USAF AQNav extensions and DoD cryptography partnerships — provides
              partially recurring revenue anchoring not subject to standard enterprise sales cycles. The Alphabet
              lineage provides deep technical talent and credibility with regulated enterprise and government buyers. On
              the downside, Finro's Q4 2025 analysis provides an adverse anchor: applied AI cybersecurity companies are
              increasingly priced at established SaaS norms (8–15× revenue), not frontier-model premiums (25–40×). Forge
              Global's 2025 private market data showed AI funding concentrated in a small number of elite names, with
              secondary discounts widening for non-elite AI companies. Drug discovery remains a high-risk, long-cycle
              vertical: none of SandboxAQ's biopharma partnerships (AstraZeneca, Sanofi, MapLight) have produced a
              publicly disclosed Phase III trial entrant, and milestone payments are inherently lumpy. The preference
              stack on $950 million-plus raised is not publicly disclosed; at typical liquidation preference structures,
              common equity may require a $2+ billion exit to be meaningfully in-the-money.
            claimRefs:
              - CV022
              - CV023
              - CV028
              - CV030
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: table
            tableRef: TV006
            claimRefs: []
