company:
  name: SandboxAQ
chapter:
  number: 7
  title: Risks
  summary: >-
    SandboxAQ carries an elevated composite risk profile driven by five converging clusters: long
    enterprise PQC sales cycles in a still-forming market; a crowded competitive landscape with IBM,
    Thales, and DigiCert holding incumbent distribution advantages; sparse financial disclosure
    relative to a $5.75 billion private valuation; multi-segment execution risk across cybersecurity,
    life sciences, navigation, and sensing with a limited workforce; and technical and commercial
    uncertainty in AQNav and AI drug discovery. Government revenue concentration, export-control
    complexity, and key-person dependency add compounding risk. Mitigation is meaningful via
    standards leadership, investor depth, and government contract anchors, but residual valuation,
    disclosure, and execution risks are material and require active monitoring.

sections:
  - id: execution-and-market-risk
    title: Execution and Market-Timing Risk
    body: >-
      SandboxAQ's primary revenue driver post-quantum cryptography (PQC) migration operates in a market
      that is forming rapidly but converting slowly. Enterprise sales cycles for large-scale cryptographic
      re-platforming are typically 10-15 years end-to-end; SandboxAQ's own channel chief acknowledged
      that industries such as financial services take that long to fully redesign and re-architect IT
      platforms. Even where urgency exists, CNSA 2.0 mandates compliance for new NSS systems by January
      2027, the commercial enterprise market faces softer deadlines extending to 2030-2035, delaying the
      commercial demand wave that underpins SandboxAQ's growth model. Most enterprise buyers lack complete
      cryptographic asset inventories before any migration sale, extending the sales cycle by an estimated
      6-18 months of discovery work. PQC algorithms such as ML-KEM carry performance overhead versus
      legacy RSA/ECC due to larger key sizes and higher compute requirements, slowing budget approvals
      among cost-constrained IT organizations. Entrust surveys confirm that PQC awareness is high in
      2024-2025 but actionable investment significantly lags awareness, indicating the market remains
      education-heavy and conversion-slow. SandboxAQ's channel partner program requires significant
      enablement investment before it can scale beyond direct enterprise sales, adding execution risk
      to an already complex go-to-market motion.
