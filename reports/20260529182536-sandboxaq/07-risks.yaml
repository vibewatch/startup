callouts:
  - calloutType: risk
    title: Sparse Financial Disclosure at High Private Valuation
    body: >-
      SandboxAQ has not published audited financial statements or GAAP revenue figures. Its $5.75 billion
      April 2025 Series E implies a high revenue multiple relative to the early-stage commercial revenue
      that can be inferred from publicly confirmed contracts. The revenue mix across government contracts,
      pharma milestone deals, and independent commercial enterprise ARR is undisclosed, making commercial
      product-market fit unverifiable from public information alone. Investors should require a detailed
      customer-by-customer revenue breakdown and third-party audit confirmation before committing additional
      capital at or above the last-round valuation.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR011

  - calloutType: risk
    title: Multi-Segment Execution Risk at Limited Scale
    body: >-
      SandboxAQ operates four technically demanding product lines — PQC cryptographic management,
      AI drug discovery, quantum navigation, and healthcare sensing — simultaneously with a workforce
      of approximately 350. Without clear public priority-ordering and with confirmed revenue anchors
      concentrated in government programs, the risk of spreading engineering talent and capital too
      thin to achieve market leadership in any segment before better-capitalized competitors consolidate
      each market is material. Investors should examine internal resourcing allocation and product-line
      prioritization before assuming the multi-segment bet is fully funded for success.
    claimRefs:
      - CR033
      - CR032
      - CR043
      - CR030

