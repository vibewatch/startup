  - id: regulatory-government-dependency-risk
    title: Regulatory, Export Control, and Government Concentration Risk
    body: >-
      SandboxAQ's revenue is meaningfully concentrated in US government programs: a five-year DoD PQC
      migration contract, the Air Force SBIR Phase 2B TACFI contract for AQNav, and the Defense Innovation
      Unit quantum sensing program together represent substantial committed revenue but create binary risk
      if any contract is terminated, reduced in scope, or subject to congressional appropriations
      uncertainty. Government contracts carry unique risks: termination for convenience clauses, annual
      appropriations exposure, and CMMC 2.0 continuous compliance obligations (mandatory as of November
      2025) including third-party assessment and annual attestation for DoD contractors handling
      Controlled Unclassified Information. Non-compliance with CMMC creates contract ineligibility risk.
      BIS export controls effective September 2024 impose worldwide licensing requirements on quantum
      computing technology, related software, and technical knowledge. For SandboxAQ, this creates
      compliance complexity when expanding internationally: licensing or license exceptions must be
      obtained before transferring quantum-related technology to most foreign persons, including deemed
      exports within the US to foreign nationals. The DFARS 252.225-7048 clause flows down export-control
      compliance obligations to all subcontractors and partners. These controls limit SandboxAQ's
      addressable international market and create regulatory exposure. SandboxAQ must also manage potential
      ITAR exposure if AQNav quantum sensors are reclassified as defense articles.
