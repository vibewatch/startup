  - id: competitive-and-strategic-risk
    title: Competitive and Strategic Risk
    body: >-
      SandboxAQ competes simultaneously across multiple technically demanding product lines: PQC migration
      management, AI drug discovery, quantum navigation, and AI security, against well-resourced incumbents
      and purpose-built challengers in each segment. In PQC cryptographic management, SandboxAQ faces IBM
      Quantum Safe, Thales CipherTrust partnering with IBM Consulting via Quantum-Safe 360, DigiCert
      Trust Lifecycle Manager, and Entrust, all of which carry established enterprise distribution,
      professional services organizations, and brand relationships in financial services and government.
      IBM and Thales are collaborating on turnkey PQC migration services that directly compete with
      SandboxAQ's AQtive Guard plus professional services model. In AI drug discovery, well-funded
      competitors including Isomorphic Labs and Chai Discovery target the same pharma buyers, and large
      pharma companies are building in-house computational AI teams. AQNav faces navigation incumbents
      Honeywell, Northrop Grumman, and Collins Aerospace plus emerging GPS-alternative startups.
      Operating simultaneously across all four segments with approximately 350 employees and without
      published revenue scale creates the risk that resources are spread too thin to achieve market
      leadership in any segment before a better-capitalized competitor consolidates each market. The
      multi-product strategy is a strength if execution is tight but a strategic liability if capital
      is constrained or talent diluted across parallel bets.
