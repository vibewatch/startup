  - id: technology-commercial-uncertainty
    title: Technology and Commercial Uncertainty
    body: >-
      AQNav magnetic navigation has demonstrated strong controlled-test performance, meeting RNP 2 standards
      for 100% of en-route flight time, but faces significant barriers to broad commercial deployment.
      AQNav's positional accuracy depends on the quality and density of Earth's crustal magnetic anomaly
      maps; sparse magnetic data in many regions limits applicability to well-mapped geographies. AQNav
      has not yet achieved airworthiness certification for precision approach navigation (RNP below 0.3),
      restricting commercial use to en-route phases. The path from DIU program funding to large-scale
      DoD procurement involves multiple competitive procurement events and Technology Readiness Level
      verification, creating multi-year uncertainty. Quantum sensors also face environmental reliability
      questions in operational conditions beyond controlled tests.
      In drug discovery, SandboxAQ's Large Quantitative Models (LQMs) promise accelerated in-silico
      discovery but face the reality that drug candidates fail in clinical trials at rates exceeding 90%.
      Even accurate molecular simulation cannot guarantee clinical success, meaning LQM revenue depends
      on milestone-based partnership economics rather than predictable subscription revenue. The May 2026
      integration of LQMs into Anthropic's Claude broadens access but introduces platform dependency risk.
      Pharma buyers with long procurement cycles may be slow to shift from established computational
      chemistry vendors. Healthcare sensing markets for quantum-based clinical diagnostics remain unproven
      commercially and require regulatory pathway validation before revenue can scale.
