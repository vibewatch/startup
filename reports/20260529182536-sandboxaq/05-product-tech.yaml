        - Unified CPM + AI-SPM on single platform from same scanning engine; AQtive Guard is the only disclosed MCP risk analysis tool
        - AI-SPM market is early; no published head-to-head evaluation exists
      - - Drug binding affinity prediction (open-source)
        - "AQAffinity on OpenFold3: structure-free, Apache 2.0, full training data disclosed, on HuggingFace"
        - AlphaFold 3 (commercial restrictions, no commercial use without license); Boltz-2 (MIT/Recursion, open-source baseline)
        - Fully transparent training data + methods; no costly long-term commitment; commercially permissive
        - AQAffinity described as "direct replication of Boltz-2 affinity module" in HuggingFace model card — differentiation from Boltz-2 needs clarification
      - - GPS-denied navigation
        - "AQNav: quantum magnetometer + LQMs; passive, unjammable, no map prior required (uses real-time crustal field)"
        - "Advanced Navigation (Certus Evo INS): inertial navigation + multi-constellation GNSS; SBG Systems; traditional MagNav relies on pre-mapped databases"
        - USAF-validated in exercises; passive signature (no emission); operates where INS drift accumulates over time
        - Commercial aviation certification (FAA/EASA) not underway; magnetic map quality in some regions unconfirmed
figures:
  - id: FE001
    title: SandboxAQ Product Architecture (Stack)
    type: stack
    layout: wide
    summary: Four-layer architecture showing SandboxAQ's LQM infrastructure supporting distinct product lines across cybersecurity, life sciences, navigation, and sensing.
    claimRefs:
      - CE027
      - CE028
      - CE029
    data:
      layers:
        - label: Customer-Facing Products
          detail: Four product lines delivering commercial output — cybersecurity (AQtive Guard), drug discovery (AQBioSim/AQAffinity), GPS-denied navigation (AQNav), and cardiac sensing (AQMed).
          items:
            - AQtive Guard (CPM + AI-SPM)
            - AQBioSim / AQAffinity (drug discovery)
            - AQNav (magnetic navigation)
            - AQMed (cardiac sensing)
        - label: Large Quantitative Models (LQMs)
          detail: Domain-specific AI models trained on quantitative physics and signal data rather than language corpora. Distinct from LLMs; power inference for all four product lines.
          items:
            - Cryptographic risk scoring models
            - Molecular simulation / binding affinity models (AQ-FEP)
            - Magnetic signal processing models (MagNav)
            - Magnetocardiography signal models
        - label: Data and Sensors
          detail: Raw data and sensor inputs feeding LQM training and inference — spanning enterprise IT environments, molecular structure databases, Earth crustal magnetic field maps, and quantum magnetometers.
          items:
            - Enterprise crypto asset data (code / runtime / network)
            - Molecular structure data / simulation outputs
            - Earth crustal magnetic field database
            - Cardiac magnetic field signals (quantum magnetometers)
        - label: Classical Compute Infrastructure
          detail: All LQM inference and AQ-FEP simulations run on classical cloud hardware (Google TPUs, GPUs, CPUs). No quantum computing hardware is required for any current production workflow.
          items:
            - TPU clusters (DFT / AQ-FEP simulation)
            - GPU/CPU inference (LQM scoring)
            - Cloud environments (AQtive Guard scanning agents)
