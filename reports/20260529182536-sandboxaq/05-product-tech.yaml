    body: >-
      AQNav has accumulated 200+ flight hours and 40+ sorties across four aircraft types in active USAF contract work,
      including USAF Exercise Golden Phoenix and Exercise Mobility Guardian. The SBIR Phase 2B TACFI award is a
      concrete signal of government confidence in the technology's readiness for further development.
