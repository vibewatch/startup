  - calloutType: risk
    title: Life Sciences Revenue Unverified and Clinical Maturity Opaque
    body: >-
      While AQBioSim counts AstraZeneca, Sanofi, and UCSF as named research partners, no public revenue figures,
      commercial contract values, or clinical outcomes data have been disclosed. AQMed has not disclosed FDA clearance,
      CE-mark status, or any clinical outcomes, leaving its maturity unverifiable from public sources.
    claimRefs:
      - CE019
      - CE035
  - calloutType: risk
    title: PQC Migration is a Multi-Year Technical Commitment, Not Just Scanning
    body: >-
      AQtive Guard addresses discovery and inventory, which is the foundational step of PQC migration. However, the
      actual remediation — replacing quantum-vulnerable algorithms enterprise-wide — involves years of engineering work
      and hardware changes beyond what any scanning tool can automate. Buyers may underestimate implementation
      complexity when evaluating AQtive Guard's value proposition.
    claimRefs:
      - CE032
      - CE012
