  - id: technology-stack
    title: "Technology Stack: Large Quantitative Models"
    body: >-
      SandboxAQ's technical architecture is unified around what the company calls Large Quantitative Models (LQMs)
      — AI systems trained on quantitative, physics-grounded data rather than human language. The company explicitly
      distinguishes LQMs from LLMs: where language models learn from text corpora, LQMs learn from signal data,
      molecular simulations, magnetic field measurements, and other physical measurements. This framing underpins all
      four product lines: in AQtive Guard, LQMs analyse cryptographic signal data and risk patterns; in AQBioSim, LQMs
      generate and evaluate molecular predictions; in AQNav, LQMs extract navigational signal from magnetic noise;
      and in AQMed, LQMs process magnetocardiography signals from the heart.


      The company's LQM solutions page describes the underlying infrastructure as a classical computing stack —
      no current reliance on quantum hardware for production workloads. The quantum component in current products
      is primarily the quantum sensor hardware (magnetometers for AQNav/AQMed) and the quantum-mechanical equations
      used in AQBioSim simulations, both executed on classical CPUs/TPUs/GPUs. The company holds the record for the
      largest N^3 DFT simulation using massively parallel classical hardware with TPUs, which is a verifiable
      differentiation claim. The HuggingFace developer profile for SandboxAQ shows 123 members as of May 2026 and
      AQAffinity is installable via pip, indicating a functioning open-source developer community even if small.


      AQtive Guard integrates with existing enterprise platforms — CrowdStrike, Palo Alto Networks, and ServiceNow
      per Cyber Defense Magazine reporting — rather than requiring infrastructure replacement. The SandboxAQ
      OpenCryptography.com initiative (announced October 2025) created a public database exposing cryptographic risks
      in open-source software, representing a developer-facing signal effort. The IBM Quantum Safe stack (Guardium
      Quantum Safe) and IBM's quantum-safe transformation services represent a competing technical approach that
      also does cryptographic inventory management, illustrating that the market is attracting well-resourced
      competitors.
