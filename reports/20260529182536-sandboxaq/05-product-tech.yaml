  - id: life-sciences
    title: "Life Sciences: Drug Discovery and Molecular Simulation"
    body: >-
      SandboxAQ's AQBioSim division, formally announced in June 2023, applies physics-informed simulation to
      accelerate biopharma R&D. The core technology is AQ-FEP (Absolute Free Energy Perturbation), a proprietary
      software package that combines quantum mechanical equations with AI to predict molecular binding affinities.
      According to the June 2023 launch press release, AQ-FEP can profile more than 20,000 ligands per day in silico,
      and SandboxAQ holds the record for the largest N^3 DFT (density functional theory) simulation performed on
      classical hardware using large-scale linear algebra with TPUs. The approach targets "undruggable targets" and
      protein-ligand interactions where experimental structure data is incomplete.


      AQAffinity, launched January 20, 2026, extends this into structure-free binding affinity prediction built on top
      of OpenFold3 (the open-source biomolecular co-folding model from the OpenFold Consortium). AQAffinity eliminates
      the dependency on experimentally determined structures, allowing researchers to screen candidates and "fail fast"
      on low-probability paths before incurring wet lab costs. It is available under Apache License 2.0 on HuggingFace
      and was co-developed with the OpenFold Consortium under principal investigator Professor Mohammed AlQuraishi at
      Columbia University. The model was in beta with OpenFold Consortium members from December 2025 and openly
      released in January 2026.


      Named customers for AQBioSim include AstraZeneca, Sanofi, UCSF's Institute for Neurodegenerative Diseases,
      Riboscience, and Columbia University Medical Center. Sanofi CEO Paul Hudson called the technology "leapfrog"
      with potential to "significantly impact both preclinical and clinical development." Riboscience noted screening
      more than 20,000 ligands per day using AQ-FEP. FierceBiotech independently covered the AstraZeneca and Sanofi
      partnerships in 2023 as the company's commercial proving ground. AQChemSim applies the same simulation stack to
      materials science and advanced manufacturing, though no named commercial customers have been publicly disclosed
      for this sub-product as of the report date. AQMed for cardiac sensing has been referenced in company materials
      alongside Mount Sinai Health System as an early customer, but clinical deployment status and outcomes are not
      publicly reported.
