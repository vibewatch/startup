        - Medium — key reference for enterprise PQC sales in Japan and APAC
        - Confirm whether SoftBank is actively co-selling or just a deployer; seek case-study publication
      - - U.S. Air Force / DIU defense programs
        - SBIR programs are time-limited; transition to sustained production contract is not guaranteed
        - High — without follow-on procurement, AQNav development revenue ends
        - Monitor TQS program outcomes; track whether DoD issues a LRIP or production-phase award
    notes: >-
      Concentration risks are assessed qualitatively from public evidence only. Revenue share data per
      customer is unavailable. Impact ratings are relative, not absolute, and assume the named relationship
      accounts for a meaningful share of segment revenue. Both expansion drivers and concentration risks
      are speculative until SandboxAQ discloses financial segment data.
