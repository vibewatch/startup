figures:
  - id: FU001
    title: Enterprise Cybersecurity Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Illustrates the five-stage journey from regulatory trigger to product expansion for SandboxAQ's
      AQtive Guard customers, with named customer examples at each stage.
    data:
      nodes:
        - id: awareness
          label: Awareness and Regulatory Trigger
          detail: >-
            NIST FIPS 203/204/205 publication (Aug 2024), NSA CNSA 2.0 mandate, DoD Executive Order on
            quantum-vulnerable encryption, or board-level HNDL risk briefing prompts CISO action. SandboxAQ
            reaches buyers through Accenture channel, thought leadership, and RSAC presence.
        - id: evaluation
          label: Evaluation and Cryptographic Assessment
          detail: >-
            AQtive Guard performs cryptographic asset inventory — scanning networks, filesystems, and cloud
            for vulnerable certificates, weak algorithms, and unencrypted traffic. Vodafone and SoftBank both
            entered via PoC scans. Accenture joint Encryption Risk Assessment service is the channel entry point.
        - id: pilot
          label: Pilot Deployment
          detail: >-
            Phased rollout to one business unit or network segment. SoftBank scanned a local government
            network as validation phase. Mount Sinai integrated PQC protocols into a subset of its health network.
            Typical timeline 6-12 months to production validation.
        - id: production
          label: Production Scale and Contract
          detail: >-
            Full enterprise deployment with SLA-backed support. SoftBank Advanced Research Group reached
            production in March 2024. DoW CIO 5-year agreement represents the deepest confirmed production
            commitment. Enterprise features (SSO, audit logging, horizontal scaling) enable large-scale rollout.
