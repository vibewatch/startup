callouts:
  - calloutType: strength
    title: SoftBank Production Deployment is the Strongest Single Enterprise Proof
    body: >-
      SoftBank's trajectory — 2022 joint VPN PoC, 2023 hybrid-mode verification, 2024 Advanced Research Group
      production deployment — is SandboxAQ's most complete public enterprise customer journey. The deployment
      validated AQtive Guard's ability to discover cryptographic vulnerabilities in a live government-adjacent
      network and proved enterprise-class scalability (SSO, horizontal scaling, audit logging). It establishes
      SandboxAQ as a credible PQC production vendor, not just a proof-of-concept operator.
    claimRefs:
      - CU005
      - CU006
      - CU026
  - calloutType: risk
    title: Limited Retention Data and Long Sales Cycles Create Revenue Visibility Risk
    body: >-
      SandboxAQ has not disclosed NRR, GRR, churn, or customer-count data for any year as of May 2026.
      Independent SWOT analysis confirms "extremely long, complex sales process" and "difficulty articulating
      quantifiable ROI" as structural weaknesses. With CISO average tenure of 18-21 months — shorter than
      typical enterprise software deployment cycles — deal disruption risk is elevated. The named customer
      roster is small relative to SandboxAQ's $5B+ valuation, and most life-sciences relationships remain at
      collaboration stage rather than recurring revenue. Investors should seek retention KPIs before
      underwriting durable revenue assumptions.
    claimRefs:
      - CU025
      - CU030
      - CU031
      - CU032
      - CU037
  - calloutType: insight
    title: MapLight $200M Deal Signals Milestone-Based Pharma Monetization Path
    body: >-
      The December 2025 MapLight Therapeutics collaboration — with SandboxAQ eligible for up to $200M in
      aggregate preclinical, development, regulatory, and commercial milestone payments — establishes a
      precedent for how SandboxAQ can monetize AQBioSim at scale. If one or two more pharma partners sign
      similar milestone-based deals, the life-sciences segment could represent material future revenue. The
      risk is that milestones are contingent on drug development outcomes that remain years away, and
      SandboxAQ's share of total deal value depends on the structure of revenue-sharing with discovery
      platform providers.
    claimRefs:
      - CU020
      - CU035
      - CU036
