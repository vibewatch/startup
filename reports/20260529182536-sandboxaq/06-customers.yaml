  - id: retention-concentration-risk
    title: Retention, Expansion, and Concentration Risk
    body: >-
      SandboxAQ has not publicly disclosed net revenue retention (NRR), gross revenue retention (GRR),
      churn rates, renewal rates, customer-count data, or customer concentration metrics for any year as
      of May 2026. The strongest retention signal available is SoftBank's multi-year progression from
      initial collaboration (2022) through production deployment (2024), and the U.S. Air Force's contract
      extension via SBIR TACFI, but these are isolated data points rather than portfolio-level indicators.
      Independent SWOT analysis identifies "extremely long, complex sales process slows revenue growth" and
      "difficulty articulating clear, quantifiable ROI for customers" as confirmed structural weaknesses.
      CISOs — SandboxAQ's primary buyer in the enterprise segment — have average tenures of 18-21 months,
      creating structural disruption risk for multi-year deals in progress. Marketing analysis reveals that
      small-to-mid consultancies hold significant sway over CISO purchase decisions, requiring SandboxAQ
      to invest in thought-leadership and consultant-education in addition to direct selling. Accenture's
      channel partnership expands SandboxAQ's reach to the Global 1000 without building a proportionally
      larger direct salesforce, but partner-led revenue shares margin and adds execution dependence.
      Concentration risk is elevated: the named customer roster is small relative to SandboxAQ's funding
      scale, most pharma collaborations have not yet been confirmed as recurring revenue, and the life-sciences
      segment's commercial terms (milestone-based vs. subscription) are undisclosed. The 2025 AI Security
      Benchmark Report found 85% of enterprises plan to increase AI security spending in the next 12-24 months,
      confirming tailwind for the enterprise cybersecurity segment but also intensifying competition.
