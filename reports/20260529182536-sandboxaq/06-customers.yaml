  - id: lifesciences-customers
    title: Life Sciences, Pharma, and Materials Collaborations
    body: >-
      SandboxAQ's life-sciences customer base is anchored by named pharmaceutical and biotech collaborations,
      though the commercial structure of most relationships is disclosure-limited. AstraZeneca and Sanofi were
      named as initial customers of the AQBioSim molecular simulation division at its June 2023 launch.
      Sanofi CEO Paul Hudson publicly stated that SandboxAQ's "leapfrog technology could significantly impact
      both preclinical and clinical development." In October 2024, Sanofi selected SandboxAQ to identify
      biomarkers during clinical development using Large Quantitative Models (LQMs) that apply causal
      filtration to knowledge graphs — a repeat engagement extending the original AQBioSim relationship into
      downstream clinical phases. The UCSF Institute for Neurodegenerative Diseases collaborated with
      SandboxAQ to expand chemical space from 250,000 to 5.6 million molecules using AQBioSim, achieving a
      30-fold increase in hit rate for Alzheimer's and Parkinson's disease drug candidates. Google Cloud
      confirmed advanced collaborations with UCSF, Riboscience, Sanofi, and the Michael J. Fox Foundation as
      active drug discovery programs on SandboxAQ's cloud-native platform, and the World Economic Forum
      recognized SandboxAQ's AI-driven drug discovery approach. MapLight Therapeutics signed a strategic
      collaboration in December 2025 for CNS drug discovery targeting a novel GPCR, with SandboxAQ eligible
      for milestone payments totaling up to $200 million in aggregate. Novonix and SandboxAQ announced a
      collaboration in September 2023 to predict lithium-ion battery lifespan using AI chemical simulation,
      with resulting data products targeted for H1 2024. In 2024, Flagship Pioneering and SPARK NS also
      signed on to advance innovation pipelines through SandboxAQ's LQM platform. iOncologi signed a
      collaboration in July 2025 to build an mRNA vaccine for glioblastoma. The commercial structure of
      most life-sciences relationships — whether milestone-based, fee-for-service, or research
      collaboration — is not publicly disclosed, creating a gap in assessing the revenue contribution from
      this segment.
