chapter:
  number: 6
  title: Customers
  summary: >-
    SandboxAQ's disclosed customer base spans four verticals — enterprise cybersecurity/PQC, life-sciences
    simulation, GPS-denied navigation, and AI security management — anchored by named relationships with
    SoftBank Mobile (AQtive Guard production), Vodafone Business (quantum-safe VPN PoC), Mount Sinai Health
    System (PQC implementation), the U.S. DoW CIO (5-year agreement), and multiple pharmaceutical collaborators
    including Sanofi, AstraZeneca, UCSF, and MapLight Therapeutics ($200M milestone deal, Dec 2025). Customer
    proof depth is uneven: SoftBank and the DoW CIO show production-grade depth, while most pharma and healthcare
    relationships remain at collaboration or early-deployment stage. No NRR, churn, or customer-count data has
    been publicly disclosed, and independent analysis confirms that extremely long sales cycles and difficulty
    articulating ROI are structural weaknesses in SandboxAQ's go-to-market.
sections:
  - id: customer-base-overview
    title: Customer Base Overview and Segmentation
    body: >-
      SandboxAQ launched in March 2022 with Vodafone Business, SoftBank Mobile, Mount Sinai Health System,
      and Wix as named initial customers. These four relationships spanned telecom (PQC-secured VPN and
      cryptography management), healthcare (system-wide PQC protocol implementation), and digital services,
      establishing SandboxAQ's multi-vertical commercial identity from day one. Since then, the company has
      grown its customer roster across four primary product segments: (1) AQtive Guard/AI-SPM for enterprise
      cybersecurity and post-quantum cryptography migration, targeting CISOs at regulated enterprises and
      government agencies; (2) AQBioSim/AQAffinity for life-sciences simulation, targeting heads of
      computational biology and R&D at pharmaceutical and biotech companies; (3) AQNav for GPS-denied
      navigation, sold through defense-procurement channels to the U.S. Air Force, DIU, and allied
      governments; and (4) AI Security Posture Management (AI-SPM) for detecting shadow-AI and NHI risks,
      sold to enterprise security teams. The U.S. Department of War CIO's five-year agreement for AQtive
      Guard represents SandboxAQ's deepest disclosed government customer commitment. No total customer
      count has been publicly disclosed as of May 2026, limiting quantitative assessment of adoption scale.
    claimRefs:
