  - id: defense-government-customers
    title: Defense, Government, and Aerospace Customers
    body: >-
      The U.S. Air Force awarded SandboxAQ an SBIR Phase 2B Tactical Funding Increase (TACFI) in August 2024
      to further develop AQNav magnetic navigation for a broader range of aircraft platforms including
      unmanned aerial systems. By mid-2024, AQNav had accumulated over 200 flight hours and more than 40
      sorties across four aircraft types, successfully tested in Exercise Golden Phoenix and Exercise Mobility
      Guardian — Air Mobility Command's largest exercise at the time. In November 2025, the Defense Innovation
      Unit (DIU) extended the AQNav program by integrating SandboxAQ into the Transition of Quantum Sensing
      (TQS) program, with Defense One confirming testing on C-17 Globemaster IIIs during 2023 exercises.
      The TQS program targets Positioning, Navigation, and Timing (PNT) resilience in GPS-denied environments,
      representing a direct DoD procurement vehicle for SandboxAQ's navigation platform. Boeing and Acubed
      (Airbus's Silicon Valley research and innovation center) are also engaged with SandboxAQ to test and
      develop AQNav for commercial aerospace applications. The DoW CIO's five-year agreement for AQtive Guard
      cryptographic discovery and inventory across DoW environments is SandboxAQ's most strategically
      significant government customer relationship, combining both cybersecurity and defense applications.
      Defense procurement channels — including SBIR, AFWERX, and DIU — provide SandboxAQ with structured
      pathways to government revenue that are more predictable than the enterprise commercial sales cycle.
