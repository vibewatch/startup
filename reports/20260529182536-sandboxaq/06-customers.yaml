        - Confirm share of total ARR; understand renewal triggers and out clauses
      - - Accenture channel partnership
        - Partner concentration; Accenture controls access to Global 1000 accounts
        - Medium — partner disengagement or competing priorities would reduce pipeline
        - Confirm exclusivity terms; assess Accenture dedication vs. competing PQC vendor partnerships
      - - Life-sciences milestone deals (MapLight)
        - Deal is contingent on preclinical and clinical milestones; failure-to-advance risk
        - Medium — $200M is maximum; actual realized value depends on research outcomes
        - Track preclinical milestones; assess SandboxAQ share of AQBioSim revenue vs. total
      - - SoftBank as production reference customer
