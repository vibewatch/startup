  - id: products-milestones-scale
    title: Products, milestones, and scale signals
    body: >
      SandboxAQ's product portfolio spans four distinct domains. In cybersecurity and cryptography, AQtive Guard
      is the flagship offering — an AI Security Posture Management (AI-SPM) platform launched December 3, 2025,
      designed to discover cryptographic assets, detect non-human identity risks, manage post-quantum migration,
      and enforce NIST FIPS 203/204/205 compliance mandates. AQtive Guard received RSAC 2026 updates in
      March 2026, adding MCP (Model Context Protocol) risk analysis, runtime AI guardrails, and cloud scanning
      for shadow AI. In life sciences and materials science, AQBioSim and AQChemSim apply physics-based
      simulation to drug discovery and chemistry; Quantum Insider cited 15× faster drug design with AQBioSim
      and 95% faster lithium-ion battery life prediction with AQChemSim. AQAffinity, launched January 20, 2026
      as part of the OpenFold Consortium's OpenFold3, eliminates the need for pre-existing 3D protein structures
      in binding affinity prediction, enabling "fail-fast" early-stage drug research. In navigation, AQNav is a
      GPS-free system that decodes Earth's magnetic field quantum signals; TIME100 2025 reported it is under
      active testing by the U.S. Air Force. In medical sensing, AQMed and CardiAQ focus on magnetocardiography
      and clinical diagnostics.

      The DoW CIO agreement — a five-year contract with the U.S. Department of War Chief Information Officer —
      is the strongest public proof point for enterprise government adoption. AQtive Guard will automate
      cryptographic discovery and inventory across DoW environments, supporting the department's managed
      post-quantum cryptography migration. This follows an earlier demonstration with DISA's Emerging Technology
      organization through the QRC PKI program.

      Headcount signals are materially ambiguous. At launch (March 2022) the company had 55 engineers, scientists,
      and technologists. Yahoo Finance lists 101 full-time employees; Tracxn's company-profile page shows 348;
      Cyber Defense Magazine estimated approximately 250 employees with ~70 in cybersecurity as of 2025. No
      authoritative public headcount exists. Revenue is not disclosed. SandboxAQ was named to TIME100 Most
      Influential Companies 2025, citing a $5.75 billion valuation.
