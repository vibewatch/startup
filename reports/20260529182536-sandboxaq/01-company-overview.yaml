  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: >-
        An official SandboxAQ statement clarifying whether the December 2024 round's $5.3 billion is
        strictly pre-money and the $5.6 billion reported by Reuters and others is post-money.
      whyItMatters: >-
        The $300M discrepancy between the official $5.3B pre-money and the widely-cited $5.6B affects
        the step-up narrative and the implied cost of the December round; a downstream valuation analyst
        relying on either figure without reconciliation will produce an incorrect cap structure model.
      diligencePath: >-
        Request official capitalization table from SandboxAQ; compare against Form D or equivalent filing
        if available; cross-reference with Tracxn's $5.75B Series E post-money figure for internal consistency.
      relatedQuestionRefs:
        - QO004
        - QO011
        - QO017

    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
