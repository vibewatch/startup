company:
  name: SandboxAQ

chapter:
  number: 1
  title: Company Overview
  summary: >-
    SandboxAQ is a Palo Alto-based private B2B enterprise AI company that spun off from Alphabet in March 2022,
    raising over $950 million across five rounds through April 2025 at a reported post-money valuation of
    approximately $5.75 billion. Led by CEO Jack Hidary and Board Chairman Eric Schmidt, the company applies
    Large Quantitative Models (LQMs) to cryptography management, life-science simulation, navigation, and
    medical sensing — with AQtive Guard and a five-year U.S. Department of War CIO agreement representing
    its clearest commercial traction evidence to date.

sections:
  - id: identity-origins-business-model
    title: Identity, origins, and business model
    body: >
      SandboxAQ is an independent enterprise AI company headquartered in Palo Alto, California. It was officially
      spun out from Alphabet Inc. on March 22, 2022, after operating as an internal Alphabet team from 2016 onward.
      The company holds no ongoing subsidiary or parent relationship with Alphabet; Google is one investor in the
      Series E round but holds no governance control. SandboxAQ operates as a private, venture-backed company and
      is not listed on any public stock exchange.

      The company describes itself as a global leader in enterprise quantitative AI. Its core proprietary framework
      is the Large Quantitative Model (LQM) — AI systems trained on quantitative, physics-aware data (numerical
      equations, molecular structures, sensor readings) rather than language tokens. Management has explicitly
      positioned LQMs as complementary to but distinct from Large Language Models (LLMs): CEO Jack Hidary has
      said "the majority of the economy is actually not based on language — it's based on quantitative
      relationships," a framing echoed by Reuters in December 2024 coverage. This positioning matters because
      it explains why SandboxAQ pursues problems in cryptography, drug discovery, and navigation where
      physics-grounded computation is the differentiator.

      The business model is B2B enterprise SaaS and solutions. SandboxAQ identifies its target verticals as
      biopharma, chemistry, materials science, cybersecurity, financial services, defense, and navigation.
      Revenue is not publicly disclosed. The company began commercializing immediately at spinout, naming
      Vodafone Business, SoftBank Mobile, Mt. Sinai Health System, and Wix as initial customers in its March
      2022 launch announcement. An official company FAQ states explicitly that revenue figures are not shared
      with the public and that any third-party estimates should be treated as speculative.
