callouts:
  - calloutType: strength
    title: Strategic-investor convergence signals commercial seriousness
    body: >-
      The addition of Google, NVIDIA, BNP Paribas, and Ray Dalio to the Series E cap table is a
      qualitative signal distinct from financial investor participation. Google is the former parent
      organization with direct knowledge of the technology's origins; NVIDIA is the primary hardware
      provider for LQM training runs; BNP Paribas is a potential enterprise customer in financial services.
      Multiple strategic investors simultaneously entering the same late-stage round suggests independent
      commercial due diligence, not momentum investing. Diligence should confirm whether any of these
      investments are accompanied by binding customer or supply commitments.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO026
      - CO029

  - calloutType: risk
    title: Product breadth and headcount ambiguity warrant diligence depth
    body: >-
      TechCrunch (October 2024) described SandboxAQ's mission as a "veritable alphabet soup of buzzwords"
      and its product set as "a large and somewhat wild assortment," reflecting analyst skepticism about
      whether a private company of SandboxAQ's disclosed scale can execute simultaneously across
      cryptography, drug discovery, navigation, and medical sensing. The headcount conflict (101 per Yahoo
      Finance, 348 per Tracxn, ~250 per Cyber Defense Magazine) means the capacity to staff four distinct
      R&D domains is unverifiable from public data. The undisclosed revenue figure means the business
      model's commercial validity cannot be independently confirmed. These three gaps — product focus,
      headcount, and revenue — compound each other and are the primary due diligence asks before any
      downstream valuation or competitive-positioning analysis.
    claimRefs:
      - CO007
      - CO008
      - CO044
      - CO045
      - CO046

  - calloutType: insight
    title: DoW CIO contract provides the strongest available commercial anchor
    body: >-
      Of all SandboxAQ's disclosed commercial relationships, the five-year Department of War CIO agreement
      is the most verifiable and the most material to near-term revenue. It followed a successful DISA
      Emerging Technology demonstration (QRC PKI program), indicating the deal was preceded by a technical
      validation cycle rather than a cold commercial sale. Government contracts of this type are typically
      reportable in federal procurement databases, which provides a potential independent verification path
      that does not exist for private enterprise customer revenue.
    claimRefs:
      - CO036
      - CO037
      - CO038

