      - number: '5.4'
        title: 技术论证仍脆弱的地方
        blocks:
          - type: paragraph
            body: >-
              对 HIF 的怀疑不是化学反应造假，而是从可运行试点走到全球燃料相关性，中间商业跨度极其残酷。独立来源提示了三个相连问题。第一，相比更容易的脱碳选项，e-fuels
              仍昂贵且依赖政策，因此最能自圆其说的场景是难电气化用途，而不是大众道路交通。第二，DAC 加电解既资本密集又耗电，这解释了为什么 Haru Oni 仍使用生物源 CO2，也解释了为什么 HIF
              的更大项目同样依赖实际可行的回收或生物源碳计划。第三，公开记录仍缺少工厂层面数据，投资人无法核验 Haru Oni 自身的开工率、转化收率、能源强度和故障率。


              因此，即便不同意 Industry Decarbonization 的语气，它的批评仍有用。该媒体认为，Haru Oni 受益于过早的 DAC
              信息包装，规模化时间表过于乐观。这并不推翻底层工艺链条。但它意味着，HIF
              应被承销为一家已在示范规模证明技术集成的项目开发商，同时在原料来源、认证复制、电解槽供应，以及生产足够有意义分子所需经济性上，仍背负显著执行风险。
            claimRefs:
              - CE014
              - CE015
              - CE035
