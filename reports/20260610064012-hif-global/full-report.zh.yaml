  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 HIF 的相关性
    rows:
      - - 海运 e-methanol
        - 可再生 methanol 分子销售、船用燃料供应、合规挂钩海运燃料溢价
        - 常规船用燃料、船舶销售、大多数港口基础设施 capex
        - 船舶运营商、船用燃料供应商、租船方、货主
        - 核心近期分子市场，因为 HIF 直接向航运销售 e-methanol
      - - 航空 e-SAF / MTJ
        - 合成航空燃料、SAF 证书、book-and-claim 属性、合规 jet fuel 掺混
        - 一般航空客票收入、飞机 OEM 收入、大多数机场 capex
        - 航空公司、燃料供应商、机场、合规 / 核算交易对手
        - 主要上行细分，但可能要经 methanol-to-jet 和认证路径触达
      - - 道路 / 赛车运动 e-gasoline
        - 面向高端示范、传统车队脱碳和部分合规价值的合成汽油
        - 大众市场 EV 充电、广泛乘用车电动化、常规汽油零售
        - 高端汽车品牌、赛车运动买家、专业分销商
        - 真实的产品验证，但长期池子可能小于航运或航空
      - - 氢衍生品进口市场
        - 拍卖支持的可再生氢衍生品进口，包括 methanol 和 eSAF
        - 国内电解槽设备销售、仅管道氢服务
        - EU 拍卖、进口商、工业和交通承购方
        - 通往欧洲的重要路径，因为 HIF 以出口为导向且依赖政策准入
      - - 隐含在分子销售中的项目开发服务
        - 与认证、许可、项目融资和可融资承购绑定的价值
        - 与燃料无关的通用可再生电力开发
        - 股权伙伴、贷款方、战略承购方
        - 估值取决于把项目里程碑转成可销售的合规分子
      - - 排除的邻近市场
        - 除可直接变现的 e-fuels 和衍生品市场外，无其他纳入项
        - 广义氢 TAM、可再生电力 TAM、碳捕集 TAM、所有交通脱碳支出
        - 不直接相关
        - 避免用泛气候市场叙事高估 HIF
    notes: 边界刻意收窄：只纳入可变现的 e-fuel 分子和合规挂钩价值，不纳入整个氢能或清洁电力经济。
