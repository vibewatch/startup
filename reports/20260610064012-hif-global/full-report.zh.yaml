      - number: '2.4'
        title: 驱动因素、约束和估值含义
        blocks:
          - type: paragraph
            body: >-
              HIF 最强的市场驱动因素不是泛泛的清洁技术热情，而是具体的政策和认证脚手架。ReFuelEU 式 SAF 需求、Hydrogen Bank 进口机制、Chile 氢行动计划、Germany 的进口导向，以及
              ICAO/IATA SAF 框架，都有助于在合成分子尚未按纯商品口径具备成本竞争力之前，创造支付意愿。但约束同样具体。IATA 称 Europe 的 2025 年 SAF 强制令让 SAF
              比常规航油贵五倍；ICCT 的 e-kerosene 研究显示，即使在乐观假设下，合成航油到 2050 年前在成本上仍无法击败化石煤油。IRENA
              对可再生甲醇也得出相同结论：当前成本仍高、销量仍低，尽管政策之后可能弥合差距。这意味着估值应倚重项目执行、认证、融资支持和可信承购排序，而不是只看宏大脱碳叙事。HIF
              确有真实战略选择权，因为甲醇可以直接服务航运，也可通过 MTJ 间接服务航空；但只有补贴制度、进口拍卖和客户合同持续足够久、能跨过成本缺口，这种选择权才有价值。
