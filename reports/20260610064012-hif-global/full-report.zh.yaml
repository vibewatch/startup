              Porsche 之外，HIF 第二好的现行客户验证是 Antarctica21。HIF 称，服务 Magellan Explorer 的 10 艘 Zodiac 船将在 2024-25 Antarctic
              season 使用 Haru Oni e-Gasoline；2026 年续约称这些 Zodiac 运营已连续第二季持续。这次续约重要，因为它是公开资料中最清晰的非 Porsche
              重复使用信号。即便如此，Antarctica21 仍是一家精品运营商，船舶较小、最多 76 名客人，因此该案例证明的是运营适配和品牌价值，远多于实质燃料体量。


              需求堆栈的其余部分更适合描述为商业化前的路径建设。Mabanaft 2025 年 HoA 覆盖每年约 100,000 吨 e-methanol，用于航运和工业应用，并配合 Hamburg 储罐码头准备；但 HIF
              明确称该文件推进的是朝确定性协议的谈判，而不是替代确定性协议。German eFuel One 2026 年 HoA 同样把来自 Paysandu 的每年约 100,000
              吨描述为谈判确定性合同的框架。Idemitsu 2023 年 Matagorda e-methanol LOI、2024 年 USD 114 million 投资，以及后续 JOGMEC
              支持的日本市场推进，都显示严肃战略意图，但读起来仍是投资人加市场开发验证，而不是可融资需求验证。Haru Oni 的 RFNBO 认证实质性帮助欧洲路径，但 Matagorda 和 Paysandu
