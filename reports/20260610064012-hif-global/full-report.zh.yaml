  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、赋能技术供应商和相邻燃料路径
        blocks:
          - type: paragraph
            body: >-
              不应只拿一种竞争对手给 HIF 做基准。直接开发商包括 Synhelion、Norsk e-Fuel 和
              Infinium，它们都想把可再生投入和捕获碳转化为成品合成燃料。但买方也可以通过技术层解决同一件事。Sunfire 和 Topsoe 不销售类似 HIF 的品牌燃料平台，却能通过提供电解和工艺
              know-how，帮助竞争开发商弥合成本、效率或可融资性差距。第三类也重要，因为 HIF 以甲醇为主：Liquid Wind、CRI 和 INERATEC 瞄准可再生甲醇或模块化 Power-to-X
              路径，在客户需要复制、授权或低资本部署时有机会胜出。HIF 的公开产品界面和 Porsche 相关 Haru Oni 验证很有辨识度，但也意味着 HIF
              同时在与航空纯玩家、航运纯玩家和轻资本技术模式竞争，而不是面对一张整齐的同业名单。
