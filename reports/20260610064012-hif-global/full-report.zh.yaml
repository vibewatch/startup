  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              HIF 不容易打分，因为公开记录给了战略验证，却几乎不给公司层面的价格发现。CB Insights 给出 2022 年 4 月 $600M 的估值标记和 $424M 的累计融资；HIF 自己 2022 年和
              2024 年的新闻稿则指向约 $460M 已披露股权融资，但仍没有新一轮价格。低质量的 GetLatka 页面把 HIF 描述成一家自举型 SaaS 公司，称外部融资为 $0、估值
              $247.5M；它的价值只在于证明公开创业数据库噪声很大，不能作为可投资分母。Porsche、EIG、Baker Hughes、Idemitsu 和 JOGMEC-linked capital 等战略名称，让
              HIF 不只是实验室故事，但它们没有揭示当前股权结构、优先权栈或项目融资经济性。基于公开证据，正确结论是继续研究，而不是买入或回避。投资人可以因为战略可选性真实而保持跟进；但仅凭公开证据，不能把 HIF
              当成定价清晰的独角兽。
