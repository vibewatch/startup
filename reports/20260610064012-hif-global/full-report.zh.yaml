  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和终端市场范围
        blocks:
          - type: paragraph
            body: >-
              HIF Global 的市场边界应限定在面向难减排交通的氢基液体 e-fuels，而不是整个氢经济或所有清洁能源支出。HIF 自己的产品界面很清楚：现在面向海运销售 e-methanol，面向现有内燃机车队销售
              e-gasoline，并规划基于 methanol-to-jet 转化的未来 e-SAF。其披露的项目管线也是以分子为先，而非像软件或设备供应商那样展开。Matagorda、Paysandú 和 Tasmania
              都围绕 e-methanol 生产叙事，并保留下游进入航空或道路燃料的选择权；Haru Oni 主要充当合成链条可运行的运营证明。这意味着纳入范围应包括可再生甲醇、可再生航油原料、符合 RFNBO
              的合成燃料、认证挂钩的合规价值，以及项目支撑的承购量。排除范围则是广义可再生电力部署、通用氢基础设施、大多数化石甲醇，以及规模更大的电气化市场。实际含义是，HIF 应以交通领域 power-to-liquid
              和氢衍生品需求形成为基准，尤其是船用燃料和航空脱碳，而不是套用一个包罗万象、数万亿美元级的氢 TAM。
