      - number: '5.2'
        title: CO2 策略和商业规模工厂设计
        blocks:
          - type: paragraph
            body: >-
              HIF 技术栈里最重要的细节是碳来源。Haru Oni 目前仍使用生物源 CO2，DAC 只是现在才作为概念验证被加装上去。HIF 自己的 DAC 更新很明确：新装置每年捕获 600 吨
              CO2，目的是为后续设施积累运营经验。这很重要，因为公司当前并没有把商业场址作为纯 DAC 优先项目来销售。Paysandú 依赖与生物乙醇挂钩的生物源 CO2 和专用太阳能加风电；Tasmania
              指向残余生物质作为 CO2 选项，并配合电网支持的可再生电力；Texas 则围绕超大电解槽容量加回收 CO2 叙事。换句话说，HIF 的管线扩张方式，是在每个地理位置把充足可再生能源与最实际、可认证的碳源配对。


              这个设计选择是理性的，但也意味着 Haru Oni 的 DAC 故事应被看作叠加在生物源碳试点上的 R&D 模块，而不是 HIF 工业化铺开已经解决大气 CO2 捕获的证明。从 1.2 MW 试点电解槽跃迁到
              280 MW、1.1 GW 或 1.8 GW 商业场址，跨度巨大。HIF 的项目页面显示，公司理解这一点，并已在产出目标旁边披露培训、许可、招聘和设备供应依赖。
