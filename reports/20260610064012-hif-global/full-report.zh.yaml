      - number: '6.2'
        title: Porsche 作为灯塔客户验证
        blocks:
          - type: paragraph
            body: >-
              Porsche 是 HIF 公开记录中最能防守的实际客户验证，因为这段关系横跨投资、承购意向、实物出货和重复终端使用。Porsche 在 2022 年作为 HIF 约 USD 260 million
              股权融资的一部分投资 USD 75 million，HIF 和 Porsche 都把这笔资本与工业 e-fuels 建设绑定。到 2022 年 12 月 Haru Oni 开幕时，Porsche
              已不只是战略投资人：HIF 的伙伴新闻稿称，Porsche 已就 Porsche Mobil 1 Supercup 和 Porsche Experience Centers 等灯塔项目签署承购协议，而
              ExxonMobil 披露的角色是 methanol-to-gasoline 技术，不是购买燃料。


              后续验证点更强。HIF 的可持续发展报告称，公司向 Europe 出口首批商业出货，即 24,600 升合成汽油，供 Porsche 使用；Renewables Now 将这批出口描述为发往 UK Porsche
              的货物。Porsche 随后宣布，2024 年 Supercup 赛季将完全使用 Haru Oni 来源 eFuels，八个欧洲比赛周末、最多 32 辆车合计约 50,000 升。2025
              年，HIF、Porsche 和 Shell 签署供应协议，Haru Oni e-Gasoline 将送往 Shell 位于 Hamburg 的技术中心调和，然后由 Porsche
              用于灯塔活动。这是真实商业化，但仍是灯塔商业化：公开记录没有披露价格、take-or-pay 量、合同期限或与 Porsche 需求挂钩的经常性收入。
