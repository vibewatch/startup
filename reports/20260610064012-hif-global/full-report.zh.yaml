  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前估值和条款
        - 2024 年资本募集的定价条款、当前股数、优先权，以及任何附函。
        - 没有这些文件，战略性标题无法换算成真实入场经济性。
        - 董事会材料、融资律师，以及最新股权结构表导出。
      - - 公司财务桥
        - 收入、毛利率、经营现金流、烧钱速度、现金跑道，以及项目层面与公司层面的现金隔离。
        - 公开来源不足以支撑收入倍数或公开市场准备度判断。
        - CFO 资料包，以及经审计或董事会批准的财务桥。
      - - 项目融资路线图
        - 按项目拆分债务、税收、补贴或结构化资本堆叠，包括先决条件和发起方承诺。
        - 公司层面估值取决于数十亿美元级工厂能否真正融到资。
        - 财务团队、贷款人演示材料和项目融资条款清单。
      - - 最终承购质量
        - 已签署合同、定价逻辑、量级爬坡、信用支持和终止条款。
        - HoA 和 LOI 具备战略价值，但不等于可融资需求。
        - 商务团队合同室和交易对手信用审查。
      - - 战略伙伴经济性
        - Porsche、Idemitsu、JOGMEC 关联、Baker Hughes，以及任何日本市场开发安排的精确经济性。
        - 战略方名称可以创造价值，也可能掩盖公司层面经济性偏弱。
        - 附函和治理权审查。
      - - 退出准备度
        - 至少一个大型工厂能从开发表象推进到可融资建设，并最终投产利用的证据。
        - 没有这组证据，公开市场或战略退出故事都很脆弱。
        - 项目执行跟踪表、EPC 状态、融资交割路径和首笔收入时间。
    notes: 要把 HIF 从「战略上有意思」推进到「可按具体价格承销」，这些是最低限度文件。
