            body: >-
              公开可比公司支持的是谨慎，而不是精确。最好的私营部门参照更像资本栈案例，而不是干净估值可比。Infinium 展示了更可融资的模式：Brookfield 最高 $1.1B、HSBC
              项目融资，以及航空公司承购。Twelve 也有类似组合：$645M 混合融资、后续 $83M 跟投，以及一份 14 年、260 million gallon 的 SAF 协议。Sunfire
              说明资本可以围绕氢基础设施规模化聚集，Synhelion 则仍是规模更小的早期太阳能燃料参照。负面公开可比是
              LanzaTech：这家上市碳转化平台有真实工厂和技术可信度，却仍披露持续经营疑虑、募集偏救急式资本，并以约 0.5x sales 交易。组合起来看，HIF
              可以主张战略稀缺性，但不能无视资本市场下行。可用的公开承销区间因此很宽：如果商业化停滞，估值低于上一轮 $600M 标记；如果战略支持维持但价格发现仍不清晰，大致在 $600M 至低于
