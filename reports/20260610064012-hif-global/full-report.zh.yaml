      - number: '2.3'
        title: 买方、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              不同细分市场的买方、用户和付款方版图差异很大，这直接影响 HIF 的商业化路径。海运中，直接用户是船舶运营商，但采用经济性落在船东、租船方、燃料供应商和货主身上，这些主体越来越关心受监管的温室气体强度和
              Scope 3 声明。HIF 的 e-methanol 定位在这里很重要，因为它可用于甲醇发动机船舶，不需要改装到一种新分子标准；如果船用定价走弱，它也可升级成其他
              e-fuels。航空中，终端用户是航空公司，但付款堆栈更复杂：机场、燃料供应商、book-and-claim 系统、认证机构，以及 CORSIA
              和欧盟规则等政策制度，都会影响谁支付绿色溢价、谁主张减排收益。Germany 和更广泛的 EU
              尤其相关，因为官方政策同时围绕氢及其衍生品进口和本土生产来设计。这提高了拍卖准入、认证状态和承购结构的重要性。因此，对 HIF
              来说，采用路径不是简单的“生产燃料再出售”，而是“让分子合规，锁定政策兼容承购，并把产量导向价值最高的合规或溢价细分市场”。
