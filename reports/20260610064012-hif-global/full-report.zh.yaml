        - 航空公司和飞机运营商
        - 航空燃料预算，以及合规和客户脱碳项目
        - 强制规定、book-and-claim 系统、SAF 核算、ASTM/CORSIA 认可
        - 战略上行空间大，但需要认证、转化路径和承购结构
      - - 道路 / 赛车 e-gasoline
        - 高端汽车品牌、赛车项目、专业分销商
        - 现有 ICE 车队和示范项目
        - 品牌营销预算、高端燃料采购、小众合规价值
        - 不改发动机也能 drop-in 脱碳
        - 可用于证明产品，但不是最清晰的放量驱动
      - - 欧盟氢衍生品进口
        - 进口联盟、拍卖支持买方、工业承购方
        - 炼厂、燃料供应商、交通燃料中间商
        - 拍卖支持、政策预算、承购协议
        - Hydrogen Bank 及相关进口机制
        - 现货市场成熟前，可把 HIF 这类出口项目接入欧洲
      - - 智利 / 乌拉圭本土生态需求
        - 项目开发商、物流运营商、本地工业用户
        - 试点、港口、本地工业集群
        - 公共支持机制和早期战略买方
        - 国家政策支持、许可、示范项目
        - 对降风险重要，但估值中可能次于出口需求
