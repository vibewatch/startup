            body: >-
              融资故事真实，但仍然是战略型、项目驱动型。HIF 2022 年融资 $260M，AME 保持控制权；2024 年又宣布 Idemitsu 和现有股东投入 $164M，并通过 JOGMEC-linked
              capital 再获 $36M，使公司披露的 2022–2024 年股权融资约为 $460M。上述新闻稿也解释了资金为何不只是现金。Idemitsu 绑定了资本、采购计划、日本市场开发和 CO2
              供应链工作；JOGMEC 把 e-fuels 放在日本产业政策框架内；Porsche 和 Shell 则用灯塔用途让 Haru Oni 保持可见度。但合同层并没有名称看起来那么硬。German eFuel One
              仍是 HoA，Idemitsu 的 Texas 文件仍是 LOI，Porsche 和 Shell 仍处在示范导向语境，而不是为数十亿美元资产披露的长期 take-or-pay
              结构。战略价值应给予认可，但在战略关系转成可融资合同前，折价仍然必要。
