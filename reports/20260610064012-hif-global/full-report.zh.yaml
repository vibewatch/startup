  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限性
    rows:
      - - HIF Global（标的）
        - 当前公开价格发现
        - 未披露保留的 2026 年投后估值；最后一个公开标记是 2022 年 4 月的 $600M；公司披露 2022 年以来股权融资合计约 $460M
        - 价格纪律和不确定性框架的直接锚点。
        - 当前轮价格、股权结构表和可靠收入分母仍未披露。
      - - Infinium
        - 平台和项目融资
        - 最高 $1.1B Brookfield 承诺，加上 HSBC 项目融资；已披露航空公司承购
        - 最能展示更可融资的电子燃料组合可能长什么样的同业。
        - 公开材料更强调资本结构和项目成熟度，而不是公司层面估值。
      - - Twelve
        - 股权、债务与承购支持组合
        - $645M 混合融资，随后 $83M 跟投，以及 14 年、260M 加仑 SAF 协议
        - 这是最有力的证据：投资人和客户可以同时支持气候燃料放大。
        - 以航空 SAF 为先的路径，不同于 HIF 以甲醇为主的平台和区域组合。
      - - Sunfire
        - 氢基础设施融资
        - '>€500M 股权、EIB 债务和补贴支持合计'
        - 可作为氢基础设施和工业可信度在资本强度上限的参照。
        - 电解槽制造与 HIF 的项目开发组合不是同一种商业模式。
      - - Synhelion
        - 更早期太阳能燃料融资
        - CHF22M 融资轮，加上后续战略投资人支持
        - 显示合成燃料同业中资本规模较小的一端。
        - 从披露融资规模看，仍比 HIF 早得多、也小得多。
      - - LanzaTech
        - 公开市场可比公司
        - Yahoo 在 2026-06-09 显示约 $86.6M 市值、约 $94.0M EV、约 $58.4M TTM 收入和约 0.47x 销售额倍数；10-K 披露持续经营疑虑
        - 这是最清楚的公开提醒：融资压力下，气候燃料和碳转化故事可能大幅下修估值。
        - 技术和业务组合不同，运营历史也比 HIF 更长。
    notes: 本表完整覆盖本章使用的估值集合：一个直接 HIF 标记、四个私募资本可比对象，以及一个公开市场下行可比公司。
