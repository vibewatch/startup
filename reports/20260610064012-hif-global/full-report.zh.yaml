companyProfile:
  summary: >-
    HIF Global 起源于智利、与 Houston 联系紧密，是一家 e-fuels 开发商，利用可再生电力、氢和回收 CO2 生产 e-methanol、e-gasoline，以及未来用于难减排交通的
    e-SAF。公司已经在智利南部运营 Haru Oni 试点，背后有 AME、Porsche、EIG、Baker Hughes、Idemitsu 以及 JOGMEC 相关资本支持，并在
    Texas、Uruguay、Australia、Brazil 和 Chile 推进大型项目。公开证据足以说明这是一套真实平台，也有明显战略选择权，但当前估值、公司层面财务表现和可融资的长期合同深度仍未解决。
