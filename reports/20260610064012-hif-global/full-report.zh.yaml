      - number: '3.3'
        title: 为什么 Sunfire、Topsoe、Liquid Wind、CRI 和 INERATEC 仍然重要
        blocks:
          - type: paragraph
            body: >-
              HIF 一些最重要的竞争威胁位于上游一层，或相邻细分市场。Sunfire 和 Topsoe 重要，是因为电解槽效率、模块规模和集成质量会直接进入 e-fuel 经济性。Sunfire 现在宣传预期 89% LHV
              SOEC 效率、上一代设备已验证的 84% 基准，以及一个 50 MW 碱性模块，称其可把总安装成本最高削减 50%。Topsoe 围绕甲醇、SAF 和氨集成定位 SOEC，并以一个 500 MW
              制造基地支撑。相邻燃料侧，Liquid Wind 和 Ørsted 以更易复制的模板瞄准海运 e-methanol，CRI 和 INERATEC 则更偏向授权、模块化工厂或低 capex
              部署形式。这些模式可能永远无法复刻 HIF
              的精确分子组合，但当客户更看重低资本需求、更快铺开，或现有燃料与工业基础设施，而非旗舰项目所有权时，它们可能跑赢。对现有企业和基础设施相关买方来说，这同样重要：航运或工业客户可能更偏好复制型甲醇模板、嵌入现有资产基础的授权，或比
              HIF 自有旗舰式建设更容易融资的模块化工厂。
