  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 救助融资或下轮估值下调
        - 新资本带来明显惩罚性稀释、结构化救助条款，或价格低于上一公开标记。
        - 战略选择权不再足以覆盖融资风险，估值底部会快速下移。
        - 将情景重切到基准区间以下，或直接退出。
      - - 合同转化失败
        - 德国 eFuel One、Idemitsu 或类似框架文件未能转成最终合同。
        - 市场进入路径仍停留在叙事，无法支撑融资。
        - 对战略价值打更大折扣，避免为选择权付费。
      - - 项目融资延误
        - 尽管许可仍在推进、发起方继续表态，但可信的项目级融资路径没有出现。
        - 公司价值不再靠资产级去风险支撑，而是被反复股权融资挟持。
        - 把公司视为依赖资本的开发库存，而不是已跑通的出清平台。
      - - 政策 / 成本恶化
        - 支持性规则削弱，或成本曲线改善不足，无法维持符合条件的承购经济性。
        - 利用率出现之前，可触达的溢价市场先收缩。
        - 下调估值区间，只关注小众价值场景。
      - - 过早尝试公开市场
        - 大型资产尚未具备融资或运营条件，管理层就推动公开市场或退出叙事。
        - 公司将接受公开市场审视，却没有同业曾需要的证据集。
        - 假设估值压缩，而不是扩张。
    notes: 这些是估值破坏因素，不是泛泛的运营风险；每一项都可能直接推翻买方今天愿意支付的价格。
