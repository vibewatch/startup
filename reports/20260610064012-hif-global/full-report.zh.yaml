            body: >-
              公开经济性在投入强度上证据最强，在已实现盈利能力上证据最弱。Haru Oni 给出一个试点规模锚点：HIF 列出 US$78 million 建设成本、每年 130,000 升 e-gasoline 产能和 21
              名运营员工。这足以证明试点真实存在，但不足以推导有吸引力的单位利润。商业项目规模大得多，并由公用事业和工艺投入主导。HIF 称 Matagorda 需要约 1.8 GW 电解槽和每年约 2 million 吨回收
              CO2；其 Idemitsu LOI 又增加 2,000 MW 可再生电力需求和 300,000 mtpa 绿氢。独立来源也强化了这些变量的决定性。ARENA 称，首创项目 CAPEX 和 OPEX
              不确定性、市场时点和技术选择推动了 Tasmania 重新设计；RSC 2026 年论文称，燃料成本取决于 WACC、CAPEX、运营成本、平准化氢成本、DAC 碳成本和电解槽更换支出。Forbes
              用更商业的语言表达了同一点：HIF 管理层讨论了 DAC 当前约 US$250/吨、目标接近 US$100，初始生产成本约
              US$5/加仑，并对电力可得性和政策规则有重大敞口。简言之，在报告收入出现很久以前，电力、电解槽、CO2、物流和认证就已主导经济性。
