    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、地域布局和产品范围
        blocks:
          - type: paragraph
            body: >-
              HIF Global 更应被看作一家跨国 e-fuels 开发商和运营商，而不是单一的智利试点项目。公司自称在开发大型基础设施，回收二氧化碳，并为现有汽车、船舶和飞机生产氢基燃料；其官网展示的足迹横跨
              Santiago、Punta Arenas、Houston、Sydney 和 Berlin。运营验证点是智利南部 Magallanes 地区的 Haru Oni，HIF 现在称其为同类中首个已运营的
              e-fuels 设施，也是后续商业工厂的样板。HIF 还披露了 Uruguay、Chile、Brazil、United States 和 Australia 的先进项目储备，项目页面给出了具体的
              e-methanol、电解槽和就业数字。这种组合让 HIF 不同于许多气候科技创业公司：它已经有一个投产试点，下一波项目则围绕基础设施级合成燃料展开，规模以数十万吨到数百万吨计，而不是软件式渐进部署。
