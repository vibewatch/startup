      - number: '7.3'
        title: 政策、许可与社区 / 环境风险
        blocks:
          - type: paragraph
            body: >-
              HIF 的公开项目管线分布在多个司法辖区，每个站点仍有实质审批工作要完成。Paysandú 最典型。HIF 和独立报道都说，该项目目前只通过了环境选址可行性；公司还必须完成 Prior Environmental
              Authorization，以及覆盖水、生态系统、空气、废弃物、噪音、气味、土壤、景观和社会或文化影响的 High Complexity EIA。HIF 2026 年 3
              月的文件称，流程仍包括公民参与和公开听证。工厂占地和生态缓冲区的重新设计是管理层适应环境的正面信号，但也证明，环境和属地整合已经重要到足以在最终批准前重塑资产。


              Tasmania 的风险画像不同，但相关。EPA 材料显示，Burnie 提案仍在评估中，还需要市政许可，并有重大危险源、水、危险品、生物多样性和火灾风险等工作流。Texas
              进展更靠前，但即便是许可新闻稿，也把空气授权描述为融资和签约之前的一个里程碑。叠加在这些站点流程之上的，是欧洲市场规则。RFNBO
              合规不是一个品牌标签；它要求额外性以及时间或地理相关性，欧盟委员会还称这些规则也适用于出口商。政策风险因此并不小：HIF
              可以建厂，但如果电力采购、认证或生命周期核算安排跟不上不断演进的进口规则，仍可能难以按高溢价低碳经济性变现产品。
