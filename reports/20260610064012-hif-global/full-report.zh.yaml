    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - HIF
      - Synhelion
      - Norsk e-Fuel
      - Infinium
      - Sunfire / Topsoe
      - Liquid Wind / CRI / INERATEC
      - 含义
    rows:
      - - 当前下游运营证明
        - 强：Haru Oni 自 2022 年起生产
        - 良好：DAWN 自 2024 年起运营
        - 弱：FEED / 开发阶段
        - 良好：有商业量和 Roadrunner 主张，但披露量仍有限
        - 仅通过所供应项目间接体现
        - 混合：CRI 强，其他更多处于开发或模块化阶段
        - HIF 和 CRI 的运营证明最清晰；其他更多依靠项目或技术叙事
      - - 航空专属商业聚焦
        - 正在开发 e-SAF，但不是航空纯玩家
        - SWISS 和 solar jet 叙事较强
        - 最强的航空纯玩家姿态
        - 借 American 和 IAG 关联 SAF 需求较强
        - 间接：赋能 SAF 项目，而不是签航空公司承购
        - 除非甲醇向下游升级，否则较低
        - Norsk、Synhelion 和 Infinium 看起来比 HIF 更贴合航空公司买方
      - - 海运甲醇相关性
        - 强且明确
        - 中等
        - 低到中等
        - 中等
        - 通过氢 / 工艺供应间接体现
        - Liquid Wind 和 CRI 组合最强
        - HIF 的甲醇主导定位，与海运 e-methanol 平台的竞争更直接，而不是与只做航空的同业竞争
      - - 电解 / 工艺成本优势
        - 本章未明确
        - 声称用电更少，且没有氢中间环节
        - 取决于伙伴栈
        - 采用低成本氢和废 CO₂ 叙事
        - 公开电解和集成主张最强
        - 模块化或许可效率主张，而非 stack 领先
        - 即便技术供应商不拥有燃料项目，也能让竞品工厂更便宜
      - - 轻资本 / 可复制性
        - 最弱：项目所有者模式
        - 强：明确许可路线图
        - 中：带伙伴的项目开发商
        - 中：项目融资和棕地杠杆
        - 强：出售设备 / 工艺 know-how
        - 强：模块化或许可偏重模式
        - 轻资本对手可能比不上 HIF 的品牌光环，但在投资者希望降低资产负债表敞口时，它们能赢
      - - 客户 / 伙伴可见度
        - Porsche、Airbus、Honeywell、Johnson Matthey（战略伙伴）
        - SWISS 和 Eni
        - Norwegian、Cargolux、Paul Wurth
        - American、Amazon、IAG、Breakthrough、Brookfield（买方 / 资本方）
        - 工业客户和 PtX 开发商
        - Ørsted、全球被许可方、模块化用户
        - 价格和利润率仍不透明时，伙伴质量和具体性是公开比较可信度最清晰的方式之一
