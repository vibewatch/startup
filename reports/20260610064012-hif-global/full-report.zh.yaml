      - number: '1.3'
        title: 资本形成、所有权和战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              对一家私营气候公司来说，HIF 的资本故事战略属性异常强。2022 年 4 月，公司宣布从 AME、Porsche、EIG、Baker Hughes 和 Gemstone 获得约 USD 260 million
              股权投资，AME 仍是大股东，Porsche 与 EIG 获得正式董事会席位。Porsche 另行披露投资 USD 75 million，之后又称其 e-fuels 总投入超过 USD 100
              million，凸显这家汽车 OEM 既是资本提供方，也是头号灯塔客户。下一段发生在 2024 年：Idemitsu 在一笔 USD 164 million 合并融资中投入 USD 114
              million，JOGMEC 随后通过 Idemitsu Efuels America 进行 USD 36 million 股权投资，使 2024 年年初至今披露融资达到 USD 200
              million。这个组合很重要，因为它不是普通风险资本：它把智利控股股东、战略
              OEM、全球能源基础设施投资人、日本燃料市场伙伴和工业供应商放在一起。因此，融资基础支撑了项目开发可信度，但公开记录仍没有给出清晰投后估值、除 2022 年 AME
              大股东表述之外的当前持股比例，或后续融资中嵌入的下行保护。
