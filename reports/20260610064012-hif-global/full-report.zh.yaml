          label: 资质规则
        - from: ops
          to: qual
          label: 可追溯生产
        - from: 'off'
          to: cash
          label: 已签约需求
        - from: qual
          to: cash
          label: 高溢价定价资格
        - from: ops
          to: cash
          label: 产量爬坡
    claimRefs:
      - CR014
      - CR019
      - CR025
      - CR026
      - CR036
