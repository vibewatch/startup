  - id: TP001
    title: 竞品画像表
    columns:
      - 公司 / 路径
      - 类别
      - 当前公开证明
      - 主要细分市场
      - 相对 HIF 的主要优势
      - 相对 HIF 的主要限制
    rows:
      - - HIF Global
        - 标的公司
        - Haru Oni 试点已运营；Porsche 关联产品使用；methanol-to-jet 发展叙事
        - 多细分市场：海运甲醇、道路 e-gasoline、未来 e-SAF
        - 这一组里，只有 HIF 同时有可见的 Haru Oni 运营证明、Porsche 关联和甲醇主导的可选性
        - 自有大型项目模式让资本需求居高不下，公开经济性也偏薄
      - - Synhelion
        - 直接 PtL 同业
        - DAWN 自 2024 年起运营；SWISS 从 2027 年起承购；SWISS 和 Eni 投资背书
        - 以航空为主，同时保留柴油 / 汽油可选性
        - 如果得到验证，光热路径、较低用电叙事和许可路线图，在结构上可能显得比 HIF 更便宜
        - 经济性仍由公司验证，路径假设也与 HIF 的风电制氢路径差异很大
      - - Norsk e-Fuel
        - 直接 PtL 同业
        - Mosjøen FEED 正在推进；50M liters e-crude 设计；航空公司承购和 Paul Wurth 背书的工业化
        - 航空 SAF
        - 面向航空公司买方的 GTM 更干净，且欧洲航空承购表述比 HIF 更明确
        - 此处公开记录未显示运营中的燃料工厂，细分市场范围也比 HIF 更窄
      - - Infinium
        - 直接 PtL / e-fuels 同业
        - Roadrunner 获 American、Amazon、IAG、Brookfield、Breakthrough 支持，并配套 100 MW 电解槽
        - 航空加物流、卡车、塑料、海运
        - 航空公司和物流伙伴栈更明确，项目融资叙事也更强
        - 公开策略分散在 Energy 和 Edge 两个平台，确切燃料量仍披露不足
      - - Sunfire / Topsoe
        - 技术层竞品 / 赋能方
        - SOEC 和碱性平台、50 MW 碱性模块、500 MW SOEC 工厂、甲醇 / SAF 集成营销
        - 面向 PtX 开发商的电解与工艺层
        - 在不拥有整个燃料项目的情况下，可凭电解槽效率、模块规模和较低 capex 的工艺供应胜过 HIF
        - 仍依赖开发商客户达到 FID，且本身不是终端燃料品牌
      - - Liquid Wind / Ørsted（竞争项目）
        - 相邻 e-methanol 开发商
        - FlagshipONE 围绕 70 MW 电解和 50 kt/y e-methanol 展开；强调模块化复制
        - 海运 e-methanol
        - 航运焦点更尖，模板也比 HIF 定制化大型项目更利于复制
        - 运营证明不如 Haru Oni 可见，分子组合也更窄
      - - CRI
        - 相邻 e-methanol 既有玩家
        - 授权装机容量 >200 kt/y；CO2-to-methanol 商业工厂已在冰岛和中国运营
        - 可再生甲醇与技术许可
        - 已有商业规模甲醇记录，且许可模式更轻资本
        - 下游客户光环不如 Porsche 可见，对多分子可选性的强调也较弱
      - - INERATEC
        - 相邻模块化 PtX 玩家
        - 围绕合成燃料和化学品定位模块化 Power-to-X
        - 分布式 e-fuels / e-chemicals
        - 较低规模的模块化部署可适配不想承担 HIF 级资本承诺的买方
        - 此处公开材料未显示 HIF 式旗舰规模或头部承购
    notes: 各行反映买方、合作伙伴或融资方在真实 e-fuels 决策中会如何遇到这些选项，并不代表未披露市场份额或盈利能力的替代指标。
