      - number: '2.2'
        title: 规模测算视角和已披露产能
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能从多个视角获得，而这正是处理 HIF 机会的正确方式。宏观视角是交通脱碳：IEA 称交通领域可再生能源使用量到 2030 年应增长
              50%，航空和海运燃料约贡献新增增长的十分之一。长期衍生品视角更大：IRENA 和 WTO 认为，可再生氢及甲醇、e-kerosene 等衍生品，到 2050 年可占终端能源消费最高
              14%。航空视角更近，但约束也更强。ICAO 和 IATA 都把 SAF 放在航空脱碳中心，但 EASA 称 2024 年 SAF 仅占航油供应 0.53%，IATA 预计 2025 年也只有 0.7%。HIF
              自己披露的项目规模介于这些宽泛政策楔子和当前实际供应之间。Matagorda 宣传为每年 1.4 million 吨 e-methanol，Tasmania 为 210,000 吨，Paysandú 则根据不同
              HIF 页面介于 700,000 至 876,000 吨之间。这些项目数字能有力证明可触达细分市场规模，但没有揭示 HIF 的
              SAM、签约份额或已实现定价。正确结论是一套受约束的规模堆栈：长期脱碳需求很大，当前实物供应极小，公司特定捕获率仍未披露。
