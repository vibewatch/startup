      - number: '6.4'
        title: 耐久性缺口和需求警示
        blocks:
          - type: paragraph
            body: >-
              缺失的一层是耐久性数学。这里审阅的公开材料没有披露 HIF 的客户数、头部客户收入占比、NRR、GRR、流失率、续约节奏或 take-or-pay 承诺。这意味着本章可以验证精选灯塔细分中有需求存在，但无法验证
              HIF 未来业务中已有多少已被承销，多少仍依赖政策支持、项目融资和伙伴谈判。合同经济性没有披露尤其重要，因为 HIF 最可见的验证点，恰恰最符合高品牌价值、低体量示范活动的特征。


              反向记录强化了这种谨慎。Forbes 称 Porsche 计划先在赛车队使用 eFuel，以获得“每加仑最大宣传效果”，并引用 CSIS 的说法称，在 Treasury 指引落地前，经济性“极其投机”。SAE
              Media 后来引用美国 eFuel 价格约 USD 31/加仑，并认为像 HIF 这样的试点工厂产量太小，无法显著压低成本。这些来源没有否定 HIF
              的商业化路径；它们说明，当前堆栈应被看作兼容性和渠道形成的证明，而不是广泛经常性需求的证明。按今天的证据，HIF
              有一条可信的灯塔到渠道叙事，但还没有一套公开数据包，能让投资人承销客户多元化或可融资的长期承购经济性。
