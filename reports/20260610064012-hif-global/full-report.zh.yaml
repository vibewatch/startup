  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 证据
      - 含义
      - 尽调追问
    rows:
      - - 航空脱碳框架（ICAO LTAG、IATA 路线图、SAF 规则）
        - 驱动
        - 从现在到 2050 年
        - SAF 被定位为航空脱碳的最大杠杆
        - 支撑对合成航空燃料分子的溢价需求
        - HIF 产出中有多大比例能现实跨过航空资质和定价门槛？
      - - 欧盟 SAF 监测与强制比例爬坡
        - 驱动
        - 2025 年起
        - EASA 称，供应商必须从 2025 年起提供不断增长的 SAF 量
        - 拉动需求，但也带来进口依赖
        - 哪些 HIF 项目能符合欧盟合规 SAF 或 RFNBO 路径？
      - - European Hydrogen Bank 与拍卖
        - 驱动
        - 2025 年起
        - 面向氢衍生品的进口拍卖设计和市场透明度工具正在搭建
        - 可为出口项目补贴市场形成
        - HIF 能否直接投标，或通过客户进入拍卖挂钩结构？
      - - 智利与德国氢政策
        - 驱动
        - 当前十年
        - 智利聚焦价值链赋能；德国聚焦本土建设加进口
        - 同时支撑供给侧和需求侧政策匹配
        - 哪些司法辖区能为 HIF 分子提供最强的长期政策韧性？
      - - 当前 SAF 稀缺
        - 驱动兼约束
        - 2024-2026
        - 尽管路线图雄心很高，SAF 供给仍不到航空燃油的 1%
        - 稀缺支撑溢价，但也提示放量难度
        - HIF 能多快从试点证明走到可融资的签约放量？
      - - E-fuel 相对化石燃料的成本差距
        - 约束
        - 当前至 2040 年代
        - ICCT 和 IRENA 显示，没有支持时合成燃料仍然昂贵
        - 估值不应假设其很快具备独立大宗商品竞争力
        - 每个项目模型背后放了哪些补贴、碳价或溢价假设？
      - - 认证与核算复杂度
        - 约束
        - 当前
        - CORSIA、RFNBO、ASTM 式体系和 book-and-claim 系统塑造变现方式
        - 分子价值取决于路径资质，而不只是产量
        - 各项目已经拿到或计划走哪些认证和监管链路径？
      - - 公司在价格和承购组合上的披露缺口
        - 约束
        - 当前
        - 公开资料没有显示 HIF 分细分市场的价格实现或签约量
        - 限制干净测算 SAM/SOM 和估值承销
        - 获取逐项目承购期限、底价和公式细节
    notes: 驱动项与最可能削弱它们的约束配对，避免市场判断滑向单边政策乐观。
