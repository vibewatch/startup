        title: 验证阶梯和客户分层
        blocks:
          - type: paragraph
            body: >-
              HIF 的公开客户记录，如果按验证质量而不是 logo 数量排序，会最有说服力。第一类是真实的当前终端用户：Porsche 的赛车运动和 Experience Center 活动，以及 Antarctica21
              在 Antarctica 的 Zodiac 运营。第二类是可能成为大客户、但尚未证明为经常性需求的市场通路对手方：Mabanaft/MB Energy、German eFuel One 和
              Idemitsu。第三类是赋能者而非客户，比如 Shell 在 Hamburg 的调和角色，以及 JOGMEC 对日本市场开发的战略融资支持。这种分类很重要，因为否则 HIF
              的营销堆栈会看起来比当前收入验证实际更宽。


              因此，当前图景真实但狭窄。Porsche 是最清晰的公开信号，证明分子正在出货、调和，并被用于实际发动机。Antarctica21
              增加了第二个终端使用案例，而且重要的是，它带来了连续第二季使用。但更大体量的故事仍主要停留在 HoA、LOI 或政策开发阶段，围绕的项目尚未达到完整投资决策或商业运营。HIF
              有足够证据说明商业化路径存在；但它尚未发布足够证据，证明这些路径已经转化为多元化、持久且可融资的客户合同组合。
