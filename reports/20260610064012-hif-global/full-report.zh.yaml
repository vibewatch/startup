              HIF 的反向情景不是需求消失，而是竞争对手以更快速度或更少风险资本达到可融资规模。Topsoe 2025 年年报称，地缘政治不确定性正在拖延资本密集型 Power-to-X
              项目的最终投资决策；可融资性更多取决于长期承购和符合认证的运营，而不只是电解槽 capex。Forbes 另行描述 HIF 的 Matagorda 建设围绕一个 USD 6 billion
