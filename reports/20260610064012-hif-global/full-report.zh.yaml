  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱和基准情景下行
        blocks:
          - type: paragraph
            body: >-
              HIF 的核心风险不是电燃料在化学上跑不通。Haru Oni 已经验证了化学路径，公司也拼出了可信的交易对手阵容。剩下的风险在于，HIF 要从年产 130,000 升的试点，跨到数十亿美元、GW
              级资产；项目经济性同时押在廉价可再生电力、低碳
              CO2、符合政策资格的产出，以及融资和合同转化上。这和单纯验证分子兼容性完全不是一个承销问题。因此，基准情形下的下行风险不是突然技术失败，而是更慢、更常见的基础设施失灵：许可在推进，合作方仍有兴趣，但最终合同、项目融资、电力建设和合格需求没能及时对齐，撑不起满负荷利用。


              这个框架很重要，因为 HIF 的公开证据很容易显得比实际更成熟。官网页面披露 Matagorda 约 US$7 billion、Paysandú 约 US$5.385
              billion，而迄今披露的股权融资仍是数亿美元级，不是数十亿美元级。公开承购公告大多还是 HoA、LOI
              或灯塔使用协议，公司自己的新闻稿也反复提示，许可、谈判、融资、需求和政策都可能打乱进度。正确的风险图谱因此是多因素的：技术和供应链风险可能拖慢投产，政策和许可风险可能限制合格产出，商业集中度则可能让建成后的工厂仍然利用不足。平台是真实的，但上述组合足以支撑较高的残余风险评级。
