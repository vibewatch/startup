            body: >-
              HIF 的公开披露足以承销其工业严肃性，但不足以承销公司层面的财务表现。已审阅材料能可信勾勒项目、产能、电力和 CO2
              需求、投资人身份、许可、认证，以及少数出货或承购里程碑。它没有给出当前收入、ARR、毛利率、经营现金流、烧钱速度、现金跑道、债务、项目融资结构、已实现销售价格或可靠的当前估值。2024
              年融资后，所有权精度甚至下降：最后一个清晰控制权表述是 2022 年 AME 仍为大股东，后续轮次只识别了新资本，没有更新股权结构表。结果是一幅双速尽调图景。在项目层面，HIF 看起来像一家严肃的 e-fuels
              开发商，合作伙伴信号异常强，也有真实运营试点。在公司财务层面，披露仍不足。正确结论不是经济性缺失，而是已披露项目经济性和伙伴里程碑仍明显领先于已披露公司表现，使定价、利润率路径和融资充足性成为承销信心的主要阻塞点。
