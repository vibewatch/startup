        - 公司最终可能获得高于独角兽门槛的稀缺性溢价，但前提是可选性真正转化成可融资的经济性。
      - - 基准
        - 战略支持维持，许可和开发继续推进，但公开记录仍缺少当前定价轮、收入桥梁或完全最终的合同组合。
