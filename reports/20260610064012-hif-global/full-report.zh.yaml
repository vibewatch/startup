      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 正确的市场框架是以甲醇为主、由政策居中协调
            body: 不应按整个氢市场给 HIF 估值。更强的公开证据指向更窄的楔子：面向受监管或有溢价的难减排交通场景销售合成液体燃料，其中 e-methanol 是当前商业锚点，航空是靠转化带来的上行空间。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM025
              - CM042
              - CM043
          - type: callout
            title: 成本平价仍很遥远
            body: 航空和甲醇路径上的反向证据高度一致：当前合成燃料产量很小，政策支持承担了大部分需求形成工作，独立成本研究仍显示 e-fuels 在相当长时间里高于化石燃料平价。这就是 HIF 项目管线背后的核心市场风险。
            calloutType: risk
            claimRefs:
