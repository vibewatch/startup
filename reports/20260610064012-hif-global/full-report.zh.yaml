  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 端到端链条和 Haru Oni 验证
        blocks:
          - type: paragraph
            body: >-
              HIF 的技术故事最可信的讲法，是一条已经在 Haru Oni 跑通的物理链条，而不是纯愿景式气候叙事。智利南部试点工厂接入可再生风电，用电解制取绿氢，再把氢与二氧化碳结合生产
              e-fuels。对一家创业规模能源开发商来说，工厂披露异常具体：HIF 点名 3.4 MW 风机、1.2 MW Silyzer 200 电解槽、methanol-to-gasoline 步骤、每年 130,000
              升 e-gasoline 产量，甚至还有每天约 100 次分析的实验室。Hydrogen Council 和其他报道中的独立伙伴材料也佐证，Haru Oni 是一条真实集成的 power-to-X
              链条，而不是概念渲染图。


              但正确的技术解读是，Haru Oni 证明了集成，而不是世界级规模经济性。HIF 和伙伴材料显示，该工厂能生产甲醇，并把其中一部分升级为汽油；HIF 称其已经向 Porsche
              相关活动出口产品。这是有意义的运营证据。它没有证明高开工率、低成本生产或商业规模可重复性。这个试点仍是学习资产，最大价值在于证明 HIF 能在一个场址内把可再生电力、电解、碳原料、合成、质量控制和下游交付接起来。
