  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和商业验证点
        blocks:
          - type: paragraph
            body: >-
              HIF Global 的公开收入逻辑在概念上很直接，但披露仍不成熟。公司想把合成分子变现，先通过试点 e-gasoline 用例，再通过可扩展至航运和其他受监管市场的商业 e-methanol 承购。Haru
              Oni 提供当前验证。HIF 称该试点同时生产 e-methanol 和 e-gasoline，已经向 Porsche 出口燃料，并在 2025 年把 e-gasoline 交付至 Shell 位于
              Hamburg 的技术中心，供 Porsche 灯塔用途使用。Porsche 另行披露，其 Mobil 1 Supercup 将在 2024 赛季消耗约 50,000 升 Haru Oni 来源
              e-fuel；HIF 的可持续发展报告则称 2023 年首批商业出货总计 24,600
              升。这些事实重要，因为它们显示分子在流动、客户在使用、合规工作在推进。但它们没有显示收入质量。最可见的前瞻性商业标记仍是框架，而不是已锁定经济性：eFuel One 原则性协议覆盖每年约 100,000 吨
              e-methanol，Idemitsu LOI 加 Mabanaft 参考点指向 Matagorda 需求形成，但保留的公开来源均未披露固定价格、合同期限、take-or-pay 条款或已实现贡献毛利。
