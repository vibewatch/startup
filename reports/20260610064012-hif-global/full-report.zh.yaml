  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑
      - 什么会改变观点
    rows:
      - - 战略支持方质量
        - Porsche、EIG、Baker Hughes、Idemitsu 和 JOGMEC 关联资本，让 HIF 作为一家私营电子燃料公司拥有少见的战略深度。
        - 披露条款的当前定价轮，才能证明这些战略名字是否仍支持今天的估值，而不只是支持故事。
      - - 上市路径可选性
        - OEM 和日本关系围绕燃料采用、市场进入和政策杠杆创造了真实可选性。
        - HoA 和 LOI 一旦转成披露信用质量的最终合同，可选性就应少打折。
      - - 需求质量
        - Haru Oni 出货和灯塔使用表明，分子可以流动，也能用在真实发动机里。
        - 商业项目的长期照付不议合同，远比又一条示范使用标题更重要。
      - - 资本充足性
        - 公司已经融到真实资金，并在 2024 年继续吸引战略资本。
        - 只有项目资本和客户转化同步关闭，而不是又一次股权过桥之后再说，观点才会改善。
      - - 同业映射
        - Infinium 和 Twelve 表明，合同和项目成熟后，气候燃料龙头可以融到非常大的混合资本组合。
        - 如果 HIF 连这种融资模式的一部分都无法匹配，它的战略溢价就应该压缩。
      - - 公开市场下行
        - LanzaTech 证明，一旦融资风险占主导，碳平台叙事仍可能以困境水平交易。
        - 在假设公开市场会只为可选性买单之前，HIF 需要更强的私下证据。
    notes: 反向逻辑主要指向缺失的分母证明和融资转化，而不是电子燃料在化学上能否生产。
