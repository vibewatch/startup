      - number: '5.3'
        title: 下游路径、合作伙伴和认证
        blocks:
          - type: paragraph
            body: >-
              HIF 的伙伴图谱说明，公司并不是自己发明每一个单元操作。Johnson Matthey 是甲醇合成技术提供商，ExxonMobil 提供 methanol-to-gasoline 授权和支持，Siemens
              Energy 深度参与了最初 Haru Oni 概念和早期 Texas
              电解槽规划。这种架构合理，因为价值链是模块化的：可再生电力和电解产生氢；合成产生甲醇；甲醇随后可直接出售，也可进一步升级为汽油或其他分子。公开证据越来越显示，HIF
              的商业策略是甲醇优先。Texas、Uruguay 和 Tasmania 都主要作为 e-methanol 项目披露，Haru Oni 则仍是最强的公开汽油示范，因为它展示了 MTG 路径和 Porsche 关系。


              认证是第二个主要下游差异化点。Haru Oni 的 2025/26 RFNBO 认证不只是营销徽章；HIF 称其覆盖从 CO2 捕获到氢和成品分子的完整链条，证书要求可再生氢，并要求温室气体减排达到 70%
              门槛。ISCC 自己的材料清楚说明，这是受认可的审计框架，不是自定义标准。商业含义正面但范围窄：Haru Oni 已通过一条要求很高的路径，但每个未来场址仍需要自己的可审计电力、原料和监管链包，投资人才可把
              Haru Oni 视为能自动移植到各地的模板。
