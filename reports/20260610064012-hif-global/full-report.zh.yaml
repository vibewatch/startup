      - number: '1.4'
        title: 里程碑、商业化信号和警示旗
        blocks:
          - type: paragraph
            body: >-
              最强的里程碑证据来自运营，而不是愿景。Haru Oni 在产出首批合成燃料后，于 2022 年 12 月举行开幕仪式；Porsche 称该试点每年最多可生产 130,000 升燃料，HIF
              和伙伴则描述第一阶段产出为 350 吨 e-methanol 和 130,000 升 e-gasoline。到 2024 年和 2025 年，HIF 不再只谈试点象征意义：公司称 Haru Oni 已生产超过
              18 个月，已完成数批 e-gasoline 对 Porsche 的出口，并成为欧盟之外首个获得 ISCC EU RFNBO e-gasoline 生产认证的设施。2025 年和 2026 年，商业化信号通过
              Uruguay 环境选址批准、Antarctica21 联盟续约，以及 eFuel One 每年约 100,000 吨 e-methanol 的原则性协议继续扩大。警示旗同样重要。Forbes 把
              Matagorda 建设描述成一个数十亿美元的物流和融资挑战，报道称早期成本预期约 USD 5/加仑，经济性高度受政策影响；HIF
              自己的前瞻性声明也反复警告，许可、融资、客户需求和监管变化都可能实质改变项目时点。净判断是，HIF 已经走过概念叙事阶段，但其价值仍取决于在不断演化的政策和基础设施条件下，执行极度资本密集的项目。
