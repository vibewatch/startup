        title: Synhelion、Norsk e-Fuel 和 Infinium 对 HIF 施压最直接的地方
        blocks:
          - type: paragraph
            body: >-
              每个直接同业给 HIF 施压的原因都不同。Synhelion 的理论成本和工艺叙事最激进：它称 DAWN 自 2024 年起已运营，工艺可降至每吨 EUR 1,000 以下，且避免以氢作为中间体，用电量约为传统
              e-fuels 路径的三分之一。Norsk e-Fuel 范围更窄，但商业指向更清楚：其公开材料聚焦航空、Mosjøen 和航空公司挂钩的工业化，而不是 HIF 更宽的道路加海运叙事。Infinium
              是最强的公开证明，说明 HIF 并非唯一一家把 e-fuels 做成可融资基础设施的公司。American Airlines、Amazon、IAG 相关供应、Breakthrough、Brookfield 和
              Electric Hydrogen 都出现在 Project Roadrunner 的公开材料中。HIF 仍通过 Haru Oni 加
              Porsche，以及更宽的甲醇主导产品组合形成差异化；但这些对手在具体航空公司、物流或轻资本承销故事上，可能显得更对口。
