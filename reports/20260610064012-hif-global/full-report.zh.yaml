      - number: '7.4'
        title: 项目融资、客户集中度与合同转化风险
        blocks:
          - type: paragraph
            body: >-
              HIF 的商业叙事可信，但从可融资性看仍然偏窄。具名交易对手真实且有战略价值，但公开文件仍以 HoA、LOI 和灯塔协议为主。Mabanaft 和 German eFuel One
              都被描述为协议纲要。Idemitsu 的 Texas 文件明确是就销售和采购协议展开谈判的意向书。Porsche 和 Shell 是有价值的验证点，但公开表述仍集中在 Haru Oni
              的灯塔用途，而不是多元终端市场拉动。也就是说，最显眼的客户信号本身也是集中度风险：少数战略关系支撑了公司公开需求叙事的大部分内容，其中几段关系还是融资方或市场开发伙伴，而不是普通的大宗商品买家。


              融资侧进一步放大这种集中度。公开披露的股权轮次有分量，但相对单个超级项目都很小，更不用说整个组合。HIF 自己的披露反复提示，融资、谈判、政策进展和需求都可能偏离计划。用基础设施视角看，问题不在于 HIF
              能否继续吸引战略资本，而在于能否把战略兴趣转成足够的签约需求和第三方资本，支撑建设、投产和利用率，避免多年低收益。如果转化停滞，下行不需要项目彻底失败。更慢、更常见的下行是进度滑坡叠加部分商业化：工厂存在，但销量、利润率和信用质量晚于资本开支到来。
