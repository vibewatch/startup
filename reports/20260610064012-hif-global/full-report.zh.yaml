      - number: '7.5'
        title: 缓释因素、监控触发点与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              公开记录确实显示了真实的缓释因素。HIF 已经在 Haru Oni 产出燃料，拿到部分许可进展，重新设计 Paysandú 以处理环境整合，开始在 Tasmania
              做早期社区沟通，并吸引了可信的战略投资者和通往市场的交易对手。这些不是表面成果。正确的承销立场不是“技术幻想”，而是“平台真实，但商业规模仍脆弱”。这个区别很重要：上述缓释足以让 HIF
              对里程碑驱动型投资人保持可投性，但还不足以把执行视为常规动作。


              真正的问题是哪些因素会打破投资论点。最关键的是三组触发点。第一是时间：如果 AAP/EIA 审查、Tasmania 评估、电解槽交付或可再生电力园区审批明显滑坡，HIF
              的融资负担会先于收入上升。第二是经济性：如果交付后的 e-fuel 成本长期远高于替代方案，或 EU 资格认证比预期更难，可触达的溢价市场就会收缩。第三是转化：如果 HoA 和 LOI
              没能变成有披露交易对手和信用支持的约束性合同，公司可能持续展示兴趣，却拿不到可融资需求。换句话说，HIF 的风险章节只能在可监控、带退出标准的基础上保持可投，而不能建立在必然放大的简单叙事上。
