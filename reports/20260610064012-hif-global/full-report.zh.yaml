  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 赞助方质量和战略可选性让判断改善，但缺失价格和缺失合同两道测试仍让结论止步。
    data:
      nodes:
        - id: A
          label: 上一次公开标记：$600M
          detail: CB Insights 显示的是 2022 年 4 月估值标记，不是当前 2026 年价格。
          tone: neutral
        - id: B
          label: 战略资本真实存在
          detail: Porsche、EIG、Baker Hughes、Idemitsu 和 JOGMEC 相关资本支撑平台可选性。
          tone: positive
        - id: C
          label: 合同栈仍偏软
          detail: LOI、HoA 和灯塔供应主导公开材料包。
          tone: risk
        - id: D
          label: 同行奖励转化
          detail: Infinium 和 Twelve 展示的是可融资栈加长期需求，不只是大牌名字。
          tone: neutral
        - id: E
          label: 公开市场下行真实存在
          detail: LanzaTech 展示了气候燃料融资压力在公开市场会受到多重惩罚。
          tone: risk
        - id: F
          label: 继续研究 / 未知
          detail: 继续跟踪，但不能仅凭公开证据声称精确的当前公允价值。
          tone: risk
      edges:
        - from: A
          to: B
          label: 为以下事项设定背景
        - from: B
          to: C
          label: 仍受以下因素折价
        - from: C
          to: D
          label: 对标对象
        - from: D
          to: E
          label: 受以下因素压制
        - from: E
          to: F
          label: 因此
    claimRefs:
      - CV002
      - CV020
      - CV021
      - CV034
      - CV035
      - CV045
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最大的公开敏感项不是收入倍数数学，而是已披露资本与项目规模之间的缺口。
    data:
      items:
        - label: 上一次公开估值标记
          value: 600
          detail: CB Insights 2022 年 4 月 HIF 标记。
          tone: neutral
        - label: CB Insights 总融资额
          value: 424
          detail: 公开数据库统计的三轮融资总额。
          tone: neutral
        - label: 2022 年以来公司披露股权
          value: 460
          detail: 公司公告中的 2022 年融资加 2024 年披露投资。
          tone: positive
        - label: 独角兽门槛
          value: 1000
          detail: 跨过这条线需要比公开材料包更强的价格证据。
          tone: neutral
        - label: Paysandú 资本开支标记
          value: 5385
          detail: 官方项目页面上的资本标记，以 USD millions 计。
          tone: risk
        - label: Matagorda 资本开支标记
          value: 7000
          detail: 官方项目页面上的资本标记，以 USD millions 计。
          tone: risk
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 唯一站得住脚的公开区间，是锚定上一次公开标记和独角兽线的宽阈值。
    approximationNotes: 区间是从公开标记和里程碑逻辑推导出来的承销阈值，不是观察到的 2026 年融资价格。
    data:
      items:
        - label: 熊市承销区间
          low: 0.3
          mid: 0.45
          high: 0.6
          displayValue: <$0.6B
          detail: 商业转化保持偏软，融资压力显现。
          tone: risk
        - label: 基准承销区间
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B to <$1.0B
          detail: 战略支持真实存在，但公开价格发现和经济性仍不完整。
          tone: neutral
        - label: 牛市承销区间
          low: 1
          mid: 1.25
          high: 1.6
          displayValue: '>$1.0B'
          detail: 需要确定性包销、项目融资，以及战略可选性真实转化。
          tone: positive
        - label: 上一次公开参考点
          low: 0.6
          mid: 0.6
          high: 0.6
          displayValue: $0.6B
          detail: 2022 年 4 月公开估值标记。
          tone: neutral
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: KPI 组合说明 HIF 具备战略重要性，但仍过于不透明，无法给出干净的估值判断。
    data:
      items:
        - label: 当前披露的 2026 年估值
          value: none
          detail: 保留的公开来源没有披露当前投后估值。
          tone: risk
        - label: 上一次公开估值标记
          value: $600M
          detail: CB Insights 2022 年 4 月标记。
          tone: neutral
        - label: 2022 年以来披露股权
          value: ~$460M
          detail: 公司披露的 2022 年信息，加上 2024 年融资。
          tone: neutral
        - label: 仅 Matagorda + Paysandú 项目的资本开支
          value: '>$12.3B'
          detail: 官方网站的标记显示，融资缺口仍然很大。
          tone: risk
        - label: 同行融资信号
          value: Infinium/Twelve > $645M plus project finance
          detail: 头部同行把发起人资本与可融资的需求结构配在一起。
          tone: positive
        - label: 上市可比公司的压力信号
          value: LanzaTech ~0.47x sales
          detail: 融资承压时，公开市场可能会大幅下调气候燃料平台估值。
          tone: risk
        - label: 需求质量
          value: LOI / HoA / lighthouse-heavy
          detail: 战略客户名字已经出现，但项目级确定合同尚未公开。
          tone: risk
        - label: 证据质量
          value: low-medium
          detail: 适合用来划估值区间、排尽调优先级，不足以支撑精确公允价值。
          tone: risk
    claimRefs:
      - CV008
      - CV021
      - CV024
      - CV034
      - CV038
      - CV045
      - CV050
