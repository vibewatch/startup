      - number: '7.2'
        title: 技术、规模化与成本风险
        blocks:
          - type: paragraph
            body: >-
              最大的运营跨越，卡在 Haru Oni 的试点验证和商业项目之间。HIF 自己披露的信息显示，Haru Oni 相比拟议工厂仍然很小；正在安装的 DAC 模块也只有每年 600
              吨，只是帮助公司学习的概念验证。外部评论直接指出，独立评估者审视试点时，Haru Oni 还没有装上
              DAC。也就是说，商业化故事仍然押注于清洁氢和清洁碳原料链同时放大，而不只是一个原则上可行的甲醇制汽油转化环节。


              电力和设备栈叠加了第二层风险。仅 Matagorda 就需要每年约 2 million tonnes 回收 CO2、超大规模可再生电力输入，以及 1.8 GW 以上的工业电解槽部署。HIF 的公开路径从
              Siemens 预留转向后来的 Electric Hydrogen 选择，这可以理解为成本优化，但也提醒投资人：项目开发期内，供应商栈仍在变化。ARENA 的 Tasmania 报告提供了有用的独立警示：首创型
              e-fuels 项目开发周期异常长，技术选择仍开放，CAPEX/OPEX 也不确定。独立能源研究从经济性侧面强化了同一判断。IEA、IRENA、IIASA-EDF 以及 Energy &
              Environmental Science 都把高成本、基础设施需求和融资障碍列为核心约束。落到 HIF 身上，风险不只在化学路径能否成立，还在于 e-fuels
              的交付成本能否接近可接受区间，避免被困在小众示范市场，而 EV 和其他损耗更低的路径继续改善。
