      - number: '1.2'
        title: 管理层、董事会结构和治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开治理信息足以识别当前管理层班底，但还不足以承销完整控制权动态。HIF 的介绍页面列出 Cesar Norton 为总裁兼首席执行官，并列出 Clara Bowman、Roberto Simon、Diego
              Fettweis、区域 CEO 和其他职能负责人组成的宽管理团队。同一页面还列出董事会成员，包括 Norton、Alberto Araya、Bowman、Juan José Gana、Meg
              Gentle、Porsche 高管 Michael Steiner、EIG 董事长 Blair Thomas 和 Junzo Yamamoto，说明战略投资人和日本利益相关方已经贴近核心决策结构。外部佐证最强的是
              Gentle，Baker Hughes 的个人简介称她是 HIF Global 执行董事，负责开发数十亿美元级脱碳项目；另一个强佐证是 2022 年融资，该轮正式把 Steiner 和 Thomas
              加入董事会。更深一层的治理图景仍然稀薄：已审阅的公开材料没有说明委员会结构、独立董事代表性、股东否决权，也没有披露 AME、Porsche、EIG、Idemitsu 和 JOGMEC 相关利益之间的精确治理机制。
