        title: Exit readiness, thesis-breaks, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              HIF is not IPO-ready on public evidence. The retained pack still lacks a current disclosed post-money
              valuation, a reliable revenue bridge, burn and cash disclosure, the current cap table, and project-finance
              documentation. Category research says e-fuels remain expensive, policy-dependent, and still nascent inside
              the broader clean-fuels mix, so public markets would likely demand clearer contract conversion and
              utilization visibility than HIF has disclosed. That makes the most plausible near-term path additional
              strategic or project capital, not a clean public multiple. Investors should watch three valuation breakers
              first: a down-round or rescue financing; failure to turn HoAs and LOIs into definitive offtakes; and
              evidence that cost or policy conditions are worsening rather than improving. Before assigning any bullish
              mark, diligence should secure the 2024 round terms, the current cap table, definitive offtake contracts,
              the project-finance roadmap, and a real company-level revenue and cash bridge.
