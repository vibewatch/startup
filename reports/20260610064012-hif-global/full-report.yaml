              - CM016
              - CM034
              - CM035
              - CM036
              - CM037
              - CM045
          - type: callout
            title: Europe matters more as offtake pull than as production site
            body: >-
              Germany’s import orientation, EU auction design, and SAF compliance structures all point to Europe as a
              premium demand center for HIF’s molecules. The open diligence question is whether those support structures
              persist long enough, and at large enough scale, to make HIF’s export projects bankable on attractive
              terms.
