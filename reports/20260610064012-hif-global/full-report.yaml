          value: Infinium/Twelve > $645M plus project finance
          detail: Leading peers pair sponsor capital with financeable demand structures.
          tone: positive
        - label: Public comp stress signal
          value: LanzaTech ~0.47x sales
          detail: Public markets can de-rate climate-fuels platforms hard under financing pressure.
          tone: risk
