      - number: '7.3'
        title: Policy, permitting, and community/environment risk
        blocks:
          - type: paragraph
            body: >-
              HIF’s public pipeline is spread across jurisdictions where each site still has meaningful approval work
              left. Paysandú is the clearest example. HIF and independent coverage both say the project has only cleared
              environmental location feasibility so far; the company still must complete Prior Environmental
              Authorization and a High Complexity EIA that explicitly covers water, ecosystems, air, waste, noise,
              odors, soil, landscape, and social or cultural impacts. HIF’s March 2026 filing says the process still
              includes citizen participation and a public hearing. The redesign of the plant footprint and ecological
              buffer is a positive sign that management is adapting, but it also proves that environmental and
              territorial integration already matters enough to reshape the asset before final approval.


              Tasmania carries a different but related risk profile. The EPA materials show the Burnie proposal remains
              under assessment, still needs council permitting, and has major-hazard, water, dangerous-goods,
              biodiversity, and fire-risk workstreams. Texas is further advanced, but even the permit press release
              frames the air authorization as only one milestone before financing and contracting. Over the top of those
              site-specific processes sits the European market rulebook. RFNBO compliance is not a branding label; it
              requires additionality and temporal or geographic correlation, and the Commission says those rules apply
              to exporters too. That creates a non-trivial policy risk: HIF can build plants, yet still struggle to
              monetize product at premium low-carbon economics if its power-sourcing, certification, or
              lifecycle-accounting setup falls short of evolving import rules.
            claimRefs:
              - CR017
              - CR018
              - CR020
              - CR021
