      - number: '3.2'
        title: Where Synhelion, Norsk e-Fuel, and Infinium pressure HIF most directly
        blocks:
          - type: paragraph
            body: >-
              Each direct peer pressures HIF for a different reason. Synhelion has the most aggressive theoretical cost
              and process story: it says DAWN has been operational since 2024, that its process can reach below EUR
              1,000 per ton, and that it avoids hydrogen as an intermediate while using around three times less
              electricity than conventional e-fuels pathways. Norsk e-Fuel is narrower but commercially clearer: its
              public materials center on aviation, Mosjøen, and airline-linked industrialization rather than on HIF's
              broader road-plus-maritime narrative. Infinium is the strongest public proof that HIF is not alone in
              turning e-fuels into financeable infrastructure. American Airlines, Amazon, IAG-linked supply,
              Breakthrough, Brookfield, and Electric Hydrogen all show up in public materials around Project Roadrunner.
              HIF still differentiates through Haru Oni plus Porsche and a broader methanol-led product set, but these
              rivals can look better aligned with specific airline, logistics, or capital-light underwriting stories.
