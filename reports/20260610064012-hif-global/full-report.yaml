  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, enabling technology suppliers, and adjacent fuel routes
        blocks:
          - type: paragraph
            body: >-
              HIF should not be benchmarked against only one kind of rival. The direct developer set includes Synhelion,
              Norsk e-Fuel, and Infinium, each of which wants to convert renewable inputs and captured carbon into
              finished synthetic fuels. But buyers can also solve the same job through a technology layer. Sunfire and
              Topsoe do not sell a HIF-like branded fuel platform, yet they can help competing developers close the
              cost, efficiency, or bankability gap by supplying electrolysis and process know-how. A third class matters
              because HIF is methanol-led: Liquid Wind, CRI, and INERATEC target renewable methanol or modular
              Power-to-X pathways that can win where customers want replication, licensing, or lower-capital deployment.
              HIF's public product surface and Porsche-linked Haru Oni proof are distinctive, but they also mean HIF is
              competing simultaneously against aviation-pure-play, shipping-pure-play, and capital-light technology
              models rather than against one neat peer list.
