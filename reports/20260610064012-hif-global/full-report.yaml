  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and end-market scope
        blocks:
          - type: paragraph
            body: >-
              HIF Global's market boundary should be set at hydrogen-derived liquid e-fuels for hard-to-abate transport,
              not at the entire hydrogen economy or all clean-energy spending. HIF's own product surface is explicit:
              today it markets e-methanol for maritime use, e-gasoline for existing combustion fleets, and a future
              e-SAF offering based on methanol-to-jet conversion. Its disclosed project pipeline is also molecule-first
              rather than software-like or equipment-vendor-like. Matagorda, Paysandú, and Tasmania are all framed
              around e-methanol production with downstream optionality into aviation or road fuels, while Haru Oni
              serves mainly as operational proof that the synthesis stack works. That means included spend is renewable
              methanol, renewable jet-fuel feedstock, RFNBO-compliant synthetic fuels, certification-linked compliance
              value, and project-backed offtake volumes. Excluded spend is broad renewable-power deployment, generic
              hydrogen infrastructure, most fossil methanol, and the much larger electrification market. The practical
              implication is that HIF should be benchmarked against power-to-liquid and hydrogen-derivative demand
              formation in transport, especially marine fuel and aviation decarbonization, rather than against a
              catch-all multi-trillion-dollar hydrogen TAM.
