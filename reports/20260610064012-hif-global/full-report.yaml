  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              HIF is not easy to score because the public record offers strategic proof but poor company-level price
              discovery. CB Insights gives a $600M April 2022 valuation marker and $424M total raised, while HIF's own
              2022 and 2024 releases imply roughly $460M of disclosed equity and still no new round price. A low-quality
              GetLatka profile then reports HIF as a bootstrapped SaaS company with $0 outside funding and a $247.5M
              valuation, which is useful only as evidence that public startup databases are noisy, not as an investable
              denominator. Strategic names such as Porsche, EIG, Baker Hughes, Idemitsu, and JOGMEC-linked capital make
              HIF more than a lab story, but they do not reveal the current cap table, preference stack, or
              project-finance economics. The correct public-evidence call is research-more, not buy or avoid. Investors
              can justify staying engaged because strategic optionality is real; they cannot justify treating HIF as a
              cleanly priced unicorn from public evidence alone.
            claimRefs:
