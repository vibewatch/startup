  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: End-to-End Chain and Haru Oni Proof
        blocks:
          - type: paragraph
            body: >-
              HIF's technical story is most credible when it is told as a physical chain that already runs at Haru Oni,
              not as a purely aspirational climate narrative. The pilot plant in southern Chile takes renewable wind
              power, uses electrolysis to make green hydrogen, then combines that hydrogen with carbon dioxide to
              produce e-fuels. The plant disclosure is unusually concrete for a startup-scale energy developer: HIF
              names the 3.4 MW wind turbine, the 1.2 MW Silyzer 200 electrolyzer, the methanol-to-gasoline step, the
              130,000-litre annual e-gasoline output, and even a laboratory performing roughly 100 analyses per day.
              Independent partner material from Hydrogen Council and other coverage corroborates that Haru Oni is a real
              integrated power-to-X chain rather than a concept rendering.


              The right technical read, however, is that Haru Oni proves integration, not world-scale economics. HIF and
              partner materials show the plant can make methanol and upgrade part of that stream to gasoline, and HIF
              says it has already exported product to Porsche-linked events. That is meaningful operational evidence. It
              does not prove high uptime, low-cost production, or commercial-scale repeatability. The pilot is still a
              learning asset whose biggest value is showing that HIF can connect renewable power, electrolysis, carbon
              feedstock, synthesis, quality control, and downstream delivery in one site.
            claimRefs:
