  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call improves on sponsor quality and strategic optionality, but stops at the missing-price and
      missing-contract tests.
    data:
      nodes:
        - id: A
          label: 'Last public marker: $600M'
          detail: CB Insights shows an April 2022 valuation marker, not a current 2026 price.
          tone: neutral
        - id: B
          label: Strategic capital is real
          detail: Porsche, EIG, Baker Hughes, Idemitsu, and JOGMEC-linked capital support platform optionality.
          tone: positive
        - id: C
          label: Contract stack still soft
          detail: LOIs, HoAs, and lighthouse supply dominate the public pack.
          tone: risk
        - id: D
          label: Peers reward conversion
          detail: Infinium and Twelve show financeable stacks plus long-duration demand, not only marquee names.
          tone: neutral
        - id: E
          label: Public downside is real
          detail: LanzaTech shows how hard public markets can punish climate-fuels financing pressure.
          tone: risk
        - id: F
          label: research-more / unknown
          detail: Stay engaged, but do not claim a precise current fair value from public evidence alone.
          tone: risk
      edges:
        - from: A
          to: B
          label: sets context for
        - from: B
          to: C
          label: still discounted by
        - from: C
          to: D
          label: benchmarked against
        - from: D
          to: E
          label: tempered by
        - from: E
          to: F
          label: therefore
    claimRefs:
