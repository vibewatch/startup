      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The right market frame is methanol-led and policy-mediated
            body: >-
              HIF should not be valued off the whole hydrogen market. The stronger public evidence is a narrower wedge:
              synthetic liquid fuels sold into regulated or premium hard-to-abate transport uses, with e-methanol as the
              current commercial anchor and aviation as a conversion-led upside.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM025
              - CM042
              - CM043
          - type: callout
            title: Cost parity is still a distant event
            body: >-
              The adverse evidence is consistent across aviation and methanol pathways: current synthetic-fuel volumes
              are tiny, policy support is doing much of the demand-formation work, and independent cost work still shows
              e-fuels above fossil parity well into the future. That is the core market risk behind HIF’s project
              pipeline.
            calloutType: risk
            claimRefs:
