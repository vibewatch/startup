    title: Valuation / return range
    type: range
    layout: standard
    summary: The only defensible public bands are broad thresholds anchored to the last public marker and the unicorn line.
    approximationNotes: >-
      Bands are underwriting thresholds derived from public markers and milestone logic, not observed 2026 funding
      prices.
    data:
      items:
        - label: Bear underwriting band
          low: 0.3
          mid: 0.45
          high: 0.6
          displayValue: <$0.6B
          detail: Commercial conversion stays soft and financing stress appears.
          tone: risk
        - label: Base underwriting band
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B to <$1.0B
          detail: Strategic support remains real, but public price discovery and economics are still incomplete.
          tone: neutral
        - label: Bull underwriting band
          low: 1
          mid: 1.25
          high: 1.6
          displayValue: '>$1.0B'
          detail: Requires definitive offtakes, project finance, and real conversion of strategic optionality.
          tone: positive
        - label: Last public reference point
          low: 0.6
          mid: 0.6
          high: 0.6
          displayValue: $0.6B
          detail: April 2022 public valuation marker.
          tone: neutral
