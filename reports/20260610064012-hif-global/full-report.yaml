      - number: '1.4'
        title: Milestones, commercialization signals, and caution flags
        blocks:
          - type: paragraph
            body: >-
              The strongest milestone evidence is operational rather than aspirational. Haru Oni was ceremonially opened
              in December 2022 after producing the first liters of synthetic fuel, and Porsche states the pilot can
              produce up to 130,000 liters of fuel per year while HIF and partners describe first-stage output of 350
              tonnes of e-methanol and 130,000 liters of e-gasoline. By 2024 and 2025 HIF was no longer talking only
              about pilot symbolism: the company said Haru Oni had been producing for more than 18 months, had completed
              several e-gasoline exports to Porsche, and had become the first facility outside the EU to win ISCC EU
              RFNBO certification for e-gasoline production. Commercialization signals broadened in 2025 and 2026
              through the Uruguay environmental-location approval, the Antarctica21 alliance renewal, and the eFuel One
              heads of agreement for roughly 100,000 tonnes per year of e-methanol. The caution flags are equally
              important. Forbes portrays the Matagorda buildout as a multi-billion-dollar logistics and financing
              challenge, reporting early cost expectations around USD 5 per gallon and policy-sensitive economics, while
              HIF's own forward-looking statements repeatedly warn that permits, financing, customer demand, and
              regulatory changes can materially alter project timing. The net view is that HIF has moved past
              concept-stage storytelling, but its value still depends on executing extremely capital-intensive projects
              under evolving policy and infrastructure conditions.
