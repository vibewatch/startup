        title: Revenue model and commercial proof points
        blocks:
          - type: paragraph
            body: >-
              HIF Global’s public revenue logic is straightforward in concept and still immature in disclosure. The
              company is trying to monetize synthetic molecules, first through pilot e-gasoline use cases and then
              through commercial e-methanol offtakes that can scale into shipping and other regulated markets. Haru Oni
              supplies the current proof. HIF says the pilot produces both e-methanol and e-gasoline, has already
              exported fuel to Porsche, and in 2025 was delivering e-gasoline to Shell’s technology center in Hamburg
              for Porsche lighthouse uses. Porsche separately disclosed that its Mobil 1 Supercup would consume roughly
              50,000 liters of Haru Oni-derived e-fuel across the 2024 season, while HIF’s sustainability report says
              the first commercial shipment in 2023 totaled 24,600 liters. Those facts matter because they show molecule
              movement, customer use, and compliance work. They do not, however, show revenue quality. The most visible
              forward commercial markers are still frameworks rather than closed economics: the eFuel One heads of
              agreement covers about 100,000 tons per year of e-methanol and the Idemitsu LOI plus Mabanaft reference
              point to Matagorda demand formation, but none of the retained public sources disclose fixed price,
              contract tenor, take-or-pay terms, or realized contribution margin.
