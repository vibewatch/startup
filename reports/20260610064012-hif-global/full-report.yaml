      - number: '1.3'
        title: Capital formation, ownership, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              HIF's capital story is unusually strategic for a private climate company. In April 2022 the company
              announced roughly USD 260 million of equity investment from AME, Porsche, EIG, Baker Hughes, and Gemstone,
              with AME remaining the majority shareholder and Porsche plus EIG taking formal board seats. Porsche
              separately disclosed a USD 75 million investment and later said its total e-fuels commitment exceeded USD
              100 million, underscoring that the automotive OEM is both capital provider and lead lighthouse customer.
              The next leg came in 2024, when Idemitsu invested USD 114 million inside a USD 164 million combined raise
              and JOGMEC followed with a USD 36 million equity investment via Idemitsu Efuels America, bringing
              disclosed 2024 year-to-date funding to USD 200 million. That mix matters because it is not generic venture
              capital: it combines a Chilean controlling shareholder, a strategic OEM, a global energy-infrastructure
              investor, Japanese fuel-market partners, and industrial suppliers. The financing base therefore supports
              project development credibility, but the public record still does not expose a clean post-money valuation,
              current share ownership percentages beyond the 2022 AME majority statement, or downside protections
              embedded in later rounds.
