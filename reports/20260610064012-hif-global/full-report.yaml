chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              HIF Global should be framed as a multinational e-fuels developer and operator, not as a single-site
              Chilean pilot alone. The company describes itself as developing large-scale infrastructure that recycles
              carbon dioxide and produces hydrogen-based fuels for existing cars, ships, and planes, and its public site
              shows a footprint spanning Santiago, Punta Arenas, Houston, Sydney, and Berlin. The operating proof point
              is Haru Oni in the Magallanes region of southern Chile, which HIF now calls the first operational e-fuels
              facility of its kind and a model for later commercial plants. HIF also discloses a pipeline of advanced
              projects in Uruguay, Chile, Brazil, the United States, and Australia, with project pages giving specific
              e-methanol, electrolyzer, and job numbers. That combination makes HIF unusual versus many climate
              startups: it already has a producing pilot, while its next wave is built around infrastructure-scale
              synthetic-fuel projects measured in hundreds of thousands to millions of tonnes rather than software-style
              incremental deployments.
