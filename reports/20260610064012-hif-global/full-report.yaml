      - number: '2.2'
        title: Sizing lenses and disclosed capacity
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is available only through multiple lenses, and that is the right way to treat HIF's
              opportunity. The macro lens is transport decarbonization: IEA says renewable energy use in transport
              should rise 50% by 2030, with aviation and maritime fuels contributing about a tenth of the incremental
              growth. The long-run derivatives lens is larger still: IRENA and the WTO argue renewable hydrogen and
              derivatives such as methanol and e-kerosene could account for up to 14% of final energy consumption by
              2050. The aviation lens is more immediate but also more constrained. ICAO and IATA both put SAF at the
              center of aviation decarbonization, yet EASA says SAF supplied only 0.53% of jet fuel in 2024 and IATA
              expects only 0.7% in 2025. HIF's own disclosed project scales sit between those broad policy wedges and
              actual current supply. Matagorda is advertised at 1.4 million tonnes per year of e-methanol, Tasmania at
              210,000 tonnes, and Paysandú between 700,000 and 876,000 tonnes depending on which HIF page is used. Those
              project numbers are meaningful evidence of addressable segment size, but they do not reveal HIF's SAM,
              contracted share, or realized pricing. The right takeaway is a constrained sizing stack: large long-term
              decarbonization demand, tiny current physical supply, and a still-undisclosed company-specific capture
              rate.
