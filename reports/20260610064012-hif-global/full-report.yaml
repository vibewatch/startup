        - Import auction design and market-transparency tools are being built for hydrogen derivatives
        - Can subsidize market formation for export projects
        - Can HIF bid directly or through customers into auction-linked structures?
      - - Chile and Germany hydrogen policy
        - Driver
        - Current decade
        - Chile focuses on value-chain enablement; Germany on domestic build plus imports
        - Supports both supply-side and demand-side policy fit
        - Which jurisdictions offer the strongest long-term policy durability for HIF molecules?
      - - Current SAF scarcity
        - Driver and constraint
        - 2024-2026
        - SAF supply remains under 1% of jet fuel despite ambitious roadmaps
        - Scarcity supports premiums but signals scaling difficulty
        - How quickly can HIF move from pilot proof to bankable contracted volumes?
      - - E-fuel cost gap versus fossil fuels
        - Constraint
        - Current through 2040s
        - ICCT and IRENA show synthetic fuels remain expensive without support
        - Valuation should not assume stand-alone commodity competitiveness soon
        - What subsidy, carbon-price, or premium assumptions sit behind each project model?
      - - Certification and accounting complexity
        - Constraint
        - Current
        - CORSIA, RFNBO, ASTM-style and book-and-claim systems shape monetization
        - Molecule value depends on pathway qualification, not just production
        - Which certifications and chain-of-custody pathways are already secured or planned by project?
