companyProfile:
  summary: >-
    HIF Global is a Chilean-rooted, Houston-linked e-fuels developer using renewable power, hydrogen, and recycled CO2
    to produce e-methanol, e-gasoline, and future e-SAF for hard-to-abate transport. The company already operates the
    Haru Oni pilot in southern Chile, has strategic backing from AME, Porsche, EIG, Baker Hughes, Idemitsu, and
    JOGMEC-linked capital, and is advancing large projects in Texas, Uruguay, Australia, Brazil, and Chile. Public
    evidence supports a real platform with meaningful strategic optionality, but it still leaves current valuation,
    company-level financial performance, and bankable long-term contract depth unresolved.
