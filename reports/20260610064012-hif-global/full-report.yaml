      - number: '6.4'
        title: Durability Gaps and Demand Caution
        blocks:
          - type: paragraph
            body: >-
              The missing layer is durability math. None of the public materials reviewed here disclose HIF's customer
              count, top-customer revenue share, NRR, GRR, churn, renewal cadence, or take-or-pay commitments. That
              means the chapter can verify that demand exists in selected lighthouse niches, but it cannot verify how
              much of HIF's future business is already underwritten versus still dependent on policy support, project
              finance, and partner negotiations. The absence of disclosed contract economics is especially important
              because HIF's most visible proof points are precisely the ones most compatible with high-brand-value,
              low-volume demonstration activity.


              The adverse record reinforces that caution. Forbes said Porsche planned to get "maximum publicity per
              gallon" by first using eFuel in racing teams and quoted CSIS saying the economics were "wildly
              speculative" pending Treasury guidance. SAE Media later cited a U.S. eFuel price around USD 31 per gallon
              and argued that pilot-plant output volumes like HIF's remain too small to bring costs down materially.
              Those sources do not disprove HIF's commercialization path; they do show why the current stack should be
              read as proof of compatibility and channel formation rather than proof of broad recurring demand. On
              today's evidence, HIF has a credible lighthouse-to-channel narrative, but not yet a public data package
              that lets an investor underwrite customer diversification or bankable long-term offtake economics.
