      - number: '2.4'
        title: Drivers, constraints, and valuation implications
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers for HIF are not generic clean-tech enthusiasm but concrete policy and
              certification scaffolding. ReFuelEU-style SAF demand, Hydrogen Bank import mechanisms, Chile's hydrogen
              action plan, Germany's import orientation, and ICAO/IATA SAF frameworks all help create willingness to pay
              for synthetic molecules before they are cost-competitive on a pure commodity basis. But the constraints
              are just as concrete. IATA says Europe’s 2025 SAF mandates have made SAF five times more expensive than
              conventional jet fuel, and ICCT's e-kerosene work shows synthetic jet fuel still does not beat fossil
              kerosene on cost before 2050 even under optimistic assumptions. IRENA makes the same point for renewable
              methanol: costs remain high and volumes low today, even if policy could close the gap later. That means
              valuation should lean on project execution, certification, financing support, and credible offtake
              sequencing rather than broad decarbonization narratives alone. HIF has genuine strategic optionality
              because methanol can serve shipping directly and aviation indirectly through MTJ, but that optionality is
              only valuable if subsidy regimes, import auctions, and customer contracts persist long enough to bridge
              the cost gap.
