  topStrengths:
    - >-
      Haru Oni gives HIF rare real-world operating proof, export activity, and RFNBO certification rather than a pure
      slideware story.
    - >-
      Strategic backing from Porsche, EIG, AME, Baker Hughes, Idemitsu, and JOGMEC improves credibility with industrial,
      policy, and financing counterparties.
    - >-
      The methanol-led platform can serve shipping directly while preserving optionality into e-gasoline and e-SAF for
      premium legacy-fuel markets.
    - >-
      The project pipeline spans multiple jurisdictions and routes to market rather than relying on a single country or
      one end-use segment.
  topRisks:
    - >-
      The value bridge from a tiny Chilean pilot to multi-billion-dollar commercial plants is still unproven in public
      evidence.
    - >-
      Public demand proof remains dominated by lighthouse uses, HoAs, and LOIs rather than diversified
      project-finance-grade take-or-pay contracts.
    - >-
      Company-level disclosure on revenue, margins, cash burn, cap table, current valuation, and headcount is too thin
      for precise underwriting.
    - >-
      E-fuels remain expensive and policy-dependent versus EVs, direct electrification, and lower-cost decarbonization
      pathways.
  unresolvedGaps:
    - Current post-money valuation, cap table, preference stack, and any 2024-2026 priced round terms.
    - Audited revenue, gross margin, burn, cash runway, and project-finance package details.
    - >-
      Binding volume, pricing, penalty, and credit-support terms for Porsche, Idemitsu, MB Energy, and German eFuel One
      pathways.
    - Final permitting, FID, construction, and startup timeline confidence for Matagorda, Paysandú, and Tasmania.
