  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-price
      missingEvidence: The priced terms, share count impact, and preference structure of HIF’s 2024 financings and any later secondary or primary transactions.
      whyItMatters: Public sources show fresh capital but not a current post-money valuation, so precise price discipline is impossible.
      diligencePath: Request the latest cap table, round term sheets, board approvals, and any third-party fairness materials.
      relatedQuestionRefs:
        - QV001
        - QV002
        - QV032
    - type: private-evidence-only
      severity: material
      topic: financial-denominator
      missingEvidence: A company-level revenue, gross margin, cash, burn, and runway bridge that separates pilot operations from project-development cash use.
      whyItMatters: Without a real denominator, public revenue multiples and exit readiness calls are too speculative.
      diligencePath: Obtain CFO-prepared monthly reporting, audited statements if available, and a bridge from company revenue to project-level economics.
      relatedQuestionRefs:
        - QV008
        - QV029
        - QV032
    - type: private-evidence-only
      severity: material
      topic: project-finance
      missingEvidence: Project-level financing plans, debt and tax structures, sponsor commitments, and conditions precedent for Matagorda and Paysandú.
      whyItMatters: The valuation hinges on whether multi-billion-dollar assets can be financed without wiping out current equity economics.
      diligencePath: Request lender decks, financing workstreams, grant and tax-credit assumptions, and the minimum contract package required for FID.
      relatedQuestionRefs:
        - QV007
        - QV026
        - QV030
        - QV032
    - type: private-evidence-only
      severity: material
      topic: contract-quality
      missingEvidence: Executed offtake agreements with pricing, volume ramps, credit support, and termination clauses.
      whyItMatters: HoAs, LOIs, and lighthouse agreements are strategically useful but do not support a premium company valuation on their own.
      diligencePath: Review commercial data room contracts and compare them against project-finance underwriting requirements.
      relatedQuestionRefs:
        - QV011
        - QV012
        - QV013
        - QV031
        - QV032
    - type: conflicting-data
      severity: minor
      topic: public-database-noise
      missingEvidence: A reconciled external data-room summary explaining why public data vendors disagree on HIF valuation, funding, and revenue.
      whyItMatters: Database disagreement does not block the chapter, but it raises the risk of false precision in external valuation memos.
      diligencePath: Reconcile public data vendors against the company cap table and remove unusable third-party estimates from investor materials.
      relatedQuestionRefs:
        - QV003
        - QV004
