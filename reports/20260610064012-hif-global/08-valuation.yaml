  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Rescue or down-round financing
        - New capital comes with visibly punitive dilution, structured rescue terms, or a price below the last public marker.
        - Strategic optionality stops covering financing risk and the valuation floor falls quickly.
        - Re-cut the case below the base band or walk.
      - - Contract conversion failure
        - German eFuel One, Idemitsu, or similar framework documents do not convert into definitive contracts.
        - The route-to-market story remains narrative-heavy rather than bankable.
        - Apply a larger discount to strategic value and avoid paying for optionality.
      - - Project-finance slippage
        - No credible project-level financing path emerges despite ongoing permitting and sponsor rhetoric.
        - Company value becomes hostage to repeated equity raises instead of asset-level de-risking.
        - Treat the company as capital-dependent development inventory, not as a clearing platform.
      - - Policy / cost deterioration
        - Supportive rules weaken or cost curves fail to improve enough to sustain qualifying offtake economics.
        - The addressable premium market contracts before utilization appears.
        - Lower the band and focus only on niche-value cases.
      - - Premature public-market attempt
        - Management pursues a public-market or exit narrative before a large asset is financeable or operating.
        - The company would meet public scrutiny without the proof set peers needed.
        - Assume valuation compression rather than expansion.
    notes: >-
      These are valuation breakers, not generic operating risks; each one can
      directly invalidate the price someone is willing to pay today.
    claimRefs:
      - CV015
      - CV016
      - CV021
      - CV035
      - CV041
      - CV044
      - CV046
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current valuation and terms
        - The priced terms of the 2024 capital raises, current share count, preferences, and any side letters.
        - Without those files, no one can convert strategic headlines into true entry economics.
        - Board materials, financing counsel, and the most recent cap-table export.
      - - Company financial bridge
        - Revenue, gross margin, operating cash flow, burn, cash runway, and project-level vs company-level cash separation.
        - Public sources do not support a revenue multiple or a public-market readiness call.
        - CFO package and audited or board-approved financial bridge.
      - - Project finance roadmap
        - Debt, tax, grant, or structured-capital stack by project, including conditions precedent and sponsor commitments.
        - The company-level valuation depends on whether multi-billion-dollar plants can actually be financed.
        - Finance team, lender presentations, and project-finance term sheets.
      - - Definitive offtake quality
        - Executed contracts, pricing logic, volume ramps, credit support, and termination clauses.
        - HoAs and LOIs are strategically useful but not equivalent to bankable demand.
        - Commercial team contract room and counterparty credit review.
      - - Strategic-partner economics
        - Exact economics of Porsche, Idemitsu, JOGMEC-linked, Baker Hughes, and any Japanese market-development arrangements.
        - Strategic names can create value, but they can also mask weak company-level economics.
        - Side-letter and governance-rights review.
      - - Exit readiness
        - Evidence that at least one large plant can move from development optics to financeable construction and eventual utilization.
        - A public-market or strategic-exit story is fragile without that proof set.
        - Project execution tracker, EPC status, financing close path, and first-revenue timing.
    notes: >-
      These are the minimum files needed to move HIF from strategically
      interesting to underwriteable at a specific price.
    claimRefs:
      - CV011
      - CV021
      - CV024
      - CV044
      - CV048
      - CV050
