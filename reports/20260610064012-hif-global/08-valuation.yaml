  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - HIF Global (subject)
        - Current public price discovery
        - No retained 2026 post-money disclosed; last public marker is $600M in April 2022; company-disclosed equity since 2022 totals about $460M
        - Direct anchor for price discipline and uncertainty framing.
        - Current round price, cap table, and reliable revenue denominator remain undisclosed.
      - - Infinium
        - Platform and project financing
        - Up to $1.1B Brookfield commitment plus HSBC project financing; airline offtakes disclosed
        - Best peer for what a more financeable e-fuels stack can look like.
        - Public materials emphasize capital stack and project maturity more than company-level valuation.
      - - Twelve
        - Blended equity, debt, and offtake support
        - $645M mixed financing, later $83M follow-on, and 14-year 260M gallon SAF agreement
        - Strongest proof that investors and customers can back climate-fuels scale simultaneously.
        - Aviation-first SAF path differs from HIF’s methanol-led platform and geography mix.
      - - Sunfire
        - Hydrogen infrastructure funding
        - '>€500M combined equity, EIB debt, and grant support'
        - Useful upper-end capital-intensity read-through for hydrogen infrastructure and industrial credibility.
        - Electrolyzer manufacturing is not the same business model as HIF’s project-development stack.
      - - Synhelion
        - Earlier-stage solar-fuels funding
        - CHF22M financing round plus later strategic-investor support
        - Shows the smaller-capital end of the synthetic-fuels peer set.
        - Still much earlier and smaller than HIF on disclosed financing scale.
      - - LanzaTech
        - Public market comp
        - Yahoo showed ~$86.6M market cap, ~$94.0M EV, ~$58.4M TTM revenue, and ~0.47x sales on 2026-06-09; 10-K disclosed going-concern doubt
        - Best public reminder that climate-fuels and carbon-conversion stories can de-rate hard under financing pressure.
        - Different technology and business mix, with more operating history than HIF.
    notes: >-
      This table exhaustively covers the valuation set used in this chapter:
      one direct HIF marker, four private-capital comparables, and one
      public-market downside comp.
    enumerationScope:
