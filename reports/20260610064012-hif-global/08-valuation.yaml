  - id: financing-context-and-strategic-optionality
    title: Financing context and strategic optionality
    body: >-
      The financing story is real but still strategic and project-led. HIF
      raised $260M in 2022 with AME retaining control, then announced $164M
      from Idemitsu plus existing holders and another $36M via JOGMEC-linked
      capital in 2024, taking company-disclosed 2022-2024 equity to about
      $460M. Those same releases explain why the money matters beyond cash.
      Idemitsu linked capital, purchase plans, Japanese market development, and
      CO2 supply-chain work; JOGMEC framed e-fuels as part of Japanese
      industrial policy; and Porsche plus Shell keep Haru Oni visible with
      lighthouse use. But the contract layer remains softer than the names
      suggest. German eFuel One is still an HoA, Idemitsu's Texas document is
      still an LOI, and Porsche and Shell still sit in a demonstration-oriented
      context rather than a disclosed long-term take-or-pay structure for a
      multi-billion-dollar asset. Strategic value deserves credit, yet a
      discount remains necessary until strategic relationships become
      financeable contracts.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
      - CV015
