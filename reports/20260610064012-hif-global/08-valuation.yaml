  - id: comparable-bounds-and-scenario-bands
    title: Comparable bounds and scenario bands
    body: >-
      Public comparables argue for caution, not precision. The best
      private-sector analogs are capital-stack examples rather than clean
      valuation comps. Infinium shows what a more financeable pattern looks
      like: Brookfield up to $1.1B, HSBC project financing, and airline
      offtakes. Twelve shows a similar mix: $645M of blended financing, a later
      $83M follow-on, and a 14-year 260 million gallon SAF agreement. Sunfire
      shows that capital can gather around hydrogen infrastructure at scale,
      while Synhelion remains a smaller early-stage solar-fuels reference. The
      adverse public comp is LanzaTech: a listed carbon-conversion platform with
      real plants and technology credibility that still disclosed going-concern
      doubt, raised emergency-style capital, and traded around 0.5x sales. That
      combination says HIF can argue strategic scarcity, but not ignore
      capital-market downside. The usable public underwriting bands are
      therefore broad: below the last $600M marker if commercialization stalls,
      roughly $600M to below $1B if strategic support holds without clean price
      discovery, and above $1B only if optionality converts into definitive
      contracts and project-level financing.
    claimRefs:
