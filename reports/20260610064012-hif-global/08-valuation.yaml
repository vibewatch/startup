  - id: exit-readiness-thesis-breaks-and-diligence
    title: Exit readiness, thesis-breaks, and final diligence asks
    body: >-
      HIF is not IPO-ready on public evidence. The retained pack still lacks a
      current disclosed post-money valuation, a reliable revenue bridge, burn
      and cash disclosure, the current cap table, and project-finance
      documentation. Category research says e-fuels remain expensive,
      policy-dependent, and still nascent inside the broader clean-fuels mix, so
      public markets would likely demand clearer contract conversion and
      utilization visibility than HIF has disclosed. That makes the most
      plausible near-term path additional strategic or project capital, not a
      clean public multiple. Investors should watch three valuation breakers
      first: a down-round or rescue financing; failure to turn HoAs and LOIs
      into definitive offtakes; and evidence that cost or policy conditions are
      worsening rather than improving. Before assigning any bullish mark,
      diligence should secure the 2024 round terms, the current cap table,
      definitive offtake contracts, the project-finance roadmap, and a real
      company-level revenue and cash bridge.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
      - CV050
    tableRefs:
      - TV005
      - TV006
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Keep HIF live, but do not underwrite a clean 2026 price from public evidence alone.
      - - Confidence
        - medium
        - Strategic value is real, but the current company-level denominator remains underdisclosed.
      - - Risk rating
        - high
        - Capital intensity, policy dependence, and contract-conversion risk can all hit value before cash generation appears.
      - - Valuation stance
        - unknown
        - The public pack supports broad underwriting bands, not a precise current fair value.
      - - Entry discipline
        - milestone- or structure-driven only
        - Any new money should demand either better price discovery, downside protection, or milestone conversion.
      - - What would improve the call
        - priced financing plus definitive contracts
        - A disclosed new price, cap table, project-finance path, and bankable offtake would move the call faster than another pilot anecdote.
    notes: >-
      This table scores the investability of the current public-evidence
      picture, not the quality of HIF’s industrial ambition.
    claimRefs:
      - CV011
      - CV012
      - CV045
      - CV050
      - CV049
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Thesis
      - What would change the view
    rows:
      - - Strategic sponsor quality
        - Porsche, EIG, Baker Hughes, Idemitsu, and JOGMEC-linked capital give HIF unusual strategic depth for a private e-fuels company.
        - A current priced round with disclosed terms would prove whether strategic names still support today’s valuation, not only the story.
      - - Route-to-market optionality
        - OEM and Japanese links create real optionality around fuel adoption, market access, and policy leverage.
        - Optionality deserves less discount once HoAs and LOIs become definitive contracts with disclosed credit quality.
      - - Demand quality
        - Haru Oni shipments and lighthouse use show molecules can move and be used in real engines.
        - A long-term take-or-pay contract for a commercial project would matter far more than another demonstration-use headline.
      - - Capital adequacy
        - The company has raised real money and kept attracting strategic capital through 2024.
        - The view improves only if project capital closes at the same time as customer conversion, rather than after another equity bridge.
      - - Peer read-through
        - Infinium and Twelve show that climate-fuels leaders can raise very large mixed capital stacks when contracts and projects mature.
        - If HIF cannot match even part of that financing pattern, its strategic premium should compress.
      - - Public-market downside
        - LanzaTech proves that a carbon-platform narrative can still trade at distressed levels once financing risk dominates.
        - HIF needs stronger private evidence before assuming public markets will pay for optionality alone.
    notes: >-
      The anti-thesis is mostly about missing denominator proof and financing
      conversion, not about whether e-fuels can be chemically produced.
    claimRefs:
