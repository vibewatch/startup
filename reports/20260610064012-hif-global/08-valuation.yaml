  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Illustrative underwriting band
      - Probability signal
      - Why the band moves
    rows:
      - - Bull
        - HIF converts strategic relationships into definitive offtakes, closes project finance, and shows at least one large asset moving credibly toward construction and utilization.
        - '>$1.0B'
        - Low
        - The company could finally earn a scarcity premium above the unicorn threshold, but only after real conversion of optionality into bankable economics.
      - - Base
        - Strategic support holds, permitting and development continue, but the public record still lacks a current priced round, revenue bridge, or fully definitive contract stack.
        - $0.6B to <$1.0B
        - Medium
        - This band gives credit to the last public $600M marker and to strategic value, while still discounting opaque economics and unfinished commercialization.
      - - Bear
        - HOAs and LOIs stay soft, policy or cost support weakens, or the next financing arrives with rescue-like economics or visible dilution stress.
        - <$0.6B
        - Material
        - Without bankable conversion, HIF could fall below the last public valuation marker despite marquee relationships.
    notes: >-
      These are underwriting bands anchored to public valuation markers and
      milestone thresholds, not observed 2026 transaction prices.
    claimRefs:
