- id: leadership-and-governance
  title: Leadership, board structure, and governance visibility
  body: 'Public governance visibility is good enough to identify the current leadership bench, but not good enough to underwrite full control dynamics. HIF''s about page names Cesar Norton as President and Chief Executive Officer and lists a broad executive team that includes Clara Bowman, Roberto Simon, Diego Fettweis, regional CEOs, and other functional chiefs. The same page also names a board that includes Norton, Alberto Araya, Bowman, Juan José Gana, Meg Gentle, Porsche executive Michael Steiner, EIG chairman Blair Thomas, and Junzo Yamamoto, indicating that strategic investors and Japanese stakeholders now sit close to the core decision structure. External corroboration is strongest for Gentle, whose Baker Hughes biography describes her as an Executive Director of HIF Global developing multi-billion-dollar decarbonization projects, and for the 2022 financing round, which formally added Steiner and Thomas to the board. What remains thin is the deeper governance picture: public materials
    reviewed do not lay out committee structure, independent-director representation, shareholder veto rights, or the precise governance mechanics among AME, Porsche, EIG, Idemitsu, and JOGMEC-linked interests.'
