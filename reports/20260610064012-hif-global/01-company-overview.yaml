company:
  name: HIF Global
chapter:
  number: 1
  title: Company Overview
  summary: HIF Global is an e-fuels developer with an operating Haru Oni pilot in southern Chile, a multi-continent commercial project pipeline, and strategic backers that include Porsche, EIG, Idemitsu, JOGMEC, Baker Hughes, and AME. Public evidence is strongest on project scale, strategic partnerships, and financing milestones, but much weaker on precise founding lineage, current headcount, revenue, and valuation. The company therefore screens as a real late-stage project developer with credible industrial traction, but one whose disclosure remains selective on company-level operating metrics and governance detail.
sections:
- id: identity-footprint-and-product
  title: Identity, footprint, and product scope
  body: 'HIF Global should be framed as a multinational e-fuels developer and operator, not as a single-site Chilean pilot alone. The company describes itself as developing large-scale infrastructure that recycles carbon dioxide and produces hydrogen-based fuels for existing cars, ships, and planes, and its public site shows a footprint spanning Santiago, Punta Arenas, Houston, Sydney, and Berlin. The operating proof point is Haru Oni in the Magallanes region of southern Chile, which HIF now calls the first operational e-fuels facility of its kind and a model for later commercial plants. HIF also discloses a pipeline of advanced projects in Uruguay, Chile, Brazil, the United States, and Australia, with project pages giving specific e-methanol, electrolyzer, and job numbers. That combination makes HIF unusual versus many climate startups: it already has a producing pilot, while its next wave is built around infrastructure-scale synthetic-fuel projects measured in hundreds of thousands to
    millions of tonnes rather than software-style incremental deployments.'
