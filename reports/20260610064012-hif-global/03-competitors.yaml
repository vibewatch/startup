callouts:
- calloutType: insight
  title: Most important competitive conclusion
  body: HIF is not easiest to beat on product breadth or signaling, but it is also not obviously the cheapest route. The strongest underwriting case is Haru Oni plus Porsche and methanol-led optionality; the strongest challenge is that more focused or more capital-light rivals can look easier to finance and contract.
  claimRefs:
  - CP030
  - CP032
  - CP033
  - CP035
- calloutType: risk
  title: Where the adverse case bites hardest
  body: 'The adverse case concentrates in financing and price realization: capital-intensive PtX projects can stall before FID, and renewable methanol still sits above a commodity market facing oversupply and Chinese price pressure. If protected low-carbon offtake weakens, HIF’s scale can turn into burden.'
  claimRefs:
  - CP022
  - CP028
  - CP029
