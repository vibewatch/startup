- id: technology-and-adjacent-platforms
  title: Why Sunfire, Topsoe, Liquid Wind, CRI, and INERATEC still matter
  body: 'Some of HIF''s most important competitive threats sit one layer upstream or one segment over. Sunfire and Topsoe matter because electrolyzer efficiency, module size, and integration quality flow straight into e-fuel economics. Sunfire now markets an expected 89% LHV SOEC efficiency, a proven 84% benchmark in earlier generation equipment, and a 50 MW alkaline module marketed as cutting total installed cost by up to 50%. Topsoe positions SOEC around methanol, SAF, and ammonia integration and backs that with a 500 MW manufacturing site. On the adjacent-fuels side, Liquid Wind and Ørsted target maritime e-methanol with a more replication-friendly template, while CRI and INERATEC lean harder into licensing, modular plants, or lower-capex deployment formats. These models may never recreate HIF''s exact molecule mix, but they can outperform where customers prioritize lower capital needs, faster rollout, or existing fuels and industrial infrastructure over flagship project ownership. This
    also matters for incumbents and infrastructure-linked buyers: a shipping or industrial customer may prefer a replicated methanol template, a license into an existing asset base, or a modular plant that is easier to finance than HIF’s own flagship-style buildout.'
