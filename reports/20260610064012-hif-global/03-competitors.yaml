- id: durability-and-adverse-case
  title: Moat durability, bankability, and the adverse case
  body: 'The adverse case for HIF is not that demand disappears; it is that competitors reach bankable scale faster or with less capital at risk. Topsoe''s 2025 annual report says geopolitical uncertainty is delaying final investment decisions for capital-intensive Power-to-X projects and that bankability depends more on long-term offtake and certification-compliant operations than on electrolyzer capex alone. Forbes separately describes HIF''s Matagorda build around a USD 6 billion plan with policy-sensitive economics and initial costs around USD 5 per gallon. Methanol Institute market data adds another challenge: conventional methanol oversupply and Chinese pricing may limit further price upside for years. That means HIF likely needs protected low-carbon offtake and premium segments rather than commodity methanol pricing. No source in this chapter supports revenue, market-share, or standardized contract-price comparisons, so the underwriting has to stay qualitative and contradiction-aware.'
