- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - HIF moat claim
  - Supporting evidence
  - Threat or disconfirming evidence
  - Severity
  - Diligence ask
  rows:
  - - Operating proof at Haru Oni
    - HIF and Porsche both show Haru Oni operating and used in real settings
    - Synhelion says DAWN has operated since 2024 and CRI already licenses commercial e-methanol plants
    - medium
    - Request independent uptime, output, and product-quality data for Haru Oni versus peer reference plants
  - - Porsche linkage and customer halo
    - Porsche is a visible strategic investor and lighthouse user of e-gasoline
    - Infinium, Norsk e-Fuel, and Synhelion show more explicit airline or logistics offtake language in this chapter
    - high
    - Ask whether Porsche branding converts into contracted volume or mainly signaling value
  - - Methanol-led optionality
    - HIF can route methanol into shipping directly and e-SAF later
    - Methanol oversupply and China pricing can cap upside; aviation pure-plays can be better focused
    - high
    - Request segmented economics for methanol, MTJ-SAF, and road-fuel use cases
  - - Scale through owned megaprojects
    - Owned plants can create export relevance and strategic control
    - Forbes and Topsoe both point to capital intensity, policy sensitivity, and delayed FIDs as structural constraints
    - high
    - Request full financing plan, offtake coverage, and contingency assumptions by site
  - - Flexible drop-in fuel story
    - HIF can talk to road, maritime, and aviation buyers from one platform
    - Broader scope can dilute GTM focus relative to airline-first or shipping-first rivals
    - medium
    - Test win rates by segment and whether breadth helps or hinders customer acquisition
  - - Process differentiation
    - HIF combines methanol, gasoline, and future SAF from one platform
    - Synhelion claims structurally lower electricity demand while Sunfire and Topsoe can improve rival plant economics
    - high
    - Benchmark HIF’s actual power intensity and hydrogen cost assumptions against photothermal and SOEC-led alternatives
  notes: Severity reflects how directly the threat could impair financing, pricing power, or customer acquisition. The register stays qualitative because this chapter contains no verified revenue or market-share disclosures.
