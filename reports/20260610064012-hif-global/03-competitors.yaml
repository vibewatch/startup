tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Company / path
  - Category
  - Current public proof
  - Primary segment
  - Main edge versus HIF
  - Main limitation versus HIF
  rows:
  - - HIF Global
    - Subject company
    - Operating Haru Oni pilot; Porsche-linked product usage; methanol-to-jet development narrative
    - 'Multi-segment: maritime methanol, road e-gasoline, future e-SAF'
    - Only company in this set with visible Haru Oni operating proof plus Porsche linkage and methanol-led optionality
    - Owned megaproject model keeps capital needs high and public economics thin
  - - Synhelion
    - Direct PtL peer
    - DAWN operational since 2024; SWISS offtake from 2027; investor backing from SWISS and Eni
    - Aviation-led with diesel/gasoline optionality
    - Photothermal route, lower-electricity narrative, and licensing roadmap can look structurally cheaper than HIF if validated
    - Economics remain company-validated and route assumptions differ sharply from HIF’s wind-to-hydrogen pathway
  - - Norsk e-Fuel
    - Direct PtL peer
    - Mosjøen FEED underway; 50M liters e-crude design; airline offtakes and Paul Wurth-backed industrialization
    - Aviation SAF
    - Cleaner airline-first GTM and stronger explicit European aviation offtake framing than HIF
    - No operating fuel plant in the public record here and narrower segment scope than HIF
  - - Infinium
    - Direct PtL / e-fuels peer
    - Roadrunner backed by American, Amazon, IAG, Brookfield, Breakthrough, and a 100 MW electrolyzer package
    - Aviation plus logistics, trucking, plastics, maritime
    - Stronger explicit airline and logistics partner stack plus project-finance framing
    - Public strategy is split across Energy and Edge platforms and exact fuel volumes remain thin
  - - Sunfire / Topsoe
    - Technology-layer competitor-enablers
    - SOEC and alkaline platforms, 50 MW alkaline module, 500 MW SOEC factory, methanol/SAF integration marketing
    - Electrolysis and process layer for PtX developers
    - Can outperform HIF on electrolyzer efficiency, module size, and lower-capex process supply without owning the whole fuel project
    - Still depend on developer customers reaching FID and are not end-market fuel brands
  - - Liquid Wind / Ørsted
    - Adjacent e-methanol developer
    - FlagshipONE framed around 70 MW electrolysis and 50 kt/y e-methanol; modular replication messaging
    - Maritime e-methanol
    - Sharper shipping focus and more replication-friendly template than HIF’s bespoke megaprojects
    - Less visible operating proof than Haru Oni and a narrower molecule mix
  - - CRI
    - Adjacent e-methanol incumbent
    - '>200 kt/y installed capacity under license; commercial CO2-to-methanol plants operating in Iceland and China'
    - Renewable methanol and technology licensing
    - Existing commercial-scale methanol track record and capital-light licensing model
    - Less visible downstream customer halo than Porsche and less emphasis on multi-molecule optionality
  - - INERATEC
    - Adjacent modular PtX player
    - Modular Power-to-X positioning around synthetic fuels and chemicals
    - Distributed e-fuels / e-chemicals
    - Lower-scale modular deployment can suit buyers that do not want HIF-sized capital commitments
    - Public materials here do not show HIF-like flagship scale or marquee offtakes
  notes: Rows reflect how buyers, partners, or financiers would encounter each option in real e-fuels decisions. They are not a proxy for undisclosed market share or profitability.
