- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / route
  - Public commercial signal
  - Partner or customer proof
  - What is visibly bundled
  - What remains opaque
  - Implication
  rows:
  - - HIF
    - No public list fuel price; emphasizes highest-value-market flexibility and existing-engine compatibility
    - Porsche use plus Airbus/Honeywell/Johnson Matthey collaboration language
    - Molecule optionality across e-methanol, e-gasoline, and future e-SAF
    - No public contract pricing, margins, or project-level offtake volumes in this chapter
    - HIF sells strategic optionality and lighthouse proof more than transparent commodity pricing
  - - Synhelion
    - Claims sub-EUR 1,000/t and sub-EUR 0.8/L at scale
    - SWISS offtake; Eni investor and infrastructure fit
    - Solar fuel pathway, thermal storage, and eventual licensing
    - No public field economics at scale beyond company-validated claims
    - If believed, Synhelion’s cost story is the sharpest theoretical challenge to HIF
  - - Norsk e-Fuel
    - Public emphasis is offtake-led industrialization, not unit price
    - Cargolux and Norwegian offtakes; Paul Wurth-led shareholder support
    - Aviation-dedicated project development
    - No public list price, capex split, or electrolyzer economics
    - Commercial narrative is cleaner than HIF’s for airline buyers even without operating proof
  - - Infinium
    - Public packaging is built around project finance and firm offtakes
    - American Airlines, Amazon, IAG, Breakthrough, Brookfield
    - eSAF, eDiesel, eNaphtha plus broad customer set
    - Exact annual fuel volumes, project IRR, and customer pricing are undisclosed
    - Infinium packages financing and customers more visibly than HIF packages offtake certainty
  - - Sunfire
    - Markets lowest-LCOH / lower-TIC logic via electrolysis modules rather than fuel price
    - Industrial repeat orders and hydrogen-project references
    - SOEC LTSA, alkaline modules, outdoor deployment and prefabrication
    - No public customer fuel economics or service-fee schedule
    - Sunfire competes by helping someone else underwrite a cheaper plant
  - - Topsoe
    - Markets lower hydrogen cost plus integrated methanol / SAF readiness
    - Industrial and investor-platform credibility; annual-report disclosure
    - SOEC, methanol synthesis, integrated services, modular eMeOH positioning
    - No public list price and near-term revenue remains tied to delayed FIDs
    - Topsoe can win the process layer even when HIF wins the molecule story
  - - Liquid Wind / CRI / INERATEC
    - Replication, licensing, or modular deployment is the visible package rather than transparent fuel price
    - Ørsted backing, commercial licensees, modular plant messaging
    - E-methanol focus, technology license, or modular PtX plants
    - Negotiated fuel pricing, utilization, and project-finance terms remain opaque
    - These routes may appeal to customers seeking lower capital needs and faster replication more than flagship branding
  notes: The chapter cannot support a true price table because nearly none of the peers publish standard list prices or realized margins. Public commercial packaging is the more defensible comparison.
