- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Porsche-led lighthouse demand
    - Too much public proof is concentrated in one strategic investor-customer
    - Validates product but can overstate diversification
    - Request Porsche share of current and expected near-term volumes
  - - European compliance pathway via RFNBO and Hamburg
    - Europe route looks real only if certification, blending, and import infrastructure all stay aligned
    - Could unlock premium compliance markets
    - Map which counterparties are contingent on RFNBO status and Hamburg logistics
  - - Maritime channel through Mabanaft
    - Framework demand may not convert if shipping customers delay methanol adoption
    - Large future volume upside with existing infrastructure
    - Request definitive SPA timing, storage readiness, and named maritime users
  - - German eFuel One niche route
    - Counterparty may validate e-fuels narrative without delivering utility-scale volumes
    - Useful niche European buyer and advocacy platform
    - Request credit profile, resale channel, and conversion timeline to final contract
  - - Japan pathway through Idemitsu and JOGMEC
    - Investor enthusiasm can outrun binding purchase economics
    - Could open a strategic import market and policy support
    - Request binding volumes, delivery windows, and downstream Japanese buyers
  - - Project-scale dependence at Matagorda and Paysandu
    - Large-volume demand remains hypothetical until projects reach FID and operations
    - Major upside if plants come online as planned
    - Test customer commitments against permitting, logistics, and financing milestones
  notes: Rows combine upside and concentration risk because HIF is trying to convert a few high-profile relationships into broader commercial channels.
