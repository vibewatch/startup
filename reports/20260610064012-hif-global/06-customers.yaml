  rows:
  - - Porsche
    - Buyer and end user; HIF shareholder
    - Experience Centers, Porsche Mobil 1 Supercup, lighthouse events
    - Live customer proof with shipment and repeat usage
    - Strongest public validation of molecule compatibility and brand pull
    - No disclosed price, contract term, or revenue contribution
  - - Antarctica21
    - Tourism operator and end user
    - Zodiac landing boats in Antarctica; e-MGO and e-SAF under evaluation
    - Live niche customer proof with second-season renewal
    - Shows repeat use outside motorsport and a hard-to-abate tourism angle
    - Scale is boutique rather than material offtake
  - - Mabanaft / MB Energy
    - Channel partner serving maritime and industrial buyers
    - Planned e-methanol distribution via Hamburg infrastructure
    - Pre-commercial HoA
    - Most credible maritime route-to-market in the public record
    - Definitive SPA still pending
  - - German eFuel One
    - Prospective buyer and downstream e-fuels player
    - Planned offtake of Paysandu e-methanol into Hamburg-linked market
    - Pre-commercial HoA
    - Adds a European import and racing-fuel pathway
    - Still a negotiated framework, not final demand
  - - Idemitsu / Japan stack
    - Investor, prospective buyer, and market-development partner
    - LOI for Matagorda e-methanol plus Japanese market buildout
    - LOI plus strategic-investor proof
    - Could open shipping, refining, and Japanese policy channels
    - Commercial terms and volume commitments remain undisclosed
  - - Shell
    - Blender and logistics intermediary
    - Hamburg blending for Porsche lighthouse events
    - Operational channel support, not standalone customer proof
    - Demonstrates downstream handling and event activation path
    - No separate Shell end-demand commitment disclosed
  notes: Rows separate current end use from framework demand and channel support. Strategic value is qualitative and based on public evidence only.
