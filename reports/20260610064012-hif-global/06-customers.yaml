- id: other-commercialization-pathways
  title: Other Commercialization Pathways
  body: 'Outside Porsche, HIF''s second-best live customer proof is Antarctica21. HIF said ten Zodiac boats serving the Magellan Explorer would run on Haru Oni e-Gasoline in the 2024-25 Antarctic season, and the 2026 renewal said those Zodiac operations continued for a second consecutive season. That renewal matters because it is the clearest non-Porsche repeat-use signal in the public set. Even so, Antarctica21 remains a boutique operator with small ships and a maximum 76-guest format, so the case proves operational fit and brand value far more than material fuel volumes.


    The rest of the demand stack is better described as pre-commercial pathway building. Mabanaft''s 2025 HoA covers around 100,000 tonnes per year of e-methanol for shipping and industrial applications and is paired with Hamburg tank-terminal preparation, but HIF explicitly says the document advances negotiations toward a definitive agreement rather than replacing one. German eFuel One''s 2026 HoA similarly frames about 100,000 tonnes per year from Paysandu as a framework for negotiating a definitive contract. Idemitsu''s 2023 LOI for Matagorda e-methanol, 2024 USD 114 million investment, and the later JOGMEC-backed Japanese market push show serious strategic intent, but they still read as investor-plus-market-development proof, not bankable demand proof. RFNBO certification at Haru Oni helps the European path materially, yet Matagorda and Paysandu still depend on larger project execution before those route-to-market claims can become operating customer revenue.'
