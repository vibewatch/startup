- id: TU006
  title: Public bankability-gap table
  columns:
  - Needed underwriting signal
  - Public evidence found
  - Why it is insufficient
  - What to request next
  rows:
  - - Customer count and mix
    - Named end users and framework counterparties only
    - Does not reveal breadth of paying base
    - Active customers by molecule, geography, and status
  - - Recurring contract economics
    - HoA, LOI, and supply-agreement headlines
    - Headlines omit price, take-or-pay, and margin
    - Volume ladder, price corridor, and credit support
  - - Renewal durability
    - Porsche follow-on use and Antarctica21 second season
    - Repeat behavior exists but not enough to model retention economics
    - Renewal dates, repeat liters, and lost-customer data
  - - Top-customer concentration
    - Porsche appears to dominate visible proof
    - No revenue-share or offtake-share disclosure
    - Top-5 customer concentration and scenario sensitivity
  - - Project-backed demand certainty
    - Matagorda and Paysandu mention MoU or HoA counterparts
    - Framework buyers still depend on project execution and FID
    - Link customer commitments to milestone schedule and precedent conditions
  - - Cost competitiveness
    - Adverse sources cite highly uncertain or very high prices
    - Without bankable economics, demos may not scale into recurring demand
    - Current delivered cost, subsidy dependence, and target margins by use case
  notes: This substitution table is used because the public record lacks enough numeric retention or contract data to render a true cohort-style durability figure responsibly.
