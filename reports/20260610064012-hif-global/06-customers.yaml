chapter:
  number: 6
  title: Customers
  summary: 'HIF''s customer proof is real but narrow: Porsche is both strategic investor and the clearest lighthouse end user, Antarctica21 is an operational but small repeat-use customer, and Mabanaft, German eFuel One, Idemitsu, and Shell mostly evidence commercialization pathways rather than bankable recurring demand. Public disclosures show actual shipments, race-series usage, and HoA or LOI pathway building, but they do not disclose customer count, renewal metrics, pricing, or take-or-pay volume. The adverse record therefore supports a chapter judgment of demonstration-grade demand proof with meaningful channel optionality, not yet diversified recurring customer visibility.'
sections:
- id: proof-ladder-and-customer-segmentation
  title: Proof Ladder and Customer Segmentation
  body: 'HIF''s public customer record is strongest when it is sorted by proof quality instead of by logo count. One bucket contains real current end users: Porsche''s motorsport and Experience Center activity, plus Antarctica21''s Zodiac operations in Antarctica. A second bucket contains route-to-market counterparties that may become large customers but are not yet proven as recurring demand: Mabanaft/MB Energy, German eFuel One, and Idemitsu. A third bucket contains enablers rather than customers, such as Shell''s blending role in Hamburg and JOGMEC''s strategic financing support for Japanese market development. That taxonomy matters because HIF''s marketing stack can otherwise look broader than its present revenue proof actually is.


    The current picture is therefore real but narrow. Porsche is the clearest public signal that molecules are being shipped, blended, and used in live engines. Antarctica21 adds a second end-use case and, importantly, a repeat season. But the larger-volume stories still sit mostly at HoA, LOI, or policy-development stage around projects that have not yet reached full investment decision or commercial operations. HIF has enough evidence to show commercialization pathways exist; it does not yet publish enough to show that those pathways have converted into a diversified book of durable, bankable customer contracts.'
