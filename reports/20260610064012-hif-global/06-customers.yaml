  title: HIF customer journey map
  type: journey-map
  layout: wide
  summary: Shows how HIF currently moves from strategic backers to live niche end users and then toward larger but still pre-commercial route-to-market partners.
  data:
    items:
    - label: Strategic capital
      detail: Porsche and later Idemitsu/JOGMEC fund development and validate relevance before scale plants operate.
    - label: Pilot molecule proof
      detail: Haru Oni produces e-methanol and e-gasoline and creates the first molecules that can be tested with named users.
    - label: Lighthouse end use
      detail: Porsche Experience Centers, the Supercup, and Antarctica21 use fuel in visible, low-volume settings.
    - label: Channel handling
      detail: Shell and Hamburg logistics show blending, storage, and import pathways needed for European use.
    - label: Framework offtake
      detail: Mabanaft, German eFuel One, and Idemitsu sign HoA or LOI documents for future project output.
    - label: Bankable recurring demand
      detail: Still mostly unproven publicly because pricing, take-or-pay, contract length, and customer concentration are undisclosed.
  approximationNotes: This is an analytical commercialization sequence synthesized from public disclosures, not a management-published pipeline chart.
