- calloutType: strength
  title: Porsche is real customer proof, not just logo proof
  body: Porsche clears the bar from strategic investor to actual user because the public record shows an offtake mention, a first commercial shipment, live motorsport use, and a follow-on 2025 supply agreement. That makes Porsche materially more valuable than a generic partner logo in assessing HIF's commercialization story.
  claimRefs:
