- calloutType: insight
  title: Antarctica21 matters because it adds repeat use outside motorsport
  body: 'Antarctica21 does not add huge volume, but it does add an important second proof class: a non-Porsche operator using HIF fuel for a second consecutive season. That turns the chapter from one-customer proof to at least two live end-use signals, even if both are still niche.'
  claimRefs:
  - CU011
  - CU013
  - CU014
  - CU015
  - CU039
- calloutType: risk
  title: Most of HIF's broader demand stack is still framework-stage
  body: Mabanaft, German eFuel One, and Idemitsu all support a credible commercialization pathway, but public materials still describe HoAs, LOIs, and market-development cooperation rather than fully bankable long-term contracts. Without pricing, take-or-pay, or concentration data, the current stack should not be mistaken for diversified recurring demand.
