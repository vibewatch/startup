- id: porsche-as-lighthouse-customer-proof
  title: Porsche as Lighthouse Customer Proof
  body: 'Porsche is the most defensible example of actual customer proof in HIF''s public record because the relationship spans investment, offtake intent, physical shipments, and repeated end use. Porsche invested USD 75 million in 2022 as part of HIF''s approximately USD 260 million equity round, and both HIF and Porsche tied that capital to industrial e-fuels buildout. By the December 2022 Haru Oni opening, Porsche was no longer just a strategic investor: HIF''s partner release said Porsche had an offtake agreement for lighthouse projects such as the Porsche Mobil 1 Supercup and Porsche Experience Centers, while ExxonMobil''s disclosed role was methanol-to-gasoline technology rather than fuel buying.


    The later proof points are stronger still. HIF''s sustainability report says it exported its first commercial shipment of 24,600 liters of synthetic gasoline to Europe for Porsche uses, and Renewables Now described that export as a shipment to Porsche in the UK. Porsche then announced that the 2024 Supercup season would run exclusively on Haru Oni-derived eFuels, with about 50,000 liters across eight European race weekends for up to 32 cars. In 2025, HIF, Porsche, and Shell signed a supply agreement under which Haru Oni e-Gasoline goes to Shell''s Hamburg technology center for blending before Porsche uses it at lighthouse events. That is real commercialization, but it is still lighthouse commercialization: the public record does not disclose price, take-or-pay volume, contract length, or recurring revenue tied to Porsche''s demand.'
