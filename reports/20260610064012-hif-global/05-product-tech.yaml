- id: where-the-technology-case-is-still-fragile
  title: Where the Technology Case Is Still Fragile
  body: |-
    The skeptical read on HIF is not that the chemistry is fake; it is that the commercial stretch from a working pilot to global fuel relevance is brutal. Independent sources flag three linked issues. First, e-fuels remain expensive and policy-dependent versus easier decarbonization options, so they are most defensible in hard-to-electrify uses rather than mass road transport. Second, DAC plus electrolysis is capital- and electricity-intensive, which is why Haru Oni still runs on biogenic CO2 and why HIF's larger projects also rely on practical recycled or biogenic carbon plans. Third, the public record still lacks the plant-level data that would let an investor verify uptime, conversion yield, energy intensity, and failure rates at Haru Oni itself.

    Industry Decarbonization's critique is therefore useful even if one disagrees with its tone. The publication argues that Haru Oni benefited from premature DAC messaging and that scale-up timelines were over-optimistic. That does not invalidate the underlying process chain. It does mean HIF should be underwritten as a project developer that has proven technical integration at demonstration scale, while still carrying significant execution risk around feedstock sourcing, certification replication, electrolyzer supply, and the economics of producing enough molecules to matter.
  claimRefs:
