- id: co2-strategy-and-commercial-scale-plant-design
  title: CO2 Strategy and Commercial-Scale Plant Design
  body: |-
    The most important technical nuance in HIF's stack is carbon sourcing. Haru Oni today still runs on biogenic CO2, while DAC is only now being bolted on as a proof-of-concept. HIF's own DAC updates are explicit that the new unit captures 600 tonnes of CO2 per year and is meant to generate operating experience for later facilities. That matters because the company's commercial sites are not being sold as pure DAC-first projects today. Paysandú relies on bioethanol-linked biogenic CO2 and dedicated solar-plus-wind power, Tasmania points to residue biomass as a CO2 option plus grid-backed renewable electricity, and Texas is framed around very large electrolyzer capacity plus recycled CO2. In other words, HIF's pipeline is scaling by pairing abundant renewables with the most practical certifiable carbon source available in each geography.

    That design choice is rational, but it also means Haru Oni's DAC story should be read as an R&D module layered onto a biogenic-carbon pilot, not as proof that atmospheric CO2 capture is already solved for HIF's industrial rollout. The leap from a 1.2 MW pilot electrolyzer to 280 MW, 1.1 GW, or 1.8 GW commercial sites is enormous. HIF's project pages show that the company understands this and is already disclosing training, permitting, recruitment, and equipment-supply dependencies alongside output targets.
