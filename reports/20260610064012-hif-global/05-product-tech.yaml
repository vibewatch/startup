    - 130,000 L/yr pilot output plus Porsche-linked demonstrations
    - Does not prove mass-market road-fuel economics
  - - Produce exportable low-carbon methanol
    - Generate renewable H2 and combine it with recycled CO2
    - Scale e-methanol at Texas, Uruguay, and Tasmania
    - Commercial sites are designed around much larger molecule volumes than the pilot
    - All three large projects remain pre-operational
  - - Qualify fuels for regulated markets
    - Document renewable power, feedstock, and GHG chain-of-custody
