    - Add DAC unit to working e-fuels site
    - Run 600 tCO2/yr DAC proof-of-concept at Haru Oni
    - Creates hands-on operating knowledge before larger rollouts
    - Too small to resolve commercial DAC economics
  - - Serve maritime decarbonization demand
    - Deliver methanol-compatible molecules to shipping market
    - Keep commercial roadmap methanol-first, with shipping relevance
    - Matches independent evidence of stronger near-term shipping use case
    - Price and molecule availability remain bottlenecks
