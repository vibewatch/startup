- id: downstream-pathways-partners-and-certification
  title: Downstream Pathways, Partners, and Certification
  body: |-
    HIF's partner map clarifies that the company is not inventing every unit operation itself. Johnson Matthey is the methanol-synthesis technology provider, ExxonMobil supplies the methanol-to-gasoline license and support, and Siemens Energy has been deeply involved in the original Haru Oni concept and in earlier Texas electrolyzer planning. That architecture is sensible because the value chain is modular: renewable power and electrolysis produce hydrogen; synthesis produces methanol; methanol can then either be sold directly or upgraded further into gasoline or other molecules. The public evidence increasingly suggests that HIF's commercial strategy is methanol-first. Texas, Uruguay, and Tasmania are all disclosed primarily as e-methanol projects, while Haru Oni remains the strongest public gasoline demonstration because it showcases the MTG path and the Porsche relationship.

    Certification is the second major downstream differentiator. Haru Oni's 2025/26 RFNBO certification is not just a marketing badge; HIF says it covers the full chain from CO2 capture through hydrogen and finished molecules, and the certificate requires renewable hydrogen plus a 70% GHG reduction threshold. ISCC's own materials make clear that this is a recognized audit framework, not a self-defined standard. The commercial implication is positive but narrow: Haru Oni has cleared one demanding pathway, yet each future site will still need its own auditable electricity, feedstock, and chain-of-custody package before investors can treat Haru Oni as a template that automatically ports everywhere.
