- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Primary upside
  - Risk
  rows:
  - - Renewable electricity
    - Powers electrolysis and sets carbon intensity
    - Wind resource, grid access, dedicated solar / wind parks
    - Enables low-carbon hydrogen and exportable liquid fuels
    - Cheap clean power at scale is a hard constraint
  - - PEM electrolysis
    - Splits water into hydrogen and oxygen
    - Electrolyzer supply, water, balance-of-plant integration
    - Core enabler of green hydrogen production
    - GW-scale procurement and execution remain unproven for HIF
  - - CO2 sourcing
    - Provides carbon feedstock for synthesis
    - Biogenic contracts today; DAC learning for tomorrow
    - Allows flexible regional development instead of waiting for perfect DAC
    - Certification and availability differ by site and can bottleneck scale
  - - Methanol synthesis
    - Combines H2 and CO2 into e-methanol
    - Johnson Matthey technology, catalysts, heat integration
    - Creates shipping-ready product and downstream intermediate
    - Vendor claims are stronger than public plant-performance data
  - - MTG / downstream upgrading
    - Converts some methanol into gasoline or other fuels
    - ExxonMobil license and additional processing economics
    - Supports drop-in gasoline demonstrations for existing engines
    - Adds complexity and may not be the main commercial volume path
  - - Certification and QA
    - Qualifies molecules for export and regulated markets
    - ISCC audit chain, lab work, electricity matching, traceability
    - Separates a real project from a pure concept deck
    - Site-specific paperwork and compliance replication are ongoing burdens
  notes: This table distinguishes operating unit operations from commercialization and compliance dependencies.
