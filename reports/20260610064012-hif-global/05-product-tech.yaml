  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: plant-performance-kpis
    missingEvidence: Plant-level uptime, conversion-yield, energy-intensity, and failure-rate data for Haru Oni across electrolysis, methanol synthesis, and MTG steps.
    whyItMatters: Without real operating KPIs, the pilot proves integration but not whether the process is economically or operationally repeatable at scale.
    diligencePath: Request monthly operating reports, historian exports, quality-control summaries, and engineering run-rate data for Haru Oni.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: future-site-certification-readiness
    missingEvidence: Site-by-site certification workplans showing electricity matching, carbon-source traceability, and audit readiness for Texas, Paysandú, and Tasmania.
    whyItMatters: Haru Oni's RFNBO proof is valuable, but investors cannot assume the same compliance package automatically transfers to every future facility.
    diligencePath: Obtain certification roadmaps, auditor engagement letters, and draft chain-of-custody documentation for each commercial project.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: commercial-offtake-and-feedstock-contracts
    missingEvidence: Long-form electricity, CO2, and offtake contracts showing volume, tenor, pricing, curtailment treatment, and sustainability obligations for the commercial plants.
    whyItMatters: The public stack shows technical intent, but underwriting industrial-scale e-fuels depends on how feedstock and offtake risk are actually contracted.
    diligencePath: Review executed or near-final PPAs, CO2 supply agreements, and take-or-pay offtake contracts for Matagorda, Paysandú, and Tasmania.
    relatedQuestionRefs:
    - QE011
    - QE013
    - QE014
    - QE025
