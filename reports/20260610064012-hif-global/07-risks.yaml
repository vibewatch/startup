- id: technology-scale-up-and-cost-risk
  title: Technology, scale-up, and cost risk
  body: |-
    The biggest operating leap sits between Haru Oni’s pilot proof and the commercial projects. HIF’s own disclosures show that Haru Oni remains tiny relative to the proposed plants, while the DAC module now being installed is only a 600-tonne-per-year proof-of-concept meant to help the company learn. Independent critique has been direct that the DAC piece was not yet in place at Haru Oni when outside reviewers assessed the pilot. That means the commercial story still relies on unproven scaling of both clean hydrogen and clean-carbon feedstock chains, not just on a methanol-to-gasoline conversion step that works in principle.

    The power and equipment stack adds a second layer of risk. Matagorda alone calls for about 2 million tonnes per year of recycled CO2, very large renewable-power inputs, and industrial electrolyzer deployment at 1.8 GW or more. HIF’s public path moved from a Siemens reservation to a later Electric Hydrogen selection, which is understandable cost optimization but also a reminder that the supplier stack was still moving during project development. ARENA’s Tasmania report is a useful independent warning here: first-of-a-kind e-fuels projects face unusually long development periods, open technology choices, and CAPEX/OPEX uncertainty. Independent energy studies reinforce the same point from the economics side. The IEA, IRENA, IIASA-EDF, and Energy & Environmental Science all describe high costs, infrastructure needs, and financing barriers as central constraints. In practice, HIF is exposed not only to whether its chemistry works, but also to whether e-fuels can get close enough on delivered cost to avoid being trapped in niche demonstration markets while EVs and other lower-loss pathways keep improving.
  claimRefs:
