  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: project-finance-gap
    missingEvidence: Definitive debt, tax-equity, EPC and reserve-account package for Matagorda or Paysandú, including conditions precedent and contingency assumptions.
    whyItMatters: Public permits and site pages do not show whether either mega-project is actually financeable on lender terms.
    diligencePath: Request the current financing roadmap, lender shortlist, committed capital stack, and minimum contract package required for FID.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: contract-conversion
    missingEvidence: Binding SPA or take-or-pay disclosures for Mabanaft, German eFuel One, Idemitsu, Porsche/Shell, including volume ramps, pricing logic and credit support.
    whyItMatters: Without definitive offtake terms, investors cannot tell whether strategic interest is strong enough to underwrite plant utilization and debt service.
    diligencePath: Request signed contract status, volume schedules, termination rights, and counterparty credit documentation.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR023
    - QR030
  - type: missing-source
    severity: material
    topic: power-and-co2
    missingEvidence: Commercial-scale PPAs, curtailment assumptions, recycled-CO2 contracts, electrolyzer delivery milestones, and ramp plans for Texas and Uruguay.
    whyItMatters: HIF’s design-scale economics depend on synchronized power, CO2 and equipment availability, but the public record does not provide that synchronization evidence.
    diligencePath: Request site-level supply agreements, interconnect studies, CO2 counterparties, and integrated commissioning schedules.
    relatedQuestionRefs:
    - QR004
    - QR015
    - QR029
  - type: missing-source
    severity: material
    topic: cost-competitiveness
    missingEvidence: Current delivered-cost model for HIF fuels by market, including subsidy assumptions, certification premium, transport cost, and alternative-fuel comparison.
    whyItMatters: The chapter can prove cost pressure exists, but it cannot quantify whether HIF’s specific routes will clear premium niches at acceptable margins.
    diligencePath: Request internal LCOF waterfall by site and compare it against customer willingness-to-pay and policy support scenarios.
    relatedQuestionRefs:
    - QR007
    - QR009
    - QR027
    - QR028
