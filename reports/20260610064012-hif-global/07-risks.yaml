callouts:
- calloutType: risk
  title: Permitting progress is not the same thing as bankability
  body: Texas has an air permit and Uruguay has location feasibility, but HIF’s own releases still condition construction and commercialization on financing, contracting, and later-stage environmental review. Investors should treat permits as necessary milestones, not as proof that capital structure and utilization risk are solved.
  claimRefs:
  - CR004
  - CR020
  - CR035
- calloutType: risk
  title: The cost risk is strategic, not just technical
  body: 'Independent studies and adverse commentary all point to the same challenge: e-fuels may be technically valid yet still struggle to win broad road-fuel demand if delivered costs stay far above alternatives and EV policy continues advancing.'
  claimRefs:
  - CR028
  - CR029
  - CR030
  - CR031
  - CR045
- calloutType: recommendation
  title: Underwrite HIF against milestone packages, not aspiration curves
  body: The company becomes meaningfully safer only when later-stage permits, power and CO2 supply, definitive offtake, and project finance close in the same window. Until then, the appropriate stance is milestone-driven exposure with explicit kill criteria.
  claimRefs:
  - CR003
  - CR008
  - CR037
  - CR046
