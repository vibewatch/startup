- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Permitting drag in Uruguay or Tasmania
    - Formal review timeline slips or hearing process stalls
    - AAP/EIA or Tasmania approvals move materially beyond management guidance without clear remediation
    - Downgrade timeline assumptions and require refreshed capex plus liquidity bridge
  - - Contract-conversion failure
    - HoAs and LOIs do not become binding SPAs
    - No disclosed final offtake conversion or creditworthy volume support before major construction commitments
    - Do not underwrite utilization or project-finance close off framework agreements
  - - Cost gap versus alternatives persists
    - Delivered e-fuel economics remain far above alternatives
    - No evidence that premium markets or policy support can bridge the gap at commercial scale
    - Limit thesis to niche hard-to-abate markets and cut passenger-car upside assumptions
  - - Power / CO2 dependency mismatch
    - Generation, interconnect, or CO2 sourcing lags plant schedule
    - Commercial site lacks synchronized power and carbon feedstock plan
    - Assume delayed startup and lower ramp-to-nameplate
  - - Strategic capital without full financing stack
    - Equity support continues but debt/EPC/offtake stack does not close
    - Capital raises fund development but not bankable FID package
    - Treat the company as a continuing option on execution rather than as de-risked infrastructure
  notes: Kill criteria emphasize observable milestones an investor can track before assuming that permitting progress translates into bankable cash flow.
