- id: mitigants-triggers-and-thesis-breakers
  title: Mitigants, monitoring triggers, and thesis breakers
  body: |-
    The public record does show real mitigants. HIF has already produced fuel at Haru Oni, secured some permitting progress, redesigned Paysandú to address environmental integration, begun early community engagement in Tasmania, and attracted credible strategic investors plus route-to-market counterparties. Those are not cosmetic achievements. They mean the right underwriting stance is not “technology fiction”; it is “real platform, still fragile at commercial scale.” That distinction matters because the mitigants are enough to keep HIF investable for milestone-driven investors, but not enough to justify treating execution as routine.

    The practical question is what would break the thesis. Three trigger clusters matter most. First, timing: if AAP/EIA review, Tasmanian assessment, electrolyzer delivery, or renewable-power park approvals slip materially, HIF’s financing burden rises before revenue does. Second, economics: if delivered e-fuel costs stay stranded far above alternatives or if EU qualification becomes harder than expected, the addressable premium market shrinks. Third, conversion: if HoAs and LOIs do not become binding contracts with disclosed counterparties and credit support, the company may keep demonstrating interest without securing bankable demand. In other words, HIF’s risk chapter remains investable only on a monitorable, kill-criteria basis rather than on a simple narrative of inevitable scale-up.
