company:
  name: HIF Global
chapter:
  number: 7
  title: Risks
  summary: HIF Global’s downside is not a binary technology-fiction call; it is an infrastructure-convergence risk. The company has real pilot output, credible partners, and early permitting wins, but the public record still shows a difficult bridge from Haru Oni’s tiny operating base to multi-billion-dollar plants that require synchronized power, CO2, policy-qualified output, project finance, and contract conversion. Residual risk is therefore high because permits and lighthouse demand exist, but bankable commercial-scale execution is not yet publicly proven.
sections:
- id: risk-map-and-base-case-downside
  title: Risk map and base-case downside
  body: |-
    HIF’s core risk is not that electrofuels are chemically impossible. Haru Oni proves the chemistry and the company has assembled credible counterparties. The residual risk is that HIF is trying to bridge from a 130,000-liter-per-year pilot to multi-billion-dollar, gigawatt-scale assets whose economics depend on cheap renewable power, low-carbon CO2, policy-qualified output, and financing plus contract conversion arriving at the same time. That is a very different underwriting problem from simply verifying molecule compatibility. The base-case downside is therefore not sudden technical failure; it is a slower and more common infrastructure failure mode in which permits advance, partners stay interested, but final contracts, project finance, power buildout, and qualified demand do not line up quickly enough to support full utilization.

    That framing matters because HIF’s public evidence can otherwise read more mature than it is. Official site pages advertise about US$7 billion for Matagorda and about US$5.385 billion for Paysandú, while disclosed equity raised so far is still measured in hundreds of millions rather than billions. Public offtake announcements are still mostly HoAs, LOIs, or lighthouse-use agreements, and the company’s own releases repeatedly warn that permitting, negotiations, financing, demand, and policy can all derail timing. The right risk map is therefore multi-factor: technology and supply-chain risk can delay startup, policy and permitting risk can limit qualifying output, and commercial concentration can leave even a completed plant underutilized. That combination justifies a high residual-risk rating even though the platform is real.
  claimRefs:
