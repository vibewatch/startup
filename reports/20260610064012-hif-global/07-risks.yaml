- id: project-finance-and-contract-conversion-risk
  title: Project-finance, customer concentration, and contract-conversion risk
  body: |-
    HIF’s commercial narrative is credible but still narrow in bankability terms. The named counterparties are real and strategically valuable, yet the public documents remain dominated by HoAs, LOIs, and lighthouse agreements. Mabanaft and German eFuel One are both described as Heads of Agreement. Idemitsu’s Texas document is explicitly a letter of intent to negotiate a sale and purchase agreement. Porsche and Shell are valuable proof points, but the public framing still centers on Haru Oni lighthouse uses rather than diversified end-market pull. That means the most visible customer signals double as concentration risk: a handful of strategic relationships account for most of the company’s public demand narrative, and several of those relationships are also financiers or market-development partners rather than plain-vanilla commodity buyers.

    The financing side compounds that concentration. Publicly disclosed equity rounds are meaningful, but they are small relative to even one mega-project, let alone a portfolio. HIF’s own disclosures repeatedly warn that financing, negotiations, policy developments, and demand can diverge from plan. In infrastructure terms, the question is not whether HIF can keep attracting strategic capital; it is whether it can convert that strategic interest into enough contracted demand and third-party capital to support construction, startup, and utilization without years of under-earning. If that conversion stalls, the downside does not require a total project failure. A slower, more common downside is schedule slip plus partial commercialization: the plant exists, but volumes, margins, and credit quality arrive later than the capex burn.
