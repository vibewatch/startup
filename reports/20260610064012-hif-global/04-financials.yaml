- id: capital-needs-and-financing-dependency
  title: Capital needs and financing dependency
  body: 'HIF’s disclosed capital raising is meaningful, but the project slate is much larger than the corporate equity raised so far. The company publicly raised about US$260 million in 2022, then US$164 million in May 2024 and another US$36 million in September 2024 for roughly US$200 million of new funding that year. Those rounds brought in or expanded backing from AME, Porsche, EIG, Baker Hughes, Gemstone, Idemitsu, and JOGMEC, and Baker Hughes’ 2025 annual report still describes HIF as a strategic e-fuels partner. That investor base improves credibility, yet it does not close the capital-intensity gap implied by project disclosures. Haru Oni itself is listed at US$78 million, while Matagorda carries public markers of roughly US$6 billion to US$7 billion, Paysandú shows roughly US$5.3 billion to US$6 billion, and Tasmania is listed at about US$2 billion. Even allowing for project finance and staged development, the disclosed capex burden vastly exceeds the disclosed corporate equity history.
    The company’s own repeated cautionary statements also matter here: HIF ties execution to permits, financing availability, commercial negotiations, policy support, and customer demand. That is a classic project-finance profile, not a business already demonstrably self-funding from operating cash flow.'
