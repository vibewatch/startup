- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Exact diligence path
  - Current public status
  - Underwriting impact
  rows:
  - - Current revenue / ARR
    - Needed to size company-level traction and financing dependency
    - Request monthly realized revenue by product and project, plus backlog conversion
    - Not publicly disclosed
    - Blocking for growth-quality underwriting
  - - Gross margin or variable cost per liter / ton
    - Needed to test whether certification and partner access create economic spread
    - Request pilot variable cost, delivered logistics cost, and gross margin by molecule
    - Not publicly disclosed
    - Blocking for unit-economics underwriting
  - - Cash on hand, burn, and runway
    - Needed to assess equity timing and solvency risk between FIDs
    - Request latest balance-sheet cash, monthly cash burn, and committed capex schedule
    - Not publicly disclosed
    - Blocking for capital-adequacy underwriting
  - - Debt and project-finance structure
    - Needed to understand leverage, recourse, and interest-rate sensitivity
    - Request project SPV structure, lenders, guarantees, and covenants by major facility
    - Not publicly disclosed
    - Blocking for capital-structure underwriting
  - - Realized offtake pricing and contract duration
    - Needed to distinguish lighthouse proof from bankable demand
    - Request signed terms for Shell/Porsche, Idemitsu, Mabanaft, and eFuel One pathways
    - Not publicly disclosed
    - Blocking for revenue-quality underwriting
  - - Post-2024 cap table and valuation
    - Needed to test dilution, control, and round pricing discipline
    - Request ownership table after Idemitsu and JOGMEC rounds with any latest valuation mark
    - Not publicly disclosed
    - Material blocker for ownership and valuation analysis
  notes: Every gap listed here is a concrete diligence item rather than a generic complaint. Public sources are rich on project facts but sparse on company financial statements and contract economics.
