- id: cost-structure-and-unit-economics
  title: Cost structure and unit-economics drivers
  body: 'The public economics are strongest on input intensity and weakest on realized profitability. Haru Oni gives one pilot-scale anchor: HIF lists US$78 million of construction cost, 130,000 liters per year of e-gasoline capacity, and 21 operating staff. That is enough to show the pilot is real, but not enough to infer an attractive unit margin. The commercial projects are far larger and dominated by utility and process inputs. HIF says Matagorda needs around 1.8 GW of electrolyzers and about 2 million tons per year of recycled CO2; its Idemitsu LOI adds a 2,000 MW renewable-power requirement and 300,000 mtpa of green hydrogen. Independent sources reinforce that these are the decisive variables. ARENA says first-of-a-kind CAPEX and OPEX uncertainty, market timing, and technology choice drove Tasmania redesigns, while the RSC 2026 paper says fuel cost depends on WACC, CAPEX, operating cost, levelized hydrogen cost, DAC carbon cost, and electrolyzer replacement expenditure. Forbes makes
    the same point in more commercial language: HIF’s management discussed DAC around US$250 per ton today versus a target closer to US$100, roughly US$5 per gallon initial production cost, and major exposure to electricity availability and policy rules. In short, power, electrolyzers, CO2, logistics, and certification dominate the economics long before reported revenue ever appears.'
