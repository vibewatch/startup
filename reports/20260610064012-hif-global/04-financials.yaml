      - Disclosed equity far below disclosed project capex
      - Cash, burn, and debt structure unknown
      - Needs more contracted economics to underwrite
      - Most important disclosure gap
  approximationNotes: The matrix is qualitative because public evidence supports relative exposure and disclosure quality, not audited project cash-flow statements or normalized returns.
