- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public amount / status
  - Why it matters
  - Forward implication
  - Disclosure quality
  rows:
  - - 2022 equity round
    - ~USD 260 million
    - Established the modern investor base and funded global expansion
    - Meaningful corporate funding, but small relative to commercial-project capex
    - Good on amount and investor names
  - - Porsche contribution
    - USD 75 million stake; Porsche says total e-fuels investment >USD 100 million
    - Shows strategic customer capital and signaling value
    - Helpful for credibility, not enough alone to finance megaprojects
    - Good on headline amount, weak on ownership percentage today
  - - 2024 financing round
    - USD 164 million combined with Idemitsu and existing shareholders
    - Shows continued access to strategic capital in 2024
    - Supports development spending, not full project construction
    - Good on round size, weak on security terms
  - - 2024 JOGMEC round
    - USD 36 million, bringing 2024 new funding to USD 200 million
    - Adds Japanese government-linked backing and policy relevance
    - Improves partner quality more than it solves capex burden
    - Good on amount, weak on structure
  - - Largest disclosed project capex markers
    - Matagorda ~USD 6-7bn; Paysandú ~USD 5.3-6bn; Tasmania ~USD 2bn
    - Shows commercial roll-out is infrastructure-scale
    - Project financing, staged FIDs, and more equity will likely be necessary
    - Moderate because markers conflict by source and date
  - - Company cash on hand / runway
    - null
    - Core capital-adequacy metric
    - Cannot underwrite self-funding or near-term dilution risk
    - Poor
  - - Public debt or project-finance facilities
    - null
    - Needed to bridge equity history to construction plans
    - Suggests major financing information is still private
    - Poor
