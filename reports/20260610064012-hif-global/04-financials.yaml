  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: company-performance
    missingEvidence: Current revenue, ARR, gross margin, and product-level contribution margin by project or molecule.
    whyItMatters: Without these metrics, the chapter cannot connect HIF’s operating and project proof to company-level earnings quality or self-funding capacity.
    diligencePath: Request monthly and trailing-twelve-month revenue by molecule, delivered cost, gross margin, and backlog conversion from management or lender materials.
    relatedQuestionRefs:
    - QI019
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: contract-economics
    missingEvidence: Signed pricing formulas, duration, volume commitments, take-or-pay terms, and counterparty credit terms for Shell/Porsche, Idemitsu, Mabanaft, and eFuel One pathways.
    whyItMatters: Framework announcements prove commercial interest but do not prove bankable or profitable revenue.
    diligencePath: Obtain signed term sheets or contract excerpts with volume ramps, indexation, compliance-premium treatment, and termination rights.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI007
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Cash on hand, burn, runway, project-finance facilities, lender commitments, recourse terms, and next-equity trigger by major project.
    whyItMatters: Project scale can only be judged relative to liquidity and financing structure, which are not public in the retained pack.
    diligencePath: Request latest treasury summary, debt schedule, committed financing sources, and stage-by-stage capex funding plan for Matagorda, Paysandú, and Tasmania.
    relatedQuestionRefs:
    - QI020
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: project-capex
    missingEvidence: A harmonized management schedule showing current capex budget, scope boundary, and revision history for Matagorda and Paysandú.
    whyItMatters: Public capex markers differ by source and date, which weakens any attempt to benchmark funding sufficiency or project returns.
    diligencePath: Request the latest board or FEED budget pack, including what changed between legacy and redesigned project configurations.
    relatedQuestionRefs:
    - QI009
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
