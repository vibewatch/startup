companyProfile:
  summary: HIF Global is a Chilean-rooted, Houston-linked e-fuels developer using renewable power, hydrogen, and recycled CO2 to produce e-methanol, e-gasoline, and future e-SAF for hard-to-abate transport. The company already operates the Haru Oni pilot in southern Chile, has strategic backing from AME, Porsche, EIG, Baker Hughes, Idemitsu, and JOGMEC-linked capital, and is advancing large projects in Texas, Uruguay, Australia, Brazil, and Chile. Public evidence supports a real platform with meaningful strategic optionality, but it still leaves current valuation, company-level financial performance, and bankable long-term contract depth unresolved.
  foundedDate: null
  foundingLocation: Chile
  headquarters: Punta Arenas, Chile and Houston, Texas, USA
  productSummary: Renewable e-methanol, e-gasoline, and future e-SAF produced from green hydrogen and recycled carbon dioxide, with Haru Oni as the pilot proof point and larger methanol-led export projects in development.
  customerFocus: Porsche and other premium lighthouse users today, with longer-term focus on shipping, aviation, European import markets, and other hard-to-abate transport customers.
  businessModel: Develop, finance, build, and operate large e-fuels projects, then monetize compliant molecules through direct fuel sales, strategic offtakes, and policy-linked low-carbon fuel pathways.
  stage: Late-stage private growth company with an operating pilot and commercial-scale projects in development
  fundingStatus: Approximately $260M disclosed in 2022 and $200M of additional disclosed 2024 funding, but no reliable current post-money valuation or full cap-table disclosure.
