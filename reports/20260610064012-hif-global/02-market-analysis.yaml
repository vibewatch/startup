- id: buyers-payers-and-adoption-paths
  title: Buyers, payers, and adoption paths
  body: 'The buyer, user, and payer map differs sharply by segment, which matters for HIF''s commercialization path. In maritime, the immediate user is the ship operator, but adoption economics sit with vessel owners, charterers, fuel suppliers, and cargo owners that increasingly care about regulated greenhouse-gas intensity and Scope 3 claims. HIF''s e-methanol positioning matters here because it can be used in methanol-engine ships without retrofit to a new molecule standard, and it can also be upgraded into other e-fuels if marine pricing weakens. In aviation, the end user is the airline, but the payer stack is more complex: airports, fuel suppliers, book-and-claim systems, certification bodies, and policy regimes such as CORSIA and EU rules influence who pays the green premium and who claims the emissions benefit. Germany and the wider EU are especially relevant because official policy is designed around hydrogen and derivative imports as well as domestic production. That increases the
    importance of auction access, certification status, and offtake structures. For HIF, the adoption path is therefore not simply ''produce fuel and sell it''; it is ''qualify the molecule, secure policy-compatible offtake, and route production toward the highest-value compliance or premium segment''.'
