  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som-visibility
    missingEvidence: A segment-by-segment view of HIF's serviceable market, contracted offtake volume, and realized pricing by end market.
    whyItMatters: Without disclosed contracted volumes and price formulas, public sources can frame the market but cannot isolate HIF's true SAM or SOM.
    diligencePath: Request project-by-project offtake agreements, customer concentration, pricing formulas, and any internally used addressable-market model.
    relatedQuestionRefs:
    - QM023
    - QM024
  - type: conflicting-data
    severity: material
    topic: paysandu-design-basis
    missingEvidence: A dated engineering basis explaining why HIF discloses Paysandú at both 700,000 and about 876,000 tonnes per year of e-methanol.
    whyItMatters: Project-size drift changes any bottom-up market or valuation lens built from HIF's own pipeline disclosures.
    diligencePath: Obtain the latest FEED or investor presentation showing current design throughput and the superseded prior figure.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: segment-level-unit-economics
    missingEvidence: Project-level assumptions for subsidy reliance, certification premia, and customer willingness to pay by shipping, aviation, and road segment.
    whyItMatters: The adverse evidence says e-fuels remain support-dependent, so valuation depends on private economics rather than on public TAM narratives.
    diligencePath: Request board or financing materials showing delivered-cost curves, subsidy assumptions, and contracted return thresholds by project.
    relatedQuestionRefs:
    - QM021
    - QM025
