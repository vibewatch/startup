- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to HIF
  rows:
  - - Maritime e-methanol
    - Renewable methanol molecule sales, bunker supply, compliance-linked marine fuel premia
    - Conventional bunker fuel, ship sales, most port infrastructure capex
    - Ship operators, bunker suppliers, charterers, cargo owners
    - Core near-term molecule market because HIF markets e-methanol directly into shipping
  - - Aviation e-SAF / MTJ
    - Synthetic aviation fuel, SAF certificates, book-and-claim attributes, compliant jet-fuel blends
    - General airline ticket revenue, aircraft OEM revenue, most airport capex
    - Airlines, fuel suppliers, airports, compliance/accounting counterparties
    - Major upside segment but likely reached through methanol-to-jet and certification pathways
  - - Road / motorsport e-gasoline
    - Synthetic gasoline for premium demonstrations, legacy-fleet decarbonization, selected compliance value
    - Mass-market EV charging, broad passenger-car electrification, conventional gasoline retail
    - Premium auto brands, motorsport buyers, specialty distributors
    - Real proof-of-product, but likely smaller long-run pool than shipping or aviation
  - - Hydrogen-derivative import market
    - Auction-supported imports of renewable hydrogen derivatives, including methanol and eSAF
    - Domestic electrolyzer equipment sales, pipeline-only hydrogen services
    - EU auctions, importers, industrial and transport offtakers
    - Important route to Europe because HIF is export-oriented and policy-access dependent
  - - Project-development services implicit in molecule sales
    - Value tied to certification, permits, project finance, and bankable offtake
    - Generic renewable-power development unrelated to fuels
    - Equity partners, lenders, strategic offtakers
    - Valuation depends on converting project milestones into saleable compliant molecules
  - - Excluded adjacencies
    - None beyond directly monetizable e-fuels and derivative markets
    - Broad hydrogen TAM, renewable-power TAM, carbon-capture TAM, all transport decarbonization spend
    - Not directly relevant
    - Needed to avoid overstating HIF with generic climate-market narratives
  notes: 'Boundary is intentionally narrow: it captures monetizable e-fuel molecules and compliance-linked value, not the full hydrogen or clean-power economy.'
