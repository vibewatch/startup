callouts:
- calloutType: insight
  title: The right market frame is methanol-led and policy-mediated
  body: 'HIF should not be valued off the whole hydrogen market. The stronger public evidence is a narrower wedge: synthetic liquid fuels sold into regulated or premium hard-to-abate transport uses, with e-methanol as the current commercial anchor and aviation as a conversion-led upside.'
  claimRefs:
  - CM001
  - CM006
  - CM007
  - CM025
  - CM042
  - CM043
- calloutType: risk
  title: Cost parity is still a distant event
  body: 'The adverse evidence is consistent across aviation and methanol pathways: current synthetic-fuel volumes are tiny, policy support is doing much of the demand-formation work, and independent cost work still shows e-fuels above fossil parity well into the future. That is the core market risk behind HIF’s project pipeline.'
  claimRefs:
  - CM015
  - CM016
  - CM034
  - CM035
  - CM036
  - CM037
  - CM045
- calloutType: assumption
  title: Europe matters more as offtake pull than as production site
  body: Germany’s import orientation, EU auction design, and SAF compliance structures all point to Europe as a premium demand center for HIF’s molecules. The open diligence question is whether those support structures persist long enough, and at large enough scale, to make HIF’s export projects bankable on attractive terms.
  claimRefs:
  - CM028
  - CM031
  - CM032
  - CM033
  - CM045
