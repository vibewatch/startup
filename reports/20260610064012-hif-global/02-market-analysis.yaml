company:
  name: HIF Global
chapter:
  number: 2
  title: Market Analysis
  summary: HIF Global's real market is not the whole hydrogen economy but the policy-shaped liquid e-fuels wedge inside shipping, aviation, and selected legacy-fuel uses. Public sources support strong long-run demand pull from SAF, RFNBO, and hydrogen-derivative policies, but they also show today's market is tiny, support-dependent, and still far from fossil-cost parity. For valuation, HIF should therefore be underwritten as a methanol-led project developer with segment optionality and policy leverage, not as a generic hydrogen TAM story.
sections:
- id: market-boundary-and-end-market-scope
  title: Market boundary and end-market scope
  body: 'HIF Global''s market boundary should be set at hydrogen-derived liquid e-fuels for hard-to-abate transport, not at the entire hydrogen economy or all clean-energy spending. HIF''s own product surface is explicit: today it markets e-methanol for maritime use, e-gasoline for existing combustion fleets, and a future e-SAF offering based on methanol-to-jet conversion. Its disclosed project pipeline is also molecule-first rather than software-like or equipment-vendor-like. Matagorda, Paysandú, and Tasmania are all framed around e-methanol production with downstream optionality into aviation or road fuels, while Haru Oni serves mainly as operational proof that the synthesis stack works. That means included spend is renewable methanol, renewable jet-fuel feedstock, RFNBO-compliant synthetic fuels, certification-linked compliance value, and project-backed offtake volumes. Excluded spend is broad renewable-power deployment, generic hydrogen infrastructure, most fossil methanol, and the much
    larger electrification market. The practical implication is that HIF should be benchmarked against power-to-liquid and hydrogen-derivative demand formation in transport, especially marine fuel and aviation decarbonization, rather than against a catch-all multi-trillion-dollar hydrogen TAM.'
