    body: "While Xendit touts relationships with high-profile platforms like Grab, Traveloka, and tiket.com, the absence of public Net Revenue Retention (NRR) cohorts or top-customer volume share creates meaningful uncertainty regarding revenue durability and contract re-pricing exposure."
