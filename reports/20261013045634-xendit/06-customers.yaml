chapter:
  number: 6
  title: "Customers"
  summary: "Xendit serves over 10,000 businesses across Southeast Asia, spanning enterprise giants like Grab, Traveloka, and tiket.com, regional platforms like Lazada, and thousands of SMBs and B2B marketplaces. However, public disclosures lack audited net revenue retention, merchant churn, and customer concentration data, leaving cohort durability and top-merchant risk as primary diligence gaps."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Segmentation and Buyer Personas"
    body: "Xendit serves a broad and structurally heterogeneous customer base across Southeast Asia, categorized across three primary segments: high-volume digital enterprises, multi-sided B2B marketplaces, and small-to-medium enterprises (SMEs). For large consumer-facing platforms such as Grab and Traveloka, Xendit functions as a critical processing engine for checkout card acceptance, virtual accounts, and large-scale disbursement rails. In the B2B marketplace and supply chain tier, platforms including Ula, Ralali, and GudangAda rely on Xendit's XenPlatform architecture to automate complex split payments, manage merchant sub-accounts, and enforce automated platform fee deductions. Finally, long-tail SMEs and regional e-commerce merchants adopt self-serve payment links and localized checkout methods. While enterprise clients drive the vast majority of gross processing volume at compressed take-rates, marketplace and SME cohorts deliver higher percentage fee margins and deeper operational lock-in."
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
    tableRefs:
      - TU001
  - id: "adoption-trajectory-and-scale-milestones"
    title: "Adoption Trajectory and Scale Milestones"
    body: "Xendit's adoption trajectory accelerated dramatically alongside Southeast Asia's rapid digitization, transitioning from a localized Indonesian payment gateway into a multi-market infrastructure platform. During its Series B milestone in 2020, the company disclosed processing over 65 million annualized transactions representing $6.5 billion in total payment volume (TPV), accompanied by a 540% year-on-year surge in customer accounts. More recent independent industry analysis indicates that Xendit's commercial footprint has expanded to support over 10,000 businesses across Indonesia, the Philippines, Malaysia, Thailand, and Vietnam. However, public disclosures do not disaggregate active transacting merchants from dormant accounts, nor do they report current net revenue or average transaction value trends. Diligence requires evaluating the bridge between historical TPV figures and modern cohort contribution to establish true underlying commercial velocity."
    claimRefs:
      - CU002
      - CU003
      - CU010
    tableRefs:
      - TU002
  - id: "named-customer-evidence-and-vertical-deployments"
    title: "Named Customer Evidence and Vertical Deployments"
    body: "Production deployments across prominent regional brands substantiate Xendit's operational capabilities across demanding vertical use cases. In the online travel and entertainment vertical, tiket.com successfully leveraged Xendit's gateway to handle high-concurrency 17x traffic spikes during flash sales, maintaining transactional stability when legacy banking rails experienced congestion. In hospitality, Bali-based hotel operator Dijiwa Sanctuaries documented a 90% reduction in settlement cycle turnaround by replacing manual bank reconciliations with automated payout flows. Similarly, digital gaming marketplace VCGamers reported consistent payment completion rates exceeding 95% during peak evening transaction hours. In the Philippines, the strategic integration of Dragonpay expanded Xendit's footprint by connecting 905 merchants and 44 financial institutions, establishing alternative payment access for millions of unbanked consumers. These case studies demonstrate production readiness, though third-party performance audits remain confidential."
    claimRefs:
      - CU004
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: "customer-journey-and-cross-border-expansion-loops"
    title: "Customer Journey and Cross-Border Expansion Loops"
    body: "The merchant lifecycle on Xendit reflects a deliberate progression from localized single-channel checkout to integrated regional expansion and multi-product lock-in. Merchants typically enter the platform through developer-friendly documentation and sandbox testing, initiating acceptance via domestic virtual accounts, QRIS, and e-wallets. As transaction scale expands, merchants unlock automated batch disbursements, customized fraud mitigation rules, and sub-account marketplace routing. The subsequent expansion phase enables businesses to access cross-border corridors across the Philippines, Malaysia, Thailand, and Vietnam without establishing separate banking entities in each country. Ultimately, advanced retention is cemented through working capital financing, early settlement options, and banking-as-a-service modules. This land-and-expand trajectory creates substantial barriers to displacement, mitigating competitive threats from global processors like Stripe that maintain broader global presence but lack equivalent domestic payment rail depth."
    claimRefs:
      - CU005
      - CU006
      - CU013
      - CU014
    figureRefs:
      - FU001
  - id: "retention-durability-and-concentration-headwinds"
    title: "Retention Durability and Concentration Headwinds"
    body: "Despite widespread brand adoption across Southeast Asia, Xendit faces structural durability and customer concentration risks that warrant rigorous investment scrutiny. Because low credit card penetration (approximately 3%) forces reliance on fragmented local payment methods, enterprise merchants routinely multi-home across multiple gateways—such as Midtrans, DOKU, and 2C2P—to ensure route redundancy and negotiate lower transaction processing fees. This dynamic creates persistent margin compression on enterprise contracts. Furthermore, Xendit has never publicly disclosed merchant cohort churn, Gross Revenue Retention (GRR), or Net Revenue Retention (NRR). Without audited merchant retention schedules or disclosures on top-10 customer concentration, investors cannot determine whether ongoing volume expansion reflects genuine net expansion within established cohorts or aggressive top-of-funnel customer acquisition masking underlying SME attrition."
    claimRefs:
      - CU002
      - CU004
      - CU013
      - CU014
