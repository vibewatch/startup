company:
  name: "Xendit"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Xendit is a Jakarta-founded digital payment infrastructure platform that scaled across Southeast Asia through unified API integrations, reaching unicorn status in 2021 with $538 million in cumulative venture capital. Led by CEO Moses Lo and COO Tessa Wijaya, the company processed over $25 billion in total payment volume in 2023 while actively expanding its footprint across Indonesia, the Philippines, Thailand, and Malaysia."
sections:
  - id: "corporate-identity-and-foundations"
    title: "Corporate Identity, Operating Footprint, and Business Model"
    body: "Founded in 2015 by Moses Lo, Tessa Wijaya, Bo Chen, and Juan Gonzalez, Xendit has established itself as a leading B2B financial technology platform headquartered in Jakarta, Indonesia. The company addresses the structural fragmentation of Southeast Asian payment systems, where consumer reliance on cash, bank transfers, and local digital wallets historically exceeded international credit card penetration. By consolidating more than 100 disparate local payment rails—including virtual accounts, direct bank transfers, e-wallets, retail outlets, and credit cards—into a single API integration, Xendit enables digital enterprises, online marketplaces, and small-to-medium businesses to process domestic and cross-border commercial transactions smoothly. The company generates revenue primarily through fee-per-transaction models, charging variable percentages and fixed per-transaction fees tailored to specific payment methods, while supplementing its core payments engine with automated payouts, risk management, and value-added merchant financing tools."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Coverage"
    body: "Xendit is led by co-founder and Chief Executive Officer Moses Lo, a graduate of UNSW and UC Berkeley Haas, and co-founder and Chief Operating Officer Tessa Wijaya, who also serves as the chief executive officer of Xendit Thailand. The core leadership team is complemented by co-founders Bo Chen, who directs payments technology architecture, and Juan Gonzalez, who spearheads complex systems engineering and developer API interfaces. Together, the founding team brings complementary strengths in Southeast Asian commercial banking dynamics, regional regulatory navigation, and scalable fintech software engineering. Governance is reinforced by executive representation across major operating jurisdictions and a corporate culture emphasizing high-velocity customer alignment. Although key-person dependency remains concentrated in the founding executive pair—particularly around high-stakes regulatory relationships with central banks and regional expansion partnerships—Xendit has institutionalized functional management across regional market general managers and automated sales operations."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-history-and-scale-milestones"
    title: "Capitalization History, Institutional Backing, and Strategic Milestones"
    body: "Xendit has raised $538 million in cumulative venture capital equity across five institutional funding rounds. The company initially graduated from Y Combinator in August 2015 as the first Indonesian startup accepted into the Silicon Valley accelerator, securing $120,000 in seed capital. It accelerated institutional fundraising in March 2021 with a $64.6 million Series B led by Accel, followed six months later by a $150 million Series C led by Tiger Global Management that elevated the business to unicorn status with an official $1 billion valuation. In May 2022, Coatue and Insight Partners co-led a $300 million Series D financing with continued participation from Accel, Kleiner Perkins, and Tiger Global. These balance-sheet resources supported aggressive multi-market geographical rollouts, including expanding operations into Thailand in 2024, deploying cross-border multi-currency payouts across Asian currencies in 2025, and completing the strategic regional integration of Philippine payments leader Dragonpay in July 2026."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "operational-scale-and-diligence-gaps"
    title: "Commercial Traction, Scale Trajectory, and Diligence Considerations"
    body: "At peak reported operating milestones, Xendit processed more than 320 million transactions and $25 billion in total payment volume (TPV) annually while serving an active base exceeding 6,000 merchants across Southeast Asia, spanning enterprise clients such as Grab, Wise, Traveloka, and regional marketplaces. However, thorough institutional diligence requires evaluating significant transparency gaps. As a privately held venture-backed enterprise, Xendit does not publicly disclose audited annual net revenues, annual recurring revenue (ARR), net take rates, or unit-level gross margins after payment rail partner pass-through costs. Furthermore, independent analyses highlight that while Xendit holds deep local dominance in Southeast Asian alternative payment integrations, global competitors like Stripe maintain broader worldwide coverage and more advanced developer feature suites. Prospective investors and diligence assessors must obtain audited financial statements, interchange fee schedules, and verified customer retention data to evaluate whether current private marks reflect sustainable operating profitability."
    claimRefs:
      - "CO003"
      - "CO010"
      - "CO014"
      - "CO015"
