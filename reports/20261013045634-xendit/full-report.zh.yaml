        title: 核心产品模块与企业工作流
        blocks:
          - type: paragraph
            body: >-
              核心产品组合覆盖数字商业资金流动的端到端运营生命周期。Pay-In 模块通过单一整合支持超过 100 种本地支付方式，并按商户所在地区和消费者可用支付工具动态路由交易。对高交易量企业商户而言，Xendit
              的自动虚拟账户引擎是关键运营能力。在现金和转账占主导的经济体，买方过去需要手动发起银行转账，商户运营团队再检查银行对账单或上传的收据。Xendit
              为每笔购买交易分配唯一、程序化生成的虚拟账号，银行入账后立即确认付款，并向商户后端发布实时 webhook 事件。除收款外，Xendit
              的付款引擎还能自动向银行账户和电子钱包进行单笔及批量付款，让平台市场以接近实时的结算速度向供应商支付款项、零工工资和退款。该能力以自动 API 转账取代手工批量汇款，降低跨境平台市场物流摩擦。
