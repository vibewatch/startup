        title: 展示材料
        blocks:
          - type: callout
            title: 区域基础设施先行者版图
            body: Xendit 已在印度尼西亚、菲律宾、泰国和马来西亚建立直接整合，形成覆盖多市场的支付护城河，直面碎片化的国内银行和电子钱包通道。
            calloutType: strength
