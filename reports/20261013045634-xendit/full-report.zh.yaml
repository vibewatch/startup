      - number: '5.3'
        title: 基础设施韧性、通道掌控与银行故障切换
        blocks:
          - type: paragraph
            body: >-
              Xendit 的一个基础技术差异在于主动掌控底层通道整合，而不是转售第三方聚合商的访问权限。由于东南亚支付可靠性经常在银行网关处出问题，不能只用云端运行时间评估平台可用性。在印度尼西亚，Xendit
              并行连接最多七条独立商业银行通道。当某家银行核心系统或国内交换机发生宕机、性能下降或维护中断时，Xendit 的路由层会自动将支付流切换到仍在运行的备用银行连接，保持商户处理连续性。2023 年 5 月 Bank
              Syariah Indonesia 遭 LockBit 勒索软件攻击时，这种多连接路由发挥了关键作用：主银行瘫痪期间，Xendit 成功把商户交易转到其他银行通道。此外，直接掌控通道和收单角色让 Xendit
              能提供转售商无法提供的高级异常处理，例如印度尼西亚的自动原生 QRIS 退款，以及菲律宾最长覆盖 180 天的程序化 GCash 部分退款。
