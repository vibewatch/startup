companyProfile:
  summary: >-
    Xendit 是一家面向东南亚支付体系碎片化问题的私营支付基础设施公司。它提供统一
    API，覆盖商户收款、付款、周期性计费、反欺诈工具和平台市场工作流，业务遍及印度尼西亚、菲律宾、泰国、马来西亚及周边市场，并已开始向拉丁美洲延伸。公司已具备真实运营规模，也得到大型机构支持，但公开记录仍未充分说明其当前经济性和客户集中度。
