  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与基础设施边界
        blocks:
          - type: paragraph
            body: >-
              东南亚数字支付基础设施的可服务市场包括软件驱动的支付受理、多渠道付款、周期性订阅计费和增值风险管理服务。与信用卡和借记卡网络主导交易结算的发达市场不同，东南亚信用卡渗透率约为 3%，商业企业不得不在 100
              多种区域支付方式之间进行编排，包括国内银行虚拟账户、电子钱包和央行 QR 通道。市场边界明确包括印度尼西亚、菲律宾、泰国和马来西亚的企业及中小企业软件支出，涵盖自动网关整合、欺诈缓解、托管基础设施和开发者优先的
              API 连接。不可服务支出包括货到付款物流、非正式且不受监管的点对点商业，以及脱离软件中介商业流程的传统银行间批发结算网络。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.2'
        title: 市场规模与增长动力
        blocks:
          - type: paragraph
            body: >-
              东南亚数字经济的宏观规模估算显示其快速扩张：截至 2025 年底，覆盖 600 million 人口、合计 GDP 为 $3 trillion 的可服务市场约超过 $300
              billion，独立预测预计区域交易活动将超过 $360 billion。在这一宏观环境下，B2B 支付网关交易量由快速数字化和实时银行连接推动。Xendit 已取得可观的国内市场份额，年处理额达 $47.3
              billion，服务超过 15,200 家活跃商户，估计触及印度尼西亚 GDP 的 3% 和菲律宾 GDP 的 5%。但必须严格把处理总额与可服务软件收入分开：支付网关费率通常在 0.5% 到 3.0%
              之间，取决于通道组合；底层银行交换费和网络转付费用会压缩净软件收入。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM014
      - number: '2.3'
        title: 买方细分与采购路径
        blocks:
          - type: paragraph
            body: >-
              东南亚支付基础设施买方可分为三类主要商业客户：企业级消费平台和跨国公司、中型 SaaS
              与周期性计费服务商、数字化中小企业。区域旅游平台、电信公司和酒店集团等企业买方优先考虑高交易吞吐量、多银行路由冗余、自动多实体对账，以及跨碎片化监管辖区的跨境付款。这类企业采购周期通常为 1 至 18
              个月，需要财务、工程和合规团队多部门签字。相反，中小企业和数字初创公司需要自助式开户、零设置费和即插即用的结账链接，以接受本地电子钱包，而不必维护专门的支付工程基础设施。
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              政府支持的实时支付现代化正在加速现代支付基础设施的采用，包括印度尼西亚的 QRIS 和 BI-FAST，以及马来西亚的 DuitNow；这些通道超过信用卡采用速度，迫使传统商户转向实时数字通道。订阅和 SaaS
              商业模式还需要稳健的自动恢复机制，以避免区域支付方式过期或银行清算超时造成的非自愿流失。另一方面，利润率压力加剧、切换成本下降，也限制了采用：现代 AI 辅助工程和标准化 API 整合让商户越来越容易采用多
              PSP 冗余，在多个支付处理商之间路由交易，以降低平台依赖并争取更激进的交易费折扣。
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 区域通道掌控与薄利转售
            body: >-
              与 Visa 和 Mastercard 双寡头主导的西方市场不同，东南亚支付格局的特点是信用卡渗透率仅
              3%，本地清算通道普遍存在（QRIS、DuitNow、银行虚拟账户）。拥有直接银行整合和央行牌照，可对单纯转售第三方通道的软件聚合商形成结构性护城河。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM009
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代结算通道
        blocks:
          - type: paragraph
            body: >-
              东南亚数字支付格局高度碎片化，区域新兴市场信用卡渗透率估计约 3%，同时严重依赖虚拟账户、电子钱包、二维码和直接银行通道 [CP001,
              CP002]。在这一市场架构下，商户替代方案分为五个竞争层级：全球跨境编排商、本地区域网关、国内银行既有门户、电子钱包封闭生态，以及内部自建工程 [CP003]。Stripe 和 Adyen
              等全球处理商具备广泛国际规模、全球卡清算和先进的多币种资金管理能力，但过去在东南亚高度本地化的国内支付体系中整合摩擦较大 [CP004, CP005]。Xendit、2C2P 和 Midtrans
              等区域专家通过统一商户 API 抽象数百条分散清算通道，弥补这一基础设施缺口 [CP006]。不过，商户仍需在选择全球统一服务商和管理本地区域网关之间取舍，并经常同时接入多个网关，以降低宕机风险、优化本地交易路由
              [CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
