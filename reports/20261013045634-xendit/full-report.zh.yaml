      - number: '4.2'
        title: 定价结构与收费机制
        blocks:
          - type: paragraph
            body: >-
              Xendit 的变现框架依靠公开价目表，费率随支付通道、交易量和区域收单基础设施而显著变化。卡处理的标准公开价为：国内信用卡 3.0% 加 $0.80，国际卡 4.0% 加
              $0.80，反映跨境收单更高的处理成本和欺诈责任。相反，印度尼西亚虚拟账户和直接银行转账等本地新兴市场支付方式收费较低，分别为 0.5% 加 $0.20 和 2.13% 加 $0.60；全国 QRIS 支付收费为
              0.7% 加 $0.20。尽管这些费率是标准开户的公开基础价目，大型企业商户和平台聚合商仍会根据月度支付总量及具体通道路由安排，协商定制的分层费率。
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
