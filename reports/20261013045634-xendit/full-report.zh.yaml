            body: 随着企业商户在东南亚扩张，同时接入多个支付网关已成为常态，以对冲可用性风险并优化路由成本 [CP007, CP015]。这一动态削弱服务商的定价权，使交易费用持续承受激烈竞争带来的利润率下压 [CP016]。
