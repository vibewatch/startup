  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与整合界面
        blocks:
          - type: paragraph
            body: >-
              Xendit 提供专为东南亚碎片化货币体系设计的企业支付基础设施。在卡渗透率低、国内清算机制占主导的市场，平台以开发者为中心，把分散的本地支付通道藏在标准化 REST API、SDK
              和现成托管结账流程之后。商户不必与数十家区域银行和非银行发行机构逐一谈判商业条款、维护定制 socket 级整合；Xendit
              充当智能编排层。平台统一印度尼西亚、菲律宾、泰国、马来西亚、越南、新加坡和香港的信用卡、国内银行转账、虚拟账户、QR 体系、电子钱包及便利店零售连锁收款。对于数字平台和平台市场，xenPlatform
              支持多租户商户开户、自动分账和可编程托管余额。商户可以通过 Shopify、WooCommerce 等主流平台的插件快速接入，也可以使用客户端 SDK 和 webhook 通知流部署全栈自定义结账流程。
