chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Xendit 由 Moses Lo、Tessa Wijaya、Bo Chen 和 Juan Gonzalez 于 2015 年创立，总部位于印度尼西亚雅加达，已成为领先的 B2B
              金融科技平台。公司解决的是东南亚支付体系的结构性碎片化问题：历史上，当地消费者对现金、银行转账和本地数字钱包的依赖远高于国际信用卡的渗透率。Xendit 把虚拟账户、直接银行转账、电子钱包、零售网点和信用卡等
              100 多条分散的本地支付通道整合进单一
              API，帮助数字企业、线上平台市场和中小企业顺畅处理境内及跨境商业交易。公司主要按每笔交易收费，针对不同支付方式收取可变比例费率和固定交易费，同时以自动付款、风险管理和增值商户融资工具补充核心支付引擎。
            claimRefs:
              - CO001
              - CO003
              - CO014
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO010
      - number: '1.2'
        title: 高管领导、治理与关键人物覆盖
        blocks:
          - type: paragraph
            body: >-
              Xendit 由联合创始人兼首席执行官 Moses Lo 领导；他毕业于 UNSW 和 UC Berkeley Haas。联合创始人兼首席运营官 Tessa Wijaya 同时担任 Xendit Thailand
              的首席执行官。核心管理团队还包括负责支付技术架构的联合创始人 Bo Chen，以及主导复杂系统工程和开发者 API 接口的 Juan
              Gonzalez。创始团队在东南亚商业银行业务、区域监管应对和可扩展金融科技软件工程方面各有所长。公司在主要运营辖区配置高管代表，并以快速响应客户为文化重点，进一步强化治理。关键人物依赖仍集中在两位创始高管身上，尤其涉及与央行的重要监管关系及区域扩张伙伴关系；但
              Xendit 已把职能管理下沉至各区域市场总经理，并实现销售运营自动化。
            claimRefs:
              - CO001
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO011
      - number: '1.3'
        title: 资本化历程、机构支持与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Xendit 通过五轮机构融资累计募集 $538 million 风险投资股权。公司于 2015 年 8 月从 Y Combinator 毕业，成为首家进入该硅谷加速器的印度尼西亚初创公司，并获得
              $120,000 种子资金。2021 年 3 月，公司在 Accel 领投的 $64.6 million Series B 中加快机构融资；六个月后，Tiger Global Management 领投的
              $150 million Series C 将公司估值推至 $1 billion，成为独角兽。2022 年 5 月，Coatue 和 Insight Partners 联合领投 $300 million
              Series D，Accel、Kleiner Perkins 和 Tiger Global 继续跟投。这些资产负债表资源支持了激进的多市场扩张，包括 2024 年进入泰国、2025
              年在亚洲货币间部署跨境多币种付款，以及 2026 年 7 月完成对菲律宾支付领导者 Dragonpay 的战略区域整合。
