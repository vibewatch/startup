      - number: '4.3'
        title: 单位经济性、成本结构与利润率代理指标
        blocks:
          - type: paragraph
            body: >-
              评估 Xendit 的真实单位经济性，必须把交易总吞吐量与扣除合作方转付费用后的净留存收入分开。由于东南亚新兴市场信用卡渗透率低于
              5%，商户交易量高度集中在银行虚拟账户、直接银行转账和本地数字钱包。每笔交易经过这些通道时，Xendit
              都要支付网络交换费、银行合作方结算成本和移动钱包服务商佣金，直接压缩核心收单的实际毛利率。与此同时，市场进入投资要求持续优化销售流程；实施数据表明，CRM 流程改造使销售赢单率提高 8%，企业销售周期缩短
              15%，负责长周期企业交易的客户代表效率提升 25%。
            claimRefs:
              - CI005
              - CI006
              - CI013
