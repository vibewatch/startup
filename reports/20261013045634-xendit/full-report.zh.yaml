              架构自动处理复杂分账、管理商户子账户并自动扣除平台费。长尾中小企业和区域电商商户则采用自助支付链接与本地化结账方式。企业客户贡献绝大部分毛处理量但费率被压低；平台市场和中小企业客群的比例收费利润更高，运营锁定也更深。
