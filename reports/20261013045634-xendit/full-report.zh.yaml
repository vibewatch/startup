      - number: '5.4'
        title: 安全控制、清算依赖与下一代通道
        blocks:
          - type: paragraph
            body: >-
              企业采用受机构级监管牌照、数据安全协议和严格的欺诈风险缓解机制约束。Xendit 在 7 个亚太辖区持有直接本地支付牌照，包括新加坡金融管理局颁发的 Major Payment Institution 牌照和香港
              Money Service Operator 牌照。这些牌照赋予公司直接结算和清算权，降低对中介交易对手的暴露。平台采用机器学习反欺诈、3D Secure
              验证和基于角色的访问管理来保护交易数据。但结构性技术风险仍在：Xendit 依赖 BI-FAST、PromptPay 和 DuitNow
              等国家级实时支付交换机；央行清算交换机的系统性故障超出任何网关的故障切换控制范围。在未来技术路线图上，Xendit 正通过加入 2026 年 5 月推出的 Open Transaction Layer
              协议，解决国际结算摩擦，统一链上交易协调和企业稳定币通道，以实现持续、实时的跨境结算。
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
