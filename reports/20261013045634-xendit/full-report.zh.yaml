              - CP006
              - CP010
      - number: '3.2'
        title: 能力分析、功能对等与结构性取舍
        blocks:
          - type: paragraph
            body: >-
              技术能力比较显示，各家在区域结算覆盖、开发者开户工具、欺诈防范和增值融资服务方面存在明显运营差异 [CP008]。Xendit 支持超过 100
              种区域支付方式，提供原生虚拟账户生成、即时付款和本地化合规工具，覆盖印度尼西亚、菲律宾、泰国和马来西亚 [CP006, CP009]。相比之下，Stripe
              等全球既有企业在开发者文档、跨境多币种卡清算和自动订阅计费方面表现突出，但对东南亚细分支付体系依赖第三方聚合商或较慢的推出节奏 [CP004,
              CP010]。国内银行通道和直接电子钱包整合可为大型企业提供较低支付处理费，却带来繁重的点对点维护、不同的对账格式和手工结算流程 [CP003,
              CP011]。因此，高交易量数字商户必须在维护直接银行连接的行政负担，与独立支付网关提供的开发者友好抽象和运营整合之间权衡 [CP012]。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: 变现模式、切换摩擦与可防御性
        blocks:
          - type: paragraph
            body: >-
              东南亚支付网关的定价和套餐呈现出固定费国内交易与按比例收取卡处理费两种不同的商业策略 [CP013]。Xendit 收取可变交易费，不另收周期性维护费用：国内卡为 3.0% 加 $0.80，国际卡为 4.0% 加
              $0.80，电子钱包为 2.70% 加 $0.40，银行转账为 2.13% 加 $0.60，虚拟账户为 0.5% 加 $0.20，印度尼西亚 QR 支付为 0.7% 加 $0.20
              [CP014]。支付基础设施的切换成本在结构上较高，原因包括复杂 API 整合、自动 webhook 配置和客户支付方式令牌化
              [CP015]。然而，企业多平台接入趋势及数字支付通道标准化，会对核心处理利润率形成商品化压力；若全球支付网络补贴区域进入，网关毛利将面临风险 [CP016]。Xendit
              通过区域生态锁定守住地位，例子包括收购并整合菲律宾平台 Dragonpay，以及与 Bank Sahabat Sampoerna 等本地银行建立合作 [CP009, CP017]。
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 本地通道可防御性与虚拟账户优势
            body: >-
              在信用卡渗透率仍约为 3% 的东南亚新兴市场，数字商业高度依赖虚拟账户和电子钱包等替代通道 [CP001]。Xendit
              的可防御性不只来自软件，更来自深厚的监管和双边银行连接；这些连接能在碎片化的国家体系间自动完成实时匹配和对账 [CP006, CP008]。
