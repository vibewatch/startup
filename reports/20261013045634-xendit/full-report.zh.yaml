      - number: '1.4'
        title: 商业牵引力、规模轨迹与尽调要点
        blocks:
          - type: paragraph
            body: >-
              在已报道的运营里程碑峰值，Xendit 每年处理超过 320 million 笔交易和 $25 billion 总支付额（TPV），服务东南亚超过 6,000 家活跃商户，其中包括
              Grab、Wise、Traveloka 及区域平台市场。不过，全面机构尽调仍需评估明显的透明度缺口。作为一家私营、风险投资支持的企业，Xendit
              未公开披露经审计的年度净收入、年度经常性收入（ARR）、净费率，或扣除支付通道合作方转付成本后的单位层面毛利率。此外，独立分析指出，Xendit 在东南亚替代支付整合领域拥有深厚的本地优势，但 Stripe
              等全球竞争者覆盖更广，开发者功能套件也更成熟。潜在投资者和尽调人员必须取得经审计财务报表、交换费率表及经核实的客户留存数据，才能判断当前私人市场估值是否对应可持续的运营盈利能力。
            claimRefs:
              - CO003
              - CO010
              - CO014
              - CO015
