              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: 资本充足性、融资依赖与投资判断
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，Xendit 于 2022 年 5 月通过获得 $300 million Series D 风险投资建立了充足流动性储备，在 Coatue 和 Insight Partners
              支持下使累计股权融资达到 $538 million。到 2021 年底，公司已展示出快速扩张：年化交易量从 65 million 增至 200 million，总支付额从 $6.5 billion 增至 $15
              billion。然而，Hurun Global Unicorn List 于 2026 年 6 月给出的 20.5 billion RMB 私人市场估值，以及 EquityZen
              等平台的二级交易挂牌，都缺乏经核实的财务披露。由于经审计的净收入、现金消耗率和毛利率仍严格保密，要评估资本续航，必须直接取得管理层保密账目，以核实 2022 年之后现金流是否自给。
