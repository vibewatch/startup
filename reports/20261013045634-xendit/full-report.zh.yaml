  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与核心变现
        blocks:
          - type: paragraph
            body: >-
              Xendit 的核心商业模式是在东南亚提供按交易收费的支付处理：免除前期软件整合成本和月度平台维护最低收费，改为按笔交易收费。平台把 100
              多种本地支付方式聚合到统一编程接口，为印度尼西亚、菲律宾、泰国、马来西亚和越南的企业、小型企业及电商平台服务。交易收单是基础收入引擎，但 Xendit
              已通过扩展跨境付款、自动周期性订阅计费，以及发票融资和营运资金额度等增值中小企业信贷方案，实现收入多元化。多产品扩张让 Xendit
              能从高速增长的数字企业获取更多钱包份额，并在国内银行网络和商户平台之间建立交叉销售渠道。
            claimRefs:
