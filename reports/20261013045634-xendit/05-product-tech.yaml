chapter:
  number: 5
  title: "Product & Technology"
  summary: "Xendit provides a unified B2B payment infrastructure platform across Southeast Asia that abstracts fragmented domestic clearing rails into a single API suite. Rather than acting solely as an aggregator, the company operates direct bank connectors and localized payment licenses in seven regional markets to enable multi-connector failover routing, automated virtual account reconciliation, and cross-border disbursements."
sections:
  - id: "architecture-overview"
    title: "Platform Architecture & Integration Surface"
    body: "Xendit delivers enterprise payments infrastructure designed specifically for the fragmented monetary systems of Southeast Asia. In markets where card penetration remains low and domestic clearing mechanisms dominate, the platform exposes a developer-centric interface that abstracts disparate local payment rails behind standardized REST APIs, SDKs, and off-the-shelf hosted checkout workflows. Rather than forcing merchants to negotiate bilateral commercial terms and maintain bespoke socket-level integrations with dozens of regional banks and non-bank issuers, Xendit acts as an intelligent orchestration layer. The platform unifies pay-ins across credit cards, domestic bank transfers, virtual accounts, QR schemes, e-wallets, and convenience store retail chains across Indonesia, the Philippines, Thailand, Malaysia, Vietnam, Singapore, and Hong Kong. For digital platforms and marketplaces, xenPlatform provides multi-tenant merchant onboarding, automated fee splitting, and programmable escrow balances. Merchants can implement turnkey integrations via plugins for major platforms like Shopify and WooCommerce or deploy full-stack custom checkout pipelines using client-side SDKs and webhook notification streams."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE008"
      - "CE013"
    tableRefs: []
    figureRefs:
      - "FE001"
  - id: "product-modules-workflows"
    title: "Core Product Modules & Enterprise Workflows"
    body: "The core product portfolio addresses the end-to-end operational lifecycle of money movement in digital commerce. The Pay-In module supports more than 100 localized payment methods through a single integration, dynamically routing transactions according to merchant geography and consumer instrument availability. A critical operational capability for high-volume enterprise merchants is Xendit's automated virtual account engine. In cash- and transfer-heavy economies, buyers historically initiated manual bank transfers that required merchant operations teams to inspect bank statements or review uploaded receipts. Xendit assigns unique, programmatically generated virtual account numbers to individual purchase transactions, immediately confirming payment upon bank credit and publishing real-time webhook events to merchant backends. Beyond acceptance, Xendit's disbursement engine automates single and bulk payouts to bank accounts and e-wallets, enabling marketplaces to disburse vendor proceeds, gig-economy wages, and refund distributions with near real-time settlement speed. This payout capability reduces friction in cross-border marketplace logistics by replacing manual batch wires with automated API transfers."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE007"
      - "CE008"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs: []
  - id: "resilience-failover"
    title: "Infrastructure Resilience, Rail Ownership & Bank Failover"
    body: "A foundational technical differentiator for Xendit is its deliberate strategy of owning underlying rail integrations rather than reselling access to third-party aggregators. Because payment reliability in Southeast Asia frequently breaks down at the bank gateway level, platform availability cannot be evaluated solely through cloud uptime. In Indonesia, Xendit connects to up to seven separate commercial bank rails in parallel. When an individual bank core or domestic switch suffers downtime, degradation, or maintenance outages, Xendit's routing layer automatically shifts payment flows to alternate functioning bank connections to preserve merchant processing continuity. This multi-connector routing proved critical during the May 2023 LockBit ransomware attack against Bank Syariah Indonesia, where Xendit successfully redirected merchant transactions to alternative bank rails while the primary bank was crippled. Furthermore, direct rail ownership and acquiring roles allow Xendit to offer advanced exception handling that resellers cannot provide, such as automated native QRIS refunds in Indonesia and programmatic GCash partial refunds spanning up to 180 days in the Philippines."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs: []
  - id: "technical-risks-roadmap"
    title: "Security Controls, Clearing Dependencies & Next-Generation Rails"
    body: "Enterprise adoption is governed by institutional-grade regulatory licensing, data security protocols, and strict fraud risk mitigation. Xendit maintains direct local payment licenses across seven APAC jurisdictions, including a Major Payment Institution license from the Monetary Authority of Singapore and a Money Service Operator license in Hong Kong. These licenses give the company direct settlement and clearing rights, reducing intermediary counterparty exposure. The platform incorporates machine-learning fraud detection, 3D Secure verification, and role-based access management to safeguard transaction data. Nevertheless, structural technical risks persist because Xendit remains dependent on national real-time payment switches like BI-FAST, PromptPay, and DuitNow; systemic failures at central bank clearing switches fall outside any gateway's failover controls. On its forward technology roadmap, Xendit is addressing international settlement friction by joining the Open Transaction Layer protocol launched in May 2026, standardizing on-chain transaction coordination and enterprise stablecoin rails to facilitate continuous, real-time cross-border settlements."
    claimRefs:
      - "CE006"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs: []
    figureRefs: []
