callouts:
  - calloutType: "strength"
    title: "Direct Rail Connectivity and Redundant Multi-Bank Routing"
    body: "Xendit's core technical moat lies in its direct host-to-host bank integrations and multi-connector failover logic. By maintaining up to seven parallel bank routes in primary markets like Indonesia, Xendit can steer live transactions away from upstream banking outages, as demonstrated during the 2023 Bank Syariah Indonesia ransomware incident."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "External Rail Concentration and Upstream Clearing Dependencies"
    body: "Although Xendit engineers multiple software failover paths, its overall processing continuity remains bounded by national payment switches and central bank clearing systems. In markets with emerging instant-payment networks, widespread central bank or tier-1 partner bank outages cannot be entirely resolved by gateway-level software redundancy."
    claimRefs:
      - "CE007"
      - "CE011"
