companyProfile:
  summary: >-
    Xendit is a private payments infrastructure company built for fragmented Southeast Asian rails. It offers a unified
    API for merchant acceptance, payouts, recurring billing, fraud tools, and marketplace workflows across Indonesia,
    the Philippines, Thailand, Malaysia, and adjacent markets, and it has begun extending that platform into Latin
    America. The business has real operating scale and strong institutional backing, but the public record still leaves
    the company’s current economics and concentration profile opaque.
  founders:
    - name: Moses Lo
      role: Co-founder and Chief Executive Officer
      background: Former Amazon and BCG operator focused on executive leadership, fundraising, and regulator-facing strategy.
    - name: Tessa Wijaya
      role: Co-founder and Chief Operating Officer
      background: Regional operations and compliance leader with responsibility across market execution and Thailand leadership.
    - name: Bo Chen
      role: Co-founder and Chief Technology Officer
      background: Payments technology architect responsible for core platform and routing architecture.
    - name: Juan Gonzalez
      role: Co-founder and Software Architect
      background: Engineering leader focused on APIs, systems resiliency, and developer experience.
  foundingLocation: Jakarta, Indonesia
  headquarters: Jakarta, Indonesia
  productSummary: >-
    Unified payment infrastructure API covering merchant acceptance, payouts, billing, marketplace tooling, risk
    controls, and local payment method orchestration.
  customerFocus: Digital merchants, marketplaces, SaaS businesses, and enterprise platforms operating in Southeast Asia.
  businessModel: Transaction fees plus value-added services such as payouts, billing, fraud tools, and merchant financing.
  stage: Series D / late private
