      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Coverage
        blocks:
          - type: paragraph
            body: >-
              Xendit is led by co-founder and Chief Executive Officer Moses Lo, a graduate of UNSW and UC Berkeley Haas,
              and co-founder and Chief Operating Officer Tessa Wijaya, who also serves as the chief executive officer of
              Xendit Thailand. The core leadership team is complemented by co-founders Bo Chen, who directs payments
              technology architecture, and Juan Gonzalez, who spearheads complex systems engineering and developer API
              interfaces. Together, the founding team brings complementary strengths in Southeast Asian commercial
              banking dynamics, regional regulatory navigation, and scalable fintech software engineering. Governance is
              reinforced by executive representation across major operating jurisdictions and a corporate culture
              emphasizing high-velocity customer alignment. Although key-person dependency remains concentrated in the
              founding executive pair—particularly around high-stakes regulatory relationships with central banks and
              regional expansion partnerships—Xendit has institutionalized functional management across regional market
              general managers and automated sales operations.
