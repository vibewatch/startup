      - number: '2.3'
        title: Buyer Segmentation and Procurement Path
        blocks:
          - type: paragraph
            body: >-
              Buyer personas for Southeast Asian payments infrastructure divide into three principal commercial
              categories: enterprise consumer platforms and multinationals, mid-market SaaS and recurring billing
              providers, and digital small-to-medium enterprises. Enterprise buyers—such as regional travel platforms,
              telcos, and hospitality conglomerates—prioritize high transaction throughput, multi-bank routing
              redundancy, automated multi-entity reconciliation, and cross-border disbursements across fragmented
              regulatory jurisdictions. These enterprise procurement cycles commonly extend from 1 to 18 months,
              requiring multi-department sign-offs across finance, engineering, and compliance teams. Conversely, SMEs
              and digital startups demand self-serve onboarding, zero setup fees, and plug-and-play checkout links to
              accept local e-wallets without maintaining dedicated payment engineering infrastructure.
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of modern payment infrastructure is accelerated by government-backed real-time payments
              modernization, including Indonesia's QRIS and BI-FAST alongside Malaysia's DuitNow, which outpace credit
              card adoption and force traditional merchants into real-time digital rails. Furthermore, subscription and
              SaaS business models require robust automated recovery mechanisms to prevent involuntary churn stemming
              from regional payment method expiration or bank clearing timeouts. Conversely, adoption is constrained by
              intensifying margin pressure and falling switching costs: modern AI-assisted engineering and standardized
              API integrations increasingly enable merchants to adopt multi-PSP redundancy, routing transactions across
              multiple payment processors to minimize platform dependency and negotiate aggressive transaction fee
              discounts.
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional Rail Ownership vs. Thin Reselling
            body: >-
              Unlike Western markets dominated by Visa and Mastercard duopolies, Southeast Asia's payment landscape is
              characterized by 3% credit card penetration and pervasive local clearing rails (QRIS, DuitNow, bank
              virtual accounts). Owning direct bank integrations and central bank licenses provides a structural moat
              against pure software aggregators that resell third-party pipes.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Settlement Rails
        blocks:
          - type: paragraph
            body: >-
              The digital payments landscape in Southeast Asia presents unique structural fragmentation characterized by
              low credit card penetration—estimated at approximately 3% in emerging regional markets—and an overwhelming
              reliance on virtual accounts, e-wallets, QR codes, and direct bank rails [CP001, CP002]. Within this
              market architecture, merchant alternatives divide into five distinct competitive tiers: global
              cross-border orchestrators, localized regional gateways, domestic incumbent bank portals, e-wallet walled
              gardens, and internal in-house engineering builds [CP003]. Global processors such as Stripe and Adyen
              offer extensive international scale, global card clearing, and advanced multi-currency treasury
              capabilities, but historically faced integration friction with hyper-local Southeast Asian domestic
              payment schemes [CP004, CP005]. Regional specialists including Xendit, 2C2P, and Midtrans address this
              infrastructure deficit by abstracting hundreds of disparate clearing pipes through single unified merchant
              APIs [CP006]. However, merchants face persistent trade-offs between selecting a global unified provider
              versus managing localized regional gateways, frequently electing to multi-home gateways to mitigate outage
              risk and optimize localized transaction routing [CP007].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
