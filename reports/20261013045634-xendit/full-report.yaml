  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Infrastructure Boundaries
        blocks:
          - type: paragraph
            body: >-
              The addressable market for digital payment infrastructure in Southeast Asia comprises software-enabled
              payment acceptance, multi-channel payouts, recurring subscription billing, and value-added risk management
              services. Unlike developed markets where credit and debit card schemes dominate transaction settlement,
              Southeast Asia exhibits an unusually low credit card penetration of approximately 3%, forcing commercial
              enterprises to orchestrate across more than 100 distinct regional payment methods including domestic bank
              virtual accounts, e-wallets, and central bank QR rails. The market boundary explicitly includes enterprise
              and SME software spend for automated gateway integrations, fraud mitigation, escrow infrastructure, and
              developer-first API connections across Indonesia, the Philippines, Thailand, and Malaysia. Non-addressable
              spend includes cash-on-delivery logistics, informal unregulated peer-to-peer commerce, and traditional
              interbank wholesale settlement networks that operate outside software-intermediated commercial flows.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.2'
        title: Market Sizing and Growth Dynamics
        blocks:
          - type: paragraph
            body: >-
              Macroeconomic sizing estimates for Southeast Asia's digital economy indicate rapid expansion, crossing
              approximately $300 billion by the end of 2025 across an addressable population of 600 million people and a
              combined gross domestic product of $3 trillion, with independent projections forecasting over $360 billion
              in regional transaction activity. Within this macro environment, B2B payment gateway volume is propelled
              by rapid digitisation and real-time bank connectivity. Xendit has attained substantial domestic market
              share, processing $47.3 billion annually across more than 15,200 active merchants and touching an
              estimated 3% of Indonesia's GDP and 5% of the Philippines' GDP. However, top-line processed volume must be
              strictly decoupled from addressable software revenue: payment gateway take rates typically range between
              0.5% and 3.0% depending on rail mix, while underlying bank interchange and network pass-through fees
              compress net software revenue.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM014
