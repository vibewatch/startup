        - Misrouted funds, delayed settlement, merchant disputes, and working-capital pressure
        - Exception rates, aged unreconciled balances, safeguarded-funds controls, and counterparty default history
      - - Internal access-control or customer-data handling failure
        - Unknown; no independent control report was retained
        - High
        - Partial; a supplier case study quotes Xendit describing role-based CRM permissions
        - Unauthorized access, privacy exposure, and impaired customer operations
        - SOC reports, penetration tests, privileged-access reviews, breach history, and data-retention controls
    notes: >-
      The register separates disclosed control features from demonstrated effectiveness. Unknown likelihood means the
      assigned sources provide no event-rate denominator, not that the event has not occurred.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Local payment rails and licenses
        - Banks, e-wallets, payment networks, and regulators
        - More than 100 methods are claimed, but volume by rail or counterparty is not disclosed
        - A major rail changes access, pricing, settlement, or technical terms
        - High
        - Direct local infrastructure and a broad method set, according to Xendit
        - High until top-rail shares, contractual protections, and substitution times are verified
      - - Regional platform integration
        - Dragonpay in the Philippines and Payex in Malaysia
        - Dragonpay is reported at 905 merchants and 44 partners; no revenue or volume share is disclosed
        - Integration defects, partner attrition, or incompatible controls impair regional execution
        - Medium-high
        - Established local networks combined with Xendit's regional platform
        - Medium because integration economics, service quality, and partner retention are not public
      - - Merchant base and revenue concentration
        - More than 10,000 businesses are reported by a third-party review
        - No top-merchant, top-ten, vertical, or country revenue shares are disclosed
        - Loss or distress of a large merchant causes volume, reserve, or receivable pressure
        - High
        - A broad reported business count across multiple markets
        - High because business count does not establish diversified net revenue or loss exposure
      - - Private capital and liquidity
        - Venture investors, shareholders, and potential secondary buyers
        - Public profiles conflict at $538 million to $554 million raised; latest financing shown is in 2022
        - Cash needs, preference overhang, or a weak secondary market force unfavorable financing
        - High
        - Substantial historical funding, which is not evidence of current cash availability
        - High until cash, burn, debt, preferences, and audited profitability are reviewed
    notes: >-
      Concentration levels are left unquantified where the assigned sources provide no denominator. Funding raised is
      historical financing, not cash on hand or runway.
