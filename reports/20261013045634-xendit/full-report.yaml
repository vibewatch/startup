      - number: '4.2'
        title: Pricing Structure and Fee Mechanics
        blocks:
          - type: paragraph
            body: >-
              Xendit's monetization framework relies on published list rates that vary significantly by payment rail,
              transaction volume, and regional acquiring infrastructure. For card-based processing, standard list
              pricing reaches 3.0% plus $0.80 for domestic credit cards and 4.0% plus $0.80 for international cards,
              reflecting the heightened processing costs and fraud liabilities inherent in cross-border acquiring.
              Conversely, localized emerging-market payment methods—such as Indonesian virtual accounts and direct bank
              transfers—are priced at lower fees of 0.5% plus $0.20 and 2.13% plus $0.60 respectively, while national
              QRIS payments incur a 0.7% plus $0.20 charge. Although these rates represent published baseline schedules
              for standard onboarding, large enterprise merchants and marketplace aggregators negotiate custom tiered
              take rates based on total monthly payment volume and specific rail routing arrangements.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
      - number: '4.3'
        title: Unit Economics, Cost Structure, and Margin Proxies
        blocks:
          - type: paragraph
            body: >-
              Evaluating Xendit's true unit economics requires separating gross transaction throughput from net retained
              revenue after partner pass-through deductions. Because emerging Southeast Asian markets have credit card
              penetration rates below 5%, merchant volumes heavily concentrate in bank virtual accounts, direct bank
              transfers, and local digital wallets. For each transaction processed across these rails, Xendit must pay
              network interchange fees, bank partner settlement costs, and mobile wallet provider commissions, directly
              compressing the gross margin realized on core acquiring. Furthermore, go-to-market investments have
              demanded continuous sales workflow optimization; implementation data indicates that CRM process overhauls
              generated an 8% increase in sales win rates, a 15% reduction in enterprise sales cycle length, and a 25%
              efficiency gain for account representatives managing extended enterprise deal cycles.
            claimRefs:
              - CI005
              - CI006
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capital adequacy perspective, Xendit built substantial liquidity reserves by securing $300 million
              in Series D venture capital in May 2022, which brought total equity funding raised to $538 million under
              the backing of Coatue and Insight Partners. By late 2021, the business had demonstrated rapid scale,
              expanding annualized transaction volume from 65 million to 200 million and scaling total payments value
              from $6.5 billion to $15 billion. However, private market benchmarks—such as the Hurun Global Unicorn List
              valuation of 20.5 billion RMB in June 2026—and secondary trading listings on platforms like EquityZen
              operate without verified financial disclosures. Because audited net revenue figures, cash burn rates, and
              gross margin percentages remain strictly private, underwriting capital runway requires direct access to
              confidential management accounts to verify post-2022 cash flow self-sufficiency.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Gross Margin Compression from Local Rail Economics
            body: >-
              Because credit card penetration across Southeast Asia remains under 5% in core markets like Indonesia,
              Xendit must rely heavily on virtual accounts, bank transfers, and local e-wallets. These local rails
              feature lower absolute fee caps and higher fixed banking integration overhead than global card networks,
              compressing net take rates unless offset by high transaction frequency or software add-ons.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI013
          - type: callout
            title: Capital Sufficiency Dependent on Unit Economics Disclosure
            body: >-
              While Xendit amassed $538 million in total venture funding through its 2022 Series D, the company has
              operated without disclosing audited post-2022 financial results. In the absence of published net revenue
              margins or cash burn metrics, underwriting fair market valuation requires independent confirmation of
              capital runway and positive operating cash flow.
            calloutType: insight
            claimRefs:
              - CI010
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture & Integration Surface
        blocks:
          - type: paragraph
            body: >-
              Xendit delivers enterprise payments infrastructure designed specifically for the fragmented monetary
              systems of Southeast Asia. In markets where card penetration remains low and domestic clearing mechanisms
              dominate, the platform exposes a developer-centric interface that abstracts disparate local payment rails
              behind standardized REST APIs, SDKs, and off-the-shelf hosted checkout workflows. Rather than forcing
              merchants to negotiate bilateral commercial terms and maintain bespoke socket-level integrations with
              dozens of regional banks and non-bank issuers, Xendit acts as an intelligent orchestration layer. The
              platform unifies pay-ins across credit cards, domestic bank transfers, virtual accounts, QR schemes,
              e-wallets, and convenience store retail chains across Indonesia, the Philippines, Thailand, Malaysia,
              Vietnam, Singapore, and Hong Kong. For digital platforms and marketplaces, xenPlatform provides
              multi-tenant merchant onboarding, automated fee splitting, and programmable escrow balances. Merchants can
              implement turnkey integrations via plugins for major platforms like Shopify and WooCommerce or deploy
              full-stack custom checkout pipelines using client-side SDKs and webhook notification streams.
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE013
          - type: figure
