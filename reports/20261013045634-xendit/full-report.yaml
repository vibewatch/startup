      - number: '1.4'
        title: Commercial Traction, Scale Trajectory, and Diligence Considerations
        blocks:
          - type: paragraph
            body: >-
              At peak reported operating milestones, Xendit processed more than 320 million transactions and $25 billion
              in total payment volume (TPV) annually while serving an active base exceeding 6,000 merchants across
              Southeast Asia, spanning enterprise clients such as Grab, Wise, Traveloka, and regional marketplaces.
              However, thorough institutional diligence requires evaluating significant transparency gaps. As a
              privately held venture-backed enterprise, Xendit does not publicly disclose audited annual net revenues,
              annual recurring revenue (ARR), net take rates, or unit-level gross margins after payment rail partner
              pass-through costs. Furthermore, independent analyses highlight that while Xendit holds deep local
              dominance in Southeast Asian alternative payment integrations, global competitors like Stripe maintain
              broader worldwide coverage and more advanced developer feature suites. Prospective investors and diligence
              assessors must obtain audited financial statements, interchange fee schedules, and verified customer
              retention data to evaluate whether current private marks reflect sustainable operating profitability.
