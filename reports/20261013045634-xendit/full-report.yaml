              - CE013
              - CE014
      - number: '5.3'
        title: Infrastructure Resilience, Rail Ownership & Bank Failover
        blocks:
          - type: paragraph
            body: >-
              A foundational technical differentiator for Xendit is its deliberate strategy of owning underlying rail
              integrations rather than reselling access to third-party aggregators. Because payment reliability in
              Southeast Asia frequently breaks down at the bank gateway level, platform availability cannot be evaluated
              solely through cloud uptime. In Indonesia, Xendit connects to up to seven separate commercial bank rails
              in parallel. When an individual bank core or domestic switch suffers downtime, degradation, or maintenance
              outages, Xendit's routing layer automatically shifts payment flows to alternate functioning bank
              connections to preserve merchant processing continuity. This multi-connector routing proved critical
              during the May 2023 LockBit ransomware attack against Bank Syariah Indonesia, where Xendit successfully
              redirected merchant transactions to alternative bank rails while the primary bank was crippled.
              Furthermore, direct rail ownership and acquiring roles allow Xendit to offer advanced exception handling
              that resellers cannot provide, such as automated native QRIS refunds in Indonesia and programmatic GCash
              partial refunds spanning up to 180 days in the Philippines.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
              - CE011
      - number: '5.4'
        title: Security Controls, Clearing Dependencies & Next-Generation Rails
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption is governed by institutional-grade regulatory licensing, data security protocols, and
              strict fraud risk mitigation. Xendit maintains direct local payment licenses across seven APAC
              jurisdictions, including a Major Payment Institution license from the Monetary Authority of Singapore and
              a Money Service Operator license in Hong Kong. These licenses give the company direct settlement and
              clearing rights, reducing intermediary counterparty exposure. The platform incorporates machine-learning
              fraud detection, 3D Secure verification, and role-based access management to safeguard transaction data.
              Nevertheless, structural technical risks persist because Xendit remains dependent on national real-time
              payment switches like BI-FAST, PromptPay, and DuitNow; systemic failures at central bank clearing switches
              fall outside any gateway's failover controls. On its forward technology roadmap, Xendit is addressing
              international settlement friction by joining the Open Transaction Layer protocol launched in May 2026,
              standardizing on-chain transaction coordination and enterprise stablecoin rails to facilitate continuous,
              real-time cross-border settlements.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Rail Connectivity and Redundant Multi-Bank Routing
            body: >-
              Xendit's core technical moat lies in its direct host-to-host bank integrations and multi-connector
              failover logic. By maintaining up to seven parallel bank routes in primary markets like Indonesia, Xendit
              can steer live transactions away from upstream banking outages, as demonstrated during the 2023 Bank
              Syariah Indonesia ransomware incident.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: External Rail Concentration and Upstream Clearing Dependencies
            body: >-
              Although Xendit engineers multiple software failover paths, its overall processing continuity remains
              bounded by national payment switches and central bank clearing systems. In markets with emerging
              instant-payment networks, widespread central bank or tier-1 partner bank outages cannot be entirely
              resolved by gateway-level software redundancy.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Xendit serves a broad and structurally heterogeneous customer base across Southeast Asia, categorized
              across three primary segments: high-volume digital enterprises, multi-sided B2B marketplaces, and
              small-to-medium enterprises (SMEs). For large consumer-facing platforms such as Grab and Traveloka, Xendit
              functions as a critical processing engine for checkout card acceptance, virtual accounts, and large-scale
              disbursement rails. In the B2B marketplace and supply chain tier, platforms including Ula, Ralali, and
              GudangAda rely on Xendit's XenPlatform architecture to automate complex split payments, manage merchant
              sub-accounts, and enforce automated platform fee deductions. Finally, long-tail SMEs and regional
              e-commerce merchants adopt self-serve payment links and localized checkout methods. While enterprise
              clients drive the vast majority of gross processing volume at compressed take-rates, marketplace and SME
              cohorts deliver higher percentage fee margins and deeper operational lock-in.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU007
      - number: '6.2'
        title: Adoption Trajectory and Scale Milestones
        blocks:
          - type: paragraph
            body: >-
              Xendit's adoption trajectory accelerated dramatically alongside Southeast Asia's rapid digitization,
              transitioning from a localized Indonesian payment gateway into a multi-market infrastructure platform.
              During its Series B milestone in 2020, the company disclosed processing over 65 million annualized
              transactions representing $6.5 billion in total payment volume (TPV), accompanied by a 540% year-on-year
              surge in customer accounts. More recent independent industry analysis indicates that Xendit's commercial
              footprint has expanded to support over 10,000 businesses across Indonesia, the Philippines, Malaysia,
              Thailand, and Vietnam. However, public disclosures do not disaggregate active transacting merchants from
              dormant accounts, nor do they report current net revenue or average transaction value trends. Diligence
              requires evaluating the bridge between historical TPV figures and modern cohort contribution to establish
              true underlying commercial velocity.
            claimRefs:
              - CU002
              - CU003
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU010
      - number: '6.3'
        title: Named Customer Evidence and Vertical Deployments
        blocks:
          - type: paragraph
            body: >-
              Production deployments across prominent regional brands substantiate Xendit's operational capabilities
              across demanding vertical use cases. In the online travel and entertainment vertical, tiket.com
              successfully leveraged Xendit's gateway to handle high-concurrency 17x traffic spikes during flash sales,
              maintaining transactional stability when legacy banking rails experienced congestion. In hospitality,
              Bali-based hotel operator Dijiwa Sanctuaries documented a 90% reduction in settlement cycle turnaround by
              replacing manual bank reconciliations with automated payout flows. Similarly, digital gaming marketplace
              VCGamers reported consistent payment completion rates exceeding 95% during peak evening transaction hours.
              In the Philippines, the strategic integration of Dragonpay expanded Xendit's footprint by connecting 905
              merchants and 44 financial institutions, establishing alternative payment access for millions of unbanked
              consumers. These case studies demonstrate production readiness, though third-party performance audits
              remain confidential.
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer Journey and Cross-Border Expansion Loops
        blocks:
          - type: paragraph
            body: >-
              The merchant lifecycle on Xendit reflects a deliberate progression from localized single-channel checkout
              to integrated regional expansion and multi-product lock-in. Merchants typically enter the platform through
              developer-friendly documentation and sandbox testing, initiating acceptance via domestic virtual accounts,
              QRIS, and e-wallets. As transaction scale expands, merchants unlock automated batch disbursements,
              customized fraud mitigation rules, and sub-account marketplace routing. The subsequent expansion phase
              enables businesses to access cross-border corridors across the Philippines, Malaysia, Thailand, and
              Vietnam without establishing separate banking entities in each country. Ultimately, advanced retention is
              cemented through working capital financing, early settlement options, and banking-as-a-service modules.
              This land-and-expand trajectory creates substantial barriers to displacement, mitigating competitive
              threats from global processors like Stripe that maintain broader global presence but lack equivalent
              domestic payment rail depth.
            claimRefs:
              - CU005
              - CU006
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU013
              - CU014
      - number: '6.5'
        title: Retention Durability and Concentration Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite widespread brand adoption across Southeast Asia, Xendit faces structural durability and customer
              concentration risks that warrant rigorous investment scrutiny. Because low credit card penetration
              (approximately 3%) forces reliance on fragmented local payment methods, enterprise merchants routinely
              multi-home across multiple gateways—such as Midtrans, DOKU, and 2C2P—to ensure route redundancy and
              negotiate lower transaction processing fees. This dynamic creates persistent margin compression on
              enterprise contracts. Furthermore, Xendit has never publicly disclosed merchant cohort churn, Gross
              Revenue Retention (GRR), or Net Revenue Retention (NRR). Without audited merchant retention schedules or
              disclosures on top-10 customer concentration, investors cannot determine whether ongoing volume expansion
              reflects genuine net expansion within established cohorts or aggressive top-of-funnel customer acquisition
              masking underlying SME attrition.
            claimRefs:
              - CU002
              - CU004
              - CU013
              - CU014
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Lack of Audited Retention and Concentration Disclosures
            body: >-
              While Xendit touts relationships with high-profile platforms like Grab, Traveloka, and tiket.com, the
              absence of public Net Revenue Retention (NRR) cohorts or top-customer volume share creates meaningful
              uncertainty regarding revenue durability and contract re-pricing exposure.
            calloutType: risk
            claimRefs:
              - CU002
              - CU004
          - type: callout
            title: Marketplace Infrastructure as a Retention Moat
            body: >-
              Xendit's XenPlatform sub-account architecture and automated platform fee splitting embed the provider
              deeply into client operating workflows, creating higher switching costs for B2B marketplaces than
              commodity gateway checkout connections.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and underwriting boundary
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are financial opacity, regulatory standing across multiple jurisdictions, and
              operational exposure created by a broad payments surface. Xendit says its Global Account spans seven
              markets and more than 100 local payment methods, while a third-party review describes service to more than
              10,000 businesses. That scale broadens the potential impact of a control failure, but the assigned
              evidence does not quantify outage history, fraud losses, chargebacks, reserves, or merchant and rail
              concentration. The heatmap therefore ranks exposure qualitatively rather than assigning unsupported
              probabilities. Investment underwriting should remain conditional on primary regulatory records, audited
              economics, service-level performance, and concentration schedules.
            claimRefs:
              - CR004
              - CR005
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Xendit states that it holds local payment licenses involving OJK in Indonesia, BSP in the Philippines, BNM
              in Malaysia, BOT in Thailand, MAS in Singapore, and SBV in Vietnam. That statement is useful evidence of
              the intended compliance perimeter, but it is company-issued and the assigned pool contains no regulator
              register, license number, renewal date, consent order, or enforcement record. The perimeter is also
              organizationally complex: Tracxn lists five legal entities across Indonesia, the United States, Thailand,
              and Singapore. Separately, Xendit says it introduced API-based merchant verification plus AI-assisted
              onboarding, liveness, and sanctions screening in 2025. These controls mitigate onboarding risk but do not
              establish their error rates, coverage, or regulatory acceptance.
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR016
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Product breadth is both a moat and an operational risk multiplier. Xendit describes one integration for
              more than 100 payment methods, payouts to more than 450 channels, and batch payouts of up to 10,000
              transactions. Those claims imply many external failure points and reconciliation paths, but do not prove
              redundancy or uptime. Published mitigations are partial: Xendit reports automated identity and sanctions
              screening, and a Salesforce case study quotes Xendit saying that access is role-controlled in its CRM. The
              same case study says a spreadsheet became inadequate once the sales team exceeded 30 people and customer
              engagement could last one to eighteen months, illustrating process complexity. No assigned source provides
              independent penetration tests, incident history, loss rates, or contractual service performance.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR016
      - number: '7.4'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Xendit says direct processing depends on local bank connections, e-wallet integrations, licenses, and
              in-market teams. Regional expansion adds integration work: ACV Capital reports that Dragonpay's network
              includes 905 merchants and 44 partners, and that Xendit expanded into Thailand in 2024 and acquired
              Malaysia-based Payex in 2025. Those figures show network reach, not counterparty diversification, because
              no source discloses volume by bank, wallet, partner, merchant, or country. Financial visibility is also
              weak. Public profiles disagree on cumulative funding, reporting $538 million to $554 million, and place
              the latest financing in 2022; funding raised is not cash available. One profile says public sources do not
              confirm revenue or profitability, leaving burn, margins, reserves, and runway unverified.
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Treat a material license suspension, an unresolved outage that breaches contracted service levels, fraud
              or credit losses above the investment committee's agreed tolerance, excessive top-rail or top-merchant
              concentration, or audited gross margin below the underwriting floor as thesis-break events. The public
              evidence does not supply those thresholds or denominators, so they must be set before investment and
              tested against primary diligence.
            calloutType: risk
            claimRefs:
              - CR002
              - CR014
              - CR016
          - type: callout
            title: Monitoring and mitigation priorities
            body: >-
              Monitor license renewals and conditions, service availability and recovery time, net fraud and chargeback
              losses, safeguarded-funds and reserve coverage, concentration by rail and merchant, partner integration
              quality, and monthly gross margin and cash burn. Require evidence of control effectiveness rather than
              treating product features, partner counts, or funding raised as proof that residual exposure is low.
            calloutType: insight
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Xendit occupies a critical structural position as the digital payments backbone across Southeast Asia,
              aggregating more than one hundred fragmented regional payment channels into a unified merchant API. The
              primary investment thesis rests on structural tailwinds across Indonesia, the Philippines, Thailand, and
              Malaysia, where expanding digital commerce and a rising middle class drive secular payment volume growth.
              However, the anti-thesis is equally compelling: payments processing remains fundamentally commoditized at
              the infrastructure layer, and regional super-apps such as Grab and Gojek alongside global leaders like
              Stripe exert persistent competitive pricing pressure. In the absence of disclosed audited net revenue,
              gross margins after partner pass-through costs, and cohort net retention rates, current private valuations
              at or above the unicorn threshold appear stretched. Consequently, the substantiated recommendation is
              research-more with a medium confidence rating and a high risk rating, advising prospective investors to
              withhold new capital commitments pending access to audited management accounts.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.2'
        title: Financing History, Secondary Markets, and Private Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Since its founding in 2015 as a Y Combinator alumnus, Xendit has accumulated $538 million in aggregate
              institutional equity financing across successive Seed, Series A, Series B, Series C, and Series D funding
              rounds. The company reached unicorn status in September 2021 after closing a $150 million Series C led by
              Coatue Management, followed by a $300 million Series D co-led by Coatue and Insight Partners in May 2022
              that priced the business at approximately $1.5 billion. Benchmark rankings such as the Hurun Global
              Unicorn Index estimated Xendit's enterprise valuation at RMB 20.5 billion in June 2026, slightly down from
              RMB 22 billion in 2025, mirroring regional multiple contraction across growth fintech assets. On secondary
              marketplaces like EquityZen, private liquidity remains constrained and opaque, with vital cap-table terms,
              liquidation preferences, and current performance metrics shielded behind accredited investor gates.
              Furthermore, late-2022 workforce reductions of approximately 5% demonstrate that management was compelled
              to extend runway amid a tighter venture financing climate, reinforcing the necessity of strict valuation
              discipline.
            claimRefs:
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV012
      - number: '8.3'
        title: Valuation Comps, Scenario Analysis, and Model Economics
        blocks:
          - type: paragraph
            body: >-
              Evaluating Xendit against public and private peers highlights substantial structural differences in
              revenue quality and take-rate dynamics. Global payment gateways such as Stripe and Adyen benefit from
              mature markets with credit card penetration exceeding 60%, enabling blended take rates above 1.5% to 2.5%
              on card processing. In stark contrast, Southeast Asian emerging markets exhibit credit card penetration of
              only 3%, requiring Xendit to support virtual accounts, direct bank transfers, and local e-wallets where
              per-transaction fixed fees and banking interchange compress net revenue margins. While Xendit charges 0.5%
              plus twenty cents for virtual accounts and 2.13% plus sixty cents for bank transfers, significant portions
              of these gross fees represent pass-through costs paid to underlying financial institutions. The company
              has attempted to expand unit margins by introducing recurring subscription billing, mass payout
              disbursements, and automated KYC verification APIs. Under our scenario analysis, defending a $1.0 billion
              to $1.5 billion base-case valuation requires sustainable net revenue of at least $150 million to $250
              million at a 5x to 7x net revenue multiple.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Critical Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Xendit's eventual liquidity horizon will likely depend on whether public listing windows reopen in the
              United States or Southeast Asian regional bourses such as the Indonesia Stock Exchange or Singapore
              Exchange. Strategic M&A represents an alternative exit path, though global acquirers like Stripe or PayPal
              may balk at paying a premium over historical private marks unless cross-border multi-currency volume
              demonstrates clear defensibility. Prior to any investment decision, diligence must interrogate three
              pivotal thesis-break triggers: severe take-rate compression resulting from mandatory central bank QR rail
              adoption, customer concentration among top digital merchants and platforms, and senior liquidation
              preferences attached to the Series C and Series D preferred equity classes. Until audited gross margins
              and multi-year merchant retention curves are provided under confidentiality, investors should maintain a
              research-more stance rather than underwriting stretched private paper.
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More at Stretched Private Valuation'
            body: >-
              Xendit demonstrates defensible regional execution across Indonesia and the Philippines with over $538
              million in total capital raised, but the combination of opaque net take rates, low regional credit card
              penetration, commoditization pressure, and absence of audited financial statements makes current valuation
              marks stretched. Investors should condition any private secondary or primary participation on granular
              cohort retention, liquidation preferences, and verified gross profit metrics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
          - type: callout
            title: 'Valuation Vulnerability: Commoditization and Rail Economics'
            body: >-
              Because payment processing in Southeast Asia relies heavily on virtual accounts and direct bank transfers
              rather than credit cards, take rates are structurally lower than Western peers. As Stripe, Adyen, and
              regional consumer ecosystems expand their B2B merchant solutions, Xendit faces potential margin
              compression unless higher-margin software products like subscriptions and fraud detection accelerate.
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV011
