chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2015 by Moses Lo, Tessa Wijaya, Bo Chen, and Juan Gonzalez, Xendit has established itself as a
              leading B2B financial technology platform headquartered in Jakarta, Indonesia. The company addresses the
              structural fragmentation of Southeast Asian payment systems, where consumer reliance on cash, bank
              transfers, and local digital wallets historically exceeded international credit card penetration. By
              consolidating more than 100 disparate local payment rails—including virtual accounts, direct bank
              transfers, e-wallets, retail outlets, and credit cards—into a single API integration, Xendit enables
              digital enterprises, online marketplaces, and small-to-medium businesses to process domestic and
              cross-border commercial transactions smoothly. The company generates revenue primarily through
              fee-per-transaction models, charging variable percentages and fixed per-transaction fees tailored to
              specific payment methods, while supplementing its core payments engine with automated payouts, risk
              management, and value-added merchant financing tools.
            claimRefs:
              - CO001
              - CO003
              - CO014
              - CO015
