      - number: '1.3'
        title: Capitalization History, Institutional Backing, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Xendit has raised $538 million in cumulative venture capital equity across five institutional funding
              rounds. The company initially graduated from Y Combinator in August 2015 as the first Indonesian startup
              accepted into the Silicon Valley accelerator, securing $120,000 in seed capital. It accelerated
              institutional fundraising in March 2021 with a $64.6 million Series B led by Accel, followed six months
              later by a $150 million Series C led by Tiger Global Management that elevated the business to unicorn
              status with an official $1 billion valuation. In May 2022, Coatue and Insight Partners co-led a $300
              million Series D financing with continued participation from Accel, Kleiner Perkins, and Tiger Global.
              These balance-sheet resources supported aggressive multi-market geographical rollouts, including expanding
              operations into Thailand in 2024, deploying cross-border multi-currency payouts across Asian currencies in
              2025, and completing the strategic regional integration of Philippine payments leader Dragonpay in July
              2026.
