      - number: '5.2'
        title: Core Product Modules & Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              The core product portfolio addresses the end-to-end operational lifecycle of money movement in digital
              commerce. The Pay-In module supports more than 100 localized payment methods through a single integration,
              dynamically routing transactions according to merchant geography and consumer instrument availability. A
              critical operational capability for high-volume enterprise merchants is Xendit's automated virtual account
              engine. In cash- and transfer-heavy economies, buyers historically initiated manual bank transfers that
              required merchant operations teams to inspect bank statements or review uploaded receipts. Xendit assigns
              unique, programmatically generated virtual account numbers to individual purchase transactions,
              immediately confirming payment upon bank credit and publishing real-time webhook events to merchant
              backends. Beyond acceptance, Xendit's disbursement engine automates single and bulk payouts to bank
              accounts and e-wallets, enabling marketplaces to disburse vendor proceeds, gig-economy wages, and refund
              distributions with near real-time settlement speed. This payout capability reduces friction in
              cross-border marketplace logistics by replacing manual batch wires with automated API transfers.
