  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        Primary regulator-register entries, license identifiers, conditions, renewal dates,
        enforcement correspondence, and a complete entity-to-license map.
      whyItMatters: >-
        Company claims establish intended coverage but cannot verify current good standing,
        permitted activities, or unresolved regulator conditions.
      diligencePath: >-
        Obtain license copies and legal opinions, then confirm each license and material condition
        directly against the relevant regulator register and management correspondence.
      relatedQuestionRefs:
        - QR003
        - QR009
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: operational-loss-and-concentration
      missingEvidence: >-
        Incident and outage history, SLA performance, fraud and chargeback loss rates, reserve
        coverage, aged reconciliation items, and concentration by merchant, rail, partner, and country.
      whyItMatters: >-
        Product breadth and partner counts do not measure control effectiveness, loss severity,
        substitutability, or the exposure created by concentrated transaction volume.
      diligencePath: >-
        Review board risk packs, incident reports, SLA dashboards, loss and reserve cohorts, and
        monthly concentration schedules under NDA; reconcile them to audited financial statements.
      relatedQuestionRefs:
        - QR009
        - QR010
      relatedTableRefs:
        - TR002
        - TR003
    - type: private-evidence-only
      severity: material
      topic: audited-economics-and-liquidity
      missingEvidence: >-
        Audited net revenue, gross margin after partner pass-through, operating cash burn, cash and
        debt balances, runway, credit losses, liquidation preferences, and current secondary pricing.
      whyItMatters: >-
        Funding raised does not establish cash availability, profitability, downside protection,
        or the financing terms that determine investor returns.
      diligencePath: >-
        Request audited statements, a net-revenue bridge, cash and debt confirmations, monthly burn
        history, the cap table, preference stack, and recent primary and secondary term sheets.
      relatedQuestionRefs:
        - QR007
        - QR010
      relatedTableRefs:
        - TR003
