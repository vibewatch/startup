schemaVersion: report-v2
artifact: risks
slug: xendit
runDate: '2026-10-13'
company:
  name: Xendit
chapter:
  number: 7
  title: Risks
  summary: >-
    Xendit's largest underwritable risks are the breadth of its multi-market regulatory perimeter,
    dependence on local payment rails and integrations, and the absence of public loss,
    concentration, and audited profitability data. Published mitigations exist, but most are
    company or supplier claims rather than regulator records or quantified operating evidence.
sections:
  - id: risk-ranking-and-underwriting-boundary
    title: Risk ranking and underwriting boundary
    body: >-
      The highest residual risks are financial opacity, regulatory standing across multiple
      jurisdictions, and operational exposure created by a broad payments surface. Xendit says
      its Global Account spans seven markets and more than 100 local payment methods, while a
      third-party review describes service to more than 10,000 businesses. That scale broadens
      the potential impact of a control failure, but the assigned evidence does not quantify
      outage history, fraud losses, chargebacks, reserves, or merchant and rail concentration.
      The heatmap therefore ranks exposure qualitatively rather than assigning unsupported
      probabilities. Investment underwriting should remain conditional on primary regulatory
      records, audited economics, service-level performance, and concentration schedules.
    claimRefs:
      - CR004
      - CR005
      - CR012
      - CR014
      - CR016
    figureRefs:
      - FR001
  - id: regulatory-and-legal-perimeter
    title: Regulatory and legal perimeter
    body: >-
      Xendit states that it holds local payment licenses involving OJK in Indonesia, BSP in the
      Philippines, BNM in Malaysia, BOT in Thailand, MAS in Singapore, and SBV in Vietnam. That
      statement is useful evidence of the intended compliance perimeter, but it is company-issued
      and the assigned pool contains no regulator register, license number, renewal date, consent
      order, or enforcement record. The perimeter is also organizationally complex: Tracxn lists
      five legal entities across Indonesia, the United States, Thailand, and Singapore. Separately,
      Xendit says it introduced API-based merchant verification plus AI-assisted onboarding,
      liveness, and sanctions screening in 2025. These controls mitigate onboarding risk but do
      not establish their error rates, coverage, or regulatory acceptance.
    claimRefs:
      - CR002
      - CR003
      - CR011
      - CR016
    tableRefs:
      - TR001
  - id: operational-quality-and-security
    title: Operational, quality, and security exposure
    body: >-
      Product breadth is both a moat and an operational risk multiplier. Xendit describes one
      integration for more than 100 payment methods, payouts to more than 450 channels, and batch
      payouts of up to 10,000 transactions. Those claims imply many external failure points and
      reconciliation paths, but do not prove redundancy or uptime. Published mitigations are
      partial: Xendit reports automated identity and sanctions screening, and a Salesforce case
      study quotes Xendit saying that access is role-controlled in its CRM. The same case study
      says a spreadsheet became inadequate once the sales team exceeded 30 people and customer
      engagement could last one to eighteen months, illustrating process complexity. No assigned
      source provides independent penetration tests, incident history, loss rates, or contractual
      service performance.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR016
    tableRefs:
      - TR002
  - id: partner-financial-and-execution-dependencies
    title: Partner, financial, and execution dependencies
    body: >-
      Xendit says direct processing depends on local bank connections, e-wallet integrations,
      licenses, and in-market teams. Regional expansion adds integration work: ACV Capital reports
      that Dragonpay's network includes 905 merchants and 44 partners, and that Xendit expanded
      into Thailand in 2024 and acquired Malaysia-based Payex in 2025. Those figures show network
      reach, not counterparty diversification, because no source discloses volume by bank, wallet,
      partner, merchant, or country. Financial visibility is also weak. Public profiles disagree
      on cumulative funding, reporting $538 million to $554 million, and place the latest financing
      in 2022; funding raised is not cash available. One profile says public sources do not confirm
      revenue or profitability, leaving burn, margins, reserves, and runway unverified.
    claimRefs:
      - CR001
      - CR009
      - CR010
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, license, or case
      - Jurisdiction
      - Evidence status
      - Likelihood
      - Severity
      - Published mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Payment-services licensing and good standing
        - Indonesia, Philippines, Malaysia, Thailand, Singapore, Vietnam
        - Company lists six regulators; primary register entries and license identifiers were not in the assigned evidence
        - Medium; renewal and change risk are not quantified
        - High
        - Company says it holds local licenses and maintains in-market infrastructure
        - High until scope, entity mapping, conditions, and renewal dates are independently verified
        - Obtain license copies, regulator-register extracts, renewal calendars, and all material correspondence
      - - AML, KYC, sanctions, and merchant-screening controls
        - Multi-market
        - Company reports API-based KYC submission and AI-assisted onboarding, liveness, and sanctions screening
        - Medium; false-positive and false-negative rates are undisclosed
        - High
        - Verification API plus automated screening and merchant resubmission tools
        - Medium-high because coverage, override governance, and model validation are not public
        - Review control testing, alert disposition, model validation, suspicious-activity procedures, and regulator findings
      - - Legal-entity, tax, privacy, and contracting perimeter
        - Indonesia, United States, Thailand, Singapore, and other operating markets
        - Tracxn lists five entities across four countries; the complete entity-to-license and data-flow map is unavailable
        - Medium; no event frequency is disclosed
        - Medium-high
        - Local entities and regional operating teams are described publicly
        - Medium-high because intercompany obligations, data localization, and liability allocation are not evidenced
        - Obtain the full entity chart, intercompany agreements, data maps, tax opinions, and material disputes schedule
    notes: >-
      Qualitative likelihood and severity are analyst judgments based on the assigned evidence;
      no source supplied event probabilities. Coverage is partial and company license claims are
      not treated as regulator verification.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly identified regulatory and legal exposures in the assigned source pool as of
        2026-10-13; regulator registers, case dockets, and license documents were not supplied.
    claimRefs:
      - CR002
      - CR003
      - CR011
      - CR016
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Core API or external payment-rail interruption
        - Unknown; no outage history was retained
        - High
        - Partial; broad method coverage is disclosed, but redundancy and failover performance are not
        - Merchant payment and payout disruption across a wide integration surface
        - Uptime, incident count, recovery time, SLA credits, and dependency-level availability
      - - Fraud, synthetic identity, sanctions, or merchant-onboarding control failure
        - Unknown; no loss-rate denominator was retained
        - High
        - Partial; Verification API, liveness, and AI-assisted screening are company-reported
        - Chargebacks, settlement loss, account abuse, and regulatory remediation
        - Fraud losses, chargeback ratios, manual override rates, reserve policy, and screening model validation
      - - Reconciliation, payout, or cross-border settlement error
        - Unknown; product capacity is disclosed, error rates are not
        - High
        - Partial; the company reports 450+ payout channels and batches of up to 10,000 transactions
        - Misrouted funds, delayed settlement, merchant disputes, and working-capital pressure
        - Exception rates, aged unreconciled balances, safeguarded-funds controls, and counterparty default history
      - - Internal access-control or customer-data handling failure
        - Unknown; no independent control report was retained
        - High
        - Partial; a supplier case study quotes Xendit describing role-based CRM permissions
        - Unauthorized access, privacy exposure, and impaired customer operations
        - SOC reports, penetration tests, privileged-access reviews, breach history, and data-retention controls
    notes: >-
      The register separates disclosed control features from demonstrated effectiveness. Unknown
      likelihood means the assigned sources provide no event-rate denominator, not that the event
      has not occurred.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Local payment rails and licenses
        - Banks, e-wallets, payment networks, and regulators
        - More than 100 methods are claimed, but volume by rail or counterparty is not disclosed
        - A major rail changes access, pricing, settlement, or technical terms
        - High
        - Direct local infrastructure and a broad method set, according to Xendit
        - High until top-rail shares, contractual protections, and substitution times are verified
      - - Regional platform integration
        - Dragonpay in the Philippines and Payex in Malaysia
        - Dragonpay is reported at 905 merchants and 44 partners; no revenue or volume share is disclosed
        - Integration defects, partner attrition, or incompatible controls impair regional execution
        - Medium-high
        - Established local networks combined with Xendit's regional platform
        - Medium because integration economics, service quality, and partner retention are not public
      - - Merchant base and revenue concentration
        - More than 10,000 businesses are reported by a third-party review
        - No top-merchant, top-ten, vertical, or country revenue shares are disclosed
        - Loss or distress of a large merchant causes volume, reserve, or receivable pressure
        - High
        - A broad reported business count across multiple markets
        - High because business count does not establish diversified net revenue or loss exposure
      - - Private capital and liquidity
        - Venture investors, shareholders, and potential secondary buyers
        - Public profiles conflict at $538 million to $554 million raised; latest financing shown is in 2022
        - Cash needs, preference overhang, or a weak secondary market force unfavorable financing
        - High
        - Substantial historical funding, which is not evidence of current cash availability
        - High until cash, burn, debt, preferences, and audited profitability are reviewed
    notes: >-
      Concentration levels are left unquantified where the assigned sources provide no denominator.
      Funding raised is historical financing, not cash on hand or runway.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
figures:
  - id: FR001
    title: Residual risk heatmap by evidence quality
    type: matrix
    summary: >-
      Qualitative risk ranking that pairs exposure with the maturity of public mitigation evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation evidence
      rows:
        - label: Audited economics and liquidity
          values:
            - label: Unknown
              note: Burn, runway, and audited profitability are not public in the assigned evidence
            - label: High
              note: Weak economics or preference overhang could change entry-value and financing assumptions
            - label: Low
              note: Historical funding is disclosed, but current cash availability is not
        - label: Regulatory authorization and standing
          values:
            - label: Medium
              note: Multi-market renewal and rule-change exposure exists, but event rates are unavailable
            - label: High
              note: License restrictions could impair market access or product scope
            - label: Medium
              note: Company lists licenses; primary records and conditions remain unverified
        - label: Fraud, KYC, and sanctions controls
          values:
            - label: Unknown
              note: No fraud-loss or screening-error denominator was retained
            - label: High
              note: Control failure can create direct losses and regulatory remediation
            - label: Medium
              note: Automated verification and screening are described without effectiveness data
        - label: Core API and rail availability
          values:
            - label: Unknown
              note: No incident frequency or service-level history was retained
            - label: High
              note: Payment and payout interruption can directly affect merchant operations
            - label: Medium
              note: Breadth is disclosed, while redundancy and recovery performance are not
        - label: Counterparty and merchant concentration
          values:
            - label: Unknown
              note: Top rail, partner, merchant, and country shares are not disclosed
            - label: High
              note: Concentrated volume can transmit repricing, outage, or customer-loss shocks
            - label: Low
              note: Counts and breadth are public, but concentration controls are not
        - label: Regional integration execution
          values:
            - label: Medium
              note: Dragonpay integration and Payex acquisition increase coordination requirements
            - label: Medium-high
              note: Integration quality can affect merchants, partners, and cross-border expansion
            - label: Medium
              note: Local network reach is reported, but integration economics and quality metrics are not
    approximationNotes: >-
      Likelihood, impact, and mitigation maturity are qualitative analyst assessments; they are
      not measured probabilities, loss estimates, or company-provided ratings.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR009
      - CR012
      - CR014
      - CR016
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Treat a material license suspension, an unresolved outage that breaches contracted service
      levels, fraud or credit losses above the investment committee's agreed tolerance, excessive
      top-rail or top-merchant concentration, or audited gross margin below the underwriting floor
      as thesis-break events. The public evidence does not supply those thresholds or denominators,
      so they must be set before investment and tested against primary diligence.
    claimRefs:
      - CR002
      - CR014
      - CR016
  - calloutType: insight
    title: Monitoring and mitigation priorities
    body: >-
      Monitor license renewals and conditions, service availability and recovery time, net fraud
      and chargeback losses, safeguarded-funds and reserve coverage, concentration by rail and
      merchant, partner integration quality, and monthly gross margin and cash burn. Require
      evidence of control effectiveness rather than treating product features, partner counts,
      or funding raised as proof that residual exposure is low.
    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR012
      - CR016
