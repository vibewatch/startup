callouts:
  - calloutType: insight
    title: Local Rail Defensibility and the Virtual Account Advantage
    body: >-
      In emerging Southeast Asian markets where credit card penetration remains
      constrained to approximately 3%, digital commerce relies heavily on
      alternative rails such as virtual accounts and e-wallets [CP001]. Xendit
      builds defensibility not merely through software, but through deep
      regulatory and bilateral bank connections that automate real-time matching
      and reconciliation across fragmented national systems [CP006, CP008].
    claimRefs:
      - CP001
      - CP006
      - CP008
  - calloutType: risk
    title: Multi-Homing and Gateway Commoditization Exposure
    body: >-
      As enterprise merchants grow across Southeast Asia, multi-homing across
      multiple payment gateways becomes standard practice to hedge uptime
      vulnerabilities and optimize routing costs [CP007, CP015]. This dynamic
      weakens provider pricing power and exposes transaction fees to continuous
      downward margin compression from aggressive competitors [CP016].
    claimRefs:
      - CP007
      - CP015
      - CP016
