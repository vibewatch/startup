        - 3.0% + $0.80 per transaction
        - Per-transaction variable
        - Card tokenization, 3DS authentication
        - Comparable to regional gateways; higher fixed fee than global giants
      - - International Credit Cards
        - 4.0% + $0.80 per transaction
        - Per-transaction variable
        - Multi-currency clearing, fraud screening
        - Higher cost reflecting cross-border risk and interchange markups
      - - Regional E-Wallets
        - 2.70% + $0.40 per transaction
        - Per-transaction variable
        - Direct e-wallet redirect and callback
        - Slight markup over bilateral commercial rates for integration ease
      - - Domestic Bank Transfers
        - 2.13% + $0.60 per transaction
        - Per-transaction variable
        - Direct debit bank gateway integration
        - Premium over raw batch clearing, justified by real-time reconciliation
      - - Virtual Accounts (VA)
        - 0.5% + $0.20 per transaction
        - Per-transaction variable
        - Automated payment detection and matching
        - Highly cost-effective channel for high-ticket Indonesian B2B commerce
      - - Indonesian QR (QRIS)
        - 0.7% + $0.20 per transaction
        - Per-transaction variable
        - Standardized national QR code generation
        - Regulated low-fee interchange benchmark for retail micro-transactions
      - - Buy Now Pay Later / Credit
        - 6.0% + $0.20 per transaction
        - Per-transaction variable
        - Risk underwriting partner connection
        - >-
          High merchant fee reflecting financing risk and consumer installment
          split
    notes: >-
      List pricing figures based on published fee schedules. Enterprise volume
      tiers typically receive custom negotiated interchange-plus rates.
