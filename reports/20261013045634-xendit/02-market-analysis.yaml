callouts:
  - calloutType: "insight"
    title: "Regional Rail Ownership vs. Thin Reselling"
    body: "Unlike Western markets dominated by Visa and Mastercard duopolies, Southeast Asia's payment landscape is characterized by 3% credit card penetration and pervasive local clearing rails (QRIS, DuitNow, bank virtual accounts). Owning direct bank integrations and central bank licenses provides a structural moat against pure software aggregators that resell third-party pipes."
    claimRefs:
      - CM003
      - CM004
      - CM009
