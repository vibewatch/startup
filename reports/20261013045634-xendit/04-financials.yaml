company:
  name: Xendit
chapter:
  number: 4
  title: Financials
  summary: Xendit operates a volume-driven B2B payment infrastructure model across Southeast Asia, monetizing transactional take rates and software add-ons on annualized payments volume that expanded to $15 billion by Series D. However, the absence of public disclosures regarding audited net revenues, bank interchange pass-through costs, and gross margins makes capital self-sufficiency and unit profitability the primary underwriting blockers.
sections:
  - id: revenue-streams-monetization
    title: Revenue Streams and Core Monetization
    body: Xendit structures its core commercial model around transaction-based payment processing across Southeast Asia, eliminating upfront software integration costs and monthly platform maintenance minimums in favor of per-transaction fee capture. The platform aggregates over one hundred local payment methods into a unified programming interface, serving enterprises, small businesses, and e-commerce platforms across Indonesia, the Philippines, Thailand, Malaysia, and Vietnam. While transaction acquiring represents the foundational revenue engine, Xendit has diversified its revenue streams by expanding into cross-border payouts, automated recurring subscription billing, and value-added SME credit solutions such as invoice financing and working capital facilities. This multi-product expansion enables Xendit to capture incremental wallet share from high-growth digital businesses while establishing cross-sell channels across domestic banking networks and merchant platforms.
    claimRefs:
      - CI001
      - CI004
      - CI007
      - CI008
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-structure-mechanics
    title: Pricing Structure and Fee Mechanics
    body: Xendit's monetization framework relies on published list rates that vary significantly by payment rail, transaction volume, and regional acquiring infrastructure. For card-based processing, standard list pricing reaches 3.0% plus $0.80 for domestic credit cards and 4.0% plus $0.80 for international cards, reflecting the heightened processing costs and fraud liabilities inherent in cross-border acquiring. Conversely, localized emerging-market payment methods—such as Indonesian virtual accounts and direct bank transfers—are priced at lower fees of 0.5% plus $0.20 and 2.13% plus $0.60 respectively, while national QRIS payments incur a 0.7% plus $0.20 charge. Although these rates represent published baseline schedules for standard onboarding, large enterprise merchants and marketplace aggregators negotiate custom tiered take rates based on total monthly payment volume and specific rail routing arrangements.
    claimRefs:
      - CI001
      - CI002
      - CI003
    tableRefs:
      - TI002
  - id: unit-economics-cost-structure
    title: Unit Economics, Cost Structure, and Margin Proxies
    body: Evaluating Xendit's true unit economics requires separating gross transaction throughput from net retained revenue after partner pass-through deductions. Because emerging Southeast Asian markets have credit card penetration rates below 5%, merchant volumes heavily concentrate in bank virtual accounts, direct bank transfers, and local digital wallets. For each transaction processed across these rails, Xendit must pay network interchange fees, bank partner settlement costs, and mobile wallet provider commissions, directly compressing the gross margin realized on core acquiring. Furthermore, go-to-market investments have demanded continuous sales workflow optimization; implementation data indicates that CRM process overhauls generated an 8% increase in sales win rates, a 15% reduction in enterprise sales cycle length, and a 25% efficiency gain for account representatives managing extended enterprise deal cycles.
    claimRefs:
      - CI005
      - CI006
      - CI013
    tableRefs:
      - TI003
  - id: capital-adequacy-underwriting-verdict
    title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
    body: From a capital adequacy perspective, Xendit built substantial liquidity reserves by securing $300 million in Series D venture capital in May 2022, which brought total equity funding raised to $538 million under the backing of Coatue and Insight Partners. By late 2021, the business had demonstrated rapid scale, expanding annualized transaction volume from 65 million to 200 million and scaling total payments value from $6.5 billion to $15 billion. However, private market benchmarks—such as the Hurun Global Unicorn List valuation of 20.5 billion RMB in June 2026—and secondary trading listings on platforms like EquityZen operate without verified financial disclosures. Because audited net revenue figures, cash burn rates, and gross margin percentages remain strictly private, underwriting capital runway requires direct access to confidential management accounts to verify post-2022 cash flow self-sufficiency.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
tables:
  - id: TI001
    title: Revenue Streams and Monetization Mechanisms
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit / Metric
      - Current Value / Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Payment Gateway Acquiring
        - Take rate on processed transaction volume
        - Percentage + fixed fee per transaction
        - 3.0% + $0.80 (cards), 0.7% + $0.20 (QR)
        - High (recurring flow, volume-driven)
        - Obtain blended net take rate after bank interchange
      - - Virtual Accounts & Bank Rails
        - Fixed and percentage fee per virtual account transfer
        - Fee per bank transaction
        - 0.5% + $0.20 per transaction
        - High (dominant regional checkout method)
        - Verify per-bank settlement cost pass-through
      - - Payouts & Disbursements
        - Batch and real-time bank/wallet disbursement fee
        - Per-payout transaction fee
        - Multi-currency payouts across 7 APAC currencies
        - Moderate (price-competitive commodity rail)
        - Audit payout gateway margin and banking partner tiers
      - - Value-Added Lending & SaaS
        - Origination fee, interest margin, and monthly plan fees
        - Per active plan or loan percentage
        - $0.30/month per subscription; lending in ID
        - Moderate (credit risk, regulatory capital needed)
        - Examine loan loss provisions, NPL rates, and balance sheet risk
    notes: Values reflect published pricing structures and commercial announcements; realized net take rates and unit margins remain unverified.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
  - id: TI002
    title: Monetization and List Pricing Structure
    columns:
      - Payment Method / Rail
      - Contract & Pricing Basis
      - List Fee Structure
      - Realized vs List Gap
      - Discounts & Unknowns
      - Source Reference
    rows:
      - - Domestic Credit Cards
        - Per-transaction fee without monthly minimums
        - 3.0% + $0.80 per successful transaction
        - Enterprise volume discounts reduce card take rates
        - Interchange pass-through margins undisclosed
        - Growth Engineer review & official pricing
      - - International Cards
        - Cross-border surcharge and processing fee
        - 4.0% + $0.80 per successful transaction
        - Blended FX markups and network cross-border fees
        - Chargeback fees and FX conversion spreads private
        - Growth Engineer commercial audit
      - - E-Wallets (OVO, Dana, GrabPay)
        - Local wallet acquiring fee
        - 2.70% + $0.40 per successful transaction
        - Tiered merchant contracts offer customized rates
        - Wallet operator revenue share split unknown
        - Growth Engineer & official portal
      - - Indonesian QRIS Standard
        - National QR standard processing fee
        - 0.7% + $0.20 per successful transaction
        - Government-mandated interchange caps apply
        - Merchant category code fee variations unconfirmed
        - Official pricing & Growth Engineer
    notes: Official list rates represent standard self-service pricing; high-volume enterprise contracts typically negotiate custom blended rates.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
  - id: TI003
    title: Unit Economics and Financial Underwriting Indicators
    columns:
      - Financial Metric
      - Reported / Estimated Value
      - Confidence Level
      - Analytical Significance
      - Diligence Requirement
    rows:
      - - Annualized Total Payments Value
        - $15.0B (reported 2021)
        - High
        - Indicates processing scale and regional market penetration
        - Request 2024-2026 TPV run-rate and country breakdown
      - - Annualized Transaction Volume
        - 200M transactions (reported 2021)
        - High
        - Reflects transaction throughput and pipeline infrastructure stress
        - Verify current annualized transaction counts across all rails
      - - Blended Net Take Rate
        - 'null'
        - Low
        - Critical bridge from gross TPV to net recognized revenue
        - Inspect gross processing revenue less interchange deductions
      - - Gross Margin Percentage
        - 'null'
        - Low
        - Determines unit-level profitability after partner fees and network costs
        - Examine direct cost of goods sold across banking rails
    notes: High-scale TPV and transaction figures date to the Series D disclosure; unit margins and net revenue percentages require confidential verification.
    claimRefs:
      - CI009
      - CI010
      - CI013
      - CI014
