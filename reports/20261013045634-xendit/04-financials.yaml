callouts:
  - calloutType: risk
    title: Gross Margin Compression from Local Rail Economics
    body: Because credit card penetration across Southeast Asia remains under 5% in core markets like Indonesia, Xendit must rely heavily on virtual accounts, bank transfers, and local e-wallets. These local rails feature lower absolute fee caps and higher fixed banking integration overhead than global card networks, compressing net take rates unless offset by high transaction frequency or software add-ons.
    claimRefs:
      - CI001
      - CI003
      - CI013
  - calloutType: insight
    title: Capital Sufficiency Dependent on Unit Economics Disclosure
    body: While Xendit amassed $538 million in total venture funding through its 2022 Series D, the company has operated without disclosing audited post-2022 financial results. In the absence of published net revenue margins or cash burn metrics, underwriting fair market valuation requires independent confirmation of capital runway and positive operating cash flow.
    claimRefs:
      - CI010
      - CI012
      - CI014
