        - "Verified market share in core Indonesian and Philippine enterprise processing"
      - - "Product Moat"
        - "Unified API spanning virtual accounts, e-wallets, payouts, subscriptions, and KYC verification creates high switching costs"
        - "Core gateway switching costs are vulnerable to merchant multi-homing and price competition"
        - "Net revenue retention (NRR) and multi-product attach rates across enterprise cohorts"
      - - "Unit Economics"
        - "Transaction-based fee model with automated payout and value-added software products provides operating leverage"
        - "Low card penetration (3%) and reliance on low-margin virtual accounts and e-wallets compress net take rates"
        - "Disclosed gross margin after banking partner and rail pass-through costs"
      - - "Capital & Valuation"
        - "Backed by top-tier institutions ($538M raised, YC, Accel, Coatue, Insight, Tiger Global) with unicorn scale"
        - "Late-2022 workforce reductions (5%) to extend runway indicate burn discipline necessitated by funding slowdown"
        - "Cap-table terms, liquidation preferences, and verified break-even run rate"
    notes: "Thesis and anti-thesis drivers assessed across 2015-2026 operating history, regional competitive dynamics, and public disclosures."
