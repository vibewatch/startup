  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Core Operating Assumptions"
      - "Valuation / Return Logic"
      - "Key Downside Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Rapid regional adoption across 5+ countries; successful monetization of subscriptions and payouts; TPV >$20B"
        - "$2.5B - $3.0B valuation via US or regional IPO at 8-10x net revenue multiple"
        - "Cross-border regulatory pushback, Stripe aggressive price cutting"
        - "20% (Low visibility into audited net revenue acceleration)"
      - - "Base Case"
        - "Defends core Indonesia and Philippines lead; modest take-rate compression; sustainable cash flow break-even"
        - "$1.0B - $1.5B fair value maintaining unicorn floor at 4-6x net revenue multiple"
        - "Growth deceleration, persistent margin pressure on domestic bank rails"
        - "55% (Consistent with private secondary marks and 2026 Hurun listing)"
      - - "Bear Case"
        - "Severe take-rate erosion from local banking rails; enterprise churn to Grab and Stripe; regional expansion stalls"
        - "$500M - $700M down-round or distressed acquisition at 2-3x net revenue multiple"
        - "Liquidity shortfall, high customer acquisition costs, regulatory licensing blocks"
        - "25% (Heightened by historical tech downturn layoffs and private illiquidity)"
      - - "Stress Test"
        - "Prolonged payment rail outages, regulatory revocation, or critical partner loss"
        - "Downside to liquidation preference floor or capital restructuring below $400M"
        - "Customer flight to alternative processors, structural loss of banking relationships"
        - "Tail risk (<5% probability but warrants liquidation preference scrutiny)"
    notes: "Scenario valuation ranges model enterprise value multiples on estimated net revenue; probabilities reflect qualitative risk weighting under current private disclosure limits."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV009"
      - "CV012"
