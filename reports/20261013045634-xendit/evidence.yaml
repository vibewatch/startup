evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Audited financial statements and ARR metrics
    missingEvidence: Audited current net revenue, ARR breakdown, and bridge from reported $25B TPV to net revenue and gross profit.
    whyItMatters: >-
      Without audited net revenue or gross take rates, valuation multiples cannot be reliably benchmarked against public
      payment processors.
    diligencePath: >-
      Request confidential financial disclosure package or management representation letters during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map complete cap table
    missingEvidence: >-
      Complete share register detailing exact percentage ownership, preferred share liquidation preferences, and
      employee option pools.
    whyItMatters: >-
      Partial investor enumeration leaves senior liquidation preference overhang and secondary pricing dynamics
      unconfirmed.
    diligencePath: Obtain updated cap table and shareholder agreement disclosures under formal NDA.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: digital-economy-and-tam-forecasts
    missingEvidence: >-
      Audited third-party payment volume breakdowns differentiating domestic card rails, virtual accounts, and
      account-to-account instant transfers across Southeast Asian sub-markets.
    whyItMatters: >-
      Reported digital economy projections diverge between $300B and $360B, and aggregate gross transaction values do
      not clarify take rates or addressable software margins for regional payments infrastructure.
    diligencePath: >-
      Acquire central bank transaction statistics from Bank Indonesia (BI-FAST/QRIS) and Bangko Sentral ng Pilipinas to
      cross-reference merchant PSP payment mix.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: blocking
    topic: financial-audits
    missingEvidence: Audited income statements, GAAP/IFRS net revenue disclosures, and certified cash burn figures.
    whyItMatters: >-
      Without audited net revenue and gross profit, underwriting valuation cannot verify real take rates or unit
      profitability.
    diligencePath: >-
      Request confidential audited financials, monthly cash burn schedules, and banking covenants from management under
      NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention
    missingEvidence: Merchant cohort retention, net revenue retention (NRR), and top-merchant volume concentration breakdowns.
    whyItMatters: >-
      High concentration among volatile e-commerce or crypto merchants creates unmodeled gross margin and TPV
      volatility.
    diligencePath: Review merchant-level cohort revenue tables and concentration reports during formal dataroom diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation-marks
    missingEvidence: Recent 409A valuation reports, secondary transaction share prices, and internal liquidation preference waterfalls.
    whyItMatters: Secondary platforms list pre-IPO shares without clearing prices, leaving fair market equity value uncertain.
    diligencePath: >-
      Obtain the most recent cap table, 409A appraisal report, and latest fund marks from lead investors Coatue and
      Insight Partners.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: telemetry-and-performance
    missingEvidence: >-
      Audited public telemetry for API transaction throughput, P99 endpoint latency, and regional uptime across specific
      national banking connectors.
    whyItMatters: >-
      Without public latency and connector uptime SLAs, underwriters cannot verify performance parity between direct
      bank connections and third-party aggregator fallbacks.
    diligencePath: >-
      Request production SLA reports, incident post-mortems for partner bank outages, and historical connector uptime
      logs under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer community telemetry such as GitHub SDK repository stars and forks, package registry download
      statistics (npm/PyPI), and open API discussion forum volume.
    whyItMatters: >-
      Direct package download metrics and developer issue resolution times provide independent verification of developer
      adoption and SDK maintenance velocity.
    diligencePath: >-
      Inspect public SDK repositories on GitHub and package registries for Xendit client libraries, or request internal
      developer platform telemetry.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: Customer retention metrics and merchant concentration
    missingEvidence: >-
      Audited merchant churn rates, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and top-10 merchant
      transaction volume concentration figures across Indonesia and the Philippines.
    whyItMatters: >-
      Without disclosure of cohort retention, churn, or merchant concentration, it is impossible to verify whether
      payment volume growth is driven by recurring, durable merchant relationships or high merchant turnover masked by
      new logo acquisition.
    diligencePath: >-
      Request confidential merchant cohort retention schedules, top-20 customer revenue contribution breakdowns, and
      contract renewal rates under non-disclosure agreement.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Active merchant count and transaction volume breakdown
    missingEvidence: >-
      Granular breakdown of active vs registered merchants, average transaction value (ATV) by segment, and volume split
      between domestic Indonesia rails and cross-border expansion markets.
    whyItMatters: >-
      Broad metrics such as 'over 10,000 businesses' aggregate inactive or testing accounts with enterprise high-volume
      merchants, obscuring the true active merchant base.
    diligencePath: >-
      Obtain management reporting on monthly transacting merchants (MTMs), annualized payment volume by cohort, and
      cross-border payment corridor volume.
    relatedTableRefs:
      - TU001
      - TU002
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Primary regulator-register entries, license identifiers, conditions, renewal dates, enforcement correspondence,
      and a complete entity-to-license map.
    whyItMatters: >-
      Company claims establish intended coverage but cannot verify current good standing, permitted activities, or
      unresolved regulator conditions.
    diligencePath: >-
      Obtain license copies and legal opinions, then confirm each license and material condition directly against the
      relevant regulator register and management correspondence.
    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-loss-and-concentration
    missingEvidence: >-
      Incident and outage history, SLA performance, fraud and chargeback loss rates, reserve coverage, aged
      reconciliation items, and concentration by merchant, rail, partner, and country.
    whyItMatters: >-
      Product breadth and partner counts do not measure control effectiveness, loss severity, substitutability, or the
      exposure created by concentrated transaction volume.
    diligencePath: >-
      Review board risk packs, incident reports, SLA dashboards, loss and reserve cohorts, and monthly concentration
      schedules under NDA; reconcile them to audited financial statements.
    relatedQuestionRefs:
      - QR009
      - QR010
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-economics-and-liquidity
    missingEvidence: >-
      Audited net revenue, gross margin after partner pass-through, operating cash burn, cash and debt balances, runway,
      credit losses, liquidation preferences, and current secondary pricing.
    whyItMatters: >-
      Funding raised does not establish cash availability, profitability, downside protection, or the financing terms
      that determine investor returns.
    diligencePath: >-
      Request audited statements, a net-revenue bridge, cash and debt confirmations, monthly burn history, the cap
      table, preference stack, and recent primary and secondary term sheets.
    relatedQuestionRefs:
      - QR007
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margins
    missingEvidence: >-
      Audited current financial statements detailing net revenue, gross margins after bank and rail pass-through fees,
      and GAAP operating losses.
    whyItMatters: >-
      Without audited gross margin data, evaluating whether Xendit's $1.0B-$1.5B private valuation is supported by
      durable earnings power is impossible.
    diligencePath: >-
      Request audited 2024-2025 financial statements and quarterly management accounts under NDA directly from Xendit
      finance leadership.
    relatedQuestionRefs:
      - QV002
      - QV003
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Full capitalization table disclosing share classes, liquidation preferences, seniority senior to common stock, and
      option pool overhang.
    whyItMatters: >-
      Series C and D preferred shares likely hold senior liquidation preferences that create downside overhang for
      secondary common share buyers.
    diligencePath: >-
      Obtain formal cap table schedule and investor rights agreement through an authorized pre-IPO secondary broker or
      company counsel.
    relatedQuestionRefs:
      - QV003
      - QV006
    relatedTableRefs:
      - TV003
