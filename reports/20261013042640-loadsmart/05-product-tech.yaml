  - id: TE002
    title: Workflow and Operational Use-Case Mapping
    columns:
      - User Job / Workflow
      - Legacy Operational Workflow
      - Loadsmart Platform Solution
      - Measurable Operational Benefit
      - Key Technical Limitation
    rows:
      - - Spot Freight Procurement
        - Manual phone calls and email requests to multiple brokers
        - Instant algorithmic pricing and automated digital booking
        - Immediate rate confirmation and 100% capacity guarantee
        - Subject to freight spot-market volatility and carrier rate swings
      - - Facility Dock Scheduling
        - Spreadsheet tracking, phone appointments, and manual check-in
        - Opendock digital portal with self-service driver check-in
        - Reduced facility wait times and paperless driver check-in
        - Requires adoption by independent, non-credentialed third-party drivers
      - - Yard Gate & Asset Logging
        - Security guards manually inspecting trailer IDs and clipboard logs
        - NavTrac SmartGate automated computer vision cameras
        - Up to 40% of detention claims challenged and 95% damage disputes resolved
        - Camera lens occlusion, lighting deficits, and obscured container markings
      - - Order-to-Invoice Processing
        - Manual data entry across disconnected TMS and ERP systems
        - Loadsmart platform-level autonomous AI agents with human exception review
        - End-to-end task automation and reduced manual exception touches
        - System depends heavily on structured data hygiene in customer ERP/TMS
    notes: Operational use cases and legacy workflow contrasts compiled from Loadsmart technical releases and FreightWaves acquisition coverage; stated operational benefits reflect company target metrics and pilot deployment results.
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE010
  - id: TE003
    title: Technology Stack and Operating Architecture Analysis
    columns:
      - Architecture Layer / Component
      - Role & Functionality
      - Technical Dependency
      - Primary Operational Risk
    rows:
      - - Application & Portal Layer
        - Shipper web dashboard, carrier portal, and mobile check-in interfaces
        - Cloud infrastructure hosting and cross-browser web standards
        - Latency spikes during high-volume spot auction periods
      - - Integration & Connector Layer
        - REST APIs and EDI adapters connecting to SAP, Oracle, and MercuryGate
        - Shipper IT maintenance and third-party TMS API stability
        - Schema mismatch or API deprecation in legacy shipper systems
      - - AI Agent & Logic Layer
        - Autonomous agents executing quoting, tracking, and scheduling workflows
        - Underlying LLM / rules engine and clean structured shipment data
        - Hallucinated or invalid booking instructions if exceptions are unflagged
      - - Edge Computer Vision Layer
        - NavTrac SmartGate optical cameras and license plate / OCR processors
        - On-premise gate hardware, local network uptime, and optical sensor calibration
        - Physical gate downtime requiring manual security guard fallback
    notes: Architecture layers and technical dependencies derived from Loadsmart engineering announcements and platform integration specifications; underlying machine learning model parameters, training datasets, and proprietary camera hardware schematics remain private.
