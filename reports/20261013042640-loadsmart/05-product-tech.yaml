  - id: FE001
    title: Loadsmart Multi-Tiered Product and Operating Architecture Map
    type: stack
    summary: Six-layer architectural stack connecting enterprise shipper systems, platform AI agents, facility scheduling, edge computer vision, and third-party motor carriers.
    data:
      layers:
        - label: User Interaction & Engagement Layer
          detail: Shipper self-service web portal, carrier load board, and Opendock facility scheduling UI
          modules:
            - Shipper Portal
            - Carrier Portal
            - Opendock UI
        - label: Autonomous AI Agent Layer
          detail: Platform-level software agents automating quoting, booking, appointment scheduling, and invoice reconciliation
          modules:
            - Quoting Agent
            - Dispatch Agent
            - Tracking Agent
        - label: Transportation Management & Execution Layer
          detail: ShipperGuide TMS core engine managing multi-modal shipment planning, procurement, spot bidding, and consolidation
          modules:
            - Procurement Engine
            - Rating Engine
            - Consolidation Logic
        - label: Facility & Yard Management Layer
          detail: Opendock dock scheduling coupled with YMS drag-and-drop yard tracking and SMS driver communication
          modules:
            - Dock Scheduling
            - Yard Manager
            - Driver 2-Way SMS
        - label: Edge Sensing & Computer Vision Layer
          detail: NavTrac SmartGate camera stations executing optical character recognition on truck license plates and trailer numbers
          modules:
            - OCR Camera Gate
            - Vehicle Detection
            - Damage Image Capture
        - label: Enterprise Integration & Data Layer
          detail: Bi-directional REST APIs and EDI bridges communicating with customer ERPs (SAP, Oracle) and partner telematics
          modules:
            - REST API Gateway
            - EDI 204/214/210 Feeds
            - Enterprise TMS Connectors
    approximationNotes: Architecture layers, subsystem boundaries, and integration interfaces synthesized from Loadsmart platform specifications and NavTrac technical releases; proprietary agent model weights and edge hardware schematics remain private.
