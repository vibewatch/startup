evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements detailing gross revenue, net revenue, GAAP gross margins, and segment breakdown
      across brokerage, managed transportation, and software.
    whyItMatters: >-
      Without segmented financial disclosures, investors cannot assess whether the $1.3B Series D valuation multiple
      reflects high-margin SaaS economics or lower-margin brokerage volume.
    diligencePath: >-
      Request confidential historical financials, segment margin schedules, and current capitalization cap table under
      NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-terms
    missingEvidence: >-
      Preferred stock certificate of incorporation and investor rights agreements establishing liquidation preferences,
      board composition, and dividend rights.
    whyItMatters: >-
      Senior liquidation preferences from late-stage capital like SoftBank Latin America Fund may significantly
      constrain common and earlier preferred equity returns in secondary or M&A outcomes.
    diligencePath: >-
      Review Delaware Division of Corporations restated charter filings and formal series preference schedules in the
      confidential data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-disclosure
    missingEvidence: >-
      Audited breakdown of Loadsmart gross merchandise volume (GMV), net brokerage revenue, and SaaS subscription ARR
      across ShipperGuide and Opendock.
    whyItMatters: >-
      Prevents precise calculation of net take-rates and software revenue attach, requiring reliance on third-party
      run-rate estimates.
    diligencePath: >-
      Request management disclosure of GAAP net revenue by segment, gross profit contribution, and software recurring
      revenue cohorts under non-disclosure agreement.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-retention-metrics
    missingEvidence: >-
      Audited logo churn, net revenue retention (NRR), and multi-homing rates specifically comparing Loadsmart against
      digital brokerage peers.
