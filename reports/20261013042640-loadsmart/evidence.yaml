      lock-in or commoditizes into spot capacity.
    diligencePath: >-
      Request customer cohort retention and wallet-share retention data across ShipperGuide TMS and standalone brokerage
      accounts.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
