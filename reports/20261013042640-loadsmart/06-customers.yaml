figures:
  - id: FU001
    title: 'Customer Journey Map: Shipper & Facility Expansion Loops'
    type: journey-map
    summary: Visualizes customer progression from transactional spot booking to integrated TMS, Opendock yard management, and managed transportation outsourcing.
    approximationNotes: Illustrates canonical software attach and managed service expansion stages identified in company whitepapers and executive statements.
    claimRefs:
      - CU005
      - CU010
      - CU011
      - CU012
    data:
      items:
        - label: Initial Engagement (Spot / Brokerage)
          stage: Spot Freight Procured
          persona: Shipper Logistics Coordinator
          action: Requests instant quote for spot freight capacity
          touchpoints: Loadsmart Web Portal, TMS API integration
          experience: Instant pricing, 100% capacity guarantee, automated load tendering
          retentionLoop: Automated rate benchmarking against contract rates
        - label: Dock Scheduling Adoption (Opendock)
          stage: Facility Appointments
          persona: Warehouse Operations Manager
          action: Schedules inbound/outbound dock appointments
          touchpoints: Opendock Facility Portal, Driver SMS
          experience: Eliminates phone calls and spreadsheets, reduces facility congestion
          retentionLoop: Integration into existing WMS and ERP workflows
        - label: Software Adoption (ShipperGuide TMS)
          stage: Core TMS Workflow
          persona: Director of Transportation
          action: Procures and manages multi-modal carrier network
          touchpoints: ShipperGuide Web App, EDI/API connections
          experience: End-to-end visibility, automated mini-bids, freight audit and settlement
          retentionLoop: Consolidated multi-modal freight data and contract benchmarking
        - label: Yard & Gate Digitization (Opendock YMS)
          stage: Yard & Gate Automation
          persona: Plant & Yard Superintendent
          action: Deploys YMS and NavTrac optical recognition
          touchpoints: Opendock YMS, Gate OCR Cameras, Tablet App
          experience: Driver self-check-in, trailer drag-and-drop assignments, asset tracking
          retentionLoop: Connected data flow from dock appointment to yard movement
        - label: AI Agent Orchestration
          stage: Autonomous Workflow
          persona: VP Supply Chain Operations
          action: Automates repetitive freight tasks via Loadsmart AI
          touchpoints: Platform AI Layer, Automated Email & Exceptions
          experience: Autonomous load re-tendering, document matching, claims processing
          retentionLoop: High platform switching costs due to automated operational rules
        - label: Managed Transportation Services
          stage: Enterprise Outsourcing
          persona: Chief Supply Chain Officer
          action: Outsources complete transportation management to Loadsmart team
          touchpoints: Dedicated Logistics Advisory Team, Executive Analytics
          experience: End-to-end network optimization, dedicated customer operations teams
          retentionLoop: Full outsourcing contract with long-term commercial tie-in
callouts:
  - calloutType: risk
    title: Disclosed Customer Metrics Lack Cohort Retention Granularity
    body: While Loadsmart advertises 1,800+ global customers and 4,500+ connected warehouses, the company does not disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or customer concentration. Furthermore, standard user agreements grant Loadsmart automatic rights to reproduce customer names and logos in marketing materials, obscuring the distinction between active enterprise software contracts and incidental brokerage transactions.
    claimRefs:
      - CU002
      - CU005
      - CU013
  - calloutType: insight
    title: Unified Dock and TMS Network Drives Low-Friction Shipper Expansion
    body: Loadsmart leverages Opendock 4,500+ warehouse footprint and 14M+ annual dock appointments as an organic wedge into shipper supply chains. By connecting facility appointment scheduling with ShipperGuide TMS and carrier brokerage, Loadsmart captures workflow data across the freight lifecycle that point-solution TMS providers cannot easily replicate.
    claimRefs:
      - CU003
      - CU004
      - CU010
