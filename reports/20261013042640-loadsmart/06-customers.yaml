company:
  name: Loadsmart
chapter:
  number: 6
  title: Customers
  summary: Loadsmart serves over 1,800 global customers and connects 230,000+ carriers across 4,500+ warehouses, blending an AI-native TMS and dock network with managed brokerage services. However, public disclosure remains heavily aggregated, with no cohort-level net revenue retention (NRR) or customer concentration metrics, and carrier dispute records underscore platform friction in spot matching.
sections:
  - id: customer-segmentation-and-buyer-personas
    title: Customer Segmentation & Buyer Personas
    body: 'Loadsmart operates across three distinct buyer categories that drive commercial demand: enterprise shippers, mid-market manufacturers, and warehouse or terminal operators. For enterprise shippers, purchasing decisions are typically owned by Vice Presidents of Supply Chain or heads of logistics procurement who seek a hybrid combination of software tooling and managed brokerage execution. These enterprise buyers utilize ShipperGuide TMS alongside Loadsmart managed transportation services to handle multi-modal procurement, contract benchmarking, and dedicated capacity allocation. In the mid-market segment, traffic managers and logistics directors engage primarily for spot capacity matching, dynamic pricing, and automated mini-bids, balancing cost reduction against service reliability. Meanwhile, warehouse and distribution facility operators represent a strategic third constituency, adopting Opendock for dock appointment scheduling and yard management. On the fulfillment supply side, over 230,000 vetted motor carriers interact with the platform to book loads, negotiate spot rates, and execute over-the-road freight. This two-sided dynamic creates structural interdependencies where software utility directly subsidizes brokerage liquidity and vice versa.'
    claimRefs:
      - CU001
      - CU004
      - CU005
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-network-scale
    title: Adoption Trajectory & Network Scale
    body: Loadsmart commercial footprint has expanded to more than 1,800 global enterprise and shipper accounts, supported by a digital logistics network spanning 4,500+ warehouse facilities and over 230,000 vetted motor carriers. The platform processes in excess of 14 million dock appointments annually through Opendock, positioning it as one of the densest operational facility networks in the North American freight sector. Third-party industry estimates from GetLatka evaluate Loadsmart revenue run rate at approximately $108 million as of late 2025, reflecting substantial scale achieved across transactional brokerage margins and recurring software subscriptions. By embedding artificial intelligence agents into its shared data architecture across ShipperGuide and Opendock, Loadsmart automates high-volume tendering, dock scheduling, document matching, and freight exception resolution. This multi-product scale provides defensible network density, yet the aggregate nature of public reporting conceals critical unit economics, such as the proportion of software-only subscribers relative to transactional spot freight shippers.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
      - CU010
      - CU012
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-deployments-and-customer-proof
    title: Named Customer Deployments & Case Proof
    body: Publicly verifiable customer evidence for Loadsmart is characterized by a mix of enterprise cohort claims, judicial records, and warehouse technology partnerships. Official marketing materials state that Loadsmart dedicated account management teams serve as logistics advisors to 30 percent of the top Fortune 100 shippers in North America, highlighting enterprise penetration among the largest multinational retail and consumer goods supply chains. Concrete production evidence emerges from federal judicial filings, notably Ryan Breach v. Loadsmart in the U.S. District Court for the Eastern District of Pennsylvania. Court filings establish that Loadsmart repeatedly dispatched contracted motor carriers to transport manufactured corrugated packaging from Pratt Industries manufacturing plants in Macungie, Pennsylvania, to Home Depot major distribution hub in Breinigsville, Pennsylvania, on dedicated recurring matching assignments paying $900 per trip. In the warehousing software vertical, Loadsmart deployed its integrated Yard Management System across more than 3,500 Opendock facilities nationwide, introducing driver self-check-in, asset tracking, and gate OCR through NavTrac computer vision integrations.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: retention-durability-and-concentration-risks
    title: Retention Durability, Procurement Friction & Concentration Risks
    body: Despite reported top-line customer growth, Loadsmart faces material diligence gaps regarding net revenue retention (NRR), customer concentration, and procurement durability. The company does not publicly disclose cohort-level logo retention, gross revenue retention, or the percentage of revenue derived from its top-ten shipper relationships. Furthermore, examination of Loadsmart standard user agreement reveals contractual provisions wherein users grant Loadsmart automatic rights to display company names and corporate logos in promotional collateral, limiting the evidentiary weight of public logo walls. On the carrier side, court documents demonstrate that contractual arrangements and platform matching are governed by strict dispute resolution terms, including mandatory New York forum selection clauses that restrict carrier legal recourse. During freight market downturns, shippers frequently renegotiate routing guides and reduce spot brokerage allocation, increasing execution risk for hybrid logistics providers. Investors must closely evaluate whether Loadsmart managed transportation contracts provide sufficient multi-year duration and switching costs to insulate gross profit from cyclical spot volatility.
    claimRefs:
      - CU005
      - CU013
      - CU014
