  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Tier 1 Carrier Network Dependability
        - Independent Motor Carriers (230k+)
        - Freight movement capacity
        - Dispersed
        - Carrier insolvencies or capacity exit during protracted freight recessions
        - High
        - Multi-carrier automated routing and instant rate discovery across dry van, reefer, and flatbed
        - Sudden capacity shortages on volatile lanes
      - - Enterprise TMS Ecosystem Integration
        - SAP, Oracle, MercuryGate, McLeod
        - Shipper workflow embeddedness
        - High across enterprise client base
        - API schema deprecation, integration maintenance costs, or partner platform walled-garden restrictions
        - Medium
