  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation Stance
      - Assigned Value / Rating
      - Key Evidentiary Basis
      - Primary Risk or Overhang
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Differentiated AI-native TMS and Opendock dock scheduling network spanning 4,500+ warehouses
        - Stale $1.3B Series D valuation from February 2022 unsupported by freight recession realities
        - Withhold new investment pending audited financial segmentation and margin disclosure
      - - Confidence Level
        - medium
        - Verified funding history of $346.4M and strategic investor roster including SoftBank and CSX
        - Lack of audited GAAP financials, private gross margins, and net recurring ARR data
        - Avoid large capital commitments; require confirmatory private diligence
      - - Risk Rating
        - high
        - Persistent North American freight cycle softness and rate depression
        - Potential liquidation preference overhang across $300M+ senior preferred capital
        - Model downside liquidation waterfall scenarios to evaluate common equity impairment
      - - Valuation Stance
        - stretched
        - Headline Series D mark of $1.3B implies ~12.0x multiple on estimated $108M revenue
        - Public 3PL broker comps trade at 0.4x-1.0x revenue, creating severe down-round vulnerability
        - Cap proposed entry enterprise valuation at $200M-$250M (1.5x-2.3x estimated net revenue)
    notes: >-
      Recommendation and risk ratings synthesize publicly documented financing rounds and third-party estimated revenue
      run-rates; null values reflect unreleased private GAAP audit statements.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV007
      - CV008
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Core Argument
      - Supporting Evidence
      - Key Risk or Vulnerability
      - What Would Change the View
    rows:
      - - Investment Thesis
        - >-
          Connected logistics platform unifying TMS, dynamic brokerage, and dock scheduling drives defensible operating
          leverage
        - Opendock network covers 4,500+ warehouses and 230,000+ carriers with 100% tender acceptance guarantee
        - Brokerage execution revenue remains cyclical and subject to gross margin compression
        - Audited proof that SaaS subscription ARR exceeds 50% of total company gross profit
      - - Investment Anti-Thesis
        - >-
          Stale 2022 unicorn valuation benchmark leaves capital structure vulnerable to severe down-round repricing and
          preference overhang
        - >-
          $1.3B valuation established in February 2022 amidst historic freight rate peak; estimated revenue of $108M
          implies 12.0x multiple
        - Excessive multiple contraction in freight tech could wipe out junior equity in a recapitalization
        - Direct secondary transaction or extension financing round clearing above $1.0B valuation
      - - Product & Network
        - Integration of ShipperGuide TMS and Opendock creates proprietary operational data network
        - Direct TMS embedding delivers instant bookable pricing with over 500 real-time market data points
        - Carrier network adoption could stall if spot margins compress further
        - Demonstrated acceleration in enterprise ShipperGuide attach rates and net logo retention >115%
      - - Capital & Runway
        - Substantial cumulative venture funding of $346.4M provides operating cushion
        - Participation from strategic backers including SoftBank Latin America Fund, CSX Corp, and BlackRock
        - Senior liquidation preferences across 8 rounds create major hurdle for common shareholders
        - Certified balance sheet demonstrating positive GAAP operating cash flow and >24 months runway
    notes: >-
      Comparative thesis matrix derived from public product announcements, partner press releases, and venture financing
      data.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
