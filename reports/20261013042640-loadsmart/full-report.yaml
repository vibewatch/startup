              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Named Customer Deployments & Case Proof
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer evidence for Loadsmart is characterized by a mix of enterprise cohort claims,
              judicial records, and warehouse technology partnerships. Official marketing materials state that Loadsmart
              dedicated account management teams serve as logistics advisors to 30 percent of the top Fortune 100
              shippers in North America, highlighting enterprise penetration among the largest multinational retail and
              consumer goods supply chains. Concrete production evidence emerges from federal judicial filings, notably
              Ryan Breach v. Loadsmart in the U.S. District Court for the Eastern District of Pennsylvania. Court
              filings establish that Loadsmart repeatedly dispatched contracted motor carriers to transport manufactured
              corrugated packaging from Pratt Industries manufacturing plants in Macungie, Pennsylvania, to Home Depot
              major distribution hub in Breinigsville, Pennsylvania, on dedicated recurring matching assignments paying
              $900 per trip. In the warehousing software vertical, Loadsmart deployed its integrated Yard Management
              System across more than 3,500 Opendock facilities nationwide, introducing driver self-check-in, asset
              tracking, and gate OCR through NavTrac computer vision integrations.
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Retention Durability, Procurement Friction & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite reported top-line customer growth, Loadsmart faces material diligence gaps regarding net revenue
              retention (NRR), customer concentration, and procurement durability. The company does not publicly
              disclose cohort-level logo retention, gross revenue retention, or the percentage of revenue derived from
              its top-ten shipper relationships. Furthermore, examination of Loadsmart standard user agreement reveals
              contractual provisions wherein users grant Loadsmart automatic rights to display company names and
              corporate logos in promotional collateral, limiting the evidentiary weight of public logo walls. On the
              carrier side, court documents demonstrate that contractual arrangements and platform matching are governed
              by strict dispute resolution terms, including mandatory New York forum selection clauses that restrict
              carrier legal recourse. During freight market downturns, shippers frequently renegotiate routing guides
              and reduce spot brokerage allocation, increasing execution risk for hybrid logistics providers. Investors
              must closely evaluate whether Loadsmart managed transportation contracts provide sufficient multi-year
              duration and switching costs to insulate gross profit from cyclical spot volatility.
            claimRefs:
              - CU005
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disclosed Customer Metrics Lack Cohort Retention Granularity
            body: >-
              While Loadsmart advertises 1,800+ global customers and 4,500+ connected warehouses, the company does not
              disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or customer concentration.
              Furthermore, standard user agreements grant Loadsmart automatic rights to reproduce customer names and
              logos in marketing materials, obscuring the distinction between active enterprise software contracts and
              incidental brokerage transactions.
            calloutType: risk
            claimRefs:
              - CU002
              - CU005
              - CU013
          - type: callout
            title: Unified Dock and TMS Network Drives Low-Friction Shipper Expansion
            body: >-
              Loadsmart leverages Opendock 4,500+ warehouse footprint and 14M+ annual dock appointments as an organic
              wedge into shipper supply chains. By connecting facility appointment scheduling with ShipperGuide TMS and
              carrier brokerage, Loadsmart captures workflow data across the freight lifecycle that point-solution TMS
              providers cannot easily replicate.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Carrier Liability, and Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Loadsmart operates within a heavily regulated interstate freight transportation environment governed by
              the Federal Motor Carrier Safety Administration (FMCSA). While the company maintains active federal broker
              operating authority under MC-872918 and USDOT 2524523 along with the requisite $75,000 BMC-84 surety bond,
              its digital freight marketplace model introduces significant vicarious liability exposure. Recent federal
              court precedents have heightened scrutiny around broker liability under state common-law claims for
              negligent selection of motor carriers involved in highway accidents. Loadsmart mitigates this risk by
              contractually defining its service as a pure technology intermediary rather than a motor carrier,
              mandating that all 230,000+ registered carriers carry minimum insurance limits of $1,000,000 in commercial
              auto liability and $100,000 in cargo coverage rated A- or better. Furthermore, Loadsmart contractually
              prohibits unauthorized co-brokering and trip-leasing to insulate itself from double-brokering fraud and
              cargo theft rings that increasingly target digital brokerages.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, Logistics Execution, and Service Quality Risks
        blocks:
          - type: paragraph
            body: >-
              From an operational perspective, Loadsmart core value proposition relies on automated freight matching,
              instant rate quoting, and a contractual 100% capacity guarantee across full truckload, refrigerated, and
              intermodal freight. While algorithmic pricing eliminates friction in loose freight markets, it creates
              acute financial exposure during sudden spot-market rate spikes when the cost of securing carrier capacity
              can substantially exceed pre-quoted rates tendered to shippers. Independent industry assessments indicate
              that while Loadsmart performs effectively on dense interstate freight corridors, its carrier network
              density remains smaller than legacy Tier 1 brokerages such as C.H. Robinson and TQL on thin, rural, or
              specialized lanes. Additionally, the company intermodal product depends directly on Class I railroad
              terminal fluidity and train schedules, where rail congestion and chassis shortages create delivery delays
              outside of Loadsmart direct operational control. Loadsmart deploys proprietary AI agents to automate
              high-volume tendering and document matching, but operational exceptions continue to require human Freight
              Expert intervention.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner, Platform, and Macroeconomic Model Dependencies
        blocks:
          - type: paragraph
            body: >-
              Loadsmart software-plus-brokerage business model exhibits critical external ecosystem dependencies across
              shippers, carrier networks, and software infrastructure. The utility of the ShipperGuide TMS depends on
              continuous API and EDI connectivity with enterprise resource planning and transportation management
              platforms, including SAP, Oracle, MercuryGate, and McLeod. Any schema deprecation, integration maintenance
              friction, or partner platform walled-garden restrictions could disrupt Loadsmart embedded shipper
              workflows. Similarly, the dock scheduling and yard network operated through Opendock relies on continued
              facility adoption across 4,500+ warehouses to generate proprietary network effects. On the macroeconomic
              front, digital freight brokers remain vulnerable to severe freight market cyclicality, where prolonged
              recessions compress gross margins, depress spot transaction volumes, and force industry participants to
              curtail speculative technology investments. Diversifying revenue toward SaaS subscriptions and managed
              transportation provides partial countercyclical insulation, but brokerage volume remains a dominant
              contributor to overall platform scale.
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR014
      - number: '7.4'
        title: Financial Durability, Valuation Overhang, and Risk Heatmap
        blocks:
          - type: paragraph
            body: >-
              The primary investment risk confronting Loadsmart centers on valuation overhang and capital efficiency
              following its February 2022 Series D funding round, which valued the company at $1.3 billion post-money
              after raising $200 million. In the subsequent four years, the North American freight market experienced an
              extended freight recession characterized by excess carrier capacity and depressed contract rates.
              Third-party analyst estimates place Loadsmart revenue run rate at approximately $108 million ARR as of
              late 2025, suggesting that the company trades at an implied multiple of roughly 12x revenue if valued at
              its peak private mark. Without public financial disclosures confirming gross margins, net cash burn, or
              sustained GAAP profitability, investors face material dilution or down-round recapitalization risk if
              additional equity capital is required. Monitorable thesis-break triggers include any loss of FMCSA
              operating authority, material adverse judgments piercing broker liability defenses in catastrophic carrier
              accidents, or major enterprise customer defections resulting from automated quoting failures during market
              tightening.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Overhang and Capital Intensity Risk
            body: >-
              Loadsmart 2022 Series D valuation mark of $1.3 billion presents pronounced multiple compression exposure
              in the current macroeconomic climate. With estimated run-rate revenue of approximately $108 million,
              Loadsmart trades at an implied double-digit multiple that exceeds standard digital logistics and freight
              brokerage benchmarks, creating acute recapitalization risk if unprofitability persists.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Loadsmart operates a hybrid logistics architecture that integrates automated digital freight brokerage
              execution with SaaS logistics software, anchored by its proprietary ShipperGuide transportation management
              system and Opendock dock scheduling network (CV001, CV003). The core investment thesis posits that
              Loadsmart has successfully differentiated itself from pure-play digital freight brokerages by assembling
              an enterprise workflow platform spanning more than 4,500 warehouse facilities and 230,000 carrier
              participants (CV003, CV006). By offering 100% tender acceptance guarantees through automated dynamic
              pricing algorithms directly embedded into enterprise shippers TMS environments, Loadsmart reduces
              procurement friction and eliminates operational touchpoints across full truckload, less-than-truckload,
              and intermodal freight corridors (CV001, CV004). This technological integration theoretically supports
              superior customer stickiness and operational operating leverage compared to legacy third-party logistics
              providers whose businesses depend on manual broker staffing (CV004, CV006).


              Conversely, the investment anti-thesis highlights severe macroeconomic and structural headwinds that
              threaten enterprise equity value. The North American freight cycle has endured protracted freight
              recession and rate depression following pandemic-era spot market peaks, creating an environment
              characterized by aggressive shipper margin concessions, excess carrier capacity shakeouts, and suppressed
              transaction yields (CV005). Although Loadsmart has attempted to pivot toward higher-margin software and
              managed transportation services, independent estimates indicate that its annual revenue run-rate remained
              approximately $108 million in late 2025 (CV002). At this scale, the business remains heavily exposed to
              freight cycle volatility and brokerage volume compression, while its capital structure remains encumbered
              by $346.4 million in cumulative paid-in venture and growth capital without public disclosure of gross
              margins, software ARR, or GAAP net income (CV002, CV008). Until audited unit economics confirm structural
              profitability independent of cyclical brokerage spot volumes, the risk of equity dilution in future
              financing events remains acute (CV005, CV007).
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: Financing History, Capital Structure, and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Loadsmart established its headline valuation during the peak of the venture capital FreightTech expansion
              cycle in February 2022, closing a $200 million Series D financing round led by SoftBank Group Latin
              America Fund alongside strategic and institutional co-investors including CSX Corp., Janus Henderson
              Group, and BlackRock Inc. (CV007). This transaction established a post-money valuation of $1.3 billion,
              nearly tripling the company private valuation following its November 2020 Series C round and elevating
              Loadsmart to unicorn status (CV007). Dossier records from Clay indicate that across eight cumulative
              financing rounds, Loadsmart has raised $346.4 million in total equity and convertible capital, with
              earlier institutional backers including Maersk Growth, Chromo Invest, and Connor Capital SB participating
              in seed and Series A expansions (CV007, CV008).


              However, this $1.3 billion valuation benchmark is more than four years stale as of late 2026 and was
              underwritten during an unprecedented peak in global logistics freight rates and technology venture
              valuations (CV005, CV007). In the intervening years, macroeconomic monetary tightening and freight-market
              volume contractions have driven sharp multiple compression across publicly traded freight technology and
              third-party logistics comparables (CV005). With third-party databases estimating Loadsmart current
              operational scale at approximately $108 million in net revenue and approximately 463 to 505 employees,
              maintaining a $1.3 billion equity valuation requires an aggressive implied revenue multiple of 12.0x
              (CV002, CV007). For a business that still derives a substantial portion of its operating revenue from
              gross freight brokerage transactions where gross margins typically hover between 12% and 18%, an
              unadjusted 12x multiple represents an unsustainable premium that is unsupported by observable public
              market comparables (CV002, CV005). Investors must also consider the significant downside liquidation
              preference overhang: preferred shareholders hold seniority on more than $300 million in invested capital,
              which could impair common equity returns under lower-bound exit scenarios (CV007, CV008).
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
      - number: '8.3'
        title: Comparable Multiples and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating Loadsmart enterprise value requires decomposing its hybrid operating model into freight
              brokerage and logistics software components and benchmarking each against public market and transaction
              references. Traditional asset-light freight brokers and 3PLs such as C.H. Robinson Worldwide, Forward Air,
              and RXO trade at public enterprise value multiples ranging between 0.4x and 1.0x gross freight revenue, or
              approximately 3.0x to 6.0x net revenue / gross profit (CV002, CV005). Meanwhile, supply chain management
              software providers such as Manhattan Associates and Descartes Systems Group command revenue multiples of
              6.0x to 10.0x, reflecting high recurring software gross margins (>75%) and net revenue retention rates
              exceeding 105% (CV003, CV006). If Loadsmart business mix remains weighted toward digital brokerage
              execution (e.g., 75% brokerage gross revenue and 25% SaaS/dock software), a blended multiple of 1.2x to
              2.5x net revenue is appropriate for base-case modeling (CV002, CV003).


              Our bull case models an accelerated software transformation where Opendock network monetization across
              4,500+ warehouses and ShipperGuide TMS expansions drive high-margin recurring ARR to 40% of total revenue,
              unlocking an aggregate valuation of $540 million at a 3.6x blended forward multiple (CV003, CV006). Our
              base case assumes continued hybrid operations with modest revenue expansion to $135 million, where
              persistent freight rate softness yields a 1.5x multiple and a sustainable enterprise value of $202.5
              million (CV002, CV005). In the bear case, continued freight depression and customer churn compress net
              revenue to $85 million, while lack of software margin disclosures forces valuation down to pure 3PL
              asset-light multiples of 0.8x ($68 million), triggering severe down-round restructuring and preference
              dilution (CV002, CV007, CV008).
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.4'
        title: Recommendation, Risk Rating, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Synthesizing our quantitative scenario analysis and qualitative operational evidence, we assign Loadsmart
              an overall investment recommendation of research-more, accompanied by a high risk rating and a stretched
              valuation stance (CV007). While Loadsmart platform vision and proprietary dock/TMS integration demonstrate
              genuine technological capability, the disconnect between its $1.3 billion peak Series D valuation mark and
              its observable operating metrics represents an excessive risk barrier for new capital allocation (CV002,
              CV007). Investors should refrain from committing capital at valuations above $250 million unless
              comprehensive private diligence resolves key structural uncertainties regarding gross margin profile,
              software ARR contribution, and cap-table seniority provisions (CV007, CV008).


              To move the investment recommendation to buy or track, prospective investors must complete three mandatory
              confirmatory diligence investigations. First, obtain an audited financial breakdown segregating net
              revenue and gross profit contributions across digital freight brokerage, ShipperGuide TMS subscription
              licenses, and Opendock dock scheduling fees (CV002, CV003). Second, inspect the complete corporate
              capitalization table to verify whether SoftBank or other Series D investors hold participating preferred
              rights, cumulative dividend accruals, or senior liquidation preferences that subordinate junior equity
              holders in M&A or IPO outcomes (CV007, CV008). Third, evaluate trailing twelve-month cohort retention
              metrics, examining gross logo churn and net revenue retention among enterprise shippers utilizing
              automated tender acceptance and integrated TMS capacity (CV004, CV006).
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Maintain Disciplined Entry Valuation Cap
            body: >-
              Investors should maintain a disciplined valuation ceiling of $200M to $250M for Loadsmart equity. Paying
              anywhere near the peak $1.3B Series D valuation mark introduces unacceptable downside risk in light of
              ongoing freight market headwinds and lack of verifiable software gross margins.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV007
          - type: callout
            title: Senior Liquidation Preference Exposure
            body: >-
              With $346.4M in total venture capital raised across eight rounds, preferred shareholders hold significant
              liquidation preference seniority. In an exit below $350M, common equity and incentive option pools face
              substantial dilution or near-total impairment.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
