      - number: '4.2'
        title: Pricing Architecture, Go-To-Market Motion, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Loadsmart delivers dynamic spot rates alongside contracted shipper pricing backed by an algorithmic
              pricing engine and a 100% capacity tender acceptance guarantee. Unlike traditional brokerages relying on
              manual broker negotiations, Loadsmart integrates directly into enterprise shipper TMS platforms to provide
              instant bookable capacity without pricing renegotiation. However, third-party logistics evaluation by
              Fulfill underscores that Loadsmart provides no transparent public list pricing for its software or managed
              services, requiring prospective enterprise clients to undergo custom consultation and scope determination.
              The company focuses its direct sales motion on mid-market and enterprise accounts expending $2.5M or more
              in annual transportation costs. Software deployments are further bundled through Opendock and the newly
              introduced Yard Management System (YMS), enabling Loadsmart to cross-sell brokerage execution to facility
              operators already reliant on its dock management infrastructure.
            claimRefs:
              - CI002
              - CI010
              - CI012
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI007
      - number: '4.3'
        title: Cost Structure, Unit Economics, and Operational Working Capital
        blocks:
          - type: paragraph
            body: >-
              The economics of Loadsmart reflect the divergent margin profiles of low-margin transactional freight
              brokerage and high-margin recurring logistics software. Motor carrier freight disbursements represent the
              single largest cost of goods sold, directly determining gross margin realization across dynamic spot and
              contract lanes. Operational working capital dynamics are governed by Loadsmart user agreement terms:
              shippers are billed immediately upon load booking or under established credit terms, whereas motor
              carriers receive remittances up to thirty calendar days following proof-of-delivery upload. Loadsmart
              monetizes this payment lag through an optional TriumphPay Quickpay integration, allowing carriers to
              accelerate cash disbursements in exchange for a mandatory 2% discount from total invoiced freight value.
              Furthermore, Loadsmart enforces strict detention billing parameters, permitting 120 minutes of free
              standby time before assessing detention charges in 15-minute billable increments.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI015
      - number: '4.4'
        title: Capital Adequacy, Valuation Realism, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Loadsmart raised $200 million in a Series D funding round in February 2022 led by SoftBank Latin America
              Fund alongside strategic logistics investors including BlackRock, Maersk Growth, and CSX, establishing a
              peak private post-money valuation of $1.3 billion. Industry analyst GetLatka estimates Loadsmart annual
              revenue at roughly $108 million as of November 2025, suggesting an entry valuation multiple of
              approximately 12x revenue if held at Series D pricing. In the intervening freight cycle downturn, digital
              brokerage peers and public comparables experienced severe valuation multiple compression to 1.0x–2.0x net
              revenue. While Loadsmart augmented its software footprint through the acquisitions of Opendock, Kamion,
              and NavTrac, the absence of publicly disclosed balance sheets, cash burn figures, and debt obligations
              creates a material underwriting gap regarding post-2024 capital runway and ongoing standalone
              self-sufficiency.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue Opacity and Private Multiple Degradation
            body: >-
              Loadsmart has not disclosed audited revenue, net take rates, or ARR segmentation since its February 2022
              Series D at a $1.3B valuation. GetLatka estimates 2025 revenue at approximately $108M, implying an entry
              multiple of roughly 12x revenue if unrefreshed, while digital freight peers trade at compressed multiples
              of 1.0x to 2.5x net revenue in post-downturn freight markets.
            calloutType: risk
            claimRefs:
              - CI008
              - CI011
          - type: callout
            title: Working Capital Float and Quickpay Monetization
            body: >-
              Under Section VI of Loadsmart user agreement, shippers are billed immediately upon load booking or under
              contracted billing terms, while carrier remittances are scheduled up to 30 calendar days
              post-proof-of-delivery. Carriers opting for accelerated cash flow through TriumphPay incur a mandatory 2%
              discount, creating an ancillary high-margin revenue line and positive operational working capital float.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and End-to-End Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Loadsmart addresses enterprise logistics fragmentation by consolidating multimodal freight procurement,
              transportation management, and facility execution onto a single operating software platform. Historically,
              shippers managed transportation procurement through disconnected third-party logistics brokers while
              facility coordinators scheduled warehouse appointments using manual spreadsheets or isolated dock portals.
              Loadsmart bridges this structural divide by integrating its ShipperGuide transportation management system
              (TMS) with warehouse dock scheduling and facility yard management on a shared operational dataset. Within
              customer workflows, freight managers plan freight movements, execute automated carrier bidding, and book
              guaranteed truckload capacity directly from a unified interface. By embedding autonomous software agents
              at the platform architecture layer, Loadsmart automates routine freight lifecycle transactions from
              initial rate quotation through load tracking and final invoice auditing. Enterprise customers can either
              operate the software tools independently via SaaS self-service or engage Loadsmart's managed
              transportation team to augment and execute freight procurement under an outsourced operating model.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
