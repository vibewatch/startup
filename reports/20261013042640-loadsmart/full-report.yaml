            title: Platform Breadth Buffers Freight Cyclicality
            body: >-
              By pairing digital freight brokerage with high-retention software surfaces like ShipperGuide TMS and the
              Opendock warehouse scheduling network, Loadsmart insulates its revenue model from severe freight rate
              deflation and volume downturns.
