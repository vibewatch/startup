      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Network Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Loadsmart commercial engine spans a multi-sided logistics network connecting shippers, warehouse
              facilities, and small motor carriers. Enterprise and midmarket shippers represent the primary economic
              buyers, funding software and brokerage execution out of corporate logistics and transportation procurement
              budgets to mitigate rate volatility and automate carrier selection. Facility operators represent a
              distinct operational constituency, deploying Opendock dock scheduling software to eliminate gate
              bottlenecks and driver detention penalties. Concurrently, small motor carriers and owner-operators are
              acquired through free CarrierTMS tooling and accelerated factoring programs at approximately 2.5%,
              undercutting prevailing industry factoring rates of 3% while creating a proprietary capacity base for
              Loadsmart brokerage operations.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
