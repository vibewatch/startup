  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definition, and Structural Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Loadsmart defines its market boundary across digital freight execution and supply chain execution
              software. Rather than functioning solely as a traditional asset-heavy motor carrier or pure transactional
              freight broker, the company integrates multi-modal freight brokerage, shipper transportation management
              through ShipperGuide, and warehouse dock appointment scheduling via Opendock. Digital brokerage services
              cover full truckload, less-than-truckload, and intermodal freight execution with guaranteed capacity,
              while software subscriptions address dock scheduling, multi-carrier tendering, and dynamic routing
              optimization. Physical asset ownership, carrier equipment leasing, and manual dispatch services remain
              outside Loadsmart direct operating boundary, keeping capital intensity low while concentrating operational
              value on software connectivity and algorithmic freight matching.
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Market Sizing, Sizing Lenses, and Revenue Capture Dynamics
        blocks:
          - type: paragraph
            body: >-
              Sizing Loadsmart commercial addressable opportunity requires evaluating distinct structural layers rather
              than relying on a single broad freight estimate. The macroeconomic total addressable market encompasses
              North American commercial truckload transportation spend, estimated between $800B and $900B across private
              and for-hire carrier fleets. Within this macroeconomic envelope, the serviceable addressable market for
              digital freight brokerages and midmarket transportation management software spans approximately $25B to
              $35B, propelled by ongoing shipper migration from manual spreadsheets to automated API-driven load
              tendering. Third-party industry estimates project Loadsmart annualized revenue run-rate at approximately
              $108M as of late 2025, supported by historical equity funding including its $200M Series D round in 2022
              that valued the company at $1.3B.
            claimRefs:
