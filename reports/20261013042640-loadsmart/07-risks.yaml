    rows:
      - - Tier 1 Carrier Network Dependability
        - Independent Motor Carriers (230k+)
        - Freight movement capacity
        - Dispersed
        - Carrier insolvencies or capacity exit during protracted freight recessions
        - High
        - Multi-carrier automated routing and instant rate discovery across dry van, reefer, and flatbed
        - Sudden capacity shortages on volatile lanes
      - - Enterprise TMS Ecosystem Integration
        - SAP, Oracle, MercuryGate, McLeod
        - Shipper workflow embeddedness
        - High across enterprise client base
        - API schema deprecation, integration maintenance costs, or partner platform walled-garden restrictions
        - Medium
        - Multi-TMS pre-built connectors and open API/EDI support
        - Vendor lock-in and partner relationship vulnerability
      - - Class I Rail Carriers for Intermodal
        - Major Freight Railroads
        - Long-haul linehaul transport
        - High geographic rail oligopoly
        - Rail network congestion, crew shortages, or service interruptions
        - Medium
        - Multi-modal routing flexibility enabling conversion to over-the-road trucking
        - Significant cost variance if forced to switch from rail to spot truckload
      - - Warehouse Facility Ecosystem
        - Opendock Network Facilities (4,500+)
        - Dock scheduling and yard check-in
        - Moderate
        - Warehouse facility adoption churn or failure to integrate dock scheduling with TMS tenders
        - Medium
        - Unified data layer binding Opendock appointments with ShipperGuide execution
        - Facilities maintaining legacy manual scheduling or competing dock systems
    notes: Counterparty dependencies evaluated by operational criticality and substitution friction. Sourced from platform technical documentation and shipper reviews.
