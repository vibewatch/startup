company:
  name: Loadsmart
chapter:
  number: 1
  title: Company Overview
  summary: Loadsmart, Inc. is a Chicago-based freight technology provider founded in 2014 that combines digital freight brokerage with enterprise logistics software including ShipperGuide TMS and Opendock dock scheduling. The company reached a $1.3 billion valuation upon closing a $200 million Series D led by SoftBank Latin America Fund with CSX, Maersk, and BlackRock, accumulating $346.4 million in total capital. While reporting 1,800 shipper customers, 4,500 network warehouses, and 230,000 carriers, Loadsmart maintains private opacity with unpublished financial figures, making segment gross margins, software attach rates, and post-2022 valuation durability critical diligence priorities.
sections:
  - id: corporate-identity-and-business-model
    title: Corporate Identity and Business Model
    body: Loadsmart, Inc. is a private freight technology and logistics execution company founded in 2014 and incorporated in Delaware, maintaining corporate headquarters in Chicago, Illinois. Initially established as an algorithmic digital freight broker delivering instant truckload rate discovery, Loadsmart has evolved into an autonomous logistics platform connecting freight demand, execution, and facility management. The company operates a dual-pronged business model combining tech-enabled freight brokerage and managed transportation services with proprietary supply chain software applications. By pairing automated brokerage capacity with workflow software including ShipperGuide transportation management and Opendock dock scheduling, Loadsmart seeks to capture transaction margins while embedding software tools into shipper and facility workflows. Commercial metrics report coverage across 1,800 shippers and 230,000 motor carriers, but private status limits visibility into transaction volumes versus recurring software license revenue.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
    tableRefs:
      - TO001
  - id: founders-leadership-and-governance
    title: Founders, Leadership, and Governance Structure
    body: The company was co-founded in 2014 by Felipe Capella and Ricardo Salgado, who jointly shaped Loadsmart algorithmic pricing architecture and operational philosophy. Felipe Capella currently leads the business as Chief Executive Officer, driving enterprise strategy, product execution, and partner integration. Historically operating under a co-CEO management structure, the executive leadership team focused on capital efficiency and API integration rather than subsidizing unprofitable freight volume during broader market blitzscaling cycles. Key-person dependence on Capella remains significant as he personifies Loadsmart strategic transition from transactional freight broker to software-centric platform operator. Governance is shared with major institutional and corporate stakeholders who hold board representation and strategic advisory roles following multiple private capital infusions.
    claimRefs:
      - CO001
      - CO003
    tableRefs:
      - TO002
  - id: financing-valuation-and-investor-syndicate
    title: Financing History, Valuation Marks, and Capitalization
    body: Loadsmart achieved unicorn status in February 2022 upon closing a $200 million Series D financing round led by SoftBank Latin America Fund, which valued the company at $1.3 billion post-money. The Series D investor syndicate included high-profile asset managers BlackRock and Janus Henderson Group, alongside rail transportation operator CSX Corporation. Cumulative equity and debt financing reached an estimated $346.4 million across four historical rounds. A distinctive element of Loadsmart capitalization is the deep participation of strategic supply chain leaders, including maritime container giant Maersk, port terminal operator Ports America, and North American logistics provider TFI International. While these strategic partners provide commercial validation and intermodal distribution channels, the lack of subsequent public financing leaves the $1.3 billion valuation mark untested against current freight-tech valuation multiples and post-2022 market corrections.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO003
  - id: platform-evolution-and-operating-scale
    title: Platform Evolution, Operating Scale, and Diligence Considerations
    body: Loadsmart product evolution spans a decade of continuous expansion across transportation modes and logistics software capabilities. Beginning with automated full truckload pricing in 2015, the platform added less-than-truckload, rail intermodal, and managed transportation packages tailored for shippers spending $3 million to $100 million annually. Software diversification accelerated through the acquisition of Opendock and the rollout of an integrated Yard Management System launched at Manifest in Las Vegas. While self-reported platform scale indicates 4,500 connected warehouses and over 14 million scheduled dock appointments annually, financial transparency remains a primary diligence challenge. Independent data aggregators estimate Loadsmart annual run-rate at approximately $108 million, but the company has not published verified revenue, gross margin, or net retention figures. Diligence must focus on auditing segment profitability, software attach rates, and liquidation preferences before underwriting equity value.
    claimRefs:
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
