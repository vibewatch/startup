callouts:
  - calloutType: strength
    title: Strategic Multi-Modal Logistics Architecture
    body: Loadsmart has established an expansive multi-modal footprint by integrating freight brokerage capacity with sticky operational software assets including ShipperGuide TMS and Opendock, creating durable operational touchpoints across more than 4,500 warehouse facilities and 1,800 enterprise shippers.
    claimRefs:
      - CO002
      - CO008
      - CO009
  - calloutType: risk
    title: Private Valuation Freshness and Financial Disclosure Opacity
    body: Loadsmart headline $1.3 billion valuation remains anchored to its February 2022 Series D round. With revenue remaining unpublished and third-party ARR estimates pegged around $108 million, investors face uncertainty regarding gross margin durability, freight cycle exposure, and liquidation preference overhang.
    claimRefs:
      - CO004
      - CO007
      - CO011
