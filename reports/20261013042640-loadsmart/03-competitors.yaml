        - Advanced warehouse module add-on
        - Manual phone/email appointment setting
      - - Autonomous AI Task Agents
        - Native (Loadsmart AI with human backup)
        - Algorithmic matching / copilot tools
        - Assisted dispatcher workflow tools
        - Optimization algorithms without agent execution
        - None (100% human labor)
      - - Embedded Multi-Modal TMS
        - ShipperGuide TMS included
        - Transplace enterprise TMS suite
        - Navisphere portal
        - Best-in-class multi-modal workflow
        - Spreadsheets and disparate carrier portals
      - - Cargo Liability & Brokerage Execution
        - Licensed freight broker under contract
        - Licensed freight broker under contract
        - Full 3PL liability and brokerage coverage
        - Pure software license (zero cargo risk)
        - Shipper assumes full direct carrier liability
    notes: 'Notes: Evaluates capability depth across operational workflows; unsupported enterprise tier customizations in pure point solutions are identified as functional limitations.'
