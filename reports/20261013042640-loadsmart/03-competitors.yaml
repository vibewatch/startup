callouts:
  - calloutType: insight
    title: Integration Advantage vs. Brokerage Multi-Homing Reality
    body: Loadsmart's core competitive wedge is linking dock scheduling network effects from Opendock with ShipperGuide TMS, which creates higher operational friction than pure freight brokerage where shippers routinely multi-home across multiple digital and legacy providers.
    claimRefs:
      - CP001
      - CP004
  - calloutType: risk
    title: Incumbent Digital Adaptation Compresses Pure-Play Technology Moats
    body: As established legacy 3PLs such as C.H. Robinson invest heavily in digital quoting and TMS integrations, Loadsmart's pure algorithmic dispatch advantage faces margin compression during cyclical freight downturns.
    claimRefs:
      - CP007
      - CP010
