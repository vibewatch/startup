      - CP006
      - CP009
      - CP011
  - id: TP003
    title: Pricing, Packaging & Commercial Tradeoffs
    columns:
      - Alternative / Segment
      - Pricing & Contract Model
      - Included Capabilities
      - Discounts, Fees & Unknowns
      - Buyer Cost & Procurement Implication
    rows:
      - - Loadsmart Hybrid Model
        - Transactional freight spread + SaaS tier
        - ShipperGuide TMS, Opendock, and guaranteed spot capacity
        - Brokerage take rates vary with spot volatility
        - Low upfront software hurdle; freight spend subsidizes software footprint
      - - Pure Digital Broker Peers
        - Transactional mark-up per load
        - Algorithmic load dispatch, tracking, and basic portal
        - Spot discounts on high volume; hidden margin spreads
        - Zero upfront capital cost; risk of capacity givebacks in tight markets
      - - Asset-Light 3PL Incumbents
        - Contractual cost-plus or spot spread
        - Dedicated logistics teams, RFP routing, and capacity
        - Fuel surcharges, accessorial fees, and volume commitments
        - High spend commitment; dependable enterprise relationship coverage
      - - Standalone Enterprise TMS
        - Annual SaaS or recurring software license
        - End-to-end transport planning, routing, and reporting
        - Substantial implementation fees and multi-year lock-in
        - Predictable software opex but requires separate freight capacity procurement
    notes: 'Notes: Contrasts net cost mechanisms across transactional freight margins and software subscription fees; private contract discount tiers and custom broker margin agreements remain undisclosed.'
    claimRefs:
      - CP012
      - CP013
      - CP014
