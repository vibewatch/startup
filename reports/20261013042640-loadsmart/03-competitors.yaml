        - Legacy Asset-Light 3PL
        - Public ($10B+ revenue scale)
        - Global enterprise to small shippers
        - Unrivaled carrier base, global forwarding, and entrenched procurement
        - Legacy tech stack, high manual labor overhead, and slower workflow updates
      - - Enterprise TMS (Blue Yonder / Manhattan)
        - Standalone Enterprise Software
