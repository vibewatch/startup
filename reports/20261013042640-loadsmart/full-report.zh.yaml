      - number: '8.2'
        title: 融资历史、资本结构与估值背景
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 于 2022 年 2 月风险资本 FreightTech 扩张周期的顶峰确立了 headline 估值，完成由 SoftBank Group Latin America Fund 领投的
              $200 million D 轮融资；CSX Corp.、Janus Henderson Group 和 BlackRock Inc. 等战略及 机构投资者共同参与（CV007）。该交易给出 $1.3
              billion 投后估值，较公司 2020 年 11 月 C 轮后的私有估值 接近翻三倍，也让 Loadsmart 跻身独角兽（CV007）。Clay 的档案显示，经过累计八轮融资，Loadsmart 共筹得
              $346.4 million 股权及可转债资本；Maersk Growth、Chromo Invest 和 Connor Capital SB 等早期机构投资者参与了 种子轮和 A
              轮扩张（CV007、CV008）。


              但截至 2026 年末，这个 $1.3 billion 估值基准已经超过四年没有更新，当初定价又处于全球物流运价和科技风投估值
              前所未有的高峰（CV005、CV007）。此后，宏观货币收紧和货运市场量收缩，令上市货运科技及第三方物流可比公司的 估值倍数大幅压缩（CV005）。第三方数据库估计 Loadsmart 当前运营规模约为 $108
              million 净收入、约 463 至 505 名员工；若维持 $1.3 billion 股权估值，隐含收入倍数将高达 12.0x（CV002、CV007）。公司相当一部分
              运营收入仍来自毛货运经纪交易，而这类业务毛利率通常只有 12% 至 18%；未经调整的 12x 倍数是不可持续的溢价，
              也没有可观察的公开市场可比公司支撑（CV002、CV005）。投资者还要考虑清算优先权带来的显著下行压力：优先股 股东对超过 $300 million
              的已投资本享有优先顺位，在低位退出情景下可能侵蚀普通股回报（CV007、CV008）。
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
      - number: '8.3'
        title: 可比倍数与情景分析
        blocks:
          - type: paragraph
            body: >-
              评估 Loadsmart 的企业价值，必须把混合运营模式拆成货运经纪和物流软件两部分，再分别对照公开市场及交易参考。 C.H. Robinson Worldwide、Forward Air 和 RXO
              等传统轻资产货运经纪商及 3PL 的公开企业价值倍数约为毛货运收入 的 0.4x 至 1.0x，或净收入 / 毛利的约 3.0x 至 6.0x（CV002、CV005）。Manhattan Associates
              和 Descartes Systems Group 等供应链管理软件商的收入倍数则为 6.0x 至 10.0x，反映其高水平的经常性软件毛利率（>75%） 和超过 105%
              的净收入留存率（CV003、CV006）。若 Loadsmart 的业务组合仍以数字经纪执行为主（例如经纪毛收入 占 75%、SaaS/码头软件占 25%），基准情景适用 1.2x 至 2.5x
              的净收入综合倍数（CV002、CV003）。


              乐观情景假设软件转型加速：Opendock 覆盖 4,500 多个仓库的网络变现，加上 ShipperGuide TMS 扩张，将高毛利 经常性 ARR 推至总收入的 40%，按 3.6x 综合远期倍数得到
              $540 million 总估值（CV003、CV006）。基准情景 假设混合运营延续，收入温和增长至 $135 million；货运价格持续疲软，对应 1.5x 倍数和 $202.5 million 的
              可持续企业价值（CV002、CV005）。悲观情景下，货运低迷延续、客户流失把净收入压至 $85 million；由于软件 毛利率未披露，估值被压到纯 3PL 轻资产业务的 0.8x（$68
              million），触发严重的低价轮重组和优先权稀释 （CV002、CV007、CV008）。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.4'
        title: 投资建议、风险评级与尽调路径
        blocks:
          - type: paragraph
            body: >-
              综合量化情景分析和定性运营证据，我们给 Loadsmart 的总体投资建议为 research-more，风险评级为高，估值判断 偏贵（CV007）。Loadsmart 的平台愿景及自有码头 / TMS
              整合确实展现了技术能力，但其 $1.3 billion 的 Series D 峰值估值与可观察运营指标之间的脱节，已成为新资本配置的过高风险门槛（CV002、CV007）。除非全面的私有尽调 解决毛利率结构、软件
              ARR 贡献及股权表优先顺位条款等关键不确定性，投资者不应在超过 $250 million 的估值上 投入资金（CV007、CV008）。


              若要把投资建议上调至 buy 或 track，潜在投资者必须完成三项强制性确认尽调。第一，取得经审计的财务拆分，分别核实 数字货运经纪、ShipperGuide TMS 订阅许可和 Opendock
              码头排程费用对净收入及毛利的贡献（CV002、CV003）。第二， 查阅完整的公司资本结构表，确认 SoftBank 或其他 Series D 投资者是否拥有参与型优先权、累计股息或高级清算优先权，
              这些条款会在并购或 IPO 结果中把次级股权持有人置于下风（CV007、CV008）。第三，评估过去十二个月的 cohort 留存 指标，重点看使用自动承运邀约接受和集成 TMS 运力的企业托运人的 logo
              流失率及净收入留存率（CV004、CV006）。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 守住纪律化的入场估值上限
            body: >-
              投资者应将 Loadsmart 股权估值上限严格控制在 $200M 至 $250M。考虑到货运市场逆风仍在、软件毛利率又无法核实， 任何接近 $1.3B Series D
              峰值估值的出价都会带来不可接受的下行风险。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV007
          - type: callout
            title: 高级清算优先权风险敞口
            body: 八轮融资累计筹得 $346.4M 风险资本，优先股股东因此拥有显著的清算优先权。若退出价值低于 $350M，普通股和激励期权池将面临大幅稀释，甚至接近全部减值。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
