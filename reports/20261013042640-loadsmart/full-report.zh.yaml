chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Loadsmart, Inc. 是一家私营货运科技和物流执行公司，2014
              年创立并在特拉华州注册，总部位于伊利诺伊州芝加哥。公司最初是用算法提供即时整车报价发现的数字货运经纪商，后来发展为连接货运需求、执行和设施管理的自主物流平台。公司采用双引擎模式，把技术驱动的货运经纪与托管运输服务结合起来，并配套自有供应链软件。Loadsmart
              将自动化经纪能力与 ShipperGuide 运输管理、Opendock 码头排程等工作流软件结合，既想赚取交易价差，也想把软件嵌入托运商和设施的日常流程。商业指标显示其覆盖 1,800 家托运商和
              230,000 家机动车承运商，但私营身份限制了外界对交易量和经常性软件许可收入占比的判断。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
              - CO011
      - number: '1.2'
        title: 创始人、领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Felipe Capella 和 Ricardo Salgado 于 2014 年共同创立公司，并一起确定 Loadsmart 的算法定价架构和运营理念。Felipe Capella 目前担任
              CEO，负责企业战略、产品落地和合作伙伴整合。公司历史上采用联合 CEO 管理结构；在行业大举扩张期间，管理层更重视资本效率和 API 集成，而不是补贴无利可图的货运量。Capella
              对公司的关键人物依赖仍然显著，因为 Loadsmart 正从交易型货运经纪商转向软件驱动的平台运营商，而这一战略转型很大程度上由他代表。多轮私募融资后，主要机构和企业股东通过董事会席位及战略顾问角色参与治理。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 融资历史、估值标记与资本结构
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 于 2022 年 2 月完成 SoftBank Latin America Fund 领投的 $200M D 轮融资，投后估值 $1.3B，跻身独角兽。D 轮投资者还包括
              BlackRock、Janus Henderson Group 以及铁路运输运营商 CSX Corporation。四轮历史融资累计股权和债务融资额估计达到 $346.4M。Loadsmart
              资本结构的一个特点，是 Maersk、港口码头运营商 Ports America 和北美物流服务商 TFI International
              等供应链战略巨头深度参与。虽然这些战略伙伴带来了商业背书和多式联运分销渠道，但此后没有公开融资，使 $1.3B 估值尚未接受当前货运科技估值倍数和 2022 年后市场修正的检验。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.4'
        title: 平台演进、运营规模与尽调要点
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的产品演进持续十年，覆盖多种运输方式和物流软件能力。平台 2015 年从自动化整车定价起步，随后增加零担、铁路多式联运和托管运输套餐，面向年运输支出 $3M 至 $100M 的托运商。收购
              Opendock 并在拉斯维加斯 Manifest 大会上推出一体化堆场管理系统后，软件版图进一步扩大。公司自报平台规模为 4,500 个接入仓库、每年超过 14M
              次码头预约，但财务透明度仍是核心尽调难点。独立数据聚合商估计 Loadsmart 年化运行收入约
              $108M，但公司尚未发布经验证的收入、毛利率或净收入留存数据。投资判断应重点审计分部盈利能力、软件附加率和清算优先权。
            claimRefs:
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
              - CO010
              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 战略多式联运物流架构
            body: >-
              Loadsmart 把货运经纪能力与 ShipperGuide TMS、Opendock 等黏性运营软件资产结合，搭建了广泛的多式联运版图，在超过 4,500 个仓库设施和 1,800
              家企业托运商中形成持久的运营触点。
            calloutType: strength
            claimRefs:
              - CO002
              - CO008
              - CO009
          - type: callout
            title: 私募估值时效性与财务披露不透明
            body: Loadsmart 的 $1.3B 估值仍锚定于 2022 年 2 月 D 轮融资。收入尚未公开，第三方 ARR 估计约为 $108M，因此投资者无法确定毛利率的持续性、货运周期敞口及清算优先权压力。
            calloutType: risk
            claimRefs:
              - CO004
              - CO007
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与结构性邻接
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 将市场边界定义在数字货运执行和供应链执行软件之间。公司并非传统重资产机动车承运商，也不只是交易型货运经纪商，而是把多式联运货运经纪、由 ShipperGuide 提供的托运商运输管理，以及由
              Opendock 提供的仓库码头预约结合起来。数字经纪服务覆盖整车、零担和多式联运执行，并提供运力保障；软件订阅则覆盖码头排程、多承运商询价和动态路线优化。实体资产持有、承运商设备租赁和人工调度不在
              Loadsmart 的直接运营边界内，从而压低资本强度，把运营价值集中在软件连接和算法货运匹配上。
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模、测算视角与收入捕获机制
        blocks:
          - type: paragraph
            body: >-
              评估 Loadsmart 的商业可寻址机会，需要拆开不同结构层次，而不是依赖一个宽泛的货运市场估计。宏观 TAM 包括北美商业整车运输支出，覆盖自有车队和受雇承运商，估计在 $800B 至 $900B
              之间。在这一宏观范围内，数字货运经纪和中端运输管理软件的 SAM 约为 $25B 至 $35B，受托运商从人工表格迁移到 API 自动询价的趋势推动。第三方行业估计显示，截至 2025 年末，Loadsmart
              年化收入运行率约 $108M；其历史股权融资包括 2022 年 $200M D 轮，该轮将公司估值定为 $1.3B。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: 买方分层、预算归属与网络采用路径
        blocks:
          - type: paragraph
            body: >-
              Loadsmart
              的商业引擎连接托运商、仓库设施和小型机动车承运商，构成多边物流网络。大型和中端托运商是主要经济买方，从企业物流及运输采购预算中支付软件和经纪执行费用，以降低运价波动并自动选择承运商。设施运营商是另一类运营用户，使用
              Opendock 码头排程来消除闸口瓶颈和司机滞留罚金。同时，小型机动车承运商和个体车主通过免费的 CarrierTMS 工具及约 2.5% 的快速保理计划加入，低于行业普遍 3% 的保理费率，并为
              Loadsmart 经纪业务建立专有运力基础。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM009
      - number: '2.4'
        title: 增长驱动、采用约束与分析性尽调缺口
        blocks:
          - type: paragraph
            body: >-
              企业客户对可量化货运支出削减的需求推动 Loadsmart 平台采用；公司称 ShipperGuide 和托管运输服务可带来 15% 至 50% 的运输成本节省。但增长受到货运周期结构性波动的约束：2022
              年后货运衰退和运价通缩严重挤压全行业交易型经纪利润。面对逆风，Loadsmart 于 2024 年转向运营盈利，强调正毛利执行和软件交叉销售，而非无利可图的激进扩张。低毛利经纪总量与高毛利经常性 SaaS
              收入的会计拆分仍不清楚，因为这家私营公司不披露经审计的 GAAP 财务报表。
            claimRefs:
              - CM001
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台广度缓冲货运周期性
            body: Loadsmart 把数字货运经纪与 ShipperGuide TMS、Opendock 仓库排程网络等高留存软件结合，降低收入模式对严重货运通缩和运量下滑的敏感度。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM013
          - type: callout
            title: 经纪巨头夹击下的中端市场定位
            body: Loadsmart 保持有纪律的运营盈利，并在码头排程这一细分工作流中占据优势，但其整体经纪版图仍远小于 C.H. Robinson 等老牌巨头，纯交易规模受限。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：数字经纪商、老牌企业与软件替代品
        blocks:
          - type: paragraph
            body: >-
              商业货运管理市场主要分为三类竞争场景：C.H. Robinson、RXO 等传统轻资产第三方物流服务商（3PL）；Uber Freight 等规模化数字货运经纪商；以及 Blue Yonder、Manhattan
              Associates 等企业运输管理软件（TMS）供应商。托运商也持续评估依靠人工表格和直接电话联系承运商的内部调度替代方案。Loadsmart 将交易型经纪执行与 ShipperGuide TMS 和
              Opendock 码头排程网络结合，以区别于纯数字货运经纪商。数字同行主要做现货报价和货运匹配，Loadsmart 则试图覆盖从订单到发票的完整流程。不过，数字平台和传统 3PL
              都拥有更深的企业承运商流动性及资产负债表规模，给 Loadsmart 的独立扩张带来压力。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP010
      - number: '3.2'
        title: 架构差异化：一体化平台与单点最佳方案
        blocks:
          - type: paragraph
            body: >-
              与托运商分别部署运输管理、码头预约和现货采购工具的碎片化供应链架构不同，Loadsmart 以 ShipperGuide TMS 和 Opendock 为核心提供一体化软件套件。Opendock 网络把超过
              4,500 个仓库和 230,000 家承运商连接到统一运营数据集，让 Loadsmart 能看到传统 TMS 供应商原生无法观察的设施瓶颈。为防止商品化，Loadsmart 推出 FreightIntel AI
              持续优化路线指南，并部署 Loadsmart AI
              自主代理，在现有托运商企业工作流中直接执行预约和状态核查。与只提供优化算法、把异常处理完全留给托运商员工的独立软件供应商相比，这种由执行能力支撑的自动化差异明显。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
      - number: '3.3'
        title: 定价模式、产品组合与采购权衡
        blocks:
          - type: paragraph
            body: >-
              企业货运采购采用截然不同的商业机制。交易型货运经纪商靠托运商合同价与承运商采购价之间的净价差变现，以免软件前期费用为条件，让托运商承担现货运价波动和运量承诺。纯企业 TMS
              厂商则要求较大的多年订阅承诺、经常性软件许可费和专业实施服务，却不提供有保障的承运商运力。Loadsmart 用混合模式连接两者：托运商可订阅 ShipperGuide TMS 和
              Opendock，同时使用即时可预订、承诺 100% 运力保障的现货货运。这降低了中端托运商采用软件的门槛，但大运量托运商仍需权衡软件费用与大型老牌经纪商提供的定制化经纪量折扣。
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 切换成本、多平台使用现实与长期护城河韧性
        blocks:
          - type: paragraph
            body: >-
              Loadsmart
              竞争护城河的持久性高度取决于客户工作流的嵌入程度。在交易型货运经纪中，切换成本极低；企业托运商通常同时使用数十家经纪商，以争取最低现货价或获得细分线路运力，使纯经纪关系极易商品化。然而，当托运商把
              ShipperGuide TMS 作为系统记录，并要求各仓库收货设施使用 Opendock 后，运营再培训成本和承运商路线集成依赖会显著抬高切换门槛。最大的战略威胁仍是老牌企业适应：传统 3PL
              升级数字门户、企业软件商与承运商网络合作后，Loadsmart 必须证明统一平台能在长期货运下行中带来更强的货运利润控制和更低的运营人力需求。
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP010
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 集成优势与经纪业务多平台使用现实
            body: Loadsmart 的核心竞争切入点，是把 Opendock 的码头排程网络效应与 ShipperGuide TMS 连接起来；相比托运商经常同时使用多家数字和传统供应商的纯货运经纪，这带来了更高的运营摩擦。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
          - type: callout
            title: 老牌数字化适应压缩纯技术护城河
            body: C.H. Robinson 等传统 3PL 大力投资数字报价和 TMS 集成后，Loadsmart 纯算法调度优势将在周期性货运下行中面临利润率压缩。
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >-
