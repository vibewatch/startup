            body: >-
              Loadsmart
              的经济模型呈现出低毛利交易型货运经纪与高毛利经常性物流软件之间不同的利润结构。机动车承运商货运支付是最大的销货成本，直接决定动态现货线路和合同线路的毛利率表现。运营营运资本取决于用户协议：托运商在订舱时立即付款或按既定信用条款付款，而机动车承运商在上传交付证明后最多
