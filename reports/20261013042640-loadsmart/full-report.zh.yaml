        - 建模下行情景下的清算瀑布，评估普通股权益受损程度
      - - 估值立场
        - 偏高
        - $1.3B 的 Series D 明面估值对应预计 $108M 收入约 12.0x 的倍数
        - 上市 3PL 经纪商可比公司的收入倍数为 0.4x-1.0x，存在严重下轮融资风险
        - 将拟议入场企业估值上限设为 $200M-$250M（预计净收入的 1.5x-2.3x）
    notes: 建议和风险评级综合公开记录的融资轮次及第三方预计收入运行率；null 值代表尚未发布的私有 GAAP 审计报表。
