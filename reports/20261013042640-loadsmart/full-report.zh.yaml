              Loadsmart 的底层技术架构采用多层云栈，把交易型数字经纪引擎与软件即服务应用层统一起来。底层由高吞吐 REST API 和标准 EDI 接口（包括 204、214 和 210 消息）把平台接入
              Oracle Transportation Management、SAP、MercuryGate 和 BluJay 等客户既有 ERP 及供应链套件。在数据摄取层之上，Loadsmart
