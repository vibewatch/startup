      - number: '5.4'
        title: 监管分类、技术依赖与尽调风险
        blocks:
          - type: paragraph
            body: >-
              从投资判断和技术尽调角度看，Loadsmart 有清晰的运营边界、技术风险和架构依赖。按联邦运输法，Loadsmart 根据 49 U.S.C. § 13102(2)
              注册并被归类为货运财产经纪商，而非持有资产的机动车承运商。其商业合同明确排除直接机动车承运货物责任，并要求托运商与独立卡车公司签署直接提单。因此，虽然 Loadsmart
              提供追踪和自动调度工具，实体货物运输完全依赖外部第三方机动车承运商，而这些承运商的合规程度和远程信息处理集成质量差异很大。技术上，平台自主 AI 代理工作流高度依赖客户数据整洁度；既有托运商 ERP
              中无结构或不准确的输入需要立即升级给人工人员，削弱软件运营杠杆。此外，计算机视觉闸口层面临摄像头被遮挡、恶劣天气导致性能下降和集装箱标记不可读等实体环境风险。最后，鉴于公司在 D 轮融资时估值
              $1.3B，低毛利经纪量与高毛利经常性软件订阅之间的真实收入结构仍是主要尽调缺口。
