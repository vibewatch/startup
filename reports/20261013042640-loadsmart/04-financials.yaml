callouts:
  - calloutType: risk
    title: Revenue Opacity and Private Multiple Degradation
    body: Loadsmart has not disclosed audited revenue, net take rates, or ARR segmentation since its February 2022 Series D at a $1.3B valuation. GetLatka estimates 2025 revenue at approximately $108M, implying an entry multiple of roughly 12x revenue if unrefreshed, while digital freight peers trade at compressed multiples of 1.0x to 2.5x net revenue in post-downturn freight markets.
    claimRefs:
      - CI008
      - CI011
  - calloutType: insight
    title: Working Capital Float and Quickpay Monetization
    body: Under Section VI of Loadsmart user agreement, shippers are billed immediately upon load booking or under contracted billing terms, while carrier remittances are scheduled up to 30 calendar days post-proof-of-delivery. Carriers opting for accelerated cash flow through TriumphPay incur a mandatory 2% discount, creating an ancillary high-margin revenue line and positive operational working capital float.
    claimRefs:
      - CI004
      - CI005
