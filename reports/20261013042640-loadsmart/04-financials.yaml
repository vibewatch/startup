company:
  name: Loadsmart
chapter:
  number: 4
  title: Financials
  summary: Loadsmart combines transactional freight brokerage execution with SaaS subscriptions for ShipperGuide TMS and Opendock dock scheduling, achieving an estimated $108M in annual revenue while maintaining private financials, opaque take rates, and stale 2022 Series D valuation marks.
sections:
  - id: revenue-streams-and-commercial-model
    title: Revenue Streams and Commercial Monetization Architecture
    body: Loadsmart operates a hybrid commercial model spanning transactional freight brokerage execution, subscription software licensing, and ancillary carrier financial services. On the brokerage side, Loadsmart functions as an intermediary capturing gross margin spreads between shipper quoted rates and motor carrier purchase costs across full truckload (FTL), less-than-truckload (LTL), and intermodal movements. In parallel, the company monetizes software capabilities via ShipperGuide—an AI-native transportation management system (TMS)—and Opendock, an appointment scheduling network deployed across more than 4,500 warehouse facilities. Shippers utilizing Loadsmart enterprise transportation execution target freight cost reductions of 15% to 50% through automated tender management, lane optimization, and continuous load consolidation. In addition to primary freight brokerage and software fees, Loadsmart captures high-margin ancillary revenue through accessorial billing and carrier financial integrations, establishing multiple monetization touchpoints across the end-to-end logistics workflow.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-architecture-and-gtm-motion
    title: Pricing Architecture, Go-To-Market Motion, and Sales Efficiency
    body: Loadsmart delivers dynamic spot rates alongside contracted shipper pricing backed by an algorithmic pricing engine and a 100% capacity tender acceptance guarantee. Unlike traditional brokerages relying on manual broker negotiations, Loadsmart integrates directly into enterprise shipper TMS platforms to provide instant bookable capacity without pricing renegotiation. However, third-party logistics evaluation by Fulfill underscores that Loadsmart provides no transparent public list pricing for its software or managed services, requiring prospective enterprise clients to undergo custom consultation and scope determination. The company focuses its direct sales motion on mid-market and enterprise accounts expending $2.5M or more in annual transportation costs. Software deployments are further bundled through Opendock and the newly introduced Yard Management System (YMS), enabling Loadsmart to cross-sell brokerage execution to facility operators already reliant on its dock management infrastructure.
    claimRefs:
      - CI002
      - CI010
      - CI012
      - CI014
    tableRefs:
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Unit Economics, and Operational Working Capital
    body: 'The economics of Loadsmart reflect the divergent margin profiles of low-margin transactional freight brokerage and high-margin recurring logistics software. Motor carrier freight disbursements represent the single largest cost of goods sold, directly determining gross margin realization across dynamic spot and contract lanes. Operational working capital dynamics are governed by Loadsmart user agreement terms: shippers are billed immediately upon load booking or under established credit terms, whereas motor carriers receive remittances up to thirty calendar days following proof-of-delivery upload. Loadsmart monetizes this payment lag through an optional TriumphPay Quickpay integration, allowing carriers to accelerate cash disbursements in exchange for a mandatory 2% discount from total invoiced freight value. Furthermore, Loadsmart enforces strict detention billing parameters, permitting 120 minutes of free standby time before assessing detention charges in 15-minute billable increments.'
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI015
    tableRefs:
      - TI003
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy, Valuation Realism, and Diligence Verdict
    body: Loadsmart raised $200 million in a Series D funding round in February 2022 led by SoftBank Latin America Fund alongside strategic logistics investors including BlackRock, Maersk Growth, and CSX, establishing a peak private post-money valuation of $1.3 billion. Industry analyst GetLatka estimates Loadsmart annual revenue at roughly $108 million as of November 2025, suggesting an entry valuation multiple of approximately 12x revenue if held at Series D pricing. In the intervening freight cycle downturn, digital brokerage peers and public comparables experienced severe valuation multiple compression to 1.0x–2.0x net revenue. While Loadsmart augmented its software footprint through the acquisitions of Opendock, Kamion, and NavTrac, the absence of publicly disclosed balance sheets, cash burn figures, and debt obligations creates a material underwriting gap regarding post-2024 capital runway and ongoing standalone self-sufficiency.
    claimRefs:
      - CI008
      - CI009
      - CI011
      - CI013
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit Basis
      - Current Value / Disclosure
      - Revenue Quality
      - Diligence Blocker / Ask
    rows:
      - - Freight Brokerage Execution
        - Transaction spread between Shipper Fee and Carrier Fee; spot and contract freight markup
        - Per completed shipment / load
        - Estimated >$90M+ of platform GMV/revenue; private disclosures unseparated
        - High volume, low margin (brokerage take-rate cycle sensitive)
        - Unaudited net revenue vs gross booking breakdown by freight mode
      - - Software & TMS Subscriptions (ShipperGuide & Opendock)
        - Recurring SaaS licensing for dock scheduling, yard management, and TMS
        - Per facility / warehouse dock per month, plus user tiers
        - 4,500+ dock facilities and 3,500+ YMS facilities active; standalone SaaS revenue unseparated
        - High quality recurring software revenue with low marginal delivery cost
        - Standalone ARR, logo retention, and software net revenue retention (NRR)
      - - Managed Transportation Services
        - Management fee plus percentage of freight under management
        - Multi-year managed freight contracts ($2.5M+ spend threshold)
        - Actively marketed to mid-market and enterprise shippers spending $2.5M+ annually
        - Multi-year sticky contracts with higher service lock-in
        - Contract duration, take rate, and gross margin after dedicated team labor
      - - Ancillary & Carrier Financial Services
        - Quickpay carrier factoring fee via TriumphPay (2% deduction) plus accessorial/detention processing
        - Per discounted carrier invoice or per detention event (15-min billing blocks)
        - Standard 2% Quickpay fee published in carrier user agreement; detention marked up
        - Transactional, high margin take-rate on carrier cash acceleration
        - Quickpay adoption volume, total fee yield, and bad-debt / credit loss reserves
    notes: Data sourced from Loadsmart user agreement, official product documentation, and Fulfill directory profile; separate reporting of SaaS ARR versus brokerage revenue is not publicly disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Service Component
      - Price / Unit Model
      - Contract Structure
      - List vs Realized Pricing
      - Pricing Unknowns
      - Source
    rows:
      - - Shipper Freight Brokerage
        - Dynamic spot quoting and contract pricing per lane/mile
        - Spot tender or fixed-duration contract with 100% capacity guarantee
        - List rate dynamically generated via algorithmic pricing engine; realized spread varies with carrier capacity market
        - Carrier cost spread, spot vs contract freight margin, volume rebates
        - Loadsmart user agreement & shipper portal
      - - ShipperGuide TMS & AI Agents
        - Custom tiered enterprise software pricing
        - Annual enterprise software subscription
        - Custom quoting only; no public list prices disclosed
        - Baseline tier minimums, implementation fees, seat/transaction add-on charges
        - Fulfill partner directory profile
      - - Opendock Dock & Yard Scheduling
        - Per-facility monthly fee for warehouse scheduling and YMS
        - Annual or monthly facility license
        - Multi-tier warehouse packaging; custom enterprise quote
        - Per-door pricing vs facility-wide bundle, NavTrac computer vision add-on pricing
        - AJOT & Automated Warehouse Online reports
      - - Carrier Quickpay & Settlement
        - 2% deduction from total invoiced freight amount via TriumphPay
        - Transactional opt-in per invoice
        - 'Exact list rate: 2% deduction from invoice face value'
        - Net take rate retained by Loadsmart vs TriumphPay processing fee split
        - Loadsmart user agreement (Section VI.B)
    notes: List rates for software are custom quoted without published public price tiers; transactional freight rates vary dynamically by freight market lane and mode.
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI007
  - id: TI003
    title: Unit economics table
    columns:
      - Economic Metric
      - Disclosed / Estimated Value
      - Confidence Level
      - Strategic Implication
      - Underwriting Diligence Ask
    rows:
      - - Net Revenue / Take Rate
        - null
        - Low
        - Determines gross profit generated per freight transaction after paying motor carriers
        - Audited net revenue split between brokerage spread and SaaS subscription fees
      - - Brokerage Gross Margin %
        - null
        - Low
        - Digital freight brokerages typically operate at 12%–18% gross margin depending on cycle conditions
        - Trailing 24-month gross margin trend across FTL, LTL, and drayage brokerage
      - - Software Gross Margin %
        - null
        - Low
        - SaaS tools (ShipperGuide, Opendock) typically generate 70%+ gross margin
        - Dedicated cloud hosting, third-party API, and support costs allocated to software
      - - Quickpay Take-Rate Yield
        - 2% gross carrier deduction
        - High
        - Provides incremental high-margin cash flow on carrier disbursements
        - Total GMV processed through TriumphPay and net fee split retained by Loadsmart
      - - Customer Acquisition Cost (CAC) Payback
        - null
        - Low
        - Critical for evaluating sales efficiency of dedicated freight sales reps vs enterprise SaaS teams
        - Sales team commissions, marketing spend, and payback months per shipper cohort
    notes: Every null metric reflects unavailable private disclosures; values require non-disclosure review of internal management accounts.
    claimRefs:
      - CI004
      - CI007
      - CI008
      - CI015
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: End-to-end commercial workflow illustrating how shipper freight demand converts into transactional brokerage revenue, software subscription fees, and carrier remittance float.
    approximationNotes: Represents Loadsmart platform execution sequence and monetization points across shipper ordering, carrier tendering, and final settlement.
    data:
      nodes:
        - id: shipper-demand
          label: Shipper Freight Demand
          detail: Shipper enters shipment parameters or books recurring dock appointment
        - id: instant-quote
          label: Pricing & Booking
          detail: Algorithmic pricing engine outputs guaranteed rate; Shipper Fee charged
        - id: carrier-dispatch
          label: Carrier Tendering
          detail: Curated carrier network tendered with contract or spot Carrier Fee
        - id: transit-tracking
          label: Execution & Visibility
          detail: Autonomous AI tracking and Opendock gate monitoring during transit
        - id: dock-settlement
          label: Dock Delivery & POD
          detail: Proof-of-delivery uploaded; detention assessed if standby exceeds 120 min
        - id: carrier-payout
          label: Carrier Remittance
          detail: Carrier paid up to 30 days post-POD, or accelerates cash via 2% Quickpay
        - id: platform-margin
          label: Retained Platform Margin
          detail: Brokerage net spread, SaaS licensing fees, and Quickpay discount retained
      edges:
        - from: shipper-demand
          to: instant-quote
        - from: instant-quote
          to: carrier-dispatch
        - from: carrier-dispatch
          to: transit-tracking
        - from: transit-tracking
          to: dock-settlement
        - from: dock-settlement
          to: carrier-payout
        - from: carrier-payout
          to: platform-margin
