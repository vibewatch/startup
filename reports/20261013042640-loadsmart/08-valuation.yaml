    rows:
      - - Investment Thesis
        - >-
          Connected logistics platform unifying TMS, dynamic brokerage, and dock scheduling drives defensible operating
          leverage
        - Opendock network covers 4,500+ warehouses and 230,000+ carriers with 100% tender acceptance guarantee
        - Brokerage execution revenue remains cyclical and subject to gross margin compression
        - Audited proof that SaaS subscription ARR exceeds 50% of total company gross profit
      - - Investment Anti-Thesis
        - >-
          Stale 2022 unicorn valuation benchmark leaves capital structure vulnerable to severe down-round repricing and
          preference overhang
        - >-
          $1.3B valuation established in February 2022 amidst historic freight rate peak; estimated revenue of $108M
          implies 12.0x multiple
        - Excessive multiple contraction in freight tech could wipe out junior equity in a recapitalization
        - Direct secondary transaction or extension financing round clearing above $1.0B valuation
      - - Product & Network
        - Integration of ShipperGuide TMS and Opendock creates proprietary operational data network
        - Direct TMS embedding delivers instant bookable pricing with over 500 real-time market data points
        - Carrier network adoption could stall if spot margins compress further
        - Demonstrated acceleration in enterprise ShipperGuide attach rates and net logo retention >115%
      - - Capital & Runway
        - Substantial cumulative venture funding of $346.4M provides operating cushion
        - Participation from strategic backers including SoftBank Latin America Fund, CSX Corp, and BlackRock
        - Senior liquidation preferences across 8 rounds create major hurdle for common shareholders
        - Certified balance sheet demonstrating positive GAAP operating cash flow and >24 months runway
