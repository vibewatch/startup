company:
  name: Loadsmart
chapter:
  number: 8
  title: Valuation
  summary: >-
    Loadsmart combines digital freight brokerage, ShipperGuide TMS, and Opendock dock scheduling into an integrated
    freight execution platform, but its $1.3B Series D valuation from February 2022 remains stretched following severe
    freight-cycle downturns and multiple compression across logistics technology comps. With independent estimates
    indicating an annual revenue run-rate around $108M and $346.4M in cumulative capital raised, market-based multiples
    imply a current fair enterprise value between $130M and $270M. Our recommendation is research-more with high risk
    and a stretched valuation stance pending access to audited gross margins, software ARR mix, and liquidation
    preference structures.
sections:
  - id: investment-thesis-and-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      Loadsmart operates a hybrid logistics architecture that integrates automated digital freight brokerage execution
      with SaaS logistics software, anchored by its proprietary ShipperGuide transportation management system and
      Opendock dock scheduling network (CV001, CV003). The core investment thesis posits that Loadsmart has successfully
      differentiated itself from pure-play digital freight brokerages by assembling an enterprise workflow platform
      spanning more than 4,500 warehouse facilities and 230,000 carrier participants (CV003, CV006). By offering 100%
      tender acceptance guarantees through automated dynamic pricing algorithms directly embedded into enterprise
      shippers TMS environments, Loadsmart reduces procurement friction and eliminates operational touchpoints across
      full truckload, less-than-truckload, and intermodal freight corridors (CV001, CV004). This technological
      integration theoretically supports superior customer stickiness and operational operating leverage compared to
      legacy third-party logistics providers whose businesses depend on manual broker staffing (CV004, CV006).


      Conversely, the investment anti-thesis highlights severe macroeconomic and structural headwinds that threaten
      enterprise equity value. The North American freight cycle has endured protracted freight recession and rate
      depression following pandemic-era spot market peaks, creating an environment characterized by aggressive shipper
      margin concessions, excess carrier capacity shakeouts, and suppressed transaction yields (CV005). Although
      Loadsmart has attempted to pivot toward higher-margin software and managed transportation services, independent
      estimates indicate that its annual revenue run-rate remained approximately $108 million in late 2025 (CV002). At
      this scale, the business remains heavily exposed to freight cycle volatility and brokerage volume compression,
      while its capital structure remains encumbered by $346.4 million in cumulative paid-in venture and growth capital
      without public disclosure of gross margins, software ARR, or GAAP net income (CV002, CV008). Until audited unit
      economics confirm structural profitability independent of cyclical brokerage spot volumes, the risk of equity
      dilution in future financing events remains acute (CV005, CV007).
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV002
    figureRefs:
      - FV001
  - id: financing-history-and-valuation-context
    title: Financing History, Capital Structure, and Valuation Context
    body: >-
      Loadsmart established its headline valuation during the peak of the venture capital FreightTech expansion cycle in
      February 2022, closing a $200 million Series D financing round led by SoftBank Group Latin America Fund alongside
      strategic and institutional co-investors including CSX Corp., Janus Henderson Group, and BlackRock Inc. (CV007).
      This transaction established a post-money valuation of $1.3 billion, nearly tripling the company private valuation
      following its November 2020 Series C round and elevating Loadsmart to unicorn status (CV007). Dossier records from
      Clay indicate that across eight cumulative financing rounds, Loadsmart has raised $346.4 million in total equity
      and convertible capital, with earlier institutional backers including Maersk Growth, Chromo Invest, and Connor
      Capital SB participating in seed and Series A expansions (CV007, CV008).


      However, this $1.3 billion valuation benchmark is more than four years stale as of late 2026 and was underwritten
      during an unprecedented peak in global logistics freight rates and technology venture valuations (CV005, CV007).
      In the intervening years, macroeconomic monetary tightening and freight-market volume contractions have driven
      sharp multiple compression across publicly traded freight technology and third-party logistics comparables
      (CV005). With third-party databases estimating Loadsmart current operational scale at approximately $108 million
      in net revenue and approximately 463 to 505 employees, maintaining a $1.3 billion equity valuation requires an
      aggressive implied revenue multiple of 12.0x (CV002, CV007). For a business that still derives a substantial
      portion of its operating revenue from gross freight brokerage transactions where gross margins typically hover
      between 12% and 18%, an unadjusted 12x multiple represents an unsustainable premium that is unsupported by
      observable public market comparables (CV002, CV005). Investors must also consider the significant downside
      liquidation preference overhang: preferred shareholders hold seniority on more than $300 million in invested
      capital, which could impair common equity returns under lower-bound exit scenarios (CV007, CV008).
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV008
  - id: comparables-and-scenario-analysis
    title: Comparable Multiples and Scenario Analysis
    body: >-
      Evaluating Loadsmart enterprise value requires decomposing its hybrid operating model into freight brokerage and
      logistics software components and benchmarking each against public market and transaction references. Traditional
      asset-light freight brokers and 3PLs such as C.H. Robinson Worldwide, Forward Air, and RXO trade at public
      enterprise value multiples ranging between 0.4x and 1.0x gross freight revenue, or approximately 3.0x to 6.0x net
      revenue / gross profit (CV002, CV005). Meanwhile, supply chain management software providers such as Manhattan
      Associates and Descartes Systems Group command revenue multiples of 6.0x to 10.0x, reflecting high recurring
      software gross margins (>75%) and net revenue retention rates exceeding 105% (CV003, CV006). If Loadsmart business
      mix remains weighted toward digital brokerage execution (e.g., 75% brokerage gross revenue and 25% SaaS/dock
      software), a blended multiple of 1.2x to 2.5x net revenue is appropriate for base-case modeling (CV002, CV003).


      Our bull case models an accelerated software transformation where Opendock network monetization across 4,500+
      warehouses and ShipperGuide TMS expansions drive high-margin recurring ARR to 40% of total revenue, unlocking an
      aggregate valuation of $540 million at a 3.6x blended forward multiple (CV003, CV006). Our base case assumes
      continued hybrid operations with modest revenue expansion to $135 million, where persistent freight rate softness
      yields a 1.5x multiple and a sustainable enterprise value of $202.5 million (CV002, CV005). In the bear case,
      continued freight depression and customer churn compress net revenue to $85 million, while lack of software margin
      disclosures forces valuation down to pure 3PL asset-light multiples of 0.8x ($68 million), triggering severe
      down-round restructuring and preference dilution (CV002, CV007, CV008).
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV003
  - id: recommendation-and-diligence-path
    title: Recommendation, Risk Rating, and Diligence Path
    body: >-
      Synthesizing our quantitative scenario analysis and qualitative operational evidence, we assign Loadsmart an
      overall investment recommendation of research-more, accompanied by a high risk rating and a stretched valuation
      stance (CV007). While Loadsmart platform vision and proprietary dock/TMS integration demonstrate genuine
      technological capability, the disconnect between its $1.3 billion peak Series D valuation mark and its observable
      operating metrics represents an excessive risk barrier for new capital allocation (CV002, CV007). Investors should
      refrain from committing capital at valuations above $250 million unless comprehensive private diligence resolves
      key structural uncertainties regarding gross margin profile, software ARR contribution, and cap-table seniority
      provisions (CV007, CV008).


      To move the investment recommendation to buy or track, prospective investors must complete three mandatory
      confirmatory diligence investigations. First, obtain an audited financial breakdown segregating net revenue and
      gross profit contributions across digital freight brokerage, ShipperGuide TMS subscription licenses, and Opendock
      dock scheduling fees (CV002, CV003). Second, inspect the complete corporate capitalization table to verify whether
      SoftBank or other Series D investors hold participating preferred rights, cumulative dividend accruals, or senior
      liquidation preferences that subordinate junior equity holders in M&A or IPO outcomes (CV007, CV008). Third,
      evaluate trailing twelve-month cohort retention metrics, examining gross logo churn and net revenue retention
      among enterprise shippers utilizing automated tender acceptance and integrated TMS capacity (CV004, CV006).
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV001
