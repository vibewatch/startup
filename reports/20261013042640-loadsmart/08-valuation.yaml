callouts:
  - calloutType: recommendation
    title: Maintain Disciplined Entry Valuation Cap
    body: >-
      Investors should maintain a disciplined valuation ceiling of $200M to $250M for Loadsmart equity. Paying anywhere
      near the peak $1.3B Series D valuation mark introduces unacceptable downside risk in light of ongoing freight
      market headwinds and lack of verifiable software gross margins.
    claimRefs:
      - CV002
      - CV005
      - CV007
  - calloutType: risk
    title: Senior Liquidation Preference Exposure
    body: >-
      With $346.4M in total venture capital raised across eight rounds, preferred shareholders hold significant
      liquidation preference seniority. In an exit below $350M, common equity and incentive option pools face
      substantial dilution or near-total impairment.
    claimRefs:
      - CV007
      - CV008
