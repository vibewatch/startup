    rows:
      - - Recommendation
        - research-more
        - Differentiated AI-native TMS and Opendock dock scheduling network spanning 4,500+ warehouses
        - Stale $1.3B Series D valuation from February 2022 unsupported by freight recession realities
        - Withhold new investment pending audited financial segmentation and margin disclosure
      - - Confidence Level
        - medium
        - Verified funding history of $346.4M and strategic investor roster including SoftBank and CSX
        - Lack of audited GAAP financials, private gross margins, and net recurring ARR data
        - Avoid large capital commitments; require confirmatory private diligence
      - - Risk Rating
        - high
        - Persistent North American freight cycle softness and rate depression
        - Potential liquidation preference overhang across $300M+ senior preferred capital
        - Model downside liquidation waterfall scenarios to evaluate common equity impairment
      - - Valuation Stance
        - stretched
        - Headline Series D mark of $1.3B implies ~12.0x multiple on estimated $108M revenue
        - Public 3PL broker comps trade at 0.4x-1.0x revenue, creating severe down-round vulnerability
        - Cap proposed entry enterprise valuation at $200M-$250M (1.5x-2.3x estimated net revenue)
    notes: >-
