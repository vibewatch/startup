companyProfile:
  summary: >-
    Loadsmart is a Chicago-based freight-technology company founded in 2014 that combines digital freight brokerage,
    managed transportation, ShipperGuide TMS, and Opendock dock scheduling into a single logistics execution platform.
    The business reports 1,800 global customers, more than 4,500 connected warehouses, and 230,000 vetted carriers, but
    private-company opacity leaves revenue mix, gross margin, NRR, and cash runway unverified.
