  topStrengths:
    - Integrated brokerage, TMS, and dock-scheduling footprint across 4,500+ warehouses and 230,000 carriers.
    - >-
      Strategic and institutional backing from SoftBank Latin America Fund, CSX, BlackRock, and other logistics
      investors.
