callouts:
  - calloutType: insight
    title: Platform Breadth Buffers Freight Cyclicality
    body: By pairing digital freight brokerage with high-retention software surfaces like ShipperGuide TMS and the Opendock warehouse scheduling network, Loadsmart insulates its revenue model from severe freight rate deflation and volume downturns.
    claimRefs:
      - CM001
      - CM004
      - CM013
  - calloutType: risk
    title: Midmarket Positioning Amid Brokerage Heavyweights
    body: Loadsmart maintains disciplined operating profitability and niche workflow dominance in dock scheduling, but its overall brokerage footprint remains significantly smaller than incumbent brokerage giants such as C.H. Robinson, limiting pure transaction scale.
    claimRefs:
      - CM013
      - CM014
