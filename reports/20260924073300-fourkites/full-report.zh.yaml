        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              FourKites 的公开客户故事高度面向企业。官网和新闻材料显示，大型货主、承运商、设施和物流伙伴使用平台处理异常、预约、客户更新和文件工作流。最显眼的证明点不是中型市场 Logo，而是类似《财富》500
