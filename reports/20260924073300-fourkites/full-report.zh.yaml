      - number: '4.2'
        title: 资本充足性与融资历史
        blocks:
          - type: paragraph
            body: >
              资本状况属于后期私有公司，而非陷入困境：公司 2021 年完成 $100M D 轮，2022 年又加入战略性资本，使公开融资总额达到 high-$200M
              区间。这些支持加上庞大的企业客户基础，说明公司可以继续投资，不必立即融资。不过，TechCrunch 关于 2022
              年裁员的报道提醒我们，公司已经经历过一次盈利能力重置。因此，正确的投资判断视角是资本充足性加增长质量，而不是紧急计算 runway。
