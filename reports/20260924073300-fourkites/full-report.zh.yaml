  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正面论点与反面论点
        blocks:
          - type: paragraph
            body: >
              乐观情景很直接：FourKites 拥有庞大的企业客户基础，AI
              增购故事清晰，而且仍处在切换成本真实存在的工作流中。悲观情景同样直接：公司没有公开披露足够指标，外部投资者无法判断客户基础是在高效扩张，还是靠更多支持投入勉强守住。因此，估值取决于收入质量证据，而不只是收入规模。如果公司借助
              Loft 及相邻模块留住并扩展客户，就应享有相对通用物流软件的溢价；如果主要是在守住旧客户基础，倍数就应向上市供应链 SaaS 同行收缩。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 估值背景
        blocks:
          - type: paragraph
            body: >
              FourKites 最近一次公开估值锚点是 2022 年 $1B 的 E 轮。这个数字与其说是目标，不如说是 SaaS
              倍数重置前市场愿意支付多少的参照。此后可比公司发生变化：盈利的上市供应链软件公司比风投支持的私有同行更抗跌，市场也更看重增长效率。关键在于，FourKites
              更像稳健的上市公司，还是被打折的私有公司。答案取决于当前 ARR 基础、Loft 是否已经带来增量 ACV，以及客户故事有多大程度集中在狭窄的高端 ICP。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV004
            claimRefs:
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >
              更合理的投资判断是评估一个区间，而不是押注单点估值。基准情景以约 $65M 的 2021 年 ARR 为锚，假设保持中十几位数的增长，并获得温和的 AI 提振。乐观情景要求 Loft
              成为真正的商业切入口，公司继续在现有客户中扩张。悲观情景是客户基础比表面更停滞，公司需要重置估值以匹配新的 SaaS 倍数环境。在这种情况下，最佳入场纪律是让价格取决于 NRR、烧钱速度和 Loft
              的实际部署，而不是单纯为故事买单。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
