      - number: '5.2'
        title: 架构与部署
        blocks:
          - type: paragraph
            body: >
              这套架构以数据为先。FourKites 依赖货运、设施、承运商和文件数据，再叠加实时智能与智能体执行。架构的防守力来自每次集成都能积累数据，但部署也很重：企业客户必须先打通 EDI、TMS、ERP
              和承运商工作流，价值才会显现。因此，信任本身就是产品功能。官网强调企业级安全、数据隔离，并声称客户数据不会用于训练第三方模型；大型货主在把运营交给 AI 层之前，正需要这类承诺。
