      - - 护城河
        - 承运商和工作流数据带来切换成本
        - 打包压力可能侵蚀价格溢价
        - 按细分索取赢单 / 输单和留存数据
      - - 财务质量
        - 接近零烧钱的纪律或可支持退出选择权
        - 缺少公开指标，因此这种纪律尚未验证
        - 索取当前烧钱额和现金跑道
      - - 可比估值
        - 最佳公开可比公司表现仍足以支撑稳健倍数
        - 增长放缓时，私人市场可比公司可能迅速重置估值
        - 索取当前可比公司估值桥和折价依据
