  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方
        blocks:
          - type: paragraph
            body: >
              FourKites 所处的竞争边界比传统货运跟踪更宽，却又窄于全部供应链软件。相关市场包括实时运输可视化、控制塔、预约与堆场工作流、异常管理，以及能对这些信号采取行动的运营 AI。买方通常是大型货主或
              3PL：货运量足以支撑集成工作，异常成本也足以让软件产生经济价值。买方不太在意功能数量，更关注系统能否减少滞留、加急、OTIF 罚款和手工异常处理。因此，预算来自物流、运营和供应链转型支出，而不是通用 IT
              席位预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.2'
        title: 市场规模与采用
        blocks:
          - type: paragraph
            body: >
              公开规模证据并不精确，但方向性判断仍然有力：企业供应链软件、可视化平台和运营 AI 都位于数百亿美元级的软件市场中。FourKites 自己 2026 年的内容认为，AI 的 ROI
              应按损益表影响而非节省时间来评估，这符合该品类的经济逻辑。采用由滞留、服务失败、货运支出和面向客户的延误管理等可量化事件驱动，因此比通用生产力软件更容易证明
              ROI。代价是每次部署都需要集成、数据治理和变革管理，所以市场靠大客户扩张，而不是靠低接触的自助式采用。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
