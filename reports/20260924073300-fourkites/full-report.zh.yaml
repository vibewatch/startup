companyProfile:
  summary: >
    FourKites 是一家总部位于芝加哥的供应链可视化与智能体 AI 平台，由 Matt Elenjickal 于 2014
    年创立。公司为大型企业货主跟踪整车、铁路、海运、包裹及相关物流流程中的货运。如今其公开叙事聚焦于在这一基础上延伸 Loft AI Agent Platform，在实时可视化之上增加工作流自动化和 AI
    辅助。公司客户以企业为主，并将承运商网络深度、多式联运覆盖和工作流粘性视为核心护城河。
