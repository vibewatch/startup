  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块
        blocks:
          - type: paragraph
            body: >
              FourKites 的产品更适合被理解为物流运营工作流平台，而非单一跟踪仪表盘。官网强调网络、智能层和执行层，再将这些能力封装为承运商运营、供应商运营、客户运营、设施运营、文件处理和 AI
              生成工作流等模块。这套模块很重要，因为它表明公司正试图从可视化走向日常运营杠杆。买方不是为抽象的 AI 付费，而是要在真实供应链环境中减少手工工作和异常处理。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
