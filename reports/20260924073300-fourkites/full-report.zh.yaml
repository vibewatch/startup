  - id: TV001
    title: 建议摘要表
    description: Summary of the investment view, confidence, valuation stance, and the conditions that matter most.
    columns:
      - 维度
      - 评估
      - 依据
      - 关键条件
    claimRefs:
      - CV001
      - CV010
      - CV011
    enumerationScope:
      coverage: partial
      basis: >-
        The recommendation is a modeled judgment built from public evidence; internal financial data would materially
        change it.
    notes: 本表用于总结决策，不替代管理层提供的财务报表或群组数据。
    rows:
      - - 总体建议
        - 有条件推进
        - 市场地位良好，但公开财务细节不足
        - 确认 NRR、烧钱额和 Loft 部署数量
      - - 信心
        - 低至中等
        - 产品故事有力，但披露的财务证据薄弱
        - 有经审计的最新数据后，信心才会提升
      - - 估值立场
        - 低于或接近此前参考值
        - 倍数压缩且缺少增长证明，需保持谨慎
        - 若增长慢于管理层暗示的水平，应调整估值
      - - 回报画像
        - 若乐观情景成立则为中等
        - AI 增购和留存的企业客户基础仍可带来上行空间
        - 定价应反映情景概率，而不是最佳情景
      - - 风险评级
        - 高
        - 财务透明度不足仍是最大的未知数
        - 支付溢价前必须拿到硬证据
  - id: TV002
    title: 论点 / 反论点表
    description: Direct comparison of the investment thesis and the strongest bear counterpoints.
    columns:
