            body: >
              FourKites 的路线图主要通过公开发布体现，而不是靠深度公开 API 或开源生态。公司拥有 GitHub 组织和少量公开仓库，可作为开发者信号，但不能证明其获得广泛开源采用。更重要的是，2024-2026
              年的发布节奏显示产品正更快进入 AI 执行阶段，包括 Fin
              AI、智能体工作流以及面向货主和承运商的新工具。这说明产品是在拓宽平台，而不是推出单一新功能。尚未解决的问题是，发布速度能否支撑更宽工作流表面的复杂度。
