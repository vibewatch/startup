        title: 单位经济与缺口
        blocks:
          - type: paragraph
            body: >
              公开单位经济仍然模糊。第三方来源称，截至 2024 年收入或 ARR 处于三位数的低至中段，但公司未披露当前 ARR、毛利率、NRR 或 CAC 回收期。因此，最稳妥的判断是：FourKites 可能具备高
              ACV、长销售周期的企业经济模型，但外部人士无法获知确切的利润率路径。实际尽调应验证，AI 执行模块是借助软件杠杆提高毛利，还是因更重的服务和推理成本而压低毛利。
