  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争
        blocks:
          - type: paragraph
            body: >
              直接竞争者包括 project44、Shippeo、Descartes MacroPoint、Tive、ORBCOMM、Flexport、Infor
              Nexus，以及能把可视化打包进更大采购合同的供应链套件。公开第三方简介一贯把 FourKites
              放在品类前列，但市场足够分散，买方可以按地域、运输方式或相邻工作流选择供应商。这种分散很重要，因为最强对手未必是另一家可视化厂商，有时是物流套件、托管服务，或企业决定把工作流留在内部。实际竞争集合会随买方成熟度、运营地区，以及买方要纯软件覆盖还是更广泛的运营组合而变化。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
      - number: '3.2'
        title: 差异化与分销
        blocks:
          - type: paragraph
            body: >
              FourKites 最可信的差异化在于网络密度、客户背书，以及如今加入 AI 智能体而不只是跟踪仪表盘的产品方向。不过，公司公开材料仍依赖传统企业软件证明点：分析师认可、客户 Logo
              和广泛的物流工作流覆盖。分销与产品同样重要。企业投资者、经销商关系和生态伙伴帮助 FourKites
              守住品类，但同样的机制也让竞争者能通过相同渠道快速推进。换言之，护城河来自不断复利的数据图谱，而不是封闭的分销模式。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 商品化与风险
        blocks:
          - type: paragraph
            body: >
              市场最大风险是商品化：如果买方把可视化当成一个功能，而不是平台，整个品类就可能向“软件加服务”的经济模式压缩。评测网站和分析师文章显示，FourKites
              以覆盖广而获赞，但仍会与更低价或更大套件选项比较。公司近期转向 AI 执行就是为了抵御这种压力，但也提高了交付门槛。问题不再是 FourKites
              是否有用，而是随着智能体功能扩散到整个品类，它能否继续不可或缺、抵抗价格竞争。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
