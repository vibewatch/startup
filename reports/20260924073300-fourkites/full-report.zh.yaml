      basis: The table covers the major public bull and bear arguments, but not every possible portfolio or channel scenario.
    notes: 论点和反论点经过有意简化，以便清楚呈现尽调门槛。
    rows:
      - - 市场地位
        - 大型企业覆盖面广，品类认知度高
        - 覆盖面不等于高效增长
        - 索取 logo 增长和客户扩张率
      - - AI 增购
        - Loft 可在现有客户中提高 ACV
        - AI 可能先是故事，之后才成为收入来源
