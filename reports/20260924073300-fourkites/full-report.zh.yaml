  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从宽泛的供应链软件预算范围一路收窄到 FourKites 实际企业 SOM 的六层市场视角。
    data:
      nodes:
        - label: TAM：供应链软件
          detail: 覆盖规划、执行、可视化和分析的广泛预算范围。
          tone: positive
        - label: TAM+：运营 AI
          detail: 能改变可量化物流结果的工作流自动化。
          tone: positive
        - label: SAM：可视化 + 控制塔
          detail: 实时运输可视化、指挥中心和异常管理。
          tone: neutral
        - label: SAM+：堆场 / 预约 / 协作
          detail: 能提高大型企业客户钱包份额的相邻场景。
          tone: positive
        - label: SOM：大型货主和 3PL
          detail: 货运密度和异常成本足够高、能够收回整合工作成本的客户。
          tone: neutral
        - label: SOM+：现有网络扩张
          detail: 向 AI 代理、数字孪生和工作流自动化增购的路径。
          tone: positive
    approximationNotes: 这座金字塔仅用于指示方向；该品类没有唯一权威的公开 TAM，内层有意采用定性描述。
    claimRefs:
