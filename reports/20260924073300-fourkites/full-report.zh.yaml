      - number: '2.3'
        title: 约束与尽调缺口
        blocks:
          - type: paragraph
            body: >
              市场的主要约束不是认知度，而是落地摩擦。平台产生价值前，买方需要先打通 EDI、GPS、TMS、ERP 和承运商数据。这会拉长采用周期；产品嵌入后，切换成本也会上升。竞争压力同样真实：买方可以把
              FourKites 与 project44、Shippeo、Descartes、Tive、ORBCOMM
              以及更广泛的物流软件套件比较，它们都在用不同方式解决同一个运营问题。因此，尚未解决的市场问题不是品类是否存在，而是随着 AI 功能扩散到整个技术栈，FourKites 还能持续拿下多大比例的供应链软件预算。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
