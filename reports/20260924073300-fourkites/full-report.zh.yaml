  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >
              FourKites 似乎通过企业 SaaS 订阅、实施服务，以及叠加在可视化网络之上的高价值附加模块变现。公开叙事如今强调 AI
              智能体和结果，说明公司正试图从单纯跟踪收入转向自动化收入。产品一旦嵌入承运商消息、堆场排程、客户更新和异常解决，业务粘性就会高得多。关键财务问题是，这些模块究竟作为独立 SKU
              增量出售、打包进交易，还是主要用于守住续约。公开来源没有披露确切组合。尽调很大一部分工作是判断 AI 模块提高 ARPU 和留存的幅度，能否抵消新增实施或推理成本。
