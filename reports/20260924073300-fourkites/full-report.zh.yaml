              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: 采用与验证
        blocks:
          - type: paragraph
            body: >
              FourKites 能展示真实工作流变化，而不只是堆客户 Logo 时，采用证据最有力。公司官方客户引述强调响应更快、滞留减少和沟通自动化，产品页面也显示平台旨在嵌入实际运营。实际判断是，FourKites
              不是只做试点的供应商；它已经部署得足够深入，能产生运营案例。不过，公开资料仍缺少客户群视图：确切留存、分客群增长，以及使用一个模块与多个模块的客户占比。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: 扩张与集中度
        blocks:
          - type: paragraph
            body: >
              客户路径似乎是先落地再扩张：先做可视化，再做堆场、海运、协作，如今扩展到 AI 智能体模块。这对企业 SaaS
              是很强的模式，因为每个新工作流都会加深数据网络，让客户更难流失。缺点是公司公开故事仍依赖相对少数的超大客户和几个点名 Logo。换言之，FourKites
              实际上可能拥有出色的总留存，但公开证据仍未量化。尽调重点是把 Logo 数量与活跃使用分开，再把活跃使用与多模块扩张分开。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
