  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险全景
        blocks:
          - type: paragraph
            body: >
              FourKites
              的企业产品粘性很强，但披露程度符合后期私有公司的典型特征：公开信号足以看懂业务，却不足以做出干净的量化评估。最高风险集中在财务和治理，因为这两项在公开材料中最不透明。下一层是运营风险：承运商合规、云依赖和数据质量都会直接影响平台能否在生产环境交付价值。竞争风险同样存在，但更大的担忧不是
              FourKites 输掉每一场 RFP，而是可视化最终变成 SAP、Oracle 或更完整物流套件中的一个功能。即便公司保住现有客户，这也会压低定价并拖慢新客户增长。
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR011
      - number: '7.2'
        title: 法律与财务风险
        blocks:
          - type: paragraph
            body: >
              FourKites 的法律和财务风险，主要在于哪些信息仍未披露。距离上次公开融资已经足够久，现金跑道、烧钱速度和退出时点都应列入尽调重点；但没有管理层数据，公开信息不足以收窄这些区间。project44
              争议仍是有用的治理信号：即使诉讼已经解决，也说明竞争冲突可能多快升级为高管行为指控。财务方面，$1B
              估值后的长期沉默，如果公司确实已接近零烧钱，可能是健康表现；也可能意味着市场尚未给予这项资产足够回报，不足以支持新资本进入。公开证据无法定论。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
      - number: '7.3'
        title: 运营与市场风险
        blocks:
          - type: paragraph
            body: >
              运营风险离产品更近，而不是离资产负债表更近。FourKites 依赖承运商参与、运输数据质量和客户侧流程纪律。承运商上报不稳定时，ETA 准确度和异常管理都会变差。平台深度嵌入 AWS
              托管的工作流后，云中断或价格变化就会变成全企业问题，而非孤立事件。公司可以靠承运商项目和客户成功工具抵消一部分风险，但风险不会消失，因为价值主张建立在实时外部行为之上。这种业务适合产生经常性收入，却也容易暴露质量问题，出了问题很难靠解释带过。
            claimRefs:
              - CR003
