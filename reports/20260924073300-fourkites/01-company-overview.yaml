company:
  name: FourKites
chapter:
  number: 1
  title: Company Overview
  summary: >
    FourKites is a Chicago-based supply-chain visibility and orchestration company founded in
    2014 that now frames itself as an Outcome-as-a-Service platform powered by AI agents and
    digital twins. Public sources still support a unicorn-era valuation around $1.0B-$1.1B and
    a late-stage private financing history, but revenue, margin, and exact liquidity timing
    remain opaque.
sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      FourKites, Inc. is a Chicago-headquartered enterprise software company founded in 2014 by
      Mathew Elenjickal with Arun Chandrasekaran listed in company-profile sources as a cofounder.
      The business began as a real-time shipment visibility product and now positions itself as
      an "Outcome-as-a-Service" platform that replaces manual supply-chain work with AI agents,
      digital twins, and autonomous workflows. In the company’s own 2026 marketing, the network
      is described as spanning 3.2M+ shipments per day, 1.1M+ carriers, 1,600+ brands, and
      200+ countries. That scale narrative still centers on visibility, but the commercial story
      has broadened to execution: managing suppliers, customers, carriers, facilities, and
      documents rather than only tracking freight. The core diligence implication is that FourKites
      remains a category-defining logistics platform, but the current revenue model appears tied
      to enterprise subscriptions plus expansion into higher-value automation modules rather than
      any single point-solution workflow.
    claimRefs: [CO001, CO002, CO003, CO006]
    tableRefs: [TO001]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      Public leadership evidence still centers on founder and CEO Matt Elenjickal, whose public
      role is reinforced by company materials and third-party company profiles. FourKites’ 2024
      leadership refresh elevated Priya Rajagopalan to President of Product, Technology, and
      Operations and brought Ron Richardson back as Chief Revenue Officer, while Bill Maw serves
      as CFO and Michelle Meller as General Counsel. The company’s official about page also points
      to a broad executive bench spanning technology, people, and legal functions, which matters
      because the product has moved from visibility into more complex operational automation.
      Governance remains the usual late-stage venture mix: strategic investors, board-level
      influence from major backers, and continuing founder centrality. That structure is a
      strength for product continuity, but it also makes the company unusually dependent on
      Elenjickal’s narrative and external credibility.
    claimRefs: [CO005, CO012, CO004]
    tableRefs: [TO002]

  - id: funding-scale-milestones
    title: Funding, Scale, and Milestones
    body: >
      FourKites has raised a late-stage venture stack that public sources place in the $239M-$243M
      range, with the most visible financing steps being the $100M Series D in March 2021, the
      $30M FedEx-led extension in mid-2022, and Mitsui’s $10M strategic investment in September
      2022. That sequence left the company with a widely cited $1.0B-$1.1B valuation anchor in
      2022, but no fresh public re-mark since then. Milestones since founding show steady product
      breadth expansion: multimodal tracking, yard and facility workflows, acquisitions of Haven
      and NIC-place, and then a 2024-2026 pivot into AI agents and the Loft/Digital Worker
      narrative. The current refresh therefore looks less like a new-company story and more like a
      capital-efficient repositioning of a mature enterprise platform toward automation upside.
    claimRefs: [CO007, CO008, CO009, CO012]
    tableRefs: [TO003]
    figureRefs: [FO001]

