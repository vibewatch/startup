    title: Product module / asset matrix
    columns: ["Module / product", "User", "Status / maturity", "Differentiation", "Diligence gap"]
    rows:
      - ["Intelligent Control Tower", "Operations leadership", "Core platform", "Network + intelligence layer", "Need adoption proof"]
      - ["Digital twins", "Supply chain planners", "Production", "Real-time operational model", "Need update frequency data"]
      - ["AI agents / digital workers", "Ops teams", "Newer commercialization layer", "Execution, not just visibility", "Need pricing and ROI data"]
      - ["Carrier operations", "Transportation teams", "Mature workflow", "Messaging and status automation", "Need usage metrics"]
      - ["Facility operations", "Yard / dock managers", "Mature workflow", "Appointment and yard orchestration", "Need attach-rate data"]
      - ["Customer operations", "Service teams", "Mature workflow", "Proactive communication", "Need retention and savings data"]
    notes: "This table treats modules as customer workflow assets rather than product SKUs, because public pricing is not disclosed."
    claimRefs: [CE001, CE002, CE003, CE004]

  - id: TE002
    title: Workflow / use-case table
    columns: ["User job", "Current workflow", "FourKites solution", "Measurable benefit", "Limitation"]
    rows:
      - ["Track shipments", "Manual status checks", "Real-time visibility", "Faster exception detection", "Depends on data coverage"]
      - ["Reschedule appointments", "Calls and emails", "AI-assisted scheduling", "Less dock idle time", "Requires facility adoption"]
      - ["Notify customers", "Manual service updates", "Proactive alerts", "Lower WISMO load", "Needs strong data quality"]
      - ["Process documents", "AP / ops handoffs", "Document automation", "Less admin work", "Document variety is high"]
      - ["Manage carriers", "Email / phone follow-up", "Carrier operations agents", "Lower manual effort", "Carrier compliance varies"]
      - ["Run the yard", "Spreadsheets and radio calls", "Facility workflow automation", "Reduced congestion", "Edge cases remain manual"]
    notes: "The use-case table is workflow-centric and intentionally avoids claiming precise ROI numbers without public customer economics."
    claimRefs: [CE001, CE002, CE007, CE009]

  - id: TE003
    title: Technology / operating architecture table
    columns: ["Layer / component", "Role", "Dependency", "Risk"]
    rows:
      - ["Network layer", "Shipment, carrier, and facility data graph", "Integrations and coverage", "Network quality risk"]
      - ["Intelligence layer", "ETA prediction and event understanding", "Data freshness and model tuning", "Prediction drift"]
      - ["Execution layer", "AI agents and workflow automation", "Customer-specific rules", "Automation failure"]
      - ["Trust layer", "Security, segregation, and privacy", "Enterprise controls", "Data-governance risk"]
      - ["Developer layer", "GitHub / public signal", "Public repos and docs", "Thin open-source signal"]
      - ["Deployment layer", "Enterprise implementation", "EDI / TMS / ERP alignment", "Slow rollouts"]
    notes: "This architecture table is a simplified operating model, not a product engineering diagram."
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE012]

