companyProfile:
  summary: >
    FourKites is a Chicago-based supply chain visibility and agentic AI platform founded in 2014 by Matt Elenjickal. The
    company tracks shipments across truckload, rail, ocean, parcel, and related logistics workflows for large enterprise
    shippers. Its public story now centers on extending that base with the Loft AI Agent Platform, which adds workflow
    automation and AI assistance on top of real-time visibility. The business serves a mostly enterprise customer base
    and has emphasized carrier network depth, multi-modal coverage, and workflow stickiness as its core moat.
  foundedDate: '2014-01-01'
  founders:
    - name: Matt Elenjickal
      role: CEO & Founder
      background: |
        Former Oracle supply chain product manager who founded FourKites in 2014.
  foundingLocation: Chicago, IL
  headquarters: Chicago, IL
  productSummary: >
    Real-time supply chain visibility SaaS with multi-modal tracking, predictive ETAs, carrier and facility workflows,
    and Loft AI automation features for appointment scheduling, document processing, exception handling, and customer
    service.
  customerFocus: |
    Large enterprise shippers in CPG, food & beverage, manufacturing, retail, and life sciences.
  businessModel: >
    Annual SaaS subscription priced by shipment volume and module breadth, with professional services and partner-led
    market access in some regions.
  stage: Late-stage private (Series E)
  fundingStatus: |
    $200M Series E closed in June 2022 at a $1B valuation; no newer public financing has been disclosed.
  disclosureProfile: private-undisclosed
