company:
  name: FourKites
chapter:
  number: 2
  title: Market Analysis
  summary: >
    FourKites sits in the enterprise supply-chain visibility and execution layer: a market that
    includes RTTVP, control-tower software, yard and exception workflows, and the broader AI
    orchestration stack around them. The market is large enough to support a durable enterprise
    SaaS business, but public sizing is noisy and the buyer only pays when the software cuts
    measurable operational cost.
sections:
  - id: market-boundary-and-buyer
    title: Market Boundary and Buyer
    body: >
      FourKites competes in a boundary that is wider than classic freight tracking and narrower
      than all supply-chain software. The relevant market includes real-time transportation
      visibility, control towers, appointment and yard workflows, exception management, and the
      operational AI that can act on those signals. The buyer is usually a large shipper or 3PL
      with enough shipment volume to justify integration work and enough exception cost to
      monetize the software. Buyers care less about feature counts than about whether the system
      reduces detention, expedites, OTIF penalties, and manual exception handling. That means the
      market is budgeted out of logistics, operations, and supply-chain transformation spend, not
      from a generic IT seat budget.
    claimRefs: [CM001, CM002, CM003, CM012]
    tableRefs: [TM001]

  - id: sizing-and-adoption
    title: Sizing and Adoption
    body: >
      Public sizing evidence is imprecise, but the directional case is still strong: enterprise
      supply-chain software, visibility platforms, and operational AI all sit inside a multi-
      tens-of-billions software envelope. FourKites’ own 2026 content argues that AI ROI will be
      judged by P&L impact rather than time saved, which fits the category’s economics. Adoption
      is driven by measurable events such as detention, service failure, freight spend, and
      customer-facing delay management, which makes ROI easier to prove than in generic productivity
      software. The tradeoff is that each deployment requires integrations, data governance, and
      change management, so the market scales through large accounts rather than through low-touch
      self-serve adoption.
    claimRefs: [CM004, CM005, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]

  - id: constraints-and-gaps
    title: Constraints and Diligence Gaps
    body: >
      The main market constraint is not awareness; it is implementation friction. Buyers need
      EDI, GPS, TMS, ERP, and carrier data to line up before the platform can produce value.
      That creates a long adoption path and raises switching costs once the product is embedded.
      Competitive pressure is also real: buyers can compare FourKites against project44, Shippeo,
      Descartes, Tive, ORBCOMM, and broader logistics software suites, all of which frame the
      same operational problem differently. The biggest unresolved market question is therefore
      not whether the category exists, but how much of the wider supply-chain software budget
      FourKites can continue to capture as AI features spread across the stack.
    claimRefs: [CM006, CM007, CM008, CM011]
    tableRefs: [TM003]

