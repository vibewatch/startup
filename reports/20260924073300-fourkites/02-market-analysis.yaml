    title: Market Sizing Lens
    type: pyramid
    layout: standard
    summary: A six-layer market lens from the broad supply-chain software envelope down to FourKites’ practical enterprise SOM.
    data:
      nodes:
        - label: "TAM: Supply-chain software"
          detail: "Broad budget envelope for planning, execution, visibility, and analytics."
          tone: positive
        - label: "TAM+: Operational AI"
          detail: "Workflow automation that changes measurable logistics outcomes."
          tone: positive
        - label: "SAM: Visibility + control tower"
          detail: "Real-time transportation visibility, command center, and exception management."
          tone: neutral
        - label: "SAM+: Yard / appointment / collaboration"
          detail: "Adjacencies that increase wallet share in large enterprise accounts."
          tone: positive
        - label: "SOM: Large shippers and 3PLs"
          detail: "Accounts with enough shipment density and exception cost to pay back integration work."
          tone: neutral
        - label: "SOM+: Existing-network expansion"
          detail: "Upsell paths into AI agents, digital twins, and workflow automation."
          tone: positive
    approximationNotes: "The pyramid is directional only; the category has no single authoritative public TAM and the inner layers are intentionally qualitative."
    claimRefs: [CM004, CM005, CM009, CM010, CM012]

