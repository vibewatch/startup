      - ["AI orchestration", "Agentic workflow automation for logistics exceptions", "Consumer productivity AI", "Ops innovation / IT", "Newest monetization layer"]
      - ["Carrier collaboration", "Carrier portal, messaging, document exchange", "Carrier ELD hardware", "Transportation operations", "Adoption wedge"]
      - ["Status quo manual process", "Planner labor, call centers, email threads", "Not software spend", "Operations budget", "The spend FourKites displaces"]
      - ["Internal build", "Custom integrations and in-house tooling", "Vendor license fees", "IT / engineering", "Primary alternative"]
      - ["Broader supply-chain software", "Planning, execution, visibility, and analytics suites", "ERP core", "Supply-chain leadership", "Upper-bound TAM"]
      - ["3PL / managed service", "Outsourced logistics operations", "Direct software subscription", "Shippers using 3PLs", "Competes for the same budget"]
      - ["Network data layer", "Carrier/facility intelligence network effects", "Standalone point tools", "Enterprise supply-chain teams", "Differentiation moat"]
    notes: "This is a boundary table rather than a full top-down TAM model; the categories reflect budget lines and substitution paths, not a single published analyst estimate."
    claimRefs: [CM001, CM002, CM003, CM006, CM007, CM008, CM009]

  - id: TM002
    title: TAM / SAM / SOM sizing table
    columns: ["Layer", "Value / range", "Method", "Confidence", "Limitation"]
    rows:
      - ["TAM", "Broad supply-chain software spend", "Top-down budget envelope", "low", "Exact published total varies by analyst"]
      - ["SAM", "Visibility + control tower + orchestration", "Bottom-up category boundary", "medium", "Definitions differ by vendor"]
      - ["SOM", "Large shippers and 3PLs with high exception costs", "Buyer-fit lens", "medium", "Account-level conversion varies"]
      - ["Adoption driver", "Detention / OTIF / expedite savings", "ROI logic", "high", "Savings depend on execution quality"]
      - ["Expansion driver", "Agents and digital-twin workflows", "Land-and-expand", "medium", "Commercial model still evolving"]
    notes: "This table is directional and intentionally avoids a false-precision TAM; values are framed as categories and budgeting logic rather than a single source-backed number."
    claimRefs: [CM004, CM005, CM009, CM010, CM011, CM012]

  - id: TM003
    title: Segment / buyer map
    columns: ["Segment", "Buyer / payer", "Workflow", "Adoption trigger", "Why it matters"]
    rows:
      - ["Large shipper", "Logistics / operations", "Shipment tracking and exception management", "Freight spend or service pain", "Core enterprise wedge"]
      - ["3PL / logistics provider", "Operations / account teams", "Customer communication and status visibility", "Service differentiation", "Channel and co-sell opportunity"]
      - ["Carrier network", "Transportation ops", "Messaging, documents, appointments", "Reduced phone/email load", "Data-network expansion"]
      - ["Warehouse / yard ops", "Facilities leadership", "Dock scheduling and yard moves", "Dwell and congestion issues", "Sticky module expansion"]
      - ["Supply-chain transformation", "Central ops / IT", "Control tower and AI orchestration", "Cross-functional redesign", "Higher ACV and longer cycles"]
    notes: "The buyer map is a synthesis of public positioning and common enterprise logistics workflows; it is not a claim that every segment buys separately or at the same time."
    claimRefs: [CM002, CM003, CM005, CM006, CM008]

figures:
