        title: Unit Economics and Gaps
        blocks:
          - type: paragraph
            body: >
              The public unit-economics picture is still cloudy. Third-party sources suggest revenue or ARR in the
              low-to-mid triple digits by 2024, but the company does not disclose current ARR, gross margin, NRR, or CAC
              payback. That means the most defensible statement is that FourKites likely has enterprise economics with
              high ACV and long sales cycles, but the exact margin path is not available to outsiders. The practical
              diligence task is to test whether AI execution modules improve gross margin through software leverage or
              compress it through heavier service and inference costs.
