      - number: '8.2'
        title: Valuation Context
        blocks:
          - type: paragraph
            body: >
              FourKites' last public valuation anchor is the 2022 Series E at $1B. That number matters less as a target
              than as a reference point for what the market was willing to pay before SaaS multiples reset. Since then,
              the comp set has moved: profitable public supply-chain software has held up better than venture-backed
              private peers, and the market has become more demanding about growth efficiency. The important issue is
              whether FourKites looks more like the durable public names or the discounted private ones. The answer
              depends on the current ARR base, whether Loft is already producing incremental ACV, and how much of the
              customer story is concentrated in a narrow top-end ICP.
            claimRefs:
