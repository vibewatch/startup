      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Public leadership evidence still centers on founder and CEO Matt Elenjickal, whose public role is
              reinforced by company materials and third-party company profiles. FourKites’ 2024 leadership refresh
              elevated Priya Rajagopalan to President of Product, Technology, and Operations and brought Ron Richardson
              back as Chief Revenue Officer, while Bill Maw serves as CFO and Michelle Meller as General Counsel. The
              company’s official about page also points to a broad executive bench spanning technology, people, and
              legal functions, which matters because the product has moved from visibility into more complex operational
              automation. Governance remains the usual late-stage venture mix: strategic investors, board-level
              influence from major backers, and continuing founder centrality. That structure is a strength for product
              continuity, but it also makes the company unusually dependent on Elenjickal’s narrative and external
              credibility.
            claimRefs:
              - CO005
              - CO012
              - CO004
