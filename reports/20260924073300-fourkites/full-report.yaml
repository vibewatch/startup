        title: Capital Adequacy and History
        blocks:
          - type: paragraph
            body: >
              The capital picture is late-stage private rather than distressed: the company raised a $100M Series D in
              2021 and added strategically motivated capital in 2022, leaving it with a public funding stack in the
              high-$200M range. That support, plus the company’s large enterprise installed base, suggests the firm can
              continue investing without an immediate financing event. Even so, TechCrunch’s reporting on layoffs in
              2022 is a reminder that the company has already gone through a profitability reset. The right underwriting
              lens is therefore capital sufficiency plus growth quality, not emergency runway.
