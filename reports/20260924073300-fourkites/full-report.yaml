              - CV009
              - CV012
          - type: table
            tableRef: TV004
            claimRefs:
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: Scenarios and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              A sensible investment view is to underwrite a range rather than a point estimate. The base case assumes a
              mid-teens growth path off a roughly $65M 2021 ARR anchor and modest AI uplift. The bull case requires Loft
              to become a real commercial wedge and for the company to continue expanding inside existing logos. The
              bear case is what happens if the customer base looks more static than it first appears and the company
              needs a valuation reset to match the new SaaS multiple regime. In that world, the best entry discipline is
              to make the price contingent on NRR, burn, and actual Loft deployments rather than paying purely for
              narrative.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
