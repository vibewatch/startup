      - number: '3.2'
        title: Differentiation and Distribution
        blocks:
          - type: paragraph
            body: >
              FourKites’ most credible differentiator is the combination of network density, customer references, and a
              product direction that now includes AI agents rather than only tracking dashboards. That said, the
              company’s public materials still depend on classic enterprise proof points: analyst recognition, customer
              logos, and broad logistics workflow coverage. Distribution matters as much as product. Corporate
              investors, reseller relationships, and ecosystem partners help FourKites defend the category, but the same
              dynamics also enable rivals to move quickly through the same channel. In other words, the moat comes from
              a compounding data graph, not from a closed distribution model.
            claimRefs:
              - CP005
