      - number: '5.2'
        title: Architecture and Deployment
        blocks:
          - type: paragraph
            body: >
              The architecture story is data-first. FourKites relies on shipment, facility, carrier, and document data,
              then overlays real-time intelligence and agentic execution. That architecture is defensible because it
              compounds with every integration, but it is also heavy to deploy: enterprise customers need EDI, TMS, ERP,
              and carrier workflows to line up before the value shows up. The company’s trust story is therefore a
              product feature in its own right. The public site stresses enterprise-grade security, data segregation,
              and a claim that customer data is not used to train third-party models, which is exactly the sort of
              promise a large shipper wants before routing operations through an AI layer.
            claimRefs:
              - CE005
