    notes: Coverage is directional because FourKites does not publish uptime, carrier-compliance, or audit metrics.
    rows:
      - - Carrier compliance dependency
        - Core product quality
        - High
        - High
        - Premier-carrier programs and customer success can improve compliance
        - Request carrier compliance rate distributions by customer
      - - Single-cloud exposure
        - Infrastructure
        - Medium
        - High
        - AWS footprint is common for SaaS, but no public multi-cloud plan is visible
        - Request BC/DR and RTO/RPO documentation
      - - Data quality drift
        - Model / analytics
        - Medium
        - Medium
        - Ongoing data ingestion and model updates reduce but do not remove drift
        - Request ETA accuracy and exception-rate trend lines
      - - Loft AI error rate
        - AI product quality
        - Medium
        - Medium
        - Automation is promising but still new at scale
        - Request production error rates and human-in-the-loop design
      - - Security / privacy controls
        - Security
        - Medium
