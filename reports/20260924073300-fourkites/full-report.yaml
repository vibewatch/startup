        title: Adoption and Proof
        blocks:
          - type: paragraph
            body: >
              Adoption evidence is strongest when FourKites can show actual workflow change rather than a logo wall. The
              company’s official customer quotes emphasize faster response times, reduced detention, and more automated
              communication, while the product pages show that the platform is meant to sit inside live operations. The
              practical read is that FourKites is not a pilot- only vendor; it is already deployed deeply enough to
              generate operational anecdotes. What is still missing, however, is a public cohort view: exact retention,
              segment-by-segment growth, and the share of customers using one module versus several.
            claimRefs:
