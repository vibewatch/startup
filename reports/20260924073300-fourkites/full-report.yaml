        title: Roadmap and Developer Signal
        blocks:
          - type: paragraph
            body: >
              FourKites’ roadmap is visible through public launches rather than through a deep public API or open-source
              ecosystem. The company has a GitHub organization and a small number of public repositories, which is
              useful as a developer signal but not evidence of broad open-source adoption. More importantly, the cadence
              of 2024-2026 announcements shows a product moving faster into AI execution, with Fin AI, agentic
              workflows, and new tools for shippers and carriers. That suggests the product is being used to broaden the
              platform rather than to introduce a single new feature. The unresolved question is whether the release
              tempo can sustain the complexity of a much broader workflow surface.
