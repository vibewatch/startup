      - number: '2.3'
        title: Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The main market constraint is not awareness; it is implementation friction. Buyers need EDI, GPS, TMS,
              ERP, and carrier data to line up before the platform can produce value. That creates a long adoption path
              and raises switching costs once the product is embedded. Competitive pressure is also real: buyers can
              compare FourKites against project44, Shippeo, Descartes, Tive, ORBCOMM, and broader logistics software
              suites, all of which frame the same operational problem differently. The biggest unresolved market
              question is therefore not whether the category exists, but how much of the wider supply-chain software
              budget FourKites can continue to capture as AI features spread across the stack.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
