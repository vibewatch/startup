            tableRef: TO002
            claimRefs:
              - CO005
              - CO012
              - CO001
      - number: '1.3'
        title: Funding, Scale, and Milestones
        blocks:
          - type: paragraph
            body: >
              FourKites has raised a late-stage venture stack that public sources place in the $239M-$243M range, with
              the most visible financing steps being the $100M Series D in March 2021, the $30M FedEx-led extension in
              mid-2022, and Mitsui’s $10M strategic investment in September 2022. That sequence left the company with a
              widely cited $1.0B-$1.1B valuation anchor in 2022, but no fresh public re-mark since then. Milestones
              since founding show steady product breadth expansion: multimodal tracking, yard and facility workflows,
              acquisitions of Haven and NIC-place, and then a 2024-2026 pivot into AI agents and the Loft/Digital Worker
              narrative. The current refresh therefore looks less like a new-company story and more like a
              capital-efficient repositioning of a mature enterprise platform toward automation upside.
