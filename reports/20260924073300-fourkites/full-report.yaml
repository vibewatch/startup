        - High
        - Management has implied discipline, but no current burn or runway disclosure exists
        - Request current cash, burn, and runway with bridge assumptions
      - - Down-round or delayed exit
        - Capital markets
        - Medium
        - High
        - A large enterprise footprint helps, but valuation support depends on undisclosed growth
        - Request current ARR, NRR, and exit planning materials
      - - SEC / disclosure hygiene
        - Regulatory
        - Low
        - Medium
        - No public issue is visible, but private-company disclosure quality still matters
        - Review Form D and board-level disclosure controls
      - - Key-person concentration
        - Governance
        - Medium
        - Medium
        - Founder-CEO has a visible external profile and long history with major customers
        - Confirm succession, delegation, and board oversight
  - id: TR002
    title: Operational / quality / security risk register
    description: Risks that can degrade customer value in live production workflows.
    columns:
