  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >
              FourKites appears to monetize through enterprise SaaS subscriptions, implementation work, and higher-value
              add-on modules that sit on top of its visibility network. The public story now emphasizes AI agents and
              outcomes, which implies the company is trying to move from plain tracking revenue toward automation
              revenue. That matters because the business is much stickier when it is embedded into carrier messaging,
              yard scheduling, customer updates, and exception resolution. The key financial question is whether those
              modules are sold as separate SKU uplift, bundled in deals, or used mainly to defend renewals. Public
              sources do not disclose the exact mix. A large part of the diligence work is determining whether AI
              modules raise ARPU and retention enough to offset any added implementation or inference cost.
