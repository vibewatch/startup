      - number: '7.2'
        title: Legal and Financial Risks
        blocks:
          - type: paragraph
            body: >
              FourKites' legal and financial risk is mostly about what remains undisclosed. The company is far enough
              past its last disclosed financing to make runway, burn, and exit timing important diligence items, but not
              enough is public to narrow those ranges without management data. The project44 dispute remains a useful
              governance signal: even if the litigation is resolved, it shows how quickly competitive conflict can spill
              into executive conduct allegations. On the financial side, a long quiet period after a $1B valuation can
              be healthy if the company has truly reached near-zero burn; it can also mean the market has not rewarded
              the asset enough to justify fresh capital. Public evidence does not settle that question.
            claimRefs:
              - CR001
