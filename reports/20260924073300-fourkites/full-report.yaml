      - number: '3.3'
        title: Commoditization and Risk
        blocks:
          - type: paragraph
            body: >
              The market’s biggest risk is commoditization: if buyers treat visibility as a feature rather than a
              platform, the category can compress toward software-plus-services economics. Review sites and analyst
              writeups show that FourKites is praised for breadth but still compared against lower-priced or
              broader-suite options. The company’s recent move into AI execution is designed to protect against that
              pressure, but it also raises the bar for delivery. The question is no longer whether FourKites is useful;
              it is whether it can remain indispensable enough to resist price competition as agentic features spread
              across the category.
            claimRefs:
