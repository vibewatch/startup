      - number: '6.3'
        title: Expansion and Concentration
        blocks:
          - type: paragraph
            body: >
              The customer motion appears to be land-and-expand: visibility first, then yard, ocean, collaboration, and
              now AI agent modules. That is a strong model for enterprise SaaS because every new workflow deepens the
              data network and makes churn harder. The downside is that the company’s public story remains dependent on
              a relatively small number of very large accounts and a few named logos. In other words, FourKites may have
              excellent gross retention in practice, but the public evidence still does not quantify it. The diligence
              priority is to separate logo count from active usage, and active usage from multi-module expansion.
