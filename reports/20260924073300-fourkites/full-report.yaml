  - id: TV001
    title: Recommendation summary table
    description: Summary of the investment view, confidence, valuation stance, and the conditions that matter most.
    columns:
      - Dimension
      - Assessment
      - Basis
      - Key condition
    claimRefs:
      - CV001
      - CV010
      - CV011
    enumerationScope:
      coverage: partial
      basis: >-
        The recommendation is a modeled judgment built from public evidence; internal financial data would materially
        change it.
    notes: This table is a decision summary, not a substitute for management-provided financial statements or cohort data.
    rows:
      - - Overall recommendation
        - Conditional proceed
        - Good market position, but insufficient public financial detail
        - Confirm NRR, burn, and Loft deployment count
      - - Confidence
        - Low to medium
        - Strong product story; weak disclosed financial evidence
        - Confidence improves with audited current numbers
      - - Valuation stance
        - Below or near prior reference
        - Multiple compression and missing growth proof argue for caution
        - Apply a valuation adjustment if growth is slower than management implies
      - - Return profile
        - Moderate if the bull case is true
        - AI upsell and retained enterprise base can still create upside
        - Price should reflect scenario probability, not best case
      - - Risk rating
        - High
        - Financial opacity remains the dominant unknown
        - Require hard evidence before paying a premium
  - id: TV002
    title: Thesis / anti-thesis table
    description: Direct comparison of the investment thesis and the strongest bear counterpoints.
    columns:
      - Dimension
      - Bull argument
      - Bear counter
      - Diligence gate
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
    enumerationScope:
      coverage: partial
      basis: The table covers the major public bull and bear arguments, but not every possible portfolio or channel scenario.
    notes: Thesis and anti-thesis are intentionally simplified so the diligence gate is obvious.
    rows:
      - - Market position
        - Large enterprise footprint and category familiarity
        - Footprint does not prove efficient growth
        - Request logo growth and customer expansion rates
      - - AI upsell
        - Loft can raise ACV inside existing accounts
        - AI can be a story before it is a revenue stream
        - Request Loft contract count and incremental ACV
      - - Moat
        - Carrier and workflow data create switching costs
        - Bundle pressure can erode price premium
        - Request win/loss and retention by segment
      - - Financial quality
        - Near-zero burn discipline could support exit optionality
        - Public metrics are missing, so discipline is unverified
        - Request current burn and cash runway
      - - Comparable valuation
        - Best public comp outcomes still justify a solid multiple
        - Private peers can reset quickly when growth slows
        - Request current comp bridge and discount rationale
  - id: TV003
    title: Bull / base / bear scenario table
