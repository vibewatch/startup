  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Landscape
        blocks:
          - type: paragraph
            body: >
              The direct competitive set includes project44, Shippeo, Descartes MacroPoint, Tive, ORBCOMM, Flexport,
              Infor Nexus, and broader supply-chain suites that can bundle visibility into a larger purchase. Public
              third-party profiles consistently place FourKites near the top of the category, but the market is
              fragmented enough that buyers can shop by geography, transportation mode, or adjacent workflow. That
              fragmentation matters because the strongest rival is not always another visibility vendor; sometimes it is
              a logistics suite, a managed service, or the decision to keep the workflow internal. In practice, that
              means the competitive set shifts by buyer maturity, operating region, and whether the buyer wants
              software-only coverage or a broader operational bundle.
            claimRefs:
