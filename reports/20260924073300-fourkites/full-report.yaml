  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The bull case is straightforward: FourKites owns a large enterprise footprint, has a visible AI upsell
              narrative, and still appears to sit inside a workflow where switching costs are real. The bear case is
              equally straightforward: the company has not publicly disclosed the metrics that would let an outside
              investor tell whether the footprint is expanding efficiently or just being defended with more support
              effort. The valuation question therefore turns on evidence of revenue quality, not just revenue size. If
              the company is retaining and expanding customers with Loft and adjacent modules, it deserves a premium to
              generic logistics software. If it is mostly defending an old base, the multiple should compress toward
              public supply-chain SaaS peers.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
