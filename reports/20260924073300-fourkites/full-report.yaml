  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modules
        blocks:
          - type: paragraph
            body: >
              FourKites’ product is best understood as a workflow platform for logistics operations rather than a single
              tracking dashboard. The official site emphasizes a network, an intelligence layer, and an execution layer,
              then packages those capabilities into modules such as carrier operations, supplier operations, customer
              operations, facility operations, document handling, and AI-generated workflows. That module stack is
              important because it shows the company is trying to move from visibility into day-to-day operating
              leverage. The buyer is not paying for abstract AI; the buyer is paying to reduce manual work and exception
              handling in a live supply-chain environment.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
