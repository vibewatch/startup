      - number: '7.3'
        title: Operational and Market Risks
        blocks:
          - type: paragraph
            body: >
              Operational risk sits closer to the product than the balance sheet. FourKites depends on carrier
              participation, shipping-data quality, and customer-side process discipline. When carriers do not report
              reliably, ETA accuracy and exception management weaken. When the platform is deeply integrated into
              AWS-hosted workflows, cloud outages or pricing changes become enterprise-wide problems rather than
              isolated incidents. The company can offset some of that with carrier programs and customer-success
              tooling, but the risk never disappears because the value proposition is built on live, external behavior.
              That is the right business for recurring revenue, but it is also a business where quality failures are
              easy to notice and hard to apologize away.
