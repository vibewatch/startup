  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: >
              FourKites’ public customer story is heavily enterprise oriented. The official site and press materials
              point to large shippers, carriers, facilities, and logistics partners using the platform to handle
              exceptions, appointments, customer updates, and document workflows. The most visible proof points are not
              mid-market logos; they are Fortune 500-style customers and category claims such as 1,600+ brands, 9 of the
              top 10 CPG companies, and 18 of the top 20 food-and-beverage companies. That pattern suggests FourKites
              wins where shipment density is high, service penalties are measurable, and integration work can be
              amortized over a large base. The public trail also suggests the customer base spans more than one
              operating model, which makes the platform more resilient than a single-niche point solution.
            claimRefs:
