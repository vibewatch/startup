  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Buyer
        blocks:
          - type: paragraph
            body: >
              FourKites competes in a boundary that is wider than classic freight tracking and narrower than all
              supply-chain software. The relevant market includes real-time transportation visibility, control towers,
              appointment and yard workflows, exception management, and the operational AI that can act on those
              signals. The buyer is usually a large shipper or 3PL with enough shipment volume to justify integration
              work and enough exception cost to monetize the software. Buyers care less about feature counts than about
              whether the system reduces detention, expedites, OTIF penalties, and manual exception handling. That means
              the market is budgeted out of logistics, operations, and supply-chain transformation spend, not from a
              generic IT seat budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.2'
        title: Sizing and Adoption
        blocks:
          - type: paragraph
            body: >
              Public sizing evidence is imprecise, but the directional case is still strong: enterprise supply-chain
              software, visibility platforms, and operational AI all sit inside a multi- tens-of-billions software
              envelope. FourKites’ own 2026 content argues that AI ROI will be judged by P&L impact rather than time
              saved, which fits the category’s economics. Adoption is driven by measurable events such as detention,
              service failure, freight spend, and customer-facing delay management, which makes ROI easier to prove than
              in generic productivity software. The tradeoff is that each deployment requires integrations, data
              governance, and change management, so the market scales through large accounts rather than through
              low-touch self-serve adoption.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
