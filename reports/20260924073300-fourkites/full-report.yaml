        - label: Base
          values:
            - $120M-$140M
            - 7-9x
            - $840M-$1.26B
        - label: Bull
          values:
            - $170M+
            - 10-14x
            - $1.7B-$2.8B
        - label: Reference price
          values:
            - $65M 2021 ARR anchor
