figures:
  - id: FO001
    title: FourKites Milestone Timeline
    type: timeline
    summary: Chronological milestones showing FourKites’ move from visibility to AI execution.
    data:
      items:
        - label: '2014'
          value: Founded in Chicago by Mathew Elenjickal
          tone: positive
        - label: '2016'
          value: Raises $13M to expand the smart-trucking product
          tone: positive
        - label: '2021'
          value: $100M Series D led by THL; scale narrative crosses 3.2M shipments/day
          tone: positive
        - label: '2022'
          value: FedEx-led extension and Mitsui strategic investment deepen the investor base
          tone: positive
        - label: '2024'
          value: Priya Rajagopalan and Ron Richardson promoted into expanded operating roles
          tone: positive
        - label: '2025'
          value: Company doubles down on AI orchestration and digital-worker language
          tone: positive
        - label: '2026'
          value: Outcome-as-a-Service and autonomous execution become the public narrative
          tone: positive
        - label: '2026'
          value: Public sources still do not show a fresh IPO or valuation re-mark
          tone: neutral
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO007
      - CO008
      - CO009
      - CO012
  - id: FM001
    title: Market Sizing Lens
    type: pyramid
    summary: A six-layer market lens from the broad supply-chain software envelope down to FourKites’ practical enterprise SOM.
    data:
      nodes:
        - label: 'TAM: Supply-chain software'
          detail: Broad budget envelope for planning, execution, visibility, and analytics.
          tone: positive
        - label: 'TAM+: Operational AI'
          detail: Workflow automation that changes measurable logistics outcomes.
          tone: positive
        - label: 'SAM: Visibility + control tower'
          detail: Real-time transportation visibility, command center, and exception management.
          tone: neutral
        - label: 'SAM+: Yard / appointment / collaboration'
          detail: Adjacencies that increase wallet share in large enterprise accounts.
          tone: positive
        - label: 'SOM: Large shippers and 3PLs'
          detail: Accounts with enough shipment density and exception cost to pay back integration work.
          tone: neutral
        - label: 'SOM+: Existing-network expansion'
          detail: Upsell paths into AI agents, digital twins, and workflow automation.
          tone: positive
    approximationNotes: >-
      The pyramid is directional only; the category has no single authoritative public TAM and the inner layers are
      intentionally qualitative.
    claimRefs:
      - CM004
      - CM005
      - CM009
      - CM010
      - CM012
