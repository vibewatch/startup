  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Landscape
        blocks:
          - type: paragraph
            body: >
              FourKites combines a sticky enterprise product with a disclosure profile that is typical of a late-stage
              private company: there is enough public signal to see the business, but not enough to score it cleanly.
              The highest-risk questions are financial and governance related because they are least visible in public
              materials. The next tier is operational: carrier compliance, cloud dependence, and data quality all
              directly affect whether the platform delivers value in production. Competitive risk is real as well, but
              the larger concern is not that FourKites loses every RFP; it is that visibility becomes a feature inside
              SAP, Oracle, or a more integrated logistics suite. That would pressure pricing and slow new-logo growth
              even if the company keeps its existing customer base.
            claimRefs:
              - CR001
              - CR002
              - CR005
