evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: A current, company-filed financial disclosure or audited investor update with ARR, gross margin, and NRR.
    whyItMatters: >-
      Valuation and recommendation quality remain constrained when the revenue base and margin profile are
      estimate-only.
    diligencePath: >-
      Ask management for 2026 investor materials or a recent board pack with recurring revenue, gross margin, and
      retention metrics.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A single authoritative current headcount disclosure.
    whyItMatters: Third-party databases vary on employee count, which makes scale comparisons approximate.
    diligencePath: Confirm current employees directly on a company filing, employee census, or updated public profile.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: A more complete cap table or board-rights disclosure for the stakeholder map.
    whyItMatters: >-
      The investor map is intentionally partial because ownership percentages and liquidation preferences are not
      public.
    diligencePath: Request a current ownership and rights summary from management.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A single authoritative market-size study that isolates RTTVP, control tower, and AI orchestration spend.
    whyItMatters: The market boundary is clear enough to underwrite, but not precise enough for a clean top-down TAM.
    diligencePath: >-
      Pull a recent analyst report or buyer budget study that separates visibility, control tower, and orchestration
      spend.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: minor
    topic: pricing-opacity
    missingEvidence: A recent RFP or customer contract showing actual net pricing and discounting in the category.
    whyItMatters: The market comparison remains directionally useful but cannot establish price leadership.
    diligencePath: Request a procurement transcript, renewal quote, or anonymized deal summary from management.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: A current disclosure of ARR, gross margin, retention, CAC payback, and cash runway.
    whyItMatters: The financial model cannot be underwritten tightly without current recurring-revenue and margin data.
    diligencePath: Ask management for a current board deck or investor update with revenue bridge and retention cohorts.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: A richer public developer ecosystem or API documentation set with usage metrics.
    whyItMatters: The company’s technical moat is clearer from product pages than from public developer adoption.
    diligencePath: Check whether the company can share API adoption, integration counts, or developer community metrics.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: A public retention or cohort report with NRR, GRR, and churn by customer segment.
    whyItMatters: Customer concentration and expansion are visible, but retention quality is still inferential.
    diligencePath: Request cohort data and segment-level renewal statistics from management.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: missing-source
    severity: material
    topic: TU003 named customer proof coverage
    missingEvidence: An independent source that corroborates the named customer outcome table beyond company-owned materials.
    whyItMatters: The named proof table needs at least one non-company domain and an explicit gap note.
    diligencePath: Cross-check customer outcomes in a third-party interview, review, or analyst writeup.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: runway-and-nrr-gap
    missingEvidence: A current board-ready financial package with ARR, NRR, GRR, burn, and cash runway.
    whyItMatters: Financial opacity is the single biggest source of valuation uncertainty.
    diligencePath: Ask for the latest monthly operating review and audited annual financials.
    relatedQuestionRefs:
      - QR002
      - QR008
  - type: missing-source
    severity: material
    topic: TR001 coverage gap
    missingEvidence: A public governance or financing packet that explicitly closes the risk register's partial coverage.
    whyItMatters: TR001 is intentionally partial and should be treated as an open diligence area.
    diligencePath: Request board decks and financing schedules that map to the register.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: security-audit-gap
    missingEvidence: SOC 2 / ISO 27001 and penetration-test outputs.
    whyItMatters: The public record only shows security messaging, not audit depth.
    diligencePath: Request third-party security reports and incident history.
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: competitive-win-loss-gap
    missingEvidence: A segmented win/loss study against project44 and suite vendors.
    whyItMatters: Competitive pressure could compress growth or pricing power without being visible in logo counts.
    diligencePath: Request win/loss rates by segment, geography, and product bundle.
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: current-financial-gap
    missingEvidence: A current board package with ARR, NRR, GRR, burn, and cash runway.
    whyItMatters: Those numbers determine whether the valuation should sit near the high or low end of the range.
    diligencePath: Request the latest monthly operating review and audited statements.
    relatedQuestionRefs:
      - QV006
      - QV007
  - type: missing-source
    severity: material
    topic: comp-bridge-gap
    missingEvidence: A current public-to-private comp bridge with a rationale for the chosen multiple band.
    whyItMatters: Comparable selection drives the valuation range more than any single point estimate.
    diligencePath: Ask the banker or sponsor team to show the comp bridge and discount logic.
    relatedTableRefs:
      - TV004
