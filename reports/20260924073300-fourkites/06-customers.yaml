    title: Customer segmentation table
    enumerationScope:
      coverage: partial
      basis: "Public customer stories and category claims; the company does not publish a full revenue segment mix"
    columns: ["Segment", "Buyer / user / payer", "Use case", "Scale", "Gap"]
    rows:
      - ["Fortune 500 shipper", "Ops / logistics / finance", "Tracking and exception management", "Very large", "Retention not public"]
      - ["3PL", "Operations / account teams", "Customer status and carrier coordination", "Large", "Segment mix not public"]
      - ["Carrier", "Carrier ops", "Messaging, documents, appointments", "Large", "Carrier monetization not public"]
      - ["Facility / yard", "Facilities / dock teams", "Appointment and yard orchestration", "Large", "Attach rate not public"]
      - ["Customer service", "Service operations", "Proactive delay communication", "Large", "Active-user data not public"]
      - ["Supply-chain transformation", "Program leadership / IT", "Control tower and AI rollout", "Large", "Module usage split not public"]
    notes: "The segmentation is a synthesis of public customer stories and common enterprise logistics workflows; FourKites does not publish a segment-by-segment revenue mix."
    claimRefs: [CU001, CU002, CU003, CU004]

  - id: TU002
    title: Customer growth / adoption trajectory table
    enumerationScope:
      coverage: partial
      basis: "Publicly stated customer and usage metrics, not cohort-level retention or active-user counts"
    columns: ["Metric", "Value", "Date", "Source", "Confidence", "Implication", "Missing denominator"]
    rows:
      - ["Brands on platform", "1,600+", "2026", "FourKites site", "medium", "Large installed base", "Active vs dormant not public"]
      - ["Top CPG penetration", "9/10", "2021-2026", "FourKites press / site", "medium", "Strong category penetration", "Exact named customers not exhaustive"]
      - ["Top F&B penetration", "18/20", "2021-2026", "FourKites press / site", "medium", "Deep vertical adoption", "Coverage definition not public"]
      - ["Shipment volume", "3.2M+ daily", "2026", "FourKites site", "medium", "High usage intensity", "Customer count by volume band not public"]
      - ["Carrier network", "1.1M+ carriers", "2026", "FourKites site", "medium", "Network depth", "Carrier activity vs inactive not public"]
      - ["Customer satisfaction proxy", "Positive named testimonials", "2021-2026", "Customer quotes", "medium", "Operational outcomes", "No public NPS"]
    notes: "Trajectory data is directional because the company does not publish cohorts, churn, or active-user counts."
    claimRefs: [CU001, CU005, CU006, CU008]

  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: "Representative named customer examples drawn from public quotes and launch coverage"
    columns: ["Customer", "Segment", "Deployment / use case", "Production vs pilot", "Outcome", "Limitation"]
    rows:
      - ["Coca-Cola", "CPG", "AI-driven customer operations", "Production", "Faster response time and more self-service", "Named quote but not a cohort study"]
      - ["First Solar", "Manufacturing", "Manual email reduction and invoice generation", "Production", "More precise financial planning", "No public ACV"]
      - ["Trane Technologies", "Industrial", "Detention reduction and proactive monitoring", "Production", "98.6% reduction at two sites", "Single-company quote"]
      - ["Bayer", "Agriculture / distribution", "Carrier-sharing and arrival visibility", "Production", "Minute-by-minute tracking", "No retention data"]
      - ["tms", "Consumer goods logistics", "Global delivery enhancement", "Production", "Operational time and cost savings", "Freshness limited to 2026 press"]
    notes: "Named proof is strongest where the customer describes an operational outcome, but the public record still lacks a standardized retention or ROI dataset."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]

