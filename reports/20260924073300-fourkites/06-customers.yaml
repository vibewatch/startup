company:
  name: FourKites
chapter:
  number: 6
  title: Customers
  summary: >
    FourKites appears to be winning large enterprise shippers and their logistics teams, with
    customer proof concentrated in Fortune 500-style references and workflow-specific outcomes.
    The customer base looks durable and expandable, but the public evidence still leaves retention
    and concentration risk only partially visible.
sections:
  - id: customer-segmentation
    title: Customer Segmentation
    body: >
      FourKites’ public customer story is heavily enterprise oriented. The official site and press
      materials point to large shippers, carriers, facilities, and logistics partners using the
      platform to handle exceptions, appointments, customer updates, and document workflows. The
      most visible proof points are not mid-market logos; they are Fortune 500-style customers and
      category claims such as 1,600+ brands, 9 of the top 10 CPG companies, and 18 of the top 20
      food-and-beverage companies. That pattern suggests FourKites wins where shipment density is
      high, service penalties are measurable, and integration work can be amortized over a large
      base.
      The public trail also suggests the customer base spans more than one operating model, which
      makes the platform more resilient than a single-niche point solution.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]

  - id: adoption-and-proof
    title: Adoption and Proof
    body: >
      Adoption evidence is strongest when FourKites can show actual workflow change rather than a
      logo wall. The company’s official customer quotes emphasize faster response times, reduced
      detention, and more automated communication, while the product pages show that the platform
      is meant to sit inside live operations. The practical read is that FourKites is not a pilot-
      only vendor; it is already deployed deeply enough to generate operational anecdotes. What is
      still missing, however, is a public cohort view: exact retention, segment-by-segment growth,
      and the share of customers using one module versus several.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]

  - id: expansion-and-concentration
    title: Expansion and Concentration
    body: >
      The customer motion appears to be land-and-expand: visibility first, then yard, ocean,
      collaboration, and now AI agent modules. That is a strong model for enterprise SaaS because
      every new workflow deepens the data network and makes churn harder. The downside is that the
      company’s public story remains dependent on a relatively small number of very large accounts
      and a few named logos. In other words, FourKites may have excellent gross retention in
      practice, but the public evidence still does not quantify it. The diligence priority is to
      separate logo count from active usage, and active usage from multi-module expansion.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]

tables:
