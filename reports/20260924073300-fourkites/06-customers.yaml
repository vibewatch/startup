    type: journey-map
    layout: wide
    summary: A customer lifecycle from evaluation to production go-live and multi-module expansion.
    description: End-to-end enterprise adoption path for a FourKites customer.
    claimRefs: [CU001, CU005, CU006, CU009, CU010, CU011]
    data:
      nodes:
        - label: "Evaluation"
          detail: "Large shipper compares FourKites against visibility peers and suite vendors."
          tone: neutral
        - label: "Pilot"
          detail: "One lane or one workflow is connected first; integration work begins."
          tone: neutral
        - label: "Production"
          detail: "Core tracking and exception handling go live; operational value becomes visible."
          tone: positive
        - label: "Expansion"
          detail: "Customer adds yard, ocean, carrier, or customer-ops modules."
          tone: positive
        - label: "AI adoption"
          detail: "Digital workers and AI agents enter the workflow."
          tone: positive
        - label: "Renewal / lock-in"
          detail: "Embedded workflows, data network, and switching costs support retention."
          tone: positive

