company:
  name: FourKites
chapter:
  number: 8
  title: Valuation
  summary: >
    FourKites still looks like a plausible category winner, but the valuation case now depends on
    whether the company has converted that position into durable revenue quality and product
    expansion. The public evidence supports a wide valuation band rather than a single point
    estimate: the company could justify something close to its old $1B mark if growth and retention
    are strong, but it could also deserve a clear markdown if the business has only maintained its
    footprint through cost discipline. The right posture is conditional, not triumphant.
sections:
  - id: thesis-and-antithesis
    title: Thesis and Anti-Thesis
    body: >
      The bull case is straightforward: FourKites owns a large enterprise footprint, has a visible
      AI upsell narrative, and still appears to sit inside a workflow where switching costs are real.
      The bear case is equally straightforward: the company has not publicly disclosed the metrics
      that would let an outside investor tell whether the footprint is expanding efficiently or just
      being defended with more support effort. The valuation question therefore turns on evidence of
      revenue quality, not just revenue size. If the company is retaining and expanding customers
      with Loft and adjacent modules, it deserves a premium to generic logistics software. If it is
      mostly defending an old base, the multiple should compress toward public supply-chain SaaS
      peers.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]

  - id: valuation-context
    title: Valuation Context
    body: >
      FourKites' last public valuation anchor is the 2022 Series E at $1B. That number matters less
      as a target than as a reference point for what the market was willing to pay before SaaS
      multiples reset. Since then, the comp set has moved: profitable public supply-chain software
      has held up better than venture-backed private peers, and the market has become more demanding
      about growth efficiency. The important issue is whether FourKites looks more like the durable
      public names or the discounted private ones. The answer depends on the current ARR base,
      whether Loft is already producing incremental ACV, and how much of the customer story is
      concentrated in a narrow top-end ICP.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV003, TV004]

  - id: scenarios-and-entry-discipline
    title: Scenarios and Entry Discipline
    body: >
      A sensible investment view is to underwrite a range rather than a point estimate. The base
      case assumes a mid-teens growth path off a roughly $65M 2021 ARR anchor and modest AI uplift.
      The bull case requires Loft to become a real commercial wedge and for the company to continue
      expanding inside existing logos. The bear case is what happens if the customer base looks more
      static than it first appears and the company needs a valuation reset to match the new SaaS
      multiple regime. In that world, the best entry discipline is to make the price contingent on
      NRR, burn, and actual Loft deployments rather than paying purely for narrative.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: []

tables:
  - id: TV001
    title: Recommendation summary table
    description: Summary of the investment view, confidence, valuation stance, and the conditions that matter most.
    columns: ["Dimension", "Assessment", "Basis", "Key condition"]
    claimRefs: [CV001, CV010, CV011]
    enumerationScope:
      coverage: partial
      basis: "The recommendation is a modeled judgment built from public evidence; internal financial data would materially change it."
    notes: "This table is a decision summary, not a substitute for management-provided financial statements or cohort data."
    rows:
      - ["Overall recommendation", "Conditional proceed", "Good market position, but insufficient public financial detail", "Confirm NRR, burn, and Loft deployment count"]
      - ["Confidence", "Low to medium", "Strong product story; weak disclosed financial evidence", "Confidence improves with audited current numbers"]
      - ["Valuation stance", "Below or near prior reference", "Multiple compression and missing growth proof argue for caution", "Apply a valuation adjustment if growth is slower than management implies"]
      - ["Return profile", "Moderate if the bull case is true", "AI upsell and retained enterprise base can still create upside", "Price should reflect scenario probability, not best case"]
      - ["Risk rating", "High", "Financial opacity remains the dominant unknown", "Require hard evidence before paying a premium"]

  - id: TV002
    title: Thesis / anti-thesis table
    description: Direct comparison of the investment thesis and the strongest bear counterpoints.
    columns: ["Dimension", "Bull argument", "Bear counter", "Diligence gate"]
    claimRefs: [CV002, CV003, CV004, CV006, CV008]
    enumerationScope:
      coverage: partial
      basis: "The table covers the major public bull and bear arguments, but not every possible portfolio or channel scenario."
    notes: "Thesis and anti-thesis are intentionally simplified so the diligence gate is obvious."
    rows:
      - ["Market position", "Large enterprise footprint and category familiarity", "Footprint does not prove efficient growth", "Request logo growth and customer expansion rates"]
      - ["AI upsell", "Loft can raise ACV inside existing accounts", "AI can be a story before it is a revenue stream", "Request Loft contract count and incremental ACV"]
      - ["Moat", "Carrier and workflow data create switching costs", "Bundle pressure can erode price premium", "Request win/loss and retention by segment"]
      - ["Financial quality", "Near-zero burn discipline could support exit optionality", "Public metrics are missing, so discipline is unverified", "Request current burn and cash runway"]
      - ["Comparable valuation", "Best public comp outcomes still justify a solid multiple", "Private peers can reset quickly when growth slows", "Request current comp bridge and discount rationale"]

  - id: TV003
    title: Bull / base / bear scenario table
    description: Scenario range for ARR, valuation multiples, and implied enterprise value.
    columns: ["Scenario", "ARR estimate", "Multiple", "Implied value", "Probability"]
    claimRefs: [CV007, CV008, CV009, CV012]
    enumerationScope:
      coverage: partial
      basis: "Scenario values are modeled from public signals and benchmark multiples, not management guidance."
    notes: "The scenarios intentionally bracket the likely outcome rather than claim a precise forecast."
    rows:
      - ["Bull", "$170M+", "10-14x", "$1.7B-$2.8B", "25%"]
      - ["Base", "$120M-$140M", "7-9x", "$840M-$1.26B", "50%"]
      - ["Bear", "$85M-$95M", "4-6x", "$340M-$570M", "25%"]
      - ["Probability-weighted", "$125M", "about 7.5x", "$940M-$1.25B", "100%"]

  - id: TV004
    title: Comparable valuation table
    description: Public and private comparables that anchor the valuation range.
    columns: ["Company", "Type", "Revenue / ARR", "Multiple / mark", "Why it matters"]
    claimRefs: [CV005, CV006, CV010]
    enumerationScope:
      coverage: partial
      basis: "Comparable companies are selected for relevance to supply-chain software, not completeness across all logistics software."
    notes: "Comparable marks are directional and should be overwritten by diligence-grade comp analysis."
    rows:
      - ["Descartes", "Public comp", "Public revenue base", "Higher-quality public multiple", "Shows what mature supply-chain software can earn when profitable"]
      - ["E2open", "Public comp", "Public revenue base", "Discounted public multiple", "Shows how integration debt and weak efficiency compress value"]
      - ["project44", "Private peer", "Private ARR base", "Private market reset mark", "Shows private visibility peers can re-rate sharply"]
      - ["FourKites", "Target", "Modeled ARR", "Scenario range", "What the deal needs to clear under current conditions"]

figures:
