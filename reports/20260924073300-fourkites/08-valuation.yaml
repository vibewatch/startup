    title: Valuation scenario matrix
    type: matrix
    layout: wide
    summary: A compact view of how ARR, multiple, and implied value move across bear, base, and bull scenarios.
    description: Scenario matrix showing valuation sensitivity to ARR and multiple assumptions.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    data:
      columns: ["ARR", "Multiple", "Implied value"]
      rows:
        - label: "Bear"
          values: ["$85M-$95M", "4-6x", "$340M-$570M"]
        - label: "Base"
          values: ["$120M-$140M", "7-9x", "$840M-$1.26B"]
        - label: "Bull"
          values: ["$170M+", "10-14x", "$1.7B-$2.8B"]
        - label: "Reference price"
          values: ["$65M 2021 ARR anchor", "$1B 2022 reference", "Used only as a comparison point"]
        - label: "Entry discipline"
          values: ["NRR ≥100%", "Burn sustainable", "Loft deployment evidence"]
        - label: "Downside bound"
          values: ["Stagnant growth", "4-5x multiple", "Clear markdown risk"]
    approximationNotes: "This matrix is a scenario tool, not a forecast; the rows encode the main valuation states the public evidence supports."

