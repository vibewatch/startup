    columns: ["Metric", "Value / status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["ARR / revenue", "~$114M est. (2024 third-party)", "low", "Baseline revenue scale", "Request current ARR bridge"]
      - ["Gross margin", "Not public", "low", "Software leverage vs services / inference", "Request gross margin by product line"]
      - ["NRR", "Not public", "low", "Expansion quality", "Request cohort retention and upsell data"]
      - ["CAC payback", "Not public", "low", "Sales efficiency", "Ask for pipeline-to-close and payback"]
      - ["Runway", "Not public", "low", "Capital adequacy", "Ask for cash, burn, and budget plan"]
      - ["Headcount", "500+ official / 596 third-party", "medium", "Operating leverage proxy", "Confirm current employee count"]
    notes: "The table intentionally separates public facts from estimate-only inputs; none of the private metrics are disclosed by the company."
    claimRefs: [CI009, CI010, CI011, CI012]

