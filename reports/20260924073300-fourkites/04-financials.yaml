      - ["Partner / reseller motion", "Commercial terms undisclosed", "Partner ecosystem", "Geographic expansion", "Mitsui / APAC context"]
      - ["Strategic investment round", "Not operating revenue", "Investor", "Capital support", "Mitsui / FedEx / THL context"]
    notes: "Public pricing is not disclosed; this table is about monetization structure and who pays rather than list-price precision."
    claimRefs: [CI002, CI005, CI006, CI007]

  - id: TI003
