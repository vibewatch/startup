    title: Competitive Positioning Map
    type: quadrant
    layout: wide
    summary: >
      A six-vendor map showing breadth of platform scope against AI / innovation maturity. FourKites
      remains in the high-AI, visibility-to-execution quadrant, while suite vendors and hardware-heavy
      players cluster lower on AI maturity or broader on-suite breadth.
    approximationNotes: >
      Scores are ordinal estimates based on public product surfaces, analyst notes, and review content.
      The goal is to show directional position, not to imply a precise benchmark score.
    claimRefs: [CP001, CP005, CP006, CP008, CP009, CP010]
    data:
      xAxis: "Platform Breadth (Standalone RTTV=1 -> Full ERP/SCM Suite=10)"
      yAxis: "AI / Innovation Maturity (Rule-Based=1 -> Agent-First AI=10)"
      points:
