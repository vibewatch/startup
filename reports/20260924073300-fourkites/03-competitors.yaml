    notes: "Capability scores are ordinal and based on public product surfaces, analyst profiles, and review sites rather than live RFP scoring."
    claimRefs: [CP005, CP006, CP007, CP009, CP010]

  - id: TP003
    title: Pricing / packaging comparison
    columns: ["Vendor", "Public pricing", "Packaging style", "Implication", "Notes"]
