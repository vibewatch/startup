schemaVersion: "report-v2"
artifact: customers
slug: docplanner
runDate: 2026-10-22
company:
  name: Docplanner
chapter:
  number: 6
  title: Customers
  summary: Docplanner's customer evidence supports a two-sided healthcare marketplace serving patients and healthcare professionals, with a practice-management SaaS layer and localized brands. Public evidence demonstrates broad reach and several named operational deployments, but it does not establish current retention, paid conversion, or customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Docplanner serves two linked customer populations: patients who search for and book
      care, and healthcare professionals or institutions that pay for software, visibility,
      and practice workflow tools. The platform's local brands and country-by-country
      expansion support a segmented go-to-market rather than a single global product motion.
      The 2019 financing description says the SaaS tool helped doctors and clinics optimize
      patient flow, reduce no-shows, and digitize practice administration, while the
      2025 podcast describes SaaS for healthcare professionals as the main revenue source.
      These are credible descriptions of the commercial design, not proof of current
      segment-level revenue or willingness to pay. Buyer, user, and payer can differ within
      a clinic, and the public record does not disclose segment ARPU, procurement cycle,
      or conversion from free marketplace visibility to paid software.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption trajectory and named proof
    body: >-
      The evidence shows substantial historical and recent usage signals, but the metrics
      are not directly comparable because publishers use different dates, populations, and
      definitions. One 2019 company release reported 20 million patients, 325,000 monthly
      bookings, and more than five million listed professionals; a 2025 independent
      podcast described 110 million monthly users and 180,000 doctor clients; and a 2026
      company-profile source reported more than 20 million monthly bookings and 2.8 million
      healthcare professionals. Rather than treating these as a single growth series, the
      trajectory table preserves each source's metric and vintage. Named operational proof
      is stronger where a customer or implementation partner gives workflow outcomes:
      Flobotics describes an EHR integration across four markets, with 10,000+ monthly
      processes and 98% automated processing, while HubSpot documents multi-language
      inbound marketing use. These examples demonstrate deployments and outcomes for
      particular workflows, not company-wide retention or unit economics.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion
    title: Retention, expansion, and concentration diligence
    body: >-
      Docplanner's apparent expansion loop combines patient demand, professional visibility,
      scheduling and practice-management software, and additional local-market coverage.
      The Flobotics case describes automation being extended to new EHRs, facilities, and
      geographic markets, which is evidence of implementation extensibility in one
      deployment. The 2019 financing release also says the company had integrated
      competitors in Turkey and Spain and intended to pursue further acquisitions, but
      that is strategic history rather than proof of current customer expansion. Public
      sources do not provide net revenue retention, gross retention, logo churn, contract
      length, paid conversion, attach rate for Noa.ai, or top-customer revenue share.
      AInvest's 2026 analysis explicitly frames the AI repositioning as exposed to a
      value-delivery risk if the AI product does not create scalable customer value.
      The resulting customer thesis is positive on breadth and workflow depth but
      conditional on verification of cohort durability and concentration.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]

tables:
  - id: TU001
    title: Customer segmentation and commercial role
    columns: [Segment, Buyer/user/payer, Use case, Scale or strategic value, Diligence gap]
    rows:
      - [Patients, "User; generally not the disclosed software payer", "Provider discovery, reviews, appointment booking", "Demand-side liquidity and marketplace engagement", "Active-user definition, repeat booking, and monetization are not disclosed"]
      - [Independent healthcare professionals, "Buyer and user of SaaS/visibility tools", "Online presence, scheduling, patient-flow management, and reduced no-shows", "Core recurring SaaS customer population", "Paid conversion, ARPU, churn, and contract terms are not disclosed"]
      - [Clinics and healthcare institutions, "Institutional buyer; staff are users", "EHR integration, workflow automation, scheduling, and documentation", "Higher-complexity deployments can deepen workflow dependence", "Segment revenue, implementation time, and concentration are not disclosed"]
      - [Enterprise or large healthcare networks, "Organization buyer; clinicians and back office are users", "Multi-facility management and localized workflow software", "Potential expansion surface through integrations and facilities", "Procurement cycle, expansion rate, and renewal evidence are not disclosed"]
    notes: "Segments synthesize source-described users and use cases; public sources do not provide a complete customer census or segment revenue split."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or vintage, Source posture, Confidence, Implication, Missing denominator]
    rows:
      - ["Patients / monthly users", "20 million patients", "2019", "Company release reproduced by One Peak", "Medium", "Historical marketplace reach was material", "Active versus registered and repeat-use definitions"]
      - ["Monthly bookings", "325,000", "2019", "Company release reproduced by One Peak", "Medium", "Shows transaction activity at that vintage", "Geography, paid share, and booking completion"]
      - ["Monthly users and doctor clients", "110 million monthly users; 180,000 doctor clients", "2025-06-30", "Independent podcast", "Medium", "Indicates broad reported reach and professional supply", "Metric definitions, overlap, and reconciliation with other counts"]
      - ["Monthly bookings and listed professionals", "Over 20 million bookings; more than 2.8 million professionals", "2026", "Company-profile database", "Low", "Suggests continued platform scale if definitions are comparable", "Active versus listed professionals and booking period/definition"]
    notes: "Values are preserved as reported and are not a derived growth series; dates, populations, and definitions differ, so no CAGR or conversion rate is calculated."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or deployment, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Docplanner clinic network", "Clinics and healthcare back office", "RPA integration between Docplanner and legacy EHR systems", "Production deployment described after an MVP", "10,000+ processes automated monthly; 98% processed automatically", "Case study is supplied by implementation partner and covers one workflow"]
      - ["Docplanner marketing team", "Multi-market SaaS business", "HubSpot inbound marketing, smart content, and multilingual campaign templates", "Ongoing operational use described by product manager", "Templates could be cloned and translated to enter markets faster; segmentation supported tailored content", "Vendor case study does not disclose conversion, retention, or revenue impact"]
      - ["Docplanner patients and professionals", "Two-sided marketplace", "Booking marketplace plus practice-management tool", "Operating model described in independent coverage", "110 million monthly users and 180,000 doctor clients reported in June 2025", "Podcast is not a customer contract or independently audited usage report"]
    notes: "Enumeration is partial: it covers three publicly documented customer/deployment examples, not the full customer population; each row is supported by at least two retained sources where the source describes the underlying model or deployment."
    enumerationScope:
      coverage: partial
      basis: "Three named or specifically described deployments from retained 2019-2026 public sources; no complete customer roster is public."
    claimRefs: [CU006, CU009, CU010]

figures:
  - id: FU001
    title: Customer journey from discovery to workflow expansion
    type: journey-map
    summary: Docplanner's public evidence describes a journey from patient discovery and booking to provider workflow software and multi-market or multi-facility expansion.
    data:
      items:
        - id: discovery
          label: Patient discovery
          detail: "Patients search for providers and read reviews."
          touchpoints: ["Marketplace search", "Provider profiles", "Reviews"]
        - id: booking
          label: Booking
          detail: "Patients schedule appointments through the marketplace."
          touchpoints: ["Appointment booking", "Reminders", "Rescheduling and cancellation"]
        - id: provider-workflow
          label: Provider workflow
          detail: "Professionals and clinics use software to manage patient flow and practice administration."
          touchpoints: ["Scheduling", "Patient-flow management", "Practice digitization"]
        - id: integration
          label: Integration
          detail: "Clinic deployments connect local EHR systems and automate data movement."
          touchpoints: ["Legacy EHR interoperability", "Exception handling", "Back-office automation"]
        - id: expansion
          label: Expansion
          detail: "The described operating model extends to new facilities, markets, and localized brands."
          touchpoints: ["New EHRs", "New facilities", "New geographic markets"]
        - id: diligence
          label: Durability diligence
          detail: "Retention, renewal, and concentration evidence is required before treating reach as durable paid adoption."
          touchpoints: ["Cohort retention", "Renewal status", "Customer concentration"]
    claimRefs: [CU001, CU009, CU010, CU011]

callouts:
  - calloutType: strength
    title: Workflow depth is more probative than logos
    body: "The strongest public customer proof is a described workflow deployment: Flobotics reports 10+ EHR integrations across four markets, 10,000+ monthly automated processes, and 98% automatic processing."
    claimRefs: [CU009]
  - calloutType: risk
    title: Retention and concentration remain unverified
    body: "No retained source provides NRR, GRR, logo churn, contract duration, paid conversion, or top-customer revenue share; customer durability should therefore remain a central diligence gate."
    claimRefs: [CU012, CU013]
  - calloutType: assumption
    title: Usage counts are not a comparable time series
    body: "Reported patients, users, bookings, and professionals come from different publishers and vintages; they should not be combined into a growth rate without definitions and denominators."
    claimRefs: [CU005, CU006, CU007, CU008]

