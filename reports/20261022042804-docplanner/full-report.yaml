        blocks:
          - type: paragraph
            body: >-
              Mariusz Gralewski is identified as Docplanner's founder and chief executive in Bloomberg's January 2026
              interview and in the 2019 financing announcement. The assigned evidence names him consistently but does
              not provide a complete current executive roster, board composition, voting arrangements or succession
              plan. The 2019 One Peak announcement described a team of more than 1,000 employees, whereas the same
              source's company description referred to a team of 300, illustrating why headcount should be dated and
              source-qualified rather than carried forward as a single current number. Docplanner's own careers page
              confirms active functions spanning marketing and public relations, customer success and sales, IT, product
              and data, finance and administration, and human resources, but it does not establish leadership
              incumbents. Key-person dependence on Gralewski is therefore material for diligence, while formal
              governance and management depth remain open questions.
