              - CP003
              - CP006
              - CP011
              - CP014
      - number: '3.3'
        title: Distribution power, localization, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Current supplier-issued evidence describes meaningful distribution: Twilio reported more than 100 million
              monthly website visits, 22 million monthly bookings, and use by 300,000 doctors in March 2026. LeadIQ
              instead reports a network of more than 2.8 million healthcare professionals and more than 20 million
              monthly bookings. These figures use different denominators and should not be reconciled into one provider
              count. Built In's older assessment attributed differentiation to Docplanner's international-market growth,
              and the localized-brand and acquisition history supports a market-by-market distribution strategy.
              Workflow breadth plausibly raises switching friction once scheduling, documentation, communications, and
              financial operations are embedded, but public retention, churn, migration-cost, and multi-homing evidence
              is absent. The resulting moat case is strongest on distribution reach and workflow integration, not on
              measured contractual lock-in.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is not fully self-contained. Noa Booking runs on Twilio ConversationRelay and Programmable Voice,
              showing that a strategically important interface depends on external communications infrastructure even
              though Docplanner owns the healthcare workflow and localization. Twilio reports that doctors using the
              agent saw twice the bookings of traditional call-center users and that 1,300 doctors were onboarded in
              three days, but this is partner-issued proof without cohort definitions or independent replication. ARR
              Club's report of growth from EUR 50 million to EUR 275 million ARR is similarly uncorroborated in the
              assigned pool and should not be used as a peer benchmark. Large-system integration limitations, opaque
              pricing, heterogeneous competitors, and the possibility that communications or AI vendors enable modular
              internal builds all constrain durability. The investment case needs customer-level retention and win-loss
              evidence before marketplace scale can be translated into a defensible switching-cost moat.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP010
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated marketplace plus workflow software
            body: >-
              Multiple sources describe Docplanner as both a patient-demand marketplace and a provider workflow
              platform, a broader position than booking alone.
            calloutType: strength
            claimRefs:
              - CP001
              - CP008
          - type: callout
            title: Relative ranking is evidence-constrained
            body: >-
              The assigned evidence names peers but does not provide current, like-for-like pricing, retention,
              implementation, or capability data for them.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Docplanner monetizes two connected workflows rather than a single software seat: patients use a
              marketplace to discover and book care, while doctors and clinics can pay for software and visibility
              tools. A 2019 financing announcement describes the provider product as SaaS used to optimize patient flow,
              reduce no-shows, and digitize practice administration (CI006). The same announcement reported 20 million
              patients, 325,000 monthly bookings, more than 5 million listed healthcare professionals, and operations in
              30 countries at that time (CI006). More recent third-party pages describe over 20 million monthly bookings
              across 13 markets (CI005) and 2.8 million healthcare professionals (CI004), while another tracker reports
              $290 million of ARR as of July 2026 (CI003). These figures are not directly comparable because the sources
              use different dates, populations, and definitions; the ARR figure is not independently audited in the
              retained evidence. The commercial model therefore has plausible cross-sell economics, but the public
              record does not establish conversion, retention, realized pricing, or segment mix.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
