  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic model
        blocks:
          - type: paragraph
            body: >-
              Docplanner's addressable market is not one homogeneous healthcare software category. The observable
              boundary includes patient-facing discovery, reviews and appointment booking, plus paid practice-management
              software for providers. The provider side includes scheduling, patient-flow management, reminders, online
              presence, documentation and related workflow functions; the integration guide shows that third-party
              medical software providers can synchronize appointment slots and bookings through a REST API. The company
              therefore sells into provider operating budgets while creating patient demand on a marketplace. The
              included spend is provider software and demand-generation spend tied to booking and workflow; excluded
              spend includes clinical care, insurance reimbursement, general-purpose hospital information systems and
              consumer health activity unrelated to provider acquisition or scheduling. Status-quo substitutes are
              phone-based scheduling, manual administrative work, provider-owned websites, local directories and
              internally built practice software. This boundary matters because marketplace reach and SaaS monetization
              are related but not interchangeable units.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a triangulated sizing approach rather than a single TAM assertion. A
              historical supply-and-demand lens reports 20 million patients and 325,000 monthly bookings in 2019, while
              later secondary pages report materially larger platform activity and a 2026 ARR estimate; these figures
              are not directly comparable because their dates, definitions and issuer quality differ. A
              provider-workflow lens is supported by the company's stated SaaS use cases and by the API's restricted
              access for medical software providers, indicating a workflow-integration market rather than only a listing
              marketplace. Geographic expansion and acquisitions can widen the reachable market, while local brands,
              healthcare trust, compliance, switching costs and integration authorization constrain the rate at which
              nominal demand becomes paid revenue. The 2019 financing announcement explicitly tied proceeds to continued
              penetration in Europe and Latin America, product development, hiring and potential acquisitions; that is
              evidence of the intended growth vector, not proof of market size or unit economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM014
      - number: '2.3'
        title: Buyers, adoption path, and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              The principal paying customer is a healthcare professional, clinic or institution buying software and
              visibility; the patient is the marketplace user, and the provider or clinic budget owner controls
              adoption. The likely adoption path is discovery of provider demand, conversion to scheduling and
              patient-flow tooling, then deeper workflow integration where authorized APIs and operational value justify
              switching. Public evidence supports this mechanism, but it does not disclose segment-level pricing, attach
              rates, paid conversion, retention, customer acquisition cost, or incremental margins. Nor does it provide
              a comparable geography-by-segment denominator from which to calculate SAM or SOM. The market should
              therefore be underwritten as a set of testable provider and patient workflows, not as the full value of
              digital health. The next diligence step is to obtain cohort-level revenue, provider counts by country and
              product, contract sizes, retention, and the share of booking volume that is monetized.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is evidence of reach, not a SAM
            body: >-
              Docplanner's reported patient, professional and booking figures show platform reach, but the sources do
              not establish the monetized subset, geography-specific spend, or conversion from marketplace usage to
              provider software revenue.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
          - type: callout
            title: Market conversion remains the key diligence risk
            body: >-
              The market thesis depends on converting local healthcare demand into recurring provider software revenue,
