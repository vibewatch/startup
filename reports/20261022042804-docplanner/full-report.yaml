      - number: '3.2'
        title: Capability breadth, buyer fit, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Docplanner is documented across patient discovery and reviews, online booking, practice administration,
              telehealth, and patient engagement. Historical reporting also describes the dual marketplace-and-cloud-
              software model, while Twilio's 2026 release adds evidence of a voice agent for booking, confirmations, and
              planned insurance-verification workflows. This breadth can reduce the number of tools a smaller practice
              needs, but it is not universal: SectorPunk explicitly considers the product less relevant for large
              hospital systems requiring deep HIS or EHR integration. Comparative capability cells remain unknown where
              the assigned pool contains only a competitor name. Pricing is even less decision-ready. SectorPunk
              displays "$100-$150" and "Min: $50,000+" while calling pricing mid-range, but does not define the billing
              unit, market, package, or contract term; it cannot be treated as verified list pricing or realized
              revenue.
            claimRefs:
