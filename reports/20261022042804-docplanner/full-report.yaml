  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternative set
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative set is wider than online-booking marketplaces. Built In identified Zocdoc and
              Doctolib as direct peers in 2019, while Multiples currently places NexHealth, Heidi Health, Phreesia, and
              several other public and private businesses in a broader comparable set. Those lists establish relevant
              names, not product equivalence: the pool does not contain current peer product documentation sufficient to
              normalize geography, customer segment, workflow breadth, or revenue model. Hospitals can also choose
              incumbent HIS or EHR workflows, and practices can retain call centers or assemble scheduling and
              communications components internally. Docplanner itself has historically used mergers and acquisitions,
              including Doctoralia and later jameda and TuoTempo, to consolidate local demand and add capabilities. The
              landscape is therefore a mix of direct marketplace rivalry, adjacent workflow software, institutional
              incumbents, and internal-build substitutes rather than a single homogeneous software category.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP014
