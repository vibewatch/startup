      - number: '4.2'
        title: Cost structure and capital dependency
        blocks:
          - type: paragraph
            body: >-
              The disclosed use of funds points to a cost base shaped by sales, customer success, product, R&D,
              legal/compliance, marketing, and acquisitions. In 2019, Docplanner said the €80 million Series E would
              fund market penetration, product development, hiring, and potential bolt-on acquisitions, while the
              company had surpassed 1,000 employees and was hiring for nearly 100 roles (CI006). A contemporaneous
              financing report likewise said the funds would accelerate SaaS rollout and R&D and expand commercial and
              support teams (CI007). By contrast, the independent Unquote account reported that Docplanner was not
              generating significant free cash and needed to raise capital for growth; it also reported PLN 67 million
              turnover and PLN 15 million EBITDA for the Polish ZnanyLekarz business, not the consolidated group (CI011,
              CI012). A company news tracker states that the group reached EBITDA profitability in 2025 (CI005), but no
              retained source provides consolidated cash, burn, debt maturities, working capital, capex, or runway.
              Profitability may improve capital adequacy, but it does not remove financing and execution diligence needs
              without current consolidated accounts.
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI006
              - CI008
              - CI015
      - number: '4.3'
        title: Underwriting verdict and missing inputs
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a diversified revenue mechanism with a large installed marketplace and
              provider-software footprint, but it does not support a precise valuation or forecast. Multiples records a
              $1 billion September 2021 valuation and approximately $139 million raised across seven rounds (CI008);
              Unquote independently reported a 2021 round at a unicorn valuation while noting that the amount raised was
              undisclosed and that sources expected another financing (CI010). These sources support financing history
              and valuation context, not current equity value or cash available. Public pricing, customer-level contract
              terms, CAC, payback, gross margin, net revenue retention, churn, ARPU, attach rate for Noa, debt
              obligations, and consolidated cash remain unverified in this pool. The financial stance is therefore
              research-more: the operating model is credible and potentially increasingly efficient, but underwriting
              should wait for reconciled segment revenue, cohort retention, contribution margin, cash-flow, and
              capitalization-table evidence.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The highest-value next step is a reconciled financial pack rather than another headline traction estimate.
              Management should provide monthly recurring and non-recurring revenue by marketplace, subscriptions, and
              enterprise products; bridge bookings and provider activity to recognized revenue; and show gross margin by
              product and geography. The pack should also include cohort retention, paid-provider conversion, CAC and
              payback by channel, support and service-delivery costs, consolidated EBITDA-to-cash conversion, working
              capital, capex, debt facilities and maturities, and current cash runway. The retained sources provide
              enough evidence to formulate these requests, but not enough to answer them: company-issued announcements
              describe intended investment and operating metrics, while third-party databases disagree on scale and do
              not expose underlying methods.
            claimRefs:
              - CI003
              - CI008
              - CI010
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diversified monetization surface
            body: >-
              The marketplace and provider-software combination gives Docplanner more than one path to monetize patient
              demand and workflow adoption, although the mix is not disclosed.
            calloutType: strength
            claimRefs:
              - CI001
              - CI006
              - CI008
          - type: callout
            title: Cash conversion remains the blocker
            body: >-
              A third-party 2021 financing account described significant free-cash-generation needs, while current
              retained evidence does not provide consolidated cash, burn, debt, or runway.
