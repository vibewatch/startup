  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              The product is best understood as a two-sided healthcare workflow platform rather than only an appointment
              directory. Public descriptions identify patient discovery, appointment booking, reminders, telemedicine,
              messaging, intake, provider calendars, patient records, billing, and integrations. Docplanner's own
              integration guide documents a REST API with standard GET, POST, PUT, PATCH, and DELETE methods and offers
              PHP and .NET client libraries. That is concrete evidence of an integration surface, while the external
              feature inventory adds practice-management and communication capabilities. The evidence does not show
              which modules are generally available in every market, which are paid tiers, or how Noa.ai is integrated
              into production workflows. Maturity should therefore be described as established at the platform and API
              surface, with module-level availability and AI adoption still requiring verification.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
      - number: '5.2'
        title: Workflow, integrations, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The observable operating model links patient acquisition to provider scheduling and then to communications
              and practice administration. The API guide says access is limited to medical software providers and that
              resources are authorized individually by each customer, which implies controlled partner provisioning
              rather than an unrestricted public API. Vonage's customer case describes SMS, WhatsApp, video, two-factor
              authentication, reminders, surveys, and appointment summaries, and says Docplanner used Vonage to move
              across channels and maintain delivery flexibility. These sources support a layered architecture of
              marketplace, provider workflow, integration/API, and communications services. A third-party profile
              reports AWS and Hetzner hosting in Germany, but the evidence does not disclose data schemas, deployment
              topology, service-level objectives, failover design, or measurable delivery and uptime performance. Those
              omissions matter because healthcare workflows are sensitive to missed messages, scheduling errors, and
              privacy controls.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE008
              - CE011
              - CE013
      - number: '5.3'
        title: Differentiation, dependencies, and trust gaps
        blocks:
          - type: paragraph
            body: >-
              Docplanner's defensibility appears to come from the combination of marketplace demand, provider workflow
              depth, local operating footprint, and integrations rather than from a disclosed proprietary algorithm or
              hardware asset. One Peak describes ongoing product development, legal/compliance hiring, and potential
              acquisitions; that is a strategic priority statement, not proof of shipped technical differentiation. The
              Vonage case provides partner-reported evidence of a decade-long dependency and rapid use of video during
              the pandemic, but also highlights the risk of relying on an external communications layer. Public sources
              in this pool do not establish independent penetration testing, certifications, incident history, clinical
              safety controls, data-retention policy, or support SLAs. A diligence process should request those
              artifacts before treating the product as low-risk infrastructure.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE008
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Technology exhibits
        blocks:
          - type: paragraph
            body: >-
              The architecture exhibit separates documented product layers from assumptions. It shows only components
              supported by the retained sources and labels the external communications dependency explicitly. The
              accompanying tables preserve the distinction between an observed capability, a company or partner claim,
              and an unanswered diligence question. This separation is important for a healthcare platform because a
              documented API method is not the same as a tested production control, and a partner case is not an
              independent reliability benchmark. The exhibit therefore provides a traceable operating hypothesis, while
              the evidence gaps identify the artifacts needed to confirm implementation quality, security posture, and
              current module coverage.
            claimRefs:
              - CE002
              - CE006
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow depth is visible
            body: >-
              The product surface spans patient acquisition, booking, provider operations, integrations, and
              communications rather than a single scheduling feature.
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE006
          - type: callout
            title: Trust evidence is thinner than feature evidence
            body: >-
              Public materials describe capabilities and partner integrations, but do not establish current security
              certifications, reliability metrics, or incident controls.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
              - CE014
          - type: callout
            title: Request technical diligence artifacts
            body: >-
              Underwriting should require API reliability and versioning data, security and privacy attestations,
              incident history, retention controls, and evidence of module-level adoption before assigning a low
              technical-risk assessment.
            calloutType: recommendation
            claimRefs:
              - CE006
              - CE008
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Docplanner serves two linked customer populations: patients who search for and book care, and healthcare
              professionals or institutions that pay for software, visibility, and practice workflow tools. The
              platform's local brands and country-by-country expansion support a segmented go-to-market rather than a
              single global product motion. The 2019 financing description says the SaaS tool helped doctors and clinics
              optimize patient flow, reduce no-shows, and digitize practice administration, while the 2025 podcast
              describes SaaS for healthcare professionals as the main revenue source. These are credible descriptions of
              the commercial design, not proof of current segment-level revenue or willingness to pay. Buyer, user, and
              payer can differ within a clinic, and the public record does not disclose segment ARPU, procurement cycle,
              or conversion from free marketplace visibility to paid software.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The evidence shows substantial historical and recent usage signals, but the metrics are not directly
              comparable because publishers use different dates, populations, and definitions. One 2019 company release
              reported 20 million patients, 325,000 monthly bookings, and more than five million listed professionals; a
              2025 independent podcast described 110 million monthly users and 180,000 doctor clients; and a 2026
              company-profile source reported more than 20 million monthly bookings and 2.8 million healthcare
              professionals. Rather than treating these as a single growth series, the trajectory table preserves each
              source's metric and vintage. Named operational proof is stronger where a customer or implementation
              partner gives workflow outcomes: Flobotics describes an EHR integration across four markets, with 10,000+
              monthly processes and 98% automated processing, while HubSpot documents multi-language inbound marketing
              use. These examples demonstrate deployments and outcomes for particular workflows, not company-wide
              retention or unit economics.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Retention, expansion, and concentration diligence
        blocks:
          - type: paragraph
            body: >-
              Docplanner's apparent expansion loop combines patient demand, professional visibility, scheduling and
              practice-management software, and additional local-market coverage. The Flobotics case describes
              automation being extended to new EHRs, facilities, and geographic markets, which is evidence of
              implementation extensibility in one deployment. The 2019 financing release also says the company had
              integrated competitors in Turkey and Spain and intended to pursue further acquisitions, but that is
              strategic history rather than proof of current customer expansion. Public sources do not provide net
              revenue retention, gross retention, logo churn, contract length, paid conversion, attach rate for Noa.ai,
              or top-customer revenue share. AInvest's 2026 analysis explicitly frames the AI repositioning as exposed
              to a value-delivery risk if the AI product does not create scalable customer value. The resulting customer
              thesis is positive on breadth and workflow depth but conditional on verification of cohort durability and
              concentration.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow depth is more probative than logos
            body: >-
              The strongest public customer proof is a described workflow deployment: Flobotics reports 10+ EHR
              integrations across four markets, 10,000+ monthly automated processes, and 98% automatic processing.
            calloutType: strength
            claimRefs:
              - CU009
          - type: callout
            title: Retention and concentration remain unverified
            body: >-
              No retained source provides NRR, GRR, logo churn, contract duration, paid conversion, or top-customer
              revenue share; customer durability should therefore remain a central diligence gate.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
          - type: callout
            title: Usage counts are not a comparable time series
            body: >-
              Reported patients, users, bookings, and professionals come from different publishers and vintages; they
              should not be combined into a growth rate without definitions and denominators.
            calloutType: assumption
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Docplanner's risk profile is shaped by the combination of a two-sided healthcare marketplace and provider
              workflow software. A 2026 SWOT assessment identifies inconsistent monetization across regions, difficulty
              integrating with legacy hospital EMR/EHR systems, high overhead across many markets, and limited deep
              clinical capability as weaknesses; it also identifies privacy and healthcare compliance cost, cyberattacks
              against sensitive health data, well-funded rivals, and macroeconomic pressure on clinic software budgets
              as threats. A separate technology overview says the platform operates across 13 countries and supports
              patient discovery, booking, communication, documentation, and financial operations, while launching an AI
              assistant in 2024. These facts make the most important monitoring questions operational: whether regional
              integrations and controls remain consistent, whether AI features are governed for healthcare use, and
              whether provider monetization offsets the cost of maintaining a broad footprint.

              A thesis break should be tied to observable events rather than assumed absence of incidents. A material
              privacy or security event, an enforcement action or failed certification, repeated outages or failed
              integrations that impair bookings or clinical workflows, or a measurable deterioration in provider
              retention or monetization would weaken the investment case. Public sources do not establish current values
              for those indicators; they support a monitoring framework, not a claim that no such event has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              Healthcare data creates a higher control burden than a generic scheduling marketplace. The risk source
              explicitly names increasing data privacy and healthcare compliance costs, and warns that cyberattacks
              could target sensitive patient health data. The technology source describes a broad workflow that includes
              documentation and financial operations, and says Docplanner operates across 13 countries. Geographic
              breadth therefore increases the number of legal and operational regimes whose requirements must be mapped,
              monitored, and evidenced, although the retained public material does not identify a current regulator,
              license, certification, lawsuit, or breach.

              AI adds a distinct layer of exposure. The 2026 SWOT assessment identifies bias, inaccurate AI-driven
              medical advice, sudden regulatory shifts affecting patient data, and clinician or patient resistance as
              threats to an AI roadmap. Those are scenario risks from an AI-generated analysis, not evidence of an
              incident. The diligence priority is a control inventory covering lawful data use, model validation, human
              escalation, audit logs, vendor contracts, and incident response for each product and jurisdiction. Without
              those records, residual regulatory exposure should remain high even where no public enforcement record was
              found in the assigned pool.
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.3'
        title: Operating, partner, and financial resilience
        blocks:
          - type: paragraph
            body: >-
              Integration and scale create execution risk. The retained SWOT identifies legacy EMR/EHR integration
              difficulty and high operational overhead across dozens of markets, while the same assessment describes
              rivalry from Doctolib and Zocdoc and substitution by general search or basic calendars. The 2019 financing
              announcement says funds were intended for continued market penetration, product development, hiring,
              legal/compliance, marketing, and potential bolt-on acquisitions, and that the company had already
              integrated competitors in Turkey and Spain. This supports a dependency thesis around successful
              integrations, local operating teams, and disciplined post-acquisition execution; it does not prove current
              integration quality or the absence of execution misses.

              Financial resilience is also difficult to underwrite from the retained evidence. Historical reporting
              records approximately EUR 130 million raised by 2019 while a 2026 company overview labels revenue as
              projected and says recent investment occurred, but also warns that its AI-generated findings are not
              independently verified. A private-comps source reports a last disclosed USD 1 billion valuation and
              historical rounds, but current valuation, debt terms, cash runway, covenants, and segment margins are not
              established by the source set. The appropriate mitigation is current financing and operating diligence,
              not treating funding raised as cash available.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Residual exposure and diligence plan
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high-risk, research-more posture rather than a finding of a realized failure.
              Independent-style summaries describe a large healthcare network and competitive position, but several
              retained pages are analyst or company-sponsored summaries and mix historical and projected figures. The
              most decision-relevant gaps are current privacy and security controls, regulatory posture by market,
              incident and outage history, integration reliability, provider retention, customer concentration, current
              debt and liquidity, and the economics of AI products. These gaps matter because they determine whether
              scale is a durable moat or a cost and compliance multiplier.

              Monitoring should use explicit thresholds: a reportable privacy or security incident; an enforcement
              notice, material claim, or failed audit; repeated service or integration failures affecting booking or
              practice workflows; a sustained fall in provider retention or monetization; or financing terms that
              materially constrain product investment. Until those indicators and mitigations are evidenced, residual
              exposure remains material even though the assigned sources do not substantiate a current incident.
            claimRefs:
              - CR005
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR011
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The core risk is control opacity at scale
            body: >-
              Docplanner's geographic and workflow breadth makes privacy, integration, reliability, and financial
              controls investment-critical, but the assigned public evidence does not expose the current control
              inventory or operating thresholds.
            calloutType: risk
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR015
          - type: callout
            title: Make current-control diligence a gating item
            body: >-
              Before upgrading the thesis, obtain current legal, security, reliability, retention, concentration,
              liquidity, debt, and AI-governance evidence and test it against the thesis-break indicators in this
              chapter.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not buy or pass. Two independent databases identify the latest
              disclosed valuation as $1 billion in September 2021, but that historical mark is not evidence of
              Docplanner's current price or enterprise value. The retained evidence also says current control and
              valuation are unverified and reports a 2025 debt commitment, making equity value sensitive to debt draw,
              seniority, liquidation preferences, and any structured financing terms. None of those terms is visible in
              the public source set. Consequently, confidence is medium-low, risk is high, and the valuation stance is
              indeterminate. An investor should advance only to a data-room and term-sheet review, then underwrite
              returns from the actual fully diluted entry price rather than anchoring on the stale unicorn mark.
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Docplanner combines meaningful marketplace activity with provider workflow software
              across a broad geographic footprint. Company-issued 2025 data reports 18.7 million monthly bookings and
              3.7 million healthcare professionals, while LeadIQ describes operations across 13 countries. ARR Club's
              $290 million ARR figure dated July 2026, if validated, would indicate substantial monetization at scale.
              The anti-thesis is evidence quality and capital-structure opacity: the ARR page exposes neither audited
              financial statements nor calculation methodology, the public valuation is five years old, and current
              control is explicitly described as unverified by one retained analyst source. The view improves only with
              audited recurring revenue, retention, gross margin, cash-flow, debt, and cohort evidence tied to the same
              reporting period.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Financing history and comparables
        blocks:
          - type: paragraph
            body: >-
              Funding totals are not clean enough to treat as cash available or a cap-table proxy. Tracxn reports $141
              million across eight rounds, Multiples reports $139 million across seven rounds, and One Peak said the May
              2019 Series E brought cumulative funding to approximately €130 million. These figures use different
              currencies, dates, and apparent round-count conventions, so they should remain separate rather than be
              reconciled into an invented total. Multiples also lists revenue multiples of 1.5x for Phreesia and 5.2x
              for B-Soft, but it does not establish business-model, growth, margin, geography, or period comparability
              sufficient to select a Docplanner multiple. Dividing a 2021 valuation by a 2026 ARR estimate would mix
              noncontemporaneous observations and would not produce a defensible current valuation.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenarios are deliberately qualitative because public evidence cannot support precise valuation ranges
              or probability percentages. A bull case requires the reported ARR and platform scale to reconcile to
              audited revenue, durable retention, attractive margins, and financing without punitive senior claims. The
              base case is that the company has real scale but its price remains unassessable until current terms and
              operating quality are disclosed. The bear case combines a stale valuation anchor, unverified current
              control, possible debt overhang, weak retention, or compliance costs, making a value below the 2021 mark
              plausible but not quantifiable. Exit readiness is likewise unresolved: investors should obtain the cap
              table, preference stack, debt schedule and covenants, audited financials, NRR and churn, governance
              rights, and management's credible liquidity path before setting target return, hold period, or exit value.
            claimRefs:
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more; do not anchor on the unicorn mark
            body: >-
              Require a current term sheet, fully diluted cap table, preference waterfall, debt schedule, audited ARR
              and revenue bridge, NRR, churn, gross margin, and cash-flow profile before setting an entry valuation or
              target return.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
