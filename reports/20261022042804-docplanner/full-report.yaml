chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Docplanner began in Poland in 2012 as an online doctor-appointment booking platform and has expanded into
              a two-sided healthcare marketplace plus software provider for clinicians and clinics. Bloomberg describes
              the company as connecting 100 million monthly users with 2.8 million medical professionals in January
              2026, while Docplanner's own site reports 25 million appointments booked last month, 100 million monthly
              patient visits, and 300,000 active doctors. Those company figures use different populations and
              denominators from Bloomberg's reported user and professional counts, so they should not be treated as
              directly interchangeable. The product model combines patient discovery, reviews and booking with provider
              tools for scheduling, patient flow, online presence and clinic operations. Current headquarters reporting
              is inconsistent: historical and financial sources place the operating center in Warsaw, while a 2026
              third-party profile places headquarters in Amsterdam. The company remains privately held and current
              revenue, ARR and customer-account counts are not independently disclosed in the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
