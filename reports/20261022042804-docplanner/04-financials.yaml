    title: Revenue model bridge
    type: flow
    summary: "Docplanner's public operating model links patient demand to provider software and ultimately to marketplace, subscription, and enterprise revenue, with margin and cash conversion still unverified."
    data:
      nodes:
        - id: patients
          label: Patient discovery and booking
          detail: "Public sources report booking activity, but periods and definitions differ."
        - id: provider-demand
          label: Provider demand and visibility
          detail: "Providers use marketplace presence and patient-acquisition tools."
        - id: software
          label: Practice-management SaaS
          detail: "Scheduling, patient flow, reminders, documentation, and administration."
        - id: enterprise
          label: Institutional workflows
          detail: "Enterprise and facility software is reported, but mix is undisclosed."
        - id: revenue
          label: Revenue
          detail: "Commission and subscription mechanisms are reported; realized pricing is unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Gross margin and service-delivery costs are not publicly reconciled."
      edges:
        - [patients, provider-demand]
        - [provider-demand, software]
        - [software, enterprise]
        - [provider-demand, revenue]
        - [software, revenue]
        - [enterprise, revenue]
        - [revenue, gross-profit]
    approximationNotes: "This is a mechanism map, not a proportional financial forecast; no unsupported conversion rates or values are inferred."
    claimRefs: [CI001, CI002, CI006, CI008, CI015, CI016]
callouts:
  - calloutType: strength
    title: "Diversified monetization surface"
    body: "The marketplace and provider-software combination gives Docplanner more than one path to monetize patient demand and workflow adoption, although the mix is not disclosed."
    claimRefs: [CI001, CI006, CI008]
  - calloutType: risk
    title: "Cash conversion remains the blocker"
    body: "A third-party 2021 financing account described significant free-cash-generation needs, while current retained evidence does not provide consolidated cash, burn, debt, or runway."
    claimRefs: [CI010, CI011, CI014]
  - calloutType: recommendation
    title: "Require a reconciled financial pack"
    body: "Before underwriting, reconcile ARR, bookings, recognized revenue, contribution margin, retention, cash flow, debt, and capitalization across the marketplace, SaaS, and enterprise businesses."
    claimRefs: [CI003, CI008, CI015, CI016]
