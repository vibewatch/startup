company:
  name: Docplanner
chapter:
  number: 4
  title: Financials
  summary: "Docplanner has a multi-sided monetization model spanning patient acquisition and practice-management software, with public indicators of scale and a 2025 EBITDA-profitability announcement. The underwriting case remains constrained by inconsistent third-party metrics, limited disclosure of recurring revenue quality and unit economics, and evidence that growth historically depended on external capital."
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: "Docplanner monetizes two connected workflows rather than a single software seat: patients use a marketplace to discover and book care, while doctors and clinics can pay for software and visibility tools. A 2019 financing announcement describes the provider product as SaaS used to optimize patient flow, reduce no-shows, and digitize practice administration (CI006). The same announcement reported 20 million patients, 325,000 monthly bookings, more than 5 million listed healthcare professionals, and operations in 30 countries at that time (CI006). More recent third-party pages describe over 20 million monthly bookings across 13 markets (CI005) and 2.8 million healthcare professionals (CI004), while another tracker reports $290 million of ARR as of July 2026 (CI003). These figures are not directly comparable because the sources use different dates, populations, and definitions; the ARR figure is not independently audited in the retained evidence. The commercial model therefore has plausible cross-sell economics, but the public record does not establish conversion, retention, realized pricing, or segment mix."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure-and-capital
    title: Cost structure and capital dependency
    body: "The disclosed use of funds points to a cost base shaped by sales, customer success, product, R&D, legal/compliance, marketing, and acquisitions. In 2019, Docplanner said the €80 million Series E would fund market penetration, product development, hiring, and potential bolt-on acquisitions, while the company had surpassed 1,000 employees and was hiring for nearly 100 roles (CI006). A contemporaneous financing report likewise said the funds would accelerate SaaS rollout and R&D and expand commercial and support teams (CI007). By contrast, the independent Unquote account reported that Docplanner was not generating significant free cash and needed to raise capital for growth; it also reported PLN 67 million turnover and PLN 15 million EBITDA for the Polish ZnanyLekarz business, not the consolidated group (CI011, CI012). A company news tracker states that the group reached EBITDA profitability in 2025 (CI005), but no retained source provides consolidated cash, burn, debt maturities, working capital, capex, or runway. Profitability may improve capital adequacy, but it does not remove financing and execution diligence needs without current consolidated accounts."
    claimRefs: [CI006, CI007, CI011, CI012, CI013, CI014]
    tableRefs: [TI002]
  - id: underwriting-verdict
    title: Underwriting verdict and missing inputs
    body: "The evidence supports a diversified revenue mechanism with a large installed marketplace and provider-software footprint, but it does not support a precise valuation or forecast. Multiples records a $1 billion September 2021 valuation and approximately $139 million raised across seven rounds (CI008); Unquote independently reported a 2021 round at a unicorn valuation while noting that the amount raised was undisclosed and that sources expected another financing (CI010). These sources support financing history and valuation context, not current equity value or cash available. Public pricing, customer-level contract terms, CAC, payback, gross margin, net revenue retention, churn, ARPU, attach rate for Noa, debt obligations, and consolidated cash remain unverified in this pool. The financial stance is therefore research-more: the operating model is credible and potentially increasingly efficient, but underwriting should wait for reconciled segment revenue, cohort retention, contribution margin, cash-flow, and capitalization-table evidence."
    claimRefs: [CI008, CI009, CI010, CI015, CI016]
    tableRefs: [TI003]
  - id: diligence-asks
    title: Diligence priorities
    body: "The highest-value next step is a reconciled financial pack rather than another headline traction estimate. Management should provide monthly recurring and non-recurring revenue by marketplace, subscriptions, and enterprise products; bridge bookings and provider activity to recognized revenue; and show gross margin by product and geography. The pack should also include cohort retention, paid-provider conversion, CAC and payback by channel, support and service-delivery costs, consolidated EBITDA-to-cash conversion, working capital, capex, debt facilities and maturities, and current cash runway. The retained sources provide enough evidence to formulate these requests, but not enough to answer them: company-issued announcements describe intended investment and operating metrics, while third-party databases disagree on scale and do not expose underlying methods."
    claimRefs: [CI003, CI008, CI010, CI015, CI016]
    tableRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or public signal, Current value/status, Quality and diligence ask]
    rows:
      - [Patient marketplace, "Patient discovery, reviews, and appointment booking", "Bookings / visitors", "20M+ monthly bookings reported for 2026; older source reported 325,000 monthly bookings", "Conflicting periods and definitions; reconcile gross bookings to recognized revenue"]
      - [Provider SaaS, "Practice workflow, patient flow, reminders, and administration tools", "Subscription / provider account", "Mechanism publicly described; realized pricing undisclosed", "Company-issued description; obtain price book, paid conversion, churn, and cohort gross margin"]
      - [Enterprise healthcare software, "Institutional workflow tools including TuoTempo suite", "Contract / facility", "Product presence reported; revenue mix undisclosed", "Verify contract value, implementation cost, renewals, and concentration"]
      - [Visibility and marketing, "Provider presence and patient acquisition services", "Listing / lead or subscription", "Included in marketplace and software model; list versus realized price unknown", "Separate advertising, subscription, and commission revenue in the revenue bridge"]
    notes: "Sources describe the mechanisms but do not disclose a consolidated segment revenue split; older and newer activity metrics are not interchangeable."
    claimRefs: [CI001, CI002, CI004, CI005, CI006]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or term, Public evidence, Value, Confidence, Diligence ask]
    rows:
      - [List pricing, "No official price schedule retained in the assigned pool", null, low, "Obtain current country and product price books"]
      - [Realized ARPU, "No customer-level revenue or provider count bridge", null, low, "Reconcile billed revenue to paid providers and cohorts"]
      - [Commission economics, "Marketplace booking mechanism described; rate not disclosed", null, low, "Provide take rate, refunds, payment costs, and channel split"]
      - [Contract model, "Commission and subscription model reported by Multiples", "Commission plus subscription", medium, "Validate product-level contract terms, minimums, discounts, and renewal clauses"]
    notes: "Official product descriptions establish mechanisms, not realized prices or unit economics; null values are evidence gaps rather than zeroes."
    claimRefs: [CI001, CI006, CI008, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "$290M reported July 2026 by ARR.Club", low, "Indicates recurring-revenue scale if definition is reliable", "Provide audited ARR bridge, exclusions, FX policy, and segment split"]
      - [Gross margin, "Not publicly reconciled in retained sources", low, "Determines software versus service leverage", "Provide gross margin by product and geography with cost allocation"]
      - [Net revenue retention, null, low, "Tests expansion and retention of provider accounts", "Provide cohort NRR, logo churn, and contraction by segment"]
      - [Cash and runway, null, low, "Determines financing dependency and downside resilience", "Provide current cash, monthly burn, debt schedule, and runway"]
      - [Consolidated free cash flow, null, low, "Separates EBITDA profitability from cash generation", "Provide audited cash-flow statement and EBITDA-to-cash bridge"]
    notes: "The assigned evidence contains headline ARR and profitability claims but no consolidated accounts; nulls identify specific underwriting requests."
    claimRefs: [CI003, CI005, CI010, CI011, CI013, CI014, CI015, CI016]
