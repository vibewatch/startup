  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Lens, Publisher / year, Geography, Value or observed scale, Methodology, Confidence, Limitation]
    rows:
      - [Historical marketplace activity, "One Peak / May 2019", "Operations on 4 continents; Europe and Latin America emphasis", "325,000 bookings per month", "Investor-issued financing announcement reporting a company metric", "Low", "Conflicts with the 1.5 million monthly bookings reported for the same financing period"]
      - [Historical marketplace activity, "Multiples.vc / May 2019", "15 countries", "1.5 million bookings per month", "Third-party compilation of the Series E operating snapshot", "Low", "Conflicts with the One Peak release; source methodology is not disclosed"]
      - [Historical provider supply, "Edgepedia / 2019", "15 countries reported at Series E", "More than 2 million healthcare professionals listed", "Secondary compilation of company and press reporting", "Low", "Definition and date may differ from later platform counts"]
      - [Current platform activity, "LeadIQ / 2026 page", "13 countries", "More than 2.8 million professionals; over 20 million bookings monthly", "Company profile aggregation", "Low", "No revenue, spend or monetized-share denominator"]
      - [Revenue-scale proxy, "ARR.Club / 2026", "Global healthcare platform; Europe and LATAM", "$290M ARR", "Third-party database estimate", "Low", "Methodology and recurring-revenue definition are not disclosed"]
      - [Provider workflow reach, "Docplanner Integrations / current", "API customers; geography not specified", "REST API; access limited to authorized medical software providers", "Primary technical documentation", "High", "Describes capability, not market size or adoption"]
    notes: "Values are not additive and are not a funnel: they use different populations, dates, units and issuer methods. The two May 2019 booking figures conflict and remain unreconciled; ARR is not treated as total market value."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015, CM016]
  - id: TM003
    title: Buyer, user, payer and adoption map
    columns: [Segment, Buyer, User, Payer / budget owner, Workflow, Adoption trigger]
    rows:
      - [Independent clinician, "Clinician or practice manager", "Clinician and patients", "Practice operating budget", "Profile, booking, reminders and scheduling", "Need for patient acquisition and lower administrative load"]
      - [Multi-provider clinic, "Clinic manager or operations lead", "Staff, clinicians and patients", "Clinic / group operating budget", "Patient flow, scheduling and communication", "Need to coordinate capacity and reduce no-shows"]
      - [Large institution, "Operations, IT or digital-health lead", "Staff and patients", "Institutional software budget", "Workflow integration and booking synchronization", "Integration and process-standardization need"]
      - [Medical software provider, "Product or engineering owner", "Integrated provider customers", "Software product budget", "Authorized API synchronization of slots and bookings", "Customer demand for connected scheduling"]
    notes: "Segmentation is evidence-constrained synthesis from documented product capabilities and API access; public sources do not disclose contract counts or pricing by segment."
    claimRefs: [CM010, CM011, CM012]
