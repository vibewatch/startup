      - [Practice-management SaaS, "Scheduling, patient flow, reminders and practice administration", "General-purpose ERP and unrelated hospital IT", "Doctors, clinics and institutions", "Primary recurring software monetization"]
      - [Workflow integrations, "Authorized synchronization of slots and bookings", "Unconnected medical software and unauthorized access", "Medical software provider or customer", "Raises switching cost and workflow depth"]
