company:
  name: Docplanner
chapter:
  number: 5
  title: Product & Technology
  summary: Docplanner combines a patient-facing healthcare marketplace with provider workflow software, communications, and integrations. Public evidence shows a REST API, SDKs, multi-channel messaging, and a third-party report of German hosting, but the assigned sources do not establish internal architecture, security certifications, reliability statistics, or current roadmap execution.
sections:
  - id: product-surface
    title: Product surface and maturity
    body: >-
      The product is best understood as a two-sided healthcare workflow platform rather than
      only an appointment directory. Public descriptions identify patient discovery, appointment
      booking, reminders, telemedicine, messaging, intake, provider calendars, patient records,
      billing, and integrations. Docplanner's own integration guide documents a REST API with
      standard GET, POST, PUT, PATCH, and DELETE methods and offers PHP and .NET client libraries.
      That is concrete evidence of an integration surface, while the external feature inventory
      adds practice-management and communication capabilities. The evidence does not show which
      modules are generally available in every market, which are paid tiers, or how Noa.ai is
      integrated into production workflows. Maturity should therefore be described as established
      at the platform and API surface, with module-level availability and AI adoption still
      requiring verification.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001]
  - id: workflow-architecture
    title: Workflow, integrations, and operating architecture
    body: >-
      The observable operating model links patient acquisition to provider scheduling and then
      to communications and practice administration. The API guide says access is limited to
      medical software providers and that resources are authorized individually by each customer,
      which implies controlled partner provisioning rather than an unrestricted public API.
      Vonage's customer case describes SMS, WhatsApp, video, two-factor authentication, reminders,
      surveys, and appointment summaries, and says Docplanner used Vonage to move across channels
      and maintain delivery flexibility. These sources support a layered architecture of
      marketplace, provider workflow, integration/API, and communications services. A third-party
      profile reports AWS and Hetzner hosting in Germany, but the evidence does not disclose data
      schemas, deployment topology, service-level objectives, failover design, or measurable
      delivery and uptime performance. Those omissions matter because healthcare workflows are
      sensitive to missed messages, scheduling errors, and privacy controls.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: differentiation-and-trust
    title: Differentiation, dependencies, and trust gaps
    body: >-
      Docplanner's defensibility appears to come from the combination of marketplace demand,
      provider workflow depth, local operating footprint, and integrations rather than from a
      disclosed proprietary algorithm or hardware asset. One Peak describes ongoing product
      development, legal/compliance hiring, and potential acquisitions; that is a strategic
      priority statement, not proof of shipped technical differentiation. The Vonage case
      provides partner-reported evidence of a decade-long dependency and rapid use of video
      during the pandemic, but also highlights the risk of relying on an external communications
      layer. Public sources in this pool do not establish independent penetration testing,
      certifications, incident history, clinical safety controls, data-retention policy, or
      support SLAs. A diligence process should request those artifacts before treating the
      product as low-risk infrastructure.
    claimRefs: [CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: technology-exhibits
    title: Technology exhibits
    body: >-
      The architecture exhibit separates documented product layers from assumptions. It shows
      only components supported by the retained sources and labels the external communications
      dependency explicitly. The accompanying tables preserve the distinction between an
      observed capability, a company or partner claim, and an unanswered diligence question.
      This separation is important for a healthcare platform because a documented API method is
      not the same as a tested production control, and a partner case is not an independent
      reliability benchmark. The exhibit therefore provides a traceable operating hypothesis,
      while the evidence gaps identify the artifacts needed to confirm implementation quality,
      security posture, and current module coverage.
    claimRefs: [CE002, CE006, CE011]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Primary user, Public maturity signal, Differentiation or role, Diligence gap]
    rows:
      - [Patient marketplace, Patients, "Publicly described and operating across multiple markets", "Discovery, reviews, and appointment booking", "Market-by-market availability and conversion are undisclosed"]
      - [Practice-management suite, Doctors and clinics, "Publicly described SaaS offering", "Patient flow, scheduling, reminders, and practice digitization", "Paid packaging, workflow depth, and realized outcomes require evidence"]
      - [Communications layer, Patients and providers, "Partner case documents production use", "SMS, WhatsApp, video, surveys, and appointment summaries", "Delivery SLAs, fallback design, and incident metrics are undisclosed"]
      - [REST API and SDKs, Medical software providers, "Documentation and PHP/.NET libraries are available", "Customer-authorized synchronization and integration workflows", "API versioning, quotas, schema coverage, and uptime are undisclosed"]
    notes: "Based on the Docplanner API guide, Tech-from-Europe profile, and Vonage customer case; maturity labels describe public evidence, not independent product testing."
    claimRefs: [CE001, CE002, CE003, CE006, CE007]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Docplanner solution, Measurable benefit or signal, Limitation]
    rows:
      - [Find care, Compare providers and availability, Marketplace search, Booking and reviews are publicly described, Current funnel conversion is not disclosed]
      - [Schedule care, Select and manage appointments, Calendars and booking workflows, API and practice-management functions support scheduling, Error rates and utilization are not disclosed]
      - [Reduce missed visits, Remind patients and confirm appointments, SMS and WhatsApp messaging, Partner case reports reminders and improved reach, No independently verified no-show effect is provided]
      - [Deliver remote care, Communicate by video or chat, Vonage Video and Messages APIs, Partner case describes rapid pandemic deployment, Clinical workflow controls and resilience are not disclosed]
    notes: "Rows synthesize documented use cases; the benefit column retains source qualifications and does not convert partner-reported outcomes into independently verified KPIs."
    claimRefs: [CE004, CE007, CE008, CE009, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - [Marketplace, Patient discovery and booking, Provider listings and availability data, Listing quality and supply freshness are not publicly measured]
      - ["Provider workflow", "Scheduling, records, billing, and practice administration", "Provider adoption and local operating processes", "Module adoption and workflow completion are undisclosed"]
      - ["Integration API", "Synchronize resources and bookings with medical software", "Customer-authorized access", "Versioning, quotas, and access-control evidence are needed"]
      - ["Communications", "Reminders, messaging, video, and summaries", "Vonage APIs and multi-channel providers", "Vendor concentration, delivery failures, and fallback controls require diligence"]
      - ["Data and trust controls", "Sensitive healthcare interaction data", "A third-party profile reports AWS and Hetzner hosting in Germany", "Configuration, certifications, retention, testing, and incident history are unverified"]
    notes: "Architecture is an evidence-bounded operating model, not an assertion of Docplanner's internal software topology; unspecified controls remain diligence gaps."
    claimRefs: [CE006, CE008, CE011, CE012, CE013]
figures:
  - id: FE001
    title: Documented product architecture map
    type: stack
    summary: Public evidence supports a layered marketplace and provider workflow product with an API and external communications services.
    data:
      layers:
        - label: Patient experience
          detail: "The patient-facing discovery and booking surface documented by external product profiles."
          items:
            - label: Discovery and booking
              detail: "Marketplace search, reviews, and appointment booking."
        - label: Provider workflow
          detail: "Provider-facing workflow capabilities described in product and partner sources."
          items:
            - label: Practice management
              detail: "Scheduling, patient flow, reminders, records, billing, and related workflow features are publicly described."
        - label: Integration layer
          detail: "Documented developer-facing synchronization surface."
          items:
            - label: REST API
              detail: "Customer-authorized API resources with standard HTTP methods; PHP and .NET libraries are documented."
        - label: Communications
          detail: "Multi-channel patient and provider communication capabilities."
          items:
            - label: Messaging and video
              detail: "SMS, WhatsApp, video, two-factor authentication, surveys, and appointment summaries are described in a partner case."
        - label: External dependency
          detail: "A named third-party service dependency reported by the partner case."
          items:
            - label: Vonage APIs
              detail: "Partner-reported communications infrastructure used by Docplanner for multi-channel delivery."
        - label: Unverified controls
          detail: "Important technical controls not established by the assigned public evidence."
          items:
            - label: Security and reliability controls
              detail: "Hosting providers are reported, but configuration, certifications, penetration testing, retention, failover, uptime, and incident history are not established."
    claimRefs: [CE001, CE006, CE008, CE011, CE013]
callouts:
  - calloutType: strength
    title: Workflow depth is visible
    body: The product surface spans patient acquisition, booking, provider operations, integrations, and communications rather than a single scheduling feature.
    claimRefs: [CE002, CE004, CE006]
  - calloutType: risk
    title: Trust evidence is thinner than feature evidence
    body: Public materials describe capabilities and partner integrations, but do not establish current security certifications, reliability metrics, or incident controls.
    claimRefs: [CE011, CE013, CE014]
  - calloutType: recommendation
    title: Request technical diligence artifacts
    body: Underwriting should require API reliability and versioning data, security and privacy attestations, incident history, retention controls, and evidence of module-level adoption before assigning a low technical-risk assessment.
    claimRefs: [CE006, CE008, CE013, CE014]
