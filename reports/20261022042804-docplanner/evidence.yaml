evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Current capitalization table, liquidation preferences, debt agreements, covenants, maturities and secondary
      transaction records.
    whyItMatters: >-
      Headline valuation and historical funding do not reveal dilution, control, downside protection or cash
      obligations.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, debt schedules, lender consents and board-approved financing
      model under confidentiality.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Audited current revenue or ARR, net revenue retention, churn, customer counts, ARPU and segment margins.
    whyItMatters: Marketplace traffic and provider counts cannot substitute for monetization, retention or unit-economics evidence.
    diligencePath: >-
      Obtain a reconciled KPI pack by country, provider segment and product line with definitions, cohort periods and
      audit support.
    relatedQuestionRefs:
      - QO002
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: Authoritative current legal headquarters and operating-location record.
    whyItMatters: >-
      Assigned sources place the company in Warsaw, Amsterdam or a Warsaw-origin/Amsterdam-headquartered structure,
      affecting legal and governance interpretation.
    diligencePath: >-
      Verify the registered entity, parent company, legal address and principal operating offices from corporate records
      and current filings.
    relatedQuestionRefs:
      - QO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete current executive, board and investor roster with roles and ownership.
    whyItMatters: Key-person dependence and control cannot be assessed from a founder reference and careers functions alone.
    diligencePath: Request an organization chart, board minutes or governance summary, and current shareholder schedule.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Independent records of litigation, regulatory actions, data incidents, layoffs or material leadership churn.
    whyItMatters: >-
      The adverse search returned only a Bloomberg strategy article, so absence of a recorded event is not evidence that
      no event occurred.
    diligencePath: >-
      Run a jurisdiction-by-jurisdiction legal, regulatory, sanctions, privacy and employment search and obtain
      management representations.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current, independently defined market denominator for provider software and online healthcare booking by country
      and customer segment.
    whyItMatters: Reach and ARR proxies cannot establish SAM, SOM or the share of category spend that Docplanner can monetize.
    diligencePath: >-
      Obtain country-level provider counts, software spend benchmarks, addressable segment definitions and a
      reconciliation to Docplanner's active customer base.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: >-
      Provider pricing, contract values, attach rate, paid conversion, retention and contribution margins by product and
      geography.
    whyItMatters: >-
      These metrics determine whether broad marketplace usage converts into durable recurring revenue and valuation
      support.
    diligencePath: >-
      Request cohort revenue and retention data, bookings-to-paid conversion, ARPU, CAC and gross-margin detail under
      confidentiality.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: sizing
    missingEvidence: A reconciled metric dictionary for reported patients, professionals, bookings and ARR across 2019-2026 sources.
    whyItMatters: The reported values use different dates, populations and methods and should not be trended as one series.
    diligencePath: Ask Docplanner to define each KPI, period, geography and whether it is monthly, annualized, registered or active.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current rate cards, packaging, discount schedules, contract terms, and realized prices for Docplanner and direct
      peers.
    whyItMatters: Buyer economics and price-based differentiation cannot be compared from undefined third-party price tokens.
    diligencePath: >-
      Obtain anonymized recent contracts and request matched quotes from Docplanner, Zocdoc, Doctolib, and relevant
      workflow vendors.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-capabilities
    missingEvidence: >-
      Current first-party product documentation and implementation evidence for each named direct and adjacent
      competitor.
    whyItMatters: A name-only comparable set cannot establish feature parity, segment overlap, or displacement risk.
    diligencePath: Collect current product, security, integration, and customer-reference materials for every shortlisted competitor.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Gross and net retention, churn reasons, migration effort, multi-homing rates, and win-loss data by market and
      customer segment.
    whyItMatters: Workflow breadth and marketplace scale do not by themselves prove durable contractual or behavioral lock-in.
    diligencePath: >-
      Review cohort retention and cancellation data, interview churned clinics, and inspect recent competitive win-loss
      records.
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current consolidated cash, burn, debt facilities, maturities, and runway.
    whyItMatters: >-
      Historical financing evidence indicates capital needs, but current liquidity cannot be inferred from funding
      raised or EBITDA claims.
    diligencePath: >-
      Obtain the latest management accounts, bank statements, debt schedule, covenant package, and 24-month cash
      forecast.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cohort retention, paid-provider conversion, CAC, payback, ARPU, and contribution margin by product.
    whyItMatters: >-
      The marketplace and SaaS model may scale differently, so headline bookings or ARR cannot substitute for customer
      economics.
    diligencePath: Request cohort-level revenue and customer tables reconciled to the general ledger for the last 24 months.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: traction
    missingEvidence: A common metric dictionary and reconciled time series for bookings, patients, providers, revenue, and ARR.
    whyItMatters: >-
      The retained sources report materially different activity levels and periods, creating a risk of mixing gross
      platform activity with recognized revenue.
    diligencePath: Ask management to define each metric, period, geography, and denominator and provide source-system extracts.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Current API uptime, latency, error budgets, incident history, message delivery rates, and failover test results.
    whyItMatters: Healthcare scheduling and communications depend on reliable, time-sensitive service behavior.
    diligencePath: >-
      Request the latest API SLO dashboard, incident register, disaster-recovery test evidence, and vendor delivery
      reports.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: trust
    missingEvidence: >-
      Current security and privacy attestations, penetration-test summaries, certifications, retention schedules, and
      breach disclosures.
    whyItMatters: The platform handles sensitive healthcare interactions and communications.
    diligencePath: Obtain the security package, DPA, subprocessors list, audit reports, and incident-response policy under NDA.
    relatedQuestionRefs:
      - QE007
  - type: stale
    severity: material
    topic: roadmap
    missingEvidence: >-
      Current evidence for Noa.ai production adoption, module availability, roadmap delivery, and market-by-market
      feature coverage.
    whyItMatters: >-
      The strongest roadmap and AI evidence in the pool is historical or directory-reported and may not reflect current
      execution.
    diligencePath: >-
      Request a dated product roadmap, release notes, module attach/adoption metrics, and representative customer
      deployments.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Cohort-level NRR, GRR, logo churn, renewal rates, contract duration, and segment-level expansion data.
    whyItMatters: Broad reach and named deployments do not establish whether paid customers renew or expand economically.
    diligencePath: >-
      Request monthly cohort retention schedules, renewal logs, churn reasons, contract terms, and expansion revenue by
      customer segment.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-deployment
    missingEvidence: A complete, independently verifiable customer and deployment roster with production status and outcomes.
    whyItMatters: >-
      Public case studies may overrepresent successful partner implementations and cannot establish customer
      concentration.
    diligencePath: >-
      Obtain a referenceable customer list, production/pilot status, ARR bands, deployment dates, and permission to
      contact representative customers.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer revenue share, channel dependence, procurement cycle, and geographic concentration.
    whyItMatters: A broad user count can coexist with a concentrated paying base or dependence on particular markets and partners.
    diligencePath: >-
      Request customer concentration schedules, revenue by geography and vertical, channel-sourced bookings, and
      largest-account renewal status.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: blocking
    topic: legal-status
    missingEvidence: Current regulator, court, licensing, certification, privacy, and IP records for each operating jurisdiction.
    whyItMatters: >-
      The platform handles healthcare-related workflows across multiple countries, so unknown legal posture can create
      material fines, remediation cost, or product restrictions.
    diligencePath: >-
      Obtain counsel disclosure, regulator and court searches, certification reports, DPA inventory, and a
      jurisdiction-by-jurisdiction compliance matrix.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR002
  - type: access-blocked
    severity: material
    topic: cybersecurity
    missingEvidence: >-
      Current incident history, penetration-test summary, security certifications, recovery objectives, and material
      vendor dependencies.
    whyItMatters: A security or availability failure could affect sensitive data, bookings, provider workflows, and trust.
    diligencePath: >-
      Request the current security pack, incident register, audit reports, recovery tests, and cloud/vendor
      concentration schedule.
    relatedQuestionRefs:
      - QR002
      - QR007
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: >-
      Current cap table, debt terms, cash forecast, covenants, preference stack, margins, retention, and concentration
      metrics.
    whyItMatters: >-
      Historical funding and a prior valuation do not establish liquidity, downside protection, or resilience under
      slower growth.
    diligencePath: >-
      Request current management accounts, cohort and retention data, cap table, debt schedule, covenant package, and
      24-month cash plan.
    relatedQuestionRefs:
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: >-
      Product-level AI risk classification, validation, human oversight, data provenance, and performance monitoring for
      Noa.ai and planned tools.
    whyItMatters: >-
      AI errors or biased outputs in healthcare workflows could create liability, regulatory exposure, and reputational
      damage.
    diligencePath: >-
      Review model cards, validation results, human escalation design, audit logs, data processing terms, and
      post-launch monitoring.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current fully diluted cap table, share price, liquidation preferences, debt draw, covenants, security, maturity,
      and repayment schedule.
    whyItMatters: >-
      Senior claims and dilution determine common-equity value and can invalidate a headline enterprise-value
      comparison.
    diligencePath: >-
      Request the signed term sheet, cap table, debt agreements, covenant compliance certificates, and a preference
      waterfall from management and counsel.
    relatedQuestionRefs:
      - QV005
  - type: missing-source
    severity: material
    topic: operating-quality
    missingEvidence: >-
      Audited ARR definition, revenue bridge, NRR, churn, gross margin, EBITDA, cash flow, and country-level cohort
      performance for a common period.
    whyItMatters: The quality and durability of recurring revenue determine an appropriate valuation method and downside protection.
    diligencePath: >-
      Reconcile audited financial statements to the ARR bridge and inspect monthly customer cohorts, renewals,
      expansion, cancellations, and contribution margins.
    relatedQuestionRefs:
      - QV002
      - QV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Board-approved liquidity plan, audit readiness, governance controls, banker feedback, and credible strategic-buyer
      or public-market pathway.
    whyItMatters: >-
      Without an evidenced exit path, target return, hold period, and terminal multiple cannot be responsibly
      underwritten.
    diligencePath: >-
      Interview the board and CFO, review audit history and governance materials, and obtain documented liquidity
      alternatives with timing and prerequisites.
    relatedQuestionRefs:
      - QV009
