artifact: valuation
slug: docplanner
runDate: 2026-10-22
company:
  name: Docplanner
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence does not support a current priced recommendation: the latest disclosed
    valuation is a $1 billion September 2021 mark, while a 2026 ARR estimate is not accompanied
    by audited statements or methodology. The appropriate stance is research-more with high
    risk and indeterminate valuation until current financing terms, debt, retention, margins,
    and cap-table economics are disclosed.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The recommendation is research-more, not buy or pass. Two independent databases identify
      the latest disclosed valuation as $1 billion in September 2021, but that historical mark
      is not evidence of Docplanner's current price or enterprise value. The retained evidence
      also says current control and valuation are unverified and reports a 2025 debt commitment,
      making equity value sensitive to debt draw, seniority, liquidation preferences, and any
      structured financing terms. None of those terms is visible in the public source set.
      Consequently, confidence is medium-low, risk is high, and the valuation stance is
      indeterminate. An investor should advance only to a data-room and term-sheet review, then
      underwrite returns from the actual fully diluted entry price rather than anchoring on the
      stale unicorn mark.
    claimRefs: [CV001, CV002, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Docplanner combines meaningful marketplace activity with provider
      workflow software across a broad geographic footprint. Company-issued 2025 data reports
      18.7 million monthly bookings and 3.7 million healthcare professionals, while LeadIQ
      describes operations across 13 countries. ARR Club's $290 million ARR figure dated July
      2026, if validated, would indicate substantial monetization at scale. The anti-thesis is
      evidence quality and capital-structure opacity: the ARR page exposes neither audited
      financial statements nor calculation methodology, the public valuation is five years old,
      and current control is explicitly described as unverified by one retained analyst source.
      The view improves only with audited recurring revenue, retention, gross margin, cash-flow,
      debt, and cohort evidence tied to the same reporting period.
    claimRefs: [CV006, CV007, CV008, CV009, CV015]
    tableRefs: [TV002]
  - id: financing-history-and-comparables
    title: Financing history and comparables
    body: >-
      Funding totals are not clean enough to treat as cash available or a cap-table proxy.
      Tracxn reports $141 million across eight rounds, Multiples reports $139 million across
      seven rounds, and One Peak said the May 2019 Series E brought cumulative funding to
      approximately €130 million. These figures use different currencies, dates, and apparent
      round-count conventions, so they should remain separate rather than be reconciled into an
      invented total. Multiples also lists revenue multiples of 1.5x for Phreesia and 5.2x for
      B-Soft, but it does not establish business-model, growth, margin, geography, or period
      comparability sufficient to select a Docplanner multiple. Dividing a 2021 valuation by a
      2026 ARR estimate would mix noncontemporaneous observations and would not produce a
      defensible current valuation.
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV012, CV013]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      The scenarios are deliberately qualitative because public evidence cannot support precise
      valuation ranges or probability percentages. A bull case requires the reported ARR and
      platform scale to reconcile to audited revenue, durable retention, attractive margins, and
      financing without punitive senior claims. The base case is that the company has real scale
      but its price remains unassessable until current terms and operating quality are disclosed.
      The bear case combines a stale valuation anchor, unverified current control, possible debt
      overhang, weak retention, or compliance costs, making a value below the 2021 mark plausible
      but not quantifiable. Exit readiness is likewise unresolved: investors should obtain the
      cap table, preference stack, debt schedule and covenants, audited financials, NRR and churn,
      governance rights, and management's credible liquidity path before setting target return,
      hold period, or exit value.
    claimRefs: [CV006, CV007, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
