  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence boundary, What would change the view]
    rows:
      - [Thesis, "Large booking activity", "Company reports 18.7M monthly bookings for 2025.", "Reconcile bookings to paid customers, take rate, and audited revenue."]
      - [Thesis, "Provider network and geographic breadth", "Company reports 3.7M professionals; LeadIQ reports 13 countries.", "Show active, paying, and retained provider cohorts by country."]
      - [Thesis, "Potential recurring-revenue scale", "ARR Club reports $290M ARR dated July 2026 without disclosed methodology.", "Provide audited ARR definition, revenue bridge, NRR, churn, and gross margin."]
      - [Anti-thesis, "Stale and opaque valuation context", "The disclosed $1B mark dates to September 2021.", "Provide current fully diluted price, cap table, preferences, and recent secondary or financing evidence."]
      - [Anti-thesis, "Potential senior-capital overhang", "A retained analyst source reports a 2025 debt commitment.", "Provide drawn balance, maturity, covenants, security, interest, and repayment plan."]
    notes: "Company metrics are company-issued; third-party ARR and debt signals are not substitutes for audited financial or legal documents."
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Reported ARR and platform scale validate; retention and margins are durable; financing is clean.", "A premium to the historical $1B mark is supportable only after current audited metrics and terms validate; no public numeric range.", "ARR methodology, execution, compliance, and exit-window risk.", "Audited cohort evidence and an arm's-length financing without punitive preferences."]
      - [Base, "Scale is real, but operating quality and current capital terms remain undisclosed.", "No defensible public valuation range or target return; price from the actual term sheet and fully diluted ownership.", "Debt draw, dilution, preference stack, margin, and retention uncertainty.", "Complete data-room reconciliation with stable cohorts and manageable senior claims."]
      - [Bear, "ARR is overstated or low quality; retention or margins disappoint; debt or preferences impair common equity.", "Value below the September 2021 $1B reference is plausible but cannot be quantified from public evidence.", "Down round, multiple compression, compliance costs, and delayed liquidity.", "Weak audited conversion, churn, covenant pressure, or structured financing."]
    notes: "Scenarios are directional, not forecasts; no probability percentages or precise valuation ranges are assigned because current audited inputs and financing terms are unavailable."
    claimRefs: [CV001, CV002, CV006, CV007, CV013, CV014, CV015, CV016]
