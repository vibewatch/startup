callouts:
  - calloutType: recommendation
    title: Research more; do not anchor on the unicorn mark
    body: >-
      Require a current term sheet, fully diluted cap table, preference waterfall, debt schedule,
      audited ARR and revenue bridge, NRR, churn, gross margin, and cash-flow profile before
      setting an entry valuation or target return.
    claimRefs: [CV013, CV014, CV015, CV016]
