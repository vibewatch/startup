      - ["Heidi Health", "Adjacent private comparable / potential entrant", "Multiples lists USD 50M revenue and a USD 901M valuation", "Healthcare software comparison set", "Included by a private-markets data provider", "Assigned pool does not establish like-for-like scope"]
      - ["HIS / EHR incumbent", "Institutional incumbent and substitute", "Not quantified", "Large hospital systems", "Deep institutional integration can supersede a marketplace-led buying case", "No named incumbent or benchmark in assigned pool"]
      - ["Manual call center and internal scheduling", "Status quo / internal build", "Docplanner operated call centers in several markets before voice automation", "Practices retaining existing phone and scheduling workflows", "Avoids migration to an integrated vendor", "Total cost, service levels, and switching behavior are unavailable"]
      - ["Communications-platform-enabled build", "Internal-build enabler / modular substitute", "Twilio supplies the underlying global voice infrastructure used by Noa Booking", "Larger providers able to integrate communications components", "Offers modular infrastructure rather than a complete healthcare marketplace", "Implementation economics and buyer adoption are not disclosed"]
    notes: "Partial landscape assembled only from the assigned evidence pool; peer metrics have different vintages and definitions, and named alternatives are not assumed to be like-for-like."
    claimRefs: [CP002, CP004, CP005, CP006, CP011, CP013, CP014]
