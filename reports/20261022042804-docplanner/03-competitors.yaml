schemaVersion: "report-v2"
artifact: competitors
slug: docplanner
runDate: 2026-10-22
company:
  name: Docplanner
chapter:
  number: 3
  title: Competitors
  summary: >-
    Docplanner's best-evidenced competitive advantage is the combination of a
    scaled patient marketplace with practice-management workflows, localized
    brands, and newer voice-AI functionality. The assigned evidence identifies
    direct peers and broader comparables, but current peer capabilities,
    contract pricing, retention, and switching-cost data are too sparse for a
    definitive relative ranking.
sections:
  - id: competitive-landscape
    title: Competitive landscape and alternative set
    body: >-
      The buyer's alternative set is wider than online-booking marketplaces.
      Built In identified Zocdoc and Doctolib as direct peers in 2019, while
      Multiples currently places NexHealth, Heidi Health, Phreesia, and several
      other public and private businesses in a broader comparable set. Those
      lists establish relevant names, not product equivalence: the pool does
      not contain current peer product documentation sufficient to normalize
      geography, customer segment, workflow breadth, or revenue model.
      Hospitals can also choose incumbent HIS or EHR workflows, and practices
      can retain call centers or assemble scheduling and communications
      components internally. Docplanner itself has historically used mergers
      and acquisitions, including Doctoralia and later jameda and TuoTempo, to
      consolidate local demand and add capabilities. The landscape is
      therefore a mix of direct marketplace rivalry, adjacent workflow
      software, institutional incumbents, and internal-build substitutes rather
      than a single homogeneous software category.
    claimRefs: [CP009, CP011, CP012, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-pricing
    title: Capability breadth, buyer fit, and pricing opacity
    body: >-
      Docplanner is documented across patient discovery and reviews, online
      booking, practice administration, telehealth, and patient engagement.
      Historical reporting also describes the dual marketplace-and-cloud-
      software model, while Twilio's 2026 release adds evidence of a voice agent
      for booking, confirmations, and planned insurance-verification
      workflows. This breadth can reduce the number of tools a smaller practice
      needs, but it is not universal: SectorPunk explicitly considers the
      product less relevant for large hospital systems requiring deep HIS or
      EHR integration. Comparative capability cells remain unknown where the
      assigned pool contains only a competitor name. Pricing is even less
      decision-ready. SectorPunk displays "$100-$150" and "Min: $50,000+" while
      calling pricing mid-range, but does not define the billing unit, market,
      package, or contract term; it cannot be treated as verified list pricing
      or realized revenue.
    claimRefs: [CP001, CP002, CP003, CP006, CP008]
    tableRefs: [TP002, TP003]
  - id: distribution-and-switching
    title: Distribution power, localization, and switching costs
    body: >-
      Current supplier-issued evidence describes meaningful distribution:
      Twilio reported more than 100 million monthly website visits, 22 million
      monthly bookings, and use by 300,000 doctors in March 2026. LeadIQ instead
      reports a network of more than 2.8 million healthcare professionals and
      more than 20 million monthly bookings. These figures use different
      denominators and should not be reconciled into one provider count.
      Built In's older assessment attributed differentiation to Docplanner's
      international-market growth, and the localized-brand and acquisition
      history supports a market-by-market distribution strategy. Workflow
      breadth plausibly raises switching friction once scheduling,
      documentation, communications, and financial operations are embedded,
      but public retention, churn, migration-cost, and multi-homing evidence is
      absent. The resulting moat case is strongest on distribution reach and
      workflow integration, not on measured contractual lock-in.
    claimRefs: [CP004, CP005, CP012, CP013, CP015]
  - id: durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The moat is not fully self-contained. Noa Booking runs on Twilio
      ConversationRelay and Programmable Voice, showing that a strategically
      important interface depends on external communications infrastructure
      even though Docplanner owns the healthcare workflow and localization.
      Twilio reports that doctors using the agent saw twice the bookings of
      traditional call-center users and that 1,300 doctors were onboarded in
      three days, but this is partner-issued proof without cohort definitions
      or independent replication. ARR Club's report of growth from EUR 50
      million to EUR 275 million ARR is similarly uncorroborated in the
      assigned pool and should not be used as a peer benchmark. Large-system
      integration limitations, opaque pricing, heterogeneous competitors, and
      the possibility that communications or AI vendors enable modular
      internal builds all constrain durability. The investment case needs
      customer-level retention and win-loss evidence before marketplace scale
      can be translated into a defensible switching-cost moat.
    claimRefs: [CP002, CP006, CP007, CP010, CP016]
callouts:
  - calloutType: strength
    title: Integrated marketplace plus workflow software
    body: >-
      Multiple sources describe Docplanner as both a patient-demand marketplace
      and a provider workflow platform, a broader position than booking alone.
    claimRefs: [CP001, CP008]
  - calloutType: risk
    title: Relative ranking is evidence-constrained
    body: >-
      The assigned evidence names peers but does not provide current,
      like-for-like pricing, retention, implementation, or capability data for
      them.
    claimRefs: [CP003, CP011, CP014]
