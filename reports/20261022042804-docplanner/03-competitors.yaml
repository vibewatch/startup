      - ["Patient discovery and reviews", "Supported across marketplace sources", "Unknown in assigned pool", "Unknown in assigned pool", "Fragmented manual or web discovery"]
      - ["Online appointment booking", "Supported", "Category association only; current depth unknown", "Unknown in assigned pool", "Phone-based scheduling remains an alternative"]
      - ["Practice scheduling and administration", "Supported by historical and current descriptions", "Unknown in assigned pool", "Unknown in assigned pool", "Can be retained internally, but comparative efficiency is unavailable"]
      - ["Telehealth and patient engagement", "Supported by SectorPunk profile", "Unknown in assigned pool", "Unknown in assigned pool", "Requires separate tools where not internally built"]
      - ["Voice AI booking and confirmations", "Noa Booking supported by Twilio partner evidence", "Unknown in assigned pool", "Unknown in assigned pool", "Modular build is possible using communications infrastructure"]
      - ["Deep HIS / EHR integration", "SectorPunk flags weaker fit for large hospitals needing deep integration", "Unknown in assigned pool", "Incumbent advantage is plausible but not benchmarked", "Depends on existing institutional stack"]
    notes: "Supported means explicitly described by a retained source; every peer cell without direct product evidence is marked unknown rather than inferred."
    claimRefs: [CP001, CP002, CP006, CP008]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Option
      - Public price or contract model
      - Included capabilities evidenced
      - Unknowns
      - Competitive implication
    rows:
      - [Docplanner, "SectorPunk displays $100-$150 and 'Min: $50,000+' while labeling pricing mid-range", "Marketplace, booking, practice management, telehealth, and engagement", "Unit, currency context, geography, package, contract term, discounts, and realized price", "Published tokens are insufficient for procurement comparison"]
      - [Zocdoc, "Not available in assigned pool", "Only direct-competitor status is evidenced", "All pricing and packaging terms", "No like-for-like price conclusion is supportable"]
      - [Doctolib, "Not available in assigned pool", "Only direct-competitor status is evidenced", "All pricing and packaging terms", "No like-for-like price conclusion is supportable"]
      - ["NexHealth / Phreesia / Heidi Health", "Not available in assigned pool", "Only inclusion in a broad comparable set is evidenced", "Product scope, pricing unit, contract structure, and discounts", "Valuation comparability does not establish product-price comparability"]
      - ["Internal build / call center", "No public total-cost benchmark in assigned pool", "Phone scheduling and modular communications are evidenced as alternatives", "Labor, telephony, model, integration, compliance, and maintenance costs", "Build-versus-buy economics remain an open diligence item"]
    notes: "Pricing coverage is partial. SectorPunk's displayed values lack a defined unit or contract basis and are not treated as verified list prices or realized customer pricing."
    claimRefs: [CP003, CP006, CP011, CP014]
figures:
