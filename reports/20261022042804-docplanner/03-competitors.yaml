    type: quadrant
    summary: >-
      Analyst ordinal scores show where the assigned pool provides competitive
      evidence; low peer scores indicate missing evidence, not weak products.
    data:
      xAxis:
        label: Workflow breadth evidenced in assigned pool
        min: 1
        max: 5
        low: Named or single-workflow evidence
        high: End-to-end workflow evidence
        description: Analyst ordinal score based only on retained source coverage
        scale: ordinal
      yAxis:
        label: Distribution and scale evidence
        min: 1
        max: 5
        low: Named without current operating metrics
        high: Current multi-market operating metrics
        description: Analyst ordinal score based only on retained source coverage
        scale: ordinal
      points:
        - label: Docplanner
          x: 5
          y: 5
          detail: "Multiple workflows and current multi-market operating metrics are documented."
        - label: Zocdoc
          x: 1
          y: 2
          detail: "Named as a direct peer with only historical funding context in the assigned pool."
        - label: Doctolib
          x: 1
          y: 2
          detail: "Named as a direct peer with only historical funding context in the assigned pool."
        - label: NexHealth
          x: 1
          y: 1
          detail: "Named in a broad comparable set without retained product or operating detail."
        - label: Phreesia
          x: 1
          y: 1
          detail: "Revenue and valuation are listed, but product overlap is not established in the pool."
        - label: HIS / EHR incumbents
          x: 2
          y: 1
          detail: "Institutional integration is a buyer alternative, but no named vendor benchmark is retained."
    approximationNotes: "Coordinates are analyst-authored ordinal evidence scores from 1 to 5, not market-share, product-quality, or investment rankings; low values primarily encode evidence gaps."
    claimRefs: [CP002, CP004, CP006, CP011, CP014, CP015]
