      - [Appointments, "25 million booked last month", "Company page accessed 2026-10-22", medium, "Month and booking definition require source confirmation"]
      - [Active doctors, "300,000", "Company page accessed 2026-10-22", medium, "Current methodology and geography not disclosed"]
