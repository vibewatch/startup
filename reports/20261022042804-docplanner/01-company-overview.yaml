company:
  name: Docplanner
chapter:
  number: 1
  title: Company Overview
  summary: Docplanner is a privately held healthcare marketplace and practice-management software group founded in Poland and now operating across Europe and Latin America. Public evidence supports substantial platform scale, historical venture funding, and a reported 2021 unicorn valuation, but current financing terms, retention, and several operating metrics remain opaque.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Docplanner began in Poland in 2012 as an online doctor-appointment booking platform and has expanded into a two-sided healthcare marketplace plus software provider for clinicians and clinics. Bloomberg describes the company as connecting 100 million monthly users with 2.8 million medical professionals in January 2026, while Docplanner's own site reports 25 million appointments booked last month, 100 million monthly patient visits, and 300,000 active doctors. Those company figures use different populations and denominators from Bloomberg's reported user and professional counts, so they should not be treated as directly interchangeable. The product model combines patient discovery, reviews and booking with provider tools for scheduling, patient flow, online presence and clinic operations. Current headquarters reporting is inconsistent: historical and financial sources place the operating center in Warsaw, while a 2026 third-party profile places headquarters in Amsterdam. The company remains privately held and current revenue, ARR and customer-account counts are not independently disclosed in the assigned evidence.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders and governance
    body: >-
      Mariusz Gralewski is identified as Docplanner's founder and chief executive in Bloomberg's January 2026 interview and in the 2019 financing announcement. The assigned evidence names him consistently but does not provide a complete current executive roster, board composition, voting arrangements or succession plan. The 2019 One Peak announcement described a team of more than 1,000 employees, whereas the same source's company description referred to a team of 300, illustrating why headcount should be dated and source-qualified rather than carried forward as a single current number. Docplanner's own careers page confirms active functions spanning marketing and public relations, customer success and sales, IT, product and data, finance and administration, and human resources, but it does not establish leadership incumbents. Key-person dependence on Gralewski is therefore material for diligence, while formal governance and management depth remain open questions.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, valuation and milestones
    body: >-
      Docplanner's financing history is well documented through its 2013-2019 rounds in the assigned sources, although totals and currency conversions vary by database. TechCrunch reports a 2016 $20 million Series C that brought total raised to $34 million; One Peak reports a €80 million Series E in May 2019 that brought total raised to approximately €130 million. Multiples.vc reports a Series F valuation of $1 billion in September 2021 but gives conflicting round and total-raise figures elsewhere on the same page. Bloomberg's January 2026 report says the company is considering a public listing and an AI strategy, but does not establish a completed 2026 financing or current valuation. The milestone record therefore supports historical expansion, acquisitions, product development and scale, while current equity terms, debt covenants, liquidation preferences, secondary transactions and a fully comparable current valuation remain unresolved.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Platform scale is supported, but metrics are not fungible
    body: Independent 2026 reporting and the company site both indicate material healthcare-platform scale, but their user, professional, booking and visit denominators differ and require period-specific treatment.
    claimRefs: [CO001, CO002, CO003]
  - calloutType: risk
    title: Current financing visibility is limited
    body: The assigned sources support a historical $1 billion valuation reference and substantial prior funding, but do not establish current valuation, financing terms, debt maturity or investor control.
    claimRefs: [CO011, CO013, CO016]
  - calloutType: recommendation
    title: Prioritize primary financing and governance diligence
    body: Obtain the latest capitalization table, debt agreements, liquidation preferences, board materials, retention metrics and a reconciled KPI pack before relying on headline scale or valuation.
    claimRefs: [CO012, CO013]
