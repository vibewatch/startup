      - [ENERN Investments, "Existing investor in 2019 Series E", "Historical shareholder", "Confirm continued stake and preferences"]
      - [Target Global, "Lead investor in 2016 Series C", "Early institutional backer", "Trace dilution and current stake"]
      - [EBRD Venture Capital, "Participant and historical lead in early rounds", "Early institutional backer", "Confirm exit, residual stake or governance rights"]
      - [Hercules Capital, "Debt provider reported by Scalable", "Scalable reports a 2025 $143.6 million debt commitment, not equity", "Confirm drawn amount, security, covenants and maturity"]
