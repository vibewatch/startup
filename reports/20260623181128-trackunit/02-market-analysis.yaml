  - id: buyer-segments
    title: Buyer and Segment Landscape
    body: >-
      Four distinct buyer archetypes define the market, each with different budget owners,
      procurement triggers, and ROI calculus. OEMs (Caterpillar, Komatsu, Volvo CE, JCB,
      Liebherr, and ~300+ others) are the most strategic buyers: they integrate telematics
      at the factory as a product differentiator, a parts/service revenue driver, and a
      product-design feedback loop. Trackunit claims OEMs deploying multi-modal communication
      through its platform reduce data blind spots by up to 80 % and achieve 40 % faster
      time-to-market for digital services. The budget owner at OEMs is typically a VP of
      Digital or Product, with procurement cycles of 12–24 months and multi-year platform
      contracts.

      Equipment rental companies (e.g. United Rentals, Sunbelt/Ashtead, Cramo, Loxam, and
      smaller independents) represent the second major segment. Their primary ROI case is
      fleet utilisation visibility, anti-theft tracking, and automated billing based on
      metered hours. The ERA (European Rental Association) represents rental operators
      across Europe; the European rental market is a major Trackunit geographic anchor.
      Rental CFOs own capex/opex decisions; contract lengths are typically 3–5 years with
      per-unit pricing.

      General and specialty contractors (the largest buyer count but smaller average
      contract size) use telematics for jobsite compliance, idle-time reduction, and
      emissions reporting. Budget ownership is fragmented between fleet managers and
      operations/finance; adoption is more episodic and price-sensitive. Dealers round
      out the fourth segment: they use fleet data to trigger proactive parts and service
      revenue, reducing reactive breakdown visits. All four segments share the mixed-fleet
      challenge—fleets consist of machines from many OEMs and require a brand-neutral
      platform to aggregate data coherently.

      Across segments, the AEMP (Association of Equipment Management Professionals) and
      ISO 15143 data-exchange standards reduce integration friction by defining a common
      telematics data schema, but adoption of open standards is uneven across OEM brands,
      creating persistent interoperability gaps that a neutral platform must bridge.
