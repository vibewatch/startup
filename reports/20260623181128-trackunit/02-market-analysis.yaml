chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Trackunit competes in the industrial IoT and construction-equipment telematics market,
    a sub-segment of the broader IoT-in-construction market sized at roughly USD 17.9 billion
    in 2026 and forecast to reach USD 35.8 billion by 2031 (14.9 % CAGR). The addressable
    platform market for multi-OEM fleet-management and rental-operations software is materially
    smaller—estimated USD 5–7 billion—with OEMs, rental companies, and general contractors
    as the primary buyer archetypes. Growth is driven by predictive maintenance ROI, safety
    mandates, EU Green Deal carbon-tracking requirements, and 5G/edge-computing roll-out.
    Material constraints include proprietary OEM telematics lock-in, mixed-fleet
    interoperability gaps, cyclical construction capex, retrofit economics on older machines,
    and GDPR-linked data-ownership friction. Analyst sizing figures differ by 3×–10× depending
    on scope definition; gaps in European sub-market revenue and telematics penetration rates
    are preserved.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >-
      Trackunit operates at the intersection of three overlapping markets: (1) construction-
      equipment telematics—hardware and software for locating, monitoring, and diagnostics of
      heavy machines; (2) industrial IoT platforms for construction—broader cloud, analytics,
      and workflow software layers; and (3) rental-fleet management software—asset-tracking
      and utilisation systems used by equipment rental operators. The relevant spend boundary
      includes hardware modems, SIM connectivity, cloud-platform subscriptions, API data
      feeds, and third-party app integrations built on top of the telematics data layer.
      Excluded are the construction-equipment hardware market itself (USD 205–226 billion
      globally), project-management software (e.g. Procore, Autodesk Construction Cloud),
      and autonomous or robotic equipment, which use telematics data as inputs but are
      separate procurement decisions. The status-quo alternative for most buyers is
      OEM-proprietary telematics (Cat Connect, KOMTRAX, Volvo CareTrack) that covers
      single-brand fleets only; Trackunit's SAM is the share of equipment owners with
      mixed-OEM fleets or a need for aggregated cross-brand data and workflow integrations.
      Adjacent markets include fleet telematics for transportation/logistics vehicles,
      building management systems, and site-access-control platforms—all adjacent but
      structurally distinct buyer journeys.
