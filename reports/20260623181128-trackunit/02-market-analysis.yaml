  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: "A credible primary third-party estimate for the construction-equipment telematics SaaS sub-market SAM specifically (not the broader IoT-in-construction figure) with methodology documentation."
      whyItMatters: "Without an independent SAM figure, the addressable market size for Trackunit's platform revenue is derived by assumption stacking; this limits investment sizing confidence."
      diligencePath: "Commission or obtain a specialised analyst report from Gartner, IDC, or Berg Insight specifically scoping construction telematics software revenue; or request Trackunit's internal SAM model."
      relatedQuestionRefs:
        - QM002
        - QM004
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: "Trackunit's actual annual recurring revenue (ARR), revenue per machine, and customer count are not publicly disclosed."
      whyItMatters: "Without ARR data, SOM cannot be calculated from the bottom up and the per-machine revenue assumption used in the chapter must remain speculative."
      diligencePath: "Request Trackunit financials under NDA during formal due diligence; cross-check with investor materials from Goldman Sachs / GRO Capital."
      relatedQuestionRefs:
        - QM004
        - QM005

    - type: missing-source
      severity: material
      topic: buyer-segments
      missingEvidence: "Independent data on the share of global construction fleets that are multi-brand vs. single-brand, which determines the effective SAM boundary for a mixed-fleet aggregation platform."
      whyItMatters: "If 70 %+ of fleets are single-OEM, Trackunit's mixed-fleet SAM is materially smaller than the top-down IoT market figure implies; if mixed-fleet is dominant, the inverse holds."
      diligencePath: "Request OEM market-share data by fleet (not unit-sales) from AEM, AEMP, or a specialised construction-fleet research provider; or review Trackunit's CRM data on installed base by customer OEM diversity."
      relatedQuestionRefs:
        - QM007
        - QM022
      relatedTableRefs:
        - TM003

    - type: missing-source
      severity: material
      topic: adoption-constraints
      missingEvidence: "Documented independent case studies or audit reports verifying the 20–25 % downtime reduction and 18 % maintenance cost reduction attributed to Trackunit's platform, as currently only cited through a vendor-friendly analyst channel."
      whyItMatters: "The ROI claims underpin the buyer adoption case and the investment thesis; if not independently verified, they are company-claimed marketing figures."
      diligencePath: "Request customer reference calls with three or more rental operators and contractors who have used Trackunit for 12+ months; obtain pre/post utilisation and maintenance cost data under NDA."
      relatedQuestionRefs:
        - QM011
        - QM015
        - QM021

    - type: stale
      severity: minor
      topic: market-sizing
      missingEvidence: "Allied Market Research construction-equipment market report uses a 2021 base year; the 2031 projection has not been refreshed with 2024–2026 supply-chain and rate-cycle data."
      whyItMatters: "Post-pandemic construction cycle dynamics (rate hikes, supply-chain normalisation, mega-project pipelines) may make the 4.8 % CAGR estimate conservative or stale."
      diligencePath: "Identify Allied Market Research's 2025 or 2026 updated version of the report; compare with Mordor and Precedence fresher estimates."
      relatedQuestionRefs:
        - QM013
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: minor
      topic: adoption-constraints
      missingEvidence: "AEMP/ISO 15143-3 telematics standard adoption rate across the top 20 construction OEM brands in 2026; whether major brands have implemented this standard or still use proprietary APIs only."
      whyItMatters: "ISO 15143-3 adoption directly determines integration complexity and engineering cost for Trackunit's OEM onboarding and mixed-fleet normalisation; low adoption sustains a moat, high adoption lowers barriers to entry for competitors."
      diligencePath: "Review AEMP member certification list; check OEM developer documentation for API standards compliance; request Trackunit's OEM integration roadmap."
