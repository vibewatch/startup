callouts:
  - calloutType: insight
    title: "Mordor Intelligence cites Trackunit directly as evidence of IoT ROI"
    body: >-
      Mordor Intelligence's IoT-in-Construction market report (updated January 2026) cites
      Trackunit's global network of more than 1 million connected machines as direct evidence
      that remote diagnostics can cut downtime by 20–25 % and maintenance outlays by 18 %.
      This is notable because it positions Trackunit as an industry proof point in a
      USD 17.9 billion market narrative, but the underlying KPIs are company-claimed and
      cannot be independently verified.
    claimRefs:
      - CM007
      - CM023
      - CM024

  - calloutType: risk
    title: "OEM-native telematics limits the mixed-fleet SAM"
    body: >-
      Caterpillar, Komatsu, and Volvo CE each operate proprietary telematics ecosystems
      (Cat Connect, KOMTRAX, CareTrack). Fleet operators running exclusively one OEM's
      machines have limited incremental need for a neutral aggregator. Trackunit's SAM
      is bounded by the prevalence of mixed-OEM fleets, which is highest among large
      rental companies and major contractors—but the exact share of global fleets that
      are multi-brand vs. single-brand is not publicly quantified and represents a key
      sizing diligence gap.
    claimRefs:
      - CM028
      - CM029
      - CM036

  - calloutType: assumption
    title: "SAM and SOM estimates rely on undisclosed methodology assumptions"
    body: >-
      No primary third-party source publishes a construction-equipment telematics SaaS
      SAM figure. The USD 5–7 billion SAM estimate in this chapter is derived by applying
      Mordor Intelligence's software/services share (32.85 %) to the IoT-in-construction
      base and then applying an estimated construction-telematics sub-share (~30 %). Each
      of these multipliers carries significant uncertainty and should be replaced with
      Trackunit's own disclosed SAM model during a formal due diligence process.
    claimRefs:
      - CM011
      - CM035
      - CM037

