  - id: market-sizing
    title: Market Sizing and TAM / SAM / SOM Lenses
    body: >-
      Three complementary sizing lenses triangulate Trackunit's opportunity. The broadest
      lens, IoT in Construction (hardware + software + services), stood at USD 15.6 billion
      in 2025 and is projected by Mordor Intelligence to reach USD 35.8 billion by 2031 at
      a 14.9 % CAGR, driven by cloud deployment acceleration, safety analytics adoption,
      and 5G edge-computing roll-out. North America holds 38 % of that market; Europe is
      the second region and shows steady growth powered by EU Green Deal carbon-audit
      mandates; Asia-Pacific is the fastest-growing region at 19.3 % CAGR.

      A narrower lens sizes the global construction-equipment fleet management and telematics
      software segment. Mordor Intelligence estimates the overall construction-equipment
      market at USD 205 billion in 2026, of which connected services and software represent
      a minority slice—Precedence Research values the equipment-plus-services market at
      USD 226 billion (2025). Allied Market Research, using a 2021 base of USD 196 billion,
      projects USD 314 billion by 2031 at a more conservative 4.8 % CAGR. The divergence
      reflects definitional differences: some reports include equipment hardware, some
      exclude it. The relevant software-and-services sub-segment is materially smaller—
      estimated by multiple secondary sources at roughly USD 5–7 billion SAM in 2026
      for the combined telematics subscription, fleet-management SaaS, and data-feed
      layer directly addressable by a platform such as Trackunit.

      Trackunit itself references more than one million connected machines on its platform,
      suggesting a current installed-base-derived revenue estimate that, at industry-typical
      per-machine SaaS pricing of USD 10–30 per month, would imply USD 120–360 million
      annual revenue run rate at full monetisation across its connected base—a company-
      estimated upper bound that cannot be independently confirmed. This bottom-up estimate
      is preserved as a sizing hypothesis with low confidence pending public disclosure.
      Multiple analysts list the pure construction-equipment telematics software market
      substantially lower than the broader IoT-in-construction figure, and the specific
      breakdown is a material evidence gap.
