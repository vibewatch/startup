    body: >-
      Trackunit's >95% recurring revenue share, 17% ARR growth in 2024, and expanding ecosystem of 5,000+
      customers and major OEM integrations (Hilti, Liebherr, Manitowoc, Skyjack) reflect a defensible,
      network-effects-driven SaaS model in a sector undergoing rapid digitalization.
    claimRefs:
