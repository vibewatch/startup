  - id: section-leadership
    title: Leadership, governance, and ownership structure
    body: >
      Søren Brogaard was appointed CEO of Trackunit in December 2020, having joined as Chief Technology Officer
      in 2016 and served as Chief Commercial Officer from December 2017. His Trackunit biography emphasises
      data-driven global customer success strategies, digital transformation leadership, and value-and-purpose-
      driven management. Brogaard has publicly represented Trackunit through the IrisX platform launch, the 2024
      product expansion, and the 2025 Goldman Sachs investment process. The concentration of operational
      leadership, product vision, and external investor trust in a single executive represents a key-person
      dependency that formal diligence should assess. Other C-suite members include Chief Product & Marketing
      Officer Lærke Ullerup, COO Evan Barnes, CFO Michael Tritschler, Chief Product & Technology Officer Mikkel
      Dalgas, EVP Engineering Anders Thorbjørn Jensen, Chief People Officer Martin Darré, Chief Revenue Officer
      Amish Sabharwal, and General Manager EMEA Morten Gram. The publicly listed board includes Chairman Tod
      Nielsen and directors including Nick Jordan and Søren Holt from Hg Capital, James Robinson (Managing
      Director at Goldman Sachs Alternatives), and independent members including Nana Bule, Sarah Schneider, and
      Thomas Bluth. Post-closing board changes resulting from the June 2025 GS transaction may not yet be fully
      reflected in public listings.

      Trackunit's ownership history runs through three distinct private equity epochs. Goldman Sachs and GRO
      Capital acquired the company in 2015, supporting international expansion and an accelerated transition to
      SaaS. In March 2021, Hg Capital acquired the majority stake from Goldman Sachs and GRO Capital; under Hg,
      Trackunit launched IrisX, expanded to 3 million+ connected assets, and built out its OEM ecosystem. In
      February 2025, Goldman Sachs Alternatives (Private Equity at Goldman Sachs) signed an agreement to
      re-acquire the majority from Hg and GRO Capital, with Hg reinvesting as a minority shareholder. The
      transaction closed in June 2025 following EU regulatory clearance citing minimal competition concerns.
      Goldman Sachs Alternatives has invested over $75 billion since 1986; Hg Capital manages approximately
      $85 billion across its funds. Nick Jordan and Søren Holt from Hg described Trackunit as "a prime example
      of how data-rich software businesses can capitalise on their structural data advantage through AI."

      The three PE transitions since 2015 introduce governance continuity risk and transition overhead. The 2025
      deal engaged an unusually large cohort of advisors — Evercore, Skadden, Gorrissen Federspiel, CMS, and
      Deloitte on the sell side; Goldman Sachs International, Morgan Stanley, White & Case, A&O Shearman,
      Sullivan & Cromwell, and Deloitte for Goldman Sachs Alternatives — consistent with a complex, leveraged
      structure. Deal terms (price, leverage ratio, post-closing governance) have not been publicly disclosed.
