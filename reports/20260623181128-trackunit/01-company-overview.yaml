      - CO008
      - CO013
      - CO020
      - CO021

  - calloutType: risk
    title: Three PE ownership changes in a decade and opaque financials are live diligence risks
    body: >-
      Trackunit has had three distinct private equity majority owners since 2015. The 2025 Goldman Sachs
      transaction involved aggressive leverage and restricted diligence access (per private credit reporting).
      No publicly audited financials exist. Each ownership change creates governance transition risk, and the
      current balance sheet structure has not been publicly disclosed.
    claimRefs:
      - CO033
      - CO034
      - CO032

  - calloutType: insight
    title: IrisX positions Trackunit as a platform company, not just a telematics provider
    body: >-
      The August 2024 launch of IrisX as an Industry Cloud Platform signals a deliberate shift from hardware-
      led telematics to a software-and-AI data platform. This repositioning, combined with ISO 27001 certification
      and an open developer ecosystem, increases Trackunit's defensibility and potential enterprise value
      multiples — but also raises execution risk as platform revenue must materialise at scale.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018

