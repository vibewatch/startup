  - id: section-products
    title: Products, platform, and ecosystem
    body: >
      Trackunit's product suite spans hardware, software, and open platform layers. Trackunit Manager provides
      fleet management, utilization analytics, maintenance scheduling, geofencing, access control, and compliance
      reporting. Hardware products include Kin (a compact Bluetooth tracking tag for non-powered assets and small
      tools) and Go (a cellular telematics device for heavy machinery with real-time connectivity). The company
      also delivers Specialty Equipment solutions, Trackunit Pass access management, Network Solutions, and the
      new-generation Raw telematics hardware introduced in 2024. An open REST and GraphQL developer API, documented
      at the Trackunit Developer Hub, enables custom integrations and data extraction into external ERP, CRM, and
      rental management systems.

      The strategic centerpiece of Trackunit's current positioning is IrisX, an operating data platform launched on
      August 29, 2024. IrisX is positioned as an Industry Cloud Platform (ICP) — a Gartner-defined category, with
      Gartner predicting more than 70% of enterprises will use ICPs by 2027. IrisX incorporates generative AI and
      large language models, an automation studio for workflow automation, developer software development kits (SDKs),
      composite AI capabilities, firmware-over-the-air (FOTA) updates, and a marketplace for third-party integrations.
      The platform is ISO 27001 certified. CEO Søren Brogaard described IrisX as solving the three core barriers to
      digital transformation in construction: high upfront investment, scarcity of tech talent, and lack of tool
      interoperability. By year-end 2024, five "significant construction players" had signed up for IrisX, though
      their identities have not been publicly disclosed.

      The ecosystem strategy is formalised through the "Works With Trackunit" partner program initiated in 2021.
      The most prominent integration is with Hilti: over 500,000 Hilti ON!Track Bluetooth tags are integrated into
      Trackunit's global Bluetooth network, and the two companies jointly launched a van inventory and heavy
      equipment management solution in November 2023. Industry publications also cite Liebherr, Manitowoc, and
      Skyjack as OEMs integrating with Trackunit via the AEMP 2.0 (ISO 15143-3) telematics standard. At
      CONEXPO-CON/AGG 2026, Trackunit showcased IrisX blueprints for predictive maintenance, smart servicing, and
      inventory forecasting, along with the Kin T200 tracking tag and composite AI capabilities.
