  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: transaction-structure
      missingEvidence: >-
        Exact deal price, leverage ratio, debt structure, ownership percentages for Goldman Sachs Alternatives
        and Hg Capital post-June 2025 close, and management equity rollover terms.
      whyItMatters: >-
        Without deal economics, it is not possible to assess the balance sheet risk, debt service capacity, or
        post-transaction governance rights that affect later financial and risk chapters.
      diligencePath: >-
        Request deal term sheet, Cap table, and post-closing financing agreements directly from Trackunit or
        Goldman Sachs Alternatives under NDA in a formal diligence process.
      relatedQuestionRefs:
