  - id: section-milestones
    title: Financial scale, milestones, and diligence context
    body: >
      Publicly available financial data shows solid recurring-revenue growth against a challenging macro backdrop.
      Trackunit's 2024 net revenue of DKK 1.29 billion (+10% YoY) and ARR of DKK 812.6 million (+17% YoY, >95%
      of total revenue) reflect a high-quality SaaS profile. Third-party private equity analysts estimated the
      2025 Goldman Sachs transaction implied an enterprise value of approximately DKK 10 billion (USD ~1.45
      billion), consistent with an EV/EBITDA multiple of approximately 26.7x based on 2024 results — a valuation
      level typical for high-quality recurring-revenue SaaS platforms at scale.

      Two adverse signals merit explicit attention. First, Trackunit is a private company with no public audited
      financials; all metrics are company-claimed. The exact deal valuation, post-transaction leverage structure,
      and balance sheet are not in the public domain. Second, private credit market reporting (9fin) indicated
      that some direct lenders disengaged from the Trackunit financing process due to aggressive leverage multiples
      and restricted diligence access — a concern that warrants further investigation if assessing credit or
      balance-sheet exposure. While these concerns do not negate the business quality, they are live diligence
      questions for any investor seeking to assess financial risk at the capital structure level.

      Regarding connected asset scale, there is a discrepancy between sources: the February 2025 Goldman Sachs
      investment announcement cited "circa 3.5 million visible assets" while Hg Capital's IrisX case study cites
      "more than 6.5 million assets." The 2024 performance press release said "more than 3 million visible assets
      connected." This discrepancy likely reflects different measurement methodologies — "visible assets" refers
      to directly connected devices, while the broader ecosystem count may include Bluetooth-tracked tools via
      Hilti and other integrations. The Hg case study also documents that connected assets have grown more than
      tenfold since 2016, underscoring the ecosystem's compound growth trajectory. The milestone chronology below
      is the single record of founding, financing, product, scale, and partnership events for later chapters to
      reference.
