  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "unit economics"
      missingEvidence: "Annual NRR and gross revenue retention (GRR) history by cohort and by customer tier (OEM, Rental, Contractor) for at least three fiscal years"
      whyItMatters: "Without NRR/GRR, there is no basis for underwriting the durability of the 17% ARR growth rate or distinguishing expansion revenue from gross churn under the 8× LBO leverage structure"
      diligencePath: "Request ARR waterfall from management data room: opening ARR, new logo ARR, expansion ARR, contraction ARR, churned ARR, closing ARR — by tier and by cohort year"
      relatedQuestionRefs:
        - QI009

    - type: "private-evidence-only"
      severity: "material"
      topic: "unit economics"
      missingEvidence: "Fully loaded customer acquisition cost (CAC) by channel and customer type, payback period in months, and LTV/CAC ratio for at least the last two fiscal years"
      whyItMatters: "CAC efficiency determines whether the projected 21% revenue CAGR is capital-light (organic) or requires proportional S&M scaling that erodes FCF available for debt service"
      diligencePath: "Request S&M cost breakdown by channel (OEM partner, direct enterprise, digital), new ARR added per year, and implied CAC payback per tier; benchmark against listed peers Samsara and Geotab"
      relatedQuestionRefs:
        - QI016

    - type: "private-evidence-only"
      severity: "material"
      topic: "gross margin"
      missingEvidence: "Gross margin by revenue segment: software subscriptions, hardware device sales, and professional services — separately disclosed"
      whyItMatters: "Blended 69% GM conflates materially different economics; as hardware shrinks below 5% of revenue, understanding the true SaaS platform GM (likely 75–85%) and hardware drag is critical for valuation and EBITDA sensitivity analysis"
      diligencePath: "Request P&L by revenue line from audit-level financial statements; cross-check with COGS footnotes in the CVR annual accounts filed with Erhvervsstyrelsen"
      relatedQuestionRefs:
        - QI025

    - type: "private-evidence-only"
      severity: "blocking"
      topic: "debt"
      missingEvidence: "Credit agreement terms: financial maintenance covenant levels, net debt at close, cash interest obligations, amortization schedule, PIK vs. cash pay mechanics, and quarterly headroom calculations"
      whyItMatters: "At ~8× leverage, covenant headroom and free cash flow after debt service are the primary capital adequacy metrics; any growth deceleration to 2024 levels (~10% revenue growth) could stress covenants"
      diligencePath: "Request credit agreement abstract from management; calculate cash interest coverage ratio (EBITDA / cash interest expense); review Q1–Q2 2025 and 2026 management accounts for leverage test outcomes"

    - type: "private-evidence-only"
      severity: "material"
      topic: "revenue mix"
      missingEvidence: "ARR breakdown by geography (North America, Europe, APAC), by customer type (OEM, Rental, Contractor, Enterprise), and by ARR band (e.g. <50K, 50–500K, >500K)"
      whyItMatters: "Geographic and segment concentration determines whether the ~50% North America share and top-10-customer concentration create correlated risk in a single macro downturn scenario"
      diligencePath: "Request annual ARR summary by segment and geography from management data room; cross-reference against customer-level CRM data for top 20 accounts"
      relatedQuestionRefs:
        - QI027

    - type: "private-evidence-only"
      severity: "minor"
      topic: "revenue recognition"
      missingEvidence: "Revenue recognition policy for multi-year SaaS subscription contracts: upfront vs. ratable, treatment of contract modifications and early terminations, and deferred revenue balance"
      whyItMatters: "Multi-year contract terms affect the timing of ARR to revenue conversion and deferred revenue liability profile; relevant to understanding cash conversion relative to reported revenue"
      diligencePath: "Review accounting policy notes in the Trackunit A/S Danish annual accounts (Erhvervsstyrelsen filings); request deferred revenue schedule from management"
      relatedQuestionRefs:
        - QI026

    - type: "not-yet-public"
      severity: "minor"
      topic: "ARR run rate"
      missingEvidence: "Confirmed ARR run rate and total connected asset count for mid-2026 (June 2026 reporting date)"
