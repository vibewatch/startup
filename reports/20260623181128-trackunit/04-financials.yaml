          value: 62.0
    approximationNotes: "Net revenue and gross profit are derived from official 2024 accounts (DKK converted at ~6.9 DKK/USD). Cash EBITDA of USD 62m is per Octus deal-process intelligence; accounting EBITDA (DKK 374m) converts to ~USD 54m at prevailing rate, with the delta reflecting standard LBO cash adjustments. OpEx is the residual between gross profit and cash EBITDA; breakdown by R&D / S&M / G&A is not publicly disclosed. A ~33% R&D intensity ratio (per CEO 2023 statement) would imply ~USD 62m R&D alone, leaving minimal S&M and G&A — suggesting the CEO's 2023 ratio includes capitalized development or is approximate."
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
      - CI010

callouts:
  - calloutType: "strength"
    title: "SaaS-Dominant Revenue Base with Accelerating ARR"
    body: "Trackunit's 95%+ recurring revenue share and 17% ARR growth in 2024 — well above the 10% total revenue growth rate — demonstrate that the business is successfully transitioning toward higher-quality, more predictable cash flows. The OEM pre-install flywheel provides structural lock-in that is difficult for competitors to displace at scale."
    claimRefs:
      - CI002
      - CI003
      - CI011

  - calloutType: "risk"
    title: "High LBO Leverage (~8× EBITDA) Constrains Capital Flexibility"
    body: "The June 2025 Goldman Sachs buyout introduced approximately USD 500m of term debt (~8× cash EBITDA leverage). With cash interest estimated at USD 35–50m per year at SOFR +500–525 bps, debt service materially compresses free cash flow relative to EBITDA. Any sustained revenue growth deceleration — as observed in the 2024 slowdown from 18% to 10% — would tighten covenant headroom and limit investment capacity at a critical product-expansion phase."
    claimRefs:
      - CI020
      - CI022
      - CI007

  - calloutType: "risk"
    title: "Customer Concentration: Top 10 Accounts ≈ 50% of Revenue"
    body: "Lenders in the 2025 debt process explicitly flagged that Trackunit's top 10 customers account for approximately half of total revenue. While the company reports long customer tenures for large accounts, the concentration creates outsized exposure to a handful of OEM, rental, and contractor relationships. A single large non-renewal could represent a 3–8% ARR headwind in isolation — meaningful under LBO leverage."
    claimRefs:
      - CI026
      - CI037

