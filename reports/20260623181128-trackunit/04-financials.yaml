  - id: "financial-verdict"
    title: "Financial Verdict and Diligence Gaps"
    body: |
      Trackunit presents a compelling financial profile: 95%+ recurring revenue, 17% ARR growth, ~69% gross margin, and ~29–33% EBITDA margin are well above median for industrial IoT peers. The platform's scale (6.5 million assets, 2 trillion daily data points as of April 2026) and IrisX AI capabilities create incremental revenue expansion potential. Revenue-per-employee of ~USD 410K and an eNPS of 62 indicate an efficient, high-talent organization.

      However, the June 2025 LBO at ~8× cash EBITDA introduces the dominant financial risk for an investor assessing capital adequacy. If the projected 21% revenue CAGR through 2029 fails to materialize — as the 2024 growth deceleration from 18% to 10% suggests is possible — debt service will constrain capital allocation for R&D and further M&A. The covenant structure, cash interest burden, and any PIK mechanics are not public.

      The absence of NRR, CAC, segment ARR, hardware gross margin, and free cash flow data prevents underwriting the full quality of the recurring revenue base. All unit economics metrics in TI003 are either estimates or null. Public pricing opacity means there is no independent basis for assessing realized ARPA trends or pricing power sustainability. These gaps collectively mean that a prospective investor or lender conducting fresh diligence should prioritize the metrics listed in TI005 before drawing any judgment on terminal value or growth quality.
