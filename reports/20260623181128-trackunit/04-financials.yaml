chapter:
  number: 4
  title: "Financials"
  summary: >-
    Trackunit is a SaaS-dominant construction telematics platform generating USD 186.5m net revenue and USD 119.5m ARR in 2024, with 95% recurring-revenue share, a ~69% blended gross margin, and a 29–33% EBITDA margin — strong unit economics for a niche industrial IoT business. The June 2025 Goldman Sachs Alternatives buyout at approximately DKK 10bn (~26.7× EBITDA) introduced roughly USD 500m of LBO term debt plus a USD 100m facility (~8× cash EBITDA leverage), creating a structurally leveraged balance sheet that constrains forward capital flexibility. Material diligence gaps persist around NRR, CAC, hardware segment margin, and leverage covenant structure; customer concentration (top 10 accounts ≈ 50% of revenue) amplifies credit risk under the new ownership.

sections:
  - id: "revenue-model-pricing"
    title: "Revenue Model and Pricing Architecture"
    body: |
      Trackunit operates a SaaS-dominant dual-revenue model. Subscription software accounts for just over 95% of 2024 net revenue; hardware IoT devices (Raw, Kin, Spot, Beam) represent less than 5% and function primarily as platform-entry enablers rather than standalone profit drivers. Subscription plans are segmented by customer motion: OEM plans support factory-pre-installed connectivity, Rental plans optimize utilization and invoicing workflows, and Contractor plans target multi-site operational visibility. An Enterprise tier serves large-fleet deployments.

      Pricing is entirely opaque — no list prices are published. Customers configure bespoke plans in four steps: (1) choose a software plan (Explore, Evolve, or Expand), (2) configure Asset Configuration covering their specific machine and tool classes, (3) select a service package (online-only, live support, or guaranteed-uptime SLA), and (4) add optional capabilities. Per-asset economics improve at volume: unit pricing steps down as connected fleet size grows, creating natural expansion incentives and locking customers into the platform's data flywheel. ISO feeds are included across all tiers, supporting AEMP 2.0 industry-standard data integration. The opaque custom-quote model prevents external competitive benchmarking but is common in enterprise B2B SaaS in fragmented industrial verticals.

      The OEM motion creates a particularly durable revenue base. OEM partners pre-install Trackunit devices at the factory, seeding the connected-asset pool and generating downstream recurring revenue from the rental and contractor end-customers who operate those machines. GRO Capital's portfolio narrative confirms that this OEM flywheel was the central growth mechanism during the Hg ownership era, with five acquisitions between 2016 and 2023 expanding both geographic reach and OEM integration depth. North America now represents approximately 50% of total revenue after US expansion accelerated during the Hg period.
