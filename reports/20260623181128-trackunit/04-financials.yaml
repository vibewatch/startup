  - id: "revenue-quality-adverse"
    title: "Revenue Quality, Customer Mix, and Adverse Evidence"
    body: |
      Trackunit's revenue quality is supported by a 95% ARR share, ARR growth of 17% in 2024, and a 68.9% blended gross margin. However, key undisclosed metrics — NRR, gross retention rate, and per-cohort ARR expansion — prevent independent verification of whether growth is driven by logo additions, price increases, or genuine upsell expansion. ARR growing 17% while total revenue grew only 10% suggests some hardware moderation or mix effects.

      Customer concentration is a material risk confirmed by deal-process lender diligence: the top 10 customers account for approximately 50% of total revenue (Octus). The company counters that large customers tend to be long-tenured; the Sunbelt Rentals UK partnership (expanded November 2025 to 20,000+ assets on IrisX) illustrates the depth of anchor-account relationships. But concentration leaves revenue exposed to meaningful single-account churn at the enterprise end.

      Geographically, North America represents approximately 50% of total revenue as of the GRO Capital 2025 narrative, somewhat lower than the 60% cited in the 2023 annual report, possibly reflecting European recovery and Asia-Pacific growth. Trackunit serves 5,000+ customers across OEMs, rental companies, contractors, and ecosystem partners.

      On the adverse evidence side, Trackunit holds a Trustpilot score of 1.8 out of 5 ("Poor"), with 32 reviews citing unresponsive customer support, hardware installation failures (battery drain, water ingress), billing disputes at contract termination, and lack of follow-up from support teams. Capterra reviewers score the product 4.3/5 overall but echo support responsiveness complaints and requests for deeper CAN-bus data export capabilities. The divergence between B2B software review platforms (positive operational feedback) and Trustpilot (negative support/billing experience) is a common pattern for SME-facing telematics vendors and suggests a tiered support experience gap between enterprise and smaller-fleet customers.
