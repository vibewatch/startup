companyProfile:
  summary: Trackunit is a Danish construction-technology company that combines telematics hardware, connectivity, fleet-management software, and an operating-data platform for off-highway equipment. Its product suite spans Trackunit Manager, Trackunit Go, Kin asset tracking, marketplace/API integrations, and the IrisX platform, which together support OEMs, rental fleets, dealers, and contractors seeking to reduce downtime and improve utilization. After two prior private-equity ownership periods, Goldman Sachs Alternatives regained majority control in June 2025 with Hg reinvesting as minority shareholder, leaving Trackunit as a scaled but still private, sponsor-backed industrial SaaS asset.
  foundedDate: '2003-01-01'
  foundingLocation: Aalborg, Denmark
  headquarters: Aalborg, Denmark
  productSummary: Multi-module construction equipment telematics and operating-data platform combining IoT devices, mixed-fleet data ingestion, fleet workflows, Bluetooth asset tracking, APIs, and ecosystem applications.
  customerFocus: OEMs, rental companies, dealers, contractors, and construction-technology partners managing mixed fleets.
  businessModel: Predominantly recurring SaaS subscriptions tied to connected assets, software modules, and ecosystem integrations, with hardware and connectivity supporting deployment.
  stage: Private, PE-backed
  fundingStatus: Majority acquisition by Goldman Sachs Alternatives closed in June 2025 at an implied ~DKK 10B valuation; Hg reinvested as minority holder.
