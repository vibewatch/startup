  topStrengths:
    - Construction-specific mixed-fleet data model with OEM, dealer, rental, and contractor reach.
    - High recurring-revenue mix (about 95%) and public 2024 ARR growth despite a weak European market.
    - Deep ecosystem position through 100+ OEM integrations, works-with partner programs, and named deployments.
    - Product breadth spanning hardware, connectivity, software workflows, APIs, and new IrisX platform capabilities.
  topRisks:
    - 2025 buyout valuation and leverage leave limited margin for underwriting error relative to growth-adjusted public comps.
    - OEM-embedded telematics and partner-controlled API access can compress Trackunit's independent platform power.
    - Public disclosure remains incomplete on debt terms, NRR, CAC efficiency, and customer concentration.
    - GDPR, EU Data Act, and security-attestation requirements create ongoing enterprise-sales and compliance risk.
  unresolvedGaps:
    - Full post-buyout debt package, covenants, and interest burden are not publicly disclosed.
    - 2025 ARR, EBITDA, NRR, and churn metrics remain unavailable from audited or company-published sources.
    - Realized pricing by module, hardware gross margin, and OEM revenue concentration are still opaque.
    - Public evidence of SOC 2 Type II or equivalent full-platform assurance remains incomplete.
