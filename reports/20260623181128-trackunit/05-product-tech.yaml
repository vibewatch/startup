chapter:
  number: 5
  title: Product & Technology
  summary: >
    Trackunit operates a vertically integrated construction technology stack spanning purpose-built IoT hardware (Raw TU700, Kin T200, Pass K300, Beam), the industry's largest Bluetooth construction network (450,000+ active gateways), and IrisX—an operating data platform that normalizes 3 billion+ data points daily from 6.5 million+ connected assets across 65+ countries. The platform fully implements ISO 15143-3 (AEMP 2.0) for OEM mixed-fleet data interoperability, exposes GraphQL and REST APIs including a CAN Faults API, and as of June 2026 launched an MCP server connecting fleet intelligence to Claude, ChatGPT, Gemini, and Microsoft Copilot. Security posture references ISO 27001 and SOC 2 through the identity management layer; no public certificate or Type II attestation is downloadable, a diligence gap. Customer reviews flag hardware installation quality and support responsiveness as persistent operational risks.

sections:
  - id: platform-portfolio
    title: Platform & Product Portfolio
    body: >
      Trackunit's commercial offering spans three interconnected tiers: connected hardware devices, a global Bluetooth network infrastructure, and the IrisX operating data platform. The product family is designed to cover the full asset spectrum on a construction site—from heavy powered equipment through small tools and hand-carry attachments.

      The software anchor is Trackunit IrisX, positioning itself as a purpose-built operating data platform (ODP) for construction that sits above standalone telematics. IrisX ingests telematics, OEM, and business data from multiple sources, normalizes it into a governed data layer, and exposes it via APIs, dashboards, and AI agents. As of June 2026 the platform connects over 6.5 million assets across 65+ countries, processes over 3 billion data points daily, and has accumulated over 2 trillion data points in total. The European Rental Association recognized IrisX with the 2025 Rental Technology of the Year Award for advancing data interoperability.

      Trackunit Manager is the primary cloud SaaS fleet management interface, providing real-time map view, utilization analytics, equipment health and CAN diagnostic alerts, and access management for mixed fleets. Trackunit Go is the companion mobile application for field-level visibility, enabling technicians and operators to view GPS position, fault codes, and machine activity from a mobile device and to log equipment issues in the field.

      On the hardware side, the Raw product line—anchored by the TU700—is a rugged cellular-GPS telematics device for powered equipment, supporting CAN J1939 data collection and two-way OTA firmware updates. Kin T200 is the next-generation Bluetooth Low Energy tracking tag for non-powered assets, tools, and attachments (IP66/67/69, 400 m line-of-sight BLE range, 3-axis accelerometer, temperature sensor). Pass K300 is the IoT access management device supporting NFC, RFID, PIN code, and phone-based operator authentication, with IPAF credential integration. Spot covers non-powered attachments and trailers. Beam gateways extend Bluetooth coverage indoors and in storage areas. The platform also offers Trackunit On for operator credential management and mobile inspections.

      Trackunit claims 150+ OEM factory-install relationships, meaning Raw devices ship pre-fitted on new machines across major construction equipment brands. The Trackunit Network currently has more than 450,000 gateways active on jobsites daily, across more than 100,000 jobsites globally, constituting what Trackunit markets as the world's largest Bluetooth network in construction.
