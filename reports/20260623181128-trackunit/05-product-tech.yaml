  - id: product-roadmap-ecosystem
    title: Product Roadmap & Ecosystem Positioning
    body: >
      Trackunit's roadmap through 2026 centers on the AI in IrisX initiative: embedding machine intelligence directly into the platform rather than layering AI as a separate analytics tool. The IrisX MCP Server, launched June 16, 2026, enables natural-language fleet queries and actions through Claude, ChatGPT, Gemini, and Microsoft Copilot via the open Model Context Protocol standard with no custom integration required by the end user. IrisX enriches the underlying data to answer fleet questions, trigger alerts, update records, and automate multi-step tasks. Trackunit additionally plans to release a conversational AI assistant within Trackunit Manager in summer 2026.

      Alongside AI, the 2026 roadmap includes: (1) IrisX Blueprints—reusable, pre-built solution templates available on the Marketplace covering Smart Servicing, Out-of-Contract Usage detection, Custom Reporting, Site Optimization, and Data-Driven Product Design; (2) Portals—branded, customizable fleet data sharing interfaces already live with Sunbelt Rentals UK & Ireland; (3) Inspections—mobile pre-use safety check workflows via the Trackunit On app, connecting field safety data to fleet health (Trackunit company-stated data: overlooked hazards contribute to 30% of workplace incidents; digitized inspections can cut maintenance costs up to 25%); and (4) the Fit App for connectivity health monitoring from first device install.

      On the ecosystem front, Trackunit's open developer approach—GraphQL/REST APIs, Iris App SDK, Marketplace distribution—positions IrisX as a platform for third-party construction technology builders. IrisX was recognized by Databricks 2025 Data + AI Awards, and Bosch Rexroth and Irdeto are named as recent strategic ecosystem partners. The IPAF partnership (ePAL credential app surpassing 1 million downloads) links the Pass access product to the global powered-access certification body.

      The product portal (trackunit.com/product-portal/) provides public transparency on the roadmap status ("planned, building, launched") as an ecosystem signaling mechanism.
