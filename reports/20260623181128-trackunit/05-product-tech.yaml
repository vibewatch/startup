  - id: trust-security-compliance
    title: Trust, Security & Compliance
    body: >
      Trackunit publishes a Trust Center (trust.trackunit.com) with a Platform Security FAQ, compliance documentation, and a live status page. The published security principles are: continuous scanning and monitoring; data encryption in transit and at rest; regular third-party penetration testing; 24/7/365 DevOps monitoring; dedicated ethical-hacker training for engineers; and GDPR-aligned personal data handling.

      Hardware security: the TU700 uses DTLS 1.2 with NIST-recommended cipher suites for device-to-platform communication. Platform-level REST communication runs over HTTPS. User identity data is managed through a third-party Identity Management provider that holds SOC 2, SOC 3, ISO 27001, ISO 27017, ISO 27018, and CSA Star Level 2 certifications; Trackunit does not name the provider publicly. Business-level SSO and adaptive MFA are available per customer account. Trackunit references ISO 27001 compliance in its IrisX platform documentation, but no certificate or audit report is available for public download from the Trust Center as of the run date.

      GDPR posture: Trackunit acts as data processor on behalf of customer controllers. A Data Processing Agreement (DPA) is provided for EU/EEA customers; Standard Contractual Clauses (SCCs) are provided for non-EEA transfers. The company states that data is processed within the EEA unless explicitly otherwise contracted. The named Data Protection Officer is Thomas Christiansen ([email protected]). Sub-processor lists are published and change notifications are available by email subscription.

      Uptime: Trackunit Manager reported 100% uptime over the trailing 90 days as of June 23, 2026, per the public status page. Known incidents in the preceding 60 days include a data delay in Manager on May 27, 2026 (resolved same day), two asset metadata update delay incidents, a one-time data delay in the SCOM ONE i3 M-Series integration, and a degraded performance event in Manager and Verify approximately two months prior. No major outage is recorded in the 90-day window. No public SOC 2 Type II attestation report is available from the Trackunit Trust Center, a diligence gap for enterprise procurement.

      User review signals: Capterra users give Trackunit 4.3/5 across 26 reviews, with positive notes on ease of use, CAN data value, and service schedule features. Negative reviews cite hardware installation quality failures (water ingress, short circuits on improperly fitted devices), unresponsive phone support for cancellations, and billing disputes on contract termination. These surface as implementation-layer risks rather than platform-level failures.
