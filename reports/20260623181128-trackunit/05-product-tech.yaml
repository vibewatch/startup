callouts:
  - calloutType: strength
    title: "ISO 15143-3 / AEMP 2.0 Full Implementation"
    body: "Trackunit is one of the few construction telematics platforms with a fully documented ISO 15143-3 AEMP 2.0 REST API, including time-series endpoints, pagination per standard, XML and JSON output, and localized fault code descriptions. This reduces OEM integration friction for mixed-fleet operators who would otherwise maintain separate portal connections per brand."
    claimRefs:
      - CE021
      - CE022
      - CE023

  - calloutType: strength
    title: "IrisX MCP: AI-Native Fleet Intelligence"
    body: "The June 2026 launch of the IrisX MCP server positions Trackunit as an early mover in connecting construction equipment data to mainstream AI assistants via the open Model Context Protocol. The approach avoids proprietary lock-in and allows customers to use their existing AI tooling, lowering the adoption barrier compared to embedded-only AI features."
    claimRefs:
      - CE036
      - CE040

  - calloutType: risk
    title: "Hardware Installation Quality as Operational Risk"
    body: "Capterra user reviews persistently cite hardware installation failures (water ingress, loose connections, incorrect fitting) as the primary cause of device outages and data gaps. While the Fit App (2026) addresses this going forward, the existing installed base may carry latent installation quality risk that inflates apparent platform unreliability and generates churn."
    claimRefs:
      - CE044
      - CE045

  - calloutType: risk
    title: "Security Certification Transparency Gap"
    body: "Trackunit references ISO 27001 compliance and SOC 2 via its identity provider, but no Trackunit-own ISO 27001 certificate or SOC 2 Type II attestation report is publicly available for download. Enterprise procurement teams in regulated industries will require these documents; their absence is a diligence friction point."
    claimRefs:
      - CE046
      - CE047

  - calloutType: insight
    title: "BLE Network Dependency on Machine Power Creates Coverage Asymmetry"
    body: "The Trackunit Network's self-sustaining expansion model relies on powered machines carrying Raw devices as gateway nodes. On quiet sites, in off-season periods, or during bulk equipment repositioning, BLE coverage contracts. Beam gateways mitigate this for static indoor locations but introduce a separate hardware procurement step."
    claimRefs:
      - CE019
      - CE020
      - CE050

