  - id: customer-workflow-deployment
    title: Customer Workflow & Deployment Model
    body: >
      Trackunit's deployment path splits between factory-embedded and retrofit models. OEM customers order equipment with Raw devices pre-installed; fleet operators receive machines that are network-connected on delivery. Rental companies and contractors retrofitting existing fleets use Trackunit's field installation services, self-installation guides, and the Fit App (introduced 2026) that guides installers through device setup and validates connectivity before data reaches IrisX. This last step is positioned as a critical quality gate given that user reviews attribute data gaps and false positives to poor hardware installation.

      Once connected, a typical operational flow involves: (a) Raw/TU700 streaming CAN J1939 diagnostics and GPS to Iris over cellular; (b) Kin T200 BLE tags on tools detected by the 450,000+ gateway nodes and forwarded to IrisX; (c) IrisX normalizing and governing multi-OEM, multi-device data into a unified asset view; (d) fleet managers and depot staff accessing utilization, health alerts, and fault codes in Trackunit Manager; (e) field technicians receiving machine status on Trackunit Go and logging repair notes; (f) IrisX APIs feeding rental management systems, ERPs, and BI tools with structured data; and (g) IrisX MCP or conversational AI surfacing fleet intelligence to operations teams through standard AI client tools.

      Contractors use Trackunit Pass to enforce operator access policies: only credentialed personnel can start controlled equipment, with pre-use inspection checklists digitized via the On app before machine unlock. Rental companies deploy Portals to share utilization and sustainability metrics with customers without requiring those customers to hold Trackunit accounts.

      The Beam gateway product extends BLE coverage indoors and in storage yards, addressing the gap where asset tags go dark when equipment leaves an open site area. Network coverage is self-reinforcing: each powered machine with a Raw device or BLE gateway extends visibility for nearby Kin and Spot tags.
