      - number: '5.3'
        title: OEM Connectivity & Industry Standards
        blocks:
          - type: paragraph
            body: >
              Trackunit's OEM integration model operates at two distinct levels: factory-embedded hardware and
              data-layer standards. At the hardware layer, Trackunit partners with 150+ OEMs to pre-install Raw
              telematics devices on machines at the factory floor, meaning fleet owners receive connected equipment on
              delivery without requiring retrofit. The TU700 supports two-way OTA configuration: CAN profile updates,
              Modbus profile changes, and Operating Mode adjustments can be pushed remotely through the Telematics
              Device API, with rollback capability added in June 2026 that restores previous device states if a
              configuration job needs reversal.

              At the data standards layer, Trackunit fully implements ISO 15143-3 (the AEMP 2.0 telematics standard for
              construction equipment). The AEMP ISO Export API is a REST interface serving XML or JSON at the caller's
              choice, covers fleet snapshot endpoints available to all customers, and provides time-series endpoints for
              Evolve & Expand and Link-Lift-Leap subscription tiers. The API implements ISO 15143-3 pagination as
              specified in the standard and exposes the base URL pattern
              iris.trackunit.com/public/api/aemp/v2/15143/-3/Fleet/. Trackunit extends the standard with optional
              addMetadata=true and addExtendedData=true query parameters surfacing proprietary fields beyond the ISO
              schema.

              In 2025 Trackunit added a CAN Faults API v1 exposing diagnostic trouble code data collected via CAN J1939
              on connected equipment. The AEMP ISO Faults endpoint was enhanced in May 2026 to return localized fault
              code descriptions via Accept-Language, supporting localization across English, German, French, Italian,
              Spanish, Dutch, Polish, and Japanese where OEM translation data exists.

              The ISO feed Marketplace node on the developer hub lists third-party OEM telematics feeds as importable
              integrations, allowing fleet operators using non-Trackunit-native OEM portals to normalize that data into
              IrisX. Trackunit's Marketplace documents 60+ such OEM data sources.
            claimRefs:
              - CE010
              - CE011
              - CE021
              - CE022
              - CE023
              - CE024
