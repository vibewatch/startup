              - CE022
              - CE023
          - type: callout
            title: 'IrisX MCP: AI-Native Fleet Intelligence'
            body: >-
              The June 2026 launch of the IrisX MCP server positions Trackunit as an early mover in connecting
              construction equipment data to mainstream AI assistants via the open Model Context Protocol. The approach
              avoids proprietary lock-in and allows customers to use their existing AI tooling, lowering the adoption
              barrier compared to embedded-only AI features.
            calloutType: strength
