      - number: '6.5'
        title: Concentration Risk and Adverse Evidence
        blocks:
          - type: paragraph
            body: >
              Trackunit's OEM-centric go-to-market creates structural concentration risk at the channel level. The
              FactMR off-highway telematics market analysis (April 2026) projects OEM factory-installed systems at 64%
              market share by 2026, with Caterpillar, John Deere, Komatsu, and Trimble all expanding proprietary
              ecosystems. While Trackunit benefits from this shift through its 100+ OEM integrations, the same shift
              creates a risk that large OEMs developing or acquiring in-house telematics platforms may reduce or
              eliminate their Trackunit dependency. The Platform Science acquisition of Trimble's telematics business
              (late 2024) and the DEVELON MY platform launch exemplify how OEM-side consolidation can redraw the market.

              No single named customer is confirmed to account for more than 10% of Trackunit revenue, but the company
              does not disclose revenue concentration data. Hg Capital's portfolio page and the Goldman Sachs investment
              announcement both cite Trackunit's "global diversified customer base spanning the full construction value
              chain," which is consistent with limited single-customer concentration, but this is unverified by any
              third-party financial filing.

              Partner dependence is a secondary risk. Hilti, Skyjack, Epiroc, Bosch Rexroth, and Danfoss each bring
              significant scale to the Trackunit ecosystem. If any of these partners—particularly Hilti (500K+ devices
              in Trackunit network) or Skyjack (multi-year production OEM)—were to migrate to a competing platform or
              build proprietary telematics, the impact on Trackunit's connected-asset count and revenue would be
              material. These partnerships have no publicly disclosed minimum-term or exclusivity provisions.

              Adverse customer evidence documents real execution gaps. A Capterra review rated Trackunit 1/5 stars,
              describing hardware fitted so poorly that water damaged connections, persistent battery drain, months of
              failed attempts to reach support, threats of debt collection for disputed charges, and an inaccessible
              cancellation process. The Trustpilot aggregate stands at 1.8/5 from 32 reviews, contrasting sharply with
              the curated FeaturedCustomers 4.8/5. G2 shows a 2.8/5 average from 6 reviews. These review scores are
              concentrated in the SMB and independent operator segment and suggest that Trackunit's post-sale support
              model is not scaled to serve the long tail of smaller customers. The divergence between
              high-reference-quality named enterprise accounts and poor SMB review sentiment is a diligence flag: churn
              and negative word-of-mouth in the long tail may be structurally higher than the headline customer success
              narrative suggests.

              Channel/procurement friction appears low for OEM-embedded deployments (hardware is pre-installed at the
              factory) but higher for aftermarket retrofits where installation quality, SIM compatibility (as Leadway
              documented in Thailand), and ongoing support accessibility are pain points cited across multiple adverse
              sources.
