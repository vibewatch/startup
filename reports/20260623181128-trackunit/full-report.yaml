      - number: '5.2'
        title: Technology Architecture & Developer Platform
        blocks:
          - type: paragraph
            body: >
              IrisX is architected as a data lakehouse hosted across European public and private cloud providers. The
              platform continuously ingests device telemetry, OEM data feeds, and enterprise business data, normalizes
              them into structured schemas, and exposes results through a layered API surface. Specific cloud provider
              names (AWS, Azure, GCP, or private colocation) are not publicly disclosed; Trackunit states only that all
              processing occurs within Europe and that hosting entities hold the required DPAs.

              The developer-facing surface consists of both a GraphQL API (with an explorer and visualizer interface on
              the developer hub) and a collection of versioned REST APIs covering assets, alarms, sites, CAN faults,
              telematics device configuration, fleet data health, emissions, webhooks, and ISO 15143-3 AEMP feeds. The
              Iris App SDK provides a React-based framework—migrated from Rspack to Vite in early 2026—for building
              custom applications that run inside Trackunit Manager and are distributed via the Marketplace. As of June
              2026 the developer changelog shows Assets API v2, Bluetooth Tag Configuration API v1, Fleet Data Health
              API v1beta1, CAN Faults API v1, and Compaction App API v1 among recent additions.

              All communication between field hardware, Iris services, Manager, Go, and IrisX uses HTTPS/REST
              encryption. Legacy TU700 hardware communicates over DTLS 1.2 using NIST-recommended cipher suites via a
              commercial security library. The Iris platform is deployed in redundant configurations supporting hot
              patching and dynamic scaling; the DevOps team operates a 24/7 on-call programme with automated alerting on
              continuous monitoring tests. The Trackunit Network relies on powered machine batteries to run BLE gateway
              nodes, creating an infrastructure dependency where network coverage contracts when sites go quiet.

              The Trackunit Marketplace hosts 176+ apps and integrations and aggregates 60+ OEM telematics data sources,
              covering ERP connectors, rental management systems, sustainability reporting tools, CRM linkages, BI
              bridges, and diagnostics apps from OEM engine and powertrain brands including Perkins.
