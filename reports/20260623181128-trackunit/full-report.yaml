      - number: '2.5'
        title: Sizing Gaps, Diligence Asks, and Contradictions
        blocks:
          - type: paragraph
            body: >-
              Three categories of analytical gaps persist. First, market-definition inconsistency: the
              IoT-in-construction TAM of USD 17.9 billion includes hardware, while the addressable SaaS/software
              sub-segment Trackunit competes in is materially smaller—secondary analyst estimates for a pure
              construction-equipment telematics software market range from USD 2.5 billion to USD 10.6 billion by 2031
              depending on scope (platform subscriptions only vs. hardware + services), and no credible independently
              published SAM figure for the multi-OEM mixed-fleet SaaS layer exists. Second, European sub-market revenue:
              Trackunit's Nordic/European origin and claimed European leadership in rental telematics cannot be
              cross-checked against public European construction-telematics market revenue figures; ERA and FIEC do not
              publish telematics spend breakdowns. Third, penetration rate uncertainty: the number of globally deployed
              construction machines (estimated at 1.5–3 million heavy units in active service, excluding light/compact
              and tools) and the share carrying any active telematics subscription is not independently validated;
              Trackunit's claim of 1 million+ connected machines could represent a market penetration of 33–67 % or
              substantially less, depending on the total addressable fleet definition.

              These gaps preserve meaningful uncertainty around the SAM/SOM build-up and mean any single top-down
              estimate should be treated with caution. The TAM contradiction between the Mordor IoT-in-construction
              figure ($35.8 B by 2031) and the Allied Market Research construction-equipment market ($313.9 B by 2031 at
              4.8 % CAGR) illustrates that scope mismatches drive most apparent discrepancies—the former covers
              software/services IoT, the latter the entire equipment market.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
