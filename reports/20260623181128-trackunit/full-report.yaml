      - number: '3.2'
        title: Direct Platform Competitors
        blocks:
          - type: paragraph
            body: >-
              Samsara is Trackunit's most formidable competitor at scale. Its Connected Operations Platform reported
              $1.9 billion in FY26 ARR with 30% year-over-year growth, and processes more than 25 trillion data points
              annually—a data moat that fuels AI model improvements for all customers. Samsara targets construction,
              transportation, logistics, and utilities with a unified platform covering vehicles, trailers, assets,
              routing, navigation, and maintenance. Its expansion model typically begins with video telematics or
              vehicle fleet tracking and grows into construction equipment monitoring via asset gateways and tags; Q4
              FY26 noted Estes expanding from vehicle telematics into equipment monitoring. Samsara's NRR is strong with
              96% of $100K+ ARR customers using at least two products, indicating platform stickiness. However, Samsara
              is not construction-specific: it does not offer the same depth of OEM data normalization, AEMP/ISO feed
              integration, or construction-vertical AI that Trackunit provides through IrisX. Geotab is the #1 ranked
              commercial telematics platform (ABI Research) with an open marketplace of 350+ partner solutions and an
              estimated $700M+ annual revenue. Geotab's open data platform and extensive reseller network provide
              competitive reach, but construction accounts for only approximately 8% of its customer base, and its
              product is built for on-road fleet management rather than off-highway machine health. Teletrac Navman
              offers a strong compliance and routing-focused suite (ELD, driver scorecard, video telematics, fleet
              maintenance) popular with fleet-heavy contractors operating commercial vehicles alongside heavy equipment.
              GPS Insight provides real-time GPS fleet tracking with maintenance alerts and 60+ pre-built reports,
              competing primarily in the SMB and mid-market contractor segment. Construction-specific platforms Tenna
              (700+ construction businesses) and Hapn target Trackunit's contractor footprint directly: Tenna unifies
              equipment, vehicles, tools, attachments, and materials in a single system built by contractors, while Hapn
              offers flexible month-to-month pricing versus Trackunit's typical 36–42 month contract requirement— a
              noted adverse differentiator identified by users evaluating alternatives.
