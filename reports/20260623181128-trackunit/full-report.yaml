      - number: '3.5'
        title: Moat Assessment and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Trackunit's most durable competitive advantages are its construction-specific data network effect, OEM
              co-optation model, and the depth of its mixed-fleet normalization layer. With 2+ million connected
              construction assets generating continuous telemetry, Trackunit accumulates proprietary behavioral
              benchmarks and fault-code libraries that are costly and time-intensive for general-purpose telematics
              vendors to replicate. Its IrisX platform—launched August 2024—provides a construction-industry-specific AI
              and data layer with ISO 27001 information security certification, GDPR alignment, and Cyber Essentials
              Plus accreditation, enabling OEM partners to build branded customer portals and AI-powered maintenance
              applications on top of Trackunit's data infrastructure rather than building independently. Trackunit's
              positioning as an OEM enabler rather than OEM displacer is a key strategic distinction: McKinsey research
              cited by Trackunit indicates that aftermarket services can represent up to 40% of an equipment OEM's
              annual profit, creating strong incentives for OEMs to partner with a platform that turns connectivity into
              aftermarket revenue. Adverse evidence is nonetheless material. The shift to OEM-bundled telematics (64%
              market share projected for factory-installed systems by 2026) commoditizes basic GPS tracking and health
              monitoring at the hardware layer, squeezing aftermarket telematics vendors. Trackunit's 36–42 month
              contract structure is explicitly cited as a disadvantage versus newer flexible platforms such as Hapn and
              Samsara, which offer month-to-month terms or transparent per-asset pricing. Trackunit's pricing
              opacity—all plans are quote-based—creates friction in self-serve evaluation funnels favored by the next
              generation of fleet managers. The dependency of Trackunit's API ecosystem on OEM data access creates a
              latent ecosystem risk: if major OEMs tighten API access or introduce proprietary data licensing,
              Trackunit's mixed-fleet normalization value proposition weakens. Construction telematics is also entering
              a phase of feature parity at the basic utilization and GPS layer: equipment tracking software is now
              ranked ninth out of ten by WorldMetrics in 2026 for the Trackunit platform compared to general-fleet
              leaders—a sign that the broader market does not yet see IrisX's advanced capabilities as fully
              differentiated in the mainstream evaluation set. The moat risk register and KPI summary below quantify
              these risks and Trackunit's mitigation vectors.
