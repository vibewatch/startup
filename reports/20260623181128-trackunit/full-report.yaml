            title: ISO 15143-3 / AEMP 2.0 Full Implementation
            body: >-
              Trackunit is one of the few construction telematics platforms with a fully documented ISO 15143-3 AEMP 2.0
              REST API, including time-series endpoints, pagination per standard, XML and JSON output, and localized
              fault code descriptions. This reduces OEM integration friction for mixed-fleet operators who would
              otherwise maintain separate portal connections per brand.
            calloutType: strength
            claimRefs:
