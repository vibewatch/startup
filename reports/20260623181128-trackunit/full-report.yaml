  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Trackunit operates at the intersection of three overlapping markets: (1) construction- equipment
              telematics—hardware and software for locating, monitoring, and diagnostics of heavy machines; (2)
              industrial IoT platforms for construction—broader cloud, analytics, and workflow software layers; and (3)
              rental-fleet management software—asset-tracking and utilisation systems used by equipment rental
              operators. The relevant spend boundary includes hardware modems, SIM connectivity, cloud-platform
              subscriptions, API data feeds, and third-party app integrations built on top of the telematics data layer.
              Excluded are the construction-equipment hardware market itself (USD 205–226 billion globally),
              project-management software (e.g. Procore, Autodesk Construction Cloud), and autonomous or robotic
              equipment, which use telematics data as inputs but are separate procurement decisions. The status-quo
              alternative for most buyers is OEM-proprietary telematics (Cat Connect, KOMTRAX, Volvo CareTrack) that
              covers single-brand fleets only; Trackunit's SAM is the share of equipment owners with mixed-OEM fleets or
              a need for aggregated cross-brand data and workflow integrations. Adjacent markets include fleet
              telematics for transportation/logistics vehicles, building management systems, and site-access-control
              platforms—all adjacent but structurally distinct buyer journeys.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
