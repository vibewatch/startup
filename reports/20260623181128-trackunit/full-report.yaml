  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Trackunit addresses four interlocking customer segments across the construction value chain: OEMs, rental
              companies, contractors, and marketplace/app-ecosystem partners. OEMs are the structural anchor of the
              go-to-market model. With 100+ OEM data integrations, Trackunit embeds connectivity into factory-standard
              equipment from brands including Skyjack (a Linamar division), Epiroc, Jekko, Danfoss Power Solutions,
              Bosch Rexroth, Hilti, Dinolift, AUSA, and Leadway Heavy Machinery. OEM partnerships follow two
              sub-patterns: (1) factory-install programs where Trackunit hardware is embedded at the production line,
              and (2) co-branded OEM portals where the OEM white-labels the IrisX platform for its dealer and
              end-customer network. The Works With Trackunit program formalises compatibility and validation for new OEM
              hardware and component makers.

              Rental companies represent Trackunit's highest-revenue-per-seat segment. The platform targets mixed-fleet
              operators who manage equipment from multiple OEM brands simultaneously, a use case where Trackunit's
              aggregated CAN-bus and ISO feed capabilities deliver clear differentiation over single-OEM proprietary
              systems. Sunbelt Rentals UK & Ireland (an Ashtead Group subsidiary) is the flagship named rental customer
              as of 2026, connecting 20,000+ assets through a new IrisX Portals deployment enabling branded
              customer-facing dashboards. Rental customers use the platform for utilisation reporting, preventive
              maintenance scheduling, theft recovery, out-of-contract usage billing, and carbon emissions tracking.

              Contractors comprise Trackunit's third segment, using the platform primarily for jobsite fleet visibility,
              idle-time reduction, subcontractor asset coordination, and access management. Gammon Construction (7,000+
              employees, operating across Hong Kong, Singapore, and mainland China) is the most publicly documented
              contractor customer, with a production deployment delivering fuel-consumption reduction, improved
              equipment utilisation, and AI-driven safety monitoring. Trackunit estimates construction equipment spends
              30–40% of workday idling; contractor use cases target this directly.

              The Marketplace and developer ecosystem constitute a fourth channel. The Trackunit Marketplace hosts 60+
              OEM data feeds and 168+ third-party applications and integrations as of 2026. Partners include Hilti
              ON!Track (asset management integration), RentalMan by Wynne Systems, Point of Rental, Clue (construction
              equipment management), Cummins Connected Diagnostics, and IPAF Link (operator certification validation).
              The Blueprints programme (reusable analytical workflows) is designed to reduce time-to-value for customers
              by providing pre-built operational templates for maintenance triage, revenue recovery, and sustainability
              reporting.
