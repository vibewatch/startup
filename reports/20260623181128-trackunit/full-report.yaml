      - number: '7.2'
        title: Cybersecurity and Operational Risks
        blocks:
          - type: paragraph
            body: >
              Trackunit's IRIS platform manages more than 3.5 million connected off-highway assets, making it a
              high-value target in a sector experiencing aggressive escalation in IoT-directed cyber attacks. Across the
              IoT sector, breach attempts grew approximately 84% in 2025-2026, with an estimated 820,000 malicious daily
              attempts targeting IoT infrastructure via default credentials, open ports, and unpatched firmware.
              Trackunit holds ISO/IEC 27001:2022 certification for IRIS, operates a public trust center with real-time
              incident disclosure, performs third-party penetration testing, and encrypts customer data in transit and
              at rest. No confirmed major breach has been publicly reported as of mid-2026. However, significant risks
              remain: the ISO 27001 scope covers only the IRIS SaaS platform and does not extend to legacy hardware
              products or third-party OEM integrations. Trackunit does not publicly confirm a standalone SOC 2 Type II
              attestation at the company level — only underlying identity providers are stated to be SOC 2 certified,
              creating an audit gap for enterprise security reviews. The company's public developer hub and API
              documentation expose internal data schema and streaming topology, widening the adversary reconnaissance
              surface. Cloud-side risks in 2026 include IAM misconfigurations, insufficient access controls, and
              third-party SaaS integration exposures, all of which are relevant to a platform with 100+ OEM API
              integration points.
