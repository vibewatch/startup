      - number: '4.3'
        title: Capital Structure and Adequacy Under Goldman Sachs Ownership
        blocks:
          - type: paragraph
            body: >
              Goldman Sachs Alternatives (Private Equity) acquired just over 50% of Trackunit from Hg and GRO Capital in
              a transaction announced February 10, 2025 and closed June 16, 2025. Hg reinvested as a significant
              minority holder alongside Goldman Sachs. Goldman Sachs previously owned Trackunit from 2015 to 2021,
              providing institutional continuity and a known portfolio thesis.


              Danish media outlet Børsen reported the enterprise value at approximately DKK 10bn (~USD 1.44bn), implying
              an EV/EBITDA multiple of approximately 26.7× on the 2024 EBITDA of DKK 374m. This premium valuation
              reflects the high-recurring-revenue composition, projected ARR growth, and category leadership in
              construction telematics, but is at the upper bound of comps for private industrial SaaS businesses.


              The LBO was structured with approximately USD 500m of term debt plus a USD 100m acquisition facility (~USD
              600m total), equating to roughly 8× cash EBITDA leverage — at the high end of private credit tolerance for
              SaaS. Pre-transaction existing facilities totaled approximately €305m, underwritten by SMBC Group and Park
              Square Capital as incumbent lenders. KKR joined as an additional underwriter in the 2025 debt package;
              pricing was guided at approximately 500–525 basis points over the base rate on a unitranche club
              structure. Herter & Co. (a Teneo company) served as exclusive Debt Advisor to Goldman Sachs Alternatives.


              Capital adequacy under this structure depends critically on continued ARR growth. At ~8× EBITDA leverage,
              any sustained slowdown — including the macro headwinds that compressed Trackunit's revenue growth from 18%
              in 2023 to 10% in 2024 — would tighten debt covenant headroom materially. The company's free cash flow
              conversion rate, cash interest obligations under the new facilities, and covenant maintenance tests are
              not publicly disclosed, leaving capital adequacy judgment incomplete without direct diligence access.
            claimRefs:
