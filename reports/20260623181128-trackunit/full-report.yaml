      - number: '3.4'
        title: Adjacent Alternatives and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Beyond direct platform competitors and OEM systems, Trackunit faces adjacent solutions that solve parts of
              the same job. Hilti ON!Track addresses small-tool and equipment asset management within the Hilti hardware
              ecosystem using BLE smart tags and GPS geo-tags, with deep integration into Trimble Viewpoint and Vista
              for job costing. Its scope is tools and attachments rather than heavy equipment telematics, making it an
              adjacent rather than direct competitor, but it captures wallet share from contractors who are willing to
              standardize asset management within a single proprietary ecosystem. Following its February 2025
              divestiture of global transportation telematics operations to Platform Science—in which Trimble became a
              shareholder and board member—Trimble retained its construction-specific asset tracking (Trimble Asset
              Tracking), machine control, and Trimble Construction One ecosystem. WorldMetrics ranked Trimble Asset
              Tracking #2 among construction equipment tracking platforms in 2026, behind Geotab, indicating continued
              competitive relevance in the construction contractor segment. The status-quo substitute—manual inventory,
              paper logs, Excel spreadsheets—remains the default for a large share of smaller contractors. Trackunit's
              own data suggests that 10% of an average workday is wasted searching for tools and equipment, quantifying
              the cost of the status quo that Trackunit must convert. Internal build is a realistic substitute for large
              rental companies and OEMs with dedicated technology teams, particularly those seeking full data
              sovereignty. However, the development cost, time-to-market, and maintenance burden of proprietary
              platforms are significant deterrents. Geotab's marketplace ecosystem of 350+ solutions and Trackunit's
              marketplace of 60+ data sources both benefit from network effects that make internal build progressively
              less attractive as the ecosystems mature.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP029
              - CP030
              - CP031
              - CP033
