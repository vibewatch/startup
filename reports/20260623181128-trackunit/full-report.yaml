      - number: '4.2'
        title: Financial Performance and Operating Scale
        blocks:
          - type: paragraph
            body: >
              Trackunit reported net revenue of USD 186.5m (DKK 1.29bn) for fiscal year 2024, a 10% year-on-year
              increase from USD 170m in 2023, which itself represented an 18% rise on 2022. ARR grew faster than total
              revenue in 2024, up 17% to USD 119.5m (DKK 812.6m), reflecting ongoing software mix-shift acceleration.
              Recurring revenue's share of total revenue increased from 92% in 2023 to over 95% in 2024.


              EBITDA for 2024 was approximately DKK 374m (~USD 54m on an accounting basis), with Octus reporting cash
              EBITDA of USD 62m (the figure used in deal marketing). The delta between accounting and cash EBITDA
              reflects standard LBO adjustments including non-cash compensation and one-time costs. Gross profit was DKK
              889.4m, implying a blended gross margin of approximately 68.9% — consistent with a platform generating
              ~95% SaaS revenue carrying cloud/connectivity COGS and ~5% hardware revenue with lower device-level
              margins. Net income for 2024 was DKK 188.25m; equity totals DKK 1.64bn; total assets DKK 3.24bn.


              Trackunit's revenue CAGR between 2022 and 2025 was approximately 15%; ARR CAGR for the same period was
              approximately 22%, confirming software is growing materially faster than total revenue. Deal marketing
              projected 21% total revenue CAGR and 25% ARR CAGR through 2029, with EBITDA margins stable around 30% —
              sponsor-optimistic projections that require corroboration against actuals as the new debt service
              structure takes hold.


              Headcount reached approximately 499 globally by December 2025 per Revelio Labs workforce intelligence,
              compared to ~450 cited in the March 2025 annual results announcement. The 2024 revenue-per-employee ratio
              was approximately USD 410K (USD 186.5m on ~455 FTE), above SaaS sector medians for companies at this
              scale. Active job postings surged 192% in 2025 to 97 open roles, signaling material hiring acceleration
              post-Goldman Sachs investment. CEO Søren Brogaard reported an employee eNPS of 62 in 2024, placing
              Trackunit in the top 10% of SaaS companies (sector average ~30). Monthly active users reached 26,000 in
              2023; connected assets exceeded 3 million as of March 2025 and 6.5 million by April 2026, implying rapid
              platform network expansion.
