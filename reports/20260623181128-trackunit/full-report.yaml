  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Why It Matters
      - Impact on Judgment
      - Diligence Path
    rows:
      - - Net Revenue Retention (NRR) and Gross Revenue Retention (GRR)
        - >-
          Primary measure of recurring revenue quality and churn; ARR growth alone cannot distinguish new logo vs.
          expansion vs. churn contribution
        - Blocking — cannot underwrite ARR durability or LBO debt coverage without NRR history
        - Request annual NRR/GRR waterfall by cohort year and by tier (OEM, Rental, Contractor); 3-year trend
      - - Customer Acquisition Cost (CAC) and CAC Payback Period
        - Measures S&M efficiency and growth cost; critical for estimating FCF at current growth rate under LBO
        - >-
          Material — determines whether 21% projected revenue growth is capital-efficient or requires incremental S&M
          investment disproportionate to EBITDA growth
        - Request fully loaded CAC by channel, segment, and geography; payback period vs. ACV; LTV/CAC ratio
      - - Hardware vs. SaaS Gross Margin by Segment
        - Blended 69% GM conflates very different economics; SaaS platform GM likely 75–85%, hardware likely 15–30%
        - Material — determines true SaaS platform profitability and mix sensitivity as hardware share declines further
        - Request P&L by revenue line (subscription revenue, device revenue, professional services); COGS breakdown
      - - ARR by Geography and Customer Segment
        - >-
          Geographic concentration (US ~50%) and customer concentration (top 10 = ~50% of revenue) create correlated
          risk that needs decomposition
        - >-
          Material — single-region or single-segment shock could materially affect ARR without being visible in blended
          figures
        - Request ARR by region (NA, Europe, APAC), by customer type (OEM, Rental, Contractor), and by ARR band
      - - Free Cash Flow vs. EBITDA Reconciliation
        - >-
          Under 8× leverage, cash interest (~USD 35–50m/yr estimated at ~7% on USD 500m term) is a major FCF drag; net
          FCF determines actual debt coverage and investment capacity
        - >-
          Blocking for capital adequacy — EBITDA margin of 29–33% may shrink to single-digit FCF margin after debt
          service
        - >-
          Request FCF reconciliation (capex, working capital, cash interest, tax); confirm cash EBITDA vs. covenant
          EBITDA definitions
      - - Leverage Covenant Structure and Headroom
        - >-
          8× leverage at LBO close; any sustained growth deceleration triggers covenant pressure; maintenance vs.
          incurrence test distinction is critical
        - >-
          Blocking — determines whether any 2025–2026 revenue slowdown (like the drop from 18% to 10% in 2024) already
          strains headroom
        - >-
          Request credit agreement abstract; financial maintenance covenant levels, quarterly headroom calculations, and
          any cure provisions
    notes: >-
      All gaps are confirmed absent from public disclosures as of the June 2026 run date. Severity ratings reflect the
      judgment that capital adequacy under 8× LBO leverage cannot be meaningfully assessed without free cash flow, NRR,
      and covenant data.
    claimRefs:
      - CI038
      - CI039
      - CI007
      - CI020
