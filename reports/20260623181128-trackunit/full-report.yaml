companyProfile:
  summary: >-
    Trackunit is a Danish construction-technology company that combines telematics hardware, connectivity,
    fleet-management software, and an operating-data platform for off-highway equipment. Its product suite spans
    Trackunit Manager, Trackunit Go, Kin asset tracking, marketplace/API integrations, and the IrisX platform, which
    together support OEMs, rental fleets, dealers, and contractors seeking to reduce downtime and improve utilization.
    After two prior private-equity ownership periods, Goldman Sachs Alternatives regained majority control in June 2025
    with Hg reinvesting as minority shareholder, leaving Trackunit as a scaled but still private, sponsor-backed
    industrial SaaS asset.
