chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and strategic mission
        blocks:
          - type: paragraph
            body: >
              Trackunit traces its roots to M-Tec A/S, established in 1998 in Aalborg, Denmark. The Trackunit brand was
              formally established in 2003, and the company's About page describes the transition from a local provider
              of IoT tracking devices to a global SaaS company and thought leader serving the entire construction
              ecosystem. Headquarters remain in Aalborg, with offices in North America, Europe, and Asia Pacific. The
              company's publicly stated mission is to "eliminate downtime" in construction and to "build the most useful
              industry for the world by orchestrating the data and infrastructure that connects construction."

              Trackunit operates as a private SaaS-led platform provider. Its revenue model is dominated by recurring
              subscription software, with recurring revenue representing more than 95% of total revenue as of 2024. Net
              revenue for 2024 was DKK 1.29 billion (approximately USD 187 million), a 10% increase on 2023. Annual
              Recurring Revenue (ARR) grew 17% year-on-year to DKK 812.6 million (approximately USD 119.5 million). CEO
              Søren Brogaard characterized the macroeconomic environment as "challenging" due to a European slowdown,
              making the in-line-with-expectations result a meaningful outcome. As of the February 2025 Goldman Sachs
              investment announcement, approximately 3.5 million visible assets were connected to the platform, and the
              company processes more than 2 billion data points daily.

              A key diligence caution for later chapters: Trackunit is privately held and publishes no independently
              audited financials. All revenue, ARR, and asset-count figures cited in this chapter are sourced from
              company press releases or investor-authored publications and have not been verified by a third-party
              auditor accessible to the public.
