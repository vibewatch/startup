      - CV039
      - CV040
  - id: FV004
    title: 'Investment KPI Scorecard: IC-Ready Scoring Across Eight Dimensions (Scale 1–10)'
    type: kpi
    layout: standard
    summary: >-
      Trackunit scores well on market opportunity, competitive moat, and financial quality but weak on valuation and
      exit readiness; composite score of 6.4/10 supports Track, not Buy.
    data:
      items:
        - label: Market Opportunity
          value: 8
        - label: Competitive Moat
          value: 8
        - label: Platform / Product
          value: 7
        - label: Financial Quality (ARR, margins)
          value: 7
        - label: Revenue Growth Rate
          value: 6
        - label: Valuation (entry multiple)
          value: 3
        - label: Exit Readiness
          value: 4
        - label: Evidence Quality
          value: 6
        - label: Management & Execution
          value: 7
        - label: Risk-Adjusted Return
          value: 5
    approximationNotes: >-
      Scores are analyst judgment on a 1–10 scale; not actuarial. Composite is simple average (6.4/10). Valuation (3/10)
      reflects the stretched 26.7x EV/EBITDA and growth-adjusted multiple vs. peers. Exit Readiness (4/10) reflects lack
      of disclosed IPO plans or strategic buyer engagement.
    claimRefs:
      - CV032
      - CV034
      - CV039
      - CV042
