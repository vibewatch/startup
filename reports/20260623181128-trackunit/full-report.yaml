            title: Hardware Installation Quality as Operational Risk
            body: >-
              Capterra user reviews persistently cite hardware installation failures (water ingress, loose connections,
              incorrect fitting) as the primary cause of device outages and data gaps. While the Fit App (2026)
              addresses this going forward, the existing installed base may carry latent installation quality risk that
              inflates apparent platform unreliability and generates churn.
            calloutType: risk
            claimRefs:
              - CE044
              - CE045
          - type: callout
            title: Security Certification Transparency Gap
            body: >-
              Trackunit references ISO 27001 compliance and SOC 2 via its identity provider, but no Trackunit-own ISO
              27001 certificate or SOC 2 Type II attestation report is publicly available for download. Enterprise
              procurement teams in regulated industries will require these documents; their absence is a diligence
              friction point.
            calloutType: risk
            claimRefs:
              - CE046
              - CE047
          - type: callout
            title: BLE Network Dependency on Machine Power Creates Coverage Asymmetry
            body: >-
              The Trackunit Network's self-sustaining expansion model relies on powered machines carrying Raw devices as
              gateway nodes. On quiet sites, in off-season periods, or during bulk equipment repositioning, BLE coverage
              contracts. Beam gateways mitigate this for static indoor locations but introduce a separate hardware
              procurement step.
