    rows:
      - - Predictive maintenance economics
        - Driver
        - +3.2 pp (Mordor est.)
        - Current; accelerating 2024–2027
        - >-
          Primary ROI narrative; Trackunit cited as achieving 20–25 % downtime reduction and 18 % lower maintenance
          outlays
        - >-
          Verify downtime-reduction claims with independent customer case studies; determine customer contractual SLA
          commitments
      - - Safety analytics and insurance incentives
        - Driver
        - +2.8 pp (Mordor est.)
        - Current; insurance policy renewal cycle
        - IoT site safety reduces premiums 10–15 % on monitored sites; boosts contract stickiness
        - Obtain specific insurer partnership names and quantified premium-reduction guarantees
      - - 5G and edge-computing deployment on jobsites
        - Driver
        - +2.5 pp (Mordor est.)
        - 2025–2030 infrastructure build-out
        - Enables real-time analytics; enhances Trackunit IrisX platform latency profile
        - Track 5G construction-site deployment velocity by geography, especially in Nordics and Germany
      - - EU Green Deal and Stage V carbon-tracking mandates
        - Driver
        - Directional positive; not quantified separately
        - Current for Stage V; Green Deal emissions logs from 2024–2027 tender cycle
        - >-
          Regulatory pull for connected emission meters in public-tender construction projects; European geography
          tailwind
        - >-
          Clarify which specific tender standards reference telematics data vs. manual reporting; assess enforcement
          timeline
      - - OEM standardisation of embedded telematics
        - Driver
        - Directional positive (embeds at-machine data source)
        - Current; all major OEMs shipping connected machines
        - >-
          Creates baseline data demand; Trackunit needs to remain preferred aggregator or risk displacement by
          OEM-native platforms
        - Assess proportion of OEM partner machines with Trackunit modems vs. competing embedded hardware
      - - Proprietary OEM telematics lock-in (Cat Connect, KOMTRAX, Volvo CareTrack)
        - Constraint
        - Limits SAM where single-OEM fleets have no mixed-fleet need
        - Ongoing structural
        - Single-OEM operators may not need a neutral aggregator; Trackunit SAM is bounded by mixed-fleet prevalence
        - Quantify share of construction fleets that are mixed-brand vs. single-brand at target segments
      - - Mixed-fleet interoperability and AEMP/ISO 15143 adoption gaps
        - Constraint
        - –1.5 pp CAGR impact (Mordor est.)
        - Ongoing; gradual standards adoption
        - >-
          Incomplete ISO 15143-3 adoption across OEMs means Trackunit must maintain bilateral integrations; raises
          engineering cost and slows new OEM onboarding
        - Review ISO 15143-3 compliance certifications held by top-20 OEM brands; assess Trackunit's integration backlog
      - - Data security, privacy, and GDPR friction
        - Constraint
        - Directional negative; not separately quantified
        - Ongoing; heightened post-2023 GDPR enforcement actions
        - >-
          Worker biometric wearables data and machine usage data ownership disputes between OEM, rental co., and
          contractor; may delay deployments or require product design concessions
        - >-
          Identify any regulatory enforcement actions or data-ownership disputes Trackunit has faced; review DPA (data
          processing agreement) standard terms
      - - Cyclical construction capex
        - Constraint
        - Amplifies revenue volatility in down-cycles
        - Macro-dependent; 2026 uncertainty around rate environment
        - >-
          Fleet expansion slows in construction downturns; existing-base SaaS revenue is more resilient than new-device
          attach
        - >-
          Assess share of Trackunit revenue from existing-base subscriptions vs. new hardware installations to gauge
          cycle resilience
      - - Retrofit economics on legacy fleets
        - Constraint
        - Reduces SAM for older-machine owners
        - Ongoing; fleet age demographics
        - >-
          Owners of machines >10 years old face USD 200–600 per-unit hardware cost plus installation before any SaaS
          value; ROI hurdle higher for short-remaining-life assets
        - Obtain breakdown of Trackunit installed base by machine vintage (factory-fit OEM vs. retrofit aftermarket)
      - - IoT analytics skills shortage
        - Constraint
        - Directional negative; quantified as market-wide drag
        - Ongoing through 2030 per Mordor
        - >-
          Operators who cannot interpret dashboard data churn or undervalue the platform; raises Trackunit's customer
          success cost
        - Measure Trackunit churn by customer segment size; assess AI/co-pilot features as a self-serve mitigation
      - - Rental market capital intensity and equipment lifecycle
        - Driver + Constraint
        - Net positive for subscription demand; constraint on hardware upgrade pace
        - Cyclical; rental capex peaks and troughs
        - >-
          Rental companies refresh fleets every 5–7 years; new equipment is factory-connected; driving gradual
          penetration increase
        - Obtain ERA or ARA rental fleet renewal rate data to model attach-rate growth curve
    notes: >-
      CAGR impact estimates from Mordor Intelligence (2026); directional assessments from analyst synthesis. Not all
