            title: SaaS-Dominant Revenue Base with Accelerating ARR
            body: >-
              Trackunit's 95%+ recurring revenue share and 17% ARR growth in 2024 — well above the 10% total revenue
              growth rate — demonstrate that the business is successfully transitioning toward higher-quality, more
              predictable cash flows. The OEM pre-install flywheel provides structural lock-in that is difficult for
              competitors to displace at scale.
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
              - CI011
          - type: callout
            title: High LBO Leverage (~8× EBITDA) Constrains Capital Flexibility
            body: >-
              The June 2025 Goldman Sachs buyout introduced approximately USD 500m of term debt (~8× cash EBITDA
              leverage). With cash interest estimated at USD 35–50m per year at SOFR +500–525 bps, debt service
              materially compresses free cash flow relative to EBITDA. Any sustained revenue growth deceleration — as
              observed in the 2024 slowdown from 18% to 10% — would tighten covenant headroom and limit investment
              capacity at a critical product-expansion phase.
            calloutType: risk
            claimRefs:
              - CI020
              - CI022
              - CI007
          - type: callout
            title: 'Customer Concentration: Top 10 Accounts ≈ 50% of Revenue'
            body: >-
              Lenders in the 2025 debt process explicitly flagged that Trackunit's top 10 customers account for
              approximately half of total revenue. While the company reports long customer tenures for large accounts,
              the concentration creates outsized exposure to a handful of OEM, rental, and contractor relationships. A
              single large non-renewal could represent a 3–8% ARR headwind in isolation — meaningful under LBO leverage.
            calloutType: risk
            claimRefs:
              - CI026
              - CI037
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform & Product Portfolio
        blocks:
          - type: paragraph
            body: >
              Trackunit's commercial offering spans three interconnected tiers: connected hardware devices, a global
              Bluetooth network infrastructure, and the IrisX operating data platform. The product family is designed to
              cover the full asset spectrum on a construction site—from heavy powered equipment through small tools and
              hand-carry attachments.

              The software anchor is Trackunit IrisX, positioning itself as a purpose-built operating data platform
              (ODP) for construction that sits above standalone telematics. IrisX ingests telematics, OEM, and business
              data from multiple sources, normalizes it into a governed data layer, and exposes it via APIs, dashboards,
              and AI agents. As of June 2026 the platform connects over 6.5 million assets across 65+ countries,
              processes over 3 billion data points daily, and has accumulated over 2 trillion data points in total. The
              European Rental Association recognized IrisX with the 2025 Rental Technology of the Year Award for
              advancing data interoperability.

              Trackunit Manager is the primary cloud SaaS fleet management interface, providing real-time map view,
              utilization analytics, equipment health and CAN diagnostic alerts, and access management for mixed fleets.
              Trackunit Go is the companion mobile application for field-level visibility, enabling technicians and
              operators to view GPS position, fault codes, and machine activity from a mobile device and to log
              equipment issues in the field.

              On the hardware side, the Raw product line—anchored by the TU700—is a rugged cellular-GPS telematics
              device for powered equipment, supporting CAN J1939 data collection and two-way OTA firmware updates. Kin
              T200 is the next-generation Bluetooth Low Energy tracking tag for non-powered assets, tools, and
              attachments (IP66/67/69, 400 m line-of-sight BLE range, 3-axis accelerometer, temperature sensor). Pass
              K300 is the IoT access management device supporting NFC, RFID, PIN code, and phone-based operator
              authentication, with IPAF credential integration. Spot covers non-powered attachments and trailers. Beam
              gateways extend Bluetooth coverage indoors and in storage areas. The platform also offers Trackunit On for
              operator credential management and mobile inspections.

              Trackunit claims 150+ OEM factory-install relationships, meaning Raw devices ship pre-fitted on new
              machines across major construction equipment brands. The Trackunit Network currently has more than 450,000
              gateways active on jobsites daily, across more than 100,000 jobsites globally, constituting what Trackunit
              markets as the world's largest Bluetooth network in construction.
