  - id: FV001
    title: 'Recommendation Logic: Evidence Chain to Investment Stance'
    type: flow
    layout: wide
    summary: Chain from business quality evidence through valuation premium and macro risk to the Track recommendation.
    data:
      nodes:
        - id: biz-quality
          label: 'Business Quality: 95% ARR, 17% ARR growth 2024, 3.5M assets, construction network moat'
        - id: platform-moat
          label: 'Platform Moat: IrisX operating data platform, largest Bluetooth construction network'
        - id: financial-quality
          label: 'Financial Quality: EBITDA margin ~29%, Rule of 40 ~39, recurring revenue model'
        - id: entry-multiple
          label: 'Entry Multiple: 26.7x EBITDA, 7.8x EV/Revenue — stretched vs. growth-adjusted comps'
        - id: macro-risk
          label: 'Macro Risk: EU construction equipment -19% in 2024; 2025 revenue -2%; slow recovery forecast'
        - id: missing-evidence
          label: 'Missing Evidence: 2025 ARR unconfirmed; capital structure undisclosed; exit path unclear'
        - id: recommendation
          label: 'Recommendation: TRACK / RESEARCH MORE — do not initiate without ARR confirmation + leverage disclosure'
      edges:
