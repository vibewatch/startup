  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Trackunit operates in a competitive market with three structurally distinct threat vectors. First, large
              general telematics platforms such as Samsara (NYSE: IOT, $1.9B ARR in FY26) and Geotab (estimated $700M+
              revenue, 45,000+ customers) offer construction equipment modules as part of broader fleet and vehicle
              management suites. These platforms compete primarily on price, deployment flexibility, and commercial
              vehicle integration, and their scale creates pricing pressure on Trackunit's basic GPS tracking and
              utilization capabilities. Second, major construction OEMs—including Caterpillar, Komatsu, John Deere, and
              Volvo CE—embed proprietary telematics hardware and cloud platforms (VisionLink, Smart Construction
              Dashboard, JDLink Operations Center, CareTrack/ActiveCare Direct) directly into new machines, often
              providing free initial subscriptions and creating a bundling threat against aftermarket telematics vendors
              including Trackunit. Third, construction-native challengers (Tenna, Hapn, GPS Insight) and adjacent asset
              management tools (Hilti ON!Track) address specific contractor or tool-tracking use cases. The competitive
              positioning map below situates the major players on axes of construction-industry specialization and
              platform openness. Status-quo alternatives—manual tracking, spreadsheets, and internal build—remain
              prevalent especially in the SMB contractor segment. Trackunit's advantage as a purpose-built, open
              mixed-fleet platform is real, but OEM bundling and the scale of general-purpose telematics vendors
              represent credible adverse forces that must be actively managed through network effects, ecosystem depth,
              and ongoing construction-specific differentiation.
