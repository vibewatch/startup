          - type: callout
            title: OEM-native telematics limits the mixed-fleet SAM
            body: >-
              Caterpillar, Komatsu, and Volvo CE each operate proprietary telematics ecosystems (Cat Connect, KOMTRAX,
              CareTrack). Fleet operators running exclusively one OEM's machines have limited incremental need for a
              neutral aggregator. Trackunit's SAM is bounded by the prevalence of mixed-OEM fleets, which is highest
              among large rental companies and major contractors—but the exact share of global fleets that are
              multi-brand vs. single-brand is not publicly quantified and represents a key sizing diligence gap.
            calloutType: risk
            claimRefs:
              - CM028
              - CM029
              - CM036
          - type: callout
            title: SAM and SOM estimates rely on undisclosed methodology assumptions
            body: >-
              No primary third-party source publishes a construction-equipment telematics SaaS SAM figure. The USD 5–7
              billion SAM estimate in this chapter is derived by applying Mordor Intelligence's software/services share
              (32.85 %) to the IoT-in-construction base and then applying an estimated construction-telematics sub-share
              (~30 %). Each of these multipliers carries significant uncertainty and should be replaced with Trackunit's
              own disclosed SAM model during a formal due diligence process.
            calloutType: assumption
