      - number: '3.3'
        title: OEM-Embedded Telematics Systems
        blocks:
          - type: paragraph
            body: >-
              The most structurally significant competitive threat to Trackunit's revenue comes from OEM- embedded
              telematics platforms, which are becoming the default entry point for connected construction equipment. OEM
              factory-installed telematics systems are projected to hold 64% of the global construction equipment market
              by 2026, and the total installed base is forecast to grow from 7.8 million units in 2024 to 13.4 million
              by 2029 at 11.5% CAGR—demonstrating the rapid commoditization of basic connectivity at the OEM level.
              Caterpillar's VisionLink platform is the most mature: it manages all-brand fleets through a single portal,
              integrates Cat Inspect, Cat SOS, Cat SIS2.0, and Parts.Cat.com, and from June 30, 2026 requires VisionLink
              for fluid analysis results access—further entrenching the Caterpillar dealer ecosystem. Product Link
              hardware is available for retrofit onto non-Cat equipment. Komatsu launched significant Smart Construction
              updates at CONEXPO-CON/AGG 2026 in March: the Smart Construction Dashboard creates a cloud-based 3D
              virtual twin of the jobsite using drone data and machine as-built information; Smart Construction 3D
              Machine Guidance Flex extends as-built capture to any vehicle including non-Komatsu equipment; and Smart
              Construction Edge processes drone data locally at site. Komatsu's positioning as a mixed-fleet-capable OEM
              platform complicates Trackunit's OEM sales story. John Deere's Operations Center and JDLink platform
              provide real-time monitoring, automated maintenance tracking, engine hours, fuel levels, diagnostic
              trouble codes, and free iOS/Android mobile apps; the JDLink M modem connects any brand of machine to the
              Deere ecosystem. Volvo CE's ActiveCare Direct service is provided free for one year on all new
              CareTrack-equipped machine purchases, with Volvo-managed health monitoring that filters fault codes and
              delivers only actionable alerts to fleet managers. This managed-service model creates a trusted,
              low-friction entry point that competes on convenience rather than openness. The adverse implication for
              Trackunit is that OEM platforms, while closed and single-brand at core, are increasingly extending to
              mixed-fleet contexts via standards-based APIs (AEMP 2.0, ISO 15143-3), and OEM dealer networks provide a
              captive distribution channel Trackunit must co-opt rather than displace.
            claimRefs:
