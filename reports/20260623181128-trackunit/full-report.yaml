            title: Mordor Intelligence cites Trackunit directly as evidence of IoT ROI
            body: >-
              Mordor Intelligence's IoT-in-Construction market report (updated January 2026) cites Trackunit's global
              network of more than 1 million connected machines as direct evidence that remote diagnostics can cut
              downtime by 20–25 % and maintenance outlays by 18 %. This is notable because it positions Trackunit as an
              industry proof point in a USD 17.9 billion market narrative, but the underlying KPIs are company-claimed
              and cannot be independently verified.
            calloutType: insight
            claimRefs:
