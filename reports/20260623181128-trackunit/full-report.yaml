  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - 2025 full-year ARR growth confirmed below 10% in audited accounts
        - >-
          Confirms structural growth slowdown; base case ARR CAGR assumptions become optimistic; exit EV compresses
          materially below entry value
        - >-
          Downgrade to Avoid; exit secondary positions if held; revisit only if growth reaccelerates above 12% with
          confirmed NRR >110%
      - - EBITDA margin compression
        - EBITDA margin falls below 25% for two consecutive reported periods
        - >-
          Signals IrisX investment is not generating operating leverage; Rule of 40 degrades below 30; upward re-rating
          requires growth reacceleration not currently in evidence
        - Reduce position; demand management explanation and updated growth plan before re-engaging
      - - IrisX commercial adoption failure
        - Fewer than 15 enterprise IrisX adopters by end of 2026 (12 months post initial announcement of 5 adopters)
        - >-
          IrisX upsell thesis breaks; ARR per connected asset remains flat; platform differentiation erodes vs
          Samsara/OEM alternatives
        - Shift recommendation to Avoid; IrisX was the primary valuation-accretive catalyst
      - - European construction market deterioration
        - >-
          EU construction output contracts more than 1.5% in 2025 (below CECE 1.1% recovery forecast); German or French
          construction falls further
        - >-
          Headwinds to Trackunit's European OEM and rental customer base; new connected asset growth contracts; ARR at
          risk from equipment fleet reduction
        - >-
          Re-run bear scenario; increase probability weight on bear case from 25% to 40%+; review GRM vs lower-growth
          comps
      - - Competitive displacement by OEM-embedded solutions
        - Any single OEM customer representing >5% of ARR announces proprietary telematics platform replacing Trackunit
        - Validates key risk of OEM disintermediation; NRR could drop below 100%; ARR growth reversal possible
        - Immediate downgrade to Avoid; conduct customer and OEM partner interviews as priority diligence action
      - - Capital structure deterioration
        - Leverage disclosed or estimated above 5x EBITDA post-GS transaction; or covenant breach reported
        - >-
          Reduces equity return at any given exit EV; creates refinancing risk in rising rate environment; lowers base
          case MoM below 1.0x
        - Downgrade to Avoid; cost of debt makes equity upside insufficient to compensate for illiquidity premium
    notes: >-
      Thresholds are analyst-constructed; Trackunit does not publish forward guidance or covenants. Monitoring requires
      access to audited Danish statutory accounts (filed with Erhvervsstyrelsen/CVR) and any available credit
      documentation if a leveraged buyout structure was used.
    claimRefs:
      - CV036
      - CV038
      - CV039
      - CV040
      - CV043
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - 2025 ARR and NRR
        - >-
          Trackunit's 2025 full-year ARR (only revenue ~DKK 1.26B is available from a third-party aggregator; no ARR
          figure published); net revenue retention rate has never been publicly disclosed
        - >-
          ARR is the primary valuation driver for a 95%-recurring-revenue SaaS business; NRR above 110% is required to
          sustain the base case; 2025 revenue decline may mask ARR resilience or confirm structural deceleration
        - >-
          Request from management or Goldman Sachs IR; or wait for Trackunit ApS 2025 audited annual report filed with
          Danish Business Authority (CVR number 20750170)
      - - Capital structure / leverage
        - >-
          The GS/Hg transaction debt structure is not publicly disclosed; no indication of whether the acquisition was
          partially leverage-financed and what covenants apply
        - >-
          Leverage above 4x EBITDA significantly reduces equity-level returns in base and bear cases; covenant risk adds
          refinancing uncertainty; required for LBO return modelling
        - >-
          Request from Goldman Sachs Alternatives or Hg Capital investor relations; Nordic high-yield or leveraged loan
          markets may have pricing data if debt was externally placed
      - - IrisX commercial traction
        - >-
          Only five early enterprise adopters disclosed as of Q3 2024; no ARR contribution from IrisX published; no
          customer case studies quantifying ROI
        - >-
          IrisX is the primary upsell and re-rating catalyst; without demonstrated commercial adoption, the bull case is
          speculative; OEM and contractor decision cycles may be 12–18 months meaning 2024 adopters should provide data
          by 2026
        - >-
          Trackunit management; construction industry customer reference calls; monitor press releases and product
          portal for IrisX expansion announcements
      - - Competitive positioning vs Samsara
        - >-
          No independent competitive win/loss data available; Samsara's construction vertical strategy is not publicly
          detailed; no third-party analyst coverage comparing Trackunit and Samsara head-to-head
        - >-
          Samsara's 30% ARR growth at scale and IoT platform breadth make it a potential competitive threat if it
          deepens construction vertical focus; the GRM disadvantage of Trackunit relative to Samsara needs monitoring
        - >-
          Independent construction technology analyst report; G2/Gartner review comparative analysis; direct OEM and
          rental customer interviews
      - - Exit pathway and Goldman Sachs hold period
        - >-
          Goldman Sachs has not disclosed target exit timeline, IPO preparation activity, or strategic sale discussions;
          Hg's reinvestment signals at least a 3–5 year hold
        - >-
          Exit timing and route (IPO vs. trade sale vs. PE-to-PE) materially affects equity IRR calculations;
          construction tech IPO window is currently limited; strategic buyers may need pricing concession
        - >-
          Monitor Goldman Sachs PE portfolio announcements and Trackunit press releases; track construction technology
          M&A market activity (Autodesk, Trimble, Hexagon, Volvo acquisitions)
      - - Full ownership structure and board composition
        - >-
          Post-transaction equity split between Goldman Sachs, Hg, and management is not fully disclosed; board
          composition after GS acquisition not confirmed beyond initial announcement
        - >-
          Management rollover equity percentage and incentive structure affect alignment; board composition affects
          governance and exit decision-making authority
        - Trackunit leadership page; Danish Business Authority filings; Goldman Sachs PE portfolio disclosures
    notes: >-
      Diligence paths for non-public data require investor or LP access to Goldman Sachs Alternatives, Hg Capital, or
      Trackunit management. Danish statutory annual accounts (CVR filings) are publicly available with a 6–12 month lag
      and provide audited revenue and EBITDA but limited SaaS-specific metrics.
    claimRefs:
      - CV011
      - CV013
      - CV041
      - CV042
      - CV044
