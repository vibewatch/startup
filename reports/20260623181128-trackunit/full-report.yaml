          ARR CAGR 10–12% (5yr); stable IrisX adoption; EU construction output grows 1–2% annually; EBITDA margin stable
          at 28–31%; exit at 20–23x EBITDA on 2030E EBITDA ~$95–105M
        - Exit EV $1.9–2.4B (USD); 1.3–1.7x MoM on equity (unleveraged); IRR ~5–12%
        - >-
          Macro recovery underperforms; IrisX ARR contribution is below expected; management depth risk as company
          grows; leverage costs reduce equity return
        - >-
          Most likely scenario; consistent with prior PE hold pattern and organic growth trajectory; 2025 ARR
          confirmation would set floor
      - - Bear (25%)
        - >-
          ARR CAGR 5–7% (5yr); EU construction remains subdued through 2027; IrisX adoption below forecast; competitive
          pricing pressure; EBITDA margins compress to 24–27%; exit at 16–19x EBITDA on 2030E EBITDA ~$70–75M
        - Exit EV $1.1–1.4B (USD); 0.8–1.0x MoM on equity (unleveraged basis); negative IRR if leverage >3x
        - >-
          Triggered by: sustained ARR growth below 10%; EBITDA margin below 25%; German/French construction further
          deterioration; OEM churn above 5%
        - Non-trivial given 2025 revenue decline of 2% and European construction equipment market down 19% in 2024
    notes: >-
      All EV and IRR figures are analyst estimates based on inferred inputs; Trackunit does not publish guidance or
      disclose capital structure. Leverage assumptions are not accounted for—actual equity returns will be lower if the
      GS transaction was partially debt-financed. USD conversion at ~0.147 USD/DKK implied rate. Probability signals are
      qualitative assessments, not actuarial probabilities.
