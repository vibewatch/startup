  - id: FV002
    title: 'EV/Revenue Multiple Comparison: Trackunit vs. Public Telematics and Construction SaaS Peers (Jun 2026)'
    type: bar
    layout: standard
    summary: >-
      Trackunit's implied EV/Revenue of ~7.8x sits below Samsara but well above Powerfleet and Trimble; on a
      growth-adjusted basis it is the most expensive in the peer set.
    data:
      items:
        - label: Samsara IOT (30% rev growth)
          value: 9.8
        - label: Trackunit (entry multiple, 10% rev growth)
          value: 7.8
        - label: Hexagon AB (3% organic growth)
          value: 5.6
        - label: Construction SaaS PE median (10-13x EBITDA range)
          value: 4.5
        - label: Trimble TRMB (6% organic growth)
          value: 3.3
        - label: Powerfleet AIOT (26% rev growth)
          value: 1.7
    approximationNotes: >-
      Trackunit multiple derived from reported DKK 10B EV and DKK 1.29B 2024 revenue at 0.147 USD/DKK. Public multiples
      as of June 23, 2026. Construction SaaS PE median is analyst estimate from AEC M&A sources. All figures are
      EV/Revenue (or EV/Sales) trailing.
    claimRefs:
      - CV017
      - CV019
      - CV021
      - CV022
      - CV037
