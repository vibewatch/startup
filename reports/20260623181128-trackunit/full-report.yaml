      - number: '8.5'
        title: Recommendation, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The overall recommendation is Track / Research More. Trackunit is a high-quality SaaS and IoT platform
              with exceptional recurring revenue characteristics, a genuine competitive moat through its Bluetooth
              network and data density, and credible backing from Goldman Sachs Alternatives and Hg—both of whom have
              now demonstrated willingness to price the asset at 26–27x EBITDA across two cycles, underwriting the same
              core thesis. These are strong qualitative signals.


              However, the recommendation falls short of Buy for three reasons. First, the entry multiple of 26.7x
              EV/EBITDA and 7.8x EV/Revenue is stretched when adjusted for Trackunit's actual revenue growth rate of 10%
              (or 17% on ARR)—implying the buyer is paying a SaaS-at-scale multiple for a business still in mid-growth
              phase, with a 2025 revenue dip adding uncertainty. Second, critical financial inputs—including Trackunit's
              2025 ARR, capital structure (debt levels post-GS transaction), and net revenue retention—are not publicly
              disclosed, making precise returns modelling speculative. Third, the European construction market macro
              environment creates asymmetric downside risk: European construction output shrank 2.4% in 2024, equipment
              sales fell 19%, and recovery is projected to be gradual (1.1% in 2025, 1.8% in 2026). Any further
              deterioration, particularly in Germany or France, would meaningfully pressure the base case.


              A new equity investor considering a secondary position or LP exposure would need to see: (i) 2025 ARR
              confirmed at 15%+ growth (suggesting the revenue dip was hardware-mix, not subscription), (ii) capital
              structure disclosure showing leverage below 4x EBITDA, (iii) NRR (net revenue retention) above 110%
              indicating reliable upsell, and (iv) a credible exit path (IPO filing preparation or named strategic buyer
              conversations) within a 3–5 year window. Without these, the risk-adjusted return profile does not justify
              the entry multiple.


              The thesis-break triggers most likely to cause a material downgrade of the investment case are a sustained
              ARR growth decline below 10% (confirming the platform is not gaining share), EBITDA margin compression
              below 25% (signaling IrisX investment is not generating returns), or a failed IrisX commercial rollout
              beyond the initial five enterprise adopters within 12 months. A construction industry recession deeper
              than the 2024 trough would be a macro kill criterion if Trackunit's ARR growth dropped below 5%.
            claimRefs:
