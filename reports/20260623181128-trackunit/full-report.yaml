  - id: FI001
    title: 'Revenue Model Bridge: From Connected Asset to Gross Profit'
    type: flow
    layout: wide
    summary: >-
      How a connected construction asset generates subscription revenue and flows to gross profit, illustrating the SaaS
      dominance and hardware gateway role.
    data:
      nodes:
        - id: n1
          label: Asset Connection
          description: OEM, rental, or contractor deploys Trackunit Raw/Kin/Spot/Beam device on machine or tool
        - id: n2
          label: Platform Subscription (>95% of revenue)
          description: >-
            Customer pays recurring per-asset fee for IrisX/Manager SaaS access; tiers: OEM, Rental, Contractor,
            Enterprise. USD 119.5m ARR in 2024
        - id: n3
          label: Hardware / Device Revenue (<5%)
          description: One-time device sale activating the subscription; ~USD 9m implied in 2024; lower gross margin than SaaS
        - id: n4
          label: Platform COGS (hosting, connectivity, ML/AI infra)
          description: >-
            Cloud infrastructure, cellular data, IrisX ML compute, customer success engineering. Estimated ~25–35% of
            SaaS revenue
        - id: n5
          label: Gross Profit (~69% blended margin)
          description: DKK 889.4m gross profit on DKK 1.29bn net revenue in 2024; blended GM ~68.9%
      edges:
        - from: n1
          to: n2
          label: Subscription activated post-install
        - from: n1
          to: n3
          label: Device sold at point of install
        - from: n2
          to: n4
          label: Platform delivery cost
        - from: n3
          to: n4
          label: Hardware COGS (~70% of device revenue est.)
        - from: n4
          to: n5
          label: Revenue minus COGS
    approximationNotes: >-
      Hardware revenue and COGS are implied residuals from official ARR and blended gross margin disclosures; hardware
      gross margin is estimated from industry IoT comps (15–35%). SaaS gross margin is not separately disclosed.
    claimRefs:
      - CI002
      - CI008
      - CI027
      - CI039
  - id: FI002
    title: 'Unit Economics Bridge: Per-Asset Revenue and Margin Flow'
    type: flow
    layout: standard
    summary: >-
      Illustrative per-connected-asset economics showing how ARPA flows from subscription fee through platform costs to
      EBITDA contribution; several nodes are estimates.
    data:
      nodes:
        - id: u1
          label: Per-Asset SaaS ARPA (est.)
          description: >-
            Implied subscription ARPA: USD 119.5m ARR / ~3.5m avg assets in 2024 = ~USD 34/asset/yr. Varies widely by
            tier and fleet size
        - id: u2
          label: Gross Margin Per Asset (~69% blended)
          description: >-
            Platform-level gross margin applied to SaaS ARPA. True SaaS-only GM likely higher (~75–85%); blended by
            hardware mix
        - id: u3
          label: Allocated OpEx (R&D ~33% of rev, S&M, G&A)
          description: >-
            R&D ~33% of revenue per CEO 2023 statement; S&M and G&A not separately disclosed; total OpEx implied ~36–40%
            of revenue
        - id: u4
          label: EBITDA Contribution Per Asset (est.)
          description: >-
            At ~30% EBITDA margin: ~USD 10/asset/yr contribution; grows with scale as fixed R&D costs are spread. Highly
            sensitive to retention
    approximationNotes: >-
      All per-asset figures are derived estimates. ARPA uses mid-year 2024 asset count (~3.5m; assets grew from 3m in
      early 2024 to 6.5m by April 2026). OpEx allocation is inferred from CEO statements and EBITDA margin;
      segment-level economics are not publicly disclosed.
