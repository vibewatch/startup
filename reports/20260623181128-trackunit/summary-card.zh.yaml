  topStrengths:
    - 面向施工场景的混合车队数据模型，触达 OEM、经销商、租赁商和承包商。
    - 经常性收入占比高（约 95%），且在欧洲市场疲弱时仍公开披露 2024 年 ARR 增长。
    - 100+ 个 OEM 集成、works-with 伙伴计划和具名部署，撑起较深的生态位。
    - 产品覆盖硬件、连接、软件工作流、API 和新 IrisX 平台能力，宽度足。
  topRisks:
    - 相比按增长调整后的公开可比公司，2025 年买断估值和杠杆给承销误差留下的缓冲有限。
    - OEM 内置远程信息处理和伙伴控制的 API 访问，可能挤压 Trackunit 的独立平台权力。
    - 债务条款、NRR、CAC 效率和客户集中度的公开披露仍不完整。
    - GDPR、EU Data Act 和安全认证要求，持续带来企业销售和合规风险。
  unresolvedGaps:
    - 买断后的完整债务包、契约和利息负担尚未公开披露。
    - 2025 年 ARR、EBITDA、NRR 和流失指标，仍无审计或公司发布来源可查。
    - 分模块实际定价、硬件毛利率和 OEM 收入集中度依然不透明。
    - SOC 2 Type II 或同等全平台 assurance 的公开证据仍不完整。
