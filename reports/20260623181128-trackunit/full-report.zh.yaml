      - number: '8.5'
        title: 建议、破题触发项与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              总体建议是 Track / Research More。Trackunit 是高质量 SaaS 和 IoT 平台，具备出色的经常性收入特征， 通过 Bluetooth 网络和数据密度形成真实竞争护城河，并获得
              Goldman Sachs Alternatives 与 Hg 的可信背书； 两者已经在两个周期中都愿意以 26–27x EBITDA 为该资产定价，承销同一个核心论点。这些都是强定性信号。


              但建议未达到 Buy，有三个原因。第一，26.7x EV/EBITDA 和 7.8x EV/Revenue 的入场倍数， 结合 Trackunit 实际 10% 收入增长（或 17% ARR
              增长）后显得拉伸——买方是在为一家仍处中等增长阶段、 且 2025 年收入下滑带来不确定性的业务支付规模化 SaaS 倍数。第二，关键财务输入——包括 Trackunit 的 2025 年 ARR、
              资本结构（GS 交易后的债务水平）和净收入留存——均未公开披露，精准回报建模因此具有推测性。 第三，欧洲建筑市场宏观环境带来不对称下行风险：2024 年欧洲建筑产出萎缩 2.4%，设备销售下降 19%，
              复苏预计将较缓慢（2025 年 1.1%，2026 年 1.8%）。若进一步恶化，尤其是在德国或法国，基准情景将明显承压。


              考虑二级头寸或 LP 敞口的新股权投资者，需要看到：（i）2025 年 ARR 确认增长 15%+（说明收入下滑来自硬件组合， 不是订阅），（ii）资本结构披露显示杠杆低于 4x
              EBITDA，（iii）NRR（净收入留存）高于 110%， 表明追加销售可靠，以及（iv）3–5 年窗口内有可信退出路径（IPO 申报准备或已点名战略买家洽谈）。 没有这些证据，风险调整后回报无法支撑入场倍数。


              最可能导致投资案例大幅下调的破题触发项包括：ARR 增长持续跌破 10%（确认平台没有拿到份额）、 EBITDA 利润率压缩至 25% 以下（说明 IrisX 投资没有产生回报），或 IrisX 商业化推出在
              12 个月内未能越过最初五家企业采用者。 若建筑行业衰退深于 2024 年低谷，且 Trackunit ARR 增长跌破 5%，这将构成宏观终止标准。
