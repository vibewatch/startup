  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Trackunit 位于三个重叠市场的交叉处：（1）建筑设备远程信息处理——用于重型机械定位、监控和诊断的硬件与软件；（2）面向建筑业的工业 IoT
              平台——更宽的云、分析和工作流软件层；（3）租赁车队管理软件——设备租赁运营商使用的资产追踪和利用率系统。相关支出边界包括硬件调制解调器、SIM 连接、云平台订阅、API
              数据馈送，以及搭建在远程信息处理数据层之上的第三方 app 集成。不包括建筑设备硬件市场本身（全球 USD 205–226 billion）、项目管理软件（如 Procore、Autodesk
              Construction Cloud），以及自动化或机器人设备；它们使用远程信息处理数据作为输入，但属于不同采购决策。多数买家的现状替代方案是 OEM 自有远程信息处理（Cat
              Connect、KOMTRAX、Volvo CareTrack），只能覆盖单品牌车队；Trackunit 的 SAM 是拥有混合 OEM 车队，或需要聚合跨品牌数据与工作流集成的设备所有者占比。相邻市场包括交通
              / 物流车辆的车队远程信息处理、楼宇管理系统和工地门禁控制平台——它们相邻，但买方旅程在结构上不同。
