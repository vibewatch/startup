              Trustpilot（1.8/5，32 条评论）和 Capterra（包括一条关于硬件故障、电池耗尽、取消不可及和债务催收威胁的 1 星叙述）上的反向评论，记录了 SMB
              分层中的执行失败。与企业级满意度（FeaturedCustomers 4.8/5）之间的分歧，说明可能存在双层支持模型。未解决的 SMB 流失会在 Trackunit
