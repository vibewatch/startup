        - 垂直领域更广（运输、物流）；以美国为中心；规模大 3x；更高增长率在 GRM 口径下不利于 Trackunit
      - - Trimble (TRMB)
        - 上市，建筑 / 地理空间软件
        - $3.59B 收入；$2.39B ARR（FY2025）
        - ~3.3x
        - 约 11x（基于调整后 EBITDA $1.046B）
        - 有机同比 +6%
        - 大市值建筑 / 地理空间软件；ARR 占比高；29% EBITDA 利润率基准
        - 规模大得多（$11.8B 市值）；增长较慢；硬件占比较高；竞争护城河不同；企业建筑 PM 不是远程信息处理
      - - Hexagon AB (HEXA B)
        - 上市，工业测量 / 建筑地理空间
