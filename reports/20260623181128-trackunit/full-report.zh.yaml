      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Trackunit 的财务画像有吸引力：95%+ 经常性收入、17% ARR 增长、约 69% 毛利率、约 29–33% EBITDA 利润率，均明显高于工业 IoT 同行中位数。平台规模（截至 2026 年 4
              月，650 万资产、每日 2 万亿数据点）和 IrisX AI 能力，带来增量收入扩张空间。人均收入约 USD 410K，eNPS 为 62，说明组织效率高、人才密度强。


              但对评估资本充足性的投资者而言，2025 年 6 月约 8× 现金 EBITDA 的 LBO 是最主要的财务风险。如果到 2029 年 21% 的预期收入 CAGR 没有兑现——2024 年增速从 18% 降到
              10% 已说明存在这种可能——偿债将挤压 R&D 和后续 M&A 的资本分配。契约结构、现金利息负担和任何 PIK 机制均未公开。


              NRR、CAC、分部 ARR、硬件毛利率和自由现金流数据缺失，使外部无法承销经常性收入基础的完整质量。TI003 中所有单位经济指标不是估算值就是 null。公开定价不透明，意味着外部没有独立依据评估实际
              ARPA 趋势或定价权可持续性。这些缺口合在一起意味着，潜在投资者或贷款方做新一轮尽调时，应先核实 TI005 中列出的指标，再判断终局价值或增长质量。
