  - id: TV005
    title: 论点破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 增长放缓
        - 2025 全年 ARR 增长在审计账目中确认低于 10%
        - 确认结构性增长放缓；基准情景 ARR CAGR 假设变得乐观；退出 EV 大幅压低至入场价值以下
        - 下调至规避；若已持有则退出二级仓位；只有在增长重新加速至 12% 以上且 NRR >110% 获确认后再重新评估
      - - EBITDA 利润率压缩
        - EBITDA 利润率连续两个报告期低于 25%
        - 说明 IrisX 投入未带来经营杠杆；Rule of 40 恶化至 30 以下；若要上修评级，需要增长重新加速，但目前证据不足
        - 降低仓位；重新接触前要求管理层解释并更新增长计划
      - - IrisX 商业采用失败
        - 到 2026 年底（宣布 5 家早期采用者后的 12 个月）IrisX 企业采用者少于 15 家
        - IrisX 追加销售论点破裂；每联网资产 ARR 保持平坦；平台差异化相对 Samsara / OEM 替代方案被削弱
        - 将建议转为规避；IrisX 原本是推高估值的主要催化剂
      - - 欧洲建筑市场恶化
        - 2025 年欧盟建筑产出收缩超过 1.5%（低于 CECE 1.1% 复苏预测）；德国或法国建筑进一步下滑
        - Trackunit 的欧洲 OEM 和租赁客户基础承压；新增联网资产增长收缩；设备车队缩减使 ARR 面临风险
        - 重新跑熊市情景；将熊市权重从 25% 上调至 40%+；复核 GRM 相对低增长可比对象的情况
      - - 被 OEM 嵌入式方案竞争替代
        - 任何单一 ARR 占比 >5% 的 OEM 客户宣布自有远程信息处理平台取代 Trackunit
        - 验证 OEM 去中介化核心风险；NRR 可能跌破 100%；ARR 增长可能逆转
        - 立即下调至规避；将客户和 OEM 伙伴访谈作为优先尽调动作
      - - 资本结构恶化
        - GS 交易后披露或估算杠杆高于 5x EBITDA；或报告契约违约
        - 在任何给定退出 EV 下都会压低股权回报；在利率上行环境中带来再融资风险；使基准情景 MoM 降至 1.0x 以下
        - 下调至规避；债务成本使股权上行不足以补偿流动性不足溢价
    notes: 阈值由分析师构建；Trackunit 不发布前瞻指引或契约。监测需要访问经审计的丹麦法定账目（向 Erhvervsstyrelsen/CVR 备案），以及在采用杠杆收购结构时可取得的任何信贷文件。
    claimRefs:
