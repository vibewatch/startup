      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              五个结构性增长驱动因素为建筑 IoT 平台创造持久需求。第一，预测性维护经济性为 IoT-in-construction CAGR 增加 +3.2 个百分点，按 Mordor Intelligence 模型：把
              IoT 传感器连接到机器学习模型后，维护可按状态而非日历排程；Trackunit 全球网络被引用为案例，显示停机减少 20–25%，维护支出降低 18%。第二，安全分析增加 +2.8
              pp：可穿戴设备和环境传感器降低事故率，并生成保险公司认可的可审计安全记录，使受监控工地保费降低 10–15%。第三，5G 和 edge-computing 推广增加 +2.5
              pp，使近实时分析和自动化设备集成可以规模化。第四，强制碳排放记录——尤其是 EU Green Deal 和 Stage V
              非道路发动机标准——迫使承包商部署已连接计量器和认证排放日志，以满足公共招标和监管报告。第五，OEM 竞争动态加速采用，因为 Caterpillar（Cat Connect）、Komatsu（KOMTRAX）和
              Volvo CE 把远程信息处理嵌入标准设备，让机器成为数据节点，并为平台聚合创造基础需求。

              四个结构性采用约束会压低增长。互操作性缺口（对 CAGR 影响 –1.5 pp）：每个 OEM 的专有数据格式都会制造集成复杂度，买方必须通过标准采用（AEMP / ISO 15143）或 Trackunit
              这类中立聚合器来解决。数据安全和隐私责任：工业部门 IoT 相关安全事件增长 25%；GDPR 关联的可穿戴 worker-biometrics 数据带来合规摩擦，并在
              OEM、租赁公司和承包商之间引发数据所有权争议。周期性 capex：建筑设备市场对利率和宏观周期高度敏感——Mordor 设备市场预计到 2031 年 CAGR 为温和的 5.8%，低于 IoT /
              软件层，意味着即便硬件销量波动，平台收入仍可增长，但整体车队扩张放缓会限制新增设备接入机会。改装经济性：旧机器需要硬件安装投入，提高 legacy fleets
              数字化的实际成本，并在大型运营商和中小承包商之间制造价格敏感分化；后者无法为剩余使用寿命五年或更短的机器证明每台硬件加订阅成本的合理性。

              第五个约束是 IoT 数据分析技能短缺，Mordor Intelligence 将其列为全市场拖累：运营商缺少能响应警报和 dashboard 的受训人员，分析输出就会闲置，削弱可证明 ROI，并让续约停滞。
