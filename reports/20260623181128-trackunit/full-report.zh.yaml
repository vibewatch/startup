  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台与产品组合
        blocks:
          - type: paragraph
            body: >
              Trackunit 的商业产品横跨三个相互连接的层级：联网硬件设备、全球 Bluetooth 网络基础设施，以及 IrisX
              运营数据平台。产品族覆盖建筑工地上的完整资产谱系，从大型动力设备，到小型工具和手提附件。

              软件锚点是 Trackunit IrisX。公司把它定位为面向建筑行业的专用运营数据平台（ODP），位于单点遥测系统之上。IrisX 从多源摄取遥测、OEM 和业务数据，标准化为受治理的数据层，再通过
              API、仪表盘和 AI agents 对外输出。截至 2026 年 6 月，平台连接 65+ 国家超过 650 万资产，每日处理超过 30 亿数据点，并累计沉淀超过 2 万亿数据点。European Rental
              Association 将 2025 年 Rental Technology of the Year Award 授予 IrisX，以表彰其推进数据互操作性。

              Trackunit Manager 是主要的云端 SaaS 车队管理界面，提供实时地图视图、利用率分析、设备健康与 CAN 诊断告警，以及混合车队的访问管理。Trackunit Go
              是配套移动应用，负责一线可视化；技术人员和操作员可在移动设备上查看 GPS 位置、故障码和机器活动，并在现场记录设备问题。

              硬件侧，Raw 产品线以 TU700 为核心，是面向动力设备的坚固型蜂窝-GPS 遥测设备，支持 CAN J1939 数据采集和双向 OTA 固件更新。Kin T200 是下一代 Bluetooth Low
              Energy 追踪标签，面向非动力资产、工具和附件（IP66/67/69，400 m 视距 BLE 范围，3 轴加速度计，温度传感器）。Pass K300 是 IoT 访问管理设备，支持 NFC、RFID、PIN
              码和基于手机的操作员认证，并集成 IPAF 凭证。Spot 覆盖非动力附件和拖车。Beam 网关把 Bluetooth 覆盖扩展到室内和存储区。平台还提供 Trackunit On，用于操作员凭证管理和移动巡检。

              Trackunit 称拥有 150+ OEM 工厂安装关系，意味着 Raw 设备会在主要建筑设备品牌的新机器上预装出厂。Trackunit Network 目前每天有超过 450,000
              个网关在工地活跃，覆盖全球 100,000+ 工地，构成 Trackunit 所宣传的全球最大建筑 Bluetooth 网络。
