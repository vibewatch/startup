      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Trackunit 的投资论点建立在四个相互强化的支柱上：结构性渗透不足市场中的品类领导地位、 具备防御性的经常性收入平台和出色留存、穿越建筑周期的长期数字化顺风，以及两次顶级投资人以溢价 PE
              收购确认的运营和财务可信度。 截至 2025 年 6 月，公司拥有约 3.5 million 个联网资产，2024 年约 95% 收入为经常性收入， 在欧洲建筑设备销售下滑 19% 的背景下 ARR 仍增长
              17%，并拥有全球最大的建筑 Bluetooth 网络， 形成网络效应护城河。Trackunit 呈现出防御性 SaaS 品类龙头的特征。2024 年推出的 IrisX 运营数据平台——已有五家早期企业采用者——
              可能成为提升每个联网资产 ARR 的追加销售抓手。Rule of 40 得分约为 39（10% 收入增长 + 约 29% EBITDA 利润率）， 表现可观，也显示资本效率。


              反论点落在定价、增长放缓和宏观敞口上。26.7x EBITDA 和 7.8x 收入的入场倍数， 明显高于优质 PE 支持建筑软件交易通常看到的 10–13x EBITDA 区间；按增长调整后，
              也高于可比上市远程信息处理和建筑软件公司。增长调整估值（EV/Revenue ÷ 收入增长率）显示， Trackunit 的价格约为 Samsara 的两倍（最接近的上市可比公司，30% 增长、9.8x
              EV/Sales）， 这是显著的反向信号。2025 年收入约下降 2% 至 DKK 1.26 billion，说明增长放缓已经开始显现， 不只是风险。欧洲建筑活动 2024 年收缩 2.4%，设备销售下降
              19%——为 2008/09 以来最差表现—— 意味着 Trackunit 的 2024 年业绩已经经过压力测试，而 2025 年进一步承压。若建筑复苏不及预期 （Bain 分析预计法国和德国要到
              2026–2028 年才会滞后恢复），支撑当前倍数的增长假设将无法兑现。 退出风险同样重要：建筑科技 IPO 窗口目前有限，战略买家可能偏好价格更低的标的， PE-to-PE 以相似倍数再出售则需要 EBITDA
              持续增长，才能维持赞助方经济性。
