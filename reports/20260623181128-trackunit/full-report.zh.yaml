        - '上市（NYSE: IOT）；$1.9B FY26 ARR；累计融资 $4.4B+'
        - 建筑、物流、政府、公用事业
        - 规模、AI 行车记录仪、多产品粘性、FY26 实现 GAAP 盈利
        - 不专注建筑；OEM 数据标准化较弱；按车辆而非按资产定价
      - - Geotab
        - 直接 / 通用遥测
        - 私营；估算收入 $700M+；45,000+ 客户；4M+ 联网车辆
        - 企业车队管理、市政
        - 开放平台；350+ 市场合作伙伴；ABI Research
        - 建筑约占客户基数 8%；面向公路车辆，不面向非公路机器健康
      - - Teletrac Navman
        - 直接 / 车队遥测
        - 私营；Vontier Corp 旗下；全球车队跟踪提供商
        - 混合车队承包商、物流
        - ELD 合规、驾驶员评分、视频遥测、路线规划与调度
        - 建筑机器数据较弱；OEM 集成深度有限
      - - GPS Insight
        - 直接 / 车队遥测
        - 私营；中端市场车队 SaaS
        - SMB 和中端市场承包商
        - 透明定价、60+ 报告、GPS 与维护警报
        - 非公路机器遥测有限；没有建筑专用 AI
      - - Tenna
        - 直接 / 建筑原生
        - 私营；VC 支持；700+ 建筑客户
        - 总承包商、专业承包商
        - 为建筑场景专门打造；统一设备、车辆、工具、附件
        - 生态较小；没有 OEM 赋能模式；主要在北美
      - - Hapn
        - 直接 / 混合车队 GPS
        - 私营；月付 SaaS；跟踪 463,000+ 资产
        - 设备租赁、承包商、混合资产车队
        - 灵活定价（无多年锁定）；车辆 + 设备 + 电池资产在一个平台
        - 不是建筑专用 AI；OEM 集成深度无法与 Trackunit 相比
      - - Caterpillar VisionLink
        - OEM 嵌入式
        - '上市（NYSE: CAT）；收入 $67B+；全球第一大建筑 OEM'
        - Cat 设备所有者，通过改装覆盖混合车队
        - Cat 深度集成；油液分析；经销商分发支持；全品牌仪表盘
        - 主要以 Cat 为中心；经销商中介增加摩擦；相比 IrisX 更封闭
      - - Komatsu Smart Construction
        - OEM 嵌入式
        - '上市（TYO: 6301）；全球 Tier-1 建筑 OEM'
        - Komatsu 车队所有者、土方承包商
