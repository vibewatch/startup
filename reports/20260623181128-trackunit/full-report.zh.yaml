      - number: '1.4'
        title: 财务规模、里程碑与尽调语境
        blocks:
          - type: paragraph
            body: >
              公开财务数据显示，在宏观环境承压下，Trackunit 仍实现稳健的经常性收入增长。2024 年净收入 DKK 1.29 billion（同比 +10%）和 ARR DKK 812.6 million（同比
              +17%，占总收入 >95%）体现出高质量 SaaS 特征。第三方私募股权分析师估计，2025 年 Goldman Sachs 交易隐含企业价值约 DKK 10 billion（约 USD 1.45
              billion），按 2024 年业绩计算 EV/EBITDA 约 26.7x——这一估值水平符合规模化、高质量经常性收入 SaaS 平台的典型区间。

              两个反向信号需要明确关注。第一，Trackunit
              是私有公司，没有公开审计财务报表；所有指标均为公司口径。确切交易估值、交易后杠杆结构和资产负债表均不在公开域。第二，私人信贷市场报道（9fin）显示，部分直接贷款方因杠杆倍数激进、尽调访问受限，退出
              Trackunit 融资流程——如果评估信用或资产负债表敞口，这一担忧需要进一步调查。上述担忧并不否定业务质量，但任何想在资本结构层面评估财务风险的投资人，都必须把它们作为正在发生的尽调问题。

              已连接资产规模方面，不同来源存在差异：2025 年 2 月 Goldman Sachs 投资公告称「约 3.5 million 个可见资产」，而 Hg Capital 的 IrisX 案例研究称「超过 6.5
              million 个资产」。2024 年业绩新闻稿则称「超过 3 million 个可见资产已连接」。差异很可能来自口径不同——「可见资产」指直接连接设备，更宽的生态口径可能包括通过 Hilti 和其他集成接入的
              Bluetooth 追踪工具。Hg 案例研究还记录，已连接资产自 2016 年以来增长超过十倍，凸显生态复合增长轨迹。下方里程碑时间线是后续章节引用创立、融资、产品、规模和合作事件的唯一记录。
