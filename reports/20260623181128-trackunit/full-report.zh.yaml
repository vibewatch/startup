      - number: '4.4'
        title: 收入质量、客户结构与反向证据
        blocks:
          - type: paragraph
            body: >
              Trackunit 的收入质量有几项指标支撑：ARR 占比 95%，2024 年 ARR 增长 17%，综合毛利率 68.9%。但几个关键指标没有披露——NRR、总留存率、分 cohort ARR
              扩张——外部无法独立验证增长来自新增 logo、提价，还是实质性追加销售。ARR 增长 17%，而总收入仅增长 10%，说明硬件可能放缓，或收入结构出现变化。


              客户集中度是实质风险，交易过程中贷款方尽调已证实这一点：前 10 大客户约占总收入 50%（Octus）。公司回应称，大客户通常合作年限较长；Sunbelt Rentals UK 合作在 2025 年 11
              月扩展到 IrisX 上的 20,000+ 资产，说明锚定客户关系有深度。但集中度仍让企业端收入暴露于单一大客户流失风险。


              从地域看，截至 GRO Capital 2025 年叙述，北美约占总收入 50%，低于 2023 年年报提到的 60%，可能反映欧洲复苏和亚太增长。Trackunit 服务 5,000+ 客户，覆盖
              OEM、租赁公司、承包商和生态伙伴。


              反向证据方面，Trackunit 在 Trustpilot 上得分 1.8/5（“差”），32 条评论提到客服响应慢、硬件安装失败（电池耗尽、进水）、合同终止时的账单争议，以及支持团队缺乏跟进。Capterra
              用户给产品整体 4.3/5，但同样提到支持响应问题，并要求更深入的 CAN-bus 数据导出能力。B2B 软件评论平台（运营反馈较正面）与 Trustpilot（支持 / 账单体验负面）之间的分歧，是面向 SME
              的遥测厂商常见模式，也说明企业客户与小型车队客户之间可能存在分层支持体验缺口。
