    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与战略使命
        blocks:
          - type: paragraph
            body: >
              Trackunit 的源头可追溯至 1998 年在丹麦 Aalborg 成立的 M-Tec A/S。Trackunit 品牌于 2003 年正式设立；公司「关于我们」页面称，它从本地 IoT
              追踪设备供应商，转向服务整个建筑生态的全球 SaaS 公司和思想领导者。总部仍在
              Aalborg，并在北美、欧洲和亚太设有办公室。公司公开使命是「消除停机」，并「编排连接建筑业的数据和基础设施，为世界打造最有用的行业」。

              Trackunit 是一家私有、SaaS 主导的平台供应商。收入模型由经常性软件订阅主导；截至 2024 年，经常性收入占总收入超过 95%。2024 年净收入为 DKK 1.29 billion（约 USD
              187 million），较 2023 年增长 10%。Annual Recurring Revenue（ARR）同比增长 17%，至 DKK 812.6 million（约 USD 119.5
              million）。CEO Søren Brogaard 将宏观环境称为因欧洲放缓而「具有挑战性」，因此达到预期本身就是有意义的结果。截至 2025 年 2 月 Goldman Sachs 投资公告，平台已连接约
              3.5 million 个可见资产，公司每天处理超过 2 billion 个数据点。

              后续章节需要重点警惕一点：Trackunit 仍为私有公司，不发布独立审计财务报表。本章引用的所有收入、ARR 和资产数量，均来自公司新闻稿或投资人撰写材料，尚未被公众可取得的第三方审计机构验证。
