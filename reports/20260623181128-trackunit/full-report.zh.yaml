      - number: '7.5'
        title: 缓释框架与终止标准
        blocks:
          - type: paragraph
            body: >
              Trackunit 已经在大多数已识别风险维度建立基础缓释：ISO 27001 认证、带事件披露的公开信任中心、 GDPR DPA/SCC 合规基础设施、EU Data Act 承诺文件，以及 Goldman
              Sachs Alternatives 的资金背书。 但缓释并不均衡：数据隐私合规成熟度可信，却没有覆盖全平台的 SOC 2 Type II 独立审计；OEM API 依赖缺少合同披露； PE
              杠杆条款仍然不透明。需要主动监控的破题触发项包括：确认的平台入侵、EDPB 执法调查、 超过三个主要 OEM API 关闭，或 ARR 增长转负；任何一项都构成对投资论点的实质损害。
              终止标准集中在杠杆契约违约、CEO 离任且未披露继任安排，或欧盟数据执法罚款超过 €10 million。 尽调优先事项包括获取 Goldman Sachs 收购的完整债务安排、覆盖完整 IRIS 平台的最新
              SOC 2 Type II 审计报告、 ISO 27001 再认证时间表确认、OEM API 合同条款，以及所有活跃子处理方及其数据访问范围清单。 建议按季度监控 Trackunit
              公开状态页和信任中心，以便在新事件固化为重大事项前识别出来。
