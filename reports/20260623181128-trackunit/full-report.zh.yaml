      - number: '4.3'
        title: Goldman Sachs 持有下的资本结构与充足性
        blocks:
          - type: paragraph
            body: >
              Goldman Sachs Alternatives（Private Equity）从 Hg 和 GRO Capital 手中收购 Trackunit 略高于 50% 的股权，交易于 2025 年 2 月 10
              日宣布，并于 2025 年 6 月 16 日完成交割。Hg 重新投资，作为重要少数股东与 Goldman Sachs 同行。Goldman Sachs 曾在 2015 年至 2021 年持有
              Trackunit，这带来了机构延续性，也说明其组合投资逻辑并不陌生。


              丹麦媒体 Børsen 报道，企业价值约 DKK 10bn（约 USD 1.44bn），按 2024 年 EBITDA DKK 374m 计算，对应 EV/EBITDA 约
              26.7×。这一溢价估值反映了高经常性收入结构、预期 ARR 增长，以及公司在建筑遥测品类中的领先位置，但也处在私营工业 SaaS 可比公司的上沿。


              这笔 LBO 配置了约 USD 500m 定期债务，加上一笔 USD 100m 收购贷款（合计约 USD 600m），约等于 8× 现金 EBITDA 杠杆——已经接近私人信贷对 SaaS
              的容忍上限。交易前既有融资约 €305m，由 SMBC Group 和 Park Square Capital 作为原有贷款方承销。KKR 在 2025 年债务包中作为新增承销方加入；unitranche
              俱乐部结构的定价指引约为基准利率加 500–525 个基点。Herter & Co.（Teneo 旗下公司）担任 Goldman Sachs Alternatives 的独家债务顾问。


              这一资本结构能否撑住，关键取决于 ARR 是否继续增长。在约 8× EBITDA 杠杆下，任何持续放缓——包括宏观逆风已经把 Trackunit 的收入增速从 2023 年的 18% 压到 2024 年的
              10%——都会明显压缩债务契约余量。公司未公开自由现金流转化率、新融资下的现金利息义务，以及契约维持测试；没有直接尽调权限时，资本充足性判断仍然不完整。
