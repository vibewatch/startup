      - number: '2.2'
        title: 市场规模与 TAM / SAM / SOM 视角
        blocks:
          - type: paragraph
            body: >-
              三个互补的规模测算视角共同校准 Trackunit 的机会。最宽口径是 IoT in Construction（硬件 + 软件 + 服务），2025 年规模为 USD 15.6 billion；Mordor
              Intelligence 预计 2031 年达到 USD 35.8 billion，CAGR 14.9%，由云部署加速、安全分析采用和 5G edge-computing 推动。北美占该市场
              38%；欧洲为第二大区域，受 EU Green Deal 碳审计要求推动而稳步增长；亚太是增长最快区域，CAGR 19.3%。

              更窄口径测算全球建筑设备车队管理和远程信息处理软件板块。Mordor Intelligence 估计，整体建筑设备市场 2026 年为 USD 205 billion，其中 connected services
              和软件只是少数切片——Precedence Research 将 equipment-plus-services 市场估值为 USD 226 billion（2025 年）。Allied Market
              Research 以 2021 年 USD 196 billion 为基期，预计 2031 年达到 USD 314 billion，CAGR 更保守，为
              4.8%。差异来自定义口径：有些报告纳入设备硬件，有些排除。相关的软件和服务子板块小得多——多家二级来源估计，2026 年综合远程信息处理订阅、车队管理 SaaS 和数据馈送层的 SAM 约 USD 5–7
              billion，可被 Trackunit 这类平台直接触达。

              Trackunit 自身提到平台上有超过 1 million 台已连接机器。若按行业典型每台机器 SaaS 定价 USD 10–30 / 月计算，其当前装机基础在完全货币化时，隐含年化收入 run rate 为
              USD 120–360 million——这是公司估计的上限，无法独立确认。在公开披露前，该自下而上估算只能作为低置信度规模假设保留。多名分析师给出的纯建筑设备远程信息处理软件市场规模，显著低于更宽的
              IoT-in-construction 数字；具体拆分仍是重大证据缺口。
