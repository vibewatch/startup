      - number: '7.2'
        title: 网络安全与运营风险
        blocks:
          - type: paragraph
            body: >
              Trackunit 的 IRIS 平台管理超过 350 万联网非公路资产，使其成为 IoT 定向网络攻击快速升级行业中的高价值目标。整个 IoT 领域中，2025-2026 年入侵尝试约增长 84%，估计每天有
              820,000 次恶意尝试通过默认凭证、开放端口和未修补固件攻击 IoT 基础设施。Trackunit 为 IRIS 持有 ISO/IEC 27001:2022 认证，运营公开 trust center
              并实时披露事件，执行第三方渗透测试，并对传输中和静态客户数据加密。截至 2026 年中，没有公开报道确认发生重大数据泄露。但重大风险仍在：ISO 27001 范围仅覆盖 IRIS SaaS
              平台，不延伸到旧款硬件产品或第三方 OEM 集成。Trackunit 未公开确认公司层面的独立 SOC 2 Type II 证明——仅称底层身份提供商已获 SOC 2
              认证，这给企业安全审查留下审计缺口。公司的公开 developer hub 和 API 文档暴露内部数据 schema 和 streaming topology，扩大了攻击者侦察面。2026 年云侧风险包括
              IAM 配置错误、访问控制不足和第三方 SaaS 集成暴露；对一个拥有 100+ OEM API 集成点的平台而言，这些都高度相关。
