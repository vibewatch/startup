      - number: '5.6'
        title: 客户工作流与部署模型
        blocks:
          - type: paragraph
            body: >
              Trackunit 的部署路径分为工厂内嵌和后装两种模式。OEM 客户订购预装 Raw 设备的设备；车队运营商在交付时收到已联网机器。租赁公司和承包商对现有车队后装时，使用 Trackunit
              的现场安装服务、自安装指南和 Fit App（2026 年推出）。Fit App 会引导安装人员完成设备设置，并在数据进入 IrisX
              前验证连接。这一步被定位为关键质量门，因为用户评论把数据缺口和误报归因于硬件安装不佳。

              设备联网后，典型运营流程包括：（a）Raw/TU700 通过蜂窝网络把 CAN J1939 诊断和 GPS 流式传输到 Iris；（b）工具上的 Kin T200 BLE 标签被 450,000+
              网关节点检测并转发到 IrisX；（c）IrisX 将多 OEM、多设备数据标准化并治理为统一资产视图；（d）车队经理和场站员工在 Trackunit Manager
              访问利用率、健康告警和故障码；（e）现场技术人员在 Trackunit Go 接收机器状态并记录维修备注；（f）IrisX APIs 向租赁管理系统、ERP 和 BI 工具馈送结构化数据；（g）IrisX MCP
              或对话式 AI 通过标准 AI 客户端工具向运营团队呈现车队智能。

              承包商使用 Trackunit Pass 执行操作员访问策略：只有具备凭证的人员才能启动受控设备，并在机器解锁前通过 On app 数字化完成使用前检查清单。租赁公司部署
              Portals，与客户共享利用率和可持续性指标，同时不要求这些客户持有 Trackunit 账户。

              Beam 网关产品把 BLE 覆盖扩展到室内和仓储场地，解决资产标签离开开放工地区域后失联的缺口。网络覆盖具有自我强化效应：每台配备 Raw 设备或 BLE 网关的动力机器，都会扩大附近 Kin 和 Spot
              标签的可视范围。
