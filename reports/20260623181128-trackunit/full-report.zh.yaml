      - number: '4.2'
        title: 财务表现与运营规模
        blocks:
          - type: paragraph
            body: >
              Trackunit 报告 2024 财年净收入为 USD 186.5m（DKK 1.29bn），同比增长 10%，高于 2023 年 USD 170m；2023 年本身较 2022 年增长 18%。2024 年
              ARR 增速快于总收入，增长 17% 至 USD 119.5m（DKK 812.6m），反映软件收入占比继续加速提升。经常性收入占总收入比例从 2023 年的 92% 提高到 2024 年的超过 95%。


              2024 年 EBITDA 约 DKK 374m（按会计口径约 USD 54m），Octus 报道 cash EBITDA 为 USD 62m（交易营销使用的数字）。会计 EBITDA 与 cash EBITDA
              的差额，反映非现金薪酬和一次性成本等标准 LBO 调整。毛利为 DKK 889.4m，隐含 blended gross margin 约 68.9%——与一个约 95% SaaS 收入、承担 cloud /
              connectivity COGS，另有约 5% 低设备层毛利硬件收入的平台相符。2024 年净利润为 DKK 188.25m；权益总额 DKK 1.64bn；总资产 DKK 3.24bn。


              2022–2025 年 Trackunit 收入 CAGR 约 15%；同期 ARR CAGR 约 22%，确认软件增长明显快于总收入。交易营销材料预计到 2029 年总收入 CAGR 为 21%、ARR
              CAGR 为 25%，EBITDA margin 稳定在约 30%——这是财务赞助方偏乐观的预测，需要在新债务服务结构落地后用实际业绩佐证。


              按 Revelio Labs workforce intelligence，全球员工数到 2025 年 12 月约 499 人；2025 年 3 月年度业绩公告引用的数字约 450 人。2024 年人均收入约
              USD 410K（USD 186.5m / 约 455 FTE），高于同规模 SaaS 公司行业中位数。2025 年活跃招聘岗位激增 192% 至 97 个空缺，显示 Goldman Sachs
              投资后招聘显著提速。CEO Søren Brogaard 报告 2024 年 employee eNPS 为 62，使 Trackunit 位于 SaaS 公司前 10%（行业平均约 30）。2023
              年月活用户达到 26,000；截至 2025 年 3 月已连接资产超过 3 million，到 2026 年 4 月达到 6.5 million，意味着平台网络快速扩张。
