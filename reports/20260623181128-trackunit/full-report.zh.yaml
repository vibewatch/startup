      - number: '6.3'
        title: 具名客户证明表
        blocks:
          - type: paragraph
            body: >
              Trackunit 的案例库记录了三个主要分层中的生产部署。不同客户的证据深度和独立性差异很大。

              Sunbelt Rentals UK & Ireland 是置信度最高的具名客户。双方合作在 2025 年 11 月公开扩展，连接资产增加到
              20,000+，新增非传统资产类别（电池储能、太阳能宿舍、灯塔、油箱），并在 2025 年 11 月基于 IrisX Portals 启动品牌化客户门户。Sunbelt Rentals 资产连接总监
              Matthew Ross 公开确认部署，并提到预测性 AI 维护、碳排放可视化和实时车队分析已经在生产中运行。Trackunit CMO 在 IRE 2026（2026 年 4 月）确认 Sunbelt 已经上线
              Portals。这是多年期、生产级部署，并由独立行业媒体 Project Plant 交叉印证。

              Gammon Construction 是资料最完整的承包商客户。Gammon Executive Director and CTO Paul Evans 详细讲述了 Trackunit
              在香港、新加坡和中国大陆的多年部署，提到可衡量的燃料消耗下降、设备利用率提升，以及由 Trackunit 数据驱动的文化变革项目。案例研究托管在 trackunit.com，但 CTO
              具名表述和运营细节提供了较强参考价值；没有独立印证。

              Hilti 通过 Works With Trackunit program 的集成同时获得 Hilti Group 新闻稿和 Trackunit 文章印证。超过 500,000 个 Hilti ON!Track
              标签已集成到 Trackunit Bluetooth network。Hilti 战略副总裁 Dan Wade 表示：“Trackunit 合作让我们能远远超出自身产品范围去扩张。”
              厢式车库存和重型设备管理方案已在全球生产运行。

              Epiroc InSite™（附件部门，由 IrisX 驱动）由 Epiroc 自有产品页和 Trackunit 文章确认。Epiroc Attachments Head of Digital Solutions
              Thomas Bejefalk 表示：“推出 InSite™ 后几周内，我们就开始看到市场产生强劲牵引。” 这是生产中的 OEM 联名部署，并有 Epiroc 商业页面的独立印证。

              Jekko（意大利蜘蛛吊 / 迷你吊制造商）于 2025 年 11 月推出 J-LINK，基于 Trackunit 平台构建。Jekko USA 新闻稿和独立吊装行业媒体 vertikal.net
              均确认合作。所有新 Jekko 吊车型号均工厂预装；既有车队可后装。

              Skyjack（Linamar Corporation）在 2017 年宣布与 Trackunit 合作，并于 2018 年上线。这是最早的具名 OEM 合作，获得 Skyjack 自有网站和独立媒体 Lift
              and Access 确认。Skyjack 提到 Trackunit 的 off-highway 专业性和混合车队兼容性，是其选择依据。

              Leadway Heavy Machinery（泰国经销商）部署了 Trackunit 基于 SIM 的遥测，用于远程诊断和预测性维护，提高服务出行效率并减少机器停机。该部署记录在
              casestudies.com。
