      - number: '5.3'
        title: OEM 连接与行业标准
        blocks:
          - type: paragraph
            body: >
              Trackunit 的 OEM 集成模型分为两个层面：工厂内嵌硬件和数据层标准。硬件层面，Trackunit 与 150+ OEM 合作，在工厂产线上把 Raw
              遥测设备预装进机器，车队所有者交付时即可拿到已联网设备，无需后装。TU700 支持双向 OTA 配置：CAN profile 更新、Modbus profile 变更和 Operating Mode
              调整，都可通过 Telematics Device API 远程下发；2026 年 6 月新增的回滚能力，可在配置任务需要撤回时恢复此前设备状态。

              数据标准层面，Trackunit 完整实现 ISO 15143-3（建筑设备 AEMP 2.0 遥测标准）。AEMP ISO Export API 是 REST 接口，可按调用方选择输出 XML 或
              JSON，覆盖所有客户可用的车队快照端点，并为 Evolve & Expand 和 Link-Lift-Leap 订阅层级提供时间序列端点。该 API 按标准要求实现 ISO 15143-3 分页，并开放
              base URL pattern iris.trackunit.com/public/api/aemp/v2/15143/-3/Fleet/。Trackunit 还通过可选 addMetadata=true 和
              addExtendedData=true 查询参数扩展该标准，暴露 ISO schema 之外的专有字段。

              2025 年，Trackunit 新增 CAN Faults API v1，开放通过联网设备上的 CAN J1939 采集的诊断故障码数据。2026 年 5 月，AEMP ISO Faults endpoint
              增强为可通过 Accept-Language 返回本地化故障码描述；在 OEM 存在翻译数据时，支持英语、德语、法语、意大利语、西班牙语、荷兰语、波兰语和日语本地化。

              开发者中心中的 ISO feed Marketplace 节点列出可导入的第三方 OEM 遥测 feeds，允许使用非 Trackunit 原生 OEM 门户的车队运营商把这些数据标准化到
              IrisX。Trackunit 的 Marketplace 记录了 60+ 此类 OEM 数据源。
            claimRefs:
              - CE010
              - CE011
              - CE021
              - CE022
              - CE023
              - CE024
