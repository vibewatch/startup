              - CE029
      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Trackunit 发布 Trust Center（trust.trackunit.com），其中包含 Platform Security
              FAQ、合规文档和实时状态页。公开的安全原则包括：持续扫描和监控；传输中与静态数据加密；定期第三方渗透测试；24/7/365 DevOps 监控；面向工程师的专门 ethical-hacker 培训；以及符合
              GDPR 的个人数据处理。

              硬件安全：TU700 在设备到平台通信中使用 DTLS 1.2，并采用 NIST 推荐密码套件。平台级 REST 通信通过 HTTPS 运行。用户身份数据由第三方身份管理提供商管理，该提供商持有 SOC
              2、SOC 3、ISO 27001、ISO 27017、ISO 27018 和 CSA Star Level 2 认证；Trackunit 未公开其名称。企业级 SSO 和自适应 MFA
              可按客户账户启用。Trackunit 在 IrisX 平台文档中提到 ISO 27001 合规，但截至运行日期，Trust Center 未提供可公开下载的证书或审计报告。

              GDPR 姿态：Trackunit 代表客户控制者担任数据处理方。公司为 EU/EEA 客户提供 Data Processing Agreement（DPA）；为非 EEA 传输提供 Standard
              Contractual Clauses（SCCs）。公司称，除非合同明确另有约定，数据在 EEA 内处理。指定 Data Protection Officer 为 Thomas
              Christiansen（[email protected]）。公司公布子处理方清单，并可通过邮件订阅获取变更通知。

              正常运行时间：根据公开状态页，截至 2026 年 6 月 23 日，Trackunit Manager 在过去 90 天报告 100% 正常运行时间。此前 60 天内的已知事件包括 2026 年 5 月 27 日
              Manager 数据延迟（当天解决）、两次资产元数据更新延迟事件、SCOM ONE i3 M-Series 集成的一次性数据延迟，以及约两个月前 Manager 和 Verify 的降级性能事件。90
              天窗口内没有记录重大中断。Trackunit Trust Center 未公开 SOC 2 Type II 证明报告，这是企业采购尽调缺口。

              用户评论信号：Capterra 用户在 26 条评论中给 Trackunit 4.3/5，正面评价集中在易用性、CAN
              数据价值和服务排程功能。负面评论提到硬件安装质量失败（进水、设备安装不当导致短路）、取消合同时电话支持无响应，以及合同终止时的账单争议。这些更像实施层风险，而不是平台级故障。
