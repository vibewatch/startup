  - id: TI002
    title: 定价和变现模型
    columns:
      - 方案 / 层级
      - 目标客户
      - 定价结构
      - 已披露标价
      - 规模经济
      - 来源
    rows:
      - - OEM 方案
        - 设备制造商（OEM）
        - 按预装资产计费；支持实时遥测、远程诊断、售后分析和品牌化客户门户
        - 未披露 — 仅定制报价
        - 规模越大，单资产费率越低；OEM 车队规模通常为数千台
        - trackunit.com/pricing、trackunit.com/oem（官网）
      - - 租赁方案
        - 管理混合车队的租赁公司
        - 按资产计费；覆盖利用率报告、维护排程、客户计费优化和混合车队可视性
        - 未披露 — 仅定制报价
        - 大型租赁库存享受批量折扣（例如 Sunbelt Rentals 20,000+ 资产）
        - trackunit.com/pricing、trackunit.com/rental（官网）
      - - 承包商方案（Explore / Evolve / Expand）
        - 建筑承包商；三个递升级别
        - 按资产加服务包计费；Explore = 基础跟踪 / 报告，Evolve = 诊断 + 排程，Expand = 全面数字化 + 排放 + 定制报告
        - 未披露 — 仅定制报价
        - 小车队 ARPA 低于 OEM/租赁；随规模提升而改善
        - trackunit.com/pricing/contractor、help.trackunit.com 定价 FAQ
      - - 企业 / 定制
        - 大型部署；多分部企业账户
        - 定制合同；通常为多年期，含定制 SLA、服务保证和共同开发的集成
        - 未披露 — 仅直销
        - 单位经济性最佳；锚定账户关系（例如前 10 大客户 = 约 50% 收入）
        - Octus 交易贷款人报告、GRO Capital 投资组合叙述
    notes: >-
      Trackunit 不公布标价；官方定价页和帮助中心 FAQ 均显示，所有层级都只提供定制报价。四步搭建方式（软件方案、资产配置、服务包、附加项） 使实际 ARPA 因层级、车队规模和合同期限而大幅变化。公开定价不透明，是企业
      SaaS 的有意做法。
