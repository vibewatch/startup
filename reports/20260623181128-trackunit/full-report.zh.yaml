      - number: '8.4'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              三个情景由五个关键变量驱动：（1）自 2025 年中起 5 年持有期内的 ARR CAGR，（2）EBITDA 利润率轨迹， （3）退出倍数，（4）杠杆 /
              资本结构假设（尚未确认），以及（5）欧洲建筑宏观复苏速度。 以下所有情景都是估算构造；Trackunit 不发布前瞻指引，GS/Hg 收购价格及任何相关杠杆也未公开披露。 这些情景假设持有 5 年，并在约
              2030 年退出。


              牛市情景下，Trackunit 通过加速 IrisX 平台采用、扩大 OEM 集成、打入北美承包商市场， 并受益于 2026 年起欧洲建筑恢复到 2%+ 年增长，在五年内实现 17–20% ARR CAGR。
              随着软件收入占比提高、IrisX 带来追加销售、经营杠杆改善，EBITDA 利润率从 29% 扩大至 35%。 若 2030 年 EBITDA 约 $145 million、退出倍数为 25–28x
              EBITDA，隐含退出 EV 为 $3.6–4.1 billion， 相当于入场 EV 的 2.5–2.8x——对 GS/Hg 结构是强结果，但要求执行几乎无瑕疵。


              基准情景下，Trackunit 凭借适度 IrisX 采用、稳定 OEM 关系和缓慢建筑复苏 （欧洲产出每年增长 1–2%），维持 10–12% ARR CAGR。EBITDA 利润率稳定在 28–31%。 若
              2030 年 EBITDA 约 $95–105 million、退出倍数为 20–23x EBITDA，隐含退出 EV 为 $1.9–2.4 billion， 对股权持有人代表 1.3–1.7x
              MoM——考虑当前入场倍数，对 5 年持有期来说可以接受，但不算出色。


              熊市情景下，欧洲建筑市场复苏停滞（德国和法国到 2027 年仍偏弱），Samsara 或 OEM 嵌入式方案竞争加剧， IrisX 采用滞后，Trackunit 仅实现 5–7% ARR CAGR。平台投资成本使
              EBITDA 利润率压缩至 24–27%。 若 2030 年 EBITDA 约 $70–75 million、退出倍数为 16–19x EBITDA，隐含退出 EV 为 $1.1–1.4 billion，
              接近或低于 $1.45 billion 的入场 EV——按杠杆情况不同，对新股权投资者意味着价值毁损或持平结果。


              欧洲宏观背景给基准和熊市情景增加了不对称风险。CECE 数据显示，2024 年建筑设备市场下滑 19%； Bain 警示法国、德国和意大利在 2026–2028 年前复苏缓慢或延后，这让情景分布偏向负面。
              关键摇摆因素在于，租赁和承包商客户面临设备利用率压力时，Trackunit 的经常性收入模型能否仍维持 95%+ 留存； 2024 年在宏观逆风下 ARR 仍增长 17%，这是积极信号，但只是一个数据点。
