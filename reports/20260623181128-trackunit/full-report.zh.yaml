      - number: '6.5'
        title: 集中度风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Trackunit 以 OEM 为中心的商业化路径，在渠道层面带来结构性集中度风险。FactMR 非公路遥测市场分析（2026 年 4 月）预计，到 2026 年 OEM 工厂安装系统将占 64%
              市场份额，Caterpillar、John Deere、Komatsu 和 Trimble 都在扩张专有生态。Trackunit 通过 100+ OEM 集成受益于这一转变，但同一转变也带来风险：大型 OEM
              如果开发或收购自有遥测平台，可能减少或取消对 Trackunit 的依赖。Platform Science 收购 Trimble 遥测业务（2024 年末）和 DEVELON MY 平台发布，说明 OEM
              侧整合可以重画市场格局。

              没有任何单一具名客户被确认占 Trackunit 收入超过 10%，但公司不披露收入集中度数据。Hg Capital 组合页面和 Goldman Sachs 投资公告均提到 Trackunit
              拥有“覆盖完整建筑价值链的全球多元客户基础”，这与单一客户集中度有限相符，但没有第三方财务文件验证。

              伙伴依赖是次级风险。Hilti、Skyjack、Epiroc、Bosch Rexroth 和 Danfoss 都为 Trackunit 生态带来显著规模。如果其中任何伙伴——尤其是 Hilti（Trackunit
              network 中 500K+ devices）或 Skyjack（多年期生产 OEM）——迁移到竞争平台或自建专有遥测，Trackunit
              的联网资产数和收入都会受到实质影响。这些合作没有公开披露最低期限或排他条款。

              反向客户证据记录了真实执行缺口。一条 Capterra 评论给 Trackunit 1/5
              星，描述硬件安装很差，以至于进水损坏连接、持续电池耗尽、数月无法联系支持、因争议费用被威胁债务催收，以及取消流程不可访问。Trustpilot 汇总分为 1.8/5，来自 32 条评论，与策展后的
              FeaturedCustomers 4.8/5 形成鲜明对比。G2 来自 6 条评论的平均分为 2.8/5。这些评分集中在 SMB 和独立运营商分层，说明 Trackunit
              的售后支持模型尚未扩展到能服务长尾小客户。高质量具名企业账户与 SMB 负面评价之间的分歧，是尽调信号：长尾客户流失和负面口碑可能在结构上高于公司客户成功叙事所暗示的水平。

              OEM 内嵌部署的渠道 / 采购摩擦看起来较低（硬件在工厂预装），但后市场后装摩擦更高；安装质量、SIM 兼容性（Leadway 在泰国记录过）和持续支持可及性，是多项反向来源共同提到的痛点。
