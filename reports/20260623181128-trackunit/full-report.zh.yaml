  - id: TI003
    title: 单位经济性
    columns:
      - 指标
      - 价值 / 状态
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 综合毛利率（2024）
        - ~68.9%（DKK 1.29bn 净收入对应 DKK 889.4m 毛利）
        - 高
        - 核心平台经济性；体现 SaaS 占主导（高毛利），但被硬件 COGS（较低毛利）抵消
        - 按分部拆分硬件 vs. SaaS 毛利率；IrisX 增量 COGS
      - - EBITDA 利润率（2024）
        - 会计口径约 29%（DKK 374m / DKK 1.29bn）；现金 EBITDA 约 33%（$62m / $186.5m）
        - 高
        - 规模化盈利能力；LBO 结构下的关键杠杆覆盖指标
        - 维护性契约；自由现金流 vs. EBITDA 调节表
      - - ARR 增长率（2024）
        - 同比 17%（USD 119.5m，高于 2023 年约 USD 102m）
        - 高
        - 经常性收入速度；把自然留存 / 扩张与硬件驱动噪音区分开
        - ARR 瀑布：新客户 ARR、扩张 ARR、流失 ARR；NRR/GRR
      - - 人均收入（2024）
        - 约 USD 410K（USD 186.5m / 约 455 FTE）
        - 中
        - 运营效率代理指标；高于 SaaS 行业中位数，符合高毛利平台特征
        - 全口径员工成本；股权激励占收入比例
      - - 净收入留存（NRR）
        - 未披露；ARR 增长 17%，且经常性收入占比 95%，说明留存可能较强，但扩张与流失拆分未知
        - 低 — 仅推断
        - 对判断 ARR 耐久性和 LBO 杠杆下的流失风险至关重要
        - 按 cohort 和客户层级（OEM、租赁、承包商）提供年度 NRR/GRR 历史
      - - 客户获取成本（CAC）
        - 未披露
        - 低 — 无法获得
        - 评估当前增长率下的回本周期和 S&M 效率的关键
        - 按渠道和客户类型拆分全口径 CAC；月数口径回本周期
