        - EDPB 执法登记册；Trackunit 公开信任中心；欧盟行业范围执法通知
        - EDPB 对 Trackunit 启动调查，或任何欧盟远程信息处理同行因同等行为被罚 >€5M
        - 重大：暂停新增投资批次；要求内部合规审计；聘请独立隐私法律顾问
      - - OEM API 限制 / 竞争替代
        - OEM 新闻稿；Trackunit OEM 集成页面更新；行业分析报告中的嵌入式远程信息处理渗透率
        - 12 个月内 3+ 个主要 OEM API 合作关闭或受到实质限制；或 OEM 嵌入式远程信息处理在新机器销售中的份额超过 75%
        - 主要：重新评估混合车队聚合器策略；测算 OEM 数据访问减少对 ARR 的影响；评估战略替代方案
      - - 建筑需求周期收缩
        - AGC Construction Outlook；FMI 季度更新；Trackunit ARR 增长披露（如有）；租赁行业利用率
        - 全球建筑设备新机销量同比下降 >20%；或 Trackunit ARR 增长率连续 2 个季度转负
        - 重新测算下行情景；评估契约覆盖；评估租赁公司客户流失风险
      - - 网络安全事件
        - Trackunit 公开状态页；HaveIBeenPwned；CERT 通报；GDPR 第 33 条下的客户通知义务
        - 已确认 Trackunit 平台被攻破，发生客户数据外泄，或运营中断影响 >1% 联网车队
        - 立即：委托独立取证审查；评估 GDPR 通知义务；在修复完成前暂停新客户上线
      - - PE 杠杆 / 债务契约违约
