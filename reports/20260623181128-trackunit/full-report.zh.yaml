      - number: '8.3'
        title: 上市与私有可比估值分析
        blocks:
          - type: paragraph
            body: >-
              最相关的上市可比公司是 Samsara（NYSE: IOT），一家服务实体运营企业的车队运营和 IoT SaaS 平台。 截至 2026 年 6 月 23 日，Samsara 企业价值为 $16.96
              billion，基于 FY2026 收入 $1.62 billion （同比 +30%）和 ARR $1.89 billion（同比 +30%），过去十二个月 EV/Sales 为 9.8x。 Samsara
              相比 Trackunit 隐含 EV/Revenue 约 7.8x 有溢价，表面上可能说明 Trackunit 相对公开市场定价有吸引力。 但关键的增长调整比较会反转这个结论：Samsara 的
              EV/Revenue 除以收入增长率（9.8 ÷ 30）得到 GRM 0.33， Trackunit 的对应比率（7.8 ÷ 10）为 0.78——即便采用 10% 收入增长指标，Trackunit
              每单位增长的价格也超过两倍。 若按 17% ARR 增长计算（对 SaaS 业务可能更有意义），GRM 为 0.46，仍比 Samsara 贵 40%。 Samsara 股价在截至 2026 年 6 月的 52
              周内下跌约 20%，说明公开市场对 IoT SaaS 有一定倍数压缩， 这会给任何 Trackunit 重新评级造成逆风。


              Trimble（Nasdaq: TRMB）提供了有用的建筑软件基础设施基准。Trimble 报告 FY2025 收入 $3.59 billion、 ARR $2.39 billion、调整后 EBITDA
              $1.046 billion（29.2% 利润率）。在市值约 $11.8 billion、 EV/Revenue 约 3.3x 的情况下，Trimble 相比 Trackunit 隐含倍数折价很大；但
              Trimble 增长更慢 （2025 年有机增长 6%），规模大得多，终端市场组合也更多元。Hexagon AB（Nasdaq Stockholm：HEXA B）， 全球测量和建筑地理空间软件龙头，以 2025
              年收入 €5.4 billion 计，EV/Revenue 约 5.6x， EBITDA 利润率 36%——更接近 Trackunit 的倍数，但规模远大得多。Powerfleet（Nasdaq: AIOT），
              由 Powerfleet/MiX Telematics 合并形成的车队远程信息处理公司（2024 年 4 月完成合并）， 仅以 1.74x EV/Sales 和 9.0x EV/EBITDA
              交易——显示市场对低增长、低利润率车队远程信息处理的折价有多深。 Geotab 是最大的私有车队远程信息处理公司，估计 2024 年收入超过 $680 million，但不披露估值；
              若按同业倍数推算，隐含估值区间 $3–5 billion，对应 4–7x EV/Revenue，与可比区间低端一致。


              放到整个 M&A 市场看，2025 年 AEC M&A 市场中，顶级 PE 支持建筑软件公司的 EV/EBITDA 交易倍数为 10–13x， 远低于 Trackunit 的 26.7x——说明 GS
              交易价格反映的是一般 AEC 可比公司拿不到的 SaaS 品质溢价。 鉴于 Trackunit 的经常性收入质量和平台地位，这个溢价可以辩护；但它也留下有限的倍数扩张空间，
              回报将主要取决于盈利增长，而不是重新评级。
