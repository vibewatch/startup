      - number: '5.5'
        title: 产品路线图与生态定位
        blocks:
          - type: paragraph
            body: >
              Trackunit 到 2026 年的路线图以 AI in IrisX 为核心：把机器智能直接嵌入平台，而不是把 AI 作为单独分析工具叠加。IrisX MCP Server 于 2026 年 6 月 16
              日发布，借助开放的 Model Context Protocol 标准，让 Claude、ChatGPT、Gemini 和 Microsoft Copilot
              可执行自然语言车队查询与操作，终端用户无需自定义集成。IrisX 会丰富底层数据，用来回答车队问题、触发告警、更新记录并自动化多步任务。Trackunit 还计划在 2026 年夏季于 Trackunit
              Manager 内发布对话式 AI 助手。

              除 AI 外，2026 年路线图还包括：（1）IrisX Blueprints——Marketplace 上可复用、预构建的解决方案模板，覆盖 Smart Servicing、Out-of-Contract
              Usage detection、Custom Reporting、Site Optimization 和 Data-Driven Product
              Design；（2）Portals——品牌化、可定制的车队数据共享界面，已在 Sunbelt Rentals UK & Ireland 上线；（3）Inspections——通过 Trackunit On app
              运行的移动端使用前安全检查工作流，把现场安全数据连接到车队健康（Trackunit 公司披露数据：被忽视的危险因素导致 30% 的工作场所事故；数字化巡检最多可降低 25% 维护成本）；（4）Fit
              App，用于从首次设备安装开始监控连接健康。

              生态方面，Trackunit 的开放开发者路径——GraphQL/REST APIs、Iris App SDK、Marketplace 分发——把 IrisX 定位为面向第三方建筑技术开发者的平台。IrisX 获
              Databricks 2025 Data + AI Awards 认可，Bosch Rexroth 和 Irdeto 被列为近期战略生态伙伴。IPAF 合作（ePAL credential app 下载量超过
              100 万）把 Pass 访问产品连接到全球高空作业认证机构。

              产品门户（trackunit.com/product-portal/）公开展示路线图状态（“计划中、构建中、已发布”），作为生态信号机制。
