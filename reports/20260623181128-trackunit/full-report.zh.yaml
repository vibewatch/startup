      - CV039
      - CV040
      - CV043
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2025 年 ARR 和 NRR
        - Trackunit 2025 全年 ARR（目前只有第三方聚合商提供的收入约 DKK 1.26B；未发布 ARR 数字）；净收入留存率从未公开披露
        - 对一家 95% 经常性收入的 SaaS 公司，ARR 是主要估值驱动；基准情景需要 NRR 高于 110% 才能维持；2025 年收入下降可能掩盖 ARR 韧性，也可能确认结构性放缓
        - 向管理层或 Goldman Sachs IR 索取；或等待 Trackunit ApS 2025 年经审计年报向 Danish Business Authority 备案（CVR 编号 20750170）
      - - 资本结构 / 杠杆
        - GS/Hg 交易的债务结构未公开披露；没有迹象说明收购是否部分由杠杆融资，以及适用哪些契约
        - 杠杆高于 4x EBITDA 会显著压低基准和熊市情景的股权层面回报；契约风险增加再融资不确定性；LBO 回报建模必须取得该信息
        - 向 Goldman Sachs Alternatives 或 Hg Capital 投资者关系索取；如果债务外部配售，北欧高收益或杠杆贷款市场可能有定价数据
      - - IrisX 商业牵引
        - 截至 2024 年 Q3 仅披露五家早期企业采用者；未发布 IrisX ARR 贡献；没有量化 ROI 的客户案例
        - IrisX 是主要追加销售和评级上修催化剂；若无法证明商业采用，牛市情景就是推测；OEM 和承包商决策周期可能为 12–18 个月，意味着 2024 年采用者到 2026 年应已提供数据
        - Trackunit 管理层；建筑行业客户参考访谈；监测新闻稿和产品门户中的 IrisX 扩张公告
      - - 相对 Samsara 的竞争定位
        - 无独立竞争胜负数据；Samsara 的建筑垂直策略未公开详述；无第三方分析覆盖对 Trackunit 和 Samsara 做正面对比
        - Samsara 在规模化基础上 ARR 增长 30%，且 IoT 平台广，若加深建筑垂直聚焦，可能构成竞争威胁；Trackunit 相对 Samsara 的 GRM 劣势需要监测
        - 独立建筑技术分析师报告；G2/Gartner 评论对比分析；直接访谈 OEM 和租赁客户
      - - 退出路径和 Goldman Sachs 持有期
        - Goldman Sachs 未披露目标退出时间表、IPO 准备活动或战略出售讨论；Hg 再投资释放至少持有 3–5 年的信号
        - 退出时间和路径（IPO vs. 贸易出售 vs. PE-to-PE）会实质影响股权 IRR 计算；建筑科技 IPO 窗口当前有限；战略买方可能要求价格让步
        - 监测 Goldman Sachs PE 投资组合公告和 Trackunit 新闻稿；跟踪建筑技术 M&A 市场活动（Autodesk、Trimble、Hexagon、Volvo 收购）
      - - 完整所有权结构和董事会构成
        - 交易后 Goldman Sachs、Hg 与管理层之间的股权拆分未完全披露；除初始公告外，GS 收购后的董事会构成未确认
        - 管理层展期股权比例和激励结构影响一致性；董事会构成影响治理和退出决策权限
        - Trackunit 领导层页面；Danish Business Authority 备案；Goldman Sachs PE 投资组合披露
    notes: >-
      非公开数据的尽调路径需要投资者或 LP 能够接触 Goldman Sachs Alternatives、Hg Capital 或 Trackunit 管理层。丹麦法定年度账目（CVR 备案）公开可得，但滞后 6–12
      个月，并提供经审计收入和 EBITDA，SaaS 专项指标有限。
    claimRefs:
      - CV011
      - CV013
      - CV041
      - CV042
      - CV044
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Trackunit 的公开记录从 1998 年的丹麦前身开始，经历三轮 PE 阶段、IrisX 平台发布和 2025 年 Goldman Sachs 回归——资产连接数自 2016 年以来增长超过十倍。
