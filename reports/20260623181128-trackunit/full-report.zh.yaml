      - number: '3.2'
        title: 直接平台竞争者
        blocks:
          - type: paragraph
            body: >-
              Samsara 是 Trackunit 最强大的规模化竞争者。其 Connected Operations Platform 报告 FY26 ARR 为 $1.9 billion，同比增长 30%，每年处理超过
              25 trillion 个数据点——这一数据护城河反过来推动面向所有客户的 AI 模型改进。Samsara
              面向建筑、运输、物流和公用事业，提供统一平台，覆盖车辆、挂车、资产、路线、导航和维护。其扩张路径通常从视频远程信息处理或车辆车队追踪开始，再通过 asset gateways 和标签扩展到建筑设备监控；FY26
              Q4 提到 Estes 从车辆远程信息处理扩展到设备监控。Samsara 的 NRR 强，$100K+ ARR 客户中 96% 至少使用两款产品，说明平台粘性高。但 Samsara 并非建筑专用：它没有
              Trackunit 通过 IrisX 提供的 OEM 数据归一化深度、AEMP / ISO feed 集成，或建筑垂直 AI。Geotab 是排名第一的商用远程信息处理平台（ABI Research），拥有
              350+ 合作伙伴方案的开放市场，估计年收入 $700M+。Geotab 的开放数据平台和庞大经销商网络带来竞争触达，但建筑仅占其客户基础约 8%，产品为公路车队管理而建，不是非公路机器健康。Teletrac
              Navman 提供强合规和路线导向套件（ELD、驾驶员评分卡、视频远程信息处理、车队维护），受到同时运营商用车辆和重型设备的车队型承包商欢迎。GPS Insight 提供实时 GPS 车队追踪、维护提醒和 60+
              预置报告，主要在 SMB 和中端承包商细分竞争。建筑专用平台 Tenna（700+ 建筑企业）和 Hapn 直接瞄准 Trackunit 的承包商版图：Tenna
              把设备、车辆、工具、附件和材料统一在一个由承包商打造的系统中；Hapn 则提供灵活的月付定价，对比 Trackunit 通常要求 36–42 个月合同，是用户评估替代方案时提到的反向差异点。
