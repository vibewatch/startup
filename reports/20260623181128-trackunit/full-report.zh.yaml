      - number: '2.5'
        title: 规模测算缺口、尽调问题与矛盾
        blocks:
          - type: paragraph
            body: >-
              三类分析缺口仍然存在。第一，市场定义不一致：USD 17.9 billion 的 IoT-in-construction TAM 包含硬件，而 Trackunit 竞争的可寻址 SaaS /
              软件子板块明显更小——二级分析师对纯建筑设备远程信息处理软件市场的估计，到 2031 年从 USD 2.5 billion 到 USD 10.6 billion 不等，取决于范围（仅平台订阅，还是硬件 +
              服务）；也没有可信独立发布的多 OEM 混合车队 SaaS 层 SAM 数字。第二，欧洲子市场收入：Trackunit 源自北欧 /
              欧洲，并自称在欧洲租赁远程信息处理领域领先，但无法用公开欧洲建筑远程信息处理市场收入数据交叉验证；ERA 和 FIEC 不发布远程信息处理支出拆分。第三，渗透率不确定：全球部署中的建筑机器数量（估计活跃重型设备
              1.5–3 million 台，不含轻型 / 紧凑型设备和工具）以及其中拥有任何活跃远程信息处理订阅的比例，都没有独立验证；Trackunit 声称的 1 million+ 已连接机器，可能代表 33–67%
              的市场渗透率，也可能低得多，取决于总可寻址车队定义。

              这些缺口让 SAM / SOM 搭建仍有显著不确定性，也意味着任何单一自上而下估计都应谨慎对待。Mordor IoT-in-construction 数字（2031 年 $35.8 B）与 Allied
              Market Research 建筑设备市场（2031 年 $313.9 B，CAGR 4.8%）之间的 TAM 矛盾说明，范围错配驱动了多数表面差异——前者覆盖软件 / 服务 IoT，后者覆盖整个设备市场。
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
