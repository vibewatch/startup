        - from: contractor
          to: trackunit
          label: 资产监控订阅
        - from: dealer
          to: trackunit
          label: 服务触发数据订阅
        - from: trackunit
          to: oem
          label: 标准化车队分析 + 产品设计反馈
        - from: trackunit
          to: rental
          label: 车队可视化看板 + 计费触发器
        - from: trackunit
          to: contractor
          label: 工地合规报告 + 维护提醒
        - from: trackunit
          to: dealer
          label: 预测性服务触发器 + 零部件需求信号
        - from: trackunit
          to: marketplace
          label: 开放 API 数据流 + 开发者 SDK
