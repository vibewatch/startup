        - 严重 / 关键影响
      rows:
        - label: 几乎确定（5）
          values:
            - label: 数据主权运营成本
              tone: warning
            - label: GDPR / Data Act 合规负担
              tone: warning
            - label: IoT 行业网络攻击升级
              tone: negative
            - null
        - label: 可能（4）
          values:
            - null
            - label: ISO 认证续期压力
              tone: warning
            - label: OEM 嵌入式替代
              tone: negative
            - label: 建筑需求周期
              tone: negative
        - label: 有可能（3）
          values:
            - null
            - label: PE 杠杆 / 退出压力
              tone: warning
            - label: 云供应商锁定
              tone: warning
            - label: 数据可携带性流失（Data Act）
              tone: negative
        - label: 不太可能（2）
          values:
            - null
            - label: API 弃用（小型 OEM）
              tone: neutral
            - label: 领导层离任
              tone: warning
            - label: 勒索软件 / 平台入侵
              tone: negative
        - label: 罕见（1）
          values:
            - label: 硬件供应中断
              tone: neutral
            - null
            - label: 监管产品禁令
              tone: warning
            - null
    approximationNotes: |
      可能性和影响位置是基于截至 2026 年 6 月公开证据做出的定性评估。剩余风险位置假设运营和监管风险登记表中披露的缓释措施正在发挥作用。
    claimRefs:
      - CR009
      - CR010
      - CR014
      - CR017
      - CR022
      - CR026
      - CR034
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |
      有向无环图展示根因风险事件如何沿运营、客户、监管和财务后果传导，最终造成估值受损。
    data:
      nodes:
        - id: demand-decline
          label: 建筑需求下滑
        - id: oem-api-restrict
          label: OEM API 限制
        - id: cyber-breach
          label: 网络安全入侵
        - id: gdpr-noncompliance
          label: GDPR / Data Act 不合规
        - id: pe-leverage
          label: PE 杠杆压力
        - id: ceo-departure
          label: CEO 离任
        - id: cloud-outage
          label: 云基础设施中断
        - id: arr-compression
          label: ARR 压缩
        - id: customer-churn
          label: 客户流失
        - id: regulatory-fine
          label: 监管罚款 / 执法
        - id: mf-impairment
          label: 混合车队价值受损
        - id: market-share-loss
          label: 市场份额流失
        - id: valuation-impair
          label: 估值受损
        - id: growth-cut
          label: 增长投资削减
        - id: strategic-uncert
          label: 战略不确定性
      edges:
        - from: demand-decline
          to: arr-compression
          label: 缩小联网资产基数
        - from: oem-api-restrict
          to: mf-impairment
          label: 削弱混合车队数据
        - from: cyber-breach
          to: customer-churn
          label: 侵蚀平台信任
        - from: cyber-breach
