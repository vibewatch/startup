      items:
        - date: '1998'
          label: M-Tec A/S 在 Aalborg 成立
          detail: 前身实体奠定丹麦工业 IoT 根基；Trackunit 品牌随后于 2003 年出现。
          tone: neutral
        - date: '2003'
          label: Trackunit 品牌确立
          detail: 建筑远程信息处理重点正式成型；从通用 IoT 转向非公路领域。
          tone: positive
        - date: '2015'
          label: Goldman Sachs + GRO Capital 收购
          detail: 首次机构 PE 进入；国际扩张和 SaaS 转型加速。
          tone: positive
        - date: 2021-03
          label: Hg Capital 收购多数股权
          detail: GS 和 GRO 退出；Hg 带来 SaaS 规模化经验；建筑数字化进入临界点。
          tone: positive
        - date: '2021'
          label: Works With Trackunit 计划启动
          detail: 生态伙伴策略正式成型；OEM 集成从 ISO 15143-3 标准起步。
          tone: positive
        - date: 2023-11
