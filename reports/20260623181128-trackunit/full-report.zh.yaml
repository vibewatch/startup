      - number: '1.3'
        title: 领导层、治理与所有权结构
        blocks:
          - type: paragraph
            body: >
              Søren Brogaard 于 2020 年 12 月被任命为 Trackunit CEO；他 2016 年加入公司担任 Chief Technology Officer，并自 2017 年 12 月起担任
              Chief Commercial Officer。Trackunit 对他的履历强调数据驱动的全球客户成功策略、数字化转型领导力，以及价值和使命驱动的管理。Brogaard 代表 Trackunit 公开推动过
              IrisX 平台发布、2024 年产品扩张和 2025 年 Goldman Sachs 投资流程。运营领导、产品愿景和外部投资人信任集中在一名高管身上，构成关键人物依赖，正式尽调需要评估。其他 C-suite
              成员包括 Chief Product & Marketing Officer Lærke Ullerup、COO Evan Barnes、CFO Michael Tritschler、Chief Product
              & Technology Officer Mikkel Dalgas、EVP Engineering Anders Thorbjørn Jensen、Chief People Officer Martin
              Darré、Chief Revenue Officer Amish Sabharwal，以及 General Manager EMEA Morten Gram。公开列示的董事会包括 Chairman Tod
              Nielsen，以及 Hg Capital 的 Nick Jordan 和 Søren Holt、Goldman Sachs Alternatives Managing Director James
              Robinson 等董事，独立成员包括 Nana Bule、Sarah Schneider 和 Thomas Bluth。2025 年 6 月 GS 交易交割后的董事会变化，可能尚未完全体现在公开列表中。

              Trackunit 的所有权历史经历了三个清晰的私募股权阶段。Goldman Sachs 和 GRO Capital 于 2015 年收购公司，支持国际扩张并加速转向 SaaS。2021 年 3 月，Hg
              Capital 从 Goldman Sachs 和 GRO Capital 手中收购多数股权；Hg 持有期间，Trackunit 推出 IrisX，扩张到 3 million+ 已连接资产，并搭建 OEM
              生态。2025 年 2 月，Goldman Sachs Alternatives（Goldman Sachs 的 Private Equity）签署协议，从 Hg 和 GRO Capital
              手中重新收购多数股权，Hg 作为少数股东再投资。交易在 2025 年 6 月完成，之前获得欧盟监管放行，理由是竞争担忧很小。Goldman Sachs Alternatives 自 1986 年以来投资超过
              $75 billion；Hg Capital 管理约 $85 billion 基金。Hg 的 Nick Jordan 和 Søren Holt 将 Trackunit 称为「数据丰富的软件企业如何借助
              AI，把结构性数据优势变现的典型样本」。

              2015 年以来三次 PE 交接带来治理连续性风险和过渡成本。2025 年交易动用了异常庞大的顾问阵容——卖方包括 Evercore、Skadden、Gorrissen Federspiel、CMS 和
              Deloitte；Goldman Sachs Alternatives 一方包括 Goldman Sachs International、Morgan Stanley、White & Case、A&O
              Shearman、Sullivan & Cromwell 和 Deloitte——符合复杂杠杆结构的特征。交易条款（价格、杠杆倍数、交割后治理）尚未公开披露。
