      - number: '3.4'
        title: 相邻替代方案与现状替代品
        blocks:
          - type: paragraph
            body: >-
              除直接平台竞争者和 OEM 系统外，Trackunit 还面对解决同一任务部分环节的相邻方案。Hilti ON!Track 在 Hilti 硬件生态内，用 BLE smart tags 和 GPS
              geo-tags 做小工具和设备资产管理，并与 Trimble Viewpoint 和 Vista
              深度集成以支持工地成本核算。其范围是工具和附件，而非重型设备远程信息处理，因此是相邻而非直接竞争者；但它会从愿意在单一专有生态中标准化资产管理的承包商那里拿走钱包份额。2025 年 2 月，Trimble
              将全球运输远程信息处理业务剥离给 Platform Science，并成为后者股东和董事会成员；此后 Trimble 保留建筑专用资产追踪（Trimble Asset Tracking）、机器控制和
              Trimble Construction One 生态。WorldMetrics 在 2026 年把 Trimble Asset Tracking 列为建筑设备追踪平台第 2 名，仅次于
              Geotab，说明其在建筑承包商细分中仍有竞争相关性。现状替代品——人工库存、纸质日志、Excel 表格——仍是大量小型承包商的默认选择。Trackunit 自身数据称，平均工作日有 10%
              浪费在寻找工具和设备上，量化了 Trackunit 必须转化的现状成本。对拥有专门技术团队的大型租赁公司和
              OEM，内部自建也是现实替代方案，尤其是追求完整数据主权时。不过，专有平台的开发成本、time-to-market 和维护负担都是显著阻力。Geotab 的 350+ 方案 marketplace 生态和
              Trackunit 的 60+ 数据源市场都受益于网络效应；随着生态成熟，内部自建会越来越不具吸引力。
            claimRefs:
              - CP011
