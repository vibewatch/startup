      - number: '6.4'
        title: 留存与扩张证据
        blocks:
          - type: paragraph
            body: >
              Trackunit 未公开披露净收入留存（NRR）、总收入留存（GRR）或合同流失指标。公司为私营企业，也没有带客户 cohort 数据的投资者文件可用。因此，留存和扩张证据只能从定性信号和产品层指标拼出。

              最强的留存证据来自具名客户关系的多年深度。Skyjack 自 2017 年起就是 OEM 伙伴（截至 2026 年已有 8+ 年）。Gammon Construction 描述了长期合作关系。Sunbelt
              Rentals 2025 年扩张——新增非传统资产类别，并在 IrisX 上构建新的客户门户——是实践中的扩张：客户扩大范围，而不是在同一层级续约。Hilti 从试点（2021）深化到拥有 500,000+
              标签的生产方案（2023 年新闻稿，2025 年文章确认），展现出清晰的多年落地扩张轨迹。

              OEM 内嵌客户的结构性黏性较高。一旦某一机器类型在工厂配置 Trackunit 硬件，且 OEM 向经销商网络部署贴牌 IrisX
              门户，替换就需要重新谈判硬件供应、重新培训经销商员工，并重建定制分析——切换成本很高。Bosch Rexroth 多年期 BODAS Connect 合作和 Danfoss PLUS+1 Partner
              Program 认证，进一步提高 OEM 组件层面的嵌入式切换成本。

              平台设计也支持扩张。Trackunit 的 Blueprints（超合同使用检测、维护分诊、工地优化）和 Portals
              功能，旨在现有客户账户内创造新的用户触点，从而支持追加销售。租赁页面称，部署后可通过改善客户利用率带来“复购提升 8%”，但方法和时间窗口未披露。

              Trackunit Marketplace 的 168+ 应用形成交叉销售和伙伴锁定。客户一旦在 Trackunit Manager 之外使用多个 marketplace
              应用，迁移到竞争对手就要重建这些集成。Featured Customers 上来自 1,224 个评分的 4.8/5
              汇总分，说明规模化活跃用户满意度整体正面，但这是供应商策展平台，存在选择偏差。Trustpilot（1.8/5，32 条评论）和 Capterra（包括一条关于硬件故障、电池耗尽和售后支持不可及的 1
              星详细投诉）上的反向评论信号，说明客户谱系 SMB 端存在明显满意度缺口。
