      - number: '7.4'
        title: 合作伙伴、OEM 与执行风险
        blocks:
          - type: paragraph
            body: >
              Trackunit 的混合车队价值主张靠三组结构性依赖撑着：OEM API 合作、云基础设施和人才。OEM 侧， 到 2026 年，约 64% 的新建筑机械将出厂预装 OEM
              嵌入式远程信息处理系统，Caterpillar（VisionLink）、 Komatsu（KOMTRAX）、John Deere 和 Volvo CE 正在领跑专有生态建设。Komatsu 与 NVIDIA
              合作， 用 AI 做地形分析和自动化作业，抬高了竞争标杆。Trackunit 通过 AEMP/ISO 15143-3 标准聚合 100+ 个 OEM API， 把自己定位为混合车队聚合器；但 OEM API
              访问条款是私有 B2B 合同，可能在没有公开通知的情况下被限制、 重新定价或废止。同时，平台依赖 AWS 和 Confluent Cloud（Kafka）做流式处理；接入 AWS ISV Accelerate
              计划 加深了供应商锁定，也推高了迁移成本。云端 IAM 和配置风险正越来越成为首要失效向量，而不是底层基础设施宕机。 执行层面，CEO Soeren Brogaard 自 2020 年 12 月起掌舵公司，也是
              Trackunit 战略最主要的公开代言人； 如果他离任，公司会在关键的 PE 所有权转换期面临战略不确定性。CTO Mikkel Dalgas 和 COO Evan Barnes 是近期任命的高管，
              长期任职披露尚不能确认留任稳定性。100+ 条 OEM 集成线叠加活跃地域扩张，带来运营复杂度，也抬高了集成失败风险。
