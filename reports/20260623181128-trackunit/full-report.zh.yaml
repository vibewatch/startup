  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 关键依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 入场倍数偏高；业务质量强，但若没有进一步证据，不足以抵消价格风险
        - 不启动投资；监测 2025 年 ARR 确认和资本结构披露
      - - 信心
        - 中
        - 业务质量证据强；财务结构、2025 年 ARR 和退出路径证据有限
        - 若 ARR 重新加速至 15%+，且确认杠杆 <4x EBITDA，则上调至买入
      - - 风险评级
        - 高
        - 入场价 26.7x EBITDA；2024 年欧盟建筑设备市场下滑 19%；2025 年收入下滑；退出可见度有限
        - 熊市情景给出持平 / 负回报；情景分布向下偏斜
      - - 估值立场
        - 偏高
        - 在 10% 收入增长下 7.8x EV/Revenue，意味着 GRM 比率为 0.78，而 Samsara 为 0.33；每单位增长价格高出 2x
        - 价格没有提供安全边际；需要牛市情景兑现才有吸引力回报
      - - 牛市情景
        - EV $3.6–4.1B（2030E，持有 5 年）
        - ARR CAGR 17–20%，IrisX 采用，利润率扩张至 35%
        - 可能达到 2.5–2.8x MoM，但需要近乎无瑕的执行
      - - 基准情景
        - EV $1.9–2.4B（2030E，持有 5 年）
        - ARR CAGR 10–12%，利润率稳定，建筑业逐步复苏
        - 1.3–1.7x MoM；可接受，但相对替代标的不够有吸引力
      - - 熊市情景
        - EV $1.1–1.4B（2030E，持有 5 年）
        - ARR CAGR 5–7%，宏观逆风、竞争、利润率压力
        - 杠杆入场可能毁损价值；股权层面持平
    notes: >-
      所有 EV 情景数字均为基于分析师输入的估算；Trackunit 不发布前瞻指引。美元换算按约 0.147 USD/DKK（由 Trackunit 2024 年年报隐含）。资本结构 /
      杠杆未披露；情景假设按等同股权回报分析。MoM = multiple of money。
    claimRefs:
      - CV006
      - CV007
      - CV034
      - CV038
      - CV039
      - CV040
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 维度
      - 论点
      - 反论点
      - 何种情况会改变判断
    rows:
      - - 市场与品类
        - 全球建筑远程信息处理渗透率仍很低；Trackunit 是品类领导者，拥有 3.5M 联网资产和全球最大的建筑蓝牙网络
        - 2024 年欧洲建筑设备销量下降 19%；复苏缓慢会威胁新增联网资产需求；宏观逆风直接压缩可触达车队扩张
        - 欧洲建筑产出年增长高于 2%，并持续 12–18 个月
      - - 平台与护城河
        - IrisX 运营数据平台、95% ARR 留存和 2B+ 日数据点带来显著网络效应和切换成本；五家早期企业 IrisX 采用者释放商业验证信号
        - 截至 2024 年末，IrisX 只有五家早期采用者；若 OEM 开发自有嵌入式方案，平台迁移可能推高流失；Samsara 进入建筑垂直领域带来竞争威胁
        - 24 个月内，IrisX 净新增 ARR 贡献达到总增量 ARR 的 15%+
      - - 财务质量
        - 尽管宏观下行，ARR 2024 年仍增长 17%；95% 收入为经常性；EBITDA 利润率约 29%；Rule of 40 约 39；符合一流垂直 SaaS 水平
        - 2025 年收入下降约 2% 至 DKK 1.26B；2025 年 ARR 数字尚未公开确认；2025 年 EBITDA 不可得；增长放缓可能是结构性而非暂时性
        - 2025 年 ARR 增长在审计账目中确认高于 15%；净收入留存披露高于 110%
      - - 估值与价格
        - >-
          两轮连续高溢价 PE 买方验证了 26.7x EBITDA（GS 2015–21、Hg 2021–25、GS 2025 年再次进入）；Evercore
          拍卖流程确认定价具有竞争性；EV/Revenue（7.8x）绝对值低于 Samsara（9.8x）
        - 按增长调整后的倍数比 Samsara 贵 2x；比建筑 SaaS 中位 PE 交易（10–13x EBITDA）贵 2.5x；工业软件以 26.7x EBITDA 入场后为 LP 交出强回报的历史先例有限
        - EBITDA 增长跑赢入场假设，使倍数降至 20x EBITDA 以下；或 IPO / 贸易出售以更高倍数验证 EV 溢价
      - - 退出与回报
        - Goldman Sachs 全球网络可能加速企业扩张，并激发战略买方兴趣；Hg 共同投资提供稳定性；建筑数字化是多十年的长期趋势，支撑退出可选性
        - 建筑科技 IPO 窗口当前有限；最可行的战略买方（Trimble、Hexagon、Volvo）在 M&A 环境压缩时可能偏好更低价标的；若 PE-to-PE 按相同倍数转售，只能获得盈利增长回报
        - 3 年内出现具名战略买方接触；或 4 年内启动 IPO 申报准备
    notes: 论据来自公开来源和分析师推断。2025 年收入和 EBITDA 数字基于第三方数据聚合商 Atlantis Data Solutions，可能不同于审计账目。净收入留存和资本结构未公开披露——这是重大缺口。
