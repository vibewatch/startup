        - ~5.6x
        - 约 12x（调整后 EBIT，29% 利润率）
        - 有机同比 +3%（2025 年 Q4）
        - 全球工业 / 建筑软件平台，经常性收入强、利润率高
        - 规模大得多（24,500 名员工；€30.6B EV）；硬件和软件混合；建筑只是多个垂直领域之一；不是直接远程信息处理同行
      - - Powerfleet (AIOT)
        - 上市，车队 / 工业 IoT SaaS（MiX Telematics 合并后）
