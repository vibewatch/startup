  - id: TV003
    title: 牛市、基准与熊市情景分析
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市（25%）
        - >-
          ARR CAGR 17–20%（5 年）；IrisX 推动追加销售；欧盟建筑业 2026–28 年每年复苏 2%+；EBITDA 利润率扩张至 35%；按 2030E EBITDA 约 $145M、25–28x
          EBITDA 退出
        - 退出 EV $3.6–4.1B（USD）；股权 2.5–2.8x MoM（无杠杆口径）；IRR 约 20–25%
        - 需要欧盟建筑复苏早于 Bain 预测；IrisX 采用必须在 12 个月内超过 5 家早期采用者；Samsara 竞争不得侵蚀定价权
        - 概率低于基准：2025 年收入下滑且欧盟复苏缓慢，使上行情景依赖多个正向催化同时出现
      - - 基准（50%）
        - >-
          ARR CAGR 10–12%（5 年）；IrisX 采用稳定；欧盟建筑产出每年增长 1–2%；EBITDA 利润率稳定在 28–31%；按 2030E EBITDA 约 $95–105M、20–23x EBITDA
          退出
        - 退出 EV $1.9–2.4B（USD）；股权 1.3–1.7x MoM（无杠杆）；IRR 约 5–12%
        - 宏观复苏不及预期；IrisX ARR 贡献低于预期；公司增长后管理层厚度风险显现；杠杆成本压低股权回报
        - 最可能情景；与以往 PE 持有模式和有机增长轨迹一致；2025 年 ARR 确认将设定底部
      - - 熊市（25%）
        - >-
          ARR CAGR 5–7%（5 年）；欧盟建筑业到 2027 年仍低迷；IrisX 采用低于预测；竞争性价格压力；EBITDA 利润率压缩至 24–27%；按 2030E EBITDA 约 $70–75M、16–19x
          EBITDA 退出
        - 退出 EV $1.1–1.4B（USD）；股权 0.8–1.0x MoM（无杠杆口径）；若杠杆 >3x，则 IRR 为负
        - 触发因素：ARR 增长持续低于 10%；EBITDA 利润率低于 25%；德国 / 法国建筑进一步恶化；OEM 流失高于 5%
        - 考虑到 2025 年收入下降 2%、2024 年欧洲建筑设备市场下跌 19%，该情景并非小概率
    notes: >-
      所有 EV 和 IRR 数字均为基于推断输入的分析师估算；Trackunit 不发布指引，也不披露资本结构。杠杆假设未计入——如果 GS 交易部分由债务融资，实际股权回报会更低。美元换算按约 0.147 USD/DKK
      隐含汇率。概率信号是定性评估，不是精算概率。
    claimRefs:
