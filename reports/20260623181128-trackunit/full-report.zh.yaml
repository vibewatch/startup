      - number: '3.3'
        title: OEM 嵌入式远程信息处理系统
        blocks:
          - type: paragraph
            body: >-
              Trackunit 收入面临的最重要结构性竞争威胁，来自 OEM 嵌入式远程信息处理平台；它们正成为建筑设备联网的默认入口。到 2026 年，OEM 工厂安装远程信息处理系统预计将占全球建筑设备市场
              64%；总装机基础预计从 2024 年 7.8 million 台增长到 2029 年 13.4 million 台，CAGR 11.5%——说明基础连接能力正在 OEM 层快速商品化。Caterpillar 的
              VisionLink 平台最成熟：它通过单一门户管理全品牌车队，集成 Cat Inspect、Cat SOS、Cat SIS2.0 和 Parts.Cat.com，并从 2026 年 6 月 30 日起要求使用
              VisionLink 访问油液分析结果——进一步加深 Caterpillar 经销商生态。Product Link 硬件可改装到非 Cat 设备。Komatsu 于 3 月在 CONEXPO-CON/AGG
              2026 推出重要 Smart Construction 更新：Smart Construction Dashboard 使用无人机数据和机器 as-built 信息创建云端 3D 工地虚拟孪生；Smart
              Construction 3D Machine Guidance Flex 把 as-built 捕捉扩展到任何车辆，包括非 Komatsu 设备；Smart Construction Edge
              在工地本地处理无人机数据。Komatsu 把自身定位为具备混合车队能力的 OEM 平台，让 Trackunit 的 OEM 销售叙事更复杂。John Deere 的 Operations Center 和
              JDLink 平台提供实时监控、自动维护追踪、发动机小时数、燃油水平、diagnostic trouble codes，以及免费的 iOS / Android 移动 app；JDLink M
              调制解调器可把任何品牌机器连接到 Deere 生态。Volvo CE 的 ActiveCare Direct 服务在所有新购 CareTrack 设备机器上免费提供一年，由 Volvo 管理健康监控，筛选
              fault codes，并只把可行动警报交付给车队经理。这种 managed-service 模型创造了可信、低摩擦的入口，在便利性而非开放性上竞争。对 Trackunit 的反向含义是，OEM
              平台虽然核心仍封闭且单品牌，但正通过基于标准的 API（AEMP 2.0、ISO 15143-3）扩展到混合车队场景；OEM 经销商网络提供了 captive distribution
              channel，Trackunit 必须共同利用，而不是取代。
