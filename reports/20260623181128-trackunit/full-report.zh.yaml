  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >
              Trackunit 在 50 多个国家运营，并处理机器生成的遥测数据；这些数据常因位置追踪和行为画像牵涉个人数据，因此直接落入 GDPR 执法范围。European Data Protection Board
              将透明度和信息作为 2026 年优先事项，并启动协调执法行动，这对所有欧盟遥测提供商都是直接压力。与此同时，EU Data Act（Regulation 2023/2854）已于 2025 年 9 月 12
              日生效，施加数据可携性、非歧视性访问，以及 B2B 切换便利化义务。Trackunit 已发布 EU Data Act 承诺文件，并在 trust center 更新合规指引，同时运营 Data
              Processing Agreement（DPA）和 Standard Contractual Clauses（SCC）框架，用于跨境传输。但行业研究估计，2026 年仍有 75% 遥测提供商在实现完整 GDPR
              合规上面临挑战；GDPR 加 Data Act 的双重合规负担，显著提高运营和法律复杂度。Trackunit 针对其 IRIS SaaS 平台的 ISO 27001:2022 证书应在 2026 年 8 月 8
              日前续期；任何重新认证缺口都会给企业客户带来监管和合同敞口。EU Machinery Regulation（EU 2023/1230）预计到 2027 年施加新的联网设备安全要求，增加前瞻义务。截至 2026
              年中，没有公开资料确认 Trackunit 面临诉讼或执法行动。
