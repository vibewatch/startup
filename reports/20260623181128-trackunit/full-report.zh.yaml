  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Goldman Sachs 交易背景与估值基准
        blocks:
          - type: paragraph
            body: >-
              Goldman Sachs Alternatives（Private Equity）于 2025 年 2 月 10 日宣布收购 Trackunit 多数股权， 交易于 2025 年 6 月 16
              日完成。交易结构显示，Goldman Sachs 收购略高于 50% 的公司股权； 自 2021 年起持有 Trackunit 的 Hg Capital 与 Goldman Sachs
              一起继续作为少数股东再投资。 卖方由 Evercore 提供顾问服务，买方由 Goldman Sachs International 和 Morgan Stanley 代表；
              这种流程配置更像竞争性拍卖，而不是专有双边交易。


              交易价格由丹麦财经媒体 Børsen 报道，并由 M&A 情报平台 NKP/Mainsights 佐证，约为 DKK 10 billion （按当时 DKK/USD 汇率约 $1.45 billion
              USD）。以 Trackunit 报告的 2024 年 EBITDA DKK 374 million （约 $54 million USD）计算，隐含 EV/EBITDA 倍数为 26.7x——同一来源称，这与
              Hg 2021 年支付的倍数相同。 以 2024 年净收入 DKK 1.29 billion（$186.5 million）计算，EV/Revenue 倍数约 7.8x； 以 2024 年 ARR DKK
              812.6 million（$119.5 million）计算，隐含 EV/ARR 倍数约 12.1x。 在没有后续股权发行或债务再融资的情况下，这就是新投资者从 Goldman Sachs 和 Hg
              所有权结构中二级入场要面对的倍数。


              值得注意的是，这些倍数在连续两个私募股权持有周期中异常稳定：Hg 2021 年从 Goldman Sachs/Gro Capital 手中收购时约为 27x EBITDA， Goldman Sachs 2025
              年又从 Hg 手中以 26.7x EBITDA 重新收购。这个一致性说明，具备建筑科技经验的专业 PE 投资者 反复得出同一资产相对估值，增强了基准价格的可信度；但也说明，当前入场价已经充分反映可得市场信息。
              四年间，业务收入从 DKK 506 million（2021 年）增长到 DKK 1.29 billion（2024 年），约为 2.5x， 而倍数没有发生实质变化，意味着 EBITDA
              扩张大致跟上了收入增长，利润率得以维持，但没有出现足以在较低入场估值上压缩远期 EBITDA 倍数的阶跃式改善。


              对估算或推导财务输入的说明：DKK 10 billion EV 来自丹麦媒体报道和 M&A 情报服务， 不是公司或 Goldman Sachs 官方新闻稿；官方稿没有披露对价或估值。所有美元换算使用
              Trackunit 2024 年年度业绩发布中隐含的汇率 （DKK 812.6 million ARR = $119.5 million，隐含约 0.147 USD/DKK）。2025 全年收入 DKK 1.26
              billion （下降约 2%）来自第三方财务数据聚合商 Atlantis Data Solutions；在审计账目提交前，应将其视为估计值。
