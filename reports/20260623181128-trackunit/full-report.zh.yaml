      - - MiX Telematics（历史，合并前）
        - 上市（JSE/NYSE），车队 SaaS（2024 年 4 月并入 Powerfleet）
        - $215M 经常性 SaaS 收入（FY2024E 合并前）
        - 约 3–5x（合并时隐含）
        - 约 10–12x（估算）
        - 同比中个位数增长
        - 为纯车队远程信息处理 SaaS 估值提供历史底部参考
