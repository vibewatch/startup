          tone: positive
        - date: '2025-02-11'
          label: Goldman Sachs Alternatives 交易签署；Hg 再投资
          detail: 2015 年以来第三次 PE 转换；GS 以多数股东身份重新进入；信用分析师提示杠杆担忧。
          tone: warning
        - date: 2025-06
          label: Goldman Sachs 交易完成；欧盟批准
