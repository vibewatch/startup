  - id: FM003
    title: 买方 / 细分价值流——Trackunit 生态
    type: flow
    layout: wide
    summary: Trackunit 与四类核心买方画像之间的价值流和数据流，展示各细分如何产生平台需求，以及 Trackunit IrisX 如何把它们连接起来。
    data:
      nodes:
        - id: oem
          label: OEM（Caterpillar、Komatsu、Volvo CE、JCB 等 300+）
          description: 在出厂环节安装遥测硬件；购买平台订阅以汇聚机器健康数据；靠使用分析增加零部件 / 服务收入
        - id: rental
          label: 租赁运营商（United Rentals、Loxam、Cramo、ERA 成员）
          description: 管理多品牌车队；需要利用率、防盗、计费自动化；是 Trackunit 在欧洲的主要客户
        - id: contractor
          label: 总包 / 专业承包商
          description: 需要混合车队工地可视化；合规、减少怠速、排放报告；ASP 更小，流失风险更高
        - id: dealer
          label: 设备经销商 / 分销商
          description: 用机器数据拉动主动式零部件和服务销售；处在 OEM 渠道下游
        - id: trackunit
          label: Trackunit IrisX 平台
          description: 中立聚合器：标准化多 OEM 数据，提供云端分析、第三方应用开放市场和 AI 驱动洞察
        - id: marketplace
          label: Marketplace / 第三方应用（60+ 集成）
          description: ConTech ISV、ERP 连接器、安全平台、排放报告应用都构建在 Trackunit API 之上
      edges:
        - from: oem
          to: trackunit
          label: 机器数据 + 平台订阅费
