  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Trackunit 所在市场有三类结构性威胁。第一，Samsara（NYSE: IOT，FY26 ARR $1.9B）和 Geotab（估计收入 $700M+、45,000+
              客户）等大型通用远程信息处理平台，把建筑设备模块放在更宽的车队和车辆管理套件中。这些平台主要靠价格、部署灵活性和商用车辆集成竞争；规模会对 Trackunit 的基础 GPS
              追踪和利用率能力形成定价压力。第二，大型建筑 OEM——包括 Caterpillar、Komatsu、John Deere 和 Volvo CE——把专有远程信息处理硬件和云平台（VisionLink、Smart
              Construction Dashboard、JDLink Operations Center、CareTrack / ActiveCare Direct）直接嵌入新机器，常常提供免费初始订阅，并对
              Trackunit 等售后远程信息处理供应商形成捆绑威胁。第三，建筑原生挑战者（Tenna、Hapn、GPS Insight）和相邻资产管理工具（Hilti
              ON!Track）服务具体承包商或工具追踪场景。下方竞争定位图以建筑行业专精度和平台开放度为轴，定位主要玩家。现状替代方案——人工追踪、电子表格和内部自建——仍很常见，尤其在 SMB 承包商中。Trackunit
              作为专门打造、开放的混合车队平台，优势真实存在；但 OEM 捆绑和通用远程信息处理供应商的规模，都是可信的反向力量，必须通过网络效应、生态深度和持续的建筑专用差异化主动管理。
