      - number: '5.2'
        title: 技术架构与开发者平台
        blocks:
          - type: paragraph
            body: >
              IrisX 架构为数据湖仓，托管在欧洲的公有云和私有云提供商之上。平台持续摄取设备遥测、OEM 数据馈送和企业业务数据，将其标准化为结构化 schema，并通过分层 API
              面向外部输出结果。具体云服务商名称（AWS、Azure、GCP 或私有托管）没有公开披露；Trackunit 仅表示所有处理都在欧洲境内完成，且托管实体持有所需 DPA。

              面向开发者的界面包括 GraphQL API（开发者中心提供 explorer 和 visualizer 界面），以及一组版本化 REST API，覆盖资产、警报、工地、CAN
              故障、遥测设备配置、车队数据健康、排放、webhooks 和 ISO 15143-3 AEMP feeds。Iris App SDK 提供基于 React 的框架——2026 年初从 Rspack 迁移到
              Vite——用于构建在 Trackunit Manager 内运行、并通过 Marketplace 分发的自定义应用。截至 2026 年 6 月，开发者 changelog 显示近期新增项包括 Assets
              API v2、Bluetooth Tag Configuration API v1、Fleet Data Health API v1beta1、CAN Faults API v1 和 Compaction App
              API v1。

              现场硬件、Iris 服务、Manager、Go 和 IrisX 之间的所有通信都使用 HTTPS/REST 加密。Legacy TU700 硬件通过商业安全库，使用 NIST 推荐密码套件的 DTLS 1.2
              通信。Iris 平台以冗余配置部署，支持热补丁和动态扩容；DevOps 团队运行 24/7 值班机制，并对持续监控测试配置自动告警。Trackunit Network 依赖动力机器电池来运行 BLE
              网关节点，因此当工地停摆时，网络覆盖会随之收缩。

              Trackunit Marketplace 承载 176+ 应用和集成，并聚合 60+ OEM 遥测数据源，覆盖 ERP 连接器、租赁管理系统、可持续性报告工具、CRM 连接、BI 桥接，以及来自 Perkins
              等 OEM 发动机和动力总成品牌的诊断应用。
