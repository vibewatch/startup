              2026 年 6 月 IrisX MCP server 发布，使 Trackunit 成为较早把建筑设备数据通过开放 Model Context Protocol 连接到主流 AI
              助手的厂商。该路径避免专有锁定，允许客户沿用现有 AI 工具；相比只能嵌入内部的 AI 功能，采用门槛更低。
