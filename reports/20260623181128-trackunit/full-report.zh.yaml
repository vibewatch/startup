      - number: '2.3'
        title: 买方与细分格局
        blocks:
          - type: paragraph
            body: >-
              四类清晰的买方原型定义了这个市场；每类买方的预算所有者、采购触发点和 ROI 算法都不同。OEM（Caterpillar、Komatsu、Volvo CE、JCB、Liebherr 及约 300+
              其他厂商）是最具战略性的买方：它们在工厂端集成远程信息处理，把它作为产品差异化、零部件 / 服务收入驱动器和产品设计反馈回路。Trackunit 称，OEM 借助其平台部署多模态通信，可将数据盲区最多减少
              80%，并让数字服务 time-to-market 加快 40%。OEM 的预算所有者通常是 VP of Digital 或 Product，采购周期为 12–24 个月，合同为多年期平台合同。

              设备租赁公司（如 United Rentals、Sunbelt/Ashtead、Cramo、Loxam 及更小的独立公司）构成第二大细分。它们的核心 ROI
              来自车队利用率可见性、防盗追踪，以及基于计量小时的自动计费。ERA（European Rental Association）代表欧洲租赁运营商；欧洲租赁市场是 Trackunit 的重要地理锚点。租赁 CFO
              掌握 capex / opex 决策；合同期限通常为 3–5 年，按单元定价。

              总承包商和专业承包商（买方数量最大，但平均合同规模较小）使用远程信息处理来做工地合规、减少怠速时间和排放报告。预算所有权分散在车队经理与运营 /
              财务之间；采用更具事件性，也更价格敏感。经销商构成第四类：它们用车队数据触发主动零部件和服务收入，减少被动故障上门。四类买方都面对同一个混合车队难题——车队由多个 OEM
              的机器组成，需要一个品牌中立平台来一致地聚合数据。

              跨细分来看，AEMP（Association of Equipment Management Professionals）和 ISO 15143 数据交换标准通过定义通用远程信息处理数据
              schema，降低集成摩擦；但不同 OEM 品牌对开放标准的采用不均，持续制造互操作性缺口，需要中立平台补上。
