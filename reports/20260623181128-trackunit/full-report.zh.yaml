      - number: '3.5'
        title: 护城河评估与反向证据
        blocks:
          - type: paragraph
            body: >-
              Trackunit 最持久的竞争优势，是建筑专用数据网络效应、OEM 共用模式，以及混合车队归一化层的深度。2+ million 个已连接建筑资产持续生成 telemetry，让 Trackunit
              积累专有行为基准和故障码库；通用远程信息处理供应商要复制这些资产，成本高、耗时长。2024 年 8 月发布的 IrisX 平台，提供建筑行业专用 AI 和数据层，并具备 ISO 27001 信息安全认证、GDPR
              对齐和 Cyber Essentials Plus 认证，使 OEM 合作伙伴可在 Trackunit 数据基础设施之上搭建品牌化客户门户和 AI 驱动维护应用，而不必独立自建。Trackunit 把自己定位为
              OEM 赋能方而非 OEM 替代者，这是关键战略差异：Trackunit 引用的 McKinsey 研究显示，售后服务最多可占设备 OEM 年利润的 40%，因此 OEM
              有强动机与能把连接能力转化为售后收入的平台合作。反向证据同样重要。OEM 捆绑远程信息处理的迁移（工厂安装系统到 2026 年预计占 64% 市场份额）会在硬件层把基础 GPS
              追踪和健康监控商品化，挤压售后远程信息处理供应商。Trackunit 36–42 个月合同结构被明确提为相对 Hapn 和 Samsara
              等新型灵活平台的劣势；后者提供月付条款或透明的按资产定价。Trackunit 的定价不透明——所有计划均需询价——会在新一代车队经理偏好的自助评估 funnel 中制造摩擦。Trackunit API 生态依赖
              OEM 数据访问，埋下潜在生态风险：如果大型 OEM 收紧 API 访问或推出专有数据授权，Trackunit 的混合车队归一化价值主张会变弱。建筑远程信息处理也正在进入基础利用率和 GPS
              层功能同质化阶段：WorldMetrics 2026 年把 Trackunit 平台列为设备追踪软件第 9 名（共 10 名），落后于通用车队领导者——这说明主流评估集合尚未把 IrisX
              的高级能力视为充分差异化。下方护城河风险登记表和 KPI 摘要量化了这些风险及 Trackunit 的缓释路径。
