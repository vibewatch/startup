  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              Trackunit 面向建筑价值链中的四个相互咬合的客户分层：OEM、租赁公司、承包商，以及 marketplace/app 生态伙伴。OEM 是商业化模型的结构性锚点。Trackunit 拥有 100+ OEM
              数据集成，把连接能力嵌入 Skyjack（Linamar 旗下部门）、Epiroc、Jekko、Danfoss Power Solutions、Bosch Rexroth、Hilti、Dinolift、AUSA
              和 Leadway Heavy Machinery 等品牌的工厂标准设备。OEM 合作分两类：（1）Trackunit 硬件嵌入产线的工厂安装项目；（2）OEM 将 IrisX
              平台贴牌给经销商和终端客户网络的联名 OEM 门户。Works With Trackunit 项目则把新 OEM 硬件和组件厂商的兼容性与验证正式化。

              租赁公司是 Trackunit 单席位收入最高的分层。平台瞄准同时管理多个 OEM 品牌设备的混合车队运营商；在这一场景下，Trackunit 聚合 CAN-bus 和 ISO feed 的能力，相比单一 OEM
              专有系统有清晰差异化。Sunbelt Rentals UK & Ireland（Ashtead Group 子公司）是截至 2026 年公开具名的旗舰租赁客户，通过新的 IrisX Portals 部署连接
              20,000+ 资产，并启用面向客户的品牌化仪表盘。租赁客户用该平台做利用率报告、预防性维护排程、盗窃追回、超合同使用计费和碳排放追踪。

              承包商构成 Trackunit 的第三个分层，主要用平台做工地车队可视化、降低怠速时间、协调分包商资产和访问管理。Gammon Construction（7,000+
              员工，业务覆盖香港、新加坡和中国大陆）是公开资料最完整的承包商客户，其生产部署带来燃料消耗下降、设备利用率提升和 AI 驱动的安全监控。Trackunit 估计，建筑设备在工作日中有 30–40%
              时间处于怠速；承包商用例正是针对这一点。

              Marketplace 和开发者生态构成第四条渠道。截至 2026 年，Trackunit Marketplace 承载 60+ OEM 数据 feeds 和 168+ 第三方应用及集成。合作伙伴包括 Hilti
              ON!Track（资产管理集成）、Wynne Systems 的 RentalMan、Point of Rental、Clue（建筑设备管理）、Cummins Connected Diagnostics 和
              IPAF Link（操作员认证验证）。Blueprints programme（可复用分析工作流）旨在通过预构建运营模板缩短客户价值兑现时间，模板覆盖维护分诊、收入追回和可持续性报告。
