  - id: TI005
    title: 公开财务缺口
    columns:
      - 缺失指标
      - 重要性
      - 对判断的影响
      - 尽调路径
    rows:
      - - 净收入留存（NRR）和总收入留存（GRR）
        - 衡量经常性收入质量和流失的核心指标；仅看 ARR 增长无法区分新 logo、扩张和流失贡献
        - 阻断 — 没有 NRR 历史，就无法承保 ARR 耐久性或 LBO 债务覆盖
        - 要求按 cohort 年份和层级（OEM、租赁、承包商）提供年度 NRR/GRR 瀑布；3 年趋势
      - - 客户获取成本（CAC）和 CAC 回本周期
        - 衡量 S&M 效率和增长成本；在 LBO 下估算当前增长率对应 FCF 的关键
        - 重大 — 决定预计 21% 收入增长是否资本高效，还是需要与 EBITDA 增长不成比例的增量 S&M 投资
        - 要求按渠道、分部和地域拆分全口径 CAC；回本周期 vs. ACV；LTV/CAC 比率
      - - 按分部拆分硬件 vs. SaaS 毛利率
        - 综合 69% GM 混合了差异很大的经济性；SaaS 平台 GM 可能为 75–85%，硬件可能为 15–30%
        - 重大 — 决定真实 SaaS 平台盈利能力，以及硬件占比继续下降时的组合敏感性
        - 要求按收入线拆分 P&L（订阅收入、设备收入、专业服务）；COGS 拆分
      - - 按地域和客户分部拆分 ARR
        - 地域集中（美国约 50%）和客户集中（前 10 大 = 约 50% 收入）带来相关性风险，需要拆解
        - 重大 — 单一区域或单一分部冲击可能实质影响 ARR，但在综合数字中不可见
        - 按地区（北美、欧洲、APAC）、客户类型（OEM、租赁、承包商）和 ARR 区间要求 ARR
      - - 自由现金流 vs. EBITDA 调节表
        - 8× 杠杆下，现金利息（按 USD 500m 定期贷款约 7% 估计，约 USD 35–50m/年）是 FCF 的主要拖累；净 FCF 决定实际债务覆盖和投资能力
        - 资本充足性阻断项 — 偿债后，29–33% 的 EBITDA 利润率可能缩至个位数 FCF 利润率
        - 要求 FCF 调节表（capex、营运资本、现金利息、税）；确认现金 EBITDA 与契约 EBITDA 定义
      - - 杠杆契约结构和余量
        - LBO 交割时 8× 杠杆；任何持续增长减速都会触发契约压力；维护性测试与发生性测试的区别至关重要
        - 阻断 — 决定 2025–2026 年任何收入放缓（类似 2024 年从 18% 降至 10%）是否已经挤压余量
        - 要求信贷协议摘要；财务维护契约水平、季度余量测算，以及任何补救条款
    notes: 截至 2026 年 6 月运行日，所有缺口均确认未见于公开披露。严重性评级反映这样一个判断：在 8× LBO 杠杆下，没有自由现金流、NRR 和契约数据，就无法有意义地评估资本充足性。
