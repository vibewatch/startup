  - id: FV001
    title: 建议逻辑：从证据链到投资立场
    type: flow
    layout: wide
    summary: 从业务质量证据，经估值溢价和宏观风险，推导 Trackunit 跟踪建议的链条。
    data:
      nodes:
        - id: biz-quality
          label: 业务质量：95% ARR、2024 年 ARR 增长 17%、3.5M 资产、建筑网络护城河
        - id: platform-moat
          label: 平台护城河：IrisX 运营数据平台、最大的建筑 Bluetooth 网络
        - id: financial-quality
          label: 财务质量：EBITDA 利润率约 29%、Rule of 40 约 39、经常性收入模型
        - id: entry-multiple
          label: 进入倍数：26.7x EBITDA、7.8x EV/Revenue — 相比增长调整后同业偏高
        - id: macro-risk
          label: 宏观风险：欧盟建筑设备 2024 年 -19%；2025 年收入 -2%；预测复苏缓慢
        - id: missing-evidence
          label: 证据缺口：2025 年 ARR 未确认；资本结构未披露；退出路径不清
        - id: recommendation
          label: 建议：跟踪 / 继续研究 — 未确认 ARR 且未披露杠杆前，不要启动投资
      edges:
        - from: biz-quality
          to: platform-moat
          label: 支撑
        - from: platform-moat
          to: financial-quality
          label: 驱动
        - from: financial-quality
          to: entry-multiple
          label: 定价为
        - from: entry-multiple
          to: recommendation
          label: 核心担忧
        - from: macro-risk
          to: recommendation
          label: 放大下行
        - from: missing-evidence
          to: recommendation
          label: 阻碍上调
    approximationNotes: 建议逻辑是分析性综合；节点代表证据簇，而非单项声明。
    claimRefs:
      - CV032
      - CV034
      - CV036
      - CV041
  - id: FV002
    title: EV/Revenue 倍数对比：Trackunit 与上市 Telematics 和建筑 SaaS 同业（2026 年 6 月）
    type: bar
    layout: standard
    summary: Trackunit 约 7.8x 的隐含 EV/Revenue 低于 Samsara，但远高于 Powerfleet 和 Trimble；按增长调整后，它是同业集中最贵的标的。
    data:
      items:
        - label: Samsara IOT（收入增长 30%）
          value: 9.8
        - label: Trackunit（进入倍数，收入增长 10%）
          value: 7.8
        - label: Hexagon AB（有机增长 3%）
          value: 5.6
        - label: 建筑 SaaS PE 中位数（10-13x EBITDA 区间）
          value: 4.5
        - label: Trimble TRMB（有机增长 6%）
          value: 3.3
        - label: Powerfleet AIOT（收入增长 26%）
          value: 1.7
    approximationNotes: >-
      Trackunit 倍数来自披露的 DKK 10B EV 和 DKK 1.29B 2024 年收入，按 0.147 USD/DKK 换算。上市公司倍数截至 2026 年 6 月 23 日。建筑 SaaS PE 中位数是分析师基于
      AEC M&A 来源作出的估计。所有数字均为过去十二个月 EV/Revenue（或 EV/Sales）。
    claimRefs:
      - CV017
      - CV019
      - CV021
      - CV022
      - CV037
  - id: FV003
    title: 估值 / 回报区间：牛市、基准和熊市退出 EV 情景（持有 5 年至 2030E，百万美元）
    type: range
    layout: wide
    summary: 基准情景在接近进入 EV 处退出，仅带来温和的 1.3–1.7x MoM；熊市情景有价值毁损风险；牛市情景需要执行零失误。
    data:
      items:
        - label: 进入 EV（GS 交易，2025 年）
          low: 1400
          high: 1500
        - label: 熊市情景退出 EV（2030E）
          low: 650
          high: 950
        - label: 基准情景退出 EV（2030E）
          low: 1900
          high: 2400
        - label: 牛市情景退出 EV（2030E）
          low: 3600
          high: 4100
    approximationNotes: 所有退出 EV 估计均为分析师构造；Trackunit 不发布前瞻指引。资本结构 / 杠杆未披露——如果交易使用了杠杆，股权层面回报会不同于 EV 层面回报。USD 按 0.147 USD/DKK 换算。
    claimRefs:
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI 评分卡：八个维度的 IC-ready 评分（1–10 分）
    type: kpi
    layout: standard
    summary: Trackunit 在市场机会、竞争护城河和财务质量上得分较高，但估值和退出准备度偏弱；6.4/10 的综合分支撑跟踪，而非买入。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 竞争护城河
          value: 8
        - label: 平台 / 产品
          value: 7
        - label: 财务质量（ARR、利润率）
          value: 7
        - label: 收入增长率
          value: 6
        - label: 估值（进入倍数）
          value: 3
        - label: 退出准备度
          value: 4
        - label: 证据质量
          value: 6
        - label: 管理层与执行
          value: 7
        - label: 风险调整后回报
          value: 5
    approximationNotes: >-
      评分是分析师基于 1–10 分尺度的判断，不是精算结果。综合分为简单平均（6.4/10）。估值（3/10）反映 26.7x EV/EBITDA 和相对同业偏高的增长调整后倍数。退出准备度（4/10）反映公司未披露 IPO
      计划或战略买家接触。
    claimRefs:
      - CV032
      - CV034
      - CV039
      - CV042
