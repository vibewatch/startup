      - number: '6.2'
        title: 采用轨迹与车队规模
        blocks:
          - type: paragraph
            body: >
              Trackunit 的平台规模，是最容易被独立核验的采用信号。截至 2026 年 4 月，IrisX 平台在全球 off-highway 领域连接超过 650 万资产，累计处理超过 2 万亿数据点，并每日摄取超过
              30 亿新数据点。30,000+ 公司客户覆盖租赁车队、OEM 经销商网络、承包商，以及 65+ 国家中的车队经理。这些数字由公司披露，并被机构投资者（Hg Capital）引用；没有独立审计，但置信度中高。

              Goldman Sachs Alternatives 投资公告（2025 年 2 月宣布，2025 年夏季交割）称 Trackunit 是拥有约 400 名员工的“任务关键型提供商”，并拥有品类领先的 SaaS
              位置——这一表述与高留存和深度客户集成相符。FactMR 非公路车辆遥测市场报告（2026 年 4 月）在引用 Goldman Sachs/Hg 对 Trackunit 的投资时，同时提到“680 万活跃 OEM
              单元”，作为行业从后市场 GPS 转向工厂标准、AI 驱动 SaaS 的结构性证据，并把 Trackunit 称为这一转型中的领先平台。

              OEM 渠道增长是主要采用驱动。到 2026 年，工厂安装遥测预计将占全球 OHV 遥测市场 64%，较此前年份大幅提升。Bosch Rexroth 战略合作（多年期，2025 年宣布）和 Danfoss
              PLUS+1 Partner Program 集成，扩大了 Trackunit 成为默认连接方案的 OEM 机器类型。Trackunit 自有租赁页面称，部署后可通过改善客户利用率实现“复购提升 8%”。外部
              NRR 或车队增长 CAGR 数据未公开披露。

              IRE 2026（International Rental Exhibition，Maastricht）发布 MCP Server、IrisX Blueprints、Portals 和 Inspections，是
              Trackunit 面向租赁与 OEM 客户群的最新公开产品扩张信号。Sunbelt Rentals Portals 发布被明确称为已经上线，说明 Trackunit 2026
              年产品路线图已转化为真实生产部署，而不只是前瞻承诺。
