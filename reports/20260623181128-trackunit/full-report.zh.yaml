            title: OEM 工厂安装飞轮创造耐久获客渠道
            body: >
              Trackunit 拥有 100+ OEM 集成协议，合作覆盖 Skyjack、Epiroc、Jekko、Bosch Rexroth、Danfoss 和 Hilti。Trackunit OEM
              伙伴每交付一台新机器，就生成一个联网资产和潜在经常性订阅。这一工厂安装飞轮降低 OEM 渠道销售
              CAC，并形成大型装机基础；后续可在不增加获客成本的情况下推动追加销售（Blueprints、Portals、Inspections）。
