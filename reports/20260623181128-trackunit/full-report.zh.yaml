      - number: '7.3'
        title: 市场、财务与所有权风险
        blocks:
          - type: paragraph
            body: >
              Goldman Sachs Alternatives 于 2025 年初从 Hg 和 GRO Capital 手中收购 Trackunit 的多数股权， 报道估值约 €1.34 billion（DKK 10
              billion），按 2024 年财务数据（DKK 1.3 billion 收入、 DKK 374 million EBITDA）计算，隐含约 26.7x EV/EBITDA。私募股权交易做到这种倍数，
              通常会配上大量债务杠杆；具体收购债务安排尚未公开，投资者仅靠公开来源无法判断利息覆盖或契约风险。 Hg 保留重要少数股权，提供了一定赞助方延续性，但 Goldman Sachs 的退出周期通常为 3–5 年，
              埋下未来所有权转换风险。需求端看，2026 年建筑行业前景分化：数据中心和能源基础设施项目拉动设备需求， 更广泛的商业和住宅建筑则受到高利率和政策不确定性压制。FMI
              将这种环境概括为建筑业可能出现「没有全国衰退的衰退」： 行业可以收缩，而整体 GDP 不下滑。Trackunit 的 SaaS 订阅与已联网资产数量绑定；如果设备需求持续下滑，
              导致车队利用率下降、退役加快，或客户推迟购买新设备，ARR 就会被压缩。新机器销售下滑 20%， 或租赁公司——Trackunit
              最大客户群——缩减车队，都可能明显削弱联网资产基数，并触发超出整体经济幅度的增长放缓。
