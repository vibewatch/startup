  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >
              Trackunit 采用 SaaS 主导的双收入模型。订阅软件占 2024 年净收入略高于 95%；硬件 IoT 设备（Raw、Kin、Spot、Beam）占比低于
              5%，主要作为进入平台的入口，而非独立利润驱动器。订阅计划按客户路径分层：OEM plans 支持工厂预装连接，Rental plans 优化利用率和开票工作流，Contractor plans
              面向多工地运营可见性。Enterprise tier 服务大型车队部署。


              定价完全不透明——公司不公布标价。客户通过四步配置定制计划：（1）选择软件计划（Explore、Evolve 或 Expand），（2）配置覆盖自身机器和工具类别的 Asset
              Configuration，（3）选择服务包（online-only、live support 或 guaranteed-uptime
              SLA），（4）添加可选能力。单资产经济性随规模改善：已连接车队规模越大，单价阶梯式下降，形成自然扩张激励，并把客户锁进平台的数据飞轮。ISO feeds 在所有 tier 中都包含，支持 AEMP 2.0
              行业标准数据集成。不透明的定制报价模型妨碍外部竞争基准比较，但在碎片化工业垂直的 enterprise B2B SaaS 中很常见。


              OEM 路径创造了尤其持久的收入基础。OEM 合作伙伴在工厂预装 Trackunit 设备，播种已连接资产池，并从运营这些机器的租赁和承包商终端客户那里产生下游经常性收入。GRO Capital
              的投资组合叙事确认，这个 OEM 飞轮是 Hg 持有时期的核心增长机制；2016–2023 年间五次收购同时扩大了地理触达和 OEM 集成深度。美国扩张在 Hg 时期加速后，北美现在约占总收入 50%。
