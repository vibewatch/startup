      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 反向信号：2025 年收入下滑需要解释，才能支撑 Buy 论点
            body: >-
              基于第三方财务数据（Atlantis Data Solutions），Trackunit 2025 全年收入估计为 DKK 1.26 billion， 较 2024 年（DKK 1.29B）低约 2%。这是至少自
              2021 年以来首次收入收缩。它究竟反映硬件 / 设备收入组合变化—— 经常性 SaaS ARR 仍在增长——还是实际 ARR 放缓，是本次尽调最重要的缺失证据。2024 年年报确认， ARR 增长
              17%，而总收入仅增长 10%，说明非 ARR 部分（硬件、设备销售）已经构成拖累。 如果 2025 年 ARR 增长确认为 12–17%，收入下滑就是良性的。如果 ARR 增长也降至 10% 以下，
              投资案例将明显转弱，倍数也无法在证据基础上得到支撑。
            calloutType: risk
            claimRefs:
              - CV011
              - CV036
              - CV004
              - CV007
          - type: callout
            title: 两轮 PE 一致性：GS 与 Hg 已两次支付约 27x EBITDA——一个持久基准
            body: >-
              Goldman Sachs 和 Gro Capital 于 2021 年以估计 27x EBITDA 将 Trackunit 出售给 Hg。 随后 Hg 又在 2025 年以 26.7x EBITDA 出售给
              Goldman Sachs。两个最有经验的欧洲科技 PE 投资者， 在两个不同宏观环境中独立为同一资产给出几乎相同的倍数——中间隔着四年、一个 COVID 周期和一次建筑市场下行—— 这是一个强信号，说明 27x
              EBITDA 是 Trackunit 品类地位的公允价值。但它也意味着市场已经以这个价格有效定价该资产， 27x 以上的倍数重估需要增长阶跃式改善，或可比集合发生结构性变化（例如公开市场把建筑 SaaS
              重新评级为高溢价品类）。 没有这类催化剂，买方回报完全取决于 EBITDA 增长。
            calloutType: insight
            claimRefs:
              - CV010
              - CV006
              - CV043
              - CV044
