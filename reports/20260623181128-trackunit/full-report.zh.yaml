      - number: '1.2'
        title: 产品、平台与生态
        blocks:
          - type: paragraph
            body: >
              Trackunit 的产品组合横跨硬件、软件和开放平台层。Trackunit Manager 提供车队管理、利用率分析、维护排程、地理围栏、访问控制和合规报告。硬件产品包括 Kin（面向非动力资产和小工具的紧凑型
              Bluetooth 追踪标签）和 Go（面向重型机械、具备实时连接能力的蜂窝远程信息处理设备）。公司还提供 Specialty Equipment solutions、Trackunit Pass
              访问管理、Network Solutions，以及 2024 年推出的新一代 Raw 远程信息处理硬件。Trackunit Developer Hub 文档化的开放 REST 和 GraphQL
              developer API 支持自定义集成，并把数据抽取到外部 ERP、CRM 和租赁管理系统。

              Trackunit 当前定位的战略核心是 IrisX，这是 2024 年 8 月 29 日推出的运营数据平台。IrisX 被定位为 Industry Cloud Platform（ICP）——这是 Gartner
              定义的类别，Gartner 预计到 2027 年超过 70% 的企业会使用 ICP。IrisX 纳入生成式 AI 和大语言模型、用于工作流自动化的自动化工作室、开发者软件开发套件（SDKs）、复合 AI
              能力、firmware-over-the-air（FOTA）更新，以及第三方集成市场。该平台已获 ISO 27001 认证。CEO Søren Brogaard 称，IrisX
              解决建筑业数字化转型的三大核心障碍：前期投入高、技术人才稀缺、工具互操作性不足。到 2024 年底，已有五家「重要建筑业参与者」签约 IrisX，但身份尚未公开披露。

              生态策略通过 2021 年启动的「Works With Trackunit」合作伙伴计划落地。最突出的集成对象是 Hilti：超过 500,000 个 Hilti ON!Track Bluetooth 标签已接入
              Trackunit 全球 Bluetooth 网络；两家公司还在 2023 年 11 月联合推出货车库存和重型设备管理解决方案。行业出版物也提到 Liebherr、Manitowoc 和 Skyjack 等
              OEM 通过 AEMP 2.0（ISO 15143-3）远程信息处理标准与 Trackunit 集成。在 CONEXPO-CON/AGG 2026，Trackunit 展示了面向预测性维护、智能服务和库存预测的
              IrisX 蓝图，以及 Kin T200 追踪标签和复合 AI 能力。
