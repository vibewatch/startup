  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Trackunit OEM partner exclusivity
      missingEvidence: >-
        Specific OEM partner contracts with Trackunit, including any exclusivity or preferred-partner
        terms with major OEMs such as Volvo CE, JCB, or Epiroc, and any contractual data access
        guarantees for ISO/AEMP feeds.
      whyItMatters: >-
        If Trackunit's OEM integrations rely on revocable API access rather than contractual data
        rights, OEM bundling risk is significantly higher than the platform's current positioning implies.
      diligencePath: >-
        Request partner agreement summaries and data access terms from Trackunit; survey top-5 OEM
        partners on their platform roadmap relative to Trackunit co-dependency.
      relatedQuestionRefs:
        - QP004

    - type: private-evidence-only
      severity: material
      topic: Geotab construction revenue breakdown
      missingEvidence: >-
        Geotab's actual construction-segment revenue, customer count in construction, and NRR specific
        to off-highway customers. The ~8% customer base estimate is from a third-party aggregator with
        low editorial standards.
      whyItMatters: >-
        Overestimating or underestimating Geotab's construction penetration affects the severity
        assessment of its competitive threat in the contractor and rental segments.
      diligencePath: >-
        Cross-reference with Geotab annual report or partner channel disclosures; request construction
        vertical breakdown from Geotab investor relations.
      relatedQuestionRefs:
        - QP007

    - type: missing-source
      severity: minor
      topic: Trackunit exact connected asset count
      missingEvidence: >-
        Trackunit's precise connected asset count as of 2026. Sources cite figures ranging from 2 million
        (press release vintage) to 6 million (review site estimate). The company does not publish a
        current asset figure in accessible public documentation.
      whyItMatters: >-
        The asset count is a primary network-effect moat metric and should be verifiable from an
        official, current source to anchor the competitive comparison accurately.
      diligencePath: >-
        Request current connected asset count with breakdown by customer segment (OEM, rental,
        contractor) from Trackunit management or investor materials.
      relatedQuestionRefs:
        - QP008

    - type: missing-source
      severity: material
      topic: Trackunit ARR and customer count
      missingEvidence: >-
        Trackunit is a private company and does not publicly disclose ARR, revenue, or active
        customer count. No reliable third-party estimate is available.
      whyItMatters: >-
        Without ARR and customer benchmarks, competitive financial sizing and market share estimation
        for Trackunit cannot be substantiated. Relative to Samsara ($1.9B ARR) and Geotab ($700M+
        estimated revenue), the magnitude of Trackunit's scale gap or advantage is unknown.
      diligencePath: >-
        Request management accounts, board reporting, or investor updates from Trackunit; obtain NDA
        data room access with ARR, NRR, and customer count for comparable benchmarking.
      relatedQuestionRefs:
        - QP008

    - type: enumeration-incomplete
      severity: minor
      topic: competitor-profile-table
      missingEvidence: >-
        The competitor profile table covers the major identified platforms but does not include
        emerging entrants (Clue, Motive, Verizon Connect, CalAmp, FleetUp) nor regional players
        in Europe (Matrack, Masternaut) or Asia-Pacific OEM platforms.
      whyItMatters: >-
        Regional or emerging competitors may be winning deals in specific geographic markets or
