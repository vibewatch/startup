    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Construction-specific data network effect (2M+ assets)
        - Samsara and Geotab growing construction asset base; OEMs accumulate proprietary data sets
        - Medium
        - Verify Trackunit's YoY connected asset growth rate; benchmark asset count vs. peers
      - - Open IrisX operating data platform with ISO/AEMP feeds
        - OEMs can close or throttle API access; AEMP standards evolve; new OEM platforms may bypass
        - High
