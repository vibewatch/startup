callouts:
  - calloutType: risk
    title: OEM Bundling Is Commoditizing Basic Tracking
    body: >-
      With 64% of the construction equipment market projected to carry factory-installed OEM
      telematics by 2026 and OEM-equipped units forecast to reach 13.4 million by 2029, the
      basic GPS and utilization tracking layer that underpins Trackunit's entry product is
      becoming table stakes bundled with machine purchases. Volvo CE, Caterpillar, and John
      Deere all provide free first-year telematics with new equipment. This compresses Trackunit's
      addressable market at the commodity tier and requires the company to continuously migrate
      customers up the value stack to IrisX advanced analytics and automation.
    claimRefs:
      - CP038
      - CP039
      - CP020
      - CP014
      - CP022

  - calloutType: risk
    title: Contract Lock-In Is a Structural Competitive Disadvantage
    body: >-
      Trackunit's typical 36–42 month contract structure is explicitly cited as a disadvantage
      versus Hapn (month-to-month), Samsara (flexible annual), and Geotab (reseller-negotiated
      terms). As construction fleet managers in the next generation skew toward self-serve
      evaluation and short-term commitments, pricing opacity combined with forced multi-year
      lock-in creates a real barrier to winning new contractor accounts that Tenna and Hapn
      are actively exploiting with transparent, flexible pricing models.
    claimRefs:
      - CP041
      - CP043
      - CP044

  - calloutType: strength
    title: OEM Co-optation Model Creates Structural Moat
    body: >-
      Trackunit's most durable advantage is its positioning as an OEM enabler rather than OEM
      displacer. McKinsey data indicates aftermarket services represent up to 40% of equipment
      OEM profit, and Trackunit's IrisX platform lets OEMs turn machine connectivity into
      predictive service sales, performance-based contracts, and branded customer portals.
      OEMs integrating on Trackunit's unified platform report 40% faster time-to-market for
      digital services—creating economic incentives for OEMs to deepen rather than defect
      from Trackunit's ecosystem, even as those same OEMs build their own telematics platforms
      for native-machine data collection.
    claimRefs:
      - CP025
      - CP046
      - CP047

