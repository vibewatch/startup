  - id: scenario-analysis
    title: "Bull, Base, and Bear Scenario Analysis"
    body: >-
      The three scenario cases are driven by five key variables: (1) ARR CAGR over a 5-year hold from mid-2025,
      (2) EBITDA margin trajectory, (3) exit multiple, (4) leverage/capital structure assumptions (not yet
      confirmed), and (5) European construction macro recovery pace. All scenarios below are estimated constructs;
      Trackunit does not publish forward guidance, and the GS/Hg acquisition price and any associated leverage
      are not publicly disclosed. These scenarios assume a 5-year hold with exit in approximately 2030.


      In the bull scenario, Trackunit achieves 17–20% ARR CAGR over five years by accelerating IrisX platform
      adoption, expanding OEM integrations, penetrating North American contractor markets, and benefiting from
      a construction recovery to 2%+ annual growth in Europe from 2026. EBITDA margins expand from 29% to 35%
      as software mix increases, IrisX generates upsell, and operating leverage improves. At an exit multiple
      of 25–28x EBITDA on a 2030 EBITDA of approximately $145 million, the implied exit EV is $3.6–4.1 billion,
      representing a 2.5–2.8x multiple of entry EV—a strong outcome for the GS/Hg structure but requiring
      near-flawless execution.


      In the base scenario, Trackunit sustains 10–12% ARR CAGR through modest IrisX adoption, stable OEM
      relationships, and a slow construction recovery with European output growing 1–2% annually. EBITDA
      margins remain stable at 28–31%. At an exit multiple of 20–23x EBITDA on 2030 EBITDA of approximately
      $95–105 million, the implied exit EV is $1.9–2.4 billion, representing a 1.3–1.7x MoM for equity holders—
      acceptable but not exceptional for a 5-year hold given current entry multiples.


      In the bear scenario, Trackunit achieves only 5–7% ARR CAGR as the European construction market recovery
      stalls (Germany and France remain weak through 2027), competition intensifies from Samsara or OEM-embedded
      solutions, and IrisX adoption lags. EBITDA margins compress to 24–27% under platform investment costs.
      At an exit multiple of 16–19x EBITDA on 2030 EBITDA of approximately $70–75 million, the implied exit EV
      is $1.1–1.4 billion, near or below the entry EV of $1.45 billion—implying a value-destructive or flat
      outcome for new equity investors depending on leverage.


      The European macro backdrop adds asymmetric risk to the base and bear scenarios. The 19% construction
      equipment market decline in 2024 (CECE data) and Bain's caution that France, Germany, and Italy will
      see slow or delayed recovery through 2026–2028 creates a scenario distribution that is negatively skewed.
      The key swing factor is whether Trackunit's recurring revenue model can maintain 95%+ retention even as
      rental and contractor customers face equipment utilization pressure; the 2024 ARR growth of 17% despite
      the macro headwinds is encouraging but one data point.
