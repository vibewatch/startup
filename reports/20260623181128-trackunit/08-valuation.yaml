  - id: comparable-valuation-analysis
    title: "Public and Private Comparable Valuation Analysis"
    body: >-
      The most relevant public comparable is Samsara (NYSE: IOT), a fleet operations and IoT SaaS platform serving
      physical operations companies. As of June 23, 2026, Samsara has an enterprise value of $16.96 billion and
      trailing EV/Sales of 9.8x on FY2026 revenue of $1.62 billion (+30% YoY) and ARR of $1.89 billion (+30%
      YoY). Samsara trades at a premium to Trackunit's implied EV/Revenue of ~7.8x, which might appear to suggest
      Trackunit is attractively priced relative to the public market. However, the critical growth-adjusted
      comparison reverses this conclusion: Samsara's EV/Revenue divided by revenue growth rate (9.8 ÷ 30) yields
      a GRM ratio of 0.33, while Trackunit's equivalent ratio (7.8 ÷ 10) yields 0.78—making Trackunit more than
      twice as expensive per unit of growth even on the 10% revenue growth measure. On 17% ARR growth (arguably
      the more meaningful metric for a SaaS business), the GRM ratio is 0.46, still 40% more expensive than
      Samsara. Samsara's stock fell ~20% in the 52 weeks to June 2026, suggesting some public market multiple
      compression for IoT SaaS, which creates a headwind for any Trackunit re-rating.


      Trimble (Nasdaq: TRMB) provides a useful construction-software infrastructure benchmark. Trimble reported
      FY2025 revenue of $3.59 billion, ARR of $2.39 billion, and adjusted EBITDA of $1.046 billion (29.2% margin).
      At a market cap of approximately $11.8 billion and EV/Revenue of ~3.3x, Trimble trades at a large discount
      to Trackunit's implied multiple, but Trimble is growing more slowly (organic 6% in 2025) and is substantially
      larger with a more diversified end-market mix. Hexagon AB (HEXA B on Nasdaq Stockholm), the global leader
      in measurement and construction-geospatial software, trades at ~5.6x EV/Revenue on €5.4 billion of 2025
      revenue with a 36% EBITDA margin—closer to Trackunit's multiple but with far greater scale. Powerfleet
      (Nasdaq: AIOT), the fleet telematics company formed by the Powerfleet/MiX Telematics merger (closed April
      2024), trades at just 1.74x EV/Sales and 9.0x EV/EBITDA—illustrating how deep the market discount for
      lower-growth, lower-margin fleet telematics can be. Geotab, the largest private fleet telematics company
      with estimated 2024 revenue exceeding $680 million, does not disclose valuation; an implied range of
      $3–5 billion at peer multiples would imply 4–7x EV/Revenue, consistent with the lower-end of the comp range.


      Across the M&A landscape, the 2025 AEC M&A market shows EV/EBITDA transaction multiples of 10–13x for
      top-tier PE-backed construction software companies, well below Trackunit's 26.7x—indicating that the GS
      deal price reflects a SaaS-quality premium that general AEC comparables do not command. This premium is
      defensible given Trackunit's recurring revenue quality and platform position, but it leaves limited room
      for multiple expansion; returns will depend primarily on earnings growth rather than re-rating.
