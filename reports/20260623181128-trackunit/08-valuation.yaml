callouts:
  - calloutType: risk
    title: "Adverse Signal: 2025 Revenue Decline Requires Explanation Before Buy Thesis Can Be Supported"
    body: >-
      Trackunit's 2025 full-year revenue is estimated at DKK 1.26 billion, approximately 2% below 2024 (DKK 1.29B),
      based on third-party financial data (Atlantis Data Solutions). This is the first revenue contraction since
      at least 2021. Whether this reflects hardware/device revenue mix shift—with recurring SaaS ARR continuing
      to grow—or an actual ARR slowdown is the single most important piece of missing evidence for this diligence.
      The 2024 annual report confirmed ARR growing 17% even as total revenue grew only 10%, suggesting non-ARR
      components (hardware, device sales) were already a drag. If 2025 ARR growth is confirmed at 12–17%, the
      revenue decline would be benign. If ARR growth has also decelerated below 10%, the investment case weakens
      materially and the multiple cannot be justified on evidence-based grounds.
    claimRefs:
      - CV011
      - CV036
      - CV004
      - CV007

  - calloutType: insight
    title: "Two-Cycle PE Consistency: GS and Hg Have Now Both Paid ~27x EBITDA Twice — A Durable Benchmark"
    body: >-
      Goldman Sachs and Gro Capital sold Trackunit to Hg in 2021 at an estimated 27x EBITDA. Hg then sold to
      Goldman Sachs in 2025 at 26.7x EBITDA. The fact that two of the most experienced European technology PE
      investors independently priced the same asset at essentially the same multiple in two different macro
      environments—separated by four years, a COVID cycle, and a construction market downturn—is a strong
      signal that 27x EBITDA is a fair value for Trackunit's category position. However, it also implies that
      the market is efficient on this asset at this price, and that multiple re-rating above 27x would require a
      step-change improvement in growth or a structural change in the comparable set (e.g., public market re-rating
      of construction SaaS as a premium category). Without such a catalyst, buyer returns depend entirely on
      EBITDA growth.
    claimRefs:
      - CV010
      - CV006
      - CV043
      - CV044

