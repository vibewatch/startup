chapter:
  number: 8
  title: Valuation
  summary: >-
    Goldman Sachs Alternatives acquired a majority stake in Trackunit in June 2025 at an implied enterprise value of
    approximately DKK 10 billion (~$1.45 billion USD), representing 26.7x 2024 EBITDA and ~7.8x 2024 revenue—a
    premium that reflects category leadership and recurring-revenue quality but is stretched on a growth-adjusted
    basis versus public comps. Against public peers (Samsara at 9.8x EV/Sales on 30% growth; Trimble at 3.3x on 8%;
    Powerfleet at 1.7x on 26%), Trackunit's 7.8x multiple at 10% revenue growth (17% ARR growth) implies limited
    re-rating room and demands sustained platform execution to justify entry cost. The recommendation is Track/
    Research More pending confirmation of a 2025+ ARR reacceleration, full disclosure of capital structure, and
    clarity on exit pathway; the macro backdrop of a 19% European construction equipment market decline in 2024
    and a slow recovery in 2025 adds material scenario weight to the bear case.

sections:
  - id: valuation-context-and-benchmark
    title: "Goldman Sachs Transaction Context and Valuation Benchmark"
    body: >-
      Goldman Sachs Alternatives (Private Equity) announced the acquisition of a majority stake in Trackunit on
      February 10, 2025, with the transaction closing on June 16, 2025. The deal structure sees Goldman Sachs
      acquiring just over 50% of the company, with Hg Capital—which owned Trackunit since 2021—reinvesting as
      a continuing minority shareholder alongside Goldman Sachs. The transaction was advised by Evercore on the
      sell side, with Goldman Sachs International and Morgan Stanley acting for the buyers, a process configuration
      consistent with a competitive auction rather than a proprietary bilateral deal.


      The deal price was reported by Danish financial media (Børsen) and corroborated by M&A intelligence platform
      NKP/Mainsights at approximately DKK 10 billion (~$1.45 billion USD at prevailing DKK/USD rates). On
      Trackunit's reported 2024 EBITDA of DKK 374 million (~$54 million USD), this implies an EV/EBITDA multiple
      of 26.7x—the same multiple Hg paid in 2021, according to the same source. On 2024 net revenue of DKK 1.29
      billion ($186.5 million), the EV/Revenue multiple is approximately 7.8x; on 2024 ARR of DKK 812.6 million
      ($119.5 million), the implied EV/ARR multiple is approximately 12.1x. These are the entry multiples a new
      investor faces on a secondary basis from the Goldman Sachs and Hg ownership structure, absent any subsequent
      equity issuance or debt refinancing.


      Notably, these multiples have proven remarkably stable across two consecutive private equity ownership cycles:
      Hg acquired at ~27x EBITDA in 2021 from Goldman Sachs/Gro Capital, and Goldman Sachs re-acquired at 26.7x
      EBITDA in 2025 from Hg. This consistency indicates that specialist PE investors with construction-tech
      expertise have repeatedly concluded the same relative valuation for the asset, lending credibility to the
      benchmark price but also suggesting that the current entry price fully reflects available market information.
      The absence of material multiple change over a four-year period when the business grew revenue from DKK 506
      million (2021) to DKK 1.29 billion (2024)—roughly 2.5x revenue growth—implies that EBITDA expansion has
      roughly tracked revenue growth, maintaining margins but not achieving the step-change improvement that would
      compress the forward EBITDA multiple on a lower entry valuation.


      Where financial inputs are estimated or derived: the DKK 10 billion EV figure is sourced from Danish media
      reporting and M&A intelligence services, not from an official company or Goldman Sachs press release, which
      disclosed neither consideration nor valuation. All USD conversions use the rate implied by Trackunit's own
      2024 annual results release (DKK 812.6 million ARR = $119.5 million, implying ~0.147 USD/DKK). The 2025
      full-year revenue of DKK 1.26 billion (down ~2%) is sourced from a third-party financial data aggregator
      (Atlantis Data Solutions) and should be treated as estimated until audited accounts are filed.
