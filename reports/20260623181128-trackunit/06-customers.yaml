        - "Request revenue split: OEM-channel vs. direct rental/contractor; assess top-5 OEM partner revenue share"
      - - Platform Science / Trimble acquisition risk
        - "Platform Science acquired Trimble's telematics business (late 2024); consolidation at OEM platform layer could squeeze Trackunit from below via OEM-native alternatives"
        - High
        - Monitor OEM re-platforming announcements; assess contract exclusivity with top OEM partners
      - - Hilti partner dependency
        - "500,000+ Hilti ON!Track tags in Trackunit Bluetooth network; if Hilti migrates to a proprietary or competing network, material connected-asset decline"
        - Medium-High
        - Request contract terms and renewal milestones for Hilti Works With Trackunit agreement
      - - Skyjack OEM dependency
        - "8+ year production OEM partner; no exclusivity terms disclosed; Skyjack is part of Linamar (large diversified manufacturer)"
        - Medium
        - Verify current commercial terms; assess Linamar's broader telematics strategy
      - - OEM in-sourcing risk (general)
        - "Large OEMs (e.g., Caterpillar VisionLink, Volvo CareTrack, Komatsu KOMTRAX) operate proprietary platforms; as connectivity becomes standard, risk that mid-size OEMs develop in-house alternatives"
        - Medium
        - Assess exclusivity depth in Bosch Rexroth and Danfoss partnerships; track OEM R&D investment in telematics
      - - SMB post-sale support concentration risk
        - "Trustpilot 1.8/5, Capterra 1-star reviews citing hardware failure and inaccessible support; long-tail customer churn creates CAC drag and reputational risk"
        - Medium
        - Request support ticket resolution SLA by customer tier; assess churn rate in sub-50-asset customers
      - - Land-and-expand execution (marketplace)
        - "Blueprints programme and Portals feature designed to create new upsell triggers; effectiveness unproven publicly"
        - Low-Medium
        - Request average revenue per account growth over 12 and 24 months; NPS by segment
      - - Single-customer revenue concentration
        - "No customer confirmed to exceed 10% of revenue; 30,000+ companies implies diversification; however, OEM partner revenue concentration undisclosed"
        - Low (inferred)
        - Request top-10 customer revenue share; confirm no single OEM partnership exceeds 15% of ARR
    notes: >
      Severity ratings are inferred from available evidence and market context; no proprietary
      revenue concentration data has been disclosed. OEM-level channel concentration is the
      primary structural risk. Single-customer concentration appears low based on customer count,
      but OEM-channel concentration may mask revenue dependence on a small number of large
      OEM integration agreements.
