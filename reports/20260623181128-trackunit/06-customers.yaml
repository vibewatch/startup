  - id: retention-expansion
    title: Retention and Expansion Evidence
    body: >
      Trackunit does not publicly disclose net revenue retention (NRR), gross revenue retention
      (GRR), or contract churn metrics. The company is private and no investor filing with customer
      cohort data is available. Evidence for retention and expansion must therefore be assembled
      from qualitative signals and product-level indicators.

      The strongest retention evidence is the multi-year depth of named customer relationships.
      Skyjack has been an OEM partner since 2017 (8+ years as of 2026). Gammon Construction
      describes a longstanding partnership. Sunbelt Rentals' 2025 expansion—adding non-traditional
      asset classes and building a new customer portal on IrisX—is expansion-in-practice: a
      customer extending scope rather than recontracting at the same level. Hilti deepened its
      integration from pilot (2021) to a production solution with 500,000+ tags (2023 press
      release, confirmed 2025 editorial), a clear multi-year land-and-expand trajectory.

      Structural stickiness is high for OEM-embedded customers. Once a machine type is
      factory-configured with Trackunit hardware and an OEM deploys a white-labelled IrisX portal
      to its dealer network, replacement requires renegotiating hardware supply, re-training
      dealer staff, and rebuilding custom analytics—switching costs are substantial. The Bosch
      Rexroth multi-year BODAS Connect partnership and the Danfoss PLUS+1 Partner Program
      certification further increase embedded switching costs at the OEM component level.

      Platform design also supports expansion. Trackunit's Blueprints (out-of-contract usage
      detection, maintenance triage, site optimisation) and the Portals feature are designed to
      generate new user touch-points within existing customer accounts, supporting upsell. The
      rental page claims "8% increase in repeat business through improved customer utilisation"
      as a post-deployment outcome, though the methodology and time window are not disclosed.

      The Trackunit Marketplace's 168+ apps create cross-sell and partner lock-in. Once customers
      use multiple marketplace apps alongside Trackunit Manager, migration to a competitor
      requires rebuilding those integrations. The Featured Customers aggregate score of 4.8/5
      from 1,224 ratings signals broadly positive satisfaction among active users at scale,
      though this is a vendor-curated platform with selection bias. Adverse review signals on
      Trustpilot (1.8/5, 32 reviews) and Capterra (including a 1-star detailed complaint about
      hardware failure, battery drain, and inaccessible post-sales support) indicate a meaningful
      satisfaction gap at the SMB end of the customer spectrum.
