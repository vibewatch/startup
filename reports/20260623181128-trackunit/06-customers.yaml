  - id: adoption-trajectory
    title: Adoption Trajectory and Fleet Scale
    body: >
      Trackunit's platform scale is its most independently verifiable adoption signal. As of April
      2026, the IrisX platform connects more than 6.5 million assets globally across the off-highway
      sector and processes over 2 trillion cumulative data points, ingesting more than 3 billion new
      data points daily. The 30,000+ company customer count spans rental fleets, OEM dealer networks,
      contractors, and fleet managers in 65+ countries. These figures are company-stated and cited
      by institutional investors (Hg Capital), providing medium-to-high confidence without
      independent audit.

      The Goldman Sachs Alternatives investment announcement (February 2025, closed summer 2025)
      described Trackunit as a "mission critical provider" with approximately 400 employees and
      a category-leading SaaS position—language consistent with strong retention and deep
      customer integration. The FactMR off-highway vehicle telematics market report (April 2026)
      cited Goldman Sachs/Hg's investment in Trackunit alongside "6.8 million active OEM units"
      as evidence of the industry's structural shift from aftermarket GPS to factory-standard
      AI-driven SaaS, referencing Trackunit as a leading platform in this transition.

      OEM-channel growth is the primary adoption driver. Factory-installed telematics are projected
      to hold 64% of global OHV telematics market share by 2026, up sharply from prior years.
      The Bosch Rexroth strategic partnership (multi-year, announced 2025) and Danfoss PLUS+1
      Partner Program integration expand the number of OEM machine types where Trackunit becomes
      the connectivity default. Trackunit's own rental page claims an "8% increase in repeat
      business through improved customer utilisation" as a post-deployment outcome metric.
      No external NRR or fleet-growth CAGR figures are publicly disclosed.

      The IRE 2026 (International Rental Exhibition, Maastricht) launch of the MCP Server,
      IrisX Blueprints, Portals, and Inspections represents Trackunit's latest public product
      expansion signal for the rental and OEM customer base. The Sunbelt Rentals Portals launch
      is explicitly cited as already live, demonstrating that Trackunit's 2026 product roadmap
      translates to real production deployments rather than forward-looking promises.
