  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: NRR and GRR
      missingEvidence: >
        Trackunit's net revenue retention (NRR), gross revenue retention (GRR), and logo churn
        rate by customer segment are not publicly disclosed for any period.
      whyItMatters: >
        NRR is the primary metric for assessing whether Trackunit's subscription base is growing
        from existing customers (expansion) or declining (churn). Without it, retention quality
        cannot be independently assessed.
      diligencePath: >
        Request audited cohort data from Trackunit management; compare to construction-tech SaaS
        benchmarks. Ask for NRR by segment (OEM vs. rental vs. contractor) with at least 3 cohort
        vintages.
      relatedQuestionRefs:
        - QU007

    - type: private-evidence-only
      severity: material
      topic: revenue concentration
      missingEvidence: >
        No public data on revenue concentration by customer, OEM partnership, or channel; Trackunit
        has not filed public accounts with sufficient detail for concentration analysis.
      whyItMatters: >
        OEM-channel concentration is a structural risk; if a top-3 OEM partner generates >15% of
        ARR and migrates to an in-house or competing platform, the revenue impact could be material.
      diligencePath: >
        Request top-10 customer / top-5 OEM partner revenue share; request channel-level (OEM vs.
        direct) ARR split.
      relatedQuestionRefs:
        - QU017

    - type: missing-source
      severity: material
      topic: SMB support gap
      missingEvidence: >
        No Trackunit support SLA data, helpdesk resolution time, or tier-1 vs. tier-2 support
        model documentation is publicly available to assess whether the SMB adverse review pattern
        is systemic or isolated.
      whyItMatters: >
        Adverse reviews on Trustpilot and Capterra document real post-sale failures at the SMB
        tier. If these are systemic rather than isolated, SMB churn could be materially higher
        than enterprise-tier churn, creating CAC drag.
      diligencePath: >
        Request Trackunit support tickets, resolution SLAs by customer tier, and NPS scores
        segmented by customer size (assets under management).
      relatedQuestionRefs:
        - QU015
        - QU017

    - type: enumeration-incomplete
      severity: minor
      topic: Marketplace apps
      missingEvidence: >
        The full list of 168+ Marketplace apps and their active-user counts is not publicly
        enumerated; the figure is from third-party web intelligence and may be imprecise.
      whyItMatters: >
        Marketplace depth is cited as a stickiness driver; without verified app counts and usage,
        the strength of this moat cannot be confirmed.
      diligencePath: >
        Access the Trackunit Marketplace directly (login required) or request the official app
        count from Trackunit; verify active-user data if available.
      relatedQuestionRefs:
        - QU003
        - QU009
      relatedTableRefs:
        - TU001

    - type: stale
      severity: minor
      topic: Skyjack partnership current status
