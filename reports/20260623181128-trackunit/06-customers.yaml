callouts:
  - calloutType: strength
    title: OEM Factory-Install Flywheel Creates Durable Acquisition Channel
    body: >
      With 100+ OEM integration agreements and partnerships spanning Skyjack, Epiroc, Jekko,
      Bosch Rexroth, Danfoss, and Hilti, every new machine shipped by a Trackunit OEM partner
      generates a connected asset and a potential recurring subscription. This factory-install
      flywheel reduces sales CAC for the OEM channel and creates a large installed base from
      which upsell (Blueprints, Portals, Inspections) can be driven without additional acquisition
      cost.
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007

  - calloutType: risk
    title: OEM Channel Concentration and In-Sourcing Risk
    body: >
      As OEM-installed telematics becomes industry standard (64% market share projected by 2026),
      Trackunit's growth is structurally linked to OEM partnership health. Large OEMs
      (Caterpillar, Komatsu, Deere) already operate proprietary platforms, and consolidation
      (Platform Science / Trimble) demonstrates that OEM-side re-platforming is possible.
      If two or three top OEM partners were to migrate to in-house solutions, Trackunit could
      see significant connected-asset and ARR decline. Exclusivity terms are not publicly
      disclosed for any named OEM partnership.
    claimRefs:
      - CU043
      - CU044
      - CU045
      - CU046

  - calloutType: risk
    title: SMB Post-Sale Support Gap Creates Reputational and Churn Risk
    body: >
      Adverse reviews on Trustpilot (1.8/5, 32 reviews) and Capterra (including a 1-star account
      of hardware failure, battery drain, inaccessible cancellation, and debt collection threat)
      document execution failures in the SMB segment. The divergence from enterprise-tier
      satisfaction (4.8/5 on FeaturedCustomers) suggests a two-tier support model. Unresolved
      SMB churn generates negative word-of-mouth in Trackunit's core construction audience and
      may limit penetration in the long-tail installer and small fleet market.
    claimRefs:
      - CU048
      - CU049
      - CU050

  - calloutType: insight
    title: Portals Feature Deepens Data-Sharing Stickiness Across the Value Chain
    body: >
      The IrisX Portals capability—enabling rental companies to share branded fleet-data dashboards
      with their end customers without those customers needing a Trackunit account—creates
      a three-party data-stickiness loop: Trackunit retains the rental company; the rental company
      retains its contractor customers via the Portal experience; and contractors gain value from
      the Portal without needing to switch to a direct Trackunit subscription. Already live with
      Sunbelt Rentals UK & Ireland as of late 2025.
    claimRefs:
      - CU021
      - CU039
      - CU040

