        An 8-year-old OEM partnership without a public re-confirmation may have evolved or
        been supplemented by Skyjack's parent Linamar exploring alternative telematics providers.
      diligencePath: >
        Seek a current Skyjack or Linamar technology partnership statement; confirm Skyjack
        machines are still factory-configured with Trackunit hardware in 2025–2026.
      relatedQuestionRefs:
        - QU014

    - type: missing-source
      severity: minor
