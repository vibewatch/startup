  - id: named-customer-proof
    title: Named Customer Proof Table
    body: >
      Trackunit's case study library documents production deployments across all three primary
      segments. The depth and independence of evidence varies significantly by customer.

      Sunbelt Rentals UK & Ireland is the highest-confidence named customer. The partnership was
      publicly expanded in November 2025, increasing connected assets to 20,000+, adding
      non-traditional asset classes (battery storage, solar accommodation, tower lights, fuel tanks),
      and launching a branded customer portal built on IrisX Portals in November 2025. Matthew Ross,
      Director of Asset Connectivity at Sunbelt Rentals, confirmed the deployment publicly, citing
      predictive AI maintenance, carbon emissions visibility, and real-time fleet analytics as
      production-live outcomes. Trackunit's CMO confirmed Sunbelt is already live with Portals at
      IRE 2026 (April 2026). This is multi-year, production-grade, and corroborated by an
      independent trade publication (Project Plant).

      Gammon Construction is the best-documented contractor customer. Paul Evans, Executive Director
      and CTO of Gammon, gave a detailed account of the multi-year Trackunit deployment across
      Hong Kong, Singapore, and mainland China, citing measurable fuel consumption reductions,
      improved equipment utilisation, and a culture-change programme driven by Trackunit data.
      The case study is hosted on trackunit.com but the CTO's named statements and operational
      specifics provide strong reference quality; no independent corroboration is available.

      Hilti's integration through the Works With Trackunit program is corroborated by both a
      Hilti Group press release and a Trackunit editorial. Over 500,000 Hilti ON!Track tags have
      been integrated into the Trackunit Bluetooth network. Dan Wade, VP of Strategy at Hilti,
      stated "The Trackunit partnership allows us to expand well beyond our own offering." The van
      inventory and heavy equipment management solution is in production globally.

      Epiroc InSite™ (attachments division, powered by IrisX) is confirmed by Epiroc's own product
      page and Trackunit's editorial. Thomas Bejefalk, Head of Digital Solutions at Epiroc
      Attachments, stated "We started seeing strong traction in the market within weeks of
      introducing InSite™." This is a production OEM co-branded deployment with independent
      corroboration from Epiroc's commercial pages.

      Jekko (Italian spider/mini-crane manufacturer) launched J-LINK in November 2025, built on
      the Trackunit platform. The partnership is confirmed by both Jekko USA press release and
      the independent vertikal.net crane industry publication. All new Jekko crane models come
      factory-fitted; retrofit is available for existing fleets.

      Skyjack (Linamar Corporation) announced a partnership with Trackunit in 2017, launching
      in 2018. This is the oldest named OEM partnership and is confirmed by both Skyjack's own
      website and the independent Lift and Access publication. Skyjack cited Trackunit's off-highway
      specialization and mixed-fleet compatibility as selection criteria.

      Leadway Heavy Machinery (Thailand-based distributor) deployed Trackunit's SIM-based
      telematics for remote diagnostics and predictive maintenance, enabling efficiency in service
      trips and reduction in machine downtime. The deployment is documented on casestudies.com.
