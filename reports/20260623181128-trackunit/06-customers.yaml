tables:
  - id: TU001
    title: Customer Segmentation Table
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Use Cases
      - Scale Indicators
      - Revenue / Strategic Value
      - Evidence Gap
    rows:
      - - OEM (Factory-Integrated)
        - Equipment manufacturer buys / end customer uses
        - Remote diagnostics, warranty management, OEM-branded portal, predictive maintenance, parts sales
        - "100+ OEM integrations; brands incl. Skyjack, Epiroc, Jekko, Bosch Rexroth, Danfoss, Hilti, Dinolift, AUSA"
        - Highest ARR per account; embedded hardware + recurring SaaS; white-label IrisX portals
        - No revenue-per-OEM breakdown disclosed; exclusivity terms unknown
      - - Rental Company (Tier-1)
        - Rental company pays; end customer (contractor) uses
        - Mixed-fleet visibility, utilisation reporting, out-of-contract billing, carbon tracking, customer portal
        - "Sunbelt Rentals UK&I: 20,000+ assets; industry cites 8% repeat-business uplift"
        - Recurring subscription per asset; high asset volume offsets lower per-asset price
        - No NRR or contract-length data disclosed publicly
      - - Contractor (Mid-Large)
        - Contractor pays and uses
        - Jobsite fleet visibility, idle-time reduction, fuel tracking, access management, safety
        - "Gammon Construction: 7,000+ employees; 100,000+ jobsites cited globally on Trackunit platform"
        - Lower per-seat revenue vs. rental; expansion via multi-project rollout
        - Churn risk higher than OEM/rental; limited independent case study evidence
      - - Marketplace / App-Ecosystem Partner
        - ISV / technology partner builds on Trackunit SDK/API
        - Fleet ERP integration (RentalMan, Point of Rental), diagnostics (Cummins), certification (IPAF Link), tool tracking (Hilti ON!Track)
        - "168+ apps in Marketplace; 60+ OEM/ISO data feeds"
        - Indirect revenue via platform stickiness and API monetisation; partner lock-in
        - Revenue share terms and app-store economics not disclosed
      - - Dealer / Service Network
        - Equipment dealer pays or resells Trackunit to end customers
        - Machine health monitoring, warranty diagnostics, parts demand forecasting, customer retention
        - "Part of OEM-partner deployments (e.g. Leadway: Thailand distributor)"
        - Strategic channel for OEM aftermarket; recurring data/service revenue from dealer network
        - Dealer segment revenue is not broken out; dealer headcount and coverage undisclosed
    notes: >
      Segment boundaries are fluid: OEM partners embed Trackunit which then delivers the end
      product to rental and contractor customers. Scale indicators are company-stated or
      third-party estimated; no audited segment-level revenue split is publicly available.
