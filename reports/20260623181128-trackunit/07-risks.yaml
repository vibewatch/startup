chapter:
  number: 7
  title: Risks
  summary: >
    Trackunit faces a layered risk stack spanning GDPR and EU Data Act regulatory exposure,
    growing IoT-sector cyber threats, structural OEM competitive displacement, construction-cycle
    demand sensitivity, PE leverage at a ~26.7x EV/EBITDA entry multiple, cloud and partner
    concentration, and CEO-level leadership dependency. No confirmed breach, litigation, or
    enforcement action has been publicly documented as of mid-2026, but the converging regulatory
    and competitive pressures warrant close monitoring. Mitigations exist across most risk
    dimensions, but residual exposure is material in the regulatory, financial, and OEM-displacement
    categories.

sections:
  - id: regulatory-legal-privacy
    title: Regulatory, Legal, and Privacy Risks
    body: >
      Trackunit operates across more than 50 countries and processes machine-generated telematics
      data that frequently implicates personal data through location tracking and behavioral
      profiling, placing it squarely within GDPR enforcement scope. The European Data Protection
      Board launched a coordinated enforcement action on transparency and information as its 2026
      priority, a direct pressure on all EU telematics providers. Concurrently, the EU Data Act
      (Regulation 2023/2854) entered force on September 12, 2025, imposing data portability,
      non-discriminatory access, and B2B switching facilitation obligations. Trackunit has
      published an EU Data Act commitment document and updated its trust center with compliance
      guidance, and operates a Data Processing Agreement (DPA) and Standard Contractual Clauses
      (SCC) framework for cross-border transfers. However, industry research estimates that 75%
      of telematics providers still face challenges achieving full GDPR compliance in 2026, and
      the dual compliance burden (GDPR plus Data Act) materially increases operational and legal
      complexity. Trackunit's ISO 27001:2022 certificate for its IRIS SaaS platform was due for
      renewal by August 8, 2026; any gap in recertification creates both regulatory and contractual
      exposure with enterprise customers. The EU Machinery Regulation (EU 2023/1230), expected to
      impose new connected-equipment safety requirements by 2027, adds a forward-looking obligation.
      No confirmed litigation or enforcement actions against Trackunit have been publicly documented
      as of mid-2026.
