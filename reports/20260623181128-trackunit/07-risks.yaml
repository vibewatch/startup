callouts:
  - calloutType: risk
    title: "GDPR + EU Data Act: Dual Compliance Squeeze"
    body: >
      Trackunit simultaneously navigates GDPR enforcement (EDPB 2026 CEF transparency focus),
      the EU Data Act portability mandate (in force Sep 2025), and a certificate renewal
      deadline (ISO 27001, Aug 2026). This convergence creates peak compliance cost and
      reputational risk for a company scaling globally under private equity. An enforcement
      action against any EU telematics provider during 2026 would likely create sector-wide
      scrutiny. Investors should obtain Trackunit's most recent DPIA assessments and
      independent Data Act compliance attestation before committing capital.
    claimRefs:
      - CR010
      - CR011
      - CR013
      - CR034

  - calloutType: risk
    title: "OEM Embedded Telematics: A Narrowing But Not Closed Window"
    body: >
      By 2026, 64% of new construction machines come factory-installed with OEM telematics.
      Komatsu's NVIDIA partnership and Caterpillar's AI-powered predictive maintenance signal
      that OEM platforms are moving up the analytics stack. Trackunit's response — positioning
      as a mixed-fleet OS aggregating 100+ OEM data streams — is strategically coherent but
      depends on OEM API access remaining open. If two or three major OEMs simultaneously
      restrict third-party API access, the mixed-fleet value proposition would be critically
      impaired. This risk is structural, not temporary.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR021

  - calloutType: recommendation
    title: "Priority Diligence: Leverage, SOC 2, and OEM API Terms"
    body: >
      Three opaque items dominate the residual risk profile: (1) the Goldman Sachs acquisition
      debt schedule and covenant structure are not public — at 26.7x EV/EBITDA entry, covenant
      headroom in a construction downturn is material; (2) Trackunit's SOC 2 Type II attestation
      covers only identity sub-processors, not the full IRIS platform — enterprise customers
      in regulated industries will require a full platform report; (3) OEM API contract terms
      (access rights, deprecation notice periods, exclusivity) are private B2B agreements
      whose loss or restriction would structurally impair the core product. These three items
      are obtainable in a normal due diligence process and should be resolved before valuation
      decisions are finalized.
    claimRefs:
      - CR002
      - CR004
      - CR021
      - CR027
      - CR044
      - CR045

