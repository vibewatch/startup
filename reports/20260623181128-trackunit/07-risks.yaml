  - id: mitigation-kill-criteria
    title: Mitigation Framework and Kill Criteria
    body: >
      Trackunit has established baseline mitigations across most identified risk dimensions:
      ISO 27001 certification, a public trust center with incident disclosure, GDPR DPA/SCC
      compliance infrastructure, an EU Data Act commitment document, and the financial backing
      of Goldman Sachs Alternatives. However, mitigations are uneven: data privacy compliance
      maturity is credible but not independently audited at the SOC 2 Type II level for the full
      platform; OEM API dependency lacks contractual disclosure; and PE leverage terms remain
      opaque. Thesis-break triggers should be monitored actively: a confirmed platform breach,
      an EDPB enforcement investigation, closure of more than three major OEM APIs, or ARR growth
      turning negative would each represent material investment-thesis impairment events. Kill
      criteria center on leverage covenant breach, CEO departure without disclosed succession,
      or an EU data enforcement fine exceeding €10 million. Diligence priorities include obtaining
      the full debt schedule from the Goldman Sachs acquisition, a current SOC 2 Type II audit
      report for the complete IRIS platform, confirmation of the ISO 27001 recertification
      timeline, the OEM API contract terms, and the complete list of active subprocessors
      with their data-access scope. Quarterly monitoring of the Trackunit public status and
      trust center is recommended to detect emerging incidents before they crystallize into
      material events.
