  - id: market-financial-risks
    title: Market, Financial, and Ownership Risks
    body: >
      Goldman Sachs Alternatives acquired a majority stake in Trackunit from Hg and GRO Capital
      in early 2025 at a reported valuation of approximately €1.34 billion (DKK 10 billion),
      implying a ~26.7x EV/EBITDA multiple on 2024 financials (DKK 1.3 billion revenue,
      DKK 374 million EBITDA). Private equity deals at these multiples typically involve
      significant debt leverage; the exact acquisition debt schedule has not been publicly
      disclosed, leaving investors unable to assess interest coverage or covenant risk from
      public sources alone. Hg retains a significant minority stake, providing some sponsor
      continuity, but Goldman Sachs's exit horizon (typically 3-5 years) creates future
      ownership transition risk. On the demand side, the 2026 construction industry outlook
      is bifurcated: data-center and energy infrastructure projects are driving equipment demand,
      while broader commercial and residential construction faces headwinds from elevated interest
      rates and policy uncertainty. FMI characterizes the environment as potentially "a recession
      without a national recession" in construction, where sector contraction can occur without
      broader GDP decline. Since Trackunit's SaaS subscriptions are tied to connected asset
      counts, a sustained equipment demand decline that reduces fleet utilization, accelerates
      decommissioning, or causes customers to defer new equipment purchases would compress ARR.
      A 20% decline in new machine sales or fleet rightsizing by rental companies — Trackunit's
      largest customer segment — could meaningfully reduce the connected asset base and trigger
      a growth slowdown disproportionate to the general economy.
