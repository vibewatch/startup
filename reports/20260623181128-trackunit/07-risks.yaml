  - id: partner-oem-execution-risks
    title: Partner, OEM, and Execution Risks
    body: >
      Trackunit's mixed-fleet value proposition depends on three structural dependency clusters:
      OEM API partnerships, cloud infrastructure, and human capital. On the OEM side, approximately
      64% of new construction machinery will come factory-installed with OEM embedded telematics
      by 2026, with Caterpillar (VisionLink), Komatsu (KOMTRAX), John Deere, and Volvo CE leading
      proprietary ecosystem development. Komatsu's NVIDIA AI partnership for terrain analysis and
      autonomous operations represents an escalating competitive benchmark. Trackunit aggregates
      data from 100+ OEM APIs using AEMP/ISO 15143-3 standards, positioning itself as a mixed-fleet
      aggregator; however, OEM API access terms are private B2B contracts and can be restricted,
      repriced, or deprecated without public notice. Simultaneously, the platform runs on AWS
      and Confluent Cloud (Kafka) for streaming; AWS ISV Accelerate program integration deepens
      vendor lock-in and raises migration costs. Cloud-side IAM and configuration risks are
      increasingly the top failure vector, not underlying infrastructure outages. On execution,
      CEO Soeren Brogaard has led the company since December 2020 and is the primary public
      face of Trackunit's strategy; his departure would create strategic uncertainty at a critical
      PE ownership transition period. CTO Mikkel Dalgas and COO Evan Barnes were recently-named
      executives whose retention is unconfirmed by long-term employment disclosures. The combination
      of 100+ OEM integration threads and active geographic expansion creates operational complexity
      that elevates integration-failure risk.
