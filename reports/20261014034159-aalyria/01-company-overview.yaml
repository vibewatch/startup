company:
  name: "Aalyria"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Aalyria is a Google/Alphabet spinout selling Spacetime network-orchestration
    software and Tightbeam optical communications hardware. Independent reports
    document a $100 million Series B at a $1.3 billion valuation and about 90
    employees, while cumulative funding, revenue, customer count, board control,
    and detailed Alphabet ownership remain undisclosed in the retained evidence.
sections:
  - id: "identity-and-operating-profile"
    title: "Identity and operating profile"
    body: >-
      Aalyria presents itself as a communications-infrastructure company spanning
      software and hardware: Spacetime is a managed platform for orchestrating
      moving networks, while Tightbeam supplies free-space optical terminals.
      Independent coverage places the business in Livermore, California, with
      additional offices in Washington, D.C., Pittsburgh, and London. The origin
      record is not perfectly clean. CNBC and Via Satellite describe an Alphabet
      spinout in 2022, whereas Data Center Dynamics says the company was founded
      in 2021 after Google shuttered Loon. The difference may reflect incorporation
      versus public spinout timing, but the retained sources do not reconcile it.
      The snapshot therefore treats 2022 as the spinout year and flags the legal
      founding date for document diligence rather than forcing false precision.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The two visible founder-operators cover complementary functions. Founding
      CEO Chris Taylor brings national-security and government-sales experience,
      while founder and CTO Brian Barritt brings the technical lineage from
      Google, Cisco, and NASA. That pairing fits Aalyria's dual commercial and
      public-sector route to market, but it also concentrates product narrative,
      government access, and technical credibility in two executives. Public
      evidence reviewed for this chapter does not provide a complete board list,
      voting arrangements, succession depth, or material leadership-change
      history. Google retained an ownership stake as of the February 2026 round,
      but its percentage, rights, intellectual-property boundaries, and any
      commercialization constraints were not disclosed. Those omissions prevent
      a firm governance or key-person-risk conclusion.
    claimRefs: [CO005, CO006, CO010]
    tableRefs: [TO002]
  - id: "capital-and-stakeholders"
    title: "Capital position and stakeholder map"
    body: >-
      The current financing anchor is a $100 million Series B announced on
      February 23, 2026, at a reported $1.3 billion valuation. Battery Ventures
      and J2 Ventures led the round, with DYNE and other investors participating.
      This is a financing amount, not cumulative funding, cash on hand, runway,
      revenue, or ARR; none of those operating metrics is established by the
      retained evidence. CNBC reported about 90 employees and management's plan
      to grow headcount by at least one-third over the following year, but the
      chapter records only the approximately 90-person point-in-time figure.
      The valuation therefore signals investor conviction without resolving
      whether Aalyria has software-like recurring economics, hardware-heavy
      working-capital needs, or concentration around government programs and a
      small number of flagship deployments.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: "milestones-and-diligence-posture"
    title: "Milestones and diligence posture"
    body: >-
      Aalyria has accumulated credible external validation across the public and
      commercial sectors: a 2022 Defense Innovation Unit prototype award, a 2023
      long-term Telesat agreement, a January 2026 Air Force Research Laboratory
      selection, and a June 2026 NASA demonstration partnership. These milestones
      establish that sophisticated counterparties are evaluating or integrating
      Spacetime, but they do not disclose contract values, production utilization,
      gross margin, renewal terms, or customer concentration. The principal
      commercial risk is also visible in management's own framing: network
      operators may build orchestration internally, and earning their trust takes
      time. Accordingly, program wins should be treated as technical and market
      validation rather than evidence of scaled recurring revenue. The timeline
      separates dated events from unsupported operating conclusions and preserves
      the founding-date discrepancy.
    claimRefs: [CO002, CO003, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
