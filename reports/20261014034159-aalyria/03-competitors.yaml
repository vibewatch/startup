callouts:
  - calloutType: "insight"
    title: "The Decoupling of Network Control from Constellation Ownership"
    body: "Aalyria's strategic wedge hinges on separating software-defined network management from capital-intensive orbital constellation ownership. As mega-constellations like Starlink drive down raw bandwidth pricing, regional and sovereign operators increasingly require neutral orchestration platforms like Spacetime to federate capacity without surrendering customer relationships to vertically integrated incumbents."
    claimRefs:
      - "CP001"
      - "CP006"
      - "CP012"
  - calloutType: "risk"
    title: "Capital Intensity and Defense Budget Dependency"
    body: "Despite raising $100 million at a $1.3 billion valuation in 2026, Aalyria remains exposed to elongated government procurement cycles and the high manufacturing cost of atmospheric optical hardware. Slower-than-anticipated commercial adoption by satellite operators could leave the company overly dependent on contested U.S. defense appropriations."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP013"
