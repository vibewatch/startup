evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating metrics
    missingEvidence: >-
      Cumulative funding, cash balance, runway, revenue, ARR, growth, gross margin, customer count, backlog, and
      contract-value data.
    whyItMatters: >-
      The $1.3 billion valuation cannot be tested against scale, capital efficiency, revenue quality, or concentration
      without these denominators.
    diligencePath: >-
      Obtain the capitalization table, financing ledger, audited financials, revenue bridge, customer schedule, backlog
      detail, and cash forecast from management.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: company origin
    missingEvidence: Legal incorporation date and transaction documents that distinguish founding from the 2022 Alphabet spinout.
    whyItMatters: The one-year discrepancy affects the company chronology and the interpretation of operating history.
    diligencePath: Review the certificate of incorporation, board consents, asset-transfer agreement, and first financing documents.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, voting control, investor rights, Google ownership percentage, IP boundaries, and founder
      succession arrangements.
    whyItMatters: Undisclosed control and IP terms could constrain strategic options, economics, or continuity.
    diligencePath: >-
      Request the fully diluted cap table, charter, investor-rights agreements, board minutes, IP assignment and license
      documents, and succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder coverage
    missingEvidence: A complete list of executives, directors, investors, commercial customers, and active government contracts.
    whyItMatters: >-
      The public roster cannot establish governance coverage, customer concentration, or the full stakeholder dependency
      map.
    diligencePath: >-
      Reconcile management's organization chart, board register, cap table, customer ledger, and contract register
      against the public names.
    relatedQuestionRefs:
      - QO003
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse events
    missingEvidence: >-
      Authoritative legal, regulatory, outage, security-incident, and leadership-change records beyond the zero-result
      adverse search in the assigned pool.
    whyItMatters: A lack of returned results does not establish that no adverse event occurred.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, procurement, cyber-incident, and executive-background checks during
      confirmatory diligence.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: recurring-software-revenue-mix
    missingEvidence: >-
      Audited financial disclosure detailing Aalyria's software licensing revenue, ARR growth rate, gross margin
      profile, and hardware vs. software revenue split.
    whyItMatters: >-
      Aalyria's $1.3 billion valuation implies software-multiple economics, but commercial space hardware integration
      may dilute gross margins and lengthen revenue realization cycles.
    diligencePath: >-
      Review future Series B financial disclosures, prime contractor subcontract value allocations from Telesat
      Lightspeed, and public DoD contract award values.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: commercial-operator-pricing-and-switching-data
    missingEvidence: >-
      Granular commercial pricing models, per-node software licensing fees, and switching cost economics for satellite
      network operators deploying Spacetime versus in-house control software.
    whyItMatters: >-
      Without audited commercial contract data, evaluating whether Aalyria can command pure-play software multiples
      rather than services margins in competition with captive software teams remains an unresolved underwriting risk.
    diligencePath: >-
      Review customer contracts from upcoming commercial deployments (such as Telesat Lightspeed or regional satcom
      operators) and examine renewal terms, multi-homing support, and software license schedules.
