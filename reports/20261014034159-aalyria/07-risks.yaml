  title: "Risks"
  summary: "Comprehensive risk analysis evaluating federal defense accreditations, operational atmospheric failure modes, customer concentration in pre-operational LEO constellations, and defense procurement volatility facing Aalyria's orchestration platform."
sections:
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory Approvals, Defense Accreditations, and Export Controls"
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR008"
    tableRefs:
      - "TR001"
    body: |
      Aalyria operates at the intersection of commercial telecommunications and national security, making its growth path dependent on stringent defense accreditation and compliance frameworks. The company has achieved an accredited Continuous Authorization to Operate (cATO) under Department of Defense Impact Levels 4 and 5 (IL4 and IL5) by integrating Spacetime with Second Front Systems' Game Warden platform. This containerized architecture separates software release cadence from accreditation overhead, allowing enterprise instances to run across cloud, on-premises, and edge enclaves. However, accessing the most lucrative intelligence community and classified military missions requires achieving Impact Level 6 (IL6) and Top Secret Cloud authorizations, which remain in progress and carry verification risk. In addition, Aalyria's Tightbeam free-space optical communications terminals include precision beam-steering optical hardware subject to dual-use export control regimes under ITAR and EAR regulations. Ensuring clean architectural and corporate separation between the pure software control plane and export-controlled hardware is essential to avoiding international sales friction and regulatory enforcement actions.
  - id: "operational-and-technical-failure-modes"
    title: "Operational Execution, Atmospheric Link Degradation, and Dynamic Orchestration Resilience"
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR013"
    tableRefs:
      - "TR002"
    body: |
      The core technical value proposition of Spacetime is its ability to model dynamic platform trajectories and environmental conditions through a planetary-scale digital twin. Unlike static terrestrial routing protocols, Spacetime coordinates physical link geometry across moving platforms, predicting link availability and pre-calculating beam-steering tasking to reconstitute network topologies in under 100 milliseconds when assets fail. However, operationalizing this architecture across space-to-ground and inter-satellite domains introduces severe physical failure modes. High-frequency millimeter-wave (E-band) and free-space optical (FSO) links suffer substantial propagation attenuation from cloud cover, fog, precipitation, and thermal scintillation in the lower atmosphere. While Spacetime's temporospatial digital twin seeks to route around degraded apertures proactively, persistent regional weather events can overwhelm local ground-station diversity. Furthermore, while Spacetime exchanges only control-plane telemetry rather than user data plane traffic, any synchronization lag in edge-deployed orchestration daemons aboard constrained satellite compute nodes could induce packet loss or routing oscillations across dynamic multi-hop constellations.
  - id: "partner-counterparty-and-ecosystem-dependencies"
    title: "Customer Concentration, Anchor Constellation Viability, and Channel Dependencies"
    claimRefs:
      - "CR007"
      - "CR009"
      - "CR012"
    tableRefs:
      - "TR003"
    body: |
      Aalyria faces acute customer concentration risk during its commercialization ramp. The company's primary public commercial reference deployments center on flagship Low Earth Orbit (LEO) mega-constellation initiatives, notably Telesat Lightspeed and Rivada Space Networks. While these multi-year integration agreements validate Spacetime's capability to orchestrate complex non-geostationary mesh architectures, both partner constellations represent pre-operational, capital-intensive aerospace buildouts vulnerable to launch manifest slips, supply chain bottlenecks, and financing shortfalls. Delays in Telesat Lightspeed satellite manufacturing or deployment milestones directly push out high-margin recurring software licensing revenue for Aalyria. Simultaneously, traditional satellite fleet operators like SES are advancing open-architecture federations, such as the Open Orbits alliance for in-flight connectivity, seeking to pool multi-orbit capacity using standardized carrier interfaces. Aalyria must convince operators to adopt Spacetime's temporospatial control plane rather than relying on legacy SD-WAN overlays or competing consortium-driven routing frameworks.
  - id: "financial-capital-intensity-and-risk-synthesis"
    title: "Capital Intensity, Valuation Headroom, and Thesis-Break Kill Criteria"
    claimRefs:
      - "CR001"
      - "CR010"
      - "CR011"
      - "CR014"
    figureRefs:
      - "FR001"
    body: |
      Following its $100 million Series B financing in February 2026 led by Battery Ventures and J2 Ventures, Aalyria reached a post-money valuation of $1.3 billion. This unicorn valuation prices in aggressive enterprise software economics and control-plane ubiquity ahead of audited commercial revenue proof. While Aalyria maintains a software-first business model for Spacetime, ongoing development and fabrication of Tightbeam optical terminals introduce hardware engineering overhead and manufacturing capital intensity. Furthermore, on the defense front, congressional appropriations and Space Force budget reallocations demonstrate volatility, illustrated by budget cuts to proposed proliferated constellations like MILNET in favor of legacy GPS modernization. Aalyria's federal momentum under Defense Innovation Unit Other Transaction prototype contracts must successfully transition into long-term Programs of Record to sustain revenue growth. If commercial constellation anchor customers delay orbital launches by more than 18 months, or if federal prototype awards fail to convert into production contracts, Aalyria's valuation multiple faces severe compression risk.
