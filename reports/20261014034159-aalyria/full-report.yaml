              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Alphabet Heritage and Defense Validation Provide Moat
            body: >-
              Aalyria benefits from nearly a decade of Google R&D transferred directly into the spinout, including core
              Project Minkowski orchestration algorithms and physical Loon patents. Furthermore, early commercial and
              defense contract wins with the U.S. Defense Innovation Unit and NASA substantiate Spacetime's technical
              credibility across multi-orbit architectures.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: callout
            title: Atmospheric Optical Attenuation and Hardware Manufacturing Demands
            body: >-
              While Tightbeam promises fiber-like optical speeds without terrestrial civil engineering, free-space laser
              propagation remains highly vulnerable to heavy clouds, fog, and rain. Aalyria must prove that its coherent
              transceivers can achieve reliable commercial uptime without requiring expensive redundant RF
              infrastructure, while scaling complex optical aperture manufacturing.
            calloutType: risk
            claimRefs:
              - CE004
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Institutional Buying Centers
        blocks:
          - type: paragraph
            body: >-
              Aalyria targets two primary customer classes: commercial satellite constellation operators and defense or
              civil aerospace agencies. In the commercial domain, the lead customer archetype consists of low Earth
              orbit (LEO) and multi-orbit telecom operators, exemplified by Telesat Lightspeed, where Aalyria's
              Spacetime platform serves as the dynamic routing and resource allocation control plane. Additional
              commercial evaluation partners include aerospace and telecom primes such as Airbus, ALL.SPACE, and
              Keysight Technologies. On the public-sector side, government buyers include the U.S. Defense Innovation
              Unit (DIU), the U.S. Space Force Space Warfighting Analysis Center (SWAC), the Air Force Research
              Laboratory (AFRL), NASA's Space Communications and Navigation (SCaN) program, and the European Space
              Agency (ESA). Public-sector procurements prioritize high-assurance interoperability across hybrid
              multi-orbit architectures, whereas commercial constellation operators purchase dynamic link scheduling to
              maximize capacity utilization and avoid atmospheric or physical line-of-sight blockages [CU001, CU002,
              CU003, CU004, CU005, CU006, CU007].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
