      - number: '6.2'
        title: Named Customer Proof and Operational Trajectory
        blocks:
          - type: paragraph
            body: >-
              Aalyria's operational customer proof is anchored by public contract awards and architecture integration
              partnerships across civil, defense, and commercial domains. Under the DIU Hybrid Space Architecture (HSA)
              initiative, Aalyria received an Other Transaction (OT) prototype award alongside Anduril, Atlas, and
              Enveil to orchestrate multi-path communications across LEO, MEO, GEO, and terrestrial boundaries [CU002,
              CU007]. At NASA, Aalyria's Spacetime software was selected to demonstrate enterprise service management
              for multi-mission communications support, following on-orbit relay trials conducted via NASA's Polylingual
              Experimental Terminal (PExT) aboard York Space Systems' BARD satellite [CU003, CU008]. In commercial
              space, Telesat selected Spacetime to provide dynamic routing, spectrum-aware resource management, and
              predictive link optimization for its planned Telesat Lightspeed constellation [CU001, CU004]. Broader
              ecosystem evaluations span Airbus, ALL.SPACE, Keysight Technologies, Logos Space, and Google Public
              Sector, confirming multi-vendor interest in the Spacetime software orchestration layer [CU001, CU005,
              CU006].
            claimRefs:
              - CU001
