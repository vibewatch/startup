  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - Falsification Trigger
    rows:
      - - Network Architecture
        - Spacetime provides a vendor-neutral orchestration layer across LEO, MEO, GEO, and optical mesh.
        - Satellite fleet operators prioritize proprietary or vertically integrated network management suites.
        - Major operator partners choose alternative control planes or cancel live pilot agreements.
      - - Government Wedge
        - DIU HSA award and NASA partnership demonstrate mission-critical utility for multi-orbit coordination.
        - Government OT prototyping contracts fail to transition into recurring procurement line items.
        - Absence of multi-year production contract awards following demonstration program completions.
      - - Commercial TAM
        - Surging non-terrestrial network momentum (118 operator partnerships globally) expands the addressable market.
        - >-
          Mobile operators struggle with subscriber monetization, leaving NTN as a low-margin emergency messaging
          feature.
        - Direct-to-device adoption stalls at messaging without broadband data tier monetization.
      - - Valuation Realism
        - >-
          First-mover orchestration software captures high gross margin control-plane economics across multi-orbit
          fleets.
        - >-
          The $1.3B valuation creates down-round vulnerability if revenue reflects hardware or low-margin professional
          services.
        - Subsequent financing round or secondary trade occurs below the $1.3B post-money benchmark.
    notes: >-
