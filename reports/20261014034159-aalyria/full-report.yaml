      - number: '5.2'
        title: Network Workflows, Multi-Orbit Interoperability, and Operational Use Cases
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Aalyria shifts satellite operations from rigid, static transponder leasing to
              dynamic, multi-operator software-managed packet routing. Historically, government and commercial
              spacecraft have been architecturally tethered to single proprietary relay networks, producing operational
              bottlenecks and single-point-of-failure vulnerabilities. Under the U.S. Defense Innovation Unit's Hybrid
              Space Architecture program, Aalyria is demonstrating multi-path communications that integrate government
              and commercial space assets into a resilient mesh network. This operational capability was validated in
              NASA's Polylingual Experimental Terminal demonstration aboard York Space Systems' BARD spacecraft, where
              Spacetime provided enterprise service operations to coordinate communications across NASA's Tracking and
              Relay Satellite system, Viasat, and SES Space and Defense relays using standard Ka-band spectrum. By
              coordinating multi-mission communications services through a unified software framework, Spacetime enables
              satellite operators to federate capacity, improve service visibility, and dynamically route traffic across
              diverse orbital planes and ground stations.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
