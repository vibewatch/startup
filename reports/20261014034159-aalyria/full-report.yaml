  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Operating Model, and System Architecture
        blocks:
          - type: paragraph
            body: >-
              Aalyria delivers a dual-track communications architecture comprising the Spacetime software-defined
              network (SDN) orchestration platform and Tightbeam free-space optical communication hardware. Spacetime
              originated within Google under the internal codename Project Minkowski, where engineering teams spent
              nearly a decade developing autonomous routing algorithms to interconnect ground stations, aircraft,
              high-altitude balloons, and orbital spacecraft. The platform operates as a centralized and distributed
              control plane that dynamically schedules multi-orbit network topologies across Low Earth Orbit (LEO),
              Medium Earth Orbit (MEO), and Geostationary (GEO) assets. Rather than treating satellite constellations as
              isolated point-to-point pipes, Spacetime calculates predictive line-of-sight availability, orchestrates
              radio frequency and laser beam pointing, and mitigates data congestion across heterogeneous space and
              terrestrial teleports. Aalyria pairs this orchestration engine with Tightbeam, an atmospheric free-space
              optical transceiver designed to transmit high-throughput data beams through atmospheric turbulence without
              dedicated fiber trenching, creating an integrated control and physical layer for complex aerospace
              connectivity.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
