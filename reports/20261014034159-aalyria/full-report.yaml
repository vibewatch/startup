              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Sensitivity and Hold Posture
            body: >-
              While Aalyria demonstrates unique multi-orbit orchestration technology and Tier-1 government buy-in from
              DIU and NASA, the $1.3B Series B post-money valuation prices in perfection. Until management provides
              visibility into commercial telco ARR, contract renewal terms, and software gross margins, investors should
              maintain a research-more stance.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV014
          - type: callout
            title: Downside Exposure to NTN Monetization Delays
            body: >-
              Non-terrestrial network adoption faces real operator resistance around consumer monetization and device
              throughput constraints. Aalyria risks multiple compression to a $400M-$600M valuation if commercial
              deployments stall and revenue remains dominated by government prototyping awards.
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV013
