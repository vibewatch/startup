        title: Exhibits
        blocks:
          - type: callout
            title: Telesat Lightspeed Customer Concentration Exposes Revenue Timing
            body: >-
              Telesat Lightspeed represents Aalyria's single most prominent commercial reference account. Because
              Spacetime is integrated directly into the constellation's architecture, Aalyria's commercial software
              scaling is inextricably tied to Telesat's manufacturing, financing, and launch milestones. Any schedule
              slip in the Lightspeed deployment directly postpones recurring enterprise licensing revenue [CU001, CU004,
              CU011].
            calloutType: risk
