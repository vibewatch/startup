  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating profile
        blocks:
          - type: paragraph
            body: >-
              Aalyria presents itself as a communications-infrastructure company spanning software and hardware:
              Spacetime is a managed platform for orchestrating moving networks, while Tightbeam supplies free-space
              optical terminals. Independent coverage places the business in Livermore, California, with additional
              offices in Washington, D.C., Pittsburgh, and London. The origin record is not perfectly clean. CNBC and
              Via Satellite describe an Alphabet spinout in 2022, whereas Data Center Dynamics says the company was
              founded in 2021 after Google shuttered Loon. The difference may reflect incorporation versus public
              spinout timing, but the retained sources do not reconcile it. The snapshot therefore treats 2022 as the
              spinout year and flags the legal founding date for document diligence rather than forcing false precision.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
