              - CE009
              - CE010
              - CE013
      - number: '5.3'
        title: Technical Differentiation, IP Heritage, and Implementation Risks
        blocks:
          - type: paragraph
            body: >-
              Aalyria's primary technical differentiation stems from nearly a decade of proprietary intellectual
              property and patents transferred from Alphabet upon spinout, reinforced by prominent advisory leadership
              including internet pioneer Vint Cerf. The company's architectural moats include predictive orbital
              topology computation, coherent optical beam acquisition and tracking, and zero-trust security protocols.
              Under the Hybrid Space Architecture framework, Spacetime implements a variable-trust protocol that
              dynamically scores individual links and nodes based on observed behavior, enforcing continuous
              authentication across untrusted commercial and allied networks. However, Aalyria faces significant
              technical and operational risks. Free-space laser communication remains vulnerable to atmospheric
              absorption, cloud obscuration, and thermal beam wander, necessitating redundant RF backup. Furthermore,
              precision laser terminal manufacturing presents severe yield and scaling challenges across the 55.5
              billion dollar ground equipment ecosystem, and Aalyria's entirely closed-source enterprise software stack
              prevents third-party security audits or developer community adoption ahead of scaled multi-constellation
              deployments.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE003
