      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The two visible founder-operators cover complementary functions. Founding CEO Chris Taylor brings
              national-security and government-sales experience, while founder and CTO Brian Barritt brings the
              technical lineage from Google, Cisco, and NASA. That pairing fits Aalyria's dual commercial and
              public-sector route to market, but it also concentrates product narrative, government access, and
              technical credibility in two executives. Public evidence reviewed for this chapter does not provide a
              complete board list, voting arrangements, succession depth, or material leadership-change history. Google
              retained an ownership stake as of the February 2026 round, but its percentage, rights,
              intellectual-property boundaries, and any commercialization constraints were not disclosed. Those
              omissions prevent a firm governance or key-person-risk conclusion.
