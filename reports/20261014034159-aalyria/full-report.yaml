      - number: '6.3'
        title: Commercial Durability, Ecosystem Friction, and Customer Concentration
        blocks:
          - type: paragraph
            body: >-
              Despite high-profile design wins, Aalyria faces structural customer concentration and adoption risks.
              Commercial constellation deployment is heavily front-loaded into Telesat Lightspeed, exposing software
              licensing revenue to constellation launch timelines, satellite manufacturing schedules, and Telesat
              financing milestones [CU001, CU004, CU011]. Within defense and civil accounts, initial contracts represent
              prototype awards, small purchase orders, and demonstration agreements rather than recurring multi-year
              enterprise production programs of record [CU002, CU003, CU007]. Crucially, broader non-terrestrial network
              (NTN) market adoption faces monetization uncertainty: mobile network operators evaluate satellite roaming
              primarily as a churn-reduction feature or niche messaging service rather than a high-margin broadband
              add-on, complicating operator return on investment and delaying full-scale software deployments [CU009,
              CU010, CU012]. Contractual retention rates, net revenue retention (NRR), and gross retention rates (GRR)
              remain completely undisclosed private metrics, representing an unresolved diligence gap [CU011, CU012].
