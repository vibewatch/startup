  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Approvals, Defense Accreditations, and Export Controls
        blocks:
          - type: paragraph
            body: >
              Aalyria operates at the intersection of commercial telecommunications and national security, making its
              growth path dependent on stringent defense accreditation and compliance frameworks. The company has
              achieved an accredited Continuous Authorization to Operate (cATO) under Department of Defense Impact
              Levels 4 and 5 (IL4 and IL5) by integrating Spacetime with Second Front Systems' Game Warden platform.
              This containerized architecture separates software release cadence from accreditation overhead, allowing
              enterprise instances to run across cloud, on-premises, and edge enclaves. However, accessing the most
              lucrative intelligence community and classified military missions requires achieving Impact Level 6 (IL6)
              and Top Secret Cloud authorizations, which remain in progress and carry verification risk. In addition,
              Aalyria's Tightbeam free-space optical communications terminals include precision beam-steering optical
              hardware subject to dual-use export control regimes under ITAR and EAR regulations. Ensuring clean
              architectural and corporate separation between the pure software control plane and export-controlled
              hardware is essential to avoiding international sales friction and regulatory enforcement actions.
            claimRefs:
              - CR002
              - CR003
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR008
      - number: '7.2'
        title: Operational Execution, Atmospheric Link Degradation, and Dynamic Orchestration Resilience
        blocks:
          - type: paragraph
            body: >
              The core technical value proposition of Spacetime is its ability to model dynamic platform trajectories
              and environmental conditions through a planetary-scale digital twin. Unlike static terrestrial routing
              protocols, Spacetime coordinates physical link geometry across moving platforms, predicting link
              availability and pre-calculating beam-steering tasking to reconstitute network topologies in under 100
              milliseconds when assets fail. However, operationalizing this architecture across space-to-ground and
              inter-satellite domains introduces severe physical failure modes. High-frequency millimeter-wave (E-band)
              and free-space optical (FSO) links suffer substantial propagation attenuation from cloud cover, fog,
              precipitation, and thermal scintillation in the lower atmosphere. While Spacetime's temporospatial digital
              twin seeks to route around degraded apertures proactively, persistent regional weather events can
              overwhelm local ground-station diversity. Furthermore, while Spacetime exchanges only control-plane
              telemetry rather than user data plane traffic, any synchronization lag in edge-deployed orchestration
              daemons aboard constrained satellite compute nodes could induce packet loss or routing oscillations across
              dynamic multi-hop constellations.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: Customer Concentration, Anchor Constellation Viability, and Channel Dependencies
        blocks:
          - type: paragraph
            body: >
              Aalyria faces acute customer concentration risk during its commercialization ramp. The company's primary
              public commercial reference deployments center on flagship Low Earth Orbit (LEO) mega-constellation
              initiatives, notably Telesat Lightspeed and Rivada Space Networks. While these multi-year integration
              agreements validate Spacetime's capability to orchestrate complex non-geostationary mesh architectures,
              both partner constellations represent pre-operational, capital-intensive aerospace buildouts vulnerable to
              launch manifest slips, supply chain bottlenecks, and financing shortfalls. Delays in Telesat Lightspeed
              satellite manufacturing or deployment milestones directly push out high-margin recurring software
              licensing revenue for Aalyria. Simultaneously, traditional satellite fleet operators like SES are
              advancing open-architecture federations, such as the Open Orbits alliance for in-flight connectivity,
              seeking to pool multi-orbit capacity using standardized carrier interfaces. Aalyria must convince
              operators to adopt Spacetime's temporospatial control plane rather than relying on legacy SD-WAN overlays
              or competing consortium-driven routing frameworks.
            claimRefs:
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Capital Intensity, Valuation Headroom, and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Following its $100 million Series B financing in February 2026 led by Battery Ventures and J2 Ventures,
              Aalyria reached a post-money valuation of $1.3 billion. This unicorn valuation prices in aggressive
              enterprise software economics and control-plane ubiquity ahead of audited commercial revenue proof. While
              Aalyria maintains a software-first business model for Spacetime, ongoing development and fabrication of
              Tightbeam optical terminals introduce hardware engineering overhead and manufacturing capital intensity.
              Furthermore, on the defense front, congressional appropriations and Space Force budget reallocations
              demonstrate volatility, illustrated by budget cuts to proposed proliferated constellations like MILNET in
              favor of legacy GPS modernization. Aalyria's federal momentum under Defense Innovation Unit Other
              Transaction prototype contracts must successfully transition into long-term Programs of Record to sustain
              revenue growth. If commercial constellation anchor customers delay orbital launches by more than 18
              months, or if federal prototype awards fail to convert into production contracts, Aalyria's valuation
              multiple faces severe compression risk.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Anchor Constellation Viability and Delivery Timing
            body: >-
              Aalyria's near-term commercial revenue pipeline is heavily concentrated in early anchor commitments from
              Telesat Lightspeed and Rivada Space Networks, making cash-flow realization vulnerable to external
              constellation launch and financing slips.
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
          - type: callout
            title: Milestone-Driven Underwriting and Verification Asks
            body: >-
              Underwriting further capital commitments requires validating live commercial SLA uptime in orbit,
              confirming firm DoD procurement allocations beyond prototype OT agreements, and monitoring IL6
              accreditation milestones.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR008
              - CR010
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Aalyria presents a compelling technical thesis as an Alphabet spinout commercializing Spacetime, an
              intelligent orchestration platform designed to dynamically route traffic across heterogeneous satellite
              constellations, airborne assets, and terrestrial networks. Early traction is substantiated by defense and
              civil validation, including Other Transaction prototype contracts with the Defense Innovation Unit for the
              Hybrid Space Architecture program and an enterprise service demonstration with NASA's Wideband
              Demonstration mission. However, the core anti-thesis centers on commercial monetization friction. Major
              telecom and satellite operators are grappling with consumer willingness to pay, heavy integration
              expenditures, and bandwidth constraints that currently limit direct-to-device services to low-throughput
              messaging tiers. Furthermore, Aalyria has not publicly disclosed annual recurring revenue or gross margin
              splits between software licenses and capital-intensive Tightbeam optical hardware.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Financing History and Capitalization Context
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Aalyria secured $100 million in Series B financing, escalating its post-money valuation
              to $1.3 billion and establishing unicorn status in the space networking sector. The capital infusion is
              earmarked to scale Tightbeam optical terminals and advance the Spacetime software engine for government
              and commercial fleet operators. While venture backing signals strong institutional conviction in space
              orchestration infrastructure, the headline $1.3 billion valuation represents a rich entry multiple in the
              absence of verified customer renewal data. Without visibility into commercial ARR scale or capital
              expenditure burn associated with hardware manufacturing, the current private valuation leaves little
              margin of safety for growth-stage equity investors.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Public Comps and Multiple Realism
        blocks:
          - type: paragraph
            body: >-
              Evaluating Aalyria against publicly traded space communications providers underscores the valuation
              tension between pure-play infrastructure software and asset-heavy telecom operators. For context,
              established satellite network operator Iridium Communications commanded an equity market capitalization of
              $4.95 billion USD in October 2026 while supporting profitable worldwide voice, data, and direct-to-device
              standards. At $1.3 billion, Aalyria's private mark trades at more than 26% of Iridium's total public
              market cap despite Aalyria operating as an early-commercial venture without disclosed operating
              profitability. While Aalyria avoids orbital launch capital expenditure by focusing on software and
              terminals, telecom operators remain cautious regarding non-terrestrial network service economics, exposing
              Aalyria to multiple compression if commercial contract conversion lags expectations.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.4'
        title: Investment Recommendation and Diligence Road Map
        blocks:
          - type: paragraph
            body: >-
              We assign Aalyria an investment recommendation of research-more, accompanied by medium confidence, a high
              risk rating, and a stretched valuation stance. The company's unique technology pedigree and
              mission-critical government relationships make it an essential strategic asset in the emerging multi-orbit
              communications ecosystem. Nonetheless, fiduciary discipline dictates withholding capital allocation until
              prospective investors verify the composition of revenue, recurring software renewal rates, and hardware
              margin contributions. Key thesis-break triggers include the failure of government Other Transaction pilots
              to convert into multi-year recurring procurement programs, commercial satellite operators adopting
              proprietary in-house orchestration suites, or downstream financing rounds requiring down-round
              recapitalizations.
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
