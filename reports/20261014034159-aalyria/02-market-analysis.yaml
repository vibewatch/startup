callouts:
  - calloutType: insight
    title: The 'Digital Cartilage' Wedge in Fragmented Space Networks
    body: Aalyria avoids competing with capital-intensive satellite bus manufacturers by positioning Spacetime as a neutral orchestration layer. By solving the multi-orbit routing and atmospheric disruption problems for hybrid space architectures, Aalyria can capture recurring software margins across commercial constellations and defense networks without bearing orbital capital expenditure.
    claimRefs:
      - CM001
      - CM003
      - CM005
  - calloutType: risk
    title: Capital Intensity and Supply Chain Fragility in Optical Hardware
    body: While Spacetime benefits from asset-light software scalability, Aalyria's companion Tightbeam terminal exposes the business to manufacturing yields, precision optical component supply chains, and complex atmospheric qualification. Competitor distress in the laser terminal sector, exemplified by Mynaric's restructuring, highlights the risk of capital misallocation if hardware production drags down blended gross margins.
    claimRefs:
      - CM009
      - CM010
      - CM011
