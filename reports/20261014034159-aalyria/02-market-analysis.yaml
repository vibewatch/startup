        - Software orchestration, link planning, and dynamic traffic routing
        - Constellation prime contractors (Telesat, Rivada, MDA, York Space Systems)
        - Complementary adjacent layer requiring independent control plane integration
      - - Terrestrial & 5G NTN Connectivity
