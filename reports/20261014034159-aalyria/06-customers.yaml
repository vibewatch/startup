figures:
  - id: "FU001"
    title: "Customer Journey and Network Orchestration Adoption Map"
    type: "journey-map"
    summary: "Adoption trajectory of Aalyria's customer accounts progressing from initial prototype evaluation to enterprise-wide constellation orchestration."
    approximationNotes: "Stages model the enterprise software deployment lifecycle observed across defense prototype awards and commercial constellation integration partnerships."
    data:
      items:
        - label: "Stage 1: Architecture Evaluation & Simulation"
          stage: "Evaluation"
          detail: "Operator models constellation topology and RF/optical link physics using Spacetime digital twin simulations."
          touchpoints:
            - "Lab link-budget modeling"
            - "Network topology simulation"
            - "Interoperability feasibility study"
          actor: "Network Architecture Team"
          barrier: "Legacy reliance on static point-to-point routing and proprietary ground station schedulers."
        - label: "Stage 2: Prototype & Interoperability Demonstration"
          stage: "Prototyping"
          detail: "On-orbit flight experiments and multi-network routing tests funded via government OT awards or partner testbeds."
          touchpoints:
            - "DIU Hybrid Space Architecture trials"
            - "NASA PExT relay interoperability"
            - "Airborne terminal field tests"
          actor: "Program Manager / R&D Lead"
          barrier: "Government prototype contracts require extended review before transitioning to programs of record."
        - label: "Stage 3: Constellation System Design Integration"
          stage: "System Design"
          detail: "Spacetime control plane embedded into satellite system specifications and ground station interface standards."
          touchpoints:
            - "Telesat Lightspeed architecture embedding"
            - "Ground station API integration"
            - "O-RAN interface alignment"
          actor: "Chief Technology Officer"
          barrier: "Long design-in cycles tied to satellite build schedules and launch manifest delays."
        - label: "Stage 4: Operational Enterprise Orchestration"
          stage: "Production"
          detail: "Live autonomous dynamic routing, predictive beam pointing, and multi-orbit traffic steering across operating fleets."
          touchpoints:
            - "Real-time satellite constellation routing"
            - "Dynamic ground station handoffs"
            - "Service-level agreement optimization"
          actor: "Network Operations Center (NOC)"
          barrier: "Constellation operational delays and customer reluctance to outsource core routing autonomy."
        - label: "Stage 5: Multi-Tenant Expansion & Inter-Network Mesh"
          stage: "Expansion"
          detail: "Cross-operator resource sharing, roaming between commercial fleets, and government-commercial hybrid routing."
          touchpoints:
            - "Multi-orbit commercial roaming"
            - "Allied defense coalition networking"
            - "Tightbeam optical mesh backhaul"
          actor: "Enterprise VP of Infrastructure"
          barrier: "Spectrum rights coordination, data sovereignty concerns, and competitive operator friction."
        - label: "Stage 6: Ecosystem Platform Lock-In"
          stage: "Ecosystem Lock-In"
          detail: "Spacetime established as the standard SDN control plane across multi-vendor space, airborne, and terrestrial nodes."
          touchpoints:
            - "Standardized carrier billing APIs"
            - "Third-party developer module integrations"
            - "Ubiquitous space internet orchestration"
          actor: "Ecosystem Partners & Primes"
          barrier: "Alternative open standards or proprietary internal software stacks developed by prime contractors."
