callouts:
  - calloutType: "risk"
    title: "Telesat Lightspeed Customer Concentration Exposes Revenue Timing"
    body: "Telesat Lightspeed represents Aalyria's single most prominent commercial reference account. Because Spacetime is integrated directly into the constellation's architecture, Aalyria's commercial software scaling is inextricably tied to Telesat's manufacturing, financing, and launch milestones. Any schedule slip in the Lightspeed deployment directly postpones recurring enterprise licensing revenue [CU001, CU004, CU011]."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU011"
  - calloutType: "insight"
    title: "Defense Prototyping Provides Validation Ahead of Commercial NTN Monetization"
    body: "While commercial mobile network operators continue to debate return on investment and monetization models for satellite connectivity, defense and civil government customers (DIU, NASA, Space Force) provide essential non-dilutive validation and near-term revenue. These institutional partnerships validate Spacetime's dynamic routing algorithms in high-consequence operational environments while commercial constellation adoption matures [CU002, CU003, CU007, CU009, CU010]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU007"
      - "CU009"
      - "CU010"
