chapter:
  number: 6
  title: "Customers"
  summary: "Aalyria targets defense agencies and commercial satellite operators with its Spacetime orchestration software and Tightbeam optical communications terminals, securing marquee integrations with Telesat Lightspeed and the U.S. Defense Innovation Unit alongside NASA flight demonstrations. However, commercial non-terrestrial network customer monetization remains unproven at scale, customer concentration in early government and flagship commercial partners is pronounced, and commercial retention metrics are undisclosed."
sections:
  - id: "customer-segmentation-and-buying-centers"
    title: "Customer Segmentation and Institutional Buying Centers"
    body: "Aalyria targets two primary customer classes: commercial satellite constellation operators and defense or civil aerospace agencies. In the commercial domain, the lead customer archetype consists of low Earth orbit (LEO) and multi-orbit telecom operators, exemplified by Telesat Lightspeed, where Aalyria's Spacetime platform serves as the dynamic routing and resource allocation control plane. Additional commercial evaluation partners include aerospace and telecom primes such as Airbus, ALL.SPACE, and Keysight Technologies. On the public-sector side, government buyers include the U.S. Defense Innovation Unit (DIU), the U.S. Space Force Space Warfighting Analysis Center (SWAC), the Air Force Research Laboratory (AFRL), NASA's Space Communications and Navigation (SCaN) program, and the European Space Agency (ESA). Public-sector procurements prioritize high-assurance interoperability across hybrid multi-orbit architectures, whereas commercial constellation operators purchase dynamic link scheduling to maximize capacity utilization and avoid atmospheric or physical line-of-sight blockages [CU001, CU002, CU003, CU004, CU005, CU006, CU007]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "named-deployments-and-adoption-trajectory"
    title: "Named Customer Proof and Operational Trajectory"
    body: "Aalyria's operational customer proof is anchored by public contract awards and architecture integration partnerships across civil, defense, and commercial domains. Under the DIU Hybrid Space Architecture (HSA) initiative, Aalyria received an Other Transaction (OT) prototype award alongside Anduril, Atlas, and Enveil to orchestrate multi-path communications across LEO, MEO, GEO, and terrestrial boundaries [CU002, CU007]. At NASA, Aalyria's Spacetime software was selected to demonstrate enterprise service management for multi-mission communications support, following on-orbit relay trials conducted via NASA's Polylingual Experimental Terminal (PExT) aboard York Space Systems' BARD satellite [CU003, CU008]. In commercial space, Telesat selected Spacetime to provide dynamic routing, spectrum-aware resource management, and predictive link optimization for its planned Telesat Lightspeed constellation [CU001, CU004]. Broader ecosystem evaluations span Airbus, ALL.SPACE, Keysight Technologies, Logos Space, and Google Public Sector, confirming multi-vendor interest in the Spacetime software orchestration layer [CU001, CU005, CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Commercial Durability, Ecosystem Friction, and Customer Concentration"
    body: "Despite high-profile design wins, Aalyria faces structural customer concentration and adoption risks. Commercial constellation deployment is heavily front-loaded into Telesat Lightspeed, exposing software licensing revenue to constellation launch timelines, satellite manufacturing schedules, and Telesat financing milestones [CU001, CU004, CU011]. Within defense and civil accounts, initial contracts represent prototype awards, small purchase orders, and demonstration agreements rather than recurring multi-year enterprise production programs of record [CU002, CU003, CU007]. Crucially, broader non-terrestrial network (NTN) market adoption faces monetization uncertainty: mobile network operators evaluate satellite roaming primarily as a churn-reduction feature or niche messaging service rather than a high-margin broadband add-on, complicating operator return on investment and delaying full-scale software deployments [CU009, CU010, CU012]. Contractual retention rates, net revenue retention (NRR), and gross retention rates (GRR) remain completely undisclosed private metrics, representing an unresolved diligence gap [CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    figureRefs:
      - "FU001"
