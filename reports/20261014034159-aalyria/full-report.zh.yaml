        - Moderate (55%)
        - 联邦预算延迟或采购周期拉长，拖累政府软件采用。
      - - 悲观情景
        - 商业 MNO 变现停滞；收入仍局限于一次性的政府 OT 合同（$10M-$20M）。
        - 反映倍数压缩与资本重组需求的 $400M-$600M 估值。
        - Elevated (25%)
        - 没有新增股权或战略资本时，烧钱速度超过商业合同转化速度。
    notes: 情景模型采用卫星通信与基础设施软件可比公司的比较倍数。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV012
      - CV013
