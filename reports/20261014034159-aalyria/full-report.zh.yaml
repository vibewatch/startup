  - id: FI001
    title: 动态网络编排至毛利润流转
    type: flow
    summary: 展示如何将星座连接需求转化为软件与硬件两条毛利润流。
    data:
      nodes:
        - id: constellation-demand
          label: 星座与用户流量需求
          detail: 卫星运营商、国防机构与移动网络需要动态多域路由。
        - id: software-orchestration
          label: Spacetime 控制平面部署
          detail: Spacetime 软件编排连接空间、空中与地面资产的网格链路。
        - id: contract-monetization
          label: 合同与许可变现
          detail: 收入来自企业软件订阅、政府 OT 里程碑与硬件单元销售。
        - id: cogs-deduction
          label: 直接成本吸收（COGS）
          detail: 云算力基础设施、光学制造 BOM 与部署工程支持。
        - id: gross-margin-split
          label: 毛利润分流
          detail: 软件高毛利率（70%+）被资本密集型光学硬件毛利率部分抵消。
        - id: operating-reinvestment
          label: 运营现金再投资
          detail: 毛利润重新投入深度研发、光学制造与多年期国防 GTM 开支。
      edges:
        - from: constellation-demand
          to: software-orchestration
          label: 动态路由需求
        - from: software-orchestration
          to: contract-monetization
          label: 订阅与 OT 账单
        - from: contract-monetization
          to: cogs-deduction
          label: 直接交付成本
        - from: cogs-deduction
          to: gross-margin-split
          label: 毛利率产出
        - from: gross-margin-split
          to: operating-reinvestment
          label: 运营现金流
    approximationNotes: 该流程基于已披露的商业模式组成部分，以示意方式展示网络活动如何转化为运营现金再投资。
    claimRefs:
      - CI004
      - CI007
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖应用编排、SDN 控制平面、光学路由与多轨道物理基础设施的端到端架构栈。
    data:
      layers:
        - label: 企业应用与服务编排
          detail: 为民用空间与国防运营商提供任务规划、多租户 SLA 管理及企业通信配置。
        - label: Spacetime 软件定义网络（SDN）引擎
          detail: 实时预测性拓扑调度、多轨道路由计算，以及射频 / 光束指向优化。
        - label: 可变信任与动态安全协议
          detail: 持续的零信任节点身份认证、动态链路信任评分与抗量子加密密钥分发。
        - label: 多源数据融合与遥测接入
          detail: 统一遥测转换、通用数据接口，以及跨空间与地面资产的传感器接入。
        - label: Tightbeam 大气光通信
          detail: 具备大气湍流抑制、自适应光学与精确光束跟踪能力的自由空间激光通信收发器。
        - label: 多轨道物理与中继基础设施
          detail: 覆盖 LEO、MEO、GEO 轨道、空中平台与地面卫星通信枢纽的异构星座。
    approximationNotes: 分层抽象将 Aalyria 已发布的 Spacetime 与 Tightbeam 模块化架构映射至 DIU Hybrid Space Architecture 各领域。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE014
  - id: FU001
    title: 客户旅程与网络编排采用图
    type: journey-map
    summary: Aalyria 客户账户从初始原型评估走向全企业星座编排的采用轨迹。
    approximationNotes: 各阶段模拟从国防原型奖项与商业星座集成合作中观察到的企业软件部署生命周期。
    data:
      items:
        - label: 阶段 1：架构评估与仿真
          stage: Evaluation
          detail: 运营商使用 Spacetime 数字孪生仿真建模星座拓扑与射频 / 光学链路物理特性。
          touchpoints:
            - 实验室链路预算建模
            - 网络拓扑仿真
            - 互操作性可行性研究
          actor: 网络架构团队
          barrier: Legacy reliance on static point-to-point routing and proprietary ground station schedulers.
        - label: 阶段 2：原型与互操作性示范
          stage: Prototyping
          detail: 通过政府 OT 奖项或合作伙伴测试平台资助在轨飞行实验与多网络路由测试。
          touchpoints:
            - DIU Hybrid Space Architecture 试验
            - NASA PExT 中继互操作性
            - 机载终端现场测试
          actor: 项目经理 / 研发负责人
          barrier: Government prototype contracts require extended review before transitioning to programs of record.
        - label: 阶段 3：星座系统设计集成
          stage: System Design
          detail: 将 Spacetime 控制平面嵌入卫星系统规范与地面站接口标准。
          touchpoints:
            - Telesat Lightspeed 架构嵌入
            - 地面站 API 集成
            - O-RAN 接口对齐
          actor: 首席技术官
          barrier: Long design-in cycles tied to satellite build schedules and launch manifest delays.
        - label: 阶段 4：运营企业编排
          stage: Production
          detail: 在运行中的机队内实现实时自主动态路由、预测性光束指向与多轨道流量调度。
          touchpoints:
            - 实时卫星星座路由
            - 动态地面站切换
            - 服务级别协议优化
          actor: 网络运营中心（NOC）
          barrier: Constellation operational delays and customer reluctance to outsource core routing autonomy.
        - label: 阶段 5：多租户扩张与跨网络网格
          stage: Expansion
          detail: 跨运营商资源共享、商业机队间漫游，以及政府与商业混合路由。
          touchpoints:
            - 多轨道商业漫游
            - 盟友国防联盟组网
            - Tightbeam 光学网格回传
          actor: 企业基础设施副总裁
          barrier: Spectrum rights coordination, data sovereignty concerns, and competitive operator friction.
        - label: 阶段 6：生态平台锁定
          stage: Ecosystem Lock-In
          detail: Spacetime 成为跨多厂商空间、空中与地面节点的标准 SDN 控制平面。
          touchpoints:
            - 标准化运营商计费 API
            - 第三方开发者模块集成
            - 无处不在的空间互联网编排
          actor: 生态合作伙伴与主承包商
          barrier: Alternative open standards or proprietary internal software stacks developed by prime contractors.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU009
      - CU010
      - CU011
  - id: FR001
