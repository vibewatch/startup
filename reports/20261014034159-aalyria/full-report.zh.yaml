  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与核心反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Aalyria 作为 Alphabet 分拆公司，将 Spacetime
              商业化，提出了颇具说服力的技术投资逻辑：这是一个智能编排平台，可在异构卫星星座、空中资产和地面网络之间动态路由流量。国防与民用验证支撑了早期进展，包括与国防创新单位签订的 Hybrid Space
              Architecture 项目 Other Transaction 原型合同，以及 NASA Wideband Demonstration
              任务的企业服务演示。但核心反向逻辑在于商业变现阻力。大型电信和卫星运营商正面临消费者付费意愿不足、集成支出高昂和带宽受限等问题，目前将直连设备服务限制在低吞吐消息层级。此外，Aalyria
              尚未公开披露软件许可与资本密集型 Tightbeam 光学硬件之间的年经常性收入或毛利率拆分。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 融资历程与资本结构背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月，Aalyria 完成 $100 million 的 Series B 融资，投后估值升至 $1.3 billion，并在太空网络领域跻身独角兽。资金将用于扩大 Tightbeam
              光学终端规模，并推进面向政府及商业机队运营商的 Spacetime 软件引擎。风险资本支持说明机构高度认可太空编排基础设施，但在缺乏客户续约数据验证的情况下，headline $1.3 billion
              估值对应的入场倍数偏高。由于商业 ARR 规模和硬件制造相关资本支出烧钱情况均不透明，当前私募估值给成长期股权投资者留下的安全边际很小。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 公开可比公司与估值倍数合理性
        blocks:
          - type: paragraph
            body: >-
              将 Aalyria 与上市太空通信服务商对比，可以看出纯基础设施软件与重资产电信运营商之间的估值张力。作为参照，成熟卫星网络运营商 Iridium Communications 在 2026 年 10
              月的股票市值为 $4.95 billion USD，同时支撑全球盈利性语音、数据和直连设备标准。Aalyria 私募估值为 $1.3 billion，相当于 Iridium 总公开市值的 26% 以上；但
              Aalyria 仍处于早期商业化阶段，且未披露经营盈利能力。Aalyria 聚焦软件和终端，避开轨道发射资本支出，但电信运营商仍对非地面网络服务经济性持谨慎态度；若商业合同转化落后于预期，Aalyria
              将面临估值倍数压缩。
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.4'
        title: 投资建议与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              我们给予
              Aalyria“继续研究”的投资建议，置信度为中，风险评级为高，估值立场偏高。公司独特的技术积淀与关键政府关系，使其成为新兴多轨道通信生态中的重要战略资产。不过，受托责任要求投资者在核实收入构成、软件续约率和硬件毛利贡献前暂缓配置资金。投资逻辑可能被打破的触发因素包括：政府
              Other Transaction 试点未能转化为多年期经常性采购项目；商业卫星运营商采用自有编排套件；或后续融资需要通过下调估值重组资本结构。
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV011
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 估值敏感性与观望立场
            body: >-
              尽管 Aalyria 展示了独特的多轨道编排技术，并获得 Tier-1 政府机构 DIU 和 NASA 认可，但 $1.3B 的 Series B 投后估值已将近乎完美预期计入价格。在管理层披露 商业电信
              ARR、合同续约条款和软件毛利率之前，投资者应 继续保持“继续研究”的立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV014
          - type: callout
            title: NTN 变现延迟的下行敞口
            body: 非地面网络采用受到运营商阻力，核心问题在于消费者变现和设备 吞吐量限制。如果商业部署停滞，Aalyria 的估值倍数可能压缩至 $400M-$600M， 且收入仍主要来自政府原型项目拨款。
            calloutType: risk
            claimRefs:
              - CV005
