  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: >-
      从两个维度展示空间网络替代方案的竞争定位：多厂商架构开放性（x 轴，1=封闭 / 专有，10=完全厂商中立）与动态时空编排深度（y 轴，1=静态链路调度，10=实时预测性 3D
      网格优化）。分数是基于证据的序数评估，来源于技术备案、项目奖项与运营商披露。
    data:
