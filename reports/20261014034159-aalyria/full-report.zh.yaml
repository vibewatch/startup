    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营概况
        blocks:
          - type: paragraph
            body: >-
              Aalyria 将自己定位为横跨软件与硬件的通信基础设施公司：Spacetime 是编排移动网络的托管平台，Tightbeam 提供自由空间光学终端。独立报道将公司所在地指向加州 Livermore，并称其在
              Washington, D.C.、Pittsburgh 和 London 设有办公室。公司起源并不完全一致：CNBC 与 Via Satellite 称其于 2022 年从 Alphabet 分拆，Data
              Center Dynamics 则称其在 Google 关闭 Loon 后于 2021 年成立。这可能反映注册时间与公开分拆时间的差异，但现有来源无法调和两者。因此本快照将 2022
              年视为分拆年份，并把法定成立日期列为文件尽调事项，不强行制造精确结论。
            claimRefs:
