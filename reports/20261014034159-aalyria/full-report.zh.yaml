  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              商业太空经济正从彼此孤立、各自封闭的卫星系统，转向覆盖低地球轨道（LEO）、中地球轨道（MEO）、地球同步轨道（GEO）及空中平台的多轨道网状网络 [CM002, CM003]。Aalyria
              将核心市场界定在软件定义网络（SDN）控制平面和高容量大气光通信层，并明确把可触达机会与资本密集型卫星平台制造、发射服务及标准化转发器租赁区分开来
              [CM003]。传统卫星运营商依赖静态地面站排程软件、专有弯管式转发器和人工网络管理框架，无法适应巨型星座的快速轨道变化 [CM002, CM008]。Aalyria 以 Spacetime 智能时空编排平台搭配
              Tightbeam 大气自由空间光学（FSO）终端，后者速率最高可达 100 Gbps [CM002, CM009]。Aalyria 将 Spacetime
              定位为中立编排层，连接不同防务、民用与商业太空资产，组成联邦式“网络之网”，同时不承担发射自有卫星所需的数十亿美元资产负担 [CM001, CM003]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: TAM、SAM 与 SOM 的约束式测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 Aalyria 的可触达市场，需要把宏观太空行业预测拆解为现实、可由软件触达的采购板块，而不是依赖不受约束的 headline 数字 [CM001, CM012]。自上而下的预测预计全球太空经济到 2035
              年将接近 $1.8 trillion，卫星通信基础设施年支出达到 $120 billion，但其中大部分由运载火箭、卫星平台和商品化频谱租赁吸收 [CM012, CM014]。Aalyria
              动态太空网络与编排的总可用市场（TAM）更准确地限定为 $18 billion，涵盖非地面网络路由、5G NTN 传输集成及多轨道数据分发 [CM003, CM014]。其中，可服务市场（SAM）约为 $3.8
              billion，代表投资开放 O-RAN 接口和光学星间链路的政府防务项目及一线 LEO/MEO 商业运营商 [CM004, CM014]。近期可获取市场（SOM）约为 $450 million，锚定
              Telesat Lightspeed 等已承诺的旗舰星座部署及正在进行的国防部原型项目 [CM001, CM006, CM014]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM012
              - CM014
      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的编排技术需求分为三类买方，各自拥有不同的预算权、采购周期和架构触发因素 [CM004, CM013]。近期主要买方是美国及其盟友的防务机构，包括 Defense Innovation
              Unit（DIU）、Air Force Research Laboratory（AFRL）和 U.S. Space Force Space Warfighting Analysis
              Center（SWAC）[CM004]。在 Hybrid Space Architecture（HSA）和 Space Data Network
              Experimentation（SDNX）计划下，防务买方寻求厂商中立的软件，把商业与军用太空资产联成可互操作网状网络，为 Joint All Domain Command and
              Control（JADC2）任务提供自主、低延迟数据路由 [CM004, CM005]。民用太空机构是第二类客户：NASA 的 Space Communications and
              Navigation（SCaN）项目已与 Aalyria 合作，在 Polylingual Experimental Terminal（PExT）任务中用 Spacetime 演示企业服务管理
              [CM007]。商业领域的巨型星座运营商，如 Telesat，已签约让 Aalyria 作为任务关键控制平面，管理其 $3.5 billion Lightspeed
              星座的动态路由；自动拓扑优化可直接降低运营费用并最大化可计费带宽吞吐 [CM006, CM013]。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 增长驱动、架构约束与资本强度
        blocks:
          - type: paragraph
            body: >-
              卫星发射频率上升、LEO 星座扩张以及军方对分布式韧性的要求，正在加快 Aalyria 编排平台的采用 [CM004, CM005]。但商业扩张受到航空航天硬件部署固有的技术与资本约束 [CM010,
              CM011]。自由空间光通信穿过大气层时会受到云层、降雨和湍流的严重衰减，因此需要复杂的预测性重路由和混合 RF 备份能力，Spacetime 的数字孪生必须持续解决这些问题
              [CM008]。更关键的是，硬件终端生产带来高资本强度和供应链脆弱性；光学终端先行者 Mynaric 资不抵债并在德国进行 StaRUG 重组，随后被 Rocket Lab 收购，便是例证
              [CM010]。卫星设计一旦锁定特定终端外形和飞行软件接口，运营商就会面临高昂切换成本，采购惯性可持续多年 [CM011]。因此，Aalyria 最终的商业化速度取决于它能否把 Spacetime
              做成高毛利、独立于硬件的软件平台，还是客户采用仍会被 Tightbeam 的生产和认证周期卡住 [CM001, CM010, CM011]。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM008
              - CM010
              - CM011
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 碎片化太空网络中的“数字软骨”切入口
            body: Aalyria 将 Spacetime 定位为中立编排层，避开资本密集型卫星平台制造商。它解决多轨道路由和大气干扰问题，可在不承担轨道资本支出的情况下，从商业星座和防务网络获取经常性软件毛利。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
          - type: callout
            title: 光学硬件的资本强度与供应链脆弱性
            body: >-
              Spacetime 具备轻资产软件的可扩展性，但 Tightbeam 终端使 Aalyria 暴露于制造良率、精密光学部件供应链和复杂大气认证。Mynaric
              重组表明，硬件生产拖累综合毛利时，资本错配风险不容忽视。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              Aalyria 周围的竞争者分为四类：垂直整合的巨型星座、多轨道卫星运营商联盟、防务任务集成主承包商，以及自建网络运营团队。SpaceX 的 Starlink 通过部署数千颗 LEO 卫星，压低每 Gbps
              传输成本并刷新定价基准，迫使传统运营商重新定位；SES 等传统舰队运营商则通过 SES Open Orbits 组建开放架构联盟，共享 GEO 和 MEO 容量。在防务领域，Defense Innovation
              Unit 在 Hybrid Space Architecture 项目下向包括 Aalyria、Anduril Industries、Atlas Space Operations 和 Enveil
              在内的同业授予原型合同，用于联通商业与军用通信。Aalyria 的差异在于提供商用现成软件编排平台，而不是拥有轨道硬件。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: 架构差异化与功能矩阵
        blocks:
          - type: paragraph
            body: >-
              Spacetime 在架构上明显区别于封闭式卫星控制软件和静态地面频谱管理。它源自 Alphabet 的 Minkowski 航空航天项目，并在 Project Loon
              数百万小时飞行中得到强化，是能在异构太空、空中和地面节点间调度可转向定向波束的时空软件定义网络系统。NASA 的 PExT 演示已验证其互操作性，连接了 TDRSS、Viasat 以及 SES Space and
              Defense。Aalyria 还与 European Space Agency 合作，把非地面网络能力嵌入开放 O-RAN 服务管理与编排接口。传统防务方案依赖 DISA CBRS 等静态频谱协调框架，而
              Spacetime 用先进物理引擎以快于实时的速度预测 RF 与光链路机会。
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
              - CP011
              - CP012
      - number: '3.3'
        title: 定价模式、GTM 分销与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              商业包装和分销模式体现出不同的变现路径。星座运营商靠带宽消耗和专有终端销售变现，把买方锁定在封闭星座中；Aalyria 则将 Spacetime 作为企业软件平台交付，并通过 Tightbeam
              大气光学终端获得资本性销售收入。早期 GTM 牵引力来自政府其他交易奖励，包括与 Defense Innovation Unit 签署的 $8.7 million
              协议，但完整商业许可条款仍属保密。在商业移动市场，竞争联盟通过成熟的飞机集成项目分发连接服务，例如 Airbus HBCplus 和 Boeing 平台上的 Safran Passenger
              Innovations。运营商一旦把 Aalyria 的预测路由算法嵌入核心运营，因其与地面 teleport 和星座飞行软件深度集成，切换成本就会很高。
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP014
              - CP015
      - number: '3.4'
        title: 护城河持久性、商品化与不利风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的竞争护城河来自专有物理求解器、从 Google 继承的大量算法专利，以及在多轨道防务和民用任务中的先发验证。但外部市场证据也显示出威胁长期持久性的重大不利风险。行业研究预计卫星容量需求到
              2034 年增至 218 Tbps，同时资金充足的防务主承包商和既有航空航天承包商正在加速竞争。Aalyria 的增长仍紧密依赖政府防务拨款，容易受到预算重排和漫长采购周期冲击。Tightbeam
              光通信硬件的规模化还面临制造和大气衰减难题。若卫星运营商选择自建轻量排程程序，或采用不带商业许可的开放联盟标准，Aalyria 可能遭遇软件毛利率压缩。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP012
              - CP013
