          - type: paragraph
            body: >-
              在客户工作流中，Aalyria 把卫星运营从僵化的静态转发器租赁转向动态、多运营商、软件管理的数据包路由。过去，政府和商业航天器在架构上往往绑定单一专有中继网络，形成运营瓶颈和单点故障风险。在 U.S.
              Defense Innovation Unit 的 Hybrid Space Architecture 项目下，Aalyria 正演示把政府与商业太空资产接入韧性网状网络的多路径通信。NASA 的
              Polylingual Experimental Terminal 演示在 York Space Systems 的 BARD 航天器上验证了这一能力：Spacetime 通过标准 Ka-band 频谱协调
              NASA Tracking and Relay Satellite system、Viasat 与 SES Space and Defense
              中继，提供企业服务运营。借助统一软件框架协调多任务通信服务，Spacetime 让卫星运营商能够联邦化容量、提高服务可见性，并在不同轨道面和地面站之间动态路由流量。
