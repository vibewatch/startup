      - number: '4.4'
        title: 资本充足性与融资跑道
        blocks:
          - type: paragraph
            body: >-
              Aalyria 在 2026 年 2 月完成 $100 million Series B，按投后估值 $1.3 billion 为这家加州企业融资，显著增强了资产负债表。本轮使累计股权融资及已披露合同资金达到约
              $135 million，叠加 J2 Ventures、Accel 和 Housatonic 创始人的早期支持，以及 Alphabet 保留的少数股权。$100 million 资金可用于扩大 Tightbeam
              制造、把航空航天工程团队扩至高于 2022 年成立时的 26 人基线，并承受把防务原型演示转成多年期正式生产项目所需的采购周期。若考虑硬件制造和高空飞行测试，估计每月净运营烧钱 $2.5 million 至
              $3.5 million，Series B 约可提供 28 至 36 个月运营跑道，在需要追加融资前把财务独立性延续到 2028 年末。
            claimRefs:
              - CI005
              - CI013
              - CI014
      - number: '4.5'
        title: 财务结论与尽调评估障碍
        blocks:
          - type: paragraph
            body: >-
              从风险投资评估角度看，Aalyria 的财务画像不对称。公司 $1.3 billion 的 Series B 估值已计入显著的控制平面垄断租金，押注 Spacetime
              将成为下一代混合政府与商业太空架构不可或缺的操作系统。然而，严谨私募投资评估所需的关键财务指标——年化经常性收入运行率、净收入留存、软件毛利率和获客回本周期——均未公开。早期收入主要来自非经常性工程和原型里程碑拨款，例如共享的
              $8 million DIU OT 奖项，而非商业多租户 SaaS 合同。评估老股参与或下一轮融资的机构投资者，必须取得经审计 GAAP 损益表，拆分 Spacetime 软件与 Tightbeam
              硬件毛利，并在确认 $1.3 billion 估值前核实防务与商业账户之间的客户集中度。
            claimRefs:
