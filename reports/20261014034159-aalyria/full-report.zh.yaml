    rows:
      - - 网络架构
        - Spacetime 为 LEO、MEO、GEO 与光学网格提供厂商中立的编排层。
        - 卫星机队运营商优先选择自研或垂直集成的网络管理套件。
        - 主要运营商合作伙伴选择替代控制平面，或取消正在运行的试点协议。
      - - 政府切入点
        - DIU HSA 奖项与 NASA 合作证明了多轨道协调的任务关键价值。
        - 政府 OT 原型合同未能转化为持续性采购预算项目。
        - 示范项目完成后仍未获得多年期生产合同。
      - - 商业 TAM
        - 非地面网络势头强劲（全球 118 个运营商合作关系），扩大了可服务市场。
        - 移动运营商难以实现用户变现，使 NTN 沦为低毛利的应急消息功能。
        - 直连设备的应用停留在消息服务，未能实现宽带数据套餐变现。
      - - 估值现实性
        - 先发编排软件可在多轨道机队中捕获高毛利率的控制平面经济价值。
        - 若收入主要来自硬件或低毛利专业服务，$1.3B 估值将面临下轮融资估值下调风险。
        - 后续融资轮或老股交易价格低于 $1.3B 的投后估值基准。
