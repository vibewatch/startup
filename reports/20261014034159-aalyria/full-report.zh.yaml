        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              两位创始人兼运营者分工互补。创始 CEO Chris Taylor 拥有国家安全与政府销售经验，创始人兼 CTO Brian Barritt 则延续了来自 Google、Cisco 和 NASA
              的技术积累。这一组合适合 Aalyria
              同时面向商业与公共部门拓展市场，但也把产品叙事、政府关系和技术可信度集中在两名高管身上。本章审阅的公开证据没有提供完整董事会名单、投票安排、继任梯队或重大领导层变动记录。截至 2026 年 2
              月融资，Google 仍持有股份，但持股比例、权利、知识产权边界及商业化限制均未披露。这些缺口使治理与关键人物风险无法形成确定判断。
