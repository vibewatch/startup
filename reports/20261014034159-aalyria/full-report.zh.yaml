      - number: '4.3'
        title: 成本结构与单位经济分析
        blocks:
          - type: paragraph
            body: >-
              评估 Aalyria 的成本结构，需要把轻资产软件基因与硬件工程现实分开。Spacetime 源自 Alphabet 的 Loon 旗下 Project
              Minkowski，分拆前受益于数亿美元企业研发投入和数百万小时空中飞行时长。但 Alphabet 在 2021 年初关闭 Loon，认定高空通信无法把运营成本降到足以支撑长期商业业务的水平。Aalyria
              同时开发 Tightbeam 硬件，还要面对政府防务项目和一线卫星运营商典型的漫长销售周期，因此难以复制纯软件经济性。S&P Global
              的市场研究还指出，移动网络运营商和非地面网络服务商在变现模式上举步维艰，把卫星连接接入核心网络时要承担沉重的运营和资本支出。这些运营商层面的经济障碍直接限制 Aalyria
              的商业定价能力、拉长单位销售回本周期，使私人毛利率和获客成本成为关键但未经验证的变量。
