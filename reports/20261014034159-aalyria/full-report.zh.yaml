  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    summary: 从整体太空经济支出逐层收窄至近期可实现的光学与控制平面收入，展示受约束的可服务规模。
    data:
      items:
        - label: 全球太空经济（2035 年 $1.8T）
          value: 1800000
          displayValue: $1.8T (2035 projection)
          detail: 涵盖发射、卫星制造、地面设备与商业服务的宏观太空经济。
          tone: neutral
        - label: 卫星通信基础设施（$120B）
          value: 120000
          displayValue: $120B (Total Satcom Spend)
          detail: 商业与国防转发器租赁、宽带星座及地面卫星通信枢纽基础设施。
          tone: neutral
        - label: 动态混合网格网络 TAM（$18B）
          value: 18000
          displayValue: $18B (Addressable Network Layer)
          detail: 覆盖多轨道架构的编排软件、动态路由与高带宽星间链路终端。
          tone: opportunity
        - label: 可服务市场（SAM：$3.8B）
          value: 3800
          displayValue: $3.8B (Targeted SDN & FSO Hardware)
          detail: 采用开放 O-RAN、DIU HSA 与光学星间链路的政府及一级商业 LEO/MEO 星座。
          tone: opportunity
        - label: 可获取市场（SOM：$450M）
          value: 450
          displayValue: $450M (Near-Term Pipeline)
          detail: 核心政府原型奖项（AFRL、DIU、NASA）与已承诺的商业 LEO 控制平面合同（Telesat Lightspeed）。
          tone: positive
        - label: 已证明的商业订单储备（$100M+）
          value: 100
