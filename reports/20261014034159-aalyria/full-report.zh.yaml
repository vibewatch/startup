      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 网络控制与星座所有权脱钩
            body: >-
              Aalyria 的战略切入口，是把软件定义的网络管理与资本密集型轨道星座所有权分开。Starlink 等巨型星座压低原始带宽价格后，区域及主权运营商更需要 Spacetime
              这样的中立编排平台，在不把客户关系交给垂直整合既有者的情况下联邦化容量。
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP012
          - type: callout
            title: 资本强度与防务预算依赖
            body: >-
              尽管 Aalyria 在 2026 年以 $1.3 billion 估值融资 $100
              million，公司仍暴露于漫长政府采购周期和大气光学硬件的高制造成本。卫星运营商商业采用慢于预期，可能使公司过度依赖存在争议的美国防务拨款。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Aalyria 采用双轨变现模式，覆盖纯控制平面软件和光学收发器硬件。旗舰平台 Spacetime
              编排卫星、空中平台、海上船舶和地面站之间的多域网状链路，按托管节点和轨道面向卫星星座运营商、防务客户收取年度或经常性企业订阅费。Tightbeam 是相干光自由空间光学终端，最高可提供 1.6 Tbps
              无线速率，覆盖最多 15 million 条动态链路。软件许可具备 SaaS 毛利潜力，但 Tightbeam 需要定制制造、实体部署和光学校准。早期现金主要来自政府原型项目，具体是 Defense
              Innovation Unit 与 Anduril、Atlas、Enveil 组成联盟，为 Hybrid Space Architecture 项目授予的首份 $8 million Other
              Transaction 合同。商业变现仍处在试点和联盟阶段，Aalyria 计划接入 SES Open Orbits 等开放架构的航空机上连接生态。
