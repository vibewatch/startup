  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、运营模式与系统架构
        blocks:
          - type: paragraph
            body: >-
              Aalyria 提供双轨通信架构，由 Spacetime 软件定义网络（SDN）编排平台和 Tightbeam 自由空间光通信硬件组成。Spacetime 源自 Google 内部代号 Project
              Minkowski，工程团队近十年开发自主路由算法，把地面站、飞机、高空气球和轨道航天器连接起来。平台兼具集中式和分布式控制平面，动态调度 LEO、MEO 和 GEO
              资产的多轨道网络拓扑。它不把卫星星座当作孤立的点对点管道，而是计算预测性视线可用性，编排射频和激光波束指向，并缓解异构太空与地面 teleport 的数据拥塞。Aalyria 再以 Tightbeam
              搭配该编排引擎；这款大气自由空间光学收发器能在不挖设专用光纤的情况下穿过大气湍流传输高吞吐数据束，为复杂航空航天连接整合控制层与物理层。
            claimRefs:
              - CE001
