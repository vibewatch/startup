    notes: 评估 Aalyria 所面临关键运营与投资风险的风险矩阵。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR010
      - CR014
  - id: FV001
    title: 估值与建议决策链
    type: flow
    summary: 将商业证据、政府切入点、估值倍数与下行触发因素逐步连接至“继续研究”建议的决策链。
    data:
      nodes:
        - id: n1
          label: 分拆背景与双轨技术
          detail: 继承 Project Loon 与 Fsoc 技术背景，拥有 Tightbeam 硬件与 Spacetime 编排平台
        - id: n2
          label: 政府早期验证
          detail: DIU Hybrid Space Architecture 合同，以及 NASA Spacetime 企业运营合作
        - id: n3
          label: 商业 NTN 市场拐点
          detail: MWC 2026 突出显示，已有 118 家移动运营商开展卫星合作，其中 33 项服务已上线
        - id: n4
          label: 独立经济性尚未验证
          detail: 运营商担心消费者的支付意愿，资本开支和运营开支沉重，且 ARR 尚未披露
        - id: n5
          label: 偏高的估值倍数
          detail: $1.3B B 轮估值在商业收入得到验证前，就已按软件毛利率计入估值
        - id: n6
          label: 建议：继续研究
          detail: 在商业经常性软件收入和毛利率披露前维持观望
      edges:
        - from: n1
          to: n2
          label: 带来
        - from: n2
          to: n3
          label: 扩展为
        - from: n3
          to: n4
          label: 面临
        - from: n4
          to: n5
          label: 叠加成
        - from: n5
          to: n6
          label: 决定
