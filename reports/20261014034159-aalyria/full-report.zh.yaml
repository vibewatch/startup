              Aalyria 处在商业电信与国家安全交界处，增长路径取决于严格的防务认证和合规框架。公司已通过把 Spacetime 与 Second Front Systems 的 Game Warden
              平台集成，取得国防部 Impact Level 4 和
              5（IL4、IL5）的连续运营授权（cATO）。这种容器化架构把软件发布节奏与认证负担分开，使企业实例可运行在云、本地部署和边缘隔离环境中。但进入最有价值的情报机构及机密军事任务，需要 Impact Level
              6（IL6）和 Top Secret Cloud 授权；相关授权仍在推进，存在验证风险。此外，Tightbeam 自由空间光通信终端包含精密光束控制硬件，受 ITAR 和 EAR
              双用途出口管制。要避免国际销售摩擦和监管执法，纯软件控制平面与受出口管制硬件必须保持清晰的架构和公司隔离。
            claimRefs:
              - CR002
              - CR003
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR008
      - number: '7.2'
        title: 运营执行、大气链路衰减与动态编排韧性
        blocks:
          - type: paragraph
            body: >-
              Spacetime 的核心技术价值在于借助行星尺度数字孪生建模动态平台轨迹和环境条件。不同于静态地面路由协议，它协调移动平台之间的物理链路几何，预测链路可用性并预先计算波束控制任务；资产故障时，可在 100
              milliseconds
              内重建网络拓扑。但将该架构落到太空到地面及星间场景，会引入严重的物理故障模式。高频毫米波（E-band）和自由空间光（FSO）链路会因云、雾、降水及低层大气热闪烁而显著衰减。Spacetime
              的时空数字孪生试图主动绕开受损孔径，但持续的区域天气可能压垮地面站多样性。虽然 Spacetime
              只交换控制平面遥测而非用户数据平面流量，边缘编排守护进程在受限卫星计算节点上的同步延迟，仍可能造成动态多跳星座丢包或路由振荡。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: 客户集中度、锚定星座可行性与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Aalyria 在商业化爬坡期面临严重客户集中风险。公司公开的主要商业参考部署围绕旗舰 LEO 巨型星座项目，尤其是 Telesat Lightspeed 和 Rivada Space
              Networks。两项多年集成协议虽验证了 Spacetime 编排复杂非地球同步网状架构的能力，但两个合作星座都处于运营前、资本密集型建设期，容易受到发射清单延误、供应链瓶颈和融资短缺冲击。Telesat
              Lightspeed 的卫星制造或部署里程碑延迟，会直接推迟 Aalyria 的高毛利经常性软件许可收入。与此同时，SES 等传统卫星舰队运营商正在推进 Open Orbits
              等开放架构联盟，试图用标准化载波接口汇聚多轨道容量。Aalyria 必须说服运营商采用 Spacetime 的时空控制平面，而不是依赖传统 SD-WAN 叠加层或竞争性联盟路由框架。
            claimRefs:
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 资本强度、估值空间与投资逻辑破坏条件
        blocks:
          - type: paragraph
            body: >-
              Aalyria 在 Battery Ventures 和 J2 Ventures 领投的 2026 年 2 月 $100 million Series B 后，投后估值达到 $1.3
              billion。这一独角兽估值已计入激进的企业软件经济性和控制平面普及，却没有经审计的商业收入证明。Spacetime 采用软件优先模式，但 Tightbeam
              光学终端持续开发和制造会带来硬件工程开销与资本强度。防务方面，国会拨款和 Space Force 预算重分配体现出波动性，例如拟议的 MILNET 星座削减预算、转向传统 GPS 现代化。Aalyria 通过
              Defense Innovation Unit Other Transaction 原型合同获得的联邦势头，必须转化为长期 Programs of Record
              才能支撑收入增长。若商业星座锚定客户把轨道发射推迟超过 18 个月，或联邦原型项目奖无法转成生产合同，Aalyria 的估值倍数将面临严重压缩风险。
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR014
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 锚定星座可行性与交付时点
            body: Aalyria 近期商业收入管线高度集中在 Telesat Lightspeed 和 Rivada Space Networks 的早期锚定承诺，现金流兑现容易受到外部星座发射和融资延误影响。
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
          - type: callout
            title: 里程碑驱动的投资评估与验证要求
            body: 进一步投入资本前，需要验证在轨商业 SLA 在线率，确认超出原型 OT 协议的正式 DoD 采购拨款，并跟踪 IL6 认证里程碑。
            calloutType: recommendation
            claimRefs:
