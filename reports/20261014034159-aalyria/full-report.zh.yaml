      - number: '4.2'
        title: 收入模型桥接与服务交付机制
        blocks:
          - type: paragraph
            body: >-
              客户通信需求能否转化为确认收入，取决于控制平面路由软件与终端硬件交付的配合。面对异构星座架构的卫星运营商和防务项目，需要实时链路编排来避免通信中断、优化稀缺频谱；Aalyria 通过把 Spacetime
              嵌入企业服务管理层承接这一需求，NASA 的 Space Communications and Navigation
              项目合作即为例证。收入有两种成本画像：增量基础设施开销极少、毛利较高且可扩展的经常性软件许可；以及需要精密光电部件、洁净室组装和现场工程的资本密集型 Tightbeam
              硬件销售。硬件毛利受物料清单和制造良率根本约束，因此整体毛利走势取决于软件订阅是否是主收入，还是仅仅为实体终端交付提供支撑。
