  topStrengths:
    - Validated by DIU, NASA, Telesat, and AFRL across defense, civil, and commercial use cases.
    - Distinct software-plus-hardware wedge in multi-orbit orchestration and free-space optical communications.
    - Fresh Series B capital and strong investor backing support continued execution runway.
  topRisks:
    - >-
      Recurring revenue, gross margin, and contract structure remain insufficiently disclosed for a software-style
      valuation.
    - Commercial customer concentration appears high around flagship programs and early adopters.
    - Hardware manufacturing and procurement cycles can slow monetization and consume capital.
  unresolvedGaps:
    - >-
      Revenue quality, recurring software mix, gross margin, and contract structure needed to test whether the
      control-plane thesis monetizes like software.
    - >-
      Deployment and production milestones for Telesat Lightspeed plus evidence of additional live operator workloads
      beyond flagship partners.
    - Exact Google/Alphabet ownership, IP boundary terms from the spinout, and any commercialization constraints.
