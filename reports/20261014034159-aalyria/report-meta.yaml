companyProfile:
  summary: >-
    Aalyria is an Alphabet/Google spinout building Spacetime, a multi-orbit network-orchestration platform, and
    Tightbeam, a free-space optical communications hardware line. The company sells into defense, civil space, and
    commercial satellite operators, with public validation from DIU, NASA, Telesat, and AFRL, but its recurring revenue,
    margin structure, and ownership economics remain only partly disclosed.
