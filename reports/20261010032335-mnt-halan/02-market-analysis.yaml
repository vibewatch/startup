callouts:
  - calloutType: "insight"
    title: "Securitization and Balance Sheet Velocity as Market Catalysts"
    body: "MNT-Halan's reliance on repetitive securitization issuances through major Egyptian banking syndicates fundamentally alters the economics of emerging-market digital lending. Rather than remaining constrained by private equity capital or commercial deposit gathering, offloading seasoned loan tranches provides capital velocity and generates off-balance-sheet fee income while funding portfolio expansion."
    claimRefs:
      - "CM012"
      - "CM005"
  - calloutType: "risk"
    title: "Underwriting Opacity and Macroeconomic Fragility Risks"
    body: "Rapid balance sheet expansion across underbanked consumer segments exposes non-bank lenders to heightened default risks during inflationary economic downturns. While reported microfinance default rates remain beneath 1.5%, consumer finance defaults reach up to 4.0%. Without audited public vintage disclosures, true credit loss emergence remains a pivotal diligence sensitivity."
    claimRefs:
      - "CM014"
      - "CM001"
