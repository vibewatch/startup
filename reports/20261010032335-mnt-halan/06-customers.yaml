callouts:
  - calloutType: strength
    title: Market Leadership in Egyptian Non-Banking Financial Services
    body: MNT-Halan commands a leading position in Egypt's underbanked market, holding a company-reported 24.3% share of non-bank microfinance and 14% of non-bank consumer finance. With over 8 million cumulative customers, 2.3 million quarterly active users, and more than $15.5 billion in historical loan disbursements, the platform has demonstrated significant customer acquisition velocity and digital distribution scale.
    claimRefs:
      - CU005
      - CU006
      - CU013
  - calloutType: risk
    title: Lending-Heavy Business Model and Credit Quality Blindspots
    body: Unlike asset-light fintech platforms, MNT-Halan's expansion depends on continuous loan book funding through securitisation and banking facilities. In an emerging market environment characterized by high inflation and currency depreciation, the company has not publicly disclosed vintage delinquency rates, 30+/90+ day non-performing loan (NPL) figures, or customer cohort repeat-borrowing retention, leaving portfolio credit risk as an unresolved diligence area ahead of its planned IPO.
    claimRefs:
      - CU009
      - CU013
      - CU014
