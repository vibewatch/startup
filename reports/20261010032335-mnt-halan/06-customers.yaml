company:
  name: MNT-Halan
chapter:
  number: 6
  title: Customers
  summary: MNT-Halan has established substantial customer scale across Egypt and regional markets, reporting over 8 million cumulative customers, 2.3 million quarterly active users, and over $15.5 billion in cumulative loan disbursements. However, customer adoption remains heavily concentrated in unbanked micro-lending and consumer installment credit, while audited vintage delinquency rates, repeat borrower retention, and enterprise merchant churn remain undisclosed ahead of its planned Egyptian Exchange IPO.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Demographics
    body: 'MNT-Halan addresses a structurally underbanked market in Egypt, where more than 70% of the population of over 100 million has historically lacked access to formal financial institutions. The company segments its customer base into three primary operational categories: mass-market consumer borrowers, retail installment shoppers, and micro-enterprises. Mass-market consumers utilize the Halan digital cash wallet for utility bill settlements, peer-to-peer transfers, and instant nano-loans capped at EGP 2,000 for emergency liquidity. Retail consumers access point-of-sale Buy Now Pay Later (BNPL) facilities across an extensive merchant network to finance electronics and household appliances. For informal micro-enterprises, small shopkeepers, and light logistics operators, MNT-Halan provides working capital microfinance loans up to EGP 200,000. Additionally, the platform serves corporate employers through payroll lending programs that allow staff to draw salary advances of up to 80%, providing lower-risk automated deductions. Cross-border expansion has further diversified its demographic footprint into SME factoring in Turkey, microfinance banking in Pakistan, and digital salary advances in the UAE.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-usage
    title: Adoption Trajectory and Activity Metrics
    body: Since its founding in 2018 as a two- and three-wheeler ride-hailing application, MNT-Halan has exhibited rapid customer adoption velocity, transforming into a diversified fintech super app. Early customer disclosures indicated 4 million Egyptian customers in 2021, comprising 3.1 million financial clients and 1.8 million active borrowers, alongside approximately 1 million monthly active users. By mid-2026, cumulative customers served grew to more than 8 million across its operating markets, supported by over 10 million mobile application downloads. The platform reported over 2.3 million quarterly active customers across its digital ecosystem, indicating substantial ongoing engagement beyond one-off registrations. In transaction scale, cumulative loan disbursements expanded from $1.7 billion in 2021 to over $15.5 billion to $16 billion by mid-2026. However, diligence analysis highlights that these impressive headline figures represent cumulative lifetime volume rather than current active balance sheet exposure, and MNT-Halan does not disclose monthly active user retention curves or active-to-dormant account ratios.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
  - id: enterprise-and-institutional-proof
    title: Enterprise Deployments and Institutional Relationships
    body: MNT-Halan has anchored its commercial customer expansion through institutional partnerships, banking integrations, and retail distribution relationships. A cornerstone institutional commitment materialized in September 2026 when Commercial International Bank (CIB), Egypt's largest private-sector bank, entered into an investment agreement committing up to EGP 2 billion ($37.34 million) to acquire an anticipated 2.7% equity stake in MNT-Halan's planned Egyptian Exchange (EGX) IPO. This commitment formalizes a 15-year operational banking relationship that provides debt facilities and settlement rails. On the merchant distribution side, MNT-Halan connects with over 4,000 retail partner vendors that deploy its BNPL checkout infrastructure for consumer goods and electronics. Internationally, the company established production deployments by acquiring Tam Finans Faktoring A.S. in Turkey to deliver SME trade invoice financing and Advans Pakistan Microfinance Bank Ltd. to operate regulated deposit accounts and micro-loans, demonstrating geographic diversification across volatile emerging economies.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: customer-journey-and-retention-risks
    title: Customer Journey Dynamics, Durability, and Credit Concentration
    body: The customer lifecycle begins with digital app download and electronic KYC verification, allowing users to activate a Central Bank of Egypt-licensed digital wallet for daily transactions. Customers typically build an initial credit profile through high-frequency bill payments and low-ticket nano-loans, before graduating into multi-month BNPL installment purchases and micro-enterprise working capital loans up to EGP 200,000. While this land-and-expand journey drives customer lifetime value, MNT-Halan's lending-heavy business model introduces substantial credit portfolio and funding concentration risks. The company commands a dominant 24.3% market share in Egypt's non-bank microfinance sector and 14% of non-bank consumer finance. Sustaining this loan book requires continuous balance sheet recycling through securitisation bond issuances, such as the EGP 2.214 billion consumer finance securitisation closed in April 2026. Because loan performance directly determines institutional securitisation appetite and funding cost, the absence of publicly disclosed vintage loss curves, 30+/90+ day delinquency rates, and customer repeat borrowing cohorts represents a critical blindspot for equity investors.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
    figureRefs:
      - FU001
