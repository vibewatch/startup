    rows:
      - - Mass-Market Consumers
        - Unbanked individuals & informal wage earners
        - Instant nano-loans (up to EGP 2k), digital wallet transfers & bill pay
        - Millions of wallet accounts; 10M+ app downloads
        - High transaction volume, user acquisition funnel & fee income
        - Lack of public data on active vs dormant wallet balances
      - - BNPL Retail Shoppers
        - Middle-class & banked/underbanked consumers
        - Point-of-sale installment credit for electronics & household goods
        - Network of 4,000+ retail merchant partner locations
        - High-margin interest & merchant discount rate (MDR) revenue
        - Undisclosed average ticket size and customer delinquency rates
      - - Micro-Enterprise & Vendors
        - Small shop owners, informal traders & kiosk operators
        - Working capital & inventory microfinance (up to EGP 200k)
        - 24.3% share of Egyptian non-bank microfinance sector
        - Core interest margin driver and primary securitisation asset pool
        - Absence of audited loan loss provisions by vintage cohort
      - - Corporate & Payroll Clients
        - Formal corporate employers & their salaried staff
        - Payroll lending, salary advances (up to 80%) & employee benefits
        - Corporate B2B enterprise partnerships in Egypt & UAE
        - Lower default risk, automated payroll deduction & sticky float
        - Contract duration terms and partner concentration undisclosed
    notes: Segment architecture based on MNT-Halan regulatory disclosures, product limits, and Preqin asset profile data; loan caps reflect Egyptian FRA regulatory ceilings.
