        - label: 数字 KYC 与电子钱包开通
          summary: >-
            User registers with national ID and activates Central Bank of Egypt-licensed digital wallet for bill
            payments and peer-to-peer transfers.
          tone: positive
        - label: 即时纳米贷款
          summary: >-
            Borrower accesses automated nano-loans up to EGP 2,000 for immediate liquidity, establishing baseline
            digital repayment history.
          tone: positive
        - label: 销售点 BNPL 融资
          summary: >-
            Consumer finances retail electronics or appliances across 4,000+ merchant vendor network on structured
            installment terms.
          tone: positive
        - label: 小额信贷与 SME 营运资金
          summary: >-
            Entrepreneurs graduate to microfinance facilities up to EGP 200,000 or invoice factoring to fund commercial
            business operations.
          tone: positive
        - label: 证券化与再融资敞口
          summary: >-
            Performing loan receivables are bundled into institutional securitised bond issuances, tying borrower
            durability to capital market liquidity.
          tone: risk
