      - number: '5.3'
        title: 竞争差异化、部署基础设施与尽调风险
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的主要运营差异化来自对核心银行平台的自有控制，以及既有监管牌照和全国实体分销。不同于授权第三方核心银行系统、或只是商业银行贷款发起前端的区域金融科技创业公司，MNT-Halan 直接通过
              Neuron 管理信贷账簿、承做规则和服务流程。但技术与运营尽调揭示出显著脆弱性和披露缺口。第一，公司虽然宣传 AI
              驱动的信用评分，却没有发布独立模型验证、算法公平性审计或统计违约表现数据，无法验证承做准确性是否经得住剧烈宏观周期。第二，现金存取仍高度依赖实体网点和第三方现金网络，限制纯数字单位的可扩展性。第三，土耳其、巴基斯坦和阿联酋的部署面临割裂的银行协议、不同法定框架下的数据隐私本地化规则，以及对外部伙伴
              API 的依赖。最后，MNT-Halan 没有公开开发者文档、开放 API 门户或 ISO/IEC 27001、SOC 2 Type II 等第三方网络安全认证，使机构风险敞口的投资判断缺乏透明度。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
