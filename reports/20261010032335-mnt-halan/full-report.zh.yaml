  - id: FI001
    title: 收入模型桥接：生态价值转化
    type: flow
    summary: 展示借助线下代理和数字应用获客后，客户如何转化为放款、费用收入和证券化流动性。
    data:
      nodes:
        - id: n1
          label: 客户获取
          description: 覆盖 25 个省区，拥有 10M+ 次下载和 1,200+ 个分支分销点
        - id: n2
          label: 数字钱包与身份
          description: 获埃及央行许可、服务 8M+ 名注册用户的移动钱包
        - id: n3
          label: 信用评分（Neuron）
          description: 用专有算法评估商户交易和消费者工资数据
        - id: n4
          label: 贷款发起
          description: 发放小额信贷（最高 EGP 200k）、纳米贷款和商户库存贷款
        - id: n5
          label: 收入捕获
          description: 约 25% 的贷款利息收入、BNPL 商户折扣和交易费
        - id: n6
          label: 证券化与流动性
          description: 借助 CIB 支持的证券化债券（EGP 3.4B 档位）转出贷款组合，回收资本再投入
      edges:
        - from: n1
          to: n2
          label: 用户开户
        - from: n2
          to: n3
          label: 行为数据
        - from: n3
          to: n4
          label: 授信审批
        - from: n4
          to: n5
          label: 变现收益
        - from: n5
          to: n6
          label: 组合循环
    approximationNotes: 流程架构综合了公开报道的借贷、支付和证券化融资机制。
    claimRefs:
