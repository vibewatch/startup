      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 由联合创始人、CEO 兼董事长 Mounir Nakhla 主导发展。Nakhla 是资深创业者，曾推动埃及机构化小额金融，并在 2018 年合并前联合创办两家前身实体。联合创始人 Ahmed
              Mohsen 负责补充其管理工作；合并前，Mohsen 主导 Halan 的技术架构和数字钱包运营。国际私募股权机构和本土商业机构注入资本后，治理代表明显扩充。Al Ahly Capital Holding
              CEO Karim Saada 加入董事会后，商业银行的直接监督进一步增强。尽管机构治理扩大，运营和监管战略仍高度集中于 Nakhla，使公司在牌照沟通和融资财团上严重依赖关键人物。
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO007
      - number: '1.3'
        title: 资本化历程、估值与股东
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 持续借助私募股权财团、主权支持基金和资产支持债务证券化扩张信贷资产负债表。2021 年，公司获得 Development Partners International、Apis
              Partners 和 Lorax Capital Partners 支持的 $120m 投资；2023 年 1 月又完成一轮标志性的 $400m 融资，其中包括阿布扎比 Chimera Investments 的
              $200m 股权投资和 $140m 证券化债券。这笔交易使 MNT-Halan 成为埃及首家非上市金融科技独角兽，投后估值达到 $1.0b。2026 年 6 月，Al Ahly Capital Holding
              领投的投资轮完成首轮交割，公司估值升至 $1.4b。2026 年 10 月 1 日，公司宣布通过 IPO 在埃及证券交易所上市普通股本的 20%，发行 320m 股。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
