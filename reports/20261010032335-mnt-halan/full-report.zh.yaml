              - CO008
      - number: '1.4'
        title: 跨境布局与运营脆弱性
        blocks:
          - type: paragraph
            body: >-
              为在国内市场趋于饱和后继续扩大资产负债表，MNT-Halan 已进入四个区域市场：在阿联酋开展数字放贷，在土耳其运营 SME
              保理和租赁平台，在巴基斯坦运营持牌小额金融银行。但跨司法辖区扩张也带来显著的运营、监管和资产负债表复杂性。在新兴市场承做大众消费贷款和小微企业贷款，需要严密的信贷控制、本地化催收基础设施及外汇对冲，以应对剧烈的货币贬值。此外，在拟上市前，关键机构透明度缺口仍未解决：经审计的合并财务报表、产品层面的违约
              vintage cohort 和员工人数指标仍属严格保密，外部分析师只能依赖未经审计的公司披露。
            claimRefs:
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 商业银行协同加固监管护城河
            body: Al Ahly Capital 的股权投资，标志着埃及最大国有商业银行集团首次直接持有独立金融科技公司的股权。这一协同实质上缓解了国内牌照和监管摩擦，同时拓宽存款和债务仓储银团渠道。
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: 多司法辖区复杂性与透明度缺口
            body: 土耳其、巴基斯坦和阿联酋的地域扩张扩大了可触达市场规模，但在 IPO 前，公司尚未发布经审计财报，管理不同央行监管、本地信贷承做和货币贬值持续考验运营控制。
            calloutType: risk
            claimRefs:
              - CO012
