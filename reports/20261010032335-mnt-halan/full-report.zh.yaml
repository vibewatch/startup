      - number: '3.4'
        title: 被替代风险与竞争逆风
        blocks:
          - type: paragraph
            body: >-
              尽管规模强劲，MNT-Halan
              仍面临可能压缩承做利润的替代风险和宏观威胁。最严重的系统性风险来自埃及宏观动荡：高通胀和货币贬值侵蚀大众可支配收入，并增加小微借款人的偿债负担。同时，传统商业银行既是关键融资伙伴，也可能成为长期替代者。国有机构过去将小额金融让给专业机构，但
              Al Ahly Capital 在 2026 年入股表明，传统银行希望直接持有金融科技收益。如果商业银行加快自有数字银行分拆或收紧债务证券化融资，MNT-Halan 的资本成本可能上升。Paymob
              等风险投资支持的收单网关发起激进商户补贴战，也会让城市商户频繁更换 POS 终端以获取促销费率，带来多归属风险。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP012
              - CP015
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 借力现有银行：Al Ahly 商业银行联盟
            body: >-
              MNT-Halan 没有与埃及最大商业银行展开破坏性存款竞争，而是把自己定位为它们的高收益分销引擎。2026 年引入 Al Ahly Capital 成为股权共同持有人后，MNT-Halan
              将主要监管和融资威胁转为机构伙伴，获得补贴式流动性；传统银行则无需建设末端小额金融基础设施，也能获取批发放贷收益。
            calloutType: insight
            claimRefs:
              - CP002
