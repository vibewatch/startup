chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与数字生态
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 于 2018 年成立，总部位于埃及开罗和吉萨，是服务金融排斥及金融服务不足人群的领先数字放贷与支付生态。公司源于数字超级应用 Halan 与 MNT Investments
              的战略合并及换股协议：Halan 最初提供电子钱包和支付服务，MNT Investments 则是在埃及成立的小额放贷业务。MNT-Halan
              将自研核心金融软件与线下分销网点结合，提供小额金融贷款、工资预支、先买后付、消费分期信贷及商户 POS 服务。累计终身发放贷款超过 $160 亿，服务客户超过 800 万；截至 2026 年年中，活跃借款人约
              190 万，客户贷款总额为 467 亿埃及镑。
