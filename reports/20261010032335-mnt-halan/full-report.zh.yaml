  - id: FE001
    title: MNT-Halan 端到端技术栈架构
    type: stack
    summary: 分层展示 MNT-Halan 从用户端界面到底层数据驻留和线下结算网络的技术基础设施。
    data:
      layers:
        - label: 客户端呈现与移动界面
          detail: 原生 iOS 和 Android 超级应用界面及商户 POS 触点，为用户提供数字化自助服务。
          modules:
            - Halan Consumer Android & iOS 超级应用
            - 商户 POS 数字终端
            - 面向 SME 与保理业务的网页版企业门户
        - label: 开放银行与集成网关
          detail: API 网关连接第三方、聚合公用事业账单，并支持开放银行合作。
          modules:
            - Lean Technologies 开放银行聚合器
            - 账单聚合器与公用事业支付网关
            - 电信运营商计费与钱包桥接
        - label: Neuron 专有核心银行引擎
          detail: 内部自研的分布式核心银行引擎，管理会计分类账、交易和多币种余额。
          modules:
            - 分布式交易处理分类账
            - 多币种账户管理引擎
            - 产品配置与贷款服务模块
        - label: 智能授信与决策引擎
          detail: 用机器学习评分算法预测信用状况和客户行为。
          modules:
            - 自动信用评分与决策流水线
            - 行为聚类与支出预测器
            - 违约风险缓解与续贷预测器
        - label: 合规与数据驻留基础设施
          detail: 通过多数据中心隔离和数据驻留托管，满足各司法辖区的监管要求。
          modules:
            - 多数据中心云托管
            - 本地数据驻留隔离区
            - 央行与监管清算网关
        - label: 线下结算与代理运营网络
          detail: 覆盖全国的线下代理现金存取网络，服务无银行账户人群和非正规现金交易。
          modules:
            - 代理现金存取网络
            - 商户现场收款点
            - 线下分支终端与资产融资点
    approximationNotes: 架构分层综合了 Neuron 发布材料和官方运营描述；内部微服务拓扑未公开。
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖从首次注册应用到高频支付、微型借贷和企业拓展的完整客户生命周期。
    data:
      items:
