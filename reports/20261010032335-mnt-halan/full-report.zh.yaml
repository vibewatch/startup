  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品生态与客户工作流架构
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan
              在埃及、土耳其、巴基斯坦和阿联酋运营一体化、多边金融生态，连接大众消费者、无银行账户人群、非正式商贩和小微企业。产品架构从出行和物流应用演变为数字放贷与交易生态，目标是在服务不足的社区替代现金交易。面向零售消费者，Halan
              移动应用是一个消费者超级应用，提供数字钱包、点对点转账、公用事业账单聚合、消费分期贷款，以及生活用品、电子产品和家电电商购买。面向非正式小微企业和商户，平台提供营运资金小额贷款、数字支付受理、库存供应链融资及商户现金收款工具。交易采用混合运营模式：数字移动交互由线下现金存取代理网络和实体分销点支持。在企业和跨境场景中，MNT-Halan
              提供工资支持的工资预支、数字员工金融服务、贸易应收账款保理和 SME 小额信贷额度，使经营者无需传统抵押品即可稳定营运资金流。
            claimRefs:
