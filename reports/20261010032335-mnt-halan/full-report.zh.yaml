      - number: '4.3'
        title: 成本结构、信用风险与单位经济性基准
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的运营成本结构由三项主要支出构成：批发债务融资成本、实体网点及代理现场运营成本、信用损失拨备。针对小微企业贷款，历史定价显示，平均 $1,000 的贷款金额对应约 25%
              的年利率。名义定价虽带来较高的贷款组合收益率，但埃及高通胀、较高的央行基准利率和网点人员成本都在挤压真实利润。公司的单位经济性存在一个关键尽调缺口：管理层曾公开声称金融科技业务维持健康的非履约贷款（NPL）比率，却持续拒绝公布明确的
              NPL 百分比、逾期 vintage 曲线或信用回收损失率。面对竞争和利润优化，公司还关闭了传统网约车业务，把运营和工程资本重新投向高收益放贷及商业服务。
            claimRefs:
              - CI003
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI009
      - number: '4.4'
        title: 资本充足性、证券化架构与 EGX IPO 路径
        blocks:
          - type: paragraph
            body: >-
              维持超过 $1.7b 的贷款总额，需要复杂且持续补充的资本结构。MNT-Halan 与区域领先金融机构合作，建立表外证券化引擎，为资产负债表扩张融资。公司通过放贷子公司 Tasaheel，与 Commercial
              International Bank（CIB）完成多次证券化债券发行，包括两笔早期合计 $140m 的分层资产，以及第七笔筹资 EGP 3.4b（$71.4m）的证券化。2026 年 6 月，Al Ahly
              Capital 领投的投资轮完成首轮交割，母集团股权估值达到 $1.4b；Al Ahly Capital 是 National Bank of Egypt 的投资部门。集团目前正推动埃及运营实体 MNT Tech
              Holding for Financial Investments 在埃及证券交易所 IPO，股票代码为 HALN.CA。为支撑上市，CIB 签署基石承诺，认购最高 EGP 2b
              的股权，为公司的本土资本充足性提供机构背书。
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: 财务结论、放贷风险与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断看，MNT-Halan 已具备真实的后期商业规模，累计放款达到 1780 亿埃及镑（超过 $160
              亿），并在埃及非银行金融服务行业占据主导位置。但仅凭公开披露，无法验证其盈利质量和可持续性。公司面临货币错配和宏观经济风险：收入绝大部分以埃及镑计价，而国际机构股权和债务轮融资以美元定价。母公司拓展土耳其、巴基斯坦和阿联酋，也带来跨境执行复杂性，但公司没有公开分部利润。在潜在投资者取得经审计的合并
              IFRS 财务报表、产品层面的违约 vintage 曲线和证券化债务契约明细前，对 MNT-Halan 长期股本回报的投资判断仍受重大信息不对称限制。
