        - 低
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: 建议汇总表
    columns:
      - 指标 / 维度
      - 评估
      - 关键证据与驱动因素
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 规模已在 4 个市场得到验证，但信贷质量和单位利润率仍未披露。
        - 在取得经审计、经过核实的贷款 cohort 表现前，暂缓主要投资承诺。
      - - 信心
        - 中等
        - 多个独立来源共同印证 2026 年 6 月估值上调至 $1.4B 及银行支持。
        - 足以确认资本里程碑，但不足以评估投资回报。
      - - 风险评级
        - 高
        - 对埃及、土耳其和巴基斯坦的外汇波动有较高宏观经济敞口。
        - 要求交易结构纳入严格的下行情景压力测试和货币对冲机制。
      - - 估值立场
        - 合理
        - 若贷款增长保持，$1.4B 估值对应的历史收入倍数合理。
        - 若净息差和信贷损失稳定，估值有吸引力；若 NPL 飙升，则显得昂贵。
    notes: 评估综合了 2026 年 6 月 $1.4B 融资轮条款、历史 3.4x 收入倍数基线及区域新兴市场风险溢价。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV013
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 论点
      - 证据基础
      - 哪些变化会改变判断
    rows:
      - - 投资论点
        - 在服务不足的新兴市场占据主导地位，并拥有自研核心技术。
        - 已发放贷款超过 $15.5B，拥有 1,200+ 家分支机构，专有 Neuron 平台覆盖 4 个国家。
        - 活跃用户增长放缓，或被本土数字贷款机构夺走市场份额。
      - - 投资论点
        - 主要银行持股带来机构层面的验证。
        - National Bank of Egypt 子公司 Al Ahly Capital 领投 2026 年 6 月融资轮。
        - 银行与金融科技合作受到监管限制，或治理陷入僵局。
      - - 反方论点
        - 信贷透明度严重不足，且未公开披露 cohort 损失。
        - 活跃 $1.7B 贷款组合的 NPL 比率和净核销额均未披露。
        - 经审计的多年 cohort 逾期披露确认 NPL 低于 5%。
      - - 反方论点
        - 新兴市场外汇敞口及跨境执行风险。
        - 埃及高通胀，加上近期在土耳其和巴基斯坦进行的非有机收购。
        - 证明来自阿联酋的硬通货收入已实现多元化，或对冲成功。
    notes: 各支柱将 MNT-Halan 已验证的运营规模与持续存在的报告和宏观经济披露缺口进行对照。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与财务假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 贷款总组合扩大至 $2.5B 以上；阿联酋业务规模化；NPL 保持可控。
        - 通过开罗本地上市或区域双重上市实现 $2.0B - $2.5B 退出估值；IRR >25%。
        - 上市时间表延迟、监管收费上限或区域宏观冲击。
        - 中等（融资轮第二次交割顺利完成并获得国际资本）。
      - - 基准情景
        - 埃及贷款发放稳步增长；土耳其和巴基斯坦贡献适中。
        - 估值 $1.4B - $1.7B；依靠持续发行证券化债务实现 12-16% IRR。
        - 本币贬值侵蚀以美元计价的回报；债务融资成本上升。
        - 高（符合历史表现及近期 Al Ahly Capital 融资轮条款）。
      - - 悲观情景
        - 通胀冲击后消费者违约激增；证券化市场冻结。
        - 估值下调至 $0.7B - $1.0B；初级股权档位资本受损。
        - 无抵押贷款组合信贷损失高企，清算优先权形成悬置风险。
        - 低至中（既有线下催收体系和银行支持可部分缓冲）。
    notes: 假设从 2026 年 6 月 $1.4B 投后入场估值基线起持有 3 年。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 MNT-Halan 从成立、合并小额信贷业务，到成为独角兽、拓展区域业务及计划 IPO 的演进。
    approximationNotes: null
    data:
      items:
        - date: '2018'
          label: 成立与生态起步
          detail: Halan 成立为数字钱包和出行平台；MNT Investments 在埃及运营小额信贷平台。
          tone: neutral
        - date: 2021-06
          label: 央行数字钱包牌照
          detail: MNT-Halan 获得央行向私人非银行运营商发放的首张移动数字钱包牌照。
          tone: positive
        - date: 2021-08
          label: 业务合并与 $120M 成长轮
          detail: MNT 与 Halan 完成换股合并；从 DPI、Apis Partners 和 Lorax Capital Partners 筹集 $120M。
          tone: positive
        - date: 2022-06
          label: B2B 电商收购（Talabeyah）
          detail: 收购 FMCG 供应链平台 Talabeyah，将商户杂货订购接入借贷网络。
          tone: positive
        - date: 2023-01
          label: $400M 融资助力公司成为独角兽
          detail: Chimera 领投 $260M 股权融资，CIB 提供 $140M 证券化融资；估值达到 $1B，成为埃及首家金融科技独角兽。
          tone: positive
        - date: 2023-10
          label: 第七次证券化债券发行
          detail: 完成 EGP 3.4 billion（$71.4M）证券化债券发行，扩大非银行信贷额度。
          tone: neutral
        - date: '2024'
          label: 巴基斯坦、土耳其和阿联酋的国际扩张
          detail: 进入阿联酋数字借贷市场，同时在土耳其运营中小企业保理业务，并在巴基斯坦运营持牌小额信贷银行。
          tone: positive
        - date: 2026-06
          label: Al Ahly Capital 领投的 $1.4B 估值轮
          detail: National Bank of Egypt 投资部门领投股权融资轮，将估值提升至 $1.4B。
          tone: positive
        - date: 2026-10
          label: 宣布在 EGX 发行 20% 股份 IPO
          detail: 宣布计划在埃及交易所发行 320M 股普通股（已发行股本的 20%）。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO009
      - CO010
      - CO012
