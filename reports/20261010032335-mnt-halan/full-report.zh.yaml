              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP014
              - CP015
      - number: '3.3'
        title: 分销能力、转换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              新兴市场金融科技的护城河，根本取决于实体现金存取渠道、监管保护和商户整合锁定。MNT-Halan
              拥有覆盖小额金融、nano-lending、消费金融的完整非银行金融机构牌照体系，以及首个获央行批准的独立电子钱包。这些牌照为新兴科技创业公司设置了很高的监管进入壁垒。公司还关闭网约车业务，将资本完全投向高收益金融服务，消除了资本稀释型运营。借助
              Tasaheel 放贷网点和收购的 B2B 商业渠道，MNT-Halan 把社区小杂货店转化为自有代理银行节点。借款人的转换成本还受到 MNT-Halan 自研 Neuron
              技术栈中累积信用记录的强化，使其难以从彼此割裂的非正式放贷人或新兴应用获得同等额度。
            claimRefs:
              - CP001
              - CP005
              - CP009
              - CP010
              - CP011
