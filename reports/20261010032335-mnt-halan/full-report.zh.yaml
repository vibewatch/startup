        title: 展品
        blocks:
          - type: callout
            title: 专有核心软件与第三方技术栈独立性
            body: >-
              MNT-Halan 将 Neuron 打造成专有分布式核心银行引擎，避免了新兴市场数字放贷机构常见的高额账户软件许可费和供应商锁定。系统自主性使公司无需依赖核心银行供应商，即可快速部署工资预支、BNPL
              等多产品放贷能力。
            calloutType: insight
            claimRefs:
              - CE003
              - CE006
          - type: callout
            title: 算法承做不透明与开发者信号缺失
            body: >-
              MNT-Halan 没有公开开发者 API、代码库或从业者文档，也缺乏对信用评分算法的独立技术验证。由于没有发布按算法 vintage
              划分的损失率指标，机构投资者无法评估模型抵御货币冲击和通胀导致的信用恶化的稳健性。
            calloutType: risk
            claimRefs:
              - CE007
              - CE014
              - CE015
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与人口特征
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 面向埃及结构性银行服务不足的市场：超过 1 亿人口中，历史上超过 70% 无法获得正规金融机构服务。公司将客户基础分为三类主要运营群体：大众消费借款人、零售分期购物者和小微企业。大众消费者使用
              Halan 数字现金钱包支付公用事业账单、点对点转账，并获得上限 2,000 埃及镑的即时 nano-loan，以应对紧急流动性需求。零售消费者通过广泛商户网络获得 POS Buy Now Pay
              Later（BNPL），购买电子产品和家电。面向非正式小微企业、小店主和轻型物流运营商，MNT-Halan 提供最高 200,000 埃及镑的营运资金小额金融贷款。平台还通过工资放贷服务企业雇主，使员工可提取最高
              80% 的工资预支，并自动扣款、风险更低。跨境扩张进一步将人口覆盖延伸至土耳其 SME 保理、巴基斯坦小额金融银行和阿联酋数字工资预支。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: 采用轨迹与活跃度指标
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 于 2018 年最初是一款两轮和三轮车网约车应用，随后客户快速增长，逐步转型为多元金融科技超级应用。早期披露显示，2021 年公司拥有 4m 名埃及客户，其中包括 3.1m 名金融客户和
              1.8m 名活跃借款人，月活跃用户约 1m。到 2026 年年中，运营市场累计服务客户超过 8m，移动应用下载量超过 10m。平台报告数字生态季度活跃客户超过 2.3m，说明除一次性注册外仍有大量持续使用。
              交易规模方面，累计发放贷款从 2021 年的 $1.7b 增加至 2026 年年中的超过 $15.5b 至 $16b。但尽调分析指出，这些亮眼 headline 数字代表累计终身量，而非当前资产负债表敞口；
              MNT-Halan 没有披露月活跃用户留存曲线或活跃与休眠账户比例。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: 企业部署与机构关系
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 依靠机构合作、银行整合和零售分销关系推动商业客户扩张。2026 年 9 月，埃及最大私营银行 Commercial International
              Bank（CIB）作出基石机构承诺，签署投资协议，拟投入最高 EGP 2b（$37.34m）购买 MNT-Halan 计划中的埃及证券交易所（EGX）IPO 预计 2.7% 的股权。这项承诺将 15
              年的运营银行关系正式化，为公司提供债务工具和结算通道。在商户分销端，MNT-Halan 连接超过 4,000 家零售伙伴，使用其 BNPL 结账基础设施销售消费品和电子产品。在国际市场，公司收购土耳其 Tam
              Finans Faktoring A.S.，提供 SME 贸易发票融资；并收购 Advans Pakistan Microfinance Bank
              Ltd.，运营受监管存款账户和小额贷款，展现其在高波动新兴经济体中的地域多元化。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: 客户旅程、持久性与信贷集中
        blocks:
          - type: paragraph
            body: >-
              客户生命周期从下载数字应用和完成电子 KYC 验证开始，用户可激活由埃及央行许可的数字钱包，用于日常交易。客户通常先通过高频账单支付和小额 nano-loan 建立初始信用画像，然后升级到多月 BNPL
              分期购买和最高 200,000 埃及镑的小微企业营运资金贷款。这种 land-and-expand
              旅程推动客户生命周期价值，但以放贷为重的商业模式也带来显著的信贷组合和融资集中风险。公司在埃及非银行小额金融领域占据 24.3% 的市场份额，在非银行消费金融领域占
              14%。维持该贷款组合需要持续通过证券化债券发行循环资产负债表，例如 2026 年 4 月完成的 22.14 亿埃及镑消费金融证券化。由于贷款表现直接决定机构对证券化的需求和融资成本，缺少公开披露的
              vintage 损失曲线、30+/90+ 日逾期率和客户重复借款 cohort，对股权投资者而言是关键盲点。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU013
              - CU014
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 埃及非银行金融服务的市场领先地位
            body: >-
              MNT-Halan 在埃及银行服务不足市场占据领先位置，公司报告其非银行小额金融份额为 24.3%，非银行消费金融份额为 14%。平台累计客户超过 800 万、季度活跃用户 230 万，历史累计放款超过 $155
              亿，已展现显著的客户获取速度和数字分销规模。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU013
          - type: callout
            title: 重放贷商业模式与信用质量盲点
            body: >-
              不同于轻资产金融科技平台，MNT-Halan 的扩张依赖证券化和银行融资持续为贷款组合提供资金。在高通胀、货币贬值的新兴市场环境下，公司没有公开披露 vintage 逾期率、30+/90+
              日非履约贷款（NPL）数据或客户 cohort 的重复借款留存，因此在计划 IPO 前，资产组合信用风险仍是未解决的尽调事项。
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、牌照与跨境合规脆弱性
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 是一体化非银行金融机构（NBFI）和数字放贷生态，接受埃及央行（CBE）、金融监管局（FRA）的严格监督，同时受巴基斯坦银行监管机构及土耳其、阿联酋商业登记机构监管。在埃及，CBE 授予
              MNT-Halan 首张私人非银行数字钱包牌照后，在更新后的尽调指令下，监管部门已加强对电子
              KYC（eKYC）合规和反洗钱（AML）控制的审查。跨多个法律司法辖区运营带来显著的跨境合规摩擦，尤其是跨境电汇和数字钱包交易面临严格监控阈值。此外，扩大小额金融和 nano-lending
              业务，使集团面临不断变化的消费者保护要求及监管上限，这些规则旨在遏制低收入借款人的掠夺性放贷和过度负债。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营韧性、可扩展性与数字基础设施障碍
        blocks:
          - type: paragraph
            body: >-
              集团运营架构以 Neuron 核心银行和决策引擎为中心，将专有数字基础设施与覆盖埃及 25 个省、超过 1,200 个分销点的庞大实体网络结合。随着数字采用量接近 250
              万季度活跃用户，而实体网点仍持续发起高触达小额金融贷款，这种混合模式带来很高的执行复杂度。基础设施限制、数字素养缺口和潜在交易延迟，都是半城市和农村地区的重要运营瓶颈。要避免运营中断迅速侵蚀区域平台上的商户和消费者信任，公司必须确保数字钱包持续可用、处理高量移动
              POS 支付，并维持严格的反欺诈网络安全防护。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR011
              - CR013
              - CR015
      - number: '7.3'
        title: 批发融资、证券化依赖与商业银行关系
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 高度依赖批发机构融资和结构化证券化渠道，为贷款组合提供资金并维持资本充足性。公司并非主要依靠零售存款为贷款提供资金，而是将应收款转入多 tranche 证券化债券，由 Commercial
              International Bank（CIB）、National Bank of Egypt（NBE）、Abu Dhabi Commercial Bank 和 Al Ahli Bank of Kuwait
              等商业银行伙伴安排发行。Al Ahly Capital Holding 和 Chimera Investments
              等机构的股权投资强化了市场对资产负债表的信心，但任何宏观信贷紧缩、主权债务波动或机构流动性枯竭，都可能限制证券化吸收能力。批发债务出售若中断，贷款将被迫回到资产负债表，推高资本成本并压缩贷款发起量。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 信贷承做、货币贬值与宏观敏感性
        blocks:
          - type: paragraph
            body: >-
              服务超过 800 万名无银行账户及银行服务不足的个人和小微企业，意味着资产组合风险天然集中于对宏观冲击、国内通胀和外汇贬值高度敏感的人群。埃及镑兑美元经历严重贬值，推高 SME
              借款人的进口设备成本，压低家庭实际可支配收入。管理层据称历史违约率较低：小额金融低于 1.5%，消费信贷为 3.5% 至 4.0%；但信贷快速扩张、nano-loan 和 BNPL
              商户安排加大借款人过度加杠杆的风险。由于合并层面的 vintage 违约曲线、损失拨备和契约指标大多仍属私有，信用质量意外恶化会成为打破投资论点的主要风险。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 资产负债表出售脆弱性
            body: >-
              MNT-Halan
              的贷款组合扩张根本依赖循环证券化计划，以释放资产负债表容量。公司获得埃及本土银行数百万美元级证券化债券分层资产的支持，说明机构支持稳固；但这一金融架构也使公司严重依赖资本市场流动性。任何银行业系统性收缩或利率急升，都将直接威胁贷款发起的连续性。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR013
          - type: callout
            title: 无银行账户人群的双刃剑
            body: >-
              触达埃及各省的无银行账户借款人和小微企业，为 MNT-Halan
              带来庞大、尚未充分服务的可触达市场及有吸引力的收益率。但这些人群缺乏正规征信历史和抵押品缓冲，因此借款人偿债能力极易受到宏观货币贬值、食品价格通胀和国内紧缩措施影响。
            calloutType: insight
            claimRefs:
              - CR003
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 凭借覆盖全国的线下分销网络和自研技术，展现出非凡的新兴市场金融科技增长画像，但也承受显著的结构性和宏观风险。支持投资论点的一面是，MNT-Halan
              已建立起难以撼动、覆盖多国的数字银行与借贷生态：在埃及、土耳其、巴基斯坦和阿联酋累计放贷超过 $15.5B 至 $16B，累计服务客户超过 800 万至 1,000 万 [CV002, CV004]。其超过
              1,200 个分销点与自研 Neuron 核心银行平台结合，在服务不足的市场对纯数字竞争者筑起较高进入壁垒 [CV004, CV007]。此外，埃及最大商业银行旗下投资平台 Al Ahly Capital
              的股权支持，也带来了宝贵的本土机构根基和资产负债表协同 [CV003, CV006]。反方论点则集中在核心信贷基本面的不透明和货币脆弱性上。尽管总贷款资产已超过 $1.7B [CV004]，MNT-Halan
              尚未公开披露经审计的不良贷款率、净核销额或合并损失准备金 [CV008,
              CV013]。历史收入有很大一部分集中在埃及，使平台持续暴露于埃镑贬值和通胀风险；近期在土耳其和巴基斯坦的跨境收购，又增加了复杂的整合和外汇转移障碍 [CV002, CV010, CV014]。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的资本结构由成长股权和结构化本币债务工具混合而成。2023 年 1 月，集团获得最高 $400M 的综合资本，包括由 Chimera Investments 牵头的 $260M 股权融资（以
              $200M 获得 20% 股权），以及依靠 Tasaheel 发行的 $140M 证券化债券，确立了其最初 $1.0B 投后独角兽地位 [CV001, CV008, CV011]。2026 年 6 月，公司完成由
              Al Ahly Capital 牵头的新一轮投资的首次交割，账面投后估值提升 40% 至 $1.4B [CV002, CV005, CV006]。这次一级市场估值上调显示机构在新兴市场流动性紧张期间仍保持信心
              [CV009]，但首次交割的财务条款和确切现金所得未披露 [CV010, CV012]。MNT-Halan
              高度依赖债务证券化项目来支持贷款扩张，意味着股东权益排在大量优先债务之后；因此必须严格分析资本表中的清算优先权和分配顺位 [CV008, CV015]。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV013
      - number: '8.3'
        title: 情景分析、估值倍数与退出尽调
        blocks:
          - type: paragraph
            body: >-
              以 $1.4B 企业估值评估 MNT-Halan，需要将其历史估值倍数与国际新兴市场金融科技同业及 Fawry 等上市可比公司对照。2023 年公司估值为 $1.0B，披露的 2022 年收入超过
              $300M，对应约 3.3x 至 3.4x 的滚动收入倍数 [CV001]。如果收入增长至 $450M 或更高，$1.4B 估值对应的入场倍数颇具吸引力；但若宏观通胀导致资产组合质量恶化，该估值就显得偏高
              [CV001, CV002, CV013]。情景模型呈现宽幅结果：乐观情景假设区域扩张顺利，并在开罗或国际市场上市 [CV002, CV007]；基准情景是国内信贷稳步增长，但证券化融资成本和汇率摩擦会压低增速
              [CV008, CV010]；悲观情景则假设资产质量恶化，并因未对冲的新兴市场外汇敞口导致倍数压缩 [CV013,
              CV014]。因此，在合并口径的客户群损失和资本表优先权完成经审计披露前，我们的投资立场是继续研究，信心中等、风险评级高 [CV013, CV015]。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资判断：$1.4B 估值下继续研究
            body: >-
              MNT-Halan 通过拓展土耳其、巴基斯坦和阿联酋市场，并与埃及最大银行合作，支撑了相对于 $1.4B 的 40%
              估值溢价；但在经审计的不良贷款数据和完整资本表优先权条款得到核实前，潜在投资者仍应维持“继续研究”的判断。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV013
              - CV015
          - type: callout
            title: 证券化杠杆与资本顺位压力
            body: MNT-Halan 的融资模式高度依赖通过借贷子公司反复发行的证券化债券分批融资。一旦宏观经济恶化，或通胀突然推高贷款违约，优先级债券持有人将优先主张底层应收款，股权投资者面临放大的下行风险。
            calloutType: risk
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
