      - number: '4.2'
        title: 分销网络、GTM 动作与获客经济性
        blocks:
          - type: paragraph
            body: >-
              公司 GTM 策略把数字移动获客与实体网点结合起来，回应埃及以现金为主、银行服务不足的人口结构。MNT-Halan 不只依赖付费数字营销，而是在埃及 25 个省运营超过 1,200
              个实体分销点。实体存在建立了本地信任，支持线下身份核验和文件收集，也为无银行账户的小微创业者提供现金存取。为进一步提高获客效率，公司收购 B2B 电商平台
              Talabeyah，把社区杂货商和商户转为分布式银行代理，为周边客流中介服务。数字端则是，Halan 移动应用累计下载超过 1000 万，季度活跃用户超过 250
              万。这套混合基础设施构成自有分销护城河，相较纯数字区域竞争者压低了获客成本。
            claimRefs:
              - CI006
              - CI007
              - CI008
