              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现机制与生态流转
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 已建立以技术驱动放贷、支付和商户商业为核心的多元金融收入模式。不同于纯软件金融科技公司或单一产品支付处理商，MNT-Halan
              通过消费者和企业工作流中的多种连接机制，将客户参与变现。主要收入来自小额金融贷款（最高 200,000 埃及镑）、数字 nano-loan（最高 2,000 埃及镑）及最高达到月收入 80%
              的工资预支所产生的利息和管理费。同时，公司通过覆盖超过 4,000 个供应商伙伴的 BNPL
              网络，收取商户折扣率（MDR）和分期手续费，并从账单支付和数字钱包转账中获得交易交换费。客户活动会自然带动贷款量：通过平台商业业务采购批发消费品的杂货商会使用营运资金贷款，在线上应用交易的零售消费者则会转为持续使用分期贷款。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
