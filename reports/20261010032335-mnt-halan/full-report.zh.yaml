      - number: '5.2'
        title: 核心银行架构、Neuron 引擎与技术栈
        blocks:
          - type: paragraph
            body: >-
              支撑 MNT-Halan 多国运营的核心技术基础设施是 Neuron。这是一套自研的专有分布式核心银行软件，旨在替代传统第三方金融后端。Neuron 采用 API-first
              分布式架构，统一数字客户开户、交易记账、多币种处理和实时账簿平衡，覆盖放贷、支付、电商和供应链金融等不同业务单元。据公司披露，Neuron
              将机器学习用于运营工作流，计算自动化信贷承做分数、预测借款人违约概率、利用替代行为数据为借款人分组，并优化续贷率。分布式多数据中心部署维持系统可用性，在保持高正常运行时间的同时，确保各运营司法辖区的数据驻留合规。在阿联酋等国际市场，MNT-Halan
              将 Neuron 接入外部开放银行聚合商，尤其是 Lean Technologies，提取银行账单、余额历史和交易分类，为缺乏正规征信记录的外籍及银行服务不足借款人进行信用评估。
            claimRefs:
              - CE003
