  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Argument
      - Evidence Base
      - What Would Change the View
    rows:
      - - Investment Thesis
        - Dominant market leadership in underserved emerging markets with proprietary core tech.
        - Over $15.5B disbursed, 1,200+ branches, proprietary Neuron platform across 4 countries.
        - Deceleration in active user growth or market share loss to domestic digital lenders.
      - - Investment Thesis
        - Institutional validation through major bank equity ownership.
        - Al Ahly Capital (National Bank of Egypt subsidiary) led June 2026 funding round.
        - Regulatory restrictions on bank-fintech partnerships or governance deadlock.
      - - Anti-Thesis
        - Severe credit opacity and absence of public cohort loss reporting.
        - Non-performing loan ratios and net write-offs withheld across active $1.7B loan book.
        - Audited multi-year cohort delinquency disclosures confirming sub-5% NPL rates.
      - - Anti-Thesis
        - Emerging-market foreign exchange exposure and cross-border execution risk.
        - High inflation in Egypt, plus recent inorganic acquisitions in Turkey and Pakistan.
        - Demonstrated hard-currency earnings diversification from UAE or successful hedging.
    notes: >-
      Pillars contrast MNT-Halan's verified operating scale against persistent reporting and macroeconomic disclosure
      gaps.
