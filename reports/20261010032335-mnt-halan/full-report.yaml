  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Gross loan portfolio expands past $2.5B; UAE operations scale; NPLs remain managed.
        - $2.0B - $2.5B exit valuation via domestic Cairo or regional dual listing; >25% IRR.
        - Delayed public listing timeline, regulatory fee caps, or regional macro shocks.
        - Moderate (second closing of round closes successfully with international capital).
      - - Base Case
        - Steady loan disbursement growth in Egypt; moderate contribution from Turkey and Pakistan.
        - $1.4B - $1.7B valuation; 12-16% IRR supported by consistent securitized debt issuance.
        - Local currency devaluation eroding USD-denominated returns; rising debt funding costs.
        - High (aligned with historical performance and recent Al Ahly Capital round terms).
      - - Bear Case
        - Spike in consumer defaults following inflation shocks; securitization market freezes.
        - $0.7B - $1.0B valuation down-round; capital impairment for junior equity tranches.
        - High credit losses in unsecured lending book, liquidation preference overhang.
        - Low-to-Moderate (mitigated by established physical collection and bank sponsorship).
    notes: Scenario returns assume 3-year holding period from June 2026 $1.4B post-money entry valuation baseline.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
