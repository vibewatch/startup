chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Digital Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Founded in 2018 and headquartered in Cairo and Giza, Egypt, MNT-Halan operates as the preeminent digital
              lending and payments ecosystem serving financially excluded and underserved populations. The enterprise
              emerged from a strategic combination and share-swap agreement between digital super-app Halan, established
              to provide electronic wallets and payment services, and MNT Investments, a microlending operation
              established in Egypt. By integrating proprietary core financial software with physical distribution
              points, MNT-Halan provides microfinance loans, payroll advances, buy-now-pay-later arrangements, consumer
              installment credit, and merchant point-of-sale services. Cumulative lifetime credit disbursements exceed
              $16 billion across more than 8 million served customers, with approximately 1.9 million active borrowers
              and clients maintaining an aggregate gross loan book of 46.7 billion Egyptian pounds as of mid-2026.
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
