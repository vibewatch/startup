callouts:
  - calloutType: "risk"
    title: "Balance-Sheet Offloading Vulnerability"
    body: "MNT-Halan's loan portfolio expansion relies fundamentally on revolving securitization programs to free up balance-sheet capacity. While securing multi-million dollar securitized bond tranches demonstrates robust institutional backing from domestic Egyptian banks, this financial architecture creates an acute dependency on capital market liquidity. Any systemic banking sector retrenchment or sharp interest rate escalation would directly threaten origination continuity."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR013"
  - calloutType: "insight"
    title: "The Double-Edged Sword of Unbanked Demographics"
    body: "Reaching unbanked and micro-enterprise borrowers across Egypt's governorates provides MNT-Halan with a massive, underserved total addressable market and attractive yields. However, this demographic lacks formal credit bureau histories and collateral cushions, making borrower repayment capacity exceptionally vulnerable to macroeconomic currency devaluations, food price inflation, and domestic austerity measures."
    claimRefs:
      - "CR003"
      - "CR014"
      - "CR015"
