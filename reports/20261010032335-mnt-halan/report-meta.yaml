companyProfile:
  summary: >-
    MNT-Halan is an Egypt-based lending-led fintech super app founded in 2018 and headquartered in Cairo/Giza that
    combines microfinance, consumer installment credit, digital wallets, merchant commerce, salary advances, and SME
    factoring across Egypt, Turkey, Pakistan, and the UAE. The business has scaled to more than 8 million cumulative
    customers and more than $16 billion in cumulative loans disbursed, while retaining a roughly 1.9 million active
    customer base and a EGP 46.7 billion gross loan book.
  foundedDate: '2018-01-01'
