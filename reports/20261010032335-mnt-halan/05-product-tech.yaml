        - Fast turnaround vs commercial banks; field collection costs remain high
      - - SME Lending & Factoring
        - Small-to-medium enterprises in Egypt and Türkiye
        - Invoice financing, factoring, and trade receivable advances
        - Growth / Expansion
        - Operates in Egypt and Türkiye; asset-backed default data unavailable
      - - Salary Advances & Payroll Loans
        - Corporate employees in Egypt and UAE
        - Earned wage access and payroll-deducted salary lending
        - Growth / Active rollout
        - Low credit risk via payroll deduction; requires enterprise HR integration
      - - Halan E-Commerce Marketplace
        - App users purchasing retail products
        - Online catalog for electronics, appliances, and FMCG goods
        - Growth / Synergistic
        - Tied to consumer BNPL; logistics dependent on local courier fleets
