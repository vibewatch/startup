  - id: TE002
    title: Core User Workflow and Problem-Solution Transformation
    columns:
      - User Persona & Need
      - Legacy Workflow & Friction
      - MNT-Halan Digital Solution
      - Measurable Efficiency Gain
      - Residual Technical Limitation
    rows:
      - - Informal Micro-Entrepreneur
        - Physical bank applications requiring collateral and weeks of processing
        - Digital microloan origination via Halan app with fast algorithmic credit check
        - Disbursement compressed from weeks to hours or days
        - Repayment collection still largely reliant on physical agent cash network
      - - Unbanked Retail Consumer
        - Cash-only merchant purchases, cash bill payments with long queues
        - In-app utility payments, digital wallet transfers, and instant nano-loans
        - Frictionless electronic settlement eliminating transport and queuing time
        - Dependent on smartphone internet connectivity and local wallet network
      - - E-Commerce Shopper
        - Inability to purchase durable goods without commercial credit cards
        - Point-of-sale installment credit (BNPL) at partner checkout
        - Immediate approval decision enabling high-ticket purchases
        - Risk of consumer overindebtedness without cross-fintech bureau reporting
      - - Expatriate Worker (UAE)
        - Excluded from bank loans due to lack of local credit bureau history
        - Open banking aggregation via Lean Technologies paired with Neuron AI scoring
        - Fast credit evaluation using real-time bank statement analytics
        - Dependent on stability of third-party open-banking APIs and bank connections
      - - Commercial SME Supplier
        - 60-to-90 day payment terms from buyers causing working capital shortages
        - Receivable factoring and trade financing via MNT factoring arm
        - Immediate liquidity through purchase of vetted trade invoices
        - Manual invoice validation and cross-border commercial legal risk
    notes: "Workflow comparison illustrates user transitions from cash-based mechanisms to MNT-Halan digital platform; efficiency figures reflect operational structures."
    claimRefs:
      - CE002
      - CE004
      - CE008
      - CE010
      - CE013
  - id: TE003
    title: Technology Architecture and Operating Infrastructure
    columns:
      - Architectural Layer
      - Component / System
      - Role & Implementation Mechanism
      - Upstream Dependency
      - Key Technical & Diligence Risk
    rows:
      - - User Interaction
        - Halan Native Mobile Apps
        - iOS and Android client applications for consumers and merchant POS
        - Apple App Store & Google Play
        - Low-bandwidth degradation and local mobile device compatibility
      - - External Integration
        - Open Banking API Gateway
        - Account aggregation and identity data ingestion via Lean Technologies
        - Lean Technologies APIs & regional banks
        - Latency or service interruption in third-party open banking endpoints
      - - Core Banking
        - Neuron Core Banking Engine
        - Proprietary distributed transaction ledger, balance management, and multi-currency
        - Multi-datacenter cloud hosting
        - In-house maintenance overhead without independent software certification
      - - Analytics & Intelligence
        - Neuron AI Scoring Engine
        - Behavioral clustering, default prediction, and automated credit decisioning
        - Internal customer transaction data
        - Lack of public algorithmic validation and bias mitigation audits
      - - Physical Distribution
        - Branch & Merchant Network
        - Cash-in/cash-out agent points, merchant terminals, and local branches
        - Local telecoms & physical retail partners
        - High cash-handling friction, theft risk, and manual reconciliation errors
      - - Security & Data Protection
        - Jurisdiction Compliance Layer
        - Multi-datacenter isolation and data residency enforcement across jurisdictions
        - Regional data center facilities
        - Compliance overhead across differing Egyptian FRA, UAE, and Pakistan regulations
    notes: "Architecture components based on Neuron release specifications and corporate disclosures; proprietary source code and architecture diagrams remain private."
