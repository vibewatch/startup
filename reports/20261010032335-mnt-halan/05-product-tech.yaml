        - label: Physical Settlement & Agent Operations Network
          detail: Nationwide physical agent cash-in/cash-out distribution network for unbanked and informal cash transactions.
          modules:
            - Agent Cash-In & Cash-Out Network
            - Merchant Field Collection Points
            - Physical Branch Terminals & Asset Financing Points
