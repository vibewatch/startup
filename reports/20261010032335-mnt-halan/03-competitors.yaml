    title: "Co-Opting the Incumbent: The Al Ahly Commercial Bank Alliance"
    body: "Rather than engaging in destructive deposit competition with Egypt's largest commercial banks, MNT-Halan positioned itself as their high-yield distribution engine. By bringing Al Ahly Capital in as an equity co-owner in 2026, MNT-Halan converted its primary regulatory and funding threat into an institutional partner, securing subsidized liquidity while leaving legacy banks to capture wholesale lending yield without having to build last-mile microfinance infrastructure."
