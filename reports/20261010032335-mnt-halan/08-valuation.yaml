      - "CV006"
      - "CV008"
      - "CV010"
      - "CV013"
      - "CV015"
  - calloutType: "risk"
    title: "Securitization Leverage and Capital Seniority Overhang"
    body: "MNT-Halan's funding model relies heavily on repeated tranches of securitized bonds issued through its lending subsidiaries. In the event of macroeconomic distress or sudden inflation-driven loan defaults, senior bondholders have priority claims over underlying receivables, exposing equity investors to magnified downside."
    claimRefs:
      - "CV008"
      - "CV013"
      - "CV014"
      - "CV015"
