callouts:
  - calloutType: "recommendation"
    title: "Underwriting Stance: Research-More at $1.4B Mark"
    body: "While MNT-Halan has earned its 40% valuation premium to $1.4 billion by expanding into Turkey, Pakistan, and the UAE while partnering with Egypt's largest bank, prospective investors must treat the current stance as research-more until audited non-performing loan data and full cap-table preference terms are verified."
