evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited consolidated financial statements, annual income statement, and net interest margin disclosures for recent
      fiscal years.
    whyItMatters: >-
      Without audited financial statements, reported revenue multiples and operational profitability cannot be
      independently verified prior to public listing.
    diligencePath: >-
      Review the forthcoming IPO prospectus filed with the Egyptian Financial Regulatory Authority (FRA) or request
      audited consolidated financials under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-governance
    missingEvidence: >-
      Comprehensive roster of C-suite officers and independent board of directors members beyond co-founders and major
      PE representatives.
    whyItMatters: >-
      Key-person dependence on founder-CEO Mounir Nakhla is acute unless a seasoned bench of independent executive
      leadership is established.
    diligencePath: >-
      Inspect the corporate governance chapter of the pending IPO offering circular for complete board and officer
      biographies.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: capital-structure
    missingEvidence: >-
      Detailed capitalization table including exact equity ownership percentages, preference share terms, and debt
      covenants across securitization tranches.
    whyItMatters: >-
      Understanding shareholder dilution, liquidation preferences, and debt service obligations is essential to evaluate
      equity downside protection.
    diligencePath: >-
      Request the pre-IPO shareholder register and bond indenture covenants from lead placement agents or company legal
      counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: addressable-sizing
    missingEvidence: >-
      Audited segment-level credit performance disclosures breaking down non-performing loans by micro vs consumer vs
      SME products.
    whyItMatters: >-
      Reported default rates (1.5% microfinance, 3.5-4% consumer) are company-claimed figures from press interviews
      rather than audited regulatory filings.
    diligencePath: >-
      Review prospectus and statutory regulatory filings from Egyptian Financial Regulatory Authority (FRA) during EGX
      IPO bookbuilding.
  - type: conflicting-data
    severity: minor
    topic: customer-segmentation
    missingEvidence: >-
      Reconciliation between reported 10 million total registered customers, 2.5 million quarterly active users, and 1.9
      million active borrowers.
    whyItMatters: >-
      Activity definitions vary widely across quarterly active, monthly active, and cumulative wallet downloads,
      obscuring true recurring wallet engagement.
    diligencePath: >-
      Request cohort-level retention, monthly transacting user (MTU) counts, and wallet churn metrics from company
      management.
  - type: missing-source
    severity: material
    topic: merchant-multi-homing-rates
    missingEvidence: Audited merchant churn data and multi-homing terminal penetration across shared MNT-Halan and Fawry retail points.
    whyItMatters: >-
      Directly determines the stickiness of MNT-Halan's merchant agent network and vulnerability to competitive POS
      terminal displacement.
    diligencePath: >-
      Request merchant cohort retention reports, POS transaction activity distributions, and exclusive agent penetration
      figures during commercial diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-financial-disclosures
    missingEvidence: >-
      Audited consolidated IFRS financial statements detailing net income, loan loss provisions, net interest margin,
      and geographical revenue splits across Egypt, Turkey, Pakistan, and UAE.
    whyItMatters: >-
      Without audited consolidated statements and NPL vintage loss curves, underwriting long-term equity returns and
      assessing credit default exposure remains speculative.
    diligencePath: >-
      Obtain the draft EGX IPO prospectus (HALN.CA) offering memorandum and three years of audited consolidated
      financial statements through EFG Hermes and Citi underwriters.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: underwriting-opacity
    missingEvidence: >-
      Audited backtesting statistics, Gini coefficients, default predictive accuracy curves, and vintage loss matrices
      for Neuron's machine-learning credit engine.
    whyItMatters: >-
      Without independent verification of automated underwriting efficacy, credit loss volatility cannot be isolated
      from broader macroeconomic deterioration.
    diligencePath: >-
      Request private underwriting documentation, risk committee audit reports, and vintage-by-vintage loss curves under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer platform, API technical specifications, and system status dashboards reflecting real-time service
      uptime.
    whyItMatters: Prevents technical evaluation of platform integration latency, SLA compliance, and external software reliability.
    diligencePath: >-
      Request architectural architecture runbooks, system SLA metrics, and partner API integration documentation from
      MNT-Halan's engineering team.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: cybersecurity-certification
    missingEvidence: >-
      Third-party cybersecurity and compliance audit reports, including ISO/IEC 27001 certificates, SOC 2 Type II
      reports, and PCI-DSS compliance attestations.
    whyItMatters: >-
      Uncertainty regarding customer financial data segregation, encryption key governance, and vulnerability mitigation
      across distributed cloud nodes.
    diligencePath: >-
      Review external auditor attestation letters and penetration test summaries during confirmatory technical
      diligence.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: missing-source
    severity: material
    topic: credit-quality-and-cohort-retention
    missingEvidence: >-
      Audited loan vintage performance, 30+/90+ day non-performing loan (NPL) rates, and customer cohort
      repeat-borrowing retention rates across microfinance and consumer lending.
    whyItMatters: >-
