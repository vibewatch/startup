callouts:
  - calloutType: "insight"
    title: "Commercial Bank Alignment Strengthens Regulatory Moat"
    body: "Al Ahly Capital's equity investment marks the first direct ownership stake by Egypt's largest state-owned commercial banking group in an independent fintech. This alignment materially mitigates domestic licensing and regulatory friction while expanding deposit and debt warehousing syndication channels."
    claimRefs:
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Multi-Jurisdictional Complexity and Transparency Deficits"
    body: "While geographic expansion across Turkey, Pakistan, and the UAE broadens top-line addressable market size, managing disparate central bank regulations, localized credit underwriting, and currency depreciation strains operational controls ahead of an IPO without published audited financials."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"

