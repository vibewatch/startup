    {
      "id": "drivers-and-constraints",
      "title": "Drivers, constraints, and adoption timing",
      "body": "The adoption case rests on labor scarcity, flexible manufacturing, quality yield, and the shift from fixed automation to software-defined physical AI. Interact, Mordor, and Deloitte all identify labor, flexibility, and ROI pressure as drivers, while NVIDIA’s foundation-model announcements show why buyers may expect robots to learn and generalize faster. The constraints are equally material. Cobots slowed in 2023 and 2024, manufacturing capex remains cyclical, integration still determines payback, and ISO safety requirements shape cell design. In China, price erosion may support unit adoption but weaken supplier revenue. For a China-linked adaptive-robot vendor, US-China technology controls and procurement risk are an external diligence item, especially where AI, semiconductors, and sensitive manufacturing overlap. Adoption should therefore be modeled as staged pilots with measurable ROI gates, not immediate broad replacement of traditional arms.",
