  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Flexiv’s market is best framed as adaptive, force-controlled industrial automation inside the broader industrial robot and cobot markets. Public evidence supports strong China, electronics, EV battery, surface-finishing, and physical-AI drivers, but public sources do not support a precise Flexiv SOM, and 2023-2024 cobot weakness, China price erosion, integration complexity, and US-China procurement risk should temper underwriting."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and substitutes",
      "body": "Flexiv should be underwritten as an adaptive industrial automation company, not as a claim on every industrial robot or humanoid robot dollar. The relevant spend is concentrated in force-controlled, contact-rich workcells where a standard six-axis arm, fixture-heavy automation, or a human operator struggles with variability. That includes compliant assembly, surface finishing, inspection, polishing, delicate electronics insertion, battery-pack handling, and lab-like manipulation. Broad industrial robot data from IFR and Precedence Research is still useful because it shows automation penetration and factory demand, but it is too broad for TAM. Humanoid and robot-foundation-model activity is an adjacency: it raises budget attention for physical AI but can also compete for executive mindshare. The status quo substitutes are incumbent robot arms plus integrators, manual labor, custom fixtures, SCARA or delta robots in electronics, and emerging humanoid pilots.",
