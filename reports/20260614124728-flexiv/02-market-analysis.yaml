    {
      "id": "sizing-lenses",
      "title": "Sizing lenses and range discipline",
      "body": "The market is large enough to matter but not clean enough for a single TAM number. IFR’s World Robotics 2025 data shows 542,000 industrial robot installations in 2024, while China alone contributed 295,000 installations and more than two million operating factory robots. That is the automation backdrop. The directly relevant cobot estimates are smaller and dispersed: MarketsandMarkets reports USD 1.42 billion in 2025, Mordor reports USD 1.9 billion in 2025 and USD 2.28 billion in 2026, and Grand View Research gives a higher lens. Interact adds an operating view: shipments hit a trough in 2024, rebound in 2025, and may reach about 125,000 units by 2029, but revenue is pressured by China-led ASP erosion. Therefore the best diligence stance is low/base/high market sizing plus explicit caveats rather than a headline TAM.",
      "claimRefs": [
