company:
  name: Flexiv Ltd.
chapter:
  number: 7
  title: Risks
  summary: >-
    Flexiv’s residual risk is high: no reviewed public source establishes a current company-specific sanction,
    recall, or adjudicated Flexiv litigation, but U.S.-China regulatory exposure, China data rules, cobot
    price pressure, safety obligations, supply-chain fragility, and opaque customer concentration can transmit
    quickly into capital access and valuation. The chapter recommends price-sensitive underwriting with
    counsel-led regulatory diligence, customer-concentration disclosure, safety evidence, and hard
    thesis-break triggers.
sections:
  - id: ranked-risk-profile-and-scenarios
    title: Ranked risk profile and downside scenarios
    body: >-
      Flexiv’s risk profile is dominated by coupled geopolitical, market, and execution risks rather than by a
      single known company-specific enforcement action. The highest-severity scenario is a U.S.-China
      decoupling shock: a CFIUS mitigation order, outbound-investment legal constraint, Entity List concern,
      or Section 1260H adjacency forces Flexiv to ring-fence U.S. IP, data, investors, and customers from
      China-linked operations. That would slow enterprise sales, complicate financing, and compress valuation
      even if no product defect exists. The second scenario is a China cobot price war: domestic suppliers
      reset buyer expectations while Universal Robots, FANUC, and KUKA defend premium accounts through channel
      depth. Flexiv’s force-sensing and embodied-AI positioning gives differentiation, but public sources do
      not disclose gross margin, top-customer concentration, or recurring service economics. I therefore rate
      residual risk high: not a kill today, but a price-sensitive diligence item with hard triggers.
    claimRefs:
      - CR001
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR029
      - CR030
      - CR038
      - CR039
      - CR043
    tableRefs:
      - TR006
    figureRefs:
      - FR001
      - FR002
  - id: regulatory-legal-and-data-exposure
    title: Regulatory, legal, data-transfer, and IP exposure
    body: >-
      The regulatory risk register should be read as event-driven. The reviewed sources establish the rules
      and enforcement pathways, not a present Flexiv designation. Treasury’s outbound-investment program and
      final rule matter because future U.S. investors must analyze China-related AI and semiconductor exposure
      before participating. CFIUS matters if governance, IP rights, U.S. customer data, or facilities create
      sensitive access concerns. BIS Entity List and DoD Section 1260H exposure matter because robotics and AI
      can become policy targets quickly; an adverse listing would be a valuation event even before revenue
      loss is quantified. In China, CAC cross-border-data provisions and PIPL create telemetry,
      remote-service, and customer-data compliance obligations. Legal diligence remains incomplete:
      CourtListener and PACER are search paths, but counsel should run affiliate-level searches and IP
      reviews, including lessons from Universal Robots litigation references, Franka Emika distress, and
      trade-secret cases.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
