  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: >-
        Top customer list, geography mix, China revenue share, contract terms, renewal rates, and customer
        pipeline conversion.
      whyItMatters: >-
        Concentration determines whether geopolitical and China demand shocks are existential or merely
        manageable.
      diligencePath: >-
        Request top-20 customer schedule, revenue by country, backlog, churn, and renewal analysis from
        management.
      relatedQuestionRefs:
        - QR017
        - QR027
        - QR029
    - type: private-evidence-only
      severity: material
      topic: safety and quality
      missingEvidence: >-
        Safety certifications, ISO risk assessments, incident logs, insurance claims, recalls, warranty
        reserves, and field uptime.
      whyItMatters: >-
        Robotics safety incidents can create litigation and recall exposure disproportionate to current
        revenue.
      diligencePath: >-
        Review quality management system, deployment safety files, insurance policies, and customer incident
        reports.
      relatedQuestionRefs:
        - QR010
        - QR011
      relatedTableRefs:
        - TR002
    - type: missing-source
      severity: material
      topic: regulatory legal register
      missingEvidence: >-
        Counsel memo covering Flexiv affiliates against BIS, OFAC, 1260H, CFIUS, outbound investment,
        CAC/PIPL, and China court records.
      whyItMatters: >-
        The public-source register is not a legal opinion and cannot clear investor participation or customer
        procurement risk.
      diligencePath: Commission U.S. and China counsel to run affiliate-name screening and produce a dated memorandum.
      relatedQuestionRefs:
        - QR001
        - QR003
        - QR004
        - QR008
        - QR024
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: supply chain
      missingEvidence: >-
        Bill of materials, sole-source components, lead times, export classifications, second-source status,
        and supplier quality history.
      whyItMatters: Precision motion components directly affect delivery timing, gross margin, and reliability.
      diligencePath: >-
        Request BOM risk register and supplier contracts for harmonic drives, encoders, force sensors,
        compute, and grippers.
      relatedQuestionRefs:
        - QR012
        - QR019
    - type: conflicting-data
      severity: minor
      topic: founder/co-founder change
      missingEvidence: Definitive board-approved leadership history and any founder separation or dispute documents.
      whyItMatters: The prompt flags a possible leadership change, but retained public sources did not verify it.
      diligencePath: >-
        Ask management and counsel for officer history, founder employment agreements, board minutes, and
        litigation/arbitration disclosures.
      relatedQuestionRefs:
        - QR018
        - QR029
