  - id: operations-safety-supply-chain-and-customer-concentration
    title: Operations, safety, supply chain, and customer concentration
    body: >-
      Operational risk is significant because adaptive robots move from controlled demos into customer
      facilities where safety, uptime, training, and support quality decide renewal. OSHA and ISO sources make
      clear that industrial robotics is a safety-critical domain; for Flexiv, force control reduces some risks
      but does not remove the need for risk assessments, guarding decisions, logs, and incident response.
      Supply-chain exposure is also non-trivial. Harmonic drives, encoders, force sensors, compute modules,
      and grippers affect precision, delivery lead times, calibration, and service economics. The public
      record does not disclose Flexiv’s top customers, geography mix, China revenue share, warranty claims, or
      safety incident history. That missing data is material because China-heavy deployments could make
      policy, price pressure, or localized demand shocks look like product-market weakness.
    claimRefs:
      - CR013
      - CR014
      - CR023
      - CR026
      - CR027
      - CR031
      - CR040
      - CR041
      - CR045
      - CR048
    tableRefs:
      - TR002
      - TR003
    figureRefs:
      - FR004
  - id: people-funding-and-governance-risks
    title: People, funding, governance, and leadership dependency
    body: >-
      Flexiv’s recent financing reduces near-term survival risk, but it does not eliminate funding or
      governance risk. The 2026 Business Wire announcement quotes Shiquan Wang as co-founder and CEO and
      frames the round around global sales, service build-out, and technical development. That makes Wang a
      visible strategy carrier and therefore a key-person dependency until the company demonstrates deeper
      public bench strength, succession planning, and board alignment. The prompt flagged a possible founder
      or co-founder change; the public sources retained here did not verify it, so this chapter treats it as a
      diligence ask rather than a fact. Financing risk remains because the announcement did not disclose
      valuation, revenue, margins, or runway, while broader robotics funding sources show investor attention
      rotating toward humanoids, physical AI, and commercialization proof.
    claimRefs:
      - CR021
      - CR022
      - CR024
      - CR025
      - CR036
      - CR037
      - CR042
      - CR047
    tableRefs:
      - TR004
  - id: mitigations-monitoring-and-thesis-break-triggers
    title: Mitigations, monitoring indicators, and thesis-break triggers
    body: >-
      Mitigation should be underwritten as a condition of investment, not as a management talking point. The
      first workstream is legal: export-control, CFIUS, outbound-investment, CAC/PIPL, sanctions, and
      affiliate litigation memos should be completed before any U.S. investor commits. The second is operating
      diligence: collect safety certifications, incident logs, product-liability insurance, top-customer
      concentration, geography mix, bill-of-materials exposure, component second sources, warranty history,
      and deployment economics. The third is strategic monitoring: track whether humanoid funding and China
      cobot pricing pull customers away from adaptive-robot use cases. A confirmed sanctions listing, forced
      U.S.-China separation, serious injury or recall, founder litigation, down-round bridge, or inability to
      disclose customer concentration should trigger valuation reset or walk-away discipline.
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR044
      - CR045
      - CR046
      - CR047
