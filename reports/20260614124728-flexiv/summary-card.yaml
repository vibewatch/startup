  topStrengths:
    - >-
      Genuine technical differentiation in industrial-grade force control with a Stanford Robotics & AI Lab pedigree,
      backed by a multi-generation Rizon product family in commercial deployment.
    - >-
      Validated demand in contact-rich industrial tasks (polishing, assembly, surface treatment) where traditional
      position-controlled arms underperform, with reference deployments at large Chinese EV-battery, automotive, and
      electronics OEMs.
    - >-
      Established, recurring access to capital from a broad investor base spanning Chinese strategic LPs (Meituan, New
      Hope, Gaorong) and a 2026 strategic round from US/EU evergreen investor Invus, giving multi-year runway.
    - >-
      Expanding software/AI layer (Noematrix Brain, Orion controller, MICO platform) that lengthens product lifecycle
      revenue beyond one-shot hardware sales and supports a humanoid/embodied-AI narrative.
  topRisks:
    - >-
      Geopolitical risk: US HQ with majority China-based R&D and revenue exposes Flexiv to US outbound-investment rules,
      CFIUS-style scrutiny, BIS export controls, and potential 1260H / Entity List escalation against Chinese robotics.
    - >-
      Valuation is largely third-party-reported; without audited revenue or ARR, the implied multiple on a $1B
      post-money is opaque and could be stretched relative to listed cobot comps (Doosan Robotics, Teradyne / Universal
      Robots segment, Quanta / Techman).
    - >-
      Competitive squeeze from above (Universal Robots, FANUC, ABB, KUKA scale) and below (Chinese cobot price
      competitors AUBO, JAKA, Elite, Rokae), plus narrative displacement by humanoid-robot funding (Figure AI, 1X,
      Apptronik, Physical Intelligence).
    - >-
      Customer-concentration risk in Chinese EV-battery and electronics capex cycles (CATL, BOE-tier accounts) at a time
      of softening Chinese industrial automation orders and Western reshoring.
    - >-
      Disclosure opacity: headcount, revenue, customer count, and even round membership lists rely on private databases
      and conflict across sources, making true diligence dependent on primary access.
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, and burn (no public datapoint located).
    - Verified headcount and geographic split of staff between US, China, and EU offices.
    - Definitive Series C investor list and post-money cap-table mechanics (preferences, ratchets, secondary).
    - >-
      Customer concentration: share of revenue from top-3 / top-10 customers, and stability of CATL, BOE, and
      automotive-OEM relationships.
    - >-
      Exposure to US outbound-investment final rule (effective Jan 2025), CFIUS history, and any current export-license
      blockers on US-China robotics technology transfer.
    - >-
      Independent benchmark of Rizon force-control accuracy and cycle-time vs Universal Robots e-Series, FANUC CRX, KUKA
      LBR iiwa, Franka FR3.
