summary:
  headline: >-
    Flexiv is a credible Stanford-pedigreed adaptive-robotics franchise with a differentiated force-control stack and
    unicorn financing, but private disclosure and US-China geopolitics keep the valuation hard to defend.
  overallScore: 6.2
  recommendation: research-more
