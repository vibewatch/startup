company:
  name: Flexiv Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: Flexiv is a founder-led adaptive-robotics company with well-supported 2016 origins, force-control product positioning, and fresh 2026 financing evidence. The main diligence caveat is private-company opacity around valuation, revenue, customer count, headcount, and governance.
sections:
- id: identity-and-positioning
  title: Identity, origin, and operating footprint
  body: 'Flexiv Ltd. should be treated in this report as a private adaptive-robotics company whose public identity is anchored by Flexiv-branded official sites and third-party market profiles, not by public-company filings. The company describes its core product category as human-inspired adaptive robots that fuse industrial force control with artificial intelligence, which makes the one-line business description more specific than generic collaborative robotics. The most durable history point is the 2016 Santa Clara founding claim, corroborated by Flexiv''s about page and repeated in its 2026 financing materials. Its footprint is cross-border: official sources list Silicon Valley and several Asian and European offices, while third-party profiles variously emphasize Shanghai, Santa Clara, or broader China operations. For diligence, later chapters should use the official footprint as company-claimed and verify legal entity, tax residence, export-control exposure, and contracting entity in
    primary documents.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, founder-market fit, and governance visibility
  body: 'The public leadership story is founder-led. Business Wire and Flexiv identify Shiquan Wang as founder and CEO, and Flexiv''s own about page ties the core team to Stanford''s Robotics and AI Lab, supporting a credible founder-market-fit narrative for force-controlled robotics. That evidence is useful but incomplete: accessible sources reviewed for this chapter did not provide a full board, observer, executive staff, or governance committee roster. The right diligence posture is therefore to separate strong founder evidence from weak governance transparency. The key-person question is material because Flexiv''s differentiation is framed around specialized robotics research and embodied-AI know-how; if that know-how remains concentrated in the founder or a small technical group, execution risk is higher than a surface funding history suggests.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
- id: capitalization-and-investor-map
  title: Capitalization, valuation signals, and stakeholder map
  body: Flexiv has credible evidence of late-stage financing momentum, but not a filing-grade capitalization picture. The strongest current event is the March 2026 strategic investment led by Invus, described by Flexiv, Business Wire, RoboticsTomorrow, Robotics & Automation News, and MarketScreener. Independent databases also report large cumulative funding and valuation signals, including an often-cited roughly $322 million total raised and unicorn-level valuation, but those figures are not audited in the public record reviewed here. Earlier investor names such as Meituan, New Hope Group, Gaorong, GSR, Longwood, Plug and Play, and Yunfeng appear in historical funding coverage. The June 2025 Series C investor list is plausible from Tracxn and MarketScreener-style data, yet it needs primary investor confirmations before being used as a cap-table fact.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  tableRefs:
  - TO003
- id: products-and-business-model
  title: Product surface and business-model implications
  body: 'Flexiv''s product surface is best summarized as adaptive industrial robot arms and related software or end-effector systems for contact-rich automation. Official and partner product pages corroborate the Rizon adaptive arm family, including Rizon 4, while 2026 coverage adds next-generation concepts such as Enlight, Orion, MICO, and enhanced gecko-inspired grippers. The mechanism matters commercially: force sensitivity and embodied AI are positioned as enabling variable, delicate, or unstructured tasks that rigid preprogrammed robots handle poorly. That positioning implies a business model built around hardware systems, robot-control software, integration, service, and application engineering rather than pure software gross margins. It also means customer proof must be tested at the deployment level because pilots and demos can overstate repeatable automation value.'
  claimRefs:
  - CO030
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  figureRefs:
  - FO003
- id: scale-customers-and-adverse-checks
  title: Scale metrics, customer evidence, and adverse checks
  body: 'The public scale picture is intentionally conservative. Company pages and customer-case materials show application breadth, while CB Insights and other databases provide market context, but this source set does not disclose audited revenue, run-rate, verified customer count, or primary-source headcount. Customer traction is therefore supported at the sector and use-case level, not as a definitive named-customer roster. Adverse searches did not surface headline Flexiv-specific layoffs, lawsuits, sanctions, or recalls in the reviewed layoff trackers and news coverage; however, that should not be misread as a clean legal diligence conclusion. The adverse issue for chapter 1 is source quality and private-company opacity: valuation, customer count, headcount, and revenue remain dependent on databases, company-controlled case studies, or missing data-room evidence.'
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO035
  - CO037
  - CO038
  - CO039
  - CO042
  tableRefs:
  - TO004
- id: milestones-and-currentness
  title: Milestone chronology and currentness
  body: 'The chapter chronology establishes enough dated waypoints for later diligence work: 2016 founding in Santa Clara, Stanford-origin team claims, historical $100 million financing coverage, Rizon product evidence, June 2025 Series C reporting, March 2026 Invus-led strategic financing, and 2026 product-launch or ICRA-preview coverage. This timeline shows a company that remains publicly active as of the run-date search window, with both capital and product news in 2026. The caution is that milestone quality varies by source tier. Founding, positioning, and 2026 Invus-led financing have primary or high-reputation support; valuation, total raised, and some investor details rely on independent data providers; revenue, full governance, and customer count remain open. That separation should travel into later chapters rather than being flattened into a single company snapshot.'
