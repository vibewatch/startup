  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current board, observer, executive leadership, and voting-control roster.
    whyItMatters: Governance and key-person risk cannot be sized from founder evidence alone.
    diligencePath: Request cap table, board consents, officer list, and investor rights agreements from the company.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Audited or management-certified revenue, ARR, backlog, gross margin, and pipeline metrics.
    whyItMatters: Public product and funding evidence does not prove commercial scale or unit economics.
    diligencePath: Obtain data-room financial statements, customer cohort exports, and signed-order backlog.
    relatedQuestionRefs:
    - QO014
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Verified named customer list, customer count, deployment status, and revenue concentration.
    whyItMatters: Company-controlled case studies can overstate repeatability and production usage.
    diligencePath: Request customer contracts, reference calls, and deployment-level revenue by account.
    relatedQuestionRefs:
    - QO015
    - QO022
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Primary-source headcount by function and geography as of the run date.
    whyItMatters: Market databases vary and do not resolve operating scale or R&D concentration.
    diligencePath: Ask management for HRIS export by location and function, reconciled to payroll providers.
    relatedQuestionRefs:
    - QO017
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Round documents showing pre-money, post-money, liquidation preferences, secondaries, and debt.
    whyItMatters: The unicorn label and total-raised number can mislead if terms or secondaries are material.
    diligencePath: Review financing documents, investor confirmations, debt schedules, and option-pool changes.
    relatedQuestionRefs:
    - QO011
    - QO013
    - QO026
    relatedTableRefs:
    - TO003
