companyProfile:
  summary: >-
    Flexiv Ltd. is a privately held adaptive-robotics company founded in 2016
    by Stanford robotics PhD Shiquan Wang. It is headquartered in Santa Clara,
    California, with most engineering and manufacturing capacity in Shanghai,
    Beijing, and Foshan, and additional offices in Munich and Singapore. The
    company designs and sells force-controlled 7-axis robot arms (Rizon 4,
    Rizon 4s, Rizon 10) and a heavier-payload cobot (Grav), bundled with a
    Robot Development Kit (RDK) and, more recently, a robotics OS layer
    branded Noematrix Brain / MICO. Flexiv positions its products as
    "adaptive robots" that combine industrial-grade force control with
    computer vision and learning, targeting contact-rich tasks (polishing,
    grinding, assembly, testing) that traditional position-controlled arms
    handle poorly. Public reporting puts cumulative funding around USD 322M
    and a Series C post-money valuation of roughly USD 1B (June 2025), with
    a further undisclosed Invus-led strategic round closed in March 2026.
    Audited revenue, headcount, and customer counts are not disclosed.
  foundedDate: "2016-01-01"
