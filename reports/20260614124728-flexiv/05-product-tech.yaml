- id: specs-and-certification
  title: Verified Specifications, Safety Claims, and Documentation Conflicts
  body: 'The Rizon specification base is strong enough to underwrite a product diligence view but not clean enough to treat
    every figure as settled. Flexiv’s official U.S. product matrix lists all Rizon models as seven-DoF, IP65, any-orientation
    robots with ±0.05 mm ISO 9283 pose repeatability, and it gives reaches of 876, 919, 941, and 984 mm across the four variants.
    A3 corroborates the 10 kg / 941 mm Rizon 10 configuration and adds force sensing and tracking accuracy metrics. RoboDK
    and QVIRO, however, list Rizon 4 at 780 mm reach, and Sonny Robotics repeats that value while quoting a public reseller
    price. That discrepancy is probably a model-generation or regional-documentation issue, but it is still investable diligence:
    request current datasheets and certificates by serial model before relying on cell-layout or safety assumptions.'
  claimRefs:
