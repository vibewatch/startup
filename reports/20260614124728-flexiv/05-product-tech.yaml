- id: ip-and-research
  title: 'Differentiation: Force-Control IP and Stanford-Adjacent Research Signal'
  body: Flexiv’s differentiation is credible because it links product claims to patent and research artifacts. US20190061168A1
    names Shiquan Wang and Xiyang Yeh as inventors on a torque-controllable rotary actuator with an elastic element and torque
    sensor, assigned to Flexiv. A separate gripper application lists Flexiv as applicant and Shiquan Wang as co-inventor on
    high-precision pinching force sensing. Stanford Robotics Center’s Grav Enhanced demo provides partner-context evidence
    that the gripper’s gecko adhesive and force control are not just catalog copy. These artifacts do not prove a broad blocking
    patent moat or freedom to operate, and the actuator application status should be reviewed by patent counsel. They do show
    that the force-control architecture predates current marketing and reaches into actuation, sensing, and grasping—not merely
    application-layer software.
  claimRefs:
  - CE015
  - CE026
  - CE027
  - CE028
  - CE043
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: ecosystem-and-deployment
  title: Software Ecosystem, Simulation, ROS, and Deployment Workflows
  body: 'The public developer signal is stronger than typical for a private industrial-robotics company. RDK supports C++
    and Python across major operating systems; PyPI shows a recent 2.0.0 release; ROS 2 wrappers support Humble and Jazzy
    with ros2_control and MoveIt 2; and the Isaac Sim workspace explicitly uses the same controller path as real robots to
    improve force-control fidelity in simulation. Flexiv also publishes robot descriptions and a teleoperation kit. Deployment
    evidence is concentrated in contact-rich use cases: assembly, surface treatment, product testing, sanding, weld grinding,
    keyboard testing, and automotive switch calibration. That breadth matters commercially because force control is only valuable
    when it shortens integration of high-variance physical tasks. The limitation is that most deployment proof is company-authored
    and lacks independent cycle-time, scrap-rate, uptime, or payback metrics.'
  claimRefs:
