- id: architecture
  title: 'Architecture: Force-Sensitive Hardware Plus Real-Time Developer Stack'
  body: 'Flexiv’s defensible architecture is a layered control stack. At the bottom are torque- and force-sensitive robot
    joints, a mounting flange, optional Grav end-effector, and the Hesper controller. Above that, Flexiv Elements and the
    teach pendant cover low-code programming and operator workflow. RDK exposes the programmer surface, with documentation
    describing both low-level real-time and higher-level non-real-time APIs and 1 kHz sensor/control exchange. The developer
    ecosystem is not merely a brochure: GitHub hosts RDK, ROS 2, Isaac Sim, robot-description, and teleoperation repositories,
    while PyPI lists a 2026 flexivrdk package. The architecture risk is supportability rather than existence: public docs
    describe APIs and compatibility, but do not disclose commercial SLAs, long-horizon backward compatibility guarantees,
    cybersecurity posture, or how many third-party developers are active outside Flexiv’s own repositories.'
  claimRefs:
