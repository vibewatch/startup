- id: diligence-risks
  title: Product-Tech Risks and Follow-Up Diligence
  body: 'The product-tech diligence conclusion is positive but conditional. Flexiv has a plausible moat in force-controlled
    adaptive manipulation: official specs, patents, public SDKs, ROS/Isaac integrations, and contact-rich case studies all
    point in the same direction. The investment risks sit in evidence quality and operational maturity. First, model-by-model
    specs require datasheet reconciliation because third-party pages conflict on Rizon 4 reach. Second, certification claims
    should be validated by certificate number, standard, model, and geography; public sources name Intertek CE/ETL, not TÜV.
    Third, Noematrix Brain should be diligenced as an adjacent or related-party platform rather than assumed Flexiv Robotics
    product revenue. Fourth, production reliability, MTBF, support response, installed-base retention, and price realization
    are not public. These gaps are normal for private robotics companies, but they decide whether force-control novelty converts
    into repeatable deployments.'
  claimRefs:
  - CE004
  - CE010
  - CE030
  - CE031
