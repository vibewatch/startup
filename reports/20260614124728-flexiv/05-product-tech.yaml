  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: Rizon specification conflict
    missingEvidence: Current official datasheets for Rizon 4, Rizon 4S, Rizon 10, and Rizon 10S with revision dates and certificate
      cross-references.
    whyItMatters: Robot reach, payload, and force values drive cell design, comparable pricing, safety envelopes, and deployment
      economics.
    diligencePath: Request Flexiv model datasheets and reconcile them against reseller and simulator catalogs before investment
      committee.
    relatedQuestionRefs:
    - QE007
    - QE037
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: TÜV and certification scope
    missingEvidence: Model-specific CE, ETL, ISO 10218/ISO 13849, ISO/TS 15066, and any TÜV certificate numbers with issuing
      bodies.
    whyItMatters: Certification scope determines which geographies, payloads, and collaborative applications can be sold without
      additional assessment.
    diligencePath: Ask Flexiv for certificate PDFs and verify issuer databases or notified-body contacts.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: Deployment ROI and reliability
    missingEvidence: Customer-verified uptime, MTBF, cycle-time reduction, scrap-rate reduction, and payback by use case.
    whyItMatters: Force-control differentiation matters financially only if it produces repeatable deployment economics.
    diligencePath: Interview three production customers and request anonymized support-ticket and uptime cohorts.
    relatedQuestionRefs:
    - QE034
    - QE043
    relatedTableRefs:
    - TE006
  - type: missing-source
    severity: minor
    topic: Developer adoption
    missingEvidence: External developer counts, package downloads over time, issue response times, and third-party integrator
      references.
    whyItMatters: Public repos exist, but adoption outside Flexiv’s own engineering team is not quantified.
    diligencePath: Analyze GitHub history, PyPI downloads, integrator interviews, and ROS community mentions under NDA if
      available.
    relatedQuestionRefs:
    - QE036
    - QE039
  - type: missing-source
    severity: material
    topic: Noematrix commercial relationship
    missingEvidence: Ownership, licensing, customer overlap, revenue share, and product roadmap ties between Flexiv Robotics
      and Noematrix.
    whyItMatters: Noematrix may be strategically valuable but should not be counted as Flexiv product revenue without contractual
      linkage.
    diligencePath: Request cap table relationship, IP license terms, and joint customer pipeline from management.
    relatedQuestionRefs:
    - QE028
    - QE029
    - QE030
