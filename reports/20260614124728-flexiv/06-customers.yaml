- id: retention-risk
  title: Retention, Customer Health, and Risk Callouts
  body: 'Flexiv does not disclose NRR, GRR, gross churn, contract duration, annual recurring service revenue, installed-base
    utilization, or customer concentration. The public case studies emphasize project outcomes and technical feasibility,
    not renewal cohorts. That is normal for private industrial-automation suppliers, but it limits underwriting
    of durable demand. Adverse public evidence is thin: no fetched source shows a named failed deployment or churned
    customer. The negative signals are indirect but still relevant: ReviewBolt reports employee growth of -6%; SWOTAnalysis.com
    flags limited brand recognition, global scale, and a nascent ecosystem; Glassdoor access was blocked; and G2
    did not surface Flexiv-specific reviews in the fetched homepage. These are not proof of customer dissatisfaction,
    yet they frame diligence risk: deployment success may depend on service capacity, partner depth, integration
    cost, and Flexiv''s ability to convert impressive pilots into repeat multi-line production.'
  claimRefs:
  - CU029
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU041
  - CU042
