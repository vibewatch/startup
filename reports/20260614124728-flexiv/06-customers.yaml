- id: deployment-motion
  title: Deployment Motion, Partners, and Geographic Reach
  body: 'Flexiv''s sales motion appears solution-led: identify an application, run application testing, design tooling
    and workflow, integrate the robot into a station, then provide on-site troubleshooting, localized repair, spare
    parts, and software/cloud support. Partner evidence matters because adaptive robots often require fixtures,
    end-of-arm tools, safety reviews, and line-integration work. Flexiv''s partner page quotes GaiTech Shanghai
    on lab solutions, another partner on small-batch manufacturing, and a sanding partner on automotive and 3C fields.
    The 2026 financing coverage adds that Flexiv intends to expand global sales and service infrastructure, with
    North America and China already established and Europe/Asia in expansion. For diligence, this suggests China
    remains the likely center of gravity, while the US and Europe are important growth markets where partner coverage
    and service responsiveness will determine adoption quality.'
  claimRefs:
  - CU002
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU036
  - CU037
  - CU039
  - CU040
