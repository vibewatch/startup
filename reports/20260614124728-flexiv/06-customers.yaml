- id: named-proof
  title: Named Customer Proof and Use Cases
  body: 'The strongest customer proof comes from case studies where a customer is named or tightly profiled and
    a use case is tied to a production problem. NIO is the highest-quality named reference: Flexiv says two Rizon
    10 robots automate pre-delivery vehicle inspection, including charging, seats, and interior checks. EsVata is
    another named customer, using Rizon 4 for shutter sanding with an 80% faster-than-manual claim. Autolink and
    Hycan appear in CB Insights'' customer page, but Autolink lacks a fetched deployment-scale denominator and Hycan
    is not independently corroborated by the retrieved Hycan page. The remaining high-value cases are credible customer-proof
    but mostly NDA-labeled: compressor manufacturers, a new-energy vehicle company, a seafood processor, automotive
    seating supplier, and automotive supplier. That mix proves demand for force-controlled automation, but it leaves
    concentration and repeatability unresolved. The result is a customer picture with real applications but uneven
    reference quality; named deployments carry more weight than anonymous cases, and anonymous cases should be tested
    in diligence through customer calls and acceptance-test artifacts.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
