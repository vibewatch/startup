            body: >-
              没有私营公司证据前，不应敲定估值。优先级最高的问题包括经审计收入、ARR 与非经常性硬件销售的拆分、积压订单转化、按产品和服务线拆分的毛利率、质保和部署成本、客户集中度，以及 2026 年 3
              月优先股条款的精确内容。反论点不是自适应机器人没有价值，而是资本市场可能在可重复经济性可见之前，为机器人叙事付出过高价格。如果收入低于 $50M、利润率像硬件、客户大多停留在试点，或 2026
              轮条款暗示经济价格弱于标题中的 Series C 标记，投资论点就失效。反过来，若能证明 $100M 以上 run-rate 收入且增长可持续，立场会向合理估值移动。
