    机器人），用于抛光、表面处理、复杂装配、产品测试等任务。
  customerFocus: EV 电池、汽车、消费电子、半导体 / 显示、生命科学和表面处理服务领域的工业 OEM 与合同制造商；已披露部署主要集中在大中华区，同时正向欧洲和北美扩张。
  businessModel: 直接销售机器人臂和配件，并辅以软件授权（RDK / Noematrix Brain）以及与区域系统集成商的集成合作；价格按项目报价，未公开披露。
