      - number: '8.2'
        title: 融资背景与不透明度
        blocks:
          - type: paragraph
            body: >-
              最新的硬性公开融资事件，是 Flexiv 在 2026
              年宣布的一轮战略融资，公司将其表述为常青资本、研发和全球部署。这个信号偏正面，尤其是具名投资人可以带来耐心资本和国际扩张支持。但这不是估值验证事件，因为披露内容缺少规模、转股价格、清算优先权，以及本轮究竟重定价还是仅延长
              Series C 资本结构。此前公开约 $1B 的 Series C
              投后估值锚点仍可作为工作标记，但应把它当作过时的外部参考，而非当前谈判价格。任何投资备忘录在把公开标记转换为预期回报前，都应要求公司提供股权结构表、优先权堆栈和完全摊薄所有权分配瀑布。
