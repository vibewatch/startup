      - number: '2.2'
        title: 规模测算视角与区间纪律
        blocks:
          - type: paragraph
            body: >-
              市场足够大，值得关注，但不够干净，不能给出单一 TAM 数字。IFR 的 World Robotics 2025 数据显示，2024 年工业机器人安装量为 542,000 台，仅中国就贡献 295,000
              台安装量，运行中的工厂机器人超过 200 万台。这是自动化背景。更直接相关的协作机器人估算更小且分散：MarketsandMarkets 报告 2025 年为 USD 1.42 billion，Mordor 报告
              2025 年为 USD 1.9 billion、2026 年为 USD 2.28 billion，Grand View Research 给出更高视角。Interact 提供运营视角：出货量 2024
              年触底，2025 年反弹，到 2029 年可能达到约 125,000 台，但收入受中国驱动的 ASP 下滑挤压。因此，最佳尽调姿态是低 / 基准 / 高三档市场规模，加上明确限定，而不是一个醒目的 TAM 标题。
