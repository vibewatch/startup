      - number: '3.5'
        title: 定价、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              公开定价是比较中最薄弱的部分。已审阅官方页面通常披露负载、定位、安全、视觉、服务或生态广度，而不是标价、合同条款、集成成本、利用率或实际回本。这使本章更像包装比较，而不是干净的经济基准。切换成本看起来中等，而非绝对：买方一旦完成工装、安全、编程和集成商支持的认证，更换供应商并非免费；但主流协作机器人用例重叠，客户可以按应用或工厂并用多家供应商。因此，尽调应要求
              Flexiv 提供客户级 cycle-time 证明、力控失败率、服务响应、集成商认证，以及相对 UR、FANUC、ABB、KUKA、Yaskawa、Doosan、Techman 和中国厂商的赢单 /
              输单证据。这也意味着采购尽调应把集成商可得性、安全验证和备件覆盖视为经济变量，而不是后台细节，因为这些因素会决定技术更优的机械臂能否赢下一条生产单元。
