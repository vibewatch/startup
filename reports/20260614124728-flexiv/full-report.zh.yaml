          - type: paragraph
            body: >-
              Flexiv 的产品面以 Rizon 为锚点。Rizon 是一组串联七自由度自适应机械臂，Flexiv 围绕全身力敏感而不只是位置控制来定位。当前官方 Rizon 页面展示 Rizon 4、Rizon
              4S、Rizon 10 和 Rizon 10S，覆盖较轻的 4 kg 级作业到 10 kg 级搬运和更重工装。相邻硬件包括 Grav——一款力敏感夹爪，其 Enhanced 版本加入仿壁虎粘附抓取——以及
              Moonlight 力控并联机器人系列。Noematrix Brain 应放入技术相邻桶，而不是核心 Flexiv 产品清单：公开投资人和媒体来源把 Noematrix 描述为 Flexiv 孵化、2023
              年末成立的独立 embodied-intelligence 公司。尽调含义是，Flexiv 拥有一套连贯的力控硬件家族，但在没有客户证据前，embodied-AI 平台主张不应被重复计入 Flexiv
              Robotics 的直接收入。
