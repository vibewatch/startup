  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Flexiv
              应按自适应工业自动化公司承销，而不是押注每一美元工业机器人或人形机器人支出。相关支出集中在力控、接触密集的工作站：标准六轴臂、重夹具自动化或人工操作都难以处理可变性。具体包括柔顺装配、表面处理、检测、抛光、精细电子插装、电池包搬运以及实验室式操作。IFR
              和 Precedence Research 的广义工业机器人数据仍有用，因为它显示自动化渗透和工厂需求，但口径太宽，不能直接作为 TAM。人形机器人和机器人基础模型活动属于相邻领域：它会提高 physical
              AI 预算关注度，也可能争夺高管注意力。现状替代方案包括既有机械臂加集成商、人工、定制夹具、电子行业的 SCARA 或 delta 机器人，以及新兴人形机器人试点。
