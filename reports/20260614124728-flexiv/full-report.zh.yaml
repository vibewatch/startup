  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值底线
        blocks:
          - type: paragraph
            body: >-
              Flexiv 应被视为高质量但价格敏感的机器人尽调标的，而不是天然有吸引力的独角兽。公开证据支持 2026 年 3 月由 Invus
              领投的一轮融资，也支持此前公开的独角兽估值锚点，但最新一轮没有披露金额、价格或保护性条款。因此，当前估值标记不透明。投资结论应是继续研究 /
              跟踪：公司具备可信的市场时点和自适应机器人定位，但公开资料无法证明收入规模、毛利率、积压订单转化、客户集中度或优先股负担。在 $1B 估值下，承保问题很简单：Flexiv
              更接近一家有收入的协作机器人同行、拥有可持续企业部署，还是被物理 AI 叙事定价，而这一叙事近期已把人形机器人估值推到远高于商业化证明的水平？
