  - id: TV005
    title: 退出情景表
    columns:
      - 退出路径
      - 必须成立的条件
      - 估值含义
      - 主要障碍
      - 尽调路径
    rows:
      - - IPO
        - 经审计的收入规模、增长、利润率和客户多元化证明
        - 如果上市机器人倍数保持高位，可支撑数十亿美元估值
        - 公开市场投资人会惩罚不透明和亏损
        - 审阅经审计财务和董事会 IPO 准备材料
      - - 战略收购
        - Flexiv 填补差异化力控 / 自适应操作缺口
        - 协同效应若可落地，可支撑溢价
        - 自动化龙头已拥有协作机器人资产或替代方案
        - 对照 Teradyne / ABB / Siemens 产品组合梳理重叠
      - - 二级出售
        - 后期投资人或内部人士提供部分流动性
        - 大概率围绕上一轮优先股条款锚定，而非新的公开市场溢价
        - 定价不透明可能掩盖更弱经济条款
        - 索取二级出售意向和 ROFR 历史
      - - 结构化成长轮
        - 新资本带着优先权、棘轮或里程碑进入
        - 表面估值可能高估普通股价值
        - 优先权堆栈可能损害早期投资人
        - 建模清算瀑布和转换阈值
      - - 困境 / M&A 后备路径
        - 增长落空或现金需求迫使资产出售
        - 可能远低于 $1B 成交，Franka 就是提醒
        - 硬件烧钱且商业化偏弱
        - 审阅烧钱速度、资金续航和战略买家入站证据
    notes: 退出情景只能做定性判断，因为 Flexiv 尚未披露当前收入、现金消耗或 2026 年轮次条款。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV039
      - CV042
  - id: TV006
    title: Flexiv 收入倍数敏感性
    columns:
      - 年化收入假设
      - $1B 估值下的隐含倍数
      - 估值判断
      - 接受估值所需证明
    rows:
      - - $25M
        - 40.0x
        - 昂贵
        - 超常增长、积压订单和软件利润率证明
      - - $50M
        - 20.0x
        - 偏紧
        - 高增长、强毛利、低试点流失
      - - $75M
        - 13.3x
        - 从偏紧到合理
        - 客户集中度和部署经济性必须干净
      - - $100M
        - 10.0x
        - 若增长持久则合理
        - 经审计收入、积压订单转化和利润率披露
      - - $125M
        - 8.0x
        - 可能合理
        - 可复制企业需求的证据
      - - $150M
        - 6.7x
        - 可能有吸引力
        - 规模加战略退出路径
      - - $200M
        - 5.0x
        - 若利润率守住则有吸引力
        - 相比公开披露，意味着隐藏规模很强
    notes: 敏感性以公开 $1B 估值锚点为分子，以假设收入为分母，因为 Flexiv 未披露收入。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV035
      - CV044
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入规模
        - 经审计的 2024–2026 年收入、ARR / run-rate 桥、递延收入
        - 决定 $1B 是 20x、10x，还是更低
        - CFO 数据室和审计师确认
      - - 利润率
        - 按机器人、软件、服务、集成和质保准备金拆分的毛利率
        - 硬件占比高的利润率撑不起软件式倍数
        - 财务和运营访谈
      - - 积压订单质量
        - 已签积压订单、取消权、部署时间表、客户验收里程碑
        - 区分真实需求、试点和备忘录
        - 客户合同审阅
      - - 客户集中度
        - 前 10 大客户收入、续约、重复订单、行业组合
        - 集中度会改变风险和上市可比公司的适用性
        - 销售台账和客户访谈
      - - 2026 年融资条款
        - 价格、清算优先权、参与权、棘轮、转换条款
        - 表面投后估值可能高估普通股价值
        - 律师审阅融资文件
      - - 退出准备度
        - IPO 内控、战略买家入站、董事会流动性计划
        - 决定入场价能否达到目标回报
        - 董事会材料和投行访谈
    notes: 这些问题决定投资论点；若仍未解决，任何按公开估值锚点投资都应把它们作为先决条件。
    claimRefs:
      - CV035
      - CV036
      - CV039
      - CV045
