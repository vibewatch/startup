        blocks:
          - type: paragraph
            body: >-
              Flexiv 的公开客户证据指向一个专业化工业机器人客户基础，而不是广泛横向安装基数。最可支持的细分市场包括出行与汽车、电子与电气设备、通用工业压缩机制造、食品 / FMCG 加工、表面处理用户，以及前沿研究或
              embodied-AI
              实验室。买方通常是制造商、实验室或系统集成商，他们寻找接触密集任务自动化，因为刚性机器人难以胜任；用户是生产工程师、质量团队和产线操作员；付款方是工厂、工程团队或集成商支持的客户项目。公开证据支持中国和北美为核心，并明确向欧洲和亚洲扩张，但没有量化各地区收入或台数份额。CATL、BOE、Audi、Lenovo、Bosch
              和 Foxconn 在已抓取公开证据中仍是尽调线索，而非已核验具名客户；因此，除非 Flexiv、客户或合作伙伴发布佐证部署引用，本章将其视为未核验。这一框架刻意区分生产证明和 logo
              传闻：制造客户可能在技术上验证机器人，却未证明广泛企业级标准化。在 Flexiv 披露已安装机器人、付费站点、续约队列和大客户敞口前，最安全的尽调姿态是把案例研究视为采用证明，而非收入耐久性证明。
