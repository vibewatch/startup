      - number: '2.4'
        title: 驱动因素、约束与采用节奏
        blocks:
          - type: paragraph
            body: >-
              采用逻辑建立在劳动力稀缺、柔性制造、质量良率以及从固定自动化转向软件定义 physical AI 的迁移上。Interact、Mordor 和 Deloitte 都把劳动力、柔性和 ROI
              压力列为驱动，NVIDIA 的基础模型发布也解释了为什么买方可能期待机器人更快学习和泛化。约束同样关键。协作机器人在 2023 和 2024 年放缓，制造业 capex 仍有周期性，集成仍决定回本，ISO
              安全要求会塑造工作站设计。在中国，价格下滑可能支持台数采用，却削弱供应商收入。对一家与中国相关的自适应机器人厂商来说，美中技术管制和采购风险是外部尽调项，尤其在
              AI、半导体和敏感制造重叠处。采用模型因此应按分阶段试点加可衡量 ROI 闸门处理，而不是传统机械臂立刻被大范围替换。
