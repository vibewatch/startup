        blocks:
          - type: paragraph
            body: >-
              Rizon 规格基础足以支撑产品尽调观点，但还不干净到能把每个数字都当成定论。Flexiv 美国官方产品矩阵列出所有 Rizon 型号均为七自由度、IP65、任意方向安装机器人，ISO 9283 位姿重复精度
              ±0.05 mm，并给出四个型号 876、919、941、984 mm 的工作半径。A3 佐证了 10 kg / 941 mm 的 Rizon 10 配置，并补充力传感和跟踪精度指标。但 RoboDK 和
              QVIRO 将 Rizon 4 工作半径列为 780 mm，Sonny Robotics
              也重复该值并引用公开经销商价格。这个差异很可能是型号代际或区域文档问题，但仍是可投资的尽调项：在依赖工作站布局或安全假设前，应按序列型号索取最新 datasheets 和证书。
