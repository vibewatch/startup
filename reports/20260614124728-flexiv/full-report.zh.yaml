              私有估值和大额融资总额不能在没有进展数据的情况下转换成隐含收入倍数。风险在于，价格竞争、采购放缓、集成负担或退出窗口变窄，可能要求公司在盈利前继续融资。这使下行情景对定价、销售周期长度和客户验收更敏感，而不只是对融资叙事敏感。下行情景敏感于定价、销售周期长度和客户验收，而不只是制造量。
