        title: 排序后的风险画像与下行情景
        blocks:
          - type: paragraph
            body: >-
              Flexiv 的风险画像主要由相互耦合的地缘政治、市场和执行风险主导，而不是单一已知公司特定执法行动。最高严重度情景是美中脱钩冲击：CFIUS 缓解令、对外投资法律约束、Entity List 关注或
              Section 1260H 相邻性，迫使 Flexiv 将美国
              IP、数据、投资人和客户与中国相关运营隔离。这会放慢企业销售、复杂化融资，并压缩估值，即便产品本身没有缺陷。第二个情景是中国协作机器人价格战：本土供应商重设买方预期，Universal Robots、FANUC
              和 KUKA 借渠道深度防守高端客户。Flexiv 的力感知和 embodied-AI
              定位提供差异化，但公开来源没有披露毛利率、大客户集中度或经常性服务经济性。因此，我将剩余风险评为高：目前不构成否决，但属于价格敏感的尽调项，并带有硬触发条件。
