      - number: '2.3'
        title: 中国与买方细分需求
        blocks:
          - type: paragraph
            body: >-
              中国是类别动能和竞争压力最重要的地理市场。IFR 报告称，2024 年中国占全球工业机器人需求的 54%，本土厂商在中国取得多数份额。Robotics Industry Development Plan 和
              Robot Plus 行动计划的政策支持是真实驱动，因为它推动机器人密度、模型应用和更广泛的制造业部署。对 Flexiv 而言，最相关买方不是泛化工厂机器人用户，而是接触密集用户：EV
              电池和汽车产线、电子与显示装配、半导体相邻精密搬运、表面处理、通用制造、FMCG、生命科学或服务工作流。Flexiv 及合作伙伴公开证据支持这些用例，CATL
              电池自动化报道也验证新能源自动化是战略预算池。不过，除非直接确认是 Flexiv 客户，CATL 和 BOE 仍应按买方原型处理。
