              机器人，融资公告也明确把资金用途连接到量产、营销、R&D、全球销售与服务基础设施。这些需求意味着库存、质保、集成劳动力、现场支持、营运资本和制造爬坡风险。公开证据无法计算 CAC
              回收期、毛利率、硬件与服务毛利差异或部署回本。承销替代判断因此是定性的：强技术融资信号，被可能较重的硬件营运资本需求以及证明交钥匙部署能产生可重复毛利的责任抵消。在这些数字提供前，正确模型应基于情景、聚焦现金，而不是给出单一收入倍数答案。
