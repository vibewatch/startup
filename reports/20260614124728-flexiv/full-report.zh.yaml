      - number: '8.4'
        title: 情景与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              $1B 锚点对收入高度敏感。如果年化收入为 $50M，该估值就是 20x 收入；除非增长、利润率和积压订单都非常出色，否则显得昂贵。收入到 $100M 时，倍数压缩到
              10x，相对于公开市场对机器人的热情更可辩护。收入到 $150M 时，倍数约为 6.7x；如果 Flexiv 同时能证明强毛利率和重复部署，估值可能有吸引力。一个简单情景框架是：牛市情形按 $150M 收入给
              15x，基准情形按 $100M 给 10x，熊市情形按 $50M 给 5x。熊市情形重要，因为机器人硬件公司可能面临漫长部署周期、服务拖累和营运资本需求，而公开估值标题会遮住这些问题。
