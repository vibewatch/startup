              监管风险登记表应按事件驱动来读。已审阅来源建立的是规则和执法路径，不是 Flexiv 当前被指定。Treasury 对外投资项目及最终规则很重要，因为未来美国投资人参与前必须分析中国相关 AI
              和半导体敞口。若治理、IP 权利、美国客户数据或设施形成敏感访问顾虑，CFIUS 就重要。BIS Entity List 和 DoD Section 1260H 敞口也重要，因为机器人和 AI
              可能迅速成为政策目标；不利列名即便在收入损失量化前也会成为估值事件。在中国，CAC 跨境数据规定和 PIPL 带来遥测、远程服务和客户数据合规义务。法律尽调仍不完整：CourtListener 和 PACER
              是检索路径，但律师应开展关联公司层面的检索和 IP 审查，包括吸取 Universal Robots 诉讼引用、Franka Emika 困境和商业秘密案件的经验。
