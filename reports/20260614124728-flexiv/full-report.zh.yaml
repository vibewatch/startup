      - number: '7.3'
        title: 运营、安全、供应链与客户集中度
        blocks:
          - type: paragraph
            body: >-
              运营风险不低：自适应机器人一旦从受控演示走进客户工厂，续约就取决于安全、正常运行时间、培训和支持质量。OSHA 和 ISO 的资料都说明，工业机器人是安全关键领域；对 Flexiv
              而言，力控能压低一部分风险，但不能替代风险评估、防护决策、日志和事故响应。 供应链敞口也不小。谐波减速器、编码器、力传感器、计算模块和夹爪都会影响精度、交付周期、校准和服务经济性。公开资料没有披露 Flexiv
              的头部客户、地域结构、中国收入占比、质保索赔或安全事故记录。缺少这些数据很关键，因为如果部署过度集中在中国，政策、价格压力或本地需求冲击可能会被误判为产品市场匹配疲弱。
