        - 2026 年融资估值 >$5B
        - 工业人形机器人部署叙事
        - 高估值私营实体 AI 可比公司
        - 战略性工业机器人情绪
        - 是人形机器人，不是协作机器人，且估值高度依赖叙事
      - - 1X Technologies
        - 报道称 2025 / 2026 年融资讨论目标超过 $10B
        - 消费级人形机器人发布计划
        - 前瞻性私营目标估值
        - 显示市场愿意资助机器人野心
        - 引用公开来源中不是已完成估值
      - - 机器人泡沫批评
        - 无估值；反向情绪参照
        - 批评技术和商业化成熟度
        - 倍数压缩警示
        - 给私营机器人估值降温
        - 不是公司可比对象
    notes: 这是一组代表性可比对象，覆盖协作机器人、困境机器人资产，以及实体 AI / 人形机器人私募轮；指标经过四舍五入，不能直接横向比较。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative public, private-round and distressed robotics valuation references available from fetched sources
        as of 2026-06-14.
