        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              可比公司范围异常宽。Universal Robots 已经成熟，但藏在 Teradyne 体内；Doosan Robotics 是公开上市的纯机器人标的，市场预期较高；Techman
              提供了有收入的亚洲协作机器人参考；JAKA 表明中国协作机器人 IPO 路径可以在低于独角兽定价的水平打通；Franka 则说明，即使机器人技术很强，商业化或治理失灵也可能把资产拖入困境。人形机器人和物理 AI
              融资轮提供上行叙事可比，但不能机械套到 Flexiv 身上，因为这些公司部分估值来自通用劳动力替代故事。Flexiv 的自适应力控协作机器人定位处在工业自动化和物理 AI
              之间，因此合适倍数应落在经审计收入和部署质量上，而不是最激进的人形机器人私募标记。
