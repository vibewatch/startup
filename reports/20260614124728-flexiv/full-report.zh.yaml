              和重复机构投资方带来的投资人质量信号。但几乎所有能把这些优势转化为估值观点的承销输入仍是私有信息：确认收入、未交付订单、签约订单、按产品和服务拆分的毛利、现金、现金消耗、现金续航、债务、质保计提、库存、客户集中度和部署回本。买方或投资人应要求逐月现金桥、按垂直行业划分的部署队列、物料清单和服务成本历史、营运资本明细，以及从签约订单到收入的对账，然后才依赖报道的独角兽估值；尤其是因为最新融资披露了投资人质量和战略意图，但没有披露融资金额、清算优先权或由此带来的现金续航。最新融资披露了投资人质量和战略意图，但没有披露融资金额、清算优先权或由此带来的现金续航。
