companyProfile:
  summary: >-
    Flexiv Ltd. 是一家私营自适应机器人公司，2016 年由 Stanford 机器人学博士 Shiquan Wang 创立。公司总部位于 California Santa
    Clara，主要工程和制造能力在上海、北京和佛山，另在 Munich 和 Singapore 设有办公室。公司设计并销售力控 7 轴机器人臂（Rizon 4、Rizon 4s、Rizon 10）和更大负载协作臂（Grav），并捆绑
    Robot Development Kit（RDK）；近年又推出名为 Noematrix Brain / MICO 的机器人 OS 层。Flexiv
    将产品定位为「自适应机器人」：把工业级力控、计算机视觉和学习能力结合起来，瞄准抛光、打磨、装配、测试等接触密集任务，这些任务传统位置控制机械臂很难做好。公开报道显示，公司累计融资约 USD 322M，Series C 投后估值约
    USD 1B（2025 年 6 月），并在 2026 年 3 月完成一轮 Invus 领投、金额未披露的战略融资。审计收入、员工数和客户数未披露。
  foundedDate: '2016-01-01'
  founders:
    - name: Shiquan Wang
      role: 创始人兼 CEO
      background: >-
        Stanford University 机械工程 / 机器人学博士，研究方向为仿生运动和自适应控制；外界普遍将其与 Prof. Oussama Khatib 的 Stanford Robotics Lab
        学术谱系联系在一起。
