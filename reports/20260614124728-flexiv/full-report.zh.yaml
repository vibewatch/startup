            body: >-
              产品技术尽调结论是正面但有条件。Flexiv 在力控自适应操作上有合理护城河：官方规格、专利、公开 SDK、ROS/Isaac
              集成和接触密集案例都指向同一方向。投资风险位于证据质量和运营成熟度。第一，逐型号规格需要 datasheet 对账，因为第三方页面在 Rizon 4
              工作半径上冲突。第二，认证主张应按证书编号、标准、型号和地理区域验证；公开来源提到 Intertek CE/ETL，而不是 TÜV。第三，Noematrix Brain 应作为相邻或关联方平台尽调，而不是默认计入
              Flexiv Robotics 产品收入。第四，生产可靠性、MTBF、支持响应、安装基数留存和价格实现都不公开。这些缺口对私营机器人公司很常见，但它们决定力控新颖性能否转化为可重复部署。
