      - number: '7.5'
        title: 缓释措施、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              缓释措施应作为投资前提来承保，而不是管理层话术。第一条工作线是法律：任何美国投资人承诺出资前，都应完成出口管制、CFIUS、对外投资、CAC/PIPL、制裁和关联方诉讼备忘录。第二条是运营尽调：收集安全认证、事故日志、产品责任保险、头部客户集中度、地域结构、BOM
              敞口、零部件第二供应源、质保历史和部署经济性。第三条是战略监测：跟踪人形机器人融资和中国协作机器人价格是否把客户预算从自适应机器人用例中拉走。一旦确认进入制裁清单、被迫中美切分、出现严重伤害或召回、创始人诉讼、下轮折价桥接，或无法披露客户集中度，就应触发估值重置或退出纪律。
