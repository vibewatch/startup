      - number: '7.4'
        title: 人员、融资、治理与领导人依赖
        blocks:
          - type: paragraph
            body: >-
              Flexiv 近期融资降低了短期生存风险，但没有消除融资或治理风险。2026 年 Business Wire 公告称 Shiquan Wang 为联合创始人兼
              CEO，并把本轮融资用途放在全球销售、服务体系扩建和技术开发上。也就是说，Wang
              是公开可见的战略承载者；在公司证明更厚的公开管理梯队、继任安排和董事会一致性之前，关键人依赖仍然存在。提示中提到创始人或联合创始人可能发生变动；本报告保留的公开来源没有证实这一点，因此本章把它作为尽调问题，而非事实。融资风险仍在，因为公告没有披露估值、收入、利润率或
              runway；更广泛的机器人融资资料显示，投资人注意力正在转向人形机器人、物理 AI 和商业化证明。
