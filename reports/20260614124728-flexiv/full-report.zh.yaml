      - number: '8.5'
        title: 退出路径与回报约束
        blocks:
          - type: paragraph
            body: >-
              最清晰的上行路径，是 Flexiv 能以上市公司尽调深度披露收入、增长、利润率、客户集中度和积压订单质量之后 IPO。战略收购也可能发生，因为自动化巨头重视力控操作和自适应机器人；但除非 Flexiv
              能补上明确的产品组合缺口，并带来规模化客户，战略买家不会支付人形机器人式叙事倍数。如果公开市场仍然谨慎、公司又想避免披露收入，二级交易或结构化内部轮可能是近期更现实的流动性路径。回报约束在于，$1B
              入场价给普通执行风险留下的空间很小；投资人需要看到通往数十亿美元退出价值的清晰路径，或拿到重新定价且带下行保护的入口。
            claimRefs:
