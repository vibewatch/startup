              融资故事强于利润表故事。Flexiv 2020 年官方公告支持累计 $22 million 的 Series A/A+ 以及超过 $100 million 的 Series B；Tracxn 随后记录了 2022
              年一轮融资、2025 年 6 月 $100 million Series C、$322 million 累计融资和独角兽估值语境。2026 年 3 月轮次由 Flexiv 和 Business Wire 核验为
              Invus 领投，但金额未披露，因此它对现金续航有正面意义，却不能替代现金余额。公司正在多地扩张
              R&D、销售和服务基础设施，资本充足性必须用管理层现金桥判断，不能只看融资总额标题。证据也几乎没有说明清算优先权、投资人控制权，或融资款是否为一级发行资金。
