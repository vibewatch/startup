          label: 组件或安全问题
        - id: margin
          label: 毛利 / 部署经济性
        - id: valuation
          label: 估值重置
      edges:
        - from: policy
          to: capital
        - from: policy
          to: customers
        - from: data
          to: customers
        - from: capital
          to: valuation
        - from: customers
          to: valuation
        - from: price
          to: margin
        - from: supply
          to: margin
        - from: margin
          to: valuation
    approximationNotes: 边表示从引用证据推断出的方向性风险路径，而非实测因果系数。
    claimRefs:
      - CR031
      - CR046
      - CR047
      - CR048
  - id: FV001
    title: 同业估值倍数分化
    type: bar
    layout: wide
    summary: 公开与私有机器人参照横跨困境资产价值、以收入支撑的协作机器人，以及极端的人形机器人叙事估值。
    data:
      items:
        - label: Franka 困境出售
          value: 1
          unit: relative index
        - label: Techman 收入支撑
          value: 8
          unit: illustrative EV/revenue
        - label: Flexiv 收入 $150M
          value: 6.7
          unit: revenue multiple
        - label: Flexiv 收入 $100M
          value: 10
          unit: revenue multiple
        - label: Flexiv 收入 $50M
          value: 20
          unit: revenue multiple
        - label: Doosan 上市纯机器人标的
          value: 100
          unit: high public EV/revenue zone
        - label: Figure 2025 年叙事
          value: 200
          unit: narrative index
    approximationNotes: Doosan 和 Figure 的柱形经过刻意指数化 / 取整，用来呈现分化；同业收入分母的精确口径会因来源和披露质量而异。
    claimRefs:
      - CV010
      - CV015
      - CV018
      - CV024
      - CV025
      - CV026
      - CV041
  - id: FV002
    title: 特定倍数下 Flexiv 的隐含收入区间
    type: range
    layout: standard
    summary: $1B 估值下，若投资者采用 5x、10x、15x 或 20x 收入倍数，需要的收入水平会相差很大。
    data:
      items:
        - label: 20x 倍数
          low: 50
          high: 50
          unit: USD millions revenue
        - label: 15x 倍数
          low: 66.7
          high: 66.7
          unit: USD millions revenue
        - label: 10x 倍数
          low: 100
          high: 100
          unit: USD millions revenue
        - label: 8x 倍数
          low: 125
          high: 125
          unit: USD millions revenue
        - label: 5x 倍数
          low: 200
          high: 200
          unit: USD millions revenue
    approximationNotes: 收入值是代数意义上的盈亏平衡阈值：隐含收入等于 $1B 除以所选收入倍数。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV044
  - id: FV003
    title: 估值支撑与披露质量四象限
    type: quadrant
    layout: wide
    summary: 在私有财务数据验证规模之前，Flexiv 仍处于高叙事、低披露区域。
    data:
      points:
        - label: Franka 困境可比
          x: 1
          'y': 2
          quadrant: Low valuation / low growth proof
        - label: Techman Robot
          x: 6
          'y': 8
          quadrant: Revenue-grounded public comp
        - label: Doosan Robotics
          x: 8
          'y': 7
          quadrant: High valuation / public disclosure
        - label: Flexiv 公开资料
          x: 7
          'y': 3
          quadrant: High valuation / opaque disclosure
        - label: Figure AI
          x: 10
          'y': 2
          quadrant: Extreme narrative / limited public revenue
        - label: Apptronik
          x: 9
          'y': 4
          quadrant: High narrative / deployment story
        - label: 1X Technologies
          x: 9
          'y': 3
          quadrant: High narrative / launch pending
        - label: Physical Intelligence
          x: 8
          'y': 2
          quadrant: Platform option value
    approximationNotes: 坐标轴是基于公开估值支撑和公开财务披露深度推导的 1-10 定性评分，而非实测经营 KPI。
    claimRefs:
      - CV011
      - CV014
      - CV015
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV037
  - id: FV004
    title: 估值建议逻辑矩阵
    type: matrix
    layout: standard
    summary: 除非收入规模和融资条款能证明 $1B 估值在经济上公平，否则建议维持“继续研究”。
    data:
      columns:
        - 避开 / 重新定价
        - 继续尽调
        - 考虑投资
      rows:
        - label: 收入 < $50M 或试点占比高
          values:
            - 1
            - 0
            - 0
        - label: 收入接近 $100M 且增长可持续
          values:
            - 0
            - 1
            - 0
        - label: 收入 > $150M 且毛利已验证
          values:
            - 0
            - 0
            - 1
        - label: 2026 年条款保护投资者
          values:
            - 1
            - 0
            - 0
        - label: 缺少验证的人形机器人倍数
          values:
            - 1
            - 0
            - 0
        - label: 战略收购方契合度已验证
          values:
            - 0
            - 1
            - 1
    approximationNotes: 矩阵把情景阈值转成投资动作；由于缺少经审计收入，它刻意保留条件性。
    claimRefs:
      - CV031
      - CV035
      - CV036
      - CV042
      - CV043
      - CV044
