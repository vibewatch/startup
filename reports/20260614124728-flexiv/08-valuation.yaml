schemaVersion: report-v2
artifact: valuation
slug: flexiv
runDate: '2026-06-14'
company:
  name: Flexiv Ltd.
chapter:
  number: 8
  title: Valuation
  summary: Flexiv’s latest public valuation anchor is about $1 billion, but the March 2026 financing is economically opaque.
    Public market and private robotics comps support continued diligence, yet the stance is stretched unless private evidence
    verifies at least $100 million-plus annualized revenue, clean preferred terms, and durable deployment economics.
sections:
- id: valuation-bottom-line
  title: Valuation bottom line
  body: 'Flexiv should be treated as a high-quality but price-sensitive robotics diligence target, not as an automatically
    attractive unicorn. Public evidence supports a March 2026 financing led by Invus and a prior public unicorn valuation
    anchor, but the latest round did not disclose the amount, price, or protective terms. That makes the current valuation
    mark opaque. The investment conclusion is therefore research-more/track: the company has credible market timing and adaptive
    robotics positioning, yet the public file cannot prove revenue scale, gross margin, backlog conversion, customer concentration,
    or preference overhang. At a $1 billion mark, the underwriting question is simple: is Flexiv closer to a revenue-bearing
    cobot peer with durable enterprise deployments, or is it being priced by a physical-AI narrative that has recently pulled
    humanoid valuations far ahead of commercial proof?'
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV031
  - CV040
  - CV043
  tableRefs:
  - TV001
  figureRefs:
  - FV004
- id: financing-context
  title: Financing context and opacity
  body: The latest hard public financing event is a 2026 strategic round that Flexiv framed around evergreen capital, R&D,
    and global deployment. That is positive signaling, especially because named investors can help with patient capital and
    international expansion. It is not, however, a valuation validation event because the disclosure omits size, conversion
    price, liquidation preferences, and whether the round repriced or merely extended the Series C capital stack. The prior
    public anchor around a $1 billion post-money Series C remains the working mark, but it should be handled as a dated external
    reference rather than a current negotiated price. Any investment memo should require the company’s capitalization table,
    preference stack, and fully diluted ownership waterfall before translating the public mark into expected return.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV040
  - CV045
  tableRefs:
  - TV006
- id: comparable-set
  title: Comparable valuation set
  body: The comp set is unusually wide. Universal Robots is mature but hidden inside Teradyne; Doosan Robotics is a public
    pure-play with high market expectations; Techman offers a revenue-bearing Asia cobot reference; JAKA indicates that Chinese
    cobot IPO pathways can clear below unicorn pricing; and Franka shows that strong robotics technology can become a distressed
    asset when commercialization or governance fails. Humanoid and physical-AI rounds provide upside narrative comparables,
    but they are not mechanically transferable to Flexiv because those companies are being valued partly on a general-purpose
    labor-replacement story. Flexiv’s adaptive force-control cobot positioning belongs between industrial automation and physical
    AI, so the right multiple should be grounded in audited revenue and deployment quality rather than the most aggressive
    humanoid private marks.
  claimRefs:
