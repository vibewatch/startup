- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more / track
    - Market relevance is supported, but 2026 valuation terms and operating scale are undisclosed
    - Do not underwrite at the headline mark without private financials
  - - Confidence
    - Medium-low
    - Public sources corroborate rounds and comps, not Flexiv revenue or margins
    - Use diligence condition rather than definitive buy/avoid
  - - Risk rating
    - High
    - Robotics commercialization, hardware margin, and valuation-multiple risks remain material
    - Demand downside protection and milestones
  - - Valuation stance
    - Stretched on public evidence
    - A $1B mark implies 20x at $50M revenue or 10x at $100M
    - Price discipline depends on verified run-rate revenue
  - - Primary catalyst
    - Revenue transparency
    - Audited sales, backlog, and margin disclosure would resolve the biggest gap
    - Move from track to fair only if scale is proven
  notes: Assessment combines public financing evidence, peer valuation references, and explicit sensitivity math; private
    terms are unavailable.
