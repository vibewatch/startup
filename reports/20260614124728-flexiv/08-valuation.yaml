- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue scale
    - Audited 2024-2026 revenue, ARR/run-rate bridge, deferred revenue
    - Determines whether $1B is 20x, 10x, or lower
    - CFO data room and auditor confirmation
  - - Margins
    - Gross margin by robot, software, service, integration and warranty reserve
    - Hardware-heavy margins cannot support software-like multiples
    - Finance and operations interviews
  - - Backlog quality
    - Signed backlog, cancellation rights, deployment schedule, customer acceptance milestones
    - Separates real demand from pilots and memoranda
    - Customer contract review
  - - Customer concentration
    - Top-10 customer revenue, renewals, repeat orders, industry mix
    - Concentration changes risk and public-comp relevance
    - Sales ledger and customer calls
  - - 2026 financing terms
    - Price, liquidation preference, participation, ratchets, conversion terms
    - Headline post-money can overstate common-equity value
    - Counsel review of financing documents
  - - Exit readiness
    - IPO controls, strategic inbound, board liquidity plan
    - Determines whether entry can reach target return
    - Board materials and banker conversations
  notes: These asks are thesis-critical; unresolved items should remain conditions precedent for any investment at the public
    valuation anchor.
