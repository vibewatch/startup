- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - What would change the view
  rows:
  - - 'Thesis: adaptive robotics fits a large automation market'
    - IFR summaries show a large and still-growing industrial robotics base
    - Weak enterprise demand or low backlog conversion would reduce market-to-company translation
  - - 'Thesis: strategic 2026 investor signal is positive'
    - Flexiv named Invus and other institutional/industry investors in the 2026 round
    - Term sheet indicating a flat/down economic price would weaken the signal
  - - 'Thesis: public cobot comps can carry premium multiples'
    - Doosan and Techman show investor appetite for cobot exposure
    - Multiple compression in listed robotics peers would reduce exit assumptions
  - - 'Anti-thesis: headline valuation may be narrative-driven'
    - Humanoid and physical-AI comps show very high valuation dispersion
    - Verified revenue above $100M with strong margins would reduce this concern
  - - 'Anti-thesis: technology assets can clear at distressed prices'
    - Franka’s insolvency sale shows downside for robotics IP when commercialization fails
    - Evidence of high-margin recurring software/service revenue would help
  - - 'Anti-thesis: disclosure gap is material'
    - Revenue, margin, backlog, customer concentration, and round terms are not public
    - Company-provided audited KPI pack and cap table would close the gap
  notes: Rows separate company-quality arguments from price-specific concerns so the recommendation remains valuation-sensitive.
