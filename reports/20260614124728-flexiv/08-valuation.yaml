  - - Franka Emika / Franka Robotics
    - Distressed sale to Agile Robots after insolvency
    - Technology asset rather than scaled public revenue
    - Distress floor, not going-concern multiple
    - Downside and IP-value caution
    - Historical distress event, not a normal comp
  - - NEURA Robotics
    - Raised about $123M; order-book narrative
    - Reported €1B order book and rapid growth
    - Private physical-AI benchmark
    - Shows European humanoid/cognitive robotics appetite
