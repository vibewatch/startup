  - - Physical Intelligence
    - $2.4B post-money in 2024
    - General-purpose robotics AI platform, limited public revenue
    - Platform option-value comp
    - Shows AI-for-robots investor appetite
    - Software/platform risk profile differs
  - - Apptronik
    - '>$5B valuation in 2026 financing'
    - Industrial humanoid deployment narrative
    - High private physical-AI comp
    - Strategic industrial robotics sentiment
    - Humanoid, not cobot, and valuation is narrative-heavy
  - - 1X Technologies
    - Reported target above $10B in 2025/2026 fundraising discussions
    - Consumer humanoid launch plan
    - Forward-looking private target
    - Shows market willingness to fund robotics ambition
    - Not closed valuation in cited public source
  - - Robotics bubble critiques
    - No valuation; adverse sentiment reference
    - Critiques technical and commercial readiness
    - Multiple-compression warning
    - Tempers private robotics marks
    - Not a company comp
