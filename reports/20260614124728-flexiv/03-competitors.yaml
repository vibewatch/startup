- id: incumbent-cobot-benchmarks
  title: Incumbent cobot benchmarks
  body: The incumbent benchmark is formidable. Universal Robots offers the broadest dedicated cobot ecosystem signal in this
    pack, combining a wide UR/e-Series arm lineup with UR+ marketplace claims. FANUC counters with a 12-model collaborative
    portfolio from 3 kg to 50 kg payloads and durability messaging around CRX maintenance. ABB brings corporate scale, a safety-and-service
    posture, and a broad collaborative family. KUKA is especially relevant to Flexiv because LBR iiwa is explicitly positioned
    as sensitive and collaborative, not merely easy to program. Yaskawa Motoman HC and Doosan broaden the industrial and Korean
    public-company context. These peers reduce Flexiv’s ability to win on cobot category awareness alone; Flexiv has to prove
    materially better contact-rich task performance, application engineering, and deployment economics.
  claimRefs:
