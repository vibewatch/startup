  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Comparable list price, discount, integration, and service-contract data by model and region.
    whyItMatters: Without pricing, the competitive matrix cannot quantify total installed cost or payback versus Flexiv.
    diligencePath: Request quotes, distributor price books, and recent Flexiv win/loss bid packages.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-win-loss
    missingEvidence: Flexiv customer-level win/loss evidence against each named incumbent and China peer.
    whyItMatters: Public product pages show capability overlap but not whether Flexiv actually wins production deployments.
    diligencePath: Ask management for CRM exports, customer references, and integrator interviews segmented by application.
    relatedQuestionRefs:
    - QP024
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-cobots
    missingEvidence: Exhaustive active-vendor count for every regional cobot maker and every legacy Rethink Robotics product
      path.
    whyItMatters: The chapter intentionally weights material peers, but long-tail suppliers may matter in regional tenders.
    diligencePath: Run distributor-channel checks in China, Europe, and North America during commercial diligence.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
