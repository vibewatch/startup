- id: indirect-humanoid-and-ai-narrative
  title: Indirect humanoid and embodied-AI competition
  body: Humanoid and embodied-AI companies are not direct substitutes for most Flexiv workcells today, but they compete for
    the same general-purpose robotics narrative, technical labor, investor attention, and strategic-partner mindshare. Apptronik,
    Agility, Figure, 1X, and Physical Intelligence each frame a path toward more general embodied automation; Agility additionally
    claims Digit is already in production deployment, while Apptronik publishes Apollo physical specifications. That matters
    because Flexiv’s adaptive-robot message overlaps with a broader investor thesis that robots should handle variable real-world
    tasks. If capital markets or strategic customers decide humanoids are the preferred general-purpose platform, Flexiv could
    face narrative discounting even where cobot arms remain the practical near-term deployment choice.
  claimRefs:
  - CP022
  - CP030
  - CP031
  - CP032
  - CP033
  tableRefs:
  - TP003
  figureRefs: []
- id: pricing-switching-and-diligence-asks
  title: Pricing, switching costs, and moat durability
  body: 'Public pricing is the weakest part of the comparison. The reviewed official pages usually disclose payloads, positioning,
    safety, vision, services, or ecosystem breadth rather than list prices, contract terms, integration costs, utilization,
    or realized payback. That makes this chapter a packaging comparison rather than a clean economic benchmark. Switching
    costs look moderate rather than absolute: once a buyer qualifies tooling, safety, programming, and integrator support,
    changing vendors is not free, but the overlap among mainstream cobot use cases means customers can multi-home by application
    or plant. The diligence work should therefore ask Flexiv for customer-level cycle-time proof, force-control failure rates,
    service response, integrator certifications, and win/loss evidence against UR, FANUC, ABB, KUKA, Yaskawa, Doosan, Techman,
    and Chinese vendors. This also means procurement diligence should treat integrator availability, safety validation, and
    spare-parts coverage as economic variables, not back-office details, because those factors can determine whether a technically
    superior arm wins a production cell.'
  claimRefs:
  - CP034
  - CP035
  - CP037
  - CP038
  - CP040
