- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - competitive threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Adaptive force control is differentiated
    - KUKA LBR iiwa, Franka, Elite CSF, and other force-aware products narrow the gap
    - High
    - Demand head-to-head task benchmarks and failure-rate data
  - - AI vision improves automation flexibility
    - Techman and humanoid/embodied-AI vendors use the same AI narrative
    - Medium
    - Separate real deployed autonomy from demos and lab policies
  - - China footprint creates local advantage
    - AUBO, Elite, JAKA, Rokae and broader domestic share compress price/channel access
    - High
    - Review China win/loss and distributor exclusivity
  - - Incumbents lack Flexiv adaptive specialization
    - UR, FANUC, ABB, Yaskawa can bundle service, channels, and broad model ranges
    - High
    - Compare total installed cost and service SLA by application
  - - Force-control category is commercially durable
    - Franka insolvency/acquisition is a counterexample
    - Medium
    - Request customer retention, gross margin, and cash runway evidence
  - - Customers are locked in once deployed
    - Common tooling and integrators allow application-by-application multi-homing
    - Medium
    - Review repeat purchase cohorts and plant-standardization evidence
  notes: Severity is an underwriting judgment based on source-backed competitor capabilities, not a quantified probability
    model.
