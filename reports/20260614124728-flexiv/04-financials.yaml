- id: unit-economics-and-cost-structure
  title: Unit economics, cost structure, and burn inference
  body: 'The highest-probability cost structure is hardware and deployment intensive. Flexiv develops and manufactures robot
    arms, grippers, AMR platforms and delta robots, and its financing releases explicitly tie capital to mass production,
    marketing, R&D, global sales and service infrastructure. Those needs imply inventory, warranty, integration labor, field
    support, working capital and manufacturing scale-up risk. Public evidence does not allow CAC payback, gross margin, hardware-versus-service
    margin, or deployment payback to be calculated. The underwriting proxy is therefore qualitative: a strong technology-financing
    signal offset by likely hardware working-capital needs and an obligation to prove that turnkey deployments create repeatable
    gross profit. Until those figures are supplied, the right model is scenario-based and cash-focused rather than a single
    revenue-multiple answer.'
  claimRefs:
  - CI005
  - CI006
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI034
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: adverse-market-context
  title: Adverse market and follow-on financing context
  body: The adverse evidence is not company-specific distress; it is market context that should restrain valuation and margin
    assumptions. Interact Analysis reported weak collaborative-robot shipment growth in 2024, while 2026 China robotics coverage
    points to competitive pressure even as growth resumes. Separately, GlobalData reported a sharp contraction in China venture
    funding in early 2025. For Flexiv, these facts mean a $1 billion private valuation and large funding total should not
    be converted into an implied revenue multiple without traction data. The risk is that price competition, slower procurement,
    integration burden or narrower exit windows could require more capital before profitability. That makes downside cases
    more sensitive to pricing, sales-cycle length, and customer acceptance than a funding-led narrative suggests. This makes
    downside cases sensitive to pricing, sales-cycle length, and customer acceptance, not just manufacturing volume.
  claimRefs:
  - CI028
  - CI029
  - CI030
  - CI031
  - CI033
  - CI035
  - CI036
  tableRefs:
  - TI005
  figureRefs:
  - FI004
- id: diligence-verdict
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is research-more rather than underwrite-now. Flexiv has credible capital access, official evidence
    of global expansion plans, and investor-quality signals from Invus and repeat institutional backers. However, almost every
    underwriting input that would convert those strengths into a valuation view remains private: recognized revenue, backlog,
    bookings, gross margin by product and service, cash, burn, runway, debt, warranty accruals, inventory, customer concentration
    and deployment payback. A buyer or investor should request a month-by-month cash bridge, cohort of deployments by vertical,
    bill of materials and service-cost history, working-capital schedule, and a reconciliation from bookings to revenue before
    relying on the reported unicorn valuation, particularly because the most current financing disclosed investor quality
    and strategic intent but not dollars raised, liquidation preferences, or resulting runway. The most current financing
    disclosed investor quality and strategic intent but not dollars raised, liquidation preferences, or resulting runway.'
  claimRefs:
  - CI020
  - CI021
  - CI022
  - CI026
  - CI027
  - CI034
  - CI035
  - CI036
