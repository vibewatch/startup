company:
  name: Flexiv Ltd.
chapter:
  number: 4
  title: Financials
  summary: 'Flexiv’s financing evidence is much stronger than its public financial disclosure: sources support roughly $322M
    raised before an undisclosed Invus-led 2026 round, but not revenue, burn, runway, margin or debt. The underwriting stance
    is research-more because hardware/service capital intensity and adverse cobot/China VC context require management financials
    before relying on the reported unicorn valuation, particularly because the most current financing disclosed investor quality
    and strategic intent but not dollars raised, liquidation preferences, or resulting runway.'
sections:
- id: financial-disclosure-profile
  title: Disclosure profile and revenue model
  body: Flexiv’s public financial profile is materially opaque. The retained sources support a company that sells adaptive
    robot hardware and advanced turnkey automation solutions, but they do not disclose audited revenue, ARR, gross margin,
    cash, debt, or retention metrics. That distinction matters because the business appears to monetize a blend of robot systems,
    force-control and AI capability, integration, deployment, and service support rather than a clean software subscription
    stream. Official pages emphasize manufacturing adaptive robots and reducing operating cost for customers; they do not
    publish list pricing or recognized revenue. The diligence conclusion is therefore to treat product breadth and customer-use
    claims as revenue-mechanism evidence, not as proof of revenue quality. The absence of those measures is the central financial
    risk, not a minor disclosure footnote.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI006
  - CI007
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: funding-and-capital-stack
  title: Funding stack and capital adequacy
  body: The financing story is stronger than the income-statement story. Flexiv’s official 2020 release supports an accumulated
    $22 million Series A/A+ and an over-$100 million Series B; Tracxn then records a later 2022 financing, a June 2025 $100
    million Series C, $322 million total raised, and unicorn valuation context. The March 2026 round is verified by Flexiv
    and Business Wire as Invus-led but remains amount-undisclosed, which makes it runway-positive but not a cash-balance substitute.
    Because the company is scaling R&D plus sales and service infrastructure across several geographies, capital adequacy
    must be judged with a management cash bridge, not by headline raised capital alone. The evidence also says little about
    liquidation preference, investor control rights, or whether proceeds were primary capital.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
