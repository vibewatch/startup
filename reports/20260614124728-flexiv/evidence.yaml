      segment.
    whyItMatters: Without these private metrics, public cobot TAMs cannot be converted into a defensible Flexiv SOM.
    diligencePath: Request cohort-level sales, deployment, and margin data from Flexiv and reconcile to customer interviews.
    relatedQuestionRefs:
