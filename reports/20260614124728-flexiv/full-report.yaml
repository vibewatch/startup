            body: >-
              Flexiv’s product surface is anchored by Rizon, a serial seven-degree-of-freedom adaptive arm family that
              Flexiv positions around whole-body force sensitivity rather than only position control. The current
              official Rizon page presents Rizon 4, Rizon 4S, Rizon 10, and Rizon 10S, spanning lighter 4 kg-class work
              through 10 kg-class handling and heavier tooling. Adjacent hardware includes Grav, a force-sensitive
              gripper whose Enhanced version adds gecko-inspired adhesive grasping, and Moonlight, a force-controlled
              parallel robot line. Noematrix Brain belongs in the technology adjacency bucket, not the core Flexiv
              product list: public investor and press sources describe Noematrix as a separate Flexiv-incubated
              embodied-intelligence company founded in late 2023. The diligence implication is that Flexiv owns a
              coherent force-control hardware family, but the embodied-AI platform claims should not be double-counted
              as direct Flexiv Robotics revenue without customer evidence.
