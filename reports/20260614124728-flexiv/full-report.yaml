  businessModel: >-
    Direct hardware sales of robot arms and accessories, complemented by software licensing (RDK / Noematrix Brain) and
    integration partnerships with regional system integrators; pricing is quote-based and not publicly disclosed.
  stage: Private, Series C; unicorn ($1B reported post-money)
