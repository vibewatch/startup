              manufactures robot arms, grippers, AMR platforms and delta robots, and its financing releases explicitly
              tie capital to mass production, marketing, R&D, global sales and service infrastructure. Those needs imply
              inventory, warranty, integration labor, field support, working capital and manufacturing scale-up risk.
              Public evidence does not allow CAC payback, gross margin, hardware-versus-service margin, or deployment
              payback to be calculated. The underwriting proxy is therefore qualitative: a strong technology-financing
              signal offset by likely hardware working-capital needs and an obligation to prove that turnkey deployments
