      - number: '8.5'
        title: Exit paths and return constraints
        blocks:
          - type: paragraph
            body: >-
              The cleanest upside route is an IPO after Flexiv can disclose revenue, growth, margin, customer
              concentration, and backlog quality at public-company diligence depth. A strategic acquisition is also
              possible because automation incumbents care about force-controlled manipulation and adaptive robotics, but
              a strategic buyer will not pay a humanoid-style narrative multiple unless Flexiv fills a clear portfolio
              gap and comes with scaled customers. A secondary or structured insider round may be the more realistic
              near-term liquidity route if public markets remain skeptical and the company wants to avoid revealing
              revenue. The return constraint is that a $1 billion entry price leaves little room for ordinary execution
              risk; investors need either a clear path to multi-billion exit value or a repriced entry with downside
              protection.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV039
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV039
              - CV042
      - number: '8.6'
        title: Final diligence asks and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The valuation should not be finalized without private-company evidence. The highest-priority asks are
              audited revenue, ARR versus non-recurring hardware sales, backlog conversion, gross margin by product and
              service line, warranty and deployment costs, customer concentration, and the exact March 2026 preferred
              terms. The anti-thesis is not that adaptive robotics lacks value; it is that capital markets may be
              overpaying for robotics narratives before repeatable economics are visible. The thesis breaks if revenue
              is below $50 million, margins are hardware-like, customers are mostly pilots, or the 2026 round contains
              terms that imply a weaker economic price than the headline Series C mark. Conversely, proof of $100
              million-plus run-rate revenue with durable growth would move the stance toward fair.
            claimRefs:
              - CV022
              - CV023
              - CV027
              - CV035
              - CV036
              - CV042
              - CV043
              - CV044
              - CV045
