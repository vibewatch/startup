      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be underwritten as a condition of investment, not as a management talking point. The
              first workstream is legal: export-control, CFIUS, outbound-investment, CAC/PIPL, sanctions, and affiliate
              litigation memos should be completed before any U.S. investor commits. The second is operating diligence:
              collect safety certifications, incident logs, product-liability insurance, top-customer concentration,
              geography mix, bill-of-materials exposure, component second sources, warranty history, and deployment
              economics. The third is strategic monitoring: track whether humanoid funding and China cobot pricing pull
              customers away from adaptive-robot use cases. A confirmed sanctions listing, forced U.S.-China separation,
              serious injury or recall, founder litigation, down-round bridge, or inability to disclose customer
              concentration should trigger valuation reset or walk-away discipline.
