      - number: '8.3'
        title: Comparable valuation set
        blocks:
          - type: paragraph
            body: >-
              The comp set is unusually wide. Universal Robots is mature but hidden inside Teradyne; Doosan Robotics is
              a public pure-play with high market expectations; Techman offers a revenue-bearing Asia cobot reference;
              JAKA indicates that Chinese cobot IPO pathways can clear below unicorn pricing; and Franka shows that
              strong robotics technology can become a distressed asset when commercialization or governance fails.
              Humanoid and physical-AI rounds provide upside narrative comparables, but they are not mechanically
              transferable to Flexiv because those companies are being valued partly on a general-purpose
              labor-replacement story. Flexiv’s adaptive force-control cobot positioning belongs between industrial
              automation and physical AI, so the right multiple should be grounded in audited revenue and deployment
              quality rather than the most aggressive humanoid private marks.
