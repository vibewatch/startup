      - - Strategic acquisition
        - Flexiv fills a differentiated force-control/adaptive manipulation gap
        - Can justify premium if synergy is tangible
        - Automation incumbents already own cobot assets or alternatives
        - Map product overlap against Teradyne/ABB/Siemens portfolios
      - - Secondary sale
        - Late investors or insiders provide partial liquidity
        - Likely anchors around last preferred terms, not a new public premium
        - Opaque pricing can hide weaker economic terms
        - Request secondary indications and ROFR history
      - - Structured growth round
        - New capital arrives with preferences, ratchets, or milestones
        - Headline valuation may overstate common-equity value
        - Preference stack can impair earlier investors
        - Model liquidation waterfall and conversion thresholds
      - - Distressed/M&A fallback
        - Growth misses or cash need forces asset sale
        - Could clear far below $1B, as Franka cautions
        - Hardware burn and weak commercialization
        - Review burn, runway, and strategic-buyer inbound evidence
