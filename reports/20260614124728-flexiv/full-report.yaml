            body: >-
              Humanoid and embodied-AI companies are not direct substitutes for most Flexiv workcells today, but they
              compete for the same general-purpose robotics narrative, technical labor, investor attention, and
              strategic-partner mindshare. Apptronik, Agility, Figure, 1X, and Physical Intelligence each frame a path
              toward more general embodied automation; Agility additionally claims Digit is already in production
              deployment, while Apptronik publishes Apollo physical specifications. That matters because Flexiv’s
              adaptive-robot message overlaps with a broader investor thesis that robots should handle variable
              real-world tasks. If capital markets or strategic customers decide humanoids are the preferred
