              - CV005
              - CV009
              - CV011
              - CV015
              - CV022
              - CV045
          - type: table
            tableRef: TV007
            claimRefs:
              - CV035
              - CV036
              - CV039
              - CV045
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Track Flexiv and continue diligence, but do not treat the public $1B mark as validated until revenue scale
              and 2026 preferred terms are verified.
            calloutType: recommendation
            claimRefs:
