      - number: '8.4'
        title: Scenario and sensitivity analysis
        blocks:
          - type: paragraph
            body: >-
              The $1 billion anchor is highly sensitive to revenue. If annualized revenue is $50 million, the mark is
              20x revenue and looks expensive unless growth, margins, and backlog are exceptional. At $100 million, the
              mark compresses to 10x and becomes more defensible against public robotics enthusiasm. At $150 million,
              the mark is about 6.7x and may be attractive if Flexiv can also show strong gross margin and repeat
              deployments. A simple scenario frame gives a bull case at 15x on $150 million revenue, a base case at 10x
              on $100 million, and a bear case at 5x on $50 million. The bear case matters because robotics hardware
              companies can face long deployment cycles, services drag, and working-capital demands that public
              valuation headlines obscure.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
