      - number: '8.2'
        title: Financing context and opacity
        blocks:
          - type: paragraph
            body: >-
              The latest hard public financing event is a 2026 strategic round that Flexiv framed around evergreen
              capital, R&D, and global deployment. That is positive signaling, especially because named investors can
              help with patient capital and international expansion. It is not, however, a valuation validation event
              because the disclosure omits size, conversion price, liquidation preferences, and whether the round
              repriced or merely extended the Series C capital stack. The prior public anchor around a $1 billion
              post-money Series C remains the working mark, but it should be handled as a dated external reference
              rather than a current negotiated price. Any investment memo should require the company’s capitalization
              table, preference stack, and fully diluted ownership waterfall before translating the public mark into
              expected return.
            claimRefs:
              - CV001
