      - number: '2.5'
        title: Sizing and adoption diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter’s main caution is that public sources show category pull but not Flexiv-specific conversion.
              Analyst market data does not isolate adaptive force-controlled robots from low-payload commodity cobots,
              high-payload collaborative arms, integrator revenue, software, or service robots. Public customer evidence
              is also incomplete: CB Insights names Autolink and Hycan, while public Flexiv use-case pages and 2025-2026
              trade-show coverage demonstrate application fit, but fetched sources did not verify CATL or BOE as Flexiv
              customers. The underwriting questions are therefore concrete: installed base by segment, repeat deployment
              rate, realized ASP, gross margin after integration support, sales cycle by buyer type, safety approval
              cycle, and whether AI features command price premium or simply offset China price pressure. Until those
              data arrive, the market view should be positive on direction but conservative on Flexiv-specific SOM.
