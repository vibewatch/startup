  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Flexiv's public customer evidence points to a specialized industrial robotics base rather than a broad
              horizontal installed base. The most supportable segments are mobility and automotive, electronics and
              electrical equipment, general industrial compressor manufacturing, food/FMCG processing, surface-finishing
              users, and frontier research or embodied-AI labs. The buyer is typically a manufacturer, laboratory, or
              system integrator seeking automation for contact-rich work where rigid robots struggle; the users are
              production engineers, quality teams, and line operators; and the payer is the plant, engineering group, or
              integrator-backed customer project. Public evidence supports a China and North America core with explicit
              expansion into Europe and Asia, but it does not quantify revenue or unit share by region. CATL, BOE, Audi,
              Lenovo, Bosch, and Foxconn remain diligence leads rather than verified named customers in fetched public
              evidence; the chapter therefore treats them as unverified unless Flexiv, a customer, or a partner
              publishes a corroborating deployment reference. This framing deliberately separates production proof from
              logo rumor: a manufacturing customer may validate the robot technically without proving broad enterprise
              standardization. Until Flexiv discloses installed robots, paid sites, renewal cohorts, and top-account
              exposure, the safest diligence posture is to treat case studies as adoption proof and not as revenue
              durability proof.
            claimRefs:
