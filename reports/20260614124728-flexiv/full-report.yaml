      - number: '3.5'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing is the weakest part of the comparison. The reviewed official pages usually disclose
              payloads, positioning, safety, vision, services, or ecosystem breadth rather than list prices, contract
              terms, integration costs, utilization, or realized payback. That makes this chapter a packaging comparison
              rather than a clean economic benchmark. Switching costs look moderate rather than absolute: once a buyer
              qualifies tooling, safety, programming, and integrator support, changing vendors is not free, but the
              overlap among mainstream cobot use cases means customers can multi-home by application or plant. The
              diligence work should therefore ask Flexiv for customer-level cycle-time proof, force-control failure
              rates, service response, integrator certifications, and win/loss evidence against UR, FANUC, ABB, KUKA,
              Yaskawa, Doosan, Techman, and Chinese vendors. This also means procurement diligence should treat
              integrator availability, safety validation, and spare-parts coverage as economic variables, not
              back-office details, because those factors can determine whether a technically superior arm wins a
              production cell.
