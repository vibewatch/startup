              official evidence of global expansion plans, and investor-quality signals from Invus and repeat
              institutional backers. However, almost every underwriting input that would convert those strengths into a
              valuation view remains private: recognized revenue, backlog, bookings, gross margin by product and
              service, cash, burn, runway, debt, warranty accruals, inventory, customer concentration and deployment
