  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation bottom line
        blocks:
          - type: paragraph
            body: >-
              Flexiv should be treated as a high-quality but price-sensitive robotics diligence target, not as an
              automatically attractive unicorn. Public evidence supports a March 2026 financing led by Invus and a prior
              public unicorn valuation anchor, but the latest round did not disclose the amount, price, or protective
              terms. That makes the current valuation mark opaque. The investment conclusion is therefore
              research-more/track: the company has credible market timing and adaptive robotics positioning, yet the
              public file cannot prove revenue scale, gross margin, backlog conversion, customer concentration, or
              preference overhang. At a $1 billion mark, the underwriting question is simple: is Flexiv closer to a
              revenue-bearing cobot peer with durable enterprise deployments, or is it being priced by a physical-AI
              narrative that has recently pulled humanoid valuations far ahead of commercial proof?
            claimRefs:
              - CV001
