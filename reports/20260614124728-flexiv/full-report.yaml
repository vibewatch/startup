  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Disclosure profile and revenue model
        blocks:
          - type: paragraph
            body: >-
              Flexiv’s public financial profile is materially opaque. The retained sources support a company that sells
              adaptive robot hardware and advanced turnkey automation solutions, but they do not disclose audited
              revenue, ARR, gross margin, cash, debt, or retention metrics. That distinction matters because the
              business appears to monetize a blend of robot systems, force-control and AI capability, integration,
              deployment, and service support rather than a clean software subscription stream. Official pages emphasize
              manufacturing adaptive robots and reducing operating cost for customers; they do not publish list pricing
              or recognized revenue. The diligence conclusion is therefore to treat product breadth and customer-use
              claims as revenue-mechanism evidence, not as proof of revenue quality. The absence of those measures is
              the central financial risk, not a minor disclosure footnote.
