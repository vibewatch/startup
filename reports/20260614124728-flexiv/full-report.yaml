      - number: '7.3'
        title: Operations, safety, supply chain, and customer concentration
        blocks:
          - type: paragraph
            body: >-
              Operational risk is significant because adaptive robots move from controlled demos into customer
              facilities where safety, uptime, training, and support quality decide renewal. OSHA and ISO sources make
              clear that industrial robotics is a safety-critical domain; for Flexiv, force control reduces some risks
              but does not remove the need for risk assessments, guarding decisions, logs, and incident response.
              Supply-chain exposure is also non-trivial. Harmonic drives, encoders, force sensors, compute modules, and
              grippers affect precision, delivery lead times, calibration, and service economics. The public record does
              not disclose Flexiv’s top customers, geography mix, China revenue share, warranty claims, or safety
              incident history. That missing data is material because China-heavy deployments could make policy, price
              pressure, or localized demand shocks look like product-market weakness.
