  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile and downside scenarios
        blocks:
          - type: paragraph
            body: >-
              Flexiv’s risk profile is dominated by coupled geopolitical, market, and execution risks rather than by a
              single known company-specific enforcement action. The highest-severity scenario is a U.S.-China decoupling
              shock: a CFIUS mitigation order, outbound-investment legal constraint, Entity List concern, or Section
              1260H adjacency forces Flexiv to ring-fence U.S. IP, data, investors, and customers from China-linked
              operations. That would slow enterprise sales, complicate financing, and compress valuation even if no
              product defect exists. The second scenario is a China cobot price war: domestic suppliers reset buyer
              expectations while Universal Robots, FANUC, and KUKA defend premium accounts through channel depth.
              Flexiv’s force-sensing and embodied-AI positioning gives differentiation, but public sources do not
              disclose gross margin, top-customer concentration, or recurring service economics. I therefore rate
              residual risk high: not a kill today, but a price-sensitive diligence item with hard triggers.
            claimRefs:
