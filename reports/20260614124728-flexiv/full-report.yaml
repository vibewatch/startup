      - number: '2.3'
        title: China and buyer-segment demand
        blocks:
          - type: paragraph
            body: >-
              China is the most important geography for category momentum and competitive pressure. IFR reports that
              China accounted for 54% of global industrial robot demand in 2024, while domestic vendors took majority
              share in China. Policy support from the Robotics Industry Development Plan and Robot Plus action plan is a
              genuine driver because it pushes robot density, model applications, and broader manufacturing deployment.
              For Flexiv, the most relevant buyer segments are not generic factory robots but contact-rich users: EV
              battery and automotive lines, electronics and display assembly, semiconductor-adjacent precision handling,
              surface treatment, general manufacturing, FMCG, and life-science or service workflows. Public Flexiv and
              partner evidence supports these use cases, while CATL battery automation reporting validates new-energy
              automation as a strategic budget pool. CATL and BOE should nevertheless be treated as buyer archetypes
              unless directly confirmed as Flexiv customers.
