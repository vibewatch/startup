            body: >-
              Flexiv Ltd. should be treated in this report as a private adaptive-robotics company whose public identity
              is anchored by Flexiv-branded official sites and third-party market profiles, not by public-company
              filings. The company describes its core product category as human-inspired adaptive robots that fuse
              industrial force control with artificial intelligence, which makes the one-line business description more
              specific than generic collaborative robotics. The most durable history point is the 2016 Santa Clara
              founding claim, corroborated by Flexiv's about page and repeated in its 2026 financing materials. Its
              footprint is cross-border: official sources list Silicon Valley and several Asian and European offices,
              while third-party profiles variously emphasize Shanghai, Santa Clara, or broader China operations. For
              diligence, later chapters should use the official footprint as company-claimed and verify legal entity,
              tax residence, export-control exposure, and contracting entity in primary documents.
