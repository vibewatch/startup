            body: >-
              The adverse evidence is not company-specific distress; it is market context that should restrain valuation
              and margin assumptions. Interact Analysis reported weak collaborative-robot shipment growth in 2024, while
              2026 China robotics coverage points to competitive pressure even as growth resumes. Separately, GlobalData
              reported a sharp contraction in China venture funding in early 2025. For Flexiv, these facts mean a $1
              billion private valuation and large funding total should not be converted into an implied revenue multiple
              without traction data. The risk is that price competition, slower procurement, integration burden or
              narrower exit windows could require more capital before profitability. That makes downside cases more
