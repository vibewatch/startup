      - number: '7.4'
        title: People, funding, governance, and leadership dependency
        blocks:
          - type: paragraph
            body: >-
              Flexiv’s recent financing reduces near-term survival risk, but it does not eliminate funding or governance
              risk. The 2026 Business Wire announcement quotes Shiquan Wang as co-founder and CEO and frames the round
              around global sales, service build-out, and technical development. That makes Wang a visible strategy
              carrier and therefore a key-person dependency until the company demonstrates deeper public bench strength,
              succession planning, and board alignment. The prompt flagged a possible founder or co-founder change; the
              public sources retained here did not verify it, so this chapter treats it as a diligence ask rather than a
              fact. Financing risk remains because the announcement did not disclose valuation, revenue, margins, or
              runway, while broader robotics funding sources show investor attention rotating toward humanoids, physical
