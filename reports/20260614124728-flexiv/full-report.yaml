  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and weighted competitor set
        blocks:
          - type: paragraph
            body: >-
              Flexiv competes in a crowded automation landscape where the relevant buyer set is wider than
              force-controlled adaptive arms. Direct pressure comes from global cobot leaders and industrial incumbents
              such as Universal Robots, FANUC, ABB, KUKA, Yaskawa, Doosan, and Techman; China-specific pressure comes
              from AUBO, Elite, JAKA, and Rokae; narrower substitutes include Mecademic and Productive Robotics; and
              status quo or integrator-led internal builds remain alternatives when customers can tolerate manual work
              or conventional workcells. The evidence weighting should therefore privilege breadth, service coverage,
              payload range, and application proof rather than brand count. IFR market data also matters because China’s
              industrial-robot installation scale and rising domestic-vendor share increase the probability that a
              Chinese adaptive-robotics vendor faces local price pressure even when the underlying technology is
              differentiated.
