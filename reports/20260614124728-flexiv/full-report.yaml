      - number: '3.3'
        title: China peers and adaptive-specialist pressure
        blocks:
          - type: paragraph
            body: >-
              China and force-control peers deserve separate treatment because they pressure different parts of the
              Flexiv thesis. AUBO and Elite show breadth, standards involvement, distributors, patents, and multiple
              application lines; JAKA and Rokae confirm additional live Chinese suppliers with official international
              surfaces. That peer density can compress hardware gross margin and make channel access harder in China and
              export markets. Franka adds a different caution: its force-control and AI-body positioning remains
              strategically relevant, but Agile Robots’ acquisition after insolvency shows that attractive technology
              can still struggle commercially. NEURA also competes on the cognitive-robot narrative. For Flexiv, the
