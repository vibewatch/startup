      - number: '7.2'
        title: Regulatory, legal, data-transfer, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk register should be read as event-driven. The reviewed sources establish the rules and
              enforcement pathways, not a present Flexiv designation. Treasury’s outbound-investment program and final
              rule matter because future U.S. investors must analyze China-related AI and semiconductor exposure before
              participating. CFIUS matters if governance, IP rights, U.S. customer data, or facilities create sensitive
              access concerns. BIS Entity List and DoD Section 1260H exposure matter because robotics and AI can become
              policy targets quickly; an adverse listing would be a valuation event even before revenue loss is
              quantified. In China, CAC cross-border-data provisions and PIPL create telemetry, remote-service, and
              customer-data compliance obligations. Legal diligence remains incomplete: CourtListener and PACER are
              search paths, but counsel should run affiliate-level searches and IP reviews, including lessons from
              Universal Robots litigation references, Franka Emika distress, and trade-secret cases.
