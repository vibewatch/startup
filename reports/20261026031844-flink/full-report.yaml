chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Flink is a Berlin-based, privately held grocery-delivery company. Sources differ on its founding year:
              Reuters and Multiples.vc say 2020, while a March 2026 Prosus release says 2021; TechCrunch separately
              reports a December 2020 commercial launch (CO001). Its early app-based model used local fulfillment hubs
              to deliver groceries and household essentials, with a 10-minute-or-less promise (CO002). Its 2021 product
              description emphasized a smaller assortment, self-operated dark stores, supermarket pricing and a
              10-minute-or-less delivery promise; the current App Store listing still describes grocery and household
              items delivered to the customer's door, but does not establish current delivery performance or
              availability in every market (CO002). The model combines inventory held near urban customers with delivery
              operations, making hub density, order economics and labor execution central operating dependencies.
              Current order frequency, retention, basket contribution margin and active customer counts are not
              established by the available evidence, so historic financing-era reach should not be presented as current
              customer scale.
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: Capital, scale and reported metrics
        blocks:
          - type: paragraph
            body: >-
              Flink's 2021 financing included a reported $52 million round in March and a $240 million all-equity Series
              A in June; Prosus, BOND and Mubadala Capital co-led the latter (CO004). Its December 2021 Series B was
              $750 million, with a reported $2.1 billion pre-money and $2.85 billion post-money valuation (CO006). A
              September 2024 financing comprised $115 million of equity and $35 million of debt; TechCrunch reported a
              valuation just under $1 billion based on sources close to the company (CO007, CO005). Clay and
              Multiples.vc list different cumulative-funding totals but both put the March 2026 valuation at about $900
              million; neither database reconciles its figures to a primary financing schedule (CO013, CO014). The $600
              million gross-revenue figure was a company expectation for 2024, not verified realized revenue or ARR;
              reporting also described country-level EBITDA break-even as a company statement (CO008). In March 2026,
              Prosus announced approximately $100 million of new growth capital and said Flink had confirmed EBITDA
              profitability (CO009, CO010). That statement does not establish net income, free cash flow or cash
              available. Latest published scale figures—around 160 hubs and more than 10,000 employees—are also
              investor-release figures, not audited counts (CO011, CO012).
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO005
              - CO013
              - CO014
