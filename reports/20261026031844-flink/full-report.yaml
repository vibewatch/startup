  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Recovery thesis
        - Prosus announced approximately US$100 million of growth capital; Flink says it is EBITDA profitable.
        - Audited market-level contribution and cash-flow data would show whether profitability is durable.
      - - Capital discipline
        - Flink says new hubs will be selective and based on profitability and density criteria.
        - Hub cohorts, closure history, and incremental returns would test whether expansion adds value.
      - - Valuation reset
        - TechCrunch reported a near-US$1 billion 2024 mark after earlier much higher private marks.
        - Current financing price and comparable, same-period operating metrics would establish a usable anchor.
      - - Downside / dilution
        - >-
          Current debt, preference, liquidity, and cash-flow details are not established by the assigned public
          evidence.
        - A complete cap table, debt schedule, and cash bridge would quantify the equity waterfall and funding need.
    notes: >-
      Historical marks are reported private-market indications, not verified comparable-company benchmarks; forward
      tests are diligence requirements.
