      - number: '1.3'
        title: Leadership and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies Oliver Merkel, Julian Dames and Christoph Cordes as co-founders (CO003).
              TechCrunch described Merkel as CEO in 2021 and as founder and managing director in 2024; a Prosus release
              dated March 2026 identifies Dames as CEO (CO014). The sources establish different role descriptions over
              time, but not the date or circumstances of any handover. Early investors and commercial relationships
              include DoorDash, REWE, Prosus, Mubadala, BOND and Northzone (CO004, CO006, CO007, CO009). Publicly
              available material reviewed here does not establish voting rights, board composition, ownership
              percentages, preference terms or key-person succession coverage. The stakeholder table is a selected map
              of named parties, not a complete cap table.
