        - RELEX's partner-authored case study describes Flink's adoption of its planning tools during rapid growth.
        - >-
          A service interruption or poor forecast performance could affect availability and spoilage; current dependency
          is unconfirmed.
        - >-
          RELEX describes automation and qualitative benefits, but no independently verified continuity or performance
          metrics.
        - Verify current system use, data exportability, fallback planning, incident history, and contract exit rights.
      - - Backend engineering support
        - >-
          Monterail says it partnered with Flink in 2021 on backend migration, APIs, payments, order tracking, and
          warehouse tooling.
        - >-
          Loss of specialist knowledge could slow changes or recovery if the work remains operationally material;
          current dependence is unknown.
        - The vendor described a successful historical engagement, not present-day support coverage.
        - Confirm ownership of code and integrations, current support, documentation, and internal recovery capability.
    notes: >-
      Public sources identify historical or reported partner roles but disclose no present-day concentration denominator
      or complete contract terms. Treat unknown dependency as a diligence gap, not proof of concentration.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
