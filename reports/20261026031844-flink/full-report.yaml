      - number: '1.4'
        title: Milestones and risk context
        blocks:
          - type: paragraph
            body: >-
              The dated milestones show a rapid expansion of financing in 2021, followed by later rounds described as
              supporting narrower operations and cost discipline (CO004, CO006, CO007, CO009). In 2024, the company
              expected gross revenue to rise about 20% year over year and reported country-level EBITDA break-even;
              neither statement establishes realized revenue or cash profitability (CO008). In March 2026, an investor
              release reported EBITDA profitability and a selective Germany expansion plan (CO010, CO011). In September
              2026, NL Times and Golem reported unauthorized access to an internal system and extortion attempts using
              allegedly stolen customer and worker data (CO016). NL Times reported that the data may include names,
              postal codes, contact details and delivery instructions; it said Flink reported that passwords and payment
              information were not compromised. Flink also said access was blocked and authorities were notified, but
              the total number affected remains unconfirmed; the absence of a confirmed count is not evidence that the
              incident was limited (CO016).
