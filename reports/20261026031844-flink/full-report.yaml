  - id: TV003
    title: Bull, base, bear, and entry-sensitivity cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and trigger
    rows:
      - - Bull
        - EBITDA profitability persists; selective hub growth produces positive contribution and cash flow.
        - No defensible valuation range without current revenue, margins, cash flow, and transaction price.
        - >-
          Qualitative signal: conditional upside, low confidence until audited cash conversion and hub-level returns are
          shown.
      - - Base
        - Current EBITDA claim is directionally correct, but cash conversion and latest equity terms remain unknown.
        - Defer price-based underwriting; the reported secondary mark is not a verified deal price.
        - >-
          Qualitative signal: working case, not a probability-weighted estimate; maintain research-more until current
          data are received.
      - - Bear
        - EBITDA does not convert to cash, hub economics weaken, or debt and preference claims absorb equity value.
        - >-
          Downside may include a lower private mark or further dilution; available sources do not support a numeric loss
          range.
        - >-
          Qualitative signal: material downside risk, unquantified; trigger on negative cash conversion, refinancing
          need, or adverse preference terms.
      - - Entry sensitivity
        - >-
          Clay lists a US$900 million March 2026 mark; TechCrunch reported US$600 million of expected 2024 gross
          revenue.
        - 1.5x is arithmetic on mismatched dates and gross revenue, not a comparable or current revenue multiple.
        - >-
          Not a scenario probability; recompute only with verified current price, revenue definition, net revenue, and
          capital structure.
    notes: >-
      Scenario ranges and probabilities are intentionally unquantified because current transaction price, current
      financials, and investor rights are not established. The 1.5x sensitivity is explicitly non-comparable.
    claimRefs:
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV015
