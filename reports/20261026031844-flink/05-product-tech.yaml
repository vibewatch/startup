company:
  name: Flink
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Flink's public materials describe an app-led grocery delivery service built
    around local fulfillment hubs, while a technology partner reports a
    multi-application backend with commerce migration and service decomposition.
    Current architecture, service-level reliability, and independently audited
    security controls remain unverified; a September 2026 data incident makes
    those operating controls especially material.
sections:
  - id: service-model
    title: App-led top-up shopping depends on local execution
    body: >-
      Flink's March 2026 company-originated update describes groceries and
      household essentials ordered through its mobile app and fulfilled through
      local hubs (CE001). The company also reports an average basket above €45
      and delivery in approximately 30 minutes, figures that are company claims
      rather than independently measured service levels (CE002). It said
      additional hubs would be opened in selected German regions during 2026
      only where profitability and customer-density criteria were met (CE003).
      These disclosures define a density-dependent operating proposition, but
      do not establish current hub counts, actual delivery-time distributions,
      stock availability, or hub-level service quality. The module and workflow
      tables separate the company-described offer from operational details
      supplied by a technology vendor.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: application-and-backend
    title: Partner-reported application and backend structure
    body: >-
      Monterail, a technology-services partner, describes an ecosystem of
      applications for end users, drivers, pickers, and enterprise resource
      planning, and says its engagement supported the broader app ecosystem
      (CE004). Its case study reports a custom API migration from Saleor to
      Commerce Tools (CE005), decomposition of checkout and cart monoliths into
      microservices (CE006), and tools for warehouse staff, order management,
      and inventory (CE007). It also says the early mobile application moved
      from React Native to Kotlin and Swift (CE008). This is useful evidence of
      implementation scope, but it is a supplier-authored retrospective: it
      does not disclose the current production topology, integration contracts,
      ownership boundaries, or migration status. No public technical
      documentation in the assigned evidence describes present-day APIs or
      deployment controls.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: maturity-and-proof
    title: Product promises are better documented than measured outcomes
    body: >-
      TechCrunch's June 2021 reporting described Flink's early offer as a
      smaller assortment of about 2,400 items, self-operated dark stores, and
      delivery advertised in ten minutes or less (CE009, CE010). A historical
      Wikipedia entry describes dark stores as non-public local warehouses and
      says deliveries used company employees on bikes or e-bikes (CE011).
      These sources help explain the original product design, not the current
      service configuration. StartupWired later stated that Flink planned
      technology investment for inventory management and route optimization,
      but supplied no engineering detail, baseline, or measured result (CE012).
      The architecture figure therefore shows only a historical public
      description; it should not be read as a verified current system diagram.
      Across the assigned sources, there are no published uptime or delivery
      reliability series, app release metrics, or independently validated
      productivity outcomes.
    claimRefs: [CE009, CE010, CE011, CE012]
    figureRefs: [FE001]
  - id: trust-security
    title: A material incident raises the bar for security diligence
    body: >-
      September 2026 reporting describes unauthorized access to an internal
      Flink system and extortion attempts directed at customers and workers
      (CE013, CE014). NL Times reported that names, postal codes, email
      addresses, phone numbers, and delivery instructions were implicated, while
      attributing to Flink the statement that passwords and financial data were
      not compromised (CE015). The same outlet reported claims of roughly one
      million customers and 13,000 workers affected, while noting that Flink had
      not confirmed the total (CE016). The reports also attribute the suspected
      entry point and containment actions to company statements; those details
      are not an independent forensic finding. The evidence supports treating
      incident scope, remediation, and control assurance as open diligence
      items—not concluding that other systems or data were unaffected.
    claimRefs: [CE013, CE014, CE015, CE016]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, User, Publicly reported status, Differentiation and diligence gap]
    rows:
      - [Mobile shopping app, Household shopper, Company describes an app for groceries and household essentials, Current feature set and adoption by market are not documented]
      - [Local fulfillment hubs, Picker and local operations team, Company describes a local-hub network and selective 2026 expansion plan, Current hub count and site-level service economics are unavailable]
      - [Commerce backend, Shopper and commerce operations, Partner reports a Saleor-to-Commerce-Tools data migration using a custom API, Current integration and data-governance design are not disclosed]
      - [Rider and warehouse applications, Drivers and warehouse staff, Partner reports separate user applications and warehouse tooling, Current production status and support ownership are not independently verified]
    notes: >-
      Current operating-model statements are company claims; architecture details
      come from Monterail, a technology-services partner. Null details are not
      evidence that a capability is absent.
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Reported workflow, Measurable benefit disclosed, Limitation]
    rows:
      - ["Household top-up shopper", "Order groceries and household essentials in the app", "Company reports average basket above €45 and delivery around 30 minutes", "No denominator, distribution, market split, or independent validation is provided"]
      - ["Picker", "Use a dedicated application as part of the multi-app ecosystem", "Partner describes applications for pickers", "No pick-rate, substitution, or accuracy metric is reported"]
      - ["Driver", "Use a driver application with order-location tracking and post-order functionality", "Partner lists tracking and post-order experience in project scope", "No on-time delivery or support metric is reported"]
      - ["Warehouse operations team", "Use warehouse employee tooling, order dashboards, and inventory management", "Partner describes these systems as project scope", "Current deployment coverage and inventory outcomes are unknown"]
    notes: >-
      Workflow coverage is limited to a company update and a partner case study;
      the reported delivery and basket figures are not independently measured.
    claimRefs: [CE001, CE002, CE004, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Reported component, Dependency or transition, Risk or diligence gap]
    rows:
      - ["Mobile clients", "Early move from React Native to Kotlin and Swift", "Separate native client implementations", "Current app versions and release discipline are not documented"]
      - ["Commerce data", "Saleor-to-Commerce-Tools migration", "Custom API transferring data across applications", "Migration completeness, reconciliation, and rollback controls are unknown"]
      - ["Checkout and cart", "Monolith decomposition into microservices", "Service boundaries and integration behavior", "Current topology, observability, and failure isolation are not independently documented"]
      - ["Fulfillment operations", "Warehouse app, order dashboard, and inventory management", "Integration across operational applications", "Current system ownership and inventory-control outcomes are unverified"]
    notes: >-
      This is a partner-reported historical implementation scope, not a verified
      inventory of Flink's current production architecture.
    claimRefs: [CE005, CE006, CE007, CE008]
