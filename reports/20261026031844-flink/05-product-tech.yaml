  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: service-reliability
      missingEvidence: Current market-level uptime, delivery-time distributions, stockout rates, support outcomes, and deployment or rollback metrics.
      whyItMatters: Without operational denominators and time series, the company-reported delivery promise cannot establish service reliability or customer impact.
      diligencePath: Request 12 months of market- and hub-level service dashboards, incident records, delivery-time percentiles, stockout rates, and support-ticket outcomes.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE002]
    - type: private-evidence-only
      severity: material
      topic: security-assurance
      missingEvidence: Current independent security audit, penetration-test scope and findings, remediation evidence, and a post-incident forensic summary.
      whyItMatters: Public incident reporting identifies exposed data and reported containment but does not establish the root cause, control effectiveness, or completeness of remediation.
      diligencePath: Request the incident report, external forensic findings, security-control audit, penetration-test results, and evidence of remediation and regulator communications.
      relatedQuestionRefs: [QE009]
