  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: comparative-unit-economics
      missingEvidence: "Matched current item-price baskets, fees, order contribution, picking and delivery costs, waste, and retention data for Flink and alternatives."
      whyItMatters: "Without comparable realized economics, the reported basket and delivery model cannot establish price competitiveness or a defensible operating moat."
      diligencePath: "Request matched-basket testing and 12-month city- and channel-level order cohorts, including contribution after fulfillment and promotion."
      relatedQuestionRefs:
        - QP005
        - QP007
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: channel-economics
      missingEvidence: "Flink order share, acquisition cost, repeat frequency, and contribution by native app and each third-party platform, plus current listing and logistics terms."
      whyItMatters: "The reported Lieferando focus could improve reach but also concentrate bargaining power and reduce direct customer ownership."
      diligencePath: "Obtain channel-level order and cohort data, current partner contracts, attribution rules, and customer-data ownership terms."
      relatedQuestionRefs:
        - QP004
        - QP008
        - QP009
      relatedTableRefs:
        - TP002
    - type: conflicting-data
      severity: material
      topic: data-incident-scope
