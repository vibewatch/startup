figures:
  - id: FP001
    title: Source-described competitive positioning
    type: quadrant
    summary: >-
      Ordinal placements distinguish quick-top-up fit from control of grocery
      fulfillment; they are analyst-coded model descriptions, not measured performance.
    data:
      xAxis:
        label: Fit with an immediate grocery top-up (1 low, 5 high)
        min: 1
        max: 5
      yAxis:
        label: Control of grocery inventory / fulfillment (1 low, 5 high)
        min: 1
        max: 5
      points:
        - name: Flink
          label: Flink
          x: 5
          y: 5
          note: "Quick top-ups, self-operated hubs, and a reported 30-minute delivery model; current metrics are company-linked."
        - name: REWE own grocery delivery
          label: REWE own grocery delivery
          x: 3
          y: 4
          note: "TechCrunch described REWE's own delivery proposition for larger baskets."
        - name: REWE Express via Flink
          label: REWE Express via Flink
          x: 4
          y: 2
          note: "Small grocery orders were listed through Lieferando but reportedly picked and delivered by Flink."
        - name: Picnic
          label: Picnic
          x: 2
          y: 3
          note: "K5 describes fixed routes and discount-price positioning, rather than instant delivery."
        - name: Lieferando
          label: Lieferando
          x: 3
          y: 1
          note: "Distribution platform; the cited report does not attribute grocery inventory ownership to it."
        - name: Uber Eats / Wolt
          label: Uber Eats / Wolt
          x: 3
          y: 1
          note: "Prior platform listings and unspecified other cooperation are reported; current listing status is unclear."
    approximationNotes: >-
      Coordinates are directional analyst judgments based only on the cited descriptions,
      with 1–5 ordinal scales and no claim of measured service performance or market share.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
