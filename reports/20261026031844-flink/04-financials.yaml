company:
  name: Flink
chapter:
  number: 4
  title: Financials
  summary: Flink's March 2026 financing and company-confirmed EBITDA profitability suggest a more disciplined operating phase, but neither establishes current revenue, contribution economics, cash generation, or runway. Historical France losses and liquidation, alongside continuing labor and incident exposure, keep the forward capital-adequacy case unproven.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Public evidence points to grocery product sales as the core revenue mechanism,
      with orders fulfilled through local hubs, but does not establish the current
      revenue mix, accounting basis, or realized margin per order (CI015, CI005).
      TechFundingNews reports average baskets above €45 and delivery in about 30
      minutes, while the March 2026 Prosus release describes a dense hub network and
      top-up shopping; these are company-reported operating descriptors, not audited
      sales or margin data (CI003). Multiples.vc's $500 million revenue entry is tied
      to May 2022 and explicitly may represent run-rate or LTM revenue, so it cannot
      anchor a current revenue estimate (CI004). Delivery charges, promotional
      income, supplier economics, and revenue recognition remain unverified. The
      bridge below therefore shows the operating path and marks the missing financial
      conversion rather than implying that basket value becomes gross profit.
    claimRefs: [CI003, CI004, CI005, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing and unit economics
    body: >-
      The strongest current transaction proxy in the assigned evidence is a
      company-reported average basket above €45, not a realized price, revenue per
      order, or contribution margin (CI003). No assigned source discloses list-price
      versus realized-price differences, delivery fees, discount rates, CAC, or
      payback; those fields must remain unknown rather than be inferred from a basket
      size or market-level online grocery penetration (CI005, CI014). Flink's
      confirmation of EBITDA profitability is directionally positive but lacks an
      amount, reporting period, reconciliation, and country or hub breakdown (CI002).
      Accordingly, the pricing exhibit separates the reported basket from unreported
      customer charges, while the unit-economics table treats company-wide margin
      and acquisition measures as diligence requests, not zeros.
    claimRefs: [CI002, CI003, CI005, CI014]
    tableRefs: [TI002, TI003]
  - id: cost-structure-and-operating-risk
    title: Cost structure and operating risk
    body: >-
      Flink's model depends on stocked local hubs, picking, and last-mile delivery;
      March 2026 coverage describes a local-hub model and curated assortments,
      but provides no hub-level labor, occupancy, inventory-loss, or
      delivery cost schedule (CI016). Fairwork's 2025 Germany assessment says Flink
      alone among the evaluated platforms provided evidence that workers earned at
      least minimum wage after costs; this is useful labor-practice evidence, not a
      quantified payroll or unit-cost metric (CI009). Le Figaro reported that the
      French operation entered cessation of payments and was to be liquidated in
      2024, citing inflation, regulatory pressure, and investor disinterest; that
      is a material historical warning, not proof of current German or Dutch
      economics (CI007, CI008). NL Times reported unauthorized access to an internal
      system in 2026, while the remediation and any resulting financial liability
      remain unquantified (CI011, CI012).
    claimRefs: [CI003, CI007, CI008, CI009, CI011, CI012]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Tracxn records a $100 million March 2026 Series C and the Prosus-distributed
      release describes approximately $100 million of growth capital for targeted
      investment in Germany and the Netherlands (CI001, CI006). This is financing
      raised, not a disclosed cash balance: no assigned source gives unrestricted
      cash, burn, working-capital needs, debt maturities or covenants, or runway
      (CI013, CI014). The company-reported EBITDA-profitability milestone improves
      the operating narrative, but EBITDA does not establish operating cash flow or
      free cash flow, particularly for a hub-and-inventory model (CI002, CI014).
      Historical TechCrunch coverage questioned the long-term sustainability of
      rapid grocery delivery, a sector-level caution rather than evidence of
      Flink's current liquidity (CI010). Underwriting should
      remain conditional on current accounts, market-level contribution margins,
      cash conversion, and the financing terms behind the latest round.
    claimRefs: [CI001, CI002, CI006, CI010, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams and recognition
    columns: [Stream, Mechanism, Current public value or status, Evidence quality, Diligence request]
    rows:
      - ["Grocery product sales", "App-based sale of grocery products", "Core mechanism identified; current revenue not disclosed", "Multiples.vc labels the model product sales but offers no current audited revenue", "Obtain monthly net sales by country and accounting policy for gross versus net presentation"]
      - ["Delivery charges", "Per-order customer fee if charged", "Not disclosed", "No assigned source verifies a fee or its prevalence", "Obtain fee schedule and realized delivery-fee revenue net of promotions"]
      - ["Supplier or brand income", "Promotion or placement payments if any", "Not disclosed", "No assigned source quantifies or confirms this stream", "Request supplier contracts and promotional-income accounting"]
      - ["Partner or channel economics", "Commercial terms for supply or distribution partners", "Not disclosed", "Public partnership descriptions do not establish commissions or revenue shares", "Review current partner contracts and settlement terms"]
    notes: >-
      Partial public-evidence view; unknown means not disclosed in the assigned sources,
      not zero. Multiples.vc's historical revenue entry may be run-rate or LTM and is
      not treated as current revenue.
    claimRefs: [CI004, CI005, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or term, Unit and period, Public evidence, What it does not establish, Diligence request]
    rows:
      - ["Average basket", "Euros per basket; reported March 2026", "Above €45", "Customer basket value is not recognized revenue or gross profit", "Provide distribution of realized order values and net sales after discounts"]
      - ["Item list prices and realized prices", "Per SKU and market", "Not disclosed", "No basis for price premium or discount analysis", "Request SKU price files and promotion-adjusted realization"]
      - ["Customer delivery fee", "Euros per order", "Not disclosed", "Fee may vary by market or promotion; no amount is supportable", "Obtain fee schedules and waived-fee share"]
      - ["Partner commercial terms", "Contract and market basis", "Not disclosed", "Supply relationships do not show margin, exclusivity economics, or rebates", "Review current REWE and delivery-partner contracts"]
    notes: >-
      The €45-plus basket is a company-reported average in March 2026 coverage; other
      pricing fields are explicit evidence gaps rather than assumed zeroes.
    claimRefs: [CI003, CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value and period, Confidence or limitation, Why it matters, Diligence request]
    rows:
      - ["EBITDA profitability", "Company-confirmed in March 2026; amount and period not disclosed", "Company statement repeated in press release and coverage; no reconciliation", "Does not establish cash generation or profit by market", "Obtain monthly EBITDA bridge and audited or management accounts"]
      - ["Gross margin", "Not disclosed", "No current company-level or hub-level figure in assigned evidence", "Determines room to cover fulfillment and overhead", "Request gross margin by country, category, and order cohort"]
      - ["Contribution margin per order or hub", "Not disclosed", "No quantified fulfillment-cost or hub-cost schedule", "Tests whether dense local operations scale economically", "Request order-level contribution including picking, delivery, occupancy, and wastage"]
      - ["Customer acquisition cost and payback", "Not disclosed", "No acquisition spend, cohort, or payback period available", "Limits assessment of sales efficiency and repeat-order economics", "Request channel-level CAC and cohort payback"]
      - ["Cash, burn, runway, and working capital", "Not disclosed", "The $100 million financing amount is not cash on hand or runway", "Determines capital adequacy and next-round trigger", "Obtain current cash, monthly burn, working-capital cycle, debt schedule, and downside runway"]
      - ["France revenue before liquidation", "€37.5 million; period unspecified in April 2024 coverage", "Historical country operation; not comparable to current group revenue", "Shows prior market scale but not profitability or current revenue quality", "Obtain French entity accounts and clarify the revenue period and consolidation"]
    notes: >-
      Missing values are not zero. EBITDA profitability is a company-confirmed
      milestone with no disclosed amount or period; the French revenue figure is
      historical and its period is unspecified in the cited coverage.
    claimRefs: [CI002, CI003, CI007, CI013, CI014]
figures:
  - id: FI001
    title: From grocery order to unproven gross profit
    type: flow
    summary: Public evidence describes the fulfillment path and a company-reported EBITDA milestone, but does not quantify revenue recognition, direct costs, or gross profit.
    data:
      nodes:
        - id: customer-order
          label: Customer grocery order
          detail: Company-reported average basket exceeds €45; this is basket value, not reported revenue per order.
        - id: hub-fulfillment
          label: Hub stock and picking
          detail: Coverage describes local hubs and curated assortments; hub-level costs are not disclosed.
        - id: last-mile-delivery
          label: Last-mile delivery
          detail: Reported average delivery time is about 30 minutes; cost per delivery is not disclosed.
        - id: product-sales
          label: Grocery product sales
          detail: Product sales are identified as the revenue model; recognition and net revenue per order are not disclosed.
        - id: fulfillment-costs
          label: Direct operating costs
          detail: Procurement, labor, occupancy, inventory loss, and delivery cost amounts are unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Not disclosed; no monetary conversion is implied by this flow.
        - id: ebitda
          label: EBITDA
          detail: Flink confirmed EBITDA profitability in March 2026; amount and period are not disclosed.
      edges:
        - from: customer-order
          to: hub-fulfillment
          label: Order triggers picking
        - from: hub-fulfillment
          to: last-mile-delivery
          label: Fulfillment
        - from: last-mile-delivery
          to: product-sales
          label: Customer transaction
        - from: product-sales
          to: gross-profit
          label: Less undisclosed direct costs
        - from: fulfillment-costs
          to: gross-profit
          label: Cost inputs
        - from: gross-profit
          to: ebitda
          label: Overheads and other items not reconciled
    claimRefs: [CI002, CI003, CI005, CI014, CI015, CI016]
