company:
  name: Flink
chapter:
  number: 1
  title: Company Overview
  summary: Flink is a Berlin-based quick-commerce grocery service whose funding history spans pandemic-era mega-rounds and later capital aimed at a narrower Germany-Netherlands footprint. Current profitability and scale figures are largely company or investor statements, while valuation and the scope of a September 2026 data incident remain incompletely verified.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Flink is a Berlin-based, privately held grocery-delivery company.
      Sources differ on its founding year: Reuters and Multiples.vc say 2020,
      while a March 2026 Prosus release says 2021; TechCrunch separately
      reports a December 2020 commercial launch (CO001). Its early app-based
      model used local fulfillment hubs to deliver groceries and household
      essentials, with a 10-minute-or-less promise (CO002). Its 2021 product
      description emphasized a smaller
      assortment, self-operated dark stores, supermarket pricing and a
      10-minute-or-less delivery promise; the current App Store listing still
      describes grocery and household items delivered to the customer's door,
      but does not establish current delivery performance or availability in
      every market (CO002). The model combines inventory held near urban
      customers with delivery operations, making hub density, order economics
      and labor execution central operating dependencies. Current order
      frequency, retention, basket contribution margin and active customer
      counts are not established by the available evidence, so historic
      financing-era reach should not be presented as current customer scale.
    claimRefs: [CO001, CO002]
  - id: capital-and-scale
    title: Capital, scale and reported metrics
    body: >-
      Flink's 2021 financing included a reported $52 million round in March
      and a $240 million all-equity Series A in June; Prosus, BOND and Mubadala
      Capital co-led the latter (CO004). Its December 2021 Series B was $750
      million, with a reported $2.1 billion pre-money and $2.85 billion
      post-money valuation (CO006). A September 2024 financing comprised
      $115 million of equity and $35 million of debt; TechCrunch reported a
      valuation just under $1 billion based on sources close to the company
      (CO007, CO005). Clay and Multiples.vc list different cumulative-funding
      totals but both put the March 2026 valuation at about $900 million;
      neither database reconciles its figures to a primary financing schedule
      (CO013, CO014).
      The $600 million gross-revenue figure was a company expectation for 2024,
      not verified realized revenue or ARR; reporting also described
      country-level EBITDA break-even as a company statement (CO008). In March
      2026, Prosus announced approximately $100 million of new growth capital
      and said Flink had confirmed EBITDA profitability (CO009, CO010). That
      statement does not establish net income, free cash flow or cash
      available. Latest published scale figures—around 160 hubs and more than
      10,000 employees—are also investor-release figures, not audited counts
      (CO011, CO012).
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO005, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership and stakeholder structure
    body: >-
      Public reporting identifies Oliver Merkel, Julian Dames and Christoph
      Cordes as co-founders (CO003). TechCrunch described Merkel as CEO in
      2021 and as founder and managing director in 2024; a Prosus release
      dated March 2026 identifies Dames as CEO (CO014). The sources establish
      different role descriptions over time, but not the date or circumstances
      of any handover. Early investors and commercial relationships include DoorDash,
      REWE, Prosus, Mubadala, BOND and Northzone (CO004, CO006, CO007,
      CO009). Publicly available material reviewed here does not establish
      voting rights, board composition, ownership percentages, preference
      terms or key-person succession coverage. The stakeholder table is a
      selected map of named parties, not a complete cap table.
    claimRefs: [CO003, CO004, CO006, CO007, CO009, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-context
    title: Milestones and risk context
    body: >-
      The dated milestones show a rapid expansion of financing in 2021,
      followed by later rounds described as supporting narrower operations and
      cost discipline (CO004, CO006, CO007, CO009). In 2024, the company
      expected gross revenue to rise about 20% year over year and reported
      country-level EBITDA break-even; neither statement establishes realized
      revenue or cash profitability (CO008). In March 2026, an investor
      release reported EBITDA profitability and a selective Germany expansion
      plan (CO010, CO011). In September
      2026, NL Times and Golem reported unauthorized access to an internal
      system and extortion attempts using allegedly stolen customer and worker
      data (CO016). NL Times reported that the data may include names, postal
      codes, contact details and delivery instructions; it said Flink reported
      that passwords and payment information were not compromised. Flink also
      said access was blocked and authorities were notified, but the total
      number affected remains unconfirmed; the absence of a confirmed count
      is not evidence that the incident was limited (CO016).
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO016]
    figureRefs: [FO001]
