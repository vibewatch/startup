  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: "A primary financing schedule and transaction documents that reconcile reported cumulative capital totals, the 2024 valuation, the March 2026 database estimate and the terms of each instrument."
      whyItMatters: "Private valuation and capital structure affect dilution, investor rights and any comparison of reported growth with the capital invested."
      diligencePath: "Request the fully diluted cap table, dated round closing statements, debt and equity schedules, and latest investor valuation materials from Flink."
      relatedQuestionRefs: [QO004]
    - type: missing-source
      severity: minor
      topic: founding-date
      missingEvidence: "A company filing or other primary record establishing the legal incorporation date, distinct from the reported December 2020 commercial launch."
      whyItMatters: "Public sources differ between a 2020 and 2021 founding year, which affects company-age comparisons and milestone dating."
      diligencePath: "Confirm the legal entity's incorporation date and original trading/launch date from company registration records and management."
      relatedQuestionRefs: [QO001]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: "Current board roster, founder and executive responsibilities, ownership and voting rights, succession plans and the date and scope of the CEO transition."
      whyItMatters: "Without governance and role detail, investors cannot assess control, decision continuity or dependence on individual founders."
      diligencePath: "Review the current board and executive roster, shareholder agreement, delegation matrix and succession documentation with management."
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: incident-scope
      missingEvidence: "A regulator- or company-verified count of affected customers and workers, confirmed data categories, investigation status and any resulting claims or enforcement."
      whyItMatters: "The number and sensitivity of affected records determine customer harm, legal exposure and the cost of incident response."
      diligencePath: "Obtain the incident notice, regulator correspondence, forensic report and affected-population reconciliation after authorities permit disclosure."
      relatedQuestionRefs: [QO009]
    - type: private-evidence-only
      severity: material
      topic: current-financials
      missingEvidence: "Verified actual 2024 and current revenue or ARR, a defined EBITDA bridge, free-cash-flow and working-capital data, and current active-customer counts."
      whyItMatters: "A revenue forecast and an EBITDA-profitability statement cannot establish realized growth, cash generation, retention or the durability of the operating model."
      diligencePath: "Request audited financial statements and monthly management accounts with metric definitions, cash-flow reconciliation, order cohorts and active-customer methodology."
      relatedQuestionRefs: [QO005]
