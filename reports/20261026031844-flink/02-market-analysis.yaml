        - label: "Dutch retail-sector turnover"
          value: "€49.5bn (2024)"
          note: "USDA total-retail measure; not a grocery TAM."
        - label: "Dutch grocery shopping"
          value: "€46.3bn (2022)"
          note: "CBRE-reported grocery denominator; different vintage and scope."
        - label: "Food products in Dutch retail"
          value: "80% of 2024 retail sales"
          note: "USDA share of the retail-sector measure; not a standalone food-revenue amount."
        - label: "Online grocery"
          value: "Approximately 7% (2022)"
          note: "CBRE share of Dutch grocery shopping; not quick-commerce share."
        - label: "Rapid-delivery grocery"
          value: "Described as small; spend not quantified"
          note: "USDA does not isolate rapid delivery from online grocery."
        - label: "Quick commerce / Flink SAM or SOM"
