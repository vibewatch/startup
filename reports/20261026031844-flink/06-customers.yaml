company:
  name: Flink
chapter:
  number: 6
  title: Customers
  summary: Public evidence describes Flink's app-based grocery top-up use case, a small number of named strategic relationships, and a 2026 company-reported population reach. It does not establish active-customer growth, repeat use, retention, or customer concentration; the reported 2021, undated, and 2026 scale measures use different denominators and should not be treated as a comparable adoption series.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      Flink is a consumer grocery and household-goods service accessed through a website and app, with orders fulfilled from local hubs. The clearest public use-case description is frequent top-up shopping: replacing forgotten items or making smaller, immediate purchases rather than relying only on a larger periodic grocery shop. TechCrunch's 2021 report described the target as younger consumers, people with small fridges, and shoppers who did not want or could not make a conventional weekly shop; this is a dated target profile, not a measured current cohort. The sources do not establish whether the payer is always the end user, the split between household and other users, or segment-level spending. Flink's 2026 release says its app delivers everyday groceries and essentials in Germany and the Netherlands, but reports population reach rather than active customers.
    claimRefs: [CU001, CU002, CU004, CU007]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption trajectory and metric quality
    body: >-
      The public scale observations are not a time series. TechCrunch reported 24 active cities across Germany, France, and the Netherlands in June 2021 and said Flink had not disclosed active-customer count. An undated case study by backend supplier Monterail later described Flink as reaching “up to 10 million customers” across 60 cities in four countries, without identifying the publication date or whether “customers” means registered, served, or active users. A March 2026 Flink press release instead reports that the service reaches more than 22.5 million people in its core markets; that is a population-reach denominator, not a customer count. Its average basket and typical delivery-time figures describe transaction size and service proposition, not order frequency or retention.
    claimRefs: [CU003, CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-relationships
    title: Named customer and partner proof
    body: >-
      The strongest named public evidence concerns strategic counterparties, not independently documented end-customer deployments. TechCrunch reported in 2021 that REWE would make Flink its preferred partner for smaller shopping trips; a later financing article again described REWE as an existing preferred partner, while a legal-adviser announcement says the REWE relationship had been in place since 2021. These sources support the existence of a relationship, but do not disclose order volumes, contract economics, exclusivity, or whether REWE is a paying customer. TechCrunch and the legal-adviser announcement also describe a Just Eat Takeaway partnership, but neither supplies a customer-volume outcome. The public record reviewed here therefore should not turn either relationship into proof of customer retention or commercial contribution.
    claimRefs: [CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-trust
    title: Durability, expansion, and customer risk
    body: >-
      No retained source supplies a current active-customer denominator, order-frequency series, repeat-purchase cohort, renewal measure, satisfaction score, or customer-level revenue split. Those omissions prevent a conclusion on retention, expansion within accounts, or concentration. Flink's March 2026 release says future German hub openings will be selective and conditioned on profitability and customer density; this is a company-stated plan rather than evidence that customer density or unit economics have been independently measured. NL Times reported in September 2026 that customer contact details and delivery instructions were among data stolen in a cyber incident, while the total number affected was not confirmed by Flink. The article relays an unconfirmed one-million figure and explicitly distinguishes it from confirmed customer counts. This creates a material trust and churn diligence question, not proof of resulting customer losses.
    claimRefs: [CU012, CU013, CU014, CU015]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and value evidence
    columns: [Segment or counterparty, Buyer / user / payer, Use case or relationship, Publicly reported scale or value, Evidence quality and limitation]
    rows:
      - [Consumer grocery shoppers, "Buyer and user; payer relationship not separately described", "App- or website-based grocery and household top-ups from local hubs", "No segment-specific count or spend disclosed", "Target profile described in 2021 reporting; not a current measured cohort"]
      - [Frequent top-up shoppers, "Household consumer; buyer and user may coincide", "Forgotten items, small-fridge needs, and immediate smaller baskets", "Flink's 2026 release states an average basket above EUR 45", "Use case and basket size are company-reported; no repeat-order denominator"]
      - [Germany and Netherlands residents, "Potential users within serviceable areas", "Everyday groceries and essentials delivered by app", "Company reports population reach above 22.5 million in core markets", "Reach is not the number of active or registered customers"]
      - [REWE Group and Just Eat Takeaway, "Strategic counterparties; end-customer payer status not established", "Retail / distribution partnerships described in public reporting", "No partner-specific customer volume, revenue, or order share disclosed", "Relationship evidence does not establish commercial scale or concentration"]
    notes: >-
      Public-source snapshot, not a customer census. Population reach, customer counts, basket value, and named partnerships are different measures and are not interchangeable. EUR basket figure is a company-issued March 2026 claim.
    claimRefs: [CU001, CU002, CU007, CU009, CU011]
  - id: TU002
    title: Adoption and customer metric chronology
    columns: [Metric, Value, Period / date, Source and issuer, Confidence, What it indicates, Missing denominator or caveat]
    rows:
      - ["Active cities and markets", "24 cities; Germany, France, and the Netherlands", "2021-06-03", "TechCrunch reporting", "Medium", "Historical operating footprint", "No active-customer or order count was disclosed in the same report"]
      - ["Customers reached, as worded by source", "Up to 10 million", "Undated", "Monterail partner case study", "Low", "Supplier-reported scale of Flink's app ecosystem", "Publication date and whether customers are registered, served, or active are unspecified"]
      - ["Population reach in core markets", "More than 22.5 million people", "2026-03-03", "Flink press release distributed by EuropaWire", "Low", "Company-stated potential population within its core-market footprint", "Not an active-customer count; methodology and serviceable-area definition are not given"]
      - ["Average basket size", "Above EUR 45", "2026-03-03", "Flink press release distributed by EuropaWire", "Low", "Company-stated transaction value", "Order sample, currency treatment, and period are not supplied"]
      - ["Typical delivery time", "Around 30 minutes", "2026-03-03", "Flink press release distributed by EuropaWire", "Low", "Company-stated service proposition", "No distribution, on-time rate, or measurement period is supplied"]
      - ["Active customers, repeat orders, retention, or concentration", null, "Not disclosed in retained evidence through 2026-10-26", "No comparable metric in assigned prefetched sources", "Unresolved", "Prevents evaluation of adoption durability and customer economics", "Requires company data with definitions, periods, cohorts, and customer/revenue denominators"]
    notes: >-
      This is a source-based partial chronology, not a growth curve. “Up to 10 million customers” is an undated supplier statement; 22.5 million is company-stated population reach. Neither can be combined with the 2021 city count or treated as a current active-customer figure. Null means unavailable in the assigned reviewed evidence, not zero.
    claimRefs: [CU003, CU005, CU006, CU007, CU008, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Named party, Segment / role, Publicly described use or deployment, Production vs. pilot, Reported outcome, Limitation]
    rows:
      - [REWE Group, "German grocery retailer; strategic partner and investor relationship reported", "Preferred partner for smaller shopping trips; partnership reported as dating from 2021", "Partnership described; no pilot or contract status disclosed", "No attributable order, retention, or customer outcome disclosed", "Does not establish whether REWE is a paying customer or quantify commercial contribution"]
      - [Just Eat Takeaway, "Delivery / distribution counterparty", "Preferred partnership described in 2024 financing coverage and legal-adviser announcement", "Partnership described; deployment scope not specified", "No attributable customer volume or operating outcome disclosed", "No commercial terms, exclusivity, or order-share data"]
      - ["Consumer shoppers (not individually named)", "End-user segment", "App-based grocery top-up and local-hub delivery", "Service described; no named user deployment or reference provided", "No measured retention, satisfaction, or repeat-use outcome", "Broad consumer use is not a named customer reference"]
    enumerationScope:
      coverage: partial
      basis: "Named public counterparties and consumer proof described in the assigned sources, 2021-2026; not an exhaustive customer list."
    notes: >-
      The assigned sources identify two named strategic counterparties but do not establish either as a quantified end-customer deployment. The consumer row records the boundary of the public evidence, not a named reference. No contract or customer outcome is inferred.
    claimRefs: [CU009, CU010, CU011, CU015]
