      whyItMatters: "The assigned sources describe strategic partnerships and aggregate consumer reach but do not demonstrate customer-specific production outcomes."
      diligencePath: "Obtain customer-approved references and deployment records distinguishing paying customer, supplier, investor, channel partner, pilot, and end user."
