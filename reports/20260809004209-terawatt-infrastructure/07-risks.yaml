- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Grid / interconnection risk
    - Site energization timing
    - Repeated slips beyond 6-12 months on flagship corridors
    - Recut revenue timing and valuation assumptions; escalate diligence on utility dependencies
  - - Reliability risk
    - Network uptime / MTTR disclosure
    - Failure to provide fleetwide metrics or evidence of worsening incident rates
    - Treat premium-service thesis as unproven; discount customer durability
  - - Technology-transition risk
    - MCS commercialization progress
    - No credible retrofit path or vendor roadmap while customer demand shifts to higher-power use cases
    - Raise capex reserve and obsolescence risk assumptions
  - - Financing risk
    - Capital access vs buildout pace
    - Need for incremental capital without commensurate site monetization progress
    - Assume dilution / leverage pressure; pause aggressive upside scenarios
  - - Customer-quality risk
    - Pilot-to-production conversion
    - Coalition and flagship accounts fail to convert into repeat, contracted usage
    - Downgrade adoption-quality score and concentration-adjusted revenue confidence
