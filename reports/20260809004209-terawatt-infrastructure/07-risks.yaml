- id: operational-and-technical-risk
  title: Operational and Technical Risk
  body: 'Operationally, TeraWatt is exposed to every part of the physical charging stack: space, power, equipment procurement, charger reliability, software orchestration, and field service. TeraWatt''s own posts admit that heavy-duty charging can require several megawatts of power, years of utility work, and switchboard lead times stretching to roughly 50 weeks. Utility Dive corroborates that distribution upgrades and interconnection reviews can take more than a year and that grid constraints remain a core blocker for commercial fleets. Technology transition adds another layer. TeraWatt is designing sites for eventual MCS migration, but both the company and CharIN acknowledge that the standard and commercialization path are still evolving. That means current site architecture may need expensive upgrades before long-haul heavy-duty charging reaches its intended performance envelope. Reliability is another serious risk. TeraWatt can point to a 32-minute repair anecdote and a thoughtful reliability
    framework, yet the public record still lacks audited fleetwide uptime, mean-time-to-repair, or cyber-control disclosure. As the network scales, single-site operational excellence may not automatically generalize.'
  claimRefs:
