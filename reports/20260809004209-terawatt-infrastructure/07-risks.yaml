- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'The public record does show meaningful mitigations. CMS-led load management, offsite charging for WAIRE compliance, corridor siting, vendor legal controls, and increasingly specific operations roles all reduce some execution risk. But the right underwriting posture is to treat these as mitigants, not risk eliminators. The most useful monitoring indicators are straightforward: interconnection timelines, actual site energization dates, charger uptime and repair distributions, coalition conversion into direct commercial contracts, top-customer concentration, and whether MCS readiness turns into live deployments rather than perpetual planning. There are also clear thesis-break triggers. If interconnection timelines stretch without software or storage offsets, if new sites repeatedly slip past guidance, if supplier or safety issues force material rework, if customer proofs stay pilot-heavy with little renewal evidence, or if financing needs outpace disclosed capital access, the investment
    case weakens quickly. Risk here is not a side note; it is the main variable that determines whether TeraWatt''s large strategic opportunity becomes durable infrastructure or stalled buildout.'
  claimRefs:
  - CR015
  - CR016
  - CR021
