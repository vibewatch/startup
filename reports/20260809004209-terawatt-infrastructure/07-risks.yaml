company:
  name: TeraWatt Infrastructure
chapter:
  number: 7
  title: Risks
  summary: 'TeraWatt''s risk profile is dominated by multi-megawatt infrastructure realities rather than consumer-app style issues: interconnection delays, regulatory dependency, capital intensity, technology migration, and execution across a young but expanding site network. Public evidence also shows credible mitigations—software-driven load management, policy alignment, vendor controls, and O&M discipline—but residual exposure remains high where grid timelines, customer durability, supplier choices, or financing conditions are outside the company''s direct control.'
sections:
- id: risk-overview-and-ranking
  title: Risk Overview and Severity Ranking
  body: The top risks to TeraWatt are not subtle. Building, operating, and financing commercial EV charging hubs creates a stack of linked exposures in which delays or failures at one layer can propagate into customer adoption, revenue timing, margin, and future fundraising. The most severe public risks are grid and permitting delays, capital intensity, technology transition from current DC fast charging to MCS-era infrastructure, customer-concentration opacity, and operational reliability at scale. Regulatory complexity is also unusually important because TeraWatt sells into sectors that are often subsidy-driven or compliance-driven, especially in California freight and warehouse markets. On the positive side, public materials show that management understands many of these risks and is explicitly trying to mitigate them through offsite charging, CMS-based power management, corridor siting, utility relationships, and formal vendor requirements. Even so, the residual risk burden remains material
    because many mitigation claims are company-authored and have not yet been independently audited at network scale.
  claimRefs:
  - CR007
  - CR010
  - CR014
  - CR015
  - CR017
  - CR020
  - CR027
  - CR028
  - CR040
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-legal-risk
  title: Regulatory and Legal Risk
  body: 'Regulatory risk is not just a background consideration for TeraWatt; it is part of the product economics. The company sells into fleet markets affected by California incentive programs, WAIRE compliance, heavy-duty emissions rules, and federal corridor planning. Its own writings note that warehouse operators can face fines if they fail WAIRE requirements and that custom plans are needed when on-site charging is impractical. The HVIP guide likewise shows how dependent some customers may be on dealer-managed point-of-sale vouchers, eligibility rules, and annual caps. At the company-operations layer, TeraWatt''s legal pages show that it imposes formal contractual and compliance expectations on vendors, including anti-bribery, trade controls, AML, confidentiality, rejection rights, indemnification, and insurance obligations. That is good governance, but it also highlights a real execution burden: any failure by suppliers, subcontractors, or partners to meet legal or quality standards
    can become TeraWatt''s customer problem. Public evidence does not reveal litigation or enforcement action today, but policy or supplier-compliance drift would directly affect deployment velocity and customer trust.'
  claimRefs:
