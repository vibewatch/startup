- id: dependency-financial-and-customer-risk
  title: Dependency, Financial, and Customer Risk
  body: TeraWatt's dependency web extends well beyond charger hardware. The company depends on utilities, permitting bodies, grant programs, equipment vendors, site-control economics, financing markets, and a relatively narrow set of flagship customer proofs. Financially, that is important because the company is still building an infrastructure category that consumes capital before customer usage is fully mature. The 2026 debt facility helps, but it also highlights continuing reliance on external capital rather than self-funded expansion. Public customer proof is real—especially PepsiCo and Desert Cab—but public customer durability proof is thin, and coalition-style programs should not be mistaken for locked-in recurring revenue. This means the visible commercial story may overstate diversification and understate concentration or pilot-conversion risk. Competitive and substitution risk also matter. Customers can self-build, hybridize on-site and offsite charging, or use alternative high-power
    providers if TeraWatt cannot keep pace on reliability, location, or economics. In effect, TeraWatt's business has to keep solving infrastructure problems faster than customers or competitors can work around them.
  claimRefs:
  - CR022
  - CR026
