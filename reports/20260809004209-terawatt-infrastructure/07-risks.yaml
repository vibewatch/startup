callouts:
- calloutType: risk
  title: Grid timing is the master risk
  body: Almost every other downside pathway becomes easier to manage if sites energize on time and at planned power levels. If they do not, customer adoption, capital efficiency, and even technology timing all degrade at once.
  claimRefs:
  - CR014
  - CR015
  - CR024
  - CR040
- calloutType: insight
  title: TeraWatt's own public materials are unusually candid about infrastructure pain
  body: The company openly discusses power shortages, soft costs, equipment lead times, and fleet economics. That transparency is useful for diligence, but it also confirms that execution difficulty is structural rather than hypothetical.
  claimRefs:
  - CR013
  - CR014
  - CR022
  - CR023
