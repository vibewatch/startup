chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    TeraWatt participates in a narrower market than generic consumer EV charging: depot and corridor infrastructure,
    software, and operations for commercial fleets that need high utilization, reliable uptime, and multi-megawatt
    power. Public evidence supports a broad top-down tailwind—McKinsey's $15 billion U.S. fleet-charging-services
    opportunity by 2030, Joint Office planning for 30-40 million EVs, and federal freight-corridor strategy through
    2040—but also shows why market capture is hard: grid interconnection can take more than a year, heavy-duty truck
    economics still depend on policy and route fit, and the AV demand spike that benefits TeraWatt is real but still
    concentrated.
sections:
  - id: market-boundary-and-substitutes
    title: "Market Boundary, Included Spend, and Substitutes"
    body: >-
      The relevant market for TeraWatt is not “all EV charging,” and using that phrase without qualification obscures
      more than it clarifies. TeraWatt monetizes a combination of site control, power procurement, depot development,
      charging hardware orchestration, uptime operations, and data tooling for fleets. That means the included spend is
      commercial depot charging, corridor top-up charging for medium- and heavy-duty vehicles, ridehail and autonomous
      fleet depots, managed charging, interconnection-ready site development, and related operational software. The
      market excludes home charging, most destination charging for private drivers, OEM vehicle revenue, and much of the
      one-off workplace charging activity that does not require a third-party fleet-infrastructure platform.

      The substitute set is also broader than incumbent charging networks. Fleets can build and operate their own depots,
      rely on utility make-ready programs plus in-house operations, rent third-party shared depots, or postpone
      electrification altogether by keeping internal-combustion assets on the road. For autonomous operators, the
      substitute question becomes even sharper because depot location, data offload, turnaround workflow, maintenance
      adjacency, and power density all affect cost per mile. That is why TeraWatt's own market narrative has shifted
      from generic fleet charging toward purpose-built AV and high-utilization commercial sites: the economic problem it
      solves is less “plug availability” than “operationally reliable electrified miles in constrained locations.”
    claimRefs:
      - CM001
      - CM002
      - CM034
      - CM035
      - CM036
      - CM037
