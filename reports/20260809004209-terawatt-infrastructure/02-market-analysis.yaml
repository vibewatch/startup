  - id: buyers-payers-and-adoption-paths
    title: "Buyer Segments, Budget Owners, and Adoption Paths"
    body: >-
      The buyer map for fleet charging is fragmented, which is a feature rather than a bug. A drayage carrier cares
      about dwell time, pull-through geometry, and getting in and out of polluted port corridors without adding labor or
      route friction. A ridehail or autonomous operator cares about deadhead miles, launch geography, data transfer,
      cleaning and maintenance workflow, and enough dependable power to keep utilization high. Municipal and school-bus
      operators care more about grants, reporting, and planned depot conversions, while utilities focus on hosting
      capacity, peak demand, and interconnection queues. Ports and public authorities often matter because they control
      land, freight access, or grant eligibility even when they are not the day-to-day user.

      These differences create different adoption paths. The State of Sustainable Fleets project shows early adoption is
      already spread across school, municipal, urban delivery, refuse, utility, transit, short-haul, and long-haul
      sectors, but not on the same timeline or with the same economics. TeraWatt's own materials suggest its strongest
      fit is where the customer would rather outsource infrastructure complexity than build a bespoke depot: shared truck
      lanes, ridehail depots near airports and dense demand zones, and AV operations where site location directly changes
      cost per mile. Adoption therefore runs through a funnel of route fit, utility viability, site control, and
      financial confidence rather than through a simple vehicle-sales conversion ratio.
