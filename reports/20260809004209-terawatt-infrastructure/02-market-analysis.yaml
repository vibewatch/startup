callouts:
  - calloutType: insight
    title: "The market is large, but the served market is selective"
    body: >-
      Headline EV adoption figures are directionally helpful, yet TeraWatt's real addressable market is the smaller
      slice where route fit, site control, power access, and willingness to outsource charging operations intersect.
    claimRefs:
      - CM004
      - CM005
      - CM034
      - CM035
  - calloutType: strength
    title: "Federal freight strategy reduces coordination risk"
    body: >-
      The freight-corridor strategy, CFI grants, and Joint Office funding signals do not guarantee demand, but they do
      lower one of the hardest market barriers: uncertainty over where early public and private infrastructure should go.
    claimRefs:
      - CM015
      - CM016
      - CM020
      - CM021
      - CM022
  - calloutType: risk
    title: "Grid readiness remains the gating variable"
    body: >-
      Even when vehicles, grants, and customer interest are available, utility upgrades and interconnection reviews can
      stall multi-megawatt projects for a year or more. That makes planning and managed charging central to the business
      case.
    claimRefs:
      - CM025
      - CM026
      - CM027
      - CM028
