  - id: adoption-constraints-and-bear-cases
    title: "Adoption Constraints and Bear Cases"
    body: >-
      The principal constraint is not ideological resistance to electrification; it is execution friction. Utility Dive's
      2026 analysis argues that fleet projects most often stall on grid integration rather than on charger procurement,
      and it cites multi-megawatt upgrade and interconnection timelines that can exceed a year. That insight lines up
      with TeraWatt's own long-lead siting behavior and with the Joint Office's emphasis on utility and regulatory
      planning. It also explains why managed charging, storage, and vehicle-grid integration are central product layers
      rather than nice-to-have software wrappers.

      The bearish cases are straightforward. Freight recessions delay vehicle purchases and soften customer urgency.
      Heavy-duty EV adoption outside China still sits at a low base, which means corridor infrastructure can be early to
      demand if developers overbuild. Autonomous fleets are promising, but concentration risk remains if AV demand grows
      slower than expected in the specific cities where depots get financed first. Policy support may shorten payback
      periods, yet the market still depends on route-compatible use cases, interconnection lead times, and sophisticated
      load management. The result is a market with strong structural tailwinds but a slower, more operationally gated
      adoption curve than generic EV headlines imply.
