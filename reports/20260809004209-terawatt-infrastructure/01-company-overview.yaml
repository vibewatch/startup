company:
  name: TeraWatt Infrastructure
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    TeraWatt Infrastructure is a San Francisco-based EV fleet charging infrastructure company that has evolved from
    a property-and-power thesis incubated by Keyframe in 2018 into a full-stack operator focused on autonomous and
    commercial electric fleets. Public evidence through August 9, 2026 shows more than $1 billion of disclosed 2022
    institutional capital, a first commercial-bank facility of up to $300 million in June 2026, five opened sites,
    80+ employees, and rapid AV-oriented expansion, but still-limited disclosure on valuation, board governance,
    revenue, and the exact split between corporate equity and asset-level financing.
sections:
  - id: identity-and-business-model
    title: "Identity, Founding Arc, and Business Model"
    body: >-
      TeraWatt Infrastructure presents itself as a full-stack charging-infrastructure owner and operator for
      autonomous-vehicle, heavy-duty logistics, and broader commercial EV fleets rather than as a charger vendor. The
      company’s public materials place headquarters in San Francisco and describe a model that acquires or leases
      strategically located land, secures power, develops charging depots, layers in reservation and charge-management
      software, and operates the sites so fleets can convert charging from a capital project into an operating expense.
      That positioning matters because the company is trying to solve a compound bottleneck: land, permitting, grid
      interconnection, charging hardware, uptime operations, and customer workflow integration all need to be aligned
      before a fleet can scale.

      The founding chronology is best described as staged rather than cleanly one-date. The company’s 2022 financing
      announcement said Keyframe’s team began building TeraWatt in 2018 and named Benjamin Birnbaum, John Rapaport,
      and Ethan Goldsmith as founders, while official 2026 leadership materials identify Neha Palmer as CEO and
      co-founder and the About page describes founders buying land and planning around electrification bottlenecks by
      2021. The most defensible synthesis is that TeraWatt’s investment thesis and incubation started in 2018, the
      company emerged from stealth in May 2021, and the operating business today is centered on Palmer’s energy and
      infrastructure background. Public sources do not disclose revenue, audited operating metrics, or an exact legal
      founding date, so those remain diligence gaps rather than numbers to infer.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO012
      - CO013
      - CO040
      - CO043
      - CO050
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003
  - id: leadership-and-governance
    title: "Leadership Bench and Governance Transparency"
    body: >-
      The leadership bench is strongest where TeraWatt most needs credibility: energy-intensive infrastructure,
      mobility, product strategy, real-estate development, and operating reliability. Neha Palmer’s background spans
      natural-gas engineering and Google’s energy strategy work for infrastructure-heavy assets; Mike Englhard brings
      large-scale real-estate development experience; and the 2026 executive additions added capital-markets, product,
      and business-development depth through former Uber, Covariant, Palmetto Solar, Snowflake, Myst AI, Lyft,
      Woven, and Opower executives. Public biographies also show functional leaders in technology, operations, and
      people, suggesting the company is no longer purely founder-driven even though Palmer remains the central public
      face for strategy, fundraising, and customer trust.

      Governance transparency is weaker than executive-bio transparency. Official pages enumerate executives, but the
      retained public evidence does not publish a full board roster, ownership-control structure, or investor-governance
      map. That matters because TeraWatt has raised very large pools of capital relative to most private charging
      startups, and the mix of infrastructure-oriented investors implies non-trivial governance and downside-rights
      questions. The absence of public board detail does not indicate a problem by itself, but it does mean that key
      questions around board independence, veto rights, related-party transactions, and refresh cadence would need to
      be resolved in a data room rather than from public sources.
    claimRefs:
      - CO002
      - CO013
      - CO014
      - CO041
      - CO042
    tableRefs:
      - TO002
  - id: capital-and-investors
    title: "Capital Formation and Investor Signaling"
    body: >-
      TeraWatt’s capital story is unusually large for private EV charging infrastructure. In September 2022 the company
      announced more than $1 billion of institutional capital from Vision Ridge Partners plus follow-on commitments
      from Keyframe Capital and Cyrus Capital, on top of a previously raised $100 million seed round. Independent
      coverage from TechCrunch, Crunchbase News, and Canary Media all corroborated the size of the raise, while
      Canary highlighted an important caveat: management did not disclose how much of the headline amount represented
      corporate equity versus infrastructure or asset-level capital. That distinction matters for dilution analysis,
      return modeling, and comparisons with software or equipment startups, because a dollar earmarked for project
      assets is not economically equivalent to unrestricted operating equity.

      In June 2026 TeraWatt added a new layer to the stack with a five-year senior secured debt facility for up to
      $300 million, split between $150 million committed and a $150 million incremental option. RBC Capital Markets led
      the syndicate, with SMBC and UBS also participating, and the company characterized it as its first commercial bank
      facility. The move is strategically important: it signals that at least part of the business has matured from
      venture-style backing toward infrastructure-finance underwriting. Even so, public sources still do not disclose a
      post-money valuation for either the 2022 capital raise or the 2026 debt-supported enterprise, leaving one of the
      most important diligence inputs unresolved.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO019
      - CO020
      - CO021
