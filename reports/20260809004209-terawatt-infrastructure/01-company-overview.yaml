  - id: adverse-considerations-and-open-questions
    title: "Adverse Considerations and Open Questions"
    body: >-
      The strongest adverse reading of TeraWatt is not that the company lacks ambition, but that it is trying to scale
      an inherently capital-intensive, locally constrained business into markets that are themselves still uncertain.
      TechCrunch’s early coverage already flagged grid-capacity stress as a structural constraint on fleet charging.
      The CEC report shows how site acquisition, permitting, utility work, and commissioning unfold over long time
      windows even for one funded California depot. A more skeptical 2026 article described the robotaxi infrastructure
      layer as “dull, expensive work” dependent on land, power, zoning, and depot access in the right neighborhoods,
      and said only about 3% of TeraWatt’s screened sites pass the full location-power-zoning-economics filter.

      Those constraints intersect with disclosure gaps. Management has not published a public revenue line, a customer
      concentration map, a board roster, or a fully specified valuation. The 2022 funding headline also obscures the
      mix of corporate equity versus project capital, complicating comparisons with peers. None of these gaps prove the
      model is weak; in fact, the new bank facility and expanding site network suggest sophisticated counterparties are
      increasingly comfortable with the asset base. But they do keep the company in a “high-potential, still opaque”
      bucket where underwriting depends as much on execution discipline, utility coordination, and customer durability as
      on the headline amount of capital raised.
    claimRefs:
      - CO012
      - CO023
      - CO038
      - CO039
      - CO042
