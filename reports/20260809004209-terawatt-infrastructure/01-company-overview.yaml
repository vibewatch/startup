callouts:
  - calloutType: strength
    title: "Capital stack is starting to look infrastructure-grade"
    body: >-
      The June 2026 bank facility matters beyond its size. It suggests TeraWatt has assembled enough site quality,
      underwriting discipline, and lender confidence to tap commercial-bank debt rather than relying solely on venture
      and climate-infrastructure equity.
    claimRefs:
      - CO019
      - CO020
      - CO021
      - CO023
  - calloutType: risk
    title: "Physical bottlenecks, not charger branding, are the main execution risk"
    body: >-
      Multiple sources converge on the same constraint set: land in the right locations, grid-ready power, permitting,
      and dependable operations. If any one of those slips, TeraWatt's network expansion, customer economics, and site
      utilization can all deteriorate quickly.
    claimRefs:
      - CO026
      - CO038
      - CO039
  - calloutType: insight
    title: "The AV pivot is an opportunity and a concentration question"
    body: >-
      TeraWatt's 2026 roadmap makes clear that autonomous fleets are where customer demand is strongest today. That can
      create differentiated advantage, but it also raises the importance of customer concentration and robotaxi adoption
      timing versus the original trucking-centered investment thesis.
    claimRefs:
      - CO015
      - CO037
      - CO045
