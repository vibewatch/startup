  - id: footprint-customers-and-milestones
    title: "Operating Footprint, Early Customers, and Milestones"
    body: >-
      Public milestones show TeraWatt moving from concept and land banking into operating depots. The company came
      out of stealth in May 2021, announced the $1B-plus financing in September 2022, initiated site acquisition for
      its CEC-supported Inglewood project in November 2022, broke ground on the Rancho Dominguez truck site in
      November 2023, opened the Inglewood light-duty site in October 2024, opened Rancho Dominguez in April 2025, and
      celebrated its fifth site opening in 2026. The California Energy Commission’s final report is especially useful
      because it grounds one site in hard dates, budget numbers, and commissioning milestones rather than marketing
      language alone.

      Customer disclosure remains selective but materially better than a generic “fleet operator” narrative. Public
      sources name PepsiCo, Dreaded Trucking, Hight Logistics, Quick Container Drayage, Southern Counties Express,
      Tradelink Transport, and WestCoast Trucking & Warehousing as early Rancho customers; official blogs also discuss
      Desert Cab, Velocity Vehicle Group, and AV fleet needs; and an independent 2026 article says Waymo is a customer
      and frames Inglewood as part of a third-party-operated robotaxi depot model. The company’s 2026 roadmap states it
      has delivered 68 million miles of clean EV range, abated 27 million kilograms of CO2, grown to 80+ employees,
      and is developing projects that would open 12 new markets and double its network. Those are promising indicators,
      but they are still company-reported rather than audited traction metrics.
    claimRefs:
