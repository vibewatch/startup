  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-gap
      missingEvidence: "Current board roster, board observers, investor veto rights, and ownership-control summary."
      whyItMatters: "Governance determines control, dilution protection, and how infrastructure investors influence capital allocation."
      diligencePath: "Request cap table, board consents, investor-rights agreement, and latest board deck in the data room."
      relatedQuestionRefs: [QO007, QO026]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: valuation-gap
      missingEvidence: "Exact post-money valuation for the 2022 financing and any updated internal or external valuation supporting the 2026 debt raise."
      whyItMatters: "Without a defensible valuation, return underwriting, dilution analysis, and comparable-multiple benchmarking remain weak."
      diligencePath: "Request financing term sheets, valuation memos, latest preferred-share price, and any third-party fairness or lender valuation materials."
      relatedQuestionRefs: [QO011]
    - type: private-evidence-only
      severity: material
      topic: revenue-gap
      missingEvidence: "Revenue, contracted backlog, utilization, and customer concentration by site or segment."
      whyItMatters: "The business is capital intensive, so debt serviceability and equity upside depend on utilization and margin quality rather than headline site counts."
      diligencePath: "Request site-level revenue and utilization reports, lender model extracts, customer ARR or contracted-MWh data, and top-customer exposure analysis."
      relatedQuestionRefs: [QO014, QO015, QO026]
    - type: conflicting-data
      severity: minor
      topic: founding
      missingEvidence: "A definitive incorporation date and legal-entity history that reconcile the 2018 incubation claim with the 2021 stealth-exit narrative."
      whyItMatters: "Founding chronology affects how investors interpret maturity, time-to-scale, and pre-launch capital deployment."
      diligencePath: "Pull Delaware/California entity records and earliest board or shareholder consents."
      relatedQuestionRefs: [QO003]
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-founder-table
      missingEvidence: "A complete, as-of-2026 list of founders, senior executives, and board members with current responsibilities."
      whyItMatters: "Leadership concentration and succession risk cannot be fully assessed from partial public bios."
      diligencePath: "Request org chart, board roster, and leadership-team biographies used in financing or lender materials."
      relatedQuestionRefs: [QO004, QO006, QO007]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: milestone-table
      missingEvidence: "A complete site roster with opening dates, capex, power capacity, utilization, and customer anchors for every TeraWatt location."
      whyItMatters: "Public milestones show momentum, but not enough to determine whether the network is dense, repeatable, or economically mature."
      diligencePath: "Request internal site list, GIS map, site scorecards, and project pipeline tracker used for capital planning."
