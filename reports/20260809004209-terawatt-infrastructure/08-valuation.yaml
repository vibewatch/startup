company:
  name: TeraWatt Infrastructure
chapter:
  number: 8
  title: Valuation
  summary: TeraWatt looks strategically important and commercially plausible, but the public record still supports a price-sensitive diligence posture rather than a high-conviction buy call. The combination of large market potential, real customer proof, and an infrastructure-owner product surface is offset by sparse revenue disclosure, capital intensity, grid and execution risk, and limited visibility into current valuation, so the most defensible recommendation on public evidence is research-more with medium confidence, high risk, and a stretched valuation stance at any aggressive private-market price.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: 'The company-quality story and the entry-price story are not the same, and that distinction matters here. TeraWatt has accumulated enough evidence to look strategically relevant: a large market, a credible full-stack charging product, flagship customer proof, and continued access to institutional and bank capital. But public evidence still does not disclose revenue, margin, utilization, cash runway, renewal rates, or current preferred-equity overhang. Without those inputs, it is hard to underwrite a premium private valuation with conviction. The right recommendation on public evidence is therefore research-more rather than buy or avoid. That stance does not mean the business is weak; it means the public record is too sparse to support price-insensitive enthusiasm. If a disciplined investor could access the company at a materially conservative valuation with clean preference terms and verify site-level economics, the recommendation could improve. Until then, the burden of proof sits
    on economic visibility, not on market ambition.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
  - CV027
  - CV029
  - CV030
  - CV038
  - CV039
  tableRefs:
