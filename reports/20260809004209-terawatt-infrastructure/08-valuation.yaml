- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  enumerationScope:
    coverage: partial
    basis: Covers the public and quasi-public comparables that best frame TeraWatt's valuation debate on available evidence; it is not exhaustive and omits private marks that are not publicly supportable.
  rows:
  - - ChargePoint
    - FY2026 revenue and public-equity performance
    - Revenue $411.2M; GAAP net loss $220.2M
    - Shows that large charging platforms can scale revenue but still struggle on profitability
    - Business mix differs and public-market sentiment is volatile
  - - EVgo
    - Charging network + eXtend revenue model
    - Public filing shows revenue from development, equipment, and ongoing O&M / networking
    - Useful model analog for blended infrastructure plus service economics
    - Public-network exposure and subsidies differ from TeraWatt's fleet orientation
  - - Voltera / private capital in truck charging
    - Private funding status
    - Debt and infrastructure capital interest publicly visible
    - Supports the idea that capital markets see value in charging-infrastructure ownership
    - Funding headlines are not valuation proof or margin proof
  - - WattEV
    - Depot utilization and megawatt expansion
    - ~700 MWh/month depot utilization drove expansion need
    - Illustrates upside if heavy-duty sites reach real throughput
    - Single-site usage is not a TeraWatt valuation mark
  - - Self-build fleet alternative
    - On-site charging, solar, storage, and hybrid strategies
    - Large fleets can assemble meaningful charging themselves
    - Frames substitution risk and customer price sensitivity
    - Not a company valuation comparable in the narrow sense
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV036
  notes: Comparable rows are included to bound expectations and business-model analogies, not to claim a single precise multiple for TeraWatt.
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Site energization slippage
    - Flagship sites repeatedly miss timing by >6-12 months
    - Delays revenue, raises capex burden, weakens customer confidence
    - Downgrade timing assumptions and raise discount rate
  - - No economic disclosure improvement
    - No site-level utilization, pricing, or margin visibility after diligence request
    - Prevents valuation support from catching up to strategic narrative
    - Maintain research-more / pass on premium pricing
  - - Pilot-heavy customer mix persists
    - Coalition and flagship accounts do not convert into durable recurring usage
    - Weakens adoption-quality and customer-durability assumptions
    - Lower revenue certainty and compress scenario weights
  - - Adverse financing terms
    - Next capital round adds punitive dilution or restrictive obligations
    - Transfers value away from new investors or common equity
    - Reassess ownership economics and downside protection
  - - MCS readiness stalls
    - No credible retrofit / upgrade plan as truck charging needs rise
    - Raises obsolescence risk for current sites
    - Increase capex reserve and lower terminal-multiple confidence
  claimRefs:
  - CV019
  - CV028
  - CV031
  - CV032
  - CV035
  notes: Triggers are chosen because they directly change valuation support, not merely narrative confidence.
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Site economics
    - Monthly site P&Ls, kWh sold, utilization, opex, maintenance, demand charges
    - Needed to judge asset turns and margin path
    - Request management operating dashboards by mature site cohort
  - - Pricing architecture
    - Per-kWh terms, monthly minimums, reservation fees, service charges, discounts
    - Needed to bridge value proposition to realized revenue quality
    - Review customer contracts and pricing memos
  - - Customer quality
    - Top-account concentration, renewal schedule, expansion history, pilot conversion funnel
    - Needed to judge durability and concentration
    - Review CRM / account-level revenue bridge
  - - Capital structure
    - Current cap table, preference stack, debt covenants, project-finance obligations
    - Needed to evaluate dilution and downside protection
    - Request latest board deck and financing summary
  - - Technology roadmap
    - MCS retrofit plan, vendor stack, hardware warranty and upgrade exposure
    - Needed to judge future capex and obsolescence risk
    - Request product-roadmap and supplier files
  claimRefs:
  - CV027
  - CV028
  - CV035
  - CV040
  notes: Every open diligence ask is tied to a variable that would move valuation or recommendation materially.
