- id: scenario-logic-and-comps
  title: Scenario Logic and Comparable Set
  body: 'The best way to value TeraWatt on public evidence is through scenario discipline rather than point-estimate precision. The bull case assumes that multi-tenant and built-to-suit sites scale quickly, utility and supplier friction is manageable, customer pilots convert into recurring usage, and infrastructure capital remains available without punitive dilution. The bear case assumes the opposite: slower heavy-duty EV adoption, interconnection slippage, uneven uptime at a larger network, and continued economic opacity that prevents premium pricing from holding. Public comparables offer useful reference points but not clean one-to-one valuation anchors. ChargePoint and EVgo show how difficult it can be to translate charging relevance into durable profits. Privately financed peers such as Voltera, Greenlane, and WattEV confirm capital-market interest, but they do not solve TeraWatt''s own disclosure gap. That is why the scenario table and sensitivity chart matter more than any single
    comp multiple: the investor is really underwriting future proof, not current financial clarity.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV031
  - CV032
  - CV033
  - CV036
