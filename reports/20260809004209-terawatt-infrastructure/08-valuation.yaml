- id: why-the-thesis-is-real
  title: Why the Thesis Is Real
  body: 'The investable part of the thesis is not hype alone. TeraWatt has real strategic ingredients: an integrated charging-as-a-service model, multiple deployment modes, policy alignment, and customer proof in demanding commercial segments. The CaaS and full-spectrum materials describe a model that can convert a fleet''s infrastructure capex burden into an operating expense, while the product and customer chapters show that PepsiCo, Desert Cab, and I-10 corridor participants are not abstract market targets. The market backdrop is also credible. McKinsey argues that U.S. fleet-charging services could become a $15 billion annual market by 2030, and the IEA shows heavy-duty electrification is progressing even if unevenly. TeraWatt''s strategic posture as an infrastructure owner and intermediary among utilities, capital markets, and fleets makes sense in a world where customers do not want to self-develop every site. Those are meaningful positives. They explain why the company can deserve
    close tracking and why a large eventual outcome is plausible if economics and execution prove out.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV012
  - CV021
  - CV023
  - CV024
  - CV025
  tableRefs:
  - TV002
  figureRefs:
  - FV004
- id: why-valuation-support-is-thin
  title: Why Valuation Support Is Still Thin
  body: 'The anti-thesis is equally important. TeraWatt is operating in a category where ambition routinely runs ahead of disclosed economics. Public charging and fleet-charging peers demonstrate that revenue can grow while losses, capex demands, and financing needs remain heavy. TeraWatt''s own content acknowledges capital intensity, long lead times, grid constraints, charging unreliability in the wider market, and the need for phased adoption or hybrid onsite-offsite architectures. The company also does not publicly disclose the data that matter most for valuation discipline: site-level utilization, realized pricing, gross margin, customer concentration, cap table terms, debt covenants, and current fair-value marks. That means even a reasonable business can be a bad investment if the price assumes infrastructure certainty and software-style multiples before the economics are demonstrated. In other words, the anti-thesis is not that TeraWatt has no value; it is that the public record does
    not justify paying up for value that has not yet been evidenced.'
  claimRefs:
  - CV009
  - CV013
  - CV014
  - CV015
  - CV016
  - CV019
  - CV020
  - CV026
  - CV027
  - CV028
