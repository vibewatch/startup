- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Rapid corridor energization, multi-tenant utilization inflects, coalition members convert, capital remains available on reasonable terms
    - Supports top end of broad private-infrastructure / platform range; upside depends on future revenue proof not visible today
    - Requires execution, financing, and demand all to cooperate
    - low-medium
  - - Base
    - Steady site rollout, mixed customer conversion, no major regulatory shock, but economic disclosure remains incomplete
    - Supports continued tracking and a conservative valuation range rather than immediate buying urgency
    - Could still disappoint if pricing or utilization are weaker than hoped
    - medium-high
  - - Bear
    - Heavy-duty adoption remains slow, interconnection delays persist, MCS retrofit costs rise, dilution increases
    - Would compress valuation toward lower-end infrastructure asset logic with muted exit upside
    - Capital intensity and opacity amplify downside
    - medium
  - - Watch-list upgrade case
    - Management opens the books on site P&Ls, cap table, renewal behavior, and debt headroom
    - Could move recommendation toward track or buy only with sufficient discount to remaining risk
    - Depends on diligence access more than marketing narrative
    - medium
