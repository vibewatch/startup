  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "other charging companies." TeraWatt's buyer is trying to
              solve a job that combines land, grid capacity, charger uptime, reservation logic, fleet operations,
              security, and often cleaning, staging, or data-offload workflows. That makes the nearest rivals other
              full-stack infrastructure platforms such as Greenlane, Voltera, Forum Mobility, and WattEV, all of which
              sell charging access as an operating system for fleets rather than as a stand-alone charger. These players
              differ on route focus: Greenlane is explicitly building public heavy-duty corridors, while TeraWatt,
              Voltera, Forum, and WattEV lean more toward depots, urban freight, or vertically integrated fleet
              operations.

              A second ring includes public-network and enterprise-charging incumbents such as ChargePoint, EVgo, and
              Electrify Commercial. They compete for the same fleet budget when customers prefer to own sites, rely on
              broader public-network access, or mix dedicated charging with route charging. The status quo remains
              self-build or delayed electrification, not simply another charging network. For underwriting, the core
              question is whether TeraWatt's site-control model is sufficiently differentiated to defend against both
              public-network scale and other capital- intensive depot developers.
