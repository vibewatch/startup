chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Arc, and Business Model
        blocks:
          - type: paragraph
            body: >-
              TeraWatt Infrastructure presents itself as a full-stack charging-infrastructure owner and operator for
              autonomous-vehicle, heavy-duty logistics, and broader commercial EV fleets rather than as a charger
              vendor. The company’s public materials place headquarters in San Francisco and describe a model that
              acquires or leases strategically located land, secures power, develops charging depots, layers in
              reservation and charge-management software, and operates the sites so fleets can convert charging from a
              capital project into an operating expense. That positioning matters because the company is trying to solve
              a compound bottleneck: land, permitting, grid interconnection, charging hardware, uptime operations, and
              customer workflow integration all need to be aligned before a fleet can scale.

              The founding chronology is best described as staged rather than cleanly one-date. The company’s 2022
              financing announcement said Keyframe’s team began building TeraWatt in 2018 and named Benjamin Birnbaum,
              John Rapaport, and Ethan Goldsmith as founders, while official 2026 leadership materials identify Neha
              Palmer as CEO and co-founder and the About page describes founders buying land and planning around
              electrification bottlenecks by 2021. The most defensible synthesis is that TeraWatt’s investment thesis
              and incubation started in 2018, the company emerged from stealth in May 2021, and the operating business
              today is centered on Palmer’s energy and infrastructure background. Public sources do not disclose
              revenue, audited operating metrics, or an exact legal founding date, so those remain diligence gaps rather
              than numbers to infer.
