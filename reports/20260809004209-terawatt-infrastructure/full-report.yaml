            body: >-
              The strongest named customer proof combines public logos with concrete deployment details. PepsiCo is not
              just a logo: the company disclosed a three-year deal for its vehicles to use TeraWatt's multi-tenant
              Rancho Dominguez site, while PepsiCo's own Run on Less materials show intensive Tesla Semi operations in
              Sacramento and the sort of high-power, high-utilization use case that makes offsite charging valuable.
              Desert Cab is another meaningful proof point because public sources describe both the customer
              relationship and operational results: charging-management software, operations and maintenance support,
              driver education, smart charging, remote troubleshooting, and rarely out-of-service chargers. The I-10
              corridor coalition is a different category of proof. It is strategic and high quality because the member
              list is strong, but it is still pilot-oriented and planned for 2027 rather than fully deployed revenue at
              scale today. Velocity Vehicle Group is better interpreted as a channel and service partner than as a
              direct paying charging customer, but it still matters because it lowers EV adoption friction for fleets by
              linking TeraWatt charging with EV-certified truck maintenance coverage.
            claimRefs:
