      - number: '2.5'
        title: Adoption Constraints and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The principal constraint is not ideological resistance to electrification; it is execution friction.
              Utility Dive's 2026 analysis argues that fleet projects most often stall on grid integration rather than
              on charger procurement, and it cites multi-megawatt upgrade and interconnection timelines that can exceed
              a year. That insight lines up with TeraWatt's own long-lead siting behavior and with the Joint Office's
              emphasis on utility and regulatory planning. It also explains why managed charging, storage, and
              vehicle-grid integration are central product layers rather than nice-to-have software wrappers.

              The bearish cases are straightforward. Freight recessions delay vehicle purchases and soften customer
              urgency. Heavy-duty EV adoption outside China still sits at a low base, which means corridor
              infrastructure can be early to demand if developers overbuild. Autonomous fleets are promising, but
              concentration risk remains if AV demand grows slower than expected in the specific cities where depots get
              financed first. Policy support may shorten payback periods, yet the market still depends on
              route-compatible use cases, interconnection lead times, and sophisticated load management. The result is a
              market with strong structural tailwinds but a slower, more operationally gated adoption curve than generic
              EV headlines imply.
            claimRefs:
              - CM011
              - CM013
              - CM017
              - CM025
              - CM026
              - CM027
              - CM028
              - CM031
              - CM032
              - CM038
              - CM041
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is large, but the served market is selective
            body: >-
              Headline EV adoption figures are directionally helpful, yet TeraWatt's real addressable market is the
              smaller slice where route fit, site control, power access, and willingness to outsource charging
              operations intersect.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM034
              - CM035
          - type: callout
            title: Federal freight strategy reduces coordination risk
            body: >-
              The freight-corridor strategy, CFI grants, and Joint Office funding signals do not guarantee demand, but
              they do lower one of the hardest market barriers: uncertainty over where early public and private
              infrastructure should go.
            calloutType: strength
            claimRefs:
              - CM015
              - CM016
              - CM020
              - CM021
              - CM022
          - type: callout
            title: Grid readiness remains the gating variable
            body: >-
              Even when vehicles, grants, and customer interest are available, utility upgrades and interconnection
              reviews can stall multi-megawatt projects for a year or more. That makes planning and managed charging
              central to the business case.
            calloutType: risk
            claimRefs:
