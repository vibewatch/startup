        title: Revenue Model and Monetization Stack
        blocks:
          - type: paragraph
            body: >-
              TeraWatt's public materials consistently describe a monetization model built around taking on
              infrastructure complexity for fleets, not around selling chargers one unit at a time. The company says it
              acquires the real estate, secures power, installs charging equipment, layers software and operations on
              top, and then lets fleet customers consume the result as an operating expense. The trucking and
              autonomous-fleet pages imply at least four monetizable layers: dedicated or shared charging access,
              reservation and site-operations support, uptime-backed service levels, and a newer product layer around
              data operations and energy management. The company also markets lower cost-per-mile and tighter
              interaction with the grid as explicit customer value, which suggests pricing can reflect avoided downtime
              and avoided capex rather than only per-kWh energy spread.

              What is not public is equally important. No retained source discloses list pricing, blended contract
              structure, revenue mix across AV versus trucking, or whether software and energy-management tools are
              separately billed or bundled. The revenue model is understandable qualitatively, but its quality, margin
              profile, and recognition timing remain undisclosed.
