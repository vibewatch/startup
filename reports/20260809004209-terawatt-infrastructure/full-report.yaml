      - number: '6.4'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Customer durability is the weakest part of the public evidence set. TeraWatt clearly shows named
              relationships, but it rarely shows renewals, expansion revenue, usage-based cohorts, or customer economics
              after the initial win. The only explicit public contract duration in the retained sources is the
              three-year PepsiCo arrangement. Desert Cab supplies strong qualitative satisfaction evidence through owner
              quotes and operational outcomes, but no contract value, renewal term, or expansion revenue. The I-10
              coalition signals expansion of ecosystem relevance because it added major shippers and carriers in 2025,
              yet it is still a shared pilot structure rather than proof of durable recurring revenue from each
              participant. Concentration risk is also opaque. Public materials highlight a small set of flagship
              customers and coalition members concentrated in Southern California, Las Vegas, and the I-10 freight
              corridor. That can be interpreted positively as focused go-to-market execution, but it also means the
              public dataset may overrepresent a few anchor accounts and understate how diversified actual demand is.
