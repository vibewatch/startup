      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a capital-intensive unit-economic stack. TeraWatt's own design materials
              say the company provides real estate, zoning and permitting, power — including onsite solar and battery
              storage where needed — charging infrastructure, and SLA-backed uptime. Those are expensive layers before a
              single paid session occurs. The California Energy Commission's LAXREV report gives one concrete anchor:
              TeraWatt's Inglewood ridehail depot carried a total budgeted project cost of $6.13 million, including a $2
              million CEC grant, for a 29-charger secure shared-use site. TeraWatt's separate $63.8 million federal
              award for two New Mexico heavy-duty charging centers shows that corridor-scale projects can reach far
              larger capital envelopes, even if the scopes are not perfectly comparable.

              Public comparables reinforce the caution. EVgo's Q2 2026 disclosure still showed sub-11% GAAP gross margin
              and elevated capital expenditures despite much larger network throughput, while ChargePoint remained
              loss-making at more than $400 million of annual revenue. TeraWatt may enjoy stickier, site-specific
              contracts than these peers, but the public record does not yet show enough margin or utilization data to
              prove a fast payback model.
