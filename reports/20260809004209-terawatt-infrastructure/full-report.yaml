      - number: '8.3'
        title: Why Valuation Support Is Still Thin
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is equally important. TeraWatt is operating in a category where ambition routinely runs
              ahead of disclosed economics. Public charging and fleet-charging peers demonstrate that revenue can grow
              while losses, capex demands, and financing needs remain heavy. TeraWatt's own content acknowledges capital
              intensity, long lead times, grid constraints, charging unreliability in the wider market, and the need for
              phased adoption or hybrid onsite-offsite architectures. The company also does not publicly disclose the
              data that matter most for valuation discipline: site-level utilization, realized pricing, gross margin,
              customer concentration, cap table terms, debt covenants, and current fair-value marks. That means even a
              reasonable business can be a bad investment if the price assumes infrastructure certainty and
              software-style multiples before the economics are demonstrated. In other words, the anti-thesis is not
              that TeraWatt has no value; it is that the public record does not justify paying up for value that has not
              yet been evidenced.
            claimRefs:
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
              - CV019
