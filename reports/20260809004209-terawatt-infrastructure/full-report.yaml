      - number: '8.5'
        title: Final Diligence and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The final underwriting step is straightforward: ask for the data that would most change the call. The
              missing items are not cosmetic. A buyer needs site-level P&Ls, realized utilization, pricing architecture,
              contract terms, customer concentration, project-finance obligations, debt-covenant headroom, and cap table
              / preference details. These inputs determine whether TeraWatt is an infrastructure platform with improving
              asset turns or a capital sink that requires more time and money than the market expects. The thesis-break
              triggers are similarly concrete. If site energization dates keep slipping, if customer proof remains
              pilot-heavy without visible renewal behavior, if MCS readiness stays conceptual, if margins and
              utilization remain undisclosed, or if incremental capital arrives on unfavorable terms, then even a strong
              market position may not compensate for execution and dilution risk. Conversely, clear evidence on those
              variables could move the recommendation from research-more toward track or even buy at the right entry
              price.
            claimRefs:
              - CV027
