      - number: '2.2'
        title: Sizing Lenses and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              A credible market chapter needs multiple sizing lenses because no single published number maps cleanly to
              TeraWatt's addressable opportunity. At the broadest level, the Joint Office's 2030 charging-network work
              is sized to support 30-40 million EVs on U.S. roads, showing how much infrastructure has to exist for
              electrification at national scale. McKinsey narrows the lens by estimating a $15 billion annual U.S.
              market for fleet-charging services by 2030, alongside up to 8 million passenger and commercial fleet EVs
              and roughly $11 billion of infrastructure investment to deploy chargers. IEA adds the global demand
              backdrop: electric truck sales more than doubled in 2025 to 9% of worldwide truck sales, and under current
              policies electric trucks could reach 20% of sales by 2035.

              None of those figures is a stand-alone TAM for TeraWatt, but together they show an investable pattern. The
              market is already big enough to justify specialist infrastructure platforms, yet still early enough that
              the served market concentrates in specific use cases: drayage near ports, local and regional freight,
              ridehail fleets, school and municipal fleets, and eventually longer-haul corridors as network density
              improves. TeraWatt's own 2026 roadmap suggests autonomous fleets are the fastest-growing demand pocket
              today, while the federal freight-corridor strategy indicates heavy-duty corridor infrastructure is the
              policy-backed long game. In other words, the near-term SAM is narrower than the headline EV buildout
              narrative, but the long-term TAM remains large if cost, power, and operations constraints can be solved.
            claimRefs:
