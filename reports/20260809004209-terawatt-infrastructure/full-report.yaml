      - number: '1.3'
        title: Capital Formation and Investor Signaling
        blocks:
          - type: paragraph
            body: >-
              TeraWatt’s capital story is unusually large for private EV charging infrastructure. In September 2022 the
              company announced more than $1 billion of institutional capital from Vision Ridge Partners plus follow-on
              commitments from Keyframe Capital and Cyrus Capital, on top of a previously raised $100 million seed
              round. Independent coverage from TechCrunch, Crunchbase News, and Canary Media all corroborated the size
              of the raise, while Canary highlighted an important caveat: management did not disclose how much of the
              headline amount represented corporate equity versus infrastructure or asset-level capital. That
              distinction matters for dilution analysis, return modeling, and comparisons with software or equipment
              startups, because a dollar earmarked for project assets is not economically equivalent to unrestricted
              operating equity.

              In June 2026 TeraWatt added a new layer to the stack with a five-year senior secured debt facility for up
              to $300 million, split between $150 million committed and a $150 million incremental option. RBC Capital
              Markets led the syndicate, with SMBC and UBS also participating, and the company characterized it as its
              first commercial bank facility. The move is strategically important: it signals that at least part of the
              business has matured from venture-style backing toward infrastructure-finance underwriting. Even so,
              public sources still do not disclose a post-money valuation for either the 2022 capital raise or the 2026
              debt-supported enterprise, leaving one of the most important diligence inputs unresolved.
