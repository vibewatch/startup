      - number: '3.5'
        title: Status-Quo Substitutes and Likely Entrants
        blocks:
          - type: paragraph
            body: >-
              The largest substitute is still self-build or delay. A fleet can try to energize its own depot, contract
              for site services from utilities and EPCs, and use public charging only for overflow. That path often
              looks cheaper on a narrow equipment basis, but it pushes permitting, interconnection, queue management,
              and uptime risk back onto the fleet. TeraWatt's pitch is strongest where customers do not want to become
              infrastructure developers themselves.

              The likely-entrant risk is not one specific startup; it is ecosystem convergence. EVgo's 2026 agreement
              with Tesla to deploy EVgo-branded Superchargers shows that public-network operators are widening power,
              connector, and site options. ChargePoint and Electrify America already serve enterprise site owners.
              Greenlane could extend beyond its initial heavy-duty corridor into more freight nodes, while Voltera's
              merger with Revel shows how urban charging platforms can combine customer relationships, real estate, and
              capital into a larger footprint quickly. TeraWatt therefore benefits from being early, but it does not yet
              operate in a winner-take-most market.
            claimRefs: []
