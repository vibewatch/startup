            body: >-
              TeraWatt’s technical road map is shaped by high-power commercial charging constraints more than by
              consumer-EV patterns. The Rancho Dominguez opening gave the clearest current operating anchor: 20
              pull-through and bobtail fast-charging stalls, 7 MW of site capacity, and expected support for up to 125
              trucks per day. The company’s AV-design post says hub planning must happen 1.5 years or more in advance,
              which matches the broader grid and permitting bottlenecks described by Utility Dive. TeraWatt also states
              that it is building sites to facilitate a transition to Megawatt Charging System technology as soon as
              chargers and vehicles are commercially ready. Its MCS explainer frames 30-minute charging as the threshold
