        title: Customer Segments, Buyers, and Use Cases
        blocks:
          - type: paragraph
            body: >-
              TeraWatt's customer base is best understood as a set of fleet segments with different charging pain points
              rather than as a homogeneous list of logo wins. The trucking segment includes dedicated fleet operators
              and shippers that need corridor access, pull-through layouts, and dependable offsite charging. The
              clearest named example is PepsiCo, which signed a multi-year deal to use TeraWatt's Rancho Dominguez site
              for offsite heavy-duty charging. Another segment is high-utilization urban fleets, where ridehail,
              autonomous, and taxi customers care about charger availability, driver dwell time, and urban site
              placement. Desert Cab is the strongest visible proof here. A third segment is multi-party corridor
              coalitions, where the immediate buyer may be a consortium or program sponsor rather than a single fleet.
              The I-10 initiative brings together shippers and carriers including AIT Worldwide Logistics, DB Schenker,
              Maersk, Microsoft, PepsiCo, C.H. Robinson, DHL Supply Chain, Electrolux, and IKEA around shared corridor
              infrastructure. These patterns imply that TeraWatt sells to enterprise operations teams, sustainability
              leaders, logistics organizations, and fleet operators that need charging as an enabling layer for broader
