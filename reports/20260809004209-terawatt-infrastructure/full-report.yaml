              mature. CharIN’s MCS documentation helps translate that marketing into real technical requirements:
              CCS-derived architecture, up to 1,250 volts and 3,000 amps DC, Ethernet plus ISO 15118-20 communications,
              and large current-handling hardware. TeraWatt’s own five-year reflection is notable because it says the
              company partially pulled back from its original islanded microgrid vision and shifted toward denser
              warehouse and industrial hubs, suggesting product strategy is adapting to actual customer demand and grid
