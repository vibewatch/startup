      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is not just a background consideration for TeraWatt; it is part of the product economics.
              The company sells into fleet markets affected by California incentive programs, WAIRE compliance,
              heavy-duty emissions rules, and federal corridor planning. Its own writings note that warehouse operators
              can face fines if they fail WAIRE requirements and that custom plans are needed when on-site charging is
              impractical. The HVIP guide likewise shows how dependent some customers may be on dealer-managed
              point-of-sale vouchers, eligibility rules, and annual caps. At the company-operations layer, TeraWatt's
              legal pages show that it imposes formal contractual and compliance expectations on vendors, including
              anti-bribery, trade controls, AML, confidentiality, rejection rights, indemnification, and insurance
              obligations. That is good governance, but it also highlights a real execution burden: any failure by
              suppliers, subcontractors, or partners to meet legal or quality standards can become TeraWatt's customer
              problem. Public evidence does not reveal litigation or enforcement action today, but policy or
              supplier-compliance drift would directly affect deployment velocity and customer trust.
            claimRefs:
              - CR001
