      - number: '3.3'
        title: Capability and Commercial Model Comparison
        blocks:
          - type: paragraph
            body: >-
              ChargePoint and EVgo are the scale incumbents in the retained set. ChargePoint's official materials
              position it as a comprehensive hardware-software-services supplier to more than 4,000 commercial and fleet
              customers, while EVgo's filing and 2026 results show one of the largest public DC fast-charging footprints
              and explicit support for dedicated charging, charging-as-a-service, and depot or off-site fleet assets.
              Electrify Commercial sits in a different slot: its reviewed page promises that the customer owns the
              network, pricing, brand, and data, while Electrify America provides feasibility, construction, and
              maintenance. That is more enterprise infrastructure outsourcing than TeraWatt-style shared depot
              ownership.

              TeraWatt's commercial model looks closer to Voltera, Forum, and WattEV than to these broader incumbents.
              Like Voltera, it competes by taking on siting and infrastructure complexity. Like Forum and WattEV, it
              sells reduced operational friction, not just electrons. The main public limitation is pricing opacity.
              Across the private operators, retained sources rarely publish realized depot pricing, contract duration,
              or utilization-linked economics, so buyers appear to choose on capex relief, throughput readiness, and
              workflow fit more than on posted tariffs.
