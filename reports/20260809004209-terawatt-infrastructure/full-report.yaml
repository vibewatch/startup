      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              TeraWatt appears to sell through an enterprise, site-led motion with long planning cycles rather than
              through a high-volume transactional funnel. The autonomous-fleet design article says charging hubs take
              1.5 years or more to assemble, and that TeraWatt works closely with customers to anticipate changing site
              needs before the physical asset is finished. That implies lumpy, relationship-driven selling tied to
              zoning, power availability, customer route maps, and long-horizon city launches. The April 2026 leadership
              expansion supports that interpretation: TeraWatt hired a CFO with debt-and-equity scaling experience, a
              chief product and strategy officer to commercialize offerings, and a chief business officer with AV
              partnership history. Those hires look more like infrastructure and strategic-account scaling than like a
              short-cycle software salesforce buildout.

              Public proxies suggest the GTM burden is meaningful. ChargePoint and EVgo spread cost across broad
              networks, whereas TeraWatt is targeting complex fleets that likely require bespoke siting and underwriting
              work per site. Public CAC, payback, contract duration, and customer concentration metrics are absent, so
              sales efficiency can only be inferred indirectly from the long build cycle and financing emphasis.
