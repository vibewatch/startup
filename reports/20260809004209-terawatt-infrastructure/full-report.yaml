      - number: '6.5'
        title: Customer Verdict and Diligence Needs
        blocks:
          - type: paragraph
            body: >-
              TeraWatt has enough public customer proof to show that real fleets are using or planning around its
              infrastructure, and that the company's value proposition resonates most where charging complexity meets
              mission-critical transport operations. PepsiCo and Desert Cab are the best examples because they offer
              specific deployment detail and real operational context. The I-10 consortium broadens the relevance of the
              story into shipper and carrier ecosystems and suggests that enterprise customers view TeraWatt as a
              credible strategic partner. However, the chapter's central diligence conclusion is that customer proof is
              broader than customer durability proof. Missing retention data, absent concentration disclosure, and the
              lack of a public customer ledger mean the company still needs diligence around who pays, who expands, how
              usage converts to revenue, and whether public flagship accounts are representative of the broader base.
              The public record supports a positive adoption signal, but not yet a fully underwritten customer quality
              conclusion.
