  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              The top risks to TeraWatt are not subtle. Building, operating, and financing commercial EV charging hubs
              creates a stack of linked exposures in which delays or failures at one layer can propagate into customer
              adoption, revenue timing, margin, and future fundraising. The most severe public risks are grid and
              permitting delays, capital intensity, technology transition from current DC fast charging to MCS-era
              infrastructure, customer-concentration opacity, and operational reliability at scale. Regulatory
              complexity is also unusually important because TeraWatt sells into sectors that are often subsidy-driven
              or compliance-driven, especially in California freight and warehouse markets. On the positive side, public
              materials show that management understands many of these risks and is explicitly trying to mitigate them
              through offsite charging, CMS-based power management, corridor siting, utility relationships, and formal
              vendor requirements. Even so, the residual risk burden remains material because many mitigation claims are
              company-authored and have not yet been independently audited at network scale.
            claimRefs:
              - CR007
              - CR010
              - CR014
              - CR015
              - CR017
              - CR020
              - CR027
              - CR028
              - CR040
