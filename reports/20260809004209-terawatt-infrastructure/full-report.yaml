            title: Missing economics are the entire valuation debate
            body: >-
              The biggest gap is not whether fleet charging matters. It is whether TeraWatt's sites, contracts, and
              capital structure can convert that strategic relevance into attractive investor returns without painful
              dilution or prolonged opacity.
            calloutType: risk
