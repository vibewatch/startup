      - number: '8.2'
        title: Why the Thesis Is Real
        blocks:
          - type: paragraph
            body: >-
              The investable part of the thesis is not hype alone. TeraWatt has real strategic ingredients: an
              integrated charging-as-a-service model, multiple deployment modes, policy alignment, and customer proof in
              demanding commercial segments. The CaaS and full-spectrum materials describe a model that can convert a
              fleet's infrastructure capex burden into an operating expense, while the product and customer chapters
              show that PepsiCo, Desert Cab, and I-10 corridor participants are not abstract market targets. The market
              backdrop is also credible. McKinsey argues that U.S. fleet-charging services could become a $15 billion
              annual market by 2030, and the IEA shows heavy-duty electrification is progressing even if unevenly.
              TeraWatt's strategic posture as an infrastructure owner and intermediary among utilities, capital markets,
              and fleets makes sense in a world where customers do not want to self-develop every site. Those are
              meaningful positives. They explain why the company can deserve close tracking and why a large eventual
              outcome is plausible if economics and execution prove out.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV021
              - CV023
              - CV024
