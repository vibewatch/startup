      - number: '2.4'
        title: Policy Tailwinds and Infrastructure Support
        blocks:
          - type: paragraph
            body: >-
              Policy support matters because this market is capital intensive long before it is mature. The federal
              freight strategy released by DOE, FHWA, and the Joint Office explicitly targets 30% zero-emission medium-
              and heavy-duty vehicle sales by 2030 and 100% by 2040, sequencing freight-hub and corridor deployment in
              four phases. The Charging and Fueling Infrastructure program adds $2.5 billion over five years across
              community and corridor grants, while Joint Office funding programs explicitly call out EV charging
              infrastructure, managed charging, vehicle-to-grid, utility energization, and fleet vehicle infrastructure.
              DOE's SuperTruck Charge awards add a more commercial demonstration layer by funding high-power heavy-duty
              charging and grid-resiliency solutions.

              Policy support is not only about grants. The federal strategy is designed to crowd in private capital by
              clarifying where corridors, freight hubs, and enabling utilities should move first. EPA SmartWay's
              resource stack shows how fleets are expected to navigate HVIP, Clean Ports, DERA, Joint Office funding,
              and TCO tools rather than rely on a single subsidy. For a company like TeraWatt, these programs reduce
              adoption friction in exactly the segments it targets: ports, freight corridors, and operationally
              demanding depots. But they work best when market activity, utility coordination, and route economics
              already point in the same direction.
            claimRefs:
              - CM012
              - CM013
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM026
