            body: >-
              The clearest product differentiation is that TeraWatt combines land, power development, charging equipment
              integration, software, reservations, billing visibility, and field service in one platform. Compared with
              ChargePoint’s fleet-solution pitch, which emphasizes software, expert site design, and modular stations,
              TeraWatt appears more infrastructure-owner heavy and more focused on dense fleet hubs. Compared with
              battery-integrated approaches such as XCharge’s Net Zero series, TeraWatt’s public narrative is less about
              a packaged hardware appliance and more about site-specific system integration with future MCS
              compatibility. The current product should be treated as late pilot to early scaled deployment rather than
              as a fully standardized network product. There are live multi-megawatt sites, published case studies, and
              a growing operations team, but vendor stack choices, networkwide performance data, and cyber controls are
              not public. The five-year reflection also shows strategy changes, including slower-than-expected U.S.
              electric-trucking growth and a retreat from the original islanded-microgrid concept. Those are rational
              adaptations, but they also show the product thesis still depends on external adoption, grid timelines, and
