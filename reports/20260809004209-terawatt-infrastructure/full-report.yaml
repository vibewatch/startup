      - number: '3.4'
        title: Switching Costs, Moats, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              TeraWatt's most credible moat is not proprietary charger hardware. It is the combination of land control,
              utility work, secure operational layouts, and workflow-specific software for fleets that need predictable
              turnaround. Once a heavy-duty or AV depot is energized, integrated with the fleet's operating stack, and
              embedded in route planning, switching away is materially harder than replacing a generic public-network
              app. That same logic helps Voltera, Forum, and WattEV. Greenlane has a related but more corridor-oriented
              moat because pull-through public charging, sponsor backing, and telematics-informed siting are difficult
              to copy quickly.

              The moat is still incomplete. Fleets can multi-home across public networks and dedicated depots, which
              limits lock-in. Public-network players remain advantaged on current scale, and private platforms still
              need to prove that utilization and margins justify all the capital trapped in real estate and power
              upgrades. FreeWire's 2024 collapse is a useful warning: even real technical differentiation can fail if
              manufacturing, working capital, and service execution break before infrastructure demand reaches scale. In
              this category, durable moats come from capital discipline and site execution at least as much as from
              technology.
