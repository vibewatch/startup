      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a price-sensitive trackable asset, not a blind avoid
            body: >-
              The company has enough strategic proof to deserve serious attention, but not enough public economic proof
              to justify aggressive underwriting at an unknown or premium private price.
            calloutType: insight
            claimRefs:
              - CV012
