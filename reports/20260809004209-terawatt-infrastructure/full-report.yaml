      - number: '4.4'
        title: Public Traction and Disclosed Scale
        blocks:
          - type: paragraph
            body: >-
              TeraWatt discloses enough operating detail to show real deployment, but not enough to convert deployment
              into a financial model. The 2026 roadmap and leadership release say the company has delivered 68 million
              miles of clean EV range, abated 27 million kilograms of CO2, grown to 80+ employees, and is on pace to
              double its national footprint while opening 12 new markets. Site-specific disclosures add further color:
              the Inglewood site has 29 DC fast chargers; Rancho Dominguez has 20 pull-through and bobtail stalls, 7 MW
              of power, and expected throughput of up to 125 trucks per day; one AV garage site described by management
              now has 60 ports dedicated to an autonomous fleet. These facts support the claim that TeraWatt is building
              real physical infrastructure at scale.

              They do not, however, reveal revenue quality. There is no public revenue number, no disclosed site
              utilization, no gross-margin bridge, and no public view of backlog versus merely planned capacity. The
              traction story is therefore operationally credible but financially incomplete.
