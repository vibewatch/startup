  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The company-quality story and the entry-price story are not the same, and that distinction matters here.
              TeraWatt has accumulated enough evidence to look strategically relevant: a large market, a credible
              full-stack charging product, flagship customer proof, and continued access to institutional and bank
              capital. But public evidence still does not disclose revenue, margin, utilization, cash runway, renewal
              rates, or current preferred-equity overhang. Without those inputs, it is hard to underwrite a premium
              private valuation with conviction. The right recommendation on public evidence is therefore research-more
              rather than buy or avoid. That stance does not mean the business is weak; it means the public record is
              too sparse to support price-insensitive enthusiasm. If a disciplined investor could access the company at
              a materially conservative valuation with clean preference terms and verify site-level economics, the
              recommendation could improve. Until then, the burden of proof sits on economic visibility, not on market
              ambition.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV027
