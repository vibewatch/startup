      - number: '1.2'
        title: Leadership Bench and Governance Transparency
        blocks:
          - type: paragraph
            body: >-
              The leadership bench is strongest where TeraWatt most needs credibility: energy-intensive infrastructure,
              mobility, product strategy, real-estate development, and operating reliability. Neha Palmer’s background
              spans natural-gas engineering and Google’s energy strategy work for infrastructure-heavy assets; Mike
              Englhard brings large-scale real-estate development experience; and the 2026 executive additions added
              capital-markets, product, and business-development depth through former Uber, Covariant, Palmetto Solar,
              Snowflake, Myst AI, Lyft, Woven, and Opower executives. Public biographies also show functional leaders in
              technology, operations, and people, suggesting the company is no longer purely founder-driven even though
              Palmer remains the central public face for strategy, fundraising, and customer trust.

              Governance transparency is weaker than executive-bio transparency. Official pages enumerate executives,
              but the retained public evidence does not publish a full board roster, ownership-control structure, or
              investor-governance map. That matters because TeraWatt has raised very large pools of capital relative to
              most private charging startups, and the mix of infrastructure-oriented investors implies non-trivial
              governance and downside-rights questions. The absence of public board detail does not indicate a problem
              by itself, but it does mean that key questions around board independence, veto rights, related-party
              transactions, and refresh cadence would need to be resolved in a data room rather than from public
              sources.
            claimRefs:
              - CO002
