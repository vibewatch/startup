            body: >-
              Capital availability is the most concrete public financial datapoint for TeraWatt. The company disclosed
              more than $1 billion of institutional capital in September 2022, then added a five-year senior secured
              facility in June 2026 with $150 million committed and a further $150 million incremental option.
              Independent coverage described it as the first commercial bank facility for the company, and the April
              2026 CFO appointment explicitly tied finance hiring to building scalable equity and debt sources for a
              still-untapped infrastructure category. Public grant support is meaningful too: the federal award for two
              New Mexico truck-charging centers totals $63.8 million, and the CEC's Inglewood report attributes a
              further $2 million in grant funding to that ridehail depot.

              What remains hidden is the denominator. Public sources do not disclose cash on hand, burn, runway, debt
              covenants, or how much of earlier institutional capital remains available for new site development.
