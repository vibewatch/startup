      - number: '2.5'
        title: 采用约束与悲观情景
        blocks:
          - type: paragraph
            body: >-
              主要约束不是意识形态上抗拒电动化，而是执行摩擦。Utility Dive 的 2026 年分析认为，车队项目最常卡在电网集成，而不是充电桩采购；报道还提到多兆瓦升级和接入时间线可能超过一年。这个判断与
              TeraWatt 自身长周期选址行为，以及 Joint Office 对公用事业和监管规划的强调相吻合。它也解释了为什么托管充电、储能和车网集成是核心产品层，而不是可有可无的软件外壳。

              悲观情景很直接。货运衰退会推迟车辆采购，削弱客户紧迫感。中国以外的重型 EV 采用仍处低基数，如果开发商过度建设，走廊基础设施可能早于需求。自动驾驶车队有前景，但如果 AV
              需求在最先融资建设场站的具体城市里增长慢于预期，集中度风险仍然存在。政策支持可能缩短回本周期，但市场仍依赖与路线匹配的用例、接入提前期和复杂的负载管理。结果是：结构性顺风很强，但采用曲线比泛化 EV
              标题暗示的更慢，也更受运营闸门控制。
