      - number: '4.4'
        title: 公开牵引力与披露规模
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 披露的运营细节足以证明真实部署，但不足以把部署转成财务模型。2026 年路线图和领导层公告称，公司已交付 68 million miles 清洁 EV 续航里程、减排 27 million
              kilograms CO2、员工增至 80+，并有望在开拓 12 个新市场的同时让全国版图翻倍。站点层披露提供了更多背景：Inglewood 站点有 29 台 DC 快充；Rancho Dominguez 有
              20 个贯通式和 bobtail 车位、7 MW 电力，预计每天最多支持 125 辆卡车；管理层描述的一个 AV 车库站点目前有 60 个端口专供自动驾驶车队使用。这些事实支持 TeraWatt
              正在规模化建设真实物理基础设施这一判断。

              但它们没有揭示收入质量。没有公开收入数字、没有披露站点利用率、没有毛利率桥接，也看不到积压订单与仅规划产能的公开区分。因此，牵引力故事在运营上可信，但在财务上不完整。
            claimRefs:
