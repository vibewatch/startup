      - number: '3.5'
        title: 现状替代方案与可能进入者
        blocks:
          - type: paragraph
            body: >-
              最大的替代方案仍是自建或延后。车队可以尝试给自有场站通电，向公用事业和 EPC
              采购站点服务，并只把公共充电用于溢出需求。这个路径在狭义设备口径上常常看起来更便宜，但它把许可、接入、排队管理和可用性风险又推回车队身上。TeraWatt 的卖点，在客户不想自己变成基础设施开发商的地方最强。

              可能进入者风险不是某一家具体初创公司，而是生态趋同。EVgo 2026 年与 Tesla 达成部署 EVgo 品牌 Superchargers
              的协议，显示公共网络运营商正在拓宽电力、接口和站点选择。ChargePoint 和 Electrify America 已经服务企业站点所有者。Greenlane
              可以从初始重型走廊延伸到更多货运节点；Voltera 与 Revel 合并则显示，城市充电平台可以快速把客户关系、地产和资本合成更大的版图。因此，TeraWatt 受益于早进入，但它尚未处在赢家通吃大半的市场。
            claimRefs: []
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现栈
        blocks:
          - type: paragraph
            body: >-
              TeraWatt
              的公开材料一贯把变现模式描述为替车队承接基础设施复杂性，而不是逐台销售充电桩。公司称其收购地产、锁定电力、安装充电设备、叠加软件和运营，再让车队客户把结果作为运营费用消费。卡车和自动驾驶车队页面暗示至少有四个可变现层：专用或共享充电接入、预约和站点运营支持、有可用性承诺的服务等级，以及围绕数据运营和能源管理的新产品层。公司还把更低每英里成本和更紧密电网友好互动作为明确客户价值，说明定价可以反映被避免的停机时间和被避免的资本开支，而不只是每
              kWh 电价差。

              未公开的信息同样重要。保留来源没有披露标价、混合合同结构、AV 与卡车之间的收入组合，也没有披露软件和能源管理工具是单独计费还是打包。收入模式在定性上可以理解，但质量、利润率结构和确认节奏仍未披露。
