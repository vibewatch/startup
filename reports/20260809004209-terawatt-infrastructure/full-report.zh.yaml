  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 把产品呈现为充电基础设施服务，而不是单一充电桩 SKU。解决方案页面称，客户可以使用半私有网络站点，也可以要求 TeraWatt 在客户土地或 TeraWatt
              控制的土地上建设定制基础设施。卡车页面补充说，这些站点是共享且可预约的；自动驾驶车队材料则描述了一套交钥匙组合：物业、电力、充电桩、充电管理软件和有可用性支撑的运营。因此，核心产品更接近面向车队的一体化充电平台，而不是硬件转售。运营工作流似乎也因用例而异。卡车车队需要位于战略位置的贯通式枢纽和预约逻辑；AV
              与网约车车队则需要靠近高利用率城市走廊的场站式站点，充电周转可预测、服务等级表现强。Port of Long Beach 到 Lebec 案例研究显示，TeraWatt
              也能快速部署临时或试点充电环境，帮助客户在承诺永久建设前测试路线。跨这些用例看，产品承诺是把选址、公用事业协调、设备采购、软件可视化和维护简化为一个供应商关系。
