  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公开证据如何把战略吸引力转化为“继续研究”而非“买入”的判断。
    data:
      nodes:
        - id: a
          label: 大市场 + 政策顺风
          detail: 车队充电需求可能增长
        - id: b
          label: 真实产品 + 客户证明
          detail: CaaS、多租户站点、具名客户
        - id: c
          label: 经济性不透明
          detail: 缺少收入、利润率、利用率或 cap table 清晰度
        - id: d
          label: 高剩余风险
          detail: 电网、资本、技术、集中度
        - id: e
          label: 需要价格纪律
          detail: 无法有信心地支撑高溢价估值
        - id: f
          label: 建议：继续研究
          detail: 密切跟踪；需要尽调或折价
      edges:
