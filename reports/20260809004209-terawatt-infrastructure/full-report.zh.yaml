            body: >-
              客户持久性是公开证据中最弱一环。TeraWatt 清楚展示了具名关系，但很少展示续约、扩张收入、按使用分组的群组，或初始签约后的客户经济性。保留来源中唯一明确公开的合同期限，是 PepsiCo
              三年安排。Desert Cab 通过业主引述和运营结果提供了强定性满意度证据，但没有合同金额、续约期限或扩张收入。I-10 联盟在 2025
              年加入主要货主和承运商，说明生态影响力在扩大；但它仍是共享试点结构，不是每个参与方都带来持久经常性收入的证据。集中度风险也不透明。公开材料突出少数旗舰客户和联盟成员，地域集中在 Southern
              California、Las Vegas 和 I-10 货运走廊。正面解读，这是聚焦的商业化执行；反面看，公开数据集可能过度代表少数锚定客户，低估真实需求的分散度。
