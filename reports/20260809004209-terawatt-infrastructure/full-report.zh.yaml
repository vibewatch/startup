  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: TeraWatt 把土地、电力、软件和运营串起来，让客户把充电当作服务购买，而不是自己建设场站。
    data:
      nodes:
        - id: land
          label: 战略土地
          detail: 高需求城市市场、物流枢纽和公路走廊
        - id: power
          label: 电力 + 许可
          detail: 公用事业协调、并网，以及分区 / 许可工作
        - id: depot
          label: 专用充电场站
