              最强的具名客户证据，是公开 logo 加上具体部署细节。PepsiCo 不只是一个 logo：公司披露了三年协议，车辆将使用 TeraWatt 的多租户 Rancho Dominguez 站点；PepsiCo
              自己的 Run on Less 材料也显示，Sacramento 的 Tesla Semi 运营强度高，正是高功率、高利用率用例，让场外充电有价值。Desert Cab
              也是有分量的证据，因为公开来源同时描述了客户关系和运营结果：充电管理软件、运维支持、司机教育、智能充电、远程故障排查，以及充电桩很少停机。I-10
              走廊联盟属于另一类证据。成员名单强，战略质量高；但它仍偏试点，计划落在 2027 年，而不是今天已经大规模部署的收入。Velocity Vehicle Group
              更应看作渠道和服务伙伴，而非直接付费充电客户；但它仍重要，因为它把 TeraWatt 充电与 EV 认证卡车维修覆盖连接起来，降低车队采用 EV 的摩擦。
