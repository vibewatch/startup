  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比「其他充电公司」更宽。TeraWatt 的买方要解决的是一个组合型任务：土地、电网容量、充电桩可用性、预约逻辑、车队运营、安全，且常常还包括清洁、停放编组或数据卸载流程。因此，最近的竞争对手是
              Greenlane、Voltera、Forum Mobility 和 WattEV 这类全栈基础设施平台，它们卖的是车队运营系统般的充电接入，而不是单一充电桩。这些玩家的路线重心不同：Greenlane
              明确在建设公共重型走廊；TeraWatt、Voltera、Forum 和 WattEV 则更偏场站、城市货运或垂直一体化车队运营。

              第二圈包括 ChargePoint、EVgo 和 Electrify Commercial
              等公共网络和企业充电既有玩家。当客户更愿意自有站点、依赖更广公共网络接入，或把专用充电与路线充电混合使用时，它们会争夺同一笔车队预算。现状替代方案仍是自建或推迟电动化，而不只是换一个充电网络。承销的核心问题是：TeraWatt
              的站点控制模式是否足够差异化，能同时防住公共网络规模和其他资本密集型场站开发商。
