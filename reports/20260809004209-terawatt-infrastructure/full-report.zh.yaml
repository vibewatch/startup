      - number: '5.5'
        title: 差异化、成熟度与技术风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的产品差异化在于，TeraWatt 把土地、电力开发、充电设备集成、软件、预约、计费可视化和现场服务合到一个平台。相比 ChargePoint
              的车队解决方案卖点——强调软件、专家站点设计和模块化站点——TeraWatt 看起来更重基础设施持有方，也更聚焦高密度车队枢纽。相比 XCharge Net Zero 系列这类电池集成方案，TeraWatt
              的公开叙事较少围绕打包硬件设备，更多围绕站点特定系统集成和未来 MCS
              兼容性。当前产品应被视为晚期试点到早期规模化部署，而不是完全标准化的网络产品。公司已有运营中的多兆瓦站点、发布过案例研究、运营团队也在扩张，但供应商栈选择、全网络性能数据和网络安全控制并未公开。五年回顾还显示战略有过调整，包括美国电动卡车增长慢于预期，以及从最初孤岛微电网概念退回。这些调整是理性的，但也表明产品逻辑仍依赖外部采用、电网时间线和标准化进展。
