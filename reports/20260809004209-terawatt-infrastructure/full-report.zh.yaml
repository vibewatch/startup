      - number: '3.3'
        title: 能力与商业模式比较
        blocks:
          - type: paragraph
            body: >-
              在保留的竞争集合中，ChargePoint 和 EVgo 是规模既有玩家。ChargePoint 官方材料将其定位为面向 4,000 多个商业和车队客户的综合硬件—软件—服务供应商；EVgo 的监管文件和
              2026 年业绩显示，它拥有最大的公共 DC 快充网络之一，并明确支持专用充电、充电即服务，以及场站或站外车队资产。Electrify Commercial
              处在另一个位置：其被审阅页面承诺客户拥有网络、定价、品牌和数据，Electrify America 提供可行性、施工和维护。这更像企业基础设施外包，而不是 TeraWatt 式共享场站所有权。

              TeraWatt 的商业模式更接近 Voltera、Forum 和 WattEV，而不是这些更广泛的既有玩家。像 Voltera 一样，它通过承接选址和基础设施复杂性竞争；像 Forum 和 WattEV
              一样，它卖的是运营摩擦减少，而不只是电。公开层面的主要限制是定价不透明。在私人运营商中，保留来源很少披露实际场站定价、合同期限或与利用率挂钩的经济性，因此买方似乎更多根据资本开支缓释、吞吐准备度和工作流匹配来选择，而不是根据公开价目表。
