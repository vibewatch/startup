      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险对 TeraWatt 不是背景因素，而是产品经济性的一部分。公司卖入的车队市场受 California 激励计划、WAIRE 合规、重型车排放规则和联邦走廊规划影响。它自己的文章指出，仓库运营商不满足
              WAIRE 要求可能面临罚款；现场充电不可行时，需要定制方案。HVIP 指南同样显示，部分客户可能高度依赖经销商管理的销售点凭证、资格规则和年度上限。在公司运营层，TeraWatt
              的法律页面显示，它对供应商施加正式合同和合规预期，包括反贿赂、贸易管制、AML、保密、拒收权、赔偿和保险义务。治理上这是好事，但也凸显真实执行负担：供应商、分包商或合作伙伴只要未达法律或质量标准，问题就会变成
              TeraWatt 的客户问题。公开证据目前未显示诉讼或执法行动，但政策漂移或供应商合规漂移会直接影响部署速度和客户信任。
