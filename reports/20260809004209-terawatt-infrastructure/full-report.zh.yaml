  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调要求
    rows:
      - - 站点控制和电力就绪度形成切换成本
        - 公用事业、许可和电网升级仍可能在拿地很久后拖延变现
        - 高
        - 按公司索取通电周期中位数和废弃站点统计
      - - AV 优化场站比通用公共充电桩更难复制
        - AV 需求集中在少数都市区，放量可能慢于拿地承诺
        - 高
        - 测算站点经济性时不要假设 AV 需求打满
      - - 公共网络既有玩家充电桩覆盖更广
        - 如果车队偏好公共 / 专用混合充电，而不是私有枢纽，ChargePoint 和 EVgo 就能拿下预算
        - 中
        - 衡量客户支出有多少取决于沿途充电，而不是场站独占性
      - - 卡车 / 货运打包模式加深工作流锁定
        - Forum 和 WattEV 承担更多执行风险，因为车队经济性还取决于卡车和货运表现
        - 中
        - 把充电护城河与车辆租赁或货运利润率假设拆开
      - - 走廊赞助可形成进入壁垒
        - Greenlane 的赞助方基础和走廊聚焦，未必能转化为密集城市 AV 场站优势
        - 中
        - 跟踪 Greenlane 能否从走廊场景扩展到城市场站份额
      - - 硬件创新可能绕开电网瓶颈
        - FreeWire 停摆说明，制造和营运资本承压时，硬件差异化仍可能失败
