      - number: '1.2'
        title: 领导层厚度与治理透明度
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 最需要建立可信度的地方，正是领导层最强的地方：能源密集型基础设施、出行、产品战略、地产开发和运营可靠性。Neha Palmer 的经历覆盖天然气工程，以及 Google
              面向重资产基础设施的能源战略工作；Mike Englhard 带来大型地产开发经验；2026 年新增高管则来自 Uber、Covariant、Palmetto Solar、Snowflake、Myst
              AI、Lyft、Woven 和 Opower，补上资本市场、产品和业务开发深度。公开履历还显示公司已有技术、运营和人力等职能负责人，说明公司不再完全由创始人驱动，尽管 Palmer
              仍是战略、融资和客户信任层面的核心公众面孔。

              治理透明度弱于高管履历透明度。官方页面列出了高管，但现有公开证据没有发布完整董事会名单、所有权控制结构或投资人治理图谱。这一点重要，因为 TeraWatt
              相比大多数私人充电初创公司已募集了极大规模资本，且基础设施导向投资人的组合意味着治理和下行权利问题并不简单。缺少公开董事会细节本身不代表存在问题，但董事会独立性、否决权、关联交易和换届节奏等关键问题，都需要在数据室里解决，而不能靠公开来源回答。
