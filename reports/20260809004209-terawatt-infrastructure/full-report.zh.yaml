      - number: '8.4'
        title: 场景逻辑与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，给 TeraWatt
              估值最好的办法是场景纪律，而不是追求点估计精度。牛市情景假设，多租户和定制建设站点快速扩张，公用事业和供应商摩擦可控，客户试点转成经常性使用，基础设施资本持续可得且不会带来惩罚性稀释。熊市情景假设相反：重型 EV
              采用更慢，并网滑坡，更大网络的可用率不均衡，经济性持续不透明，导致溢价定价站不住。公开可比公司能提供有用参照，但不是干净的一对一估值锚。ChargePoint 和 EVgo
              说明，把充电重要性转成持久利润有多难。Voltera、Greenlane、WattEV 等私营融资同业确认了资本市场兴趣，但不能解决 TeraWatt
              自己的披露缺口。因此，场景表和敏感性图比任何单一可比倍数更重要：投资人真正承销的是未来证据，而不是当前财务清晰度。
