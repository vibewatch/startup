      - number: '1.5'
        title: 反向因素与待解问题
        blocks:
          - type: paragraph
            body: >-
              对 TeraWatt 最强的反向解读，不是公司缺乏雄心，而是它试图把一个本质上资本密集、受地方约束的业务，扩展到本身仍不确定的市场。TechCrunch
              的早期报道已指出，电网容量压力是车队充电的结构性约束。CEC 报告展示了即使是一个已获资助的 California 场站，站点收购、许可、公用事业工作和投运也会跨越很长时间窗口。一篇更审慎的 2026 年文章把
              robotaxi 基础设施层称为「枯燥、昂贵的工作」，依赖合适街区里的土地、电力、分区和场站访问，并称 TeraWatt 筛选过的站点中只有约 3% 能通过完整的位置—电力—分区—经济性过滤器。

              这些约束又与披露缺口交织在一起。管理层没有公布公开收入线、客户集中度图谱、董事会名单或完整估值。2022
              年融资标题也掩盖了公司股权与项目资本的组合，使其与同行比较更复杂。这些缺口都不能证明模式弱；事实上，新的银行融资和扩张中的站点网络显示，成熟交易对手对资产基础越来越放心。但它们确实让公司停留在「高潜力、仍不透明」一类，承销既取决于执行纪律、公用事业协调和客户耐久性，也取决于融资标题金额。
