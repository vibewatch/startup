            body: >-
              TeraWatt
              的依赖网络远不止充电硬件。公司依赖公用事业、许可机构、补助项目、设备供应商、站点控制经济性、融资市场，以及相对狭窄的一组旗舰客户证据。财务上，这很重要，因为公司仍在搭建一个基础设施类别：客户使用完全成熟之前，就要先消耗资本。2026
              年债务额度有帮助，但也凸显公司继续依赖外部资本，而不是自筹资金扩张。公开客户证据是真实的，尤其是 PepsiCo 和 Desert
              Cab；但公开客户持久性证据很薄，联盟式项目不应被误读为已锁定经常性收入。因此，可见商业故事可能夸大多元化，低估集中度或试点转化风险。竞争和替代风险也重要。如果 TeraWatt
              在可靠性、位置或经济性上跟不上，客户可以自建、混合现场与场外充电，或使用其他高功率供应商。换言之，TeraWatt 必须比客户或竞争对手找到绕路方案更快地解决基础设施问题。
