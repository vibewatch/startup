      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 似乎通过企业级、站点驱动的动作销售，规划周期很长，而不是依靠高频交易漏斗。自动驾驶车队设计文章称，充电枢纽需要 1.5 years or more 才能拼装完成，TeraWatt
              会在物理资产完工前与客户紧密协作，预判不断变化的站点需求。这意味着销售具有大额、关系驱动特征，绑定分区、电力可得性、客户路线图和长周期城市启动。2026 年 4 月领导层扩充也支持这一解读：TeraWatt
              聘请具备债务和股权扩张经验的 CFO、负责商业化产品的首席产品与战略官，以及拥有 AV 合作历史的首席商务官。这些招聘更像基础设施和战略大客户扩张，而不是短周期软件销售团队建设。

              公开代理指标显示 GTM 负担不轻。ChargePoint 和 EVgo 可以把成本摊在广泛网络上；TeraWatt 则瞄准复杂车队，每个站点很可能都需要定制选址和承销工作。公开
              CAC、回本周期、合同期限和客户集中度指标缺失，销售效率只能从漫长建设周期和融资重点中间接推断。
