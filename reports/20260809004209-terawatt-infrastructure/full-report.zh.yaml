        - 使用验证和商业化信号
        - 中高
        - 需求过重依赖试点，或锚定账户放缓，会削弱增长势头叙事
        - 中高
        - 拓宽客群组合，并把联盟参与转成直接合同
        - 中高
    claimRefs:
      - CR010
      - CR012
      - CR026
      - CR027
      - CR028
      - CR029
      - CR032
    notes: 供应商集中度难以精确打分，因为 TeraWatt 未公开列出其充电桩 OEM 或开关设备栈。
  - id: TR004
    title: 人员 / 执行风险台账
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - EVSE 硬件产品工程
        - 用于筛选供应商、测试互操作性并管理 MCS 路线图
        - 中
        - 高
        - 专门负责人岗位还在补齐
        - 核查岗位是否到位，以及测试实验室 / 流程是否已运行
      - - 现场服务和运营规模化
        - 需要守住更多场站和区域的正常运行时间
        - 中高
        - 高
        - NOC 流程和技术员岗位公开可见
        - 索取人员配比、备件覆盖和区域响应时间
      - - 产品 / 定价执行
        - 需要把资本开支痛点转成有吸引力的运营开支产品
        - 中
        - 中高
        - 已有专门产品管理岗位
        - 索取实际定价架构、合同模板和毛利率护栏
      - - 跨职能开发执行
        - 需要协调地产、公用事业、项目交付和客户上线节奏
        - 中高
        - 高
        - 公开材料强调一体化模式
        - 跟踪实际场站延期率与计划的偏差，以及延期项目复盘
    claimRefs:
      - CR021
      - CR024
      - CR025
      - CR032
      - CR033
    notes: 执行风险应通过岗位到位和场站交付结果来监测，而不只看招聘帖话术。
  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 电网 / 并网风险
        - 场站送电时间
        - 旗舰走廊反复延期超过 6-12 个月
        - 重切收入时点和估值假设；升级对公用事业依赖的尽调
      - - 可靠性风险
        - 网络正常运行时间 / MTTR 披露
        - 无法提供全车队指标，或事件率恶化的证据
        - 将高端服务论点视为未证实；降低客户持续性假设
      - - 技术切换风险
        - MCS 商业化进展
        - 客户需求转向更高功率场景时，仍没有可信的改造路径或供应商路线图
        - 上调资本开支预备金和过时风险假设
      - - 融资风险
        - 融资可得性与建设节奏
        - 需要新增资本，但场站变现进展不匹配
        - 假设稀释 / 杠杆压力；暂停激进上行情景
      - - 客户质量风险
        - 试点到生产转换
        - 联盟和旗舰账户未能转成重复、合同化使用
        - 下调采用质量评分和集中度调整后的收入置信度
    claimRefs:
      - CR015
      - CR021
      - CR027
      - CR028
      - CR040
    notes: 这些终止标准用于投资监测，初步尽调后应与管理层数据请求配套。
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究
        - 中
        - 高
        - 偏贵
        - 在收入、利用率和股权结构证据到位前，不要支持溢价入场
    claimRefs:
      - CV029
      - CV030
      - CV038
      - CV039
    notes: 该判断取决于证据和价格，而不是泛泛的质量评价。
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 战略市场很大，并且在重卡、出租车和城市车队充电中已有真实客户验证
        - 若场站级利用率和复购客户证据公开，论点会增强
      - - 全栈 CaaS 模式可把车队资本开支转成运营开支，降低采用阻力
        - 若实际定价和毛利率数据证实单体经济健康，论点会增强
      - - 走廊网络规模化后，一体化基础设施所有者模式可能更有防御性
        - 若客户自建，或竞争对手给出更好经济性 / 更快部署，论点会削弱
      - - 公开经济性证据太薄，今天还不足以支撑对私募溢价估值的信心
        - 若管理层提供清晰股权结构表、场站 P&L 和合同化利用率证据，该反论点会削弱
    claimRefs:
      - CV003
      - CV005
      - CV021
      - CV027
      - CV030
      - CV037
    notes: 投资论点和反论点刻意成对呈现，因为建议同时取决于业务质量和入场价格。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 走廊快速送电，多租户利用率出现拐点，联盟成员转化， 资本仍能以合理条件获得
        - 支持广义私募基础设施 / 平台估值区间上沿；上行取决于未来收入证据， 目前还看不到
        - 需要执行、融资和需求同时配合
        - 中低
      - - 基准
        - 场站稳步推出，客户转化有好有坏，无重大监管冲击， 但经济性披露仍不完整
        - 支持继续跟踪和保守估值区间，而非立即买入的紧迫性
        - 若定价或利用率弱于预期，仍可能令人失望
        - 中高
      - - 悲观
        - 重卡采用仍慢，并网延误持续，MCS 改造成本上升，稀释增加
        - 估值会被压向低端基础设施资产逻辑，退出上行有限
        - 资本密集度和不透明性放大下行
        - 中
      - - 观察名单上调情形
        - 管理层披露场站 P&L、股权结构表、续约行为和债务空间
        - 只有在剩余风险有足够折价时，建议才可能转向跟踪或买入
        - 更取决于尽调访问权，而不是营销叙事
        - 中
    claimRefs:
      - CV019
      - CV027
      - CV031
      - CV032
      - CV033
      - CV035
    notes: 概率信号为定性判断，因为公开证据不足以支撑精确情景权重。
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public and quasi-public comparables that best frame TeraWatt's valuation debate on available
        evidence; it is not exhaustive and omits private marks that are not publicly supportable.
    rows:
      - - ChargePoint
        - FY2026 收入和公开股票表现
        - 收入 $411.2M；GAAP 净亏损 $220.2M
        - 说明大型充电平台能做大收入，但盈利仍吃力
        - 业务组合不同，公开市场情绪波动大
      - - EVgo
        - 充电网络 + eXtend 收入模式
        - 公开文件显示收入来自开发、设备以及持续 O&M / 网络服务
        - 可作为基础设施叠加服务经济性的混合模式参照
        - 公共网络敞口和补贴结构不同于 TeraWatt 的车队导向
      - - Voltera / 卡车充电领域私募资本
        - 私募融资状态
        - 债务和基础设施资本兴趣公开可见
        - 说明资本市场看得到充电基础设施所有权的价值
        - 融资新闻不能证明估值，也不能证明利润率
      - - WattEV
        - 场站利用率和兆瓦级扩张
        - 约 700 MWh/月的场站利用率推动扩张需求
        - 显示重卡场站跑出真实吞吐量后的上行
        - 单站使用量不能作为 TeraWatt 估值标尺
      - - 车队自建替代方案
        - 场内充电、太阳能、储能和混合策略
        - 大型车队可自行拼出有规模的充电能力
        - 勾勒替代风险和客户价格敏感度
        - 严格说，不是公司估值可比对象
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV036
    notes: 可比行用于限定预期和业务模式类比，不是声称 TeraWatt 有一个精确倍数。
  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 场站送电延期
        - 旗舰场站反复错过时间表，延期 >6-12 个月
        - 推迟收入、抬高资本开支负担、削弱客户信心
        - 下调时间假设并上调折现率
      - - 经济性披露没有改善
        - 尽调请求后仍看不到场站级利用率、定价或利润率
        - 估值支撑追不上战略叙事
        - 维持继续研究 / 拒绝溢价入场
      - - 客户组合持续偏试点
        - 联盟和旗舰账户未转化为可持续的重复使用
        - 削弱采用质量和客户持续性假设
        - 降低收入确定性并压缩情景权重
      - - 不利融资条款
        - 下一轮融资带来惩罚性稀释或限制性义务
        - 价值从新投资人或普通股流走
        - 重新评估持股经济性和下行保护
      - - MCS 准备度停滞
        - 卡车充电需求上升时，仍没有可信改造 / 升级计划
        - 提高现有场站过时风险
        - 增加资本开支预备金，并降低终值倍数置信度
    claimRefs:
      - CV019
      - CV028
      - CV031
      - CV032
      - CV035
    notes: 选择这些触发项，是因为它们直接改变估值支撑，而不只是影响叙事信心。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 场站经济性
        - 月度场站 P&L、售出 kWh、利用率、opex、维护、需量电费
        - 用于判断资产周转和利润率路径
        - 按成熟场站分组向管理层索取运营仪表盘
      - - 定价架构
        - 按 kWh 计费条款、月度最低消费、预订费、服务费、折扣
        - 用于把价值主张和实际收入质量接起来
        - 审阅客户合同和定价备忘录
      - - 客户质量
        - 头部账户集中度、续约时间表、扩张历史、试点转化漏斗
        - 用于判断持续性和集中度
        - 审阅 CRM / 账户级收入桥
      - - 资本结构
        - 当前股权结构表、优先权层级、债务契约、项目融资义务
        - 用于评估稀释和下行保护
        - 索取最新董事会材料和融资摘要
      - - 技术路线图
        - MCS 改造计划、供应商栈、硬件质保和升级敞口
        - 用于判断未来资本开支和过时风险
        - 索取产品路线图和供应商文件
    claimRefs:
      - CV027
      - CV028
      - CV035
      - CV040
    notes: 每个未关闭的尽调问题都对应一个变量；一旦答案变化，估值或投资建议会被实质性改写。
