            body: >-
              运营上，TeraWatt 暴露在实体充电栈的每一环：场地、电力、设备采购、充电桩可靠性、软件编排和现场服务。TeraWatt 自己的文章承认，重卡充电可能需要数兆瓦电力、数年公用事业工作，以及交期拉长到约 50
              周的配电柜。Utility Dive 也印证，配电升级和并网审查可能超过一年，电网约束仍是商业车队的核心堵点。技术切换又加一层风险。TeraWatt 正在为站点设计未来 MCS 迁移路径，但公司和 CharIN
              都承认，标准和商业化路径仍在演进。这意味着当前站点架构可能很快需要昂贵升级，长途重卡充电才能达到目标性能边界。可靠性也是严重风险。TeraWatt 可以指向一个 32
              分钟维修案例和一套周到的可靠性框架，但公开记录仍缺少经审计的全车队可用率、平均修复时间或网络安全控制披露。网络扩大后，单站运营优秀未必能自动复制。
