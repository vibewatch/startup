    rows:
      - - TeraWatt Infrastructure
        - 直接整合型场站运营商
        - 2024 年有 15 个站点在开发中；到 2026 年，12 个新市场和网络翻倍项目在开发中；最高 $300M 债务融资额度
        - 自动驾驶、网约车、卡车运输、商用车队
        - 私有 / 共享场站、安全运营、可预约充电、面向 AV 的基础设施
        - 公开定价和利用率未披露
      - - ChargePoint
        - 既有车队充电平台
        - '>4,000 个商业和车队客户；北美和欧洲 >406K 个充电点；FY2026 收入 $411.2M'
        - 企业车队、工作场所、商业物业
        - 硬件、软件、车队平台、融资、支持、公共 / 私人网络接入
        - 已审阅材料披露了规模，但未显示类似 TeraWatt 的重型场站组合
      - - EVgo
        - 带车队层的既有公共快充网络
        - 2025 年末 >1,200 个地点有 ~3,900 个 DC 快充车位；到 2026 年 Q2，5,380 个车位运营中
        - 公共快充、网约车、轻型车队、专用充电客户
        - 公共网络、专用充电、充电即服务、场站和异地资产
        - 业务组合仍偏公共快充，而不是港口或 AV 场站
      - - Electrify Commercial
        - 面向企业业主的交钥匙网络建设商
        - 背靠全国开放式超快充网络；保留页面显示 170+ 个配备 BESS 的站点
        - 站点业主、物业运营方、企业充电发起方
        - 站点可行性、许可、施工、维护、客户自有品牌网络
        - 客户似乎拥有网络，而不是把所有权外包给 Electrify Commercial
      - - Greenlane
        - 公共重型走廊网络
        - $675M 合资企业；首条 I-15 走廊计划配备 100+ 个充电器
        - 中重型卡车运输、走廊用户、部分轻型车队客户
        - 公共快充、预约、车队工具集成、未来氢能和 MCS 就绪扩展
        - 更接近走廊充电，而不是安全私有 AV 场站
      - - Voltera
        - 城市车队充电枢纽开发商
        - EQT 支持；2024 年报道 $100M 债务融资额度；合并后的 Voltera/Revel 平台预计在 11 个都市区拥有 >1,000 个车位
        - 自动驾驶车辆、网约车、城市车队
        - 站点控制、充电、集结、邻近服务的枢纽基础设施、远程监控
        - 已披露利用率和实际经济性仍处早期
      - - Forum Mobility
        - 打包卡车租赁和充电平台
        - 旗舰 FM Harbor 站点有 9MW 和 44 个端口；多个加州场站在开发中
        - 港口短驳和 Class 8 承运商
        - 卡车租赁、充电订阅、安全场站、MCS 和 CCS 车道
        - 地理布局集中，公开定价细节有限
      - - WattEV
        - 垂直整合的货运电气化平台
        - 到 2026 年 7 月有 7 个场站；Fresno 站点包括 7 个 MCS 和 15 个 CCS 充电器
        - 托运人、承运商、港口运营商、车队运营商
        - 卡车即服务、场站、维护支持、货运运营技术
        - 模型执行同时取决于充电和货运运营表现
    notes: 本表聚焦北美最可见的商用车队充电平台；保留证据显示这些平台掌握站点、触达公共网络， 或打包车队运营。
