      - number: '1.4'
        title: 运营版图、早期客户与里程碑
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，TeraWatt 正从概念和囤地走向运营场站。公司 2021 年 5 月脱离隐身状态，2022 年 9 月宣布超过 $1B 融资，2022 年 11 月为 CEC 支持的 Inglewood
              项目启动站点收购，2023 年 11 月 Rancho Dominguez 卡车站点破土，2024 年 10 月开放 Inglewood 轻型车站点，2025 年 4 月开放 Rancho
              Dominguez，并在 2026 年庆祝第五个站点上线。California Energy Commission 的最终报告尤其有用，因为它用硬日期、预算数字和投运里程碑锚定了一个站点，而不只是营销语言。

              客户披露仍有选择性，但明显强于泛泛的「车队运营商」叙事。公开来源点名 PepsiCo、Dreaded Trucking、Hight Logistics、Quick Container
              Drayage、Southern Counties Express、Tradelink Transport 和 WestCoast Trucking & Warehousing 为早期 Rancho
              客户；官方博客还讨论 Desert Cab、Velocity Vehicle Group 和 AV 车队需求；一篇 2026 年独立文章称 Waymo 是客户，并将 Inglewood 描述为第三方运营
              robotaxi 车场模式的一部分。公司 2026 年路线图称其已交付 68 million miles 清洁 EV 续航里程、减排 27 million kilograms CO2、员工增至
              80+，并在开发可开拓 12 个新市场、使网络翻倍的项目。这些指标有积极意义，但仍是公司自报，不是经审计牵引力指标。
