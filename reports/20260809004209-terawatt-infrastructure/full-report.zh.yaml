  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立脉络与商业模式
        blocks:
          - type: paragraph
            body: >-
              TeraWatt Infrastructure 将自己定位为面向自动驾驶、重型物流和更广泛商业 EV 车队的全栈充电基础设施持有方与运营商，而不是充电桩供应商。公司公开材料显示总部位于 San
              Francisco，并描述了一套模式：收购或租赁战略位置土地、锁定电力、开发充电场站、叠加预约和充电管理软件，再运营站点，让车队把充电从资本项目转为运营费用。这个定位重要，因为公司要解决的是复合瓶颈：土地、许可、电网接入、充电硬件、可用性运营和客户工作流集成，都必须对齐，车队才能规模化。

              创立时间线更适合理解为分阶段，而不是某一个清晰日期。公司 2022 年融资公告称 Keyframe 团队 2018 年开始搭建 TeraWatt，并列出 Benjamin Birnbaum、John
              Rapaport 和 Ethan Goldsmith 为创始人；而 2026 年官方领导层材料将 Neha Palmer 标为 CEO 和联合创始人，About 页面则称创始人到 2021
              年已在围绕电动化瓶颈买地和规划。最稳妥的综合判断是：TeraWatt 的投资逻辑和孵化始于 2018 年，公司在 2021 年 5 月脱离隐身状态，如今运营业务围绕 Palmer
              的能源和基础设施背景展开。公开来源未披露收入、经审计运营指标或精确法律创立日期，这些应视为尽调缺口，而不是可以推断的数字。
