  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方与用例
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 的客户群不应看成一串同质化 logo，更应拆成几类车队细分，每类都有不同充电痛点。卡车运输细分包括专用车队运营商和货主，他们需要干线走廊通达、贯通式布局，以及可靠的场外充电。最明确的具名案例是
              PepsiCo；它签下多年协议，使用 TeraWatt 的 Rancho Dominguez
              站点做场外重卡充电。另一类是高利用率城市车队，网约车、自动驾驶和出租车客户看重充电桩可用性、司机停留时间和城市站点位置。Desert Cab
              是这里最强的可见证据。第三类是多方干线走廊联盟，直接买方可能是联盟或项目发起方，而不是单一车队。I-10 计划把 AIT Worldwide Logistics、DB
              Schenker、Maersk、Microsoft、PepsiCo、C.H. Robinson、DHL Supply Chain、Electrolux、IKEA
              等货主和承运商围绕共享走廊基础设施拉到一起。这种模式说明，TeraWatt 卖给的是企业运营团队、可持续发展负责人、物流组织和车队运营商；他们需要把充电当成更大运输运营的使能层。
