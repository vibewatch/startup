      - number: '4.6'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              保留证据支持一个一致的财务解读：TeraWatt
              更像项目支持的基础设施平台，而不是边际成本可扩张的软件公司。如果站点经济性强、合同黏性高，这会有吸引力；但公开记录尚未证明其中任何一点。管理层已经展示出融资、拿补助、开运营站点，以及招募适合复杂融资和企业合作高管的能力。然而，所有能验证股权故事的承销指标——实际收入、毛利率、混合能源价格、单站贡献利润、客户集中度、流失、利用率、债务服务余量和积压订单质量——仍是私有信息。

              公开可比公司也提醒不要做宽松假设。ChargePoint 和 EVgo 证明，在充电基础设施里，规模本身不能消除资本开支、经营亏损或利润率压力。TeraWatt
              最终可能因站点更关键任务化、更少零售导向而呈现更好经济性，但没有合同和利用率披露时，合适结论不是确定看多，而是：业务可能有价值，但财务质量尚无法从公开信息承销。
