  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 广义 EV 基础设施需求会很快收窄到更具体的场站和走廊场景；像 TeraWatt 这样的公司现实能服务的就是这部分。
    data:
      nodes:
        - level: 1
          label: 广义 EV 基础设施需求
          value: 40
          unit: million EVs supported by 2030 (upper Joint Office lens)
          detail: 自上而下的全国充电网络需求，覆盖车队场站之外的多种充电形态。
        - level: 2
          label: 美国车队充电服务市场
          value: 15
          unit: USD B annual by 2030
          detail: McKinsey 对支持车队充电服务的估计，包括能源管理层。
        - level: 3
          label: 车队 EV 可服务基数
          value: 8
          unit: million U.S. fleet EVs by 2030
          detail: McKinsey 广泛采用情景下的商业和乘用车队合计。
        - level: 4
          label: TeraWatt 式滩头市场
          value: 12
          unit: new markets in active development
          detail: 公司层面的证据显示，近期可服务市场具有选择性：高需求节点里的 AV、港口短驳和区域货运场站。
    approximationNotes: 这些层级有意混用单位，因为它们展示的是战略范围逐层收窄，而不是一个可以数学相加的市场堆栈。
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM031
      - CM034
      - CM035
  - id: FM002
    title: 市场估计区间
    type: range
    layout: standard
    summary: 围绕影响车队充电需求的市场份额和基础设施依赖度指标，给出情景区间。
    data:
      items:
        - label: 2030 年美国车队 EV 占比
          low: 10
          mid: 12.5
