      - number: '2.4'
        title: 政策顺风与基础设施支持
        blocks:
          - type: paragraph
            body: >-
              政策支持很重要，因为这个市场远未成熟时就已经资本密集。DOE、FHWA 和 Joint Office 发布的联邦货运战略明确瞄准到 2030 年中重型零排放车辆销量占比 30%、到 2040 年达到
              100%，并把货运枢纽和走廊部署分成四个阶段推进。Charging and Fueling Infrastructure 计划在五年内向社区和走廊补助投入 $2.5 billion；Joint Office
              的资金项目也明确点名 EV 充电基础设施、托管充电、车网互动、公用事业通电和车队车辆基础设施。DOE 的 SuperTruck Charge 奖项又通过资助高功率重型充电和电网韧性方案，叠加了更商业化的示范层。

              政策支持不只是补助。联邦战略通过明确走廊、货运枢纽和配套公用事业应优先行动的位置，来撬动私人资本。EPA SmartWay 的资源栈显示，车队预期要同时用 HVIP、Clean Ports、DERA、Joint
              Office 资金和 TCO 工具，而不是依赖单一补贴。对 TeraWatt
              这样的公司而言，这些项目正好在其目标细分里降低采用摩擦：港口、货运走廊和运营要求高的场站。但只有当市场活动、公用事业协调和路线经济性已经指向同一方向时，这些项目效果最好。
