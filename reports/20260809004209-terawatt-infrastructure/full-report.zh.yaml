      - number: '8.5'
        title: 最终尽调与投资假设失效触发点
        blocks:
          - type: paragraph
            body: >-
              最后一步承销很直接：索取最能改变判断的数据。缺失项不是装饰。买方需要站点级 P&L、实际利用率、定价架构、合同条款、客户集中度、项目融资义务、债务契约余量，以及股权结构 / 优先权细节。这些输入决定
              TeraWatt 是资产周转改善的基础设施平台，还是需要比市场预期更多时间和资金的资本黑洞。投资假设失效触发点也同样具体。如果站点送电日期持续滑坡，如果客户证据仍偏试点且看不到续约行为，如果 MCS
              准备度停留在概念层，如果利润率和利用率仍不披露，或者增量资本以不利条款进入，那么即便市场位置强，也未必能抵消执行和稀释风险。反过来，如果这些变量出现清晰证据，建议可能从继续研究上调到跟踪，甚至在合适入场价买入。
