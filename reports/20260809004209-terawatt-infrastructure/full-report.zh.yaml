      - number: '1.3'
        title: 资本形成与投资人信号
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 的资本故事在私人 EV 充电基础设施领域异常庞大。2022 年 9 月，公司宣布从 Vision Ridge Partners 获得超过 $1B 的机构资本，并叠加 Keyframe
              Capital 和 Cyrus Capital 的后续承诺；此前还募集过 $100M 种子轮。TechCrunch、Crunchbase News 和 Canary Media
              的独立报道都印证了融资规模；Canary
              也强调了一个重要限定：管理层没有披露标题金额中有多少是公司股权，有多少是基础设施或资产层资本。这个区分会影响稀释分析、回报建模，以及与软件或设备初创公司的比较，因为拨给项目资产的 1
              美元，在经济含义上并不等同于不受限制的运营股权。

              2026 年 6 月，TeraWatt 又在资本栈上加了一层：一笔最高 $300M、期限五年的高级有担保债务融资，其中 $150M 已承诺，另有 $150M 增量选项。RBC Capital Markets
              牵头银团，SMBC 和 UBS 也参与；公司称这是其首笔商业银行融资。这个动作有战略意义：它表明至少一部分业务已从风险投资式支持，走向基础设施金融承销。即便如此，公开来源仍未披露 2022 年融资或 2026
              年债务支持企业的投后估值，最重要的尽调输入之一仍未解决。
