      - number: '3.2'
        title: 直接平台画像
        blocks:
          - type: paragraph
            body: >-
              Greenlane 是最清晰的走廊导向重型替代方案。其官方和赞助方材料描述了一个由 Daimler Truck、NextEra Energy Resources 和 BlackRock
              支持的公共商用车充电网络，初始 I-15 走廊拥有超过 100 个充电桩，Colton 旗舰站点设计上支持未来 MCS。Voltera
              是最可比的城市基础设施开发商：它强调高利用率枢纽、零前期资本部署，以及一体化电力、充电和运营基础设施；随后又通过与 Revel 合并，把叙事扩大为一个预计覆盖 11 个都市区、超过 1,000 个车位的平台。

              Forum Mobility 和 WattEV 的竞争方式不同，它们把充电与卡车使用权或货运运营捆绑。Forum 以一个月费提供卡车租赁和充电订阅，并已营销一个 9 MW、44 端口的港口旗舰场站。WattEV
              进一步进入货运编排，呈现垂直一体化的 Truck-as-a-Service 模式，包含卡车、场站、维护和调度支持。这些捆绑模式重要，因为它们争夺的不只是充电需求，还包括车队运营商更广的转型预算和工作流控制权。
