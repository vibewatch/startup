  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 面临的头部风险并不隐晦。建设、运营和融资商业 EV
              充电枢纽，会形成一组层层相扣的风险；其中一层延误或失效，就可能传导到客户采用、收入时点、利润率和后续融资。公开信息中最严重的风险，是电网和许可延误、资本密集度、从当前 DC 快充向 MCS
              时代基础设施的技术切换、客户集中度不透明，以及规模化运营可靠性。监管复杂度也异常重要，因为 TeraWatt 卖入的行业往往由补贴或合规驱动，尤其是 California
              货运和仓储市场。正面看，公开材料显示管理层理解其中许多风险，并明确试图通过场外充电、基于 CMS
              的功率管理、走廊选址、公用事业关系和正式供应商要求来缓释。即便如此，剩余风险负担仍然不小，因为许多缓释说法来自公司自述，尚未在网络规模上经过独立审计。
