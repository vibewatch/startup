        - label: 当下估值支撑
          value: Low
          note: 现有公开证据还不足以有信心地支撑高溢价价格
        - label: 建议
          value: Research-more
          note: 若能获得尽调权限或更好进入价格，判断可能改善
    claimRefs:
      - CV012
      - CV021
      - CV027
      - CV029
      - CV038
      - CV039
