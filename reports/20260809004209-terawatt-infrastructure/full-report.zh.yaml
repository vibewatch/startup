      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本可得性是 TeraWatt 最具体的公开财务数据点。公司 2022 年 9 月披露超过 $1 billion 机构资本，随后在 2026 年 6 月新增五年期高级有担保融资，已承诺 $150
              million，另有 $150 million 增量选项。独立报道将其描述为公司的首笔商业银行融资；2026 年 4 月 CFO
              任命也明确把财务招聘与为一个仍未充分开发的基础设施品类建立可扩展股权和债务来源联系起来。公开补助支持也有意义：两个 New Mexico 卡车充电中心的联邦奖励合计 $63.8 million，CEC 的
              Inglewood 报告还把另外 $2 million 补助归于该网约车场站。

              隐藏的仍是分母。公开来源没有披露手头现金、烧钱速度、现金跑道、债务契约，或早期机构资本中还有多少可用于新站点开发。因此，承销必须把 TeraWatt
              视为融资依赖型公司：它显然有募资能力，但还没有公开证明能够自我供血。
