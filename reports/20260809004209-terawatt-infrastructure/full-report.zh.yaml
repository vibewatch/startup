        - 灵活的 OpEx 基础设施模式
        - 未披露
        - 充电、运营枢纽、数据卸载、安全、监控
        - 车队客户前期 capex 较低
        - 进入市场速度比资产所有权更重要时，是强替代方案
      - - Forum Mobility
        - 卡车租赁和充电订阅，可单独购买或打包
        - 披露了月度套餐，场站 kWh 经济性未披露
        - Class 8 卡车、充电订阅、安全场站
        - 降低车辆和基础设施前期负担
        - 适合同时需要设备和充电接入的小型承运商
