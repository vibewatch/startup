        title: 采用与运营结果
        blocks:
          - type: paragraph
            body: >-
              公开记录给出了有用但不均衡的采用证据。PepsiCo 披露，截至 2023 年 9 月，Sacramento 有 21 辆 Tesla Semi；截至 9 月 1 日，零排放里程接近 680,000
              英里；路线从本地配送到 250–520 英里的长途运输不等。Run on Less 还补充，车队使用 4 台 750 kW 充电桩，现场有 1.2 MW 太阳能和 2.4 MWh 备用储能。Desert Cab
              披露了 400 辆出租车运营、2022 年约 270 万次乘车、1500 万英里行驶里程，以及首批上路 25 辆 EV。TeraWatt
              的案例研究随后把客户问题拆得很细：电网限制、充电视野低、维修速度慢。披露的结果偏运营，而非纯财务，包括功率上限管理、智能充电算法、远程会话控制、主动通知，以及更好利用现有充电桩。这些证据能证明采用真实存在，但仍高度依赖案例研究。TeraWatt
              仍未发布总客户数、全车队使用增长，或跨客户群的重复订单曲线。
