      - number: '8.2'
        title: 为什么投资逻辑真实存在
        blocks:
          - type: paragraph
            body: >-
              可投资部分并不只是炒作。TeraWatt 有真实战略要素：一体化充电即服务模式、多种部署方式、政策顺风，以及在高要求商业细分里的客户证据。CaaS
              和全谱系材料描述了一种模式：把车队基础设施资本开支负担转成运营费用；产品和客户章节则显示，PepsiCo、Desert Cab 和 I-10 走廊参与方并非抽象市场目标。市场背景也可信。McKinsey 认为，到
              2030 年，美国车队充电服务可能成为 $15 billion 年度市场；IEA 显示，重型车电动化虽然不均衡，但仍在推进。TeraWatt
              把自己定位为基础设施所有者，并在公用事业、资本市场和车队之间充当中介；在客户不想自建每个站点的世界里，这个定位说得通。这些都是有分量的正面因素。它们解释了为什么公司值得密切跟踪，也解释了如果经济性和执行得到验证，大结果为什么有可能出现。
