  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 的相关市场不是「所有 EV 充电」，不加限定地使用这个说法，遮蔽多于澄清。TeraWatt
              变现的是一组能力：站点控制、电力采购、场站开发、充电硬件编排、可用性运营和面向车队的数据工具。因此，纳入支出包括商业场站充电、中重型车辆走廊补电、网约车和自动驾驶车队场站、托管充电、具备接入条件的站点开发，以及相关运营软件。市场不包括家庭充电、大多数面向私人司机的目的地充电、OEM
              车辆收入，以及许多一次性的工作场所充电项目——这些项目并不需要第三方车队基础设施平台。

              替代方案也比既有充电网络更宽。车队可以自建自营场站，依赖公用事业 make-ready
              项目加内部运营，租用第三方共享场站，或干脆推迟电动化，让内燃机资产继续上路。对自动驾驶运营商而言，替代方案问题更尖锐，因为场站位置、数据卸载、周转流程、维护邻近性和功率密度都会影响每英里成本。这也是为什么
              TeraWatt 自身市场叙事已从泛化车队充电，转向专门为 AV 和高利用率商业站点建设：它解决的经济问题，与其说是「插头可用」，不如说是「受限位置里可靠运营的电动化里程」。
