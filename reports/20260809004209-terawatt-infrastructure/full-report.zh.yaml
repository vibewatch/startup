  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公司质量故事和入场价格故事不是一回事，这一区分在这里很重要。TeraWatt
              已积累足够证据，看起来具有战略重要性：大市场、可信的全栈充电产品、旗舰客户证据，以及持续获得机构和银行资本的能力。但公开证据仍未披露收入、利润率、利用率、现金续航期、续约率或当前优先股压力。没有这些输入，就很难有把握地承销高溢价私人估值。因此，仅凭公开证据，正确建议是继续研究，而不是买入或回避。这个立场不意味着业务弱；它意味着公开记录太稀疏，支撑不了无视价格的热情。如果纪律严格的投资人能以显著保守估值、干净优先权条款进入，并验证站点级经济性，建议可能上调。在此之前，举证责任落在经济可见度上，而不是市场雄心上。
