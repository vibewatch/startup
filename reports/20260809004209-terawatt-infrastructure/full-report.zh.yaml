      - number: '2.2'
        title: 规模测算视角与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              可信的市场章节需要多个规模测算视角，因为没有一个公开数字能干净映射到 TeraWatt 的可触达机会。最宽口径下，Joint Office 的 2030 充电网络工作以支撑美国道路上 30-40 million
              辆 EV 为规模，显示全国级电动化需要多少基础设施。McKinsey 收窄视角，估计到 2030 年美国车队充电服务年市场规模为 $15 billion，同时会有最多 8 million 辆乘用和商业车队
              EV，以及约 $11 billion 的充电桩部署基础设施投资。IEA 则补上全球需求背景：2025 年电动卡车销量增长超过一倍，占全球卡车销量 9%；在现行政策下，到 2035 年电动卡车可能达到销量的
              20%。

              这些数字都不是 TeraWatt 的独立
              TAM，但合在一起呈现出可投资的模式。市场已大到足以支撑专业基础设施平台，同时又早到服务市场集中在特定用例：港口附近集卡、本地和区域货运、网约车车队、校车和市政车队，以及网络密度提升后的更长途走廊。TeraWatt
              自己的 2026 年路线图显示，自动驾驶车队是当下增长最快的需求口袋；联邦货运走廊战略则说明重型走廊基础设施是有政策背书的长期赛道。换句话说，近期 SAM 比标题式 EV
              建设叙事更窄；但如果成本、电力和运营约束能够解决，长期 TAM 仍然很大。
