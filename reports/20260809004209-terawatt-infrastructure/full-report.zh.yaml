      - number: '5.3'
        title: 站点设计、电网策略与 MCS 准备度
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 的技术路线图更多由高功率商业充电约束塑造，而不是由消费级 EV 模式塑造。Rancho Dominguez 开业给出了最清晰的当前运营锚点：20 个贯通式和 bobtail 快充车位、7 MW
              站点容量，预计最多支持每天 125 辆卡车。公司的 AV 设计文章称，枢纽规划必须提前 1.5 years or more，这与 Utility Dive 描述的更广电网和许可瓶颈一致。TeraWatt
              还称其正在建设站点，以便在充电桩和车辆具备商业就绪性后尽快过渡到 Megawatt Charging System 技术。其 MCS 解释文章把 30-minute
              充电框定为长途可行性的门槛，并指向标准和车辆硬件成熟后的未来 1 MW-plus 充电。CharIN 的 MCS 文档帮助把这套营销语言翻译成真实技术要求：源自 CCS 的架构、最高 1,250 volts 和
              3,000 amps DC、Ethernet 加 ISO 15118-20 通信，以及大电流处理硬件。TeraWatt
              自己的五年回顾也值得注意，因为公司称已部分撤回最初的孤岛微电网愿景，转向更密集的仓库和工业枢纽，说明产品战略正在适应真实客户需求和电网现实。
