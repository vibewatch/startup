      - number: '5.2'
        title: 架构与运营栈
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，TeraWatt 的架构横跨公用事业服务、开关设备、充电设备、云软件、遥测和现场服务运营。解决方案页面称，所有站点都由自研 Charge Management Software
              和强运营维护计划支撑；Long Beach-Lebec 试点称 CMS 提供实时充电活动、性能指标和计费信息。运营团队文章进一步细化：CMS
              门户内告警、网络运营中心每小时例行巡检、生成工单，以及充电桩故障后的技师派单。招聘信息也强化了这不是套在第三方硬件上的薄壳。TeraWatt 正在招聘 EVSE 硬件产品工程负责人，负责 EV 到 EVSE 到
              CMS 的自动化测试、车辆 OEM 互操作性、供应商认证和通往 MCS 的技术路径；还在招聘现场技师，负责从进线公用事业配电盘到 EVSE 的设备。综合来看，TeraWatt
              更像一个持有并运营资产、且拥有有意义内部产品和可靠性栈的公司，尽管它仍未公开具体充电桩供应商、CMS 软件架构或网络安全设计。
