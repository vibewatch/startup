      - number: '2.3'
        title: 买方细分、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              车队充电的买方图谱很碎，这不是缺陷，反而是特点。集卡承运商关心停留时间、贯通式动线，以及在不增加人工或路线摩擦的情况下进出污染严重的港口走廊。网约车或自动驾驶运营商关心空驶里程、启动城市、数据传输、清洁与维护流程，以及足够可靠的电力来维持高利用率。市政和校车运营商更关心补助、报告和有计划的场站转换；公用事业则关注承载容量、峰值需求和接入排队。港口和公共机构也常常重要，因为即便它们不是日常用户，也控制土地、货运通行或补助资格。

              这些差异带来不同采用路径。State of Sustainable Fleets
              项目显示，早期采用已经分布在校车、市政、城市配送、垃圾清运、公用事业、公交、短途和长途等领域，但时间线和经济性并不相同。TeraWatt
              自身材料显示，其最适合客户宁愿外包基础设施复杂性，而不是自建定制场站的场景：共享卡车车道、机场和高密需求区附近的网约车场站，以及站点位置会直接改变每英里成本的 AV
              运营。因此，采用不是简单的车辆销售转化率，而是穿过路线匹配、公用事业可行性、站点控制和财务信心的一道漏斗。
