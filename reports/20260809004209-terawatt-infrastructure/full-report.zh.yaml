      - number: '3.4'
        title: 切换成本、护城河与执行风险
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 最可信的护城河不是自研充电桩硬件，而是土地控制、公用事业工作、安全运营布局，以及面向需要可预测周转的车队所做的工作流软件组合。一旦重型或 AV
              场站通电、接入车队运营栈，并嵌入路线规划，离开它会比更换一个普通公共网络 app 难得多。同样的逻辑也帮助 Voltera、Forum 和 WattEV。Greenlane
              有相关但更偏走廊的护城河，因为贯通式公共充电、赞助方背书和基于车联网的选址，很难快速复制。

              护城河仍不完整。车队可以在公共网络和专用场站之间多宿主，限制锁定效应。公共网络玩家在当前规模上仍有优势；私人平台还需要证明，利用率和利润率足以支撑困在地产和电力升级里的全部资本。FreeWire 2024
              年倒闭是一个有用警示：即便真正有技术差异化，如果制造、营运资本和服务执行在基础设施需求放量前崩掉，也会失败。在这个品类里，持久护城河至少同样来自资本纪律和站点执行，而不只是技术。
