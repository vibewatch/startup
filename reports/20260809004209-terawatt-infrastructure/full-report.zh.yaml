      - number: '5.4'
        title: 可靠性、服务与合规控制
        blocks:
          - type: paragraph
            body: >-
              可靠性是产品主张的核心，因为只有充电会话能在狭窄运营窗口内真正启动并完成，车队充电才有价值。TeraWatt 的可靠性文章认为，仅看 uptime
              是不完整指标，并区分了可靠性、可用性和服务质量。文章还指出，前一年 California 公共快充会话失败率超过 20%，这解释了 TeraWatt
              为什么强调主动监控和故障检测。运营团队案例研究给了一个具体例子：上午 11:48 检测到的车位故障，经过分诊、诊断，在下午 12:20
              恢复服务，远快于文章所称典型公共网络服务的三到七天维修周期。招聘信息与这种运营模式一致，强调预防性和纠正性维护、根因排障、熟悉 NEC 和 NFPA、高低压系统，以及 97% EVSE uptime
              目标。缺失的是独立披露的全车队 uptime、充电成功率、plug-and-charge 可靠性或网络安全认证。因此，公开证据支持其有严肃的可靠性纪律，但还不是一套完全可审计的证明材料。
            claimRefs:
              - CE015
