      - number: '8.3'
        title: 为什么估值支撑仍然偏薄
        blocks:
          - type: paragraph
            body: >-
              反方逻辑同样重要。TeraWatt 所在类别里，雄心常常跑在已披露经济性前面。公共充电和车队充电同业显示，收入可以增长，但亏损、资本开支需求和融资需求仍然沉重。TeraWatt
              自己的内容也承认资本密集、长交期、电网约束、更大市场中的充电不可靠，以及需要分阶段采用或现场 +
              场外混合架构。公司也没有公开披露估值纪律最需要的数据：站点级利用率、实现价格、毛利率、客户集中度、股权结构条款、债务契约和当前公允价值标记。这意味着，如果价格在经济性尚未证明之前就假设基础设施确定性和软件式倍数，即便合理业务也可能变成糟糕投资。换句话说，反方逻辑不是
              TeraWatt 没有价值；而是公开记录不足以证明，投资人应该为尚未被证据支撑的价值支付高价。
            claimRefs:
              - CV009
