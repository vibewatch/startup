      - number: '6.5'
        title: 客户结论与尽调需求
        blocks:
          - type: paragraph
            body: >-
              TeraWatt 已有足够公开客户证据，能说明真实车队正在使用或围绕其基础设施做规划；公司的价值主张最能打动那些充电复杂度与关键运输运营交汇的场景。PepsiCo 和 Desert Cab
              是最佳例子，因为它们提供具体部署细节和真实运营语境。I-10 联盟把故事扩展到货主和承运商生态，也显示企业客户把 TeraWatt
              视为可信的战略伙伴。不过，本章的核心尽调结论是：客户证据比客户持久性证据更宽。留存数据缺失、集中度未披露、没有公开客户台账，意味着公司仍需围绕谁付费、谁扩张、使用量如何转成收入、公开旗舰客户是否代表更大客户群做尽调。公开记录支持正向采用信号，但还不足以得出完全可承销的客户质量结论。
