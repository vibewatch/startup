      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              保留证据指向一个资本密集的单位经济栈。TeraWatt 自身设计材料称，公司提供地产、分区和许可、电力——包括必要时的现场太阳能和电池储能——充电基础设施，以及有 SLA
              支撑的可用性。单次付费充电发生之前，这些都是昂贵层。California Energy Commission 的 LAXREV 报告给了一个具体锚点：TeraWatt 的 Inglewood
              网约车场站总预算项目成本为 $6.13 million，其中包括 $2 million CEC 补助，对应一个 29 个充电桩的安全共享站点。TeraWatt 另外为两个 New Mexico 重型充电中心获得
              $63.8 million 联邦奖励，说明走廊级项目可以达到更大的资本包，即便范围不完全可比。

              公开可比公司进一步提醒谨慎。EVgo 2026 年 Q2 披露在网络吞吐大得多的情况下，GAAP 毛利率仍低于 11%，资本开支也偏高；ChargePoint 年收入超过 $400
              million，仍然亏损。TeraWatt 的站点特定合同可能比这些同行更黏，但公开记录还没有展示足够的利润率或利用率数据，无法证明快速回本模式。
