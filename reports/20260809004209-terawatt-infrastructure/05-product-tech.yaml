callouts:
- calloutType: strength
  title: Integrated owner-operator model is a real product differentiator
  body: TeraWatt is not only marketing chargers. Public sources support an integrated offer that spans land, power development, hardware selection, software, billing visibility, and field operations. That end-to-end posture is valuable for fleets that do not want to manage utilities, OEM compatibility, maintenance vendors, and software vendors separately.
  claimRefs:
  - CE001
  - CE002
  - CE004
  - CE025
  - CE029
- calloutType: risk
  title: Reliability narrative is credible but still mostly unaudited
  body: The NOC case study, reliability article, and field-service postings show serious attention to charger uptime. But TeraWatt still does not publish fleetwide charge-success series, audited uptime, or cyber control artifacts. For an infrastructure product selling mission-critical fueling, that disclosure gap matters almost as much as raw charger count.
  claimRefs:
  - CE017
  - CE021
  - CE022
  - CE025
