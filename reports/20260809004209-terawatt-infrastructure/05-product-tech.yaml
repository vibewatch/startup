- id: reliability-service-and-compliance-controls
  title: Reliability, Service, and Compliance Controls
  body: 'Reliability is a core part of the product claim because fleet charging is only valuable when sessions actually start and complete during narrow operating windows. TeraWatt’s reliability article argues that uptime alone is an incomplete metric and distinguishes reliability, availability, and quality of service. It also notes that more than 20% of California public fast-charging sessions failed in the prior year, which helps explain why TeraWatt emphasizes proactive monitoring and fault detection. The operations-team case study provides a concrete example: a stall fault detected at 11:48 a.m. was triaged, diagnosed, and returned to service by 12:20 p.m., far faster than the three- to seven-day repair cycle the post attributes to typical public-network service. Job postings align with that operating model by stressing preventive and corrective maintenance, root-cause troubleshooting, NEC and NFPA familiarity, high- and low-voltage systems, and a 97% EVSE uptime target. What remains
    missing is independent disclosure of fleetwide uptime, charge-success, plug-and-charge reliability, or cybersecurity certifications. Public evidence therefore supports a serious reliability discipline, but not yet a fully auditable proof set.'
