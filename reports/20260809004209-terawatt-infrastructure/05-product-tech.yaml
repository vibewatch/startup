    gap: Actual EVSE vendor selections, MCS hardware partners, and interoperability test results are not public, limiting confidence in the migration path from today's chargers to future megawatt charging.
    severity: high
    relatedQuestionRefs:
    - QE008
    - QE024
    relatedTableRefs:
