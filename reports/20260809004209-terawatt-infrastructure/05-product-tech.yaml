- id: site-design-grid-and-mcs-readiness
  title: Site Design, Grid Strategy, and MCS Readiness
  body: 'TeraWatt’s technical road map is shaped by high-power commercial charging constraints more than by consumer-EV patterns. The Rancho Dominguez opening gave the clearest current operating anchor: 20 pull-through and bobtail fast-charging stalls, 7 MW of site capacity, and expected support for up to 125 trucks per day. The company’s AV-design post says hub planning must happen 1.5 years or more in advance, which matches the broader grid and permitting bottlenecks described by Utility Dive. TeraWatt also states that it is building sites to facilitate a transition to Megawatt Charging System technology as soon as chargers and vehicles are commercially ready. Its MCS explainer frames 30-minute charging as the threshold for long-haul viability and points to future 1 MW-plus charging once standards and vehicle hardware mature. CharIN’s MCS documentation helps translate that marketing into real technical requirements: CCS-derived architecture, up to 1,250 volts and 3,000 amps DC, Ethernet
    plus ISO 15118-20 communications, and large current-handling hardware. TeraWatt’s own five-year reflection is notable because it says the company partially pulled back from its original islanded microgrid vision and shifted toward denser warehouse and industrial hubs, suggesting product strategy is adapting to actual customer demand and grid realities.'
