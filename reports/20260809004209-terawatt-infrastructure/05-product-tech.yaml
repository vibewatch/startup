  - CE014
  - CE015
  - CE017
  notes: Benefits are based on public case studies and company positioning; they should be treated as directional until customer contracts or broader operational data are reviewed.
- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Utility interconnection and switchgear
    - Delivers site power from the grid to chargers and support equipment
    - Utility service upgrades, protection equipment, and permitting
    - Interconnection delays can stall site commissioning for months
  - - DC fast chargers / EVSE
    - Converts site power into vehicle charging sessions
    - Chosen EVSE vendors, parts supply, and OEM interoperability
    - Vendor-specific faults or incompatible vehicle behavior can create failed sessions
  - - Charge Management Software
    - Aggregates charger data, alerts, billing, and operational views
    - Cloud software stack, telemetry, and integrations
    - No public cyber controls or API documentation
  - - Network operations center
    - Performs monitoring, hourly sweeps, fault triage, and work-order generation
    - Alerting quality, staffing, and software visibility
    - Limited public evidence on fleetwide staffing ratios or escalation performance
  - - Field service technicians
    - Handle installation, maintenance, repairs, upgrades, and safety procedures
    - Local technician coverage, spare parts, test equipment, and travel readiness
    - Scaling nationally could pressure response times and training consistency
  - - OEM / EVSE validation layer
    - Tests EV to EVSE to CMS interactions and plug-and-charge behavior
    - Vehicle OEM cooperation and hardware qualification labs
    - Interoperability risk increases as MCS and new vehicle platforms emerge
  claimRefs:
  - CE002
  - CE019
  - CE025
  - CE026
  - CE027
  - CE028
  notes: Architecture is reconstructed from public solution pages, case studies, job postings, and operational blog posts. TeraWatt has not published a full reference architecture.
