  - id: GE001
    gap: Public materials do not disclose TeraWatt's detailed CMS architecture, APIs, or cybersecurity controls for its charging network and operational software.
    severity: high
    relatedQuestionRefs:
    - QE005
    - QE006
    - QE019
    relatedTableRefs:
    - TE003
    - TE004
    nextStep: Request product architecture diagrams, API docs, authentication model, network-segmentation design, firmware-signing controls, and any SOC 2 / IEC 62443 / NIST-aligned assessments.
  - id: GE002
    gap: TeraWatt publishes operational anecdotes and targets, but not an audited networkwide series for uptime, charge-success, MTTR, or SLA performance.
    severity: high
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE017
    relatedTableRefs:
    - TE004
    nextStep: Obtain monthly fleet operations dashboards, SLA reports, site-level incident logs, and customer performance reviews covering at least the last 12 months.
