- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - TeraWatt solution
  - measurable benefit
  - limitation
  rows:
  - - Long-haul or drayage truck charging
    - Reserve or queue for high-power fleet charging near freight corridors
    - Shared and reservable trucking sites with multi-stall layouts and route-relevant locations
    - Reduces detours and enables offsite charging access
    - Public sources do not disclose average wait time, price per kWh, or reservation no-show rate
  - - AV / ridehail fleet depot charging
    - Operate high-throughput urban charging near service zones
    - Turnkey depots with site, power, chargers, CMS, and uptime support
    - Minimizes deadhead miles and centralizes operations
    - No public AV throughput, charger-to-vehicle ratio, or queueing policy disclosure
  - - Lane or route pilot before permanent deployment
    - Test if an EV route can work with supplemental charging
    - Temporary charging solution with desktop review, equipment delivery, commissioning, and CMS data visibility
    - 3.5-week deployment and 100% plugged-session success in case study
    - Case study covers a single pilot, not a generalized rollout benchmark
  - - Live charger fault response
    - Detect, isolate, and restore failed stalls quickly
    - NOC alerting, hourly sweeps, work-order generation, and on-site technician dispatch
    - 32-minute example repair versus 3–7-day typical public-network service claim
    - No independent audit of repair-time distribution across the network
  - - Fleet analytics and billing visibility
    - Understand sessions, performance, and charging activity
    - CMS supplies real-time charging activity, performance metrics, and billing information
    - Supports operational reporting and customer transparency
    - No public API spec or sample reporting output
  claimRefs:
