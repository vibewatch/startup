    - Contract templates, margins, and handoff model are not public
  - - Autonomous / ridehail charging depots
    - AV and ridehail operators
    - Live in Los Angeles; roadmap expanding
    - Bundles property, power, EVSE, CMS, and uptime-backed operations into one depot offer
    - No public SLA language, queueing logic, or realized AV customer economics
  - - Charge Management Software
    - Fleet managers and internal ops teams
    - Operational but architecture undisclosed
    - Provides charging activity, performance metrics, and billing from centralized software
    - No public system diagram, API documentation, or cyber-certification disclosure
  - - Network operations center + field service
