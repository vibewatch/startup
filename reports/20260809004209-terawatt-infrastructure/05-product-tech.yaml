company:
  name: TeraWatt Infrastructure
chapter:
  number: 5
  title: Product & Technology
  summary: TeraWatt Infrastructure delivers a full-stack EV fleet charging product that combines site development, multi-megawatt charging hardware, proprietary charge-management software, and field operations rather than selling only chargers. Public evidence through August 2026 supports credible differentiation in hub design, uptime operations, and future MCS readiness, but still leaves gaps around cyber controls, network-wide performance disclosure, vendor choices, and the economics of battery or microgrid features.
sections:
- id: product-surface-and-workflows
  title: Product Surface and Customer Workflows
  body: TeraWatt presents the product as a charging-infrastructure service rather than a single charger SKU. The solutions page says customers can use semi-private network sites or ask TeraWatt to build custom infrastructure on customer land or TeraWatt-controlled land. The trucking page adds that these sites are shared and reservable, while the autonomous-fleet materials describe a turnkey bundle of property, power, chargers, charge-management software, and uptime-backed operations. That makes the core product closer to an integrated charging platform for fleets than to hardware resale. The operational workflow also appears to differ by use case. Trucking fleets need strategically located pull-through hubs and reservation logic, while AV and ridehail fleets need depot-style sites near high-utilization urban corridors with predictable charging turns and strong service-level performance. The Port of Long Beach to Lebec case study shows TeraWatt can also deploy temporary or pilot charging
    environments quickly to help customers test routes before committing to a permanent buildout. Across these use cases, the product promise is to simplify site selection, utility coordination, equipment procurement, software visibility, and maintenance into one vendor relationship.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE013
  - CE014
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-operations-stack
  title: Architecture and Operations Stack
  body: Public materials indicate that TeraWatt’s architecture spans utility service, switchgear, charging equipment, cloud software, telemetry, and on-site service operations. The solutions page says all sites are underpinned by proprietary Charge Management Software and a robust operations and maintenance program, and the Long Beach-Lebec pilot says the CMS provides real-time charging activity, performance metrics, and billing information. The operations-team post adds more granularity by describing alerts inside the CMS portal, routine hourly sweeps by the network operations center, work-order generation, and technician dispatch after charger faults. Job postings reinforce that this is not a thin wrapper around third-party hardware. TeraWatt is hiring a head of EVSE hardware product engineering to run EV to EVSE to CMS automated testing, vehicle-OEM interoperability, vendor qualification, and the technical path to MCS, plus field technicians responsible for equipment from the incoming
    utility switchboard to the EVSE. Together, those sources support a view of TeraWatt as an owner-operator with a meaningful internal product and reliability stack, even though the company still does not publicly disclose the specific charger vendors, CMS software architecture, or cybersecurity design.
  claimRefs:
