- id: TU003
  title: Named customer proof table
  columns:
  - customer
  - segment
  - deployment / use case
  - production vs pilot
  - outcome / evidence
  - limitation
  enumerationScope:
    coverage: partial
    basis: Covers the named customers and coalition members publicly tied to TeraWatt in retained sources through August 2026; TeraWatt does not publish a complete customer roster or all live accounts.
  rows:
  - - PepsiCo
    - Heavy-duty fleet
    - Three-year offsite charging deal using TeraWatt's Rancho Dominguez multi-tenant site
    - Production / contracted
    - Named enterprise account with operational Tesla Semi context and explicit multi-year term
    - Public sources do not quantify spend, kWh volume, or renewal options
  - - Desert Cab
    - Taxi fleet
    - Charging management software, O&M, driver education, and smart charging for Las Vegas taxi electrification
    - Production support
    - Clear named customer with quoted owner feedback and concrete operational pain-point resolution
    - No public contract value, renewal term, or customer expansion revenue
  - - AIT Worldwide Logistics / DB Schenker / Maersk / Microsoft / PepsiCo
    - Shipper-carrier coalition
    - Pilot heavy-duty EV operations along I-10 using six TeraWatt hubs
    - Pilot / planned
    - High-quality member list validates strategic relevance to major logistics buyers
    - Pilot status means revenue, frequency, and conversion to long-term contracts are unclear
  - - C.H. Robinson / DHL Supply Chain / Electrolux / IKEA
    - Expanded coalition members
    - Added to I-10 coalition as additional freight and shipper participants
    - Pilot / planned
    - Expands ecosystem breadth and suggests coalition momentum
    - Still not proof of active recurring charging usage
  - - Ridehail and light-duty fleet operators near LAX
    - Urban fleet segment
    - Use of the Inglewood site with automated site management and proactive maintenance
    - Production site availability; named customer set not public
    - Shows product designed for real urban-fleet usage
    - No named customer list attached to the site
  - - Velocity Vehicle Group
    - Channel / ecosystem partner
    - Joint network overlap to reduce range-anxiety and maintenance uncertainty for HD EV fleet customers
    - Go-to-market partnership
    - Could help TeraWatt access fleets that also need EV-certified service support
    - Partner proof is not the same as a direct paying charging customer
