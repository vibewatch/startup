- id: adoption-and-operational-outcomes
  title: Adoption and Operational Outcomes
  body: 'The public record provides useful but uneven adoption evidence. PepsiCo disclosed 21 Tesla Semis in Sacramento as of September 2023, nearly 680,000 zero-emission miles traveled as of September 1, and route patterns ranging from local delivery to 250-to-520-mile long-haul runs. Run on Less adds that the fleet used four 750 kW chargers and had 1.2 MW of solar plus 2.4 MWh of backup storage on site. Desert Cab disclosed a 400-cab operation, about 2.7 million rides in 2022, 15 million miles traveled, and 25 EVs initially on the road. Terawatt''s case study then shows the customer problem set in detail: grid limits, low charging visibility, and slow repair times. The reported outcomes are operational rather than purely financial, including power-limit management, a smart charging algorithm, remote session control, proactive notifications, and better use of existing chargers. That is credible adoption proof, but it remains highly case-study driven. TeraWatt still does not publish aggregate
    customer counts, fleetwide usage growth, or repeat-order curves across its customer base.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
