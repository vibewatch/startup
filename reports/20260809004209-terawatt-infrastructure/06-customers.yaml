- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - I-10 coalition member expansion
    - Pilot members may convert into bilateral contracts if corridor charging works
    - Could diversify beyond a few anchor logos
    - Track whether any coalition member signs direct long-term charging agreements
  - - More urban fleet depots
    - Southern California and Las Vegas concentration may create geographic concentration
    - Regional success may not generalize nationally
    - Review active pipeline by region and site status
  - - Existing customer fleet electrification growth
    - Accounts like PepsiCo or Desert Cab may grow with fleet electrification
    - Expansion upside exists if charging capacity scales alongside vehicle counts
    - Request account-level fleet-growth assumptions and reserved capacity plans
  - - Channel / service partnerships
    - Partners like Velocity may widen reach to truck buyers
    - Could improve acquisition efficiency without diluting infrastructure ownership
    - Request referral or co-selling pipeline metrics
  - - Opaque top-account revenue mix
    - Public spotlight on a few logos may hide concentration
    - Underwriting risk if a small number of accounts drive most revenue
    - Request top-10 customer revenue concentration and churn history
