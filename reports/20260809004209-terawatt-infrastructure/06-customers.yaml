- id: durability-expansion-and-concentration
  title: Durability, Expansion, and Concentration
  body: Customer durability is the weakest part of the public evidence set. TeraWatt clearly shows named relationships, but it rarely shows renewals, expansion revenue, usage-based cohorts, or customer economics after the initial win. The only explicit public contract duration in the retained sources is the three-year PepsiCo arrangement. Desert Cab supplies strong qualitative satisfaction evidence through owner quotes and operational outcomes, but no contract value, renewal term, or expansion revenue. The I-10 coalition signals expansion of ecosystem relevance because it added major shippers and carriers in 2025, yet it is still a shared pilot structure rather than proof of durable recurring revenue from each participant. Concentration risk is also opaque. Public materials highlight a small set of flagship customers and coalition members concentrated in Southern California, Las Vegas, and the I-10 freight corridor. That can be interpreted positively as focused go-to-market execution, but
    it also means the public dataset may overrepresent a few anchor accounts and understate how diversified actual demand is.
  claimRefs:
  - CU002
  - CU006
  - CU010
  - CU011
  - CU019
  - CU020
  - CU021
  - CU024
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict-and-diligence-needs
  title: Customer Verdict and Diligence Needs
  body: TeraWatt has enough public customer proof to show that real fleets are using or planning around its infrastructure, and that the company's value proposition resonates most where charging complexity meets mission-critical transport operations. PepsiCo and Desert Cab are the best examples because they offer specific deployment detail and real operational context. The I-10 consortium broadens the relevance of the story into shipper and carrier ecosystems and suggests that enterprise customers view TeraWatt as a credible strategic partner. However, the chapter's central diligence conclusion is that customer proof is broader than customer durability proof. Missing retention data, absent concentration disclosure, and the lack of a public customer ledger mean the company still needs diligence around who pays, who expands, how usage converts to revenue, and whether public flagship accounts are representative of the broader base. The public record supports a positive adoption signal, but
    not yet a fully underwritten customer quality conclusion.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU024
  - CU025
