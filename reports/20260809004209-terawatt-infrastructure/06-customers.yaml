company:
  name: TeraWatt Infrastructure
chapter:
  number: 6
  title: Customers
  summary: 'TeraWatt''s public customer evidence is strongest in North American fleet niches where charging complexity is acute: heavy-duty trucking, taxi and ridehail operations, and route-pilot programs. The named proof set includes live production support for Desert Cab and PepsiCo plus a widening coalition of shippers and carriers around the I-10 corridor, but public retention, revenue concentration, and renewal data remain largely absent, so customer durability still has to be inferred from partnerships rather than quantified from cohorts.'
sections:
- id: customer-segments-and-buyers
  title: Customer Segments, Buyers, and Use Cases
  body: TeraWatt's customer base is best understood as a set of fleet segments with different charging pain points rather than as a homogeneous list of logo wins. The trucking segment includes dedicated fleet operators and shippers that need corridor access, pull-through layouts, and dependable offsite charging. The clearest named example is PepsiCo, which signed a multi-year deal to use TeraWatt's Rancho Dominguez site for offsite heavy-duty charging. Another segment is high-utilization urban fleets, where ridehail, autonomous, and taxi customers care about charger availability, driver dwell time, and urban site placement. Desert Cab is the strongest visible proof here. A third segment is multi-party corridor coalitions, where the immediate buyer may be a consortium or program sponsor rather than a single fleet. The I-10 initiative brings together shippers and carriers including AIT Worldwide Logistics, DB Schenker, Maersk, Microsoft, PepsiCo, C.H. Robinson, DHL Supply Chain, Electrolux,
    and IKEA around shared corridor infrastructure. These patterns imply that TeraWatt sells to enterprise operations teams, sustainability leaders, logistics organizations, and fleet operators that need charging as an enabling layer for broader transport operations.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof
  title: 'Named Customer Proof: Production, Pilot, and Channel Signals'
  body: 'The strongest named customer proof combines public logos with concrete deployment details. PepsiCo is not just a logo: the company disclosed a three-year deal for its vehicles to use TeraWatt''s multi-tenant Rancho Dominguez site, while PepsiCo''s own Run on Less materials show intensive Tesla Semi operations in Sacramento and the sort of high-power, high-utilization use case that makes offsite charging valuable. Desert Cab is another meaningful proof point because public sources describe both the customer relationship and operational results: charging-management software, operations and maintenance support, driver education, smart charging, remote troubleshooting, and rarely out-of-service chargers. The I-10 corridor coalition is a different category of proof. It is strategic and high quality because the member list is strong, but it is still pilot-oriented and planned for 2027 rather than fully deployed revenue at scale today. Velocity Vehicle Group is better interpreted as a
    channel and service partner than as a direct paying charging customer, but it still matters because it lowers EV adoption friction for fleets by linking TeraWatt charging with EV-certified truck maintenance coverage.'
  claimRefs:
  - CU002
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
