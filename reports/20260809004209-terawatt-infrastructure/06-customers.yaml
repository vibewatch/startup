callouts:
- calloutType: insight
  title: The best proofs are operationally specific, not just logo-driven
  body: PepsiCo and Desert Cab matter because their public materials show route profiles, EV counts, charging configurations, software use, or maintenance outcomes. That is much stronger than a bare logo wall and suggests TeraWatt's product is being used inside real transport operations.
  claimRefs:
  - CU002
  - CU003
  - CU005
  - CU006
  - CU007
- calloutType: risk
  title: Retention remains mostly invisible
  body: Public customer proof is stronger than public customer durability proof. Apart from PepsiCo's three-year term and qualitative Desert Cab satisfaction, the chapter lacks public data on renewals, NRR, top-account mix, and repeated expansion behavior.
  claimRefs:
  - CU002
  - CU006
  - CU019
  - CU020
  - CU024
