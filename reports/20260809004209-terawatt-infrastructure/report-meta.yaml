  topStrengths:
  - Integrated infrastructure-owner model spanning sites, software, and operations for fleet charging.
  - Meaningful customer and deployment proof in trucking, taxi, ridehail, and corridor-use cases.
  - Strong funding history and policy alignment with freight-electrification buildout.
  topRisks:
  - Revenue, margin, utilization, and cap-table opacity make valuation support weak.
  - Grid interconnection, equipment lead times, and MCS transition can delay monetization and raise capex.
  - Customer durability and concentration remain largely unproven in public evidence.
  unresolvedGaps:
