  - id: public-traction-and-disclosed-scale
    title: Public Traction and Disclosed Scale
    body: >-
      TeraWatt discloses enough operating detail to show real deployment, but not enough to convert deployment into a
      financial model. The 2026 roadmap and leadership release say the company has delivered 68 million miles of clean
      EV range, abated 27 million kilograms of CO2, grown to 80+ employees, and is on pace to double its national
      footprint while opening 12 new markets. Site-specific disclosures add further color: the Inglewood site has 29 DC
      fast chargers; Rancho Dominguez has 20 pull-through and bobtail stalls, 7 MW of power, and expected throughput of
      up to 125 trucks per day; one AV garage site described by management now has 60 ports dedicated to an autonomous
      fleet. These facts support the claim that TeraWatt is building real physical infrastructure at scale.

      They do not, however, reveal revenue quality. There is no public revenue number, no disclosed site utilization, no
      gross-margin bridge, and no public view of backlog versus merely planned capacity. The traction story is therefore
      operationally credible but financially incomplete.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI014
      - CI025
      - CI036
      - CI039
      - CI043
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: >-
      Capital availability is the most concrete public financial datapoint for TeraWatt. The company disclosed more than
      $1 billion of institutional capital in September 2022, then added a five-year senior secured facility in June 2026
      with $150 million committed and a further $150 million incremental option. Independent coverage described it as the
      first commercial bank facility for the company, and the April 2026 CFO appointment explicitly tied finance hiring
      to building scalable equity and debt sources for a still-untapped infrastructure category. Public grant support is
      meaningful too: the federal award for two New Mexico truck-charging centers totals $63.8 million, and the CEC's
      Inglewood report attributes a further $2 million in grant funding to that ridehail depot.

      What remains hidden is the denominator. Public sources do not disclose cash on hand, burn, runway, debt covenants,
      or how much of earlier institutional capital remains available for new site development. Underwriting must therefore
      treat TeraWatt as financing-dependent: it is clearly capable of raising money, but not yet publicly shown to be
      self-funding.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI027
      - CI028
