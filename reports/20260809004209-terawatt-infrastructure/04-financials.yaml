  - id: verdict-and-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      The retained evidence supports a consistent financial interpretation: TeraWatt looks more like a project-backed
      infrastructure platform than like a software company with marginal-cost scaling. That can be attractive if site
      economics are strong and contracts are sticky, but the public record stops short of proving either point.
      Management has shown an ability to raise capital, win grants, open operational sites, and recruit executives suited
      to complex financing and enterprise partnerships. Yet every underwriting metric that would validate the equity
      story — realized revenue, gross margin, blended energy price, contribution margin per site, customer concentration,
      churn, utilization, debt-service headroom, and backlog quality — remains private.

      Public comparables also caution against generous assumptions. ChargePoint and EVgo demonstrate that scale alone does
      not eliminate capex, operating losses, or margin pressure in charging infrastructure. TeraWatt may eventually show
      better economics because its sites are more mission-critical and less retail-oriented, but without contract and
      utilization disclosure the appropriate conclusion is not bullish certainty. It is that the business may be valuable,
      but its financial quality is not yet publicly underwritable.
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI036
      - CI039
      - CI040
      - CI042
      - CI043
    tableRefs:
      - TI005
