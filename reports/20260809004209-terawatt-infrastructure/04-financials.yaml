company:
  name: TeraWatt Infrastructure
chapter:
  number: 4
  title: Financials
  summary: >-
    TeraWatt's public financial story is clear on structure but opaque on outcomes. Retained official materials show an
    infrastructure-heavy revenue model built around owning real estate, power, charging equipment, and operations while
    turning fleet customers' upfront capex into operating expense. Public disclosures confirm major financing capacity —
    more than $1 billion of 2022 institutional capital, a June 2026 five-year facility with $150 million committed and
    a further $150 million accordion, and at least $65.8 million of disclosed grant support across specific projects —
    but they do not disclose revenue, gross margin, burn, runway, utilization, or contract economics. Public charging
    comparables such as ChargePoint and EVgo show that even scaled operators still face material losses, capex, and
    thin margins, reinforcing that TeraWatt should be underwritten as an asset-heavy infrastructure platform rather than
    a software-like business.
sections:
  - id: revenue-model-and-monetization
    title: Revenue Model and Monetization Stack
    body: >-
      TeraWatt's public materials consistently describe a monetization model built around taking on infrastructure
      complexity for fleets, not around selling chargers one unit at a time. The company says it acquires the real
      estate, secures power, installs charging equipment, layers software and operations on top, and then lets fleet
      customers consume the result as an operating expense. The trucking and autonomous-fleet pages imply at least four
      monetizable layers: dedicated or shared charging access, reservation and site-operations support, uptime-backed
      service levels, and a newer product layer around data operations and energy management. The company also markets
      lower cost-per-mile and tighter interaction with the grid as explicit customer value, which suggests pricing can
      reflect avoided downtime and avoided capex rather than only per-kWh energy spread.

      What is not public is equally important. No retained source discloses list pricing, blended contract structure,
      revenue mix across AV versus trucking, or whether software and energy-management tools are separately billed or
      bundled. The revenue model is understandable qualitatively, but its quality, margin profile, and recognition
      timing remain undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI035
      - CI039
      - CI040
    tableRefs:
