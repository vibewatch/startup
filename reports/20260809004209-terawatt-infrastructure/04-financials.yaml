      - TI002
    figureRefs:
      - FI001
  - id: gtm-motion-and-sales-efficiency-proxies
    title: GTM Motion and Sales Efficiency Proxies
    body: >-
      TeraWatt appears to sell through an enterprise, site-led motion with long planning cycles rather than through a
      high-volume transactional funnel. The autonomous-fleet design article says charging hubs take 1.5 years or more
      to assemble, and that TeraWatt works closely with customers to anticipate changing site needs before the physical
      asset is finished. That implies lumpy, relationship-driven selling tied to zoning, power availability, customer
      route maps, and long-horizon city launches. The April 2026 leadership expansion supports that interpretation:
      TeraWatt hired a CFO with debt-and-equity scaling experience, a chief product and strategy officer to commercialize
      offerings, and a chief business officer with AV partnership history. Those hires look more like infrastructure and
      strategic-account scaling than like a short-cycle software salesforce buildout.

      Public proxies suggest the GTM burden is meaningful. ChargePoint and EVgo spread cost across broad networks,
      whereas TeraWatt is targeting complex fleets that likely require bespoke siting and underwriting work per site.
      Public CAC, payback, contract duration, and customer concentration metrics are absent, so sales efficiency can only
      be inferred indirectly from the long build cycle and financing emphasis.
    claimRefs:
      - CI007
      - CI014
      - CI016
      - CI022
      - CI024
      - CI025
      - CI026
      - CI035
      - CI041
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: >-
      The retained evidence points to a capital-intensive unit-economic stack. TeraWatt's own design materials say the
      company provides real estate, zoning and permitting, power — including onsite solar and battery storage where
      needed — charging infrastructure, and SLA-backed uptime. Those are expensive layers before a single paid session
      occurs. The California Energy Commission's LAXREV report gives one concrete anchor: TeraWatt's Inglewood ridehail
      depot carried a total budgeted project cost of $6.13 million, including a $2 million CEC grant, for a 29-charger
      secure shared-use site. TeraWatt's separate $63.8 million federal award for two New Mexico heavy-duty charging
      centers shows that corridor-scale projects can reach far larger capital envelopes, even if the scopes are not
      perfectly comparable.

      Public comparables reinforce the caution. EVgo's Q2 2026 disclosure still showed sub-11% GAAP gross margin and
      elevated capital expenditures despite much larger network throughput, while ChargePoint remained loss-making at
      more than $400 million of annual revenue. TeraWatt may enjoy stickier, site-specific contracts than these peers,
      but the public record does not yet show enough margin or utilization data to prove a fast payback model.
    claimRefs:
