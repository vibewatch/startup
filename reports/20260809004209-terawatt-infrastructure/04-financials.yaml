  evidenceGaps:
    - id: GI001
      gap: "Retained public materials do not disclose Terawatt's recognized revenue, revenue mix, or accounting treatment for site-access fees, charging revenue, and software or service layers."
      severity: high
      relatedQuestionRefs: [QI001, QI002, QI003, QI021]
      relatedTableRefs: [TI001, TI002]
      nextStep: "Request audited revenue bridge by product line and a memo describing revenue-recognition policy for contracts that bundle infrastructure access, charging, and services."
    - id: GI002
      gap: "Site-level gross margin, contribution margin, and utilization are absent, preventing any public verification of payback or asset-turn assumptions."
      severity: high
      relatedQuestionRefs: [QI006, QI020, QI021]
      relatedTableRefs: [TI003]
      nextStep: "Request monthly site P&Ls for mature depots including kWh sold, reservation occupancy, opex, maintenance, demand charges, and contribution margin."
    - id: GI003
      gap: "Cash on hand, burn rate, runway, and debt-covenant headroom are not publicly disclosed despite the new bank facility."
      severity: high
      relatedQuestionRefs: [QI009, QI011, QI026]
      relatedTableRefs: [TI004, TI005]
      nextStep: "Request latest management balance sheet, liquidity forecast, debt agreement summary, and covenant-testing model."
    - id: GI004
      gap: "Public sources do not separate contracted backlog from merely planned or in-development capacity, so growth claims may not map cleanly to near-term revenue."
      severity: medium
      relatedQuestionRefs: [QI007, QI021, QI026]
      relatedTableRefs: [TI004, TI005]
      nextStep: "Ask for a project-pipeline waterfall that distinguishes optioned land, power-secured sites, permitted sites, contracted sites, energized sites, and revenue-generating sites."
    - id: GI005
      gap: "Comparable public networks provide useful reality checks on capex and margins, but their business mixes differ enough from Terawatt that direct benchmarking remains imperfect without company-specific contract data."
      severity: medium
      relatedQuestionRefs: [QI013, QI016, QI023]
      relatedTableRefs: [TI003, TI005]
      nextStep: "Obtain internal benchmark deck or board materials showing which public comps management itself uses for margin, utilization, and financing assumptions."
