    figureRefs:
      - FP001
  - id: direct-platform-profiles
    title: Direct Platform Profiles
    body: >-
      Greenlane is the clearest corridor-led heavy-duty substitute. Its official and sponsor materials describe a
      public commercial-vehicle charging network backed by Daimler Truck, NextEra Energy Resources, and BlackRock, with
      an initial I-15 corridor of more than 100 chargers and a Colton flagship site designed for future MCS support.
      Voltera is the most comparable urban-infrastructure developer: it emphasizes high-utilization hubs, no-upfront-
      capital deployment, and integrated power, charging, and operations infrastructure, then scaled that story further
      by combining with Revel into a platform expected to span more than 1,000 stalls across 11 metros.

      Forum Mobility and WattEV compete differently by bundling charging with truck access or freight operations.
      Forum offers truck leasing and charging subscriptions for one monthly price and already markets a 9 MW, 44-port
      flagship port depot. WattEV goes one step further into freight orchestration, presenting a vertically integrated
      Truck-as-a-Service model that includes trucks, depots, maintenance, and dispatch support. These bundled models
      matter because they compete not only for charging demand but for the fleet operator's broader transition budget
      and workflow ownership.
    claimRefs:
      - CP015
