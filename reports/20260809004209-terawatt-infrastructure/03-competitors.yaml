  - id: switching-costs-moats-and-execution-risk
    title: Switching Costs, Moats, and Execution Risk
    body: >-
      TeraWatt's most credible moat is not proprietary charger hardware. It is the combination of land control, utility
      work, secure operational layouts, and workflow-specific software for fleets that need predictable turnaround.
      Once a heavy-duty or AV depot is energized, integrated with the fleet's operating stack, and embedded in route
      planning, switching away is materially harder than replacing a generic public-network app. That same logic helps
      Voltera, Forum, and WattEV. Greenlane has a related but more corridor-oriented moat because pull-through public
      charging, sponsor backing, and telematics-informed siting are difficult to copy quickly.

      The moat is still incomplete. Fleets can multi-home across public networks and dedicated depots, which limits
      lock-in. Public-network players remain advantaged on current scale, and private platforms still need to prove that
      utilization and margins justify all the capital trapped in real estate and power upgrades. FreeWire's 2024
      collapse is a useful warning: even real technical differentiation can fail if manufacturing, working capital, and
      service execution break before infrastructure demand reaches scale. In this category, durable moats come from
      capital discipline and site execution at least as much as from technology.
    claimRefs:
      - CP027
      - CP028
      - CP029
      - CP030
      - CP035
      - CP036
      - CP040
      - CP042
      - CP043
      - CP044
    tableRefs:
      - TP004
    figureRefs:
      - FP003
  - id: status-quo-substitutes-and-likely-entrants
    title: Status-Quo Substitutes and Likely Entrants
    body: >-
      The largest substitute is still self-build or delay. A fleet can try to energize its own depot, contract for site
      services from utilities and EPCs, and use public charging only for overflow. That path often looks cheaper on a
      narrow equipment basis, but it pushes permitting, interconnection, queue management, and uptime risk back onto the
      fleet. TeraWatt's pitch is strongest where customers do not want to become infrastructure developers themselves.

      The likely-entrant risk is not one specific startup; it is ecosystem convergence. EVgo's 2026 agreement with Tesla
      to deploy EVgo-branded Superchargers shows that public-network operators are widening power, connector, and site
      options. ChargePoint and Electrify America already serve enterprise site owners. Greenlane could extend beyond its
      initial heavy-duty corridor into more freight nodes, while Voltera's merger with Revel shows how urban charging
      platforms can combine customer relationships, real estate, and capital into a larger footprint quickly. TeraWatt
      therefore benefits from being early, but it does not yet operate in a winner-take-most market.
