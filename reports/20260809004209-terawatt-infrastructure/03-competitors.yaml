company:
  name: TeraWatt Infrastructure
chapter:
  number: 3
  title: Competitors
  summary: >-
    TeraWatt competes in a layered fleet-charging landscape rather than in one clean peer set. The closest direct
    substitutes are infrastructure operators that control land, power, and depot operations for commercial fleets,
    especially Greenlane, Voltera, Forum Mobility, and WattEV. Public-network incumbents such as ChargePoint, EVgo,
    and Electrify Commercial are larger and more proven on charger count, software, and customer reach, but their
    public materials emphasize broader network or enterprise charging models more than TeraWatt-style port, AV, and
    secure-yard operations. TeraWatt's moat is therefore less about charger hardware and more about site control,
    utility readiness, and workflow fit for heavy-duty and autonomous fleets. The adverse evidence is that pricing is
    opaque, multi-homing remains possible, and capital access is becoming a decisive competitive weapon.
sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      The relevant competitive set is broader than "other charging companies." TeraWatt's buyer is trying to solve a
      job that combines land, grid capacity, charger uptime, reservation logic, fleet operations, security, and often
      cleaning, staging, or data-offload workflows. That makes the nearest rivals other full-stack infrastructure
      platforms such as Greenlane, Voltera, Forum Mobility, and WattEV, all of which sell charging access as an
      operating system for fleets rather than as a stand-alone charger. These players differ on route focus: Greenlane
      is explicitly building public heavy-duty corridors, while TeraWatt, Voltera, Forum, and WattEV lean more toward
      depots, urban freight, or vertically integrated fleet operations.

      A second ring includes public-network and enterprise-charging incumbents such as ChargePoint, EVgo, and
      Electrify Commercial. They compete for the same fleet budget when customers prefer to own sites, rely on broader
      public-network access, or mix dedicated charging with route charging. The status quo remains self-build or delayed
      electrification, not simply another charging network. For underwriting, the core question is whether TeraWatt's
      site-control model is sufficiently differentiated to defend against both public-network scale and other capital-
      intensive depot developers.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP013
      - CP015
      - CP018
      - CP021
      - CP024
