callouts:
  - calloutType: "insight"
    title: "The moat is the governed data layer, not just the tracker"
    body: "Trackunit's strongest public product signal is the combination of construction-specific data normalization, OEM compatibility, and a real extension surface through APIs, SDKs, and marketplace integrations."
    claimRefs: ["CE002", "CE004", "CE006", "CE008"]
  - calloutType: "risk"
    title: "Adoption friction may come from rollout and governance, not feature absence"
    body: "The assigned pool suggests buyers still need to underwrite hardware cost, per-asset pricing, and worker/location-data governance before the platform's architecture can translate into reliable ROI."
    claimRefs: ["CE011", "CE012"]
