company:
  name: "Trackunit"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Trackunit has clearly moved beyond stand-alone telematics hardware into a construction-specific operating data platform:
    public materials show a layered product spanning telematics, OEM workflows, normalized data, APIs/SDKs, and ecosystem
    integrations, while independent reviews reinforce that the platform is purpose-built for off-highway equipment rather than
    generic vehicle fleets. The strongest product evidence is breadth and ecosystem fit, but the assigned pool still leaves
    material diligence gaps around uptime/SLA disclosure, public implementation benchmarks, and security-assurance detail
    beyond ISO 27001 and GDPR-oriented positioning.
sections:
  - id: "product-scope-and-user-jobs"
    title: "Product scope and user jobs"
    body: >-
      Public and third-party materials consistently describe Trackunit as a construction-specific telematics and fleet-management
      platform serving OEMs, rental companies, and contractors rather than a generic vehicle tracker. The product surface now
      spans Trackunit Manager workflows, the IrisX operating data platform, and a specialized OEM offer built around remote
      diagnostics, machine-health visibility, predictive service use cases, and branded digital experiences. That matters because
      the product is being sold into several adjacent workflows at once: fleet visibility for operators, aftermarket and service
      enablement for OEMs, and cross-system data reuse for digital product and integration teams. The strategic shift from IoT
      device roots to a SaaS-led construction platform also suggests product maturity is tied to software adoption and ecosystem
      depth, not just device footprint.
    claimRefs: ["CE001", "CE002", "CE005", "CE014"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-extension-model"
    title: "Architecture and extension model"
    body: >-
      The official IrisX surface presents a recognizable operating-data-platform architecture: ingest data from machines and
      business systems, harmonize it into a governed layer, apply analytics and AI, then expose outcomes through automation,
      applications, and partner integrations. The developer surface is not an afterthought; Trackunit publicly offers APIs,
      an App SDK, a component library, marketplace integrations, and ISO feeds, while the OEM pages emphasize compatibility
      validation through Works With Trackunit and connectivity across mixed fleets. Taken together, the product looks less like
      a closed telematics dashboard and more like a construction-specific data-and-workflow layer designed to sit between field
      hardware, OEM portals, enterprise systems, and customer-facing apps.
    claimRefs: ["CE003", "CE004", "CE006", "CE007", "CE008", "CE015"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-maturity-signals"
    title: "Differentiation and maturity signals"
    body: >-
      Independent sources reinforce the same differentiation pattern: Trackunit is strongest where off-highway construction
      workflows diverge from van- and truck-centric telematics. Reviews call out engine-hour workflows, machine fault-code
      handling, predictive service alerts, and OEM integrations as core differentiators, while Software Advice adds a modest but
      real proof point that the product has accumulated public review volume and feature breadth rather than living only on
      marketing copy. Official quick facts on connected assets, OEM feeds, and integrations point to a platform that has
      already scaled materially, but those claims still remain vendor-authored and do not substitute for independent evidence on
      implementation speed, realized ROI, or customer stickiness by segment.
    claimRefs: ["CE007", "CE008", "CE009", "CE013", "CE014"]
  - id: "trust-compliance-and-product-risks"
    title: "Trust, compliance, and product risks"
    body: >-
      Trackunit does surface some trust signals, especially ISO 27001 on the IrisX page and GDPR-oriented positioning in a 2026
      external review, which is directionally relevant because fleet telematics can expose sensitive worker and location data.
      The same external review also highlights that deployment can trigger co-determination and retention-governance issues in
      some European jurisdictions, so implementation risk is partly organizational and legal, not just technical. Product-risk
      disclosure in the assigned pool is otherwise limited: reviewers can point to hardware cost, per-asset pricing, and poor fit
      for ordinary vehicle fleets, but the source set does not expose public uptime SLAs, API reliability metrics, or detailed
      security-audit artifacts beyond the high-level certification signal.
    claimRefs: ["CE010", "CE011", "CE012"]
