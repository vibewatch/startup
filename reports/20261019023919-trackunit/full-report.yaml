      - number: '6.2'
        title: Named deployments indicate production use beyond logo slides
        blocks:
          - type: paragraph
            body: >-
              The customer proof is more persuasive than a simple logo wall. Trackunit's 2026 launch release says
              Sunbelt Rentals UK & Ireland is already live on Portals, and the IrisX page frames that relationship as an
              ongoing rollout across more product types and assets. XCMG USA separately presents factory-connected
              TrackUnit telematics as part of select machines, which is stronger than a loose channel mention because it
              implies embedded deployment in OEM workflows. Third-party case-study aggregation adds additional named
              rental and contractor references, although the public evidence is still weighted toward promotional
              outcomes rather than independently measured ROI.
            claimRefs:
              - CU005
              - CU006
