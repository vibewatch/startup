              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              The leading residual exposure is data governance rather than a documented breach. Trackunit says IrisX
              spans more than six million connected assets and exposes governed data to multiple AI tools, while an
              independent European review highlights that fleet location data can become personal data and a
              works-council matter. That combination raises impact even though the assigned evidence contains no
              verified incident record. Operational execution ranks next: the product depends on field hardware,
              multiple communications modes, OEM feeds, and ecosystem compatibility, and one verified-user review
              reports installation, battery, and support failures. Financial-model risk is also elevated because the
              2025 majority-investment announcement gives no purchase-price, debt, covenant, or interest-burden detail,
              while the accessible PrivCo fetch exposes no usable financial profile. These rankings are provisional and
              should be replaced by management data rather than treated as quantified probabilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR009
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest legal pathway is privacy and workforce monitoring. The independent review states that
              telematics location data about identifiable people falls under GDPR and can require co-determination in
              several European jurisdictions. Trackunit's own platform page says access is governed and lists ISO 27001,
              which are relevant mitigants, but neither statement establishes certification scope, control exceptions,
              data residency, subprocessor exposure, works-council deployment practice, or historical incident
              performance. The investor announcement also said the majority transaction remained subject to customary
              regulatory approvals when published in February 2025; the assigned evidence does not establish the
              eventual approval record. No adverse legal filing, enforcement action, or breach was found in the
              allocated pages, but that constrained evidence set cannot prove absence. Legal and security diligence
              therefore remains a material condition rather than a cleared risk.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational, partner, and financial-model exposure
        blocks:
          - type: paragraph
            body: >-
              Trackunit's operating model joins devices, connectivity, cloud ingestion, OEM data feeds, APIs, and
              customer workflows. The company presents cellular, satellite, and Bluetooth as ways to reduce field blind
              spots and runs a compatibility program for OEMs and technology providers; these features mitigate
              single-mode failure but broaden the interfaces that must remain reliable. Marketing claims of up to 30%
              less unplanned downtime and 40% faster digital-service time-to-market are not independently benchmarked in
              the assigned evidence, so underwriting should not convert them into expected savings. Software Advice's
              4.3 score across 26 reviews is directionally positive, but the displayed reviews also include a severe
              installation/support complaint and recurring requests for reporting or interface improvements. Pricing
              described as per asset per month with possible hardware cost adds deployment-scale sensitivity.
              Separately, post-transaction leverage, covenants, cash interest, OEM revenue concentration, and margin
              exposure remain undisclosed.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR011
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation evidence is real but mostly company-issued. ISO 27001, governed-access language, multi-modal
              connectivity, a formal compatibility program, and an active AI and product publishing cadence show that
              Trackunit recognizes security, interoperability, and product iteration requirements. Investment
              underwriting should require proof that those controls work: certification scope and exceptions,
              penetration-test and incident summaries, uptime and support-service levels, OEM-feed failure statistics,
              hardware return and installation-defect rates, and customer-cohort retention. Financial monitoring should
              add net leverage, covenant headroom, cash interest, free cash flow, and revenue concentration by OEM and
              fleet customer. Thesis-break triggers are a material privacy or availability incident without transparent
              remediation; loss of a major OEM feed that meaningfully degrades mixed-fleet coverage; repeated
              hardware/support failures accompanied by worsening verified-user ratings; covenant pressure that
              constrains product investment; or retention deterioration that contradicts the platform-expansion thesis.
              Until those data are supplied, the correct posture is risk-controlled diligence rather than assuming
              public silence means low exposure.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public silence is not incident clearance
            body: >-
              The assigned pages do not document a breach, outage, enforcement action, or lawsuit, but the evidence set
              is not an exhaustive legal or incident search. Underwrite those categories as unverified until primary
              records and management logs are reviewed.
            calloutType: risk
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
          - type: callout
            title: Gate investment on control and leverage evidence
            body: >-
              Require security-assurance scope, incident and uptime history, OEM-feed concentration, verified retention,
              and full post-transaction debt terms before treating platform scale or sponsor backing as risk reduction.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The retained evidence is strong enough to support a constructive view on Trackunit's strategic position,
              but not strong enough to underwrite a price-insensitive buy recommendation. Current official materials
              still present Trackunit as a scaled, construction-specific platform with 6 million-plus connected assets,
              100-plus OEM data feeds, and 1,200-plus connectors and integrations, while partner materials continue to
              describe meaningful operating scale and a broad installed base. Fresh 2026 product messaging also shows
              management pushing AI, data, and connected-operations themes rather than retreating after the 2025
              ownership change. That combination argues against an avoid call. The constraint is entry discipline:
              public sources continue to show quote-based pricing, long contract structures, and no current public
              bridge for ARR, retention, EBITDA, leverage, or preference terms. That gap makes business quality easier
              to verify than valuation quality, so the evidence set fits research-more with a stretched stance and high
              execution/underwriting sensitivity.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Public financing context confirms sponsor confidence but not investor-friendly price transparency. Hg's
              portfolio page still highlights the 10 February 2025 Goldman Sachs Alternatives investment, while GRO's
              exit retrospective frames Trackunit as a business that expanded internationally, deepened OEM and
              contractor relationships, and built meaningful North American exposure. Those are positive context signals
              because sponsor-to-sponsor interest usually requires real operating substance. They do not, however, solve
              the core valuation question. Independent review pages repeatedly describe Trackunit as quote-based,
              pricing-on-request software, and one comparison guide explicitly tells buyers to compare contract length,
              hardware ownership, and per-asset scaling rather than any published list price. Another guide says
              Trackunit contracts generally run 36 or 42 months, which matters because long terms can amplify downside
              if growth slows or customers resist expansion. The company-issued LinkedIn profile also presents a
              multi-country office footprint, supporting global operating reach but not independent evidence of
              profitability. Samsara and Geotab are useful product comparators in the retained buyer guide, yet the
              source provides no comparable financial multiples, so neither is a defensible valuation anchor here. The
              resulting picture is a credible strategic asset with weak public price discovery.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: if Trackunit's official claims on platform breadth, OEM connectivity,
              and AI-assisted workflows translate into durable customer ROI, then the company could deserve premium
              strategic valuation because construction telematics remains specialized and sticky. The base case is more
              conservative and fits the current evidence best: Trackunit likely remains strategically valuable, but the
              public record still proves product breadth more clearly than it proves present-day economics, so the right
              move is to keep diligence open until management discloses current recurring-revenue, retention, margin,
              and balance-sheet data. The bear case is that opaque pricing, long contract terms, and undisclosed
              financing structure mask weaker customer economics or greater downside than sponsor materials imply.
              Before moving above research-more, an investor should obtain the current ARR/NRR/churn and EBITDA bridge,
              full debt and preference terms from the 2025 transaction, and independent customer proof that the
              advertised downtime and maintenance benefits are repeatable at scale. Sponsor ownership, international
              offices, and platform breadth leave strategic-sale optionality plausible, but the public pool does not
              establish IPO readiness, a hold period, or a supportable target return. Exit underwriting therefore needs
              audited financials, governance terms, and buyer-specific comparable transactions rather than a fabricated
              range.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
