  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment breadth is real, but the public scale proof is platform-centric
        blocks:
          - type: paragraph
            body: >-
              Trackunit is not selling into a single operator persona. Its own OEM and IrisX materials position the
              platform across OEMs, rental companies, contractors, and ecosystem partners, with customer value framed
              around machine connectivity, service workflows, branded portals, and partner integrations rather than
              simple GPS tracking. That breadth matters because it supports multiple payer paths inside the same
              industry network, but the strongest public scale metrics are still network-level platform numbers such as
              connected assets, daily data points, feeds, and connectors rather than disclosed paying-account counts or
