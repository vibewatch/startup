          - type: callout
            title: Capital adequacy is still undisclosed
            body: >-
              Historical scale signals exist, but current cash, burn, runway, and debt terms are absent from the
              assigned public evidence, so next-round or leverage dependency cannot be underwritten from public material
              alone.
            calloutType: risk
            claimRefs:
