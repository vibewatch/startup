      - number: '3.2'
        title: Trackunit differentiates on mixed-fleet construction data and OEM distribution
        blocks:
          - type: paragraph
            body: >-
              Trackunit's strongest public differentiation is not a single hardware device or list-price advantage; it
              is the combination of a construction-specific operating data platform, a broad OEM/connectivity layer, and
              ecosystem distribution into mixed fleets. Official pages position IrisX as the data layer above
              telematics, while the OEM surface emphasizes compatibility, branded portals, and partner access across a
              broader ecosystem. Third-party comparisons broadly agree with that framing: they treat Trackunit as the
              better fit for off-road, mixed-brand fleets, while assigning Samsara and Geotab more natural right-to-win
              in truck-heavy or vehicle-led operating environments.
            claimRefs:
