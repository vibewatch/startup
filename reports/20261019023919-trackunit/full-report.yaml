  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and user jobs
        blocks:
          - type: paragraph
            body: >-
              Public and third-party materials consistently describe Trackunit as a construction-specific telematics and
              fleet-management platform serving OEMs, rental companies, and contractors rather than a generic vehicle
              tracker. The product surface now spans Trackunit Manager workflows, the IrisX operating data platform, and
              a specialized OEM offer built around remote diagnostics, machine-health visibility, predictive service use
              cases, and branded digital experiences. That matters because the product is being sold into several
              adjacent workflows at once: fleet visibility for operators, aftermarket and service enablement for OEMs,
              and cross-system data reuse for digital product and integration teams. The strategic shift from IoT device
              roots to a SaaS-led construction platform also suggests product maturity is tied to software adoption and
              ecosystem depth, not just device footprint.
