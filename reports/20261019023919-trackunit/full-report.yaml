chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Trackunit presents itself as a construction-focused operating-data and telematics platform built for mixed
              fleets, OEMs, rental operators, dealers, and contractors rather than a generic vehicle-fleet product. The
              most concrete primary-source scale comes from the 2024 annual report: DKK 1.286 billion of net revenue,
              DKK 812.6 million of ARR, 1.674 million subscriptions, and 459 average employees. The same filing says the
              business reached more than 120 countries, 17 global hubs, 1,200-plus platform integrations, 26,000 monthly
              active users, and more than 3 million connected assets. Current marketing pages now promote IrisX as a
              broader operating-data platform with 6 million-plus connected assets and 100-plus OEM feeds, so later
              chapters should distinguish 2024 audited snapshots from 2026 company marketing claims.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
