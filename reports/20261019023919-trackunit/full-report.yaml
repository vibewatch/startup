      - number: '1.2'
        title: Leadership, governance, and origin story limits
        blocks:
          - type: paragraph
            body: >-
              Public primary evidence identifies a functional leadership bench but not a founder narrative that can be
              cleanly reused without caveat. The annual report names Søren Brogaard as CEO, Peter Vekslund as CFO, Evan
              Barnes as COO, and Lærke Ullerup as Chief Product & Marketing Officer, while also describing a two-tier
              governance structure with an Advisory Board and a Management Board under ultimate parent Galaxy UK Topco
              Ltd. On origins, the same report says M-Tec A/S was established in 1998 and that the Trackunit brand was
              established later, while an independent product directory also lists 1998 as the founding year. That is
              enough to anchor the company's age and legal lineage, but not enough to attribute founder-market fit to
              named individuals from this source pool.
            claimRefs:
              - CO003
