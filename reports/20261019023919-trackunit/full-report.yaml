figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Trackunit's public milestone trail runs from its 1998 origin through sponsor changes, acquisitions, IrisX, and
      2025 restructuring.
    data:
      items:
        - date: '1998'
          label: M-Tec A/S established
          detail: The annual report traces the company's legal origin to M-Tec A/S.
          tone: positive
        - period: 2003-2015
          label: Trackunit brand and early international build-out
          detail: >-
            The annual report says the Trackunit brand was established and subsidiaries were created across Western
            Europe.
          tone: positive
        - period: 2016-2021
          label: Iris platform era and geographic expansion
          detail: >-
            Official history groups North America entry, Iris launch, APJ expansion, and acquisitions of Dreyer & Trimm
            and Satrak into this phase.
          tone: positive
        - date: '2022'
          label: Hg acquisition and ZTR industrial IoT deal
          detail: Trackunit says Hg acquired the company in 2022 and that it also acquired ZTR's industrial IoT division.
          tone: positive
        - date: '2023-01-01'
          label: Flexcavo acquisition
          detail: Trackunit acquired contractor-software company Flexcavo GmbH.
          tone: positive
        - date: '2023-09-29'
          label: OEMSI acquisition
          detail: Trackunit acquired North American deployment specialist OEM Solutions LLC.
          tone: positive
        - date: '2024'
          label: IrisX launch and FY2024 scale step-up
          detail: >-
            The annual report ties IrisX to DKK 1.29 billion of net revenue, DKK 812.6 million of ARR, and more than 3
            million connected assets.
          tone: positive
        - date: 2025-01
          label: Reorganization and sponsor transition
          detail: >-
            Trackunit disclosed 40 redundancies in January 2025 and, after year-end, a majority acquisition by Goldman
            Sachs Alternatives with Hg remaining invested.
          tone: warning
    claimRefs:
      - CO003
