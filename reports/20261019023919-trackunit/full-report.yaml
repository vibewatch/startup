      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Trackunit appears to win by owning the data layer above fragmented construction workflows
            body: >-
              The strongest public differentiation is not generic telematics breadth; it is construction-specific
              harmonization across OEM portals, fleet workflows, and partner systems.
            calloutType: insight
            claimRefs:
