  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans direct peers, adjacent platforms, and internal build
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a broader landscape than a simple Trackunit-versus-Trackunit comparison
              page. Trackunit's own OEM-focused article frames the buyer's choice as build, partner, or brand, then
              names Trackunit, Proemion, Sibros, CalAmp, and Targa Telematics as different platform routes for
              construction OEMs. External buyer guides add Samsara and Geotab as the most relevant horizontal
              alternatives when a contractor wants trucks, trailers, and yellow iron in one system rather than a
              construction-native platform. That means the real substitute set is: direct construction telematics/data
              platforms, adjacent vehicle-led fleet suites extending into equipment, and status-quo/internal-build
              approaches that keep OEM portals, spreadsheets, or custom telemetry stacks in place.
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP014
