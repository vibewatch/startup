  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Trackunit's market boundary is narrower than generic fleet software but deeper in construction workflows
        blocks:
          - type: paragraph
            body: >-
              The public record consistently places Trackunit in off-highway construction equipment telematics and,
              increasingly, in the operating-data layer that sits above basic tracking. Official and independent sources
              all describe a product set centered on mixed-brand construction fleets rather than ordinary road-vehicle
              compliance, dispatch, or driver-safety software. That matters because the real substitute set is not only
              "another telematics vendor"; it is also the status quo of OEM-specific portals, disconnected service
              records, spreadsheets, and ad hoc reconciliations across rental, contractor, and manufacturer workflows.
              IrisX sharpens that boundary further by positioning itself as a harmonization layer that standardizes
              machine, OEM, site, and business data so customers can reuse it across analytics, applications, and
              partner workflows instead of remaining trapped in one portal per brand.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM013
      - number: '2.2'
        title: Buyer pull comes from uptime, utilization, service economics, and reusable integrations
        blocks:
          - type: paragraph
            body: >-
              The recurring buyer groups are OEMs, rental operators, contractors, and ecosystem partners that need one
              construction-specific data layer across mixed fleets. Their adoption logic is operational rather than
              abstract: OEMs are pitched on aftermarket growth, remote diagnostics, and digital-service rollout; rental
              operators are pitched on utilization, service workflows, and billing leakage; contractors are pitched on
              visibility, redeployment, and theft/access control. Across those segments, the shared driver is the same:
              fragmented data slows decisions, while predictive maintenance, machine-health analytics, and workflow
              automation promise faster interventions and clearer ROI. Trackunit's 2026 messaging also emphasizes open
              standards, APIs, and integrations so buyers can push the intelligence into existing enterprise systems or
              AI tooling instead of adopting another sealed dashboard.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM016
      - number: '2.3'
        title: Public sizing evidence shows served-footprint depth, not a clean TAM stack
        blocks:
          - type: paragraph
            body: >-
              The best public sizing lenses are all evidence-constrained proxies rather than a defensible market model.
              Trackunit and partners disclose substantial operating scale — trillions of structured data points,
              billions of daily data points, millions of connected assets, and broad OEM plus connector coverage — and
              they add use-case economics for OEM and rental deployments. Those data support a view that Trackunit is
              addressing a meaningful construction-operations category with real adoption, but they are heterogeneous
              measures of platform activity, footprint breadth, and scenario ROI, not a common denominator for TAM, SAM,
              or SOM. Independent reviews reinforce the commercial constraint: pricing is quote-based or per asset, and
              some buyers may face long contract terms or plan-gated integration features, so direct diligence on plan
              scope, OEM coverage, and pricing remains essential before converting these footprint signals into a
              valuation-ready market model.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
