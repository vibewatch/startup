      - number: '5.4'
        title: Trust, compliance, and product risks
        blocks:
          - type: paragraph
            body: >-
              Trackunit does surface some trust signals, especially ISO 27001 on the IrisX page and GDPR-oriented
              positioning in a 2026 external review, which is directionally relevant because fleet telematics can expose
              sensitive worker and location data. The same external review also highlights that deployment can trigger
              co-determination and retention-governance issues in some European jurisdictions, so implementation risk is
              partly organizational and legal, not just technical. Product-risk disclosure in the assigned pool is
              otherwise limited: reviewers can point to hardware cost, per-asset pricing, and poor fit for ordinary
              vehicle fleets, but the source set does not expose public uptime SLAs, API reliability metrics, or
              detailed security-audit artifacts beyond the high-level certification signal.
            claimRefs:
