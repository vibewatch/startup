      - number: '1.3'
        title: Ownership structure and ecosystem stakeholders
        blocks:
          - type: paragraph
            body: >-
              Trackunit is currently best understood as a private, PE-backed platform business whose strategic leverage
              runs through ownership, OEM relationships, and ecosystem distribution. Official materials show Hg acquired
              Trackunit in 2022, while the 2024 annual report discloses that after year-end Goldman Sachs Alternatives
              acquired the majority share in ultimate parent Galaxy UK Topco Limited and Hg remained a key shareholder.
              The operating model also depends on OEM connectivity and partner integrations: official pages position
              Trackunit as an open ecosystem with a Works With Trackunit compatibility program, while independent
              reviews describe the product as strongest when customers run off-road, mixed-brand construction fleets.
              That combination supports the category-leadership thesis, but it also makes ownership terms, OEM breadth,
              and pricing/contract discipline key diligence items.
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones, recent changes, and unresolved public gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that has compounded through acquisitions, platform launches, and
              sponsor transitions, but still leaves some investor-critical facts opaque. Official history runs from the
              1998 M-Tec origin, through the Trackunit brand build-out, the 2022 Hg acquisition and ZTR industrial IoT
              deal, the 2023 Flexcavo and OEMSI acquisitions, and the 2024 IrisX launch. More recent primary evidence
              adds a January 2025 reorganization with 40 redundancies and the Goldman Sachs Alternatives majority
              acquisition after the balance-sheet date. Independent sources reinforce that Trackunit looks
              differentiated for heavy equipment and mixed fleets, yet they repeatedly flag quote-based pricing and long
              36- or 42-month contracts. The same public set still does not disclose a current valuation, total capital
              raised, a verified customer count, or the full post-buyout debt package.
            claimRefs:
              - CO011
