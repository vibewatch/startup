      - number: '3.3'
        title: Public pricing is opaque, so commercial tradeoffs show up in contract structure and fit
        blocks:
          - type: paragraph
            body: >-
              Public pricing does little to separate the field because the retained comparison sources all describe
              quote-based pricing rather than a transparent list price. Trackunit's available differentiation therefore
              shows up in package structure and commitment: external buyer guides describe purpose-built plans for OEM,
              rental, and contractor motions, and they warn that Trackunit's 36- or 42-month contract term can create a
              long window to be wrong if the fleet fit is off. That contract duration is a competitive strength when an
              OEM or rental operator wants a tightly embedded platform with partner services, but it is also an adoption
              risk against vendors that are easier to pilot across mixed on-road/off-road fleets.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.4'
        title: Moat durability rests on ecosystem reach, but lock-in and migration proof stay thin
        blocks:
          - type: paragraph
            body: >-
              The public case for moat durability is strongest around ecosystem reach: Trackunit cites 120+ OEM data
              feeds, 1,200+ connectors, 6 million connected assets, and 150+ OEM factory-fit relationships, while
              partner proof from XCMG North America suggests those embeds are visible outside Trackunit's own site. The
              weaker part of the file is migration evidence. Retained sources do not quantify churn, export friction,
              time-to-switch, or realized price advantage versus Samsara, Geotab, or a private OEM build. As a result,
              the chapter's underwriting view is that Trackunit's moat is more distribution- and workflow-led than
              transparently proven by public retention economics, so diligence should focus on exact OEM coverage,
              contract escape clauses, and customer evidence of multi-year expansion.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trackunit's best wedge is the mixed-OEM construction job, not generic fleet telematics
            body: >-
              Across retained sources, Trackunit wins public differentiation when uptime, utilization, attachments, and
              OEM data normalization matter together; once the buying center prioritizes driver tooling or broad on-road
              workflows, horizontal fleet suites look relatively stronger.
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP013
          - type: callout
            title: Switching friction is publicly visible mainly through contract duration, not proven churn
            body: >-
              The clearest public lock-in signal is the reported 36- or 42-month contract structure rather than audited
              retention, export, or migration data, so the commercial risk is signing into the wrong fleet-fit thesis
              before real usage evidence is available.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence points to a revenue model built around connected-asset telemetry, normalized
              operating data, and workflow automation rather than transparent list pricing. Trackunit's official OEM and
              IrisX pages frame monetization through remote diagnostics, predictive maintenance, branded digital
              experiences, and aftermarket parts or service growth, while third-party pages consistently describe
              per-asset or quote-based commercial packaging. The resulting bridge is connected machines and attachments
              feeding a data layer that powers diagnostics, utilization, billing, and service workflows, which then
              supports subscription, hardware, and service-adjacent revenue. What public sources still do not disclose
              is the realized revenue split by hardware, software, OEM, rental, dealer, and contractor cohorts.
            claimRefs:
