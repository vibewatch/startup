      - number: '5.2'
        title: Architecture and extension model
        blocks:
          - type: paragraph
            body: >-
              The official IrisX surface presents a recognizable operating-data-platform architecture: ingest data from
              machines and business systems, harmonize it into a governed layer, apply analytics and AI, then expose
              outcomes through automation, applications, and partner integrations. The developer surface is not an
              afterthought; Trackunit publicly offers APIs, an App SDK, a component library, marketplace integrations,
              and ISO feeds, while the OEM pages emphasize compatibility validation through Works With Trackunit and
              connectivity across mixed fleets. Taken together, the product looks less like a closed telematics
              dashboard and more like a construction-specific data-and-workflow layer designed to sit between field
              hardware, OEM portals, enterprise systems, and customer-facing apps.
