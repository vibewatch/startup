      - number: '4.3'
        title: Public traction and capital needs
        blocks:
          - type: paragraph
            body: >-
              Traction evidence in the assigned pool is stronger on operational scale than on auditable financial
              disclosure. XCMG markets Trackunit at 1.4M+ assets tracked and 50M+ daily API calls, and International
              Rental News reported that the ZTR acquisition was expected to double Trackunit's revenues. Those markers
              indicate meaningful category scale, but the same public set does not disclose current cash, burn, runway,
              debt covenants, project-finance obligations, or software-versus-hardware gross-margin splits. For
              underwriting, that balance-sheet and financing opacity matters more than historical scale markers because
              leverage and cash conversion determine whether growth requires further sponsor support or incremental debt
              capacity.
            claimRefs:
              - CI007
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Trackunit looks like a recurring, asset-linked platform with credible workflow value for
              OEMs, rental fleets, and contractors, but the public package is still too thin for a clean unit-economics
              or capital-adequacy call. The best-supported positives are per-asset monetization, integration into
              maintenance, billing, and service workflows, and the ability to use data to support aftermarket parts and
              warranty economics. The main blockers are quote-based pricing, long contract terms that may mask
              concessions, no public realized margin split, and no current disclosure of cash, burn, or debt. That
              combination supports a revenue-quality-positive but underwriting-incomplete verdict rather than a fully
              diligenced upside case.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
