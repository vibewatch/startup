      - number: '5.3'
        title: Differentiation and maturity signals
        blocks:
          - type: paragraph
            body: >-
              Independent sources reinforce the same differentiation pattern: Trackunit is strongest where off-highway
              construction workflows diverge from van- and truck-centric telematics. Reviews call out engine-hour
              workflows, machine fault-code handling, predictive service alerts, and OEM integrations as core
              differentiators, while Software Advice adds a modest but real proof point that the product has accumulated
              public review volume and feature breadth rather than living only on marketing copy. Official quick facts
              on connected assets, OEM feeds, and integrations point to a platform that has already scaled materially,
              but those claims still remain vendor-authored and do not substitute for independent evidence on
              implementation speed, realized ROI, or customer stickiness by segment.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
