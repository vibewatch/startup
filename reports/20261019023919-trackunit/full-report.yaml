      - number: '4.2'
        title: Efficiency and margin drivers
        blocks:
          - type: paragraph
            body: >-
              Public ROI proxies are directionally favorable, but most come from Trackunit or commercial partners rather
              than disclosed customer cohorts. Trackunit claims predictive maintenance can reduce unplanned downtime by
              up to 30% and maintenance costs by up to 25%, while XCMG markets remote diagnostics savings above $500 per
              service call and rental-oriented billing and utilization workflows. Trackunit's dealer-efficiency article
              also argues that connected workflows lower cost-to-serve by dispatching the right technician with the
              right parts on the first visit. Together, those signals suggest sticky workflow value and possible
              service-led expansion, but they are not substitutes for disclosed gross margin, payback, or retention
              data.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI013
              - CI014
