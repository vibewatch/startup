      - number: '6.3'
        title: Expansion logic is credible, but durability and concentration are still opaque
        blocks:
          - type: paragraph
            body: >-
              Public sources support a land-and-expand motion: Trackunit layers Portals, inspections, AI assistants,
              Blueprints, and OEM-specific service workflows on top of installed telematics data. That creates a
              plausible upsell path once connectivity is in place. However, the same source set does not disclose NRR,
              GRR, logo churn, renewal rates, standard contract terms, or top-customer concentration, so public adoption
              proof stops short of proving durable recurring revenue quality. Independent review evidence is also mixed,
              with usable ratings and reviewer commentary but clear warnings on hardware cost, per-asset pricing,
              support quality, and product fit outside construction-heavy fleets. The investment case therefore needs
              customer-level renewal and expansion cohorts, not additional asset-volume headlines, before treating
              network breadth as evidence of durable account economics.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
