  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-disclosure
      missingEvidence: NRR, GRR, logo churn, renewal rates, and standard contract terms by OEM, rental, and contractor cohort.
      whyItMatters: Public adoption proof is meaningful only if deployments renew and expand; without cohort retention data, durability remains unverified.
      diligencePath: Ask management for cohort retention tables, renewal rates, contract-duration ranges, and churn commentary by customer segment.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-disclosure
      missingEvidence: Top-customer revenue share, OEM vs rental revenue mix, and channel concentration by account or geography.
      whyItMatters: Strong named logos can still mask revenue concentration or channel dependence that would change downside risk.
      diligencePath: Request top-10 customer revenue concentration, largest-OEM exposure, and segment mix from current board or lender materials.
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-coverage
      missingEvidence: A complete dated list of referenceable customers by segment and module, with which deployments are live versus historical.
      whyItMatters: The named-customer table proves breadth, but not exhaustiveness or recency across the entire installed base.
      diligencePath: Request a current reference account list with segment, geography, deployment status, and customer-approved proof points.
      relatedTableRefs: [TU003]
