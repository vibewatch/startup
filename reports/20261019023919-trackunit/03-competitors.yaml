      - ["Hardware / asset-type breadth", "Raw, Spot, Pass, Kin, Beam hardware ladder", "Gateways plus asset tags", "GO9 RUGGED and Marketplace-led asset tracking", "Trackunit's public story is most specific for machines, attachments, and mixed asset classes"]
      - ["Open data / workflow extension", "Iris REST APIs, GraphQL API, webhooks, ERP/CRM connectors", "Equipment stats endpoint referenced in third-party comparison", "MyGeotab API and Marketplace cited in third-party comparison", "All three can extend into workflows, but Trackunit's construction-specific data layer is the clearest positioning difference"]
      - ["On-road / driver-centric coverage", "Not confirmed on retained pages", "Natural fit for trucks plus equipment", "Natural fit for trucks plus equipment", "Horizontal incumbents look stronger when the fleet operating system starts with road vehicles"]
