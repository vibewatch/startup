    columns:
      - Vendor
      - Public pricing signal
      - Contract / packaging model
      - Included capability cues
      - Key unknown
      - Implication
    rows:
      - [Trackunit, "Quote-based / pricing on request", "OEM, Rental, and Contractor motions; 36- or 42-month term cited by third-party guide", "Telematics, maintenance, APIs, webhooks, OEM feeds, add-ons", "Realized module pricing, pilot escape clauses, hardware/software split", "Best fit when buyers accept a longer embedded platform commitment"]
      - [Samsara, Quote-based, "Gateway and license mix; term not stated on retained pages", "Unified vehicle/equipment dashboard, OEM integrations, asset tags", "Named pricing bands and exact contract term", "Competes well when a buyer wants one commercial stack across trucks and equipment"]
      - [Geotab, Quote-based, "\"Get pricing\" request; term not stated on retained pages", "Subscription plans, rugged device, Marketplace extensions", "Named pricing bands and exact contract term", "Likely easier to frame as a broad fleet platform, but commercial fit still needs custom quoting"]
    notes: >-
      Public evidence supports packaging direction and contract opacity, not realized customer
      pricing or implementation economics.
    claimRefs: [CP006, CP007, CP008, CP012]
