          y: 5
          note: "Construction-native data platform with 120+ OEM feeds, 1,200+ connectors, and mixed-fleet partner distribution."
        - label: Proemion
          x: 4
          y: 2
          note: "Private end-to-end OEM telematics environment rather than a shared construction network."
        - label: Sibros
          x: 3
          y: 1
          note: "Software-defined vehicle and OTA orientation, but less evidence of construction-ecosystem breadth."
        - label: CalAmp
          x: 2
          y: 2
          note: "Rugged connectivity and hardware-led position across industries."
        - label: Samsara
          x: 2
          y: 3
          note: "Horizontal fleet suite with equipment extensions and named OEM list for contractors."
        - label: Geotab
          x: 2
          y: 4
          note: "Broad ecosystem and rugged-device story, but less explicit construction-OEM specificity in retained evidence."
    approximationNotes: >-
      Scores are 1-5 ordinal judgments derived from source-backed descriptions rather than a
      measured benchmark; they show relative fit, not market share or feature completeness.
    claimRefs: [CP002, CP004, CP005, CP013]
