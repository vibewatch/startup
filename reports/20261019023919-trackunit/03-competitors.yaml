  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Exact realized pricing by module, hardware/software split, implementation fees, and exit economics versus Samsara and Geotab.
      whyItMatters: Public comparisons can rank fit and contract shape, but they cannot underwrite gross margin quality or switching ROI without real customer pricing.
      diligencePath: Obtain current customer proposals or executed order forms for Trackunit, Samsara, and Geotab across at least two fleet-size bands.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: oem-coverage
      missingEvidence: Make-by-make OEM coverage, refresh intervals, and data-field depth for the exact machine models a buyer cares about.
      whyItMatters: The competitive winner can flip if one platform lacks reliable hours, fault codes, or attachment support for the installed fleet.
      diligencePath: Request a written coverage matrix and sample telemetry payloads for the target OEMs and attachment classes from each vendor.
      relatedQuestionRefs: [QP005, QP006]
      relatedTableRefs: [TP002]
    - type: missing-source
      severity: material
      topic: switching-costs
      missingEvidence: Public customer evidence on churn, migration timelines, export portability, and multi-homing behavior after rollout.
      whyItMatters: The public moat case currently relies more on ecosystem breadth and contract duration than on proven retention economics.
      diligencePath: Interview customers that switched to or from Trackunit and review contract language covering data export, early termination, and renewal mechanics.
      relatedQuestionRefs: [QP007]
