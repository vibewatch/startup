      - ["Hg", "Continuing key shareholder", "Retained economic interest through reinvestment after the majority sale.", "Clarify ownership percentage, board rights, and exit timetable."]
      - ["OEMs and machine manufacturers", "Data-supply and distribution channel", "Official pages position OEM connectivity as a core route to product value, service uplift, and aftermarket sales.", "Test named OEM coverage, refresh intervals, and revenue concentration by OEM."]
      - ["Rental fleets and contractors", "Core end customers and usage base", "Drive utilization, service, and workflow demand across connected assets and monthly active users.", "Verify live customer count, cohort retention, and mix across rental versus contractor accounts."]
      - ["Integration and marketplace partners", "Ecosystem expansion layer", "1,200+ integrations and Works With Trackunit compatibility broaden product stickiness and distribution.", "Check which integrations are revenue-bearing, strategic, or required to defend platform positioning."]
