schemaVersion: report-v2
artifact: company-overview
slug: trackunit
runDate: 2026-10-19
company:
  name: Trackunit
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Trackunit remains a sponsor-backed construction-equipment telematics and operating-data platform anchored in Aalborg, with primary evidence showing DKK 1.286 billion of 2024 revenue, DKK 812.6 million of ARR, and 459 average employees. Official sources also show a business in transition from classic telematics into the newer IrisX data platform, while public evidence still leaves valuation, debt, customer count, and named founder details unresolved.
sections:
  - id: identity-and-scale
    title: Identity, scope, and disclosed scale
    body: >-
      Trackunit presents itself as a construction-focused operating-data and telematics platform built for mixed fleets, OEMs, rental operators, dealers, and contractors rather than a generic vehicle-fleet product. The most concrete primary-source scale comes from the 2024 annual report: DKK 1.286 billion of net revenue, DKK 812.6 million of ARR, 1.674 million subscriptions, and 459 average employees. The same filing says the business reached more than 120 countries, 17 global hubs, 1,200-plus platform integrations, 26,000 monthly active users, and more than 3 million connected assets. Current marketing pages now promote IrisX as a broader operating-data platform with 6 million-plus connected assets and 100-plus OEM feeds, so later chapters should distinguish 2024 audited snapshots from 2026 company marketing claims.
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and origin story limits
    body: >-
      Public primary evidence identifies a functional leadership bench but not a founder narrative that can be cleanly reused without caveat. The annual report names Søren Brogaard as CEO, Peter Vekslund as CFO, Evan Barnes as COO, and Lærke Ullerup as Chief Product & Marketing Officer, while also describing a two-tier governance structure with an Advisory Board and a Management Board under ultimate parent Galaxy UK Topco Ltd. On origins, the same report says M-Tec A/S was established in 1998 and that the Trackunit brand was established later, while an independent product directory also lists 1998 as the founding year. That is enough to anchor the company's age and legal lineage, but not enough to attribute founder-market fit to named individuals from this source pool.
    claimRefs: [CO003, CO009, CO010, CO016]
    tableRefs: [TO002]
  - id: ownership-and-stakeholders
    title: Ownership structure and ecosystem stakeholders
    body: >-
      Trackunit is currently best understood as a private, PE-backed platform business whose strategic leverage runs through ownership, OEM relationships, and ecosystem distribution. Official materials show Hg acquired Trackunit in 2022, while the 2024 annual report discloses that after year-end Goldman Sachs Alternatives acquired the majority share in ultimate parent Galaxy UK Topco Limited and Hg remained a key shareholder. The operating model also depends on OEM connectivity and partner integrations: official pages position Trackunit as an open ecosystem with a Works With Trackunit compatibility program, while independent reviews describe the product as strongest when customers run off-road, mixed-brand construction fleets. That combination supports the category-leadership thesis, but it also makes ownership terms, OEM breadth, and pricing/contract discipline key diligence items.
    claimRefs: [CO007, CO008, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-current-cautions
    title: Milestones, recent changes, and unresolved public gaps
    body: >-
      The milestone record shows a company that has compounded through acquisitions, platform launches, and sponsor transitions, but still leaves some investor-critical facts opaque. Official history runs from the 1998 M-Tec origin, through the Trackunit brand build-out, the 2022 Hg acquisition and ZTR industrial IoT deal, the 2023 Flexcavo and OEMSI acquisitions, and the 2024 IrisX launch. More recent primary evidence adds a January 2025 reorganization with 40 redundancies and the Goldman Sachs Alternatives majority acquisition after the balance-sheet date. Independent sources reinforce that Trackunit looks differentiated for heavy equipment and mixed fleets, yet they repeatedly flag quote-based pricing and long 36- or 42-month contracts. The same public set still does not disclose a current valuation, total capital raised, a verified customer count, or the full post-buyout debt package.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
