  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖直接同行、相邻平台和内部自建
        blocks:
          - type: paragraph
            body: >-
              留存证据支持的竞争版图，比简单的 Trackunit 对 Trackunit 比较页面更广。Trackunit 自己面向 OEM 的文章把买方选择概括为自建、合作或品牌方案，并列出
              Trackunit、Proemion、Sibros、CalAmp 和 Targa Telematics 作为服务工程 OEM 的不同平台路径。外部买方指南又加入 Samsara 和
              Geotab：当承包商希望在一个系统中管理卡车、拖车和工程机械，而不是使用原生工程平台时，这两者是最相关的横向替代方案。因此，真正的替代集合包括：直接的工程车联网和数据平台、向设备领域延伸的车辆主导型车队套件，以及继续使用
              OEM 门户、电子表格或定制遥测栈的现状方案或内部自建。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP014
