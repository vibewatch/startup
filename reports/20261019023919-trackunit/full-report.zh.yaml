      - number: '3.3'
        title: 公开定价不透明，商业取舍主要体现为合同结构和适配度
        blocks:
          - type: paragraph
            body: >-
              由于留存的比较来源都描述询价制而非透明标价，公开定价几乎无法区分各家方案。因此，Trackunit 的差异化更多体现在套餐结构和承诺期限上：外部买方指南描述了面向 OEM、租赁和承包商场景的专用套餐，并警告
              Trackunit 的 36 或 42 个月合同期可能让车队适配错误的买方在很长时间内承担错误判断。对于希望把平台深度嵌入运营并接入伙伴服务的 OEM
              或租赁运营商，这种合同期限是竞争优势；但与更容易在公路和非公路混合车队中试点的供应商相比，它也会增加采用风险。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.4'
        title: 护城河的持久性依赖生态触达，但锁定和迁移证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              公开护城河证据最强的部分是生态触达：Trackunit 称拥有 120+ 个 OEM 数据源、1,200+ 个连接器、6 million 台联网资产和 150+ 个 OEM 出厂预装关系；XCMG North
              America 的合作伙伴证据也表明，这些嵌入并非只出现在 Trackunit 自己的网站上。材料较弱的部分是迁移证据。留存来源没有量化流失、数据导出摩擦、切换所需时间，或相较于 Samsara、Geotab
              和私有 OEM 自建方案的实际价格优势。因此，本章的投资判断是：Trackunit 的护城河更多由分发和工作流驱动，尚未被公开留存经济性透明证明；尽调应聚焦准确的 OEM
              覆盖、合同退出条款，以及客户多年扩张的证据。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: Trackunit 最好的切入点是混合 OEM 工程作业，而非通用车队车联网
            body: 在留存来源中，当开工率、利用率、属具和 OEM 数据标准化需要同时解决时，Trackunit 的公开差异化最明显；一旦买方更看重驾驶员工具或广泛的公路工作流，横向车队套件看起来就更强。
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP013
          - type: callout
            title: 公开可见的切换摩擦主要来自合同期限，而非已证实的流失
            body: 最清晰的公开锁定信号是报道中的 36 或 42 个月合同结构，而不是经审计的留存、导出或迁移数据。因此，在真实使用证据出现之前，商业风险在于买方可能先签入一个错误的车队适配判断。
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据显示，其收入模式建立在联网资产遥测、标准化运营数据和工作流自动化之上，而不是透明标价。Trackunit 的 OEM 和 IrisX
              页面通过远程诊断、预测性维护、品牌化数字体验以及售后零部件或服务增长来呈现变现逻辑；第三方页面则持续描述按资产或询价制的商业包装。由此可以勾勒出一条收入链：联网机器和属具把数据送入数据层，数据层支撑诊断、利用率、计费和服务工作流，进而支持订阅、硬件和邻近服务收入。但公开来源仍未披露硬件、软件、OEM、租赁、经销商和承包商客户群之间实际实现的收入拆分。
