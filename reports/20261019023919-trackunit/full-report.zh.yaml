      - number: '1.2'
        title: 领导层、治理与起源叙事的边界
        blocks:
          - type: paragraph
            body: >-
              公开一手证据能确认一支职能覆盖完整的领导团队，但不足以在不加限定的情况下复述创始人叙事。年报列 Søren Brogaard 为 CEO、Peter Vekslund 为 CFO、Evan Barnes 为
              COO、Lærke Ullerup 为首席产品与营销官；年报还描述了双层治理结构：最终母公司 Galaxy UK Topco Ltd 旗下设有咨询委员会和管理委员会。关于起源，同一份报告称 M-Tec A/S
              成立于 1998 年，Trackunit 品牌则在之后建立；一家独立产品目录也把 1998 年列为成立年份。这足以锚定公司的经营年限和法律沿革，但不足以根据现有来源将创始人与市场匹配能力归因于具体个人。
            claimRefs:
              - CO003
