      - number: '4.2'
        title: 效率与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开 ROI 代理指标总体偏正面，但多数来自 Trackunit 或商业合作伙伴，而不是披露的客户群组。Trackunit 声称预测性维护最多可将非计划停机减少 30%、维护成本减少 25%；XCMG
              则宣传远程诊断每次服务调用可节省超过 $500，并展示面向租赁场景的计费和利用率工作流。Trackunit
              的经销商效率文章还称，联网工作流可以在首次上门时派出合适的技术人员并带齐合适的零件，从而降低服务成本。这些信号共同指向黏性的工作流价值和潜在的服务驱动扩张，但不能替代已披露的毛利率、回本周期或留存数据。
