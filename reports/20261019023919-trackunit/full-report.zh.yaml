      - number: '8.3'
        title: 情景与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果 Trackunit 关于平台广度、OEM 连接和 AI 辅助工作流的官方说法能够转化为持久客户
              ROI，那么由于工程车联网仍然专业化且具有黏性，公司可能获得溢价战略估值。基准情景更保守，也最符合当前证据：Trackunit
              很可能仍具战略价值，但公开记录对产品广度的证明明显强于对当前经济性的证明，因此在管理层披露当前经常性收入、留存、利润率和资产负债表数据之前，正确做法是保持尽调开放。悲观情景是，定价不透明、合同期限长且融资结构未披露，掩盖了更弱的客户经济性，或意味着比股东材料暗示的更大下行。投资人要把判断从“继续研究”上调，至少应取得当前
              ARR/NRR/流失和 EBITDA 桥接、2025
              年交易的完整债务与优先权条款，以及独立客户证据，证明宣传的停机和维护收益能在规模化后重复出现。股东持有、国际办公室和平台广度使战略出售仍有可能，但公开材料没有证明其已具备 IPO
              准备度、明确持有期或可支撑的目标回报。因此，退出投资判断需要经审计财务、治理条款和针对买方的可比交易，而不是人为编造一个区间。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
