  - id: TV002
    title: 核心论点 / 反论点表
    columns:
      - 视角
      - 当前判断
      - 什么会改变判断
    rows:
      - - 核心论点
        - Trackunit 看起来是建筑远程信息处理领域真实存在的品类资产，有官方规模证明以及广泛的 OEM / 集成覆盖。
        - 当前 ARR、留存、利润率和 cohort 数据若能获得，就能让这一论点从主题判断变成可承保的投资判断。
      - - 核心论点
        - 最新的 2026 年路线图、发布活动和多国办公室布局表明，2025 年投资方变更后，产品和运营势头仍在延续。
        - 客户采用和 ROI 的独立证明，会把这一判断从产品承诺提升为估值支撑。
      - - 反论点
        - 公开价格仍按报价确定，因此外部投资者无法有把握地衡量实际经济性或回本期。
        - 披露价格区间、毛利率结构和有代表性的客户经济数据，将降低入场风险。
      - - 反论点
        - 长合同结构和未披露的收购后融资条款，可能在增长放缓或债务偿付沉重时锁住上行空间。
        - 债务安排、契约余量以及治理 / 优先权条款，是决定性的尽调事项。
    notes: 核心论点总结支持性证据；反论点则单独列出阻碍形成更高信心价格判断的因素。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 官方规模声明大体准确，AI / 连接器覆盖扩大附加率，客户独立验证了有意义的在线率和维护 ROI。
        - 没有可支持的公开区间；要支撑溢价，需要强劲的经常性收入质量、可控杠杆和经过投资判断的目标回报。
        - 可能，但公开投资判断数据尚未证明
        - 独立客户证明无法验证 ROI 或当前留存
      - - 基准
        - Trackunit 仍具战略价值，但公开证据主要证明产品覆盖面，而非当前经济性。
        - 没有可支持的公开区间；只有在私有数据补齐缺口后，才跟踪该资产并进行定价。
        - 与保留证据最一致
        - 当前 ARR、NRR、EBITDA 或债务偿付情况不符合尽调判断
      - - 悲观
        - 按报价计价的合同、有限披露和不透明融资条款，与增长放缓、留存走弱或 OEM 暴露集中同时出现。
        - 没有可支持的公开下限；由于产品比较无法提供财务倍数，且长合同可能放慢重新定价，过度支付风险上升。
        - 如果尽调无法验证当前 ARR、留存和债务偿付，风险将很大
        - cohort 留存疲弱、契约承压，或客户抗拒按资产扩张
    notes: 情景表具有方向性，取决于尚未验证的私有指标；它不是贴现现金流模型输出。
    claimRefs:
