      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Trackunit 像是一家与资产绑定、具有经常性收入的​​平台，为
              OEM、租赁车队和承包商提供可信的工作流价值；但公开材料仍太薄，无法干净地判断单位经济性或资本充足性。证据最充分的正面因素包括按资产变现、嵌入维护、计费和服务工作流，以及利用数据支撑售后零部件和保修经济性。主要阻碍则是询价制定价、可能掩盖让利的长期合同、没有公开的实际利润率拆分，以及没有当前现金、烧钱或债务披露。因此，更合适的结论是收入质量偏正面但投资判断尚未完成，而不是已经充分尽调、可以直接下注上行空间。
