  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Trackunit 的市场边界窄于通用车队软件，但更深入工程工作流
        blocks:
          - type: paragraph
            body: >-
              公开记录始终将 Trackunit
              放在非公路工程设备车联网领域，且越来越多地将其放在基础追踪之上的运营数据层。官方和独立来源都把产品重心放在混合品牌工程车队，而不是普通道路车辆的合规、调度或驾驶员安全软件上。这一点很关键，因为真正的替代方案不只是“另一家车联网供应商”，还包括
              OEM 各自的门户、割裂的维修记录、电子表格，以及租赁、承包商和制造商工作流之间临时拼接的对账流程。IrisX
              进一步强化了这一边界：它把自己定位为数据整合层，统一机器、OEM、工地和业务数据，让客户可以在分析、应用和合作伙伴工作流中重复使用，而不是被困在每个品牌一个门户的格局里。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM013
      - number: '2.2'
        title: 买方需求来自开工率、利用率、服务经济性和可复用集成
        blocks:
          - type: paragraph
            body: >-
              反复出现的买方群体包括 OEM、租赁运营商、承包商和生态伙伴，它们需要一层覆盖混合车队、专为工程场景设计的数据层。它们的采用逻辑是运营驱动而非抽象需求：OEM
              被强调售后增长、远程诊断和数字服务落地；租赁运营商被强调利用率、服务流程和计费损失；承包商被强调可视性、设备重新调度以及防盗和访问控制。对这些群体而言，共同痛点都是数据割裂拖慢决策，而预测性维护、设备健康分析和工作流自动化有望加快干预并让
              ROI 更清晰。Trackunit 在 2026 年的传播还强调开放标准、API 和集成，让买方可以把智能能力接入现有企业系统或 AI 工具，而不是再采用一个封闭仪表盘。
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM016
      - number: '2.3'
        title: 公开规模证据体现服务覆盖深度，而不是干净的 TAM 叠加
        blocks:
          - type: paragraph
            body: >-
              最好的公开规模观察口径都是受证据限制的代理指标，而不是可辩护的市场模型。Trackunit 及其合作伙伴披露了很大的运营规模——万亿级结构化数据点、数十亿级日数据点、数百万台联网资产，以及广泛的 OEM
              和连接器覆盖——同时也给出 OEM 和租赁部署的使用场景经济性。这些数据支持 Trackunit 正在服务一个有真实采用的、具有重要意义的工程运营品类，但它们分别衡量平台活动、覆盖广度和场景
              ROI，并不存在可用于 TAM、SAM 或 SOM
              的共同分母。独立评论也强调了商业约束：定价按询价或按资产计费，部分买方可能面对长期合同或按套餐开放的集成功能，因此在把这些覆盖信号转成可用于估值的市场模型之前，仍必须直接核查套餐范围、OEM 覆盖和价格。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM015
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: Trackunit 似乎靠掌握碎片化工程工作流之上的数据层取胜
            body: 公开差异化最强的地方不是通用车联网的广度，而是跨 OEM 门户、车队工作流和合作伙伴系统的工程场景数据整合。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: callout
            title: 市场吸引力比买方经济性更容易看清
            body: 公开证据显示其服务覆盖规模真实存在，但在把覆盖信号转成可用于估值的市场模型之前，询价制定价、按套餐开放的集成和长期承诺风险仍需直接尽调。
            calloutType: risk
            claimRefs:
              - CM008
