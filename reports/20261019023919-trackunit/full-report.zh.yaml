    rows:
      - - OEM 数据流与生态兼容性
        - OEM、零部件制造商和技术提供商
        - 数据流丢失或降级会削弱混合车队覆盖和下游分析
        - 公司报告超过 100 个 OEM 数据流；收入和使用集中度未披露
        - 高
