chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Trackunit 将自己定位为专注工程领域的运营数据与车联网平台，服务混合车队、OEM、租赁运营商、经销商和承包商，而不是通用的车辆车队产品。最具体的一手规模数据来自 2024 年年报：净收入 DKK
              1.286 billion、ARR DKK 812.6 million、订阅数 1.674 million，平均员工 459 人。同一份申报称，公司业务覆盖超过 120 个国家、拥有 17 个全球枢纽、1,200
              多个平台注册集成、26,000 名月活用户和超过 3 million 台联网资产。当前营销页面则将 IrisX 推广为更广泛的运营数据平台，称其拥有 6 million+ 台联网资产和 100+ 个 OEM
              数据源，因此后续章节应区分 2024 年经审计的快照与 2026 年公司的营销口径。
            claimRefs:
              - CO001
              - CO002
