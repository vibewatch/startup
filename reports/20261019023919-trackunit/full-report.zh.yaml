      - number: '1.4'
        title: 里程碑、近期变化与未解决的公开信息缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司通过收购、平台发布和股东转换持续扩张，但一些对投资人至关重要的事实仍然不透明。官方历史从 1998 年 M-Tec 起源开始，经历 Trackunit 品牌建设、2022 年 Hg 收购和
              ZTR 工业 IoT 交易、2023 年 Flexcavo 与 OEMSI 收购，以及 2024 年 IrisX 发布。较新的第一手证据还显示，2025 年 1 月进行了裁撤 40
              个岗位的重组，并在资产负债表日之后完成 Goldman Sachs Alternatives 的多数股权收购。独立来源也印证，Trackunit 在重型设备和混合车队领域具有差异化，但反复提示其采用询价制定价和
              36 或 42 个月的长期合同。现有公开材料仍未披露当前估值、累计融资总额、经核实的客户数或收购后的完整债务包。
