      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开融资背景确认了股东信心，却没有带来对投资人友好的价格透明度。Hg 的投资组合页面仍突出 2025 年 2 月 10 日 Goldman Sachs Alternatives 的投资；GRO 的退出回顾则把
              Trackunit 描述为一家实现国际扩张、深化 OEM
              和承包商关系，并建立有意义北美业务敞口的企业。这些都是正面的背景信号，因为股东之间的交易通常需要真实的运营底子。但它们无法解决核心估值问题。独立评论页面反复将 Trackunit
              描述为询价制、按需询价的软件；一份比较指南明确建议买方比较合同期限、硬件所有权和按资产扩展方式，而不是比较任何公开标价。另一份指南称 Trackunit 合同通常为 36 或 42
              个月，这一点很重要，因为如果增长放缓或客户抵触扩张，长期合同会放大下行。公司发布的 LinkedIn 资料还展示了多国办公室网络，支持其全球运营触达，但不能独立证明盈利能力。留存买方指南把 Samsara 和
              Geotab 作为有用的产品比较对象，但没有提供可比财务倍数，因此这里不能把它们当作可辩护的估值锚点。最终呈现的是一项可信的战略资产，但公开价格发现能力很弱。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
