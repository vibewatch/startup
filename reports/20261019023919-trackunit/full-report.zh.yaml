          modules:
            - 数据湖仓
            - 受治理的访问与数据规则
          outputs:
            - 标准化运营数据
            - 可复用的共享定义
        - label: 分析与自动化
          detail: 分析、机器学习和自动化服务建立在标准化数据层之上。
          modules:
            - 分析与洞察
            - 生成式 AI 与机器学习
            - 自动化工作室
          outputs:
            - AI 辅助分析与提醒
            - 自动化工作流
        - label: 扩展与生态
          detail: API、SDK、连接器、市场应用和蓝图向客户及合作伙伴开放受治理的数据层。
          modules:
            - 标准化 API
            - Iris App SDK
            - 市场与 ISO 数据源
            - 面向 ERP、CRM、租赁和 BI 工具的连接器
            - 蓝图
          outputs:
            - 定制应用
            - 品牌化门户
            - 第三方集成
        - label: OEM 与车队工作流
          detail: 产品化工作流将数据层转化为服务、正常运行时间和运营场景。
          modules:
            - 远程诊断
            - 混合车队可视性
            - 预测性服务工作流
          outputs:
            - 支持与维护行动
            - 运营可视性
        - label: 业务结果
          detail: Trackunit 将这套架构连接到正常运行时间、支持、服务和产品设计工作流。
          modules:
            - 零部件与服务工作流
            - 数据驱动的产品设计
          outputs:
            - 更快响应、更少现场访问
            - 更广的混合车队可视性
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 从连接到工作流扩展的客户旅程
    type: journey-map
    summary: 公开证据支持一条可复用路径：从机器连接延伸到数据共享、服务工作流，再到面向 OEM、租赁商和承包商客户的 AI 驱动增购。
    data:
      items:
        - label: 工厂连接或后装连接
          tone: neutral
          touchpoints:
            - OEM 与车队车联网接入
            - XCMG 工厂联网案例
        - label: 统一运营数据摄取
          tone: neutral
          touchpoints:
            - 100+ 个 OEM 数据源
            - 1,200+ 个连接器与集成
        - label: 基础车队可视性
          tone: positive
          touchpoints:
            - 6 million+ 台联网资产
            - 3 billion+ 个日数据点
        - label: 租赁商与承包商数据共享
          tone: positive
          touchpoints:
            - 利用率与可持续性数据门户
            - Sunbelt 上线部署
        - label: OEM 服务与售后市场工作流
          tone: positive
          touchpoints:
            - 远程诊断
            - 零部件、保修与品牌化支持体验
        - label: 向 AI 与 Blueprints 扩展
          tone: positive
          touchpoints:
            - MCP、AI 助手与 Blueprints
            - 覆盖更多产品类型和资产
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU015
  - id: FR001
    title: 剩余风险优先级热力图
    type: matrix
    summary: 对六个有证据支持的风险面进行定性排序；标签不代表概率。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 根据分配的公开证据判断的定性可能性
        - id: impact
          label: 影响
          detail: 风险发生时可能造成的投资影响
        - id: mitigation
          label: 缓释成熟度
          detail: 公开缓释证据的强度
        - id: residual
          label: 剩余严重性
          detail: 公开缓释措施实施后仍剩余的暴露
      rows:
        - label: 隐私与员工监控
          note: GDPR 与共同决定义务已被独立识别
          values:
            - 中
            - 高
            - 部分
            - 高
        - label: 安全与 AI 数据访问
          note: ISO 27001 与受治理访问属于公司口径；范围尚不可知
          values:
            - Unknown
            - 高
            - 部分
            - 中高
        - label: 硬件与安装质量
          note: 严重投诉属于个案叙述，不能证明普遍存在
          values:
            - Unknown
            - 中高
            - 未验证
            - 中高
        - label: OEM 与集成依赖
          note: 广度属于口径，集中度和终止风险尚未披露
          values:
            - 中
            - 高
            - 部分
            - 高
        - label: 杠杆与契约压力
          note: 交易及非上市公司财务条款不可得
          values:
            - Unknown
            - 高
            - 未验证
            - 高
        - label: 产品与支持执行
          note: 已验证用户的反馈褒贬不一且较早，当前产品迭代节奏来自公司口径
          values:
            - 中
            - 中
            - 部分
            - 中
    approximationNotes: 仅为分析师的定性映射。“未知”表示分配的证据不足以支持概率估计；矩阵不暗示标签之间存在数值间距。
    claimRefs:
      - CR002
      - CR009
      - CR010
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐链条从真实的平台规模证据延伸到最新路线图活动，最终卡在不透明的定价和非公开投资判断数据上。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 官方与合作伙伴材料仍显示其拥有数百万资产规模，以及广泛的 OEM / 集成覆盖面。
        - id: roadmap
          label: 2026 年路线图仍在推进
          detail: Trackunit 在 2026 年仍持续推广 AI、数据和联网运营计划。
        - id: sponsor
          label: 赞助方兴趣依然真实
          detail: Hg 强调了 Goldman Sachs Alternatives 于 2025 年进行的投资，这支持其战略相关性判断。
        - id: opacity
          label: 价格发现较弱
          detail: 独立来源称其价格按报价确定，或只能按需获取。
        - id: underwriting
          label: 投资判断数据仍有缺口
          detail: 公开来源没有提供当前 ARR、留存率、EBITDA、杠杆或优先权细节。
        - id: recommendation
          label: 需要继续研究 / 估值偏高
          detail: 业务质量比入场价格更清晰，因此现有证据尚不足以支持买入判断。
      edges:
        - from: scale
          to: roadmap
          label: 支持
        - from: roadmap
          to: sponsor
          label: 强化
        - from: sponsor
          to: opacity
          label: 但无法解决
        - from: opacity
          to: underwriting
          label: 导致
        - from: underwriting
          to: recommendation
          label: 推导出
    approximationNotes: 这是推理图，而非量化估值桥接图；节点顺序展示决策逻辑，不代表规模。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
