      - number: '1.3'
        title: 所有权结构与生态利益相关方
        blocks:
          - type: paragraph
            body: >-
              目前，Trackunit 最适合被理解为一家由 PE 支持的私有平台企业，其战略杠杆来自所有权、OEM 关系和生态分发。官方材料显示 Hg 于 2022 年收购 Trackunit；2024 年年报披露，年末之后
              Goldman Sachs Alternatives 收购了最终母公司 Galaxy UK Topco Limited 的多数股权，Hg 仍是重要股东。其运营模式也依赖 OEM 连接和合作伙伴集成：官方页面将
              Trackunit 定位为开放生态，并推出 Works With Trackunit
              兼容性计划；独立评论则认为，该产品在客户运营非公路、混合品牌工程车队时最具优势。这一组合支持品类领导地位的判断，但也使所有权条款、OEM 覆盖广度以及定价和合同纪律成为关键尽调事项。
