          tone: positive
        - period: 2003-2015
          label: Trackunit 品牌与早期国际化拓展
          detail: 年报称，Trackunit 品牌在这一时期建立，并在西欧各地设立子公司。
          tone: positive
        - period: 2016-2021
          label: Iris 平台时代与地域扩张
          detail: 官方历史将进入北美、推出 Iris、拓展亚太及日本地区，以及收购 Dreyer & Trimm 和 Satrak 归入这一阶段。
          tone: positive
        - date: '2022'
          label: Hg 收购与 ZTR 工业物联网交易
          detail: Trackunit 称 Hg 于 2022 年收购公司，同时也收购了 ZTR 的工业物联网部门。
          tone: positive
        - date: '2023-01-01'
          label: Flexcavo 收购
          detail: Trackunit 收购了承包商软件公司 Flexcavo GmbH。
          tone: positive
        - date: '2023-09-29'
          label: OEMSI 收购
          detail: Trackunit 收购了北美部署服务商 OEM Solutions LLC。
          tone: positive
        - date: '2024'
          label: IrisX 发布与 FY2024 规模跃升
          detail: 年报将 IrisX 与 12.9 亿丹麦克朗净收入、8.126 亿丹麦克朗 ARR 以及超过 300 万台联网资产联系起来。
          tone: positive
        - date: 2025-01
          label: 重组与赞助方转换
          detail: Trackunit 披露，2025 年 1 月裁员 40 人；年末之后，Goldman Sachs Alternatives 收购多数股权，Hg 继续持有投资。
