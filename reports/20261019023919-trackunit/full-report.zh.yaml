              News 则报道，ZTR 收购预计会使 Trackunit
              收入翻倍。这些指标表明其品类规模已不小，但同一组公开材料没有披露当前现金、烧钱、现金跑道、债务契约、项目融资义务，或软件与硬件的毛利拆分。对投资判断而言，这种资产负债表和融资不透明比历史规模指标更重要，因为杠杆和现金转换决定增长是否需要进一步的股东支持或新增债务容量。
