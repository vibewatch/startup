      - number: '3.2'
        title: Trackunit 以混合车队工程数据和 OEM 分发实现差异化
        blocks:
          - type: paragraph
            body: >-
              Trackunit 公开差异化最强的地方，不是某一款硬件或标价优势，而是专为工程场景打造的运营数据平台、广泛的 OEM/连接层，以及进入混合车队的生态分发。官方页面将 IrisX 定位为车联网之上的数据层，OEM
              页面则强调兼容性、品牌门户和更广生态中的伙伴访问。第三方比较大体认同这一定位：它们认为 Trackunit 更适合非公路、混合品牌车队，而 Samsara 和 Geotab
              在以卡车或车辆为主的运营环境中更自然地具备取胜空间。
