        - 在私有尽调补齐投资判断所需缺口前，不要将其转化为买入建议。
      - - 置信度
        - medium
        - 多个来源支持品类相关性和路线图活动，但核心经济数据仍属私有。
        - 继续尽调，不要根据公开数据强行制造精确度。
      - - 风险评级
        - high
        - 按报价计价的经济性、长合同和未披露融资条款会在增长或留存走弱时放大下行空间。
        - 要求下行保护，或等待更充分披露。
      - - 估值立场
        - stretched
        - 投资方兴趣可信，但公开价格发现和可比公司锚定仍很薄弱。
        - 坚持入场纪律，并采用情景化投资判断。
    notes: 仅综合保留的公开证据；建议和立场是判断，不是引用的公司指标。
