  topStrengths:
    - Broad installed base and ecosystem reach across OEMs, rental fleets, dealers, and contractors.
    - Integrated IoT, cloud, and AI workflow platform with multi-modal connectivity and governed-access claims.
    - Visible product cadence and a recognizable brand in construction telematics.
  topRisks:
    - Transaction leverage, covenants, and interest burden remain undisclosed after the majority investment.
    - Privacy, workforce-monitoring, and data-governance exposure is hard to clear from public evidence alone.
    - Hardware, support, integration, and OEM-feed dependencies can degrade service quality and adoption.
  unresolvedGaps:
    - Full post-buyout debt package, covenants, and interest burden are not publicly disclosed.
    - 2025 ARR, EBITDA, NRR, and churn metrics remain unavailable from audited or company-published sources.
    - Realized pricing by module, hardware gross margin, and OEM revenue concentration are still opaque.
    - Public evidence of SOC 2 Type II or equivalent full-platform assurance remains incomplete.
