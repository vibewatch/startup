evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-leverage
    missingEvidence: >-
      Current equity valuation, acquisition consideration, debt package, covenants, and interest burden after the
      Goldman Sachs Alternatives majority acquisition.
    whyItMatters: >-
      Sponsor ownership is central to downside risk and return math, but leverage and entry valuation can materially
      change resilience and equity upside.
    diligencePath: >-
      Request the buyout model, debt term sheet, lender presentations, and board-approved capital-structure updates
      directly from management or owners.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: customer-base
    missingEvidence: >-
      Verified current customer count, customer concentration, and mix across OEMs, rental fleets, contractors, and
      dealers.
    whyItMatters: >-
      Monthly active users and connected assets show platform activity, but they are not substitutes for paying-customer
      count or concentration risk.
    diligencePath: >-
      Obtain the current customer roll-forward, top-account concentration, and ARR split by customer segment from
      internal reporting.
    relatedQuestionRefs:
      - QO001
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: founders
    missingEvidence: Named founders and their continuing role, if any, in current governance or commercial positioning.
    whyItMatters: >-
      Founder continuity can matter for mission credibility and culture, but the public source pack only supports
      company lineage rather than named founder biographies.
    diligencePath: >-
      Confirm the founding team and any ongoing founder involvement through management interviews or corporate-history
      materials.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: tam-sam-som-gap
    missingEvidence: >-
      A third-party market dataset or customer-level denominator that isolates off-highway construction telematics and
      operating-data spend by geography and buyer segment.
    whyItMatters: >-
      Without an external denominator, the public footprint metrics cannot be translated into a valuation-grade TAM,
      SAM, or SOM.
    diligencePath: >-
      Request current analyst-market-data or management-prepared market model that ties asset counts, buyer segments,
      and pricing assumptions to the exact Trackunit category.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current plan-level pricing, contract structure, OEM make-model coverage, data-refresh SLAs, and which integration
      surfaces are gated by IrisX or specific tiers.
    whyItMatters: >-
      Buyer economics and implementation friction can change materially with asset count, contract term, and plan
      entitlements.
    diligencePath: >-
      Obtain the current order form, pilot clause, OEM coverage matrix, and plan entitlement sheet before converting
      public positioning into revenue or margin assumptions.
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Exact realized pricing by module, hardware/software split, implementation fees, and exit economics versus Samsara
      and Geotab.
    whyItMatters: >-
      Public comparisons can rank fit and contract shape, but they cannot underwrite gross margin quality or switching
      ROI without real customer pricing.
    diligencePath: >-
      Obtain current customer proposals or executed order forms for Trackunit, Samsara, and Geotab across at least two
      fleet-size bands.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: oem-coverage
    missingEvidence: >-
      Make-by-make OEM coverage, refresh intervals, and data-field depth for the exact machine models a buyer cares
      about.
    whyItMatters: >-
      The competitive winner can flip if one platform lacks reliable hours, fault codes, or attachment support for the
      installed fleet.
    diligencePath: >-
      Request a written coverage matrix and sample telemetry payloads for the target OEMs and attachment classes from
      each vendor.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Public customer evidence on churn, migration timelines, export portability, and multi-homing behavior after
      rollout.
    whyItMatters: >-
      The public moat case currently relies more on ecosystem breadth and contract duration than on proven retention
      economics.
    diligencePath: >-
      Interview customers that switched to or from Trackunit and review contract language covering data export, early
      termination, and renewal mechanics.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing by module, discount ladders, contract true-ups, and segment mix by OEM, rental, contractor, and
      dealer cohorts.
    whyItMatters: Public per-asset or quote-based language does not reveal actual ACV, concessions, or revenue concentration.
    diligencePath: Request current price book, three anonymized customer proposals, and realized pricing waterfalls by segment.
  - type: private-evidence-only
    severity: material
    topic: unit-economics-proxies
    missingEvidence: Software vs hardware gross margins, CAC, payback, churn, NRR, and cohort retention metrics.
    whyItMatters: Workflow-value claims are not enough to underwrite recurring-margin quality or sales-efficiency durability.
    diligencePath: Request a board KPI pack with gross-margin splits, sales-efficiency cohorts, churn, NRR, and renewal history.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, burn rate, runway, debt package, covenants, and any project-finance or vendor-finance
      obligations.
    whyItMatters: >-
      Historical scale does not answer whether Trackunit can fund growth and hardware deployment without additional
      sponsor support or leverage.
    diligencePath: >-
      Obtain the latest balance sheet, debt summary, covenant package, and monthly cash bridge since the Hg-backed
      ownership change.
  - type: private-evidence-only
    severity: material
    topic: service-delivery-costs
    missingEvidence: >-
      Working-capital needs for hardware inventory, warranty reserves, installation costs, and device replacement
      economics.
    whyItMatters: >-
      Hardware ownership and service obligations can compress cash conversion even when subscription revenue looks
      recurring.
    diligencePath: Request hardware BOM/COGS, warranty claims history, installation partner economics, and inventory-turn data.
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: >-
      Public uptime or availability commitments, status-history evidence, API rate-limit/versioning policy, and
      support-response SLAs.
    whyItMatters: >-
      Architecture breadth does not prove dependable production operations; integration-heavy buyers need service and
      interface reliability before underwriting rollout.
    diligencePath: >-
      Request customer-facing SLA language, status-page history, API docs covering rate limits and deprecation policy,
      and support-operating metrics.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance-detail
    missingEvidence: >-
      Public audit scope beyond ISO 27001, penetration-test summary, data-retention defaults, and processor or
      subprocessor disclosures specific to IrisX.
    whyItMatters: >-
      Construction telematics and location data can be commercially and personally sensitive, so certification headlines
      alone are not enough for a full trust review.
    diligencePath: >-
      Request Trackunit's latest security packet, DPA/subprocessor list, trust-center materials, and any SOC 2 or
      equivalent audit artifacts.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: implementation-and-payback
    missingEvidence: >-
      Segmented implementation timelines, retrofit hardware BOM, realized pricing by module, and referenceable customer
      ROI by cohort.
    whyItMatters: >-
      The public case for Trackunit is stronger on capability breadth than on measured deployment economics, which
      limits conviction on adoption friction and payback.
    diligencePath: >-
      Ask for three reference deployments with SOWs, implementation timelines, module pricing examples, and quantified
      before/after operational outcomes.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: NRR, GRR, logo churn, renewal rates, and standard contract terms by OEM, rental, and contractor cohort.
    whyItMatters: >-
      Public adoption proof is meaningful only if deployments renew and expand; without cohort retention data,
      durability remains unverified.
    diligencePath: >-
      Ask management for cohort retention tables, renewal rates, contract-duration ranges, and churn commentary by
      customer segment.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer revenue share, OEM vs rental revenue mix, and channel concentration by account or geography.
    whyItMatters: Strong named logos can still mask revenue concentration or channel dependence that would change downside risk.
    diligencePath: >-
      Request top-10 customer revenue concentration, largest-OEM exposure, and segment mix from current board or lender
      materials.
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-coverage
    missingEvidence: >-
      A complete dated list of referenceable customers by segment and module, with which deployments are live versus
      historical.
    whyItMatters: The named-customer table proves breadth, but not exhaustiveness or recency across the entire installed base.
    diligencePath: >-
      Request a current reference account list with segment, geography, deployment status, and customer-approved proof
      points.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-security-record
    missingEvidence: >-
      Primary court, regulator, certification-scope, data-residency, subprocessor, penetration-test, outage, breach, and
      incident-response records.
    whyItMatters: >-
      Public silence cannot establish the absence of litigation, enforcement, control exceptions, outages, or security
      incidents across a high-impact data platform.
    diligencePath: >-
      Obtain legal and regulatory schedules, ISO certificate and statement of applicability, independent assurance
      reports, pen-test summaries, incident logs, and regulator correspondence.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Purchase price, equity contribution, debt tranches, interest rates, maturities, covenants, covenant headroom, free
      cash flow, and downside liquidity.
    whyItMatters: >-
      Leverage and cash-interest burden can constrain product investment, support quality, acquisitions, and resilience
      through construction-cycle weakness.
    diligencePath: >-
      Review the closing funds flow, capitalization table, debt agreements, monthly covenant model, audited cash flow,
      and a downside liquidity bridge.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Exhaustive jurisdiction-by-jurisdiction license, privacy, labor-monitoring, litigation, enforcement,
      intellectual-property, and transaction-approval inventory.
    whyItMatters: >-
      The allocated evidence supports only three risk surfaces and cannot establish completeness across Trackunit's
      global footprint.
    diligencePath: >-
      Have counsel produce a jurisdictional compliance and claims schedule and reconcile it to regulator, court,
      patent-office, and transaction-closing records.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-and-concentration-metrics
