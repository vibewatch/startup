  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-and-security-record
      missingEvidence: >-
        Primary court, regulator, certification-scope, data-residency, subprocessor,
        penetration-test, outage, breach, and incident-response records.
      whyItMatters: >-
        Public silence cannot establish the absence of litigation, enforcement, control
        exceptions, outages, or security incidents across a high-impact data platform.
      diligencePath: >-
        Obtain legal and regulatory schedules, ISO certificate and statement of applicability,
        independent assurance reports, pen-test summaries, incident logs, and regulator correspondence.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: >-
        Purchase price, equity contribution, debt tranches, interest rates, maturities,
        covenants, covenant headroom, free cash flow, and downside liquidity.
      whyItMatters: >-
        Leverage and cash-interest burden can constrain product investment, support quality,
        acquisitions, and resilience through construction-cycle weakness.
      diligencePath: >-
        Review the closing funds flow, capitalization table, debt agreements, monthly covenant
        model, audited cash flow, and a downside liquidity bridge.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
