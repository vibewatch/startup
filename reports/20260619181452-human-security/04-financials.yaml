  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gtm/channel
      missingEvidence: Customer acquisition cost, sales cycle length post-channel program, and pipeline attribution between direct and partner-sourced ARR.
      whyItMatters: Without CAC and payback data, sales efficiency cannot be benchmarked; channel programme ROI is unverifiable.
      diligencePath: Request CAC by channel, average sales cycle trend Q4 2024 through Q2 2026, and partner-sourced ARR as percentage of new bookings.
      relatedQuestionRefs:
        - QI010

    - type: missing-source
      severity: material
      topic: cost-structure
      missingEvidence: Detailed ML infrastructure cost breakdown; GPU/cloud compute spend as a percentage of COGS; cost trajectory as interaction volume scales.
      whyItMatters: Internet-scale inference at 20T+ interactions/week likely constitutes a structural cost disadvantage versus software-only peers; without COGS data this cannot be sized.
      diligencePath: Request cloud provider cost details (AWS/GCP/Azure bills or summary), COGS breakdown, and infrastructure cost per billion interactions in data room.
      relatedQuestionRefs:
        - QI011

    - type: missing-source
      severity: material
      topic: funding/capital
      missingEvidence: Current status of the $100 million Blackstone Credit debt facility including outstanding balance, maturity date, covenants, interest rate, and any refinancing or extinguishment events since 2022.
      whyItMatters: The debt facility is a material liability that affects true enterprise value, leverage ratios, and net cash position. Without confirmation, capital structure analysis is incomplete.
      diligencePath: Request term sheet and current facility statement from Blackstone Credit in data room; confirm paydown schedule and covenant compliance.
      relatedQuestionRefs:
        - QI021

    - type: private-evidence-only
      severity: blocking
      topic: capital-structure
      missingEvidence: Audited or management-certified monthly burn rate, current cash and cash equivalents, and 12-month forward cash flow projection.
      whyItMatters: Without cash position and burn rate, runway cannot be independently confirmed and next-round dependency risk cannot be assessed.
      diligencePath: Request CFO-signed monthly cash flow summary covering at least 12 months of actuals plus a forward forecast; reconcile with latest bank statements.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: blocking
      topic: arr/revenue
      missingEvidence: Audited ARR by product segment with a clear GAAP definition distinguishing contracted ARR from bookings, and reconciliation of the GetLatka $15M figure versus company-stated >$100M.
      whyItMatters: A potential 6x discrepancy between third-party and company ARR figures is the highest-priority financial diligence item and blocks revenue quality underwriting.
      diligencePath: Request audited ARR schedule signed by CFO, broken down by product module, contract vintage, and geography; include a reconciliation note explaining any Latka discrepancy.

    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Gross margin, gross revenue retention, and net revenue retention data for the consolidated entity and by product module.
      whyItMatters: These are the primary drivers of SaaS valuation and margin path; without them the financial verdict cannot move beyond inferred benchmarks.
      diligencePath: Request GAAP income statement and NRR/GRR cohort waterfall for at least the last four quarters in the data room.

    - type: enumeration-incomplete
      severity: material
      topic: customers
      missingEvidence: Customer concentration data — top 10 customers as percentage of ARR, contract lengths, and renewal history.
      whyItMatters: If a small number of large platforms (e.g., major ad networks, large e-commerce operators) account for a disproportionate ARR share, revenue durability is vulnerable to single-customer events.
      diligencePath: Request customer concentration analysis and churn cohort data segmented by customer ARR tier.

