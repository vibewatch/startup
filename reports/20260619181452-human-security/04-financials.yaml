  - id: financial-traction
    title: Public Financial Traction and Private Metric Gaps
    body: >
      HUMAN Security discloses very limited financial data as a private company. The
      principal public traction signals are: (1) company-claimed ARR exceeding $100M,
      first confirmed when the combined HUMAN+PerimeterX entity announced over $100M
      ARR at the July 2022 merger, and reiterated in the January 2024 CEO transition
      announcement attributing the milestone to Tamer Hassan's tenure; (2) 500+ global
      brands served as of October 2024, corroborated across multiple press releases; and
      (3) platform scale of 20 trillion digital interactions verified per week, and over
      one quadrillion annually in 2025.
      A directly conflicting third-party data point exists: GetLatka reported HUMAN ARR
      at $15 million as of December 2023. This figure is inconsistent with the merged
      entity's scale, headcount (437+ employees by mid-2024), and the post-merger ARR
      disclosure. GrowJo's model-based estimate of $140.4M annual revenue is more
      consistent with the post-merger company. The Latka figure may reflect pre-merger
      White Ops standalone revenue or a miscalculation; it cannot be resolved without
      audited disclosure. Net revenue retention, gross revenue retention, customer
      concentration, and cohort-level ARR data are entirely absent from public sources.
    claimRefs:
