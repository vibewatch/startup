company:
  name: HUMAN Security

chapter:
  number: 4
  title: Financials
  summary: >
    HUMAN Security has company-claimed ARR exceeding $100M (post-PerimeterX merger, confirmed
    in the January 2024 CEO transition announcement), backed by ~$300M in total equity funding
    across 8 rounds and a $100M Blackstone Credit debt facility. A conflicting third-party
    estimate of $15M ARR (GetLatka, 2023) cannot be reconciled without independent disclosure.
    Key financials—gross margin, NRR, burn rate, and ARR by product segment—remain private,
    creating material diligence blockers.

sections:
  - id: revenue-architecture
    title: Revenue Architecture and Pricing Model
    body: >
      HUMAN Security operates a pure subscription SaaS model built around the Human Defense
      Platform, which integrates three commercial pillars: advertising protection, application
      security and bot mitigation, and account protection. Revenue is generated as annual
      enterprise contracts priced on the basis of traffic volume, number of protected assets
      (web, mobile, API endpoints), and the specific module mix selected by the customer.
      There is no publicly listed price card; all enterprise pricing is custom and negotiated.
      The platform monetises through four verifiable revenue streams: (1) advertising/media
      security (pre- and post-bid fraud, click fraud, malvertising defence via the clean.io
      acquisition), (2) application security and bot mitigation (the former BotGuard and
      PerimeterX stack), (3) account protection (credential stuffing, fake account creation),
      and (4) HUMAN Sightline with AgenticTrust (launched July 2025), which adds AI-agent
      trust and agentic commerce protection as an emerging fourth stream. The median enterprise
      annual spend benchmarked by Vendr is $104,906 per year, with a reported range from
      $46,601 to over $1.34 million for large, complex deployments. Official pricing is
      therefore a floor proxy for list price, not disclosed realised revenue. Revenue quality
      is expected to be high given the mission-critical nature of fraud prevention and the
      high switching costs inherent in deeply embedded platform integrations, but the exact
      ARR mix by segment is not publicly available.
    claimRefs:
