callouts:
  - calloutType: strength
    title: Recurring Revenue at Scale with Deep Enterprise Stickiness
    body: >
      HUMAN Security's company-claimed ARR exceeding $100M, combined with deeply embedded
      platform integrations across 500+ global brands, suggests high switching costs and
      durable revenue quality. The Forrester Wave Leader designation in both Q3 2024 and
      Q2 2026 (expanded category) confirms sustained analyst recognition as the category
      leader, supporting premium pricing and enterprise retention.
    claimRefs:
      - CI002
      - CI003
      - CI008
      - CI036

  - calloutType: risk
    title: Unresolved ARR Discrepancy is a First-Order Diligence Blocker
    body: >
      GetLatka reports $15M ARR as of December 2023, directly conflicting with the
      company-claimed >$100M ARR. A 6–7x discrepancy at this revenue scale is material.
      Until independently audited ARR is disclosed, revenue quality and valuation cannot
      be underwritten. This is the highest-priority financial diligence request.
    claimRefs:
      - CI003
      - CI004

  - calloutType: risk
    title: Blackstone Debt and Undisclosed Margins Create Capital Structure Uncertainty
    body: >
      The $100M Blackstone Credit facility (July 2022) has unknown repayment status as of
      June 2026. Combined with undisclosed gross margin and burn rate, the true capital
      structure and runway cannot be independently assessed. Financial dependency on
      continued venture funding remains high absent evidence of near-breakeven operations.
    claimRefs:
      - CI031
      - CI037
      - CI038

  - calloutType: recommendation
    title: Five Priority Diligence Requests
    body: >
      Before financial underwriting: (1) audited ARR and ARR by segment with GAAP definition;
      (2) gross margin and COGS breakdown; (3) NRR and GRR by cohort; (4) monthly cash flow
      and 12-month burn forecast; (5) Blackstone facility current balance, covenants, and
      maturity date.
    claimRefs:
      - CI037
      - CI038

