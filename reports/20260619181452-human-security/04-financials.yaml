  - id: financial-verdict
    title: Financial Verdict
    body: >
      HUMAN Security presents a credible SaaS platform business with company-claimed ARR
      above $100M, a defensible high-switching-cost product footprint, and a Forrester
      Leader designation in both Bot Management Q3 2024 and the expanded Bot and Agent
      Trust Management Q2 2026. The October 2024 $50M+ round and total ~$300M in equity
      financing signal sustained investor conviction. However, the revenue quality, margin
      path, and capital efficiency story cannot be independently underwritten: gross margin,
      NRR, exact ARR by segment, burn rate, and cash position are all private. A material
      discrepancy between the company-claimed >$100M ARR and GetLatka's $15M figure
      demands independent resolution as a first-order diligence step. The Blackstone $100M
      debt facility (2022) introduces leverage risk that is not yet reconciled in any public
      filing. The partner-first GTM pivot is strategically sound but nascent, and its
      contribution to sales efficiency is not yet measurable from public data. Financial
      verdict: revenue quality appears strong given enterprise stickiness and platform scale,
      but margin path and capital intensity remain diligence blockers.
    claimRefs:
      - CI003
      - CI004
      - CI031
      - CI036
      - CI037
      - CI038

