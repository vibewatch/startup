  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: >
      HUMAN Security has raised approximately $300 million in total equity capital across
      eight rounds (Tracxn and SiliconAngle, October 2024), including a $100 million
      growth round in January 2022 (WestCap, NightDragon), and most recently a $50 million
      growth round in October 2024 (WestCap, Goldman Sachs, ClearSky, NightDragon, Vertex
      Ventures US). Additionally, in July 2022 HUMAN obtained a $100 million debt facility
      from Blackstone Credit in connection with the PerimeterX merger, bringing total
      capital resources to approximately $350 million or more. White Ops filed a Form D
      with the SEC in June 2014 for its Series A raise, confirming its Delaware incorporation
      and the earliest equity financing event.
      The October 2024 round is expressly allocated to: accelerating AI platform capabilities
      (AgenticTrust and advanced detection models), expanding into the public sector, and
      strengthening the channel partner programme. With a headcount of approximately
      469–519 as of mid-2026 and assuming a fully-loaded cost per employee of $180–$220K
      per year (senior-heavy tech company), implied annual payroll is $84–$114M. Including
      cloud infrastructure and G&A, estimated monthly burn is $9–$13 million. Post-October
      2024 round, inferred runway at this burn rate is approximately 18–36 months depending
      on gross margin and revenue growth—extending to late 2026 through 2027. Cash position,
      exact burn rate, and the current status of the Blackstone debt facility are not
      publicly disclosed.
    claimRefs:
      - CI029
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
    tableRefs:
      - TI004
    figureRefs:
