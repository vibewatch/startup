  - id: sizing-gaps
    title: "Sizing Gaps, Contradictory Estimates, and Diligence Asks"
    body: >
      Three structural gaps prevent a definitive market size from being established. First, HUMAN Security
      does not disclose revenue, ARR, or customer count, making bottom-up SOM estimation entirely reliant on
      inferred metrics such as Forrester Wave ranking, G2 position, and network scale. Second, the analyst
      community has not yet independently sized the "agent trust management" sub-market—Forrester renamed
      the category only in 2025, and no consensus market forecast exists for this segment in 2026. Third,
      the $1.12B–$88.77B range of market estimates cited in analyst reports reflects boundary inconsistency,
      not genuine disagreement on fundamentals: the $88.77B eCommerce FDP estimate includes payment fraud,
      chargebacks, KYC/KYB, and identity proofing that HUMAN does not address, while the $1.27B bot security
      estimate excludes SIVT vendor revenue. Neither cleanly maps to HUMAN's actual product scope.

      Contradictory sizing evidence worth preserving: Grand View Research's $40.4B fraud detection market
      implies HUMAN's market is 30-40x larger than the bot-security-only figure—a discrepancy that reflects
      scope rather than error. Cloudflare's near-80% install share in bot management is presented by wmtips.com
      as evidence that HUMAN and other dedicated vendors compete in a niche carve-out within a Cloudflare-dominant
      market, which would compress the effective SAM well below $1.27B for markets already served by Cloudflare.
      This constraint does not appear in any of the market research reports sampled, representing a significant
      gap in published analysis. Any financial model should apply a 20–40% SAM haircut for Cloudflare-served
      customers as a conservative floor scenario.

      Diligence asks: (1) Request HUMAN's ARR, NRR, and customer cohort data to validate SOM assumptions.
      (2) Quantify Cloudflare penetration among HUMAN's target buyer segments to size the addressable residual.
      (3) Obtain independent sizing of the MRC-accredited SIVT vendor market. (4) Confirm whether the agentic
      trust management segment is tracking toward a distinct budget line or remains a feature expansion within
      existing bot-management contracts.
