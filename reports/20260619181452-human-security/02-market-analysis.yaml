  - id: drivers-constraints
    title: "Growth Drivers and Adoption Constraints"
    body: >
      The single most potent growth driver is the explosion of automated and agentic traffic. HUMAN's own
      2026 benchmark report found automated traffic growing 23.51% year-over-year while human traffic grew
      only 3.10%—a ratio of roughly 8:1. AI-driven traffic surged 187% in 2025, and agentic AI traffic from
      agents and browsers grew 7,851% YoY. The category that Forrester renamed "Bot and Agent Trust Management
      Software" in 2025 reflects a structural expansion of the addressable problem: it is no longer sufficient
      to classify traffic as human vs. bot; organizations must now govern whether an AI agent can be trusted
      to transact on a user's behalf. This expansion creates a new TAM layer above traditional bot mitigation
      where no established incumbent dominates, and HUMAN's AgenticTrust module was designed specifically for
      this gap.

      A second driver is regulatory and compliance pressure. TAG awarded 307 certification seals to 196
      companies in 2026, with 74% independently audited—signaling that ad industry compliance is tightening
      beyond self-attestation. MRC accreditation for SIVT detection is increasingly a prerequisite for
      programmatic platform participation. Regulatory drivers such as PSD2 (financial services), NIST CIAM
      guidance, and emerging EU AI Act provisions on autonomous system accountability are creating non-discretionary
      budget lines for bot and agent trust management in regulated verticals.

      ATO attacks quadrupled in HUMAN's customer base between 2024 and 2025 (averaging 400,000+ post-login
      compromise attempts per customer per year), driving upsell and cross-sell opportunities within the
      existing base. Ad fraud losses exceeding $100 billion in 2026 with a 20%+ IVT rate sustain advertiser
      urgency for verified traffic.

      The primary constraint is competitive bundling: Cloudflare holds approximately 79% of bot management
      install share (vs. Akamai's 6%) by providing integrated CDN, WAF, and bot management at flat-rate pricing
      starting below $400 annually—a package that displaces dedicated bot defense vendors in the SMB and
      lower-mid market. DataDome's market share fell from 13.8% to 8.9% between 2025 and 2026, potentially
      reflecting this bundling pressure. A second constraint is ROI proof: bot mitigation savings appear as
      "fraud losses avoided" rather than revenue—invisible in P&L statements and requiring sophisticated
      measurement frameworks to justify budget to non-technical stakeholders. A third constraint is switching
      friction: enterprise bot management integrates deeply into login flows, checkout APIs, and analytics
      pipelines; migration risk deters switches from incumbents, slowing new logo acquisition. In-house build
      remains a viable alternative at large platforms with sufficient engineering capacity, further limiting
      HUMAN's net-addressable market.
