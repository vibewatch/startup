callouts:
  - calloutType: risk
    title: "Cloudflare Bundling Compresses Addressable Market"
    body: >
      Cloudflare's ~79% install-base dominance in bot management, bundled with CDN and WAF at flat-rate
      pricing starting around $350/year, structurally excludes HUMAN from much of the SMB and lower-mid
      market. A conservative 20-40% discount to the published $1.27B SAM accounts for this displacement,
      reducing the effective addressable opportunity to approximately $0.8–$1.0B. DataDome's declining
      market share (13.8% → 8.9% in 2025-2026) may be an early indicator of this bundling headwind
      for pure-play bot defense vendors.
    claimRefs:
      - CM028
      - CM029
      - CM030
      - CM037

  - calloutType: insight
    title: "Agentic AI Creates a New Market Layer With No Dominant Incumbent"
    body: >
      Forrester's 2025 renaming of the market to 'Bot and Agent Trust Management Software' and the 7,851%
      YoY growth in agentic AI traffic signal a structural expansion of the problem HUMAN solves. The
      agentic trust management sub-category has no established dominant vendor, and HUMAN's AgenticTrust
      module received the highest Forrester score in AI Agent Trust Management criteria in Q2 2026. This
      represents both a TAM expansion and a potential moat: first-mover advantage in defining a new
      category is historically valuable in enterprise security.
    claimRefs:
      - CM020
      - CM022
      - CM042
      - CM043
      - CM044

  - calloutType: assumption
    title: "SAM and SOM Estimates Are Highly Uncertain"
    body: >
      The $1.5–$2.0B SAM and $150–$300M SOM estimates in this chapter are analyst syntheses with no
      primary-source validation. HUMAN does not disclose revenue. The gap between the narrowest ($1.12B
      bot mitigation) and broadest ($88.77B eCommerce FDP) published market estimates reflects boundary
      inconsistency, not genuine analyst disagreement. Investors and underwriters should treat any market
      size figure below $2B as the most conservative defensible estimate and apply a Cloudflare-bundling
      haircut before projecting penetration rates.
    claimRefs:
      - CM009
      - CM012
      - CM035
      - CM036

