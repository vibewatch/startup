chapter:
  number: 7
  title: Risks
  summary: >
    HUMAN Security faces a multi-layered risk profile spanning regulatory/legal exposure from
    mass-scale behavioral data collection under an evolving 25-state U.S. privacy enforcement
    regime, operational risks from AWS cloud concentration amplified by two major 2026 outages,
    and a structural competitive threat from bundled-platform vendors (Cloudflare, Google, Meta)
    capturing walled-garden inventory. Financial opacity—no disclosed valuation since 2022's
    $1.5B figure—compounds partner-dependency risks (Google/Shadowserver co-dependencies for
    BADBOX disruption) and an accelerating AI-vs-detection arms race. No active enforcement
    actions against HUMAN are known as of June 2026; the primary thesis-break triggers are
    platform bundling eroding ARR, a material cloud outage during peak traffic, or a privacy
    enforcement action reclassifying HUMAN's behavioral signal network as a regulated data broker.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk Landscape
    body: >
      HUMAN Security's core technical capability—collecting and analyzing behavioral fingerprinting
      signals across more than one quadrillion digital interactions annually—creates a material
      and growing data privacy surface. The company processes device fingerprints, mouse-movement
      telemetry, keystroke timing, browser attributes, IP addresses, and cross-property behavioral
      patterns to distinguish bots from humans. Under 20 U.S. states that now actively enforce
      comprehensive privacy laws (as of January 2026), plus GDPR in Europe, any misclassification
      of HUMAN's data as personal-data brokerage or its behavioral signals as regulated data
      could trigger enforcement. The FTC sent formal warning letters to 13 data brokers under
      the Protecting Americans' Data from Foreign Adversaries Act (PADFAA) in February 2026,
      signaling active regulatory surveillance of mass-scale behavioral data vendors.


      The Department of Justice's Data Security Program (DSP) imposes additional restrictions
      on bulk cross-border transfers of covered personal data to "countries of concern." HUMAN
      operates globally and processes data from devices in 222+ countries; any configuration
      that routes covered data through Israel (where HUMAN has offices and engineering staff)
      or partnerships with entities with covered-country links requires CISA-compliant security
      controls. Plaintiffs' attorneys have developed a novel strategy: citing DSP violations as
      predicates for federal Wiretap Act claims even without a private right of action under
      the DSP itself, opening adtech data flows to class action exposure. The volume of online
      privacy lawsuits escalated from approximately 200 cases in 2023 to approximately 4,000
      in 2024; the same behavioral tracking technologies HUMAN deploys for fraud prevention
      are precisely those targeted by plaintiffs.


      On the positive side, HUMAN earned MRC accreditation for Ad Viewability Measurement in
      April 2026, demonstrating compliance rigor. The MRC Digital Advertising Auction Transparency
      Standards were also finalized in January 2026, tightening disclosure requirements for
      ad auction participants. Critics, including the Check My Ads Institute, argue these
      self-regulatory frameworks are structurally insufficient—calling for government regulation—
      suggesting ongoing sector-level regulatory risk even for compliant vendors. As of June 2026,
      no active regulatory enforcement or litigation directly targeting HUMAN Security is publicly
      known; the risk is latent but material given the behavioral data scale.
    claimRefs:
