  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        Audited ARR, gross margin, net revenue retention, burn rate, and cash runway for
        fiscal years 2023–2025 along with any post-2022 post-money valuation data.
      whyItMatters: >
        Without independent financial disclosure, investment sizing, valuation entry, and
        downside scenario modeling cannot be grounded in verifiable metrics.
      diligencePath: >
        Request audited financials and data room access; engage secondary market brokers
        for cap-table and waterfall analysis.
      relatedQuestionRefs:
        - QR023

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Top-10 customer revenue concentration, individual account ARR, contract length
        distribution, and renewal rates.
      whyItMatters: >
        Undisclosed customer concentration creates hidden churn risk; a handful of large
        media or ad exchange customers may represent disproportionate ARR.
      diligencePath: >
        Request CRM-based customer cohort analysis from management; verify against
        NRR trend in audited financials.
      relatedQuestionRefs:
        - QR031

    - type: missing-source
      severity: material
      topic: cloud-resilience-architecture
      missingEvidence: >
        HUMAN's documented multi-cloud or active-active failover architecture, DR test
        results, and contractual SLA commitments with AWS or alternative cloud providers.
      whyItMatters: >
        Two major AWS outages in 2026 confirm the infrastructure risk; without architecture
        documentation, operational resilience cannot be independently assessed.
      diligencePath: >
        Request cloud architecture diagram and DR test log from CISO; review AWS MSA
        for minimum commitments and exit terms.
      relatedQuestionRefs:
        - QR032

    - type: enumeration-incomplete
      severity: minor
      topic: regulatory-legal-risk-register
      missingEvidence: >
        Non-U.S. regulatory risks (GDPR enforcement in EU, UK ICO, Israeli data protection),
        sealed proceedings, and undisclosed intellectual property litigation.
      whyItMatters: >
        HUMAN operates offices in Israel and the UK; GDPR enforcement actions and IP disputes
        in those jurisdictions could materially affect operations and valuation.
      diligencePath: >
        Conduct litigation search across EU, UK, and Israeli courts; request IP assignment
        and patent portfolio audit from management.
      relatedTableRefs:
        - TR001

    - type: stale
      severity: minor
      topic: competitive-pricing-data
      missingEvidence: >
        Current HUMAN pricing benchmarks compared to Cloudflare Bot Management, AWS WAF
        Bot Control, and DoubleVerify for equivalent protection scope.
      whyItMatters: >
        Pricing gap analysis is necessary to quantify the bundled-vendor displacement risk;
        without comparable pricing, the platform-encroachment thesis cannot be quantified.
      diligencePath: >
        Request representative enterprise pricing proposals from sales team; commission
        independent pricing benchmarking study across tier-1 competitors.
