  - id: partner-dependency-risk
    title: Partner, Platform, and Market Dependency Risks
    body: >
      HUMAN operates within a web of critical partner dependencies that are both competitive
      and cooperative. The BADBOX 2.0 disruption illustrates the co-dependency structure:
      HUMAN's Satori team discovered the threat, but actual remediation required Google to
      update Play Protect and take legal action in federal court, Shadowserver Foundation to
      sinkhole command-and-control domains, and FBI coordination for public warnings. This
      public-private model is a competitive moat but also a dependency—HUMAN cannot sinkhole
      infrastructure independently, and Google's involvement is discretionary. Google is
      simultaneously a key distribution partner (through Google Play Protect certification),
      a customer, and a competitor with growing in-house ad fraud detection capability.


      In the Bot Management market, HUMAN is ranked fifth in mindshare at 8.1% versus
      Cloudflare at 9.2% (ranked third) per Gartner Peer Insights and PeerSpot. Cloudflare's
      platform approach bundles DDoS mitigation, WAF, bot management, and API security as a
      single integrated stack with global edge distribution, while HUMAN offers deeper signal
      fidelity at the application layer but narrower infrastructure breadth. The ad verification
      segment has consolidated to a near-duopoly of DoubleVerify and Integral Ad Science as
      public companies with scale advantages. Large platform vendors—Google, Meta, Amazon—
      provide in-house fraud detection for their walled-garden inventory, structurally reducing
      demand for third-party verification on the highest-value impression segments. HUMAN
      must continuously demonstrate incremental lift over bundled alternatives to justify
      per-traffic-unit pricing.


      MRC accreditation, while recently earned, creates a governance dependency: the MRC
      is a voluntary industry body that critics find structurally under-resourced for
      enforcement. Loss of MRC accreditation, however unlikely, would impair HUMAN's
      competitive positioning with media buyers and agency partners who treat accreditation
      as baseline. The ad exchange integration layer—DSP, SSP, and publisher tech partnerships—
      also creates concentration risk if a major exchange deprecates HUMAN's SDK in favor of
      a bundled or competing solution.
