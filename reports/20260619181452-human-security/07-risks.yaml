  - id: operational-technical-risk
    title: Operational, Technical, and ML Risks
    body: >
      HUMAN's operational risk profile is dominated by three interrelated dynamics: cloud
      infrastructure concentration, bot-detection false positives, and an accelerating ML-model
      arms race. The platform's requirement to process 20+ trillion digital interactions weekly
      demands massive cloud compute and storage infrastructure, with AWS serving as the dominant
      public cloud provider. AWS suffered two significant infrastructure failures in early 2026:
      a March 2026 kinetic attack on UAE data centers that disrupted 38+ and 46+ services in
      the ME-CENTRAL-1 and ME-SOUTH-1 regions respectively, and a May 2026 thermal event in
      US-EAST-1 that cascaded across 150+ dependent cloud services. Any equivalent outage
      affecting HUMAN's primary detection infrastructure would directly impair SLA delivery
      to 500+ enterprise customers, many of whom rely on HUMAN for real-time fraud prevention
      at checkout or login. HUMAN has not publicly disclosed multi-cloud or active-active
      failover architecture details, creating a diligence gap around resilience posture.


      The false-positive problem is a structural weakness with legal and commercial consequences.
      Anti-bot systems produce false positives when legitimate users deploy privacy tools—ad
      blockers, VPNs, Tor, non-mainstream browsers, and anti-fingerprinting extensions. Ad
      blockers often suppress anti-bot scripts entirely, causing detection systems to classify
      the session as a bot; VPNs route traffic through shared IPs historically flagged as
      bot sources. For HUMAN's enterprise customers, false positives drive legitimate user
      friction, reduce conversion rates, and can trigger chargeback or complaint cycles that
      damage customer retention. The problem is not unique to HUMAN but shapes competitive
      dynamics with vendors that offer lower friction-profile detection.


      The detection arms race is intensifying. Automated traffic grew 23.51% year-over-year
      in 2025 while AI-driven traffic grew 187% in the same period per HUMAN's own benchmark
      data. BADBOX 2.0 emerged as a direct evolution of BADBOX 1.0 after HUMAN's original
      exposure—demonstrating that threat actors iterate quickly when disrupted. DoubleVerify
      detected 140% more CTV fraud scheme variants in Q1 2026 versus Q1 2025, driven by
      AI-assisted fraudster tooling. The threat is not static: agentic AI traffic grew 7,851%
      year-over-year and binary bot/human classification increasingly fails to address beneficial
      versus malicious AI agent traffic. Fraud signature drift means HUMAN's 400+ ML models
      must be continuously retrained, and regulatory fragmentation under 20 state privacy laws
      is now actively constraining data pipeline completeness, degrading model inputs.
    claimRefs:
