callouts:
  - calloutType: risk
    title: Bundled Platform Encroachment
    body: >
      Cloudflare (ranked #3 in Bot Management, mindshare 9.2%) and Google/Meta/Amazon
      native fraud detection are structurally positioned to absorb HUMAN's use cases through
      bundled pricing. Enterprises already running on these platforms face near-zero marginal
      cost to deploy built-in bot management, removing HUMAN's entry point. This is the
      primary long-duration revenue risk and the most likely scenario for thesis invalidation
      within a three-to-five year investment horizon.
    claimRefs:
      - CR023
      - CR024
      - CR031
      - CR037

  - calloutType: risk
    title: Arms Race Asymmetry
    body: >
      Automated traffic is growing eight times faster than human traffic; AI-driven traffic
      grew 187% in 2025 alone while DV detected 140% more CTV fraud scheme variants in
      Q1 2026. BADBOX 2.0 emerged as a direct adaptation of BADBOX 1.0, confirming that
      threat actors iterate faster when disrupted. HUMAN's 400+ ML models require continuous
      retraining under a regime of increasing evasion sophistication and regulatory data
      constraints. The arms race is structural and permanent—the question is whether HUMAN's
      cost of staying current grows faster than its revenue.
    claimRefs:
      - CR013
      - CR017
      - CR018
      - CR019
      - CR022
      - CR040

  - calloutType: recommendation
    title: Priority Diligence Asks Before Investment
    body: >
      Six diligence items are blocking without independent resolution: (1) audited ARR and
      NRR trend; (2) multi-cloud architecture documentation and DR test results; (3) cross-border
      data flow mapping confirming DSP compliance; (4) top-10 customer revenue concentration
      and renewal rates; (5) post-PerimeterX gross margin trend; and (6) AWS contractual
      terms including exit rights. Valuation entry above $1.5B cannot be justified without
      these disclosures.
    claimRefs:
      - CR033
      - CR034
      - CR039

