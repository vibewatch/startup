  - id: financing-valuation-context
    title: Financing Context and Valuation History
    body: >
      White Ops was acquired by Goldman Sachs Merchant Banking Division, ClearSky Security, and
      NightDragon in December 2020 for an undisclosed price. In January 2022, the resulting HUMAN
      Security entity raised a $100 million growth round led by WestCap and NightDragon, with
      Goldman Sachs Asset Management participating. In July 2022, the PerimeterX merger valued the
      combined entity at approximately $1.5 billion, at which point HUMAN also secured a $100 million
      debt facility from Blackstone Credit. The 2022 valuation was set during the elevated private-market
      multiple environment of 2021–2022, when private cybersecurity medians exceeded 15x ARR.


      In October 2024, HUMAN closed a $50 million-plus growth round led by WestCap with Goldman Sachs
      Asset Management, ClearSky Security, NightDragon, and Vertex Ventures US, bringing total equity
      raised to approximately $300 million. Critically, no new valuation was disclosed, and no new
      institutional investors joined the cap table—a pattern that may reflect deliberate access rationing
      by existing investors or an inability to attract external capital at a step-up price. Windsor Drake
      notes that companies raising at inflated 2021–2022 valuations often use "structured rounds" with
      preferred return features to maintain nominal face-value marks.


      The current status of the Blackstone Credit $100M debt facility (issued July 2022) has not been
      publicly confirmed as of June 2026. If the facility remains outstanding, it creates seniority ahead
      of equity, compressing equity returns in any scenario below $1.1B enterprise value. The total
      capital at risk ($300M equity + $100M debt = $400M) against a $1.5B EV implies 3.75x gross MOIC,
      adequate but not exceptional for a position held since 2020. Premier Alternatives lists HUMAN's
      current private valuation as "N/A" with no secondary market data available.
