      - View-Changing Evidence
    rows:
      - - Market
        - Bot/fraud/AI-agent security is non-discretionary and growing (Gartner $244.2B 2026 +13.3% YoY)
        - Platform consolidation by hyperscalers compresses standalone bot-management TAM
        - Measurable multi-year ARR CAGR and channel partner pipeline growth rates
      - - Product
        - Internet-scale detection network (20T interactions/week) with 400+ adaptive ML models creates data moat
        - Cloudflare, Akamai, and AWS amass comparable traffic telemetry at zero marginal cost for existing customers
        - Independent benchmark comparing HUMAN vs. Cloudflare Bot Management false-positive rates on identical traffic
      - - Customers
        - 500+ global brand customers; mission-critical deployment creates high switching costs
        - No disclosed NRR or gross revenue retention; customer concentration unknown
        - Audited NRR >115% and top-10 customer <5% ARR concentration
      - - Financials
        - Company-claimed ARR >$100M at <$350K ARR/FTE suggests moderate capital efficiency
        - GetLatka $15M ARR data point is unresolved; gross margin and burn rate undisclosed
        - Audited ARR, gross margin, NRR, and Blackstone Credit facility status
      - - Competition
        - Largest pure-play bot management platform; Forrester Wave Q2 2026 Leader designation
        - DV/IAS anchor ad-verification multiples at 1.9x revenue; CrowdStrike/Palo Alto encroaching
        - Sustained Forrester Leader position and documented displacement of DV/IAS customers
      - - Exit / Valuation
