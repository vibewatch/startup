  - id: recommendation-exit-readiness
    title: Recommendation, Exit Readiness, and Diligence Asks
    body: >
      Based on available public evidence, the recommendation is Track. HUMAN presents a credible
      cybersecurity platform story with internet-scale proof, strong institutional backing, and
      strategic positioning in high-growth threat categories (bot management, AI agent trust). The
      investment is neither obviously overpriced—the 2022 $1.5B valuation aligns with current
      application-security benchmarks at stated ARR—nor obviously attractive absent confirmation of
      core operating metrics. Confidence is medium because material diligence gaps (NRR, gross margin,
      ARR growth, debt status, cap table preferences) cannot be closed from public sources.


      Exit readiness is partial. HUMAN is not named in any confirmed 2026 cybersecurity IPO pipeline.
      The company would need to close the financial disclosure gap with audited metrics, demonstrate
      a clear Rule of 40 score, and position the agentic AI product line as a growth driver before
      an IPO narrative would hold in the current selective public market. Strategic M&A is the more
      likely near-term path. Acquirers with strategic fit include CrowdStrike (identity + bot
      management integration with Falcon), Palo Alto Networks (platformization of anti-fraud across
      SASE + XSIAM), and Cloudflare (extending from CDN/WAF into full-stack bot and AI agent
      governance). Google (post-Wiz) and ServiceNow (post-Armis) are less likely but financially
      capable. A financial sponsor take-private is possible if MOIC at current multiples clears a
      3.5x threshold on a 2027–2030 hold.


      Thesis-break triggers are defined as observable events that would require a full thesis revision,
      not just scenario adjustment. These include: an audited ARR disclosure below $80 million;
      confirmation of NRR below 95%; a down-round valuation below $1.0B; loss of a top-5 customer
      accounting for >15% of ARR; or regulatory action targeting core ad-verification workflows.
      The final diligence priority list (TV006) identifies six asks that would materially change the
      conviction level of this assessment.
