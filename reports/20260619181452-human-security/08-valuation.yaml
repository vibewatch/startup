chapter:
  number: 8
  title: Valuation
  summary: >
    HUMAN Security's last disclosed valuation of $1.5 billion (July 2022, PerimeterX merger) appears
    broadly supportable at current application-security-niche benchmarks (13.0x median, 15.4x average,
    Finro Q2 2026) applied to the company-claimed $100M+ ARR, but material diligence gaps—undisclosed
    NRR, gross margin, ARR growth rate, and Blackstone Credit facility status—prevent a conviction
    recommendation. The October 2024 $50M+ growth round drew exclusively existing investors with no
    disclosed valuation step-up, raising entry-discipline questions. A base-case range of $1.2–$1.5B
    implies flat-to-modest returns on the 2022 mark; a bull case of $2.0–$2.6B depends on AI-native
    premium recognition and ARR growth to $130M+. Recommendation is Track pending material diligence.

sections:
  - id: investment-thesis-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      HUMAN Security's investment thesis rests on five interlocking pillars. First, market necessity:
      bot-driven fraud, invalid traffic, credential abuse, and agentic-AI threats are non-discretionary
      security problems that expand as the digital economy grows; Gartner forecasts global information
      security spending of $244.2 billion in 2026, up 13.3% year-over-year, with cloud security growing
      28.8%. Second, platform scale moat: verifying 20 trillion digital interactions weekly across
      3 billion unique devices creates a data network effect that smaller competitors (Arkose Labs at
      $46.9M ARR, DataDome, Netacea) cannot replicate without equivalent infrastructure and threat-intel
      investment. Third, agentic-AI positioning: the July 2025 launch of HUMAN Sightline and AgenticTrust
      places the company directly in the highest-multiple cybersecurity niche (AI security, $2B in
      financing deployed YTD 2026 per Momentum Cyber). Fourth, investor conviction: five institutional
      backers—Goldman Sachs Merchant Banking, WestCap, NightDragon, ClearSky, Vertex—have consistently
      re-invested across multiple rounds through 2024. Fifth, platformization tailwind: strategic buyers
      drove 92% of cybersecurity M&A by value in 2026, and HUMAN's cross-layer platform (media security,
      application security, account protection, agentic trust) fits the buyer consolidation thesis.


      The anti-thesis is equally substantive. First, financial opacity: HUMAN discloses no NRR, gross
      margin, or ARR growth rate. The single available third-party ARR estimate (GetLatka, $15M as of
      December 2023) is an order of magnitude below the company-claimed $100M+ and remains unresolved.
      Second, capital overhang: approximately $300M in equity plus a $100M Blackstone Credit facility
      creates a $400M total capital base against which a $1.3–1.5B EV implies only a 3.25–3.75x gross
      MOIC on invested capital before dilution and liquidation preferences. Third, sector discount risk:
      HUMAN's ad-verification revenue stream (historically its primary business) benchmarks to DV/IAS
      multiples of 1.9x revenue—a fraction of the 15x cybersecurity peers' multiple—and buyers may
      apply a blended discount. Fourth, existing-investor concentration: the October 2024 round drew no
      new institutional names, which could indicate a restricted pricing ceiling. Fifth, consolidation
      threat: Cloudflare, CrowdStrike, and Palo Alto are all investing heavily in bot management and
      fraud prevention capability that could erode HUMAN's standalone premium.
