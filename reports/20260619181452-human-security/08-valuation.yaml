  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: net-revenue-retention
      missingEvidence: >
        Audited or management-disclosed NRR by customer cohort for the past two years. This is the
        single most important SaaS quality metric and is entirely absent from all public sources.
      whyItMatters: >
        NRR between 95% and 120% implies a 30–50% difference in applicable valuation multiple per
        Acquiry 2026 benchmarks. Without NRR, the $640M–$2.8B scenario range cannot be narrowed
        to a conviction range sufficient for a Buy recommendation.
      diligencePath: >
        Request from management in a formal data room; triangulate with customer reference calls and
        indirect churn proxies (customer count growth vs. ARR growth rate comparison).
      relatedQuestionRefs:
        - QV022
        - QV032

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >
        Gross margin by product pillar (media security, application security, account protection, and
        agentic AI) and blended gross margin from audited financial statements.
      whyItMatters: >
        Gross margin below 70% would reclassify HUMAN from pure-SaaS (8–15x) to tech-enabled-services
        (3–5x revenue) per Windsor Drake benchmarks, compressing the base-case EV by $500M–$800M.
      diligencePath: >
        Audited financial statements in a formal data room; infrastructure cost analysis via cloud
        spend disclosures and headcount allocation across cost-of-revenue versus R&D.
      relatedQuestionRefs:
        - QV022
        - QV032

    - type: private-evidence-only
      severity: material
      topic: arr-growth-rate
      missingEvidence: >
        Year-over-year ARR growth from the $100M milestone (July 2022) through mid-2026; segmented
        by product pillar to assess which growth vectors are driving vs. dragging.
      whyItMatters: >
        A four-year growth rate below 10% CAGR would suggest the platform is ex-growth and applicable
        only to a traditional SaaS multiple (3–5x); above 20% supports the cybersecurity premium (13–15x).
      diligencePath: >
        Management accounts and CFO interview; cross-check against headcount growth as a proxy.
      relatedQuestionRefs:
        - QV022
        - QV028

    - type: private-evidence-only
      severity: material
      topic: blackstone-credit-status
      missingEvidence: >
        Current outstanding balance, maturity date, interest rate, and covenant terms of the $100M
        Blackstone Credit facility originated in July 2022.
      whyItMatters: >
        If the full $100M is outstanding, it is senior to all equity in a liquidation event; seniority
        compresses equity recovery in bear-case scenarios below $1.1B EV to near zero.
      diligencePath: >
        Legal and financial data room; publicly filed UCC-1 liens if any; creditor agreement in
        transaction documents from the PerimeterX merger.
      relatedQuestionRefs:
        - QV014

    - type: conflicting-data
      severity: material
      topic: arr-conflicting-estimates
      missingEvidence: >
        Independent or audited ARR corroboration to resolve the conflict between the company-claimed
        $100M+ ARR and GetLatka's $15M estimate (December 2023).
      whyItMatters: >
        If GetLatka's figure is accurate, the 2022 $1.5B valuation is a 100x ARR multiple — extreme
        even for top cybersecurity — and the entire base-case thesis collapses. The conflict is the
        primary source of uncertainty in all scenario ranges and renders TV004 comparable multiples
        inapplicable until the ARR base is confirmed.
      diligencePath: >
        Audited revenue statement; independent ARR corroboration via enterprise customer surveys
        and competitive intelligence on estimated contract sizes.
      relatedTableRefs:
        - TV004
      relatedQuestionRefs:
        - QV001
        - QV009

    - type: private-evidence-only
      severity: material
      topic: cap-table-preferences
      missingEvidence: >
        Full capitalization table with share classes, liquidation preferences, participation rights,
        anti-dilution provisions, and waterfall analysis at exit scenarios from $800M to $2.5B EV.
      whyItMatters: >
        Structured rounds with participating preferred could reduce effective common-equity MOIC
        to near zero in base and bear scenarios even with a nominal $1.5B exit valuation.
      diligencePath: >
        Legal data room; investor rights agreements; capitalization summary certificate from corporate
        counsel; waterfall model with CFO input.
      relatedQuestionRefs:
        - QV020
        - QV032

