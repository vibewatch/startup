  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR disclosure below floor
        - Audited ARR <$80M
        - Invalidates cybersecurity-premium multiple basis; implies valuation is 2–3x current bear-case EV
        - Immediate exit or deep discount reassessment; thesis collapses
      - - Net revenue retention below retention floor
        - Audited NRR <95%
        - Signals negative land-and-expand; customer cohort deteriorating; multiple compression to 6–8x
        - Reassess as services-adjacent rather than SaaS; require evidence of retention fix before next round
      - - Down-round financing event
        - New equity round at valuation <$1.0B
        - Confirmed overhang from $400M+ invested; signals internal consensus on distressed value
        - Reassess hold position; potential liquidation preference dislocation
      - - Platform vendor product displacement
        - Confirmed HUMAN customer loss >15% ARR to Cloudflare, CrowdStrike, or Palo Alto in a single fiscal year
        - Structural erosion of the independent bot-management market; strategic buyer pool shrinks
        - Downgrade to avoid; market share data confirms commoditization risk
      - - Regulatory or legal adverse action
        - Enforcement action, material litigation outcome, or GDPR/CCPA violation affecting core product
        - Revenue at risk from affected geography; potential customer churn; legal overhang raises discount rate
        - Place thesis on hold pending legal outcome; evaluate geography-specific customer concentration
    notes: >
      Kill triggers represent observable events requiring full thesis revision, not scenario adjustments.
      Thresholds are set at levels where the base-case valuation range becomes unsustainable. All triggers
      are testable against public disclosures or management communications in a future diligence cycle.
    claimRefs:
      - CV009
      - CV034
      - CV036
      - CV045
      - CV047

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Net Revenue Retention
        - "Audited or management-confirmed NRR by cohort year (target: current + 2 prior years)"
        - NRR is the single most important SaaS quality metric; determines whether multiple expansion or compression applies; gap between 95% and 120% NRR implies 30–50% valuation difference
        - Management disclosure in data room; cross-check against customer reference calls
      - - Gross Margin by Product
        - Gross margin by revenue pillar (media security, application security, account protection, agentic AI)
        - Satori team and ML infrastructure costs may compress blended margin below 70%; determines whether HUMAN is valued as pure SaaS (8–15x) or tech-enabled services (3–5x)
        - Audited financial statements; CFO interview; infrastructure cost benchmarking
      - - ARR Growth Rate and Bridge
        - Year-over-year ARR growth from January 2022 ($100M claimed) to present, segmented by product line
        - Four-year growth rate determines whether the platform is in acceleration or deceleration; breaks the $1.52B vs. $640M valuation divergence
        - CFO interview; management accounts; cross-check with headcount/spend growth proxy
      - - Blackstone Credit Facility Status
        - Current balance, maturity, interest rate, and covenant structure of the $100M debt facility
        - Seniority ahead of equity affects equity upside in scenarios below $1.5B EV; covenant violations could force premature exit
        - Legal and accounting data room review; publicly available debt registration filings if any
      - - Cap Table and Preference Stack
        - Full capitalization table showing share classes, liquidation preferences, participation rights, and anti-dilution provisions
        - $300M equity across 8 rounds at varying prices may have created participating preferred structures that materially reduce common equity value in sub-$2B exit scenarios
        - Legal data room; investor rights agreements; capitalization summary certificate
      - - Customer Concentration
        - Top-10 customer revenue contribution as a percentage of ARR; names of top-3 or anonymized revenue bands
        - Bot management revenue is often concentrated among digital-media and e-commerce leaders; single-customer risk >10% ARR is a material thesis modifier
        - CFO interview; contract abstracts; cross-reference with disclosed 500+ brand claim
    notes: >
      Priority order reflects financial-materiality weighting: NRR and gross margin are immediate
      valuation determinants; ARR growth and Blackstone facility status are near-term thesis validators;
      cap table and concentration are deal-structuring inputs. All six items are required to progress
      from Track to Buy in a subsequent diligence cycle.
