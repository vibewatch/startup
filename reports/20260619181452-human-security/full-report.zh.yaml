  - id: TV005
    title: 论点破裂与否决触发因素
    columns:
      - 触发因素
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 披露低于底线
        - 经审计 ARR <$80M
        - 推翻网络安全溢价倍数基础；意味着估值只有当前熊市 EV 的 2–3x
        - 立即退出或按深度折价重新评估；论点坍塌
      - - 净收入留存低于留存底线
        - 经审计 NRR <95%
        - 显示 land-and-expand 为负；客户 cohort 恶化；倍数压缩至 6–8x
        - 重新按类服务业务而非 SaaS 评估；下一轮前要求看到留存修复证据
      - - 下轮估值下调融资事件
        - 新股权轮估值 <$1.0B
        - 确认 $400M+ 已投资本形成压力；显示内部对困境价值达成共识
        - 重新评估持有仓位；可能出现清算优先权错位
      - - 平台厂商产品替代
        - 单一财年内确认 HUMAN 客户向 Cloudflare、CrowdStrike 或 Palo Alto 流失 >15% ARR
        - 独立 bot 管理市场结构性侵蚀；战略买方池收缩
        - 下调至规避；市场份额数据确认商品化风险
      - - 监管或法律不利行动
        - 执法行动、重大诉讼结果，或影响核心产品的 GDPR / CCPA 违规
        - 受影响地区收入承压；客户可能流失；法律悬而未决推高折现率
        - 暂停论点，等待法律结果；评估具体地区客户集中度
    notes: |
      否决触发因素是需要完整修订论点的可观察事件，不是场景调整。阈值设在基准估值区间无法维持的水平。 所有触发因素都可在未来尽调周期中用公开披露或管理层沟通检验。
    claimRefs:
      - CV009
      - CV034
      - CV036
      - CV045
      - CV047
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 净收入留存
        - 按 cohort 年份划分的经审计或管理层确认 NRR（目标：当前年份 + 前 2 年）
        - NRR 是最重要的 SaaS 质量指标；决定适用倍数扩张还是压缩；95% 与 120% NRR 之间意味着 30–50% 的估值差异
        - 数据室中的管理层披露；与客户访谈交叉核验
      - - 按产品划分毛利率
        - 按收入支柱划分的毛利率（媒体安全、应用安全、账户保护、agentic AI）
        - Satori 团队和 ML 基础设施成本可能把混合毛利率压到 70% 以下；决定 HUMAN 按纯 SaaS（8–15x） 还是技术赋能服务（3–5x）估值
        - 经审计财务报表；CFO 访谈；基础设施成本基准
      - - ARR 增长率与桥接
        - 从 2022 年 1 月（公司称 $100M）到当前的同比 ARR 增长，按产品线拆分
        - 四年增长率决定平台是在加速还是减速；打破 $1.52B 与 $640M 的估值分歧
        - CFO 访谈；管理账；与员工数 / 支出增长代理指标交叉核验
      - - Blackstone Credit Facility 状态
        - $100M 债务融资的当前余额、到期日、利率和 covenant 结构
        - 在低于 $1.5B EV 的场景中，优先于股权的偿付顺位会影响股权上行；违反 covenant 可能迫使提前退出
        - 法务和会计数据室审阅；如有，查阅公开债务登记文件
      - - 股本表与优先权堆栈
        - 完整资本化表，列明股份类别、清算优先权、参与权和反稀释条款
        - 8 轮、不同价格的 $300M 股权融资可能形成参与型优先股结构，在低于 $2B 的退出场景中显著削减普通股价值
        - 法务数据室；投资者权利协议；资本化摘要证书
      - - 客户集中度
        - 前 10 大客户收入占 ARR 比例；前 3 大客户名称或匿名化收入区间
        - Bot 管理收入往往集中在数字媒体和电商龙头；单一客户风险 >10% ARR 是重大论点修正因素
        - CFO 访谈；合同摘要；与已披露的 500+ 品牌说法交叉引用
    notes: |
      优先级按财务重要性排序：NRR 和毛利率是即时估值决定因素；ARR 增长和 Blackstone 融资状态是近期论点验证项； 股本表和集中度是交易结构输入。六项全部拿到后，后续尽调周期才可从 Track 推进到 Buy。
    claimRefs:
      - CV007
      - CV009
      - CV036
      - CV045
