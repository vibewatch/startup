      - number: '2.5'
        title: 规模缺口、矛盾估算与尽调问题
        blocks:
          - type: paragraph
            body: >
              三个结构性缺口阻止市场规模被明确建立。第一，HUMAN Security 不披露收入、ARR 或客户数，自下而上的 SOM 估算完全依赖 Forrester Wave 排名、G2
              位置和网络规模等推断指标。第二，分析师群体尚未独立测算“agent trust management”子市场——Forrester 直到 2025 年才更名该类别，2026
              年该细分还没有共识市场预测。第三，分析师报告引用的 $1.12B–$88.77B 市场估算区间，反映的是边界不一致，而非基本面真正分歧：$88.77B eCommerce FDP 估算包括 HUMAN
              不覆盖的支付欺诈、拒付、KYC/KYB 和身份核验，而 $1.27B bot security 估算排除了 SIVT 供应商收入。两者都不能干净映射到 HUMAN 的实际产品范围。

              值得保留的矛盾规模证据：Grand View Research 的 $40.4B 欺诈检测市场暗示 HUMAN 的市场比仅机器人安全口径大 30-40 倍——这一差异源于范围而非错误。wmtips.com 把
              Cloudflare 在机器人管理中接近 80% 的安装份额作为证据，说明 HUMAN 和其他专用供应商是在 Cloudflare 主导市场中的利基切块内竞争；在已由 Cloudflare
              覆盖的市场中，这会把有效 SAM 压到远低于 $1.27B。抽样的市场研究报告均未体现这一约束，是公开分析中的重大缺口。任何财务模型都应在保守底线情景中，对 Cloudflare 已服务客户给 SAM 打
              20–40% 折扣。

              尽调问题：（1）要求 HUMAN 提供 ARR、NRR 和客户 cohort 数据，以验证 SOM 假设。（2）量化 HUMAN 目标买方细分中的 Cloudflare 渗透率，以测算剩余可服务空间。（3）获取
              MRC 认证 SIVT 供应商市场的独立规模测算。（4）确认智能体信任管理细分是否正走向独立预算线，还是仍只是现有机器人管理合同中的功能扩展。
