      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              HUMAN 的买方版图按产品线和底层待完成任务分层。机器人缓解和 ATO 防御（Bot Defender + Sightline）的主要买方，是电商、旅游和金融服务公司的应用安全工程师与欺诈运营团队。预算通常落在
              IT Security 或 Risk/Compliance，由 CISO 或 CTO 拥有。采用触发点包括遭遇入侵事件、发现结账欺诈或抓取攻击，或者库存抓取带来的竞争情报威胁。HUMAN 自己的 2026
              年基准报告发现，零售和电商在抓取（占所有观测攻击 70%）、盗刷测试和 ATO 尝试方面均居各垂直行业之首，有超过 440,000 个独特威胁画像瞄准该行业——是第二高垂直行业的四倍以上。

              广告欺诈/SIVT 防御（MediaGuard/Ad Integrity Suite）的买方画像转向广告主、代理商、DSP、SSP 和出版商中的广告运营负责人、首席媒体官和程序化交易团队。预算所有权转到营销
              P&L。采用往往由合规驱动：展示计数需要 MRC 认证、供应链参与者需要 TAG 认证，或代理控股集团标准要求独立 IVT 测量。HUMAN 2026 年对竞价前 Ad Fraud Defense 和投放后 Ad
              Fraud Sensor 平台在桌面、移动和 CTV 范围内再次获得 MRC 认证，强化了其在该细分市场作为认证供应商的地位。

              第三个新兴细分是智能体 AI 信任管理（AgenticTrust/Sightline）。买方是在大规模部署或接收 AI 智能体流量的公司中的平台架构师、信任与安全负责人，以及“agentic
              commerce”产品负责人。这个买方更新，预算尚未完全分配；类别本身也直到 2025 年才被 Forrester 更名为“Bot and Agent Trust Management
              Software”以反映这一转变。HUMAN 支持 Amazon AWS Bedrock AgentCore 浏览器验证，显示该细分市场采用合作伙伴驱动的
              GTM。这里的付款方可能是安全与平台工程的合并预算，而非传统 CISO 所有者。

              EXTE 2026 年 3 月集成 HUMAN 的 MediaGuard，说明了合作伙伴/平台买方模式：一家程序化广告公司把 HUMAN 方案整合为供应质量层——付款方是平台，用户是下游广告主。Gartner
              称，全球网络安全预算 2026 年将升至 $240 billion（同比 +12.5%），其中 40% 的企业安全预算投向 HUMAN 所竞争的软件和平台。
