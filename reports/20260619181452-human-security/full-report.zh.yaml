  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价模型
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 围绕 Human Defense Platform 运营纯订阅 SaaS 模式，平台把三条商业支柱合在一起：广告保护、应用安全与 bot
              缓解、账户保护。收入来自年度企业合同，定价看流量规模、受保护资产数量（web、移动端、API 端点）以及客户选择的具体模块组合。公司没有公开价目表；所有企业定价均为定制谈判。平台有四条可验证收入流：（1）广告 /
              媒体安全（竞价前后欺诈、点击欺诈，以及通过 clean.io 收购获得的恶意广告防御）；（2）应用安全与 bot 缓解（原 BotGuard 和 PerimeterX
              技术栈）；（3）账户保护（撞库、虚假账户创建）；（4）2025 年 7 月推出、带 AgenticTrust 的 HUMAN Sightline，把 AI agent 信任和 agentic commerce
              保护作为新兴第四条收入流。Vendr 给出的企业年支出中位数为每年 $104,906，披露区间从 $46,601 到大型复杂部署超过 $1.34
              million。因此，官方定价只能作为标价下限代理，不能代表已披露的实际收入。欺诈防护具备任务关键属性，平台集成又很深、切换成本高，收入质量预期较高；但各细分领域的具体 ARR 组合没有公开。
