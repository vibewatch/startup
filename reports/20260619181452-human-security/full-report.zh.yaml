      - number: '4.4'
        title: 公开财务牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 是私营公司，披露的财务数据很少。主要公开牵引信号包括：（1）公司声称 ARR 超过 $100M，这一点最早在 2022 年 7 月 HUMAN+PerimeterX 合并实体宣布
              ARR 超过 $100M 时得到确认，并在 2024 年 1 月 CEO 交接公告中再次提及，公告将该里程碑归功于 Tamer Hassan 任内；（2）截至 2024 年 10 月服务 500+
              全球品牌，多份新闻稿可相互印证；（3）平台规模达到每周验证 20 万亿次数字交互，2025 年年化超过 1 千万亿次。有一个直接冲突的第三方数据点：GetLatka 报告 HUMAN 截至 2023 年 12 月
              ARR 为 $15 million。该数字与合并实体规模、员工数（2024 年中 437+ 人）以及合并后的 ARR 披露不一致。GrowJo 基于模型估算的年收入
