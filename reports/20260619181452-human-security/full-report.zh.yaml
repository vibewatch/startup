      - number: '2.2'
        title: 市场规模：从多重视角看 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              HUMAN 所服务市场的规模测算需要合并多个分析师类别，因为没有单一公开报告与其产品边界完全匹配。Business Research Company 估算，机器人缓解市场 2025 年为 $0.9
              billion，2026 年以 24.8% CAGR 增至 $1.12 billion；Fortune Business Insights 则把稍宽的“bot security”类别估为 2025 年 $1.05
              billion、2026 年 $1.27 billion，CAGR 为 20.55%。两项估算到 2030-2034 年均达到 $2.4–$5.67 billion。MarkWide Research
              的离群估算把更宽的“bot mitigation”市场定在 2026 年 $3.8 billion，范围更大，可能包含相邻 WAF/CDN 安全支出。

              广告欺诈方面，Fraudlogix 在 2025 年 105.7 billion 次展示中测得全球 IVT 率为 20.64%；按美国特定的 23.69% 率计算，意味着美国程序化广告支出每年约 $37
              billion 暴露于无效流量。这是潜在欺诈损失，不是供应商市场规模；SIVT 缓解供应商收入只是欺诈暴露额的一小部分。Pixalate 的 Q1 2026 基准确认，美国桌面 IVT 率为 24%、移动应用为
              32%、CTV 为 24%——这些比例强化了市场对认证 SIVT 供应商的持续需求。

              账户接管保护方面，Global Growth Insights 估算 2026 年独立市场规模为 $7.46 billion，CAGR 为 18.89%。eCommerce FDP 大市场预计 2026 年为
              $88.77 billion（BFSC），全垂直欺诈检测市场为 $40.4 billion（Grand View Research），但这些都包括 HUMAN 不直接服务的支付欺诈、KYC/KYB、AML
              和身份核验，因此高估了相关 TAM。

              分析师综合后的 HUMAN SAM 约为 2026 年 $1.5–$2.0 billion，构成为机器人安全（$1.27B）加 MRC 认证 SIVT 供应商支出（估计 $500M–$800M，按全球 $836B
              数字广告支出中广告主用于验证工具的比例推导）。SMB/中端市场受到 Cloudflare 捆绑压缩。2026 年 SOM 估算为 $150–$300 million，与 HUMAN 的 Forrester
              Wave 领导者位置、万亿级交互网络规模和对受限 SAM 10–20% 的现实渗透率相符，但因为 HUMAN 不披露收入，该估算没有独立验证。
