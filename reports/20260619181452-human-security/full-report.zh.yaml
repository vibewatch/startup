  - id: FM001
    title: 市场规模金字塔：HUMAN Security 的 TAM、SAM 与 SOM（2026）
    type: pyramid
    layout: standard
    summary: |
      三层市场金字塔展示从广义欺诈防护 TAM，到 HUMAN 估算可服务市场（SAM）和 2026 年现实可达份额（SOM）的范围。
    data:
      items:
        - label: TAM – 广义数字欺诈防护（所有边界）
          value: 40.4
          unit: $B (2026)
          note: GVR 欺诈检测与防护市场；包括 AML、KYC、支付欺诈——边界最膨胀的锚点。 仅 bot TAM 为 $1.12-1.27B。
        - label: SAM – Bot Security + MRC 认证 SIVT 验证
          value: 1.75
          unit: $B (2026, estimated)
          note: 分析师综合：$1.27B bot 安全（Fortune BI）加约 $500M 估算 SIVT 厂商市场； Cloudflare 捆绑前的折减
        - label: SOM – HUMAN 现实可触达（2026）
          value: 0.22
          unit: $B (2026, estimated)
          note: 基于 Forrester Wave 领导地位、网络规模和 quadrillion 级交互量，估计为 SAM 的 12–15%； 收入未披露
