      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议 — 跟踪
            body: >
              HUMAN Security 是可信的网络安全平台，具备互联网规模验证、机构背书，并站在最高增长安全类别（bot management、agentic AI trust）上。2022 年 $1.5 billion
              估值按所称 ARR 大致符合应用安全基准。但在 NRR、毛利率、ARR 增速和 Blackstone
              债务状态没有披露之前，确信度不足以支持买入建议。建议跟踪，并在六项优先尽调问题（TV006）中任何一项解决后重新评估。
            calloutType: recommendation
            claimRefs:
              - CV009
