      - number: '5.3'
        title: Satori Threat Intelligence — 研究与打击行动
        blocks:
          - type: paragraph
            body: >-
              Satori Threat Intelligence and Research Team 是 HUMAN 的内部威胁研究单元，运营上由 Lindsay Kaye（Vice President of Threat
              Intelligence）领导，并由 Gavin Reid（CISO）监督。Satori
              的职责不止于被动检测：团队调查、逆向，并组织针对大规模威胁行为者计划的协同打击行动。这种主动姿态——公开披露打击行动，拆除犯罪基础设施，而不只是阻断流量——是 HUMAN 在 Forrester Wave Q2
              2026 获得高分时被提到的主要差异化；HUMAN 是 Threat Research 标准中唯一拿到满分 5/5 的厂商。


              历史打击行动包括：3ve（与 FBI、Google、Facebook 合作拆解的大规模 CPC 欺诈计划）、Methbot（最终使运营者获刑 10 年）、PARETO（当时识别出的最复杂 CTV botnet，与
              Roku 和 Google 合作打击）、Scylla（瞄准 Google Play 和 Apple App Store 上的广告 SDK）、BADBOX 2.0、SlopAds 和
              Pushpaganda。最近一次重大行动是 2026 年 5 月 19 日披露的 Trapdoor：一个多阶段计划，在 455 个恶意 Android app 和 183 个威胁行为者自有 HTML5
              域名中，把恶意广告分发与隐藏广告欺诈变现融合起来。高峰期 Trapdoor 每天产生 4.8 亿次 bid requests；Google Play 移除已识别 app 前，相关 app 下载量超过 2,400
              万次。


              这些行动沉淀出的情报会增强 Decision Engine 的 ML
              模型，并通过私营部门和公共部门合作共享，包括执法机构、应用商店运营方和云服务商。现场研究与产品防护之间的反馈回路，构成纯检测厂商难以复制的技术护城河。Satori 还提供实时事件覆盖——2026 年 2 月
              Super Bowl LX 期间，HUMAN 追踪到 7,400 万次被阻断的零售抓取攻击、无效 bid requests 上升 33%，以及 AI agent 活动增加 5%。
