    title: 企业采用漏斗：Bot 与 Agent 信任管理软件
    type: funnel
    layout: standard
    summary: |
      企业买方评估 HUMAN Security 的五阶段采用漏斗，从初始认知到扩张增购，展示每一阶段的转化流失和切换摩擦。
    data:
      items:
        - label: 认知：Bot / 欺诈事件、分析师报告或同行推荐
          value: 100
          note: 入口点；由 Forrester Wave、G2 grid 或安全事件触发
        - label: 评估：PoC / RFP（与 Cloudflare、Akamai、DataDome 竞争）
          value: 55
          note: 流失点：捆绑的 CDN / WAF 替代方案在 RFP 前赢走 SMB / 中端市场；HUMAN 在需要 MRC 认证或信号深度的企业中推进
        - label: 合同谈判：定制报价接洽
          value: 28
