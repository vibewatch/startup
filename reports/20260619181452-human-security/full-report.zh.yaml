      - number: '1.2'
        title: 创始人、领导层、董事会与关键人风险
        blocks:
          - type: paragraph
            body: >
              HUMAN 由四人创立：Tamer Hassan（CEO 任至 2024 年 1 月，现任执行董事长）、Michael Tiffany、Dan Kaminsky 和 Ash Kalb。Hassan
              是公司前十二年最主要的公开面孔，2019 年被 Fast Company 评为商业领域最具创造力人物第一名。他主导了 White Ops 更名、与 PerimeterX 合并、收购 clean.io，以及公司
              ARR 突破 $100M。2024 年 1 月，Hassan 转任董事会成员和执行董事长，仍积极参与战略、客户关系和公共政策倡导。因此，联合创始人网络仍部分保留：Hassan 保有治理角色，而截至 2026 年
              6 月研究日，另外三位创始成员未在公开资料中列为现任高管。


              2024 年 1 月，曾任 Recorded Future（全球最大的威胁情报提供商）总裁的 Stu Solomon 出任 CEO。Solomon 拥有 Optiv（包括 CTO 任职）、iSight
              Partners（后被 FireEye 收购）和 Bank of America 的高管及 C-suite 经验，还在 Delaware Air National Guard 和 United States
              Air Force 服役超过 25 年。HUMAN 当前高管团队还包括 Isaac Itenberg（首席运营官兼首席财务官）、Gavin Reid（首席信息安全官）和 Christos
              Kalantzis（首席技术官）。截至 2026 年研究日，董事会包括来自 Goldman Sachs（Anthony Arnold）、NightDragon（Dave DeWalt）、WestCap（Kevin
              Marcus）和 ClearSky（Jay Leek）的董事，以及 Tamer Hassan（执行董事长）和因 PerimeterX 合并加入董事会的 Ido Safruti。对公开记录和公司公告的检索未发现
              Matt Cantor 出现在 HUMAN Security 当前或近期领导层、高管团队或董事会中。


              Hassan 向 Solomon 交接 CEO 后，关键人风险有所改善，战略执行分散到一支外部经验更丰富的管理团队。但董事会仍以投资人代表为主（Goldman
              Sachs、NightDragon、WestCap、ClearSky），公司威胁情报身份和客户关系仍通过 Hassan 的执行董事长角色带有一定创始人印记。董事会还列出八名观察员（Ryan
              Benevides、Dan Burns、Itzhak Fisher、Steve Fredrick、Rhys Gordon、Hannah Huffman、Lance Matthews、Alexander
              Weiss），其所属机构和控制权意义未在当前来源集中公开披露。完整董事会构成和治理条款仍是尽调缺口。
