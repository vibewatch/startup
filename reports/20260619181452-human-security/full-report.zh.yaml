      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              最强的单一增长驱动，是自动化和智能体流量爆发。HUMAN 自己的 2026 年基准报告发现，自动化流量同比增长 23.51%，而人类流量仅增长 3.10%——比例约为 8:1。AI 驱动流量 2025 年激增
              187%，来自智能体和浏览器的智能体 AI 流量同比增长 7,851%。Forrester 2025 年更名为“Bot and Agent Trust Management
              Software”的类别，反映可服务问题的结构性扩张：仅把流量分为人类或机器人已不够，组织还必须治理 AI 智能体能否可信地代表用户交易。这个扩张在传统机器人缓解之上创造了新的 TAM
              层，目前没有既有主导者；HUMAN 的 AgenticTrust 模块正是为这一缺口设计。

              第二个驱动是监管和合规压力。TAG 2026 年向 196 家公司授予 307 个认证印章，其中 74% 经独立审计——说明广告行业合规正在从自我声明继续收紧。MRC 对 SIVT
              检测的认证，越来越成为参与程序化平台的前提。PSD2（金融服务）、NIST CIAM 指引，以及新兴 EU AI Act 中有关自主系统问责的条款，正在受监管垂直行业中为机器人和智能体信任管理创造非可选预算线。

              HUMAN 客户群中的 ATO 攻击在 2024 至 2025 年间增长四倍（每客户每年平均 400,000+ 次登录后攻陷尝试），推动现有客户内的增购和交叉销售机会。2026 年广告欺诈损失超过 $100
              billion，IVT 率超过 20%，让广告主持续急于获得经验证的流量。

              主要约束是竞争性捆绑：Cloudflare 通过集成 CDN、WAF 和机器人管理，以年费低于 $400 起的平价套餐，掌握约 79% 的机器人管理安装份额（Akamai 为 6%）。这套组合在 SMB
              和低端中端市场替代专用机器人防御供应商。DataDome 的市场份额 2025 至 2026 年从 13.8% 降至 8.9%，可能反映了这种捆绑压力。第二个约束是 ROI
              证明：机器人缓解节省体现为“避免的欺诈损失”而非收入——在 P&L 中不可见，需要复杂测量框架才能向非技术利益相关方证明预算合理。第三个约束是切换摩擦：企业机器人管理深度嵌入登录流程、结账 API
              和分析管线；迁移风险抑制从现有供应商切换，放慢新客户获取。大型平台只要工程能力充足，自建仍是可行替代，这进一步限制 HUMAN 的净可服务市场。
