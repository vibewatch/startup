          - type: callout
            title: 隐私与合规披露落后于企业标准
            body: >-
              HUMAN 在每年 1 千万亿次交互中采集行为和设备数据。规模如此之大，公司却没有公开独立 SOC 2 Type II 审计报告、GDPR 合规认证或详细数据保留政策。对 GDPR
              范围司法辖区或监管行业客户而言，这一披露缺口既是采购摩擦点，也可能在信号采集做法遭质疑时带来潜在法律风险。
