      - number: '7.5'
        title: 缓释因素、论点失效触发项与尽调问题
        blocks:
          - type: paragraph
            body: >
              HUMAN 的主要缓释因素是结构性的：Satori 威胁情报护城河来自每年监测一千万亿次以上交互，形成了真实的检测优势，点状竞争者无法复制。MRC 认证（2026 年 4
              月取得）为媒体买家信任提供锚点。公私协作处置模式——FBI、Google、Shadowserver、Trend Micro 在 BADBOX 1.0 和 2.0 上协作——说明 HUMAN
              以打包厂商没有的方式嵌在威胁响应生态里。2024 年 $50M 增长轮以及 Goldman、WestCap、NightDragon 等投资人的延续，降低了近期流动性风险。2024 年 8 月推出的 HUMAN
              Advantage Partner Program，让客户获取不再只依赖漫长直销周期。


              论点失效触发项集中在三处。第一是平台打包吸收：如果 Cloudflare、Google 或 AWS 通过收购或模型改进，实质性缩小行为信号差距，HUMAN
              对大多数已经跑在这些平台上的客户就会失去定价溢价。第二是高峰流量期出现重大云宕机：AWS US-EAST-1 仍是 HUMAN 最可能的运营单点故障；如果 Super Bowl、Prime Day
              等高价值媒体事件期间发生数小时宕机，会立即带来合同和声誉风险。第三是隐私执法行动：如果州总检察长或 FTC 行动把 HUMAN 的行为信号网络重新归入数据经纪框架，或者引用 DSP 前提的新型 Wiretap
              Act 集体诉讼将 HUMAN 列为被告，合规成本和客户信任都可能受到实质损害。


              优先尽调问题：独立确认 ARR 并对标 NRR；获取多云韧性架构文件；绘制数据流以确认跨境传输的 DSP 合规；前 10 大客户收入集中度；PerimeterX 整合后的毛利率趋势；以及 AWS
              合同条款，包括任何最低承诺和退出选项。鉴于估值不透明，任何以 2022 年 $1.5B 参考估值或更高价格入场之前，都必须做二级市场 cap table 分析。
