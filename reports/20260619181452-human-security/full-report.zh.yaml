              股权融资，显示投资人信心仍在。但收入质量、利润率路径和资本效率无法独立承销：毛利率、NRR、各细分 ARR、烧钱速度和现金头寸都未公开。公司声称的 >$100M ARR 与 GetLatka 的 $15M
