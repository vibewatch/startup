  - id: TE003
    title: 技术与运营架构——层级和依赖
    columns:
      - 层级 / 组件
      - 角色
      - 关键技术 / 规格
      - 依赖
      - 风险
    rows:
      - - JavaScript Sensor（客户端）
        - 从用户浏览器收集设备指纹、行为生物识别、会话和网络信号
        - 用于 AgenticTrust 的 JavaScript Sensor v9.6.6+；通过 HTML <head> 标签注入
        - 需要访问 HTML head 标签；会被浏览器广告拦截器和隐私扩展阻断或削弱
        - 隐私工具普及和服务端渲染会降低部分会话的信号保真度
      - - Enforcer（服务端 / 边缘）
        - 在 CDN、WAF、API gateway 或源站内联执行机器人判定；对确认威胁进行阻断、重定向或限速
        - >-
          20+ 个 Enforcer 集成：AWS Lambda@Edge v4.8.0+、Cloudflare v6.12.0+、Fastly VCL v12.3.0+、Akamai EdgeWorker v4.4.0+、F5
          BIG-IP v3.1.1+、Nginx、Kong、Azure Front Door v1.2.1+
        - CDN/云服务商可用性；各集成的 API key 管理；AgenticTrust 不支持 PHP、Python、Ruby 运行时
        - 单一 CDN 提供商宕机或集成版本不匹配会削弱执行路径；自定义运行时需要手工 SDK 集成
      - - Decision Engine（云托管）
        - 中央 AI/ML 判定系统；每次交互处理 2,500+ 信号，使用 400+ 自适应 ML 模型；给出低于 2ms 的判定
        - 专有多区域云栈；Precheck 机制自动验证约 95% 流量；用于登录后异常的 Profile Deviation Models 2.0
        - HUMAN 云基础设施正常运行时间；ML 模型刷新节奏；数据合作质量
        - 平台侧事件会直接影响客户防护；模型更新可能短暂影响误报率
      - - Behavioral Signal Network（数据基础）
        - 训练和推理数据语料；提供跨客户威胁关联；用新攻击模式丰富 ML 模型
        - 每周 20T+ 次交互，覆盖 3B 台设备；14+ 年行为数据；由 Satori IOC 管线补充
        - 与主要广告交易所、CDN 和平台的数据合作；持续的数据合作伙伴协议
        - 网络效应取决于平台规模；较小或垂直细分场景获得的关联信号相对更少
      - - FraudSensor（竞价后广告检测）
        - 广告投放后验证展示；在可见性计算前过滤机器人和 IVT 生成的展示
        - 竞价后检测；供应路径级信号分析；MRC 认证可见性输出
        - 与 DSP/SSP 数据管线集成；MRC 审计合规
        - 竞价后检测在成本已经发生后捕捉欺诈；它不阻止欺诈性出价，只验证结果
    notes: >-
      架构细节来自截至 2026 年 6 月的 HUMAN 技术文档、AWS Marketplace 列表和 SoftwareOne 产品目录。Enforcer 最低版本来自 HUMAN 官方 AgenticTrust
      文档。风险评估由分析师根据公开架构披露推断；内部 SLA 和正常运行时间数据未公开。
