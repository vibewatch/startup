        - Application Protection；分析 2,500+ 信号；Precheck 自动验证约 95% 的用户；Human Challenge 处理模糊会话
        - 95% 合法用户无摩擦通过；靠行为和设备画像阻断复杂机器人活动
        - 多区域或自定义 API 配置需要复杂规则管理；文档深度被提及为改进点
      - - 全生命周期账户安全；防止 ATO 和虚假账户
        - 只在登录时认证；登录后异常检测偏被动，且局限于会话
        - Account Protection；登录前 / 登录时 / 登录后行为连续性；覆盖账户生命周期的设备和会话历史
        - 生命周期覆盖减少绕过单点登录控制的欺诈；覆盖虚假账户创建和被攻陷账户使用
        - 未发布 TPR/FPR 基准；结果指标（欺诈降低比例、拒付率）未获独立验证
      - - 治理访问数字资产的 AI agents
        - 没有标准化治理；组织要么阻断所有类似机器人的流量（误拦合法 agents），要么放行所有自动化
        - Sightline 内的 AgenticTrust；分类 agent 类型和信任等级；执行按 agent 设置的权限；为 AWS Bedrock agents 做加密验证
        - 支持代理式商务，同时不打开攻击面；减少冒充和过度代理式抓取
        - 加密验证仅限实现 HTTP Message Signatures 的 agents；不支持签名的旧式 agents 默认走行为启发式判断
    notes: 收益主张来自公司表述或分析师报道；独立结果基准未公开。限制项来自截至 2026 年 6 月的用户评论（TrustRadius、PeerSpot） 和分析师评论。
