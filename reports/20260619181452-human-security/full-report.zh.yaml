      - number: '7.3'
        title: 伙伴、平台与市场依赖风险
        blocks:
          - type: paragraph
            body: >
              HUMAN 处在一张关键伙伴依赖网里，既竞争也协作。BADBOX 2.0 的处置说明了这种共生结构：HUMAN 的 Satori 团队发现威胁，但真正完成修复，需要 Google 更新 Play Protect
              并在联邦法院采取法律行动，需要 Shadowserver Foundation 接管命令与控制域名，还需要 FBI 协调公开预警。这种公私协作模式既是竞争护城河，也是依赖——HUMAN
              不能独立接管基础设施，Google 是否介入也有裁量空间。Google 同时是关键分发伙伴（通过 Google Play Protect 认证）、客户，也是一个自有广告欺诈检测能力不断增强的竞争者。


              在 Bot Management 市场，按 Gartner Peer Insights 和 PeerSpot 的心智份额口径，HUMAN 以 8.1% 排第五，Cloudflare 以 9.2%
              排第三。Cloudflare 走平台路线，把 DDoS 缓解、WAF、Bot Management 和 API 安全打包成一套全球边缘分发的一体化堆栈；HUMAN
              在应用层信号保真度更深，但基础设施覆盖更窄。广告验证板块已经集中到接近 DoubleVerify 和 Integral Ad Science
              双寡头，两家公司都有上市公司规模优势。Google、Meta、Amazon 等大型平台厂商为自己的围墙花园库存提供自有欺诈检测，结构性压低了最高价值展示段对第三方验证的需求。HUMAN
              必须持续证明自己相对打包替代品有增量提升，才能支撑按流量单位收费。


              MRC 认证虽然刚刚取得，却也形成治理依赖：MRC 是自愿性行业机构，批评者认为其执法资源结构性不足。即便可能性很低，一旦失去 MRC 认证，HUMAN
              在媒体买家和代理机构伙伴中的竞争位置会受损，因为这些客户把认证视为基线。广告交易所集成层——DSP、SSP 和发布商技术伙伴——也带来集中度风险：如果一家主要交易所弃用 HUMAN 的
              SDK，转向打包方案或竞品方案，风险就会暴露。
