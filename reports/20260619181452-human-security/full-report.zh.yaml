          low: 12
          high: 36
          note: 取决于 2024 年 10 月 $50M+ 融资和收入增长轨迹。低值假设高烧钱且收入增长有限；高值假设 ARR 增长抵消烧钱。
        - label: 毛利率（%）
          low: 65
          high: 85
          note: SaaS 网络安全基准区间。低值反映 Satori 团队和互联网规模基础设施成本把毛利率压低到纯软件同行以下。
        - label: 隐含估值（USD M，按 7–13x ARR）
