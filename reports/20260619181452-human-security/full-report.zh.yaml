      - number: '4.2'
        title: 商业化动作与销售效率
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 有意识地改造 GTM：从历史上的纯直销组织，转向伙伴优先渠道模式。2024 年前，公司没有正式渠道计划，大客户需要直接谈法律、MSA 和定价条款，企业销售周期常见六到七个月。2024
              年 8 月，HUMAN 推出 HUMAN Advantage Partner
              Program，这是一套分层渠道计划，激励依据年度化订单额、培训完成度和客户留存。计划面向全球经销商、分销商和咨询伙伴。另一路上，HUMAN 2022 年 11 月与 Carahsoft Technology
              合作，由后者担任 Master Government Aggregator，让公共部门可通过 NCPA、E&I 和 OMNIA 合作合同采购。CEO Stu Solomon（2024 年 1 月任命，曾任
              Recorded Future 总裁）和 CRO Chris Scanlan（曾任 ExtraHop 总裁）在执行商业和营销转向。伙伴驱动打法借既有伙伴关系和预存 MSA
              缩短销售周期，压低平均成交时间，并扩大可触达管线。公开资料没有披露伙伴来源管线占比，也没有量化 CAC / 回本数据。生态优先打法还让 HUMAN
              能触达分散的购买人群（安全、商业、数字、营销），同时不稀释直销带宽。
            claimRefs:
              - CI018
