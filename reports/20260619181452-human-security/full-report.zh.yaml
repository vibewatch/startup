      - number: '4.3'
        title: 成本结构与利润率驱动因素
        blocks:
          - type: paragraph
            body: >
              HUMAN 的成本结构主要由三类支出主导：（1）用于每周处理超过 20 万亿次数字交互（截至 2025 年年化超过 1 千万亿次）的 ML 和数据基础设施，带来大量云计算与存储支出；（2）Satori
              Threat Intelligence and Research Team，这是有人参与的成本中心，负责主动威胁研究并执行打击行动（3ve、Methbot、PARETO、BADBOX 2.0），让 HUMAN
              的检测有研究背书，但也增加可观人力成本；（3）销售与营销，随着渠道计划投入增加、员工数从 2023 年末约 197 人增至 2026 年中估计 469–519 人而扩张。公司没有公开毛利率。SaaS
              网络安全基准（Benchmarkit 2024/2025）显示，纯 SaaS 模式典型毛利率为 75–85%；若存在大量 human-in-the-loop 运营，毛利率会承压。HUMAN 的 Satori
              团队，以及按互联网规模运行在 hyperscaler compute 上的信号采集基础设施，可能把利润率压到 SaaS 中位数基准以下。私营 SaaS 公司 R&D 估计约占收入 34%，而 HUMAN
              这一增长阶段的 VC 支持 SaaS 公司销售与营销通常占 47%。若 HUMAN ARR 接近或达到 $100M，SaaS 基准是每 FTE 贡献 $200–$300K ARR，意味着收入效率中等。
