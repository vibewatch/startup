      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              HUMAN 的估值要对标三组同行：上市广告验证平台（DV、IAS）、私营网络安全应用安全同行，以及跨行业 M&A 先例。这三组给出的隐含估值差异很大，反映出 HUMAN
              夹在广告验证市场和纯网络安全市场之间的混合定位。


              上市广告验证可比公司给出悲观锚点。DoubleVerify（NYSE: DV）报告 LTM 收入 $781 million、EBITDA $261 million、毛利率 82%，但交易倍数只有 1.9x
              EV/Revenue——企业价值 $2 billion——反映程序化广告的结构性逆风以及约 10% NTM 的缓慢收入增长。Integral Ad Science 的 LTM 收入约 $530
              million，倍数同样被压缩。按 Multiples.vc 2026 年 6 月分析，更广义 AdTech SaaS 板块的 NTM EV/Revenue 中位数仅 0.9x，是所有 SaaS 细分中最低。套到
              $100 million ARR 上，只意味着 $90–190 million EV——对具备 HUMAN 网络安全定位的公司显然不适用，但如果买家按板块合理倍数标记 HUMAN 的广告验证收入，这就是底部。


              网络安全可比公司有利得多。Finro 2026 年二季度覆盖 9 个细分、265 家公司的数据集显示，Application Security（HUMAN 最接近的同行细分）平均 EV/Revenue 为
              15.4x，中位数为 13.0x。Windsor Drake 2025 年 11 月报告给出的私营网络安全中位数为 15.2x ARR，M&A 退出中位数为 16.3x。云安全细分交易倍数更高，Finro 平均为
              22.7x，并由 Google/Wiz $32 billion 交易的 32x ARR 锚定。Kroll 2026 年春季分析指出，由于 AI 相关股票市场压力，2026 年一季度网络安全 EV/NTM
              Revenue 中位数环比下降 26%，所以即便网络安全溢价目前也承压。


              按 HUMAN 的收入规模（$100M+ ARR）看，私募市场 SaaS 可比公司暗示非 AI SaaS 的区间为 5.5–7.2x ARR（iMerge 2026 年一季度），高 NRR 的 AI-native
              平台最高可达 12–15x。Acquiry 2026 数据集相互印证：增长 20–50% 的 AI-native SaaS 可拿到 7–12x ARR；增长 15–30% 的传统 SaaS 为 3–5x
              ARR。考虑到 HUMAN 声称自己具备 AI-native 定位，但未披露增长率，估值区间会很宽。
