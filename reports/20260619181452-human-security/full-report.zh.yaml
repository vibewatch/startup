  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: |
      按类别梳理 HUMAN Security 的关键外部依赖：云基础设施、威胁情报伙伴、监管机构，以及竞争 / 平台交易对手。
    data:
      nodes:
        - id: human
          label: HUMAN Security
        - id: aws
          label: AWS（云计算）
        - id: google-ti
          label: Google（威胁情报 / Play Protect）
        - id: shadowserver
          label: Shadowserver Foundation（C2 沉洞）
        - id: fbi
          label: FBI（执法）
        - id: mrc
          label: MRC（认证）
        - id: ad-exchanges
          label: 广告交易平台 / DSP
        - id: cloudflare
          label: Cloudflare（竞争对手 / 平台）
        - id: google-ads
          label: Google / Meta / Amazon（平台捆绑）
      edges:
        - from: human
          to: aws
          label: ML 推理算力
        - from: human
          to: google-ti
          label: BADBOX 打击合作
        - from: human
          to: shadowserver
          label: C2 域名沉洞
        - from: human
          to: fbi
          label: 执法协同
        - from: human
          to: mrc
          label: 可视性认证
        - from: human
          to: ad-exchanges
          label: 欺诈信号分发
        - from: cloudflare
          to: human
          label: 竞争性替代风险
        - from: google-ads
          to: human
          label: 围墙花园捆绑风险
    claimRefs:
      - CR025
      - CR029
      - CR030
      - CR023
      - CR031
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: |
      从 HUMAN 的平台规模和财务证据出发，经过风险评估，推导出「跟踪」建议和主要退出路径的逻辑链。
    data:
      nodes:
        - id: scale
          label: 平台规模（每周 20T 次交互）
        - id: arr
          label: ARR >$100M（公司声称）
        - id: comps
          label: App Sec 中位数 13–15x / 私营网络安全 15.2x
        - id: gaps
          label: NRR、利润率、增长未披露
        - id: risk
          label: 高风险：资本压力、板块信号混杂、不透明
        - id: rec
          label: 建议：跟踪
        - id: exit_ma
          label: 主要退出：战略 M&A（2027–2029）
        - id: exit_ipo
          label: 次要退出：IPO（2028–2030，取决于指标）
      edges:
        - from: scale
          to: arr
        - from: arr
          to: comps
        - from: comps
          to: gaps
        - from: gaps
          to: risk
        - from: risk
          to: rec
        - from: rec
          to: exit_ma
        - from: rec
          to: exit_ipo
    approximationNotes: |
      流程节点代表逻辑评估链，不是财务模型。退出路径时间是指示性判断，依据可比网络安全公司的发展轨迹和当前 IPO 市场环境。
    claimRefs:
      - CV009
      - CV016
      - CV019
      - CV039
      - CV045
  - id: FV002
    title: ARR 倍数估值敏感性
    type: bar
    layout: standard
    summary: |
      在六种情景下测算 HUMAN Security 隐含企业价值，从广告验证底部（1.9x）到 AI-native 网络安全上限（22x），均套用 $100M ARR 基准。
    data:
      items:
        - label: AdTech 底部（DV/IAS 1.9x）
          value: 190
        - label: 网络安全 / AdTech 混合（8x）
          value: 800
        - label: App Sec 中位数（13x）
          value: 1300
        - label: 私营网络安全中位数（15.2x）
          value: 1520
        - label: 网络安全前四分位（18x）
          value: 1800
        - label: AI-native 溢价（22x）
          value: 2200
    approximationNotes: >
      所有数值均套用 $100M ARR 基准（公司声称的底线）。实际 ARR 可能更高（GrowJo 估计 $140.4M），也可能更低（GetLatka 有争议的 $15M 数字）。倍数来源于
      Multiples.vc（DV）、Finro Q2 2026（App Sec）、Windsor Drake（私营网络安全、M&A 中位数）以及 Acquiry/SaaS Mag（AI-native 区间）。数值单位为百万美元。
    claimRefs:
      - CV013
      - CV016
      - CV017
      - CV019
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV046
  - id: FV003
    title: 按情景划分的估值回报区间
    type: range
    layout: standard
    summary: |
      悲观、基准、乐观三种情景下的低、中、高企业价值估计，并列明假设锚点。
    data:
      items:
        - label: 悲观情景（ARR $80–100M，8–10x 混合）
          low: 640
          mid: 820
          high: 1000
        - label: 基准情景（ARR $100–115M，13–15x App Sec）
          low: 1200
          mid: 1400
          high: 1725
        - label: 乐观情景（ARR $130–140M，18–20x 前四分位）
          low: 2000
          mid: 2340
          high: 2800
    approximationNotes: >
      悲观低端 $640M 反映 $80M ARR 上 8x；悲观高端 $1.0B 反映 $100M ARR 上 10x。基准区间锚定 Finro App Sec 中位数（13x）和私营网络安全中位数（15.2x）。乐观区间将
      CyberArk/Palo Alto M&A 先例倍数（18.6x）套用于 $130M ARR 得出中位，并在高位拉伸至 $140M ARR 上
      20x。所有数字单位为百万美元。区间未计入清算优先权、债务优先级，或新融资轮带来的稀释。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV025
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      面向 IC 的八维 0–10 分评分；反映截至 2026 年 6 月的证据约束评估。
    data:
      items:
        - label: 市场机会
          value: 7
          max: 10
        - label: 产品差异化
          value: 7
          max: 10
        - label: 客户证明
          value: 6
          max: 10
        - label: 财务指标
          value: 3
          max: 10
        - label: 竞争护城河
          value: 6
          max: 10
        - label: 退出成熟度
          value: 5
          max: 10
        - label: 估值纪律
          value: 5
          max: 10
        - label: 证据质量
          value: 4
          max: 10
    approximationNotes: >
      分数是作者在证据受限下作出的顺序判断（0=无证据 / 关键失败，10=同类最佳且完整披露）。由于缺少 NRR、毛利率、烧钱速度和 ARR 增长披露，财务指标得 3/10。由于 GetLatka 与公司声称 ARR
      冲突，且没有审计财务，证据质量得 4/10。其他所有分数均来自本次研究审阅的公开证据。
    claimRefs:
      - CV009
      - CV019
      - CV041
      - CV042
      - CV044
      - CV045
