  - id: FE002
    title: 客户保护工作流 — 从互动到执行
    type: flow
    layout: standard
    summary: 端到端流程：传入数字互动后，经过 Sensor 采集、Decision Engine 判定，并对人类、bot 和 AI agent 做差异化执行。
    data:
      nodes:
        - id: interaction
          label: 数字互动到达
          description: 广告曝光、web/app/API 请求或账户操作到达客户资产
        - id: sensor
          label: JavaScript Sensor 捕获信号
          description: 在浏览器内采集设备指纹、行为生物特征、会话历史和网络特征
        - id: engine
          label: Decision Engine 评估
          description: 400+ 个 ML 模型处理 2,500+ 个信号；低于 2ms 给出判定
        - id: precheck
          label: Precheck：约 95% 自动验证
          description: 低风险会话立即放行；不中断用户；允许合法自动化
        - id: challenge
          label: Human Challenge：模糊会话
          description: 仅对异常或高风险信号画像启用交互式真人证明挑战
        - id: enforcer
          label: Enforcer 执行判定
          description: CDN/WAF/API-gateway enforcer 按策略阻断、重定向、限速或治理
        - id: agentictrust
          label: AgenticTrust：AI Agent 治理
          description: 按类型和信任级别分类 agent；对 AWS Bedrock agents 做加密验证；执行逐动作权限
        - id: telemetry
          label: 遥测 → Satori 输入
          description: 攻击画像和新 IOC 进入 Satori 研究闭环；为下一周期增强 ML 模型
      edges:
        - from: interaction
          to: sensor
        - from: sensor
          to: engine
        - from: engine
          to: precheck
          label: 人类（已验证）
        - from: engine
          to: agentictrust
          label: 检测到 AI Agent
        - from: engine
          to: enforcer
          label: Bot / 威胁确认
        - from: precheck
          to: enforcer
          label: 放行
        - from: agentictrust
          to: enforcer
          label: 按策略治理
        - from: enforcer
          to: telemetry
        - from: telemetry
          to: engine
          label: 模型增强
    claimRefs:
      - CE005
      - CE006
      - CE019
      - CE020
      - CE033
