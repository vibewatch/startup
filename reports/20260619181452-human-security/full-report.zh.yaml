      - number: '1.4'
        title: 里程碑时间线、竞争认可与负面背景
        blocks:
          - type: paragraph
            body: >
              HUMAN 的运营历史由一系列公私联合威胁打击行动塑造，这些行动确立了其在网络安全市场的身份和可信度。2016 年，公司仍名为 White Ops 时，揭露了
              Methbot，这是最早的大规模专用广告欺诈僵尸网络之一。2018-2019 年，公司与 FBI、Google 和 Facebook 参与打掉 3ve，这是截至当时最大的广告欺诈僵尸网络。2021
              年，公司主导协作式 PARETO 打击行动（一个大型 Connected TV 广告欺诈行动），并从 White Ops 更名为 HUMAN Security。2022 年是公开记录中最活跃的一年：3 月收购
              clean.io，7 月完成 PerimeterX 合并，影响 1,100 万台设备、每日产生 120 亿次虚假竞价请求的 VASTFLUX 广告欺诈方案被打断，并在 2023 年 1 月披露。BADBOX
              是一个预装 Android 僵尸网络，影响全球数百万台设备，2023、2024 和 2025 年被分阶段打击；德国当局以及包括 HUMAN、Google 和 Shadowserver
              在内的联盟执行了最大规模的协调 sinkholing 行动。


              商业和行业认可方面，HUMAN 入选 TIME 的 Best Inventions of 2023、TIME100 Most Influential Companies of 2023，并在 The
              Forrester Wave: Bot Management Software Q3 2024 中被评为 Leader。2024 年 1 月，Tamer Hassan 向 Stu Solomon 的 CEO
              交接生效。2024 年 10 月，$50M+ 成长轮完成。到 2026 年 6 月，HUMAN 在 The Forrester Wave: Bot and Agent Trust Management
              Software Q2 2026 中被评为 Leader，在包括 Threat Research 在内的九项标准上获得最高可能分数，并且是唯一在该标准获得最高分的供应商。G2 的 Summer 2026 Grid
              for Bot Detection and Mitigation Software 也完全基于客户反馈，将 HUMAN 评为总榜第一的 Leader。


              负面记录有限。2024 年 10 月，AdExchanger 发布更正，称 CEO Stu Solomon 在采访中谈到为归因构建专有确定性 ID 时失言；HUMAN
              产品副总裁澄清并无此类产品计划。这是一次轻微公开信息表述错误，没有监管或法律后果。截至 2026 年 6 月研究日，公开记录未发现针对 HUMAN Security
              的重大诉讼、监管调查、数据泄露披露、重大裁员或制裁。没有记录在案的负面事件本身应作为证据缺口处理，因为私人程序可能不会公开披露；公司私人持有，也意味着不存在公开监管申报轨迹。
