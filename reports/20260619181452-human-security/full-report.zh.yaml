  - id: FI001
    title: 收入模型桥接 — 从客户互动到订阅收入
    type: flow
    layout: standard
    summary: 客户数字活动如何经过平台检测层和订阅开票，转化为 HUMAN 收入。
    data:
      nodes:
        - id: customer
          label: 客户（品牌 / 出版方 / 平台）
          description: 500+ 全球企业客户，在 web、移动端、API 和广告供应链上产生数字流量
        - id: signals
          label: 信号采集层
          description: 每周 20T+ 次互动，覆盖 30 亿台设备；每次互动含 2,500+ 个行为信号
        - id: detection
          label: ML 检测引擎
          description: bot 检测、广告欺诈评分、账户异常检测、AI agent 分类（AgenticTrust）；多模型集成
        - id: platform
          label: Human Defense Platform 平台
          description: 广告保护、应用安全、账户保护、HUMAN Sightline / AgenticTrust 模块
        - id: satori
          label: Satori 威胁情报团队
          description: 人在回路的威胁研究、下架行动（3ve、Methbot、PARETO）；反哺检测模型
        - id: revenue
          label: 订阅收入事件
          description: 年度企业 SaaS 发票；按流量、受保护资产和模块组合定制价格
        - id: expansion
          label: 扩展 / 加售
          description: 附加模块挂载（账户保护、AgenticTrust、Sightline）；合作伙伴联合销售；公共部门渠道
      edges:
        - from: customer
          to: signals
          label: 流量与互动数据
        - from: signals
          to: detection
          label: 实时遥测
        - from: satori
          to: detection
          label: 威胁情报输入
        - from: detection
          to: platform
          label: 决策输出
        - from: platform
          to: revenue
          label: 平台价值交付 → 开票
        - from: revenue
          to: expansion
          label: 续约 + 新模块挂载
        - from: expansion
          to: platform
          label: 覆盖范围扩展
    approximationNotes: |
      节点描述为定性信息；ML 模型、信号类型和模块收入组合的确切数量属于公司机密。各模块相对收入贡献未公开披露。
