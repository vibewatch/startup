chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与平台模式
        blocks:
          - type: paragraph
            body: >
              HUMAN Security, Inc. 是一家私人持有的网络安全公司，总部位于纽约市，另在 Miami、Santa Clara、Tel Aviv（Israel）和 United Kingdom 设有办公室。公司
              2012 年由 Tamer Hassan、Michael Tiffany、Dan Kaminsky 和 Ash Kalb 在 New York 的 Brooklyn 以 White Ops 名义创立。2021
              年，公司更名为 HUMAN Security，反映业务范围从广告欺诈扩展到全栈企业和消费者安全。公司把自己定位为媒体和智能体商务平台的信任层，负责验证互动、减少欺诈，并让人类、机器人和 AI
              智能体之间的真实交互得以发生。


              HUMAN 的核心商业产品是 Human Defense Platform（HDP）。公司将其定位为统一平台，覆盖三大支柱：Media
              Security（数字广告欺诈、无效流量检测和广告完整性）、Application and Enterprise Security（账户接管、撞库、虚假账户创建、网页抓取和盗刷测试），以及 Account
              Protection（身份和认证欺诈）。平台披露的规模指标是：每周在 30 亿台独立设备上验证超过 20 万亿次数字交互；每次交互使用 2,500+ 个信号，由 400+
              个自适应机器学习模型分析，在毫秒级做出机器人或人类的二元判断。公司服务媒体、金融、零售、政府、教育和企业安全等垂直领域的 500+ 个全球品牌。


              截至 2026 年中，HUMAN 已把平台扩展到智能体 AI 时代，推出 HUMAN Sightline Cyberfraud Defense 和
              AgenticTrust。前者是统一的信任与防御层，保护数字业务在完整客户旅程中免受机器人攻击、人为欺诈、交易滥用和 AI 驱动风险；后者让客户检测、分类并治理在其平台上运行的 AI 智能体。HUMAN 还运营
              Satori Threat Intelligence and Research
              Team，负责威胁情报，并协调对网络犯罪行动的公私联合打击。公司称，按每周交互量计算，其竞争位置是全球最大的威胁检测网络。收入模式和定价仍未公开。
