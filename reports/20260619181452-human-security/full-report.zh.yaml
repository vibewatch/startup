          - type: callout
            title: 资本包袱与结构化融资风险
            body: >
              $400M 总资本基数（股权 + 债务）带来实质性优先权包袱。Windsor Drake 明确指出，以 2021–2022 年峰值倍数融资的公司，常常执行带保证回报或参与权的“结构化轮次”。HUMAN 2024
              年 10 月融资——完全由现有投资人参与且估值未披露——与这种动态一致。在 EV 低于 $1.0B 的悲观情景中，早期优先股类别的清算优先权可能把普通股价值压到接近零。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV036
              - CV043
              - CV047
          - type: callout
            title: 板块定位决定倍数——区间从 $190M 到 $2.8B
            body: >
              HUMAN 最关键的估值问题不是某个数字，而是板块标签。如果把它看作广告验证平台（DV/IAS 可比），按 1.9x LTM 收入计算，隐含 EV 约为
              $190M。如果把它看作纯网络安全平台，按应用安全中位数（13.0x ARR）计算，隐含 EV 为 $1.3B。如果把它看作 AI-native 安全平台（22x，前四分位），则为 $2.2B。差距达到
              11x，完全由适用哪组可比公司驱动。尽调的目标，就是判断多少收入可以有防御性地归为网络安全 SaaS，而不是广告技术服务。
            calloutType: insight
            claimRefs:
