      - - 2025 年 AI 驱动流量增长 187%，AI 抓取器增长 597%
        - 驱动因素
        - 强正向
        - 当前
        - 媒体和电商买方面临即时抓取威胁；推动从 bot 防御交叉销售到 AI 流量治理
        - 确认该信号适用于 HUMAN 的客户垂直，而不只是其自身观测到的流量
      - - HUMAN 客户群内 ATO 攻击在 2024-2025 年翻了两番
        - 驱动因素
        - 强正向
        - 当前且在加速
        - 在现有客户群内形成 upsell 机会；向 bot-only 客户交叉销售 ATO 模块；扩大合同金额
        - 确认 ATO 增速来自广泛市场，而不是 HUMAN 检测覆盖提升造成的假象
      - - 全球广告欺诈损失 >$100B，2026 年 IVT 率 20%+
        - 驱动因素
        - 中等正向
        - 持续
        - 广告主对 MRC 认证 SIVT 厂商的需求得以维持；支撑 MediaGuard/Ad Integrity Suite 续约率
        - 评估 HUMAN 的 SIVT 客户中，强制要求（TAG/MRC-required）与自主采购买方各占多少
      - - 2026 年 TAG 认证 307 项（74% 经独立审计）；监管压力（PSD2、NIST、EU AI Act）
        - 驱动因素
        - 中等正向
        - 形成中（2024-2028）
        - 受监管和广告行业垂直会为 bot/agent 信任管理配置非可自由裁量预算线
        - 识别哪些具体法规会为 HUMAN 产品创造合同要求，而不只是提升一般安全意识
      - - Cloudflare 主导 bot 管理安装基数（约 79% 份额）
        - 约束
        - 对 SMB / 中端市场强负向
        - 当前且在增长
        - HUMAN 实际上被排除在很大一部分 SMB 市场之外；必须靠信号深度（每次交互 2,500+ 信号）和 Cloudflare 不具备的专项认证来销售
        - 量化 Cloudflare 在 HUMAN 当前客户分群中的渗透率；HUMAN 是共存还是替换？
      - - ROI 证明是「看不见的节省」（避免欺诈损失）
        - 约束
        - 中等负向
        - 持续
        - 拉长企业销售周期；需要可信的衡量方法；预算批准需要非技术利益相关方买入
        - 要求 HUMAN 提供经第三方验证的客户 ROI 案例研究；平均销售周期多长？
      - - 深度 API / 登录流程集成带来高切换成本（双向）
        - 约束
        - 混合
        - 持续
        - 保护 HUMAN 现有安装基数（NRR 可能较高），但放慢从既有厂商手中拿新 logo 的速度；迁移风险会阻止变更
        - 获取 NRR 和 logo 留存指标；HUMAN 平均客户年限多长？
      - - 大型平台的内部欺诈团队构成自建替代
        - 约束
        - 中等负向（选择性）
        - 当前
        - 在具备足够 ML 工程能力的大型互联网公司（Google、Meta、Amazon），SAM 受限；HUMAN 的 SAM 更偏向没有内部能力的中大型企业
        - 识别与内部自建决策竞争时的赢 / 输记录；多大工程人员规模会与自建偏好相关？
    notes: |
