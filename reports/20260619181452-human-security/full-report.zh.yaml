  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 的收入机会横跨四个不同但重叠的产品类别：（1）机器人缓解和行为分析平台，保护 Web 应用、API 和移动端免受自动化滥用；（2）广告欺诈和 Sophisticated
              Invalid Traffic（SIVT）防御，覆盖程序化广告中的竞价前过滤、竞价后报告和 MRC 认证验证；（3）账户接管（ATO）预防，针对登录后的凭据滥用、会话劫持和多阶段攻击链；（4）智能体 AI
              信任管理，这是一个新兴类别，随着 AI 驱动智能体开始代表用户交易而出现——在 HUMAN 自身网络数据中同比增长 7,851%。这四类产品正越来越多地整合到 Human Defense Platform 内的
              HUMAN Sightline Cyberfraud Defense 和 MediaGuard/Ad Integrity Suite 之下。

              纳入支出包括行为分析 SaaS 订阅、MRC 认证 SIVT 检测许可、机器人评分 API 费用、AgenticTrust 政策执行，以及托管威胁情报服务（Satori
              团队）。排除支出包括纯支付欺诈拒付和拒付保险、KYC/KYB 身份核验（证件验证、生物识别）、AML 合规工具、没有行为层的传统 CAPTCHA 商品化产品、DDoS
              缓解（纯流量型），以及机器人管理只是未单独计费附加项的 CDN 基础设施合同。相邻市场包括 Web 应用防火墙、云访问安全代理、身份与访问管理平台和 API 网关安全——这些都会对 HUMAN
              的特定用例形成部分替代。

              现状替代品包括：自建欺诈规则引擎和数据科学团队（Google、Meta 和大型金融机构等大型互联网平台常见）、Cloudflare（按设备份额计占机器人管理安装基数 79%）和 Akamai（6%）提供的 CDN
              原生机器人管理，以及 Integral Ad Science、DoubleVerify、Pixalate 等点状 SIVT 供应商。Cloudflare 把机器人管理与 CDN、WAF 捆绑，SMB
              平价套餐年费约 $350 起，这在低端和中端市场形成最实质的替代风险。竞争性捆绑威胁压缩 HUMAN 的可服务市场——尤其是已依赖 Cloudflare 做内容分发的组织——并迫使 HUMAN
              用信号深度（每次交互 2,500+ 个行为信号）、威胁研究（Satori 团队）和 Cloudflare 不提供的专门广告欺诈 MRC 认证来证明差异化。
