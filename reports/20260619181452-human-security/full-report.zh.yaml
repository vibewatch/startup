  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Human Defense Platform — 产品线与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Human Defense Platform（HDP）围绕一个统一主张搭建：数字交互进入客户创收工作流之前，应先被验证为合法人类活动、可信 AI-agent 流量，或已确认的自动化威胁。客户部署
              HDP，主要应对三类核心工作流挑战。第一，在程序化广告供应链中剔除无效流量（IVT）和广告欺诈；DSP 与 SSP 接受出价时，往往不会验证底层流量。第二，阻断针对 web 应用、移动 app 和 API
              的自动化滥用，包括撞库、抓取、交易滥用和虚假账户创建。第三，从初始注册到登录后金融活动，保护用户账户旅程。


              截至 2026 年，HDP 包含四条有命名的产品线，可通过 AWS Marketplace 和企业合同采购：HUMAN Advertising Protection（原 MediaGuard）用竞价前和竞价后
              IVT 检测保护程序化广告供应链；HUMAN Application Protection（原 Bot Defender）保护 web 与移动应用、API，抵御抓取、交易滥用、虚假注册等复杂 bot
              攻击；HUMAN Account Protection（原 Account Defender）覆盖账户全生命周期，在登录前、登录时、登录后防御撞库和虚假账户欺诈；HUMAN Client-side
              Defense（原 Code Defender）让客户控制用户浏览器中运行的第三方脚本，并支持 PCI DSS 4 合规义务。另一个模块 BotGuard for Growth Marketing
              面向营销漏斗完整性，通过过滤 bot 驱动的点击欺诈和虚假线索生成来发挥作用。


              2025 年 7 月 30 日推出的 Sightline Cyberfraud Defense 平台，是所有产品线的统一界面；它加入 AgenticTrust，用于 AI-agent 分类与治理，也加入 Page
              Intelligence，为营销团队分析 AI 驱动流量。2022 年收购 clean.io 后，HUMAN 获得实时客户端 JavaScript
              行为分析能力，用于恶意广告防御，把检测覆盖提前到攻击周期更早阶段。HUMAN 服务 500+ 全球品牌，覆盖媒体、金融、零售、政府和教育等垂直领域。
