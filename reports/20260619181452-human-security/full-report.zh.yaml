      - number: '6.4'
        title: 留存与耐久性证据
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 不披露任何客户细分的 NRR、GRR、流失率、平均合同长度或 cohort 留存——这符合该阶段私营公司的常态。留存和耐久性的代理证据来自评论平台与伙伴证言。Gartner Peer
              Insights（更新至 2026 年 4 月）上，HUMAN Sightline Cyberfraud Defense 总评分 4.7/5，Service & Support 为 4.8，Product
              Capabilities 为 4.7。一位来自旅游与酒店公司（$250M–$500M）的评论者给托管服务 5/5，提到「他们的托管服务响应非常快」以及持续多年的合作。一位来自 1B–10B USD
              零售公司的评论者明确表示「我们与 Human 合作已久」——说明合作已跨多年。一位 10B+ 零售公司评论者称 HUMAN 让「我们所有品牌」拥有「非常安全的线上存在」——暗示企业级部署覆盖面。G2 将
              HUMAN 评为 Best Security Software Product of 2026（Bot Detection & Mitigation 第 1 名），这是众包同行验证。Forrester Wave
              Q2 2026 报告提到客户尤其肯定攻击洞察深度，暗示存在可作参考的关系。一个负面信号是：来自 $500M–$1B 零售公司的 3/5 Gartner 评论把 HUMAN
              描述为「黑箱」——检测逻辑能见度有限、没有主动变更通知、手动调优能力很少。这是技术要求高的安全买家面临的真实采购摩擦点，也带来流失风险。HUMAN Advantage Partner Program（2024 年
              8 月推出）的留存信号显示，三层结构把留存与订单额、培训并列作为核心指标，说明管理层意识到这一维度，但没有发布留存数据。行业基准显示，35% 网络安全厂商流失归因于 CX 而非产品表现，42%
              网络安全客户在过去两年更换过厂商——HUMAN 的托管服务方法和 Gartner 4.8/5 支持评分，正是用来对冲这一行业逆风。
