      - number: '3.4'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >
              在纯机器人管理供应商中，各家都发布定制企业定价，没有公开价目表。Cloudflare 是唯一提供公开价格层级的平台——其 Bot Management 是 Enterprise-only 附加项，捆绑进月费约
              $5,000 到 $80,000+ 的合同。对已使用 Cloudflare CDN 和 WAF 的组织来说，增加机器人管理的边际成本可能接近零，这让必须证明单独许可合理性的纯供应商处于结构性劣势。但
              Cloudflare 的机器人检测专业化程度较低：它提供基于 ML 的机器人评分、JA3/JA4 指纹和检测
              ID，但缺少专门供应商提供的行为信号深度（每年一千万亿次交互）、对抗性威胁情报或智能体信任治理。Imperva（Thales 旗下）以 15.7% 的 PeerSpot mindshare 领先，围绕 PCI
              DSS 4.0 合规和 700+ 个行为维度定位强；Akamai（第 2，9.7%）以 edge-first、源站前过滤和 CI/CD 集成差异化。与 Kasada 和 HUMAN 的 SDK/API
              部署相比，两者初始设置复杂度更高。GTM 方面，HUMAN 最强的渠道是深度合作伙伴生态：Forrester 特别指出 HUMAN
              合作伙伴项目的广度和获奖情况突出，并与新兴智能体信任和商务用例相匹配。OpenAI 和 AWS 等主要 AI 运营方已认可 HUMAN 是验证 AI
              智能体流量的可信方案；随着智能体信任成为采购要求，这会形成生态锁定动态。Fingerprint 的 128% NRR 是强信号，说明买方在初始部署后会扩大使用，符合 land-and-expand 动作，与
              Cloudflare 的 bundle-and-upsell 路径不同。自建替代——定制 WAF 规则、限速、设备指纹和 ML
              异常检测——对大型技术原生企业仍可行，但需要持续投入专业人才，并持续跟上对抗性演进；大多数组织无法以 HUMAN 更新威胁情报的速度维持。2025 年桌面浏览器篡改技术在识别中的占比同比翻倍至
              4.4%，说明检测复杂度不断升级；这更有利于拥有跨客户行为网络的供应商，而非单一企业自建系统。
