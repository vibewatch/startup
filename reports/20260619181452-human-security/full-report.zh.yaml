      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              HUMAN 的主要 land-and-expand 动作通过三条向量展开：（1）在同一企业账户内，从广告保护交叉销售到应用 / bot 防御和账户保护；（2）鉴于 AI agent 流量增长 7,851%，把
              agentic AI trust（Sightline 内的 AgenticTrust 模块）作为绿地 upsell 驱动；（3）2024 年 8 月推出 HUMAN Advantage Partner
              Program，在奖励年度化订单额、培训完成度和客户留存的三层结构下，用 Optiv 和 Consortium Networks 放大渠道。扩大可触达账户的战略技术伙伴关系包括 AWS Bedrock
              AgentCore 浏览器支持（加密签名 AI agent 验证），以及 Riskified 合作（RivalSense 称为 2026 年 8 月），后者通过 AI Agent Approve 和 AI
              Agent Intelligence 做电商欺诈预防。集中度风险在两个维度上都很重要。第一，HUMAN 的遗留收入基础高度集中于数字广告和 adtech；在这一垂直中，DoubleVerify 和 IAS
              市场份额大得多，预算周期又绑定媒体支出决策而非安全预算，因此对宏观广告下行敏感。Gartner Peer Insights 评论者群体在应用防御上偏向零售和旅游行业，但公司历史品牌身份和多数公开案例仍以
              ad-tech 为中心。第二，作为私营公司，HUMAN 没有可用的客户数、前十大客户收入占比或分细分收入数据，外部证据无法量化集中度。HUMAN Advantage Program
              的交易登记和在位保护旨在降低渠道冲突、提升账户耐久性，但计划推出不到两年，成熟信号缺失。采购摩擦——直销渠道计划前，企业销售周期 6–7 个月，需谈法律、MSA
              和定价——已在前述财务章节证据中被明确承认，也是与留存相邻的风险。渠道模式推出的目的，正是通过托管式 onboarding 降低这种摩擦。
