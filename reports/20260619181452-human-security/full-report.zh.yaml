        - from: reg-risk
          to: revenue
          label: 执法风险压低媒体预算
        - from: reg-risk
          to: financing
          label: 诉讼阴影推高成本
        - from: ops-risk
          to: customers
          label: 宕机违反 SLA
        - from: ops-risk
          to: revenue
          label: 宕机引发流失
        - from: comp-risk
          to: revenue
          label: 捆绑定价削弱 HUMAN
        - from: comp-risk
          to: customers
          label: 平台迁移缩小客户基础
        - from: ml-risk
          to: margin
          label: 重训练成本推高 COGS
        - from: ml-risk
          to: customers
          label: 误报推高流失
        - from: fin-risk
          to: valuation
          label: 不透明压缩倍数
        - from: fin-risk
          to: financing
          label: 过时的 $1.5B 估值参照压低新一轮融资
        - from: partner-risk
          to: revenue
          label: 广告交易平台流失压缩 TAM
        - from: partner-risk
          to: valuation
          label: 与 Google 共依赖限制独立性
