              流量同比增长 7,851%，合法 AI 驱动流量同期整体增长 187%，高度集中在零售 / 电商、流媒体 / 媒体、旅游 / 酒店——这三类也是 HUMAN 按流量计的领先客户垂直。公开来源确认的具名部署包括
