      - number: '5.5'
        title: 信任、合规、隐私与已识别限制
        blocks:
          - type: paragraph
            body: >-
              HUMAN 的正式合规姿态由 2026 年两项外部验证支撑：Ad Viewability Measurement 的 MRC 认证（2026 年 4 月 27 日授予），以及有效的 TAG（Trustworthy
              Accountability Group）认证。MRC 认证值得注意，因为 HUMAN 的方法把 FraudSensor IVT 过滤直接纳入可见性计算——系统只把经人类验证的曝光计为可见，这是一种
              security-first 架构，多数纯可见性厂商并未采用。认证覆盖桌面端、移动 web 和移动 app 的展示与视频曝光。Client-side Defense 产品通过监控并执行消费者浏览器中的
              JavaScript 行为策略，明确支持 PCI DSS 4 客户端要求。


              公开证据中存在实质限制。HUMAN 没有发布受控条件下的独立误报率或真阳性率基准，潜在客户很难在厂商中立基础上比较其检测准确性与竞品。站在客户视角，Decision Engine
              像一个「黑箱」：客户拿到威胁判定和攻击画像，但对具体模型逻辑或信号权重能见度有限。企业客户报告称，拥有定制 API 基础设施的组织会遇到集成复杂性；自定义规则管理的文档深度也被点名为改进空间。另外，截至 2026
              年 6 月，HUMAN 在 PeerSpot 上的 Bot Management mindshare 同比从 11.6% 降至 8.1%，说明即便分析师认可度强，竞争压力仍在。


              隐私控制依赖标准企业 SaaS 做法。HUMAN 的信号网络以大规模采集行为和设备数据；公司没有公开独立隐私审计或详细数据保留政策。监管行业客户（医疗、金融服务、EU GDPR
              范围）会把未发布独立隐私审计视为尽调缺口。企业采购标准暗示需要 SOC 2 Type II 合规，但公开资料未确认。
