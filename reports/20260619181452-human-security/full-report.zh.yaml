              成为目前唯一为 cloud-native AI agents 提供 policy-aware 加密认证的 bot-management 厂商。在多数竞争对手尚未推出可比能力前，HUMAN 已在新兴
              agentic-commerce 细分领域建立技术上可防守的护城河。
            calloutType: strength
            claimRefs:
              - CE033
              - CE014
              - CE035
          - type: callout
            title: 黑箱检测与独立基准缺失
            body: >-
              HUMAN 的 Decision Engine 不向客户暴露模型逻辑、信号权重或检测阈值。这种不透明给需要可审计性的企业风险团队制造采购挑战，也让外部无法独立验证公司声称的误报率。研究中没有发现厂商中立的 TPR
              / FPR 研究，而 PeerSpot mindshare 同比从 11.6% 降至 8.1%——这是从业者更积极评估替代方案的信号。
            calloutType: risk
            claimRefs:
