  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 位于两个快速演进市场的交汇处。在机器人和智能体信任管理领域，供应商集合包括专门构建的专业厂商（Kasada、Arkose
              Labs、DataDome、Netacea、Fingerprint）、把检测捆绑进更宽平台的基础设施原生玩家（Cloudflare、Akamai、Imperva/Thales），以及许多企业仍作为第一道过滤依赖的自建规则引擎和限速逻辑。在数字广告验证领域，HUMAN
              2026 年 6 月新推出的 Ad Integrity Suite，直接进入与上市公司 DoubleVerify（FY2025 收入 $748M，同比增长 14%）和 Integral Ad Science（收入
              $591M）的竞争，也面对全漏斗 GTM 安全平台 CHEQ。The Forrester Wave: Bot and Agent Trust Management Software Q2 2026
              评估了八家供应商，并把类别从“Bot Management”更名为“Bot and Agent Trust Management”，说明竞争前沿已从检测自动化流量转向为合法 AI 智能体治理信任。HUMAN 和
              Kasada 均被评为 Leader；Netacea 为 Strong Performer。Cloudflare 和 Akamai 未进入该 Wave，因为其产品仍是边缘/CDN
              平台的附属功能，而非专门构建的机器人情报产品。塑造竞争的最重要结构性动态，是智能体 AI 的扩散：HUMAN 2026 年基准数据显示，AI 驱动流量仅在 2025 年就增长 187%，智能体浏览器流量同比增长
              7,851%，意味着传统“是不是机器人”的二元判断已经过时，专门构建的信任管理平台相对传统 WAF 和 CDN 型检测具备结构性优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
