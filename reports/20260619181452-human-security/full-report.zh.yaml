  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 的客户群横跨五个不同购买细分，与其三支柱产品平台（广告保护、应用 / bot
              防御、账户保护）相匹配。按历史收入看，最大细分是广告技术：DSP、SSP、广告验证厂商、代理控股公司和品牌广告主，它们需要 MRC 认证的无效流量过滤来保护数字媒体预算。LinkedIn（B2B
              职业网络）、Sovrn（出版商平台）、Madhive（本地媒体 CTV OS）和 AdRoll（效果 DSP）是该垂直中的具名生产客户。第二个细分是程序化市场和商业平台——电商与零售品牌需要 Bot
              Defender 和 Sightline 阻断抓取、撞库和 ATO 攻击。Gartner Peer Insights 上来自 $500M–$1B 与 $10B+
              零售账户的评论，描述了高热度球鞋发售和多品牌电商组合中的生产部署。第三个细分是金融服务；2026 年 5 月 agentic AI 流量环比翻倍（HUMAN
              自有基准），带动账户保护和交易欺诈防御需求。第四个细分是更广义的企业安全团队——保护 web 应用、API 和移动渠道的组织——它们通过渠道计划访问 HUMAN 平台（Optiv 服务 73% 的 Fortune
              100，Consortium Networks 则提供托管安全礼宾服务）。旅游与酒店是正在出现的第五个细分；一位来自 $250M–$500M 旅游品牌的 Gartner 评论者描述了托管 bot
              防御的生产使用。地域分层以北美和西欧为主，Tel Aviv R&D 和英国商业团队支持 EMEA。公司未公开按垂直或地域划分的收入拆分。
