      - number: '3.3'
        title: 广告验证与欺诈测量同业
        blocks:
          - type: paragraph
            body: >
              HUMAN 2026 年 6 月推出 Ad Integrity Suite，将 IVT 情报、AI
              驱动的品牌安全与适配性、可视性整合到单一框架中，使其直接与两家主导性上市广告验证平台竞争。DoubleVerify（NYSE: DV）报告 FY2025 收入 $748.3M，同比增长 14%，净收入留存
              109%，每年测量 9.5 万亿笔可计费媒体交易。按 6sense 跟踪，DV 在广告欺诈检测工具中占 67% 市场份额，跟踪客户 4,324 家，而 IAS 为 167 家。Integral Ad
              Science（NASDAQ: IAS）截至 Q1 2026 的过去十二个月收入为 $590.67M，主要在品牌安全和程序化测量上竞争。DV 和 IAS 都与代理控股公司深度集成，并拥有 MRC
              认证测量，这构成很强的切换成本护城河。HUMAN 的差异化明确是网络安全级欺诈情报——用可解释的 URL
              级分类替代“黑箱”关键词信号，并由其行为网络支撑——以及把安全和广告验证收敛到一个安全、广告运营和营销团队可共享的统一平台。AdRoll 的 Global Head of Supply Platforms
              称赞该套件透明、减少歧义，说明即便面对占主导的 DV/IAS 组合，HUMAN 仍有差异化定位。CHEQ 占据互补利基：其每天处理六万亿个信号，覆盖一百万个受监测域名，声称误报率为
              0.009%，主要服务追求全漏斗 GTM 安全而非高端品牌安全库存测量的绩效营销人员和 SMB。广告验证领域是 HUMAN 战略风险最高的竞争向量，因为 DV 和 IAS 通过多年建立的 DSP/SSP
              集成拥有合同杠杆，收入规模约为 HUMAN 估计 ARR 的 10x–15x，具备资本能力在验证层追平 HUMAN 的任何产品创新。
