      - number: '5.2'
        title: 核心技术架构与检测方法
        blocks:
          - type: paragraph
            body: >-
              HUMAN 的检测架构拆成两个互补部署组件：Sensor 和 Enforcer。JavaScript Sensor（AgenticTrust 支持要求 9.6.6+ 版本）通过 HTML head 标签注入客户
              web 资产，采集设备指纹信号、行为生物特征、会话历史和网络特征。这条客户端信号流会传到 HUMAN 云端托管的 Decision Engine，做实时分析。


              Decision Engine 是平台核心智能层，每次交互处理 2,500+ 个信号，调用 400+ 个自适应 ML 模型，在两毫秒内给出判定——人类、bot 或 AI agent。约 95% 流量通过
              Precheck 机制自动验证，不增加用户摩擦；只有信号画像模糊的交互才会触发 Human Challenge。ML 技术栈包括 Profile Deviation Models
              2.0，用于检测登录后异常行为；攻击画像，用于把流量切分成不同的行为威胁画像；以及网络攻击事件检测，用于评估进行中攻击活动的范围和协同复杂度。HUMAN Threat Tracker
              把这些画像呈现为安全团队可行动的情报仪表盘。


              执行侧，HUMAN 的 Enforcer 支持 20 多种集成形态，覆盖主要 CDN 和云服务商（AWS Lambda@Edge、Azure Front Door、Cloudflare、Fastly
              VCL、Akamai EdgeWorker、Edgio）、服务器框架（Nginx、Apache、HAProxy、Envoy、Varnish）、语言运行时（Go、Java、.NET Core、Node
              Express）、API 网关（AWS API Gateway、Apigee、Kong）和企业平台（Salesforce）。AgenticTrust 模块不支持 Python、PHP、Ruby 和 Akamai
              ESI。FraudSensor 是 HUMAN 的竞价后广告检测组件，在广告投放后验证曝光，提供按供应路径切分、已过滤 bot 流量的可见率，构成 MRC 认证 Ad Viewability
              Measurement 产品的基础。
