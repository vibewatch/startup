      - number: '7.2'
        title: 运营、技术与 ML 风险
        blocks:
          - type: paragraph
            body: >
              HUMAN 的运营风险画像由三组相互关联的动态主导：云基础设施集中、bot 检测误报，以及加速中的 ML 模型军备竞赛。平台每周需要处理 20+ 万亿次数字交互，要求海量云计算和存储基础设施，AWS
              是主导公共云供应商。AWS 在 2026 年初遭遇两次重大基础设施故障：2026 年 3 月，UAE 数据中心遭 kinetic attack，分别扰乱 ME-CENTRAL-1 和 ME-SOUTH-1 区域
              38+ 与 46+ 项服务；2026 年 5 月，US-EAST-1 发生热事件，级联影响 150+ 个依赖云服务。任何影响 HUMAN 主要检测基础设施的同等故障，都会直接削弱其向 500+ 企业客户交付
              SLA 的能力；其中许多客户依赖 HUMAN 在结账或登录时做实时欺诈预防。HUMAN 没有公开多云或 active-active 故障转移架构细节，形成韧性姿态尽调缺口。


              误报问题是带有法律和商业后果的结构性弱点。合法用户使用隐私工具——广告拦截器、VPN、Tor、非主流浏览器和反指纹扩展——时，anti-bot 系统会产生误报。广告拦截器常常完全压制 anti-bot
              脚本，导致检测系统把会话归类为 bot；VPN 会把流量路由到共享 IP，而这些 IP 历史上可能被标为 bot 来源。对 HUMAN
              的企业客户而言，误报会增加合法用户摩擦、降低转化率，并可能触发退款或投诉循环，损害客户留存。该问题并非 HUMAN 独有，但会塑造其与低摩擦画像检测厂商的竞争动态。


              检测军备竞赛正在加剧。按 HUMAN 自有基准数据，2025 年自动化流量同比增长 23.51%，同期 AI 驱动流量增长 187%。HUMAN 最初曝光 BADBOX 1.0 后，BADBOX 2.0
              作为直接演进版本出现——说明威胁行为者在被打断后会快速迭代。DoubleVerify 在 2026 年 Q1 检测到的 CTV 欺诈计划变体比 2025 年 Q1 多 140%，背后由 AI-assisted
              fraudster tooling 推动。威胁不是静态的：agentic AI 流量同比增长 7,851%，二元 bot / human 分类越来越难处理有益与恶意 AI agent
              流量的差异。欺诈签名漂移意味着 HUMAN 的 400+ ML 模型必须持续再训练；20 个州隐私法下的监管碎片化，已经在主动约束数据管线完整性，削弱模型输入。
