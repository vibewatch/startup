      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 基础设施既有者以近零边际成本捆绑
            body: >
              Cloudflare 的机器人管理是 Enterprise 附加项，许多客户一旦签下 Enterprise CDN
              合同，就能以实际接近零的增量成本获得。这创造了纯供应商无法低于的结构性价格底线，并正在吸引原本可能评估 HUMAN 或 Kasada 的成本敏感型中端买方。Cloudflare 企业合同月费从 $5,000 到
              $80,000+ 不等，但捆绑动态意味着采购团队常把机器人防护视为免费。HUMAN 的回应必须是靠结果质量和威胁情报深度取胜，而不是靠价格——这个位置可防守，但随着 Cloudflare 持续投资检测
              ML，本质上也脆弱。
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
          - type: callout
            title: Forrester Wave 与 G2 双重验证巩固领导者认知
            body: >
              HUMAN 在同一季度（Q2/Summer 2026）同时获得 Forrester Wave Leader 认可（九项标准最高分，包括唯一在 Threat Research 获最高分的供应商）和 G2 Bot
              Detection and Mitigation 第一名，构成少见的分析师与同行双重验证。Kasada 也获得 Forrester Wave Leader 和高分，但 G2 客户评价领导位置只属于
              HUMAN。这些信号降低了企业采购委员会的流失风险，因为它们会把分析师排名作为购买验证；同时也形成声誉切换成本，竞争对手若没有在客户体验和产品创新上持续投入，很难跨越。
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP008
          - type: callout
            title: 广告验证切入面对 DV 和 IAS 的深厚既有护城河
            body: >
              DoubleVerify 在广告欺诈检测中占 67% 市场份额，NRR 达 109%，MRC 认证测量基础设施已经嵌入 DSP 和 SSP；HUMAN 2026 年 6 月推出的 Ad Integrity
              Suite 必须先跨过这些结构性门槛。HUMAN 用网络安全级能力做差异化，技术上有说服力，但代理控股公司采购验证服务靠关系驱动，周期通常跨多年，并深度嵌入交易台工作流。IAS 收入为 $591M。广告验证若要对
              HUMAN 收入形成有意义贡献，大概率需要 2–4 年建设管线并拿到 MRC 认证；核心 bot 管理竞争升温时，若 HUMAN 在这条线投入大量 R&D 资源，执行风险会上升。
