              - CP046
      - number: '3.2'
        title: 直接同业画像（机器人与智能体信任）
        blocks:
          - type: paragraph
            body: >
              Kasada 是 HUMAN 在 Forrester Wave 中最直接的同业，也被评为 Leader，在九项标准上获得最高可能分数，Strategy 得分强。2026 年 2 月由 EQT 领投的 $20M
              融资使 Kasada 总融资达到 $64.2M——远低于 HUMAN 估计的 $220M+——但公司声称保护超过 $150 billion 的 eCommerce
              收入，这是企业采购中的有力证明点。值得注意的是，Kasada 超过 85% 的客户此前使用过另一家机器人缓解供应商，暗示其在竞争性替换中胜率高。Kasada 以服务器端、无 CAPTCHA 检测和据称 250%+
              ROI 做差异化。Arkose Labs（融资 $114M，2021 年 Series C）占据不同利基，用 challenge-response
              游戏化方式通过互动谜题刻意挫败机器人操作者，而非被动行为分析。Adobe 是其企业客户之一。截至 2026 年 6 月，Arkose 在 PeerSpot Bot Management 类别中的
              mindshare 为 5.0%，高于上一年的 2.8%，说明尽管规模较小，企业认知度正在上升。DataDome（融资 $82M，2024 年 ARR $36M）聚焦电商和媒体，依靠快速边缘 ML 检测，服务
              Rakuten、Reddit、AngelList 等 300+ 家企业；其收入 2023 至 2024 年从 $16.9M 几乎翻倍至 $36M。Fingerprint
              以设备情报而非全栈机器人管理做差异化——其平台 2026 年每月识别超过 10 亿台独立设备，实现 65% ARR 增长，服务 2,000 家客户，NRR 为 128%，并新增 Booking.com
              为客户。Netacea（融资 $29.7M，估值 $55.9M）以完全托管的服务器端服务模式差异化，由 Netacea 代表客户处理检测配置和调优；其在 Q2 2026 Forrester Wave 中获
              Strong Performer 评级，并在 Web 和 LLM 抓取管理上得分最高。PeerSpot 2026 年 6 月 Bot Management 类别中，Imperva 以 15.7%
              mindshare 领先，Akamai 为 9.7%，两者均高于 HUMAN 的 8.1%；但这些既有位置更多反映安装基数，而非纯机器人情报能力。
