      - number: '8.5'
        title: 建议、退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >
              基于可获得的公开证据，建议为跟踪。HUMAN 讲得出可信的网络安全平台故事：有互联网规模验证、强机构背书，并站在高增长威胁类别（bot management、AI agent
              trust）上。该投资既非明显定价过高——2022 年 $1.5B 估值按所称 ARR
              与当前应用安全基准相符——也不能在缺少核心运营指标确认的情况下算明显有吸引力。置信度为中等，因为重大尽调缺口（NRR、毛利率、ARR 增速、债务状态、股权结构中的优先权）无法从公开来源补齐。


              退出准备度不完整。HUMAN 没有出现在任何已确认的 2026 年网络安全 IPO 管线中。公司需要用经审计指标补上财务披露缺口，证明明确的 Rule of 40 分数，并把 agentic AI
              产品线讲成增长驱动，IPO 叙事才可能在当前挑剔的公开市场成立。战略 M&A 是近期更可能的路径。具备战略契合的收购方包括 CrowdStrike（身份 + bot management 与 Falcon
              集成）、Palo Alto Networks（把反欺诈跨 SASE + XSIAM 平台化）和 Cloudflare（从 CDN/WAF 延伸到全栈 bot 与 AI agent 治理）。Google（Wiz
              之后）和 ServiceNow（Armis 之后）可能性较低，但财力足够。如果按当前倍数计算，2027–2030 年持有期的 MOIC 能跨过 3.5x 门槛，财务赞助方私有化也可能发生。


              论点失效触发项被定义为可观察事件，一旦出现就需要完整修订投资论点，而不只是调整情景。这些事件包括：经审计 ARR 披露低于 $80 million；确认 NRR 低于 95%；下调估值融资低于
              $1.0B；失去一个贡献 >15% ARR 的前 5 大客户；或监管行动瞄准核心广告验证流程。最终优先尽调清单（TV006）列出六项问题，若得到答案，会实质改变本评估的确信水平。
