  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图景
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 的核心技术能力，是每年在超过 1 千万亿次数字交互中采集并分析行为指纹信号；这带来重大且不断扩大的数据隐私暴露面。公司处理设备指纹、鼠标移动遥测、击键时序、浏览器属性、IP
              地址和跨资产行为模式，以区分 bot 与人类。截至 2026 年 1 月，美国已有 20 个州在积极执行综合隐私法，欧洲还有 GDPR；若 HUMAN
              的数据被错误归类为个人数据经纪，或其行为信号被归类为受监管数据，都可能触发执法。FTC 2026 年 2 月根据 Protecting Americans' Data from Foreign
              Adversaries Act（PADFAA）向 13 家数据经纪商发送正式警告信，表明监管机构正主动盯防大规模行为数据厂商。


              Department of Justice 的 Data Security Program（DSP）对向「受关注国家」批量跨境传输受覆盖个人数据施加额外限制。HUMAN 全球运营，并处理来自 222+
              国家设备的数据；任何把受覆盖数据路由经过 Israel（HUMAN 在当地有办公室和工程人员）的配置，或与存在受覆盖国家关联的实体合作，都需要符合 CISA 要求的安全控制。原告律师已经发展出一种新策略：即使
              DSP 本身没有私人诉权，也把 DSP 违规作为联邦 Wiretap Act 诉讼的前提，从而让 adtech 数据流暴露于集体诉讼。在线隐私诉讼数量从 2023 年约 200 起激增至 2024 年约
              4,000 起；HUMAN 用于欺诈预防的行为追踪技术，正是原告瞄准的技术。


              正面看，HUMAN 2026 年 4 月获得 Ad Viewability Measurement 的 MRC 认证，体现合规严谨度。MRC Digital Advertising Auction
              Transparency Standards 也在 2026 年 1 月最终确定，收紧了广告拍卖参与者的披露要求。包括 Check My Ads Institute
              在内的批评者认为，这些自律框架结构性不足，并呼吁政府监管；这意味着即使合规厂商，也会面对持续的行业级监管风险。截至 2026 年 6 月，公开资料未显示有直接针对 HUMAN Security
              的现行监管执法或诉讼；但考虑其行为数据规模，该风险虽为潜在风险，却很重大。
