      - - 深度 WAF/CDN/IAM/AEP 集成抬高运营切换成本
        - 客户可能整合到 Cloudflare 或 Akamai，以减少供应商数量
        - 高
        - HUMAN 的平台集成跨多层；替换它需要在整个技术栈重新配置检测
        - 获取客户合同条款（典型期限、自动续约、数据可携带性）及按原因拆分的流失归因
      - - 合作伙伴生态（OpenAI、AWS、Adobe）带来代理信任网络效应
        - 超大云厂商的竞争性代理信任框架可能抢先占位，或吸收 HUMAN 的位置
        - 高
        - Forrester 将 HUMAN 的合作伙伴计划列为突出项；超大云厂商合作是早期采用的现实信号
        - 确认关键 AI 运营方合作中的独家性或联合营销条款；评估合作伙伴渠道的收入贡献
      - - 既有行为信号网络从零复制成本高
        - 有超大云厂商背书、资金充足的新进入者，可能在 24–36 个月内建出相近规模
        - 中
        - 可信新进入者尚未出现；该品类需要多年数据积累
        - 跟踪代理信任与机器人管理初创公司的风险投资，寻找资本充足的新进入者迹象
      - - Ad Integrity Suite 借助既有行为网络，相比传统厂商提供更强 IVT 检测
        - DoubleVerify 与 IAS 具备 MRC 认证、DSP/SSP 集成，以及 HUMAN 欠缺的 10+ 年代理商信任
        - 高
        - HUMAN 的差异点在可解释性和网络安全级信号；取得 MRC 认证是达到同等地位的前提
        - 评估 MRC 认证时间表，以及广告代理控股集团对 HUMAN Ad Integrity Suite 的采用率
    notes: >
