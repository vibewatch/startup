  - id: FE001
    title: Human Defense Platform — 架构栈
    type: stack
    layout: standard
    summary: 从行为信号基础到统一产品界面的五层架构，展示 Sensor、Enforcer、Decision Engine 与 Satori 情报如何咬合。
    data:
      layers:
        - label: 产品界面层
          modules:
            - Sightline Cyberfraud Defense：统一可见性、策略管理、攻击分析
            - AgenticTrust：AI-agent 分类、信任评分、细粒度单 agent 权限控制
            - Page Intelligence：营销团队按页面和渠道实时查看 AI 驱动流量
        - label: 执行层
          modules:
            - 20+ Enforcer 集成：AWS Lambda@Edge、Cloudflare、Fastly VCL、Akamai EdgeWorker、F5、Nginx、Kong
            - Precheck：在不中断用户的情况下自动验证约 95% 的会话
            - Human Challenge：仅对模糊会话启用；降低摩擦
        - label: 感知层
          modules:
            - JavaScript Sensor v9.6.6+（客户端）：设备指纹、行为生物特征、会话信号
            - FraudSensor：对程序化广告曝光做出价后 IVT 检测
            - API / SDK 信号：移动 app 与服务端集成路径
        - label: 决策引擎层
          modules:
            - 每次互动分析 2,500+ 个信号
            - 400+ 自适应 ML 模型：Profile Deviation 2.0、攻击画像、网络事件检测
            - 低于 2ms 的判定延迟；多区域云托管
        - label: 基础：行为信号网络
          modules:
            - 每周 20T+ 次互动；30 亿台唯一设备；每年 1 quadrillion+ 次
            - 14+ 年行为威胁数据和模型训练历史
            - Satori IOC 管线：真实世界打击行动反哺模型增强
    approximationNotes: 分层由分析师根据公开架构披露归纳；内部服务边界和确切数据流拓扑未公开披露。
