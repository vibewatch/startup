      - number: '1.3'
        title: 融资历史、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >
              HUMAN 的资本历史从风险投资支持的初创公司，经过私募股权收购，演变为成长融资支持的网络安全平台。公司 2017 年完成由 Canaan Partners 领投的 Series B，2019 年 2 月完成由
              Scale Venture Partners 领投的 $43M Series C。2020 年 12 月，Goldman Sachs Merchant Banking Division、ClearSky
              Security 和 NightDragon 从 Paladin Capital Group、Grotech Ventures 等此前投资人手中联合收购 White Ops。交易条款未披露。收购时，公司有 170
              名员工，每周验证 10 万亿次交互。


              收购后，HUMAN 2021 年 2 月完成 $57M Series D 成长轮，Stereo Capital 等参投；随后在 2022 年 1 月完成由 WestCap 和 NightDragon 领投的
              $100M 成长轮，据报道该轮将公司估值定在约 $1.5 billion。2022 年 7 月，在与 PerimeterX 合并的同时，HUMAN 获得 Blackstone Credit 提供的 $100M
              债务额度。最近一次外部资本事件是 2024 年 10 月 9 日宣布的 $50M+ 成长轮，再次由 WestCap 领投，Goldman Sachs、ClearSky、NightDragon 和 Vertex
              Ventures US 参投。CEO Stu Solomon 表示，$50M 金额是有意控制的，目的是支持定向投资而不过度资本化。


              数据聚合方称，所有轮次合计融资约 $299-300M。但该数字可能不包括 Blackstone 的 $100M 债务额度，因为它是债务工具而非股权。当前 post-money 估值未公开披露。2022 年 1
              月的 $1.5B 估值是最近公开报道的数字，但早于 2022 年 PerimeterX 合并和 2024 年 10 月融资。精确股权比例、清算优先权和股权结构仍为私有信息。HUMAN 是以 Goldman
              Sachs 为锚的资产，WestCap 反复担任领投方，另有来自网络安全行业的战略共同投资人（NightDragon、ClearSky、Vertex Ventures US）。
