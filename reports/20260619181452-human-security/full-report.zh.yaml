        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 呈现出一个可信的 SaaS 平台业务：公司声称 ARR 超过 $100M，产品足迹具备高切换成本且可防守，并在 Forrester Bot Management Q3 2024
