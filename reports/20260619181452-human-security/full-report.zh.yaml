      - number: '5.4'
        title: 部署、集成与产品路线图
        blocks:
          - type: paragraph
            body: >-
              HUMAN 的部署模式是 cloud-native 且 integration-forward。客户可通过直接云合同、AWS Marketplace，或 Carahsoft（联邦与公共部门分销）等渠道伙伴访问
              HDP。平台可接入 CDN、WAF、CIAM 平台和分析基础设施，不要求客户重构技术栈。部署形态从轻量级纯 Sensor 实施（适合需要信号覆盖但不需要 inline enforcement 的组织），到 CDN
              或源站层的完整 Sensor-plus-Enforcer 部署。


              2026 年，AgenticTrust 把加密验证支持扩展到 Amazon Bedrock AgentCore 流量，AWS 合作显著加深。基于 Bedrock 平台构建的 AI agents 现在可通过
              HUMAN 的 AgenticTrust 模块完成加密签名和策略验证，让企业能对运行在 AWS 托管应用中的 AI agents 执行细粒度、逐动作控制。AgenticTrust（最低 Sensor 版本
              9.6.6）支持的集成目标包括 AWS Lambda@Edge v4.8.0 起、AWS API Gateway v0.1.1 起、Cloudflare v6.12.0 起、Fastly VCL v12.3.0
              起、F5 BIG-IP v3.1.1 起，以及 Azure Front Door v1.2.1 起。


              标准层面，HUMAN 2025 年 11 月开源 HUMAN Verified AI Agent 的参考实现，演示用 HTTP Message Signatures（RFC 9421）做加密 agent
              身份，具体通过 Ed25519 密钥对和 OWASP Agent Name Service（ANS v1.0）命名标准实现。这让 HUMAN 同时成为商业厂商和生态标准贡献者。2026 年 4 月 Agentic
              Visibility 扩展把 Sightline 的 bot 与 agent 分类数据原生延伸进 Adobe Experience Platform，使 HUMAN 成为唯一为营销测量团队提供原生 Adobe
              集成的 bot-management 厂商。
