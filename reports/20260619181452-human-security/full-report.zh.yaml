        - label: 部署：将 API / SDK 集成进登录、结账和广告投放流程
          value: 20
          note: 流失点：集成复杂度随平台而异；登录后流程需要充分 QA；切换成本在这里形成
        - label: 扩张：交叉销售至 ATO、Ad Fraud 或 AgenticTrust 模块
