      - number: '8.2'
        title: 融资背景与估值历史
        blocks:
          - type: paragraph
            body: >
              White Ops 于 2020 年 12 月被 Goldman Sachs Merchant Banking Division、ClearSky Security 和 NightDragon
              收购，价格未披露。2022 年 1 月，由此形成的 HUMAN Security 获得 WestCap 和 NightDragon 领投的 $100 million 增长轮，Goldman Sachs Asset
              Management 参投。2022 年 7 月，PerimeterX 合并把合并后实体估值定在约 $1.5 billion；同时，HUMAN 还从 Blackstone Credit 获得 $100
              million 债务额度。2022 年估值是在 2021–2022 年私募市场倍数高位环境中确定的，当时私营网络安全公司中位数超过 15x ARR。


              2024 年 10 月，HUMAN 完成 WestCap 领投的 $50 million-plus 增长轮，Goldman Sachs Asset Management、ClearSky
              Security、NightDragon 和 Vertex Ventures US 参投，使累计股权融资约为 $300 million。关键在于，公司没有披露新估值，也没有新机构投资人进入 cap
              table——这种模式可能反映现有投资人有意限制准入，也可能说明公司无法以更高价格吸引外部资本。Windsor Drake 指出，在 2021–2022
              年高估值融资的公司，常用带优先回报特征的“structured rounds”维持名义面值标记。


              截至 2026 年 6 月，Blackstone Credit $100M 债务额度（2022 年 7 月发放）的当前状态尚未公开确认。如果该额度仍未清偿，它会排在股权之前，在任何低于 $1.1B
              企业价值的场景中压缩股权回报。总风险资本（$300M 股权 + $100M 债务 = $400M）对应 $1.5B EV，意味着 3.75x 总 MOIC；对一笔自 2020
              年持有的仓位来说尚可，但并不突出。Premier Alternatives 将 HUMAN 当前私募估值列为“N/A”，且没有可用二级市场数据。
