      - number: '3.5'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >
              HUMAN Security 的主要护城河是其行为信号网络——2025 年分析超过一千万亿次交互——形成数据飞轮，任何单客户替代方案都很难从结构上复制。Satori Threat Intelligence and
              Research team 增加第二层护城河：Forrester 指出，HUMAN 协调的攻击打击行动“产生的影响远超其客户群”，意味着该团队承担类似公共品的防御职能，以单客户部署无法比拟的方式强化 HUMAN
              的信任品牌。平台与 WAF、CDN、IAM 和 Adobe Experience Platform 的深度集成创造的是运营层面而非合同层面的切换成本，因为拔掉 HUMAN
              需要重配整个技术栈中的检测逻辑。但三类替代风险很实质。第一，基础设施捆绑：对现有客户而言，Cloudflare 的机器人检测边际成本近乎为零，将继续吸走成本敏感的 SMB
              和中端市场。第二，高端竞争激烈：Kasada 85% 客户来自竞争对手的胜率，以及 Forrester 共同 Leader 位置，说明 HUMAN 的企业细分正被积极争夺，而非防御性主导。第三，广告验证替代：DV
              和 IAS 的代理嵌入式测量关系比 HUMAN 的广告产品早十多年，即使 HUMAN 技术更优，既有者仍有显著惯性。正面的耐久性信号包括 HUMAN 下降但仍存在的 PeerSpot
              mindshare（8.1%，低于此前 11.6%），这反映 Cloudflare 和 Imperva 增长，而非纯专业厂商替代；以及 Forrester 将类别更名为“Bot and Agent Trust
              Management”，使市场定义与 HUMAN 在 AgenticTrust 上的平台投资对齐。登录后账户攻陷同比增长四倍（每组织平均 402,000 次尝试）和自 2022 年以来盗刷测试增长
              250%，创造了结构性需求顺风，帮助护城河抵御商品化；攻击复杂度越高，行为网络专家与边缘捆绑替代方案之间的差距就越大。
