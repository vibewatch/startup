  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention metrics
      missingEvidence: NRR, GRR, average contract length, cohort retention percentages by segment and vintage
      whyItMatters: Without NRR/GRR the durability of HUMAN's revenue base cannot be assessed; a low NRR would significantly alter the investment thesis
      diligencePath: Request management data room; target NRR and top-10 customer ARR concentration as condition of term sheet
      relatedQuestionRefs: [QU004, QU006]

    - type: private-evidence-only
      severity: material
      topic: customer count and concentration
      missingEvidence: Customer count by vertical and revenue tier; top-5 or top-10 customer share of ARR
      whyItMatters: The 500+ brands claim is unaudited and aggregates logos; adtech concentration could make HUMAN vulnerable to ad-market cyclicality
      diligencePath: Request ARR breakdown by product line and vertical under NDA; compare to Gartner/Forrester customer-reference distribution
      relatedQuestionRefs: [QU003, QU023]
      relatedTableRefs: [TU002]

    - type: missing-source
      severity: material
      topic: geographic customer distribution
      missingEvidence: Revenue or customer count breakdown by geography (North America vs. EMEA vs. APAC)
      whyItMatters: HUMAN claims global presence but all named customers are North American; EMEA and APAC penetration is unverified
      diligencePath: Ask management for geographic ARR breakdown; check Tel Aviv office and UK commercial headcount growth
      relatedQuestionRefs: [QU011]

    - type: missing-source
      severity: material
      topic: financial services named customers
      missingEvidence: At least one named production customer in financial services (bank, fintech, payments processor)
      whyItMatters: Financial services is cited as a growth vertical in 2026 benchmarks but no customer proof exists; the ATO and transactional fraud market requires credible reference customers
      diligencePath: Request reference customers in financial services from HUMAN; check if Sightline has formal DORA/NIS2 compliance positioning for EU financial services
      relatedQuestionRefs: [QU002, QU016]
      relatedTableRefs: [TU003]

    - type: stale
      severity: minor
      topic: LinkedIn integration outcomes post-launch
      missingEvidence: Updated IVT detection rates for the LinkedIn integration beyond the initial 30-day window (May–June 2024)
      whyItMatters: The <1% IVT claim is 24 months old; no update from LinkedIn or HUMAN confirms the relationship is current and performing
      diligencePath: Ask HUMAN for current LinkedIn integration metrics; check if LinkedIn has renewed or expanded since 2024
      relatedQuestionRefs: [QU008]

    - type: enumeration-incomplete
      severity: material
      topic: named customer proof coverage
      missingEvidence: Production deployments in enterprise security (Fortune 500 non-adtech), e-commerce (named retailer), and financial services verticals
      whyItMatters: Named proof table is partial by design; the enumeration skews to adtech which may reflect historical concentration rather than current GTM balance
      diligencePath: Request HUMAN's customer reference list; cross-check against Gartner Peer Insights and G2 reviewer industries for unlisted but verifiable customers
      relatedQuestionRefs: [QU002, QU016, QU024]
      relatedTableRefs: [TU003]

acknowledgedWarnings:
  - dimension: figureType
    reason: >
      The planned "retention-repeat-cohort" figure requires time-series retention percentage data (NRR or customer-level
      cohort retention by vintage). HUMAN Security is a private company that does not disclose NRR, GRR, or cohort
      retention rates. Fabricating these percentages would violate the no-invent-metrics policy. A bar figure (FU004)
      comparing G2 and Gartner Peer Insights review platform ratings against category benchmarks is substituted as the
      best available proxy for retention sentiment. The underlying evidence gap is documented in evidenceGaps.
