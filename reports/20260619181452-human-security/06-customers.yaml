company:
  name: HUMAN Security
chapter:
  number: 6
  title: Customers
  summary: >
    HUMAN Security serves 500+ global brands across five primary segments—advertising/adtech platforms, programmatic
    marketplaces, e-commerce and retail, financial services, and enterprise security teams—with production deployments
    verified at Madhive, LinkedIn, Sovrn, AdRoll, and channel partners Optiv and Consortium Networks. The platform
    now analyzes over 30 trillion digital interactions per week (updated from the 20T cited at the October 2024 fundraise),
    reflecting genuine scale. Customer satisfaction signals are strong—G2 ranks HUMAN #1 in Bot Detection & Mitigation
    for 2026 and Gartner Peer Insights gives the product a 4.7-out-of-5 overall score with 4.8 on support—but
    retention metrics (NRR, GRR, churn) are entirely undisclosed, and concentration risk in ad-tech is a structural gap
    unaddressed by any public customer-count or revenue-segment disclosure.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation
    body: >
      HUMAN Security's customer base spans five distinct buying segments aligned to its three-pillar product platform
      (advertising protection, application/bot defense, account protection). The largest segment by historical revenue
      is advertising technology: DSPs, SSPs, ad-verification vendors, agency holding companies, and brand advertisers
      who require MRC-accredited invalid traffic filtration for digital media budgets. LinkedIn (B2B professional network),
      Sovrn (publisher platform), Madhive (local-media CTV OS), and AdRoll (performance DSP) are named production
      customers in this vertical. The second segment is programmatic marketplaces and commerce platforms—e-commerce and
      retail brands requiring Bot Defender and Sightline to stop scraping, credential-stuffing, and ATO attacks. Gartner
      Peer Insights reviews from $500M–$1B and $10B+ retail accounts describe production deployments for high-heat sneaker
      releases and multi-brand e-commerce portfolios. The third segment is financial services, where agentic AI traffic
      doubled month-on-month in May 2026 (HUMAN's own benchmark), driving demand for account-protection and transactional
      fraud defense. The fourth segment is broader enterprise security teams—organizations protecting web applications,
      APIs, and mobile channels—who access HUMAN's platform through the channel program (Optiv, serving 73% of the
      Fortune 100, and Consortium Networks as a managed security concierge). Travel and hospitality is an emerging fifth
      segment; a Gartner reviewer from a $250M–$500M travel brand describes production use of managed bot defense.
      Geographic segmentation is predominantly North America and Western Europe, with Tel Aviv R&D and UK commercial
      presence supporting EMEA. No revenue breakdown by vertical or geography is publicly disclosed.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]

  - id: adoption-trajectory
    title: Adoption Trajectory and Scale
    body: >
      HUMAN's most credible adoption signal is the sheer scale of its collective defense network. The company's 2026
      State of AI Traffic & Cyberthreat Benchmark Report (released March 26, 2026) reports analysis of over one
      quadrillion digital interactions in calendar year 2025, while the Gartner Peer Insights company profile (updated
      February 2026) states HUMAN verifies "more than 30 trillion digital interactions per week across advertising,
      marketing, e-commerce, government, education and enterprise security." This represents an increase from the 20
      trillion per week figure cited at the October 2024 fundraise, suggesting genuine network growth. The company claims
      500+ global brands and organizations as customers, a metric that has been consistent in press releases from 2022
      through 2026. A meaningful adoption acceleration marker is the exponential growth of agentic AI traffic: HUMAN's
      platform identified a 7,851% year-over-year increase in AI agent traffic in 2025, and legitimate AI-driven traffic
      overall grew 187% over the same period, concentrating heavily in retail/e-commerce, streaming/media, and
      travel/hospitality—HUMAN's three leading customer verticals by volume. Named deployments confirmed through public
      sources include LinkedIn (integrated May 2024, protecting 1 billion+ member professional network), AdRoll (Oct
      2025, first DSP to combine HUMAN pre-bid fraud defense with viewability), Sovrn (long-standing partner, cited in
      April 2026 MRC accreditation announcement), and Madhive (described by HUMAN CEO Stu Solomon as a "long-standing
      partner" in June 2025). No ARR growth trajectory, customer count CAGR, or deployment milestone cadence is publicly
      disclosed for this private company, creating material tracking gaps.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: named-customer-proof
    title: Named Customer Proof
    body: >
      Six named customer or partner deployments are supportable from public evidence as of June 2026. Madhive, the leading
      local-media CTV operating system trusted by Fox, Scripps, and Hearst, is the strongest case study: in June 2025
      Madhive announced a Fraud Free Guarantee powered by HUMAN's MRC-accredited pre-bid and post-bid fraud detection,
      covering all 30,000+ daily local campaigns averaging under $5,000 per budget. HUMAN CEO Stu Solomon called Madhive
      a "long-standing partner" in the public announcement, indicating a multi-year production relationship. LinkedIn
      integrated HUMAN in May 2024, with the deployment detecting less than 1% of desktop impressions as invalid traffic
      across LinkedIn's publisher network including CTV in the first 30 days—a quantified outcome with an named
      spokesperson (VP Abhishek Shrivastava of LinkedIn Marketing Solutions). Sovrn, a publisher/advertiser platform,
      is cited by name in HUMAN's April 2026 MRC viewability accreditation announcement, with MD Jeff Meglio providing
      a testimonial about "stronger campaign performance" and "more efficient budget utilization." AdRoll became the first
      DSP to combine HUMAN FraudSensor post-bid measurement with MediaGuard pre-bid technology in October 2025, enabling
      IVT detection within 12 milliseconds. Consortium Networks CEO Nate Ungerott provided a public testimonial at the
      August 2024 partner program launch, describing HUMAN as bringing "exceptional value to our customers" for
      sophisticated fraud defense. Optiv, which serves 73% of the Fortune 100, is named by HUMAN as an "integral ally"
      channel partner. The Forrester Wave Q2 2026 report additionally notes that "HUMAN's customers compliment the level
      of detail and attack insight that they receive from the Sightline feature," indicating reference-quality deployments
      beyond the named set, though without naming specific organizations.
    claimRefs: [CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022]
    tableRefs: [TU003]
    figureRefs: [FU001, FU003]

  - id: retention-durability
    title: Retention and Durability Evidence
    body: >
      HUMAN Security does not disclose NRR, GRR, churn rates, average contract length, or cohort retention for any
      customer segment—standard for a private company at this stage. Proxy evidence for retention and durability is
      available from review platforms and partner testimonials. On Gartner Peer Insights (updated through April 2026),
      HUMAN Sightline Cyberfraud Defense holds a 4.7/5 overall rating with 4.8 on Service & Support and 4.7 on Product
      Capabilities. One reviewer from a travel and hospitality company ($250M–$500M) rates the managed service 5/5
      noting "their managed service is very responsive" and ongoing multi-year collaboration. A reviewer from a 1B–10B
      USD retail company specifically states "We have a long relationship with Human"—indicating multi-year tenure. A
      10B+ retail company reviewer describes HUMAN enabling "a very secure online presence" across "all of our brands"—
      suggesting enterprise-wide deployment breadth. G2 recognized HUMAN as Best Security Software Product of 2026 (#1
      in Bot Detection & Mitigation), a crowd-sourced peer validation. The Forrester Wave Q2 2026 report notes positive
      customer feedback specifically on attack insight depth, implying reference-quality relationships. One adverse signal:
      a 3/5 Gartner review from a $500M–$1B retail company describes HUMAN as a "black box"—limited visibility into
      detection logic, no proactive change notifications, and minimal manual tuning capability. This represents a real
      procurement friction point and a churn risk for technically-demanding security buyers. Retention signals from the
      HUMAN Advantage Partner Program (launched August 2024) note the three-tier structure is built around retention
      as a core metric alongside bookings and training, suggesting management awareness of this dimension, but no
      retention data is published. Industry benchmark data indicates 35% of cybersecurity vendor churn is attributable
      to CX rather than product performance, and 42% of cybersecurity customers switched vendors in the past two years—
      a sector headwind HUMAN's managed-service approach and Gartner 4.8/5 support score is designed to counter.
    claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: expansion-concentration
    title: Expansion and Concentration Risk
    body: >
      HUMAN's primary land-and-expand motion operates through three vectors: (1) cross-sell from advertising protection
      into application/bot defense and account protection within the same enterprise account; (2) agentic AI trust
      (AgenticTrust module within Sightline) as a greenfield upsell driver given the 7,851% growth in AI agent traffic;
      and (3) the HUMAN Advantage Partner Program launched August 2024, which deploys Optiv and Consortium Networks as
      channel multipliers under a three-tier structure rewarding annualized bookings, training completion, and customer
      retention. Strategic technology partnerships that expand addressable accounts include AWS Bedrock AgentCore
      browser support (cryptographically signed AI agent verification) and the Riskified partnership (August 2026 per
      RivalSense) for ecommerce fraud prevention via AI Agent Approve and AI Agent Intelligence.
      Concentration risk is material on two dimensions. First, HUMAN's legacy revenue base is heavily concentrated in
      digital advertising and adtech—a vertical where DoubleVerify and IAS command much larger market shares and
      where budget cycles are tied to media spend decisions rather than security budgets, creating sensitivity to
      macro advertising downturns. The Gartner Peer Insights reviewer base skews toward retail and travel sectors
      for application defense, but the company's historical brand identity and most public case studies remain
      ad-tech-centric. Second, no customer count, top-10-customer revenue share, or revenue-by-segment data is
      available for a private company, making it impossible to quantify concentration from external evidence. The
      HUMAN Advantage Program's deal registration and incumbency protections are designed to reduce channel conflict
      and improve account durability, but the program is less than two years old and maturity signals are absent.
      Procurement friction—6–7 month enterprise sales cycles requiring legal, MSA, and pricing negotiation before
      direct-sales channel program—has been explicitly acknowledged in prior financial chapter evidence and is a
      retention-adjacent risk. The channel model launched specifically to reduce this friction via managed onboarding.
    claimRefs: [CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038]
    tableRefs: [TU005]

