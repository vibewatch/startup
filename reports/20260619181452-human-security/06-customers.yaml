        - label: "Evaluation: RFP / POC on IVT or bot problem (6–7 month direct sales cycle)"
        - label: "Evaluation (channel): Procurement via Optiv / Consortium Networks — enterprise security buyer path"
        - label: "Deployment: Ad Fraud Defense (pre-bid) + Ad Fraud Sensor (post-bid) — adtech buyer activation"
        - label: "Deployment: Bot Defender + Sightline (ATO, scraping, credential stuffing) — e-commerce and enterprise"
