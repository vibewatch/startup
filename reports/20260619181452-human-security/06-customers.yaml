  - id: TU005
    title: Expansion Drivers and Concentration Risk
    columns:
      - Driver / Risk
      - Type
      - Evidence
      - Impact
      - Diligence Path
    rows:
      - - AgenticTrust module upsell
        - Expansion driver
        - "7,851% YoY AI agent traffic growth; AWS Bedrock AgentCore support; Forrester Wave highest-score criterion"
        - High — first-mover greenfield expansion within existing customer base
        - Ask what % of existing Sightline customers have enabled AgenticTrust by mid-2026
      - - HUMAN Advantage Partner Program
        - Expansion driver (channel)
        - "Launched Aug 2024; Optiv + Consortium Networks named; 3-tier structure; deal registration + incumbency"
        - Medium — less than 2 years old; partner enablement track record unclear
        - Request partner-sourced bookings as % of total new ARR in FY2025 and H1 2026
      - - MRC viewability accreditation (April 2026)
        - Expansion driver (adtech)
        - "Sovrn early adopter; AdRoll DSP integration; IVT-filtered viewability is differentiated vs. DV and IAS"
        - Medium — opens viewability budget alongside fraud budgets for same customers
        - Ask if viewability is bundled or separately priced; attached revenue per account
      - - Riskified partnership (ecommerce)
        - Expansion driver (new vertical)
        - "RivalSense: HUMAN + Riskified partnership Aug 2026 for ecommerce AI Agent Approve and AI Agent Intelligence"
        - Medium — extends reach into merchant/payment fraud buyers not in core adtech base
        - Verify partnership terms; ask for co-sell pipeline
      - - Ad-tech segment concentration
        - Concentration risk
        - "Majority of public case studies and named deployments in adtech/programmatic; historical brand = 'ad fraud company'"
        - High — ad budgets are macro-correlated; DV and IAS are larger-scale alternatives in same vertical
        - Ask for revenue breakdown by product line and vertical; flag if >50% from adtech
      - - Private company, no customer-count disclosure
        - Concentration risk (information gap)
        - "Zero public disclosure of top-customer share, revenue by segment, or customer count by cohort"
        - High — impossible to assess concentration without management data room access
        - Request top-10 customers as % of ARR and vertical breakdown under NDA
      - - "Enterprise direct-sales cycle friction (6–7 months)"
        - Concentration risk / churn risk
        - "Acknowledged in prior chapter; channel program designed to address; MSA and pricing complexity"
        - Medium — long cycles reduce switching propensity but also create entry barriers for new accounts
        - Ask if channel program has reduced median sales cycle; target <4 months for mid-market via partner
    notes: >
      Expansion drivers are based on publicly announced partnerships and product launches. Concentration risk is
      structural (adtech-heavy brand and customer base) compounded by private company opacity. The Riskified
      partnership date is from RivalSense competitive intelligence and should be independently verified.
    claimRefs: [CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038]

