callouts:
  - calloutType: strength
    title: MRC Accreditation as Procurement Unlock
    body: >
      HUMAN's dual MRC accreditations (fraud defense since 2025, viewability since April 2026) convert
      discretionary fraud-prevention spend into a compliance-grade requirement for major advertisers and platforms.
      MRC accreditation is independently audited, not self-declared, and directly referenced by Madhive in its
      Fraud Free Guarantee and by Sovrn as the basis for viewability measurement adoption. This is a structural
      procurement accelerator absent from most bot-management competitors.
    claimRefs: [CU015, CU016, CU028]

  - calloutType: risk
    title: Black-Box Perception Risk in Enterprise Bot Defense
    body: >
      A Gartner Peer Insights review from a $500M–$1B retail customer (April 2026) explicitly describes HUMAN
      Sightline as a "black box" — limited visibility into detection logic, no proactive change notification,
      and minimal manual tuning. Enterprise security buyers increasingly demand explainability and auditability.
      If HUMAN does not ship a transparency roadmap, this perception could accelerate churn in technically
      demanding security-buyer segments and reduce win rates in competitive evaluations against DataDome or Cloudflare.
    claimRefs: [CU026, CU027, CU029]

  - calloutType: risk
    title: Adtech Concentration — No Disclosed Diversification Progress
    body: >
      HUMAN's public case study and named deployment evidence remains heavily adtech-centric (LinkedIn, Sovrn,
      Madhive, AdRoll). No named enterprise application-security or financial-services customer is publicly confirmed.
      If more than 50% of ARR derives from adtech (plausible given the company's origin and brand), HUMAN carries
      macro advertising-cycle correlation risk and competitive pressure from DV and IAS with similar MRC-accredited
      offerings. No data is available to quantify this risk; it requires a management data room to assess.
    claimRefs: [CU035, CU036, CU037, CU038]

  - calloutType: insight
    title: Partner Channel Program as Durability Signal
    body: >
      The HUMAN Advantage Partner Program (launched August 2024) structures partner compensation around customer
      retention, not just bookings. This is a deliberate mechanism to reduce channel conflict and improve account
      durability — particularly relevant given prior direct-sales-only enterprise friction. The program is early
      (less than two years), but Optiv's Fortune 100 reach and Consortium Networks' concierge model represent
      genuine enterprise distribution if the pipeline matures. Diligence should track partner-sourced new ARR as
      a percentage of total by Q3 2026.
    claimRefs: [CU031, CU032, CU033, CU034]

