  name: HUMAN Security
chapter:
  number: 1
  title: Company Overview
  summary: >-
    HUMAN Security (formerly White Ops) is a New York-based cybersecurity company founded in 2012 that
    protects organizations from bots, digital fraud, and automated abuse through its Human Defense Platform.
    The company operates at internet scale, verifying over 20 trillion digital interactions weekly across
    3 billion unique devices. After a Goldman Sachs-led acquisition in 2020, a $1.5 billion valuation in
    2022, and a $50M+ growth round in October 2024, HUMAN has approximately $300M in total capital raised.
    The CEO transition from co-founder Tamer Hassan to veteran Stu Solomon in January 2024 represents the
    primary governance development; financial metrics including revenue, ARR, and current valuation remain
    private and undisclosed.
sections:
  - id: section-1
    title: Identity, headquarters, and platform model
    body: >
      HUMAN Security, Inc. is a privately held cybersecurity company headquartered in New York City, with
      additional offices in Miami, Santa Clara, Tel Aviv (Israel), and the United Kingdom. The company
      was founded in 2012 in Brooklyn, New York under the name White Ops by Tamer Hassan, Michael Tiffany,
      Dan Kaminsky, and Ash Kalb. It rebranded to HUMAN Security in 2021 to reflect an expanded scope
      beyond advertising fraud into full-stack enterprise and consumer security. The company describes
      itself as the trust layer for media and agentic commerce platforms, verifying engagement, reducing
      fraud, and enabling authentic interactions across humans, bots, and AI agents.


      HUMAN's core commercial offering is the Human Defense Platform (HDP), which the company positions
      as a unified platform delivering protection across three principal pillars: Media Security (digital
      advertising fraud, invalid traffic detection, and ad integrity), Application and Enterprise Security
      (account takeover, credential stuffing, fake account creation, web scraping, and carding), and
      Account Protection (identity and authentication fraud). The platform's stated scale metrics are
      verifying more than 20 trillion digital interactions weekly across 3 billion unique devices, using
      2,500+ signals per interaction, analyzed by 400+ adaptive machine learning models, to make binary
      bot-or-human decisions in milliseconds. The company serves 500+ global brands across media, finance,
      retail, government, education, and enterprise security verticals.


      As of mid-2026, HUMAN has expanded its platform into the agentic AI era, launching HUMAN Sightline
      Cyberfraud Defense, a unified trust and defense layer protecting digital businesses from bot attacks,
      human-led fraud, transaction abuse, and AI-driven risks across the full customer journey, and
      AgenticTrust, which allows customers to detect, classify, and govern AI agents operating on their
      platforms. HUMAN also operates the Satori Threat Intelligence and Research Team, which drives
      threat intel and orchestrates public-private disruptions of cybercriminal operations. The company
      characterizes its competitive position as the largest threat detection network globally by weekly
      interaction volume. Revenue model and pricing remain private.
