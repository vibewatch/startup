callouts:
  - calloutType: strength
    title: Threat intelligence as core differentiator
    body: >-
      HUMAN's Satori Threat Intelligence and Research Team has orchestrated the most significant
      public takedowns in ad fraud and bot abuse history — 3ve, Methbot, PARETO, VASTFLUX, and BADBOX.
      Forrester specifically cited HUMAN as the only vendor to receive the top Threat Research score in
      Q2 2026, noting that its threat intelligence takedowns create impact far beyond its direct customer
      base. This distinguishes HUMAN from pure-technology bot management vendors and creates a credibility
      moat with enterprise CISOs and media security buyers.
    claimRefs:
      - CO029
      - CO030
      - CO036
      - CO037
      - CO038
      - CO045
  - calloutType: risk
    title: Private financials and stale valuation create diligence gap
    body: >-
      Revenue, ARR, current valuation, and full cap table are undisclosed. The last publicly
      reported valuation of ~$1.5B dates to January 2022 and predates the PerimeterX merger, the
      clean.io acquisition, the Blackstone debt facility, and the October 2024 growth round.
      The $50M October 2024 round was deliberately undersized by the CEO, which may signal either
      capital discipline or a deliberate avoidance of a re-rating event. All financial diligence
      requires data room engagement.
    claimRefs:
      - CO022
      - CO023
      - CO025
      - CO027
      - CO041
  - calloutType: insight
    title: Goldman Sachs anchor creates PE-style exit expectations
    body: >-
      The December 2020 acquisition by Goldman Sachs Merchant Banking Division structurally converted
      HUMAN from a venture-backed company to a PE-sponsored asset. Goldman Sachs has maintained board
      representation (Anthony Arnold) and participated in the 2024 round, suggesting no imminent exit,
      but the PE ownership structure implies eventual liquidity expectations — IPO, strategic sale, or
      secondary — that will affect governance, compensation, and management incentives in ways not
      visible from public materials alone.
    claimRefs:
      - CO021
      - CO022
      - CO025
      - CO026
      - CO041

