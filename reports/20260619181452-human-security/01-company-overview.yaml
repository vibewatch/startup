  - id: section-3
    title: Funding history, valuation, and investor map
    body: >
      HUMAN's capital history runs from venture-backed startup through a private equity buyout and into
      a growth-funded cybersecurity platform. The company completed its Series B in 2017 led by Canaan
      Partners and a $43M Series C in February 2019 led by Scale Venture Partners. In December 2020,
      Goldman Sachs Merchant Banking Division, ClearSky Security, and NightDragon jointly acquired White
      Ops from previous investors including Paladin Capital Group and Grotech Ventures. Terms were not
      disclosed. At the time of the acquisition, the company had 170 employees and was verifying 10
      trillion interactions per week.


      Post-acquisition, HUMAN raised $57M in a Series D growth round in February 2021 with participation
      from Stereo Capital and others, and then completed a $100M growth round in January 2022 led by
      WestCap and NightDragon, which was reported to value the company at approximately $1.5 billion. In
      July 2022, concurrent with the PerimeterX merger, HUMAN secured a $100M debt facility from Blackstone
      Credit. The most recent external capital event is a $50M+ growth round announced October 9, 2024,
      led again by WestCap, with participation from Goldman Sachs, ClearSky, NightDragon, and Vertex
      Ventures US. CEO Stu Solomon stated that the $50M amount was deliberately constrained to enable
      targeted investments without over-capitalization.


      Total capital raised is reported as approximately $299-300M across all rounds, according to data
      aggregators. However, this figure may not include the $100M Blackstone debt facility, which was a
      debt instrument rather than equity. No current post-money valuation is publicly disclosed. The
      $1.5B valuation from January 2022 is the most recent publicly reported figure, but it predates both
      the 2022 PerimeterX merger and the October 2024 round. Exact equity ownership percentages, liquidation
      preferences, and cap-table composition remain private. HUMAN is a Goldman Sachs-anchored asset with
      recurring lead investor WestCap and strategic co-investors from the cybersecurity industry (NightDragon,
      ClearSky, Vertex Ventures US).
