chapter:
  number: 3
  title: Competitors
  summary: >
    HUMAN Security competes across two converging markets—bot and agent trust management, and digital
    ad verification—where it holds a Forrester Wave Leader position in Q2 2026 and a G2 #1 ranking,
    but faces intensifying pressure from Kasada (also a Wave Leader), infrastructure incumbents
    Cloudflare and Akamai bundling bot management at lower cost, and ad-verification giants
    DoubleVerify and IAS defending entrenched agency relationships. The company's strongest moats
    are its quadrillion-interaction behavioral dataset, the Satori Threat Intelligence team whose
    coordinated takedowns extend value beyond any single customer, and deep platform integrations
    that raise switching costs across security and ad-ops workflows.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >
      HUMAN Security sits at the intersection of two rapidly evolving markets. In bot and agent trust
      management, the vendor set spans purpose-built specialists (Kasada, Arkose Labs, DataDome,
      Netacea, Fingerprint), infrastructure-native players who bundle detection into broader platforms
      (Cloudflare, Akamai, Imperva/Thales), and the status quo of in-house rule engines and
      rate-limiting logic that many enterprises still rely on as a first-line filter. In digital ad
      verification, HUMAN's newly launched Ad Integrity Suite (June 2026) enters direct competition
      with publicly traded DoubleVerify ($748M FY2025 revenue, 14% YoY growth) and Integral Ad
      Science ($591M revenue), as well as the full-funnel GTM security platform CHEQ. The Forrester
      Wave: Bot and Agent Trust Management Software Q2 2026 evaluated eight vendors and renamed the
      category from "Bot Management" to "Bot and Agent Trust Management," signaling that the competitive
      frontier has shifted from detecting automated traffic to governing trust for legitimate AI agents.
      HUMAN and Kasada were both named Leaders; Netacea was a Strong Performer. Cloudflare and Akamai
      were not evaluated in the Wave, as their offerings remain adjuncts to edge/CDN platforms rather
      than purpose-built bot intelligence products. The most important structural dynamic shaping
      competition is the proliferation of agentic AI: HUMAN's 2026 benchmark data shows AI-driven
      traffic grew 187% in 2025 alone, with agentic browser traffic up 7,851% year-over-year, meaning
      the traditional "bot or not" binary is obsolete and purpose-built trust management platforms
      have a structural advantage over legacy WAF and CDN-based detection.
