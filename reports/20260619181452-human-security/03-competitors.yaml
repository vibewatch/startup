  - id: moat-durability-displacement-risk
    title: Moat Durability and Displacement Risk
    body: >
      HUMAN Security's primary moat is its behavioral signal network—over one quadrillion interactions
      analyzed in 2025—which creates a data flywheel that is structurally difficult for any single-
      customer alternative to replicate. The Satori Threat Intelligence and Research team adds a second
      moat layer: Forrester noted that HUMAN's coordinated attack takedowns "create impact far beyond
      its customer base," meaning the team operates as a public-good defense function that reinforces
      HUMAN's trust brand in ways no single-customer deployment can match. The platform's deep
      integrations across WAF, CDN, IAM, and Adobe Experience Platform create switching costs that
      are operational rather than contractual, since unplugging HUMAN requires reconfiguring detection
      logic across the entire technology stack. However, three displacement risks are material. First,
      infrastructure bundling: Cloudflare's near-zero marginal cost for bot detection for existing
      customers will continue to capture cost-sensitive SMB and mid-market segments. Second, competitive
      intensity at the top: Kasada's 85%-of-customers-from-competitors win rate and the Forrester
      co-Leader position show that HUMAN's enterprise segment is actively contested rather than
      defensively dominant. Third, ad verification displacement: DV and IAS have agency-embedded
      measurement relationships that predate HUMAN's ad offering by over a decade, giving incumbents
      significant inertia even against a technically superior product. Positive durability signals
      include HUMAN's declining-but-present PeerSpot mindshare (8.1%, down from 11.6%), which
      reflects Cloudflare and Imperva gains rather than pure-play specialist displacement, and the
      Forrester renaming of the category to "Bot and Agent Trust Management" which aligns the market
      definition with HUMAN's platform investments in AgenticTrust. Post-login account compromise
      quadrupling year-over-year (402,000 attempts per organization on average) and 250% carding
      growth since 2022 create structural demand tailwinds that preserve the moat against
      commoditization, as attack sophistication directly amplifies the gap between behavioral-network
      specialists and edge-bundled alternatives.
