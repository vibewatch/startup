callouts:
  - calloutType: risk
    title: Infrastructure Incumbents Bundling at Near-Zero Marginal Cost
    body: >
      Cloudflare's bot management is an Enterprise add-on that many customers access at effectively
      zero incremental cost once on an Enterprise CDN contract. This creates a structural pricing
      floor that pure-play vendors cannot undercut, and it is capturing cost-sensitive mid-market
      buyers who might otherwise evaluate HUMAN or Kasada. Enterprise contracts range from $5,000
      to $80,000+/month for Cloudflare, but the bundling dynamic means bot protection is often
      perceived as free by the procurement team. HUMAN's response must be to win on outcome quality
      and threat intelligence depth, not on price—a defensible but inherently vulnerable position
      as Cloudflare continues to invest in detection ML.
    claimRefs:
      - CP031
      - CP032

  - calloutType: strength
    title: Forrester Wave and G2 Co-Validation Solidifies Leadership Perception
    body: >
      HUMAN's simultaneous recognition as Forrester Wave Leader (highest scores in nine criteria,
      including the only vendor with top score in Threat Research) and G2 #1 in Bot Detection and
      Mitigation in the same quarter (Q2/Summer 2026) represents unusually strong analyst and peer
      co-validation. Kasada also earned Forrester Wave Leader status and high scores, but the G2
      customer-review leadership is exclusively HUMAN's. These signals reduce churn risk from
      enterprise procurement committees who use analyst rankings as purchase validation, and they
      create reputational switching costs that are difficult for competitors to overcome without
      similar sustained investment in both customer experience and product innovation.
    claimRefs:
      - CP005
      - CP006
      - CP008

  - calloutType: risk
    title: Ad Verification Entry Faces Deep Incumbent Moats at DV and IAS
    body: >
      DoubleVerify's 67% market share in ad fraud detection, its 109% NRR, and its MRC-accredited
      measurement infrastructure embedded across DSPs and SSPs represent structural barriers that
      HUMAN's Ad Integrity Suite launched in June 2026 must overcome. HUMAN's cybersecurity-grade
      differentiation is technically compelling, but the agency holding company procurement cycle
      for verification is relationship-driven, multi-year, and deeply integrated with trading desk
      workflows. IAS has $591M in revenue. Meaningful revenue contribution from ad verification
      to HUMAN's top line likely requires 2–4 years of pipeline development and MRC accreditation,
      posing execution risk if HUMAN allocates significant R&D resources to this front while core
      bot management competition intensifies.
    claimRefs:
      - CP033
      - CP034
      - CP035

