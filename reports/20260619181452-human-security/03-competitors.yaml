  - id: direct-peer-profiles
    title: Direct Peer Profiles (Bot and Agent Trust)
    body: >
      Kasada is HUMAN's most direct peer in the Forrester Wave, also named a Leader with the highest
      possible scores in nine criteria and strong Strategy scores. The February 2026 $20M EQT-led
      round brings Kasada's total to $64.2M—far below HUMAN's estimated $220M+ raised—but the company
      claims to protect more than $150 billion in eCommerce revenue, a formidable proof point for
      enterprise procurement. Notably, more than 85% of Kasada customers previously used another bot
      mitigation provider, implying high win-rate in competitive displacement. Kasada differentiates
      on server-side, CAPTCHA-free detection and a reported 250%+ ROI. Arkose Labs ($114M raised,
      Series C in 2021) occupies a distinct niche with challenge-response gamification that deliberately
      frustrates bot operators through interactive puzzles rather than passive behavioral analysis.
      Adobe is a named enterprise customer. Arkose holds 5.0% mindshare in the PeerSpot Bot Management
      category as of June 2026, up from 2.8% the prior year—a sign of growing enterprise recognition
      despite a smaller scale. DataDome ($82M raised, $36M ARR 2024) focuses on e-commerce and media
      with rapid edge-ML detection, serving 300+ enterprises including Rakuten, Reddit, and AngelList;
      its revenue almost doubled from $16.9M to $36M from 2023 to 2024. Fingerprint differentiates
      on device intelligence rather than full-stack bot management—its platform identified over 1 billion
      unique devices per month in 2026, achieved 65% ARR growth, serves 2,000 customers with 128% NRR,
      and added Booking.com as a customer. Netacea ($29.7M raised, $55.9M valuation) differentiates on
      a fully managed server-side service model where Netacea handles detection configuration and tuning
      on behalf of the customer, receiving a Strong Performer rating in the Q2 2026 Forrester Wave with
      top scores in web and LLM scraping management. In PeerSpot's June 2026 Bot Management category,
      Imperva leads mindshare at 15.7% and Akamai holds 9.7%, both above HUMAN's 8.1%, though the
      incumbent positions reflect install base more than pure-play bot intelligence capability.
