  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >
        Published or confirmed pricing for HUMAN Security, Kasada, and Arkose Labs; none of these
        vendors disclose rate cards publicly and all enterprise contracts are custom-negotiated.
      whyItMatters: >
        Without pricing evidence, the competitive analysis cannot assess whether HUMAN commands a
        premium over Kasada and Arkose, or whether Cloudflare's bundling effectively caps HUMAN's
        addressable market at cost-sensitive buyers who cannot justify a separate bot management budget.
      diligencePath: >
        Request sample contracts or pricing benchmarks from HUMAN Security during vendor diligence;
        review contract terms, auto-renewal clauses, and exit penalties as proxy for pricing confidence.
      relatedQuestionRefs:
        - QP018
    - type: private-evidence-only
      severity: material
      topic: human-security-scale
      missingEvidence: >
        HUMAN Security's actual ARR, revenue growth rate, customer count, and net revenue retention
        are not publicly disclosed; all estimates from secondary sources are unconfirmed.
      whyItMatters: >
        Revenue scale determines whether HUMAN Security can sustain its Satori threat research team,
        outpace Kasada on product investment, and fund the ad verification market entry simultaneously.
      diligencePath: >
        Obtain HUMAN Security's most recent audited financial statements, customer count, and ARR
        through the fundraising data room or via direct investor disclosure request.
      relatedQuestionRefs:
        - QP014
    - type: missing-source
      severity: minor
      topic: market-position
      missingEvidence: >
        Direct head-to-head technical benchmark comparisons between HUMAN Security and Kasada
        on detection accuracy, false positive rate, and latency under equivalent attack conditions.
      whyItMatters: >
        Both vendors claim top Forrester scores in similar criteria; an independent benchmark would
        clarify whether HUMAN's detection advantage from its behavioral network is quantifiably
        larger than Kasada's server-side telemetry approach.
      diligencePath: >
        Request customer references who evaluated both HUMAN and Kasada in a competitive selection;
        commission independent penetration test comparing detection rates under standardized bot attack scenarios.
      relatedQuestionRefs:
        - QP014

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TP002 (feature matrix) and TP003 (pricing table) include notes that disclose data sources,
      estimation methodology, and coverage limitations; tableNotes warning is intentionally acknowledged
      for TP001 since its notes field fully documents partial coverage, funding source provenance,
      and estimation basis. No pure factual snapshot tables are present without notes.
