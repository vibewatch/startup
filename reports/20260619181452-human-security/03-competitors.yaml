  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Status
      - Diligence Ask
    rows:
      - - Quadrillion-interaction behavioral data network creates detection advantage
        - Cloudflare, Akamai, and AWS amass their own aggregate traffic signals at comparable or greater scale
        - High
        - HUMAN's signals are enriched by cross-customer attack correlation; raw volume is necessary but not sufficient
        - Confirm whether HUMAN's detection accuracy benchmarks are independently validated vs. Cloudflare BM on identical attack types
      - - Satori Threat Intelligence team produces coordinated takedowns benefiting all customers
        - Competitors could grow threat research functions or acquire specialist firms
        - Medium
        - Forrester cited takedowns as uniquely differentiating; no peer has equivalent public track record
        - Assess team size, retention, and pipeline of active operations; verify customer NPS attribution to Satori specifically
      - - Deep WAF/CDN/IAM/AEP integrations raise operational switching costs
        - Customers may consolidate onto Cloudflare or Akamai to reduce vendors
        - High
        - HUMAN's platform integrations are multi-layer; replacement requires reconfiguring detection across the entire stack
        - Obtain customer contract terms (typical length, auto-renew, data portability) and churn attribution by reason
      - - Partner ecosystem (OpenAI, AWS, Adobe) creates agent trust network effects
        - Competing agent trust frameworks from hyperscalers could preempt or absorb HUMAN's position
        - High
        - Forrester cited HUMAN's partnership program as a standout; hyperscaler partnerships are live signals of early adoption
        - Confirm exclusivity or co-marketing terms in key AI operator partnerships; assess revenue contribution of partner channel
      - - Established behavioral signal network is expensive to replicate from scratch
        - Well-funded new entrant with hyperscaler backing could build comparable scale within 24–36 months
        - Medium
        - No credible new entrant has yet emerged; category requires multi-year data accumulation
        - Track venture investment into agent trust and bot management startups for signs of well-capitalized new entrants
      - - Ad Integrity Suite leverages existing behavioral network for superior IVT detection vs. legacy providers
        - DoubleVerify and IAS have MRC accreditation, DSP/SSP integrations, and 10+ years of agency trust that HUMAN lacks
        - High
        - HUMAN's differentiation is explainability and cybersecurity-grade signals; gaining MRC accreditation is a prerequisite for parity
        - Assess MRC accreditation timeline and agency holding company adoption rate for HUMAN Ad Integrity Suite
    notes: >
      Severity ratings are analyst judgments based on publicly available evidence as of June 2026.
      "High" indicates a threat that could materially affect HUMAN's competitive position within
      12–24 months. "Medium" indicates a threat that is real but unlikely to materially erode the
      moat within the near term without significant competitor investment. All diligence asks require
      non-public company data to answer definitively.
    claimRefs:
