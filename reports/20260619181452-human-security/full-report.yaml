      - number: '1.4'
        title: Milestone chronology, competitive recognition, and adverse context
        blocks:
          - type: paragraph
            body: >
              HUMAN's operating history is marked by a series of public-private threat disruptions that have established
              its identity and credibility in the cybersecurity market. In 2016, as White Ops, the company uncovered
              Methbot, one of the first large-scale dedicated ad fraud botnets. In 2018-2019, it participated with the
              FBI, Google, and Facebook in the takedown of 3ve, the largest ad fraud botnet to date. In 2021, the
              company led a collaborative PARETO disruption (a major Connected TV ad fraud operation) and rebranded from
              White Ops to HUMAN Security. The year 2022 was the most active on record: clean.io was acquired in March,
              the PerimeterX merger closed in July, and the VASTFLUX ad fraud scheme (affecting 11 million devices with
              12 billion daily false bid requests) was disrupted and reported in January 2023. BADBOX, a pre-installed
              Android botnet affecting millions of devices globally, was disrupted in multiple phases in 2023, 2024, and
              2025, with German authorities and a coalition including HUMAN, Google, and Shadowserver conducting the
              largest coordinated sinkholing operations.


              On the commercial and recognition side, HUMAN was named to TIME's Best Inventions of 2023, the TIME100
              Most Influential Companies of 2023, and named a Leader in The Forrester Wave: Bot Management Software Q3
              2024. In January 2024, the CEO transition from Tamer Hassan to Stu Solomon took effect. In October 2024,
              the $50M+ growth round closed. By June 2026, HUMAN was named a Leader in The Forrester Wave: Bot and Agent
              Trust Management Software Q2 2026, with the highest possible scores across nine criteria including Threat
              Research, the only vendor to receive a top score in that criterion. G2's Summer 2026 Grid for Bot
              Detection and Mitigation Software also named HUMAN the top overall Leader based entirely on customer
              feedback.


              The adverse record is limited. In October 2024, AdExchanger published a correction noting that CEO Stu
              Solomon had misspoken during an interview about building a proprietary deterministic ID for attribution;
              HUMAN's VP of Product clarified that no such product was planned. This represents a minor public messaging
              error with no regulatory or legal consequences. No material lawsuits, regulatory investigations, data
              breach disclosures, significant workforce reductions, or sanctions against HUMAN Security have been
              identified in public records as of the June 2026 research date. The absence of documented adverse events
              should be noted as an evidence gap for private proceedings that would not be publicly disclosed, and the
              company's private status means no public regulatory filing trail exists.
