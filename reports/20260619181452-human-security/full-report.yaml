      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Track
            body: >
              HUMAN Security is a credible cybersecurity platform with internet-scale proof, institutional backing, and
              positioning in the highest-growth security categories (bot management, agentic AI trust). The 2022 $1.5
              billion valuation is approximately in-line with application-security benchmarks at stated ARR. However,
              absent disclosure of NRR, gross margin, ARR growth, and Blackstone debt status, conviction is insufficient
              for a Buy recommendation. Recommend Track with re-evaluation when any of the six priority diligence items
              (TV006) are resolved.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV017
              - CV019
              - CV045
          - type: callout
            title: Capital Overhang and Structured-Round Risk
            body: >
              The $400M total capital base (equity + debt) creates meaningful preference overhang. Windsor Drake
              explicitly notes that companies raising at 2021–2022 peak multiples often execute "structured rounds" with
              guaranteed returns or participation rights. HUMAN's October 2024 round—exclusively existing investors at
              undisclosed valuation—is consistent with this dynamic. In bear-case scenarios below $1.0B EV, liquidation
              preferences from earlier preferred share classes could reduce common equity to near zero.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV036
              - CV043
              - CV047
          - type: callout
            title: Sector Positioning Determines Multiple — The Range Is $190M to $2.8B
            body: >
              HUMAN's most consequential valuation question is not a number, it is a sector label. As an ad-verification
              platform (DV/IAS comparable), the implied EV at 1.9x LTM revenue is approximately $190M. As a pure-play
              cybersecurity platform at application-security median (13.0x ARR), the implied EV is $1.3B. As an
              AI-native security platform (22x, top-quartile), it is $2.2B. The spread is 11x, driven entirely by which
              comp set applies. The objective of diligence is to determine which portion of revenue is defensibly
              classified as cybersecurity SaaS versus ad-tech services.
            calloutType: insight
            claimRefs:
              - CV013
