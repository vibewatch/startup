  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >
              HUMAN Security's revenue opportunity spans four distinct but overlapping product categories: (1) bot
              mitigation and behavioral analytics platforms protecting web applications, APIs, and mobile surfaces from
              automated abuse; (2) ad fraud and Sophisticated Invalid Traffic (SIVT) defense, covering pre-bid
              filtering, post-bid reporting, and MRC-accredited verification in programmatic advertising; (3)
              account-takeover (ATO) prevention targeting post-login credential abuse, session hijacking, and
              multi-stage attack chains; and (4) agentic AI trust management, a nascent category that emerged as
              AI-powered agents began transacting on behalf of users—growing 7,851% year-over-year in HUMAN's own
              network data. These four categories are increasingly unified under HUMAN Sightline Cyberfraud Defense and
              MediaGuard/Ad Integrity Suite within the Human Defense Platform.

              Included spend encompasses behavioral analytics SaaS subscriptions, MRC-accredited SIVT detection
              licensing, bot-score API fees, AgenticTrust policy enforcement, and managed threat intelligence services
              (Satori team). Excluded spend includes pure payment-fraud chargebacks and chargeback insurance, KYC/KYB
              identity proofing (document verification, biometric), AML compliance tooling, traditional CAPTCHA
              commodities without behavioral layers, DDoS mitigation (pure volumetric), and CDN infrastructure contracts
              where bot management is an untariffed add-on. Adjacent markets include web application firewalls, cloud
              access security brokers, identity and access management platforms, and API gateway security—all of which
              create partial substitutes for specific HUMAN use cases.

              Status-quo substitutes include: in-house fraud rule engines and data-science teams (common at large
              internet platforms such as Google, Meta, and major financial institutions), CDN-native bot management from
              Cloudflare (79% bot management install base by device share) and Akamai (6%), and point-solution SIVT
              vendors such as Integral Ad Science, DoubleVerify, and Pixalate. Cloudflare's bundling of bot management
              with CDN and WAF at flat-rate pricing starting around $350 annually for SMBs creates the most material
              displacement risk in the lower and mid-market. The competitive bundling threat constrains HUMAN's
              addressable market—particularly among organizations that already rely on Cloudflare for content
              delivery—and forces a differentiation argument based on signal depth (2,500+ behavioral signals per
              interaction), threat research (Satori team), and specialized ad fraud MRC accreditation that Cloudflare
              does not offer.
