      - number: '4.2'
        title: Go-to-Market Motion and Sales Efficiency
        blocks:
          - type: paragraph
            body: >
              HUMAN Security has undergone a deliberate GTM transformation from a historically direct-sales-only
              organisation to a partner-first channel model. Prior to 2024, the company had no formal channel programme
              and long enterprise sales cycles of six to seven months were common for large accounts due to the need to
              negotiate legal, MSA, and pricing terms directly. In August 2024, HUMAN launched the HUMAN Advantage
              Partner Program, a tiered channel initiative with incentives based on annualized bookings, training
              completion, and customer retention. The program targets resellers, distributors, and advisory partners
              globally. Separately, HUMAN partnered with Carahsoft Technology in November 2022 as its Master Government
              Aggregator, enabling public sector access via NCPA, E&I, and OMNIA cooperative contracts. CEO Stu Solomon
              (appointed January 2024, formerly President of Recorded Future) and CRO Chris Scanlan (formerly President
              at ExtraHop) are executing the commercial and marketing pivot. The partner-led motion is designed to
              shorten sales cycles by leveraging embedded partner relationships and pre-existing MSAs, thereby reducing
              the average deal time and widening addressable pipeline. No partner-sourced pipeline share or quantified
              CAC/payback data is publicly available. The ecosystem-first approach also enables HUMAN to reach
              fragmented buyer personas (security, commerce, digital, marketing) without diluting direct sales
              bandwidth.
            claimRefs:
              - CI018
              - CI019
              - CI020
              - CI021
              - CI022
              - CI023
      - number: '4.3'
        title: Cost Structure and Margin Drivers
        blocks:
          - type: paragraph
            body: >
              HUMAN's cost structure is dominated by three categories: (1) ML and data infrastructure for processing
              over 20 trillion digital interactions per week (over one quadrillion annually as of 2025), representing
              substantial cloud compute and storage spend; (2) the Satori Threat Intelligence and Research Team, a
              human-in-the-loop cost centre that conducts proactive threat research and executes takedowns (3ve,
              Methbot, PARETO, BADBOX 2.0), and which differentiates HUMAN's research-backed detection but adds material
              personnel cost; and (3) sales and marketing, expanding with the channel programme investment and headcount
              growth from approximately 197 employees in late 2023 to an estimated 469–519 employees by mid-2026. Gross
              margin is not publicly disclosed. SaaS cybersecurity benchmarks (Benchmarkit 2024/2025) indicate typical
