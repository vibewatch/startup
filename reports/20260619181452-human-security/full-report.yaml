  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              HUMAN Security sits at the intersection of two rapidly evolving markets. In bot and agent trust
              management, the vendor set spans purpose-built specialists (Kasada, Arkose Labs, DataDome, Netacea,
              Fingerprint), infrastructure-native players who bundle detection into broader platforms (Cloudflare,
              Akamai, Imperva/Thales), and the status quo of in-house rule engines and rate-limiting logic that many
              enterprises still rely on as a first-line filter. In digital ad verification, HUMAN's newly launched Ad
              Integrity Suite (June 2026) enters direct competition with publicly traded DoubleVerify ($748M FY2025
              revenue, 14% YoY growth) and Integral Ad Science ($591M revenue), as well as the full-funnel GTM security
              platform CHEQ. The Forrester Wave: Bot and Agent Trust Management Software Q2 2026 evaluated eight vendors
              and renamed the category from "Bot Management" to "Bot and Agent Trust Management," signaling that the
              competitive frontier has shifted from detecting automated traffic to governing trust for legitimate AI
              agents. HUMAN and Kasada were both named Leaders; Netacea was a Strong Performer. Cloudflare and Akamai
              were not evaluated in the Wave, as their offerings remain adjuncts to edge/CDN platforms rather than
              purpose-built bot intelligence products. The most important structural dynamic shaping competition is the
              proliferation of agentic AI: HUMAN's 2026 benchmark data shows AI-driven traffic grew 187% in 2025 alone,
              with agentic browser traffic up 7,851% year-over-year, meaning the traditional "bot or not" binary is
              obsolete and purpose-built trust management platforms have a structural advantage over legacy WAF and
              CDN-based detection.
            claimRefs:
