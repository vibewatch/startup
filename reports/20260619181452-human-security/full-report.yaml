      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              HUMAN's buyer landscape is segmented by product line and underlying job-to-be-done. For bot mitigation and
              ATO defense (Bot Defender + Sightline), the primary buyers are application security engineers and fraud
              operations teams at e-commerce, travel, and financial services companies. Budget typically sits within IT
              Security or Risk/Compliance and is owned by the CISO or CTO. Adoption triggers include a post-breach
              incident, detection of checkout fraud or scraping attacks, or a competitive intelligence threat from
              inventory scraping. HUMAN's own 2026 benchmark report found that retail and e-commerce topped all
              verticals for scraping (70% of all observed attacks), carding, and ATO attempts, with over 440,000 unique
              threat profiles targeting the sector—more than four times the next-highest vertical.

              For ad fraud/SIVT defense (MediaGuard/Ad Integrity Suite), the buyer profile shifts to ad operations
              directors, chief media officers, and programmatic trading teams at advertisers, agencies, DSPs, SSPs, and
              publishers. Budget ownership moves to the marketing P&L. Adoption is often compliance-driven: MRC
              accreditation mandates for impression counting, TAG certification requirements for supply chain
              participants, or agency holding-group standards mandating independent IVT measurement. HUMAN's 2026 MRC
              re-accreditation for both its pre-bid Ad Fraud Defense and post-serve Ad Fraud Sensor platforms across
              desktop, mobile, and CTV reinforces its standing as a certified vendor in this segment.

              A third and emerging segment is agentic AI trust management (AgenticTrust/Sightline), where buyers are
              platform architects, trust and safety leads, and "agentic commerce" product owners at companies deploying
              or receiving AI-agent traffic at scale. This buyer is newer, with budgets not yet fully allocated, and the
              category itself was renamed by Forrester only in 2025 ("Bot and Agent Trust Management Software") to
              reflect the shift. HUMAN's support for Amazon AWS Bedrock AgentCore browser verification signals a
              partnership-driven go-to-market for this segment. The payer here may be a combined security-and-platform
              engineering budget rather than the traditional CISO owner.

              EXTE's March 2026 integration of HUMAN's MediaGuard illustrates the partner/platform buyer: a programmatic
              advertising company integrating HUMAN's solution as a supply-quality layer—payer is the platform, user is
              the advertiser downstream. Global cybersecurity budgets are rising to $240 billion in 2026 (12.5% YoY per
              Gartner), with 40% of enterprise security budgets allocated to software and platforms where HUMAN
              competes.
