      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Across Multiple Lenses'
        blocks:
          - type: paragraph
            body: >
              Market sizing for HUMAN's served market requires combining estimates across multiple analyst categories
              because no single published report matches its product boundary. The bot mitigation market is sized at
              $0.9 billion (2025) growing to $1.12 billion in 2026 at a 24.8% CAGR (Business Research Company), while
              Fortune Business Insights pegs the slightly broader "bot security" category at $1.05 billion (2025) and
              $1.27 billion (2026) at a 20.55% CAGR. Both estimates reach $2.4–$5.67 billion by 2030-2034. An outlier
              from MarkWide Research places a broader "bot mitigation" market at $3.8 billion in 2026 using a wider
              scope that may include adjacent WAF/CDN security spend.

              On the ad fraud side, Fraudlogix measured a 20.64% global IVT rate across 105.7 billion impressions in
              2025, implying roughly $37 billion in US programmatic ad spend exposed to invalid traffic annually at the
              23.69% US-specific rate. This is the potential fraud loss, not a vendor market size; vendor revenue for
              SIVT mitigation is a fraction of fraud exposure. Pixalate's Q1 2026 benchmarks confirmed a 24% US desktop
              IVT rate, 32% mobile app, and 24% CTV—rates that reinforce persistent demand for accredited SIVT vendors.

              For account takeover protection, Global Growth Insights estimates a standalone $7.46 billion market in
              2026 at 18.89% CAGR. The eCommerce FDP broad market is projected at $88.77 billion in 2026 (BFSC) and the
              all-verticals fraud detection market at $40.4 billion (Grand View Research), but these include payment
              fraud, KYC/KYB, AML, and identity proofing that HUMAN does not directly serve—making them overstatements
              of the relevant TAM.

              An analyst-synthesized SAM for HUMAN is approximately $1.5–$2.0 billion in 2026, constructed as the sum of
              bot security ($1.27B) plus MRC-accredited SIVT vendor spend (estimated $500M–$800M, derived from
              advertiser spend on verification tools as a fraction of $836B global digital ad spend). This SAM is
              compressed by Cloudflare bundling for the SMB/mid-market segment. A SOM of $150–$300 million in 2026 is
              consistent with HUMAN's Forrester Wave leadership position, quadrillion-interaction network scale, and a
              realistic 10–20% penetration of the constrained SAM, but this estimate has no independent validation
              because HUMAN does not disclose revenue.
