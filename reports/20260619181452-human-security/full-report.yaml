              deploys Optiv and Consortium Networks as channel multipliers under a three-tier structure rewarding
              annualized bookings, training completion, and customer retention. Strategic technology partnerships that
              expand addressable accounts include AWS Bedrock AgentCore browser support (cryptographically signed AI
              agent verification) and the Riskified partnership (August 2026 per RivalSense) for ecommerce fraud
              prevention via AI Agent Approve and AI Agent Intelligence. Concentration risk is material on two
              dimensions. First, HUMAN's legacy revenue base is heavily concentrated in digital advertising and adtech—a
              vertical where DoubleVerify and IAS command much larger market shares and where budget cycles are tied to
              media spend decisions rather than security budgets, creating sensitivity to macro advertising downturns.
              The Gartner Peer Insights reviewer base skews toward retail and travel sectors for application defense,
              but the company's historical brand identity and most public case studies remain ad-tech-centric. Second,
              no customer count, top-10-customer revenue share, or revenue-by-segment data is available for a private
