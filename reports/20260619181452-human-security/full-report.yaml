  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >
              HUMAN Security's core technical capability—collecting and analyzing behavioral fingerprinting signals
              across more than one quadrillion digital interactions annually—creates a material and growing data privacy
              surface. The company processes device fingerprints, mouse-movement telemetry, keystroke timing, browser
              attributes, IP addresses, and cross-property behavioral patterns to distinguish bots from humans. Under 20
              U.S. states that now actively enforce comprehensive privacy laws (as of January 2026), plus GDPR in
              Europe, any misclassification of HUMAN's data as personal-data brokerage or its behavioral signals as
              regulated data could trigger enforcement. The FTC sent formal warning letters to 13 data brokers under the
              Protecting Americans' Data from Foreign Adversaries Act (PADFAA) in February 2026, signaling active
              regulatory surveillance of mass-scale behavioral data vendors.


              The Department of Justice's Data Security Program (DSP) imposes additional restrictions on bulk
              cross-border transfers of covered personal data to "countries of concern." HUMAN operates globally and
              processes data from devices in 222+ countries; any configuration that routes covered data through Israel
              (where HUMAN has offices and engineering staff) or partnerships with entities with covered-country links
              requires CISA-compliant security controls. Plaintiffs' attorneys have developed a novel strategy: citing
              DSP violations as predicates for federal Wiretap Act claims even without a private right of action under
              the DSP itself, opening adtech data flows to class action exposure. The volume of online privacy lawsuits
              escalated from approximately 200 cases in 2023 to approximately 4,000 in 2024; the same behavioral
              tracking technologies HUMAN deploys for fraud prevention are precisely those targeted by plaintiffs.


              On the positive side, HUMAN earned MRC accreditation for Ad Viewability Measurement in April 2026,
              demonstrating compliance rigor. The MRC Digital Advertising Auction Transparency Standards were also
              finalized in January 2026, tightening disclosure requirements for ad auction participants. Critics,
              including the Check My Ads Institute, argue these self-regulatory frameworks are structurally
              insufficient—calling for government regulation— suggesting ongoing sector-level regulatory risk even for
              compliant vendors. As of June 2026, no active regulatory enforcement or litigation directly targeting
              HUMAN Security is publicly known; the risk is latent but material given the behavioral data scale.
            claimRefs:
