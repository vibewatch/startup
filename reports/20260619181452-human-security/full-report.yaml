      - number: '7.5'
        title: Mitigations, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              HUMAN's primary mitigations are structural: the Satori threat intelligence moat from monitoring one
              quadrillion+ interactions per year creates genuine detection advantages that point-in-time competitors
              cannot replicate. MRC accreditation (earned April 2026) provides media-buyer trust anchoring. The
              public-private disruption model—FBI, Google, Shadowserver, Trend Micro co-operations on BADBOX 1.0 and
              2.0—demonstrates that HUMAN is embedded in the threat-response ecosystem in ways that bundled vendors are
              not. The $50M 2024 growth round and investor continuity (Goldman, WestCap, NightDragon) reduce near-term
              liquidity risk. The HUMAN Advantage Partner Program launched August 2024 diversifies customer acquisition
              away from long direct-sales cycles.


              Thesis-break triggers are concentrated in three areas. The first is platform bundling absorption: if
              Cloudflare, Google, or AWS meaningfully close the behavioral signal gap through acquisition or model
              improvement, HUMAN's pricing premium collapses for the majority of its customer base that already runs on
              those platforms. The second is a material cloud outage during peak traffic: AWS US-EAST-1 remains HUMAN's
              most likely operational single point of failure; a multi-hour outage during high-value media events (Super
              Bowl, Prime Day) would create immediate contractual and reputational exposure. The third is a privacy
              enforcement action: if a state AG or FTC action reclassifies HUMAN's behavioral signal network under a
              data-broker framework, or if novel Wiretap Act class actions citing DSP predicates name HUMAN as a
              defendant, compliance costs and customer trust could be materially impaired.


              Priority diligence asks: independent ARR confirmation and NRR benchmarking; multi-cloud resilience
              architecture documentation; data flow mapping to confirm DSP compliance for cross-border transfers; top-10
              customer revenue concentration; post-PerimeterX integration gross margin trend; and AWS contractual terms
              including any minimum commitments and exit options. Given the valuation opacity, a secondary-market
              cap-table analysis is necessary before any entry at or above the 2022 $1.5B reference.
