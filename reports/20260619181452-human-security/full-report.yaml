      - number: '5.2'
        title: Core Technical Architecture and Detection Methodology
        blocks:
          - type: paragraph
            body: >-
              HUMAN's detection architecture separates into two complementary deployment components: the Sensor and the
              Enforcer. The JavaScript Sensor (version 9.6.6+ required for AgenticTrust support) is injected into the
              customer's web property via the HTML head tag and collects device fingerprinting signals, behavioral
              biometrics, session history, and network characteristics. This client-side signal stream is transmitted to
              HUMAN's cloud-hosted Decision Engine for real-time analysis.


              The Decision Engine is the platform's core intelligence layer, processing 2,500+ signals per interaction
              using 400+ adaptive ML models to produce a verdict—human, bot, or AI agent—in under two milliseconds.
              Approximately 95% of traffic is auto-validated by the Precheck mechanism without user friction; the Human
              Challenge is deployed only for interactions whose signal profile is ambiguous. The ML stack includes
              Profile Deviation Models 2.0 for detecting anomalous post-login behavior, attack profiling for segmenting
              traffic into distinct behavioral threat profiles, and network attack event detection for assessing the
              scope and coordinated complexity of in-progress campaigns. HUMAN Threat Tracker surfaces these profiles as
              actionable intelligence dashboards for security teams.


              On the enforcement side, HUMAN's Enforcer is available in over 20 integration formats, spanning major CDN
              and cloud providers (AWS Lambda@Edge, Azure Front Door, Cloudflare, Fastly VCL, Akamai EdgeWorker, Edgio),
              server frameworks (Nginx, Apache, HAProxy, Envoy, Varnish), language runtimes (Go, Java, .NET Core, Node
              Express), API gateways (AWS API Gateway, Apigee, Kong), and enterprise platforms (Salesforce). Python,
              PHP, Ruby, and Akamai ESI are not supported for the AgenticTrust module. FraudSensor, HUMAN's post-bid ad
              detection component, validates ad impressions after serving to provide supply-path-level viewability rates
              filtered for bot traffic, forming the foundation of the MRC-accredited Ad Viewability Measurement product.
