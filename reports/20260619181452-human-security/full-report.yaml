            body: >
              HUMAN Security's customer base spans five distinct buying segments aligned to its three-pillar product
              platform (advertising protection, application/bot defense, account protection). The largest segment by
              historical revenue is advertising technology: DSPs, SSPs, ad-verification vendors, agency holding
              companies, and brand advertisers who require MRC-accredited invalid traffic filtration for digital media
              budgets. LinkedIn (B2B professional network), Sovrn (publisher platform), Madhive (local-media CTV OS),
              and AdRoll (performance DSP) are named production customers in this vertical. The second segment is
              programmatic marketplaces and commerce platforms—e-commerce and retail brands requiring Bot Defender and
              Sightline to stop scraping, credential-stuffing, and ATO attacks. Gartner Peer Insights reviews from
              $500M–$1B and $10B+ retail accounts describe production deployments for high-heat sneaker releases and
              multi-brand e-commerce portfolios. The third segment is financial services, where agentic AI traffic
              doubled month-on-month in May 2026 (HUMAN's own benchmark), driving demand for account-protection and
              transactional fraud defense. The fourth segment is broader enterprise security teams—organizations
              protecting web applications, APIs, and mobile channels—who access HUMAN's platform through the channel
              program (Optiv, serving 73% of the Fortune 100, and Consortium Networks as a managed security concierge).
              Travel and hospitality is an emerging fifth segment; a Gartner reviewer from a $250M–$500M travel brand
              describes production use of managed bot defense. Geographic segmentation is predominantly North America
              and Western Europe, with Tel Aviv R&D and UK commercial presence supporting EMEA. No revenue breakdown by
