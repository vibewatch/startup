            title: Infrastructure Incumbents Bundling at Near-Zero Marginal Cost
            body: >
              Cloudflare's bot management is an Enterprise add-on that many customers access at effectively zero
              incremental cost once on an Enterprise CDN contract. This creates a structural pricing floor that
              pure-play vendors cannot undercut, and it is capturing cost-sensitive mid-market buyers who might
