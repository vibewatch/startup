      - number: '5.3'
        title: Satori Threat Intelligence — Research and Disruption Operations
        blocks:
          - type: paragraph
            body: >-
              The Satori Threat Intelligence and Research Team is HUMAN's internal threat research unit, led
              operationally by Lindsay Kaye (Vice President of Threat Intelligence) and overseen by Gavin Reid (CISO).
              Satori's mandate extends beyond reactive detection: the team investigates, reverse-engineers, and
              orchestrates coordinated disruption operations targeting large-scale threat actor schemes. This proactive
              posture—publicly disclosed takedowns that remove criminal infrastructure rather than merely blocking
              traffic—is the primary differentiator cited in HUMAN's Forrester Wave Q2 2026 top score, where HUMAN was
              the sole vendor to receive a perfect 5/5 in the Threat Research criterion.


              Historical disruption operations include: 3ve (a large-scale CPC fraud scheme dismantled in cooperation
              with the FBI, Google, and Facebook), Methbot (culminating in a 10-year prison sentence for the operator),
              PARETO (the most sophisticated CTV botnet identified at the time, disrupted with Roku and Google), Scylla
              (targeting advertising SDKs on Google Play and the Apple App Store), BADBOX 2.0, SlopAds, and Pushpaganda.
              The most recent major operation is Trapdoor, disclosed on May 19, 2026: a multi-stage scheme fusing
              malvertising distribution with hidden ad-fraud monetization across 455 malicious Android apps and 183
              threat-actor-owned HTML5 domains. At its peak, Trapdoor accounted for 480 million bid requests per day,
              with associated apps downloaded more than 24 million times before Google Play removed the identified apps.


              Intelligence from these operations enriches the Decision Engine's ML models and is shared through
              private-sector and public-sector partnerships, including law enforcement agencies, app store operators,
              and cloud providers. This feedback loop between field research and product protection represents a
              technical moat that pure detection vendors cannot easily replicate. Satori also provides real-time event
              coverage—during Super Bowl LX in February 2026, HUMAN tracked 74 million blocked retail scraping attacks,
              a 33% rise in invalid bid requests, and a 5% increase in AI agent activity.
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
              - CE031
              - CE037
      - number: '5.4'
        title: Deployment, Integration, and Product Roadmap
        blocks:
          - type: paragraph
            body: >-
              HUMAN's deployment model is cloud-native and integration-forward. Customers access HDP through direct
              cloud contracts, the AWS Marketplace, or through channel partners including Carahsoft (federal and public
              sector distribution). The platform integrates with CDNs, WAFs, CIAM platforms, and analytics
              infrastructure without requiring rearchitecting of the customer's stack. Deployments range from
              lightweight Sensor-only implementations (for organizations that need signal coverage without inline
              enforcement) to full Sensor-plus-Enforcer deployments at the CDN or origin layer.


              The AWS partnership deepened materially in 2026 when AgenticTrust extended cryptographic verification
              support to Amazon Bedrock AgentCore traffic. AI agents built on the Bedrock platform are now
              cryptographically signed and policy-verified through HUMAN's AgenticTrust module, enabling enterprises to
              enforce granular per-action controls on AI agents operating within AWS-hosted applications. Supported
              integration targets for AgenticTrust (minimum Sensor version 9.6.6) include AWS Lambda@Edge from v4.8.0,
              AWS API Gateway from v0.1.1, Cloudflare from v6.12.0, Fastly VCL from v12.3.0, F5 BIG-IP from v3.1.1, and
              Azure Front Door from v1.2.1.


              On the standards front, HUMAN open-sourced a reference implementation of the HUMAN Verified AI Agent in
              November 2025, demonstrating HTTP Message Signatures (RFC 9421) for cryptographic agent
              identity—implemented via Ed25519 key pairs and the OWASP Agent Name Service (ANS v1.0) naming standard.
              This positions HUMAN as both a commercial vendor and an ecosystem standards contributor. The April 2026
              Agentic Visibility expansion extended Sightline's bot and agent classification data natively into Adobe
              Experience Platform, making HUMAN the only bot-management vendor with a native Adobe integration for
              marketing measurement teams.
