      - number: '1.2'
        title: Founders, leadership, board, and key-person risk
        blocks:
          - type: paragraph
            body: >
              HUMAN was founded by four individuals: Tamer Hassan (CEO through January 2024, now Executive Chairman),
              Michael Tiffany, Dan Kaminsky, and Ash Kalb. Hassan was the dominant public face of the company for its
              first twelve years, recognized by Fast Company in 2019 as its number one Most Creative Person in Business.
              He led the rebranding from White Ops, the merger with PerimeterX, the acquisition of clean.io, and the
              company's surpassing of $100M ARR. In January 2024, Hassan transitioned to the role of board member and
              Executive Chairman, remaining actively engaged in strategy, customer relationships, and public-policy
              advocacy. The co-founder network is therefore partially intact: Hassan retains a governance role, while
              the other three founding members are not publicly listed in active executive roles as of the June 2026
              research date.


              In January 2024, Stu Solomon, formerly President of Recorded Future (the world's largest threat
              intelligence provider), was appointed CEO. Solomon brings executive and C-suite experience from Optiv
              (including as CTO), iSight Partners (acquired by FireEye), and Bank of America, as well as a more than
              25-year military career in the Delaware Air National Guard and United States Air Force. HUMAN's current
              executive leadership also includes Isaac Itenberg (Chief Operating Officer and Chief Financial Officer),
              Gavin Reid (Chief Information Security Officer), and Christos Kalantzis (Chief Technology Officer). The
              board of directors as of the 2026 research date includes directors from Goldman Sachs (Anthony Arnold),
              NightDragon (Dave DeWalt), WestCap (Kevin Marcus), and ClearSky (Jay Leek), alongside Tamer Hassan
              (Executive Chairman) and Ido Safruti, who joined the board as part of the PerimeterX merger. A search of
              public records and company announcements found no evidence of Matt Cantor in HUMAN Security's current or
              recent leadership, executive team, or board.


              Key-person risk has improved somewhat with the CEO transition from Hassan to Solomon, which distributes
              strategic execution across a more experienced external management team. However, the board remains heavily
              investor-representative (Goldman Sachs, NightDragon, WestCap, ClearSky), and the company's
              threat-intelligence identity and customer relationships retain a degree of founder imprint through
              Hassan's Executive Chairman role. The board also lists eight observers (Ryan Benevides, Dan Burns, Itzhak
              Fisher, Steve Fredrick, Rhys Gordon, Hannah Huffman, Lance Matthews, Alexander Weiss), whose affiliations
              and control significance are not publicly disclosed in the current source set. Full board composition and
              governance terms remain a diligence gap.
