      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              The bear case assumes HUMAN's true ARR is at the lower bound of defensible estimates ($80–100 million),
              NRR has drifted below 105%, and gross margin is compressed below 70% due to heavy Satori team and
              infrastructure costs. Under these assumptions, the company's SaaS quality may not sustain a pure
              cybersecurity multiple, and buyers apply a 8–10x blended discount reflecting ad-verification revenue
              exposure. The resulting implied EV is $640M–$1.0B, below the total capital invested. The primary bear-case
              catalyst is a down-round forced by the need to extend cash runway beyond 2027 without improved metrics
              disclosure.


              The base case assumes the $100M+ ARR claim is accurate, NRR is in the 105–115% range (below best-in-class
              cybersecurity but positive), gross margin is 70–78%, and the platform is growing at 10–20% annually. At
              the application-security median of 13.0x, implied EV is $1.3B; at the private-cybersecurity median of
              15.2x, implied EV is $1.52B—roughly in-line with the 2022 mark. A strategic exit to a platform
              consolidator (CrowdStrike, Palo Alto, or Cloudflare) at 14–16x represents a $1.4–1.6B range, yielding a
              3.5–4.0x gross MOIC for the 2022 equity investors. The likely exit window is 2027–2029 given Netskope's
              2025 IPO precedent and the current partial reopening of the cybersecurity IPO market.


              The bull case assumes ARR has grown to $130–140M (consistent with GrowJo's $140.4M estimate), NRR exceeds
              115%, the agentic AI product line has achieved measurable bookings contribution, and HUMAN is designated
              as a Leader in the Forrester Bot and Agent Trust Management Q2 2026 Wave. Under these conditions, a
              strategic acquirer applying a 18–20x top-quartile multiple implies an EV of $2.34–2.8B. At CyberArk/Palo
              Alto precedent multiples (18.6x), $130M ARR implies $2.42B EV. An IPO exit at 12–14x NTM would require
              $175–210M in NTM revenue to support a $2B+ public market cap, achievable in 2027–2028 if growth rate
              accelerates to 20%+ annually.
