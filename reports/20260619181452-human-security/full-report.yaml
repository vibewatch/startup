      - number: '3.3'
        title: Ad Verification and Fraud Measurement Peers
        blocks:
          - type: paragraph
            body: >
              HUMAN's June 2026 launch of the Ad Integrity Suite—combining IVT intelligence, AI-powered brand safety and
              suitability, and viewability in a single framework—puts it in direct competition with the two dominant
              publicly traded ad verification platforms. DoubleVerify (NYSE: DV) reported $748.3M in FY2025 revenue, a
              14% year-over-year increase, with net revenue retention of 109% and measurement of 9.5 trillion billable
              media transactions annually. It holds a 67% market share in ad fraud detection tools as tracked by 6sense,
              with 4,324 tracked customers versus IAS's 167. Integral Ad Science (NASDAQ: IAS) reported $590.67M revenue
              for the twelve months ending Q1 2026, competing primarily on brand safety and programmatic measurement.
              Both DV and IAS have deep agency holding company integrations and MRC-accredited measurement, which
              constitute strong switching-cost moats. HUMAN's differentiation is explicitly cybersecurity-grade fraud
              intelligence—replacing "black box" keyword signals with explainable, URL-level classifications backed by
              its behavioral network—and the convergence of security and ad verification into a unified platform that
              security, ad-ops, and marketing teams can share. AdRoll's Global Head of Supply Platforms praised the
              suite for transparency and reduced ambiguity, suggesting differentiated positioning even against the
              dominant DV/IAS pair. CHEQ occupies a complementary niche: it processes six trillion signals per day
              across one million monitored domains with a claimed 0.009% false positive rate, primarily serving
              performance marketers and SMBs seeking full-funnel GTM security rather than premium brand-safe inventory
              measurement. The ad verification space is the highest-strategic-risk competitive vector for HUMAN because
              DV and IAS have contractual leverage through DSP/SSP integrations that took years to build, and their
              revenue scale is ~10x–15x HUMAN's estimated ARR, giving them capital to match any HUMAN product innovation
              in the verification layer.
            claimRefs:
