    data:
      items:
        - label: Bear (ARR $80–100M, 8–10x blended)
          low: 640
          mid: 820
          high: 1000
        - label: Base (ARR $100–115M, 13–15x App Sec)
          low: 1200
          mid: 1400
          high: 1725
        - label: Bull (ARR $130–140M, 18–20x top-quartile)
          low: 2000
          mid: 2340
          high: 2800
    approximationNotes: >
      Bear low of $640M reflects 8x on $80M ARR; bear high of $1.0B reflects 10x on $100M ARR. Base range anchored to
      Finro App Sec median (13x) and private cyber median (15.2x). Bull range applies CyberArk/Palo Alto M&A precedent
      multiple (18.6x) at $130M ARR for mid, stretched to 20x at $140M ARR for high. All figures in USD millions. Ranges
      do not account for liquidation preferences, debt seniority, or dilution from new financing rounds.
