      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >
              HUMAN's valuation benchmarks against three peer sets: public ad-verification platforms (DV, IAS), private
              cybersecurity application-security peers, and cross-sector M&A precedents. These three sets produce
              materially divergent implied valuations, reflecting HUMAN's hybrid positioning between the ad-verification
              and pure-play cybersecurity markets.


              Public ad-verification comps provide the pessimistic anchor. DoubleVerify (NYSE: DV) reported LTM revenue
              of $781 million, EBITDA of $261 million, and gross margin of 82%, yet trades at only 1.9x EV/Revenue—a $2
              billion enterprise value—reflecting structural headwinds in programmatic advertising and slow revenue
              growth of approximately 10% NTM. Integral Ad Science posted approximately $530 million in LTM revenue at a
              similar compressed multiple. The broader AdTech SaaS sector median NTM EV/Revenue is just 0.9x per
              Multiples.vc's June 2026 analysis, the lowest across all SaaS segments. Applied to a $100 million ARR,
              this would imply an EV of only $90–190 million—clearly inapplicable for a company with HUMAN's
              cybersecurity positioning, but it sets the floor if buyers mark HUMAN's ad-verification revenue at
              sector-appropriate rates.


              The cybersecurity comps are far more favorable. Finro's Q2 2026 dataset of 265 companies across 9 niches
              places Application Security (HUMAN's closest peer niche) at a 15.4x average and 13.0x median EV/Revenue.
              Windsor Drake's November 2025 report puts the private cybersecurity median at 15.2x ARR and M&A exit
              median at 16.3x. The cloud security niche trades even higher at 22.7x average (Finro), anchored by the
              Google/Wiz $32 billion transaction at 32x ARR. Kroll's Spring 2026 analysis notes that median
              cybersecurity EV/NTM Revenue multiples fell 26% quarter-over-quarter in Q1 2026 due to AI-related equity
              market pressure, so even the cybersecurity premium is currently under pressure.


              Private-market SaaS comps at HUMAN's revenue scale ($100M+ ARR) imply a range of 5.5–7.2x ARR for non-AI
              SaaS per iMerge Q1 2026, or up to 12–15x for AI-native platforms with high NRR. The Acquiry 2026 dataset
              corroborates: AI-native SaaS at 20–50% growth commands 7–12x ARR; traditional SaaS at 15–30% growth, 3–5x
              ARR. Given HUMAN's AI-native positioning claims but undisclosed growth rate, the range is wide.
