  - id: satori-threat-intelligence
    title: Satori Threat Intelligence — Research and Disruption Operations
    body: >-
      The Satori Threat Intelligence and Research Team is HUMAN's internal threat research unit, led
      operationally by Lindsay Kaye (Vice President of Threat Intelligence) and overseen by Gavin Reid
      (CISO). Satori's mandate extends beyond reactive detection: the team investigates, reverse-engineers,
      and orchestrates coordinated disruption operations targeting large-scale threat actor schemes. This
      proactive posture—publicly disclosed takedowns that remove criminal infrastructure rather than
      merely blocking traffic—is the primary differentiator cited in HUMAN's Forrester Wave Q2 2026 top
      score, where HUMAN was the sole vendor to receive a perfect 5/5 in the Threat Research criterion.


      Historical disruption operations include: 3ve (a large-scale CPC fraud scheme dismantled in
      cooperation with the FBI, Google, and Facebook), Methbot (culminating in a 10-year prison sentence
      for the operator), PARETO (the most sophisticated CTV botnet identified at the time, disrupted with
      Roku and Google), Scylla (targeting advertising SDKs on Google Play and the Apple App Store),
      BADBOX 2.0, SlopAds, and Pushpaganda. The most recent major operation is Trapdoor, disclosed on
      May 19, 2026: a multi-stage scheme fusing malvertising distribution with hidden ad-fraud monetization
      across 455 malicious Android apps and 183 threat-actor-owned HTML5 domains. At its peak, Trapdoor
      accounted for 480 million bid requests per day, with associated apps downloaded more than 24 million
      times before Google Play removed the identified apps.


      Intelligence from these operations enriches the Decision Engine's ML models and is shared through
      private-sector and public-sector partnerships, including law enforcement agencies, app store operators,
      and cloud providers. This feedback loop between field research and product protection represents a
      technical moat that pure detection vendors cannot easily replicate. Satori also provides real-time
      event coverage—during Super Bowl LX in February 2026, HUMAN tracked 74 million blocked retail
      scraping attacks, a 33% rise in invalid bid requests, and a 5% increase in AI agent activity.
