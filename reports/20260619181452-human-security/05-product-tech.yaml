chapter:
  number: 5
  title: Product & Technology
  summary: >-
    HUMAN Security's Human Defense Platform (HDP) is a multi-surface cybersecurity suite spanning four
    product lines—Advertising Protection, Application Protection, Account Protection, and Client-side
    Defense—unified under the Sightline Cyberfraud Defense interface and extended in 2025 with
    AgenticTrust for AI-agent governance. The platform's decision engine analyzes 2,500+ signals per
    interaction using 400+ adaptive ML models in under two milliseconds across a behavioral signal
    network covering over 20 trillion interactions weekly. HUMAN's Satori Threat Intelligence team
    reinforces technical differentiation through proactive disruption operations, and the company holds
    a Forrester Wave Leader position (Q2 2026) with the sole 5/5 Threat Research score. Key evidence
    gaps include the absence of independent false-positive benchmarks, published uptime SLAs, and
    detailed privacy-audit disclosures.

sections:
  - id: human-defense-platform-overview
    title: Human Defense Platform — Product Lines and Customer Workflow
    body: >-
      The Human Defense Platform (HDP) is structured around a unified claim: that digital interactions
      should be verifiable as legitimate human activity, trusted AI-agent traffic, or confirmed automated
      threats before they reach the customer's revenue-generating workflows. Customers deploy HDP across
      three core workflow challenges. First, eliminating invalid traffic (IVT) and ad fraud from
      programmatic advertising supply chains, where DSPs and SSPs accept bids without validating the
      underlying traffic. Second, blocking automated abuse targeting web applications, mobile apps, and
      APIs, including credential stuffing, scraping, transaction abuse, and fake account creation. Third,
      securing user account journeys from initial registration through post-login financial activity.


      As of 2026, HDP comprises four named product lines available on the AWS Marketplace and through
      enterprise contracts: HUMAN Advertising Protection (formerly MediaGuard), safeguarding the
      programmatic advertising supply chain with pre-bid and post-bid IVT detection; HUMAN Application
      Protection (formerly Bot Defender), protecting web and mobile applications and APIs from
      sophisticated bot attacks including scraping, transaction abuse, and fake signups; HUMAN Account
      Protection (formerly Account Defender), covering the full account lifecycle with pre-login, at-login,
      and post-login defenses against credential stuffing and fake account fraud; and HUMAN Client-side
      Defense (formerly Code Defender), enabling control over third-party scripts running in user browsers
      and supporting PCI DSS 4 compliance obligations. An additional module, BotGuard for Growth Marketing,
      targets marketing funnel integrity by filtering bot-driven click fraud and fake lead generation.


      The Sightline Cyberfraud Defense platform, launched July 30, 2025, serves as the unified interface
      across all product lines, adding AgenticTrust for AI-agent classification and governance and Page
      Intelligence for AI-driven traffic analytics for marketing teams. The clean.io acquisition in 2022
      added real-time client-side JavaScript behavioral analysis for malvertising defense, expanding HUMAN's
      detection coverage earlier in the attack cycle. HUMAN serves 500+ global brands across media, finance,
      retail, government, and education verticals.
