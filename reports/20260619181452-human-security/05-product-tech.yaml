  - id: TE003
    title: Technology and Operating Architecture — Layers and Dependencies
    columns:
      - Layer / Component
      - Role
      - Key Technology / Specification
      - Dependencies
      - Risk
    rows:
      - - JavaScript Sensor (client-side)
        - Collects device fingerprints, behavioral biometrics, session and network signals from user browsers
        - JavaScript Sensor v9.6.6+ for AgenticTrust; injected via HTML <head> tag
        - Requires HTML head-tag access; blocked or degraded by browser ad-blockers and privacy extensions
        - Privacy-tool proliferation and server-side rendering reduce signal fidelity for a fraction of sessions
      - - Enforcer (server-side / edge)
        - Enforces bot verdicts inline at CDN, WAF, API gateway, or origin; blocks, redirects, or rate-limits confirmed threats
        - "20+ Enforcer integrations: AWS Lambda@Edge v4.8.0+, Cloudflare v6.12.0+, Fastly VCL v12.3.0+, Akamai EdgeWorker v4.4.0+, F5 BIG-IP v3.1.1+, Nginx, Kong, Azure Front Door v1.2.1+"
        - CDN/cloud provider availability; API-key management per integration; PHP, Python, Ruby runtimes unsupported for AgenticTrust
        - Single-provider CDN outage or integration-version mismatch can impair enforcement path; custom runtimes require manual SDK integration
      - - Decision Engine (cloud-hosted)
        - Central AI/ML verdict system; processes 2,500+ signals per interaction using 400+ adaptive ML models; delivers sub-2ms verdicts
        - Proprietary multi-region cloud stack; Precheck mechanism auto-validates ~95% of traffic; Profile Deviation Models 2.0 for post-login anomalies
        - HUMAN cloud infrastructure uptime; ML model refresh cadence; data partnership quality
        - Platform-side incidents directly affect customer protection; model updates can transiently affect false-positive rates
      - - Behavioral Signal Network (data foundation)
        - Training and inference data corpus; provides cross-customer threat correlation; enriches ML models with new attack patterns
        - 20T+ weekly interactions across 3B devices; 14+ years of behavioral data; supplemented by Satori IOC pipeline
        - Data partnerships with major ad exchanges, CDNs, and platforms; continuous data-partner agreements
        - Network effects depend on platform scale; smaller or niche verticals receive proportionally less correlated signal
      - - FraudSensor (post-bid ad detection)
        - Validates ad impressions after serving; filters bot and IVT-generated impressions before viewability calculation
        - Post-bid detection; supply-path-level signal analysis; MRC-accredited viewability output
        - Integration with DSP/SSP data pipelines; MRC audit compliance
        - Post-bid detection captures fraud after cost is incurred; does not prevent fraudulent bids, only validates outcomes
    notes: >-
      Architecture details derived from HUMAN technical documentation, AWS Marketplace listing, and
      SoftwareOne product catalog as of June 2026. Enforcer version minimums are from HUMAN's official
      AgenticTrust documentation. Risk assessments are analyst-inferred from public architecture
      disclosures; internal SLA and uptime data are not public.
    claimRefs:
