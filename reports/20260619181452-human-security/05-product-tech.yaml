  - id: trust-compliance-quality
    title: Trust, Compliance, Privacy, and Identified Limitations
    body: >-
      HUMAN's formal compliance posture is anchored by two external validations in 2026: MRC accreditation
      for Ad Viewability Measurement (granted April 27, 2026) and active TAG (Trustworthy Accountability
      Group) certification. The MRC accreditation is notable because HUMAN's methodology integrates
      FraudSensor IVT filtering directly into viewability calculation—the system counts only human-validated
      impressions as viewable, a security-first architecture that most pure viewability vendors do not
      implement. The accreditation covers display and video impressions across desktop, mobile web, and
      mobile app. The Client-side Defense product explicitly supports PCI DSS 4 client-side requirements
      by monitoring and enforcing JavaScript behavior policies in consumer browsers.


      Material limitations exist in the public evidence record. HUMAN has not published independent
      false-positive or true-positive rate benchmarks under controlled conditions, making it difficult for
      prospects to compare detection accuracy against competitors on a vendor-neutral basis. The decision
      engine operates as a "black box" from the customer's perspective: customers receive threat verdicts
      and attack profiles but have limited visibility into the specific model logic or signal weights.
      Enterprise customers have reported integration complexity for organizations with bespoke API
      infrastructure, and documentation depth for custom rule management is cited as an area for improvement.
      Additionally, HUMAN's Bot Management mindshare on PeerSpot declined from 11.6% to 8.1% year-over-year
      as of June 2026, suggesting competitive pressure despite strong analyst recognition.


      Privacy controls rely on standard enterprise SaaS practices. HUMAN's signal network collects
      behavioral and device data at massive scale; no independent privacy audit or detailed data retention
      policy has been made publicly available. For customers in regulated industries (healthcare, financial
      services, EU GDPR scope), the absence of a published independent privacy audit is a diligence gap.
      SOC 2 Type II compliance is implied by enterprise procurement standards but is not publicly confirmed.
