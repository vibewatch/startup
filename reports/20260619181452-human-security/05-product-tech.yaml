  - id: FE002
    title: Customer Protection Workflow — From Interaction to Enforcement
    type: flow
    layout: standard
    summary: >-
      End-to-end flow from an incoming digital interaction through sensor collection,
      decision-engine verdict, and differentiated enforcement for humans, bots, and AI agents.
    data:
      nodes:
        - id: "interaction"
          label: "Digital Interaction Arrives"
          description: "Ad impression, web/app/API request, or account action reaches customer property"
        - id: "sensor"
          label: "JavaScript Sensor Captures Signals"
          description: "Device fingerprint, behavioral biometrics, session history, network characteristics collected in-browser"
        - id: "engine"
          label: "Decision Engine Evaluates"
          description: "2,500+ signals processed by 400+ ML models; verdict issued in under 2ms"
        - id: "precheck"
          label: "Precheck: ~95% Auto-Validated"
          description: "Low-risk sessions pass immediately; no user interruption; allows legitimate automation"
        - id: "challenge"
          label: "Human Challenge: Ambiguous Sessions"
          description: "Interactive proof-of-humanity challenge deployed only for anomalous or high-risk signal profiles"
        - id: "enforcer"
          label: "Enforcer Executes Verdict"
          description: "CDN/WAF/API-gateway enforcer blocks, redirects, rate-limits, or governs per policy"
        - id: "agentictrust"
          label: "AgenticTrust: AI Agent Governance"
          description: "Agent classified by type and trust level; cryptographic verification for AWS Bedrock agents; per-action permissions enforced"
        - id: "telemetry"
          label: "Telemetry → Satori Feed"
          description: "Attack profiles and new IOCs feed Satori research loop; enriches ML models for next cycle"
      edges:
        - from: "interaction"
          to: "sensor"
        - from: "sensor"
          to: "engine"
        - from: "engine"
          to: "precheck"
          label: "Human (verified)"
        - from: "engine"
          to: "agentictrust"
          label: "AI Agent detected"
        - from: "engine"
          to: "enforcer"
          label: "Bot / threat confirmed"
        - from: "precheck"
          to: "enforcer"
          label: "Pass through"
        - from: "agentictrust"
          to: "enforcer"
          label: "Govern per policy"
        - from: "enforcer"
