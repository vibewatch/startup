  - id: deployment-integration-roadmap
    title: Deployment, Integration, and Product Roadmap
    body: >-
      HUMAN's deployment model is cloud-native and integration-forward. Customers access HDP through
      direct cloud contracts, the AWS Marketplace, or through channel partners including Carahsoft
      (federal and public sector distribution). The platform integrates with CDNs, WAFs, CIAM platforms,
      and analytics infrastructure without requiring rearchitecting of the customer's stack. Deployments
      range from lightweight Sensor-only implementations (for organizations that need signal coverage
      without inline enforcement) to full Sensor-plus-Enforcer deployments at the CDN or origin layer.


      The AWS partnership deepened materially in 2026 when AgenticTrust extended cryptographic
      verification support to Amazon Bedrock AgentCore traffic. AI agents built on the Bedrock platform
      are now cryptographically signed and policy-verified through HUMAN's AgenticTrust module, enabling
      enterprises to enforce granular per-action controls on AI agents operating within AWS-hosted
      applications. Supported integration targets for AgenticTrust (minimum Sensor version 9.6.6) include
      AWS Lambda@Edge from v4.8.0, AWS API Gateway from v0.1.1, Cloudflare from v6.12.0, Fastly VCL from
      v12.3.0, F5 BIG-IP from v3.1.1, and Azure Front Door from v1.2.1.


      On the standards front, HUMAN open-sourced a reference implementation of the HUMAN Verified AI
      Agent in November 2025, demonstrating HTTP Message Signatures (RFC 9421) for cryptographic agent
      identity—implemented via Ed25519 key pairs and the OWASP Agent Name Service (ANS v1.0) naming
      standard. This positions HUMAN as both a commercial vendor and an ecosystem standards contributor.
      The April 2026 Agentic Visibility expansion extended Sightline's bot and agent classification
      data natively into Adobe Experience Platform, making HUMAN the only bot-management vendor with
      a native Adobe integration for marketing measurement teams.
