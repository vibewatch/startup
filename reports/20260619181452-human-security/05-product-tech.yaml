  - id: TE002
    title: Customer Use Cases — Workflow, Solution, and Limitation
    columns:
      - User Job / Threat Scenario
      - Workflow Without HUMAN
      - HUMAN Solution Module
      - Measurable Benefit (Claimed)
      - Known Limitation
    rows:
      - - Programmatic ad buying; eliminate bot-driven IVT
        - DSPs accept bids including fraudulent invalid traffic; viewability metrics are inflated by bot impressions
        - Advertising Protection + FraudSensor (pre-bid and post-bid IVT filtering); MRC-accredited viewability
        - IVT-filtered impression counts; MRC-validated viewability; reduced wasted ad spend
        - Sub-2ms insertion adds latency on lowest-latency inventory paths; pre-bid coverage depends on DSP/SSP integration breadth
      - - Web application protection; block credential stuffing and scraping
        - Rate-limiting and CAPTCHA; sophisticated attackers rotate IPs and bypass CAPTCHAs at scale
        - Application Protection; 2,500+ signals analyzed; Precheck auto-validates ~95% of users; Human Challenge for ambiguous sessions
        - 95% of legitimate users pass without friction; sophisticated bot campaigns blocked via behavioral and device profiling
        - Complex rule management for multi-region or custom API configurations; documentation depth cited as improvement area
      - - Full-lifecycle account security; prevent ATO and fake accounts
        - Authentication at login only; post-login anomaly detection is reactive and session-scoped
        - Account Protection; pre/at/post-login behavioral continuity; device and session history across the account lifecycle
        - Lifecycle coverage reduces fraud that bypasses single-point login controls; covers fake account creation and compromised account use
        - No published TPR/FPR benchmarks; outcome metrics (fraud reduction %, chargeback rates) not independently verified
      - - Govern AI agents accessing digital properties
        - No standardized governance; organizations either block all bot-like traffic (blocking legitimate agents) or allow all automation
        - AgenticTrust within Sightline; classifies agent type and trust level; enforces per-agent permissions; cryptographic verification for AWS Bedrock agents
        - Enables agentic commerce without opening attack surface; reduces impersonation and excessive agentic scraping
        - Cryptographic verification limited to agents implementing HTTP Message Signatures; legacy agents without signature support default to behavioral heuristics
    notes: >-
      Benefit claims are company-stated or analyst-reported; independent outcome benchmarks are not
      publicly available. Limitation entries are derived from user reviews (TrustRadius, PeerSpot) and
      analyst commentary as of June 2026.
