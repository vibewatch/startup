callouts:
  - calloutType: strength
    title: Satori Threat Research — Sole Vendor with Forrester 5/5 Threat Research Score
    body: >-
      HUMAN's Satori team is the only vendor to receive a perfect 5/5 in the Threat Research criterion
      in the Forrester Wave Q2 2026 Bot and Agent Trust Management Software report. The team's disruption
      operations—ranging from the FBI-coordinated 3ve takedown to the May 2026 Trapdoor operation (455
      malicious apps, 480M bid requests/day at peak)—create a proactive intelligence loop that pure
      detection platforms cannot replicate without comparable research investment and public-sector
      relationships.
    claimRefs:
      - CE030
      - CE028
      - CE029

  - calloutType: strength
    title: AgenticTrust — First Cryptographic Agent Governance at AWS Scale
    body: >-
      The AgenticTrust extension to Sightline Cyberfraud Defense, combined with cryptographic
      verification support for Amazon Bedrock AgentCore (2026), positions HUMAN as the only
      bot-management vendor currently offering policy-aware cryptographic authentication for cloud-native
      AI agents. This establishes a technically defensible moat in the emerging agentic-commerce segment
      before most competitors have shipped comparable capabilities.
    claimRefs:
      - CE033
      - CE014
      - CE035

  - calloutType: risk
    title: Black-Box Detection and Absent Independent Benchmarks
    body: >-
      HUMAN's decision engine does not expose model logic, signal weights, or detection thresholds to
      customers. This opacity creates procurement challenges for enterprise risk teams that require
      auditability, and makes independent verification of claimed false-positive rates impossible.
      No vendor-neutral TPR/FPR study was identified in research, and PeerSpot mindshare declined
      from 11.6% to 8.1% year-over-year—a signal that practitioners are evaluating alternatives more
      actively.
    claimRefs:
      - CE044
      - CE045
      - CE046

  - calloutType: risk
    title: Privacy and Compliance Disclosures Lag Enterprise Standards
    body: >-
      HUMAN collects behavioral and device data across a quadrillion annual interactions. Despite this
      scale, no independent SOC 2 Type II audit report, GDPR compliance certification, or detailed data
      retention policy is publicly available. For customers in GDPR-scope jurisdictions or regulated
      industries, this disclosure gap represents a procurement friction point and a potential legal
      exposure if signal collection practices are challenged.
    claimRefs:
      - CE007
      - CE046

