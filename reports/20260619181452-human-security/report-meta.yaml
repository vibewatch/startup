companyProfile:
  summary: >-
    HUMAN Security was founded in 2012 as White Ops and rebranded in 2021 as it expanded from ad-fraud
    detection into a broader digital trust platform. The company now sells the Human Defense Platform
    across media security, application security, account protection, and agentic trust use cases,
    operating at internet scale with 20T+ verified weekly interactions and 500+ customer brands.
    Ownership and governance shifted materially after the 2020 Goldman Sachs/ClearSky/NightDragon
    acquisition, the 2022 PerimeterX merger, and the 2024 growth round. Despite strong strategic
    positioning and clear product-market relevance, the business remains financially opaque on revenue
    growth, retention, margins, and current valuation.
  foundedDate: '2012-01-01'
