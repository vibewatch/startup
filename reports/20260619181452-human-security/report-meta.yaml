  productSummary: >-
    The Human Defense Platform combines bot mitigation, ad-fraud detection, application and account-abuse
    defense, threat intelligence, and newer agentic-AI governance products such as HUMAN Sightline and
    AgenticTrust. It uses large-scale telemetry, device intelligence, behavioral signals, and the Satori
    Threat Intelligence team to classify and disrupt malicious automation in real time.
  customerFocus: >-
    Large digital businesses, adtech and media platforms, marketplaces, retailers, financial-services
    firms, and enterprise security teams that need to reduce fraud, invalid traffic, scraping, account
    takeover, and AI-agent abuse.
  businessModel: >-
    Enterprise cybersecurity software and managed intelligence platform sold through direct and partner
    channels across media security, application security, account protection, and trust-layer workflows.
  stage: Private growth stage
  fundingStatus: >-
    Approximately $300M total equity raised. Latest financing: $50M+ growth round announced in October
    2024 led by WestCap with Goldman Sachs Asset Management, ClearSky Security, NightDragon, and Vertex
    Ventures US. A $100M Blackstone Credit facility was also disclosed in 2022.
