  topStrengths:
    - Internet-scale telemetry and threat-intelligence network built on 20T+ weekly verified interactions.
    - Strong institutional backing with repeat support from Goldman Sachs, WestCap, NightDragon, ClearSky, and Vertex.
    - Product footprint spans media security, application protection, account abuse defense, and agentic-AI trust.
    - Credible external recognition including Forrester leadership and strong customer-review surfaces in 2026.
  topRisks:
    - Public financial opacity leaves ARR quality, retention, margin, and debt burden materially underwritten.
    - Bundled competition from Cloudflare, Akamai, Google, and other platform vendors can compress standalone pricing power.
    - Behavioral-data and fingerprinting models face evolving privacy and data-transfer regulation.
    - AWS/cloud concentration and real-time detection requirements create meaningful operational outage risk.
    - Adtech heritage may pull valuation multiples below pure-play cybersecurity peers in an exit process.
  unresolvedGaps:
    - Audited or management-confirmed ARR, growth, and product-segment revenue mix.
    - Net revenue retention, gross retention, churn, and average contract duration by customer segment.
    - Gross margin and cost-of-revenue split across threat intelligence, cloud infrastructure, and services.
    - Current outstanding balance, maturity, and covenants of the 2022 Blackstone Credit facility.
    - Updated post-2024 valuation, liquidation preferences, and cap-table ownership concentration.
