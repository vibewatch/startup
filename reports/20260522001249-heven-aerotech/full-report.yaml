      - number: '5.3'
        title: Maturity, Manufacturing, and Product-Line Readiness
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a real maturity hierarchy inside Heven’s lineup, and that hierarchy matters for
              underwriting. Z1 is the most mature product narrative because three different proof layers now line up:
              official product-page specs, Blue UAS Select plus ATO, and a public 12,000-foot density-altitude flight
              milestone with Army Research Labs cited as part of the broader test campaign. That does not make Z1 fully
              de-risked, but it does move it out of pure brochureware territory. Raider is next-most-interesting because
              the company has been marketing it aggressively, describing 50-pound payload / 12-plus-hour endurance
              capability and linking it to Mach-backed production scaling, yet it still lacks the same quality of public
              deployment proof or procurement qualification that Z1 now has. H2D55 has an official role in the family
              and is included in the Mach manufacturing plan, but retained sources do not show the same level of current
              test or customer proof. HyTEC is even earlier in maturity: it is strategically important because it
              addresses the field-hydrogen bottleneck, but the public description is still prototype refinement,
              demonstration, and operational evaluation rather than fielded serial product. Manufacturing readiness is
              improving but remains dependency-heavy. The Mach partnership moves H100, H2D55, and Raider production into
              Forge Huntington and explicitly calls out co-development of avionics, radios, fuel sources, and propulsion
              systems, which is helpful for scale but also makes Heven dependent on supplier and partner execution
              outside the core aircraft shell. The developer-signal reinforces that this scale-up is real rather than
              theoretical, because the recruiting surface now spans quantum, AI/ML, software, fuel-cell powertrain,
              hydrogen production, composites, logistics, and production roles. Still, public materials do not disclose
              reliability metrics, maintenance burden, or delivery cadence, so maturity should be read as “advancing but
              uneven,” not as a blanket claim that the full catalog is deployment-proven.
