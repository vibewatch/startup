      - number: '3.4'
        title: Durability of Differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest case for Heven is not “hydrogen beats all drones,” but that hydrogen can be a meaningful
              system advantage in a narrow band of missions where buyers need low-signature, multi-hour,
              runway-independent free flight and cannot accept frequent battery swaps or fixed tether geometry. That is
              a real wedge in austere ISR and some logistics or remote inspection missions. The adverse read is equally
              important. AeroVironment and Shield AI already show that military buyers can get long endurance from
              multi-fuel or heavy-fuel architectures that fit existing fuel chains. Skydio, Red Cat, and Anduril show
              that autonomy, operator burden, and procurement speed can matter more than persistence in shorter-range
              tactical jobs. Elistair shows that persistence itself can be decomposed into a tethered infrastructure
              product instead of a hydrogen aircraft. That leaves Heven with a conditional moat: if it can combine
              hydrogen endurance with proven procurement channels, logistics simplification, and real mission win rates,
              the differentiation is durable enough to matter. If not, hydrogen risks becoming a niche complication
              inside a market that is already filling with trusted-supply alternatives.
