      - number: '4.3'
        title: Cost Structure, Working Capital, and Capex Implications
        blocks:
          - type: paragraph
            body: >-
              The cost structure implied by Heven’s public materials is more complex than a standard battery-drone OEM.
              Manufacturing expansion alone would create tooling, facilities, inventory, supplier prepayments, and
              quality-assurance burdens. Heven is also separately funding hydrogen field infrastructure, which means
              capital is being deployed into trailers, generation systems, solar or off-grid capability, storage,
              mobility, and deployment usability—not just airframes. Public-company benchmarks show why that matters.
              AeroVironment can still see gross margin pressure at scale, while Red Cat’s latest quarter combined
              low-teens gross margin with a large step-up in inventory and prepaid inventory and meaningful operating
              cash burn. Joby’s filings show the same pattern in larger form: hardware scale-up consumes large amounts
              of operating cash and capex before commercialization is mature. Heven’s hydrogen overlay makes the
              working-capital question even sharper because the field-support stack may have to be built or financed
              before recurring orders are visible. GAO and Wood Mackenzie add the adverse macro context: hydrogen still
              faces high cost, thin infrastructure, offtake uncertainty, and regulatory complexity, so Heven is exposed
              to both company execution risk and infrastructure economics it does not fully control.
