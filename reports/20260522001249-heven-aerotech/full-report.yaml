        title: Revenue Model and Pricing Visibility
        blocks:
          - type: paragraph
            body: >-
              Heven’s economic model is best understood as a bundled defense-hardware and field-support offering rather
              than a SaaS business. Public sources support four monetization layers: direct or channel-led airframe
              sales, hydrogen generation or refueling equipment, integration or sustainment work around deployed
              systems, and advanced-systems upgrades tied to autonomy, quantum-secure communications, and GPS-denied
              positioning. What the public record does not provide is almost every variable that would let an investor
              underwrite those layers. The company’s own product pages market mission value and endurance, but not list
              prices for Raider or H2D55, and they do not disclose warranty terms, services pricing, or realized
              discounts. The clearest pricing signal in the visible channel is actually not price but route-to-market:
              SupplyCore puts Z1 into an established government catalog path, and the Army BOA adds a contract vehicle
              for Z1 and associated hydrogen generation systems. That is useful evidence that Heven can monetize more
              than an aircraft body, but it still points to lumpy program revenue with negotiated pricing rather than
              clean recurring ARR.
