            body: >-
              The best way to read Heven's 2026 customer evidence is as a ladder of proof quality. Blue UAS Select
              status and the Army BOA materially reduce procurement friction, but neither one is the same thing as a
              funded program of record, a task-order backlog, or repeat revenue. Acquisition.gov's FAR language is
