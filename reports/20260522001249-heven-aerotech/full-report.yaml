      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership is still one of the clearest indicators that Heven is scaling from founder-led product company
              toward a more structured defense supplier. Levinson remains CEO and the dominant public narrator across
              origin story, rebrand messaging, financing, and market positioning, which creates meaningful key-person
              dependence even as the operating bench broadens. Michael Buscher has become the public face of U.S.
              operations, headquarters expansion, and Army procurement access. Since late 2025 the company has also
              filled critical control functions: Constance O’Brien for finance, Samantha Hamilton for AI, Kimberly
              Crooker for contracts and procurement, and retired Lt. Gen. Scott Howell for senior defense advisory
              credibility. Those additions are directionally positive because they align with the capabilities Heven
              would need to convert a promising platform into a scalable, government-facing business. Governance
              visibility is still incomplete, however. Fetched sources show advisory additions and investor-linked board
              participation, but not a complete public board roster, voting rights map, or cap-table-driven control
              structure. That leaves diligence still dependent on direct company disclosures for the governance layer
              that most affects downside protection.
