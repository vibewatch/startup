      - number: '3.3'
        title: Channels, Pricing, and Substitute Pressure
        blocks:
          - type: paragraph
            body: >-
              Competitive outcomes here are shaped as much by channels and acquisition plumbing as by airframe specs.
              Heven’s SupplyCore agreement is strategically important because it plugs a young hydrogen OEM into an
              existing government purchasing path rather than forcing the company to build every defense relationship
              itself. But the same logic helps larger rivals: Skydio’s largest Army order moved through Atlantic Diving
              Supply in under 72 hours; Red Cat’s Black Widow can move through NATO’s NSPA catalogue; Quantum is
              building U.S. production and dealer capacity; and the Army’s company-level sUAS award used DLA Tailored
              Logistics to accelerate fielding. Public pricing, meanwhile, is mostly absent. Across the retained
              official pages, vendors route buyers toward contact, dealer, catalogue, or contract vehicles, not checkout
              pricing, so the public record does not resolve who is cheapest on acquisition or sustainment. That opacity
              matters because Heven’s hydrogen case is most exposed where batteries or tethers already clear the mission
              threshold. If a unit really needs only 40-50 minutes, Skydio or Red Cat can be “good enough” without new
              fuel handling. If a base needs stationary overwatch, Elistair’s tethered model can beat hydrogen on
              continuous dwell without needing any free-flight fuel cycle at all.
