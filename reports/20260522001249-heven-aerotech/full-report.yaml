      - number: '2.2'
        title: Sizing Lenses and Market Range
        blocks:
          - type: paragraph
            body: >-
              The sizing problem is that most available drone forecasts are too broad for Heven, while the narrowest
              inspection estimates omit defense and public-safety demand. McKinsey's 2017 U.S. lens reaches $8-20
              billion of annual manufacturing/service activity and $31-46 billion of annual GDP impact by 2026, but
              those figures sweep in many use cases with no hydrogen, no Blue UAS filter, and no procurement
              constraints. Drone Industry Insights markets a global drone market above $83 billion by 2035 and
              explicitly breaks out public emergency services, energy, inspection, delivery, and transport
              infrastructure, which is directionally useful because it shows the relevant adjacent cuts. Narrower
              inspection-specific sources are far smaller: MarketsandMarkets projects inspection and monitoring at $23.0
              billion by 2027 from an $11.6 billion 2022 base, while Verified Market Reports pegs industrial inspection
              drones at $5.2 billion by 2034 from a $1.5 billion 2025 base. The practical conclusion is that Heven's
              evidence-constrained SAM is the overlap of defense procurement, public safety, and inspection-heavy
              workflows where persistence and trusted sourcing matter; using whole-drone TAMs would overstate the
              investable market.
