  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Set and Job Overlap
        blocks:
          - type: paragraph
            body: >-
              Heven is not competing with the entire drone industry, nor with passenger eVTOL narratives. The relevant
              competitive set is the narrower overlap of long-endurance, runway-independent, trusted-supply aircraft
              that can support tactical ISR, selective logistics, and austere inspection missions. That puts
              AeroVironment JUMP 20/JUMP 20-X, Shield AI V-BAT, and Quantum Systems Vector closest to Heven on the core
              free-flight persistence job, even though their weight classes, payload envelopes, and maritime bias
              differ. Skydio X10D and Red Cat Black Widow solve a different slice of the problem: shorter-endurance but
              highly deployable battery systems with stronger public evidence of tactical-unit adoption, autonomy, and
              procurement speed. Anduril Ghost-X is better read as an adjacent software-defined entrant that brings
              payload flexibility, Army access, and a broader autonomy stack rather than a hydrogen-like powertrain
              edge. Elistair Khronos is the most important status-quo substitute for fixed-site persistence because it
              can keep ISR aloft for a full day without free-flight refueling, albeit at the cost of maneuver radius.
              The upshot is that Heven’s market is real but layered: only some competitors match the same job
              end-to-end, while several others remove the need for hydrogen by solving enough of the mission with
              batteries, tethering, or stronger software and channel positions.
