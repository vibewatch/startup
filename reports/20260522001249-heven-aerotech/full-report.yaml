        blocks:
          - type: paragraph
            body: >-
              Heven’s 2025-2026 milestone sequence is unusually coherent for a private defense-tech company: product
              validation through the 12,000-foot Z1 demo, a rebrand tied to Zepher integration, a Sterling headquarters
              opening, Blue UAS Select qualification, a $100 million Series B at a $1 billion valuation, an Army BOA
