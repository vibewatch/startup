        - >-
          Must show funded backlog, real revenue scale, and improving unit economics; breaks if disclosure stays thin or
          demand slips.
      - - Base
        - >-
          Defense interest is real but converts gradually, disclosure remains partial, and the round mostly funds
          execution rather than proving economics.
        - 600-1,000
        - Most consistent with the current public evidence set.
        - >-
          Must avoid a near-term bridge raise and show at least initial order conversion; breaks if the BOA remains
          pathway-only.
      - - Bear
        - >-
          Hydrogen infrastructure remains expensive, procurement conversion lags, and another raise arrives before
          backlog or margin proof appears.
        - 200-500
        - A live downside if milestones slip inside the next 12-18 months.
        - >-
          Break is triggered by another financing before visible order proof, persistent opacity, or weak logistics
          economics.
    notes: >-
      These are public-evidence scenario brackets, not mark-to-model outputs. Because Heven withholds revenue, margin,
      backlog, and round terms, the ranges are intentionally broad and should be read as sanity bands rather than
      precision estimates.
