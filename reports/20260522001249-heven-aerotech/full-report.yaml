        title: Delivered Platforms and User Workflow
        blocks:
          - type: paragraph
            body: >-
              The retained 2026 product surface shows a real, if uneven, delivered lineup rather than a single hero
              drone. The active hydrogen portfolio page still centers on three airframes: the Z1 / H2D250 for compact
              tactical ISR and other long-persistence missions, Raider for heavier contested-logistics or
              lift-and-deliver jobs, and H2D55 for endurance multirotor hovering tasks. The same official surface still
              keeps H100 and Urban product pages live, which suggests a broader catalog history, but current procurement
              and demo evidence is concentrated on Z1, Raider, H2D55, and the hydrogen support stack rather than on
              those adjacent families. In user-workflow terms, Heven is not just selling “a drone”; it is marketing a
              mission package built around fast setup, runway-independent VTOL launch, long endurance with lower
              acoustic and thermal signature than combustion alternatives, modular payload swaps, and—when operations
              extend beyond a single sortie—a field hydrogen support concept that reduces dependence on repeated battery
              swaps or fuel-convoy resupply. The Z1 is the clearest embodiment of that workflow because public materials
              tie it to Blue UAS approval, Army procurement access, rapid setup, and ISR or public-safety missions.
              Raider extends the same concept into heavier logistics roles, while H2D55 covers longer-duration hovering
              or persistent overhead work. What remains missing is a single canonical, harmonized public datasheet set:
              Heven’s own Z1/H2D250 and H2D250 pages do not present one fully aligned specification baseline, which
              matters because buyers and investors still need to know exactly which configuration is production-standard
              today.
