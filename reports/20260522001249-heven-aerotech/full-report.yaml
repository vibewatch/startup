      - number: '3.2'
        title: Capability, Procurement, and Readiness Comparison
        blocks:
          - type: paragraph
            body: >-
              On raw persistence, Heven is differentiated but not alone. Military.com reports the Z1 at more than eight
              hours with a 10-pound payload, and Sesame markets a two-aircraft nanogrid package for continuous coverage.
              That is meaningful, but AeroVironment already fields 13+ hour JUMP 20 variants with 30-pound payloads, and
              Shield AI markets 12-13+ hour V-BAT endurance with JP-5 and SATCOM for maritime or expeditionary ISR.
              Quantum does not match those durations, yet its Vector and Trinity systems still reach 180 and 90 minutes
              respectively while keeping electric simplicity and fast setup. At the shorter end, Skydio and Red Cat
              concede endurance but counter with Blue-UAS-compliant battery systems designed for GPS-denied autonomy,
              quicker squad-level adoption, and public evidence of urgent Army or NATO procurement. Anduril’s Ghost-X
              sits in between: shorter endurance than Heven, but a much larger payload and a Lattice-driven command
              stack that fits the Army’s “system, not just airframe” buying logic. For buyers, that means Heven wins
              only when low-signature, multi-hour free-flight persistence matters more than fuel simplicity, AI stack
              maturity, or near-term fielding scale.
