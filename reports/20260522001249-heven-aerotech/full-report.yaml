      - number: '5.4'
        title: Compliance, Airspace, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The top product-technology read-through from 2026 is that Heven has become much more procurement-ready for
              U.S. defense users than it is universally ready for all operators or jurisdictions. Blue UAS Select and
              the Army BOA materially improve trust, cybersecurity, supply-chain, and procurement positioning for the Z1
              in the U.S. federal market. The same regulatory environment also creates a hard dependency: the FCC’s 2026
              covered-list framework now treats foreign-country UAS and critical components as restricted unless they
              fall under trusted categories such as the DCMA Blue UAS Cleared List or domestic-end-product exceptions.
              That means supply-chain compliance is no longer a branding point; it is part of whether the product can be
              bought and fielded. Civil deployment is a separate gating issue. The FAA’s own waiver guidance makes clear
              that BVLOS, operations in controlled airspace, operations above 400 feet AGL, and other non-standard
              missions need waiver support and detailed risk-mitigation plans, with review cycles that can run up to 90
              days. So Heven’s endurance and altitude achievements do not automatically translate into routine civil
              operations. Hydrogen logistics is the other major technical risk. HyTEC exists precisely because fuel
              availability, mobility, and off-grid generation remain operational problems to solve, and public sources
              still do not disclose hydrogen production economics, turnaround time, purity, safety handling, or
              maintenance burden. Export is similarly unresolved in public evidence: Mach’s partnership language
              references sovereign production for U.S. allies, but no retained source provides a specific BIS/DDTC
              classification or export-license path for Heven platforms. The result is a company with credible product
              momentum, but one whose technical maturity still depends on logistics, compliance, and partner execution
              that remain only partly transparent.
