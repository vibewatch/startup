      - number: '8.4'
        title: Recommendation, Kill Triggers, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The public record supports a research-more recommendation, medium confidence, high risk rating, and
              stretched valuation stance at the current $1 billion financing anchor. That is not a call that the company
              lacks potential. It is a call that price discipline has to come before technology enthusiasm when public
              evidence is this incomplete. What must be true for upside is straightforward: disclosed funded orders, a
              backlog bridge, proof that hydrogen field support can scale without destroying capital efficiency, and
              enough gross-margin or unit-economics visibility to show the round is funding acceleration rather than
              buying time. What breaks the thesis is equally straightforward: another raise before demand proof,
              persistent absence of revenue and backlog disclosure, or evidence that hydrogen infrastructure remains
              commercially awkward even if the aircraft perform. Until those questions are answered, public comps can
              only bracket the range of outcomes; they cannot validate the current price. The right next step is not to
              buy the round on narrative. It is to demand the private evidence set that would let the narrative survive
              contact with underwriting.
