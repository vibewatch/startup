      - number: '8.3'
        title: Bull, Base, and Bear Scenario Underwriting
        blocks:
          - type: paragraph
            body: >-
              Because Heven withholds the variables needed for a discounted cash flow or clean revenue-multiple model,
              the best public method is scenario bracketing. The bull case requires three things to become visible
              quickly: funded order conversion off the defense access stack, credible proof that hydrogen logistics
              improve mission economics instead of simply adding capital burden, and a disclosed revenue or backlog base
              that would make the current price look closer to late-stage growth hardware than speculative story stock.
              The base case gives credit for real product differentiation and policy tailwinds but assumes public
              disclosure stays thin, hydrogen support remains expensive, and procurement conversion arrives more slowly
              than the narrative implies. The bear case assumes the BOA remains pathway rather than demand proof,
              hydrogen infrastructure continues to face cost and market friction, and the company needs more capital
              before order proof closes the gap. Those are not abstract possibilities; they are the direct transmission
              lines from the current evidence set into valuation.
