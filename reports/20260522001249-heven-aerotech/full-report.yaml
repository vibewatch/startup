      - number: '7.4'
        title: Mitigations, Ranking, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The risk ranking for Heven today is, in order: first, DoD concentration and order-conversion risk; second,
              hydrogen logistics and field reliability risk; third, export, trusted-sourcing, and FCC-policy risk;
              fourth, civil commercial-adoption risk tied to FAA timing and hardware burden; fifth,
              manufacturing-quality and disclosure opacity; sixth, autonomy-governance and assurance risk; seventh,
              capital-intensity and financing risk; and eighth, broader partner concentration risk. The reason the
              order-conversion risk ranks first is simple: most other risks remain survivable if the company quickly
              turns access into funded programs that create cash-flow visibility and operational learning. Without that
              conversion, all of the other open questions compound rather than amortize.


              There are real mitigations already in place. Blue UAS Select and ATO reduce trusted-flyer friction inside
              the federal market. The Army BOA lowers administrative lead time for future orders. HyTEC and Sesame-style
              field refueling concepts are directionally aligned with the biggest hydrogen bottleneck. The policy
              environment is also favorable in one important sense: the White House, BIS, FCC, DIU, and FAA are all
              actively reshaping rules to promote trusted domestic drones. But those same mitigations create a sharp
              kill-criteria framework. If funded orders do not materialize on the back of Blue UAS and the Army BOA, if
              hydrogen refueling and reliability stay at prototype-and-marketing stage, if trusted-sourcing rules force
              redesign or limit export flexibility, or if civilian BVLOS economics remain unattractive even after rule
              progress, then the investment case loses its core narrative of policy-backed acceleration. The top
              kill-criteria risk is therefore failure to convert trusted defense access into funded orders before
              hydrogen logistics and compliance burdens prove out.
