  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Buyer Map
        blocks:
          - type: paragraph
            body: >-
              Heven's real market is not 'all drones' but the subset where long endurance, secure supply chains, and
              rapid field deployment matter enough to justify hydrogen complexity. Official DIU and Army signals show
              that trusted, NDAA-compliant small UAS now sit inside a gated defense market shaped by Blue UAS
              qualification and contract-vehicle access rather than purely by airframe performance. On the civil side,
              public safety and critical-infrastructure buyers care about different things: flight duration, time to
              redeploy, camera quality, data workflows, and safe-authority compliance. Utilities and transport agencies
              similarly buy inspection outcomes—coverage, repeatability, AI-assisted asset intelligence, and reduced
              crew exposure—not just aircraft. That boundary excludes hobby/photography drones, broad consumer drone
              spend, passenger eVTOL narratives, and much of the last-mile delivery hype. It includes aircraft, payload
              integration, secure software, training, sustainment, and the hydrogen generation/refueling stack when
              persistence-critical missions require them. Framed this way, Heven belongs in the market for dual-use,
              long-endurance, trusted-supply UAS serving defense, public safety, and industrial inspection workflows.
            claimRefs:
