      - number: '1.3'
        title: Capital, Partners, and Commercial Position
        blocks:
          - type: paragraph
            body: >-
              The central fact in Heven’s recent capital story is the December 2025 Series B: $100 million at a $1
              billion valuation, led by IonQ with participation from returning investor Texas Venture Partners. That
              round matters less as a vanity “unicorn” marker than as a signal that the company is being financed to
              scale domestic manufacturing, hydrogen logistics, and quantum-enabled navigation and communications around
              a defense-first product roadmap. Public evidence also shows that the stakeholder map is broader than
              equity investors alone. Zepher Flight Labs supplies acquired VTOL engineering capacity; Blue UAS Select
              opens the door to trusted-flyer status inside the Pentagon; the Army BOA creates an acquisition path for
              Z1 and related hydrogen systems; Sesame Solar extends the field-energy story; and SupplyCore adds a
              government-channel reseller. The commercial catch is that these are mostly access and enablement signals,
              not audited proof of recurring revenue. TechCrunch’s $115.2 million total-raised figure is useful but not
              definitive, while backlog, customer count, and contractual commitments remain undisclosed. The result is a
              company with unusually strong strategic momentum relative to the amount of public operating data investors
              can independently verify.
