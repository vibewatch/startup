companyProfile:
  summary: >-
    Heven AeroTech is a 2019-founded hydrogen UAS company with Israeli roots and a current U.S. base in Sterling,
    Virginia. After rebranding from Heven Drones and acquiring Zepher Flight Labs, the company has centered its story on
    long-endurance, runway-independent aircraft plus the hydrogen-generation and refueling systems needed to keep them
    operating in austere environments. Its most credible public milestones are the Z1's Blue UAS Select approval, the
    January 2026 Army Basic Ordering Agreement pathway, and a December 2025 $100 million Series B at a $1 billion
    valuation. The opportunity is real, but public evidence still describes Heven more as a strategically positioned
    access story than a financially disclosed scaling business.
  foundedDate: '2019-01-01'
  founders:
    - name: Bentzion Levinson
      role: Founder & CEO
      background: Links Heven's origin story to 2018 Gaza fire-kite and drone threats and to later IDF reserve combat experience.
      claimRefs:
