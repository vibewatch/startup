      - number: '2.4'
        title: Adoption Constraints and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The limiting factors are not awareness or curiosity; they are regulation, budgets, and hydrogen logistics.
              FAA pages still describe BVLOS as a proposed normalization effort with detailed requirements for
              operations, manufacturing, separation, authorizations, security, reporting, and record keeping, and the
              public-safety channel remains wrapped in toolkit, authority, and incident-management guidance rather than
              open-ended freedom to fly. That slows civilian scale-up even in high-ROI inspection markets. Public safety
              willingness to experiment also should not be mistaken for immediate hydrogen conversion: NIST found 70%
              would consider alternative power sources, but the same survey still preferred electric systems over hybrid
              or liquid fuel and showed a majority wanted broadband-support drones priced at $10,000 or less. Hydrogen
              infrastructure adds a second choke point. DOE says commercialization still depends on storage,
              transmission, distribution, delivery, and dispensing improvements. IEA and academic reviews show announced
              low-emissions hydrogen projects, pipelines, and storage are far from full investment commitment, while
              skeptical infrastructure analysis argues centralized build-outs require years, tens of billions of
              dollars, and major regulatory shifts. That makes the market attractive only where hydrogen endurance
              offsets these frictions—not everywhere a broad drone TAM slide claims it can.
