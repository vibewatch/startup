            body: >-
              Durability remains the largest analytical gap in Heven's customer chapter. Retention, repeat purchase, and
              usage depth are the metrics that would tell an investor whether strong top-of-funnel interest is
              converting into a sticky installed base, and the public record does not currently disclose them. None of
              the retained sources provide customer count, active fleet size, task-order cadence, contract value,
              renewal rate, NRR, GRR, churn, average contract length, sortie volume, or flight hours by account. The
              absence is especially important because Heven itself now makes larger claims about customer demand: the
              Series B announcement says demand is rising from U.S. Special Operations Command, combatant commands, and
              allied forces, while official surfaces keep describing operational deployments worldwide. Those claims may
              be directionally true, but they do not show whether demand has translated into disclosed purchase orders,
              funded follow-ons, or repeat usage metrics. The practical read-through is that durability has to be
