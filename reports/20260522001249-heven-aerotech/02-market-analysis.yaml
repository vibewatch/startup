  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-safety-budget-real-spend
    missingEvidence: Current 2026 program-level budgets or contract sizes for endurance-focused public-safety drones rather than survey-based willingness-to-pay proxies.
    whyItMatters: Budget sensitivity determines whether hydrogen endurance can clear procurement thresholds outside federally funded pilots.
    diligencePath: Request recent quotes, grant awards, and budget line items from target agencies and distributors, and compare them with battery-based alternatives.
    relatedQuestionRefs:
    - QM013
    relatedTableRefs:
    - TM003
    - TM004
  - type: private-evidence-only
    severity: material
    topic: defense-order-values
    missingEvidence: Public task-order values, recurring order volumes, and funded program quantities for hydrogen-capable Blue UAS vendors under current contract vehicles.
    whyItMatters: Blue UAS qualification and BOAs are access enablers, but valuation depends on whether they convert into repeatable revenue at meaningful scale.
    diligencePath: Ask management for BOA task-order history, pipeline by program office, and evidence of funded follow-on deployments versus pilot or evaluation activity.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
    - TM004
  - type: missing-source
    severity: material
    topic: field-hydrogen-cost-and-availability
    missingEvidence: Deployment-region evidence on delivered hydrogen cost, refueling cadence, on-site generation economics, and safety workflow burden for likely Heven use cases.
    whyItMatters: Hydrogen endurance is only commercially valuable if fuel access and handling do not erase the operating benefit versus batteries or conventional fuels.
    diligencePath: Model specific use cases with actual hydrogen suppliers, mobile-generation partners, and operator SOPs for defense, public safety, and utility inspection deployments.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM001
    - TM004
  - type: missing-source
    severity: minor
    topic: segment-level-sam-precision
    missingEvidence: A public source that isolates the long-endurance dual-use hydrogen-drone SAM instead of broad drone, inspection, or public-safety categories.
    whyItMatters: Without a direct market isolate, investors must synthesize from multiple lenses and risk over- or under-sizing the company’s reachable market.
    diligencePath: Build a bottom-up SAM from named programs, agency counts, inspection frequencies, and per-program pricing instead of relying on analyst TAM headlines.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM002
