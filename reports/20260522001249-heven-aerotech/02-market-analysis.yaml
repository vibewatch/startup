  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - DoD and federal long-endurance small UAS
    - Airframe, payload integration, secure software, sustainment, ground control, contract-vehicle access
    - MALE/HALE programs, consumer drones, generic counter-UAS
    - Program offices, contracting commands, operational units
    - Highest-fit near-term market because Blue UAS and NDAA compliance directly shape purchasing
  - - State and local public safety UAS
    - Aircraft, cameras, training, batteries / refuelers, maintenance, data management
    - Broad hobby, media, and non-mission recreational use
    - Police, fire, EMS, emergency management budgets
    - Relevant for search-and-rescue, wildfire, disaster response, and situational awareness when endurance or redeploy burden matters
  - - Utility and critical-infrastructure inspection
    - Aircraft, sensors, AI analytics, data storage, vegetation / asset workflows
    - General-purpose consumer photo drones
    - Utility reliability, asset-management, and operations budgets
    - Relevant adjacency because ROI is tied to safer inspections, broader coverage, and fewer manual checks
  - - Transport infrastructure and public works inspection
    - Bridge, roadway, rail, tower, and facility inspection workflows plus supporting data platforms
    - Passenger eVTOL and unrelated advanced air mobility spend
    - DOTs, authorities, contractors, grant-funded programs
    - Useful adjacency where BVLOS and repeatable data collection create economic value
  - - Disaster response and infrastructure security
    - Persistent ISR, damage assessment, perimeter monitoring, emergency communications support
    - Generic surveillance spend without operational persistence needs
    - Federal / local responders, facility owners, security budgets
    - Strong mission fit for long endurance but often episodic and procurement-driven
  - - Logistics and delivery adjacency
    - Specialized long-range or austere resupply missions plus enabling ground infrastructure
    - Mainstream urban last-mile delivery and passenger transport
    - Defense logisticians or niche commercial operators
    - Adjacency only; near-term maturity still lags operations and inspection use cases
  notes: Boundary is defined by mission persistence, trusted sourcing, and workflow economics; broad consumer or passenger-drone categories are explicitly excluded.
