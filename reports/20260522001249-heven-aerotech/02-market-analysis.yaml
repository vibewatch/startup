callouts:
- calloutType: insight
  title: Hydrogen is a niche amplifier, not a universal default
  body: Hydrogen matters when mission persistence, standoff search time, or inspection coverage saves more than the logistics burden it adds. That is why defense, disaster response, and some infrastructure inspections fit better than routine short-hop public-safety missions.
  claimRefs:
  - CM007
  - CM027
  - CM028
  - CM029
  - CM052
  - CM053
- calloutType: risk
  title: The biggest valuation mistake is to use the whole drone TAM
  body: Broad drone and GDP-impact forecasts are useful ceiling context, but they include delivery, consumer, and other categories where Heven has no near-term right to win. The investable market is the much narrower overlap of trusted procurement, persistence-critical operations, and workable hydrogen logistics.
  claimRefs:
  - CM009
