- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Blue UAS / NDAA-compliant sourcing pressure
    - Positive
    - Current
    - Raises value of domestic, secure, trusted-supply platforms versus foreign-made incumbents
    - Which Heven configurations and components remain fully compliant at scale?
  - - Army demand for thousands of low-cost SUAS
    - Positive but mixed
    - Current
    - Confirms real defense pull but also reminds investors that price and production capacity matter
    - Can Heven hit required cost, capacity, and support thresholds without losing endurance advantage?
  - - Public-safety installed base and mission familiarity
    - Positive
    - Current
    - Shows agencies already know how to use UAS, reducing education burden
    - Which public-safety use cases truly need hydrogen versus better batteries and more spares?
  - - Inspection ROI and safety gains
    - Positive
    - Current to near-term
    - Utilities and infrastructure operators can justify drones through avoided risk and labor savings
    - What quantified ROI or outage-prevention case studies can Heven show in inspection-heavy workflows?
  - - Hydrogen endurance and lower redeploy burden
    - Positive
    - Current to near-term
    - Best missions are persistence-critical tasks where battery swaps or crew repositioning are expensive
    - What missions deliver the largest endurance premium in practice?
  - - BVLOS rulemaking and authorization complexity
    - Negative
    - Current
    - Slows civilian scaling even when economics are attractive
    - Which target deployments can operate today under existing waivers, COAs, or constrained profiles?
  - - Public-safety budget sensitivity
    - Negative
    - Current
    - Local agencies may value endurance but still resist premium system cost
    - What grant paths, leasing structures, or bundled-service models can narrow upfront sticker shock?
  - - Hydrogen storage / delivery infrastructure gap
    - Negative
    - Current to medium-term
    - Field fuel availability can limit conversion even when aircraft performance is strong
    - What delivered-hydrogen cost and refueling plan exist for likely deployment regions?
  - - Pipeline / storage investment bottlenecks
    - Negative
    - Medium-term
    - Hydrogen supply scale-up is slower than headline project announcements imply
    - How dependent is Heven on external hydrogen build-out versus distributed generation?
  - - Inflated broad TAM narratives
    - Negative
    - Current
    - Can produce valuation overreach by counting unrelated delivery, consumer, or air-taxi segments
    - Which narrow mission segments are actually reachable in the next 24-36 months?
  notes: Drivers and constraints are mixed because the same factors that make Heven strategically interesting—trusted sourcing, persistence, and hydrogen differentiation—also expose the business to procurement, regulatory, and fuel-logistics bottlenecks.
