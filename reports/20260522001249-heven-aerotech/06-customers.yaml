  - Segment
  - Deployment / use case
  - Production vs. pilot
  - Documented outcome
  - Limitation / caveat
  rows:
  - - U.S. Army / Redstone Arsenal UAS Project Office
    - Defense end customer / procurement authority
    - Army units can procure Z1 hydrogen UAS and associated hydrogen generation systems through the BOA
    - Procurement pathway, not disclosed fielded fleet
    - Named Army procurement vehicle effective January 2026 and linked to rapid deployment, testing, fielding, and sustainment
      objectives
    - No public task orders, contract value, delivery schedule, or repeat-order data
  - - SupplyCore government channel
    - Defense distributor / reseller
    - Authorized reseller adds catalog access and SOF Week exposure for government and defense buyers
    - Channel rollout and evaluation surface, not named deployment
    - Z1 is in SupplyCore catalog and promoted to operators and decision-makers at SOF Week 2026
    - Distributor evidence does not identify paying agencies or active utilization
  - - NextTech Solutions route
    - Public-safety and federal systems-integrator channel
    - Group II / III UAS route from local first responders to federal defense programs via integrator contract vehicles
    - Channel and integration proof, not named agency program
    - Public partnership shows procurement and integration path into government missions
    - No named local agency, pilot outcome, contract value, or repeat revenue disclosed
  - - SOCOM / combatant commands / allied forces demand
    - Company-stated defense demand cohort
    - Series B materials say capital is being deployed to meet demand for long-endurance energy-independent UAS
    - Demand signal only
    - Public materials show these buyers are being targeted in 2026 and help explain why Heven is scaling U.S. manufacturing
      and logistics
    - No retained source identifies a signed SOCOM, combatant-command, or allied purchase order
  notes: This enumeration intentionally mixes end-customer and channel proof because Heven’s public record is sparse on named
    deployed accounts. The strongest named end-customer evidence is Army procurement access; the remaining rows are channel
    or demand-quality signals.
