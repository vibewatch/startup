- id: concentration-timing-and-adoption-quality-caveats
  title: Concentration, Timing, and Adoption-Quality Caveats
  body: 'Concentration and timing risk therefore dominate the customer-quality assessment. The named proof set is heavily
    defense-led: Army procurement access, a defense-oriented distributor, a defense/public-safety integrator, and company-stated
    demand from special-operations and allied users. That concentration can be positive if Army and adjacent defense buyers
    convert quickly, because Z1, hydrogen generation, and low-signature endurance appear differentiated for austere missions.
    It can also cut the other way if procurement cycles stretch, if hydrogen logistics slow fielding, or if distributor and
    integrator routes fail to convert into recurring orders. The biggest adoption-quality caveat is not that there is no public
    evidence at all; rather, it is that the visible evidence mostly proves pathway, credibility, and market intent. Public
    sources still do not prove that Heven has reached a disclosed repeat-order cadence or a diversified paying customer base
    beyond early defense-facing channels.'
