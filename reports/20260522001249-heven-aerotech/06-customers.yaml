  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-base
    missingEvidence: A complete customer list or at least a fuller named sample across defense, public safety, commercial,
      and allied accounts.
    whyItMatters: The public proof set is too narrow to assess customer diversity or concentration with confidence.
    diligencePath: Request a customer reference list, top-customer revenue share, and segmentation by payer, user, and geography.
    relatedQuestionRefs:
    - QU001
    - QU022
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: army-boa
    missingEvidence: Task-order history, quantities, pricing, delivery schedules, and any funded follow-on orders under the
      Redstone BOA.
    whyItMatters: Without binding order data, the BOA cannot be translated into backlog quality, revenue timing, or repeat-order
      confidence.
    diligencePath: Request BOA order log, current quoted opportunities, and expected conversion timing by Army unit.
    relatedQuestionRefs:
    - QU005
    - QU008
    - QU024
    relatedTableRefs:
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Renewal rates, NRR, GRR, churn, contract length, and repeat-order percentages by segment.
    whyItMatters: These metrics determine whether Heven has durable adoption or only promising initial procurement access.
    diligencePath: Request cohort retention reporting, reorder rate, and contract-term distribution by defense vs civilian
      segment.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: usage-metrics
    missingEvidence: Deployed units, flight hours, sortie counts, uptime, and hydrogen-support utilization by named customer.
    whyItMatters: Usage depth is the clearest proof that public demand and procurement access are turning into operational
      adoption.
    diligencePath: Request customer-level deployment dashboards or anonymized fleet-usage cohorts covering the last 12 months.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current customer count and installed-base size, split across Army, other defense, public safety, commercial,
      and allied channels.
    whyItMatters: Customer-count opacity prevents clear assessment of concentration, adoption breadth, and sales efficiency.
    diligencePath: Request current customer count, active-account count, and top-10 customer mix with segment revenue split.
    relatedQuestionRefs:
    - QU019
    - QU022
    relatedTableRefs:
    - TU001
    - TU005
