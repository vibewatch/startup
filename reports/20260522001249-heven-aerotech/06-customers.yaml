callouts:
- calloutType: insight
  title: Heven has real procurement access, but public proof still stops short of recurring adoption
  body: The chapter’s strongest evidence layers are Army procurement access, trusted-drone qualification, and distributor
    or integrator channels. Those are meaningful milestones, but they do not yet disclose repeat orders, renewal behavior,
    or a diversified installed base.
  claimRefs:
  - CU002
  - CU005
  - CU007
  - CU011
  - CU025
  - CU037
- calloutType: risk
  title: A BOA is not backlog
  body: The most important adverse read-through is that the Redstone BOA reduces contracting friction without guaranteeing
    order volume. Until task orders, contract values, or funded follow-ons are disclosed, investors should treat Army demand
    as credible but not yet revenue-certain.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU030
  - CU031
- calloutType: recommendation
  title: Customer diligence should focus on conversion and durability, not only logos or channels
  body: Ask management for BOA task-order history, customer count by segment, repeat-order rate, installed fleet metrics,
    and named public-safety/commercial references. Those data points would determine whether today’s pathway proof is becoming
    durable revenue.
