- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Army units can order under a pre-negotiated BOA
    - Named proof remains concentrated in one U.S. defense procurement channel
    - Revenue timing and customer diversity are exposed if task orders arrive slowly
    - Review Redstone BOA task-order history and pipeline by unit
  - - SupplyCore catalog and SOF Week exposure can widen defense reach
    - Distributor evidence may not convert into direct agency orders
    - Channel looks stronger than booked demand if no orders follow event exposure
    - Request reseller sales pipeline, quote activity, and margin structure
  - - NextTech can route Heven into public-safety and federal contracts
    - Public-safety adoption may be overestimated if integrator path never converts
    - Civilian diversification remains mostly narrative without named agencies
    - Request named opportunity list and stage-by-stage conversion data
  - - SOCOM / combatant / allied demand could expand defense TAM
    - Demand statements may be aspirational without contract evidence
    - Special-operations focus could inflate perceived traction before orders land
    - Request signed LOIs, contract awards, or funded evaluations tied to those buyers
  - - Hydrogen generation systems broaden wallet share beyond aircraft
    - Hydrogen logistics could slow reorder cadence and deployment density
    - Support complexity can prevent pilots or initial buys from scaling
    - Review field logistics cost, refuel throughput, and support-contract attach rate
  - - Programs-of-record positioning could create multi-year adoption
    - Program-of-record status is not yet publicly proven
    - Investors could misread roadmap intent as current procurement maturity
    - Request exact status of any program-of-record pursuit and required milestones
  - - Defense-first focus may improve near-term credibility
    - Commercial and humanitarian diversification lacks named paying proof
    - Customer concentration could remain structurally high even if top-line demand grows
    - Request segment revenue mix and top-customer share over the last 12 months
  notes: 'Risks here focus on conversion and concentration, not product performance. The theme is consistent across sources:
    Heven has multiple paths to expand, but public evidence does not yet prove that any path has matured into a diversified
    recurring customer base.'
