summary: 'Heven AeroTech''s public customer proof is strongest on access, not recurring adoption: a U.S. Army BOA effective
  January 2026, Blue UAS qualification, SupplyCore distribution, and NextTech integration all show real procurement pathways.
  Those signals indicate buyer interest across defense, public safety, and company-stated allied/special-operations demand,
  but public sources do not disclose funded task orders, contract value, customer count, renewal rates, or usage metrics.
  The biggest underwriting caveat is that Heven has demonstrated channel entry and procurement credibility more clearly than
  repeat orders.'
sections:
- id: buyer-user-and-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'Heven AeroTech''s customer story is currently strongest where a government buyer or channel has been publicly named.
    The clearest named demand surface is the U.S. Army procurement route: a Basic Ordering Agreement effective January 2026,
    enabled by Z1''s Blue UAS qualification, gives Army units a documented path to buy the aircraft and associated hydrogen
    generation systems. That matters because it moves Heven beyond pure brochureware and into a real acquisition workflow.
    But the public proof still sits at the buyer-access layer rather than at the recurring-usage layer. Outside the Army,
    the named public surfaces are mostly channels: SupplyCore as reseller and booth host at SOF Week, plus NextTech as a federal
    systems-integrator route from local first responders to broader government programs. Heven also markets defense, public
    safety, commercial, and humanitarian use cases across its own site. The underwriting distinction is crucial: named buyer
    segments and procurement paths are visible, while named paying civilian accounts, deployment counts, and renewal behavior
    are not.'
