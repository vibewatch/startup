- id: TU002
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Rows cover the publicly named customer or channel proofs visible in retained 2025-2026 sources. Heven does not
      disclose a full customer list, so this table captures the named proof set rather than an exhaustive installed base.
