- id: TU004
  title: Procurement proof-quality table
  columns:
  - Proof surface
  - What it proves
  - What it does not prove
  - Timing / trigger
  - Why it matters
  rows:
  - - Blue UAS qualification
    - Platform cleared through trusted-drone review pathway
    - Any funded Army or civilian purchase order
    - Qualification precedes buying actions
    - Necessary but insufficient gate for federal adoption
  - - Army BOA
    - Army units have a streamlined contracting vehicle for Z1 and hydrogen systems
    - Guaranteed volume, backlog, or program-of-record funding
    - Orders still need pricing and issuance
    - Best current proof of real procurement relevance
  - - Acquisition.gov FAR 16.703
    - BOA is not a contract and cannot imply future orders
    - That Redstone access already equals revenue
    - Applies before binding order is placed
    - Defines the main customer-quality caveat
  - - SupplyCore catalog listing
    - Distributor is willing to merchandise Z1 into government channels
    - That agencies have purchased or deployed Z1 at scale
    - Channel opened in May 2026
    - Important for access, weak for utilization
  - - SOF Week booth presence
    - Operators and decision-makers can inspect the product in a special-operations context
    - That trials or orders converted after the event
    - Event-driven demand generation
    - Supports discovery and education, not durable adoption
  - - NextTech contract-vehicle route
    - Integrator can position Heven into public-safety and federal procurements
    - That any named agency signed, renewed, or deployed
    - Pathway depends on future opportunity capture
    - Expands TAM but still needs conversion
  - - Demand from SOCOM / allied forces
    - Heven sees credible defense-market pull and is scaling capacity around it
    - That stated demand has become repeat funded orders
    - Demand signal is forward-looking
    - Helps explain expansion path, but not durability
  notes: This table is deliberately evaluative. It distinguishes pathway proof, marketing proof, and adoption proof so that
    BOA, Blue UAS, and distributor evidence are not over-read as repeat revenue.
