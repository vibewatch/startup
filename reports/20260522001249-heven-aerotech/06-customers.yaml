figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The observable customer journey runs from defense or public-safety problem awareness into trust qualification,
    procurement-path activation, limited public deployment proof, and then an unresolved repeat-order stage. Public evidence
    is strongest in the middle of the journey, where Heven has qualification and channel access, and weakest at the final
    stage, where funded reorder and retention data remain undisclosed.
  approximationNotes: Stages are derived from retained official and regulatory surfaces. The map intentionally avoids numerical
    conversion assumptions because Heven has not disclosed customer funnel metrics.
  data:
    nodes:
    - id: n1
      label: Mission Need
      detail: Army, defense, public-safety, and commercial operators seek long-endurance low-signature UAS for ISR, response,
        and logistics use cases.
    - id: n2
      label: Trust Qualification
      detail: Blue UAS review makes Z1 eligible for trusted federal consideration but does not create demand by itself.
    - id: n3
      label: Procurement Path
      detail: Army BOA, SupplyCore catalog, and NextTech contract-vehicle access reduce acquisition friction for eligible
        buyers.
    - id: n4
      label: Deployment / Fielding
      detail: Public sources show pathway and marketing activity, but named deployed fleet metrics remain largely undisclosed.
    - id: n5
      label: Repeat Order / Expansion
      detail: Follow-on orders, renewals, usage intensity, and segment diversification are the missing proof layer as of 2026-05-22.
  claimRefs:
  - CU003
  - CU005
  - CU011
  - CU012
  - CU025
  - CU026
  - CU027
  - CU028
  - CU038
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: 'Heven’s observable adoption path progresses from qualification and channel access into order issuance and field
    deployment. The largest drop-off in public proof occurs after procurement access is established: Army, SupplyCore, and
    NextTech create routes to buy, but public evidence does not yet show disclosed repeat orders or a broad fleet-in-use base.'
  approximationNotes: This is a process map rather than a numeric conversion funnel because the company does not publish prospect,
    order, or deployment counts.
  data:
    nodes:
    - id: f1
      label: Qualified Platform
      detail: Blue UAS qualification and trusted-drone positioning establish eligibility for sensitive buyers.
    - id: f2
      label: Named Route to Buy
      detail: Army BOA, SupplyCore catalog, and NextTech vehicles provide documented ways to acquire or integrate the system.
    - id: f3
      label: Order Issuance
      detail: Binding orders still require pricing, order placement, and internal budget action under the BOA or channel vehicle.
    - id: f4
      label: Field Deployment
      detail: Deployment, sustainment, and operator usage must be shown through named units, customers, or metrics.
    - id: f5
      label: Repeat Purchase
      detail: Recurring task orders, renewals, and cross-sell into hydrogen infrastructure are the key unproven adoption step.
