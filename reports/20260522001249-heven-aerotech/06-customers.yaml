- id: procurement-and-channel-proof
  title: Procurement and Channel Proof
  body: 'The best way to read Heven''s 2026 customer evidence is as a ladder of proof quality. Blue UAS Select status and
    the Army BOA materially reduce procurement friction, but neither one is the same thing as a funded program of record,
    a task-order backlog, or repeat revenue. Acquisition.gov''s FAR language is explicit that a Basic Ordering Agreement is
    not a contract and cannot imply future orders. That makes the Army BOA meaningful but bounded: it proves that Army procurement
    offices are willing to create a streamlined route for Z1 and related hydrogen infrastructure, not that Army units have
    already placed multi-unit follow-on orders. SupplyCore adds another real but bounded signal. Its catalog listing and SOF
    Week positioning show that Z1 is being merchandised into a defense-special-operations procurement channel with government
    payment terms and faster award mechanics. Yet catalog presence still stops short of named utilization. NextTech similarly
    widens access into public-safety and federal missions, but it remains a route to market rather than a named deployed-agency
    proof point.'
