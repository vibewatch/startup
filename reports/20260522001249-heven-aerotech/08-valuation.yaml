- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - Evidence-backed case
  - What would change the view
  rows:
  - - Hydrogen endurance solves a real mission problem
    - Thesis
    - Heven has public financing momentum, a defense pathway, and a differentiated endurance story.
    - Show disclosed funded orders and customer economics rather than mission-performance narrative alone.
  - - Defense access can become a durable GTM wedge
    - Thesis
    - Blue-UAS-style procurement access and the Army BOA lower friction for defense buying.
    - Publish order conversion cadence, task-order values, and repeat-order evidence.
  - - Hydrogen infrastructure can expand contract value
    - Thesis
    - Field logistics and generation systems could enlarge contract scope beyond the aircraft body.
    - Show that the infrastructure layer improves utilization or margins instead of simply adding capex and support cost.
  - - BOA and funding headlines may outrun actual revenue proof
    - Anti-thesis
    - Procurement law says the BOA is not a contract, while Heven does not disclose backlog or revenue.
    - Close the disclosure gap with a revenue, backlog, and margin bridge.
  - - Private opacity creates valuation overhang
    - Anti-thesis
    - Public sources do not disclose burn, runway, liquidation preferences, or customer concentration.
    - Provide data-room evidence on cash, burn, round terms, and concentration before asking investors to rely on milestone pricing.
  notes: Rows separate the strategic company-quality case from the price-sensitivity case; the anti-thesis is about what is missing from public underwriting, not about denying the product story.
