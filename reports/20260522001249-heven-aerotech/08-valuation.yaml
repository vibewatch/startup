  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: order-conversion
    missingEvidence: Funded task-order history, backlog roll-forward, and repeat-order cadence from Army or adjacent defense customers.
    whyItMatters: Without disclosed order conversion, the BOA remains pathway evidence rather than revenue proof.
    diligencePath: Request signed-order and backlog schedules by quarter, with customer and platform breakout.
    relatedQuestionRefs:
    - QV005
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: round-terms
    missingEvidence: The Series B term sheet, cap table, liquidation preference stack, anti-dilution mechanics, and modeled proceeds waterfall.
    whyItMatters: Private-round terms can materially change effective entry price even when the headline valuation looks unchanged.
    diligencePath: Request the executed financing documents and a post-round ownership waterfall.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: A timeline for audited disclosure, KPI publication, and management willingness to report revenue, backlog, and burn externally.
    whyItMatters: Without a path to public-market style disclosure, exit timing and valuation support remain speculative.
    diligencePath: Ask management and counsel for planned disclosure cadence tied to future capital markets activity.
    relatedQuestionRefs:
    - QV023
  - type: private-evidence-only
    severity: material
    topic: refinancing-risk
    missingEvidence: A monthly cash burn bridge, downside runway analysis, and explicit next-round trigger thresholds.
    whyItMatters: The downside case hinges on whether the Series B actually bought enough time to reach funded-order proof.
    diligencePath: Request treasury reporting, monthly cash forecast, and downside scenario model.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: Additional public comparables in adjacent hydrogen, defense-autonomy, or private-market transactions that would tighten the valuation bracket around Heven.
    whyItMatters: The comparable table is intentionally partial because no public set maps cleanly to a private hydrogen UAS company, so the bracket remains illustrative rather than exhaustive.
    diligencePath: Extend the comp set with private transaction comps or additional listed peers once more disclosed revenue or margin data exists for Heven.
    relatedTableRefs:
    - TV004
