- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Rows cover the most relevant public drone, defense, autonomy, and eVTOL comparables that bracket Heven’s current private valuation using fetched 2026 market-cap pages plus official filings or company releases.
  columns:
  - Comparable
  - 2026 public valuation / status
  - Revenue or liquidity anchor
  - Relevance to Heven
  - Key limitation
  rows:
  - - AeroVironment
    - ~$8.25B market cap; scaled public defense-autonomy platform
    - Q3 revenue $408.0M; 9M revenue $1.3B; FY26 guide $1.85-1.95B; funded backlog $1.1B
    - Shows what disclosed scale and backlog look like when a defense drone company earns a premium valuation.
    - Much larger and more diversified than Heven, so not a clean product-for-product comp.
  - - Red Cat Holdings
    - ~$1.37B market cap; public defense-drone pure-play
    - March 2026 quarter revenue $1.111M; cash $7.264M
    - Shows that small current revenue can coexist with a Heven-like valuation when defense expectations dominate.
    - Highly speculative and volatile; not proof that Heven deserves the same outcome.
  - - Joby Aviation
    - ~$10.22B market cap; milestone-driven eVTOL comp
    - Q1 2026 cash and short-term investments about $2.5B; operations launch targeted in 2026
    - Useful as an upper-bound example of multi-billion milestone valuation before scale revenue exists.
    - Passenger eVTOL economics, liquidity, and certification disclosure are far more mature than Heven’s public record.
  - - Archer Aviation
    - ~$4.66B market cap; pre-scale eVTOL / dual-use story
    - Q1 2026 revenue $1.6M; liquidity about $1.8B
    - Shows public willingness to fund a certification-and-platform story while revenue is still minimal.
    - Business model and capital base differ materially from a hydrogen UAS company.
  - - EHang Holdings
    - ~$0.71B market cap; disclosed commercial eVTOL revenue base
    - 2025 revenue $59.8M; 2025 net loss $39.5M
    - Useful lower-middle bracket because investors can see real commercial revenue and still value the company below Heven.
    - China exposure, regulatory path, and aircraft category differ from Heven.
  - - Draganfly
    - ~$0.22B market cap; small public drone OEM
    - Q1 2026 revenue $2.31M; cash $147.3M
    - Useful lower-bound drone comp with visible but modest operating scale.
    - Far smaller, less defense-specific, and not hydrogen-centric.
  notes: Public market caps are current as of the run date; revenue and liquidity anchors come from fetched filings or official releases. The table is a sanity bracket, not a claim that public equity trading maps one-for-one to a private round.
