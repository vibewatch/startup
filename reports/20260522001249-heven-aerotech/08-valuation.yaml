company:
  name: Heven AeroTech
chapter:
  number: 8
  title: Valuation
  summary: Heven AeroTech’s public financing anchor is clear—a $100 million Series B at a $1 billion valuation—but the operating proof needed to underwrite that price is not. Public comps show that a $1 billion mark is not impossible in drones or eVTOL, yet revenue, gross margin, burn, backlog, and round terms remain undisclosed while the Army BOA is legally not a contract. On the public record alone, the chapter supports a research-more recommendation, medium confidence, high risk rating, and stretched valuation stance.
sections:
- id: current-price-anchor
  title: Current Price Anchor and What Public Evidence Actually Proves
  body: 'Heven’s public financing anchor is unusually clear on price and unusually thin on operating proof. The company announced a $100 million Series B at a $1 billion valuation and tied the proceeds to three visible spend buckets: domestic manufacturing expansion, hydrogen generation and logistics infrastructure, and advanced quantum, navigation, and autonomy capabilities. That is enough to establish the current mark, but not enough to justify it on conventional operating metrics. None of the retained Heven financing or procurement articles disclose revenue, gross margin, burn, runway, backlog, customer concentration, or round terms. The Army BOA adds a useful proof point on access, yet procurement law is explicit that a BOA is not a contract and does not imply future orders. In valuation terms, the public record proves that Heven has raised capital, has strategic ambition, and has some defense-market pathway. It does not prove that funded demand, margin structure, or cash conversion
    already support a $1 billion price. The first discipline in this chapter is therefore to treat the round as a milestone valuation anchor, not as evidence-backed price discovery.'
