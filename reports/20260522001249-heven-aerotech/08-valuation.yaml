- id: public-comparable-bracket
  title: Public Comparable Bracket and Why It Cuts Both Ways
  body: The public comparable set does not rescue a clean buy case, but it does show why the $1 billion mark cannot be dismissed outright. At one end, AeroVironment trades at a far higher market cap while supporting it with billion-dollar revenue and funded backlog. At the other end, smaller public names like EHang and Draganfly trade below Heven while still disclosing real revenue, losses, and cash. The middle of the bracket is where the ambiguity lives. Red Cat shows that a drone pure-play can reach a Heven-like public valuation on future defense expectations despite very modest current revenue. Joby and Archer show that milestone-driven aerospace valuations can stay multi-billion, but both companies also disclose cash, certification progress, and operating timelines in a way Heven does not. The read-through is not that Heven is obviously overvalued or obviously cheap. The read-through is that the current price can only be underwritten as a narrative and milestone valuation until the company
    discloses enough economics to map itself credibly onto a public comp lane.
