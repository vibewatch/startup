- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - BOA fails to convert
    - No meaningful funded orders or disclosed task-order values by 1H2027
    - Turns the defense pathway into access-without-monetization.
    - Reset the valuation framework away from growth acceleration and toward option value only.
  - - Opacity persists through the next financing cycle
    - No disclosed revenue, backlog, or burn bridge before another capital event
    - Keeps valuation narrative untestable and raises adverse-selection risk.
    - Treat any new round as defensive unless private diligence proves otherwise.
  - - Hydrogen support remains commercially awkward
    - No proof that field generation or logistics improve deployment economics
    - The infrastructure layer stays a cost adder rather than a moat.
    - Discount the endurance advantage and lower the valuation band.
  - - Bridge or down-round before order proof
    - Additional capital required before funded-order conversion is visible
    - Signals that the current round did not buy enough runway or demand proof.
    - Move to downside case and re-price using bear assumptions.
  - - Margins cannot be demonstrated
    - No gross-margin or unit-economics bridge even after order conversion
    - Prevents the valuation from graduating from narrative to operating proof.
    - Do not upgrade recommendation or valuation stance.
  - - Policy or procurement support reverses
    - Trusted procurement pathway narrows or order vehicle usage disappoints materially
    - Weakens the fastest public route from product differentiation to cash.
    - Reduce expected upside and delay any decision to participate.
  notes: Each trigger is intentionally monitorable and tied to a valuation transmission path so the investor can distinguish between ordinary startup noise and real thesis impairment.
  claimRefs:
  - CV008
  - CV009
  - CV041
  - CV042
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue bridge
    - Monthly and quarterly revenue by product line, customer type, and geography
    - Without it, the $1B mark cannot be translated into any defensible revenue multiple.
    - Request a 24-month revenue bridge in the management data room.
  - - Gross margin and COGS
    - Unit-level gross margin, warranty burden, and services attachment by platform
    - Determines whether hydrogen endurance creates economic value or just technical novelty.
    - Request platform contribution margin and warranty reserve schedules.
  - - Backlog and order conversion
    - Booked backlog, BOA-to-order cadence, task-order value, and top program status
    - Separates pathway narrative from funded demand proof.
    - Request program roll-forward and signed-order pipeline by quarter.
  - - Cash burn and runway
    - Current cash, monthly net burn, capex plan, and downside runway
    - Tests whether the Series B funds acceleration or merely buys time.
    - Request treasury packet, 13-week cash forecast, and next-round trigger analysis.
  - - Round terms and preference stack
    - Liquidation preference, anti-dilution, pay-to-play, and investor-protection terms
    - Public price alone can hide meaningful private-terms overhang.
    - Request term sheet, cap table, and modeled proceeds waterfall.
  - - Hydrogen logistics economics
    - Utilization, uptime, field support cost, and attachment economics for hydrogen generation assets
    - This determines whether infrastructure is a moat or a drag on free cash flow.
    - Request deployment-level economics for trailer or generation systems and pilot utilization data.
  notes: These asks are not generic diligence hygiene. They are the minimum dataset needed to move the recommendation from research-more toward any investable call at the current valuation.
