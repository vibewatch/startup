- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by quarter / month
    - Undisclosed
    - Cannot size top-line traction or compare burn to revenue base
    - Request historical revenue bridge by product, customer, and quarter
  - - ARR or recurring-revenue base
    - Undisclosed
    - Cannot separate hardware revenue from repeatable software or service economics
    - Request recurring-revenue schedule and renewal or support cohorts
  - - Gross margin and COGS
    - Undisclosed
    - Margin path and contribution economics remain speculative
    - Request COGS by platform, warranty reserve policy, and gross-margin bridge
  - - Cash on hand
    - Undisclosed
    - Runway cannot be calculated
    - Request latest treasury report and month-end cash position
  - - Monthly burn and runway
    - Undisclosed
    - Next-round timing cannot be underwritten
    - Request rolling 12-month cash forecast and downside case
  - - Backlog / task-order value
    - Undisclosed
    - Procurement access cannot be converted into revenue confidence
    - Request booked backlog, option value, and task-order roll-forward
  - - Customer concentration
    - Undisclosed
    - Exposure to delayed payment or program cancellation is unknowable
    - Request top-10 customer revenue, A/R, and backlog concentration
  - - Realized pricing and discounts
    - Undisclosed
    - Channel economics and margin quality cannot be tested
    - Request quote-to-close data and reseller discount schedules
  - - Hydrogen infrastructure BOM / capex
    - Undisclosed
    - A second capital curve may exist alongside airframe production
    - Request unit BOM, ownership model, and capex plan for trailers or nanogrids
  notes: Every row is a concrete public-data hole that directly limits underwriting. These are not nice-to-haves; they are the core reasons this chapter cannot move past research-more on financial grounds.
