  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: heven-current-financials
    missingEvidence: Current revenue, gross margin, monthly burn, cash on hand, and runway calculations as of the latest closed month or quarter.
    whyItMatters: Without these figures, investors cannot test capital adequacy, margin path, or downside runway under slow procurement conversion.
    diligencePath: Request monthly management reporting, current cash waterfall, board package excerpts, and the latest actual-vs-budget operating model.
    relatedQuestionRefs:
    - QI010
    - QI020
    - QI024
    - QI025
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ASPs, reseller discounts, warranty reserves, sustainment pricing, and service attachment rates by platform and channel.
    whyItMatters: List-price opacity prevents underwriting of unit economics, contribution margin, and channel economics even if top-line demand is real.
    diligencePath: Request the last twelve months of quotes, closed orders, discount schedules, warranty reserve methodology, and maintenance-pricing schedules.
    relatedQuestionRefs:
    - QI003
    - QI005
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: order-book-and-customer-mix
    missingEvidence: Named customers, booked backlog, pipeline conversion rates, task-order values, top-customer concentration, and defense-versus-commercial mix.
    whyItMatters: Procurement access is not equivalent to contracted demand, and concentration can distort working-capital needs and downside risk.
    diligencePath: Request signed task orders, backlog roll-forward, pipeline aging by program, and top-10 customer / prospect concentration schedules.
    relatedQuestionRefs:
    - QI009
    - QI021
    - QI023
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: capex-and-hydrogen-bom
    missingEvidence: Manufacturing capex plan, supplier payment terms, inventory turns, hydrogen trailer BOM, refueling-system ownership model, and any financing or leasing structure for field equipment.
    whyItMatters: Hydrogen support infrastructure can consume capital independently of aircraft production and may create a second capex curve that public filings do not reveal.
    diligencePath: Request 24-month capex plan, procurement schedules, supplier term sheets, and unit economics for trailers or nanogrids under direct sale, lease, and company-owned deployment models.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI020
    - QI023
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
