- id: sales-motion-traction-and-unit-proxies
  title: Sales Motion, Traction, and Unit-Economics Proxies
  body: 'Because Heven does not disclose revenue, investors have to infer commercial traction from operating and channel proxies. The strongest signals are mission-performance claims and government-access milestones: Z1 is marketed around more than 10 hours of flight time and more than 600 miles of range, the company publicized a 12,000-foot-density-altitude demo, SupplyCore now carries Z1 through an authorized reseller path, and the Army BOA gives Army units a formal acquisition route. Those signals matter because they suggest buyers may pay for persistence and procurement simplicity together. They do not, however, resolve core unit economics. No public source states average selling price, reseller discount, warranty reserve, service attachment, or CAC. The Army’s own low-cost sUAS sourcing language is the other key read-through: it confirms real demand but also warns that price and procurement timing will remain critical. In other words, Heven’s public traction is strategically credible,
    but financially thin. The visible GTM motion is defense procurement with channel assistance, not a transparent commercial funnel with disclosed conversion, payback, or margin data.'
