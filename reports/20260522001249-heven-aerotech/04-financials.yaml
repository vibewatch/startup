- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'This chapter should not simply restate the historical funding chronology from Company Overview; the relevant underwriting question is whether the most recent capital base appears adequate for the next phase. The visible answer is only partial. The latest public financing is a $100 million Series B at a $1 billion valuation, and management has already allocated that capital across three simultaneous buckets: domestic manufacturing, hydrogen logistics infrastructure, and advanced systems or quantum integration. The company also hired a CFO to lead fundraising, compliance, and investor relations as it scales, which is consistent with a more finance-intensive operating phase. What is missing is decisive: there is no public cash balance, no burn rate, no runway, no backlog, no debt schedule, and no order-value disclosure. Public aerospace filings help frame the risk. Joby explicitly says it expects to keep relying on equity and debt until operating cash flow covers expenses, working
    capital, and capex; Red Cat shows how quickly inventory and cash usage can rise before margins mature. Heven may be adequately funded for the near term, but public evidence is not strong enough to prove it. Financing dependency therefore remains an underwriting risk, not a solved problem.'
