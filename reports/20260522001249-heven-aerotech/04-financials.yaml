callouts:
- calloutType: insight
  title: Heven’s public monetization story is hardware plus infrastructure, not SaaS
  body: 'The retained evidence supports a broader contract bundle than just aircraft: airframes, hydrogen generation systems, channel-assisted procurement, and advanced-systems upgrades. That can expand contract value, but it does not create ARR-quality revenue on its own.'
  claimRefs:
  - CI031
  - CI032
  - CI035
- calloutType: risk
  title: Hydrogen endurance can add value while simultaneously increasing cash needs
  body: The same hydrogen infrastructure that strengthens mission persistence also creates another hardware and service layer to fund. That means Heven’s differentiation may demand more capex and working capital than a battery-only drone sale.
  claimRefs:
  - CI008
  - CI010
  - CI018
  - CI036
  - CI040
- calloutType: risk
  title: The top underwriting blocker is disclosure opacity, not lack of strategic narrative
  body: Public sources clearly describe what Heven wants to build and why defense buyers may care. They still do not disclose revenue, gross margin, burn, runway, backlog, or customer concentration, which prevents a reliable financial conviction call.
  claimRefs:
  - CI014
  - CI041
  - CI043
