tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Airframe platform sales
    - Z1, Raider, H2D55 / H2D250 sold via direct procurement or channel partners
    - Per aircraft / task order
    - Publicly evidenced; pricing undisclosed
    - Likely lumpy hardware revenue tied to procurement timing
    - Closed orders, shipped units, ASP by platform, and revenue-recognition policy
  - - Hydrogen generation / refueling equipment
    - HyTEC trailer, hydrogen generation systems, and refueling support sold or bundled with aircraft deployments
    - Per trailer / support system
    - Publicly evidenced as active product path; pricing undisclosed
    - Could expand contract value but adds delivery and support complexity
    - Attachment rate, ownership model, BOM, and gross-profit profile
  - - Integration, training, and sustainment
    - Mission setup, fielding, user enablement, and follow-on support around deployed systems
    - Per deployment / support contract
    - Strongly implied by procurement path; no public pricing
    - Potentially higher quality than one-time airframe sale but currently unquantified
    - Services catalog, labor model, and renewal or support terms
  - - Channel-led government sales
    - SupplyCore catalog access and reseller support for Z1
    - Per reseller order
    - Publicly evidenced; no public pricing or discount schedule
    - Can reduce selling friction but may compress realized margin
    - Reseller economics, discount rates, and channel conflict policy
  - - Advanced systems / autonomy / quantum modules
    - Quantum-secure communications, GPS-denied navigation, AI autonomy, and related upgrades
    - Per module / program add-on
    - Strategic priority disclosed; standalone monetization not disclosed
    - Could improve mix if sold as premium upgrade, but public evidence is still conceptual
    - Standalone pricing, attachment rate, and customer adoption evidence
  - - Program vehicle revenue conversion
    - Army BOA enables task-order flow for Z1 and associated hydrogen systems
    - Per task order
    - Acquisition path disclosed; order value undisclosed
    - Higher-quality only if task orders recur and convert on schedule
    - Task-order history, option structure, and average award-to-cash timeline
  notes: Rows enumerate the public revenue mechanisms visible in retained sources; where pricing or realized economics are not disclosed, the cell is left explicit rather than backfilled from assumption.
