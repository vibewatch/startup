- id: financial-verdict-and-blockers
  title: Financial Verdict and Underwriting Blockers
  body: 'Financially, Heven looks more interesting than it looks underwritten. The positive case is straightforward: the company has fresh capital, a mission-relevant endurance story, multiple public signals that hydrogen support equipment could enlarge contract value, and real defense-channel momentum. The negative case is what matters for diligence today. Revenue quality is impossible to score because the visible motion appears contract-driven and hardware-heavy, but no public source discloses revenue mix, realized ASPs, gross margin, warranty burden, or service attachment. Margin path can only be benchmarked loosely against public peers, and those peers show that cash burn, inventory build, and capex stay material deep into scale-up. Procurement dependence is another direct risk because the strongest public demand signals are Army and defense pathways, while the Army simultaneously emphasizes low-cost sUAS at large volumes. The top underwriting blocker is disclosure opacity itself: management
    has told the market how it wants to spend money, but not how much money the business already generates or consumes. Until that changes, this chapter supports a research-more posture rather than a clean financial conviction call.'
