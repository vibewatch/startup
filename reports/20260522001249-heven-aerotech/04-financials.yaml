- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Public airframe ASP
    - null
    - Low
    - Core revenue per shipment cannot be modeled without actual selling price
    - Provide shipped units and realized ASP by platform and customer type
  - - Realized discount / reseller take rate
    - null
    - Low
    - Channel margin can materially reduce gross profit even when list price looks attractive
    - Provide SupplyCore discount schedule and direct-vs-channel mix
  - - Recurring software or service attach rate
    - null
    - Low
    - Determines whether revenue quality improves beyond one-time hardware sales
    - Provide sustainment, software, and support attachment by cohort
  - - Performance value proxy
    - '>10h Z1 plus public 24/7 / six-month nanogrid operating concept'
    - Medium
    - Mission persistence is the clearest public proxy for willingness to pay a premium
    - Provide win-loss analysis by mission where endurance changed outcome
  - - Gross margin proxy (public comps)
    - 12.7% to 24.0%
    - Low
    - Public peers suggest a wide but still hardware-like margin band during ramp and scale
    - Provide current COGS, warranty reserve, and target gross-margin bridge
  - - Inventory intensity proxy
    - ~4.0x quarterly revenue in Red Cat Q1 2026
    - Medium
    - Shows how much cash can sit in inventory before shipment scale catches up
    - Provide inventory turns, supplier prepayments, and safety-stock policy
  - - Quarterly operating cash-use proxy
    - $31.9M to $144.4M
    - Low
    - Frames how fast capital can burn in hardware and aerospace ramps
    - Provide current monthly burn and 12-month operating cash forecast
  - - Quarterly capex proxy
    - $6.8M to $77.9M
    - Low
    - Manufacturing ramps often demand separate capex from operating burn
    - Provide 2026-2027 tooling, facilities, and hydrogen-infrastructure capex plan
  - - Customer concentration proxy
    - 'Red Cat A/R concentration: 88% / 26%'
    - Medium
    - Government-oriented hardware businesses can become concentrated quickly
    - Provide top-customer revenue, A/R, and backlog concentration
  - - Sales-cycle proxy
    - Procurement-driven; BOA and reseller channel reduce friction but do not remove testing and budget timing
    - Medium
    - CAC and payback depend heavily on government conversion speed
    - Provide average cycle time from evaluation to paid order
  notes: Rows mix public facts, explicit nulls, and benchmark proxies. Null means undisclosed by Heven; benchmark rows are clearly labeled and should not be mistaken for company-reported metrics.
