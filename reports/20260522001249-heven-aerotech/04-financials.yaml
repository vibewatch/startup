- id: TI004
  title: Capital adequacy table
  columns:
  - Input
  - Public evidence
  - Value / status
  - Implication
  - Diligence ask
  rows:
  - - Latest fresh capital
    - Series B announced December 2025
    - $100M at $1B valuation
    - Meaningful capital base, but adequacy depends on current burn and order conversion
    - Provide post-close cash bridge and use-of-funds actuals
  - - Cash on hand
    - Not disclosed in retained public sources
    - null
    - Runway cannot be tested
    - Provide latest month-end unrestricted cash and restricted cash
  - - Monthly burn
    - Not disclosed in retained public sources
    - null
    - Capital adequacy is untestable without current burn
    - Provide monthly operating cash burn and budget-to-actual
  - - Runway months
    - Not disclosed in retained public sources
    - null
    - Investors cannot judge downside timing or next-round urgency
    - Provide base / downside runway model tied to current cash and burn
  - - Planned use of funds
    - Management explicitly named three buckets
    - Manufacturing, hydrogen logistics, advanced systems / quantum
    - Capital is spread across multiple simultaneous programs
    - Provide spend by bucket and timing by quarter
  - - Debt / project-finance obligations
    - No debt facility or project-finance structure disclosed publicly
    - Undisclosed rather than clearly absent
    - Potential hidden leverage or equipment financing cannot be ruled out
    - Provide debt schedule, leasing obligations, and any asset-backed financing
  - - Working-capital draw
    - Public comp evidence points to inventory build and supplier prepayments during ramp
    - Likely material; exact Heven requirement undisclosed
    - Could absorb a meaningful share of the Series B before revenue matures
    - Provide inventory plan, supplier terms, and purchase commitments
  - - Next-round trigger
    - Inferred from public posture
    - Likely procurement conversion lag versus planned spend
    - If task orders do not materialize before expansion spend ramps, another raise may be required
    - Provide minimum booked-order threshold needed to avoid next financing
  notes: This table focuses on forward capital adequacy, not the historical round chronology already covered in Company Overview. Null means the public record does not disclose the metric.
