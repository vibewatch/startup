callouts:
- calloutType: strength
  title: Blue UAS plus Army BOA is a real access wedge
  body: 'Heven has moved beyond pure prototype storytelling: Blue UAS Select validated the Z1 for trusted federal use, and the Army BOA created a named acquisition pathway for the aircraft and its hydrogen support systems. That combination does not prove revenue, but it does show procurement relevance.'
  claimRefs:
  - CO024
  - CO025
  - CO027
- calloutType: strength
  title: The Series B funded both scale and strategic adjacency
  body: The IonQ-led $100 million round did more than raise cash. It underwrote manufacturing expansion, hydrogen logistics buildout, and a quantum-enabled roadmap that can differentiate Heven’s defense positioning if the technology translates into fielded capability.
  claimRefs:
  - CO018
  - CO019
  - CO020
- calloutType: risk
  title: Procurement access is not the same as contracted revenue
  body: The Army BOA and reseller/channel milestones are strategically useful, but none of the fetched sources disclose task-order value, backlog, customer count, or recurring revenue. Investors should treat these as pipeline signals, not proof of commercial conversion.
  claimRefs:
  - CO026
  - CO031
  - CO033
  - CO035
  - CO044
- calloutType: risk
  title: Founder concentration and opaque disclosures remain material
  body: Levinson still carries much of the public narrative load across product, capital, and mission. At the same time, revenue, customer metrics, ownership detail, and even some public links remain incomplete or brittle, limiting how far outside investors can validate performance from the open record alone.
