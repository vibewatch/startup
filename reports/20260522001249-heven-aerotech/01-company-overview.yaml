  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: The exact cap table, cumulative financing history before the Series B, board-rights package, and post-Series B ownership percentages.
    whyItMatters: Without the full financing history and control stack, it is impossible to test dilution, liquidation preferences, investor governance leverage, or whether the $1B valuation came with unusually investor-friendly terms.
    diligencePath: Request the capitalization table, board consents, investor rights agreement, and all primary/secondary financing documents directly from management.
    relatedQuestionRefs:
    - QO011
    - QO026
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-roster
    missingEvidence: Full 2026 board roster, committee structure, investor-designated seats, and management reporting lines beyond the named public leaders.
    whyItMatters: The leadership table is directionally useful, but without the full governance roster investors cannot judge independence, concentrated control, or whether the company has enough operating depth behind the public-facing team.
    diligencePath: Request the current board list, committee chart, board-observer rights, and an org chart that connects the public leadership roster to actual reporting lines.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current 2026 employee count, current production throughput, and staffing plan by function and geography.
    whyItMatters: The only fetched headcount signal is from a 2025 profile; without an updated operating-scale view, investors cannot judge whether the company has staffed to deliver on manufacturing and procurement promises.
    diligencePath: Request an organization chart, current headcount by department and site, monthly production throughput, and hiring plan tied to the Sterling expansion.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, customer count, backlog, and burn/runway detail.
    whyItMatters: These are the core variables needed to evaluate whether procurement access and valuation are supported by actual commercial traction rather than narrative momentum alone.
    diligencePath: Request monthly revenue by customer class, booked backlog, gross-margin bridge, burn/runway schedule, and customer concentration disclosures.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: access-blocked
    severity: minor
    topic: disclosure-hygiene
    missingEvidence: Durable canonical links or archived copies for all major rebrand and headquarters announcements.
    whyItMatters: Broken or shifted public URLs do not change the company’s underlying milestones, but they make external diligence slower and less reliable than it should be for a company at this stage.
    diligencePath: Ask the company for an investor-facing press archive or preserve key disclosures in a formal data room before diligence proceeds.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
