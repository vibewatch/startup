- id: milestones-and-diligence-caveats
  title: Milestones and Diligence Caveats
  body: 'Heven’s 2025-2026 milestone sequence is unusually coherent for a private defense-tech company: product validation through the 12,000-foot Z1 demo, a rebrand tied to Zepher integration, a Sterling headquarters opening, Blue UAS Select qualification, a $100 million Series B at a $1 billion valuation, an Army BOA effective January 2026, and channel expansion through SupplyCore. On the surface, that looks like a clean transition from technical promise to procurement relevance. The caveat is that the public record still leaves major diligence blanks. Headcount is not current, revenue and ARR are undisclosed, customer count and backlog are undisclosed, and total capital raised is only partially supportable from public evidence. Even basic auditability is imperfect: by the May 2026 fetch date, the company’s /news path returned a not-found page and one previously cited PR Newswire headquarters link was dead despite an alternative canonical URL existing. None of that negates the strategic
    momentum, but it does mean investors should treat Heven’s public story as directionally strong and quantitatively incomplete until management provides board, contract, and operating data directly.'
