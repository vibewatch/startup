company:
  name: Heven AeroTech
chapter:
  number: 1
  title: Company Overview
  summary: Heven AeroTech is a 2019-founded hydrogen-UAS company that repositioned itself around U.S. defense and public-safety missions after acquiring Zepher Flight Labs, rebranding from Heven Drones, and opening a Sterling, Virginia headquarters. The company reached a $1 billion valuation through a $100 million IonQ-led Series B in December 2025 and then turned Blue UAS Select status into a U.S. Army Basic Ordering Agreement effective January 2026. Public evidence supports strong strategic momentum, but revenue, customer count, current headcount, full board composition, and exact cumulative capitalization remain undisclosed, and some post-rebrand public links are already broken.
sections:
- id: identity-footprint-and-offering
  title: Identity, Footprint, and Offering
  body: 'Heven AeroTech is best understood in 2026 as a private, growth-stage hydrogen-UAS company that has deliberately recast itself from an Israeli-founded drone startup into a U.S.-based aerospace supplier with defense credibility. The company says it was founded in 2019 by Bentzion Levinson, and its current public identity centers on hydrogen-powered, runway-independent unmanned aircraft plus the field hydrogen infrastructure needed to keep those systems operating in austere environments. The headquarters question is important because the rebrand narrative is tied directly to U.S. industrial-base positioning: Heven now calls Sterling, Virginia its headquarters, while its web properties show the same East Coast site under a Dulles mailing address, alongside a Washington-state facility and visible Israeli roots. Public materials present a broad portfolio — Z1, Raider, H2D55, refuelers, Atlas, and Urban X — but the commercial story is still dominated by national-security use cases, public
    safety, and government buyers rather than a diversified civilian installed base. That mix makes the company easier to place inside defense-tech comps than inside broad commercial-drone peers.'
