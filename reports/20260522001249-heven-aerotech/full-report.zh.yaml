  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（USD M）
      - 概率信号
      - 必须成立的条件 / 何时破裂
    rows:
      - - 乐观
        - 有资金落实的国防订单公开，氢能物流证明具备运营价值，Heven 披露足以支撑后期成长型硬件倍数的收入 / 在手订单。
        - 1,200-1,800
        - 需要多个尚未出现的公开证明点。
        - 必须看到有资金支持的在手订单、真实收入规模和改善中的单位经济性；若披露仍薄，或需求滑落，情景破裂。
      - - 基准
        - 国防兴趣真实但转化缓慢，披露仍不完整，本轮融资主要支持执行，而不是证明经济性。
        - 600-1,000
        - 最符合当前公开证据组合。
        - 必须避开短期过桥融资，并至少拿出初始订单转化；若 BOA 仍只是路径，情景破裂。
      - - 悲观
        - 氢能基础设施仍然昂贵，采购转化滞后，在在手订单或利润率证明出现前又启动一轮融资。
        - 200-500
        - 若未来 12-18 个月里程碑滑坡，下行情景仍然现实。
        - 若可见订单证明前又融资、持续不透明，或物流经济性偏弱，破裂信号即被触发。
    notes: 这些是基于公开证据的情景区间，不是模型定价输出。Heven 不披露收入、利润率、在手订单和轮次条款，因此区间刻意放宽，应作为合理性校验带，而不是精确估计。
    claimRefs:
