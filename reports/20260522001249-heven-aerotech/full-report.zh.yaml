      - number: '7.4'
        title: 缓释因素、排序与否决标准
        blocks:
          - type: paragraph
            body: >-
              以今天的 Heven 看，风险排序依次是：第一，DoD 集中度和订单转化风险；第二，氢后勤和野外可靠性风险；第三，出口、可信供应和 FCC 政策风险；第四，与 FAA
              时间表和硬件负担绑定的民用商业采用风险；第五，制造质量和披露不透明；第六，自主治理和保证风险；第七，资本强度和融资风险；第八，更广泛的伙伴集中风险。订单转化风险排第一，原因很简单：如果公司能迅速把准入转成有资金支持的项目，形成现金流可见性和运营学习，大多数其他风险仍可承受。没有这个转化，其他所有未解问题都会叠加，而不是被摊薄。


              已经存在真实缓释因素。Blue UAS Select 和 ATO 降低了联邦市场内可信飞行器摩擦。陆军 BOA 缩短未来订单的行政前置时间。HyTEC 和 Sesame
              式野外加注概念，方向上对准了最大的氢瓶颈。政策环境在一个重要维度上也有利：白宫、BIS、FCC、DIU 和 FAA 都在主动重塑规则，推动可信国产无人机。但这些缓释因素也形成清晰的否决标准框架。如果 Blue
              UAS 和陆军 BOA 背后没有落地有经费订单，如果氢加注和可靠性停留在原型与营销阶段，如果可信供应规则迫使重新设计或限制出口弹性，或如果规则进展后民用 BVLOS
              经济性仍不吸引人，那么投资逻辑就会失去“政策背书加速”的核心叙事。因此，最重要的否决风险是：在氢后勤和合规负担被验证之前，Heven 未能把可信防务准入转成有经费订单。
