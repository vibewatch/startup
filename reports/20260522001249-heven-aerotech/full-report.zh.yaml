  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付平台与用户工作流
        blocks:
          - type: paragraph
            body: >-
              保留的 2026 年产品表面显示，Heven 不是只有一架英雄无人机，而是已经交付了真实但不均衡的产品线。活跃的氢能产品组合页面仍围绕三类机体：用于紧凑战术 ISR 和其他长时间持续任务的 Z1 /
              H2D250、用于更重的争夺环境物流或吊运 / 投送任务的 Raider，以及用于长航时多旋翼悬停任务的 H2D55。同一官方表面仍 保留 H100 和 Urban
              产品页面，说明产品目录历史更宽；但当前采购和演示证据集中在 Z1、Raider、H2D55 和氢能支持栈，而不是这些相邻产品族。按用户工作流看， Heven
              卖的不只是「一架无人机」；它营销的是一套任务包，围绕快速架设、无需跑道的 VTOL 起飞、比燃烧替代方案更低声学和热特征的长续航、模块化载荷更换，以及
              ——当行动超过单个架次时——一个外场氢能支持概念，以减少对反复换电池或燃料车队补给的依赖。Z1 是这一工作流最清晰的体现，因为公开材料把它与 Blue UAS 批准、 Army 采购准入、快速架设，以及 ISR
              或公共安全任务连在一起。Raider 把同一概念延伸到更重物流角色，H2D55 则覆盖更长时间悬停或持续上方作业。缺失的，是一套 单一、权威、协调的公开数据表：Heven 自己的 Z1/H2D250 和
              H2D250 页面没有给出完全对齐的规格基线；这一点重要，因为买家和投资者仍需要知道今天哪一种配置才是 生产标准。
