  - id: TV005
    title: 投资逻辑破裂与放弃触发器表
    columns:
      - 触发器
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - BOA 未能转化
        - 到 1H2027 仍无有意义的已获资金订单或已披露任务订单金额
        - 国防路径变成有准入、无变现。
        - 将估值框架从增长加速重置为仅具期权价值。
      - - 下一轮融资周期中仍不透明
        - 另一资本事件前仍未披露收入、在手订单或烧钱桥接表
        - 估值叙事仍无法检验，并抬高逆向选择风险。
        - 除非私下尽调证明相反，否则把任何新轮次视为防御性融资。
      - - 氢能支持仍显商业笨重
        - 没有证据表明现场制氢或物流改善部署经济性
        - 基础设施层仍是成本项，而不是护城河。
        - 打折续航优势，并下调估值区间。
      - - 订单证明前先过桥或下调估值轮
        - 有资金订单转化可见前就需要额外资本
        - 说明当前轮次没有买到足够现金跑道或需求证明。
        - 转入下行情景，并用悲观假设重估价格。
      - - 利润率无法证明
        - 即便订单转化后，也没有毛利率或单位经济性桥接表
        - 估值无法从叙事升级为经营证明。
        - 不上调推荐或估值立场。
      - - 政策或采购支持逆转
        - 可信采购路径收窄，或订单载体使用明显不及预期
        - 削弱从产品差异化走向现金的最快公开路径。
        - 下调预期上行空间，并推迟任何参与决定。
    notes: 每个触发器都刻意设置为可监控，并绑定一条估值传导路径，方便投资人区分普通创业噪音和真正损伤投资逻辑的信号。
    claimRefs:
      - CV008
      - CV009
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入桥接表
        - 按产品线、客户类型和地域拆分的月度、季度收入
        - 没有它，$1B 估值无法转化为任何站得住的收入倍数。
        - 在管理层数据室索取 24 个月收入桥接表。
      - - 毛利率和 COGS
        - 平台级单位毛利率、保修负担和服务附着率
        - 判断氢能续航是在创造经济价值，还是只是技术新意。
        - 索取平台贡献利润率和保修准备金明细。
      - - 在手订单和订单转化
        - 已签在手订单、BOA 到订单的节奏、任务订单金额和头部项目状态
        - 把路径叙事与有资金支持的需求证明分开。
        - 索取按季度滚动的项目进展和已签订单管线。
      - - 现金烧钱和跑道
        - 当前现金、月度净烧钱、资本开支计划和下行现金跑道
        - 检验 Series B 是在支持加速，还是只是买时间。
        - 索取资金管理包、13 周现金预测和下一轮触发分析。
      - - 轮次条款和优先股堆叠
        - 清算优先权、反稀释、pay-to-play 和投资人保护条款
        - 仅看公开价格，可能掩盖有意义的私募条款压力。
        - 索取条款清单、股权结构表和模拟回款瀑布。
      - - 氢能物流经济性
        - 氢能制备资产的利用率、正常运行时间、现场支持成本和附着经济性
        - 它决定基础设施是护城河，还是拖累自由现金流。
        - 索取拖车或制氢系统的部署级经济性，以及试点利用率数据。
    notes: 这些要求不是泛泛的尽调卫生项，而是在当前估值下，把建议从继续研究推向任何可投资判断所需的最低数据集。
    claimRefs:
      - CV004
      - CV010
      - CV011
      - CV036
      - CV044
      - CV045
