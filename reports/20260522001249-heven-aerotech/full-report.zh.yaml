chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与产品
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，最适合把 Heven AeroTech 看成一家成长期的私营氢动力 UAS 公司：它有意把自己从一家以色列创立的 无人机初创公司，重塑成一家扎根美国、具备防务可信度的航空航天供应商。公司称由
              Bentzion Levinson 于 2019 年 创立；现在的公开身份，围绕氢动力、无需跑道的无人驾驶飞行器，以及让系统能在艰苦环境中运转的外场氢能基础设施。
              总部问题很重要，因为重塑品牌叙事直接绑定美国工业基础卡位：Heven 现在称 Sterling, Virginia 是总部，官网又以 Dulles 邮寄地址展示同一个东海岸地点，同时还有 Washington
              州设施和清晰的以色列根源。公开材料展示了宽产品组合—— Z1、Raider、H2D55、加注设备、Atlas 和 Urban X——但商业故事仍由国家安全、公共安全和政府买家主导，而不是多元化的
              民用装机基础。这样的组合，让公司更适合放进防务科技可比公司，而不是广义商业无人机同行。
