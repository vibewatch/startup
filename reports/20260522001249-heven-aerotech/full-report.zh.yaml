      - number: '3.3'
        title: 渠道、定价与替代压力
        blocks:
          - type: paragraph
            body: >-
              这里的竞争结果，同样被渠道和采购管道塑造，不只是机体参数。Heven 的 SupplyCore 协议具有战略意义，因为它把一家年轻氢能 OEM 接入既有政府采购路径，
              而不是逼公司自己搭建每一条防务关系。但同一逻辑也帮助更大的对手：Skydio 最大的 Army 订单通过 Atlantic Diving Supply 在 72 小时内推进； Red Cat 的 Black
              Widow 可以进入 NATO 的 NSPA 目录；Quantum 正在建设美国生产和经销能力；Army 的连级 sUAS 授标也用 DLA Tailored Logistics
              加速部署。公开定价则大多缺席。在保留的官方页面里，供应商把买家引向联系、经销商、目录或合同工具，而不是结账价格，因此公开
              记录无法回答谁在采办或维保上最便宜。这种不透明很重要，因为在电池或系留已经满足任务门槛的地方，Heven 的氢能逻辑最容易受压。如果一个单位实际只需要 40-50 分钟，Skydio 或 Red Cat
              不用新增燃料处理，就足够「够用」。如果基地需要固定警戒，Elistair 的系留模式可以在连续驻留上击败氢能，而且完全 不需要自由飞行燃料循环。
