      - number: '7.2'
        title: 运营、技术与供应链风险
        blocks:
          - type: paragraph
            body: >-
              氢既是 Heven 最强的差异化，也是最重大的运营风险之一。联邦安全和运输资料说明得很清楚：氢处理不只是飞机内部的工程子问题。OSHA 有专门氢标准，PHMSA 监管危险材料运输，DOE
              安全指南强调泄漏检测和正式审查，DOE 自身基础设施计划仍聚焦存储、运输和加注环节的成本与可靠性改进。这一背景很重要，因为 Heven 对野外后勤的回答——HyTEC
              制氢拖车及相关加注概念——公开表述仍停留在原型改进、演示和运营评估。Military.com 对 Sesame-Heven
              概念的报道方向上积极，但也明确说，加注版本仍在营销阶段，没有确认的军方采购。换句话说，公司在攻正确的问题，但公开证据还没有证明问题已经解决。


              技术风险不止氢。关于氢多旋翼无人机的同行评审文献仍把结构轻量化、存储、能源管理和热管理列为关键障碍。自主性方面，DoD 政策已经要求使用武力时保留人类判断；DoD 自己的 2025
              年指南也说，自主系统测试面临安全、数据、伦理、黑箱和互操作性挑战。Military Times 2026 年报道显示，随着 AI 赋能目标识别和自主系统更快扩张，五角大楼政策可能还需要继续演进。这不意味着
              Heven 不合规；意思是，任何高度依赖自主能力的防务路线图都会继承更重的保证负担。最后，供应链风险仍然重要，因为 GAO 称 DOD 对下层供应商仍缺乏良好可见性，DIU
              自己也说，可信组件和来源可选性仍在推进。对于一套依赖燃料电池、储氢、航电、通信和自主能力的氢无人机平台，错误的供应商瓶颈可能同时拖延资质和交付。
