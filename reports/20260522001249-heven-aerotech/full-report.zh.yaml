        - 当续航或再部署负担重要时，适用于搜救、野火、灾害响应和态势感知
      - - 公用事业和关键基础设施巡检
        - 飞行器、传感器、AI 分析、数据存储、植被 / 资产工作流
        - 通用消费级拍照无人机
        - 公用事业可靠性、资产管理和运营预算
        - 相邻市场有意义，因为 ROI 绑定更安全巡检、更广覆盖和更少人工检查
      - - 交通基础设施和公共工程巡检
        - 桥梁、道路、铁路、塔架和设施巡检工作流，以及支撑数据平台
        - 客运 eVTOL 和无关先进空中交通支出
        - DOT、管理机构、承包商、赠款资助项目
