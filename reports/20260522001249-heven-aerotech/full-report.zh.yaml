      - - 国防准入可成为持久 GTM 切口
        - 投资逻辑
        - 类似 Blue UAS 的采购准入和 Army BOA 降低了国防采购摩擦。
        - 披露订单转化节奏、任务订单金额和复购证据。
      - - 氢能基础设施可放大合同价值
        - 投资逻辑
        - 野外物流和制氢系统可能把合同范围从机体本身向外扩。
        - 证明基础设施层能改善利用率或利润率，而不是只增加资本开支和支持成本。
      - - BOA 和融资标题可能跑在实际收入证明前面
        - 反向逻辑
        - 采购法规表明 BOA 不是合同，Heven 也未披露在手订单或收入。
        - 用收入、在手订单和利润率桥接表补上披露缺口。
      - - 私有公司不透明压住估值
        - 反向逻辑
        - 公开来源未披露烧钱速度、现金跑道、清算优先权或客户集中度。
        - 要投资人相信里程碑定价之前，先在数据室拿出现金、烧钱速度、轮次条款和集中度证据。
    notes: 各行把战略层面的公司质量判断与价格敏感性判断拆开；反向逻辑针对公开投资论证缺什么，而不是否认产品故事。
