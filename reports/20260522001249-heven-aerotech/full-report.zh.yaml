companyProfile:
  summary: >-
    Heven AeroTech 是一家 2019 年创立的氢动力 UAS 公司，根在以色列，目前美国基地设在 Sterling, Virginia。公司从 Heven Drones 更名，并收购 Zepher Flight Labs
    之后，把叙事聚焦在长航时、无需跑道的飞行器，以及让这些系统能在 艰苦环境中持续运转的氢气制备和加注系统。最可信的公开里程碑，是 Z1 获得 Blue UAS Select 认可、2026 年 1 月进入 Army
    基本订购协议路径，以及 2025 年 12 月以 $1 billion 估值完成 $100 million Series B。机会 真实存在，但公开证据仍更像是在证明 Heven
    的战略卡位和准入能力，而不是一家财务披露充分、正在规模化的公司。
  foundedDate: '2019-01-01'
  founders:
    - name: Bentzion Levinson
      role: 创始人兼 CEO
      background: 把 Heven 的起源故事连到 2018 年加沙的燃烧风筝和无人机威胁，也连到后来在 IDF 预备役中的实战经历。
      claimRefs:
        - CO001
        - CO009
  foundingLocation: Israel
  headquarters: Sterling, Virginia, USA
  productSummary: >-
    Heven 销售氢动力、无需跑道的无人驾驶飞行器及配套支持系统。目前产品线围绕 Z1 / H2D250 长航时战术平台、Raider 重载 飞行器、H2D55 长航时多旋翼，以及 HyTEC 式外场支持系统等氢气制备 /
    加注设备展开。
  customerFocus: 核心客户是国防、国家安全和公共安全运营方；商业和人道主义任务被作为相邻场景讨论，但不是当前证据最清楚的主线。
  businessModel: 可见的变现栈似乎把飞行器销售、氢能支持设备、集成或维保工作，以及先进系统模块组合在一起，并通过直接政府采购路径和 SupplyCore、NextTech 等渠道伙伴分发。
  stage: Series B
