  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与出口风险
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 最高的结构性风险，是强防务准入信号被误读为广泛法律许可。两者不是一回事。在民用空域层面，FAA 资料仍把长航时商用无人机运营置于 Part 107
              约束之下，偏离目视视距要求、进入特定空域和突破运行限制都需要豁免。FAA 自己的 BVLOS 资料和 2025-2026 BVLOS
              规则制定记录都显示，机构仍在尝试为常规、可规模化的高级运营建立可预期路径。这很关键，因为 Blue UAS Select 身份有助于可信的联邦采购，但不能替代 FAA 对民用
              BVLOS、受控空域或其他高级任务的授权。如果 Heven 想在国防和公共安全之外打出有意义的商业切口，常规民用可运营性仍是门槛变量，不是已经解决的问题。


              出口与可信供应风险，是同一问题的另一条腿。BIS 表示，出口商仍需按 EAR 对物项分类；其 2026 年 1 月无人机规则只是在较窄民用场景放松管制，并没有消除长航时或近军用系统的出口摩擦。FCC
              Covered List 现在覆盖外国 UAS 及关键部件；按现行通知，Blue UAS 和国内终端产品豁免也只延续到 2027 年 1 月 1 日。DIU
              和白宫都把安全供应描述为仍在推进的政策项目，而不是静态勾选项。Heven
              今天受益于这一趋势，因为它被定位为国内可信替代方案；但如果子系统、技术数据或盟友出货落在狭窄安全港之外，同样的政策波动也会带来重新设计、重新寻源、文档和许可负担。关键尽调缺口是，本次保留的公开来源没有披露
              Heven 机体、自主系统栈或技术数据的实际 ECCN，也没有披露任何公开出口许可路径。
