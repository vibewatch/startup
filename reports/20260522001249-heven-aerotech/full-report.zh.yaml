            body: >-
              Heven 不披露收入，投资者只能从运营和渠道代理指标推断商业牵引。最强信号是任务性能宣称和政府准入里程碑：Z1 围绕超过 10 小时飞行时间、超过 600 英里 航程来营销；公司披露了 12,000-foot
              density-altitude 演示；SupplyCore 现在通过授权经销路径承载 Z1；Army BOA 给 Army 单位提供正式采办路线。
              这些信号重要，因为它们表明买家可能愿意同时为持续留空和采购简化付费。不过，它们不能解决核心单位经济。没有公开来源披露平均售价、经销商折扣、保修准备金、 服务绑定率或 CAC。Army 自己的低成本 sUAS
              寻源措辞，是另一条关键读数：它确认真实需求，也提醒价格和采购节奏仍会很关键。换句话说，Heven 的公开牵引 在战略上可信，但财务上很薄。可见 GTM
              动作是借渠道辅助的防务采购，而不是披露了转化、回本周期或毛利数据的透明商业漏斗。
