        title: 成本结构、营运资本与资本开支含义
        blocks:
          - type: paragraph
            body: >-
              Heven 公开材料暗示的成本结构，比标准电池无人机 OEM 更复杂。单是制造扩张，就会带来模具、设施、库存、供应商预付款和质量保证负担。Heven 还在单独为氢能
              外场基础设施投钱，也就是资本要投向拖车、制备系统、太阳能或离网能力、储存、机动性和部署可用性，而不只是机体。上市公司基准说明了这为什么重要。 AeroVironment 在规模化时仍可能承受毛利率压力；Red
              Cat 最新季度则同时出现低十几位数毛利率、库存和预付库存大幅增加，以及有意义的运营现金消耗。 Joby 文件以更大形态呈现同一模式：硬件规模化在商业化成熟前，会吃掉大量运营现金和资本开支。Heven
              的氢能叠层让营运资本问题更尖锐，因为外场支持栈可能 需要在经常性订单可见之前先建好或融资。GAO 和 Wood Mackenzie 还给出反向宏观背景：氢能仍面临成本高、基础设施薄弱、承购不确定和监管复杂，因此
              Heven 同时暴露于公司执行风险，以及它无法完全控制的基础设施经济性。
