        - '>10h Z1 加公开的 24/7 / 六个月纳电网运行概念'
        - 中
        - 任务持续能力是公开证据中最清晰的溢价支付意愿代理
        - 提供按任务划分的赢单 / 输单分析，说明航时何时改变结果
      - - 毛利率代理（公开可比公司）
        - 12.7% to 24.0%
        - 低
        - 公开可比公司显示，爬坡和规模化阶段毛利率区间很宽，但仍像硬件业务
        - 提供当前 COGS、保修准备金和目标毛利率桥
      - - 库存强度代理
        - 约 Red Cat 2026 年 Q1 季度收入的 4.0x
        - 中
        - 显示出货规模追上前，有多少现金会沉在库存里
        - 提供库存周转、供应商预付款和安全库存政策
      - - 季度运营现金消耗代理
        - 区间：$31.9M 至 $144.4M
        - 低
        - 框定硬件和航空航天爬坡时资本烧掉的速度
        - 提供当前月度烧钱速度和 12 个月运营现金预测
      - - 季度 capex 代理
        - 区间：$6.8M 至 $77.9M
        - 低
        - 制造爬坡通常需要在运营烧钱之外另投 capex
        - 提供 2026-2027 年工装、设施和氢基础设施 capex 计划
      - - 客户集中度代理
        - Red Cat A/R 集中度：88% / 26%
        - 中
        - 面向政府的硬件业务可能很快变得高度集中
        - 提供头部客户收入、A/R 和 backlog 集中度
      - - 销售周期代理
        - 采购驱动；BOA 和经销渠道降低摩擦，但不会消除测试和预算节奏
        - 中
        - CAC 和回本周期高度依赖政府转化速度
        - 提供从评估到付费订单的平均周期
    notes: 各行混合了公开事实、明确 null 和基准代理。null 表示 Heven 未披露；基准行已清楚标注，不应误读为公司报告指标。
