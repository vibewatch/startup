            title: 氢能是小众放大器，不是通用默认项
            body: 当任务持续性、远距搜索时间或巡检覆盖带来的节省，超过氢能增加的物流负担时，氢能才有意义。因此，国防、灾害响应和部分基础设施巡检，比常规 短跳式公共安全任务更适合。
