  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集与任务重叠
        blocks:
          - type: paragraph
            body: >-
              Heven 竞争的不是整个无人机行业，也不是载人 eVTOL 叙事。相关竞争集是更窄的重叠区：长航时、无需跑道、可信供应的飞行器，能够支撑战术 ISR、选择性物流和艰苦环境巡检任务。这让
              AeroVironment JUMP 20/JUMP 20-X、Shield AI V-BAT 和 Quantum Systems Vector 在核心 自由飞行持续留空任务上最接近
              Heven，尽管它们的重量级、载荷包线和海上偏重不同。Skydio X10D 和 Red Cat Black Widow 解决的是问题的
              另一块：航时更短，但电池系统部署性强，且在战术单位采用、自治能力和采购速度上公开证据更强。Anduril Ghost-X 更适合看作相邻的软件定义进入者， 带来载荷灵活性、Army
              准入和更宽的自治栈，而不是类似氢能的动力系统优势。Elistair Khronos 是固定点持续留空最重要的现状替代方案，因为它能让 ISR
              持续升空一整天且无需自由飞行加注，代价是机动半径受限。结论是，Heven 的市场真实但分层：只有部分竞争者端到端匹配同一任务，另有多家公司则靠
              电池、系留，或更强的软件和渠道位置，解决足够多的任务环节，从而削弱对氢能的需求。
