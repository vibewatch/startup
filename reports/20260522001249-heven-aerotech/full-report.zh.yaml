      - number: '5.2'
        title: 氢能运营模型与模块化
        blocks:
          - type: paragraph
            body: >-
              Heven 的差异化，最容易理解成一种运营模型：把氢能推进、模块化载荷架构和越来越明确的外场能源栈组合起来。机体围绕燃料电池续航、VTOL 灵活性和模块化来营销：
              官方页面描述了氢动力、模块化载荷集成、无需跑道，以及在 ISR、物流和应急响应用例中的任务适配能力。公开记录还显示，Heven 希望系统地面侧和飞行器侧一样重要。 Army BOA 明确覆盖的不只是 Z1
              飞行器，还有配套氢气制备系统；HyTEC 项目则在把一台氢气制备拖车推向外场就绪原型和运营评估，并扩展太阳能能力、改进机动性、 降低操作员使用难度。这意味着 Heven
              的真实产品架构至少有五层：机体、氢气储存和燃料电池推进、载荷和航电模块、地面氢气制备 / 加注设备，以及防务部署所需的 软件 / 自治 / 通信层。软件层只部分公开，但当前招聘表面很能说明问题：Heven
              正在多个美国地点公开招聘 AI/ML、云端防务软件、量子、氢气生产、燃料电池、 复合材料和生产工程人才。Zepher Flight Labs 又增加了一项重要架构输入，因为收购明确把轻量、可外场维修的 VTOL
              工程和更模块化的 24/7 机队概念带入 Heven 栈。与此同时，本章的核心风险之一也直接来自同一架构：公开来源仍未披露加注循环时间、氢气纯度要求、交付燃料成本、安全流程或详细子系统
              BOM，因此氢能工作流方向上 有吸引力，但技术文档不足。
