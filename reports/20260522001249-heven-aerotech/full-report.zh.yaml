      - number: '7.3'
        title: 客户集中、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              最实际的承保风险，是被动能包装起来的客户集中。Heven 最近的里程碑栈真实存在：$100 million B 轮融资、Blue UAS Select 和陆军 BOA
              都不是小成绩。但公开证据仍集中在陆军和相邻国防渠道，已披露商业客户名称、民用豁免、复购节奏和积压订单都缺席。也就是说，公司赢得准入和可信度的速度，明显快于证明收入可重复转化的速度。采办法律把这个差异说得很明白：BOA
              不是合同；独立的反向评论也已经聚焦投资人把路径当成积压订单的风险。同样不对称也出现在商业化上。BVLOS NPRM 和白宫无人机命令都指向未来民用上行空间，但 Aerospace America
              报道，运营方仍担心昂贵硬件要求和豁免过渡的不确定性。如果常规商用 BVLOS 比预期更慢或更贵，民用多元化可能后移，而国防集中度仍然高企。


              财务上，相对于公司估值，公开记录也异常稀薄。Heven 称 B 轮融资用于扩大生产，但本次保留的公开来源没有披露 2026 年收入、ARR、烧钱速度、积压订单、吞吐量或复购耐久性。robotics.press
              也没有发现公开 AS9100 认证、当前吞吐量指标或当前员工数；这些正是投资人在相信一个制造密集型防务爬坡前想看到的证明点。执行风险在于，Heven
              必须同时成熟氢后勤、维持可信供应合规、满足自主治理预期，并把国防准入转成有资金支持的项目；与此同时，公司仍带有私营公司的不透明性。只有管理层能把多个验证步骤压缩进同一个 12 至 18
              个月窗口，这才是一个资本效率高的故事。任何一层滑坡，融资叙事都会很快变弱。
