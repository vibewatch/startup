      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              这一章不应只是复述 Company Overview 里的历史融资时间线；真正的承销问题，是最近的资本基础看起来是否足以支撑下一阶段。可见答案只有一部分。最新公开 融资是 $100 million Series
              B、估值 $1 billion，管理层已经把这笔资本分配到三个同步推进的桶：本土制造、氢能物流基础设施，以及先进系统或量子集成。 公司还聘请
              CFO，在规模化时负责融资、合规和投资者关系，这符合一个更重财务能力的运营阶段。缺失的信息才是关键：没有公开现金余额，没有烧钱速度，没有现金
              跑道，没有在手订单，没有债务计划，也没有订单金额披露。上市航空航天公司文件帮助框定风险。Joby 明确表示，在运营现金流能够覆盖费用、营运资本和资本开支之前， 公司预计还会继续依赖股权和债务；Red Cat
              展示了在毛利成熟前，库存和现金使用会多快上升。Heven 也许足以支撑近期阶段，但公开证据还不足以证明这一点。 因此，融资依赖仍是承销风险，不是已经解决的问题。
