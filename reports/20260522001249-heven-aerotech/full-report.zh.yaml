  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买家地图
        blocks:
          - type: paragraph
            body: >-
              Heven 的真实市场不是「所有无人机」，而是长航时、安全供应链和快速外场部署重要到足以抵消氢能复杂性的那一块。官方 DIU 和 Army 信号显示，可信、符合 NDAA 的小型 UAS
              现在位于一个有闸门的防务市场中；市场由 Blue UAS 资格和合同工具准入塑形， 而不只由机体性能决定。民用侧，公共安全和关键基础设施买家看重的是另一组指标：飞行时长、重新部署时间、相机质量、数据工作流，
              以及符合安全授权要求。公用事业和交通机构买的也不是飞机本身，而是巡检结果——覆盖范围、可重复性、AI 辅助的资产情报，以及减少 人员暴露。这个边界排除了爱好 / 摄影无人机、广义消费级无人机支出、载人 eVTOL
              叙事，以及多数最后一英里配送炒作。它包括飞行器、 载荷集成、安全软件、培训、维保，以及在任务要求持续留空时需要的氢气制备 / 加注栈。按这个框架，Heven 属于服务国防、公共安全和
              工业巡检工作流的双用途、长航时、可信供应 UAS 市场。
