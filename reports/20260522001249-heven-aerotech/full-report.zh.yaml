  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 这些战略拐点把 Heven 从创始人主导的氢能无人机创业公司，推成一家站位美国的国防科技公司；其中也包括 2026 年披露质量警示。
    data:
      items:
        - date: '2019'
          label: Heven 成立
          detail: Bentzion Levinson 围绕氢能无人机自主能力和任务价值创办公司。
          tone: positive
        - date: 2025-07
          label: Z1 达到 12,000-foot 演示里程碑
          detail: Zepher Flight Labs 披露，在最大起飞重量下完成高空性能测试。
          tone: positive
        - date: 2025-10
          label: 更名与 Zepher 整合
          detail: Heven Drones 更名为 Heven AeroTech，并把新身份与收购来的 VTOL 工程能力连接起来。
          tone: positive
        - date: 2025-10
          label: Sterling 总部启用
          detail: 公司设立 Northern Virginia 总部，以强化其在国防政策和工业基础中的定位。
          tone: positive
        - date: '2025-10-11'
          label: 规模推进前补上 CFO
          detail: Constance O’Brien 加入，补强财务和运营深度。
          tone: positive
        - date: '2025-11-20'
          label: Z1 入选 Blue UAS Select
          detail: 该平台成为获准清单上的首个氢能系统，并取得 ATO 状态。
          tone: positive
        - date: 2025-12
          label: $100M Series B，估值 $1B
          detail: IonQ 领投融资让 Heven 成为独角兽，并为制造、氢能物流和量子赋能路线图提供资金。
          tone: positive
        - date: 2026-01
          label: Army BOA 生效
          detail: 该协议为 Z1 和氢能系统打开采购路径，但未披露确定订单金额。
          tone: positive
        - date: 2026-02
          label: 管理层与顾问阵容扩充
          detail: 具名招聘和顾问动作补上 AI、合同和特种作战背书。
          tone: positive
        - date: '2026-05-22'
          label: 公开披露质量警示
          detail: 尽调时新闻链接和新闻稿 URL 失效，削弱公开审计线索的耐久性。
          tone: warning
