            body: >-
              客户是否能持续留下来，仍是 Heven
              客户章节最大的分析缺口。留存、复购和使用深度，才会告诉投资人：强劲的漏斗上层兴趣，是否真的转成了有粘性的装机基础；公开记录目前没有披露这些指标。本次保留的资料来源都没有给出客户数、活跃机队规模、任务订单节奏、合同金额、续约率、NRR、GRR、流失率、平均合同期限、出动架次，或按客户统计的飞行小时。这个缺口尤其重要，因为
              Heven 自己已经开始提出更大的客户需求叙事：B
              轮公告称，需求正来自美国特种作战司令部、作战司令部和盟军；官方页面也持续描述其在全球的运营部署。这些说法方向上可能成立，但还不能说明需求已经转成已披露的采购订单、有经费支持的后续项目，或复购使用指标。实际推论是，客户持续性必须按未知来承保，不能从采购入口直接假设。
