      - number: '2.4'
        title: 采用约束与反向证据
        blocks:
          - type: paragraph
            body: >-
              限制因素不是认知或好奇心，而是监管、预算和氢能物流。FAA 页面仍把 BVLOS 描述为一项拟议中的常态化工作，涵盖运营、制造、间隔、
              授权、安全、报告和记录保存等详细要求；公共安全渠道也仍包在工具包、权限和事件管理指南里，而不是获得开放式飞行自由。这会拖慢民用规模化， 即便是在 ROI
              高的巡检市场。公共安全愿意尝试，也不应被误读为会立刻转向氢能：NIST 发现 70% 会考虑替代动力源，但同一调研仍偏好 电动系统胜过混合动力或液体燃料，并显示多数人希望支持宽带的无人机价格在 $10,000
              或以下。氢能基础设施又加了一道卡口。DOE 称商业化 仍取决于储存、传输、分配、交付和加注改进。IEA 和学术综述显示，已宣布的低排放氢项目、管线和储存距离完整投资承诺仍很远；持怀疑态度的
              基础设施分析则认为，集中式建设需要多年、数百亿美元和重大监管转向。因此，只有当氢能续航能抵消这些摩擦时，市场才有吸引力；并不是每一页 广义无人机 TAM 幻灯片声称能进入的地方都成立。
