      - number: '4.5'
        title: 财务结论与承销阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务上，Heven 看起来比已被充分承销的样子更有意思。正面逻辑很直接：公司有新资金、一个与任务相关的续航故事、多项公开信号显示氢能支持设备可能扩大合同价值，
              以及真实的防务渠道动能。负面逻辑才是当下尽调的重点。收入质量无法打分，因为可见动作看起来由合同驱动、硬件占比高，但没有公开来源披露收入结构、实际 ASP、
              毛利率、保修负担或服务绑定率。毛利路径只能松散对标上市同行，而这些同行显示，烧钱、库存建设和资本开支会在规模化很深之后仍然重要。采购依赖也是直接风险， 因为最强公开需求信号来自 Army 和防务路径，而 Army
              同时强调大批量低成本 sUAS。最大的承销阻塞点，是披露不透明本身：管理层已经告诉市场公司想如何花钱，
              却没有告诉市场业务已经产生或消耗多少钱。在这一点改变之前，本章支持「继续研究」姿态，而不是干净的财务确信判断。
