  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与公开证据真正证明的内容
        blocks:
          - type: paragraph
            body: >-
              Heven 的公开融资锚点，价格异常清楚，运营证据异常稀薄。公司宣布完成 $100 million 的 B 轮融资，估值 $1
              billion，并把资金用途绑定到三类可见支出：国内制造扩张、制氢和后勤基础设施、先进量子、导航和自主能力。这足以确立当前价格标记，但不足以用常规运营指标支撑它。本次保留的 Heven
              融资或采购报道均未披露收入、毛利率、烧钱速度、现金跑道、积压订单、客户集中度或轮次条款。陆军 BOA 在准入上增加了有用证据点，但采办法明确：BOA 不是合同，也不意味着未来订单。按估值语言看，公开记录证明
              Heven 已融到资金、有战略野心，也有若干防务市场路径。它没有证明有资金支持的需求、利润率结构或现金转化已经能支撑 $1 billion
              价格。因此，本章第一条纪律，是把这一轮当作里程碑估值锚，而不是有证据支撑的价格发现。
