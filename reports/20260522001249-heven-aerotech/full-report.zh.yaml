      - - 氢燃料电池动力系统
        - 相比纯电飞行拉长续航，相比燃烧动力降低声学 / 热特征
        - 取决于氢储存、燃料电池子系统可靠性和安全野外操作
        - 公开文件未披露燃料纯度要求、加注循环时间或单架次生命周期成本
      - - 载荷 / 航电模块化
        - 允许按角色切换 ISR、通信、物流或其他任务套件
        - 取决于标准化挂点、功率预算、无线电和航电集成
        - 公开产品页宣传模块化，但未发布一套权威接口规范
      - - 地面制氢 / 加氢层
        - 让长航时系统持续运行，不只靠换电池或车队运油
        - 取决于 HyTEC 拖车成熟度、机动性、太阳能输入、伙伴执行和操作员培训
        - 公开仍处原型阶段；未披露产出率、正常运行时间或加注吞吐指标
      - - 自主 / 软件 / 通信层
        - 支撑任务规划、机载决策支持、云 / 防务软件，以及未来量子赋能功能
        - 取决于内部软件团队、无线电、云系统和网络安全合规
        - 产品页对软件栈披露不足；招聘比已发布的架构细节更能说明问题
      - - 制造 / 供应商网络
        - 支撑扩产、国内交付和子组件生产
        - 取决于 Mach Forge 产能，以及共同开发的航电、无线电、燃料来源和推进组件
        - 如果合作伙伴滑期，组件和供应商依赖会拖慢生产或认证
