            title: Heven 的公开变现故事是硬件加基础设施，不是 SaaS
            body: 保留证据支持一个比单纯飞行器更宽的合同包：机体、氢气制备系统、渠道辅助采购和先进系统升级。这可以扩大合同价值，但本身不会创造 ARR 质量的收入。
