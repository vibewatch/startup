  - id: FE001
    title: 产品架构图谱
    type: stack
    layout: wide
    summary: 从氢能机体到地面燃料支持，再到可信部署层，这套架构有证据支撑。
    data:
      layers:
        - label: 飞行器产品族
          detail: 当前官方页面显示，氢能产品线以 Z1/H2D250、Raider、H2D55 为核心，H100 和 Urban 仍作为相邻页面可见。
          items:
            - Z1 / H2D250 — 紧凑型战术 ISR VTOL
            - Raider — 更重型物流 / 吊运投送平台
            - H2D55 — 面向高悬停任务的长续航多旋翼
            - H100 / Urban — 官方相邻页面仍可见，但当前证据较薄
        - label: 氢能推进与储存
          detail: 续航逻辑靠机载氢燃料电池供电，而不是纯电池飞行。
          items:
            - 官方页面反复强调燃料电池续航
            - 低声学 / 热特征定位
            - 相比电池更换周期，主打快速加氢叙事
        - label: 载荷与任务模块化
          detail: Heven 把产品族定位为模块化、可适配任务，而非单一用途。
          items:
            - ISR 载荷和侦察角色
            - Z1 上通信 / 传感器副载位叙事
            - Raider 的物流和补给任务套件
        - label: 地面氢能支持栈
          detail: HyTEC 及配套制氢系统说明还有独立的野外能源产品层。
          items:
            - 处于原型改进阶段的制氢拖车
            - 太阳能辅助离网制氢概念
            - 机动性和操作员体验重设计工作
        - label: 可信部署与规模化层
          detail: 产品交付既靠资质、采购渠道和软件 / 人才深度，也靠机体本身。
          items:
            - Z1 的 Blue UAS Select + ATO
            - Army BOA + SupplyCore 经销路径
            - 围绕 AI/ML、云防务、燃料电池、量子、复合材料和生产招聘
    approximationNotes: 公开来源只在系统层面描述这套栈，没有保留来源发布完整电气、热管理或加氢架构。
    claimRefs:
      - CE001
      - CE009
      - CE019
      - CE020
      - CE023
      - CE025
      - CE044
      - CE045
