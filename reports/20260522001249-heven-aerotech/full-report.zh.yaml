      - number: '8.3'
        title: 乐观、基准与悲观情景承保
        blocks:
          - type: paragraph
            body: >-
              由于 Heven 不披露做 DCF
              或干净收入倍数模型所需变量，公开资料下最好的办法是情景分层。乐观情景需要三件事很快变得可见：防务准入栈带来有资金支持的订单转化；可信证据证明氢后勤改善任务经济性，而不是只增加资本负担；披露收入或积压订单基础，让当前价格更像后期成长型硬件，而不是投机故事股。基准情景承认真实产品差异化和政策顺风，但假设公开披露仍薄，氢支持仍贵，采购转化慢于叙事暗示。悲观情景假设
              BOA 仍是路径而非需求证明，氢基础设施继续面对成本和市场摩擦，公司还需要更多资本，才能用订单证明补上缺口。这些不是抽象可能性；它们就是当前证据集传导到估值的直接线路。
