  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流 / 痛点
      - Heven 方案
      - 可衡量的公开收益
      - 局限
    rows:
      - - 长航时 ISR / 监视
        - 电池多旋翼必须频繁返航，造成持续能力缺口
        - Z1 / H2D250 战术氢能源 VTOL 平台
        - '>10h 飞行时间、5 分钟部署、低声学 / 热特征信号、Group 2 便携性'
        - 公开证据在国防采购上最强；民用审批未展示
      - - 简陋争夺环境物流
        - 燃料车队和短航程飞机限制拒止环境中的补给
        - Raider 加氢支持栈
        - 50 lb 载荷和 12+h 航时被宣传为可减少重新部署和后勤负担
        - 没有公开任务日志或维保指标显示其在外场的实际表现频率
      - - 长时间悬停点检 / 持续空中任务
        - 传统多旋翼在悬停精度和航时之间取舍
        - H2D55 长航时多旋翼
        - 官方产品组合称悬停任务航时为 120 分钟
        - 当前公开证据缺少具名客户部署或维护间隔
      - - 偏远环境中的重复架次支持
        - 如果燃料无法在战区生成或移动，长航时机体仍会失效
        - HyTEC 制氢拖车
        - 公开项目目标是自产氢，并通过改进机动性和太阳能支持的离网生产来支撑部署
        - 拖车仍处于原型优化和政府评估阶段，尚未证明可规模化外场服务
      - - 政府买方采购简化
        - 新 UAS 类别常常还没部署，就卡在测试或采购摩擦里
        - Z1 围绕 Blue UAS Select、Army BOA 和 SupplyCore 转售商路径
