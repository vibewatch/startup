  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant public drone, defense, autonomy, and eVTOL comparables that bracket Heven’s current
        private valuation using fetched 2026 market-cap pages plus official filings or company releases.
    columns:
      - 可比公司
      - 2026 年公开估值 / 状态
      - 收入或流动性锚点
      - 与 Heven 的相关性
      - 关键限制
    rows:
      - - AeroVironment
        - 市值 ~$8.25B；已具规模的上市国防自主平台
        - Q3 收入 $408.0M；9M 收入 $1.3B；FY26 指引 $1.85-1.95B；已获资金支持的在手订单 $1.1B
        - 防务无人机公司拿到溢价估值时，已披露规模和在手订单应是什么样。
        - 比 Heven 大得多、业务也更分散，因此不是干净的逐产品可比。
      - - Red Cat Holdings
        - 市值 ~$1.37B；上市防务无人机纯标的
        - 2026 年 3 月季度收入 $1.111M；现金 $7.264M
        - 当国防预期主导估值时，当前小收入也能与 Heven 式估值并存。
        - 高度投机且波动大；不能证明 Heven 应得到同样结果。
      - - Joby Aviation
        - 市值 ~$10.22B；里程碑驱动的 eVTOL 可比
        - 2026 年 Q1 现金及短期投资约 $2.5B；目标 2026 年启动运营
        - 在规模化收入出现前，多十亿美元里程碑估值可把它作为上限样本。
        - 客运 eVTOL 的经济性、流动性和认证披露远比 Heven 的公开记录成熟。
      - - Archer Aviation
        - 市值 ~$4.66B；规模化前 eVTOL / 军民两用叙事
        - 2026 年 Q1 收入 $1.6M；流动性约 $1.8B
        - 收入仍极少时，公开市场仍愿意为认证和平台故事提供资金。
        - 商业模式和资本基础与氢能 UAS 公司差异很大。
      - - EHang Holdings
        - 市值 ~$0.71B；已披露商业 eVTOL 收入基础
        - 2025 年收入 $59.8M；2025 年净亏损 $39.5M
        - 可作为中低位区间，因为投资人能看到真实商业收入，公司估值仍低于 Heven。
        - 中国敞口、监管路径和飞行器类别不同于 Heven。
      - - Draganfly
        - 市值 ~$0.22B；小型上市无人机 OEM
        - 2026 年 Q1 收入 $2.31M；现金 $147.3M
        - 低位无人机可比样本，运营规模可见但有限。
        - 规模小得多、防务属性更弱，也不以氢能为核心。
    notes: 公开市值截至本次运行日期；收入和流动性锚点来自抓取到的监管文件或官方发布。该表是合理性区间，不是说公开股票交易会一比一映射到私募轮次。
