      - number: '3.2'
        title: 能力、采购与就绪度对比
        blocks:
          - type: paragraph
            body: >-
              在原始持续留空能力上，Heven 有差异化，但并不孤单。Military.com 报道 Z1 搭载 10-pound 载荷可飞行超过 8 小时，Sesame 营销一套双机 nanogrid
              套装用于持续覆盖。这有意义，但 AeroVironment 已经部署 13+ hour JUMP 20 变体、载荷 30-pound；Shield AI 则营销 12-13+ hour V-BAT 续航，配
              JP-5 和 SATCOM，用于海上或远征 ISR。Quantum 达不到这些时长，但其 Vector 和 Trinity 系统仍分别达到 180 分钟和 90
              分钟，同时保留电动简洁性和快速架设。短航时一端，Skydio 和 Red Cat 承认续航较短，但用符合 Blue-UAS 的电池系统反击； 这些系统针对 GPS-denied 自治、更快班组级采用，并有紧急
              Army 或 NATO 采购的公开证据。Anduril 的 Ghost-X 处在中间：航时短于 Heven， 但载荷大得多，并有 Lattice 驱动的指挥栈，契合
              Army「买系统，而不只是买机体」的逻辑。对买家来说，这意味着只有当低特征、多小时自由飞行持续留空， 比燃料简单性、AI 栈成熟度或近期部署规模更重要时，Heven 才会赢。
