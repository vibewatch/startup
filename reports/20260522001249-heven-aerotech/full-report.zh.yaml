  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Heven 的经济模型更像捆绑式防务硬件和外场支持方案，而不是 SaaS。公开来源支持四层变现：直接或渠道牵引的机体销售、氢气制备或加注设备、围绕已部署 系统的集成或维保工作，以及绑定自治、量子安全通信和
              GPS-denied 定位的先进系统升级。公开记录缺的，几乎是投资者为这些层做承销所需的所有变量。 公司自己的产品页面营销任务价值和续航，但不列出 Raider 或 H2D55
              价格，也不披露保修条款、服务定价或实际折扣。可见渠道中最清楚的定价信号，其实不是 价格，而是上市路径：SupplyCore 把 Z1 放入既有政府目录路径，Army BOA 又为 Z1
              和配套氢气制备系统增加合同工具。这能证明 Heven 不只变现一个机体外壳， 但它仍指向谈判定价下的块状项目收入，而不是清晰的经常性 ARR。
