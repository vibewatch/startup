              公开可比公司不能救出一个干净的买入逻辑，但确实说明，$1 billion 标记也不能被直接否定。区间一端，AeroVironment
              的市值高得多，但有十亿美元级收入和有资金支持的积压订单支撑。另一端，EHang、Draganfly 等较小上市公司市值低于 Heven，同时仍披露真实收入、亏损和现金。歧义在区间中部。Red Cat
              显示，无人机纯标的即便当前收入很小，也能靠未来防务预期达到接近 Heven 的公开估值。Joby 和 Archer
              显示，里程碑驱动的航空航天估值可以维持在数十亿美元，但两家公司也披露现金、认证进展和运营时间表，这是 Heven 没有做到的。推论不是 Heven
              明显高估或明显便宜。推论是，在公司披露足够经济性、能够可信映射到某条公开可比赛道之前，当前价格只能按叙事和里程碑估值来承保。
