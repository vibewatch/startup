      - - 正式项目定位可能带来多年采用
        - 正式项目状态尚无公开证明
        - 投资人可能把路线图意图误读成当前采购成熟度
        - 索取任何正式项目推进的确切状态和所需里程碑
      - - 国防优先可能提升短期可信度
        - 商业和人道主义多元化缺少具名付费证据
