      - number: '8.4'
        title: 建议、否决触发点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开记录支持在当前 $1 billion
              融资锚点下给出继续研究建议、中等信心、高风险评级和偏高估值立场。这不是说公司没有潜力，而是说，当公开证据如此不完整时，价格纪律必须先于技术热情。上行成立需要的条件很直白：披露有资金支持的订单、给出积压订单桥、证明氢野外支持可以规模化且不破坏资本效率，并提供足够毛利率或单位经济可见性，说明本轮是在资助加速，而不是买时间。打破投资逻辑的条件同样直白：需求证明前再次融资，收入和积压订单持续不披露，或证据显示即便飞机表现达标，氢基础设施在商业上仍笨重。在这些问题回答之前，公开可比公司只能框定结果范围，不能验证当前价格。正确的下一步，不是按叙事买这一轮，而是要求公司拿出一套能让叙事经受承保检验的私有证据。
