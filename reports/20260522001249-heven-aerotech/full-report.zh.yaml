      - number: '2.2'
        title: 规模测算视角与市场区间
        blocks:
          - type: paragraph
            body: >-
              规模测算的难点在于，多数可用无人机预测对 Heven 来说过宽，而最窄的巡检估算又漏掉国防和公共安全需求。McKinsey 2017 年美国 视角给出到 2026 年每年 $8-20 billion 制造 /
              服务活动、每年 $31-46 billion GDP 影响，但这些数字纳入了很多没有氢能、没有 Blue UAS 过滤、没有采购约束的用例。Drone Industry Insights 预计 2035
              年全球无人机市场超过 $83 billion，并明确拆出公共 应急服务、能源、巡检、配送和交通基础设施；这些相邻切面方向上有用。更窄的巡检专项来源小得多：MarketsandMarkets 预计巡检和监测 市场从
              2022 年 $11.6 billion 增至 2027 年 $23.0 billion，Verified Market Reports 则估计工业巡检无人机从 2025 年 $1.5 billion 增至
              2034 年 $5.2 billion。实用结论是，Heven 在证据约束下的 SAM，是国防采购、公共安全和巡检密集型工作流的 重叠区，其中持续留空和可信来源很重要；使用全无人机 TAM 会夸大可投资市场。
