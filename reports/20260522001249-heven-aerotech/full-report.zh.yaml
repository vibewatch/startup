        blocks:
          - type: paragraph
            body: >-
              Heven 还在从创始人主导的产品公司，走向结构更完整的防务供应商；领导层是最清楚的信号之一。Levinson 仍担任 CEO，
              也是起源故事、重塑品牌、融资和市场定位中的主导公开叙事者；即使运营班底在扩充，关键人物依赖仍然明显。Michael Buscher 已经成为美国运营、总部扩张和 Army 采购准入的公共代表。2025
              年底以来，公司还补齐了关键控制职能： Constance O’Brien 负责财务，Samantha Hamilton 负责 AI，Kimberly Crooker 负责合同和采购，退役 Lt. Gen.
              Scott Howell 提供高级防务顾问背书。这些任命方向上是正面的，因为它们契合 Heven 把有潜力的平台转成可规模化、
              面向政府业务所需的能力。不过，治理可见度仍不完整。抓取到的来源显示了顾问增补和投资人相关董事会参与，却没有完整
              公开董事会名单、投票权图谱或由股权结构表驱动的控制结构。尽调在最影响下行保护的治理层面，仍要依赖公司直接披露。
