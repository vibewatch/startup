              Heven 近期资本故事的核心事实，是 2025 年 12 月 Series B：$100 million，估值 $1 billion，IonQ 领投，老股东 Texas Venture Partners
              参投。这一轮的重要性，不在于虚荣的「独角兽」标签，而在于它说明公司正在获得资金，用来围绕 防务优先的产品路线图扩大本土制造、氢能物流，以及量子赋能的导航和通信。公开证据也显示，利益相关方版图不只包括股权
