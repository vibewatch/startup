      - number: '5.3'
        title: 成熟度、制造与产品线就绪度
        blocks:
          - type: paragraph
            body: >-
              公开证据指向 Heven 产品线内部真实的成熟度层级，这个层级会影响承销。Z1 是最成熟的产品叙事，因为三层不同证据已经对齐：官方产品页规格、Blue UAS Select 加 ATO，以及公开的
              12,000-foot 密度高度飞行里程碑，Army Research Labs 被列为更广测试活动的一部分。这并不让 Z1 完全去风险，但确实把它从 纯宣传册产品推了出来。Raider
              是下一个最有意思的产品，因为公司一直高频营销它，描述其具备 50-pound 载荷 / 12-plus-hour 续航能力，并把它与 Mach 支持的生产规模化相连；但它仍缺少 Z1
              现有那种同质量的公开部署证明或采购资质。H2D55 在产品族中有官方角色，也被纳入 Mach 制造计划，但保留来源没有显示同等水平的 当前测试或客户证明。HyTEC
              成熟度更早：它在战略上重要，因为直指外场氢能瓶颈，但公开描述仍是原型改进、演示和运营评估，而不是已部署的序列化产品。制造准备度在提升， 但仍高度依赖外部。Mach 合作把 H100、H2D55 和 Raider
              生产放进 Forge Huntington，并明确提到共同开发航电、无线电、燃料源和推进系统；这对规模化有帮助， 也让 Heven
              依赖核心机体外壳之外的供应商和伙伴执行。开发者信号进一步证明，规模化不只是理论，因为招聘表面已经覆盖量子、AI/ML、软件、燃料电池动力系统、氢气生产、
              复合材料、物流和生产岗位。尽管如此，公开材料没有披露可靠性指标、维护负担或交付节奏，因此成熟度应被解读为「在推进但不均衡」，而不是整个目录都已通过部署验证的笼统结论。
