              Heven AeroTech 的客户故事，目前在政府买家或渠道被公开点名的地方最强。最清楚的具名需求表面，是美国 Army 采购路线：一份 2026 年 1 月生效的 基本订购协议，由 Z1 的 Blue UAS
              资格支撑，为 Army 单位购买该飞行器及配套氢气制备系统提供了有记录的路径。这一点重要，因为它把 Heven 从纯宣传册叙事推入真实采办工作流。但公开证明仍停留在买家准入层，而不是经常性使用层。Army
