      - number: '5.4'
        title: 合规、空域与技术风险
        blocks:
          - type: paragraph
            body: >-
              2026 年产品技术层面的核心读数，是 Heven 对美国防务用户的采购准备度大幅提高，但并不等于对所有运营方或司法辖区都普遍就绪。Blue UAS Select 和 Army BOA 实质性改善了 Z1
              在美国联邦市场的信任、网络安全、供应链和采购定位。同一监管环境也创造了硬依赖：FCC 2026 年覆盖清单框架现在把外国 UAS 和关键 组件视为受限对象，除非落入 DCMA Blue UAS Cleared
              List 或国内最终产品例外等可信类别。这意味着供应链合规不再是品牌标签，而是产品能否被采购和部署的 一部分。民用部署是另一道闸门。FAA 自己的豁免指南明确，BVLOS、在管制空域运营、400 feet AGL
              以上运营，以及其他非标准任务，需要豁免支持和详细风险缓释计划， 审查周期可能长达 90 天。因此，Heven 的续航和高度成就不会自动转化为常规民用运营。氢能物流是另一项重大技术风险。HyTEC
              存在，正是因为燃料可得性、机动性和离网制备 仍是需要解决的运营问题；公开来源仍未披露氢气生产经济性、周转时间、纯度、安全处理或维护负担。出口在公开证据中同样未解：Mach 的合作表述提到面向美国盟友的主权生产，
              但保留来源没有提供 Heven 平台的具体 BIS/DDTC 分类或出口许可路径。结果是一家公司具备可信产品动能，但其技术成熟度仍取决于物流、合规和伙伴执行，而这些仍只有部分透明。
