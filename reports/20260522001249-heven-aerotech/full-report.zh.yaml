      - number: '3.4'
        title: 差异化的耐久性
        blocks:
          - type: paragraph
            body: >-
              支持 Heven 的最强论点，不是「氢能胜过所有无人机」，而是氢能在一小段任务中可以构成有意义的系统优势：买家需要低特征、多小时、无需跑道的自由飞行， 又不能接受频繁换电池或固定系留几何。这在艰苦环境
              ISR，以及部分物流或远程巡检任务中是真实楔子。反向解读同样重要。AeroVironment 和 Shield AI 已经证明，军方买家可以从多燃料或重燃料架构获得长航时，并接入现有燃料链。Skydio、Red
              Cat 和 Anduril 证明，在短程战术任务中，自治能力、操作员 负担和采购速度可能比续航更重要。Elistair 证明，持续留空本身也可以被拆成一个系留基础设施产品，而不是氢能飞行器。这让 Heven
              的护城河带有条件： 如果它能把氢能续航与已验证采购渠道、物流简化和真实任务胜率结合起来，差异化就足够持久且有意义。否则，氢能可能变成一个小众复杂因素，被塞进一个已经 布满可信供应替代方案的市场。
