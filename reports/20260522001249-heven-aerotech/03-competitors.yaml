callouts:
- calloutType: insight
  title: Heven’s true direct field is smaller than the broad drone market
  body: The cleanest direct comparisons are AeroVironment, Shield AI, and Quantum Systems. Skydio, Red Cat, Anduril, and Elistair still matter, but mostly because they remove pieces of the job with stronger autonomy, shorter-mission simplicity, or fixed-site persistence rather than by mirroring Heven end to end.
  claimRefs:
  - CP006
  - CP011
  - CP025
  - CP038
  - CP039
  - CP041
  - CP046
- calloutType: risk
  title: Channel power can commoditize airframe differences
  body: ADS, NSPA, DLA Tailored Logistics, COBBS, and SupplyCore all appear in the retained public record. That is a warning that speed-to-fielding and procurement plumbing can matter as much as airframe nuance once multiple trusted vendors are already qualified.
  claimRefs:
  - CP001
  - CP017
  - CP020
  - CP023
  - CP033
  - CP042
  - CP045
- calloutType: risk
  title: Hydrogen is a conditional moat, not an automatic one
  body: Hydrogen matters when buyers need low-signature multi-hour free flight in austere conditions. It is much less compelling when heavy-fuel, battery, or tethered systems already clear the mission threshold with simpler logistics.
