company:
  name: Heven AeroTech
chapter:
  number: 3
  title: Competitors
  summary: 'Heven AeroTech competes in a narrower field than the overall drone market: direct long-endurance VTOL ISR peers such as AeroVironment, Shield AI, and Quantum Systems, plus battery/autonomy and tethered substitutes such as Skydio, Red Cat, Anduril, and Elistair for portions of the same job. Public evidence supports a real hydrogen differentiation in low-signature multi-hour austere ops, but it also shows that heavy-fuel, electric eVTOL, tethered, and channel-driven procurement alternatives can blunt that edge when buyers do not value persistence enough to absorb fuel-stack complexity.'
sections:
- id: competitive-set-and-job-overlap
  title: Competitive Set and Job Overlap
  body: 'Heven is not competing with the entire drone industry, nor with passenger eVTOL narratives. The relevant competitive set is the narrower overlap of long-endurance, runway-independent, trusted-supply aircraft that can support tactical ISR, selective logistics, and austere inspection missions. That puts AeroVironment JUMP 20/JUMP 20-X, Shield AI V-BAT, and Quantum Systems Vector closest to Heven on the core free-flight persistence job, even though their weight classes, payload envelopes, and maritime bias differ. Skydio X10D and Red Cat Black Widow solve a different slice of the problem: shorter-endurance but highly deployable battery systems with stronger public evidence of tactical-unit adoption, autonomy, and procurement speed. Anduril Ghost-X is better read as an adjacent software-defined entrant that brings payload flexibility, Army access, and a broader autonomy stack rather than a hydrogen-like powertrain edge. Elistair Khronos is the most important status-quo substitute for
    fixed-site persistence because it can keep ISR aloft for a full day without free-flight refueling, albeit at the cost of maneuver radius. The upshot is that Heven’s market is real but layered: only some competitors match the same job end-to-end, while several others remove the need for hydrogen by solving enough of the mission with batteries, tethering, or stronger software and channel positions.'
