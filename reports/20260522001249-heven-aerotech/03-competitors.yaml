  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable unit pricing, training bundles, sustainment terms, and volume discounts for Heven, AeroVironment, Shield AI, Skydio, Red Cat, Quantum, Anduril, and Elistair.
    whyItMatters: Without real quotes or contract schedules, the chapter cannot test whether hydrogen endurance is cost-effective versus battery, heavy-fuel, or tethered substitutes.
    diligencePath: Request current quotes or awarded contract line items from vendors, resellers, or government procurement records and normalize them into a per-mission or per-system comparison.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: heven-conversion
    missingEvidence: Publicly verifiable reorder cadence, task-order values, backlog, or active deployed-customer counts for Heven after Blue UAS Select and Army BOA milestones.
    whyItMatters: Channel access and qualification only matter if they convert into recurring procurement and deployed operational programs.
    diligencePath: Ask management for task-order history, reorder rates, pipeline conversion, and named deployed programs; cross-check against reseller and contracting counterparties.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: hydrogen-logistics
    missingEvidence: Field hydrogen cost per flight hour, refill cycle time, maintenance burden, and failure rates versus battery and heavy-fuel alternatives in representative missions.
    whyItMatters: Hydrogen can be a moat only if the real sustainment burden is outweighed by mission persistence and signature benefits.
    diligencePath: Obtain mission-level operating data from Heven pilots, Sesame nanogrid deployments, and customer debriefs, then compare against battery and heavy-fuel mission logs.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP004
