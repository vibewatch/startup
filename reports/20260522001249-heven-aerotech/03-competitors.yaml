- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Hydrogen endurance is unique
    - AeroVironment and Shield already deliver 12-13+ hour VTOL endurance using multi-fuel or JP-5-compatible systems
    - High
    - Validate mission win rates and TCO where Heven beats existing-fuel alternatives
  - - Blue UAS Select creates scarcity
    - Blue / Army qualification is broadening across Red Cat, Quantum, Skydio, Anduril, and other trusted vendors
    - High
    - 'Prove differentiation beyond qualification: mission outcomes, signature, sustainment, and logistics'
  - - SupplyCore fixes distribution
    - Channel intermediaries such as ADS, NSPA, COBBS, DLA TLS, and primes still hold procurement leverage
    - High
    - Confirm preferred-vendor status, reseller margin structure, and repeat-order conversion
  - - Long endurance wins all persistence jobs
    - Elistair-style tethered systems can solve fixed-site overwatch more cheaply and continuously
    - Medium
    - Position Heven on maneuver persistence and austere mobility, not static watchtower use cases
  - - Autonomy is “good enough” across vendors
    - Skydio and Anduril may win where operator burden, AI, and software-defined command matter more than endurance
    - Medium-High
    - Benchmark GPS-denied navigation, multi-vehicle control, and mission-planning workflow against those platforms
  - - Price will justify hydrogen if the capability is better
    - Public pricing is opaque, so cost-per-mission and sustainment assumptions remain unverified
    - Medium
    - Obtain real quotes, fuel-stack OPEX, and service/support assumptions before underwriting moat durability
  notes: Risk items focus on the durability of Heven’s claimed edge, not on generic market risk. Severity reflects how directly the threat can compress procurement or mission differentiation in 2026.
