        - Public program goal is organic hydrogen generation with improved mobility and solar-supported off-grid production
        - Trailer is still in prototype refinement and government evaluation, not proven scaled field service
      - - Government buyer procurement simplification
        - New UAS categories often die in testing or procurement friction before deployment
        - Blue UAS Select, Army BOA, and SupplyCore reseller path around Z1
