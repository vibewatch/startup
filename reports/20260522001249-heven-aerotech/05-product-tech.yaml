  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / requirement
      - Public status
      - Scope
      - Gap
    rows:
      - - Blue UAS Select + Authority to Operate
        - Achieved for Z1 through Zepher Flight Labs
        - DoD cybersecurity, supply-chain, and mission-readiness qualification for federal users
        - Evidence applies to Z1, not the whole Heven catalog
      - - Army BOA contract vehicle
        - Effective January 2026
        - Enables procurement of Z1 and associated hydrogen generation systems through Army pathway
        - Contract vehicle proves access, not disclosed order value, fleet size, or sustainment outcomes
      - - FCC 2026 covered-list treatment of foreign UAS / components
        - Active regulatory constraint with Blue UAS / domestic exceptions through Jan. 1, 2027
        - Makes trusted supply-chain status material to U.S. procurement eligibility
        - Heven does not publicly disclose full component-country map or exemption mechanics by subsystem
      - - FAA Part 107 waiver process
        - Civil BVLOS, altitude, controlled-airspace, and certain other operations still require waiver support when outside standard rules
        - Relevant to commercial and public-safety expansion outside DoD pathways
        - No retained source shows a Heven-specific FAA waiver, exemption, or type-certificate grant
      - - Domestic manufacturing / NDAA alignment
        - Heven and third-party Blue UAS coverage describe NDAA-compliant and U.S.-built positioning; Mach partnership adds domestic production capacity
        - Important for procurement trust and reduced reliance on foreign systems
        - Public evidence still stops short of a complete supplier bill of materials or component-origin disclosure
      - - Reliability / quality disclosure
        - No public MTBF, dispatch reliability, maintenance interval, or failure-rate disclosure found
        - Needed to evaluate fleet-scale readiness beyond demo milestones
        - Quality maturity is still inferred from procurement wins, not measured by published service data
      - - Export / allied-sales pathway
        - Allied-production intent is mentioned in Mach partnership materials
        - Could matter for international growth and sovereign production models
        - No public BIS / DDTC classification or license pathway was identified for Heven platforms
    notes: >-
      This table separates U.S. defense procurement readiness from broader product readiness. Passing trusted-procurement gates is not the same thing as disclosing reliability, exportability, or civil-operating approvals.
