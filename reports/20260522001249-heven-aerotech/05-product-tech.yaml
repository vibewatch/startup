  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Airframe + VTOL body
        - Provides runway-independent launch, recovery, and mission envelope
        - Zepher VTOL/lightweight engineering influences future modular fleet design
        - Public sources do not disclose structural margins, maintainability intervals, or crash-rate data
      - - Hydrogen fuel-cell powertrain
        - Extends endurance beyond battery-only flight while lowering acoustic / thermal signature versus combustion
        - Depends on hydrogen storage, fuel-cell subsystem reliability, and safe field handling
        - Public documents do not disclose fuel purity needs, refill cycle time, or lifecycle cost per sortie
      - - Payload / avionics modularity
        - Allows ISR, communications, logistics, or other mission kits to be swapped by role
        - Depends on standardized mounts, power budgets, radios, and avionics integration
        - Public product pages market modularity but do not publish one canonical interface specification
      - - Ground hydrogen generation / refueling layer
        - Keeps long-endurance systems operating without relying only on battery swaps or convoyed fuel
        - Depends on HyTEC trailer maturity, mobility, solar input, partner execution, and operator training
        - Still prototype-stage publicly; no output-rate, uptime, or refuel-throughput metrics are disclosed
      - - Autonomy / software / communications layer
        - Supports mission planning, onboard decision support, cloud / defense software, and future quantum-enabled features
        - Depends on internal software teams, radios, cloud systems, and cybersecurity compliance
        - Product pages under-document the software stack; hiring is stronger evidence than published architecture detail
      - - Manufacturing / supplier network
        - Enables scale-up, domestic delivery, and subcomponent production
        - Depends on Mach Forge capacity plus co-developed avionics, radios, fuel sources, and propulsion components
        - Component and supplier dependence can slow production or certification if partners slip
    notes: >-
      Architecture rows combine official product, hiring, and partner materials. The table intentionally separates what is clearly public from what is still under-documented.
