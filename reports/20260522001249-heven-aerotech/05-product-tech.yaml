  - id: hydrogen-operating-model-and-modularity
    title: Hydrogen Operating Model and Modularity
    body: >-
      Heven’s differentiation is easiest to understand as an operating model that combines hydrogen propulsion, modular payload architecture, and an increasingly explicit field-energy stack. The airframes are marketed around fuel-cell endurance, VTOL flexibility, and modularity: official pages describe hydrogen power, modular payload integration, runway independence, and mission adaptability across ISR, logistics, and emergency-response use cases. The public record also shows that Heven wants the ground side of the system to matter as much as the aircraft side. The Army BOA explicitly covers not only Z1 aircraft but associated hydrogen generation systems, while the HyTEC program is moving a hydrogen generation trailer toward field-ready prototyping and operational evaluation with expanded solar capacity, mobility improvements, and an easier operator experience. That means Heven’s real product architecture has at least five layers: aircraft body, hydrogen storage and fuel-cell propulsion, payload and avionics modules, ground hydrogen generation/refueling equipment, and the software / autonomy / communications layer needed for defense deployment. The software layer is only partially public, but the current hiring surface is revealing: Heven is publicly recruiting AI/ML, cloud defense software, quantum, hydrogen production, fuel-cell, composite, and production-engineering talent across multiple U.S. locations. Zepher Flight Labs adds another important architectural input because the acquisition explicitly brought lightweight, field-repairable VTOL engineering and a more modular 24/7 fleet concept into Heven’s stack. At the same time, one of the chapter’s central risks comes directly from the same architecture: public sources still do not disclose refuel cycle times, hydrogen purity requirements, delivered-fuel cost, safety procedures, or detailed subsystem BOMs, so the hydrogen workflow is directionally compelling but technically under-documented.
