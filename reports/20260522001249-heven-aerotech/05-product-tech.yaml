    body: >-
      Blue UAS Select plus ATO, the Army BOA, and a documented 12,000-foot test campaign give Z1 a much stronger public maturity profile than Raider, H2D55, HyTEC, H100, or Urban.
    claimRefs:
      - CE011
      - CE013
      - CE014
      - CE017
      - CE018
  - calloutType: risk
    title: The biggest technical risk is hydrogen logistics, not hydrogen flight itself
    body: >-
      Flight endurance has public proof, but field hydrogen generation, refueling throughput, cost, safety process, and maintenance burden remain under-documented. That means the hard scaling problem may sit on the ground side of the system rather than in the aircraft brochure.
    claimRefs:
      - CE019
      - CE021
      - CE022
      - CE023
      - CE039
