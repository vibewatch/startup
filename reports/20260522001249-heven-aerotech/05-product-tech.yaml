    title: Product module / asset matrix
    columns:
      - Product / asset
      - Primary user / job
      - Public status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Z1 / H2D250
        - Defense, public safety, ISR, austere overwatch
        - Most mature public platform; product page, Blue UAS Select, Army BOA, and 12,000-foot demo all visible
        - Group 2 VTOL hydrogen UAS with >10h endurance, low signature, fast setup, modular payload framing
        - Public specs are not fully harmonized across Z1-H2D250 and H2D250 pages; need one canonical production datasheet
      - - Raider
        - Contested logistics, heavier lift-and-deliver, battlefield resupply
        - Marketed and tied to Mach production plan, but current public field proof is thinner than Z1
        - 50 lb payload, 12+h endurance, modular payloads, AI/autonomy messaging, longer logistics reach
        - Need named deployment proof, reliability metrics, and support concept beyond marketing copy
      - - H2D55
        - Persistent hover, precision aerial tasks, fixed-site overwatch
        - Officially active product page and included in Mach production narrative; limited recent proof beyond marketing/spec surface
        - Endurance multirotor role with rapid refueling and lower-noise hydrogen positioning
        - Need current flight-test, customer, and maintenance evidence
      - - HyTEC hydrogen generation trailer
        - Field energy teams, deployed units, hydrogen resupply for UAS and related systems
        - Prototype refinement / demo / evaluation stage rather than fully fielded commercial product
        - Organic off-grid hydrogen generation with solar expansion, mobility improvements, and user-experience redesign
        - Need output rate, purity, refuel-cycle time, operating cost, and safety-process disclosure
      - - H100
        - Heavy lift and larger-payload missions
        - Product page still live and Mach cites production, but current 2025-2026 procurement proof is sparse
        - 70 lb useful payload and GPS-denied / modularity marketing on official surfaces
        - Need current deployments, certification path, and customer references
      - - Urban
        - Logistics, defense, and industrial inspection adjacencies
        - Product page still live, but no retained 2025-2026 deployment or qualification proof
        - Rugged multi-mission platform for harsh conditions on official page
        - Need evidence that Urban remains an active roadmap priority rather than a legacy page
    notes: >-
      Rows reflect only retained official 2026-accessible surfaces and linked proof. Atlas is intentionally excluded because no current retained official Atlas page or 2025-2026 proof surfaced in this chapter’s fetch set.
