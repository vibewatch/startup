figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Evidence-backed architecture from hydrogen airframes through ground fuel support and trusted deployment layers.
    data:
      layers:
        - label: Air vehicle family
          detail: Current official surfaces show a hydrogen lineup centered on Z1/H2D250, Raider, H2D55, with H100 and Urban still visible as adjacent pages.
          items:
            - Z1 / H2D250 — compact tactical ISR VTOL
            - Raider — heavier logistics / lift-and-deliver platform
            - H2D55 — endurance multirotor for hover-heavy tasks
            - H100 / Urban — adjacent official pages with thinner current proof
        - label: Hydrogen propulsion and storage
          detail: Endurance thesis depends on onboard hydrogen fuel-cell power rather than battery-only flight.
          items:
            - Fuel-cell endurance framing across official pages
            - Low acoustic / thermal signature positioning
            - Rapid refueling narrative versus battery swap cycles
        - label: Payload and mission modularity
          detail: Heven markets the family as modular and mission-adaptable rather than single-purpose.
          items:
            - ISR payloads and surveillance roles
            - Communications / sensor secondary-slot framing on Z1
            - Logistics and resupply mission kits on Raider
        - label: Ground hydrogen support stack
          detail: HyTEC and associated hydrogen generation systems indicate a separate field-energy product layer.
          items:
            - Hydrogen generation trailer in prototype refinement
            - Solar-assisted off-grid production concept
            - Mobility and operator-experience redesign work
        - label: Trusted deployment and scaling layer
          detail: Product delivery depends on qualification, procurement channels, and software / talent depth as much as on the airframe.
          items:
            - Blue UAS Select + ATO for Z1
            - Army BOA + SupplyCore reseller path
            - Hiring across AI/ML, cloud defense, fuel-cell, quantum, composites, and production
    approximationNotes: >-
      Public sources describe the stack at a systems level, not at subsystem schematic depth. No retained source publishes a full electrical, thermal, or refueling architecture.
