  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: spec-clarity
      missingEvidence: A single current datasheet or engineering release that reconciles Z1 / H2D250 endurance, payload, and naming conventions across official pages.
      whyItMatters: Buyers and investors need one authoritative baseline before judging payload-range tradeoffs, certification scope, and production readiness.
      diligencePath: Request the latest canonical configuration sheet, revision history, and explanation of whether Z1 and H2D250 are one product, one variant family, or a legacy/current naming overlap.
      relatedQuestionRefs:
        - QE003
        - QE025
      relatedTableRefs:
        - TE001
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Public or diligence-room data on MTBF, dispatch reliability, maintenance interval, failure modes, and spare-parts / field-service requirements.
      whyItMatters: Demo success and procurement access do not prove fleet readiness if uptime, maintenance burden, or repair cycle times are still unknown.
      diligencePath: Request fleet reliability dashboards, maintenance manuals, warranty claims, and field-service statistics by platform.
      relatedQuestionRefs:
        - QE018
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: hydrogen-logistics
      missingEvidence: Trailer output rate, hydrogen purity, refuel-turnaround time, delivered-fuel cost, storage method, and operating safety procedures for HyTEC or related refueling systems.
      whyItMatters: The business case for hydrogen endurance can break down if the ground-side fuel workflow is slow, expensive, or operator-intensive.
      diligencePath: Request HyTEC performance reports, hydrogen-generation throughput testing, safety SOPs, and cost-per-sortie modeling.
      relatedQuestionRefs:
        - QE019
        - QE020
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: material
      topic: civil-readiness
      missingEvidence: A named Heven-specific FAA waiver, exemption, airworthiness determination, or other civil-operating approval tied to long-endurance missions.
      whyItMatters: Civil expansion is still hypothetical if endurance advantages cannot be translated into repeatable airspace approvals.
      diligencePath: Request the company’s waiver inventory, approval letters, operational limitations, and status of any ongoing FAA applications.
      relatedQuestionRefs:
        - QE021
        - QE022
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: export
      missingEvidence: Public BIS / DDTC classification, export-license posture, or sovereign-production governance for Heven systems sold to U.S. allies.
      whyItMatters: Exportability affects market size, ally demand, and whether international production claims are operationally realistic.
      diligencePath: Request ECCN / USML analysis, export-counsel memo, and any prior license approvals or denials for Heven platforms or critical subsystems.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: minor
      topic: portfolio-status
      missingEvidence: Management clarification on whether H100, Urban, and any legacy Atlas family remain active roadmap priorities or are simply legacy pages retained on the site.
      whyItMatters: Investors should not overcount breadth if some product pages reflect legacy catalog history rather than active go-to-market focus.
      diligencePath: Request the current SKU list, roadmap status by platform, and which programs have active manufacturing, customer pilots, or procurement vehicles.
      relatedQuestionRefs:
        - QE001
        - QE006
      relatedTableRefs:
        - TE001
