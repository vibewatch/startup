  topStrengths:
    - >-
      Heven has a differentiated endurance story: the Z1 is positioned as the only hydrogen-powered drone on Blue UAS
      Select, and the platform is publicly tied to 10+ hour / 600+ mile mission specs plus a 12,000-foot
      density-altitude test milestone.
    - >-
      Defense-access milestones are real: Blue UAS Select, the January 2026 Army BOA pathway, and reseller-channel
      expansion through SupplyCore and NextTech materially reduce procurement friction versus an unknown cold-start
      vendor.
    - >-
      The December 2025 Series B provides meaningful capital to expand U.S. manufacturing, hydrogen-logistics
      infrastructure, and advanced autonomy / communications programs while the company scales its leadership bench.
  topRisks:
    - >-
      Procurement access is not the same as contracted demand: the Army BOA is not backlog, no task orders or order
      values are public, and the thesis breaks if trusted-access signals do not turn into funded repeat programs.
    - >-
      Operating economics remain opaque: public sources do not disclose revenue, gross margin, burn, runway, backlog,
      customer concentration, or current headcount, which forces valuation and risk judgments to stay scenario-based.
    - >-
      Hydrogen execution adds a second complexity curve through field generation, transport, refueling, safety
      compliance, and reliability requirements that are still only partially proven in public evidence and may be
      capital intensive.
  unresolvedGaps:
    - >-
      Need monthly revenue, backlog, gross-margin, burn, and runway bridges to determine whether the Series B actually
      bought enough time to reach funded-order proof.
    - >-
      Need BOA task-order history, top-customer mix, current customer count, and repeat-order or retention metrics to
      separate procurement access from durable adoption.
    - >-
      Need independent reliability, manufacturing-readiness, and HyTEC field-performance data to test whether hydrogen
      support systems work economically and repeatably in deployed conditions.
