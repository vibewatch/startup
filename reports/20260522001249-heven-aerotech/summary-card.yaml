summary:
  headline: >-
    Heven AeroTech has credible strategic momentum in hydrogen UAS through Blue UAS Select, an Army BOA, and a fresh
    $100 million Series B, but the public record still lacks the revenue, backlog, and reliability proof needed to
    comfortably underwrite the current $1 billion financing anchor.
