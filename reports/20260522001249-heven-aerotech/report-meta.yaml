companyProfile:
  summary: >-
    Heven AeroTech is a 2019-founded hydrogen UAS company with Israeli roots and a current U.S.
    base in Sterling, Virginia. After rebranding from Heven Drones and acquiring Zepher Flight
    Labs, the company has centered its story on long-endurance, runway-independent aircraft plus
    the hydrogen-generation and refueling systems needed to keep them operating in austere
    environments. Its most credible public milestones are the Z1's Blue UAS Select approval, the
    January 2026 Army Basic Ordering Agreement pathway, and a December 2025 $100 million Series B
    at a $1 billion valuation. The opportunity is real, but public evidence still describes Heven
    more as a strategically positioned access story than a financially disclosed scaling business.
  foundedDate: "2019-01-01"
  founders:
    - name: Bentzion Levinson
      role: Founder & CEO
      background: >-
        Links Heven's origin story to 2018 Gaza fire-kite and drone threats and to later IDF
        reserve combat experience.
      claimRefs: [CO001, CO009]
  foundingLocation: Israel
  headquarters: Sterling, Virginia, USA
  productSummary: >-
    Heven sells hydrogen-powered, runway-independent unmanned aircraft and related support systems.
    The current lineup centers on the Z1 / H2D250 long-endurance tactical platform, Raider heavy
    lift aircraft, H2D55 endurance multirotor, and hydrogen generation / refueling equipment such
    as HyTEC-style field support systems.
  customerFocus: >-
    Primary focus is defense, national security, and public-safety operators, with commercial and
    humanitarian missions discussed as secondary adjacencies rather than the clearest current proof
    base.
  businessModel: >-
    The visible monetization stack appears to combine aircraft sales, hydrogen-support equipment,
    integration or sustainment work, and advanced-systems modules, distributed through direct
    government procurement pathways and channel partners such as SupplyCore and NextTech.
  stage: Series B
  fundingStatus: >-
    Raised a $100 million Series B at a $1 billion valuation in December 2025, led by IonQ with
    Texas Venture Partners participating as a returning investor. PitchBook-linked coverage cited
    roughly $115.2 million of lifetime capital, but exact cumulative capitalization and round terms
    are not fully disclosed publicly.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO015, CO018, CO019, CO024, CO025, CI031]
summary:
  headline: >-
    Heven AeroTech has credible strategic momentum in hydrogen UAS through Blue UAS Select, an Army
    BOA, and a fresh $100 million Series B, but the public record still lacks the revenue, backlog,
    and reliability proof needed to comfortably underwrite the current $1 billion financing anchor.
  overallScore: 6.1
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 115.2
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Heven has a differentiated endurance story: the Z1 is positioned as the only hydrogen-powered
      drone on Blue UAS Select, and the platform is publicly tied to 10+ hour / 600+ mile mission
      specs plus a 12,000-foot density-altitude test milestone.
    - >-
      Defense-access milestones are real: Blue UAS Select, the January 2026 Army BOA pathway, and
      reseller-channel expansion through SupplyCore and NextTech materially reduce procurement
      friction versus an unknown cold-start vendor.
    - >-
      The December 2025 Series B provides meaningful capital to expand U.S. manufacturing,
      hydrogen-logistics infrastructure, and advanced autonomy / communications programs while the
      company scales its leadership bench.
  topRisks:
    - >-
      Procurement access is not the same as contracted demand: the Army BOA is not backlog, no task
      orders or order values are public, and the thesis breaks if trusted-access signals do not turn
      into funded repeat programs.
    - >-
      Operating economics remain opaque: public sources do not disclose revenue, gross margin, burn,
      runway, backlog, customer concentration, or current headcount, which forces valuation and risk
      judgments to stay scenario-based.
    - >-
      Hydrogen execution adds a second complexity curve through field generation, transport,
      refueling, safety compliance, and reliability requirements that are still only partially proven
      in public evidence and may be capital intensive.
  unresolvedGaps:
    - >-
      Need monthly revenue, backlog, gross-margin, burn, and runway bridges to determine whether the
      Series B actually bought enough time to reach funded-order proof.
    - >-
      Need BOA task-order history, top-customer mix, current customer count, and repeat-order or
      retention metrics to separate procurement access from durable adoption.
    - >-
      Need independent reliability, manufacturing-readiness, and HyTEC field-performance data to
      test whether hydrogen support systems work economically and repeatably in deployed conditions.
