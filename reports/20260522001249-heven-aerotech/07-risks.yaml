- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - DoD concentration / BOA not converting
    - Funded order evidence
    - No disclosed funded Army or adjacent DoD orders of meaningful scale by 1H2027
    - Treat defense access as non-monetizable signal and reset valuation framework
  - - Hydrogen logistics not proving out
    - Field support proof
    - No public demonstration of repeatable refuel logistics, uptime, and deployability beyond prototype or marketing stage by 1H2027
    - Assume endurance advantage is tactically interesting but commercially narrow
  - - Trusted-supply / export regime hardens
    - Compliance window
    - FCC exemption narrows, export path stays unclear, or core configuration needs redesign for trusted-source eligibility
    - Pause aggressive allied-sales or scale assumptions until configuration and license path are clear
  - - Manufacturing quality opacity persists
    - Scale-readiness proof
    - No public or diligence-confirmed quality certification, throughput, and acceptance-test data before next major growth spend
    - Do not underwrite volume scale or gross-margin improvement
  - - Commercial diversification stalls
    - Civil-adoption proof
    - Part 108 timing improves but Heven still shows no civilian waivers, paying commercial customers, or repeat deployments by 2027
    - Model company as defense-only rather than dual-market
  - - Autonomy governance tightens
    - Policy or customer review event
    - Customer or regulator requires restrictions that materially reduce advertised autonomy value or delay delivery
    - Discount autonomy upside and raise program-friction assumptions
  - - Capital intensity outruns orders
    - Financing event
    - Company needs additional capital before funded-order conversion or quality proof is visible
    - Treat new money as defensive bridge capital, not acceleration capital
  - - Serious hydrogen or flight safety event
    - Incident threshold
    - Major hydrogen handling incident, persistent field reliability failure, or public fleet grounding event
    - Move to thesis-break unless root cause and correction are independently verified
  notes: Thresholds are intentionally binary and monitorable so the investor can distinguish between reversible execution noise and real thesis impairment.
