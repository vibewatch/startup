  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-classification
    missingEvidence: Commodity classification records, export-counsel memo, and any DDTC/BIS license history for Heven airframes, software, and technical data.
    whyItMatters: Without a disclosed jurisdiction and license path, allied-sales timing and configuration flexibility cannot be underwritten confidently.
    diligencePath: Request ECCN or jurisdiction matrix by product, technical-data handling policy, and all pending or completed export-license filings.
    relatedQuestionRefs:
    - QR012
    - QR032
  - type: private-evidence-only
    severity: material
    topic: hytec-field-maturity
    missingEvidence: Independent field results for hydrogen generation rate, refuel throughput, uptime, purity, and operator burden for HyTEC or equivalent support systems.
    whyItMatters: Heven’s endurance moat depends on hydrogen support working in austere conditions, not just on aircraft specifications.
    diligencePath: Request test reports, government evaluation results, and operator SOPs for field hydrogen generation and refueling.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: fleet-reliability
    missingEvidence: Fleet MTBF, maintenance intervals, failure modes, warranty returns, grounding events, and hydrogen-handling incident logs.
    whyItMatters: Reliability determines whether long endurance translates into repeat demand instead of expensive field support.
    diligencePath: Request reliability dashboards, service bulletins, and maintenance man-hour assumptions by platform.
    relatedQuestionRefs:
    - QR017
    - QR032
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: manufacturing-readiness
    missingEvidence: Quality certifications, throughput data, acceptance-test yield, supplier concentration map, and delivery cadence metrics.
    whyItMatters: The valuation and procurement narrative assumes manufacturing readiness that public evidence does not yet prove.
    diligencePath: Request AS9100 status, factory KPIs, lower-tier supplier map, and recent acceptance or rejection data.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: financial-visibility
    missingEvidence: 2026 revenue, burn, backlog, runway, and repeat-order data tied to named programs or customer cohorts.
    whyItMatters: Without this data, investors cannot distinguish a promising access story from a de-risked scaling business.
    diligencePath: Request board package KPI bridge, monthly cash-burn history, contracted backlog, and order conversion funnel.
    relatedQuestionRefs:
    - QR028
    - QR032
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-register-completeness
    missingEvidence: Company-specific disclosure on civil waivers, export filings, insurance posture, and any enforcement or incident history affecting top legal risks.
    whyItMatters: The public risk register can identify the governing frameworks, but it cannot confirm which approvals or interactions Heven has already completed.
    diligencePath: Request regulatory tracker covering FAA waivers, export filings, safety reviews, and any notable incident or enforcement correspondence.
    relatedQuestionRefs:
    - QR004
    - QR032
    relatedTableRefs:
    - TR001
