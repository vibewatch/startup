company:
  name: Heven AeroTech
chapter:
  number: 7
  title: Risks
  summary: 'Heven AeroTech''s risk profile is dominated by the seam between policy access and real orders: Blue UAS Select, an Army BOA, and a $100 million Series B improve credibility, but they do not resolve FAA civil-airspace uncertainty, export and trusted-sourcing controls, hydrogen logistics, or proof of funded repeat demand. The top underwriting risk is that the company fails to convert defense access into funded programs before hydrogen field reliability, compliance burden, and commercialization windows are independently validated.'
sections:
- id: legal-regulatory-and-export-risk
  title: Legal, Regulatory, and Export Risk
  body: 'Heven AeroTech''s highest structural risk is that strong defense access signals can be mistaken for broad legal clearance. They are not the same thing. In the civil airspace layer, FAA materials still treat long-endurance commercial drone operations as constrained by Part 107, with waivers required for visual line-of-sight departures, certain airspace, and operating limitations. The FAA''s own BVLOS materials and the 2025-2026 BVLOS rulemaking record say the agency was still trying to create a predictable path for routine, scalable advanced operations. That matters because Blue UAS Select status helps trusted federal procurement, but it does not replace FAA authorization for civilian BVLOS, controlled-airspace, or other advanced missions. If Heven wants a meaningful commercial wedge beyond defense and public safety, routine civil operability remains a gating variable rather than a solved issue.


    Export and trusted-sourcing risk is the second leg of the same problem. BIS says exporters still need to classify items under the EAR, and its January 2026 drone rule only loosened controls for narrower civil cases rather than eliminating export friction for longer-endurance or military-adjacent systems. The FCC Covered List now reaches foreign-country UAS and critical components, with Blue UAS and domestic-end-product carve-outs only lasting through January 1, 2027 under the current notice. DIU and the White House both frame secure sourcing as an active policy project, not a static checkbox. Heven benefits from that trend today because it is positioned as a domestic trusted alternative, but the same policy volatility can create redesign, re-sourcing, documentation, and licensing burden if subsystems, technical data, or allied shipments fall outside the narrow safe harbor. The critical diligence gap is that no retained public source discloses Heven''s actual ECCN or any public export-license
    path for its airframes, autonomy stack, or technical data.'
