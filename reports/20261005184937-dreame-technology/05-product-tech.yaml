callouts:
  - calloutType: "insight"
    title: "Modular Reuse of Motor and Perception IP Across Divergent Product Lines"
    body: "Dreame's engineering strategy leverages a shared R&D core—specifically high-speed brushless digital motors and binocular vision algorithms—across seemingly disparate product categories. The same motor competencies developed for high-end robot vacuums power hair dryers and wet-dry floor scrubbers, while perception algorithms developed for floor navigation inform window cleaners, robotic lawn mowers, and experimental humanoid prototypes."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE010"
  - calloutType: "risk"
    title: "R&D Dilution and Capital Strain from Speculative Automotive Ventures"
    body: "Between 2024 and 2026, Dreame channeled significant resources and municipal guidance capital into speculative non-core ventures, including electric vehicles (Dreame Auto) and smartphones. By mid-2026, severe headcount reductions of up to 75% in the automotive unit and mounting supplier debts demonstrated the technical and financial hazards of over-diversification, prompting retrenchment back to core domestic robotics."
    claimRefs:
      - "CE015"
      - "CE016"
