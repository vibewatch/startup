    type: flow
    summary: >-
      A qualitative underwriting chain shows why evidence of scale does not yet support the reported valuation
      references.
    data:
      nodes:
        - id: scale-signal
          label: Scale signal
          detail: Reported Q1 2026 category leadership and a broad product footprint establish commercial relevance.
        - id: pricing-signal
          label: Pricing signal
          detail: A large event discount makes realized price and gross-margin durability a required diligence item.
        - id: capital-signal
          label: Capital signal
          detail: Historical rounds and government-backed funds show access to capital, not cash availability.
        - id: preference-risk
          label: Preference risk
          detail: Reported anti-dilution mechanics and fund obligations may change the common-equity outcome.
        - id: valuation-gap
          label: Valuation gap
          detail: Audited operating results, net debt, fully diluted ownership, and transaction terms are absent.
        - id: decision
          label: Research more
          detail: Withhold price endorsement and return targets until the missing primary evidence is obtained.
      edges:
        - from: scale-signal
          to: pricing-signal
        - from: pricing-signal
          to: capital-signal
        - from: capital-signal
          to: preference-risk
        - from: preference-risk
          to: valuation-gap
        - from: valuation-gap
          to: decision
    approximationNotes: The sequence is qualitative and does not imply a numerical score, probability, or conversion rate.
    claimRefs:
