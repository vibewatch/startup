  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis evidence
      - Anti-thesis or uncertainty
      - What would change the view
    rows:
      - - Category scale
        - Independent reporting attributes Q1 2026 global robotic-vacuum sales leadership to IDC
        - The assigned evidence gives no audited revenue or profit denominator
        - Audited segment revenue and contribution margin
      - - Portfolio breadth
        - The official site displays categories beyond floorcare
        - Breadth can add addressable market or increase execution complexity
        - Segment-level growth, return rates, and capital allocation
      - - Channel support
        - Moneycontrol reports service coverage across more than 165 Indian cities
        - The statement is attributed to the company and does not measure utilization or cost
        - Independent service-level and repeat-purchase data
      - - Pricing
        - A broad product ladder may address multiple customer budgets
        - One sale cut a listed model from Rs 39,999 to Rs 22,999
        - Non-promotional realized price and gross-margin history
      - - Capital access
        - Historical rounds and government-backed funds indicate access to external capital
        - Commitments are not cash available, and reported preference mechanics may dilute investors
        - Paid-in capital reconciliation and fully diluted waterfall
      - - Exit
        - A Hong Kong IPO at about 70 billion yuan is reported as being prepared
        - No prospectus, firm timetable, or investor-class liquidity waterfall is in the evidence
        - Accepted filing, adviser confirmation, and clean legal diligence
    notes: The table separates observed or reported signals from the private evidence required to make them investable.
