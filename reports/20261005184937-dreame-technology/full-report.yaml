        title: Trajectory and current risk signals
        blocks:
          - type: paragraph
            body: >-
              Dreame entered 2026 with meaningful commercial momentum: London Insider, citing IDC, reported it as the
              largest robotic-vacuum maker by sales in the first quarter. That signal is stronger than a generic
              market-presence claim but remains an outlet's report of a consultancy result, not audited company revenue.
