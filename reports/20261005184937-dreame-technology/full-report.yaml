  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Category leadership persists, portfolio breadth converts to audited cash generation, and IPO terms are clean
        - No range assigned; the reported 70 billion yuan IPO mark is a reference, not validated fair value
        - Promotional intensity, diversification cost, and preference dilution
        - Upgrade only after audited margins, cash flow, and a credible listing filing
      - - Base
        - Dreame remains a scaled private hardware company, but financial and capitalization disclosure stays incomplete
        - No range assigned; value must be rebuilt from audited results and fully diluted ownership
        - Opaque profitability, uncertain exit timing, and governance complexity
        - Current working case while the key evidence gaps remain open
      - - Bear
        - >-
          Government-capital availability tightens, the IPO is delayed, or a valuation reset activates adverse
          preference economics
        - No floor assigned; public evidence does not establish liquidation value or downside protection
        - Dilution, liquidity stress, pricing pressure, and capital-provider retrenchment
        - Escalates if the IPO process is withdrawn or fund obligations are not met
    notes: >-
      No probabilities, valuation ranges, or return estimates are calculated because the required operating and
      capitalization inputs are absent.
