      - number: '1.3'
        title: Capital, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              The clearest financing event is the October 2021 Series C: Wikipedia reports $563 million, while Tracxn
              reports $578 million of total funding across four rounds. These are different metrics and should not be
              merged into one figure. Reported backers include Xiaomi, Yunfeng Capital, Shunwei Capital, IDG Capital,
              and China Renaissance Group, but no retained source provides a current cap table, ownership percentages,
              debt schedule, or cash balance. Scale indicators are also unstable. Tracxn reports 1,080 employees as of
              March 31, 2026, while WealthRank lists 5,000 employees as of October 4, 2026; scope, legal-entity
              coverage, and methodology are undisclosed. A reported Hong Kong IPO valuation of about CNY 70 billion is
              an IPO-planning datapoint, not a verified current private valuation.
