  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacency discipline
        blocks:
          - type: paragraph
            body: >-
              The investable core market is consumer robotic floor-care hardware: robot vacuums and vacuum-mop
              combinations purchased by households to automate recurring cleaning. Dreame's own storefront places robot
              vacuums beside wet-and-dry vacuums, cordless sticks, window and upholstery cleaners, while also listing
              beauty, air-care, kitchen, large-appliance, garden, and smart-home products. Those broader categories may
              create distribution or technology adjacencies, but combining them with robotic floor care would overstate
              the addressable market because their jobs, replacement cycles, and purchase budgets differ. The broad
              vacuum-cleaner forecast is therefore a contextual ceiling rather than Dreame's TAM. A disciplined sizing
              ladder moves from global vacuum hardware to robotic floor care, then premium smart cleaning, reachable
              channels, and finally company sell-through; the available evidence quantifies only selected outer and
              company-reported layers.
            claimRefs:
              - CM001
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing and company reach
        blocks:
          - type: paragraph
            body: >-
              Accio reports global vacuum-cleaner revenue rising from USD 21.76 billion in 2023 to USD 25.87 billion in
              2029 and separately cites a USD 35.37 billion projection for 2033. Its fetched text does not expose the
              underlying publisher methodology, geography reconciliation, or category definitions, so these values
              should be treated as directional broad-market estimates rather than a reconciled forecast series.
              Company-issued releases claim that Dreame ranked first globally in Q1 2026 robot-vacuum sales volume and
              revenue, operated in more than 120 countries through over 6,500 retail locations, and had shipped more
              than 11 million cumulative units. These indicators establish reach and reported leadership, not market
              size: rank, footprint, and cumulative shipments cannot be converted into current revenue share without
              category totals, period sell-through, ASPs, returns, and channel inventory.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, channels, drivers, and adoption friction
        blocks:
          - type: paragraph
            body: >-
              The primary buyer, payer, and user is the household, with the clearest reported target comprising busy or
              technology-oriented consumers who value automated cleaning. Online discovery and conversion are
              increasingly important: Accio projects online vacuum sales reaching 50.1% of the global market by 2028,
              while Dreame's official site combines country-specific online shopping with a "Where to Buy" path and the
              company claims a large physical retail footprint. Adoption is supported by convenience, premium smart-home
              demand, and reported European momentum, including a company-claimed 110% year-over-year sales increase for
              January-April 2026. Friction remains product-specific: Accio's summarized review analysis flags
              navigation, getting stuck, and connectivity as robot-vacuum complaints, while battery life and suction
              recur in adjacent cordless categories. The source does not disclose review sample sizes, so the
              percentages are signals, not population estimates.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Constraints, contradictions, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Market growth alone does not remove execution and capital-allocation risk. The assigned evidence
              simultaneously describes strong late-2025 Amazon sales-count momentum for robot vacuum-and-mop products
              and stagnant retail sales volumes, which is not a comparable channel-wide growth series. It also includes
              adverse reporting on scrutiny of Dreame-linked government-backed funds: a Caixin summary distinguishes
              roughly RMB 20 billion of commitments from less than RMB 7 billion paid in, while separate reporting
              describes a local-government exposure audit and tighter national fund oversight. These are not direct
              measures of consumer demand, but they matter to adoption timing and valuation if expansion depends on
              subsidized capacity, channel investment, or adjacent ventures. The proper underwriting stance is therefore
              to credit observable distribution and category momentum while discounting unsourced market-share
              extrapolations until sell-through, category denominator, cohort retention, and channel economics are
              disclosed.
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rank is not SOM
            body: >-
              A No. 1 rank and cumulative shipments do not reveal Dreame's current share of category revenue. Obtain
              regional robot-vacuum category totals, Dreame sell-through, ASPs, returns, and channel inventory before
              using a SOM in valuation.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: Channel mix is a key sensitivity
            body: >-
              The online-share forecast and Dreame's physical footprint imply a hybrid route to market, but the evidence
              does not disclose channel economics or regional mix.
            calloutType: insight
            claimRefs:
