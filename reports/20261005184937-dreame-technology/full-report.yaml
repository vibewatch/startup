      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Yu Hao is the only named executive consistently identified in the retained pool, with both Tracxn and
              Wikipedia describing him as founder and CEO. His earlier Tsinghua aerospace-makerspace work indicates
              technical founder-market fit, while his public role in setting an unusually broad strategic agenda also
              concentrates narrative and execution risk around one person. The available sources do not establish the
              current board, senior operating team, succession plan, committee structure, or governance rights of
              investors and government-linked funds. This is not evidence that those controls are absent; it is a
              private-company disclosure gap. Management references and the complete governance package are therefore
              required before relying on apparent founder continuity.
