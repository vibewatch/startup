chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Dreame is a private Chinese home-appliance manufacturer headquartered in Suzhou. Its commercial footprint
              began in floor care and now spans robot vacuums, wet-and-dry and cordless vacuums, personal-care devices,
              garden equipment, air care, kitchen appliances, large appliances, and smart-home products. That breadth
              makes the company more than a single-product robotics vendor, but the retained evidence does not disclose
              segment revenue or the economics of each category. The formation date is not settled: Tracxn and
              WealthRank report 2015, whereas Wikipedia identifies 2017 as the corporate founding year while separately
              describing Yu Hao as forming Dreame in Suzhou in 2015. The discrepancy may reflect an operating start
              versus formal incorporation and should be resolved from registration records rather than normalized away.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
          - type: table
            tableRef: TO001
