    notes: "Values mix broad-market forecasts, a channel-share forecast, rank, footprint, and cumulative company metrics; they are not additive and do not constitute TAM/SAM/SOM."
    claimRefs: [CM002, CM003, CM006, CM007, CM008]
  - id: TM003
    title: Segment and buyer adoption map
    columns:
      - Segment / channel
