      - Adoption trigger
      - Constraint or diligence issue
    rows:
      - ["Robot vacuum and mop", "Household; consumer user and payer", "Recurring floor cleaning; household appliance budget", "Automation, pet-hair removal, premium smart-home convenience", "Navigation, getting stuck, and connectivity complaints; sample size undisclosed"]
      - ["Cordless and wet-and-dry vacuum", "Household; consumer user and payer", "Manual floor and spot cleaning; household appliance budget", "Suction, lightweight design, and ease of use", "Battery-life and suction complaints; adjacent rather than core robot market"]
      - ["Online retail", "Household shopper; payer is the purchasing household", "Research, comparison, purchase, and support online", "Convenience, assortment, and projected channel-share growth", "Price transparency and promotion dependence are not quantified"]
      - ["Physical retail", "Household shopper; payer is the purchasing household", "Product discovery, demonstration, purchase, and service", "Dreame-reported network of more than 6,500 locations", "No store productivity, sell-through, or regional mix disclosed"]
    notes: "Buyer and friction signals come from Accio's summarized market and review analysis plus Dreame's official channel surfaces; review denominators and procurement evidence are unavailable."
    claimRefs: [CM003, CM008, CM009, CM010, CM011]
figures:
  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      Six nested analytical layers separate the broad appliance context from the company
      outcome that investors ultimately need to underwrite.
    data:
      nodes:
        - label: Broad home-appliance adjacency
          value: Not sized
          detail: Beauty, air, kitchen, large-appliance, garden, and smart-home categories are excluded from core robotic floor care.
        - label: Global vacuum-cleaner market
          value: USD 35.37B
          detail: 2033 broad-market projection from Accio; methodology is not exposed in the fetched text.
        - label: Robotic floor-care category
          value: Not disclosed
          detail: No absolute robot-vacuum category revenue is available in the assigned evidence.
        - label: Premium smart-cleaning segment
          value: Not disclosed
          detail: Company reporting attributes European growth to premium demand but gives no segment denominator.
        - label: Reachable channel footprint
          value: 120+ countries / 6,500+ locations
          detail: Company-issued June 2026 footprint; reach is not equivalent to active demand.
        - label: Realized Dreame outcome
          value: 11M+ cumulative units
          detail: Company-issued cumulative shipments; period sell-through, ASP, and inventory are unavailable.
    approximationNotes: "The layers are conceptual and not drawn to scale; unavailable values remain explicitly unsized, and no conversion between layers is implied."
    claimRefs: [CM003, CM004, CM007, CM016]
callouts:
  - calloutType: risk
    title: Rank is not SOM
    body: >-
      A No. 1 rank and cumulative shipments do not reveal Dreame's current share of
      category revenue. Obtain regional robot-vacuum category totals, Dreame sell-through,
      ASPs, returns, and channel inventory before using a SOM in valuation.
    claimRefs: [CM002, CM003]
  - calloutType: insight
    title: Channel mix is a key sensitivity
    body: >-
      The online-share forecast and Dreame's physical footprint imply a hybrid route to
      market, but the evidence does not disclose channel economics or regional mix.
    claimRefs: [CM003, CM008, CM011]
