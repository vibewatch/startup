callouts:
  - calloutType: risk
    title: Core identity is clear; corporate chronology is not
    body: >-
      Suzhou headquarters, private status, product focus, and founder leadership are
      consistent, but 2015 and 2017 founding dates should remain separate until legal
      registration records distinguish operating formation from incorporation.
    claimRefs: [CO001, CO002, CO003, CO004]
  - calloutType: recommendation
    title: Underwrite the entity perimeter, not the brand narrative
    body: >-
      Obtain the current group chart, audited headcount, cap table, government-fund
      exposure, debt schedule, and segment financials before treating reported scale,
      IPO value, or ecosystem breadth as attributable to the investable entity.
    claimRefs: [CO009, CO010, CO012, CO014, CO016]
