company:
  name: Dreame Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Dreame Technology is a private, Suzhou-based consumer-appliance company led by
    founder and CEO Yu Hao, with a broadening product portfolio and a last disclosed
    Series C financing in October 2021. The evidence also shows material uncertainty:
    sources conflict on the founding year and current headcount, while 2026 reporting
    raises governance, state-capital, service-quality, and diversification concerns.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Dreame is a private Chinese home-appliance manufacturer headquartered in Suzhou.
      Its commercial footprint began in floor care and now spans robot vacuums, wet-and-dry
      and cordless vacuums, personal-care devices, garden equipment, air care, kitchen
      appliances, large appliances, and smart-home products. That breadth makes the company
      more than a single-product robotics vendor, but the retained evidence does not disclose
      segment revenue or the economics of each category. The formation date is not settled:
      Tracxn and WealthRank report 2015, whereas Wikipedia identifies 2017 as the corporate
      founding year while separately describing Yu Hao as forming Dreame in Suzhou in 2015.
      The discrepancy may reflect an operating start versus formal incorporation and should
      be resolved from registration records rather than normalized away.
    claimRefs: [CO001, CO002, CO003, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Yu Hao is the only named executive consistently identified in the retained pool, with
      both Tracxn and Wikipedia describing him as founder and CEO. His earlier Tsinghua
      aerospace-makerspace work indicates technical founder-market fit, while his public
      role in setting an unusually broad strategic agenda also concentrates narrative and
      execution risk around one person. The available sources do not establish the current
      board, senior operating team, succession plan, committee structure, or governance rights
      of investors and government-linked funds. This is not evidence that those controls are
      absent; it is a private-company disclosure gap. Management references and the complete
      governance package are therefore required before relying on apparent founder continuity.
    claimRefs: [CO004, CO012, CO013]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, scale, and stakeholders
    body: >-
      The clearest financing event is the October 2021 Series C: Wikipedia reports $563 million,
      while Tracxn reports $578 million of total funding across four rounds. These are different
      metrics and should not be merged into one figure. Reported backers include Xiaomi,
      Yunfeng Capital, Shunwei Capital, IDG Capital, and China Renaissance Group, but no retained
      source provides a current cap table, ownership percentages, debt schedule, or cash balance.
      Scale indicators are also unstable. Tracxn reports 1,080 employees as of March 31, 2026,
      while WealthRank lists 5,000 employees as of October 4, 2026; scope, legal-entity coverage,
      and methodology are undisclosed. A reported Hong Kong IPO valuation of about CNY 70 billion
      is an IPO-planning datapoint, not a verified current private valuation.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO014]
    tableRefs: [TO003]
  - id: trajectory-and-current-risk-signals
    title: Trajectory and current risk signals
    body: >-
      Dreame entered 2026 with meaningful commercial momentum: London Insider, citing IDC,
      reported it as the largest robotic-vacuum maker by sales in the first quarter. That signal
      is stronger than a generic market-presence claim but remains an outlet's report of a
      consultancy result, not audited company revenue. Later reporting complicates the growth
      narrative. Caixin and London Insider described scrutiny of government-linked financing;
      Yu subsequently framed the strategy around four core areas. ChannelNews reported weak
      consumer-review signals and service complaints in Australia, while Carscoops and Wikipedia
      described sharp automotive layoffs or wind-down activity by August. Together, these events
      indicate a company refocusing after aggressive diversification, with execution quality,
      capital governance, and after-sales capacity requiring direct diligence.
    claimRefs: [CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
