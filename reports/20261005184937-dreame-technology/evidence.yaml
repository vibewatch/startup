evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, senior leadership bench, committee structure, succession plan, and investor governance
      rights.
    whyItMatters: >-
      Public evidence is concentrated on the founder, preventing assessment of functional depth, oversight, and
      key-person mitigation.
    diligencePath: >-
      Request the group organization chart, board materials, management biographies, committee charters, and management
      references.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited current headcount by legal entity plus current revenue, customer count, and complete operating-location
      metrics.
    whyItMatters: >-
      The 1,080 and 5,000 employee figures conflict, and unsupported scale metrics would distort operating and valuation
      analysis.
    diligencePath: >-
      Reconcile HRIS payroll records to the audited group perimeter and obtain finance-system revenue and customer
      extracts.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current fully diluted cap table, round documents, debt and credit agreements, cash balance, and fund-by-fund
      related-party exposure.
    whyItMatters: >-
      Funding raised, fund commitments, assets under management, and a reported IPO valuation have different
      denominators and do not establish liquidity or ownership.
    diligencePath: >-
      Obtain financing agreements, bank statements, debt schedules, shareholder register, and a legal-entity map
      reconciled to every government-linked vehicle.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founding
    missingEvidence: >-
      Authoritative incorporation record and an explanation of the 2015 operating-start versus 2017 corporate-founding
      dates.
    whyItMatters: A consistent legal chronology is necessary for entity diligence and milestone reuse in later chapters.
    diligencePath: Retrieve Chinese corporate-registration filings and reconcile them with the founder's operating-history narrative.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A current global and regional robot-vacuum revenue and shipment series with explicit category definitions and
      methodology.
    whyItMatters: >-
      Without the robot-vacuum denominator, the broad vacuum forecast cannot be converted into a defensible serviceable
      available market.
    diligencePath: >-
      Obtain IDC category extracts or another primary analyst dataset covering robot-vacuum revenue, units, geography,
      and forecast methodology.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-position
    missingEvidence: Dreame period sell-through, ASP, returns, channel inventory, and regional category-share data.
    whyItMatters: Rank, footprint, and cumulative shipments do not establish current revenue share or serviceable obtainable market.
    diligencePath: Request audited regional sell-through and channel inventory reconciled to IDC category totals and company revenue.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Representative household segmentation, willingness-to-pay, replacement-cycle, and purchase-funnel evidence by
      geography.
    whyItMatters: Buyer labels and review summaries do not quantify the premium segment or adoption timing.
    diligencePath: >-
      Commission region-stratified consumer research and validate it against retailer cohort, return, and
      repeat-purchase data.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      Underlying publishers, category taxonomies, and calculation methods for Accio's 2023-2029 and 2033 global vacuum
      forecasts.
    whyItMatters: The two forecast statements may use different scopes and should not be treated as one coherent series.
    diligencePath: >-
      Acquire the cited analyst reports and reconcile geography, nominal-currency basis, product inclusions, and
      forecast dates.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-margins
    missingEvidence: >-
      Audited gross margins and operating margins by product series (D-Series vs L-Series vs X-Series) compared to
      competitor Roborock's public segment reporting.
    whyItMatters: >-
      Without product-level margin disclosures, it is difficult to determine whether Dreame's aggressive pricing and
      feature bundling sacrifices profitability to gain volume.
    diligencePath: Review pre-IPO disclosures or confidential prospectus materials filed with the Hong Kong Stock Exchange.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: minor
    topic: warranty-return-rates
    missingEvidence: Aggregated hardware RMA and return rates across European and North American retail distribution channels.
    whyItMatters: >-
      Individual consumer review complaints indicate quality control vulnerabilities, but the overall return rate
      determines net channel profitability and brand durability.
    diligencePath: Obtain channel partner warranty return logs or retailer vendor scorecards from major distributors.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: gross-margins
    missingEvidence: >-
      Audited gross margins by product line and realized wholesale pricing after channel discounts and distributor
      allowances.
    whyItMatters: >-
      Gross margin determines whether aggressive 20% to 50% promotional markdowns leave sufficient margin to absorb
      fixed store leases, warranty reserves, and European flagship overhead.
    diligencePath: >-
      Request SKU-level margin waterfall models, retailer co-op advertising deduction schedules, and bill-of-materials
      cost sheets during management diligence.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: >-
      Consolidated cash balance, net operational burn rate, and capital expenditure obligations across Dreame Group
      entities.
    whyItMatters: >-
      Given that less than 7 billion yuan of committed government funds has been paid in and state guidance rules are
      tightening, standalone cash runway determines dependency on the planned Hong Kong IPO.
    diligencePath: >-
      Review audited bank cash balances, debt facilities, municipal fund draw schedules, and forward 24-month cash flow
      projections.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: stair-climbing-telemetry
    missingEvidence: >-
      Third-party benchmark data verifying Cyber X stair-climbing success rates across varying tread materials, riser
      heights, and multi-floor transitions.
    whyItMatters: >-
      Mechanical stair climbing is the primary hardware differentiator for Cyber X, but trade-show demonstrations do not
      prove residential safety and drop prevention.
    diligencePath: >-
      Request engineering reliability test reports and failure-mode analysis logs from residential customer beta
      deployments.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer repository activity, SDK documentation, or open API engagement metrics for third-party smart-home
      integration.
    whyItMatters: >-
      Consumer appliance hardware companies rarely expose direct developer APIs, relying on proprietary cloud backends
      and closed mobile applications.
    diligencePath: >-
      Examine Home Assistant community integration repositories and Matter protocol certification records for local API
      control.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort-level repeat purchase rates, annual customer retention metrics, and post-warranty service repair
      failure rates for Dreame smart cleaning appliances.
    whyItMatters: >-
      Consumer hardware models face elevated revenue volatility if adoption is driven purely by initial retail
      acquisition rather than multi-device replacement cycles and durable ecosystem loyalty.
    diligencePath: >-
      Request management cohort retention logs, warranty claim repair frequency by product series, and Dreamehome
      application monthly active user (MAU) engagement statistics.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: >-
      Disaggregated revenue share data across Amazon storefronts versus direct retail operations, alongside exact
      government fund capital exposure by municipal jurisdiction.
    whyItMatters: >-
      High channel concentration on Amazon exposes Dreame to platform fee increases or suspension risks, while
      state-backed guidance fund clawbacks could impair corporate liquidity.
    diligencePath: >-
      Review channel margin distribution across major online distributors and inspect Skyworks Venture Capital Fund's
      limited partner clawback and super anti-dilution agreements.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: missing-source
    severity: material
    topic: cybersecurity-remediation
    missingEvidence: >-
      Current production app versions, an official CVE remediation statement, patch adoption data, and an independent
