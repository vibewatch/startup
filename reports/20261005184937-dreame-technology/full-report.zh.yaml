      - number: '1.3'
        title: 资本、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              最明确的融资事件是 2021 年 10 月的 C 轮：Wikipedia 报告金额为 $563 million，而 Tracxn 报告四轮累计融资为 $578
              million。这是两个不同指标，不应合并为一个数字。已报道的支持方包括 Xiaomi、Yunfeng Capital、Shunwei Capital、IDG Capital 和 China
              Renaissance Group，但现有来源没有提供当前股权结构表、持股比例、债务明细或现金余额。规模指标也不稳定。Tracxn 报告截至 2026 年 3 月 31 日有 1,080 名员工，而
              WealthRank 列出截至 2026 年 10 月 4 日有 5,000 名员工；统计范围、法人覆盖和方法均未披露。有关香港 IPO 约 CNY 70 billion 估值的报道只是 IPO
              规划数据点，不是经验证的当前民营公司估值。
