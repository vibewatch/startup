  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与硬件工程基础
        blocks:
          - type: paragraph
            body: >-
              Dreame Technology 从 Yu Hao 创办的航空航天灵感孵化器创客空间，发展成一家多元化消费机器人企业，在 16 个品类销售超过 100
              款产品，包括机器人吸尘器、洗地机、无线手持吸尘器、割草机器人、擦窗机器人和个护电器。产品生态的机械核心是高速数字电机技术，该技术于 2020 年以 150,000 RPM
              首次商业化，随后扩展到专用清洁组件。Dreame 在手持和机器人吸尘器中采用 TangleCut 主动切发滚刷、CelesTect 斜向尘埃照明和 AquaCycle 2.0
              一体化热风自清洁与液体循环系统等机械方案形成差异化。高端无线型号在硬地面上的标称续航最高达 90 分钟。但多表面摩擦、液体吸入加热和紧凑电池包热管理都构成运行边界，需要持续算法限流和机械维护周期。
