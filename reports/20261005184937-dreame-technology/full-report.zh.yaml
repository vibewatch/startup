  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻品类纪律
        blocks:
          - type: paragraph
            body: >-
              可投资的核心市场是消费级机器人地面清洁硬件：家庭购买机器人吸尘器及吸拖一体机，以自动完成重复清洁。Dreame
              自有商店将机器人吸尘器与洗地机、无线手持吸尘器、窗户和织物清洁器并列销售，同时还列出美容、空气护理、厨房、大型家电、园艺和智能家居产品。这些更广品类可能带来分销或技术上的相邻机会，但它们的使用场景、替换周期和购买预算不同，将其与机器人地面清洁合并会夸大可寻址市场。因此，广义吸尘器预测只是背景性的上限，不是
              Dreame 的 TAM。严谨的测算阶梯应从全球吸尘器硬件缩小到机器人地面清洁，再到高端智能清洁、可触达渠道，最后落到公司实际 sell-through；现有证据只量化了其中部分外层和公司自报层级。
            claimRefs:
              - CM001
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
