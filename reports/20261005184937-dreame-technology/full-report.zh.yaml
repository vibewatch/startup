      - number: '7.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 不要把部分修复视为问题关闭
            body: CISA 记录了 Dreame 移除未加密通信的改动，但同一公告仍将其列为证书验证不当的已知受影响产品。只有在当前生产构建与公告完成对应并经过独立复测后，才能关闭该风险。
            calloutType: risk
