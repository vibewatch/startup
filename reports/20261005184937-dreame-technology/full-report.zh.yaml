      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于指定证据没有经审计收入、EBITDA、自由现金流、净债务或完全摊薄股数，情景分析只能定性进行。乐观情景要求品类领先转化为持久利润率，并实现条款清晰、可信的香港上市。基准情景假设公司已具备规模，但在披露和治理滞后的情况下，其价值仍无法确定。悲观情景则是促销压力、政府支持资本可得性下降、不利的优先权机制或退出延期叠加。我们不赋予概率百分比或估值区间，因为这样会制造缺乏来源支撑的精确度。每个情景都有一个可观察信号，尽调后可据此调整建议。
            claimRefs:
              - CV006
