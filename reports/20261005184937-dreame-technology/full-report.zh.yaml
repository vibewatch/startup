      - number: '5.2'
        title: Physical AI 框架：感知、决策与执行
        blocks:
          - type: paragraph
            body: >-
              在 IFA 2026，Dreame 将跨品类软件和算法架构正式纳入统一的 Physical AI 框架，框架由三个相互连接的功能基础组成：Omni-Perception System、Unified Home
              Intelligence Model 和 Intelligent Actuation & Control System。Omni-Perception 将主动双目视觉、结构化 3D
              Time-of-Flight（3D ToF）深度传感器和触觉避障检测结合起来，实时生成家居环境的空间点云。Unified Home Intelligence Model 综合 Multimodal Large
              Language Models（MLLMs）、Vision-Language Models（VLMs）和
              Vision-Language-Action（VLA）策略，把复杂自然语言指令和空间布局解析为结构化任务目标。随后，Intelligent Actuation & Control System
              协调无刷数字电机、关节、摆线减速器和闭环控制算法，执行现实世界中的操作和导航。Dreame 通过处于研究阶段的单臂轮式 ECHO S1 和轮式人形 ECHO P1
              平台，测试洗衣处理、衣物分类和家居整理等跨任务协同。
