            body: >-
              Dreame Technology 已实现相当大的国际规模，从硬件零部件初创公司发展为全渠道消费电器平台，在 120 个国家服务超过 42 million
              个家庭。公司客户基础在国内和国际市场之间分布多元：中国大陆约贡献总销售额的 45%，海外市场占 55%，是收入扩张的主要引擎。商业分销依托混合渠道架构，全球覆盖超过 6,500 个线下零售网点，同时在
              Amazon、JD.com、Tmall、Shopee 和 Lazada 运营高销量直营与平台店铺。消费者需求主要分为三层：寻求高端自动地面清洁机器人的高收入房主（$500+
              ASP）；使用多功能无线手持吸尘器和洗地机的城市公寓居民；以及采用高速美发造型工具和联网厨房电器的跨品类生活方式消费者。
