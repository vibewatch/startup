            title: 风险调整后的投资条件
            body: 如果当前应用仍可复现 CVE-2025-8393，审计后的基金合同披露出未公开的重大担保或流动性约束，或完整的安全与法律明细发现重大市场准入或禁令风险，应暂停投资。
