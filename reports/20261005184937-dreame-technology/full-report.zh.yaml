      - number: '7.2'
        title: 资本与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              现有报道显示 Dreame 对中国政府支持基金生态存在明显依赖，但报道中的指标不能直接互换。Caixin 抓取摘要称，Skyworks 管理 16 支政府支持产业基金，承诺额约 17.7 billion
              yuan；加上另外两支基金后接近 20 billion yuan，实缴不足 7 billion yuan。Congress.net 和 London Insider 则分别报告，一支与 Dreame
              关联且点名的基金管理着 41.6 billion yuan 资产，其中约 80% 来自地方政府产业基金。资产管理规模、基金承诺额、实缴资本和 Dreame
              自身流动性是不同数量。地方敞口审查和国务院更严格的指导因此是融资和治理风险信号，但公开证据没有量化公司的直接义务、担保或可用现金。
            claimRefs:
              - CR007
              - CR008
              - CR009
