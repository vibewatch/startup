      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Yu Hao 是现有资料中唯一被持续明确提及的高管，Tracxn 和 Wikipedia 均称其为创始人兼
              CEO。他早期在清华航空航天创客空间的经历显示其具备技术型创始人与市场的匹配度；但他公开设定异常宽泛的战略议程，也让叙事和执行风险集中于一人。现有来源无法确认当前董事会、高管运营团队、继任计划、委员会架构，或投资人和政府关联基金的治理权利。这并不证明这些控制机制不存在，而是民营公司披露不足。因此，在依赖表面上的创始人连续性之前，需要管理层推荐资料和完整治理文件。
            claimRefs:
