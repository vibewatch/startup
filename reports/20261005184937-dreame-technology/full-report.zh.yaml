        title: 发展轨迹与当前风险信号
        blocks:
          - type: paragraph
            body: >-
              Dreame 进入 2026 年时商业动能明显：London Insider 援引 IDC
              报道称，公司在第一季度按销售额计为最大的机器人吸尘器制造商。这个信号强于泛泛的市场存在感说法，但仍只是媒体对咨询机构结果的报道，不是经审计的公司收入。后续报道使增长叙事更复杂。Caixin 和 London
              Insider 描述了对政府关联融资的审查；随后 Yu 将战略概括为四个核心领域。ChannelNews 报道澳大利亚消费者评价信号疲弱、服务投诉较多，而 Carscoops 和 Wikipedia 描述截至 8
              月汽车业务大幅裁员或收缩。综合来看，公司在激进多元化之后正在重新聚焦，执行质量、资本治理和售后能力都需要直接尽调。
