            body: >-
              公司的成本结构受先进 LiDAR 传感器、定制高速电机和多部件基站带来的高物料清单与制造成本影响。Dreame 依靠广泛的线下和直营分销基础设施提升品牌资产，并承诺到 2026
              年底在德国、法国和意大利等欧洲主要市场运营 23
              家自营旗舰零售店。线下网络带来较高的固定租赁承诺、门店人员费用和当地营运资金需求，与传统轻资产消费电子分销模式形成成本对比。营销获客主要靠数字零售促销，但平台折扣会压低相对于标价 MSRP 的实际毛利。此外，将
              Dreame、MOVA 和 NAVEE 品牌统一纳入 Dreame Group 还会产生持续的组织整合成本；3D
              打印机和运动相机等新推出的非核心硬件品类也使研发开支维持高位。由于民营公司财务披露缺少毛利率、EBITDA 和获客成本基准，跨硬件迭代的运营利润可持续性仍未验证。
