              2024 至 2026 年间，Dreame 将大量资源和市级引导资本投入电动车（Dreame Auto）和智能手机等投机性非核心业务。到 2026 年中，汽车部门最高达 75%
              的大幅裁员和不断增加的供应商债务，暴露了过度多元化的技术与财务风险，促使公司退回核心家用机器人业务。
