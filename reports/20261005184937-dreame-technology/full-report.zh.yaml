      - number: '8.5'
        title: 可比公司、退出准备度与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              指定证据无法提供可辩护的可比公司集合、定价明确的私募交易，或运营指标匹配的并购参考。历史融资轮次虽有披露，但没有估值条款；当前估值参考也没有经审计的分母作支撑。因此，退出准备度仍只是正在形成的判断：财新报道称公司考虑赴港
              IPO，但公开证据中没有招股书、可依赖的时间表，也没有证明所有投资者类别都能实现流动性的路径。在作出投资判断前，投资者应取得经审计的合并报表、按月拆分的客户队列与渠道经济数据、净债务和营运资本明细、完全摊薄后的股权结构表、全部优先权及反稀释条款、政府基金义务，以及
              IPO 顾问的工作计划。下轮融资调价、IPO 流程撤回，或政府资本显著收缩，都会击穿当前由规模驱动的论点。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
              - CV016
