    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 品类领先地位延续，产品组合广度转化为经审计的现金创造，且 IPO 条款干净
        - 不设区间；报道中的 70 billion yuan IPO 估值只是参考，并非经验证的公允价值
        - 促销力度、多元化成本与优先权稀释
        - 只有在取得经审计的利润率、现金流和可信上市申报后才上调判断
      - - 基准
        - Dreame 仍是一家规模化的未上市硬件公司，但财务与资本结构披露仍不完整
        - 不设区间；价值必须基于经审计结果和完全摊薄后的持股重建
        - 盈利能力不透明、退出时间不确定、治理复杂
        - 关键证据缺口仍未解决前，暂以此作为工作情景
      - - 悲观
        - 政府资本可得性收紧、IPO 延迟，或估值重置触发不利的优先权经济安排
        - 不设下限；公开证据无法确定清算价值或下行保护
        - 稀释、流动性压力、定价压力与资本提供方收缩
        - 若 IPO 进程撤回或基金义务未履行，风险升级
