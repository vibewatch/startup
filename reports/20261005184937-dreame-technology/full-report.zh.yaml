figures:
  - id: FO001
    title: 公司里程碑与风险时间线
    type: timeline
    summary: 时间线保留成立年份冲突，并展示公司从融资驱动扩张转向 2026 年聚焦与审查的变化。
    data:
      items:
        - date: '2015'
          label: 据报道的运营起步
          detail: Tracxn 和 WealthRank 将 2015 年认定为成立年份。
          tone: neutral
          claimRefs:
            - CO002
        - date: '2017'
          label: 另一种公司成立年份
          detail: Wikipedia 认定为 2017 年，造成注册成立年份与运营起步年份之间尚未解决的冲突。
          tone: warning
          claimRefs:
            - CO003
        - date: 2021-10
          label: C 轮融资
          detail: 据报道，C 轮融资为 $563 million；Tracxn 另称四轮融资累计 $578 million。
          tone: positive
          claimRefs:
            - CO006
            - CO007
        - date: 2026-Q1
          label: 据报道的扫地机器人销量领先
          detail: London Insider 援引 IDC，称其在该季度全球扫地机器人销量中排名第一。
          tone: positive
          claimRefs:
            - CO011
        - date: 2026-04
          label: 澳大利亚售后审查
          detail: ChannelNews 报道称，其在评价平台上的评分较低，并持续出现服务与可靠性投诉。
          tone: negative
          claimRefs:
            - CO015
        - date: 2026-06
          label: 政府关联融资审查
          detail: 报道称，官方已就地方政府关联资本风险敞口展开问询与审查。
          tone: negative
          claimRefs:
            - CO012
        - date: 2026-06
          label: 战略收窄
          detail: 据报道，Yu Hao 将智能家居、庭院护理、智能交通与具身 AI 确定为四个核心领域。
          tone: neutral
          claimRefs:
            - CO013
        - date: 2026-08
          label: 据报道的汽车业务收缩
          detail: 独立报道描述了大规模裁员及汽车业务逐步退出。
          tone: negative
          claimRefs:
            - CO016
    approximationNotes: 日期与期间均来自来源报道；时间线展示成立年份冲突，不对此进行调和。
    claimRefs:
