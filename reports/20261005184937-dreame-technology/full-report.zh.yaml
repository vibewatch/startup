      - number: '5.3'
        title: 多楼层导航、合规与生态纪律
        blocks:
          - type: paragraph
            body: >-
              为解决机器人吸尘器在多层住宅中的结构性使用边界，Dreame 开发了 Cyber X 机器人吸尘器系统，将仿生六足、三段履带式攀爬结构与 3D ToF
              传感器结合，以识别楼梯踏步几何形状并自主跨楼层。爬楼梯是机械穿越能力的一项工程里程碑，但实际部署仍受载荷重量、重心变化以及光滑或铺地毯台阶上的打滑风险限制。安全与监管要求也在 Dreame 产品中体现：产品通过
              Dreamehome 移动应用运行于消费级智能家居协议中，并针对英国 Product Security and Telecommunications Infrastructure（PSTI）Act
              和澳大利亚消费者网络安全标准维持合规声明。然而，地方政府引导基金支持的电动车、智能手机和半导体业务激进多元化，在 2026 年中造成组织压力，最终导致汽车部门大幅裁员，并迫使公司重新聚焦核心智能家居机器人。
