      - number: '8.2'
        title: 融资背景与资本悬置
        blocks:
          - type: paragraph
            body: >-
              现有融资记录是零散的。RoboAtlas 列出 2022 年和 2023 年的 D 轮、C+ 轮和 D+ 轮，但金额未披露；Wikipedia 则报告 2021 年 10 月 C 轮融资 $563
              million。较新的证据引出另一个问题：Caixin 摘要称与公司有关的基金承诺额接近 20 billion yuan，但实缴不足 7 billion
              yuan；同时描述了一项超级反稀释机制，即被投公司估值下跌时提高政府投资人的持股比例。这些数值是承诺额和基金实缴资本，不是 Dreame
              可用现金。在没有底层协议和股权结构表的情况下，稀释、清算优先权、返投和关联方影响仍是重大的未知数。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
      - number: '8.3'
        title: 正向论点、反向论点与商业信号
        blocks:
          - type: paragraph
            body: >-
              正向案例依靠品类规模和产品广度，而不是已被证明的现金创造能力。London Insider 将 2026 年第一季度全球机器人吸尘器销售第一归因于 IDC；Dreame
              官网也展示了从地面清洁延伸到美容、空气护理、厨房、大型家电、园艺和智能家居的品类。Moneycontrol 还报道其在印度超过 165 个城市设有服务网络。与之相对的是定价和执行风险：同一篇
              Moneycontrol 文章列出一次促销中 D10 Plus Gen 2 从 Rs 39,999 降至 Rs
              22,999，而不利报道描述了公司对政府支持资本的巨大敞口。一次促销活动不能证明结构性利润率压缩，但足以说明毛利率和 sell-through 证据不可或缺。
            claimRefs:
              - CV007
