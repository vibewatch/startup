          - type: paragraph
            body: >-
              CISA 发现受影响的 Dreamehome 和 MOVAhome 移动应用接受自签名证书，从而在不受信任的网络上为窃取凭据和会话令牌创造中间人攻击路径，并据此为 CVE-2025-8393 评定 CVSS
              v3.1 分数 7.3。该机构还表示，这一漏洞无法远程利用，也没有发现针对它的公开利用。其 2026 年 6 月修订记录了 Dreame
              移除未加密通信的改动，但抓取到的证据无法证明当前应用版本已完全修复证书验证不当问题。另据 Baidu Baike，历史上有 7
              条与专利有关的庭审公告，但没有提供结果或敞口。这些是有记录的问题，不是当前数据泄露、不利判决或召回的证据。
