      - number: '4.3'
        title: 资本充足性、融资依赖与 IPO 前治理
        blocks:
          - type: paragraph
            body: >-
              Dreame Technology 通过与地方政府支持的投资基金开展资本合作迅速扩张，并采用联合共同投资模式为跨行业孵化提供资金。Lei Ming 管理的 Skyworks Venture Capital
              Fund 负责管理 16 支政府支持的产业基金，合计承诺资本约 17.7 billion yuan；总承诺接近 20 billion yuan，但实缴不足 7 billion
              yuan。此外，相关创投实体的资产管理规模合计达到 41.6 billion yuan，其中约 80%
              来自苏州、厦门等城市的市级产业引导基金。这种对国家资本的依赖包含合同性的返投约束，要求在出资地区进行产业落地；同时设有超级反稀释条款，在企业估值下降时扩大国有股权比例。中国国务院和地方政府对公共基金敞口的监管审查加剧，加上创始人
              Yu Hao 声称拥有覆盖电动车、半导体和卫星的广阔生态，促使公司战略收缩。Dreame 已撤回高调的 Star Project 电动车计划，并重新审视与国家基金的关系，同时寻求以 70 billion
              yuan（.6 billion）估值筹集 IPO 前资金，为计划中的香港 IPO 申请做准备。
