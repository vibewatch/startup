      - number: '7.4'
        title: 监测重点与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              投资监测应将未解决的证据转化为可审计条件。在认定安全问题已关闭之前，应要求提供当前 iOS 和 Android 构建号、对应 CVE-2025-8393
              的修复声明及独立渗透测试。将每项政府支持基金指标与法人、承诺额、实缴资本、关联方余额、担保、契约和 Dreame
              实际可用现金逐一核对。取得完整的诉讼、产品安全、召回、供应商和生产地点明细。论点失效触发因素包括：当前生产应用中仍可复现的证书验证漏洞；未披露且影响流动性的重大担保或融资契约；重大安全或进口措施；或证据显示聚焦四大领域并未减少亏损性的外围承诺。
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR009
              - CR011
