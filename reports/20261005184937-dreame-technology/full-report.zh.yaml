              - CM004
              - CM007
              - CM016
      - number: '2.2'
        title: 受证据约束的市场测算与公司触达
        blocks:
          - type: paragraph
            body: >-
              Accio 报告称，全球吸尘器收入将从 2023 年的 USD 21.76 billion 增至 2029 年的 USD 25.87 billion，并另行引用 2033 年 USD 35.37 billion
              的预测。其抓取文本没有披露底层发布方的方法、地理口径协调或品类定义，因此这些数值应视为方向性的广义市场估算，而不是已经协调一致的预测序列。公司发布的材料称，Dreame 在 2026
              年第一季度机器人吸尘器销量和收入均居全球第一，在 120 多个国家通过超过 6,500 个零售网点运营，累计出货超过 11 million
              台。这些指标证明了触达范围和被报道的领先地位，而不是市场规模：没有品类总量、期间 sell-through、ASP、退货和渠道库存，排名、网点覆盖和累计出货无法转换为当前收入份额。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买家、渠道、驱动因素与采用阻力
        blocks:
          - type: paragraph
            body: >-
              家庭既是主要买家、付款方，也是用户；已报道的最明确目标人群是重视自动清洁的忙碌或偏好科技的消费者。线上发现和转化越来越重要：Accio 预计到 2028 年线上吸尘器销售将占全球市场 50.1%，而 Dreame
              官网同时提供按国家划分的线上购物和 “Where to Buy” 入口，公司还声称拥有庞大的线下零售网络。便利性、高端智能家居需求和欧洲市场动能推动采用，其中包括公司声称 2026 年 1 月至 4
              月销售额同比增长 110%。阻力仍与具体产品有关：Accio
              汇总的评价分析将导航、卡住和连接列为机器人吸尘器投诉，而电池续航和吸力问题反复出现在相邻的无线产品品类中。来源没有披露评价样本量，因此这些百分比是信号，不是总体估计。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 约束、矛盾与估值相关性
        blocks:
          - type: paragraph
            body: >-
              市场增长本身不能消除执行和资本配置风险。现有证据一方面描述 2025 年末 Amazon 上机器人吸拖一体产品的销量动能强劲，另一方面又称零售销量停滞；这不是可比的全渠道增长序列。证据还包括对 Dreame
              关联政府支持基金的审查报道：Caixin 摘要将约 RMB 20 billion 的承诺额与不足 RMB 7 billion
              的实缴额区分开来，另有报道描述地方政府敞口审计和更严格的全国性基金监管。这些不是消费者需求的直接指标，但如果扩张依赖补贴产能、渠道投入或相邻业务，就会影响采用时点和估值。因此，恰当的投资判断是认可可观察到的分销和品类动能，同时在披露
              sell-through、品类分母、用户群留存和渠道经济性之前，对无来源支撑的市场份额外推打折。
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 排名不是 SOM
            body: 第一名排名和累计出货不能说明 Dreame 当前占据的品类收入份额。在估值中使用 SOM 之前，应取得区域机器人吸尘器品类总量、Dreame sell-through、ASP、退货和渠道库存数据。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 渠道组合是关键敏感项
            body: 线上份额预测和 Dreame 的线下网络表明其采用混合市场路径，但证据没有披露渠道经济性或区域组合。
            calloutType: insight
            claimRefs:
              - CM003
              - CM008
              - CM011
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 全球竞争格局与市场份额重排
        blocks:
          - type: paragraph
            body: >-
              2026 年初，全球智能清洁机器人行业经历重大领导权转移：Dreame Technology 超越长期领先者 Roborock，在销量和销售收入两项指标上都夺得全球市场份额第一。IDC 行业数据显示，Dreame
              在 2026 年第一季度占全球机器人吸尘器销量的 23.7%，占全球收入的 28%，市场力量由此发生决定性转移。竞争对手 Roborock 曾在 2025 年下半年以 24.1% 的市场份额领先，随后被
              Dreame 激进的产品发布节奏超越。加上 Ecovacs Robotics 等同行，中国制造商目前占全球品类出货量的一半以上，持续挤压 iRobot
              等传统先驱；后者产品迭代较慢且依赖外包技术，历史主导地位已经削弱。Dreame 的崛起依托覆盖 120 多个国家、6,500 个线下零售网点以及超过 11 million 台的全球累计出货。这个商业网络让
              Dreame 在全球 30 个国家取得市场第一，并在其中 10 个国家实现超过 50% 的绝对市场份额。欧洲的区域动能尤其明显：Dreame 2025 年出货量同比增长 103%，并在 2026 年 1 月至 4
              月继续增长 110%。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 硬件差异化、电机工程与功能迭代
        blocks:
          - type: paragraph
            body: >-
              Dreame 的市场差异化建立在垂直电机研发和加速硬件功能迭代之上。许多消费机器人组装商依赖采购现成无刷电机，Dreame
              则较早投入自研高速数字电机，把航空流体力学原理用于电磁设计、空气动力学和热耗散。与普通替代品相比，这套专有动力系统带来更高的空气动力效率、更低的噪声和更低的制造物料成本。公司的模块化电机架构成为机器人吸尘器、无线手持清洁器、洗地机和高速个护电器的共享技术核心。在产品执行上，Dreame
              通过旗舰 X60 系列把机械自动化推进到复杂家居环境：吸力最高达 35,000 Pa，并配备 18cm 双关节机械臂，用于清洁传统圆柱形清扫器难以触及的踢脚线和 90 度角落。再加上 212°F
              沸水热拖消毒、多传感器 AI 空间感知和高离地间隙越障，Dreame 建立了硬件标杆，迫使竞争对手压缩产品开发周期以守住高端货架空间。
            claimRefs:
              - CP009
              - CP010
              - CP001
              - CP004
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP009
              - CP010
      - number: '3.3'
        title: 分层定价架构与海外分销执行
        blocks:
          - type: paragraph
            body: >-
              Dreame 在主要国际零售市场管理着清晰的三级价格体系，覆盖入门、中端和超高端。产品目录从入门 D 系列的 $199.99 起，最高到旗舰 X60 Max Ultra Complete 的
              $1,699.99。入门 D 系列（$199.99–$549.99）提供基础 LiDAR 导航、自动集尘和最高 25,000 Pa 吸力，作为规模引擎吸引从手动清洁转向自动清洁、对价格敏感的首次购买者。中端 L
              系列（$699.99–$999.99）集成双旋转拖地、基站自动清洁和先进视觉避障，直接与 Roborock 的走量型号和 Ecovacs 的 T 系列竞争。最高端 X
              系列（$1,199.99–$1,699.99）面向追求免接触自动维护、高吸力和机械臂活动能力的富裕家庭。Dreame 将统一的零售与市场情报嵌入每周运营决策，强化了国际商业扩张；2021 至 2025 年间，其在
              16 个小家电品类的海外收入份额增长 122%。通过协调直营数字商店、Amazon 分销和欧洲主要零售连锁的库存分配与促销时点，Dreame 在高端层级维持价格纪律，同时积极扩大风险较低的渠道销量。
            claimRefs:
