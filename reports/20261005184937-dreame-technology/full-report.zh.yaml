            body: >-
              Dreame
              是一家总部位于苏州的中国民营家电制造商。公司商业版图从地面清洁起步，如今覆盖机器人吸尘器、洗地机和无线吸尘器、个护设备、园艺设备、空气护理、厨房电器、大型家电及智能家居产品。这样的广度意味着公司不只是单一产品的机器人厂商，但现有证据没有披露分部收入或各品类的经济性。公司成立日期尚未确定：Tracxn
              和 WealthRank 报告为 2015 年，而 Wikipedia 将 2017 年列为公司成立年份，同时另称 Yu Hao 于 2015 年在苏州创办
              Dreame。差异可能反映运营起始时间与正式注册时间的不同，应通过注册记录解决，而不是强行统一。
