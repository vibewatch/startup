  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              投资决策应是继续研究，而不是买入或参与。Fundz 描述了一轮目标估值为 $9.6 billion 的 IPO 前融资，而预先抓取的 Caixin 摘要另称公司准备以约 70 billion yuan 申请香港
              IPO。两者都没有提供将这些参考值转换为公允价值所需的证券条款、实际募资额、经审计收益、现金流、净债务或完全摊薄股数。因此，报道中的估值应视为融资或上市目标，而不是经验证的企业价值。当前信心低、风险高；在一手尽调补齐缺失分母之前，应暂不设定估值区间、目标回报和持有期预测。
            claimRefs:
              - CV001
