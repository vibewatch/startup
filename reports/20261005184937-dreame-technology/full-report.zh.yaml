      - number: '7.3'
        title: 执行与控制复杂度
        blocks:
          - type: paragraph
            body: >-
              执行风险主要因业务广度升高，而非已有证实的失败。独立报道描述其拥有近 1,000 家关联企业，业务覆盖远超机器人清洁；Dreame 后来将公开重点收窄为四个领域。Baidu Baike
              还记录了一次公司反欺诈检查，发现 23 起违规或欺诈案件，解雇 23 名员工，并将 3 人移交司法机关。这些控制行动是缓释信号，但财务影响和复发率均未公开。Dreame
              全球主页链接了漏洞、隐私、数据合规和安全合规材料，但指定抓取页面没有提供汇总的事故历史、召回台账、供应商地图或生产地域集中度。这组来源中缺少这些记录是尽调缺口，不证明不存在事故或集中度。
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
