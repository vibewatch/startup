  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现
        blocks:
          - type: paragraph
            body: >-
              Dreame Technology 的绝大部分收入来自消费机器人和智能清洁电器，核心是高端和中端机器人吸尘器。公司旗舰机器人吸尘器系统定价较高，例如 X60 Max Ultra Complete 的标价为
              ,699.99，X50 Ultra Complete 的标价为 ,099.99；同时通过 D 系列和 L 系列型号覆盖入门和中端市场，包括标价 69.99 的 D20 Air Plus 和标价 99.99 的
              D30 Ultra CE。实际商业运营中，Dreame 会在大型零售活动期间大幅促销，在 Amazon Prime Big Deal Days 等主要电商平台将型号折价 18% 至
              50%。硬件销量是直接交易机制，但专用清洁剂补充装、替换刷和模块化拖布等售后耗材会带来高毛利的持续收入。区域分销明显偏向国际市场，覆盖 120 多个国家；西欧是核心区域之一，Dreame
              在当地机器人吸尘器市场占据主导份额。不过，直营线上销售、第三方平台销量和零售渠道合作伙伴利润之间的精确拆分仍未由民营母公司披露，需要在财务尽调中核实。
