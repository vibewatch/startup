  - id: FM001
    title: 受证据约束的市场规模阶梯
    type: pyramid
    summary: 六个嵌套分析层级，将宽泛的家电背景与投资者最终需要评估的公司结果分开。
    data:
      nodes:
        - label: 广义家电邻接品类
          value: Not sized
          detail: 美容、空气、厨房、大型家电、园艺与智能家居品类不计入核心机器人地面清洁业务。
        - label: 全球吸尘器市场
          value: USD 35.37B
          detail: Accio 给出的 2033 年广义市场预测；抓取文本未披露方法。
        - label: 机器人地面清洁品类
          value: Not disclosed
          detail: 指定证据没有扫地机器人品类的绝对收入数据。
        - label: 高端智能清洁细分市场
          value: Not disclosed
          detail: 公司披露将欧洲增长归因于高端需求，但没有给出细分市场分母。
        - label: 可触达渠道版图
          value: 120+ countries / 6,500+ locations
          detail: 公司发布的 2026 年 6 月渠道版图；触达范围不等于活跃需求。
        - label: Dreame 实现的结果
          value: 11M+ cumulative units
          detail: 公司发布的累计出货量；期间 sell-through、ASP 与库存数据不可得。
    approximationNotes: 各层级为概念展示，并未按比例绘制；不可得的数值明确保持未量化，不暗示层级之间可以换算。
    claimRefs:
      - CM003
      - CM004
      - CM007
      - CM016
  - id: FP001
    title: 智能清洁机器人竞争定位
    type: quadrant
    summary: 从技术差异化与全球市场执行两方面评估主要扫地机器人竞争者。
    data:
      xAxis: 硬件与 AI 创新深度（自研电机、机械臂、视觉）
      yAxis: 全球商业执行力（市场份额、零售触达、国际分销）
      points:
        - label: Dreame Technology
          x: 8.8
          'y': 9.1
          tone: positive
        - label: Roborock
          x: 8.2
          'y': 8.6
          tone: neutral
        - label: Ecovacs Robotics
          x: 7.4
          'y': 7.9
          tone: neutral
        - label: iRobot
          x: 4.5
          'y': 6.2
          tone: negative
        - label: SharkNinja
          x: 5.8
          'y': 7.1
          tone: neutral
        - label: Midea Robotics
          x: 5.2
          'y': 5.5
          tone: neutral
    approximationNotes: 定位反映基于证据的序数评分（1–10 分制），综合 IDC 2026 年第一季度市场份额排名、产品吸力与机器人性能基准，以及国际零售触达情况。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP009
      - CP010
  - id: FI001
    title: 硬件变现与单件现金转化桥
    type: flow
    summary: 结构性流程图展示客户获取、硬件单件交易、促销折价压缩利润，以及后续耗材带来的现金创造。
    data:
      nodes:
        - id: lead-traffic
          label: 消费者流量与品牌发现
          detail: 重点市场的数字营销与零售旗舰店客流
        - id: hardware-sale
          label: 硬件家电交易
          detail: 标价 MSRP 销售覆盖高端 X 系列至入门 D 系列机型
        - id: promotional-markdown
          label: 促销折价压缩利润
          detail: 活动驱动的 18% 至 50% 折扣压低实际收入
        - id: logistics-fulfillment
          label: 渠道与物流履约
          detail: 平台佣金、零售商批发利润与全球配送成本
        - id: net-hardware-cash
          label: 硬件净毛利率
          detail: 剩余现金贡献，用于支撑固定研发与运营开销
        - id: consumable-sales
          label: 经常性耗材收入流
          detail: 后续购买自有清洁液、滤芯与刷具配件
      edges:
        - from: lead-traffic
          to: hardware-sale
        - from: hardware-sale
          to: promotional-markdown
        - from: promotional-markdown
          to: logistics-fulfillment
        - from: logistics-fulfillment
          to: net-hardware-cash
        - from: net-hardware-cash
          to: consumable-sales
    approximationNotes: Dreame 商业转化经济学的概念示意流程；单件利润扣减的精确数值属于非公开公司财务数据。
    claimRefs:
      - CI004
      - CI005
      - CI006
  - id: FE001
    title: Dreame 具身物理 AI 架构栈
    type: stack
    summary: 四层架构栈展示 Dreame 智能家电中的数据感知、语义推理、物理执行与连接治理。
    data:
      layers:
        - label: 应用与商业产品
          modules:
            - Cyber X 爬楼机器人
            - T16 Pro 加热洗地机
          notes:
            - Volume commercial consumer cleaning products across multi-storey and hard-floor domestic categories
        - label: 研究与原型平台
          modules:
            - ECHO S1 单臂洗衣机器人
            - ECHO P1 人形移动助手
          notes:
            - Experimental robotic embodiments exploring continuous garment manipulation, sorting, and household tidying
        - label: 决策与认知模型
          modules:
            - 多模态大语言模型（MLLMs）
            - 视觉语言模型（VLMs）
          notes:
            - Interprets multimodal natural language instructions and domestic scene context for robotic planning
        - label: 动作策略与推理层
          modules:
            - 视觉-语言-动作（VLA）框架
            - 任务目标分解与轨迹规划
          notes:
            - Maps cognitive decisions into discrete kinematic targets and spatial trajectory sequences
        - label: 感知与全方位感知层
          modules:
            - 主动双目立体视觉
            - 3D 飞行时间（3D ToF）传感器
          notes:
            - Acquires real-time environmental geometry, obstacle status, and spatial coordinates
        - label: 执行与电机控制层
          modules:
            - 150,000+ RPM 数字电机
            - 精密减速器与闭环 FOC 驱动器
          notes:
            - Translates algorithmic decisions into physical mechanical displacement and cleaning action
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Dreame 消费者采用与扩张旅程
    type: journey-map
    summary: 从数字化发现与单设备清洁采用，逐步走向多家电全屋生态扩张。
    approximationNotes: 各阶段综合线上与线下零售渠道所报道的消费者触点与品类迁移路径。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU009
      - CU011
    data:
      items:
        - label: 发现与搜索
          title: Online & Offline Awareness
          touchpoints:
            - Amazon 与区域电商搜索结果
            - 社交媒体影响者与科技评测者评价
            - 6,500+ 个零售地点的店内实机展示
          friction: High brand competition against incumbents like Roborock and iRobot
        - label: 首次购买
          title: Core Cleaning Device Purchase
          touchpoints:
            - 首次购买高端扫地机器人或洗地机
            - 促销零售价与直接保修登记
          friction: Premium pricing barrier ($500+ ASP) requiring clear feature justification
        - label: 上手与日常使用
          title: Dreamehome Connected Operations
          touchpoints:
            - 移动应用配对与 SLAM 家庭建图
            - 自主定时清洁与 AI 避障
          friction: Wi-Fi setup hurdles and navigation quirks in complex floor layouts
        - label: 售后与维护
          title: Consumables & Customer Support
          touchpoints:
            - 重新订购替换滤芯、滚刷与拖布
            - 区域服务中心与在线保修申请门户
          friction: Spare parts availability and localized service responsiveness
        - label: 跨品类采用
          title: Ecosystem Expansion
          touchpoints:
            - 重复购买高速个护吹风机
            - 升级至高端多功能洗地系统
          friction: Category credibility outside core vacuum cleaning hardware
        - label: 全屋整合
          title: Connected Appliance Ecosystem
          touchpoints:
            - 集成 Google Gemini AI 的智能厨房家电
            - 环境空气护理与庭院维护自动化
          friction: Interoperability fragmentation across non-standard smart home protocols
  - id: FR001
    title: 剩余风险评估矩阵
    type: matrix
    summary: 定性呈现影响、可能性证据、缓解措施成熟度与剩余不确定性，而非量化概率模型。
    data:
      columns:
        - 影响
        - 可能性证据
        - 缓解措施成熟度
        - 剩余风险评估
      rows:
        - label: 移动应用 TLS 校验
          values:
            - 高
            - 利用路径已有记录；没有公开利用报告
            - 部分
            - 等待当前版本复测，风险中高
        - label: 政府基金依赖
          values:
            - 可能较高
            - 据报道，载体层面金额较大，并受到 2026 年政策审查
            - 部分
            - 在核对实体风险敞口前，不确定性高
        - label: 产品组合与关联方扩张
          values:
            - 可能较高
            - 据报道，公司广泛扩张
            - 已宣布战略聚焦
            - 等待负债与关停成本审查，风险中高
        - label: 专利诉讼
          values:
            - Unknown
            - 已记录七次历史庭审公告
            - 未披露
            - 等待案卷与结果审查，未知
        - label: 内部欺诈与控制
          values:
            - Unknown
            - 据报道发现 23 起案件
            - 已记录反应式控制措施
            - 等待损失与复发数据，未知
        - label: 安全与供应连续性
          values:
            - 可能较高
            - 指定来源中没有足够证据
            - Unknown
            - 尚未填补的尽调缺口
    approximationNotes: 截至 2026-10-05 的定性分析师判断；基金指标使用不同分母，未知单元格不会被刻意换算成分数。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 一条定性的投资判断链条说明，规模证据为何尚不足以支撑报告中引用的估值。
    data:
      nodes:
        - id: scale-signal
          label: 规模信号
          detail: 据报道，公司在 2026 年第一季度取得品类领先地位，产品覆盖面广，足以证明其具备商业相关性。
        - id: pricing-signal
          label: 定价信号
          detail: 活动期间的大幅折扣意味着，实际成交价和毛利率的可持续性必须列为尽调事项。
        - id: capital-signal
          label: 资本信号
          detail: 历史融资轮次和政府支持的基金说明公司能够获得资本，并不代表现金已经到位。
        - id: preference-risk
          label: 优先权风险
          detail: 据报道，反稀释机制和基金义务可能改变普通股股东的最终结果。
        - id: valuation-gap
          label: 估值缺口
          detail: 经审计的经营业绩、净债务、完全摊薄后的持股情况以及交易条款均未提供。
        - id: decision
          label: 继续研究
          detail: 在取得缺失的一手证据前，不对价格或回报目标背书。
      edges:
        - from: scale-signal
          to: pricing-signal
        - from: pricing-signal
          to: capital-signal
        - from: capital-signal
          to: preference-risk
        - from: preference-risk
          to: valuation-gap
        - from: valuation-gap
          to: decision
    approximationNotes: 该序列是定性的，不代表数值评分、概率或转化率。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV011
      - CV013
      - CV015
      - CV016
