      - number: '3.4'
        title: 壁垒耐久性、知识产权与售后脆弱点
        blocks:
          - type: paragraph
            body: >-
              尽管 Dreame 商业增长迅速，其竞争壁垒仍面临专利诉讼、购后质量控制和战略资本配置等方面的显著防守压力。竞争摩擦已表现为知识产权冲突：Dreame Technology Germany
              就涉及自主机器人控制方法的欧洲专利 EP3825070，向 Ecovacs Robotics 提起专利异议程序。与此同时，快速发布产品暴露了产品质量和售后服务的脆弱点。独立消费品测试发现，基站水泵反复出现缺陷，与
              Amazon Alexa
              等智能家居生态的连接也持续受阻。评价者提到保修摩擦，包括退款请求被拒，以及解决高端产品缺陷时客服长期延误；在消费者期待无缝售后支持的西方市场，这可能侵蚀品牌资产和客户留存。此外，公司大规模多元化进入非核心业务，包括电动车、智能手机和本地饮料业务，并通过约
              20 billion yuan 的政府支持投资承诺提供资金；这引发监管审查，也迫使管理层正式将运营重心收回智能家居、庭院护理、智能交通和具身人工智能。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
