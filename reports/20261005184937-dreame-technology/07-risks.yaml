company:
  name: "Dreame Technology"
chapter:
  number: 7
  title: "Risks"
  summary: "The clearest evidenced risk is a CISA-rated high-severity mobile-app certificate-validation flaw, while 2026 reporting also raises governance and capital-dependency questions around government-backed funds and a broad venture portfolio. Public evidence shows some mitigation actions, but current app remediation, litigation outcomes, safety history, supplier concentration, and company-level financial exposure remain material diligence gaps."
sections:
  - id: "cybersecurity-legal-and-regulatory"
    title: "Cybersecurity, legal, and regulatory exposure"
    body: >-
      CISA assigned CVE-2025-8393 a CVSS v3.1 score of 7.3 after finding that
      affected Dreamehome and MOVAhome mobile applications accepted self-signed
      certificates, creating a man-in-the-middle path to credentials and session
      tokens on untrusted networks. The agency also said the flaw was not remotely
      exploitable and that it knew of no public exploitation specifically targeting
      it. Its June 2026 revision records Dreame changes that removed unencrypted
      communications, but the fetched evidence does not establish whether current
      app versions fully remediate improper certificate validation. Separately,
      Baidu Baike records seven historical patent-related court-session
      announcements; it does not provide outcomes or exposure. These are documented
      issues, not evidence of a current breach, adverse judgment, or recall.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR012"
    tableRefs:
      - "TR001"
      - "TR002"
  - id: "capital-and-partner-dependencies"
    title: "Capital and partner dependencies"
    body: >-
      The available reporting indicates meaningful dependence on China’s
      government-backed fund ecosystem, but the reported measures are not directly
      interchangeable. Caixin’s fetched summary says Skyworks managed 16
      government-backed industrial funds with about 17.7 billion yuan committed,
      rising to nearly 20 billion yuan across two additional funds, with less than
      7 billion yuan paid in. Congress.net and London Insider separately report
      41.6 billion yuan of assets managed by a named Dreame-linked fund and roughly
      80% sourced from local government industry funds. Asset management, fund
      commitments, paid-in capital, and Dreame’s own liquidity are different
      quantities. Municipal exposure reviews and tighter State Council guidance
      therefore signal funding and governance risk, but public evidence does not
      quantify the company’s direct obligations, guarantees, or available cash.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR003"
  - id: "execution-and-control-complexity"
    title: "Execution and control complexity"
    body: >-
      Execution risk is elevated by breadth rather than proven failure. Independent
      reports describe nearly one thousand affiliated enterprises spanning sectors
      far beyond robotic cleaning, while Dreame later narrowed its stated focus to
      four areas. Baidu Baike also records a company anti-fraud inspection that
      identified 23 violation or fraud cases, terminated 23 employees, and referred
      three people to judicial authorities. Those control actions are a mitigation
      signal, but neither the financial impact nor recurrence rate is public.
      Dreame’s global homepage links vulnerability, privacy, data-compliance, and
      security-compliance materials, yet the assigned fetched pages do not provide
      a consolidated incident history, recall ledger, supplier map, or geographic
      manufacturing concentration. Absence of those records in this source set is
      a diligence gap, not proof that no incidents or concentrations exist.
    claimRefs:
      - "CR006"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring priorities and thesis-break conditions"
    body: >-
      Investment monitoring should convert the unresolved evidence into
      auditable conditions. Require current iOS and Android build numbers, a
      remediation statement mapped to CVE-2025-8393, and an independent penetration
      test before treating the security issue as closed. Reconcile every
      government-backed fund measure to legal entities, commitments, paid-in
      capital, related-party balances, guarantees, covenants, and cash actually
      available to Dreame. Obtain a complete litigation, product-safety, recall,
      supplier, and manufacturing-site schedule. Thesis-break triggers are a
      reproducible certificate-validation flaw in current production apps, an
      undisclosed material guarantee or funding covenant that impairs liquidity,
      a material safety or import action, or evidence that the four-area refocus
      has not reduced loss-making peripheral commitments.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR007"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR013"
