      - number: '4.2'
        title: Distribution and service economics
        blocks:
          - type: paragraph
            body: >-
              The observable go-to-market motion is product-led and integration-assisted. Official materials describe
              capture through meeting bots, browser, desktop, mobile, file upload, and connected recording sources,
              followed by transcripts, summaries, action items, and delivery into more than 50 workflow applications. A
              Microsoft Marketplace listing adds a Teams distribution surface, but its supplier-authored copy is company
              evidence hosted by a partner, not independent proof of channel productivity. The same workflow exposes
              likely cost pools: speech processing, generative summaries, storage, integration maintenance, security,
              and enterprise support. None of the assigned sources quantifies those costs, sales cycle, CAC, payback, or
              channel economics.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Public traction and monetization risk
        blocks:
          - type: paragraph
            body: >-
              Public adoption claims are not sufficiently reconciled to serve as a revenue denominator. The unaffiliated
              Fireflies-branded site claims more than one million companies, while the official security page claims
              more than 500,000 organizations; neither defines active, paying, enterprise, or workspace status.
              Independent review evidence also identifies monetization friction: ToolChase reports weaker transcription
              performance for some accents, and Clarigital says capped AI credits can be exhausted by heavy users before
              month-end. These points do not prove churn or margin compression, but they identify the product quality
              and usage-allocation questions that cohort data must resolve.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy cannot be inferred from the available financial evidence. The assigned pool contains no
              current cash balance, operating cash burn, debt or covenant schedule, runway calculation, planned use of
              funds, or next-round trigger. It also contains no recognized revenue, ARR, gross margin, CAC payback,
              churn, or net revenue retention. Funding raised elsewhere should not be treated as cash available today,
              and revenue should not be relabeled as ARR. The defensible verdict is therefore narrow: Fireflies has
              credible recurring-price architecture and multiple upsell surfaces, but revenue quality, margin path,
              capital intensity, and financing dependency remain material management-data diligence items.
            claimRefs:
              - CI001
              - CI011
              - CI016
          - type: table
            tableRef: TI003
