        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              A third-party profile identifies Krish Ramineni and Sam Udotong as the founders and dates the company's
              start to 2016. Wealthbox independently identifies Ramineni as CEO and co-founder in its April 2025
              partnership announcement, giving the strongest available cross-domain confirmation of current leadership.
              The source pool does not establish a board roster, executive bench beyond the two founders, founder
              ownership, voting control, or material leadership changes. That omission makes key-person dependence
              difficult to quantify: the public narrative and partner-facing representation remain centered on the
              founders, but the evidence is insufficient to infer that operating decisions or customer relationships
              depend on either individual.
