  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from assigned sources places Fireflies highest on workflow breadth, while bot-free and
      privacy-first substitutes cluster higher on capture discretion.
    data:
      xAxis:
        label: Workflow automation / archive breadth (1-5 ordinal)
        min: 1
        max: 5
