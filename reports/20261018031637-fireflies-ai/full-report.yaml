      - number: '1.3'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest numerical financing narrative comes from a low-reputation third-party profile, which reports
              a 2017 seed, a $14 million Series A in 2021, about $19.1 million raised in total, profitability since
              2023, and a 2025 employee-liquidity transaction at a $1 billion valuation. These figures should not be
