  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Public Fireflies materials consistently define the product as an AI meeting assistant that can capture
              conversations across multiple surfaces, then convert them into transcripts, summaries, action items, and
              searchable archives. The key product point is not just a single bot joining scheduled video calls: the
              knowledge-base article and desktop surface together show live bot capture, browser transcription, desktop
              and mobile recording, and uploaded audio or video as supported ingestion paths. Independent explainers
              broadly corroborate this framing, describing Fireflies as a meeting-memory system built around capture,
              transcription, search, and reuse rather than as a narrow point tool for one meeting platform.
            claimRefs:
              - CE001
              - CE002
