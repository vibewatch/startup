chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai presents itself as an AI meeting assistant that captures, transcribes, summarizes, and
              searches conversations across major meeting platforms and in-person recordings. Its official guide
              describes transcripts with speaker labels in more than 100 languages, AI summaries, search, analytics,
              collaboration tools, and integrations with more than 50 applications. Independent reviews describe a
              freemium, per-user SaaS model whose paid tiers add storage, video, CRM sync, conversation intelligence,
              and enterprise controls. This supports a workflow-automation positioning rather than a transcription-only
              identity. The current desktop-download surface also promotes Fireflies Talk for dictation, indicating
              product expansion beyond a meeting bot, though neither that page nor the assigned evidence establishes
              launch timing or adoption.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
              - CO016
