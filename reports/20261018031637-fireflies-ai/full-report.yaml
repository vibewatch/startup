  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The core market is meeting workflow automation
        blocks:
          - type: paragraph
            body: >-
              Fireflies' market boundary starts with recurring workplace conversations, not transcription in the
              abstract. Official material spans live video meetings, in-person capture, uploaded recordings, searchable
              transcripts, summaries, and action items. Comparison sources sharpen the boundary: sales and business
              teams value automatic capture and CRM-connected workflows, while journalists, media producers, and
              researchers may favor upload-first transcription, editing, captions, or clips. The relevant budget
              therefore includes meeting memory, conversation intelligence, and workflow automation. It excludes
              human-certified transcripts, broadcast captioning, general video editing, and full revenue-forecasting
              suites. Fireflies Talk adds a dictation adjacency, but that adjacent surface should not be counted as core
              meeting-assistant demand without usage evidence.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
      - number: '2.2'
        title: Revenue teams lead, while operations and IT shape expansion
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer wedge is sales or revenue operations: retained sources repeatedly connect Fireflies
              with high meeting volume, CRM hygiene, call review, and automated follow-up. Operations and functional
              leaders form a second segment because searchable archives and action-item routing reduce information loss
              across distributed teams. Recruiting and interview workflows appear as narrower applications. At larger
              accounts, the payer can shift toward central IT, security, or shared services because storage, retention,
              access control, and compliance determine whether deployment is permissible. This creates two adoption
              paths: bottoms-up self-service for individuals and teams, and governed rollouts where enterprise controls,
              implementation policy, and procurement approval become prerequisites.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM011
      - number: '2.3'
        title: Observable reach is not a valuation-grade market size
        blocks:
          - type: paragraph
            body: >-
              The pool offers commercial proxies rather than a top-down market model. Company-issued and third-party
              pages repeat usage at more than 500,000 organizations, language coverage above 100 languages, and a
              free-to-paid ladder with publicly reported annual-billing prices. These signals support broad potential
              reach, but each has a denominator problem: an organization count does not disclose paid accounts or seats;
              language coverage is a capability rather than spend; and list price does not reveal realized revenue,
              discounting, retention, or customer mix. No retained source supplies an independent category TAM, SAM,
              SOM, or CAGR. The correct diligence stance is therefore evidence-constrained sizing, with private
              conversion and cohort data required before market scale can support a valuation conclusion.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM014
      - number: '2.4'
        title: Automation and breadth drive adoption; trust and capture friction constrain it
        blocks:
          - type: paragraph
            body: >-
              Category value has moved beyond producing a transcript toward making conversation data operational.
              Fireflies benefits where summaries, search, and action items flow into CRM, collaboration, or knowledge
              systems, and multilingual support expands the eligible user base. The same workflow creates friction: a
              visible bot can change behavior in sensitive calls, consent and retention rules add rollout work, and
              transcript quality can decline with noise, accents, overlapping speakers, jargon, or hybrid-room audio.
              The evidence also contains a product-scope contradiction. Official documentation advertises talk-time,
              monologue, sentiment, topic, and trend analytics, while one competitor-authored review says advanced
              sentiment and speaker-coaching metrics are absent. Plan entitlements, feature definitions, and current
              in-product behavior need direct verification.
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The budget is operational, not merely transcriptional
            body: >-
              Fireflies is most relevant when meeting outputs must become searchable records, CRM updates, or assigned
              actions; generic transcription spend overstates the product's defensible market boundary.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM013
          - type: callout
            title: Public demand proxies cannot support a TAM multiple
            body: >-
              The worker pool lacks an independent market total, paid-seat penetration, conversion, retention, and
              realized pricing, so the apparent breadth of adoption cannot be translated into a reliable revenue
              opportunity.
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segment bias
        blocks:
          - type: paragraph
            body: >-
              The assigned pool points to a crowded landscape rather than a single-headline rival. Fireflies sits in the
              direct AI meeting-assistant set with Otter and Fathom, competes indirectly with bot-free note tools such
              as Granola and Jamie, and still has to displace the status quo of manual notes or basic transcription with
              little workflow automation. The most consistent segmentation signal is not raw transcription quality but
              buyer type: independent review coverage describes Fireflies as a team meeting-intelligence system whose
              analytics, CRM sync, and searchable archive are overbuilt for a solo notetaker, while Fireflies' own
              comparison content clusters substitutes by workflow preference such as free, live-collaboration,
              agenda-centric, or privacy-first usage.
            claimRefs:
              - CP001
              - CP002
