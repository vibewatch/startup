              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Durability, switching costs, and adverse pressure
        blocks:
          - type: paragraph
            body: >-
              Fireflies' moat looks moderate rather than hard to dislodge. Multiple sources converge that it is
              strongest when a buyer wants searchable institutional memory, structured summaries, CRM or collaboration
              workflows, and team analytics together; that bundle is more defensible than transcript generation alone.
              Still, the same evidence set also shows how rivals attack from adjacent angles: privacy-first bot-free
              tools reduce recording friction, generous free tiers compress willingness to pay, and competitor marketing
              explicitly targets Fireflies on hidden-cost and integration-depth objections. Without independent
              win/loss, retention, or migration data, the prudent conclusion is that switching costs exist mainly in
              workflow setup and archive accumulation, not in an irreplaceable core model advantage.
            claimRefs:
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
