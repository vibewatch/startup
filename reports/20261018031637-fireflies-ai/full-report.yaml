  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Fireflies appears to monetize through free acquisition and recurring paid seats, with Pro, Business, and
              Enterprise packaging rather than a disclosed transaction-based or services model. Two independent reviews
              agree on annual list prices of $10 per user per month for Pro, $19 for Business, and $39 for Enterprise,
              while a separate Fireflies-branded but unaffiliated domain displays $18 and $29 monthly plan cards. Those
              figures can coexist as annual and monthly list prices, but the sources do not establish billing mix,
              discounts, realized average selling price, paid-seat count, or recognized revenue. Free-plan storage is
              also inconsistent across reviews, reinforcing that public plan cards are a pricing map rather than audited
              monetization evidence.
            claimRefs:
