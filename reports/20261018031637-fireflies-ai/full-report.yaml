              - CP007
              - CP011
      - number: '3.2'
        title: Capability, pricing, and channel comparison
        blocks:
          - type: paragraph
            body: >-
              Fireflies' documented edge is breadth across the workflow, not a unique capture primitive. Official help
              and product pages show bot, browser, desktop, mobile, and upload capture modes feeding AI summaries,
              archive search, analytics, and broad integrations, while the Microsoft Marketplace listing adds a concrete
              distribution surface for Teams-centric buyers. That breadth raises value for sales, customer-success,
              recruiting, and multilingual teams, but it does not remove entry-level price pressure because both
              company-issued and competitor-issued comparison pages show cheaper or freer alternatives that already
              cover core note capture. The most important commercial caveat is packaging ambiguity: independent and
              competitor-authored sources disagree on the free-plan minute allowance and both highlight AI-credit
              ceilings as a practical limiter.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP013
