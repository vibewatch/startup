      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a directional sequence from founding through funding, reported profitability, a
              partner integration, secondary valuation, and ongoing product expansion. The April 2025 Wealthbox
              integration is the best-dated external milestone: it links transcripts, summaries, contacts,
