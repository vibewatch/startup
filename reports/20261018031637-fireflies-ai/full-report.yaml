      - number: '5.3'
        title: Maturity, controls, and product risks
        blocks:
          - type: paragraph
            body: >-
              Fireflies' official security surface is materially more specific than its public technical architecture
              disclosures. The company claims SOC 2 Type II, GDPR, and HIPAA compliance, private storage, customer data
              ownership, zero data retention with vendors and partners, and encryption at rest and in transit. Those
              controls support enterprise positioning, but they do not answer all underwriting questions about
              production reliability, uptime, incident history, or model performance by language and use case.
              Third-party and competitor writeups also surface the most important practical risks: possible
              transcription degradation with accents or specialized terminology, summaries that can miss context in
              complex conversations, and workflow gaps for buyers who need mandatory, record-by-default governance
              across all meetings.
