  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a plausible activity-to-subscription path, while conversion rates and gross profit remain
      undisclosed.
    data:
      nodes:
        - id: meeting-activity
          label: Meeting activity
          summary: Bots, browser, desktop, mobile, uploads, and connected sources capture conversations.
        - id: ai-processing
          label: Transcription and AI output
          summary: Transcripts, summaries, action items, search, and analytics create user value and processing load.
        - id: free-entry
          label: Free entry
          summary: A no-cost tier supports acquisition, but current storage entitlements differ across reviews.
        - id: paid-seats
          label: Paid seats
          summary: Pro and Business list prices create recurring subscription potential; conversion is undisclosed.
        - id: workflow-expansion
          label: Workflow expansion
          summary: CRM, PM, ATS, Slack, and Teams delivery can increase usage and seat relevance.
        - id: enterprise-uplift
          label: Enterprise uplift
          summary: Security, retention, administration, support, and SLA features create an upsell surface.
        - id: gross-profit
          label: Gross profit unquantified
          summary: No assigned source discloses realized revenue, cost-to-serve, or gross margin.
      edges:
        - from: meeting-activity
          to: ai-processing
          label: creates processing workload
        - from: ai-processing
          to: free-entry
          label: delivers initial value
        - from: free-entry
          to: paid-seats
          label: conversion rate unavailable
        - from: paid-seats
          to: workflow-expansion
          label: integration-led adoption
        - from: workflow-expansion
          to: enterprise-uplift
          label: team and control needs
        - from: enterprise-uplift
          to: gross-profit
          label: revenue less undisclosed service costs
    approximationNotes: Qualitative sequence only; it does not estimate conversion, revenue, ARR, margin, retention, or cash generation.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Fireflies' public product surface stacks meeting capture, intelligence workspace functions, and
      workflow/governance controls.
    data:
      layers:
        - label: Capture surfaces
          detail: Bots and local capture surfaces ingest scheduled, ad hoc, and uploaded meeting content.
          items:
            - Zoom / Google Meet / Teams / Webex bot
            - Chrome extension
            - Desktop / mobile recording
            - Audio / video upload
          modules:
            - Calendar and live-meeting capture
            - In-browser and local recording
          outputs:
            - Transcript input stream
        - label: Transcript and summary pipeline
          detail: Speech-to-text and recap generation turn raw meeting content into structured meeting records.
          modules:
            - Transcript + speaker labels
            - AI summaries + action items
          outputs:
            - Structured meeting record
        - label: Search and knowledge workspace
          detail: Indexed archives are reused through search, AskFred, Notebook, and shareable collaboration features.
          modules:
            - AskFred + meeting search + analytics
            - Notebook + Soundbites + AI Skills
          outputs:
            - Searchable meeting archive
        - label: Workflow integrations
          detail: Meeting outputs sync into collaboration, project, and CRM systems.
          modules:
            - Jira / Asana / Confluence / Slack
            - CRM and other app integrations
          outputs:
            - Tasks and synced notes
        - label: Admin and storage controls
          detail: Enterprise admins can manage access, retention, and storage posture around meeting data.
          modules:
            - Rules Engine + Super Admin
            - Private Storage + custom retention
          outputs:
            - Admin-controlled archives
        - label: Compliance and privacy guardrails
          detail: Compliance claims and data-control language package Fireflies for regulated or security-conscious buyers.
          modules:
            - SOC 2 / GDPR / HIPAA claims
            - Data ownership + zero-retention claims
          outputs:
            - Security and procurement support
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Fireflies' expansion path starts with meeting capture, then moves into search, routing, and analytics inside
      existing customer workflows.
    data:
      items:
        - label: Connect calendar and workspace
          actor: Admin or knowledge worker
          channel: Google or Microsoft calendar
          touchpoints:
            - Connect calendar or manually invite Fireflies to meetings.
            - Detect scheduled meetings before capture begins.
          tone: positive
        - label: Capture meetings across modes
          actor: End user
          channel: Zoom Meet Teams Webex desktop mobile uploads
          touchpoints:
            - Bot-joined live meetings
            - Desktop and mobile recording
            - Uploaded audio or video
          tone: positive
        - label: Generate transcript and summary
          actor: End user
          channel: Fireflies workspace
          touchpoints:
            - Transcript with speaker labels
            - AI summaries and action items
          tone: positive
        - label: Search and query prior conversations
          actor: End user or manager
          channel: AskFred and archive search
          touchpoints:
            - Search exact phrases and topics later.
            - Ask questions across meeting history.
          tone: positive
        - label: Route notes into systems of record
          actor: Team admin
          channel: Microsoft Teams CRM Slack Notion
          touchpoints:
            - Post notes to a Teams team and channel.
            - Sync outputs into collaboration and CRM tools.
          tone: positive
        - label: Expand into analytics and workflow depth
          actor: Functional team lead
          channel: Analytics AI Skills and specialized playbooks
          touchpoints:
            - Conversation analytics and sentiment
            - Workflow-specific summaries and follow-up automation
          tone: neutral
    approximationNotes: >-
      The sequence reflects supported workflow surfaces from reviewed sources, not measured conversion rates between
      stages.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure is highest where consent/privacy trust and platform dependence intersect with limited public
      disclosure.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Residual exposure
      rows:
        - label: Consent & recording compliance
          note: Visible-bot adoption friction plus jurisdiction-specific recording rules can block enterprise rollout early.
          values:
            - label: Medium-High
              tone: warning
            - label: High
              tone: risk
            - label: Medium-High
              tone: warning
              note: Controls exist, but the assigned pool has no public legal-outcome record.
        - label: Security / compliance proof
          note: Official claims are strong, but audit artifacts and independent breach evidence are not present in the pool.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: Medium
              tone: warning
        - label: Bot adoption & UX friction
          note: Buyer pushback can arise before users experience downstream productivity gains.
          values:
            - label: Medium
              tone: warning
            - label: Medium-High
              tone: warning
            - label: Medium
              tone: warning
        - label: Model quality & quota limits
          note: Accuracy degradation and capped AI credits are already described in independent review evidence.
          values:
            - label: Medium
              tone: warning
            - label: Medium-High
              tone: warning
            - label: Medium
              tone: warning
        - label: Platform dependency
          note: Capture and distribution rely on conferencing, messaging, and workflow surfaces outside Fireflies' control.
          values:
            - label: High
              tone: risk
            - label: High
              tone: risk
            - label: Medium-High
              tone: warning
        - label: Disclosure-gap risk
          note: Public evidence does not close concentration, incident-history, or litigation diligence.
          values:
            - label: Medium
              tone: warning
            - label: Medium
              tone: warning
            - label: Medium-High
              tone: warning
    approximationNotes: >-
      Ordinal cells reflect severity ranking from cited public evidence rather than a quantitative incident-probability
      model.
    claimRefs:
      - CR014
      - CR016
      - CR017
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strengthening product breadth and data-moat evidence is offset by opaque pricing quality and a thinly underwritten
      secondary valuation mark.
    data:
      nodes:
        - id: scale
          label: Claimed scale
          note: 500k+ organizations; 75% of Fortune 500; 100+ languages
        - id: breadth
          label: Product breadth
          note: Capture, transcribe, summarize, search, CRM routing, and 2026 dictation extension
        - id: moat
          label: Data-platform moat
          note: CEO frames meeting, transcription, and conversation-intelligence data as the durable asset
        - id: pricing
          label: Monetization opacity
          note: Business-plan pricing is visible, but AI-credit usage and paid-seat mix are not
        - id: mark
          label: Price-support gap
          note: The public >$1B mark came from a tender offer with no disclosed tender mechanics
        - id: decision
          label: Recommendation
          note: Research more unless audited revenue, retention, and cap-table evidence justify the mark
      edges:
        - from: scale
          to: breadth
          label: broadens the story
        - from: breadth
          to: moat
          label: supports platform logic
        - from: moat
          to: pricing
          label: still needs monetization proof
        - from: pricing
          to: mark
          label: limits underwriting
        - from: mark
          to: decision
          label: drives the call
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV014
