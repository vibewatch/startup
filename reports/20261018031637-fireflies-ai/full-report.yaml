          - type: callout
            title: Underwrite from cohorts and cash flow
            body: >-
              Require plan-level cohorts, realized pricing, cost-to-serve, retention, and a current cash bridge before
              assigning value to the apparent recurring model.
            calloutType: recommendation
            claimRefs:
