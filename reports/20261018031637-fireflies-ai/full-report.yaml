  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments, users, and capture surfaces
        blocks:
          - type: paragraph
            body: >-
              Fireflies positions itself as horizontal meeting infrastructure rather than a single-purpose note app.
              Official documentation says customers can capture conversations through bot-joined live meetings, browser,
              desktop, mobile, uploads, and integrations, while Metaview's competitor analysis describes the product as
              useful across sales, recruiting, customer success, and internal meetings instead of going deepest on one
              workflow. That combination suggests broad buyer and user appeal, but public materials are better at
              describing addressable personas and workflow fit than at quantifying how much revenue each segment
              contributes.
            claimRefs:
              - CU001
              - CU002
              - CU011
