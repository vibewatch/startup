        title: Architecture, integrations, and operating model
        blocks:
          - type: paragraph
            body: >-
              The visible architecture is best understood as three layers: capture surfaces, an intelligence workspace,
              and workflow activation. Capture starts with bots and local recording clients, then moves into transcript,
              summary, search, analytics, and notebook functions, and finally pushes outcomes into business tools. The
              engineering use-case page makes that activation layer concrete by tying meetings to Jira, Asana,
              Confluence, and Slack, while the CheckThat profile adds third-party corroboration that integrations and
              API access are part of the commercial product. What remains notably unexposed in the assigned evidence is
              the deeper technical substrate: there is no public model-stack disclosure, benchmark methodology, or
              public developer signal proving how differentiated the underlying AI stack is.
            claimRefs:
