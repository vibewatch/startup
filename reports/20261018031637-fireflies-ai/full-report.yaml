          assigned sources.
      yAxis:
        label: Capture flexibility / privacy posture (1-5 ordinal)
        min: 1
        max: 5
        lowLabel: Bot-led / lower privacy emphasis
        highLabel: Bot-free / higher privacy emphasis
        description: >-
          Ordinal score based on documented bot-free options, upload/mobile breadth, and stated privacy controls in the
          assigned sources.
      points:
