      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Sales and revenue
        - Sales leadership or RevOps
        - Account executives, CSMs, and managers
        - Sales organization
        - Capture calls, update CRM, and review conversation patterns
        - RevOps or sales leader
        - High call volume and poor CRM hygiene
      - - Operations and collaboration
        - Operations manager or functional leader
        - Cross-functional meeting participants
        - Department
        - Search meeting history and route summaries and actions
        - Department or workplace operations
        - Missed follow-ups across distributed teams
      - - Recruiting
        - Recruiting lead
        - Recruiters and hiring managers
        - Talent organization
        - Capture interviews and share structured records
        - Talent acquisition or recruiting operations
        - Manual interview documentation burden
      - - Global teams
        - Regional or functional leader
        - Multilingual meeting participants
        - Department or central collaboration budget
        - Transcribe meetings across 100+ supported languages
        - Functional leader or IT
        - Cross-language meeting volume
      - - Enterprise-governed accounts
        - CIO, security owner, or IT admin
        - Workspace administrators and employees
        - Central IT or shared services
        - Enforce retention, storage, access, and compliance controls
        - IT, security, or procurement
        - Policy approval before broad deployment
    notes: >-
      Buyer and payer roles are inferred from product positioning and review
      evidence; the pool contains no direct customer budget-owner survey.
    claimRefs: [CM003, CM005, CM006, CM007, CM011]
figures:
  - id: FM001
    title: Evidence-constrained market access signals
    type: pyramid
    summary: >-
      Public evidence shows reach, product breadth, and trust filters but does
      not establish a conventional TAM, SAM, or SOM.
    data:
      items:
        - label: Installed-base signal
          displayValue: 500k+ organizations
          unit: vendor-reported organizations
          detail: The public figure does not distinguish paid from free use.
          claimRefs: [CM004]
        - label: Language breadth
          displayValue: 100+ languages
          unit: supported transcription languages
          detail: Capability breadth widens eligibility but is not market spend.
          claimRefs: [CM003]
        - label: Capture breadth
          displayValue: Live, in-person, and uploads
          unit: capture modes
          detail: Multiple modes broaden use beyond scheduled video calls.
          claimRefs: [CM002]
        - label: Workflow breadth
          displayValue: 50+ apps
          unit: advertised integrations
          detail: Routing meeting data into work systems is a key adoption mechanism.
          claimRefs: [CM005]
        - label: Trust filter
          displayValue: SOC 2, GDPR, and HIPAA
          unit: advertised compliance frameworks
          detail: Enterprise controls can unlock procurement while increasing rollout work.
          claimRefs: [CM011]
        - label: Valuation-grade market size
          displayValue: Unavailable
          unit: TAM, SAM, SOM, and CAGR
          detail: No assigned source supplies an independent bounded market estimate.
          claimRefs: [CM014]
    approximationNotes: >-
      Ordered as commercial evidence layers, not value-proportional tiers.
      Organization, language, integration, and compliance figures have different
      units and must not be summed or interpreted as conversion stages.
    claimRefs: [CM002, CM003, CM004, CM005, CM011, CM014]
