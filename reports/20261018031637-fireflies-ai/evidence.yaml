evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, ARR, profitability, gross margin, cash flow, current cash, and revenue-recognition definitions.
    whyItMatters: >-
      The capital-efficiency narrative and valuation cannot be underwritten from a third-party profile or funding
      totals.
    diligencePath: >-
      Obtain audited financial statements, monthly recurring-revenue bridges, bank statements, and board-approved
      forecasts.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board rosters, founder ownership, voting rights, investor stakes, succession coverage, and
      material leadership changes.
    whyItMatters: >-
      Governance quality, control, investor influence, and key-person concentration cannot be assessed from two named
      founders.
    diligencePath: >-
      Request the current cap table, charter, board minutes, option plan, organization chart, and executive employment
      agreements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Definitions, measurement dates, and paid-versus-free denominators for the 1M+ company and 500k+ organization
      claims.
    whyItMatters: Unreconciled marketing figures cannot support customer count, penetration, monetization, or retention analysis.
    diligencePath: >-
      Request billing-system account counts, active paid workspaces, seats, usage cohorts, and metric-definition
      documentation.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: milestones
    missingEvidence: >-
      Primary documents and independent corroboration for founding, financing, profitability, and the 2025 secondary
      tender.
    whyItMatters: Most historical milestones currently depend on a single low-reputation profile.
    diligencePath: >-
      Obtain incorporation and financing documents, investor announcements, tender materials, and audited financial
      evidence.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent TAM, SAM, SOM, category CAGR, and segment-spend estimates bounded specifically to AI meeting
      assistants or conversation workflow software.
    whyItMatters: >-
      Adoption proxies cannot establish the revenue pool available to Fireflies or justify a market-size component in
      valuation.
    diligencePath: >-
      Obtain named analyst datasets or public-company disclosures with market definitions, geography, period,
      methodology, and spend denominators.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Paid organizations, paid seats, plan mix, realized ARPU, discounts, free-to-paid conversion, retention, and
      expansion by cohort.
    whyItMatters: Public list prices and organization counts do not reveal how much apparent reach converts into durable revenue.
    diligencePath: >-
      Request cohort conversion, seat, pricing, retention, and expansion schedules from management and reconcile them to
      audited revenue.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: analytics-scope
    missingEvidence: >-
      Current plan-by-plan entitlement and in-product verification for sentiment, talk-time, interruption, and
      speaker-coaching analytics.
    whyItMatters: >-
      Conflicting descriptions prevent a reliable assessment of differentiation and may reflect feature-definition or
      plan-entitlement differences.
    diligencePath: >-
      Run a current product trial across Pro, Business, and Enterprise, and obtain the dated feature matrix from
      Fireflies.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: free-plan-packaging
    missingEvidence: >-
      A current official pricing page that unambiguously states the free-tier minute allowance and how AI credits are
      metered.
    whyItMatters: >-
      Free-tier clarity shapes buyer trial behavior and determines whether price objections appear before product
      differentiation can be demonstrated.
    diligencePath: >-
      Re-verify the live pricing page and in-product plan details, then reconcile minute, storage, and AI-credit
      language against independent reviews.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Independent buyer interviews, win-loss studies, or retention data showing whether teams migrate off rivals or keep
      multiple note tools.
    whyItMatters: >-
      Without independent switching evidence, moat claims rely on product-surface breadth rather than observed buyer
      lock-in.
    diligencePath: >-
      Request cohort retention, competitive displacement examples, and customer references that explain why teams
      standardize on Fireflies instead of multi-homing.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue, ARR definition, paid-seat count, realized ASP, discounts, billing mix, and plan-level revenue
      recognition.
    whyItMatters: >-
      List prices do not establish revenue scale, recurring quality, or the relationship between bookings, ARR, and
      accounting revenue.
    diligencePath: >-
      Request audited revenue schedules, ARR policy, billing data, paid-seat counts, and realized pricing by plan and
      cohort.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Plan-level COGS, gross margin, CAC, sales cycle, payback, churn, gross retention, NRR, and expansion.
    whyItMatters: >-
      The apparent recurring model cannot be valued without cost-to-serve, acquisition efficiency, and cohort
      durability.
    diligencePath: Request cohort P&Ls and retention schedules by plan, segment, geography, and acquisition channel.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway, debt, covenants, contractual obligations, planned use of funds, and next-round
      trigger.
    whyItMatters: Funding history and product pricing do not establish cash available or forward financing dependency.
    diligencePath: >-
      Request current bank balances, a monthly cash bridge, debt and obligations schedules, board plan, and downside
      runway cases.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: public-metric-definitions
    missingEvidence: >-
      A current pricing and KPI definition sheet reconciling free storage, active organizations, companies, workspaces,
      and paid customers.
    whyItMatters: Conflicting public entitlements and adoption denominators cannot support conversion, revenue, or cost estimates.
    diligencePath: >-
      Obtain dated plan entitlements and monthly active, paying, and enterprise customer counts using explicit
      denominators.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: technical-proof-gap
    missingEvidence: >-
      Public developer-signal, benchmark methodology, API depth documentation, or source-level technical artifacts that
      verify the underlying AI stack and integration quality.
    whyItMatters: >-
      Product breadth is visible, but technical differentiation and implementation maturity are harder to underwrite
      without external proof points.
    diligencePath: >-
      Request architecture review materials, public or customer-facing API/docs depth, benchmark methodology, and any
      verifiable public developer or partner adoption signal.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability-observability
    missingEvidence: >-
      Public uptime, incident history, latency/error-rate telemetry, and support SLA evidence for production
      deployments.
    whyItMatters: >-
      Enterprise workflow dependence is easier to assess when reliability and support performance are externally visible
      rather than only marketed.
    diligencePath: >-
      Request historical uptime/SLA reporting, incident summaries, support response metrics, and customer references
      that speak to reliability at scale.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: model-performance
    missingEvidence: Accuracy testing by language, jargon density, speaker overlap, and complex-summary use cases.
    whyItMatters: >-
      Third-party critiques specifically target transcription and summary quality edge cases, which directly affect the
      product's value in technical or regulated settings.
    diligencePath: >-
      Ask for benchmark methodology, cohort-level quality dashboards, and customer evidence segmented by language mix,
      call type, and workflow criticality.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: retention-visibility
    missingEvidence: Public NRR, GRR, churn, renewal, and contract-length metrics by plan or cohort.
    whyItMatters: Durability and expansion quality cannot be judged from adoption counts or testimonials alone.
    diligencePath: >-
      Request cohort retention tables, renewal rates, and contract-term distributions from management or a data room
      export.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: concentration-visibility
    missingEvidence: Top-customer revenue share, channel dependence, and paid-versus-free account mix.
    whyItMatters: Customer concentration and monetization quality drive downside risk and valuation support.
    diligencePath: Request a customer concentration schedule, free-to-paid conversion data, and segment revenue mix from finance.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Independent named case studies with deployment dates, outcomes, and renewal context beyond company-hosted quotes.
    whyItMatters: Current named references show usage, but not enough third-party validation to establish durable production depth.
    diligencePath: >-
      Ask for reference calls or public customer stories hosted by the customer, procurement record, or partner rather
      than by Fireflies alone.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-incident-history
    missingEvidence: >-
      Any public litigation, enforcement, complaint, or disclosed incident record tied to Fireflies' recording, privacy,
      or data-processing practices.
    whyItMatters: >-
      Without outcome-level evidence, privacy and trust risk must be underwritten from policy language and third-party
      commentary rather than realized-case history.
    diligencePath: >-
      Request litigation / complaint schedule, incident history, security questionnaires, and customer notice templates
      by deployment region.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: enterprise-assurance
    missingEvidence: >-
      Current SOC 2 report, HIPAA documentation, DPA, subprocessors, penetration-test summary, and data-retention
      configuration details.
    whyItMatters: Enterprise sales durability depends on whether public control claims withstand detailed customer security review.
    diligencePath: >-
      Obtain the latest security packet, confirm vendor-retention settings, and test customer-configured storage and
      deletion workflows.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
    topic: concentration-and-partner-dependence
    missingEvidence: >-
      Customer concentration, platform mix, partner concentration, renewal data, and revenue contribution by major
      capture or integration surface.
    whyItMatters: >-
      The downside case is more sensitive if growth or retention depends disproportionately on a few platforms,
      workflows, or enterprise accounts.
    diligencePath: >-
      Request cohort retention, net retention, top-account exposure, partner-attachment metrics, and capture-mode usage
      by product tier.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: underwriting-gap
    missingEvidence: Audited ARR, gross margin, paid-seat mix, and net revenue retention by cohort or segment.
    whyItMatters: >-
      Without audited monetization quality, usage and customer-count claims cannot support a defensible software
      valuation multiple.
    diligencePath: >-
      Request audited or board-level KPI packs, customer cohort data, and revenue-recognition definitions during
      management diligence.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: tender-offer
    missingEvidence: >-
      Tender price per share, seller mix, discount to preferred/common, liquidation preferences, and any
      secondary-market intermediaries.
    whyItMatters: >-
      The headline valuation came from a tender offer, so common-share economics and downside protection cannot be
      inferred from the headline alone.
    diligencePath: Obtain the tender memorandum, cap table, share class terms, and board approvals before underwriting entry price.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Public evidence on exit timing, enterprise conversion, churn, and free-to-paid conversion remains incomplete.
    whyItMatters: Exit readiness depends on durable monetization and retention, not just product breadth or usage-scale claims.
    diligencePath: >-
      Ask management for enterprise cohort retention, win/loss data, pipeline composition, and free-to-paid conversion
      trends.
    relatedQuestionRefs:
      - QV008
