  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: underwriting-gap
      missingEvidence: Audited ARR, gross margin, paid-seat mix, and net revenue retention by cohort or segment.
      whyItMatters: Without audited monetization quality, usage and customer-count claims cannot support a defensible software valuation multiple.
      diligencePath: Request audited or board-level KPI packs, customer cohort data, and revenue-recognition definitions during management diligence.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: tender-offer
      missingEvidence: Tender price per share, seller mix, discount to preferred/common, liquidation preferences, and any secondary-market intermediaries.
      whyItMatters: The headline valuation came from a tender offer, so common-share economics and downside protection cannot be inferred from the headline alone.
      diligencePath: Obtain the tender memorandum, cap table, share class terms, and board approvals before underwriting entry price.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Public evidence on exit timing, enterprise conversion, churn, and free-to-paid conversion remains incomplete.
      whyItMatters: Exit readiness depends on durable monetization and retention, not just product breadth or usage-scale claims.
      diligencePath: Ask management for enterprise cohort retention, win/loss data, pipeline composition, and free-to-paid conversion trends.
      relatedQuestionRefs: [QV008]
