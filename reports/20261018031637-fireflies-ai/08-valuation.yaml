    rows:
      - [Recommendation, research-more, "Interesting business; price support still incomplete", "Do not underwrite the current mark without deeper diligence"]
      - [Confidence, medium, "Product breadth and capital efficiency are visible; valuation inputs are not", "Enough evidence for caution, not enough for a buy"]
      - [Risk rating, high, "Secondary-set unicorn pricing plus opaque monetization and legal/privacy friction", "Demand downside protection or more evidence"]
      - [Valuation stance, stretched, "Public mark is >$1B while tender terms and audited revenue remain undisclosed", "Entry must improve or evidence must harden"]
      - [Target return / hold / exit, "Not supportable from public evidence", "No audited ARR, retention, or cap-table detail to model a reliable outcome", "Keep the case in watchlist or diligence mode"]
    notes: >-
      Snapshot synthesized from public product, pricing, and financing evidence; the table
      intentionally avoids a numeric target return because the available sources do not disclose
      audited revenue, retention, or tender economics.
    claimRefs: [CV004, CV005, CV006, CV007, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Support
      - What would change the view
    rows:
      - ["Fireflies has broadened beyond transcription into searchable summaries, integrations, and adjacent workflow capture.", thesis, "Official product docs plus third-party guides describe multi-surface capture and search.", "Paid-seat and expansion data show that breadth converts into durable monetization."]
      - ["The company appears capital efficient for its stated scale and valuation, with a small disclosed fundraising base and claimed profitability since 2023.", thesis, "WebTribunal reports about $19M raised, no primary capital since 2021, and profitability since 2023.", "Audited financials confirm margin quality rather than one-off efficiency claims."]
      - ["Management argues the moat is proprietary meeting, transcription, and conversation-intelligence data layered with LLMs.", thesis, "Slator quotes the CEO framing existing data assets as the differentiator.", "Customer retention, data-network effects, and competitive win rates support that moat in practice."]
      - ["Public price support is weak because the >$1B mark came from a tender offer and independent pricing evidence also points to credit-metered monetization friction.", anti-thesis, "WebTribunal describes the tender structure; Laxis and Clarigital describe plan pricing and AI-credit usage.", "Tender terms, paid-seat mix, and audited ARR show the mark is justified on fundamentals rather than scarcity."]
    notes: >-
      This table mixes company, independent, and competitor evidence to separate business quality
      from entry price support.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Enterprise conversion rises, AI-credit upsell expands ARPU, and the broader workflow story increases share of wallet.", "A premium software multiple could be defensible if audited growth, retention, and margins match the platform narrative.", "Bot friction, consent concerns, or weak free-to-paid conversion prevent monetization from catching usage.", "Requires audited ARR, NRR, and cap-table evidence materially better than what is public today."]
      - [Base, "Fireflies remains a strong product with real adoption, but monetization and retention stay only partially proven in public.", "The company can merit continued tracking, but price discipline should stay tight until underwriting inputs are disclosed.", "Secondary pricing outruns fundamentals; credit complexity limits durable seat expansion.", "Best fit with current evidence."]
      - [Bear, "Usage scale is real but monetization is thinner than company-scale claims imply, and tender pricing overstates common-share economics.", "A down-round, flat round, or long illiquid hold becomes plausible because public evidence does not yet clear a unicorn benchmark.", "Legal/privacy or competitive pressure slows enterprise adoption while AI-cost pressure compresses margins.", "Would gain weight if diligence finds low paid conversion, weak retention, or adverse tender preferences."]
    notes: >-
      Scenario ranges are qualitative because the chapter's public evidence does not disclose the
      audited operating metrics needed for defensible numerical valuation bands.
    claimRefs: [CV004, CV005, CV006, CV007, CV009, CV011, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strengthening product breadth and data-moat evidence is offset by opaque pricing quality and a thinly underwritten secondary valuation mark.
    data:
      nodes:
        - id: scale
          label: Claimed scale
          note: "500k+ organizations; 75% of Fortune 500; 100+ languages"
        - id: breadth
          label: Product breadth
          note: "Capture, transcribe, summarize, search, CRM routing, and 2026 dictation extension"
        - id: moat
          label: Data-platform moat
          note: "CEO frames meeting, transcription, and conversation-intelligence data as the durable asset"
        - id: pricing
          label: Monetization opacity
          note: "Business-plan pricing is visible, but AI-credit usage and paid-seat mix are not"
        - id: mark
          label: Price-support gap
          note: "The public >$1B mark came from a tender offer with no disclosed tender mechanics"
        - id: decision
          label: Recommendation
          note: "Research more unless audited revenue, retention, and cap-table evidence justify the mark"
      edges:
        - from: scale
          to: breadth
          label: broadens the story
        - from: breadth
          to: moat
          label: supports platform logic
        - from: moat
          to: pricing
          label: still needs monetization proof
        - from: pricing
          to: mark
          label: limits underwriting
        - from: mark
          to: decision
          label: drives the call
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV008, CV014]
callouts:
  - calloutType: recommendation
    title: Current call
    body: >-
      Fireflies is investable to study further, but not yet investable to underwrite at a public
      $1B-plus mark from the evidence available here.
    claimRefs: [CV006, CV014]
  - calloutType: risk
    title: Main underwriting risk
    body: >-
      The valuation signal is secondary-market based and the public record still lacks audited
      ARR, retention, and tender economics.
    claimRefs: [CV006, CV007, CV014]
  - calloutType: assumption
    title: What would upgrade the view
    body: >-
      A stronger recommendation would require audited monetization proof plus evidence that the
      broader AI workflow, not just raw usage scale, is driving high-quality enterprise expansion.
    claimRefs: [CV005, CV008, CV012, CV014]
