schemaVersion: "report-v2"
artifact: financials
slug: fireflies-ai
runDate: 2026-10-18
company:
  name: "Fireflies.ai"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    The public evidence supports a freemium, per-seat software model with visible
    upgrade levers in analytics, integrations, storage, administration, and security.
    It does not disclose recognized revenue, ARR, gross margin, retention, acquisition
    efficiency, cash, burn, runway, or debt, so attractive list pricing cannot yet be
    converted into an underwriting-grade view of revenue quality or capital adequacy.
sections:
  - id: revenue-model-and-pricing
    title: "Revenue model and pricing"
    body: >-
      Fireflies appears to monetize through free acquisition and recurring paid seats,
      with Pro, Business, and Enterprise packaging rather than a disclosed
      transaction-based or services model. Two independent reviews agree on annual
      list prices of $10 per user per month for Pro, $19 for Business, and $39 for
      Enterprise, while a separate Fireflies-branded but unaffiliated domain displays
      $18 and $29 monthly plan cards. Those figures can coexist as annual and monthly
      list prices, but the sources do not establish billing mix, discounts, realized
      average selling price, paid-seat count, or recognized revenue. Free-plan storage
      is also inconsistent across reviews, reinforcing that public plan cards are a
      pricing map rather than audited monetization evidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: distribution-and-service-economics
    title: "Distribution and service economics"
    body: >-
      The observable go-to-market motion is product-led and integration-assisted.
      Official materials describe capture through meeting bots, browser, desktop,
      mobile, file upload, and connected recording sources, followed by transcripts,
      summaries, action items, and delivery into more than 50 workflow applications.
      A Microsoft Marketplace listing adds a Teams distribution surface, but its
      supplier-authored copy is company evidence hosted by a partner, not independent
      proof of channel productivity. The same workflow exposes likely cost pools:
      speech processing, generative summaries, storage, integration maintenance,
      security, and enterprise support. None of the assigned sources quantifies those
      costs, sales cycle, CAC, payback, or channel economics.
    claimRefs: [CI008, CI009, CI010, CI011]
  - id: traction-and-monetization-risk
    title: "Public traction and monetization risk"
    body: >-
      Public adoption claims are not sufficiently reconciled to serve as a revenue
      denominator. The unaffiliated Fireflies-branded site claims more than one million
      companies, while the official security page claims more than 500,000
      organizations; neither defines active, paying, enterprise, or workspace status.
      Independent review evidence also identifies monetization friction: ToolChase
      reports weaker transcription performance for some accents, and Clarigital says
      capped AI credits can be exhausted by heavy users before month-end. These points
      do not prove churn or margin compression, but they identify the product quality
      and usage-allocation questions that cohort data must resolve.
    claimRefs: [CI012, CI013, CI014, CI015]
  - id: capital-adequacy-and-verdict
    title: "Capital adequacy and financial verdict"
    body: >-
      Capital adequacy cannot be inferred from the available financial evidence. The
      assigned pool contains no current cash balance, operating cash burn, debt or
      covenant schedule, runway calculation, planned use of funds, or next-round
      trigger. It also contains no recognized revenue, ARR, gross margin, CAC payback,
      churn, or net revenue retention. Funding raised elsewhere should not be treated
      as cash available today, and revenue should not be relabeled as ARR. The
      defensible verdict is therefore narrow: Fireflies has credible recurring-price
      architecture and multiple upsell surfaces, but revenue quality, margin path,
      capital intensity, and financing dependency remain material management-data
      diligence items.
    claimRefs: [CI001, CI011, CI016]
    tableRefs: [TI003]
callouts:
  - calloutType: risk
    title: "List pricing is not realized economics"
    body: >-
      Public plan prices show monetization intent, not recognized revenue, ARR,
      discounting, paid-seat mix, gross margin, retention, or cash generation.
    claimRefs: [CI002, CI003, CI004, CI016]
  - calloutType: recommendation
    title: "Underwrite from cohorts and cash flow"
    body: >-
      Require plan-level cohorts, realized pricing, cost-to-serve, retention, and a
      current cash bridge before assigning value to the apparent recurring model.
    claimRefs: [CI011, CI016]
