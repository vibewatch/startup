callouts:
  - calloutType: "insight"
    title: "The moat is adjacency, not raw transcription"
    body: "Across the assigned pool, Fireflies stands out most when a buyer wants archive search, analytics, and CRM-connected follow-through layered on top of meeting notes; basic note capture alone looks increasingly commoditized."
    claimRefs: [CP004, CP012, CP013]
