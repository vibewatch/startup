      whyItMatters: "Free-tier clarity shapes buyer trial behavior and determines whether price objections appear before product differentiation can be demonstrated."
      diligencePath: "Re-verify the live pricing page and in-product plan details, then reconcile minute, storage, and AI-credit language against independent reviews."
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
