      - ["Fireflies Business", "$19 annual or $29 monthly per seat", "Conversation intelligence, team analytics, and video-oriented workflow breadth", "This is where team-level differentiation turns on, but it raises all-in seat spend", "Fireflies' bundle competes best when a buyer values analytics and archive intelligence, not just notes"]
