      severity: "material"
      topic: "switching-costs"
      missingEvidence: "Independent buyer interviews, win-loss studies, or retention data showing whether teams migrate off rivals or keep multiple note tools."
      whyItMatters: "Without independent switching evidence, moat claims rely on product-surface breadth rather than observed buyer lock-in."
      diligencePath: "Request cohort retention, competitive displacement examples, and customer references that explain why teams standardize on Fireflies instead of multi-homing."
      relatedQuestionRefs: [QP008]
