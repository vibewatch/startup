    rows:
      - [Organizations using Fireflies claimed by company, 500k+ organizations, 2026-10 access, Fireflies security page, Broad top-of-funnel reach is part of the enterprise pitch, No paid-versus-free split active-account definition or contract count]
      - [External restatement of official reach, 500000+ companies and 75% of Fortune 500 companies, April 2026 review, Clarigital citing Fireflies website, Outside guides repeat Fireflies' scale story and brand reach, Not independently audited and Fortune 500 usage is not defined]
      - [Independent hands-on usage proxy, 24 meetings over 3 weeks, 2026 review, Lindy hands-on review, Reviewer used the product enough to test recurring workflow value, Single reviewer with no team adoption or renewal data]
