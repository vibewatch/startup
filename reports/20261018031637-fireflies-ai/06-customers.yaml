    notes: This table uses public adoption snapshots and workflow proxies because reviewed sources do not provide a time series for active accounts, paying logos, or cohort retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [PR Labs, PR / agency team, Internal meeting structure and transparency, Production implied, "\"Fireflies brought more structure in our meetings and more transparency within our company.\"", Company-hosted testimonial with no user count contract size or duration]
      - [Flock, Team operations, Team conversation analytics, Production implied, "\"Impressed by Fireflies' analytics. It helps tracks my team conversations.\"", Company-hosted testimonial with no quantified deployment scope]
      - [Clara, Customer-facing operations, Reducing follow-up calls with customers, Production implied, "\"Fireflies cuts down on additional calls with customers, letting us focus directly on solutions.\"", Company-hosted testimonial and no proof of renewal or spend]
      - [Phyllo, Customer-insight workflow, Understanding customer needs from conversations, Production implied, "\"Super impressed with how Fireflies helps us analyze what our customers actually need!\"", Company-hosted testimonial with no segment economics or reference date]
      - [Marketing agency / creator user, Small-team meeting workflow across sales onboarding and internal syncs, 33 meetings in 30 days, Production-like independent use, Reported ~3.5 hours saved per week and 27/33 calls auto-summarized, Single public reviewer also reported speaker-labeling issues]
      - [Knowledge-worker reviewer, Mixed Zoom Meet and Teams workflow, 24 meetings over 3 weeks, Production-like independent use, Transcript and search were useful on clear-audio calls with few speakers, Reviewer still checked recordings for crosstalk accents and sensitive details]
    notes: Coverage is partial and mixes company-hosted testimonials with two public user reviews; rows show real usage signals but do not establish customer concentration, contract value, or long-term retention.
    enumerationScope:
      coverage: partial
      basis: Publicly named references and hands-on public reviews retained in the assigned source pool as of the 2026-10-18 run.
    claimRefs: [CU007, CU009, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Fireflies' expansion path starts with meeting capture, then moves into search, routing, and analytics inside existing customer workflows.
    data:
      items:
        - label: Connect calendar and workspace
          actor: Admin or knowledge worker
          channel: Google or Microsoft calendar
          touchpoints:
            - Connect calendar or manually invite Fireflies to meetings.
            - Detect scheduled meetings before capture begins.
          tone: positive
        - label: Capture meetings across modes
          actor: End user
          channel: Zoom Meet Teams Webex desktop mobile uploads
          touchpoints:
            - Bot-joined live meetings
            - Desktop and mobile recording
            - Uploaded audio or video
          tone: positive
        - label: Generate transcript and summary
          actor: End user
          channel: Fireflies workspace
          touchpoints:
            - Transcript with speaker labels
            - AI summaries and action items
          tone: positive
        - label: Search and query prior conversations
          actor: End user or manager
          channel: AskFred and archive search
          touchpoints:
            - Search exact phrases and topics later.
            - Ask questions across meeting history.
          tone: positive
        - label: Route notes into systems of record
          actor: Team admin
          channel: Microsoft Teams CRM Slack Notion
          touchpoints:
            - Post notes to a Teams team and channel.
            - Sync outputs into collaboration and CRM tools.
          tone: positive
        - label: Expand into analytics and workflow depth
          actor: Functional team lead
          channel: Analytics AI Skills and specialized playbooks
          touchpoints:
            - Conversation analytics and sentiment
            - Workflow-specific summaries and follow-up automation
          tone: neutral
    approximationNotes: The sequence reflects supported workflow surfaces from reviewed sources, not measured conversion rates between stages.
    claimRefs: [CU001, CU002, CU004, CU015]
