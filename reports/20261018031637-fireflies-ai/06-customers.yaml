chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports broad top-of-funnel adoption for Fireflies.ai across sales,
    recruiting, customer success, and internal collaboration workflows, with Microsoft Teams
    distribution and many integrations reducing deployment friction. The strongest durable proof
    in this chapter comes from workflow evidence, named but company-hosted testimonials, and two
    hands-on external reviews; public sources still do not disclose retention, paid-versus-free
    mix, or customer concentration, so customer quality is easier to verify than customer
    economics.
sections:
  - id: segmentation-and-capture
    title: Segments, users, and capture surfaces
    body: >-
      Fireflies positions itself as horizontal meeting infrastructure rather than a single-purpose
      note app. Official documentation says customers can capture conversations through bot-joined
      live meetings, browser, desktop, mobile, uploads, and integrations, while Metaview's
      competitor analysis describes the product as useful across sales, recruiting, customer
      success, and internal meetings instead of going deepest on one workflow. That combination
      suggests broad buyer and user appeal, but public materials are better at describing
      addressable personas and workflow fit than at quantifying how much revenue each segment
      contributes.
    claimRefs: [CU001, CU002, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-deployment-proof
    title: Adoption signals and deployment proof
    body: >-
      The clearest public adoption signals are distribution and workflow proofs rather than
      audited cohort data. Fireflies' help and security surfaces claim large organizational
      reach, while Microsoft Marketplace independently confirms that the product can post
      transcripts, recordings, and notes directly into Teams channels after meetings. External
      review coverage repeats the company's large-customer-base claims, but those counts are
      still company-originated and do not separate paid customers, active users, or free
      accounts today.
    claimRefs: [CU003, CU004, CU005, CU006, CU015]
    tableRefs: [TU002]
  - id: reference-quality-and-user-feedback
    title: Named references, practitioner feedback, and adoption friction
    body: >-
      Reference quality is mixed. Fireflies does offer named customer logos and testimonial
      quotes, and independent reviewers describe meaningful day-to-day utility around searchable
      transcripts, summaries, and follow-up automation. But the strongest named references in
      reviewed public material are still company-hosted testimonials, while the two public
      hands-on reviews also highlight speaker-labeling errors, accent and crosstalk weakness,
      transcript lag, and the need to manually verify sensitive details before treating summaries
      as authoritative. This makes usage proof credible, but durability proof conditional.
    claimRefs: [CU007, CU008, CU009, CU010, CU012]
    tableRefs: [TU003]
  - id: durability-and-concentration-gaps
    title: Durability, expansion, and concentration remain under-disclosed
    body: >-
      The expansion thesis is plausible because Fireflies sits inside collaboration and CRM
      workflows and layers analytics, AI Skills, and Teams distribution on top of basic
      transcription. However, the reviewed public sources do not disclose renewal rates, NRR,
      GRR, churn, contract lengths, top-customer exposure, or the paid-versus-free mix behind
      the headline customer counts. Investors can therefore verify that users adopt the
      workflow, but not whether the best customers stay, expand, or concentrate revenue risk
      over time across segments and pricing tiers.
    claimRefs: [CU002, CU004, CU013, CU014, CU015]
