  - id: TV001
    title: 建议摘要表
    columns:
      - 指标
      - 评估
      - 证据
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 业务有意思，但价格支撑仍不完整
        - 没有更深入的尽调，不要按当前估值做投资判断
      - - 信心
        - medium
        - 产品广度和资本效率可见，但估值输入不可见
        - 证据足以保持谨慎，不足以买入
      - - 风险评级
        - high
        - 二级市场独角兽定价，加上变现不透明以及法律 / 隐私摩擦
        - 要求下行保护或更多证据
      - - 估值立场
        - stretched
        - 公开估值超过 $1B，但要约条款和经审计收入仍未披露
        - 入场价格必须改善，或证据必须变硬
      - - 目标回报 / 持有 / 退出
        - 公开证据无法支持
        - 没有经审计的 ARR、留存或股权表细节，无法建立可靠结果模型
        - 将该项目留在观察名单或尽调状态
    notes: 本表综合公开产品、定价和融资证据；由于现有来源未披露经审计的收入、留存或要约收购经济数据，因此刻意不设数字化目标回报。
