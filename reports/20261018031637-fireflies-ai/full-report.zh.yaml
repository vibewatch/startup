            title: 资本效率是投资假设，尚非经审计事实
            body: >-
              据报道累计融资约 $19.1M、自 2023 年起盈利且二级估值达
              $1B，这一组合将体现异常高的资本效率。指定来源池的三项信息都追溯到同一份低信誉简介，因此在将这一叙事用于投资判断前，必须取得一级融资记录和经审计的经营证据。
