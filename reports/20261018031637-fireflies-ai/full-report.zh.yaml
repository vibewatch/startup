      - number: '8.2'
        title: 融资背景与情景框架
        blocks:
          - type: paragraph
            body: >-
              这段融资故事同时具有建设性和警示性。建设性在于，WebTribunal 的综合称 Fireflies 仅融资约 $19 million 就达到 $1 billion-plus 估值，并称公司自 2023
              年起盈利；对 AI 应用业务而言，这种资本效率很少见。警示来自缺失信息和可见的变现信号。同一来源称估值由没有新增一级资本的要约交易确定，而独立定价页面显示 Business 套餐约每月
              $29，重度使用则另行按量计费 AI 积分。由于没有公开披露付费席位结构、积分使用、收入确认或要约条款，牛市、基准和熊市情景应表述为方向性概率信号，而不是伪精确的公允价值。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.3'
        title: 退出准备度、尽调要求与假设破坏因素
        blocks:
          - type: paragraph
            body: >-
              公开证据表明 Fireflies 正在积累可能影响退出准备度的要素：广泛的平台集成、Microsoft Teams 工作流存在感、面向企业买家的安全与合规信息，以及 Fireflies Talk 在 2026
              年的产品延伸信号。但这些积极因素本身不足以通过最终尽调门槛，因为同一公开记录也指出可见机器人摩擦、录音同意敏感性和计量式 AI
              积分复杂度，这些都会影响采用质量和净美元留存。如果企业转化被证明较弱、用量主要集中在免费层或低变现客户、要约价格包含很高的优先股悬垂，或法律/隐私摩擦显著拖慢分发，投资假设就会失效。在对退出路径或目标回报做投资判断前，投资者需要经审计
              ARR、利润率、留存、客户结构、要约机制和资本表经济性。
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 当前判断
            body: Fireflies 值得继续研究，但根据这里的证据，尚不足以按公开的 $1B-plus 估值做投资判断。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV014
          - type: callout
            title: 主要投资判断风险
            body: 估值信号基于二级市场，公开记录仍缺少经审计 ARR、留存和要约交易经济性。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV014
          - type: callout
            title: 哪些信息会改善判断
            body: 更强的建议需要经审计的变现证明，以及证据表明推动高质量企业扩张的是更广泛的 AI 工作流，而不只是原始用量规模。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV014
