        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              一份第三方简介称 Krish Ramineni 和 Sam Udotong 是创始人，并将公司成立时间定为 2016 年。Wealthbox 在 2025 年 4 月的合作公告中独立确认 Ramineni 为
              CEO
              兼联合创始人，这是现有证据对当前管理层最有力的跨域印证。来源池无法确认董事会名单、两位创始人之外的管理团队、创始人持股、投票控制权或重大管理层变动。因此很难量化关键人物依赖：公开叙事和面向合作伙伴的呈现仍围绕创始人，但证据不足以推断经营决策或客户关系依赖其中任何一人。
