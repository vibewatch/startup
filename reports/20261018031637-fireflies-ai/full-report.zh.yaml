              - CM011
              - CM014
      - number: '2.4'
        title: 自动化和广度推动采用，信任与采集摩擦限制采用
        blocks:
          - type: paragraph
            body: >-
              品类价值已从产出转录，转向让对话数据真正进入运营。Fireflies 在摘要、搜索和行动项能流入
              CRM、协作或知识系统时最有价值，多语言支持也扩大了可服务用户群。同一套工作流也带来摩擦：在敏感通话中，可见机器人可能改变参与者行为；同意和留存规则增加落地工作；噪声、口音、多人重叠、术语或混合会议室音频都可能拉低转录质量。证据还存在产品范围矛盾：官方文档宣传通话时长、独白、情绪、主题和趋势分析，但一份竞争对手撰写的评测称高级情绪和说话人辅导指标缺失。套餐权益、功能定义和当前产品行为需要直接核验。
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 预算属于运营支出，不只是转录支出
            body: 当会议产出必须变成可搜索记录、CRM 更新或分派任务时，Fireflies 才最相关；把通用转录支出算进来，会夸大产品可守住的市场边界。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM013
          - type: callout
            title: 公开需求代理指标不足以支撑 TAM 倍数
            body: 工作来源池缺少独立市场总量、付费席位渗透率、转化率、留存和实际价格，因此表面的采用广度无法转化为可靠的收入机会。
            calloutType: risk
            claimRefs:
              - CM004
