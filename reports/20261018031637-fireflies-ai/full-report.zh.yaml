        title: 分发与服务经济性
        blocks:
          - type: paragraph
            body: >-
              可观察到的市场进入方式是产品驱动并由集成助推。官方材料称，会议机器人、浏览器、桌面端、移动端、文件上传和连接的录音源都可用于采集，之后生成转录、摘要、行动项，并发送到 50 多个工作流应用。Microsoft
              Marketplace 列表增加了 Teams
              分发入口，但其中由供应商撰写的文案属于托管在合作伙伴平台上的公司证据，不是渠道生产力的独立证明。同一工作流暴露出可能的成本池：语音处理、生成式摘要、存储、集成维护、安全和企业支持。指定来源没有量化这些成本、销售周期、CAC、回本期或渠道经济性。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: 公开牵引力与变现风险
        blocks:
          - type: paragraph
            body: >-
              公开采用声称尚未充分调和，不能充当收入分母。无关联的 Fireflies 品牌网站声称超过 100 万家公司，官方安全页面则声称超过 500,000
              个组织；两者都没有定义活跃、付费、企业或工作区状态。独立评测证据还指出变现摩擦：ToolChase 报告某些口音的转录表现较弱，Clarigital 称重度用户可能在月底前耗尽封顶的 AI
              积分。这些信息不能证明流失或利润率受压，但明确了必须由群组数据回答的产品质量和用量分配问题。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              无法从现有财务证据推断资本充足性。指定来源池没有当前现金余额、经营现金消耗、债务或契约安排、现金跑道计算、资金计划用途或下一轮触发条件，也没有确认收入、ARR、毛利率、CAC
              回本期、流失或净收入留存。其他地方披露的融资额不应视为今天可用的现金，收入也不应改称 ARR。因此，稳妥结论很窄：Fireflies
              拥有可信的经常性定价架构和多个增购入口，但收入质量、利润路径、资本强度和融资依赖仍是重要的管理层数据尽调项目。
            claimRefs:
              - CI001
              - CI011
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI011
              - CI016
