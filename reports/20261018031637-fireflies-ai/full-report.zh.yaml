  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险状况可管理，但仍受信任门槛制约
        blocks:
          - type: paragraph
            body: >
              Fireflies 有可信的公开风险缓释叙事，但产品的核心工作流——加入通话、录音、生成摘要并把结果送入下游系统——在潜在客户看到 ROI 之前就形成了对信任敏感的风险链。官方材料描述 GDPR、SOC 2
              Type II、HIPAA、私有存储、客户数据所有权、加密、留存控制和管理工具，降低了 Fireflies 缺乏基本控制的可能性。更难的问题是，这些控制是否足以克服同意异议、嘈杂通话下的准确率问题、重度工作流中的
              AI 用量上限，以及对 Zoom、Meet、Teams、CRM、Slack
              和外部模型/搜索供应商的依赖。因此，公开证据支持中高程度执行和信任风险，而非生存性红旗；剩余暴露更多由披露缺口和工作流依赖驱动，而不是指定来源池中已识别的公开法律事件。
            claimRefs:
              - CR004
