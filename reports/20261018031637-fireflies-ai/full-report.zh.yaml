  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 核心市场是会议工作流自动化
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的市场边界从重复发生的工作场景对话开始，而不是抽象的转录。官方材料覆盖实时视频会议、线下采集、上传录音、可搜索转录、摘要和行动项。对比来源进一步划定边界：销售和业务团队看重自动捕捉及连接
              CRM
              的工作流；记者、媒体制作人和研究人员可能更偏好先上传再转录、编辑、字幕或剪辑。因此，相关预算包括会议记忆、对话智能和工作流自动化，但不包括人工认证转录、广播字幕、通用视频编辑和完整收入预测套件。Fireflies
              Talk 拓展了听写邻接场景，但没有用量证据，就不应把它计入核心会议助手需求。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
      - number: '2.2'
        title: 收入团队先切入，运营和 IT 决定扩张
        blocks:
          - type: paragraph
            body: >-
              最清晰的买家切入口是销售或收入运营：留存来源反复将 Fireflies 与高会议量、CRM
              整洁度、通话复盘和自动跟进联系起来。运营和职能负责人构成第二个细分群体，因为可搜索档案和行动项路由能减少分布式团队的信息损失。招聘和面试工作流则是更窄的应用场景。在大型客户中，付费方可能转向中央
              IT、安全部门或共享服务团队，因为存储、留存、访问控制和合规决定部署是否可行。由此形成两条采用路径：个人和团队自下而上的自助使用，以及必须先满足企业控制、实施政策和采购审批的受治理落地。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM011
      - number: '2.3'
        title: 可观察覆盖面不是可用于估值的市场规模
        blocks:
          - type: paragraph
            body: >-
              来源池提供的是商业代理指标，而非自上而下的市场模型。公司和第三方页面反复提到覆盖超过 500,000 个组织、支持超过 100
              种语言，以及公开披露年付价格的免费到付费阶梯。这些信号支持广泛的潜在覆盖面，但都存在分母问题：组织数量不披露付费账户或席位；语言覆盖是能力而非支出；标价也无法说明实际收入、折扣、留存或客户结构。留存来源没有提供独立的品类
              TAM、SAM、SOM 或 CAGR。因此，正确的尽调姿态是受证据约束地估算规模；在市场规模支持估值结论前，仍需私有转化率和群组数据。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
