              Fireflies 现在更像广泛的工作流产品，而不是单一功能的记笔记者：公司称能在实时通话、上传、浏览器采集、桌面录音和下游集成之间捕捉、转录、总结、搜索并路由会议产出；第三方指南也描述了 100+
