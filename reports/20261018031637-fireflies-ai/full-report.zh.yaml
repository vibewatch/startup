  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与细分偏向
        blocks:
          - type: paragraph
            body: >-
              指定来源池呈现的是拥挤格局，而不是一个头号对手。Fireflies 与 Otter、Fathom 同属直接 AI 会议助手，也会间接受到 Granola、Jamie
              等无机器人笔记工具竞争，还要取代手工记笔记或缺乏工作流自动化的基础转录。最稳定的细分信号不是原始转录质量，而是买家类型：独立评测称 Fireflies 是面向团队的会议智能系统，其分析、CRM
              同步和可搜索档案对个人记笔记者过于复杂；Fireflies 自己的对比内容则按免费、实时协作、议程中心或隐私优先等工作流偏好聚类替代品。
