      - number: '3.3'
        title: 持久性、切换成本与不利压力
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的护城河更像中等强度，而非难以撼动。多个来源一致认为，当买家同时需要可搜索的组织记忆、结构化摘要、CRM 或协作工作流以及团队分析时，Fireflies
              最有优势；这套组合比单独生成转录更可守。但同一组证据也展示了竞争对手的侧攻方式：隐私优先的无机器人工具降低录音摩擦，慷慨的免费层压低付费意愿，竞争对手营销还明确以隐性成本和集成深度攻击
              Fireflies。没有独立的赢单/丢单、留存或迁移数据，稳妥结论是：切换成本主要来自工作流配置和档案积累，而不是不可替代的核心模型优势。
