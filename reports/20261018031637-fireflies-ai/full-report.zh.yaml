            title: 规模声称使用了未调和的分母
            body: Fireflies 控制的页面同时引用 1M+ 家公司和 500k+ 个组织。在缺少日期、定义、付费账户数或活跃用户群组的情况下，任何一个数字都不应当作客户数或变现分母。
            calloutType: risk
            claimRefs:
