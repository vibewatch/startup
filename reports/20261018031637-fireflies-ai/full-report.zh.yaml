        title: 融资、估值与经营规模
        blocks:
          - type: paragraph
            body: >-
              最完整的融资数字叙事来自一份信誉较低的第三方简介：据称公司 2017 年完成种子轮、2021 年完成 $14 million 的 Series A、累计融资约 $19.1 million，自 2023
              年起盈利，并在 2025 年以 $1 billion
              估值完成员工流动性交易。这些数字不能视为经审计或相互等价：已融资额不等于可用现金，二级交易价格不等于一级融资，盈利说法也不是现金生成的证据。规模同样模糊。Fireflies 首页称产品覆盖超过 100
              万家公司，安全页面则称受到超过 50 万家组织信任；两页都没有给出日期、付费账户分母或口径调和。
