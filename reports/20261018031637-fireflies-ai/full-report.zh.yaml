        - id: gross-profit
          label: 毛利未量化
          summary: No assigned source discloses realized revenue, cost-to-serve, or gross margin.
      edges:
        - from: meeting-activity
          to: ai-processing
          label: 产生处理工作量
        - from: ai-processing
          to: free-entry
          label: 提供初始价值
        - from: free-entry
          to: paid-seats
          label: 转化率暂无数据
        - from: paid-seats
          to: workflow-expansion
          label: 集成驱动采用
        - from: workflow-expansion
          to: enterprise-uplift
          label: 团队和控制需求
        - from: enterprise-uplift
          to: gross-profit
          label: 收入扣除未披露服务成本
    approximationNotes: 仅为定性顺序；不估算转化率、收入、ARR、利润率、留存或现金创造。
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Fireflies 的公开产品由会议采集、智能工作区功能以及工作流 / 治理控制层叠而成。
    data:
      layers:
        - label: 采集入口
          detail: 机器人和本地采集入口接收预定、临时以及上传的会议内容。
          items:
            - Zoom / Google Meet / Teams / Webex 机器人
            - Chrome 扩展
            - 桌面端 / 移动端录制
            - 音频 / 视频上传
          modules:
            - 日历与实时会议采集
            - 浏览器内与本地录制
          outputs:
            - 转录输入流
        - label: 转录与摘要管线
          detail: 语音转文字和回顾生成将原始会议内容变成结构化会议记录。
          modules:
            - 转录 + 说话人标签
            - AI 摘要 + 行动项
          outputs:
            - 结构化会议记录
        - label: 搜索与知识工作区
          detail: 已建立索引的档案可通过搜索、AskFred、Notebook 和可分享协作功能重复利用。
          modules:
            - AskFred + 会议搜索 + 分析
            - Notebook + Soundbites + AI Skills
          outputs:
            - 可搜索会议档案
        - label: 工作流集成
          detail: 会议产出同步到协作、项目和 CRM 系统。
          modules:
            - Jira / Asana / Confluence / Slack
            - CRM 和其他应用集成
          outputs:
            - 任务与同步笔记
        - label: 管理与存储控制
          detail: 企业管理员可以管理会议数据的访问、留存和存储状态。
          modules:
            - Rules Engine + Super Admin
            - Private Storage + 自定义留存
          outputs:
            - 管理员控制的档案
        - label: 合规与隐私护栏
          detail: 合规声明和数据控制表述让 Fireflies 能够面向受监管或重视安全的买家。
          modules:
            - SOC 2 / GDPR / HIPAA 声明
            - 数据所有权 + 零留存声明
          outputs:
            - 安全与采购支持
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Fireflies 的扩张路径从会议采集开始，随后进入现有客户工作流中的搜索、路由和分析。
    data:
      items:
        - label: 连接日历和工作区
          actor: 管理员或知识工作者
          channel: Google 或 Microsoft 日历
          touchpoints:
            - 连接日历，或手动邀请 Fireflies 参加会议。
            - 在开始采集前识别已安排的会议。
          tone: positive
        - label: 跨模式采集会议
          actor: 最终用户
          channel: Zoom、Meet、Teams、Webex、桌面端、移动端上传
          touchpoints:
            - 机器人加入实时会议
            - 桌面端和移动端录制
            - 上传音频或视频
          tone: positive
        - label: 生成转录和摘要
          actor: 最终用户
          channel: Fireflies 工作区
          touchpoints:
            - 带说话人标签的转录
            - AI 摘要和行动项
          tone: positive
        - label: 搜索并查询过往对话
          actor: 最终用户或经理
          channel: AskFred 和档案搜索
          touchpoints:
            - 之后搜索精确短语和主题。
            - 跨会议历史提问。
          tone: positive
        - label: 将笔记路由到记录系统
          actor: 团队管理员
          channel: Microsoft Teams、CRM、Slack、Notion
          touchpoints:
            - 将笔记发布到 Teams 团队和频道。
            - 将产出同步到协作和 CRM 工具。
          tone: positive
        - label: 扩展到分析和深度工作流
          actor: 职能团队负责人
          channel: 分析、AI Skills 和专用操作手册
          touchpoints:
            - 对话分析和情绪
            - 工作流专用摘要和后续自动化
          tone: neutral
    approximationNotes: 该顺序反映审阅来源中得到支持的工作流入口，不代表各阶段之间经测量的转化率。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在同意 / 隐私信任和平台依赖与有限公开披露交汇之处，剩余风险最高。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 剩余风险
      rows:
        - label: 同意与录音合规
          note: 可见机器人带来的采用摩擦，加上各司法辖区的录音规则，可能在早期阻碍企业落地。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: risk
            - label: 中高
              tone: warning
              note: 控制措施存在，但指定来源中没有公开的法律结果记录。
        - label: 安全 / 合规证明
          note: 官方声明力度较强，但指定来源中没有审计材料或独立的泄露证据。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 中
              tone: warning
        - label: 机器人采用与 UX 摩擦
          note: 用户体验到下游生产力提升前，买方就可能产生抵触。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
        - label: 模型质量与配额限制
          note: 独立评测证据已经描述了准确率下降和 AI 积分上限。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
        - label: 平台依赖
          note: 采集和分发依赖 Fireflies 无法控制的会议、消息和工作流入口。
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 中高
              tone: warning
        - label: 披露缺口风险
          note: 公开证据尚未解决集中度、事件历史或诉讼尽调问题。
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
    approximationNotes: 序数单元格反映引用的公开证据所显示的严重程度排序，而非量化的事件概率模型。
    claimRefs:
      - CR014
      - CR016
      - CR017
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 产品广度和数据护城河证据在增强，但定价质量不透明、二级估值标记的投资判断依据也很薄。
    data:
      nodes:
        - id: scale
          label: 声称的规模
          note: 500k+ 个组织；《财富》500 强的 75%；100+ 种语言
        - id: breadth
          label: 产品广度
          note: 采集、转录、摘要、搜索、CRM 路由和 2026 年听写扩展
        - id: moat
          label: 数据平台护城河
          note: CEO 将会议、转录和对话智能数据定位为持久资产
        - id: pricing
          label: 变现不透明
          note: 商业套餐定价可见，但 AI 积分用量和付费席位结构不可见
        - id: mark
          label: 价格支撑缺口
          note: 公开的 >$1B 估值来自要约收购，且未披露要约机制
        - id: decision
          label: 推荐
          note: 除非经审计的收入、留存和股权表证据能够支撑该估值，否则继续研究
      edges:
        - from: scale
          to: breadth
          label: 拓宽叙事
        - from: breadth
          to: moat
          label: 支持平台逻辑
        - from: moat
          to: pricing
          label: 仍需变现证明
        - from: pricing
          to: mark
          label: 限制投资判断
        - from: mark
          to: decision
          label: 推动结论
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV014
