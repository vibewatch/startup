  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Fireflies
      - 已记录的竞争对手模式
      - 现状 / 替代模式
      - 含义
    rows:
      - - 采集方式
        - 机器人、Chrome 扩展、桌面应用、移动应用、上传和集成
        - 在指定对比覆盖中，Otter 和 Fathom 仍以机器人为主；Granola 和 Jamie 强调无机器人采集
        - 手工笔记或原始录音需要人工跟进
        - Fireflies 同时覆盖自动化和对机器人敏感的工作流，但无机器人已不再独特
      - - 归档搜索
        - AskFred 可搜索会议历史
        - Fathom 和 Otter 的对比页面也展示可搜索历史或 AI 聊天
        - 手工笔记零散且无法查询
        - 搜索的差异在深度和工作流链接，而不只是有没有搜索
      - - 对话智能
        - 通话时长、情绪、主题追踪和团队分析
        - 指定竞争对手覆盖更多聚焦摘要、协作或隐私，而非管理者分析
        - 现状没有结构化分析
        - 分析能力仍是从笔记采集升级到团队系统的明确理由之一
      - - 工作流自动化
        - CRM 同步，加上 50+ 至 100+ 个集成，以及 Teams 分发
        - CRM 同步往往只出现在付费层，或在指定对比中被描述为更浅
        - 内部自建意味着复制粘贴或定制脚本
        - 在指定证据中，集成深度和下游自动化是最强的护城河候选
      - - 信任 / 隐私姿态
        - SOC 2 Type II、GDPR、HIPAA、私有存储、默认不训练模型
        - Jamie 和无机器人工具从隐私姿态及采集时的低打扰性发起攻击
        - 手工记笔记让内容留在本地，但失去自动化
        - 信任是销售必需条件，但隐私优先替代品削弱了其独特差异化
    notes: 由于指定来源池没有针对同一买方 cohort 的中立基准评分，矩阵采用定性表达；缺乏支持的竞争对手单元格写成已记录的模式，而非臆测点估计。
