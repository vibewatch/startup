chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai 将自己定位为 AI 会议助手，能在主流会议平台和线下录音中捕捉、转录、总结并搜索对话。官方指南称，产品支持 100 多种语言的带说话人标签转录、AI 摘要、搜索、分析、协作工具，以及与
              50 多个应用集成。独立评测将其描述为 Freemium、按用户计费的 SaaS，付费层级增加存储、视频、CRM
              同步、对话智能和企业控制。这说明它定位于工作流自动化，而不只是转录工具。当前桌面下载页面还推广用于听写的 Fireflies
              Talk，显示产品已扩展到会议机器人之外，但该页面和指定证据都没有证明发布时间或采用情况。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
              - CO016
