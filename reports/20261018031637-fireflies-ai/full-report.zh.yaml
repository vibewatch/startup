  - id: TV002
    title: 看多 / 看空论点表
    columns:
      - 论点
      - 方向
      - 支持证据
      - 哪些事实会改变判断
    rows:
      - - Fireflies 已从转录扩展到可搜索摘要、集成以及相邻工作流采集。
        - 看多
        - 官方产品文档和第三方指南都描述了多入口采集与搜索能力。
        - 付费席位和扩张数据表明，这种广度能够转化为持久变现。
      - - 按公司所称规模和估值看，其资本效率似乎不错：已披露融资基数不大，并声称自 2023 年起盈利。
        - 看多
        - WebTribunal 报道称，公司累计融资约 $19M，自 2021 年起未再完成一级融资，并自 2023 年起盈利。
        - 经审计财务数据应验证利润率质量，而不是只验证一次性的效率说法。
      - - 管理层认为，护城河来自自有会议、转录和对话智能数据，再叠加 LLM 能力。
        - 看多
        - Slator 引述 CEO 的说法，将现有数据资产定位为差异化来源。
        - 客户留存、数据网络效应和竞争胜率若能得到验证，才说明这道护城河真正有效。
      - - 公开价格支撑较弱：>$1B 的估值来自要约收购，独立定价证据也显示按额度计费的变现模式存在摩擦。
        - 看空
        - WebTribunal 描述了要约收购结构；Laxis 和 Clarigital 描述了套餐定价及 AI 积分用量。
        - 要约条款、付费席位结构和经审计 ARR 应证明该估值靠基本面支撑，而不是靠稀缺性。
    notes: 本表混合公司、独立来源和竞争对手证据，用于把业务质量与入场价格支撑分开。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 企业客户转化率上升，AI 积分增购推高 ARPU，更完整的工作流叙事也提升钱包份额。
        - 如果经审计的增长、留存和利润率与平台叙事相符，软件行业的溢价倍数就有可能站得住。
        - 机器人摩擦、同意问题或免费转付费转化率偏低，使变现跟不上使用量。
        - 需要经审计的 ARR、NRR 和股权表证据，且质量明显高于目前公开信息。
      - - 基准
        - Fireflies 仍是强产品，也确有真实采用，但公开信息只能部分证明其变现和留存。
        - 公司值得继续跟踪，但在投资判断所需数据披露前，必须严格控制价格纪律。
        - 二级价格跑在基本面之前；积分机制的复杂性限制了可持续的席位扩张。
        - 与当前证据最匹配。
      - - 悲观
        - 使用规模确实存在，但变现不如公司规模说法所暗示的扎实；要约价格也高估了普通股经济性。
        - 由于公开证据尚未达到独角兽基准，下轮降价融资、平轮融资或长期缺乏流动性都变得可能。
        - 法律 / 隐私或竞争压力拖慢企业采用，同时 AI 成本压力挤压利润率。
        - 如果尽调发现付费转化率低、留存弱或要约条款对普通股不利，该情景的权重会上升。
    notes: 情景区间是定性的，因为本章公开证据未披露足以支撑可靠数字估值区间的经审计经营指标。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
      - CV014
