        blocks:
          - type: paragraph
            body: >-
              证据支持一条从成立、融资、据称盈利，到合作集成、二级估值和持续产品扩张的大致路径。2025 年 4 月的 Wealthbox 集成是日期最明确的外部里程碑：它把转录、摘要、联系人、商机和跟进任务接入财务顾问
              CRM。产品覆盖声称主要来自公司控制的页面；独立评测则指出 AI 积分上限、计费复杂度、转录条件以及会议中出现可见机器人等实际限制。企业安全认证只在 Fireflies
              自有安全页面中被声称，指定来源池没有证书予以验证。因此，这条时间线适合定位方向，但早期融资和后续估值事件仍需一级文件。
