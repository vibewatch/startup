      - number: '3.2'
        title: 能力、价格与渠道比较
        blocks:
          - type: paragraph
            body: >-
              Fireflies 已有记录的优势是贯穿工作流的广度，而不是独特的采集原语。官方帮助和产品页面显示，机器人、浏览器、桌面端、移动端和上传采集模式都能供给 AI 摘要、档案搜索、分析和广泛集成；Microsoft
              Marketplace 列表则为以 Teams
              为中心的买家提供了具体分发入口。这种广度提升了它对销售、客户成功、招聘和多语言团队的价值，但没有消除入门级价格压力，因为公司和竞争对手的对比页面都展示了更便宜或免费的替代品，且这些产品已经覆盖核心笔记捕捉。最重要的商业疑点是包装不清：独立来源和竞争对手来源对免费套餐的分钟额度说法不一，且都强调
              AI 积分上限是实际限制。
