    summary: Fireflies' public product surface stacks meeting capture, intelligence workspace functions, and workflow/governance controls.
    data:
      layers:
        - label: Capture surfaces
          detail: "Bots and local capture surfaces ingest scheduled, ad hoc, and uploaded meeting content."
          items:
            - Zoom / Google Meet / Teams / Webex bot
            - Chrome extension
            - Desktop / mobile recording
            - Audio / video upload
          modules:
            - Calendar and live-meeting capture
            - In-browser and local recording
          outputs:
            - Transcript input stream
        - label: Transcript and summary pipeline
          detail: "Speech-to-text and recap generation turn raw meeting content into structured meeting records."
          modules:
            - Transcript + speaker labels
            - AI summaries + action items
          outputs:
            - Structured meeting record
        - label: Search and knowledge workspace
          detail: "Indexed archives are reused through search, AskFred, Notebook, and shareable collaboration features."
          modules:
            - AskFred + meeting search + analytics
            - Notebook + Soundbites + AI Skills
          outputs:
            - Searchable meeting archive
        - label: Workflow integrations
          detail: "Meeting outputs sync into collaboration, project, and CRM systems."
          modules:
            - Jira / Asana / Confluence / Slack
            - CRM and other app integrations
          outputs:
            - Tasks and synced notes
        - label: Admin and storage controls
          detail: "Enterprise admins can manage access, retention, and storage posture around meeting data."
          modules:
            - Rules Engine + Super Admin
            - Private Storage + custom retention
          outputs:
            - Admin-controlled archives
        - label: Compliance and privacy guardrails
          detail: "Compliance claims and data-control language package Fireflies for regulated or security-conscious buyers."
          modules:
            - SOC 2 / GDPR / HIPAA claims
            - Data ownership + zero-retention claims
          outputs:
            - Security and procurement support
    claimRefs: [CE001, CE002, CE005, CE006, CE007, CE008, CE010, CE013]
callouts:
  - calloutType: insight
    title: Visible product breadth is wider than a single note-taking bot
    body: >-
      The assigned evidence supports a three-part operating model—capture, intelligence workspace,
      and workflow activation—which is broader than a transcription-only product story and more
      consistent with a horizontal collaboration SaaS platform.
    claimRefs: [CE001, CE002, CE005, CE006, CE009, CE010]
  - calloutType: risk
    title: Public proof is thin on the deepest technical diligence questions
    body: >-
      Fireflies' public surfaces market integrations and security controls well, but the retained
      evidence does not independently verify model architecture, benchmarked accuracy, incident
      history, or robust developer-signal adoption.
    claimRefs: [CE007, CE008, CE011, CE012, CE013]
