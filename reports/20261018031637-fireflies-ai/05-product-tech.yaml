      - ["Cross-meeting retrieval", "Past discussions are hard to find months later", "AskFred, meeting search, analytics, and Notebook organize the archive for reuse", "Lets users query topics, action items, and discussion history after meetings", "No public benchmark for retrieval quality or hallucination/error handling"]
      - ["Enterprise governance", "Admins need retention and storage controls around sensitive meeting data", "Security page markets private storage, retention controls, Super Admin, and data ownership", "Supports enterprise buying motions that require control language", "Public evidence does not show policy enforcement depth, incident history, or audit outcomes"]
    notes: "Benefits are stated as observable workflow outcomes from public product pages and independent descriptions, not audited customer ROI."
    claimRefs: [CE001, CE002, CE005, CE006, CE007, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Capture surfaces", "Ingest live, in-browser, local, or uploaded meeting content", "Zoom / Meet / Teams / Webex access, local apps, browser extension, file upload path", "Coverage can vary by meeting policy, platform permissions, or whether users/admins enable the right capture path"]
      - ["Transcript and summary pipeline", "Turn raw meeting content into transcripts, summaries, action items, and speaker-labeled records", "Speech-to-text quality, summarization quality, and language support", "No public benchmark methodology; third parties note accent and jargon sensitivity"]
      - ["Knowledge and analytics workspace", "Search, AskFred, analytics, Notebook, and Soundbites make archives reusable", "Indexing quality, retrieval accuracy, and workspace organization", "No public retrieval-quality, latency, or error-rate disclosure"]
      - ["Workflow and governance layer", "Push outputs into business tools and wrap the workspace with enterprise controls", "CRM / PM / collaboration integrations plus admin, retention, and storage controls", "Public evidence supports packaging claims but not depth of automation, API breadth, or policy-enforcement outcomes"]
    notes: "Architecture is inferred from public product, security, and third-party product descriptions; underlying model providers and system design remain undisclosed in this evidence set."
    claimRefs: [CE001, CE002, CE005, CE006, CE007, CE008, CE010, CE012, CE013]
