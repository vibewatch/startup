  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-proof-gap
      missingEvidence: Public developer-signal, benchmark methodology, API depth documentation, or source-level technical artifacts that verify the underlying AI stack and integration quality.
      whyItMatters: Product breadth is visible, but technical differentiation and implementation maturity are harder to underwrite without external proof points.
      diligencePath: Request architecture review materials, public or customer-facing API/docs depth, benchmark methodology, and any verifiable public developer or partner adoption signal.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: reliability-observability
      missingEvidence: Public uptime, incident history, latency/error-rate telemetry, and support SLA evidence for production deployments.
      whyItMatters: Enterprise workflow dependence is easier to assess when reliability and support performance are externally visible rather than only marketed.
      diligencePath: Request historical uptime/SLA reporting, incident summaries, support response metrics, and customer references that speak to reliability at scale.
      relatedQuestionRefs: [QE004, QE006]
    - type: private-evidence-only
      severity: material
      topic: model-performance
      missingEvidence: Accuracy testing by language, jargon density, speaker overlap, and complex-summary use cases.
      whyItMatters: Third-party critiques specifically target transcription and summary quality edge cases, which directly affect the product's value in technical or regulated settings.
      diligencePath: Ask for benchmark methodology, cohort-level quality dashboards, and customer evidence segmented by language mix, call type, and workflow criticality.
      relatedQuestionRefs: [QE007, QE008]
