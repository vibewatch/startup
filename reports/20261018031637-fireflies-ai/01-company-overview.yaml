  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Audited revenue, ARR, profitability, gross margin, cash flow, current cash, and revenue-recognition definitions.
      whyItMatters: The capital-efficiency narrative and valuation cannot be underwritten from a third-party profile or funding totals.
      diligencePath: Obtain audited financial statements, monthly recurring-revenue bridges, bank statements, and board-approved forecasts.
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: governance
      missingEvidence: Complete executive and board rosters, founder ownership, voting rights, investor stakes, succession coverage, and material leadership changes.
      whyItMatters: Governance quality, control, investor influence, and key-person concentration cannot be assessed from two named founders.
      diligencePath: Request the current cap table, charter, board minutes, option plan, organization chart, and executive employment agreements.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002, TO003]
    - type: conflicting-data
      severity: material
      topic: scale
      missingEvidence: Definitions, measurement dates, and paid-versus-free denominators for the 1M+ company and 500k+ organization claims.
      whyItMatters: Unreconciled marketing figures cannot support customer count, penetration, monetization, or retention analysis.
      diligencePath: Request billing-system account counts, active paid workspaces, seats, usage cohorts, and metric-definition documentation.
      relatedQuestionRefs: [QO005, QO008]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: milestones
      missingEvidence: Primary documents and independent corroboration for founding, financing, profitability, and the 2025 secondary tender.
      whyItMatters: Most historical milestones currently depend on a single low-reputation profile.
      diligencePath: Obtain incorporation and financing documents, investor announcements, tender materials, and audited financial evidence.
      relatedQuestionRefs: [QO010]
