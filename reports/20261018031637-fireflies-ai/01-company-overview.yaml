callouts:
  - calloutType: insight
    title: Capital efficiency is a thesis, not yet an audited fact
    body: >-
      The reported combination of roughly $19.1M raised, profitability since 2023, and a $1B
      secondary valuation would be unusually capital-efficient. The assigned pool traces all
      three points to one low-reputation profile, so primary financing records and audited
      operating evidence are required before using the narrative in underwriting.
    claimRefs: [CO010, CO011, CO012]
  - calloutType: risk
    title: Scale claims use unreconciled denominators
    body: >-
      Fireflies-controlled pages cite both 1M+ companies and 500k+ organizations. Without dates,
      definitions, paid-account counts, or active-user cohorts, neither figure should be used as
      a customer count or monetization denominator.
    claimRefs: [CO004, CO007]
