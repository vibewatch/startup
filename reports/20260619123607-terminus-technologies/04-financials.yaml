artifact: financials
slug: terminus-technologies
runDate: "2026-06-19"
company:
  name: Terminus Technologies
chapter:
  number: 4
  title: Financials
  summary: >
    Terminus has crossed RMB 1.843B of FY2024 revenue and carries RMB 2.3B of backlog, but the business still posted a RMB 973M adjusted loss and does not publicly disclose gross margin, EBITDA, or cash. The strongest evidence points to a fast-growing but capital-intensive AIoT infrastructure model whose underwriting case depends on private diligence around margin structure, liquidity, and customer concentration.
sections:
  - id: revenue-model-and-segmentation
    title: Revenue Model and Segmentation
    body: >
      Terminus monetizes a full-stack AIoT delivery model rather than a pure software subscription motion. Public company materials and post-filing coverage consistently describe a combination of software, hardware, and deployment or integration revenue tied to enterprise and government projects. That matters because the top line is large and growing quickly, but its quality is shaped by delivery timing, contract structure, and the mix between productized software and lower-margin project work. Revenue reached RMB 738M in FY2022, RMB 1.006B in FY2023, and RMB 1.843B in FY2024, with H1 2025 revenue at RMB 632M. The most important segment shift is AI Industrial Digitalization, which reached RMB 1.64B in FY2024 and represented roughly 89% of total revenue, while AI Smart Energy also increased its mix share. Backlog of about RMB 2.3B at December 2024 gives some visibility into contracted demand, but because recognition is tied to project delivery and milestones, investors should view the backlog as support for future revenue rather than recurring ARR in the software sense.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI014, CI031]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-monetization
    title: Pricing and Monetization
    body: >
      Pricing transparency is limited because Terminus appears to sell negotiated enterprise solutions, not standardized public SaaS packages. The company markets full-stack city, industrial, and energy solutions, while independent reporting describes multi-year contracts that bundle hardware, software licensing, and implementation services. This makes economic interpretation more difficult than in a seat-based subscription business because list prices, volume rebates, deployment discounts, and change-order economics are not disclosed. The absence of public list pricing does not imply weak monetization; instead it suggests that realized pricing is contract-specific and likely depends on scope, hardware content, and delivery complexity. That contract-led structure also helps explain why average revenue per client appears high and why government and large-enterprise procurement channels matter more than self-serve or SMB acquisition. From an underwriting perspective, the key gap is not whether Terminus charges for its products, but how much of contract value is software-like, how much is hardware pass-through, and how much is services-heavy revenue that could dilute margin quality.
    claimRefs: [CI001, CI013, CI014, CI020, CI032, CI041]
    tableRefs: [TI002]
  - id: unit-economics-and-margins
    title: Unit Economics and Margins
    body: >
      Public evidence is strongest on losses and working-capital improvement, and weakest on true unit economics. Terminus reported GAAP net losses of RMB 2.387B in FY2022, RMB 803M in FY2023, RMB 2.1B in FY2024, and RMB 574M in H1 2025, while adjusted net losses were RMB 983M, RMB 600M, RMB 973M, and RMB 500M respectively. That means loss intensity improved materially versus FY2022 but remained very high in FY2024, at roughly 53% of revenue on an adjusted basis. At the same time, average accounts receivable turnover improved from 238 days to 180 days to 104 days across FY2022-FY2024, which is a meaningful sign that collection discipline and cash conversion are moving in the right direction. The problem is that gross margin, EBITDA, and cost-of-revenue decomposition are still not public, so there is no clean way to separate software contribution from hardware bill-of-materials, deployment labor, or platform R&D. Given the company’s investments in TacOS, large-model development, edge infrastructure, and device deployment, the margin path is plausible but still unproven.
    claimRefs: [CI012, CI016, CI017, CI018, CI019, CI020, CI033, CI034, CI038, CI039, CI042]
    tableRefs: [TI003]
    figureRefs: [FI002, FI003]
  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing
    body: >
      As detailed in the Company Overview chapter, Terminus has raised substantial private capital; the financial question here is whether that capital base is enough to support continued scale-up before an IPO or other liquidity event. Third-party datasets and press coverage place cumulative funding around $899M, with Chinese-language sources citing about CNY 7B in aggregate and post-Series D-2 valuation above CNY 20B. The April 2024 D-2 round of roughly CNY 2B was explicitly tied to large-model applications, green high-performance computing infrastructure, and global expansion, which indicates management is still funding both product and balance-sheet-intensive growth. Microware’s disclosed strategic investment adds one visible external capital signal, but cash on hand, monthly burn, runway, debt facilities, and project-finance obligations remain undisclosed. Terminus has filed for HKEX listing three times, with the September 2024 and April 2025 applications lapsing before a November 2025 refiling. That pattern supports a view that IPO execution is central to investor liquidity, but also that timeline risk remains material if profitability or market conditions continue to constrain listing momentum.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI030, CI036, CI037, CI040]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict-and-gaps
    title: Financial Verdict and Gaps
    body: >
      The public record supports a mixed but coherent financial verdict. On the positive side, Terminus has reached meaningful revenue scale, accelerated growth sharply in FY2024, improved receivables collection, expanded active clients, and accumulated backlog that suggests continued demand from large enterprise and government programs. On the negative side, revenue quality is only moderate because recognition appears project-based, revenue mix is not broken out cleanly between software and hardware, and the company still carries large adjusted losses despite fast growth. Capital intensity also looks high because hardware, deployment, infrastructure build-out, and model training all consume cash before revenue is fully realized. The biggest blockers are specific: no disclosed gross margin by segment, no cash balance or runway, no debt schedule, no customer concentration table, and no evidence-backed path to sustained profitability. Valuation signals in the USD 2.75B-4.5B range imply investors are still underwriting strategic upside, but public evidence alone is insufficient to underwrite margin durability or near-term liquidity with conviction.
    claimRefs: [CI019, CI028, CI030, CI031, CI033, CI034, CI037, CI039, CI040, CI042]
    tableRefs: [TI005]
