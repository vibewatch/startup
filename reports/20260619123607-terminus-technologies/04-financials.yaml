figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: "Customer projects convert into a blend of hardware, software, and services revenue, with gross profit visibility limited by missing margin disclosure."
    data:
      nodes:
        - id: customers
          label: "Government and enterprise clients"
          detail: "Large infrastructure and industrial buyers procure multi-year AIoT programs."
        - id: contracts
          label: "Project contracts and backlog"
          detail: "Contracts generate backlog of roughly RMB 2.3B as of Dec 2024."
        - id: components
          label: "Hardware + software + services"
          detail: "Revenue mix includes devices, AI software, and integration or deployment work."
        - id: recognized
          label: "Recognized revenue"
          detail: "Revenue is recognized as delivery milestones or project completion criteria are met."
        - id: grossprofit
          label: "Gross profit"
          detail: "Gross margin is not publicly disclosed, preventing a clean revenue-to-profit bridge."
      edges:
        - from: customers
          to: contracts
          label: "signed programs"
        - from: contracts
          to: components
          label: "scope definition"
        - from: components
          to: recognized
          label: "delivery and acceptance"
        - from: recognized
          to: grossprofit
          label: "less hardware, labor, infrastructure cost"
    approximationNotes: "Flow is qualitative because public sources do not disclose revenue recognition accounting detail or gross margin by component."
    claimRefs: [CI001, CI010, CI014, CI020, CI031]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: "Observed loss and working-capital signals show improvement, but key inputs needed for a true unit-economics model remain unavailable."
    data:
      nodes:
        - id: bookings
          label: "Bookings and backlog"
          detail: "Backlog and client growth indicate demand, but not unit profitability."
        - id: revenue
          label: "Revenue realization"
          detail: "FY2024 revenue reached RMB 1.843B; H1 2025 was RMB 632M."
        - id: receivables
          label: "Receivables conversion"
          detail: "AR days improved from 238 to 104 between FY2022 and FY2024."
        - id: directcost
          label: "Direct cost base"
          detail: "Hardware, deployment labor, infrastructure, and support costs are undisclosed."
        - id: adjloss
          label: "Adjusted loss"
          detail: "Adjusted net loss was RMB 973M in FY2024 and RMB 500M in H1 2025."
        - id: marginpath
          label: "Profitability path"
          detail: "Missing gross margin and CAC or LTV prevent a validated break-even model."
      edges:
        - from: bookings
          to: revenue
          label: "project execution"
        - from: revenue
          to: receivables
          label: "billing and collection"
        - from: revenue
          to: directcost
          label: "cost absorption"
        - from: directcost
          to: adjloss
          label: "margin shortfall"
        - from: receivables
          to: marginpath
          label: "cash conversion signal"
        - from: adjloss
          to: marginpath
          label: "breakeven still distant"
    approximationNotes: "The bridge omits gross margin, CAC, NRR, and payback because none are publicly disclosed in accessible sources."
    claimRefs: [CI012, CI017, CI018, CI019, CI033, CI034, CI039]
  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: "Observed revenue, loss, collections, and valuation data imply a wide but source-backed band for financial scale and risk."
    data:
      items:
        - label: "Revenue scale"
          low: 1006
          mid: 1843
          high: 2300
          unit: "RMB mn"
          note: "Low is FY2023 revenue, mid is FY2024 revenue, high uses Dec 2024 backlog as an upper-bound demand reference rather than booked revenue."
        - label: "Adjusted net loss"
          low: 500
          mid: 973
          high: 983
          unit: "RMB mn"
          note: "Low is H1 2025 adjusted loss, mid is FY2024, high is FY2022."
        - label: "Accounts receivable days"
          low: 104
          mid: 180
          high: 238
          unit: "days"
          note: "Observed FY2024, FY2023, and FY2022 AR turnover days."
        - label: "Equity valuation"
          low: 2.75
          mid: 3
          high: 4.5
          unit: "USD bn"
          note: "Low reflects CNY 20B+, mid is GetLatka estimate, high converts HKD 35B+ pre-IPO framing."
    approximationNotes: "High values mix observed facts with source-backed reference ceilings; the figure is directional, not a valuation model."
    claimRefs: [CI002, CI010, CI012, CI015, CI017, CI024]
  - id: FI004
    title: Capital intensity and cash-flow map
    type: matrix
    layout: wide
    summary: "Capital demand concentrates in hardware, deployment, infrastructure, and model development, while public disclosure on funding coverage remains incomplete."
    data:
      columns: ["Driver", "Cash timing", "Balance-sheet exposure", "Underwriting implication"]
      rows:
        - label: "Hardware and smart terminals"
          values:
            - "Upfront before project acceptance"
            - "Inventory and working-capital risk"
            - "Gross margin and obsolescence risk need diligence"
            - "Needs hardware mix and inventory aging disclosure"
        - label: "Deployment and systems integration"
          values:
            - "Front-loaded labor and installation"
            - "Receivables and milestone timing"
            - "Lumpy revenue and cash conversion require customer-level schedules"
            - "Needs project-level billing and acceptance cadence"
        - label: "Green computing and edge infrastructure"
          values:
            - "Capex-like build before full utilization"
            - "Infrastructure utilization risk"
            - "Raises burn before software margin is proven"
            - "Needs capex, utilization, and financing support detail"
        - label: "LLM and TacOS R&D"
          values:
            - "Ongoing spend across product cycles"
            - "Intangible investment with uncertain payback timing"
            - "Requires evidence that new products can lift margin or win rate"
            - "Needs R&D capitalization and product ROI evidence"
    approximationNotes: "Matrix is qualitative because public sources do not disclose capex, inventory, debt, or utilization metrics."
    claimRefs: [CI020, CI022, CI029, CI030, CI038]
callouts:
  - calloutType: strength
    title: "83% Revenue Growth With Improving Collections"
    body: "FY2024 revenue reached RMB 1.843B, three-year CAGR was about 58%, AR turnover improved to 104 days, and backlog reached RMB 2.3B by December 2024."
    claimRefs: [CI002, CI004, CI010, CI012, CI033]
  - calloutType: risk
    title: "Heavy Losses and No Disclosed Gross Margin"
    body: "Adjusted net loss was RMB 973M in FY2024, gross margin and cash remain undisclosed, and two HKEX filings lapsed before the November 2025 refile."
    claimRefs: [CI017, CI018, CI019, CI025, CI028]
  - calloutType: recommendation
    title: "Key Diligence Blockers Before Underwriting"
    body: "Before underwriting, investors need segment gross margin, runway, debt structure, customer concentration, and clearer evidence that project-heavy growth can converge toward profitability."
    claimRefs: [CI019, CI028, CI030, CI034, CI042]
