    summary: >-
      Terminus's directly monetizable market is a fraction of the broad smart city ICT total; the public-domain AIoT
      layer is the operative TAM, industrial digitalization is the primary SAM, and Terminus's 342 current customers
      represent an early SOM within that.
    data:
      nodes:
        - label: 'China Smart City ICT Total (IDC 2024): RMB 939.71B'
          detail: Broadest lens; includes hardware, telecom, software. Most spend not addressable by platform vendors.
          tone: neutral
        - label: 'Global public-domain AIoT (Frost & Sullivan 2023): RMB 1.65T'
          detail: Sponsored estimate; boundary limited to commercial/public-space AIoT OS and services. Terminus's stated TAM.
          tone: positive
        - label: 'China AIoT industrial/commercial addressable (Terminus SAM estimate): ~CNY 400–600B'
          detail: Estimated SAM for smart industrial parks, smart cities, smart living in China; no independent third-party figure available.
          tone: neutral
        - label: 'Terminus FY2024 revenue: RMB 1.843B'
          detail: Current revenue run rate; represents <1% of any reasonable TAM/SAM estimate, confirming early-stage penetration.
          tone: positive
    approximationNotes: >-
      The SAM estimate is derived from Terminus's four verticals' reported revenue and order backlog, not from
      an independent market study. All layers should be treated as directional until a boundary-harmonized study
      is completed.
