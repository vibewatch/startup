  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: government vs. private revenue mix
      missingEvidence: >-
        Disclosure of Terminus's revenue split between government procurement clients and private enterprise
        buyers, and the proportion of RMB 2.3B backlog from each category.
      whyItMatters: >-
        IDC's China Smart City ICT forecast downgrade signals fiscal pressure on government procurement;
        if Terminus is heavily weighted to government contracts, its FY2025 growth could be materially
        impacted.
      diligencePath: >-
        Request revenue segmentation by buyer type (government vs. private enterprise) from the updated
        prospectus or management, cross-reference with client list breakdown in filings.
      relatedQuestionRefs:
        - QM008
        - QM016
        - QM017
    - type: missing-source
      severity: material
      topic: independent SAM evidence gap
      missingEvidence: >-
        Independent (non-sponsored) third-party market sizing for the public-domain AIoT platform segment
        in China, ideally with boundary criteria comparable to TacOS's competitive footprint.
      whyItMatters: >-
        All current TAM/SAM figures either use a boundary that is too broad (IDC full ICT) or come from a
        commissioned study by Terminus itself (Frost & Sullivan), preventing independent verification.
      diligencePath: >-
        Commission a direct check from IDC, Gartner, or Forrester for a platform-layer AIoT market
        estimate with explicit boundary criteria for public-domain vs. private-domain and software vs. hardware.
      relatedQuestionRefs:
        - QM019
        - QM025
