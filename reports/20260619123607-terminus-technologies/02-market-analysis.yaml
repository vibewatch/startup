callouts:
  - calloutType: insight
    title: Frost & Sullivan TAM is the operative lens but carries sponsorship risk
    body: >-
      Terminus's prospectus relies on a Frost & Sullivan market study commissioned for the IPO. The RMB 1.65T
      public-domain AIoT TAM is the most relevant boundary definition for Terminus's platform business, but because
      it was paid for by the company, diligence teams should cross-check boundary assumptions against IDC and
      MarketsandMarkets definitions independently before accepting the TAM at face value.
    claimRefs:
      - CM002
      - CM032
  - calloutType: risk
    title: IDC downgraded China smart city forecast — government segment headwind
    body: >-
      IDC revised its China Smart City ICT market forecast downward in January 2025, attributing the change to
      tightening government fiscal budgets and slower project approvals. This creates a specific risk for Terminus's
      AI city intelligence segment, which depends on government procurement. The industrial digitalization
      segment's private enterprise buyer base is more insulated from this constraint.
    claimRefs:
      - CM004
      - CM005
      - CM028
  - calloutType: strength
    title: DeepSeek cost inflection accelerates AIoT platform deployment economics
    body: >-
      DeepSeek's 2025 infrastructure shift meaningfully reduced the cost of deploying domain-specific LLMs for AIoT
      applications. Terminus has already restructured its product roadmap around this, launching a three-tier stack
      of domain models, infrastructure, and intelligent agents. Lower inference costs improve both the economics
      for Terminus and the ROI case for customers, which should compress time-to-commitment in the adoption funnel.
    claimRefs:
      - CM022
      - CM023
      - CM024
