  - id: sizing-gaps
    title: Sizing gaps and adverse evidence
    body: >-
      Several material evidence gaps limit precision in this market sizing. First, no independent third party has
      published a verified SAM or SOM estimate specific to the public-domain AIoT operating system market in China;
      Frost & Sullivan's estimate is commissioned by and appears exclusively in Terminus's prospectus, creating
      potential for optimistic boundary-drawing. Second, the MarketsandMarkets and Allied Market Research global
      figures include hardware, connectivity, and platform segments that significantly inflate the headline number
      relative to Terminus's software/platform revenue pool. Third, IDC's downward revision in January 2025 is an
      adverse signal: the 7.1% CAGR it now uses for 2023-2028 is materially below the 17% CAGR in the Frost &
      Sullivan estimate and the 26.1% CAGR MarketsandMarkets shows for global AIoT, raising the question of whether
      China-specific government budget pressures will suppress the growth rate for Terminus's core domestic market
      faster than international expansion can compensate. Fourth, Terminus's stated customer count (342 in 2024 vs.
      800+ in the updated prospectus for mid-2024) has shown inconsistencies across filings, creating diligence
      exposure. Fifth, the Market Research Future estimate (USD 142.2M in 2024 for China smart city) is three orders
      of magnitude smaller than the IDC estimate (RMB 939.71B ~= USD 130B), suggesting entirely different market
      definitions are in use; a diligence team should map each analyst's boundary criteria before relying on any
      single figure. The contradictory market size estimates are preserved in Table TM002 and should not be reconciled
      without a specific boundary-mapping exercise with each report author.
