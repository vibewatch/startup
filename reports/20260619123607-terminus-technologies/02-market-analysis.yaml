  - id: growth-drivers
    title: Growth drivers, constraints, and policy environment
    body: >-
      The primary demand-side driver for Terminus is the industrial digitalization wave in China: FY2024 data shows
      the segment growing at 162.9%, driven by industrial park operators pursuing smart factory and smart campus
      upgrades. China's 14th Five-Year Plan embeds digital infrastructure as a national priority, and the government
      has earmarked approximately $100B for smart city projects, supporting sustained public sector demand. DeepSeek's
      2025 launch is a structural driver: by lowering CUDA infrastructure dependency and reducing LLM inference costs,
      it accelerated time-to-deployment for scenario-specific AIoT models; Terminus restructured its technology stack
      around three tiers (domain models, infrastructure, intelligent agents) in direct response. The Belt and Road
      Initiative provides an international growth channel, particularly in the UAE and Saudi Arabia where NEOM
      envisions $500B in smart city construction. The Microware strategic cooperation framework (HKD 50M investment,
      August 2024) and ecological partnerships with Alibaba Cloud and China Mobile confirmed at the Dubai HQ
      inauguration signal a deepening partner network generating demand.

      The most material constraint is government budget pressure: IDC's January 2025 report explicitly downgraded
      its China smart city ICT forecast, citing fiscal headwinds and slower project approvals due to overall economic
      deceleration. This directly affects Terminus's AI city intelligence segment. A second constraint is
      implementation complexity: MarketsandMarkets identifies lack of standardized interfaces and fragmented IoT
      standards as the biggest AIoT adoption barrier, meaning multi-vendor environments require expensive middleware
      and integration work that extends sales cycles. High upfront costs and data privacy concerns are persistent
      failure modes across the industry. Terminus's own history reflects this: revenue contracted from RMB 1.207B
      in 2021 to RMB 738M in 2022 due to COVID-19 supply chain disruptions and project delivery delays, though it
      recovered strongly through 2024. Switching costs within TacOS-based deployments are meaningful: once buildings
      or campuses install edge compute hardware and train domain models on proprietary sensor data, migration to a
      competing platform is costly in both time and integration work, creating retention stickiness but also slowing
      new-logo acquisition when competing against entrenched incumbents such as Hikvision or Huawei.
