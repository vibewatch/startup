  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - driver or constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - China 14th Five-Year Plan digital infrastructure mandate
        - Driver
        - 2021–2025 (FYP period) and beyond
        - Sustained government procurement demand for smart city platforms; multi-year budget commitment
        - Confirm contract backlog tied to FYP vs. discretionary spend; assess 15th FYP status
      - - DeepSeek integration reducing LLM inference cost
        - Driver
        - 2025–2026 (current)
        - Faster deployment of scenario-specific domain models; Terminus restructured product stack
        - Validate whether cost savings flow to customers (pricing pressure) or Terminus margins
      - - Industrial park and commercial property digitalization demand
        - Driver
        - Current and accelerating through 2026
        - Terminus's largest and fastest-growing segment (+162.9% FY2024) driven by smart park demand
        - Confirm revenue mix shift sustainability; assess whether growth is project-based vs. recurring
      - - Belt and Road Initiative / UAE Vision and Saudi NEOM smart city investment
        - Driver
        - Medium-term (2025–2030)
        - Significant international SAM extension; Terminus positioned via Dubai HQ anchor
        - Quantify MENA revenue share; assess client concentration risk in sovereign buyers
      - - ESG and dual-carbon regulatory mandates in China
        - Driver
        - Accelerating 2024–2026
        - Tailwind for AI smart energy segment; carbon tracking mandatory for large buildings
        - Confirm regulatory timeline for mandatory carbon reporting that drives AIoT adoption
      - - China government fiscal headwinds and budget pressure
        - Constraint
        - 2024–2026 (IDC-noted, ongoing)
        - IDC downgraded China smart city ICT forecast January 2025; AI city intelligence segment at risk
        - Assess proportion of Terminus backlog from government vs. private enterprise buyers
      - - AIoT fragmented standards and integration complexity
        - Constraint
        - Structural (medium-term)
        - Longer sales cycles, higher integration costs, middleware spend cannibalizes platform value
        - Evaluate TacOS interoperability certifications and partner SDK adoption metrics
      - - High upfront implementation cost and project-based revenue model
        - Constraint
        - Current
        - Significant working capital tied up; accounts receivable improvement from 238 to 104 days positive signal
        - Request gross margin by segment and backlog-to-recognized-revenue conversion timeline
    notes: >-
      Timing assessments are estimates based on IDC, MarketsandMarkets, and company disclosures. Government-related
      constraints and drivers are particularly uncertain given the lack of independent fiscal forecasting for
      Chinese municipal budgets.
