callouts:
  - calloutType: strength
    title: 88% Revenue Growth Trajectory
    body: >
      Terminus entered the late-stage financing and IPO window with very strong
      topline momentum: FY2024 revenue reached RMB 1.843B, up 83.2% year over
      year, the three-year CAGR was about 58%, and backlog was reported at RMB
      2.3B. That combination suggests real customer demand rather than a purely
      conceptual AI narrative.
    claimRefs: [CO030, CO031, CO033]
  - calloutType: risk
    title: Persistent Operating Losses and Three IPO Lapses
    body: >
      The core risk is that Terminus still combines heavy losses with unresolved
      public-market timing. GAAP losses were enormous in FY2022 and remained
      substantial through FY2024 and H1 2025, while two consecutive HKEX
      filings lapsed before the third filing became the current application.
      That pattern raises concern about profitability timing and IPO
      convertibility.
    claimRefs: [CO028, CO029, CO042, CO043]
  - calloutType: insight
    title: Belt-and-Road International Expansion
    body: >
      Terminus is not presenting itself as a China-only AIoT vendor. The Dubai
      international headquarters, Expo deployment history, and cited footprint
      across 172+ cities together support a diversification narrative in which
      overseas smart-city projects become both growth vectors and proof points
      for investors assessing exportability.
    claimRefs: [CO006, CO034, CO035]
