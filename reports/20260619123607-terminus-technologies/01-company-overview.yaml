company:
  name: Terminus Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >
    Terminus Technologies is a China-founded AIoT platform company built around its TacOS operating system, with audited pre-IPO disclosures and independent reporting showing rapid revenue expansion to RMB 1.843B in FY2024 alongside sustained losses and repeated HKEX refilings. The strongest current evidence supports a business with real deployment scale, heavyweight institutional backers, and expanding international presence, but still meaningful execution and listing-risk concentration around profitability and founder-led governance.
sections:
  - id: identity-and-overview
    title: Identity and Overview
    body: >
      Terminus Technologies operates under several closely related labels that matter for diligence because public materials, media coverage, and IPO reporting do not always use the same name. The operating brand is Terminus Group, the Chinese name is 特斯联 (Tesilian), and reporting around the Hong Kong listing process indicates the legal entity shifted to Terminus Smart Technology Co., Ltd. from the earlier Chongqing Terminus Smart Technology Inc., Co., Ltd. The company traces its founding to 2015 in Chongqing, China, and now presents itself as an AIoT infrastructure company centered on TacOS, its proprietary operating system. TacOS is described as a five-layer AIoT architecture that connects devices, data, models, and industry workflows rather than a single application product. Current operating emphasis spans four segments: AI Industrial Digitalization, AI City Intelligence, AI Smart Living, and AI Smart Energy. Headquarters activity now appears split between Beijing as current China headquarters and Dubai as the international base opened in March 2024, which supports the company’s effort to frame itself as a China-rooted but globally deployable urban AI platform. From a stage perspective, Terminus remains a late-stage private company: Series D, pre-IPO, and still pursuing a Hong Kong listing. That combination of multi-segment product breadth, documented international expansion, and a live listing ambition makes chapter-one identity evidence especially reusable for later market, customer, and financial analysis.
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007, CO008, CO009, CO035, CO038]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      Leadership is unusually central to the Terminus story because the company is still strongly founder-identified and because the available public record emphasizes Victor Ai’s pre-company investing background as a core part of the investment case. Ai, born in 1983, is consistently described as the founder and CEO. His published biography ties together an economics degree from Simon Fraser University, a Master of Finance from Washington University in St. Louis, an M&A role at JPMorgan, and later leadership of Everbright’s New Economy Fund, where he reportedly executed more than 100 private equity transactions across a platform managing over USD 10B. That resume supports founder-market fit in capital formation, government relationships, and enterprise development, but it also increases key-person dependency because external narratives repeatedly route strategic credibility through Ai himself. Governance around him appears more institutionalized than a typical founder-led private company: the board is reported at 11 members, with 2 executive directors, 5 non-executive directors, and 4 independent non-executive directors, and investor-linked representatives are tied to major backers such as Everbright, IDG, JD Tech, and CITIC-linked interests. Key executive coverage extends beyond Ai to chairman Jin Zheng, CTO Hua Xiansheng, chief scientist and international president Shao Ling, executive president Wang Lei, and finance executives including deputy CFO Zhong Lingyun and CFO Kevin Shi in international-facing communications. Even so, the reported 26.61% management voting position associated with Victor Ai entities means strategic control still appears materially concentrated.
    claimRefs: [CO003, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO044]
    tableRefs: [TO002]
  - id: funding-history-and-capital
    title: Funding History and Capital
    body: >
      Terminus has assembled one of the more substantial private funding histories among China AIoT companies, and the round sequence is important because it shows both investor quality and the company’s capital intensity. The financing trail begins with a roughly USD 73.7M Series A in July 2017, followed by a USD 173M Series B in October 2018 that established unicorn status at about a USD 1B post-money valuation. A larger USD 283M Series C followed in August 2019, then a USD 93M interim Series D round in September 2021 backed by Warburg Pincus, Sequoia Capital, and Alibaba Cloud. The most important recent step was the approximately CNY 2B Series D-2 announced in 2024, co-led by AL Capital and Yangming Equity, with a broad syndicate that included state-linked and strategic investors. Across databases and media reports, total capital raised is commonly cited around USD 899M, while Chinese-language summaries describe roughly CNY 7B raised on a broader basis. The shareholder map suggests Everbright remains especially influential, including a reported 12.11% stake via Hunan Guangkong. Valuation markers rose from the 2018 unicorn threshold to more than CNY 20B after D-2, and partner-side disclosure around Microware’s August 2024 strategic investment implied a pre-IPO value above HKD 35B. That trajectory supports the company’s market relevance but also implies investors are underwriting an eventual public-market validation that has not yet been completed.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO036]
    tableRefs: [TO003]
    figureRefs: [FO002]
  - id: milestones-and-scale
    title: Milestones and Scale
    body: >
      The milestone record shows a company that has achieved real commercial and deployment scale, while also carrying a visible adverse narrative around losses and IPO timing. From its 2015 founding, Terminus moved quickly into large institutional fundraising and reached unicorn status by the 2018 Series B. Operationally, the best-known public deployment remains Expo 2020 Dubai, where Terminus served as China’s only official premier partner and deployed more than 150 Titan robots for visitor-facing tasks, creating a showcase reference for smart-city and robotics ambitions. By 2024 the company had expanded to 150-plus cities and 800-plus clients, with later 2025 disclosures pushing those figures to more than 172 cities and 900 customers, while backlog reportedly reached RMB 2.3B and receivable turnover improved sharply from 238 days in 2022 to 104 days in 2024. Financially, the topline accelerated to RMB 1.843B in FY2024, up 83.2% year over year, and the AI Industrial Digitalization segment became the clear growth engine. The adverse side is equally material: GAAP losses remained very large in FY2022 through H1 2025, and two consecutive HKEX filings lapsed before the company submitted a third prospectus in November 2025. For investors, the synthesis is straightforward: Terminus has built enough revenue, customers, capital support, and flagship deployments to remain IPO-relevant, but it still has not converted scale into credible public-market readiness.
    claimRefs: [CO007, CO008, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO039, CO041, CO042, CO043, CO045]
    tableRefs: [TO004]
    figureRefs: [FO001]
