callouts:
- calloutType: strength
  title: Dubai is the strongest external customer proof point
  body: Expo 2020 Dubai and the later Expo City directory listing give Terminus a named, internationally visible reference that is better than a generic smart-city claim. Few private AIoT companies disclose both event-scale operating metrics and a continuing regional footprint.
  claimRefs:
  - CU005
  - CU006
  - CU008
- calloutType: insight
  title: Revenue growth appears to come from deeper accounts, not just more logos
  body: The customer count increased only modestly in 2024 while revenue and industrial digitalization surged. That usually points to larger project scopes, upsell within existing programs, or concentration in a smaller number of valuable accounts.
  claimRefs:
  - CU016
  - CU017
  - CU020
- calloutType: risk
  title: Partner breadth is both a distribution asset and a proof-quality problem
  body: 'A 1,300-partner ecosystem can accelerate deployments, but it also means investor, channel, and customer proof often blend together. Microware is the clearest example: it is a capital provider, architecture integrator, and possible route-to-market partner, not a clean end-customer reference.'
  claimRefs:
  - CU014
  - CU015
  - CU028
  - CU034
- calloutType: risk
  title: Losses and repeated IPO filings keep concentration risk front and center
  body: Adverse prospectus coverage shows that Terminus is still loss-making and has attempted multiple Hong Kong filings. Without disclosed top-customer concentration or retention metrics, a large-project, public-domain customer mix deserves cautious interpretation.
  claimRefs:
  - CU029
  - CU030
  - CU037
  - CU038
