  figureRefs:
  - FU002
- id: retention-durability
  title: Retention, Durability, and Evidence Freshness
  body: 'The public evidence on retention is materially weaker than the evidence on acquisition and flagship deployments. No NRR, GRR, logo-retention, churn, renewal-rate, or satisfaction metrics were found in the cited public sources, which is unsurprising for a private infrastructure company but still a real diligence limitation. Durability must therefore be inferred from continuing project disclosures, multi-year partner agreements, and the fact that some relationships — especially Expo-linked and MENA partnership relationships — appear to extend beyond one announcement cycle. At the same time, the named-customer proof base mixes end customers, project sites, partners, and capital providers in ways that blur the line between customer proof and ecosystem proof. Evidence freshness is also uneven: some of the best sources are 2024 or 2025 financing and prospectus stories, while customer-outcome case studies remain sparse. This means customer durability is plausible, but not yet demonstrated
    with the kind of repeat-purchase and contract-quality data a growth-stage diligence process would normally demand.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU032
  - CU033
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-risk
  title: Expansion Dynamics, Concentration Risk, and Adverse Signals
  body: 'Customer breadth should not obscure concentration and procurement risk. Prospectus reporting and adverse Tencent News coverage indicate sustained losses, three Hong Kong IPO filing attempts, and a commercial model still heavily exposed to government-linked or public-domain buyers. That matters because long-cycle public procurement can slow cash conversion and make revenue dependent on a limited number of large projects or policy-sensitive sectors. Partner breadth is an opportunity — 1,300-plus partner organizations and MENA channel alliances can amplify distribution — but it is also a dependency because Terminus may need integrators, property groups, and telecom or cloud partners to unlock end demand. The Microware framework and investment further underline that channel and customer roles can overlap. In short, Terminus appears to have achieved real customer reach and marquee logos, yet the public record supports a cautious view: growth seems driven by a relatively concentrated
    set of public-domain and infrastructure opportunities, and the absence of disclosed retention or concentration ratios leaves downside analysis underdeveloped.'
  claimRefs:
  - CU029
  - CU030
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
