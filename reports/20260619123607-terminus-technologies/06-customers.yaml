    - 160 cities by Dec 2024; 172 by Jun 2025
    - Provides flagship city-scale references and long project scopes
    - Top-customer revenue concentration and renewal terms not disclosed
  - - Real-estate and smart-community operators
    - Property developer or operator as buyer/payer; residents as users
    - Smart building, community, parking, energy, and access workflows
    - Named MENA property partners plus Xuhui smart-community reference
    - Important for packaged CityApp and Smart Living deployment
    - Public contract values and ROI by site are not disclosed
  - - Industrial and campus operators
    - Enterprise buyer and site operator
    - AI Industry Digitalization, green computing, operational efficiency, energy management
    - Fastest-growing revenue segment in 2024
    - Likely the main driver of revenue expansion
    - Named industrial customer list remains short in public sources
  - - International flagship venues
    - Event or destination operator as buyer/host
    - Robotics, visitor service, navigation, and venue operations
    - Expo 2020 / Expo City Dubai
    - Highest-quality global reference point
    - Event-scale success may not equal recurring enterprise economics
  - - Partners and integrators
    - Channel partner or strategic co-seller
    - Market access, integration, deployment packaging, and regional sales
    - 1,300+ partner organizations; Microware and MENA partners named
    - Accelerates geographic coverage and enterprise entry
    - Active-vs-passive partner contribution is not disclosed
