  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: No public NRR, GRR, churn, renewal-rate, cohort, or customer-satisfaction dataset was identified for Terminus.
    whyItMatters: Without retention and renewal data, the durability of a customer base selling into public-domain and infrastructure buyers cannot be quantified in a standard diligence framework.
    diligencePath: Request cohort retention, renewal schedule, churn, and flagship-reference materials directly from management or future filing exhibits.
    relatedQuestionRefs:
    - QU024
    - QU027
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: The public record does not disclose top-customer revenue share, top-five concentration, or backlog concentration by account.
    whyItMatters: Concentration is central to judging downside risk in large-project AIoT businesses; without it, the impact of losing one city or enterprise account cannot be modeled.
    diligencePath: Request customer concentration schedules and cohort revenue disclosures from management or prospectus exhibits.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: partner-activity-level
    missingEvidence: The company cites 1,300-plus partner organizations, but the public record does not separate active revenue-generating channels from passive ecosystem affiliations.
    whyItMatters: A large partner count can overstate go-to-market power if most partners are inactive, non-exclusive, or symbolic.
    diligencePath: Request active partner counts, partner-sourced pipeline, and partner-attributed bookings.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
