  - type: missing-source
    severity: minor
    topic: geography-split
    missingEvidence: No audited public split was found for China versus overseas revenue, customers, or deployments inside the 900-plus-client footprint.
    whyItMatters: International repeatability is a key diligence issue, and MENA may look stronger than other regions only because it is better disclosed.
    diligencePath: Request geographic mix of revenue, customers, and backlog from management or future filing annexes.
