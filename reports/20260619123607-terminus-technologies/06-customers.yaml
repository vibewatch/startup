- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - 1,300+ partner organizations can amplify distribution and deployment coverage
    - Active-vs-passive partner contribution is unknown
    - Could either accelerate scale or mask weak direct sales efficiency
    - Request partner-attributed pipeline, bookings, and active-SI counts
  - - MENA headquarters plus Expo and property relationships create a real beachhead
    - International traction appears concentrated in MENA rather than diversified globally
    - Good for proof, but not enough to prove broad overseas repeatability
    - Request geography split of revenue, customers, and backlog
  - - Industrial digitalization growth suggests account expansion and larger project sizes
    - Large-project dependence can create top-customer concentration
    - Revenue may hinge on a small set of public-domain or enterprise accounts
