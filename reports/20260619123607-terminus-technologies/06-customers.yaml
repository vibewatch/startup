company:
  name: Terminus Technologies
chapter:
  number: 6
  title: Customers
  summary: 'Terminus shows meaningful customer reach for a private AIoT infrastructure company: 342 disclosed customers in 2024, 800-plus clients across 160 cities by year-end 2024, 900-plus clients across 172 cities by mid-2025, and marquee proof through Expo-related Dubai operations. The strongest customer signals are breadth, flagship deployments, and partner-enabled international traction; the weakest are retention disclosure, top-customer concentration transparency, and clear separation between end-customer proof and partner proof.'
sections:
- id: segmentation
  title: Customer Segmentation and Buyer Landscape
  body: 'Terminus''s disclosed customer base is best understood as a public-domain and infrastructure buyer mix rather than a consumer or pure software customer list. The recurring buyer archetypes are municipal or district authorities, state-linked public-service operators, real-estate and smart-community managers, industrial and campus operators, and international channel partners who help package deployments. Prospectus-derived scale figures show 224 customers in 2022, 330 in 2023, and 342 in 2024, while broader reach metrics show 800-plus clients across 160 cities by the end of 2024 and 900-plus clients across 172 cities by mid-2025. Those two frames are complementary: the formal paying-customer count is much smaller than the broader deployment and client footprint, which suggests partner-led and multi-site program structures. MENA sources also indicate that Terminus uses headquarters, property, telecom, and cloud partnerships to access customers, meaning channel relationships are a
    material part of customer acquisition rather than a side note.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU009
  - CU010
  - CU016
  - CU027
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof
  title: Named Customer Proof and Deployment Evidence
  body: 'The strongest named customer proof in the public record clusters around Expo City Dubai, MENA property and city relationships, and a smaller set of named China deployments. Expo evidence is unusually concrete because both Terminus materials and external references show that the company served as an Official Premier Partner at Expo 2020 Dubai, deployed 152 robots, logged more than 650,000 interactions, and later maintained an operating presence in Expo City Dubai via Terminus International. In China, prospectus-related and financing coverage names Loncin for green-computing deployments and Shanghai Xuhui for smart-community work, while broader company claims reference 8,000 smart projects globally. Microware adds a different kind of customer proof: it is less an end-user customer and more an IT-channel counterpart that committed capital and a multi-year cooperation framework to bring Terminus architecture into enterprise environments. The overall evidence base is directionally strong
    on breadth and flagship logos, but uneven on production-vs-pilot detail, contractual depth, and customer-outcome measurements for each named deployment.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU018
