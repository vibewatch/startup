- id: adoption-trajectory
  title: Adoption Trajectory, Revenue Expansion, and Operating Signals
  body: 'Public numbers show that Terminus''s customer base expanded, but not explosively, between 2022 and 2024. The important analytical point is that revenue grew far faster than customer count: revenue reached RMB 1.843 billion in 2024 while counted customers rose only from 330 to 342 that year. Industrial digitalization revenue alone climbed from RMB 624 million in 2023 to RMB 1.64 billion in 2024, suggesting that expansion within accounts, larger project scopes, or higher-value industrial deployments drove the commercial story more than logo acquisition. The order backlog of RMB 2.3 billion and the improvement in receivables turnover from 238 days in 2022 to 104 days in 2024 also support the view that Terminus improved execution quality even while it remained loss-making. Still, the public record does not reveal active-seat, utilization, or renewal metrics, so the adoption trajectory is visible mainly through project footprint, city reach, backlog, and revenue mix rather than through
    software-style customer engagement data.'
  claimRefs:
  - CU003
  - CU004
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU028
  - CU031
  tableRefs:
