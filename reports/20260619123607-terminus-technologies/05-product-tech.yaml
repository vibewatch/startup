- id: architecture-stack
  title: Architecture Stack, Operating Model, and Integration
  body: The best-supported architecture description combines the 2022 TacOS 3.0 launch materials, later channel interviews, and prospectus reporting. TacOS is described as a layered public-domain AIoT architecture in which device connectivity, computing, digital twins, application middleware, and developer tooling form a unified stack. CityIoT carries device-side sensing and control; CityOS provides the metropolitan operating core, digital twins, and AI middle platform; CityApp packages use-case software; and CityAIoT provides a framework for developers and partners to build on top. In 2025 the company added a DeepSeek-linked three-tier AI framework spanning domain models, green AI infrastructure, and intelligent agents, effectively pushing TacOS from orchestration software toward physical-AI applications. Third-party descriptions also point to modular interfaces and APIs for HVAC, lighting, access control, and robotic systems, which supports the thesis that integration breadth rather than
    a single algorithm is the key operating advantage.
  claimRefs:
