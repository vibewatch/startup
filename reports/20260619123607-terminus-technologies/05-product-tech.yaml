  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-and-privacy-controls
    missingEvidence: Formal cybersecurity, privacy, and data-governance certifications or audit materials for TacOS, CityAIoT, and robot deployments were not found in public sources.
    whyItMatters: Public-domain AIoT deployments touch sensitive location, building, and operational data. Without formal control evidence, the trust posture cannot be evaluated to enterprise-infrastructure standards.
    diligencePath: Request ISO/security certifications, privacy architecture, penetration-test summaries, and customer security questionnaires from management or future filing exhibits.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: post-2025-product-roadmap
    missingEvidence: The public record shows milestones through the 2025 DeepSeek-linked framework, but lacks a detailed 2026 product release calendar or version-level changelog after TacOS 3.0.
    whyItMatters: Roadmap quality matters for judging whether Terminus is sustaining product velocity or mainly reframing existing capabilities in financing and IPO narratives.
    diligencePath: Request a product release log, roadmap deck, and changelog evidence for 2023-2026 from product leadership.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: service-level-and-maintenance-data
    missingEvidence: No public SLA, uptime, maintenance-cost, or MTBF disclosures were identified for TacOS deployments or Titan robot fleets.
    whyItMatters: Reliability economics are central to validating whether Terminus can support repeatable infrastructure deployments beyond showcase projects such as Expo 2020 Dubai.
    diligencePath: Request fleet uptime logs, maintenance records, and service contracts from named deployments under NDA.
    relatedQuestionRefs:
    - QE026
  - type: enumeration-incomplete
    severity: minor
    topic: module-sku-depth
    missingEvidence: Public sources identify major modules and solution families but do not disclose a full product catalog, SKU list, or packaged pricing architecture.
    whyItMatters: A full module list is needed to map gross-margin pools, dependency on professional services, and configuration complexity by customer segment.
    diligencePath: Request product packaging, SKU, and pricing documentation or partner enablement materials.
