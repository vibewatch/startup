- id: robots-and-physical-ai
  title: Robots, Physical AI, and Real-World Reliability Signals
  body: 'Terminus is not only selling software. The company has repeatedly tied TacOS to robots and other physical-AI endpoints, most visibly through the Titan robot family and the Expo 2020 Dubai deployment. The robot materials describe three product lines and six models, including delivery or retail robots with 5G and 40-kilogram load handling, patrol robots with thermal sensing, and disinfection robots with 15-litre capacity and all-terrain mobility. A three-layer robot architecture and SLAM-based navigation are presented as the core enabling technologies. The Expo deployment is the largest public proof point: 152 robots, more than 650,000 interactions, 322,000 kilometres travelled, and 84,000 operating hours serving roughly 12.5 million visitors. Those operating statistics do not fully validate long-term commercial uptime, but they do show that Terminus has fielded TacOS-linked devices at event scale rather than remaining at concept stage.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE035
- id: differentiation-trust-roadmap
  title: Differentiation, Trust Signals, and Roadmap Gaps
  body: Terminus presents differentiation around breadth of stack, sustainability positioning, partner ecosystem, and public-domain deployment experience. Frost & Sullivan reportedly ranked TacOS fifth in China by 2023 public-domain AIoT revenue, while company materials describe it as one of Asia’s earliest public-domain AIoT operating systems supporting all-scenario applications. Awards such as the APSTI 2024 recognition support the sustainability narrative, and the MENA partner set plus Microware agreement show that system integrators view the architecture as commercially relevant. Even so, the trust layer is materially less transparent than the feature layer. Public sources discuss open APIs, carbon tracking, and reliability case studies, but they do not provide the level of detail a diligence team would want on cybersecurity certifications, privacy controls, model governance, service-level commitments, or developer adoption metrics. GitHub shows no public repositories, which weakens
    developer-signal evidence for the CityAIoT ecosystem. That leaves a credible product story with incomplete public proof on security, openness, and repeatable external development.
  claimRefs:
