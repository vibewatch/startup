tables:
- id: TE001
  title: TacOS Product Module and Asset Matrix
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Rows cover every major product module and solution family repeatedly named in launch materials, prospectus reporting, and independent summaries, but public sources do not disclose every SKU, pricing tier, or deployment-specific customization package.
  columns:
  - Module/Product
  - User/Buyer
  - Status/Maturity
  - Differentiation
  - Diligence Gap
  rows:
  - - CityIoT
    - City operators, real-estate managers, industrial campuses
    - Live platform component since TacOS 3.0
    - Connects sensors, controllers, smart terminals, and edge compute into one device layer
    - No public SKU list, device certification matrix, or hardware BOM disclosure
  - - CityOS
    - Municipal data teams, command centers, asset operators
    - Core operating layer
    - Combines digital twin, AI middle platform, and city-level orchestration
    - No public uptime metrics or architecture benchmark against peers
  - - CityApp
    - Building, park, community, and mobility operators
    - Commercial application suite
    - Scenario-specific software on top of same platform stack
    - Public case studies are broad but product-module ROI by app is not broken out
  - - CityAIoT
    - Developers, SI partners, ecosystem builders
    - Positioned as open framework
    - Developer framework, IDE, and community concept for extensibility
    - Little public code, SDK, or repository activity visible today
  - - AI Industry Digitalization
    - Industrial enterprises and campus operators
    - Fastest-growing vertical
    - Produced RMB 1.64B revenue in 2024 and appears to be the main monetization wedge
    - Revenue by named customer or sub-product not disclosed
  - - AI City Intelligence
    - Government and public-service agencies
    - Scaled vertical use case
    - Applies TacOS to governance, traffic, and public services
    - Government budget exposure and project renewal detail are not public
  - - AI Smart Living
    - Residential community and property managers
    - Scaled but less quantified
    - Extends stack to community, smart-home, and parking operations
    - No public retention or utilization metrics by residential deployment
  - - AI Smart Energy
    - Energy managers, developers, carbon operators
    - Strategic emerging layer
    - Carbon tracking, optimization, and PV-storage-charging coordination
    - No public evidence on certification, metering accuracy, or carbon-market transaction volume
  notes: This table maps disclosed modules and verticalized solution families, not an exhaustive internal product catalog. Status labels reflect public launch and commercialization signals rather than formal GA/preview tags.
