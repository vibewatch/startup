callouts:
- calloutType: strength
  title: Integrated public-domain stack is the core product moat
  body: The public record shows that Terminus is not selling an isolated building app or robot SKU. TacOS connects infrastructure, digital twins, applications, and physical-AI endpoints in one operating model, which is more defensible than a single-use-case point solution if customers truly want cross-domain orchestration.
  claimRefs:
  - CE001
  - CE002
  - CE007
  - CE034
- calloutType: insight
  title: AI Industry Digitalization appears to be the monetization engine
  body: Revenue disclosures indicate that AI Industry Digitalization is disproportionately important to near-term commercial traction. That suggests Terminus may be monetizing industrial and campus scenarios faster than pure city-governance workflows, even though the brand narrative emphasizes cities.
  claimRefs:
  - CE010
  - CE011
  - CE015
- calloutType: risk
  title: Developer openness remains weak in the public record
  body: CityAIoT is described as a developer framework, but LinkedIn and GitHub provide only soft ecosystem evidence and no visible public repositories. For a platform story, that weakens the external proof that third parties are actively building on the stack.
  claimRefs:
  - CE006
  - CE037
- calloutType: risk
  title: Security, privacy, and SLA evidence is under-disclosed
  body: The sources are rich on architecture, deployment scale, and partner storytelling, but thin on formal cybersecurity controls, privacy practices, uptime commitments, and independent quality audits. That gap is especially important because TacOS is marketed into public-domain and infrastructure settings.
  claimRefs:
  - CE028
  - CE038
