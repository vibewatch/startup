- id: TE004
  title: Trust, Quality, and Compliance Table
  columns:
  - Control/Certification
  - Status
  - Scope
  - Gap
  rows:
  - - Open API and modular interfaces
    - Publicly described
    - Integration with HVAC, lighting, access control, and robotics
    - Interface openness is described, but no public security-review or API-governance documentation was found
  - - Expo 2020 operating record
    - Public operating metrics available
    - Robot uptime proxy in a high-volume live environment
    - Metrics prove activity, not contractual SLA or fleet-maintenance economics
  - - Sustainability recognition (APSTI 2024)
    - Confirmed
    - Green-economy and sustainable-city solution framing
    - Recognition is not equivalent to cybersecurity, privacy, or quality certification
  - - Formal cybersecurity/privacy certifications
    - Not publicly disclosed
    - TacOS, robots, and city deployments
    - No public ISO/security/privacy control matrix or data-governance standard was identified in cited sources
  notes: This table separates trust-adjacent evidence from formal assurance evidence. The strongest public materials describe interoperability and sustainability; formal privacy and security controls remain under-disclosed.
