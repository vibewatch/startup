- id: TE002
  title: Workflow and Use-Case Table
  columns:
  - Use Case
  - Current Challenge
  - Terminus Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Smart building operations
    - Fragmented HVAC, lighting, access, and safety systems
    - TacOS integrates devices, digital twins, and apps for unified building control
    - Centralized monitoring and automation across building systems
    - No public quantified energy savings by building cohort
  - - Smart community governance
    - Many community assets and resident services operate in silos
    - CityApp plus CityOS for community operations, parking, and security orchestration
    - Supports recurring community-management workflows in named districts such as Shanghai Xuhui
    - Resident satisfaction and renewal data are not public
  - - Industrial park digitization
    - Industrial campuses need integrated operations, safety, and energy optimization
    - AI Industry Digitalization stack layered on CityIoT and CityOS
    - Main revenue-growth engine in 2024
    - Public case studies rarely disclose exact contract sizes or ROI
  - - Urban event robotics
    - Large venues need multilingual service and logistics at scale
    - Titan robots orchestrated through TacOS in event environments
    - Expo 2020 Dubai logged 650k+ interactions and 84k operating hours
    - Event-scale proof may not map directly to recurring enterprise margins
  - - Smart energy and carbon management
    - Operators need carbon visibility across production and consumption
    - AI Smart Energy adds lifecycle carbon tracking and PV-storage-charging coordination
    - Supports sustainability and potentially carbon-trading infrastructure
    - No public audit trail for emissions-accounting accuracy
  notes: Benefits reflect publicly described outcomes and operating metrics rather than audited ROI statements. Limitations highlight diligence areas still open in the public record.
