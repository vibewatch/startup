- id: TE003
  title: Technology and Operating Architecture Table
  columns:
  - Layer/Component
  - Role
  - Technology/Dependency
  - Risk
  rows:
  - - Public-domain participant layer
    - Captures operator, tenant, citizen, and service-provider workflows
    - Depends on buyer-specific workflows and data permissions
    - Procurement cycles and privacy rules vary by deployment
  - - CityIoT device layer
    - Connects sensors, terminals, controllers, robots, and edge hardware
    - Needs hardware interoperability and field maintenance
    - Heterogeneous devices can increase integration and reliability risk
  - - CityOS orchestration layer
    - Maintains digital twin, AI middleware, and data model
    - Depends on cloud/edge compute, spatial models, and data normalization
    - No public security architecture or SLA evidence
  - - CityApp application layer
    - Packages smart building, community, mobility, and governance apps
    - Depends on reusable scenario templates and APIs
    - App-specific ROI and adoption metrics are not disclosed
  - - CityAIoT developer layer
    - Lets partners extend workflows through IDE and framework tools
    - Depends on SDKs, community support, and partner development
    - Public developer-signal is weak because GitHub shows no repositories
  - - 2025 AI infrastructure and agent layer
    - Adds domain models, green HPC, and intelligent agents on top of TacOS
    - Depends on DeepSeek, compute clusters, chips, network, and cloud stack
    - Commercial monetization and governance controls are still lightly documented
  notes: The table synthesizes launch, prospectus, and 2025 AI-framework reporting into one stack view. Risk labels are analyst assessments of what the sources imply, not formal company disclosures.
