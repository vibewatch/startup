- id: vertical-solutions
  title: Vertical Solution Set and Deployment Footprint
  body: 'Public disclosures indicate that Terminus commercializes the TacOS stack through four solution families: AI Industry Digitalization, AI City Intelligence, AI Smart Living, and AI Smart Energy. The strongest economic evidence points to AI Industry Digitalization as the lead wedge, because the company reported RMB 1.64 billion of 2024 revenue in that segment after 162.9% growth, dwarfing earlier levels. The city and living categories appear to anchor smart community, public-service, traffic, and real-estate use cases, while Smart Energy covers carbon tracking, energy optimization, and integrated PV-storage-charging workflows. Scale disclosures suggest the product has been deployed across 160 cities and 800-plus clients by the end of 2024, expanding further by mid-2025, but the customer count growth disclosed in prospectus materials was far slower than revenue growth. That pattern implies Terminus is winning larger project scopes or higher-value industrial deployments rather than simply
    adding many new logos.'
  claimRefs:
  - CE007
