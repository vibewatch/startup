company:
  name: Terminus Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Terminus's core product is TacOS, a public-domain AIoT operating system that combines device connectivity, digital twins, application software, and partner extensibility across buildings, parks, campuses, and cities. The strongest evidence supports a four-module TacOS 3.0 stack, a 2025 DeepSeek-linked AI expansion, and meaningful field proof through Expo 2020 Dubai robotics and broad city deployment counts; the weakest evidence is around cybersecurity, privacy, SLA transparency, and external developer adoption.
sections:
- id: product-definition
  title: TacOS Product Definition and Customer Workflow
  body: Terminus Technologies positions TacOS as an AIoT operating system for public-domain environments rather than a single-point application. In customer workflow terms, the platform starts with instrumenting buildings, parks, campuses, and city infrastructure through sensors, controllers, and edge compute; aggregates those data streams into a city operating layer with digital twins and AI middleware; exposes packaged applications for smart buildings, smart communities, smart parks, mobility, and urban governance; and then extends into a developer layer for third-party customization. This matters because the buyer is often a city authority, real-estate operator, industrial campus manager, or ecosystem partner trying to manage fragmented physical assets through one operating model. The public evidence consistently shows that Terminus sells an integrated control stack plus packaged scenario apps, with the commercial promise that the same platform can coordinate energy, safety, mobility,
    operations, and robotics in one deployment.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
