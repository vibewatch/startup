  - id: moat-and-differentiation
    title: Moat, switching costs, and differentiation durability
    body: >-
      Terminus's primary moat claim is TacOS as Asia's first at-scale public-domain AIoT OS, supported by a
      Frost & Sullivan ranking of top-5 in China by revenue (commissioned study) and its appearance on Allied
      Market Research's named global AIoT vendor list alongside Microsoft, Google, IBM, AWS, Siemens, and GE
      Vernova. The physical embedding of TacOS edge hardware creates meaningful switching cost lock-in: a
      building or campus that has deployed Terminus sensors, robots, and edge compute units faces hardware
      replacement plus data migration costs to switch platforms. This is analogous to building management
      system (BMS) vendor lock-in, which is well-documented in commercial real estate.

      However, several moat durability risks are material. First, Terminus's moat is asserted by the company
      via commissioned research; no independent benchmark or third-party evaluation has ranked TacOS against
      competing AIoT operating systems. Second, Hikvision's addition of LLM capabilities to surveillance
      systems (documented by Wikipedia and confirmed by operator deployments in China) represents a direct
      erosion of the smart city AI narrative that Terminus differentiates on. Third, SenseTime's EV of ~USD 7B
      (per Multiples.vc) and Hikvision's market cap of ~USD 39B+ far exceed Terminus's HKD 35B+ pre-IPO
      estimate (~USD 4.5B), providing competitors with capital superiority for R&D and channel investment.
      Fourth, China's large AI incumbents (Huawei, Alibaba, Tencent) can bundle smart city AI into their
      existing government relationships at near-zero incremental cost for the customer.

      Multi-homing risk is moderate: large property developers and municipalities typically use multiple vendors
      for different city subsystems (security from Hikvision, voice from iFLYTEK, energy from Schneider, AIoT
      OS from Terminus). This limits Terminus's ability to monopolize the wallet in any single deployment,
      though TacOS's stated design around open interoperability with third-party devices is intended to make
      Terminus the integration layer rather than a closed system.
