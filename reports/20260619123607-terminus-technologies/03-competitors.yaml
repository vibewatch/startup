callouts:
  - calloutType: risk
    title: SenseTime is both investor and competitor — conflict of interest
    body: >-
      SenseTime co-led Terminus's Series D (April 2024) as a shareholder, yet it directly competes in smart
      city AI software and computer vision. This dual relationship creates governance risk at the board level
      and a potential information-sharing conflict: SenseTime may have access to Terminus's customer and
      product roadmap data through board representation while competing in overlapping verticals.
    claimRefs:
      - CP002
      - CP006
  - calloutType: risk
    title: Western sanctions contagion risk for Chinese AIoT companies in international markets
    body: >-
      Three of Terminus's closest Chinese AI/AIoT peers — Hikvision, SenseTime, and Megvii — are all on the
      US Entity List or subject to Treasury investment bans due to alleged surveillance abuse in Xinjiang.
      While Terminus is not currently sanctioned, its smart city intelligence product involves similar
      surveillance-adjacent capabilities in Chinese and Middle Eastern city deployments, creating potential
      for future geopolitical scrutiny as its international footprint grows.
    claimRefs:
      - CP025
      - CP026
      - CP027
  - calloutType: insight
    title: Terminus occupies a genuine capability gap between hardware incumbents and pure AI software
    body: >-
      Hikvision leads on hardware distribution but is weak on LLM-based platform depth; SenseTime leads on
      AI but lacks physical hardware integration. Terminus's TacOS sits in between, integrating the hardware
      and software layers via a single platform. This positioning is real but not yet independently validated
      and could be eroded if Hikvision or Huawei accelerates their AI platform roadmaps.
    claimRefs:
      - CP009
      - CP017
      - CP018
