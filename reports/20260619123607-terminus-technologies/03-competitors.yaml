  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent TacOS benchmark vs. competitors
      missingEvidence: >-
        An independent third-party benchmark comparing TacOS capabilities, integration depth, and performance
        against competing platforms (Hikvision HikCentral, Huawei Kunlun, SenseTime SenseCore) across the
        same deployment scenarios.
      whyItMatters: >-
        Terminus's core moat claim is TacOS as Asia's first and leading public-domain AIoT OS; without
        independent validation, this claim cannot be used in diligence without sponsorship risk disclosure.
      diligencePath: >-
        Commission a parallel technical evaluation by IDC, Gartner, or a qualified system integrator who
        has deployed both Terminus and at least one competing platform at comparable scale.
      relatedQuestionRefs:
        - QP006
    - type: missing-source
      severity: material
      topic: Terminus pricing and contract data
      missingEvidence: >-
        Actual contract pricing, margin by segment, and customer-level revenue concentration data for
        Terminus across its four verticals.
      whyItMatters: >-
        Without pricing transparency, it is impossible to assess whether Terminus competes on price vs.
        platform differentiation, or whether its high revenue growth reflects volume or pricing power.
      diligencePath: >-
        Request representative contract examples and pricing schedules from Terminus management or
        review redacted versions in the HKEX prospectus exhibits.
      relatedQuestionRefs:
        - QP007
        - QP016
    - type: private-evidence-only
      severity: minor
      topic: documented customer switching or displacement
      missingEvidence: >-
        Any documented case of a customer leaving Terminus's TacOS platform for a competing platform,
        or a case of Terminus being displaced from a procurement process by Hikvision or Huawei.
      whyItMatters: >-
        Platform lock-in and moat durability are inferred from structural analysis; actual churn or
        displacement evidence would materially change the competitive risk assessment.
      diligencePath: >-
        Request customer retention data and churn rate from Terminus; conduct reference calls with
        3–5 existing customers and 2–3 former customers or prospects who chose a competing platform.
      relatedQuestionRefs:
