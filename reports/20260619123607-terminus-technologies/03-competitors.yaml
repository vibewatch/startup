  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - moat claim
      - threat
      - severity
      - mitigation or diligence ask
    rows:
      - - TacOS as Asia's first public-domain AIoT OS at scale
        - Hikvision and Huawei building equivalent OS-layer platforms; claim is company-asserted via sponsored study
        - High
        - Get independent analyst comparison of TacOS vs. Hikvision's Hikcentral and Huawei's Kunlun platforms
      - - Hardware switching costs from embedded edge devices
        - Commodity edge hardware from Hikvision/Dahua enters at lower price; customers delay replacement
        - Medium
        - Assess TacOS hardware proprietary lock-in (open standard vs. proprietary protocols) and hardware margins
      - - Domain model training on proprietary customer data creates data lock-in
        - Customers may own their training data; contractual data portability clauses could remove this moat
        - Medium
        - Review standard TacOS deployment contracts for data ownership and portability terms
      - - 1,300+ partner network creates demand channel moat
        - Hikvision has larger global distribution; Huawei has direct government relationships
        - Medium
        - Quantify partner-sourced vs. direct-sourced revenue in Terminus's sales pipeline
      - - Top-5 China public-domain AIoT ranking (Frost & Sullivan)
        - Ranking is from a commissioned study in Terminus's own prospectus; not independently verified
        - High
        - Commission independent benchmark from Gartner, IDC, or Forrester before using as diligence evidence
      - - DeepSeek-enabled domain models as differentiation
        - DeepSeek is open-source; all competitors can also integrate it; differentiation is execution speed, not exclusivity
        - Medium
        - Verify time-to-market advantage in specific verticals and assess whether Terminus has proprietary fine-tuning data
      - - International first-mover advantage in MENA
        - Western sanctions risk on Chinese surveillance-adjacent companies expanding to MENA government customers
        - High
        - Legal review of OFAC and US Dept of Commerce risk for Terminus's specific product categories in UAE and Saudi deployments
    notes: >-
      Severity assessments are qualitative judgments based on publicly available evidence. Independent
      verification of all moat claims is recommended before investment decision.
