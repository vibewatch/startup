companyProfile:
  summary: >
    Terminus Technologies (特斯联) is a Chinese AIoT infrastructure company founded in 2015
    by Victor Ai. Its core platform, TacOS, connects devices, applications, algorithms, and
    infrastructure across industrial digitalization, city intelligence, smart living, and
    smart energy use cases. Public disclosures and IPO-related coverage show a business that
    reached RMB 1.843B of FY2024 revenue, operates across 150+ cities, and has attracted
    unicorn-level financing, but still does not publicly disclose the profitability and cash
    metrics needed for a price-sensitive investment decision.
  founders:
    - name: Victor Ai
      role: Founder and CEO
      background: Former Everbright New Economy Fund leader with earlier investment and finance experience.
      claimRefs:
        - CO003
        - CO011
  foundingLocation: Chongqing, China
  headquarters: Beijing, China
  productSummary: TacOS public-domain AIoT operating system plus software, hardware, robots, and project services for industrial digitalization, city intelligence, smart living, and smart energy deployments
  customerFocus: Government-linked public-domain operators, industrial parks and enterprise campuses, smart-building operators, and international smart-city or infrastructure partners
  businessModel: Mixed software, hardware, and project-services revenue model with large deployment contracts and ecosystem partner distribution
  stage: late
  fundingStatus: Series D completed in April 2024 at a reported CNY 20B+ valuation, followed by Microware strategic investment and repeated HKEX filing attempts
  disclosureProfile: private-undisclosed
