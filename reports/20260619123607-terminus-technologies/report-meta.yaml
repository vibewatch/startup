summary:
  headline: >
    Terminus is a real scaled AIoT platform with unicorn-level funding and fast 2024 growth,
    but financial opacity, single-segment concentration, and repeated IPO lapses keep it in
    research-more territory rather than an investable buy.
  overallScore: 4
  recommendation: research-more
  confidence: low
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2700
