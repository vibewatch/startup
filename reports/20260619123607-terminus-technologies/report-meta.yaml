    headcount: null
  topStrengths:
    - Verified FY2024 revenue reached RMB 1.843B with 83.2% YoY growth and RMB 2.3B backlog, showing real commercial scale.
    - TacOS and the four-vertical AIoT stack give Terminus a differentiated full-stack position across industrial, city, living, and energy workflows.
    - Terminus has visible deployment proof beyond China, including Expo 2020 Dubai and a reported footprint across 150+ cities.
  topRisks:
    - No public profitability, gross-margin, cash, or burn disclosure exists despite unicorn-level valuation claims.
    - Roughly 89% of FY2024 revenue came from industrial digitalization, creating material single-segment concentration risk.
    - Three HKEX filing attempts with earlier lapses, plus China tech discount and regulatory/geopolitical pressure, create exit uncertainty.
  unresolvedGaps:
    - FY2025 audited P&L, EBITDA, operating cash flow, and runway data
    - Customer concentration, renewal, NRR, and contract-duration disclosure
    - Final HKEX pricing, approval status, cornerstone demand, and use-of-proceeds detail
