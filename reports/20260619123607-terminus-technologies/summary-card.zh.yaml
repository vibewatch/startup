  topStrengths:
    - FY2024 收入已核验为人民币 18.43 亿元，同比增 83.2%，在手订单人民币 23 亿元，商业化规模真实可见。
    - TacOS 加四大垂直 AIoT 堆栈，让 Terminus 在工业、城市、生活和能源工作流里占住差异化的全栈位置。
    - 除中国外也有可见落地证明，包括迪拜 Expo 2020，以及据称覆盖 150+ 座城市。
  topRisks:
    - 尽管公司宣称已达独角兽估值，公开材料仍没有披露盈利、毛利率、现金或烧钱速度。
    - FY2024 约 89% 收入来自工业数字化，单一业务集中风险很高。
    - 三次递交 HKEX 申请且此前失效，加上中国科技资产折价、监管和地缘政治压力，退出不确定性很强。
