- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Financial performance
    - FY2024 and FY2025 audited P&L, EBITDA, operating cash flow, and cash burn rate
    - Cannot assess profitability trajectory or runway; prevents proper IPO valuation
    - Management; demand from IPO bookrunners as part of pre-IPO due diligence
  - - Customer concentration
    - Top-10 customer share of revenue; NRR; gross and net churn; contract renewal rates
    - 89% industrial digitalization concentration requires customer-level evidence of durability
    - Management disclosure; cross-check via government tender records and press releases
  - - Regulatory compliance
    - MLPS certification level; CAC compliance audit; DPO appointment confirmation; cross-border data transfer pathways
    - Material regulatory risk that cannot be sized without compliance posture data
    - Management; regulatory counsel; independent compliance audit
  - - IPO pricing and terms
    - HKEX offer price range; cornerstone investor commitments; lock-up periods; free-float target
    - Entry discipline and return analysis requires confirmed IPO pricing
    - HKEX listing application; prospectus when approved; bookrunner guidance
  - - Use of proceeds
    - Breakdown of remaining Series D capital and planned IPO proceeds deployment
    - Cash allocation affects burn rate calculation and runway assessment
    - Management; prospectus use-of-proceeds section
  - - Competitive win/loss data
    - Tender pipeline win/loss rate; competitive displacement evidence; Terminus displacement by Huawei/Alibaba
    - Platform defensibility cannot be confirmed without evidence of competitive outcomes
    - Management; channel checks; government procurement database searches
  notes: Priority order reflects impact on investment decision quality. Items 1-3 are blocking diligence asks for any buy
    recommendation.
