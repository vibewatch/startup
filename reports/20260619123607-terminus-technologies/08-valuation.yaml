  - - 'BEAR: SenseTime precedent—HKEX Chinese AI IPO underperformed; China tech discount compresses multiples to 3-5x revenue'
    - Would change if China AI sector re-rates positively on DeepSeek momentum and HKEX tech market recovery
  - - 'BEAR: Revenue concentration: industrial digitalization is 89% of FY2024 revenue—single-segment risk'
    - Would change if IPO prospectus discloses diversified vertical mix and no top-3 customer >20% of revenue
