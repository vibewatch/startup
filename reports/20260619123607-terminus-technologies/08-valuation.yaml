- id: scenario-analysis
  title: 'Scenario Analysis: Bull, Base, and Bear Cases'
  body: 'The valuation scenarios for Terminus span a wide range depending on IPO timing, multiple, revenue growth, and profitability.
    The bull case assumes Terminus successfully lists on HKEX by end of 2026 at the HKD 35B+ pre-IPO estimate, implying approximately
    15-16x FY2024 revenue. This scenario requires: (1) FY2025 revenue exceeding RMB 2.7B (+47% YoY) demonstrating growth continuity,
    (2) A credible profitability roadmap disclosed in the IPO prospectus, (3) HKEX market conditions receptive to Chinese
    AI companies (favorable tech cycle, no new geopolitical escalation), and (4) No material adverse regulatory action. Under
    these conditions, pre-IPO investors at CNY 20B valuation could see 75%+ paper appreciation to listing. The base case assumes
    a successful HKEX listing at HKD 20-25B (~USD 2.6-3.2B), implying roughly 7-9x FY2024 revenue—consistent with current
    Chinese AI software comps. This scenario requires FY2025 revenue of RMB 2.2-2.5B and a credible (but not achieved) profitability
    path. Pre-IPO investors would see modest appreciation or flat returns versus CNY 20B valuation. The bear case involves
    either a fourth HKEX filing lapse or listing below HKD 12B (~USD 1.5B), implying 4-5x revenue in line with distressed
    Chinese tech comps or analogous to Megvii''s failed IPO scenario. This would represent a material down-round for Series
    D investors at CNY 20B, with a 40-50% discount to last-round valuation. Across all scenarios, the lack of disclosed profitability
    timeline and operating loss data is the single largest uncertainty driver. Each scenario''s probability shifts materially
    depending on whether FY2025 audited financials (expected in mid-2026) show improving or deteriorating unit economics.'
