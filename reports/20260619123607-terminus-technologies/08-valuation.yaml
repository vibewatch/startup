company:
  name: Terminus Technologies
chapter:
  number: 8
  title: Valuation
  summary: Terminus Technologies carries a post-Series D valuation of CNY 20B+ (~USD 2.7B / HKD ~19B) and a pre-IPO market
    estimate of HKD 35B+ (~USD 4.5B), implying a 10-15x FY2024 revenue multiple that is materially elevated versus listed
    Chinese AI peers. Three HKEX filing lapses, undisclosed profitability, and persistent China tech sector discount cast
    doubt on achieving the bull-case valuation. The base-case recommendation is research-more pending confirmation of profitability
    trajectory, IPO terms, and customer concentration data.
sections:
- id: investment-thesis-antithesis
  title: Investment Thesis and Anti-Thesis
  body: 'The Terminus Technologies investment thesis rests on four pillars: (1) Rapid revenue scaling—FY2024 revenue of RMB
    1.843B (+83.2% YoY), three-year CAGR of ~58%, with an RMB 2.3B order backlog providing near-term visibility. (2) Platform
    defensibility—TacOS as Asia''s first public-domain AIoT OS, claimed interoperability across 100+ device brands, with switching
    costs embedded in city-scale infrastructure contracts. (3) Market tailwinds—China''s AIoT market projected to grow from
    CNY 1.65T (2023) to CNY 2.66T (2028) at 10% CAGR; industrial digitalization driving enterprise spend. (4) IPO optionality—if
    Terminus completes the HKEX listing at the Microware-estimated HKD 35B+ valuation, pre-IPO investors could see significant
    returns on CNY 20B post-D valuation. The anti-thesis is equally compelling: (a) Three HKEX filing lapses signal persistent
    investor skepticism or underwriting difficulty; (b) No profitability timeline is disclosed, creating unlimited burn risk;
    (c) Revenue concentration in industrial digitalization (89% of FY2024 revenue) creates binary sector risk; (d) SenseTime''s
    post-IPO share price decline from HKD 3.85/share peak to sub-HKD 1 demonstrates the China tech discount risk for AIoT
    companies; (e) Geopolitical headwinds—US NDAA restrictions, DOJ bulk data rule, China tech sector restrictions in Western
    markets—limit the international growth story; (f) The post-D CNY 20B+ valuation assumes strong growth continuity without
    confirmed path to profitability.'
