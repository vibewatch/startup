  - CV024
  - CV025
  - CV026
  - CV027
- calloutType: risk
  title: 'SenseTime precedent: China tech discount is structural, not cyclical'
  body: 'SenseTime (SEHK: 0020) listed on HKEX in December 2021 at HKD 3.85/share with a market cap in excess of USD 17B,
    and subsequently declined sharply due to US Entity List designation, profitability challenges, and the China tech sector
    re-rating. The stock has traded significantly below its IPO price for most of its listed history, representing one of
    the worst-performing major Chinese AI company IPOs. Terminus faces a structurally similar risk: HKEX investors'' experience
    with unprofitable Chinese AI companies has reset multiple expectations downward, and any hint of regulatory headwinds
    (Entity List, NDSMR enforcement) risks a SenseTime-style post-IPO collapse.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV021
- calloutType: assumption
  title: 'Key assumption: CNY/HKD exchange rates remain stable for IPO valuation comparison'
  body: All bull/base/bear valuation scenarios assume CNY/HKD exchange rates near current levels (approx CNY 1 = HKD 1.10).
    Material CNY depreciation against HKD/USD would compress the HKD-denominated IPO valuation relative to CNY-denominated
    private marks, representing an additional downside risk not captured in the scenarios. Currency hedging options for pre-IPO
    investors are limited.
  claimRefs:
  - CV018
  - CV019
  - CV022
