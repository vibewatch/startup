- id: thesis-break-diligence-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The investment thesis for Terminus requires monitoring of five categories of thesis-break events, each of which would
    either strengthen or undermine the buy/track/avoid decision. First, IPO execution: a fourth HKEX filing lapse or withdrawal
    without bridge financing would constitute a hard thesis-break requiring reassessment of alternative liquidity paths. Second,
    profitability trajectory: if FY2025 results (expected H1 2026) show widening operating losses despite revenue growth above
    40%, the margin expansion thesis is broken and valuation should be rebased downward. Third, regulatory action: a CAC enforcement
    action against Terminus or comparable Chinese AIoT company, or US Entity List designation, would trigger a structural
    valuation re-rating. Fourth, revenue concentration: if the IPO prospectus discloses top-3 customer concentration above
    50%, the revenue quality story is materially weaker than implied. Fifth, competitive pressure: if Huawei Cloud, Alibaba
    Cloud, or Hikvision announce competing public-domain AIoT OS platforms with pricing below Terminus, the platform defensibility
    thesis requires revision. Final diligence asks prioritized: (1) FY2024 and FY2025 audited financials including operating
    P&L, EBITDA, and cash flow; (2) Customer concentration—top-10 customer share of revenue, NRR, and contract renewal data;
    (3) MLPS certification level and CAC compliance posture; (4) IPO pricing parameters—offer price range, lock-up periods,
    pre-IPO investor secondary availability; (5) Use of proceeds from IPO and remaining Series D capital; (6) Competing platform
    intelligence—any tender losses or competitive displacement data.'
