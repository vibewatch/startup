- id: valuation-context-comps
  title: Valuation Context and Comparable Analysis
  body: 'Terminus''s current private valuation of CNY 20B+ is anchored to its April 2024 Series D close, when the company
    raised CNY 2B from AL Capital, Yangming, Everbright, SenseTime, and government-platform investors at a post-money valuation
    exceeding CNY 20B. At FY2024 revenue of RMB 1.843B, this implies an EV/Revenue multiple of approximately 10.9x—elevated
    but potentially justifiable given the 83% revenue growth rate. The Microware investor release estimates a pre-IPO valuation
    of HKD 35B+ (~USD 4.5B), implying roughly 15x FY2024 revenue, which would demand sustained 50%+ revenue growth and evidence
    of a credible profitability path. Comparable companies traded on HKEX illustrate the valuation spectrum: Horizon Robotics
    (SEHK: 9660) listed in October 2024 with a market cap implying roughly 15-20x revenue and is now profitable; SenseTime
    (SEHK: 0020) listed at HKD 3.85/share in 2021 and has since traded significantly below that level, with current EV/Revenue
    approximately 3-5x; Megvii (~$4B valuation in 2019) withdrew two HKEX IPO applications under US Entity List pressure.
    From a private round perspective, Terminus''s CNY 20B post-Series D valuation is consistent with comparable Chinese AI
    unicorn multiples: the Hurun China AI Unicorn ranking and Crunchbase/CBInsights data suggest Chinese AIoT/smart-city unicorns
    typically trade at 8-15x ARR in private markets during growth phases. GetLatka estimates Terminus at $3B valuation with
    $258M ARR (2024), consistent with the CNY 20B figure. The key question for IPO pricing is whether the HKEX market will
    price Terminus at Horizon Robotics multiples (high-growth, profitable) or SenseTime multiples (high-growth, loss-making).
    Given the current absence of profitability data, the SenseTime or worse scenario is the more probable public market outcome.'
