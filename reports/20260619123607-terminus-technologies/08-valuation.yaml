callouts:
- calloutType: recommendation
  title: 'Recommendation: research-more — pending profitability disclosure and IPO pricing'
  body: 'Terminus Technologies earns a research-more recommendation based on the current evidence set. The fundamental business
    quality is demonstrable—83% YoY revenue growth, RMB 2.3B backlog, leading market position, and DeepSeek-enabled cost structure
    improvements. However, the investment decision cannot be underwritten responsibly without: (1) FY2025 audited financials
    confirming profitability trajectory, (2) IPO pricing at or below 9x forward revenue, (3) Customer concentration data below
    40% top-3 threshold, and (4) Active HKEX listing application. Entry at CNY 20B+ private valuation (10-15x revenue, no
    profitability disclosure) is not recommended given the stretched multiple and execution risk.'
  claimRefs:
