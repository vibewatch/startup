      - number: '2.3'
        title: 增长驱动、约束与政策环境
        blocks:
          - type: paragraph
            body: >-
              Terminus 最主要的需求侧驱动是中国工业数字化浪潮：FY2024 数据显示，该板块增长
              162.9%，由推进智慧工厂和智慧园区升级的产业园区运营方拉动。中国「十四五」规划把数字基础设施纳入国家优先事项，政府已为智慧城市项目预留约 $100B，支撑公共部门持续需求。DeepSeek 2025
              年发布是结构性驱动：它降低 CUDA 基础设施依赖并压低 LLM 推理成本，加快了场景化 AIoT 模型的部署速度；Terminus 直接响应，围绕三层（领域模型、基础设施、智能体）重组技术栈。Belt and
              Road Initiative 提供国际增长渠道，尤其在 UAE 和 Saudi Arabia，NEOM 规划了 $500B 智慧城市建设。Microware 战略合作框架（2024 年 8 月，HKD 50M
              投资）以及迪拜总部启用时确认的 Alibaba Cloud、China Mobile 生态合作，显示产生需求的伙伴网络正在加深。

              最重要的约束是政府预算压力：IDC 2025 年 1 月报告明确下调中国智慧城市 ICT 预测，理由是整体经济放缓带来的财政逆风和项目审批变慢。这直接影响 Terminus 的 AI city
              intelligence 板块。第二个约束是实施复杂度：MarketsandMarkets 认为缺乏标准化接口和 IoT 标准碎片化是 AIoT
              采用的最大障碍，意味着多供应商环境需要昂贵的中间件和集成工作，拉长销售周期。高前期成本和数据隐私顾虑是全行业持续存在的失败模式。Terminus 自身历史也反映了这一点：受 COVID-19
              供应链扰动和项目交付延迟影响，收入从 2021 年 RMB 1.207B 收缩至 2022 年 RMB 738M，尽管到 2024 年强劲恢复。TacOS
              型部署的切换成本不低：一旦楼宇或园区安装边缘计算硬件，并用专有传感器数据训练领域模型，迁移到竞争平台在时间和集成工作上都很昂贵，形成留存黏性；但在与 Hikvision 或 Huawei
              等既有巨头竞争新客户时，也会拖慢新 logo 获取。
