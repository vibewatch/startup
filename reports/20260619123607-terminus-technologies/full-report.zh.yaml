      - number: '2.2'
        title: 买方图谱、用户分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Terminus 运营四个 AIoT 收入板块，买方画像各不相同。最大且增长最快的是 AI industry digitalization，FY2024 增长 162.9%（至 RMB
              1.64B），服务产业园区、商业平台运营方和智慧零售运营方；预算负责人通常是物业管理公司或产业园区运营方，采购由运营效率 ROI 和智慧租赁溢价驱动。第二个板块 AI city intelligence
              服务市政府和城市局委，满足智慧交通、公共安全和城市管理需求；预算权掌握在城市 CIO 和数字经济主管部门手中。第三个板块 AI smart living
              服务房地产开发商、住宅社区管理方和建设智慧社区的房地产信托；买方是用 AIoT 做物业差异化的开发商或资产管理人。第四个板块 AI smart energy 服务追求 ESG
              合规和减碳的能源运营商、制造商和商业楼宇；预算由设施管理和可持续发展团队分担。Terminus 的客户数从 224（2022 年）增至 330（2023 年）和 342（2024
              年），说明公司在巩固客户支出深度，而不是追求客户广度，净新增客户放缓。KrASIA 分析指出，应收账款天数从 2022 年的 238 天改善至 2024 年的 104
              天，显示项目交付和回款周期加快。典型企业客户的采用路径从在一栋楼或一个区域试点部署 TacOS 传感器和边缘计算开始，随后与客户既有 ERP 或 BMS
              系统集成，再通过交叉销售更多模块横向扩展到整处物业或园区。政府买方路径不同：正式采购招标、试点城市或区县，然后是多年框架协议。UAE 和 MENA 地区的 Belt and Road Initiative
              买方通过 Expo City Dubai 进入，现在由迪拜的 Terminus International Headquarters 服务。截至 2024 年中，国际客户在 160 座城市、800+
              客户基础中占比更小，但战略意义重要。
