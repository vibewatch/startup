            body: >-
              Terminus 的差异化叙事落在几件事上：堆栈覆盖够宽、可持续发展定位清晰、伙伴生态成形，也有公共域落地经验。公开资料称，Frost & Sullivan 按 2023 年中国公共域 AIoT 收入口径将
              TacOS 排在第五；公司材料则把它描述为亚洲较早支持全场景应用的公共域 AIoT 操作系统之一。APSTI 2024 等奖项支撑了可持续叙事，MENA 伙伴群和 Microware
              协议也说明，系统集成商认为这套架构有商业相关性。问题在于，信任层的透明度明显弱于功能层。公开来源谈到开放
              API、碳追踪和可靠性案例，但没有给出尽调团队需要的网络安全认证、隐私控制、模型治理、服务等级承诺或开发者采用指标。GitHub 上看不到公开仓库，削弱了 CityAIoT
              生态的开发者信号。因此，产品故事可信，但在安全、开放性和可复制的外部开发方面，公开证据仍不完整。
