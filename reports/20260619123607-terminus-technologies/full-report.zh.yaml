      - number: '7.3'
        title: 运营、技术与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Terminus 的运营风险集中在关键基础设施中的平台可靠性、技术供应链、数据安全事件，以及来自资源充足的现有巨头的竞争强度。TacOS 部署在智慧城市基础设施里，承担高影响的可靠性义务：任何影响交通管理、楼宇
              HVAC 或公共安全系统的平台宕机，都可能触发监管行动和合同处罚。公司没有披露公开 SLA 承诺、可用性保证或第三方安全认证（ISO 27001、SOC 2）。Hikvision 年收入约
              $15B，在视频监控和智慧楼宇管理中占据主导份额，直接与 Terminus 争夺智能基础设施管理和政府智慧城市合同。Huawei Cloud 和 Alibaba Cloud 也都提供竞争性智慧城市 AIoT
              堆栈，并拥有深厚政府关系。Terminus 声称按 2024 年收入计算，它是中国第五大公共域 AIoT 解决方案提供商，这也意味着前面还有四个更大的竞争者。边缘计算设备和 IoT
              传感器的硬件供应链集中度未披露；芯片供应链（半导体、专用传感器）的地缘扰动可能影响设备生产排期。TacOS 借助 DeepSeek 和自有模型接入 AI
              大语言模型（LLM），在安全相关应用中带来模型失效风险；公司尚未公开披露 AI 安全测试框架。TacOS 互操作性和五层架构构成的竞争护城河没有得到独立验证，也可能被资源更充足的竞争者复制。
