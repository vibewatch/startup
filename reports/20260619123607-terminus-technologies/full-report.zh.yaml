  - id: FV004
    title: 投资 KPI：面向 IC 的 Terminus Technologies 评分
    type: kpi
    layout: wide
    summary: 从七个投资委员会维度给 Terminus 打 0-10 分，结构化呈现相对优势和缺口。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: 中国 AIoT 市场到 2028 年 CNY 2.66T；工业数字化处于增长阶段
        - label: 产品 / 护城河
          value: 6
          detail: TacOS 声称具备互操作性；护城河强度尚未独立验证；存在可复制风险
        - label: 收入增长
          value: 9
          detail: 2024 财年同比增长 83%；3 年 CAGR 为 58%；在手订单 RMB 2.3B
        - label: 财务透明度
          value: 2
          detail: 未披露经营 P&L、EBITDA 或现金消耗；盈利能力不透明
        - label: 监管 / 地缘政治风险
          value: 3
          detail: NDSMR、CSL 修订、美国 NDAA、DOJ 数据规则都带来实质逆风
        - label: 估值吸引力
          value: 4
          detail: 10-15x 收入，高于上市同业 3-5x；牛熊区间很宽
        - label: IPO 执行信心
          value: 3
          detail: 三次申报失效；没有确认基石投资者；FT 负面报道
    approximationNotes: 分数是 0-10 分制下的分析师判断，不是模型输出。分数越高越好。方法：1-3 = 弱 / 高风险，4-6 = 混合 / 中等，7-10 = 强 / 低风险。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV023
      - CV024
      - CV025
