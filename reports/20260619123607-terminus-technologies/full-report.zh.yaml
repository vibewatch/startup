              公开披露显示，Terminus 通过四个解决方案家族商业化 TacOS 栈：AI Industry Digitalization、AI City Intelligence、AI Smart Living 和 AI
              Smart Energy。最强经济证据指向 AI Industry Digitalization 作为先导切口，因为公司报告该板块 2024 年收入 RMB 1.64 billion，在增长 162.9%
              后显著高于早期水平。城市和生活类看起来锚定智慧社区、公共服务、交通和房地产场景，而 Smart Energy 覆盖碳追踪、能源优化，以及光伏—储能—充电一体化工作流。规模披露显示，到 2024 年底产品已部署到
              160 座城市和 800 多个客户，并在 2025 年中进一步扩张；但招股书材料披露的客户数增长远慢于收入增长。这一模式意味着 Terminus 赢得的是更大的项目范围或更高价值工业部署，而不只是增加许多新
