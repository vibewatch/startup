      - number: '8.3'
        title: 情景分析：牛市、基准与熊市案例
        blocks:
          - type: paragraph
            body: >-
              Terminus 的估值情景跨度很大，取决于 IPO 时间、倍数、收入增长和盈利能力。牛市情景假设 Terminus 在 2026 年底前成功登陆 HKEX，并达到 HKD 35B+ pre-IPO 估算，对应约
              15-16x FY2024 收入。该情景需要：（1）FY2025 收入超过 RMB 2.7B（同比 +47%），证明增长连续；（2）IPO 招股书披露可信盈利路线图；（3）HKEX 市场条件对中国 AI
              公司友好（科技周期有利，没有新的地缘升级）；（4）没有重大不利监管行动。在这些条件下，按 CNY 20B 估值进入的 pre-IPO 投资人，到上市时可能看到 75%+ 账面增值。基准情景假设公司以 HKD
              20-25B（约 USD 2.6-3.2B）成功在 HKEX 上市，对应约 7-9x FY2024 收入，与当前中国 AI 软件可比公司一致。该情景要求 FY2025 收入达到 RMB
              2.2-2.5B，并有可信但尚未兑现的盈利路径。Pre-IPO 投资人相较 CNY 20B 估值会获得温和升值或持平回报。熊市情景则是第四次 HKEX 递表失效，或上市估值低于 HKD 12B（约 USD
              1.5B），对应 4-5x 收入，贴近受压中国科技可比公司，或类似 Megvii IPO 失败情景。这将让按 CNY 20B 进入的 Series D 投资人遭遇实质 down-round，相较上一轮估值折价
              40-50%。所有情景里，未披露盈利时间线和经营亏损数据，是最大的不确定性驱动因素。若 FY2025 审计财务（预计 2026 年中）显示单位经济改善或恶化，每个情景的概率都会实质变化。
