  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: TacOS 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Terminus Technologies 将 TacOS 定位为面向公共域环境的 AIoT
              操作系统，而不是单点应用。从客户工作流看，平台先用传感器、控制器和边缘计算对楼宇、园区、校园和城市基础设施做设备化连接；再把数据流汇入带有数字孪生和 AI
              中台的城市操作层；随后暴露面向智慧楼宇、智慧社区、智慧园区、出行和城市治理的打包应用；最后延伸到开发者层，支持第三方定制。这一点重要，因为买方往往是城市主管部门、房地产运营商、产业园区管理者或生态伙伴，他们试图用一个操作模型管理碎片化物理资产。公开证据一贯显示，Terminus
              销售的是一套集成控制栈加打包场景应用，商业承诺是同一平台可在一次部署中协调能源、安全、出行、运营和机器人。
