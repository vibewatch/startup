      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 财务表现
        - FY2024 和 FY2025 经审计损益表、EBITDA、经营现金流及现金消耗率
        - 无法判断盈利轨迹或资金续航期；也无法给出合理 IPO 估值
        - 管理层；作为 IPO 前尽调的一部分，向 IPO 承销商索取
      - - 客户集中度
        - 前 10 大客户收入占比；NRR；总流失和净流失；合同续约率
        - 工业数智化占比 89%，需要客户级证据证明收入韧性
        - 管理层披露；用政府招投标记录和新闻稿交叉核验
      - - 监管合规
        - MLPS 等保认证级别；CAC 合规审计；DPO 任命确认；跨境数据传输路径
        - 缺少合规状态数据，就无法量化重大监管风险
        - 管理层；监管律师；独立合规审计
      - - IPO 定价与条款
        - HKEX 发行价区间；基石投资人承诺；锁定期；公众持股目标
        - 入场纪律和回报分析都需要确认后的 IPO 定价
        - HKEX 上市申请；获批后的招股书；承销商指引
      - - 募资用途
        - 剩余 Series D 资金拆分，以及计划中的 IPO 募资投向
        - 现金配置会影响现金消耗率计算和资金续航期判断
        - 管理层；招股书募资用途章节
      - - 竞争胜负数据
        - 招投标管线胜负率；竞争替换证据；Terminus 被 Huawei / Alibaba 替换的证据
        - 没有竞争结果证据，就无法确认平台防御力
        - 管理层；渠道访谈；政府采购数据库检索
    notes: 优先级反映各项对投资决策质量的影响。第 1–3 项是任何买入建议的阻断性尽调问题。
    claimRefs:
