      - number: '4.2'
        title: 定价与变现
        blocks:
          - type: paragraph
            body: >
              定价透明度有限，因为 Terminus 似乎销售协商型企业解决方案，而非标准化公开 SaaS
              套餐。公司营销全栈城市、工业和能源解决方案，独立报道则描述把硬件、软件许可和实施服务打包的多年合同。这比按席位订阅业务更难解读经济性，因为标价、量价折扣、部署折扣和变更单经济性均未披露。缺少公开标价并不意味着变现弱；它反而说明实际定价按合同而定，且可能取决于范围、硬件含量和交付复杂度。这种合同主导结构也解释了为什么单客户平均收入看起来高，以及为什么政府和大型企业采购渠道比自助式或
              SMB 获客更重要。承销视角下，关键缺口不是 Terminus 是否为产品收费，而是合同价值中有多少像软件、有多少是硬件转售、有多少是服务权重高、可能稀释毛利质量的收入。
