        - 美国 Entity List 制裁限制西方政府合同；向软件扩张可能稀释焦点
      - - SenseTime (商汤科技)
        - AI 软件平台 + Terminus Series D 投资方
        - HKEX 0020；LTM 收入 ~USD 832M；EV ~USD 7B；EBITDA 为负；部分国有
        - 智慧城市、汽车、医疗、生成式 AI；中国和 MENA
        - 计算机视觉领先；生成式 AI 平台；政府支持的国家级 AI 冠军地位
        - 美国 Entity List + 新疆制裁限制国际扩张；仍在亏损；作为 Terminus 投资方带来利益冲突
      - - Megvii (旷视科技)
        - AI 图像识别 + 供应链 IoT
        - 私营；估值 ~USD 4B（2019）；2021 年起受美国财政部投资禁令限制
        - 智慧物流、工业 IoT、住宅社区安防
        - Face++ 为最大第三方认证平台；IoT 视觉栈强
        - 美国政府制裁；IPO 路径受阻；轨迹基本局限于中国市场
