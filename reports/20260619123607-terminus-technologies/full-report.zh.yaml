      - number: '7.4'
        title: 财务、执行与资本风险
        blocks:
          - type: paragraph
            body: >-
              Terminus 的财务风险主要由三项相互牵连的暴露主导：IPO 执行风险、现金消耗和资本依赖，以及收入集中度。公司已三次向 HKEX 递交上市申请（2024 年 9 月、2025 年 4 月、2025 年 11
              月），前两次递表均失效，未转化为获批上市。持续上市延迟说明，投资人可能质疑估值，盈利缺口带来承销复杂度，或中国科技折价倍数造成市场时点约束。FY2024 收入 RMB 1.843B（同比
              +83.2%）高度集中在工业数字化（KrASIA 分析约占收入 89%），意味着单一分部放缓，或工业园区数字化合同政策变化，都可能大幅压低收入增长。公司尚未公开披露 FY2024 经营利润或
              EBITDA；公开投资人也无法知道现金消耗率和 runway。Series D 后 CNY 20B+ 估值对应约 10.9x FY2024 收入，明显高于 SenseTime 当前约 3-5x
              收入的交易倍数。政府平台投资人（Digital Chongqing、南昌政府平台、徐州产业基金）构成 Series D 资本的重要部分，带来政治性融资依赖；若政府优先级变化，退出也可能受限。Victor Ai
              作为 CEO、募资人和 Terminus 公众面孔的中心性，构成关键人集中风险；公开资料中没有确认的继任计划文件。CITIC Securities 和 Haitong International
              担任联席保荐人；任何一方退出，都会重启保荐人选择并拖延上市时间线。
