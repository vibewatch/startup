  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              Terminus 的可服务市场由三层嵌套定义界定，不能混为一谈。最宽口径是中国整体 Smart City ICT 市场，IDC 估计 2024 年规模为 RMB 939.71B（约 USD
              130B），由基础设施和 IoT 设备（58.1%）、软件（24.7%）和 ICT 服务（17.3%）构成；IDC 预计该市场到 2028 年达到 RMB 1.23T，CAGR 为
              7.1%。在这一层，Terminus 只能争取其中一部分，因为多数支出流向硬件、电信和通用云基础设施，而不是 AIoT 平台。第二层是 Frost & Sullivan 在 Terminus IPO
              招股书中定义的全球公共域 AIoT 市场：2018 年为 RMB 754B，至 2023 年以 17% CAGR 增至 RMB 1.65T，并预计到 2028 年达到 RMB 2.664T，CAGR 为
              10.1%。该市场专门覆盖部署 AIoT 操作系统式平台的商业和公共空间，因此是 Terminus 表述中的 TAM。第三层是宽泛的全球 AIoT：MarketsandMarkets 估计全球 AI-in-IoT
              市场 2025 年为 USD 25.44B，到 2030 年增至 USD 81.04B，CAGR 为 26.1%；Allied Market Research 估计更宽的全球 AIoT 市场 2023 年为
              USD 126.1B，到 2032 年增至 USD 1.32T，CAGR 为 30.2%。Market Research Future 跟踪更窄的中国特定技术板块，2024 年为 USD 142.2M，CAGR
              为 18.3%。各估计差异很大（仅中国口径，IDC 与 MRF 相差 10 倍），反映边界选择不同：完整 ICT 栈、仅软件、或特定 AIoT 子板块。承销分析中，实际 TAM 应采用 Terminus
              自身框定的公共域 AIoT 板块，SAM 则限于 TacOS 已有部署的领域：产业园区、商业地产、市政服务和住宅开发。EqualOcean 估计 2024 年中国 AIoT 产业链市场为 CNY 1.7T，年增长
              17%，显示该更宽口径包含硬件和连接。Grand View Research 引用中国智慧城市整体 28.4% CAGR，与 MarketsandMarkets 的 AIoT 视角一致，但比 IDC
              更保守、包含基础设施的视角更宽。
