      - number: '7.2'
        title: 地缘政治与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Terminus 所处的地缘环境，对中国科技公司进入西方及盟友市场越来越不友好。美国司法部在 2024 年 12 月敲定 Bulk Sensitive Data Transfer Rule（2025 年 4
              月生效），禁止部分交易让中国相关实体接触美国人的健康、金融、地理位置和个人识别数据。虽然 Terminus 尚无确认的美国收入，但未来在美国的企业部署，或涉及美国人数据流的部署，都会直接受限。美国 NDAA
              Section 889 和 NDAA 1260H 清单限制，禁止联邦承包商采购受覆盖实体的中国来源技术；一旦未来被列入 Section 889(b)(1)(D) 或 1260H，Terminus
              基本会被排除在美国联邦采购之外，并可能失去 Five Eyes 政府合同机会。美国 GAO（2024 年 7 月）认为现有规则不足以应对与中国实体相关的顾问承包风险，释放出未来收紧规则的信号。CSIS 对
              Digital Silk Road 的分析记录了中国 AIoT 出口在 Belt & Road 市场面临的双用途监控审查；多个西方政府已经禁止中国智慧城市和监控技术产品进入公共基础设施。这给 Terminus 在
              Australia、Singapore 和潜在欧洲扩张中的国际政府合同管线带来实质市场准入风险。SenseTime 作为 Terminus 投资人的关系进一步放大风险，因为 SenseTime
              本身受到美国出口限制并被列入 Entity List。
