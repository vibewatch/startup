      - number: '4.3'
        title: 单位经济与利润率
        blocks:
          - type: paragraph
            body: >
              公开证据在亏损和营运资本改善上最强，在真实单位经济上最弱。Terminus 报告 FY2022、FY2023、FY2024 和 H1 2025 的 GAAP 净亏损分别为 RMB 2.387B、RMB
              803M、RMB 2.1B 和 RMB 574M；调整后净亏损分别为 RMB 983M、RMB 600M、RMB 973M 和 RMB 500M。这意味着亏损强度较 FY2022 明显改善，但 FY2024
              仍很高，按调整后口径约为收入的 53%。与此同时，FY2022–FY2024 平均应收账款周转天数从 238 天到 180 天再到 104 天，这是回款纪律和现金转化向好的重要信号。问题在于，毛利率、EBITDA
              和收入成本拆分仍未公开，因此无法干净地区分软件贡献、硬件物料成本、部署人工或平台研发。考虑到公司在 TacOS、大模型开发、边缘基础设施和设备部署上的投入，利润率路径有可能跑通，但仍未被证明。
