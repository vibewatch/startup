      - number: '1.3'
        title: 融资历史与资本
        blocks:
          - type: paragraph
            body: >
              在中国 AIoT 公司中，Terminus 拼出了较厚的民营融资历史；轮次顺序重要，因为它同时显示投资人质量和公司的资本强度。融资轨迹始于 2017 年 7 月约 USD 73.7M 的 Series A，随后是
              2018 年 10 月 USD 173M 的 Series B，使公司以约 USD 1B 投后估值进入独角兽行列。2019 年 8 月，公司完成更大的 USD 283M Series C；2021 年 9
              月，又完成由 Warburg Pincus、Sequoia Capital 和 Alibaba Cloud 支持的 USD 93M 过渡性 Series D。最近最重要的一步是 2024 年宣布的约 CNY 2B
              Series D-2，由 AL Capital 和 Yangming Equity 共同领投，财团包括多家国资相关和战略投资方。数据库和媒体报道通常引用累计融资约 USD 899M，而中文摘要用更宽口径称约
              CNY 7B。股东图谱显示 Everbright 仍尤其有影响力，包括通过 Hunan Guangkong 持有据报 12.11% 股份。估值标记从 2018 年独角兽门槛升至 D-2 后超过 CNY
              20B；Microware 2024 年 8 月战略投资的伙伴方披露则暗示 pre-IPO 估值超过 HKD 35B。这条轨迹支撑公司的市场相关性，但也意味着投资人押注的是尚未完成的公开市场验证。
