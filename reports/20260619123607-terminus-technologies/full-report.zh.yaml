  - id: FP003
    title: 竞争护城河与就绪度 KPI
    type: kpi
    layout: standard
    summary: Terminus 有实质性的硬件锁定和不断增强的领域模型优势，但竞争对手资本更强，且其护城河主张来自委托研究，整体护城河置信度被拉低。
