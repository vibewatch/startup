        blocks:
          - type: paragraph
            body: >-
              证据最充分的架构描述来自 2022 年 TacOS 3.0 发布材料、后续渠道访谈和招股书报道。TacOS 被描述为分层公共域 AIoT
              架构，由设备连接、计算、数字孪生、应用中间件和开发者工具组成统一栈。CityIoT 承载设备侧感知和控制；CityOS 提供城市级操作核心、数字孪生和 AI 中台；CityApp
              打包使用场景软件；CityAIoT 为开发者和合作伙伴提供在其上构建的框架。2025 年，公司加入与 DeepSeek 相关的三层 AI 框架，覆盖领域模型、绿色 AI 基础设施和智能体，实际上把 TacOS
              从编排软件推向物理 AI 应用。第三方描述也指向面向 HVAC、照明、门禁和机器人系统的模块化接口和 API，支撑一个判断：关键运营优势不是单一算法，而是集成宽度。
