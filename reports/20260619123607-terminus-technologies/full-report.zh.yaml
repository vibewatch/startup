companyProfile:
  summary: >
    Terminus Technologies (特斯联) 是一家中国 AIoT 基础设施公司，由 Victor Ai 于 2015 年创立。其核心平台 TacOS
    连接设备、应用、算法和基础设施，覆盖工业数字化、城市智能、智慧生活和智慧能源场景。公开披露和 IPO 相关报道显示，公司 FY2024 收入达到 RMB 1.843B，业务覆盖 150+
    城市，并获得独角兽级融资；但它仍未公开盈利能力和现金指标，难以支撑对价格敏感的投资决策。
  founders:
    - name: Victor Ai
      role: 创始人兼 CEO
      background: 曾任 Everbright New Economy Fund 负责人，此前有投资和金融经验。
