  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与概况
        blocks:
          - type: paragraph
            body: >
              Terminus Technologies 使用几个彼此接近的标签，尽调时必须分清，因为公开材料、媒体报道和 IPO 报道并不总是使用同一个名称。运营品牌是 Terminus Group，中文名是特斯联
              (Tesilian)，围绕香港上市流程的报道显示，法律实体已从较早的 Chongqing Terminus Smart Technology Inc., Co., Ltd. 变为 Terminus Smart
              Technology Co., Ltd.。公司 2015 年创立于中国重庆，现在把自己定位为以自研操作系统 TacOS 为核心的 AIoT 基础设施公司。TacOS 被描述为五层 AIoT
              架构，连接设备、数据、模型和行业工作流，而不是单一应用产品。当前运营重点覆盖四个板块：AI Industrial Digitalization、AI City Intelligence、AI Smart
              Living 和 AI Smart Energy。总部活动现在似乎分布在北京（当前中国总部）和迪拜（2024 年 3 月启用的国际基地），支撑公司把自己包装为扎根中国、但可全球部署的城市 AI
              平台。从阶段看，Terminus 仍是后期民营公司：Series
              D、pre-IPO，并仍在推进香港上市。多板块产品宽度、有记录的国际扩张和正在进行的上市诉求叠加，使第一章的身份信息对后续市场、客户和财务分析尤其可复用。
