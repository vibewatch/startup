        title: 展示材料
        blocks:
          - type: callout
            title: 88% 收入增长轨迹
            body: >
              Terminus 进入后期融资和 IPO 窗口时，收入动能很强：FY2024 收入达到 RMB 1.843B，同比增长 83.2%，三年 CAGR 约 58%，订单储备据报为 RMB
              2.3B。这组数据表明，公司有真实客户需求，而不只是概念化 AI 叙事。
            calloutType: strength
            claimRefs:
              - CO030
              - CO031
              - CO033
          - type: callout
            title: 持续经营亏损与三次 IPO 申请失效
            body: >
              核心风险在于，Terminus 仍同时承受重度亏损和未解决的公开市场时点问题。FY2022 的 GAAP 亏损巨大，且到 FY2024 和 H1 2025 仍很可观；第三次申请成为当前申请前，连续两次 HKEX
              申请失效。这一模式引发对盈利时点和 IPO 转化能力的担忧。
            calloutType: risk
            claimRefs:
              - CO028
              - CO029
              - CO042
