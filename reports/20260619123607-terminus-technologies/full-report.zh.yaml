  - id: FR001
    title: 风险热力图：Terminus Technologies 概率 × 影响
    type: matrix
    layout: wide
    summary: 按概率（列）和影响（行）映射 Terminus 关键风险，用于确定优先级。
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 高 / 关键影响
          values:
            - 硬件供应链中断
            - AI/LLM 模型失效
            - TacOS 平台宕机（关键基础设施）
        - label: 中等影响
          values:
            - 外汇 / 汇率敞口
            - HKEX IPO 执行延迟
            - 中国 NDSMR 执法行动
        - label: 中低影响
          values:
            - 伙伴冲突（SenseTime / JD.com）
            - 美国 NDAA 限制收紧
            - 数据泄露 / 网络安全事件
        - label: 运营 / 执行风险
          values:
            - 国际团队执行缺口
            - 收入集中度显性化
            - 关键人物流失（CEO Victor Ai）
    approximationNotes: 概率和影响是基于监管分析、同业先例和公司申报文件作出的定性分析师判断；不是精算计算。
