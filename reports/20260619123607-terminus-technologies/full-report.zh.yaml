  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 描述
      - 市值 / 估值
      - EV/Revenue 倍数
      - 与 Terminus 的相关性
      - 局限
    rows:
      - - 'SenseTime Group (SEHK: 0020)'
        - HKEX 上市中国 AI 软件平台；智慧城市和企业 AI；2025 年市值约 USD ~$2-3B
        - ~USD 2-3B（公开市场，约 HKD 18B）
        - ~3-5x（2024 收入）
        - 最直接可比的 HKEX 上市中国 AI 软件公司；Terminus 投资者和竞争对手
        - SenseTime 受美国 Entity List 限制；收入模型不同（许可 vs. 全栈部署）；IPO 后从 HKD 3.85/股下跌，说明中国科技折价风险
      - - 'Horizon Robotics (SEHK: 9660)'
        - HKEX 上市中国边缘 AI 芯片公司；2024 年 10 月上市；2024 年收入 CNY 2.38B
        - ~HKD 70B+（公开市场，2024 年上市）
        - ~15-20x（2024 收入）
        - 中国 AI 公司规模化登陆 HKEX 的先例；2024 年成功上市，可作为牛市类比
        - 收入模型（硬件 + 软件）不同于 Terminus；上市时已盈利；半导体聚焦与 AIoT OS 不可比
      - - Megvii Technology
        - 中国计算机视觉 AI 平台；2019 年估值 ~$4B；两次撤回 HKEX IPO 申请；美国 Entity List
        - ~USD 4B 私募（2019）
        - ~unknown（私有，收入未披露）
        - 中国 AI 公司在地缘政治压力下 HKEX IPO 失败的直接先例；可作为 Terminus 熊市类比
        - 估值已过时（2019）；美国 Entity List 纳入比当前 Terminus 风险更严重；聚焦人脸识别，方向不同
      - - 'Fourth Paradigm (SEHK: 6682)'
        - HKEX 上市中国 AI 企业平台；2023 年 9 月上市
        - ~HKD 10-15B（公开市场）
        - ~5-7x（2023 收入）
        - 另一个 HKEX 中国 AI 企业平台上市先例；政府 / 企业客户组合相近
        - 聚焦企业 AI 模型平台；收入模型不同于 Terminus 基础设施层 AIoT
      - - Crunchbase 中国 AI 独角兽集群
        - CBInsights / Crunchbase 2024-2025 数据中，中国 AI 独角兽在私募轮估值 $1-10B 的一组公司
        - 中位数 ~$2-4B
        - ~8-15x ARR（私募成长阶段）
        - 为 Terminus 在中国 AI 私有独角兽估值分布中的位置提供背景
        - 私募倍数包含公开可比对象没有反映的控制权溢价和增长预期；私募估值需考虑流动性折价
      - - GetLatka Terminus 收入估算
        - GetLatka 对 Terminus 2024 年 ARR 的估算为 $258M
        - ~$3B（GetLatka 估算）
        - ~11.6x 收入
        - 为公开收入倍数估算提供合理性校验，与 Series D 后 CNY 20B 估值一致
        - GetLatka 收入估计未经验证，只能视为近似值；未审计；方向上与 KrASIA FY2024 数据一致
    notes: 可比公司优先选取 HKEX 上市的中国 AI 公司，以及近期中国 AI 私募融资轮。所有公开市值和收入倍数均为 2026 年中分析师研究的近似值。Terminus 私有市场估值基于 Series D 后报道。
