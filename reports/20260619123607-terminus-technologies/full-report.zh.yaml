      - number: '2.4'
        title: 规模测算缺口与负面证据
        blocks:
          - type: paragraph
            body: >-
              几个关键证据缺口限制了本次市场规模测算的精度。第一，没有独立第三方发布过针对中国公共域 AIoT 操作系统市场的已验证 SAM 或 SOM 估计；Frost & Sullivan 的估计由 Terminus
              委托，并似乎只出现在其招股书中，可能存在乐观划定边界的空间。第二，MarketsandMarkets 和 Allied Market Research 的全球数字包含硬件、连接和平台板块，相比 Terminus
              的软件 / 平台收入池，显著抬高了标题数字。第三，IDC 2025 年 1 月下调预测是负面信号：其目前用于 2023–2028 年的 7.1% CAGR 明显低于 Frost & Sullivan 估计中的
              17% CAGR，也低于 MarketsandMarkets 给出的全球 AIoT 26.1% CAGR，引出一个问题：中国特定的政府预算压力是否会压低 Terminus
              核心国内市场增速，且速度快过国际扩张的补偿。第四，Terminus 披露的客户数（2024 年 342 个 vs. 更新后招股书中 2024 年中 800+）在不同文件中不一致，带来尽调风险。第五，Market
              Research Future 估计（2024 年中国智慧城市 USD 142.2M）比 IDC 估计（RMB 939.71B ~= USD
              130B）小三个数量级，说明各方使用的市场定义完全不同；尽调团队在依赖任何单一数字前，应先逐一映射每家分析机构的边界标准。表 TM002
              保留了相互矛盾的市场规模估计，在未与每位报告作者做具体边界映射前，不应强行调和。
