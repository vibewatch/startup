      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 建议：继续研究 —— 等待盈利披露和 IPO 定价
            body: >-
              基于当前证据集，Terminus Technologies 获得继续研究建议。基本面质量可以证明——83% 同比收入增长、RMB 2.3B 订单积压、领先市场地位，以及 DeepSeek
              带来的成本结构改善。但若没有以下信息，投资决策无法负责任承销：（1）FY2025 审计财务确认盈利轨迹；（2）IPO 定价不高于 9x 前瞻收入；（3）客户集中度数据低于前三大 40% 阈值；（4）活跃的
              HKEX 上市申请。按 CNY 20B+ 私募估值（10-15x 收入、无盈利披露）进入并不建议，因为倍数偏高且执行风险较大。
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: SenseTime 先例：中国科技折价是结构性的，不是周期性的
            body: >-
              SenseTime（SEHK: 0020）2021 年 12 月以 HKD 3.85/share 在 HKEX 上市，市值超过 USD 17B，随后因美国 Entity List
              指定、盈利挑战和中国科技行业重定价而大幅下跌。该股上市以来大部分时间显著低于 IPO 价格，是表现最差的中国大型 AI 公司 IPO 之一。Terminus 面临结构上相似的风险：HKEX 投资人对亏损中国 AI
              公司的经验，已经把倍数预期向下重置；任何监管逆风迹象（Entity List、NDSMR 执法）都可能引发 SenseTime 式的 IPO 后崩塌。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV021
          - type: callout
            title: 关键假设：CNY / HKD 汇率在 IPO 估值比较中保持稳定
            body: >-
              所有牛市 / 基准 / 熊市估值情景均假设 CNY / HKD 汇率接近当前水平（约 CNY 1 = HKD 1.10）。若 CNY 对 HKD / USD 实质贬值，以 HKD 计价的 IPO 估值相对 CNY
              计价私募账面值会被压缩，构成情景中未捕捉的额外下行风险。Pre-IPO 投资人的货币对冲选择有限。
            calloutType: assumption
