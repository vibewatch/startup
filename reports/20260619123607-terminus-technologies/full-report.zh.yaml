      - number: '6.3'
        title: 采用轨迹、收入扩张与运营信号
        blocks:
          - type: paragraph
            body: >-
              公开数字显示，2022 年到 2024 年，Terminus 客户基础在扩张，但并非爆发式增长。关键分析点在于，收入增长远快于客户数：2024 年收入达到 RMB 1.843B，而当年计数客户只从 330 增至
              342。仅工业数字化收入就从 2023 年 RMB 624M 增至 2024 年 RMB 1.64B，说明商业故事更多由账户内扩张、更大的项目范围或更高价值的工业部署推动，而不是单纯新增 logo。RMB
              2.3B 的订单积压，以及应收账款周转天数从 2022 年 238 天改善到 2024 年 104 天，也支持 Terminus
              执行质量改善的判断，尽管公司仍在亏损。公开记录仍未披露活跃席位、使用率或续约指标，因此采用轨迹主要通过项目足迹、城市覆盖、订单积压和收入结构可见，而不是通过软件式客户参与数据可见。
