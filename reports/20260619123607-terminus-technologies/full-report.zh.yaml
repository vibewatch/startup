      - number: '8.4'
        title: 退出准备度、建议与风险评级
        blocks:
          - type: paragraph
            body: >-
              按当前隐含估值看，Terminus 尚未准备好面对公开市场投资人退出。三项关键准备缺口是：（1）盈利披露——公开资料没有经营 P&L、EBITDA 或现金消耗；这对机构 IPO
              投资人是基本门槛。（2）收入质量——工业数字化占比 89%，需要放到客户集中度、合同续约率和净收入留存的背景下解释，但这些数据均未公开。（3）IPO 执行不确定性——三次递表失效意味着 Terminus
              上市确定性明显低于首次递表公司。我们的建议是继续研究。这反映了：（a）真实的基本面质量——收入快速增长、订单积压、DeepSeek 带来的成本结构改善，以及 Frost & Sullivan
              市场定位较强；（b）关键缺失数据——盈利能力、单位经济、客户集中度和 IPO 条款；（c）估值不确定——牛市情景（HKD 35B+）与熊市情景（HKD 8-12B）差距过大，若没有 IPO
              招股书数据，无法形成有信心的入场纪律。若盈利数据可得，并显示 FY2026 前后有可信 breakeven 路径，且收入集中度可接受（前三大客户 <40%），建议可上调为跟踪，入场倍数目标为 7-9x
              前瞻收入。买入建议需要满足：HKEX 批准、IPO 定价不高于 HKD 20B、FY2025 收入增速超过 50%，以及确认 18+ 个月盈利续航。风险评级：高——由财务不透明、IPO
              执行风险、中国科技行业折价、NDSMR / CSL 监管风险和地缘逆风驱动。
            claimRefs:
