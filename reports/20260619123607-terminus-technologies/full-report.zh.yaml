      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >
              如公司概览章所述，Terminus 已募集大量民营资本；这里的财务问题是，这一资本基础是否足以支撑公司在 IPO 或其他流动性事件前继续扩张。第三方数据集和新闻报道显示累计融资约 $899M，中文来源称总额约
              CNY 7B，Series D-2 后估值超过 CNY 20B。2024 年 4 月约 CNY 2B 的 D-2
              轮明确投向大模型应用、绿色高性能计算基础设施和全球扩张，说明管理层仍在为产品和资产负债表密集型增长同时融资。Microware
              披露的战略投资提供了一个可见外部资本信号，但账面现金、月度烧钱速度、资金跑道、债务融资额度和项目融资义务仍未披露。Terminus 已三次递交 HKEX 上市申请，2024 年 9 月和 2025 年 4
              月申请在 2025 年 11 月重新递表前失效。这一模式支持一个判断：IPO 执行是投资人流动性的核心，但如果盈利能力或市场条件继续压制上市动能，时间线风险仍然重大。
