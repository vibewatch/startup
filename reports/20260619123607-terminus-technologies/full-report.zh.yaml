            title: Belt and Road 国际扩张
            body: >
              Terminus 并未把自己定位为仅服务中国的 AIoT 供应商。迪拜国际总部、Expo 部署历史，以及被引用的 172+
              城市覆盖，共同支撑了一条多元化叙事：海外智慧城市项目既是增长向量，也是投资人评估可出口性的证明点。
