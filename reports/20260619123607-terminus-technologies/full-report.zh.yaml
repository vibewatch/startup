      - number: '3.3'
        title: 护城河、切换成本与差异化耐久性
        blocks:
          - type: paragraph
            body: >-
              Terminus 的主要护城河主张是 TacOS 作为亚洲首个规模化公共域 AIoT OS，并由 Frost & Sullivan 按收入给出的中国 top-5 排名（委托研究）支撑；同时，它也出现在
              Allied Market Research 的全球 AIoT 供应商名单中，与 Microsoft、Google、IBM、AWS、Siemens 和 GE Vernova 并列。TacOS
              边缘硬件的物理嵌入形成有意义的切换成本锁定：已部署 Terminus 传感器、机器人和边缘计算单元的楼宇或园区，若切换平台，需要承担硬件更换和数据迁移成本。这类似商业地产中已有充分记录的 building
              management system（BMS）供应商锁定。

              但几个护城河耐久性风险很重要。第一，Terminus 的护城河由公司通过委托研究提出；没有独立基准或第三方评测把 TacOS 与竞争 AIoT 操作系统排名比较。第二，Hikvision 为监控系统加入 LLM
              能力（由 Wikipedia 记录，并经中国运营方部署确认）直接侵蚀了 Terminus 用来差异化的智慧城市 AI 叙事。第三，SenseTime 约 USD 7B 的 EV（据 Multiples.vc）和
              Hikvision 约 USD 39B+ 的市值，远高于 Terminus 的 HKD 35B+ pre-IPO 估计（约 USD 4.5B），让竞争对手在研发和渠道投入上拥有资本优势。第四，中国大型 AI
              既有巨头（Huawei、Alibaba、Tencent）可以把智慧城市 AI 打包进既有政府关系中，对客户几乎零增量成本。

              多供应商并用风险为中等：大型房地产开发商和市政机构通常在不同城市子系统使用多家供应商（Hikvision 做安防、iFLYTEK 做语音、Schneider 做能源、Terminus 做 AIoT
              OS）。这限制了 Terminus 在任何单一部署中垄断钱包份额的能力，尽管 TacOS 宣称围绕与第三方设备开放互操作设计，意在让 Terminus 成为集成层，而不是封闭系统。
