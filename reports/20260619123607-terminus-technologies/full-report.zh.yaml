      - number: '5.4'
        title: 机器人、物理 AI 与真实世界可靠性信号
        blocks:
          - type: paragraph
            body: >-
              Terminus 不只卖软件。公司反复把 TacOS 与机器人和其他物理 AI 端点绑定，最典型的是 Titan 机器人家族和 Expo 2020 Dubai 部署。机器人材料描述了三条产品线、六个型号，包括具备
              5G 和 40 千克载重能力的配送或零售机器人、带热感知的巡检机器人，以及拥有 15 升容量和全地形移动能力的消杀机器人。三层机器人架构和基于 SLAM 的导航被呈现为核心使能技术。Expo
              部署是最大的公开证明点：152 台机器人、超过 650,000 次交互、行驶 322,000 公里、运营 84,000 小时，服务约 1,250
              万名访客。这些运营统计不能完全验证长期商业正常运行时间，但它们确实说明 Terminus 已把 TacOS 连接设备落到活动级规模，而不是停留在概念阶段。
