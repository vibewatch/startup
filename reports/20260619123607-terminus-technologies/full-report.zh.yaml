      - - AI 城市智能（交通、安全、市政服务）
        - 智慧城市平台许可、传感器基础设施、城市治理看板
        - 一般城市基础设施（道路、公用事业）、非 AI 监控系统
        - 市政政府 CIO、数字经济局、城市管理机构
        - 依赖政府预算；Terminus 第二大细分业务；暴露于财政放缓风险
      - - AI 智慧生活（住宅、社区、智慧停车）
        - 楼宇 AIoT 系统、门禁、智慧社区服务、ESG 跟踪
        - 标准建筑施工、非智能物业管理、电信带宽
        - 房地产开发商、住宅社区管理方、房地产资产信托
        - Terminus 第三大细分业务；帮助开发商做溢价差异化；中端市场在增长
      - - AI 智慧能源（碳管理、能源优化、清洁能源）
        - 能源管理平台、光伏 / 储能集成、碳追踪软件
        - 传统公用事业计费、商品能源供应、硬件制造
        - 能源运营商、工业设施、有 ESG 要求的商业楼宇
        - Terminus 第四大细分业务；估值倍数顺风最快；由 ESG 监管驱动
      - - 中国智慧城市 ICT 广义市场（IDC 定义）
        - 智慧城市场景下的全部 ICT 支出（基础设施、软件、服务）
        - 非 ICT 城市资本开支（实体基础设施、道路、供水）
        - 国家和市政政府、国有企业
        - 广义 TAM 参照（2024 年 RMB 939.71B）；多数支出不是 Terminus 可直接触达的收入池
      - - 全球公域 AIoT（招股书中的 Frost & Sullivan 定义）
