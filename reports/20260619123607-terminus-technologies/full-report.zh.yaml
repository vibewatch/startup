        - 相比 Terminus 完整空间 AIoT OS，产品更窄（语音优先）；同时也是 Terminus 早期投资方
      - - Huawei Smart City
        - 全栈政府 AI + 电信的大型科技既有玩家
        - 私营（未上市）；中国最大企业之一；>190,000 名员工
