          - type: callout
            title: 地缘政治风险给国际收入设置非对称上限
            body: >-
              美国 NDAA 限制、DOJ 批量数据传输规则，以及 Digital Silk Road 地缘审查，合力把 Terminus 可触达的国际政府市场限制在西方结盟程度较低的市场。UAE 和 Singapore
              部署目前避开了直接美国连接，但若扩张至 Australia（Five Eyes）、UK 或 EU 市场，就会触发对公共基础设施中中国技术的监管审查。这个地缘上限是结构性的，不是周期性的，也限制了部分支撑 HKD
              35B+ pre-IPO 估值估算的国际多元化叙事。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR021
              - CR025
              - CR033
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Terminus Technologies 的投资论点建立在四根支柱上：（1）收入快速放量——FY2024 收入 RMB 1.843B（同比 +83.2%），三年 CAGR 约 58%，RMB 2.3B
              订单积压提供近期可见度。（2）平台防守性——TacOS 被称为亚洲首个公共域 AIoT OS，号称可互操作 100+ 设备品牌，切换成本嵌入城市级基础设施合同。（3）市场顺风——中国 AIoT 市场预计从 CNY
              1.65T（2023）增至 CNY 2.66T（2028），CAGR 10%；工业数字化推动企业支出。（4）IPO 可选性——如果 Terminus 以 Microware 估算的 HKD 35B+ 估值完成
              HKEX 上市，按 CNY 20B Series D 后估值进入的 pre-IPO 投资人可能获得可观回报。反论点同样有力：（a）三次 HKEX
              递表失效，说明投资人怀疑或承销难度持续存在；（b）没有披露盈利时间线，现金消耗风险没有上限；（c）收入集中在工业数字化（FY2024 收入 89%），构成二元行业风险；（d）SenseTime 上市后股价从
              HKD 3.85/share 峰值跌至 HKD 1 以下，显示中国科技折价对 AIoT 公司的风险；（e）地缘逆风——美国 NDAA 限制、DOJ
              批量数据规则、西方市场对中国科技行业限制——压低国际增长故事；（f）Series D 后 CNY 20B+ 估值假设高增长连续性，但没有确认的盈利路径。
