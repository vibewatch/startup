      - number: '3.2'
        title: 能力对比、定价与 GTM
        blocks:
          - type: paragraph
            body: >-
              Terminus 的差异化来自把公共域 AIoT OS（TacOS）与领域特定大模型、边缘加云计算，以及自有硬件机器人 / 终端层整合在一起。Hikvision 和 Dahua
              在视频监控硬件宽度、全球分销和价格竞争力上领先，但在软件平台深度和 LLM 集成上落后。SenseTime 在 AI 软件（计算机视觉、生成式 AI）和研究履历上领先，但其智慧城市收入只是 Terminus
              AIoT 特定部署的一小部分，并且面临美国制裁，限制部分国际市场。iFLYTEK 在语音 AI 和语音识别上领先，但在空间 / 物理楼宇智能上更窄。Megvii 的智慧物流和 AIoT IoT
              产品在更窄栈上竞争。

              所有竞争者的定价证据都有限。Terminus 提供全栈项目制定价，把硬件、软件许可和服务打包。Hikvision 和 Dahua 通常在硬件单价上领先，但也围绕维护合同竞争。SenseTime
              使用企业软件许可，采用按席位或 API 调用的模式。切换成本不对称：一旦 TacOS 边缘设备实体安装，并用楼宇特定数据训练领域模型，迁移到 Hikvision 或 SenseTime
              平台需要更换硬件并投入大量重新集成工作。相比之下，在软件分析层从 SenseTime 切换到 Terminus（或反向切换）成本较低，但仍需要 API 和数据重映射。

              Terminus 的 GTM 高度依赖伙伴渠道（1,300+ 组织）和面向产业园区、政府机构与开发商的项目制直销。它不如 SaaS 模型竞争者可扩展，但能形成更黏的关系。Hikvision
              通过全球经销商和系统集成商渠道形成的分销能力，是其关键 GTM 护城河——Terminus 在国内或国际都未能规模化复制这一渠道。MarketsandMarkets 在能力矩阵中将
              AWS、IBM、Google、Microsoft 和 Bosch.IO 识别为全球 AIoT 领导者，凸显 Terminus 在国际市场相对西方 hyperscaler 面临的竞争。
