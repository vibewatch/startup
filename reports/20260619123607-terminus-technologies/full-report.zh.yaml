  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——直接同业、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Terminus 的竞争格局可分为四类。第一类是硬件主导的视频监控既有巨头：Hikvision 和 Dahua。Hikvision 成立于 2001 年并在 Shenzhen Stock Exchange
              上市，是全球最大的视频监控设备制造商，截至 2021 年约有 42,685 名员工，收入处于数十亿美元中段，是智慧城市感知和基于摄像头的城市智能中最直接的既有威胁。Dahua Technology
              是第二大监控设备厂商。两者都在扩展软件分析和 AIoT 仪表盘，直接挑战 Terminus 的 city intelligence 板块。第二类是中国 AI 平台公司：SenseTime (SEHK:
              0020)、Megvii (Face++) 和 iFLYTEK。SenseTime 是 Terminus 的投资方（通过 Series D），形成投资方—竞争对手双重关系；它开发计算机视觉、智慧城市和生成式 AI
              软件，LTM 收入约 USD 832M，EV 约 USD 7B。Megvii 聚焦图像识别和 IoT，2019 年估值 USD 4B，2019 年以来受到美国政府制裁，并和 SenseTime
              一样扩展智慧城市能力。iFLYTEK 既是 Terminus 早期投资方（pre-Series D），也是语音 AI 和智慧城市解决方案竞争对手。

              第三类是凭生态宽度竞争的大型科技公司智慧城市部门：Huawei Smart City（IdeaHub、Kunlun 平台）、Alibaba City Brain（杭州 ET City
              Brain、交通管理）、Tencent Smart City 和 Baidu AI Cloud。这些玩家可以把 AIoT 与 hyperscaler 云、5G 网络管理和政府关系打包，规模是 Terminus
              难以匹敌的。第四类是现状和替代方案：传统 BMS（building management system）供应商（Siemens、Honeywell、Schneider Electric）、定制系统集成商，以及大型
              SOE 自建专有 IoT 平台的内部建设选项。Market Research Future 将 Siemens、Cisco、IBM、Schneider
              Electric、Honeywell、Oracle、Hitachi 和 NEC 列为中国智慧城市市场主要玩家之一，说明国际供应商在更宽 ICT 层已有深度渗透。这些公司没有一个直接以公共域 AIoT OS 与
              TacOS 竞争，但它们主导了 Terminus 无法获得的硬件基础设施预算。
