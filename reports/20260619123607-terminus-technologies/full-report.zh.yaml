      - number: '1.4'
        title: 里程碑与规模
        blocks:
          - type: paragraph
            body: >
              里程碑记录显示，公司已经取得真实商业和部署规模，同时也背负亏损和 IPO 时点的明显负面叙事。自 2015 年创立后，Terminus 很快进入大型机构融资，并在 2018 年 Series B
              达到独角兽状态。运营上，最知名的公开部署仍是 Expo 2020 Dubai：Terminus 是中国唯一官方高级合作伙伴，部署了 150 多台 Titan
              机器人执行面向访客的任务，为智慧城市和机器人愿景打造了展示型标杆。到 2024 年，公司已扩展至 150 多座城市和 800 多个客户；后续 2025 年披露把这些数字推至 172+ 城市和 900
              个客户以上，同时据报订单储备达到 RMB 2.3B，应收账款周转天数从 2022 年的 238 天大幅改善至 2024 年的 104 天。财务上，FY2024 收入加速至 RMB 1.843B，同比增长
              83.2%，AI Industrial Digitalization 板块成为清晰增长引擎。负面同样重大：FY2022 至 H1 2025，GAAP 亏损仍很大；公司在 2025 年 11
              月递交第三份招股书前，连续两次 HKEX 申请失效。对投资人而言，结论很直接：Terminus 已经有足够收入、客户、资本支持和旗舰部署，仍具 IPO 相关性，但尚未把规模转化为可信的公开市场准备度。
