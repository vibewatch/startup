  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              Terminus 的 TacOS 平台在中国和海外收集、处理楼宇、工业园区、城市基础设施和住宅社区等城市级数据。这种数据姿态让公司叠加承受中国分层数据治理体系下的义务。2025 年 1 月 1
              日生效的《网络数据安全管理条例》（NDSMR）把合规要求从个人信息扩展到所有网络生成数据，要求 Terminus 作为大规模 IoT 数据处理者承担数据分类、风险评估、跨境传输限制和事件报告义务。PIPL
              对严重违规最高可处年收入 5% 的罚款——按 FY2024 收入计算，相当于 RMB 92M；CSL 修订案（2026 年 1 月 1 日生效）则显著提高关键信息基础设施运营者的处罚。2025
              年以来，中国网信办（CAC）持续加大对数据密集型科技公司的执法力度。根据 NDSMR，Terminus 在 UAE、Singapore 和 Australia 的国际部署，只要处理中国公民数据，就会触发 PIPL
              的域外适用；从自贸区进行跨境传输现在也受到负面清单约束。WilmerHale 分析还指出，与 NDSMR 最终落地同步发布的 FTZ 数据出口负面清单，直接限制了 Terminus
              自贸区注册实体的部分数据流。公司尚未公开披露这些义务所需的合规基础设施；公开文件中也无法确认董事会级 DPO 任命和 MLPS 认证等级。
