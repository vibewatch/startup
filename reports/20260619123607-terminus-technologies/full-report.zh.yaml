            body: >
              公开记录支持一个混合但自洽的财务结论。正面看，Terminus 已达到有意义的收入规模，FY2024
              增长大幅加速，应收账款回款改善，活跃客户扩大，订单储备也显示大型企业和政府项目仍有需求。负面看，收入质量只能算中等，因为收入确认似乎依赖项目，软件与硬件之间的收入结构没有清晰拆分，且公司在快速增长下仍承担大额调整后亏损。资本强度也偏高，因为硬件、部署、基础设施建设和模型训练都会在收入完全实现前消耗现金。最大阻塞项很具体：未披露分部毛利率、现金余额或资金跑道、债务时间表、客户集中度表，也没有证据充分支撑的持续盈利路径。USD
              2.75B–4.5B 区间的估值信号意味着投资人仍在承销战略上行空间，但仅凭公开证据，还不足以有把握承销利润率耐久性或近期流动性。
