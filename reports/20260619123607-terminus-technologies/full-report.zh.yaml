      - number: '3.4'
        title: 负面证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              对 Terminus 最重大的竞争负面信号是，其两个最可比的 HKEX 上市同业（SenseTime 和 Horizon Robotics，后者聚焦汽车 AI 芯片）都在亏损：SenseTime 的 LTM
              EBITDA 为负 USD 110M，收入 USD 832M（EBITDA margin -13%）；Horizon Robotics FY2024 收入 CNY 2.38B，净利润 CNY
              2.35B（由会计处理带来的一次性转正），但上市前 HKEX 结构未必能转化为 Terminus 类似盈利能力。多个相似代际的中国 AI 公司递交 HKEX 上市申请并在上市后持续亏损，这一先例对
              Terminus 的估值耐久性构成负面信号，即便它成功上市。

              SenseTime 的美国制裁（2019 年 10 月因 Xinjiang 相关所谓人权侵害被列入 Entity List）凸显双重风险：尽管制裁尚未直接影响 Terminus，但它展示了中国 AI /
              监控公司在国际市场中的地缘政治敞口。随着 Terminus 的 city intelligence 产品在 UAE 和 Saudi Arabia 场景部署，其 MENA 扩张可能面临类似西方政府审查。Megvii
              自 2021 年 12 月以来面临类似 US Treasury 投资禁令，并于 2024 年 1 月被列入 US DoD 名单，说明中国 AIoT 公司国际扩张时的美中技术脱钩风险并非理论问题。

              工业园区板块的商品化风险是真实的：Terminus 增长最快的垂直正在吸引地方和全国性 SOE 系统集成商，它们在建设自有智慧园区解决方案，削弱 Terminus 相对 Huawei 或 Alibaba
              Cloud 打包替代方案可收取的溢价。Terminus 2022 年收入下滑（COVID 扰动）并仅靠项目周期时点恢复的模式说明，即使没有结构性竞争替代，项目制模式下收入也可能波动。
            claimRefs:
              - CP024
