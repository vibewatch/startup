      - number: '8.5'
        title: 破坏投资论点的触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Terminus 的投资论点需要监控五类破坏性事件，每一类都会强化或削弱买入 / 跟踪 / 回避决策。第一，IPO 执行：第四次 HKEX
              递表失效，或撤回且没有过桥融资，将构成硬性论点破坏，需要重新评估替代流动性路径。第二，盈利轨迹：如果 FY2025 结果（预计 H1 2026）显示，在收入增长超过 40%
              的情况下经营亏损仍扩大，利润率扩张论点就被打破，估值应下调重估。第三，监管行动：CAC 对 Terminus 或可比中国 AIoT 公司执法，或美国 Entity List
              指定，将触发结构性估值重定价。第四，收入集中度：如果 IPO 招股书披露前三大客户集中度超过 50%，收入质量故事会比暗示的弱很多。第五，竞争压力：如果 Huawei Cloud、Alibaba Cloud 或
              Hikvision 发布价格低于 Terminus 的竞争性公共域 AIoT OS 平台，平台防守性论点需要修正。最终尽调问题按优先级排列：（1）FY2024 和 FY2025 审计财务，包括经营
              P&L、EBITDA 和现金流；（2）客户集中度——前十大客户收入占比、NRR 和合同续约数据；（3）MLPS 认证等级和 CAC 合规姿态；（4）IPO 定价参数——发行价区间、锁定期、pre-IPO
              投资人二级出售可得性；（5）IPO 募资用途和 Series D 剩余资本；（6）竞争平台情报——任何投标失败或被竞争替换的数据。
