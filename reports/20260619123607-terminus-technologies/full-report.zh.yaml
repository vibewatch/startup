      - number: '7.5'
        title: 破坏投资论点的触发器与否决标准
        blocks:
          - type: paragraph
            body: >-
              Terminus 风险画像中的每个高严重度风险，都有可监控触发器。一旦触发，就会构成破坏投资论点的事件，要求退出或对投资论点进行实质重承销。监管风险的主要触发器，是 CAC 对 Terminus 或高度可比的中国
              IoT 公司采取正式执法行动，或 PIPL 罚款超过 RMB 100M；这会显示执法姿态升高，并影响运营成本和政府客户中的声誉。地缘政治和出口管制风险方面，若 Terminus 被列入美国 Bureau of
              Industry and Security Entity List、Section 889(b)(1)(D) 覆盖公司清单，或类似盟友政府限制清单，将实质损害国际政府销售和 IPO 估值。IPO
              执行风险方面，若第四次 HKEX 递表失效，或到 2026 日历年末仍未上市且没有替代融资，将显示公司无法进入公开资本市场，并需要重新评估流动性时间线。财务风险方面，若 FY2025 经营亏损恶化（超过 RMB
              300M），同时收入增速放缓至 40% 以下，将说明单位经济恶化，盈利路径受到挑战。客户和收入集中度方面，如果发现前三大客户贡献超过年收入 50%，将确认集中度风险超过可接受阈值。缓释因素包括 RMB 2.3B
              订单积压带来近期收入可见度、Series D 资本提供运营 runway，以及 DeepSeek 集成降低推理成本。投资人在加深敞口前，应围绕 HKEX 递表状态、CAC
              执法动态、国际政府合同管线和盈利披露建立监控触发器。
