        - IPO 延期；盈利不及预期；市场重估
        - 低-中（需要多个有利条件同时出现）
      - - 基准
        - HKEX 上市伴随中等折价；FY2025 收入 RMB 2.2-2.5B（+20-35%）；经营亏损收窄但尚未盈利；中国科技倍数压缩有限
        - HKD 18-28B（约 USD 2.3-3.6B）；约 FY2024 收入 7-12x
        - 更广泛的中国科技板块折价；收入放缓；监管摩擦
        - 中（基于当前证据，最可能的单一情景）
      - - 熊市
        - 第四次 HKEX 申请失效或上市时大幅折价；FY2025 经营亏损扩大；收入增速低于 30%；出现不利监管或地缘政治事件
        - IPO 或私募轮隐含估值 HKD 8-15B（约 USD 1.0-1.9B）；约收入 4-6x；相对 Series D 后 CNY 20B 估值构成 down-round
        - IPO 失败；盈利危机；Entity List；SenseTime 式倍数压缩
        - 低-中（考虑到此前 3 次申请失效和财务不透明，风险已抬高）
    notes: 情景由分析师构建；概率信号是定性评估，并非模型输出。估值区间假设 HKEX HKD/USD 和 CNY/USD 汇率接近当前水平（约 HKD 7.8/USD、CNY 7.1/USD）。
