  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素或约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 中国「十四五」数字基础设施要求
        - 驱动
        - 2021–2025（五年规划期）及之后
        - 智慧城市平台的政府采购需求持续；多年预算承诺
        - 确认合同在手订单中有多少绑定五年规划、多少来自自主支出；评估「十五五」状态
      - - 接入 DeepSeek 降低 LLM 推理成本
        - 驱动
        - 2025–2026（当前）
        - 场景化领域模型部署更快；Terminus 重构产品栈
        - 验证成本节省流向客户（价格压力）还是 Terminus 利润率
      - - 产业园和商业物业数字化需求
        - 驱动
        - 当前，并加速至 2026 年
        - 智慧园区需求拉动 Terminus 最大且增长最快的细分业务（FY2024 +162.9%）
        - 确认收入结构迁移能否持续；评估增长来自项目制还是经常性收入
      - - 「一带一路」/ UAE Vision 与 Saudi NEOM 智慧城市投资
        - 驱动
        - 中期（2025–2030）
        - 显著扩展国际 SAM；Terminus 以迪拜总部作为锚点布局
        - 量化 MENA 收入占比；评估主权买方客户集中风险
      - - 中国 ESG 与双碳监管要求
        - 驱动
        - 2024–2026 加速
        - 顺风利好 AI 智慧能源细分；大型楼宇必须做碳追踪
        - 确认强制碳报告监管时间表，以及它如何拉动 AIoT 采用
      - - 中国政府财政逆风与预算压力
        - 约束
        - 2024–2026（IDC 提及，仍在持续）
        - IDC 于 2025 年 1 月下调中国智慧城市 ICT 预测；AI 城市智能细分承压
        - 评估 Terminus 在手订单中政府买方与民营企业买方各占多少
      - - AIoT 标准碎片化与集成复杂度
        - 约束
        - 结构性（中期）
        - 销售周期更长、集成成本更高，中间件支出吃掉平台价值
        - 评估 TacOS 互操作认证和合作伙伴 SDK 采用指标
      - - 前期实施成本高、收入以项目制为主
        - 约束
        - 当前
        - 大量营运资本被占用；应收账款天数从 238 天改善到 104 天是正向信号
        - 要求披露分细分业务毛利率，以及在手订单转为确认收入的时间表
    notes: 时点评估基于 IDC、MarketsandMarkets 和公司披露。由于缺乏对中国市政预算的独立财政预测，政府相关约束和驱动因素尤其不确定。
