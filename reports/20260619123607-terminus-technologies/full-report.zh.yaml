  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - HKEX 申请失效或撤回
        - 第四次申请到期，或 Terminus 主动撤回且未宣布替代融资
        - 主要流动性路径消失；IPO 前投资人被套住；显示估值缺口难以弥合
        - 论点失效：退出，或按困境私有估值持有；不再追加投资
      - - 经营亏损恶化
        - FY2025 经营亏损 >RMB 300M，且收入 >RMB 2B；亏损同比扩大
        - 利润率扩张逻辑失效；现金消耗加快；Series E 稀释风险上升
        - 下调入场倍数重新评估；加入反稀释保护条款
      - - CAC 执法或监管罚款
        - CAC 向 Terminus 发出正式通知；或任何可比 AIoT 公司遭 PIPL 罚款 >RMB 50M
        - 合规成本骤升；政府客户信心被削弱；IPO 时间线进一步后移
        - 政府合约收入假设失效；下调至回避
      - - 美国实体清单或同等指定
        - Terminus 被列入美国 BIS 实体清单、Section 889 覆盖清单，或同等英国 / 澳大利亚限制清单
        - 国际政府市场永久关上；中国科技折价被放大
        - 国际扩张叙事失效；IPO 估值大幅打折
      - - 收入集中度超过阈值
        - IPO 招股书披露前三大客户收入占比 >50%，或工业数智化收入占比 >92%
        - 收入韧性和多元化叙事失效；客户集中风险超过可接受水平
        - 估值中加入收入质量折价；买入前要求先证明多元化
    notes: 所有阈值均为分析师推导的监测基准。传导路径是基于可比先例（SenseTime、Megvii、Hikvision）的定性判断。
    claimRefs:
