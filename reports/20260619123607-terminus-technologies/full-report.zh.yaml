      - number: '8.2'
        title: 估值背景与可比分析
        blocks:
          - type: paragraph
            body: >-
              Terminus 当前 CNY 20B+ 的私募估值，锚定在 2024 年 4 月 Series D 交割：公司从 AL Capital、Yangming、Everbright、SenseTime
              和政府平台投资人募得 CNY 2B，投后估值超过 CNY 20B。以 FY2024 收入 RMB 1.843B 计，对应 EV/Revenue 约 10.9x；估值偏高，但在 83%
              收入增速下仍可能说得通。Microware 投资人公告估算 pre-IPO 估值 HKD 35B+（约 USD 4.5B），约为 FY2024 收入 15x，这要求公司维持 50%+
              收入增长，并拿出可信的盈利路径证据。HKEX 上市可比公司展示了估值光谱：Horizon Robotics（SEHK: 9660）2024 年 10 月上市，市值隐含约 15-20x
              收入，目前已盈利；SenseTime（SEHK: 0020）2021 年以 HKD 3.85/share 上市，之后长期显著低于该水平，当前 EV/Revenue 约 3-5x；Megvii（2019 年估值约
              $4B）在美国 Entity List 压力下撤回两次 HKEX IPO 申请。从私募轮角度看，Terminus 的 CNY 20B Series D 后估值与中国 AI 独角兽可比倍数一致：Hurun
              China AI Unicorn 排名和 Crunchbase / CBInsights 数据显示，中国 AIoT / 智慧城市独角兽在增长阶段私募市场通常按 8-15x ARR 交易。GetLatka 估算
              Terminus 估值 $3B、2024 ARR $258M，也与 CNY 20B 口径一致。IPO 定价的关键问题是，HKEX 会按 Horizon Robotics 倍数（高增长、盈利）给 Terminus
              定价，还是按 SenseTime 倍数（高增长、亏损）给。鉴于目前缺少盈利数据，SenseTime 或更差情景更可能是公开市场结果。
