      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              领导层在 Terminus 故事中格外关键，因为公司仍强烈绑定创始人，公开记录也把 Victor Ai 创业前的投资背景作为投资逻辑的核心部分。Ai 生于 1983 年，公开资料一贯称其为创始人兼
              CEO。他的公开履历串起 Simon Fraser University 经济学学位、Washington University in St. Louis 金融硕士、JPMorgan 并购岗位，以及后来领导
              Everbright New Economy Fund；据称他在那里完成了 100 多笔私募股权交易，平台管理规模超过 USD
              10B。这份履历支撑了其在资本形成、政府关系和企业拓展上的创始人—市场匹配，但也提高了关键人物依赖，因为外部叙事反复把战略可信度导向 Ai 本人。围绕他的治理似乎比典型创始人主导的民营公司更机构化：董事会据报有
              11 名成员，包括 2 名执行董事、5 名非执行董事和 4 名独立非执行董事；与投资方相关的代表关联 Everbright、IDG、JD Tech 和 CITIC 相关利益方等主要支持者。关键高管覆盖也延伸到
              Ai 之外，包括董事长 Jin Zheng、CTO Hua Xiansheng、首席科学家兼国际总裁 Shao Ling、执行总裁 Wang Lei，以及面向国际传播中的副 CFO Zhong Lingyun 和
              CFO Kevin Shi。即便如此，与 Victor Ai 实体相关的 26.61% 管理层投票权意味着战略控制仍明显集中。
