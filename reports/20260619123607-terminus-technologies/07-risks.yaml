callouts:
- calloutType: risk
  title: Triple HKEX filing lapse signals material IPO execution risk
  body: Terminus Technologies has submitted three HKEX listing applications, with the first two (September 2024, April 2025)
    lapsing without conversion to an approved listing. Each HKEX filing expiry represents a six-month regulatory window in
    which the company failed to complete the listing process. The pattern suggests persistent underwriting challenges, investor
    skepticism about profitability path or valuation, or unfavorable market timing for Chinese AI/tech IPOs. A fourth lapse
    would constitute a thesis-break trigger requiring investors to reconsider the liquidity timeline and alternative capital
    pathways.
  claimRefs:
  - CR011
  - CR034
  - CR040
  - CR041
- calloutType: risk
  title: China NDSMR and CSL amendment create layered regulatory exposure for city-scale IoT data
  body: The combination of China's NDSMR (effective January 2025) and the CSL amendment (effective January 2026) creates a
    regulatory pincer for Terminus's IoT data operations. As a processor of Important Data across urban infrastructure, Terminus
    faces mandatory risk assessments, cross-border transfer restrictions, and incident reporting requirements. PIPL fines
    up to 5% of annual revenue (~RMB 92M based on FY2024 revenue) and the CAC's growing enforcement appetite against data-heavy
    technology platforms represent material financial downside. Compliance gaps—no confirmed DPO appointment, MLPS certification,
    or third-party data audit—amplify residual exposure.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR009
  - CR023
  - CR035
- calloutType: insight
  title: Geopolitical risk creates an asymmetric ceiling on international revenue
  body: US NDAA restrictions, the DOJ bulk data transfer rule, and Digital Silk Road geopolitical scrutiny collectively cap
    Terminus's addressable international government market at markets with limited Western alignment. The UAE and Singapore
    deployments avoid direct US-nexus for now, but any expansion to Australia (Five Eyes), UK, or EU markets would trigger
    regulatory review of Chinese technology in public infrastructure. This geopolitical ceiling is structural, not cyclical,
    and limits the international diversification narrative that partially justifies the HKD 35B+ pre-IPO valuation estimate.
  claimRefs:
  - CR005
  - CR006
  - CR021
  - CR025
  - CR033
