- id: geopolitical-export-control
  title: Geopolitical and Export Control Risk
  body: Terminus operates in a geopolitical environment increasingly hostile to Chinese technology companies in Western and
    allied markets. The US Department of Justice finalized the Bulk Sensitive Data Transfer Rule in December 2024 (effective
    April 2025), prohibiting certain transactions that give China-linked entities access to Americans' health, financial,
    geolocation, and personally identifying data. While Terminus has no confirmed US revenue, any future enterprise deployments
    in the United States or involving US-person data streams would be directly constrained. US NDAA Section 889 and NDAA 1260H
    list restrictions prohibit federal contractors from procuring Chinese-origin technology from covered entities; a future
    Section 889(b)(1)(D) or 1260H designation would effectively exclude Terminus from US federal procurement and potentially
    Five Eyes government contracts. The US GAO (July 2024) found existing regulations inadequate to address consultant contracting
    risks with Chinese entities, signaling future rule-tightening. The CSIS Digital Silk Road analysis documents how Chinese
    AIoT exports in Belt & Road markets face dual-use surveillance scrutiny; several Western governments have banned Chinese
    smart city and surveillance technology products from public infrastructure. This creates material market access risk for
    Terminus's international government contract pipeline in Australia, Singapore, and potential European expansion. Terminus's
    SenseTime investor relationship compounds the risk, as SenseTime is itself subject to US export restrictions and Entity
    List placement.
  claimRefs:
