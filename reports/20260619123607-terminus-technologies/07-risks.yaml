- id: kill-criteria-mitigations
  title: Thesis-Break Triggers and Kill Criteria
  body: Every high-severity risk in the Terminus profile carries a monitorable trigger that would constitute a thesis-break
    event, necessitating either exit or material re-underwriting of the investment thesis. For regulatory risk, the primary
    trigger is a formal CAC enforcement action or PIPL fine exceeding RMB 100M against Terminus or directly comparable Chinese
    IoT companies; this would signal elevated enforcement posture affecting operating costs and reputational standing with
    government customers. For geopolitical and export control risk, placement of Terminus on the US Bureau of Industry and
    Security Entity List, Section 889(b)(1)(D) covered-company list, or analogous allied-government restriction lists would
    materially impair international government sales and IPO valuation. For IPO execution risk, a fourth HKEX filing lapse
    or withdrawal without alternative capital raise by end of calendar year 2026 would signal inability to access public capital
    markets and would require re-evaluation of the liquidity timeline. For financial risk, worsening operating losses in FY2025
    (above RMB 300M) while revenue growth decelerates below 40% YoY would signal deteriorating unit economics and challenge
    the profitability path. For customer and revenue concentration, discovery that the top three customers account for more
    than 50% of annual revenue would confirm concentration risk exceeding acceptable thresholds. Mitigating factors include
    the RMB 2.3B order backlog providing near-term revenue visibility, the Series D capital providing operational runway,
    and DeepSeek integration reducing inference costs. Investors should establish monitoring triggers on HKEX filing status,
    CAC enforcement activity, international government contract pipeline, and profitability disclosures before deepening exposure.
