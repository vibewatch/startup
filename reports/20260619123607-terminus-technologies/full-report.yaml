      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more — pending profitability disclosure and IPO pricing'
            body: >-
              Terminus Technologies earns a research-more recommendation based on the current evidence set. The
              fundamental business quality is demonstrable—83% YoY revenue growth, RMB 2.3B backlog, leading market
              position, and DeepSeek-enabled cost structure improvements. However, the investment decision cannot be
              underwritten responsibly without: (1) FY2025 audited financials confirming profitability trajectory, (2)
              IPO pricing at or below 9x forward revenue, (3) Customer concentration data below 40% top-3 threshold, and
              (4) Active HKEX listing application. Entry at CNY 20B+ private valuation (10-15x revenue, no profitability
              disclosure) is not recommended given the stretched multiple and execution risk.
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 'SenseTime precedent: China tech discount is structural, not cyclical'
            body: >-
              SenseTime (SEHK: 0020) listed on HKEX in December 2021 at HKD 3.85/share with a market cap in excess of
              USD 17B, and subsequently declined sharply due to US Entity List designation, profitability challenges,
              and the China tech sector re-rating. The stock has traded significantly below its IPO price for most of
              its listed history, representing one of the worst-performing major Chinese AI company IPOs. Terminus faces
              a structurally similar risk: HKEX investors' experience with unprofitable Chinese AI companies has reset
              multiple expectations downward, and any hint of regulatory headwinds (Entity List, NDSMR enforcement)
              risks a SenseTime-style post-IPO collapse.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV021
          - type: callout
            title: 'Key assumption: CNY/HKD exchange rates remain stable for IPO valuation comparison'
            body: >-
              All bull/base/bear valuation scenarios assume CNY/HKD exchange rates near current levels (approx CNY 1 =
              HKD 1.10). Material CNY depreciation against HKD/USD would compress the HKD-denominated IPO valuation
              relative to CNY-denominated private marks, representing an additional downside risk not captured in the
              scenarios. Currency hedging options for pre-IPO investors are limited.
            calloutType: assumption
            claimRefs:
              - CV018
              - CV019
              - CV022
