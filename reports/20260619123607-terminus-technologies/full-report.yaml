  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Segmentation
        blocks:
          - type: paragraph
            body: >
              Terminus monetizes a full-stack AIoT delivery model rather than a pure software subscription motion.
              Public company materials and post-filing coverage consistently describe a combination of software,
              hardware, and deployment or integration revenue tied to enterprise and government projects. That matters
              because the top line is large and growing quickly, but its quality is shaped by delivery timing, contract
              structure, and the mix between productized software and lower-margin project work. Revenue reached RMB
              738M in FY2022, RMB 1.006B in FY2023, and RMB 1.843B in FY2024, with H1 2025 revenue at RMB 632M. The most
              important segment shift is AI Industrial Digitalization, which reached RMB 1.64B in FY2024 and represented
              roughly 89% of total revenue, while AI Smart Energy also increased its mix share. Backlog of about RMB
              2.3B at December 2024 gives some visibility into contracted demand, but because recognition is tied to
              project delivery and milestones, investors should view the backlog as support for future revenue rather
              than recurring ARR in the software sense.
