      - number: '1.3'
        title: Funding History and Capital
        blocks:
          - type: paragraph
            body: >
              Terminus has assembled one of the more substantial private funding histories among China AIoT companies,
              and the round sequence is important because it shows both investor quality and the company’s capital
              intensity. The financing trail begins with a roughly USD 73.7M Series A in July 2017, followed by a USD
              173M Series B in October 2018 that established unicorn status at about a USD 1B post-money valuation. A
              larger USD 283M Series C followed in August 2019, then a USD 93M interim Series D round in September 2021
              backed by Warburg Pincus, Sequoia Capital, and Alibaba Cloud. The most important recent step was the
              approximately CNY 2B Series D-2 announced in 2024, co-led by AL Capital and Yangming Equity, with a broad
              syndicate that included state-linked and strategic investors. Across databases and media reports, total
              capital raised is commonly cited around USD 899M, while Chinese-language summaries describe roughly CNY 7B
              raised on a broader basis. The shareholder map suggests Everbright remains especially influential,
              including a reported 12.11% stake via Hunan Guangkong. Valuation markers rose from the 2018 unicorn
              threshold to more than CNY 20B after D-2, and partner-side disclosure around Microware’s August 2024
              strategic investment implied a pre-IPO value above HKD 35B. That trajectory supports the company’s market
              relevance but also implies investors are underwriting an eventual public-market validation that has not
              yet been completed.
