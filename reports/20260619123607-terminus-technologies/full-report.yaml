      - number: '2.4'
        title: Sizing gaps and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Several material evidence gaps limit precision in this market sizing. First, no independent third party
              has published a verified SAM or SOM estimate specific to the public-domain AIoT operating system market in
              China; Frost & Sullivan's estimate is commissioned by and appears exclusively in Terminus's prospectus,
              creating potential for optimistic boundary-drawing. Second, the MarketsandMarkets and Allied Market
              Research global figures include hardware, connectivity, and platform segments that significantly inflate
              the headline number relative to Terminus's software/platform revenue pool. Third, IDC's downward revision
              in January 2025 is an adverse signal: the 7.1% CAGR it now uses for 2023-2028 is materially below the 17%
              CAGR in the Frost & Sullivan estimate and the 26.1% CAGR MarketsandMarkets shows for global AIoT, raising
              the question of whether China-specific government budget pressures will suppress the growth rate for
              Terminus's core domestic market faster than international expansion can compensate. Fourth, Terminus's
              stated customer count (342 in 2024 vs. 800+ in the updated prospectus for mid-2024) has shown
              inconsistencies across filings, creating diligence exposure. Fifth, the Market Research Future estimate
              (USD 142.2M in 2024 for China smart city) is three orders of magnitude smaller than the IDC estimate (RMB
              939.71B ~= USD 130B), suggesting entirely different market definitions are in use; a diligence team should
              map each analyst's boundary criteria before relying on any single figure. The contradictory market size
              estimates are preserved in Table TM002 and should not be reconciled without a specific boundary-mapping
              exercise with each report author.
            claimRefs:
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frost & Sullivan TAM is the operative lens but carries sponsorship risk
            body: >-
              Terminus's prospectus relies on a Frost & Sullivan market study commissioned for the IPO. The RMB 1.65T
              public-domain AIoT TAM is the most relevant boundary definition for Terminus's platform business, but
              because it was paid for by the company, diligence teams should cross-check boundary assumptions against
              IDC and MarketsandMarkets definitions independently before accepting the TAM at face value.
            calloutType: insight
            claimRefs:
              - CM002
              - CM032
          - type: callout
            title: IDC downgraded China smart city forecast — government segment headwind
            body: >-
              IDC revised its China Smart City ICT market forecast downward in January 2025, attributing the change to
              tightening government fiscal budgets and slower project approvals. This creates a specific risk for
              Terminus's AI city intelligence segment, which depends on government procurement. The industrial
              digitalization segment's private enterprise buyer base is more insulated from this constraint.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM028
          - type: callout
            title: DeepSeek cost inflection accelerates AIoT platform deployment economics
            body: >-
              DeepSeek's 2025 infrastructure shift meaningfully reduced the cost of deploying domain-specific LLMs for
              AIoT applications. Terminus has already restructured its product roadmap around this, launching a
              three-tier stack of domain models, infrastructure, and intelligent agents. Lower inference costs improve
              both the economics for Terminus and the ROI case for customers, which should compress time-to-commitment
              in the adoption funnel.
            calloutType: strength
            claimRefs:
              - CM022
              - CM023
              - CM024
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — direct peers, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Terminus's competitive landscape is usefully divided into four competitor classes. First are the
              hardware-led video surveillance incumbents: Hikvision and Dahua. Hikvision, founded in 2001 and listed on
              Shenzhen Stock Exchange, is the world's largest video surveillance equipment manufacturer with
              approximately 42,685 employees as of 2021 and revenues in the mid-USD billions range, making it the most
              direct incumbent threat in smart city sensing and camera-based urban intelligence. Dahua Technology is the
              second-largest surveillance maker. Both are expanding into software analytics and AIoT dashboards,
              directly challenging Terminus's city intelligence segment. Second are China AI platform companies:
              SenseTime (SEHK: 0020), Megvii (Face++), and iFLYTEK. SenseTime is an investor in Terminus (via the Series
              D), creating a dual investor-competitor dynamic; it develops computer vision, smart city, and generative
              AI software with LTM revenue of ~USD 832M and EV ~USD 7B. Megvii focuses on image recognition and IoT,
              valued at USD 4B in 2019, sanctioned by the US government since 2019, and like SenseTime is expanding
              smart city capabilities. iFLYTEK is both an early investor in Terminus (pre-Series D) and a competitor in
              voice-AI and smart city solutions.

              Third are big-tech smart city divisions that compete via ecosystem breadth: Huawei Smart City (IdeaHub,
              Kunlun platform), Alibaba City Brain (ET City Brain in Hangzhou, traffic management), Tencent Smart City,
              and Baidu AI Cloud. These players can bundle AIoT with hyperscaler cloud, 5G network management, and
              government relationships at a scale Terminus cannot match. Fourth are the status-quo and substitute
              alternatives: traditional BMS (building management system) vendors (Siemens, Honeywell, Schneider
              Electric), custom system integrators, and the internal-build option where large SOEs develop proprietary
              IoT platforms. Market Research Future identifies Siemens, Cisco, IBM, Schneider Electric, Honeywell,
              Oracle, Hitachi, and NEC among the major players in the China smart city market, indicating deep incumbent
              penetration by international vendors in the broader ICT layer. None of these directly compete with TacOS
              as a public-domain AIoT OS, but they dominate hardware infrastructure budgets that Terminus does not
              capture.
