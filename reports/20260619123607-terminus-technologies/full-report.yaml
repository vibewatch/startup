      - number: '4.2'
        title: Pricing and Monetization
        blocks:
          - type: paragraph
            body: >
              Pricing transparency is limited because Terminus appears to sell negotiated enterprise solutions, not
              standardized public SaaS packages. The company markets full-stack city, industrial, and energy solutions,
              while independent reporting describes multi-year contracts that bundle hardware, software licensing, and
              implementation services. This makes economic interpretation more difficult than in a seat-based
              subscription business because list prices, volume rebates, deployment discounts, and change-order
              economics are not disclosed. The absence of public list pricing does not imply weak monetization; instead
              it suggests that realized pricing is contract-specific and likely depends on scope, hardware content, and
              delivery complexity. That contract-led structure also helps explain why average revenue per client appears
              high and why government and large-enterprise procurement channels matter more than self-serve or SMB
              acquisition. From an underwriting perspective, the key gap is not whether Terminus charges for its
              products, but how much of contract value is software-like, how much is hardware pass-through, and how much
              is services-heavy revenue that could dilute margin quality.
