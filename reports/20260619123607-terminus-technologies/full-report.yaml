      - number: '3.2'
        title: Capability comparison, pricing, and GTM
        blocks:
          - type: paragraph
            body: >-
              Terminus differentiates on the integration of public-domain AIoT OS (TacOS) with domain-specific large
              models, edge-plus-cloud compute, and a proprietary hardware robot/terminal layer. Hikvision and Dahua lead
              on video surveillance hardware breadth, global distribution, and price competitiveness, but lag on
              software platform depth and LLM integration. SenseTime leads on AI software (computer vision, generative
              AI) and has the strongest research pedigree, but its smart city revenues are a fraction of Terminus's
              AIoT-specific deployments, and it faces US sanctions limiting some international markets. iFLYTEK leads in
              voice AI and speech recognition but is narrower in spatial/physical building intelligence. Megvii's smart
              logistics and AIoT IoT products compete at a narrower stack.

              Pricing evidence is limited for all competitors. Terminus offers full-stack project-based pricing
              combining hardware, software licenses, and services. Hikvision and Dahua tend to lead on hardware unit
              pricing but compete on maintenance contracts. SenseTime uses enterprise software licensing with per-seat
              or API-call models. Switching costs are asymmetric: once TacOS edge devices are physically installed and
              domain models trained on building-specific data, migration to a Hikvision or SenseTime platform requires
              hardware replacement plus significant re-integration effort. In contrast, switching from SenseTime to
              Terminus (or vice versa) at the software analytics layer is lower cost but still requires API and data
              re-mapping.

              Terminus's GTM relies heavily on a partner channel (1,300+ organizations) and project-based direct sales
              to industrial parks, government bodies, and developers. This is less scalable than SaaS-model competitors
              but creates stickier relationships. Hikvision's distribution power through its global channel of resellers
              and system integrators is its key GTM moat — a channel Terminus does not replicate at scale domestically
              or internationally. MarketsandMarkets identifies AWS, IBM, Google, Microsoft, and Bosch.IO as global AIoT
              leaders on capability matrices, highlighting the competition Terminus faces internationally compared to
              western hyperscalers.
            claimRefs:
