      - number: '4.3'
        title: Unit Economics and Margins
        blocks:
          - type: paragraph
            body: >
              Public evidence is strongest on losses and working-capital improvement, and weakest on true unit
              economics. Terminus reported GAAP net losses of RMB 2.387B in FY2022, RMB 803M in FY2023, RMB 2.1B in
              FY2024, and RMB 574M in H1 2025, while adjusted net losses were RMB 983M, RMB 600M, RMB 973M, and RMB 500M
              respectively. That means loss intensity improved materially versus FY2022 but remained very high in
              FY2024, at roughly 53% of revenue on an adjusted basis. At the same time, average accounts receivable
              turnover improved from 238 days to 180 days to 104 days across FY2022-FY2024, which is a meaningful sign
              that collection discipline and cash conversion are moving in the right direction. The problem is that
              gross margin, EBITDA, and cost-of-revenue decomposition are still not public, so there is no clean way to
              separate software contribution from hardware bill-of-materials, deployment labor, or platform R&D. Given
              the company’s investments in TacOS, large-model development, edge infrastructure, and device deployment,
              the margin path is plausible but still unproven.
