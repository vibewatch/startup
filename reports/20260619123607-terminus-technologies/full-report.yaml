      - number: '4.5'
        title: Financial Verdict and Gaps
        blocks:
          - type: paragraph
            body: >
              The public record supports a mixed but coherent financial verdict. On the positive side, Terminus has
              reached meaningful revenue scale, accelerated growth sharply in FY2024, improved receivables collection,
              expanded active clients, and accumulated backlog that suggests continued demand from large enterprise and
              government programs. On the negative side, revenue quality is only moderate because recognition appears
              project-based, revenue mix is not broken out cleanly between software and hardware, and the company still
              carries large adjusted losses despite fast growth. Capital intensity also looks high because hardware,
              deployment, infrastructure build-out, and model training all consume cash before revenue is fully
              realized. The biggest blockers are specific: no disclosed gross margin by segment, no cash balance or
              runway, no debt schedule, no customer concentration table, and no evidence-backed path to sustained
              profitability. Valuation signals in the USD 2.75B-4.5B range imply investors are still underwriting
              strategic upside, but public evidence alone is insufficient to underwrite margin durability or near-term
