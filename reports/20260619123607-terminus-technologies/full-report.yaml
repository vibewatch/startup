      - number: '2.2'
        title: Buyer map, user segmentation, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Terminus operates four AIoT revenue segments with distinct buyer profiles. The largest and fastest-growing
              is AI industry digitalization, which grew 162.9% in FY2024 (to RMB 1.64B) and serves industrial parks,
              commercial platform operators, and smart retail operators; the budget owner is typically a property
              management company or industrial park operator, with procurement driven by operational efficiency ROI and
              smart lease premiums. The second segment, AI city intelligence, serves municipal governments and city
              bureaus seeking smart traffic, public safety, and urban management solutions; budget authority rests with
              city CIOs and digital economy bureaus. The third, AI smart living, serves property developers, residential
              community managers, and real estate trusts building smart communities; the buyer is the developer or asset
              manager using AIoT to differentiate properties. The fourth, AI smart energy, serves energy operators,
              manufacturers, and commercial buildings pursuing ESG compliance and carbon reduction; the budget is split
              between facilities management and sustainability teams. Terminus's customer count grew from 224 (2022) to
              330 (2023) and 342 (2024), indicating slower net client adds as the company consolidates spend depth
              rather than breadth. The KrASIA analysis notes accounts receivable days improved from 238 in 2022 to 104
              in 2024, signalling faster project delivery and payment cycles. The adoption path for a typical enterprise
              customer begins with a pilot deployment of TacOS sensors and edge compute in one building or zone,
              followed by integration with the customer's existing ERP or BMS systems, then horizontal expansion across
              a property or campus via cross-selling of additional modules. Government buyers follow a different path:
              formal procurement tender, pilot city or district, then multi-year framework agreement. Belt and Road
              Initiative buyers in the UAE and MENA region entered via Expo City Dubai and are now being served through
              Terminus International Headquarters in Dubai. International customers represented a smaller but
              strategically important share of the 800+ client base across 160 cities as of mid-2024.
            claimRefs:
