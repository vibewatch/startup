      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Leadership is unusually central to the Terminus story because the company is still strongly
              founder-identified and because the available public record emphasizes Victor Ai’s pre-company investing
              background as a core part of the investment case. Ai, born in 1983, is consistently described as the
              founder and CEO. His published biography ties together an economics degree from Simon Fraser University, a
              Master of Finance from Washington University in St. Louis, an M&A role at JPMorgan, and later leadership
              of Everbright’s New Economy Fund, where he reportedly executed more than 100 private equity transactions
              across a platform managing over USD 10B. That resume supports founder-market fit in capital formation,
              government relationships, and enterprise development, but it also increases key-person dependency because
              external narratives repeatedly route strategic credibility through Ai himself. Governance around him
              appears more institutionalized than a typical founder-led private company: the board is reported at 11
              members, with 2 executive directors, 5 non-executive directors, and 4 independent non-executive directors,
              and investor-linked representatives are tied to major backers such as Everbright, IDG, JD Tech, and
              CITIC-linked interests. Key executive coverage extends beyond Ai to chairman Jin Zheng, CTO Hua Xiansheng,
              chief scientist and international president Shao Ling, executive president Wang Lei, and finance
              executives including deputy CFO Zhong Lingyun and CFO Kevin Shi in international-facing communications.
              Even so, the reported 26.61% management voting position associated with Victor Ai entities means strategic
              control still appears materially concentrated.
