  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Data Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Terminus's TacOS platform collects and processes city-scale data across buildings, industrial parks, urban
              infrastructure, and residential communities in China and internationally. This data posture creates
              compounding obligations under China's layered data governance regime. The Network Data Security Management
              Regulations (NDSMR), effective January 1, 2025, extend compliance requirements beyond personal information
              to all network-generated data, imposing data classification, risk assessment, cross-border transfer
              restrictions, and incident reporting obligations on Terminus as a large-scale IoT data processor. The PIPL
              levies fines up to 5% of annual revenue for serious breaches—equivalent to RMB 92M based on FY2024
              revenue—while the CSL amendment (effective January 1, 2026) materially increases penalties for critical
              information infrastructure operators. The Cyberspace Administration of China (CAC) has intensified
              enforcement against data-heavy technology companies throughout 2025. Under the NDSMR, Terminus's
              international deployments in UAE, Singapore, and Australia trigger extraterritorial PIPL application
              wherever Chinese citizens' data is processed, and cross-border transfer from free-trade zones is now
              subject to a negative list. Separately, the WilmerHale analysis identifies that the FTZ data export
              negative list issued concurrently with NDSMR finalization directly restricts certain data flows from
              Terminus's FTZ-registered entities. Compliance infrastructure for these obligations has not been publicly
              disclosed; board-level DPO appointment and MLPS certification levels remain unconfirmed in public filings.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
