chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Overview
        blocks:
          - type: paragraph
            body: >
              Terminus Technologies operates under several closely related labels that matter for diligence because
              public materials, media coverage, and IPO reporting do not always use the same name. The operating brand
              is Terminus Group, the Chinese name is 特斯联 (Tesilian), and reporting around the Hong Kong listing process
              indicates the legal entity shifted to Terminus Smart Technology Co., Ltd. from the earlier Chongqing
              Terminus Smart Technology Inc., Co., Ltd. The company traces its founding to 2015 in Chongqing, China, and
              now presents itself as an AIoT infrastructure company centered on TacOS, its proprietary operating system.
              TacOS is described as a five-layer AIoT architecture that connects devices, data, models, and industry
              workflows rather than a single application product. Current operating emphasis spans four segments: AI
              Industrial Digitalization, AI City Intelligence, AI Smart Living, and AI Smart Energy. Headquarters
              activity now appears split between Beijing as current China headquarters and Dubai as the international
              base opened in March 2024, which supports the company’s effort to frame itself as a China-rooted but
              globally deployable urban AI platform. From a stage perspective, Terminus remains a late-stage private
              company: Series D, pre-IPO, and still pursuing a Hong Kong listing. That combination of multi-segment
              product breadth, documented international expansion, and a live listing ambition makes chapter-one
              identity evidence especially reusable for later market, customer, and financial analysis.
