  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - HKEX filing lapse or withdrawal
        - Fourth application expires or Terminus withdraws voluntarily without alternative capital announcement
        - Eliminates primary liquidity pathway; strands pre-IPO investors; signals unresolvable valuation gap
        - 'Thesis-break: exit or hold at distressed private valuation; no incremental investment'
      - - Operating loss deterioration
        - FY2025 operating loss >RMB 300M on revenue >RMB 2B; year-over-year loss widening
        - Margin expansion thesis fails; cash burn accelerates; Series E dilution risk increases
        - Re-evaluate entry multiple downward; impose dilution protection terms
      - - CAC enforcement action or regulatory fine
        - Formal CAC notice to Terminus; or PIPL fine >RMB 50M on any comparable AIoT company
        - Compliance cost spikes; government customer confidence erodes; IPO timeline further delays
        - Thesis-break for government-contract revenue assumption; downgrade to avoid
      - - US Entity List or equivalent designation
        - Terminus placed on US BIS Entity List, Section 889 covered list, or equivalent UK/AU restriction list
        - Permanently excludes international government markets; compounds China tech discount
        - Thesis-break for international expansion narrative; material IPO valuation discount
      - - Revenue concentration above threshold
        - IPO prospectus discloses top-3 customers >50% of revenue or industrial digitalization >92% of revenue
        - Revenue durability and diversification narrative fails; customer concentration risk exceeds tolerable level
        - Impose revenue quality discount to valuation; require proven diversification before buy
    notes: >-
      All thresholds are analyst-derived monitoring benchmarks. Transmission pathways are qualitative assessments based
      on comparable precedents (SenseTime, Megvii, Hikvision).
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Financial performance
        - FY2024 and FY2025 audited P&L, EBITDA, operating cash flow, and cash burn rate
        - Cannot assess profitability trajectory or runway; prevents proper IPO valuation
        - Management; demand from IPO bookrunners as part of pre-IPO due diligence
      - - Customer concentration
        - Top-10 customer share of revenue; NRR; gross and net churn; contract renewal rates
        - 89% industrial digitalization concentration requires customer-level evidence of durability
        - Management disclosure; cross-check via government tender records and press releases
      - - Regulatory compliance
        - >-
          MLPS certification level; CAC compliance audit; DPO appointment confirmation; cross-border data transfer
          pathways
        - Material regulatory risk that cannot be sized without compliance posture data
        - Management; regulatory counsel; independent compliance audit
      - - IPO pricing and terms
        - HKEX offer price range; cornerstone investor commitments; lock-up periods; free-float target
        - Entry discipline and return analysis requires confirmed IPO pricing
        - HKEX listing application; prospectus when approved; bookrunner guidance
      - - Use of proceeds
        - Breakdown of remaining Series D capital and planned IPO proceeds deployment
        - Cash allocation affects burn rate calculation and runway assessment
        - Management; prospectus use-of-proceeds section
      - - Competitive win/loss data
        - Tender pipeline win/loss rate; competitive displacement evidence; Terminus displacement by Huawei/Alibaba
        - Platform defensibility cannot be confirmed without evidence of competitive outcomes
        - Management; channel checks; government procurement database searches
    notes: >-
      Priority order reflects impact on investment decision quality. Items 1-3 are blocking diligence asks for any buy
      recommendation.
