      - number: '8.4'
        title: Exit Readiness, Recommendation, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              Terminus is not yet exit-ready for a public market investor at the current implied valuation. The three
              key readiness gaps are: (1) Profitability disclosure—no operating P&L, EBITDA, or cash burn has been
              publicly disclosed; this is table-stakes for institutional IPO investors. (2) Revenue quality—the 89%
              concentration in industrial digitalization needs to be contextualized against customer concentration data,
              contract renewal rates, and net revenue retention, none of which are publicly available. (3) IPO execution
              uncertainty—three filing lapses mean the Terminus listing is materially less certain than a first-time
              filing. Our recommendation is research-more. This reflects: (a) Genuine fundamental quality—rapid revenue
              growth, order backlog, DeepSeek-enabled cost structure improvements, and strong Frost & Sullivan market
              positioning; (b) Critical missing data—profitability, unit economics, customer concentration, and IPO
              terms; (c) Valuation uncertainty—the spread between bull case (HKD 35B+) and bear case (HKD 8-12B) is too
              wide to form a confident entry discipline without IPO prospectus data. If profitability data becomes
              available showing a credible path to breakeven by FY2026 and revenue concentration is acceptable (<40%
              top-3 customers), the recommendation would upgrade to track with an entry multiple target of 7-9x forward
              revenue. A buy recommendation would require: HKEX approval, IPO pricing at or below HKD 20B, FY2025
              revenue growth above 50%, and confirmed profitability runway of 18+ months. Risk rating: HIGH—driven by
              financial opacity, IPO execution risk, China tech sector discount, regulatory risk from NDSMR/CSL, and
              geopolitical headwinds.
            claimRefs:
              - CV023
