      - number: '7.3'
        title: Operational, Technical, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Terminus's operational risk profile centers on platform reliability in critical infrastructure, technology
              supply chain, data security incidents, and competitive intensity from well-resourced incumbents. TacOS
              deployments in smart city infrastructure create high-impact reliability obligations: any platform outage
              affecting traffic management, building HVAC, or public safety systems could trigger regulatory action and
              contract penalties. No public SLA commitments, uptime guarantees, or third-party security certifications
              (ISO 27001, SOC 2) have been disclosed. Hikvision, with approximately $15B in revenue and dominant market
              share in video surveillance and smart building management, competes directly with Terminus in intelligent
              infrastructure management and government smart-city contracts. Huawei Cloud and Alibaba Cloud both offer
              competing smart-city AIoT stacks with deep government relationships. Terminus's claim to be the 5th
              largest public-domain AIoT solution provider in China by 2024 revenue implies four larger competitors.
              Hardware supply chain concentration for edge computing devices and IoT sensors is undisclosed;
              geopolitical disruptions to chip supply chains (semiconductors, specialized sensors) could affect device
              production timelines. The integration of AI large language models (LLMs) into TacOS via DeepSeek and
              proprietary models creates model failure risk in safety-relevant applications; no AI safety testing
              framework has been publicly disclosed. Terminus's competitive moat—TacOS interoperability and the
              five-layer architecture—has not been independently verified and may be replicable by better-resourced
              competitors.
