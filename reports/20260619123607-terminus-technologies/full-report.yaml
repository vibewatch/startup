      - number: '3.4'
        title: Adverse evidence and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The most significant adverse competitive signal for Terminus is that its two most comparable HKEX-listed
              peers (SenseTime and Horizon Robotics, the latter focused on automotive AI chips) are both loss-making:
              SenseTime's LTM EBITDA was negative USD 110M on USD 832M revenue (EBITDA margin -13%), and Horizon
              Robotics reported CNY 2.38B revenue in FY2024 with CNY 2.35B net income (a one-time positive driven by
              accounting), but the pre-listing HKEX structure may not translate to similar profitability for Terminus.
              The precedent of multiple similar-vintage Chinese AI companies filing for HKEX listing and facing
              sustained post-listing losses is an adverse signal for Terminus's valuation durability even if it
              successfully lists.

              SenseTime's US sanctions (placed on the Entity List in October 2019 for alleged human rights abuses in
              Xinjiang) highlight a dual risk: while sanctions have not directly affected Terminus, they demonstrate the
              geopolitical exposure of Chinese AI/surveillance companies in international markets. Terminus's MENA
              expansion could face similar Western government scrutiny as its city intelligence product deploys in UAE
              and Saudi Arabia contexts. Megvii faces a similar US Treasury investment ban since December 2021 and US
              DoD list designation in January 2024, suggesting the US-China technology decoupling risk is not
              theoretical for Chinese AIoT companies expanding internationally.

              The commoditization risk is real in the industrial park segment: Terminus's fastest-growing vertical is
              attracting local and national SOE system integrators who are building proprietary smart park solutions,
              reducing the premium Terminus can charge vs. bundled alternatives from Huawei or Alibaba Cloud. The
              pattern of Terminus revenue declining in 2022 (COVID disruption) and recovering only through project-
              cycle timing suggests revenue can be volatile in a project-based model even without structural competitive
              displacement.
            claimRefs:
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
