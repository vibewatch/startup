      - number: '7.4'
        title: Financial, Execution, and Capital Risk
        blocks:
          - type: paragraph
            body: >-
              Terminus's financial risk profile is dominated by three interdependent exposures: IPO execution risk, cash
              burn and capital dependency, and revenue concentration. The company has filed for HKEX listing three times
              (September 2024, April 2025, November 2025), with the first two filings lapsing without conversion to an
              approved listing. Persistent listing delays signal either investor skepticism about valuation,
              underwriting complexity from profitability gaps, or market timing constraints driven by China tech
              discount multiples. FY2024 revenue of RMB 1.843B (+83.2% YoY) was highly concentrated in industrial
              digitalization (approximately 89% of revenue per KrASIA analysis), meaning a slowdown in a single segment
              or a policy shift in industrial park digitalization contracts could sharply reduce revenue growth. Neither
              operating profit nor EBITDA has been publicly disclosed for FY2024; the company's cash burn rate and
              runway are unknown to public investors. The post-Series D valuation of CNY 20B+ implies a revenue multiple
              of approximately 10.9x FY2024 revenue, materially elevated versus SenseTime's current trading multiple of
              approximately 3-5x revenue. Government-platform investors (Digital Chongqing, Nanchang government
              platform, Xuzhou industrial fund) constitute a significant portion of the Series D capital, creating
              political funding dependency and potential exit constraints if government priorities shift. Victor Ai's
              centrality as CEO, fundraiser, and public face of Terminus represents a key-person concentration risk; no
              confirmed succession planning documentation is public. CITIC Securities and Haitong International serve as
              joint sponsors; loss of either would restart sponsor selection and delay the listing timeline.
