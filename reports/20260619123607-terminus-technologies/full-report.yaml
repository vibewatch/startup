      - number: '4.4'
        title: Capital Adequacy and Financing
        blocks:
          - type: paragraph
            body: >
              As detailed in the Company Overview chapter, Terminus has raised substantial private capital; the
              financial question here is whether that capital base is enough to support continued scale-up before an IPO
              or other liquidity event. Third-party datasets and press coverage place cumulative funding around $899M,
              with Chinese-language sources citing about CNY 7B in aggregate and post-Series D-2 valuation above CNY
              20B. The April 2024 D-2 round of roughly CNY 2B was explicitly tied to large-model applications, green
              high-performance computing infrastructure, and global expansion, which indicates management is still
              funding both product and balance-sheet-intensive growth. Microware’s disclosed strategic investment adds
              one visible external capital signal, but cash on hand, monthly burn, runway, debt facilities, and
              project-finance obligations remain undisclosed. Terminus has filed for HKEX listing three times, with the
              September 2024 and April 2025 applications lapsing before a November 2025 refiling. That pattern supports
              a view that IPO execution is central to investor liquidity, but also that timeline risk remains material
