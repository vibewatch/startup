      - number: '1.4'
        title: Milestones and Scale
        blocks:
          - type: paragraph
            body: >
              The milestone record shows a company that has achieved real commercial and deployment scale, while also
              carrying a visible adverse narrative around losses and IPO timing. From its 2015 founding, Terminus moved
              quickly into large institutional fundraising and reached unicorn status by the 2018 Series B.
              Operationally, the best-known public deployment remains Expo 2020 Dubai, where Terminus served as China’s
              only official premier partner and deployed more than 150 Titan robots for visitor-facing tasks, creating a
              showcase reference for smart-city and robotics ambitions. By 2024 the company had expanded to 150-plus
              cities and 800-plus clients, with later 2025 disclosures pushing those figures to more than 172 cities and
              900 customers, while backlog reportedly reached RMB 2.3B and receivable turnover improved sharply from 238
              days in 2022 to 104 days in 2024. Financially, the topline accelerated to RMB 1.843B in FY2024, up 83.2%
              year over year, and the AI Industrial Digitalization segment became the clear growth engine. The adverse
              side is equally material: GAAP losses remained very large in FY2022 through H1 2025, and two consecutive
              HKEX filings lapsed before the company submitted a third prospectus in November 2025. For investors, the
              synthesis is straightforward: Terminus has built enough revenue, customers, capital support, and flagship
              deployments to remain IPO-relevant, but it still has not converted scale into credible public-market
              readiness.
