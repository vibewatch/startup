  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Terminus's addressable market is bounded by three nested definitions that must not be conflated. The
              broadest lens is China's total Smart City ICT market, which IDC sized at RMB 939.71B (~USD 130B) in 2024,
              comprising infrastructure and IoT devices (58.1%), software (24.7%), and ICT services (17.3%); IDC
              projects this to reach RMB 1.23T by 2028 at a 7.1% CAGR. At this level Terminus competes for only a
              fraction, as the majority of spending goes to hardware, telecom, and general-purpose cloud infrastructure
              rather than AIoT platforms. The second lens is the global public-domain AIoT market as defined by Frost &
              Sullivan in Terminus's IPO prospectus: RMB 754B in 2018, growing to RMB 1.65T by 2023 at 17% CAGR,
              projected to reach RMB 2.664T by 2028 at 10.1% CAGR. This market specifically captures commercial and
              public spaces where AIoT operating-system-style platforms are deployed, making it Terminus's stated TAM.
              The third lens is global AIoT broadly: MarketsandMarkets sizes the global AI-in-IoT market at USD 25.44B
              in 2025 growing to USD 81.04B by 2030 at 26.1% CAGR, and Allied Market Research estimates a wider global
              AIoT market at USD 126.1B in 2023 projected to USD 1.32T by 2032 at 30.2% CAGR. Market Research Future
              tracks a narrower China-specific technology segment at USD 142.2M in 2024 with a 18.3% CAGR. The wide
              variance across estimates (factor of 10 between IDC and MRF for China alone) reflects different boundary
              choices: full ICT stack vs. software-only vs. specific AIoT subsegments. For underwriting purposes, the
              operative TAM is the public-domain AIoT segment as Terminus frames it, with a SAM limited to sectors where
              TacOS has live deployments: industrial parks, commercial real estate, municipal services, and residential
              developments. EqualOcean estimated China's AIoT industry chain market at CNY 1.7T in 2024 at 17% annual
              growth, suggesting this broader estimate includes hardware and connectivity. Grand View Research cites a
              28.4% CAGR for China smart cities broadly, consistent with the MarketsandMarkets AIoT view but wider than
              IDC's more conservative infrastructure-inclusive view.
