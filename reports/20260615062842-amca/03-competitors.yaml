  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Qualification lock-in on acquired platform approvals
        - OEM requalification campaigns at platform generation-change; new entrant competition
        - High
        - Confirm which specific part numbers and platforms Amca holds approved supplier status on; assess generation-change timeline
      - - RAPID platform speed advantage (67%+ lead-time reduction claimed)
        - Incumbents adopt similar digital integration; speed advantage narrows over 3-5 years
        - Medium
        - Validate RAPID IP ownership and defensibility; assess whether speed advantage is structural or execution-dependent
      - - Acquisition pipeline of distressed legacy shops
        - TransDigm, HEICO, PE roll-ups compete for the same acquisition targets
        - High
        - Map the remaining acquirable shop universe; assess deal pricing pressure; confirm Amca has not overpaid on early acquisitions
      - - Certified capability breadth across hydraulics, power, avionics
        - Single-product specialists undercut on individual categories
        - Medium
        - Verify cross-certification at each acquired shop; assess which customers value multi-category breadth vs. single-category price
      - - Direct prime-customer relationships (Boeing, LM, Northrop, Raytheon named)
        - OEM insourcing (Boeing-Spirit model) or OEM preferred supplier consolidation
        - Medium
        - Confirm contractual depth; assess revenue concentration by customer; review OEM make-buy policies at each named customer
      - - Cost advantage of modernized legacy footprint vs. greenfield build
        - Greenfield entrants with full automation; international low-cost precision shops
        - Low (near-term)
        - New entrant qualification takes 2-5 years on defense programs; ITAR restricts foreign shops; moat holds near-term but monitor
      - - Adverse pricing power ceiling
        - Congressional / DoD backlash against sole-source pricing (TransDigm precedent)
        - Low (current) but rising
        - Amca's acquisition model is not explicitly sole-source monopoly; differentiate positioning; monitor regulatory environment
    notes: >-
      Severity ratings are relative assessments based on publicly available evidence as of June 2026.
      'High' indicates a risk with near-term evidence of competitive pressure. 'Low' indicates a risk
      that is real but whose timeline or mechanism is not yet active.
