    title: Competitive positioning map — capability integration depth vs. component-breadth
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning of six major competitors and Amca on two dimensions: engineering-to-production
      integration depth (x-axis, 1=parts-only to 10=full integrated workflow) and component-category
      breadth within the Amca-relevant segments of hydraulics, power, and avionics (y-axis, 1=single
      category to 10=multi-category). Positioning is evidence-based but ordinal; no numeric precision implied.
    data:
      points:
        - label: Amca
          x: 8
          y: 7
          description: "Acquisition-and-modernization model integrates design, qualification, and production; growing breadth via hydraulics (Cal-Draulics), power (Payne Magnetics), and avionics housings"
        - label: TransDigm
          x: 3
          y: 5
          description: "Sole-source parts manufacturer; deep pricing power but limited engineering integration; multi-category via acquisitions but each unit operates independently"
        - label: HEICO
          x: 3
