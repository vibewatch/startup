  - id: status-quo-substitutes-internal-build
    title: Status quo, substitutes, and internal OEM build
    body: >-
      The largest single competitor by volume of contracts held is the existing ecosystem of
      single-shop independent precision suppliers. These shops—typically employing fewer than
      100 people, often owner-managed, frequently founded in the 1950s–1970s—collectively hold
      a large share of existing defense and commercial component qualification approvals. They
      compete on the basis of an existing approved supplier list (ASL) position and established
      relationships with program offices, not on speed, breadth, or integrated engineering.
      Their vulnerabilities are well-documented: aging workforces with no succession pipeline,
      inability to fund AS9100 upgrades or CMMC cybersecurity compliance, manual processes that
      fail emerging prime-contractor digital integration requirements, and financial fragility
      from working-capital cycles tied to long-lead programs. NDIA Vital Signs 2026 and GAO
      industrial-base analysis confirm these shops are exiting the supply base faster than new
      capacity is entering. This attrition is the structural opportunity Amca is designed to
      capture through acquisition.

      Distributors and broker networks represent a secondary status-quo substitute that buyers
      use when primary suppliers miss delivery windows. These intermediaries carry certified
      inventory or source from multiple shops, creating a buffer but no additional manufacturing
      capability. They are not a strategic threat to Amca's model, which focuses on capability
      development rather than distribution.

      The OEM internal manufacturing path—exemplified by Boeing's $4.7 billion reabsorption
      of Spirit AeroSystems in December 2025—is a credible substitute for very large aerostructure
      programs. Boeing's Spirit transaction added 15,000 employees and absorbed commercial
      fuselage production for the 737, 767, 777, and 787. This insourcing logic does not readily
      extend to lower-tier critical components such as hydraulic actuators, power distribution
      assemblies, or precision avionics housings, because the capital investment, qualification
      overhead, and workforce requirements are not justified by the volume of any single component
      family. The Boeing-Spirit deal is therefore a bounded precedent, most relevant to aerostructure
      Tier-1 adjacencies and less relevant to Amca's specific component focus.

      Amca's February 2026 acquisition of Payne Magnetics—a Southern California power electronics
      supplier founded in the 1950s—illustrates the Amca acquisition-and-modernization thesis in
      practice. The transaction added a legacy qualified supplier to Amca's network, the same
      template applied in the Cal-Draulics (hydraulics) and BC Systems acquisitions. No incumbent
      public company is executing a comparable roll-up specifically targeting pre-qualified but
      underinvested single-shop legacy suppliers in critical-component segments; this represents
      Amca's most defensible near-term competitive differentiation.
