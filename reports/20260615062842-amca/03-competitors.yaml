  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Amca qualification status
      missingEvidence: >-
        Specific part numbers, platform approvals, and approved supplier list (ASL) positions held by
        each of Amca's acquired shops are not publicly disclosed.
      whyItMatters: >-
        The durability of Amca's competitive position hinges on the depth and scope of existing
        qualification approvals; without this list, it is impossible to assess how much re-validation
        work remains or which competitors hold approvals on the same programs.
      diligencePath: >-
        Request full listing of current AS9100 certificates, NADCAP accreditations, and OEM-level
        approved supplier list positions for each acquired shop; confirm re-validation status post-acquisition.
      relatedQuestionRefs:
        - QP010
        - QP013

    - type: private-evidence-only
      severity: material
      topic: Amca pricing and contract structure
      missingEvidence: >-
        Amca does not publicly disclose pricing model, contract types, margin structure, or revenue
        concentration by customer.
      whyItMatters: >-
        Pricing structure determines whether Amca faces fixed-price execution risk (like Albany's
        CH-53K program) or cost-plus protection, and whether revenue is concentrated in one or two
        customers (creating OEM bargaining power risk).
      diligencePath: >-
        Review all executed production contracts, customer MSAs, and pricing terms in the diligence
        data room; obtain revenue by customer table and contract-type mix.
      relatedQuestionRefs:
        - QP018

    - type: missing-source
      severity: minor
      topic: Single-shop supplier attrition rate 2026
      missingEvidence: >-
        A precise count or documented annual exit rate for single-shop independent A&D precision
        suppliers in the U.S. has not been found in publicly accessible 2026 sources.
      whyItMatters: >-
        The rate of attrition governs how large the Amca acquisition opportunity remains; if attrition
        is very fast, the pipeline shrinks; if slow, the competitive window is longer.
      diligencePath: >-
        Request data from NTMA, AMT (Association for Manufacturing Technology), or NDIA Supply Chain
        working group; review recent NDIA Vital Signs supplier counts versus prior years.
      relatedQuestionRefs:
        - QP012

    - type: missing-source
      severity: minor
      topic: Commoditization velocity measurement
      missingEvidence: >-
        No publicly available quantitative study measuring the pace of precision-machining capability
        diffusion (5-axis CNC, automated inspection) across lower-tier aerospace suppliers was found
        that would allow estimation of the commoditization timeline for Amca's component families.
      whyItMatters: >-
        The speed at which capability diffuses to competing shops determines how long Amca's process
        advantages remain defensible and which component categories are at risk earliest.
      diligencePath: >-
        Commission or identify an AMT/NTMA or NDIA survey benchmarking technology adoption rates
        across Tier-3 precision shops; assess Amca's component complexity distribution against
        known automation thresholds.
      relatedQuestionRefs:
        - QP017

    - type: missing-source
      severity: minor
      topic: Competitor acquisition bids for same targets as Amca
      missingEvidence: >-
        No public evidence found that TransDigm, HEICO, or any private equity buyer is actively
        bidding on the same single-shop legacy A&D suppliers that Amca targets.
      whyItMatters: >-
        If competition for acquisition targets is heating up, Amca's acquisition price multiples
        could rise, compressing return-on-investment on the roll-up strategy.
      diligencePath: >-
        Survey M&A advisors active in the lower-middle-market A&D space; review recent HEICO
        acquisition announcements for overlap with Amca's target segments.
      relatedQuestionRefs:
        - QP022

