callouts:
  - calloutType: strength
    title: White-space positioning vs. incumbent models
    body: >-
      None of the five incumbent public competitors—TransDigm, HEICO, Ducommun, Moog, or Albany AEC—
      targets the specific combination of acquisition, workforce retention, and integrated RAPID-platform
      modernization that Amca pursues. TransDigm and HEICO both acquire legacy shops but for pricing
      power (TransDigm) or aftermarket catalog expansion (HEICO), not engineering-led re-qualification.
      This leaves a structural gap that Amca is currently moving into with capital and speed advantages.
    claimRefs:
      - CP004
      - CP013
      - CP036
      - CP039

  - calloutType: risk
    title: Qualification re-validation after acquisition is a hidden timeline risk
    body: >-
      When Amca acquires a legacy shop, it inherits the shop's existing qualification approvals—but
      customers and program offices typically require re-validation of the new legal entity's quality
      systems before resuming production. This re-validation process can range from weeks (for a
      simple ownership-change acknowledgment) to 12+ months (for a full first-article re-qualification
      on critical components). If re-validation timelines extend across multiple acquisitions
      simultaneously, Amca's revenue ramp could be delayed relative to its acquisition pace.
    claimRefs:
      - CP033
      - CP034

  - calloutType: risk
    title: Adverse evidence — TransDigm's pricing model creates a regulatory cautionary tale
    body: >-
      TransDigm's documented refusal to provide cost and pricing data to DoD—with 401 unanswered
      requests from the Defense Logistics Agency cited by Senators Warren and Garamendi—and its
      use of "commerciality" loopholes to avoid TINA disclosure requirements illustrate the
      reputational and regulatory risks of over-relying on sole-source lock-in for pricing power.
      While Amca's model is not a pricing-power play of the same type, investors should monitor
      whether Amca's acquired sole-source positions are managed transparently to avoid similar
      Congressional scrutiny as the company scales.
    claimRefs:
      - CP007
      - CP008
      - CP040

  - calloutType: insight
    title: Boeing-Spirit reabsorption resets the boundary of OEM make-vs-buy
    body: >-
      Boeing's $4.7B re-acquisition of Spirit AeroSystems—following two decades of outsourcing
      Tier-1 fuselage manufacturing—recalibrates the theoretical limit of OEM insourcing. However,
      the transaction was driven by safety/quality failures on the 737 MAX, not by a general
      strategic preference for insourcing. Mission-critical components below Tier-1 aerostructure
      size (hydraulics, power distribution, precision avionics housings) remain well outside
      the economic scope of OEM in-house build for now, limiting direct threat to Amca's product focus.
    claimRefs:
      - CP030
      - CP031
      - CP032

