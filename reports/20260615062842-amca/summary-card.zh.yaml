  topStrengths:
    - 作为风投支持的制造商，Amca 很快铺出真实工厂和合格产能，速度少见。
    - 它切中公开记录里的美国国防工业基础瓶颈和单一来源供应商缺口。
    - 强投资人组合，加上具名客户和平台曝光，让需求入口有可信证明。
  topRisks:
