  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer concentration disclosure
      missingEvidence: >-
        Revenue breakdown by top-3 customers, Boeing's share of total revenue, and customer concentration
        percentage data are not publicly disclosed by Amca.
      whyItMatters: >-
        Without revenue concentration data, investors cannot size the exposure to Boeing production-rate changes,
        program cancellations, or any single-customer demand shift — making the concentration risk unquantifiable.
      diligencePath: >-
        Request customer revenue waterfall (top 5 customers as % of total revenue) in the diligence data room;
        compare against industry norms for aerospace tier-2 suppliers (typically top-1 customer at 30–50% for
        early-stage consolidators).
      relatedQuestionRefs:
        - QU007
        - QU025
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: BC Systems customers
      missingEvidence: >-
        BC Systems program names, customer identities, contract values, and classification levels are entirely
        undisclosed; the only public description is "multiple growing classified defense programs."
      whyItMatters: >-
        BC Systems may represent a meaningful revenue stream from non-OEM government sources; inability to size
