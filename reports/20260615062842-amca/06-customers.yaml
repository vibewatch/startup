  - id: named-customer-proof-and-adoption
    title: Named customer proof and adoption trajectory
    body: >-
      Amca's most auditable customer proof comes from its acquired sub-brands, each of which brings decades of platform
      history and supplier approvals into the parent entity. Electrocube is the strongest third-party-validated proof point:
      among Boeing's 5,000-plus direct suppliers, Electrocube consistently ranked in the top 20 for quality, on-time delivery,
      and responsiveness — an independent Boeing evaluation that is rare in its specificity for a sub-tier supplier.
      Electrocube's foil-wound transformers, EMI filters, and TRUs appear across the Boeing 737, 747, 757, 767, 777, the
      F-15, F-16, and C-17 programs. ACPI adds hydraulic pressure and liquid-level switches on the Boeing 737, 747, 767,
      F-15, and C-17 — a 46-year heritage relationship that the company explicitly frames as "some of the biggest commercial
      and defense aircraft programs in the world." Payne Magnetics brings longstanding RF power magnetics relationships on
      the Boeing 737 MAX, F-16, and F-18, with Amca investing in new variants for UAV and energetics programs.
      For the F-35, CEO Malik stated publicly at the Series B press conference that an electromechanical component from
      Electro-Mech was going to enter production use on the program "very shortly," and the Series B press release and Manufacturing
      Dive both confirm RAPID is being deployed for F-35 components in production. BC Systems, acquired as part of the Series B
      round, is described only as supporting "multiple growing classified defense programs" — a deliberately opaque but commercially
      meaningful description given the company's 40-year history as a military-only power supply manufacturer.
      On the trajectory side, the CEO reported a 10x year-over-year revenue increase at Series B and described the valuation
      multiple jump from Series A to Series B as five to seven times — directionally strong signals but company-claimed figures
      without disclosed base numbers. No customer count, repeat-purchase rate, or utilization metric has been published.
    claimRefs:
