callouts:
  - calloutType: strength
    title: Electrocube's top-20 Boeing ranking is rare and durable proof of customer quality
    body: >-
      Among Boeing's 5,000-plus direct suppliers, Electrocube's top-20 ranking on quality, on-time delivery, and
      responsiveness is the highest-specificity independent customer validation in Amca's portfolio. This ranking —
      pre-dating Amca's ownership — is now part of the Amca value proposition and creates a verifiable anchor for
      customer conversations that most seed-stage hardware companies cannot produce.
    claimRefs:
      - CU006
  - calloutType: risk
    title: No customer concentration data disclosed; Boeing dependency persists as an unquantified risk
    body: >-
      Despite the diversification of the named OEM roster from one to eleven-plus customers between April 2025 and
      May 2026, Amca has not published any revenue breakdown by customer, program, or platform. Without a disclosed
      top-customer concentration percentage, investors cannot size the exposure to Boeing production-rate changes or
      to any single program delay. The FAA's 42-jets-per-month production cap on Boeing is a live constraint that
      could directly suppress component demand growth in the commercial aviation segment.
    claimRefs:
      - CU024
      - CU025
  - calloutType: risk
    title: Post-acquisition qualification status for six factories is a material unverified gap
    body: >-
      When a manufacturer changes ownership, OEM customers and regulators may require re-qualification of the new
      entity's AS9100D scope, NADCAP accreditations, and FAI history. Amca has not publicly confirmed that all six
      acquired factories retained their original approvals under Amca ownership, nor whether any customer has required
      re-inspection following the acquisitions. This is a diligence-room question with direct revenue consequences.
    claimRefs:
      - CU018
      - CU027
  - calloutType: insight
    title: Inherited qualification lock-in is both moat and ceiling — new platforms require full cycles
    body: >-
      Amca's acquisition strategy captures existing platform approvals without requiring new qualification cycles for
      legacy parts. But any new product variant, new platform, or new customer requires completing the full FAI,
      NADCAP, and AS9100D qualification process — typically 6 to 12-plus months. RAPID is designed to compress this
      cycle, but independent verification of RAPID's actual qualification speed vs. industry standard has not been
      published. Customer expansion speed therefore depends on a compression claim that has yet to be externally
      audited.
    claimRefs:
      - CU019
      - CU022
      - CU027
