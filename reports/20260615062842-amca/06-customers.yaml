        - label: Customer re-qualification confirmation
          value: 72
          description: Customers and OEM program teams confirm component approvals remain valid under Amca ownership; new FAI if ownership change triggers re-inspection
        - label: First Amca-branded production order
          value: 60
          description: Customer places production order under new Amca entity; delivery and quality performance tracked against legacy benchmarks
        - label: Repeat order and program expansion
          value: 48
          description: Demonstrated delivery performance and AS9100D compliance enables repeat purchase and potential new part qualification
        - label: Multi-program and new variant development
          value: 32
          description: RAPID used to develop new variants for adjacent platforms or new customers; cross-sub-brand bundling begins
    approximationNotes: >-
      Stage volumes are illustrative relative percentages representing expected attrition through each stage, not actual Amca data.
