  - id: expansion-concentration-and-adverse-evidence
    title: Expansion, concentration risk, and adverse evidence
    body: >-
      The most significant customer risk in Amca's current profile is the residual Boeing concentration inherited from
      the company's founding. At launch in April 2025, Boeing was the sole confirmed named customer, and external commentary
      — including an Ainvest analysis at the time of the Series A — explicitly questioned whether the company's valuation of
      $350 million-plus was pricing in success not yet demonstrated, given a single-anchor-customer dependency. By May 2026,
      the OEM roster had diversified to seven named customers in the press release and eleven-plus in CEO media statements,
      but no revenue-by-customer or concentration-percentage data has been released, leaving the true exposure to Boeing
      demand uncertain. Boeing's own supply chain environment compounds this risk: the FAA's 42-jets-per-month production cap,
      unresolved 737 MAX certification items, and the Logistics Viewpoints analysis of Spirit AeroSystems illustrate that
      disruption at the tier-one level ripples to sub-tier suppliers. A broader aviation supply chain analysis (Safe Fly
      Aviation, January 2026) documents $11 billion-plus in 2025 supply-chain friction costs and a 17,000-plus aircraft
      backlog — conditions that create demand for Amca but also amplify the consequences of any Amca-side quality or delivery
      failure. The single-source supplier dynamic documented in the New Space Economy report is directly applicable: once a
      customer has designed Amca components into a program, switching is expensive and slow, which is a structural advantage
      for Amca but also means any loss of a qualified program slot is extremely difficult to recover. BC Systems' classified
      revenue stream is strategically important but fully opaque. The PCE Companies aerospace M&A report (June 2026) documents
      aerospace mission-critical manufacturing valuations at 18.87x EBITDA median — a market context that validates investor
      interest but also raises the stakes for revenue visibility at the next financing event.
    claimRefs:
      - CU016
      - CU024
      - CU025
      - CU026
      - CU028
      - CU030
      - CU033
      - CU034
      - CU037
