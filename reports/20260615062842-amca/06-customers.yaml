chapter:
  number: 6
  title: Customers
  summary: >-
    Amca entered the market in April 2025 with Boeing as its sole confirmed customer and, by the May 2026 Series B announcement,
    had expanded its named OEM roster to seven primes in the official press release — with CEO statements adding BAE Systems,
    GE Aerospace, Textron, and Bombardier for a total of eleven-plus named customers. Customer relationships are primarily
    inherited through acquired legacy sub-brands (Electrocube, ACPI, Payne Magnetics, Electro-Mech, BC Systems), each with
    decades of platform history on Boeing, Lockheed Martin, the F-35, commercial narrowbodies and widebodies, and classified
    defense programs. No customer concentration data, NRR, GRR, or churn metrics are publicly disclosed; the inherited qualification
    lock-in creates structural retention advantages but Boeing's own production-rate cap and unresolved post-acquisition AS9100
    scope questions are the most material customer risks heading into the next growth phase.
sections:
  - id: customer-base-segmentation
    title: Customer base segmentation and named platform coverage
    body: >-
      Amca operates as a Tier-2 aerospace and defense component supplier, meaning its direct buyers and payers are prime
      contractors (OEMs) and Tier-1 system integrators, not the end users of the aircraft or weapons systems. The buyer/payer
      group includes Boeing, Lockheed Martin, Northrop Grumman, Airbus, Embraer, Honeywell, and Raytheon — all named explicitly
      in the May 2026 Series B press release — plus BAE Systems, GE Aerospace, Textron, and Bombardier cited by CEO Jai Malik
      in media appearances the same week. The company also supplies U.S. military sustainment programs directly, where the
      payer is the DoD or the Defense Logistics Agency and the end user is the warfighter. A sixth revenue stream exists
      through BC Systems, which serves exclusively military customers on undisclosed classified programs. Geographically, the
      customer base is predominantly U.S.-domestic given Amca's factory footprint and security clearance needs, but commercial
      OEM relationships (Airbus, Embraer, Bombardier) extend reach to European and Brazilian programs. By vertical, the
      customer base spans commercial aviation (737, 747, 757, 767, 777, A320, E-jets), defense aviation (F-35, F-16, F/A-18,
      F-15, C-17), ground systems (M1 Abrams), and naval (Mk-48 torpedo). No revenue breakdown by segment, geography, customer,
      or platform has been disclosed publicly; the segmentation above rests on named platform and customer references extracted
      from official press releases, product pages, and media reporting.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU015
