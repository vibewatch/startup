      relatedQuestionRefs:
        - QU018

    - type: private-evidence-only
      severity: material
      topic: retention disclosure
      missingEvidence: >-
        Amca has not published NRR, GRR, churn rate, or any customer satisfaction data; retention thesis rests
        entirely on inherited structural switching costs and industry proxy benchmarks.
      whyItMatters: >-
        Without Amca-specific retention data, it is impossible to verify whether acquired customer relationships
        are holding post-ownership transfer or whether any customers have moved to alternative suppliers.
      diligencePath: >-
        Request rolling 12-month renewal cohort, repeat-order rate by sub-brand, and customer scorecard data
        from Boeing and Lockheed Martin programs in the diligence data room.
      relatedQuestionRefs:
        - QU016

    - type: missing-source
      severity: material
      topic: Boeing qualification requirements
      missingEvidence: >-
        Confirmation that all six Amca-acquired factories have retained their original AS9100D scopes,
        NADCAP accreditations, and FAI approvals under Amca's new ownership has not been publicly disclosed.
      whyItMatters: >-
        Ownership changes can trigger mandatory re-inspection or re-qualification under Boeing, Lockheed Martin,
        and DLA program requirements; a lapse in any certification could interrupt component delivery and revenue.
      diligencePath: >-
        Request copies of current AS9100D certificates, NADCAP accreditation scope letters, and Boeing/LM
        customer approval status for each factory; verify with the certifying bodies directly (IAQG OASIS database).
      relatedQuestionRefs:
        - QU010

