  - id: exit-readiness-and-diligence-asks
    title: Exit readiness, dilution overhang, and final diligence asks
    body: >-
      Amca's most likely exit paths are: (1) strategic acquisition by a defense prime or PE-
      backed aerospace consolidator within a three-to-seven-year horizon; (2) an IPO on the
      model of Loar Holdings once audited multi-year financials are in place; or (3) a
      secondary sale or partial continuation round at a higher valuation if growth continues.
      The $376.5M raised across two rounds at a $1B+ post-money mark implies a preference
      and liquidation stack that depends heavily on investor rights negotiated in the cap table,
      which are not publicly disclosed. Common dilution and preference overhang patterns at
      Series B suggest approximately 35–50% of the fully diluted ownership has been allocated
      to investors, with later-round investors carrying liquidation preferences that could
      reduce common equity returns in a modest-multiple exit.

      The PCE Q1 2026 M&A market update identifies strategic acquirers as responsible for 83.9%
      of the 137 LTM aerospace and defense transactions, with financial sponsors accounting for
      13.1%, and highlights active buyer interest in mission-critical manufacturing assets. The
      same report notes median LTM multiples of 18.87x EBITDA and 3.74x revenue, providing
      the most current disclosed anchor for what a strategic acquirer would pay. At those multiples
      and assuming Amca reaches $200M in revenue and 25% EBITDA margins ($50M EBITDA) by
      year five, the M&A exit value would be approximately $750M–$940M—barely above the
      current post-money mark and below the total invested capital after future rounds. This
      math underscores that a satisfactory return to Series B investors requires either better-
      than-peer multiples at exit (which requires RAPID-validated differentiation) or substantially
      higher revenue than conservative estimates allow.

      Final diligence asks before re-rating the recommendation to buy or track are: audited
      financial statements for the period since launch; a detailed cap table and preference
      waterfall; customer concentration breakdown; factory-level EBITDA margins for each
      acquired shop pre- and post-integration; RAPID platform throughput metrics with OEM
      confirmation; and a disclosed view of remaining acquisition pipeline with deal multiples.
      Without these, the investment remains un-underwriteable at the current price.
