  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Amca has not published audited revenue, gross margin, EBITDA, or any time-series
        financial data. The only public financial signal is an undenominated tenfold growth claim.
      whyItMatters: >-
        The valuation cannot be independently underwritten without a revenue denominator.
        All scenario analysis relies on estimated revenue ranges, not confirmed figures.
      diligencePath: >-
        Request FY2024 and FY2025 audited financial statements and management accounts for
        each acquired subsidiary in a formal data room; compare to the tenfold growth narrative.
      relatedQuestionRefs:
        - QV017
        - QV019

    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: >-
        Cap table, investor rights agreements, liquidation preferences, anti-dilution provisions,
        and participation rights for all investors have not been disclosed.
      whyItMatters: >-
        Preference and participation rights directly affect common equity returns under base
        and bear exit scenarios; the return profile cannot be modeled without this data.
      diligencePath: >-
        Request Series Seed through Series B term sheets and pro forma fully diluted
        capitalization table; model waterfall under three exit scenarios.
      relatedQuestionRefs:
        - QV030

