company:
  name: Amca
chapter:
  number: 8
  title: Valuation
  summary: >-
    Amca's $1 billion-plus Series B valuation is currently unverifiable from publicly available
    audited financial data—no revenue, EBITDA, or gross margin figures have been disclosed, and
    the sole public financial signal is an undenominated tenfold growth claim. Against the closest
    public comparable (Loar Holdings, which trades at ~13.5x trailing revenue at $7.2B enterprise
    value on $538M in disclosed revenue), a $1B+ mark would require Amca to have approximately
    $75–100M+ in already-recognized revenue—possible given the five acquisitions and 10x growth
    claim but entirely unconfirmed. The current recommendation is research-more: the thesis is
    structurally sound and investor quality is high, but the valuation cannot be underwritten
    without audited financials, and the capital-intensive, integration-heavy model carries
    execution de-rating risk not reflected in the headline number.
sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment thesis, anti-thesis, and recommendation
    body: >-
      The investment thesis for Amca rests on four pillars: first, a structurally undersupplied
      critical-component layer that major OEM primes cannot self-supply and that the incumbent
      supplier base is too fragmented, capital-starved, and aging to serve adequately; second,
      a differentiated model that bundles acquisition, modernization, and RAPID-accelerated
      engineering under a single certified workflow rather than simply buying and holding legacy
      shops; third, a capital-efficient approach to market entry that inherits OEM qualification,
      production tooling, and customer relationships rather than building them from scratch; and
      fourth, a rare alignment of national security urgency, bipartisan political support, and
      prime-contractor demand that gives the supply-gap narrative persistent tailwind. The
      investor syndicate—Caffeinated Capital (both rounds), Lightspeed, Andreessen Horowitz, Lux
      Capital, Construct Capital, and House Capital—represents tier-1 technology and deep-tech
      capital, suggesting the thesis withstood institutional diligence.

      The anti-thesis is equally specific. No audited revenue or EBITDA has been published;
      the tenfold growth claim lacks a denominator, time period, or accounting basis, making
      it impossible to verify whether the $1B+ valuation reflects a business at $50M, $100M,
      or $200M+ in annualized revenue. At public comparable multiples, these are meaningfully
      different entry points: a $1B valuation at a Loar-style 13.5x EV/Revenue implies $74M
      in revenue, while at a Ducommun-style 1.2x it would imply $833M—an order of magnitude
      difference. Integration execution risk is also undisclosed: five acquisitions in eighteen
      months across California, Iowa, and New York with multiple manufacturing processes,
      quality management systems, and workforce cultures creates significant organizational
      absorptive capacity risk, especially under a relatively small disclosed leadership team.
      The absence of any disclosed customer concentration data means customer overhang (e.g.,
      one OEM representing 60%+ of bookings) could be an invisible risk at today's price.

      The recommendation is research-more, not buy or track. The thesis is structurally sound
      and the market opportunity is real, but the valuation cannot be underwritten at current
      public evidence levels. What would move the call toward buy: (1) audited revenue and
      gross margin confirming the unit economics at scale; (2) customer concentration data
      showing no single prime over 35% of revenue; (3) RAPID-accelerated qualification
      evidence with OEM-confirmed lead-time improvements; and (4) integration milestone proof
      from the acquired shops showing retained workforce, quality score consistency, and
      on-time delivery. A down-round or bridge at a lower implied valuation would create a
      more attractive entry point.
