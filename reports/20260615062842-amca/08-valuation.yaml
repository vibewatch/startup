figures:
  - id: FV001
    title: Recommendation logic flow
    type: flow
    layout: standard
    summary: >-
      Chain from market evidence, financial evidence, risk profile, and comparable analysis
      to the research-more recommendation with conditions for upgrade to buy or track.
    data:
