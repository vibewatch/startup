  - id: valuation-context-and-comps
    title: Valuation context, comparable set, and market multiple benchmarks
    body: >-
      Amca's $1B+ valuation must be read against three distinct reference frames: public
      aerospace component manufacturers, recent private defense-tech unicorn rounds, and
      disclosed M&A transaction multiples for the aerospace and defense supply chain segment.
      Each frame tells a materially different story about where the current mark sits in context.

      Among public aerospace component manufacturers, the premium is set by TransDigm Group
      (TDG), which trades at an enterprise value of $98.4 billion against trailing revenue of
      $9.5 billion (TTM through March 2026) and EBITDA of $4.8 billion—implying EV/Revenue of
      approximately 10.4x and EV/EBITDA of approximately 20x as of June 2026. TransDigm's
      commanding multiple reflects a sole-source, aftermarket-heavy business model generating
      ~60% gross margins and ~51% EBITDA margins, which Amca cannot yet claim. HEICO Corporation
      (HEI) commands an even higher EV/EBITDA of approximately 35x on $4.9 billion in revenue
      and 28% EBITDA margin, reflecting a growth premium. Loar Holdings (LOAR), the most
      directly analogous public peer to Amca's acquisition-driven model, trades at $7.24B
      enterprise value on $538M LTM revenue (EV/Revenue ~13.5x) and $193M EBITDA (EV/EBITDA
      ~37x) as of June 2026, after achieving 15% organic growth in 2024 and 20%+ M&A-enhanced
      growth—multiples that Sahm Capital analysts describe as already representing a significant
      premium to sector peers. The Aerospace and Defense sector per Damodaran January 2026 data
      sits at a median EV/EBITDA of 21.58x across 79 U.S. firms with positive EBITDA.

      Among private defense-tech unicorns, the sector is experiencing a valuation boom. Anduril
      Industries doubled its valuation in roughly twelve months to $61B in May 2026, anchored by
      $2.2B in 2025 revenue (implying ~28x revenue). Shield AI raised $1.5B at $12.7B valuation
      in March 2026—a 140% increase over its $5.3B March 2025 mark—on projected 2026 revenue of
      $540M (implying ~23x revenue). Both are software-heavy autonomy platforms commanding AI
      and dual-use premiums not applicable to Amca's manufacturing roll-up model.

      For M&A transactions in the aerospace and defense segment, PCE Investment Bankers'
      Q1 2026 update tracks 137 LTM transactions at median 18.87x TEV/EBITDA and 3.74x
      TEV/Revenue. The highest multiples are in defense electronics, space systems, and
      autonomy. For mission-critical manufacturing with a heritage supplier base, First Page
      Sage's private transaction data puts Military & Defense companies at approximately
      7.7–14.7x EBITDA multiples in Q1 2025 depending on EBITDA scale. These transaction
      data points suggest the private M&A market does not price defense manufacturing startups
      at software-like multiples, and Amca's current implied revenue multiple (if inferred from
      the $1B+ mark against plausible revenue ranges) appears stretched relative to private
      M&A transaction benchmarks unless revenue is materially higher than the most conservative
      estimates allow.
