callouts:
  - calloutType: recommendation
    title: Recommendation — research-more at current evidence level
    body: >-
      The investment thesis for Amca is structurally sound: the market gap is real, the
      operator track record is credible for an 18-month-old company, and the investor syndicate
      is tier-1. However, the $1B+ valuation cannot be underwritten from public evidence.
      The missing element is not narrative quality—it is audited financial statements.
      Until revenue, gross margin, and integration metrics are disclosed, the recommendation
      is research-more with a firm price-sensitivity discipline: do not follow at current
      implied multiples without data-room confirmation.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007

  - calloutType: risk
    title: Multiple compression and execution de-rating are the primary valuation risks
    body: >-
      Two independent forces could compress exit value below the current $1B+ mark. First,
      A&D public market multiple compression: Loar Holdings and HEICO both trade at historically
      elevated multiples (37x and 35x EV/EBITDA respectively) that Sahm Capital analysis flags
      as premium versus sector averages. Any mean-reversion toward 20x would reduce the
      comparable set exit value by 40–45%. Second, integration execution de-rating: five
      acquisitions in 18 months is an aggressive pace by any industrial standard, and failure
      to achieve the RAPID-enabled margin lift would leave Amca with conventional contract
      manufacturing margins (10–15% EBITDA) rather than the 30–37% Loar benchmark, materially
      reducing the multiple a buyer would apply.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039

  - calloutType: assumption
    title: Key assumptions underlying the base-case scenario
    body: >-
      The base-case scenario in TV003 and FV003 rests on three assumptions that cannot currently
      be verified from public sources: (1) Amca's annualized revenue at the time of the Series B
      was $50–100M, derived from the tenfold growth claim against a plausible $5–10M initial
      2025 revenue base; (2) acquisition multiples paid for the five acquired shops were in
      line with the 7.7–14.7x EBITDA range reported by First Page Sage for private Military &
      Defense M&A; and (3) integration is proceeding at a pace that preserves rather than
      dilutes the gross margin profile of the acquired businesses. If any of these assumptions
      is materially wrong, the base case degrades toward the bear case.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029

