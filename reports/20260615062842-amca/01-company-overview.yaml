  rows:
  - - Caffeinated Capital
    - Lead investor
    - Led both the initial funding and the 2026 Series B, making it the clearest anchor investor in public materials.
    - Confirm board rights, ownership percentage, pro rata, and protective provisions.
  - - Lightspeed Venture Partners
    - Major Series B participant
    - Named as a major participant in the 2026 round.
    - Clarify whether Lightspeed received any special governance or information rights.
  - - Andreessen Horowitz / Lux / Construct / House Capital
    - Existing investors
    - Existing backers continued into the Series B and likely form the core venture syndicate.
    - Request exact ownership map and any side letters or sector-rights arrangements.
  - - Legacy supplier owners
    - Acquisition sellers and knowledge holders
    - Transaction success depends on retaining know-how while recapitalizing aging businesses.
    - Confirm retention packages, rollover structures, and transition plans.
  - - Prime contractors and OEMs
    - Revenue-side stakeholders
    - Public customer names provide proof of market access but not demand concentration.
    - Request top-customer concentration and qualification pipeline data.
  - - U.S. military sustainment programs
    - Mission-critical end demand
    - Amca says it directly supports readiness-related shortages and declining supply sources.
    - Verify contract channels, prime pass-through exposure, and program-level backlog.
  notes: The public record is strong on round participants and strategy, but weak on exact ownership, board seats, and customer concentration.
