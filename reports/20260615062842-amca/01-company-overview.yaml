- id: capital-scale-and-footprint
  title: Capital base, factory footprint, and customer exposure
  body: 'Amca’s public capital trajectory is unusually fast for a hardware-heavy company. The business launched in April 2025 with $76.5 million of initial funding and less than eighteen months later announced a $300 million Series B led by Caffeinated Capital. Multiple reviewed sources, including the company’s own 2026 release and independent trade coverage, support the claim that the round valued Amca at more than $1 billion. The same body of evidence also makes the factory footprint legible, though not perfectly tidy. Official and independent sources agree on more than 123,000 square feet of qualified production capacity and operations distributed across California, Iowa, and New York. The body text of the Series B release and independent reporting consistently describe six critical-component factories, while the same release’s boilerplate says Amca operates seven factories nationwide including headquarters. The cleanest reconciliation is that the company has six production factories
    plus a separate advanced prototyping and testing site in El Segundo. Public customer exposure is broader than one or two symbolic logos: company and third-party sources name Boeing, Lockheed Martin, Airbus, Embraer, Honeywell, Northrop Grumman, and Raytheon, while the official products page lists platform exposure across Boeing commercial jets, the Airbus A350, and major U.S. defense aircraft. This is meaningful evidence that Amca is not pre-revenue conceptware, but it still falls short of a disclosed customer count, concentration profile, or audited revenue base.'
