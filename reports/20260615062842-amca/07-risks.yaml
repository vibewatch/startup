  - id: regulatory-legal-compliance-risk
    title: Regulatory, legal, and compliance risk
    body: >-
      The regulatory risk surface for a defense component manufacturer has
      expanded materially in the 2025-2026 period across three independent
      fronts: ITAR enforcement, CMMC cybersecurity mandates, and the
      Department of Justice's Civil Cyber-Fraud Initiative under the False
      Claims Act. Amca's status as an acquirer of multiple legacy shops elevates
      each of these risks because each acquisition inherits the prior owner's
      compliance posture, historical records, and—potentially—undisclosed
      violations. On ITAR, the April 2026 State Department settlement with GE
      Aerospace is instructive: DDTC resolved 116 ITAR violations spanning 2018
      to 2024, imposed a $36 million penalty, and required a 24-month Special
      Compliance Officer, even though GE voluntarily disclosed the violations and
      fully cooperated. The violations included unauthorized exports of technical
      data on F-35, F110, F118, and F414 engines to China and systemic failures
      in multi-site compliance governance. For Amca, the risk scenario is not
      identical—its defense customer exposure is currently to components rather
      than complete engine programs—but the structural challenge of harmonizing
      ITAR compliance across six acquired facilities with different legacy records
      is analogous. On CMMC, the DFARS 252.204-7021 clause entered DoD contracts
      in November 2025; Phase 2 requires mandatory third-party C3PAO assessments
      for CUI-handling contracts starting November 2026. The 350,000 DIB
      suppliers competing for a limited pool of CMMC-authorized assessors face
      a six-to-twelve-month compliance runway; non-compliant contractors are
      categorically ineligible for DoD contract awards. On the False Claims Act
      front, MORSECORP's $4.6 million settlement in May 2026 for self-reporting
      a NIST SP 800-171 score of 104 when the real score was negative 142—and
      continuing to receive DoD contract payments—illustrates how cybersecurity
      misrepresentation can become a fraud exposure. The DOJ recovered over
      $52 million in cybersecurity-related FCA settlements in FY2025 alone.
      All three enforcement vectors are active and accelerating; Amca has
      not yet published a CMMC readiness statement, ITAR compliance program
      disclosure, or security attestation.
