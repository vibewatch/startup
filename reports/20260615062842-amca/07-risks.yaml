callouts:
  - calloutType: risk
    title: Thesis-break scenario — quality escape + financing squeeze simultaneously
    body: >-
      The most dangerous scenario for Amca is not any single risk in isolation
      but a two-stressor convergence: a quality escape at one acquired factory
      that triggers a Boeing or Lockheed containment action coinciding with a
      Series C financing market that is tighter than the $1 billion-plus Series B
      implied. A containment action would immediately constrain revenue from the
      affected customer while requiring capital-intensive remediation. If the
      remediation overlaps with a Series C fundraise, the company faces a
      valuation haircut at exactly the moment it needs to demonstrate execution
      credibility. Hardware rollups in aerospace have repeatedly encountered this
      scenario; the distinguishing factor is whether retained owner-operators
      and the RAPID platform can deliver rapid corrective action faster than
      customer patience expires.
    claimRefs:
      - CR010
      - CR016
      - CR033
      - CR042

  - calloutType: risk
    title: Regulatory compliance opacity creates diligence gap
    body: >-
      Amca has not published a CMMC readiness statement, an ITAR compliance
      disclosure, an SPRS score, or a security attestation for any of its six
      factories. This is not unusual for a private company at this stage, but
      it means that investors and customers cannot independently assess whether
      the compliance posture of each acquired facility is adequate. GE
      Aerospace's $36 million settlement involved violations spanning six
      years before they were voluntarily disclosed; MORSECORP's FCA settlement
      involved a negative-142 actual NIST score self-reported as 104. The risk
      is not that Amca is non-compliant—it is that the compliance posture is
      not independently verifiable from outside. Any investor writing a term
      sheet should require disclosure of ITAR compliance audit status, SPRS
      scores, and CMMC phase plans for each acquired entity as a condition
      precedent.
    claimRefs:
      - CR001
      - CR008
      - CR035
      - CR039

  - calloutType: insight
    title: Structural labor and material constraints are external, not company-specific
    body: >-
      Two of Amca's material risks—the skilled-machinist shortage and titanium
      supply dependency—are industry-wide structural constraints that affect all
      aerospace component manufacturers equally. Amca's rollup strategy, if
      executed well, may actually provide competitive advantage here: consolidated
      purchasing scale for materials procurement and the ability to redeploy
      workforce across factories offer a natural hedge that a single-facility
      competitor cannot replicate. The thesis-supportive read of these risks is
      that they worsen the competitive position of undercapitalized legacy shops,
      which is exactly the fragmentation that Amca is exploiting. The adverse
      read is that Amca is scaling into these headwinds faster than its
      integration capabilities can absorb them.
    claimRefs:
      - CR022
      - CR027
      - CR030
      - CR041

