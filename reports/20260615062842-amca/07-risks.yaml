tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - rule / license / case
      - jurisdiction
      - status
      - likelihood for Amca
      - severity
      - mitigation
      - residual exposure
      - diligence path
    rows:
      - - ITAR / AECA compliance (22 C.F.R. parts 120-130)
        - U.S. federal (DDTC / State Dept)
        - Active mandatory requirement
        - Medium — multi-site acquisition creates harmonization gap
        - "Critical — GE precedent: $36M penalty + consent agreement"
        - Appoint ITAR compliance officer per acquired facility; unified technical data access controls
        - High — undisclosed compliance posture across 6 factories
        - Request ITAR audit reports and DDTC registration status for each acquired entity
      - - CMMC Level 2 (DFARS 252.204-7021)
        - U.S. DoD / DFARS
        - Phase 1 active Nov 2025; Phase 2 mandatory from Nov 2026
        - Medium-High — CMMC assessment bottleneck; 6-12 months to certify
        - High — ineligible for DoD contract award if non-compliant
        - Begin C3PAO assessment engagement immediately; scope CUI boundaries per factory
        - High — no public CMMC readiness statement from Amca
        - Confirm SPRS score and C3PAO engagement timeline for each DoD-facing facility
      - - AS9100D / NADCAP certification (post-acquisition maintenance)
        - IAQG / NADCAP Performance Review Institute
        - Mandatory for aerospace manufacturing; continuous surveillance audits required
        - Medium — acquiring new shops increases audit surface; lapsed cert = customer disqualification
        - High — lost AS9100D at any factory = Boeing/Lockheed disqualification
        - Maintain per-facility quality management; track expiration and audit calendars
        - Medium — each acquired shop must independently maintain certification
        - Request current AS9100D/NADCAP certificates and most recent audit findings for each site
      - - False Claims Act / DFARS cybersecurity (31 U.S.C. § 3729 et seq.)
        - U.S. DoJ / Civil Division
        - Active enforcement; MORSECORP precedent ($4.6M, May 2026)
        - Medium — MORSECORP failure was post-acquisition misrepresentation of NIST score
        - High — misrepresented NIST/CMMC score while accepting DoD payments = fraud exposure
        - Accurate SPRS self-assessment; independent third-party cybersecurity review per site
        - High — if any acquired facility continues billing while non-compliant
        - Obtain SPRS score history and independent cybersecurity assessments for each acquired entity
      - - Export Administration Regulations (EAR / BIS Entity List)
        - U.S. Commerce / BIS
        - Active; BIS Entity List expanded 2024-2026
        - Low-Medium — primary risk is foreign national deemed-export rule and sub-tier foreign sourcing
        - Medium — potential contract loss and export license denial
        - Continuous restricted-party screening in procurement and hiring workflows
        - Low-Medium — no known BIS actions against Amca or its acquisitions
        - Confirm restricted-party screening procedures and foreign-national access controls
    notes: >-
      Severity and likelihood assessments are based on public regulatory filings, DDTC/BIS
      enforcement precedents (GE 2026, MORSECORP 2026), and CMMC rulemaking. No Amca-specific
      enforcement actions or litigation have been identified in public records as of the run date.
    enumerationScope:
      coverage: partial
      basis: >-
        Coverage limited to five publicly identifiable regulatory obligations for
        U.S. defense component manufacturers; additional export-control, FAA, OSHA,
        and environmental requirements exist but are not individually enumerated here.
