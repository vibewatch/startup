  - id: TR005
    title: Mitigation and kill-criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - ITAR / CMMC non-compliance
        - SPRS score status; DDTC registration currency; CMMC Phase 2 contract clause inclusion
        - Any DoD solicitation with DFARS 252.204-7021 for which Amca lacks certified status; or DDTC enforcement action
        - Pause new DoD contract commitments; engage compliance counsel; disclose to investors
      - - Boeing production rate cut affecting Amca-supplied programs
        - Boeing quarterly delivery guidance; 737 MAX / 787 monthly production rates
        - Boeing 737 MAX production drops below 38/month or 787 drops below 8/month for two consecutive quarters
        - Model 20-30% revenue impact; assess alternative prime customer diversification timeline
      - - Titanium sponge supply disruption
        - China-Japan export controls on titanium mill products; COMEX aerospace titanium premium
        - Spot price spike >40% quarter-over-quarter or verified export control on Grade-5 Ti feedstock
        - Activate inventory buffer; re-qualify alternative alloys; report material impact
      - - Series C financing unavailable at acceptable terms
        - Monthly burn rate vs. cash on hand; public VC funding sentiment; comparable hardware Series C pricing
        - Cash runway falls below 12 months with no term sheet signed
        - Pursue strategic equity from defense prime; pursue DoD customer pre-payment / long-term contract
      - - Quality escape causing customer containment action
        - Customer-issued corrective action requests; first-article inspection failure rates; NCR rate per factory
        - Containment action from Boeing, Lockheed, or Raytheon on any Amca factory
        - "THESIS-BREAK — suspend new acquisition targets; redirect capital to remediation; reassess integration timeline"
    notes: >-
      Thresholds are illustrative monitoring indicators derived from public evidence; actual
      operational metrics and internal dashboards are not disclosed by Amca. Kill criteria should
      be revisited quarterly by any investor with board representation.
