  - id: supply-chain-labor-material-risk
    title: Supply chain, labor, and material risk
    body: >-
      Two structural bottlenecks—titanium supply and skilled labor—threaten to
      constrain Amca's growth trajectory independently of its business execution.
      On titanium: China's share of global titanium metal production surged from
      approximately 40 percent in 2019 to over 75 percent in 2025, and the
      United States has been entirely import-dependent for titanium sponge since
      the closure of the Henderson, Nevada facility in 2020. Project Blue warns
      that China could weaponize titanium exports to delay Boeing, Airbus, and
      U.S. defense program production—as it demonstrated with antimony, where
      export restrictions caused a 97 percent drop in shipments and a 200 percent
      price spike. Defense investment firm nai500 characterizes titanium as
      constituting up to 40 percent of an F-15's structural weight; supply
      disruption would directly impact aerospace component manufacturing across
      avionics, hydraulics, and structural systems. DoD awarded IperionX $47.1
      million in 2025 to help rebuild domestic titanium capacity, but analysts
      do not expect domestic supply to reach meaningful aerospace-grade scale
      before 2027-2028. On labor: MIE Solutions 2026 data projects 1.5 to
      2 million unfilled U.S. manufacturing roles by the early 2030s, with
      aerospace absorbing a disproportionate share. MADICORP's 2026 workforce
      analysis notes the aerospace and defense attrition rate sits near 15
      percent—more than double the U.S. industrial average—driven by retirements
      of experienced machinists, inadequate vocational pipeline investment, and
      the geographic mismatch between new capacity announcements and qualified
      talent pools. Post-M&A workforce integration is cited as one of the hardest
      execution problems in the sector: acquirers lose institutional knowledge
      when legacy shop employees exit during ownership transitions, and aerospace
      certification requirements make replacement slower than in general
      manufacturing. Amca's multi-factory acquisition pace means labor attrition
      risk is multiplied across all acquired sites simultaneously.
