        - label: "Stage 2: Supplier pre-qualification (AS9100, ITAR, CMMC certification obtained)"
          value: 60
        - label: "Stage 3: Program qualification (approved vendor list entry, DCMA/OEM approval)"
          value: 25
        - label: "Stage 4: Production award (long-term purchase order / supply agreement)"
          value: 12
        - label: "Stage 5: Sustaining supplier (repeat awards, platform expansion)"
