  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An analyst report specifically scoping the US mission-critical precision-machined
        aerospace and defense component market (excluding interiors, MRO consumables, complete
        engines, and composite aerostructures) with a verified revenue figure.
      whyItMatters: >-
        Without a boundary-aligned market size, the SAM estimate remains a derivation with
        low confidence rather than a defensible investment-grade figure.
      diligencePath: >-
        Commission a custom segment study from Mordor Intelligence, Grand View Research, or
        a defense-focused boutique analyst (e.g., Teal Group) scoped to NAICS 3364 sub-categories
        matching Amca's product lines.
      relatedQuestionRefs:
        - QM014
        - QM015

    - type: enumeration-incomplete
      severity: material
      topic: buyer-segmentation
      missingEvidence: >-
        Verified customer concentration data (top-3 customer revenue share) and contract
        structure (long-term supply agreements vs. spot orders) for Amca's current book of business.
      whyItMatters: >-
        Without customer concentration data, it is impossible to assess whether Amca's TAM
        narrative is matched by a diversified revenue base or is dependent on one or two
        anchor relationships.
      diligencePath: >-
        Request customer revenue schedule from data room; verify against invoices and purchase
        order archive.
      relatedQuestionRefs:
        - QM003
      relatedTableRefs:
        - TM003

    - type: missing-source
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        NAICS 3364 annual revenue and establishment count from the US Census Bureau
        (Economic Census or Annual Survey of Manufactures) broken down by 6-digit NAICS
        sub-code matching Amca's product lines.
      whyItMatters: >-
        Census data would provide a primary-source bottom-up size estimate independent of
        commercial market reports; the interactive Census profile returned no usable content
        during this research run.
      diligencePath: >-
        Access Census Business Builder or Annual Survey of Manufactures directly via
        Census API or industry analyst with NAICS access.
