  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - driver or constraint
      - direction
      - timing
      - implication for Amca
      - diligence ask
    rows:
      - - Record defense backlogs and budget growth ($839.2B FY2026; +13.4% YoY)
        - driver
        - current and sustained
        - Expands total addressable budget for certified component suppliers; higher throughput demands
        - Verify how much of procurement budget flows to Tier 2/3 component contracts vs. prime-level work
      - - Loss of domestic sole/single-source suppliers (7% increase 2025–2026)
        - driver
        - ongoing structural
        - Creates procurement gaps primes cannot fill from existing supply base; Amca's acquisitions fill gap
        - Confirm which specific component categories have most acute sole-source concentration
      - - DPA incentives and NDAA Section 833 reshoring mandates
        - driver
        - short- to medium-term
        - Regulatory tailwind for domestic qualified supplier investment; offsets capital cost of modernization
        - Review eligibility for DPA Title III designation and Office of Strategic Capital loan access
      - - Commercial aircraft backlog of 15,461 units (11+ years at current build rates)
        - driver
        - medium-term (multi-year production campaigns)
        - Sustained OEM component demand regardless of short-term macroeconomic swings; long purchase horizons
        - Assess whether Amca's current certifications cover the dominant narrow-body platforms (737/A320)
      - - Qualification cycle time of 12–36 months for new or modernized suppliers
        - constraint
        - structural
        - New entrants cannot short-circuit the qualification timeline; Amca's inherited qualifications are a moat
        - Confirm that acquired shop qualifications remain valid post-acquisition and post-facility upgrade
      - - Defense manufacturing labor gap (~800K unfilled positions nationally)
        - constraint
        - current
        - Limits throughput expansion even with adequate capital; increases wage inflation risk
        - Assess Amca's employee count, turnover, and compensation strategy relative to regional labor markets
    notes: >-
      Timing designations reflect the likely horizon at which each driver/constraint affects
      financial performance: current = within 12 months; short-term = 1–2 years;
      medium-term = 2–5 years; structural = persistent multi-year condition. Direction ratings
