    approximationNotes: >-
      Stage values are illustrative attrition estimates based on NDIA, Astral Air Parts,
      and Primus Aerospace descriptions of qualification requirements; no published data
      tracks these exact conversion rates. Values represent relative attrition, not absolute
      supplier counts.
