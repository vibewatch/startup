chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Amca competes in the U.S. mission-critical aerospace and defense precision component
    manufacturing market—a structurally supply-constrained segment bounded by certified
    machined parts and critical sub-systems (hydraulics, power distribution, avionics
    housings) that sit between commodity hardware and complete platform systems. Independent
    market sizing estimates span $11 billion to $429 billion depending on boundary assumptions,
    with the narrowest machined-component lens suggesting a US SAM of roughly $28–42 billion.
    Converging evidence from NDIA, GAO, Deloitte, PwC, and McKinsey confirms a structural
    demand case: the supplier base is contracting, production backlogs are at historic highs,
    and DoD has elevated industrial-base resilience to a national security priority—creating
    the supply gap Amca's acquisition-and-modernization model is designed to fill.
sections:
  - id: market-boundary-and-scope
    title: Market boundary, definition, and status-quo substitutes
    body: >-
      Amca's addressable market begins with a specific structural failure inside the US
      aerospace and defense supply chain: the layer of precision-manufactured, certified
      components that must meet airworthiness and defense qualification standards is shrinking
      as legacy suppliers age out, consolidate, or exit. The included spend in Amca's market
      covers hydraulic assemblies, electrical power distribution systems, avionics housings,
      precision-machined structural metal parts, and certified sub-assemblies that require
      both manufacturing process control and engineering qualification for use on
      flight-critical and mission-critical platforms. These components share three structural
      characteristics separating them from commodity hardware: they require dedicated
      certification (AS9100, ITAR, program-specific approved vendor list qualification),
      they typically serve both new-production and MRO demand streams simultaneously,
      and they are difficult to substitute quickly because requalification with a new
      supplier typically takes 12 to 36 months.

      Excluded from the core addressable market are complete aircraft platforms and weapons
      systems, software-defined avionics layers, commodity hardware (individual fasteners,
      generic connectors, standard bearings), pure MRO service work without manufacturing
      content, and general-purpose industrial machining that lacks AS9100 or equivalent
      certification. Adjacent opportunities that expand the total opportunity include MRO
      aftermarket demand for the same component categories (where production customers
      create a recurring repair stream), prototyping and qualification testing services,
      and logistics or kitting services for prime contractors.

      The status-quo substitutes Amca displaces or acquires are primarily family-owned
      precision machining shops with aging ownership and limited capital for modernization—the
      suppliers explicitly described in NDIA, GAO, and McKinsey analysis as the fragile
      sub-tier layer most at risk of exit. Prime contractors historically absorbed some
      of this work in-house; Boeing and Airbus both repatriated aerostructure production
      formerly outsourced to Spirit AeroSystems in 2025, but that insourcing move is
      platform-structure-specific and does not cover the broader precision component
      categories Amca targets. Offshore suppliers in allied nations remain a substitute
      for non-ITAR components but face increasing regulatory friction under NDAA foreign
      sourcing rules and the supply-chain illumination requirements in NDAA FY2026 Section 833.
      AS9100 certification covers approximately 45% of US precision machining shops, illustrating
      that the eligible supplier pool is finite and that new certified capacity is not trivially
      added.
