    title: Product architecture stack — Amca component layers from quality foundation to customer interface
    type: stack
    layout: standard
    summary: >-
      Amca's product architecture layers from quality and regulatory foundation through acquired factory
      capabilities and the RAPID platform to the customer-facing engineering interface.
