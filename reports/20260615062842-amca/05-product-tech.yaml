  - id: TE003
    title: Technology and operating architecture — RAPID layers and dependencies
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Risk
    rows:
      - - RAPID Design Layer (AI/Physics Sim)
        - Converts customer requirements into manufacturable part designs via AI-enabled simulation
        - Requires accurate physics models and qualified-part geometry library; cloud infrastructure
        - Library accuracy degrades if acquired factories upload inconsistent historical data
      - - RAPID Prototyping Layer (El Segundo)
        - Houses traditional + additive manufacturing for low-volume prototype builds
        - Depends on El Segundo facility capacity; skilled AM and CNC technicians on site
        - Single-point facility; capacity constraints limit parallelism for multiple simultaneous programs
      - - RAPID Qualification Layer (DO-/MIL-STD)
        - In-house DO-160, MIL-STD testing with embedded test automation fixtures
        - Testing infrastructure must stay current with evolving DO/MIL standard revisions
        - Standard revisions require re-validation of test fixtures; unexpected revision timing risk
      - - RAPID Documentation Layer (AS9100 Digital Thread)
        - Generates and manages AS9100D-compliant documentation and audit trail throughout workflow
        - Requires all engineers and factory operators to use RAPID as system of record
        - Change management across newly acquired legacy factories; inconsistent adoption is a key risk
      - - RAPID Manufacturing Execution Layer
        - Orchestrates production scheduling, work instructions, and quality monitoring across factories
        - Requires integration with each factory's existing ERP and machine tooling systems
        - Integration of six heterogeneous legacy ERP environments is a known complexity and timeline risk
      - - AS9100D QMS (All Factories)
        - Mandatory quality management system certification covering all production sites
        - Annual surveillance audits by accredited registrar; process change documentation
        - Rapid process changes via RAPID trigger re-audit requirements; tempo mismatch
      - - NADCAP Special Processes (Not Disclosed)
        - Process-level accreditation for heat treat, NDT, chemical processing, welding where applicable
        - OEM flow-down clauses (Boeing BAC, Airbus ABD, Lockheed Q-01) mandate NADCAP for applicable processes
        - Amca has not disclosed factory-level NADCAP status; gap with OEM requirements is unverified
      - - Customer OEM Relationship Layer
        - Approved supplier status with Boeing, Lockheed, Airbus, RTX; Electrocube's top-20 Boeing ranking
        - Maintains as-built traceability, on-time delivery, and quality records per customer requirements
        - Ownership transfer of acquired entities requires re-approval in some OEM supplier qualification systems
    notes: >-
      Architecture inferred from Amca official who-we-are page, press releases, and industry standards
      (AS9100D: IAQG; NADCAP: precisionam.com, rapidcision.com, valencesurfacetech.com).
      RAPID internal architecture details are proprietary and not publicly disclosed.
