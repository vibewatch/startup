        - label: RAPID Platform (Proprietary)
          modules:
            - Design layer (AI + physics-based simulation, manufacturability feedback)
            - Prototyping layer (El Segundo; traditional + additive; DO-/MIL-STD testing)
            - Documentation layer (AS9100 digital thread; audit trail automation)
