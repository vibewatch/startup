  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NADCAP-gap
      missingEvidence: >-
        Factory-by-factory NADCAP accreditation certificates confirming which special processes
        (heat treat, NDT, chemical processing, welding) are accredited at each of the six acquired
        production facilities and the El Segundo site.
      whyItMatters: >-
        OEM flow-down clauses from Boeing, Airbus, Lockheed, and RTX mandate NADCAP for special
        processes. Without public disclosure, it is not possible to verify compliance with customer
        requirements or to assess risk of approved-supplier status loss.
      diligencePath: >-
        Request factory-level NADCAP certificates from Amca management or search eAuditNet
        (the PRI public NADCAP database) by facility name to verify current accreditation status
        and process scope for each site.
      relatedQuestionRefs:
        - QE014

    - type: private-evidence-only
      severity: material
      topic: RAPID-lead-time-claim
      missingEvidence: >-
        An independent audit, named customer case study, or published methodology supporting the
        claim that RAPID delivers 67 percent faster cycle times versus industry benchmarks.
      whyItMatters: >-
        The 67% figure is the central differentiation claim used to justify the $1 billion-plus
        valuation and the software moat thesis. Without independent validation, the claim cannot
        be distinguished from marketing language.
      diligencePath: >-
        Request customer references willing to confirm timeline improvements, ask Amca to disclose
        the benchmark methodology (what baseline industry timeline was used, which programs were
        measured, and how the measurement was conducted).
      relatedQuestionRefs:
        - QE023

    - type: missing-source
      severity: material
      topic: RAPID-platform
      missingEvidence: >-
        Independent technical review, architecture documentation, or third-party source confirming
        how RAPID handles AS9102 FAI documentation, multi-factory data schema harmonization, and
        legacy ERP integration at each acquired site.
      whyItMatters: >-
        The data flywheel thesis depends on consistent, high-quality data flowing from all six
        factories into a unified RAPID schema. Without evidence of successful integration at even
        one factory, the flywheel is an aspiration rather than a current capability.
      diligencePath: >-
        Request a RAPID platform demo, architecture overview document, or customer references who
        have experienced the full design-to-production workflow end-to-end.
      relatedQuestionRefs:
        - QE016

    - type: missing-source
      severity: minor
      topic: RAPID-developer-surface
      missingEvidence: >-
        Any developer-facing public API, SDK, or open-source component associated with RAPID or
        Amca's engineering software stack, which would independently confirm the platform's
        architectural approach.
      whyItMatters: >-
        Without any public developer surface, RAPID's claimed AI and simulation capabilities
        cannot be independently evaluated. The absence is expected for a proprietary industrial
        platform but limits technical diligence options.
      diligencePath: >-
        Check if Amca engineers publish technical content on GitHub, arXiv, or conference
        proceedings. Monitor job postings for technology stack signals (specific tools, frameworks,
        cloud platforms). Request an NDA technical briefing.
      relatedQuestionRefs:
        - QE018
        - QE022

    - type: private-evidence-only
      severity: material
      topic: integration-risk
      missingEvidence: >-
        Detailed integration status reports confirming how many of the six factories have been
        successfully connected to RAPID for work instruction generation, quality monitoring, and
        documentation, and what the actual integration timeline and cost have been.
      whyItMatters: >-
        The Series B investment thesis depends on RAPID being deployable at scale across the full
        factory network. If ERP and process integration is slower or more expensive than planned,
        the return on the $300 million raise is impaired.
      diligencePath: >-
        Request current RAPID deployment status by factory, integration costs incurred to date,
        and timeline to full network deployment from Amca's management team.
      relatedQuestionRefs:
        - QE012

