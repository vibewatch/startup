callouts:
  - calloutType: strength
    title: Electrocube's Boeing top-20 supplier status is the strongest third-party quality anchor
    body: >-
      Among all six acquired businesses, Electrocube provides the only third-party-verified quality
      signal: a top-20 ranking among Boeing's 5,000-plus direct suppliers by quality, on-time
      delivery, and responsiveness. This decades-built credentialing is not replicable on a software
      timeline and establishes Amca's power electronics division as the strongest moat anchor.
    claimRefs:
      - CE015
      - CE016
      - CE017
  - calloutType: risk
    title: RAPID lead-time claim is company-asserted and has not been independently audited
    body: >-
      The 67 percent lead-time reduction attributed to RAPID is the central differentiation claim
      and has not been verified by any named third party, published under a methodology, or
      corroborated by customer case studies. Until independently audited, this figure should be
      treated as a company-claimed marketing metric. Investors relying on it as a moat proof point
      are exposed to downgrade risk if integration timelines prove longer than stated.
    claimRefs:
      - CE011
      - CE033
      - CE034
  - calloutType: risk
    title: NADCAP accreditation gap is a material unverified compliance exposure
    body: >-
      Amca has not publicly disclosed NADCAP accreditation status for any acquired factory. Boeing
      BAC specifications, Airbus ABD standards, and Lockheed Martin Q-01 flow-down clauses require
      NADCAP for special processes such as heat treatment, NDT, and chemical processing. Until Amca
      confirms factory-level NADCAP status, it is not possible to verify that all OEM flow-down
      requirements are currently being met across the factory network.
    claimRefs:
      - CE028
      - CE029
      - CE030
  - calloutType: insight
    title: The physical asset base—factory approvals and tacit expertise—is the harder moat layer
    body: >-
      Amca's most defensible competitive position is not the RAPID software platform but the
      physical layer beneath it: AS9100D-certified factories, decades-built OEM supplier approvals,
      and tacit manufacturing expertise (particularly Payne Magnetics' RF magnetics know-how).
      These assets cannot be replicated from software alone and took the acquired companies between
      40 and 65 years to accumulate. RAPID amplifies this base but does not substitute for it.
    claimRefs:
      - CE015
      - CE018
      - CE019
      - CE039

