  - id: TE002
    title: Workflow / use-case table — RAPID platform stages and benefits
    columns:
      - Workflow Stage
      - Legacy / Pre-RAPID Approach
      - Amca / RAPID Solution
      - Stated Benefit
      - Known Limitation
    rows:
      - - Requirements Intake & Design Engineering
        - Separate CAD/CAM tools, manual design reviews, weeks of iteration
        - AI-enabled physics-based simulation; fast engineering feedback; manufacturability analysis
        - Parallelized iteration reduces design cycle from months to weeks (company claim)
        - No independent benchmark for the speed gain; methodology not published
      - - Rapid Prototyping
        - Outsourced prototype vendors; multi-week lead times; vendor coordination overhead
        - In-house El Segundo facility with traditional + additive manufacturing; same-team iteration
        - Eliminates inter-vendor handoffs; company states prototyping is software-powered
        - Capacity limited to El Segundo; additive manufacturing suitable for prototype stage only
      - - Qualification Testing
        - Third-party test labs; scheduling delays; multi-month FAI cycles typical
        - Embedded DO- and MIL-STD infrastructure; test automation fixtures; in-house campaign control
        - Tighter test campaign control; reduced reliance on outside vendors (company claim)
        - FAI timelines of 3–12 months are structurally driven by regulatory requirements, not just logistics
      - - Technical Documentation
        - Manual documentation; separated from manufacturing; audit prep bottleneck
        - Digital compliance tracking within RAPID; AS9100 records generated throughout workflow
        - Automated audit trail; faster regulator and OEM review preparation
        - Requires consistent data entry across all six factories; ERP integration risk at scale
      - - Scaled Factory Production
        - Long transfer packages; re-qualification each time a process changes supplier
        - Low-volume validation at El Segundo precedes transfer to flagship factory
        - Validated process package reduces rework at production factory
        - Any RAPID-driven process change at the factory may trigger re-FAI; approval cycle restarts
    notes: >-
      Based on Amca official website (who-we-are page) and press release descriptions of RAPID.
      Stated benefits are company claims; the 67% cycle-time reduction has not been independently audited.
      Limitations derived from industry standards (AS9102 FAI requirements, AS9100D process change control).
