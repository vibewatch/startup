company:
  name: Amca
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Amca's product portfolio is anchored in three legacy-sourced segments—avionics
    electromechanical switches (Electro-Mech), hydraulic pressure/fluid components (Cal-Draulics
    and ACPI), and power electronics (Electrocube, Payne Magnetics, BC Systems)—all fed into a
    proprietary integrated platform called RAPID that spans design, prototyping, DO-/MIL-STD
    qualification testing, and certified AS9100D manufacturing. Public evidence confirms the 67%
    lead-time reduction claim as a company assertion, platform coverage across 20+ aircraft
    platforms including the F-35, and top-20 Boeing supplier status for Electrocube; however, no
    independent audit of RAPID's performance, no public NADCAP accreditation disclosures, and no
    developer-facing surface exist, leaving the software moat thesis as a company claim rather than
    a verified competitive fact.

sections:
  - id: product-catalog-and-factory-footprint
    title: Product catalog, product classes, and acquired factory footprint
    body: >-
      Amca's public catalog reveals that the company's commercial product surface is currently
      dominated by avionics electromechanical switches inherited from its first acquisition,
      Electro-Mech Components of South El Monte, California. The catalog lists pushbutton switches
      in at least six series (Series 20, 2100, 2600, S520, and 3000), multi-illuminated pushbutton
      assemblies (SW44267, Series 600/800, Series 644-2100), three potentiometer models (SW44418,
      SW44175, SW44109), and two interlocking switch assembly families (Series 400, Series 500). The
      company states its 20-plus-person engineering team can customize these base designs for
      customer-specific requirements. Alongside this catalog, Amca's hydraulics segment, built
      through Cal-Draulics and Aerospace Control Products Inc. (ACPI, acquired December 2025),
      supplies flight-critical hydraulic pressure switches and liquid-level switches used on the
      Airbus A320 and Boeing 737 MAX, products ACPI has manufactured since its 1979 founding. The
      power electronics segment—assembled through Electrocube (acquired February 2026), Payne
      Magnetics (February 2026), and BC Systems—adds flight-critical foil-wound transformers,
      transformer rectifier units, capacitors, EMI filters, and high-performance RF magnetics
      components across Boeing commercial, F-16, F-18, and classified defense platforms. The
      products page states components can be found aboard 20-plus aircraft platforms spanning
      commercial widebody and narrowbody jets, military transports, rotorcraft, and fighters.
      Electrocube ranks in the top 20 of Boeing's 5,000-plus direct suppliers by quality, on-time
      delivery, and responsiveness—a third-party confirmation of product quality that no other
      Amca-owned entity has matched publicly.
