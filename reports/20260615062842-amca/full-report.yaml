      - number: '6.3'
        title: Procurement path, qualification dynamics, and structural retention
        blocks:
          - type: paragraph
            body: >-
              In aerospace, a supplier relationship is not a simple vendor contract. Before a component can enter
              production, the supplier must obtain AS9100D quality management certification, complete a First Article
              Inspection (FAI) under Boeing's AS9102-aligned program, pass NADCAP accreditation for any special
              processes, and earn a spot on the OEM's qualified supplier list. Boeing's official supplier portal
              documents these requirements, and the Lockheed Martin supplier program operates a similarly structured
              qualification gate. For defense-standard parts, the Defense Logistics Agency QPL process adds 6 to 12-plus
              months from initial application to listing. Industry research from QSTRAT and KDM Associates confirms that
              Tier-2 supplier contracts are typically 1 to 5 years in duration, tied to program lifecycles rather than
              annual renewals, and that established suppliers see 80-to-90-percent-plus contract renewal rates driven by
              switching friction. The forthcoming IA9100 standard update — expected in late 2026 — will require all
              certified suppliers to implement real-time statistical process control, enhanced predictive quality
              systems, and deeper sub-tier oversight, creating a transition compliance obligation for Amca's six
              factories. Amca's customer acquisition strategy anticipates these barriers: both the ACPI and Electrocube
              product pages explicitly offer "no NRE charges" and frame the inherited qualification history as the value
              proposition, positioning the sub-brands as second-source alternatives for customers already experiencing
              lead-time or quality problems. This model reduces initial friction because the components are already
              approved for the target platform and program — but the structural integrity of those approvals under
              Amca's new ownership is an unverified diligence question. No NRR, GRR, or churn data has been published;
              the retention thesis rests on the inherited switching costs and industrial logic rather than Amca-specific
              cohort evidence.
