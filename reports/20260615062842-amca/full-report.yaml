      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The structural moat available to any component supplier in this market flows primarily from qualification
              lock-in: once a part number is approved on a specific platform by an FAA or DoD qualification authority,
              switching suppliers requires requalification, which costs millions of dollars and 12–36 months of program
              time. This creates durable revenue visibility for the current supplier on any given platform but creates a
              reciprocal barrier for Amca as it seeks to win new program positions. The dual nature of this dynamic—
              defensive for existing positions, offensive challenge for new wins—is the central strategic tension in
              Amca's growth thesis.

              The commoditization risk is real but concentrated. Precision tolerances, special materials (titanium,
              Inconel, beryllium copper), and program-specific geometry requirements prevent commodity-style competitive
              bidding on complex critical components. However, simpler component families within Amca's portfolio could
              face increasing pricing pressure as digital manufacturing (5-axis CNC automation, inspection automation)
              diffuses to more shops and narrows the capability gap. Amca's best response is to focus acquisition
              targets and organic investment on high-complexity, low-volume components where qualification lock-in and
              engineering support value are highest.

              Adverse evidence is meaningful. First, TransDigm's experience with Congressional scrutiny over sole-source
              pricing illustrates how aggressively exercising lock-in creates legislative and regulatory risk—a lesson
              for any company that builds a model on qualification-derived pricing power. Second, Albany Engineered
              Composites' zero-margin write-down on the CH-53K program in 2025 illustrates the execution risk of
              fixed-price development contracts on new platforms. Third, Ducommun's acknowledged destocking headwinds in
              2026 show that commercial aerospace component demand can be delayed by supply-chain dynamics outside the
              supplier's control. Fourth, the Boeing-Spirit acquisition is an extreme example of OEM bargaining power: a
              prime can, under enough supply-chain stress, reverse decades of outsourcing. Amca's multi-customer
              diversification (seven named prime customers) and multi-platform exposure reduce but do not eliminate this
              risk.

              For diligence, the key questions are: (1) on which specific platforms and part numbers does Amca hold
              approved supplier status today; (2) what is the re-qualification timeline and cost if a customer changes
              platform-generation; (3) what fraction of Amca's existing revenue is sole-source versus competitively bid;
              and (4) how many of the legacy shops Amca has acquired also held approvals at TransDigm or HEICO
              subsidiaries, creating potential conflict of interest in future acquisitions.
