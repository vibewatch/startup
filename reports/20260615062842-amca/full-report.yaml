      - number: '5.4'
        title: Quality, compliance, and adverse evidence — bottlenecks and integration risks
        blocks:
          - type: paragraph
            body: >-
              Amca's quality and compliance backbone is AS9100D certification across all six flagship factories. The
              IAQG AS9100 standard is the aerospace industry's mandatory QMS baseline, covering risk management,
              configuration management, product safety, counterfeit-parts prevention, and regulatory compliance. It is a
              necessary but not sufficient condition: for special processes such as heat treatment, chemical processing,
              welding, and nondestructive testing, NADCAP (National Aerospace and Defense Contractors Accreditation
              Program) accreditation is separately required. Amca has not publicly disclosed NADCAP accreditation status
              for any acquired factory, which is a material diligence gap given that customer flow-down clauses from
              Boeing, Airbus, Lockheed Martin, and RTX mandate NADCAP on relevant special processes. Before a part can
              enter full production, it must pass First Article Inspection (FAI) under AS9102, generating part
              accountability, product accountability, and characteristic accountability forms. FAI failures require root
              cause analysis, corrective actions, and retesting, with aerospace quality experts citing typical approval
              timelines of 3-to-12 months for complex components. Any process change introduced by RAPID in an acquired
              factory—new tooling paths, revised work instructions, updated scheduling—can trigger re-qualification and
              a new FAI cycle, creating a structural tension between the speed-of- iteration promise of RAPID and the
              regulatory slowness of aerospace certification. Additionally, integrating legacy ERP and
              quality-management systems across six independently-acquired factories is a known source of schedule and
              cost overruns in aerospace roll-ups; the aicerts.ai post explicitly notes that Dealroom analysts warn this
              challenge is "consistently underestimated." Together, these factors set a boundary around how fast RAPID
              can deliver its stated benefits in the legacy-factory context.
