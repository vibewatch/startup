      - number: '8.4'
        title: Adverse evidence, execution de-rating risk, and multiple compression signals
        blocks:
          - type: paragraph
            body: >-
              Several categories of adverse evidence constrain how confidently the $1B+ valuation can be accepted at
              face value. First, and most fundamentally, Amca has never published audited financial statements,
              disclosed gross or EBITDA margins, provided customer-concentration data, or given any time-series revenue
              figure with a denominator—the only public financial signal is the one-line tenfold growth claim across an
              unspecified period. This opacity is unusual even by the standards of pre-IPO venture-backed companies;
              Loar Holdings, for comparison, published full audited financials from its founding and disclosed detailed
              quarterly results ahead of its April 2024 IPO. The absence of disclosed financials means any valuation
              anchor is purely an inferred multiple on an estimated revenue range, not an observable price-to-value
              relationship.

              Second, public market peers are themselves trading at elevated multiples by historical standards. Sahm
              Capital's March 2026 analysis of Loar Holdings notes that its 91.9x P/E ratio sits well above both the
              U.S. Aerospace & Defense group at 43.8x and the analyst consensus fair P/E of 28.7x, and warns that
              integration risk from recent acquisitions (LMB Fans & Motors and Harper Engineering) could compress the
              multiple if organic growth disappoints. If Loar's multiple compresses from 37x to 20x EV/EBITDA, Amca's
              entry multiple—if the business were actually at public-comparable scale—would look meaningfully less
              attractive. Multiple compression in the A&D component sector would directly and negatively re-rate Amca's
              exit value.

              Third, the venture sector broadly is experiencing heightened scrutiny of capital-intensive hardware
              companies. The defense-tech cohort of Anduril and Shield AI commands software- like multiples because
              those businesses are primarily selling AI and autonomy software on top of hardware platforms. Amca is
              primarily a contract manufacturer of precision components—a fundamentally different margin and growth
              profile. Applying Anduril-style 28x revenue multiples to Amca would be analytically indefensible; the
              relevant comp universe is the public A&D component manufacturer peer group.

              Fourth, the roll-up execution risk is undisclosed. Five acquisitions in eighteen months across different
              geographies, product lines, and workforce cultures—hydraulics, power electronics, power magnetics,
              avionics components—creates an integration complexity that has historically caused margin dilution and
              revenue shortfalls at other hardware roll-ups. TransDigm's success at roll-up integration over two decades
              is a data point in favor of the model, but TransDigm had a decade of operating experience and a codified
              playbook before achieving its current margins. Amca is executing the same strategy in a fraction of the
              time without publicly documented integration metrics.

              The adverse evidence does not mean the valuation is wrong—it means it is currently unverifiable. The
              single most actionable adverse data point is that the $1B+ mark was set in a venture round where investors
              had access to private financials; those same financials have not been shared publicly. Until they are, or
              until an independent data source corroborates the revenue and margin profile, the correct diligence
              posture is to treat the valuation as a venture mark rather than an independently underwritten enterprise
              value.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
