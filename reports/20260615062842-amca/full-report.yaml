      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The market opportunity for mission-critical aerospace and defense component manufacturing is driven by
              structural demand factors broadly confirmed across multiple independent sources—but constrained by
              qualification barriers, labor shortages, and capital requirements that limit how quickly any supplier can
              expand capacity.

              The most important demand driver is the conjunction of record defense budgets and record commercial
              production backlogs. PwC's 2026 report documents that the aerospace and defense industry crossed $1
              trillion in annual revenue for the first time in 2025, with the defense backlog growing more than 50% in
              three years. The combined Boeing and Airbus commercial backlog reached 15,461 aircraft by end-2025,
              representing over 11 years of production at current rates. Deloitte's 2026 outlook states that supply
              chain fragility is expected to intensify through at least 2027 as defense primes aim to increase output of
              missiles, munitions, drones, and aircraft, stressing every tier of the supplier base. AlixPartners
              characterizes the sector as facing a "once-in-a-generation demand surge."

              The second structural driver is the accelerating loss of small and mid-size suppliers. NDIA's Vital Signs
              2026 survey documented a 7% increase in loss of domestic sole/single-source suppliers and an 11% increase
              in loss of international sole/single-source suppliers since the 2025 report. McKinsey cites a more than
              40% decline in the number of small businesses in the defense industrial base over the prior decade and the
              risk of losing 15,000 more suppliers in the coming decade. GAO-25-107283 confirmed that DoD's supply chain
              of over 200,000 suppliers has "three or fewer" qualified domestic suppliers in many critical component
              categories. These gaps cannot be filled by greenfield entrants on a short timeline due to the 12–36-month
              qualification requirement.

              Government policy amplifies demand: the FY2026 legislation enables over $4.3 billion in Office of
              Strategic Capital credit for scaling critical suppliers; Defense Production Act incentives push domestic
              sourcing; and Congress approved NDAA FY2026 Section 833 waivers for supply chain illumination. US
              manufacturing technology orders surged 28.9% year-over-year through April 2026 per AMT, with NTMA survey
              respondents running at 69% positive business conditions. Reshoring activity is active, with 24% of NTMA
              member shops reporting increased reshoring over the prior six months.

              On the constraint side, supplier qualification cycles remain the primary adoption bottleneck. TD
              Securities' 2026 A&D conference identified an unfilled defense manufacturing labor gap of approximately
              800,000 workers and framed manufacturing capacity constraints as "a national security emergency." All NTMA
              survey respondents cited employee recruitment as a top challenge, and 60% of precision machining companies
              report skills gaps in CNC programming and 5-axis machining. Structural materials constraints persist:
              Astral Air Parts documents that lead times for titanium and nickel-based tubing remain significantly above
              pre-pandemic levels, and castings and forgings for engine components face multi-stage process queues
              requiring sustained multi-year investment to resolve. The GAO found the US has only one foundry capable of
              producing large titanium castings for key weapons systems, and that Chinese export restrictions on gallium
              and germanium directly impacted military-grade electronics supply chains. These constraints are barriers
              to entry for new suppliers and simultaneously create pricing power for credentialed, capacity-holding
              incumbents like the legacy shops Amca is acquiring.
