      - number: '3.2'
        title: Incumbent public competitor profiles
        blocks:
          - type: paragraph
            body: >-
              TransDigm Group is the largest direct framing comparator by revenue. Its FY2026 guidance calls for
              $9.85–$10.04 billion in net sales, representing approximately 12.6% year-over-year growth at midpoint. Q2
              FY2026 alone delivered $2.544 billion in revenue, up 18%, with EBITDA As Defined margins of 52.6%. The
              business model differs sharply from Amca's: TransDigm acquires sole-source, highly proprietary aircraft
              component businesses and then leverages qualification lock-in to sustain extreme pricing power. The
              company has faced sustained Congressional scrutiny—Senators Warren and Garamendi documented 401 unanswered
              cost and pricing data requests from the Defense Logistics Agency—illustrating the reputational and
              regulatory risk embedded in a sole-source monopoly strategy. Amca's publicly stated mission to address
              industrial-base fragility implicitly positions it against this model's adverse externalities.

              HEICO Corporation is the world's largest independent provider of FAA-PMA approved aircraft and engine
              component parts. Its TTM revenue through April 2026 was approximately $4.91 billion, up 18.8%
              year-over-year, with operating margins in the 22–24% range sustained by a lean, decentralized acquisition
              structure. The Flight Support Group, which drove a 15% revenue increase in Q1 FY2026, is almost entirely
              aftermarket-focused—it is not competing for new-build component qualification slots. HEICO Parts Group
              holds over 19,500 FAA-PMA approved parts and adds 500+ new components annually. The business model is
              complementary in some respects and competitive in others: HEICO is a buyer of the same small aerospace
              businesses Amca acquires, but it focuses on aftermarket replacement rather than OEM-cycle new-build
              development.

              Ducommun Incorporated targets the segment of the market closest to Amca: certified aerostructures and
              electronic systems for defense and commercial primes. Q1 2026 revenue reached $209 million, a record, with
              commercial aerospace up 18% and its missile business growing 22% year-over-year. Ducommun holds AS9100,
              ISO 9001, and NADCAP certifications across all facilities. Its $1.1 billion remaining performance
              obligation backlog provides strong near-term visibility. The company's Vision 2027 plan targets 18%
              adjusted EBITDA margins (currently 16.9%), primarily through product mix improvement and facility
              consolidation savings. A material risk flagged in management's own Q1 2026 earnings call is lingering
              destocking headwinds in commercial aerospace expected to continue through year-end 2026.

              Moog Inc. is a specialist in high-performance precision motion and fluid controls. Q1 FY2026 net sales
              were a record $1.1 billion, up 21%, with Space and Defense leading at $324 million (+31%). Full-year
              FY2026 guidance was raised to $4.3 billion. Moog's 12-month backlog reached a record $3.3 billion (up
              30%), concentrated in guided munitions, missile controls, satellite actuation, and military aircraft
              flight controls. The company has opened a new 120,000 sq-ft electromechanical actuation facility in East
              Aurora, NY. Moog has deep sole-source positions on major platforms including F-35, SLS, and Navy launch
              systems—a direct overlap with Amca's stated hydraulics and power-systems focus. Moog does not pursue the
              acquisition-and-modernization model, focusing instead on organic R&D and new product development.

              Albany Engineered Composites (AEC), the aerospace and defense segment of Albany International, is an
              adjacent rather than direct competitor. Q1 2026 AEC revenue grew 24.7% on a constant currency basis,
              driven by the CFM LEAP engine (used on Boeing 737 MAX and Airbus A320neo) and CH-53K defense programs.
              Albany's specialization in 3D-woven composite structures and resin-transfer molding (RTM) occupies a
              different material and process domain from Amca's machined-metal and hydraulic focus. Albany's exposure to
              zero-margin program risk (the CH-53K AFT program was booked at zero margin following Q3 2025 program
              actions) illustrates the execution risk in fixed-price composites development that Amca should factor into
              its own bid strategies.
