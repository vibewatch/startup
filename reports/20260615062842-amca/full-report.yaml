      Exit enterprise values are estimated from revenue scenario × exit multiple combinations documented in TV003. All
      values in USD millions. Bear-case low of $100M reflects a very small revenue denominator outcome. Returns are
      gross pre-dilution estimates. Future acquisition capital rounds will dilute these outcomes.
