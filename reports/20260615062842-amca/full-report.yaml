            title: No customer concentration data disclosed; Boeing dependency persists as an unquantified risk
            body: >-
              Despite the diversification of the named OEM roster from one to eleven-plus customers between April 2025
              and May 2026, Amca has not published any revenue breakdown by customer, program, or platform. Without a
              disclosed top-customer concentration percentage, investors cannot size the exposure to Boeing
              production-rate changes or to any single program delay. The FAA's 42-jets-per-month production cap on
              Boeing is a live constraint that could directly suppress component demand growth in the commercial
              aviation segment.
            calloutType: risk
