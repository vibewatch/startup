      - number: '8.3'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The $1B+ post-money valuation creates three meaningfully different investment outcomes depending on how
              Amca's revenue trajectory, integration execution, and multiple environment evolve over the
              three-to-five-year hold period a typical investor would underwrite.

              The bull case assumes that Amca's tenfold growth claim reflects an annualized run rate that has already
              reached $100–150M and continues scaling at 40%+ per year through successful additional acquisitions and
              RAPID-enabled productivity gains. In this scenario, Amca is already executing on a Loar Holdings-like
              trajectory: three consecutive years of 15%+ organic growth with M&A-enhanced blended growth of 25–30%,
              moving toward $400–600M revenue within four years. At Loar's current 13.5x EV/Revenue multiple, a
              four-year-out $500M revenue business would command a $6.75B enterprise value—yielding a substantial return
              on the current $1B mark even after accounting for dilution. The bull case requires the OEM qualification
              moat to hold, no material customer concentration issue, and an M&A deal flow that continues to surface
              quality legacy shops at reasonable multiples. Integration must be disciplined enough that consolidated
              EBITDA margins reach 30%+ rather than falling into the 10–15% range of lower-quality manufacturing
              roll-ups.

              The base case assumes Amca has $50–100M in annualized revenue at the Series B, growing at 20–30% per year
              inclusive of additional acquisitions. Revenue reaches $200–350M in four years with integration proceeding
              smoothly but not rapidly enough to build aftermarket-weighted or RAPID-monetized differentiation that
              commands a premium multiple. Exit multiple of 8–12x revenue (in line with Moog/Ducommun or mid-market M&A
              comps) yields enterprise value of $1.6–4.2B, which produces returns of 1.6–4.2x at current entry price but
              only after additional dilutive rounds to fund acquisitions. The base case is consistent with a
              research-more or track stance: the business likely creates value but the current price is pricing in the
              bull case.

              The bear case assumes integration friction, customer concentration risk materializing, or multiple
              compression in the A&D venture sector. Revenue growth stalls at 15% per year or acquisition pace slows due
              to rising deal multiples. The tenfold growth claim denominator is revealed to be a very small base ($5–10M
              in initial 2025 revenue), leaving Amca at $50–60M revenue at Series B. Down-round risk increases as the
              next capital need arrives before EBITDA breakeven. At a 3–5x private transaction revenue multiple
              consistent with FirstPageSage Q1 2025 mid-range data for small-revenue Military & Defense companies,
              enterprise value would be $150–300M—below the $376.5M already invested and generating a capital loss for
              late Series B investors. The bear case is not the most likely scenario but is not remote; it requires only
              that the disclosed metrics turn out to represent a smaller absolute revenue base than the bull case
              assumes.
