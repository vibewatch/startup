  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Amca's core revenue mechanism is the sale of precision-engineered aerospace and defense components to OEM
              prime contractors and their Tier-1 suppliers under long-term qualified supply agreements. Revenue accrues
              when certified components ship against an active OEM contract. The product mix spans hydraulic assemblies
              (from the Cal-Draulics/Aerospace Control Products factory), power electronics including transformers,
              transformer-rectifier units, capacitors, and EMI filters (from Electrocube), power magnetics (from Payne
              Magnetics), avionics-adjacent housings, and structural machined components. Each category requires its own
              OEM approved-vendor list qualification, creating a barrier that both protects pricing and limits the speed
              at which new capacity can reach production.

              The pricing architecture is driven by qualification status. Once a component is on an OEM's AVL—a process
              typically taking 12 to 36 months, including first-article inspection, material traceability documentation,
              and in some cases NADCAP special-process certification—the incumbent supplier holds a de facto sole-source
              position. Aerospace CNC shop rates for AS9100D/ITAR-certified precision work run $120 to $200 per hour
              all-in, reflecting direct labor, overhead, certification amortization, and compliance cost layers.
              Overhead can comprise 35 to 45 percent of total unit cost in aerospace manufacturing, driven by quality
              systems, specialized equipment, and AS9100D documentation requirements. The resulting gross margin
              potential is meaningful, but the actual realized margin at Amca's factories is unknown because no audited
              financial statements have been published.

              The RAPID platform does not currently appear to operate as an externally sold software product. It
              functions as an internal engineering and manufacturing workflow tool that integrates design, prototyping,
              qualification testing, technical documentation, and certified production into a single connected process.
              Its financial contribution, if any, would manifest as improved gross margins on the component revenue
              line—through faster qualification cycles and lower rework costs—rather than as a standalone software
              revenue stream. Whether RAPID will be externally licensed in the future has not been disclosed. Amca's
              self-reported tenfold year-over-year top-line growth claim lacks a disclosed denominator, time period, or
              audited basis, making it an affirmation of directional progress rather than a bankable revenue figure.
