      - number: '7.5'
        title: Financial opacity, valuation risk, and financing-spillover
        blocks:
          - type: paragraph
            body: >-
              Amca's $1 billion-plus post-money Series B valuation is a significant premium on sector norms. Private
              equity diligence benchmarks cited by Angel Investors Network place typical defense hardware Series B
              post-money valuations at $100 million to $400 million for well-performing, revenue- generating companies;
              Amca's $1 billion-plus mark implies the market is pricing a growth trajectory substantially above sector
              median. The company has not published audited financial statements, investor decks, a disclosed customer
              count, or a revenue-concentration profile. The sole quantitative revenue signal in the public record is a
              self-reported tenfold year-over-year top-line growth claim without a denominator, time period, or audited
              baseline. Total disclosed capital is $376.5 million ($76.5 million seed plus $300 million Series B); at a
              $1 billion-plus valuation, the implied post-money multiple on disclosed capital is approximately 2.7
              times— reasonable for a hardware rollup, but only if revenue and margin assumptions hold. Defense hardware
              startups at Series B stage typically carry gross burn of $600,000 to $2 million per month; Amca's
              hardware-heavy, multi-factory footprint likely sits at the upper bound. If the next funding milestone
              (Series C or strategic partnership) is delayed by market tightening or missed milestones, the company's
              path to self-sustaining cash flow through hardware operations becomes critical. The Foley and Lardner 2026
              FCA report and Fitch Ratings both highlight a broader financing risk: interest rates remaining elevated
              and LP appetite rotating toward defensive cash-generating businesses, which applies pressure on Series C
              valuations for companies that cannot demonstrate audited revenue trajectories. The company's current
              public-disclosure profile (no revenue, no headcount, no customer count published) is appropriate for a
              private unicorn at this stage, but creates diligence opacity that makes independent risk assessment from
              the outside structurally incomplete.
