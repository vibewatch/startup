      - number: '1.2'
        title: Leadership, governance, and founder-market fit
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is still thin, but it is enough to establish the core operating team. Launch
              materials, Craft’s company profile, and Manufacturing Dive all identify Jai Malik and Eli Giovanetti as
              the company’s co-founders, with Malik serving as CEO and Giovanetti as COO. Giovanetti’s prior role as a
              senior production and engineering leader at SpaceX gives the team directly relevant experience in
              high-performance manufacturing and industrial execution. Malik’s pre-Amca background is less crisply
              documented, but Manufacturing Dive reports that he previously worked as a general partner at Countdown
              Capital, which is directionally consistent with the investor-operator profile used in company launch
              materials. Craft also lists Varun Gupta as chairman, and the Cal-Draulics acquisition release shows Doug
              Johnson, the acquired company’s former owner, joining Amca’s engineering team. That matters because it
              implies the company is not only buying assets; it is also trying to retain technical knowledge from
              acquired shops. The main governance limitation is that Amca has not yet published a robust board page,
              ownership map, or long-form founder biographies on its own site. Investors therefore have reasonable
              visibility into the two operating founders and one named chairman, but not yet a complete governance stack
              or a deeply sourced biography for Malik beyond press interviews and transaction coverage.
