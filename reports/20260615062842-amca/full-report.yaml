      - number: '3.4'
        title: Capability, certification, and GTM comparison
        blocks:
          - type: paragraph
            body: >-
              Across the competitive field, the key buying criteria that defense and commercial primes use to select
              critical-component suppliers are: (1) existing qualification on the specific program or similar platform;
              (2) AS9100 certification and relevant NADCAP special-process accreditation; (3) ITAR registration and
              DFARS compliance; (4) capability breadth across the component families a customer needs; (5) lead-time
              performance and delivery reliability; and (6) engineering support capacity—the ability to assist with
              design-for-manufacturability, qualification testing, and technical documentation.

              Amca's differentiation rests primarily on (4), (5), and (6): its RAPID platform claims to reduce hardware
              lead times by over 67% compared to industry norms, and the integration of engineering, prototyping, and
              certified manufacturing within one workflow addresses (6) in a way that single-shop suppliers—and most
              large public incumbents—cannot match. On (1) and (2), Amca inherits qualification approvals from acquired
              shops, which is faster than building from zero but still requires customer validation when the acquirer
              takes over. This is a near-term gap relative to incumbents with decades of established approvals.

              Distribution and GTM: TransDigm and HEICO both sell through direct OEM/airline relationships and a network
              of distribution partners for aftermarket parts. Ducommun and Moog sell primarily through long-term program
              production contracts managed by program-office relationships, not distributors. Amca's current customer
              relationships (Boeing, Lockheed Martin, Airbus, Embraer, Honeywell, Northrop Grumman, Raytheon) suggest
              direct prime- contractor access rather than distribution-layer dependency—but the depth and contractual
              structure of these relationships is not publicly disclosed and requires diligence-room verification.

              Pricing for all competitors in the mission-critical component segment is either negotiated under long-term
              production contracts (Ducommun, Moog, Amca) or driven by sole-source approval combined with limited
              published list prices (TransDigm, HEICO aftermarket). Public pricing data is not available for any
              competitor in this space, and Amca does not publish pricing. The pricing comparison table marks all cells
              as unknown or inference- based where primary-source data is unavailable.
