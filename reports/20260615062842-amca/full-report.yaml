  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold or event
      - transmission to thesis
      - action implication
    rows:
      - - Revenue denominator revealed as very small
        - Audited launch-year revenue below $10M (implying current run rate <$100M)
        - Re-rates valuation from 10x revenue to 100x+; bears out bear-case scenario
        - Reduce exposure; do not follow future rounds without major price renegotiation
      - - Integration failure at acquired shops
        - EBITDA margin at acquired factories below 15% or on-time delivery below 80% after 18 months
        - Destroys the value-creation thesis for further acquisitions at current pace
        - Pause diligence pending margin disclosure; request factory-level data room
      - - OEM customer concentration exceeds 50%
        - Single prime accounts for >50% of bookings (e.g., Boeing or Lockheed sole-source)
        - Creates catastrophic revenue risk if that OEM resourcing changes or is delayed
        - Re-rate risk from high to critical; concentration covenant required
      - - Down-round at next capital need
        - Series C priced below $1B post-money or structured as convertible with down-round protection
        - Signals market recalibration of thesis; preference overhang crystallizes against common
        - Treat as thesis-breach signal; full diligence refresh required before any re-investment
      - - A&D multiple compression
        - TransDigm EV/EBITDA falls below 15x or Loar EV/Revenue falls below 6x in public markets
        - Compresses exit multiple range by 30–50%; bear-case becomes base-case trajectory
        - Widen bear-case scenario range; reconsider entry point discipline
    notes: >-
      Triggers are not predictions; they are the specific observable events that would cause a material re-rating of the
      investment thesis. Each trigger has a defined data source or observable event that can be monitored without
      requiring non-public information.
