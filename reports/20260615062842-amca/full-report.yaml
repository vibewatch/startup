      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Amca's market has two principal demand channels—defense and commercial aerospace—each with a distinct
              buyer-user-payer structure and adoption path.

              In the defense channel, the US Department of Defense is the ultimate payer via Congressional
              appropriations. The FY2026 Defense Appropriations Act allocates a total discretionary amount of $839.2
              billion, including $13.4 billion for missile defense and space programs and authorization for the Office
              of Strategic Capital to access over $4.3 billion in loans and guarantees to scale critical supplier
              capacity. DoD flows funds through prime contractors—Lockheed Martin, Northrop Grumman, Boeing Defense,
              RTX, L3Harris, General Dynamics—that serve as system integrators and issue long-term purchase orders to
              qualified Tier 1 and Tier 2 component suppliers. The buying decision (supplier selection) resides with
              prime contractor procurement teams, subject to DCMA oversight and DCSA security review for ITAR-controlled
              work. Program offices specify performance requirements but do not typically select sub-tier suppliers.

              In the commercial aerospace channel, OEMs (Boeing and Airbus) are both buyer and quality authority for
              component suppliers. Airlines are the end users and lessors are economic owners, but neither party
              participates directly in component supplier selection at the sub-tier level. OEMs issue long-term supply
              agreements locking in volumes and pricing across multi-year production campaigns; Airbus and Boeing
              combined had a backlog of 15,461 commercial aircraft at end-2025, representing over 11 years of production
              at current build rates. For the MRO aftermarket, airlines and MRO operators become direct buyers of
              components and spares, creating a secondary demand stream that is sustained even when new-aircraft
              production volumes soften. Deloitte projects global commercial aftermarket MRO demand growing at a 3.2%
              CAGR between 2026 and 2035.

              The adoption path for a new or modernizing supplier is common across both channels: obtain or inherit
              AS9100 certification, complete program-specific qualification on an OEM's or prime's approved vendor list,
              then sustain quality, delivery, and cost performance over multiple audit cycles. The qualification process
              typically takes 12–36 months for a new entrant; Amca's acquisition model accelerates this timeline by
              inheriting existing certifications and customer relationships from the acquired legacy shop—its most
              important structural advantage over greenfield manufacturing startups. Fictiv's 2026 state of
              manufacturing survey found 97% of leaders embedding AI across core workflows, signaling that digital
              manufacturing capability is becoming a table-stakes requirement in supplier qualification conversations.
