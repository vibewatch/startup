      - number: '4.4'
        title: Financial disclosure gaps, adverse evidence, and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The primary adverse financial evidence is the structural mismatch between Amca's publicly disclosed
              capital and its disclosed financial outputs. The company has raised $376.5 million and achieved a $1
              billion-plus valuation, but has not published audited revenue, gross margins, customer concentration, cash
              position, or acquisition prices. The tenfold growth claim stands alone without a denominator or audit.
              This is not unusual for a company eighteen months old with a legitimate privacy interest in its
              competitive positioning, but it is a material gap for any investor attempting financial underwriting.

              Several structural adverse signals deserve emphasis. First, aerospace manufacturing roll-ups are
              capital-intensive in ways that differ materially from software businesses. TransDigm's experience
              illustrates the progression: acquisitions require premium pricing for sole-source franchises, creating
              high goodwill loads (59 percent of assets) and interest expense obligations ($959 million in H1 FY2026)
              that require stable aftermarket demand to service. Amca is in the early-equity phase of this trajectory,
              but the capital intensity will intensify as it deploys its $300 million and potentially raises additional
              rounds. Second, a Breaking Defense analysis from April 2026 identifies three risks specific to VC-backed
              defense hardware companies: failure to meet operational performance at production scale, customers failing
              to shift procurement spending to new entrants, and investors lacking patience for timelines that extend
              well beyond software development cycles. Third, the A&D sector median gross margin of 18.7 percent and
              EBITDA median of 12.2 percent illustrate that defense component manufacturing is not uniformly
              high-margin; the TransDigm and HEICO margins reflect decades of sole-source franchise building that a
              two-year-old company cannot credibly claim yet.

              The financial verdict is that Amca's capital position is strong for its current stage, its named customer
              base provides meaningful commercial validation, and its acquisition model addresses a real supply-chain
              fragility with a logical value-creation path. The diligence blockers—absent audited financials, unknown
              acquisition economics, and unconfirmed unit economics—are resolvable through a standard data-room review
              but cannot be resolved from public sources alone. The chapter recommends treating Amca's self-reported
              financial claims as directional indicators only and insisting on a complete audited P&L, gross margin by
              product line, backlog by customer, and a 24-month cash forecast before any financial modeling.
