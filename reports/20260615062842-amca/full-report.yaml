chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >-
              Amca presents itself as a company built to repair a fragile layer of the U.S. aerospace and defense supply
              chain rather than as a pure software startup or a traditional private-equity roll-up. Its official
              homepage and Who We Are page both frame the problem as one of declining competition, sole-source
              dependence, aging ownership, and shrinking capacity inside critical-component manufacturing. That framing
              is important because it defines the boundary of the company: Amca is not trying to build complete aircraft
              or weapons systems, and it is not just trying to automate generic part machining. Instead, the company
              says it focuses on the component layer between standardized parts and full systems, spanning avionics,
              hydraulics, and power systems that already sit on major commercial and defense platforms. The operating
              model is also more specific than a generic consolidation thesis. Official materials and the 2026 Series B
              coverage consistently describe RAPID as the software-and-engineering layer that links design, prototyping,
              qualification testing, technical documentation, and certified manufacturing inside one workflow.
              Manufacturing Dive’s interview with Jai Malik provides an outside corroboration of the same idea,
              describing Amca as a business that removes the gap between component development and certified production.
              For diligence purposes, the strongest conclusion is that Amca’s core thesis is to combine physical
              factories with an integrated engineering system so it can accelerate qualified component delivery where
              the legacy industrial base is slowest.
