            title: Electrocube's top-20 Boeing ranking is rare and durable proof of customer quality
            body: >-
              Among Boeing's 5,000-plus direct suppliers, Electrocube's top-20 ranking on quality, on-time delivery, and
              responsiveness is the highest-specificity independent customer validation in Amca's portfolio. This
              ranking — pre-dating Amca's ownership — is now part of the Amca value proposition and creates a verifiable
