      - CV030
      - CV031
      - CV032
  - id: FV004
    title: Investment KPIs — IC-ready scoring across key dimensions
    type: kpi
    layout: standard
    summary: >-
      Evidence-based ordinal scoring (1=very weak / 5=very strong) across seven investment committee dimensions for Amca
      as of June 2026. Scores reflect publicly available evidence only and carry material uncertainty where financials
      are undisclosed.
    data:
      items:
        - label: Market opportunity (structural supply gap, OEM demand)
          value: 4 / 5
          description: NDIA, GAO, PCE, and DoD sources confirm supply constraint; TAM is real and growing
        - label: Competitive moat (qualification lock-in, RAPID platform)
          value: 3 / 5
          description: Inherited qualifications are real; RAPID 67% claim is company-stated and unverified externally
        - label: Team and execution (co-founders, SpaceX background, acquisitions)
          value: 3 / 5
          description: >-
            Eli Giovanetti SpaceX background and five acquisitions in 18 months show capability; leadership thin in
            public disclosure
        - label: Financial evidence (audited revenue, margins, burn)
          value: 1 / 5
          description: No audited financials; tenfold growth claim has no denominator; zero public financial disclosure
        - label: Valuation discipline (price relative to comps)
          value: 2 / 5
          description: $1B+ at unconfirmed revenue looks stretched vs. Loar at 13.5x; requires data room to confirm
        - label: Risk profile (integration, capital, customer concentration)
          value: 2 / 5
          description: High execution risk, five simultaneous integrations, no concentration data, preference overhang
        - label: Evidence quality (source coverage, corroboration, recency)
          value: 2 / 5
          description: Sources are abundant and consistent on funding facts; weak on financial and operational metrics
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV008
      - CV009
      - CV033
