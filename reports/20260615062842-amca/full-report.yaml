      - number: '2.2'
        title: Market sizing across multiple lenses and conflicting estimates
        blocks:
          - type: paragraph
            body: >-
              No single published market estimate cleanly captures Amca's serviceable addressable market because the
              relevant boundaries—precision-machined, certified, critical-component manufacturing for US aerospace and
              defense customers—cut across several differently defined analyst segments. The analysis uses five
              independent sizing lenses and preserves contradictions among them rather than averaging to a false
              precision.

              The broadest lens, the overall US aerospace and defense market per Mordor Intelligence, puts 2026 revenue
              at $463.06 billion growing at a 5.67% CAGR through 2031. This figure includes complete platforms, systems
              integration, software, and services, making it too wide to serve as Amca's TAM without significant
              narrowing. SNS Insider's US aerospace parts manufacturing estimate of $278.1 billion in 2025 (2.21% CAGR
              through 2035) is narrower but still encompasses all component types—interior fittings, engine assemblies,
              MRO consumables—outside Amca's current scope. Coherent Market Insights places the global aerospace parts
              manufacturing market at $1,046 billion in 2026, with North America at 41% (approximately $429 billion), a
              figure inconsistent with SNS Insider's $278 billion US-only estimate since the North American share cannot
              plausibly exceed the US total. This definitional contradiction illustrates why cross-analyst market sizing
              demands explicit boundary scrutiny, and the chapter preserves both conflicting figures.

              A more targeted lens comes from WorldMetrics' analysis of the US precision machining market: $98 billion
              total in 2022 with aerospace and defense representing approximately 31% of revenue, implying roughly $30
              billion in 2022 dollars. Adjusting for subsequent growth yields an approximate range of $28–42 billion for
              2026. The narrowest directly comparable proxy is Cognitive Market Research's estimate of the North
              American aircraft machined components market at $11.28 billion in 2023, growing at a 5.8% CAGR—reaching
              approximately $14–17 billion by 2026–2027. This figure likely undercounts defense-specific machined
              components (missiles, munitions hardware, naval system parts), which are frequently excluded from
              commercial aircraft-focused studies.

              For diligence purposes, the most defensible SAM estimate for Amca's current strategy falls in the $15–25
              billion range for precision-machined and process-intensive components for US aerospace and defense
              primes—acknowledging that the low bound excludes defense-specific machined parts not captured in
              aircraft-only estimates, and the high bound may include segments (engine discs, composite aerostructures)
              outside Amca's current product portfolio. The US aerospace parts manufacturing market is projected to grow
              at 2.21% CAGR per SNS Insider and at 6.8% globally per Coherent Market Insights—the divergence itself
              reflects differing views on whether demand or supply constraints will dominate the near-term trajectory.
              DoD's FY2026 defense appropriation of $839.2 billion and the $4.3 billion in Office of Strategic Capital
              credit for scaling critical suppliers represent structural tailwinds that support the upper range of
              growth scenarios.
