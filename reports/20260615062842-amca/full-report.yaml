      - number: '7.3'
        title: Customer concentration and demand cyclicality risk
        blocks:
          - type: paragraph
            body: >-
              Amca's publicly named customer set is dominated by Boeing, Lockheed Martin, Airbus, Raytheon, Northrop
              Grumman, Honeywell, and Embraer. No revenue concentration figures have been disclosed, but the legacy
              acquisition targets (Electro-Mech, Electrocube, ACPI) each had highly concentrated relationships:
              Electrocube ranked in the top 20 of more than 5,000 Boeing direct suppliers with a near-perfect quality
              record, implying a significant share of its revenue came from a single customer. For early- stage defense
              components businesses, typical customer concentration is 60-80 percent of revenue from the top three
              customers, per private equity diligence benchmarks cited by Angel Investors Network. Boeing's financial
              fragility compounds the concentration risk: the company's Commercial Airplanes division is not expected to
              return to profitability until 2027, lost $632 million in 2025, and expects an operating-margin loss of 7.5
              to 8 percent in Q1 2026. Any new quality incident, FAA directive, or production disruption at Boeing flows
              immediately into volume adjustments, extended payment cycles, and containment mandates for suppliers in
              Boeing programs. Fitch Ratings flags Boeing's supply-chain stabilization as still carrying lingering risk
              from tariffs and geopolitical tensions even as tier-one supplier relationships improve. For
              defense-focused revenue streams, program concentration risk operates differently: a single program
              cancellation or multi-year delay (as seen repeatedly with F-35 TR-3 software backlogs, for example) can
              cut addressable revenue by 30-40 percent for platform-specialized suppliers. Defense budget uncertainty
              also matters: FY2026 defense appropriations have bipartisan support at over $850 billion, but
              continuing-resolution risk at the FY2027 transition could freeze new contract starts and delay delivery
              schedules, creating working- capital stress for hardware-intensive suppliers. Commercial aerospace demand
              cyclicality adds a second oscillation: the industry record backlog of 16,000 aircraft in May 2025 reflects
              demand, but Cylad notes deliveries remain 10 percent below pre-COVID peaks, and any demand-softening shock
              (fuel prices, geopolitical disruption, airline failures) could cascade into OEM production rate reductions
              within two to three quarters.
