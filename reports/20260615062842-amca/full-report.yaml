  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and named platform coverage
        blocks:
          - type: paragraph
            body: >-
              Amca operates as a Tier-2 aerospace and defense component supplier, meaning its direct buyers and payers
              are prime contractors (OEMs) and Tier-1 system integrators, not the end users of the aircraft or weapons
              systems. The buyer/payer group includes Boeing, Lockheed Martin, Northrop Grumman, Airbus, Embraer,
              Honeywell, and Raytheon — all named explicitly in the May 2026 Series B press release — plus BAE Systems,
              GE Aerospace, Textron, and Bombardier cited by CEO Jai Malik in media appearances the same week. The
              company also supplies U.S. military sustainment programs directly, where the payer is the DoD or the
              Defense Logistics Agency and the end user is the warfighter. A sixth revenue stream exists through BC
              Systems, which serves exclusively military customers on undisclosed classified programs. Geographically,
              the customer base is predominantly U.S.-domestic given Amca's factory footprint and security clearance
              needs, but commercial OEM relationships (Airbus, Embraer, Bombardier) extend reach to European and
              Brazilian programs. By vertical, the customer base spans commercial aviation (737, 747, 757, 767, 777,
              A320, E-jets), defense aviation (F-35, F-16, F/A-18, F-15, C-17), ground systems (M1 Abrams), and naval
              (Mk-48 torpedo). No revenue breakdown by segment, geography, customer, or platform has been disclosed
              publicly; the segmentation above rests on named platform and customer references extracted from official
              press releases, product pages, and media reporting.
