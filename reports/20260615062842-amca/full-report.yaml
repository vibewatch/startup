              ACPI adds hydraulic pressure and liquid-level switches on the Boeing 737, 747, 767, F-15, and C-17 — a
              46-year heritage relationship that the company explicitly frames as "some of the biggest commercial and
              defense aircraft programs in the world." Payne Magnetics brings longstanding RF power magnetics
              relationships on the Boeing 737 MAX, F-16, and F-18, with Amca investing in new variants for UAV and
              energetics programs. For the F-35, CEO Malik stated publicly at the Series B press conference that an
