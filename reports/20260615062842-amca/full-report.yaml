      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural supply gap reinforces platform-level demand case
            body: >-
              Evidence from GAO, NDIA, McKinsey, and TD Securities converges on the same finding: the US defense
              industrial base is losing certified sub-tier suppliers faster than new ones can be qualified, and prime
              contractors cannot fill the gap through insourcing alone. Amca's acquisition model directly targets this
              structural hole—inheriting qualified capacity rather than waiting 12–36 months for a greenfield
              qualification.
            calloutType: strength
            claimRefs:
              - CM022
              - CM025
              - CM026
              - CM027
          - type: callout
            title: Wide sizing uncertainty limits confidence in any single TAM/SAM number
            body: >-
              Published estimates of Amca's nearest addressable market range from $11 billion to $429 billion depending
              on boundary assumption. The $42 billion upper bound of the narrowest credible lens and the $14 billion of
              the most directly comparable published estimate are not reconcilable with the $278 billion SNS Insider US
              parts figure without explicit boundary adjustment. Investors should treat any single TAM citation as
              context, not a precision data point.
            calloutType: risk
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM042
          - type: callout
            title: Qualification inheritance is Amca's primary time-to-revenue accelerator
            body: >-
              The most durable constraint for new market entrants—qualification cycles of 12–36 months—is also Amca's
              clearest competitive advantage. By acquiring legacy shops that carry existing certifications, AVL entries,
              and program relationships, Amca converts a structural barrier to entry into a barrier to displacement,
              providing a moat that is difficult for venture-backed greenfield entrants to replicate quickly.
