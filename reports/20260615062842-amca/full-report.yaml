    title: Valuation and return range — bull, base, and bear scenarios
    type: range
    layout: standard
    summary: >-
      Bull, base, and bear enterprise value ranges at a four-to-five-year exit horizon, reflecting variation in revenue
      trajectory, exit multiple, and integration success. Current $1B+ mark is the reference point.
    data:
      items:
        - label: Bull case (large revenue confirmed, Loar-style multiple)
          low: 4800
          value: 6500
          high: 8250
          unit: $M EV
        - label: Base case (mid revenue, mid-market multiple)
          low: 1600
          value: 2400
          high: 4200
          unit: $M EV
        - label: Bear case (small revenue denominator, M&A transaction multiple)
          low: 100
          value: 250
          high: 500
          unit: $M EV
        - label: Current Series B post-money mark (reference)
          low: 1000
          value: 1000
          high: 1000
          unit: $M EV
        - label: Total invested capital to date (reference)
          low: 376
          value: 376
          high: 376
          unit: $M
