          - type: callout
            title: Post-acquisition qualification status for six factories is a material unverified gap
            body: >-
              When a manufacturer changes ownership, OEM customers and regulators may require re-qualification of the
              new entity's AS9100D scope, NADCAP accreditations, and FAI history. Amca has not publicly confirmed that
              all six acquired factories retained their original approvals under Amca ownership, nor whether any
              customer has required re-inspection following the acquisitions. This is a diligence-room question with
              direct revenue consequences.
            calloutType: risk
            claimRefs:
              - CU018
              - CU027
          - type: callout
            title: Inherited qualification lock-in is both moat and ceiling — new platforms require full cycles
            body: >-
              Amca's acquisition strategy captures existing platform approvals without requiring new qualification
              cycles for legacy parts. But any new product variant, new platform, or new customer requires completing
              the full FAI, NADCAP, and AS9100D qualification process — typically 6 to 12-plus months. RAPID is designed
              to compress this cycle, but independent verification of RAPID's actual qualification speed vs. industry
              standard has not been published. Customer expansion speed therefore depends on a compression claim that
              has yet to be externally audited.
            calloutType: insight
            claimRefs:
              - CU019
              - CU022
              - CU027
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution and acquisition integration risk
        blocks:
          - type: paragraph
            body: >-
              Amca's core operating model—acquire legacy precision-component shops, harmonize them under the RAPID
              engineering platform, and accelerate qualified production—carries exceptional execution risk for a company
              that turned 14 months old when it closed its Series B. Each acquired factory (Electro-Mech, Cal-Draulics,
              BC Systems, Electrocube, Payne Magnetics, Aerospace Control Products) enters the network with its own
              quality management system, sub-tier supplier relationships, workforce culture, tooling configuration, and
              customer approval history. Post-acquisition integration in aerospace is not a back-office consolidation;
              it requires harmonizing AS9100D quality processes, validating RAPID as the new engineering backbone,
              retaining the certified workforce that holds institutional knowledge of legacy designs, and ensuring that
              no customer qualification is inadvertently lapsed or downgraded during the transition. The 2026 Generis
              Aerospace and Defense Summit captured industry-wide consensus that quality failures at suppliers now
              cascade instantly across programs and national priorities; a single quality escape at one Amca factory
              could trigger containment actions across all six production sites. Tier-2 and Tier-3 supplier visibility
              gaps—identified by Cylad, Plexus International, and SQA Services as the dominant blind spot in modern
              aerospace supply chains—are particularly acute at an acquisition platform that is still building unified
              monitoring infrastructure. RAPID's design claims (cutting development-to-production timelines by 50
              percent) remain company-asserted and unvalidated by an independent third party; if the platform cannot
              deliver on that claim across disparate factory types, the integration rationale weakens. The key-man risk
              is real and concentrated: Jai Malik (CEO) and Eli Giovanetti (COO) are the only executives with
              substantial public profiles, and Malik's pre-Amca background in venture investing rather than aerospace
              operations means the company depends heavily on Giovanetti's SpaceX manufacturing credentials and on the
              retained owner-operators from acquired shops.
