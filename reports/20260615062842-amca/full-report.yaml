      - number: '1.4'
        title: Milestones, acquisitions, and unresolved diligence questions
        blocks:
          - type: paragraph
            body: >-
              The milestone record is already dense for a young company. Public launch materials tie the initial
              strategy to the acquisition of Electro-Mech Components, while later disclosures confirm Cal-Draulics and
              BC Systems as additional acquisitions inside the network. The official site now names six flagship
              factories inherited from legacy suppliers, with founding dates stretching back to the 1950s, which
              reinforces Amca’s stated model of modernizing existing shops instead of replacing them with entirely
              greenfield capacity. At the same time, the public record leaves several investment-critical gaps
              unresolved. First, there is still no verified employee count even though the careers page clearly shows
              active scaling. Second, customer breadth is described qualitatively through named primes and platform
              exposure, but the company does not publish a present-day customer count or concentration split. Third,
              Malik’s prior background is not documented in the same depth as Giovanetti’s. Fourth, the
              six-versus-seven-facility discrepancy illustrates how quickly the company’s footprint is moving relative
              to the consistency of its public disclosures. Finally, the only public revenue signal in reviewed
              materials is a self-reported claim that top line increased tenfold versus the prior year’s book of
              revenue, which is directionally interesting but not underwriteable without a denominator, a time period,
              or financial statements. These are not reasons to dismiss the story, but they are reasons to preserve
              explicit diligence asks before reusing headline metrics elsewhere in the report.
