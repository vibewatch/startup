      - number: '4.2'
        title: 资本结构、融资轨迹与部署策略
        blocks:
          - type: paragraph
            body: >-
              Amca 已披露资本基础合计 $376.5 million，来自两轮融资。Caffeinated Capital 均为领投方：2025 年 4 月 $76.5 million 初始融资启动公司，并资助其首次收购
              Electro-Mech Components；2026 年 5 月完成的 $300 million Series B 则引入 Lightspeed Venture Partners、Andreessen
              Horowitz、Lux Capital、Construct Capital 和 House Capital，Caffeinated Capital 继续领投。Series B 将 Amca 估值推至 $1
              billion 以上；Crunchbase 在 2026 年 5 月独角兽追踪榜中确认这一点，称其为一家位于 El Segundo、成立一年的企业，拥有六家工厂，估值 $1 billion。

              公司称 $300 million 募资用途分三类：继续在美国收购工厂、把 RAPID
              平台扩展到整个制造网络、加速关键国防项目的部件生产。三类之间的具体分配尚未披露。公司成立以来已完成至少五笔收购——Electro-Mech Components、Aerospace Control
              Products Inc.（液压）、BC Systems（电力电子，纽约）、Electrocube（电力电子，加州 Pomona）和 Payne Magnetics（电力磁性件，加州
              Covina）——但单笔交易金额均未公开。按传统航空航天供应商常见交易倍数粗估，单店 $2 million 到 $50 million，合计收购支出可能为 $10 million 到 $250
              million；这意味着剩余资本区间很宽。

              截至 2026 年 6 月，Amca 任何公开来源均未披露债务、信贷额度或项目融资义务。制造业整合资本强度高，因此未披露杠杆值得注意：TransDigm 等可比上市收购方总债务约 $32 billion，约为过去
              12 个月 EBITDA 的 6 倍，商誉和无形资产占总资产 59%——这说明航空航天部件整合商通常会随着时间推移大幅加杠杆。Amca
              当前纯股权结构提供了资本灵活性，但要在现有工厂网络之外继续扩张，公司需要产生有意义的自由现金流，或继续融资。
