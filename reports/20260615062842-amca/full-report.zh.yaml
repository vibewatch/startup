  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入基数被披露为很小
        - 经审计启动年收入低于 $10M（意味着当前 run rate <$100M）
        - 估值从 10x 收入重估为 100x+；印证熊市情境
        - 降低敞口；没有重大价格重谈，不跟投未来轮次
      - - 被收购工厂整合失败
        - 收购工厂 18 个月后 EBITDA 利润率低于 15%，或准时交付低于 80%
        - 摧毁按当前节奏继续收购的价值创造论点
        - 暂停尽调，等待利润率披露；要求工厂级 data room
      - - OEM 客户集中度超过 50%
        - 单一主承包商占 bookings >50%（如 Boeing 或 Lockheed 单一来源）
        - 若该 OEM 重新 sourcing 或延期，将制造灾难性收入风险
        - 将风险从高重评为严重；必须设置集中度 covenant
      - - 下一次资本需求出现 down-round
        - Series C post-money 低于 $1B，或设计为带 down-round 保护的可转债
        - 显示市场重新校准论点；优先权包袱开始压制普通股
        - 视为论点破裂信号；任何再投资前必须完整刷新尽调
      - - A&D 倍数压缩
        - 公开市场上 TransDigm EV/EBITDA 低于 15x，或 Loar EV/Revenue 低于 6x
        - 将退出倍数区间压缩 30–50%；熊市路径变成基准路径
        - 扩大熊市情境区间；重新审视入场点纪律
    notes: 触发项不是预测，而是会导致投资论点实质重估的具体可观察事件。每个触发项都有明确数据源或可观察事件，无需非公开信息即可监控。
