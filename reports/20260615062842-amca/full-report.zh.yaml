  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Amca 的投资逻辑建立在四根支柱上：第一，关键零部件层长期供不应求，大型 OEM
              主承包商无法自供，既有供应商又过于分散、缺资本、老化，难以充分服务；第二，公司模式有差异化，不只是买入并持有传统工厂，而是把收购、现代化改造和 RAPID
              加速工程纳入同一个认证工作流；第三，进入市场更节省资本，继承 OEM
              资质、生产工装和客户关系，而不是从零搭建；第四，国家安全紧迫性、两党政治支持和主承包商需求少见地同向，给供给缺口叙事提供持续顺风。投资人组合——Caffeinated
              Capital（两轮均参与）、Lightspeed、Andreessen Horowitz、Lux Capital、Construct Capital 和 House
              Capital——代表一线科技与深科技资本，说明该逻辑经受过机构尽调。

              反逻辑同样具体。公司没有发布经审计收入或 EBITDA；10 倍增长说法缺少分母、时间段和会计基础，无法验证超过 $1B 的估值对应的是 $50M、$100M 还是 $200M+
              年化收入。按上市可比公司的倍数看，这些入口价差异很大：$1B 估值按 Loar 式 13.5x EV/Revenue 意味着 $74M 收入，按 Ducommun 式 1.2x 则意味着
              $833M——相差一个数量级。整合执行风险也没有披露：18 个月内在 California、Iowa、New York
              完成五项收购，覆盖多种制造流程、质量管理体系和劳动力文化，造成显著的组织吸收能力风险，尤其是在已披露领导团队相对较小的情况下。没有任何客户集中度数据，意味着客户悬垂风险（例如一个 OEM 占订单
              60%+）可能在今天的价格里不可见。

              建议是继续研究，而不是买入或跟踪。投资逻辑在结构上成立，市场机会也真实存在，但在当前公开证据水平下，估值无法承销。要把判断推向买入，需要看到：(1) 经审计收入和毛利率，确认规模化单位经济；(2)
              客户集中度数据，显示没有单一主承包商超过收入 35%；(3) RAPID 加速资质认证证据，并由 OEM 确认交付周期改善；(4)
              被收购工厂的整合里程碑证明，包括员工留任、质量评分稳定和按时交付。若出现下轮降估值或以更低隐含估值桥接融资，入口价会更有吸引力。
