  - id: FV004
    title: 投资 KPI — 面向 IC 的关键维度评分
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，基于证据对 Amca 七个投委会维度做序数评分（1=很弱 / 5=很强）。评分只反映公开可得证据；财务未披露的维度存在重大不确定性。
    data:
      items:
        - label: 市场机会（结构性供给缺口，OEM 需求）
          value: 4 / 5
          description: NDIA、GAO、PCE 和 DoD 来源确认供给受限；TAM 真实且在增长
        - label: 竞争护城河（资质锁定，RAPID 平台）
          value: 3 / 5
          description: 继承资质真实存在；RAPID 快 67% 的说法来自公司，外部未验证
        - label: 团队与执行（联合创始人、SpaceX 背景、收购）
          value: 3 / 5
          description: Eli Giovanetti 的 SpaceX 背景，以及 18 个月内五次收购，显示出执行能力；公开披露里的领导层信息偏薄
        - label: 财务证据（审计收入、利润率、烧钱）
          value: 1 / 5
          description: 无经审计财务；十倍增长说法没有分母；公开财务披露为零
        - label: 估值纪律（相对可比公司的价格）
          value: 2 / 5
          description: 收入未确认情况下 $1B+ 显得偏贵，相比 Loar 13.5x 也紧；需要数据室确认
        - label: 风险画像（整合、资本、客户集中度）
          value: 2 / 5
          description: 执行风险高，五项整合同时推进，无集中度数据，还有优先权负担
        - label: 证据质量（来源覆盖、交叉印证、时效性）
          value: 2 / 5
          description: 资金事实方面来源充足且一致；财务和运营指标薄弱
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV008
      - CV009
      - CV033
