  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计收入和毛利率
        - 自成立以来任何期间均无财务报表或审计结果
        - 没有收入基数就无法承销估值；这是所有情境分析的基线
        - 从 data room 要求 FY2024 和 FY2025 经审计财务；与十倍增长说法对比
      - - Cap table 和优先权 waterfall
        - 未披露投资人权利、优先权倍数、反稀释条款或清算栈
        - Down-round 保护和优先权包袱决定基准 / 熊市退出中的普通股回报
        - 法律审阅 Series B term sheet 和资本结构表；按 3 种情境建模 waterfall
      - - 客户集中度和合同期限
        - 已点名主承包商（Boeing、Lockheed、Airbus 等），但无集中度数据、合同价值或续约风险
        - 单一客户包袱可能是当前公开数据看不见的终止标准风险
        - 要求前 10 大客户收入拆分、合同到期日和重新认证条款
      - - 工厂级 EBITDA 利润率和整合指标
        - 对被收购工厂（Cal-Draulics、Electrocube、Payne Magnetics、BC Systems、Electro-Mech），未披露整合前后运营指标
        - 论点依赖靠整合和 RAPID 部署改善利润率；目前无法验证
        - 要求按收购 cohort 提供工厂 P&L；对照 FirstPageSage 约 36% EBITDA 目标
      - - RAPID 平台性能数据
        - 公司声称开发到生产时间缩短 67%+；没有 OEM 确认或第三方验证
        - 核心护城河说法未经验证；若 RAPID 不跑赢行业，估值溢价会跌回纯 M&A 可比水平
        - 要求 OEM 签署的资质完成指标，对比 RAPID 与行业基准时间线
      - - 收购管线和已支付倍数
        - 迄今五笔收购均未披露收购价格
        - 无法评估 Amca 收购倍数是否可持续，或相对退出可比公司是否付得过高
        - 要求所有收购价格、收购时 EBITDA，以及相对 PCE 基准的隐含入场倍数
    notes: 尽调要求按关键性排序。第 1–3 项是以当前估值作出任何投资决定前的必要条件。第 4–6 项是承销牛市情境前的必要条件。截至 2026 年 6 月，上述信息均未公开。
    claimRefs:
