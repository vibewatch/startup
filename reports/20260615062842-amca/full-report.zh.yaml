  - id: TV002
    title: 论点与反论点表
    columns:
      - 论点
      - 类型
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 供应缺口紧迫：美国关键部件供应商长期供给不足，形成被动锁定需求
