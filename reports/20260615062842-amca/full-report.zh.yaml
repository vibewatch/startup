      - number: '5.4'
        title: 质量、合规与反向证据——瓶颈和整合风险
        blocks:
          - type: paragraph
            body: >-
              Amca 的质量与合规底座，是六家旗舰工厂全部具备 AS9100D 认证。IAQG AS9100 标准是航空航天行业强制 QMS
              基线，覆盖风险管理、配置管理、产品安全、防伪件和监管合规。它是必要条件，但并不充分：热处理、化学处理、焊接、无损检测等特殊工艺，还需要单独取得 NADCAP（National Aerospace and
              Defense Contractors Accreditation Program）认证。Amca 尚未公开披露任何被收购工厂的 NADCAP 认证状态；鉴于 Boeing、Airbus、Lockheed
              Martin 和 RTX 的客户下传条款要求相关特殊工艺必须具备 NADCAP，这是实质性尽调缺口。一个零件进入全面生产前，必须按 AS9102 通过 First Article
              Inspection（FAI），生成零件责任、产品责任和特性责任表单。FAI 失败需要根因分析、纠正措施和重新测试；航空航天质量专家引用的复杂部件典型批准周期为 3 到 12 个月。RAPID
              在被收购工厂引入的任何流程变化——新刀具路径、修订作业指导、更新排程——都可能触发重新资格认证和新的 FAI 周期，在 RAPID
              的速度迭代承诺与航空航天认证的监管慢速之间制造结构性张力。此外，跨六家独立收购工厂整合传统 ERP 和质量管理系统，是航空航天 roll-up 中已知的进度和成本超支来源；aicerts.ai
              文章明确指出，Dealroom 分析师警告这一挑战被「consistently underestimated」。这些因素共同圈定了 RAPID 在传统工厂语境中交付其宣称收益的速度边界。
