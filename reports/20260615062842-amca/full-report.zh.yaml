      - - AS9100D QMS（所有工厂）
        - 覆盖所有生产场地的强制质量管理体系认证
        - 由认可注册机构进行年度监督审核；记录工艺变更文件
        - RAPID 推动的快速工艺变更会触发重新审核要求；节奏错配
      - - NADCAP 特种工艺（未披露）
        - 针对热处理、NDT、化学处理、焊接等适用工艺的工艺级认证
        - OEM 下传条款（Boeing BAC、Airbus ABD、Lockheed Q-01）要求适用工艺取得 NADCAP
        - Amca 未披露工厂级 NADCAP 状态；是否满足 OEM 要求仍未验证
      - - 客户 OEM 关系层
        - Boeing、Lockheed、Airbus、RTX 的获批供应商状态；Electrocube 的 Boeing 前 20 排名
        - 按客户要求维护 as-built 可追溯性、准时交付和质量记录
        - 被收购实体所有权转移后，在部分 OEM 供应商资质系统中需要重新批准
