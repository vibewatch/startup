      - number: '1.2'
        title: 领导层、治理与创始人市场匹配
        blocks:
          - type: paragraph
            body: >-
              公开披露的领导层信息仍然有限，但足以确定核心运营团队。发布材料、Craft 公司档案和 Manufacturing Dive 都将 Jai Malik 与 Eli Giovanetti
              列为公司联合创始人，Malik 任 CEO，Giovanetti 任 COO。Giovanetti 曾在 SpaceX 担任高级生产与工程负责人，这给团队带来了与高性能制造和工业执行直接相关的经验。Malik 在
              Amca 之前的经历披露不够清晰，但 Manufacturing Dive 报道称，他曾任 Countdown Capital 普通合伙人，这与公司发布材料中的投资人 - 经营者画像方向一致。Craft 还列出
              Varun Gupta 为董事长，Cal-Draulics 收购新闻稿显示，被收购公司的前所有者 Doug Johnson 加入 Amca
              工程团队。这一点重要，因为它说明公司不只是买资产，也在试图留住被收购工厂的技术知识。主要治理限制在于，Amca
              尚未在官网发布完整董事会页面、股权结构图或长篇创始人传记。因此，投资人可以合理看清两位运营创始人和一位具名董事长，但还看不到完整治理架构，也看不到 Malik 除媒体采访和交易报道之外更充分的履历来源。
