          - type: callout
            title: 六家工厂收购后的资格状态，是实质性未验证缺口
            body: >-
              制造商所有权变更后，OEM 客户和监管方可能要求重新确认新实体的 AS9100D 范围、NADCAP 认证和 FAI 历史。Amca 尚未公开确认六家被收购工厂是否在 Amca
              所有权下保留原有批准，也未说明是否有客户在收购后要求重新检查。这是 data room 尽调问题，且会直接影响收入。
