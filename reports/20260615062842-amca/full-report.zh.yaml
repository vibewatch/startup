      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 击穿投资逻辑的情景——质量外溢与融资挤压同时发生
            body: >-
              Amca 最危险的情景，不是某一项风险单独爆发，而是两个压力源汇合：某个被收购工厂发生质量外溢，触发 Boeing 或 Lockheed 采取围堵措施，同时 Series C 融资市场比超过 $1B 的
              Series B 隐含环境更紧。围堵措施会立刻限制受影响客户的收入，同时要求高资本投入的整改。如果整改与 Series C
              融资重叠，公司最需要证明执行可信度时，反而要面对估值折价。航空航天硬件整合平台多次遇到过这种情景；分水岭在于，留任的业主经营者和 RAPID 平台能否比客户耐心耗尽更快地完成纠正。
            calloutType: risk
            claimRefs:
              - CR010
              - CR016
              - CR033
              - CR042
          - type: callout
            title: 监管合规不透明造成尽调缺口
            body: >-
              Amca 没有发布 CMMC 准备声明、ITAR 合规披露、SPRS
              分数，或任何一家六个工厂的安全证明。对这一阶段的私营公司而言，这并不罕见；但这意味着投资人与客户无法独立评估每个被收购设施的合规状态是否足够。GE Aerospace 的 $36M
              和解涉及持续六年、直到自愿披露前才暴露的违规；MORSECORP 的 FCA 和解则涉及把实际 NIST 分数 -142 自报为 104。风险不在于 Amca
              一定不合规，而在于外部无法独立验证其合规状态。任何准备给出 term sheet 的投资人，都应把披露每个被收购实体的 ITAR 合规审计状态、SPRS 分数和 CMMC 阶段计划作为先决条件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR035
              - CR039
          - type: callout
            title: 劳动力和材料的结构性约束来自外部，而非公司特有
            body: >-
              Amca 的两项实质风险——熟练机加工人才短缺和对钛供应的依赖——都是行业级结构约束，同等影响所有航空航天零部件制造商。如果 Amca
              的整合策略执行到位，这里反而可能形成竞争优势：材料采购的集中规模、跨工厂调配劳动力的能力，提供了单一设施竞争者无法复制的天然对冲。支持投资逻辑的解读是，这些风险会恶化资本不足的传统小厂处境，而这正是 Amca
              正在利用的碎片化。反向解读是，Amca 扩张进这些逆风的速度，快过其整合能力能够吸收的范围。
            calloutType: insight
