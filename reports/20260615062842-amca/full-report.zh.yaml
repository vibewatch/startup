        - 航空航天制造的强制要求；需要持续监督审计
        - 中——收购新工厂扩大审计面；证书失效 = 客户资格取消
        - 高——任一工厂失去 AS9100D = Boeing/Lockheed 资格取消
        - 维持单设施质量管理；跟踪到期日和审计日历
        - 中——每家被收购工厂都必须独立维持认证
        - 要求每个地点提供当前 AS9100D/NADCAP 证书和最近审计发现
      - - False Claims Act / DFARS 网络安全（31 U.S.C. § 3729 et seq.）
        - 美国 DoJ / Civil Division
        - 持续执法；MORSECORP 先例（$4.6M，2026 年 5 月）
        - 中——MORSECORP 的问题是收购后误报 NIST 分数
        - 高——一边接受 DoD 付款，一边误报 NIST/CMMC 分数 = 欺诈敞口
        - 准确完成 SPRS 自评；每个地点进行独立第三方网络安全审查
        - 高——若任何被收购设施在不合规时继续计费
        - 获取每个被收购实体的 SPRS 分数历史和独立网络安全评估
      - - Export Administration Regulations（EAR）/ BIS Entity List（出口管制）
        - 美国 Commerce / BIS
        - 生效中；BIS Entity List 在 2024–2026 年扩张
        - 低中——主要风险是外国公民视同出口规则和下级外国采购
        - 中——可能失去合同并被拒发出口许可证
        - 在采购和招聘流程中持续筛查受限方
        - 低中——没有已知 BIS 针对 Amca 或其收购标的的行动
        - 确认受限方筛查流程和外国公民访问控制
    notes: 严重性和可能性评估基于公开监管文件、DDTC/BIS 执法先例（GE 2026、MORSECORP 2026）和 CMMC 规则制定。截至运行日期，公开记录中未发现 Amca 特定执法行动或诉讼。
