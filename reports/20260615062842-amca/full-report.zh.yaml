  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Amca 的可服务市场始于美国航空航天与国防供应链中的一个具体结构性失灵：精密制造且经过认证的零部件层正在萎缩，而这些零部件必须满足适航和国防认证标准。Amca
              市场中的支出覆盖液压组件、电力分配系统、航空电子外壳、精密加工结构金属件，以及需要制造过程控制和工程认证、才能用于飞行关键和任务关键平台的认证子组件。这些零部件有三个结构性特征，使其不同于商品硬件：它们需要专门认证（AS9100、ITAR、项目特定合格供应商名单认证）；它们通常同时服务新产和
              MRO 两类需求流；它们很难快速替换，因为换新供应商重新认证通常需要 12 到 36 个月。

              核心可服务市场不包括完整飞机平台和武器系统、软件定义航空电子层、商品硬件（单个紧固件、通用连接器、标准轴承）、不含制造内容的纯 MRO 服务，以及缺少 AS9100
              或同等认证的通用工业加工。扩大总机会的相邻领域包括同类零部件的 MRO 售后需求（生产客户会创造持续维修流）、原型和认证测试服务，以及面向主承包商的物流或套件服务。

              Amca 取代或收购的现状替代方，主要是业主老龄化、缺少现代化资本的家族式精密加工厂——NDIA、GAO 和 McKinsey
              分析明确把这类供应商描述为最容易退出、脆弱的下层供应环节。主承包商历史上把其中一部分工作内部化；Boeing 和 Airbus 在 2025 年都把此前外包给 Spirit AeroSystems
              的航空结构生产迁回内部，但这种内包动作只针对平台结构，并不覆盖 Amca 所瞄准的更广泛精密零部件类别。盟友国家的离岸供应商仍可替代非 ITAR 零部件，但在 NDAA 外国采购规则和 NDAA FY2026 第
              833 条供应链照明要求下，监管摩擦正在上升。AS9100 认证覆盖约 45% 的美国精密加工厂，说明合格供应商池有限，新增认证产能并不容易。
