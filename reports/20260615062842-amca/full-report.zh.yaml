      - number: '4.3'
        title: 成本结构、单位经济与利润率基准
        blocks:
          - type: paragraph
            body: >-
              Amca 所处赛道已有上市同行证明：受单一来源和资质保护的航空航天部件制造，可以维持异常高的利润率。HEICO 向 SEC 提交的 2025 财年 10-K 确认，合并毛利率为 39.8%（高于 FY2024 的
              38.9%），SG&A 占净销售额 17.1%。TransDigm 在 FY2026 Q1 的 EBITDA As Defined 利润率为
              52.4%，靠收购单一来源部件特许业务、并随时间释放定价权支撑。规模较小的 Ducommun 在 2026 年 Q1 报告毛利率 26.9%、调整后 EBITDA 利润率 16.9%。2026 年 Q1 TTM
              航空航天与国防行业毛利率中位数约 18.7%，EBITDA 利润率中位数为 12.2%；HEICO 和 TransDigm 这类上四分位公司明显高于常态。

              Amca 的单位经济无法直接核验，因为公司尚未发布经审计财务报表。其收购工厂覆盖传统精密机加工和电力电子业务；按独立航空航天车间典型收入规模，每家年收入可能贡献 $2 million 到 $20
              million。五家工厂在收购后早期合计，粗略年化收入 $10 million 到 $100 million 有可能，但仍属推测。新收购传统车间的毛利率往往受递延资本投入、整合成本和劳动力转换压缩——这正是
              Amca 现代化论点声称要解决的成本改善机会。Series B 阶段制造硬件初创公司通常每月总 burn 为 $600,000 到 $2 million；若工厂 capex 和扩招同时推进，burn
              会更高。考虑到 Amca 并行收购，其消耗可能显著更大。

              直接人工方面，NAICS 3364 航空航天精密机加工劳动成本指数（由 Federal Reserve 的 FRED 跟踪）持续上升，反映熟练工短缺；这本身就是 Amca 整合论点的结构性驱动因素。AS9100D
              认证车间的管理费用通常为直接人工成本的 100% 到 150%。这些结构性成本投入意味着，新整合工厂早期利润率很可能处于或低于行业中位数；向 HEICO 式利润率收敛，需要持续定价权和 RAPID
              设计要交付的效率增益同时成立。改善路径是投资论点，还不是已证明的结果。
