      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              超过 $1B 的投后估值，会随着 Amca 收入轨迹、整合执行和倍数环境在典型投资人承销的三到五年持有期内如何演变，导向三种差异明显的投资结果。

              牛市情景假设，Amca 所称 10 倍增长对应的年化收入运行率已经达到 $100–150M，并在新增收购和 RAPID 带来的生产率提升下继续以每年 40%+ 增长。在这种情景下，Amca 已经走在类似 Loar
              Holdings 的轨道上：连续三年有机增长 15%+，加上 M&A 增强后的混合增长 25–30%，四年内走向 $400–600M 收入。按 Loar 当前 13.5x EV/Revenue 倍数，四年后
              $500M 收入的业务可获得 $6.75B 企业价值——即便计入稀释，也能相对当前 $1B 估值带来可观回报。牛市情景要求 OEM 资质认证护城河守得住，没有重大客户集中度问题，且 M&A
              交易流持续提供价格合理的优质传统工厂。整合也必须足够克制，让合并 EBITDA 利润率达到 30%+，而不是滑入低质量制造业整合平台的 10–15% 区间。

              基准情景假设，Amca 在 Series B 时年化收入为 $50–100M，包含新增收购在内每年增长 20–30%。四年后收入达到 $200–350M，整合平稳推进，但速度不足以建立售后市场加权或 RAPID
              变现的差异化，因此拿不到溢价倍数。退出倍数为 8–12x 收入（与 Moog/Ducommun 或中端市场 M&A 可比公司一致），对应企业价值 $1.6–4.2B；按当前入口价可产生 1.6–4.2x
              回报，但前提是还要经历额外融资稀释以资助收购。基准情景支持继续研究或跟踪的立场：业务大概率创造价值，但当前价格已经把牛市情景计入。

              熊市情景假设整合摩擦、客户集中度风险兑现，或 A&D 风险投资板块倍数压缩。收入增长停在每年 15%，或因交易倍数上升导致收购节奏放慢。10 倍增长说法的分母被证明是很小的基数（2025 年初始收入
              $5–10M），使 Amca 在 Series B 时收入只有 $50–60M。下一次资本需求在 EBITDA 盈亏平衡前到来，降估值融资风险上升。按 FirstPageSage 2025 年 Q1
              中位区间数据，小收入 Military & Defense 公司对应的私营交易收入倍数为 3–5x，企业价值将为 $150–300M——低于已经投入的 $376.5M，并让后期 Series B
              投资人承受资本损失。熊市情景不是最可能结果，但也不遥远；它只要求已披露指标最终代表的绝对收入基数小于牛市情景假设。
