      - number: '1.4'
        title: 里程碑、收购与未解尽调问题
        blocks:
          - type: paragraph
            body: >-
              对一家年轻公司来说，Amca 的里程碑记录已经相当密集。公开发布材料把初始策略与收购 Electro-Mech Components 绑定，后续披露又确认 Cal-Draulics 和 BC Systems
              也被纳入网络。官网现在列出六家从传统供应商继承而来的旗舰工厂，创立时间最早可追溯到 1950 年代，这强化了 Amca
              所说的模式：改造既有工厂，而不是用完全绿地新产能替代它们。与此同时，公开记录仍留下几个投资关键缺口。第一，虽然招聘页面清楚显示公司在扩张，但仍没有经过验证的员工数。第二，客户广度通过具名主承包商和平台覆盖作了定性描述，但公司没有发布当前客户数量或集中度拆分。第三，Malik
              的过往背景没有像 Giovanetti
              那样被同等深度地记录。第四，六处与七处设施的口径差异说明，公司版图扩张速度快于公开披露的一致性。最后，已审阅材料中唯一公开收入信号，是公司自报营收较上一年订单收入增长十倍；这个方向性信号有意思，但没有基数、时间段或财务报表，无法承销。这些不是否定故事的理由，却足以要求在报告其他地方复用标题指标前，保留明确尽调问题。
