  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与具名平台覆盖
        blocks:
          - type: paragraph
            body: >-
              Amca 作为 Tier-2 航空航天与国防部件供应商运营，这意味着其直接买方和付款方是主承包商（OEM）和 Tier-1 系统集成商，而不是飞机或武器系统的最终用户。买方 / 付款方包括
              Boeing、Lockheed Martin、Northrop Grumman、Airbus、Embraer、Honeywell 和 Raytheon——这些均在 2026 年 5 月 Series B
              新闻稿中明确点名——另有 CEO Jai Malik 同周媒体露面提到的 BAE Systems、GE Aerospace、Textron 和 Bombardier。公司也直接供应美国军方保障项目，付款方为
              DoD 或 Defense Logistics Agency，最终用户是作战人员。第六条收入流来自 BC Systems，后者在未披露的机密项目上只服务军方客户。地理上，考虑到 Amca
              工厂布局和安全许可需求，客户基础以美国本土为主；但与商用
              OEM（Airbus、Embraer、Bombardier）的关系把覆盖延伸到欧洲和巴西项目。按垂直领域，客户基础覆盖商用航空（737、747、757、767、777、A320、E-jets）、国防航空（F-35、F-16、F/A-18、F-15、C-17）、地面系统（M1
              Abrams）和海军（Mk-48 鱼雷）。公司未公开披露任何按分部、地域、客户或平台拆分的收入；上述分层基于官方新闻稿、产品页和媒体报道中提取的具名平台和客户引用。
