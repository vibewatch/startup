      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              关键任务航空航天与国防零部件制造的市场机会，由多项独立来源广泛确认的结构性需求因素驱动；但认证壁垒、劳动力短缺和资本要求限制了任何供应商扩产速度。

              最重要的需求驱动因素，是创纪录国防预算与创纪录商用生产积压同时出现。PwC 2026 年报告记录，航空航天与国防行业 2025 年年收入首次突破 $1 trillion，国防积压三年内增长超过 50%。到
              2025 年底，Boeing 与 Airbus 合计商用积压达到 15,461 架，按当前产量代表超过 11 年生产。Deloitte 2026
              年展望称，随着国防主承包商计划提高导弹、弹药、无人机和飞机产出，供应链脆弱性预计至少到 2027 年都会加剧，并给供应商基础的每一层施压。AlixPartners 将该行业描述为面临「一代人一次的需求激增」。

              第二个结构性驱动因素，是中小供应商流失加速。NDIA Vital Signs 2026 调查记录，与 2025 年报告相比，国内单一 / 独家来源供应商流失增加 7%，国际单一 / 独家来源供应商流失增加
              11%。McKinsey 提到，过去十年国防工业基础中的小企业数量下降超过 40%，未来十年还可能再失去 15,000 家供应商。GAO-25-107283 确认，DoD 超过 200,000
              家供应商构成的供应链中，许多关键零部件类别只有「三家或更少」合格国内供应商。由于认证需要 12–36 个月，绿地进入者无法在短时间内填补这些缺口。

              政府政策放大需求：FY2026 法案允许 Office of Strategic Capital 提供超过 $4.3 billion 信贷来扩展关键供应商；Defense Production Act
              激励推动国内采购；国会批准 NDAA FY2026 第 833 条供应链照明豁免。按 AMT 数据，截至 2026 年 4 月，美国制造技术订单同比激增 28.9%，NTMA 调查受访者中 69%
              报告经营环境为正面。回流也在进行，24% 的 NTMA 会员工厂报告过去六个月回流增加。

              约束端，供应商认证周期仍是首要采用瓶颈。TD Securities 2026 A&D 会议指出，国防制造业约有 800,000 名工人缺口，并把制造产能约束定义为「国家安全紧急事件」。所有 NTMA
              调查受访者都把员工招聘列为首要挑战，60% 的精密加工公司报告 CNC 编程和 5 轴加工技能缺口。结构材料约束仍在：Astral Air Parts
              记录，钛和镍基管材交期仍显著高于疫情前水平，发动机零部件铸件和锻件面临多阶段工序排队，需要持续多年投资才能解决。GAO
              发现，美国只有一家铸造厂能够为关键武器系统生产大型钛铸件；中国对镓和锗的出口限制也直接冲击军用级电子供应链。这些约束既是新供应商的进入壁垒，也同时给具备资质且掌握产能的既有供应商带来定价权，例如 Amca
              正在收购的传统工厂。
