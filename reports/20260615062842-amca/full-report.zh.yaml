      - number: '7.3'
        title: 客户集中度与需求周期风险
        blocks:
          - type: paragraph
            body: >-
              Amca 公开具名客户集由 Boeing、Lockheed Martin、Airbus、Raytheon、Northrop Grumman、Honeywell 和 Embraer
              主导。公司未披露收入集中度数字，但传统收购标的（Electro-Mech、Electrocube、ACPI）各自都拥有高度集中的关系：Electrocube 在 5,000 多家 Boeing 直接供应商中排名前
              20，质量记录近乎完美，意味着其收入很大一部分来自单一客户。Angel Investors Network 引用的私募股权尽调基准显示，早期国防部件企业典型客户集中度为前三大客户贡献 60-80%
              收入。Boeing 的财务脆弱性会放大集中度风险：其 Commercial Airplanes 部门预计要到 2027 年才恢复盈利，2025 年亏损 $632 million，并预计 2026 年 Q1
              经营利润率亏损 7.5% 到 8%。Boeing 任何新的质量事件、FAA 指令或生产中断，都会立刻传导成 Boeing 项目供应商的数量调整、回款周期拉长和遏制要求。Fitch Ratings 提醒，尽管
              Tier-1 供应商关系改善，Boeing 供应链稳定仍因关税和地缘政治紧张残留风险。对偏国防的收入流，项目集中风险以另一种方式运作：单个项目取消或多年延误（例如 F-35 TR-3 软件 backlog
              反复出现）可能使平台专用供应商可服务收入减少 30-40%。国防预算不确定性同样重要：FY2026 国防拨款在两党支持下超过 $850 billion，但 FY2027 过渡期若出现
              continuing-resolution 风险，可能冻结新合同启动并推迟交付排程，给硬件密集型供应商制造营运资本压力。商用航空需求周期性又增加第二重波动：2025 年 5 月行业 16,000 架飞机的创纪录
              backlog 反映需求，但 Cylad 指出交付量仍比 COVID 前峰值低 10%；任何需求走弱冲击（燃油价格、地缘政治扰动、航空公司倒闭）都可能在两到三个季度内传导为 OEM 降低生产率。
