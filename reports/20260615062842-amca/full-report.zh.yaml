  - id: TE002
    title: 工作流 / 用例表 — RAPID 平台阶段和收益
    columns:
      - 工作流阶段
      - 传统 / RAPID 前做法
      - Amca / RAPID 方案
      - 宣称收益
      - 已知限制
    rows:
      - - 需求接收与设计工程
        - CAD/CAM 工具彼此割裂，人工设计评审，迭代耗时数周
        - AI 驱动的物理仿真；快速工程反馈；可制造性分析
        - 并行迭代把设计周期从数月压到数周（公司说法）
        - 速度提升没有独立基准；方法未发布
      - - 快速原型
        - 外包原型供应商；交付周期数周；供应商协调成本高
        - El Segundo 自有设施结合传统制造 + 增材制造；同一团队迭代
        - 消除供应商之间的交接；公司称原型由软件驱动
        - 产能限于 El Segundo；增材制造仅适合原型阶段
      - - 鉴定测试
        - 第三方测试实验室；排期延误；FAI 周期通常长达数月
        - 内置 DO- 和 MIL-STD 基础设施；测试自动化工装；内部控制测试活动
        - 测试活动控制更紧；降低对外部供应商的依赖（公司说法）
        - FAI 3–12 个月的时间线由监管要求结构性驱动，不只是物流问题
      - - 技术文档
        - 手工文档；与制造割裂；审计准备形成瓶颈
        - RAPID 内置数字合规跟踪；在整个工作流中生成 AS9100 记录
        - 自动化审计轨迹；更快准备监管方和 OEM 审查
        - 六家工厂都必须持续一致录入数据；ERP 大规模集成存在风险
      - - 规模化工厂生产
        - 转移包周期长；每次工艺更换供应商都要重新鉴定
        - 先在 El Segundo 做小批量验证，再转移到旗舰工厂
        - 已验证工艺包可减少生产工厂返工
        - 工厂端任何由 RAPID 驱动的工艺变更都可能触发重新 FAI；审批周期重启
    notes: 基于 Amca 官方网站（who-we-are 页面）以及新闻稿对 RAPID 的描述。宣称收益为公司说法；67% 周期缩短尚未经过独立审计。限制来自行业标准（AS9102 FAI 要求、AS9100D 工艺变更控制）。
