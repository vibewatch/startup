      - number: '5.3'
        title: 差异化论点——AI 与软件可能在哪里形成、或无法形成持久护城河
        blocks:
          - type: paragraph
            body: >-
              Amca
              的差异化论证建立在三层叠加主张上：（1）把设计到生产工作流垂直整合进单一平台，消除拖慢传统供应商的跨供应商交接；（2）合格零件几何、工艺参数和测试结果构成自有数据集，随时间复利成自强化数据飞轮；（3）AS9100D
              数字合规追踪降低航空航天主承包商审计摩擦。这些主张方向上合理：Fictiv 2026 State of Manufacturing 报告发现，97% 的制造和供应链领导者表示 AI 已嵌入核心工作流；Primus
              Aerospace 2026 展望也把数字主线和数字孪生采用列为前三大制造趋势。但这些护城河机制尚未针对 Amca 得到独立验证。67%
              交付周期缩短是公司口径，没有具名独立审计方，也没有发布方法论。自有数据飞轮要求每家被收购工厂按一致 schema 把生产数据上传到 RAPID——Dealroom 分析师和行业观察者警告，快速 roll-up
              模式总会低估这种整合工作。关于航空航天 AI 资格认证的行业分析一贯指出，模型透明度、高重新认证成本、监管缓慢接受 AI
              生成合规证据，都会限制软件护城河在受监管制造中的持久性。与之相对，公司确实拥有物理护城河：产品批准、AS9100D 认证、以及 Electrocube 和 Payne Magnetics 花数十年积累的长期
              OEM 关系，不是纯软件进入者能快速复制的。最稳妥的解释是，RAPID 加速物理资产基础内的整合和迭代，但真正更难复制的竞争层，是物理资产——工厂认证、客户批准和专业机构知识。
