      - number: '8.2'
        title: 估值背景、可比公司集合与市场倍数基准
        blocks:
          - type: paragraph
            body: >-
              Amca 超过 $1B 的估值必须放在三个不同参照系里看：上市航空航天零部件制造商、近期私营防务科技独角兽融资轮，以及航空航天与防务供应链板块已披露的 M&A 交易倍数。每个参照系给出的当下估值位置都很不一样。

              在上市航空航天零部件制造商中，溢价锚由 TransDigm Group (TDG) 设定。截至 2026 年 6 月，TDG 企业价值为 $98.4B，对应 $9.5B 的过去 12 个月收入（截至 2026 年
              3 月）和 $4.8B EBITDA，意味着 EV/Revenue 约 10.4x、EV/EBITDA 约 20x。TransDigm 的高倍数来自单一来源、售后市场占比高的商业模式，能产生约 60% 毛利率和约
              51% EBITDA 利润率；Amca 目前还不能声称具备这些能力。HEICO Corporation (HEI) 的 EV/EBITDA 更高，约 35x，对应 $4.9B 收入和 28% EBITDA
              利润率，反映增长溢价。Loar Holdings (LOAR) 是与 Amca 收购驱动模式最接近的上市可比公司；截至 2026 年 6 月，Loar 企业价值 $7.24B，对应 $538M LTM
              收入（EV/Revenue 约 13.5x）和 $193M EBITDA（EV/EBITDA 约 37x）。此前 Loar 在 2024 年实现 15% 有机增长和 20%+ 的 M&A 增强增长；Sahm
              Capital 分析师认为这些倍数已经相对行业同业有显著溢价。Damodaran 2026 年 1 月数据中，Aerospace and Defense 板块 79 家 EBITDA
              为正的美国公司，EV/EBITDA 中位数为 21.58x。

              在私营防务科技独角兽中，板块正经历估值热潮。Anduril Industries 2026 年 5 月估值升至 $61B，约 12 个月翻倍，由 2025 年 $2.2B 收入支撑（约 28x
              收入）。Shield AI 2026 年 3 月以 $12.7B 估值融资 $1.5B，较 2025 年 3 月 $5.3B 估值提高 140%，其预计 2026 年收入为 $540M（约 23x
              收入）。两家公司都是软件占比高的自主系统平台，拿到的是 AI 与军民两用溢价，不适用于 Amca 的制造业整合模式。

              航空航天与防务板块 M&A 交易方面，PCE Investment Bankers 2026 年 Q1 更新追踪了过去 12 个月 137 笔交易，中位数为 18.87x TEV/EBITDA 和 3.74x
              TEV/Revenue。最高倍数出现在防务电子、空间系统和自主系统。对拥有传统供应商基础的任务关键制造业，First Page Sage 的私营交易数据给出 2025 年 Q1 Military &
              Defense 公司约 7.7–14.7x EBITDA 倍数，取决于 EBITDA 规模。这些交易数据说明，私营 M&A 市场并不会按软件式倍数给防务制造初创公司定价；除非收入显著高于最保守估计，否则从超过
              $1B 的估值反推到合理收入区间，Amca 当前隐含收入倍数相对私营 M&A 交易基准偏紧。
