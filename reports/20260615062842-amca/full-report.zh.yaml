      - number: '8.5'
        title: 退出准备度、稀释悬垂与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Amca 最可能的退出路径是：(1) 三到七年内被防务主承包商或 PE 支持的航空航天整合平台战略收购；(2) 等多年度经审计财务到位后，仿照 Loar Holdings IPO；或 (3)
              如果增长延续，以更高估值进行二级出售或部分延续轮。两轮合计融资 $376.5M、投后估值超过 $1B，意味着优先权和清算栈高度取决于 cap table 中协商的投资人权利，而这些并未公开披露。Series B
              常见稀释和优先权悬垂模式表明，完全稀释后约 35–50% 股权可能已经分配给投资人；后续轮投资人持有清算优先权，在中等倍数退出中可能压低普通股回报。

              PCE 2026 年 Q1 M&A 市场更新显示，在过去 12 个月 137 笔航空航天与防务交易中，战略买家占 83.9%，财务赞助方占 13.1%，并强调买家积极关注任务关键制造资产。同一报告给出过去 12
              个月倍数中位数：18.87x EBITDA 和 3.74x 收入，为战略买家愿意支付的价格提供了最新公开锚。按这些倍数，并假设 Amca 第五年达到 $200M 收入和 25% EBITDA 利润率（$50M
              EBITDA），M&A 退出价值约为 $750M–$940M——仅略高于当前投后估值，并低于未来融资后的总投入资本。这个算式说明，Series B 投资人要获得满意回报，要么退出时拿到优于同业的倍数（需要
              RAPID 验证过的差异化），要么收入显著高于保守估计。

              在把建议上调为买入或跟踪前，最终尽调问题包括：公司成立以来的经审计财报；详细 cap table 和优先权 waterfall；客户集中度拆分；每个被收购工厂整合前后的工厂级 EBITDA 利润率；经 OEM
              确认的 RAPID 平台吞吐指标；以及剩余收购管线与交易倍数的披露视图。没有这些信息，按当前价格仍无法承销这笔投资。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
