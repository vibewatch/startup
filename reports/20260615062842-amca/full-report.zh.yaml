  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与类别地图
        blocks:
          - type: paragraph
            body: >-
              Amca
              所处市场没有一个占据主导地位的直接类比对象。没有任何上市公司采用完全相同的模式：收购并现代化改造陷入困境的传统零部件供应商，同时把设计、认证测试和认证制造整合到一个软件赋能工作流中。因此，竞争场域必须按四类来绘制，而不能照搬单一同行名单。

              第一类，也是商业上最可见的一类，是拥有成熟长期生产合同的上市既有制造商。TransDigm Group、HEICO Corporation、Ducommun Incorporated、Moog Inc. 和
              Albany Engineered Composites（Albany International 的一个分部）都在 Amca 瞄准的一个或多个商用与国防平台上占有位置。它们的规模——从 Ducommun 约
              $840 million 年化 2026 收入，到 TransDigm 接近 $10 billion——在认证深度、客户触达和资产负债表韧性上形成不对称，Amca 必须正视。

              第二类是现状本身：数千家单店独立精密供应商，多数由业主经营，很多成立于 1950–1970 年代，持有既有认证批准，但越来越容易受数字化要求、网络安全合规（CMMC）、劳动力传承失败，以及无力购买新 CNC
              设备或升级 AS9100 的影响。这些工厂是 Amca 的主要收购目标，也不那么有意识地成为私募股权 roll-up 买家和其他中型整合者的目标。NDIA Vital Signs 2026 报告和 GAO
              工业基础分析确认，供应商基础收缩是结构性趋势，而非周期性现象。

              第三类是 OEM 内部制造。Boeing 2025 年 12 月以 $4.7 billion 收购 Spirit AeroSystems——重新吸收 737、767、777 和 787 机身制造——表明
              Tier-1 结构件工作可以迁回主承包商内部。这个威胁真实存在，但被限制在超大型航空结构项目；低于该层级的关键任务零部件（液压作动器、电力分配单元、精密航空电子外壳），按当前 OEM 投资水平，并不是 OEM
              内部制造候选项，因为复制既有合格供应商网络所需的复杂度和资本过高。

              第四类是相邻技术进入者：增材制造平台和数字制造创业公司，它们可能在 5–10 年维度降低认证壁垒。近期看，这一威胁仍偏推测，因为 FAA 和 DoD 认证流程尚未完全接纳用于飞行关键金属零部件的
              AM，但它代表最具结构性颠覆力的长期情景。
