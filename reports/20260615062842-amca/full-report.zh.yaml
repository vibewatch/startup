        - 如果 DoD 大幅提高内部生产，或建立替代性美国国内供应
      - - 收购模式利用既有 OEM 资质，把 GTM 缩短数年
        - 论点
        - Cal-Draulics、Electrocube、Payne Magnetics、BC Systems 收购已确认
        - 如果收购后需要重新认证，或 OEM 重新 sourcing 覆盖继承资质
      - - Tier-1 投资人财团（a16z、Lightspeed、Lux）验证机构尽调质量
        - 论点
        - Series B 新闻稿和 Crunchbase 独角兽董事会确认投资人名称
        - 如果投资人存在公开声明未反映的重大非公开保留意见
      - - RAPID 平台把开发到生产时间缩短 67%+
        - 论点
        - 公司自称；未获 OEM 或外部审计方独立验证
        - 如果 OEM 公开确认 RAPID 改善时间线
      - - $1B+ 标记下未披露经审计收入、EBITDA 或客户集中度
        - 反论点
        - 财务章节确认没有公开财务报表；十倍增长说法不可验证
        - 如果公司发布 S-1 或经审计财务，确认收入规模
      - - 18 个月整合五笔收购，且未披露整合指标，风险很高
        - 反论点
        - 多地域、多产品线带来 roll-up 执行风险；未披露质量 / 利润率数据
        - 如果公布工厂级 EBITDA 利润率和准时交付指标
      - - 资本强度和优先权包袱会压缩基础退出情境下普通股回报
        - 反论点
