      - number: '3.3'
        title: 现状、替代方案与 OEM 内部制造
        blocks:
          - type: paragraph
            body: >-
              按持有合同数量看，最大的单一竞争者是现有单店独立精密供应商生态。这些工厂通常少于 100 人，经常由业主管理，很多成立于 1950–1970 年代，合计持有大量既有国防和商用零部件认证批准。它们依靠既有
              approved supplier list（ASL）位置和与项目办公室的成熟关系竞争，而不是依靠速度、广度或一体化工程。它们的脆弱点有充分记录：劳动力老龄化且没有接班管道，无力出资升级 AS9100 或满足
              CMMC 网络安全合规，手工流程无法满足主承包商新兴数字集成要求，以及营运资本周期与长周期项绑定导致财务脆弱。NDIA Vital Signs 2026 和 GAO
              工业基础分析确认，这些工厂退出供应基础的速度快于新产能进入速度。这种流失正是 Amca 通过收购来捕捉的结构性机会。

              分销商和经纪网络是买方在主要供应商错过交付窗口时使用的第二类现状替代方案。这些中介持有认证库存，或从多家工厂采购，形成缓冲，但不增加制造能力。它们不是 Amca 模式的战略威胁，因为 Amca
              聚焦能力建设，而不是分销。

              OEM 内部制造路径——以 Boeing 2025 年 12 月以 $4.7 billion 重新吸收 Spirit AeroSystems 为例——对于超大型航空结构项目是可信替代方案。Boeing 的
              Spirit 交易增加 15,000 名员工，并吸收 737、767、777 和 787
              的商用机身生产。这种内包逻辑不容易延伸到更低层级的关键零部件，例如液压作动器、电力分配组件或精密航空电子外壳，因为任何单一零部件族的体量，都不足以证明资本投入、认证开销和劳动力需求的合理性。因此，Boeing-Spirit
              交易是一个边界清晰的先例，最适用于航空结构 Tier-1 相邻领域，对 Amca 的具体零部件重点相关性较低。

              Amca 2026 年 2 月收购 Payne Magnetics——一家成立于 1950 年代的 Southern California 电力电子供应商——展示了 Amca
              收购并现代化论点的实际落地。该交易把一家传统合格供应商加入 Amca 网络，与 Cal-Draulics（液压）和 BC Systems 收购采用同一模板。没有一家上市既有公司正在执行可比
              roll-up，专门瞄准关键零部件细分中已预认证但投资不足的单店传统供应商；这构成 Amca 近期最可防守的竞争差异化。
