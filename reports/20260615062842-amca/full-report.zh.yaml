      - number: '4.4'
        title: 财务披露缺口、反向证据与尽调结论
        blocks:
          - type: paragraph
            body: >-
              最主要的反向财务证据，是 Amca 公开披露资本与公开披露财务产出之间的结构性错配。公司已融资 $376.5 million，估值超过 $1
              billion，但尚未发布经审计收入、毛利率、客户集中度、现金头寸或收购价格。十倍增长说法没有分母，也没有审计。这对一家成立 18
              个月、且确有竞争隐私需求的公司并不罕见，但对任何试图做财务承销的投资人而言，这是实质性缺口。

              几个结构性反向信号需要强调。第一，航空航天制造整合的资本强度与软件业务显著不同。TransDigm 的经验说明了这条路径：收购单一来源特许业务需要支付溢价，形成高商誉负担（资产的
              59%）和利息费用义务（FY2026 H1 为 $959 million），并依赖稳定售后市场需求偿付。Amca 仍处于这条路径的早期股权阶段，但随着其部署 $300
              million、并可能继续融资，资本强度会加剧。第二，Breaking Defense 2026 年 4 月分析指出，VC
              支持的国防硬件公司有三类特定风险：生产规模下无法达到运营性能、客户未能把采购支出转向新进入者、以及投资人缺乏耐心承受远超软件开发周期的时间线。第三，A&D 行业毛利率中位数 18.7%、EBITDA 中位数
              12.2% 表明，国防部件制造并非普遍高毛利；TransDigm 和 HEICO 的利润率来自数十年单一来源特许业务积累，一家两年公司尚不能可信地主张已经拥有。

              财务结论是：以当前阶段看，Amca
              资本位置很强；具名客户基础提供了有意义的商业验证；收购模型瞄准真实供应链脆弱性，价值创造路径也合乎逻辑。尽调阻塞点——缺少经审计财务、收购经济性未知、单位经济未确认——可通过标准 data room
              审查解决，但无法仅靠公开来源解决。本章建议只把 Amca 自报财务指标视为方向性信号；在任何财务建模前，必须要求完整经审计 P&L、按产品线拆分的毛利率、按客户拆分的 backlog，以及 24 个月现金预测。
