      - number: '6.3'
        title: 采购路径、资格动态与结构性留存
        blocks:
          - type: paragraph
            body: >-
              在航空航天领域，供应商关系不是简单的 vendor 合同。部件进入生产前，供应商必须取得 AS9100D 质量管理认证，按 Boeing 的 AS9102 对齐项目完成 First Article
              Inspection（FAI），通过任何特殊工艺所需的 NADCAP 认证，并进入 OEM 合格供应商名单。Boeing 官方供应商门户记录了这些要求；Lockheed Martin
              供应商项目也设置了类似结构的资格门槛。对国防标准零件而言，Defense Logistics Agency 的 QPL 流程还会从首次申请到列名增加 6 到 12 个月以上。QSTRAT 和 KDM
              Associates 的行业研究确认，Tier-2 供应商合同通常期限为 1 到 5 年，绑定项目生命周期而非年度续约；既有供应商因切换摩擦推动，合同续约率达到 80% 到 90% 以上。即将到来的 IA9100
              标准更新——预计 2026 年底发布——将要求所有认证供应商实施实时统计过程控制、增强预测质量系统，以及更深的次级供应商监督，这会给 Amca 六家工厂带来过渡合规义务。Amca
              的获客策略预设了这些壁垒：ACPI 和 Electrocube 产品页均明确提供「no NRE charges」，并把继承来的资格历史包装为价值主张，将子品牌定位为客户在遭遇交付周期或质量问题时的
              second-source 备选。因为部件已经获批用于目标平台和项目，这一模式降低了初始摩擦——但这些批准在 Amca 新所有权下的结构完整性，仍是未验证的尽调问题。公司没有发布 NRR、GRR 或 churn
              数据；留存论点依赖继承来的切换成本和工业逻辑，而非 Amca 自身 cohort 证据。
