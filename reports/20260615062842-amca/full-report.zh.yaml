        title: 图表
        blocks:
          - type: callout
            title: 结构性供应缺口强化平台级需求逻辑
            body: >-
              来自 GAO、NDIA、McKinsey 和 TD Securities 的证据指向同一个结论：美国国防工业基础失去认证下层供应商的速度，快于新供应商取得认证的速度，主承包商也无法只靠内包填补缺口。Amca
              的收购模式正面瞄准这个结构性空洞——继承合格产能，而不是等待绿地认证 12–36 个月。
