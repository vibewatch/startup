      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 相对既有模式的空白定位
            body: >-
              五家上市既有竞争者——TransDigm、HEICO、Ducommun、Moog 或 Albany AEC——都没有瞄准 Amca 所追求的特定组合：收购、留住劳动力，并通过一体化 RAPID
              平台实现现代化。TransDigm 和 HEICO 都收购传统工厂，但目的分别是定价权（TransDigm）或售后目录扩张（HEICO），而不是工程驱动的重新认证。这留下一个结构性缺口，Amca
              正借助资本和速度优势切入。
            calloutType: strength
            claimRefs:
              - CP004
              - CP013
              - CP036
              - CP039
          - type: callout
            title: 收购后的认证重新验证是隐藏时间线风险
            body: >-
              Amca 收购传统工厂时，会继承工厂既有认证批准；但客户和项目办公室通常要求重新验证新法律实体的质量体系，然后才恢复生产。重新验证可能短至数周（简单所有权变更确认），也可能长达 12+
              个月（关键零部件完整首件重新认证）。如果多笔收购的重新验证时间线同时拉长，Amca 的收入爬坡可能落后于收购节奏。
            calloutType: risk
            claimRefs:
              - CP033
              - CP034
          - type: callout
            title: 反向证据——TransDigm 的定价模式构成监管警示
            body: >-
              TransDigm 有记录显示拒绝向 DoD 提供成本和定价数据——参议员 Warren 和 Garamendi 引述 Defense Logistics Agency 的 401
              项未答复请求——并利用「commerciality」漏洞规避 TINA 披露要求。这些都说明，过度依赖单一来源锁定来获得定价权，会带来声誉和监管风险。虽然 Amca
              模式并非同类定价权玩法，投资人仍应关注：随着公司扩张，Amca 是否透明管理其收购而来的单一来源位置，以避免类似国会审查。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP040
          - type: callout
            title: Boeing-Spirit 回收重设 OEM 自制与外采边界
            body: >-
              Boeing 以 $4.7B 重新收购 Spirit AeroSystems——在 Tier-1 机身制造外包二十年后——重新校准了 OEM 内包的理论上限。不过，这笔交易由 737 MAX 的安全 /
              质量失败推动，而非普遍性的内包战略偏好。Tier-1 航空结构规模以下的任务关键零部件（液压、电力分配、精密航空电子外壳）目前仍明显超出 OEM 内部制造的经济范围，因此对 Amca 产品重点的直接威胁有限。
            calloutType: insight
