      - number: '3.4'
        title: 能力、认证与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              横跨整个竞争场，国防和商用主承包商选择关键零部件供应商时的核心购买标准包括：（1）在具体项目或类似平台上已有认证；（2）AS9100 认证以及相关 NADCAP 特殊工艺认可；（3）ITAR 注册和 DFARS
              合规；（4）覆盖客户所需零部件族的能力广度；（5）交期表现和交付可靠性；（6）工程支持能力——能够协助可制造性设计、认证测试和技术文档。

              Amca 的差异化主要落在（4）、（5）和（6）：其 RAPID 平台声称可较行业常态缩短硬件交期超过
              67%，把工程、原型和认证制造整合进一个工作流，也以单店供应商——以及大多数大型上市既有企业——难以匹配的方式解决（6）。在（1）和（2）上，Amca
              从被收购工厂继承认证批准，比从零建设更快，但收购方接手后仍需客户验证。相对拥有数十年成熟批准的既有企业，这是近期缺口。

              分销与 GTM：TransDigm 和 HEICO 都通过直接 OEM / 航空公司关系，以及售后零部件分销伙伴网络销售。Ducommun 和 Moog
              主要通过由项目办公室关系管理的长期项目生产合同销售，而非分销商。Amca 当前客户关系（Boeing、Lockheed Martin、Airbus、Embraer、Honeywell、Northrop
              Grumman、Raytheon）显示，它更像直接触达主承包商，而不是依赖分销层；但这些关系的深度和合同结构未公开披露，需要在尽调资料室验证。

              任务关键零部件细分中，所有竞争者的定价要么在长期生产合同下协商（Ducommun、Moog、Amca），要么由单一来源批准叠加有限公开标价驱动（TransDigm、HEICO
              售后）。该领域没有任何竞争者的公开定价数据，Amca 也不发布价格。定价对比表在缺少一手数据时，把所有单元格标记为未知或基于推断。
