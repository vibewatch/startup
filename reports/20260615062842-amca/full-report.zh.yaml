      - number: '7.4'
        title: 供应链、劳动力与材料风险
        blocks:
          - type: paragraph
            body: >-
              两个结构性瓶颈——钛供应和熟练工——可能独立于 Amca 自身执行而约束其增长轨迹。钛方面：中国在全球钛金属产量中的份额从 2019 年约 40% 飙升至 2025 年超过 75%；自内华达 Henderson
              工厂 2020 年关闭以来，美国钛海绵完全依赖进口。Project Blue 警告，中国可能把钛出口武器化，延误 Boeing、Airbus 和美国国防项目生产——正如锑所展示的那样，出口限制导致出货量下降
              97%、价格飙升 200%。国防投资公司 nai500 称，钛最多可占 F-15 结构重量的 40%；供应中断会直接冲击航电、液压和结构系统的航空航天部件制造。DoD 于 2025 年向 IperionX 授予
              $47.1 million，帮助重建美国本土钛产能，但分析师不预计本土供应在 2027-2028 年前达到有意义的航空级规模。劳动力方面：MIE Solutions 2026 数据预计，到 2030
              年代初，美国制造业岗位缺口将达 150 万到 200 万个，航空航天吸收的缺口比例更高。MADICORP 2026 劳动力分析指出，航空航天与国防流失率接近
              15%——是美国工业平均水平两倍多——原因包括资深机加工工人退休、职业教育管线投入不足，以及新增产能公告地点与合格人才池之间的地理错配。M&A
              后劳动力整合被列为该行业最难的执行问题之一：所有权过渡期间，传统车间员工离职会让收购方失去机构知识；航空航天认证要求又让替换速度慢于一般制造。Amca
              多工厂收购节奏意味着，劳动力流失风险会同时在所有被收购基地上被放大。
