      - number: '5.2'
        title: RAPID 平台——工程、资格认证与制造工作流
        blocks:
          - type: paragraph
            body: >-
              RAPID 是 Amca 自有的垂直整合、AI
              驱动产品开发平台。其公开角色，是把传统上按顺序交接的设计工程、实物原型、资格测试、技术文档和认证制造，压缩成一个连通工作流。官网描述了四个独立功能层：（1）Design，AI
              赋能的基于物理的仿真工具和快速工程反馈，把需求转成可制造设计；（2）Prototyping，在 El Segundo 设施运行，具备传统和增材制造能力；（3）Qualification，同一设施内设 DO 和
              MIL-STD 测试基础设施，并嵌入测试自动化夹具和工具，降低对外部供应商依赖；（4）Manufacturing，经验证流程从 El Segundo 小批量运行转移到六家旗舰工厂之一。公司称，RAPID
              相比行业标准时间线，把从开发到部署的时间缩短超过 67%。该平台已用于 Lockheed Martin F-35 以及商用宽体和窄体飞机部件的生产。2026 年 6 月，公司网站 RAPID
              页面呈现的公开内容很少，与该平台更像内部企业系统、而非商业授权产品相一致。没有任何与 RAPID 相关的公开 API 文档、开发者 SDK 或开源仓库，也强化了这一判断。aicerts.ai 对 Series B
              的报道把 RAPID 描述为一个云引擎，串起设计、仿真、文档和车间排程；其算法会把部件几何与内部合格零件库做基准比对——这是一个有吸引力的数据飞轮论点，但尚未被独立审计。将 RAPID
              部署到完整工厂网络，被描述为 $300 million Series B 募资的关键用途。
