  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行与收购整合风险
        blocks:
          - type: paragraph
            body: >-
              Amca 的核心运营模型——收购传统精密部件车间、用 RAPID 工程平台统一、并加速合格生产——对一家在完成 Series B 时仅成立 14
              个月的公司而言，执行风险极高。每家被收购工厂（Electro-Mech、Cal-Draulics、BC Systems、Electrocube、Payne Magnetics、Aerospace Control
              Products）进入网络时，都带着自己的质量管理体系、次级供应商关系、劳动力文化、工装配置和客户批准历史。航空航天领域的收购后整合不是后台合并；它需要统一 AS9100D 质量流程，把 RAPID
              验证为新的工程骨干，留住掌握传统设计机构知识的认证员工，并确保客户资格不会在过渡中意外失效或降级。2026 Generis Aerospace and Defense Summit
              捕捉到行业共识：供应商质量失败现在会瞬间跨项目、跨国家优先事项传导；Amca 某一家工厂出现一次质量逃逸，就可能触发六个生产基地的遏制措施。Cylad、Plexus International 和 SQA
              Services 指出的 Tier-2 和 Tier-3 供应商可见度缺口，是现代航空航天供应链的主要盲点；对一个仍在搭建统一监控基础设施的收购平台尤其尖锐。RAPID 的设计主张（把开发到生产时间线缩短
              50%）仍是公司自述，未获独立第三方验证；如果平台无法跨差异很大的工厂类型兑现这一主张，整合逻辑就会变弱。关键人风险真实且集中：Jai Malik（CEO）和 Eli
              Giovanetti（COO）是唯一拥有大量公开履历的高管；Malik 在 Amca 之前的背景是风险投资而非航空航天运营，因此公司高度依赖 Giovanetti 的 SpaceX 制造资历，以及被收购车间留任的
              owner-operators。
