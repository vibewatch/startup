      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Amca 的市场有两条主要需求渠道——国防与商用航空航天——各自拥有不同的买方、用户、付款方结构和采用路径。

              在国防渠道，美国国防部通过国会拨款成为最终付款方。FY2026 Defense Appropriations Act 分配的自由裁量总额为 $839.2 billion，其中包括 $13.4 billion
              用于导弹防御和太空项目，并授权 Office of Strategic Capital 使用超过 $4.3 billion 的贷款和担保来扩展关键供应商产能。DoD 通过主承包商拨付资金——Lockheed
              Martin、Northrop Grumman、Boeing Defense、RTX、L3Harris、General Dynamics——这些公司作为系统集成商，向合格 Tier 1 和 Tier 2
              零部件供应商发出长期采购订单。采购决策（供应商选择）由主承包商采购团队掌握，同时受 DCMA 监督和 DCSA 对 ITAR 管制工作的安全审查约束。项目办公室规定性能要求，但通常不选择下层供应商。

              在商用航空航天渠道，OEM（Boeing 和 Airbus）既是零部件供应商的买方，也是质量权威。航空公司是最终用户，租赁公司是经济所有者，但两者都不直接参与下层零部件供应商选择。OEM
              签发长期供应协议，在多年生产周期内锁定产量和价格；到 2025 年底，Airbus 和 Boeing 合计积压 15,461 架商用飞机，按当前生产节奏代表超过 11 年产量。在 MRO 售后市场，航空公司和
              MRO 运营商成为零部件和备件的直接买方，即使新机生产量走弱，也会形成第二条持续需求流。Deloitte 预计 2026 至 2035 年全球商用售后 MRO 需求 CAGR 为 3.2%。

              新供应商或现代化供应商在两条渠道中的采用路径相同：获得或继承 AS9100 认证，完成 OEM 或主承包商合格供应商名单上的项目特定认证，然后在多个审计周期中维持质量、交付和成本表现。新进入者完成认证通常需要
              12–36 个月；Amca 的收购模式通过从被收购传统工厂继承既有认证和客户关系来加速这一时间线——这是它相对绿地制造创业公司最重要的结构性优势。Fictiv 的 2026 年制造业状态调查发现，97%
              的负责人正在把 AI 嵌入核心工作流，说明数字化制造能力正在成为供应商认证对话中的入场要求。
