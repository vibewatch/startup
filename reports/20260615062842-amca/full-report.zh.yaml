      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议——在当前证据水平下继续研究
            body: >-
              Amca 的投资逻辑在结构上成立：市场缺口真实存在，18 个月公司龄对应的运营者履历可信，投资人组合也属一线。但公开证据无法承销超过 $1B
              的估值。缺失的不是叙事质量，而是经审计财报。在收入、毛利率和整合指标披露前，建议是继续研究，并坚持严格价格敏感纪律：没有 data room 确认，不要按当前隐含倍数跟投。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
          - type: callout
            title: 倍数压缩和执行降级是主要估值风险
            body: >-
              两股独立力量可能把退出价值压到当前超过 $1B 的估值之下。第一，A&D 公开市场倍数压缩：Loar Holdings 和 HEICO 的交易倍数都处于历史高位（分别为 37x 和 35x
              EV/EBITDA），Sahm Capital 分析指出它们相对板块均值存在溢价。若均值回归到 20x，可比公司退出价值会下降 40–45%。第二，整合执行降级：18
              个月内完成五项收购，按任何工业标准都是激进节奏；如果 RAPID 带来的利润率提升没有兑现，Amca 会停留在传统合同制造利润率（10–15% EBITDA），而非 Loar 基准的
              30–37%，买家愿意适用的倍数将显著下降。
            calloutType: risk
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
          - type: callout
            title: 基准情景背后的关键假设
            body: >-
              TV003 和 FV003 中的基准情景建立在三项目前无法从公开来源验证的假设上：(1) Amca 在 Series B 时年化收入为 $50–100M，这是用 10 倍增长说法，对照一个合理的 2025 年初
              $5–10M 收入基数推导而来；(2) 五家被收购工厂的收购倍数，与 First Page Sage 报告的私营 Military & Defense M&A 7.7–14.7x EBITDA 区间一致；(3)
              整合正以保住而非稀释被收购业务毛利率画像的节奏推进。任何一项假设若出现重大偏差，基准情景都会向熊市情景下修。
            calloutType: assumption
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
