          - type: callout
            title: 继承来的资格锁定既是护城河也是天花板——新平台需要完整周期
            body: >-
              Amca 的收购策略拿到既有平台批准，传统零件无需重新走资格周期。但任何新产品变体、新平台或新客户，都要完成完整 FAI、NADCAP 和 AS9100D 资格流程——通常需要 6 到 12 个月以上。RAPID
              被设计为压缩这一周期，但 RAPID 相对行业标准的实际资格速度尚未有独立验证。客户扩张速度因此取决于一个尚未外部审计的压缩说法。
