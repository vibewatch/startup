      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              这个市场中任何零部件供应商可获得的结构性护城河，主要来自认证锁定：一旦某个零件号在特定平台上获得 FAA 或 DoD 认证机构批准，切换供应商就需要重新认证，成本数百万美元，耗时 12–36
              个月项目时间。这给当前供应商在任一平台上的收入带来持久可见性，但也在 Amca 寻求赢得新项目位置时形成对等壁垒。这种动态的双重性质——既保护既有位置，又挑战新增赢单——是 Amca 增长论点的核心战略张力。

              商品化风险真实存在，但集中在特定范围。精密公差、特殊材料（钛、Inconel、铍铜）和项目特定几何要求，阻止复杂关键零部件走向商品式竞价。不过，Amca 产品组合中较简单的零部件族，可能随着数字制造（5 轴
              CNC 自动化、检测自动化）扩散到更多工厂、缩小能力差距，而面临更大价格压力。Amca 最好的回应，是把收购目标和有机投资集中在高复杂度、低产量零部件上；这些地方认证锁定和工程支持价值最高。

              反向证据有分量。第一，TransDigm 因单一来源定价受到国会审查的经历说明，激进运用锁定会制造立法和监管风险——任何把模型建立在认证衍生定价权上的公司都应吸取这一教训。第二，Albany Engineered
              Composites 在 2025 年对 CH-53K 项目作出零利润减记，说明新平台固定价格开发合同的执行风险。第三，Ducommun 承认 2026
              年仍有去库存逆风，表明商用航空航天零部件需求可能被供应链动态推迟，且不受供应商控制。第四，Boeing-Spirit 收购是 OEM
              议价权的极端案例：在足够大的供应链压力下，主承包商可以逆转数十年的外包。Amca 的多客户分散（七家具名主承包客户）和多平台覆盖降低但不能消除这一风险。

              尽调关键问题是：（1）Amca 目前在哪些具体平台和零件号上持有 approved supplier status；（2）若客户更换平台代际，重新认证时间线和成本是多少；（3）Amca
              现有收入中，单一来源与竞争性竞标各占多少；（4）Amca 已收购传统工厂中，有多少也曾在 TransDigm 或 HEICO 子公司持有批准，从而可能在未来收购中制造利益冲突。
