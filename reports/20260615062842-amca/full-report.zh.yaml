      - number: '6.4'
        title: 扩张、集中度风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Amca 当前画像中最重要的客户风险，是公司创立时继承的 Boeing 残余集中度。2025 年 4 月启动时，Boeing 是唯一已确认具名客户；外部评论——包括 Series A 当时一篇 Ainvest
              分析——明确质疑，公司 $350 million 以上估值是否已经计入尚未证明的成功，因为其依赖单一锚定客户。到 2026 年 5 月，新闻稿中的 OEM 名单已多元化至七家具名客户，CEO
              媒体表述中则超过十一家；但公司没有发布按客户拆分的收入或集中度百分比，Boeing 需求真实敞口仍不确定。Boeing 自身供应链环境会放大这一风险：FAA 每月 42 架飞机生产上限、未解决的 737 MAX
              认证事项，以及 Logistics Viewpoints 对 Spirit AeroSystems 的分析，都说明 Tier-1 层级的扰动会向次级供应商传导。更广泛的航空供应链分析（Safe Fly
              Aviation，2026 年 1 月）记录，2025 年供应链摩擦成本超过 $11 billion，飞机 backlog 超过 17,000 架——这些条件为 Amca 创造需求，也放大任何 Amca
              端质量或交付失败的后果。New Space Economy 报告记录的单一来源供应商动态可直接套用：一旦客户把 Amca 部件设计进项目，切换既贵又慢，这是 Amca
              的结构性优势；但也意味着，一旦失去合格项目席位，恢复极其困难。BC Systems 的机密收入流具有战略意义，但完全不透明。PCE Companies 2026 年 6 月航空航天 M&A
              报告记录，航空航天关键任务制造估值中位数为 18.87x EBITDA——这一市场背景验证了投资人兴趣，也提高了下一次融资事件对收入可见度的要求。
