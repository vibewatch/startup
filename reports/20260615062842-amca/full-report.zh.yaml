            body: >-
              Amca 最可审计的客户证明来自其收购的子品牌；每个子品牌都把数十年平台历史和供应商批准带入母体。Electrocube 是最强的第三方验证证明点：在 Boeing 5,000
              多家直接供应商中，Electrocube 持续按质量、准时交付和响应度排名前 20——对次级供应商而言，这种具体程度的独立 Boeing 评估并不多见。Electrocube 的箔绕变压器、EMI 滤波器和
              TRU 出现在 Boeing 737、747、757、767、777，以及 F-15、F-16 和 C-17 项目上。ACPI 为 Boeing 737、747、767、F-15 和 C-17
              增加液压压力和液位开关——这是 46 年传承关系，公司明确称其涉及「some of the biggest commercial and defense aircraft programs in the
              world」。Payne Magnetics 带来 Boeing 737 MAX、F-16 和 F-18 上的长期 RF 电力磁性件关系，Amca 正投资面向 UAV 和 energetics 项目的新变体。关于
              F-35，CEO Malik 在 Series B 新闻发布会上公开表示，来自 Electro-Mech 的一款机电部件「very shortly」会进入该项目生产使用；Series B 新闻稿和
              Manufacturing Dive 也确认，RAPID 正被部署用于生产中的 F-35 部件。BC Systems 作为 Series B 轮一部分被收购，仅被描述为支持「multiple growing
              classified defense programs」——考虑到该公司作为军方专用电源制造商已有 40 年历史，这种刻意不透明的描述仍具商业意义。轨迹方面，CEO 在 Series B 时报告收入同比增长
              10x，并称 Series A 到 Series B 的估值倍数跳升为五到七倍——方向性信号很强，但均为公司口径，未披露基数。公司没有发布客户数、重复购买率或利用率指标。
