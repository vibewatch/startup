        - 美国联邦（DDTC / State Dept）
        - 现行强制要求
        - 中——多地点收购带来协调缺口
        - 关键——GE 先例：$36M 罚款 + 同意协议
        - 每家被收购设施任命 ITAR 合规负责人；统一技术数据访问控制
        - 高——6 家工厂的合规状态未披露
