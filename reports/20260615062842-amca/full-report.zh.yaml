      - number: '2.2'
        title: 多重视角下的市场规模与冲突估算
        blocks:
          - type: paragraph
            body: >-
              没有单一公开市场估算能干净覆盖 Amca
              的可服务可寻址市场，因为相关边界——面向美国航空航天与国防客户的精密加工、认证、关键零部件制造——横跨多个定义不同的分析师细分市场。本分析采用五个独立规模视角，并保留它们之间的矛盾，而不是平均出虚假的精确度。

              最宽的视角是 Mordor Intelligence 口径下的美国整体航空航天与国防市场，2026 年收入为 $463.06 billion，至 2031 年 CAGR 为
              5.67%。该数字包含完整平台、系统集成、软件和服务，若不大幅收窄，不能作为 Amca 的 TAM。SNS Insider 对 2025 年美国航空航天零部件制造的 $278.1 billion 估算（至
              2035 年 CAGR 为 2.21%）更窄，但仍包含所有零部件类型——内饰件、发动机组件、MRO 耗材——超出 Amca 当前范围。Coherent Market Insights 估算 2026
              年全球航空航天零部件制造市场为 $1,046 billion，North America 占 41%（约 $429 billion）；这一数字与 SNS Insider 的 $278 billion
              美国单国估算不一致，因为 North America 份额不可能合理超过美国总量。这个定义矛盾说明，跨分析师市场规模测算必须明确审视边界，本章保留两组冲突数字。

              更有针对性的视角来自 WorldMetrics 对美国精密加工市场的分析：2022 年总规模 $98 billion，其中航空航天与国防约占收入 31%，意味着 2022 年约 $30
              billion。按后续增长调整后，2026 年约为 $28–42 billion。最窄且直接可比的代理指标，是 Cognitive Market Research 对 North American
              aircraft machined components 市场的估算：2023 年 $11.28 billion，CAGR 5.8%，到 2026–2027 年约 $14–17
              billion。该数字可能低估国防专用机加工零部件（导弹、弹药硬件、海军系统零件），因为以商用飞机为重点的研究经常排除这些内容。

              尽调层面，对 Amca 当前策略最可辩护的 SAM 估算，是面向美国航空航天与国防主承包商的精密加工和工艺密集型零部件，约 $15–25
              billion；同时承认，低端不包括飞机类估算未覆盖的国防专用机加工零件，高端可能包含 Amca 当前产品组合之外的细分（发动机盘、复合材料航空结构）。按 SNS Insider，美国航空航天零部件制造市场预计
              CAGR 为 2.21%；按 Coherent Market Insights，全球为 6.8%。这个分歧本身反映出不同观点：近期轨迹究竟由需求还是供应约束主导。DoD FY2026 国防拨款 $839.2
              billion，以及 Office of Strategic Capital 用于扩展关键供应商的 $4.3 billion 信贷，是支撑增长情景上沿的结构性顺风。
