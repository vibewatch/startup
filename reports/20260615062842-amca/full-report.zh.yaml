          - type: callout
            title: 未披露客户集中度数据；Boeing 依赖仍是未量化风险
            body: >-
              尽管 2025 年 4 月到 2026 年 5 月之间，具名 OEM 名单从一家扩展到十一家以上，Amca 仍未发布任何按客户、项目或平台拆分的收入。没有披露最大客户集中度百分比，投资人无法衡量 Boeing
              生产率变化或任何单一项目延误带来的敞口。FAA 对 Boeing 每月 42 架飞机的生产上限，是可能直接压制商用航空部件需求增长的现实约束。
            calloutType: risk
