        - Phase 1 于 2025 年 11 月生效；Phase 2 自 2026 年 11 月起强制执行
        - 中高——CMMC 评估是瓶颈；认证需要 6–12 个月
        - 高——若不合规，将无资格获得 DoD 合同授予
        - 立即启动 C3PAO 评估接洽；按工厂划定 CUI 边界
        - 高——Amca 没有公开 CMMC 准备情况声明
        - 确认每处面向 DoD 设施的 SPRS 分数和 C3PAO 接洽时间线
