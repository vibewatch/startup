      - number: '3.2'
        title: 上市既有竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              按收入看，TransDigm Group 是最大的直接参照对象。其 FY2026 指引为净销售额 $9.85–$10.04 billion，中位数约同比增长 12.6%。仅 FY2026 Q2 就实现收入
              $2.544 billion，增长 18%，EBITDA As Defined 利润率为 52.6%。其商业模式与 Amca 明显不同：TransDigm
              收购单一来源、高度专有的飞机零部件业务，再利用认证锁定维持极强定价权。公司长期受到国会审查——参议员 Warren 和 Garamendi 记录，Defense Logistics Agency 有 401
              项成本和定价数据请求未获回应——这说明单一来源垄断策略内嵌声誉和监管风险。Amca 公开宣称的使命是解决工业基础脆弱性，隐含地把自己放在这一模式负外部性的对立面。

              HEICO Corporation 是全球最大的 FAA-PMA 批准飞机和发动机零部件独立供应商。截至 2026 年 4 月，其 TTM 收入约 $4.91 billion，同比增长 18.8%，运营利润率在
              22–24% 区间，靠精简、分散的收购结构支撑。Flight Support Group 推动 FY2026 Q1 收入增长 15%，但几乎完全聚焦售后市场——它并不争夺新机制造零部件认证名额。HEICO
              Parts Group 持有超过 19,500 个 FAA-PMA 批准零件，每年新增 500+ 个新零部件。其商业模式有些方面互补，有些方面竞争：HEICO 也是 Amca
              所收购小型航空航天企业的买家，但它聚焦售后替换，而不是 OEM 周期的新造开发。

              Ducommun Incorporated 瞄准最接近 Amca 的市场细分：面向国防和商用主承包商的认证航空结构件与电子系统。2026 Q1 收入达到创纪录的 $209 million，商用航空航天增长
              18%，导弹业务同比增长 22%。Ducommun 在所有设施持有 AS9100、ISO 9001 和 NADCAP 认证。其 $1.1 billion 剩余履约义务积压提供了强劲近期可见性。公司的 Vision
              2027 计划目标为 18% 调整后 EBITDA 利润率（当前 16.9%），主要依靠产品组合改善和设施整合节省。管理层在 2026 Q1 财报电话会上标出的重大风险，是商用航空航天去库存逆风仍在，预计持续到
              2026 年底。

              Moog Inc. 专注高性能精密运动和流体控制。FY2026 Q1 净销售额创纪录达到 $1.1 billion，增长 21%，其中 Space and Defense 以 $324
              million（+31%）领跑。全年 FY2026 指引上调至 $4.3 billion。Moog 12 个月积压达到创纪录的 $3.3 billion（增长
              30%），集中在制导弹药、导弹控制、卫星作动和军机飞控。公司已在 East Aurora, NY 开设一座新的 120,000 平方英尺机电作动设施。Moog 在 F-35、SLS 和 Navy launch
              systems 等主要平台上拥有深度单一来源位置，与 Amca 宣称的液压和电力系统重点直接重叠。Moog 不采用收购 - 现代化模式，而是聚焦有机 R&D 和新产品开发。

              Albany Engineered Composites（AEC）是 Albany International 的航空航天与国防分部，更像相邻竞争者而非直接竞争者。2026 Q1，AEC 收入按固定汇率增长
              24.7%，由 CFM LEAP 发动机（用于 Boeing 737 MAX 和 Airbus A320neo）以及 CH-53K 国防项目推动。Albany 专长在 3D
              编织复合结构和树脂传递模塑（RTM），材料和工艺领域不同于 Amca 的机加工金属和液压重点。Albany 暴露于零利润项目风险（CH-53K AFT 项目在 2025 Q3
              项目行动后按零利润入账），说明固定价格复合材料开发中的执行风险，Amca 在自身投标策略中应纳入这一点。
