  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与变现机制
        blocks:
          - type: paragraph
            body: >-
              Amca 的核心收入机制，是向 OEM 主承包商及其 Tier-1 供应商销售精密工程化航空航天与国防部件，合同基础是长期合格供应协议。通过认证的部件按有效 OEM 合同发货时确认收入。产品组合覆盖液压组件（来自
              Cal-Draulics/Aerospace Control Products 工厂）、电力电子（包括变压器、变压整流器、电容器、EMI 滤波器，来自 Electrocube）、电力磁性件（来自 Payne
              Magnetics）、航电相邻外壳，以及结构机加工件。每个品类都要单独进入 OEM 批准供应商名单，这既保护定价，也限制新增产能投产速度。

              定价架构由资质状态驱动。一个部件进入 OEM 的 AVL 之后，在位供应商实际上拿到单一来源地位；这一过程通常需要 12 到 36 个月，包括首件检验、材料可追溯文件，有时还包括 NADCAP
              特殊工艺认证。AS9100D/ITAR 认证精密加工的航空航天 CNC 车间综合费率为每小时 $120 到 $200，反映直接人工、管理费用、认证摊销和合规成本层层叠加。航空航天制造中，管理费用可占单位总成本的
              35% 到 45%，主要来自质量体系、专用设备和 AS9100D 文件要求。由此带来的毛利空间可观，但 Amca 各工厂实际兑现的利润率未知，因为公司尚未发布经审计财务报表。

              RAPID
              平台目前不像是对外销售的软件产品。它更像内部工程与制造工作流工具，把设计、原型、资格测试、技术文档和认证生产接成一个流程。若有财务贡献，也会体现为部件收入线毛利率改善——资格周期更快、返工成本更低——而不是独立软件收入流。RAPID
              未来是否对外授权，尚未披露。Amca 自报收入同比增长十倍，但没有披露分母、时间段或审计依据，因此只能证明方向性进展，不能当作可用于承销的收入数字。
