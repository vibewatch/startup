      - number: '7.5'
        title: 财务不透明、估值风险与融资外溢
        blocks:
          - type: paragraph
            body: >-
              Amca Series B 后估值超过 $1B，较行业常态溢价明显。Angel Investors Network 引用的私募股权尽调基准显示，表现较好的、有收入的防务硬件公司在 Series B
              阶段，典型投后估值为 $100M–$400M；Amca 超过
              $1B，意味着市场给它定价时假设了显著高于行业中位数的增长轨迹。公司没有发布经审计财报、投资人材料、披露的客户数量或收入集中度画像。公开记录里唯一的量化收入信号，是公司自称收入同比增长 10
              倍，但没有分母、时间段或经审计基线。已披露融资总额为 $376.5M（$76.5M 种子轮加 $300M Series B）；按超过 $1B 的估值计算，已披露资本对应的隐含投后倍数约为 2.7
              倍——对硬件整合平台而言合理，但前提是收入和利润率假设站得住。Series B 阶段的防务硬件初创公司，月度总消耗通常为 $600,000–$2M；Amca
              硬件占比高、工厂分布多，可能处在区间上沿。如果下一次融资节点（Series C 或战略合作）因市场收紧或里程碑落空而延后，公司靠硬件运营实现自给现金流的路径就变得关键。Foley and Lardner 2026
              FCA 报告和 Fitch Ratings 都指出更广泛的融资风险：利率维持高位，LP 偏好转向有防御性现金流的企业；无法证明经审计收入轨迹的公司，Series C
              估值会承压。公司当前的公开披露状态（没有收入、员工数、客户数）符合这一阶段私营独角兽的做法，但也造成尽调不透明，外部独立评估风险在结构上无法完整。
