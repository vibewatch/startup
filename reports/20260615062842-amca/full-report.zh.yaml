      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年期间，国防部件制造商的监管风险面在三个独立方向显著扩张：ITAR 执法、CMMC 网络安全强制要求，以及 Department of Justice 依据 False Claims Act
              推动的 Civil Cyber-Fraud Initiative。Amca 作为多家传统车间的收购方，会放大每一类风险，因为每笔收购都继承前所有者的合规状态、历史记录，以及可能未披露的违规。ITAR
              方面，State Department 2026 年 4 月与 GE Aerospace 的和解具有警示意义：DDTC 解决了 2018 到 2024 年间 116 项 ITAR 违规，处以 $36
              million 罚款，并要求设置 24 个月 Special Compliance Officer，即使 GE 主动披露违规并充分配合。违规包括未经授权向中国出口 F-35、F110、F118 和 F414
              发动机技术数据，以及多地点合规治理的系统性失败。对 Amca 而言，风险场景并不完全相同——其国防客户敞口目前是部件而非完整发动机项目——但在六家收购设施、不同传统记录之间统一 ITAR
              合规的结构性挑战相似。CMMC 方面，DFARS 252.204-7021 条款已在 2025 年 11 月进入 DoD 合同；Phase 2 要求从 2026 年 11 月起，处理 CUI 的合同必须接受第三方
              C3PAO 评估。35 万家 DIB 供应商争夺有限的 CMMC 授权评估员，面临 6 到 12 个月合规跑道；不合规承包商将被明确排除在 DoD 合同授予之外。False Claims Act
              方面，MORSECORP 2026 年 5 月因自报 NIST SP 800-171 得分 104、实际得分为 -142，且继续领取 DoD 合同付款而达成 $4.6 million
              和解，说明网络安全虚假陈述可能变成欺诈敞口。DOJ 仅在 FY2025 就追回超过 $52 million 网络安全相关 FCA 和解款。三条执法向量都处于活跃且加速状态；Amca 尚未发布 CMMC
              就绪声明、ITAR 合规项目披露或安全证明。
