  - id: TE003
    title: 技术和运营架构 — RAPID 层级与依赖
    columns:
      - 层级 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - RAPID 设计层（AI/物理仿真）
        - 借助 AI 驱动仿真，把客户需求转成可制造的零部件设计
        - 需要准确物理模型、合格零部件几何库和云基础设施
        - 若被收购工厂上传的历史数据不一致，库的准确性会下降
      - - RAPID 原型层（El Segundo）
        - 容纳传统 + 增材制造能力，用于小批量原型制造
        - 依赖 El Segundo 设施产能，以及现场熟练 AM 和 CNC 技术人员
        - 单点设施；产能约束限制多个项目同时并行
      - - RAPID 鉴定层（DO-/MIL-STD）
        - 内部 DO-160、MIL-STD 测试，嵌入测试自动化工装
        - 测试基础设施必须跟上 DO/MIL 标准版本演进
        - 标准修订要求重新验证测试工装；修订时间不可预期
      - - RAPID 文档层（AS9100 数字线程）
        - 在整个工作流中生成并管理符合 AS9100D 的文档和审计轨迹
        - 所有工程师和工厂操作员都必须把 RAPID 作为系统记录源
