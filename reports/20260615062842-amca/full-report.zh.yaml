      - number: '8.4'
        title: 负面证据、执行降级风险与倍数压缩信号
        blocks:
          - type: paragraph
            body: >-
              几类负面证据限制了外部对超过 $1B 估值的接受程度。第一，也是最根本的一点，Amca 从未发布经审计财报、披露毛利率或 EBITDA
              利润率、提供客户集中度数据，或给出任何带分母的时间序列收入数字；唯一公开财务信号只是跨未说明期间的一句话式 10 倍增长。这种不透明即便按 IPO 前风险投资支持公司的标准也不常见；相比之下，Loar
              Holdings 从成立起就发布完整经审计财务，并在 2024 年 4 月 IPO 前披露详细季度业绩。没有已披露财务，任何估值锚都只是基于估计收入区间推导出的倍数，而不是可观察的价格—价值关系。

              第二，上市同业本身也处在历史高倍数区间。Sahm Capital 2026 年 3 月对 Loar Holdings 的分析指出，其 91.9x P/E 显著高于美国 Aerospace & Defense
              组别的 43.8x，也高于分析师共识公允 P/E 28.7x；报告还警告，如果近期收购（LMB Fans & Motors 和 Harper
              Engineering）带来的整合风险导致有机增长不及预期，倍数可能压缩。如果 Loar 的 EV/EBITDA 从 37x 压缩到 20x，Amca
              的入口倍数——假设业务确实已达到上市可比规模——吸引力会明显下降。A&D 零部件板块倍数压缩，会直接、负面地重估 Amca 的退出价值。

              第三，风险投资市场整体正更严格审视资本密集型硬件公司。Anduril 和 Shield AI 这批防务科技公司能拿到软件式倍数，是因为它们主要在硬件平台之上销售 AI 和自主系统软件。Amca
              主要是精密零部件合同制造商，利润率和增长画像根本不同。把 Anduril 式 28x 收入倍数套到 Amca 身上，在分析上站不住；真正相关的可比宇宙是上市 A&D 零部件制造商同业。

              第四，整合执行风险没有披露。18
              个月内跨不同地域、产品线和劳动力文化完成五项收购——液压、功率电子、功率磁性器件、航空电子部件——带来的整合复杂度，历史上曾让其他硬件整合平台出现利润率稀释和收入短缺。TransDigm
              二十年来成功整合并购，是支持该模式的数据点；但 TransDigm 在达到当前利润率前，已经有十年运营经验和成文化打法。Amca 正用更短时间执行同一策略，却没有公开记录的整合指标。

              负面证据并不意味着估值错误，而是意味着当前无法验证。最可操作的一项负面数据是，超过 $1B
              的估值来自一轮风险融资，投资人能够接触私有财务；这些财务并未公开分享。在财务披露前，或在独立数据源证实其收入与利润率画像前，正确尽调姿态应把该估值视为风险投资标记，而不是独立承销的企业价值。
