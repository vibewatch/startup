        title: 资本基础、工厂版图与客户覆盖
        blocks:
          - type: paragraph
            body: >-
              对一家硬件属性很重的公司来说，Amca 的公开融资轨迹异常快。公司 2025 年 4 月带着 $76.5 million 初始融资亮相，不到 18 个月后又宣布由 Caffeinated Capital 领投的
              $300 million Series B。多家已审阅来源，包括公司自己的 2026 年新闻稿和独立行业报道，都支持该轮估值超过 $1 billion
              的说法。同一组证据也让工厂版图变得可读，尽管口径并不完全整齐。官方与独立来源都认可超过 123,000 平方英尺合格产能，并且运营分布在 California、Iowa 和 New York。Series B
              新闻稿正文和独立报道一致描述六家关键零部件工厂，而同一新闻稿的样板介绍又称 Amca 在全美运营七家工厂，包括总部。最干净的调和方式是：公司有六家生产工厂，另有一个位于 El Segundo
              的先进原型和测试场地。公开客户覆盖并不只是一个或两个象征性 logo：公司与第三方来源点名 Boeing、Lockheed Martin、Airbus、Embraer、Honeywell、Northrop
              Grumman 和 Raytheon，官方产品页还列出覆盖 Boeing 商用飞机、Airbus A350 和美国主要国防飞机平台。这是有意义的证据，说明 Amca
              不是尚未产生收入的概念型业务，但距离披露客户数量、集中度画像或经审计收入基础仍有差距。
