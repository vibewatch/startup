chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Amca 把自己定位为一家修补美国航空航天与国防供应链脆弱环节的公司，而不是纯软件创业公司，也不是传统私募股权式 roll-up。其官网首页和 Who We Are
              页面都把问题归结为关键零部件制造中的竞争减少、单一来源依赖、业主老龄化和产能萎缩。这个叙事很重要，因为它划定了公司的边界：Amca
              并不打算制造完整飞机或武器系统，也不只是想把通用零件加工自动化。相反，公司称其聚焦于标准件与完整系统之间的零部件层，覆盖航空电子、液压和电力系统，这些部件已经装在主要商用与国防平台上。其运营模式也比一般整合叙事更具体。官方材料和
              2026 年 Series B 报道都一致把 RAPID 描述为连接设计、原型、认证测试、技术文档和认证制造的软件与工程层，把这些环节纳入同一工作流。Manufacturing Dive 对 Jai Malik
              的采访从外部印证了同一思路：Amca 试图消除零部件开发与认证生产之间的断层。尽调层面，最稳妥的结论是：Amca 的核心假设，是把实体工厂与一体化工程系统结合起来，在传统工业基础最慢的地方加速合格零部件交付。
