  - id: capital-structure-and-deployment
    title: Capital structure, funding trajectory, and deployment strategy
    body: >-
      Amca's disclosed capital base totals $376.5 million across two rounds. Caffeinated
      Capital led both: the $76.5 million initial funding in April 2025 that launched the
      company and funded its first acquisition of Electro-Mech Components, and the $300
      million Series B closed in May 2026 that brought in Lightspeed Venture Partners,
      Andreessen Horowitz, Lux Capital, Construct Capital, and House Capital alongside the
      repeat lead. The Series B pushed Amca's valuation above $1 billion, which Crunchbase
      confirmed in its May 2026 unicorn tracker listing, describing the company as a
      one-year-old El Segundo business with six factories and a $1 billion valuation.

      The stated use of the $300 million proceeds is threefold: additional factory
      acquisitions across the United States, expansion of the RAPID platform throughout
      the manufacturing network, and acceleration of component production for critical defense
      programs. No specific allocation between these categories has been disclosed. The
      company has made at least five acquisitions since launch—Electro-Mech Components,
      Aerospace Control Products Inc. (hydraulics), BC Systems (power electronics, New York),
      Electrocube (power electronics, Pomona, California), and Payne Magnetics (power
      magnetics, Covina, California)—but all individual transaction values have been kept
      private. Based on typical legacy aerospace supplier transaction multiples, a rough
      estimate of $2 million to $50 million per shop suggests aggregate acquisition spend
      of $10 million to $250 million from the combined capital pool, leaving a wide range
      of remaining capital.

      No debt, credit facilities, or project-finance obligations have been disclosed in
      any public Amca source as of June 2026. This absence of disclosed leverage is notable
      given the capital intensity of manufacturing roll-ups: comparable public acquirers such
      as TransDigm carry approximately $32 billion in total debt at roughly 6x trailing EBITDA,
      with goodwill and intangibles representing 59 percent of total assets—illustrating
      how acquisitive aerospace component consolidators typically become heavily leveraged
      over time. Amca's current equity-only structure provides capital flexibility, but
      the company will need either meaningful free-cash-flow generation or additional equity
      rounds to fund continued expansion beyond its current factory network.
