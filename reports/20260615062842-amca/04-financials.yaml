  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure-gap
      missingEvidence: >-
        Audited financial statements showing revenue by product line, gross margin, EBITDA,
        customer concentration, and cash position for each fiscal period since founding.
      whyItMatters: >-
        Without audited financials, no financial underwriting is possible; all revenue claims
        are self-reported and unverifiable.
      diligencePath: >-
        Request data-room access including audited annual and interim financial statements,
        revenue by factory and segment, gross margin bridge, and top-10 customer revenue.
      relatedQuestionRefs:
        - QI001

    - type: private-evidence-only
      severity: material
      topic: acquisition-prices
      missingEvidence: >-
        Transaction prices, purchase multiples, earnout structures, and goodwill recognized
        for each of the five known acquisitions (Electro-Mech, Aerospace Control Products,
        BC Systems, Electrocube, Payne Magnetics).
      whyItMatters: >-
        Cannot assess capital deployment efficiency, purchase-price discipline, or implied
        balance-sheet goodwill without disclosed acquisition terms.
      diligencePath: >-
        Request acquisition summaries for each transaction including purchase price, revenue
        and EBITDA multiple at acquisition, earnout terms, and seller-financing obligations.
      relatedQuestionRefs:
        - QI007
        - QI009
        - QI023

    - type: private-evidence-only
      severity: material
      topic: cash-burn-runway
      missingEvidence: >-
        Post-Series-B cash position, monthly gross burn breakdown (capex vs. OpEx vs.
        acquisition installments), and 24-month cash forecast with planned acquisition
        pipeline costs.
      whyItMatters: >-
        Without burn and runway data, capital adequacy of the $300M raise relative to the
        stated five-year acquisition plan cannot be verified.
      diligencePath: >-
        Request CFO confirmation of current cash balance, monthly burn by category,
        and a 24-month cash waterfall model.
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: material
      topic: rapid-external-monetization
      missingEvidence: >-
        Confirmation of whether RAPID will be externally licensed, the internal cost
        allocation to RAPID development, and any quantified ROI from RAPID deployment
        across acquired factories (e.g., qualification time reduction, defect rate,
        revenue per engineer).
      whyItMatters: >-
        Valuation models that credit Amca with a software-multiple component for RAPID
        require evidence that RAPID generates or will generate standalone revenue; absent
        this, a manufacturing-company multiple is more appropriate.
      diligencePath: >-
        Request RAPID development cost by year, planned licensing roadmap if any,
        and factory-level KPIs before and after RAPID integration.
      relatedQuestionRefs:
        - QI015
        - QI017
