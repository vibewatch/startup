      EBITDA margin ranges are from HEICO FY2025 10-K and Ducommun Q1 2026 public filings.
      Burn estimate is from defense hardware Series B industry benchmarks. Runway is arithmetic
      from $300M divided by estimated burn, before factoring in acquisition capital deployment
      which would materially shorten the cash horizon. All Amca-specific estimates are highly
      uncertain and require data-room confirmation.
    claimRefs:
      - CI010
      - CI012
      - CI014
      - CI018
      - CI023

