figures:
  - id: FI001
    title: Revenue model bridge — customer activity to certified component revenue
    type: flow
    layout: standard
    summary: >-
      Illustrates how an OEM program need converts through qualification, contract, and delivery
      into Amca's component revenue and gross margin, highlighting the qualification moat that
      drives pricing power.
    data:
      nodes:
        - id: oem-need
          label: "OEM program need (flight-critical or defense-critical component)"
        - id: qualification
          label: "Supplier qualification (AVL entry: AS9100D, FAI, NADCAP, 12–36 months)"
        - id: contract
          label: "Long-term supply agreement or sole-source nomination"
        - id: engineering
          label: "Component design, engineering, and RAPID-accelerated prototyping"
        - id: manufacturing
          label: "Certified manufacturing and quality inspection (AS9100D, ITAR)"
        - id: revenue
          label: "Delivery to OEM / Tier-1 integrator → Revenue recognition"
      edges:
        - from: oem-need
          to: qualification
        - from: qualification
          to: contract
        - from: contract
          to: engineering
        - from: engineering
          to: manufacturing
        - from: manufacturing
          to: revenue
    approximationNotes: >-
      Node sequence represents the general qualification and revenue conversion process for Amca's
      acquired factories. Actual qualification timelines, contract structures, and revenue recognition
      policies are not publicly disclosed and may vary by factory, customer, and program.
    claimRefs:
      - CI001
      - CI006
      - CI009
      - CI017
      - CI029
      - CI030

