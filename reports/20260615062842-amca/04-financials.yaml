callouts:
  - calloutType: risk
    title: Absence of audited financials is the primary diligence blocker
    body: >-
      Amca has raised $376.5 million and achieved a $1 billion-plus valuation without publishing
      audited revenue, gross margins, acquisition prices, or burn data. The tenfold growth claim
      lacks a denominator, time period, or audit trail. No underwriting decision should rely on
      self-reported metrics from a private company that has neither disclosed financial statements
      nor engaged independent auditors publicly. Resolution requires a standard data-room review
      covering audited P&L, gross margin by product line, top-5 customer concentration, acquisition
      prices and terms, and a 24-month cash forecast.
    claimRefs:
      - CI001
      - CI009
      - CI024
      - CI025

  - calloutType: insight
    title: Public-comp benchmarks set the margin ceiling, not Amca's current floor
    body: >-
      HEICO's 39.8% gross margin and TransDigm's 52.4% EBITDA margin represent what decades of
      sole-source aerospace component consolidation can produce. Amca's acquired factories are
      early-integration-stage assets; their current margins likely sit near or below the 18.7%
      A&D sector median. The investment thesis is that RAPID-accelerated qualification and
      modernized production will drive convergence toward the HEICO-Ducommun range over a 3–7 year
      horizon. That thesis is plausible but remains undemonstrated by audited evidence.
    claimRefs:
      - CI010
      - CI012
      - CI014
      - CI016
      - CI023

