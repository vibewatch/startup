chapter:
  number: 4
  title: Financials
  summary: >-
    Amca's financial picture is defined by what is visible—$376.5 million in disclosed venture
    capital across two rounds, a $1 billion-plus Series B valuation achieved in eighteen months,
    and a self-reported tenfold top-line growth claim—and by what is deliberately absent:
    no audited revenue, no disclosed gross margins, no acquisition prices, and no cash-burn
    data. Comparable public peers (HEICO at 39.8% gross margin, TransDigm at 52.4% EBITDA
    margin) set the ceiling for what sole-source aerospace component economics can become,
    but Amca's operating stage and undisclosed unit economics make those benchmarks aspirational
    rather than current. The $300 million Series B provides substantial capital headroom for
    the stated acquisition and scale-up strategy, yet the absence of audited financials and
    the capital-intensive nature of legacy manufacturing roll-ups represent the primary
    diligence blockers before any financial underwriting.

