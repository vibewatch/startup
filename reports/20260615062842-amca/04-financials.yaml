  - id: cost-structure-and-unit-economics
    title: Cost structure, unit economics, and margin benchmarks
    body: >-
      Amca operates in a segment where publicly traded peers have demonstrated that sole-source,
      qualification-protected aerospace component manufacturing can sustain exceptional margins.
      HEICO's fiscal year 2025 10-K filed with the SEC confirms a consolidated gross profit
      margin of 39.8 percent (up from 38.9 percent in FY2024) with SG&A representing
      17.1 percent of net sales. TransDigm's EBITDA As Defined margin was 52.4 percent in
      Q1 FY2026, supported by a value-driven strategy of acquiring sole-source component
      franchises and extracting pricing power over time. Ducommun, a smaller peer, reported
      26.9 percent gross margin and 16.9 percent adjusted EBITDA margin in Q1 2026.
      The aerospace and defense industry median gross margin for Q1 TTM 2026 was approximately
      18.7 percent, with a median EBITDA margin of 12.2 percent, putting upper-quartile
      performers like HEICO and TransDigm well above the norm.

      Amca's unit economics cannot be directly verified because no audited financial statements
      have been published. The company's acquired factories span legacy precision-machining
      and power-electronics businesses that would, at typical revenue scales for independent
      aerospace shops, each contribute $2 million to $20 million in annual revenue. Aggregated
      across five factories at early post-acquisition stage, a rough revenue run rate of
      $10 million to $100 million is plausible but speculative. Gross margins at newly acquired
      legacy shops are often compressed by deferred capital investment, integration costs,
      and workforce transitions—exactly the cost-improvement opportunity Amca's
      modernization thesis claims to address. Manufacturing hardware startups at Series B
      stage typically carry gross burn of $600,000 to $2 million per month, with higher
      rates when factory capex and workforce expansion are active, suggesting Amca could be
      burning substantially more given concurrent acquisitions.

      For direct labor, aerospace precision machining labor cost index for NAICS 3364
      (tracked by the Federal Reserve's FRED) has risen steadily, reflecting the skilled
      workforce shortage that is itself a structural driver for Amca's consolidation thesis.
      AS9100D-certified shop overhead typically runs 100 to 150 percent of direct labor cost.
      These structural cost inputs imply that early-stage margins at newly integrated factories
      are likely at or below the industry median; the convergence toward HEICO-like margins
      would require both sustained pricing power and the efficiency gains RAPID is designed
      to deliver. That improvement trajectory is the investment thesis, not yet the
      demonstrated outcome.
