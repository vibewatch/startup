- id: section-2
  title: 'Adoption trajectory: company-reported growth, community signals, and independent estimates'
  body: >-
    Redpanda has reported high consecutive-year growth, though figures are unaudited self-disclosures.
    The February 2024 press release reported 300% year-over-year revenue growth and 179% customer
    count growth in FY24, with BYOC deployments more than tripling. The May 2026 Q1 FY2027 press
    release reported 70% new ARR growth year over year — the best new-ARR quarter in company
    history — and the most 7-figure deals in a single quarter. Prior growth: Contrary Research
    noted approximately 5× revenue growth in the FY23 period (June 2023 Series C context), implying
    multi-year consecutive high-growth. The only independent third-party ARR estimate is from
    Getlatka (December 2025), placing ARR at approximately $26.1 million with ~188 employees —
    consistent with a high-growth early-scale SaaS company. Community signals corroborate organic
    demand: FY24 saw a 56% increase in Slack community membership and a 36% increase in GitHub
    stars. FeaturedCustomers' Spring 2026 profile shows 26 testimonials, 19 case studies, and 13
    videos, consistent with a growing enterprise reference base. Growth deceleration is visible:
    from 300%+ in FY24 to 70% new-ARR growth in Q1 FY2027, which is still strong but reflects
    a natural scaling effect on a larger base. Customer count, total ARR, and cohort-level retention
    remain undisclosed, preventing independent assessment of growth quality and retention.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
