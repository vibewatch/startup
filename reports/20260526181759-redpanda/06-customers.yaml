company:
  name: Redpanda
chapter:
  number: 6
  title: Customers
  summary: >-
    Redpanda's customer base spans financial services (NYSE, Jump Trading, StoneX, Alpaca),
    cybersecurity (Lacework, Akamai), telecommunications (Truecaller, Vodafone, ShareChat),
    gaming (Chess.com, Fortis Games), and enterprise IoT (Johnson Controls, Range Energy).
    The BYOC deployment model is the highest-growth tier, with company-reported FY24 growth
    of 300% in revenue and 179% in customer count. NYSE Cloud Streaming processes 500B+
    messages per day with sub-100ms latency; ShareChat reported 70% cloud cost reduction;
    Lacework handles 14.5 GB/sec at peak. FeaturedCustomers awarded Redpanda a Spring 2026
    Top Performer badge based on 1,065 reference ratings. An isdown.app outage tracker
    recorded 20 Redpanda Cloud incidents since March 2025, including an 8-day GCP MCP
    service interruption, representing a reliability risk in latency-critical deployments.
    NRR, GRR, customer count, and retention cohort data are not publicly disclosed —
    these are the primary remaining diligence gaps.
sections:
- id: section-1
  title: 'Customer base segmentation: verticals, buyer profiles, and deployment preferences'
  body: >-
    Redpanda's named customer base spans at least six verticals identifiable from public sources:
    financial services and trading (NYSE, Jump Trading, StoneX, Alpaca, Bitwyre), telecommunications
    and social media (Truecaller, Vodafone, ShareChat), cybersecurity and cloud infrastructure
    (Lacework, Akamai), gaming and entertainment (Chess.com, Fortis Games, Activision Blizzard),
    enterprise IoT and manufacturing (Johnson Controls, Range Energy, Rivian), and AI infrastructure
    (Poolside, Midjourney). The primary buyer persona is platform or infrastructure engineers at
    mid-market to large enterprise technology companies facing streaming data cost or performance
    challenges — typically evaluating Redpanda as a replacement for Apache Kafka self-managed
    clusters or Confluent Cloud due to operational complexity or cost overruns. The official customer
    page lists 25+ named accounts with use cases spanning real-time event processing, security data
    pipelines, IoT telemetry, financial messaging, and agentic AI infrastructure. Redpanda Cloud
    offers three self-serve or contract tiers — Serverless (pay-as-you-go), BYOC (customer-hosted,
    annual contract), and Dedicated (Redpanda-hosted, annual contract) — plus an Enterprise Edition
    self-managed license. BYOC is the flagship enterprise offering and accounted for the fastest
    growth in FY24, with deployments more than tripling. Regulated verticals such as financial
    services and cybersecurity show a strong preference for BYOC due to data residency and
    compliance requirements. The Kapa.ai customer story confirms Redpanda's developer portal
    serves Activision, Texas Instruments, Midjourney, and Cisco, providing an independent
    triangulation of named enterprise relationships. Redpanda holds an Akamai Qualified Compute
    Partner certification and has announced integrations with AWS and NVIDIA, indicating enterprise
    procurement path diversification.
  claimRefs:
  - CU001
  - CU002
