callouts:
- title: NYSE Production Deployment Is the Highest-Quality Customer Reference
  body: >-
    NYSE Cloud Streaming is Redpanda's most defensible public reference: announced in August 2025,
    it processes hundreds of billions of messages per day at sub-100ms latency for one of the
    world's largest financial market operators. NYSE has publicly committed to expanding the
    partnership to Apache Iceberg, validating active land-and-expand dynamics. This single reference
    substantially strengthens Redpanda's enterprise credibility, particularly in the financial
    services vertical.
  claimRefs:
  - CU020
  - CU039
- title: 'Adverse Signal: 20 Cloud Outages Since March 2025'
  body: >-
    The isdown.app third-party outage tracker recorded 20 Redpanda Cloud incidents between
    March 2025 and May 2026, including an 8-day GCP MCP service interruption and a 54-minute
    login failure. While Redpanda's own status page shows 99.66–99.99% uptime over a 90-day window,
    the outage frequency — concentrated on GCP and the control plane — represents a material
    reliability risk in mission-critical deployments and warrants due diligence into SLA credit
    issuance and customer satisfaction impact.
  claimRefs:
  - CU035
  - CU047
