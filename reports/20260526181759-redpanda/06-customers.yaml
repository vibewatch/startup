- id: section-4
  title: 'Customer satisfaction, SLA commitments, and reliability track record'
  body: >-
    Third-party satisfaction signals are positive but sparse. FeaturedCustomers awarded Redpanda
    a Spring 2026 Top Performer badge in the Data Stream Processing Software category, based on
    1,065 reference ratings. Gartner Peer Insights shows two reviews as of April 2026: one
    reviewer praised enterprise-grade performance and reliability, while a second raised the
    pricing model as a "significant concern." PeerSpot reviewers cite 8–10/10 stability ratings
    and praise ease of administration, but flag BSL licensing restrictions and a smaller third-party
    plugin ecosystem as drawbacks relative to Apache Kafka. Redpanda's SLA guarantees 99.9%
    uptime for Serverless, 99.99% for BYOC and Dedicated tiers, with monthly service credits
    upon breach. The official status page (status.redpanda.com) shows 99.66% uptime for the
    Cloud Control Plane, 99.96% for Cloud Accounts, and 100% for Serverless over the
    February–May 2026 window. However, the isdown.app third-party outage tracker recorded
    20 Redpanda Cloud incidents since March 2025, including an 8-day GCP MCP service
    interruption, a 54-minute login failure, and a multi-hour DNS issue — a pattern that
    may represent customer satisfaction risk in mission-critical deployments. These outage
    records are an adverse signal that materially qualifies the reliability narrative. NRR,
    GRR, customer churn rates, contract renewal rates, and CSAT/NPS scores are not publicly
    disclosed, representing the core retention diligence gap. The Kapa.ai case study indicates
    Redpanda handles 3,000–5,000+ developer support interactions monthly with a 93% AI answer
    certainty rate, pointing to a well-invested developer support infrastructure as a
    satisfaction enabler.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: section-5
  title: 'Expansion, concentration risk, and commercial durability'
  body: >-
    Expansion signals are visible in several named accounts. NYSE has publicly committed to
    expanding its Redpanda partnership to include Apache Iceberg integration, demonstrating
    active land-and-expand dynamics at Redpanda's highest-profile account. ShareChat is
    "scaling new use cases" on Redpanda BYOC. The BYOC architecture generates structural
    switching costs: migration requires reprovisioning the full control plane and data plane
    inside the customer's VPC, raising retention probability for committed enterprise customers.
    Redpanda Connect's 300+ data connectors and the Agentic Data Plane AI Gateway create
    additional upsell vectors within the existing customer base. Channel partnerships with
    AWS, NVIDIA, and Akamai reduce enterprise procurement friction. Concentration risk is
    material but unquantifiable: NYSE is Redpanda's most prominent public deployment, and
    the presence of multiple 7-figure deals in Q1 FY2027 implies high top-customer ACV
    concentration. No public customer count, contract renewal rates, or customer concentration
    breakdown has been disclosed. The SOC 2 Type II certification and BYOC VPC isolation
    reduce compliance procurement friction for regulated enterprise customers. No public
    lawsuits, contract disputes, or customer-facing regulatory enforcement actions have
    been identified. The 20 cloud outage incidents since March 2025 (per isdown.app) represent
    an operational reliability risk that could affect renewal decisions in latency-sensitive
    production deployments.
  claimRefs:
  - CU039
  - CU040
  - CU041
  - CU042
  - CU043
