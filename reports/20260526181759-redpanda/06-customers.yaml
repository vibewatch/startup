  evidenceGaps:
  - id: EGU001
    topic: NRR, GRR, and customer retention cohorts not disclosed
    gapType: private-evidence-only
    severity: blocking
    description: >-
      Redpanda has not publicly disclosed Net Revenue Retention (NRR), Gross Revenue Retention (GRR),
      customer churn rate, or retention cohort data. These are the primary SaaS health indicators for
      assessing whether the reported growth is driven by durable customer retention or high-velocity
      new customer acquisition masking churn. Without NRR and GRR, the growth rate figures cannot
      be underwritten as indicators of business quality.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU004
  - id: EGU002
    topic: Total customer count and revenue concentration not disclosed
    gapType: private-evidence-only
    severity: material
    description: >-
      No total customer count by tier, top-10 customer revenue share, or customer concentration
      breakdown has been publicly disclosed. With 7-figure deals in Q1 FY2027 and NYSE as the
      flagship reference, revenue concentration risk is material but unquantifiable. Diligence
      requires a customer concentration table and ACV distribution by tier.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - id: EGU003
    topic: Retention cohort figure uses proxy/estimated data only
