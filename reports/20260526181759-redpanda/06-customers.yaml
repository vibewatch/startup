  - TU002
  figureRefs:
  - FU002
- id: section-3
  title: 'Named enterprise deployments: production evidence, outcomes, and reference quality'
  body: >-
    Redpanda's strongest public customer evidence includes several production deployments with
    quantified outcomes. NYSE uses Redpanda to power NYSE Cloud Streaming, processing hundreds
    of billions of messages per day with sub-100ms latency — a production system supporting
    one of the world's largest financial market operators, announced August 2025. ShareChat,
    India's largest social media platform (~400 million MAU), deployed Redpanda BYOC and
    publicly reported 70% reduction in cloud infrastructure spend, with millions of dollars
    in annual savings; ShareChat is actively scaling additional use cases. Lacework's cloud
    security data pipeline has run Redpanda in production since December 2021, handling 14.5
    GB/sec at peak after sustaining more than 1,200% CPU footprint growth — cited in both an
    official Redpanda blog post and an independent NewStack case study. Akamai Technologies
    uses Redpanda for cloud security workloads and reported 55% lower costs than Confluent
    Cloud. Chess.com deployed Redpanda BYOC and reported predictable costs with no surprise
    overages. Truecaller (450 million users) cited near-zero maintenance overhead with the
    quote "Redpanda just works." Jump Trading processes billions of messages daily for its
    next-generation financial messaging platform. Johnson Controls reported 50–80% cost savings
    on Azure for smart-building IoT workloads. FeaturedCustomers independently validates 26
    customer testimonials and 19 case studies with a Spring 2026 Top Performer badge based on
    1,065 reference ratings. PeerSpot reviews consistently rate Redpanda 8–10/10 for stability.
    Evidence gaps: no NRR/GRR, no customer count, no independent audit of cost savings claims,
    and no renewal-rate data is publicly available.
  claimRefs:
