figures:
- id: FU001
  title: Customer Adoption Journey Map
  type: journey-map
  layout: wide
  summary: >-
    Maps the five stages of Redpanda customer adoption from initial developer discovery through
    community engagement, technical evaluation, production deployment, and eventual expansion. Shows
    how each stage is driven by specific demand signals and how BYOC switching costs enforce retention
    at the production stage.
  data:
    nodes:
    - id: discovery
      label: Developer Discovery
      detail: >-
        Engineers encounter Redpanda through Kafka cost pain, performance bottlenecks, or developer
        community search. GitHub stars (36% YoY growth in FY24) and Slack community (56% YoY growth)
        are the primary awareness surfaces.
      items:
      - label: Kafka operational complexity
        note: Primary trigger for most case studies
      - label: Confluent Cloud cost overrun
        note: Cited by Akamai (55% savings), ShareChat (70% savings), Johnson Controls (50-80% savings)
      - label: GitHub star and Slack community
        note: Organic developer-led discovery; 36% and 56% YoY growth respectively in FY24
    - id: evaluation
      label: Technical Evaluation
      detail: >-
        Platform teams run benchmarks comparing Redpanda to Confluent Cloud and Apache Kafka. The
        Kafka API compatibility allows drop-in testing without code changes. Truecaller: "We didn't
        need to change our code."
      items:
      - label: Kafka API compatibility
        note: Enables low-friction POC without application changes
      - label: Serverless free tier
        note: No-commitment entry point; up to 100 MB/s write throughput
      - label: Benchmark performance
        note: 'Lacework: "Redpanda was barely breaking a sweat" during benchmarking'
    - id: pilot
      label: Pilot / Initial Deployment
      detail: >-
        Enterprise customers deploy BYOC or Dedicated for one streaming use case. BYOC initial
        setup requires VPC provisioning but establishes data residency for regulated verticals.
      items:
      - label: BYOC VPC provisioning
        note: Compliance-driven for financial services and security customers
      - label: SOC 2 Type II certification
        note: Reduces security procurement friction in regulated verticals
      - label: Redpanda Connect integration
        note: 300+ connectors speed onboarding and reduce data pipeline build time
    - id: production
      label: Production Deployment
      detail: >-
        Customer scales the initial use case to full production load. BYOC switching cost is
        established — reprovisioning required for migration. Production evidence: NYSE (500B+
        msgs/day), Lacework (14.5 GB/sec), ShareChat (400M MAU).
      items:
      - label: BYOC switching cost lock-in
        note: Migration requires full control-plane and data-plane reprovisioning inside customer VPC
      - label: Scale-out with predictable billing
        note: 'Chess.com: "No surprise overages"; Truecaller: "near-zero maintenance"'
      - label: 'SLA: 99.99% for BYOC/Dedicated'
        note: Contractual reliability commitment per Redpanda Cloud SLA
    - id: expansion
      label: Expansion
      detail: >-
        Customers add new streaming use cases, expand throughput, or adopt the Agentic Data Plane
