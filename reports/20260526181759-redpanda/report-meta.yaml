companyProfile:
  summary: Redpanda is a San Francisco-based infrastructure company building a Kafka-compatible, C++-native streaming platform for low-latency event data, plus Redpanda Cloud, Redpanda Connect, and an Agentic Data Plane for enterprise AI. The company differentiates on a single-binary architecture with no ZooKeeper or JVM dependency, a BYOC deployment model for data sovereignty, and growing enterprise proof in finance, cybersecurity, telecom, and gaming. Redpanda has raised $265 million through a GV-led April 2025 Series D at a $1 billion valuation, but key financial metrics beyond third-party ARR and company-reported growth remain undisclosed.
  foundedDate: '2019-01-07'
  founders:
    - name: Alexander Gallego
      role: Founder and CEO
      claimRefs: [CO007]
  foundingLocation: Miami, FL, USA
  headquarters: San Francisco, CA, USA
  productSummary: Redpanda Streaming is a Kafka API-compatible broker written in C++ as a single binary without ZooKeeper or JVM dependencies; Redpanda Cloud adds managed Dedicated, Serverless, and BYOC deployments; Redpanda Connect adds 300+ connectors and CDC pipelines; and the Agentic Data Plane extends the stack into AI gateway, MCP, observability, and governed real-time context delivery.
  customerFocus: Platform and data engineering teams, security/AI platform teams, and large enterprises running latency-sensitive real-time workloads across finance, cybersecurity, telecom, gaming, and industrial data.
  businessModel: Commercialize self-managed and cloud streaming infrastructure through enterprise software, managed cloud, and BYOC contracts, then upsell connectivity and agent-governance modules. Revenue is usage- and contract-based, with BYOC positioned as the premium data-sovereignty tier.
  stage: Series D
  fundingStatus: $265M total raised across Seed, Series A, B, C, and D; latest $100M Series D in April 2025 at a $1B valuation, led by GV with Lightspeed participation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO004, CO006, CO007, CO016, CO022, CO025, CU020, CU021, CU022]
