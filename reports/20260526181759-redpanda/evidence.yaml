evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: funding
    missingEvidence: >-
      SEC Form D filings or equivalent regulatory disclosures for each Redpanda funding round to confirm exact amounts,
      dates, and post-money valuations.
    whyItMatters: >-
      Without regulatory filings, round sizes and valuations rest exclusively on company and investor press releases,
      which may omit secondary tranches, rollover capital, or convertible debt.
    diligencePath: >-
      Request SEC EDGAR search for 'Redpanda Data Inc.' or 'Vectorized Inc.' Form D filings; ask company directly for
      cap table and any credit facility documentation.
    relatedQuestionRefs:
      - QO026
      - QO018
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Independently verified ARR, gross margin, and net revenue retention figures from audited financial statements or a
      data-room disclosure.
    whyItMatters: >-
      All revenue metrics (ARR $26.1M, 70% growth) are either analyst estimates (GetLatka) or company-claimed without
      third-party verification; gross margin and NRR are not disclosed at all.
    diligencePath: >-
      Request audited financial statements, ARR bridge, customer cohort data, and NRR waterfall from company;
      cross-check with referenced investment memos.
    relatedQuestionRefs:
      - QO017
      - QO005
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, independent director names, board committee structure, and investor voting rights /
      reserved matters.
    whyItMatters: >-
      Only Dave Munichiello (GV) is publicly confirmed as a board member; the board's independence, composition, and
      governance controls are entirely opaque, which is a core diligence gap.
    diligencePath: >-
      Request current board roster, charter/bylaws, shareholder agreement, and any unanimous-consent provisions from
      company or legal counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: founding
    missingEvidence: Verified identity, role, and current involvement of Andy Ayers as a co-founder of Redpanda.
    whyItMatters: >-
      User diligence materials name Andy Ayers as co-founder but no public source — including all funding announcements,
      the official about-us page, and investor blogs — corroborates this; a gap in founding team history affects
      governance and equity analysis.
    diligencePath: >-
      Ask company directly for a list of founders with equity vesting schedules; verify any co-founder separation or
      founder-advisor arrangements.
    relatedQuestionRefs:
      - QO002
      - QO030
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
