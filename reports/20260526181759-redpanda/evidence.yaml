    topic: Kafka-compatible streaming infrastructure sub-layer market size
    description: >-
      No published analyst report isolates a TAM or SAM for the Kafka-compatible event streaming broker sub-layer
      specifically. GVR, Fortune Business Insights, and MarketsandMarkets all publish streaming analytics figures that
      include analytics processing tooling well above the broker layer. Confluent FY2024 revenue as a proxy is available
      from its public company period but was not independently verified in this research due to IR page redirect. Amazon
      MSK spend is never separately reported. Diligence path: request Confluent FY2024 revenue from SEC EDGAR or
      Bloomberg, plus MSK revenue disaggregated from AWS analytics segment if available.
