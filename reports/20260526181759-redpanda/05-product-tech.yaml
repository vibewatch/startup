  - id: product-module-map
    title: "Product module and SKU map"
    body: >-
      Redpanda Streaming is available in five SKUs spanning the open-source community, commercial on-premise, and three
      cloud-managed tiers. The Community Edition is Apache 2.0 licensed and freely available for self-managed deployment on
      Linux, macOS (via Docker), Kubernetes, and air-gapped environments. The Enterprise Edition adds tiered storage,
      role-based access control, multi-zone topic replication tuning, and 24×7 support under a commercial license. The
      three Redpanda Cloud tiers — Serverless (fully managed, auto-scaling, multi-tenant shared infrastructure), Dedicated
      (single-tenant clusters in Redpanda's cloud), and BYOC (clusters deployed in the customer's own AWS, GCP, or Azure
      account but fully managed by Redpanda) — cover a spectrum from zero-infrastructure developer trials to enterprise
      data sovereignty requirements. Cloud Topics in the R1 engine became generally available with Streaming version 26.1
      in Q1 2026; it can coexist with tiered-storage topics in the same cluster. Redpanda Connect offers 300+ pre-built
      connectors including CDC connectors for Postgres, MySQL, MongoDB, Oracle, and MSSQL; it is implemented in Go as an
      embeddable single binary and uses Bloblang for declarative transformations. The redpanda-data/connect GitHub
      repository had 8,700 stars and 7,417 commits as of the research date, indicating a healthy open-source adoption base.
      The Agentic Data Plane integrates Redpanda Streaming, Redpanda Connect, and the Oxla distributed SQL engine (acquired
      October 2025) into a unified governance surface for AI agents, offering an AI Gateway, centralized identity
      management via OAuth2/OIDC/MCP/A2A, OpenTelemetry-based observability, and token budget enforcement. The
      redpanda-data/redpanda core repository had 12,100 stars and 50,847 commits as of the research date.
