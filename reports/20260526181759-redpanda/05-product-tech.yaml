  - id: FE002
    title: "Customer workflow: data flow through Redpanda"
    type: flow
    layout: standard
    summary: >-
      End-to-end data path from source databases and event producers through Redpanda Streaming into downstream consumers,
      including the AI governance layer for agentic workloads.
    data:
      nodes:
        - id: sources
          label: "Data Sources"
          detail: "Databases (Postgres, MySQL, MongoDB), event producers, APIs, IoT sensors"
        - id: connect-ingest
          label: "Redpanda Connect (Ingest)"
          detail: "CDC connectors pull change events; HTTP/Kafka sources ingest event streams"
        - id: streaming-engine
          label: "Redpanda Streaming Engine"
          detail: "Durable partitioned log; Raft-replicated; NVMe + Cloud Topics storage tiers"
        - id: consumers
          label: "Consumer Applications"
          detail: "Real-time analytics, dashboards, ML model inference, microservices"
        - id: adp-agents
          label: "AI Agents (ADP governed)"
          detail: "LLM-backed agents consuming context; AI Gateway enforces token budgets and identity"
        - id: sinks
          label: "Data Sinks"
          detail: "Snowflake, S3/GCS data lakes, vector databases, downstream Kafka topics"
        - id: connect-egress
          label: "Redpanda Connect (Egress)"
          detail: "Sink connectors and Bloblang transformations push processed data to targets"
      edges:
        - from: sources
          to: connect-ingest
          label: "CDC / pull"
