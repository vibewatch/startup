  - id: deployment-reliability-support
    title: "Deployment, integration, reliability, and support"
    body: >-
      Redpanda supports self-managed deployment on Linux (Debian/Ubuntu, Fedora/RHEL/Amazon Linux), macOS via Docker,
      Kubernetes, and fully air-gapped environments. Redpanda Cloud is available on AWS, GCP, and Azure across multiple
      regions, with BYOC supporting customer-managed VPCs. The Cloud SLA (last updated March 17, 2025) commits to 99.99%
      monthly uptime for multi-zone Dedicated and BYOC clusters, 99.90% for Serverless instances, and 99.50% for single-zone
      clusters. Service credits range from 10% for any breach of the multi-zone 99.99% target up to 100% of the monthly fee
      for availability below 95%. The public status page (status.redpanda.com) recorded cloud control-plane uptime of 99.66%
      and Redpanda Cloud Accounts uptime of 99.96% during the Feb–May 2026 window; Redpanda Serverless showed 100% uptime
      in the same period. IsDown recorded 17 Redpanda outages over the trailing 12 months, most of which were minor support
      system incidents (e.g., Slack-to-Zendesk sync) rather than data-path failures. Redpanda Connect integrates with
      existing Kafka clients without code changes and supports a Kafka Migrator command for moving workloads from any Kafka
      system to Redpanda. Support tiers provide access to Redpanda's technical team via telephone, email, and customer support
      portal; BYOC and Enterprise tiers include dedicated account support with SLA-backed response times. The Agentic Data
      Plane is also deployable in a fully managed cloud, BYOC, or on-premise model, expanding the supported deployment
      surface. Roadmap items are tracked primarily through official press releases and the versioned documentation site;
      a formal public roadmap portal is not published, making forward feature visibility dependent on vendor communications.
