callouts:
  - calloutType: strength
    title: "Single-binary architecture eliminates operational complexity"
    body: >-
      Redpanda's C++ single-binary design removes ZooKeeper, the JVM, and multiple ancillary Java services from the
      operator's stack. This reduces provisioning time to under 90 seconds for a production Kubernetes cluster and
      eliminates the most common operational failure modes in large Kafka deployments. The thread-per-core architecture
      and microsecond-accuracy regression testing provide a defensible performance moat.
    claimRefs:
      - CE002
      - CE003
      - CE021
      - CE037

  - calloutType: risk
    title: "Cloud control-plane uptime gap versus contractual SLA"
    body: >-
      The public status page recorded 99.66% cloud control-plane uptime during the Feb–May 2026 window, which is below the
      contractual 99.99% multi-zone SLA. While this gap may reflect measurement scope differences (probe methodology vs.
      operational SLA), it warrants direct clarification with Redpanda. Seventeen outages tracked by IsDown over the
      trailing 12 months, predominantly minor support-system incidents, suggest data-path reliability is stronger than
      the control-plane metric implies, but confirmation requires diligence.
    claimRefs:
      - CE031
      - CE032
      - CE033

  - calloutType: risk
    title: "ADP is an early-GA product with limited public production evidence"
    body: >-
      The Agentic Data Plane launched in October 2025 and received significant feature additions in February 2026.
      As of the report date, public production deployments remain limited and largely unverified. The AI Gateway,
      Oxla SQL integration, and MCP/A2A protocol support represent genuine technical ambition, but enterprise
      procurement should require direct customer references and a detailed reliability SLA for the ADP tier before
      committing workloads.
    claimRefs:
      - CE007
      - CE018
      - CE042
      - CE043

  - calloutType: insight
    title: "ARM-hardware cost savings provide a concrete, near-term TCO lever"
    body: >-
      Redpanda's compatibility with AWS Graviton (ARM64) instances — where Kafka suffers JVM-related performance
      degradation — creates an immediate TCO advantage in AWS environments. Approximately 57% cost savings per byte
      delivered has been cited for Graviton deployments. For AWS-heavy enterprises evaluating a Kafka migration,
      this ARM advantage is a verifiable, hardware-level differentiator that does not depend on benchmarks run by
      Redpanda.
    claimRefs:
      - CE038
      - CE039

