  - id: trust-security-compliance
    title: "Security, compliance, and quality controls"
    body: >-
      Redpanda's security posture is aligned with the AICPA SOC 2 Trust Services Criteria for security, availability, and
      privacy. Redpanda publicly states that it has obtained SOC 2 Type 2 attestation, but the underlying audit report has
      not been made publicly downloadable; the company instead publishes a trust-center security posture document. Customer
      data isolation is enforced at the VPC level: Dedicated
      customers receive a single-tenant cluster in a separate VPC within Redpanda's cloud account, while BYOC customers
      run clusters in their own VPC and cloud account, ensuring sensitive data never leaves the customer environment. All
      data in transit is protected by TLS 1.2; OAuth2 and OIDC access tokens are encrypted at rest using AES-256 GCM, and
      tokens never leave the customer network. Federated SSO via OAuth2 and OIDC with PKCE is supported; passwords for
      non-SSO users are hashed with bcrypt. Production access by Redpanda engineering follows Zero Trust principles, with
      all interactive sessions recorded and retained for audit. The company conducts annual penetration testing and operates
      a bug bounty program, though neither pentest scope/vendor nor bug bounty platform is publicly named. Static secrets are
      stored in AWS/GCP Secret Manager with periodic rotation; IAM roles follow least-privilege. A blog post in September
      2023 documented the introduction of customer-managed VPCs and described SOC 2 compliance readiness, indicating the
      compliance program was active by that date. The PeerSpot review platform shows user feedback on Redpanda's reliability
      and operational characteristics; a formal independent security audit trail for enterprise procurement due diligence
      would require direct engagement with Redpanda's security team.
