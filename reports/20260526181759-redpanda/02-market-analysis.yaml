callouts:
  - calloutType: insight
    title: The infrastructure sub-layer is undersized by every published streaming analytics estimate
    body: >-
      Every major market research figure includes streaming analytics tooling, processing, and
      services built on top of the broker layer Redpanda occupies. A more precise market
      boundary would isolate the paid managed-platform and Kafka-compatible infrastructure
      spend, which has no clean published number but can be proxied through Confluent's public
      revenue and Amazon MSK's hyperscaler adoption—both of which suggest a multi-billion-dollar
      commercial pool at meaningful but not streaming-analytics-wide scale.
    claimRefs: [CM019, CM020, CM025, CM026, CM046, CM047]

  - calloutType: strength
    title: IBM-Confluent acquisition creates a structural window for Redpanda
    body: >-
      IBM's announced acquisition of Confluent—confirmed via Confluent's own blog—signals
      the category's maturity and strategic importance, while also creating a predictable
      enterprise re-evaluation cycle. Large accounts with Confluent deployments have
      historically reconsidered infrastructure choices during hyperscaler or enterprise-
      software acquisitions, and Redpanda's BYOC model offers a differentiated data-sovereignty
      alternative to a now IBM-owned managed service.
    claimRefs: [CM013, CM014, CM016, CM035, CM036, CM037]

  - calloutType: risk
    title: Diskless object-storage competitors attack the same cost-reduction buyer
    body: >-
      WarpStream (now part of Confluent) and AutoMQ compete directly for the buyer segment
      most attracted to Redpanda's cost efficiency positioning—teams replacing expensive Kafka
      deployments. WarpStream's 80%-cheaper-than-Kafka claim predates Confluent ownership and
      is now backed by Confluent's distribution. AutoMQ operates in a similar cost position.
      Redpanda's differentiation on latency and operational simplicity is real, but the cost-
      reduction narrative alone is no longer defensible as a unique selling point.
    claimRefs: [CM010, CM015, CM041, CM042, CM043, CM044]

