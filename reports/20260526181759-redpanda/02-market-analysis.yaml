  evidenceGaps:
    - id: EG001
      topic: Kafka-compatible streaming infrastructure sub-layer market size
      description: >-
        No published analyst report isolates a TAM or SAM for the Kafka-compatible event
        streaming broker sub-layer specifically. GVR, Fortune Business Insights, and
        MarketsandMarkets all publish streaming analytics figures that include analytics
        processing tooling well above the broker layer. Confluent FY2024 revenue as a proxy
        is available from its public company period but was not independently verified in
        this research due to IR page redirect. Amazon MSK spend is never separately reported.
        Diligence path: request Confluent FY2024 revenue from SEC EDGAR or Bloomberg, plus
        MSK revenue disaggregated from AWS analytics segment if available.
      relatedQuestionRefs: [QM005, QM019, QM020]
      relatedTableRefs: [TM002]
      severity: moderate

    - id: EG002
      topic: Redpanda audited revenue and NRR
      description: >-
        Redpanda's ARR, NRR, gross margin, churn, and channel mix are not publicly disclosed
        in audited form. GetLatka's $26.1M ARR is community-sourced. Company-stated growth
        rates of 300% FY2024 and 70% Q1 FY2027 are unaudited press claims. Sizing a reliable
        Redpanda SOM from public evidence is therefore not feasible. Diligence path: request
        audited financials, NRR by cohort, churn rate by segment, and ARR mix between Cloud
        and Self-Managed Enterprise.
      relatedQuestionRefs: [QM019, QM028]
      relatedTableRefs: [TM002]
      severity: moderate

