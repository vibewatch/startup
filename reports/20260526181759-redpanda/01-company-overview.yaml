          detail: "Kafka API-compatible, no ZooKeeper, no JVM; built for multi-core cloud hardware"
          tone: positive
        - id: deployment
          label: "Deployment flexibility"
          detail: "Self-managed, Fully Managed Cloud, and BYOC (launched Dec 2022); data sovereignty guarantee"
          tone: positive
        - id: connectivity
          label: "Redpanda Connect (300+ connectors)"
          detail: "Acquired from Benthos (May 2024); CDC, AI/GPU connectors; stateless Go binary"
          tone: positive
        - id: adp
          label: "Agentic Data Plane (ADP)"
          detail: "MCP-aware gateway, AI Gateway, observability, Oxla SQL; governs enterprise AI agents"
          tone: positive
        - id: customers
          label: "Enterprise customer base"
          detail: "NYSE, Cisco, Moody's, Vodafone, Activision Blizzard, 2 of top-5 US banks"
          tone: positive
        - id: investors
          label: "Investor & board backing"
          detail: "GV (all rounds, board seat), Lightspeed (Series C/D), Haystack VC (Series C)"
          tone: positive
        - id: constraints
          label: "BSL license + competitive pressure"
          detail: "BSL restricts cloud-provider bundling; IBM/Confluent acquisition intensifies competition"
          tone: warning
