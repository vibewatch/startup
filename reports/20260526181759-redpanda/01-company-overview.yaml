  - id: milestones-partnerships-adverse
    title: Milestones, Partnerships, and Adverse Events
    body: >-
      Redpanda's public milestone record is dense and well-documented. The company launched publicly in late 2020
      (approximately 22 months after the January 2019 first line of code), introduced its industry-first BYOC
      deployment model in December 2022, raised the landmark $100 million Series C in June 2023 while citing 5x
      revenue growth, and hit a $1 billion valuation in April 2025 at Series D close. The Benthos acquisition in
      May 2024 completed the end-to-end connectivity layer, and the Oxla acquisition plus the ADP launch in
      October 2025 represented Redpanda's strategic pivot toward enterprise AI governance.


      Customer partnerships document genuine enterprise reach. The NYSE Group adopted Redpanda to power NYSE Cloud
      Streaming, achieving sub-hundreds-of-milliseconds latency across more than 500 billion messages processed
      daily. ShareChat, India's largest social media platform, reports a 70% reduction in cloud infrastructure
      spend after switching to Redpanda BYOC. Jump Trading and Fortis Games are among enterprise customers who
      publicly cited Redpanda in the Series C press release. Enterprise trust signalers as of April 2025 include
      Activision Blizzard, Cisco, Moody's, Texas Instruments, Vodafone, and two of the top five US banks.
      Redpanda was also featured as an NVIDIA Vera CPU ecosystem partner and joined the Akamai Qualified Compute
      Partner Program in Q1 FY2027.


      Adverse signals center on competitive dynamics rather than operational crises. In December 2025, IBM
      announced an $11 billion acquisition of Confluent — Redpanda's primary direct competitor and steward of
      Apache Kafka — significantly increasing the resources and enterprise distribution behind Redpanda's most
      formidable incumbent rival. While Redpanda Cloud maintained stability during the GCP global outage of
      June 2025 (an incident described candidly on the company blog), the outage revealed a real dependency on
      major cloud-provider infrastructure for some service tiers. BSL licensing, while commercially rational,
      has drawn skepticism from parts of the open-source developer community who value true OSI-compliant
      licenses, creating some friction in community adoption relative to a fully open alternative. No public
      litigation, regulatory action, significant layoff events, or leadership scandals were found in the sources
      reviewed.
