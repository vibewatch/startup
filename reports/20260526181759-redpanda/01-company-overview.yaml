callouts:
  - calloutType: strength
    title: Kafka API compatibility + C++ performance moat
    body: >-
      Writing a Kafka-compatible platform in C++ from scratch — eliminating ZooKeeper and JVM dependencies —
      creates a durable performance and cost-efficiency advantage that cannot be easily replicated by Confluent's
      Java-based Kafka fork. Redpanda's 10x performance claim and NYSE-validated 4–5x improvement over traditional
      Kafka competitors indicate genuine technical differentiation that resonates with latency-sensitive enterprise buyers.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO042

  - calloutType: risk
    title: Key-person concentration in Alexander Gallego
    body: >-
      Every funding announcement, every strategic pivot, and every investor relationship traces back to a single
      founder. GV's explicit statement that they "proudly backed him in every round since Series A" reflects personal
      conviction, not institutional conviction in a management team. Loss or incapacitation of Gallego before a
      formal succession structure is established represents a material risk that the newly appointed leadership bench
      (Akidau, Corcoran, Czapiga) does not yet fully mitigate.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO014

  - calloutType: risk
    title: IBM/Confluent acquisition materially strengthens primary competitor
    body: >-
      IBM's announced $11 billion acquisition of Confluent in December 2025 gives Redpanda's most direct competitor
      access to IBM's 4,000-person enterprise sales force, global public-sector relationships, and data-platform
      integration stack. Redpanda must now compete against a well-resourced incumbent with an established open-source
      Kafka brand and IBM's Fortune 500 distribution — a structural competitive shift that materially raises the
      stakes of any sales cycle against Confluent.
    claimRefs:
      - CO038
      - CO004
      - CO005

  - calloutType: insight
    title: ADP pivot redefines TAM but adds execution risk
    body: >-
      Redpanda's October 2025 launch of the Agentic Data Plane — layering MCP-aware connectivity, AI observability,
      and SQL query (via Oxla) on top of its streaming core — repositions the company from a Kafka-replacement to an
      AI infrastructure company. This substantially expands the addressable market but introduces new competitive
      dynamics (against observability, API gateway, and enterprise AI middleware vendors) and execution risk, since
      no revenue contribution from ADP has been publicly disclosed.
    claimRefs:
      - CO031
      - CO034
      - CO044

