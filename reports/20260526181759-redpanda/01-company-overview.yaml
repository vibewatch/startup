  - id: capital-structure-funding
    title: Capital Structure and Funding History
    body: >-
      Redpanda has raised $265 million in total across five disclosed funding rounds through April 2025. The
      funding sequence begins with approximately $3 million in seed capital (circa 2019–2020 per analyst estimates),
      followed by a $12.5 million Series A (circa 2021), a $50 million Series B (circa February 2022) led by GV,
      a $100 million Series C (June 27, 2023) led by Lightspeed Venture Partners with participation from GV and
      Haystack VC, and a $100 million Series D (April 3, 2025) led by GV with participation from Lightspeed, which
      valued the company at $1 billion — making Redpanda a unicorn. The $165 million raised through Series C was
      confirmed in the company's own press release; the BusinessWire Series D announcement confirmed $265 million
      total raised as of the April 2025 close.


      GV (Alphabet's venture arm) has been the most consistent institutional backer, participating in every round
      since Series A and leading both the Series B and Series D. Lightspeed led Series C and co-invested in Series D.
      Haystack VC participated in Series C. GV's Dave Munichiello sits on the board, providing operational
      governance visibility for the lead investor. No secondary transactions, preferred-share terms, liquidation
      preferences, or debt/credit facilities are publicly disclosed; these are material gaps for a full capital-
      structure analysis.


      GetLatka, an analyst database that reports company-disclosed metrics, estimates Redpanda's ARR at $26.1
      million as of December 2025. The company's own press release dated May 14, 2026 — covering Q1 FY2027 —
      reported 70% ARR growth year-over-year without disclosing an absolute ARR figure. FY24 (fiscal year ending
      January 2024) saw 300% revenue growth and 179% customer growth per a February 2024 press release. These
      growth rates are company-claimed and carry no independent verification. The Series C press release from
      June 2023 cited 5x revenue growth for the prior fiscal year. Revenue concentration, gross margin, net
      revenue retention, and customer count are not publicly disclosed and represent material valuation gaps.
