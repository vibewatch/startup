- id: financing-context
  title: Financing context and capital entry discipline
  body: 'Redpanda has raised $265–266M across five rounds over five years: $3M seed (2020), $12.5M Series A (January 2021),
    $50M Series B (February 2022), $100M Series C (June 2023), and $100M Series D (April 2025). Each round was led by a Tier-1
    investor: GV (Series A, B, D), Lightspeed (Series C). The 22-month interval between Series C and Series D, each at $100M,
    with an estimated 3x valuation step-up from approximately $300–350M to $1B, reflects high-conviction re-up from the existing
    syndicate. No Form D was found in SEC EDGAR for "Redpanda Data Inc" or "Redpanda Data" as of May 2026. At approximately
    188 employees and estimated $3–6M monthly burn, the Series D provides roughly 17–33 months of runway from April 2025,
    implying a Series E decision in late 2026 to mid-2027. Redpanda''s BSL 1.1 licensing strategy protects revenue but may
    constrain the community-led growth flywheel. A new investor at the $1B Series D price requires a $3–5B exit to achieve
    3–5x return, achievable only in the bull scenario; the base case implies near-breakeven or slight loss on entry price.'
