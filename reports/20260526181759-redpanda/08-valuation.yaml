- id: comparable-analysis
  title: Comparable company and precedent transaction analysis
  body: The primary valuation anchor in the sector is the IBM acquisition of Confluent, announced April 2025 at $31 per share
    in cash, implying total consideration of approximately $10.4B. Against Confluent's FY2024 revenue of $963.6M (73.3% gross
    margin, $(419.1M) operating loss), this represents approximately 10.8x revenue — an M&A comp at commercial scale. Confluent's
    FY2024 operating loss illustrates that the sector tolerates sustained losses for growth, but the 10.8x multiple (versus
    20–30x software multiples of 2021) reflects post-2022 compression. For Redpanda at $26–45M ARR, reaching a Confluent-comparable
    $10.4B exit requires $1B+ revenue — a 23–38x growth path. A nearer-term strategic exit at $1.5–3B (1.5–3x Series D) requires
    $140–280M ARR at 10–12x revenue, achievable in 4–6 years at 50–70% CAGR. The MarketsAndMarkets event streaming platform
    estimate ($4.34B in 2025, 12.4% CAGR to $7.78B by 2030) represents the more conservative market sizing; Mordor Intelligence's
    $32.6B streaming analytics TAM represents the AI-integrated opportunity. Confluent's acquisition of WarpStream (Q4 2024)
    demonstrates M&A appetite for pre-scale Kafka-compatible infrastructure but eliminated that specific entry-path. AWS Kinesis
    Data Streams pricing benchmarks the commodity floor; Redpanda's BYOC pitch is that performance and total cost at high
    throughput justify a premium.
