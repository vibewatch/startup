- id: TV005
  title: Thesis-Break Triggers and Monitoring Signals
  columns:
  - Trigger
  - Signal
  - Threshold
  - Action
  rows:
  - - ARR growth deceleration
    - New ARR growth drops below 40% YoY for two consecutive quarters
    - <40% YoY new-ARR growth
    - Downgrade to Avoid; re-assess base-case exit multiple
  - - Hyperscaler competitive pricing
    - AWS MSK or Google Pub/Sub announces managed Kafka service with pricing below Redpanda BYOC TCO
    - Price parity or below on equivalent throughput configuration
    - Elevate competitive risk to critical; require updated TCO analysis
  - - NRR below 100%
    - If NRR data is disclosed and is below 100%, land-and-expand thesis is broken
    - NRR <100%
    - Downgrade to Avoid immediately
  - - Confluent (IBM) enters self-managed BYOC
    - Post-acquisition IBM launches a Confluent BYOC tier competitive to Redpanda's primary differentiator
    - Confluent BYOC pricing announcement
    - Elevate threat level; re-assess differentiation moat
  - - Down-round or flat Series E
    - Redpanda raises Series E at valuation below $1B or flat
    - Series E valuation ≤$1B
    - Confirm impairment; re-evaluate full investment thesis
  - - Key founder or CTO departure
    - Alexander Gallego (CEO) or Tyler Akidau (CTO) departs without clear succession
    - Leadership departure announcement
    - Pause diligence; assess succession plan before proceeding
  notes: Triggers represent qualitative judgment calls on thesis-invalidating events. Thresholds are indicative; actual decision
    depends on full context at time of signal. No official financial targets have been set.
