  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: undisclosed unit economics
    missingEvidence: Gross margin by revenue tier (BYOC vs. Dedicated vs. Serverless), net revenue retention (NRR) cohort
      data, customer acquisition cost (CAC), payback period, and blended gross margin.
    whyItMatters: The investment case cannot be underwritten without gross margin and NRR data. A 38x ARR multiple may be
      justifiable at 80%+ gross margin and 130%+ NRR but is clearly stretched at 60% margin and 90% NRR. These two variables
      alone could swing the investment verdict from Track to Avoid or Invest.
    diligencePath: Request audited or CFO-certified FY24–FY26 P&L with gross profit by revenue tier and NRR waterfall by annual
      cohort. This is a prerequisite for any investment decision at current valuation.
