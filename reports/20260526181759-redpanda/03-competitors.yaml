  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - C++ thread-per-core architecture yields sub-ms tail latency vs JVM Kafka
        - Kafka native compilation (GraalVM) or continued JVM optimization narrows latency gap; continued KRaft improvements reduce ZooKeeper friction
        - Medium
        - Verify Redpanda's regression benchmark program keeps pace with Kafka 4.x improvements; test Kafka on GraalVM AOT compilation timeline
      - - Single-binary simplicity eliminates ZooKeeper/JVM operational burden
        - Kafka KRaft (ZooKeeper removal) eliminates a key historic pain point; AutoMQ/WarpStream/Aiven diskless simplify S3-native deployments with comparable or better cost profile
        - High
        - "Assess customer win-loss data — are prospects citing ZooKeeper complexity or pricing as primary trigger? If the ZooKeeper argument is dying, what replaces it?"
      - - Full Kafka API compatibility reduces buyer migration friction to Redpanda
        - Same compatibility enables defection to any Kafka-compatible alternative with equal ease; no proprietary data-layer lock-in
        - High
        - Determine whether Redpanda Connect pipeline configs and ADP workloads generate sufficient operational lock-in to offset Kafka-API portability risk
      - - IBM acquisition of Confluent creates integration uncertainty and enterprise sales disruption
        - Post-close IBM may accelerate Confluent's enterprise reach through IBM's existing middleware and hybrid cloud customer base; IBM distribution could expand Confluent's addressable market
        - Medium
        - Monitor IBM go-to-market integration timeline; track Confluent churn vs. new logos post-acquisition close (expected mid-2026)
      - - BSL open-source license provides source visibility while protecting commercial features
        - License change from SSPL to BSL reduced open-source credibility; Apache 2.0 alternatives (Kafka, AutoMQ, Pulsar) have procurement and community advantage in open-source-first organizations
        - Medium
        - Track community forum activity, GitHub star trends, and procurement objections related to BSL in competitive win/loss analysis
      - - Pricing premium positions Redpanda as a performance/simplicity specialist vs cost-optimized S3-native alternatives
        - Multiple adverse user reviews (Gartner, Apr 2026) cite pricing as significantly out of range vs competitors; commoditization from WarpStream/AutoMQ in latency-tolerant segments could compress win rates in price-sensitive accounts
        - High
        - Request win/loss analysis, NPS data, and pricing elasticity studies; verify whether performance premium justifies cost delta for target use cases
    notes: >
      Severity ratings are qualitative assessments based on market evidence gathered through May 2026; not formal
