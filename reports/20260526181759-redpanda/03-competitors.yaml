  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: confluent-revenue-scale
      missingEvidence: Confluent's current ARR or revenue breakdown vs Redpanda's, and post-IBM-acquisition financial trajectory
      whyItMatters: Revenue scale gap between Confluent and Redpanda affects go-to-market durability assessment; a large revenue gap enables Confluent to invest more in competitive features and enterprise sales
      diligencePath: Request Confluent's most recent publicly filed financials (10-K or 10-Q prior to acquisition close) and compare to Redpanda's disclosed metrics; interview Confluent sales professionals or customers
      relatedQuestionRefs:
        - QP010

    - type: missing-source
      severity: material
      topic: kafka-native-compilation-roadmap
      missingEvidence: Apache Kafka project roadmap for native compilation (GraalVM AOT or similar) that could narrow Redpanda's latency advantage
      whyItMatters: If Kafka achieves sub-10ms tail latency with GraalVM native compilation, Redpanda's primary technical moat narrows significantly; this is the single biggest potential moat-eroding development
      diligencePath: Review Apache Kafka KIP proposals and developer mailing list discussions on GraalVM/native compilation; engage Kafka committers directly at Kafka Summit
      relatedQuestionRefs:
        - QP019

    - type: missing-source
      severity: minor
      topic: automq-deployment-model-detail
      missingEvidence: AutoMQ's cloud-managed offering availability, enterprise SLA, and certified deployment regions
      whyItMatters: AutoMQ's competitive threat depends partly on whether it offers a production-grade managed service with enterprise support; self-managed-only limits its reach in large enterprise accounts
      diligencePath: Request AutoMQ enterprise support documentation; review customer case studies and compliance certifications
      relatedQuestionRefs:
        - QP002

    - type: missing-source
      severity: minor
      topic: competitor-distribution-gtm
      missingEvidence: Detailed distribution channel structures for Confluent, Redpanda, and MSK (VAR partners, system integrators, marketplace co-sell commitments)
      whyItMatters: Channel distribution power determines enterprise deal capacity and competitive win rate at scale; Confluent's and IBM's combined channel could be materially stronger than public docs reveal
      diligencePath: Review AWS Marketplace co-sell commitments, Confluent partner portal, and IBM Global Business Partner program for Confluent and Redpanda coverage
      relatedQuestionRefs:
        - QP005

    - type: stale
      severity: minor
      topic: redpanda-latency-benchmarks
      missingEvidence: Independently replicated third-party benchmark comparing Redpanda, Confluent Cloud, and MSK at current software versions (post-2024) with standardized workloads
      whyItMatters: Redpanda's primary benchmark is vendor-authored from 2022 (Kafka 3.2); Kafka has released 4.x with performance improvements; without independent verification the 10x latency claim is unconfirmed
      diligencePath: Commission independent OpenMessaging Benchmark run on Redpanda vs Kafka 4.x vs Confluent Cloud using identical hardware and configuration; compare tail latency under TLS/SASL workloads
      relatedQuestionRefs:
        - QP013
        - QP017

    - type: missing-source
      severity: material
      topic: ibm-post-acquisition-gtm
      missingEvidence: IBM's planned go-to-market integration strategy for Confluent post-close and timeline for leveraging IBM's enterprise distribution channels
      whyItMatters: Post-close IBM channel integration could significantly amplify Confluent's enterprise reach, turning the acquisition from a distraction into an accelerant within 12-24 months
      diligencePath: Monitor IBM investor calls and Confluent customer communications post-close; track Confluent new enterprise logo announcements sourced from IBM relationships
      relatedQuestionRefs:
        - QP017

