  - id: switching-costs-lock-in
    title: Switching Costs, Lock-in, and Distribution Power
    body: >
      Kafka API compatibility is both a moat and a double-edged sword for Redpanda. Full Kafka protocol compatibility
      means migrating from self-managed Kafka to Redpanda requires only an endpoint URL change with no client code
      modifications—dramatically lowering acquisition friction. However, the same compatibility that enables Redpanda
      adoption also enables defection: any Kafka-compatible alternative (Confluent, WarpStream, AutoMQ, MSK) can be
      substituted with equivalent ease once a customer is on the Kafka API standard. True stickiness in the Redpanda
      ecosystem must therefore be generated by Redpanda Connect data pipeline configurations (300+ connectors, stateless
      YAML-based config), operational tooling integrations, compliance certifications, and Agentic Data Plane workloads
      that tie into Redpanda's proprietary AI Gateway and MCP server.

      Amazon MSK creates the strongest platform lock-in through deep AWS service integrations (IAM, Glue, CloudWatch,
      Lambda triggers, MSK Connect managed connectors), making workloads difficult to migrate even when the Kafka wire
      protocol is compatible. Confluent Platform's multi-component architecture with Confluent for Kubernetes operators,
      Control Center, Schema Registry, and managed Flink service layers create administrative tooling lock-in even when
      the data layer is portable. Multi-homing (running multiple streaming platforms simultaneously) is technically
      feasible for Kafka-compatible alternatives but incurs significant operational overhead; most enterprises choose
      one primary platform. The internal-build alternative (self-managed Kafka) remains a constant competitive option
      for large engineering teams with Kafka expertise, particularly as KRaft removes the ZooKeeper dependency that
      drove many initial Redpanda evaluations.

      Distribution power: Confluent benefits from a decade of enterprise sales relationships, a global partner ecosystem,
      and—post-IBM acquisition—potential access to IBM's massive enterprise sales force and existing middleware
      customer base. Amazon MSK benefits from AWS's dominant cloud market position, co-sell programs, and co-location
      with other AWS services. Redpanda competes primarily through technical community engagement, self-serve cloud
      trials, and a direct enterprise sales motion; it lacks the distribution scale of IBM/Confluent or AWS.
