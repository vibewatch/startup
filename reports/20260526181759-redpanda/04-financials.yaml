- id: section-4
  title: 'Capital adequacy and runway: Series D at $1B valuation, estimated 17-33 months of runway'
  body: 'Redpanda completed a $100 million Series D in April 2025, led by GV (Google Ventures), with Lightspeed Venture Partners
    participating, at a $1 billion valuation. Total capital raised stands at approximately $265 million across five rounds:
    a $3 million seed (2020), $12.5 million Series A (January 2021), $50 million Series B (February 2022), $100 million Series
    C (June 2023), and the $100 million Series D (April 2025). GV has backed every round since Series A, providing continuity
    of insider commitment. No Form D filing was found in the SEC EDGAR full-text search for either "Redpanda Data Inc" or
    "Redpanda Data" as of May 2026 — consistent with a private company with no public securities registration. No public debt
    obligations or credit facilities have been disclosed. Series D proceeds are being deployed to accelerate the Agentic Data
    Plane, open offices in San Francisco and Austin, and hire three senior executives including CFO Kyle Corcoran. At an estimated
    monthly burn of $3M-$6M (based on approximately 188 headcount plus cloud hosting and office costs), the $100M raise implies
    approximately 17-33 months of runway from the April 2025 close, suggesting a Series E decision point in late 2026 to mid-2027.
    These burn estimates are derived from public proxy data only — no official burn or cash figure has been disclosed by Redpanda.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
