- id: section-2
  title: 'Traction and growth signals: high reported growth, limited independent corroboration'
  body: 'Company-reported growth figures are strong but not independently audited. Redpanda''s February 2024 press release
    reported 300% year-over-year revenue growth in FY24 and 179% customer growth, with BYOC deployments more than tripling.
    The May 2026 Q1 FY2027 press release reported 70% new ARR growth year over year — the company''s best new-ARR quarter
    and its most 7-figure deals in a single quarter in company history. The June 2023 Series C announcement cited 5X revenue
    growth over the prior year. The only independent third-party ARR estimate is from Getlatka (December 2025), which placed
    ARR at approximately $26.1 million with 188 employees, implying a revenue-per-employee ratio of roughly $139K — consistent
    with an early-growth SaaS company investing heavily in sales and R&D. Enterprise customer quality is visible: the NYSE
    uses Redpanda to power NYSE Cloud Streaming, processing hundreds of billions of messages daily with sub-100ms latency.
    Activision, Cisco, Moody''s, Snowflake, and two of the top five US banks are cited as users. The ShareChat deployment
    handles 400 million MAU, and the Lacework deployment peaked at 14.5 GB/s throughput. These enterprise proof points suggest
    Redpanda''s BYOC tier is landing meaningful accounts, though revenue concentration risk across large accounts cannot be
    assessed from public data. Community growth of 56% in Slack membership and 36% in GitHub stars in FY24 signals healthy
    developer adoption as a demand-generation flywheel.'
  claimRefs:
