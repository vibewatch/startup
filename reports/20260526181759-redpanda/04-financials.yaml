company:
  name: Redpanda
chapter:
  number: 4
  title: Financials
  summary: Redpanda monetizes through four cloud and software tiers, with company-reported 70% new ARR growth in Q1 FY2027
    and 300% revenue growth in FY24. A third-party estimate places December 2025 ARR at approximately $26 million. The $100
    million Series D (April 2025, GV-led, $1B valuation) provides estimated 17-33 months of runway. Gross margin, burn rate,
    NRR, CAC, and payback period are not publicly disclosed, leaving significant unit-economics and capital-adequacy gaps
    that require management-level data to resolve. An independent 2026 technical analysis identified BSL licensing restrictions
    and stateful-broker scaling costs as potential competitive risks to Redpanda's pricing power.
sections:
- id: section-1
  title: 'Revenue model and pricing: cloud tiers, software licensing, and connector monetization'
  body: 'Redpanda operates four commercial revenue lines: Serverless cloud clusters billed on a pay-as-you-go throughput-and-storage
    model, BYOC (Bring Your Own Cloud) clusters deployed inside the customer''s VPC and priced under an annual commitment,
    Dedicated hosted clusters on annual contract, and an Enterprise Edition software license for self-managed deployment.
    Serverless is the lowest-friction entry point: it has no base cost, a free tier, and a maximum write throughput of 100
    MB/s with a 99.9% SLA. BYOC is the flagship enterprise offering, providing up to 2 GB/s write and 4 GB/s read throughput
    with a 99.99% SLA; its pricing is not publicly listed and requires a direct sales engagement. The BYOC architecture is
    structurally distinctive: by deploying the Redpanda brokers inside the customer''s own cloud account, the customer avoids
    cross-cloud egress costs endemic to multi-tenant SaaS streaming platforms. This is a direct cost-savings pitch validated
    by the ShareChat case study, which reported 70% reduction in cloud infrastructure spend. Redpanda Connect (300+ pre-built
    connectors) extends the monetizable surface into the data pipeline layer, and the Agentic Data Plane with AI Gateway adds
    token-budget controls for enterprise agentic workloads, creating a potential per-agent upsell. Official Redpanda Cloud
    documentation confirms support for AWS, GCP, and Azure across the BYOC tier.'
  claimRefs:
