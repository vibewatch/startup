callouts:
- calloutType: strength
  title: BYOC architecture creates a structurally favorable gross margin and a defensible enterprise cost pitch
  body: By deploying Redpanda brokers inside the customer's cloud account, BYOC eliminates cross-cloud egress costs and shifts
    compute infrastructure off Redpanda's balance sheet. The ShareChat case study (70% cloud spend reduction, millions USD
    annually) and NYSE deployment (sub-100ms at hundreds of billions of messages per day) validate both the cost and performance
    story. For BYOC, Redpanda's COGS is primarily control-plane and support — a structure that is more favorable than a full-hosted
    SaaS provider at scale.
  claimRefs:
  - CI003
  - CI016
  - CI017
  - CI019
  - CI020
  - CI040
- calloutType: risk
  title: Gross margin, burn rate, NRR, and runway are not publicly disclosed — underwriting is incomplete
  body: Despite strong growth signals and enterprise proof points, the public record does not support a quantitative financial
    verdict. Official ARR, gross margin, NRR, CAC, burn rate, and cash position are all unavailable. An independent technical
    analysis by AutoMQ identified BSL 1.1 licensing restrictions and stateful-broker scaling costs as structural risks that
    could compress competitive pricing power over time. Diligence requires direct access to management financial data.
  claimRefs:
  - CI021
  - CI022
  - CI031
  - CI032
  - CI044
  - CI045
  - CI046
- calloutType: recommendation
  title: Request audited financials, ARR waterfall by tier, and NRR cohorts before making a financial judgment
  body: 'Priority data requests: (1) ARR waterfall for FY24-FY26 by Serverless, BYOC, Dedicated, and Enterprise; (2) gross
    margin by tier (BYOC vs Dedicated COGS); (3) NRR cohort data for FY24 and FY25; (4) current cash position and monthly
    burn as of Q1 FY2027; (5) customer concentration analysis (top-10 ARR as % of total). Without these five data points,
    the financial chapter cannot progress beyond a growth-signals summary.'
  claimRefs:
  - CI021
  - CI022
  - CI024
  - CI025
  - CI026
- calloutType: insight
  title: $265M raised across five rounds with consistent GV backing signals strong investor conviction
  body: GV has participated in every round since Series A, and Lightspeed led Series C and participated in Series D. This
    insider-led follow-on pattern at increasing valuations (to $1B at Series D) is a positive signal on investor conviction,
    though it does not substitute for independent financial disclosure.
