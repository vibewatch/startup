  evidenceGaps:
  - id: EGI001
    topic: Official ARR and burn rate not publicly disclosed
    gapType: private-evidence-only
    severity: blocking
    description: Redpanda has not published official ARR, monthly burn rate, or cash position. The only ARR estimate is from
      Getlatka (third-party, $26.1M Dec 2025). Without management financials, ARR trajectory, runway, and growth quality cannot
      be verified.
    relatedQuestionRefs:
    - QI006
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - id: EGI002
    topic: Gross margin not disclosed; unit economics unavailable
    gapType: private-evidence-only
    severity: material
    description: No gross margin, NRR, CAC, or payback period data is publicly available. Estimates are based on comparable
      public SaaS infrastructure companies only. Diligence requires audited financials or management disclosure.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI003
  - id: EGI003
    topic: Runway and capital adequacy estimates only
    gapType: private-evidence-only
    severity: material
    description: Runway estimates are based on derived burn rate from headcount proxy. No official cash position, burn rate,
      or Series D deployment plan has been disclosed. Runway of 17-33 months is highly uncertain.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - id: EGI004
    topic: Redpanda financial estimate range limited to third-party and derived data
    gapType: private-evidence-only
    severity: minor
    description: The financial estimate range figure relies on Getlatka ARR estimate and analyst-derived burn and margin ranges.
      Confidence intervals are wide. Only the new-ARR growth rate (70%) and Series D amount ($100M) are company-reported.
    relatedQuestionRefs:
    - QI024
  - id: EGI005
    topic: Long-term capital intensity and IPO readiness not assessable from public data
    gapType: private-evidence-only
    severity: minor
    description: Without audited financials, burn trajectory, or board-level financial projections, it is not possible to
      assess Redpanda IPO readiness or capital intensity at scale. The CFO hire (Kyle Corcoran) suggests preparation, but
      the timeline is unknown.
    relatedQuestionRefs:
    - QI027
