callouts:
  - calloutType: risk
    title: Control Plane SLA Gap Is Documented and Unresolved
    body: >-
      The official Redpanda status page reports Cloud Control Plane uptime of 99.66% for the
      Feb–May 2026 window against a contractual 99.99% SLA. This gap is not explained publicly.
      Enterprise buyers with high availability requirements should verify the root cause, remediation
      timeline, and whether service credits were issued to affected customers before signing
      multi-year contracts.
    claimRefs:
      - CR018
      - CR019

  - calloutType: risk
    title: ADP Regulatory Exposure Under EU AI Act Requires Immediate Legal Opinion
    body: >-
      Redpanda's Agentic Data Plane is infrastructure for enterprise AI agents. Whether this
      constitutes a general-purpose AI model under Regulation 2024/1689 is ambiguous. If EU
      enterprise customers deploy regulated AI agents via ADP in financial advice, HR, or healthcare
      contexts, compliance obligations could flow upstream. Redpanda must obtain a formal EU AI Act
      classification opinion before scaling ADP in European markets.
    claimRefs:
      - CR015
      - CR016

  - calloutType: risk
    title: BSL Licence Has No Court Test — Moat Remains Theoretical
    body: >-
      The Business Source License underpins Redpanda's entire competitive moat against hyperscalers.
      The BSL has never been tested in court against a well-funded defendant offering a competing
      Kafka-compatible service. CockroachDB, MariaDB, and Redpanda's own adoption of BSL have
      established community precedent, but legal enforceability against AWS or GCP remains unproven.
      Any investor modelling Redpanda's competitive positioning should treat the BSL moat as
      probalistic rather than certain.
    claimRefs:
      - CR010
      - CR011

