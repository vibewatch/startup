      - number: '7.3'
        title: 运营、技术和安全风险
        blocks:
          - type: paragraph
            body: >-
              云基础设施可靠性是最直接可观察的风险维度。Redpanda Cloud 官方状态页覆盖 2026 年 2 月至 5 月，报告 Cloud Control Plane 可用率为 99.66%，低于多可用区
              Dedicated 集群 99.99% SLA 承诺。Redpanda Cloud SLA（2025 年 3 月 17 日更新）规定，多可用区集群低于 99.99% 时提供月费的 10% 服务抵扣，任何集群低于
              95% 时提供 100% 抵扣。SLA 的测量方法 —— 每 5 秒黑盒探测 —— 排除了计划维护、不可抗力或客户造成故障导致的停机，从而收窄了抵扣触发范围。同一窗口内 Cloud Accounts 可用率为
              99.96%，Serverless 为 100%，说明控制平面薄弱是主要运营缺口。


              IsDown 第三方监测记录，自 2025 年 3 月以来 Redpanda 有 20 起事件，过去 12 个月有 17 起。重大事件包括：2026 年 4 月 27 日影响 Cloud API 访问、持续
              6.1 小时的重大 DNS 问题；新 GCP 集群 Remote MCP 不可用 8 天（2026 年 1 月 29 日 – 2 月 6 日）；2025 年 12 月无法创建新 AWS 集群 13 小时；以及
              2026 年 4 月 14 日 54 分钟登录失败。每一次事件中，Redpanda 都强调客户集群数据仍保持运行 ——
              这是控制平面管理与数据平面持久性之间可信的区别；但对依赖自动化工作流的企业客户而言，管理平面不可用仍会被视为 P1 事件。


              Redpanda Cloud 基于 cell 的架构在 2025 年 6 月 12 日全球 GCP 故障期间得到展示，体现出真实韧性：当 GCP 大范围受扰时，Redpanda Cloud GCP
              集群保持稳定。这是有意义的风险缓释，但 Redpanda Cloud 仅在 AWS 和 GCP 上可用，形成平台集中依赖。Azure 未被列为受支持提供商，限制了大量标准化在 Azure 上的企业客户部署选择。


              安全姿态由 SOC 2 Type 2 attestation、年度渗透测试、bug bounty 项目、静态 AES-256 GCM 加密、传输中 TLS 1.2，以及 Zero Trust
              远程访问工具支撑。OpenCVE 对 `redpanda` 供应商记录了三个 CVE：CVE-2023-50976（CVSS 9.8 严重 —— Transactions API 缺少授权，已在 23.1.21
              和 23.2.18 修复）；CVE-2023-24619（CVSS 5.5 中等 —— AWS 凭证明文日志，已在 22.1.12/22.2.10/22.3.12 修复）；以及
              CVE-2023-30450（CVSS 4.3 中等 —— rpk 中 TLS 配置错误，已在 23.1.2 修复）。所有 CVE 都位于不再属于主要支持版本线的版本中。Redpanda 23.3+
              这条当前主要发布线没有记录 CVE。CVE-2023-50976 这个严重漏洞暴露了一个风险：类似授权缺口可能存在于更新功能（例如 ADP Transactions、AI Gateway）中，直到进入公开 CVE
              记录才被发现。
