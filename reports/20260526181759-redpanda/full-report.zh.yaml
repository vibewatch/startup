      - number: '4.5'
        title: 财务结论：增长信号强，但单位经济和资本信息缺口明显
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的公开财务画像是一家快速增长的云数据流公司：企业客户牵引力可信，BYOC 成本架构有辨识度，2025 年 4 月 Series D 后资产负债表资金充足。收入质量看起来扎实 —— 年度承诺型
