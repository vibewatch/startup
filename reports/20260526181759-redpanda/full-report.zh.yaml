      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Redpanda 由创始人兼 CEO Alexander（Alex）Gallego 领导。从种子轮到 Series D，他始终是公司对外最稳定的公众面孔和战略声音。GV 在 Series D 公告中称
              Gallego 是「一位出色创始人，能够独特地抓住这些变化」，并确认 GV「自 Redpanda Series A
              起每一轮都自豪地支持他」。这说明投资人信心长期存在，也暴露出显著的关键人集中度。公开材料没有披露替代 CEO 继任计划或联席 CEO 架构。


              2025 年至 2026 年初，管理层厚度明显增强。Tyler Akidau 于 2025 年 5 月加入担任 CTO；他在 Google 工作 12 年，曾担任 MillWheel
              流处理技术负责人，著有《Streaming 101》和 O'Reilly 书籍《Streaming Systems》，之后在 Snowflake 任杰出工程师。FY2027 Q1（财季大约截至 2026 年 3
              月）又新增 Kyle Corcoran 任 CFO、Melissa Czapiga 任 CMO、Raghu Nandan 任产品
              VP。一个季度内任命三名高管，说明公司在潜在退出或下一阶段增长前有意扩充高管梯队。现任领导层还包括 Jennifer Lawrence（CRO）、Jennifer Taylor（首席人力官）、Jennifer
              Anderson（工程 VP）和 David Foley（总法律顾问兼 VP）。


              治理形态符合私人风投支持公司的特征。2025 年 4 月 Series D 公告确认，GV Managing Partner Dave Munichiello
              是董事会成员。公司没有公开披露独立董事、治理政策或董事会构成细节。用户尽调材料提到联合创始人 Andy
              Ayers，但在已审阅的全部公开来源中，包括融资公告、领导层页面和投资人新闻稿，均无法交叉验证；这构成需要向公司确认的重大缺口。关键人风险偏高：所有一手来源中唯一具名创始人都是
              Gallego，他掌握公司叙事，也是与主要投资人维系关系的核心人物。
