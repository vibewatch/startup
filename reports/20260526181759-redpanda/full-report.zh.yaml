          values:
            - ADP CVE 遭利用（高，低）
            - 云控制平面 SLA 缺口；IBM-Confluent 竞争威胁（高，中等）
            - 创始人离职；工程带宽透支（高，高）
        - label: 低影响
          values:
            - GDPR SCC 缺口（中等，低）
            - Azure 缺席——TAM 受限；Oxla 集成延迟（中等，中等）
            - 运营事故频率；文档缺口（中等，高）
    approximationNotes: 可能性和影响是基于公开证据的定性判断；没有可用的内部概率模型或精算数据。
    claimRefs:
      - CR003
      - CR004
      - CR010
      - CR018
      - CR036
  - id: FR002
    title: 风险传导图——关键风险如何流向投资判断结果
    type: dag
    layout: wide
    summary: 有向无环图，追踪主要风险触发因素如何通过运营、财务和竞争渠道，层层传导到投资判断层面的结果（估值、ARR、投资人信心）。
    data:
      nodes:
        - id: hyperscaler
          label: 超大云厂商 Kafka 商品化
        - id: bsl-challenge
