  - id: FE001
    title: Redpanda 产品架构栈
    type: stack
    layout: standard
    summary: 从基础设施到 Agentic Data Plane 的五层架构，展示 Redpanda Streaming、Connect 和 ADP 如何叠在云无关部署基础之上。
    data:
      layers:
        - label: 基础设施与部署
          modules:
            - AWS、GCP、Azure（专属 / BYOC / Serverless）
            - Kubernetes、本地 Linux、隔离环境
            - ARM（Graviton）与 x86 硬件
        - label: Redpanda Streaming Engine（C++）
          modules:
            - Seastar 每核线程 / io_uring
            - Raft 共识（无 ZooKeeper）
            - NVMe 优先主题（磁盘复制）
            - Tiered Storage（冷数据卸载到 S3/GCS）
            - Cloud Topics / R1 引擎（直接写入 S3/GCS，v26.1 GA）
        - label: Kafka 兼容 API
          modules:
            - Kafka 线协议（生产者、消费者、管理）
            - 内嵌 Schema Registry
            - 内嵌 HTTP Proxy
            - 事务和消费者组
        - label: Redpanda Connect（Go）
          modules:
            - 300+ 预构建连接器（来源、汇、处理器）
            - CDC 连接器：Postgres、MySQL、MongoDB、Oracle、MSSQL
            - Bloblang 声明式转换语言
            - AI 处理器（OpenAI、Bedrock、Cohere、Ollama、Vertex AI）
        - label: Agentic Data Plane（ADP）
          modules:
            - AI Gateway（路由、token 预算、策略执行）
            - 统一身份：OAuth2 / OIDC / MCP / A2A 协议
            - OpenTelemetry 可观测性（AI 动作、智能体轨迹）
            - Oxla SQL 引擎（查询流动和静态数据）
    approximationNotes: 层边界是根据官方文档整理的逻辑产品分组；实际二进制 / 服务组成细节可能不同。ADP 层反映截至 2026 年 2 月已宣布的能力。
    claimRefs:
      - CE002
      - CE003
      - CE015
      - CE018
      - CE021
      - CE022
  - id: FE002
    title: 客户工作流：数据流经 Redpanda
    type: flow
    layout: standard
    summary: 从源数据库和事件生产者，经 Redpanda Streaming 到下游消费者的端到端数据路径，也包括面向智能体工作负载的 AI 治理层。
    data:
      nodes:
        - id: sources
          label: 数据源
          detail: 数据库（Postgres、MySQL、MongoDB）、事件生产者、API、IoT 传感器
        - id: connect-ingest
          label: Redpanda Connect（摄取）
          detail: CDC 连接器拉取变更事件；HTTP/Kafka 来源摄取事件流
        - id: streaming-engine
          label: Redpanda Streaming Engine
          detail: 持久分区日志；Raft 复制；NVMe + Cloud Topics 存储层
        - id: consumers
          label: 消费应用
          detail: 实时分析、仪表盘、ML 模型推理、微服务
        - id: adp-agents
          label: AI 智能体（ADP 治理）
          detail: LLM 支撑的智能体消费上下文；AI Gateway 执行 token 预算和身份策略
        - id: sinks
          label: 数据汇
          detail: Snowflake、S3/GCS 数据湖、向量数据库、下游 Kafka 主题
        - id: connect-egress
          label: Redpanda Connect（出口）
          detail: 数据汇连接器和 Bloblang 转换把处理后数据推送到目标
      edges:
        - from: sources
          to: connect-ingest
          label: CDC / 拉取
        - from: connect-ingest
          to: streaming-engine
          label: 写入主题
        - from: streaming-engine
          to: consumers
          label: 实时消费（Kafka API）
        - from: streaming-engine
          to: adp-agents
          label: 受治理上下文（ADP / MCP）
        - from: streaming-engine
          to: connect-egress
          label: 流水线来源
        - from: connect-egress
          to: sinks
          label: 交付到数据汇
