  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              流式数据基础设施市场围绕 Apache Kafka 展开；Kafka 是事实上的开源标准，商业平台和替代平台要么构建在 Kafka 之上，要么兼容 Kafka 协议。Redpanda
              瞄准同一批买方和工作负载，因此任何 Kafka 兼容平台都是直接或相邻替代品。格局可分为五类：（1）自托管开源（Apache Kafka、Apache Pulsar）；（2）商业化 Kafka
              平台（Confluent，包括其 WarpStream BYOC 产品）；（3）云托管 Kafka 服务（Amazon MSK、Aiven）；（4）S3
              原生无盘替代方案（WarpStream、AutoMQ、Aiven Diskless Kafka）；以及（5）不兼容 Kafka API 的云原生自研流式服务（Amazon Kinesis Data
              Streams、Google Pub/Sub）。Redpanda 的独特位置在于，它是一个兼容 Kafka API、围绕性能优化的平台，同时提供 BYOC 和自托管选项，卡在自托管 Kafka
              的复杂度与全托管服务的成本/厂商锁定之间。截至 2026 年中最具战略意义的竞争进展，是 Confluent 待完成的 IBM 收购（2025 年 12 月宣布，预计 2026 年中交割）；Redpanda
              积极将其营销为主要直接竞争对手面临「并购干扰」。与此同时，S3 原生无盘替代方案扩散，在价格敏感且可容忍延迟的细分中切入成本优化。Apache Kafka 尽管有 JVM
              开销和运维复杂度，仍保留庞大的安装基数和网络效应：全球前 10 大银行全部使用 Kafka，10 家最大保险公司中的 7 家也在使用。
