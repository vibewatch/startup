        - 未购买 SaaS 层时的自管理基础设施计算和存储成本
        - 通过云订阅支出的平台工程团队预算
        - Redpanda Cloud 与 Confluent 和 MSK 竞争的主要商业战场
      - - 流连接器和 CDC 管道
        - 数据源与流平台之间的变更数据捕获和集成连接器
        - Fivetran 或 Airbyte 等缺少流原生架构的纯批 ETL 工具
        - 数据工程和集成团队
        - Redpanda Connect 用 300+ 个连接器把这个相邻市场纳入扩张范围
      - - 智能体数据基础设施
        - 面向 AI 智能体部署的实时数据治理、连接和可观测性
        - 通用 AI 模型服务和推理平台
        - CTO 和 AI 基础设施团队
        - Redpanda 用 Agentic Data Plane 产品瞄准的新兴买方群体
      - - 流分析（广义）
        - 建立在事件流之上的分析处理、可视化和实时决策层
        - 位于该层之下的 Kafka 兼容 broker 基础设施
        - 分析和 ML 工程团队
        - 仅作为 TAM 测算背景；Redpanda 是该层的基础设施输入，而不是最终产品
      - - 自管理 Kafka 现状
        - 在裸金属或云 VM 上运维 Apache Kafka 集群的内部工程投入
        - 托管云订阅或商业 Kafka 发行版
        - DevOps 和平台工程团队
        - Redpanda 替换自管理 Kafka、降低运维成本的迁移机会
    notes: 流基础设施和流分析之间的边界，对估值很重要：Redpanda 是 $23.4B-$128.4B 流分析市场的基础设施输入，而不是这一支出池的完整参与者。来自流分析报告的 TAM 估计，会高估基础设施子层的可寻址市场。
