      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性需求驱动来自实时数据量的长期增长。Grand View Research 将实时预测依赖增加、数字化、IoT 设备扩张和 AI 列为最主要的市场增长力量。托管部署细分——与托管云平台最相关——2023
              年占最大份额，达到 51.7%，并持续扩张。BSFI 垂直是最大的终端使用细分，占 23.8%；欺诈检测是最大应用，占 18.8%。二者都与 Redpanda 在金融垂直中的客户集中度相符。


              AI 智能体工作负载的出现，是上一轮流式基础设施浪潮中尚未规模化存在的额外需求加速器。Help Net Security 于 2026 年 2 月报道称，Redpanda 的 ADP 层为 AI 智能体提供集中式
              AI 网关、借助 OpenTelemetry 实现的可观测性、统一认证和数据治理——这些能力并非既有 Kafka 部署原生具备。Redpanda 的 FY2027 Q1
              新闻稿明确把智能体与企业数据之间的治理基础设施缺口，定义为最近一个增长季度的核心需求驱动。IBM 收购 Confluent 表明，流式基础设施已经成为董事会层面的战略基础设施，这有助于验证企业给 Redpanda
              分配预算的合理性。


              既有 Kafka 部署的成本压力，是次要但具体的驱动。ShareChat 切换到 Redpanda 后，流式基础设施支出降低 70%。Teads 从 Confluent Cloud 迁出后，成本降低
              55%。Johnson Controls 在基于 Azure 的流式成本上节省 50-80%。WarpStream 以「比 Kafka 便宜 80%」切入市场，也确认总体拥有成本是领先采购标准。只要平台同时证明
              Kafka 兼容性和成本效率，这些切换模式就会形成入站迁移漏斗。


              采用约束同样显著。Apache Kafka 庞大的开源生态——数千个连接器、集成、库和运维知识——让深度投入 Kafka 的团队面临真实切换成本。WarpStream（现属 Confluent）和 AutoMQ
              直接争夺成本敏感细分。Gartner Peer Insights 上的 Redpanda 评论提到定价模型复杂。PeerSpot 评论将相较 Kafka
              更小的社区，以及仍在成熟的企业功能列为限制。Redpanda 自己的对比页面也承认，Confluent 的生态广度和 AWS MSK 的超大规模云厂商集成，是 AWS
              中心部署中的真实竞争优势。与一个已有数十年历史的开源项目相比，社区规模仍是结构性不对称；一家累计融资 $265M 的创业公司尚未补上这道差距。
