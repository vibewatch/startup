      - number: '7.2'
        title: 监管、法律和合规风险
        blocks:
          - type: paragraph
            body: >-
              Redpanda Data Inc. 是一家在 Delaware 注册成立的私营公司，没有在公开交易所注册的证券。SEC EDGAR 对 Form D 文件的搜索确认，每轮融资（种子轮至 Series
              D）均提交了豁免发行通知，与 Rule 506(b) 或 506(c) 豁免发行一致。公开法院记录或 EDGAR
              中没有出现执法行动、停止令或诉讼文件。无诉讼状态已经有记录，但并非永久确定；当企业部署扩展到金融服务和医疗客户时，合同责任暴露会增加。


              知识产权风险围绕 Business Source License（BSL）展开。Redpanda 创立时采用 BSL，是为了阻止云提供商把 Redpanda 代码库作为竞争性托管服务提供。BSL
              允许几乎所有使用场景 —— 包括商业生产使用 —— 但不允许云提供商把该作品打包成服务产品。BSL 尚未在法庭上与资金充足的超大规模云厂商交锋。WarpStream 2024 年 1 月发布
              “Bento”（Benthos 的分叉，后者后来被 Redpanda 收购并成为 Redpanda Connect）说明，资源充足的竞争对手会选择分叉，而不是遵从；IBM 于 2025 年 12 月宣布收购
              Confluent 后，可信独立挑战者数量减少，同时主要剩余对手的规模上升。


              数据隐私和合规：Redpanda Privacy Policy（2026 年 5 月 7 日更新）治理通过服务和营销渠道收集的个人数据。该政策承认跨境数据转移，并要求用户同意转移至美国。政策未提及 EU
              Standard Contractual Clauses（SCCs）或 Data Privacy Framework 充分性状态 —— 对 GDPR 下的 EU
              企业客户而言，这一缺口可能变得重要。Redpanda 公开 Data Processing Agreement 最近更新于 2024 年 10 月 1 日，其中明确纳入 EU SCCs、UK
              Addendum、Swiss FADP 处理、分包处理方通知权和后续转移义务，部分缓解了这一缺口；但这些保护取决于 DPA 是否通过客户合同执行，而不能只依赖面向营销的隐私政策。SOC 2 Type 2
              attestation 已取得并发布，为信息安全控制提供第三方验证。公开来源未提及 ISO 27001 认证。


              EU AI Act（Regulation 2024/1689）于 2024 年生效，为 AI 系统提供方和部署方引入基于风险的义务。Redpanda 的 Agentic Data Plane 是支撑企业 AI
              智能体的 AI 基础设施，而不是 AI 系统本身；它是否被归类为通用 AI 模型或高风险 AI 系统使能方存在模糊性，取决于部署场景。如果企业客户部署由 Redpanda ADP 支撑的受监管 AI
              智能体（例如金融建议、医疗或 HR 场景），合同合规义务可能向上游传导至 Redpanda 的基础设施协议。
