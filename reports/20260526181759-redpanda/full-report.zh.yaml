      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 建议为观察——估值倍数过高，缺少单位经济数据不应投资
            body: >-
              Redpanda 的 ARR 倍数约为过去 ARR 的 38x（前瞻估计 23–25x），是 IBM-Confluent 10.8x FY2024 收入 M&A 基准的
              2–3x。市场逻辑可信，投资人财团属于顶级，AI 顺风也真实存在，但如果没有毛利率、NRR 和 ARR 瀑布 披露，这些因素都不足以支撑以当前价格投入资本。上调路径清晰：披露 $60M+ ARR、BYOC 毛利率
              65%+、NRR 120%+。在这些触发条件满足前，观察是合适姿态。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV020
              - CV036
          - type: callout
            title: IBM-Confluent 给出 10.8x 收入 M&A 上限，Redpanda 必须靠显著增长穿越
            body: >-
              IBM 以约 $10.4B 收购 Confluent，而 Confluent FY2024 收入为 $963.6M，这是最相关的行业 M&A 可比。Redpanda 若要以可比的 10–12x 收入倍数、按
              Series D 价格 3x（$3B）退出，必须达到 $250–300M 年收入——相当于当前估计的 6–10x 增长。这需要连续 4–5 年保持 50–65% CAGR，并显著改善利润率。基准情景下的
              $700M–$1.1B，意味着按 Series D 进入价格接近盈亏平衡或小幅亏损。
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV036
          - type: callout
            title: 顶级财团连续两轮 $100M，显示内部投资人高信念支持
            body: >-
              GV（Google Ventures）自 Series A 起参与了 Redpanda 每一轮融资；Lightspeed 领投 Series C，并共同投资 Series D。这种由内部投资人牵头、估值约 3x
              上台阶（Series C 估计 $300–350M 至 Series D $1B）的跟投模式，是罕见的强机构信念信号。再加上 Haystack VC 的早期参与，以及 Lightspeed
              对“定义级产品-市场匹配”的描述，财团质量已经达到早期独角兽数据基础设施公司的强度。
            calloutType: strength
            claimRefs:
