              - CV039
              - CV041
          - type: callout
            title: ARR 和烧钱速度是第三方估计——尽调必须取得官方数据
            body: >-
              投资分析依赖两个未验证数据点：（1）GetLatka 对 2025 年 12 月 ARR 的 $26.1M 估计，驱动 38x 过去倍数；（2）分析师推导的每月 $3–6M
              烧钱速度，驱动现金跑道估计。任何投资承诺前，这两项都必须替换为公司确认数据。投资人应把经审计的 FY24–FY26 财务、按层级拆分的 ARR 和当前现金余额，作为第一批尽调请求。
            calloutType: assumption
