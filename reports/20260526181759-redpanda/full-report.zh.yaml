      - number: '6.2'
        title: 采用轨迹：公司披露增长、社区信号和独立估计
        blocks:
          - type: paragraph
            body: >-
              Redpanda 已披露连续多年高增长，但这些数字是未经审计的自我披露。2024 年 2 月新闻稿称，FY24 收入同比增长 300%，客户数增长 179%，BYOC 部署量增加到三倍以上。2026 年 5 月
              Q1 FY2027 新闻稿称，新 ARR 同比增长 70% —— 公司史上新 ARR 最好季度 —— 并创下单季 7 位数交易最多纪录。此前增长：Contrary Research 在 2023 年 6 月
              Series C 语境中提到 FY23 期间收入约增长 5×，意味着多年连续高增长。唯一独立第三方 ARR 估计来自 Getlatka（2025 年 12 月），ARR 约 $26.1 million，员工约
              188 人 —— 与一家高增长、早期规模化 SaaS 公司一致。社区信号也支持有机需求：FY24 Slack 社区成员增长 56%，GitHub stars 增长 36%。FeaturedCustomers
              2026 年春季资料显示有 26 条客户证言、19 个案例研究和 13 个视频，与正在扩大的企业背书基础相符。增长放缓也可见：从 FY24 的 300%+ 降至 Q1 FY2027 的 70% 新 ARR
              增长，仍然很强，但反映了更大基数上的自然规模化效应。客户数、总 ARR 和队列级留存仍未披露，无法独立评估增长质量和留存。
