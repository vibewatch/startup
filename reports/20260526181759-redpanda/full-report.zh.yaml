      - number: '5.2'
        title: 产品模块和 SKU 地图
        blocks:
          - type: paragraph
            body: >-
              Redpanda Streaming 提供五个 SKU，覆盖开源社区、商业本地部署和三档云托管层级。Community Edition 采用 Apache 2.0 许可证，可免费自管理部署在
              Linux、macOS（通过 Docker）、Kubernetes 和完全离线环境中。Enterprise Edition 在商业许可证下增加分层存储、基于角色的访问控制、多可用区 topic 复制调优和
              24×7 支持。三档 Redpanda Cloud —— Serverless（全托管、自动扩缩容、多租户共享基础设施）、Dedicated（Redpanda 云中的单租户集群）和 BYOC（集群部署在客户自有
              AWS、GCP 或 Azure 账户中，但由 Redpanda 全托管）—— 覆盖从零基础设施开发者试用到企业数据主权要求的完整谱系。R1 引擎中的 Cloud Topics 已随 Streaming 26.1
              版本于 Q1 2026 GA；它可以与分层存储 topic 共存于同一集群。Redpanda Connect 提供 300+ 预构建连接器，包括 Postgres、MySQL、MongoDB、Oracle 和
              MSSQL 的 CDC 连接器；它用 Go 实现为可嵌入的单二进制文件，并用 Bloblang 做声明式转换。截至研究日期，redpanda-data/connect GitHub 仓库有 8,700 stars
              和 7,417 commits，说明开源采用基础健康。Agentic Data Plane 将 Redpanda Streaming、Redpanda Connect 和 Oxla 分布式 SQL 引擎（2025
              年 10 月收购）整合为 AI agents 的统一治理界面，提供 AI Gateway、通过 OAuth2/OIDC/MCP/A2A 的集中身份管理、基于 OpenTelemetry 的可观测性，以及
              token 预算执行。截至研究日期，redpanda-data/redpanda 核心仓库有 12,100 stars 和 50,847 commits。
