      - number: '5.4'
        title: 部署、集成、可靠性和支持
        blocks:
          - type: paragraph
            body: >-
              Redpanda 支持在 Linux（Debian/Ubuntu、Fedora/RHEL/Amazon Linux）、通过 Docker 的 macOS、Kubernetes
              和完全离线环境中自管理部署。Redpanda Cloud 覆盖 AWS、GCP 和 Azure 的多个区域，BYOC 支持客户自管理 VPC。Cloud SLA（最近更新于 2025 年 3 月 17
              日）承诺，多可用区 Dedicated 和 BYOC 集群月度可用率为 99.99%，Serverless 实例为 99.90%，单可用区集群为 99.50%。服务抵扣从多可用区 99.99% 目标任何违约的
              10%，一直到可用性低于 95% 时抵扣 100% 月费。公开状态页（status.redpanda.com）记录，2026 年 2 月至 5 月期间云控制平面可用率为 99.66%，Redpanda Cloud
              Accounts 可用率为 99.96%；同期 Redpanda Serverless 可用率为 100%。IsDown 记录过去 12 个月 Redpanda 有 17 次故障，大多是轻微支持系统事件（例如
              Slack-to-Zendesk 同步），而不是数据路径故障。Redpanda Connect 可在不改代码的情况下与既有 Kafka 客户端集成，并支持 Kafka Migrator 命令把工作负载从任何
              Kafka 系统迁移到 Redpanda。支持层级提供通过电话、邮件和客户支持门户访问 Redpanda 技术团队；BYOC 和 Enterprise 层包含专属账户支持，并有 SLA
              支撑的响应时间。Agentic Data Plane 也可按全托管云、BYOC
              或本地部署模式交付，扩大了受支持的部署面。路线图事项主要通过官方新闻稿和版本化文档站点跟踪；公司未发布正式公共路线图门户，因此前瞻功能可见度依赖厂商沟通。
