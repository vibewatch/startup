      - number: '6.5'
        title: 扩张、集中度风险和商业耐久性
        blocks:
          - type: paragraph
            body: >-
              多个具名账户中能看到扩张信号。NYSE 已公开承诺把 Redpanda 合作扩展到 Apache Iceberg 集成，显示 Redpanda 最高调账户存在活跃的先落地再扩张动态。ShareChat 正在
              Redpanda BYOC 上「扩展新用例」。BYOC 架构产生结构性切换成本：迁移需要在客户 VPC 内重新配置完整控制平面和数据平面，提高已承诺企业客户的留存概率。Redpanda Connect 的
              300+ 数据连接器和 Agentic Data Plane AI Gateway，也在既有客户基础内创造额外增购路径。与 AWS、NVIDIA 和 Akamai
              的渠道合作降低了企业采购摩擦。集中度风险重大但无法量化：NYSE 是 Redpanda 最突出的公开部署，Q1 FY2027 出现多笔 7 位数交易，意味着头部客户 ACV
              集中度较高。公司未披露公开客户数、合同续约率或客户集中度拆分。SOC 2 Type II 认证和 BYOC VPC
              隔离降低了受监管企业客户的合规采购摩擦。未发现公开诉讼、合同争议或面向客户的监管执法行动。isdown.app 记录自 2025 年 3 月以来 20
              起云故障事件，这构成运营可靠性风险，可能影响延迟敏感型生产部署的续约决定。
