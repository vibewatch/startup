      - number: '3.3'
        title: 既有平台、相邻平台与替代方案
        blocks:
          - type: paragraph
            body: >
              Apache Kafka 仍是主导性在位者，也是所有替代方案的基准。Kafka 运行在
              JVM（Java/Scala）上，其架构针对本地数据中心设计；在这种环境里，跨机架复制几乎没有成本，而云部署会产生显著的按字节跨 AZ 复制费用。Apache Kafka 4.3 是最新版本，近几个版本通过
              KRaft 共识让 ZooKeeper 依赖变为可选，缓解了长期运维痛点。Redpanda 的基准测试声称，相比 Kafka 尾延迟快 10x，同等吞吐下所需节点最多减少 3x；测试使用 Apache
              OpenMessaging Benchmark 框架，并在 50MB/s、500MB/s 和 1GB/s 工作负载下启用 TLS/SASL。不过，Kafka
              无可匹敌的生态深度、零许可成本和庞大安装基数意味着，只要组织已有 Kafka 专长和工具投入，内部自建（自托管 Kafka）仍是可行现状选项。

              Amazon MSK（Managed Streaming for Apache Kafka）是 AWS 原生客户最常用的 Kafka 托管服务。MSK 提供两种
              消息代理类型：Standard（手动再均衡，灵活性最高）和 Express（每个消息代理吞吐最高 3x，扩容速度快 20x，但可配置性更低）。MSK Serverless 基础成本为 $0.75/hour，而
              Redpanda 为 $0.10/hour。MSK Standard 消息代理 需要手动分区再均衡，其 Standard SLA 为 99.9%，并明确排除 Apache Kafka 数据平面本身。MSK
              造成深度 AWS 锁定：schema registry 需要单独使用 AWS Glue，且不支持 GCP 或 Azure；支持人员也是通才，而非流式专家。不过，对大量以 AWS 为中心的企业而言，MSK 与
              IAM、VPC、CloudWatch 和其他 AWS 服务的原生集成，是强采用加速器。

              Apache Pulsar（最新 v4.2）将计算与存储拆分，内置多租户和地理复制，并通过 Kafka-on-Pulsar（KoP）桥接层提供 Kafka 兼容。Pulsar
              是多租户和跨地域部署中的既有选择，但其复杂拓扑和桥接层兼容风险，使它对多数 Kafka 原生买方而言只是次要考虑。Aiven 的托管 Kafka 服务提供无盘 topic（主题，KIP-1150
              实现），声称相比标准 3-AZ Kafka 节省 78% TCO，但 P99 无盘延迟为 1,500–2,000ms，显著高于 Redpanda。Amazon Kinesis Data Streams
              是全无服务器的 AWS 原生流式替代方案，定价为摄入 $0.032/GB、读取 $0.016/GB，但缺少完整 Kafka API 兼容性，并造成深度 AWS 锁定。
