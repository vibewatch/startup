    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层：垂直行业、买方画像和部署偏好
        blocks:
          - type: paragraph
            body: >-
              从公开来源可识别，Redpanda 具名客户至少跨六个垂直行业：金融服务和交易（NYSE、Jump
              Trading、StoneX、Alpaca、Bitwyre）、电信和社交媒体（Truecaller、Vodafone、ShareChat）、网络安全和云基础设施（Lacework、Akamai）、游戏和娱乐（Chess.com、Fortis
              Games、Activision Blizzard）、企业 IoT 和制造（Johnson Controls、Range Energy、Rivian），以及 AI
              基础设施（Poolside、Midjourney）。核心买方画像是中端市场到大型企业科技公司的平台或基础设施工程师，他们面临流式数据成本或性能挑战，通常因运维复杂度或成本超支，把 Redpanda 作为
              Apache Kafka 自管理集群或 Confluent Cloud 的替代方案评估。官方客户页列出 25+ 具名账户，用例覆盖实时事件处理、安全数据管道、IoT 遥测、金融消息和智能体 AI
              基础设施。Redpanda Cloud 提供三档自助或合同层级 —— Serverless（按用量付费）、BYOC（客户托管、年度合同）和 Dedicated（Redpanda 托管、年度合同）—— 外加
              Enterprise Edition 自管理许可证。BYOC 是旗舰企业产品，也是 FY24 增长最快的层级，部署量增加到三倍以上。金融服务、网络安全等受监管行业因数据驻留和合规要求，对 BYOC
              偏好明显。Kapa.ai 客户故事确认，Redpanda 的开发者门户服务 Activision、Texas Instruments、Midjourney 和
              Cisco，为具名企业关系提供了独立交叉验证。Redpanda 拥有 Akamai Qualified Compute Partner 认证，并宣布与 AWS 和 NVIDIA 集成，说明企业采购路径正在多元化。
