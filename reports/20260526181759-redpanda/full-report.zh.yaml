      - number: '1.3'
        title: 股权结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 4 月，Redpanda 已披露五轮融资，累计融资 $265 million。融资序列从约 $3 million 种子资金开始（分析师估计约在 2019–2020 年），随后是约 2021
              年的 $12.5 million Series A、约 2022 年 2 月由 GV 领投的 $50 million Series B、2023 年 6 月 27 日由 Lightspeed Venture
              Partners 领投且 GV 和 Haystack VC 参投的 $100 million Series C，以及 2025 年 4 月 3 日由 GV 领投、Lightspeed 参投的 $100
              million Series D。Series D 将公司估值推至 $1 billion，Redpanda 由此成为独角兽。公司自身新闻稿确认，截至 Series C 已融资 $165
              million；BusinessWire 的 Series D 公告确认，截至 2025 年 4 月交割，累计融资为 $265 million。


              GV（Alphabet 的风投部门）是最稳定的机构支持方，自 Series A 起每轮参投，并领投 Series B 和 Series D。Lightspeed 领投 Series C，并在 Series D
              中共同投资。Haystack VC 参与 Series C。GV 的 Dave Munichiello
              任董事，为主投方提供运营治理可见度。公开材料没有披露老股交易、优先股条款、清算优先权或债务/信贷安排；这些都是完整资本结构分析中的重大缺口。


              GetLatka 是一家报告公司披露指标的分析师数据库，估计 Redpanda 截至 2025 年 12 月的 ARR 为 $26.1 million。公司 2026 年 5 月 14 日发布的 FY2027
              Q1 新闻稿披露，ARR 同比增长 70%，但没有披露绝对 ARR 金额。根据 2024 年 2 月新闻稿，FY24（截至 2024 年 1 月的财年）收入增长 300%，客户增长
              179%。这些增速均为公司口径，缺乏独立验证。2023 年 6 月 Series C 新闻稿称上一财年收入增长 5x。收入集中度、毛利率、净收入留存率和客户数均未公开，是估值中的重大缺口。
