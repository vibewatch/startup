      - number: '6.4'
        title: 客户满意度、SLA 承诺和可靠性记录
        blocks:
          - type: paragraph
            body: >-
              第三方满意度信号正面但稀疏。FeaturedCustomers 基于 1,065 个背书评分，授予 Redpanda 2026 年春季数据流处理软件类别 Top Performer 徽章。截至 2026 年 4
              月，Gartner Peer Insights 显示两条评论：一名评论者称赞企业级性能和可靠性，另一名则把定价模型列为「重大担忧」。PeerSpot 评论者给出 8–10/10
              稳定性评分，并称赞易管理性，但也指出 BSL 许可限制和第三方插件生态较小，相比 Apache Kafka 是劣势。Redpanda SLA 承诺 Serverless 可用率 99.9%，BYOC 和
              Dedicated 层为 99.99%，违约时提供月度服务抵扣。官方状态页（status.redpanda.com）显示，2026 年 2 月至 5 月期间 Cloud Control Plane 可用率为
              99.66%，Cloud Accounts 为 99.96%，Serverless 为 100%。但 isdown.app 第三方故障跟踪器记录，自 2025 年 3 月以来 Redpanda Cloud 有
              20 起事件，包括持续 8 天的 GCP MCP 服务中断、54 分钟登录失败和数小时 DNS 问题 ——
              这种模式可能在任务关键型部署中构成客户满意度风险。这些故障记录是反向信号，会实质性限定可靠性叙事。NRR、GRR、客户流失率、合同续约率和 CSAT/NPS 分数均未公开披露，构成核心留存尽调缺口。Kapa.ai
              案例研究显示，Redpanda 每月处理 3,000–5,000+ 次开发者支持互动，AI 回答确定率为 93%，说明公司在开发者支持基础设施上投入充分，有助于满意度。
