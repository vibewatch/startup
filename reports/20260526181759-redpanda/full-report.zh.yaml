      - number: '2.5'
        title: 测算缺口、矛盾与尽调问题
        blocks:
          - type: paragraph
            body: >-
              最重大的证据缺口，是缺少一个专门针对 Kafka 兼容流式基础设施子层的干净公开 TAM/SAM。流式分析市场（$23.4B-$128.4B 区间）过宽，因为它包含消息代理层之外的分析处理、可视化和 ML
              推理。Confluent 作为上市公司时的历史收入代理具有方向性参考价值，但不是完整市场估算；Amazon MSK 嵌入超大规模云厂商账单的支出从不单独报告；WarpStream 收购后成本被折入
              Confluent；自托管 Kafka 部署的长尾也没有可靠的变现估算。


              第二个缺口，是除 GetLatka 的社区来源数据和 Redpanda 自身新闻稿外，缺乏对 Redpanda ARR 轨迹的独立验证。FY2024 增长 300% 和 FY2027 Q1 增长 70%
              均为公司口径。收入、NRR、流失率和渠道结构没有以经审计形式公开披露。因此，用公开来源测算 Redpanda 的 SOM 并不可行。


              值得保留的矛盾包括：Fortune Business Insights 和 MarketsandMarkets 发布的流式分析估算与 GVR 明显不同——研究期间，FurtuneBusiness Insights
              页面跳转到另一个市场，也确认了在没有付费门户订阅的情况下，已发布市场估算存在可靠性风险。GVR 的两个 CAGR 数据点（标题中 28.3%，图片 alt-text 中
              19.0%）说明报告可能在周期中途更新，却没有完全保持一致。这些问题应作为分析限制保留，而不是压缩成单一权威数字。
