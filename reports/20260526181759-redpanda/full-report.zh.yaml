        - 支持 io_uring 的 Linux 内核（≥5.1）
        - 内核 ABI 兼容性；C++ 专长门槛限制社区贡献
      - - Raft 共识模块
        - 分布式协调、leader 选举、元数据复制
        - 无——完全内部
        - 脑裂场景；高分区数量部署下 Raft 调优敏感
      - - Kafka API 兼容层
        - 面向所有现有 Kafka 客户端的线协议兼容性
        - 无——自包含
        - 高级 Kafka 功能（如 KIP-939）存在 API 对齐缺口；客户端版本漂移的边缘案例
      - - 嵌入式 Schema Registry
        - 消息 schema 存储与版本管理
        - 无——嵌入式
        - 面对复杂 AVRO schema 演进工作流时，成熟度低于 Confluent Schema Registry
      - - 分层存储
        - 冷数据卸载到对象存储；减少 broker 磁盘占用
        - 对象存储：AWS S3 / GCP GCS / Azure Blob
        - 冷读依赖云厂商可用性；读回产生出站流量成本
      - - Cloud Topics（R1 引擎）
        - 直接写入 S3/GCS；Raft 只存元数据
        - AWS S3 / GCP GCS
        - 批处理窗口带来更高写入延迟；读取路径必须从对象存储拉取
      - - Redpanda Connect（Go 二进制）
        - CDC、数据集成管道、AI 连接器、Bloblang 转换
        - 无（可嵌入）；上游 CDC 源数据库
        - CDC 连接器成熟度相较 Debezium；Go 运行时依赖与 C++ 核心分离
      - - Redpanda Console（Web UI）
        - 集群管理、topic 检查、schema 浏览
        - Redpanda broker 管理 API
        - 运维工具功能完整度低于 Confluent Control Center
      - - ADP AI Gateway
        - 集中式 AI 模型路由、token 预算、MCP 服务器注册表
        - 云 LLM API（OpenAI、AWS Bedrock、GCP Vertex AI、Ollama）
        - 产品处早期阶段；依赖云 LLM API，会给智能体工作流引入外部故障模式
    notes: 外部依赖与技术风险依据截至 2026-05-26 的官方文档和工程博客评估。风险严重性未独立验证；需要与 Redpanda 工程团队开展直接技术尽调。
    claimRefs:
