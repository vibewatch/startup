      - number: '5.6'
        title: 安全、合规和质量控制
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的安全姿态与 AICPA SOC 2 Trust Services Criteria 中的安全性、可用性和隐私标准对齐。Redpanda 公开称已取得 SOC 2 Type 2
              attestation，但底层审计报告没有公开下载；公司转而发布了信任中心安全姿态文件。客户数据隔离在 VPC 层执行：Dedicated 客户在 Redpanda 云账户内获得独立 VPC
              中的单租户集群，BYOC 客户则在自有 VPC 和云账户中运行集群，确保敏感数据永不离开客户环境。所有传输中数据都由 TLS 1.2 保护；OAuth2 和 OIDC 访问令牌使用 AES-256 GCM
              静态加密，令牌永不离开客户网络。支持通过带 PKCE 的 OAuth2 和 OIDC 做联合 SSO；非 SSO 用户密码用 bcrypt 哈希。Redpanda 工程团队的生产访问遵循 Zero Trust
              原则，所有交互式会话都会记录并保留用于审计。公司每年做渗透测试，并运营漏洞赏金项目，但未公开命名渗透测试范围/供应商或漏洞赏金平台。静态密钥存储在 AWS/GCP Secret Manager
              中，并定期轮换；IAM 角色遵循最小权限。2023 年 9 月一篇博客记录了客户自管理 VPC 的引入，并描述了 SOC 2 合规准备，说明合规项目当时已经启动。PeerSpot 评论平台展示了用户对
              Redpanda 可靠性和运营特征的反馈；若要形成企业采购尽调所需的正式独立安全审计轨迹，仍需直接接触 Redpanda 安全团队。
