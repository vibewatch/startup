      - number: '3.2'
        title: 直接同业：Confluent、WarpStream 与 AutoMQ
        blocks:
          - type: paragraph
            body: >
              Confluent 是 Redpanda 最主要的直接竞争对手。Confluent 由 Apache Kafka 原作者 Jay Kreps、Neha Narkhede 和 Jun Rao
              创立，打造了主导性的商业 Kafka 产品，并于 2021 年在 NASDAQ 上市。其产品组合包括 Confluent Cloud（运行在 AWS、GCP、Azure 上的 SaaS，由自研 Kora
              引擎驱动）、Confluent Platform（自托管的本地/混合部署）、Confluent 旗下 WarpStream（2024 年 9 月收购的 BYOC 无盘方案），以及 Confluent
              Private Cloud。2025 年 12 月 8 日，IBM 宣布以每股 $31.00 现金收购 Confluent，预计 2026 年中交割。Confluent 将在 IBM
              旗下以独立品牌继续运营，瞄准大型混合云企业；Redpanda 将这段整合期营销为 Confluent 客户的分心风险。Confluent 由多产品拼成的碎片化架构——Kora、WarpStream、Freight
              和 Platform 工作负载需要不同集群类型——与 Redpanda 统一的 R1 引擎形成对比；后者可在单一集群内按 topic（主题）优化。Confluent Cloud 提供 99.99%
              SLA、120+ 预构建连接器、80+ 全托管连接器，以及全托管 Apache Flink 服务——这是 Redpanda 目前缺失的能力。其基于 CKU 的定价模型被认为复杂，且同等工作负载下通常比
              Redpanda 成本更高。

              WarpStream（现由 Confluent 拥有）是架构上最不同的竞争者：它是一个无状态、基于 Go 的平台，直接写入 S3，没有本地磁盘，也没有跨 AZ 成本，营销口径是「比 Kafka 便宜 10x」。其
              produce P50 延迟约 250ms，端到端 P50 约 900ms，不适合低于 100ms 的延迟要求，因此主要定位在日志和可观测性等高容量、可容忍延迟的工作负载。WarpStream 在客户 VPC
              内运行 agent 程序，由 Confluent 管理控制平面；数据不需要跨账号 IAM 访问。关键客户包括 Robinhood（用 WarpStream 替换 Kafka
              处理日志）、Character.AI、Grafana Labs 和 ShareChat。

              AutoMQ 是一个开源 Kafka 分支，以 S3 作为主存储，并使用可插拔 WAL 层（S3 WAL 约 500ms 延迟；EBS WAL 可达低于 10ms P99）。AutoMQ
              声称通过按使用量付费且不收分区费，相比 Apache Kafka 节省 66% 成本。其 2026 年 4 月发布的 Kafka 生态对比分析自称为「独立分析」，虽然明显有利于
              AutoMQ，但仍提供了九个竞争平台的有用架构细节。AutoMQ 缺少 Confluent 或 Redpanda 的企业客户记录和社区规模。
