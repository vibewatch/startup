      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: IBM 收购 Confluent 可能增强而非削弱竞争对手
            body: >
              Redpanda 将 IBM–Confluent 交易营销为其主要竞争对手的「并购干扰」。短期内，整合复杂度确实是 Confluent 的风险；但 IBM 收购也让 Confluent 接入 IBM
              全球企业销售队伍、既有中间件和混合云客户关系，以及 IBM 在高度监管垂直中的品牌。交割后，Confluent/IBM 可能加速拿下 Confluent 过去无法单独触达的企业交易。这会部分抵消 Redpanda
              正在推动的「扰动」叙事，并值得继续监测交割后 Confluent 企业客户的增长。
            calloutType: risk
            claimRefs:
              - CP004
              - CP024
              - CP025
          - type: callout
            title: S3 原生替代方案在可容忍延迟细分中制造定价压力
            body: >
              WarpStream、AutoMQ 和 Aiven Diskless Kafka 合计覆盖了流式市场中的一块重要区域——日志、可观测性和 AI 训练数据管道等高容量、可容忍延迟工作负载——其成本结构比传统
              Kafka 便宜 66–80%。在这些细分里，Redpanda 的亚毫秒延迟优势不是决定因素。如果企业买方对工作负载分层，把可容忍延迟的数据交给 WarpStream/AutoMQ，只把延迟关键流保留在
              Redpanda，单客户可触达收入会收窄。用户反向评论称 Redpanda 定价相较竞争者「超出可接受区间」，进一步表明这类压力已经出现在竞争评估中。
            calloutType: risk
            claimRefs:
              - CP023
              - CP026
              - CP029
              - CP043
          - type: callout
            title: 统一 R1 引擎 vs Confluent 碎片化多产品架构
            body: >
              Redpanda 的 R1（One）引擎让单一集群可以服务多种工作负载，并按 topic（主题）优化延迟、一致性、可用性和成本。相比之下，Confluent 需要不同集群类型承载不同工作负载：Kora 对应标准
              SaaS，WarpStream 对应 BYOC/S3 原生，Freight 对应高容量无服务器，Confluent Platform
              对应自托管。这种架构碎片化增加客户管理复杂度和集成开销。对既要运维简单性又要性能的买方而言，Redpanda 的统一模型是真实产品优势——尤其在 Confluent 收购后多产品复杂度继续上升的情况下。
