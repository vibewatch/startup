      - number: '4.3'
        title: 成本结构与单位经济：BYOC 具备结构性优势，但没有公开利润率数据
        blocks:
          - type: paragraph
            body: >-
              Redpanda 云层成本结构主要由 AWS、GCP、Azure 的云基础设施托管驱动，这些托管成本构成 Dedicated 和 Serverless 集群的收入成本（COGS）。BYOC 对 Redpanda
              结构上更轻：计算跑在客户自有云账户中，Redpanda 的 BYOC 直接 COGS 基本限于控制平面开销和支持，而不是数据平面计算，因此毛利结构优于
              Dedicated。毛利率、NRR、CAC、回本周期均未公开披露。可比上市云原生 SaaS 基础设施厂商在规模化后订阅毛利率通常为 65-75%；Redpanda 的 BYOC 毛利率方向上可能接近，但
              Dedicated 因直接基础设施成本可能更低。公司 MSK TCO 博客称，BYOC 消除跨云出站流量成本；在高吞吐环境里，这项成本可接近甚至超过流式软件本身成本。竞争对手 AutoMQ 2026
              年独立技术分析指出，Redpanda 的 BSL 1.1 许可证限制竞争性使用，其无共享架构需要手动 broker 再均衡 —— 相比 S3 原生替代方案，可能抬高运营 TCO。这些架构因素可能压缩
              Redpanda 在成本敏感型中端市场的定价权；但在延迟敏感的企业工作负载中，ShareChat 和 NYSE 部署已验证 BYOC 的性能和成本架构，因此这些因素仍偏中性或有利。
