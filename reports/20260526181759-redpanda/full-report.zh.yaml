        - 可配置性低于预置型；有分区与吞吐约束
      - - WarpStream（BYOC/托管）
        - $0.01/GiB 写入（前 50 TiB 阶梯）；更高阶梯有批量折扣
        - 按 GiB 未压缩写入吞吐
        - S3 原生；零跨 AZ 成本；无状态代理；多区域
        - 客户账户中的代理 VM 成本另计；P50 写入延迟 250ms+
