      - number: '8.6'
        title: 投资建议、置信度和尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：观察。若没有实质性单位经济披露，不应在当前 $1B 估值投资。技术和市场逻辑可信，投资人财团属于顶级，AI 顺风也真实存在。但隐含 ARR 倍数约为过去 ARR 的 38x（或前瞻估计
              23–25x），相对唯一公开行业 M&A 可比（Confluent 10.8x）偏高；缺少毛利率、NRR 和 ARR 瀑布数据，投资逻辑无法承销。置信度：低。上调条件：（1）披露 ARR 超过 $60M
              且有独立佐证；（2）毛利率披露显示 BYOC 达 65%+、整体加权达 55%+；（3）NRR 高于 120%，确认先落地再扩张；或（4）具名战略伙伴锚定客户，在有意义收入规模上独立验证 AI
              智能体用例。估值立场：偏高。风险评级：高。最能快速改变建议的优先尽调问题包括：FY24–FY26 按层级拆分的 ARR 瀑布、按层级毛利率、NRR 队列数据、当前现金余额和烧钱速度、客户集中度分析。
            claimRefs:
