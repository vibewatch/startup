      - number: '1.4'
        title: 里程碑、合作伙伴与反向事件
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的公开里程碑密集且记录充分。公司于 2020 年末公开发布（距离 2019 年 1 月第一行代码约 22 个月），2022 年 12 月推出行业首个 BYOC 部署模式，2023 年 6
              月在披露收入增长 5x 的同时完成标志性 $100 million Series C，并在 2025 年 4 月 Series D 交割时达到 $1 billion 估值。2024 年 5 月收购 Benthos
              补齐端到端连接层；2025 年 10 月收购 Oxla 并推出 ADP，标志 Redpanda 战略转向企业 AI 治理。


              客户合作证明公司确实触达企业级市场。NYSE Group 采用 Redpanda 支撑 NYSE Cloud Streaming，每天处理超过 500 billion
              条消息，延迟达到亚数百毫秒。印度最大社交媒体平台 ShareChat 报告，切换到 Redpanda BYOC 后，云基础设施支出降低 70%。Jump Trading 和 Fortis Games 等企业客户在
              Series C 新闻稿中公开提及 Redpanda。截至 2025 年 4 月，企业信任信号还包括 Activision Blizzard、Cisco、Moody's、Texas
              Instruments、Vodafone，以及美国前五大银行中的两家。Redpanda 也被列为 NVIDIA Vera CPU 生态伙伴，并在 FY2027 Q1 加入 Akamai Qualified
              Compute Partner Program。


              反向信号主要集中在竞争动态，而非运营危机。2025 年 12 月，IBM 宣布以 $11 billion 收购 Confluent。Confluent 是 Redpanda 最主要的直接竞争对手，也是
              Apache Kafka 的维护者；这笔交易显著增强了 Redpanda 最大既有 对手背后的资源和企业分销。2025 年 6 月 GCP 全球故障期间，Redpanda Cloud
              保持稳定（公司博客对该事件有坦率复盘），但故障也暴露出部分服务层对大型云厂商基础设施的真实依赖。BSL 许可在商业上合理，但受到部分开源开发者社区质疑；这些开发者重视真正符合 OSI
              的许可证，因此相较完全开放的替代方案，Redpanda 在社区采用上存在一定摩擦。已审阅来源未发现公开诉讼、监管行动、重大裁员事件或领导层丑闻。
