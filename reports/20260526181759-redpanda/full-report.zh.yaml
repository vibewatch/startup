  - id: TP004
    title: 护城河耐久性与竞争风险清单
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - C++ 每核一线程架构相较 JVM Kafka 取得亚毫秒级尾延迟
        - Kafka 原生编译（GraalVM）或 JVM 持续优化会缩小延迟差距；KRaft 继续改进会降低 ZooKeeper 摩擦
        - 中
        - 核验 Redpanda 回归基准测试计划是否跟上 Kafka 4.x 改进；测试 Kafka 在 GraalVM 上 AOT 编译的时间表
      - - 单二进制的简洁性消除 ZooKeeper/JVM 运维负担
        - Kafka KRaft（移除 ZooKeeper）消除了一个关键历史痛点；AutoMQ/WarpStream/Aiven 的无盘架构让 S3 原生部署更简单，成本曲线相当或更优
        - 高
        - 评估客户赢单 / 输单数据——潜在客户主要因为 ZooKeeper 复杂性还是价格而触发切换？如果 ZooKeeper 论点正在失效，什么会取而代之？
      - - 完整 Kafka API 兼容性降低买方迁移到 Redpanda 的摩擦
        - 同样的兼容性也让客户同样容易流向任何 Kafka 兼容替代品；数据层没有专有锁定效应
        - 高
        - 判断 Redpanda Connect 管道配置和 ADP 工作负载能否形成足够的运维锁定效应，抵消 Kafka API 可迁移性风险
      - - IBM 收购 Confluent 带来整合不确定性和企业销售扰动
        - 交易交割后，IBM 可能借现有中间件与混合云客户基础，加速 Confluent 企业触达；IBM 分销能力 可能扩大 Confluent 的可触达市场
        - 中
        - 跟踪 IBM GTM 整合时间表；监测收购交割后 Confluent 流失与新增客户 logo（预计 2026 年中）
      - - BSL 开源许可证提供源码可见性，同时保护商业功能
        - 许可证从 SSPL 改为 BSL 后削弱了开源可信度；Apache 2.0 替代品（Kafka、AutoMQ、Pulsar） 在开源优先组织里具备采购和社区优势
        - 中
        - 在竞争性赢 / 输分析中，跟踪社区论坛活跃度、GitHub star 趋势，以及与 BSL 有关的采购异议
      - - 定价溢价把 Redpanda 定位为性能 / 简洁性专家，而非成本优化的 S3 原生替代品
        - 多条负面用户评论（Gartner，2026 年 4 月）称，其价格明显高于竞争对手；在能容忍延迟的细分场景， WarpStream/AutoMQ 带来的商品化压力可能压缩价格敏感账户的赢率
        - 高
