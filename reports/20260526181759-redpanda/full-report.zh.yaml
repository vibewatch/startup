      - number: '3.4'
        title: 切换成本、锁定效应与分销能力
        blocks:
          - type: paragraph
            body: >
              Kafka API 兼容性既是 Redpanda 的护城河，也是双刃剑。完整 Kafka 协议兼容意味着，从自托管 Kafka 迁移到 Redpanda 只需改端点
              URL，不需要修改客户端代码，获客摩擦被大幅降低。但同一个兼容性也让客户更容易流失：一旦客户站在 Kafka API 标准上，任何 Kafka
              兼容替代方案（Confluent、WarpStream、AutoMQ、MSK）都可相对轻松替换。Redpanda 生态的真正粘性必须来自 Redpanda Connect 数据管道配置（300+ 连接器、无状态
              YAML 配置）、运维工具集成、合规认证，以及绑定 Redpanda 自研 AI Gateway 和 MCP 服务器的 Agentic Data Plane 工作负载。

              Amazon MSK 通过深度 AWS 服务集成（IAM、Glue、CloudWatch、Lambda 触发器、MSK Connect 托管连接器）制造最强平台锁定；即使 Kafka
              线协议兼容，工作负载也很难迁移。Confluent Platform 的多组件架构包含 Confluent for Kubernetes operator、Control Center、Schema
              Registry 和托管 Flink 服务层；即便数据层可移植，管理工具仍会形成锁定。多归属（同时运行多个流式平台）对 Kafka
              兼容替代方案在技术上可行，但会带来显著运营开销；多数企业会选择一个主平台。内部自建（自托管 Kafka）仍是大型工程团队的持续竞争选项，尤其是在 KRaft 移除 ZooKeeper 依赖后，很多早期
              Redpanda 评估的触发因素被削弱。

              分销能力方面：Confluent 受益于十年的企业销售关系、全球伙伴生态，以及 IBM 收购完成后潜在接入 IBM 庞大企业销售队伍和现有中间件客户群。Amazon MSK 受益于 AWS
              主导性的云市场位置、联合销售项目，以及与其他 AWS 服务的同地协同。Redpanda 主要依靠技术社区互动、自助云试用和企业直销来竞争；它缺少 IBM/Confluent 或 AWS 的分销规模。
            claimRefs:
              - CP016
              - CP017
              - CP034
              - CP035
              - CP038
