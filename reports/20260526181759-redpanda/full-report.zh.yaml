            body: >-
              公司披露的增长数据很强，但没有经过独立审计。Redpanda 2024 年 2 月新闻稿称，FY24 收入同比增长 300%，客户数增长 179%，BYOC 部署量增加到三倍以上。2026 年 5 月 Q1
              FY2027 新闻稿称，新 ARR 同比增长 70% —— 这是公司史上新 ARR 最好季度，也是单季 7 位数交易最多的一次。2023 年 6 月 Series C 公告称，收入较上一年增长
              5X。唯一独立第三方 ARR 估计来自 Getlatka（2025 年 12 月），约为 $26.1 million，员工数 188 人，对应人均收入约 $139K —— 这与一家仍在重投销售和研发的早期增长型
              SaaS 公司相符。企业客户质量能看见：NYSE 用 Redpanda 支撑 NYSE Cloud Streaming，每天处理数千亿条消息，延迟低于
              100ms。Activision、Cisco、Moody's、Snowflake 以及美国前五大银行中的两家被列为用户。ShareChat 部署承载 400 million MAU，Lacework
              部署峰值吞吐达到 14.5 GB/s。这些企业级证明点说明 Redpanda 的 BYOC 层已经打进有分量的客户，但大客户收入集中度风险无法从公开数据判断。FY24 Slack 会员增长 56%、GitHub
