              10x 吞吐性能——这对延迟敏感行业是可防守的技术护城河。第三，2025 年 4 月推出的 Agentic Data Plane，是 AI 原生的流记忆和 token 预算管理层，为原本的 Kafka
              替代逻辑之外的 AI 智能体基础设施打开了变现面。GV（Google Ventures，自 Series A 起支持 Redpanda）领投的 $1B 估值 Series
              D，体现了内部投资人的高信念延续。Lightspeed Venture Partners 牵头 Series C 时称其具备“定义级产品-市场匹配”，并共同投资 Series
              D。最高企业层的客户密度可见：NYSE、Activision、Cisco、Moody's 和 Snowflake 都是已确认用户；NYSE 部署每天以低于 100ms
