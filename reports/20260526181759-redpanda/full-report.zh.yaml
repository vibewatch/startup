  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和客户工作流角色
        blocks:
          - type: paragraph
            body: >-
              Redpanda 是用 C++ 从零重写 Apache Kafka 消息协议，目标是给开发者和平台工程师一个更快、更易运维、开箱兼容 Kafka 的流式数据平台。Apache Kafka 需要
              ZooKeeper（或新版本中的 KRaft）做共识，并依赖 JVM；在高分位延迟下，JVM 会引入垃圾回收暂停。Redpanda 则以一个自包含二进制文件交付 —— broker、schema
              registry、HTTP proxy 和 Raft 共识全部内置。运维人员在开发者笔记本上从下载到跑起 3 节点集群不到一分钟，在生产 Kubernetes 集群中不到 90
              秒。这种运维简化瞄准三类客户工作流：实时事件流（金融 tick 数据、IoT、游戏遥测）、数据集成管道（从 Postgres 和 MySQL 到数据湖的 CDC、进入 Snowflake 的
              ETL），以及越来越重要的智能体 AI 基础设施（向 LLM 受控交付上下文、智能体审计轨迹、token 预算执行）。截至 2026 年 5 月，产品组合有三大系列：Redpanda Streaming（C++
              broker）、Redpanda Connect（数据连接套件，最初是 2024 年 5 月收购的开源 Benthos 项目），以及 Agentic Data Plane（ADP，2025 年 10 月发布，并在
              2026 年 2 月加入 AI Gateway 扩展）。官方文档把该平台称为「高性能流式数据平台和 Agentic Data Plane」，并称其「兼容 Kafka API」。Redpanda 面向当前运行
              Apache Kafka、但被运维开销、成本和延迟上限卡住的企业，也面向想要更快上手但不牺牲 Kafka 生态兼容性的开发团队。
