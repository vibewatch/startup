        - 99.99% SLA；120+ 连接器；托管 Flink；多区域
        - CKU 模型增加定价复杂度；Flink 附加组件需组件许可
      - - Amazon MSK Standard（m7g.large x3，标准层）
        - 每个 broker 约 $0.20/hr（+ $0.10/GB-month 存储 + 数据传输）
        - 按 broker 小时 + 存储 GB-month
        - 托管配置；AWS 服务集成
        - 99.9% SLA 不覆盖 Kafka 数据平面；Standard brokers 需手动再均衡；示例：3x m7g.large、1.5TB 约 $607/month
      - - Amazon MSK Serverless
        - $0.75/hr 基础费
        - 按集群小时 + 处理数据量
