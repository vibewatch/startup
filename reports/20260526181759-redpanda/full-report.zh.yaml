  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Redpanda 应被理解为事件流基础设施供应商，而不是广义上的流式分析软件公司。市场边界，是企业用来在生产者与消费者之间实时移动数据的持久、高吞吐消息代理和流式管道层。这个边界包括 Kafka
              兼容流式平台支出（自托管和托管云形态）、流式连接器与变更数据捕获管道，以及企业部署需要实时数据访问和治理的 AI 智能体之后，正在出现的相邻智能体数据基础设施。


              这个边界不包括纯流式分析处理引擎（Apache Flink、Spark Streaming）、实时 OLAP 数据库（ClickHouse、Apache Druid），也不包括缺乏 Kafka
              协议兼容性的通用消息队列（RabbitMQ、ActiveMQ）。即便 Fivetran 或 Airbyte 等批量 ETL 平台处理近实时管道，也应排除在外，因为它们的架构和买方都与基于持久日志的事件流根本不同。


              现状替代方案数量可观且根深蒂固。Apache Kafka 由 Apache Software Foundation 维护，全球数千家公司使用，在关键行业占据主导：全球前 10 大制造公司、前 10 大银行、10
              家电信公司中的 8 家，以及 10 家保险公司中的 7 家都依赖 Kafka。托管领域的既有厂商是 Confluent，IBM 正在收购它——这说明该品类已经进入战略基础设施成熟阶段。Amazon MSK
              提供深度集成 AWS 的全托管 Kafka 服务，对 AWS 原生买家来说是自然默认选择。WarpStream（现属 Confluent）推出基于对象存储的无盘架构，主打成本竞争。AutoMQ 和 Estuary
              代表正在出现的开源与 SaaS 替代方案，进一步填满替代品地图。Redpanda 必须根据买方场景，替换这些方案或与其正面对抗。
