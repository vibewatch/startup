  - id: FP003
    title: 护城河与竞争准备度 KPI
    type: kpi
    layout: compact
    summary: |
      总结 Redpanda 截至 2026 年 5 月的核心竞争优势、差异化与未解风险因素，依据供应商文档、独立评测和竞品对比来源整理。
    data:
      items:
        - label: 相对 Kafka 的性能领先
          value: 10x tail latency advantage (vendor benchmark; Redpanda C++ vs Kafka JVM at 500MB/s-1GB/s)
        - label: 架构简洁度
          value: Single binary — no JVM, no ZooKeeper, no sidecar services required
        - label: 相对 Confluent 的 TCO（供应商引用）
          value: Up to 60% TCO reduction for fan-in (McKnight study cited by Redpanda; not independently verified)
        - label: Kafka API 兼容性
          value: Full compatibility — zero client code changes required for migration from Kafka
        - label: 相对 Kafka Connect 的连接器覆盖度
          value: 300+ connectors (Redpanda Connect) vs ~200+ Kafka Connect; includes CDC and AI connectors
        - label: IBM / Confluent 收购风险
          value: >-
            Pending IBM close (mid-2026) may boost Confluent enterprise distribution; creates near-term uncertainty for
            Confluent customers
        - label: 定价风险（反向评价）
          value: 'Gartner review (Apr 2026): pricing ''out of range from other competitors by VERY large margins'''
        - label: S3 原生商品化
          value: WarpStream, AutoMQ, Aiven Diskless offer 66-80%+ cost savings for latency-tolerant workloads
    approximationNotes: >
      TCO 数据由 Redpanda 引用自 McKnight 基准测试，未独立验证。性能优势基于 2022 年基准测试及公司称已内部复验；未找到第三方复现。Gartner Peer Insights 的反向信号（截至 2026 年
