      - number: '2.3'
        title: 买方、用户、付费方与采用路径分层
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的买方地图有三类核心人群，预算归属、采用触发点和市场进入路径各不相同。最大的一类，是中大型企业里的平台和数据工程团队：他们运行自托管 Kafka 集群，或为 Confluent Cloud
              付费，并希望降低基础设施复杂度或成本。典型买方是工程 VP、平台工程负责人或数据基础设施架构师；预算来自基础设施或 DevOps。Kafka API 兼容性对这些买方有价值，因为它省掉应用层改造；Redpanda
              的 C++ 单二进制架构又降低 JVM 调优和 ZooKeeper 依赖开销。


              第二个增长中的细分，是部署 AI 与智能体工作负载的企业。当 AI 智能体需要实时访问受治理的企业数据时，智能体数据平面会成为新的预算项。Redpanda 的 Series D 公告明确把公司定位为智能体 AI
              基础设施；FY2027 Q1 报告也把 NVIDIA Vera CPU 生态伙伴关系视为 AI 驱动采用路径的信号。该细分的买方更可能是 CTO 或 AI 基础设施负责人，预算来自 AI/ML 或数字化转型。


              第三类，是对延迟敏感且吞吐要求高的行业垂直：金融服务（实时市场数据、欺诈检测、交易）、游戏和广告技术（游戏内事件、实时竞价）、网络安全（高容量遥测管道），以及制造和供应链（IoT 传感器数据）。NYSE 使用
              Redpanda 支撑 NYSE Cloud Streaming，并称它是唯一能以成本效率处理 NYSE 规模的 Kafka 兼容平台。Jump
              Trading、Chess.com、Teads、Lacework、Truecaller 和 Johnson Controls 等客户横跨多个垂直，反映 Redpanda
              在金融、游戏、广告技术、电信、网络安全和制造领域已有广泛跨行业采用。


              Redpanda 通过三条市场进入路径触达买方：自助社区版（开发者主导采用）、Redpanda Cloud 托管服务（Serverless 和 BYOC），以及企业直销。BYOC
              模式对受监管买方尤其重要；他们需要数据主权和成本透明度，而全托管多租户服务无法完全提供。
