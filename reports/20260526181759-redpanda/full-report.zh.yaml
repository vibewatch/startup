      - number: '8.4'
        title: 情景分析：乐观、基准和悲观退出路径
        blocks:
          - type: paragraph
            body: >-
              三个情景框定回报分布。乐观情景（35% 概率）下，Redpanda 执行 Agentic Data Plane 战略，到 2028 年以 55–65% CAGR 达到 $100M ARR，在新垂直行业拿下
              Fortune 500 锚定客户，并在战略出售给云厂商或企业软件厂商前完成 Series E，退出估值 $3–5B——相当于 Series D 价格的 3–5x 回报。基准情景（45% 概率）下，公司继续以
              40–50% CAGR 增长，2028 年 ARR 达到 $70–80M，并按 10–14x ARR 以 $700M–$1.1B 被收购——回报为 0.7–1.1x，接近当前价格的盈亏平衡。悲观情景（20%
              概率）下，超大规模云厂商商品化、BSL 许可逆风或企业管线放缓，使增长降至 30% CAGR 以下；ARR 停在 $35–50M，公司先以平轮或下轮重组资本，再以低于 $700M
              的困境价格退出。所有情景都对两个未知数敏感：毛利率结构（决定公司在多大 ARR 规模上能吸引更广泛的收购方）和 NRR（决定现有账户的先落地再扩张能否抵消新客户获取成本）。二者均未公开披露。
