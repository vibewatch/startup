      - number: '2.2'
        title: TAM、SAM 与受证据约束的测算口径
        blocks:
          - type: paragraph
            body: >-
              对 Redpanda 可触达市场最干净的公开规模口径，是 Grand View Research 给出的流式分析市场：2023 年 $23.4B，预计到 2030 年达 $128.4B，CAGR 为
              28.3%。这是最宽、也最站得住的口径，包含 Redpanda 所处消息代理层之外的分析处理与工具。更窄的基础设施层——基于持久日志的事件流平台——没有单独公开测算，但可由公开代理指标推演。


              Confluent 是主导性的商业 Kafka 平台，也是付费托管流式市场中最大、可公开追踪的收入信号。IBM 于 2025 年宣布收购意向前，Confluent 作为上市公司在 2024
              年仍保持增长，凸显该品类的战略价值和商业规模。Amazon MSK 作为超大规模云厂商默认选项，把另一池未单独统计的基础设施支出嵌入 AWS 账单，因此不会出现在分析师的流式市场估算里。WarpStream 于
              2024 年 9 月被 Confluent 收购，其对象存储成本模型说明，成本结构是托管平台细分市场的主要竞争驱动。


              Redpanda 自身运营证据与一家仍处早期收入位置、但在增长市场中执行的公司相符。GetLatka 报告，2025 年底 Redpanda ARR 为 $26.1M，估值
              $1B，隐含收入倍数符合高增长基础设施公司的特征。公司披露 FY2024 收入增长 300%，FY2027 Q1 ARR 同比增长
              70%。这条轨迹更像一个平台在从传统部署中抢份额，而不是成熟细分市场中的常规增长；但公开证据无法把 Redpanda 的 SAM 或 SOM
              从可触达基础设施池中单独剥离。因此，测算表和区间图保留多种口径与证据约束，而不是强行压成一个数字。
