        title: 附录
        blocks:
          - type: callout
            title: 控制平面 SLA 缺口已有记录且尚未解决
            body: >-
              Redpanda 官方状态页显示，2026 年 2–5 月窗口内 Cloud Control Plane 正常运行时间为 99.66%，低于合同约定的 99.99%
              SLA。公司未公开解释这一缺口。高可用要求高的企业买方，在签署多年合同前，应核实根因、修复时间表，以及是否向受影响客户发放了服务抵免。
            calloutType: risk
            claimRefs:
              - CR018
              - CR019
          - type: callout
            title: EU AI Act 下的 ADP 监管暴露需要立即出具法律意见
            body: >-
              Redpanda 的 Agentic Data Plane 是企业 AI 智能体的基础设施。它是否构成 Regulation 2024/1689 下的通用 AI 模型并不明确。如果欧盟企业客户通过 ADP
              在金融建议、人力资源或医疗场景部署受监管 AI 智能体，合规义务可能向上游传导。Redpanda 在欧洲市场规模化 ADP 之前，必须取得正式的 EU AI Act 分类意见。
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
          - type: callout
            title: BSL 许可证没有法庭检验——护城河仍停留在理论层面
            body: >-
              Business Source License 支撑着 Redpanda 对抗超大规模云厂商的整个竞争护城河。面对资金充足、提供竞争性 Kafka 兼容服务的被告，BSL
              从未经过法庭检验。CockroachDB、MariaDB 和 Redpanda 自身采用 BSL 的做法，已经建立了社区先例，但其面对 AWS 或 GCP 的法律可执行性仍未被证明。任何对 Redpanda
              竞争定位建模的投资人，都应把 BSL 护城河视为概率性，而非确定性。
            calloutType: risk
            claimRefs:
              - CR010
