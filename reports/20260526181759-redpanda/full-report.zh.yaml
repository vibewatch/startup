      - number: '7.5'
        title: 人员、执行和战略风险
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Alexander Gallego 的关键人集中，是结构上最深的执行风险。所有融资公告、新闻稿、投资人材料和 LSVP Series C 博客中，Gallego
              都是唯一得到交叉佐证的具名创始人。GV 管理合伙人 Dave Munichiello 从 Series A 起每一轮都亲自支持 Gallego，强化了创始人与投资人的一致性，也把关系资本集中在公司最高层。Q1
              FY2027 三名高管任命（CFO、CMO、产品副总裁）降低但没有消除关键人风险；公开材料也没有披露继任计划或独立董事会构成。


              2025 年 10 月转向 Agentic Data Plane，是一条与 Redpanda 核心能力正交的新执行风险。ADP 产品组合——AI Gateway、AI 可观测性、MCP
              连接、智能体管理、统一认证——把 Redpanda 已验证的数据流能力，与一个新类别（AI
              智能体治理）打包在一起；这个类别没有成熟先例，没有占优的既有玩家，企业也未必愿意向一家流基础设施厂商采购。Redpanda 同时在与可观测性厂商（Datadog、Dynatrace）、IAM
              平台（Okta、Azure AD）和专门做 AI 治理的创业公司竞争，而它的流处理专长在这些维度上的区分度有限。


              ADP、Connect（300+ 个连接器）、Oxla SQL 层和流产品线同时快速扩张，带来工程带宽风险。要支撑正在维护和开发的产品范围，约 188 名员工（2025 年 12
              月）的规模偏小。反向评论提到大规模横向部署的集群复杂度、文档中 AI 聊天机器人的质量缺口，以及运营成熟度落后于营销宣称的领域。Q1 FY2027 新开 San Francisco 和 Austin
              办公室对烧钱速度的影响没有量化。公司能否用一支约 188 人团队同时推进 ADP 市场开发、云可靠性改进和连接器生态扩张，是最核心的执行风险，也解释了为什么这块需要最高强度尽调。
