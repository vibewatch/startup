  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价：云层级、软件授权与连接器变现
        blocks:
          - type: paragraph
            body: >-
              Redpanda 有四条商业收入线：Serverless 云集群，按量付费（pay-as-you-go）的吞吐与存储模型计费；BYOC（Bring Your Own Cloud）集群，部署在客户 VPC
              内并按年度承诺定价；Dedicated 托管集群，采用年度合同；以及面向自托管部署的 Enterprise Edition 软件许可。Serverless
              是摩擦最低的入口：没有基础费用，提供免费层，最大写入吞吐为 100 MB/s，SLA 为 99.9%。BYOC 是旗舰企业产品，可提供最高 2 GB/s 写入和 4 GB/s 读取吞吐，SLA 为
              99.99%；其价格未公开列示，需要直接销售接洽。BYOC 架构具备结构性差异：Redpanda 消息代理部署在客户自有云账号内，客户可避开多租户 SaaS 流式平台常见的跨云出口流量成本。ShareChat
              案例报告云基础设施支出降低 70%，验证了这套直接降本卖点。Redpanda Connect（300+ 预构建连接器）把可变现表面延伸到数据管道层；Agentic Data Plane 配合 AI Gateway
              为企业智能体工作负载增加 token 预算控制，形成潜在的按智能体增购。Redpanda Cloud 官方文档确认，BYOC 层级支持 AWS、GCP 和 Azure。
