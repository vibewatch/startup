      - number: '6.3'
        title: 具名企业部署：生产证据、结果和背书质量
        blocks:
          - type: paragraph
            body: >-
              Redpanda 最强的公开客户证据包括多个带量化结果的生产部署。NYSE 用 Redpanda 支撑 NYSE Cloud Streaming，每天处理数千亿条消息，延迟低于 100ms ——
              这是支撑全球最大金融市场运营商之一的生产系统，于 2025 年 8 月宣布。印度最大社交媒体平台 ShareChat（约 400 million MAU）部署 Redpanda
              BYOC，并公开称云基础设施支出降低 70%，每年节省数百万美元；ShareChat 还在主动扩展更多用例。Lacework 的云安全数据管道自 2021 年 12 月起在生产中运行 Redpanda，在 CPU
              占用增长超过 1,200% 后仍承载峰值 14.5 GB/sec；这一点同时出现在 Redpanda 官方博客和独立 NewStack 案例研究中。Akamai Technologies 用 Redpanda
              承载云安全工作负载，并报告成本比 Confluent Cloud 低 55%。Chess.com 部署 Redpanda BYOC，并称成本可预测、没有意外超额费用。Truecaller（450 million
              用户）提到维护开销近乎为零，并给出「Redpanda 就是能跑」这句话。Jump Trading 每天为下一代金融消息平台处理数十亿条消息。Johnson Controls 称其 Azure 智能楼宇 IoT
              工作负载节省 50–80% 成本。FeaturedCustomers 基于 1,065 个背书评分独立验证了 26 条客户证言和 19 个案例研究，并授予 2026 年春季 Top Performer
              徽章。PeerSpot 评论一贯给 Redpanda 稳定性 8–10/10 评分。证据缺口：没有 NRR/GRR、没有客户数、没有成本节省主张的独立审计，也没有公开可得的续约率数据。
