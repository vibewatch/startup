      - number: '5.3'
        title: 核心架构和运营模型
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的性能优势来自用 C++ 实现的 thread-per-core 架构，底层使用 Seastar 框架和 io_uring 做内核 I/O。每个逻辑 CPU 核独占一个专用
              shard，并拥有自己的内存和 I/O 队列；没有共享状态锁，也没有 JVM 垃圾回收暂停，因此在高分位延迟上能保持一致性，这正是 Redpanda 区别于基于 Java 的 Kafka 的关键。Raft
              共识协议取代 ZooKeeper 承担分布式协调：每一次 partition leader 选举、topic 元数据变更和配置更新都通过 Raft 完成，不依赖外部组件。数据持久性主要依靠本地 NVMe
              SSD，并跨可用区复制（云部署中最小复制因子为三）。Redpanda 的 R1 引擎引入统一存储模型，使 Cloud Topics 和 Tiered Storage topics 可以共存于单一集群。Cloud
              Topics（v26.1 GA，Q1 2026）在将传入记录短时间窗口（例如 250 ms）或大小（例如 4 MB）内先批量缓存在内存后，直接写入对象存储（AWS S3、GCP GCS），本地磁盘只保留轻量
              Raft 元数据。这一设计绕开了通过 Raft 复制完整载荷时产生的跨可用区网络成本，代价是低批次数工作负载写入延迟更高。Tiered Storage 已在生产中验证数年，会把冷 segments
              卸载到对象存储，同时把热数据留在 NVMe。云部署方面，Redpanda 使用基于 cell 的架构：每个 cell 共置服务一个集群所需的全部服务（broker、management API、ACL
              store），因此一个 cell 故障不会级联到其他客户集群。这一架构使 Redpanda Cloud GCP 集群在 2025 年 6 月全球 GCP 故障期间保持稳定。Redpanda Connect
              作为可独立部署的 Go 二进制文件运行，也可以与 Redpanda Streaming 并行或嵌入其中：管道用单个 YAML 文件描述，通过进程内事务保证至少一次交付，观察到的最大部署实例曾推送 50 Gbps
              吞吐。
