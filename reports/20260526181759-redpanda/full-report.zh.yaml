chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Redpanda Data Inc. —— 对外品牌为「Redpanda」—— 是一家实时流式数据平台公司，总部位于加州旧金山。公司成立于 2019 年 1 月：Alexander Gallego
              在迈阿密写下第一行代码，之后迁往旧金山；早期名为 Vectorized，随后更名为 Redpanda Data，最终使用 Redpanda 品牌。2025 年 4 月 Series D 的
              BusinessWire 公告确认，法律实体为 Redpanda Data Inc.。


              Redpanda 的核心产品是用 C++ 编写、兼容 Kafka API 的事件流平台。公司刻意偏离基于 Java 的 Apache Kafka 架构，认为 Kafka 诞生于机械硬盘和单核 CPU
              时代。Redpanda 面向现代多核硬件，并移除 ZooKeeper 依赖，因此声称可在更低基础设施成本下提供最高 10x 性能提升。平台以 Business Source
              License（BSL）提供源码可用授权，开发者可广泛使用，但云厂商若要未经商业协议把它包装成托管服务则被限制——这也是抵御超大规模云厂商商品化的有意护城河。


              创立以来，产品组合已经明显扩张：Redpanda Streaming 是核心消息代理；Redpanda Cloud 提供全托管、Dedicated 托管和
              Bring-Your-Own-Cloud（BYOC）部署选项；Redpanda Connect（2024 年 5 月收购伦敦 Benthos 后获得）补上 300+ 数据连接器和 CDC 管道；2025 年 10
              月推出的 Agentic Data Plane（ADP）为企业 AI 智能体部署提供治理、可观测性、MCP 感知连接和 SQL 查询能力，并由 2025 年 10 月收购的分布式 SQL 引擎 Oxla
              补齐。商业模式是 B2B SaaS，收入来自云订阅、自托管企业授权和跨部署形态的托管服务。
