            body: >-
              Redpanda 于 2025 年 4 月完成 $100 million Series D，由 GV（Google Ventures）领投，Lightspeed Venture Partners 参投，估值 $1
              billion。公司五轮累计融资约 $265 million：$3 million 种子轮（2020 年）、$12.5 million Series A（2021 年 1 月）、$50 million
