  - id: FV001
    type: flow
    title: 投资决策框架
    layout: standard
    summary: 基于关键定性和定量门槛，在当前 $1B Series D 估值下评估 Redpanda 投资的决策流程图。
    data:
      nodes:
        - id: n1
          label: 流式分析市场是否在 AI 顺风下保持 >20% CAGR 增长？
          detail: 多家分析机构共识：28–32% CAGR；AI 工作负载提供额外扩张面
        - id: n2
          label: 相比托管 Kafka 和超大云厂商替代方案，Redpanda 是否有可防守的技术护城河？
          detail: C++ 原生、单二进制、兼容 Kafka API、BYOC 架构；基准吞吐量 10x
        - id: n3
          label: 当前估值是否低于 20x 远期 ARR，或毛利率 / NRR 是否已披露且表现有利？
          detail: 当前：约 23–38x ARR；毛利率、NRR 未披露；M&A 对标为 10.8x 收入
        - id: n4
          label: 回避——市场或技术差异化不足
          detail: 退出该投资判断；品类顺风不足以支撑当前估值
        - id: n5
          label: 跟踪——投资判断成立但估值偏紧；等待单位经济披露
          detail: 当前结论；上调触发条件为 ARR >$60M、毛利率披露、NRR >120%
        - id: n6
          label: 投资——估值支撑风险调整后回报；进入完整尽调
          detail: 目前未满足；需要倍数压缩或单位经济披露
      edges:
        - from: n1
          to: n2
          label: 是
        - from: n1
          to: n4
          label: 否
        - from: n2
          to: n3
          label: 是
        - from: n2
          to: n5
          label: 护城河不清晰
        - from: n3
          to: n6
          label: 是——估值可支撑
        - from: n3
          to: n5
          label: 否——倍数偏高
    claimRefs:
      - CV005
      - CV009
      - CV020
  - id: FV002
    type: bar
    title: 隐含估值倍数对比
    layout: standard
    summary: Redpanda Series D 的隐含 ARR 倍数，与 IBM-Confluent 收入倍数及典型后期数据基础设施 M&A 基准对比。
    data:
      items:
        - label: Redpanda 过往 ARR 倍数（2025 年 12 月估算）
          value: 38
          detail: $1B / $26.1M GetLatka ARR 估算；公司未确认
          tone: warning
        - label: Redpanda 远期 ARR 倍数（估算）
          value: 24
          detail: $1B / 约 $42M 估算 ARR，基于 2025 年 12 月起 70% 增长
          tone: warning
        - label: IBM-Confluent 收入倍数（FY2024）
          value: 11
          detail: $10.4B 交易 / $963.6M FY2024 收入；行业 M&A 基准
          tone: neutral
        - label: 典型后期 SaaS 基础设施 M&A（2024–2025）
          value: 10
          detail: 2022 年后修正期以来，软件基础设施 M&A 的行业收入倍数中位数
          tone: neutral
    approximationNotes: Redpanda ARR 数字来自第三方估算（GetLatka）。IBM-Confluent 倍数使用 SEC FY2024 10-K 收入。行业中位数为分析师估算。所有数字均为近似值；不要视为精确目标。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV008
      - CV009
  - id: FV003
    type: range
    title: 退出场景估值区间（2028）
    layout: wide
    summary: 基于 ARR 增长场景和可比 M&A 倍数，对 Redpanda 到 2028 年的牛市、基准、熊市退出估值作出估算。所有数字均为分析师估算。
    data:
      items:
        - label: 牛市退出估值（$3B–$5B）
          low: 3000
          high: 5000
          displayValue: $3B–$5B
          detail: 55–65% CAGR 推至约 $100M ARR；以 30–50x ARR 战略出售给云厂商 / 企业买方
          tone: positive
        - label: 基准退出估值（$700M–$1.1B）
          low: 700
          high: 1100
          displayValue: $700M–$1.1B
          detail: 40–50% CAGR 推至 $70–80M ARR；按 10–14x ARR M&A；接近 Series D 价格盈亏平衡
          tone: neutral
        - label: 熊市退出估值（<$700M）
          low: 200
          high: 700
          displayValue: $200M–$700M
          detail: <30% CAGR；下轮降价或困境 M&A；Series D 价格亏损
          tone: warning
        - label: Series D 入场价格
          low: 1000
          high: 1000
          displayValue: $1B (Series D price)
          detail: 回报计算参考点；2025 年 4 月 Series D 估值
          tone: neutral
    approximationNotes: 所有数字均为分析师估算，来自增长场景假设和可比 M&A 倍数。Redpanda 未披露官方财务计划、ARR 预测或退出指引。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
  - id: FV004
    type: kpi
    title: 关键投资指标——Redpanda 估值快照
    layout: standard
    summary: 截至 2026 年 5 月，公开来源可获得的、与决策最相关的财务和估值指标摘要。
    data:
      items:
        - label: Series D 估值
          value: $1B
          detail: 2025 年 4 月，GV 领投，募资 $100M；由 Redpanda 新闻稿和 BusinessWire 确认
          tone: neutral
        - label: 累计融资额
          value: $265–266M
          detail: 横跨五轮（种子轮至 Series D）；由多个来源确认
          tone: neutral
        - label: ARR（2025 年 12 月估算）
          value: $26.1M
          detail: GetLatka 第三方估算；公司未确认；仅作方向性参考
          tone: neutral
        - label: 新增 ARR 增长（FY2027 Q1）
          value: 70% YoY
          detail: 公司在 2026 年 5 月新闻稿中披露；公司史上最佳季度
          tone: positive
        - label: 过往 ARR 倍数
          value: ~38x
          detail: $1B / $26.1M（GetLatka）；按 70% 增长测算，远期约 23–25x
          tone: warning
        - label: 行业 M&A 对标（Confluent）
          value: ~10.8x revenue
          detail: IBM 交易为 $10.4B / $963.6M FY2024 收入；最近的行业 M&A 基准
          tone: neutral
        - label: 市场 CAGR（流式分析）
          value: 28–32%
          detail: Mordor（32.4%）、GrandView（28.3%）、Fortune BI——多家分析机构共识
          tone: positive
        - label: 估算跑道（自 2025 年 4 月起）
          value: 17–33 months
          detail: $100M Series D，估计每月烧钱 $3–6M；意味着 2026 年底至 2027 年中需要决定 Series E
          tone: neutral
        - label: 毛利率
          value: Not disclosed
          detail: 无公开披露；基于可比公司估计为 60–75%；BYOC 可能处于高端
          tone: warning
        - label: NRR
          value: Not disclosed
          detail: 无公开披露；承销中的关键缺失变量
          tone: warning
    approximationNotes: ARR、跑道、毛利率估算来自第三方或分析师推导。只有 Series D 估值、累计募资额和新增 ARR 增长率由公司确认。毛利率和 NRR 未披露。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV020
      - CV033
