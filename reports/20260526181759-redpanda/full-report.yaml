  - id: FE001
    title: Redpanda product architecture stack
    type: stack
    layout: standard
    summary: >-
      Five-layer architecture from infrastructure through the Agentic Data Plane, showing how Redpanda Streaming,
      Connect, and ADP stack on top of a cloud-agnostic deployment foundation.
    data:
      layers:
        - label: Infrastructure & Deployment
          modules:
            - AWS, GCP, Azure (Dedicated / BYOC / Serverless)
            - Kubernetes, Linux on-prem, air-gapped
            - ARM (Graviton) and x86 hardware
        - label: Redpanda Streaming Engine (C++)
          modules:
            - Seastar thread-per-core / io_uring
            - Raft consensus (no ZooKeeper)
            - NVMe-first topics (disk replication)
            - Tiered Storage (cold offload to S3/GCS)
            - Cloud Topics / R1 engine (direct S3/GCS writes, GA v26.1)
        - label: Kafka Compatibility API
          modules:
            - Kafka wire protocol (producers, consumers, admin)
            - Embedded Schema Registry
            - Embedded HTTP Proxy
            - Transactions and consumer groups
        - label: Redpanda Connect (Go)
          modules:
            - 300+ pre-built connectors (sources, sinks, processors)
            - 'CDC: Postgres, MySQL, MongoDB, Oracle, MSSQL'
            - Bloblang declarative transformation language
            - AI processors (OpenAI, Bedrock, Cohere, Ollama, Vertex AI)
        - label: Agentic Data Plane (ADP)
          modules:
            - AI Gateway (routing, token budgets, policy enforcement)
            - 'Unified identity: OAuth2 / OIDC / MCP / A2A protocols'
            - OpenTelemetry observability (AI actions, agent traces)
            - Oxla SQL engine (query data in motion and at rest)
    approximationNotes: >-
      Layer boundaries are logical product groupings derived from official documentation; actual binary/service
      composition may differ in detail. ADP layer reflects capabilities announced through February 2026.
    claimRefs:
      - CE002
      - CE003
      - CE015
      - CE018
      - CE021
      - CE022
