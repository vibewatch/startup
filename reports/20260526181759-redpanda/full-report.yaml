  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow role
        blocks:
          - type: paragraph
            body: >-
              Redpanda is a from-scratch C++ rewrite of the Apache Kafka messaging protocol, built to give developers
              and platform engineers a streaming data platform that is faster, simpler to operate, and Kafka-compatible
              out of the box. Where Apache Kafka requires ZooKeeper (or KRaft in newer versions) for consensus and
              relies on a JVM that introduces garbage collection pauses at high percentiles, Redpanda ships as a single
              self-contained binary — brokers, schema registry, HTTP proxy, and Raft consensus all included. Operators
              go from download to a running 3-node cluster in under a minute on a developer laptop, and to a production
              Kubernetes cluster in under 90 seconds. This operational simplicity targets three customer workflow
              categories: real-time event streaming (financial tick data, IoT, gaming telemetry), data integration
              pipelines (CDC from Postgres and MySQL into data lakes, ETL into Snowflake), and increasingly agentic AI
              infrastructure (governed context delivery to LLMs, agent audit trails, token budget enforcement). As of
              May 2026 the portfolio has three major product families: Redpanda Streaming (the C++ broker), Redpanda
              Connect (the data connectivity suite, originally the open-source Benthos project acquired in May 2024),
              and the Agentic Data Plane (ADP, launched October 2025 and expanded with AI Gateway in February 2026). The
              official documentation characterizes the platform as "a high-performance streaming data platform and
              Agentic Data Plane" that is "Kafka API-compatible." Redpanda targets enterprises that currently run Apache
              Kafka but find the operational overhead, cost, and latency ceiling to be blockers, as well as developer
              teams looking for a faster on-ramp that does not sacrifice Kafka ecosystem compatibility.
            claimRefs:
              - CE001
