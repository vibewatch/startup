      - number: '5.5'
        title: Technical differentiation and IP
        blocks:
          - type: paragraph
            body: >-
              Redpanda's primary technical differentiator is its C++ thread-per-core architecture, which eliminates the
              JVM garbage collector as a source of tail-latency jitter. In Redpanda's own published benchmarks, the
              platform delivers at least 10x lower P99 tail latencies than Apache Kafka and requires up to 3x fewer
              nodes for equivalent throughput. At higher throughput levels, Redpanda remains 2–3x faster. ARM-hardware
              compatibility is a secondary differentiator: Redpanda runs without degradation on AWS Graviton instances,
              whereas Kafka's JVM has documented performance problems on ARM. Deploying Redpanda on Graviton
              is4gen.medium instances in place of comparable x86 instances yields approximately 57% cost savings per
              byte, a concrete TCO lever for customers in AWS environments. The company's regression-testing
              infrastructure checks performance to microsecond accuracy across every release cycle, preventing the
              gradual latency regression common in large codebases. A third-party technical comparison (AutoMQ, April
              2026) categorizes Redpanda as a "shared-nothing, disk-based" platform that excels at latency but carries
              higher operational and cost burden relative to shared-storage (S3-native) platforms; this framing is
              consistent with the trade-offs Redpanda acknowledges by introducing Cloud Topics as a hybrid option. The
              Agentic Data Plane represents a product-layer differentiation: by integrating AI Gateway, MCP/A2A protocol
              support, OpenTelemetry observability, and the Oxla SQL engine into a unified governance surface, Redpanda
              is positioning itself as infrastructure for AI-agent context delivery and auditability — a capability set
              no pure-streaming competitor currently offers in a single product.
