            title: ADP Regulatory Exposure Under EU AI Act Requires Immediate Legal Opinion
            body: >-
              Redpanda's Agentic Data Plane is infrastructure for enterprise AI agents. Whether this constitutes a
              general-purpose AI model under Regulation 2024/1689 is ambiguous. If EU enterprise customers deploy
              regulated AI agents via ADP in financial advice, HR, or healthcare contexts, compliance obligations could
