            title: ADP pivot redefines TAM but adds execution risk
            body: >-
              Redpanda's October 2025 launch of the Agentic Data Plane — layering MCP-aware connectivity, AI
              observability, and SQL query (via Oxla) on top of its streaming core — repositions the company from a
              Kafka-replacement to an AI infrastructure company. This substantially expands the addressable market but
              introduces new competitive dynamics (against observability, API gateway, and enterprise AI middleware
              vendors) and execution risk, since no revenue contribution from ADP has been publicly disclosed.
