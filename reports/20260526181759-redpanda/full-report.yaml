      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kafka API compatibility + C++ performance moat
            body: >-
              Writing a Kafka-compatible platform in C++ from scratch — eliminating ZooKeeper and JVM dependencies —
              creates a durable performance and cost-efficiency advantage that cannot be easily replicated by
              Confluent's Java-based Kafka fork. Redpanda's 10x performance claim and NYSE-validated 4–5x improvement
              over traditional Kafka competitors indicate genuine technical differentiation that resonates with
              latency-sensitive enterprise buyers.
            calloutType: strength
            claimRefs:
