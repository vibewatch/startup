        - Redpanda Streaming single binary
        - ≥10× lower P99 tail latency (company benchmark); up to 3× fewer nodes (company benchmark)
        - Self-managed operational knowledge required; enterprise features licensed
      - - Database change-data-capture pipelines
        - Kafka + Kafka Connect + Debezium plugins
        - Redpanda Connect CDC connectors (Postgres, MySQL, MongoDB, Oracle, MSSQL)
        - Declarative YAML config; single binary deployment; at-least-once guarantees
