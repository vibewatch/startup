            body: >-
              The Business Source License underpins Redpanda's entire competitive moat against hyperscalers. The BSL has
              never been tested in court against a well-funded defendant offering a competing Kafka-compatible service.
              CockroachDB, MariaDB, and Redpanda's own adoption of BSL have established community precedent, but legal
              enforceability against AWS or GCP remains unproven. Any investor modelling Redpanda's competitive
              positioning should treat the BSL moat as probalistic rather than certain.
