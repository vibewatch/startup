      - number: '8.6'
        title: Recommendation, confidence level, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Track. Do not invest at the current $1B valuation without material unit-economics
              disclosure. The technology and market thesis are credible, the investor syndicate is top-tier, and the AI
              tailwind is real. However, the implied ARR multiple of approximately 38x trailing (or 23–25x forward
              estimate) is stretched relative to the only public sector M&A comp (Confluent at 10.8x), and the
              investment case cannot be underwritten without gross margin, NRR, and ARR waterfall data. Confidence: low.
              Upgrade conditions: (1) disclosed ARR exceeding $60M with independent corroboration; (2) gross margin
              disclosure showing BYOC at 65%+ and overall blended at 55%+; (3) NRR above 120% confirming
              land-and-expand; or (4) a named strategic partner anchor that independently validates the AI agent use
              case at meaningful revenue scale. Valuation stance: stretched. Risk rating: high. Priority diligence asks
              that would most rapidly change the recommendation are: ARR waterfall by tier for FY24–FY26, gross margin
              by tier, NRR cohort data, current cash position and burn rate, and customer concentration analysis.
            claimRefs:
