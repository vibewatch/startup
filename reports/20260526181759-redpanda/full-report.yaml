      - number: '5.3'
        title: Core architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Redpanda's performance advantage derives from a thread-per-core architecture implemented in C++ using the
              Seastar framework and io_uring for kernel I/O. Each logical CPU core owns a dedicated shard with its own
              memory and I/O queue; no shared-state locks and no JVM garbage collector pauses produce the latency
              consistency that distinguishes Redpanda from Java-based Kafka at high percentiles. The Raft consensus
              protocol replaces ZooKeeper for distributed coordination: every partition leader election, topic metadata
              change, and configuration update flows through Raft without any external dependency. Data durability
              relies primarily on local NVMe SSDs with replication across availability zones (minimum replication factor
              of three in cloud deployments). Redpanda's R1 engine introduced a unified storage model that allows Cloud
              Topics and Tiered Storage topics to coexist in a single cluster. Cloud Topics (GA in v26.1, Q1 2026)
              writes data directly to object storage (AWS S3, GCP GCS) by batching incoming records in memory for a
              short time window (e.g., 250 ms) or size (e.g., 4 MB) before flushing, keeping only lightweight Raft
              metadata on local disk. This design bypasses the cross-AZ networking cost incurred when replicating full
              payloads via Raft, at the cost of higher write latency for low-batch-count workloads. Tiered Storage,
              production-proven for several years, offloads cold segments to object storage while keeping hot data on
              NVMe. For cloud deployments, Redpanda uses a cell-based architecture: each cell co-locates all services
              (brokers, management API, ACL store) needed to serve a cluster, so a failure in one cell does not cascade
              across other customers' clusters. This architecture allowed Redpanda Cloud GCP clusters to remain stable
              during the June 2025 global GCP outage. Redpanda Connect operates as an independently deployable Go binary
              alongside or embedded within Redpanda Streaming: pipelines are described in a single YAML file,
              at-least-once delivery is guaranteed through in-process transactions, and the largest deployed instance
              was observed pushing 50 Gbps of throughput.
