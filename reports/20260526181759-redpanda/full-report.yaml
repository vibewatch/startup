              The official Redpanda status page reports Cloud Control Plane uptime of 99.66% for the Feb–May 2026 window
              against a contractual 99.99% SLA. This gap is not explained publicly. Enterprise buyers with high
              availability requirements should verify the root cause, remediation timeline, and whether service credits
