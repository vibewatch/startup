      - - AI agent context delivery and governance
        - Custom REST APIs + vector DBs, no audit trail
        - 'Redpanda ADP: AI Gateway + MCP/A2A + OpenTelemetry + Oxla SQL'
        - Governed agent access, token budgets, full action audit trail
        - ADP is early GA (Oct 2025); limited public customer proof available
      - - Cost-optimized streaming (object-storage persistence)
        - Kafka clusters with EBS-backed broker storage
        - Cloud Topics R1 engine — direct S3/GCS writes
        - Eliminates cross-AZ Raft replication cost for cold data
        - Write-path batch window (250 ms / 4 MB) adds latency vs. disk-first topics
      - - Multi-cloud / air-gapped deployments
        - Complex self-managed Kafka with manual ZooKeeper ops
