      - number: '7.3'
        title: Operational, Technical, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Cloud infrastructure reliability is the most directly observable risk dimension. Redpanda Cloud's official
              status page, covering February through May 2026, reports Cloud Control Plane uptime of 99.66% — below the
              99.99% SLA commitment for multi-zone dedicated clusters. The Redpanda Cloud SLA (updated March 17, 2025)
              provides service credits of 10% of the Monthly Fee for multi-zone clusters falling below 99.99% and 100%
              credits for any cluster below 95%. The SLA's measurement methodology — black box probing every 5 seconds —
              excludes downtime caused by scheduled maintenance, force majeure, or customer-caused failures, which
              narrows the credit trigger. Cloud Accounts uptime was 99.96% and Serverless was 100% over the same window,
              indicating that the Control Plane weakness is the primary operational gap.


              Third-party monitoring by IsDown documented 20 Redpanda incidents since March 2025, with 17 in the last 12
              months. Significant incidents include: a major DNS issue affecting Cloud API access for 6.1 hours on April
              27, 2026; an 8-day Remote MCP unavailability for new GCP clusters (January 29 – February 6, 2026); a
              13-hour inability to create new AWS clusters (December 2025); and a 54-minute login failure on April 14,
              2026. In each case, Redpanda's communication emphasised that customer cluster data remained operational —
              a credible distinction between control-plane management and data-plane durability, but enterprise
              customers with automation-dependent workflows will consider management-plane unavailability a P1 event
              regardless.


              Redpanda Cloud's cell-based architecture, demonstrated during the June 12, 2025 global GCP outage, showed
              genuine resilience: Redpanda Cloud GCP clusters remained stable while much of GCP was disrupted. This is a
              meaningful risk mitigation, but Redpanda Cloud is available only on AWS and GCP, creating a platform
              concentration dependency. Azure is not listed as a supported provider, limiting deployment options for the
              large segment of enterprise customers standardised on Azure.


              Security posture is supported by SOC 2 Type 2 attestation, annual penetration testing, a bug bounty
              programme, AES-256 GCM encryption at rest, TLS 1.2 in transit, and Zero Trust remote access tooling. Three
              CVEs exist in the OpenCVE record for the `redpanda` vendor: CVE-2023-50976 (CVSS 9.8 Critical — missing
              authorisation in Transactions API, fixed in 23.1.21 and 23.2.18); CVE-2023-24619 (CVSS 5.5 Medium —
              cleartext AWS credential logging, fixed in 22.1.12/22.2.10/22.3.12); and CVE-2023-30450 (CVSS 4.3 Medium —
              TLS misconfiguration in rpk, fixed in 23.1.2). All CVEs are in versions no longer in the primary supported
              release line. No CVEs are documented for Redpanda 23.3+, the current major release train. The critical
              CVE-2023-50976 exposes a risk that similar authorisation gaps could exist in newer features (e.g., ADP
              Transactions, AI Gateway) before they surface in public CVE records.
