      - number: '3.2'
        title: Direct Peers — Confluent, WarpStream, and AutoMQ
        blocks:
          - type: paragraph
            body: >
              Confluent is Redpanda's primary direct competitor. Founded by Apache Kafka's original creators (Jay Kreps,
              Neha Narkhede, Jun Rao), Confluent built the dominant commercial Kafka offering and went public on NASDAQ
              in 2021. Its product portfolio spans Confluent Cloud (SaaS on AWS, GCP, Azure powered by the proprietary
              Kora engine), Confluent Platform (self-managed on-premises/hybrid), WarpStream by Confluent (BYOC diskless
              acquired September 2024), and Confluent Private Cloud. On December 8, 2025, IBM announced an all-cash
              acquisition of Confluent at $31.00 per share, expected to close by mid-2026. Confluent will continue
              operating as a distinct brand under IBM, targeting large hybrid-cloud enterprises; Redpanda markets this
              integration period as a distraction risk for Confluent customers. Confluent's fragmented multi-product
              architecture—requiring separate cluster types for Kora, WarpStream, Freight, and Platform
              workloads—contrasts with Redpanda's unified R1 engine that optimizes per-topic within a single cluster.
              Confluent Cloud offers a 99.99% SLA, 120+ pre-built connectors, 80+ fully managed connectors, and a fully
              managed Apache Flink service—a capability Redpanda currently lacks. Its CKU-based pricing model is noted
              as complex and typically higher-cost than Redpanda for equivalent workloads.

              WarpStream (now Confluent-owned) is the most architecturally distinct competitor: a stateless Go-based
              platform writing directly to S3 with zero local disks and zero inter-AZ costs, marketed as "10x cheaper
              than Kafka." Its produce P50 latency of approximately 250ms and end-to-end P50 of ~900ms makes it
              unsuitable for sub-100ms latency requirements, positioning it primarily in high-volume, latency-tolerant
              workloads such as logging and observability. WarpStream runs agent binaries in the customer's VPC with a
              Confluent-managed control plane; no cross-account IAM access is required for data. Key WarpStream
              customers include Robinhood (swapped Kafka for logging), Character.AI, Grafana Labs, and ShareChat.

              AutoMQ is an open-source Kafka fork using S3 as primary storage with a pluggable WAL layer (S3 WAL for
              ~500ms latency; EBS WAL for sub-10ms P99). AutoMQ claims 66% cost savings vs Apache Kafka through its
              pay-per-usage model with no partition fees. Its April 2026 comparative analysis of the Kafka
              ecosystem—self-described as "independent analysis"—positions AutoMQ favorably but provides useful
              architectural detail on all nine competing platforms. AutoMQ lacks the enterprise track record and
              community scale of Confluent or Redpanda.
