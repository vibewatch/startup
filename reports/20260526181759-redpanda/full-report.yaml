      - number: '4.3'
        title: 'Cost structure and unit economics: BYOC structural advantage, no public margin data'
        blocks:
          - type: paragraph
            body: >-
              Redpanda's cloud-tier cost structure is driven primarily by cloud infrastructure hosting on AWS, GCP, and
              Azure as COGS for Dedicated and Serverless clusters. BYOC is structurally cost-light for Redpanda: because
              the compute runs in the customer's own cloud account, Redpanda's direct COGS for BYOC is largely limited
              to control-plane overhead and support rather than data-plane compute, making BYOC structurally superior in
              gross margin to Dedicated. No gross margin, NRR, CAC, or payback period has been publicly disclosed.
              Comparable public cloud-native SaaS infrastructure vendors operate at 65-75% subscription gross margin at
              scale; Redpanda's margin is likely directionally similar for BYOC but could be lower for Dedicated due to
              direct infrastructure costs. The company's MSK TCO blog argues that BYOC eliminates cross-cloud egress
              costs which in high-throughput environments can match or exceed the streaming software cost itself. An
              independent 2026 technical analysis by competitor AutoMQ identified that Redpanda's BSL 1.1 license
              restricts competitive use and that its shared-nothing architecture requires manual broker rebalancing — a
              potential increase in operational TCO versus S3-native alternatives. These architectural factors may
