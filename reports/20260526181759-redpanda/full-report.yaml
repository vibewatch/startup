      - number: '2.5'
        title: Sizing gaps, contradictions, and diligence asks
        blocks:
          - type: paragraph
            body: |-
              The most material evidence gap is the absence of a clean published TAM/SAM for the
              Kafka-compatible streaming infrastructure sub-layer specifically. The streaming analytics
              market ($23.4B-$128.4B range) is too broad because it includes analytics processing,
              visualization, and ML inferencing beyond the broker layer. Confluent's historical
              revenue as a public company proxy is directionally useful but is not a full market
              estimate; Amazon MSK's embedded hyperscaler spend is never separately reported;
              WarpStream's cost is folded into Confluent post-acquisition; and the long tail of
              self-managed Kafka deployments has no reliable monetization estimate.

              A second gap is the lack of independent verification of Redpanda's ARR trajectory
              beyond GetLatka's community-sourced data and Redpanda's own press releases. The 300%
              FY2024 and 70% Q1 FY2027 growth figures are company claims. Revenue, NRR, churn, and
              channel mix are not publicly disclosed in audited form. Sizing Redpanda's SOM from
              public sources is therefore not feasible with the available evidence.

              Contradictions worth preserving: Fortune Business Insights and MarketsandMarkets publish
              separate streaming analytics estimates that differ materially from GVR—FurtuneBusiness
              Insights' page redirected to a different market during research, confirming that
              even the published market estimates carry reliability risk when accessed without a paid
              portal subscription. GVR's two-data-point CAGR notation (both 28.3% in the headline
              and 19.0% cited in an image alt-text) suggests the report was updated mid-cycle without
              full consistency. These are preserved as analytical limitations rather than collapsed
              into one authoritative figure.
