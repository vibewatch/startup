  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The streaming data infrastructure market is structured around Apache Kafka as the de facto open-source
              standard, with a layered set of commercial and alternative platforms built atop or compatible with the
              Kafka protocol. Redpanda targets the same buyers and workloads as this ecosystem, making any
              Kafka-compatible platform a direct or adjacent substitute. The landscape can be divided into five
              categories: (1) self-managed open source (Apache Kafka, Apache Pulsar); (2) commercialized Kafka platforms
              (Confluent, including its WarpStream BYOC offering); (3) cloud-managed Kafka services (Amazon MSK, Aiven);
              (4) S3-native diskless alternatives (WarpStream, AutoMQ, Aiven Diskless Kafka); and (5) cloud-native
              proprietary streaming services (Amazon Kinesis Data Streams, Google Pub/Sub) that are not Kafka-API
              compatible. Redpanda occupies a distinctive position as a Kafka-API-compatible, performance-optimized
              platform with a BYOC and self-managed option, positioning between the complexity of self-hosted Kafka and
              the cost/vendor-lock of fully managed services. The most strategically significant competitive development
              as of mid-2026 is Confluent's pending acquisition by IBM (announced December 2025, expected close
              mid-2026), which Redpanda actively markets as creating "merger distractions" at its primary direct
              competitor. Simultaneously, the proliferation of S3-native diskless alternatives introduces a
              cost-optimization wedge in price-sensitive and latency-tolerant segments. Apache Kafka, despite its JVM
              overhead and operational complexity, retains massive installed base and network effects: it is used by 10
              out of 10 top global banks and 7 of 10 top insurance companies.
            claimRefs:
