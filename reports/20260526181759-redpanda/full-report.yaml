  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Redpanda
    rows:
      - - Kafka-compatible event streaming brokers
        - Durable log-based message broker software and managed cloud services using the Kafka API
        - Generic message queues (RabbitMQ/ActiveMQ) without Kafka protocol compatibility
        - Platform engineers and data infrastructure teams
        - Core market where Redpanda competes directly against Kafka and Confluent
      - - Managed Kafka cloud services
        - Fully managed Kafka cloud offerings including Confluent Cloud Amazon MSK and Redpanda Cloud
        - Self-managed infrastructure compute and storage costs when no SaaS layer is purchased
        - Platform engineering team budgets via cloud subscriptions
        - Primary commercial battleground for Redpanda Cloud versus Confluent and MSK
      - - Streaming connectors and CDC pipelines
        - Change-data-capture and integration connectors between data sources and streaming platforms
        - Pure batch ETL tools such as Fivetran or Airbyte that lack stream-native architecture
        - Data engineering and integration teams
        - Redpanda Connect with 300+ connectors expands this segment as an adjacency
      - - Agentic data infrastructure
        - Real-time data governance connectivity and observability for AI agent deployments
        - General-purpose AI model serving and inference platforms
        - CTO and AI infrastructure teams
        - Emerging buyer segment Redpanda targets with its Agentic Data Plane product
      - - Streaming analytics (broad)
        - Analytics processing visualization and real-time decisioning layers built on top of event streams
        - Kafka-compatible broker infrastructure which sits below this layer
        - Analytics and ML engineering teams
        - Context for TAM sizing only; Redpanda is an infrastructure input to this layer not its end product
      - - Status-quo Kafka self-managed
        - Internal engineering effort to operate Apache Kafka clusters on bare metal or cloud VMs
        - Managed cloud subscriptions or commercial Kafka distributions
        - DevOps and platform engineering teams
        - Migration opportunity for Redpanda to replace self-managed Kafka at lower operational cost
    notes: >-
      The boundary between streaming infrastructure and streaming analytics is important for valuation: Redpanda is an
      infrastructure input to the $23.4B-$128.4B streaming analytics market, not a full participant in that spend pool.
      TAM estimates sourced from streaming analytics reports overstate the infrastructure sub-layer addressable market.
