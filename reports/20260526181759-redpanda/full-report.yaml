          - type: callout
            title: Key-person concentration in Alexander Gallego
            body: >-
              Every funding announcement, every strategic pivot, and every investor relationship traces back to a single
              founder. GV's explicit statement that they "proudly backed him in every round since Series A" reflects
              personal conviction, not institutional conviction in a management team. Loss or incapacitation of Gallego
              before a formal succession structure is established represents a material risk that the newly appointed
              leadership bench (Akidau, Corcoran, Czapiga) does not yet fully mitigate.
