      - number: '8.4'
        title: 'Scenario analysis: bull, base, and bear paths to exit'
        blocks:
          - type: paragraph
            body: >-
              Three scenarios bound the return distribution. In the bull case (35% probability), Redpanda executes its
              Agentic Data Plane strategy to reach $100M ARR by 2028 at 55–65% CAGR, secures Fortune 500 anchor
              customers in new verticals, and closes a Series E before a strategic exit to a cloud provider or
              enterprise software vendor at $3–5B — representing a 3–5x return on Series D price. In the base case (45%
              probability), growth continues at 40–50% CAGR, ARR reaches $70–80M by 2028, and the company is acquired at
              10–14x ARR for $700M–$1.1B — representing a 0.7–1.1x return, near breakeven on current price. In the bear
              case (20% probability), growth decelerates below 30% CAGR due to hyperscaler commoditization, BSL
              licensing headwinds, or enterprise pipeline slowdown; ARR stalls at $35–50M, and the company recapitalizes
              at flat or down-round before a distressed exit below $700M. All scenarios are sensitive to the same two
              unknowns: gross margin profile (determining at what ARR scale the company attracts a broad acquirer
              universe) and NRR (determining whether land-and-expand in existing accounts offsets new customer
              acquisition costs). Neither is publicly disclosed.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV020
              - CV030
              - CV035
