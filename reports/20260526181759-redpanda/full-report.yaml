  - id: FV001
    type: flow
    title: Investment Decision Framework
    layout: standard
    summary: >-
      Decision flowchart for evaluating Redpanda investment at current $1B Series D valuation, based on key qualitative
      and quantitative gates.
    data:
      nodes:
        - id: n1
          label: Is the streaming analytics market growing >20% CAGR with AI tailwinds?
          detail: 'Multi-analyst consensus: 28–32% CAGR; AI workloads provide additional expansion surface'
        - id: n2
          label: Does Redpanda have a defensible technical moat vs. Kafka-managed and hyperscaler alternatives?
          detail: C++ native, single binary, Kafka-API compatible, BYOC architecture; 10x benchmark throughput
        - id: n3
          label: Is current valuation below 20x forward ARR or is gross margin / NRR disclosed and favorable?
          detail: 'Current: ~23–38x ARR; gross margin, NRR not disclosed; M&A comp at 10.8x revenue'
        - id: n4
          label: AVOID — Insufficient market or technical differentiation
          detail: Exit the thesis; category tailwinds not sufficient for current valuation
        - id: n5
          label: TRACK — Thesis valid but valuation stretched; wait for unit-economics disclosure
          detail: Current verdict; upgrade triggers are ARR >$60M, gross margin disclosed, NRR >120%
        - id: n6
          label: INVEST — Valuation supports risk-adjusted return; proceed to full diligence
          detail: Not currently met; requires multiple compression or unit-economics disclosure
      edges:
        - from: n1
          to: n2
          label: 'Yes'
        - from: n1
          to: n4
          label: 'No'
        - from: n2
          to: n3
          label: 'Yes'
        - from: n2
          to: n5
          label: No clear moat
        - from: n3
          to: n6
          label: Yes — valuation supportable
        - from: n3
          to: n5
          label: No — multiple stretched
