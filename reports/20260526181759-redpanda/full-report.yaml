  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Redpanda Data Inc. — publicly branded as "Redpanda" — is a real-time streaming data platform company
              headquartered in San Francisco, California. The company was founded in January 2019 when Alexander Gallego
              wrote the first line of code in Miami before relocating to San Francisco, operating initially under the
              name Vectorized before rebranding to Redpanda Data and later to Redpanda. The legal entity is Redpanda
              Data Inc., as confirmed by the April 2025 Series D announcement on BusinessWire.


              Redpanda's core product is a Kafka API-compatible event streaming platform written in C++ — a deliberate
              architectural departure from the Java-based Apache Kafka, which the company argues was built for a
              different era of spinning disks and single-core CPUs. By targeting modern multi-core hardware and removing
              the ZooKeeper dependency, Redpanda claims up to 10x better performance at lower infrastructure cost. The
              platform is source-available under the Business Source License (BSL), which grants broad use rights to
              developers while preventing cloud providers from offering it as a managed service without a commercial
              agreement — a deliberate moat against hyperscaler commoditization.


              The product portfolio has expanded significantly since founding: Redpanda Streaming is the core broker;
              Redpanda Cloud offers fully managed, dedicated-hosted, and Bring-Your-Own-Cloud (BYOC) deployment options;
              Redpanda Connect (acquired from London-based Benthos in May 2024) adds 300+ data connectors and CDC
              pipelines; and the Agentic Data Plane (ADP, launched October 2025) provides governance, observability,
              MCP-aware connectivity, and SQL query capabilities for enterprise AI agent deployments — rounded out by
              the October 2025 acquisition of distributed SQL engine Oxla. The business model is B2B SaaS with revenue
              from cloud subscriptions, self-hosted enterprise licenses, and managed services across a range of
              deployment form factors.
