      - - Tiered Storage
        - Cold-data offload to object storage; reduces broker disk footprint
        - AWS S3 / GCP GCS / Azure Blob
        - Cloud provider availability dependency for cold reads; egress costs on read-back
      - - Cloud Topics (R1 engine)
        - Direct-to-S3/GCS writes; Raft stores only metadata
        - AWS S3 / GCP GCS
        - Higher write latency from batch window; read path must pull from object storage
      - - Redpanda Connect (Go binary)
        - CDC, data integration pipelines, AI connectors, Bloblang transforms
        - None (embeddable); upstream CDC source DBs
