      - number: '3.3'
        title: Incumbents, Adjacent Platforms, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Apache Kafka remains the dominant incumbent and the baseline against which all alternatives are judged.
              Running on the JVM (Java/Scala), Kafka's architecture was designed for on-premise data centers where
              cross-rack replication was cost-free; cloud deployments incur significant per-byte cross-AZ replication
              charges. Apache Kafka 4.3 is the latest release, with KRaft consensus making ZooKeeper dependency optional
              in recent versions, addressing a longstanding operational pain point. Redpanda's benchmark claims 10x
              faster tail latencies vs Kafka and up to 3x fewer nodes needed for equivalent throughput; the benchmark
              used Apache OpenMessaging Benchmark framework with TLS/SASL enabled at 50MB/s, 500MB/s, and 1GB/s
              workloads. However, Kafka's unmatched ecosystem depth, zero licensing cost, and massive installed base
              mean that internal build (self-managed Kafka) remains a viable status quo for any organization with
              existing Kafka expertise and tooling investments.

              Amazon MSK (Managed Streaming for Apache Kafka) is the most common Kafka managed service for AWS-native
              customers. MSK offers two broker types: Standard (manual rebalancing, maximum flexibility) and Express (up
              to 3x more throughput per broker, 20x faster scaling, but less configurable). MSK Serverless starts at
              $0.75/hour base cost vs Redpanda's $0.10/hour. MSK Standard brokers require manual partition rebalancing
              and its Standard SLA of 99.9% explicitly excludes the Apache Kafka data plane itself. MSK creates deep AWS
              vendor lock-in: schema registry requires separate AWS Glue, not available on GCP or Azure, and support
              staff are generalists rather than streaming specialists. However, for the large cohort of AWS-centric
              enterprises, MSK's native integration with IAM, VPC, CloudWatch, and other AWS services is a substantial
              adoption accelerant.

              Apache Pulsar (v4.2 latest) separates compute and storage with built-in multi-tenancy and geo-replication,
              and provides Kafka compatibility via the Kafka-on-Pulsar (KoP) bridge layer. Pulsar is the incumbent
              choice in multi-tenant and geo-distributed deployments, though its complex topology and bridge-layer
              compatibility risks make it a secondary consideration for most Kafka-native buyers. Aiven's managed Kafka
              service offers diskless topics (KIP-1150 implementation) claiming 78% TCO savings vs standard 3-AZ Kafka,
              but at a P99 diskless latency of 1,500–2,000ms—substantially higher than Redpanda. Amazon Kinesis Data
              Streams is a fully serverless AWS-native streaming alternative priced at $0.032/GB ingest, $0.016/GB
              retrieval, but lacks full Kafka API compatibility and creates deep AWS lock-in.
            claimRefs:
