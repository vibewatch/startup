      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation is Track — valuation multiple too stretched to invest without unit-economics data
            body: >-
              Redpanda's ARR multiple of approximately 38x trailing (23–25x forward estimate) is 2–3x the IBM-Confluent
              M&A benchmark of 10.8x FY2024 revenue. The market thesis is credible, the investor syndicate is top-tier,
              and the AI tailwind is real, but none of these factors justifies committing capital at current price
              absent gross margin, NRR, and ARR waterfall disclosure. The upgrade path is clear: $60M+ ARR disclosure,
              65%+ BYOC gross margin, and 120%+ NRR. Until those triggers are met, Track is the appropriate posture.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV020
              - CV036
          - type: callout
            title: IBM-Confluent sets a 10.8x revenue M&A ceiling that Redpanda must significantly grow through
            body: >-
              The IBM acquisition of Confluent at approximately $10.4B on $963.6M in FY2024 revenue is the most relevant
              sector M&A comparable. For Redpanda to exit at 3x Series D price ($3B) at a comparable 10–12x revenue
              multiple, it must reach $250–300M in annual revenue — a 6–10x growth from current estimates. This requires
              sustained 50–65% CAGR for 4–5 years with strong margin improvement. The base case at $700M–$1.1B would
              imply a near-breakeven or slight loss on Series D entry price.
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV036
          - type: callout
            title: Top-tier syndicate with consecutive $100M rounds signals high-conviction insider support
            body: >-
              GV (Google Ventures) has invested in every Redpanda round since Series A; Lightspeed led Series C and
              co-invested in Series D. This insider-led follow-on pattern at a 3x valuation step-up (Series C estimated
              $300–350M to Series D $1B) is an unusually strong signal of institutional conviction. Combined with the
              Haystack VC early-stage presence and the Lightspeed "definitional product-market fit" characterization,
              the syndicate quality is as strong as seen in early-unicorn data infrastructure companies.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV024
              - CV032
              - CV039
              - CV041
          - type: callout
            title: ARR and burn rate figures are third-party estimates — diligence must obtain official data
            body: >-
              The investment analysis rests on two unverified data points: (1) GetLatka's December 2025 ARR estimate of
              $26.1M, which drives the 38x trailing multiple; and (2) the analyst-derived monthly burn rate of $3–6M,
              which drives runway estimates. Both must be replaced with company-confirmed data before any investment
              commitment. The investor should request audited FY24–FY26 financials, ARR breakdown by tier, and current
              cash position as the first diligence step.
            calloutType: assumption
