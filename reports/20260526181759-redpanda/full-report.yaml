            title: IBM/Confluent acquisition materially strengthens primary competitor
            body: >-
              IBM's announced $11 billion acquisition of Confluent in December 2025 gives Redpanda's most direct
              competitor access to IBM's 4,000-person enterprise sales force, global public-sector relationships, and
              data-platform integration stack. Redpanda must now compete against a well-resourced incumbent with an
              established open-source Kafka brand and IBM's Fortune 500 distribution — a structural competitive shift
              that materially raises the stakes of any sales cycle against Confluent.
            calloutType: risk
            claimRefs:
