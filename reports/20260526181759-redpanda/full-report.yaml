              an early-growth SaaS company investing heavily in sales and R&D. Enterprise customer quality is visible:
              the NYSE uses Redpanda to power NYSE Cloud Streaming, processing hundreds of billions of messages daily
              with sub-100ms latency. Activision, Cisco, Moody's, Snowflake, and two of the top five US banks are cited
              as users. The ShareChat deployment handles 400 million MAU, and the Lacework deployment peaked at 14.5
              GB/s throughput. These enterprise proof points suggest Redpanda's BYOC tier is landing meaningful
              accounts, though revenue concentration risk across large accounts cannot be assessed from public data.
              Community growth of 56% in Slack membership and 36% in GitHub stars in FY24 signals healthy developer
