chapter:
  number: 4
  title: Financials
  summary: Cyera is still private and therefore opaque on audited revenue, margins, and burn, but public signals point to
    very fast ARR growth, a large late-stage capital base, and a valuation that is rich even by cybersecurity standards. The
    key diligence issue is not whether the company is scaling; it is how much of the reported scale is durable, how much is
    still promotional, and what the true margin/ramp profile looks like underneath the top line.
sections:
- id: financing-model
  title: Revenue Model and Monetization Mechanics
  body: 'Cyera sells enterprise subscriptions, not self-serve seats. Public materials describe a scope-based pricing model
    tied to deployment footprint, data volume, environments connected, and module mix. That is standard for complex security
    software: customers buy a platform first, then expand into DLP, AI governance, or adjacent workflow modules once the base
    classification layer is installed.


    This matters because the company''s reported growth is not just logo growth; it is also expansion revenue potential. A
    data map created for DSPM can be monetized again through DLP, privacy operations, agent governance, and other trust-layer
    features. That makes Cyera more analogous to a platform vendor than to a single-purpose tool.


    The tradeoff is that enterprise monetization is harder to model from the outside. Pricing is negotiated, not published,
    so public ARR estimates are useful but not definitive. The financial question is therefore not whether Cyera can charge
    a premium, but whether its pricing power survives platform bundling and long procurement cycles.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
- id: financing-scale
  title: Revenue Scale and Capitalization
  body: 'The current public range for Cyera''s ARR is wide. Sacra estimates about $150 million of ARR in May 2026, while other
    public company-data pages and articles still cite lower 2026 figures around $70 million. That spread matters: at a $12
    billion valuation, the implied revenue multiple ranges from roughly 80x to well over 150x depending on which figure proves
    closest to the mark.


    On the capital side, the company has continued to raise aggressively. Public coverage in June 2026 described a $600 million
    round at a $12 billion valuation, and September 2026 coverage described a $400 million Goldman Sachs-led extension, with
    total funding now near $1.94 billion or slightly above depending on the source. The capital base is clearly large enough
    to fund continued growth, but the public record still leaves ambiguity about the exact latest round structure and total
    proceeds.


    For diligence, the key is not the headline amount alone. It is whether the company is funding efficient expansion or buying
    growth at a cost structure that will be hard to compress later.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
  figureRefs:
  - FI001
- id: financing-risks
  title: Capital Adequacy, Margin, and Underwriting Gaps
  body: 'Cyera appears well-capitalized in the ordinary sense. Public sources point to 1,500-plus employees across 18 countries,
    a large investor base, and an ARR base that is already substantial for a private cybersecurity company. But the missing
    pieces remain the same ones that matter for underwriting: gross margin, cohort retention, burn rate, and customer concentration.


    Enterprise security businesses often show strong gross margins eventually, but they can look worse than expected during
    a heavy growth phase because field sales, support, and integration engineering eat into operating leverage. If Cyera is
    carrying a large services burden or using capital to subsidize deployment complexity, its quality of growth may be weaker
    than the headline ARR suggests.


    The financial base case is therefore constructive but not fully underwritten. The company looks capable of supporting
    another growth cycle; it is not yet fully transparent enough to know how much dilution, preference overhang, or spending
    inefficiency is embedded in the latest financing stack.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI003
