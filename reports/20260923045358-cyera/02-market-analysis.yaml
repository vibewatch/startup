company:
  name: Cyera
chapter:
  number: 2
  title: Market Analysis
  summary: Cyera operates in a broadening data-security market that now spans DSPM, DLP, privacy, and AI-governance workflows.
    The market is growing fast, but the exact DSPM-only TAM remains fuzzy, so underwriting should lean on buyer pain, regulatory
    pressure, and enterprise budget ownership rather than a single point estimate.
sections:
- id: market-definition
  title: Category Boundary and Buyer Problem
  body: 'Cyera sits at the intersection of DSPM, DLP, and AI security. In practical terms, the category is about automatically
    discovering where sensitive data lives, classifying what it is, and deciding who or what may touch it. That is broader
    than classic DLP, which focuses on data-in-motion, and narrower than a full data-governance stack, which also includes
    cataloging, lineage, and business semantics.


    The immediate buyer problem is not abstract security theory; it is operational data sprawl. Large enterprises now run
    multicloud data stores, SaaS apps, and AI systems that copy or transform sensitive records at machine speed. The buyer
    who feels that pain most acutely is usually the CISO, but the economic sponsor can also be the CDO, privacy lead, or AI-platform
    owner when the use case is privacy, lineage, or AI access control rather than pure breach prevention.


    Cyera''s own messaging, plus external market commentary, imply that the category is shifting from point solution to trust
    layer. That matters because it expands the spend pool: the same data map can support security posture, DLP triage, privacy
    operations, and AI governance.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
- id: market-sizing
  title: Sizing Lenses and Demand Drivers
  body: 'The cleanest public-size anchor in the current record is the broad global data-security market, which Cyera-linked
    sources describe as roughly $24 billion. That is not the same as DSPM TAM, but it is a useful upper bound because DSPM
    competes for the same security and compliance budgets as DLP, CASB, and adjacent cloud-data controls. Sacra''s current
    estimate that Cyera reached about $150 million of ARR in May 2026 suggests the company has already captured a meaningful,
    but still tiny, fraction of that spend pool.


    Demand is being pulled by three durable drivers: cloud data proliferation, regulatory burden, and AI-agent adoption. GDPR,
    CCPA, HIPAA, and the EU AI Act all increase the value of knowing where sensitive data sits and who can reach it. At the
    same time, the rise of copilots and autonomous agents makes access control a runtime problem, not just a one-time compliance
    exercise.


    The result is a market that can support premium pricing if the product reduces manual toil and audit risk quickly enough.
    However, the lack of a single audited DSPM-only market report means every TAM claim should be treated as directional,
    not precise.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM002
- id: market-structure
  title: Adoption Constraints and Budget Ownership
  body: 'Buyer behavior in this category is conservative for a reason: the product touches sensitive corporate data and often
    sits between security, compliance, and data engineering. That makes sales cycles longer than a typical point security
    tool. It also means the ROI case has to be specific. Buyers need to see either fewer breaches, fewer audit hours, fewer
    false positives, or a cleaner AI-control story before budgets unlock.


    Competition is equally important to the market structure. Hyperscaler-native tools and bundled platform vendors lower
    the friction of doing nothing, or of staying inside the existing cloud stack. That compresses price elasticity for mid-market
    buyers and pushes pure-play vendors like Cyera toward large enterprises where depth, cross-cloud coverage, and workflow
    automation matter more than the cheapest bundled option.


    The current demand pattern therefore favors enterprises with the worst data sprawl and the strongest regulatory exposure.
    Those customers are willing to pay for speed and accuracy, but they still expect proof that the platform will reduce incident
    risk and audit work quickly enough to justify another security line item.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM013
  tableRefs:
  - TM003
  figureRefs:
  - FM001
