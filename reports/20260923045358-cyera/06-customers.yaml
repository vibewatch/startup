company:
  name: Cyera
chapter:
  number: 6
  title: Customers
  summary: Cyera appears to be winning large enterprise deals in regulated sectors, but the public record is still thin on
    retention, concentration, and true rollout depth. The strongest evidence comes from named logos, customer-facing press
    quotes, and third-party estimates that suggest the company is already well past small-pilot territory.
sections:
- id: cust-segmentation
  title: Customer Segmentation and Buying Motion
  body: 'Cyera sells into large enterprises, not casual departmental buyers. The most natural fit is a regulated enterprise
    with a sizable cloud footprint: financial services, healthcare, technology, media, retail, and telecom. In those accounts
    the buyer is usually a security executive, but the workflow also pulls in privacy, data-governance, and AI-platform stakeholders.


    The reason is simple: the product sits in the middle of multiple budget owners. A CISO may approve the security layer,
    but privacy and data teams care about mapping and governance, while AI teams care about what agents can reach. That multi-sponsor
    motion is one reason the company can sell larger deals than a narrow point product.


    The challenge is that multi-sponsor motions are slow and potentially fragile. If one stakeholder loses urgency, the deal
    can slip. That makes customer quality just as important as customer count.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: cust-adoption
  title: Adoption Trajectory and Named Proof
  body: 'The public adoption signal is strong. Company and press coverage points to a fast-growing customer base, a large
    Fortune 500 footprint, and named enterprise logos including AT&T, Paramount, Chipotle, and Valvoline. Those logos matter
    because they suggest that the product is moving beyond pilot language into production deployment language.


    Adoption is also reinforced by the surrounding ecosystem. Integration and partner coverage show that Cyera can slot into
    existing enterprise workflows instead of requiring an entirely new operating model. That usually increases the odds that
    a customer will expand after the first use case succeeds.


    Still, the public proof is mostly logo- and quote-driven. We do not yet have an audited customer-count schedule or cohort
    chart, so the scale of rollouts remains partly inferential.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: cust-durability
  title: Retention, Expansion, and Concentration
  body: 'Cyera''s expansion story is plausible because one sensitive-data map can support multiple workflows: remediation,
    masking, AI governance, and investigations. That is the right setup for land-and-expand economics. But the public record
    does not show actual NRR, GRR, or customer concentration, so the durability of those economics remains a diligence question
    rather than a verified fact.


    The most important unresolved issue is concentration. If the top customers are a small group of very large enterprises,
    a single renewal slip can distort the ARR trajectory. If the company is broadening across many enterprises, that risk
    is lower. The public evidence is not sufficient to answer the question cleanly today.


    So the current customer verdict is positive but incomplete: strong logo quality, believable expansion potential, and insufficient
    public data to quantify churn or concentration risk.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
