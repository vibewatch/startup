company:
  name: Cyera
chapter:
  number: 1
  title: Company Overview
  summary: Cyera is a New York-based, Israeli-founded AI/data security platform that has grown from DSPM into a broader enterprise
    trust layer for data, identity, DLP, and AI governance. Current public evidence points to rapid scale, but the company
    remains privately held and opaque on audited revenue, cohort retention, and cap-table details.
sections:
- id: overview-identity
  title: Identity, Product, and Business Model
  body: 'Cyera describes itself as an AI security platform that protects data and secure AI workloads across cloud, SaaS,
    and on-premises estates. The company''s public messaging now emphasizes a broader trust-layer thesis: discover sensitive
    data, understand who and what can access it, and enforce controls across DSPM, DLP, AI security, and identity-aware workflows.
    Public sources in 2026 describe the company as founder-led, with Yotam Segev as CEO and Tamar Bar-Ilan as CTO, and place
    the operating base in New York with engineering presence in Israel.


    The business model remains enterprise subscription software. Public materials and third-party company profiles consistently
    describe deployment as agentless or lightweight-connector based, with pricing tied to deployment scope and module mix
    rather than a self-serve seat model. That matters because the product is sold into large, regulated enterprises where
    implementation depth, security review, and integration breadth drive ACV more than packaging simplicity.


    Cyera''s current product surface is materially broader than a narrow DSPM point solution. The June 2026 press release
    and related materials describe more than 100 new product capabilities shipped over the prior year, plus the company''s
    move into DLP, AI governance, and agentic security. The result is a platform story, not a single-feature story, which
    supports cross-sell but also increases execution complexity.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: overview-leadership
  title: Founders, Leadership, and Governance
  body: 'The founder pair is central to Cyera''s narrative and diligence profile. Yotam Segev is the public face of the company''s
    fundraising and go-to-market story, while Tamar Bar-Ilan anchors the technical architecture and the AI/data-classification
    thesis. Recent public coverage also links the founders to Israel''s Unit 8200 and Talpiot talent pipeline, which continues
    to be a meaningful recruiting and credibility signal in cybersecurity.


    From a governance perspective, the company appears to have matured beyond a two-founder shop. Third-party coverage and
    company materials reference a broader executive bench and outside investors with operating experience, which helps reduce
    founder concentration risk at the margin. Still, the company''s public identity remains tightly associated with the founders,
    so key-person exposure is real if either were to exit or become distracted during a period of fast platform expansion.


    The current diligence question is not whether the founders are credible; it is whether the company can keep scaling product
    surface, customer complexity, and partner integrations without weakening the simple story that won the first wave of enterprise
    buyers.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  tableRefs:
  - TO002
- id: overview-funding-scale
  title: Funding, Valuation, and Scale
  body: "Cyera has continued to re-rate aggressively in 2026. The latest public coverage in September 2026 describes a $400\
    \ million Goldman Sachs-led Series G extension and places total funding near $1.94 billion, while earlier June 2026 company\
    \ and press coverage described a $600 million round at a $12 billion valuation and more than $2 billion of total funding.\
    \ The public record therefore shows both growth and some inconsistency in reported capitalization totals, which should\
    \ be treated as a diligence issue rather than a precision feature.\n\nScale signals are also strong. Company messaging\
    \ says Cyera has grown to more than 1,500 employees across 18 countries and shipped more than 100 new product capabilities\
    \ over the prior year. Earlier 2025\u20132026 third-party coverage described the company at roughly $150 million in ARR,\
    \ putting the implied revenue multiple around 80x if the $12 billion valuation is the right anchor. That is a premium\
    \ multiple even for top-tier security software, so the quality of growth matters as much as the headline valuation.\n\n\
    The core scaling question is whether Cyera can keep translating expansion capital into durable ARR, customer retention,\
    \ and product depth at the same pace as its valuation step-ups. The public evidence is favorable on momentum, but still\
    \ incomplete on audited economics."
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  tableRefs:
  - TO003
- id: overview-milestones
  title: Milestones and Current Diligence Gaps
  body: "Cyera's 2024\u20132026 milestones show a rapid transition from DSPM specialist to platform vendor. The company acquired\
    \ Trail Security in 2024, expanded into AI security and DLP, and then layered on more capabilities and partnerships in\
    \ 2025 and 2026. The most recent public announcements also highlight customer logos such as Paramount, Chipotle, Valvoline,\
    \ and AT&T, which support the thesis that the company is winning large enterprise deployments rather than small pilots.\n\
    \nEven so, the most important diligence gaps remain the same ones private investors usually face at this stage: audited\
    \ ARR, cohort-level retention, cap-table preference stack, and the degree to which reported customer counts reflect revenue-bearing\
    \ deployments versus broader pilots or module attach. Those gaps do not negate the growth story, but they do limit how\
    \ precisely one can underwrite the valuation.\n\nThe result is a company with a strong public growth signal and a high\
    \ information asymmetry burden. That combination usually supports continued monitoring rather than a fully saturated verdict."
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
