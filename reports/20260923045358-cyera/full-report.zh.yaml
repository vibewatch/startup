  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与核心场景
        blocks:
          - type: paragraph
            body: >-
              Cyera 的产品形态脱胎于标准的 DSPM 工作流：接入数据存储、探查并分类敏感数据，并对高危风险暴露排定优先级。公司已将这套底座进一步扩展至 DLP、AI
              治理、隐私运营以及智能体管控。换言之，产品不再止步于“找到数据”，而是全面管控数据在现代企业系统中的流转过程。


              这直接重构了客户价值主张：产品解决的不再是单一任务。安全团队可以为了态势管理采购 Cyera，而底层的同一份数据图谱还能同时支撑隐私合规工作流、浏览器端 AI
              治理，以及针对非人身份（NHI）的策略管控决策。这带来了更具说服力的交叉销售逻辑，也打开了更广阔的落地工作流版图。


              弊端同样显而易见：向核心图谱叠加的产品线越多，向客户讲透整体逻辑的难度就越大。对买方而言，先理解其核心发现引擎，再看外围周边模块，依然是接受 Cyera 最顺畅的路径。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
      - number: '5.2'
        title: 架构设计、部署方式与集成模式
        blocks:
          - type: paragraph
            body: >-
              Cyera 的架构采用免代理或轻量代理方式，以 API
              方式直连云环境，并在必要环节配合轻量连接器。相比传统依赖繁重代理的安全工具，这种方式降低了部署阻力，更容易在大型企业内推行试点。此外，架构设计明显偏向集成友好：平台主动对接
              SIEM、身份认证、工单系统及安全生态，而非推翻现有设施推倒重来。


              这种集成路线既是长处也是短板：它让 Cyera 成为企业现有预算的增量补充，有利于推进销售；但同时也继承了依赖其他企业级系统及云端 API 的外部风险。一旦外围技术栈发生变更，Cyera
              的图谱与工作流层必须及时跟进适配。


              总体而言，其架构更像是为大型企业安全量身定制的成熟控制平面，而非简易单点插件。这支撑了企业级客单定价，但同时也带来了更大的运维面。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
      - number: '5.3'
        title: 差异化壁垒、安全性与路线图风险
        blocks:
          - type: paragraph
            body: >-
              Cyera 主打速度、精度和覆盖面。公司称其能高精度分类多种数据；最新产品资料也显示，公司正把数据图谱用于 AI 专属管控和执行工作流。相比“又一个 DSPM 看板”，把数据图谱接入实际运营决策，价值主张更扎实。


              自身的安全防线同样关键。              Cyera 发布了 Salesloft
              安全事件应对说明和研究文章，有助于巩固安全买方对公司的信任。但这些材料也凸显了品类本身的风险：供应商身处敏感数据链路，必须持续赢得客户信任。


              路线图风险在于产品过度臃肿。如果团队急于推出过多外围模块，可能会稀释核心价值主张、拖慢落地节奏并加剧售后支持负担。只有当底层数据分类引擎依然是客户买单的最核心理由时，产品版图的扩张才具备实质价值。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE012
