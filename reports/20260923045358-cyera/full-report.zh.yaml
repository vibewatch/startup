  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采购路径
        blocks:
          - type: paragraph
            body: >-
              Cyera 面向大型企业，而非一般部门买家。最适合的客户是云资产庞大、监管要求严格的企业，覆盖金融、医疗、科技、传媒、零售和电信等行业。安全高管通常是主要买方，但隐私、数据治理和 AI 平台等多个团队。


              原因很简单：产品正好卡在多个预算主管的交汇点上。CISO 可以批复安全层的支出，隐私和数据团队关注数据资产测绘与治理，而 AI
              团队则严控智能体能触达的数据边界。这种多方买单推进机制，正是公司能够签下远超单点工具的大单金额的重要原因。


              难点在于，多方协同推进往往节奏缓慢且容易生变。任何一方只要紧迫感降温，成单周期就会拖长。因此，客户质量与签约客户数同等关键。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 客户拓展路径与标杆案例
        blocks:
          - type: paragraph
            body: >-
              公开客户信号强劲。公司和媒体称其客户群快速增长，并已覆盖不少 Fortune 500 企业；公开点名的客户包括 AT&T、Paramount、Chipotle 和
              Valvoline。这些案例支持产品已进入企业生产部署、而不只是 PoC 试点的判断。


              周边生态进一步放大了落地效应。集成与伙伴报道证实，Cyera 能顺畅切入现有企业工作流，无需客户颠覆现有的运营模式。这种无缝嵌入通常会大幅提高首个场景落地后的增购概率。


              然而，目前的公开佐证多以客户商标与公开发言为主。尚未公开经审计的客户数明细或队列流失图表，因此实际部署体量在很大程度上仍需推测。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU011
      - number: '6.3'
        title: 留存表现、增购潜力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Cyera 的扩张逻辑说得通：一张敏感数据图谱可供风险修复、数据脱敏、AI 治理和调查等多条工作流共用，适合先切入、再扩展的销售模式。不过，公开资料没有披露实际 NRR、GRR
              或客户集中度数据，因此这套扩张模型能否长效运转，在尽调中仍属有待论证的推论，而非既定事实。


              最核心的未决风险是客户集中度。若营收过度仰仗少数几家超大型企业，哪怕单一大单续约受阻，都会剧烈扰动 ARR 走势；若客群已广泛分散至众多企业，该风险便相对可控。现有公开证据尚无法彻底厘清这一结构。


              因此，当前客户维度的尽调结论偏向乐观但仍显不足：标杆客户含金量高，增购潜力合乎逻辑，但公开数据不足以量化客户流失与集中度风险。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、法律风险与供应商信任
        blocks:
          - type: paragraph
            body: >-
              Cyera 能接触企业高度敏感的数据，因此信任风险关乎存亡，即使公司从不存储客户数据载荷。若 Cyera 自身系统遭到入侵，它掌握的客户数据元数据图谱可能成为攻击者眼中极有价值的目标。相比普通 SaaS
              应用，这要求 Cyera 经受更高的信任考验。


              监管环境也是一把双刃剑。GDPR、CCPA、HIPAA 与欧盟 EU AI Act 为 Cyera 的产品带来需求，也让供应商和使用平台的客户承担合规义务。若跟不上合规要求，销售可能放缓，也可能引发法律风险。


              Cyera 必须持续以安全赋能者的姿态出现，不能沦为安全隐患。信任不是产品的附带效果，而是产品本身的一部分。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营、安全与路线图风险
        blocks:
          - type: paragraph
            body: >-
              Cyera 的运营依赖云端 API、连接器和庞大的集成体系，效率虽高，却也意味着 AWS、Azure、GCP、SaaS 应用或工作流工具一旦变更，工程团队就可能得迅速更新适配。Cyera
              发布的公开安全文章说明公司了解这一问题，但了解并不能消除风险。


              第二项运营风险是平台摊子越铺越大。产品已覆盖 DSPM、DLP、AI 治理和多条相邻工作流。              覆盖面广有助于增购，却也增加功能重叠、支持负担，以及大型企业部署变慢、难以顺利落地的可能。


              第三项风险很直接：信任层供应商必须比自己监控的系统更可靠。一次备受关注的运营故障，就可能损害 Cyera 争取安全预算所依赖的品牌。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 合作伙伴依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Cyera 的市场拓展和产品推进都与合作伙伴紧密交织。伙伴有助于扩大分发，但也带来依赖风险：核心集成若中断、平台伙伴若捆绑竞品功能，或采购渠道若改变，Cyera
              可能不得不改走阻力更大的直销模式，重新争取同一笔订单。


              财务上的主要风险是，公开估值上行快于公开证据积累。现有报道提及 $12 billion 估值和近 $2 billion 累计融资，但
              ARR、毛利率、烧钱速度和客户集中度仍不透明。即使增长只是略有放缓，估值倍数也可能迅速压缩。


              因此，Cyera 面临的主要是执行风险叠加估值倍数风险，而非经营困境。公司看起来并不脆弱，只是估值偏高、运营战线繁杂。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
