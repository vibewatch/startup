  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Cyera 卖的是企业级订阅，不是自助式席位。公开资料称，定价取决于部署范围、数据量、接入环境数量和模块组合。这是复杂安全软件的常见路径：客户先部署基础平台，等数据分类层铺开后，再增购 DLP、AI
              治理或相邻工作流模块。


              增长不只来自新客户，也有赖于现有客户增购。DSPM 建立的数据图谱还能支撑 DLP、隐私运营、智能体治理等信任层功能，为同一份底层资产带来多次变现机会。这也让 Cyera
              更接近平台型厂商，而非单一用途的单点工具。


              代价在于外部极难建立精准的商业化测算模型。价格全靠一单一定、不对外公开，公开渠道估算的 ARR 虽有参考价值，却非定论。因此，财务维度的核心考量并非 Cyera
              能否收取溢价，而是在面对平台捆绑冲击与冗长采购周期时，其定价权究竟能维持多久。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: 收入体量与资本化进程
        blocks:
          - type: paragraph
            body: >-
              目前公开渠道对 Cyera 的 ARR 估算区间跨度极大。Sacra 估计其 2026 年 5 月 ARR 达到约 $150 million，而其他公开商业数据库与报道仍引用约 $70 million 的
              2026 年偏低数据。这一差距至关重要：在 $12 billion 估值基准下，视哪组数据更贴近实际情况，其隐含市销率介于约 80x 到 150x 以上不等。


              融资方面，公司仍在积极大额融资。2026 年 6 月的公开报道说，公司以 $12 billion 估值完成 $600 million 融资；2026 年 9 月的报道则称 Goldman Sachs 领投
              $400 million 延展轮。不同信源统计的累计融资约为 $1.94 billion，或略高。资金规模足以支持后续增长，但最新一轮的具体结构和实际募资总额仍说不清。


              尽调真正要问的，不只是融了多少，而是公司能否高效扩张，还是在用日后难以压降的成本结构买增长。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
