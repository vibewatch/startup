      - number: '4.3'
        title: 资本充足度、毛利与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从常规标准衡量，Cyera 资本储备颇为雄厚。公开信源显示，其员工超过 1,500 人，分布在 18 个国家，股东阵容强大，且 ARR
              体量在非上市网安企业中已相当可观。但在投资测算的核心环节上，关键数据依然缺失：毛利率、客户队列留存率、烧钱速度与客户集中度均未公开。


              企业级安全厂商的毛利率最终往往较高，但高速扩张期可能低于预期，因为一线销售、支持和集成工程成本会侵蚀经营杠杆。若 Cyera 背负过重的定制服务负担，或靠资金补贴复杂的交付部署，其增长质量可能就会弱于表面光鲜的
              ARR 表现。


              因此，财务层面的基准情景偏向积极，但尚未得到完整数据支撑。公司看起来有能力支撑新一轮增长，但透明度仍显不足，外部难以看清最新融资结构中沉淀了多少股权稀释、清算优先权包袱或低效资金消耗。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
