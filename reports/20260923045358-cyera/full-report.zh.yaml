  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Cyera 本质上是 DSPM 与 AI 安全的专精厂商，但其实际竞争圈远比标签更广。直接的专精型同行有 BigID；传统数据安全巨头 Varonis 拥有成熟的既有客户基本盘；Wiz 等 CNAPP 厂商把
              DSPM 整合进更庞大的云安全平台；Microsoft Purview 与 Google Cloud DLP 则凭借极低的边际成本向买方提供原生工具。


              因此，选型比对往往不仅是功能参数的竞争。买方通常将 Cyera 同时与云捆绑方案、传统老牌巨头以及自研方案拉通权衡。只要 Cyera
              能牢牢守住技术深度优势，这种市场结构对它有利；反之，若买方认为捆绑平台的“及格线”功能足以应付需求，从而放弃采购独立产品，格局就会急转直下。


              竞争的关键不在于 Cyera 是否是一家真正的供应商，而在于独立 DSPM 品类能否持续创造足够价值，抵住平台整合趋势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 差异化优势、切换成本与分发渠道
        blocks:
          - type: paragraph
            body: >-
              Cyera 的差异化核心在于免代理部署、AI
              原生数据分类，以及将同一套敏感数据图谱转化为多重工作流的能力。这一点至关重要：产品并非单向展示的可视化大屏，而是真正的控制平面。客户基于该图谱串联的风险修复、数据脱敏与 AI 治理任务越多，平台的客户粘性就越强。


              分发渠道的重要性不亚于产品深度。Cyera 虽能借助生态集成与云市场采购渠道获客，但大型平台厂商坐拥强大的捆绑杠杆：Microsoft 能直接在现有企业协议（EA）内交付数据安全管控；Wiz 能将 DSPM
              顺带搭售进整体云安全预算；周边厂商也能将自身方案包装为功能升级，而非新增独立品类。


              Cyera 的护城河确实存在，但建立在特定前提之上：唯有当买方对识别精度和覆盖广度的重视程度压过对采购便利与折扣让利的考量时，这一护城河才能屹立不倒。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价机制、反向证据与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              整个品类的公开定价数据极度匮乏，这本身就是一种竞争信号。当各家厂商均不公开标价时，买方只能结合部署体量衡量价值，而非对照现成价目表。这种模式有利于复杂的大客户销售，但也让平台捆绑方案更容易压低独立产品的客单价。


              反向证据好坏参半，尚未出现致命缺陷。用户评价网站与第三方评测显示，Cyera 的知名度已能引发持续的客户讨论，但整个品类在修复深度与操作简便性上仍有打磨空间。来自 Varonis、Nightfall
              及周边友商的对比宣传，也呈现出行业内常见的各执一词、互扬己长。


              总体而言，Cyera 所处的赛道尚未定型，技术领先仍能抢占先机；但市场成熟度已足以让分发能力、采购便捷性与捆绑经济学左右成单结果。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
