companyProfile:
  summary: >-
    Cyera 是一家后期非上市网络安全公司，打造了 AI 原生、免代理的数据安全平台。平台梳理云端、SaaS 和 AI 环境中的敏感数据，再依托这张数据图谱支持风险修复、DLP、治理和 AI 安全工作流。2026
    年公开报道显示，公司估值约 $12 billion，在大型企业中已有明显进展；业务也从狭义的 DSPM 延伸为覆盖面更广的信任层平台。
