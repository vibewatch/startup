  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 品类边界与买方痛点
        blocks:
          - type: paragraph
            body: >-
              Cyera 卡在 DSPM、DLP 与 AI
              安全的交汇处。落地来看，该品类的核心在于自动化定位敏感数据存储位置、完成数据分类，并厘清人或程序对数据的操作权限。这比聚焦动态数据防护（data-in-motion）的传统 DLP
              范围更广，又比包含数据编目、数据血缘及业务语义的完整数据治理堆栈更加收敛聚焦。


              买方的核心痛点并非抽象安全理论，而是实打实的数据无序蔓延。大型企业当下普遍运行多云数据存储、SaaS 应用以及 AI 系统，这些系统以极高的机器速度复制或流转敏感记录。最切身感受到痛点的通常是
              CISO；但若场景偏向数据隐私、血缘追踪或 AI 访问控制而非单纯防泄漏，实际买单方也可能是 CDO、隐私负责人或 AI 平台主管。


              Cyera 自身的宣传与外部市场评价均表明，该赛道正从单点工具向信任层演进。这一变化直接拓宽了可争夺的预算池：同一套敏感数据图谱，能同时支撑安全态势、DLP 分诊、隐私合规运营和 AI 治理多类场景。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场测算视角与需求驱动力
        blocks:
          - type: paragraph
            body: >-
              现有公开记录中最清晰的市场规模参考锚点是广义全球数据安全市场，Cyera 相关信源称其规模约 $24 billion。这并不等同于狭义 DSPM 的 TAM，却是一个有价值的上限区间，因为 DSPM 争夺的预算与
              DLP、CASB 及相邻云数据管控工具同源。Sacra 估计 Cyera 在 2026 年 5 月 ARR 达到约 $150 million，表明公司已吃下一块可观、但占总支出池比例依然极小的份额。


              市场需求主要由三股长期力量推动：云端数据增多、监管要求趋严，以及 AI 智能体普及。GDPR、CCPA、HIPAA 和欧盟 AI Act 都提高了企业掌握敏感数据位置及访问权限的价值。Copilot
              和自主智能体兴起后，访问控制也从一次性合规检查变成了运行时管控问题。


              只要产品能迅速降低人工运维负担与审计合规风险，市场就能接受溢价。然而，由于缺乏针对独立 DSPM 市场的经审计权威报告，任何 TAM 测算都应视作方向性参考，而非精确数字。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: 落地阻力与预算归属
        blocks:
          - type: paragraph
            body: >-
              买方在该品类的采购行为格外审慎：产品直接触及核心企业敏感数据，且往往横跨安全、合规与数据工程三大部门。这导致销售周期长于常规单点安全工具。同时，ROI
              论证必须十分过硬：只有看到真正减少泄漏风险、缩短审计工时、压降误报率，或呈现出清晰的 AI 管控方案，买方才会松口批复预算。


              竞争态势深刻塑造了市场格局。超大规模云厂商的原生工具以及平台型竞品的捆绑打包，降低了客户维持现状、继续依赖现有云堆栈的门槛。这挤压了中端市场的价格弹性，迫使 Cyera
              等专精型独立厂商全力进攻大型企业——因为在大客户眼里，技术深度、跨多云覆盖与工作流自动化，远比廉价的捆绑赠送更为关键。


              因此，当下需求主要流向数据蔓延最严重、合规监管最严苛的大企业。这些客户愿意为排查速度与识别准确率买单，但依然要求确凿证据，确保平台能迅速压降安全事件风险与审计负担，从而证明单独列支一笔安全预算物有所值。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
