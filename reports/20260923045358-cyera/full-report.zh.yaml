chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Cyera 将自己定位为 AI 安全平台，保护云端、SaaS 和本地部署环境中的数据及 AI 工作负载。如今，公司强调的是更广的信任层：先发现敏感数据、厘清哪些人和程序能够访问，再把 DSPM、DLP、AI
              安全与身份感知工作流的管控串起来。2026 年公开资料显示，公司仍由创始人主导：Yotam Segev 任 CEO，Tamar Bar-Ilan 任 CTO；运营总部在纽约，工程团队也设在以色列。


              商业模式仍为企业级软件订阅。公开资料与第三方机构画像一致显示，其部署模式为免代理或轻量连接器接入，定价挂钩部署范围与模块组合，而非自助式按人头收费。这种设计切中要害：产品面向强监管大型企业销售，推动客单价（ACV）的核心动力是实施深度、安全评审与集成跨度，而非包装简化度。


              Cyera 的产品早已不止狭义的 DSPM。2026 年 6 月的新闻稿及相关材料称，公司过去一年推出了 100 多项新功能，并拓展至 DLP、AI
              治理和智能体安全。平台覆盖面扩大，有利于交叉销售，但也增加了执行难度。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 创始人、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              两位创始人是理解 Cyera 的关键。Yotam Segev 是融资和市场拓展的主要对外代表，Tamar Bar-Ilan 负责技术架构以及 AI 和数据分类方向。近期公开报道还将两人与以色列 Unit
              8200、Talpiot 人才体系联系起来；在网络安全行业，这一背景有助于招聘，也构成可信度信号。


              公司治理已不只是两位创始人直接管业务。第三方报道和公司资料提到更完整的高管团队，以及有运营经验的外部投资人，这在一定程度上降低了对创始人的依赖。不过，Cyera
              的公众形象仍与两位创始人紧密绑定；若有人在平台快速扩张期离职或分心，关键人风险仍然存在。


              当前尽调的核心考量并非创始人是否可靠，而是公司在持续拓展产品版图、应对复杂客户需求并深化伙伴集成时，能否守住最初打动首批企业客户的清晰定位。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历史、估值与业务体量
        blocks:
          - type: paragraph
            body: >-
              2026 年，Cyera 估值持续快速上行。2026 年 9 月的最新公开报道显示，Goldman Sachs 领投了 $400 million 的 Series G 延展轮，累计融资接近 $1.94
              billion；而 2026 年 6 月较早的公司及媒体报道则称，公司完成 $600 million 融资，估值为 $12 billion，累计融资超过 $2
              billion。公开记录既显示增长，也暴露出融资总额口径不一；尽调时应把这一差异视为待核实事项，而非精确数字。


              业务规模信号也很强。公司表示，Cyera 员工已超过 1,500 人，遍布 18 个国家，过去一年推出了 100 多项新产品能力。此前 2025–2026 年第三方报道提到，公司 ARR 约为 $150
              million；若 $12 billion 估值是合理基准，隐含营收倍数约 80x。即使对一线安全软件而言，这一倍数也不低，因此增长质量与估值同样重要。


              估值持续上行之际，关键在于 Cyera 能否以相同节奏把扩张资金转化为可持续的 ARR、客户留存和更深的产品能力。公开证据支持其增长势头，但经审计的经营数据仍不完整。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO012
      - number: '1.4'
        title: 发展里程碑与当前尽调缺口
        blocks:
          - type: paragraph
            body: >-
              2024–2026 年间，Cyera 从 DSPM 专业厂商迅速转向平台型厂商。公司 2024 年收购 Trail Security，拓展到 AI 安全和 DLP；2025 和 2026
              年又持续增加功能、深化合作。近期公开材料点名 Paramount、Chipotle、Valvoline 和 AT&T 等客户，支持公司已进入大型企业部署、而非只停留在小规模试点的判断。


              但关键尽调缺口仍是晚期非上市公司常见的几项：经审计的
              ARR、客户队列留存、股权结构中的优先股堆叠（清算优先权安排），以及披露客户中有多少带来收入、有多少仍属于更广义的试点或模块搭售。这些缺口不否定增长逻辑，却让估值难以精确测算。


              Cyera 的公开增长信号很强，但信息不对称也高。对这类公司，更合适的做法通常是持续跟踪，而不是急于下定论。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
