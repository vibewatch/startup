  name: Cyera
chapter:
  number: 8
  title: Valuation
  summary: Cyera looks like a strong company at an expensive price. The bull case is real product momentum and a broadening
    trust-layer platform; the bear case is that the public ARR evidence, the valuation multiple, and the lack of audited financials
    make the current entry point hard to underwrite with margin of safety.
sections:
- id: val-thesis
  title: Investment Thesis
  body: 'The bull case for Cyera is straightforward: the company sits in a real, fast-growing category, it has named enterprise
    customers, and it has repeatedly used capital to expand from DSPM into a broader trust layer for data, DLP, and AI governance.
    If the company keeps turning one data map into multiple workflows, then revenue can keep compounding even if standalone
    DSPM becomes more crowded.


    The public evidence also supports genuine scale. Current reporting points to a valuation near $12 billion, ARR somewhere
    in the $70 million to $150 million range depending on the source, and a large enterprise customer base. That is not a
    fake company; it is a real platform with real traction.


    But the thesis is only attractive if you believe the company can keep converting growth capital into durable ARR without
    a major slowdown in the next 12 to 24 months.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
- id: val-counter
  title: Anti-Thesis and Valuation Stance
  body: 'The anti-thesis is that the valuation is already rich. Even if you use the high end of the public ARR range, the
    implied revenue multiple is still around 80x at $12 billion, and some public estimates imply an even higher multiple.
    That leaves very little room for execution misses, bundle pressure, or slower expansion.


    The company also remains opaque on the financial inputs that matter most: gross margin, NRR, burn, and concentration.
    Those omissions do not mean the business is weak, but they do mean the current valuation is being underwritten with meaningful
    uncertainty.


    On balance, the price looks expensive rather than attractive. The company can still be worth following closely, but the
    current entry point does not leave a lot of margin of safety.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV002
- id: val-scenarios
  title: Scenarios, Recommendation, and Exit Readiness
  body: 'A reasonable bull case assumes the company keeps growing ARR, expands into AI governance, and proves that the trust-layer
    platform can win multiple budgets inside the same customer. A base case assumes growth stays strong but the market compresses
    the multiple as the company matures. A bear case assumes bundled competition and valuation compression hit at the same
    time.


    That leads to a conservative recommendation: keep monitoring, but do not assume the current valuation leaves much room
    for error. The company deserves continued diligence because the market is real and the product is credible. It does not
    yet deserve a "buy anything at any price" stance because the financial disclosure gap is still too wide.


    Exit readiness is therefore a second-order issue. The company may eventually be IPO-ready, but the current public evidence
    is better suited to a track / research-more posture than a definitive underwriting call.'
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  tableRefs:
  - TV003
  figureRefs:
  - FV001
