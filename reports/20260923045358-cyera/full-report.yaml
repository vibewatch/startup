chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Cyera describes itself as an AI security platform that protects data and secure AI workloads across cloud,
              SaaS, and on-premises estates. The company's public messaging now emphasizes a broader trust-layer thesis:
              discover sensitive data, understand who and what can access it, and enforce controls across DSPM, DLP, AI
              security, and identity-aware workflows. Public sources in 2026 describe the company as founder-led, with
              Yotam Segev as CEO and Tamar Bar-Ilan as CTO, and place the operating base in New York with engineering
              presence in Israel.


              The business model remains enterprise subscription software. Public materials and third-party company
              profiles consistently describe deployment as agentless or lightweight-connector based, with pricing tied
              to deployment scope and module mix rather than a self-serve seat model. That matters because the product
              is sold into large, regulated enterprises where implementation depth, security review, and integration
              breadth drive ACV more than packaging simplicity.


              Cyera's current product surface is materially broader than a narrow DSPM point solution. The June 2026
              press release and related materials describe more than 100 new product capabilities shipped over the prior
              year, plus the company's move into DLP, AI governance, and agentic security. The result is a platform
              story, not a single-feature story, which supports cross-sell but also increases execution complexity.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The founder pair is central to Cyera's narrative and diligence profile. Yotam Segev is the public face of
              the company's fundraising and go-to-market story, while Tamar Bar-Ilan anchors the technical architecture
              and the AI/data-classification thesis. Recent public coverage also links the founders to Israel's Unit
              8200 and Talpiot talent pipeline, which continues to be a meaningful recruiting and credibility signal in
              cybersecurity.


              From a governance perspective, the company appears to have matured beyond a two-founder shop. Third-party
              coverage and company materials reference a broader executive bench and outside investors with operating
              experience, which helps reduce founder concentration risk at the margin. Still, the company's public
              identity remains tightly associated with the founders, so key-person exposure is real if either were to
              exit or become distracted during a period of fast platform expansion.


              The current diligence question is not whether the founders are credible; it is whether the company can
              keep scaling product surface, customer complexity, and partner integrations without weakening the simple
              story that won the first wave of enterprise buyers.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Funding, Valuation, and Scale
        blocks:
          - type: paragraph
            body: >-
              Cyera has continued to re-rate aggressively in 2026. The latest public coverage in September 2026
              describes a $400 million Goldman Sachs-led Series G extension and places total funding near $1.94 billion,
              while earlier June 2026 company and press coverage described a $600 million round at a $12 billion
              valuation and more than $2 billion of total funding. The public record therefore shows both growth and
              some inconsistency in reported capitalization totals, which should be treated as a diligence issue rather
              than a precision feature.


              Scale signals are also strong. Company messaging says Cyera has grown to more than 1,500 employees across
              18 countries and shipped more than 100 new product capabilities over the prior year. Earlier 2025–2026
              third-party coverage described the company at roughly $150 million in ARR, putting the implied revenue
              multiple around 80x if the $12 billion valuation is the right anchor. That is a premium multiple even for
              top-tier security software, so the quality of growth matters as much as the headline valuation.


              The core scaling question is whether Cyera can keep translating expansion capital into durable ARR,
              customer retention, and product depth at the same pace as its valuation step-ups. The public evidence is
              favorable on momentum, but still incomplete on audited economics.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO012
      - number: '1.4'
        title: Milestones and Current Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Cyera's 2024–2026 milestones show a rapid transition from DSPM specialist to platform vendor. The company
              acquired Trail Security in 2024, expanded into AI security and DLP, and then layered on more capabilities
              and partnerships in 2025 and 2026. The most recent public announcements also highlight customer logos such
              as Paramount, Chipotle, Valvoline, and AT&T, which support the thesis that the company is winning large
              enterprise deployments rather than small pilots.


              Even so, the most important diligence gaps remain the same ones private investors usually face at this
              stage: audited ARR, cohort-level retention, cap-table preference stack, and the degree to which reported
              customer counts reflect revenue-bearing deployments versus broader pilots or module attach. Those gaps do
              not negate the growth story, but they do limit how precisely one can underwrite the valuation.


              The result is a company with a strong public growth signal and a high information asymmetry burden. That
              combination usually supports continued monitoring rather than a fully saturated verdict.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO012
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Category Boundary and Buyer Problem
        blocks:
          - type: paragraph
            body: >-
              Cyera sits at the intersection of DSPM, DLP, and AI security. In practical terms, the category is about
              automatically discovering where sensitive data lives, classifying what it is, and deciding who or what may
              touch it. That is broader than classic DLP, which focuses on data-in-motion, and narrower than a full
              data-governance stack, which also includes cataloging, lineage, and business semantics.


              The immediate buyer problem is not abstract security theory; it is operational data sprawl. Large
              enterprises now run multicloud data stores, SaaS apps, and AI systems that copy or transform sensitive
              records at machine speed. The buyer who feels that pain most acutely is usually the CISO, but the economic
              sponsor can also be the CDO, privacy lead, or AI-platform owner when the use case is privacy, lineage, or
              AI access control rather than pure breach prevention.


              Cyera's own messaging, plus external market commentary, imply that the category is shifting from point
              solution to trust layer. That matters because it expands the spend pool: the same data map can support
              security posture, DLP triage, privacy operations, and AI governance.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing Lenses and Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              The cleanest public-size anchor in the current record is the broad global data-security market, which
              Cyera-linked sources describe as roughly $24 billion. That is not the same as DSPM TAM, but it is a useful
              upper bound because DSPM competes for the same security and compliance budgets as DLP, CASB, and adjacent
              cloud-data controls. Sacra's current estimate that Cyera reached about $150 million of ARR in May 2026
              suggests the company has already captured a meaningful, but still tiny, fraction of that spend pool.


              Demand is being pulled by three durable drivers: cloud data proliferation, regulatory burden, and AI-agent
              adoption. GDPR, CCPA, HIPAA, and the EU AI Act all increase the value of knowing where sensitive data sits
              and who can reach it. At the same time, the rise of copilots and autonomous agents makes access control a
              runtime problem, not just a one-time compliance exercise.


              The result is a market that can support premium pricing if the product reduces manual toil and audit risk
              quickly enough. However, the lack of a single audited DSPM-only market report means every TAM claim should
              be treated as directional, not precise.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Adoption Constraints and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior in this category is conservative for a reason: the product touches sensitive corporate data
              and often sits between security, compliance, and data engineering. That makes sales cycles longer than a
              typical point security tool. It also means the ROI case has to be specific. Buyers need to see either
              fewer breaches, fewer audit hours, fewer false positives, or a cleaner AI-control story before budgets
              unlock.


              Competition is equally important to the market structure. Hyperscaler-native tools and bundled platform
              vendors lower the friction of doing nothing, or of staying inside the existing cloud stack. That
              compresses price elasticity for mid-market buyers and pushes pure-play vendors like Cyera toward large
              enterprises where depth, cross-cloud coverage, and workflow automation matter more than the cheapest
              bundled option.


              The current demand pattern therefore favors enterprises with the worst data sprawl and the strongest
              regulatory exposure. Those customers are willing to pay for speed and accuracy, but they still expect
              proof that the platform will reduce incident risk and audit work quickly enough to justify another
              security line item.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Cyera is best understood as a pure-play DSPM and AI-security vendor, but the real competitive set is
              broader than the label suggests. Direct pure-play peers include BigID, while Varonis brings a mature
              data-security incumbent motion, Wiz and other CNAPP vendors bundle DSPM into a broader cloud-security
              platform, and Microsoft Purview / Google Cloud DLP give buyers native tools at low incremental cost.


              That means competitive evaluation is rarely just about feature parity. Buyers compare Cyera against a
              bundle, a legacy incumbent, and a make-vs-buy alternative at the same time. For Cyera, that is a good
              market structure if the company can maintain a clear depth advantage. It is a bad market structure if
              buyers decide that "good enough" capability from a bundled platform is enough to avoid another standalone
              purchase.


              The competitive question is therefore not whether Cyera is a real vendor. It is whether the company can
              keep the standalone DSPM category valuable enough to resist platform consolidation.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Differentiation, Switching Costs, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Cyera's differentiation story is centered on agentless deployment, AI-native classification, and the
              ability to turn a single sensitive-data map into multiple workflows. That matters because the product is
              not just a dashboard; it is a control plane. The more remediation, masking, and AI-governance work the
              customer attaches to that map, the stickier the platform becomes.


              Distribution matters almost as much as product depth. Cyera can benefit from ecosystem integrations and
              procurement channels, but the large platform players retain enormous bundle leverage. Microsoft can offer
              data-security controls inside an existing enterprise agreement; Wiz can attach DSPM to cloud-security
              spend; and other adjacent vendors can position themselves as an upgrade rather than a new category.


              So Cyera's moat is real, but it is conditional. It survives when the buyer values precision and breadth
              more than convenience and discounting.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing, Adverse Evidence, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing data are thin across the category, which is itself a competitive signal. When vendors do
              not publish prices, buyers infer value from deployment scope, not a simple list price. That favors complex
              enterprise sales motions but also makes it easier for bundles to compress standalone price points.


              The adverse evidence is mixed rather than catastrophic. User-review sites and third-party comparison pages
              show that Cyera is visible enough to generate customer commentary, but the broader category still has room
              for improvement in remediation depth and operational simplicity. Competitor content from Varonis,
              Nightfall, and other adjacent vendors also shows the usual pattern of rival vendors emphasizing their own
              strengths.


              Overall, Cyera is competing in a market that is still young enough for product leadership to matter, but
              mature enough that distribution, procurement simplicity, and bundled economics can still win deals.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Cyera sells enterprise subscriptions, not self-serve seats. Public materials describe a scope-based
              pricing model tied to deployment footprint, data volume, environments connected, and module mix. That is
              standard for complex security software: customers buy a platform first, then expand into DLP, AI
              governance, or adjacent workflow modules once the base classification layer is installed.


              This matters because the company's reported growth is not just logo growth; it is also expansion revenue
              potential. A data map created for DSPM can be monetized again through DLP, privacy operations, agent
              governance, and other trust-layer features. That makes Cyera more analogous to a platform vendor than to a
              single-purpose tool.


              The tradeoff is that enterprise monetization is harder to model from the outside. Pricing is negotiated,
              not published, so public ARR estimates are useful but not definitive. The financial question is therefore
              not whether Cyera can charge a premium, but whether its pricing power survives platform bundling and long
              procurement cycles.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Revenue Scale and Capitalization
        blocks:
          - type: paragraph
            body: >-
              The current public range for Cyera's ARR is wide. Sacra estimates about $150 million of ARR in May 2026,
              while other public company-data pages and articles still cite lower 2026 figures around $70 million. That
              spread matters: at a $12 billion valuation, the implied revenue multiple ranges from roughly 80x to well
              over 150x depending on which figure proves closest to the mark.


              On the capital side, the company has continued to raise aggressively. Public coverage in June 2026
              described a $600 million round at a $12 billion valuation, and September 2026 coverage described a $400
              million Goldman Sachs-led extension, with total funding now near $1.94 billion or slightly above depending
              on the source. The capital base is clearly large enough to fund continued growth, but the public record
              still leaves ambiguity about the exact latest round structure and total proceeds.


              For diligence, the key is not the headline amount alone. It is whether the company is funding efficient
              expansion or buying growth at a cost structure that will be hard to compress later.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Capital Adequacy, Margin, and Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              Cyera appears well-capitalized in the ordinary sense. Public sources point to 1,500-plus employees across
              18 countries, a large investor base, and an ARR base that is already substantial for a private
              cybersecurity company. But the missing pieces remain the same ones that matter for underwriting: gross
              margin, cohort retention, burn rate, and customer concentration.


              Enterprise security businesses often show strong gross margins eventually, but they can look worse than
              expected during a heavy growth phase because field sales, support, and integration engineering eat into
              operating leverage. If Cyera is carrying a large services burden or using capital to subsidize deployment
              complexity, its quality of growth may be weaker than the headline ARR suggests.


              The financial base case is therefore constructive but not fully underwritten. The company looks capable of
              supporting another growth cycle; it is not yet fully transparent enough to know how much dilution,
              preference overhang, or spending inefficiency is embedded in the latest financing stack.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Use Cases
        blocks:
          - type: paragraph
            body: >-
              Cyera's product surface starts with the familiar DSPM workflow: connect to data stores, discover what
              sensitive data exists, classify it, and prioritize the highest-risk exposures. The company has broadened
              that base into DLP, AI governance, privacy operations, and agentic controls. In other words, the product
              is no longer just about finding data; it is about controlling how that data moves through modern
              enterprise systems.


              This matters because the customer value proposition is no longer a single job-to-be-done. A security team
              can justify Cyera for posture management, but the same underlying graph can also support privacy
              workflows, browser-level AI governance, and enforcement decisions around non-human identities. That
              creates a better cross-sell story and a larger addressable workflow surface.


              The downside is obvious: the more product lines the company attaches to the core map, the harder it
              becomes to keep the story coherent. Cyera is still easiest to understand when the buyer sees the discovery
              engine first and the adjacent modules second.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
      - number: '5.2'
        title: Architecture, Deployment, and Integration Model
        blocks:
          - type: paragraph
            body: >-
              Cyera's architecture is designed to be agentless or light-agent, with API-level connections to cloud
              environments and lightweight connectors where needed. That lowers deployment friction and makes the
              product easier to pilot in large enterprises than older agent-heavy security tools. The architecture also
              appears intentionally integration-friendly: the platform plugs into SIEM, identity, ticketing, and
              security ecosystems rather than demanding a rip-and-replace rollout.


              That integration pattern is a strength and a weakness. It makes Cyera additive to existing spend, which
              helps sales, but it also means the product inherits the dependency risk of other enterprise systems and
              cloud APIs. If the surrounding stack changes, the Cyera graph and workflow layer need to keep pace.


              Overall, the architecture looks like a well-factored control plane for large enterprise security, not a
              simple widget. That supports enterprise pricing, but it also creates more surface area to maintain.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
      - number: '5.3'
        title: Differentiation, Security, and Roadmap Risk
        blocks:
          - type: paragraph
            body: >-
              Cyera's differentiator is the combination of speed, precision, and breadth. The company claims
              high-precision classification across a broad set of data types, and current product materials show it
              extending that map into AI-specific controls and enforcement workflows. That is a stronger story than
              "just another DSPM dashboard" because it ties the data graph to real operational decisions.


              The security posture story is also important. Cyera publishes security-focused content such as its
              Salesloft breach response and research writeups, which helps reinforce credibility with security buyers.
              But those materials also underscore the category risk: a vendor that sits inside the sensitive-data path
              must earn trust continuously, not just once.


              The roadmap risk is platform sprawl. If the company tries to ship too many adjacent modules too quickly,
              it could dilute the core value proposition, slow the implementation motion, and make support harder.
              Product breadth is valuable only if the underlying classification engine remains the clearest reason to
              buy.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buying Motion
        blocks:
          - type: paragraph
            body: >-
              Cyera sells into large enterprises, not casual departmental buyers. The most natural fit is a regulated
              enterprise with a sizable cloud footprint: financial services, healthcare, technology, media, retail, and
              telecom. In those accounts the buyer is usually a security executive, but the workflow also pulls in
              privacy, data-governance, and AI-platform stakeholders.


              The reason is simple: the product sits in the middle of multiple budget owners. A CISO may approve the
              security layer, but privacy and data teams care about mapping and governance, while AI teams care about
              what agents can reach. That multi-sponsor motion is one reason the company can sell larger deals than a
              narrow point product.


              The challenge is that multi-sponsor motions are slow and potentially fragile. If one stakeholder loses
              urgency, the deal can slip. That makes customer quality just as important as customer count.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption Trajectory and Named Proof
        blocks:
          - type: paragraph
            body: >-
              The public adoption signal is strong. Company and press coverage points to a fast-growing customer base, a
              large Fortune 500 footprint, and named enterprise logos including AT&T, Paramount, Chipotle, and
              Valvoline. Those logos matter because they suggest that the product is moving beyond pilot language into
              production deployment language.


              Adoption is also reinforced by the surrounding ecosystem. Integration and partner coverage show that Cyera
              can slot into existing enterprise workflows instead of requiring an entirely new operating model. That
              usually increases the odds that a customer will expand after the first use case succeeds.


              Still, the public proof is mostly logo- and quote-driven. We do not yet have an audited customer-count
              schedule or cohort chart, so the scale of rollouts remains partly inferential.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU011
      - number: '6.3'
        title: Retention, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Cyera's expansion story is plausible because one sensitive-data map can support multiple workflows:
              remediation, masking, AI governance, and investigations. That is the right setup for land-and-expand
              economics. But the public record does not show actual NRR, GRR, or customer concentration, so the
              durability of those economics remains a diligence question rather than a verified fact.


              The most important unresolved issue is concentration. If the top customers are a small group of very large
              enterprises, a single renewal slip can distort the ARR trajectory. If the company is broadening across
              many enterprises, that risk is lower. The public evidence is not sufficient to answer the question cleanly
              today.


              So the current customer verdict is positive but incomplete: strong logo quality, believable expansion
              potential, and insufficient public data to quantify churn or concentration risk.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
