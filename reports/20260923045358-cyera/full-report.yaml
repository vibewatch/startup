companyProfile:
  summary: >-
    Cyera is a late-stage private cybersecurity company building an AI-native, agentless data security platform. The
    company maps sensitive data across cloud, SaaS, and AI environments, then uses that data graph to support
    remediation, DLP, governance, and AI security workflows. Public reporting in 2026 points to roughly $12 billion in
    valuation, strong enterprise traction, and a business that has expanded beyond a narrow DSPM niche into a broader
    trust-layer platform.
  foundedDate: '2021-01-01'
  founders:
    - name: Yotam Segev
      role: CEO and Co-Founder
      background: Security and intelligence background; leads strategy and go-to-market.
      claimRefs:
        - CO002
    - name: Tamar Bar-Ilan
      role: CTO and Co-Founder
      background: Security and engineering background; leads product and technical architecture.
      claimRefs:
        - CO002
  foundingLocation: Tel Aviv, Israel
  headquarters: New York, NY
  customerFocus: Large enterprises in regulated and data-intensive sectors
  businessModel: Enterprise SaaS subscriptions and expansion revenue across data security, DLP, and AI governance
  stage: late-stage private
