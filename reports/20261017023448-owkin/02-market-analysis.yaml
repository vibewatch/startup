callouts:
  - calloutType: strength
    title: High-end buyer validation is real
    body: >-
      Sanofi's strategic investment plus official claims of relationships with 8 of the top 10
      pharma companies indicate that Owkin has already cleared the trust threshold for some of
      the hardest-to-win buyers in biopharma.
    claimRefs: [CM006, CM007]
  - calloutType: risk
    title: Practical SOM is likely much smaller than the narrative market
    body: >-
      Premium enterprise delivery, opaque pricing, and infrastructure-heavy onboarding imply that
      Owkin's realistic near-term market is concentrated in well-funded institutions, even if the
      broader "AI for biology" narrative sounds much larger.
    claimRefs: [CM009, CM010, CM012]
