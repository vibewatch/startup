      - number: '3.2'
        title: Differentiation and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Owkin's retained 2026 material is unusually specific about what it wants buyers to use the platform
              for.       The videos page shows K Pro and adjacent workflows being marketed around competitive
              intelligence, trial-maturity forecasting, drug-positioning strategy, patent-gap review, and target or
              indication prioritization. The January 2026 launch note pushes the same thesis at a platform level: Owkin
              says its agents are trained on curated multimodal patient data from more than 800 hospitals, can identify
              biomarkers and guide trial decisions, and can be embedded in existing healthcare-industry workflows. Taken
              together, the current public story is less "general AI for healthcare" and more "domain-specific research
              agents for biopharma teams that already have hard workflow questions to answer." That is a sharper buyer
              proposition than a generic copilot, especially when combined with claims of privacy-preserving data access
              that many buyers cannot replicate quickly on their own.
