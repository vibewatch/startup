          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is clear. Before moving from track to buy, an investor should require fresh primary
              financing terms or a priced secondary mark, audited commercialization evidence, and clearer concentration
              economics on the flagship enterprise accounts that justify premium pricing. The downside case is also easy
              to specify: if the next financing lands flat to down versus the 2021 benchmark, if the premium
              implementation model fails to scale beyond marquee partners, or if the company cannot reconcile its public
              revenue and capital-history discrepancies, then today's stretched stance hardens into an avoid decision.
              Conversely, a disclosed new round, audited recurring-revenue evidence, and repeat expansions with large
              pharma customers would make the current anti-thesis materially weaker and justify a more constructive
              price discussion.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence recommendation
            body: >-
              Track Owkin rather than buying the story today: strategic validation improved in 2026, but the public
              record still does not provide a fresh priced round or a clean audited commercialization baseline.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
