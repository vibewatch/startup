chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform framing
        blocks:
          - type: paragraph
            body: >-
              Owkin's current self-description has moved beyond a general federated-learning story into an "agentic AI
              company" narrative centered on K Pro, its AI scientist for biopharma research teams. Across official
              surfaces, that positioning is anchored on access to a large multimodal patient-data network: the homepage
              says Owkin learns from 25 million patients across 840 hospitals, while the January 2026 launch release
              describes more than 800 hospitals collected over a decade. The directional message is consistent even if
              the precise figures are rounded differently by surface. Official footprint evidence is also concrete
              enough for later chapters to reuse: Owkin names offices in Boston, New York, London, Paris, Nantes,
              Geneva, and Berlin, which supports the view of a transatlantic operating footprint rather than a
              single-site startup.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership, funding, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Founder dependence remains high. Owkin says it was founded in 2016 by Thomas Clozel and Gilles Wainrib,
              and its own about-us page still foregrounds the pair rather than a broad executive bench. Secondary
              evidence adds useful but incomplete governance context: Intuition Labs lists both the investor roster and
              a seven-person board lineup, which helps establish strategic backers, but the assigned pool still does not
              show committee structure, voting rights, or succession planning. Funding is directionally clear rather
              than perfectly precise. Owkin's own 2026 materials cite roughly $300 million raised, and AI Market Watch
              still ties the company's November 2021 unicorn milestone to Sanofi's strategic investment. That is enough
              to establish strategic validation, but not enough to underwrite a fresh valuation or ownership-control
              view.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO016
