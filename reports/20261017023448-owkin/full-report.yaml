  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The current market boundary is narrower than "healthcare AI" or general-purpose life sciences software.
              Across official and third-party descriptions, Owkin is positioned at the intersection of AI-driven drug
              discovery, clinical research optimization, digital pathology, biomarker discovery, and related biopharma
              decision support. That means the included spend is enterprise R&D, translational research, pathology
              analytics, and privacy-sensitive data collaboration rather than front-office hospital IT, generic office
              copilots, or consumer health software. The main status-quo substitutes are siloed in-house analysis,
              fragmented point tools across the drug-development workflow, and centralized-data approaches that require
              data movement before model training. Owkin's repeated federated-learning framing matters because it
              defines the category against those centralized alternatives instead of against generic AI tooling.
            claimRefs:
              - CM001
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
      - number: '2.2'
        title: Public sizing lenses support access depth, not a single market-size number
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not isolate a rigorous public TAM, SAM, and SOM in one comparable unit. Instead,
              they provide constrained adoption lenses: relationship depth with large pharma, counts of hospitals or
              healthcare centers connected to the data network, patient counts inside that network, and financial
              commitments from strategic buyers and investors. Those lenses are valuable because they show where Owkin
              can realistically win budgets and where its data advantage may compound, but they are not additive and
              they do not share a single denominator. In particular, published scale figures mix "over 100 leading
              academic hospitals," "more than 800 hospitals," "a network of 104 healthcare centers," "3M characterised
              patients," and separate financing figures such as Sanofi's strategic deal or Forge's 2022 post-money
              valuation proxy. That is enough to demonstrate meaningful enterprise access and data density, but not
              enough to claim a precise SAM/SOM without management or customer-level revenue segmentation.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
      - number: '2.3'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The most credible buyer set is concentrated in large organizations that already carry expensive R&D,
              translational-medicine, pathology, and clinical-development budgets. The retained evidence repeatedly
              points to pharmaceutical companies, biopharma research teams, clinical research organizations, cancer
              centers, and hospital networks as the operational context. Within those accounts, the day-to-day users
              appear to be translational researchers, pathologists, clinical-development teams, and strategy or
              portfolio groups that need target-identification, patient-stratification, biomarker, or trial-design
              outputs. Hospitals matter in a second role as data partners and deployment environments: they supply
              protected multimodal data, validate workflows, and in some cases host tumor board deployments, but the
              most visible commercial willingness-to-pay signals still come from large pharma and strategic
              collaboration budgets.
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: Adoption drivers, friction points, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers are privacy-preserving access to previously siloed multimodal patient data, workflow
              coverage across the drug-development lifecycle, and validation from top-tier pharma relationships. Those
              attributes can matter disproportionately in oncology, translational research, and clinical-development
              workflows where data scarcity, compliance, and decision quality directly affect time-to-clinic. The same
              evidence also points to real adoption friction. Independent profiles describe a premium, opaque enterprise
              sales motion, while Reuters and SectorPunk both suggest that local infrastructure, privacy-preserving
              deployment, and institution-by-institution onboarding are not lightweight. That mix likely narrows Owkin's
              practical serviceable market toward well-funded institutions and away from smaller biotechs or
              grant-funded labs. The remaining diligence burden is to convert these adoption signals into normalized
              spend bands by segment, geography, workflow, and pricing model rather than treating one broad market
              narrative as a valuation fact.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High-end buyer validation is real
            body: >-
              Sanofi's strategic investment plus official claims of relationships with 8 of the top 10 pharma companies
              indicate that Owkin has already cleared the trust threshold for some of the hardest-to-win buyers in
              biopharma.
            calloutType: strength
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: Practical SOM is likely much smaller than the narrative market
            body: >-
              Premium enterprise delivery, opaque pricing, and infrastructure-heavy onboarding imply that Owkin's
              realistic near-term market is concentrated in well-funded institutions, even if the broader "AI for
              biology" narrative sounds much larger.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and reference set
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports treating Owkin's competition as a layered landscape rather than a single
              peer set. Two independent profile pages repeatedly place Owkin beside Exscientia, Recursion, Tempus,
              Insitro, ConcertAI, XtalPi, and Verge Genomics, which is enough to establish a directional AI-biotech and
              clinical-data peer group even though those profiles are not strong enough to settle feature parity or
              current scale. The broader substitute set is wider than named AI-native peers: Owkin's own product and
              launch language describes agents that work inside pharmaceutical workflows and automate research tasks, so
              the practical alternatives also include in-house pharma data-science teams, external service providers,
              and the status quo of slower manual discovery and trial-analysis workflows. That breadth matters because
              Owkin does not only need to beat a handful of venture-backed AI platforms; it also has to displace
              existing processes that large biopharma buyers already control.
            claimRefs:
