            title: Strategic validation is real
            body: >-
              Owkin's public customer proof is better than a simple logo wall because the assigned pool ties several
              names to concrete workflows, including pharma licensing, clinical-trial decision support, hospital
              testing, and diagnostics usage.
            calloutType: strength
            claimRefs:
