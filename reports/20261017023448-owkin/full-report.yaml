      - number: '6.2'
        title: Named adoption proof and 2026 expansion signals
        blocks:
          - type: paragraph
            body: >-
              Owkin has better public logo-to-use-case translation than many private AI-biotech companies. The assigned
              pool surfaces concrete 2026 adoption markers: AllHealthTech says AstraZeneca signed a three-year K Pro
              licence in May, Sanofi a five-year licence in June, and Boehringer Ingelheim plus Servier signed in
              September; the same article says Gustave Roussy began testing K Pro inside hospital clinical and research
              workflows in July. The official January 2026 launch release adds scale context by claiming data collected
              from more than 800 hospitals over a decade and partnerships with eight of the top 10 global pharma
              companies. Waiv extends that proof into clinical testing: Owkin said the spinout already had tests in use
              in clinical settings and an MSD collaboration dating to 2023. These are meaningful signals of strategic
              adoption, even if they still emphasize marquee accounts and platform validation more than disclosed
              recurring usage.
            claimRefs:
              - CU003
