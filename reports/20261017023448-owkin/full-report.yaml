      - number: '5.3'
        title: Differentiation, controls, and product risk
        blocks:
          - type: paragraph
            body: >-
              Owkin's clearest differentiation claim is not generic 'AI for drug discovery' branding; it is the
              combination of privacy-preserving federation, hospital-scale multimodal data access, and specialized agent
              delivery for clinical and pathology workflows. That is more concrete than many AI-biotech stories, and
              independent profiles echo the same moat. Still, the diligence burden remains high. The strongest public
              performance claim in the assigned pool is Pathology Explorer's 23.7% classification-accuracy improvement
              with much smaller models, but the underlying evaluation methodology is not disclosed here. Independent
              review evidence also suggests implementation friction: federated deployments can require partner IT
              coordination and longer onboarding. Finally, trust and quality controls are under-documented in the
              assigned evidence, so enterprise readiness cannot be underwritten from these sources alone.
