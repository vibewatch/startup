  - id: FM001
    title: Market-access proxy pyramid
    type: pyramid
    summary: >-
      Because public sources do not provide a comparable dollar TAM/SAM/SOM stack, the most defensible numeric pyramid
      is a set of non-additive access and data-scale proxies.
    data:
      items:
        - label: Characterised patients
          value: 3000000
          unit: patients
        - label: Vision-page hospital-network institutions
          value: 840
          unit: institutions
        - label: Launch-release hospitals
          value: 800
          unit: hospitals
        - label: Launch-release healthcare centers
          value: 104
          unit: centers
        - label: Leading academic hospitals
          value: 100
          unit: hospitals
        - label: Top-10 pharma relationships
          value: 8
          unit: companies
    approximationNotes: >-
      This is not an additive TAM/SAM/SOM model. The layers mix patient, institution, hospital, and buyer-count proxies
      taken directly from retained sources because no public source in the assigned pool publishes a comparable
      segment-by-segment dollar stack.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM012
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinally, Owkin looks strongest where workflow depth and proprietary patient-data access matter together;
      substitute pressure rises as workflow ownership or data access becomes more generic.
    data:
      xAxis:
        label: Workflow-specific depth in biopharma R&D (ordinal, 1-5)
        min: 1
        max: 5
      yAxis:
        label: Proprietary data or privacy moat in retained evidence (ordinal, 1-5)
        min: 1
        max: 5
      points:
        - label: Owkin
          x: 5
          'y': 5
          note: >-
            Only retained candidate with direct evidence of federated multimodal patient-data claims plus
            competitive-intelligence and positioning demos.
        - label: AI-native discovery peers
          x: 4
          'y': 2
          note: >-
            Exscientia and CytoReason are shown winning large-pharma work, but assigned sources do not document an
            Owkin-like hospital-data moat.
        - label: Clinical-data adjacents
          x: 3
          'y': 4
          note: >-
            Tempus and ConcertAI recur as peers in profile pages, implying a data-rich adjacency even though detailed
            product overlap is not retained.
        - label: Internal pharma build
          x: 3
          'y': 3
          note: >-
            Existing internal teams already own buyer workflow context and can keep data inside the enterprise
            perimeter.
        - label: Manual or CRO workflow
          x: 2
          'y': 1
          note: >-
            Status-quo research and trial-analysis work requires no platform adoption, but it lacks the automation Owkin
            markets.
        - label: Point-solution diagnostics tools
          x: 2
          'y': 3
          note: >-
            Can overlap on single workflows, but retained evidence places Owkin around broader multi-step research
            agents.
    approximationNotes: >-
      Ordinal scores reflect retained-source evidence only: 5 means strongest support in the assigned pool and 1 means
      weakest. Non-Owkin points are directional because the assigned pool lacks primary 2026 peer product and pricing
      documentation.
    claimRefs:
      - CP002
      - CP003
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
      - CP013
  - id: FI001
    title: Revenue model bridge from proprietary data access to monetization
    type: flow
    summary: Owkin's public evidence supports a partnership-led revenue bridge, but not a clean software-only margin model.
    data:
      nodes:
        - id: data-network
          label: Multimodal patient data network
          value: 3M patients / 800+ hospitals
          context: Official materials emphasize large hospital-linked data access as the core commercial input.
        - id: ai-platform
          label: K Pro and agentic infrastructure
          value: API-driven + MCP-compatible
          context: Owkin packages models, tools, and biomedical skills into deployable research agents.
        - id: workflow-use-cases
          label: Biopharma and clinical workflows
          value: Discovery, biomarkers, trial decisions
          context: Public sources repeatedly position the product inside research and development decision workflows.
        - id: enterprise-deals
          label: Strategic partnerships and licenses
          value: Sanofi, BMS, AstraZeneca
          context: Commercial entry appears to be enterprise alliances and multiyear licenses rather than self-serve adoption.
        - id: revenue-capture
          label: Revenue capture
          value: Collaboration + license + services
          context: Public sources evidence several monetization mechanisms, but not the recurring versus non-recurring mix.
        - id: cost-base
          label: Margin constraints
          value: Wet lab + compute + onboarding
          context: Wet-lab validation, compute intensity, and deployment complexity likely constrain software-like margins.
      edges:
        - from: data-network
          to: ai-platform
          label: Proprietary input
        - from: ai-platform
          to: workflow-use-cases
          label: Productization
        - from: workflow-use-cases
          to: enterprise-deals
          label: Commercial packaging
        - from: enterprise-deals
          to: revenue-capture
          label: Monetization
        - from: revenue-capture
          to: cost-base
          label: Margin conversion
    approximationNotes: >-
      This is a revenue-mechanism diagram, not a quantified conversion funnel; public sources do not disclose
      stage-by-stage take rates or gross-profit percentages.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
      - CI012
  - id: FE001
    title: Owkin product architecture map
    type: stack
    summary: >-
      Public sources depict Owkin as a layered system that starts with federated multimodal data access, runs through
      biological reasoning and agent layers, and ends in embedded research/diagnostic workflows.
    data:
      layers:
        - label: Partner data network
          detail: Hospital and research-center relationships supply multimodal patient data.
          modules:
            - 800+ hospitals and research centers
            - Multimodal patient datasets
            - MOSAIC spatial multi-omics asset
          outputs:
            - AI-ready clinical and pathology evidence
        - label: Privacy-preserving federation
          detail: Distributed data-access/training layer keeps raw patient data decentralized.
          modules:
            - Federated learning framework
            - Owkin Connect
            - Substra
          outputs:
            - Cross-institution model training
        - label: Biological reasoning core
          detail: Owkin combines biological LLMs, prior AI tooling, and multimodal data into the K Pro reasoning layer.
          modules:
            - K Pro
            - Biological LLMs
            - Advanced AI skills
          outputs:
            - Hypothesis generation
            - Program assessment
        - label: Specialized agents
          detail: Task-specific agents sit on top of the reasoning layer.
          modules:
            - Pathology Explorer
            - Digital pathology agents
          outputs:
            - Cell-type and biomarker analysis
        - label: Enterprise delivery
          detail: Deployment is presented as workflow embedding rather than only a closed Owkin interface.
          modules:
            - API-driven delivery
            - MCP compatibility
            - Anthropic Claude HCLS channel
          outputs:
            - Embedded customer workflows
        - label: Commercial applications
          detail: Owkin surfaces value through drug-discovery, trial, and diagnostic products.
          modules:
            - Drug-discovery support
            - Clinical-trial decision support
            - AI diagnostics / digital pathology
          outputs:
            - Biopharma and pathology use cases
    approximationNotes: >-
      Public sources do not expose every internal service boundary, so the figure groups components at the
      product-surface level.
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Owkin's customer journey starts with privileged data and workflow access, converts that advantage into biopharma
      decision tools, and tries to expand through validation, diagnostics, and additional strategic accounts.
    data:
      nodes:
        - id: j1
          label: Data and validation access
          detail: >-
            Academic hospitals and research centers contribute multimodal data, validation environments, and scientific
            credibility to Owkin's ecosystem.
          tone: positive
        - id: j2
          label: Owkin curates the network
          detail: >-
            Owkin packages more than 800 hospitals of historical data sourcing and a 104-center network into a
            differentiated platform story.
          tone: neutral
        - id: j3
          label: Biopharma decision workflow
          detail: >-
            K Pro is sold into early portfolio, patient-population, biomarker, and clinical-trial decisions for pharma
            research teams.
          tone: positive
        - id: j4
          label: Named strategic accounts
          detail: >-
            Public 2026 proof centers on AstraZeneca, Sanofi, Boehringer Ingelheim, and Servier rather than on a broad
            long-tail account base.
          tone: positive
        - id: j5
          label: Clinical validation loop
          detail: >-
            Gustave Roussy testing and Waiv's in-clinic diagnostics usage extend proof from research support into
            real-world validation.
          tone: neutral
        - id: j6
          label: Expansion and friction
          detail: >-
            More data, more workflows, and more diagnostics can deepen accounts, but premium pricing and complex
            onboarding can slow expansion.
          tone: warning
    approximationNotes: >-
      Generic journey synthesized from retained public sources; individual accounts may enter through collaborations,
      data partnerships, or diagnostics rather than through a single linear path.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU007
      - CU008
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest-priority residual risks are data-rights/model-governance proof and commercial concentration, while
      interface maturity and frontier-model dependence matter but are less thesis-breaking on the current public record.
    data:
      columns:
        - label: Impact
          detail: Business damage if the risk crystallizes.
        - label: Residual severity
          detail: Net severity after the publicly visible mitigations in this pool.
      rows:
        - label: Data rights and model governance
          values:
            - label: Critical
              tone: critical
              note: Weak contractual or validation controls would directly threaten the moat.
            - label: Critical
              tone: critical
              note: Compliance cues exist, but IP, validation, bias, and drift proof still need direct review.
        - label: Large-account concentration
          values:
            - label: Critical
              tone: high
              note: A small number of strategic accounts could drive a large share of value.
            - label: High
              tone: high
              note: Big-pharma validation is real, but revenue share and renewals are undisclosed.
        - label: Hospital deployment friction
          values:
            - label: High
              tone: high
              note: Long implementations can slow bookings conversion and customer expansion.
            - label: High
              tone: high
              note: Six- to twelve-month cycles and partner IT coordination can delay value realization.
        - label: Financial opacity
          values:
            - label: High
              tone: critical
              note: Runway and hiring assumptions can be wrong if public figures are noisy.
            - label: High
              tone: critical
              note: Funding, team-size, and operating-scale disclosures conflict across public sources.
        - label: Frontier-model dependence
          values:
            - label: Moderate
              tone: warning
              note: Changes in model-partner economics or access could affect delivery.
            - label: Moderate
              tone: warning
              note: K Pro is described as reasoning through Claude plus Owkin models and tools.
        - label: Public interface maturity
          values:
            - label: Moderate
              tone: warning
              note: Missing public interfaces increase the odds of bespoke delivery work.
            - label: Moderate
              tone: warning
              note: NeuronFeed detected no public API, SDK, webhook, OAuth, or MCP surface.
    approximationNotes: >-
      Relative positioning is qualitative and derived from cited evidence on impact, likelihood, and mitigation
      maturity; it is not a quantitative scorecard.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic proof is real, but price opacity and enterprise adoption friction keep the current recommendation at
      track.
    data:
      nodes:
        - id: strategic-proof
          label: Strategic proof
          detail: >-
            Top-pharma partnerships, September 2026 capital commitments, and a multi-year Sanofi K Pro collaboration all
            support relevance.
          value: Positive
        - id: product-proof
          label: Product proof
          detail: >-
            Company claims on 800+ hospitals and Pathology Explorer performance indicate real technical ambition and
            some measurable evidence.
          value: Positive
        - id: commercial-signal
          label: Commercial signal
          detail: >-
            Premium pricing and the Waiv spin-out financing imply willingness to pay, but not yet a clean
            recurring-revenue benchmark.
          value: Mixed positive
        - id: price-opacity
          label: Price opacity
          detail: >-
            The last disclosed valuation anchor in retained sources remains the November 2021 $1B mark, with later
            rounds unpriced publicly.
          value: Negative
        - id: execution-friction
          label: Execution friction
          detail: >-
            High minimum project size and complex federated-learning deployments can slow adoption and stretch
            enterprise sales cycles.
          value: Negative
        - id: current-call
          label: Track / stretched / medium confidence
          detail: >-
            Fresh primary pricing evidence or audited commercialization proof is needed before the upside case can be
            underwritten.
          value: Current view
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
