      - number: '1.3'
        title: Momentum, conflicting public signals, and open points
        blocks:
          - type: paragraph
            body: >-
              The refresh shows real operating momentum. GlobalData records late-2023 partnership milestones, AI Market
              Watch lists 2024-2026 spinout and collaboration events, and the January 2026 company release marks a clear
              product expansion around agentic infrastructure and Anthropic integration. At the same time, basic
              operating descriptors remain noisier than they should be for a company at this maturity. GlobalData lists
              a New York City headquarters, while SectorPunk describes Owkin as Paris-based, and public headcount
              signals range from 300+ to 500+ employees. SectorPunk also flags premium pricing and implementation
              complexity as adoption constraints for smaller buyers. For the rest of this report, the safest reusable
              conclusion is that Owkin has strong strategic momentum but still-disputed scale and governance disclosure.
