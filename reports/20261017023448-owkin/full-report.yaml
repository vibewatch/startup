      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is relatively clear at the operating-model level. Official and independent
              descriptions converge on a federated data network spanning more than 800 hospitals and research centers,
              with multimodal patient data feeding Owkin's biological reasoning layer. K Pro is presented as the
              orchestration point, while Pathology Explorer is one concrete agent surfaced through Anthropic's
              healthcare product and through Owkin's own delivery stack. The launch materials also make a more
              enterprise-facing deployment claim than many AI-biotech pages do: Owkin says the agents are API-driven and
              MCP-compatible, so they can be embedded into existing healthcare workflows rather than used only inside a
              closed UI. What remains unclear is the technical depth behind those claims, because the assigned pool does
              not include substantive public API documentation, release notes, uptime history, or customer
              implementation references.
