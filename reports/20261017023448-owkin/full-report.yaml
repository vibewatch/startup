  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and price support
        blocks:
          - type: paragraph
            body: >-
              Owkin has real strategic proof points in 2026, but the public financing record is still incomplete for
              underwriting a fresh price. The strongest positive signals are company-claimed access to data from more
              than 800 hospitals, company-claimed partnerships with eight of the top 10 global pharma companies, and
              independent reporting that AstraZeneca, Sanofi, and Boehringer Ingelheim committed investment capital in
              September 2026. Those facts matter because they suggest Owkin remains strategically relevant to large
              biopharma buyers. The problem is that the freshest disclosed valuation anchor in retained sources is still
              the $1 billion November 2021 mark, while later 2023 and 2024 financing entries appear without disclosed
              pricing terms. A March 2026 $33 million spin-out financing for Waiv shows that Owkin can externalize
              assets, but it does not resolve the parent company's current entry price or cap-table overhang.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
