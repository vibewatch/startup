  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying center
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Owkin selling into a two-sided healthcare ecosystem rather than to a broad
              generic enterprise base. On the paying side, K Pro is marketed to biopharma teams that need support for
              early portfolio decisions, patient-population selection, biomarker work, and clinical-trial design. On the
              supply and validation side, Owkin depends on academic medical centers, hospital networks, and diagnostics
              workflows that generate the multimodal patient data and real-world validation loops used to differentiate
              its models. AI Market Watch also lists CROs and diagnostic laboratories as target customers, but the
              assigned pool gives much stronger proof for pharma buyers and hospital-linked users than for CRO-scale
              production deployments. The result is a customer mix with potentially high value per account, but little
              public disclosure on payer mix, seat counts, or revenue by buyer type.
