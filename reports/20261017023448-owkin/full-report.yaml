  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Data governance and model-governance risk are central, not peripheral
        blocks:
          - type: paragraph
            body: >-
              Owkin's edge is inseparable from privacy-preserving use of multimodal patient data, so governance risk
              sits at the center of the thesis rather than in a back-office compliance appendix. Official materials say
              the company has trained on data from more than 800 hospitals and from 3 million characterised patients
              across an 840-institution network, while PharmaAiAtlas documents ISO 27001 and GDPR but still says buyers
              need direct answers on output ownership, third-party use of proprietary data, validation studies, and bias
              or drift monitoring. That combination makes the regulatory/legal register high impact even without a
              disclosed public enforcement event in this pool. The kill criterion is clear: if management cannot produce
              account-level data-rights terms, validation packs, and monitoring controls suitable for pharma and
              hospital procurement, the underwriting case should tighten materially.
            claimRefs:
