      - number: '3.3'
        title: Distribution, switching costs, and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The strongest commercial proof in the retained pool comes from distribution and partnership signals, not
              transparent pricing. Independent coverage describes a multi-year Sanofi expansion for custom AI agents,
              while Owkin's January 2026 announcement highlights Anthropic integration and says agents are API-driven
              and MCP-compatible. That combination suggests the company is trying to win by becoming an embedded
              research layer inside existing pharma stacks rather than by forcing a rip-and- replace motion. The
              trade-off is that the same integration-led posture can cut both ways: buyers may adopt Owkin faster, but
              they can also multi-home and compare it against other AI vendors or internal teams without fully
              standardizing on one platform. Public pricing is the clearest blind spot. The assigned pool offers no
              buyer-verifiable list pricing, contract terms, or discount structure for K Pro or for the named peer set,
              so packaging comparisons remain directional rather than auditable.
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
