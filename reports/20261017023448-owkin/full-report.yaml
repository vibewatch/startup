              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Recommendation, scenarios, and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a price-sensitive **track** posture rather than a generic quality endorsement.
              Product and partner proof have improved: Owkin says its Pathology Explorer agent improves classification
              accuracy by 23.7% while using five times fewer parameters, and independent profiles cite a multi-year K
              Pro collaboration with Sanofi. Even so, public commercial baselines are too noisy for a clean
              comparable-based valuation. Independent secondary sources disagree materially on total capital raised and
              revenue/ARR proxies, and no retained source discloses a fresh post-2021 priced round. The scenario table
              should therefore be read as entry discipline around the last disclosed anchor, not as a false-precision
              intrinsic value model. Upside exists if commercialization proof converts into fresh price discovery, but
              paying ahead of that evidence would mean underwriting narrative momentum rather than verified valuation
              support.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
