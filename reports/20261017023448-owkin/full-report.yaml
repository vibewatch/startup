      - number: '7.2'
        title: Productization and deployment maturity still need proof beyond the agentic narrative
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports real product ambition, but it also flags meaningful execution burden. NeuronFeed
              says no public API, webhook, OAuth, SDK, or MCP surface was detected, while PharmaAiAtlas says pricing is
              partnership- or milestone-based and implementation can take six to twelve months. SectorPunk adds that
              federated-learning deployments across institutions can demand significant onboarding and IT coordination,
              extending time-to-value. Owkin's own vision page says K Pro reasons through frontier models including
              Claude, and Physician AI Tools describes a system that continuously learns from real-world data and
              clinical validation, so there is a visible mitigation path. Still, the public record in this pool
              emphasizes architecture and roadmap more than repeatable deployment metrics, uptime, or externally
              verified interface adoption. A thesis-break trigger would be multi-quarter rollout slippage without
              corresponding production reference wins.
            claimRefs:
