      - number: '7.3'
        title: Large-account concentration is validated, but public underwriting data remains noisy
        blocks:
          - type: paragraph
            body: >-
              Commercial validation is real: official materials say Owkin works with eight of the top ten global pharma
              companies and over one hundred leading academic hospitals, and independent profiles cite named
              relationships with Amgen, Actelion, Bristol Myers Squibb, and Sanofi. The same evidence also implies
              concentration and long enterprise cycles, because public pricing is partnership- or milestone-based,
              implementations can take months, and SectorPunk says the minimum project size exceeds $200,000 with
              premium hourly rates. Financial visibility is weaker than the partner roster: NeuronFeed tracks $255
              million raised, IntuitionLabs lists $655 million plus $50 million-$100 million of revenue, and Owkin's own
              January 2026 release says $300 million in funding. Until management reconciles funding, headcount,
              concentration, burn, and renewal data directly, logos should not be treated as a substitute for durable,
              underwritable revenue quality.
