      - number: '6.3'
        title: Durability evidence is thinner than expansion logic
        blocks:
          - type: paragraph
            body: >-
              Owkin's visible expansion loop is coherent: hospital-linked data and validation make the platform more
              useful for biopharma, new pharma programs create more workflows for K Pro, and Waiv gives the company a
              downstream clinical-testing path. IntuitionLabs and AI Market Watch both list additional names such as
              Bristol Myers Squibb, MSD, Amgen, Cleveland Clinic, Janssen, and Institut Curie, reinforcing the idea that
              Owkin can cross-sell across drug discovery, trial design, and diagnostics. But public durability evidence
              is still thin. The assigned pool does not disclose NRR, GRR, churn, average contract length, active-user
              counts, or customer concentration by revenue. Investors can see where expansion could happen, but not
              whether it is broad-based, renewing, or dependent on a few strategic accounts.
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.4'
        title: Procurement friction and concentration risk remain material
        blocks:
          - type: paragraph
            body: >-
              Independent review evidence highlights why Owkin's customer base may remain concentrated even if the
              reference list is strong. SectorPunk says the company carries a $200,000+ minimum project size and
              $150-$250 hourly rates, while its federated-learning deployments can require heavy IT coordination across
              partner institutions. Those frictions fit Owkin's strategy because large pharma and sophisticated cancer
              centers get the most value, but they also narrow the reachable buyer pool and can lengthen onboarding.
              Public customer proof is therefore real but curated: the market can underwrite strategic validation, not
              yet a diversified renewal machine. Until management discloses contract mix, top-customer exposure, and
              renewal performance, customer durability should be treated as a material diligence gap rather than
              inferred from logos alone.
            claimRefs:
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
