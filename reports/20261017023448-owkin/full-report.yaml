              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case is plausible, but the disconfirming evidence is real. A 2022 industry article already
              grouped Owkin with CytoReason and Exscientia as AI-driven drug-development companies attracting capital
              and pharma partnerships, meaning strategic collaboration alone is not unique proof of defensibility. The
              same article said medical regulators had not yet approved an AI-designed drug at that point, highlighting
              a category- level gap between platform promise and fully proven therapeutic outcomes. That historical
              caution still matters because the current retained 2026 pool is strongest on demos, launches, and profile
              pages, not on independent 2026 evidence showing repeatable outperformance versus named peers. As a result,
              the competitive verdict is favorable for differentiation narrative and enterprise relevance, but still
              short of proving that Owkin has locked in a uniquely durable lead over other AI-biotech vendors or over
              the incumbent habit of running these workflows internally.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Federated data plus workflow-specific demos is the best-supported edge
            body: >-
              In the assigned pool, Owkin is the only option with direct public evidence for competitive-intelligence
              and positioning workflows layered on top of a claimed 800-plus-hospital multimodal data network.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
          - type: callout
            title: Benchmarking is weaker than the moat narrative
            body: >-
              Recurrent peer naming and partnership overlap prove Owkin competes in a crowded AI-biotech field, but the
              pool does not provide primary 2026 peer docs or pricing terms strong enough to prove decisive superiority.
            calloutType: risk
            claimRefs:
