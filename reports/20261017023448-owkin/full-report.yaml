          Next financing is flat/down to the 2021 benchmark or commercialization proof fails to convert premium pricing
          into scalable deployments.
        - >-
          Entry should be below the stale anchor because the public record would then imply weaker monetization and a
          narrower exit set.
        - Adoption friction, customer concentration, or opaque terms overwhelm the strategic story.
        - Slower expansions, flat/down financing, or unresolved gaps on revenue, dilution, and concentration.
    notes: >-
      These are entry-discipline bands around the last disclosed public anchor, not a DCF or market-multiple model;
      retained sources do not provide enough clean financial inputs for narrower ranges.
    claimRefs:
      - CV007
      - CV008
      - CV009
