      - [Valuation, "> $1B at the November 2021 unicorn milestone", "2021-11", medium, "No fresher priced-round or secondary valuation is disclosed in the assigned pool."]
      - [Headquarters, "Conflicted: GlobalData lists New York City; SectorPunk describes Paris-based operations", "2026", low, "Need management or legal-entity confirmation of reporting HQ versus operating center."]
      - [Headcount, "Conflicted: 300+ / 350 / 500+ across retained public profiles", "2026", low, "Need current HRIS or management KPI pack."]
      - [Customer count, null, "2026", low, "Assigned sources name partners and users but do not disclose a current customer count."]
      - [Patient-data network, "25M patients across 840 hospitals; January 2026 release also says 800+ hospitals", "2026", medium, "Difference appears to be rounding, but exact current network size is still company-reported."]
