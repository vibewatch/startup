company:
  name: Owkin
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Owkin still presents as a founder-led AI-biotech platform with credible pharma validation,
    a large patient-data network, and visible 2026 product momentum around K Pro and agentic
    infrastructure. The refresh also preserves material uncertainty on exact headquarters
    framing, headcount, governance transparency, and any post-2021 valuation reset, so later
    chapters should treat scale claims as directional unless they are corroborated again.
sections:
  - id: identity-and-platform
    title: Identity and platform framing
    body: >-
      Owkin's current self-description has moved beyond a general federated-learning story into
      an "agentic AI company" narrative centered on K Pro, its AI scientist for biopharma
      research teams. Across official surfaces, that positioning is anchored on access to a
      large multimodal patient-data network: the homepage says Owkin learns from 25 million
      patients across 840 hospitals, while the January 2026 launch release describes more than
      800 hospitals collected over a decade. The directional message is consistent even if the
      precise figures are rounded differently by surface. Official footprint evidence is also
      concrete enough for later chapters to reuse: Owkin names offices in Boston, New York,
      London, Paris, Nantes, Geneva, and Berlin, which supports the view of a transatlantic
      operating footprint rather than a single-site startup.
    claimRefs: [CO001, CO003, CO004, CO013]
    tableRefs: [TO001]
  - id: leadership-funding-and-stakeholders
    title: Leadership, funding, and stakeholder map
    body: >-
      Founder dependence remains high. Owkin says it was founded in 2016 by Thomas Clozel and
      Gilles Wainrib, and its own about-us page still foregrounds the pair rather than a broad
      executive bench. Secondary evidence adds useful but incomplete governance context:
      Intuition Labs lists both the investor roster and a seven-person board lineup, which helps
      establish strategic backers, but the assigned pool still does not show committee
      structure, voting rights, or succession planning. Funding is directionally clear rather
      than perfectly precise. Owkin's own 2026 materials cite roughly $300 million raised, and
      AI Market Watch still ties the company's November 2021 unicorn milestone to Sanofi's
      strategic investment. That is enough to establish strategic validation, but not enough to
      underwrite a fresh valuation or ownership-control view.
    claimRefs: [CO002, CO005, CO006, CO007, CO016]
    tableRefs: [TO002, TO003]
  - id: momentum-conflicts-and-open-points
    title: Momentum, conflicting public signals, and open points
    body: >-
      The refresh shows real operating momentum. GlobalData records late-2023 partnership
      milestones, AI Market Watch lists 2024-2026 spinout and collaboration events, and the
      January 2026 company release marks a clear product expansion around agentic infrastructure
      and Anthropic integration. At the same time, basic operating descriptors remain noisier
      than they should be for a company at this maturity. GlobalData lists a New York City
      headquarters, while SectorPunk describes Owkin as Paris-based, and public headcount
      signals range from 300+ to 500+ employees. SectorPunk also flags premium pricing and
      implementation complexity as adoption constraints for smaller buyers. For the rest of this
      report, the safest reusable conclusion is that Owkin has strong strategic momentum but
      still-disputed scale and governance disclosure.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
