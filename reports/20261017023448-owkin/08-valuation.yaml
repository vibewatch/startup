    columns: [Item, Assessment, Decision implication]
    rows:
      - [Recommendation, Track, "Wait for fresh price discovery or audited commercialization proof before underwriting upside."]
      - [Confidence, Medium, "Strategic validation is real, but public revenue and capital-history baselines disagree materially."]
      - [Risk rating, High, "Premium pricing, onboarding friction, and sparse financing disclosure keep downside risk elevated."]
      - [Valuation stance, Stretched, "Public evidence does not justify paying above the last disclosed $1B anchor without new primary data."]
    notes: >-
      Public-evidence-only view; no current audited revenue, cash, dilution, or preference-stack disclosure was available in the assigned source pool.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Argument, What would change the view]
    rows:
      - [Thesis, "2026 strategic validation strengthened through top-pharma partnerships, new capital commitments, and a multi-year Sanofi K Pro collaboration.", "Upgrade if those relationships convert into disclosed repeat revenue or a fresh priced round."]
      - [Thesis, "Owkin's data moat and product proof remain differentiated, including company-claimed access to 800+ hospitals and improved Pathology Explorer performance.", "Upgrade if third-party commercial outcomes validate that technical proof beyond marquee counterparties."]
      - [Anti-thesis, "The freshest disclosed valuation anchor in retained sources is still the November 2021 $1B mark, while later financings are not priced publicly.", "Upgrade only after primary financing terms, a priced secondary, or audited revenue support a higher mark."]
      - [Anti-thesis, "Premium pricing and complex federated-learning deployments can slow adoption and compress the upside that a strategic story implies.", "Downgrade if implementation timelines lengthen or if premium pricing fails to produce repeat expansions."]
    notes: >-
      The table separates strategic proof from price support; positive product and partner evidence does not by itself justify a higher entry valuation.
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV009, CV011, CV012, CV013, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Fresh primary financing terms or audited commercialization data validate that 2026 strategic momentum is translating into repeatable enterprise adoption.", "Supportable only above the 2021 $1B anchor after new-money price discovery or audited revenue/retention evidence resets the reference point.", "Price is bid up before proof lands; premium implementation model still scales slower than expected.", "New priced round, audited revenue bridge, and multiple expanded pharma programs."]
      - [Base, "Strategic relevance stays intact but public evidence remains mostly milestone-based rather than valuation-based.", "Hold discipline around the last disclosed anchor and wait for clearer unit economics instead of underwriting multiple expansion today.", "Narrative momentum outruns the disclosed economics; stale pricing persists.", "More partnerships and launches, but still no clean price or audited commercialization disclosure."]
      - [Bear, "Next financing is flat/down to the 2021 benchmark or commercialization proof fails to convert premium pricing into scalable deployments.", "Entry should be below the stale anchor because the public record would then imply weaker monetization and a narrower exit set.", "Adoption friction, customer concentration, or opaque terms overwhelm the strategic story.", "Slower expansions, flat/down financing, or unresolved gaps on revenue, dilution, and concentration."]
    notes: >-
      These are entry-discipline bands around the last disclosed public anchor, not a DCF or market-multiple model; retained sources do not provide enough clean financial inputs for narrower ranges.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
