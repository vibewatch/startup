    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Enterprise implementations take longer than planned
        - PharmaAiAtlas says implementation can take 6-12 months.
        - High
        - High
        - Medium
        - Long deployments can slow bookings-to-revenue conversion and customer expansion.
        - No public cohort of deployment times, go-lives, or renewals in this pool.
      - - Federated deployments require heavy partner IT coordination
        - SectorPunk says onboarding effort and IT coordination can extend timelines.
        - High
        - High
        - Medium
        - Multi-site healthcare rollouts can slip even if model quality is strong.
        - No public rollout success-rate or implementation-resourcing data.
      - - Public interface maturity trails the agentic positioning
        - NeuronFeed detected no public API, webhook, OAuth, SDK, or MCP surface.
        - Medium
        - Medium
        - Low
        - Integration risk is higher if deployment depends on bespoke services.
        - No public architecture, SLA, or adoption metrics for external developer surfaces.
      - - Platform delivery depends partly on frontier-model partners
        - Owkin says K Pro reasons through Claude alongside Owkin models and tools.
        - Medium
        - Medium
        - Medium
        - Model-partner economics, access terms, or roadmap changes could affect delivery.
        - No public fallback-cost or substitution plan in the assigned sources.
    notes: >-
      The register separates execution friction from security incidents; this source pool does not
      document a confirmed outage or breach, so the residual exposure is delivery and integration
      risk rather than a recorded production failure.
    claimRefs: [CR005, CR006, CR007, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / concentration
      - Role
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Large-pharma commercial base
        - Eight of the top ten pharma companies; named partners include Sanofi and BMS
        - Revenue validation and strategic distribution
        - One or two strategic accounts delay, shrink, or do not renew
        - Critical
        - Strong marquee logos and multi-year relationships
        - Revenue concentration and renewal mix are not publicly disclosed
      - - Hospital-data network access
        - 800+ hospitals / 840 institutions claimed
        - Data access and model differentiation
        - Data-sharing frictions or site attrition reduce data advantage
        - High
        - Federated learning lowers the need to centralize raw data
        - Site-level retention, consent durability, and exclusivity are undisclosed
      - - Premium enterprise delivery model
        - $200K+ minimum projects, premium rates, 6-12 month implementations
        - Monetization and time-to-value
        - Sales cycles lengthen and accessible buyer pool narrows
        - High
        - Large-pharma buyer fit and milestone pricing align with complex programs
        - Smaller-buyer expansion and broad market elasticity remain unproven
      - - Capital and operating-capacity transparency
        - Public sources cite $255M, $300M, and $655M funding plus conflicting scale signals
        - Runway and execution capacity underwriting
        - Investors overestimate runway or team depth from noisy public data
        - High
        - Multiple public profiles confirm the company is funded and active
        - Current burn, net cash, board controls, and hiring capacity need direct diligence
    notes: >-
      Ordered by severity; the table treats partner logos as validation but not as proof of
      diversified, renewable revenue because contract mix and concentration are not disclosed.
    claimRefs: [CR006, CR008, CR009, CR010, CR011, CR012, CR013, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest-priority residual risks are data-rights/model-governance proof and commercial
      concentration, while interface maturity and frontier-model dependence matter but are less
      thesis-breaking on the current public record.
    data:
      columns:
        - label: Impact
          detail: Business damage if the risk crystallizes.
        - label: Residual severity
          detail: Net severity after the publicly visible mitigations in this pool.
      rows:
        - label: Data rights and model governance
          values:
            - label: Critical
              tone: critical
              note: Weak contractual or validation controls would directly threaten the moat.
            - label: Critical
              tone: critical
              note: Compliance cues exist, but IP, validation, bias, and drift proof still need direct review.
        - label: Large-account concentration
          values:
            - label: Critical
              tone: high
              note: A small number of strategic accounts could drive a large share of value.
            - label: High
              tone: high
              note: Big-pharma validation is real, but revenue share and renewals are undisclosed.
        - label: Hospital deployment friction
          values:
            - label: High
              tone: high
              note: Long implementations can slow bookings conversion and customer expansion.
            - label: High
              tone: high
              note: Six- to twelve-month cycles and partner IT coordination can delay value realization.
        - label: Financial opacity
          values:
            - label: High
              tone: critical
              note: Runway and hiring assumptions can be wrong if public figures are noisy.
            - label: High
              tone: critical
              note: Funding, team-size, and operating-scale disclosures conflict across public sources.
        - label: Frontier-model dependence
          values:
            - label: Moderate
              tone: warning
              note: Changes in model-partner economics or access could affect delivery.
            - label: Moderate
              tone: warning
              note: K Pro is described as reasoning through Claude plus Owkin models and tools.
        - label: Public interface maturity
          values:
            - label: Moderate
              tone: warning
              note: Missing public interfaces increase the odds of bespoke delivery work.
            - label: Moderate
              tone: warning
              note: NeuronFeed detected no public API, SDK, webhook, OAuth, or MCP surface.
    approximationNotes: >-
      Relative positioning is qualitative and derived from cited evidence on impact, likelihood,
      and mitigation maturity; it is not a quantitative scorecard.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR010, CR014, CR016]
callouts:
  - calloutType: risk
    title: Top kill criterion
    body: >-
      If Owkin cannot produce contractual proof on data rights, output ownership, validation
      evidence, and bias or drift governance that passes pharma and hospital procurement review,
      the core data-network thesis weakens materially.
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: risk
    title: Most material underwriting gap
    body: >-
      Public partner validation is meaningful, but conflicting public disclosures on funding,
      team size, and operating scale mean investors still need direct evidence on runway, burn,
      and account concentration before treating the business as de-risked.
    claimRefs: [CR008, CR009, CR011, CR012, CR013, CR016]
