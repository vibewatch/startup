      diligencePath: >-
        Request implementation cohort data, support SLAs, named references, and pipeline-to-go-live
        conversion metrics segmented by product.
      relatedQuestionRefs: [QR003, QR004]
      relatedTableRefs: [TR002]
    - type: conflicting-data
      severity: material
      topic: funding-opacity
      missingEvidence: >-
        A reconciled financing, revenue, headcount, and cash-runway package tied to a board-approved
