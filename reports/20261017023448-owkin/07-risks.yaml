        - Open diligence item
        - Medium
        - Critical
        - ISO 27001 and GDPR are documented, and the federated setup reduces raw-data movement.
        - Account-level ownership, reuse, and audit rights are still not public.
        - Request DPAs, model-training restrictions, output-IP clauses, and customer audit rights.
      - - Model validation, bias, and drift controls are not publicly evidenced in depth
        - Clinical, diagnostic, and drug-discovery decision workflows
        - Open diligence item
        - Medium
        - High
        - Owkin and third parties describe clinical validation and real-world learning loops.
        - Independent validation packs and monitoring thresholds are not disclosed here.
        - Review model cards, validation studies, drift thresholds, and escalation procedures.
      - - Large-scale patient-data processing creates ongoing privacy and compliance burden
        - 800+ hospitals / 840-institution network claims
        - Managed but continuous
        - Medium
        - High
        - The business is explicitly designed around privacy-preserving federated learning.
        - Scale makes any future compliance lapse strategically important.
        - Confirm supervisory, breach-response, and consent-governance processes by region.
    notes: >-
      Ordered by severity; rows summarize public evidence only and treat missing contractual and
      validation proof as residual exposure rather than as proof of a breach or enforcement event.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative public risk items drawn from the assigned source pool for current legal and
        regulatory diligence, not an exhaustive inventory of all applicable healthcare rules.
    claimRefs: [CR001, CR002, CR003, CR004, CR015]
