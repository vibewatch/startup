      whyItMatters: >-
        Conflicting public figures make it hard to size dilution risk, burn, execution capacity, or
        the true resilience of the current commercialization plan.
      diligencePath: >-
        Request the latest cap table, historical fundraising schedule, current cash balance, burn,
        and twelve- to twenty-four-month operating plan.
