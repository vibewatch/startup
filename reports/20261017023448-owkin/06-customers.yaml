company:
  name: Owkin
chapter:
  number: 6
  title: Customers
  summary: >-
    Owkin's public customer proof is strongest in large-pharma and oncology-institution workflows rather than in broad
    SMB-style account counts: official and third-party sources show K Pro packaged for biopharma decisions, a data network
    spanning more than 800 hospitals, and named 2026 licenses with AstraZeneca, Sanofi, Boehringer Ingelheim, and Servier.
    The underwriting gap is durability, not logos: public sources do not disclose renewals, seat usage, or customer
    concentration by revenue, while independent review evidence flags premium pricing and federated-IT onboarding as real
    adoption friction.
sections:
- id: customer-segments-buying-center
  title: Customer segments and buying center
  body: >-
    Public evidence points to Owkin selling into a two-sided healthcare ecosystem rather than to a broad generic enterprise
    base. On the paying side, K Pro is marketed to biopharma teams that need support for early portfolio decisions,
    patient-population selection, biomarker work, and clinical-trial design. On the supply and validation side, Owkin
    depends on academic medical centers, hospital networks, and diagnostics workflows that generate the multimodal patient
    data and real-world validation loops used to differentiate its models. AI Market Watch also lists CROs and diagnostic
    laboratories as target customers, but the assigned pool gives much stronger proof for pharma buyers and hospital-linked
    users than for CRO-scale production deployments. The result is a customer mix with potentially high value per account,
    but little public disclosure on payer mix, seat counts, or revenue by buyer type.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU012
  - CU013
  tableRefs:
  - TU001
- id: named-adoption-proof
  title: Named adoption proof and 2026 expansion signals
  body: >-
    Owkin has better public logo-to-use-case translation than many private AI-biotech companies. The assigned pool surfaces
    concrete 2026 adoption markers: AllHealthTech says AstraZeneca signed a three-year K Pro licence in May, Sanofi a
    five-year licence in June, and Boehringer Ingelheim plus Servier signed in September; the same article says Gustave
    Roussy began testing K Pro inside hospital clinical and research workflows in July. The official January 2026 launch
    release adds scale context by claiming data collected from more than 800 hospitals over a decade and partnerships with
    eight of the top 10 global pharma companies. Waiv extends that proof into clinical testing: Owkin said the spinout
    already had tests in use in clinical settings and an MSD collaboration dating to 2023. These are meaningful signals of
    strategic adoption, even if they still emphasize marquee accounts and platform validation more than disclosed recurring
    usage.
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU007
  - CU008
  - CU012
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU001
- id: durability-and-expansion
  title: Durability evidence is thinner than expansion logic
  body: >-
    Owkin's visible expansion loop is coherent: hospital-linked data and validation make the platform more useful for
    biopharma, new pharma programs create more workflows for K Pro, and Waiv gives the company a downstream clinical-testing
    path. IntuitionLabs and AI Market Watch both list additional names such as Bristol Myers Squibb, MSD, Amgen, Cleveland
    Clinic, Janssen, and Institut Curie, reinforcing the idea that Owkin can cross-sell across drug discovery, trial design,
    and diagnostics. But public durability evidence is still thin. The assigned pool does not disclose NRR, GRR, churn,
    average contract length, active-user counts, or customer concentration by revenue. Investors can see where expansion
    could happen, but not whether it is broad-based, renewing, or dependent on a few strategic accounts.
  claimRefs:
  - CU008
  - CU009
  - CU012
  - CU013
- id: procurement-friction-and-concentration-risk
  title: Procurement friction and concentration risk remain material
  body: >-
    Independent review evidence highlights why Owkin's customer base may remain concentrated even if the reference list is
    strong. SectorPunk says the company carries a $200,000+ minimum project size and $150-$250 hourly rates, while its
    federated-learning deployments can require heavy IT coordination across partner institutions. Those frictions fit
    Owkin's strategy because large pharma and sophisticated cancer centers get the most value, but they also narrow the
    reachable buyer pool and can lengthen onboarding. Public customer proof is therefore real but curated: the market can
    underwrite strategic validation, not yet a diversified renewal machine. Until management discloses contract mix,
    top-customer exposure, and renewal performance, customer durability should be treated as a material diligence gap rather
    than inferred from logos alone.
  claimRefs:
  - CU010
  - CU011
