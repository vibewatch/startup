              Market Watch 也将 CRO 和诊断实验室列为目标客户，但指定来源对药企买家和医院关联用户的证明，远强于对 CRO
              规模生产部署的证明。因此，每个客户的潜在价值可能很高，但公开资料几乎没有按付费方披露客户组合、席位数或收入。
