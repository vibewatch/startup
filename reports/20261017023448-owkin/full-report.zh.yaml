          label: 收入捕获
          value: Collaboration + license + services
          context: Public sources evidence several monetization mechanisms, but not the recurring versus non-recurring mix.
        - id: cost-base
          label: 利润率约束
          value: Wet lab + compute + onboarding
          context: Wet-lab validation, compute intensity, and deployment complexity likely constrain software-like margins.
      edges:
        - from: data-network
          to: ai-platform
          label: 专有输入
        - from: ai-platform
          to: workflow-use-cases
          label: 产品化
        - from: workflow-use-cases
          to: enterprise-deals
          label: 商业封装
        - from: enterprise-deals
          to: revenue-capture
          label: 变现
        - from: revenue-capture
          to: cost-base
          label: 利润率转化
    approximationNotes: 这是收入机制图，而不是量化转化漏斗；公开来源没有披露逐阶段的抽成率或毛利率。
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
      - CI012
  - id: FE001
    title: Owkin 产品架构图
    type: stack
    summary: 公开来源将 Owkin 描绘成一个分层系统：从联邦多模态数据访问起步，经过生物学推理和智能体层，最终嵌入研究 / 诊断工作流。
    data:
      layers:
        - label: 合作伙伴数据网络
          detail: 医院和研究中心关系提供多模态患者数据。
          modules:
            - 800 多家医院和研究中心
            - 多模态患者数据集
            - MOSAIC 空间多组学资产
          outputs:
            - 可供 AI 使用的临床和病理证据
        - label: 隐私保护联邦层
          detail: 分布式数据访问 / 训练层让患者原始数据保持去中心化。
          modules:
            - 联邦学习框架
            - Owkin Connect
            - Substra
          outputs:
            - 跨机构模型训练
        - label: 生物学推理核心
          detail: Owkin 将生物学 LLM、既有 AI 工具和多模态数据整合进 K Pro 推理层。
          modules:
            - K Pro
            - 生物学 LLM
            - 高级 AI 技能
          outputs:
            - 假设生成
            - 项目评估
        - label: 专用智能体
          detail: 特定任务智能体位于推理层之上。
          modules:
            - Pathology Explorer
            - 数字病理智能体
          outputs:
            - 细胞类型和生物标志物分析
        - label: 企业交付
          detail: 部署重点是嵌入工作流，而不只是使用封闭的 Owkin 界面。
          modules:
            - API 驱动交付
            - MCP 兼容
            - Anthropic Claude HCLS 渠道
          outputs:
            - 嵌入式客户工作流
        - label: 商业应用
          detail: Owkin 通过药物发现、试验和诊断产品释放价值。
          modules:
            - 药物发现支持
            - 临床试验决策支持
            - AI 诊断 / 数字病理
          outputs:
            - 生物制药和病理学用例
    approximationNotes: 公开来源没有披露每个内部服务边界，因此该图按产品表层对组件分组。
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Owkin 的客户旅程从优先数据和工作流访问起步，将这一优势转化为生物制药决策工具，并试图通过验证、诊断和更多战略客户实现扩张。
    data:
      nodes:
        - id: j1
          label: 数据与验证访问
          detail: 学术医院和研究中心为 Owkin 生态贡献多模态数据、验证环境和科学信誉。
          tone: positive
        - id: j2
          label: Owkin 筛选网络
          detail: Owkin 将超过 800 家医院的历史数据来源和一个 104 家中心的网络包装成差异化平台叙事。
          tone: neutral
        - id: j3
          label: 生物制药决策工作流
          detail: K Pro 面向制药研究团队的早期管线、患者群体、生物标志物和临床试验决策销售。
          tone: positive
        - id: j4
          label: 已点名战略客户
          detail: 2026 年公开验证集中于 AstraZeneca、Sanofi、Boehringer Ingelheim 和 Servier，而非广泛的长尾客户群。
          tone: positive
        - id: j5
          label: 临床验证闭环
          detail: Gustave Roussy 的测试和 Waiv 在诊所内的诊断使用，将验证从研究支持延伸到真实世界验证。
          tone: neutral
        - id: j6
          label: 扩张与阻力
          detail: 更多数据、工作流和诊断产品可以深化客户关系，但溢价定价和复杂的上手流程可能拖慢扩张。
          tone: warning
    approximationNotes: 该通用旅程由留存公开来源综合而成；不同客户可能通过合作、数据伙伴关系或诊断产品进入，而不是沿着单一线性路径推进。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU007
      - CU008
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当前优先级最高的剩余风险是数据权利 / 模型治理验证和商业集中度；界面成熟度及对前沿模型的依赖也很重要，但按当前公开记录，它们对投资论点的破坏性较低。
    data:
      columns:
        - label: 影响
          detail: 风险兑现后对业务造成的损害。
        - label: 剩余严重度
          detail: 扣除该来源池中公开可见的缓解措施后的净严重度。
      rows:
        - label: 数据权利和模型治理
          values:
            - label: 严重
              tone: critical
              note: 薄弱的合同或验证控制会直接威胁护城河。
            - label: 严重
              tone: critical
              note: 已有合规线索，但 IP、验证、偏差和漂移方面的证据仍需直接审查。
        - label: 大客户集中度
          values:
            - label: 严重
              tone: high
              note: 少数战略客户可能贡献大部分价值。
            - label: 高
              tone: high
              note: 大型制药验证真实存在，但收入占比和续约情况未披露。
        - label: 医院部署阻力
          values:
            - label: 高
              tone: high
              note: 漫长的实施周期可能拖慢订单转化和客户扩张。
            - label: 高
              tone: high
              note: 6 至 12 个月的周期和合作伙伴 IT 协调可能延迟价值实现。
        - label: 财务不透明
          values:
            - label: 高
              tone: critical
              note: 如果公开数字噪声较大，对现金跑道和招聘的假设可能错误。
            - label: 高
              tone: critical
              note: 不同公开来源对融资、团队规模和运营规模的披露相互冲突。
        - label: 对前沿模型的依赖
          values:
            - label: 中
              tone: warning
              note: 模型合作伙伴的经济条件或访问权限变化可能影响交付。
            - label: 中
              tone: warning
              note: 资料称 K Pro 通过 Claude 加 Owkin 模型和工具进行推理。
        - label: 公开界面成熟度
          values:
            - label: 中
              tone: warning
              note: 缺少公开界面会增加定制交付工作的可能性。
            - label: 中
              tone: warning
              note: NeuronFeed 未发现公开 API、SDK、webhook、OAuth 或 MCP 界面。
    approximationNotes: 相对定位是定性的，依据引用证据对影响、可能性和缓解成熟度的判断得出；它不是量化评分卡。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 战略验证真实存在，但价格不透明和企业采用阻力使当前建议维持观察。
    data:
      nodes:
        - id: strategic-proof
          label: 战略验证
          detail: 与顶级制药公司的合作、2026 年 9 月的资本承诺，以及与 Sanofi 的多年期 K Pro 合作，都支持其战略相关性。
          value: Positive
        - id: product-proof
          label: 产品验证
          detail: 公司关于 800 多家医院和 Pathology Explorer 性能的说法，显示其确有技术野心，也有一定可量化证据。
          value: Positive
        - id: commercial-signal
          label: 商业信号
          detail: 溢价定价和 Waiv 分拆融资暗示客户愿意付费，但尚未形成清晰的经常性收入基准。
          value: Mixed positive
        - id: price-opacity
          label: 价格不透明
          detail: 留存来源中最后披露的估值锚点仍是 2021 年 11 月的 $1B，后续轮次均未公开定价。
          value: Negative
        - id: execution-friction
          label: 执行阻力
          detail: 较高的最低项目规模和复杂的联邦学习部署可能拖慢采用，拉长企业销售周期。
          value: Negative
        - id: current-call
          label: 观察 / 估值偏高 / 中等置信度
          detail: 在将上行情景计入投资判断前，需要新的一级定价证据或经审计的商业化验证。
          value: Current view
    claimRefs:
