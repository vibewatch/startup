            title: 联邦数据加流程专用演示是证据最充分的优势
            body: 在指定来源池中，Owkin 是唯一有直接公开证据证明其在声称覆盖 800 多家医院的多模态数据网络之上，提供竞争情报和定位流程的选项。
            calloutType: strength
            claimRefs:
