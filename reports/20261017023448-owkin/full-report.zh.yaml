      - number: '3.3'
        title: 分发、切换成本与定价可见度
        blocks:
          - type: paragraph
            body: >-
              留存池中最强的商业证据来自分发和合作信号，而非透明定价。独立报道描述了 Sanofi 为定制 AI 智能体开展多年扩展合作；Owkin 2026 年 1 月的公告强调 Anthropic 集成，并称智能体由
              API 驱动且兼容 MCP。公司似乎想成为现有药企技术栈中的嵌入式研究层，而不是迫使客户彻底替换旧系统。集成导向也有两面性：买家可能更快采用 Owkin，但也能同时使用多个平台，将其与其他 AI
              供应商或内部团队比较。公开定价是最明显的盲点。指定公开来源没有 K Pro 或所列同业可供买家核验的价目表、合同条款或折扣结构，因此产品包装比较仍只能定性，无法审计。
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP012
              - CP013
