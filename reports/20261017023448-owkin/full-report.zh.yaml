        title: 产品范围与客户流程
        blocks:
          - type: paragraph
            body: >-
              指定的 2026 年来源集显示，这个平台不止一个 AI 模型。公开材料一致将 K Pro 描述为 Owkin 面向生物制药的总括式 AI 科学家或副驾，而独立资料仍列出诊断、病理产品、MOSAIC
              和联邦学习基础设施等活跃产品面。这很重要，因为客户流程似乎从研究和产品组合问题开始，经过生物标志物与病理分析，进一步延伸到临床试验决策支持，而不止于生成假设。换言之，Owkin
              在销售一套连接数据访问、生物学推理和流程交付的技术栈。产品图谱足以判断商业形态，但不足以验证定价、SKU 边界或哪些模块已规模化生产。
