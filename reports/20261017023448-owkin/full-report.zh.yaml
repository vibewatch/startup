    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台定位
        blocks:
          - type: paragraph
            body: >-
              Owkin 的自我定位已从泛化的联邦学习叙事，转向以 K Pro 为核心的“智能体 AI 公司”叙事；K Pro 是面向生物制药研究团队的 AI
              科学家。各官方页面都把这一定位建立在大型多模态患者数据网络之上：首页称 Owkin 从 840 家医院的 2,500 万名患者数据中学习，2026 年 1 月的发布则称数据来自十年间收集的 800
              多家医院。数字在不同页面有所四舍五入，但方向一致。官方办公地点信息也足够具体，可供后文引用：Owkin 列出 Boston、New York、London、Paris、Nantes、Geneva 和 Berlin
              的办公室，这更像跨大西洋运营，而非单点创业公司。
