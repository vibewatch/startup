            body: >-
              Owkin 最清晰的差异化主张不是泛化的“药物发现 AI”品牌，而是隐私保护型联邦架构、医院规模的多模态数据访问，以及面向临床和病理流程的专用智能体交付。这比许多 AI
              生物科技叙事更具体，独立资料也呼应了同一护城河。但尽调负担仍然很重。指定来源池中最强的公开性能主张是：Pathology Explorer 用小得多的模型将分类准确率提高
