  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              当前市场边界比“医疗 AI”或通用生命科学软件更窄。官方及第三方描述都将 Owkin 定位在 AI
              药物发现、临床研究优化、数字病理、生物标志物发现和相关生物制药决策支持的交叉地带。因此，纳入的支出是企业研发、转化研究、病理分析和隐私敏感型数据协作，而不是医院前台
              IT、通用办公副驾或消费健康软件。现状替代方案主要是内部孤立分析、药物开发流程中的零散点工具，以及训练模型前必须搬运数据的集中式方案。Owkin
              反复强调联邦学习，正是为了把品类定义为对这些集中式替代方案的升级，而非泛 AI 工具。
            claimRefs:
              - CM001
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
      - number: '2.2'
        title: 公开规模指标能证明触达深度，不能给出单一市场规模
        blocks:
          - type: paragraph
            body: >-
              留存来源没有用同一可比单位分别给出严谨的公开 TAM、SAM 和
              SOM。来源称，现有材料只能提供受限的采用视角：与大型药企的关系深度、接入数据网络的医院或医疗中心数量、网络内患者数量，以及战略买家和投资人的资金承诺。来源所列这些指标能说明 Owkin
              实际可能从哪里拿到预算、数据优势可能在哪里复利，但彼此不能相加，也没有共同分母。尤其是，来源公开披露的规模数字混合了“100 多家领先学术医院”“800 多家医院”“104 家医疗中心网络”“300
              万名特征化患者”，以及 Sanofi 战略交易、Forge 2022 年投后估值代理等融资数字。它们足以证明企业触达和数据密度，但若没有管理层或客户层面的收入拆分，还不足以给出精确 SAM/SOM。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
