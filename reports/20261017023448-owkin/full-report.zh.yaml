        title: 业务动能代理指标与单位经济性可见度
        blocks:
          - type: paragraph
            body: >
              Owkin 能证明真实的商业触达，但不是投资判断通常需要的那种证据。官方来源称其覆盖广泛的医院和药企，2026
              年发布材料则将其描述为一家运营十年的平台，正在把数据和模型封装成可复用智能体。这支持客户需求和平台采用确实存在，但指定来源池中唯一的公开收入或 ARR
              数字来自透明度低、没有公布方法且彼此不可直接比较的资料网站。因此，Owkin
              可能已有可观的企业收入，但当前收入质量、续约行为、实际定价和利润率转化仍未验证。公开信号还显示其成本基础包括湿实验室验证、算力、部署和数据管理；没有管理层数据，照搬软件式毛利率假设并不安全。
            claimRefs:
