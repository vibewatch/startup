        blocks:
          - type: paragraph
            body: >-
              公司对创始人的依赖仍然很高。Owkin 称公司由 Thomas Clozel 和 Gilles Wainrib 于 2016
              年创立，其关于我们页面仍突出两人，而非展示完整的高管梯队。二手证据补充了有限但有用的治理信息：Intuition Labs
              同时列出投资者名单和七人董事会阵容，有助于确认战略支持者，但指定来源仍未说明委员会架构、表决权或继任规划。融资方向清楚，但并不精确。Owkin 自己的 2026 年材料称募资约 $300 million，AI
              Market Watch 仍将公司 2021 年 11 月的独角兽里程碑与 Sanofi 的战略投资联系起来。这足以证明战略验证，却不足以判断最新估值或所有权控制。
