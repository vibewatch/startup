            body: >-
              证据支持对价格保持敏感、暂时“跟踪”，而不是笼统认可质量。产品和伙伴证据有所改善：Owkin 称 Pathology Explorer 智能体在参数减少五倍的同时，将分类准确率提升 23.7%；独立资料也提到与
              Sanofi 的多年 K Pro 合作。即便如此，公开商业基线过于嘈杂，无法进行干净的可比估值。独立二手来源对总融资额和收入 / ARR 代理指标存在重大分歧，且没有留存来源披露 2021
              年后的新定价轮。因此，情景表应被理解为围绕最后公开锚点的入场纪律，而不是虚假的精确内在价值模型。若商业化证据转化为新的价格发现，仍有上行空间；但在证据出现前付高价，等于押注叙事动能，而非经验证的估值支撑。
