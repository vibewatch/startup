      - number: '4.3'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >
              资本故事比经营报表更清楚，但仍不足以支持新的投资判断。Tracxn 汇总的总融资约为 $321 million，并显示最近一次定价估值是 2021 年 11 月 B 轮的 $1 billion；Owkin
              2026 年公告仍称募资约 $300 million。Sanofi 联盟将战略股权投资与多年期合作结合，说明 Owkin
              历来通过风险资本和商业合作共同支持增长。然而，留存公开来源没有披露当前现金、烧钱速度、债务义务或通往下一融资里程碑的 runway 桥接。因此，本章可以支持“Owkin
              确实能获得资本和合作收入”的结论，却不能证明公司目前能自我融资、接近盈亏平衡，或已安全支撑到下一战略阶段。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI013
              - CI014
