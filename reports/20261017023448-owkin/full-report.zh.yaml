      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河逻辑有可能成立，但反证也真实存在。2022 年行业文章已将 Owkin 与 CytoReason、Exscientia 一并列为吸引资本和药企合作的 AI
              药物开发公司；换句话说，战略合作本身不是独特的防御性证据。同一文章称当时监管机构尚未批准 AI 设计的药物，凸显平台承诺与已充分验证的治疗结果之间的差距。这一警示仍然重要，因为当前留存的 2026
              年资料最强的是演示、发布和资料页，而不是能证明相对知名同业可重复超越的独立证据。因此，竞争结论有利于其差异化叙事和企业相关性，但仍不足以证明 Owkin 已对其他 AI
              生物科技厂商，或对企业内部执行这些流程的惯性，建立独特且持久的领先优势。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
