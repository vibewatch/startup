              - CM013
      - number: '2.3'
        title: 买家、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可信的买家集中在已经承担高额研发、转化医学、病理和临床开发预算的大型机构。留存证据反复指向药企、生物制药研究团队、临床研究机构、癌症中心和医院网络。具体账号中的日常用户似乎是转化研究人员、病理学家、临床开发团队，以及需要靶点识别、患者分层、生物标志物或试验设计输出的战略和产品组合团队。医院还承担数据伙伴和部署环境的角色：提供受保护的多模态数据、验证流程，有时也承载肿瘤委员会部署；但最明显的商业付费意愿仍来自大型药企和战略合作预算。
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: 采用驱动、摩擦点与尚未证实之处
        blocks:
          - type: paragraph
            body: >-
              最强的驱动因素是：以保护隐私的方式访问此前分散的多模态患者数据，覆盖药物开发全生命周期的流程，以及顶级药企关系带来的验证。在肿瘤、转化研究和临床开发流程中，数据稀缺、合规和决策质量会直接影响进入临床的速度，这些优势尤其重要。同一批证据也显示采用并不顺畅。独立资料将其企业销售描述为高价且不透明；Reuters
              和 SectorPunk 都暗示，本地基础设施、隐私保护部署以及逐机构接入都并不轻量。这种组合可能把 Owkin
              的实际可服务市场收窄到资金充足的机构，排除较小生物科技公司和依赖科研资助的实验室。后续尽调要按客户细分、地域、流程和定价模式，把这些采用信号转成标准化支出区间，而不是把一个宽泛的市场叙事当成估值事实。
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 例证
        blocks:
          - type: callout
            title: 高端买家验证确实存在
            body: Sanofi 的战略投资，加上官方称已与全球前十大药企中的 8 家建立关系，说明 Owkin 已经跨过了生物制药领域部分最难赢得的买家所设的信任门槛。
            calloutType: strength
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 实际 SOM 可能远小于叙事中的市场
            body: 高价企业交付、不透明定价和重基础设施接入意味着，Owkin 近期现实市场集中在资金充足的机构，尽管更宽泛的“生物学 AI”叙事听起来大得多。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与参照组
        blocks:
          - type: paragraph
            body: >-
              留存证据表明，Owkin 的竞争是分层格局，而非单一同业组。两份独立资料反复将 Owkin 与 Exscientia、Recursion、Tempus、Insitro、ConcertAI、XtalPi 和
              Verge Genomics 并列，足以建立方向性的 AI 生物科技和临床数据同业组，但不足以判断功能对等或当前规模。更广泛的替代方案也不止这些 AI 原生同业：Owkin
              自己的产品和发布文案称智能体能嵌入药企流程、自动完成研究任务，因此实际替代还包括药企内部数据科学团队、外部服务商，以及更慢的手工发现和试验分析流程。Owkin 不仅要击败少数风投支持的 AI
              平台，还要替换大型生物制药买家已经掌控的现有流程。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP013
