      - number: '8.4'
        title: 例证
        blocks:
          - type: callout
            title: 基于公开证据的建议
            body: 目前应跟踪 Owkin，而不是买入这套故事：战略验证在 2026 年有所增强，但公开记录仍没有新定价轮或干净、经审计的商业化基线。
            calloutType: recommendation
