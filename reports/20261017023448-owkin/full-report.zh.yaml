        title: 例证
        blocks:
          - type: callout
            title: 投资判断仍依赖非公开披露
            body: 公开证据足以描述 Owkin 的变现逻辑和合作驱动的 GTM，但不足以判断收入质量或当前现金充足性。管理层需要提供当前收入结构、毛利率、客户集中度、烧钱速度和 runway，财务模型才能超越情景分析。
            calloutType: risk
