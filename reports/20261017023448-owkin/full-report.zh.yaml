      - number: '3.2'
        title: 差异化与买家匹配
        blocks:
          - type: paragraph
            body: >-
              Owkin 留存的 2026 年材料罕见地具体说明了平台用途。视频页面展示 K Pro 及相邻流程，涉及竞争情报、试验成熟度预测、药物定位策略、专利空白审查，以及靶点或适应症优先级排序。2026 年 1
              月的发布称，其智能体在来自 800 多家医院的精选多模态患者数据上训练，能够识别生物标志物、指导试验决策，并嵌入现有医疗行业流程。公开叙事已不是“医疗通用
              AI”，而是“为已有棘手流程问题的生物制药团队提供领域专用研究智能体”。相比通用副驾，这一买家主张更有针对性，尤其是许多买家无法快速自行复制其隐私保护数据访问能力。
