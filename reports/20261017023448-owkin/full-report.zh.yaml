      - number: '8.3'
        title: 最终尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              剩余工作很清楚。从跟踪转为买入前，投资者应要求新的一级融资条款或有定价的二级交易参考、经审计的商业化证据，以及能解释旗舰企业客户高价合理性的更清晰集中度经济性。下行情景也容易界定：若下一轮融资相对 2021
              年基准持平或下调，若高价实施模式无法突破标杆伙伴实现规模化，或公司无法调和公开收入与资本历史差异，那么今天偏高的立场就会固化为回避决定。反过来，若披露新一轮融资、经审计的经常性收入证据，以及大型药企客户的重复扩张，当前反论点将明显减弱，价格讨论也可更积极。
            claimRefs:
              - CV008
              - CV009
              - CV010
