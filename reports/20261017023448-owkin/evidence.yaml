evidenceGaps:
  - type: missing-source
    severity: material
    topic: scale-metrics
    missingEvidence: Current customer count, recurring revenue or run-rate, and a reconciled point-in-time headcount.
    whyItMatters: >-
      Later financial and valuation judgment will be weak if scale metrics remain unsupported or internally
      inconsistent.
    diligencePath: Request current board KPI pack, audited FY2025/FY2026 financials, and a live HRIS headcount export.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Board committee structure, observer rights, succession planning, and any official governance summary.
    whyItMatters: Founder concentration is clear, but the downside depends on whether oversight and succession are formalized.
    diligencePath: Request board deck, cap-table governance summary, committee roster, and executive succession materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: stakeholder-map-completeness
    missingEvidence: Ownership percentages, board seats by investor, and commercial economics for named strategic partnerships.
    whyItMatters: The public pool identifies names but not the control or economic leverage that each stakeholder holds.
    diligencePath: Request current cap table, shareholder-rights summary, and top partnership schedules with renewal terms.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: A buyer-segmented TAM/SAM/SOM model with explicit geography, workflow, price basis, and contract assumptions.
    whyItMatters: >-
      Without normalized segment economics, public network counts and financing figures can signal access but cannot
      support a precise valuation multiple or penetration thesis.
    diligencePath: >-
      Request management's segmentation deck or customer/revenue breakdown by workflow and geography, then reconcile it
      against public buyer and institution counts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-contradictions
    missingEvidence: >-
      A normalized glossary that explains whether Owkin's public counts refer to hospitals, healthcare centers, research
      centers, institutions, or unique contracted accounts.
    whyItMatters: >-
      Using mixed denominators as if they were one installed-base metric would distort both adoption velocity and the
      practical serviceable market.
    diligencePath: >-
      Ask management to define each published network statistic and tie each count to the underlying partner/account
      type and contract status.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: Current contract structures, list pricing or pricing bands, deployment scope, and renewal terms by buyer segment.
    whyItMatters: >-
      Pricing and implementation structure are necessary to convert top-end partnership validation into an
      evidence-backed SAM/SOM and gross-margin view.
    diligencePath: >-
      Obtain sample MSAs, SOWs, and renewal cohorts or request management to disclose standard price architecture by
      workflow.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Current public or customer-verified price, unit, contract-length, and discount disclosures for K Pro and named
      peers.
    whyItMatters: >-
      Without real pricing terms, buyers and investors cannot benchmark ROI, sales friction, or discount discipline
      across alternatives.
    diligencePath: >-
      Collect current pricing pages, procurement records, or customer references for Owkin and the named peer set before
      underwriting commercialization efficiency.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Primary 2026 product, security, and packaging documentation for Exscientia, Recursion, Tempus, and other named
      peers.
    whyItMatters: >-
      The current peer map is directionally useful, but it does not prove which platform has the strongest workflow
      depth, moat, or buyer fit today.
    diligencePath: >-
      Add current peer official docs, independent benchmarks, and customer proof so the competitor matrix can move from
      directional to decision-grade.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: switching-costs
    missingEvidence: >-
      Deployment time, renewal behavior, expansion usage, and proof of whether buyers standardize on Owkin or
      multi-home.
    whyItMatters: >-
      These operating signals determine whether workflow embedding creates durable lock-in or only low-friction
      experimentation.
    diligencePath: Request customer references, usage case studies, and account-level expansion data from Owkin or channel partners.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, quarterly burn, debt or covenant package, and a 12-24 month runway bridge.
    whyItMatters: Without current liquidity data, investors cannot assess financing dependency or timing of the next capital raise.
    diligencePath: Request the latest board package or management operating model with cash, burn, debt, and runway by scenario.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue split across licenses, collaborations, milestones, services, and diagnostics, plus renewal terms and
      customer concentration.
    whyItMatters: Reported partnership scale does not show whether revenue is recurring, concentrated, or gross-margin accretive.
    diligencePath: >-
      Obtain a revenue bridge by product line and top-customer concentration with renewal history for the last eight
      quarters.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: traction-verification
    missingEvidence: Primary-source revenue or ARR disclosure that reconciles third-party estimates and dates them clearly.
    whyItMatters: >-
      Current public traction cannot be normalized into a dependable revenue base when opaque profile sites publish
      inconsistent estimates.
    diligencePath: Request audited revenue, ARR definition, and year-over-year growth directly from management or primary filings.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: security-and-compliance-controls
    missingEvidence: >-
      Current trust-center materials, security certifications, uptime/status history, incident-response detail, and
      product-specific quality controls for K Pro and related agents.
    whyItMatters: >-
      Enterprise biopharma adoption depends on demonstrable operating controls and governance, not only architecture
      claims about privacy-preserving data access.
    diligencePath: >-
      Request SOC 2 / ISO / HDS / GDPR materials, model-governance documentation, customer security questionnaires, and
      a historical status or incident log.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: >-
      Benchmark protocol, comparator set, external validation, and production-vs-lab context behind the 23.7% accuracy
      and weeks-to-hours claims for Pathology Explorer.
    whyItMatters: >-
      The strongest visible performance claim drives differentiation and should be tested before treating it as
      production-grade moat evidence.
    diligencePath: >-
      Obtain the technical evaluation package, benchmark definitions, and customer or study evidence showing how the
      metrics were produced and whether they generalized.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: developer-signal-and-documentation-depth
    missingEvidence: >-
      Substantive public developer-signal evidence such as API docs, release notes, repo activity, package usage, or
      partner technical implementation writeups.
    whyItMatters: >-
      Without external technical-adoption traces, it is hard to judge implementation maturity, release velocity, and
      ecosystem pull behind the workflow-embedding claims.
    diligencePath: >-
      Request a product documentation bundle and customer/partner implementation references, then add public docs,
      changelogs, or technical talks in future refreshes.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      NRR, GRR, logo churn, contract length, renewal history, and top-customer concentration by revenue are not public
      in the assigned pool.
    whyItMatters: >-
      Without durability and concentration data, strategic logos could mask weak renewal quality or heavy dependence on
      a few pharma accounts.
    diligencePath: >-
      Request a cohort retention bridge, top-10 customer concentration table, renewal calendar, and contract-term
      summary from management.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      An exhaustive current list of production K Pro or Waiv customers with go-live dates and deployment status is
      unavailable.
    whyItMatters: >-
      Named examples validate adoption, but a curated subset cannot prove breadth of production use across the full
      customer base.
    diligencePath: >-
      Request a reference list split by pilot versus production, segment, start date, and current status; then validate
      at least several live references independently.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: account-usage-depth
    missingEvidence: >-
      Active-seat counts, number of live programs, transaction volumes, or test volumes are not disclosed for Sanofi,
      AstraZeneca, Boehringer, Servier, Gustave Roussy, or Waiv customers.
    whyItMatters: >-
      Named logos without usage depth can overstate production maturity and obscure whether expansion is broad or
      confined to small pilot teams.
    diligencePath: >-
      Ask management for account-level deployment snapshots, active program counts, and at least one quantified
      expansion case for software and diagnostics customers.
    relatedQuestionRefs:
      - QU004
      - QU007
  - type: missing-source
    severity: material
    topic: data-governance
    missingEvidence: >-
      Executed customer-facing contract language on data rights, model-training restrictions, output ownership, and
      audit rights for pharma and hospital deployments.
    whyItMatters: >-
      Owkin's moat depends on sensitive patient-data relationships, so weak contractual control would directly undercut
      customer trust and platform defensibility.
    diligencePath: >-
      Request a redlined DPA, template commercial agreement, model-governance pack, and recent buyer-security
      questionnaire responses.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: deployment-friction
    missingEvidence: >-
      Production deployment counts, implementation durations, uptime or SLA performance, and reference customer
      expansion metrics for K Pro and related products.
    whyItMatters: >-
      Without repeatable go-live and expansion data, the public product narrative may overstate operational maturity and
      understate the cost of enterprise delivery.
    diligencePath: >-
      Request implementation cohort data, support SLAs, named references, and pipeline-to-go-live conversion metrics
      segmented by product.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR002
  - type: conflicting-data
    severity: material
    topic: funding-opacity
    missingEvidence: >-
      A reconciled financing, revenue, headcount, and cash-runway package tied to a board-approved budget and current
      cap-table view.
    whyItMatters: >-
      Conflicting public figures make it hard to size dilution risk, burn, execution capacity, or the true resilience of
      the current commercialization plan.
    diligencePath: >-
      Request the latest cap table, historical fundraising schedule, current cash balance, burn, and twelve- to
      twenty-four-month operating plan.
    relatedQuestionRefs:
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Revenue concentration, renewal rates, contract lengths, and gross-margin contribution by major pharma or hospital
      account.
    whyItMatters: >-
      Named partnerships validate demand, but without concentration and renewal data investors cannot tell whether the
      business is diversified or exposed to a small set of strategic accounts.
    diligencePath: Request cohort retention, top-account exposure, backlog, and renewal data by customer type.
    relatedQuestionRefs:
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: valuation-comparables
    missingEvidence: Fresh primary financing terms, a priced secondary transaction, or audited 2025/2026 revenue and retention metrics.
    whyItMatters: >-
      Without a current price-setting transaction or audited commercialization baseline, any upside case above the 2021
      anchor remains narrative-led rather than valuation-led.
    diligencePath: >-
      Request the latest term sheets or secondary marks plus audited revenue, renewal, and concentration disclosures
      before setting an entry price.
    relatedQuestionRefs:
      - QV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current gross margin, customer concentration, deployment payback, and expansion rates for flagship pharma
      accounts.
    whyItMatters: >-
      Recommendation confidence stays medium until premium pricing is shown to translate into repeatable and profitable
      enterprise adoption.
    diligencePath: >-
      Ask management for cohort renewals, implementation timelines, gross margin bridge, and top-10 customer revenue
      share.
