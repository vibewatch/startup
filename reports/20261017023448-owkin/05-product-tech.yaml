callouts:
  - calloutType: "strength"
    title: "Architecture is more specific than a generic AI-biotech pitch"
    body: "The combination of federated hospital data access, multimodal patient evidence, specialized agents, and workflow embedding gives Owkin a concrete operating model rather than a vague 'AI for pharma' story."
    claimRefs: ["CE002", "CE004", "CE008", "CE012"]
