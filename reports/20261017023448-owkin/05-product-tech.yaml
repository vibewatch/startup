      - ["Owkin Connect / federated-learning platform", "Pharma and research institutions", "Live platform layer", "Distributed model training and analysis without moving raw patient data", "Need active-site counts, latency/SLA, and security-control evidence"]
      - ["MOSAIC", "Oncology and biomarker researchers", "Active dataset / atlas surface", "Spatial multi-omics asset supporting target and biomarker work", "Need official access terms, update cadence, and current scale metrics"]
      - ["Diagnostics / digital pathology products", "Pathology labs and diagnostic users", "Commercial surface still described as active", "Shows Owkin is not only selling discovery software", "Need official current SKU list, regulatory scope, and adoption metrics by region"]
