      - ["Federated learning / Owkin Connect / Substra", "Keeps data distributed while enabling cross-institution learning and analytics", "Institutional IT integration and privacy-preserving infrastructure", "Implementation can be onboarding-heavy, and the assigned pool does not validate current control maturity"]
      - ["Biological reasoning layer / K Pro", "Combines biological LLMs, multimodal data, and prior AI tooling into an AI scientist", "Model quality, data quality, and lab/clinical feedback loops", "No public model-governance, release-cadence, or reproducibility package in the assigned pool"]
      - ["Agent delivery layer / Pathology Explorer", "Exposes task-specific reasoning for pathology and trial workflows", "Anthropic HCLS channel, APIs, and digital-pathology pipelines", "Performance claims are company-provided and lack public methodology here"]
      - ["Application outputs", "Delivers biomarker, pathology, and trial-support outputs into customer workflows", "Workflow embedding, user adoption, and customer change management", "Public sources do not verify support burden, production reliability, or incident history"]
    notes: "This is an operating-model map derived only from the assigned prefetched evidence, not a full software bill of materials."
    claimRefs: ["CE003", "CE004", "CE006", "CE008", "CE011", "CE012"]
