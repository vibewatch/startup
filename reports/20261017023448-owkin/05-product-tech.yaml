      - ["Patient and population decisions", "Interpret multimodal data to stratify cohorts and prioritize interventions", "K Pro plus federated multimodal data", "Public materials consistently connect K Pro to patient/population decisions and clinical insights", "No disclosed sensitivity/specificity or production-deployment counts by use case"]
      - ["Biomarker and pathology analysis", "Analyze digital slides and surface cell-type / biomarker signals", "Pathology Explorer / HIPE-based agent", "Company says Pathology Explorer delivers 23.7% better classification accuracy with 5x fewer parameters and cuts compute time from weeks to hours", "Benchmark methodology and external validation are not in the assigned pool"]
