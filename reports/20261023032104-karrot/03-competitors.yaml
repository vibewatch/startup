company:
  name: Karrot
chapter:
  number: 3
  title: Competitors
  summary: Karrot has a pronounced Korean scale advantage, but its competitive position changes materially outside Korea. Independent reporting describes a saturated domestic category in which Karrot leads on users and advertising, while Bungaejangter and Junggonara are pursuing transaction-fee monetization; the main durability question is whether trust, density, and local services transfer to markets where Meta Marketplace and other incumbents already have distribution.
sections:
  - id: landscape-and-scale
    title: Landscape and scale
    body: >-
      Karrot competes across several distinct jobs rather than in one homogeneous
      marketplace. In Korea, direct peers include Bungaejangter and Junggonara;
      broader substitutes include Meta/Facebook Marketplace, local social groups,
      specialist vertical marketplaces, and offline exchange. The Korean peer set
      is unusually concentrated: independent reporting based on WiseApp data put
      Karrot at 21.27 million monthly active users in May, versus 4.75 million
      for Bungaejangter and 1.65 million for Junggonara. That scale creates a
      local inventory and advertising advantage, but it does not establish a
      comparable lead in Canada, the UK, Japan, or the US. A useful underwriting
      distinction is therefore domestic network density versus international
      market entry. The available evidence supports a strong domestic leader and
      an international challenger, not a globally established category winner.
    claimRefs: [CP001, CP002, CP003, CP004, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-monetization
    title: Capability and monetization comparison
    body: >-
      Karrot's product proposition is local, verified exchange: its public app
      listing emphasizes neighborhood meetings, mobile and location verification,
      ratings, private chat, and the absence of professional sellers. This is a
      differentiated trust and proximity bundle, but the same local constraint
      can limit selection and liquidity when density is low. The Korean incumbent
      advantage is reinforced by an advertising engine built on local behavioral
      data and by adjacent services such as jobs and real estate. The competitive
      response is moving in two directions. Karrot is testing Direct Purchase and
      brokerage fees while Bungaejangter and Junggonara are more directly adding
      transaction fees and authentication. Moloco's partner case study also shows
      that Karrot can use first-party behavioral data for targeted campaign
      re-engagement, although partner material is not independent proof of
      superior conversion economics.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The strongest moat is accumulated local density combined with trust
      mechanisms and a broad community surface. It is harder for a new entrant
      to reproduce neighborhood liquidity and reputation history than to copy a
      listing interface. That moat is not absolute. Users can multi-home, sellers
      can cross-post, and large platforms can bundle marketplace distribution with
      an existing social graph. Karrot's international expansion also carries
      operating and monetization risk: reporting says Canadian and Japanese
      subsidiaries were loss-making in the prior year, while a current report
      describes Canada as the priority and the UK and Japan as slower. Ad
      concentration creates another displacement vector if local advertiser
      demand does not scale with user density. The counterfeit takedown data is
      adverse evidence on trust-and-safety execution, although the regulator
      cautions that blocked-listing counts do not measure total counterfeit
      circulation.
    claimRefs: [CP010, CP011, CP012, CP013]
  - id: buyer-implications
    title: Buyer implications
    body: >-
      For a buyer choosing a local marketplace, Karrot is strongest where
      neighborhood density, verification, ratings, and community engagement
      outweigh the breadth and reach of a general-purpose platform. Its free
      consumer listing model lowers adoption friction, but the public evidence
      does not disclose realized seller pricing, take rates across markets, or
      comparable liquidity and retention by country. Buyers should therefore
      distinguish documented capabilities from unverified superiority. The
      competitive thesis is attractive in Korea and conditionally attractive
      abroad: domestic scale can fund experimentation, while overseas success
      requires proof that trust systems and local density can overcome incumbent
      distribution. The key diligence trigger is repeatable non-ad monetization
      without eroding the community experience that differentiates the product.
    claimRefs: [CP014, CP015]
tables:
