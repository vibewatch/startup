    title: Competitor profile table
    columns: [Competitor or alternative, Category, Scale or evidence, Target segment, Differentiation, Limitation or open question]
    rows:
      - [Karrot, "Direct incumbent", "21.27m Korean MAU reported for May; 20m+ MAU cited in a current report", "Korean neighborhoods and expanding international markets", "Hyperlocal exchange, community, verification, ratings, local ads", "International density and monetization by country are not disclosed"]
      - [Bungaejangter, "Direct Korean peer", "4.75m Korean MAU reported for May; 44.9bn won 2024 revenue reported", "Korean secondhand users and professional sellers", "Payment-fee model, safe payment, authenticity service", "Fee increases triggered user backlash and the company remained loss-making in the cited year"]
      - [Junggonara, "Direct Korean peer", "1.65m Korean MAU reported for May; 11.8bn won 2024 revenue reported", "Korean secondhand users", "Naver-linked reach, seller fees, safe payment and authentication", "Operating loss reported for 2024; relative liquidity versus Karrot is unresolved"]
      - [Meta Marketplace, "Global incumbent and substitute", "Massive built-in platform distribution is identified as a threat in third-party analysis", "Broad social-graph users and general local commerce", "Bundled reach and cross-platform discovery", "The assigned evidence does not provide comparable Korea or Canada marketplace metrics"]
      - [Mercari, "Public marketplace reference", "USD3.61bn market capitalization reported for October 2026", "Not established in assigned evidence", "Public-market scale reference", "Market capitalization is not revenue, funding, or evidence of Korean product overlap"]
      - ["Offline exchange, local groups, and internal community tools", "Status quo or internal-build substitute", "No standardized scale measure in the assigned evidence", "Buyers and sellers prioritizing convenience or existing relationships", "Low platform dependence and control of local rules", "Limited searchable inventory, discovery, measurement, and transaction protection"]
    notes: "Sources are a mixed evidence snapshot from October 2025 to October 2026; MAU and revenue figures are reported by independent Korean press, while Meta and status-quo entries retain explicit evidence limits."
    claimRefs: [CP001, CP002, CP003, CP010, CP014, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Karrot, Bungaejangter, Junggonara, Meta Marketplace, Evidence qualification]
    rows:
      - ["Hyperlocal discovery", "Neighborhood radius and local meetings", "Not established in assigned sources", "Not established in assigned sources", "Broad social-graph marketplace", "Karrot capability is from its public app listing; competitor cells are unknown where not documented"]
      - ["Identity and trust", "Mobile/location verification and ratings", "Safe payment and authenticity service reported", "Safe payment and authentication reported", "Not established in assigned sources", "Capabilities are not equivalent measures of fraud prevention or outcomes"]
      - ["Monetization mechanism", "Local advertising; Direct Purchase brokerage emerging", "Seller/payment fees and Pro Store fees", "Seller fees and safe-payment direction", "Not established in assigned sources", "List or announced mechanisms are not realized take rates"]
      - ["Community and adjacent services", "Community, jobs, real estate and local services", "Secondhand focus in assigned comparison", "Secondhand focus in assigned comparison", "Social graph adjacency", "The evidence does not quantify cross-service engagement or retention"]
    notes: "Unknown cells mean the assigned successful sources did not establish the capability, not that the competitor lacks it; the matrix compares documented surfaces rather than audited outcomes."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Platform or model, Consumer listing price, Transaction or advertising fee, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Karrot, "Free consumer listings", "Advertising-led; Direct Purchase brokerage fee reported but rate not disclosed", "Local listing, chat, verification and ratings", "Realized seller economics and country-level pricing unknown", "Low entry friction supports liquidity; fee diversification remains unproven"]
      - [Bungaejangter, "Not established", "Seller payment fee reported at 6%; Pro Store fee reported at 5%-10%", "Safe payment and authenticity service", "User response to fee increases was negative in cited reporting", "Monetization is more explicit but may trade off seller retention"]
      - [Junggonara, "Not established", "Seller-fee direction reported; rate not established", "Safe payment and authenticity service", "Realized pricing and retention unknown", "Could compete on trust infrastructure, but scale gap remains"]
      - [Meta Marketplace, "Not established", "Not established in assigned sources", "Marketplace bundled with social distribution", "Pricing and seller economics unknown", "Distribution advantage cannot be translated into a unit-economics conclusion from this pool"]
    notes: "This is a public-pricing and packaging comparison, not a realized revenue or margin table; null or unknown cells identify missing evidence rather than zero prices or fees."
    claimRefs: [CP006, CP007, CP008, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "An ordinal view places Karrot highest on documented Korean density and local-community differentiation, while Meta retains the strongest documented distribution threat."
    data:
      points:
        - {label: Karrot, x: 5, y: 5, series: "Local density / community differentiation"}
        - {label: Bungaejangter, x: 3, y: 3, series: "Local density / community differentiation"}
        - {label: Junggonara, x: 2, y: 3, series: "Local density / community differentiation"}
        - {label: Meta Marketplace, x: 5, y: 2, series: "Local density / community differentiation"}
        - {label: Offline and local groups, x: 2, y: 2, series: "Local density / community differentiation"}
        - {label: Direct Purchase model, x: 3, y: 4, series: "Local density / community differentiation"}
    approximationNotes: "The 1-5 coordinates are evidence-constrained ordinal judgments, not measured market shares or performance scores: x represents documented distribution reach or threat, and y represents documented local-community and trust specialization; unknown competitor metrics limit precision."
    claimRefs: [CP001, CP005, CP010, CP014]
callouts:
  - calloutType: strength
    title: Domestic density is the clearest moat
    body: Karrot's lead in Korean marketplace usage and its integrated verification, ratings, and community surface create a stronger starting position than a feature comparison alone would suggest.
    claimRefs: [CP001, CP005]
  - calloutType: risk
    title: International proof is the gating issue
    body: The assigned evidence describes Canada as a priority but also reports losses in overseas subsidiaries and slower UK and Japan progress; global claims should remain conditional until country-level density and monetization are disclosed.
    claimRefs: [CP011, CP012]
