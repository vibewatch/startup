evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A verified founder, board, executive succession, and current headcount roster.
    whyItMatters: >-
      Leadership depth and governance quality affect key-person risk, control assessment, and confidence in
      international execution.
    diligencePath: Request the current cap table, board minutes or roster, organization chart, and employee count by geography.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: The complete financing history, current ownership, preference stack, and exact 2025 secondary pricing and terms.
    whyItMatters: >-
      Reported round valuation and secondary pricing are not interchangeable and do not establish current equity value
      or investor proceeds.
    diligencePath: >-
      Obtain the capitalization table, financing documents, secondary purchase agreements, and latest 409A or board
      valuation.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: A standardized revenue bridge reconciling 2023, 2024, and 2025 consolidated and standalone perimeters.
    whyItMatters: >-
      Reported periods and accounting perimeters differ, so revenue growth and margin comparisons could otherwise mix
      consolidated, standalone, or estimated figures.
    diligencePath: >-
      Request audited statements, segment revenue, Karrot Pay consolidation treatment, and cash-flow statements for
      2023-2025.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: overseas-expansion
    missingEvidence: Country-level user, revenue, cost, and contribution-margin data for Canada, the United States, and Japan.
    whyItMatters: >-
      International expansion is funded despite reported losses, making overseas unit economics central to runway and
      valuation.
    diligencePath: >-
      Request monthly country P&Ls, paid and organic cohorts, CAC, engagement, monetization, and intercompany funding
      schedules.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: counterfeit-risk
    missingEvidence: Denominator, repeat-offender, appeal, and remediation metrics for counterfeit listings.
    whyItMatters: A raw takedown count signals control workload but cannot by itself quantify prevalence or platform liability.
    diligencePath: >-
      Request trust-and-safety dashboards, KIPO correspondence, takedown response times, appeals, and buyer dispute
      outcomes.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: secondhand market
    missingEvidence: >-
      A transparent, independently audited South Korea resale-market series split between peer-to-peer transaction
      value, platform revenue, and advertising.
    whyItMatters: Current market estimates use different scopes and do not isolate Karrot's serviceable or monetizable market.
    diligencePath: >-
      Request methodology, source datasets, category definitions, and annual time series from market-data providers and
      Korean trade associations.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Country-level liquidity, retention, take rate, advertising yield, and contribution margin for Korea, Canada, and
      other markets.
    whyItMatters: Registered users and market-size estimates do not show whether expansion creates durable cash-generating density.
    diligencePath: >-
      Obtain market-level cohorts, active-user definitions, transaction frequency, advertiser conversion, and fully
      loaded market-entry costs.
    relatedQuestionRefs:
      - QM006
  - type: conflicting-data
    severity: material
    topic: trust
    missingEvidence: >-
      Comparable fraud, counterfeit, dispute, and successful-transaction rates across Karrot and substitute
      marketplaces.
    whyItMatters: >-
      A high takedown count can indicate exposure, stronger monitoring, or both; it cannot alone quantify platform
