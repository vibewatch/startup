company:
  name: Karrot
chapter:
  number: 7
  title: Risks
  summary: Karrot's principal risks are the trust-and-safety burden of a large peer-to-peer marketplace, tightening Korean privacy and platform regulation, and the execution risk of monetizing a saturated domestic base while funding loss-making international expansion. The evidence supports concrete monitoring triggers, but public disclosure remains insufficient on incident frequency, control effectiveness, and country-level economics.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis impact
    body: Karrot's risk profile is concentrated in the interaction between scale and trust. KIPO data reported by Seoul Economic Daily show 12,809 counterfeit listings blocked on Karrot through the end of August 2026, the highest count among 18 monitored open marketplaces; the same source cautions that blocked-listing counts do not measure total counterfeit volume. This is not proof of platform negligence, but it creates recurring moderation, dispute, brand, and user-retention exposure. The company said direct peer transactions can include private sellers unaware that goods are counterfeit and pointed to its dispute-mediation center. The investment implication is that trust controls are a growth asset as well as a cost center; deterioration in authenticity, privacy, or transaction safety could damage the local network that supports advertising monetization.
    claimRefs: [CR001, CR002, CR003, CR015]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: The legal surface is expanding before Karrot's detailed compliance perimeter is fully observable. A 2026 Korean privacy-law analysis describes an amended PIPA with most provisions effective September 11, 2026, including possible surcharges of up to 10% of revenue in aggravated cases, board approval and regulator notification for certain CPO changes, notification when a breach is possible, and new CEO or business-owner accountability. A separate 2026 South Korea privacy guide describes PIPA, the Location Information Act, and the AI Framework Act as relevant frameworks, with extraterritorial considerations and a 72-hour data-subject notification rule after a breach. The proposed Online Platform Fairness Bill would add open-ended conduct, settlement, and transparency obligations, with key details delegated to presidential decree. Karrot therefore needs evidence of governance readiness, not merely a compliant policy page.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: operating-and-financial
    title: Operating, security, and financial-model risk
    body: Karrot's operating model has two linked vulnerabilities; a high-volume marketplace must preserve safe local interactions while an advertising-heavy revenue model must keep user attention and advertiser value aligned. Independent reporting says 2024 revenue was 189.1 billion won, operating profit 37.6 billion won, and more than 99% of revenue came from advertising; it also reports 43 million cumulative domestic sign-ups and concerns that domestic user expansion is nearing saturation. The same reporting says Canadian and Japanese subsidiaries posted net losses of 22 billion won and 2.5 billion won respectively in the prior year. Moloco's partner case study shows Karrot uses first-party data, behavioral segmentation, retargeting, and conversion optimization, which makes data governance and measurement integrity operational dependencies. Public evidence does not establish outage frequency, fraud loss, security incidents, or cash runway, so these remain diligence gaps rather than assumed strengths or weaknesses.
    claimRefs: [CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: The most decision-useful mitigations are measurable. Management should report counterfeit detection and appeal rates, time to remove suspect listings, dispute outcomes, repeat-offender rates, and trust or retention metrics by market. Privacy readiness should be tested against the September 2026 PIPA obligations and the 2027 ISMS-P milestone, including board-approved CPO governance, incident-notification playbooks, data-minimization controls, and documented budget and staffing. International expansion should be gated by country-level contribution margin, repeat usage, paid-advertiser retention, and a defined loss ceiling rather than aggregate user growth. A thesis break would be a material privacy or platform enforcement action, a sustained rise in counterfeit or dispute indicators, evidence that advertising degrades engagement, or continued overseas losses without a credible path to contribution profitability. These thresholds are diligence asks because the public record does not disclose the needed baselines.
    claimRefs: [CR004, CR005, CR006, CR011, CR013, CR015]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Counterfeit listings, South Korea, "12,809 blocked through Aug 2026; Karrot ranked first among 18 monitored marketplaces", medium, high, "Monitor listing takedowns, repeat sellers, appeals, and dispute mediation", "High because blocked counts do not show total counterfeit volume", "Obtain monthly counterfeit, appeal, and repeat-offender denominators"]
      - [PIPA amendment, South Korea, "Most provisions effective 2026-09-11; mandatory ISMS-P provisions described for 2027-07-01", medium, high, "Board-approved privacy governance, documented budget and technical controls", "High until thresholds and internal readiness are evidenced", "Review CPO appointment, incident, data-retention, and ISMS-P readiness records"]
      - [Online Platform Fairness Bill, South Korea, "Introduced 2025-12-09; key scope and conduct details delegated to presidential decree", medium, high, "Track legislative text and map settlement, advertising, ranking, and merchant-contract controls", "Medium-high due to open-ended standards and uncertain final scope", "Obtain legal applicability memo and scenario analysis by revenue category"]
      - [AI and location-data regulation, South Korea and overseas users, "Existing PIPA, Location Information Act, and AI Framework Act obligations described; extraterritorial factors apply", medium, medium-high, "Document lawful bases, minimization, security, user rights, and AI risk assessments", "Medium-high because product and geography expand the data perimeter", "Inventory location, profiling, and AI features and test cross-border controls"]
    notes: "Rows synthesize reported legal or regulatory status; likelihood and severity are analytical assessments requiring validation against Karrot's controls. The counterfeit count is blocked listings, not total counterfeit volume."
    enumerationScope:
      coverage: partial
      basis: "Publicly reported Korean platform rules and enforcement items available in the assigned 2026 refresh source pool"
    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR009, CR010]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Counterfeit or unsafe listing, high, high, "Dispute mediation is reported; proactive control performance is not disclosed", high, "No public denominator for suspect listings, removals, appeals, or repeat offenders"]
      - [Privacy breach or misuse of location and behavioral data, medium, high, "Legal requirements and partner-described first-party targeting are visible; control testing is not", high, "No verified incident history, audit results, or data-flow inventory"]
      - [Advertising harms engagement or trust, medium, high, "Behavioral creative testing and retargeting are described by a partner", medium-high, "No public ad-load, retention, complaint, or advertiser-churn series"]
      - [International expansion fails to reach contribution profitability, high, high, "Management has invested in Canada and Japan; country-level economics are not disclosed", high, "No market-level cohorts, payback, or loss-ceiling disclosure"]
    notes: "Risk ratings are not incident claims. They combine the cited exposure with explicit uncertainty about denominators, control effectiveness, and country-level economics."
    claimRefs: [CR003, CR011, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Advertising demand and measurement, Advertisers and Moloco/TVING ecosystem, "Awareness, retargeting, and conversion campaigns", "Advertising is reported as more than 99% of 2024 revenue", "Advertiser pullback, weak incrementality, or privacy limits reduce monetization", high, "Diversify local services and measure advertiser retention and incrementality", high]
      - [Korean regulatory permissions and enforcement, "PIPC, KIPO, KFTC and related bodies", "Privacy, counterfeit monitoring, and platform conduct oversight", "Domestic operations and user data are concentrated in Korea", "New rules, investigations, or corrective orders raise cost or constrain product choices", high, "Maintain regulatory inventory, response playbooks, and board reporting", medium-high]
      - [International subsidiaries and local execution, "Canada and Japan operations", "Market entry, product adaptation, and local growth", "Reported subsidiary losses indicate material capital dependence", "Losses persist without sufficient local liquidity or product-market fit", high, "Gate spending by country contribution margin, cohorts, and loss ceilings", high]
    notes: "Concentration uses reported business-model and geography evidence; no contract-level dependency or liquidity schedule was available in the assigned sources."
    claimRefs: [CR009, CR011, CR012, CR013, CR014]
