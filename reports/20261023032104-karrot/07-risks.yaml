callouts:
  - calloutType: risk
    title: Trust is the primary operating risk
    body: "The 2026 counterfeit-monitoring count is a scale signal and a control burden, not proof of total counterfeit prevalence. Karrot's mitigation claim should be tested with rates, repeat-offender data, appeals, and dispute outcomes."
    claimRefs: [CR001, CR002, CR003]
  - calloutType: risk
    title: Regulation can reprice the thesis
    body: "PIPA changes and proposed platform rules could increase governance, notification, settlement, and conduct obligations. The unresolved issue is implementation detail and Karrot's control readiness, not whether the legal perimeter exists."
    claimRefs: [CR004, CR005, CR006, CR009, CR010]
  - calloutType: insight
    title: International growth needs a loss gate
    body: "Reported Canadian and Japanese subsidiary losses make country-level contribution economics a decision variable. Aggregate user growth is not enough to show that international expansion compounds value."
    claimRefs: [CR011, CR013]
