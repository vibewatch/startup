slug: karrot
runDate: 2026-10-23
company:
  name: Karrot
chapter:
  number: 8
  title: Valuation
  summary: Karrot has evidence of strong Korean marketplace scale and advertising-led profitability, but public evidence is insufficient to underwrite a current price or preference stack. The appropriate stance is track/research-more until current financing terms, cash generation, and overseas unit economics are disclosed.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investable case is a dense local network that has expanded beyond listings into
      community, jobs, real estate, and local advertising. Independent reporting describes
      Karrot as the leading Korean used-goods marketplace, with 21.27 million monthly active
      users in May 2025 and nearly 80% share of the tracked category. A 2024 revenue and
      operating-profit improvement reported by Chosun Biz, together with the earlier
      advertising-led profit evidence in Platum, supports real monetization rather than a
      purely engagement-led story. A current independent user guide also describes the core
      peer-to-peer transaction as carrying no platform fee, reinforcing why monetization
      depends on adjacent advertising and services. The anti-thesis is concentration: Chosun Biz says more
      than 99% of revenue came from advertising in 2024, domestic sign-ups had reached 43
      million, and Canadian and Japanese subsidiaries were loss-making. That makes valuation
      sensitive to ad durability, saturation, and whether international expansion can earn
      acceptable returns.
    claimRefs: [CV001, CV002, CV003, CV004, CV014]
    tableRefs: [TV002]
  - id: price-discipline
    title: Price discipline and financing context
    body: >-
      Historical financing evidence is not a current mark. A KoreaTechDesk archive reports
      a $162 million Series D at a $2.7 billion valuation, while a 2025 Nate report describes
      secondary shares changing hands at roughly $1.81 billion to $1.96 billion and cites a
      2021 funding-round valuation of about $2.17 billion. These are different instruments,
      dates, and evidentiary contexts; they cannot be averaged into a 2026 fair value, and
      the pool does not disclose liquidation preferences, dilution, debt, or cash. Nate also
      reports a much higher possible IPO narrative, but labels it as an aspiration tied to
      future operating profit. Entry discipline should therefore require a current cap table,
      round or secondary price, preference stack, net cash, and a bridge from revenue to
      free cash flow. Without those inputs, precision would be false.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV001]
  - id: scenarios-and-diligence
    title: Scenarios, exits, and thesis-break triggers
    body: >-
      Scenario underwriting should be anchored to the observable operating drivers rather
      than an unsupported headline multiple. The bull case requires advertising growth to
      compound while the platform adds fee or business-service revenue and overseas losses
      narrow. The base case assumes Korean dominance remains valuable but domestic growth
      moderates and advertising concentration persists. The bear case combines category
      saturation, advertiser weakness, counterfeit or trust incidents, and continued
      overseas losses; it would compress both earnings and the multiple. CNBC confirms that
      management is pursuing North American expansion, while the KIPO-reported counterfeit
      takedown data shows a monitorable trust burden. An archived Nextdoor snapshot supplies
      a directionally relevant neighborhood-network comparator, but its 2024 revenue and loss
      cannot support a current trading multiple. A decision should move toward buy only
      after current price and cash-flow evidence makes the base case attractive; a failed
      international payback plan, material advertiser contraction, or deterioration in
      transaction trust should be treated as thesis-break signals.
    claimRefs: [CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV003]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: "Recommendation: track"
    body: Public evidence supports a valuable, profitable Korean network but not a current entry price. Keep the company on the diligence track and require financing terms, cash-flow disclosure, and overseas unit economics before underwriting a buy.
    claimRefs: [CV003, CV006, CV008]
  - calloutType: risk
    title: Primary valuation risk
    body: Advertising concentration and domestic saturation create a narrow bridge from user scale to incremental earnings; international losses and trust controls could absorb the value of future growth.
    claimRefs: [CV004, CV009, CV010]
