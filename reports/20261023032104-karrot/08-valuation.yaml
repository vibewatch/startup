    claimRefs: [CV003, CV005, CV006, CV008, CV009]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Local network advantage, "21.27m Korean MAU and nearly 80% category share in May 2025", "Sustained MAU and advertiser retention outside Korea"]
      - [Monetization proof, "2024 revenue 189.1bn won and operating profit 37.6bn won", "Audited revenue bridge and free-cash-flow conversion"]
      - [Advertising concentration, "More than 99% of 2024 revenue was advertising", "Material fee or services revenue with no engagement damage"]
      - [Core marketplace monetization, "An independent guide describes peer-to-peer transactions as carrying no platform fee", "Verified service and advertising yield without weaker engagement"]
      - [International execution, "Canadian and Japanese subsidiaries were loss-making", "Country-level payback and narrowing losses"]
    notes: "Rows compare reported operating evidence with diligence conditions; figures are not independently audited in this chapter."
    claimRefs: [CV001, CV003, CV004, CV009, CV014]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Ads compound; services diversify; overseas losses narrow", "A current price could be attractive if earnings scale faster than dilution", "Execution and trust costs", "Lower than base until current data arrives"]
      - [Base, "Korean leadership persists; domestic growth moderates; ads remain dominant", "Track or buy only at a price supported by current cash earnings", "Saturation and ad concentration", "Most defensible on available evidence"]
      - [Bear, "Ad demand weakens; overseas losses persist; trust incidents rise", "Multiple compression and weaker exit optionality", "Commercialization and platform integrity", "Material downside case"]
      - [IPO-upside case, "Reported profit targets are achieved and public-market premium holds", "Upside depends on an unverified future earnings and multiple path", "Premature valuation narrative", "Speculative"]
      - [Public-comp reference, "Nextdoor reported $247.28M of 2024 revenue and a $98.06M loss", "Directionally relevant operating context only; no current multiple is inferred", "Different geography, economics, and data vintage", "Insufficient for pricing"]
      - [No-price case, "Current mark, preferences, and cash flow remain undisclosed", "No investable return calculation can be completed", "Information asymmetry", "Immediate diligence blocker"]
    notes: "Scenarios are qualitative because the assigned evidence does not provide a current price, fully comparable cohort, net cash, or verified forecast; no numerical valuation range is invented."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV013]
