artifact: financials
slug: karrot
runDate: 2026-10-23
company:
  name: Karrot
chapter:
  number: 4
  title: Financials
  summary: Karrot has moved from a loss-making marketplace toward an advertising-led profit model, but the public record remains period-sensitive and private-company disclosure is incomplete. The core underwriting question is whether Korean advertising cash generation can fund international expansion and trust costs without requiring another financing event.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Karrot's public revenue evidence points to a two-sided platform whose direct user transactions are largely free while monetization is concentrated in local advertising. Biz Chosun reported 189.1 billion won of 2024 revenue, up 48% year over year, with operating profit of 37.6 billion won and advertising representing more than 99% of total revenue; the same report said advertiser count rose 37% and ad placements 52%.       A separate 2024 report on 2023 results described 127.6 billion won of revenue, 17.3 billion won of annual operating profit and advertising revenue growing more than 2.5 times year over year. These figures are not interchangeable: they refer to different periods and source presentations. Moloco's customer case study supports the monetization mechanism, describing OTT awareness advertising followed by mobile retargeting optimized for actions such as Explore and Chat, but it does not disclose Karrot's realized pricing or margin. The resulting revenue quality is promising but concentrated: underwriting should treat advertising yield, advertiser retention, placement quality and community-trust effects as the principal diligence variables rather than assume transaction volume equals revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-leverage
    title: Profitability and cost structure
    body: >-
      The available evidence suggests operating leverage in the Korean parent, but not a clean consolidated margin history. Platum's report on 2023 results said Karrot generated 127.6 billion won of revenue and 17.3 billion won of operating profit, while consolidated operating loss was 1.1 billion won after overseas and Karrot Pay subsidiary costs. Biz Chosun subsequently reported 2024 operating profit of 37.6 billion won, while Topdaily reported revenue of 270.7 billion won, operating profit of 14.6 billion won and net profit of 23 billion won for the period it described only as "last year." Because the sources differ in period, scope and editorial provenance, the apparent margin path cannot be reconstructed reliably from public data alone. Cost drivers that are visible include international subsidiaries, product expansion, payments infrastructure and trust-and-safety operations; the counterfeit-monitoring evidence also shows that marketplace controls carry operational and reputational cost even when the report does not quantify spend. Gross margin, contribution margin by market, sales and marketing expense, stock-based compensation, working capital and cash flow are not publicly established in the assigned evidence.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-expansion
    title: Capital adequacy and expansion dependency
    body: >-
      Karrot has a substantial historical financing base, but the evidence does not establish current cash, burn or runway. Tracxn lists $205 million raised across four rounds and identifies the August 2021 Series D as $162 million at a $2.7 billion post-money valuation; this is a historical financing record, not evidence of cash still available. A private-market data source instead reports approximately $205.9 million raised and a last reported $1.7 billion valuation in November 2025, explicitly labeling the valuation low confidence and noting that no newer priced event had surfaced. A separate ChosunBiz article syndicated by Nate reported early-investor shares offered at implied valuations of roughly $1.81 billion to $1.96 billion. The differing private-market marks reinforce that valuation and financing terms require primary confirmation. Biz Chosun reported 71.7 billion won invested in the North American market since a 2021 Canadian subsidiary was established, including 36.1 billion won added in the reported year, while Canadian and Japanese subsidiaries posted net losses of 22 billion won and 2.5 billion won respectively in the prior year. CNBC separately described management's plan to expand in North America. Together these disclosures indicate that expansion is a material use of capital, but neither cash on hand nor a next-round trigger is disclosed.
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
    tableRefs: []
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is strongest when framed as a potentially profitable Korean advertising platform with significant user reach, not as a fully disclosed global marketplace compounder. Biz Chosun cited 43 million cumulative domestic sign-ups and described domestic saturation, while Topdaily reported 190 million secondhand transaction connections for the period it called "last year"; neither activity measure is revenue. The adverse KIPO-monitoring report recorded 12,809 counterfeit listings blocked on Karrot through the end of August 2026, the highest count among the 18 monitored open marketplaces, while cautioning that blocked-listing counts may not reflect total counterfeit volume. This does not quantify financial loss, but it is a relevant trust-and-safety diligence issue for monetization and retention. Before underwriting, request audited or management-prepared revenue bridges by stream and geography, advertiser cohorts and realized pricing, contribution margins, cash and debt schedules, subsidiary-level burn, capex and working capital, and the economics of trust controls. Without those inputs, the margin trajectory and financing dependency remain material gaps.
    claimRefs: [CI013, CI014, CI016]
    tableRefs: []

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Public value or status, Quality and interpretation, Diligence ask]
    rows:
      - [Local advertising, "Location- and interest-targeted ads across Karrot surfaces", "More than 99% of 2024 revenue according to Biz Chosun", "Third-party reported; period-specific and company-scope details require reconciliation", "Advertiser cohorts, realized CPM/CPC or contract terms, renewal and concentration"]
      - [Marketplace activity, "Free or largely free peer-to-peer listings and transaction connections", "190 million secondhand transaction connections reported for the prior year", "Activity proxy, not revenue or GMV", "Take rate, paid features, fraud loss, dispute cost and conversion by market"]
      - [Vertical services, "Community, business, part-time jobs, real estate and related services", "Part-time-job applications exceeded 50 million in the reported year", "Usage indicator; monetization by vertical not disclosed", "Revenue contribution, attach rate and unit economics by vertical"]
      - [Karrot Pay and payments, "Planned or expanding hyperlocal financial-service layer", "Expansion described; financial contribution unavailable", "Strategic option, not established revenue", "Regulatory perimeter, payment economics, losses and capital requirements"]
    notes: "Values are reported for different periods and are not a common-year revenue bridge; activity measures must not be treated as revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Monetization surface, List or realized pricing, Evidence, What can be concluded, Missing input]
    rows:
      - [Local advertising, null, "Moloco case study describes campaign execution and retargeting but no Karrot price", "Advertising is a documented mechanism and strategic focus", "Rate card, discounts, realized yield, advertiser retention"]
      - [Peer-to-peer transactions, null, "Public sources describe transaction connections and a free-marketplace heritage", "Transaction volume does not establish a take rate", "Buyer/seller fees, payment attach and fraud/dispute cost"]
      - [International expansion, null, "CNBC and Biz Chosun describe North American expansion and investment", "Growth investment is visible; market-level monetization is not", "Country P&Ls, CAC/payback, local advertiser demand"]
      - [Karrot Pay, null, "Platum describes planned financial ecosystem expansion", "Product direction is not a financial forecast", "Licenses, revenue share, loss rates and funding plan"]
    notes: "No retained source provides a public Karrot rate card or realized contract pricing; nulls are evidence gaps, not zero prices."
    claimRefs: [CI003, CI011, CI012]
  - id: TI003
    title: Unit economics and underwriting readiness
    columns: [Metric, Value, Confidence, Why it matters, Diligence request]
    rows:
      - [Revenue growth, "48% YoY in 2024 to 189.1 billion won", medium, "Indicates strong reported top-line momentum", "Reconcile audited scope, currency and recognition"]
      - [Operating margin, "37.6 billion won operating profit on 189.1 billion won revenue in 2024", medium, "Suggests positive reported operating leverage", "Obtain consolidated income statement and subsidiary eliminations"]
      - [Advertising concentration, ">99% of total revenue in 2024", medium, "Creates platform and advertiser-cycle concentration", "Provide advertiser concentration, cohort retention and yield by format"]
      - [Cash runway, null, unavailable, "Determines whether overseas investment requires new financing", "Cash, burn, debt, commitments and board-approved runway case"]
      - [CAC/payback, null, unavailable, "Tests whether expansion can scale economically", "Market-level acquisition spend, payback and contribution margin"]
      - [Gross margin, null, unavailable, "Separates ad gross economics from service and trust costs", "Revenue recognition, hosting, payment, moderation and support costs"]
      - [Working capital, null, unavailable, "Can affect cash conversion in payments and marketplace operations", "Receivables, payables, escrow and settlement terms"]
      - [International contribution margin, null, unavailable, "Tests whether Korea subsidizes overseas growth", "Country P&Ls for Canada, Japan, United States and other material markets"]
    notes: "Reported financial metrics are not a substitute for cash flow, unit economics or audited segment disclosure; null values require specific diligence."
    claimRefs: [CI001, CI005, CI006, CI011, CI012]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: User activity and advertiser demand feed an advertising-led revenue stream, while international and trust investments determine consolidated profitability.
    data:
      nodes:
        - id: users
          label: Local users and community activity
          detail: "Cumulative sign-ups, monthly activity and transaction connections create audience and intent signals."
        - id: advertisers
          label: Local businesses and brands
          detail: "Advertisers buy targeted exposure; realized pricing and retention are not publicly disclosed."
        - id: ad-products
          label: Targeted advertising products
          detail: "Officially described campaign surfaces include OTT awareness and mobile retargeting."
        - id: revenue
          label: Advertising revenue
          detail: "Reported as more than 99% of 2024 revenue by Biz Chosun."
        - id: investment
          label: Expansion and trust costs
          detail: "Overseas subsidiaries, payments, moderation and counterfeit response affect consolidated economics."
        - id: profit
          label: Consolidated operating result
          detail: "Reported profit measures vary by period and scope; a reconciled margin bridge is unavailable."
      edges:
        - [users, advertisers]
        - [advertisers, ad-products]
        - [ad-products, revenue]
        - [revenue, investment]
        - [investment, profit]
    approximationNotes: "The flow is a sourced business-model representation, not a proportional waterfall; no conversion rates or margin allocations are inferred."
    claimRefs: [CI002, CI003, CI005, CI011, CI013]

callouts:
  - calloutType: strength
    title: Korean monetization has reached reported profitability
    body: "Independent reporting describes strong revenue growth and positive operating profit, with advertising as the dominant monetization engine."
    claimRefs: [CI001, CI005]
  - calloutType: risk
    title: Global expansion and trust costs are not underwritten
    body: "International subsidiary losses, capital investment and counterfeit-monitoring exposure are visible, but cash runway, contribution margins and control costs are not disclosed."
    claimRefs: [CI011, CI012, CI013, CI014]
  - calloutType: recommendation
    title: Make segment economics a financing condition
    body: "Require reconciled segment P&Ls, advertiser cohorts, cash and burn schedules, and country-level contribution margins before underwriting a higher valuation."
    claimRefs: [CI006, CI011, CI012]

