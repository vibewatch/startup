company:
  name: Karrot
chapter:
  number: 1
  title: Company Overview
  summary: Karrot is a South Korean hyperlocal community and secondhand marketplace that has expanded into local jobs, groups, advertising, payments, and other services. The assigned evidence supports strong 2025 growth and a predominantly advertising-led Korean model, while founder and board disclosure, headcount, exact capital structure, and overseas economics remain incomplete.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Karrot, also known locally as Danggeun Market, is a neighborhood marketplace built around geographically proximate transactions and community activity. Its consumer proposition is free, local buying and selling with verified users, ratings, private chat, and face-to-face exchange. The platform has expanded beyond listings into local groups, part-time jobs, real estate, payments, and business profiles. The company therefore appears to operate a two-sided local network whose consumer access is free while monetization is concentrated in local advertising and business services. The strongest current evidence is company-reported or media-reported operating data rather than audited public-company disclosure, so the identity and product description are more established than the completeness of the financial picture.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-capital-and-scale
    title: Leadership, capital, and scale
    body: >-
      The evidence names Hwang Do-yeon as CEO and identifies Gary Kim as co-CEO of Danggeun Market in a 2025 CNBC interview. These sources do not establish a complete founder list, board, or succession plan. Karrot’s 2021 Series D was reported at US$162 million and a valuation near US$2.7 billion, while later private-market reporting described the 2021 mark as about US$2.17 billion and a lower range for a 2025 secondary transaction; the exact transaction terms are not disclosed in the assigned evidence. Current operating scale is substantial: reported 2025 revenue was KRW270.7 billion, with 190 million secondhand transactions and 2.65 million cumulative Biz Profiles, but headcount and standardized customer definitions remain unavailable.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-diligence
    title: Milestones and diligence implications
    body: >-
      Karrot’s trajectory runs from a 2015 founding and 2019 UK launch through the 2021 financing, 2022 Canadian launch, standalone profitability reported for 2023 despite a consolidated operating loss, and continued expansion of local services and international operations. In 2025, platform engagement and advertising indicators accelerated, while management continued to describe North American expansion as a strategic priority. The main counterweight is that the platform is exposed to trust and content-moderation issues: Korean government monitoring identified 12,809 counterfeit listings on Karrot through August 2026, although the ministry cautioned that takedown counts do not measure total counterfeit volume. Underwriting should therefore separate reported consolidated revenue and profit from cash generation, overseas losses, user scale, and unresolved governance and control evidence.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
