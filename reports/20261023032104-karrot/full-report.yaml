              - CP005
              - CP010
              - CP014
      - number: '3.2'
        title: Capability and monetization comparison
        blocks:
          - type: paragraph
            body: >-
              Karrot's product proposition is local, verified exchange: its public app listing emphasizes neighborhood
              meetings, mobile and location verification, ratings, private chat, and the absence of professional
              sellers. This is a differentiated trust and proximity bundle, but the same local constraint can limit
              selection and liquidity when density is low. The Korean incumbent advantage is reinforced by an
              advertising engine built on local behavioral data and by adjacent services such as jobs and real estate.
              The competitive response is moving in two directions. Karrot is testing Direct Purchase and brokerage fees
              while Bungaejangter and Junggonara are more directly adding transaction fees and authentication. Moloco's
              partner case study also shows that Karrot can use first-party behavioral data for targeted campaign
              re-engagement, although partner material is not independent proof of superior conversion economics.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest moat is accumulated local density combined with trust mechanisms and a broad community
              surface. It is harder for a new entrant to reproduce neighborhood liquidity and reputation history than to
              copy a listing interface. That moat is not absolute. Users can multi-home, sellers can cross-post, and
              large platforms can bundle marketplace distribution with an existing social graph. Karrot's international
              expansion also carries operating and monetization risk: reporting says Canadian and Japanese subsidiaries
              were loss-making in the prior year, while a current report describes Canada as the priority and the UK and
              Japan as slower. Ad concentration creates another displacement vector if local advertiser demand does not
              scale with user density. The counterfeit takedown data is adverse evidence on trust-and-safety execution,
              although the regulator cautions that blocked-listing counts do not measure total counterfeit circulation.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Buyer implications
        blocks:
          - type: paragraph
            body: >-
              For a buyer choosing a local marketplace, Karrot is strongest where neighborhood density, verification,
              ratings, and community engagement outweigh the breadth and reach of a general-purpose platform. Its free
              consumer listing model lowers adoption friction, but the public evidence does not disclose realized seller
              pricing, take rates across markets, or comparable liquidity and retention by country. Buyers should
              therefore distinguish documented capabilities from unverified superiority. The competitive thesis is
              attractive in Korea and conditionally attractive abroad: domestic scale can fund experimentation, while
              overseas success requires proof that trust systems and local density can overcome incumbent distribution.
              The key diligence trigger is repeatable non-ad monetization without eroding the community experience that
              differentiates the product.
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Domestic density is the clearest moat
            body: >-
              Karrot's lead in Korean marketplace usage and its integrated verification, ratings, and community surface
              create a stronger starting position than a feature comparison alone would suggest.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: International proof is the gating issue
            body: >-
              The assigned evidence describes Canada as a priority but also reports losses in overseas subsidiaries and
              slower UK and Japan progress; global claims should remain conditional until country-level density and
              monetization are disclosed.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Karrot's public revenue evidence points to a two-sided platform whose direct user transactions are largely
              free while monetization is concentrated in local advertising. Biz Chosun reported 189.1 billion won of
              2024 revenue, up 48% year over year, with operating profit of 37.6 billion won and advertising
              representing more than 99% of total revenue; the same report said advertiser count rose 37% and ad
              placements 52%.       A separate 2024 report on 2023 results described 127.6 billion won of revenue, 17.3
              billion won of annual operating profit and advertising revenue growing more than 2.5 times year over year.
              These figures are not interchangeable: they refer to different periods and source presentations. Moloco's
              customer case study supports the monetization mechanism, describing OTT awareness advertising followed by
              mobile retargeting optimized for actions such as Explore and Chat, but it does not disclose Karrot's
              realized pricing or margin. The resulting revenue quality is promising but concentrated: underwriting
              should treat advertising yield, advertiser retention, placement quality and community-trust effects as the
              principal diligence variables rather than assume transaction volume equals revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
