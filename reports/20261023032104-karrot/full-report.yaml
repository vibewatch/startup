  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      User activity and advertiser demand feed an advertising-led revenue stream, while international and trust
      investments determine consolidated profitability.
    data:
      nodes:
        - id: users
          label: Local users and community activity
          detail: Cumulative sign-ups, monthly activity and transaction connections create audience and intent signals.
        - id: advertisers
          label: Local businesses and brands
          detail: Advertisers buy targeted exposure; realized pricing and retention are not publicly disclosed.
        - id: ad-products
          label: Targeted advertising products
          detail: Officially described campaign surfaces include OTT awareness and mobile retargeting.
        - id: revenue
          label: Advertising revenue
          detail: Reported as more than 99% of 2024 revenue by Biz Chosun.
        - id: investment
          label: Expansion and trust costs
          detail: Overseas subsidiaries, payments, moderation and counterfeit response affect consolidated economics.
        - id: profit
          label: Consolidated operating result
          detail: Reported profit measures vary by period and scope; a reconciled margin bridge is unavailable.
      edges:
        - - users
          - advertisers
        - - advertisers
          - ad-products
        - - ad-products
          - revenue
        - - revenue
          - investment
        - - investment
          - profit
    approximationNotes: >-
      The flow is a sourced business-model representation, not a proportional waterfall; no conversion rates or margin
      allocations are inferred.
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Karrot's public evidence supports a layered local-commerce stack spanning identity, ranking, application services,
      generative AI, and trust controls.
    data:
      layers:
        - label: Local identity and context
          modules:
            - label: Local marketplace
              detail: Verified users buy, sell, and trade with others in their community.
            - label: Recommendation radius
              detail: A reported system constrains recommendations to roughly 5 km.
        - label: Intent and ranking
          modules:
            - label: Local recommendation
              detail: A reported system uses a roughly 5 km locality constraint.
            - label: Behavioral signals
              detail: Dwell time and chat initiation are described as value signals.
        - label: Application services
          modules:
            - label: Marketplace and chat
              detail: Users post, browse, message, and arrange local exchange.
            - label: Feature platform
              detail: InfoQ reports an AWS feature platform associated with recommendation improvements.
        - label: AI and trust operations
          modules:
            - label: Translation
              detail: Firebase AI Logic and Gemini Flash Lite are used for an in-app translation flow.
            - label: Safety controls
              detail: Government monitoring, anomaly detection, and dispute mediation address trust risks.
        - label: Measurement and iteration
          modules:
            - label: Outcome signals
              detail: Reported systems track click-through, dwell time, chat initiation, and conversion.
        - label: Market operations
          modules:
            - label: Cross-market rollout
              detail: The product is described across Korea, North America, and Japan, with market-specific execution risk.
    approximationNotes: >-
      Layering is an analytical presentation of separately reported components; it does not assert an undisclosed
      deployment topology.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE012
  - id: FU001
    title: Customer journey from local liquidity to monetization
    type: journey-map
    summary: >-
      Karrot's customer loop starts with verified local supply and demand, then extends into repeat engagement, adjacent
      services, and advertising.
    data:
      nodes:
        - id: local-supply
          label: Local supply
          description: Residents list unwanted goods for free within a nearby community.
          touchpoints:
            - Free listing
            - Neighborhood discovery
        - id: local-demand
          label: Local demand
          description: Nearby buyers discover items and start a private chat.
          touchpoints:
            - Search and feed
            - Chat
        - id: trusted-exchange
          label: Trusted exchange
          description: Verified users meet locally and use ratings to reinforce accountability.
          touchpoints:
            - Location and mobile verification
            - Ratings
            - In-person meetup
        - id: repeat-engagement
          label: Repeat engagement
          description: Transactions and neighborhood information can create repeat visits and relisting.
          touchpoints:
            - Community posts
            - Favorites and notifications
        - id: adjacent-use
          label: Adjacent use cases
          description: Jobs, real estate, and other local services broaden the customer surface.
          touchpoints:
            - Jobs
            - Real estate
            - Local information
        - id: advertiser-monetization
          label: Advertiser monetization
          description: Local businesses and employers buy targeted reach into the accumulated neighborhood audience.
          touchpoints:
            - OTT awareness
            - Mobile retargeting
            - Local ad placements
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU010
      - CU011
      - CU012
