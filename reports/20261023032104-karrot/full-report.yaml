    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Karrot, also known locally as Danggeun Market, is a neighborhood marketplace built around geographically
              proximate transactions and community activity. Its consumer proposition is free, local buying and selling
              with verified users, ratings, private chat, and face-to-face exchange. The platform has expanded beyond
              listings into local groups, part-time jobs, real estate, payments, and business profiles. The company
              therefore appears to operate a two-sided local network whose consumer access is free while monetization is
              concentrated in local advertising and business services. The strongest current evidence is
              company-reported or media-reported operating data rather than audited public-company disclosure, so the
              identity and product description are more established than the completeness of the financial picture.
