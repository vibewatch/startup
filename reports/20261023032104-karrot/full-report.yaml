              - CI005
              - CI011
              - CI013
      - number: '4.2'
        title: Profitability and cost structure
        blocks:
          - type: paragraph
            body: >-
              The available evidence suggests operating leverage in the Korean parent, but not a clean consolidated
              margin history. Platum's report on 2023 results said Karrot generated 127.6 billion won of revenue and
              17.3 billion won of operating profit, while consolidated operating loss was 1.1 billion won after overseas
              and Karrot Pay subsidiary costs. Biz Chosun subsequently reported 2024 operating profit of 37.6 billion
              won, while Topdaily reported revenue of 270.7 billion won, operating profit of 14.6 billion won and net
              profit of 23 billion won for the period it described only as "last year." Because the sources differ in
              period, scope and editorial provenance, the apparent margin path cannot be reconstructed reliably from
              public data alone. Cost drivers that are visible include international subsidiaries, product expansion,
              payments infrastructure and trust-and-safety operations; the counterfeit-monitoring evidence also shows
              that marketplace controls carry operational and reputational cost even when the report does not quantify
              spend. Gross margin, contribution margin by market, sales and marketing expense, stock-based compensation,
              working capital and cash flow are not publicly established in the assigned evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and expansion dependency
        blocks:
          - type: paragraph
            body: >-
              Karrot has a substantial historical financing base, but the evidence does not establish current cash, burn
              or runway. Tracxn lists $205 million raised across four rounds and identifies the August 2021 Series D as
              $162 million at a $2.7 billion post-money valuation; this is a historical financing record, not evidence
              of cash still available. A private-market data source instead reports approximately $205.9 million raised
              and a last reported $1.7 billion valuation in November 2025, explicitly labeling the valuation low
              confidence and noting that no newer priced event had surfaced. A separate ChosunBiz article syndicated by
              Nate reported early-investor shares offered at implied valuations of roughly $1.81 billion to $1.96
              billion. The differing private-market marks reinforce that valuation and financing terms require primary
              confirmation. Biz Chosun reported 71.7 billion won invested in the North American market since a 2021
              Canadian subsidiary was established, including 36.1 billion won added in the reported year, while Canadian
              and Japanese subsidiaries posted net losses of 22 billion won and 2.5 billion won respectively in the
              prior year. CNBC separately described management's plan to expand in North America. Together these
              disclosures indicate that expansion is a material use of capital, but neither cash on hand nor a
              next-round trigger is disclosed.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strongest when framed as a potentially profitable Korean advertising platform with
              significant user reach, not as a fully disclosed global marketplace compounder. Biz Chosun cited 43
              million cumulative domestic sign-ups and described domestic saturation, while Topdaily reported 190
              million secondhand transaction connections for the period it called "last year"; neither activity measure
              is revenue. The adverse KIPO-monitoring report recorded 12,809 counterfeit listings blocked on Karrot
              through the end of August 2026, the highest count among the 18 monitored open marketplaces, while
              cautioning that blocked-listing counts may not reflect total counterfeit volume. This does not quantify
              financial loss, but it is a relevant trust-and-safety diligence issue for monetization and retention.
              Before underwriting, request audited or management-prepared revenue bridges by stream and geography,
              advertiser cohorts and realized pricing, contribution margins, cash and debt schedules, subsidiary-level
              burn, capex and working capital, and the economics of trust controls. Without those inputs, the margin
              trajectory and financing dependency remain material gaps.
            claimRefs:
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Korean monetization has reached reported profitability
            body: >-
              Independent reporting describes strong revenue growth and positive operating profit, with advertising as
              the dominant monetization engine.
            calloutType: strength
            claimRefs:
              - CI001
              - CI005
          - type: callout
            title: Global expansion and trust costs are not underwritten
            body: >-
              International subsidiary losses, capital investment and counterfeit-monitoring exposure are visible, but
              cash runway, contribution margins and control costs are not disclosed.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: callout
            title: Make segment economics a financing condition
            body: >-
              Require reconciled segment P&Ls, advertiser cohorts, cash and burn schedules, and country-level
              contribution margins before underwriting a higher valuation.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Karrot's core workflow is deliberately local: verified users buy, sell, and trade items with other users
              in their community. This makes proximity part of the product mechanism rather than merely a marketing
              position, although the assigned public evidence does not disclose transaction completion or repeat-use
              rates. The product surface also extends beyond secondhand goods into community content and local-service
              promotion. Moloco's case study documents a campaign for Karrot's real-estate service that combined OTT
              awareness with retargeting toward in-app actions such as Explore and Chat. That is evidence of a broader
              service surface, but not evidence that every announced vertical has reached production scale, sustained
              adoption, or repeat usage.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE012
      - number: '5.2'
        title: Recommendation, translation, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              Karrot's product architecture appears to be a set of tightly coupled local-market systems rather than one
              disclosed monolithic stack. A secondary technical account describes a recommendation engine refined over
              five years, moving from click-through rates toward contrastive-learning embeddings and value functions
              using dwell time and chat initiation. It places recommendations within roughly 5 km, which makes geography
              a core retrieval and ranking constraint. A Google developer case study provides a more concrete production
              integration: Karrot used Firebase AI Logic and the Android SDK to call Gemini Flash Lite directly from the
              app for translation, moving from proof of concept in under three hours to production code in two weeks
              without a dedicated backend. InfoQ separately reports a scalable AWS feature platform associated with
              higher article-recommendation click-through and conversion. These sources show specific components and
              integrations, while leaving data contracts, model-serving topology, observability, and rollback procedures
              undisclosed.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE012
      - number: '5.3'
        title: Maturity, differentiation, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The strongest public maturity signal is operational speed: engineers report that a translation proof of
              concept reached production in two weeks, and a technical account reports measurable recommendation
              improvements. Karrot's differentiation is the combination of neighborhood-scale data, local intent
              signals, and first-party behavioral data rather than a generic national marketplace feed. The company is
              also described as formalizing cross-functional AI sharing and pursuing foundation-model-level systems
              trained on local-market data. Those roadmap statements are strategic intent, not verified production
              capability. An independently reported 2026 account says Karrot is developing AI prediction,
              search-quality, anomaly-detection, and retrieval-augmented-generation capabilities while increasing R&D
              spend. The evidence therefore supports active technical investment and a plausible local-data advantage,
              but not durable model superiority, patent protection, or reproducible benchmark leadership.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Trust, safety, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Trust is a product dependency because transactions are between individuals and are often conducted
              directly between individual users. The Korean Intellectual Property Office monitoring data reported by
              Seoul Economic Daily identified 12,809 counterfeit sales listings on Karrot through the end of August
              2026, the highest count among the 18 monitored open marketplaces; the same report cautions that
              blocked-listing counts do not measure total counterfeit volume. Karrot said its direct-user model can
              include private sellers unaware that goods were counterfeit and pointed to a dispute-mediation center.
              This is a material trust-and-safety workload, not proof of platform failure. The public record does not
              establish incident rates, appeal outcomes, security testing, privacy controls for behavioral data,
              translation error rates, service-level objectives, or model rollback procedures. Overseas expansion also
              creates execution risk: a 2026 report describes continued investment despite a loss-making Canadian
              subsidiary while Karrot develops additional AI systems. These gaps should be resolved before treating the
              architecture as production-grade across markets.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Local intent is embedded in the product loop
            body: >-
              Proximity, chat initiation, and behavioral intent signals are part of discovery and conversion, giving
              Karrot a differentiated local data and workflow surface.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: Technical breadth exceeds public control evidence
            body: >-
              Public sources describe multiple AI and marketplace systems, but do not disclose the reliability, privacy,
              security, or safety controls needed to underwrite them.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, seller, and local-business segments
        blocks:
          - type: paragraph
            body: >-
              Karrot serves a three-sided local ecosystem rather than a single buyer cohort. Individual residents are
              both buyers and sellers of secondhand goods, with the product designed around short-distance meetups,
              private chat, verification, and ratings. The same local audience creates an advertising surface for
              neighborhood businesses and employers, while adjacent categories such as jobs and real estate extend the
              use cases. The segmentation is strategically coherent because each additional local use case can increase
              the frequency and utility of the same verified neighborhood graph. It is not yet evidence of recurring
              revenue per customer: the available sources describe reach, placements, and product mechanics more clearly
              than advertiser retention, cohort revenue, or seller monetization.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
      - number: '6.2'
        title: Adoption and usage trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is Korea-specific and combines reported cumulative subscribers, monthly
              active users, market share, and overseas milestones. A 2023 company-reported snapshot cited 36 million
              cumulative subscribers and nearly 19 million monthly active users, while a 2025 industry comparison put
              Korean monthly active users at 21.27 million and described Karrot as holding nearly 80% of the
              used-goods-app market. The figures are not directly interchangeable: they use different dates,
              definitions, and sources, and cumulative subscribers are not active customers. International evidence is
              more directional: Canada reportedly passed one million users and the company planned a roughly 20-person
              Toronto engineering hub, but local retention, transaction liquidity, and revenue conversion are not
              disclosed in the retained sources.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Named deployments, outcomes, and durability
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is concentrated in a partner case study rather than a broad portfolio of
              independently verified production references. Moloco describes Karrot using TVING for an awareness
              campaign and then retargeting Android users toward actions such as Explore and Chat; this is evidence of a
              commercial advertising use case and a measurable conversion workflow, not proof of advertiser-level return
              on ad spend or durable retention. Public product surfaces corroborate the user workflow—local listings,
              verified neighborhoods, chat, and ratings—but do not establish repeat purchase, renewal, net retention, or
              customer concentration. The key durability gap is therefore not whether the marketplace has scale, but
              whether engagement and advertiser demand remain resilient as Korean penetration saturates and overseas
              density is built.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention, expansion, and concentration implications
        blocks:
          - type: paragraph
            body: >-
              Karrot's expansion loop is plausible: free local exchange attracts supply and demand, successful nearby
              transactions create repeat visits, and the resulting audience can be sold to local advertisers. The loop
              has two material constraints. First, density is geographically bounded; the hyperlocal model is strongest
              where enough residents share a small radius, so international expansion must prove liquidity market by
              market. Second, trust and moderation are operating dependencies. Government monitoring identified 12,809
              counterfeit listings blocked on Karrot through August 2026, the highest count among the 18 monitored open
              marketplaces, although the regulator cautioned that blocked-listing counts do not measure total
              counterfeit volume. This creates a customer-trust and seller-quality diligence item even though the
              company provides dispute mediation.
            claimRefs:
              - CU014
              - CU015
      - number: '6.5'
        title: What remains unverified
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support a precise customer-count, retention, or concentration model. There is no
              retained disclosure of gross or net revenue retention, churn, renewal rates, cohort activity, average
              advertiser spend, customer acquisition cost, or country-level transaction liquidity. The reported 43
              million cumulative sign-ups and 21.27 million Korean monthly active users should therefore be treated as
              scale indicators, not as a complete active-customer or revenue-base denominator. Before underwriting
              expansion, diligence should obtain market-by-market active buyers and sellers, repeat-listing and
              repeat-chat cohorts, advertiser renewal and spend concentration, counterfeit and dispute rates, and the
              production-versus-pilot status of named commercial deployments.
            claimRefs:
              - CU017
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Density is the core customer asset
            body: >-
              Karrot's strongest proof is the combination of local verification, high Korean usage, and a free
              transaction model that can create liquidity before monetization.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Retention and international unit economics remain open
            body: >-
              Public evidence does not disclose cohort retention, advertiser renewal, market-level liquidity, or
              customer concentration, making overseas expansion and durable monetization difficult to underwrite
              precisely.
            calloutType: risk
            claimRefs:
              - CU008
              - CU017
          - type: callout
            title: Trust is both product value and operating exposure
            body: >-
              Verification, ratings, and local meetups are customer-facing differentiators, but counterfeit takedowns
              show that marketplace quality and dispute handling remain material dependencies.
            calloutType: insight
            claimRefs:
              - CU002
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis impact
        blocks:
          - type: paragraph
            body: >-
              Karrot's risk profile is concentrated in the interaction between scale and trust. KIPO data reported by
              Seoul Economic Daily show 12,809 counterfeit listings blocked on Karrot through the end of August 2026,
              the highest count among 18 monitored open marketplaces; the same source cautions that blocked-listing
              counts do not measure total counterfeit volume. This is not proof of platform negligence, but it creates
              recurring moderation, dispute, brand, and user-retention exposure. The company said direct peer
              transactions can include private sellers unaware that goods are counterfeit and pointed to its
              dispute-mediation center. The investment implication is that trust controls are a growth asset as well as
              a cost center; deterioration in authenticity, privacy, or transaction safety could damage the local
              network that supports advertising monetization.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The legal surface is expanding before Karrot's detailed compliance perimeter is fully observable. A 2026
              Korean privacy-law analysis describes an amended PIPA with most provisions effective September 11, 2026,
              including possible surcharges of up to 10% of revenue in aggravated cases, board approval and regulator
              notification for certain CPO changes, notification when a breach is possible, and new CEO or
              business-owner accountability. A separate 2026 South Korea privacy guide describes PIPA, the Location
              Information Act, and the AI Framework Act as relevant frameworks, with extraterritorial considerations and
              a 72-hour data-subject notification rule after a breach. The proposed Online Platform Fairness Bill would
              add open-ended conduct, settlement, and transparency obligations, with key details delegated to
              presidential decree. Karrot therefore needs evidence of governance readiness, not merely a compliant
              policy page.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR011
              - CR013
              - CR014
      - number: '7.3'
        title: Operating, security, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Karrot's operating model has two linked vulnerabilities; a high-volume marketplace must preserve safe
              local interactions while an advertising-heavy revenue model must keep user attention and advertiser value
              aligned. Independent reporting says 2024 revenue was 189.1 billion won, operating profit 37.6 billion won,
              and more than 99% of revenue came from advertising; it also reports 43 million cumulative domestic
              sign-ups and concerns that domestic user expansion is nearing saturation. The same reporting says Canadian
              and Japanese subsidiaries posted net losses of 22 billion won and 2.5 billion won respectively in the
              prior year. Moloco's partner case study shows Karrot uses first-party data, behavioral segmentation,
              retargeting, and conversion optimization, which makes data governance and measurement integrity
              operational dependencies. Public evidence does not establish outage frequency, fraud loss, security
              incidents, or cash runway, so these remain diligence gaps rather than assumed strengths or weaknesses.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most decision-useful mitigations are measurable. Management should report counterfeit detection and
              appeal rates, time to remove suspect listings, dispute outcomes, repeat-offender rates, and trust or
              retention metrics by market. Privacy readiness should be tested against the September 2026 PIPA
              obligations and the 2027 ISMS-P milestone, including board-approved CPO governance, incident-notification
              playbooks, data-minimization controls, and documented budget and staffing. International expansion should
              be gated by country-level contribution margin, repeat usage, paid-advertiser retention, and a defined loss
              ceiling rather than aggregate user growth. A thesis break would be a material privacy or platform
              enforcement action, a sustained rise in counterfeit or dispute indicators, evidence that advertising
              degrades engagement, or continued overseas losses without a credible path to contribution profitability.
              These thresholds are diligence asks because the public record does not disclose the needed baselines.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust is the primary operating risk
            body: >-
              The 2026 counterfeit-monitoring count is a scale signal and a control burden, not proof of total
              counterfeit prevalence. Karrot's mitigation claim should be tested with rates, repeat-offender data,
              appeals, and dispute outcomes.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Regulation can reprice the thesis
            body: >-
              PIPA changes and proposed platform rules could increase governance, notification, settlement, and conduct
              obligations. The unresolved issue is implementation detail and Karrot's control readiness, not whether the
              legal perimeter exists.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
          - type: callout
            title: International growth needs a loss gate
            body: >-
              Reported Canadian and Japanese subsidiary losses make country-level contribution economics a decision
              variable. Aggregate user growth is not enough to show that international expansion compounds value.
            calloutType: insight
            claimRefs:
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable case is a dense local network that has expanded beyond listings into community, jobs, real
              estate, and local advertising. Independent reporting describes Karrot as the leading Korean used-goods
              marketplace, with 21.27 million monthly active users in May 2025 and nearly 80% share of the tracked
              category. A 2024 revenue and operating-profit improvement reported by Chosun Biz, together with the
              earlier advertising-led profit evidence in Platum, supports real monetization rather than a purely
              engagement-led story. A current independent user guide also describes the core peer-to-peer transaction as
              carrying no platform fee, reinforcing why monetization depends on adjacent advertising and services. The
              anti-thesis is concentration: Chosun Biz says more than 99% of revenue came from advertising in 2024,
              domestic sign-ups had reached 43 million, and Canadian and Japanese subsidiaries were loss-making. That
              makes valuation sensitive to ad durability, saturation, and whether international expansion can earn
              acceptable returns.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV014
      - number: '8.2'
        title: Price discipline and financing context
        blocks:
          - type: paragraph
            body: >-
              Historical financing evidence is not a current mark. A KoreaTechDesk archive reports a $162 million Series
              D at a $2.7 billion valuation, while a 2025 Nate report describes secondary shares changing hands at
              roughly $1.81 billion to $1.96 billion and cites a 2021 funding-round valuation of about $2.17 billion.
              These are different instruments, dates, and evidentiary contexts; they cannot be averaged into a 2026 fair
              value, and the pool does not disclose liquidation preferences, dilution, debt, or cash. Nate also reports
              a much higher possible IPO narrative, but labels it as an aspiration tied to future operating profit.
              Entry discipline should therefore require a current cap table, round or secondary price, preference stack,
              net cash, and a bridge from revenue to free cash flow. Without those inputs, precision would be false.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios, exits, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario underwriting should be anchored to the observable operating drivers rather than an unsupported
              headline multiple. The bull case requires advertising growth to compound while the platform adds fee or
              business-service revenue and overseas losses narrow. The base case assumes Korean dominance remains
              valuable but domestic growth moderates and advertising concentration persists. The bear case combines
              category saturation, advertiser weakness, counterfeit or trust incidents, and continued overseas losses;
              it would compress both earnings and the multiple. CNBC confirms that management is pursuing North American
              expansion, while the KIPO-reported counterfeit takedown data shows a monitorable trust burden. An archived
              Nextdoor snapshot supplies a directionally relevant neighborhood-network comparator, but its 2024 revenue
              and loss cannot support a current trading multiple. A decision should move toward buy only after current
              price and cash-flow evidence makes the base case attractive; a failed international payback plan, material
              advertiser contraction, or deterioration in transaction trust should be treated as thesis-break signals.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track'
            body: >-
              Public evidence supports a valuable, profitable Korean network but not a current entry price. Keep the
              company on the diligence track and require financing terms, cash-flow disclosure, and overseas unit
              economics before underwriting a buy.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV008
          - type: callout
            title: Primary valuation risk
            body: >-
              Advertising concentration and domestic saturation create a narrow bridge from user scale to incremental
              earnings; international losses and trust controls could absorb the value of future growth.
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV010
