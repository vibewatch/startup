  topStrengths:
    - Dense local network with leading Korean marketplace reach and substantial transaction activity.
    - Advertising-led monetization has reached reported profitability in the Korean business.
    - Direct Purchase and adjacent services provide potential revenue diversification beyond advertising.
  topRisks:
    - Revenue concentration in advertising leaves the model exposed to ad demand, pricing, and trust effects.
    - Overseas subsidiaries remain loss-making and their unit economics are not disclosed.
    - Current valuation, financing terms, cash generation, and preference-stack implications are unverified.
  unresolvedGaps:
    - Standardized 2024-2026 financial disclosure, including revenue bridges, margins, and cash generation.
    - Country-level unit economics for Canada and other meaningful non-Korean markets.
    - Exact pricing and structure of the 2025 secondary transaction and any preference-stack implications.
    - Management evidence on scaling ads without degrading community trust and engagement.
