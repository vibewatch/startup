schemaVersion: "report-v2"
artifact: customers
slug: karrot
runDate: 2026-10-23
company:
  name: Karrot
chapter:
  number: 6
  title: Customers
  summary: Karrot's customer engine is a dense, trust-mediated neighborhood marketplace that uses free peer-to-peer activity to build repeat local engagement and monetize primarily through advertising. Adoption evidence is strong in Korea, while international density, retention, and customer-level economics remain less transparent.
sections:
  - id: customer-segments
    title: Buyer, seller, and local-business segments
    body: >-
      Karrot serves a three-sided local ecosystem rather than a single buyer
      cohort. Individual residents are both buyers and sellers of secondhand
      goods, with the product designed around short-distance meetups, private
      chat, verification, and ratings. The same local audience creates an
      advertising surface for neighborhood businesses and employers, while
      adjacent categories such as jobs and real estate extend the use cases.
      The segmentation is strategically coherent because each additional local
      use case can increase the frequency and utility of the same verified
      neighborhood graph. It is not yet evidence of recurring revenue per
      customer: the available sources describe reach, placements, and product
      mechanics more clearly than advertiser retention, cohort revenue, or
      seller monetization.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and usage trajectory
    body: >-
      The strongest adoption evidence is Korea-specific and combines reported
      cumulative subscribers, monthly active users, market share, and overseas
      milestones. A 2023 company-reported snapshot cited 36 million cumulative
      subscribers and nearly 19 million monthly active users, while a 2025
      industry comparison put Korean monthly active users at 21.27 million and
      described Karrot as holding nearly 80% of the used-goods-app market. The
      figures are not directly interchangeable: they use different dates,
      definitions, and sources, and cumulative subscribers are not active
      customers. International evidence is more directional: Canada reportedly
      passed one million users and the company planned a roughly 20-person
      Toronto engineering hub, but local retention, transaction liquidity, and
      revenue conversion are not disclosed in the retained sources.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named deployments, outcomes, and durability
    body: >-
      Named customer proof is concentrated in a partner case study rather than
      a broad portfolio of independently verified production references.
      Moloco describes Karrot using TVING for an awareness campaign and then
      retargeting Android users toward actions such as Explore and Chat; this is
      evidence of a commercial advertising use case and a measurable conversion
      workflow, not proof of advertiser-level return on ad spend or durable
      retention. Public product surfaces corroborate the user workflow—local
      listings, verified neighborhoods, chat, and ratings—but do not establish
      repeat purchase, renewal, net retention, or customer concentration. The
      key durability gap is therefore not whether the marketplace has scale,
      but whether engagement and advertiser demand remain resilient as Korean
      penetration saturates and overseas density is built.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: retention-expansion-risks
    title: Retention, expansion, and concentration implications
    body: >-
      Karrot's expansion loop is plausible: free local exchange attracts supply
      and demand, successful nearby transactions create repeat visits, and the
      resulting audience can be sold to local advertisers. The loop has two
      material constraints. First, density is geographically bounded; the
      hyperlocal model is strongest where enough residents share a small radius,
      so international expansion must prove liquidity market by market. Second,
      trust and moderation are operating dependencies. Government monitoring
      identified 12,809 counterfeit listings blocked on Karrot through August
      2026, the highest count among the 18 monitored open marketplaces, although
      the regulator cautioned that blocked-listing counts do not measure total
      counterfeit volume. This creates a customer-trust and seller-quality
      diligence item even though the company provides dispute mediation.
    claimRefs: [CU014, CU015]
  - id: customer-evidence-gaps
    title: What remains unverified
    body: >-
      The evidence does not support a precise customer-count, retention, or
      concentration model. There is no retained disclosure of gross or net
      revenue retention, churn, renewal rates, cohort activity, average
      advertiser spend, customer acquisition cost, or country-level
      transaction liquidity. The reported 43 million cumulative sign-ups and
      21.27 million Korean monthly active users should therefore be treated as
      scale indicators, not as a complete active-customer or revenue-base
      denominator. Before underwriting expansion, diligence should obtain
      market-by-market active buyers and sellers, repeat-listing and repeat-chat
      cohorts, advertiser renewal and spend concentration, counterfeit and
      dispute rates, and the production-versus-pilot status of named commercial
      deployments.
    claimRefs: [CU017]
tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer/user/payer, Use case, Scale or value signal, Diligence gap]
    rows:
      - [Residents selling goods, "User and seller", "List unwanted household goods and chat with nearby buyers", "Free listings and local meetups create supply density", "Repeat listing rate and seller retention are undisclosed"]
      - [Residents buying goods, "User and buyer", "Find nearby secondhand items and arrange a local exchange", "Verified-neighborhood discovery and ratings reduce transaction friction", "Conversion from listing view to completed transaction is undisclosed"]
      - [Local advertisers and employers, "Payer / business customer", "Reach geographically targeted residents through local advertising and job listings", "Advertising is described as the primary revenue source; 2024 advertiser count reportedly rose 37%", "Advertiser renewal, spend concentration, and ROAS are undisclosed"]
      - [Adjacent service users, "User / potential payer", "Use local jobs, real estate, community, and payment-related services", "Company and partner sources describe expansion beyond secondhand trading", "Production adoption and monetization by vertical are not separated"]
    notes: "Segments combine product mechanics and reported adoption signals; scale indicators are not equivalent to paying-customer counts, and null gaps mark undisclosed retention or economics."
    claimRefs: [CU001, CU003, CU004, CU006]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date, Source and confidence, Implication, Missing denominator]
    rows:
      - ["Cumulative subscribers", "36 million", "2023", "BusinessKorea report citing Karrot criteria; medium", "Large Korean installed base", "Active share and duplicate-account treatment"]
      - ["Monthly active users", "Nearly 19 million", "2023", "BusinessKorea report citing Karrot criteria; medium", "Material recurring usage in Korea", "MAU definition and cohort retention"]
      - ["Korean used-goods-app MAU", "21.27 million", "2025-05", "Chosun Biz citing WiseApp Retail; high", "Karrot held a leading domestic position", "Cross-platform methodology and revenue conversion"]
      - ["Share of Korean used-goods-app market", "Nearly 80%", "2025-05", "Chosun Biz citing WiseApp Retail; high", "Domestic penetration may constrain incremental growth", "Denominator and category boundary"]
      - ["Canadian users", "More than 1 million", "2024", "Techtalent report citing company disclosure; medium", "North American foothold exists", "Active users, transaction liquidity, and monetization"]
      - ["Advertisers / ad placements", "+37% / +52% year over year", "2024", "Chosun Biz report; high", "Advertising demand and inventory expanded", "Advertiser retention, spend per account, and margin"]
    notes: "The rows use different populations and definitions; cumulative subscribers, MAU, market share, and ad metrics must not be treated as a single conversion funnel."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU014]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: "Publicly documented named or described deployments retained from partner, product, and international expansion sources available for this chapter."
    columns: [Customer or counterparty, Segment, Deployment/use case, Production vs pilot, Outcome or signal, Limitation]
    rows:
      - ["TVING", "Consumer media / advertising partner", "OTT campaign for Karrot's real-estate service", "Campaign deployment described by Moloco", "Awareness reach followed by mobile retargeting", "No retained spend, lift, or renewal data"]
      - ["Android users exposed to TVING campaign", "Existing Karrot users", "Retargeting toward Explore and Chat actions", "Campaign workflow, not a customer reference", "Behavioral targeting linked awareness to in-app actions", "No conversion rate or incremental lift disclosed"]
      - ["Local stores and companies", "Advertiser cohort", "Geographically targeted local advertising", "Commercial customer category, not named accounts", "Local advertising is described as Karrot's main monetization route", "No named-account retention or revenue concentration"]
      - ["Canadian users / communities", "International residents", "Local marketplace expansion in Canada", "Operating market; customer status and activity mix unclear", "Reported user base exceeded one million", "No market-level active, repeat, or monetized cohort data"]
    notes: "Named or described counterparties are retained only where the source states a concrete use case; outcomes are not interpreted as independently audited performance."
    claimRefs: [CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey from local liquidity to monetization
    type: journey-map
    summary: Karrot's customer loop starts with verified local supply and demand, then extends into repeat engagement, adjacent services, and advertising.
    data:
      nodes:
        - id: local-supply
          label: "Local supply"
          description: "Residents list unwanted goods for free within a nearby community."
          touchpoints: ["Free listing", "Neighborhood discovery"]
        - id: local-demand
          label: "Local demand"
          description: "Nearby buyers discover items and start a private chat."
          touchpoints: ["Search and feed", "Chat"]
        - id: trusted-exchange
          label: "Trusted exchange"
          description: "Verified users meet locally and use ratings to reinforce accountability."
          touchpoints: ["Location and mobile verification", "Ratings", "In-person meetup"]
        - id: repeat-engagement
          label: "Repeat engagement"
          description: "Transactions and neighborhood information can create repeat visits and relisting."
          touchpoints: ["Community posts", "Favorites and notifications"]
        - id: adjacent-use
          label: "Adjacent use cases"
          description: "Jobs, real estate, and other local services broaden the customer surface."
          touchpoints: ["Jobs", "Real estate", "Local information"]
        - id: advertiser-monetization
          label: "Advertiser monetization"
          description: "Local businesses and employers buy targeted reach into the accumulated neighborhood audience."
          touchpoints: ["OTT awareness", "Mobile retargeting", "Local ad placements"]
    claimRefs: [CU001, CU002, CU003, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Density is the core customer asset
    body: "Karrot's strongest proof is the combination of local verification, high Korean usage, and a free transaction model that can create liquidity before monetization."
    claimRefs: [CU001, CU005, CU006, CU007]
  - calloutType: risk
    title: Retention and international unit economics remain open
    body: "Public evidence does not disclose cohort retention, advertiser renewal, market-level liquidity, or customer concentration, making overseas expansion and durable monetization difficult to underwrite precisely."
    claimRefs: [CU008, CU017]
  - calloutType: insight
    title: Trust is both product value and operating exposure
    body: "Verification, ratings, and local meetups are customer-facing differentiators, but counterfeit takedowns show that marketplace quality and dispute handling remain material dependencies."
    claimRefs: [CU002, CU014, CU015]
