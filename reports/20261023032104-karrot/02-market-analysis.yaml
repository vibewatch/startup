          claimRefs: [CM006]
        - label: "2024 estimate"
          value: 35
          unit: "trillion won"
          note: "Seoulz report's estimate."
          claimRefs: [CM006]
        - label: "2025 upper estimate"
          value: 43
          unit: "trillion won"
          note: "Seoulz reports projections as high as this value."
          claimRefs: [CM006]
        - label: "Karrot Canada registered users"
          value: 1
          unit: "million users"
          note: "Separate expansion lens; not comparable to market value."
          claimRefs: [CM009]
    approximationNotes: >
      Ordered layers mix a market-value time series with a company expansion
      metric only to show distinct sizing lenses; they are not additive and do
      not imply a TAM-to-SAM-to-SOM conversion.
    claimRefs: [CM006, CM009]
