schemaVersion: "report-v2"
artifact: market-analysis
slug: karrot
runDate: 2026-10-23
company:
  name: Karrot
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Karrot operates at the intersection of South Korea's dense, mobile-first
    e-commerce market and a growing secondhand economy where trust and local
    proximity reduce transaction friction. The evidence supports a large and
    expanding demand base, but the addressable market is better treated as
    multiple constrained lenses than as a single validated TAM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >
      Karrot's core market is local, peer-to-peer resale and neighborhood
      discovery: users list household and lifestyle goods, find nearby buyers,
      chat, and complete an in-person handoff. The product explicitly removes
      shipping and packaging from the default workflow, and its Canadian
      materials describe location and mobile verification, ratings, private
      chat, and restrictions on professional sellers. That boundary excludes
      national shipped marketplaces, retailer e-commerce, authenticated
      high-value resale, and professional classified inventory, although those
      categories are substitutes for a buyer or seller deciding where to
      transact. Adjacent spend includes local jobs, real estate, automotive,
      community groups, and advertising to neighborhood businesses. The
      distinction matters for valuation: transaction volume can create
      engagement and local intent without being equivalent to platform revenue.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through multiple lenses
    body: >
      The strongest sizing evidence is a set of different lenses rather than a
      single top-down number. A Seoulz market account reports South Korea's
      secondhand economy rising from roughly 4 trillion won in 2008 to about
      24 trillion won in 2021, with estimates near 26 trillion won in 2023,
      around 35 trillion won in 2024, and as high as 43 trillion won by 2025.
      Those figures are directional and have not been independently reconciled
      here. A separate trade source places Korea's 2025 e-commerce market at
      approximately $200 billion, with mobile purchases at about 77% of sales;
      this is a broad ceiling, not Karrot's obtainable market. Karrot's own
      Canada evidence supplies a constrained expansion lens: more than one
      million registered Canadian users and a stated plan to enter more than 50
      additional markets across Canada and the United States over five years.
      These lenses support market depth and exportability, but they do not
      establish SAM, SOM, take rate, or a comparable revenue denominator.
    claimRefs: [CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-economics
    title: Buyers, adoption drivers, and constraints
    body: >
      The adoption path starts with a resident or household selling or buying
      an item, then expands through repeat local usage and adjacent services.
      Buyers and sellers are the users, while local merchants are a distinct
      payer for advertising and business tools. The product's trust stack
      combines geographic and mobile verification, ratings, approximate
      location sharing, fraud detection, and increasingly AI-assisted listing
      creation. Korea's near-universal internet access and approximately 96%
      smartphone penetration support frequent mobile use, while local
      transactions avoid shipping and reduce coordination cost. Constraints are
      equally material: counterfeit listings remain a live platform-management
      problem; the Korean Intellectual Property Office recorded 12,809 blocked
      counterfeit listings on Karrot through the end of August 2026, while
      noting that raw takedown counts do not measure total counterfeit volume.
      International expansion also requires cultural localization and local
      trust-building, so geographic rollout is not simply a supply-side switch.
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The market asset is local trust, not just listings
    body: >
      Karrot's differentiation is most credible where proximity, verification,
      and reputation lower perceived risk; broad e-commerce market size should
      not be used as a direct proxy for Karrot revenue.
    claimRefs: [CM001, CM004, CM009]
  - calloutType: risk
    title: Expansion and trust are coupled
    body: >
      Counterfeit monitoring and the need to localize culture and safety
      practices can raise the cost and time required to convert market demand
      into durable cross-border liquidity.
    claimRefs: [CM011, CM014, CM015]
