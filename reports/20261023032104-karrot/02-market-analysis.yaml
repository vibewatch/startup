      - [Local peer-to-peer resale, "Nearby listing, chat, and in-person handoff for used goods", "National shipped marketplaces and professional inventory", "Residents and households", "Core Karrot use case"]
      - [Neighborhood community, "Local questions, recommendations, groups, and social discovery", "National social networks without neighborhood transaction context", "Residents; local organizations", "Engagement adjacency"]
      - [Local merchant advertising, "Paid reach to nearby residents through business profiles and ads", "Broad national brand advertising with no local targeting", "Small and neighborhood businesses", "Potential payer layer"]
      - [Adjacent local services, "Jobs, real estate, automotive, and related listings", "Authenticated luxury resale and general retailer commerce", "Job seekers, households, businesses", "Expansion adjacency; separate economics"]
    notes: >
      Boundary is synthesized from Karrot product descriptions and public
      market context; categories are not additive and no total spend is
      assigned to Karrot.
    claimRefs: [CM001, CM002, CM003, CM005]
  - id: TM002
    title: Market sizing lenses
    columns: [Publisher/source, Year or period, Geography, Value, CAGR or growth, Methodology, Confidence, Limitation]
    rows:
      - [Seoulz, "2008-2025", "South Korea", "4T won in 2008; 24T in 2021; estimates 26T in 2023, 35T in 2024, up to 43T in 2025", "Directional multi-year expansion", "Reported market estimates in a secondary market account", medium, "Not independently reconciled; estimate range is not Karrot revenue"]
      - [U.S. Commercial Service, 2025, "South Korea", "$200B e-commerce market", "Approximately 5% versus 2024", "Country commercial guide market overview", medium, "All e-commerce, not secondhand or Karrot-addressable spend"]
      - [U.S. Commercial Service, 2025, "South Korea", "77% of e-commerce sales mobile", "Mobile penetration lens", "Country commercial guide mobile-channel statistic", medium, "Channel share does not establish resale demand or monetization"]
      - [KED Global, 2024, "Canada", "More than 1M Karrot subscribers", "Rapid increase reported", "News report citing company expansion disclosure", medium, "Registered users are not active users, GMV, or revenue"]
      - [BetaKit, "2022-2023 context", "Canada and North America", "More than 1M registered Canadian users; 50+ planned new markets over five years", "Expansion plan", "Interview-based report of company plans", medium, "Company-reported plan; execution and unit economics remain open"]
    notes: >
      Values use each source's own units and denominators. The rows are
      alternative lenses and must not be summed into TAM/SAM/SOM.
    claimRefs: [CM006, CM007, CM008, CM009, CM010]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Household seller, "Resident with unwanted goods", Seller, "Household; no listing fee", "Photo, AI-assisted listing, chat, local handoff", "Decluttering and avoiding shipping"]
      - [Local buyer, "Resident seeking affordable goods", Buyer, "Individual household", "Search, chat, meeting, rating", "Price and nearby availability"]
      - [Neighborhood merchant, "Local business", "Nearby residents reached by ads", "Merchant marketing budget", "Business profile and targeted promotion", "Need for local demand and measurable reach"]
      - [International market entrant, "Karrot regional team", "Local residents in new city", "Karrot expansion budget", "Localize trust, safety, and community norms", "Dense market and sufficient local liquidity"]
    notes: >
      User, payer, and budget owner are separated because household
      transactions are free while merchant advertising and expansion have
      different economic owners.
    claimRefs: [CM001, CM004, CM005, CM010, CM014]
