      missingEvidence: "Country-level liquidity, retention, take rate, advertising yield, and contribution margin for Korea, Canada, and other markets."
      whyItMatters: "Registered users and market-size estimates do not show whether expansion creates durable cash-generating density."
      diligencePath: "Obtain market-level cohorts, active-user definitions, transaction frequency, advertiser conversion, and fully loaded market-entry costs."
      relatedQuestionRefs: [QM006]
