      - [Communicate across languages, Read listing and chat content, Gemini-assisted translation banner, Buyers offered translation were reported as 2.4X more likely to start a seller chat, Company-observed result lacks experiment design and denominator detail]
      - [Promote a local service, Reach and re-engage prospective users, OTT campaign plus behavioral retargeting, Campaign optimized for Explore and Chat actions, Case study does not disclose durable cohort economics]
      - [Resolve suspected counterfeit, Report or dispute a transaction, Platform mediation plus listing takedown requests, Monitoring identified and blocked listings, Outcome and recurrence rates are not public]
    notes: "Benefits are either source-reported or company/partner case-study observations; they are not independent estimates of product-wide performance."
    claimRefs: [CE001, CE003, CE006, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Local product context, Constrain discovery to nearby users, Reported recommendation radius of roughly 5 km, "Coverage, cold-start, and cross-market consistency"]
      - [Ranking and recommendation, Match listings to local intent, "Embeddings, value functions, and behavioral signals", "Bias, cold start, and opaque benchmark quality"]
      - [Feature and application services, Serve product experiences and recommendations, AWS feature platform and mobile application services, "Availability, cost, and rollback evidence not disclosed"]
      - [Generative AI features, Translate and support new product workflows, "Firebase AI Logic, Gemini Flash Lite, prompts, and remote configuration", "Vendor dependence, quality drift, and data handling"]
      - [Trust and moderation, Detect and resolve harmful or counterfeit activity, "Monitoring, anomaly detection, ratings, and mediation", "False positives, appeals, and adversarial adaptation"]
    notes: "This is an evidence-bounded operating model, not a disclosed reference architecture; components and dependencies are retained only where the assigned sources describe them."
    claimRefs: [CE004, CE005, CE006, CE010, CE012]
