    {
      "id": "SO002",
      "title": "Founding History and Corporate Evolution",
      "body": "Acronis traces its origins to 2003 when it was spun off from SWsoft (later Parallels) in Singapore by co-founders Serguei Beloussov (known as Serg Bell) and Ilya Zubarev. The company initially focused on disk imaging and backup software for Windows systems, establishing its first flagship product True Image in 2004 which became synonymous with consumer backup solutions. In 2008, Acronis incorporated in Switzerland to establish a European legal domicile while maintaining its Singapore operations. The company underwent significant strategic evolution between 2019 and 2024, transitioning from a traditional backup vendor to an integrated cyber-protection platform combining backup, disaster recovery, endpoint security, and email security. This transformation accelerated following the departure of founder Serg Bell in September 2021 amid regulatory scrutiny, with Patrick Pulvermueller assuming the CEO role to professionalize operations. The appointment of Jan-Jaap (JJ) Jager as CEO in November 2025 marks the latest leadership transition, bringing extensive enterprise software experience from Salesforce and Adobe to guide Acronis through its next growth phase under EQT ownership.",
      "claimRefs": [
        "CO002",
