    {
      "id": "SO003",
      "title": "Investment History and Ownership Structure",
      "body": "Acronis has raised approximately $658 million in disclosed equity financing across multiple growth rounds, establishing a trajectory from startup to multi-billion-dollar enterprise. The company's first major institutional round came in September 2019 with a $147 million Series B investment led by Goldman Sachs Principal Strategic Investments, which valued Acronis at over $1 billion and marked its unicorn status. CVC Capital Partners led a $250 million round in 2021 at an approximately $2.5 billion valuation, followed by BlackRock leading another $250 million investment in early 2022 at a $3.5 billion valuation. The transformative ownership change came in August 2024 when EQT, a Swedish private equity firm, acquired a majority stake in Acronis at a valuation reported between $3.5 billion and $4 billion, with existing investors CVC, BlackRock, and Springcoast retaining minority positions. The current cap table reflects EQT's controlling interest alongside these financial sponsors, with governance influenced by board representatives from each major stakeholder including Johannes Reichel from EQT and Daniel Williamson from CVC Capital Partners.",
