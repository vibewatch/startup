summary:
  headline: >-
    Acronis is a credible channel-anchored cyber-protection platform with a fresh EQT capital event at an implied $3.5B
    EV, but no audited financials and a first-ever FASCSA federal exclusion order make this a research-more, not a
    conviction, story for 2026 underwriting.
