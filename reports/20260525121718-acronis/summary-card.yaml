  topStrengths:
    - >-
      Channel-first MSP motion with 20,000+ partners protecting 750,000+ end businesses is the largest disclosed MSP
      cyber-protection footprint in the public dataset.
    - >-
      Fully published list pricing across per-workload and per-GB models gives unusual transparency on monetization for
      a private vendor.
    - >-
      Fresh EQT majority capital event (August 2024, ~$3.5B EV) provides 5–7 year runway and removes the near-term
      primary-raise dependency.
    - >-
      Converged product surface (backup + security + endpoint management) lets MSPs consolidate vendor sprawl, which is
      a documented driver of partner retention.
    - >-
      44+ Acronis-hosted data center regions support sovereign and regulated buyers that hyperscaler-first peers
      struggle to serve.
  topRisks:
    - >-
      The September 2025 FASCSA exclusion and October 2025 GSA Advantage delisting carve U.S. federal sales out of the
      pipeline and create an unquantified revenue headwind.
    - >-
      No audited financials are public; every revenue, margin, NRR, CAC and capital-efficiency figure is tracker-derived
      or peer-inferred rather than disclosed.
    - >-
      Third-party trackers disagree materially on lifetime equity raised (Latka $408M vs. Tracxn $658M) and on headcount
      YoY (Tracxn -13% vs. Revelio +8%), reducing confidence in any single private-tier datapoint.
    - >-
      Founder geopolitics and Russia/CIS engineering exposure remain a persistent backdrop risk against Western federal
      and defense procurement.
    - >-
      Hyperscaler-native backup (AWS Backup, Azure Backup Center, Google Backup & DR) is a structural substitution risk
      for the cloud-native portion of the SAM.
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, EBITDA, cash, debt schedule and NRR / GRR are not in the public record.
    - EQT 2024 transaction primary vs. secondary cash split, debt component and use of funds are not disclosed.
    - Quantified U.S. federal-channel revenue exposure to the FASCSA exclusion has not been disclosed.
    - Revenue mix across MSP Cyber Protect Cloud, enterprise on-prem and consumer streams is qualitative only.
    - Consumer Cyber Protect Home Office "5M+ users" vintage and ARPU are not in the public record.
