  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Exact revenue and ARR figures not publicly disclosed
    whyItMatters: Limits quantitative financial assessment of company health and growth trajectory
    diligencePath: Request financial data room access or seek analyst estimates with methodology
    relatedQuestionRefs:
      - QO017
      - QO018
  - type: private-evidence-only
    severity: minor
    topic: ownership
    missingEvidence: Specific terms and governance rights in EQT acquisition not disclosed
    whyItMatters: Cannot assess detailed cap table structure or voting arrangements
    diligencePath: Review deal documents if available through data room or regulatory filings
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: minor
    topic: competitive-positioning
    missingEvidence: Comprehensive competitive analysis benchmarking Acronis vs peers
    whyItMatters: Cannot fully assess market position relative to Veeam, Rubrik, Cohesity
    diligencePath: Commission analyst report or conduct primary research with MSP channel
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: fascsa
    missingEvidence: Detailed rationale for DNI FASCSA exclusion not publicly explained
    whyItMatters: Cannot definitively assess supply chain security concerns or remediation path
    diligencePath: File FOIA request or engage government affairs counsel for clarification
    relatedQuestionRefs:
      - QO015
      - QO023
  - type: stale
    severity: minor
    topic: founder-departure
    missingEvidence: Nature of regulatory scrutiny around founder departure unclear
    whyItMatters: Cannot fully assess governance risk history or ongoing exposure
    diligencePath: Search court records and regulatory databases for any enforcement actions
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: minor
    topic: ownership-percentages
    missingEvidence: Current equity percentages held by minority investors not disclosed
    whyItMatters: Cannot calculate exact ownership structure for governance analysis
    diligencePath: Request cap table from company or investors if pursuing transaction
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: minor
    topic: competitive-positioning
    missingEvidence: Comprehensive competitive analysis benchmarking Acronis vs peers
    whyItMatters: Cannot fully assess market position relative to Veeam, Rubrik, Cohesity
    diligencePath: Commission analyst report or conduct primary research with MSP channel
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A single reconciled 2026 figure for "data protection and backup software" that Acronis treats as its TAM.
    whyItMatters: >-
      Five major publishers disagree by ~50% (range $10.9B–$18.9B) on the 2026 number, so any TAM-based share
      calculation can be challenged.
    diligencePath: >-
      Triangulate using IDC + Gartner forecasts under NDA, reconcile vendor-revenue bottoms-up; choose one boundary
      definition and footnote alternatives.
    relatedQuestionRefs:
      - QM002
      - QM020
      - QM026
  - type: private-evidence-only
    severity: material
    topic: som
    missingEvidence: Acronis ARR or per-seat ASP that would convert the 750,000-business reach into a revenue SOM.
    whyItMatters: Without revenue or pricing, the implied SOM range ($300M–$900M) is a triangulation, not a verified number.
    diligencePath: Request management ARR, ASP and average customer size from Acronis / EQT under NDA.
    relatedQuestionRefs:
      - QM018
      - QM022
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: Quantified U.S. federal revenue exposure of Acronis pre- and post-FASCSA exclusion.
    whyItMatters: Materiality of the FASCSA SAM compression depends on how much U.S. federal revenue Acronis actually had.
    diligencePath: Ask Acronis for U.S. federal revenue share for 2024/2025 and the immediate revenue impact of the GSA delisting.
    relatedQuestionRefs:
      - QM014
  - type: missing-source
    severity: minor
    topic: substitution
    missingEvidence: Win-loss data of Acronis vs Microsoft 365 native backup / AWS Backup at the SMB tier.
    whyItMatters: >-
      Bottom-of-market substitution risk would directly compress Acronis's growth runway in the segment that anchors its
      customer count.
