              为了给 Acronis 估值找坐标，我们考察一组在邻近市场运营的上市公司。Rubrik (RBRK) 是纯数据安全和备份公司，市值约 $13.7 billion，订阅 ARR 为 $1.46
              billion，隐含远期收入倍数 9-10x。Rubrik 的溢价估值反映其超高速增长：ARR 增速超过 40%，净收入留存超过 120%。Commvault (CVLT) 是更成熟的数据保护厂商，市值约
              $4.4 billion，总 ARR 为 $1.085 billion。Commvault 较温和的 4-5x
