      - number: '7.4'
        title: 治理、财务与退出风险
        blocks:
          - type: paragraph
            body: >-
              EQT 在 August 2024 以 $3.5B+ 估值取得 Acronis 多数股权，带来 PE 典型的 4-6 年退出压力。该时间线与补救 FASCSA
              排除、重建安全可信度、修复竞争位置所需的长周期相冲突。PE 所有权结构可能把短期利润优化置于长期基础设施投入之上，技术债累积和客户流失可能加速。创始人 Serguei Beloussov 于 May 2021 从
              CEO 转任 Chief Research Officer，是一次重要治理演进；但他作为公司俄罗斯出生的技术愿景人物仍深度参与，继续带来国家安全观感问题。新加坡公司住所和瑞士 AG
              架构原本意在释放中立信号，如今在地缘政治碎片化的科技版图中反而变成风险因素。收入集中在 MSP 渠道，带来客户聚合风险：头部 MSP
              合作伙伴贡献不成比例的收入份额，也可能引发渠道冲突。公司历史上未盈利，大量资本重新投向 R&D 和 go-to-market 扩张；在监管不确定性和竞争压力下，持续拿资本可能受限。PE
              持有期间的董事会构成与治理演进值得审查，尤其是潜在重返政府市场所需的国家安全审查要求。员工分布在多个司法辖区，包括东欧有大量工程人员，也引入运营连续性和知识产权保护考量。
