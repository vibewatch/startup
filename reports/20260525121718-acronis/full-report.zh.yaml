      - number: '3.4'
        title: 切换成本、锁定效应、多栖与供应 / 合作伙伴接入
        blocks:
          - type: paragraph
            body: >-
              备份软件一旦部署就出了名地黏，因为客户数据、计划任务、保留策略和恢复运行手册都沉淀在供应商目录里；主要流失向量不是功能不满，而是平台整合事件（M&A、RMM/PSA 重平台化、监管排除）。MSP 从
              Acronis 迁出存在显著切换成本——重新基线租户、重新培训工程师、重建监控 / 告警集成（BackupRadar 等）——但边界也明确：MSP 经常多栖，同时跑两三套备份栈，以服务不同客户
              SLA。因此真正的锁定不是二选一替换，而是钱包份额之争。MSP 渠道里的决定性护城河是分销力：Acronis 的 20,000+ 个 MSP 关系和 #MSPWorld / #AcronisGo
              合作伙伴项目是真资产；但 Kaseya 统一栈（Datto BDR + RMM + PSA + 安全）压缩 MSP 需要从单一供应商采购的表面积，Datto/Kaseya
              交叉销售经济性无人能及，NinjaOne（IPO 后）和 Heimdal（统一 SecOps）等上升挑战者也在边缘蚕食。供应商 /
              合作伙伴接入大体对称：同一批超大规模云厂商（AWS、Azure、Google）托管每个竞争者的云，同一批 MSP 也可以在它们之间重平台化。Acronis 的非对称供应商风险来自地缘政治 / 监管：FASCSA
              驱动的排除完全切断美国联邦供应路径，这一暴露同行没有。
            claimRefs:
