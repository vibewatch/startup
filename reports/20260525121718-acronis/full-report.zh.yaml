      - number: '4.5'
        title: 资本充足性、融资依赖与下一轮触发点
        blocks:
          - type: paragraph
            body: >-
              Acronis 在 EQT 交易后的资本结构高度集中。2024 年 8 月，EQT（通过 EQT X 基金）和 BPEA（Baring Private Equity Asia，也隶属 EQT）以隐含约 USD
              3.5B 企业价值取得控股权（TechCrunch、SiliconAngle、EQT 新闻稿）。BlackRock 管理的基金、CVC Capital Partners VII、Springcoast
              Partners 和 Acronis 创始人滚入少数股权。公司概况编年覆盖了完整轮次历史；本章的财务重点是，EQT 的 PE-X 当期资本很新（2024 年交割），给 Acronis 一个 5–7
              年退出窗口，也意味着近期不会有进一步新股融资事件。EQT 交易中的现金注入规模未披露（以 $3.5B EV 取得控股权，意味着可能混合新股 / 老股，但没有拆分），债务成分也未披露（软件 PE 控股交易通常包含
              4–6x EBITDA 的承诺定期贷款 / unitranche 融资——可对 Acronis 作隐含判断，但未确认）。EQT 新闻稿把资金用途表述为增长 + 产品 + M&A。因此，下一轮触发点是
              2028–2031 年 EQT 退出窗口（IPO 或老股出售），而不是跑道驱动的融资。资本充足性负面信号集中在 2025 年 9 月 FASCSA 排除和 2025 年 10 月 GSA Advantage
              下架（Mayer Brown），这些事件把美国联邦销售从管线中切出，并造成或有收入逆风；Acronis 未量化影响。截至 2026 年 5 月，Layoffs.fyi 未记录 Acronis
              特定的大规模裁员事件，但员工数跟踪器漂移（Tracxn 同比 -13% 为方向性，Revelio 同比 +8% 为方向性——差异本身是数据可靠性标志）是值得监控的软信号。
