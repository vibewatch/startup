      - number: '1.4'
        title: 监管环境与负面事件
        blocks:
          - type: paragraph
            body: >-
              Acronis 曾遭遇值得尽调关注的监管和安全挑战。2025 年 9 月，美国国家情报总监（DNI）发布 FASCSA（联邦采购供应链安全法）排除令，禁止美国情报界使用 Acronis 产品和服务。该命令是
              FASCSA 第 208 条授权下首批命令之一，反映供应链安全顾虑，可能与公司创始人的俄罗斯出身及历史上的俄罗斯关联有关，尽管其公司住所位于瑞士。Acronis True Image 在 2024 至 2026
              年还披露了多个通用漏洞与暴露（CVE），包括 CVE-2024-8767、CVE-2024-49382、CVE-2024-55538 和 CVE-2026-25031，涉及本地权限提升、DLL
              劫持和敏感信息泄露。Acronis 已通过安全公告项目发布补丁，但这些漏洞凸显持续的产品安全风险。创始人 Serg Bell 2021 年离职也发生在监管审查和民事指控报道之后，不过公开记录中具体执法结果有限。
