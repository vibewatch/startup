      - number: '4.3'
        title: 成本结构、毛利率与服务交付成本
        blocks:
          - type: paragraph
            body: >-
              Acronis 的成本结构有四个主要部分——都没有经审计披露，但可用同行基准和产品架构三角测算。(1) 收入成本：云基础设施（Acronis 托管 DC 遍布 44+ 设施，外加 Google/Azure
              托管区域）+ 客户成功 / 支持人员 + 捆绑第三方技术的授权费。同行显示，数据保护平台高效运营时毛利率落在 77–82% 区间（Rubrik GAAP 80%，Commvault 非 GAAP 指引
              81–82%，Veeam 转向 SaaS 后 77%）；考虑 Acronis 更重的本地部署 / 主权足迹，合理预期其处在或低于该区间。(2) R&D：Acronis 维持 TRU（Threat Research
              Unit）和多站点产品工程；SaaS 领导者同行把收入的 18–25% 用于 R&D。(3) S&M：重渠道营销支出（#MSPWorld、#AcronisGo、合作伙伴启动会、赞助）；成长期同行把收入的
              35–50% 用于 S&M。(4) G&A：按同行常态约 10–15%。平台是软件，资本开支不高，但云 DC 扩建（44+ DC）是一次性和持续性都不小的资本开支线，而没有主权足迹的同行（Druva、Rubrik
              的 SaaS 模式）可避开这项。订阅 SaaS 的营运资本压力温和（收款早于费用发生）；但 Acronis 的低触达 MSP 渠道意味着递延收入余额可能很大。所有这些数字都不公开；经审计 P&L、队列级留存和
              CAC/LTV 工作表是优先尽调要求。
