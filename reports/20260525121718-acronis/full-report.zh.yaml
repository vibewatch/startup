  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              September 2025 FASCSA 排除令是美国供应链安全法下最严厉的监管动作。该命令由美国国家情报总监发布，禁止 Acronis AG
              及其关联公司参与情报共同体所有采购，并对更广泛的联邦采购生态设定有约束力的要求。GSA 随即将 Acronis 产品从 GSA Advantage 下架，联邦承包商必须在 30 天内报告、60
              天内移除。该行动源于对外国影响和供应链完整性的担忧，但具体的保密理由未披露。公司总部在瑞士，创始人 Serguei Beloussov 以新加坡为基地（俄罗斯出生，May 2021 卸任
              CEO），工程团队分布在多个司法辖区，所有权与控制结构复杂，因而引发国家安全审查。不同于仅限民用机构的 Kaspersky 禁令，FASCSA 命令从 IC
              发起，释放出对情报共同体特定供应链风险更高层级的担忧。重返联邦市场需要三条路径之一：成功上诉推翻命令，调整公司治理和所有权结构，或证明受管制产品已经实质性修改并解决安全担忧。即便 Acronis 维持 SOC
              2、ISO 27001、HIPAA 合规，缺少 FedRAMP 授权仍进一步限制政府市场准入。国际监管分化可能部分抵消影响，因为欧盟数据主权要求和 Digital Operational Resilience
              Act (DORA) 合规会带来对非美国控制备份方案的需求，但这更像战略转向，而不是对联邦市场损失的缓释。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
