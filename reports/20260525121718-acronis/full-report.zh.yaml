  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价模型与收入确认
        blocks:
          - type: paragraph
            body: >-
              Acronis 通过三条收入流变现。主导收入流是面向 MSP 销售的 Cyber Protect Cloud 订阅，采用两种计费模型之一：按工作负载（每个受保护工作负载固定月费——Cobweb 2026
              年公开价格显示 £19.50/server/mo、£5.70/VM/mo、£2.95/workstation/mo、£2.30/M365 seat/mo、£1.70/mobile/mo）或按 GB（Acronis
              托管存储 £0.05/GB/mo，Google/Azure 托管 £0.06/GB/mo，Advanced DR 为 Acronis 托管 £0.06/GB/mo 或混合 £0.04/GB/mo）。MSP
              必须为每个客户选择一种计费模型；Advanced Backup、Advanced Security、EDR、MDR、Email Security、DLP、Disaster Recovery
              等高级包按工作负载、用户或 GB 叠加授权。按月承诺层级可获得最高 35% 的量级折扣（Acronis Cloud Licensing Guide；Cobweb；Atera
              支持文档）。第二条收入流是直接面向中端市场和企业账户销售 Acronis Cyber Protect（永久授权 + 维护）和 Cyber Infrastructure（按 TB
              计费的软件定义存储），通过直销和分销商完成。第三条是消费者 Cyber Protect Home Office 线（源自 True Image），通过网页和零售渠道销售年度订阅。Acronis
              不披露三条收入流的占比；行业报道和分析师跟踪器评论一致认为 MSP Cyber Protect Cloud 占多数。收入确认遵循订阅软件惯例（云合同期内按比例确认，本地部署永久授权 +
              维护在支持期内按比例确认），但缺少经审计财务报表，ASC 606 / IFRS 15 应用、递延收入余额或剩余履约义务（RPO）披露都没有公开确认。
            claimRefs:
