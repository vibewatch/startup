      - number: '3.3'
        title: 能力、定价、GTM / 分销与信任姿态
        blocks:
          - type: paragraph
            body: >-
              能力上，Acronis 用异常宽的单一代理（备份 + 反恶意软件 + EDR + DLP + 补丁 + RMM 式端点管理 + 电子邮件安全）做差异化，而竞争者通常更窄。Veeam、Rubrik 和
              Cohesity 在企业备份规模和网络恢复工具上匹配或超过 Acronis，但不内嵌 EDR。Datto 在 MSP 集成深度上匹配 Acronis，并捆绑 BDR 硬件。N-able Cove 和
              NinjaOne 在 RMM 集成上匹配，但工作负载广度落后。Microsoft 365 Backup 在低存储量 SMB 上以价格取胜（$0.15/GB），但不覆盖端点、服务器或第三方
              SaaS。定价上，第三方对 MSP 渠道每用户 / 月费率的比较显示，Acronis 位于集群高端（约 $4.25/user/month），Veeam Data Cloud 约
              $4.10，Backupify（Datto）约 $3.00，NinjaOne 约 $2.79，Druva 约 $2.25，AvePoint 约 $2.00，Cove（N-able）约
              $1.99，CloudAlly 约 $1.50，MSP360 约 $1.10，NAKIVO/BDRShield 约 $1.00。GTM 和分销上，Acronis 只走渠道（20,000+
              MSP）；Datto/Kaseya 只走渠道并拥有最大统一 MSP 栈；Veeam/Rubrik/Cohesity 通过经销商和系统集成商渠道直销企业；Microsoft 和 AWS 直销 +
              通过云市场销售。信任和监管姿态上，Acronis 受到独有惩罚：2025 年 9 月美国国家情报总监发布的 FASCSA 排除令要求情报界移除 Acronis 产品，GSA Advantage 于 2025 年
              10 月将 Acronis 下架；截至 2026 年 5 月，公开记录中没有任何同行
              Leader（Veeam、Rubrik、Cohesity、Commvault、Druva、Dell）遭遇等同的联邦排除，这实质性削弱 Acronis 的美国联邦信任姿态。
