      - number: '4.2'
        title: GTM 动作、渠道经济性与销售效率代理
        blocks:
          - type: paragraph
            body: >-
              Acronis 采取渠道优先动作：20,000+ 个 MSP 合作伙伴（公司自披露）是主要收入路径，辅以面向企业 Cyber Protect / Cyber Infrastructure
              交易的直销团队，以及面向消费者 Cyber Protect Home Office 的高流量自助渠道。Acronis 不披露 CAC、CAC
              回本周期、销售魔数或净留存率（NRR）；缺失这些指标时，公开销售效率代理变量包括：(1) 自报 MSP 合作伙伴数量增长（从 2021 年约 10,000 个到 2026 年 20,000+ 个，5
              年约翻倍，隐含约 15% 合作伙伴 CAGR）；(2) 自报终端企业数量增长（2026 年 750,000+ 家，对比 2021 年合作伙伴项目披露的约 500,000 家）；(3) 第三方 ARR
              估算（Latka / compworth 显示约 $328M 2023 → 约 $426M 2024 → 约 $559M 2026 估算），隐含 20% 中段收入 CAGR；(4) MSP 每用户 /
              月标价位于集群高端（约 $4.25 M365），更像高端 / 捆绑定位，而不是价格竞争。行业媒体充分记录了 MSP 自身的渠道经济性——MSP 通常在每工作负载底价上叠加 20–35% 毛利率转售
              Acronis，并向终端客户收取包含人工 + 授权的托管服务费。站在 Acronis P&L 角度，渠道直达经济性意味着 CAC 低于企业直销，但渠道利润让渡更高；销售和营销费用占收入比例未公开披露。
