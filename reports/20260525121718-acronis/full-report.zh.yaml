      - number: '7.5'
        title: 风险缓释与投资否决条件
        blocks:
          - type: paragraph
            body: >-
              几项因素可部分抵消 Acronis 的风险画像。公司维持 SOC 2 Type II、ISO 27001、HIPAA 和 GDPR
              对齐等强合规认证，证明其安全项目具备基线成熟度。一体化网络保护平台切中市场对统一备份、灾难恢复和端点安全的真实需求，尤其适合希望整合供应商的 MSP。欧洲和 APAC
              布局较强，地域多元化降低美国监管暴露；在特定板块，欧盟数据主权趋势也可能偏向非美国厂商。EQT 带来运营经验和资本资源，可执行扭转策略，包括可能调整结构以回应 FASCSA 担忧。由于数据重力，MSP
              渠道提供相对可预测的经常性收入和高切换成本。不过，投资人推进前应设定明确否决条件。自动退出触发条件应包括：（1）FASCSA 排除扩大到民用机构或盟国；（2）未来 12 个月内又有关键 CVE（CVSS
              9.0+）进入 CISA KEV 目录；（3）流失前 5 大 MSP 合作伙伴，且合计代表 15%+ 收入；（4）补救启动后 24 个月内未取得 FedRAMP Moderate
              授权；（5）关键技术领导者离职且无继任计划。该投资逻辑要求投资人确信：FASCSA 排除可靠结构调整修复，安全态势可被明确改善，竞争位置可被稳住——这是一个高信念、高风险命题。
