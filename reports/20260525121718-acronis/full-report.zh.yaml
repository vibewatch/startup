            body: >-
              公开牵引力表面很大但不均匀。公开、公司披露：20,000+ 个 MSP 合作伙伴、750,000+ 家受保护终端企业、5,000,000+ 名消费者用户（年代不清）、44+ 个数据中心区域、「20
              年传承」表述，以及自发发布的 Cyber Protect Cloud 授权标价。公开、第三方跟踪器推导（未经审计）：2024 年 ARR / 收入约 $420–426M（Latka），2025 年收入约
              $420M（RocketReach），2026 年收入估计约 $559.8M（compworth），2024 年累计融资约 $408M（Latka）/
              $658M（Tracxn）——两个累计融资估算之间的差距本身就是数据信号。公开、交易性：USD 3.5B 隐含企业价值（TechCrunch，2024 年 8 月 EQT 交易）。私有 / 未披露：实际
              ARR（Acronis 从未公布）、MSP 云 vs. 企业 vs. 消费者收入组合、GAAP/IFRS 毛利率、EBITDA、自由现金流、现金余额、债务结构、NRR / GRR、CAC /
              回本、RPO、递延收入、员工成本、受 FASCSA 排除影响的联邦渠道收入暴露。Crunchbase 资料在 2026 年被 Cloudflare 阻挡；Pitchbook
              资料部分受限。最大单一缺口是经审计财务报表——没有它，EQT 估值逻辑和任何跨同行倍数比较都只能视为方向性，而非锚定值。
