chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与组织结构
        blocks:
          - type: paragraph
            body: >-
              Acronis International GmbH 是一家全球网络保护公司，总部位于瑞士沙夫豪森，并在新加坡有重要运营布局；公司最初于 2003
              年在新加坡成立。双总部模式一方面承载瑞士公司住所的监管和治理需求，一方面保留亚太根基带来的运营敏捷性。Acronis 目前在 34 个办公室雇用约 2,000 人，覆盖 150+ 个国家，产品本地化为 26
              种语言。组织结构包括几个关键业务单元：服务托管服务提供商（MSP）的 Cyber Protect Cloud 部门、面向消费者的 True Image 产品线，以及企业 Cyber Infrastructure
              平台。2024 年 8 月 EQT 收购控股后，Acronis 成为 EQT 增长股权策略下的组合公司；CVC Capital Partners、BlackRock 和 Springcoast Capital
              Partners 保留少数股权。公司的法律实体结构对应其跨国足迹：Acronis AG 是主要瑞士控股实体，各地区子公司负责本地运营和合规要求。
