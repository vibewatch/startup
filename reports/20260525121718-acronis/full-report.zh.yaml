      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Acronis 的 GTM 不寻常，因为付款方和用户通常不是同一个组织。MSP 合作伙伴按席位 / 工作负载在「Managed Partner Program」协议下购买并支付平台；用户是操作控制台的 MSP
              技术团队；终端客户——通常是 10–500 席的 SMB——才是承担 MSP 月账单的经济付款方。在终端客户组织内，预算负责人通常是 IT 负责人或 vCISO；超过 60% 的 SMB
              没有专职安全负责人，这正是 MSP 交付拿下该细分市场的原因。中端市场和企业客户购买 Cyber Protect 和 ACI 时，Acronis 采用直销，买方是 IT 基础设施 / 安全团队，付款方是企业 IT
              预算线；这一细分对 Acronis 明显小于 MSP，也是 Veeam、Rubrik、Cohesity、Commvault 等竞争者最强的位置。消费者渠道里，用户和付款方是同一个人，定价是 Cyber
              Protect Home Office 品牌下的订阅 / 永久授权零售。
            claimRefs:
