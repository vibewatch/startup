      - number: '1.2'
        title: 创立历史与公司演进
        blocks:
          - type: paragraph
            body: >-
              Acronis 可追溯至 2003 年，Serguei Beloussov（又名 Serg Bell）和 Ilya Zubarev 在新加坡将其从 SWsoft（后来的 Parallels）拆分出来。公司最初专注
              Windows 系统的磁盘映像和备份软件，2004 年推出首个旗舰产品 True Image，后来几乎成为消费者备份方案的代名词。2008 年，Acronis
              在瑞士注册，以建立欧洲法律住所，同时保留新加坡运营。2019 至 2024 年间，公司经历重大战略演进，从传统备份厂商转向集备份、灾难恢复、端点安全和电子邮件安全于一体的网络保护平台。2021 年 9 月，创始人
              Serg Bell 在监管审查压力下离任，Patrick Pulvermueller 接任 CEO，推动运营专业化，这一转型随之加速。Jan-Jaap（JJ）Jager 于 2025 年 11 月出任
              CEO，是最新一次领导层交接；他带来 Salesforce 和 Adobe 的深厚企业软件经验，将在 EQT 所有权下带领 Acronis 进入下一阶段增长。
