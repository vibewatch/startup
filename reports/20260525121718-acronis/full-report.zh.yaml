      - number: '2.5'
        title: 规模测算缺口与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              五个 2026 年「数据保护 / 备份」软件估算自低到高相差 50%，反映的是边界选择——IDC 的 $12.8B「复制与保护」排除了 DRaaS，而 Fortune Business Insights 的
              $10.9B「数据保护和恢复解决方案」以及 Research and Markets 的 $18.9B「数据备份和恢复」采用更宽口径。没有来源发布一个干净的、由 MSP 渠道交付的网络保护子市场，能够精确对应
              Acronis 的收入池，因此 SAM/SOM 依赖三角测算。Acronis 自身 ARR 未披露（沿用第 1 章的证据缺口），所以 SOM
