  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Acronis 的竞争位置落在三个互锁市场的交叉处。核心市场是数据保护和备份软件——独立定义给出的 2026 年支出从 $12.8B（IDC 数据复制和保护软件）到
              $18.9B（更宽口径的数据备份和恢复，Research and Markets）不等，中点为 $14.99B（Business Research Insights）。相邻且越来越被打包的是端点保护 / EDR
              / XDR（EDR 为 $6.3B–$7.2B；XDR 为 $3.7B，均为 2026 年）、DRaaS / 网络恢复服务，以及托管网络安全服务。Acronis
              正在替代的现状方案包括超大规模云厂商原生备份（AWS Backup、Microsoft 365 原生保留）、SMB 自写脚本，以及 Veritas / Veeam / Commvault
              的传统本地设备。Acronis 变现所在的「渠道市场」——全球托管服务提供商服务市场——2026 年为 $430–490B，CAGR 为 10–14%；Acronis 的钱包份额来自 MSP
              网络安全和备份即服务预算项，而不是企业软件直采预算，这会显著改变买方 / 付款方三角。
            claimRefs:
