              September 2025 FASCSA 排除令是 Federal Acquisition Supply Chain Security Act 下首个命令，禁止 Acronis
              参与所有情报共同体采购，并要求联邦承包商在 60 天内移除 Acronis 产品。该前所未有的动作释放最高级别国家安全担忧，并建立了可能延伸到民用机构或盟国的先例。
