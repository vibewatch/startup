      - number: '3.5'
        title: 护城河耐久度、商品化与反向证据
        blocks:
          - type: paragraph
            body: >-
              Acronis 的护城河立在三根柱子上：(1) 一个深耕十年、全球触达的 MSP 渠道（20,000+ 合作伙伴，750,000 家受保护企业），从零复制很难，但 Kaseya 收购 Datto
              后正在追平，NinjaOne/Heimdal 统一栈也在挑战；(2) 单一代理里的宽产品面（备份 + EDR + DLP + 补丁 + 电子邮件 +
              RMM），技术上有差异，但运营复杂度足以让竞争者（Datto、N-able、Veeam）在独立比较中凭「单窗格简单性」取胜；(3) 带主权选项的多租户云平台（44+ 数据中心，包括俄罗斯 / CIS 历史），在
              EMEA 是销售优势，在美国却是监管负债。每根柱子的耐久度至多中等：柱子 (1) 被 Kaseya 捆绑和 Microsoft 365 Backup 对最轻量 SMB 细分设置的价格地板侵蚀；柱子 (2)
              受到安全优先领导者（Rubrik、Cohesity）挤压，后者如今在网络韧性 RFP 中赢过纯备份厂商；柱子 (3) 被 FASCSA 排除令结构性损伤。负面竞争证据很具体：面向 MSP
              的独立比较（Flamingo、Scopable、Heimdal、NinjaOne 博客综述）经常把 Acronis 排在 Datto/Kaseya 的集成深度之后，也排在 NinjaOne 和 Cove
              的易用性之后；Kaseya 的「Why MSPs choose Datto over Acronis」页面是直接的供应商负面主张；Mayer Brown 引用的 FASCSA 法律记录，则是 runDate 前
              24 个月最重大的公开负面信号。
