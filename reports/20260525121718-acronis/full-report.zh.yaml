      - number: '2.2'
        title: 多重镜头下的 TAM / SAM / SOM 测算
        blocks:
          - type: paragraph
            body: >-
              用一个数字给这个市场定规模会误导，因为买方、交付机制和支出池在不同镜头下都会变。只看软件的 TAM（数据保护和备份软件）在 2026 年为 $12.8B（IDC）到 $18.9B（Research and
              Markets）；MSP 交付 SaaS 的 SAM——Acronis 实际的市场路径——是 $93–106B 托管安全服务市场中触及数据保护的部分，再加上更宽 $430–490B MSP
              服务大盘的一部分。网络韧性镜头把 EDR/XDR（$10B+）和 DRaaS 纳入边界，相关支出合计推向 $40B。SOM 受到机械约束：Acronis 通过 MSP 合作伙伴服务估计约 33M 全球 SMB
              中的 750,000 家；若每家受保护企业每年平均平台支出为 $400–$1,200（来自公开合作伙伴手册和行业交易中的 Acronis 定价区间），隐含平台收入落在 $300M–$900M
              区间——这与后期数据保护同行低于独角兽级 ARR 估算一致，但没有披露无法验证。区间图（FM002）呈现了这组扇形展开。
