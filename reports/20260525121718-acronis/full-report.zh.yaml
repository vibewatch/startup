      - number: '4.6'
        title: 财务结论——收入质量、利润率路径、尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              收入质量在架构上很强（订阅 MSP 渠道 + 多年企业合同 + 经常性消费者续费），但 2026 年无法结构性验证，因为 Acronis 不发布经审计财务报表，也没有 GAAP/IFRS
              等价披露。最站得住脚的判断是：2024–2026 年 ARR / 收入大概率在 $420–560M 区间；EQT 的 $3.5B 标记隐含约 6–8x 追踪收入，符合私有数据保护公司的倍数层级（低于 Rubrik
              公开市场约 11x 和 Veeam $15B/$1.7B 约 9x，但高于 Commvault 公开市场约 5x）。利润率路径可能有吸引力（同行领导者 GM 为 77–82%，EBITDA 为
              20–30%），但无法验证；更重的主权 DC 足迹和更宽的产品面（EDR、DLP、轻量 RMM）可能相对纯 SaaS 同行（Druva、Rubrik）压低毛利率。资本强度中等（软件 + 云
              DC），没有重资本开支需求。主导尽调阻断项是：(i) 缺少经审计财务报表，(ii) 缺少队列留存 / NRR，(iii) 缺少 FASCSA 收入影响量化，(iv) 缺少 EQT 交易新股 /
              老股拆分和债务成分披露，(v)「5M+ 用户」消费者线用户数口径年代不透明，(vi) 第三方跟踪器数字差异很大（Latka $408M 融资 vs. Tracxn $658M 融资 vs. compworth
              $559.8M 2026 收入预测）。财务结论因此是：方向上有吸引力，结构上不透明——任何基于估值的资本决策前，都必须在 NDA 下深度审阅管理层资料包。
