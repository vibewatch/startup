      - number: '1.3'
        title: 融资历史与所有权结构
        blocks:
          - type: paragraph
            body: >-
              Acronis 已在多个成长期轮次披露约 $658M 股权融资，轨迹从初创公司走向数十亿美元企业。公司首个主要机构轮次发生在 2019 年 9 月，由 Goldman Sachs Principal
              Strategic Investments 领投 $147M Series B，对 Acronis 估值超过 $1B，标志其进入独角兽行列。CVC Capital Partners 于 2021 年领投
              $250M，估值约 $2.5B；随后 BlackRock 在 2022 年初领投另一笔 $250M，估值 $3.5B。2024 年 8 月，瑞典私募股权公司 EQT 以据报 $3.5B 至 $4B 的估值收购
              Acronis 控股权，所有权结构出现根本变化；既有投资人 CVC、BlackRock 和 Springcoast 保留少数股权。当前股权结构表体现 EQT
              控制权和这些财务赞助方并存，治理受主要股东董事代表影响，包括 EQT 的 Johannes Reichel 和 CVC Capital Partners 的 Daniel Williamson。
