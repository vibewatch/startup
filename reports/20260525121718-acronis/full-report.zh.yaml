  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 主要估值锚
        blocks:
          - type: paragraph
            body: >-
              Acronis 最近一次公允交易是本分析的主要估值锚。August 2024，欧洲领先私募股权机构 EQT 收购 Acronis 多数股权，隐含企业估值约 $3.5 billion。该交易较公司 May 2021
              Series F 轮估值 $2.5 billion 溢价 40%，当轮由 CVC Capital Partners 领投。EQT 交易为 Acronis 的市场位置和增长轨迹提供了重要验证。EQT
              这类私募股权机构通常会在控股收购前开展大量尽调，愿意较前轮支付溢价，说明其对公司基本面有信心。第三方分析师估计 Acronis 年收入在 $500-700 million
              区间，但私人公司无法独立核验这些数字。GetLatka 报告 2024 收入为 $426.3 million，Growjo 估计为 $559.8 million。按该区间中点和报道的 $3.5 billion
              估值计算，Acronis 交易约为 5-7x EV/Sales，与数据保护和网络安全领域可比软件公司一致。
