companyProfile:
  summary: >-
    Acronis 是一家 2003 年成立的网络保护厂商，已把备份、灾难恢复、反恶意软件、EDR/MDR、电子邮件安全、DLP 和端点管理收拢到同一个 Cyber Protect Cloud 平台；平台主要通过 20,000+ 个
    MSP 合作伙伴销售，这些 MSP 又保护 750,000+ 家终端企业。运营总部分设瑞士沙夫豪森和新加坡。公司由 CEO Patrick Pulvermueller（2021 年 7 月起）领导，共同创始人 Serguei
    Beloussov 任创始人 / 首席研究官。EQT 于 2024 年 8 月以隐含 USD 3.5B 企业价值取得控股权，BlackRock、CVC、Springcoast 和创始人继续持有少数股权。记录上最重大的负面事件是
    2025 年 9 月美国国家情报总监发布的 FASCSA 排除令——史上首份此类命令——把 Acronis 可服务市场中的美国联邦部分划了出去。
