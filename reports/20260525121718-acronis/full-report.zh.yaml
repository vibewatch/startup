              近期数据保护和 MSP 软件领域的 M&A 活动提供额外估值参照。Datto 这家聚焦 MSP 的备份和 RMM 提供商，在 2022 年被 Kaseya 以约 9x 收入收购，战略组合获得显著溢价。该交易为
