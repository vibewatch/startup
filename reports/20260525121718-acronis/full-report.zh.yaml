      - number: '7.3'
        title: 竞争与市场位置风险
        blocks:
          - type: paragraph
            body: >-
              Acronis 在数据保护与备份软件市场约有 6.6% 份额，落后市场领导者 Veeam（约 21%）约三倍，竞争位置脆弱。January 2024 Cohesity-Veritas
              合并按收入打造出行业最大实体，重塑竞争格局，也抬高了 R&D 投入、go-to-market 覆盖和企业客户信任门槛。Rubrik 在 March 2024
              IPO，随后作为云原生备份平台持续增长，说明投资人愿意为现代架构买单；Commvault 的 Metallic SaaS 产品则吃下云优先企业。Acronis 的混合定位横跨面向 MSP 的 Cyber
              Cloud、企业 Cyber Protect 和消费者 True Image，带来战略分散，而不是聚焦的市场领导力。MSP 渠道约占收入 60%，大型 MSP
              整合并要求批量定价，渠道利润率承压。企业直销需要销售团队产能和技术深度，而聚焦中端市场的 Acronis 历史上投入不足。FASCSA 排除令放大竞争劣势：联邦市场准入被切断，约 8-12% 可服务收入消失，而
              Veeam、Commvault、Rubrik 等竞争对手仍有 FedRAMP
              授权和活跃联邦合同。围绕一体化备份、反恶意软件和端点保护的技术差异化，随着竞争对手给备份平台加上安全层，已部分商品化。要守住竞争力，Acronis 必须加快创新投入、强化 go-to-market
              执行并厘清战略；监管阴影和所有权结构约束让这一切更难。
