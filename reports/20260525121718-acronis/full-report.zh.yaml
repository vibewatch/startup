      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求由四个大多长期的驱动因素推动：(1) 勒索软件升级——88% 的 SMB 入侵涉及勒索软件，单次事件平均总成本约 $5M，平均恢复成本（不含赎金）约 $1.5M；(2)
              网络保险要求把可证明、已测试的备份变成保单前提；(3) SMB 安全人手短缺推动 MSP 外包——MSP 中 vCISO 采用率同比上升约 319%；(4) 监管扩张（欧洲
              NIS2、行业性泄露通知制度、主权数据规则）抬高了缺失恢复姿态的成本。Acronis 具体面对的主要约束是：(a) 2025 年 9 月美国 FASCSA
              排除令，将美国情报界和大多数联邦直采支出从其可触达市场中移除；(b) 超大规模云厂商原生备份蚕食 SMB 市场底部（Microsoft 365 原生保留、AWS Backup 等）；(c) 买方向
              CrowdStrike / Microsoft / Palo Alto 级 XDR 超级平台迁移，带来平台整合压力；(d) 切换成本在 MSP 内部有利于
              Acronis，但在竞争者存量高的首次触达交易中反过来不利。上述约束都非生死问题，但 FASCSA 是 Acronis 独有的特殊 SAM 压缩。
