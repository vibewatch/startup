      - number: '7.2'
        title: 安全与产品漏洞
        blocks:
          - type: paragraph
            body: >-
              Acronis 产品长期暴露出严重安全漏洞模式，削弱其“网络保护”核心价值主张的可信度。CVE-2023-45249 是影响 Acronis Cyber Infrastructure 的远程代码执行漏洞，CVSS
              严重性 9.8；确认被在野利用后，CISA 于 July 2024 将其加入 Known Exploited Vulnerabilities
              目录。该漏洞源于默认凭据使用，未认证攻击者可取得完整系统控制——一家安全厂商出现此类问题尤其致命。2026 漏洞披露节奏加快，已发布 35 个
              CVE，包括权限提升缺陷（CVE-2026-41952、CVE-2026-33092）和信息泄露漏洞（CVE-2026-28710）。部分漏洞影响面向消费者和 SMB 市场的 Acronis True Image
              产品线，另一些影响企业级 Cyber Protect 方案。该模式更像安全开发生命周期落地存在系统性问题，而非孤立事件。CISA
              约束性行动指令要求联邦机构修复已知被利用漏洞，进一步放大商业影响，因为企业越来越按联邦标准对齐补丁管理。安全记录与 Acronis
              作为一体化网络保护平台的市场定位直接冲突，让重视安全的采购团队评估供应商时产生认知反差。补救不只需要修补已披露漏洞，还要在多个发布周期内证明漏洞密度和修补周期指标有可衡量改善。
            claimRefs:
