      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Acronis 的扩张沿三条线推进。受保护企业层面的按工作负载扩张（增加端点，增加 Advanced 包）；合作伙伴层面的按 MSP 扩张（MSP 合作伙伴把更多终端客户加到平台上）；以及产品线交叉销售，MSP
              在基础备份之外采用 Advanced Security、Advanced MDR 或 Advanced DLP 包。集中度风险是结构性的，而非可实证量化：终端企业层面客户集中度几乎肯定低（750,000+
              长尾），但头部 MSP 合作伙伴的渠道集中度未知，而且可能很高——前 100 名 MSP 合作伙伴可能贡献了不成比例的工作负载订单额。September 2025 FASCSA
              排除令完全切断美国联邦客户板块（情报共同体采购被禁，并从 GSA Advantage 下架）。Microsoft 365 捆绑压力（Microsoft 365 Backup 第一方产品）则是 M365 SaaS
              备份扩张路径的结构性天花板（见第 5 章）。
            claimRefs:
              - CU026
              - CU027
              - CU028
              - CU029
              - CU030
              - CU031
              - CU032
