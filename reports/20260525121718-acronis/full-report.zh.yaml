  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、细分市场与替代品
        blocks:
          - type: paragraph
            body: >-
              Acronis 周边的竞争场域清晰分成三组，买方旅程各不相同。第一组是 MSP 渠道网络保护细分，Acronis Cyber Protect Cloud、Datto BCDR（Kaseya）、N-able
              Cove、Axcient x360Recover、NinjaOne、MSP360、Veeam Data Cloud 和 Comet 争夺同一个 MSP 合作伙伴席位，通常嵌在 RMM+PSA+备份+安全
              栈中。第二组是企业备份和数据保护平台市场，Gartner 2025/2026 Magic Quadrant 将 Rubrik、Veeam、Cohesity、Commvault、Dell Technologies
              和 Druva 列为 Leaders；Rubrik「愿景位置最靠前」，Veeam 在「执行能力」上居首。Acronis 在该象限中是 Challenger / 利基玩家，并不属于 Global 500
              备份替换交易的核心企业考虑集（Cohesity 披露已保护该细分 70% 的 Global 500）。第三组是替代层：超大规模云厂商原生备份——Microsoft 365 Backup 标价
              $0.15/GB/month、AWS Backup、Google Vault——加上 MSP 内部自建栈（脚本 + Wasabi/S3
              存储）。相邻竞争压力来自网络韧性纯玩家（Rubrik、Cohesity），它们主张备份已经是安全控制；也来自 EDR/XDR 厂商（CrowdStrike、SentinelOne、Microsoft
              Defender），它们打包备份邻近恢复功能，冲击 Acronis 的「单一代理」主张。潜在进入者包括 Microsoft 自身把 365 Backup 扩展到端点覆盖，AWS 用网络保险库姿态扩展
              Backup，以及最佳单品 MSP 栈（NinjaOne、Heimdal）收购或 OEM 纯备份供应商。
