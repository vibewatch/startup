          - type: callout
            title: 收入不确定性
            body: 第三方收入估计介于 $426M 至 $560M，给倍数计算和估值精度带来实质不确定性。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
          - type: callout
            title: 倍数定位
            body: Acronis 隐含 5-7x 倍数位于传统备份厂商的 4-5x 与高增长安全平台的 9-10x 之间，定位看起来合理。
            calloutType: insight
            claimRefs:
              - CV008
              - CV017
              - CV020
          - type: callout
            title: 可进入性有限
            body: PE 控股意味着没有直接投资入口；二级交易要求机构身份，并面临显著非流动性溢价。
            calloutType: risk
            claimRefs:
              - CV031
          - type: callout
            title: 机构验证
            body: EQT 尽调以及相对 Series F 40% 的溢价，说明其对 Acronis 基本面和增长轨迹有信心。
            calloutType: strength
            claimRefs:
              - CV001
              - CV007
          - type: callout
            title: M&A 先例
            body: Datto 9x 与 Veeam 6-8x 交易为该板块提供了可比 M&A 基准，将 Acronis 放在合理区间内。
            calloutType: assumption
