  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing model and recognition
        blocks:
          - type: paragraph
            body: >-
              Acronis monetizes through three revenue streams. The dominant stream is Cyber Protect Cloud sold to MSPs
              on a subscription basis under one of two billing models: per-workload (flat monthly fee per protected
              workload — Cobweb's 2026 published list shows £19.50/server/mo, £5.70/VM/mo, £2.95/workstation/mo,
              £2.30/M365 seat/mo, £1.70/mobile/mo) or per-GB (Acronis-hosted storage at £0.05/GB/mo, Google/Azure-hosted
              at £0.06/GB/mo, Advanced DR at £0.06/GB/mo Acronis-hosted or £0.04/GB/mo hybrid). The MSP must choose one
              billing model per customer; advanced packs (Advanced Backup, Advanced Security, EDR, MDR, Email Security,
              DLP, Disaster Recovery) are licensed on top per workload, per user or per GB. Volume discounts of up to
              35% are available against monthly commitment tiers (Acronis Cloud Licensing Guide; Cobweb; Atera support
              docs). The second stream is direct enterprise sales of Acronis Cyber Protect (perpetual + maintenance) and
              Cyber Infrastructure (per-TB software-defined storage) into mid-market and enterprise accounts via direct
              sales and distributors. The third stream is the consumer Cyber Protect Home Office line (descended from
              True Image), sold as an annual subscription via web and retail. Acronis does not publish the share of
              revenue across these three streams; trade coverage and analyst tracker commentary consistently
              characterise MSP Cyber Protect Cloud as the majority. Revenue recognition follows subscription-software
              conventions (ratable over contract term for cloud, perpetual + maintenance ratable over support term for
              on-prem), but absent audited financials there is no public confirmation of ASC 606 / IFRS 15 application,
              deferred-revenue balance, or remaining-performance-obligations (RPO) disclosure.
