        title: Public traction figures versus private-metric gaps
        blocks:
          - type: paragraph
            body: >-
              The public traction surface area is large but uneven. Public, company- disclosed: 20,000+ MSP partners,
              750,000+ end businesses protected, 5,000,000+ consumer users (vintage unclear), 44+ data-center regions,
              "20-year heritage" framing, and self-published Cyber Protect Cloud licensing list pricing. Public,
              third-party tracker derived (not audited): 2024 ARR/revenue ~$420–426M (Latka), 2025 revenue ~$420M
