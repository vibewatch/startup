      - number: '2.5'
        title: Sizing gaps and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The five 2026 estimates for "data protection / backup" software differ by 50% top-to-bottom, reflecting
              boundary choices — IDC's $12.8B "replication and protection" excludes DRaaS, while Fortune Business
              Insights' $10.9B "data protection and recovery solutions" and Research and Markets' $18.9B "data backup
              and recovery" use broader brackets. No source publishes a clean MSP-channel-delivered cyber-protection sub
              market that exactly matches Acronis's revenue pool, leaving SAM/SOM dependent on triangulation. Acronis's
              own ARR is undisclosed (carried forward from Chapter 1's evidence gap), so the SOM number cannot be
              independently confirmed. Contradictory estimates have been preserved rather than averaged: the sizing-lens
              table (TM002) shows the spread, and the range figure (FM002) shows the low-base-high band so the
              investment case can be re-cut under different boundary assumptions.
