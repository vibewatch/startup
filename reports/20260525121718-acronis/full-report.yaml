      - number: '4.6'
        title: Financial verdict — revenue quality, margin path, diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is structurally strong on architecture (subscription MSP channel + multi-year enterprise +
              recurring consumer renewal) but structurally unverifiable in 2026 because Acronis publishes no audited
              financials and no GAAP/IFRS-equivalent disclosures. The most defensible read: ARR / revenue likely sits in
              the $420–560M band for 2024–2026; the EQT $3.5B mark implies ~6–8x trailing revenue, which is consistent
              with private-tier data-protection multiples (below Rubrik's public ~11x and Veeam's $15B/$1.7B ~9x but
              above Commvault's public ~5x). Margin path is plausibly attractive (peer leaders sit at 77–82% GM, 20–30%
              EBITDA) but not verifiable; the heavier sovereign DC footprint and broader product surface (EDR, DLP,
              RMM-light) probably compress gross margin relative to pure-SaaS peers (Druva, Rubrik). Capital intensity
              is moderate (software + cloud DCs) with no heavy capex demand. The dominant diligence blockers are (i)
              absence of audited financials, (ii) absence of cohort retention / NRR, (iii) absence of FASCSA
              revenue-impact quantification, (iv) absence of EQT-transaction primary/secondary split and debt-component
              disclosure, (v) opacity in the consumer-line vintage of the "5M+ users" claim, and (vi) sizable
              discrepancy in third-party tracker numbers (Latka $408M raised vs. Tracxn $658M raised vs. compworth
              $559.8M 2026 revenue projection). The financial verdict is therefore: directionally attractive,
              structurally opaque — a deep management-pack review under NDA is mandatory before any valuation-anchored
              capital decision.
