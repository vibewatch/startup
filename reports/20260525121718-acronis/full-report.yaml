      - number: '3.5'
        title: Moat durability, commoditization and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Acronis's moat rests on three pillars: (1) a deep, decade-built MSP channel with global reach (20,000+
              partners, 750,000 protected businesses) that is hard to replicate from scratch but is being matched by
              Kaseya post-Datto and challenged by NinjaOne/Heimdal unified stacks; (2) a wide product surface in a
              single agent (backup + EDR + DLP + patch + email + RMM) that is technically differentiated but
              operationally complex enough that competitors (Datto, N-able, Veeam) win on "single-pane simplicity" in
              independent comparisons; and (3) a multi-tenant cloud platform with sovereignty options (44+ data centers
              including Russia/CIS history) that is a sales advantage in EMEA but a regulatory liability in the U.S. The
              durability score on each pillar is medium-at-best: pillar (1) is being eroded by Kaseya bundling and the
              Microsoft 365 Backup price floor for the lightest SMB segment; pillar (2) is squeezed by the
              security-first leaders (Rubrik, Cohesity) who now win cyber-resilience RFPs against pure backup vendors;
              pillar (3) was structurally damaged by the FASCSA exclusion order. Adverse competitor evidence is
              concrete: independent MSP-focused comparisons (Flamingo, Scopable, Heimdal, NinjaOne blog roundups)
              routinely place Acronis behind Datto/Kaseya on integration depth and behind NinjaOne and Cove on
              ease-of-use; the Kaseya "Why MSPs choose Datto over Acronis" page is a direct vendor adverse claim; and
              the FASCSA legal record cited by Mayer Brown is the single most consequential public adverse signal of the
              24 months prior to runDate.
