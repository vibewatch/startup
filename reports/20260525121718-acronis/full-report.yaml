      - number: '3.2'
        title: Competitor profiles — scale, funding, target customer, scope, pricing, direction
        blocks:
          - type: paragraph
            body: >-
              The reference set of named competitors clusters by archetype. Enterprise leaders: Veeam (private, ~$15B
              valuation after the December 2024 TPG-led $2B secondary, ARR ~$1.7B+, software-defined; IPO-ready); Rubrik
              (public since April 2024 IPO at $32 / $5.6B fully-diluted valuation, ~$13.7B market cap by May 2026, ARR >
              $1B, security-first appliance + SaaS, net loss $354M FY24); Cohesity post-Veritas merger (closed December
              2024, combined ~$7B, ~70% of Global 500 protected, IPO delayed by integration); Commvault (NASDAQ:CVLT,
              broad enterprise install base, acquired Clumio in August 2024 to deepen cloud-native posture); Druva
              (private cloud-native BaaS, mid-market and SaaS-centric, last private mark ~$2B+); Dell Technologies
              (PowerProtect line, enterprise appliance / hyperconverged). MSP-channel rivals: Datto (acquired by Kaseya
              in 2022, now the BCDR unit inside the Kaseya 365 stack — turnkey BDR appliance + cloud DR + RMM/PSA
              integration); N-able (NYSE:NABL, RMM + Cove backup); Axcient (x360Recover, MSP-only BDR); NinjaOne
              (RMM+backup, public 2024 IPO); Comet, MSP360, Vembu (price challengers). Hyperscaler-native substitutes:
              Microsoft 365 Backup ($0.15/GB/month, pay-as-you-go through M365 admin center); AWS Backup; Google
              Workspace native retention. Direction signals: Rubrik acquiring Predibase for AI-driven cyber resilience;
              Cohesity-Veritas integrating product lines; Veeam pushing Veeam Data Cloud SaaS workloads; Microsoft
              formally entering the backup market with a per-GB list price that reframes price-floor expectations.
