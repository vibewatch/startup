      - number: '4.3'
        title: Cost structure, gross margins and service-delivery costs
        blocks:
          - type: paragraph
            body: >-
              Acronis's cost structure has four major components — none of which are publicly disclosed in audited form
              but each of which can be triangulated from peer benchmarks and product architecture. (1) Cost of revenue:
              cloud infrastructure (Acronis-hosted DCs across 44+ facilities, plus Google/Azure-hosted regions) +
              customer-success / support headcount + license royalties on bundled third-party tech. Peers indicate that
              data-protection-platform gross margin sits in the 77–82% band when operated efficiently (Rubrik 80% GAAP,
              Commvault 81–82% non-GAAP guidance, Veeam 77% post-SaaS shift); Acronis is reasonably expected to be in or
              below that band given the heavier on-prem / sovereign footprint. (2) R&D: Acronis maintains its TRU
              (Threat Research Unit) and product engineering across multiple sites; SaaS-leader peers spend 18–25% of
              revenue on R&D. (3) S&M: heavy channel-marketing spend (#MSPWorld, #AcronisGo, partner kickoffs,
              sponsorships); peers spend 35–50% of revenue on S&M during growth phase. (4) G&A: ~10–15% per peer norms.
              Capex is modest because the platform is software, but cloud-DC build-out (44+ DCs) is a meaningful
              one-time and ongoing capex line that peers without sovereign footprints (Druva, Rubrik in SaaS mode)
              avoid. Working-capital is benign for subscription SaaS (positive collections vs. expense timing); but
              Acronis's lower-touch MSP channel implies large deferred-revenue balances that may be material. None of
              these figures are public; an audited P&L, cohort-level retention and a CAC/LTV worksheet are the priority
              diligence asks.
