        title: TAM / SAM / SOM sizing under multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing this market with one number is misleading because the buyer, the delivery mechanism and the spend
              pool change across lenses. A software-only TAM lens (data protection and backup software) yields $12.8B
              (IDC) to $18.9B (Research and Markets) in 2026; SAM for MSP-delivered SaaS — Acronis's actual route to
              market — is the share of the $93–106B managed security services market that touches data protection plus a
              fraction of the broader $430–490B MSP services pie. A cyber-resilience lens adds EDR/XDR ($10B+) and DRaaS
              to the boundary, pushing combined relevant spend toward $40B. SOM is bounded mechanically: Acronis serves
              750,000 of an estimated ~33M global SMBs through its MSP partners; if average platform spend is
              $400–$1,200 per protected business per year (Acronis pricing range from public partner brochures and
              industry trades), implied platform revenue lies in a $300M–$900M band — consistent with sub-unicorn ARR
              estimates for late-stage data-protection peers but unverifiable without disclosure. The range figure
