    sections:
      - number: '6.1'
        title: Customer base segmentation by buyer, user and channel
        blocks:
          - type: paragraph
            body: >-
              The Acronis customer base separates into three distinct buyer surfaces. The dominant surface is the
              MSP-channel SMB / mid- market: more than 20,000 Managed Service Providers contract with Acronis under the
              Managed Partner Program and resell Cyber Protect Cloud per-workload subscriptions to approximately 750,000
              protected businesses across more than 150 countries. The MSP is both the buyer and the operator; the SMB /
              mid-market business is the protected end customer who experiences the product but typically does not
              contract directly with Acronis. The second surface is direct mid-market and enterprise IT buying Acronis
              Cyber Protect and Acronis Cyber Infrastructure under quote-based contracts; this includes industries such
              as sports / live events, financial services, manufacturing, healthcare and higher education (per Acronis
              case-study coverage). The third surface is the consumer base for Cyber Protect Home Office, with the
              legacy True Image installed base supporting an Acronis-reported ~5 million consumer users on perpetual and
              subscription licenses. Geographic coverage is global, with the EMEA, North America and APAC regions all
              explicitly serviced through localized partner programs and 50+ data centers (see Chapter 5).
