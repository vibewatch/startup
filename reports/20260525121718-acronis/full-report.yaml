companyProfile:
  summary: >-
    Acronis is a 2003-founded cyber-protection vendor that has converged backup, disaster recovery, anti-malware,
    EDR/MDR, email security, DLP and endpoint management into a single Cyber Protect Cloud platform sold primarily
    through 20,000+ MSP partners that in turn protect 750,000+ end businesses. Operating headquarters are split between
    Schaffhausen (Switzerland) and Singapore. The company is run by CEO Patrick Pulvermueller (since July 2021) with
    co-founder Serguei Beloussov as Founder/Chief Research Officer. EQT took a majority stake in August 2024 at an
    implied USD 3.5B enterprise value with BlackRock, CVC, Springcoast and the founders rolling minority positions. The
    most material adverse event on the record is the September 2025 FASCSA exclusion order from the U.S. Director of
    National Intelligence — the first ever issued — which carves out the U.S. federal slice of Acronis's
    served-available market.
