    rows:
      - - Ransomware escalation (88% of SMB breaches involve ransomware)
        - Tailwind
        - 2024 → ongoing
        - Drives MSP and SMB demand for tested, immutable backups
        - Confirm Acronis attach rate of immutable / object-lock storage
      - - Cyber-insurance preconditions on backup
        - Tailwind
        - 2024 → ongoing
        - Backup becomes mandatory line item, not optional
        - Survey Acronis MSPs on % of customer policies with backup mandates
      - - SMB security under-staffing (60%+ with no dedicated security headcount)
        - Tailwind
        - Structural
        - Forces SMBs into MSP delivery — Acronis's GTM model
        - 'Get partner concentration: top-50 MSPs as % of platform revenue'
      - - MSP cybersecurity segment growth (18% CAGR)
        - Tailwind
        - 2025–2031
        - Acronis's primary channel is the fastest-growing in MSP land
        - Acronis growth vs MSP cyber TAM growth (share gain or loss)
      - - Regulatory tightening (NIS2, sectoral rules, data sovereignty)
        - Tailwind
        - 2025–2027 ramp
        - Raises baseline backup spend and EU footprint advantage
        - Map Acronis data-residency footprint vs NIS2 / GDPR requirements
      - - Hyperscaler-native backup substitutes (AWS Backup, M365 retention)
        - Headwind
        - Ongoing
        - Erodes bottom-of-market SMB share for third-party tools
        - Win-loss data vs Microsoft 365 backup add-ons
      - - XDR super-platform consolidation (CrowdStrike / Microsoft / Palo Alto)
        - Headwind
        - 2025–2028
        - Buyer pressure to consolidate vendors at upper end
        - Acronis partnership / coexistence strategy with platform vendors
      - - FASCSA exclusion (DNI order, Sept 2025)
        - Headwind (idiosyncratic)
        - 2025 → ongoing
        - Removes U.S. IC and most direct U.S. federal spend from SAM
        - Quantify % of revenue exposed to U.S. federal vs. EU / APAC / commercial
      - - Russia/CIS founder optics post-FASCSA
        - Headwind (idiosyncratic)
        - Ongoing
        - Could trigger additional Five-Eyes scrutiny
        - Confirm Acronis AG governance, ownership transparency steps
      - - AI-driven autonomous protection / TRU intelligence
        - Tailwind
        - 2026 launches
        - Marketing tailwind aligns with buyer narrative on AI security
        - Get product roadmap; differentiate from Microsoft / CrowdStrike AI claims
    notes: >-
      Drivers are evidence-backed; headwinds split between structural (substitutes, platform consolidation) and
      idiosyncratic (FASCSA, geographic-origin optics). Acronis-specific implications are flagged explicitly.
