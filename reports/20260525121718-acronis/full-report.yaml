  foundingLocation: Singapore (original incorporation) / Switzerland (operating HQ)
  headquarters: Schaffhausen, Switzerland (corporate) / Singapore (group HQ)
  productSummary: >-
    Four-product family: Cyber Protect Cloud (multi-tenant MSP SaaS platform — the dominant revenue stream), Cyber
    Protect (direct on-prem / hybrid enterprise edition), Cyber Infrastructure (per-TB software-defined storage and
    HCI), and Cyber Protect Home Office (consumer subscription descended from True Image). All converge on a single
    "cyber protection" thesis combining backup + security + endpoint management.
  customerFocus: >-
    Managed service providers and their SMB / mid-market end customers; direct mid-market and enterprise via channel +
    field; sovereign/regulated buyers in EMEA and APAC; consumer. Public 2026 traction: 20,000+ MSP partners and
    750,000+ end businesses across 44+ Acronis data center regions.
  businessModel: >-
    Channel-first subscription software. MSP Cyber Protect Cloud is billed per-workload (e.g., £19.50/server/mo,
    £2.30/M365 seat/mo) or per-GB (£0.05/GB/mo Acronis-hosted), with up to 35% volume discounts for top-tier MSP
    commitments. Enterprise edition is perpetual + maintenance or per-TB; consumer is annual subscription.
  stage: Private (EQT majority, August 2024)
