  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, segments and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive arena around Acronis splits cleanly into three groups with different buyer journeys. The
              first is the MSP-channel cyber protection segment, where Acronis Cyber Protect Cloud, Datto BCDR (Kaseya),
              N-able Cove, Axcient x360Recover, NinjaOne, MSP360, Veeam Data Cloud and Comet compete head-to-head for
              the same MSP partner seat, often as part of an RMM+PSA+backup+security stack. The second is the enterprise
              backup and data protection platform market in which Gartner's 2025/2026 Magic Quadrant names Rubrik,
              Veeam, Cohesity, Commvault, Dell Technologies and Druva as Leaders; Rubrik is "positioned furthest in
              vision" and Veeam tops "ability to execute." Acronis appears as a Challenger / niche player in that
              quadrant and is not in the core enterprise consideration set for Global 500 backup replacement deals
              (Cohesity discloses Global 500 protection of 70% of that segment). The third is the substitute layer of
              hyperscaler-native backup — Microsoft 365 Backup priced at $0.15/GB/month, AWS Backup, Google Vault — plus
              internal MSP build-it-yourself stacks (script + Wasabi/S3 storage). Adjacent competitive pressure comes
              from cyber resilience pure-plays (Rubrik, Cohesity) that argue backup is now a security control, and from
              EDR/XDR vendors (CrowdStrike, SentinelOne, Microsoft Defender) bundling backup-adjacent recovery features
              that compete with Acronis's "single agent" claim. Likely entrants include Microsoft itself broadening 365
              Backup into endpoint coverage, AWS extending Backup with cyber-vault posture, and best-of-breed MSP stacks
              (NinjaOne, Heimdal) acquiring or OEMing pure backup providers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
