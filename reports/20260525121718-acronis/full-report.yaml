      - number: '2.3'
        title: Buyer, user and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Acronis's GTM is unusual because the payer and the user are usually different organizations. The MSP
              partner buys (and pays for) the platform on a per-seat / per-workload basis under a "Managed Partner
              Program" agreement; the user is the MSP's technical team that operates the console; and the end customer —
              typically an SMB of 10–500 seats —is the economic payer who funds the MSP's monthly bill. Inside the
              end-customer organization the budget owner is usually the IT director or vCISO, with 60%+ of SMBs running
              with no dedicated security headcount — which is exactly why MSP delivery has won the segment. For
              mid-market and enterprise, Acronis sells direct under Cyber Protect and ACI, where the buyer is the IT
              infrastructure / security team and the payer is a corporate IT budget line; this segment is materially
              smaller for Acronis than MSP and is where competitors Veeam, Rubrik, Cohesity, Commvault are strongest. In
              the consumer channel, the user and the payer are the same person and pricing is subscription /
              perpetual-license retail under the Cyber Protect Home Office brand.
