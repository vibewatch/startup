              valuation. The 5-7x implied EV/Sales multiple represents a reasonable premium to traditional backup
              vendors while discounting to high-growth security platforms. The EQT transaction provides institutional
              validation, and the company's unified cyber protection positioning addresses growing market demand for
              integrated solutions. However, the investment recommendation is track rather than invest due to limited
              accessibility. As a PE-majority-owned private company, Acronis does not offer direct investment
              opportunities for most investors. Secondary market transactions may be available but typically require
              institutional status and face significant illiquidity premiums. For investors seeking exposure to the data
