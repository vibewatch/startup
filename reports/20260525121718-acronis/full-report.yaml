      - number: '1.4'
        title: Regulatory Environment and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Acronis has faced notable regulatory and security challenges that warrant due diligence attention. In
              September 2025, the U.S. Director of National Intelligence (DNI) issued a FASCSA (Federal Acquisition
              Supply Chain Security Act) exclusion order barring Acronis products and services from use within the U.S.
              Intelligence Community. This order, one of the first issued under FASCSA Section 208 authority, reflects
              supply chain security concerns potentially related to the company's Russian-origin founders and historical
              ties to Russia, despite its Swiss corporate domicile. Additionally, multiple Common Vulnerabilities and
              Exposures (CVEs) have been disclosed for Acronis True Image between 2024 and 2026, including
              CVE-2024-8767, CVE-2024-49382, CVE-2024-55538, and CVE-2026-25031, affecting local privilege escalation,
              DLL hijacking, and sensitive information disclosure. While Acronis has issued patches through its security
              advisory program, these vulnerabilities highlight ongoing product security risks. The departure of founder
              Serg Bell in 2021 also followed reports of regulatory scrutiny and civil allegations, though specific
              enforcement outcomes remain limited in public records.
