  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies and substitutes
        blocks:
          - type: paragraph
            body: >-
              Acronis competes in the intersection of three interlocking markets. The core market is data protection and
              backup software — independent definitions place 2026 spend at $12.8B (IDC data replication and protection
              software) up to $18.9B (broader data backup and recovery, Research and Markets) with a $14.99B mid-point
              (Business Research Insights). Adjacent and increasingly bundled are endpoint protection / EDR / XDR
              ($6.3B–$7.2B EDR; $3.7B XDR, 2026), DRaaS / cyber-recovery services, and managed cybersecurity services.
              The status-quo substitutes that Acronis is displacing are hyperscaler-native backup (AWS Backup, Microsoft
              365 native retention), home-grown scripts at SMBs, and legacy on-prem appliances from Veritas / Veeam /
              Commvault. The "channel market" inside which Acronis monetizes — the global managed services provider
              services market — is $430–490B in 2026 and growing 10–14% CAGR; Acronis's wallet share comes out of MSP
              cybersecurity and backup-as-a-service line items, not direct enterprise software budgets, which materially
              changes the buyer/payer triangle.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
