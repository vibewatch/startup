      - number: '4.2'
        title: GTM motion, channel economics and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Acronis runs a channel-first motion: 20,000+ MSP partners (company self-disclosed) are the primary revenue
              route, complemented by a direct field sales team for enterprise Cyber Protect / Cyber Infrastructure deals
              and a high-volume self-serve channel for consumer Cyber Protect Home Office. Acronis does not publish a
              CAC, CAC payback, magic number or net-revenue-retention (NRR) figure; in their absence, the public
              sales-efficiency proxies are: (1) self-reported MSP partner count growth (from ~10,000 in 2021 to 20,000+
              in 2026 — ~2x in 5 years implies ~15% partner-CAGR); (2) self-reported end-business count growth (750,000+
              in 2026 versus ~500,000 in 2021 partner-program disclosures); (3) third-party ARR estimates (~$328M 2023 →
              ~$426M 2024 → ~$559M 2026 estimate per Latka / compworth) implying mid-20s % revenue CAGR; (4) MSP
              per-user/month list pricing sitting at the high end of the cluster (~$4.25 M365), consistent with a
              premium / bundled positioning rather than price competition. Channel economics for MSPs themselves are
              well-documented in trade press — MSPs typically resell Acronis at a 20–35% gross margin layered on top of
              the per-workload base, with the MSP charging the end customer a managed-service fee that bundles labor +
              license. From an Acronis P&L perspective, channel-direct economics imply lower CAC than enterprise direct
              sales but higher channel margin pass-through; sales-and- marketing expense as a share of revenue is not
              publicly disclosed.
