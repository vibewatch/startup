      - number: '3.3'
        title: Capability, pricing, GTM/distribution and trust posture
        blocks:
          - type: paragraph
            body: >-
              On capability, Acronis differentiates with an unusually broad single agent (backup + anti-malware + EDR +
              DLP + patch + RMM-style endpoint mgmt + email security) versus narrower competitors. Veeam, Rubrik and
              Cohesity match or exceed on enterprise backup scale and cyber recovery tooling but do not embed EDR. Datto
              matches Acronis on MSP integration depth and bundles BDR hardware. N-able Cove and NinjaOne match on RMM
              integration but trail on workload breadth. Microsoft 365 Backup wins on price for low-storage SMBs
              ($0.15/GB) but does not cover endpoints, servers or third-party SaaS. On pricing, third-party comparisons
              for MSP-channel per-user/month rates show Acronis at the high end of the cluster (~$4.25/user/month),
              Veeam Data Cloud ~$4.10, Backupify (Datto) ~$3.00, NinjaOne ~$2.79, Druva ~$2.25, AvePoint ~$2.00, Cove
              (N-able) ~$1.99, CloudAlly ~$1.50, MSP360 ~$1.10, NAKIVO/BDRShield ~$1.00. On GTM and distribution,
              Acronis is channel-only (20,000+ MSPs); Datto/Kaseya is channel-only with the largest unified MSP stack;
              Veeam/Rubrik/Cohesity sell direct to enterprises through reseller and systems integrator channels;
              Microsoft and AWS sell direct + through cloud marketplaces. On trust and regulatory posture, Acronis is
              uniquely penalised: the September 2025 FASCSA exclusion order from the U.S. Director of National
              Intelligence directs the Intelligence Community to remove Acronis products, and GSA Advantage delisted
              Acronis in October 2025; no peer Leader (Veeam, Rubrik, Cohesity, Commvault, Druva, Dell) has an
              equivalent federal exclusion on the public record as of May 2026, which materially shifts U.S. federal
              trust posture against Acronis.
