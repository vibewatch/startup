  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Primary Valuation Anchor
        blocks:
          - type: paragraph
            body: >-
              Acronis's most recent arms-length transaction provides the primary valuation anchor for this analysis. In
              August 2024, EQT, a leading European private equity firm, acquired a majority stake in Acronis at an
              implied enterprise valuation of approximately $3.5 billion. This transaction represents a 40% premium to
              the company's previous valuation of $2.5 billion established during its May 2021 Series F round led by CVC
              Capital Partners. The EQT deal provides important validation of Acronis's market position and growth
              trajectory. Private equity firms like EQT typically conduct extensive due diligence before majority
              acquisitions, and the willingness to pay a premium over the previous round suggests confidence in the
              company's fundamentals. Third-party analyst estimates place Acronis's annual revenue in the range of
              $500-700 million, though these figures cannot be independently verified for a private company. GetLatka
              reports $426.3 million for 2024, while Growjo estimates $559.8 million. At the midpoint of this range and
              the reported $3.5 billion valuation, Acronis trades at approximately 5-7x EV/Sales, which aligns with
              comparable software companies in the data protection and cybersecurity space.
