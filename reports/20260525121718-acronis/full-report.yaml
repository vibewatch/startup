  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Organizational Structure
        blocks:
          - type: paragraph
            body: >-
              Acronis International GmbH operates as a global cyber-protection company headquartered in Schaffhausen,
              Switzerland, with significant operational presence in Singapore where the company was originally founded
              in 2003. The company maintains a dual-headquarters model that reflects both its Swiss corporate domicile
              for regulatory and governance purposes and its Asia-Pacific roots for operational agility. Acronis
              currently employs approximately 2,000 personnel across 34 offices spanning more than 150 countries,
              supporting products localized in 26 languages. The organizational structure encompasses several key
              business units: the Cyber Protect Cloud division serving managed service providers (MSPs), the
              consumer-focused True Image product line, and the enterprise Cyber Infrastructure platform. Following the
              August 2024 acquisition by EQT, Acronis operates as a portfolio company under EQT's growth equity
              strategy, with minority stakes retained by CVC Capital Partners, BlackRock, and Springcoast Capital
              Partners. The company's legal entity structure reflects its multinational footprint, with Acronis AG
              serving as the primary Swiss holding entity while various regional subsidiaries handle local operations
              and compliance requirements.
