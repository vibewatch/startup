      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is propelled by four mostly secular drivers: (1) ransomware escalation — 88% of SMB breaches
              involve ransomware, with average total cost per incident around $5M and average recovery cost (ex-ransom)
              around $1.5M; (2) cyber-insurance requirements forcing demonstrable, tested backup as a policy
              precondition; (3) SMB security staffing shortages driving MSP outsourcing — vCISO adoption among MSPs is
              up ~319% YoY; and (4) regulatory expansion (NIS2 in Europe, sectoral breach-notification regimes,
              sovereign-data rules) raising the cost of a missing recovery posture. The principal constraints on Acronis
              specifically are (a) the September 2025 U.S. FASCSA exclusion order, which removes the U.S. Intelligence
              Community and most direct federal spend from its addressable market; (b) hyperscaler-native backup eating
              the bottom of the SMB market (Microsoft 365 retention, AWS Backup, etc.); (c) platform consolidation
              pressure as buyers shift toward CrowdStrike-/Microsoft-/Palo Alto-class XDR super-platforms; and (d)
              switching costs that work in Acronis's favor inside MSPs but against it on first-touch deals where
              competitor incumbency is high. None of these constraints is existential, but the FASCSA item is an
              idiosyncratic SAM compression unique to Acronis.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
