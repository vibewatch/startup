  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Geopolitical Risks
        blocks:
          - type: paragraph
            body: >-
              The September 2025 FASCSA exclusion order represents the most severe regulatory action possible under U.S.
              supply chain security law. Issued by the Director of National Intelligence, this order bars Acronis AG and
              its affiliates from all procurement by the Intelligence Community and establishes binding requirements for
              the broader federal acquisition ecosystem. The GSA immediately removed Acronis products from GSA
              Advantage, and federal contractors face mandatory 30-day reporting and 60-day removal timelines. This
              action stems from concerns about foreign influence and supply chain integrity, though specific classified
              rationale remains undisclosed. The company's Swiss headquarters, Singapore-based founder Serguei Beloussov
              (Russian-born, stepped down as CEO May 2021), and distributed engineering operations across multiple
              jurisdictions create a complex ownership and control structure that has drawn national security scrutiny.
              Unlike the Kaspersky prohibition which was limited to civilian agencies, the FASCSA order's IC origination
              signals heightened concern about intelligence-community-specific supply chain risks. Re-entry into the
              federal market would require either successful appeal of the order, structural changes to corporate
              governance and ownership, or demonstration that covered articles have been materially modified to address
              security concerns. The absence of FedRAMP authorization—despite maintaining SOC 2, ISO 27001, and HIPAA
              compliance—further constrains government market access. International regulatory divergence may provide
              partial offset, as EU data sovereignty requirements and Digital Operational Resilience Act (DORA)
              compliance create demand for non-U.S.-controlled backup solutions, though this represents a strategic
              pivot rather than mitigation of federal market loss.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
