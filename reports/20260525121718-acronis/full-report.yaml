      - number: '7.2'
        title: Security and Product Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Acronis products have demonstrated a persistent pattern of critical security vulnerabilities that
              undermine confidence in the company's core value proposition of cyber protection. CVE-2023-45249, a remote
              code execution vulnerability with CVSS 9.8 severity affecting Acronis Cyber Infrastructure, was added to
              CISA's Known Exploited Vulnerabilities catalog in July 2024 following confirmed in-the-wild exploitation.
              The vulnerability, rooted in default credential usage, enabled unauthenticated attackers to gain complete
              system control—a particularly damaging finding for a security-focused vendor. The 2026 vulnerability
              disclosure pace has accelerated, with 35 CVEs published including privilege escalation flaws
              (CVE-2026-41952, CVE-2026-33092) and information disclosure vulnerabilities (CVE-2026-28710). Several
              vulnerabilities affect the Acronis True Image product line targeting consumer and SMB markets, while
              others impact enterprise-grade Cyber Protect solutions. The pattern suggests systemic issues in secure
              development lifecycle implementation rather than isolated incidents. CISA's binding operational directive
              requiring federal agencies to remediate known exploited vulnerabilities compounds the commercial impact,
              as enterprises increasingly align patch management with federal standards. The security track record
              directly conflicts with Acronis's market positioning as an integrated cyber protection platform, creating
              cognitive dissonance for security-conscious procurement teams evaluating the vendor. Remediation requires
              not only patching disclosed vulnerabilities but demonstrating measurable improvement in vulnerability
              density and time-to-patch metrics over multiple release cycles.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR036
              - CR040
