      - number: '4.5'
        title: Capital adequacy, financing dependency and next-round trigger
        blocks:
          - type: paragraph
            body: >-
              Acronis's capital structure is concentrated post-EQT. In August 2024, EQT (via its EQT X fund) and BPEA
              (Baring Private Equity Asia, also EQT-affiliated) took a majority stake at an implied enterprise value of
              ~USD 3.5 billion (TechCrunch, SiliconAngle, EQT press release). BlackRock-managed funds, CVC Capital
              Partners VII, Springcoast Partners and Acronis's founders rolled minority stakes. The Company Overview
              chronology covers the full round-by-round history; the financially material point for this chapter is that
              EQT's PE-X vintage capital is fresh (closed 2024), which gives Acronis a 5–7 year exit horizon and means
              no further primary capital event is imminent. The cash injection sizing on the EQT transaction is not
              disclosed (majority stake at $3.5B EV implies plausible primary/secondary mix but no breakdown), nor is
              the debt component (PE majority deals in software typically include 4–6x EBITDA in committed term-loan /
              unitranche facilities — implied for Acronis but not confirmed). Use of funds was framed as growth +
              product + M&A in the EQT press release. Next-round trigger is therefore a 2028–2031 EQT exit window (IPO
              or secondary sale), not a runway-driven raise. Adverse financial signals on capital adequacy are
              concentrated in the September 2025 FASCSA exclusion and October 2025 GSA Advantage delisting (Mayer
              Brown), which carve U.S. federal sales out of the pipeline and create a contingent revenue headwind;
              Acronis has not quantified the impact. Layoffs.fyi does not record an Acronis-specific layoff event of
              material size as of May 2026, but headcount tracker drift (Tracxn -13% YoY directionally, Revelio +8% YoY
              directionally — the discrepancy is itself a data reliability flag) is a soft signal worth monitoring.
