              email security, and DLP as add-on packs to the base platform. The XDR module integrates with existing SIEM
              platforms for threat correlation, while EDR provides behavioral analysis with integrated backup for rapid
              recovery after security incidents. Email security delivers AI-powered anti-phishing for Microsoft 365 and
