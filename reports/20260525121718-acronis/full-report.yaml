      - number: '3.4'
        title: Switching cost, lock-in, multi-homing and supply/partner access
        blocks:
          - type: paragraph
            body: >-
              Backup software is famously sticky once deployed because customer data, schedules, retention policies and
              recovery runbooks accrue inside the vendor's catalog; the dominant churn vector is platform consolidation
              events (M&A, RMM/PSA replatform, regulatory exclusion) rather than feature dissatisfaction. Switching cost
              for an MSP moving off Acronis is meaningful — re-baselining tenants, retraining engineers, rebuilding
              monitoring/alert integrations (BackupRadar etc.) — but is bounded by the fact that MSPs routinely
              multi-home, running two or three backup stacks simultaneously to serve different customer SLAs. That makes
              the true lock-in a "share of wallet" battle, not a binary swap. Distribution power is the determinative
              moat in MSP-channel: Acronis's 20,000+ MSP relationships and #MSPWorld / #AcronisGo partner programming
              are real assets, but Kaseya's unified stack (Datto BDR + RMM + PSA + security) compresses the surface area
              an MSP needs from any single vendor, Datto/Kaseya cross-sell economics are unmatched, and rising
              challengers (NinjaOne post-IPO, Heimdal as unified SecOps) chip at the edges. Supplier/partner access is
              broadly symmetric: the same hyperscalers (AWS, Azure, Google) host every competitor's cloud, and the same
              MSPs can re-platform between them. The asymmetric supplier risk on Acronis is geopolitical / regulatory:
              FASCSA-driven exclusion removes the U.S. federal supply path entirely, an exposure peers do not share.
            claimRefs:
              - CP031
              - CP032
              - CP033
