artifact: market-analysis
slug: acronis
runDate: "2026-05-25"
company:
  name: Acronis

chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Acronis sells into the convergence of three connected markets: data
    protection / backup software ($13–19B in 2026 depending on the lens),
    managed services delivered by 20,000+ MSPs globally (a $430–490B service
    spend with cybersecurity its fastest-growing segment), and ransomware-driven
    cyber-resilience tooling. Demand is structurally tailwinded by ransomware
    escalation (88% of SMB breaches involve ransomware; recovery costs
    $1.5–5M) and SMB under-staffing of security (60%+ of SMBs have no
    dedicated security headcount, defaulting them to MSP delivery). The
    binding constraint on Acronis specifically is the September 2025 FASCSA
    exclusion, which carves the U.S. federal slice out of the SAM.

sections:
  - id: market-boundary
    title: Market boundary, adjacencies and substitutes
    body: >-
      Acronis competes in the intersection of three interlocking markets. The
      core market is data protection and backup software — independent
      definitions place 2026 spend at $12.8B (IDC data replication and
      protection software) up to $18.9B (broader data backup and recovery,
      Research and Markets) with a $14.99B mid-point (Business Research
      Insights). Adjacent and increasingly bundled are endpoint protection /
      EDR / XDR ($6.3B–$7.2B EDR; $3.7B XDR, 2026), DRaaS / cyber-recovery
      services, and managed cybersecurity services. The status-quo substitutes
      that Acronis is displacing are hyperscaler-native backup (AWS Backup,
      Microsoft 365 native retention), home-grown scripts at SMBs, and
      legacy on-prem appliances from Veritas / Veeam / Commvault. The "channel
      market" inside which Acronis monetizes — the global managed services
      provider services market — is $430–490B in 2026 and growing 10–14%
      CAGR; Acronis's wallet share comes out of MSP cybersecurity and
      backup-as-a-service line items, not direct enterprise software budgets,
      which materially changes the buyer/payer triangle.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: TAM / SAM / SOM sizing under multiple lenses
    body: >-
      Sizing this market with one number is misleading because the buyer, the
      delivery mechanism and the spend pool change across lenses. A
      software-only TAM lens (data protection and backup software) yields
      $12.8B (IDC) to $18.9B (Research and Markets) in 2026; SAM for
      MSP-delivered SaaS — Acronis's actual route to market — is the share of
      the $93–106B managed security services market that touches data
      protection plus a fraction of the broader $430–490B MSP services pie. A
      cyber-resilience lens adds EDR/XDR ($10B+) and DRaaS to the boundary,
      pushing combined relevant spend toward $40B. SOM is bounded mechanically:
      Acronis serves 750,000 of an estimated ~33M global SMBs through its MSP
      partners; if average platform spend is $400–$1,200 per protected
      business per year (Acronis pricing range from public partner brochures
      and industry trades), implied platform revenue lies in a $300M–$900M
      band — consistent with sub-unicorn ARR estimates for late-stage
      data-protection peers but unverifiable without disclosure. The range
      figure (FM002) captures this fan-out.
    claimRefs: [CM001, CM002, CM003, CM009, CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyer-payer-segmentation
    title: Buyer, user and payer segmentation
    body: >-
      Acronis's GTM is unusual because the payer and the user are usually
      different organizations. The MSP partner buys (and pays for) the
      platform on a per-seat / per-workload basis under a "Managed Partner
      Program" agreement; the user is the MSP's technical team that operates
      the console; and the end customer — typically an SMB of 10–500 seats
      —is the economic payer who funds the MSP's monthly bill. Inside the
      end-customer organization the budget owner is usually the IT director
      or vCISO, with 60%+ of SMBs running with no dedicated security
      headcount — which is exactly why MSP delivery has won the segment. For
      mid-market and enterprise, Acronis sells direct under Cyber Protect
      and ACI, where the buyer is the IT infrastructure / security team and
      the payer is a corporate IT budget line; this segment is materially
      smaller for Acronis than MSP and is where competitors Veeam, Rubrik,
      Cohesity, Commvault are strongest. In the consumer channel, the user
      and the payer are the same person and pricing is subscription /
      perpetual-license retail under the Cyber Protect Home Office brand.
    claimRefs: [CM015, CM016, CM017, CM018, CM019, CM020, CM021, CM022]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      Demand is propelled by four mostly secular drivers: (1) ransomware
      escalation — 88% of SMB breaches involve ransomware, with average
      total cost per incident around $5M and average recovery cost (ex-ransom)
      around $1.5M; (2) cyber-insurance requirements forcing demonstrable,
      tested backup as a policy precondition; (3) SMB security staffing
      shortages driving MSP outsourcing — vCISO adoption among MSPs is up
      ~319% YoY; and (4) regulatory expansion (NIS2 in Europe, sectoral
      breach-notification regimes, sovereign-data rules) raising the cost of
      a missing recovery posture. The principal constraints on Acronis
      specifically are (a) the September 2025 U.S. FASCSA exclusion order,
      which removes the U.S. Intelligence Community and most direct federal
      spend from its addressable market; (b) hyperscaler-native backup eating
      the bottom of the SMB market (Microsoft 365 retention, AWS Backup, etc.);
      (c) platform consolidation pressure as buyers shift toward
      CrowdStrike-/Microsoft-/Palo Alto-class XDR super-platforms; and (d)
      switching costs that work in Acronis's favor inside MSPs but against
      it on first-touch deals where competitor incumbency is high. None of
      these constraints is existential, but the FASCSA item is an
      idiosyncratic SAM compression unique to Acronis.
    claimRefs: [CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM031, CM032]
    tableRefs: [TM004]
    figureRefs: [FM004]
  - id: gaps-and-contradictions
    title: Sizing gaps and contradictory estimates
    body: >-
      The five 2026 estimates for "data protection / backup" software differ
      by 50% top-to-bottom, reflecting boundary choices — IDC's $12.8B
      "replication and protection" excludes DRaaS, while Fortune Business
      Insights' $10.9B "data protection and recovery solutions" and Research
      and Markets' $18.9B "data backup and recovery" use broader brackets.
      No source publishes a clean MSP-channel-delivered cyber-protection sub
      market that exactly matches Acronis's revenue pool, leaving SAM/SOM
      dependent on triangulation. Acronis's own ARR is undisclosed (carried
      forward from Chapter 1's evidence gap), so the SOM number cannot be
      independently confirmed. Contradictory estimates have been preserved
      rather than averaged: the sizing-lens table (TM002) shows the spread,
      and the range figure (FM002) shows the low-base-high band so the
      investment case can be re-cut under different boundary assumptions.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM033, CM034, CM035]

