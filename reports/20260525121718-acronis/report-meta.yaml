coverageNotes: >-
  Coverage reflects Acronis's own corporate, product and partner pages, the August 2024 EQT
  transaction press release and TechCrunch reporting, third-party financial trackers (Latka,
  RocketReach, compworth, Tracxn, Pitchbook), Cobweb's 2026 published MSP licensing pricing,
  peer financial filings (Veeam, Rubrik, Commvault), independent reviews on G2 and Gartner Peer
  Insights, and the September 2025 Mayer Brown analysis of the first-ever FASCSA exclusion order
  against Acronis AG, all reviewed through May 25, 2026. Evidence is strong on identity, capital
  history, product surface, published list pricing, MSP partner count and the FASCSA event.
  Evidence is weak on audited revenue, gross/EBITDA margin, NRR, CAC, EQT primary/secondary
  split, federal-channel revenue carve-out and consumer-line vintage; several of these are
  treated as material diligence blockers.
