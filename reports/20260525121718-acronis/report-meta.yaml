companyProfile:
  summary: >-
    Acronis is a 2003-founded cyber-protection vendor that has converged backup, disaster
    recovery, anti-malware, EDR/MDR, email security, DLP and endpoint management into a single
    Cyber Protect Cloud platform sold primarily through 20,000+ MSP partners that in turn
    protect 750,000+ end businesses. Operating headquarters are split between Schaffhausen
    (Switzerland) and Singapore. The company is run by CEO Patrick Pulvermueller (since July
    2021) with co-founder Serguei Beloussov as Founder/Chief Research Officer. EQT took a
    majority stake in August 2024 at an implied USD 3.5B enterprise value with BlackRock, CVC,
    Springcoast and the founders rolling minority positions. The most material adverse event on
    the record is the September 2025 FASCSA exclusion order from the U.S. Director of National
    Intelligence — the first ever issued — which carves out the U.S. federal slice of Acronis's
    served-available market.
  foundedDate: '2003-01-01'
  founders:
    - name: Serguei Beloussov
      role: Founder / Chief Research Officer
      background: Russian-born Singaporean entrepreneur; founded Acronis as a 2003 spin-out of SWsoft (which became Parallels); previously CEO of Acronis through multiple periods.
      claimRefs: [CO001, CO008]
  foundingLocation: Singapore (original incorporation) / Switzerland (operating HQ)
  headquarters: Schaffhausen, Switzerland (corporate) / Singapore (group HQ)
  productSummary: >-
    Four-product family: Cyber Protect Cloud (multi-tenant MSP SaaS platform — the dominant
    revenue stream), Cyber Protect (direct on-prem / hybrid enterprise edition), Cyber
    Infrastructure (per-TB software-defined storage and HCI), and Cyber Protect Home Office
    (consumer subscription descended from True Image). All converge on a single "cyber
    protection" thesis combining backup + security + endpoint management.
  customerFocus: >-
    Managed service providers and their SMB / mid-market end customers; direct mid-market and
    enterprise via channel + field; sovereign/regulated buyers in EMEA and APAC; consumer.
    Public 2026 traction: 20,000+ MSP partners and 750,000+ end businesses across 44+ Acronis
    data center regions.
  businessModel: >-
    Channel-first subscription software. MSP Cyber Protect Cloud is billed per-workload (e.g.,
    £19.50/server/mo, £2.30/M365 seat/mo) or per-GB (£0.05/GB/mo Acronis-hosted), with up to
    35% volume discounts for top-tier MSP commitments. Enterprise edition is perpetual +
    maintenance or per-TB; consumer is annual subscription.
  stage: Private (EQT majority, August 2024)
  fundingStatus: >-
    EQT (via EQT X) + BPEA took a majority stake on 7 August 2024 at an implied ~USD 3.5B
    enterprise value; BlackRock-managed funds, CVC Capital Partners VII, Springcoast Partners
    and the founders rolled minority positions. Tracker estimates of lifetime equity raised
    pre-EQT disagree materially: Latka cites ~$408M while Tracxn cites ~$658M; the EQT primary
    vs. secondary cash split, debt component and use-of-funds detail are not disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO008, CO011, CO021, CO024, CO027, CO023, CI022, CI023, CI025, CI029, CI032]
summary:
  headline: Acronis is a credible channel-anchored cyber-protection platform with a fresh EQT capital event at an implied $3.5B EV, but no audited financials and a first-ever FASCSA federal exclusion order make this a research-more, not a conviction, story for 2026 underwriting.
  overallScore: 5.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 3500
    revenueRunRateUsdM: 426
    arrUsdM: 426
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 408
    customerCount: 750000
    headcount: 2490
  topStrengths:
    - Channel-first MSP motion with 20,000+ partners protecting 750,000+ end businesses is the largest disclosed MSP cyber-protection footprint in the public dataset.
    - Fully published list pricing across per-workload and per-GB models gives unusual transparency on monetization for a private vendor.
    - Fresh EQT majority capital event (August 2024, ~$3.5B EV) provides 5–7 year runway and removes the near-term primary-raise dependency.
    - Converged product surface (backup + security + endpoint management) lets MSPs consolidate vendor sprawl, which is a documented driver of partner retention.
    - 44+ Acronis-hosted data center regions support sovereign and regulated buyers that hyperscaler-first peers struggle to serve.
  topRisks:
    - The September 2025 FASCSA exclusion and October 2025 GSA Advantage delisting carve U.S. federal sales out of the pipeline and create an unquantified revenue headwind.
    - No audited financials are public; every revenue, margin, NRR, CAC and capital-efficiency figure is tracker-derived or peer-inferred rather than disclosed.
    - Third-party trackers disagree materially on lifetime equity raised (Latka $408M vs. Tracxn $658M) and on headcount YoY (Tracxn -13% vs. Revelio +8%), reducing confidence in any single private-tier datapoint.
    - Founder geopolitics and Russia/CIS engineering exposure remain a persistent backdrop risk against Western federal and defense procurement.
    - Hyperscaler-native backup (AWS Backup, Azure Backup Center, Google Backup & DR) is a structural substitution risk for the cloud-native portion of the SAM.
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, EBITDA, cash, debt schedule and NRR / GRR are not in the public record.
    - EQT 2024 transaction primary vs. secondary cash split, debt component and use of funds are not disclosed.
    - Quantified U.S. federal-channel revenue exposure to the FASCSA exclusion has not been disclosed.
    - Revenue mix across MSP Cyber Protect Cloud, enterprise on-prem and consumer streams is qualitative only.
    - Consumer Cyber Protect Home Office "5M+ users" vintage and ARPU are not in the public record.
