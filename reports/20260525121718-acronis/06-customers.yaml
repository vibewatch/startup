company:
  name: Acronis
chapter:
  number: 6
  title: Customers
  summary: >-
    Acronis serves three customer surfaces — MSP-channel SMB / mid-market (20,000+ MSPs, 750,000+ protected businesses),
    direct mid-market / enterprise (sports / live-events marquee logos) and consumer Home Office / True Image (~5M
    users). Retention metrics are private; the highest-fidelity public retention proof is the Manchester City 2026
    renewal. The September 2025 FASCSA exclusion eliminates the U.S. federal segment.
sections:
  - id: customer-base-segmentation-by-buyer-user-and-channel
    title: Customer base segmentation by buyer, user and channel
    body: >-
      The Acronis customer base separates into three distinct buyer surfaces. The dominant surface is the MSP-channel
      SMB / mid- market: more than 20,000 Managed Service Providers contract with Acronis under the Managed Partner
      Program and resell Cyber Protect Cloud per-workload subscriptions to approximately 750,000 protected businesses
      across more than 150 countries. The MSP is both the buyer and the operator; the SMB / mid-market business is the
      protected end customer who experiences the product but typically does not contract directly with Acronis. The
      second surface is direct mid-market and enterprise IT buying Acronis Cyber Protect and Acronis Cyber
      Infrastructure under quote-based contracts; this includes industries such as sports / live events, financial
      services, manufacturing, healthcare and higher education (per Acronis case-study coverage). The third surface is
      the consumer base for Cyber Protect Home Office, with the legacy True Image installed base supporting an
      Acronis-reported ~5 million consumer users on perpetual and subscription licenses. Geographic coverage is global,
      with the EMEA, North America and APAC regions all explicitly serviced through localized partner programs and 50+
      data centers (see Chapter 5).
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-usage-signals
    title: Adoption trajectory and usage signals
    body: >-
      The publicly observable adoption trajectory rests on a handful of company-reported scale and growth signals.
      Acronis reports 20,000+ MSP partners and 750,000+ protected businesses on its 2026 marketing surfaces, both up
      versus prior-year numbers (Acronis previously reported 18,000 MSPs and ~500,000 protected businesses in 2022-2023
      era marketing). TechCrunch's August 2024 EQT deal coverage quotes a reporter-relayed 40 percent cloud-ARR growth
      in 2024 — the closest visible growth proxy for paid subscription adoption. Renewal-rate, churn, and seat-expansion
      metrics are not published; the closest public signal is review- site sentiment which favors Cyber Protect Cloud
      (G2, TrustRadius, PeerSpot) and which Acronis has called out publicly via its "G2 consensus" blog post. Channel
      adoption is corroborated by the 2026 Acronis Partner Kickoff event and continued distribution relationships with
      Ingram Micro, TD SYNNEX and regional VADs (see Chapter 4).
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU002
  - id: named-customer-proof-production-deployments
    title: Named customer proof — production deployments
    body: >-
      Named-customer evidence at the reporting date concentrates in three buckets. First, sports / live-events
      partnerships: Williams Racing (Formula 1), Manchester City Football Club (renewed for 2026 per Acronis press),
      Arsenal FC, Chicago Bears (NFL, via MSP Nobletec), Utah Jazz (NBA, secured Google Workspace with Acronis), Inter
      Miami CF (MLS) and the Formula E Championship are all publicly disclosed as Acronis customer / partner
      relationships. Second, MSP-led named case studies on acronis.com: Cintech (disaster recovery, financial services
      client downtime elimination), Technotic (financial services zero-downtime recovery using Cyber Protect Cloud),
      Nobletec (Chicago Bears program management) and Six ICT (MDR / TRU delivery). Third, third-party review platforms
      (G2, Capterra, Gartner Peer Insights, TrustRadius, PeerSpot) carry hundreds of reviews per product line that
      include user-attributable deployments. Sports and end-customer logos prove brand legitimacy and broad commercial
      deployment; review-site evidence proves operational adoption across SMB and mid-market. None of these sources
      discloses revenue per named customer.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
    tableRefs:
      - TU003
    figureRefs:
      - FU002
  - id: retention-durability-and-satisfaction-signals
    title: Retention, durability and satisfaction signals
    body: >-
      Acronis does not publish NRR, GRR, churn, contract length or cohort retention curves. The third-party retention
      proxy is review-site sentiment: G2 carries Acronis Cyber Protect Cloud as a leading entry in the backup category
      with broad positive reviews; Gartner Peer Insights ratings on the Endpoint Protection Platforms, Backup and
      Recovery Software, and DRaaS categories place Acronis among the most-reviewed vendors; TrustRadius and PeerSpot
      review counts are substantial with broadly favorable scores. Two adverse signals to weigh: the 2023 Acronis
      customer-database compromise (covered by Bleeping Computer, CSO Online, Dark Reading, Security Affairs, Tech
      Monitor) and the criticism of Acronis breach-disclosure practices on Dark Reading — both are reputational drag on
      retention even though no quantified churn impact has been reported. Manchester City's publicly announced 2026
      renewal is the highest-fidelity public retention proof point and signals that headline sports partnerships are not
      pure brand arrangements but include multi-year commercial commitments.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
    tableRefs:
      - TU004
    figureRefs:
      - FU003
      - FU004
  - id: expansion-motion-and-concentration-risk
    title: Expansion motion and concentration risk
    body: >-
      Expansion at Acronis runs along three vectors. Per-workload expansion at the protected-business level (add more
      endpoints, add Advanced packs). Per-MSP expansion at the partner level (MSP partner adds more end customers on the
      platform). And product-line cross-sell where MSPs adopt Advanced Security, Advanced MDR, or Advanced DLP packs in
      addition to base backup. Concentration risk is structural rather than empirically measurable: customer
      concentration at the end-business level is almost certainly low (750,000+ tail), but channel concentration among
      the top MSP partners is unknown and likely material — the top-100 MSP partners may carry a disproportionate share
      of workload bookings. The September 2025 FASCSA exclusion order eliminates the U.S. federal customer segment
      entirely (procurement banned across the Intelligence Community and removed from GSA Advantage). Microsoft 365
      bundling pressure (Microsoft 365 Backup first-party) is the structural ceiling for the M365 SaaS-backup expansion
      motion (see Chapter 5).
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
    tableRefs:
      - TU005
