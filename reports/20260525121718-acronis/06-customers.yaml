  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, contract length and cohort retention curves at Acronis.
      whyItMatters: These are the standard inputs for retention-driven valuation modeling.
      diligencePath: NRR / GRR / cohort report under NDA from EQT sponsor data room.
      relatedQuestionRefs:
        - QU009
        - QU010
        - QU021
    - type: private-evidence-only
      severity: material
      topic: msp-concentration
      missingEvidence: Top-MSP partner concentration in Acronis bookings.
      whyItMatters: Top-MSP loss is the largest concentrated revenue risk; cannot be assessed publicly.
      diligencePath: Top-100 MSP partner concentration disclosure under NDA.
      relatedQuestionRefs:
        - QU012
    - type: missing-source
      severity: material
      topic: fascsa-revenue-impact
      missingEvidence: Quantified federal revenue contribution lost to the September 2025 FASCSA exclusion.
      whyItMatters: Determines actual material business impact of the FASCSA exclusion.
      diligencePath: Acronis disclosure of pre-exclusion federal revenue share.
      relatedQuestionRefs:
        - QU015
        - QU016
    - type: private-evidence-only
      severity: material
      topic: consumer-paid
