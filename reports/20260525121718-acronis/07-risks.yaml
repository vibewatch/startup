callouts:
- calloutType: risk
  title: 'FASCSA Exclusion: First-Ever IC Supply Chain Ban'
  body: The September 2025 FASCSA exclusion order is the first ever issued under the Federal Acquisition Supply Chain Security Act, barring Acronis from all Intelligence Community procurement and requiring federal contractors to remove Acronis products within 60 days. This unprecedented action signals the highest level of national security concern and establishes precedent that may extend to civilian agencies or allied nations.
  claimRefs:
  - CR001
  - CR002
  - CR003
- calloutType: risk
  title: 'CVE-2023-45249: Actively Exploited Critical Vulnerability'
  body: CVE-2023-45249 (CVSS 9.8) in Acronis Cyber Infrastructure enables remote code execution via default credentials and was added to CISA's Known Exploited Vulnerabilities catalog in July 2024 following confirmed in-the-wild exploitation. For a security vendor, active exploitation of a critical product vulnerability represents fundamental credibility damage.
  claimRefs:
  - CR009
  - CR010
- calloutType: risk
  title: 2026 Vulnerability Disclosure Acceleration
  body: With 35 CVEs disclosed in 2026 alone—including privilege escalation (CVE-2026-41952, CVE-2026-33092) and information disclosure (CVE-2026-28710) vulnerabilities—Acronis demonstrates a systemic pattern of security issues that contradicts its 'cyber protection' market positioning and suggests structural gaps in secure development practices.
  claimRefs:
  - CR011
  - CR012
  - CR013
- calloutType: risk
  title: 'Market Share Erosion: 6.6% vs Dominant Competitors'
  body: Acronis's approximately 6.6% market share trails leader Veeam (~21%) by more than 3x, while the Cohesity-Veritas merger created the industry's largest entity and Rubrik's IPO signals investor preference for cloud-native architectures. The competitive gap compounds regulatory exclusion by limiting scale advantages and R&D investment capacity.
  claimRefs:
  - CR016
  - CR017
  - CR018
- calloutType: risk
  title: PE Ownership Creates Exit Timeline Pressure
  body: EQT's August 2024 majority acquisition at $3.5B+ valuation creates typical PE exit pressure within a 4-6 year horizon, conflicting with the multi-year remediation timeline required to address FASCSA exclusion, rebuild security credibility, and stabilize competitive position.
  claimRefs:
  - CR024
  - CR025
- calloutType: insight
  title: Compliance Foundation Provides Remediation Base
  body: Despite regulatory exclusion, Acronis maintains SOC 2 Type II, ISO 27001, HIPAA compliance, and GDPR alignment—demonstrating baseline security program maturity that could support remediation efforts. The compliance infrastructure exists; execution and structural changes are the gaps.
  claimRefs:
  - CR008
  - CR031
  - CR032
- calloutType: risk
  title: No FedRAMP Authorization Limits Government Path
  body: The absence of FedRAMP authorization—required for government cloud deployments—represents a fundamental gap in Acronis's government market access that predates and compounds the FASCSA exclusion. Even if regulatory exclusion were resolved, FedRAMP pursuit would require 12-24 months minimum.
  claimRefs:
  - CR005
  - CR022
