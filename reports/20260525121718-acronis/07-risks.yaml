company:
  name: Acronis
chapter:
  number: 7
  title: Risks
  summary: Acronis AG faces an unprecedented regulatory crisis following the September 2025 FASCSA exclusion order—the first ever issued under the Federal Acquisition Supply Chain Security Act—which bars the company from all U.S. Intelligence Community procurement and requires federal contractors to remove Acronis products within 60 days. This existential threat to federal revenue compounds persistent security vulnerabilities, including the actively exploited CVE-2023-45249 (CVSS 9.8) and 35 additional CVEs disclosed in 2026 alone. The company's competitive position has eroded to approximately 6.6% market share against dominant players Veeam (21%) and the merged Cohesity-Veritas entity. EQT's majority acquisition at $3.5B+ valuation creates exit pressure that may conflict with the multi-year remediation timeline required to address regulatory exclusion. The combination of regulatory prohibition, security track record, and competitive disadvantage positions Acronis as a high-risk investment
    requiring extensive due diligence on remediation pathways and federal market re-entry feasibility.
sections:
- id: regulatory-geopolitical
  title: Regulatory and Geopolitical Risks
  body: The September 2025 FASCSA exclusion order represents the most severe regulatory action possible under U.S. supply chain security law. Issued by the Director of National Intelligence, this order bars Acronis AG and its affiliates from all procurement by the Intelligence Community and establishes binding requirements for the broader federal acquisition ecosystem. The GSA immediately removed Acronis products from GSA Advantage, and federal contractors face mandatory 30-day reporting and 60-day removal timelines. This action stems from concerns about foreign influence and supply chain integrity, though specific classified rationale remains undisclosed. The company's Swiss headquarters, Singapore-based founder Serguei Beloussov (Russian-born, stepped down as CEO May 2021), and distributed engineering operations across multiple jurisdictions create a complex ownership and control structure that has drawn national security scrutiny. Unlike the Kaspersky prohibition which was limited to
    civilian agencies, the FASCSA order's IC origination signals heightened concern about intelligence-community-specific supply chain risks. Re-entry into the federal market would require either successful appeal of the order, structural changes to corporate governance and ownership, or demonstration that covered articles have been materially modified to address security concerns. The absence of FedRAMP authorization—despite maintaining SOC 2, ISO 27001, and HIPAA compliance—further constrains government market access. International regulatory divergence may provide partial offset, as EU data sovereignty requirements and Digital Operational Resilience Act (DORA) compliance create demand for non-U.S.-controlled backup solutions, though this represents a strategic pivot rather than mitigation of federal market loss.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
- id: security-vulnerabilities
  title: Security and Product Vulnerabilities
  body: Acronis products have demonstrated a persistent pattern of critical security vulnerabilities that undermine confidence in the company's core value proposition of cyber protection. CVE-2023-45249, a remote code execution vulnerability with CVSS 9.8 severity affecting Acronis Cyber Infrastructure, was added to CISA's Known Exploited Vulnerabilities catalog in July 2024 following confirmed in-the-wild exploitation. The vulnerability, rooted in default credential usage, enabled unauthenticated attackers to gain complete system control—a particularly damaging finding for a security-focused vendor. The 2026 vulnerability disclosure pace has accelerated, with 35 CVEs published including privilege escalation flaws (CVE-2026-41952, CVE-2026-33092) and information disclosure vulnerabilities (CVE-2026-28710). Several vulnerabilities affect the Acronis True Image product line targeting consumer and SMB markets, while others impact enterprise-grade Cyber Protect solutions. The pattern suggests
    systemic issues in secure development lifecycle implementation rather than isolated incidents. CISA's binding operational directive requiring federal agencies to remediate known exploited vulnerabilities compounds the commercial impact, as enterprises increasingly align patch management with federal standards. The security track record directly conflicts with Acronis's market positioning as an integrated cyber protection platform, creating cognitive dissonance for security-conscious procurement teams evaluating the vendor. Remediation requires not only patching disclosed vulnerabilities but demonstrating measurable improvement in vulnerability density and time-to-patch metrics over multiple release cycles.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
