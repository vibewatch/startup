      - TV002
    figureRefs:
      - FV002
  - id: ma-transaction-benchmarks
    title: M&A Transaction Benchmarks
    body: >-
      Recent M&A activity in the data protection and MSP software space provides additional valuation context. Datto, the MSP-focused backup and RMM provider, was acquired by Kaseya in 2022 at approximately 9x revenue, representing a significant premium for a strategic combination. This transaction established a high-water mark for MSP software valuations and reflected synergy expectations in a consolidating market. Veeam, another key competitor in the backup space, was acquired by Insight Partners in 2020 for $5 billion. While Veeam's exact revenue at acquisition was not disclosed, estimates suggested a multiple in the 6-8x range. Acronis's implied 5-7x multiple sits between these M&A benchmarks, suggesting a fair valuation relative to comparable transactions. The EQT deal represents neither premium M&A pricing nor distressed sale conditions. PE firms typically target mid-single-digit revenue multiples for mature software companies, and Acronis's valuation appears consistent with this framework. The data protection software market is projected to grow at 10-12% CAGR through 2028, and cybersecurity integration is becoming a key differentiator.
    claimRefs:
      - CV019
      - CV020
      - CV024
      - CV025
