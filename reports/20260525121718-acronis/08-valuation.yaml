company:
  name: Acronis
chapter:
  number: 8
  title: Valuation
  summary: >-
    EQT acquired a majority stake in Acronis in August 2024 at an implied valuation of approximately $3.5 billion. Third-party revenue estimates range from $426M to $560M, implying a 5-7x EV/Sales multiple. The valuation appears fair relative to public comparable companies, with the recommendation being track given limited accessibility as a PE-majority-owned private company.
sections:
  - id: primary-valuation-anchor
    title: Primary Valuation Anchor
    body: >-
      Acronis's most recent arms-length transaction provides the primary valuation anchor for this analysis. In August 2024, EQT, a leading European private equity firm, acquired a majority stake in Acronis at an implied enterprise valuation of approximately $3.5 billion. This transaction represents a 40% premium to the company's previous valuation of $2.5 billion established during its May 2021 Series F round led by CVC Capital Partners. The EQT deal provides important validation of Acronis's market position and growth trajectory. Private equity firms like EQT typically conduct extensive due diligence before majority acquisitions, and the willingness to pay a premium over the previous round suggests confidence in the company's fundamentals. Third-party analyst estimates place Acronis's annual revenue in the range of $500-700 million, though these figures cannot be independently verified for a private company. GetLatka reports $426.3 million for 2024, while Growjo estimates $559.8 million. At the midpoint of this range and the reported $3.5 billion valuation, Acronis trades at approximately 5-7x EV/Sales, which aligns with comparable software companies in the data protection and cybersecurity space.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV001
      - TV006
    figureRefs:
      - FV001
  - id: public-comparable-analysis
    title: Public Comparable Analysis
    body: >-
      To contextualize Acronis's valuation, we examine a set of publicly traded companies operating in adjacent markets. Rubrik (RBRK), the pure-play data security and backup company, commands a market capitalization of approximately $13.7 billion with subscription ARR of $1.46 billion, implying a forward multiple of 9-10x revenue. Rubrik's premium valuation reflects its hypergrowth profile with over 40% ARR growth and net revenue retention exceeding 120%. Commvault (CVLT), a more established data protection vendor, trades at a market capitalization of approximately $4.4 billion with total ARR of $1.085 billion. Commvault's more modest 4-5x revenue multiple reflects its mature growth profile and ongoing transition from perpetual licenses to subscription models. In the broader cybersecurity space, CrowdStrike (CRWD) represents the premium end with a market capitalization of approximately $168.9 billion and gross margins above 75%. SentinelOne (S), at $6.4 billion market cap, has achieved profitability milestones while maintaining growth above 30%. N-able (NABL), the MSP-focused security vendor most comparable to Acronis's go-to-market, trades at only $689 million market cap and 2-3x revenue multiple, reflecting the SMB segment discount.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV027
