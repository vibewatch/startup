summary:
  headline: Acronis 是一家可信的、以渠道为锚点的网络保护平台；EQT 刚以隐含 $3.5B 企业价值入主，但公司没有审计财务， 且首次遭 FASCSA 联邦排除令，2026 年承销只能继续研究，不能形成高确信投资判断。
