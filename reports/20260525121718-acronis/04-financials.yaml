figures:
  - id: FI001
    title: Revenue model bridge — list price to ARR by stream (illustrative)
    type: flow
    summary: Stylised flow of how Acronis monetizes from list price to ARR by revenue stream; absolute values not anchored (publicly undisclosed mix).
    data:
      nodes:
        - { id: list, label: "List price (per-workload OR per-GB)" }
        - { id: discount, label: "MSP volume discount (≤35%)" }
        - { id: msp, label: "Cyber Protect Cloud (MSP, majority)" }
        - { id: ent, label: "Enterprise on-prem / hybrid (mid)" }
        - { id: con, label: "Consumer Home Office (minority)" }
        - { id: addon, label: "Advanced packs (cross-stream add-on)" }
        - { id: arr, label: "Total ARR (~$420–560M est. 2024–2026)" }
