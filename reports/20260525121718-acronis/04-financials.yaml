artifact: financials
slug: acronis
runDate: "2026-05-25"
company:
  name: Acronis

chapter:
  number: 4
  title: Financials
  summary: >-
    Acronis is private and does not publish audited financials; the public
    financial picture is therefore a mosaic of third-party estimates,
    self-reported headline figures and the August 2024 EQT majority transaction
    that re-priced enterprise value at approximately USD 3.5 billion. Most
    consistent third-party trackers (Latka, Tracxn, RocketReach derivatives)
    place 2024 ARR / revenue at roughly USD 420–426 million and project
    USD 500–560 million by 2026, with headcount around 1,900–2,490 (modest
    YoY drift). Pricing is fully published — Cyber Protect Cloud is sold to
    MSPs on a per-workload (e.g., £19.50/server/mo, £2.95/workstation/mo,
    £2.30/M365 seat/mo) or per-GB basis (£0.05/GB/mo Acronis-hosted storage)
    with up to 35% volume tiering — but the corresponding ARR mix,
    cost-of-revenue structure, gross margin and burn are not in the public
    record. Peer benchmarks frame the gap: Veeam (~$1.5B revenue 2024, ~77%
    GM, ~29% EBITDA), Rubrik ($1.3B FY26 revenue, 80%+ GM, -23% EBITDA),
    Commvault ($1.13B FY26 guide, 81–82% GM, 21% operating margin). Capital
    adequacy is judged adequate-but-undisclosed: EQT majority + retained
    BlackRock/CVC/Springcoast minority + founder rollover (Aug 2024)
    represents a fresh capital event but the cash injection sizing, primary
    vs. secondary split, debt component and use of funds are not public.
    The September 2025 FASCSA exclusion is the single most consequential
    adverse financial signal — it removes the U.S. federal slice of SAM and
    therefore the U.S. federal portion of revenue and pipeline.

sections:
  - id: revenue-streams
    title: Revenue streams, pricing model and recognition
    body: >-
      Acronis monetizes through three revenue streams. The dominant stream is
      Cyber Protect Cloud sold to MSPs on a subscription basis under one of
      two billing models: per-workload (flat monthly fee per protected
      workload — Cobweb's 2026 published list shows £19.50/server/mo,
      £5.70/VM/mo, £2.95/workstation/mo, £2.30/M365 seat/mo, £1.70/mobile/mo)
      or per-GB (Acronis-hosted storage at £0.05/GB/mo, Google/Azure-hosted
      at £0.06/GB/mo, Advanced DR at £0.06/GB/mo Acronis-hosted or
      £0.04/GB/mo hybrid). The MSP must choose one billing model per
      customer; advanced packs (Advanced Backup, Advanced Security, EDR,
      MDR, Email Security, DLP, Disaster Recovery) are licensed on top per
      workload, per user or per GB. Volume discounts of up to 35% are
      available against monthly commitment tiers (Acronis Cloud Licensing
      Guide; Cobweb; Atera support docs). The second stream is direct
      enterprise sales of Acronis Cyber Protect (perpetual + maintenance) and
      Cyber Infrastructure (per-TB software-defined storage) into mid-market
      and enterprise accounts via direct sales and distributors. The third
      stream is the consumer Cyber Protect Home Office line (descended from
      True Image), sold as an annual subscription via web and retail. Acronis
      does not publish the share of revenue across these three streams; trade
      coverage and analyst tracker commentary consistently characterise MSP
      Cyber Protect Cloud as the majority. Revenue recognition follows
      subscription-software conventions (ratable over contract term for
      cloud, perpetual + maintenance ratable over support term for on-prem),
      but absent audited financials there is no public confirmation of
      ASC 606 / IFRS 15 application, deferred-revenue balance, or
      remaining-performance-obligations (RPO) disclosure.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-sales-efficiency
    title: GTM motion, channel economics and sales-efficiency proxies
    body: >-
      Acronis runs a channel-first motion: 20,000+ MSP partners (company
      self-disclosed) are the primary revenue route, complemented by a
      direct field sales team for enterprise Cyber Protect / Cyber
      Infrastructure deals and a high-volume self-serve channel for consumer
      Cyber Protect Home Office. Acronis does not publish a CAC, CAC
      payback, magic number or net-revenue-retention (NRR) figure; in their
      absence, the public sales-efficiency proxies are: (1) self-reported
      MSP partner count growth (from ~10,000 in 2021 to 20,000+ in 2026 —
      ~2x in 5 years implies ~15% partner-CAGR); (2) self-reported
      end-business count growth (750,000+ in 2026 versus ~500,000 in 2021
      partner-program disclosures); (3) third-party ARR estimates (~$328M
      2023 → ~$426M 2024 → ~$559M 2026 estimate per Latka / compworth)
      implying mid-20s % revenue CAGR; (4) MSP per-user/month list pricing
      sitting at the high end of the cluster (~$4.25 M365), consistent with
      a premium / bundled positioning rather than price competition. Channel
      economics for MSPs themselves are well-documented in trade press —
      MSPs typically resell Acronis at a 20–35% gross margin layered on top
      of the per-workload base, with the MSP charging the end customer a
      managed-service fee that bundles labor + license. From an Acronis P&L
      perspective, channel-direct economics imply lower CAC than enterprise
      direct sales but higher channel margin pass-through; sales-and-
      marketing expense as a share of revenue is not publicly disclosed.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: cost-structure-and-margins
    title: Cost structure, gross margins and service-delivery costs
    body: >-
      Acronis's cost structure has four major components — none of which are
      publicly disclosed in audited form but each of which can be triangulated
      from peer benchmarks and product architecture. (1) Cost of revenue:
      cloud infrastructure (Acronis-hosted DCs across 44+ facilities, plus
      Google/Azure-hosted regions) + customer-success / support headcount
      + license royalties on bundled third-party tech. Peers indicate that
      data-protection-platform gross margin sits in the 77–82% band when
      operated efficiently (Rubrik 80% GAAP, Commvault 81–82% non-GAAP
      guidance, Veeam 77% post-SaaS shift); Acronis is reasonably expected
      to be in or below that band given the heavier on-prem / sovereign
      footprint. (2) R&D: Acronis maintains its TRU (Threat Research Unit)
      and product engineering across multiple sites; SaaS-leader peers spend
      18–25% of revenue on R&D. (3) S&M: heavy channel-marketing spend
      (#MSPWorld, #AcronisGo, partner kickoffs, sponsorships); peers spend
      35–50% of revenue on S&M during growth phase. (4) G&A: ~10–15% per
      peer norms. Capex is modest because the platform is software, but
      cloud-DC build-out (44+ DCs) is a meaningful one-time and ongoing
      capex line that peers without sovereign footprints (Druva, Rubrik in
      SaaS mode) avoid. Working-capital is benign for subscription SaaS
      (positive collections vs. expense timing); but Acronis's lower-touch
      MSP channel implies large deferred-revenue balances that may be
      material. None of these figures are public; an audited P&L,
      cohort-level retention and a CAC/LTV worksheet are the priority
      diligence asks.
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI020, CI021]
    tableRefs: [TI004]
    figureRefs: [FI003]
  - id: public-traction-vs-private-gap
    title: Public traction figures versus private-metric gaps
    body: >-
      The public traction surface area is large but uneven. Public, company-
      disclosed: 20,000+ MSP partners, 750,000+ end businesses protected,
      5,000,000+ consumer users (vintage unclear), 44+ data-center regions,
      "20-year heritage" framing, and self-published Cyber Protect Cloud
      licensing list pricing. Public, third-party tracker derived (not
      audited): 2024 ARR/revenue ~$420–426M (Latka), 2025 revenue ~$420M
      (RocketReach), 2026 revenue estimate ~$559.8M (compworth), 2024 total
      raised ~$408M (Latka) / $658M (Tracxn) — the gap between these two
      raised-amount estimates is itself a data-quality signal. Public,
      transactional: USD 3.5B implied enterprise value (TechCrunch, EQT
      transaction August 2024). Private / undisclosed: actual ARR (Acronis
      has never published one), revenue mix across MSP cloud vs. enterprise
      vs. consumer, GAAP/IFRS gross margin, EBITDA, free cash flow, cash
      balance, debt structure, NRR / GRR, CAC / payback, RPO, deferred
      revenue, headcount cost, federal-channel revenue exposure to FASCSA
      exclusion. Crunchbase profile is gated by a Cloudflare block in 2026;
      Pitchbook profile is partially gated. The single largest gap is
      audited financial statements — without them, the EQT valuation
      rationale and any cross-peer multiple comparison must be treated as
      directional, not anchored.
    claimRefs: [CI022, CI023, CI024, CI025, CI026, CI027, CI028]
    tableRefs: [TI005]
    figureRefs: [FI004]
  - id: capital-adequacy
    title: Capital adequacy, financing dependency and next-round trigger
    body: >-
      Acronis's capital structure is concentrated post-EQT. In August 2024,
      EQT (via its EQT X fund) and BPEA (Baring Private Equity Asia, also
      EQT-affiliated) took a majority stake at an implied enterprise value
      of ~USD 3.5 billion (TechCrunch, SiliconAngle, EQT press release).
      BlackRock-managed funds, CVC Capital Partners VII, Springcoast
      Partners and Acronis's founders rolled minority stakes. The Company
      Overview chronology covers the full round-by-round history; the
      financially material point for this chapter is that EQT's PE-X vintage
      capital is fresh (closed 2024), which gives Acronis a 5–7 year exit
      horizon and means no further primary capital event is imminent. The
      cash injection sizing on the EQT transaction is not disclosed
      (majority stake at $3.5B EV implies plausible primary/secondary mix
      but no breakdown), nor is the debt component (PE majority deals in
      software typically include 4–6x EBITDA in committed term-loan / unitranche
      facilities — implied for Acronis but not confirmed). Use of funds was
      framed as growth + product + M&A in the EQT press release. Next-round
      trigger is therefore a 2028–2031 EQT exit window (IPO or secondary
      sale), not a runway-driven raise. Adverse financial signals on capital
      adequacy are concentrated in the September 2025 FASCSA exclusion and
      October 2025 GSA Advantage delisting (Mayer Brown), which carve U.S.
      federal sales out of the pipeline and create a contingent revenue
      headwind; Acronis has not quantified the impact. Layoffs.fyi does
      not record an Acronis-specific layoff event of material size as of
      May 2026, but headcount tracker drift (Tracxn -13% YoY directionally,
      Revelio +8% YoY directionally — the discrepancy is itself a data
      reliability flag) is a soft signal worth monitoring.
    claimRefs: [CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI042]
    tableRefs: [TI006]
    figureRefs: [FI005]
  - id: financial-verdict
    title: Financial verdict — revenue quality, margin path, diligence blockers
    body: >-
      Revenue quality is structurally strong on architecture (subscription
      MSP channel + multi-year enterprise + recurring consumer renewal) but
      structurally unverifiable in 2026 because Acronis publishes no
      audited financials and no GAAP/IFRS-equivalent disclosures. The most
      defensible read: ARR / revenue likely sits in the $420–560M band for
      2024–2026; the EQT $3.5B mark implies ~6–8x trailing revenue, which
      is consistent with private-tier data-protection multiples (below
      Rubrik's public ~11x and Veeam's $15B/$1.7B ~9x but above Commvault's
      public ~5x). Margin path is plausibly attractive (peer leaders sit at
      77–82% GM, 20–30% EBITDA) but not verifiable; the heavier sovereign
      DC footprint and broader product surface (EDR, DLP, RMM-light)
      probably compress gross margin relative to pure-SaaS peers (Druva,
      Rubrik). Capital intensity is moderate (software + cloud DCs) with no
      heavy capex demand. The dominant diligence blockers are (i) absence
      of audited financials, (ii) absence of cohort retention / NRR,
      (iii) absence of FASCSA revenue-impact quantification, (iv) absence
      of EQT-transaction primary/secondary split and debt-component
      disclosure, (v) opacity in the consumer-line vintage of the
      "5M+ users" claim, and (vi) sizable discrepancy in third-party
      tracker numbers (Latka $408M raised vs. Tracxn $658M raised vs.
      compworth $559.8M 2026 revenue projection). The financial verdict
      is therefore: directionally attractive, structurally opaque — a deep
      management-pack review under NDA is mandatory before any
      valuation-anchored capital decision.
    claimRefs: [CI036, CI037, CI038, CI039, CI040, CI041, CI042]
    figureRefs: [FI006]

