  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Audited income statement, balance sheet, cash flow and ARR roll-forward for Acronis FY24 and FY25.
      whyItMatters: Every margin, multiple, capital adequacy and revenue-quality claim in this chapter would move from directional to anchored if audited statements were available.
      diligencePath: Request audited statements (if produced) and 3-year management reporting pack under NDA via EQT investor relations.
      relatedQuestionRefs: [QI011, QI015, QI020, QI025]
      relatedTableRefs: [TI004, TI005, TI006]
    - type: missing-source
      severity: material
      topic: federal-revenue-exposure
      missingEvidence: Quantified Acronis U.S. federal channel revenue exposure to the September 2025 FASCSA exclusion order.
      whyItMatters: Without a federal-channel revenue carve-out, the financial impact of the FASCSA event cannot be bounded.
      diligencePath: Request federal-channel pipeline, contract value and write-off schedule from Acronis CRO office.
      relatedQuestionRefs: [QI019]
      relatedTableRefs: [TI005, TI006]
    - type: stale
      severity: minor
      topic: lifetime-capital
      missingEvidence: Reconciliation between Latka ($408M) and Tracxn ($658M) lifetime equity raised figures for Acronis.
      whyItMatters: A ~$250M discrepancy in the lifetime-raised number undermines confidence in third-party financial trackers more broadly.
      diligencePath: Cross-check against round-by-round chronology in Company Overview (Chapter 1) and verify with EQT or Acronis IR.
      relatedQuestionRefs: [QI013, QI026]
      relatedTableRefs: [TI005, TI006]

