  topStrengths:
    - >-
      Real dual-product commercialization: Avride has live Uber robotaxi service in Dallas and multi-market delivery
      deployments rather than a single demo program.
    - >-
      Strategic partners matter here: Uber, Nebius, Hyundai, Grubhub/Wonder, and Rakuten provide capital, distribution,
      supply, and operating proof that many AV startups never secure.
    - >-
      Delivery operations are the strongest public proof surface, with tangible workflow, manufacturing, and campus
      scale evidence.
  topRisks:
    - >-
      PE26003 is a live underwriting issue: the May 2026 NHTSA probe followed 16 crashes and one minor injury and
      directly challenges the flagship Dallas robotaxi narrative.
    - >-
      Commercialization is still channel-partner dependent, especially on Uber, limiting direct customer ownership and
      increasing concentration risk.
    - >-
      Economics, cap table, governance, and financing structure remain too opaque to support premium pricing with
      confidence.
    - >-
      Texas authorization continuity and broader regulatory credibility remain open questions while the safety
      investigation is active.
  unresolvedGaps:
    - >-
      Exact structure of the up-to-$375 million Uber/Nebius package, including true equity content, dilution, minority
      protections, and intercompany terms with Nebius.
    - Product-line revenue, margin, burn, runway, and unit economics for robotaxis versus delivery robots.
    - >-
      PE26003 remediation evidence, current TxDMV authorization status, and normalized miles/intervention data before
      and after mitigations.
    - >-
      Customer concentration, contract duration, revenue share, and renewal behavior across Uber, Grubhub/Wonder,
      Rakuten, and campus/operator channels.
