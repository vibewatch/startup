    {
      "id": "section-leadership",
      "title": "Leadership, Founders, and Governance Exposure",
      "body": "The public leadership record is thin and heavily centered on CEO Dmitry Polishchuk. He is the named Avride executive across the Uber partnership, Dallas launch, Nebius funding announcement, Hyundai partnership, Grubhub expansion, and even the company's public response to safety scrutiny. That concentration supports a clear key-person-risk conclusion: Polishchuk is not just chief executive but also the company's primary external narrator for strategy, partnerships, and regulatory response. Founder attribution is less clean. Tracxn lists Anton Slesarev as founder, but the company's own 2026 pages reviewed here instead describe a group of engineers that started the work in 2017. The only other clearly named internal executive surfaced in a primary source for this chapter is Alex Tarnow, identified by Kirkland as general counsel on the 2025 transaction. What is missing is just as important as what is present: no board roster, committee structure, or observer list is publicly disclosed in the reviewed official materials. For diligence purposes, Chapter 1 can safely state that Avride has a public CEO, a partially evidenced founder story, and opaque board governance that should be resolved directly with counsel or the data room.",
