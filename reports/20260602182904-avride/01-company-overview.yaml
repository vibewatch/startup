    {
      "id": "section-milestones",
      "title": "Milestones, Commercial Launch, and Adverse Record",
      "body": "The external chronology of record is rich enough to reuse across the rest of the report: 2017 technology origin, 2024 Yandex divestment and Uber partnership, March 2025 Hyundai manufacturing tie-up, October 2025 financing and Grubhub expansion, December 2025 Dallas robotaxi launch, and May 2026 NHTSA scrutiny. That arc matters because it shows a company moving from inherited autonomy R&D into live commercial distribution much faster than most public robotics peers. It also clarifies the main adverse chapter-1 risk. Avride did not surface lawsuits, sanctions, or insolvency issues in the reviewed sources, but the NHTSA probe is already material because it followed only months after Dallas launch and focused on core driving competence, not a one-off external event. TechCrunch summarized ODI's concerns as failures around lane changes, vehicles ahead, and stationary objects; CNBC framed the same issue as a federal probe after 16 crashes and one minor injury. Avride says it implemented mitigations and that incident frequency relative to mileage improved, but the coexistence of rapid scale ambitions and a live safety investigation means later chapters should treat commercialization timing, regulatory credibility, and geopolitical sensitivity as open diligence threads rather than settled strengths.",
