    "number": 1,
    "title": "Company Overview",
    "summary": "Avride is an Austin-based autonomous mobility company that commercializes both robotaxis and delivery robots, with its clearest public anchors being the 2024 Uber partnership, the March 2025 Hyundai fleet-supply tie-up, and the October 2025 commitments of up to $375 million from Uber and Nebius. The same public record also shows unresolved governance opacity, no company-confirmed valuation or revenue disclosure, and a material May 2026 NHTSA investigation after 16 crashes and one minor injury in Texas."
  },
