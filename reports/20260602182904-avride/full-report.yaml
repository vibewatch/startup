  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product surface: two autonomy products, one partner-led commercialization layer'
        blocks:
          - type: paragraph
            body: >-
              Avride’s product surface is broader than a single robotaxi demo. The retained source set shows two live
              commercial lanes: passenger robotaxis and sidewalk delivery robots. That breadth is real, but the two
              lines sit at different maturity levels. Delivery has been commercial for longer, with Uber and Grubhub
              disclosures pointing to live operations in Austin, Dallas, Jersey City, U.S. campuses, and even earlier
              deliveries in South Korea. Passenger mobility, by contrast, moved from testing on public roads into a
              Dallas Uber launch in late 2025, still with an onboard specialist at launch and with future driverless
              operation framed as a roadmap item rather than a completed milestone.


              The most important substantiated product point is that Avride is trying to commercialize one autonomy
              lineage across both surfaces. Avride says the cars and robots share technology, and Uber, Nebius, and
              Grubhub partner materials repeat the same framing. That matters because it suggests Avride is not building
              two unrelated companies; it is trying to reuse perception, planning, platform software, and operational
              learning across roads and sidewalks. Still, some of the strongest scale and roadmap statements remain
              company-claimed or partner-repeated rather than independently benchmarked.


              Commercialization is also clearly channel-dependent. Uber owns the main user-facing demand surface for
              rides and a major portion of delivery exposure, while Grubhub owns the best public evidence for
              marketplace and campus restaurant integration. Hyundai strengthens the vehicle supply path by pairing
              Avride with the IONIQ 5 and Metaplant America, but even that tie-up still routes the first disclosed
              passenger service through Uber rather than a direct Avride app. The product story is therefore credible on
              scope and partnership depth, but it is not yet evidence of an Avride-controlled distribution moat.
