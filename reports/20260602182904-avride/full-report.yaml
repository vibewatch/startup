  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Structure
        blocks:
          - type: paragraph
            body: >-
              Avride is not selling into one generic “autonomous vehicles” market. The included spend that matters here
              is narrower: on-demand passenger trips fulfilled by robotaxis, short-range commercial delivery fulfilled
              by sidewalk robots, and the commercialization layers that make both of those services deployable at scale.
              Public sources show why that adjacent layer matters. Uber and Avride already route both delivery robots
              and robotaxis through the same consumer-facing marketplace, and Uber Autonomous Solutions explicitly
              packages demand generation, mapping, regulatory support, customer support, fleet intelligence, insurance,
              and financing as part of commercialization. That means Avride’s relevant market is partly a service market
              and partly a channel-access market. The excluded spend is just as important. Conventional human-driven
              ride-hailing GMV, broad restaurant delivery GMV with no automation attached, and generic EV or OEM vehicle
              revenue do not belong inside Avride’s direct opportunity unless the autonomy-linked take rate is visible.
              The result is a channel-first market structure in which the platform owner, the autonomy developer, the
              vehicle or fleet partner, and the regulator all shape what fraction of headline TAM becomes truly
              serviceable.
