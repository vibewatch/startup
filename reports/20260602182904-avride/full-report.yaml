        title: Identity, Origin, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Avride is best treated as a U.S.-based autonomous mobility company with two commercial product lines:
              robotaxis and delivery robots. The most reusable ground truth from official materials is that the company
              is headquartered in Austin, Texas, operates under the AVRIDE Inc. legal surface, and presents itself as a
              developer of autonomous vehicles and delivery robots that share one core autonomy stack. That identity
              matters because later chapters will otherwise inherit noisy internet metadata that mixes technology
              lineage, corporate spin-out dates, and office records. Official pages and partner announcements all anchor
              the operating base in Austin, while the privacy policy and about page give a specific Mopac legal address.
              At the same time, the founding story needs nuance: company materials say the journey began in 2017, the
              SEC filing fixes the 2024 Yandex-to-Nebius separation, and some trade or directory sources describe a 2020
              spin-off. The practical conclusion for later chapters is to reuse Austin headquarters, dual-product scope,
              and Yandex-origin lineage as facts, while treating the exact standalone founding date as an unresolved
              diligence item rather than smoothing over the public conflict.
