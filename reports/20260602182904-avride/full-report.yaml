      - number: '2.4'
        title: Adoption Drivers, Bottlenecks, and Why the Dual Strategy Matters
        blocks:
          - type: paragraph
            body: >-
              The same evidence set points to both acceleration and friction. Demand is supported by rising e-commerce
              volumes, continuing wage pressure, dense urban delivery needs, and large platforms that want more reliable
              or cheaper fulfillment. But adoption is gated by utilization, safety validation, and policy fragmentation.
              NHTSA’s March 2026 report makes clear that U.S. deployment still depends on timely rule modernization and
              public trust grounded in demonstrable safety, while state-level AV and sidewalk-robot rules remain a
              patchwork around operations, oversight, right of way, liability, and testing. Restaurant-delivery
              economics also create a subtler constraint: The Regulatory Review’s cited study shows that platform fee
              caps can shift orders away from independents and change delivery economics even when the technology itself
              works. This is why Avride’s dual robotaxi-plus-sidewalk strategy matters commercially. Sidewalk robots
              target shorter routes, lighter payloads, and lower-speed environments where commercialization can scale
              through merchants and campuses faster, while robotaxis attack a larger but slower-moving passenger market
              where platform support, fleet financing, and safety credibility dominate. Because Avride reuses a shared
              autonomy base across both products, each channel can absorb fixed R&D while generating different proof
              points. The missing public evidence is not whether the markets exist, but how much of that channel
              footprint Avride has already converted into paid trips, orders, and durable unit economics.
            claimRefs:
