  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Current active risk is concentrated in safety scrutiny and a tighter 2026 Texas operating regime
        blocks:
          - type: paragraph
            body: >-
              Avride's most immediate risk moved from generic AV skepticism into a named regulatory stack in May 2026.
              NHTSA opened PE26003 into the Avride ADS after reviewing crash videos and citing 16 reported crashes plus
              one minor injury in Dallas and Austin. The opening resume is unusually specific about the failure modes:
              unsafe lane changes into adjacent vehicles, failures to slow for vehicles already ahead, and strikes on
              partially obstructing stationary objects. Because Avride's only public passenger channel is the Uber
              launch that began in Dallas on December 3, 2025, the probe sits directly on the company's flagship
              commercialization narrative rather than on a legacy test program.


              Texas simultaneously raised the operational bar. TxDMV now requires commercial AV operators to maintain
              authorization, document responder procedures, keep required recording and liability coverage in place, and
              remain capable of lawful operation with a minimal-risk fallback. The same regime gives TxDMV authority to
              restrict or revoke authorization if vehicle operation endangers the public and has resulted or is likely
              to result in serious bodily injury. That means federal defect scrutiny can now interact with a live state
              permissioning system. The central underwriting point is not that shutdown is certain. It is that Avride
              now faces a monitorable combination of federal investigation, state authorization risk, and public-service
              continuity risk in the same Texas market. Reviewed public materials still do not confirm Avride's current
              authorization status or disclose a complete remediation package responding to PE26003, so the regulatory
              continuity question remains open rather than closed.
            claimRefs:
