            body: >-
              The critical valuation distinction is between what Avride confirmed and what investors would still have to
              infer. What is confirmed is the size and strategic nature of the October 2025 package: up to $375 million
              from Uber and Nebius, tied to fleet growth, AI product development, and new geographies. What is not
              confirmed is just as important: no retained official filing, press release, or legal announcement reviewed
              for this chapter discloses Avride's post-money valuation, ownership dilution, preference stack, or the
              split between equity funding and other commitments. That omission matters because a strategic package can
              look large while still being a poor standalone pricing signal if milestone payments, commercial rebates,
              or parent-linked support are embedded in the structure. Nebius also complicates standalone pricing because
              it explicitly lists Avride as one of its businesses after the 2024 Yandex divestment and rebrand. The 2024
              Yandex sale valuation is therefore not an Avride mark, and any investor underwriting Avride today would
              still need intercompany agreements, governance rights, and cap-table detail before treating the financing
              round as a comparable priced equity event.
