      - number: '2.2'
        title: Sizing the Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              The public sizing record supports a meaningful market, but not a single precise TAM. Fortune Business
              Insights puts the global robotaxi market at USD 1.27 billion in 2026, while The Business Research Company
              puts the same year at USD 5.5 billion because the category boundary is broader. On the delivery side,
              Precedence Research uses one broad lens for autonomous last-mile delivery and another, much narrower lens
              for delivery robots, which is exactly why Avride should not collapse all autonomy headlines into one
              number. The safest public read is therefore multi-lens. For robotaxis, North America is already the
              leading region and the United States alone is described as roughly USD 0.67 billion in 2026 in one report.
              For delivery automation, North America is also the leading region and food-and-beverage or short-range
              ground use cases dominate the evidence. That makes North America the best public SAM proxy and dense food
              or convenience routes the best serviceable wedge. Public SOM remains weak. Avride has disclosed
              marketplace integrations, city launches, and fleet-expansion intent, but not city-level paid ride volume,
              order count by merchant cohort, or take-rate economics. The right posture is to present TAM, a North
              American SAM proxy, and a channel-footprint SOM proxy rather than to invent a monetized market-share
              number.
