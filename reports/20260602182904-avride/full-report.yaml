      - number: '3.2'
        title: 'Robotaxi competition: Waymo scale, partnership peers, and converging adjacencies'
        blocks:
          - type: paragraph
            body: >-
              Waymo is the benchmark Avride has to beat in public robotaxi credibility. Its own materials now point to
              10 commercial metro areas, a route to more than one million rides per week by year-end 2026, its own ride
              app, and Uber distribution in selected cities. That combination means Waymo is not only larger than Avride
              in commercial footprint, but also less dependent on any single channel partner. Zoox and Motional matter
              for different reasons. Zoox pushes the strongest purpose-built passenger-vehicle story, which can appeal
              to cities or riders that want a fully redesigned service experience, even if its public paid scale still
              appears behind Waymo. Motional is closer to Avride structurally because it already plugs Level 4 IONIQ 5
              robotaxis into ride-hail partners and has an autonomous delivery history with Uber Eats, so its product
              and go-to-market resemble Avride's model more closely. The biggest shift, however, is that former
              adjacencies are moving inward. Nuro is now part of a Lucid-Uber robotaxi program that targets 20,000-plus
              vehicles, and Waabi has paired a fresh $1 billion raise with a large Uber robotaxi plan of its own. As a
              result, Avride is competing not only with current robotaxi operators, but also with general-purpose
              autonomy stacks that can use Uber to compress commercialization time.
