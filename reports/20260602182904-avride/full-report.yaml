            title: Funding amount is confirmed; price is not
            body: >-
              The October 2025 package gives Avride real strategic financing momentum, but public evidence still does
              not disclose the post-money, dilution, or the split between equity and other commitments. Investors should
              not mistake a large strategic headline for a clean priced-round mark.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV037
              - CV038
          - type: callout
            title: Avride straddles the gap between delivery-robot floor and robotaxi premium
            body: >-
              Serve Robotics shows how low the public market can price a delivery-robot company, while WeRide, Pony AI,
              Nuro, and Wayve show how much more investors pay for scaled robotaxi or autonomy platforms with clearer
              commercialization and capital access. Avride sits between those poles but much closer to the discount side
              until disclosure improves.
            calloutType: insight
            claimRefs:
              - CV023
              - CV025
              - CV029
              - CV034
              - CV035
              - CV036
          - type: callout
            title: Track only with protections below premium entry levels
            body: >-
              A plain premium equity mark is not supported by current public evidence. The only defensible underwriting
              posture is a selective track or research-more stance at protected entry levels, combined with cap-table
              access, governance rights, and downside protection.
            calloutType: recommendation
            claimRefs:
              - CV042
              - CV043
              - CV048
