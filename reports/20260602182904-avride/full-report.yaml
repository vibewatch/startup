  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Decision chain from confirmed financing through peer anchors and risk filters to the recommendation.
    data:
      nodes:
        - id: n1
          label: Confirmed financing signal
          detail: Up to $375M of investments and commitments from Uber and Nebius, but no disclosed post-money
        - id: n2
          label: Commercial proof set
          detail: Dallas robotaxi launch plus delivery pilots through Uber and Grubhub
        - id: n3
          label: Comparable anchor set
          detail: Serve $0.77B, WeRide $2.56B, Pony $4.69B, Nuro $6B, Wayve $8.6B, Aurora $15.14B
        - id: n4
          label: Risk filters
          detail: NHTSA probe, no disclosed revenue, customer concentration, parent-company complexity
        - id: n5
          label: Weighted value band
          detail: Scenario-weighted range centers around roughly $1.3B to $1.6B
        - id: n6
          label: Recommendation
          detail: Selective track only below protected entry levels; pass at unsupported premium marks
      edges:
        - from: n1
          to: n2
          label: funds
        - from: n2
          to: n3
          label: benchmarked against
        - from: n3
          to: n4
          label: discounted by
        - from: n4
          to: n5
          label: yields
        - from: n5
          to: n6
          label: drives
