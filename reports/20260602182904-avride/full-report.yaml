  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Retail e-commerce growth
        - Positive
        - Current
        - >-
          More digital ordering raises fulfillment pressure in exactly the short-distance flows that delivery robots
          target.
        - Ask Avride for corridor-level order density thresholds that justify robot deployment.
      - - Wage and benefit inflation
        - Positive for automation demand
        - Current
        - Rising labor costs improve the relative case for automation in delivery and mobility.
        - Request side-by-side labor, remote-support, and maintenance cost curves.
      - - Platform distribution scale
        - Positive
        - Current
        - >-
          Uber already supplies riders, merchants, support, and demand density that a standalone AV startup would
          otherwise need years to build.
        - Request the economics of Uber-led launches versus direct-to-merchant or direct-to-city channels.
      - - Utilization and annual mileage
        - Gating factor
        - Current to medium term
        - Robotaxi economics depend on keeping expensive assets busy; weak utilization can erase autonomy advantages.
        - Request Dallas utilization, downtime, and intervention data by time of day.
      - - Patchwork AV regulation
        - Negative
        - Current
        - City-by-city or state-by-state rules slow robotaxi expansion and increase launch cost.
        - Request Avride's prioritized jurisdictions and compliance timeline by state.
      - - Patchwork sidewalk robot rules
        - Negative
        - Current
        - >-
          State and local PDD rules on right of way, oversight, and operating limits constrain scale even in lower-speed
          environments.
        - Request a market-by-market legal map for sidewalk operations, permits, and human oversight requirements.
      - - Merchant and platform economics
        - Mixed
        - Current
        - >-
          Restaurants may want cheaper fulfillment but fee caps and ranking changes can distort which merchants actually
          benefit.
        - Ask for unit economics by merchant type and whether automation improves gross margin after platform fees.
      - - Payload and route envelope
        - Negative outside dense short routes
        - Current
        - Delivery robots work best on short, light, repeatable trips and are weaker in bulky or sparse routes.
        - Request route-level exclusion rules and failure modes by order type.
      - - Public data opacity
        - Negative for external sizing
        - Current
        - Weak disclosure on paid rides, order cohorts, and take rates prevents a credible public SOM calculation.
        - Request audited or board-level operating KPIs to convert footprint into revenue-share logic.
    notes: >-
      This table mixes directly observed market facts with synthesized implications; the diligence asks show where
      public evidence is still too thin for a clean investment-grade model.
