        - 'Direct: robotaxis; adjacent delivery pilot'
        - Las Vegas public rides via Uber; Hyundai/Aptiv backing
        - Ride-hail partners and mobility networks
        - Partner-first robotaxi model close to Avride's structure
        - Less public scale than Waymo
      - - Serve Robotics
