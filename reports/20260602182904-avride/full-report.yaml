      - number: '5.4'
        title: 'Trust, safety, and roadmap gaps: commercialization is real, but the validation layer is still mostly private'
        blocks:
          - type: paragraph
            body: >-
              Trust evidence cuts both ways. On the positive side, Avride discloses privacy-preserving features for
              delivery robots, remote support escalation, insured operations, and broad compliance language.
              Manufacturing posts add QA detail, and public job listings show ongoing investment in safety analysis,
              simulation, planning, and embedded systems. NHTSA’s own March 2026 ADS report also clarifies what serious
              AV oversight is starting to emphasize: simulation, closed-course testing, on-road evaluation, subsystem
              failure analysis, AI validation, and maintenance reliability. This creates a reasonable benchmark for what
              a mature diligence package should contain.


              The problem is that Avride’s own public materials do not yet disclose that benchmark-level evidence for
              the live robotaxi stack. The gap became more important after NHTSA opened PE26003 in May 2026. The opening
              resume tied the probe to 16 crashes and one minor injury and explicitly questioned the system’s competence
              and assertiveness in lane changes, responses to vehicles ahead, and reactions to partially obstructing
              stationary objects. TechCrunch separately reported Avride’s claim that it had implemented targeted
              mitigations and that incident frequency per mile was improving, but those statements remain company
              responses inside an active safety overhang, not independent proof that the problem is fully contained.


              The right conclusion is not that Avride lacks technology; the retained sources clearly show real products,
              real partners, and real deployment infrastructure. The right conclusion is that Avride’s product and
              manufacturing story is more public than its validation story. Until the company shares independent safety
              metrics, intervention data, and a buyer-grade safety case, the most important technical diligence
              questions remain private-evidence items rather than publicly closed facts.
