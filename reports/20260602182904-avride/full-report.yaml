    type: range
    layout: wide
    summary: Public-evidence valuation bands for Avride plus a directional financing bridge, all in USD billions.
    data:
      items:
        - label: Bear case
          low: 0.3
          mid: 0.5
          high: 0.8
          unit: B USD
          detail: Safety overhang or weak financing pushes Avride toward a distressed or delivery-floor outcome
        - label: Base case
          low: 1
          mid: 1.4
          high: 1.8
          unit: B USD
          detail: Supervised commercialization continues, but disclosure quality remains thin
        - label: Bull case
          low: 2.5
          mid: 3.2
          high: 4
          unit: B USD
          detail: Safety clears, driverless scale expands, and Avride narrows the gap to listed robotaxi peers
        - label: Full-$375M equity bridge
          low: 1.9
          mid: 2.5
          high: 3.8
          unit: B USD
