            body: >-
              The correct public-evidence verdict is not an enthusiastic buy and not a dismissive zero either; it is a
              price-sensitive track or research-more posture with strict underwriting conditions. Avride clearly has
              strategic relevance, live product in market, and partner validation that many autonomy startups never
              reach. But the evidence gaps that still matter most to valuation all sit exactly where investors normally
              need disclosure: cap table, economic structure of the $375 million package, product-line revenue, unit
              economics, burn, runway, intercompany rights, and the liability impact of a live NHTSA probe. Those
              omissions mean the chapter can defend only a conservative range and an explicit premium discount to public
              robotaxi leaders. Three thesis-break triggers should stop underwriting immediately: material deterioration
              in the safety investigation, evidence that Uber channel access is weakening rather than widening, or
              follow-on financing that clarifies the October 2025 package as less durable or less equity-like than the
              headline implies. Until those points are resolved, Avride should be treated as a strategically interesting
              but still illiquid and disclosure-light asset where downside protection matters as much as headline
              upside.
