              risks are PE26003, Texas authorization continuity, Uber concentration, and hardware-heavy scaling without
              public economics. Historical or scenario risks are Yandex-lineage perception, city-by-city permitting
              backlash outside current strongholds, and competitive displacement if larger networks keep moving faster.
