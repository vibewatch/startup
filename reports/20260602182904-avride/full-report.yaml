      - number: '3.4'
        title: Distribution power, switching risk, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The hardest competitive question for Avride is not whether its autonomy stack is real; it is whether
              enough of the commercialization layer belongs to Avride rather than Uber. Uber now openly sells mapping,
              regulatory support, insurance, customer support, and fleet tooling to many AV partners, which clearly
              speeds Avride's launch path but also means those same services can help rivals close the gap. That
              structure weakens lock-in for the platform owner, because Uber can multi-home across Avride, Waymo, Nuro,
              Waabi, and others without rebuilding the full commercial stack every time. It also weakens pricing
              transparency, since most vendors avoid posted tariffs and instead compete through channel access, unit
              economics, service reliability, and partner terms that are not fully public. Avride still has a real
              strategic advantage in trying to reuse one autonomy stack across both passenger and delivery surfaces. But
              the company also carries visible disadvantages: Waymo's scale and trust lead, Serve and Starship's
              stronger delivery disclosures, the high capital demands now visible at Nuro and Waabi, and Avride's own
              NHTSA scrutiny. The net result is a moat that looks promising in architecture but only medium in
              durability until Avride proves higher public scale, broader channel independence, and better safety
              credibility.
