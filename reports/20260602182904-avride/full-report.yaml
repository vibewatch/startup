              trucking-heavy exposure makes it a ceiling-like reference rather than a direct urban AV analogue. The
              adverse market read-through is equally important. CNBC reports GM spent more than $10 billion building
              Cruise before shutting the robotaxi business, while Reuters shows Nuro raising new money at a lower
              valuation than its 2021 mark. Taken together, 2026 market conditions reward scaled disclosure and punish
