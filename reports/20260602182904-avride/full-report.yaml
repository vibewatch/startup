        - Lower than other reports because the category boundary is relatively tight.
      - - Global robotaxi TAM
        - The Business Research Company
        - 2026 / global
        - USD 5.5B
        - 57.4% CAGR from 2026
        - Captures a broader robotaxi category and shows how sensitive the headline depends on definition.
        - Factory-gate framing is not the same as marketplace revenue or AV take rate.
      - - North America robotaxi SAM proxy
        - Fortune regional share + U.S. estimate
        - 2025-2026 / North America and U.S.
        - North America 54.09% share; U.S. about USD 0.67B
        - North America led in 2025
        - Best public regional proxy for where Avride is already operating and where rules are comparatively permissive.
        - Still not city-level and not Avride-specific.
      - - Global autonomous last-mile TAM
        - Precedence Research
        - 2026 / global
        - USD 8.12B
        - 22.99% CAGR to 2035; North America 47% share in 2025
        - Broad delivery-automation lens that captures why logistics appetite is large.
        - Includes a wider stack than sidewalk robots alone.
      - - Global delivery-robots TAM
        - Precedence Research
        - 2024 baseline / global
        - USD 409.3M in 2024
        - 32.01% CAGR from 2025 to 2034; North America 42% share in 2024
        - Narrower sidewalk-robot lens better aligned with Avride's physical form factor.
        - Not a 2026 point estimate and narrower than autonomous last-mile reports.
      - - Food-and-beverage wedge
        - Precedence autonomous last-mile + delivery robots
        - 2025-2026 / global
        - Food & beverage >86% of broad autonomous last-mile; 42% of delivery-robots end use
        - Short-range ground and food use cases dominate
        - Confirms that restaurant delivery is the best-documented near-term buyer wedge.
        - Percentages come from different but related category definitions.
      - - Public SOM proxy
        - Avride + Uber disclosed footprint
        - 2024-2026 / Austin, Dallas, Jersey City, campuses
        - Channel footprint only; no public revenue share
        - Dallas launch area 9 square miles; delivery expansion to multiple cities and campuses
        - Best non-invented public proxy for current obtainable market.
        - No public paid-trip, order-cohort, take-rate, or unit-economics disclosure.
    notes: >-
