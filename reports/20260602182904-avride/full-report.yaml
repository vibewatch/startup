        title: Funding, Partnerships, and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Avride's current stage is best described as venture-backed commercial launch rather than a cleanly labeled
              institutional round stage. Official disclosures say only that Avride secured up to $375 million of
              strategic investments and commercial commitments from Uber and Nebius in October 2025, with proceeds
              intended for fleet growth, AI product development, and new geographies. That wording is materially
              different from directory treatment that labels the company Series E, and no official filing reviewed here
              supplies a company-confirmed post-money valuation figure. The safest chapter-1 posture is therefore to
              carry the disclosed financing amount forward, mark valuation as unsupported in company-confirmed form, and
              note that lower-tier reports about structure or stage are secondary. Traction data is similarly partial.
              Avride and its partners do publicly claim hundreds of restaurants, hundreds of thousands of deliveries,
              and more than 100,000 campus deliveries with Grubhub, but they do not disclose revenue, run-rate, ARR, or
              total customer count. Headcount also remains noisy: official pages say 200-plus engineers and a few
              hundred engineers, while Tracxn reports 352 employees and Newburyport location metadata. That conflict is
              manageable if later chapters use only the disclosed ranges and explicitly preserve the unsupported metrics
              as null.
