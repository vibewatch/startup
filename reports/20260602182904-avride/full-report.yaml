  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Avride’s customer journey usually starts in a partner app or campus workflow, moves through eligibility and
      dispatch, and only then reveals an Avride vehicle or robot to the end user.
    data:
      items:
        - label: Platform or campus need recognized
          phase: discovery
          detail: Uber, Grubhub, Rakuten, or a campus operator identifies a delivery or mobility use case.
        - label: User enters partner surface
          phase: onboarding
          detail: Rider or diner opens Uber, Grubhub, or Rakuten rather than an Avride app.
        - label: Eligibility and routing
          phase: activation
          detail: The partner checks geography, robot availability, and service rules before offering autonomy.
        - label: Autonomous fulfillment
          phase: engagement
          detail: >-
            Avride robot or vehicle performs the ride or last-mile leg while the partner keeps the customer
            relationship.
        - label: Track, unlock, and receive
          phase: engagement
          detail: >-
            Users track the robot or vehicle, unlock at arrival, and often keep human support inside the partner
            experience.
        - label: Expansion decision
          phase: expansion
          detail: >-
            New merchants, campuses, neighborhoods, or cities are added if the channel partner sees enough value and
            acceptable risk.
    approximationNotes: >-
      Stages synthesize public workflow evidence from Uber, Grubhub, Wonder, Rakuten, and campus dining pages; Avride
      does not publish an internal CRM funnel.
    claimRefs:
