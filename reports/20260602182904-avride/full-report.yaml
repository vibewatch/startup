              hard-document diligence package. The first workstream should focus on PE26003 and Texas continuity: the
              full SGO incident set, miles and interventions before and after any remediation, TxDMV authorization
              status, the responder plan filed with DPS, insurance structure, and any discussions with regulators since
              the probe opened.


