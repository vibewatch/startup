    {
      "id": "customer-architecture-and-segments",
      "title": "Customer architecture: real demand exists, but the commercial surface is mostly partner-controlled",
      "body": "Avride’s customer story is real but highly intermediated. Public evidence shows live riders and diners, yet most of the buyer, payer, checkout, and customer-support surface sits with larger platforms. On the passenger side, Dallas riders meet Avride through the Uber app, which handles matching, pricing parity, unlock, support, and the decision to accept or decline an AV. On the delivery side, Uber Eats, Grubhub, Wonder, and Rakuten each own the user-facing order flow while merchants, campuses, and neighborhoods supply the local demand context. This distinction matters because the end user is not the same thing as the economic customer. Riders and diners are recipients; restaurants and campus operators are merchant or institutional participants; Uber, Grubhub, Wonder, and Rakuten are the actual channel partners that aggregate demand and own most of the transaction interface. The result is a customer base that looks broader in surface area than it does in direct enterprise diversification. Avride can point to robotaxi riders, campus diners, neighborhood residents, and restaurant orders, but public proof of direct Avride-managed enterprise accounts remains thin.",
