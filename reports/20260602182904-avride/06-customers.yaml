    {
      "id": "concentration-and-expansion-risk",
      "title": "Concentration risk remains high because Uber anchors robotaxis and much of delivery while direct diversification is still narrow",
      "body": "The chapter’s central risk finding is that Avride has meaningful channel breadth but limited direct-customer diversification. Uber is the anchor exposure because it is the sole public robotaxi route to market and also a major delivery marketplace, meaning a single partner influences rider acquisition, user experience, support, pricing presentation, and pace of geographic expansion. Grubhub is a real second U.S. channel, but its strongest proof is still campus dining and one Wonder-backed Jersey City pilot. Rakuten broadens the map into Japan, yet it still represents one operator-managed Tokyo-area service. Even municipal pipeline evidence remains tentative: Arlington was still in the mapping-and-discussion stage with partnerships undisclosed. The most serious near-term overhang is regulatory. NHTSA’s May 2026 probe targets the same Dallas passenger market that underpins Avride’s public robotaxi credibility, making customer scaling dependent not only on technical performance but also on Uber’s tolerance for risk and regulators’ tolerance for expansion. Public proof therefore supports real commercialization, but not a broad set of direct enterprise accounts insulated from one partner’s decisions.",
