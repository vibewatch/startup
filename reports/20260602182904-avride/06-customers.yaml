    "number": 6,
    "title": "Customers",
    "summary": "Avride has real customer activity, but the public record shows it mostly through partner-controlled surfaces rather than direct enterprise accounts. Uber is the sole public robotaxi channel and a major delivery channel, while Grubhub supplies campus demand, Wonder provides a single off-campus U.S. marketplace pilot, and Rakuten anchors Japan. That proves adoption across cities and campuses, but leaves direct customer concentration, contract economics, and retention metrics largely private."
