    {
      "id": "adoption-and-named-customer-proof",
      "title": "Adoption and named customer proof are strongest in campuses, partner marketplaces, and Tokyo districts",
      "body": "The strongest public customer proof comes where Avride has both a named local operating context and a partner willing to expose workflow detail. Ohio State and Salisbury are the clearest campus examples: both campuses publish how users place orders, select delivery locations, and retrieve food, while Grubhub and third-party coverage add fleet-size and usage context. Off campus, Wonder’s Jersey City storefront proves that Grubhub has moved Avride beyond universities, but the evidence still describes a single pilot location rather than a scaled urban network. Uber Eats provides broader city exposure across Austin, Jersey City, Philadelphia, and earlier Dallas delivery activity, yet exact merchant counts remain fragmented across local coverage rather than published in one official ledger. Rakuten provides the best non-U.S. proof set because it discloses participating stores, delivery points, fees, hours, and robot-count plans for specific Tokyo neighborhoods. Taken together, these sources show real production activity, not just pilots. They do not show a diversified base of direct enterprise contracts signed under Avride’s own brand.",
