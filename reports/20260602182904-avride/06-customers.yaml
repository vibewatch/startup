    {
      "id": "durability-repeat-usage-and-data-gaps",
      "title": "Durability is visible mainly through continuity and repeat-use proxies, not disclosed retention metrics",
      "body": "Public sources do offer signs that users come back, but they stop far short of SaaS-style retention disclosure. Grubhub’s Ohio State story has the strongest repeat-use proxy because outside reporting ties the campus deployment to more than 6,000 weekly orders and peak days around 1,600 deliveries. Salisbury’s official page adds a smaller but still meaningful daily run rate of 150 to 200 deliveries. Rakuten’s official and blog materials describe daily service, all-weather operations, and a roster that expanded beyond the initial store set, which supports continuity but still does not disclose household repeat rates. What is missing is the underwriting layer: no reviewed public source provides NRR, GRR, churn, renewal rates, contract length, cohort retention, or even a consolidated active-customer count. That means public customer evidence is operational, not contractual. Investors can see that the robots are being used, but they cannot yet tell which customers renew, which cities sustain usage without subsidies, or whether Avride owns durable gross margin on those recurring transactions.",
