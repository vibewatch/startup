    "number": 2,
    "title": "Market Analysis",
    "summary": "Public evidence supports real demand in both robotaxis and autonomous short-range delivery, but the usable opportunity is much narrower than any single generic autonomy TAM. Published 2026 robotaxi estimates range from USD 1.27 billion to USD 5.5 billion, while delivery-autonomy estimates span from a narrow sidewalk-robot lens to a broader autonomous last-mile stack; the strongest current market logic for Avride is therefore channel-led commercialization through Uber, merchants, campuses, and OEM or fleet partners rather than a clean public SOM."
  },
  "sections": [
    {
      "id": "market-boundary-structure",
      "title": "Market Boundary and Structure",
      "body": "Avride is not selling into one generic “autonomous vehicles” market. The included spend that matters here is narrower: on-demand passenger trips fulfilled by robotaxis, short-range commercial delivery fulfilled by sidewalk robots, and the commercialization layers that make both of those services deployable at scale. Public sources show why that adjacent layer matters. Uber and Avride already route both delivery robots and robotaxis through the same consumer-facing marketplace, and Uber Autonomous Solutions explicitly packages demand generation, mapping, regulatory support, customer support, fleet intelligence, insurance, and financing as part of commercialization. That means Avride’s relevant market is partly a service market and partly a channel-access market. The excluded spend is just as important. Conventional human-driven ride-hailing GMV, broad restaurant delivery GMV with no automation attached, and generic EV or OEM vehicle revenue do not belong inside Avride’s direct opportunity unless the autonomy-linked take rate is visible. The result is a channel-first market structure in which the platform owner, the autonomy developer, the vehicle or fleet partner, and the regulator all shape what fraction of headline TAM becomes truly serviceable.",
