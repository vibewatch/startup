    {
      "id": "buyers-economics",
      "title": "Buyer Segments and Unit-Economic Logic",
      "body": "The relevant buyers are not all the same. In robotaxis, the immediate budget owner is often a marketplace or fleet operator that wants supply density, customer support, and venue or regulatory integration more than it wants to own every layer of AV infrastructure. In sidewalk delivery, the nearer-term payer can be a restaurant chain, campus dining operator, delivery platform, grocery or convenience operator, or an industrial-site logistics manager. Public deployment evidence shows why that distinction matters. Uber already brings demand density and support infrastructure; Serve and Starship show that dense, repetitive routes can scale before the broader passenger AV market fully matures; and Avride’s own robot materials emphasize short implementation cycles, no extra staff requirement, and tight operating envelopes. The unit-economic logic is similarly practical rather than futuristic. U.S. e-commerce continues to grow, private-industry labor costs keep rising, and BLS wage data show that both courier and driver work remain material cost pools. The operational question is therefore not whether autonomy eliminates labor altogether, but whether it can lower cost per fulfilled trip in dense corridors while keeping completion, support, and safety performance high enough for merchants, riders, and platforms to trust the service.",
