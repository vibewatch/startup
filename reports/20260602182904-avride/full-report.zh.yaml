      - number: '1.2'
        title: 领导层、创始人与治理暴露
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录很薄，且高度集中在 CEO Dmitry Polishchuk 身上。从 Uber 合作、Dallas 上线、Nebius 融资公告、Hyundai 合作、Grubhub
              扩张，到公司对安全审查的公开回应，他都是 Avride 被点名的高管。领导层叙事高度集中，支撑一个明确的关键人风险结论：Polishchuk 不只是
              CEO，也是公司对外阐释战略、合作和监管回应的主要叙事者。创始人归因更不清晰。Tracxn 将 Anton Slesarev 列为创始人，但本文审阅的公司 2026 年页面则把故事写成一群工程师在 2017
              年启动工作。本章一手来源中出现的另一位明确内部高管只有 Alex Tarnow；Kirkland 在 2025
              年交易中将其列为总法律顾问。缺失的信息同样重要：审阅过的官方材料没有公开董事会名单、委员会结构或观察员名单。尽调口径可以安全写成：Avride 有公开
              CEO、创始人故事只有部分证据支撑，董事会治理不透明，应直接通过法律顾问或数据室解决。
