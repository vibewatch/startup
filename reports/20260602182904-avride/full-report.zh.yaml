      - number: '7.2'
        title: 商业化由合作伙伴主导且硬件占重，提高了集中度和资本强度敞口
        blocks:
          - type: paragraph
            body: >-
              Avride 的商业化表面是真实的，但仍由少数强势合作伙伴居中承接。Uber 是最清晰的依赖项，因为 Uber 自己的 Autonomous Solutions
              材料描述了一套覆盖需求生成、乘客体验、客户支持、测绘、监管支持、保险、融资和车队运营的栈。换句话说，Uber 不只是需求平台；它越来越像商业化层。Avride 的公开乘客服务只在 Uber 上，Dallas
              发布时仍配备车载专员，而不是已经验证充分的全无人驾驶服务。配送端，Uber Eats 仍是最广的公开渠道；校园外的 Grubhub 和 Wonder 仍处于试点模式，Rakuten
              即便扩张后也仍是一个由单一运营方管理的日本项目。


              成本侧同样重要。Avride 自己的制造材料显示，一条产线已造出近 1,000 台机器人，每台机器人有 1,500 多个部件，依赖专业外部供应商，并宣称最高月产能为 100 台机器人。Hyundai
              关系在机器人制造之上又叠加了车辆车队扩张层：Avride 目标是在 2025 年部署最多 100 辆自动驾驶 IONIQ 5，并依赖第三方整车生产和集成。Nebius 和 Uber 最高 $375 million
              的支持说明，规模化不只需要软件，还需要有资金支撑的硬件、车队、服务和铺开能力。但已审阅的公开记录仍没有披露单位经济性、平台收入分成、毛利率或客户续约指标。投资者能看到真实商业化证明，却仍看不清经济耐久性的模型。
