      - number: '5.3'
        title: 配送平台运营与制造：来源集中最具实物感的验证
        blocks:
          - type: paragraph
            body: >-
              配送机器人平台是 Avride 公开证据最具运营实感的部分。机器人页面给出具体规格，从 50 km 续航、IP66 防水，到人行横道处理、隐私模糊和远程支持升级。Grubhub
              的产品和上线文章则补上围绕硬件的商业工作流：机器人配送作为一级结账选项、实时资格判断和后备逻辑、消费者 App 中的实时遥测、用餐用户通过 App
              安全解锁、商户装载用平板，以及针对自主配送边缘场景的专门客服。上述细节比营销形容词更适合尽调，因为它们展示了自动驾驶如何嵌入一个可运转的交易流程。


              制造证据在这里也强于 Robotaxi 线。Avride 2026 年 4
              月制造文章梳理了一套可重复装配流程：两条产线、已验证子组件、专门测试台、运动和热测试、振动与进水测试，以及最终质检。文章仍是公司自称证据，但足够具体，能显示 Avride
              思考的是生产工程，而不只是原型机器人。再加上合作伙伴声称拥有超过 100 台校园机器人和超过 100,000 次已完成校园配送，配送平台看起来已经实质越过实验室阶段。


              但并非每个尽调问题都已关闭。公开资料仍未披露路线级可用率、接管率或单位经济模型，供应商集中度也只是轻描淡写。不过，相比 Robotaxi
              技术栈，配送平台拥有更可见的产品仪表、更可见的运营工作流和更可见的工厂就绪证据。
