      - number: '7.4'
        title: 缓释措施存在，但风险要算真正被承接，本章仍需要硬文件尽调包
        blocks:
          - type: paragraph
            body: >-
              好消息是，Avride 并非完全没有风险缓释面。Uber 描述了安全指南、客户支持、远程协助、现场支持、保险和车队运营工具。Avride 描述了测试纪律、隐私控制和制造 QA。Texas
              也提供正式行政流程，而不是任意的黑箱停运路径。但这些缓释因素大多来自合作伙伴或公司自控披露，不能替代硬文件尽调包。第一条工作流应聚焦 PE26003 和 Texas 连续性：完整 SGO
              事件集、任何整改前后的里程和接管情况、TxDMV 授权状态、提交给 DPS 的应急人员方案、保险结构，以及调查启动后与监管机构的任何沟通。


              第二条工作流应聚焦 Avride
              是在变成一家多元化自动驾驶公司，还是仍是依赖合作伙伴的供应商。这需要直接客户集中度、收入分成和合同条款、董事会与治理材料、安全和合规的组织归属，以及主要业务线的单位经济性。在这些材料拿出来之前，正确的划分很清楚。活跃风险包括
              PE26003、Texas 授权连续性、Uber 集中度，以及缺少公开经济性支撑的硬件重资产扩张。历史或情景风险包括 Yandex
              沿革认知、现有强势地区之外逐城许可遭遇反弹，以及更大网络继续提速时的竞争替代。这些区分很重要，因为只有活跃风险应驱动即时否决标准；历史和情景风险则应决定尽调深度和风险定价。
