        - 美国城市点位密度高，与 Uber Eats 重叠
        - 缺少乘用出行
      - - Starship
        - 直接：配送机器人
        - '>10M 次配送；300+ 个地点；3,000+ 台机器人'
        - 校园、生鲜杂货、配送 app、工业场地
        - 公开披露的配送规模最大，渠道分布广
        - 没有乘用 Robotaxi 选项
      - - Robot.com / Kiwibot 竞品
        - 直接：配送机器人
        - '>1.7M 次任务；500+ 台机器人'
        - 校园、企业物流、广告主
        - 校园和企业运营验证
        - 比 Starship 规模更小、场景更窄
      - - Nuro
        - 相邻，正在转向直接竞争
        - 与 Lucid 合作的 20,000+ 台 Uber Robotaxi 目标；1.7M 自动驾驶英里
        - 车企、出行平台、未来乘客
        - 可授权的通用自动驾驶平台
        - 品牌归 Uber 或 OEM 伙伴，不归 Nuro
      - - Waabi
        - 相邻，正在转向直接竞争
        - 融资 $1B；25,000+ 台 Uber Robotaxi 计划
        - 货运运营商、与 Uber 绑定的网约车
        - 横跨卡车和 Robotaxi 的可泛化 AI 栈
        - 乘用项目面向未来，尚未规模化
      - - Cartken
        - 相邻 / 可选择重新进入
        - Mitsubishi 关联方订购近 100 台工业搬运车
        - 工业场地、校园、最后一公里伙伴
        - 证明配送自动驾驶可以转向工业工作流
        - 消费端最后一公里扩张已不再是重点
      - - 人力网络 / 内部自建
        - 替代方案
        - 现有人力供给加大型平台资本开支
        - 平台、车队运营商、OEM
        - 已经在线且灵活
        - 如果不投入大量运营工作，无法带来自动驾驶驱动的成本曲线
    notes: 规模和融资单元格只使用保留来源披露的公开指标；未知或未披露的经济性不做回填。
