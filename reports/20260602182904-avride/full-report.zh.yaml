          unit: null
          detail: 本章审阅的官方来源均未给出已定价股权估值
        - label: NHTSA 调查
          value: PE26003
          unit: null
          detail: 2026-05-06 启动，触发背景是 16 起碰撞和一起据称轻伤
        - label: Serve 可比公司
          value: $0.77B
          unit: USD
          detail: 截至 2026 年 6 月，公开配送机器人市值底部参照
        - label: WeRide 可比公司
          value: $2.56B
          unit: USD
          detail: 截至 2026 年 6 月，公开 robotaxi 市值参照
        - label: Pony AI 可比公司
          value: $4.69B
          unit: USD
          detail: 收入披露更强的公开 robotaxi 市值参照
        - label: Wayve 私有可比公司
          value: $8.6B
          unit: USD
          detail: 来自 2026 年 2 月 Series D 披露的官方投后估值
        - label: 加权价值中枢
          value: $1.3B-$1.6B
          unit: USD
          detail: 情景分析的概率加权中枢，不是精确标记价格
    claimRefs:
      - CV001
      - CV002
      - CV010
      - CV020
      - CV023
