            body: >-
              对外可核验的时间线已经足够支撑报告其他部分复用：2017 年技术起源、2024 年 Yandex 剥离与 Uber 合作、2025 年 3 月 Hyundai 制造合作、2025 年 10 月融资和
              Grubhub 扩张、2025 年 12 月 Dallas Robotaxi 上线，以及 2026 年 5 月 NHTSA
              审查。时间线的重要性在于，公司从继承式自动驾驶研发转向真实商业分发的速度，比多数公开机器人同行更快。时间线也厘清了第一章的主要负面风险。审阅来源中没有出现 Avride 诉讼、制裁或破产问题，但 NHTSA
              调查已经具有实质性：调查发生在 Dallas 上线仅数月后，聚焦核心驾驶能力，而不是一次外部偶发事件。TechCrunch 将 ODI 的担忧概括为变道、前车响应和静止物体处理上的失误；CNBC 则将同一问题写成
              16 起碰撞和 1 起轻伤后的联邦调查。Avride
              称已采取缓解措施，且按里程计算的事故频率有所改善；但快速扩张野心与进行中的安全调查并存，后续章节应把商业化节奏、监管可信度和地缘敏感性视为开放尽调线索，而不是已经坐实的优势。
