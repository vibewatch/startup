      - number: '2.4'
        title: 采用驱动、瓶颈，以及双线策略为何重要
        blocks:
          - type: paragraph
            body: >-
              同一组证据同时指向加速和摩擦。电商交易量增长、工资压力延续、密集城市配送需求，以及大型平台希望获得更可靠或更便宜的履约，都在支撑需求。但采用仍被利用率、安全验证和政策碎片化卡住。NHTSA 2026 年 3
              月报告说得很清楚：美国部署仍取决于规则及时现代化，以及建立在可证明安全性上的公众信任；州级 AV 和人行道机器人规则仍是拼图，围绕运营、监督、路权、责任和测试各管一段。餐饮配送经济模型还带来更细的约束：The
              Regulatory Review 引用的研究显示，即便技术本身可用，平台费上限也可能把订单从独立商户那里转走，并改变配送经济模型。Avride 的 Robotaxi
              加人行道双线策略因此在商业上重要。人行道机器人瞄准更短路线、更轻载荷和更低速环境，能通过商户和校园更快放大商业化；Robotaxi
              则攻更大但更慢的乘客市场，平台支持、车队融资和安全可信度在其中占主导。Avride 在两类产品上复用共享自动驾驶底座后，每个渠道都能吸收固定研发开支，并产生不同的验证点。公开证据缺的不是市场是否存在，而是
              Avride 已把多少渠道足迹转化成付费行程、订单和可持续单位经济模型。
