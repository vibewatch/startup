        title: 融资信号、价格含混和母公司复杂性
        blocks:
          - type: paragraph
            body: >-
              估值上的关键区分，是 Avride 已确认了什么，以及投资者仍需要推断什么。已确认的是 2025 年 10 月方案的规模和战略性质：Uber 和 Nebius 最高投入 $375
              million，并与车队增长、AI 产品开发和新地域绑定。未确认的信息同样重要：本章审阅并留存的官方文件、新闻稿或法律公告都没有披露 Avride
              的投后估值、股权稀释、优先股堆叠，或股权融资与其他承诺之间的拆分。这个缺口重要，因为如果结构中嵌入了里程碑付款、商业返利或母公司关联支持，一个战略方案看起来可以很大，却仍然不是好的独立定价信号。Nebius
              也让独立定价更复杂，因为它在 2024 年 Yandex 剥离并更名后，明确把 Avride 列为旗下业务之一。因此，2024 年 Yandex 出售估值不是 Avride 的标记；今天任何投资者要承接
              Avride，都仍需要公司间协议、治理权利和股权结构表细节，才能把这一轮融资当作可比的定价股权事件。
