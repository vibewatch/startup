        - 官方 2026 年 2 月 Series D 轮披露
        - 高位私募基准，包含 Uber 参与并明确披露投后估值
        - 已披露资本基数大得多，也有全球 OEM 背书
      - - Aurora Innovation
        - 上市自动驾驶平台
        - $15.14B 市值
        - CompaniesMarketCap，2026 年 6 月
        - 展示上市自动驾驶平台的公开市场上行空间
        - 业务重心偏卡车，更像天花板参照而非直接可比
      - - Zoox / Amazon
        - 战略并购先例
        - 官方公告未披露收购价格
        - Amazon 收购公告，2020 年
        - 显示战略买家对专用 AV 平台有需求
        - 来自资本市场环境不同、行业收缩前的先例
    notes: Avride 没有公开收入或投后估值，可比公司只能方向性使用，并需为披露、安全和集中度风险打折。
    claimRefs:
      - CV020
      - CV023
      - CV025
      - CV026
      - CV029
      - CV030
      - CV034
  - id: TV005
    title: 投资逻辑破裂与放弃触发表
    columns:
      - 触发因素
      - 阈值
      - 对价值的传导
      - 行动含义
    rows:
      - - 安全恶化
        - NHTSA 调查升级、服务暂停，或事故模式显著恶化
        - 驾驶能力是投资逻辑核心，一旦受损，Avride 会滑向困境或深度折价结局
        - 暂停承销，直到安全论证重建
      - - Uber 渠道弱化
        - 部署节奏显著放缓、商业条款恶化，或渠道独家价值消退
        - 同时削弱需求密度、商业化支持和合作伙伴背书
        - 下调估值，并重审所有规模假设
      - - 融资结构不及预期
        - 后续融资显示股权成分弱、条款惩罚性强，或现金跑道很短
        - 削弱 $375M 标题金额的信号价值，并抬高稀释风险
        - 在股权结构表细节披露前，将此前区间视为偏高
    notes: 这些是承销停止信号，不是轻微监控项，因为每一项都会攻击支撑基准情景的假设。
    claimRefs:
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和投后估值
        - 当前股权结构表、投后估值、优先股堆叠和期权池
        - 没有公开来源披露投资人被要求接受的实际价格
        - 向管理层索取条款清单、董事会材料和当前股权结构表
      - - $375M 结构
        - 股权、里程碑、商业承诺和资金到账时间拆分
        - 标题金额不能自动作为可用估值信号
        - 索取已签交易文件和分期机制
      - - 收入和单位经济性
        - 按产品线划分的收入、合作伙伴结算条款、毛利率和贡献利润率
        - 没有经济性披露，公司无法按软件公司或规模化交易平台估值
        - 索取月度 KPI 包，以及按产品拆分的合作伙伴经济性
      - - 烧钱速度和现金跑道
        - 现金余额、月度烧钱速度、资本开支计划和下次融资时间
        - 资本强度是自动驾驶估值和稀释风险的核心
        - 索取资金计划表和 18 个月运营计划
      - - 关联公司权利
        - IP 所有权、转让定价、服务协议，以及相对 Nebius 的少数股东保护
        - 母公司复杂度可能把价值从少数股东手中转走
        - 审阅股东协议和所有关联方协议
      - - 安全责任
        - 保险结构、索赔准备金、补救行动和监管回应路线图
        - 仍在进行的调查可能同时拖累经营和估值
        - 索取保险公司摘要、索赔日志和调查回应工作流
    notes: 每一项都对承销至关重要，因为公开来源最强的是部署标题，最弱的是定价、经济性和治理。
    claimRefs:
      - CV002
      - CV038
      - CV045
      - CV047
      - CV048
