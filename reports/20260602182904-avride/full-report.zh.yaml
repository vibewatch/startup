              配送活动中带来更广的城市曝光，但确切商户数仍散落在地方报道里，没有进入统一官方台账。Rakuten
              提供了最强的非美国证据集，因为它披露了东京具体街区的参与门店、配送点、费用、服务时间和机器人数量计划。合起来看，这些来源证明了真实生产使用，而不只是试点。它们没有证明 Avride
