      - number: '5.4'
        title: 信任、安全与路线图缺口：商业化真实存在，但验证层仍主要留在私有资料里
        blocks:
          - type: paragraph
            body: >-
              信任证据有正反两面。正面看，Avride 披露了配送机器人的隐私保护功能、远程支持升级、受保运营和宽泛合规表述。制造文章增加了 QA 细节，公开招聘也显示公司仍在投入安全分析、仿真、规划和嵌入式系统。NHTSA
              自己 2026 年 3 月 ADS 报告也说明，严肃 AV 监管正开始强调什么：仿真、封闭场地测试、道路评估、子系统失效分析、AI 验证和维护可靠性。由此可以形成成熟尽调材料的合理标杆。


              问题在于，Avride 自身公开材料还没有为运行中的 Robotaxi 技术栈披露达到该标杆的证据。NHTSA 在 2026 年 5 月启动 PE26003 后，验证缺口更重要。立案摘要将调查与 16 起碰撞和
              1 起轻伤相连，并明确质疑系统在变道、对前方车辆响应以及对部分挡路静止物体反应中的能力和果断性。TechCrunch 另行报道了 Avride
              的说法：公司已实施针对性缓解措施，每英里事故频率正在改善。但这些表述仍是安全悬念进行中时的公司回应，而不是问题已被完全控制住的独立证明。


              正确结论不是 Avride 缺少技术；留存来源清楚显示了真实产品、真实合作伙伴和真实部署基础设施。正确结论是：Avride
              的产品和制造故事，比验证故事公开得多。除非公司分享独立安全指标、接管数据和买方级安全论证，最重要的技术尽调问题仍属于私有证据项，而不是公开已关闭事实。
