      - number: '2.2'
        title: 测算可触达机会
        blocks:
          - type: paragraph
            body: >-
              公开市场测算支持一个有意义的市场，但无法给出单一精确 TAM。Fortune Business Insights 将 2026 年全球 Robotaxi 市场估为 USD 1.27 billion，The
              Business Research Company 则因类目边界更宽，把同一年估为 USD 5.5 billion。配送侧也是同样问题：Precedence Research
              用一个宽口径看自动化最后一英里配送，又用一个窄得多的口径看配送机器人，正因如此，Avride 不应把所有自动驾驶标题都压成一个数字。最稳妥的公开读法是多视角。Robotaxi
              方面，北美已经是领先区域；一份报告称仅美国 2026 年约为 USD 0.67 billion。配送自动化方面，北美同样是领先区域，食品饮料或短途地面场景在证据中占主导。因此北美是最佳公开 SAM
              代理，密集食品或便利配送路线是最佳可服务切入口。公开 SOM 仍然薄弱。Avride 披露了平台集成、城市上线和扩车意图，但没有披露城市级付费行程量、按商户群组拆分的订单数或抽佣经济模型。正确姿态是展示
              TAM、北美 SAM 代理和渠道足迹 SOM 代理，而不是编造一个货币化市场份额数字。
