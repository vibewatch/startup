  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 当前活跃风险集中在安全审查和 2026 年更严格的 Texas 运营制度
        blocks:
          - type: paragraph
            body: >-
              Avride 最直接的风险在 2026 年 5 月从泛化的 AV 质疑转向具名监管组合。NHTSA 审阅碰撞视频后，对 Avride ADS 启动 PE26003，并列举 Dallas 和 Austin 的 16
              起已报告碰撞以及 1 起轻伤。立案摘要对失效模式写得异常具体：向相邻车辆不安全变道、未能对前方既有车辆减速，以及撞上部分遮挡道路的静止物体。Avride 唯一公开乘客渠道，是 2025 年 12 月 3 日在
              Dallas 启动的 Uber 服务；因此，这项调查直接压在公司的旗舰商业化叙事上，而不是压在旧测试项目上。


              Texas 同时抬高了运营门槛。TxDMV 现在要求商业 AV 运营方保持授权、记录应急人员流程、维持规定的记录和责任保险，并具备在最小风险退避状态下合法运行的能力。同一制度还授权
              TxDMV：如果车辆运行危及公众，并已经造成或可能造成严重人身伤害，可以限制或撤销授权。也就是说，联邦缺陷审查现在会和州级实时准入系统相互作用。投资判断的核心不是停运一定会发生，而是 Avride 现在在同一个
              Texas 市场同时面对可监测的联邦调查、州授权风险和公共服务连续性风险。已审阅的公开材料仍未确认 Avride 当前授权状态，也没有披露回应 PE26003 的完整整改方案，因此监管连续性问题仍未关闭。
