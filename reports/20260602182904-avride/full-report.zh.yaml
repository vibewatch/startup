      - - Motional
        - 直接：Robotaxi；相邻配送试点
        - 通过 Uber 在 Las Vegas 提供公开行程；Hyundai / Aptiv 支持
        - 网约车伙伴和出行网络
        - 伙伴优先的 Robotaxi 模式，与 Avride 架构接近
