  - id: TM002
    title: TAM / SAM / SOM 测算视角表
    columns:
      - 视角
      - 来源 / 依据
      - 年份 / 地理范围
      - 数值
      - 份额 / CAGR
      - 为何重要
      - 限制
    rows:
      - - 全球 robotaxi TAM
        - Fortune Business Insights
        - 2026 / 全球
        - USD 1.27B
        - 71.9% CAGR 至 2034 年
        - 对无人驾驶网约车服务有用的狭义公开视角。
        - 低于其他报告，因为类别边界相对较紧。
      - - 全球 robotaxi TAM
        - The Business Research Company
        - 2026 / 全球
        - USD 5.5B
        - 自 2026 年起 57.4% CAGR
        - 覆盖更宽的 robotaxi 类别，也显示标题数字对定义有多敏感。
        - 出厂口径不同于平台收入或 AV 抽成率。
      - - 北美 robotaxi SAM 代理指标
        - Fortune 区域份额 + 美国估计
        - 2025-2026 / 北美和美国
        - 北美 54.09% 份额；美国约 USD 0.67B
        - 北美在 2025 年领先
        - 对 Avride 已在运营且规则相对宽松的地区，这是最佳公开区域代理指标。
        - 仍非城市层面，也非 Avride 专属。
      - - 全球自动驾驶最后一公里 TAM
        - Precedence Research
        - 2026 / 全球
        - USD 8.12B
        - 22.99% CAGR 至 2035 年；北美 2025 年占 47%
        - 宽口径配送自动化视角，说明物流需求为何巨大。
        - 包含比人行道机器人更宽的栈。
      - - 全球配送机器人 TAM
        - Precedence Research
        - 2024 基线 / 全球
        - 2024 年 USD 409.3M
        - 2025 至 2034 年 32.01% CAGR；北美 2024 年占 42%
        - 更窄的人行道机器人视角，更贴近 Avride 的物理形态。
        - 不是 2026 年点估计，也比自动驾驶最后一公里报告更窄。
      - - 餐饮楔子
        - Precedence 自动驾驶最后一公里 + 配送机器人
        - 2025-2026 / 全球
        - 餐饮占宽口径自动驾驶最后一公里 >86%；占配送机器人终端用途 42%
        - 短程地面和餐饮用例占主导
        - 确认餐饮配送是近期买方楔子中证据最充分的一块。
        - 百分比来自不同但相关的类别定义。
      - - 公开 SOM 代理指标
        - Avride + Uber 已披露足迹
        - 2024-2026 / Austin、Dallas、Jersey City、校园
        - 仅渠道足迹；没有公开收入分成
        - Dallas 发布区域 9 square miles；配送扩展至多个城市和校园
        - 当前可获取市场的最佳非编造公开代理指标。
        - 没有公开付费行程、订单队列、抽成率或单位经济性披露。
    notes: 数值混合了出版方给出的估计和明确标注的代理逻辑；目的在于约束机会范围，而不是假装公开来源揭示了 Avride 的精确 SOM。
