      - number: '2.3'
        title: 买方分层与单位经济逻辑
        blocks:
          - type: paragraph
            body: >-
              买方并不相同。Robotaxi 里，直接预算方往往是平台或车队运营商；它们更需要供给密度、客户支持、场地或监管整合，而不是拥有 AV
              基础设施的每一层。人行道配送里，近期付款方可能是连锁餐厅、校园餐饮运营商、配送平台、杂货或便利店运营商，或工业场地物流经理。公开部署证据说明了买方差异为何重要。Uber 已经带来需求密度和支持基础设施；Serve
              与 Starship 证明，密集、重复的路线可以在更广义乘用 AV 市场完全成熟前先跑出规模；Avride
              自己的机器人材料也强调实施周期短、无需额外人员、运营边界收得很紧。单位经济逻辑同样务实，而不是未来主义。美国电商仍在增长，私营部门劳动力成本继续上行，BLS
              工资数据也显示快递员和司机仍是重要成本池。因此运营问题不是自动驾驶能否彻底消灭人工，而是它能否在密集走廊降低每次履约成本，同时把完成率、支持和安全表现维持在足以让商户、乘客和平台信任的水平。
