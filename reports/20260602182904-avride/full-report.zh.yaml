      - number: '3.2'
        title: Robotaxi 竞争：Waymo 规模、合作型同业和向内收拢的相邻玩家
        blocks:
          - type: paragraph
            body: >-
              Waymo 是 Avride 必须跨过的公开 Robotaxi 可信度标杆。Waymo 自身材料现在指向 10 个商业化都会区、到 2026 年底每周超过 1 million 次出行的路径、自有出行
              App，以及部分城市里的 Uber 分发。该组合说明 Waymo 不仅商业足迹大于 Avride，对单一渠道伙伴的依赖也更低。Zoox 和 Motional 的重要性各不相同。Zoox
              讲的是最强的专用乘用车故事，可能吸引希望获得完全重新设计服务体验的城市或乘客，即便其公开付费规模看起来仍落后于 Waymo。Motional 在结构上更接近 Avride，因为它已经把 Level 4 IONIQ
              5 Robotaxi 接入网约车伙伴，并有过 Uber Eats 自动配送历史，所以产品和商业化路径更像 Avride 的模式。不过，最大变化是原本相邻的玩家正在向内移动。Nuro 已成为 Lucid-Uber
              Robotaxi 计划的一部分，目标超过 20,000 辆车；Waabi 则把新一轮 $1 billion 融资与自己的大型 Uber Robotaxi 计划配在一起。因此，Avride 竞争的不只是现有
              Robotaxi 运营商，还有能借 Uber 压缩商业化时间的通用自动驾驶技术栈。
