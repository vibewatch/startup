      - number: '1.3'
        title: 融资、合作伙伴与规模指标
        blocks:
          - type: paragraph
            body: >-
              Avride 目前阶段更像有风险资本背书的商业化上线，而不是一个标签清晰的机构轮次。官方披露只说明 Avride 在 2025 年 10 月获得 Uber 和 Nebius 最高 $375 million
              的战略投资与商业承诺，资金将用于车队增长、AI 产品开发和新地域扩张。该措辞与目录资料把公司标成 Series E
              有实质差别；本文审阅的官方文件也没有给出公司确认的投后估值。因此第一章最稳妥的处理方式，是沿用已披露融资金额，把估值标为缺乏公司确认，并注明关于结构或轮次的低层级报道只是二级证据。牵引数据同样不完整。Avride
              及其合作伙伴公开声称覆盖数百家餐厅、完成数十万单配送，并与 Grubhub 完成超过 100,000 次校园配送，但没有披露收入、运行率、ARR 或客户总数。员工数也噪声很大：官方页面写着 200
              多名工程师和数百名工程师，Tracxn 则报 352 名员工，并附带 Newburyport 地址元数据。只要后续章节使用已披露区间，并把缺乏支持的指标明确留作 null，公开冲突就可控。
