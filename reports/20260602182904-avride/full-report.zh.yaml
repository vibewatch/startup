  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构
        blocks:
          - type: paragraph
            body: >-
              Avride 并不是面向一个笼统的“自动驾驶汽车”市场销售。真正应纳入的支出范围更窄：由 Robotaxi
              承接的按需乘客出行、由人行道机器人承接的短途商业配送，以及让两类服务能够规模部署的商业化层。公开资料说明了为什么相邻的商业化层重要。Uber 和 Avride 已经把配送机器人与 Robotaxi
              都接入同一个面向消费者的平台，Uber Autonomous Solutions 也明确把需求生成、地图、监管支持、客户支持、车队智能、保险和融资打包进商业化能力。因此 Avride
              面对的市场一部分是服务市场，一部分是渠道准入市场。同样重要的是需要排除的支出。传统人工网约车 GMV、没有自动化绑定的广义餐饮配送 GMV，以及通用 EV 或 OEM 车辆收入，都不应放进 Avride
              的直接机会，除非能看见与自动驾驶挂钩的抽佣率。结果是一种渠道优先的市场结构：平台方、自动驾驶开发者、车辆或车队伙伴和监管方，共同决定名义总可用市场（TAM）中有多少能真正转为可服务机会。
