  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图：直接对手、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Avride 的竞争集合比一张简单 Robotaxi 名单更宽。公司同时公开销售两类自主产品：乘客驾驶技术栈和人行道配送机器人，因此直接战场横跨 Robotaxi 与自动化最后一英里机器人。Robotaxi
              里，最直接的同业仍是 Waymo，因为它已经以大得多的公开规模运营商业服务；Zoox 和 Motional 则作为合作伙伴主导或专用车型替代方案，争夺同一类乘客行程。配送里，Serve、Starship 和
              Robot.com 是最清晰的直接运营可比公司，因为它们公开披露的车队、配送量或校园足迹已经大于 Avride。相邻阵营同样重要。Nuro 和 Waabi
              已不能稳稳放在框外，因为两家公司现在都在营销可泛化的自动驾驶技术栈，并能接入 Uber 的 Robotaxi 计划；Cartken
              则展示了配送玩家如何把技术栈转到工业场景，同时保留最后一英里可选项。替代方案就是现状本身：人工网约车和人工骑手网络，以及最大平台和车队运营商的内部自建。本章因此不只是比较某一个正面对手，而是判断谁能在几个自主移动场景里控制需求、信任和部署经济模型。
