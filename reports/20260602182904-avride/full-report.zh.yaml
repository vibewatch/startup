      - number: '5.2'
        title: 共享自动驾驶栈与硬件策略：相对营销材料异常具体，但尽调仍只看到选择性披露
        blocks:
          - type: paragraph
            body: >-
              Avride 的公开 Robotaxi 材料比典型创业公司落地页更具体。公司披露了一套分层软硬件叙事：基于激光雷达、在持续更新的 3D
              地图上定位，融合感知栈，学习式预测，以及同时优化安全和舒适度的路线规划。车辆侧，Avride 公开点名 5 个激光雷达、4 个雷达和 13
              个摄像头，还包括自研激光雷达与摄像头硬件，以及面向降水和雾天的传感器清洁逻辑。即便叙事仍由公司掌控，具体程度也给尽调团队留下了可测试对象。


              留存资料中最强的第三方技术佐证来自 Ampere 的计算案例研究。该研究称 Avride 的主计算单元协调感知、规划、定位、车辆控制和健康监测，公司选择 Ampere CPU 与 ADLINK
              板卡，是为了在不重新设计车辆硬件的情况下满足严格散热和功耗边界。关键在于，它把技术栈从泛泛 AI 营销，变成了真实嵌入式系统取舍故事。已披露架构也与 Avride 公开强调的方向一致：在炎热 Texas
              条件下运行，并在新增功能时无需每次重开核心车辆封装。


              即便有这些细节，公开技术栈仍是选择性披露。公司说明了有哪些模块，但没有发布系统级延迟预算、接管阈值、后备策略，或感知、预测、规划的量化错误率。因此公开证据支持 Avride
              具备连贯的自动驾驶架构和有意设计的硬件策略；但还不能证明这套技术栈在恶劣真实世界条件下，相对一线运营商有多稳健。
