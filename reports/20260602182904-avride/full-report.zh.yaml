      - number: '4.2'
        title: 公开单位经济线索指向高硬件与高支持强度
        blocks:
          - type: paragraph
            body: >-
              公开记录缺少已报告的利润率指标，但部分成本结构线索可以补上。Avride 自己的产品页面称配送机器人面向快速部署和高性价比配送设计，同时也展示了支撑这个承诺的物理和运营约束：12
              小时电池窗口、50-kilometer 续航、25-kilogram 载荷，以及工厂制造硬件。Robotaxi 侧的披露技术栈资本强度更高，包括 5 个激光雷达、4 个雷达、13
              个摄像头和服务器级车载计算。Avride 的基础设施披露里也出现同样模式。ClickHouse 描述每辆车每分钟产生数千个数据点，并称随着车队数据量上升，Avride 过去曾面对 petabyte
              级重复成本；自动驾驶经济模型不只由车辆和传感器塑造，也受云存储、仿真、遥测和工程工具影响。短期乘客业务利润率很可能仍然尤其弱，因为 Dallas
              上线运营仍包含车内专家或安全员，所以公开票价信号不应被误读为无人驾驶稳态。换句话说，Avride 的证据足以证明真实商业活动，但还不足以证明有吸引力的单位经济模型。
