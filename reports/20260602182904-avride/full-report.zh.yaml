companyProfile:
  summary: >-
    Avride 是一家总部位于 Austin 的自主移动公司，用一套自动驾驶技术栈同时做 Robotaxi 和配送机器人。公开证据显示，公司已通过 Uber 在 Dallas 提供 Robotaxi 出行，并与 Uber
    Eats、Grubhub/Wonder、Rakuten 开展配送部署；Uber 与 Nebius 是战略背书方，Hyundai 是车辆供应伙伴。同一组资料也显示，公司独立治理与经济模型不透明，没有公司确认的估值，2026 年 5 月
    NHTSA 调查带来实质安全悬念。
  headquarters: Austin, TX, USA
  productSummary: >-
    Avride 以两种形态出售自主移动能力：通过 Uber 运营的 Hyundai IONIQ 5
    Robotaxi，以及嵌入外卖平台和校园流程的人行道配送机器人。公司称两条产品线共享同一套自动驾驶脉络；配送侧的制造和工作流证据目前最扎实。
  customerFocus: 终端用户是网约车乘客和外卖用餐用户，但真正的采购与运营界面在平台和运营方，包括 Uber、Uber Eats、Grubhub、Wonder、Rakuten、校园和参与商户。
  businessModel: 合作伙伴主导的交易收入模型：Avride 提供自动驾驶、车队和运营能力；下单、支付、支持和大部分客户关系归属留在 Uber、Grubhub/Wonder、Rakuten 及上述渠道伙伴手中。公开资料未披露抽佣率或单位经济模型。
  stage: Venture-backed commercial launch
  fundingStatus: >-
    最近一次重大公开融资信号是 2025 年 10 月披露的 Uber 和 Nebius 最高 $375 million 战略投资与商业承诺，用于车队增长、AI
    产品开发和地域扩张。公开资料未披露股权与其他承诺的拆分，也未披露公司确认的投后估值。
