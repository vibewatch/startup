      - number: '7.3'
        title: 历史沿革和情景风险仍重要，因为它们会改变交易对手信任、披露要求和扩张节奏
        blocks:
          - type: paragraph
            body: >-
              Avride 的 Yandex 和 Nebius 沿革不再是主要运营阻碍，但作为历史风险和情景风险仍不能忽略。Avride 自己称，许多工程师曾参与 Yandex 自动驾驶技术。Yandex/Nebius 在
              2024 年 7 月完成俄罗斯业务剥离、并把保留业务更名为 Nebius Group 之后，独立报道仍长期把 Avride 称为从 Yandex 拆分出来的公司。Nebius
              文件和同期报道明确写明，公司已完全处置俄罗斯业务，并公开称与俄罗斯的所有联系均已切断。即便如此，文件历史并不能抹去一个事实：只要起源故事仍在市场叙事中显眼，未来监管机构、企业客户或投资者就可能继续围绕历史人员、交易对手、制裁敞口和治理控制提出额外尽调要求。


              治理不透明让这种尾部风险更难排除。已审阅的 Avride 公开材料披露了 Austin
              法律地址、广泛招聘规模、产品叙事和详细隐私政策，但没有发布公开董事会名单、独立治理包或独立财务报表。这意味着即便直接地缘政治风险看起来已经历史化，尽调负担仍是当下问题。竞争进一步放大压力。Waymo 已经在包括
              Dallas、Houston、San Antonio 在内的另外四座城市开放公众乘车；Uber 同时在准备 Lucid/Nuro robotaxi 发布；Serve 和 Starship
              披露了大得多的配送足迹。因此，Avride 竞争的不只是自动驾驶质量，还包括相对于更大或更成熟网络的合作伙伴心智、信任、资本获取和运营规模。
