      - number: '6.4'
        title: 集中度风险仍高：Uber 支撑 robotaxi 和相当一部分配送，直接多元化仍窄
        blocks:
          - type: paragraph
            body: >-
              本章最核心的风险结论是：Avride 确实有一定渠道宽度，但直接客户多元化有限。Uber 是锚定风险敞口，因为它是唯一公开的 robotaxi
              上市路径，也是主要配送平台；一个合作伙伴就会影响乘客获取、用户体验、支持、价格展示和地理扩张节奏。Grubhub 是真实的第二条美国渠道，但最强证据仍是校园餐饮和一个由 Wonder 支撑的 Jersey
              City 试点。Rakuten 把地图扩到日本，但仍是一项由单一运营方管理的东京地区服务。即便是市政管线证据也仍然初步：Arlington
              还停留在测绘和讨论阶段，合作关系没有披露。近期最严重的悬置风险是监管。NHTSA 2026 年 5 月的调查瞄准 Dallas 乘客市场，而这个市场正支撑 Avride 公开 robotaxi
              可信度；客户扩张不只取决于技术表现，也取决于 Uber 对风险的容忍度和监管机构对扩张的容忍度。因此，公开证据支持真实商业化，但还不支持一批不受单一合作伙伴决策影响的直接企业账户。
