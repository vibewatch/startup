        - 熟悉 app 内的地理围栏行程
        - 行程密度高，且有足够支持基础设施支撑安全上线。
      - - 餐厅 / QSR 配送
        - 商户或交易平台账户负责人
        - 下单点餐的消费者
        - 商户经济性加平台经济性
        - 高密度短途熟食履约
        - 需要降低每单成本，或在不加人手的情况下扩展配送能力。
      - - 校园餐饮
