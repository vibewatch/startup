      - number: '8.6'
        title: 展示项
        blocks:
          - type: callout
            title: 融资金额已确认；价格没有确认
            body: 2025 年 10 月方案给了 Avride 真实的战略融资动能，但公开证据仍未披露投后估值、稀释，或股权与其他承诺之间的拆分。投资者不应把一个很大的战略标题误当成干净的定价轮标记。
