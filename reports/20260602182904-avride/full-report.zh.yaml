  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开证据的 Avride 估值区间，加上方向性融资桥，单位均为十亿美元。
    data:
      items:
        - label: 悲观情景
          low: 0.3
          mid: 0.5
          high: 0.8
          unit: B USD
          detail: 安全压力或融资疲弱，会把 Avride 推向困境估值或配送业务底部结果
        - label: 基准情景
          low: 1
          mid: 1.4
          high: 1.8
          unit: B USD
          detail: 有监督商业化继续推进，但披露质量仍然单薄
        - label: 乐观情景
          low: 2.5
          mid: 3.2
          high: 4
          unit: B USD
          detail: 安全问题解除、无人驾驶规模扩大，Avride 缩小与上市 robotaxi 同业的差距
        - label: 全额 $375M 股权桥
          low: 1.9
          mid: 2.5
          high: 3.8
          unit: B USD
          detail: 仅作方向性测算；虽然后续方案包含其他承诺，仍假设 20% 到 10% 稀释
    claimRefs:
      - CV034
      - CV037
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 按里程碑给出的示意性估值敏感性，以十亿美元计的隐含价值中枢展示。
    data:
      items:
        - label: 安全压力未解
          value: 0.6
          detail: 调查持续，折价加深，合作伙伴集中度主导叙事
        - label: 基准有监督规模
          value: 1.4
          detail: 若商业化继续推进但没有更深入披露，这是当前最佳估计
        - label: 股权结构清晰 + 收入披露
          value: 1.9
          detail: 经济性透明后，对公开 robotaxi 同业的折价会收窄
        - label: 多城市无人驾驶扩张
          value: 3
          detail: 运营证据可能支撑估值向更强的私有 robotaxi 基准靠拢
        - label: 类同业溢价重估
          value: 4
          detail: Avride 接近同业上沿之前，需要明显更强的证据
    claimRefs:
      - CV014
      - CV035
      - CV040
      - CV041
      - CV043
