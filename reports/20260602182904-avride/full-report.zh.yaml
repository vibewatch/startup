            body: >-
              公开来源确实显示用户会回头使用，但离 SaaS 式留存披露还很远。Grubhub 的 Ohio State 案例给出最强重复使用代理指标，因为外部报道把校园部署与每周超过 6,000 单、峰值日约 1,600
              单配送联系起来。Salisbury 官方页面补充了较小但仍有意义的日运行率：150 至 200 单配送。Rakuten
              官方和博客材料描述了日常服务、全天候运营，以及从初始门店组合扩展出来的名单，支撑了连续性判断，但仍没有披露家庭重复使用率。缺失的是支撑投资判断的材料层：审阅过的公开来源没有给出
              NRR、GRR、流失率、续约率、合同期限、队列留存，甚至没有合并口径的活跃客户数。因此，公开客户证据是运营性的，不是合同性的。投资者能看到机器人有人用，但还看不出哪些客户续约、哪些城市能在没有补贴时维持使用，也看不出
              Avride 是否在这些经常性交易中掌握耐久毛利。
