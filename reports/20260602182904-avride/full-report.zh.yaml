            body: >-
              公开证据支持一个简单但重要的财务结论。Avride
              已不再是纯实验室项目：它有运行中的乘客出行、付费配送活动、战略资本、制造支持和公开车队增长信号。但这些事项本身都没有解决承销问题。审阅过的官方来源没有披露收入、ARR、毛利率、烧钱速度、现金跑道、客户集中度或债务义务。公开定价证据仅限于面向客户的信号，而不是
              Avride 的净经济模型。即便最好的外部估计也停留在宽泛阶段或员工数标签，开放公开的估值支持仍然缺席。多重反向视角同时存在：重硬件车辆和机器人车队带来的资本强度，安全员和现场支持拖累利润率，对 Uber 与
              Nebius 在资本和商业化上的依赖，以及进行中 NHTSA
              调查带来的监管风险。因此，投资人应把当前规模指标视为商业相关性的证明，而不是有吸引力经济模型的证明。下一步尽调不应再要一版市场叙事，而应要求数据室材料包，按产品线展示结算、利用率、利润率、现金余额和融资条款。
