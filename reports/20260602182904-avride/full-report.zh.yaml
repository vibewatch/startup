coverageNotes: >-
  本报告基于截至 2026-06-02 的公开信息。Avride 是一家私营公司，Robotaxi
  与配送业务已有真实商业部署，但已留存公开资料并未清晰披露收入、ARR、毛利率、烧钱速度、现金跑道、客户总数、准确员工数、累计融资、股权结构条款，或公司确认的投后估值。最强的公开锚点包括 2025 年 10 月 Uber/Nebius
  最高 $375 million 的投资与商业承诺组合、2025 年 12 月 Dallas Uber Robotaxi 上线、通过 Uber Eats、Grubhub/Wonder 与 Rakuten 运行中的配送项目，以及 2026
  年 5 月 NHTSA 在 16 起碰撞和 1 起轻伤后启动的调查。因此估值框架只能按情景搭建，并需用管理层、监管和交易文件核验。
