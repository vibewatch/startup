  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面：两类自主产品，一层合作伙伴主导的商业化通道
        blocks:
          - type: paragraph
            body: >-
              Avride 的产品界面不只是一个 Robotaxi 演示。留存来源显示两条已上线商业路径：乘客 Robotaxi 和人行道配送机器人。产品宽度真实存在，但两条线成熟度不同。配送商业化时间更长，Uber 和
              Grubhub 披露显示其已在 Austin、Dallas、Jersey City、美国校园，甚至更早的韩国配送中运营。乘客出行则是在 2025 年末从公共道路测试进入 Dallas Uber
              上线；上线时车内仍有专家，未来无人驾驶运营仍是路线图事项，而不是已经完成的里程碑。


              最重要且有证据支撑的产品点，是 Avride 正试图用同一条自动驾驶技术脉络商业化两个界面。Avride 称车辆和机器人共享技术，Uber、Nebius 与 Grubhub
              的伙伴材料也重复了同一说法。关键在于，Avride 不是在搭两家彼此无关的公司，而是在尝试把感知、规划、平台软件和运营学习复用于道路与人行道。不过，一些最强的规模和路线图表述仍是公司自称或伙伴复述，尚未独立对标。


              商业化也明显依赖渠道。Uber 拥有出行的主要用户端需求界面，也占据配送曝光的重要部分；Grubhub 则提供了平台和校园餐厅集成最好的公开证据。Hyundai 通过 IONIQ 5 和 Metaplant
              America 的组合强化了车辆供应路径，但即便这项合作，首个已披露乘客服务仍通过 Uber 而不是 Avride 自有 App 触达。产品故事在范围和合作深度上可信，但尚未证明 Avride
              控制了独立分发护城河。
