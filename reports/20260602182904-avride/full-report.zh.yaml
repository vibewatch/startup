            body: >-
              Avride 最难的竞争问题不是自动驾驶技术栈是否真实，而是商业化层有多少属于 Avride，而不是 Uber。Uber 现在公开向多家 AV 伙伴提供地图、监管支持、保险、客户支持和车队工具，这显然加快了
              Avride 的上线路径，但同样的服务也能帮助竞争对手缩小差距。该结构削弱了平台方的锁定效应，因为 Uber 可以在 Avride、Waymo、Nuro、Waabi
              等伙伴之间多家并行，而不用每次重建完整商业化栈。它也削弱了定价透明度，因为多数供应商不公布费率表，而是围绕渠道准入、单位经济模型、服务可靠性和不完全公开的伙伴条款竞争。Avride
              试图在乘客和配送两类场景间复用一套自动驾驶技术栈，这仍然是真实战略优势。但公司也带着可见劣势：Waymo 的规模和信任领先，Serve 与 Starship 披露的配送证据更强，Nuro 和 Waabi
              已显示高资本需求，以及 Avride 自身的 NHTSA 审查。净结果是：护城河在架构上有吸引力，但在 Avride 证明更高公开规模、更宽渠道独立性和更好安全可信度之前，耐久性只能算中等。
