        title: 配送机器人：专门玩家公开披露的规模已强于 Avride
        blocks:
          - type: paragraph
            body: >-
              Avride 的第二战线是人行道配送，这里的竞争格局由已经展示更大公开运营数字的专门玩家塑造。Serve 披露的美国车队和 NVIDIA 背书运营指标，使其成为最尖锐的美国本土重叠案例：它在 Uber Eats
              上扩张，服务数千家餐厅，并把自动化包装成密集短途物流的更好单位经济模型。Starship 是更宽的全球标杆。其公开足迹已经覆盖 300 多个地点、3,000 多台机器人和超过 10 million
              次配送，校园、杂货、配送 App 集成和工业场景都可见。Robot.com，也就是此前的 Kiwibot，规模小于 Starship，但仍然重要，因为它声称完成超过 1.7 million 项任务、拥有 500
              多台机器人，并通过 Sodexo 等运营商建立了很深的校园和企业关系。Cartken 已部分从消费者最后一英里扩张转向工业工作流，但不应误读为永久退出；其新闻稿和 TechCrunch
              报道显示，同一套底层导航技术栈仍能在餐饮配送、校园路线和场内物料流转之间移动。相对这一赛场，Avride 的配送业务因与 Robotaxi 共享自动驾驶学习而差异化，但公开披露的配送量比头部公司更薄，这是劣势。
