  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户架构：真实需求存在，但商业界面大多由合作伙伴控制
        blocks:
          - type: paragraph
            body: >-
              Avride 的客户故事真实存在，但高度中介化。公开证据显示已有真实乘客和用餐用户，但购买、付费、结账和客户支持界面大多在更大的平台手中。乘客侧，Dallas 用户通过 Uber App 接触
              Avride；Uber 负责匹配、同价、解锁、支持，以及是否接受或拒绝 AV 的选择。配送侧，Uber Eats、Grubhub、Wonder 和 Rakuten
              各自掌握面向用户的下单流程，商户、校园和社区提供本地需求场景。该区别重要，因为终端用户不等于经济客户。乘客和用餐用户是服务接收者；餐厅和校园运营方是商户或机构参与者；Uber、Grubhub、Wonder 与
              Rakuten 才是真正聚合需求并拥有大部分交易界面的渠道伙伴。结果是：客户基础在表面积上更宽，但直接企业多元化证据并不强。Avride 可以指向 Robotaxi
              乘客、校园用餐用户、社区居民和餐厅订单，但公开资料中由 Avride 直接管理的企业账户证据仍然很薄。
