  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 零售电商增长
        - 正向
        - 当前
        - 数字化订单越多，履约压力越高；这正落在配送机器人瞄准的短距离流量里。
        - 向 Avride 索取走廊级订单密度门槛，验证什么密度足以支撑机器人部署。
      - - 工资和福利通胀
        - 对自动化需求正向
        - 当前
        - 人工成本上涨，会增强配送和出行自动化的相对经济性。
        - 要求提供人工、远程支持和维护成本曲线的并排对比。
      - - 平台分发规模
        - 正向
        - 当前
        - Uber 已经带来乘客、商户、支持体系和需求密度；独立自动驾驶创业公司通常要花多年才能搭出来。
        - 要求比较 Uber 主导上线与直连商户、直连城市渠道的经济性。
      - - 利用率和年里程
        - 门槛因素
        - 当前至中期
        - Robotaxi 经济性取决于昂贵资产能否持续出车；利用率不足会吃掉自动驾驶优势。
        - 要求按时段提供 Dallas 利用率、停机和接管数据。
      - - 碎片化自动驾驶监管
        - 负向
        - 当前
        - 按城市、按州分割的规则会拖慢 Robotaxi 扩张，并推高上线成本。
        - 要求 Avride 提供优先司法辖区和各州合规时间表。
      - - 碎片化人行道机器人规则
        - 负向
        - 当前
        - 州和地方 PDD 规则围绕路权、监管和运营限制设门槛，即使在低速环境也会限制规模。
        - 要求按市场提供人行道运营、许可和人工监督要求的法律地图。
      - - 商户和平台经济性
        - 混合
        - 当前
        - 餐厅可能想要更便宜的履约，但费率上限和排序变化会扭曲真正受益的商户范围。
        - 要求按商户类型拆分单位经济，并说明扣除平台费用后自动化是否提升毛利率。
      - - 载荷和路线边界
        - 在高密度短路线之外为负向
        - 当前
        - 配送机器人最适合短、轻、可重复路线；面对大件或稀疏路线更弱。
        - 要求按订单类型提供路线级排除规则和失败模式。
      - - 公开数据不透明
        - 对外部测算为负向
        - 当前
        - 付费行程、订单队列和抽成率披露不足，公开 SOM 很难算得可信。
        - 要求提供经审计或董事会级运营 KPI，把覆盖足迹转成收入份额逻辑。
    notes: 这张表混合了直接观察到的市场事实和综合推导的影响；尽调问题标出公开证据仍不足以支撑清晰投资级模型的地方。
