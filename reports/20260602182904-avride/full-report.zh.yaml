  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从已确认融资出发，经过同业锚点和风险过滤，最终导向建议的决策链。
    data:
      nodes:
        - id: n1
          label: 已确认融资信号
          detail: Uber 和 Nebius 的投资及承诺最高 $375M，但未披露投后估值
        - id: n2
          label: 商业证据集
          detail: Dallas robotaxi 上线，加上通过 Uber 和 Grubhub 开展的配送试点
        - id: n3
          label: 可比锚点集
          detail: 可比估值：Serve $0.77B、WeRide $2.56B、Pony $4.69B、Nuro $6B、Wayve $8.6B、Aurora $15.14B
        - id: n4
          label: 风险过滤
          detail: NHTSA 调查、未披露收入、客户集中、母公司结构复杂
        - id: n5
          label: 加权价值区间
          detail: 情景加权区间中心大约在 $1.3B 至 $1.6B
        - id: n6
          label: 建议
          detail: 只在有保护的入场水平以下选择性跟踪；缺乏支撑的溢价标记则放弃
      edges:
        - from: n1
          to: n2
