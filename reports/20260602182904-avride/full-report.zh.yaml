          - type: callout
            title: Avride 夹在配送机器人地板价和 robotaxi 溢价之间
            body: >-
              Serve Robotics 显示公开市场可以把配送机器人公司定得多低；WeRide、Pony AI、Nuro 和 Wayve 则显示，投资者愿意为商业化和资本获取更清晰的规模化 robotaxi
              或自动驾驶平台支付高得多的价格。Avride 位于两极之间，但在披露改善前更靠近折价侧。
            calloutType: insight
