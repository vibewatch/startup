      - number: '8.3'
        title: 可比基准与 2026 年市场环境
        blocks:
          - type: paragraph
            body: >-
              可比公司组同时说明两件事：自动驾驶仍能拿到多少资本，以及市场现在会多快折价运营不确定性。配送侧，Serve Robotics 交易市值约 $0.77 billion，同时已经披露数万单配送，并签署了在 Uber
              Eats 上部署最多 2,000 台机器人的计划。robotaxi 侧，WeRide 和 Pony AI 分别约在 $2.6 billion 和 $4.7 billion 交易；Wayve 在 2026 年 2
              月 Series D 披露 $8.6 billion 投后估值；Nuro 在 2021 年估值 $8.6 billion 后，于 2025 年以 $6 billion 估值融资。Aurora
              高得多的市值说明，公开市场投资者仍愿意为上市自动驾驶平台付钱，但其重卡业务敞口很重，更像天花板参考，而不是直接的城市 AV 可比对象。负面市场读数同样重要。CNBC 报道 GM 在关闭 robotaxi 业务前为
              Cruise 投入超过 $10 billion；Reuters 则显示 Nuro 以低于 2021 年标记的估值融到新钱。合起来看，2026 年市场环境奖励规模化披露，惩罚仍缺少已验证商业效率的高价自动驾驶故事。
            claimRefs:
