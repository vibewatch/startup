        - 学生和教职员工
        - 校园餐饮预算或平台伙伴
        - 宿舍、教室、零售点之间的校园内取餐与配送
        - 封闭或半封闭环境，密度可预测，便利性需求强。
      - - 生鲜杂货 / 便利店
        - 零售运营商或配送平台
        - 消费者
        - 零售运营预算或平台预算
        - 小篮子订单的超本地配送
        - 需要在紧时间窗口内反复履约短距离订单。
      - - 工业 / 场地物流
        - 场地运营方或设施经理
        - 员工和内部需求方
        - 运营预算
        - 零部件、样品或物资的内部转运
        - 需要减少低价值内部跑腿，并提升服务一致性。
      - - OEM / 自动驾驶车队商业化
        - 车企、车队运营商或自动驾驶开发商
        - 自动驾驶运营方和终端乘客
        - 车队、融资或合作伙伴商业化预算
        - 车辆供应、集成、现场运营、建图、保险和支持
        - 需要扩张速度超过纯软件栈单独能支撑的速度。
