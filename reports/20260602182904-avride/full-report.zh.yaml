    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与产品范围
        blocks:
          - type: paragraph
            body: >-
              尽调中应把 Avride 视为一家总部在美国的自主移动公司，拥有两条商业产品线：Robotaxi 和配送机器人。官方材料里最可复用的基础事实是：公司总部在 Austin, Texas，以 AVRIDE Inc.
              的法律主体对外运营，并将自己定位为自动驾驶车辆和配送机器人的开发者，两类产品共享一套核心自动驾驶技术栈。身份界定很关键，否则后续章节会继承嘈杂的互联网元数据，把技术来源、公司剥离日期和办公地址混在一起。官方页面和合作伙伴公告都把运营基地锚定在
              Austin；隐私政策和 About 页面还给出具体 Mopac 法定地址。与此同时，创立叙事需要留出差异：公司材料称这段旅程始于 2017 年，SEC 文件锁定 2024 年 Yandex 到 Nebius
              的剥离，一些行业或目录来源则写成 2020 年剥离。后续章节的实用结论是：Austin 总部、双产品范围和 Yandex 源流可以作为事实复用；准确的独立创立日期仍是未解决的尽调项，不应把公开冲突抹平。
