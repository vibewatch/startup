      - number: '8.4'
        title: 情景分析与敏感性
        blocks:
          - type: paragraph
            body: >-
              财务披露稀少，估值只能更多转向情景分析，而不是精确定价。悲观情景聚焦一种可能：NHTSA 升级、商业化延误或后续融资疲弱，把 Avride 推向配送业务地板价或受困战略资产结局。基准情景假设 Uber
              主导的铺开继续，当前调查不变成生死问题，Avride 仍有战略融资能力，但仍没有披露足以支撑公开 robotaxi 倍数的收入和利润率画像。乐观情景需要一套质变的证明：安全问题被控制、更广泛的全无人驾驶运营、通过
              Uber 多城部署，以及足够商业证据来缩窄相对上市 robotaxi
              同行的折价。最有用的敏感性不是表格里的利润率微调，而是一组里程碑。安全整改、透明融资条款和可见商业密度都能推动价值重估；渠道依赖未解、经济性不透明、额外监管挫折则会迅速压缩价值。因此，公开证据下的估值区间最好被框定为一条纪律化区间，而不是单点标记；概率加权应用来定义入场纪律，而不是制造虚假确定性。
