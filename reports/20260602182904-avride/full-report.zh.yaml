      - number: '8.5'
        title: 建议、否决触发器和尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确结论既不是热情买入，也不是直接归零，而是在严格投资判断条件下，采取价格敏感的观察或继续研究姿态。Avride
              明确具备战略价值、在市场中的真实产品，以及许多自动驾驶初创公司拿不到的合作伙伴验证。但对估值最关键的证据缺口，恰好都落在投资者通常需要披露的位置：股权结构表、$375 million
              方案的经济结构、产品线收入、单位经济性、烧钱速度、现金跑道、公司间权利，以及正在进行的 NHTSA 调查带来的责任影响。这些缺口意味着，本章只能支持保守区间，并相对公开 robotaxi
              领先者给出明确折价。三个打破投资逻辑的触发器应立即停止承接：安全调查实质恶化；证据显示 Uber 渠道入口在变弱而不是变宽；或后续融资证明 2025 年 10
              月方案不如标题暗示的那样耐久或具股权属性。在这些问题解决前，Avride 应被视为一个战略上有意思、但仍缺流动性且披露稀薄的资产；下行保护与标题上行同等重要。
