    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 可供投委会使用的估值指标，概括 Avride 已披露的融资信号、同业锚点和风险姿态。
    data:
      items:
        - label: 已确认战略方案
          value: $375M
          unit: USD
          detail: Uber 和 Nebius 的投资及承诺最高 $375M
        - label: 公司确认投后估值
