        blocks:
          - type: paragraph
            body: >-
              公开资料中最清楚的财务锚点，是 2025 年 10 月披露的 Uber 和 Nebius 最高 $375 million 战略投资及其他承诺。Avride 称这笔资本将资助车队增长、AI
              产品开发和地域扩张；方向上有帮助，但距离完整现金跑道披露还很远，因为提款节奏、分期条件和账上现金仍是私有信息。公开规模代理让这种模糊性更重要。NHTSA 2026 年 5 月调查列出估计 200 辆 Avride
              车辆；Reuters 转发报道称每月还在增加数十辆。Hyundai 行业报道则称 Avride 计划在 2025 年扩至最多 100 辆 IONIQ 5 Robotaxi，并先在 Hyundai 位于
              Georgia 的 Metaplant 组装，再集成自动驾驶能力。Uber 自己的 2026 年自动驾驶栈还加入融资、保险、场站工具、监管支持和远程运营，这些能力降低了 Avride
              的运营负担，也加深了它对单一商业化伙伴的依赖。一个行业参照强化了谨慎口径：Lucid、Nuro 和 Uber 披露了超过 20,000 辆车的 Robotaxi
              计划和数亿美元投资，说明即便资本更充足的项目，规模化 AV 部署也会非常昂贵。在上述背景下，Avride 的战略背书很重要，但显然不足以消除资本强度风险。
