  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现只透过合作伙伴控制的需求层可见
        blocks:
          - type: paragraph
            body: >-
              Avride 目前的变现主要通过合作伙伴渠道可见，而不是通过 Avride 自己的自助定价可见。公司及伙伴公开确认了两个已经运行的收入界面：通过 Uber Eats 和 Grubhub 履约的人行道配送，以及
              Dallas Uber App 里的 Robotaxi 出行。关键在于，客户关系、下单流程、支付和大部分价格展示都在合作平台手中。公开证据因此支持一个交易驱动模型：Avride
              可能按单次出行和单次配送获得结算或服务费，但无法直接读出实际收入分成。已披露的规模代理有意义：Austin、Dallas 和 Jersey City 覆盖数百家 Uber Eats 餐厅，已完成数十万单配送，与
              Grubhub 完成超过 100,000 次校园配送，并和 Wonder 在 Jersey City 开展校外试点。但收入质量仍不透明。Uber 称 Avride Robotaxi
              相比符合条件的标准出行类别不向乘客收取额外溢价，但乘客端同价并不能揭示 Avride 的抽佣率、补贴负担或贡献利润。商户经济模型也同样不透明，审阅来源没有披露配送费分成、保底或最低量条款。
