  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Avride 有真实商业故事，但还没有干净的投资判断故事。正向逻辑从战略验证开始：Uber 和 Nebius 在 2025 年 10 月承诺最高 $375 million，Uber 于 2025 年 12 月在
              Dallas 与 Avride 启动 robotaxi 乘车服务，公司仍把自己定位为横跨 robotaxi 和配送机器人的双平台运营方。这个组合重要，是因为公开 AV 公司往往只有一种形态，而 Avride
              可以展示一个服务多个用例的单一自动驾驶栈。反向逻辑在于，几乎每一个有利于估值的信号都有结构性限定。Dallas 发布时配备车载专员，而不是全无人驾驶运营；Grubhub
              把市场化机器人配送描述为一个仍需兜底骑手和专门护理流程的实时试点；最可见的商业关系都跑在合作伙伴控制的渠道上。更重要的是，NHTSA 在 16 起碰撞和 1 起所谓轻伤之后启动正式初步评估，直接瞄准 Avride
              的驾驶能力和主动性。因此，公开证据支持“具备战略价值和合作伙伴入口”的投资逻辑，也支持“运营依赖重、安全悬置未解、财务透明度稀薄”的反向逻辑。
