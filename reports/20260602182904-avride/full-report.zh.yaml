          detail: 合作伙伴先检查地理范围、机器人可用性和服务规则，再提供自动驾驶选项。
        - label: 自动履约
          phase: 互动
          detail: Avride 机器人或车辆完成行程或最后一公里环节，合作伙伴继续掌握客户关系。
        - label: 追踪、解锁和收取
          phase: 互动
          detail: 用户追踪机器人或车辆，到达后解锁，并且通常仍在合作伙伴体验中获得人工支持。
        - label: 扩张决策
          phase: 扩张
          detail: 只有当渠道合作伙伴看到足够价值且风险可接受时，才会增加新的商户、校园、街区或城市。
    approximationNotes: 这些阶段综合了 Uber、Grubhub、Wonder、Rakuten 和校园餐饮页面的公开工作流证据；Avride 未披露内部 CRM 漏斗。
    claimRefs:
      - CU004
      - CU007
      - CU016
      - CU021
      - CU023
      - CU025
      - CU029
      - CU030
      - CU043
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 公开部署通常从签下合作伙伴开始，到本地商户或校园激活，再进入终端用户资格判断、履约，以及最终的城市或细分场景扩张。
    data:
      nodes:
        - id: n1
          label: 签下渠道合作伙伴
          detail: Uber、Grubhub、Wonder 或 Rakuten 创建需求入口。
          tone: neutral
        - id: n2
          label: 确定本地覆盖范围
          detail: 选定城市区域、校园地图或社区配送点。
          tone: neutral
        - id: n3
          label: 商户或校园点位开通
          detail: 餐厅、便利店或食堂成为符合条件的来源。
          tone: positive
        - id: n4
          label: 向用户提供自动驾驶选项
          detail: 如果在服务范围内，乘客或食客会看到 AV 或机器人选项。
          tone: positive
        - id: n5
          label: 运营验证积累
          detail: 订单、行程、交接和复用代理指标形成生产使用证据。
          tone: positive
        - id: n6
          label: 扩张或暂停
          detail: 事故或政策审查之后，渠道合作伙伴决定是扩大覆盖地域，还是放慢扩张。
          tone: warning
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
