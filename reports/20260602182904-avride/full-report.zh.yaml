    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 为何对 Avride 重要
    rows:
      - - Robotaxi 网约车
        - 无人驾驶车队完成的按需乘客行程，以及与发布相关的车队运营
        - 不含自动驾驶层的人类驾驶网约车行程
        - 网约车平台、车队运营方、OEM 或自动驾驶合作伙伴
        - 这是 Avride 通过 Uber 主导渠道触达乘客的直接商业化表面。
      - - 人行道配送机器人
        - 由短程自动驾驶机器人处理的熟食、杂货、便利品和小包裹配送
        - 长途包裹网络和非自动化商户配送
        - 商户、配送平台、校园餐饮、杂货或场地运营方
        - 这是进展更快的物流楔子，密集短路线最重要。
      - - 商业化基础设施
        - 需求生成、测绘、支持、保险、融资、远程协助、场地集成和车队工具
        - 通用云支出或无关 SaaS 开销
        - 平台所有者、车队运营方、OEM、自动驾驶开发商
        - Uber 2026 年自动驾驶方案显示，这些层属于可服务市场的一部分，而不只是运营费用。
      - - 传统配送 GMV
        - 没有，除非自动驾驶挂钩抽成率可见
        - 完全由人力完成的一般餐饮或零售配送支出
        - 餐厅或配送平台
        - 把全部餐饮配送 GMV 当作 TAM，会夸大 Avride 的直接机会。
      - - 通用车辆或 EV 销售
        - 仅限自动驾驶专属车辆集成价值
        - 与 AV 服务发布无关的独立 EV/OEM 销售
