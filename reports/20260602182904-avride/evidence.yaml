evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and any governance rights granted to Nebius or Uber.
    whyItMatters: >-
      Chapter 1 is supposed to establish reusable governance ground truth, but public sources do not name directors or
      board observers.
    diligencePath: >-
      Request the current board list, observer list, and governance matrix from counsel or the data room; confirm
      whether Uber or Nebius hold special rights.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      The exact standalone incorporation date and the company's preferred treatment of 2017 origin versus 2020 spin-off
      versus 2024 relaunch.
    whyItMatters: Founding date anchors stage, tenure, and milestone analysis; public sources use three different starting points.
    diligencePath: >-
      Obtain the certificate of incorporation, conversion or rename documents, and management guidance on which date
      should be treated as canonical in investor materials.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A current company-wide employee count and office list reconciled against official engineering claims and directory
      estimates.
    whyItMatters: >-
      Headcount is a core scale metric and the current public record ranges from 200-plus engineers to 352 total
      employees with conflicting location metadata.
    diligencePath: >-
      Ask finance or HR for the latest employee count by function and office, plus the reporting date used in any public
      profile or recruiting statement.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: A cap table, financing documents, any valuation memo, and disclosure of debt, credit, or secondary transactions.
    whyItMatters: >-
      The chapter can only support the disclosed $375M commitments; it cannot verify valuation, ownership dilution, or
      secondary liquidity from public evidence alone.
    diligencePath: >-
      Request the financing term sheet, cap table snapshot, any fairness/valuation materials, and a written confirmation
      of whether secondaries or debt facilities exist.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO021
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Internal product releases, customer wins, and governance decisions that are not reflected in the public
      chronology.
    whyItMatters: >-
      The milestone table is usable as the external chronology of record, but it does not fully represent internal
      development or board milestones.
    diligencePath: >-
      Reconcile the public timeline against an internal company timeline or board deck before using milestone sequencing
      in later diligence chapters.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: avride-som-disclosure
    missingEvidence: >-
      City-level paid rides, order counts, take rates, unit economics, and cohort retention for Avride's current
      robotaxi and delivery-robot channels.
    whyItMatters: >-
      Without operating KPIs, public evidence can show launch footprint but cannot show market share, payback period, or
      whether the dual strategy is already monetizing efficiently.
    diligencePath: >-
      Request a board or management dashboard covering Dallas rides, Uber Eats order volume, intervention rates, gross
      margin by trip type, and merchant or campus cohort performance.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing-boundaries
    missingEvidence: >-
      A management-approved mapping from Avride's internal segment taxonomy to third-party robotaxi, autonomous
      last-mile, and delivery-robot market definitions.
    whyItMatters: >-
      Published TAMs vary widely because the market boundaries differ, which can materially distort valuation narratives
      if one number is treated as canonical.
    diligencePath: >-
      Ask management to map which external reports best fit passenger autonomy revenue, delivery-service revenue, and
      commercialization-service revenue, with explicit inclusions and exclusions.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: route-level-buyer-economics
    missingEvidence: >-
      Public route-density thresholds, merchant basket-size economics, and venue-by-venue utilization requirements for
      delivery robots and robotaxis.
    whyItMatters: >-
      The market clearly exists, but launchability depends on dense corridors and route mix; without threshold data,
      external investors can overestimate how fast new geographies become viable.
    diligencePath: >-
      Request launch criteria by route type, minimum orders per hour, average miles per vehicle or robot, and the share
      of trips needing human intervention.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Actual per-mile, per-order, or revenue-share pricing for Avride, Waymo, Motional, Nuro, Waabi, Serve, and Starship
      enterprise contracts.
    whyItMatters: Public price opacity makes it hard to tell whether Avride wins on economics or only on product architecture.
    diligencePath: >-
      Request partner contracts, pricing sheets, or management commentary that quantifies take rates, minimum
      commitments, and fleet economics.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: uber-dispatch-priority
    missingEvidence: Partner-specific dispatch priority, economics, and exclusivity terms inside Uber's autonomous marketplace.
    whyItMatters: >-
      Uber dependence is the chapter's main moat risk, but public sources do not reveal whether Avride has any preferred
      economics or operational priority.
    diligencePath: Ask for the Uber master agreement, KPI scorecards, and any exclusivity, MFN, or dispatch-preference clauses.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: avride-volume-disclosure
    missingEvidence: >-
      Current paid ride volume, paid delivery volume, city-level utilization, and active merchant or fleet counts for
      Avride.
    whyItMatters: >-
      Without Avride's own operating metrics, the company looks smaller than delivery specialists and harder to
      benchmark against robotaxi leaders.
    diligencePath: >-
      Request monthly paid trips, paid orders, active robots or vehicles, active merchants, and cohort retention by
      city.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Monthly revenue by product line, city, and partner plus any recurring contracted minimums.
    whyItMatters: >-
      Without topline and contract structure, the chapter cannot distinguish real monetization from subsidized launch
      activity.
    diligencePath: Request monthly revenue bridge, partner settlement reports, and signed commercial agreements for Uber and Grubhub.
    relatedQuestionRefs:
      - QI015
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Cash balance, monthly burn, expected draw schedule on the $375 million commitment, and board-approved operating
      plan.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from a commitment headline alone because runway depends on both cash
      already received and current burn.
    diligencePath: Request latest balance sheet, 12-month cash forecast, and financing-tranche mechanics from management.
    relatedQuestionRefs:
      - QI014
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-terms
    missingEvidence: Uber and Grubhub settlement schedules, take rates, subsidies, service-level penalties, and refund economics.
    whyItMatters: >-
      Customer-facing price visibility is not enough to determine whether each trip or order is economically attractive
      to Avride.
    diligencePath: Obtain partner term sheets and recent settlement statements for one ride-hail city and one delivery city.
    relatedQuestionRefs:
      - QI008
      - QI009
      - QI025
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Per-order robot utilization, operator labor cost, depot cost, maintenance cost, battery replacement assumptions,
      and city-level contribution margin.
    whyItMatters: >-
      The current public record proves activity and hardware intensity but cannot show whether scale improves margins or
      merely increases cash consumption.
    diligencePath: Request cohort unit-economics model by city and product line plus actual trailing three-month operating data.
    relatedQuestionRefs:
      - QI017
      - QI025
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap table, investor rights, tranche conditions, intercompany loans, and any secured or leased vehicle financing.
    whyItMatters: >-
      Strategic backing can be helpful or restrictive depending on control terms, senior claims, and future dilution
      mechanics.
    diligencePath: >-
      Request cap table, financing documents, board approvals, and any intercompany funding agreements with Nebius or
      affiliates.
    relatedQuestionRefs:
      - QI013
      - QI024
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: minor
    topic: valuation-support
    missingEvidence: Last preferred price, 409A, investor marks, and any internal mark-to-market used by strategic backers.
    whyItMatters: >-
      Open public sources signal a late-stage company but do not supply a valuation range robust enough for pricing an
      investment.
    diligencePath: Request the last financing memo, current cap table, and most recent internal valuation materials.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: safety-case
    missingEvidence: >-
      Publicly auditable safety-case artifacts for Avride robotaxis, including ODD boundaries, disengagement and
      intervention rates, scenario counts, simulation volume, and third-party safety review outputs.
    whyItMatters: >-
      The Dallas launch and Hyundai tie-up show commercialization progress, but the NHTSA probe shows that public
      marketing and launch evidence are not enough to underwrite real deployment safety.
    diligencePath: >-
      Request Avride’s latest safety case, monthly disengagement and remote-assistance metrics, scenario-library
      coverage, and any independent assessor or insurer review for the Dallas fleet.
    relatedQuestionRefs:
      - QE019
      - QE023
      - QE025
  - type: private-evidence-only
    severity: material
    topic: service-economics
    missingEvidence: >-
      Operational metrics such as cost per delivery, cost per ride, fleet uptime, intervention rate, teleoperations
      load, and support staffing ratios by market.
    whyItMatters: >-
      Without economics and reliability data, it is impossible to determine whether Avride’s current delivery and
      robotaxi deployments are scalable businesses or still subsidized technical pilots.
    diligencePath: >-
      Ask for route-level uptime, vehicle utilization, human-ops hours per trip, margin waterfall, and SLA or support
      reports for Uber and Grubhub programs.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent benchmark studies, certification records, or insurer or regulator validation results specific to
      Avride’s live robotaxi stack rather than generic AV frameworks.
    whyItMatters: >-
      Public sources show NHTSA’s methods and Avride’s own claims, but they do not show whether Avride has independently
      cleared a buyer-grade benchmark for safety, robustness, or service readiness.
    diligencePath: >-
      Request third-party audit reports, insurer underwriting memos, independent test-track results, or OEM validation
      documents tied to the IONIQ 5 robotaxi program.
    relatedQuestionRefs:
      - QE019
      - QE025
  - type: missing-source
    severity: minor
    topic: manufacturing-footprint
    missingEvidence: >-
