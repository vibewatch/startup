    {
      "id": "delivery-platform-operations-and-manufacturing",
      "title": "Delivery platform operations and manufacturing: the most tangible proof in the source set",
      "body": "The delivery robot platform is where Avride’s public evidence is most operationally concrete. The robot page includes tangible specs, from a 50 km range and IP66 water resistance to crosswalk handling, privacy blurring, and remote support escalation. Grubhub’s product and launch posts add the commercial workflow around that hardware. They show robot delivery as a first-class checkout option, real-time eligibility and fallback logic, live telemetry in the consumer app, secure app unlock for the diner, tablets for merchant loading, and dedicated customer-care handling for autonomous edge cases. Those details are more useful for diligence than raw marketing adjectives because they demonstrate how autonomy fits into a working transaction flow.\n\nManufacturing evidence is also stronger here than in the robotaxi line. Avride’s April 2026 manufacturing post walks through a repeatable assembly process with two lines, verified subassemblies, dedicated test benches, motion and thermal testing, shaker and water-ingress tests, and final quality inspection. The post still reflects company-claimed evidence, but it is concrete enough to show Avride is thinking about production engineering rather than only prototype robotics. Combined with partner claims of more than 100 campus robots and more than 100,000 completed campus deliveries, the delivery platform appears materially past the lab stage.\n\nThat does not mean every diligence question is closed. Public sources still do not disclose route-level uptime, intervention rates, or unit economics, and supplier concentration is only lightly described. But compared with the robotaxi stack, the delivery platform has more visible product instrumentation, more visible operating workflow, and more visible factory-readiness evidence.",
