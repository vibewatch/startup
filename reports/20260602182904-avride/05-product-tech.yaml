    {
      "id": "shared-stack-and-hardware",
      "title": "Shared autonomy stack and hardware strategy: unusually specific for marketing, still selective for diligence",
      "body": "Avride’s public robotaxi materials are more detailed than a typical startup landing page. The company discloses a layered software and hardware narrative: lidar-based localization on continuously updated 3D maps, a fused perception stack, learned prediction, and route planning that optimizes for both safety and comfort. On the vehicle side, Avride publicly names five lidars, four radars, and thirteen cameras, plus proprietary lidar and camera hardware and explicit sensor-cleaning logic for precipitation and fog. That level of specificity gives diligence teams something concrete to test, even if the company still controls the narrative.\n\nThe strongest third-party technical corroboration in the retained set comes from Ampere’s compute case study. It says Avride’s main compute unit coordinates perception, planning, localization, vehicle control, and health monitoring, and that the company selected Ampere CPUs with ADLINK boards to stay within strict thermal and power envelopes without redesigning vehicle hardware. This matters because it turns the stack from generic AI marketing into a real embedded-systems tradeoff story. The disclosed architecture also lines up with Avride’s public emphasis on operating in hot Texas conditions and scaling capability without reopening core vehicle packaging each time new features are added.\n\nEven with that detail, the public stack is still selective. The company describes what modules exist, but it does not publish system-level latency budgets, intervention thresholds, fallback policies, or quantitative error rates for perception, prediction, or planning. Public evidence therefore supports that Avride has a coherent autonomy architecture and a deliberate hardware strategy; it does not yet prove how robust that stack is relative to best-in-class operators under adverse real-world conditions.",
