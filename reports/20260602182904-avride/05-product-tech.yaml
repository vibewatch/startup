    "title": "Product & Technology",
    "summary": "Avride’s product story is strongest where the company can show one autonomy lineage spanning robotaxis and delivery robots, concrete delivery workflows with Uber and Grubhub, and increasingly repeatable manufacturing processes. The chapter’s main constraint is that commercialization proof is now ahead of public validation proof: the Hyundai IONIQ 5 tie-up and Dallas launch are real, but the live NHTSA probe and thin independent safety disclosures keep key technical diligence items private."
