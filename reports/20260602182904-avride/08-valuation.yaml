    {
      "id": "val-scenarios",
      "title": "Scenario Analysis and Sensitivity",
      "body": "Sparse financial disclosure forces valuation toward scenario analysis rather than precision pricing. The bear case centers on the possibility that NHTSA escalation, commercialization delays, or weak follow-on financing push Avride toward a delivery-floor or distressed-strategic outcome. The base case assumes Uber-led rollouts continue, the current probe does not become existential, and Avride remains strategically financeable, but still without the kind of disclosed revenue and margin profile that would justify public-robotaxi multiples. The bull case requires a qualitatively different proof set: safety issues contained, broader fully driverless operations, multi-city deployment through Uber, and enough commercial evidence to narrow the discount to listed robotaxi peers. The most useful sensitivity is not a spreadsheet margin tweak but a milestone stack. Safety remediation, transparent financing terms, and visible commercial density can all re-rate value; unresolved channel dependence, opaque economics, and additional regulatory setbacks can compress it quickly. For that reason, the public-evidence range is best framed as a disciplined band rather than a single mark, with probability weighting used to define entry discipline rather than false certainty.",
