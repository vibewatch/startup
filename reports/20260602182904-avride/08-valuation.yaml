    {
      "id": "val-comparables",
      "title": "Comparable Benchmarks and 2026 Market Conditions",
      "body": "The peer set shows both how much capital is available for autonomy and how sharply the market now discounts operational uncertainty. On the delivery side, Serve Robotics trades at roughly $0.77 billion while already disclosing tens of thousands of deliveries and a signed plan to deploy up to 2,000 robots on Uber Eats. On the robotaxi side, WeRide and Pony AI trade around $2.6 billion and $4.7 billion respectively, while Wayve disclosed an $8.6 billion post-money valuation in its February 2026 Series D and Nuro raised at a $6 billion valuation in 2025 after being valued at $8.6 billion in 2021. Aurora's much higher market cap shows what public investors will still pay for a listed autonomy platform, but its trucking-heavy exposure makes it a ceiling-like reference rather than a direct urban AV analogue. The adverse market read-through is equally important. CNBC reports GM spent more than $10 billion building Cruise before shutting the robotaxi business, while Reuters shows Nuro raising new money at a lower valuation than its 2021 mark. Taken together, 2026 market conditions reward scaled disclosure and punish expensive autonomy stories that still lack proven commercial efficiency.",
