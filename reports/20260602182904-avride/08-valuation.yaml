    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence supports Avride as a strategically backed but still thinly disclosed autonomy platform whose only company-confirmed financing anchor is up to $375 million of investments and commitments from Uber and Nebius. Relative to robotaxi and delivery-robot peers, the most defensible public-evidence valuation range is roughly $0.3 billion to $4.0 billion across bear-to-bull cases, with a probability-weighted center around $1.3 billion to $1.6 billion and a recommendation to track only at protected sub-premium entry levels until cap-table, revenue, and governance gaps are closed."
  },
  "sections": [
    {
      "id": "val-thesis",
      "title": "Investment Thesis and Anti-Thesis",
      "body": "Avride has a real commercial story, but not yet a clean underwriting story. The positive case starts with strategic validation: Uber and Nebius committed up to $375 million in October 2025, Uber launched robotaxi rides with Avride in Dallas in December 2025, and the company still presents itself as a dual-platform operator spanning both robotaxis and delivery robots. That combination matters because public AV companies often have only one modality, while Avride can present a single autonomy stack serving multiple use cases. The anti-thesis is that nearly every valuation-positive signal remains structurally qualified. Dallas launched with an onboard specialist instead of fully driverless operations, Grubhub describes marketplace robot delivery as a live pilot requiring fallback couriers and dedicated care flows, and the most visible commercial relationships all run through partner-controlled channels. More importantly, NHTSA opened a formal preliminary evaluation after 16 crashes and one alleged minor injury, directly targeting Avride's driving competence and assertiveness. Public evidence therefore supports a thesis of strategic relevance and partner access, but it also supports an anti-thesis of heavy operating dependence, unresolved safety overhang, and sparse financial transparency.",
