coverageNotes: >-
  This report reflects publicly available information as of 2026-06-02. Avride is a private
  company with real commercial deployment in robotaxis and delivery, but retained public sources
  do not cleanly disclose revenue, ARR, gross margin, burn, runway, total customer count, exact
  headcount, lifetime capital raised, cap-table terms, or a company-confirmed post-money
  valuation. The strongest public anchors are the October 2025 up-to-$375 million Uber/Nebius
  package, the December 2025 Dallas Uber robotaxi launch, live delivery programs through Uber
  Eats, Grubhub/Wonder, and Rakuten, and the May 2026 NHTSA probe after 16 crashes and one minor
  injury. Valuation framing is therefore scenario-based and should be verified against management,
  regulatory, and transaction documents.
