summary:
  headline: >-
    Avride is strategically relevant and commercially live across robotaxis and delivery robots,
    but the active NHTSA probe, partner concentration, and sparse financial disclosure support only
    a cautious track posture and a discount to headline unicorn narratives.
  overallScore: 5.9
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
