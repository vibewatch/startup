companyProfile:
  summary: >-
    Avride is an Austin-based autonomous mobility company developing one autonomy stack across
    robotaxis and delivery robots. Public evidence shows live commercialization through Uber
    robotaxi rides in Dallas and delivery deployments with Uber Eats, Grubhub/Wonder, and
    Rakuten, plus strategic backing from Uber and Nebius and Hyundai as a vehicle-supply partner.
    The same record shows opaque standalone governance and economics, no company-confirmed
    valuation, and a material safety overhang from the May 2026 NHTSA probe.
  headquarters: Austin, TX, USA
  productSummary: >-
    Avride sells autonomous mobility capability in two forms: Hyundai IONIQ 5 robotaxis operated
    through Uber and sidewalk delivery robots integrated into marketplace and campus workflows.
    Both products are presented as sharing a common autonomy lineage, while the delivery side has
    the strongest public manufacturing and workflow evidence.
  customerFocus: >-
    End users are ride-hail riders and delivery diners, but the real buying and operating surfaces
    are partner platforms and operators such as Uber, Uber Eats, Grubhub, Wonder, Rakuten,
    campuses, and participating merchants.
  businessModel: >-
    Partner-led transaction revenue model: Avride supplies autonomy, fleet, and operating
    capability while booking, payments, support, and much of customer ownership remain with Uber,
    Grubhub/Wonder, Rakuten, and related channel partners. Public sources do not disclose take
    rates or unit economics.
  stage: Venture-backed commercial launch
  fundingStatus: >-
    Last major public financing signal was the October 2025 disclosure of up to $375 million of
    strategic investments and commercial commitments from Uber and Nebius to fund fleet growth,
    AI product development, and geographic expansion. Public sources do not disclose the split
    between equity and other commitments or any company-confirmed post-money valuation.
