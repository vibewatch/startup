    {
      "id": "unit-economics-and-cost-structure",
      "title": "Public unit-economics clues point to high hardware and support intensity",
      "body": "What the public record lacks in reported margin metrics, it partly replaces with cost-structure clues. Avride's own product pages describe a delivery robot that is designed for fast deployment and cost-effective deliveries, but they also show the physical and operating constraints behind that promise: a 12-hour battery window, 50-kilometer range, 25-kilogram payload, and factory-built hardware. On the robotaxi side, the disclosed stack is more capital intensive still, with five lidars, four radars, thirteen cameras, and server-grade onboard compute. The same pattern appears in Avride's infrastructure disclosures. ClickHouse describes thousands of data points per minute per vehicle and says Avride previously faced petabyte-scale duplication costs as fleet data volumes rose, implying that autonomy economics are shaped not just by vehicles and sensors but also by cloud storage, simulation, telemetry, and engineering tooling. Near-term passenger margins likely remain especially weak because Dallas launch operations still involved an onboard specialist or safety operator, so the public fare signal should not be mistaken for a driverless steady state. In other words, Avride has enough proof to show real commerce, but not enough to prove attractive unit economics.",
