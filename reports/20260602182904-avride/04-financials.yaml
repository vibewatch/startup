    {
      "id": "verdict-and-diligence-blockers",
      "title": "Verdict: credible operating traction, but revenue quality and runway remain un-underwritable",
      "body": "The public evidence supports a simple but important financial conclusion. Avride is no longer a pure lab project: it has live passenger rides, paid delivery activity, strategic capital, manufacturing support, and public fleet growth signals. But none of those items solve the underwriting problem on their own. No reviewed official source discloses revenue, ARR, gross margin, burn, runway, customer concentration, or debt obligations. Public pricing evidence is limited to customer-facing signals, not Avride's net economics. Even the best outside estimates stop at broad stage or headcount labels, while open public valuation support remains absent. That leaves multiple adverse lenses in place at once: capital intensity from hardware-heavy vehicles and robot fleets, margin drag from safety operators and field support, dependence on Uber and Nebius for both capital and commercialization, and regulatory risk from an active NHTSA probe. Investors should therefore treat current scale metrics as proof of commercial relevance, not proof of attractive economics. The next diligence step is not another market narrative but a data-room package that shows settlements, utilization, margins, cash balances, and financing terms by product line.",
