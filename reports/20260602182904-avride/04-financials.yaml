  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Avride's public financial story is real but narrow: Uber and Nebius disclosed up to $375 million of strategic investment and commitments, live robotaxi and delivery activity is visible through Uber and Grubhub, and hardware-heavy fleet expansion is under way with Hyundai supply support. The same record leaves revenue, take rates, gross margin, burn, runway, debt, and valuation effectively undisclosed, so the chapter's verdict is that Avride should be underwritten as a capital-intensive, partner-dependent autonomy operator rather than as a transparently monetized software business."
  },
  "sections": [
    {
      "id": "monetization-and-demand-capture",
      "title": "Monetization is visible only through partner-controlled demand layers",
      "body": "Avride's current monetization is visible mainly through partner channels rather than through self-serve Avride pricing. The company and its partners publicly confirm two live revenue surfaces: sidewalk delivery fulfilled through Uber Eats and Grubhub, and robotaxi rides sold through the Uber app in Dallas. That matters because the customer relationship, booking flow, payments, and most price presentation sit with partner marketplaces. Public evidence therefore supports a transaction-driven model in which Avride likely earns per-ride and per-delivery settlements or service fees, but it does not support a direct read on realized revenue share. The disclosed scale proxies are meaningful: hundreds of restaurants on Uber Eats across Austin, Dallas, and Jersey City, hundreds of thousands of completed delivery orders, more than 100,000 campus deliveries with Grubhub, and an off-campus Jersey City pilot with Wonder. Yet the quality of that topline remains opaque. Uber says Avride robotaxi rides cost riders no extra premium relative to standard eligible ride classes, but equal rider pricing does not reveal Avride's take rate, subsidy burden, or contribution margin. The same opacity applies to merchant economics, where no reviewed source discloses delivery-fee sharing, guarantees, or minimum-volume terms.",
