    {
      "id": "landscape-and-substitutes",
      "title": "Landscape: direct peers, adjacents, and substitutes",
      "body": "Avride's competitive set is wider than a simple robotaxi list. The company is publicly selling two autonomy products at once: a passenger-driving stack and a sidewalk delivery robot, so the direct field spans both robotaxis and autonomous last-mile robots. In robotaxis, the most relevant direct peer remains Waymo because it already operates commercial services at much larger public scale, while Zoox and Motional matter as partnership-led or purpose-built alternatives competing for the same passenger trip. In delivery, Serve, Starship, and Robot.com are the clearest direct operational comps because they already disclose larger fleets, deliveries, or campus footprints than Avride does publicly. The adjacent field is also important. Nuro and Waabi are no longer safely outside the frame because both now market generalizable autonomy stacks that can plug into Uber-linked robotaxi plans, while Cartken shows how a delivery player can redeploy its stack into industrial settings and still preserve last-mile optionality. The substitute set is the status quo itself: human ride-hail and human courier networks, plus internal build for the biggest platforms and fleet operators. That makes this chapter less about one head-to-head rival and more about who controls demand, trust, and deployment economics across several autonomy surfaces.",
