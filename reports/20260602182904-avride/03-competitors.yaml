    "number": 3,
    "title": "Competitors",
    "summary": "Avride faces a split competitive field in which Waymo already leads commercial robotaxis, Serve and Starship lead disclosed delivery-robot scale, and adjacent stack providers like Nuro and Waabi are now converging on the same Uber-centered commercialization layer. Avride's clearest differentiation is one autonomy stack across passenger mobility and sidewalk delivery, but that edge is constrained by Uber platform dependence, live regulatory scrutiny, and better-capitalized or more scaled rivals."
