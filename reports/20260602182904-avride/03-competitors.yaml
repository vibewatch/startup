    {
      "id": "delivery-robot-competition",
      "title": "Delivery robots: specialists already disclose stronger scale than Avride",
      "body": "Avride's second front is sidewalk delivery, and here the competitive picture is shaped by specialists that already show bigger public operating numbers. Serve's disclosed U.S. fleet and NVIDIA-backed operating metrics make it the sharpest domestic overlap case: it scales on Uber Eats, serves thousands of restaurants, and frames autonomy as better unit economics for dense short-distance logistics. Starship is the broader global benchmark. Its public footprint now spans more than 300 locations, more than 3,000 robots, and more than 10 million deliveries, with campuses, grocery, delivery-app integrations, and industrial use cases all visible. Robot.com, the company formerly known as Kiwibot, is smaller than Starship but still material because it claims more than 1.7 million completed tasks, 500-plus robots, and deep campus and enterprise ties through operators such as Sodexo. Cartken has partly stepped away from consumer last-mile expansion toward industrial workflows, but that should not be mistaken for permanent exit; its own press and TechCrunch reporting show that the same underlying navigation stack can still move between food delivery, campus routes, and onsite material flows. Relative to this field, Avride's delivery case is differentiated by shared autonomy learning with robotaxis, but disadvantaged by thinner publicly disclosed delivery volumes than the leaders already publish.",
