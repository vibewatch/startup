    {
      "id": "mitigations-monitoring-and-diligence-paths",
      "title": "Mitigation exists, but the chapter still needs a hard-document diligence package before risk can be considered underwritten",
      "body": "The good news is that Avride is not operating without any mitigation surface. Uber describes safety guidelines, customer support, remote assistance, field support, insurance, and fleet-operations tooling. Avride describes testing discipline, privacy controls, and manufacturing QA. Texas also provides a formal administrative process rather than an arbitrary black-box shutdown path. But those mitigants mostly either come from partners or from company-controlled disclosures. They do not eliminate the need for a hard-document diligence package. The first workstream should focus on PE26003 and Texas continuity: the full SGO incident set, miles and interventions before and after any remediation, TxDMV authorization status, the responder plan filed with DPS, insurance structure, and any discussions with regulators since the probe opened.\n\nThe second workstream should focus on whether Avride is becoming a diversified autonomy company or remains a partner-dependent supplier. That requires direct customer concentration, revenue-share and contract terms, board and governance materials, organizational ownership of safety and compliance, and unit economics by major line of business. Until those materials are produced, the right split is clear. Active risks are PE26003, Texas authorization continuity, Uber concentration, and hardware-heavy scaling without public economics. Historical or scenario risks are Yandex-lineage perception, city-by-city permitting backlash outside current strongholds, and competitive displacement if larger networks keep moving faster. Those distinctions matter because only the active set should drive immediate kill criteria, while the historical and scenario set should drive diligence depth and risk pricing.",
