    {
      "id": "commercialization-capital-and-platform-risk",
      "title": "Commercialization risk is partner-led and hardware-heavy, which raises concentration and capital-intensity exposure",
      "body": "Avride's commercial surface is real, but it is still intermediated by a small set of powerful partners. Uber is the clearest dependency because Uber's own Autonomous Solutions materials describe a stack that spans demand generation, rider experience, customer support, mapping, regulatory support, insurance, financing, and fleet operations. In other words, Uber is not merely a demand marketplace; it is increasingly the commercialization layer. Avride's public passenger service is on Uber only, and the Dallas launch still started with onboard specialists rather than an already-proven fully driverless service. On delivery, Uber Eats remains the broadest public channel, while Grubhub and Wonder remain in pilot-mode outside campuses and Rakuten remains a single operator-managed Japan program even after expansion.\n\nThe cost side is equally important. Avride's own manufacturing materials point to almost 1,000 robots built on one line, more than 1,500 components per robot, specialized external vendors, and a stated production capacity of up to 100 robots per month. The Hyundai relationship adds a vehicle-fleet scaling layer on top of robot manufacturing, with Avride targeting up to 100 autonomous IONIQ 5s in 2025 and relying on third-party vehicle production and integration. Nebius and Uber's up-to-$375 million backing confirms that scale requires more than software. It requires funded hardware, fleet, service, and rollout capacity. Yet the reviewed public record still does not disclose unit economics, platform revenue shares, gross margins, or customer-renewal metrics. That leaves investors with real commercialization proof but a still-opaque model for economic durability.",
