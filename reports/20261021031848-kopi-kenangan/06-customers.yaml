      basis: Three named Android reviews displayed on the assigned AppBrain source page.
    claimRefs: [CU001, CU007, CU012, CU013]
figures:
  - id: FU001
    title: App-to-outlet customer engagement loop
    type: journey-map
    summary: >-
      The observable journey links digital acquisition, ordering, physical fulfillment,
      rewards, and localized expansion, while retention remains unmeasured.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: Find the brand through outlets, app-store distribution, or promotions.
          touchpoints: [Outlets, App store, Digital marketing]
          value: 7.4 million tracked Android installs
          note: Cumulative installs are not active customers.
        - id: acquire
          label: Acquire
          detail: Enter the digital ecosystem as a newly acquired customer.
          touchpoints: [App registration, Offer, First order]
          value: 4.47 million reported new customers in 2025
          note: Deduplication and acquisition cost are undisclosed.
        - id: order
          label: Order
          detail: Select pickup or delivery and transact by cellphone or at an outlet.
          touchpoints: [Mobile order, Pickup, Delivery, Cashless payment]
          value: 70 percent of orders reportedly placed by cellphone
          note: Owned-app and third-party aggregator shares are not separated.
        - id: fulfill
          label: Fulfill
          detail: Serve the order through the growing physical network.
          touchpoints: [Barista, Pickup area, Delivery handoff]
          value: 1,324 outlets at end-2025
          note: Mature-store throughput and customer counts are undisclosed.
        - id: reward
          label: Reward
          detail: Use points, vouchers, and membership levels to encourage another order.
          touchpoints: [Points, Vouchers, Membership]
          value: Five membership levels described in the app listing
          note: Redemption economics and tier migration are undisclosed.
        - id: localize-and-return
          label: Localize and return
          detail: Adapt flavors, recipes, and prices to local demand before the next visit.
          touchpoints: [Localized menu, Personalized offer, Repeat visit]
          value: Six-country footprint at end-2025
          note: No public cohort retention or repeat-purchase rate validates the return step.
    approximationNotes: >-
      Ordered qualitative journey; values retain their original periods and denominators
      and are not a conversion funnel.
    claimRefs: [CU001, CU003, CU005, CU007, CU009, CU010, CU015]
callouts:
  - calloutType: risk
    title: Reach is not retention
    body: >-
      Installs, new-customer additions, mobile-order share, and outlet growth show
      acquisition and access, but none supplies a cohort retention rate or customer
      concentration measure.
    claimRefs: [CU003, CU004, CU007, CU009, CU016]
