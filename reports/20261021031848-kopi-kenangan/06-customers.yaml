        - Expansion beyond Indonesia through local adaptation
        - Country cohorts, customer acquisition cost, and repeat rates
    notes: >-
      Scale indicators use different periods and denominators; null or undisclosed
      segment economics must not be inferred from app users, installs, or outlet counts.
    claimRefs: [CU001, CU002, CU004, CU005, CU010, CU012]
