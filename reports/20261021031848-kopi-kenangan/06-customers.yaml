        - Immediate coffee and food purchase
        - 1,324 reported outlets across six countries at end-2025
        - Dense convenience footprint and brand availability
        - Transactions, frequency, and economics per mature outlet
      - - Loyalty and subscription users
        - Individual consumer in all three roles
        - Points, vouchers, membership benefits, and repeat ordering
        - Five membership levels described in the app listing; member count undisclosed
        - Potential frequency and direct-marketing lever
        - Tier population, redemption cost, retention uplift, and subscription economics
      - - Localized international consumers
