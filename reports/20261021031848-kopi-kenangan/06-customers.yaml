company:
  name: Kopi Kenangan
chapter:
  number: 6
  title: Customers
  summary: >-
    Kopi Kenangan has meaningful consumer reach through a large physical network and a
    digitally engaged audience, including 1.5 million monthly transacting digital users
    reported for December 2025 and 7.4 million tracked Android installs by October 2026.
    The evidence supports acquisition and channel adoption, but not cohort retention,
    owned-versus-aggregator mix, customer concentration, or loyalty-program economics.
sections:
  - id: customer-segments-and-purchase-routes
    title: Consumer segments and purchase routes
    body: >-
      Kopi Kenangan is a consumer retail business rather than an enterprise account
      model: the end user, buyer, and payer are generally the same individual, while
      ordering can occur through the company app, at an outlet, or through an
      unspecified delivery route. The branded site describes pickup and delivery,
      points, vouchers, and priority access, while Tracxn characterizes the company as
      a limited-service restaurant chain selling coffee and adjacent food. This creates
      several observable behavioral segments—app-led repeat buyers, grab-and-go
      customers, loyalty members, and locally adapted international consumers—but the
      public evidence does not disclose revenue or gross profit by segment.
    claimRefs: [CU001, CU002, CU012]
    tableRefs: [TU001]
  - id: adoption-and-reach
    title: Adoption trajectory and reach
    body: >-
      Reported customer acquisition accelerated in 2025: IDN Financials, citing
      unaudited financial documents, said the digital ecosystem added 4.47 million new
      customers and reached 1.5 million monthly transacting digital users in December
      2025, up 116 percent. AppBrain separately tracked 7.4 million cumulative Android
      installs and a 4.87 Google Play rating from 210,423 ratings as of the October 2026
      page update. These measures are not interchangeable: installs are cumulative
      device events, monthly transacting users indicate active commerce, and new
      customers lack a disclosed deduplication or repeat-purchase denominator.
    claimRefs: [CU003, CU004, CU007, CU008]
    tableRefs: [TU002]
  - id: customer-proof-and-durability
    title: Customer proof and durability
    body: >-
      Public proof is strongest at the aggregate app and outlet level, not at the
      retention-cohort level. AppBrain shows both positive and negative named review
      examples: one reviewer praised price, taste, and a subscription, while another
      objected to repeated in-app pop-ups. These anecdotes establish real user
      interaction but are not a representative satisfaction sample and do not establish
      repeat purchase. No assigned source discloses net or gross revenue retention,
      churn, renewal, purchase frequency, customer-acquisition cost, loyalty-tier
      migration, or cohort contribution margin. Durability therefore remains a material
      diligence gap despite strong top-of-funnel indicators.
    claimRefs: [CU007, CU008, CU012, CU013]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion loops and concentration risk
    body: >-
      Physical availability and mobile ordering reinforce one another: management said
      70 percent of orders were placed by cellphone, while two publications reported
      1,324 outlets at the end of 2025, up from 977 a year earlier. Indonesia still
      represented 1,136 of those outlets, and Malaysia about 158, showing that geographic
      reach does not eliminate home-market concentration. Management also attributes
      growth to adapting flavors, recipes, and prices by market. The strategy is
      plausible as a localization loop, but public evidence does not separate organic
      repeat demand from store openings, promotions, aggregator traffic, or licensed
      expansion.
    claimRefs: [CU005, CU006, CU009, CU010, CU011, CU015, CU016]
    figureRefs: [FU001]
