        - Physical availability expanded alongside digital acquisition
        - Mature-store customer counts and organic versus opening-led growth
    notes: >-
      Company operating metrics reported by news outlets are unaudited; AppBrain data
      covers Android distribution and must not be equated with unique or retained customers.
    claimRefs: [CU003, CU004, CU007, CU016]
