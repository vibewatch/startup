  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Cohort repeat-purchase curves, purchase frequency, churn, loyalty-tier migration,
        redemption cost, satisfaction trend, and customer lifetime value.
      whyItMatters: >-
        Acquisition and app reach cannot establish durable demand or profitable retention.
      diligencePath: >-
        Request monthly customer cohorts by first-order month, channel, geography, tier,
        orders per customer, gross profit, promotion spend, and twelve-month retention.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: channel-concentration
      missingEvidence: >-
        Order, revenue, gross profit, and customer mix across owned app, walk-in,
        delivery aggregators, licensed markets, and major geographies.
      whyItMatters: >-
        A 70 percent cellphone-order share does not reveal platform dependence,
        aggregator fees, owned-channel control, or geographic customer concentration.
      diligencePath: >-
        Obtain channel and country contribution tables, aggregator contracts, take rates,
        promotion funding, and the top ten markets by customers and gross profit.
      relatedQuestionRefs: [QU009]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A representative review export or verified customer cohort connecting named users
        to purchase history, tenure, outcomes, and repeat behavior.
      whyItMatters: >-
        Three public reviews confirm production interaction but cannot establish typical
        satisfaction, retention, or customer economics.
      diligencePath: >-
        Review a stratified app-review export and anonymized order-level cohort sample,
        then reconcile sentiment with support tickets, refunds, and repeat purchases.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
