company:
  name: "Kopi Kenangan"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Kopi Kenangan's product is a coordinated app-to-store convenience system rather than a standalone
    beverage menu: ordering, customization, payment, pickup, loyalty, store operations, and supply
    controls are meant to work as one stack. Public evidence shows meaningful digital adoption and
    active app maintenance, but production reliability, security controls, ERP deployment outcomes,
    food-quality controls, and roadmap execution remain insufficiently documented.
sections:
  - id: "customer-workflow"
    title: "The product is a no-queue coffee workflow"
    body: >-
      The customer proposition begins before the counter. The company's iOS listing describes outlet
      discovery, drink and food customization, scheduled pre-ordering, cashless payment, real-time
      order notifications, a dedicated pickup area, and a five-level Hearts loyalty program. That
      sequence converts a physical drink into a digitally coordinated convenience product: find,
      configure, pay, collect, and earn benefits without joining a conventional queue. The surface is
      not merely promotional. AppBrain recorded 7.4 million Android installs, a 4.87 rating from
      210,423 ratings, and multiple releases through October 2026, while Apple's listing also showed a
      current version update. These are adoption and maintenance signals, not proof of transaction
      conversion, retention, uptime, or profitable digital mix.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: "operating-architecture"
    title: "Digital demand connects to a still-partly-unverified operating stack"
    body: >-
      Public architecture evidence is clearest at the enterprise layer. IBM's 2023 partner
      announcement said Kopi Kenangan planned to replace its ERP and integrate applications,
      point-of-sale, and management systems on RISE with SAP. The stated objective was to standardize
      supply-chain, inventory, and financial workflows while using customer preferences and spending
      patterns for targeted promotions and product development. This creates a plausible feedback
      loop from app behavior to merchandising and replenishment, and it is a more defensible
      differentiation than claiming proprietary coffee technology. However, the announcement
      describes intended implementation and benefits; the retained evidence does not verify go-live
      scope, integration coverage, availability, inventory accuracy, latency, or realized
      productivity gains.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
  - id: "product-breadth-and-roadmap"
    title: "Product breadth is expanding across formats and outlets"
    body: >-
      The product system extends beyond made-to-order coffee. The app listing exposes adjacent food
      brands at selected outlets, and Mini Me Insights reported three Arabica-based ready-to-drink
      variants under the Hanya Untukmu range in late 2024. A 2026 interview summary attributed a
      4,000-store target for 2030 to management and described a local sourcing network spanning
      coffee, palm sugar, bakeries, and doughnut producers. This breadth can increase occasions and
      basket size, but it also multiplies formulation, supplier, cold-chain, availability, and
      quality-control requirements. The 4,000-store figure is a management target rather than a
      delivered roadmap, and no retained source provides country-by-country sequencing, format mix,
      launch gates, or technical capacity milestones.
    claimRefs: [CE010, CE012, CE013]
  - id: "risk-controls-and-verdict"
    title: "Scale signals are stronger than control evidence"
    body: >-
      Product-market signals are visible, but the control plane is opaque. Apple's privacy disclosure
      says identifiers and usage data may be used to track users, while AppBrain reports 31 Android
      permissions and 40 libraries; neither source establishes whether those permissions are
      necessary, how data are retained, or what security testing occurs. Supply resilience also
      matters: independent reporting described Indonesian buyers shifting toward cheaper blends
      under price pressure, while the announced ERP program made inventory control a central scaling
      objective. The underwriting conclusion is therefore balanced: Kopi Kenangan has a real,
      maintained digital surface and a coherent operating thesis, but technical defensibility and
      execution quality cannot be verified without architecture, reliability, security, privacy,
      food-safety, and rollout evidence from management.
    claimRefs: [CE004, CE011, CE014, CE015]
    figureRefs: [FE001]
