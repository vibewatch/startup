company:
  name: Kopi Kenangan
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kopi Kenangan is a privately owned Indonesian grab-and-go coffee chain founded in
    2017 that reports more than 1,200 outlets and 10,000 employees. Its 2026 scale
    claims and prospective listing discussions indicate maturity, but governance,
    audited financials, cumulative funding, and any completed secondary price remain
    undisclosed in the assigned evidence.
sections:
  - id: identity-and-model
    title: Identity, model, and operating scale
    body: >-
      Kopi Kenangan was founded in 2017 around a Jakarta grab-and-go format positioned
      between inexpensive local coffee and international premium chains. The retained
      evidence describes a compact-store, affordable offering reinforced by mobile
      ordering rather than a conventional sit-down model. By October 2026, interview-
      based coverage attributed more than 1,200 outlets across Indonesia, Malaysia,
      and Singapore, more than 10,000 employees, and Rp3.7 trillion of gross revenue
      for 1 July 2025 through 30 June 2026 to the company. Those are company-reported
      operating metrics, not audited figures. A separate 2025 profile reported that
      70% of orders were placed by cellphone, supporting the digital-distribution
      thesis while leaving channel economics and cohort behavior unverified.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder fit, and governance limits
    body: >-
      Co-founder and CEO Edward Tirtanata brings finance and accounting training plus
      experience at Ernst & Young in Jakarta; the profile also links his pricing
      discipline to an earlier commodities-business failure. Co-founder and chief
      marketing officer Cynthia Chaerunnisa is described as having online-commerce
      and consumer-marketing experience spanning Foodpanda, Lolabox, Sephora, Uber,
      and Shopee. Together these backgrounds cover capital formation, pricing,
      consumer acquisition, and localization. They also indicate meaningful founder
      dependence: the current evidence repeatedly centers strategy and growth claims
      on Tirtanata. The assigned sources do not establish the legal headquarters,
      complete executive team, board composition, voting control, reserved matters,
      or succession arrangements, so governance quality cannot be assessed from
      public evidence alone.
    claimRefs: [CO012, CO013]
    tableRefs: [TO002]
  - id: capital-and-liquidity
    title: Capital history and prospective liquidity
    body: >-
      The best-supported financing milestones are a reported US$109 million round in
      2020 and a US$96 million Series C first closing in 2021 led by Tybourne Capital
      Management, which valued the company above US$1 billion. These two disclosed
      amounts must not be treated as cumulative funding because the evidence does not
      enumerate every prior financing. In September 2025, Bloomberg-syndicated
      reporting said GIC and Peak XV were considering partial stake sales at a
      possible US$1.2 billion to US$1.4 billion valuation, with no certainty that a
      sale would occur. In 2026, the Wall Street Journal separately reported early
      bank discussions about a potential listing at up to US$1.0 billion, while
      stressing that timing and size were undetermined. These are nonbinding valuation
      indications, not transaction prices or cash available to the company.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: trajectory-and-execution-signals
    title: Milestones, ambition, and adverse execution signal
    body: >-
      The operating trajectory moved from the first Jakarta store in 2017 to 50
      locations by the end of 2018 and another 150 openings in 2019, followed by
      institutional financing and regional expansion. Management now targets 4,000
      stores by 2030, a goal that would require substantial execution beyond the
      company-reported base of more than 1,200 outlets. One April 2026 customer letter
      alleged that a buy-one-get-one promotion shown on an in-store digital menu
      could not be redeemed; the page said no company response had been received.
      A single complaint does not establish incidence or systemic misconduct, but it
      is a concrete control signal around promotion synchronization and customer
      remediation that should be tested across stores before underwriting faster
      expansion.
    claimRefs: [CO001, CO003, CO007, CO008, CO009, CO014, CO015]
    figureRefs: [FO001]
