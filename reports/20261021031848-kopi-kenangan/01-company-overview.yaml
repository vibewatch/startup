  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Current legal headquarters, full board and executive rosters, ownership
        percentages, voting rights, reserved matters, and succession plans.
      whyItMatters: >-
        Founder dependence and investor control cannot be evaluated without the
        governance documents and current cap table.
      diligencePath: >-
        Request the corporate organization chart, articles, shareholder agreements,
        board minutes, cap table, and documented succession plan from management.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: >-
        Audited consolidated financial statements, cash balance, debt, capex, store
        payback, and a complete cumulative-funding reconciliation.
      whyItMatters: >-
        Company-reported gross revenue and disclosed round amounts cannot establish
        profitability, liquidity, cash runway, or total capital raised.
      diligencePath: >-
        Obtain audited statements, bank and debt schedules, round-by-round financing
        records, and store-cohort investment returns.
      relatedQuestionRefs: [QO002, QO004, QO009]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: >-
        A completed secondary or primary transaction with price, security terms,
        dilution, and settlement evidence.
      whyItMatters: >-
        The 2025 secondary range and 2026 IPO indication differ and both remained
        preliminary, so neither establishes executable equity value.
      diligencePath: >-
        Request transaction documents, banker materials, recent cap-table transfers,
        and any signed listing mandate.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001, TO003]
    - type: enumeration-incomplete
      severity: minor
      topic: customer-complaint
      missingEvidence: >-
        Complaint incidence, resolution times, promotion synchronization logs, and
        Kopi Kenangan's response to the cited customer letter.
      whyItMatters: >-
        One customer account is an execution signal but cannot quantify whether the
        issue was isolated or systematic.
      diligencePath: >-
        Sample complaint records across stores and channels, inspect promotion-control
        procedures, and request the company's documented response.
      relatedQuestionRefs: [QO008]
