schemaVersion: "report-v2"
artifact: risks
slug: kopi-kenangan
runDate: 2026-10-21
company:
  name: Kopi Kenangan
chapter:
  number: 7
  title: Risks
  summary: >-
    Kopi Kenangan's central risk is execution: management is targeting 4,000 stores by
    2030 from 1,324 reported outlets as of December 2025 while proposing $200 million
    of expansion investment funded from cash flow. Commodity volatility, cross-border
    compliance, franchise quality, and unverified digital-retention economics compound
    that rollout risk, while public evidence is insufficient to quantify liquidity,
    store payback, supplier concentration, or privacy-control maturity.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implication
    body: >-
      The dominant risk is rollout execution rather than a demonstrated legal incident.
      Forbes reported 1,136 Indonesian outlets and 188 overseas outlets as of December
      2025, against management's target of 4,000 by 2030 and a proposed $200 million
      expansion program. That implies roughly tripling the footprint while management
      says internal cash flow can fund the program. Recent performance offers partial
      support but not proof of funding capacity: World Coffee Portal reported a $2.3
      million 2024 loss, while Forbes relayed management's unaudited claim of $184
      million revenue and $17 million net profit in 2025. Without audited cash flow,
      capex, and store-cohort payback, the investment case should treat pace, unit
      economics, and financing headroom as unresolved rather than assume accounting
      profit converts into expansion cash.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, privacy, and governance exposure
    body: >-
      The assigned evidence identifies cross-border regulatory variation but does not
      contain primary licenses, regulator records, court searches, privacy policies,
      incident notices, or jurisdiction-by-jurisdiction approvals. This is an evidence
      limitation, not proof that no incident or breach exists. Indonesia's operating
      baseline is also material: PwC reports an effective 11% VAT rate for most taxable
      goods and services and employer social-security contributions ranging from 0.24%
      to 4% of regular wages. The app's growing sales role increases the importance of
      privacy, security, and continuity controls, but the retained academic source is
      conceptual and expressly leaves its customer-loyalty propositions for future
      empirical testing. Legal and privacy diligence therefore needs primary documents,
      not inference from growth coverage.
    claimRefs: [CR009, CR010, CR013, CR014, CR015]
    tableRefs: [TR001]
  - id: operating-and-partner-dependencies
    title: Operating, commodity, channel, and partner dependencies
    body: >-
      Coffee input costs remain a live margin risk. Trading Economics recorded the
      coffee benchmark at 311.30 US cents per pound on 20 October 2026, up 12.63% over
      one month, while Forbes reported that management was diversifying sourcing,
      hedging with futures, and cutting packaging costs. Those actions indicate active
      mitigation, but the public evidence does not quantify hedge coverage, contract
      duration, supplier concentration, or pass-through capacity. The operating model
      also changes by market: most domestic, Singaporean, Malaysian, and Indian stores
      are company operated, whereas the Philippines and Australia use franchises and
      new markets are expected to default to franchising. Historical reporting also
      showed dependence on payment and delivery platforms; current economics by channel
      remain undisclosed.
    claimRefs: [CR006, CR007, CR008, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, monitoring indicators, and thesis-break triggers
    body: >-
      Mitigation should be judged by disclosed outcomes rather than policy statements.
      The key quarterly monitors are net store additions by ownership model, mature-store
      sales and cash payback, operating cash flow after capex, coffee-cost exposure net
      of hedges, app share with repeat cohorts, and franchise quality exceptions.
      Thesis-break triggers are: rollout continuing without audited cash generation or
      cohort payback; material same-store deterioration while outlet count rises; an
      inability to evidence licenses, privacy controls, or incident response in a launch
      market; sustained input inflation without pricing or margin offsets; or franchise
      growth that outpaces audit and remediation capacity. The 4,000-store goal is not
      itself evidence of failure, but missing control metrics as capital deployment
      accelerates would make the growth thesis unmonitorable.
    claimRefs: [CR003, CR004, CR007, CR008, CR013, CR014, CR015, CR016]
