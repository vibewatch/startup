  evidenceGaps:
    - type: missing-source
      severity: material
      topic: primary-legal-evidence
      missingEvidence: >-
        Primary licenses, regulator and court records, privacy policies, security
        assessments, incident logs, and market-by-market approval matrices.
      whyItMatters: >-
        Secondary descriptions cannot establish compliance status or whether a legal,
        privacy, security, or licensing event has occurred.
      diligencePath: >-
        Obtain entity and license schedules, counsel letters, regulator correspondence,
        litigation searches, privacy-control evidence, penetration tests, and incident
        registers for every operating market.
      relatedQuestionRefs: [QR002, QR007, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: expansion-funding
      missingEvidence: >-
        Audited 2025 financial statements, operating cash flow, cash balance, committed
        capex, lease liabilities, store build cost, and mature-store payback cohorts.
      whyItMatters: >-
        Net profit and funding raised do not establish cash available to self-fund a
        $200 million expansion program.
      diligencePath: >-
        Reconcile audited financials to bank statements and board budgets, then inspect
        store-level cohorts by format, ownership model, geography, and opening quarter.
      relatedQuestionRefs: [QR003, QR006, QR008]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: commodity-and-supplier-exposure
      missingEvidence: >-
        Supplier concentration, purchase commitments, coffee-grade basis exposure,
        futures hedge notional and tenor, and demonstrated menu-price elasticity.
      whyItMatters: >-
        A reported hedge program cannot be evaluated without coverage, basis risk, and
        pass-through evidence.
      diligencePath: >-
        Review supplier contracts, procurement concentration, hedge confirmations,
        treasury policy, realized hedge results, and contribution margin sensitivity.
      relatedQuestionRefs: [QR004, QR005, QR007, QR008]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: app-and-channel-durability
      missingEvidence: >-
        Current owned-versus-aggregator channel mix, commissions, app cohorts, repeat
        rates, failed-order rates, uptime, complaints, and privacy-control effectiveness.
      whyItMatters: >-
        The app is reported as a major sales channel, but neither durable retention nor
        channel economics can be inferred from a conceptual paper or historical mix.
      diligencePath: >-
        Obtain monthly channel P&Ls, customer cohorts, service-level reports, complaint
        logs, privacy audits, processor contracts, and incident-response test results.
      relatedQuestionRefs: [QR005, QR007, QR008]
      relatedTableRefs: [TR002, TR003]
