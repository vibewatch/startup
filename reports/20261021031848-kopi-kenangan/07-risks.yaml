        - Each current and planned market
        - Independent commercial coverage flags differing regulatory landscapes; primary approvals were not in the assigned evidence
        - Medium
        - High
        - Undisclosed
        - Material until the entity, license, and renewal matrix is verified
        - Obtain every operating entity, food-service license, permit, renewal date, and regulator correspondence
      - - Consumer-data privacy, security, and incident response
        - All app markets
        - The app is reported as close to half of sales, but no primary privacy or incident-control evidence was assigned
        - Medium
        - High
        - Undisclosed
        - Material because digital disruption or non-compliance could affect a major sales channel
        - Review data maps, consent records, penetration tests, incident logs, processor contracts, and breach-notification procedures
      - - VAT collection and filing
        - Indonesia
        - PwC reports an effective 11% VAT rate for most taxable goods and services and monthly filing
        - Medium
        - Medium
        - Established rule; company compliance not verified
        - Compliance and cash-timing exposure remain unquantified
        - Reconcile monthly VAT returns to point-of-sale records and test exemptions and marketplace flows
      - - Employer social-security contributions
        - Indonesia
        - PwC reports employer contributions from 0.24% to 4% of regular wages
        - Medium
        - Medium
        - Established rule; company compliance not verified
        - Exposure scales with a labor-intensive store base
        - Test payroll registers, worker classifications, BPJS enrollment, and arrears by employing entity
    notes: >-
      Partial register limited to legal and regulatory surfaces evidenced by the assigned
      sources; it is not a complete jurisdictional legal search, and likelihood ratings
      reflect exposure pathways rather than recorded violations.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly evidenced operating-rule and compliance surfaces relevant to Indonesia
        and the company's cross-border expansion as of 2026-10-21.
    claimRefs: [CR009, CR010, CR013, CR014, CR015]
  - id: TR002
    title: Operational, quality, and execution risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidence basis
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Store rollout outpaces cash generation and unit economics
        - High
        - High
        - 4,000-store target, $200 million investment plan, and roughly threefold footprint expansion
        - Company says expansion can be funded from cash flow
        - High until audited cash flow and store cohorts substantiate the plan
        - Audited cash flow, capex per format, pre-opening costs, and cohort payback
      - - Coffee input inflation compresses margin
        - High
        - High
        - Benchmark price was up 12.63% over one month on 20 October 2026
        - Active sourcing diversification, futures hedging, and cost reduction reported
        - Material because hedge coverage and price pass-through are undisclosed
        - Hedge notional, tenor, basis risk, supplier contracts, and menu-price elasticity
      - - Franchise quality or brand-control failure in new markets
        - Medium
        - High
        - Franchising is the stated default for new markets
        - Franchise structure exists; audit controls were not disclosed
        - Material as international footprint expands
        - Franchise manuals, audit scores, termination rights, complaints, and remediation time
      - - App quality or retention deterioration
        - Medium
        - Medium
        - App is reported near half of sales; company-specific loyalty evidence remains conceptual
        - App ordering and engagement are established
        - Material because cohort retention and reliability data are unavailable
        - Monthly cohorts, repeat rates, latency, failed orders, downtime, and complaint trends
    notes: >-
      Severity and likelihood are analytical rankings tied to cited rollout, commodity,
      ownership-model, and app evidence; no unpublished incident frequency is assumed.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR013, CR014, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Coffee and palm-sugar supply
        - Thousands of local farmers and producers, per management interview coverage
        - Core beverage inputs
        - Supplier shares and contract coverage are not public
        - Weather or supply disruption raises costs or reduces availability
        - High
        - Diversified sourcing and futures hedging are reported
        - Concentration, quality consistency, and hedge basis risk remain unknown
      - - Delivery marketplaces
        - GoFood and GrabFood in historical 2021 coverage
        - Last-mile demand aggregation
        - Historical case study reported 30% of sales through third-party delivery
        - Commission changes, ranking changes, or outages impair margin or demand
        - Medium
        - Direct app has since become a much larger channel
        - Current marketplace share and commission economics are undisclosed
      - - Payment platforms
        - GoPay and OVO in historical 2021 coverage
        - Consumer payment and promotional acquisition
        - Historical source said most sales relied on payment and delivery partners
        - Promotion withdrawal or platform-policy changes weaken conversion
        - Medium
        - Direct app and in-store channels provide alternatives
        - Current payment mix and negotiated terms are unavailable
      - - Overseas franchisees
        - Philippines, Australia, and planned new-market partners
        - Local market entry and store operation
        - New markets are expected to use franchising by default
        - Weak operator execution causes quality, compliance, or brand inconsistency
        - High
        - Format adaptation and franchise contracts are reported at a structural level
        - Partner economics, audit rights, and remediation performance are not disclosed
    notes: >-
      Partner shares are historical or undisclosed unless a period is stated; the table
      does not infer current concentration from the number of named counterparties.
    claimRefs: [CR006, CR008, CR011, CR012, CR013]
