callouts:
  - calloutType: risk
    title: Profit is not expansion cash
    body: >-
      Management's unaudited 2025 profit claim does not disclose operating cash flow,
      capex, lease commitments, or store-cohort payback; those items should gate reliance
      on the stated self-funding plan.
    claimRefs: [CR002, CR003, CR016]
  - calloutType: recommendation
    title: Gate rollout on auditable operating evidence
    body: >-
      Require audited cash generation, mature-store cohorts, hedge coverage, franchise
      audit results, and jurisdictional license and privacy-control matrices before
      underwriting the 2030 footprint target.
    claimRefs: [CR003, CR004, CR007, CR008, CR014, CR015, CR016]
