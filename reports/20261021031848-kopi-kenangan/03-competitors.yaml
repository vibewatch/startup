company:
  name: "Kopi Kenangan"
chapter:
  number: 3
  title: "Competitors"
  summary: "Kopi Kenangan leads Indonesia's scaled modern-coffee cohort, but its core playbook - local flavors, below-Starbucks pricing, compact formats, and app-led promotions - is increasingly shared by Fore, Janji Jiwa, Tomoro, and regional entrants. Scale and digital execution remain meaningful advantages, while low switching costs, similar taste perceptions, and stronger franchise or supply-chain models limit moat durability."
sections:
  - id: "landscape-and-buyer-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      The relevant landscape is broader than branded coffee chains. Kopi Kenangan competes directly with Indonesian peers Fore Coffee, Janji Jiwa, and Tomoro; with the premium global incumbent Starbucks; and with value-led beverage networks such as Mixue. The buyer can also substitute roadside coffee, instant sachets, independent cafes, home preparation, delivery-only brands, or no purchase, so store count does not create captive demand. Current reporting nevertheless places Kopi Kenangan at the front of the Indonesian chain cohort: CoffeeTalk reported 1,136 domestic and 188 international locations, while KR Asia described more than 1,100 Indonesian outlets versus about 900 for Janji Jiwa, 600 for Tomoro, and just over 500 for Starbucks. These figures use different publisher dates and definitions and therefore establish order of magnitude rather than a perfectly synchronized ranking.
    claimRefs: [CP001, CP003, CP005, CP009, CP010]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "capability-and-distribution"
    title: "Capability and distribution"
    body: >-
      Kopi Kenangan's strongest differentiation is an operating bundle rather than a unique product: locally resonant drinks, compact high-throughput stores, an owned app, loyalty promotions, and dense distribution. KR Asia reports that Indonesian chains broadly use local flavors, below-Starbucks prices, and small outlets in offices and transit hubs, which means several parts of that bundle are category conventions rather than proprietary advantages. Kopi Kenangan can still execute the combination at greater scale, and management says its app and modern management systems raise sales per store. Yet the retained evidence does not provide a current independent feature audit for Fore, Janji Jiwa, or Tomoro, and the PowerCommerce account of market tailoring is a low-reputation secondary summary. Capability cells are therefore marked unknown where the pool lacks direct documentation rather than inferred from brand reputation.
    claimRefs: [CP006, CP007, CP013, CP014, CP015]
    tableRefs: [TP002]
  - id: "price-and-packaging"
    title: "Price and packaging"
    body: >-
      Price is central to the proposition but the public comparison is stale and geographically uneven. Tech in Asia reported in 2019 that Kopi Kenangan's signature palm-sugar coffee cost IDR18,000, against IDR42,000 for a Starbucks tall latte; that historical observation supports the original affordability wedge, not a current 2026 price claim. Mixue's Vietnam range of VND10,000-30,000 demonstrates a regional value benchmark, but currency, market, product, and tax differences make it unsuitable for direct unit comparison. No retained source discloses a contemporaneous normalized basket for Kopi Kenangan, Fore, Janji Jiwa, Tomoro, Starbucks, and Mixue. Promotional discounts and loyalty points further separate list prices from realized tickets, so underwriting should obtain store-level receipts and app offers before concluding that Kopi Kenangan still owns the affordable-premium price band.
    claimRefs: [CP002, CP006, CP011]
    tableRefs: [TP003]
  - id: "moat-durability-and-displacement"
    title: "Moat durability and displacement risk"
    body: >-
      The moat is strongest in accumulated scale, operating data, and execution discipline, but weaker in product exclusivity or customer lock-in. A Singapore customer quoted by KR Asia called Kenangan cheap and well discounted while finding its taste similar to other cafes, direct evidence that value can attract trial without preventing multi-homing. The same reporting says new international markets are generally unprofitable for two to three years and identifies Luckin, ZUS Coffee, Cafe Amazon, and local brands as entrenched alternatives. Mixue adds a different threat: a huge franchised network and vertically controlled supply chain that it credits for low prices. Kopi Kenangan's 4,000-store ambition can widen distribution, but expansion does not itself prove retention or superior unit economics. Durable advantage therefore depends on repeat behavior, store-level contribution, and localized execution that the assigned evidence does not independently quantify.
    claimRefs: [CP008, CP011, CP012, CP016]
callouts:
  - calloutType: "strength"
    title: "Scale leads the local modern-coffee cohort"
    body: "Multiple 2026 accounts place Kopi Kenangan above named Indonesian coffee-chain peers by outlet count, giving it procurement, awareness, and data advantages even though definitions are not fully harmonized."
    claimRefs: [CP003, CP005]
  - calloutType: "risk"
    title: "The playbook is imitable"
    body: "Below-Starbucks pricing, local flavors, compact stores, and digital promotions are increasingly category conventions; similar taste perceptions and low switching friction leave the brand exposed to discounts and convenient substitutes."
    claimRefs: [CP006, CP016]
