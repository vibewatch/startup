              - CO016
      - number: '1.2'
        title: Leadership, founder fit, and governance limits
        blocks:
          - type: paragraph
            body: >-
              Co-founder and CEO Edward Tirtanata brings finance and accounting training plus experience at Ernst &
              Young in Jakarta; the profile also links his pricing discipline to an earlier commodities-business
              failure. Co-founder and chief marketing officer Cynthia Chaerunnisa is described as having online-commerce
              and consumer-marketing experience spanning Foodpanda, Lolabox, Sephora, Uber, and Shopee. Together these
              backgrounds cover capital formation, pricing, consumer acquisition, and localization. They also indicate
              meaningful founder dependence: the current evidence repeatedly centers strategy and growth claims on
              Tirtanata. The assigned sources do not establish the legal headquarters, complete executive team, board
              composition, voting control, reserved matters, or succession arrangements, so governance quality cannot be
              assessed from public evidence alone.
            claimRefs:
              - CO012
