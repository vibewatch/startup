chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan was founded in 2017 around a Jakarta grab-and-go format positioned between inexpensive local
              coffee and international premium chains. The retained evidence describes a compact-store, affordable
              offering reinforced by mobile ordering rather than a conventional sit-down model. By October 2026,
              interview- based coverage attributed more than 1,200 outlets across Indonesia, Malaysia, and Singapore,
              more than 10,000 employees, and Rp3.7 trillion of gross revenue for 1 July 2025 through 30 June 2026 to
              the company. Those are company-reported operating metrics, not audited figures. A separate 2025 profile
              reported that 70% of orders were placed by cellphone, supporting the digital-distribution thesis while
              leaving channel economics and cohort behavior unverified.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
