              - CO013
      - number: '1.3'
        title: Capital history and prospective liquidity
        blocks:
          - type: paragraph
            body: >-
              The best-supported financing milestones are a reported US$109 million round in 2020 and a US$96 million
              Series C first closing in 2021 led by Tybourne Capital Management, which valued the company above US$1
              billion. These two disclosed amounts must not be treated as cumulative funding because the evidence does
              not enumerate every prior financing. In September 2025, Bloomberg-syndicated reporting said GIC and Peak
              XV were considering partial stake sales at a possible US$1.2 billion to US$1.4 billion valuation, with no
              certainty that a sale would occur. In 2026, the Wall Street Journal separately reported early bank
              discussions about a potential listing at up to US$1.0 billion, while stressing that timing and size were
              undetermined. These are nonbinding valuation indications, not transaction prices or cash available to the
              company.
            claimRefs:
