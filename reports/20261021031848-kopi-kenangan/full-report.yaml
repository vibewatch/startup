              - CO010
      - number: '1.4'
        title: Milestones, ambition, and adverse execution signal
        blocks:
          - type: paragraph
            body: >-
              The operating trajectory moved from the first Jakarta store in 2017 to 50 locations by the end of 2018 and
              another 150 openings in 2019, followed by institutional financing and regional expansion. Management now
              targets 4,000 stores by 2030, a goal that would require substantial execution beyond the company-reported
              base of more than 1,200 outlets. One April 2026 customer letter alleged that a buy-one-get-one promotion
              shown on an in-store digital menu could not be redeemed; the page said no company response had been
              received. A single complaint does not establish incidence or systemic misconduct, but it is a concrete
              control signal around promotion synchronization and customer remediation that should be tested across
              stores before underwriting faster expansion.
