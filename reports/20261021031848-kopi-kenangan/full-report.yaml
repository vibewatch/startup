        - Deteriorating mature-store cohorts or widespread closures would weaken the scale case.
      - - Thesis
        - Digital engagement can support repeat demand
        - 4.47 million new digital customers and 1.5 million monthly transacting digital users were reported for 2025.
        - Weak retention, promotion dependence, or low owned-channel contribution would weaken the claim.
      - - Anti-thesis
        - Expansion execution remains unproven at the next scale
        - Management targets 4,000 stores by 2030 after halting three experimental formats.
        - Audited country cohorts and consistently short payback periods would reduce this concern.
      - - Anti-thesis
        - Customer and service friction can erode the brand
        - A consumer-complaint index includes 2026 entries involving promotion accuracy and complaint handling.
        - Low substantiated complaint rates and documented resolution performance would reduce this concern.
    notes: >-
      Scale and digital metrics are company-reported through independent publications; the complaint source is a
      non-exhaustive public index, not an incidence-rate study.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Entry valuation discipline
      - Required assumptions
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - US$1.2-US$1.4 billion only after evidence upgrades
        - Audited profitable growth, cash-funded expansion, healthy new-store cohorts, and stable input margins
        - Possible but not demonstrated by the fetched public evidence
        - Expansion funding requires dilutive capital or store economics weaken
      - - Base
        - Below US$1.2 billion; no precise floor is supportable
        - Profitability persists but growth normalizes and valuation must compensate for private-company opacity
        - Most consistent with current mixed evidence
        - Audited profit or cash conversion falls materially below reported figures
      - - Bear
        - No investable range; defer pending price discovery
        - Coffee input pressure, competitive intensity, or rollout costs reverse profitability
        - Material downside remains plausible
        - Renewed group losses, negative operating cash flow, or a punitive down round
    notes: >-
      The US$1.2-US$1.4 billion reference is a reported 2025 potential secondary-sale range, not a completed
      transaction; qualitative probability signals replace unsupported percentages.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
      - CV015
