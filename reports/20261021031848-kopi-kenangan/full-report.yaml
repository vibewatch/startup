  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than all Indonesian coffee expenditure. Kopi Kenangan competes most
              directly for prepared, out-of-home beverages bought by urban consumers who want better ingredients and
              branding than street-vendor instant coffee without paying international-chain prices. Coffee Intelligence
              described the original price ladder as roughly $0.20 at street stalls, $3 for specialty coffee, more than
              $5 at Starbucks, and $1.20 at Kopi Kenangan in 2017. The boundary therefore includes affordable-premium
              brewed drinks, app or delivery orders, and attached food purchases, while excluding household beans, most
              soluble coffee, and the full value of premium sit-down occasions. Street vendors, home preparation, and
              higher-priced coffeehouses remain status-quo substitutes, not part of a homogeneous addressable pool.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Two lenses are available, but they cannot be collapsed into a defensible company TAM. The Coffee Post
              attributes to Redseer an Indonesian coffee market forecast rising from $6.7 billion in 2024 to $12.6
              billion in 2030, an 11% CAGR; the underlying report and category definition were not in the assigned
              evidence, so this is a secondary estimate. USDA instead forecasts 4.83 million 60-kilogram bags of
              domestic coffee consumption in 2026/27, split between 3.28 million roast-and-ground and 1.55 million
              soluble bags. Those commodity volumes are useful demand denominators but do not disclose prepared-beverage
              retail spend, Kopi Kenangan's eligible cities, price bands, channel mix, or attainable share. A precise
              SAM or SOM would therefore overstate what the public evidence supports.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The immediate payer and user are usually the same individual, while the budget owner is the consumer
              rather than an enterprise procurement function. Evidence points to office workers, students and other
              younger urban consumers seeking convenience, local flavors, and an affordable upgrade. Adoption can begin
              through a nearby kiosk or aggregator, move to pre-ordering in the company app, and deepen through loyalty
              and promotions. Coffee Intelligence reported 2.3 million app users by July 2022 and relayed the company's
              claim that digital channels generated 70% of sales at that time. PowerCommerce separately describes app
              data being used for personalized campaigns, but its commercial blog is low-reputation evidence and does
              not establish current retention or incremental spend.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by a growing middle class, low coffee consumption per capita relative to other Asian
              markets, and a store format that places affordable drinks close to daily traffic. The operating ambition
              is large: 2026 reporting cites more than 1,200 shops and a management target of 4,000 by 2030. That target
              is an expansion goal, not evidence of market capacity. The binding constraint is input economics. USDA
              forecasts Indonesian green bean production to fall 8% to 11.38 million bags in 2026/27 after excessive
              rainfall, while roaster margins have already been squeezed by higher green bean prices. A fragmented
              smallholder supply base, export demand, weather volatility, localization needs, and regulatory execution
              can slow rollout or force price, sourcing, and product-mix tradeoffs.
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Valuation relevance and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The market case supports continued store growth but not a top-down revenue valuation based on the broad
              Redseer number. Investors should underwrite city-level outlet density, ticket frequency, contribution
              margin, and payback rather than applying the full national coffee CAGR to the company. The 4,000-store
              objective requires proof that new catchments preserve throughput while expansion extends beyond the
              densest urban corridors. Priority diligence should obtain the underlying Redseer taxonomy,
              transaction-level sales by channel and geography, store cohorts, customer frequency, and catchment-level
              cannibalization. It should also stress-test green-bean, milk, palm-sugar, labor, rent, and
              delivery-commission inflation under USDA's current supply outlook. Until those data exist, chain-specific
              SAM, SOM, and adoption timing remain material open questions.
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM012
              - CM016
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad growth does not establish store-level capacity
            body: >-
              The 11% market forecast and 4,000-store target use different issuers, methodologies, and denominators;
              neither substitutes for catchment, cannibalization, contribution-margin, or payback evidence.
            calloutType: risk
            claimRefs:
              - CM003
              - CM008
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than branded coffee chains. Kopi Kenangan competes directly with
              Indonesian peers Fore Coffee, Janji Jiwa, and Tomoro; with the premium global incumbent Starbucks; and
              with value-led beverage networks such as Mixue. The buyer can also substitute roadside coffee, instant
              sachets, independent cafes, home preparation, delivery-only brands, or no purchase, so store count does
              not create captive demand. Current reporting nevertheless places Kopi Kenangan at the front of the
              Indonesian chain cohort: CoffeeTalk reported 1,136 domestic and 188 international locations, while KR Asia
              described more than 1,100 Indonesian outlets versus about 900 for Janji Jiwa, 600 for Tomoro, and just
              over 500 for Starbucks. These figures use different publisher dates and definitions and therefore
              establish order of magnitude rather than a perfectly synchronized ranking.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.2'
        title: Capability and distribution
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan's strongest differentiation is an operating bundle rather than a unique product: locally
              resonant drinks, compact high-throughput stores, an owned app, loyalty promotions, and dense distribution.
              KR Asia reports that Indonesian chains broadly use local flavors, below-Starbucks prices, and small
              outlets in offices and transit hubs, which means several parts of that bundle are category conventions
              rather than proprietary advantages. Kopi Kenangan can still execute the combination at greater scale, and
              management says its app and modern management systems raise sales per store. Yet the retained evidence
              does not provide a current independent feature audit for Fore, Janji Jiwa, or Tomoro, and the
              PowerCommerce account of market tailoring is a low-reputation secondary summary. Capability cells are
              therefore marked unknown where the pool lacks direct documentation rather than inferred from brand
              reputation.
            claimRefs:
              - CP006
              - CP007
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Price and packaging
        blocks:
          - type: paragraph
            body: >-
              Price is central to the proposition but the public comparison is stale and geographically uneven. Tech in
              Asia reported in 2019 that Kopi Kenangan's signature palm-sugar coffee cost IDR18,000, against IDR42,000
              for a Starbucks tall latte; that historical observation supports the original affordability wedge, not a
              current 2026 price claim. Mixue's Vietnam range of VND10,000-30,000 demonstrates a regional value
              benchmark, but currency, market, product, and tax differences make it unsuitable for direct unit
              comparison. No retained source discloses a contemporaneous normalized basket for Kopi Kenangan, Fore,
              Janji Jiwa, Tomoro, Starbucks, and Mixue. Promotional discounts and loyalty points further separate list
              prices from realized tickets, so underwriting should obtain store-level receipts and app offers before
              concluding that Kopi Kenangan still owns the affordable-premium price band.
            claimRefs:
              - CP002
              - CP006
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is strongest in accumulated scale, operating data, and execution discipline, but weaker in
              product exclusivity or customer lock-in. A Singapore customer quoted by KR Asia called Kenangan cheap and
              well discounted while finding its taste similar to other cafes, direct evidence that value can attract
              trial without preventing multi-homing. The same reporting says new international markets are generally
              unprofitable for two to three years and identifies Luckin, ZUS Coffee, Cafe Amazon, and local brands as
              entrenched alternatives. Mixue adds a different threat: a huge franchised network and vertically
              controlled supply chain that it credits for low prices. Kopi Kenangan's 4,000-store ambition can widen
              distribution, but expansion does not itself prove retention or superior unit economics. Durable advantage
              therefore depends on repeat behavior, store-level contribution, and localized execution that the assigned
              evidence does not independently quantify.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale leads the local modern-coffee cohort
            body: >-
              Multiple 2026 accounts place Kopi Kenangan above named Indonesian coffee-chain peers by outlet count,
              giving it procurement, awareness, and data advantages even though definitions are not fully harmonized.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
          - type: callout
            title: The playbook is imitable
            body: >-
              Below-Starbucks pricing, local flavors, compact stores, and digital promotions are increasingly category
              conventions; similar taste perceptions and low switching friction leave the brand exposed to discounts and
              convenient substitutes.
            calloutType: risk
            claimRefs:
              - CP006
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue and regional traction
        blocks:
          - type: paragraph
            body: >-
              Third-party reports citing management and shared unaudited documents put 2025 group revenue at US$184
              million, up 45% year on year, and net profit at US$17 million, the first full-year group profit. The
              improvement was broad enough to appear in both core operating markets: Indonesia reported IDR2.3 trillion
              of net revenue, with roughly 15% same-store sales growth, and IDR377 billion of net income; Malaysia
              reported RM111 million of revenue and RM17 million of EBITDA. These are meaningful signs that store
              expansion did not prevent reported profitability, but they remain unaudited public figures rather than a
              substitute for consolidated financial statements. Geographic concentration also remains high: management
              attributes 75% of revenue to Indonesia and 15% to Malaysia, making those two markets the principal drivers
              of current financial quality.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.2'
        title: Pricing, channels, and store format
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan occupies an affordable-premium price band: reported menu prices of IDR22,000 for Kopi
              Kenangan Mantan and IDR20,000 for an Americano sit above street-cart instant coffee but below global-chain
              prices. The cost architecture is designed around compact throughput, with 85% of outlets described as
              grab-and-go kiosks without seating. Its app adds prepaid pickup, customization, cashless payment,
              order-status notifications, and loyalty, so it should support frequency and first-party demand data rather
              than constitute a separate revenue stream. Public channel metrics are not directly comparable: one report
              says the app is close to half of sales, while another says 70% of orders are placed by mobile phone.
              Realized basket size, discounts, delivery commissions, loyalty redemption cost, and
              owned-versus-aggregator mix are not disclosed.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.3'
        title: Margin drivers and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Management plans to invest US$200 million to reach 4,000 stores by 2030 and says internal cash flow can
              fund the program without new investor capital. That assertion is directionally consistent with reported
              profitability, but it cannot be underwritten from public evidence because cash, debt, lease liabilities,
              maintenance and growth capex, working-capital needs, and store-level payback are absent. Commodity
              exposure is also material. USDA forecasts an 8% fall in Indonesian green-bean production for 2026/27 and
              reports that higher green-bean prices have squeezed local roaster margins. Management says it is
              diversifying sourcing, hedging futures, and buying cups directly from factories, but the financial effect
              of those mitigations is not quantified. Franchise and licensing expansion may reduce capital needs in
              selected new markets, while company-owned expansion in Indonesia and Malaysia preserves more operating
              exposure.
            claimRefs:
              - CI012
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality appears stronger than in prior loss-making years because reported group profit, same-store
              growth, positive Malaysian EBITDA, app-led demand, and a geographically diversified footprint now coexist.
              The ready-to-drink line adds a potentially asset-lighter channel, although its tripling of units in 2025
              came from an undisclosed low base and no revenue contribution was provided. The core concern is evidence
              quality, not the direction of the headline metrics: profitability figures are unaudited, digital-channel
              statistics use inconsistent denominators, and there is no public bridge from revenue to gross profit,
              operating cash flow, or free cash flow. Investment underwriting therefore requires audited consolidated
              accounts, country and channel contribution margins, store cohorts, capex and payback, cash and debt
              schedules, and a downside plan for coffee-input inflation before treating the expansion program as
              self-funded.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is reported, but cash self-funding is not yet demonstrated
            body: >-
              Management's plan to fund a US$200 million expansion from cash flow cannot be reconciled without audited
              cash flow, cash, debt and lease schedules, capex, store payback, and commodity-cost sensitivities.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a no-queue coffee workflow
        blocks:
          - type: paragraph
            body: >-
              The customer proposition begins before the counter. The company's iOS listing describes outlet discovery,
              drink and food customization, scheduled pre-ordering, cashless payment, real-time order notifications, a
              dedicated pickup area, and a five-level Hearts loyalty program. That sequence converts a physical drink
              into a digitally coordinated convenience product: find, configure, pay, collect, and earn benefits without
              joining a conventional queue. The surface is not merely promotional. AppBrain recorded 7.4 million Android
              installs, a 4.87 rating from 210,423 ratings, and multiple releases through October 2026, while Apple's
              listing also showed a current version update. These are adoption and maintenance signals, not proof of
              transaction conversion, retention, uptime, or profitable digital mix.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Digital demand connects to a still-partly-unverified operating stack
        blocks:
          - type: paragraph
            body: >-
              Public architecture evidence is clearest at the enterprise layer. IBM's 2023 partner announcement said
              Kopi Kenangan planned to replace its ERP and integrate applications, point-of-sale, and management systems
              on RISE with SAP. The stated objective was to standardize supply-chain, inventory, and financial workflows
              while using customer preferences and spending patterns for targeted promotions and product development.
              This creates a plausible feedback loop from app behavior to merchandising and replenishment, and it is a
              more defensible differentiation than claiming proprietary coffee technology. However, the announcement
              describes intended implementation and benefits; the retained evidence does not verify go-live scope,
              integration coverage, availability, inventory accuracy, latency, or realized productivity gains.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE013
      - number: '5.3'
        title: Product breadth is expanding across formats and outlets
        blocks:
          - type: paragraph
            body: >-
              The product system extends beyond made-to-order coffee. The app listing exposes adjacent food brands at
              selected outlets, and Mini Me Insights reported three Arabica-based ready-to-drink variants under the
              Hanya Untukmu range in late 2024. A 2026 interview summary attributed a 4,000-store target for 2030 to
              management and described a local sourcing network spanning coffee, palm sugar, bakeries, and doughnut
              producers. This breadth can increase occasions and basket size, but it also multiplies formulation,
              supplier, cold-chain, availability, and quality-control requirements. The 4,000-store figure is a
              management target rather than a delivered roadmap, and no retained source provides country-by-country
              sequencing, format mix, launch gates, or technical capacity milestones.
            claimRefs:
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: Scale signals are stronger than control evidence
        blocks:
          - type: paragraph
            body: >-
              Product-market signals are visible, but the control plane is opaque. Apple's privacy disclosure says
              identifiers and usage data may be used to track users, while AppBrain reports 31 Android permissions and
              40 libraries; neither source establishes whether those permissions are necessary, how data are retained,
              or what security testing occurs. Supply resilience also matters: independent reporting described
              Indonesian buyers shifting toward cheaper blends under price pressure, while the announced ERP program
              made inventory control a central scaling objective. The underwriting conclusion is therefore balanced:
              Kopi Kenangan has a real, maintained digital surface and a coherent operating thesis, but technical
              defensibility and execution quality cannot be verified without architecture, reliability, security,
              privacy, food-safety, and rollout evidence from management.
            claimRefs:
              - CE004
              - CE011
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE011
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A maintained digital product with visible reach
            body: >-
              AppBrain's October 2026 snapshot reports 7.4 million installs and six recent Android releases, while
              Apple's listing exposes the full order-to-pickup and loyalty workflow.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: callout
            title: Architecture is announced, not operationally proven
            body: >-
              The public record describes intended SAP integration and data use but does not disclose go-live scope,
              service levels, security assurance, privacy governance, or measured operating gains.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer segments and purchase routes
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan is a consumer retail business rather than an enterprise account model: the end user, buyer,
              and payer are generally the same individual, while ordering can occur through the company app, at an
              outlet, or through an unspecified delivery route. The branded site describes pickup and delivery, points,
              vouchers, and priority access, while Tracxn characterizes the company as a limited-service restaurant
              chain selling coffee and adjacent food. This creates several observable behavioral segments—app-led repeat
              buyers, grab-and-go customers, loyalty members, and locally adapted international consumers—but the public
              evidence does not disclose revenue or gross profit by segment.
            claimRefs:
              - CU001
              - CU002
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU012
      - number: '6.2'
        title: Adoption trajectory and reach
        blocks:
          - type: paragraph
            body: >-
              Reported customer acquisition accelerated in 2025: IDN Financials, citing unaudited financial documents,
              said the digital ecosystem added 4.47 million new customers and reached 1.5 million monthly transacting
              digital users in December 2025, up 116 percent. AppBrain separately tracked 7.4 million cumulative Android
              installs and a 4.87 Google Play rating from 210,423 ratings as of the October 2026 page update. These
              measures are not interchangeable: installs are cumulative device events, monthly transacting users
              indicate active commerce, and new customers lack a disclosed deduplication or repeat-purchase denominator.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU016
      - number: '6.3'
        title: Customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              Public proof is strongest at the aggregate app and outlet level, not at the retention-cohort level.
              AppBrain shows both positive and negative named review examples: one reviewer praised price, taste, and a
              subscription, while another objected to repeated in-app pop-ups. These anecdotes establish real user
              interaction but are not a representative satisfaction sample and do not establish repeat purchase. No
              assigned source discloses net or gross revenue retention, churn, renewal, purchase frequency,
              customer-acquisition cost, loyalty-tier migration, or cohort contribution margin. Durability therefore
              remains a material diligence gap despite strong top-of-funnel indicators.
            claimRefs:
              - CU007
              - CU008
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU007
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Physical availability and mobile ordering reinforce one another: management said 70 percent of orders were
              placed by cellphone, while two publications reported 1,324 outlets at the end of 2025, up from 977 a year
              earlier. Indonesia still represented 1,136 of those outlets, and Malaysia about 158, showing that
              geographic reach does not eliminate home-market concentration. Management also attributes growth to
              adapting flavors, recipes, and prices by market. The strategy is plausible as a localization loop, but
              public evidence does not separate organic repeat demand from store openings, promotions, aggregator
              traffic, or licensed expansion.
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU007
              - CU009
              - CU010
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not retention
            body: >-
              Installs, new-customer additions, mobile-order share, and outlet growth show acquisition and access, but
              none supplies a cohort retention rate or customer concentration measure.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU009
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implication
        blocks:
          - type: paragraph
            body: >-
              The dominant risk is rollout execution rather than a demonstrated legal incident. Forbes reported 1,136
              Indonesian outlets and 188 overseas outlets as of December 2025, against management's target of 4,000 by
              2030 and a proposed $200 million expansion program. That implies roughly tripling the footprint while
              management says internal cash flow can fund the program. Recent performance offers partial support but not
              proof of funding capacity: World Coffee Portal reported a $2.3 million 2024 loss, while Forbes relayed
              management's unaudited claim of $184 million revenue and $17 million net profit in 2025. Without audited
              cash flow, capex, and store-cohort payback, the investment case should treat pace, unit economics, and
              financing headroom as unresolved rather than assume accounting profit converts into expansion cash.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, privacy, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies cross-border regulatory variation but does not contain primary licenses,
              regulator records, court searches, privacy policies, incident notices, or jurisdiction-by-jurisdiction
              approvals. This is an evidence limitation, not proof that no incident or breach exists. Indonesia's
              operating baseline is also material: PwC reports an effective 11% VAT rate for most taxable goods and
              services and employer social-security contributions ranging from 0.24% to 4% of regular wages. The app's
              growing sales role increases the importance of privacy, security, and continuity controls, but the
              retained academic source is conceptual and expressly leaves its customer-loyalty propositions for future
              empirical testing. Legal and privacy diligence therefore needs primary documents, not inference from
              growth coverage.
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Operating, commodity, channel, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Coffee input costs remain a live margin risk. Trading Economics recorded the coffee benchmark at 311.30 US
              cents per pound on 20 October 2026, up 12.63% over one month, while Forbes reported that management was
              diversifying sourcing, hedging with futures, and cutting packaging costs. Those actions indicate active
              mitigation, but the public evidence does not quantify hedge coverage, contract duration, supplier
              concentration, or pass-through capacity. The operating model also changes by market: most domestic,
              Singaporean, Malaysian, and Indian stores are company operated, whereas the Philippines and Australia use
              franchises and new markets are expected to default to franchising. Historical reporting also showed
              dependence on payment and delivery platforms; current economics by channel remain undisclosed.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be judged by disclosed outcomes rather than policy statements. The key quarterly
              monitors are net store additions by ownership model, mature-store sales and cash payback, operating cash
              flow after capex, coffee-cost exposure net of hedges, app share with repeat cohorts, and franchise quality
              exceptions. Thesis-break triggers are: rollout continuing without audited cash generation or cohort
              payback; material same-store deterioration while outlet count rises; an inability to evidence licenses,
              privacy controls, or incident response in a launch market; sustained input inflation without pricing or
              margin offsets; or franchise growth that outpaces audit and remediation capacity. The 4,000-store goal is
              not itself evidence of failure, but missing control metrics as capital deployment accelerates would make
              the growth thesis unmonitorable.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profit is not expansion cash
            body: >-
              Management's unaudited 2025 profit claim does not disclose operating cash flow, capex, lease commitments,
              or store-cohort payback; those items should gate reliance on the stated self-funding plan.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR016
          - type: callout
            title: Gate rollout on auditable operating evidence
            body: >-
              Require audited cash generation, mature-store cohorts, hedge coverage, franchise audit results, and
              jurisdictional license and privacy-control matrices before underwriting the 2030 footprint target.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The refreshed evidence supports a track recommendation, high execution risk, and a stretched valuation
              stance rather than a buy. Business Times reported in September 2025 that existing backers were considering
              partial stake sales at an indicative US$1.2-US$1.4 billion valuation, but also said deliberations were
              early, sizes were undecided, and no sale was certain. Against the unaudited 2025 revenue and net-profit
              figures reported by IDN Financials and Forbes, that range equates to roughly 6.5-7.6 times revenue and
              71-82 times net profit. These are transaction-implied reference multiples, not a confirmed clearing price,
              public-market comparable, or audited valuation. Entry should therefore wait for a material evidence
              upgrade: audited consolidated accounts, a disclosed cap table and preference stack, and a priced
              transaction whose rights and dilution can be evaluated.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on operating proof rather than software-like economics. Kopi Kenangan reported 1,324
              outlets across six countries at year-end 2025, acquired 4.47 million new digital customers during the
              year, and reached 1.5 million monthly transacting digital users in December. Its grab-and-go,
              affordable-premium format and app-led ordering can support density, convenience, and repeat purchasing.
              The anti-thesis is that this remains a capital- and execution-intensive consumer chain: management halted
              expansion of three experimental formats, public complaint entries show promotion and service-friction
              risk, and the 4,000-store goal requires a much larger network. Scale and a recognizable brand are
              investable strengths, but the evidence does not establish durable unit-level returns or a moat sufficient
              to justify the reported secondary range by itself.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario discipline should be qualitative where the source pool does not support precise probabilities or
              a conventional comparable-company range. The bull case can tolerate the reported US$1.2-US$1.4 billion
              reference only if audited results confirm profitable growth, new stores preserve economics, and cash flow
              funds expansion without unfavorable dilution. The base case requires an entry below that range because
              2025 profit was the first reported full-year group profit and the current figures are unaudited. The bear
              case has no investable price from public evidence: margin pressure from coffee inputs, failed format
              experiments, or international rollout costs could reverse profitability. USDA's forecast for an 8% decline
              in Indonesian green bean production reinforces the need to diligence sourcing, hedging, and
              price-pass-through before underwriting margin expansion.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness, final diligence, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Management told Forbes that the company is IPO-ready from a governance perspective while calling timing
              and size premature, and said a planned US$200 million expansion would be funded from cash flow under
              internal projections. Those statements are encouraging but not substitutes for independent readiness
              evidence. Before investment, obtain audited 2025 and year-to-date 2026 consolidated statements, country
              and store cohorts, same-store sales bridges, cash and debt schedules, capex per opening, store payback,
              closure rates, franchise obligations, commodity hedge policy, and the fully diluted cap table with all
              preference rights. Thesis-break triggers include renewed group losses, negative operating cash flow during
              expansion, repeated missed store cohorts, a down round with punitive preferences, or evidence that input
              inflation cannot be passed through without damaging demand.
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              The company can be operationally attractive and still be an unattractive investment at a price that
              capitalizes one unaudited profitable year at roughly 71-82 times earnings.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV015
          - type: callout
            title: Public evidence does not resolve private-market rights
            body: >-
              A headline valuation cannot establish common-equivalent value without the security class, liquidation
              preferences, dilution, governance rights, and transaction status.
            calloutType: risk
            claimRefs:
              - CV001
