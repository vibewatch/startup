      - number: '1.4'
        title: 里程碑、雄心与不利执行信号
        blocks:
          - type: paragraph
            body: >-
              公司从 2017 年雅加达首店起步，2018 年末达到 50 家门店，2019 年再开 150 家，随后获得机构融资并向区域扩张。管理层目前目标是 2030 年达到 4,000 家门店，这需要在公司披露的
              1,200 多家门店基础上继续大幅执行。2026 年 4
              月，一封客户来信称店内数字菜单展示的买一赠一促销无法兑换；页面称尚未收到公司回应。单一投诉不能证明发生率或系统性不当行为，但它具体指向促销同步和客户补救控制，应逐店验证后再判断能否加快扩张。
