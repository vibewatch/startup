    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与运营规模
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 2017 年围绕雅加达的即取即走模式创立，定位介于低价本地咖啡和国际高端连锁之间。留存证据描述的是紧凑门店和平价产品，并由移动点单强化，而非传统堂食模式。截至 2026 年 10
              月，采访报道将公司在印度尼西亚、马来西亚和新加坡的门店归因于公司，称其超过 1,200 家，员工超过 10,000 人，2025 年 7 月 1 日至 2026 年 6 月 30 日的总收入为 Rp3.7
              trillion。这些是公司披露的运营指标，不是经审计数据。另一份 2025 年资料称 70% 的订单通过手机下单，支持数字分销逻辑，但渠道经济性和用户群行为仍未验证。
