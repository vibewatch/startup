  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局不止于品牌咖啡连锁。Kopi Kenangan 直接面对印度尼西亚同业 Fore Coffee、Janji Jiwa 和 Tomoro，也面对全球高端老牌品牌 Starbucks 以及 Mixue
              等价值型饮品网络。买家还可以选择路边咖啡、袋装速溶咖啡、独立咖啡馆、家庭制作、仅配送品牌，或不购买，因此门店数量并不会形成被锁定的需求。尽管如此，当前报道仍将 Kopi Kenangan
              置于印度尼西亚连锁咖啡群体前列：CoffeeTalk 报道其国内门店 1,136 家、海外 188 家；KR Asia 描述其印度尼西亚门店超过 1,100 家，而 Janji Jiwa 约 900
              家、Tomoro 600 家、Starbucks 略超 500 家。这些数字的发布时点和定义不同，因此只能说明数量级，不能构成完全同步的排名。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
              - CP010
