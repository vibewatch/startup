  - id: FI001
    title: 有公开证据支持的收入模型桥接
    type: flow
    summary: 该模型将平价需求连接到直营点单和紧凑履约，再在直营与伙伴运营形态之间拆分运营暴露，最终抵达收入来源；毛利转化仍未披露。
    data:
      nodes:
        - id: demand
          label: 平价高端需求
          detail: 引用的饮品价格为 IDR20,000-22,000
        - id: order
          label: 点单与会员渠道
          detail: App 预点单、支付、取货、通知和积分
        - id: fulfillment
          label: 紧凑履约
          detail: 据报道，85% 的门店是即取即走小亭
        - id: ownership
          label: 直营或伙伴运营
          detail: 核心市场主要直营；部分市场采用加盟或授权
        - id: streams
          label: 饮品与即饮销售
          detail: RTD 销量在 2025 年从低基数增长至三倍
        - id: gross-profit
          label: 毛利转化
          detail: 未按产品、渠道或国家公开披露
    approximationNotes: 该有序流程反映已报告的商业机制，并非经审计的收入确认、比例经济性、转化率或量化毛利桥接。
    claimRefs:
      - CI008
      - CI009
      - CI011
      - CI012
      - CI013
      - CI016
  - id: FE001
    title: 产品依赖与控制栈
    type: stack
    summary: 客户承诺依赖六个相互连接的层级，但在可见 App 表层之下，公开控制证据逐层减弱。
    data:
      layers:
        - label: 客户体验
          detail: 发现门店、定制、点单、支付、进度通知、取货和会员体系。
          items:
            - iOS 应用
            - Android 应用
            - Hearts 会员
        - label: 数字商务
          detail: 订单状态、支付编排、促销和定时制作。
          items:
            - 结账
            - 无现金支付
            - 优惠与通知
        - label: 门店执行
          detail: 销售点集成、咖啡师制作和专用取货交接。
          items:
            - 销售点
            - 制作计时
            - 取货区
        - label: 企业系统
          detail: 已宣布的 RISE with SAP 层，覆盖 ERP、管理、库存、供应链和财务。
          items:
            - SAP S/4HANA Cloud
            - 管理系统
            - 库存控制
        - label: 供应与产品
          detail: 咖啡和棕榈糖采购、本地食品供应商及即饮形态。
          items:
            - 原料
            - 本地生产商
            - RTD 产品组合
        - label: 信任与韧性
          detail: 隐私、权限治理、安全性、正常运行时间、质量保证和事件响应大多仍未验证。
          items:
            - 数据治理
            - 可靠性
            - 食品质量控制
    approximationNotes: 仅为概念性依赖排序；不代表未记录的系统接口或部署已经完成。
    claimRefs:
      - CE004
      - CE005
      - CE011
      - CE014
      - CE015
  - id: FU001
    title: 从 App 到门店的客户互动闭环
    type: journey-map
    summary: 可观察的旅程连接数字获客、点单、线下履约、奖励和本地化扩张，但留存尚未测量。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 通过门店、应用商店分发或促销找到品牌。
          touchpoints:
            - Outlets
            - App store
            - Digital marketing
          value: 7.4 million tracked Android installs
          note: 累计安装量不等于活跃客户。
        - id: acquire
          label: 获客
          detail: 作为新获取的客户进入数字生态。
          touchpoints:
            - App registration
            - Offer
            - First order
          value: 4.47 million reported new customers in 2025
          note: 去重和获客成本未披露。
        - id: order
          label: 点单
          detail: 选择取货或配送，通过手机或门店完成交易。
          touchpoints:
            - Mobile order
            - Pickup
            - Delivery
            - Cashless payment
          value: 70 percent of orders reportedly placed by cellphone
          note: 直营 App 与第三方聚合平台的份额未拆分。
        - id: fulfill
          label: 履约
          detail: 通过不断扩大的实体网络完成订单服务。
          touchpoints:
            - Barista
            - Pickup area
            - Delivery handoff
          value: 1,324 outlets at end-2025
          note: 成熟门店吞吐量和客户数未披露。
        - id: reward
          label: 奖励
          detail: 使用积分、代金券和会员等级鼓励再次下单。
          touchpoints:
            - Points
            - Vouchers
            - Membership
          value: Five membership levels described in the app listing
          note: 兑换经济性和等级迁移未披露。
        - id: localize-and-return
          label: 本地化与回访
          detail: 在下次到访前，按本地需求调整口味、配方和价格。
          touchpoints:
            - Localized menu
            - Personalized offer
            - Repeat visit
          value: Six-country footprint at end-2025
          note: 没有公开的群组留存或复购率验证回访环节。
    approximationNotes: 有序的定性旅程；数值保留原始期间和分母，并非转化漏斗。
    claimRefs:
