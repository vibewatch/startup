      - CU003
      - CU005
      - CU007
      - CU009
      - CU010
      - CU015
  - id: FR001
    title: 基于证据的剩余风险热力图
    type: matrix
    summary: 扩张融资和商品暴露排名最高；合规、加盟质量、竞争和数字留存仍然重要，但量化程度较低。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 基于当前证据的定性评估
        - id: impact
          label: 影响
          detail: 对投资论点的潜在后果
        - id: mitigation
          label: 缓释成熟度
          detail: 有公开证据支持的响应成熟度
      rows:
        - label: 扩张与自我融资
          note: 4,000 家门店目标和拟议的 $200 million 投资
          values:
            - value: High
            - value: High
            - value: Developing
        - label: 咖啡原料波动
          note: 基准价格一个月内上涨 12.63%，截至 20 October 2026
          values:
            - value: High
            - value: High
            - value: Active but unquantified
        - label: 跨境合规
          note: 未指定主要审批和许可证证据
          values:
            - value: Medium
            - value: High
            - value: Undisclosed
        - label: 加盟质量控制
          note: 加盟是新市场计划中的默认模式
          values:
            - value: Medium
            - value: High
            - value: Undisclosed
        - label: 数字留存与可靠性
          note: 据报道 App 销售占比接近一半，但缺乏群组证据
          values:
            - value: Medium
            - value: Medium
            - value: Partial
        - label: 印度尼西亚税务与工资合规
          note: 规则是公开的；公司特定合规情况尚未验证
          values:
            - value: Medium
            - value: Medium
            - value: Undisclosed
    approximationNotes: 序数标签是分析分类，并非测量得出的概率或损失估计；指定证据中没有事件数量。
