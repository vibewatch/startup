      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              直接付款方和用户通常是同一个人，预算所有者是消费者而非企业采购部门。证据指向办公室职员、学生及其他追求便利、本地口味和平价升级的年轻城市消费者。用户可以先从附近小亭或聚合平台开始，转向公司应用预点单，再通过会员和促销加深使用。Coffee
              Intelligence 报道称截至 2022 年 7 月应用用户达 2.3 million，并转述公司称当时数字渠道贡献 70% 的销售额。PowerCommerce
              另称应用数据用于个性化营销，但其商业博客证据质量较低，无法证明当前留存或增量支出。
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与时点
        blocks:
          - type: paragraph
            body: >-
              需求受到中产阶级增长、相较其他亚洲市场偏低的人均咖啡消费，以及把平价饮品放在日常客流附近的门店模式支持。运营目标很大：2026 年报道称门店超过 1,200 家，管理层目标为 2030 年 4,000
              家。该目标是扩张计划，不是市场容量证据。真正的约束在投入品经济性。USDA 预测印度尼西亚绿豆产量在 2026/27 年因过度降雨下降 8% 至 11.38 million
              袋，而烘焙商利润率已受到绿豆价格上涨挤压。分散的小农供应基础、出口需求、天气波动、本地化要求和监管执行，都可能放慢扩张，或迫使公司在价格、采购和产品组合之间取舍。
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 估值相关性与尽调重点
        blocks:
          - type: paragraph
            body: >-
              市场逻辑支持门店继续增长，但不支持基于广义 Redseer 数字的自上而下收入估值。投资者应评估城市层面的门店密度、客单频次、贡献利润和回本期，而不是把全国咖啡 CAGR 直接套到公司。4,000
              家门店目标需要证明新增商圈在扩张超出最密集城市走廊后仍能保持吞吐量。优先尽调应取得底层 Redseer 分类、按渠道和地域划分的交易级销售、门店群组、客户频次和商圈层面的蚕食情况；还应根据 USDA
              当前供应展望，对绿豆、牛奶、棕榈糖、人工、租金和配送佣金通胀进行压力测试。在这些数据到位前，链条特定的 SAM、SOM 和采用时点仍是重大未决问题。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM012
              - CM016
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 广泛增长不等于门店层面容量
            body: 11% 的市场预测和 4,000 家门店目标来自不同发布方，方法和分母也不同；两者都不能替代商圈、蚕食、贡献利润或回本证据。
            calloutType: risk
