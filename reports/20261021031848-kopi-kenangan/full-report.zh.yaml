  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场小于印度尼西亚全部咖啡支出。Kopi Kenangan 直接争夺的是城市消费者在外购买的现制饮品：他们希望原料和品牌优于街边摊速溶咖啡，但不愿支付国际连锁的价格。Coffee Intelligence
              将最初的价格梯度描述为：街边摊约 $0.20、精品咖啡 $3、Starbucks 超过 $5，而 Kopi Kenangan 2017 年为
              $1.20。因此，边界包括平价高端现制饮品、应用或配送订单以及搭售食品，但不包括家庭咖啡豆、大部分速溶咖啡和高端堂食场景的全部价值。街边摊、家庭制作和更高价咖啡馆仍是现状替代品，不属于同质化的可服务池。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM014
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              目前有两种视角，但不能合并成可靠的公司 TAM。Coffee Post 将印度尼西亚咖啡市场预测归于 Redseer，称其从 2024 年的 $6.7 billion 增至 2030 年的 $12.6
              billion，CAGR 为 11%；指定证据未包含底层报告和品类定义，因此这只是二手估计。USDA 另预测 2026/27 年国内咖啡消费量为 4.83 million 袋、每袋 60
              kilogram，其中烘焙研磨咖啡 3.28 million 袋、速溶咖啡 1.55 million 袋。这些商品量可作为需求分母，但没有披露现制饮品零售支出、Kopi Kenangan
              的覆盖城市、价格带、渠道组合或可获得份额。因此，精确的 SAM 或 SOM 会夸大公开证据能够支持的结论。
            claimRefs:
              - CM003
