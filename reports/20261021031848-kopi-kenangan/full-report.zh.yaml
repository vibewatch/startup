  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据为正面，但估值和私营公司证据缺口使建议仍停留在跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 截至 2025 年底，六个国家共有 1,324 家已报告门店
        - id: profitability
          label: 盈利证据
          detail: 未经审计的 2025 年集团净利润为 US$17 million，收入为 US$184 million
        - id: digital
          label: 数字证据
          detail: December 2025 的月度交易数字用户为 1.5 million
        - id: valuation
          label: 估值检验
          detail: 据报道的 US$1.2-US$1.4 billion 二级市场区间意味着较高的收入和盈利倍数
        - id: risk
          label: 风险调整
          detail: 商品、竞争、落地、客户摩擦和私募市场不透明度
        - id: recommendation
          label: 跟进
          detail: 等待经审计的财务报表、交易条款、单位经济模型和股权结构表权利
    approximationNotes: 仅表示有序的分析步骤；节点顺序不代表概率、规模或转化率。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV012
      - CV014
      - CV015
