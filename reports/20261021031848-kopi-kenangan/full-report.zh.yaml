        blocks:
          - type: paragraph
            body: >-
              引用管理层和共享未经审计文件的第三方报道显示，2025 年集团收入为 US$184 million，同比增长 45%，净利润为 US$17
              million，是首个完整年度集团盈利。改善已覆盖两个核心运营市场：印度尼西亚披露净收入 IDR2.3 trillion，同店销售增长约 15%，净利润 IDR377 billion；马来西亚披露收入 RM111
              million、EBITDA RM17 million。这些数字说明门店扩张并未阻止据报盈利，但仍是未经审计的公开数据，不能替代合并财务报表。地域集中度仍然很高：管理层将 75% 的收入归于印度尼西亚、15%
              归于马来西亚，使这两个市场成为当前财务质量的主要驱动因素。
