      - number: '1.3'
        title: 资本历程与潜在流动性
        blocks:
          - type: paragraph
            body: >-
              目前证据支持度最高的融资节点，是据报 2020 年 US$109 million 轮融资，以及 2021 年由 Tybourne Capital Management 领投、首轮金额 US$96 million
              且估值超过 US$1 billion 的 Series C。由于证据没有列出此前每一轮融资，这两笔披露金额不能视为累计融资总额。2025 年 9 月，彭博社联合报道称 GIC 和 Peak XV 正考虑以
              US$1.2 billion 至 US$1.4 billion 的潜在估值出售部分持股，但无法确认交易一定发生。2026 年，《华尔街日报》另报银行已就最高 US$1.0 billion
              的潜在上市展开早期讨论，同时强调时间和规模尚未确定。这些是无约束力的估值指示，不是成交价，也不是公司可用现金。
