      - number: '1.2'
        title: 领导层、创始人匹配度与治理限制
        blocks:
          - type: paragraph
            body: >-
              联合创始人兼 CEO Edward Tirtanata 受过金融和会计训练，并在雅加达 Ernst & Young 任职；资料还将其定价纪律与早期大宗商品业务失败联系起来。联合创始人兼首席营销官 Cynthia
              Chaerunnisa 据描述拥有覆盖 Foodpanda、Lolabox、Sephora、Uber 和 Shopee 的电商与消费者营销经验。两人             
              的背景覆盖融资、定价、消费者获客和本地化，也显示出明显的创始人依赖：现有证据反复将据称的战略和增长主张集中归于
              Tirtanata。指定来源无法确认法定总部、完整高管团队、董事会构成、投票控制权、保留事项或继任安排，因此仅凭公开证据无法评估治理质量。
            claimRefs:
              - CO012
              - CO013
