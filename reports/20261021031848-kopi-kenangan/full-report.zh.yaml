      - number: '3.2'
        title: 能力与分销
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 最强的差异化来自一套运营组合，而不是独特产品：本地共鸣的饮品、紧凑且高吞吐的门店、自有应用、会员促销和密集分销。KR Asia 报道称，印度尼西亚连锁普遍使用本地口味、低于
              Starbucks 的价格，以及位于办公区和交通枢纽的小型门店。因此，组合中的多个部分是品类惯例，而非专有优势。Kopi Kenangan
              仍可能以更大规模执行这一组合，管理层也称其应用和现代管理系统提高了单店销售。然而，留存证据没有提供 Fore、Janji Jiwa 或 Tomoro 当前的独立功能审计，PowerCommerce
              关于市场定制的说法也只是低信誉二手摘要。因此，证据池缺乏直接文件的能力项标为未知，而不是从品牌声誉推断。
            claimRefs:
              - CP006
              - CP007
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: 价格与包装
        blocks:
          - type: paragraph
            body: >-
              价格是价值主张的核心，但公开比较陈旧且地域不均衡。Tech in Asia 报道，2019 年 Kopi Kenangan 的招牌棕榈糖咖啡售价 IDR18,000，而 Starbucks tall latte
              为 IDR42,000；这一历史观察支持当时的平价优势，不能作为 2026 年当前价格主张。Mixue 在越南 VND10,000-30,000
              的价格区间可作为区域价值基准，但货币、市场、产品和税制差异使其不适合直接单位比较。没有留存来源披露 Kopi Kenangan、Fore、Janji Jiwa、Tomoro、Starbucks 和 Mixue
              的同期标准化购物篮。促销折扣和会员积分还会使标价与实际客单价进一步分离，因此在认定 Kopi Kenangan 仍占据平价高端价格带前，应取得门店收据和应用优惠。
            claimRefs:
              - CP002
              - CP006
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP011
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河最强之处在积累的规模、运营数据和执行纪律，但产品排他性或客户锁定较弱。一位接受 KR Asia 采访的新加坡客户称 Kenangan
              便宜且折扣多，但口味与其他咖啡馆相似，说明价值可以吸引试用，却不能阻止多平台消费。同一报道称，新国际市场通常需要两到三年才能盈利，并将 Luckin、ZUS Coffee、Cafe Amazon
              和本地品牌列为根深蒂固的替代品。Mixue 又带来不同威胁：庞大的加盟网络和垂直控制的供应链被其视为低价来源。Kopi Kenangan 的 4,000
              家门店目标可以扩大分销，但扩张本身不能证明留存或更优单店经济性。因此，持久优势取决于复购行为、门店贡献和本地化执行，而指定证据没有独立量化这些因素。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模领先本地现代咖啡群体
            body: 多份 2026 年报道称 Kopi Kenangan 的门店数超过指定印度尼西亚咖啡连锁同业，因此拥有采购、知名度和数据优势，尽管各方定义尚未完全统一。
            calloutType: strength
