              家门店，并称内部现金流无需新投资者资本即可支持该计划。这一说法与据报盈利方向一致，但公开证据无法支持投资判断，因为现金、债务、租赁负债、维护和增长资本开支、营运资金需求以及单店回本期均缺失。大宗商品敞口同样重要。USDA
