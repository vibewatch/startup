  - id: FP001
    title: 受证据约束的竞争定位图
    type: quadrant
    summary: 分析师仅依据保留证据，对价格可及性（x 轴，从低到高）和数字化或吞吐强度（y 轴，从低到高）进行序数定位。
    data:
      points:
        - label: Kopi Kenangan
          x: 4
          'y': 5
          detail: 平价高端定位、85% 即取即走门店占比、直营 App、会员体系和已报告的数字化执行。
        - label: Fore Coffee
          x: 4
          'y': 3
          detail: 定位低于 Starbucks 的本地连锁，采用紧凑形态；当前数字化证据不完整。
        - label: Janji Jiwa
          x: 4
          'y': 2
          detail: 具备规模的本地同业；保留证据无法证明其当前 App 或吞吐能力。
        - label: Tomoro Coffee
          x: 4
          'y': 3
          detail: 快速增长的区域本地连锁同业；能力细节仍不完整。
        - label: Starbucks
          x: 2
          'y': 2
          detail: 历史上属于高端价格基准和第三空间形态，而非紧凑型价值模式。
        - label: Mixue
          x: 5
          'y': 4
          detail: 低价、大规模加盟网络和一体化供应链；与咖啡业务的重叠有限。
    approximationNotes: 分数是 1 至 5 的分析师序数判断，并非测量得出的价格或表现。X 代表相对价格可及性，y 代表数字化或高吞吐运营强度；能力证据未知，因此精确度有限。
