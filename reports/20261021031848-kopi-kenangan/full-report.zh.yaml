          - type: paragraph
            body: >-
              缓解效果应以披露的结果而非政策表述判断。关键季度监测项包括按所有权模式划分的新开门店净增、成熟门店销售和现金回本、资本开支后的经营现金流、扣除对冲后的咖啡成本敞口、应用占比及复购群组，以及加盟质量例外。论点破坏触发器包括：扩张继续但没有经审计的现金生成或群组回本；门店数增加时同店表现明显恶化；在新市场无法证明许可证、隐私控制或事件响应；投入品持续通胀却没有价格或利润率抵消；或加盟增长超过审计和补救能力。4,000
              家门店目标本身不是失败证据，但资本部署加快而控制指标缺失，会让增长论点无法监测。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 利润不等于扩张现金
            body: 管理层未经审计的 2025 年盈利主张没有披露经营现金流、资本开支、租赁承诺或门店群组回本；这些项目应成为依赖其自我融资计划的前置门槛。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR016
          - type: callout
            title: 用可审计运营证据为扩张设门槛
            body: 在投资判断 2030 年门店目标前，应要求经审计现金生成、成熟门店群组、对冲覆盖率、加盟审计结果，以及按司法辖区划分的许可证和隐私控制矩阵。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              更新后的证据支持继续跟踪、接受较高执行风险和偏高估值，而非买入。Business Times 于 2025 年 9 月报道称，现有投资者正考虑按指示性 US$1.2-US$1.4 billion
              估值出售部分持股，但讨论尚处早期、规模未定，交易也并无确定性。按 IDN Financials 和 Forbes 报道的未经审计 2025 年收入与净利润计算，这一区间对应的收入倍数约为
              6.5-7.6x，净利润倍数为
              71-82。这些只是交易隐含的参考倍数，并非已确认的成交价、公开市场可比估值或经审计估值。因此，入场应等到证据有实质性升级：取得经审计的合并账目、披露的股权结构表和优先股堆叠，以及一笔能够评估权利与稀释影响的定价交易。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: 正论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正论点依赖运营证明，而不是软件式经济性。Kopi Kenangan 截至 2025 年末在六个国家拥有 1,324 家门店，年内新增 4.47 million 名数字客户，并在 12 月达到 1.5
              million
              月交易数字用户。其即取即走、平价高端模式和应用驱动的点单可以支持密度、便利性和复购。反论点是，这仍是一家资本密集且执行密集的消费连锁：管理层暂停了三种实验形式的扩张，公开投诉条目显示促销和服务摩擦风险，而
              4,000 家门店目标需要大得多的网络。规模和可识别品牌是可投资优势，但证据没有证明持久的单店回报或足以单独支撑所报二级市场区间的护城河。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              当证据池不支持精确概率或传统可比公司区间时，情景纪律应保持定性。只有在经审计结果确认盈利增长、新店保持经济性且现金流无需不利稀释即可支持扩张时，乐观情景才可以接受所报 US$1.2-US$1.4 billion
              参考估值。基准情景要求入场价低于该区间，因为 2025
              年利润是据报首个完整年度集团利润，且当前数字未经审计。悲观情景没有可由公开证据支持的可投资价格：咖啡投入品带来的利润率压力、失败的形式实验或国际扩张成本，都可能逆转盈利。USDA 预测印度尼西亚绿豆产量下降
              8%，进一步说明在判断利润率扩张前，必须尽调采购、对冲和价格传导。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备、最终尽调与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              管理层向 Forbes 表示，从治理角度公司已准备好 IPO，但时点和规模尚早，并称计划中的 US$200 million
              扩张将依据内部预测由现金流支持。这些表述令人鼓舞，但不能替代独立的准备度证据。投资前应取得经审计的 2025 年和 2026
              年年初至今合并报表、国家和门店群组、同店销售桥接、现金和债务明细、每家新店资本开支、门店回本期、关闭率、加盟义务、大宗商品对冲政策，以及包含全部优先权的完全摊薄股权结构表。论点破坏触发器包括集团再次亏损、扩张期间经营现金流为负、门店群组反复未达标、带惩罚性优先权的下轮融资，或投入品通胀无法在不损害需求的情况下传导。
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是闸门变量
            body: 即使公司运营上有吸引力，如果价格把一个未经审计的盈利年度资本化到约 71x-82x 市盈率，它仍可能是不具吸引力的投资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV015
          - type: callout
            title: 公开证据无法解决私人市场权利
            body: 没有证券类别、清算优先权、稀释、治理权利和交易状态，表面估值不能证明普通股等价价值。
            calloutType: risk
            claimRefs:
              - CV001
