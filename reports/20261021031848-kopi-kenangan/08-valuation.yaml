artifact: valuation
slug: kopi-kenangan
runDate: 2026-10-21
company:
  name: Kopi Kenangan
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kopi Kenangan has crossed into reported group profitability and continues to
    scale, but the latest fetched price reference is only a non-binding
    US$1.2-US$1.4 billion secondary-sale range. That range implies approximately
    6.5-7.6 times 2025 revenue and 71-82 times 2025 net profit, so the
    recommendation remains track with a stretched valuation stance until audited
    financials, transaction terms, store economics, and the preference stack are
    available.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The refreshed evidence supports a track recommendation, high execution risk,
      and a stretched valuation stance rather than a buy. Business Times reported
      in September 2025 that existing backers were considering partial stake sales
      at an indicative US$1.2-US$1.4 billion valuation, but also said deliberations
      were early, sizes were undecided, and no sale was certain. Against the
      unaudited 2025 revenue and net-profit figures reported by IDN Financials and
      Forbes, that range equates to roughly 6.5-7.6 times revenue and 71-82 times
      net profit. These are transaction-implied reference multiples, not a
      confirmed clearing price, public-market comparable, or audited valuation.
      Entry should therefore wait for a material evidence upgrade: audited
      consolidated accounts, a disclosed cap table and preference stack, and a
      priced transaction whose rights and dilution can be evaluated.
    claimRefs: [CV001, CV002, CV003, CV004, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on operating proof rather than software-like economics.
      Kopi Kenangan reported 1,324 outlets across six countries at year-end 2025,
      acquired 4.47 million new digital customers during the year, and reached 1.5
      million monthly transacting digital users in December. Its grab-and-go,
      affordable-premium format and app-led ordering can support density,
      convenience, and repeat purchasing. The anti-thesis is that this remains a
      capital- and execution-intensive consumer chain: management halted expansion
      of three experimental formats, public complaint entries show promotion and
      service-friction risk, and the 4,000-store goal requires a much larger
      network. Scale and a recognizable brand are investable strengths, but the
      evidence does not establish durable unit-level returns or a moat sufficient
      to justify the reported secondary range by itself.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV014]
    tableRefs: [TV002]
  - id: scenario-valuation
    title: Bull, base, and bear scenarios
    body: >-
      Scenario discipline should be qualitative where the source pool does not
      support precise probabilities or a conventional comparable-company range.
      The bull case can tolerate the reported US$1.2-US$1.4 billion reference only
      if audited results confirm profitable growth, new stores preserve economics,
      and cash flow funds expansion without unfavorable dilution. The base case
      requires an entry below that range because 2025 profit was the first reported
      full-year group profit and the current figures are unaudited. The bear case
      has no investable price from public evidence: margin pressure from coffee
      inputs, failed format experiments, or international rollout costs could
      reverse profitability. USDA's forecast for an 8% decline in Indonesian green
      bean production reinforces the need to diligence sourcing, hedging, and
      price-pass-through before underwriting margin expansion.
    claimRefs: [CV003, CV004, CV005, CV006, CV008, CV010, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, final diligence, and thesis-break triggers
    body: >-
      Management told Forbes that the company is IPO-ready from a governance
      perspective while calling timing and size premature, and said a planned
      US$200 million expansion would be funded from cash flow under internal
      projections. Those statements are encouraging but not substitutes for
      independent readiness evidence. Before investment, obtain audited 2025 and
      year-to-date 2026 consolidated statements, country and store cohorts,
      same-store sales bridges, cash and debt schedules, capex per opening, store
      payback, closure rates, franchise obligations, commodity hedge policy, and
      the fully diluted cap table with all preference rights. Thesis-break triggers
      include renewed group losses, negative operating cash flow during expansion,
      repeated missed store cohorts, a down round with punitive preferences, or
      evidence that input inflation cannot be passed through without damaging
      demand.
    claimRefs: [CV001, CV006, CV010, CV012, CV013, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Track, "Reported profitability and scale are offset by an unconfirmed secondary valuation reference.", "Do not buy until price and rights are observable."]
      - [Confidence, Medium, "Two independent reports repeat unaudited 2025 revenue and profit figures, but audited statements are unavailable.", "Require financial verification before underwriting returns."]
      - [Risk rating, High, "Expansion, competition, commodity inputs, and format execution can all impair earnings.", "Use downside-first diligence and staged exposure."]
      - [Valuation stance, Stretched, "US$1.2-US$1.4 billion implies about 6.5-7.6x 2025 revenue and 71-82x 2025 net profit.", "Demand either a lower price or substantially stronger audited proof."]
    notes: "Multiples are analyst calculations using the reported secondary range and unaudited 2025 group revenue and net profit; they are not transaction terms or forecasts."
    claimRefs: [CV001, CV003, CV004, CV012, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Supporting signal, What would change the view]
    rows:
      - [Thesis, "Scaled affordable-premium format", "1,324 reported outlets across six countries at year-end 2025.", "Deteriorating mature-store cohorts or widespread closures would weaken the scale case."]
      - [Thesis, "Digital engagement can support repeat demand", "4.47 million new digital customers and 1.5 million monthly transacting digital users were reported for 2025.", "Weak retention, promotion dependence, or low owned-channel contribution would weaken the claim."]
      - [Anti-thesis, "Expansion execution remains unproven at the next scale", "Management targets 4,000 stores by 2030 after halting three experimental formats.", "Audited country cohorts and consistently short payback periods would reduce this concern."]
      - [Anti-thesis, "Customer and service friction can erode the brand", "A consumer-complaint index includes 2026 entries involving promotion accuracy and complaint handling.", "Low substantiated complaint rates and documented resolution performance would reduce this concern."]
    notes: "Scale and digital metrics are company-reported through independent publications; the complaint source is a non-exhaustive public index, not an incidence-rate study."
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Entry valuation discipline, Required assumptions, Probability signal, Downside trigger]
    rows:
      - [Bull, "US$1.2-US$1.4 billion only after evidence upgrades", "Audited profitable growth, cash-funded expansion, healthy new-store cohorts, and stable input margins", "Possible but not demonstrated by the fetched public evidence", "Expansion funding requires dilutive capital or store economics weaken"]
      - [Base, "Below US$1.2 billion; no precise floor is supportable", "Profitability persists but growth normalizes and valuation must compensate for private-company opacity", "Most consistent with current mixed evidence", "Audited profit or cash conversion falls materially below reported figures"]
      - [Bear, "No investable range; defer pending price discovery", "Coffee input pressure, competitive intensity, or rollout costs reverse profitability", "Material downside remains plausible", "Renewed group losses, negative operating cash flow, or a punitive down round"]
    notes: "The US$1.2-US$1.4 billion reference is a reported 2025 potential secondary-sale range, not a completed transaction; qualitative probability signals replace unsupported percentages."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV010, CV012, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "Operating proof is positive, but valuation and private-company evidence gaps keep the recommendation at track."
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: "1,324 reported outlets across six countries at year-end 2025"
        - id: profitability
          label: Profitability proof
          detail: "US$17 million unaudited 2025 group net profit on US$184 million revenue"
        - id: digital
          label: Digital proof
          detail: "1.5 million monthly transacting digital users in December 2025"
        - id: valuation
          label: Valuation test
          detail: "Reported US$1.2-US$1.4 billion secondary range implies high revenue and earnings multiples"
        - id: risk
          label: Risk adjustment
          detail: "Commodity, competition, rollout, customer-friction, and private-market opacity"
        - id: recommendation
          label: Track
          detail: "Wait for audited accounts, transaction terms, unit economics, and cap-table rights"
    approximationNotes: "Ordered analytical sequence only; node order is not a probability, magnitude, or conversion rate."
    claimRefs: [CV003, CV004, CV009, CV012, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Price is the gating variable
    body: >-
      The company can be operationally attractive and still be an unattractive
      investment at a price that capitalizes one unaudited profitable year at
      roughly 71-82 times earnings.
    claimRefs: [CV001, CV004, CV015]
  - calloutType: risk
    title: Public evidence does not resolve private-market rights
    body: >-
      A headline valuation cannot establish common-equivalent value without the
      security class, liquidation preferences, dilution, governance rights, and
      transaction status.
    claimRefs: [CV001]
