company:
  name: Kopi Kenangan
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kopi Kenangan addresses the gap between low-priced street coffee and premium
    international chains through small-format, digitally enabled outlets. The
    market has favorable demand signals, but public evidence does not isolate a
    chain-specific SAM or SOM, and USDA forecasts show weather-driven supply
    pressure that can constrain affordability.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market is narrower than all Indonesian coffee expenditure.
      Kopi Kenangan competes most directly for prepared, out-of-home beverages
      bought by urban consumers who want better ingredients and branding than
      street-vendor instant coffee without paying international-chain prices.
      Coffee Intelligence described the original price ladder as roughly $0.20
      at street stalls, $3 for specialty coffee, more than $5 at Starbucks, and
      $1.20 at Kopi Kenangan in 2017. The boundary therefore includes
      affordable-premium brewed drinks, app or delivery orders, and attached
      food purchases, while excluding household beans, most soluble coffee, and
      the full value of premium sit-down occasions. Street vendors, home
      preparation, and higher-priced coffeehouses remain status-quo substitutes,
      not part of a homogeneous addressable pool.
    claimRefs: [CM001, CM002, CM006, CM014]
    tableRefs: [TM001]
  - id: sizing-triangulation
    title: Evidence-constrained sizing
    body: >-
      Two lenses are available, but they cannot be collapsed into a defensible
      company TAM. The Coffee Post attributes to Redseer an Indonesian coffee
      market forecast rising from $6.7 billion in 2024 to $12.6 billion in 2030,
      an 11% CAGR; the underlying report and category definition were not in the
      assigned evidence, so this is a secondary estimate. USDA instead forecasts
      4.83 million 60-kilogram bags of domestic coffee consumption in 2026/27,
      split between 3.28 million roast-and-ground and 1.55 million soluble bags.
      Those commodity volumes are useful demand denominators but do not disclose
      prepared-beverage retail spend, Kopi Kenangan's eligible cities, price
      bands, channel mix, or attainable share. A precise SAM or SOM would
      therefore overstate what the public evidence supports.
    claimRefs: [CM003, CM004, CM005, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The immediate payer and user are usually the same individual, while the
      budget owner is the consumer rather than an enterprise procurement
      function. Evidence points to office workers, students and other younger
      urban consumers seeking convenience, local flavors, and an affordable
      upgrade. Adoption can begin through a nearby kiosk or aggregator, move to
      pre-ordering in the company app, and deepen through loyalty and promotions.
      Coffee Intelligence reported 2.3 million app users by July 2022 and relayed
      the company's claim that digital channels generated 70% of sales at that
      time. PowerCommerce separately describes app data being used for
      personalized campaigns, but its commercial blog is low-reputation evidence
      and does not establish current retention or incremental spend.
    claimRefs: [CM006, CM007, CM009, CM015]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and timing
    body: >-
      Demand is supported by a growing middle class, low coffee consumption per
      capita relative to other Asian markets, and a store format that places
      affordable drinks close to daily traffic. The operating ambition is large:
      2026 reporting cites more than 1,200 shops and a management target of 4,000
      by 2030. That target is an expansion goal, not evidence of market capacity.
      The binding constraint is input economics. USDA forecasts Indonesian green
      bean production to fall 8% to 11.38 million bags in 2026/27 after excessive
      rainfall, while roaster margins have already been squeezed by higher green
      bean prices. A fragmented smallholder supply base, export demand, weather
      volatility, localization needs, and regulatory execution can slow rollout
      or force price, sourcing, and product-mix tradeoffs.
    claimRefs: [CM008, CM010, CM011, CM012, CM013, CM015]
  - id: valuation-relevance-and-gaps
    title: Valuation relevance and diligence priorities
    body: >-
      The market case supports continued store growth but not a top-down revenue
      valuation based on the broad Redseer number. Investors should underwrite
      city-level outlet density, ticket frequency, contribution margin, and
      payback rather than applying the full national coffee CAGR to the company.
      The 4,000-store objective requires proof that new catchments preserve
      throughput while expansion extends beyond the densest urban corridors.
      Priority diligence should obtain the underlying Redseer taxonomy,
      transaction-level sales by channel and geography, store cohorts, customer
      frequency, and catchment-level cannibalization. It should also stress-test
      green-bean, milk, palm-sugar, labor, rent, and delivery-commission inflation
      under USDA's current supply outlook. Until those data exist, chain-specific
      SAM, SOM, and adoption timing remain material open questions.
    claimRefs: [CM003, CM008, CM010, CM012, CM016]
