      - ["Americano", "IDR20,000", "Per beverage; public menu example", "Supports affordable-premium positioning but not gross-margin inference"]
      - ["Street-cart instant coffee", "IDR8,000", "Per cup; market comparison", "Kopi Kenangan charges a premium to the informal substitute"]
      - ["Global coffee brands in Indonesia", "IDR35,000-50,000", "Per beverage range; market comparison", "Kopi Kenangan remains below international-chain pricing in the cited comparison"]
    notes: "Prices are reported public examples from 2026 coverage, not a complete current menu, realized basket, or net revenue after discounts, taxes, delivery fees, and loyalty redemptions."
    claimRefs: [CI007]
  - id: "TI003"
    title: "Unit economics and capital-adequacy screen"
    columns: ["Metric", "Public value or status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Group revenue", "US$184m in 2025; +45% YoY; unaudited", "Medium", "Establishes scale and growth", "Obtain audited consolidation and revenue-recognition policy"]
      - ["Group net profit", "US$17m in 2025; first reported full-year group profit; unaudited", "Medium", "Shows reported earnings inflection", "Reconcile to operating cash flow and normalized earnings"]
      - ["Indonesia revenue / same-store sales", "IDR2.3tn; +40% revenue and about +15% same-store sales in 2025", "Medium", "Separates organic growth from footprint expansion", "Provide traffic, ticket, pricing, and mature-store cohorts"]
      - ["Indonesia net income", "IDR377bn in 2025 versus IDR80bn in 2024", "Medium", "Core-market earnings support group profitability", "Provide country P&L, shared-cost allocation, and tax reconciliation"]
      - ["Malaysia revenue", "RM111m in 2025; nearly doubled YoY", "Medium", "Tests repeatability outside Indonesia", "Provide same-store sales, store maturity, and contribution margin"]
      - ["Malaysia EBITDA", "RM17m in 2025 versus RM5m in 2024 after a 2023 loss", "Medium", "Shows operating leverage before full net-profit conversion", "Reconcile EBITDA to lease-adjusted EBIT and cash flow"]
      - ["Gross margin", null, "Unavailable", "Determines pricing power and commodity sensitivity", "Provide product, channel, and country gross margins with input-cost bridge"]
      - ["Store capex and payback", null, "Unavailable", "Determines whether rapid rollout creates value", "Provide build cost, maintenance capex, four-wall EBITDA, and payback by cohort"]
      - ["Cash, burn, debt, and runway", null, "Unavailable", "Tests the claim that US$200m expansion is internally fundable", "Provide cash balance, debt and leases, covenant headroom, working capital, and downside runway"]
    notes: "Reported values are unaudited and management-derived; null means the assigned public evidence did not disclose the metric, not that the value is zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI014, CI015, CI016]
