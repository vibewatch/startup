      whyItMatters: "Unaudited profit cannot establish earnings quality, liquidity, leverage, or cash conversion."
      diligencePath: "Request the 2025 audited consolidated financial statements, auditor opinion, management accounts through the latest month, and a bridge from reported net profit to operating and free cash flow."
