    claimRefs: [CI008, CI009, CI011, CI012, CI013, CI016]
callouts:
  - calloutType: "risk"
    title: "Profitability is reported, but cash self-funding is not yet demonstrated"
    body: "Management's plan to fund a US$200 million expansion from cash flow cannot be reconciled without audited cash flow, cash, debt and lease schedules, capex, store payback, and commodity-cost sensitivities."
    claimRefs: [CI014, CI015, CI016]
