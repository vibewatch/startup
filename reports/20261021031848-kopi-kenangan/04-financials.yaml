company:
  name: "Kopi Kenangan"
chapter:
  number: 4
  title: "Financials"
  summary: "Kopi Kenangan reportedly reached its first full-year group profit in 2025, with unaudited revenue of US$184 million and net profit of US$17 million, while Indonesia and Malaysia both improved. The commercial model combines affordable beverages, compact stores, direct digital ordering, selectively franchised international markets, and a nascent ready-to-drink stream, but audited statements, gross margin, cash, debt, capex, and store payback remain unavailable for underwriting."
sections:
  - id: "revenue-and-regional-traction"
    title: "Revenue and regional traction"
    body: >-
      Third-party reports citing management and shared unaudited documents put 2025 group revenue at
      US$184 million, up 45% year on year, and net profit at US$17 million, the first full-year group
      profit. The improvement was broad enough to appear in both core operating markets: Indonesia
      reported IDR2.3 trillion of net revenue, with roughly 15% same-store sales growth, and IDR377
      billion of net income; Malaysia reported RM111 million of revenue and RM17 million of EBITDA.
      These are meaningful signs that store expansion did not prevent reported profitability, but they
      remain unaudited public figures rather than a substitute for consolidated financial statements.
      Geographic concentration also remains high: management attributes 75% of revenue to Indonesia
      and 15% to Malaysia, making those two markets the principal drivers of current financial quality.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI010]
    tableRefs: [TI001]
  - id: "pricing-channels-and-format"
    title: "Pricing, channels, and store format"
    body: >-
      Kopi Kenangan occupies an affordable-premium price band: reported menu prices of IDR22,000 for
      Kopi Kenangan Mantan and IDR20,000 for an Americano sit above street-cart instant coffee but
      below global-chain prices. The cost architecture is designed around compact throughput, with 85%
      of outlets described as grab-and-go kiosks without seating. Its app adds prepaid pickup,
      customization, cashless payment, order-status notifications, and loyalty, so it should support
      frequency and first-party demand data rather than constitute a separate revenue stream. Public
      channel metrics are not directly comparable: one report says the app is close to half of sales,
      while another says 70% of orders are placed by mobile phone. Realized basket size, discounts,
      delivery commissions, loyalty redemption cost, and owned-versus-aggregator mix are not disclosed.
    claimRefs: [CI007, CI008, CI009, CI011]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: "margin-drivers-and-capital"
    title: "Margin drivers and capital intensity"
    body: >-
      Management plans to invest US$200 million to reach 4,000 stores by 2030 and says internal cash
      flow can fund the program without new investor capital. That assertion is directionally
      consistent with reported profitability, but it cannot be underwritten from public evidence
      because cash, debt, lease liabilities, maintenance and growth capex, working-capital needs, and
      store-level payback are absent. Commodity exposure is also material. USDA forecasts an 8% fall in
      Indonesian green-bean production for 2026/27 and reports that higher green-bean prices have
      squeezed local roaster margins. Management says it is diversifying sourcing, hedging futures,
      and buying cups directly from factories, but the financial effect of those mitigations is not
      quantified. Franchise and licensing expansion may reduce capital needs in selected new markets,
      while company-owned expansion in Indonesia and Malaysia preserves more operating exposure.
    claimRefs: [CI012, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: >-
      Revenue quality appears stronger than in prior loss-making years because reported group profit,
      same-store growth, positive Malaysian EBITDA, app-led demand, and a geographically diversified
      footprint now coexist. The ready-to-drink line adds a potentially asset-lighter channel, although
      its tripling of units in 2025 came from an undisclosed low base and no revenue contribution was
      provided. The core concern is evidence quality, not the direction of the headline metrics:
      profitability figures are unaudited, digital-channel statistics use inconsistent denominators,
      and there is no public bridge from revenue to gross profit, operating cash flow, or free cash
      flow. Investment underwriting therefore requires audited consolidated accounts, country and
      channel contribution margins, store cohorts, capex and payback, cash and debt schedules, and a
      downside plan for coffee-input inflation before treating the expansion program as self-funded.
    claimRefs: [CI001, CI002, CI006, CI009, CI013, CI014, CI015, CI016]
