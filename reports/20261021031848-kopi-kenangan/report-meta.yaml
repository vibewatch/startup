  topStrengths:
    - Reported 1,324-outlet footprint across six countries at year-end 2025.
    - Reported first full-year group profit in 2025 on US$184 million of revenue.
    - App-led ordering and 1.5 million monthly transacting digital users support direct customer engagement.
  topRisks:
    - >-
      The 4,000-store target and US$200 million expansion plan are not supported by audited cash flow or store-cohort
      payback evidence.
    - >-
      Coffee-input volatility, cross-border compliance, and franchise-control demands could pressure margins and
      execution.
    - The indicative US$1.2 billion-US$1.4 billion secondary range implies stretched multiples on unaudited earnings.
    - Governance, security rights, and the current cap table remain opaque.
  unresolvedGaps:
    - Audited consolidated financial statements, cash and debt balances, capex, and store-cohort payback.
    - A completed priced transaction plus the fully diluted cap table, preference stack, and governance rights.
    - Customer retention cohorts, owned-versus-aggregator channel economics, and loyalty costs.
    - >-
      Primary licenses, regulator and court records, privacy controls, security assessments, and incident logs by
      market.
