companyProfile:
  summary: >-
    Founded in Jakarta in 2017, Kopi Kenangan operates an affordable-premium coffee model centered on compact takeaway
    stores, mobile ordering, loyalty, and localized menus. The company reported 1,324 outlets across six countries at
    year-end 2025 and its first full-year group profit in 2025, but audited accounts and complete governance records are
    not public.
