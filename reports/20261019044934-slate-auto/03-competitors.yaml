  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: service-model-gap
      missingEvidence: Nationwide service-footprint data, warranty SLAs, and delivered-vehicle repair performance for Slate's direct-sales and service-partner model.
      whyItMatters: Service execution determines whether Slate can overcome incumbent trust advantages and whether accessory-led GTM scales beyond reservations.
      diligencePath: Obtain service-network maps, warranty documents, and early post-delivery repair metrics from management or launch partners.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: configured-pricing
      missingEvidence: A full public configured-pricing comparison for realistic Slate builds versus compact pickups and mainstream EV substitutes.
      whyItMatters: The base MSRP headline may overstate Slate's durable price advantage if battery, SUV-kit, or accessory bundles push realized pricing closer to incumbents.
      diligencePath: Capture official configurator outputs and dealer-independent transaction comparisons once public ordering opens.
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: minor
      topic: direct-peer-landscape
      missingEvidence: Competitor-official product and pricing pages for direct minimalist EV truck peers, if any emerge.
      whyItMatters: The current chapter is forced to benchmark Slate mostly against substitutes and incumbent responses rather than a clean direct-peer set.
      diligencePath: Re-run competitor-specific source discovery after launch to capture official surfaces for any named low-cost EV truck entrants.
