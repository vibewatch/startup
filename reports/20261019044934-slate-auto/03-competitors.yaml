        label: Affordability advantage (higher is cheaper upfront)
        min: 1
        max: 5
        lowLabel: Low
        highLabel: High
      yAxis:
        label: Manufacturing and service maturity
        min: 1
        max: 5
        lowLabel: Early
        highLabel: Mature
      points:
        - label: Slate Auto
          x: 5
          y: 2
        - label: Compact ICE / hybrid pickups
          x: 3
          y: 5
        - label: Ford F-150 Lightning
          x: 2
          y: 4
        - label: Tesla Model 3 / mainstream long-range EVs
          x: 1
          y: 5
        - label: Ford small EV truck (2027)
          x: 3
          y: 3
        - label: EV startup cohort benchmark
          x: 2
          y: 1
    approximationNotes: >-
      Ordinal 1-5 coordinates synthesize cited evidence on advertised base pricing,
      range/feature tradeoffs, public production status, and service maturity. They are
      not benchmark scores or measured market-share positions.
    claimRefs: [CP001, CP003, CP007, CP009, CP010, CP011, CP014, CP015]
callouts:
  - calloutType: insight
    title: Modularity widens the comparison set
    body: >-
      Slate is not just another electric pickup. Its blank-slate packaging and
      SUV-conversion kits mean buyers can compare it against compact pickups,
      low-end EVs, and even budget crossovers depending on the accessory bundle.
    claimRefs: [CP001, CP004, CP007]
  - calloutType: risk
    title: Incumbents can answer the thesis if demand is proven
    body: >-
      Slate may prove that an affordable, smaller EV truck has demand, but Ford's
      upcoming small EV truck and the broader push toward lower-cost EV models mean
      the affordability wedge is not necessarily durable once larger manufacturers
      decide to compete on the same job to be done.
    claimRefs: [CP009, CP010, CP014]
