  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Reservation funnel conversion, CAC by channel, attach-rate by accessory, and service-partner revenue splits.
      whyItMatters: Without this data, the company can show demand interest but not efficient customer acquisition or profitable monetization per customer.
      diligencePath: Request cohort-level reservation, preorder, and delivered-order data with marketing spend and install-partner economics.
      relatedQuestionRefs: [QI006]
    - type: private-evidence-only
      severity: material
      topic: runway
