schemaVersion: report-v2
artifact: financials
slug: slate-auto
runDate: 2026-10-19
company:
  name: Slate Auto
chapter:
  number: 4
  title: Financials
  summary: >-
    Slate Auto's public financial story is still a launch-stage underwriting case built on list
    pricing, accessory upsell, and a simplified manufacturing thesis rather than disclosed revenue,
    margins, or runway. Public reporting supports meaningful capital backing and an unusually low
    price point, but the decisive variables for underwriting remain preorder conversion, realized
    ASP after options, production ramp execution, and cash consumption into scale.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Public evidence points to a deliberately simple revenue stack: a low-entry-price base truck,
      optional SUV conversion, and a long tail of accessories installed either by the owner or a
      service partner. That architecture matters because Slate is not disclosing recognized revenue,
      so the observable financial model is really a list-pricing model plus attach-rate assumptions.
      Public coverage consistently places the base vehicle in the mid-$20,000s before options, with
      some reporting framing the launch headline as below $25,000 and others tying the sub-$20,000
      message to a now-uncertain federal tax credit. The upside is a broader top-of-funnel than most
      EV startups can claim; the downside is that public evidence still does not show realized ASP,
      option take-rates, discounting, or refund behavior once deposits convert into binding orders.
    claimRefs: [CI004, CI005, CI006, CI007, CI009, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-capital-needs
    title: Cost structure and capital needs
    body: >-
      Slate's economics pitch is that one base vehicle, later-stage customization, wrap-based
      finishing, and fewer factory permutations can lower capital intensity relative to a
      multi-trim launch. Public reporting supports pieces of that thesis: independent coverage
      describes a single-SKU strategy, and Slate's own site highlights a large accessory catalog
      priced mostly below $500, which is consistent with shifting monetization toward post-factory
      upsell. Capital needs are still meaningful, however. Electrek reported roughly $400 million of
      planned investment in the Warsaw plant, while TechCrunch and MIT Technology Review frame the
      broader business as already funded with roughly $1.4 billion raised. That is substantial
      financing, but not proof of adequacy: public sources still do not disclose cash on hand,
      monthly burn, warranty reserve assumptions, supplier concentration, or the working-capital
      requirements for ramping a physical vehicle business.
    claimRefs: [CI001, CI002, CI003, CI006, CI007, CI008, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: traction-risk-and-underwriting-view
    title: Traction, risk, and underwriting view
    body: >-
      Slate's public traction signal is demand intent, not revenue quality. Sources cite more than
      160,000 refundable reservations and, later, thousands of preorders, which is directionally
      encouraging but still leaves the core financial conversion questions open: how many deposits
      become firm orders, what accessory mix lifts realized ASP, and how much service and warranty
      cost the stripped-down vehicle model actually carries. The delivery target remains late 2026,
      so revenue recognition still depends more on factory execution than on marketing narrative.
      The adverse evidence also matters: public reviewers explicitly warn that removing incentives
      pushes the entry price much closer to $30,000 and that the business must prove buyers will
      accept limited range and sparse standard equipment. Financially, the current evidence supports
      a credible low-cost EV thesis, but not a clean underwriting case on margin path or runway.
    claimRefs: [CI001, CI009, CI010, CI011, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Base vehicle sale, Direct sale of the launch truck, Vehicle, "Public list-price anchor only: mid-$20,000s / under $25,000", Medium, "Provide signed order form, base ASP, and any financing or delivery fees."]
      - [SUV conversion kit, Optional upgrade from truck to SUV form factor, Per kit, "~$5,000 incremental price in public coverage", Medium, "Show attach-rate assumptions and gross margin by kit configuration."]
      - [Accessories, Catalog upsell after factory build, Per accessory, "200+ accessories; over 80% priced under $500 on the official site", Medium, "Disclose expected accessory attach by cohort and labor burden for installs."]
      - [Installation / service partner labor, Customer-paid install for non-DIY upgrades, Per install, "Revenue path visible, but no public price card or partner take-rate", Low, "Share install pricing, partner revenue split, and warranty liability by job type."]
    notes: >-
      Snapshot of publicly visible monetization levers; values are list-price or qualitative status
      only and do not represent realized revenue, discounting, or margin.
    claimRefs: [CI004, CI005, CI006, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price / unit
      - Trigger / basis
      - Evidence quality
      - Note
    rows:
      - [Base truck headline, "Less than $25,000 / mid-$20,000s", "Public launch coverage before options", High, "Different outlets use slightly different phrasing, but all frame the product as materially below mainstream EV pricing."]
      - [Tax-credit-adjusted entry point, "Below $20,000", "Requires federal EV incentive in 2025 launch coverage", Medium, "This headline is incentive-sensitive and therefore weaker after policy changes."]
      - [SUV conversion kit, "~$5,000", "Optional add-on to convert the pickup into an SUV", Medium, "Useful ASP uplift lever, but no disclosed attach-rate or margin."]
      - [Most accessories, "Under $500", "Official site says over 80% of 200+ accessories are under $500", Medium, "Broadens monetization but implies many add-ons are low-ticket rather than high-margin by default."]
    notes: >-
      Public pricing references are list-price anchors, not realized net revenue. Null commercial
      details such as discounts, bundle economics, and financing terms remain undisclosed.
    claimRefs: [CI004, CI005, CI006, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Total capital raised, "~$1.4 billion", High, "Shows sizable funding base for launch and plant ramp.", "Reconcile gross proceeds to cash still available after capex and operating burn."]
      - [Latest round, "$650 million Series C", High, "Sets the latest known financing step and informs dilution history.", "Provide full round documents, investor rights, and use-of-funds waterfall."]
      - [Warsaw facility investment, "~$400 million", Medium, "Signals meaningful fixed-capital commitment before volume revenue.", "Provide capex schedule, committed versus spent amounts, and contingency budget."]
      - [Targeted factory capacity, "100,000 vehicles in year one; 150,000 soon after", High, "Defines the revenue ramp investors are implicitly underwriting.", "Share monthly ramp plan, scrap assumptions, and supplier readiness gates."]
      - [Per-vehicle gross margin target, "Gross margin positive on every vehicle", Low, "Frames management's economic ambition but is not audited performance.", "Provide launch BOM, contribution margin bridge, and warranty reserve assumptions."]
      - [Break-even volume, "~80,000 vehicles annually", Low, "Links the fixed-cost base to a required sales threshold.", "Show break-even model, utilization assumptions, and sensitivity to accessory attach."]
      - [Cash on hand / runway, null, Low, "Without liquidity disclosure, capital adequacy cannot be underwritten.", "Provide current cash, monthly burn, debt, and minimum-liquidity forecast."]
      - [CAC / payback / channel economics, null, Low, "Demand quality and cost-to-acquire remain opaque without this data.", "Provide reservation funnel, cancellation/refund rates, CAC by channel, and service-partner economics."]
    notes: >-
      Null values mean the metric is not publicly disclosed in the assigned evidence pool. Several
      non-null figures are management targets or third-party reports rather than audited outcomes.
    claimRefs: [CI001, CI002, CI003, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Slate's public revenue bridge starts with an affordable base truck and depends on options, installs, and production execution to turn demand into gross profit.
    data:
      nodes:
        - id: reservation
          label: Reservations / preorders
          value: ">160,000 reservations reported; thousands of preorders later"
          note: Demand intent is visible publicly, but conversion to delivered revenue is not.
        - id: base-truck
          label: Base truck order
          value: "Mid-$20,000s / under $25,000 headline"
          note: List-price anchor before options; incentive-adjusted under-$20,000 message is policy-sensitive.
        - id: upsell
          label: Accessory + SUV upsell
          value: "200+ accessories; >80% under $500; SUV kit about $5,000"
          note: Monetization depends on attach rates more than on a rich standard trim ladder.
        - id: install
          label: DIY or service-partner installation
          value: Service pricing undisclosed
          note: Customization shifts labor and some complexity outside the main factory flow.
        - id: delivery
          label: Deliveries from Warsaw ramp
          value: "Late 2026 target; 100k year-one capacity, 150k soon after"
          note: Revenue timing depends on whether plant ramp, suppliers, and quality gates hold.
        - id: profit
          label: Gross profit and cash generation
          value: "Gross-margin-positive vehicle target"
          note: Public evidence provides a target, not disclosed realized margin, cash flow, or runway.
      edges:
        - from: reservation
          to: base-truck
          label: Converts only if deposits become firm paid orders
        - from: base-truck
          to: upsell
          label: ASP rises through kit and accessory attach
        - from: upsell
          to: install
          label: Some monetization and labor occur after the base build
        - from: install
          to: delivery
          label: Revenue recognition still waits on production and delivery
        - from: delivery
          to: profit
          label: Margin proof requires actual ramp economics, not only demand intent
    claimRefs: [CI004, CI005, CI006, CI009, CI010, CI012, CI013]
callouts:
  - calloutType: insight
    title: Slate is selling a monetization architecture, not yet a disclosed P&L
    body: >-
      The public case is strongest on design logic—cheap base truck plus optional add-ons and lower
      factory complexity—and weakest on audited economics such as realized ASP, margin, and burn.
    claimRefs: [CI004, CI006, CI007, CI008]
  - calloutType: risk
    title: Demand quality is still a conversion question
    body: >-
      Reservations and preorders indicate interest, but investors still need the refund,
      cancellation, financing, and accessory-attach data that determines whether interest converts
      into profitable delivered revenue.
    claimRefs: [CI009, CI010]
  - calloutType: recommendation
    title: Underwrite only after management opens the launch economics package
    body: >-
      The minimum diligence set is cash and burn, full plant-ramp capex, bill of materials,
      supplier concentration, warranty reserve assumptions, and the reservation-to-order funnel.
    claimRefs: [CI002, CI003, CI012]
