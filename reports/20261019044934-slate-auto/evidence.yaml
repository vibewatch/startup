evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-and-terms
    missingEvidence: Exact 2026 Series C post-money valuation, liquidation preferences, debt, and any secondary-sale details.
    whyItMatters: >-
      These terms determine dilution, downside protection, control rights, and whether headline funding actually
      improved financial flexibility.
    diligencePath: Request the latest financing deck, cap table, and signed Series C term sheet from the company or lead investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: Reservation-to-order conversion, cancellation/refund rates, and any named fleet or anchor-customer commitments.
    whyItMatters: >-
      Reservation totals overstate commercial traction if conversion falls or if demand is overwhelmingly speculative
      rather than purchase-ready.
    diligencePath: Ask management for cohort conversion funnels, refund data, and signed commercial order evidence by channel.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-and-operations
    missingEvidence: Exact headcount, full board roster, board observer rights, and current burn/runway data.
    whyItMatters: >-
      Governance transparency and operating capacity determine whether sponsor backing can actually carry the company
      through production ramp risk.
    diligencePath: Request the latest org chart, board materials, hiring plan, and monthly cash runway package.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: order-conversion
    missingEvidence: >-
      Reservation-to-paid-order conversion, cancellation or refund rates, and any segmentation by pickup versus SUV
      configuration.
    whyItMatters: Without conversion data, the reservation book cannot be translated into durable demand or near-term SOM.
    diligencePath: >-
      Request internal funnel data by cohort, including refundable reservations, preorder conversion, cancellations, and
      final configuration mix.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: fleet-demand
    missingEvidence: Named fleet pilots, letters of intent, purchase orders, or public procurement wins for light-duty commercial use.
    whyItMatters: >-
      Fleet adoption is one of the clearest buyer wedges in the retained evidence, but it is not validated by disclosed
      contracts.
    diligencePath: Ask management for signed fleet pilots or customer references and verify with counterparties where possible.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: option-economics
    missingEvidence: Full option pricing for larger batteries, SUV kits, and accessory bundles plus attach-rate assumptions.
    whyItMatters: >-
      Those inputs determine whether Slate's apparent affordability survives real configured purchase decisions and
      whether SAM/SOM can be segmented credibly.
    diligencePath: >-
      Obtain the full configurator price book, expected attach rates, and sensitivity analysis for configured average
      selling price.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: service-model-gap
    missingEvidence: >-
      Nationwide service-footprint data, warranty SLAs, and delivered-vehicle repair performance for Slate's
      direct-sales and service-partner model.
    whyItMatters: >-
      Service execution determines whether Slate can overcome incumbent trust advantages and whether accessory-led GTM
      scales beyond reservations.
    diligencePath: >-
      Obtain service-network maps, warranty documents, and early post-delivery repair metrics from management or launch
      partners.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: configured-pricing
    missingEvidence: >-
      A full public configured-pricing comparison for realistic Slate builds versus compact pickups and mainstream EV
      substitutes.
    whyItMatters: >-
      The base MSRP headline may overstate Slate's durable price advantage if battery, SUV-kit, or accessory bundles
      push realized pricing closer to incumbents.
    diligencePath: Capture official configurator outputs and dealer-independent transaction comparisons once public ordering opens.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: direct-peer-landscape
    missingEvidence: Competitor-official product and pricing pages for direct minimalist EV truck peers, if any emerge.
    whyItMatters: >-
      The current chapter is forced to benchmark Slate mostly against substitutes and incumbent responses rather than a
      clean direct-peer set.
    diligencePath: >-
      Re-run competitor-specific source discovery after launch to capture official surfaces for any named low-cost EV
      truck entrants.
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Reservation funnel conversion, CAC by channel, attach-rate by accessory, and service-partner revenue splits.
    whyItMatters: >-
      Without this data, the company can show demand interest but not efficient customer acquisition or profitable
      monetization per customer.
    diligencePath: >-
      Request cohort-level reservation, preorder, and delivered-order data with marketing spend and install-partner
      economics.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash on hand, monthly burn, debt or project-finance obligations, and a 24-month liquidity forecast.
    whyItMatters: Capital raised to date does not prove capital adequacy through launch, warranty support, and working-capital ramp.
    diligencePath: Obtain the latest board package, monthly cash bridge, debt schedule, and downside liquidity covenant model.
  - type: private-evidence-only
    severity: material
    topic: margin-stack
    missingEvidence: >-
      Detailed bill of materials, supplier concentration, warranty reserve assumptions, and contribution-margin bridge
      by trim and add-on.
    whyItMatters: >-
      Public margin targets are not enough to underwrite whether the low-price vehicle and low-ticket accessories can
      produce durable gross profit.
    diligencePath: >-
      Review supplier contracts, launch BOM, variable labor assumptions, and the finance model behind the
      gross-margin-positive claim.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: demand-quality
    missingEvidence: Refund, cancellation, financing approval, and preorder-to-delivery conversion data by cohort.
    whyItMatters: >-
      Reservation volume can overstate future revenue if customers fail to convert or attach fewer paid upgrades than
      the model assumes.
    diligencePath: >-
      Request weekly funnel reporting from reservation through delivered unit, segmented by configuration and customer
      type.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: material
    topic: practitioner-signal
    missingEvidence: >-
      Independent developer or practitioner telemetry such as API documentation usage, public repo activity, package
      downloads, or field issue forums.
    whyItMatters: >-
      The assigned pool supports the vehicle concept but not whether any software or integration surface has real
      third-party adoption or visible failure modes.
    diligencePath: >-
      Request the current public technical documentation set, any partner integration docs, and post-launch service or
      forum telemetry once vehicles ship.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: trust-safety
    missingEvidence: >-
      Final EPA certification, crash-test outcomes, battery safety validation, warranty terms, and measured
      service-response commitments.
    whyItMatters: >-
      These controls determine whether the low-cost architecture is merely novel or actually safe and durable enough for
      mainstream buyers.
    diligencePath: >-
      Obtain homologation and crash-rating records, final warranty booklets, and launch-readiness quality reports before
      underwriting deliveries.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: execution-risk
    missingEvidence: >-
      Detailed BOM cost targets, supplier concentration, accessory attachment rates, rework assumptions, and early field
      reliability KPIs.
    whyItMatters: >-
      The cost thesis depends on simplified production and post-sale customization, so hidden cost or quality leakage
      could erase the affordability advantage.
    diligencePath: >-
      Review internal launch dashboards, supplier commitments, pilot-build defect data, and service-partner economics
      during company diligence.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Public post-delivery retention, cancellation/refund, reorder, satisfaction, or renewal-style data for actual Slate
      customers.
    whyItMatters: >-
      Without post-delivery behavior, this chapter can only score top-of-funnel interest rather than durable customer
