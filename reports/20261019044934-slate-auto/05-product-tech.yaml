schemaVersion: report-v2
artifact: product-tech
slug: slate-auto
runDate: 2026-10-19
company:
  name: Slate Auto
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Slate's product strategy is a deliberately simple, modular EV built around a
    low-cost base truck plus post-sale accessories and conversion kits rather than
    multiple factory trims. The concept is differentiated and increasingly specific,
    but current public evidence still leaves important gaps around final certified
    specs, durability, quality control, and field support performance ahead of the
    late-2026 launch.
sections:
  - id: product-definition
    title: Product definition and customer workflow
    body: >-
      Slate is not trying to win the EV truck market on luxury, long range, or a
      software-heavy cabin. Company and reviewer descriptions align on a radically
      simple two-seat base truck that buyers can personalize over time with wraps,
      interior accessories, and SUV conversion kits. That makes the product easier
      to describe in workflow terms than in trim-level terms: reserve the base
      vehicle, choose only the add-ons you want, and optionally convert or upgrade
      the vehicle later instead of buying a different model upfront. The strategic
      implication is that Slate's product promise is affordability plus configurability,
      not broad feature parity with incumbent electric pickups.
    claimRefs: [CE001, CE002, CE004, CE009]
    tableRefs: [TE001, TE002]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      Public evidence points to a product architecture built around a single factory
      starting point, modest battery-and-range targets, and an accessory layer that
      sits above the core vehicle rather than inside many factory SKUs. Independent
      coverage repeatedly describes a single-SKU approach, NACS charging, a small-battery
      efficiency thesis, and a support model that mixes owner installation with service
      partners. The manufacturing and service story is therefore part of the product:
      the affordability thesis depends on simplified assembly, post-sale accessory
      installation, and a launch ramp from the Indiana facility rather than on a
      feature-rich platform shipping at incumbent scale today.
    claimRefs: [CE003, CE005, CE007, CE008, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risk-controls
    title: Maturity, trust, and technical risk
    body: >-
      Slate's disclosed concept is now concrete enough to underwrite the broad shape
      of the offer, but not yet the operating proof. The assigned evidence shows that
      specs have shifted across coverage cycles, prototype quality was still rough in
      early reviewer access, and public safety or quality disclosures remain thinner
      than the launch narrative. Reviewers and analysts consistently frame scale-up,
      certification, and dependable service execution as the hard part after the reveal.
      That means the major diligence questions are no longer "what is the product?" but
      "which specifications are final, which controls are production-ready, and can the
      install-and-service model work reliably once vehicles are actually on the road?"
    claimRefs: [CE006, CE010, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Base "Blank Slate" truck, Budget-oriented driver, Pre-production with late-2026 delivery target, Single-SKU low-cost EV starting point instead of many trims, Final certified spec sheet and production quality proof are still pending]
      - [Accessory marketplace, Owner customizing cost and utility over time, Publicly described and central to pricing logic, Lets buyers add features only when needed rather than paying upfront, Accessory attachment economics and install failure rates are undisclosed]
      - [SUV conversion kit, Buyer needing more seating or enclosed cargo, Publicly described add-on with multiple body styles, Converts the same base vehicle into a different body use case, "Final price, install time, and warranty treatment remain unclear"]
      - [DIY / service-partner install model, Owner or third-party installer, Publicly described but not yet field-proven, Pushes customization outside the factory to protect base cost, Service-partner SLA and rework burden are not disclosed]
    notes: >-
      Synthesized from company and independent launch coverage; statuses reflect public
      launch-stage evidence, not delivered-customer proof.
    claimRefs: [CE001, CE002, CE003, CE008, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Slate solution
      - Measurable benefit
      - Limitation
    rows:
      - [Acquire a new EV below mainstream truck pricing, Buyers usually step up to larger and more expensive EVs, Base truck is positioned around the mid-$20k range before options, Lower entry price than mainstream EV pickups, Final out-the-door price still depends on options and incentives]
      - [Customize vehicle utility without buying a new model, Traditional trims bundle features buyers may not want, "Add wraps, interior accessories, and conversion kits later", Defers spend and enables staged upgrades, Long-term accessory availability and install consistency are unproven]
      - [Handle local cargo and commuting rather than long-haul towing, Full-size EV trucks optimize for larger batteries and capability, Smaller battery and simpler package target around-town use, Lower cost and potentially simpler ownership, Modest range and capability narrow the use case]
    notes: >-
      Benefits are public-positioning benefits rather than audited customer outcomes;
      no delivered-fleet performance data appears in the assigned pool.
    claimRefs: [CE001, CE004, CE005, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Publicly disclosed role
      - Key dependency
      - Primary risk
    rows:
      - [Core EV platform, Provides the common factory-built truck baseline, Stable validated battery and drivetrain specification, Public specs remain provisional across sources]
      - [Accessory and conversion layer, Adds functionality after factory build via modular kits and wraps, Reliable parts supply plus clear install procedures, Complexity may shift from plant to service / owner execution]
      - [Charging and service layer, Uses NACS charging and a partner-oriented support model, Real charger access and competent service coverage, Public SLA and field uptime data are absent]
      - [Manufacturing ramp, Converts simplified design into volume output from Indiana, Factory readiness supplier timing and launch discipline, Startup scale-up and quality escapes could delay deliveries]
    notes: >-
      Architecture rows combine disclosed vehicle, service, and manufacturing layers
      because Slate's product thesis depends on all three operating together.
    claimRefs: [CE003, CE007, CE008, CE010, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Slate's product stack combines a stripped-down core vehicle with post-sale
      accessory, service, and factory-ramp layers that carry much of the affordability thesis.
    data:
      layers:
        - label: Customer configuration layer
          detail: Reservation-led purchase flow starts from a base truck and adds accessories over time.
          outputs:
            - label: Reservation / preorder queue
            - label: Accessory selection
        - label: Base vehicle SKU
          detail: A common factory starting point is intended to avoid trim proliferation.
          modules:
            - label: Two-seat base truck
            - label: Minimal in-cabin hardware
        - label: Propulsion and charging
          detail: Public sources describe a single-motor EV with modest battery and range targets plus NACS charging.
          modules:
            - label: Single-motor RWD
            - label: 150-205 mile public range window
            - label: NACS fast charging
        - label: Accessory and conversion layer
          detail: Utility upgrades are designed as add-ons rather than factory variants.
          modules:
            - label: SUV conversion kit
            - label: Wraps and interior accessories
            - label: DIY or partner install
        - label: Service and support layer
          detail: The ownership model relies on third-party support and owner guidance, not a large captive dealer base.
          modules:
            - label: Planned 2,500+ service locations
            - label: Slate University install content
        - label: Manufacturing and ramp layer
          detail: The commercial thesis depends on simplified assembly reaching dependable volume in Indiana.
          modules:
            - label: Warsaw, Indiana factory
            - label: Late-2026 launch / 2027 ramp
    approximationNotes: >-
      This is an operating-model stack synthesized from disclosed components and dependencies,
      not an engineering schematic of hidden subsystems.
    claimRefs: [CE003, CE007, CE008, CE009, CE014]
callouts:
  - calloutType: strength
    title: Affordability is designed into the product architecture
    body: >-
      Slate's most credible product differentiator is not a breakthrough battery or
      software moat; it is the combination of a simplified base vehicle, accessory-led
      monetization, and delayed customization spend.
    claimRefs: [CE003, CE004, CE009]
  - calloutType: risk
    title: Public launch detail still outpaces production proof
    body: >-
      The reveal now supports a concrete architecture narrative, but certifications,
      final specs, quality control, and service execution still have materially less
      public proof than the pricing-and-modularity story.
    claimRefs: [CE006, CE010, CE011, CE013]
