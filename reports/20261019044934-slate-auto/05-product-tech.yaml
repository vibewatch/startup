  evidenceGaps:
    - type: missing-source
      severity: material
      topic: practitioner-signal
      missingEvidence: Independent developer or practitioner telemetry such as API documentation usage, public repo activity, package downloads, or field issue forums.
      whyItMatters: The assigned pool supports the vehicle concept but not whether any software or integration surface has real third-party adoption or visible failure modes.
      diligencePath: Request the current public technical documentation set, any partner integration docs, and post-launch service or forum telemetry once vehicles ship.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: trust-safety
      missingEvidence: Final EPA certification, crash-test outcomes, battery safety validation, warranty terms, and measured service-response commitments.
      whyItMatters: These controls determine whether the low-cost architecture is merely novel or actually safe and durable enough for mainstream buyers.
      diligencePath: Obtain homologation and crash-rating records, final warranty booklets, and launch-readiness quality reports before underwriting deliveries.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: execution-risk
      missingEvidence: Detailed BOM cost targets, supplier concentration, accessory attachment rates, rework assumptions, and early field reliability KPIs.
      whyItMatters: The cost thesis depends on simplified production and post-sale customization, so hidden cost or quality leakage could erase the affordability advantage.
      diligencePath: Review internal launch dashboards, supplier commitments, pilot-build defect data, and service-partner economics during company diligence.
      relatedQuestionRefs: [QE007]
