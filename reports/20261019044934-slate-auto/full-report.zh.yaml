        title: 关键观察
        blocks:
          - type: callout
            title: 模块化扩大了比较范围
            body: Slate 不只是又一款电动皮卡。它的空白画布式包装和 SUV 改装套件意味着，买家可以根据配件组合，把它与紧凑型皮卡、低端电动车，甚至平价跨界车比较。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP007
          - type: callout
            title: 需求得到验证后， incumbents 可以回应这一逻辑
            body: Slate 或许能证明平价小型电动卡车存在需求，但 Ford 即将推出的小型电动卡车，以及整体向更低成本电动车发展的趋势意味着，一旦大型制造商决定争夺同一使用场景，平价切入口未必持久。
            calloutType: risk
            claimRefs:
