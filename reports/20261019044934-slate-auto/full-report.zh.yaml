            - label: 极简座舱硬件
        - label: 动力与充电
          detail: 公开来源称这是一款单电机电动车，电池和续航目标较为克制，并支持 NACS 充电。
          modules:
            - label: 单电机后轮驱动
            - label: 150-205 英里公开续航区间
            - label: NACS 快充
        - label: 配件与改装层
          detail: 功能升级以加装包的形式提供，而不是做成工厂配置版本。
          modules:
            - label: SUV 改装套件
            - label: 车身贴膜和内饰配件
            - label: DIY 或合作伙伴安装
        - label: 服务与支持层
          detail: 车主模式依靠第三方支持和车主指导，而不是庞大的自有经销商网络。
          modules:
            - label: 计划覆盖 2,500+ 个服务地点
            - label: Slate University 安装内容
        - label: 制造与爬坡层
          detail: 商业叙事取决于简化装配能否在 Indiana 达到稳定产量。
          modules:
            - label: Indiana 州 Warsaw 工厂
            - label: 2026 年末上市 / 2027 年爬坡
    approximationNotes: 这是根据已披露组件和依赖关系综合出的运营模型栈，不是隐藏子系统的工程示意图。
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE009
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Slate 当前的客户路径从低门槛预订开始，计划在基础车辆购买后靠定制、安装和支持服务变现。
    data:
      items:
        - label: 以可负担性为导向的发现
          actor: 对价格敏感的零售买家
          stage: 认知
          touchpoints:
            - $20,000 多美元的目标价格
            - 大众市场 / 工薪阶层定位
          note: 低廉的入门价格是吸引注意力的主钩子。
          tone: positive
        - label: 可退款预订
          actor: 潜在买家
          stage: 初始需求
          touchpoints:
            - $50 可退款定金
            - 160,000+ 预订标题
          note: 意向信号很强，但承诺仍可撤回。
          tone: warning
        - label: 交付前配置
          actor: 潜在车主
          stage: 购买前
          touchpoints:
            - 基础卡车加可选大电池
            - SUV 改装和加装规划
          note: 最终购物篮金额取决于尚未公开的加装经济性。
          tone: warning
        - label: 交付与安装选择
          actor: 买家和服务合作伙伴
          stage: 激活
          touchpoints:
            - DIY 配件安装
            - 通过服务合作伙伴专业安装
          note: 车主体验取决于工厂之外的执行。
          tone: neutral
        - label: 日常使用
          actor: 驾驶者
          stage: 初期使用
          touchpoints:
            - 城市周边续航和低成本实用性
            - 手机优先 / 低配置座舱
          note: 日常适配性必须抵消续航和功能上的妥协。
          tone: neutral
        - label: 售后扩展
          actor: 现有车主
          stage: 扩展
          touchpoints:
            - 随时间增加 100+ 款配件
            - 服务 / 维护覆盖
          note: 在车辆投入使用前，加购和满意度证据仍未经验证。
          tone: warning
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高风险集中在生产爬坡、预订转化和政策驱动的价格兑现。
    data:
      columns:
        - label: 可能性
        - label: 影响
      rows:
        - label: 生产爬坡
          values:
            - label: 高
              note: 2026 年末交付时点仍取决于工厂扩产、认证和投产调试。
              tone: negative
            - label: 高
              note: 如果上市准备不足，收入时点、信誉和融资能力都会受损。
              tone: negative
        - label: 预订转化
          values:
            - label: 高
              note: 预订可退款，管理层变动也明确把转化为付费订单列为目标。
              tone: negative
            - label: 高
              note: 转化疲弱会暴露注意力与可变现需求之间的差距。
              tone: negative
        - label: 税收抵免 / 定价风险
          values:
            - label: 高
              note: 联邦电动车抵免确定将到期后，Slate 已取消低于 $20k 的营销说法。
              tone: negative
            - label: 高
              note: 价格滑坡会直接威胁可负担电动车叙事。
              tone: negative
        - label: 供应商集中度
          values:
            - label: 中
              note: 电池来源已公开，但替代供应方案尚未公开。
              tone: warning
            - label: 中高
              note: 即使平台已简化，供应商交付失误仍会同时伤害时点和利润率。
              tone: warning
        - label: 原型质量
          values:
            - label: 中
              note: 早期原型的粗糙之处可能在 SOP 前改善，但公开验证仍有限。
              tone: warning
            - label: 中高
              note: 上市时的质量失误可能迅速损害品牌信任，并推高返工成本。
              tone: warning
        - label: 服务网络执行
          values:
            - label: 中
              note: 在覆盖范围得到验证前，DIY 和合作伙伴安装会扩大支持边界。
              tone: warning
            - label: 中高
              note: 安装质量差或保修响应弱，会削弱个性化模式的经济性。
              tone: warning
    approximationNotes: 可能性和影响分档综合了公开来源证据；它们是序数判断，不是模型估算的概率。
    claimRefs:
      - CR002
      - CR005
      - CR006
      - CR008
      - CR010
      - CR011
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 资金储备和可负担性切口让 Slate 值得跟踪，但价格透明度和上市风险使建议仍低于立即投资。
    data:
      nodes:
        - id: affordability
          label: 可负担性切口
          value: Mid-$20,000s target
          detail: 低入门价格是核心商业钩子，但低于 $20,000 的说法取决于激励政策。
        - id: demand
          label: 需求信号
          value: 160,000+ refundable reservations
          detail: 兴趣确实存在，但证据尚未显示付费订单的转化质量。
        - id: funding
          label: 资金基础
          value: $1.4B raised
          detail: Slate 已筹得足够资金，能推动工业化走向上市。
        - id: scale
          label: 规模与质量风险
          value: Late-2026 launch / 150k target
          detail: 原型质量、产量爬坡和盈亏平衡规模仍是最难通过的执行测试。
        - id: pricing
          label: 价格透明度缺口
          value: No disclosed round valuation
          detail: 公开来源披露了轮次规模和投资者，但没有披露投后估值或优先权条款。
        - id: recommendation
          label: 建议
          value: Track
          detail: 在评估一轮融资前，应先等到清晰的估值条款、付费订单证据和上市验证。
      edges:
        - from: affordability
          to: demand
        - from: demand
          to: funding
        - from: funding
          to: scale
        - from: scale
          to: pricing
        - from: pricing
          to: recommendation
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV011
      - CV012
      - CV014
