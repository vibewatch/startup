        title: 产品定义与客户流程
        blocks:
          - type: paragraph
            body: >-
              Slate 并不打算靠豪华、长续航或软件化座舱赢得电动卡车市场。公司和评测者的描述一致指向一款极简双座基础皮卡，买家可以随着时间推移通过贴膜、内饰配件和 SUV
              改装套件进行个性化。因此，按使用流程而非配置梯度描述这款产品更合适：先预订基础车型，只选需要的加购项目，之后还可以改装或升级，而不是一开始就购买另一款车型。战略上，Slate
              的产品承诺是平价加可配置，而不是与现有电动皮卡实现全面功能对等。
