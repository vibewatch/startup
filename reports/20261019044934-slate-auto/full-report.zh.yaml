      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              Slate 有三个合理的采用驱动因素：基础价格显著低于普通新车；产品服务短途日常驾驶，而不是追求长途出行性能；模块化收入模式则让买家把非必要支出延后到加购项目。但这些选择也带来明显约束。历史上的“低于
              $20,000”营销卖点依赖已取消的税收抵免，公司至今也没有公布大多数选装项价格；直销加服务伙伴模式必须证明，上市后定制和维修仍然简单。同时，双门布局、后轮驱动和有限续航缩小了可触达买家范围，传统厂商进入这一细分市场后，平价电动车竞争很可能加剧。
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 关键观察
        blocks:
          - type: callout
            title: 预订量更多证明好奇心，而非已验证需求
            body: Slate 已经展现出强劲的漏斗顶端兴趣，但市场逻辑最终取决于：买家看到最终选装价格、真正面对双门和短续航取舍后，有多少可退款预订会转成付费订单。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM012
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与替代品格局
        blocks:
          - type: paragraph
            body: >-
              指定证据指向一个广泛的竞争集合，而不是一组整齐的直接同行。Slate
              定位为面向市场低端、极简且高度可定制的电动皮卡，因此它同时与紧凑型燃油或混合动力皮卡、主流长续航电动车，以及已宣布的低成本电动卡车项目竞争，而不只是与其他初创公司竞争。公开记录中最强的替代品是 Ford
              Maverick 所代表的熟悉小型卡车形态；最强的相邻电动车替代品则是续航更长、功能更多但价格明显更高的主流电动车。证据还表明，直接初创同行集合并不强：观察者不断拿 Slate
              与失败或仍在爬坡的电动车进入者比较，因此信任和执行力与产品差异化同样重要。
            claimRefs:
              - CP001
