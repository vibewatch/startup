  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 定价 / 包装问题
      - Slate 证据
      - 对比者 / 现状证据
      - 含义
    rows:
      - - 基础宣传价格
        - TechCrunch 称该皮卡预计从 $20,000 多美元起售；Solar Builder 引用的皮卡 MSRP 为 $24,950
        - Tech Review 称 Ford Lightning 在开始交付时约为 $40k，最后一年升至 $54k 以上；Ford 未来的小型电动皮卡预计约 $30k
        - 相对在位电动皮卡，Slate 有明显价格优势，但相对所有紧凑型燃油或混合动力替代品，目前还没有
      - - 补贴敏感度
        - 公司早期宣传称，计入联邦税收抵免后价格低于 $20,000
        - InsideEVs 和 Edmunds 都指出，补贴取消会使买家的实际价格明显上升
        - 只有政策支持和精简配置同时成立时，Slate 的可负担性逻辑才最强
      - - 配件变现
        - 客户日后可以添加配件，包括 SUV 改装套件；TechCrunch 引用的 SUV 套件价格约为 $5,000
        - 指定证据没有披露相对主流电动车替代品的完整配置篮子比较
        - Slate 可以保持醒目的低价，但公开 ASP 和整套配置经济性仍不完整
      - - 分销 / 安装模式
        - Slate 直销，并采用 DIY 或服务合作伙伴安装配件，而不是经销商配置梯度
        - 指定证据尚未显示其具备成熟的全国服务覆盖、保修表现或规模化交付质量
        - GTM 模式具有差异化，但也把竞争风险转移到服务执行和履约上
    notes: 公开定价证据混合了公司公布的标价、媒体比较和未解问题，不应视为实际成交价格。
