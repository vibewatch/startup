      - number: '2.2'
        title: 市场规模视角与早期需求经济性
        blocks:
          - type: paragraph
            body: >-
              现有证据不支持一套干净的公开 TAM、SAM 和 SOM，因此更可靠的方法是从平价和产能吞吐两个角度交叉验证。电动车目前仍占美国新车销量不到 10%，而新车和纯电动车的平均价格锚点仍远高于 Slate
              的宣传起售价。这说明平价入口确实存在，但可投资性问题不是抽象的市场宽度，而是有多少买家愿意接受双门布局、适中续航和购车后定制，让公司从预订簿走向持续生产。管理层提出的盈亏平衡门槛约为年产 80,000
              辆，计划工厂产能为 100,000–150,000 辆，这使转化挑战成为市场逻辑的核心。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
