  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              保留的证据支持将 Slate 视为值得跟踪的可信公司，但还不足以支持一个价格有依据的主要投资。最强的正面因素很具体：Slate 已融资约 14 亿美元，仍目标在 2026
              年末交付，并试图进入美国平均车辆成本远高于其宣传价格的市场一角。投资判断的问题在于，需求信号仍主要是可退款预订，最终配置价格结构尚未完全披露，公开融资报道也没有显示当前估值或优先权结构。换言之，公司在战略上可能很有意思，但仅凭公开证据仍无法负责任地定价。这是典型的跟踪标的，而不是现在就投资的标的。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: 融资背景与公开证据实际能够定价的内容
        blocks:
          - type: paragraph
            body: >-
              Slate 的融资背景方向上很强，但对估值工作而言仍不完整。多个来源相互印证 6.5 亿美元 C 轮和约 14 亿美元累计融资，公司正用这笔资金在上市前完成工业化。产品概念也有连贯的成本逻辑：单一空白皮卡
              SKU、约 600
              个零件和购车后定制，都旨在相较传统多配置上市降低复杂度和营运资金需求。但公开证据仍没有达到投资人有信心判断入场价格所需的数字。保留的来源没有披露投后估值、清算优先权、债务或老股层、以及从基础皮卡到配件组合的利润率桥接。因此，即使战略逻辑真实，价格支撑仍不完整。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV012
      - number: '8.3'
        title: 情景、尽调问题与逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              上行情景很直接：如果 Slate 能把平价转成付费订单、按时上市，并避免单一 SKU
              模式在运营上失控，公司就可能相对那些试图用更昂贵产品扩张的电动车初创公司获得更高溢价叙事。下行情景同样清楚。独立报道不断回到同一组风险：买家仍要接受小车身、短续航和无花哨配置的电动车；原型质量仍需证明；规模经济仍然困难，因为低价车辆必须达到真实销量才能盈亏平衡。因此，公开证据支持一套围绕付费订单转化、配件搭售、毛利证明、供应商集中度、工厂准备度和确切融资条款的尽调计划。要上调建议，需要这些事实；如果上市延期、实际售价逼近
              30,000 美元，或质量与服务准备度令人失望，建议会迅速下调。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 关键观察
        blocks:
          - type: callout
            title: 当前判断
            body: 目前应跟踪 Slate，而不是仅凭公开证据判断其主要融资轮；关键缺失信息是已披露估值条款、付费订单转化和上市质量证明。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV014
