  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Slate Auto
      - 对比信号
      - 含义
    rows:
      - - 入门价格
        - 基础定位为 $20k 多美元；此前“低于 $20k”的营销表述依赖补贴
        - Ford Lightning 价格超过 $54k；Tech Review 称基础款 Tesla Model 3 续航超过 320 英里，是续航长得多的替代品；未来 Ford 小型电动皮卡预计约 $30k
        - Slate 公开可见的最大优势是基础价格可负担，但补贴消失或配置成本上升后，价差会缩小
      - - 续航
        - 2025 年 4 月预览称标准续航 150 英里、选装续航 240 英里；2026 年 10 月更新称预计总续航为 205 英里
        - Tech Review 称基础款 Tesla Model 3 续航超过 320 英里；InsideEVs 认为 Slate 的充电速度和长途驾驶表现处于中等水平
        - Slate 竞争的是“足够续航、带来更低用车成本”，而不是追平品类最佳续航
      - - 座舱 / 功能配置
        - 基础皮卡配手动车窗，没有信息娱乐屏，也没有收音机
        - 指定证据将主流替代品描绘成配置齐全的常态，而 Slate 明确拒绝这一方向
        - 简化设计压低成本，但会降低对期待现代舒适配置的客户的吸引力
      - - 车身与包装灵活性
        - 空白画布式皮卡日后可通过 SUV 套件和大型配件目录升级
        - 指定证据没有显示在位替代品存在可比的模块化售后包装模式
        - 模块化扩大了比较范围，因为同一辆基础车可以覆盖皮卡和 SUV 使用场景
      - - 充电 / 生态
        - 采用 Tesla 设计的 NACS 接口，据报道兼容 Tesla Supercharger 站点
        - 充电兼容性消除了一个采用障碍，尽管 Slate 的核心价值主张是价格，而不是充电速度
        - 生态对齐帮助 Slate 避免成为基础设施上的异类
    notes: 矩阵使用指定来源池中的公开比较锚点；来源没有披露竞争者确切数值时，单元格会明确写出这一限制。
