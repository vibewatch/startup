  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Slate 的正确比较对象不是全尺寸皮卡或高端长续航电动车。它是一款紧凑型双座电动工具车，刻意减少标准配置，提供可选 SUV 改装和 DIY
              配件模式；因此，相比拖曳能力强的商用卡车或功能丰富的家庭车辆，它更接近低成本个人交通、周末实用和轻型维护场景。现状替代品因此包括二手车、紧凑型燃油皮卡，以及标准配置更多但模块化更少的入门电动车。这个边界很重要，因为
              Slate 要靠平价和够用的实用性取胜，而不是靠续航、座舱科技或配置广度。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
