chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、布局与产品逻辑
        blocks:
          - type: paragraph
            body: >-
              公开资料将 Slate Auto 描述为一家成立于 2022
              年、总部位于密歇根州特洛伊的美国非上市电动车初创公司；公司在长滩开展设计，并计划在印第安纳州华沙生产。首款产品刻意做得极简：一款紧凑型电动皮卡，以单一低成本配置为基础，买家之后可加装配件和 SUV
              改装套件。这个产品选择正是商业模式的核心。Slate
              不追求高端续航或堆叠功能，而是试图靠更低的初始标价和购车后的加购能力取胜。现有证据支持其公司身份和产品概念，但尚不足以证明其已披露收入基础、除可退款预订之外的确定客户数，或与 2026 年融资相对应的当前估值。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
