      - number: '4.2'
        title: 成本结构与资本需求
        blocks:
          - type: paragraph
            body: >-
              Slate 的经济逻辑是：一款基础车型、后期定制、贴膜式收尾和更少的工厂变体，相较多配置上市可以降低资本强度。公开报道支持其中部分逻辑：独立报道描述了单一 SKU 策略，Slate
              自己的网站则突出一个大配件目录，价格大多低于 500 美元，这与把变现转向出厂后的加购相吻合。不过资本需求仍然不小。Electrek 报道华沙工厂计划投资约 4 亿美元；TechCrunch 和 MIT
              Technology Review 则将更广泛的业务描述为已获得约 14
              亿美元融资。这笔融资规模可观，但不能证明资金充足：公开来源仍未披露现金余额、月度烧钱、保修准备金假设、供应商集中度，或爬坡实体车辆业务所需的营运资本。
