      - number: '6.2'
        title: Slate 试图在基础车型售出后继续变现客户关系
        blocks:
          - type: paragraph
            body: >
              Slate 的客户旅程对汽车制造商而言并不寻常，因为基础车辆刻意做得简陋，扩张动作放在购车之后。TechCrunch、MIT Technology Review 和 InsideEVs 都描述了一款售价约在
              $20,000 多美元的简配皮卡，之后再叠加贴膜、电子设备和 SUV 改装套件等可选升级。Slate 不想在购买时把买家推入昂贵的配置梯度，而是试图降低第一次购买决策的门槛，并随着时间占据更多钱包份额。


              运营模式也让客户自行掌握节奏。InsideEVs 报道称，买家可以自行安装配件，也可以使用服务伙伴；A Simple Model
              称，客户反馈已经迫使公司修改设计，因为空调原本被视为不可妥协的配置，后来又被恢复。这一方向是积极的，说明 Slate
              会听取早期需求信号；但这也意味着，购车后扩张依赖清晰的配件价格、安装质量和支持一致性，而不能只靠基础皮卡。


              如果成功，Slate 可能建立更接近售后市场平台、而非传统经销商套餐的消费者加购循环。如果失败，公司可能发现低宣传起售价吸引了好奇买家，但配件复杂度、续航取舍或服务不确定性会压低最终转化率和搭售率。
