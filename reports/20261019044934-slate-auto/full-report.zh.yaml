  - id: TV002
    title: 正题 / 反题表
    columns:
      - 论点
      - 当前解读
      - 什么会改变判断
    rows:
      - - 可负担性切入口
        - Slate 正在切入美国汽车市场的一部分：平均价格仍远高于其宣传的入门价。
        - 如果配置价格无需依赖即将消失的激励，仍能维持在 $20,000 多美元区间，判断会更稳固。
      - - 轻资本设计逻辑
        - 相比传统上市方式，单 SKU、售后定制策略可能降低复杂度和营运资金需求。
        - 如果供应商复杂度、配件返工或服务成本抹平简化优势，该逻辑就会削弱。
      - - 反题：公开估值支撑不完整
        - 轮次规模、投资人姓名和工厂投入已公开；投后估值、优先权条款和利润率细节没有公开。
        - 只有 Slate 披露清晰的轮次条款，以及与实际上市经济性挂钩的利润率路径，判断才会改善。
    notes: 本表将战略逻辑与可定价性分开；反题针对投资判断纪律，而不是产品新颖性。
