  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 需求证据覆盖面广，但仍只是低门槛预订信号
        blocks:
          - type: paragraph
            body: >
              Slate 面向的是对价格敏感的大众买家，而不是高端电动车爱好者。MIT Technology Review 将产品定位在低于 $25,000 的起售价和可选付费加购上；InsideEVs 则引述前 CEO
              Chris Barman 称，目标市场是“工薪阶层、大众人群”。这说明核心买家可能是重视性价比的零售家庭或个体经营者：他们先要实用性，功能支出可以推迟。


              公开采用证据有意义，但仍处于早期。TechCrunch 报道，截至 2026 年 4 月，可退款预订超过 160,000 笔；DMR News 后续时间线还提到此前 100,000 笔和之后 150,000
              笔的里程碑。共同模式是漏斗顶端兴趣强，而不是锁定收入，因为订金可退款，管理层仍明确聚焦于把预订转成付费订单。


              因此，需求信号支持真实的市场好奇心，尤其是在联邦税收抵免消失之后；但它尚未回答持久性最关键的问题：最终价格和配件组合完全披露后，谁会转化；早期预订者是否像最终量产买家；以及上市前是否有任何车队或渠道合作伙伴愿意签署具名的采购量承诺。
            claimRefs:
              - CU001
