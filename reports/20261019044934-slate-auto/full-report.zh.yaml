      - number: '6.3'
        title: 持久性、集中度与上市准备度仍待验证
        blocks:
          - type: paragraph
            body: >
              最大的缺口是留存类指标和具名客户证明。指定来源池包含预订数量、媒体预览和上市规划评论，但没有客户群组、续订数据、流失数据、满意度评分或公开具名的量产客户。TechCrunch 确实提到 Slate
              已经配备车队销售负责人，这暗示公司不只做面向消费者的零售，但现有证据仍没有达到披露车队采购订单或生产部署的程度。


              上市执行风险同样重要，因为产品上路前无法评估客户持久性。Edmunds 称其看到的车辆仍是非常早期的原型，在判断装配和质感前还需要看到更接近量产的车辆。同一 Edmunds
              报道还称配件价格尚未公开，这限制了外部对最终平均售价以及 Slate 购车后扩张逻辑经济性的判断。


              简言之，本章支持一个可信的需求故事和差异化的车主模式，但尚未证明客户基础。下一步尽调节点是预订到订单的转化、取消和退款行为、具名车队客户，以及 2026 年末开始交付后服务和配件交付能否经受住考验。
            claimRefs:
              - CU003
