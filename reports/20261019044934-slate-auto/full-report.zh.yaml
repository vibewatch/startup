            body: >
              最高确信度风险不是 Slate 缺乏关注，而是它在没有证明可重复商业规模的情况下就进入试生产准备。CNBC 报道称，公司已为内部测试和认证生产了 70 多辆车，但同一报道认为，即使对传统厂商而言，2026
              年末上市时间也很棘手，因为供应链、人员、工厂调试和流程稳定性仍需同时到位。在需求端，Slate 已积累大量可退款预订，但管理层也部分因为要推动预订转成付费订单而更换
              CEO，这说明已记录的兴趣尚不等于持久收入。因此，上市时间、付费订单转化和价格实现，是最可能迅速重估投资逻辑的三个变量。
