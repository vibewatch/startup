      - number: '3.3'
        title: 护城河持久性与不利竞争信号
        blocks:
          - type: paragraph
            body: >-
              让 Slate 有趣的同一组证据，也定义了它的护城河风险。MIT Technology Review 认为，Ford 的 F-150 Lightning
              因电池尺寸和价格膨胀压垮了低成本电动卡车逻辑，未能解决这一问题，这也解释了 Slate 更简单的产品为何可能引发共鸣。但该文章还称 Ford 将在 2027 年前后带回一款小型电动卡车，TechCrunch
              则指出 Rivian 和 Lucid 也在进军更平价车型。换言之，如果 Slate
              验证了这一细分市场，更强资产负债表、更完整分销和更成熟制造能力的大型厂商及资金更充裕的电动车品牌都能跟进。公开预订量显示出需求兴趣，但尚未证明转化率、交付质量或全国服务深度。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
