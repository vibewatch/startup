  summary: >-
    Slate Auto 是一家成立于 2022 年、总部位于密歇根州特洛伊的美国非上市电动车初创公司。公司正在打造一款低成本、高度模块化的电动皮卡：基础配置极简，靠配件定制，并可选装 SUV
    改装方案。公开报道显示，公司获得了强力资方支持，并计划在 2026 年末启动生产；但公司尚未披露评估估值、收入基础或上市转化质量所需的经济条款。
