      - number: '1.4'
        title: 里程碑、平价定位调整与上市关键风险
        blocks:
          - type: paragraph
            body: >-
              Slate 已经走过量产前汽车制造商应经历的几个公开里程碑：隐身孵化、2025 年 4 月亮相、早期预订需求、2026 年 3 月 CEO 交接，以及 2026 年 4
              月的大额融资。更难的里程碑还在后面。独立报道将最大风险定义为从原型和可退款预订跨越到稳定、规模化的 2026 年末生产。政策也削弱了最初的故事：联邦电动车税收抵免即将结束后，公司不再强调“低于 20,000
              美元”，使平价主张不如上市时清晰。结果是，这家电动车初创公司拥有异常强的资方支持，但其制造准备度和商业转化仍缺乏完整的公开证明。
