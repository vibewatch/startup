        title: 关键观察
        blocks:
          - type: callout
            title: 资金获取能力优于多数电动车初创公司
            body: 公开报道一贯显示，作为一家量产前汽车制造商，Slate 获得了异常深厚的资方支持；这相较实力较弱的同行降低了融资风险，却解决不了上市执行问题。
