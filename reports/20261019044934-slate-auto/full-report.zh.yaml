      - number: '1.2'
        title: 领导层、创始人与控制权集中度
        blocks:
          - type: paragraph
            body: >-
              创始控制权似乎集中在与 Re:Build 相关的 Jeff Wilke、Miles Arnone 和 William Barker 手中。2026 年 3 月，运营控制权发生变化：Peter Faricy
              接替创始 CEO Chris Barman 担任 CEO，Barman
              转任车辆事业总裁。这个交接发生在上市前数月，正值预订转化、生产准备和市场落地执行比隐身期的公司组建更重要，因此意义不小。公开报道还反复强调创始人、投资人和高管团队中的 Amazon
              关联人才与资本。这种重叠有助于招聘和获取资方支持，但也提高了关键人物和资方依赖风险，因为公开董事会名单和正式控制权仍未完全披露。
