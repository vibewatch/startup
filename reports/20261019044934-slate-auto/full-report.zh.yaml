      - CV007
      - CV008
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 付费订单转化强劲，上市按期推进，质量稳住，买家接受宣传价格下的极简卡车。
        - 只有届时才可能为溢价私募市场入场辩护，因为公司同时降低了需求和工业化风险。
        - 配件经济性令人失望，或上市执行在取得证明前滑坡。
        - 需要看到付费订单、经过验证的质量，以及比当前公开来源显示的更清晰的轮次条款。
      - - 基准
        - Slate 达成上市里程碑，但利润率、优先权和订单质量的公开披露仍有限。
        - 最站得住脚的立场仍是跟踪：观察执行，之后再定价，而不是今天硬套一个估值。
        - 投资人把募资额误当作价格支撑，或把可退款预约过度解读为持久需求。
        - 最符合当前证据集。
      - - 悲观
        - 配置价格上升，预约无法转化，或工厂与质量爬坡落后于计划。
        - 在资本结构得到充分验证前，低价走量逻辑就会破裂，因而带来平轮或下轮风险。
        - 规模经济始终无法跑通，服务质量令人失望，或上市时间滑到 late 2026 之后。
        - 关于原型质量和规模经济的不利报道已经指向这条下行路径。
    notes: 这些是定性估值区间，因为保留的公开证据缺少确切轮次估值、股权表条款和披露的利润率模型。
    claimRefs:
      - CV002
