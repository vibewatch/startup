      - number: '4.3'
        title: 进展、风险与投资判断
        blocks:
          - type: paragraph
            body: >-
              Slate 的公开进展信号是需求意向，而不是收入质量。来源提到超过 160,000 笔可退款预订，后来又有数千笔预订单，方向上令人鼓舞，但核心财务转化问题仍未解决：多少存款会变成确定订单，什么配件组合能抬高实际
              ASP，以及极简车辆模式究竟承担多少服务和保修成本。交付目标仍在 2026 年末，因此收入确认更多取决于工厂执行，而不是营销叙事。反向证据同样重要：公开评论者明确警告，取消激励会把入门价格推得更接近
              $30,000 美元，公司必须证明买家会接受有限续航和稀疏标准配置。从财务角度看，现有证据支持一个可信的低成本电动车逻辑，但不足以形成关于利润率路径或资金续航的干净投资判断。
            claimRefs:
              - CI001
