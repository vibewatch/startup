  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个刻意简化的收入结构：低入门价基础皮卡、可选 SUV 改装，以及由车主或服务伙伴安装的长尾配件。这一架构很重要，因为 Slate
              没有披露已确认收入，所以可观察的财务模式实际上是目录定价加配件搭售率假设。公开报道一贯将基础车型的选装前价格放在 $20,000 多美元区间；部分报道将上市 headline 定为低于 $25,000
              美元，另一些则把低于 $20,000 的说法与如今不确定的联邦税收抵免挂钩。上行空间在于，它的漏斗顶端可能比多数电动车初创公司更宽；下行风险是，公开证据仍未显示存款转为具有约束力的订单后，实际
              ASP、选装项购买率、折扣或退款行为。
