      - number: '3.2'
        title: 产品取舍、定价与购买标准比较
        blocks:
          - type: paragraph
            body: >-
              Slate
              的差异化清晰但狭窄：它采用更小的车身、功能更少的内饰和更短续航的电池选项，以提供低于主流电动车替代品的宣传起售价。因此，购买比较的重点不是功能是否对等，而是预算敏感的客户是否足够看重低前期成本和模块化，愿意接受简陋座舱、更短续航和尚未充分验证的服务网络。公司用丰富的配件目录、皮卡转
              SUV 套件以及 Tesla/NACS 充电兼容性部分弥补这些取舍，但公开记录仍未完整呈现配置价格和总拥有成本。如今最强的竞争优势仍是简单的基础产品主张，而不是已经证明更便宜的完整配置车辆。
