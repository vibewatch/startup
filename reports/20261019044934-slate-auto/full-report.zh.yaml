      - number: '1.3'
        title: 融资历史、投资人图谱与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              最明确的公开资本事实是：Slate 于 2026 年 4 月完成 6.5 亿美元 C 轮融资，多家独立媒体将累计融资额置于约 14 亿美元。相同来源将 TWG Global、与 Jeff Bezos
              相关的资本、General Catalyst、Slauson & Co. 以及与 Re:Build 相关的创始人列为关键利益相关方。但这些 headline 背后的实际经济结构仍不清楚：公司尚未公开 C
              轮投后估值、清算优先权、债务或老股转让情况。本次审阅的证据中，公开规模信号同样更多体现为兴趣和计划，而非运营产出：部分报道显示可退款预订超过 160,000
              笔，但收入、付费订单转化率、确切员工数和完整董事会构成仍未披露或不精确。
            claimRefs:
