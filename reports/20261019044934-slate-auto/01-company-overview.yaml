slug: slate-auto
runDate: 2026-10-19
company:
  name: Slate Auto
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Slate Auto is a privately held, Troy-based EV startup founded in 2022 that is trying to launch a
    low-cost, modular electric pickup/SUV platform with roughly $1.4 billion of publicly reported
    funding and late-2026 production targets. Public evidence is strong on identity, leadership
    change, funding history, and launch milestones, but still weak on current valuation, revenue,
    exact headcount, and whether reservations will convert into paid orders at scale.
sections:
  - id: identity-and-product
    title: Identity, footprint, and product thesis
    body: >-
      Slate Auto is publicly described as a private American EV startup founded in 2022 and based in
      Troy, Michigan, with design activity in Long Beach and planned manufacturing in Warsaw, Indiana.
      Its first product is deliberately austere: a compact electric pickup built around a single
      low-cost configuration that buyers can customize later with accessories and an SUV-conversion
      kit. That product choice is central to the business model. Rather than chasing premium range or
      feature content, Slate is trying to win on a lower initial sticker price and post-sale
      upsellability. The evidence supports the identity and product concept; it does not yet support a
      disclosed revenue base, a firm customer count beyond refundable reservations, or a current
      valuation tied to the 2026 financing.
    claimRefs: [CO001, CO002, CO003, CO004, CO009, CO010, CO011, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and control concentration
    body: >-
      Founding control appears concentrated among Re:Build-linked founders Jeff Wilke, Miles Arnone,
      and William Barker, while operating control shifted in March 2026 when Peter Faricy replaced
      founding CEO Chris Barman as chief executive and Barman moved to President of Vehicles. That
      swap matters because it happened months before launch, when reservation conversion, production
      readiness, and go-to-market execution all became more important than stealth-era company
      formation. Public reporting also repeatedly highlights Amazon-linked talent and capital across
      the founder, investor, and executive bench. That overlap can improve recruiting and sponsor
      access, but it also increases key-person and sponsor-dependence risk because the public board
      roster and formal control rights remain only partially disclosed.
    claimRefs: [CO001, CO005, CO006, CO012]
    tableRefs: [TO002]
  - id: funding-and-scale
    title: Funding history, investor map, and public scale signals
    body: >-
      The clearest public capital facts are that Slate closed a $650 million Series C in April 2026
      and that multiple independent outlets place cumulative funding at roughly $1.4 billion. The
      same sources identify TWG Global, Jeff Bezos-related capital, General Catalyst, Slauson & Co.,
      and Re:Build-linked founders as key stakeholders. What remains unclear is the actual economic
      stack beneath those headlines: the company has not publicly disclosed the Series C post-money
      valuation, liquidation preferences, debt, or secondary activity in the evidence reviewed here.
      Likewise, public scale indicators skew toward interest and plans rather than operating output:
      refundable reservations exceed 160,000 in some reports, but revenue, paid-order conversion,
      exact headcount, and full board composition remain undisclosed or imprecise.
    claimRefs: [CO007, CO008, CO009, CO010, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: milestones-and-open-risks
    title: Milestones, affordability reset, and launch-critical risks
    body: >-
      Slate has moved through the visible milestones a pre-production automaker should hit: stealth
      incubation, April 2025 reveal, early reservation demand, a March 2026 CEO handoff, and a large
      April 2026 financing round. The harder milestone is still ahead. Independent coverage frames
      the biggest risk as the jump from prototypes and refundable reservations to consistent, scaled,
      late-2026 production. Policy also cut against the original story: the company stopped leaning on
      “under $20,000” language after the federal EV tax credit was set to end, making the affordability
      claim less clear than it looked at launch. The result is a company with unusually strong sponsor
      backing for an EV startup, but one whose public proof of manufacturing readiness and commercial
      conversion is still incomplete.
    claimRefs: [CO004, CO005, CO007, CO009, CO010, CO011, CO012, CO014, CO016]
    figureRefs: [FO001]
