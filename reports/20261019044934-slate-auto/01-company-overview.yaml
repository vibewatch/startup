    title: Company milestone timeline
    type: timeline
    summary: Public milestones show rapid financing and launch progress, but the final proof point is still scaled production rather than reservation volume.
    data:
      items:
        - date: "2022"
          label: "Slate is founded inside Re:Build as Re:Car"
          detail: Founded in 2022 with Re:Build roots before being spun out and rebranded as Slate.
          tone: neutral
          claimRefs: [CO001, CO006]
        - date: "2025-04-08"
          label: "TechCrunch reveals the stealth EV startup"
          detail: Public reporting says the company had operated for about three years in secret with backing linked to Jeff Bezos and Mark Walter.
          tone: neutral
          claimRefs: [CO002]
        - date: "2025-04-24"
          label: "Slate publicly debuts its modular pickup"
          detail: The company reveals a stripped-down electric pickup/SUV-conversion concept in Long Beach.
          tone: positive
          claimRefs: [CO003, CO004]
        - date: "2025-05-12"
          label: "Reservation count passes 100,000"
          detail: Early public demand signal rises quickly, but the deposits are refundable.
          tone: positive
          claimRefs: [CO010]
        - date: "2025-07-03"
          label: "Tax-credit change forces affordability reset"
          detail: Slate drops “under $20,000” messaging after the federal EV tax credit is set to end.
          tone: adverse
          claimRefs: [CO011]
        - date: "2025-12-16"
          label: "Reservation count passes 150,000"
          detail: Public interest continues to build before commercial launch.
          tone: positive
          claimRefs: [CO010]
        - date: "2026-03-09"
          label: "Peter Faricy becomes CEO"
          detail: Chris Barman moves to President of Vehicles as the company shifts toward launch execution.
          tone: neutral
          claimRefs: [CO005]
        - date: "2026-04-13"
          label: "Slate closes a $650M Series C"
          detail: The financing reinforces sponsor support but does not publicly disclose the new valuation.
          tone: positive
          claimRefs: [CO007, CO008]
        - date: "late 2026"
          label: "Planned production start in Warsaw"
          detail: Public sources tie the company’s make-or-break milestone to launching production from Indiana by late 2026.
          tone: neutral
          claimRefs: [CO009, CO012, CO014]
    approximationNotes: The final item is a planned period rather than a completed event because the assigned evidence set does not provide an exact start-of-production date.
    claimRefs: [CO002, CO004, CO005, CO007, CO008, CO009, CO010, CO011, CO012, CO014]
callouts:
  - calloutType: insight
    title: Capital access is better than for most EV startups
    body: Public reporting consistently shows that Slate has unusually deep sponsor backing for a pre-production automaker, which lowers financing risk relative to weaker peers but does not solve launch execution.
    claimRefs: [CO007, CO008, CO012]
  - calloutType: risk
    title: Reservation headlines still mask the real test
    body: The core diligence question is not whether Slate can attract deposits, but whether it can convert those deposits into paid orders while ramping a refurbished Indiana plant on time.
    claimRefs: [CO009, CO010, CO012, CO014]
