      - ["Jeff Bezos / Bezos Expeditions", "Early investor and reputational backer", "Signals capital access and attracts attention to the company", "Determine exact ownership, pro rata rights, and whether strategic fleet interests influence commercialization."]
      - ["TWG Global", "Lead investor in April 2026 Series C", "Likely major financial sponsor at the latest disclosed round", "Obtain Series C term sheet, governance rights, and milestone expectations tied to follow-on funding."]
