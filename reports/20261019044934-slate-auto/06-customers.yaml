chapter:
  number: 6
  title: Customers
  summary: Slate has assembled unusually strong prelaunch interest for a low-cost EV, but the current public record still shows a reservation funnel rather than durable customer traction. The best-supported customer story is price-sensitive retail demand plus post-purchase accessory upsell, while retention, named fleet proof, and conversion economics remain open diligence items ahead of late-2026 deliveries.
sections:
  - id: demand-segmentation
    title: Demand proof is broad, but it is still a low-friction reservation signal
    body: |
      Slate is positioning the truck for price-sensitive mainstream buyers rather than premium EV enthusiasts. MIT Technology Review frames the product around a sub-$25,000 entry point and optional paid add-ons, while InsideEVs quotes former CEO Chris Barman saying the target market is "the wage earner, the mass population." That combination suggests the primary buyer segment is a value-oriented retail household or sole proprietor who wants utility first and can defer feature spend until later.

      Public adoption proof is meaningful but still early-stage. TechCrunch reported more than 160,000 refundable reservations by April 2026, and DMR News' later timeline also references earlier 100,000-reservation and later 150,000-reservation milestones. The common pattern is strong top-of-funnel interest, not locked-in revenue, because the deposits are refundable and management is still explicitly focused on converting reservations into paid orders.

      The demand signal therefore supports real market curiosity, especially given the loss of the federal tax credit, but it does not yet answer the questions that matter most for durability: who converts once final pricing and accessory bundles are fully disclosed, whether early reservation holders resemble eventual production buyers, and whether any fleet or channel partner is willing to sign a named volume commitment before launch.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010, CU013]
    tableRefs: [TU001, TU002]
  - id: ownership-model
    title: Slate is trying to monetize the customer relationship after the base sale
    body: |
      Slate's customer journey is unusual for an automaker because the base vehicle is intentionally sparse and the expansion motion comes later. TechCrunch, MIT Technology Review, and InsideEVs all describe a bare-bones truck sold near the mid-$20,000s, with optional upgrades such as wraps, electronics, and an SUV conversion kit layered on afterward. Instead of pushing buyers into an expensive trim ladder at purchase, Slate is trying to lower the first purchase decision and capture more wallet share over time.

      The operating model is also built around customer-controlled timing. InsideEVs reports that buyers can install accessories themselves or use a service partner, and A Simple Model says customer feedback already forced one design change when air conditioning was restored after being viewed as non-negotiable. That is directionally positive because it shows Slate listening to early demand signals, but it also means post-sale expansion depends on clear accessory pricing, installation quality, and support consistency rather than on the core truck alone.

      If this works, Slate could create a consumer upsell loop closer to an aftermarket platform than to a traditional dealership bundle. If it does not, the company may discover that a low advertised entry price pulls in curious shoppers while accessory complexity, range tradeoffs, or service uncertainty suppress final conversion and attachment rates.
    claimRefs: [CU001, CU006, CU007, CU008, CU009, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-gaps
    title: Durability, concentration, and launch-readiness still need proof
    body: |
      The biggest missing pieces are retention-style metrics and named account proof. The assigned source pool contains reservation counts, media previews, and launch-planning commentary, but it does not contain customer cohorts, renewal data, churn data, satisfaction scores, or a public named production customer. TechCrunch does note that Slate has already staffed fleet-sales leadership, which implies a commercial motion beyond direct-to-consumer retail, but the current evidence still stops short of a disclosed fleet purchase order or production deployment.

      Launch execution risk also matters because customer durability cannot be evaluated before the product is on the road. Edmunds described the truck it saw as a very early prototype and said it needed to see a closer-to-production vehicle before judging fit and finish. The same Edmunds report also said accessory pricing was not yet public, which limits any outside view on the eventual average selling price and the economics of Slate's post-purchase expansion thesis.

      In short, the chapter supports a credible demand story and a differentiated ownership model, but not yet a proven customer base. The next diligence checkpoints are reservation-to-order conversion, cancellation and refund behavior, named fleet wins, and whether service and accessory delivery hold up once late-2026 deliveries begin.
    claimRefs: [CU003, CU005, CU009, CU010, CU011, CU012, CU013]
