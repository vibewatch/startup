      whyItMatters: Without post-delivery behavior, this chapter can only score top-of-funnel interest rather than durable customer quality or revenue repeatability.
      diligencePath: Request reservation-to-order conversion by cohort, cancellation and refund rates, early NPS or service data, and any delivered-customer reference calls once vehicles ship.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A complete public list of named production customers, pilots, fleet accounts, or channel contracts supporting customer-proof enumeration.
      whyItMatters: Concentration risk and reference quality cannot be assessed if public evidence never moves past anonymous reservation counts.
      diligencePath: Ask management for named fleet or enterprise accounts, signed purchase orders, reference calls, and top-customer exposure once any production commitments exist.
