      - ["Capital providers", "TWG Global and venture syndicate", "Fund tooling, plant spend, and commercialization ahead of self-funding operations.", "Medium-high", "If launch slips or demand weakens, Slate may need new capital before scale economics are proven.", "High", "April 2026 Series C added $650M and management frames the raise as sufficient for the next production phase.", "Medium-high until burn, capex curve, and 2027 financing needs are disclosed."]
