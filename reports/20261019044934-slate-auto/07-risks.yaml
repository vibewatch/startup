company:
  name: Slate Auto
chapter:
  number: 7
  title: Risks
  summary: >
    Slate's risk profile is dominated by launch execution, demand conversion, and pricing-policy
    exposure rather than an already-documented legal or safety event. Public evidence shows real
    reservation interest and fresh capital, but it also shows a compressed late-2026 ramp, refundable
    demand, unresolved no-credit pricing, and a still-forming service and accessory ecosystem.
sections:
  - id: risk-stack
    title: Severity-ranked risk stack
    body: >
      The highest-conviction risk is not that Slate lacks attention, but that it reaches pilot readiness
      without proving repeatable commercial scale. CNBC reported more than 70 vehicles built for internal
      testing and certification, yet the same reporting described late-2026 launch timing as daunting even
      for an incumbent manufacturer because supply chains, workforce, plant commissioning, and process
      stability still have to converge. On the demand side, Slate has accumulated large refundable
      reservation counts, but management also changed CEOs partly to focus on converting those reservations
      into paid orders, which implies that booked interest is not yet equivalent to durable revenue. That
      makes launch timing, paid-order conversion, and price realization the three variables that can most
      quickly re-rate the investment case.
    claimRefs: [CR002, CR003, CR004, CR005, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure is mostly indirect but still material
    body: >
      The current public record in the assigned pool points less to an active lawsuit or enforcement action
      than to indirect regulatory exposure. Slate's original sub-$20,000 marketing relied on the federal EV
      tax credit, and that message was removed once the credit's expiration became imminent, so policy
      change now flows directly into consumer price perception. Public reporting also shows that the company
      is still in the certification and validation phase, which means liability, homologation, and
      after-sales warranty execution remain forward risks rather than cleared items. Because the modular SUV
      conversion and accessory strategy expands the number of configurations customers can install or have
      installed by service partners, investors still need explicit evidence on compliance sign-offs, warranty
      boundaries, and claim-handling readiness before treating legal exposure as de minimis.
    claimRefs: [CR002, CR006, CR009, CR011]
    tableRefs: [TR001]
  - id: operational-and-dependency
    title: Operational and dependency risk sits at the heart of the thesis
    body: >
      Slate's mitigation case is credible but unproven at scale. Management's single-SKU, fewer-parts, and
      post-sale modularity strategy is meant to reduce manufacturing complexity, while domestic sourcing,
      SK On battery supply, and service partners are supposed to keep the product supportable without a
      traditional dealer stack. The same choices also create concentrated dependencies: supplier execution,
      accessory installation quality, plant build-out in Warsaw, and capital-provider support all matter
      before meaningful revenue exists. Edmunds' prototype review was still unconvinced on fit and finish,
      and public reporting does not yet quantify final accessory pricing, service coverage, or 2027 capital
      needs. That keeps residual execution risk high even after the April 2026 Series C.
    claimRefs: [CR001, CR007, CR008, CR010, CR011, CR013, CR015, CR016]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: >
      Slate's disclosed mitigations are real but must now become measurable. Investors should look for a
      stable conversion funnel from refundable reservations to paid orders, final pre-incentive pricing that
      does not erase the affordability thesis, documented certification and start-of-production milestones,
      and named service coverage that can support warranty and accessory installs at launch. The thesis
      should be treated as impaired if production timing slips beyond late 2026, if configured pricing moves
      materially above the mid-$20,000s without strong demand conversion, or if the company must seek new
      capital before demonstrating launch-quality vehicles and a working support network.
    claimRefs: [CR003, CR005, CR006, CR009, CR011, CR013, CR014, CR016]
