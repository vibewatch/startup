company:
  name: "Slate Auto"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Slate is not targeting the full US pickup or EV market; the current evidence supports a narrower wedge around affordable, compact, light-duty electric utility for price-sensitive households, DIY-minded owners, and some local fleets. The central valuation question is whether that wedge can absorb 80,000-plus annual units once the company converts refundable reservations into paid orders without the older tax-credit-aided sub-$20,000 headline.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The right comparison set for Slate is not full-size pickups or premium long-range EVs. The product is a compact two-seat electric utility truck with intentionally sparse standard equipment, optional SUV conversion, and a do-it-yourself accessory model; that places it closer to low-cost personal transport, weekend utility, and light-duty maintenance use cases than to towing-heavy commercial trucks or feature-rich family vehicles. The status quo substitutes are therefore used vehicles, compact gas pickups, and entry EVs that offer more standard equipment but less modularity. That boundary matters because Slate is trying to win on affordability and acceptable utility, not on range, cabin tech, or breadth of configurations.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM007"]
    tableRefs: ["TM001", "TM003"]
  - id: "sizing-lenses"
    title: "Sizing lenses and early demand economics"
    body: >-
      The available evidence does not support a clean public TAM, SAM, and SOM stack, so the more reliable approach is to triangulate with affordability and throughput lenses. EVs still represent under 10% of US new-vehicle sales, while average new-vehicle and battery-EV price anchors remain far above Slate's advertised base price. That makes the affordable-entry wedge real, but the investable question is not abstract market breadth; it is whether enough buyers will accept two-door packaging, modest range, and post-purchase customization to carry the company from a reservation book into sustained production. Management's stated break-even threshold of roughly 80,000 vehicles per year and planned 100,000-to-150,000 unit factory capacity put that conversion challenge at the center of the market case.
    claimRefs: ["CM005", "CM006", "CM008", "CM009", "CM010"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers and constraints"
    body: >-
      Slate has three plausible adoption drivers: a materially lower base price than typical new vehicles, a product designed around short daily driving needs rather than road-trip performance, and a modular revenue model that lets buyers defer nonessential spend into add-ons. Those same choices create meaningful constraints. The historical sub-$20,000 marketing hook depended on a discontinued tax credit, the company still has not published most option pricing, and the direct-sales-plus-service-partner model must prove that customization and repair remain simple after launch. Meanwhile, two-door packaging, rear-wheel drive, and limited range narrow the addressable buyer set, and affordable-electric competition is likely to increase as incumbents enter the segment.
    claimRefs: ["CM006", "CM007", "CM011", "CM012", "CM013", "CM014"]
