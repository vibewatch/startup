              - CR010
              - CR011
              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure is mostly indirect but still material
        blocks:
          - type: paragraph
            body: >
              The current public record in the assigned pool points less to an active lawsuit or enforcement action than
              to indirect regulatory exposure. Slate's original sub-$20,000 marketing relied on the federal EV tax
              credit, and that message was removed once the credit's expiration became imminent, so policy change now
              flows directly into consumer price perception. Public reporting also shows that the company is still in
              the certification and validation phase, which means liability, homologation, and after-sales warranty
              execution remain forward risks rather than cleared items. Because the modular SUV conversion and accessory
              strategy expands the number of configurations customers can install or have installed by service partners,
              investors still need explicit evidence on compliance sign-offs, warranty boundaries, and claim-handling
              readiness before treating legal exposure as de minimis.
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR011
      - number: '7.3'
        title: Operational and dependency risk sits at the heart of the thesis
        blocks:
          - type: paragraph
            body: >
              Slate's mitigation case is credible but unproven at scale. Management's single-SKU, fewer-parts, and
              post-sale modularity strategy is meant to reduce manufacturing complexity, while domestic sourcing, SK On
              battery supply, and service partners are supposed to keep the product supportable without a traditional
              dealer stack. The same choices also create concentrated dependencies: supplier execution, accessory
              installation quality, plant build-out in Warsaw, and capital-provider support all matter before meaningful
              revenue exists. Edmunds' prototype review was still unconvinced on fit and finish, and public reporting
              does not yet quantify final accessory pricing, service coverage, or 2027 capital needs. That keeps
              residual execution risk high even after the April 2026 Series C.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Slate's disclosed mitigations are real but must now become measurable. Investors should look for a stable
              conversion funnel from refundable reservations to paid orders, final pre-incentive pricing that does not
              erase the affordability thesis, documented certification and start-of-production milestones, and named
              service coverage that can support warranty and accessory installs at launch. The thesis should be treated
              as impaired if production timing slips beyond late 2026, if configured pricing moves materially above the
              mid-$20,000s without strong demand conversion, or if the company must seek new capital before
              demonstrating launch-quality vehicles and a working support network.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >
              Slate can still miss the thesis even with strong reservation interest if late-2026 launch timing slips or
              if refundable reservations fail to convert once real configured pricing is visible without the federal EV
              credit.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR014
          - type: callout
            title: Kill criteria before underwriting
            body: >
              Treat the case as broken if paid-order conversion is weak, launch-quality builds slip past late 2026, or
              configured pricing climbs far enough above the mid-$20,000s that affordability no longer compensates for
              the truck's shorter range and sparse standard feature set.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports Slate as a credible company to watch, but not yet as a price-supported
              primary investment. The strongest positives are tangible: Slate has raised roughly $1.4 billion, still
              targets late-2026 deliveries, and is trying to attack a part of the U.S. market where average vehicle
              costs remain far above its advertised price point. The problem for underwriting is that the demand signal
              is still mostly refundable reservations, the final configured pricing stack is not yet fully disclosed,
              and public financing coverage does not show the current valuation or preference structure. In other words,
              the company may be strategically interesting while still being impossible to price responsibly from public
              evidence alone. That is a classic track setup rather than an invest-now setup. 
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Financing context and what public evidence can actually price
        blocks:
          - type: paragraph
            body: >-
              Slate's financing context is directionally strong but still incomplete for valuation work. Multiple
              sources corroborate the $650 million Series C and roughly $1.4 billion total capital raised, and the
              company is using that capital to finish industrialization ahead of launch. The product concept also has a
              coherent cost story: a single blank-truck SKU, roughly 600 parts, and post-sale customization are all
              meant to reduce complexity and working-capital needs versus a conventional multitrim launch. But public
              evidence still stops short of the numbers an investor would need to underwrite an entry price with
              confidence. The retained sources do not disclose a post-money valuation, liquidation preferences, debt or
              secondary layers, or a margin bridge from base truck to accessory mix. That leaves price support
              incomplete even if the strategic logic is real.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV012
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward: if Slate can turn affordability into paid orders, launch on time, and
              keep the single-SKU model from unraveling operationally, the company could earn a premium narrative versus
              other EV startups that tried to scale with more expensive products. The downside case is just as clear.
              Independent coverage keeps returning to the same risk cluster: buyers still have to accept a small,
              short-range, no-frills EV; prototype quality still needs proof; and scale economics remain hard because a
              low-price vehicle needs real volume to break even. Public evidence therefore supports a diligence plan
              centered on paid-order conversion, accessory attach, gross-margin proof, supplier concentration, factory
              readiness, and exact financing terms. A recommendation upgrade needs those facts; a recommendation
              downgrade follows quickly if launch timing slips, effective selling prices drift toward $30,000, or
              quality and service readiness disappoint.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track Slate rather than underwriting a primary round from public evidence today; the key missing inputs
              are disclosed valuation terms, paid-order conversion, and launch-quality proof.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
