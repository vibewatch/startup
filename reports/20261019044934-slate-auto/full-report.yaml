  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The right comparison set for Slate is not full-size pickups or premium long-range EVs. The product is a
              compact two-seat electric utility truck with intentionally sparse standard equipment, optional SUV
              conversion, and a do-it-yourself accessory model; that places it closer to low-cost personal transport,
              weekend utility, and light-duty maintenance use cases than to towing-heavy commercial trucks or
              feature-rich family vehicles. The status quo substitutes are therefore used vehicles, compact gas pickups,
              and entry EVs that offer more standard equipment but less modularity. That boundary matters because Slate
              is trying to win on affordability and acceptable utility, not on range, cabin tech, or breadth of
              configurations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
