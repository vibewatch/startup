      - number: '6.2'
        title: Slate is trying to monetize the customer relationship after the base sale
        blocks:
          - type: paragraph
            body: >
              Slate's customer journey is unusual for an automaker because the base vehicle is intentionally sparse and
              the expansion motion comes later. TechCrunch, MIT Technology Review, and InsideEVs all describe a
              bare-bones truck sold near the mid-$20,000s, with optional upgrades such as wraps, electronics, and an SUV
              conversion kit layered on afterward. Instead of pushing buyers into an expensive trim ladder at purchase,
              Slate is trying to lower the first purchase decision and capture more wallet share over time.


              The operating model is also built around customer-controlled timing. InsideEVs reports that buyers can
              install accessories themselves or use a service partner, and A Simple Model says customer feedback already
              forced one design change when air conditioning was restored after being viewed as non-negotiable. That is
              directionally positive because it shows Slate listening to early demand signals, but it also means
              post-sale expansion depends on clear accessory pricing, installation quality, and support consistency
              rather than on the core truck alone.


              If this works, Slate could create a consumer upsell loop closer to an aftermarket platform than to a
              traditional dealership bundle. If it does not, the company may discover that a low advertised entry price
              pulls in curious shoppers while accessory complexity, range tradeoffs, or service uncertainty suppress
              final conversion and attachment rates.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.3'
        title: Durability, concentration, and launch-readiness still need proof
        blocks:
          - type: paragraph
            body: >
              The biggest missing pieces are retention-style metrics and named account proof. The assigned source pool
              contains reservation counts, media previews, and launch-planning commentary, but it does not contain
              customer cohorts, renewal data, churn data, satisfaction scores, or a public named production customer.
              TechCrunch does note that Slate has already staffed fleet-sales leadership, which implies a commercial
              motion beyond direct-to-consumer retail, but the current evidence still stops short of a disclosed fleet
              purchase order or production deployment.


              Launch execution risk also matters because customer durability cannot be evaluated before the product is
              on the road. Edmunds described the truck it saw as a very early prototype and said it needed to see a
              closer-to-production vehicle before judging fit and finish. The same Edmunds report also said accessory
              pricing was not yet public, which limits any outside view on the eventual average selling price and the
              economics of Slate's post-purchase expansion thesis.


              In short, the chapter supports a credible demand story and a differentiated ownership model, but not yet a
              proven customer base. The next diligence checkpoints are reservation-to-order conversion, cancellation and
              refund behavior, named fleet wins, and whether service and accessory delivery hold up once late-2026
              deliveries begin.
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reservations are real interest, not yet durable revenue
            body: >-
              Slate has clear top-of-funnel momentum, but refundable deposits and absent conversion data keep customer
              proof below the level of a firm order book.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU004
          - type: callout
            title: The upsell thesis is still mostly untested
            body: >-
              Slate’s ownership economics depend on accessories, installation, and service quality after purchase, but
              the assigned public evidence still lacks add-on pricing, attach rates, and operating proof.
            calloutType: risk
            claimRefs:
              - CU007
              - CU009
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >
              The highest-conviction risk is not that Slate lacks attention, but that it reaches pilot readiness without
              proving repeatable commercial scale. CNBC reported more than 70 vehicles built for internal testing and
              certification, yet the same reporting described late-2026 launch timing as daunting even for an incumbent
              manufacturer because supply chains, workforce, plant commissioning, and process stability still have to
              converge. On the demand side, Slate has accumulated large refundable reservation counts, but management
              also changed CEOs partly to focus on converting those reservations into paid orders, which implies that
              booked interest is not yet equivalent to durable revenue. That makes launch timing, paid-order conversion,
              and price realization the three variables that can most quickly re-rate the investment case.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
