  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Demand proof is broad, but it is still a low-friction reservation signal
        blocks:
          - type: paragraph
            body: >
              Slate is positioning the truck for price-sensitive mainstream buyers rather than premium EV enthusiasts.
              MIT Technology Review frames the product around a sub-$25,000 entry point and optional paid add-ons, while
              InsideEVs quotes former CEO Chris Barman saying the target market is "the wage earner, the mass
              population." That combination suggests the primary buyer segment is a value-oriented retail household or
              sole proprietor who wants utility first and can defer feature spend until later.


              Public adoption proof is meaningful but still early-stage. TechCrunch reported more than 160,000
              refundable reservations by April 2026, and DMR News' later timeline also references earlier
              100,000-reservation and later 150,000-reservation milestones. The common pattern is strong top-of-funnel
              interest, not locked-in revenue, because the deposits are refundable and management is still explicitly
              focused on converting reservations into paid orders.


              The demand signal therefore supports real market curiosity, especially given the loss of the federal tax
              credit, but it does not yet answer the questions that matter most for durability: who converts once final
              pricing and accessory bundles are fully disclosed, whether early reservation holders resemble eventual
              production buyers, and whether any fleet or channel partner is willing to sign a named volume commitment
              before launch.
            claimRefs:
              - CU001
              - CU002
              - CU003
