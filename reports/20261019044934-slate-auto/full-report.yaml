              - CO013
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership, founders, and control concentration
        blocks:
          - type: paragraph
            body: >-
              Founding control appears concentrated among Re:Build-linked founders Jeff Wilke, Miles Arnone, and William
              Barker, while operating control shifted in March 2026 when Peter Faricy replaced founding CEO Chris Barman
              as chief executive and Barman moved to President of Vehicles. That swap matters because it happened months
              before launch, when reservation conversion, production readiness, and go-to-market execution all became
              more important than stealth-era company formation. Public reporting also repeatedly highlights
              Amazon-linked talent and capital across the founder, investor, and executive bench. That overlap can
              improve recruiting and sponsor access, but it also increases key-person and sponsor-dependence risk
              because the public board roster and formal control rights remain only partially disclosed.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO012
