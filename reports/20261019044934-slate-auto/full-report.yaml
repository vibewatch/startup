  - id: FM001
    title: Affordability stack relative to US auto benchmarks
    type: pyramid
    summary: >-
      The retained price anchors show Slate creating a wide entry-price gap versus typical US new-vehicle and EV
      spending, while leaving most customization spend in optional layers.
    data:
      items:
        - label: Average US battery-EV benchmark
          displayValue: ~$60,000
          unit: USD
          detail: InsideEVs cites the average battery-powered ride in the US at about $60,000.
        - label: Average US new-vehicle benchmark
          displayValue: ~$50,000
          unit: USD
          detail: MIT Technology Review says the average new vehicle in the US is roughly $50,000.
        - label: Slate Squareback reservation MSRP
          displayValue: $29,950
          unit: USD
          detail: Consumer Reports reserved the Slate Squareback SUV at a $29,950 MSRP.
        - label: Slate Blank Slate base MSRP
          displayValue: $24,950
          unit: USD
          detail: Consumer Reports and CNBC both cite a $24,950 starting price before destination and fees.
        - label: Slate SUV conversion add-on
          displayValue: +$5,000
          unit: USD
          detail: CNBC and TechCrunch describe the SUV conversion as roughly a $5,000 upcharge.
        - label: Slate launch accessory price band
          displayValue: '>80% of 175+ under $500'
          detail: CNBC says Slate plans more than 175 launch accessories, with over 80% priced under $500.
    approximationNotes: >-
      Layers mix benchmark sticker prices with Slate option-price points to show the affordability ladder; they are not
      a cumulative market bridge or a revenue forecast.
    claimRefs:
      - CM003
      - CM006
      - CM007
      - CM014
