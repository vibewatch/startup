        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a product architecture built around a single factory starting point, modest
              battery-and-range targets, and an accessory layer that sits above the core vehicle rather than inside many
              factory SKUs. Independent coverage repeatedly describes a single-SKU approach, NACS charging, a
              small-battery efficiency thesis, and a support model that mixes owner installation with service partners.
              The manufacturing and service story is therefore part of the product: the affordability thesis depends on
              simplified assembly, post-sale accessory installation, and a launch ramp from the Indiana facility rather
              than on a feature-rich platform shipping at incumbent scale today.
