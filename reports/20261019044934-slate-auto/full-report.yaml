      - number: '1.4'
        title: Milestones, affordability reset, and launch-critical risks
        blocks:
          - type: paragraph
            body: >-
              Slate has moved through the visible milestones a pre-production automaker should hit: stealth incubation,
              April 2025 reveal, early reservation demand, a March 2026 CEO handoff, and a large April 2026 financing
              round. The harder milestone is still ahead. Independent coverage frames the biggest risk as the jump from
              prototypes and refundable reservations to consistent, scaled, late-2026 production. Policy also cut
              against the original story: the company stopped leaning on “under $20,000” language after the federal EV
              tax credit was set to end, making the affordability claim less clear than it looked at launch. The result
              is a company with unusually strong sponsor backing for an EV startup, but one whose public proof of
              manufacturing readiness and commercial conversion is still incomplete.
