      - number: '2.2'
        title: Sizing lenses and early demand economics
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not support a clean public TAM, SAM, and SOM stack, so the more reliable
              approach is to triangulate with affordability and throughput lenses. EVs still represent under 10% of US
              new-vehicle sales, while average new-vehicle and battery-EV price anchors remain far above Slate's
              advertised base price. That makes the affordable-entry wedge real, but the investable question is not
              abstract market breadth; it is whether enough buyers will accept two-door packaging, modest range, and
              post-purchase customization to carry the company from a reservation book into sustained production.
              Management's stated break-even threshold of roughly 80,000 vehicles per year and planned
              100,000-to-150,000 unit factory capacity put that conversion challenge at the center of the market case.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
