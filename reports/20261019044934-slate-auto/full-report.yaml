      - number: '3.2'
        title: Product tradeoffs, pricing, and buying-criteria comparison
        blocks:
          - type: paragraph
            body: >-
              Slate's differentiation is clear but narrow: it uses a smaller vehicle, lower-feature interior, and
              lower-range battery options to deliver a lower advertised entry price than mainstream EV alternatives.
              That makes the buying comparison less about feature parity and more about whether a budget-sensitive
              customer values low upfront cost and modularity enough to accept sparse cabin equipment, shorter range,
              and a less proven service network. The company partly offsets those tradeoffs with a wide accessory
              catalog, pickup-to-SUV conversion kits, and Tesla/NACS charging compatibility, but the public record still
              leaves configured pricing and total ownership economics incomplete. As a result, the strongest competitive
              advantage today is the simple base proposition rather than a demonstrably cheaper fully configured
              vehicle.
