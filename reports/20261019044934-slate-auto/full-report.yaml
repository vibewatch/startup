chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product thesis
        blocks:
          - type: paragraph
            body: >-
              Slate Auto is publicly described as a private American EV startup founded in 2022 and based in Troy,
              Michigan, with design activity in Long Beach and planned manufacturing in Warsaw, Indiana. Its first
              product is deliberately austere: a compact electric pickup built around a single low-cost configuration
              that buyers can customize later with accessories and an SUV-conversion kit. That product choice is central
              to the business model. Rather than chasing premium range or feature content, Slate is trying to win on a
              lower initial sticker price and post-sale upsellability. The evidence supports the identity and product
              concept; it does not yet support a disclosed revenue base, a firm customer count beyond refundable
              reservations, or a current valuation tied to the 2026 financing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO010
              - CO011
              - CO015
