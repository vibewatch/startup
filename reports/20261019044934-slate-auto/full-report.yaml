  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a deliberately simple revenue stack: a low-entry-price base truck, optional SUV
              conversion, and a long tail of accessories installed either by the owner or a service partner. That
              architecture matters because Slate is not disclosing recognized revenue, so the observable financial model
              is really a list-pricing model plus attach-rate assumptions. Public coverage consistently places the base
              vehicle in the mid-$20,000s before options, with some reporting framing the launch headline as below
              $25,000 and others tying the sub-$20,000 message to a now-uncertain federal tax credit. The upside is a
              broader top-of-funnel than most EV startups can claim; the downside is that public evidence still does not
              show realized ASP, option take-rates, discounting, or refund behavior once deposits convert into binding
              orders.
            claimRefs:
