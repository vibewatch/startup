      - number: '3.3'
        title: Moat durability and adverse competitor signals
        blocks:
          - type: paragraph
            body: >-
              The same evidence that makes Slate interesting also defines its moat risk. MIT Technology Review argues
              that Ford's F-150 Lightning failed to solve the low-cost EV-truck problem because battery size and price
              inflation overwhelmed the thesis, which helps explain why Slate's simpler product may resonate. But that
              article also says Ford is returning with a small EV truck around 2027, and TechCrunch notes that Rivian
              and Lucid are also pushing into more affordable models. In other words, if Slate validates the segment,
              larger incumbents and better-funded EV brands can respond with stronger balance sheets, fuller
              distribution, and more mature manufacturing. Public reservation counts show demand interest, but they do
              not yet prove conversion, delivery quality, or nationwide service depth.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modularity widens the comparison set
            body: >-
              Slate is not just another electric pickup. Its blank-slate packaging and SUV-conversion kits mean buyers
              can compare it against compact pickups, low-end EVs, and even budget crossovers depending on the accessory
              bundle.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP007
          - type: callout
            title: Incumbents can answer the thesis if demand is proven
            body: >-
              Slate may prove that an affordable, smaller EV truck has demand, but Ford's upcoming small EV truck and
              the broader push toward lower-cost EV models mean the affordability wedge is not necessarily durable once
              larger manufacturers decide to compete on the same job to be done.
            calloutType: risk
            claimRefs:
