      - number: '4.3'
        title: Traction, risk, and underwriting view
        blocks:
          - type: paragraph
            body: >-
              Slate's public traction signal is demand intent, not revenue quality. Sources cite more than 160,000
              refundable reservations and, later, thousands of preorders, which is directionally encouraging but still
              leaves the core financial conversion questions open: how many deposits become firm orders, what accessory
              mix lifts realized ASP, and how much service and warranty cost the stripped-down vehicle model actually
              carries. The delivery target remains late 2026, so revenue recognition still depends more on factory
              execution than on marketing narrative. The adverse evidence also matters: public reviewers explicitly warn
              that removing incentives pushes the entry price much closer to $30,000 and that the business must prove
              buyers will accept limited range and sparse standard equipment. Financially, the current evidence supports
              a credible low-cost EV thesis, but not a clean underwriting case on margin path or runway.
