  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Slate is not trying to win the EV truck market on luxury, long range, or a software-heavy cabin. Company
              and reviewer descriptions align on a radically simple two-seat base truck that buyers can personalize over
              time with wraps, interior accessories, and SUV conversion kits. That makes the product easier to describe
              in workflow terms than in trim-level terms: reserve the base vehicle, choose only the add-ons you want,
              and optionally convert or upgrade the vehicle later instead of buying a different model upfront. The
              strategic implication is that Slate's product promise is affordability plus configurability, not broad
              feature parity with incumbent electric pickups.
