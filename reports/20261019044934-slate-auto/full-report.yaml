            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO012
      - number: '1.3'
        title: Funding history, investor map, and public scale signals
        blocks:
          - type: paragraph
            body: >-
              The clearest public capital facts are that Slate closed a $650 million Series C in April 2026 and that
              multiple independent outlets place cumulative funding at roughly $1.4 billion. The same sources identify
              TWG Global, Jeff Bezos-related capital, General Catalyst, Slauson & Co., and Re:Build-linked founders as
              key stakeholders. What remains unclear is the actual economic stack beneath those headlines: the company
              has not publicly disclosed the Series C post-money valuation, liquidation preferences, debt, or secondary
              activity in the evidence reviewed here. Likewise, public scale indicators skew toward interest and plans
              rather than operating output: refundable reservations exceed 160,000 in some reports, but revenue,
              paid-order conversion, exact headcount, and full board composition remain undisclosed or imprecise.
            claimRefs:
              - CO007
              - CO008
