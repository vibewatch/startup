  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Slate's public revenue bridge starts with an affordable base truck and depends on options, installs, and
      production execution to turn demand into gross profit.
    data:
      nodes:
        - id: reservation
          label: Reservations / preorders
          value: '>160,000 reservations reported; thousands of preorders later'
          note: Demand intent is visible publicly, but conversion to delivered revenue is not.
        - id: base-truck
          label: Base truck order
          value: Mid-$20,000s / under $25,000 headline
          note: List-price anchor before options; incentive-adjusted under-$20,000 message is policy-sensitive.
        - id: upsell
          label: Accessory + SUV upsell
          value: 200+ accessories; >80% under $500; SUV kit about $5,000
          note: Monetization depends on attach rates more than on a rich standard trim ladder.
        - id: install
          label: DIY or service-partner installation
          value: Service pricing undisclosed
          note: Customization shifts labor and some complexity outside the main factory flow.
        - id: delivery
          label: Deliveries from Warsaw ramp
          value: Late 2026 target; 100k year-one capacity, 150k soon after
          note: Revenue timing depends on whether plant ramp, suppliers, and quality gates hold.
        - id: profit
          label: Gross profit and cash generation
          value: Gross-margin-positive vehicle target
          note: Public evidence provides a target, not disclosed realized margin, cash flow, or runway.
      edges:
        - from: reservation
          to: base-truck
          label: Converts only if deposits become firm paid orders
        - from: base-truck
          to: upsell
          label: ASP rises through kit and accessory attach
        - from: upsell
          to: install
          label: Some monetization and labor occur after the base build
        - from: install
          to: delivery
          label: Revenue recognition still waits on production and delivery
        - from: delivery
          to: profit
          label: Margin proof requires actual ramp economics, not only demand intent
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI009
      - CI010
      - CI012
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Slate's product stack combines a stripped-down core vehicle with post-sale accessory, service, and factory-ramp
      layers that carry much of the affordability thesis.
    data:
      layers:
        - label: Customer configuration layer
          detail: Reservation-led purchase flow starts from a base truck and adds accessories over time.
          outputs:
            - label: Reservation / preorder queue
            - label: Accessory selection
        - label: Base vehicle SKU
          detail: A common factory starting point is intended to avoid trim proliferation.
          modules:
            - label: Two-seat base truck
            - label: Minimal in-cabin hardware
        - label: Propulsion and charging
          detail: Public sources describe a single-motor EV with modest battery and range targets plus NACS charging.
          modules:
            - label: Single-motor RWD
            - label: 150-205 mile public range window
            - label: NACS fast charging
        - label: Accessory and conversion layer
          detail: Utility upgrades are designed as add-ons rather than factory variants.
          modules:
            - label: SUV conversion kit
            - label: Wraps and interior accessories
            - label: DIY or partner install
        - label: Service and support layer
          detail: The ownership model relies on third-party support and owner guidance, not a large captive dealer base.
          modules:
            - label: Planned 2,500+ service locations
            - label: Slate University install content
        - label: Manufacturing and ramp layer
          detail: The commercial thesis depends on simplified assembly reaching dependable volume in Indiana.
          modules:
            - label: Warsaw, Indiana factory
            - label: Late-2026 launch / 2027 ramp
    approximationNotes: >-
      This is an operating-model stack synthesized from disclosed components and dependencies, not an engineering
      schematic of hidden subsystems.
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE009
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Slate’s current customer path starts with a low-friction reservation and aims to monetize customization,
      installation, and support after base-vehicle purchase.
    data:
      items:
        - label: Affordability-led discovery
          actor: Price-sensitive retail buyer
          stage: Awareness
          touchpoints:
            - Mid-$20,000s target pricing
            - Mass-market / wage-earner positioning
          note: Cheap entry price is the main attention hook.
          tone: positive
        - label: Refundable reservation
          actor: Prospective buyer
          stage: Initial demand
          touchpoints:
            - $50 refundable deposit
            - 160,000+ reservation headline
          note: Strong intent signal, but commitment remains reversible.
          tone: warning
        - label: Configuration before delivery
          actor: Prospective owner
          stage: Pre-purchase
          touchpoints:
            - Base truck plus optional bigger battery
            - SUV conversion and add-on planning
          note: Final basket size depends on unpublished add-on economics.
          tone: warning
        - label: Delivery and installation choice
          actor: Buyer and service partner
          stage: Activation
          touchpoints:
            - DIY accessory installation
            - Professional install via service partner
          note: Ownership experience depends on execution outside the factory.
          tone: neutral
        - label: Daily-use ownership
          actor: Driver
          stage: Early use
          touchpoints:
            - Around-town range and low-cost utility
            - Phone-first / low-feature cabin
          note: Everyday fit must offset range and feature compromises.
          tone: neutral
        - label: Post-sale expansion
          actor: Existing owner
          stage: Expansion
          touchpoints:
            - 100+ accessories over time
            - Service / maintenance footprint
          note: Upsell and satisfaction proof remains unverified until vehicles are in service.
          tone: warning
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest-risk cluster combines production ramp, reservation conversion, and policy-driven price realization.
    data:
      columns:
        - label: Likelihood
        - label: Impact
      rows:
        - label: Production ramp
          values:
            - label: High
              note: Late-2026 delivery timing still depends on plant scale-up, certification, and plant commissioning.
              tone: negative
            - label: High
              note: A miss on launch readiness would impair revenue timing, credibility, and financing leverage.
              tone: negative
        - label: Reservation conversion
          values:
            - label: High
              note: Reservations are refundable and leadership changes explicitly targeted conversion to paid orders.
              tone: negative
            - label: High
              note: Weak conversion would expose the difference between attention and monetizable demand.
              tone: negative
        - label: Tax-credit / pricing exposure
          values:
            - label: High
              note: Slate already removed sub-$20k marketing once the federal EV credit was set to expire.
              tone: negative
            - label: High
              note: Price slippage directly threatens the affordable-EV thesis.
              tone: negative
        - label: Supplier concentration
          values:
            - label: Medium
              note: Battery sourcing is identified publicly, but contingency sourcing is not.
              tone: warning
            - label: Medium-high
              note: Supplier misses can hurt both timing and margin even if the platform is simplified.
              tone: warning
        - label: Prototype quality
          values:
            - label: Medium
              note: Early prototype roughness may improve before SOP, but public validation is still limited.
              tone: warning
            - label: Medium-high
              note: Quality misses at launch can rapidly damage brand trust and rework costs.
              tone: warning
        - label: Service-network execution
          values:
            - label: Medium
              note: DIY and partner installs broaden the support surface before coverage is proven.
              tone: warning
            - label: Medium-high
              note: Poor installation quality or weak warranty response would undercut personalization economics.
              tone: warning
    approximationNotes: >-
      Likelihood and impact buckets synthesize public-source evidence; they are ordinal judgments rather than modeled
      probabilities.
    claimRefs:
      - CR002
      - CR005
      - CR006
      - CR008
      - CR010
      - CR011
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Funding depth and an affordability wedge make Slate worth tracking, but price transparency and launch risk keep
      the recommendation below invest-now.
    data:
      nodes:
        - id: affordability
          label: Affordability wedge
          value: Mid-$20,000s target
          detail: The low entry price is the core commercial hook, but sub-$20,000 messaging depends on incentives.
        - id: demand
          label: Demand signal
          value: 160,000+ refundable reservations
          detail: Interest is real, but the evidence does not yet show paid-order conversion quality.
        - id: funding
          label: Funding base
          value: $1.4B raised
          detail: Slate has raised enough capital to keep industrialization moving toward launch.
        - id: scale
          label: Scale and quality risk
          value: Late-2026 launch / 150k target
          detail: Prototype quality, volume ramp, and break-even scale remain the hardest execution tests.
        - id: pricing
          label: Price transparency gap
          value: No disclosed round valuation
          detail: Public sources show round size and investors, but not post-money value or preference terms.
        - id: recommendation
          label: Recommendation
          value: Track
          detail: Wait for clean valuation terms, paid-order proof, and launch validation before underwriting a round.
      edges:
        - from: affordability
          to: demand
        - from: demand
          to: funding
        - from: funding
          to: scale
        - from: scale
          to: pricing
        - from: pricing
          to: recommendation
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV011
      - CV012
      - CV014
