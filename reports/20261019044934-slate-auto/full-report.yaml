              - CM007
              - CM014
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Slate has three plausible adoption drivers: a materially lower base price than typical new vehicles, a
              product designed around short daily driving needs rather than road-trip performance, and a modular revenue
              model that lets buyers defer nonessential spend into add-ons. Those same choices create meaningful
              constraints. The historical sub-$20,000 marketing hook depended on a discontinued tax credit, the company
              still has not published most option pricing, and the direct-sales-plus-service-partner model must prove
              that customization and repair remain simple after launch. Meanwhile, two-door packaging, rear-wheel drive,
              and limited range narrow the addressable buyer set, and affordable-electric competition is likely to
              increase as incumbents enter the segment.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reservations validate curiosity more than proven demand
            body: >-
              Slate has shown strong top-of-funnel interest, but the market case still turns on how many refundable
              reservations become paid orders once buyers see final option pricing and live with the two-door,
              short-range trade-off.
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM012
