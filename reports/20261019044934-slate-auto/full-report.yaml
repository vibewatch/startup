  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and substitute landscape
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a broad competitive set rather than one neat group of direct peers. Slate
              is positioned as a stripped-down, highly customizable electric pickup aimed at the low end of the market,
              which means it competes simultaneously with compact ICE or hybrid pickups, mainstream long-range EVs, and
              announced low-cost EV truck programs rather than only with other startups. The strongest substitute in the
              public record is the familiar small-truck format represented by the Ford Maverick comparison, while the
              strongest adjacent EV substitutes are mainstream EVs with more range and more features but materially
              higher price points. The evidence also suggests that the direct-startup peer set is weak: observers keep
              benchmarking Slate against failed or still-scaling EV entrants, which means trust and execution remain as
              important as product differentiation.
