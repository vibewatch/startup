      - number: '4.2'
        title: Cost structure and capital needs
        blocks:
          - type: paragraph
            body: >-
              Slate's economics pitch is that one base vehicle, later-stage customization, wrap-based finishing, and
              fewer factory permutations can lower capital intensity relative to a multi-trim launch. Public reporting
              supports pieces of that thesis: independent coverage describes a single-SKU strategy, and Slate's own site
              highlights a large accessory catalog priced mostly below $500, which is consistent with shifting
              monetization toward post-factory upsell. Capital needs are still meaningful, however. Electrek reported
              roughly $400 million of planned investment in the Warsaw plant, while TechCrunch and MIT Technology Review
              frame the broader business as already funded with roughly $1.4 billion raised. That is substantial
              financing, but not proof of adequacy: public sources still do not disclose cash on hand, monthly burn,
              warranty reserve assumptions, supplier concentration, or the working-capital requirements for ramping a
              physical vehicle business.
