companyProfile:
  summary: >-
    Slate Auto is a privately held US EV startup founded in 2022 and based in Troy, Michigan. The company is pursuing a
    low-cost, highly modular electric pickup with a stripped-down base configuration, accessory-led customization, and
    an optional SUV conversion path. Public reporting indicates strong sponsor backing and a planned late-2026
    production start, but the company has not yet disclosed the economic terms needed to assess its valuation, revenue
    base, or launch conversion quality.
