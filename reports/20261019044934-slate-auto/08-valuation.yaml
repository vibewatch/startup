company:
  name: Slate Auto
chapter:
  number: 8
  title: Valuation
  summary: Slate has built a credible affordability-and-simplicity wedge and has raised enough capital to reach launch, but the retained public evidence still does not disclose a round valuation, preference stack, or paid-order conversion quality. That combination supports a track stance rather than a priced investment recommendation until launch proof and financing terms are clearer.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: |-
      The retained evidence supports Slate as a credible company to watch, but not yet as a price-supported primary investment. The strongest positives are tangible: Slate has raised roughly $1.4 billion, still targets late-2026 deliveries, and is trying to attack a part of the U.S. market where average vehicle costs remain far above its advertised price point. The problem for underwriting is that the demand signal is still mostly refundable reservations, the final configured pricing stack is not yet fully disclosed, and public financing coverage does not show the current valuation or preference structure. In other words, the company may be strategically interesting while still being impossible to price responsibly from public evidence alone. That is a classic track setup rather than an invest-now setup. 
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV012, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-price-support
    title: Financing context and what public evidence can actually price
    body: |-
      Slate's financing context is directionally strong but still incomplete for valuation work. Multiple sources corroborate the $650 million Series C and roughly $1.4 billion total capital raised, and the company is using that capital to finish industrialization ahead of launch. The product concept also has a coherent cost story: a single blank-truck SKU, roughly 600 parts, and post-sale customization are all meant to reduce complexity and working-capital needs versus a conventional multitrim launch. But public evidence still stops short of the numbers an investor would need to underwrite an entry price with confidence. The retained sources do not disclose a post-money valuation, liquidation preferences, debt or secondary layers, or a margin bridge from base truck to accessory mix. That leaves price support incomplete even if the strategic logic is real.
    claimRefs: [CV001, CV005, CV006, CV007, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-diligence-and-thesis-breaks
    title: Scenarios, diligence asks, and thesis-break triggers
    body: |-
      The upside case is straightforward: if Slate can turn affordability into paid orders, launch on time, and keep the single-SKU model from unraveling operationally, the company could earn a premium narrative versus other EV startups that tried to scale with more expensive products. The downside case is just as clear. Independent coverage keeps returning to the same risk cluster: buyers still have to accept a small, short-range, no-frills EV; prototype quality still needs proof; and scale economics remain hard because a low-price vehicle needs real volume to break even. Public evidence therefore supports a diligence plan centered on paid-order conversion, accessory attach, gross-margin proof, supplier concentration, factory readiness, and exact financing terms. A recommendation upgrade needs those facts; a recommendation downgrade follows quickly if launch timing slips, effective selling prices drift toward $30,000, or quality and service readiness disappoint.
    claimRefs: [CV002, CV003, CV004, CV009, CV010, CV011, CV012, CV014]
    tableRefs: [TV003]
