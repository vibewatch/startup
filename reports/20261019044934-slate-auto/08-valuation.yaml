  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-transparency
      missingEvidence: Exact post-money valuation, share classes, liquidation preferences, board or control rights, any debt, and any secondary component of the latest round.
      whyItMatters: Those terms determine whether the company's current price is investable or already embeds most of the upside.
      diligencePath: Obtain the current financing deck, term sheet, cap table, and side-letter summary from the company or the lead investor.
      relatedQuestionRefs: [QV001, QV008]
    - type: private-evidence-only
      severity: material
      topic: demand-quality
      missingEvidence: Paid-order conversion, cancellation or refund behavior, deposit size mix, and any fleet purchase orders behind the reservation count.
      whyItMatters: Refundable reservations are not the same as durable revenue-quality demand for a low-margin hardware launch.
      diligencePath: Review weekly funnel data from reservations to configured paid orders, plus cohort retention by channel and geography.
      relatedQuestionRefs: [QV003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Bill of materials, accessory attach assumptions, gross-margin bridge, service and warranty economics, cash burn, and 2027 financing needs.
      whyItMatters: The valuation case depends on whether Slate can translate low list pricing into acceptable contribution margins and runway.
      diligencePath: Request the operating model, margin bridge by trim or accessory mix, and monthly cash forecast through the first 18 months of production.
      relatedQuestionRefs: [QV005, QV008]
    - type: private-evidence-only
      severity: material
      topic: industrialization-proof
      missingEvidence: Supplier concentration, crash and homologation readiness, pilot-line yield, service-part readiness, and launch-quality metrics.
      whyItMatters: Scale delays or quality misses could break both the bull case and the implied valuation narrative before volumes ramp.
      diligencePath: Run a plant-readiness diligence workstream covering supplier scorecards, PPAP status, validation milestones, and early service-network SLAs.
      relatedQuestionRefs: [QV004, QV007]
