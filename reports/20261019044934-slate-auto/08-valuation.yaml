    columns:
      - Dimension
      - Current view
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, Track, 'Public evidence supports strategic interest but not a price-supported check today.', 'Keep Slate on the active watchlist rather than underwriting a round from public evidence alone.']
      - [Confidence, Medium, 'Funding, product concept, and market thesis are visible; valuation terms and order quality are not.', 'Move up only after terms, paid orders, and launch proof are verified.']
      - ['Risk rating', High, 'Launch scale, quality, and demand-conversion risk still dominate the valuation case.', 'Require downside protections or wait for operating proof.']
      - ['Valuation stance', 'Public price unsupported', 'Retained financing sources show round size and investors, but not post-money value or preference structure.', 'Do not treat the latest round size as evidence that the entry price is justified.']
    notes: Recommendation is price-sensitive; the retained public evidence does not disclose the current round valuation, preference stack, or paid-order conversion quality.
    claimRefs: [CV001, CV003, CV012, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current reading
      - What would change the view
    rows:
      - ['Affordability wedge', 'Slate is attacking a part of the U.S. vehicle market where average prices remain far above its advertised entry point.', 'A durable view improves if configured prices stay near the mid-$20,000s without relying on disappearing incentives.']
      - ['Capital-light design thesis', 'The single-SKU, post-sale customization strategy could lower complexity and working-capital needs versus a conventional launch.', 'The thesis weakens if supplier complexity, accessory rework, or service costs erase the simplicity advantage.']
      - ['Anti-thesis: public valuation support is incomplete', 'Round size, investor names, and factory spending are public; post-money valuation, preference terms, and margin detail are not.', 'The view improves only when Slate discloses clean round terms and a margin path tied to actual launch economics.']
    notes: This table separates strategic logic from priceability; the anti-thesis is about underwriting discipline, not product novelty.
    claimRefs: [CV002, CV006, CV007, CV008, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, 'Paid-order conversion is strong, launch remains on schedule, quality holds, and buyers accept the minimalist truck at the advertised price.', 'Only then could a premium private-market entry be justified, because the company would be de-risking both demand and industrialization.', 'Accessory economics disappoint or launch execution slips before proof arrives.', 'Would require visible paid orders, validated quality, and cleaner round terms than public sources currently show.']
      - [Base, 'Slate reaches launch milestones but still with limited public disclosure on margins, preferences, and order quality.', 'The most defensible stance is still track: monitor execution and price later rather than forcing a valuation today.', 'Investors confuse funding raised with price support or overread refundable reservations as durable demand.', 'Best fits the current evidence set.']
      - [Bear, 'Configured prices drift higher, reservations fail to convert, or factory and quality ramp fall behind plan.', 'That setup creates flat-round or down-round risk because the low-price volume thesis breaks before the capital stack is fully proven.', 'Volume economics never clear, service quality disappoints, or launch timing slips beyond late 2026.', 'Adverse coverage on prototype quality and scale economics already points to this downside path.']
    notes: These are qualitative valuation ranges because the retained public evidence lacks an exact round valuation, cap-table terms, and a disclosed margin model.
    claimRefs: [CV002, CV003, CV004, CV009, CV010, CV011, CV012, CV014]
