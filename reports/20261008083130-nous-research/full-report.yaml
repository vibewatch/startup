  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Analytical Category
      - Investment Thesis Argument
      - Anti-Thesis Counter-Argument
      - Evidence That Would Shift View
    rows:
      - - Distribution & Ecosystem
        - Over 214,000 GitHub stars and 24 million clones provide an unbeatable top-of-funnel developer adoption moat.
        - >-
          Open-source clones yield low commercial monetization; free developers rarely convert to high-paying enterprise
          tiers.
        - >-
          Audited cohort data demonstrating >15% conversion rate from open-source users to paying Nous Portal or
          enterprise accounts.
      - - Architectural Strategy
        - >-
          Open weights and decentralized Psyche training insulate the lab from hyperscaler capex escalation and compute
          vendor lock-in.
        - >-
          Decentralized training is unproven at frontier scale; open-weight reasoning generates 1.5x-4x more tokens,
          increasing inference costs.
        - >-
          Empirical demonstration of a frontier-competitive model pre-trained entirely over Psyche with verified compute
          cost parity.
      - - Commercial Monetization
        - >-
          Tiered portal subscriptions ($20-$200/mo) and Hermes for Businesses create a dual-engine consumer and
          enterprise model.
        - >-
          Portal credits suffer from high developer churn; enterprise software sales face severe SOC2 compliance and
          liability friction.
        - >-
          Disclosure of multiple Fortune 500 enterprise production deployments under Hermes for Businesses with signed
          multi-year ACVs.
      - - Capital & Syndicate Strength
        - >-
          $158M cumulative funding backed by Robot Ventures, Nvidia, and Samsung provides multi-year liquidity and
          strategic hardware alignment.
        - >-
          Syndicate lacks traditional enterprise SaaS growth leads; governance is opaque with no independent board
          oversight disclosed.
        - >-
          Establishment of a formal board of directors with seasoned enterprise enterprise software governance
          representatives.
    notes: >-
      Arguments synthesize strategic positions across financial press and technical documentation. View-shift criteria
      define monitorable diligence kill criteria.
