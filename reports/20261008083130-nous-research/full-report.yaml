      - number: '5.2'
        title: Procedural Memory, Learning Loops, and Client Delivery Surfaces
        blocks:
          - type: paragraph
            body: >-
              The core cognitive differentiation of Hermes Agent centers on a structured learning loop powered by
              procedural memory rather than runtime model weight updates. During task execution, the agent synthesizes
              successful multi-step problem resolutions—such as debugging a containerized microservice or configuring an
              infrastructure pipeline—into permanent markdown files known as Skill Documents, conforming to the open
              agentskills.io standard. Across subsequent sessions, the agent queries this procedural library to retrieve
              previously verified execution sequences, bypassing the context-window limitations and incoherence typical
              of standard retrieval-augmented generation pipelines. To expand distribution beyond terminal-centric
              developers, Nous introduced Hermes Desktop, an Electron-based desktop application for macOS and Windows
              that natively interfaces with the core CLI runtime, session store, and skills database. Client
              monetization and hosted compute access are facilitated through Nous Portal, which offers subscription
              tiers bundling hosted tool execution across web search, cloud browser automation, computer vision, and
              speech generation with monthly API credit allocations.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
