      - number: '2.4'
        title: Growth Drivers, Structural Bottlenecks, and Diligence Risks
        blocks:
          - type: paragraph
            body: >
              Demand for Nous Research is propelled by three primary tailwinds: increasing developer resistance to
              corporate model censorship and safety refusals, demand for transparent reasoning traces, and the rising
              cost of centralized compute. By training Hermes models with synthetic data via DataForge and Atropos
              rejection sampling, Nous achieved a 60% non-refusal rate on RefusalBench compared to less than 18% for
              leading commercial models like GPT-4o and Claude Sonnet 4. Furthermore, hybrid reasoning architectures
              that allow users to inspect step-by-step thinking traces satisfy technical developers demanding
              steerability.


              Conversely, adoption faces formidable operational, economic, and technical constraints. Open-weight
              distribution inherently suppresses direct monetization, as users can freely run models without paying Nous
              Research. Running frontier reasoning models locally requires substantial compute hardware (such as
              high-VRAM GPUs), restricting full-capability adoption to well-resourced practitioners. On the
              infrastructure front, Psyche Network's decentralized training model relies on unproven distributed
              training over heterogeneous internet connections, confronting severe bandwidth, synchronization, and
              verification challenges. Finally, capital concentration remains a strategic barrier, as closed
              hyperscalers command tens of billions of dollars in annual capex that dwarf independent lab budgets.
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM015
              - CM016
