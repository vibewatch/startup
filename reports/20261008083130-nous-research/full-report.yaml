        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Public materials show both mitigation intent and meaningful operating complexity. The terms promise
              commercially reasonable efforts toward continuous availability but carve out planned downtime and events
              outside company control. Hermes documentation says conversations, memory, and skills remain local and that
              tool denials and approvals are explicit; the product page also advertises five execution backends with
              container hardening and namespace isolation. Those controls reduce some deployment risk, yet independent
              commentary still describes decentralized training outside controlled demonstrations as unproven and warns
              that distributed compute broadens exposure to data-integrity, model-poisoning, and node-reputation
              attacks. No assigned evidence quantifies outage rates, recovery objectives, security-test coverage, or
              distributed-training failure rates, so residual likelihood ratings remain analyst judgments that require
