              - CE014
      - number: '5.3'
        title: Underlying Models, Training Infrastructure, and Operational Security
        blocks:
          - type: paragraph
            body: >-
              Underpinning the agent harness is Nous Research's proprietary model post-training pipeline and
              decentralized compute infrastructure. The Hermes model family is fine-tuned from base open-weight
              architectures such as Llama 3.1 using the Atropos reinforcement learning environment alongside the
              DataForge synthetic data engine, with synthetic generation accounting for over ninety percent of training
              corpora to maximize tool-calling precision and multi-step reasoning stability. To solve compute
              constraints across large-scale pretraining, Nous developed the Distributed Training Over-the-Internet
              (DisTrO) optimizer, an algorithm that reduces cross-node network bandwidth requirements by multiple orders
              of magnitude to enable collaborative training over consumer and decentralized GPU networks. This
              architecture powers the Psyche Network on the Solana blockchain, designed to coordinate distributed model
              training via on-chain incentive mechanisms. From a security and trust perspective, executing arbitrary
              code through messaging gateways presents significant surface risk; Hermes implements container namespace
              isolation, dropped Linux capabilities, prompt-injection scanners on memory inputs, and human-in-the-loop
              approval queues for irreversible shell commands and memory modifications.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE005
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Divergence: Bounded Agentic Harness vs Model Scaling'
            body: >-
              Nous Research has deliberately decoupled the agentic harness from underlying foundation model ownership.
              By ensuring Hermes Agent remains completely model-agnostic and deploying MIT-licensed open infrastructure,
              Nous captures developer distribution while insulating its product utility from shifting foundation model
              leadership.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE008
          - type: callout
            title: Enterprise Deployment Vulnerabilities in Open Agent Gateways
            body: >-
              Operating an autonomous agent with persistent terminal execution privileges across uncontrolled messaging
              channels introduces severe security exposure. Without deterministic enterprise-level deny-lists and formal
              confidence-scoring audit gates, organizations face heightened risks of prompt injection, unauthorized
              privilege escalation, and unintended state mutation.
            calloutType: risk
            claimRefs:
              - CE003
              - CE010
              - CE015
              - CE016
