  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Agent Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Nous Research defines its primary product surface through Hermes Agent, an open-source, MIT-licensed
              autonomous agent harness designed to overcome memory decay and environmental isolation in multi-step AI
              engineering workflows. Rather than functioning as an ephemeral chat assistant or IDE-bound code completion
              tool, Hermes Agent acts as a persistent background daemon that operates across continuous sessions and
              connects directly to end-user messaging applications. Users interact with the agent through a
              multi-platform gateway supporting more than twenty communication protocols—including Telegram, Discord,
              Slack, WhatsApp, Signal, and Matrix—allowing developers to dispatch commands, receive task completion
              alerts, and transmit voice memos from mobile devices while execution occurs on remote infrastructure. The
              agent operates within five distinct execution environments spanning local machines, hardened Docker
              containers, remote SSH instances, high-performance computing Singularity containers, and serverless Modal
              compute, giving the system dedicated terminal access to manipulate long-running data pipelines and inspect
              codebases without ongoing human intervention.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
