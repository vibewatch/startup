      - number: '8.2'
        title: Financing Context, Entry Discipline, and Valuation Realism
        blocks:
          - type: paragraph
            body: >-
              Nous Research's capitalization trajectory accelerated dramatically across 2026, culminating in an expanded
              $90 million Series B equity round at a $1.5 billion post-money valuation, lifting cumulative funding to
              $158 million. Earlier venture tracking in July 2026 initially documented syndicate discussions for at
              least $75 million led by Robot Ventures and Union Square Ventures, following an estimated $70 million
              raised across prior seed financings and an April 2025 Series A led by Paradigm. The final October 2026
              syndicate expanded to incorporate corporate strategic and venture backers including Nvidia, Samsung, Menlo
              Ventures, and 1789 Capital. When evaluated against the company's reported mid-September 2026 annualized
              run-rate of approximately $36 million, the $1.5 billion headline valuation translates into an enterprise
              revenue multiple of roughly 41.7x. Financial analysts emphasize that pricing an early-stage lab at unicorn
              levels on self-serve portal tiers ($20 to $200 per month) constitutes pure optionality pricing on future
              architectural dominance rather than supportable cashflow multiples. Public evidence does not substantiate
              this price on conventional SaaS fundamentals; an incoming investor is paying a substantial premium for
              unproven enterprise conversion and untested decentralized compute scaling.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
