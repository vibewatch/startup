  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is qualitative rather than a measured incident-frequency model. The most consequential
              exposures are the public contract's broad rights over customer data, its disclaimers around AI-output
              accuracy and non-infringement, and the unresolved ability to operate decentralized training securely at
              meaningful scale. Provider dependence and execution capacity rank next because Hermes can use many
              external model services while the company is simultaneously hiring security, support, and finance
              functions. These risks do not establish that a breach, enforcement action, or outage occurred. They
              instead identify where loss severity could be high and where the assigned public evidence does not
              establish mature controls. Investment should therefore remain conditional on private contract review,
              independent security assurance, production reliability data, and reconciled financing and cash evidence.
            claimRefs:
