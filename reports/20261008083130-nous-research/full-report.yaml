      - number: '2.3'
        title: Buyer Personas, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >
              Adoption pathways for Nous Research's product portfolio diverge sharply across buyer personas, budget
              sources, and procurement workflows. The largest volume cohort comprises individual open-source developers,
              AI researchers, and hobbyists who download open weights from Hugging Face or clone the GitHub repository.
              These users run Hermes locally or on virtual private servers without incurring software licensing fees,
              utilizing self-hosted tooling across messaging gateways such as Telegram, Discord, and Slack.


              Conversion to paying customer tiers occurs along two distinct commercial tracks. Prosumers and boutique
              development teams transition to the Nous Portal hosted version ($20/month Plus, $100/month Super,
              $200/month Ultra) to avoid infrastructure maintenance overhead while accessing hosted tool execution,
              multi-model routing across 200+ models, and bundled credit allowances. At the organizational level,
              engineering leaders and corporate IT departments evaluate Hermes for Businesses. Budget ownership for this
              enterprise tier resides with VP of Engineering and Chief Information Officer budgets, triggered by
              enterprise data privacy mandates, sovereign compliance requirements, and dissatisfaction with proprietary
              vendor lock-in.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM010
              - CM013
              - CM014
