      - number: '4.3'
        title: Cost Structure, Unit Margin Drivers, and Accounting Controls
        blocks:
          - type: paragraph
            body: >-
              The cost profile and unit economics of Nous Research are heavily influenced by the hosting and inference
              compute required to service hosted agent workflows and multi-model tool calls. Because Hermes Agent
              coordinates complex multi-step reasoning, execution loops, and automated tool integrations across more
              than two hundred foundation models, inference token consumption can escalate rapidly relative to standard
              single-prompt conversational interfaces. The underlying cost of goods sold (COGS) encompasses cloud
              compute infrastructure, specialized GPU capacity, and API routing charges incurred when servicing user
              queries. Because gross margins, hosting efficiency benchmarks, and customer acquisition costs have not
              been publicly disclosed, evaluating true software contribution margins remains a primary underwriting gap.
              To mature its operational governance and financial controls, Nous Research is actively recruiting a
              corporate Controller in New York to establish and lead its in-house accounting and finance function behind
              models, infrastructure, and commercial software products.
