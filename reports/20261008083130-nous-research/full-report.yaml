  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Categorization, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Defining the addressable market for Nous Research requires disaggregating three interrelated spending
              categories: open-source foundation models and post-training weights, developer agent orchestration
              environments, and decentralized compute coordination. Included spend spans commercial developer
              subscriptions for hosted model interfaces and agents, API token routing, enterprise private agent
              deployment licenses under Hermes for Businesses, and tokenized distributed compute rewards. Excluded spend
              encompasses closed hyperscaler foundation model API subscriptions (such as proprietary enterprise OpenAI
              or Anthropic contracts), dedicated sovereign hyperscale data center infrastructure capex, and non-agentic
              business process automation software.


              Status-quo substitutes represent a critical ceiling on commercial capture. In the autonomous local agent
              domain, OpenClaw established early market mindshare for desktop-based task execution, serving as a primary
              open-source benchmark against which Hermes competes directly. On the cloud infrastructure side,
              centralized model routing and API inference platforms (such as OpenRouter or hyperscaler managed
              endpoints) capture substantial developer token volume without requiring users to commit to full-stack
              self-hosted frameworks. Furthermore, traditional software engineering teams frequently rely on rigid
              script-based automation or proprietary IDE extensions rather than investing in autonomous multi-step
              reasoning agents with persistent state.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
