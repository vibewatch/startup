      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Return Pathways'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the investment profile of Nous Research requires explicit scenario modeling across varying
              assumptions regarding enterprise contract execution, hosting gross margins, and open-source monetization
              efficiency. Under the Bull Case, Nous Research successfully scales Hermes for Businesses, converts large
              enterprise accounts seeking sovereign data privacy, meets its forward projection of exceeding $100 million
              in annualized run-rate, and establishes Psyche as a viable decentralized training alternative, justifying
              a valuation expansion to $3.0 billion to $4.0 billion (2.0x to 2.7x MOIC). In the Base Case, commercial
              growth decelerates as developer portal subscription churn remains elevated, enterprise sales cycles
              lengthen due to compliance and security audit friction, and annualized revenue reaches $55 million to $65
              million, resulting in valuation multiple compression to 15x to 20x ARR and an implied equity mark of $900
              million to $1.2 billion (-40% to -20% downside). In the Bear Case, closed hyperscalers release superior,
              highly efficient enterprise desktop agents that erode Hermes developer mindshare, while compute hosting
              expenses erode gross margins, triggering down-round restructuring at a 5x to 8x ARR multiple ($200 million
              to $350 million equity valuation, representing a severe 75% to 85% capital loss). Downside triggers center
              on open-weight base-model license restrictions, enterprise data-leakage liability, and inability to
              achieve cashflow breakeven before exhausting Series B proceeds.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Comparable Landscape, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Public and private market comparables illustrate the bifurcation between capital-intensive closed frontier
              providers and developer-focused open-source tooling companies. Closed frontier leaders like OpenAI and
              Anthropic have commanded revenue multiples of 30x to 50x ARR, but operate with multi-billion-dollar
              compute commitments, enterprise distribution partnerships, and proprietary model lock-in. Conversely,
              public open-source infrastructure and developer tooling peers trade at more conservative forward multiples
              of 8x to 15x revenue, reflecting the structural friction of converting open-source software downloads into
              durable recurring software revenue. Secondary market activity for Nous Research shares on platforms like
              Forge Global remains highly limited with no established secondary transaction price, reflecting
              significant illiquidity and transfer restrictions. Exit readiness via traditional initial public offering
              (IPO) remains years away given the absence of audited GAAP financial statements, corporate governance
              disclosures, or an independent board of directors. Key diligence kill criteria and thesis-break triggers
              include: failure to demonstrate positive gross margins on hosted portal inference, lack of verified
              enterprise contracts exceeding $250k ACV, departure of core technical founders, or regulatory enforcement
              regarding uncurated open-weight agentic execution.
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Verdict: Research-More / Hold at $1.5B Price Level'
            body: >-
              Nous Research represents a compelling technical bet on open-source intelligence and decentralized compute
              architecture. However, at a $1.5 billion valuation commanding 41.7x reported annualized run-rate, the
              equity is aggressively overvalued on traditional financial metrics. Investors should withhold capital
              allocation until management provides audited GAAP income statements, verifies positive hosting gross
              margins, and demonstrates paying enterprise customer contract retention under Hermes for Businesses.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV016
          - type: callout
            title: Downside Exposure to Multiple Compression and Down-Round Risk
            body: >-
              Because the Series B syndicate priced Nous Research on future optionality rather than cashflow support,
              any growth deceleration or gross margin compression will trigger sharp multiple contraction. If the
              company fails to reach its $100 million exit run-rate target and settles into standard infrastructure
              multiples of 12x to 18x ARR, equity value would compress by 30% to 50%, posing severe down-round risk for
              late-stage entrants lacking senior liquidation preferences.
            calloutType: risk
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV013
