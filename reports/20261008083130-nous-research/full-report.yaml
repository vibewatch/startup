      - number: '2.2'
        title: 'Sizing Lenses: TAM, SAM, and Constrained Developer Adoption'
        blocks:
          - type: paragraph
            body: >
              Market sizing for frontier open-source AI labs cannot be captured through a single macro figure due to the
              fundamental structural divergence between open-weight adoption and commercial software revenue. Broad
              industry estimates for global enterprise AI software and infrastructure project
              multi-hundred-billion-dollar addressable opportunities by 2030, but monetization in open-source ecosystems
              is heavily constrained by free distribution. The primary developer traction for Hermes—reflected in over
              214,000 GitHub stars, 40,000 forks, and more than 24 million clones—demonstrates substantial global
              developer mindshare, representing roughly 2.5% of estimated global AI token consumption.


              However, commercial capture is segmented into distinct serviceable layers. The developer and prosumer
              addressable segment is monetized via hosted portal subscriptions ranging from $20 to $200 per month,
              yielding an estimated annualized revenue run-rate of approximately $36 million as of mid-September 2026.
              The enterprise tier, targeted by Hermes for Businesses, represents a higher-contract-value serviceable
              market where corporate buyers seek customized multi-step agents that keep private data within corporate
              perimeters. Meanwhile, the long-term infrastructure frontier is pursued through Psyche Network, a
              decentralized training coordination protocol on Solana leveraging the DisTrO optimizer to aggregate idle
              global GPU compute, aiming to substitute centralized multi-billion-dollar pretraining clusters.
            claimRefs:
              - CM006
