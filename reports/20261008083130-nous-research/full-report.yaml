  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Commercial Assumptions
      - Target Revenue & Implied Valuation
      - Return Multiple / Loss
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Hermes for Businesses scales rapidly; year-end ARR exceeds $100M; gross margins stabilize above 65%; Psyche
          proves distributed training.
        - 'ARR: $120M-$150M; Valuation: $3.0B-$4.0B (25x-30x multiple)'
        - 2.0x - 2.7x MOIC
        - Execution failure in enterprise direct sales; hyperscaler pricing war on managed inference.
        - 25% (High execution hurdle requiring flawless enterprise sales expansion)
      - - Base Case
        - >-
          Self-serve Portal remains primary driver; enterprise conversion is slow and consultative; annualized run-rate
          reaches $55M-$65M.
        - 'ARR: $55M-$65M; Valuation: $900M-$1.2B (15x-20x multiple)'
        - '-40% to -20% Loss (Multiple compression)'
        - Developer churn on credit tiers; rising GPU hosting costs compressing gross margins.
        - 50% (Reflects baseline developer-led open-source software growth realities)
      - - Bear Case
        - >-
          Enterprise pilots fail compliance audits; open-source developer enthusiasm wanes; token generation
          inefficiency erodes economics.
        - 'ARR: $25M-$35M; Valuation: $200M-$350M (5x-10x multiple)'
        - '-85% to -75% Loss (Down-round restructuring)'
        - Upstream base model licensing restrictions; critical security breaches via agent execution.
        - 25% (Material vulnerability if hyperscalers bundle superior desktop agents)
    notes: >-
      Scenario returns assume entry at the current $1.5 billion post-money valuation. Multiple ranges are calibrated
      against public and private developer-infrastructure peers.
