      - number: '7.2'
        title: Regulatory, legal, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              Nous Research's public terms identify a Delaware corporation, California law, and individual JAMS
              arbitration, but they do not substitute for a jurisdiction-by-jurisdiction regulatory assessment. The
              terms grant broad rights to use customer data for service development and model work, with Privacy Mode
              described as the exception, while also disclaiming that AI outputs are unique, accurate, complete,
              non-infringing, or fit for a particular purpose. Aggregate liability is capped by reference to six months
              of fees for the service giving rise to the claim. An independent diligence guide separately found limited
              public detail on formal ethical frameworks and third-party certifications. The residual issue is not proof
              of noncompliance; it is that enterprise buyers need evidence on default data settings, sub-processors,
              retention, audit rights, certifications, indemnities, and negotiated contract departures before regulated
              deployment.
