      - Decision Implication for Investment Committee
    rows:
      - - Investment Recommendation
        - Research-More (Cautious Track)
        - >-
          Commercial traction is nascent; $36M run-rate relies on unverified management figures rather than audited GAAP
          financials.
        - >-
          Withhold new capital allocation at current $1.5B valuation until audited enterprise cohort retention and
          margins are produced.
      - - Recommendation Confidence
        - Medium
        - >-
          Capitalization and headline valuation are confirmed across WSJ and TechCrunch, but internal P&L and burn
          remain private.
        - >-
          Requires direct access to virtual data room to confirm cash runway, compute liabilities, and enterprise
          pipeline quality.
      - - Risk Rating
        - Adverse / High Speculative Risk
        - >-
          Heavy optionality pricing (41.7x ARR), governance opacity, lack of board roster, and unproven decentralized
          training economics.
        - >-
          Impose severe downside liquidation preferences and protective covenants before considering secondary or
          follow-on equity.
      - - Valuation Stance
        - Overvalued Relative to Fundamentals
        - >-
          Priced at 41.7x annualized run-rate; software infrastructure comps trade at 8x-15x revenue, implying
          significant multiple risk.
        - >-
          Seek entry valuation discount of 40% to 50% or structured downside protection to insulate against multiple
          compression.
      - - Primary Decision Trigger
        - Audited Enterprise ARR Conversion
        - >-
          Success of Hermes for Businesses in signing recurring enterprise contracts versus ephemeral consumer developer
          credits.
        - >-
          Tie any follow-on capital commitment to verified milestones exceeding $50M in audited GAAP ARR with positive
          gross margins.
