evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current cap table, board roster, voting agreements, investor rights, founder vesting, executive org chart, and
      key-person protections.
    whyItMatters: Founder and investor labels do not establish control, succession coverage, or governance protections.
    diligencePath: >-
      Request the fully diluted cap table, charter and bylaws, board consents, voting agreements, investor-rights
      agreements, founder vesting schedules, and current org chart.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: organization
    missingEvidence: A dated roster of current executives, employees, reporting lines, locations, and functional ownership.
    whyItMatters: Open roles and research credits cannot establish current headcount, management depth, or key-person dependence.
    diligencePath: >-
      Obtain the HR roster, executive biographies, reporting-line org chart, location breakdown, and twelve-month hiring
      and attrition history.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Executed Series B closing documents and a financing schedule reconciling the reported $70 million and $158 million
      cumulative totals.
    whyItMatters: Funding raised is not cash available, and unreconciled totals impede dilution, runway, and valuation analysis.
    diligencePath: >-
      Review stock-purchase documents, wire receipts, capitalization records, debt instruments, secondaries, and a
      management-prepared sources-and-uses schedule.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Company-verified customer count, customer concentration, current headcount, audited or management financials, and
      a precise revenue-metric definition.
    whyItMatters: Annualized revenue is not audited revenue or ARR, and hiring openings do not measure organizational scale.
    diligencePath: >-
      Request monthly financial statements, revenue-recognition policy, ARR bridge, customer cohort and concentration
      files, contracts, invoices, and payroll records.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Primary dated announcements for product launches, partnerships, regulatory events, outages, and other adverse
      operating incidents.
    whyItMatters: The available timeline is financing-heavy and cannot establish a complete operating or adverse-event history.
    diligencePath: >-
      Review the company newsroom archive, release tags, status history, incident logs, material contracts, legal
      correspondence, and regulator searches.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs: []
