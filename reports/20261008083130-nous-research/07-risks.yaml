callouts:
  - calloutType: "risk"
    title: "Thesis-break trigger"
    body: >-
      Pause investment if confirmatory diligence cannot establish enforceable enterprise data
      controls and output-risk allocation, independently reproduce decentralized-training
      reliability, or reconcile cash, burn, and the 2026 growth plan. Those failures would leave the
      core commercialization and infrastructure theses dependent on unsupported assumptions.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR012"
  - calloutType: "insight"
    title: "Mitigations are visible but not yet assurance"
    body: >-
      Local storage, local-model support, explicit tool controls, and hardened execution backends
      are relevant mitigations. They should be tested as controls rather than accepted as proof of
      enterprise security, reliability, or regulatory compliance.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR015"
