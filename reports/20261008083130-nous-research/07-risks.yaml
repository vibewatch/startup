company:
  name: "Nous Research"
chapter:
  number: 7
  title: "Risks"
  summary: "The highest residual risks are broad customer-data rights in the public terms, limited vendor responsibility for AI outputs and third-party services, and an unproven decentralized-training operating model. Public mitigations exist—Privacy Mode, local inference, explicit tool controls, and sandboxed execution—but enterprise assurance, independent scale benchmarks, concentration data, and cash-runway evidence remain diligence gaps."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and investment implications"
    body: >-
      The risk ranking is qualitative rather than a measured incident-frequency model. The most
      consequential exposures are the public contract's broad rights over customer data, its
      disclaimers around AI-output accuracy and non-infringement, and the unresolved ability to
      operate decentralized training securely at meaningful scale. Provider dependence and
      execution capacity rank next because Hermes can use many external model services while the
      company is simultaneously hiring security, support, and finance functions. These risks do
      not establish that a breach, enforcement action, or outage occurred. They instead identify
      where loss severity could be high and where the assigned public evidence does not establish
      mature controls. Investment should therefore remain conditional on private contract review,
      independent security assurance, production reliability data, and reconciled financing and
      cash evidence.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR010"
      - "CR014"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-risk"
    title: "Regulatory, legal, and data-governance exposure"
    body: >-
      Nous Research's public terms identify a Delaware corporation, California law, and individual
      JAMS arbitration, but they do not substitute for a jurisdiction-by-jurisdiction regulatory
      assessment. The terms grant broad rights to use customer data for service development and
      model work, with Privacy Mode described as the exception, while also disclaiming that AI
      outputs are unique, accurate, complete, non-infringing, or fit for a particular purpose.
      Aggregate liability is capped by reference to six months of fees for the service giving rise
      to the claim. An independent diligence guide separately found limited public detail on formal
      ethical frameworks and third-party certifications. The residual issue is not proof of
      noncompliance; it is that enterprise buyers need evidence on default data settings,
      sub-processors, retention, audit rights, certifications, indemnities, and negotiated contract
      departures before regulated deployment.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-security-risk"
    title: "Operational, quality, and security exposure"
    body: >-
      Public materials show both mitigation intent and meaningful operating complexity. The terms
      promise commercially reasonable efforts toward continuous availability but carve out planned
      downtime and events outside company control. Hermes documentation says conversations, memory,
      and skills remain local and that tool denials and approvals are explicit; the product page
      also advertises five execution backends with container hardening and namespace isolation.
      Those controls reduce some deployment risk, yet independent commentary still describes
      decentralized training outside controlled demonstrations as unproven and warns that
      distributed compute broadens exposure to data-integrity, model-poisoning, and node-reputation
      attacks. No assigned evidence quantifies outage rates, recovery objectives, security-test
      coverage, or distributed-training failure rates, so residual likelihood ratings remain
      analyst judgments that require telemetry and third-party validation.
    claimRefs:
      - "CR003"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "partner-financial-execution-risk"
    title: "Partner, financial-model, and execution dependencies"
    body: >-
      Hermes can route to multiple commercial providers or local OpenAI-compatible endpoints, which
      reduces single-vendor lock-in but does not eliminate dependency risk: the public terms state
      that Nous Research does not control third-party services and may discontinue dependent
      features. Financial reporting is also fast-moving and second-hand. An October article reported
      a $90 million Series B at a $1.5 billion valuation, $158 million of total funding, and about
      $36 million of annualized revenue in mid-September 2026, alongside a company expectation to
      exceed $100 million by year-end. A July article had described at least $75 million as still in
      talks. Funding raised is not cash available, and annualized revenue is not ARR or audited
      revenue. The hiring page's 13 openings, including security, support, and controller roles,
      indicate capability-building but leave capacity, retention, burn, and runway unverified.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
