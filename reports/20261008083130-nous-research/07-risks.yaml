    - type: "private-evidence-only"
      severity: "material"
      topic: "execution-capacity"
      missingEvidence: "Current headcount by function, hiring plan, attrition, key-person dependencies, role-fill timing, and management bandwidth."
      whyItMatters: "Open roles show intended investment but do not establish that the organization can deliver concurrent security, support, finance, and infrastructure priorities."
