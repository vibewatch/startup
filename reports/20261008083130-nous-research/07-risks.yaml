  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "enterprise-contract-controls"
      missingEvidence: "Enterprise MSA, DPA, sub-processor list, data-retention schedule, Privacy Mode defaults, indemnity language, and negotiated liability terms."
      whyItMatters: "Public terms place material data and output risk on customers, but private enterprise protections may differ."
      diligencePath: "Review current standard enterprise agreements and two executed customer contracts with security and legal schedules."
      relatedQuestionRefs:
        - "QR001"
        - "QR002"
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "regulatory-legal-register"
      missingEvidence: "Direct regulator, court, certification, insurance, and formal compliance records relevant to current products and deployment jurisdictions."
      whyItMatters: "The public terms and commentary cannot establish the company's complete legal or regulatory posture."
      diligencePath: "Run counsel-led regulator and litigation searches by legal entity and request certifications, insurance binders, and regulator correspondence."
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "distributed-training-validation"
      missingEvidence: "Independent benchmarks for decentralized training scale, node-failure recovery, convergence quality, cost, and reproducibility."
      whyItMatters: "The infrastructure thesis depends on reliable distributed training beyond controlled demonstrations."
      diligencePath: "Commission an independent reproduction using disclosed hardware, network conditions, checkpoints, and failure injection."
      relatedQuestionRefs:
        - "QR004"
      relatedTableRefs:
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "security-reliability-assurance"
      missingEvidence: "Penetration tests, threat model, incident register, uptime history, recovery objectives, and enterprise SLA performance."
      whyItMatters: "Public mitigation descriptions do not quantify control effectiveness or production reliability."
      diligencePath: "Review third-party security reports and twelve months of redacted operational and incident telemetry."
      relatedQuestionRefs:
        - "QR003"
        - "QR009"
      relatedTableRefs:
