callouts:
  - calloutType: "risk"
    title: "Valuation Premium Dependent on Unproven Enterprise Conversion"
    body: "Nous Research's $1.5 billion valuation reflects an aggressive multiple of more than 40 times its reported $36 million annualized revenue run-rate. While developer interest in open-source Hermes Agent is proven with 24 million clones, transitioning into high-retention corporate workflows via Hermes for Businesses remains unproven, leaving the capital structure vulnerable to multiple compression if enterprise sales cycles lengthen."
    claimRefs:
      - "CI001"
      - "CI009"
      - "CI012"
  - calloutType: "insight"
    title: "Capital Cushion Mitigates Immediate Financing Dependency"
    body: "The closure of the $90 million Series B round led by Robot Ventures provides significant capital runway, lifting cumulative funding to $158 million. With an engineering team still in the 11-50 employee band and hiring its first Controller to build out finance operations, Nous possesses a multi-year cash buffer to subsidize developer token usage while commercializing enterprise agent tiers."
    claimRefs:
      - "CI010"
      - "CI013"
