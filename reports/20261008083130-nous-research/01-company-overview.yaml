artifact: company-overview
slug: nous-research
runDate: 2026-10-08
company:
  name: Nous Research
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nous Research is a venture-backed open-source AI company whose current commercial surface combines
    Hermes Agent, hosted model access, and enterprise ambitions. October 2026 reporting places its latest
    financing at $90 million and its valuation at $1.5 billion, while governance, customer count, and
    company-verified headcount remain material diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Nous Research presents itself as an open AI training and research company that trains models, builds
      agents, and develops infrastructure. Its flagship public product is Hermes Agent, which the company
      describes as an open-source, self-improving agent with persistent memory and skill creation. The
      commercial model is already more than research distribution: the Hermes surface advertises free,
      $20, $100, and $200 monthly tiers with credits for hosted model and tool usage. Third-party reporting
      also describes a push into business users. This creates a hybrid model in which open-source adoption
      is the distribution layer and hosted access or enterprise deployment is the monetization layer.
      Evidence on incorporation and operating location is less clean: a September 2026 profile identifies
      a Delaware corporation based in Austin, while an older Tracxn profile still labels the company as
      New York City-based. The newer record is more timely, but primary legal and address documents were
      not allocated to this chapter, so the discrepancy remains visible rather than being silently resolved.
    claimRefs: [CO001, CO002, CO003, CO004, CO011, CO012]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Two independent 2026 sources identify Jeffrey Quesnelle, Karan Malhotra, Ryan Teknium, and Shivani
      Mitra as the four founders. That is sufficient to establish the founding group, but not a current
      executive org chart: the assigned evidence does not consistently state present titles, reporting
      lines, or functional ownership. The company careers page lists 13 open positions, including remote
      engineering, security, and support roles and a New York-based controller role, which signals active
      organizational build-out but is not a headcount proxy. Governance transparency is the larger issue.
      The reviewed independent profile found no public cap table or current board roster. That absence does
      not establish that no directors exist; it means voting control, board composition, investor rights,
      founder ownership, and key-person protections cannot be verified from this evidence set. Diligence
      should therefore request the current org chart, board consents, capitalization table, and founder
      vesting rather than infer authority from founder or investor labels.
    claimRefs: [CO005, CO010, CO013]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing, scale, and stakeholders
    body: >-
      The strongest current financing evidence is The Wall Street Journal's report that Nous Research
      raised $90 million at a $1.5 billion valuation; UA.News independently repeats the round size and
      valuation and labels it a Series B. UA.News further reports $158 million of total funding after the
      round, annualized revenue of about $36 million in mid-September 2026, and a company expectation of
      exceeding $100 million by year-end. These are not interchangeable metrics: annualized revenue is not
      audited revenue, a forecast is not realized revenue, and cumulative funding is not cash available.
      The $158 million total also differs from Tracxn's $70 million over three rounds. The most plausible
      explanation is source vintage around the new round, but the assigned evidence does not provide a
      closing document or cap table that reconciles the totals. Investor reporting names Robot Ventures
      as lead and identifies Nvidia, Union Square Ventures, Menlo Ventures, Samsung, and 1789 Capital as
      participants; none of those names alone proves a board seat, ownership percentage, or control right.
    claimRefs: [CO006, CO007, CO008, CO009, CO016]
    tableRefs: [TO003]
  - id: milestones-and-investment-readthrough
    title: Milestones and investment read-through
    body: >-
      The public sequence is rapid: a 2023 founding, seed financings in January 2024 and January 2025, a
      Series A in April 2025, reported financing talks in July 2026, and a reported $90 million Series B by
      October 2026. The July analysis explicitly described the contemplated $75 million-plus financing as
      unclosed, whereas the October reports describe a larger completed raise; period and transaction
      status must accompany any use of either number. Commercial evidence also advanced during 2026:
      hosted Hermes tiers were active by the review date and reporting cited a mid-September annualized
      revenue snapshot. FourWeekMBA's adverse interpretation is useful but not an independent benchmark:
      it argues that the valuation prices optionality around open weights and decentralized compute and
      emphasizes that those architecture bets remain unproven against well-capitalized incumbents.
      Exact dates for product launches and adverse operating events were not available in the assigned
      pool, so the timeline shows only dated or period-bounded milestones and the missing history remains
      an explicit diligence item.
    claimRefs: [CO004, CO006, CO007, CO010, CO014, CO015, CO016]
    figureRefs: [FO001]
