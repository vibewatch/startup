      - [Samsung, "Reported Series B investor", "Economic stake undisclosed", "Confirm investing entity and commercial linkage"]
      - [1789 Capital, "Reported Series B investor", "Economic stake undisclosed", "Confirm allocation and governance rights"]
      - [Paradigm, "Prior investor reported by Tracxn", "Prior financing exposure; ownership undisclosed", "Confirm current stake and rights after Series B"]
    notes: "Sample of named stakeholders in the assigned evidence; investor participation does not imply a board seat, ownership percentage, or control."
