callouts:
  - calloutType: "recommendation"
    title: "Investment Verdict: Research-More / Hold at $1.5B Price Level"
    body: "Nous Research represents a compelling technical bet on open-source intelligence and decentralized compute architecture. However, at a $1.5 billion valuation commanding 41.7x reported annualized run-rate, the equity is aggressively overvalued on traditional financial metrics. Investors should withhold capital allocation until management provides audited GAAP income statements, verifies positive hosting gross margins, and demonstrates paying enterprise customer contract retention under Hermes for Businesses."
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV009"
      - "CV016"
  - calloutType: "risk"
    title: "Downside Exposure to Multiple Compression and Down-Round Risk"
    body: "Because the Series B syndicate priced Nous Research on future optionality rather than cashflow support, any growth deceleration or gross margin compression will trigger sharp multiple contraction. If the company fails to reach its $100 million exit run-rate target and settles into standard infrastructure multiples of 12x to 18x ARR, equity value would compress by 30% to 50%, posing severe down-round risk for late-stage entrants lacking senior liquidation preferences."
    claimRefs:
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV013"
