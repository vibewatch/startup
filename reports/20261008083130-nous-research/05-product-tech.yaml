callouts:
  - calloutType: "insight"
    title: "Architectural Divergence: Bounded Agentic Harness vs Model Scaling"
    body: "Nous Research has deliberately decoupled the agentic harness from underlying foundation model ownership. By ensuring Hermes Agent remains completely model-agnostic and deploying MIT-licensed open infrastructure, Nous captures developer distribution while insulating its product utility from shifting foundation model leadership."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE008"
  - calloutType: "risk"
    title: "Enterprise Deployment Vulnerabilities in Open Agent Gateways"
    body: "Operating an autonomous agent with persistent terminal execution privileges across uncontrolled messaging channels introduces severe security exposure. Without deterministic enterprise-level deny-lists and formal confidence-scoring audit gates, organizations face heightened risks of prompt injection, unauthorized privilege escalation, and unintended state mutation."
    claimRefs:
      - "CE003"
      - "CE010"
      - "CE015"
      - "CE016"
