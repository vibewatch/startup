company:
  name: "Nous Research"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Hermes shows substantial company-attributed developer and user reach, with contemporary
    reports citing more than 22.7 million downloads and several thousand contributors, while
    paid consumer and organizational editions create a plausible monetization path. Public
    evidence does not identify named production customers, retention, paid conversion, contract
    duration, outcomes, or customer concentration, so enterprise durability remains unproven.
sections:
  - id: "customer-base"
    title: "Customer base: broad reach, weak segment disclosure"
    body: >-
      The observable customer surface begins with individual users, developers, operators, and
      researchers rather than a disclosed roster of enterprises. An independent product review
      describes recurring-task developers, operators seeking scheduled workflows, agent-training
      researchers, and technically advanced self-hosters as the best-fit users. Nous's official
      product page broadens that usage surface across CLI, Telegram, Discord, Slack, WhatsApp,
      Signal, and email, with one persistent memory. Paid consumer plans and separate Business and
      Enterprise editions indicate different buyer and payer paths, but public materials do not
      quantify any segment's active users, paid seats, geography, vertical mix, or revenue share.
      The segmentation below is therefore use-case based, not a measured customer census.
    claimRefs: [CU001, CU002, CU009, CU010]
    tableRefs: [TU001]
  - id: "adoption-trajectory"
    title: "Adoption trajectory: large headline metrics with definition risk"
    body: >-
      Multiple 2026 sources point to substantial Hermes distribution, but their metrics are
      company-attributed and not fully comparable. SiliconANGLE reported more than 24 million
      downloads and several thousand open-source contributors, while TechStartups reported more
      than 22.7 million downloads since February. A July analysis separately cited 214,000 GitHub
      stars and 40,000 forks, and UA.News reproduced a company estimate that Hermes represented
      approximately 2.5% of global AI token consumption. These measures capture downloads, clones,
      repository engagement, contributors, and token usage rather than one consistent active-user
      cohort. None supplies a denominator for unique users, repeat use, paid conversion, or
      production deployment, so the evidence establishes reach but not retention or durable demand.
    claimRefs: [CU003, CU004, CU005, CU006, CU016]
    tableRefs: [TU002]
  - id: "monetization-and-expansion"
    title: "Monetization and expansion: an open-source-to-enterprise hypothesis"
    body: >-
      Nous has constructed a visible path from free or self-hosted use into paid services. The
      official Hermes surface listed a free plan and three paid consumer tiers, while independent
      reporting described Cloud, Business, and Enterprise editions with hosted deployment, team
      token controls, and shared customizations. SiliconANGLE, citing the Wall Street Journal,
      reported $36 million of annualized revenue in mid-September and a management forecast above
      $100 million by year-end; these are not full-year revenue, ARR, or proof of renewal. A company
      careers page also showed dedicated support and security hiring for enterprise deployments.
      The journey can be articulated, but no public cohort connects downloads to paid accounts,
      organizations, expansion, or renewals.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013]
    figureRefs: [FU001]
  - id: "durability-and-proof"
    title: "Durability and concentration: material evidence remains private"
    body: >-
      The allocated evidence contains no named organization using Hermes in production, no pilot
      outcome, and no public reference customer. It also provides no NRR, GRR, churn, renewal,
      contract length, satisfaction, cohort, ACV, top-customer, geography, vertical, or channel
      concentration data. That absence prevents a distinction between experimentation and durable
      deployment. The strongest adverse signals are execution risks rather than reported customer
      failures: one analyst notes the technical expertise required to deploy and maintain
      open-source AI, while another says Nous's open and decentralized thesis remains unproven at
      scale against incumbents with production data and established trust. Diligence should
      therefore prioritize customer-level evidence before treating headline adoption or annualized
      revenue as proof of retention.
    claimRefs: [CU014, CU015]
    tableRefs: [TU003]
