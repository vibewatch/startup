      - ["Hermes Business and Enterprise organizations (unnamed)", "Teams and enterprises", "Hosted agents, token controls, and shared customizations", "Not disclosed", null, "Commercial editions exist, but no allocated source names a customer, deployment, or outcome"]
    notes: "Sample covers every customer-like proof surface in the allocated evidence; no named customer was disclosed, outcomes are null, and the rows must not be read as customer references."
