    title: "Hermes customer journey and proposed expansion loop"
    type: "journey-map"
    summary: "Public evidence supports each product surface, but no disclosed cohort quantifies movement between stages."
    data:
      items:
        - label: "Discover"
          detail: "Open-source distribution and repository visibility introduce Hermes to developers and advanced users."
          touchpoints: ["Open-source project", "Developer community"]
        - label: "Try"
          detail: "A free plan and self-hosting reduce initial adoption friction."
          touchpoints: ["Free tier", "Self-hosting"]
        - label: "Embed"
          detail: "Persistent memory and recurring workflows can move the agent into day-to-day use."
          touchpoints: ["Persistent memory", "Reusable skills"]
        - label: "Extend"
          detail: "Messaging channels, scheduling, browsing, delegation, and sandboxing broaden usage."
          touchpoints: ["Messaging gateway", "Scheduled automation", "Subagents"]
        - label: "Govern"
          detail: "Teams may require hosted operation, token controls, shared customizations, support, and security."
          touchpoints: ["Hermes Cloud", "Business controls", "Enterprise support"]
        - label: "Expand"
          detail: "The proposed commercial loop is broader organizational deployment, but conversion and renewal rates are undisclosed."
          touchpoints: ["Business edition", "Enterprise edition", "Renewal evidence gap"]
    approximationNotes: "This is an analytical journey, not a measured funnel; no conversion rates, cohort sizes, or stage populations are available."
    claimRefs: [CU002, CU009, CU010, CU011, CU012, CU013]
