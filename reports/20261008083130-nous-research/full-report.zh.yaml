      - number: '6.4'
        title: 持久性与集中度：关键证据仍属私有
        blocks:
          - type: paragraph
            body: >-
              已配置的证据中没有任何具名组织在生产环境使用 Hermes，没有试点结果，也没有公开参考客户。证据还没有
              NRR、GRR、流失、续约、合同期限、满意度、cohort、ACV、头部客户、地域、垂直行业或渠道集中度数据。该缺口无法区分试验使用与持久部署。最强的负面信号是执行风险，而不是已报告的客户失败：一位分析师指出，部署和维护开源
              AI 需要较强技术能力；另一位则称 Nous 的开放和去中心化论点，在面对拥有生产数据和既有信任的 incumbents
              时仍未在规模上得到验证。因此，在把头部采用指标或年化收入当作留存证明前，尽调应优先获取客户层面的证据。
            claimRefs:
              - CU014
              - CU015
