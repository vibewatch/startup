  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 分析类别
      - 投资论点
      - 反论点
      - 会改变判断的证据
    rows:
      - - 分发与生态
        - 超过 214,000 个 GitHub 星标和 24 million 次克隆构成无可匹敌的漏斗顶端开发者采用护城河。
        - 开源克隆带来的商业化很低；免费开发者很少转化为高付费企业层级。
        - 经审计的客户群数据显示，开源用户向付费 Nous Portal 或企业账户的转化率超过 15%。
      - - 架构策略
        - 开放权重和去中心化 Psyche 训练让实验室免受超大规模云厂商资本开支上涨与算力供应商锁定的影响。
        - 去中心化训练在前沿规模上尚未验证；开放权重推理会多生成 1.5x–4x token，推高推理成本。
        - 通过 Psyche 完全预训练出具备前沿竞争力的模型，并以实证方式证明算力成本相当。
      - - 商业化
        - 分层门户订阅（$20–$200/月）与 Hermes for Businesses 组成消费者和企业双引擎模式。
        - Portal 积分面临开发者高流失；企业软件销售又受到严苛 SOC2 合规和责任摩擦的阻碍。
        - 披露多项 Hermes for Businesses 企业生产环境部署：客户来自 Fortune 500，且已签署多年 ACV。
      - - 资本与财团实力
        - Robot Ventures、Nvidia 和 Samsung 支持的累计 $158M 融资带来多年流动性和战略硬件协同。
        - 财团缺少传统企业 SaaS 增长领投方；治理不透明，也未披露独立董事会监督。
        - 建立正式董事会，引入具备成熟企业软件治理经验的代表。
    notes: 各项论点综合了财经媒体和技术文档中的战略立场。判断转变标准定义了可监测的尽调否决条件。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV009
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与商业假设
      - 目标收入与隐含估值
      - 回报倍数 / 损失
      - 主要风险与下行触发点
      - 概率信号
    rows:
      - - 乐观情景
        - Hermes for Businesses 快速扩大规模；年末 ARR 超过 $100M；毛利率稳定在 65% 以上；Psyche 证明分布式训练可行。
        - ARR：$120M-$150M；估值：$3.0B-$4.0B（25x-30x 倍数）
        - 2.0x - 2.7x MOIC 回报倍数
        - 企业直销执行失败；超大规模云厂商在托管推理上打价格战。
        - 25%（需要毫无瑕疵的企业销售扩张，执行门槛很高）
      - - 基准情景
        - 自助 Portal 仍是主要驱动力；企业转化缓慢且依赖咨询；年化运行率达到 $55M–$65M。
        - ARR：$55M-$65M；估值：$900M-$1.2B（15x-20x 倍数）
        - '-40% 至 -20% 损失（倍数压缩）'
        - 开发者在积分层级流失；GPU 托管成本上升，压缩毛利率。
        - 50%（反映开发者驱动的开源软件增长基线现实）
      - - 悲观情景
        - 企业试点未通过合规审计；开源开发者热情减退；token 生成效率低下侵蚀经济性。
        - ARR：$25M-$35M；估值：$200M-$350M（5x-10x 倍数）
        - '-85% 至 -75% 损失（下轮融资重组）'
        - 上游基础模型许可限制；代理执行引发重大安全漏洞。
        - 25%（若超大规模云厂商捆绑更强的桌面代理，将出现实质性脆弱点）
    notes: 情景回报假设按当前 $1.5 billion 投后估值入场。倍数区间参照公开和私有开发者基础设施同行校准。
    claimRefs:
      - CV005
      - CV010
      - CV011
      - CV012
      - CV013
