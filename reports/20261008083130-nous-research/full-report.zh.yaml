  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与架构分类
        blocks:
          - type: paragraph
            body: >-
              Nous Research 所处的是一个二分市场，挑战了“前沿封闭实验室”与“普通开放权重基础模型”的传统二元分类。它没有试图匹配 OpenAI、Anthropic 或 Google DeepMind
              等封闭前沿供应商的巨额资本开支，也没有像 Meta 的基础 Llama 发布那样做宽泛基础设施层，而是占据一个专注于指令跟随微调和可自托管自主 agent 框架的专业创始人层细分位置。Nous Research
              的竞争格局分为五类：封闭式前沿 agent 套件、开放权重模型微调商、开源 agent runtime 框架、去中心化计算与训练协议，以及托管式多模型推理路由器。


              在封闭式前沿细分中，OpenAI（ChatGPT Work、Operator）、Anthropic（Claude Cowork、Claude Code）和 Microsoft（Copilot
              Cowork）将基础模型直接打包进托管桌面和云端 agent runtime。这些封闭供应商提供开箱即用的便利性和高性能专有推理轨迹，但施加严格的 API 速率限制、封闭数据管线和第三方供应商锁定。相反，Meta
              等开放权重基础模型供应商提供原始基础模型权重（Llama 系列），推动社区创新，却没有开箱即用的专业 agent harness、工具调用优化和自我改进循环。EleutherAI 和
              AllenAI（Olmo）等开源研究同行强调透明科学研究和完全开放的预训练方法；Mistral AI 等商业企业则为通用企业微调提供有竞争力的开放权重。


              在 agent 框架层，Hermes Agent 与 Anthropic 的 Claude Code 等交互式开发者 coding agents，以及 OpenClaw 等声明式配置框架竞争。Claude
              Code 通过人工维护的 CLAUDE.md 指南，优先支持实时终端交互；OpenClaw 则强调用于企业合规的声明式 SOUL.md 配置；Hermes Agent 以自主 24/7
              后台运行、自动化五阶段学习循环，以及覆盖 Telegram、Discord 和 Slack 的跨平台网关集成形成差异。最后，在去中心化基础设施领域，Nous Research 的 Psyche 平台和
              DisTrO 优化算法直接处理分布式计算协调，与 Bittensor 等区块链协调 AI 网络竞争，并试图降低异构硬件集群之间的节点间带宽需求。
