          - type: paragraph
            body: >-
              Nous 已经搭出从免费或自托管使用进入付费服务的可见路径。官方 Hermes 页面列出免费计划和三个付费消费者档位；独立报道则描述 Cloud、Business 和 Enterprise
              版本，具备托管部署、团队 token 控制和共享定制能力。SiliconANGLE 援引 The Wall Street Journal 报道，9 月中旬年化收入为 $36 million，管理层预测年底超过
              $100 million；这些不是全年收入、ARR 或续约证明。公司招聘页面还显示出面向企业部署的专门支持和安全岗位。路径可以讲清楚，但没有公开 cohort 将下载连接到付费账户、组织、扩张或续约。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
