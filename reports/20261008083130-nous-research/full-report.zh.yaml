  - id: TV001
    title: 建议汇总表
    columns:
      - 评估维度
      - 分析立场
      - 底层证据基础
      - 对投资委员会的决策含义
    rows:
      - - 投资建议
        - 继续研究（谨慎路径）
        - 商业化牵引尚处早期；$36M 运行率依赖未经核实的管理层数据，而非经审计的 GAAP 财务数据。
        - 在拿到经审计的企业客户群留存和利润率之前，按当前 $1.5B 估值暂缓新增资本配置。
      - - 建议置信度
        - 中
        - WSJ 和 TechCrunch 均确认资本化情况与 headline 估值，但内部损益表和烧钱情况仍未公开。
        - 需要直接访问虚拟数据室，以确认现金跑道、算力负债和企业管线质量。
      - - 风险评级
        - 反向 / 高投机风险
        - 期权价值定价过重（41.7x ARR）、治理不透明、缺少董事会名单，且去中心化训练经济性尚未验证。
        - 在考虑二级或后续股权投资前，要求严苛的下行清算优先权和保护性契约。
      - - 估值立场
        - 相对基本面高估
        - 按年化运行率计价为 41.7x；软件基础设施可比公司的收入倍数为 8x–15x，意味着显著的倍数风险。
        - 寻求 40%–50% 的入场估值折扣，或结构化下行保护，以隔离倍数压缩风险。
      - - 首要决策触发点
        - 经审计的企业 ARR 转化
        - Hermes for Businesses 能否签下经常性企业合同，而不是停留在短暂的消费者开发者积分。
        - 将任何后续资本承诺绑定到经核实的里程碑：经审计 GAAP ARR 超过 $50M 且毛利率为正。
    notes: 建议与风险评级反映截至 2026 年 10 月经核实的财务披露和风险投资报道。年化收入指标是媒体报道的管理层运行率，而非经审计的财务报表。
