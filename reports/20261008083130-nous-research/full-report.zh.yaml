        title: 展示项
        blocks:
          - type: callout
            title: 开放权重变现分化
            body: >
              Nous Research 展现出原始开发者触达与商业软件捕获之间的极端分化。Hermes agent 家族拥有超过 214,000 个 GitHub stars，约占估计全球 AI token 消耗的
              2.5%，但开放权重易于自托管，限制了直接软件变现。要获得可持续的 venture 回报，公司必须在重视隐私的企业环境中扩大 Hermes for Businesses，同时证明 Psyche Network
              的技术可行性。
            calloutType: insight
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM010
          - type: callout
            title: 去中心化训练可行性与资本差距
            body: >
              Psyche Network 试图用互联网分布式 GPU 训练替代数十亿美元级 hyperscale 集群，在前沿规模上仍是一项未经验证的技术押注。要与拥有巨额年度 capex 的集中式实验室竞争，必须把
              DisTrO optimizer 执行到位，并维持可靠的 token 经济激励；这使 Nous 暴露于实质性的架构和竞争压力。
            calloutType: risk
            claimRefs:
