      - number: '2.3'
        title: 买方画像、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >
              Nous Research 产品组合的采用路径，在买方画像、预算来源和采购流程上差异很大。最大规模的用户群是个人开源开发者、AI 研究人员和爱好者，他们从 Hugging Face 下载开放权重，或 clone
              GitHub 仓库。这些用户在本地或虚拟私有服务器上运行 Hermes，不承担软件许可费，并通过 Telegram、Discord 和 Slack 等消息网关使用自托管工具。


              转化为付费客户分两条商业路径。Prosumer 和精品开发团队转向 Nous Portal 托管版（Plus $20/month、Super $100/month、Ultra
              $200/month），以免维护基础设施，同时获得托管工具执行、跨 200+ 模型的多模型路由和捆绑额度。在企业组织端，工程负责人和企业 IT 部门评估 Hermes for
              Businesses。该企业档位的预算归属 VP of Engineering 和 Chief Information Officer，触发因素包括企业数据隐私要求、主权合规要求，以及对专有供应商锁定的不满。
