      - number: '3.2'
        title: 能力矩阵与 harness 工程护城河
        blocks:
          - type: paragraph
            body: >-
              2026 年 agent 生态的差异化，已经从原始基础模型参数规模，明确转向 harness 工程——围绕核心推理模型搭建的指令脚手架、持久记忆架构、反馈循环和沙盒执行环境。基准实验显示，仅优化 harness
              架构，就能显著提升 agent 任务成功率，而无需改动底层模型权重。Nous Research 已将这一 harness 层直接产品化为 Hermes Agent v0.9.0，把通常需要数月的工程工作变成带
              MIT license 的开箱即用部署。


              Hermes Agent 的核心技术护城河是三层记忆架构：将情景会话记忆（存储在本地 SQLite，并使用 FTS5
              全文索引）、语义持久状态（记录用户偏好和工具链）与程序性技能记忆（~/.hermes/skills/ 下的版本控制 markdown 文件）分开。这一结构支持按需检索，而不是暴力塞入上下文，让 agents
              能在数月连续对话中运行而不出现上下文退化。此外，Hermes 还加入自主闭环反思周期：任务完成后，系统整理记忆、自动生成或改进可复用的技能文件，并通过 Honcho 建模用户特征。这与依赖人工编写指令文件的
              Claude Code 和商业替代方案不同。


              但能力比较也揭示了关键取舍。Hermes 的部署灵活性很强——可在 $5 VPS、本地 Docker 或托管 Nous Portal
              档位中运行——但其可自我修改的程序性技能带来治理和验证摩擦。对于需要严格审计轨迹和确定性 SOC2 合规的高度监管企业，自我改进 agents 的可审计性风险高于 OpenClaw
              等静态声明式框架。此外，第三方供应商政策也造成运营瓶颈：2026 年 4 月，Anthropic 限制第三方工具通过消费者订阅档位访问 Claude，迫使开放 agent 框架依赖按量计费 API keys
              或替代推理供应商。
