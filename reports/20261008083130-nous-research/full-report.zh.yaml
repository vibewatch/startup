        title: 程序性记忆、学习循环与客户端交付面
        blocks:
          - type: paragraph
            body: >-
              Hermes Agent 的核心认知差异化，在于由程序性记忆驱动的结构化学习循环，而不是运行时更新模型权重。任务执行期间，agent
              将成功的多步问题解决过程——例如调试容器化微服务或配置基础设施管线——整理为称为 Skill Documents 的永久 markdown 文件，并遵循开放的 agentskills.io
              标准。在后续会话中，agent 查询这一程序性库，调用此前验证过的执行序列，绕过标准 retrieval-augmented generation
              管线常见的上下文窗口限制和不连贯问题。为了把分发扩展到终端开发者以外，Nous 推出 Hermes Desktop：这是一个基于 Electron 的 macOS 和 Windows 桌面应用，可原生连接核心
              CLI runtime、会话存储和技能数据库。Nous Portal 负责客户端变现和托管计算访问，提供订阅档位，将网页搜索、云端浏览器自动化、计算机视觉和语音生成的托管工具执行，与月度 API 额度打包。
