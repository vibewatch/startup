      - number: '5.3'
        title: 底层模型、训练基础设施与运营安全
        blocks:
          - type: paragraph
            body: >-
              agent harness 的底层是 Nous Research 的专有模型后训练管线和去中心化计算基础设施。Hermes 模型家族从 Llama 3.1 等基础开放权重架构微调而来，结合 Atropos
              强化学习环境和 DataForge 合成数据引擎；合成生成占训练语料的九成以上，以最大化工具调用精度和多步推理稳定性。为解决大规模预训练的计算约束，Nous 开发 Distributed Training
              Over-the-Internet（DisTrO）optimizer，通过数量级降低节点间网络带宽需求，使消费者 GPU 网络和去中心化 GPU 网络能够协同训练。该架构为 Solana 区块链上的 Psyche
              Network 提供动力，通过链上激励机制协调分布式模型训练。从安全与信任角度看，经由消息网关执行任意代码会带来显著攻击面风险；Hermes 实施容器 namespace 隔离、移除 Linux
              capabilities、针对记忆输入的 prompt-injection 扫描，以及针对不可逆 shell 命令和记忆修改的人在回路审批队列。
            claimRefs:
