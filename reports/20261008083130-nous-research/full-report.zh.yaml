        title: 展示项
        blocks:
          - type: callout
            title: 开放权重 agent 经济学中的 token 效率悖论
            body: >-
              Hermes 等开放权重模型节省大量软件许可成本并提供完整数据主权，但 Nous Research 的实证基准测试揭示了一项隐性经济税：开放权重推理模型解决相同任务时，比封闭权重模型多产生 1.5x 至 4x
              token。在推理循环持续迭代的多步 agent 管线中，额外 token 量很容易抵消原始托管成本优势，带来延迟瓶颈和上下文耗尽，除非采用优化后的蒸馏架构。
