      - number: '3.3'
        title: 定价经济、切换成本与持久性
        blocks:
          - type: paragraph
            body: >-
              竞争格局中的定价和包装，反映出根本冲突的商业模式。封闭式前沿套件通过用户 seat license（通常每席每月 $20 至 $250+）或按 token 消费收费，后者会随 agent
              推理链扩展而不可预测地增长。相比之下，Nous Research 提供混合变现架构。开源 Hermes 核心以 MIT license 自由分发，可在普通 VPS 上自托管，约每月
              $5，完全消除软件许可成本。需要托管基础设施的商业用户，可使用 Nous Portal 的 Free（$0）、Plus（$20/month）、Super（$100/month）和
              Ultra（$200/month）档位，包含月度使用额度、超过 200 个基础模型的访问权和托管工具执行。新发布的 Hermes for Businesses 将其扩展到企业私有部署。


              尽管定价有优势，开放权重 agent 部署仍面临严重的经济和效率逆风。Nous Research 针对 Large Reasoning
              Models（LRMs）进行的基准测试揭示了一项重大隐性成本：在可比问题求解任务中，开放权重推理模型系统性地产生 1.5x 至 4x 更多 token；对于简单知识查询，最多多出 10x。OpenAI 和
              Grok 等封闭供应商高度优化 token 效率并压缩中间推理链，因此即使名义上的单 token 价格更高，每次查询的净成本也经常低于自托管开放权重管线。低效 token 使用还会增加延迟并消耗有限上下文窗口。


              分发能力和上游供应商关系进一步挑战护城河持久性。封闭式 incumbents 通过既有工作区套件（Microsoft 365、Google
              Workspace、Slack）掌握牢固的企业分发，造成很高的组织切换成本。此外，Nous Research 依赖基础开源权重发布，主要是 Meta 的 Llama 家族，作为 Hermes
              后训练的基础权重。如果 Meta 修改 Llama license agreement，限制 venture-funded 独角兽竞争者向下游进行商业捕获，或封闭实验室成功把黏性强、符合隐私要求的 agent
              runtime 原生打包进企业协议，Nous Research 的差异化就可能被夹在商品化基础计算与一体化企业软件之间。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
