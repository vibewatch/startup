        title: 产品定义与 agent 运行架构
        blocks:
          - type: paragraph
            body: >-
              Nous Research 以 Hermes Agent 定义其核心产品：这是一个开源、采用 MIT license 的自主 agent harness，目标是解决多步 AI
              工程工作流中的记忆衰减和环境隔离。Hermes Agent 不是短暂的聊天助手，也不是绑定 IDE 的代码补全工具，而是一个持续运行的后台
              daemon，跨连续会话工作，并直接连接终端用户的消息应用。用户通过支持超过 20 种通信协议的多平台网关与 agent 交互——包括 Telegram、Discord、Slack、WhatsApp、Signal
              和 Matrix——开发者可以从移动设备派发命令、接收任务完成提醒和发送语音备忘，同时执行在远程基础设施上进行。agent 运行于五类执行环境：本地机器、加固的 Docker 容器、远程 SSH 实例、高性能计算
              Singularity 容器和无服务器 Modal compute，使系统拥有专用终端访问能力，可在无需持续人工干预的情况下处理长时间运行的数据管线并检查代码库。
