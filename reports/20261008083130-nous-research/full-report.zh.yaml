  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与替代方案
        blocks:
          - type: paragraph
            body: >
              要界定 Nous Research 的可触达市场，必须拆分三个相互关联的支出类别：开源基础模型与后训练权重、开发者 agent 编排环境，以及去中心化计算协调。纳入的支出包括托管模型接口和 agents
              的开发者订阅、API token 路由、Hermes for Businesses 的企业私有 agent 部署许可，以及代币化分布式计算奖励。排除项包括封闭式 hyperscaler 基础模型 API
              订阅（例如专有的企业 OpenAI 或 Anthropic 合同）、专用主权 hyperscale 数据中心基础设施 capex，以及非 agentic 的业务流程自动化软件。


              现状替代方案构成商业化捕获的关键上限。在自主本地 agent 领域，OpenClaw 凭借桌面任务执行率先占据市场心智，成为 Hermes 直接竞争的主要开源基准。在云基础设施侧，集中式模型路由和 API
              推理平台（如 OpenRouter 或 hyperscaler 托管 endpoint）不要求用户承诺于全栈自托管框架，却能吸收大量开发者 token 用量。此外，传统软件工程团队往往依赖僵化的脚本自动化或专有
              IDE 扩展，而不是投资于带持久状态的自主多步推理 agents。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
