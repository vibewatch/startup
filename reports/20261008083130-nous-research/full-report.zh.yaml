      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与受约束的开发者采用
        blocks:
          - type: paragraph
            body: >
              由于开放权重采用与商业软件收入存在根本性的结构分歧，前沿开源 AI 实验室的市场规模不能用一个宏观数字概括。行业对全球企业 AI 软件和基础设施的宽泛估计显示，到 2030
              年可触达机会达数千亿美元，但开源生态的变现受到免费分发的强烈约束。Hermes 的主要开发者牵引力体现在超过 214,000 个 GitHub stars、40,000 个 forks 和超过 24
              million 次 clones，说明其拥有可观的全球开发者心智份额，约占估计全球 AI token 消耗的 2.5%。


              但商业化捕获分成不同的可服务层级。开发者和 prosumer 可触达市场通过每月 $20 至 $200 的托管 Portal 订阅变现，截至 2026 年 9 月中旬，估计收入运行率约为 $36
              million。Hermes for Businesses 面向的企业层，是合同价值更高的可服务市场，企业买家希望获得定制化多步 agents，同时让私有数据留在企业边界内。与此同时，长期基础设施前沿由
              Psyche Network 推进：这是运行在 Solana 上、利用 DisTrO optimizer 汇聚全球闲置 GPU 算力的去中心化训练协调协议，目标是替代集中式数十亿美元级预训练集群。
