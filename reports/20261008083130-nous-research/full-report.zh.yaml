      - number: '2.4'
        title: 增长驱动、结构性瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >
              Nous Research 的需求由三股主要顺风推动：开发者越来越抵触企业模型审查和安全拒答；对透明推理轨迹的需求上升；集中式计算成本增加。Nous 通过 DataForge 和 Atropos
              rejection sampling 使用合成数据训练 Hermes 模型，在 RefusalBench 上实现 60% 的非拒答率，而 GPT-4o 和 Claude Sonnet 4 等领先商业模型低于
              18%。此外，允许用户检查逐步思考轨迹的混合推理架构，满足了技术开发者对可操控性的要求。


              但采用仍面临严峻的运营、经济和技术约束。开放权重分发天然压低直接变现，因为用户可以免费运行模型而不向 Nous Research 付费。在本地运行前沿推理模型需要大量计算硬件（例如高显存
              GPUs），把完整能力的采用限制在资源充足的从业者中。基础设施方面，Psyche Network
              的去中心化训练依赖于异构互联网连接上的、未经证明的分布式训练，面临严重的带宽、同步和验证挑战。最后，资本集中仍是战略壁垒：封闭式 hyperscalers 每年掌握数百亿美元 capex，远超独立实验室预算。
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM015
              - CM016
