  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              风险排序是定性的，不是经过测量的事件频率模型。最重大的暴露包括：公开合同对客户数据授予的广泛权利；关于 AI
              输出准确性和不侵权的免责声明；以及能否在有意义的规模上安全运行去中心化训练这一未解决问题。供应商依赖和执行能力紧随其后，因为 Hermes
              可以使用许多外部模型服务，而公司同时在招聘安全、支持和财务职能。这些风险不代表已经发生数据泄露、监管执法行动或宕机，而是指出损失严重程度可能很高、且现有公开证据无法证明控制措施成熟的地方。因此，投资应继续以私人合同审阅、独立安全保障、生产可靠性数据，以及已调和的融资和现金证据为条件。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: 监管、法律与数据治理暴露
        blocks:
          - type: paragraph
            body: >-
              Nous Research 的公开条款指明了特拉华州公司、加州法律和个人 JAMS 仲裁，但不能替代逐司法辖区的监管评估。条款授予公司广泛使用客户数据进行服务开发和模型工作的权利，Privacy Mode
              被描述为例外；同时条款还声明 AI
              输出不保证独特、准确、完整、不侵权或适合特定用途。总责任上限按引发索赔的服务六个月费用计算。独立尽调指南另发现，关于正式伦理框架和第三方认证的公开细节有限。剩余问题不是不合规的证明，而是企业买方在受监管部署前，需要看到默认数据设置、子处理方、保留期限、审计权、认证、赔偿和协商后的合同偏离等方面的证据。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR016
      - number: '7.3'
        title: 运营、质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              公开材料同时显示出缓解意图和较高的运营复杂度。条款承诺以商业上合理的努力维持持续可用性，但排除了计划内停机及公司无法控制的事件。Hermes
              文档称对话、记忆和技能保留在本地，工具拒绝和审批都是显式的；产品页面还宣传五种带容器加固和 namespace
              隔离的执行后端。这些控制降低了一部分部署风险，但独立评论仍称，在受控演示之外的去中心化训练尚未得到验证，并警告分布式计算扩大了数据完整性、模型投毒和节点信誉攻击的暴露面。现有证据没有量化宕机率、恢复目标、安全测试覆盖度或分布式训练失败率，因此剩余可能性评级仍是分析师判断，需要
              telemetry 和第三方验证。
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.4'
        title: 合作伙伴、财务模型与执行依赖
        blocks:
          - type: paragraph
            body: >-
              Hermes 可以路由到多个商业供应商或本地 OpenAI-compatible endpoint，降低单一供应商锁定，但不能消除依赖风险：公开条款称 Nous Research
              不控制第三方服务，也可能停止依赖这些服务的功能。财务披露同样变化很快，且来自二手资料。一篇 10 月文章报道了 $90 million Series B、$1.5 billion 估值、$158 million
              累计融资和 2026 年 9 月中旬约 $36 million 的年化收入，并称公司预计年底超过 $100 million。7 月文章则称至少 $75 million
              仍在谈判。已融资额不等于可用现金，年化收入也不等于 ARR 或经审计收入。招聘页面的 13 个空缺职位，包括安全、支持和 Controller 岗位，说明能力正在建设，但产能、留存、烧钱速度和 runway
              仍未验证。
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 论点破坏触发器
            body: 如果确认性尽调无法证明可执行的企业数据控制和输出风险分配，无法独立复现去中心化训练可靠性，或无法调和现金、烧钱速度和 2026 年增长计划，就应暂停投资。这些失败会让核心商业化和基础设施论点依赖未经支持的假设。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
          - type: callout
            title: 缓解措施可见，但尚不足以构成保障
            body: 本地存储、本地模型支持、显式工具控制和加固执行后端，都是相关的缓解措施。应把这些控制措施拿来测试，而不是视为企业安全、可靠性或监管合规的证明。
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、架构反论点与战略取舍
        blocks:
          - type: paragraph
            body: >-
              Nous Research 的核心投资逻辑是：开放权重架构、社区驱动分发和去中心化训练，或可绕开封闭式前沿 AI 实验室所需的数十亿美元级资本开支。Nous 一边开发开源 Hermes Agent
              harness，一边推进 Psyche 等去中心化训练协议，目标是把开发者采用摩擦降至零，并通过托管云基础设施、分层开发者门户订阅和企业部署实现高毛利变现。支持者认为，超过 214,000 个 GitHub
              stars、40,000 次 forks 和 24 million 次 clones
              构成了有自我强化效应的开发者生态，超大规模云厂商难以轻易撼动。但反方逻辑指出了严重的结构性和商业脆弱点：开放核心模型知识产权会消除专有软件锁定；与封闭式前沿 API 相比，开放权重推理模型存在已有记录的
              token 生成效率问题；商业收入仍集中在开发者自主购买的 credit 套餐，而非长期企业合同承诺。在 Hermes for Businesses
              的企业采用证明具备持续性之前，公司仍会面临基础模型提供商带来的商品化压力，以及专有 agent 套件和免费开源框架的激烈竞争。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV016
      - number: '8.2'
        title: 融资背景、入场纪律与估值现实
        blocks:
          - type: paragraph
            body: >-
              Nous Research 的资本化进程在 2026 年显著提速，最终完成扩大后的 $90 million Series B 股权轮，投后估值 $1.5 billion，累计融资达到 $158
              million。2026 年 7 月较早的融资跟踪记录显示，Robot Ventures 和 Union Square Ventures 牵头讨论至少 $75 million 的联合投资；此前公司在种子轮融资及
              Paradigm 领投的 2025 年 4 月 Series A 中估计筹得 $70 million。2026 年 10 月最终联合投资人还加入了 Nvidia、Samsung、Menlo Ventures 和
              1789 Capital 等企业战略及风险投资方。以公司披露的 2026 年 9 月中旬约 $36 million 年化 run-rate 衡量，$1.5 billion 的 headline valuation
              对应约 41.7x 的企业价值 / 收入倍数。财务分析师强调，按自助式门户套餐（每月 $20 至
              $200）给早期实验室定出独角兽级价格，本质上是在为未来架构主导地位买期权，而不是基于可支撑现金流的倍数。公开证据不足以用传统 SaaS
              基本面支撑这一价格；新投资人正在为尚未证实的企业转化和未经测试的去中心化算力扩展支付高额溢价。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV015
              - CV016
      - number: '8.3'
        title: 情景分析：牛市、基准与熊市回报路径
        blocks:
          - type: paragraph
            body: >-
              评估 Nous Research 的投资画像，需要把企业合同落地、托管毛利率和开源变现效率等不同假设分别建模。乐观情景下，Nous Research 成功扩大 Hermes for
              Businesses，转化寻求数据主权的大型企业客户，实现年化 run-rate 超过 $100 million 的前瞻预测，并证明 Psyche 是可行的去中心化训练替代方案，估值扩张至 $3.0
              billion 至 $4.0 billion（2.0x 至 2.7x MOIC）。基准情景下，开发者门户订阅流失率居高不下，合规与安全审计摩擦拉长企业销售周期，商业增长放缓；年化收入达到 $55 million
              至 $65 million，估值倍数压缩至 15x 至 20x ARR，对应股权价值 $900 million 至 $1.2 billion（下行 -40% 至
              -20%）。悲观情景下，封闭式超大规模云厂商推出更优、效率更高的企业桌面 agent，侵蚀 Hermes 的开发者心智；算力托管费用同时挤压毛利率，最终以 5x 至 8x ARR 倍数触发下轮重组（股权估值
              $200 million 至 $350 million，意味着资本损失 75% 至 85%）。下行触发因素包括开放权重基础模型的许可限制、企业数据泄露责任，以及在 Series B
              资金耗尽前无法实现现金流盈亏平衡。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 可比公司格局、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              公私募市场可比公司显示出两类公司的分化：资本密集型封闭式前沿模型提供商，以及面向开发者的开源工具公司。OpenAI、Anthropic 等封闭式前沿领导者的 ARR 收入倍数达到 30x 至
              50x，但背后是数十亿美元级算力承诺、企业分发合作和专有模型锁定。相比之下，公开市场上的开源基础设施和开发者工具同业按更保守的 8x 至 15x
              前瞻收入倍数交易，反映出把开源软件下载转化为持久经常性软件收入的结构性摩擦。Forge Global 等平台上的 Nous Research
              股票二级市场交易仍极为有限，尚无确定的二级交易价格，体现出显著的流动性不足和转让限制。由于缺乏经审计的 GAAP
              财务报表、公司治理披露和独立董事会，通过传统首次公开募股（IPO）退出仍需多年。关键尽调否决标准和论点破坏触发因素包括：无法证明托管门户推理业务拥有正毛利；没有经核实、ACV 超过 $250k
              的企业合同；核心技术创始人离职；或监管机构针对未经过筛选的开放权重 agent 执行采取执法行动。
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资结论：继续研究 / 在 $1.5B 价位持有
            body: >-
              Nous Research 是一项押注开源智能和去中心化算力架构的有吸引力的技术投资。但在 $1.5 billion 估值、对应披露年化 run-rate 的 41.7x
              倍数下，按传统财务指标看，股权明显被高估。管理层提供经审计的 GAAP 损益表、核实托管业务正毛利，并证明 Hermes for Businesses 的付费企业客户合同留存之前，投资人应暂缓配置资金。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV016
          - type: callout
            title: 倍数压缩与下轮融资风险带来的下行敞口
            body: >-
              Series B 联合投资人是按未来期权价值而非现金流支撑给 Nous Research 定价，因此任何增长放缓或毛利率压缩都可能触发倍数骤降。若公司未能达到 $100 million 的退出 run-rate
              目标，而是落入基础设施行业常见的 12x 至 18x ARR 倍数，股权价值将压缩 30% 至 50%，没有高级清算优先权的后期进入者将面临严重的下轮融资风险。
            calloutType: risk
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV013
