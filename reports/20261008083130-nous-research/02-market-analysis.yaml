callouts:
  - calloutType: insight
    title: The Open-Weight Monetization Divergence
    body: |
      Nous Research demonstrates an extreme divergence between raw developer reach and commercial software capture. While the Hermes agent family commands over 214,000 GitHub stars and accounts for roughly 2.5% of estimated global AI token consumption, direct software monetization is bounded by the ease of self-hosting open weights. Sustainable venture returns require scaling Hermes for Businesses within privacy-conscious corporate environments while proving the technical viability of Psyche Network.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM008
      - CM010
  - calloutType: risk
    title: Decentralized Training Feasibility and Capital Disparity
    body: |
      Psyche Network's proposition to replace multi-billion-dollar hyperscale clusters with internet-distributed GPU training remains an unproven technological bet at frontier scale. Competing against centralized labs with massive annual capex requires flawless execution of the DisTrO optimizer and dependable token-economic incentives, exposing Nous to material architectural and competitive headwinds.
    claimRefs:
      - CM011
      - CM012
      - CM016
