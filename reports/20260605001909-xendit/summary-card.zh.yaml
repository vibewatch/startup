summary:
  headline: Xendit 是可信的区域支付基础设施赢家，规模和产品宽度都真实存在；但当前经济性、集中度以及监管 / 运营敞口不透明，建议仍停在继续研究，高于独角兽底线的溢价定价显得偏高。
