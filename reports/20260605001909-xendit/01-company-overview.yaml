    {
      "id": "capital-stack-and-stakeholders",
      "title": "Funding history, valuation, and stakeholder map",
      "body": "Capital formation is one of the best-documented parts of Xendit’s history. Official 2022 materials and Tech in Asia agree on a $300 million Series D led by Coatue and Insight Partners, bringing the official disclosed total to $538 million and following a $150 million 2021 Series C that DealStreetAsia ties to unicorn status. Tracxn adds more granularity on earlier rounds, including a March 2021 Series B led by Accel and earlier YC-era seed financing, while Accel’s own portfolio page confirms a 2015 initial investment year and the four-founder set. The investor stack matters strategically: YC and Accel explain early venture validation, Tiger Global marked the unicorn step-up, and Coatue plus Insight signaled later-stage growth confidence. What is still not public is equally important. Retained sources do not show debt facilities, secondary sales, board rights, or liquidation preferences, and tracker totals diverge from official totals after 2022. Later valuation work can therefore treat Xendit’s financing ladder as real, but should not assume that the public capital stack is complete or fully reconciled.",
