    {
      "id": "identity-model-and-footprint",
      "title": "Identity, product model, and footprint",
      "body": "Official Xendit materials and Y Combinator present a consistent identity: Xendit is a 2015-founded private payments infrastructure company that helps businesses accept and send money across Southeast Asia. The safest one-line description is broader than 'payment gateway.' Xendit’s homepage, YC profile, product page, and legal regional product terms together show a stack that includes collection, settlement, payouts, direct debit, e-wallets, cards, virtual accounts, over-the-counter payments, subscriptions, and cross-border workflows rather than a single checkout widget. The homepage says businesses can access 100+ payment methods across Indonesia, the Philippines, Malaysia, Thailand, Vietnam, Singapore, and Hong Kong, while official legal terms explain both aggregator and switcher settlement methods. That combination supports treating Xendit as late-stage regional payments infrastructure, not just a narrow PSP. The caveat is that public disclosure is stronger on footprint and product breadth than on economics: retained sources describe financing, treasury, and cross-border capabilities, but they do not provide audited revenue, margins, or cash-burn data.",
