    "number": 1,
    "title": "Company Overview",
    "summary": "Xendit is a 2015-founded, Jakarta-centered private payments infrastructure company whose public materials now span multi-channel collections, settlement, payouts, and cross-border expansion across Southeast Asia and into Latin America. Public evidence strongly supports a four-founder leadership core, unicorn status since 2021, and a $300 million 2022 Series D that brought official lifetime funding to $538 million, but current revenue, board structure, debt or secondary terms, and precise 2026 headcount remain underdisclosed."
  },
