    {
      "id": "revenue-quality-risks-and-diligence-blockers",
      "title": "Revenue quality, margin path, and diligence blockers",
      "body": "The strongest financial positive in the public record is pricing transparency: Xendit exposes list fees across many rails and countries and therefore makes the revenue mechanism legible. The strongest negatives are that the public record still does not prove what matters most for underwriting: current revenue, ARR, gross margin, burn, runway, reserve policy, and customer concentration. Regional terms show that merchants ultimately bear chargeback and refund economics, which can protect Xendit from some direct loss, but they also reveal operational burden around holds, reimbursements, and partner-rule complexity. Official status pages and StatusGator show recurring 2026 disruptions across virtual-account, direct-debit, and e-wallet components, while UpGuard provides an independent reminder that security and vendor-risk posture remain part of the operating surface. Taken together, public evidence supports a real, scaled, transaction-driven payments platform with multiple monetization levers and a historically strong financing record, but not one whose present revenue quality or capital sufficiency can be underwritten without management data. That keeps financing dependency, margin durability, and cash-runway assessment as live diligence blockers rather than settled conclusions.",
