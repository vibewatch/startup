    {
      "id": "capital-adequacy-and-balance-sheet-visibility",
      "title": "Capital adequacy and balance-sheet visibility",
      "body": "Historical financing is much easier to verify than present liquidity. Pillsbury's transaction note on the May 2022 Series D says Xendit raised $300 million led by Coatue and Insight Partners and that cumulative capital reached $538 million after earlier rounds including the $150 million Series C. That same source says proceeds were meant to fund expansion into Thailand, Malaysia, and Vietnam and to broaden value-added services such as working-capital loans. Xendit's licensing page and registry-style sources also support a real regulated operating footprint across Indonesia, the Philippines, and Singapore, which matters because a multi-entity payments business carries compliance and operational overhead that a simpler software company would not. What remains absent is the actual present-tense balance sheet: none of the reviewed public sources disclosed current cash on hand, burn, runway, debt facilities, warehouse lines, or reserve structures. Even the Singapore entity breadcrumbs on SGPGrid are explicitly entity-level and disclaimer-laden rather than consolidated audited financials. The result is a company with clearly demonstrated historical fund-raising capacity but ambiguous current capital adequacy.",
