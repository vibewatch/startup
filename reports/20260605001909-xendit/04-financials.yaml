  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Public evidence supports a real, transaction-fee-driven payments business with unusually transparent list pricing, a visible platform-fee layer, and historically strong access to venture capital. But Xendit still does not publicly disclose current group revenue, ARR, gross margin, cash, burn, runway, or debt, so TPV and merchant-scale anchors cannot be cleanly converted into underwritable unit economics or capital-adequacy conclusions."
