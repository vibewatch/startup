      - number: '3.3'
        title: Enterprise and global entrant pressure
        blocks:
          - type: paragraph
            body: >-
              The biggest upmarket pressure on Xendit comes from 2C2P by Antom and the global PSP or cross-border set.
              2C2P is the clearest regional enterprise comparator because its own materials and independent 2026
              coverage point to one-point-of-integration orchestration across Southeast Asia plus much larger airline
              and enterprise density: millions of daily transactions, 400+ methods, 150+ currencies, 600,000 acceptance
              points, and 25+ airlines. PACO also suggests a deeper travel and enterprise routing specialization than
              Xendit publicly proves. The global entrants attack from a different angle. Stripe and Checkout.com market
              single-API access to broad local-method sets, Adyen extends the pitch into payments, funds management, and
              payouts, and Airwallex adds a treasury-first layer with multi-currency accounts, FX, like-for-like
              settlement, and global payouts. For a merchant whose center of gravity is global SaaS, marketplace
              cross-border flows, or enterprise treasury control, those stacks can look stronger than Xendit. Xendit
              therefore sits in a narrower but still valuable middle: more localized than the global PSPs for Southeast
              Asia, but less scaled than 2C2P by Antom in cross-border enterprise orchestration.
