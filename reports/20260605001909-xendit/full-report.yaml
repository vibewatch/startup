  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Xendit
    rows:
      - - Online payments acceptance
        - Checkout, payment links, cards, wallets, QR, bank transfers, OTC payments, paylater acceptance
        - Consumer wallet balances not tied to merchant collection, offline cash that never touches a digital rail
        - Merchant or platform payments owner; end customer ultimately funds
        - Core collections layer and the clearest revenue pool for Xendit
      - - Virtual-account and bank-transfer collections
        - Unique payment identifiers, reconciliation-friendly bank-transfer flows, local bank rails
        - Generic bank accounts outside a merchant-orchestration workflow
        - Finance, ops, or product team pays for infrastructure; customer funds transaction
        - Important in Indonesia and other bank-transfer-heavy markets where reconciliation matters
      - - Disbursements / payouts
        - Supplier payments, payroll, refunds, creator or seller payouts, cross-border last-mile payout routing
        - Treasury management unrelated to payment operations
        - Operations, finance, payroll, or platform team budgets; recipients receive funds
        - Material Xendit wedge because send-money flows are a separate buyer workflow from checkout
      - - Direct debit and recurring collections
        - Subscription, invoice, and merchant-initiated pull payments through local bank rails
        - Traditional card-only recurring billing in markets where bank debit is irrelevant
        - Revenue ops or finance owns budget; end user authorizes account pull
        - Supports recurring-revenue and retention use cases beyond one-time checkout
      - - Platform / marketplace orchestration
        - Sub-merchant onboarding, collections plus split or downstream payouts, platform reconciliation
        - Pure SaaS workflow tools without money movement
        - Platform product, risk, or payments team budgets
        - High-value segment because complexity compounds as platforms add participants and geographies
      - - Cross-border local-payment access
        - Local acceptance plus local-currency settlement, QR or payout connectivity across markets
        - Wholesale correspondent banking, card-network FX alone, remittance-only consumer apps
        - Regional expansion, finance, or payments team budgets
        - Critical for cross-border commerce but still dependent on domestic method integration and compliance
      - - Embedded finance adjacencies
        - Treasury, cards, financing, and other adjacent financial workflows marketed near the payments stack
        - Standalone lending or corporate-finance products with no public payment-infrastructure linkage
        - Usually CFO, treasury, or finance-systems buyer
        - Adjacency is real but public evidence is too thin to size it as core Xendit SAM today
    notes: >-
      Boundary logic is workflow-based rather than technology-label based. The last row is intentionally treated as an
      adjacency because public material proves product adjacency more clearly than current revenue materiality.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM005
      - CM006
      - CM007
      - CM008
      - CM034
      - CM041
      - CM047
