      - number: '7.3'
        title: Partner dependency, competition, and margin pressure
        blocks:
          - type: paragraph
            body: >-
              Xendit’s moat and its dependency risk are the same thing: deep localization. The company’s own materials
              argue that it wins by integrating directly with country-specific methods across Indonesia, the
              Philippines, Thailand, Malaysia, and Vietnam. That localization is strategically valuable because
              merchants do want a single API for fragmented Southeast Asian rails. But it also means Xendit depends on a
              long chain of banks, wallet partners, direct-debit schemes, OTC networks, and scheme operators whose
              issues immediately show up in status-page incidents. The competitive picture makes the economic pressure
              clearer. Xendit’s own Singapore comparison tries to position the product against Stripe, Adyen, Airwallex,
              and HitPay, and even in that self-authored framing the market is clearly price and workflow sensitive:
              HitPay is cheaper on PayNow, Stripe charges 3.4% plus a fixed fee and explicit dispute fees, Adyen pushes
              method-specific and Interchange++ economics, and Airwallex competes from the treasury and FX side rather
              than only through gateway pricing. None of that proves Xendit cannot defend margin, but it does show that
              the company cannot rely on simple payment acceptance alone. It has to keep winning on local depth,
              platform workflows, and value-added operations while also avoiding the reserve, dispute, refund, and
              payout friction that customers are trained to ask about. Because the public record does not disclose
              top-partner or top-merchant concentration, investors still cannot tell how diversified that dependency
              stack really is.
