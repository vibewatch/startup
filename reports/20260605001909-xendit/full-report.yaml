companyProfile:
  summary: >-
    Xendit is a 2015-founded, Jakarta-centered private payments infrastructure company that helps businesses accept
    payments, disburse funds, run subscriptions, and manage settlement across Southeast Asia, with announced expansion
    into Latin America. Public materials support a four-founder leadership core, coverage of 100-plus payment methods
    across major Southeast Asian markets, and a real scaled operating footprint anchored by unicorn status since 2021, a
    $300 million Series D in 2022, and later public signals of 10,000-plus businesses/clients and more than $70 billion
    in annual payments. The core diligence issue is not whether Xendit has built a meaningful regional platform, but
    whether current revenue quality, margins, concentration, reserves, and cap-table terms are strong enough to justify
    paying materially above the unicorn floor.
