  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue quality disappoints
        - >-
          Audited or management-grade net revenue lands well below ~US$100M, or gross profit after pass-through is
          materially weaker than implied by the bull case.
        - The base-case band loses support and premium infrastructure framing breaks.
        - Do not underwrite above the bear range.
      - - Cap-table overhang is worse than assumed
        - Liquidation preferences, ratchets, or transfer constraints materially impair common-equity economics.
        - Headline valuation ceases to represent what new money actually owns.
        - Pause process until waterfall economics are clear.
      - - Reliability or regulatory burden worsens
        - Material recurring outages or a meaningful new regulatory setback appears in a core market.
        - Processor premium compresses because operational and compliance cost rise together.
        - Move from research-more toward avoid.
      - - Concentration proves high
        - >-
          A small number of merchants, channels, or partners drive a disproportionate share of gross profit or loss
          risk.
        - The infrastructure narrative becomes narrower and more fragile than public marketing implies.
        - Re-rate using a lower multiple and smaller upside case.
      - - Treasury or financing adjacencies are capital intensive
        - The company’s non-core financial products require significant balance-sheet capital or reserves to scale.
        - The business deserves a lower valuation framework than a capital-light infrastructure platform.
        - Apply a balance-sheet fintech discount.
      - - Weaker market clearing price emerges
        - A down-round, weak tender, or verified secondary clear happens materially below the base-case midpoint.
        - Public scenario support resets downward and confirms that 2021–2022 marks were too rich.
        - Wait for the reset rather than averaging into an unsupported premium.
    notes: >-
      Triggers are framed around underwriting failures that would change valuation, not around generic operating risks
      that any fintech carries.
    claimRefs:
      - CV030
      - CV031
      - CV039
      - CV043
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Audited revenue bridge
        - Current audited net revenue, ARR definitions, and bridge from TPV to net revenue.
        - Every scenario range changes materially if real net revenue is above or below current third-party estimates.
        - Request CFO pack, auditor-reviewed bridge, and cohort-level revenue definitions.
      - - Gross profit, take rate, and reserves
        - >-
          Gross profit after partner pass-through, reserve policy, chargeback or loss rates, and any safeguarded-funds
          mechanics.
        - >-
          This determines whether Xendit deserves capital-light infrastructure multiples or a lower-risk-adjusted
          framework.
        - Request unit-economics pack by rail, country, and merchant cohort.
      - - Concentration
        - Top merchant, partner, rail, and sector concentration plus churn and NRR by cohort.
        - A concentration surprise can collapse the premium much faster than top-line growth can save it.
        - Request top-20 merchant and partner exposure plus renewal data.
      - - Cap table and preferences
        - Liquidation preferences, ratchets, employee tender rights, ROFRs, and any structured rights from prior rounds.
        - Headline valuation can materially overstate common-equity value.
        - Review financing docs and waterfall analysis.
      - - Regulatory capital and entity structure
        - Entity-by-entity licenses, local capital requirements, safeguarded funds, and any pending remediation items.
        - The moat is partly regulatory, but the same stack can consume margin and slow expansion.
        - Request legal-entity map, approvals, and jurisdiction memos.
      - - Treasury and financing capital intensity
        - Use, margin, funding source, and loss profile for treasury, cards, financing, or early-settlement products.
        - Adjacencies can justify upside only if they do not drag the model into balance-sheet-heavy economics.
        - Request product-family P&Ls and funding lines.
      - - Current market clearing price
        - Verified recent secondary or fund-mark evidence with methodology and transfer mechanics.
        - Without clean price discovery, the recommendation has to remain conservative.
        - Request tender data, approved transfer history, or fund-mark documentation.
    notes: >-
      These are the minimum diligence items required to move from a public-evidence chapter to an investable
      underwriting view.
    claimRefs:
