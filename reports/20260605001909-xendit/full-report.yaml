            body: >-
              The public surface suggests a hybrid go-to-market motion. Xendit clearly courts startups and SMEs through
              one API, plug-ins, payment links, and a free-to-start narrative, but its activation documentation shows
              that some channels require extra documentation, dashboard workflows, customer-support contact, or even
              UAT. That points to a meaningful sales, onboarding, and service layer for more complex merchants and
              platforms. Scale anchors do exist: Xendit's 2024 Thailand announcement says 2023 volume exceeded 320
              million transactions, $25 billion TPV, and 6,000 merchants, with 30% year-over-year growth in both
              transactions and active merchants. Later company materials speak about technology serving over 10,000
              businesses, which is directionally positive but not directly comparable to the earlier merchant count.
              Those anchors let a diligence team calculate rough proxies such as blended ticket size and average TPV per
              merchant, but public unit economics still stop there. No reviewed official source disclosed take rate,
              gross margin, CAC, payback, NRR, loss rates, or concentration, and third-party revenue estimates conflict
