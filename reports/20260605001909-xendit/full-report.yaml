        title: Customer mix and proof tiers
        blocks:
          - type: paragraph
            body: >
              Xendit’s public customer evidence supports a genuinely mixed base rather than a single narrow buyer
              cohort. The current customer page explicitly segments customers across e-commerce, platforms and
              marketplaces, gaming, insurance, and travel, while also claiming to serve everyone from IG merchants and
              online businesses to large enterprises. That broad surface is corroborated by a long list of named case
              studies that map into different buyer and payer structures: marketplaces such as VCGamers and Tinvio,
              travel and hospitality businesses such as tiket.com, Sahid Hotels, Dijiwa, and BookMyShow, insurance and
              public-benefit collection flows such as Qoala, IFG Life, and BPJAMSOSTEK, plus fintech, telecom, D2C, and
              offline restaurant workflows such as Nanovest, XL Axiata, StudioKado, and Bakmi GM. The key diligence
              point is to separate proof quality. Traveloka, Lazada, Wawa Games, Pasarpolis, and Travelio are real named
              references on the current customer page, but those are lighter-weight logo or use-case proofs. By
              contrast, VCGamers, tiket.com, Qoala, IFG Life, and Tinvio provide more meaningful implementation proof
              because their case studies include operating context and measurable outcomes.
