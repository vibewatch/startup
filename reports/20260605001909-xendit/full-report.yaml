      - number: '8.4'
        title: What still blocks underwriting and what would break the thesis
        blocks:
          - type: paragraph
            body: >-
              The remaining blockers are exactly the issues that change common-equity outcomes fastest in fintech. There
              is no public bridge from TPV to net revenue after partner pass-through, no disclosed gross profit or
              reserve policy, no merchant or partner concentration data, and no public view into liquidation
              preferences, ratchets, or secondary transfer constraints. Private-market preview sites hint at secondary
              activity and cap-table fields, but the accessible public pages do not provide the numbers an investor
              would need. Meanwhile, downside monitoring is not theoretical: StatusGator shows visible incidents,
              UpGuard keeps Xendit on a vendor-risk surface, and the multi-entity licensing footprint implies recurring
              compliance cost. The right next step is therefore not to reject the company outright, but to refuse
              premium underwriting until management-grade evidence arrives. If diligence proves net revenue above
              roughly US$100 million, healthy gross profit, disciplined concentration, and a clean cap table at a price
              inside the low-to-mid processor band, the call can move toward track. If a weaker clearing price, new
              regulatory setbacks, or worse-than-expected reliability or capital intensity emerge, the thesis should
              compress quickly toward the bear case.
