      - number: '7.4'
        title: People, concentration, and expansion execution risk
        blocks:
          - type: paragraph
            body: >-
              The public Xendit story is large enough to matter but still opaque where investors most need downside
              detail. The CRO appointment says Xendit handled more than $32.5 billion of 2024 TPV for more than 10,000
              merchants and 100,000-plus sub-accounts, and that the 2026 roadmap is oriented toward enterprise
              expansion, cross-border payments, and ecosystem partnerships. Those are scale signals, but they also raise
              the execution bar. Selling deeper into large enterprises and into more jurisdictions requires operating
              discipline across legal entities, compliance, support, settlement, and scheme connectivity. Public
              leadership visibility is still relatively narrow: Moses Lo remains the most visible executive in the
              retained record, and while the CRO hire broadens commercial depth, the public materials do not settle the
              bench-strength or succession question. Concentration risk is similarly under-disclosed. Scale claims do
              not answer how much revenue depends on a handful of large merchants, sectors, or local rails, nor do they
              show how much outage or reserve stress one major partner could create. This is why people risk and
              concentration risk belong in the same section: the missing variable is whether Xendit already has enough
              institutional depth to manage a larger, more regulated, more enterprise-heavy operating model without
              remaining overly dependent on a small set of executives, merchants, or counterparties.
