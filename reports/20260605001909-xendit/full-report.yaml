        title: Platform and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The most important architecture implication is that Xendit is not just exposing payment acceptance
              endpoints; it is exposing a control plane for channel activation, asynchronous event handling, and
              multi-party fund segregation. xenPlatform documentation shows a master-account and sub-account structure
              with Owned and Managed variants, dashboard or API onboarding, and immediate master-key transfers between
              balances. That makes the platform story credible for marketplaces, branches, or franchise-like operations,
              but it also shows that the system inherits country and entity constraints instead of abstracting them away
              completely. Cross-border documentation reinforces the same point: Xendit can orchestrate sender-recipient
              onboarding, payout coverage lookup, and real-time status updates, yet remittance licensing still gates who
              can use the product. Global Account beta adds a cleaner multi-currency abstraction with one dashboard and
              API key, but public evidence still stops short of the underlying processing blueprint. There is no public
              disclosure of core ledger design, cloud-region topology, failover, fraud-loss controls, or service-level
              commitments that would let an investor underwrite resilience from documents alone.
