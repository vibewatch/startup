      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Xendit is not starting from zero on mitigation. The company has real legal agreements, verification flows,
              xenShield, account-security guidance, PCI certification, and a public status page that at least exposes
              incidents rather than hiding them. Those surfaces matter, and the CRO hire also suggests management
              understands that the next phase requires more structured enterprise execution. But the mitigation case is
              still incomplete from an investor perspective because the public record does not answer the hardest
              underwriting questions: how concentrated the merchant and partner base is, whether frequent incidents are
              mostly cosmetic or financially material, how often reserves and holds are used, and how the company will
              clear new-country licensing and direct-participation gates without eroding margins. For that reason, the
              final table translates risks into concrete monitoring triggers. Investors should not wait for a formal
              enforcement action or catastrophic breach; the earlier warnings are visible in outage cadence, support
              breakdowns, dispute economics, delayed launches, and inability to document concentration. If those metrics
              move the wrong way, Xendit could remain a large and useful payments platform while still becoming a poor
              risk-adjusted investment at the margin.
