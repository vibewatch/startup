      treasury adjacencies, while several economic layers stay undisclosed.
    data:
      nodes:
        - id: merchant_activity
          label: Merchant activity
          detail: SMEs, e-commerce sellers, enterprises, and platforms collect or send funds through Xendit.
        - id: payment_rails
          label: Payment rails
          detail: Cards, virtual accounts, wallets, QR, OTC, direct debit, paylater, and payouts.
        - id: list_fees
