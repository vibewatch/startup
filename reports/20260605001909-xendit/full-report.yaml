      - number: '2.4'
        title: Structural Drivers, Barriers, and Timing
        blocks:
          - type: paragraph
            body: >-
              The market exists now because several regional conditions matured at the same time. Digital commerce is
              large enough to matter, and digital payment penetration is no longer theoretical: e-Conomy SEA says more
              than 60% of payments are digital, while local rail statistics show real usage at national scale.
              Indonesia's QRIS user base reached 57 million and its cross-border QR links now span Thailand, Malaysia,
              Singapore, and Japan; Thailand's PromptPay processed roughly 2.54 billion transactions worth THB4.95
              trillion in March 2026 alone; Malaysia's PayNet processed 8.44 billion digital transactions in 2025 and
              expanded DuitNow QR to more than three million touchpoints; and the BSP says digital payments already
              represent 57.4% of Philippine retail-payment volume. These drivers increase demand for PSP and payout
              infrastructure, but they do not eliminate complexity. Each market still has distinct preferred methods,
              activation rules, refund windows, fund-flow models, and compliance expectations. BIS and AMRO both
              emphasize that cross-border payments remain slow, costly, or opaque outside the best retail corridors, and
              that interoperability, API standards, legal reform, and wider access for non-banks remain unfinished work.
              Fraud, scam response, and operational resilience also rise in importance as volume scales, which keeps
              trust, reliability, and local regulatory execution central to market structure rather than secondary
              product features.
