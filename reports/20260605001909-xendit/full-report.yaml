        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is unusually founder-centered. Xendit’s company page names Moses Lo as founder and
              chief executive, highlights Bo Chen, Juan Gonzalez, and Tessa Wijaya, and third-party/partner sources such
              as Accel and Tracxn explicitly list all four as founders. That is a stronger public founder record than
              many private startups, but the surrounding governance surface is thin. Retained sources do not expose a
              clean current board roster, committee structure, or investor-rights map, and Wellfound mostly reinforces
              team breadth rather than formal governance. Public leadership depth beyond the founders is more visible in
              market-specific roles such as Jayson Poon in Malaysia than in a fully disclosed global C-suite bench. The
              resulting diligence signal is mixed: founder-market fit is easy to explain because the same people still
              anchor product, operating, and market narratives, yet key-person dependence is real because strategy,
              reputation, and regional expansion are still concentrated in a small founding group. Public data quality
              also needs care: low-quality profiles and some databases conflict on founder identity, age, headquarters,
              or founding year, so canonical leadership facts should come from official or investor-backed sources
              rather than scraped summaries.
