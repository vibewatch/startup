  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a transaction-fee-first monetization model rather than a classic disclosed SaaS
              ARR stack. Xendit's pricing page, help center, and home page repeatedly say merchants can start for free
              and are charged when transactions succeed, while the country tables show that pricing varies by rail,
              geography, merchant category, and settlement mode. Indonesia alone mixes fixed virtual-account fees,
              percentage card MDRs, wallet-specific MDRs that change by merchant type, QRIS pricing, paylater
              percentages, and fixed payout fees. Malaysia adds a visible subscriptions line item, a payment-terminal
              hardware fee, and DuitNow payout pricing, while xenPlatform documentation layers on monthly active
              sub-account fees plus in-house transfer fees. That is enough to conclude the company monetizes several
              merchant workflows, but not enough to calculate realized take rate, because official pages also say some
              products and notifications carry separate charges and that pricing varies by usage volume. Observable
              pricing is therefore strong at the list-fee level, yet revenue mix, discounting, and net economics remain
              inferred rather than disclosed.
