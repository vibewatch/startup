      - number: '2.3'
        title: Buyers, Workflows, and Xendit-Relevant Subsegments
        blocks:
          - type: paragraph
            body: >-
              The buyer is not always the end user in this market, which is why segment mapping matters. For an online
              seller or D2C merchant, the buyer may be a founder, head of payments, finance lead, or product manager,
              while the end user is the consumer at checkout. For a marketplace or platform, the buyer is often a
              platform operations or payments team that needs both collections and downstream payouts to sellers,
              drivers, creators, or merchants. For subscriptions or invoicing flows, the budget owner may sit with
              finance or revenue operations, and direct debit matters because the workflow is retention and collections
              rather than one-off checkout conversion. Xendit's product surfaces map well to these subsegments: payment
              methods and local acceptance for online payments, payouts for payroll and supplier or refund flows,
              virtual accounts for bank-transfer collection and reconciliation, direct debit for recurring pull
              payments, and local QR, OTC, wallet, and paylater methods for conversion in markets where cards are not
              dominant. The activation and settlement layers are not uniform across methods; Xendit's docs show that
              some channels vary by entity type, require additional documentation or UAT, and differ in settlement
              timing, refund support, merchant-initiated transactions, and aggregator versus switcher fund flow. That is
              exactly the kind of fragmentation that supports an API-first infrastructure vendor.
