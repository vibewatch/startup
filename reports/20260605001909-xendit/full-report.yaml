            body: >
              The most convincing public evidence for Xendit is not the logo wall; it is the stack of named customer
              stories that describe a concrete workflow and then tie it to a measurable change. VCGamers reported
              nighttime payment success improving from 80% to more than 95%, with e-wallet and QRIS volume also rising.
              tiket.com said it handled up to 17x transaction surges during ticket wars while keeping payment
              performance stable. Sahid Hotels described a 26-property rollout that improved direct-booking enablement
              and centralized reporting. Qoala said claims and incentives moved 86% faster, Nanovest said top-up failure
              rates fell and satisfaction scores improved, Dijiwa described 90% faster settlement and higher monthly
              transaction volume, and Bakmi GM said it doubled delivery-order processing speed while saving 18 man-hours
              per day. These are meaningful proofs of production use. What they do not prove is portfolio-wide renewal
              quality or wallet-share depth. A case study that shows one customer using Xendit successfully is stronger
              than a logo, but it still does not reveal contract length, take rate, or whether the customer expanded
