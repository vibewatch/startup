      - number: '8.2'
        title: Market tailwinds and local regulatory depth justify interest, but not software-style certainty
        blocks:
          - type: paragraph
            body: >-
              Xendit’s premium thesis is not imaginary. Bain, Temasek, and Google argue that Southeast Asia’s digital
              economy should exceed US$300 billion of GMV in 2025, with revenue reaching US$135 billion, while digital
              financial services attract roughly half of private funding. The same sources note that all ASEAN-10
              countries now have national QR rails and eight already have cross-border QR interoperability, and
              Worldpay’s 2026 regional payments summary shows wallets and account-to-account rails becoming default
              behavior in Singapore, Indonesia, Thailand, Malaysia, the Philippines, and Vietnam. That backdrop fits
              Xendit’s product pitch: one integration across fragmented local methods, plus adjacencies like treasury,
              cards, financing, and multi-account operations. But the same evidence also argues for discipline. The
              licenses page, Singapore entity registry, Indonesian registry, and BSP operator list show a multi-entity
              legal footprint that looks closer to regulated payments infrastructure than to pure SaaS. That creates
              moat and strategic optionality, but it also raises compliance, operations, and potentially capital
              questions that public sources do not fully answer.
