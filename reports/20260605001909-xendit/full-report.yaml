  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - public anchor
      - conditions that must be true
      - valuation range
      - probability signal
      - decision implication
    rows:
      - - Bull
        - 2024 TPV >US$32.5B, enterprise roadmap, and regional market growth justify optionality.
        - >-
          Diligence proves net revenue comfortably above US$100M, healthy gross profit, disciplined concentration, and
          no punitive cap-table overhang.
        - US$1.5B–2.0B
        - 15%–25%
        - Interesting only if the price is at or below the low end of the band or the evidence set improves materially.
      - - Base
        - >-
          Last clean anchor is the 2022 Series D / unicorn era, while public payment comps mostly sit between roughly 1x
          and 6x revenue.
        - >-
          No major negative surprise, but no audited step-up either; investors keep applying a discount for opaque
          economics.
        - US$1.0B–1.5B
        - 50%–60%
        - This is the most defensible public-evidence range today and supports research-more rather than buy.
      - - Bear
        - >-
          Comp compression, weak price discovery, and visible regulatory or uptime complexity already exist in the
          public record.
        - >-
          Take rate, gross profit, concentration, or reliability prove materially worse than public bulls assume, or a
          lower-clearing round resets the price.
        - US$0.6B–1.0B
        - 25%–35%
        - Avoid premium entry and wait for a reset or for cleaner economics to emerge.
    notes: >-
      Ranges are scenario bands, not point estimates or DCF outputs. They are built from the last clean funding anchor,
      public comp dispersion, and unresolved evidence gaps.
    claimRefs:
      - CV037
      - CV040
      - CV041
