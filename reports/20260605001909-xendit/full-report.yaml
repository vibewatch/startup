      - number: '8.3'
        title: Public comps bound valuation support more tightly than private marketing pages do
        blocks:
          - type: paragraph
            body: >-
              Comparable context puts boundaries around how much premium Xendit can plausibly deserve. Windsor Drake
              says payments companies generally trade around 4–6x revenue in M&A, with premium infrastructure assets
              reaching 10x or more only when revenue quality, retention, and regulatory positioning are unusually
              strong. Public comps reinforce the dispersion. As of early June 2026, Multiples.vc places Adyen at 7.2x
              EV/revenue, but dLocal is near 2.0x, Shift4 in a low-to-mid single-digit band depending source convention,
              Marqeta around 1.5x–1.6x, PayPal about 1.2x, and Block around 1.6x–1.8x. That means the comp market does
              support premiums for scaled, capital-light, high-retention infrastructure, but not indiscriminately.
              Xendit is hard to slot cleanly into the premium bucket because public revenue estimates are contradictory:
              GetLatka claims US$97.2 million of 2024 revenue and a 2021 valuation as high as US$2.7 billion, while
              IncFact shows only a statistical US$1–10 million range and explicitly says private-company revenue is
              modelled. The safest bridge from that gap is scenario discipline rather than false precision. On public
              evidence alone, a base case around US$1.0–1.5 billion is more defensible than paying well above the last
              clean unicorn anchor; a bull case above that needs diligence proof that gross-flow scale converts into
              durable net revenue and margins.
