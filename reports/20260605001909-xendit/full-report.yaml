  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market structure and competitive classes
        blocks:
          - type: paragraph
            body: >-
              Xendit’s competitor set is not one tidy list of checkout widgets. The real alternatives break into four
              groups: regional orchestrators such as Xendit and 2C2P by Antom; country-depth local champions such as
              DOKU, Midtrans, Dragonpay, PayMongo, Billplz or Curlec, and Omise; global PSP or cross-border entrants
              such as Stripe, Adyen, Checkout.com, and Airwallex; and the substitute path where larger merchants
              internally stitch together multiple local PSPs and rail connections. Public 2026 evidence is unusually
              consistent that Southeast Asia remains structurally fragmented. The IMF describes progress in domestic and
              cross-border digital payments, but it also treats policy, connectivity, and interoperability as unfinished
              work. Stripe’s APAC guide separately says the region remains fragmented by infrastructure, fraud, and
              regulation. Fintech News’ 2026 country review makes the consequence concrete: Singapore leans on PayNow
              and wallets, Malaysia on DuitNow and FPX, the Philippines on GCash, Maya, and QR Ph, Indonesia on BI-FAST
              and QRIS, Thailand on PromptPay, and Vietnam on VietQR and local wallets. That diversity makes
              winner-take-all across the whole region unlikely. The competitive question is therefore who best abstracts
              local complexity for a given merchant segment and workflow.
            claimRefs:
