      - number: '1.4'
        title: Milestones, scale signals, and adverse operating evidence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows Xendit moving from an Indonesia-founded payments company into a broader
              regional infrastructure platform and then into early global expansion. Official sources and trackers
              support a path from 2015 founding and YC-era seed backing to 2020 Philippines expansion, 2021 Series B and
              Series C fundraising, 2022 strategic investments around Bank Sahabat Sampoerna and Dragonpay plus a $300
              million Series D, 2023 Malaysian build-out via Payex, and 2025-2026 pushes into Malaysia at scale and
              Latin America. Official 2025 Malaysia materials claim more than 4,500 Malaysian businesses onboarded, more
              than RM5 billion processed, 99.5% uptime, and 50% year-on-year cross-border transaction growth, while ACV
              and Tech in Asia say Xendit now processes over $70 billion annually for more than 10,000 clients. Those
              are useful scale signals, but they remain company- or partner-amplified rather than audited. The adverse
              record is not empty: Xendit’s own status page and independent outage trackers show recurring
              partner/payment-rail disruptions across products and geographies in 2025-2026, and the newsroom archive
              separately warns about fraud attempts abusing the brand. None of that proves systemic failure, but it does
              make operational resilience, partner concentration, and trust controls core diligence themes for later
              chapters.
