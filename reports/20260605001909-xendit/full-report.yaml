            body: >-
              Security and reliability signals are present, but they are stronger at the control-surface level than at
              the deep-infrastructure level. Official materials say Xendit is PCI DSS Level 1 and describe SSL
              transport, AES-256 encryption at rest, callback-token verification, and broader developer security
              hygiene. The license page also suggests real operational depth because Xendit lists payments, remittance,
              financing, and payments-system permissions across multiple Southeast Asian jurisdictions. Independent
              signals are more mixed. UpGuard adds a useful external risk-monitoring lens, but it does not replace audit
              evidence, and StatusGator surfaced a June 5, 2026 partial outage affecting a Philippines virtual-account
              bank-transfer component. The public moat therefore looks operational and regional rather than purely
              technical: local method coverage, regulatory footprint, and platform-money-movement workflows are hard to
              rebuild quickly, while the client SDK layer and much of the visible interface logic are easier for peers
