    "number": 2,
    "title": "Market Analysis",
    "summary": "Xendit operates in a Southeast Asian B2B payments-infrastructure market defined less by one headline TAM than by the convergence of digital commerce, national real-time rails, local payment-method fragmentation, and API-first merchant demand. Public evidence supports a broad transaction-flow opportunity already above US$300 billion in regional digital-economy GMV, a nearer e-commerce flow lens of US$185 billion in 2025 with 97% of e-commerce payments expected to be digital by 2029, and strong country-level adoption in Indonesia, Thailand, Malaysia, and the Philippines. The market exists now because buyers need one abstraction layer across virtual accounts, e-wallets, QR rails, direct debit, cards, and payouts, but precise Xendit revenue SAM/SOM still cannot be isolated from public data because take rates, product mix, and country-level volume splits remain undisclosed."
  },
