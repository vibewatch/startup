      "id": "sizing-lenses-and-why-now",
      "title": "Sizing Lenses and Why This Market Exists Now",
      "body": "Public market sizing for Xendit has to be done through multiple lenses because no single published estimate cleanly maps to Southeast Asian B2B payments-infrastructure revenue. The broadest flow lens comes from e-Conomy SEA: Southeast Asia's digital economy is on track to surpass US$300 billion in GMV in 2025, with e-commerce alone reaching US$185 billion. A narrower forward-looking commerce lens comes from the IDC info brief commissioned by 2C2P and Antom, which projects the region's e-commerce market to US$289.8 billion by 2029 and says 97% of e-commerce payments will be digital by then. A payments-adoption lens from IDC, cited by Fintech News Singapore, projects the regional digital-payments market from US$120 billion in 2023 to US$306 billion by 2028. These are useful but non-identical shells: some describe commerce flows, some payment-method mix, and none directly disclose the take-rate pool addressable by a PSP like Xendit. The cleanest SAM logic therefore focuses on merchant and platform payment flows in Xendit's served markets rather than on a generic Southeast Asia TAM. SOM is even harder to isolate, because public sources support only proxy traction signals such as Xendit serving over 10,000 businesses and thousands of merchants, not product-level TPV or monetization by country.",
