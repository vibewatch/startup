    {
      "id": "market-boundary-and-included-flows",
      "title": "Market Boundary and Included Flows",
      "body": "Xendit's relevant market is not the entire Southeast Asian fintech stack and not merely a checkout widget category. The better boundary is B2B payments infrastructure for businesses that need to collect, reconcile, disburse, and settle money across fragmented local rails. Xendit's own surfaces consistently place it in that infrastructure layer: the company targets startups and SMEs, enterprises expanding into the region, e-commerce sellers, and platforms that need sub-merchant onboarding, recurring billing, and payouts. Included spend therefore covers online payment acceptance, virtual-account and bank-transfer collections, QR and wallet acceptance, direct debit for recurring payments, refunds and disbursements, and cross-border settlement or payout routing where a merchant still needs local method access. Excluded spend includes pure consumer wallet balances, domestic cash transactions that never touch a digital rail, and broad consumer-finance or treasury products unless a public source shows they are commercially material to Xendit's core stack. This distinction matters because the valuation-relevant opportunity is the orchestration layer that hides country-by-country method complexity from merchants, not the full gross merchandise value of every digital transaction in ASEAN.",
