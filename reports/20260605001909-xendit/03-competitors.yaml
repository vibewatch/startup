  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Xendit competes in a structurally fragmented Southeast Asian payments-infrastructure market where no single provider wins every country, method, or merchant segment. Public evidence suggests Xendit is strongest as a regional API layer for startups, SMEs, platforms, and expanding merchants that need local methods plus payouts across multiple SEA markets, but it looks weaker than 2C2P/Antom on enterprise and cross-border scale, weaker than country specialists on home-market depth, and weaker than Stripe, Adyen, Checkout.com, and Airwallex on global enterprise, acquiring, FX, and treasury breadth."
  },
