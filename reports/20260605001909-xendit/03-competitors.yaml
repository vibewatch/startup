    {
      "id": "moats-switching-costs-and-market-outcome",
      "title": "Moats, switching costs, and likely market outcome",
      "body": "Xendit’s moat is real, but it is not a monopoly moat. The strongest defensible element is regional abstraction: one integration for collections plus payouts across multiple Southeast Asian markets, supported by local method knowledge and platform workflows that matter to startups, SMEs, and expanding merchants. Switching costs are therefore created less by card processing code and more by reconciliation, payout operations, sub-merchant or split-flow logic, partner onboarding, and compliance setup. That helps Xendit, but it also makes multi-homing rational for larger merchants, because they can keep Xendit where it is strong while adding local champions or global PSPs where those alternatives are clearly better. Two weaknesses are visible in the public record. First, Xendit’s own status page shows repeated 2026 incidents across wallets, direct debit, virtual accounts, and payouts or disbursements, which keeps partner-dependence risk alive. Second, an adverse competitor comparison argues that tax and multi-currency complexity can push cross-border SaaS merchants toward more global alternatives. The most likely market outcome is continued fragmentation: local specialists defend home-market depth, 2C2P and globals compete for larger enterprise accounts, and Xendit remains strongest where merchants want a regional Southeast Asia operator rather than a domestic specialist or a global treasury platform.",
