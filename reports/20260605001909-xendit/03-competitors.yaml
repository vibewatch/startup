    {
      "id": "direct-regional-and-local-peers",
      "title": "Direct regional and local peers",
      "body": "Against Southeast Asian direct peers, Xendit looks strongest when the merchant wants one regional API that covers local methods plus send-money workflows. Xendit’s homepage and docs show a stack that spans 100+ payment methods, subscriptions, batch payouts, automated payouts, cross-border tools, and platform features across seven named Asian markets. That breadth is harder to match for single-country specialists. But local champions still matter because they look deeper inside their home markets. DOKU emphasizes 45+ Indonesian methods, direct API integration, and domestic bank disbursements. Midtrans leans into Indonesia-specific method packaging across GoPay, QRIS, virtual accounts, cards, retail cash, and other methods, while its onboarding detail shows the reality of activating local rails. Dragonpay remains a Philippines specialist with OTC, online banking, wallets, and payouts, and PayMongo pairs a modern API-first posture with QR Ph, wallet capture, and platform fund-splitting for more than 10,000 businesses. In Malaysia, Billplz’s billing API and Curlec’s FPX, DuitNow, recurring, and split-settlement workflows show why local bank-transfer and recurring rails are not fully commoditized. Omise remains supportable as a Thailand-rooted API-first payment and transfer platform. Net result: Xendit is regionally broader, but local specialists can still be deeper where the merchant only cares about one country.",
