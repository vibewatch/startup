chapter:
  number: 6
  title: Customers
  summary: 'Xendit has credible public customer proof across multiple Southeast Asian segments, with the strongest evidence coming from named case studies that show production use and measurable operational outcomes. The main caveat is that portfolio-wide durability remains under-disclosed: public materials prove adoption far better than they prove company-wide retention, expansion, or concentration.'
sections:
- id: customer-mix-and-proof-tiers
  title: Customer mix and proof tiers
  body: |
    Xendit’s public customer evidence supports a genuinely mixed base rather than a single narrow buyer cohort. The current customer page explicitly segments customers across e-commerce, platforms and marketplaces, gaming, insurance, and travel, while also claiming to serve everyone from IG merchants and online businesses to large enterprises. That broad surface is corroborated by a long list of named case studies that map into different buyer and payer structures: marketplaces such as VCGamers and Tinvio, travel and hospitality businesses such as tiket.com, Sahid Hotels, Dijiwa, and BookMyShow, insurance and public-benefit collection flows such as Qoala, IFG Life, and BPJAMSOSTEK, plus fintech, telecom, D2C, and offline restaurant workflows such as Nanovest, XL Axiata, StudioKado, and Bakmi GM. The key diligence point is to separate proof quality. Traveloka, Lazada, Wawa Games, Pasarpolis, and Travelio are real named references on the current customer page, but those are lighter-weight logo or use-case proofs. By contrast, VCGamers, tiket.com, Qoala, IFG Life, and Tinvio provide more meaningful implementation proof because their case studies include operating context and measurable outcomes.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU011
  - CU033
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customers-and-quantified-outcomes
  title: Named customers and quantified outcomes
  body: |
    The most convincing public evidence for Xendit is not the logo wall; it is the stack of named customer stories that describe a concrete workflow and then tie it to a measurable change. VCGamers reported nighttime payment success improving from 80% to more than 95%, with e-wallet and QRIS volume also rising. tiket.com said it handled up to 17x transaction surges during ticket wars while keeping payment performance stable. Sahid Hotels described a 26-property rollout that improved direct-booking enablement and centralized reporting. Qoala said claims and incentives moved 86% faster, Nanovest said top-up failure rates fell and satisfaction scores improved, Dijiwa described 90% faster settlement and higher monthly transaction volume, and Bakmi GM said it doubled delivery-order processing speed while saving 18 man-hours per day. These are meaningful proofs of production use. What they do not prove is portfolio-wide renewal quality or wallet-share depth. A case study that shows one customer using Xendit successfully is stronger than a logo, but it still does not reveal contract length, take rate, or whether the customer expanded over multiple years.
