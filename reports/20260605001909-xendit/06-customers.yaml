  evidenceGaps:
  - type: missing-source
    severity: material
    topic: portfolio-retention
    missingEvidence: Company-wide NRR, GRR, logo retention, churn, renewal timing, and contract duration by country and segment.
    whyItMatters: Case-study point metrics do not let an investor underwrite whether Xendit retains and expands its installed base at the portfolio level.
    diligencePath: Request cohort tables for top segments and the top 20 customers, including gross/logo churn and NRR for Indonesia and Philippines.
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-mix
    missingEvidence: Current active customer count, active merchants/accounts, and revenue or TPV split across SMEs, platforms, and enterprises.
    whyItMatters: Historical scale signals exist, but current customer-mix disclosure is needed to judge sales efficiency, segment resilience, and concentration.
    diligencePath: Ask management for current active-customer counts, monthly active merchant counts, TPV mix, and take-rate mix by segment and geography.
    relatedTableRefs:
    - TU001
    - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, top-10 customer TPV share, and sector concentration by TPV and net revenue.
    whyItMatters: Large-brand logos can hide material single-account exposure or a narrow sector mix that would matter in an investment committee downside case.
    diligencePath: Request top-customer concentration schedules and customer-level churn or downgrade history over the last 24 months.
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Fresh customer-side or independent deployment writeups for Traveloka, Lazada, Grab, and other flagship logos.
    whyItMatters: Current public proof for several brand-name customers is logo-level and does not show production scope, spend, duration, or renewal.
    diligencePath: Ask Xendit for customer references or permissioned proof packs that show live scope, contract start date, payment methods used, and renewal status.
    relatedTableRefs:
    - TU003
acknowledgedWarnings:
- dimension: figureType
  reason: Public customer evidence does not disclose true cohort percentages, so a retention visibility matrix is more honest than fabricating cohort cells just to satisfy the planned figure shape.
