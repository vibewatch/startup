- id: social-proof-and-self-serve-surface
  title: Social proof and self-serve surface
  body: |
    Outside Xendit’s own site, the external social-proof surface is broad enough to matter but mixed enough to require filtering. FeaturedCustomers aggregates 27 case studies, 40 testimonials, and 1,661 reference ratings, which is useful evidence that Xendit has a substantial library of referenceable use cases. The WordPress WooCommerce plugin listing at 2,000+ installations adds another important signal: Xendit appears to have a real long-tail merchant distribution surface, not just enterprise deals. FitGap and SourceForge also position the product as a combined pay-in/pay-out API layer for marketplaces, e-commerce, and SaaS operators, which is directionally consistent with the official case-study mix. But external proof should not be treated as cleanly as direct case studies. Review aggregators vary in rigor, customer samples are often small, and a large testimonial count does not reveal whether customers stayed, expanded, or churned. The best use of this external layer is therefore as corroboration that Xendit is a real production platform with both enterprise and SME reach, not as a substitute for management-grade retention or concentration data.
  claimRefs:
  - CU005
  - CU009
  - CU010
