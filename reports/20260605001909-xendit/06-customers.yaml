- id: customer-risks-and-caveats
  title: Customer risks and caveats
  body: |
    The main customer risk is not lack of adoption; it is lack of transparency about the quality of adoption. Several large logos are publicly named, but some of the biggest brands still sit in the weakest proof tier, where public materials confirm that Xendit touches the payment flow without clarifying scope, contract duration, or current spend. That matters because concentration risk remains undisclosed. The second risk is trust and support. Trustpilot reviews include complaints about merchant activation, robotic support, and inability to process payments, and even the weaker Knoji signals point in the same direction on customer service. The third risk is reliability. Public incident trackers recorded a May 2026 intermittent dashboard outage and a June 2026 partial outage affecting Philippines virtual-account bank-transfer components. Those incidents do not negate the many positive case studies, but they do show why customers buy payment infrastructure on trust and continuity, not only on feature breadth. The customer verdict is therefore positive on real deployment proof and breadth of segment coverage, but still cautious on durability and concentration because the public record is curated and incomplete.
  claimRefs:
  - CU033
  - CU038
  - CU039
  - CU040
  - CU041
  - CU042
