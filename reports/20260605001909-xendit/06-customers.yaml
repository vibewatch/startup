figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Xendit’s customer journey starts with broad channel coverage and tends to deepen when customers add payouts, recurring billing, or platform workflows.
  data:
    nodes:
    - label: Discovery / self-serve entry
      detail: SMEs and online merchants encounter Xendit through plugins, checkout links, or API-first merchant onboarding; the WooCommerce plugin and customer page support this entry point.
      tone: neutral
    - label: Initial payment acceptance
      detail: Customers adopt Xendit for local payment methods, virtual accounts, cards, or e-wallet acceptance, often to reduce friction or increase payment success.
      tone: positive
    - label: Operational integration
      detail: Named customers start using dashboard reconciliation, refunds, settlement visibility, or support workflows; this is where implementation proof becomes stronger than logo proof.
      tone: neutral
    - label: Workflow expansion
      detail: Higher-value accounts add payouts, platform ledgers, recurring collections, or auto debit, which can make Xendit more embedded inside finance or marketplace operations.
      tone: positive
    - label: Repeat-use / renewal proxy
      detail: Only a few public cases expose repeat-use signals such as IFG Life’s 2x retention or Tinvio’s >80% monthly TPV retention, so durability remains only partially visible.
      tone: warning
    - label: Trust test
      detail: Support complaints and 2026 outage records show the point at which customer trust can weaken even if the feature surface is broad.
      tone: risk
  approximationNotes: This journey map is inferred from public customer stories, plugin distribution, and outage/support evidence; Xendit does not publish a formal funnel or lifecycle model.
  claimRefs:
  - CU005
  - CU031
  - CU037
  - CU041
