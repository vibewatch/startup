- id: retention-durability-and-expansion
  title: Retention, durability, and expansion
  body: |
    Public retention evidence exists for Xendit, but it is thin and customer-specific. The clearest case-level durability signal is IFG Life’s claim that auto debit doubled retention, which is directionally important because it suggests payment automation can affect renewal behavior in an insurance context. Tinvio adds another useful data point by claiming monthly TPV retention above 80% while growing 50%+ compounded monthly in Indonesia. Papaya Tree Farms and BPJAMSOSTEK both reinforce the same pattern qualitatively: recurring collections and direct-debit setups appear to improve repeat behavior and reduce missed payments. Even so, none of these proofs should be over-interpreted. IFG Life does not disclose its starting retention rate or cohort window; Tinvio’s >80% figure is a customer-specific TPV retention proxy rather than a disclosed Xendit portfolio metric; and BPJAMSOSTEK’s auto-debit activations show adoption, not long-term renewal. Across the broader customer base, Xendit does not publicly disclose NRR, GRR, churn, contract duration, cohort retention, or top-customer concentration. The safest read is therefore that Xendit’s workflows appear capable of becoming sticky inside customer operations, but public evidence is still insufficient to underwrite whole-portfolio durability.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU029
  - CU031
  - CU032
  - CU034
