  topStrengths:
    - >-
      Xendit has real regional product breadth: public materials support 100-plus payment methods plus collections,
      payouts, direct debit, subscriptions, platform flows, and treasury-style adjacencies across major Southeast Asian
      rails.
    - >-
      Scale is not just a story: retained sources support unicorn status since 2021, a $300 million Series D in 2022,
      and later public signals of 10,000-plus businesses/clients and more than $70 billion in annual payments.
    - >-
      For a private payments company, Xendit's list-price transparency and named customer or case-study base give
      unusual visibility into what it sells and how merchants use the platform.
  topRisks:
    - >-
      Current revenue, ARR, take rate, gross margin, burn, runway, reserve policy, and cap-table terms are not publicly
      disclosed, so investors still cannot cleanly translate payment volume into underwritable equity economics.
    - >-
      The operating model sits on a heavy multi-entity regulatory stack and on partner-controlled local rails, creating
      real expansion, compliance, and uptime risk across markets.
    - >-
      Public incidents and complaints show that partner-end outages, activation friction, and support or reliability
      issues can affect merchant trust, while concentration by merchant, partner, or rail remains undisclosed.
  unresolvedGaps:
    - Audited current net revenue, ARR definitions, and the bridge from TPV to net revenue remain missing.
    - >-
      Gross profit after partner pass-through, reserve policy, fraud or chargeback loss rates, and outage-cost economics
      remain undisclosed.
    - Top-merchant, top-partner, top-rail concentration and cohort retention or NRR data are still unavailable publicly.
    - >-
      Cap-table terms, liquidation preferences, and any current secondary or fund-mark evidence are still needed to
      anchor fair value.
