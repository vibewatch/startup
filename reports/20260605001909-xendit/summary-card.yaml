summary:
  headline: >-
    Xendit is a credible regional payments infrastructure winner with real scale and product breadth, but opaque current
    economics, concentration, and regulatory or operational exposure keep the recommendation at research-more and make
    premium pricing above the unicorn floor look stretched.
  overallScore: 5.6
  recommendation: research-more
