company:
  name: Xendit
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Xendit as a real, scaled Southeast Asian payments-infrastructure asset, but not as a clean premium underwriting case at today's likely private-market expectations. The most defensible call is research-more with medium confidence and a stretched stance above roughly US$1.5 billion until audited revenue quality, gross profit, cap-table terms, and concentration data are disclosed.
sections:
- id: recommendation-and-anchor
  title: Recommendation stays research-more because scale is real but public price support is still thin
  body: 'Public evidence makes Xendit interesting, but not yet cleanly investable at a premium price. The pro case starts with scale: Xendit says it processed more than US$32.5 billion of TPV in 2024, supported more than 10,000 active merchants and 100,000-plus sub-accounts, and is orienting 2026 around enterprise expansion, cross-border payments, and partnerships. The 2024 Thailand expansion release also points to more than 320 million transactions, US$25 billion of 2023 TPV, more than 6,000 merchants, and 30% growth in transactions and active merchants, while TechCrunch and Pillsbury confirm that investors funded the company through a US$300 million Series D and US$538 million total raised. Those are real anchors for a regional infrastructure story. The anti-thesis is that current valuation still sits on weak public price discovery. The reviewed sources do not provide audited current revenue, gross profit, reserve economics, concentration, or cap-table terms, and third-party database estimates
    on revenue differ so sharply that they are better read as evidence of opacity than of performance. That combination—real scale, real market need, weak current economics disclosure—is why the recommendation stays research-more rather than buy.'
