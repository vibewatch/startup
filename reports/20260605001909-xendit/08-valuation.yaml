- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - assessment
  - key driver
  - what would change it
  rows:
  - - recommendation
    - research-more
    - Public evidence shows real scale, but price support still rests on incomplete economics disclosure.
    - Move toward track only if audited or management-grade economics arrive at a disciplined entry price.
  - - confidence
    - medium
    - Market growth, funding history, and operating-scale claims are credible, but current revenue quality is not.
    - Upgrade confidence if audited revenue, gross profit, and cap-table terms are disclosed.
  - - risk rating
    - high
    - Multi-entity regulation, partner-end reliability, and uncertain unit economics can all compress the equity case.
    - Reduce risk only if concentration, outage severity, and reserve or loss metrics are documented.
  - - valuation stance
    - stretched
    - Anything materially above roughly US$1.5 billion asks investors to pay beyond what public evidence can support today.
    - A lower entry price or materially stronger economics disclosure would move the stance toward fair.
  - - decision implication
    - wait for diligence or a lower clearing price
    - Base-case public support is closer to US$1.0–1.5 billion than to peak-cycle premium narratives.
    - Consider action only when revenue quality, preferences, and concentration are underwritable.
  notes: Assessment is price-sensitive. The table summarizes what public evidence supports today, not what management may prove later in diligence.
