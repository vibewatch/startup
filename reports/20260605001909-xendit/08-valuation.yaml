- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Revenue quality disappoints
    - Audited or management-grade net revenue lands well below ~US$100M, or gross profit after pass-through is materially weaker than implied by the bull case.
    - The base-case band loses support and premium infrastructure framing breaks.
    - Do not underwrite above the bear range.
  - - Cap-table overhang is worse than assumed
    - Liquidation preferences, ratchets, or transfer constraints materially impair common-equity economics.
    - Headline valuation ceases to represent what new money actually owns.
    - Pause process until waterfall economics are clear.
  - - Reliability or regulatory burden worsens
    - Material recurring outages or a meaningful new regulatory setback appears in a core market.
    - Processor premium compresses because operational and compliance cost rise together.
    - Move from research-more toward avoid.
  - - Concentration proves high
    - A small number of merchants, channels, or partners drive a disproportionate share of gross profit or loss risk.
    - The infrastructure narrative becomes narrower and more fragile than public marketing implies.
    - Re-rate using a lower multiple and smaller upside case.
  - - Treasury or financing adjacencies are capital intensive
    - The company’s non-core financial products require significant balance-sheet capital or reserves to scale.
    - The business deserves a lower valuation framework than a capital-light infrastructure platform.
    - Apply a balance-sheet fintech discount.
  - - Weaker market clearing price emerges
    - A down-round, weak tender, or verified secondary clear happens materially below the base-case midpoint.
    - Public scenario support resets downward and confirms that 2021–2022 marks were too rich.
    - Wait for the reset rather than averaging into an unsupported premium.
  notes: Triggers are framed around underwriting failures that would change valuation, not around generic operating risks that any fintech carries.
