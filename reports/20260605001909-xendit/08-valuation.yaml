- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence
  - what would change the view
  rows:
  - - Thesis
    - Xendit has real regional payment-infrastructure scale, a strong local-rails value proposition, and exposure to a Southeast Asian digital-payments market that is still deepening.
    - Audited net revenue, gross profit, and retention proof would strengthen the case for paying a premium.
  - - Anti-thesis
    - Public economics remain opaque, regulatory and entity complexity are real, and reliability or security signals still justify a haircut versus premium software-like infrastructure.
    - A lower price, cleaner cap table, and evidence that treasury or financing adjacencies are capital-light would reduce the discount.
  notes: The anti-thesis is about evidence quality and downside protection, not denial that Xendit is a meaningful regional platform.
