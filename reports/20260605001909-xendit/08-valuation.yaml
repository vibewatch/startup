- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Adyen
    - Public payment infrastructure / EV-revenue
    - ~7.2x EV/revenue; ~US$34B market cap
    - Upper-bound premium reference for a scaled, bank-like, enterprise-grade processor.
    - Much more profitable and institutionally disclosed than Xendit.
  - - dLocal
    - Emerging-market payments / EV-revenue
    - ~2.0x EV/revenue; ~US$3.46B market cap
    - Closest public emerging-market infrastructure analog in spirit.
    - Cross-border mix and global merchant profile differ from Xendit’s local-rails concentration.
  - - Shift4
    - Merchant acquiring / EV-sales
    - ~1.6x–3.4x EV-sales band depending source convention
    - Useful mid-band processor reference for merchant-acquiring economics.
    - US-heavy mix, leverage, and hardware exposure differ materially.
  - - Marqeta
    - Payments API / EV-sales
    - ~1.5x–1.6x EV-sales; ~US$1.0B EV
    - API-driven platform reference with thinner economics than premium processors.
    - Issuer-processing niche is narrower than Xendit’s pay-in/pay-out footprint.
  - - PayPal
    - Scaled global processor / EV-sales
    - ~1.2x EV-sales; ~US$40.04B EV
    - Shows how large, disclosed payment volume can still trade at modest multiples.
    - Much larger, more mature, and more diversified than Xendit.
  - - Block
    - Merchant + ecosystem payments / EV-sales
    - ~1.6x–1.8x EV-sales; ~US$43B EV
    - Adds ecosystem optionality and wallet exposure to the comp set.
    - Cash App and software mix make it a looser analogue.
  - - Xendit (public anchor)
    - Private financing context
    - 2022 Series D US$300M; unicorn-era valuation context; current revenue unresolved
    - Frames why wide scenario bands are safer than point-precision today.
    - No audited current revenue, no fresh primary round, and third-party estimates conflict.
  notes: This is a selective comp set covering the most decision-useful payments and infrastructure references plus Xendit’s last clean public financing anchor; it is not an exhaustive universe of global fintech names.
