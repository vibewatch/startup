  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 结论仍然保守：有意义的规模和市场顺风，仍要面对疲弱的价格发现和不完整的经济性披露。
    data:
      nodes:
        - label: |-
            规模证据
            2024 TPV > US$32.5B；10k+ 商户；100k+ 子账户
        - label: |-
            市场顺风
            东南亚数字经济 GMV > US$300B；钱包和 A2A 仍在上升
        - label: |-
            监管护城河
            多国牌照和本地市场深度
        - label: |-
            经济性不透明
            无经审计当前收入、毛利、准备金或集中度数据
        - label: |-
            估值纪律
            公开支付处理商可比公司大多集中在约 ~1x-6x 收入
        - label: |-
            建议
            继续研究 | 高风险 | 高于 ~US$1.5B 则偏高
    approximationNotes: 该图是从保留证据到判断的定性链条，不是加权评分模型。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV015
      - CV039
      - CV040
      - CV044
      - CV046
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 摆动最大的因素是收入质量、股权结构表干净程度，以及买方会多大幅度要求相对公开支付处理商打折。
    data:
      items:
        - label: 经审计净收入显著高于 US$150M
          value: 0.5
        - label: 毛利和准备金状况好于担忧
          value: 0.3
        - label: 股权结构表简单，优先权拖累有限
          value: 0.2
        - label: 可比公司倍数压向支付处理商低端
          value: -0.4
        - label: 重大宕机或监管受挫
          value: -0.3
        - label: 资金管理 / 融资被证实资本消耗高
          value: -0.3
    approximationNotes: 数值是相对基准情景中点的方向性 US$ 十亿级变化，来自公开可比公司区间和缺失数据风险，而不是管理层指引。
    claimRefs:
      - CV022
      - CV029
      - CV040
      - CV042
      - CV043
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的决策区间；上一次干净的独角兽融资锚点，已不足以支撑自动按溢价承销。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.8
          high: 1
        - label: 基准
          low: 1
          mid: 1.25
          high: 1.5
        - label: 乐观
          low: 1.5
          mid: 1.75
          high: 2
    approximationNotes: 数值是宽口径的企业价值式决策区间，单位为 US$ 十亿；依据 2022 年融资锚点、公开可比公司分散度和未解决的经济性缺口推断。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV047
      - CV050
