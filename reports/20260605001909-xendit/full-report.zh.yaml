  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律栈风险
        blocks:
          - type: paragraph
            body: >-
              Xendit 的监管风险不来自某一起已知执法事件，而是先来自结构复杂度。公司自己的牌照页显示，集团已经横跨印尼和菲律宾的多个受监管实体，包括 Bank Indonesia 的支付网关和资金转移批准、与 OJK
              相关的数字金融、融资和农村银行实体，以及 BSP 登记的 OPS、汇款或虚拟资产许可。这样的结构让 Xendit
              能铺出更宽的产品面，但也意味着监管变化可能同时打到多个实体和业务线。菲律宾材料把负担说得很具体：BSP 的 OPS 框架可以覆盖支付网关，也可以触达服务菲律宾客户的境外提供商，并要求受监管机构接入合规
              OPS。马来西亚和新加坡为未来扩张强化了同一模式。PayNet 要求本地设立公司、经验、股权、交易量和 BNM 监管身份，才允许直接参与；新加坡 Payment Services Act
              则围绕牌照、行为规范、审计、调查和紧急权力搭建。法律风险又叠在监管栈上。Xendit
              的隐私政策明确允许跨境数据传输，并提示境外法院、监管机构和安全机关可能访问已转移数据。合同把禁止交易定义得很宽，也把争议、退款和资金冻结机制中相当多的责任压到客户身上。因此，本章第一张风险表把监管负担视为速度、产品组合和现金流设计上的现实运营约束，而不是遥远的法律脚注。
