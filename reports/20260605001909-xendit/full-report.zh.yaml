      - CV046
      - CV050
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 会改变判断的条件
    rows:
      - - 投资逻辑
        - Xendit 的区域支付基础设施规模真实，本地支付通道价值主张够强，也受益于仍在加深的东南亚数字支付市场。
        - 经审计净收入、毛利和留存证据，会增强支付溢价的理由。
      - - 反向逻辑
        - 公开经济性仍不透明，监管和实体复杂性真实存在；相较于高溢价的软件式基础设施，可靠性或安全信号仍足以支持折价。
        - 更低价格、更干净股权结构表，以及资金管理或融资相邻业务资本占用轻的证据，会缩小折扣。
    notes: 反向逻辑针对的是证据质量和下行保护，不是否认 Xendit 是有分量的区域平台。
    claimRefs:
