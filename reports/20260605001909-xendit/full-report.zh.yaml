      - number: '2.2'
        title: 规模测算视角与这个市场为何此时出现
        blocks:
          - type: paragraph
            body: >-
              Xendit 的公开市场规模必须用多个视角测算，因为没有单一已发布估算能干净对应东南亚 B2B 支付基础设施收入。最宽的资金流视角来自 e-Conomy SEA：东南亚数字经济 2025 年 GMV 有望超过
              US$300 billion，仅电商就达到 US$185 billion。更窄、面向未来的商业视角来自 2C2P 和 Antom 委托 IDC 撰写的信息简报，预计本地区电商市场到 2029 年将达到
              US$289.8 billion，并称届时 97% 的电商支付将是数字支付。Fintech News Singapore 引用的 IDC 支付采用视角预计，区域数字支付市场将从 2023 年 US$120
              billion 增至 2028 年 US$306 billion。这些框架有用但并不相同：有些描述商业流量，有些描述支付方式组合，没有一个直接披露 Xendit 这类 PSP 可触达的抽佣池。因此最干净的 SAM
              逻辑，应聚焦 Xendit 已服务市场里的商户和平台支付流，而不是泛化的东南亚 TAM。SOM 更难隔离，因为公开来源只支持代理性牵引信号，例如 Xendit 服务超过 10,000
              家企业和数千商户，而不是按国家披露产品级 TPV 或货币化。
