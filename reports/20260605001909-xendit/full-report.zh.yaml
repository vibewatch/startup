              的牌照页面和登记类来源也支持其在印度尼西亚、菲律宾和新加坡拥有真实受监管运营版图，这一点很重要，因为多实体支付业务承担的合规和运营开销，简单软件公司不会承担。缺失的是当前时点的真实资产负债表：已审阅公开来源没有披露当前现金、烧钱速度、现金跑道、债务额度、仓储额度或储备结构。即便是
