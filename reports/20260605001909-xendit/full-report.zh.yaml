      - number: '5.2'
        title: 平台与运营架构
        blocks:
          - type: paragraph
            body: >-
              最重要的架构含义是，Xendit 不只是暴露支付受理端点；它暴露的是一个用于渠道激活、异步事件处理和多方资金隔离的控制平面。xenPlatform 文档显示，平台有主账户和子账户结构，包含 Owned 与
              Managed 两种变体，可通过仪表盘或 API
              入驻，并支持主密钥在余额之间即时转账。这让它面向市场、分支机构或类加盟运营的平台故事更可信，但也说明系统继承了国家和实体限制，而不是把它们完全抽象掉。跨境文档强化了同一点：Xendit
              可以编排发送方和接收方入驻、付款覆盖查询和实时状态更新，但汇款牌照仍限制谁能使用产品。Global Account beta 增加了更干净的多币种抽象，使用一个仪表盘和 API
              密钥，但公开证据仍没有触及底层处理蓝图。没有公开披露核心账本设计、云区域拓扑、故障切换、欺诈损失控制或服务等级承诺，无法让投资人仅凭文件承销韧性。
