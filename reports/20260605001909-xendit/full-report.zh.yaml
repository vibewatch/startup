      - number: '6.2'
        title: 具名客户与量化结果
        blocks:
          - type: paragraph
            body: >
              Xendit 最有说服力的公开证据不是标识墙，而是一组具名客户故事：它们先描述具体工作流，再把工作流与可衡量变化连接起来。VCGamers 称夜间支付成功率从 80% 提升到超过 95%，电子钱包和 QRIS
              量也上升。tiket.com 称在抢票战期间承受最高 17x 交易激增，同时保持支付表现稳定。Sahid Hotels 描述了覆盖 26 家物业的上线，提高了直接预订能力并集中化报表。Qoala
              称理赔和激励处理快了 86%，Nanovest 称充值失败率下降且满意度分数提升，Dijiwa 称结算快了 90% 且月交易量提高，Bakmi GM 称外卖订单处理速度翻倍，同时每天节省 18
              man-hours。这些都是生产使用的有意义证明。但它们没有证明整个组合的续约质量或钱包份额深度。显示一个客户成功使用 Xendit 的案例研究强于标识，但仍不揭示合同期限、抽佣率，或客户是否多年扩张。
