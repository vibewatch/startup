        - label: 经济性可见度
          value: 3
        - label: 监管复杂度
          value: 4
        - label: 当前估值吸引力
          value: 4
    approximationNotes: 分数是基于保留证据归纳的 0–10 序位尽调判断，不是管理层提供的 KPI。
