        - 确认哪些本地支付轨道为 Xendit 带来最高 TPV 和最佳单位经济性
      - - 企业转向 API 优先
        - 正向
        - 当前
        - 商户越来越偏好一套 API，抽象掉跨市场的本地支付方式、结算规则和付款
        - 要求提供相对本地银行集成或自建方案的胜率和迁移案例
      - - 跨境本币连通
        - 正向
        - 中期
        - 零售和 SME 跨境用例受益于 QR 联通和 Project Nexus 式互通
        - 检验 Xendit 跨境产品能否在旅游和长尾 SME 流量之外变现
      - - 按国家和支付方式碎片化的监管
        - 负向
        - 持续
        - 不同牌照、资金流模型、开通路径和合规制度让运营成本居高不下
        - 要求提供合规路线图，以及逐国牌照或合作伙伴依赖
      - - 欺诈、诈骗风险和信任要求
        - 负向
        - 持续
        - 数字支付规模扩大后，诈骗响应、可靠性和用户信任会成为核心市场要求，而不是附加项
        - 索取欺诈损失指标、宕机历史，以及按支付轨道拆分的合作伙伴集中度
      - - 跨境批发端滞后
