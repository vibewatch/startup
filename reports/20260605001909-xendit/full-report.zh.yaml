        - 公开记录缺少头部客户、头部合作伙伴和头部支付通道敞口报告
        - 高
        - 高
        - 把集中度看板和董事会级风险审查制度化
        - 索取前 10 大商户占比、头部支付通道占比和毛利集中度
    notes: 本表打分的是执行与治理可见度，不是评价单个高管；核心问题是组织厚度能否匹配路线图规模。
