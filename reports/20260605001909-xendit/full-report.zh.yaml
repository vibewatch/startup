        - id: missing_take_rate
          label: 缺少抽成率和毛利率
          detail: 没有公开桥梁把 TPV 接到收入或毛利润。
        - id: missing_sales_efficiency
          label: 缺少 CAC / 回本周期 / NRR
          detail: 没有公开证据能证明真实 GTM 效率。
        - id: underwriting_limit
          label: 承销边界
          detail: 规模可见，但单位经济大多仍不透明。
      edges:
        - from: tpv
          to: derived
          label: 交易量锚点
        - from: txns
          to: derived
          label: 客单价代理
        - from: merchants
          to: derived
          label: 商户规模代理
        - from: derived
          to: missing_take_rate
          label: 仍没有收入桥
        - from: derived
