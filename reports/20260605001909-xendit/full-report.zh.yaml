  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场结构与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Xendit 的竞争对手不是一张整齐的结账组件名单。真实替代方案分成四类：Xendit 和 2C2P by Antom
              这类区域编排商；DOKU、Midtrans、Dragonpay、PayMongo、Billplz 或 Curlec、Omise 等具备国家深度的本地冠军；Stripe、Adyen、Checkout.com 和
              Airwallex 等全球 PSP 或跨境进入者；以及大型商户内部拼接多个本地 PSP 和支付轨道连接的替代路径。2026 年公开证据异常一致地显示，东南亚仍然结构性碎片化。IMF
              描述了国内和跨境数字支付进展，但也把政策、连接和互操作性视为未完成工作。Stripe 的 APAC 指南另称，本地区仍被基础设施、欺诈和监管割裂。Fintech News 的 2026
              年国家回顾把后果说得更具体：新加坡依赖 PayNow 和钱包，马来西亚依赖 DuitNow 和 FPX，菲律宾依赖 GCash、Maya 和 QR Ph，印度尼西亚依赖 BI-FAST 和 QRIS，泰国依赖
              PromptPay，越南依赖 VietQR 和本地钱包。如此多样性让整个地区出现赢家通吃的可能性很低。因此竞争问题是：谁能为特定商户细分和工作流最好地抽象本地复杂度。
