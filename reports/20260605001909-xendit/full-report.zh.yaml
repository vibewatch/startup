      - number: '2.4'
        title: 结构性驱动、壁垒与时间点
        blocks:
          - type: paragraph
            body: >-
              这个市场此时成立，是因为几个区域条件同时成熟。数字商业已经大到足以重要，数字支付渗透也不再只是理论：e-Conomy SEA 称超过 60% 的支付已是数字支付，本地轨道统计也显示国家级真实使用。印度尼西亚
              QRIS 用户达到 57 million，跨境 QR 链接已覆盖泰国、马来西亚、新加坡和日本；泰国 PromptPay 仅 2026 年 3 月就处理约 2.54 billion 笔、价值 THB4.95
              trillion 的交易；马来西亚 PayNet 在 2025 年处理 8.44 billion 笔数字交易，并把 DuitNow QR 扩展到超过 3 million 个触点；BSP
              称数字支付已占菲律宾零售支付量的 57.4%。这些驱动提高了 PSP 和付款基础设施需求，但没有消除复杂度。每个市场仍有不同的偏好方式、激活规则、退款窗口、资金流模型和合规预期。BIS 与 AMRO
              都强调，除最佳零售走廊外，跨境支付仍然慢、贵或不透明，互操作性、API
              标准、法律改革和非银行机构更广准入仍未完成。交易量扩大后，欺诈、诈骗响应和运营韧性也更重要，使信任、可靠性和本地监管执行成为市场结构的核心，而不是次要产品功能。
