      - number: '7.3'
        title: 伙伴依赖、竞争与利润率压力
        blocks:
          - type: paragraph
            body: >-
              Xendit 的护城河和依赖风险是一回事：深度本地化。公司材料称，它靠直接接入印尼、菲律宾、泰国、马来西亚和越南的本地支付方式取胜。本地化在战略上有价值，因为商户确实需要一个 API
              接通碎片化的东南亚支付轨道。但这也意味着 Xendit 依赖一长串银行、钱包伙伴、直接扣款方案、OTC 网络和清算机构；这些伙伴一出问题，状态页事件立刻显现。竞争格局把经济压力讲得更清楚。Xendit 自己的
              Singapore 对比页试图把产品放到 Stripe、Adyen、Airwallex 和 HitPay 对面；即便在这种自写框架里，市场也明显对价格和工作流敏感：HitPay 在 PayNow
              上更便宜，Stripe 收 3.4% 外加固定费用和明确争议费，Adyen 推方法专属和 Interchange++ 计价，Airwallex 则从资金管理和 FX 侧竞争，而不只拼网关价格。这些并不能证明
              Xendit
              守不住利润率，但足以说明公司不能只靠简单收单。它必须持续赢在本地深度、平台工作流和增值运营上，同时避免准备金、争议、退款和打款摩擦——客户已经学会主动追问这些问题。公开记录没有披露头部伙伴或头部商户集中度，投资人仍无法判断这套依赖栈到底有多分散。
