              - CU035
              - CU036
              - CU037
              - CU044
      - number: '6.5'
        title: 客户风险与注意事项
        blocks:
          - type: paragraph
            body: >
              主要客户风险不是缺乏采用，而是缺乏关于采用质量的透明度。若干大品牌标识已公开具名，但部分最大品牌仍处在最弱证明层级：公开材料确认 Xendit
              触达支付流，却没有讲清范围、合同期限或当前支出。这很重要，因为集中度风险仍未披露。第二个风险是信任和支持。Trustpilot 评论包含关于商户激活、机器人式支持和无法处理支付的投诉，即便较弱的 Knoji
              信号也在客户服务上指向同一方向。第三个风险是可靠性。公开事故追踪器记录了 2026 年 5 月间歇性仪表盘故障，以及 2026 年 6
              月影响菲律宾虚拟账户银行转账组件的部分中断。这些事故不会否定许多正面案例研究，但确实说明客户购买支付基础设施时看重信任和连续性，不只是功能宽度。因此，客户结论在真实部署证明和细分覆盖宽度上为正面，但在耐久性和集中度上仍需谨慎，因为公开记录经过策划且不完整。
