        - label: 产品编排层
          detail: API 和看板控制提供收款、付款、订阅、平台账户和跨境资金流。
        - label: 异步控制平面
          detail: Webhook 事件、重复处理、callback-token 校验、重试和状态视图， 用来同步异步状态变化。
