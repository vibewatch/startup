        title: 市场顺风和本地监管深度足以支撑兴趣，但不能给出软件式确定性
        blocks:
          - type: paragraph
            body: >-
              Xendit 的溢价逻辑并非凭空想象。Bain、Temasek 和 Google 认为，东南亚数字经济 GMV 到 2025 年应超过 US$300 billion，收入达到 US$135
              billion；数字金融服务吸走约一半私人融资。同一组来源还指出，ASEAN-10 国家现在都有全国 QR 支付轨道，其中 8 个已经实现跨境 QR 互通；Worldpay 的 2026
              区域支付摘要显示，在新加坡、印尼、泰国、马来西亚、菲律宾和越南，钱包和账户到账户支付轨道正在变成默认行为。这个背景契合 Xendit
              的产品叙事：一次集成接入碎片化本地方式，再加上资金管理、卡、融资和多账户运营等邻近产品。但同一证据也要求纪律。牌照页、新加坡实体登记、印尼登记和 BSP 运营商名单显示，Xendit
              的多实体法律足迹更像受监管支付基础设施，而不是纯 SaaS。这带来护城河和战略可选性，也带来合规、运营以及潜在资本问题；公开来源还没有完全回答。
