      - number: '3.3'
        title: 企业端和全球进入者压力
        blocks:
          - type: paragraph
            body: >-
              Xendit 最大的高端市场压力来自 2C2P by Antom，以及全球 PSP 或跨境玩家。2C2P 是最清晰的区域企业对标，因为其自有材料和 2026
              年独立报道都指向东南亚一站式集成编排，加上更大的航空公司和企业密度：每日数百万笔交易、400+ 种支付方式、150+ 种货币、600,000 个受理点和 25+ 家航空公司。PACO 也暗示 2C2P
              在旅游和企业路由上的专精程度，比 Xendit 公开证明得更深。全球进入者则从另一个角度进攻。Stripe 和 Checkout.com 推广单一 API 接入广泛本地支付方式，Adyen
              把话术延伸到支付、资金管理和付款，Airwallex 则叠加以资金管理为先的层，包括多币种账户、FX、同币种结算和全球付款。对重心在全球 SaaS、市场跨境流或企业资金管理控制的商户来说，这些栈可能比
              Xendit 更强。因此 Xendit 位于一个更窄但仍有价值的中间地带：在东南亚比全球 PSP 更本地化，但在跨境企业编排上不如 2C2P by Antom 有规模。
