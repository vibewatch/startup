      - number: '6.3'
        title: 留存、耐久性与扩张
        blocks:
          - type: paragraph
            body: >
              Xendit 有公开留存证据，但很薄，且集中在具体客户。最清楚的案例级耐久性信号是 IFG Life 称自动借记让留存翻倍；这在方向上重要，因为它说明支付自动化可在保险场景影响续约行为。Tinvio
              还提供了另一个有用数据点：声称在印度尼西亚月度 TPV 留存超过 80%，同时月复合增长 50%+。Papaya Tree Farms 和 BPJAMSOSTEK
              也定性强化了同一模式：循环收款和直接借记设置似乎能改善重复行为并减少漏付。即便如此，这些证明都不应被过度解读。IFG Life 没有披露起始留存率或队列窗口；Tinvio 的 >80% 数字是客户特定 TPV
              留存代理，而非披露的 Xendit 组合指标；BPJAMSOSTEK 的自动借记激活显示采用，而非长期续约。在更广客户基础上，Xendit 没有公开披露
              NRR、GRR、流失、合同期限、队列留存或最大客户集中度。最安全的读法是，Xendit 的工作流看起来能够嵌入客户运营并变得有粘性，但公开证据仍不足以承销整个组合的耐久性。
