            body: >-
              公开材料显示 Xendit 采用混合型 GTM。Xendit 明显用一个 API、插件、支付链接和免费开始叙事吸引初创公司和 SME，但其激活文档显示，部分渠道需要额外材料、仪表盘工作流、联系客服，甚至
              UAT。这指向面向更复杂商户和平台的实质销售、入驻和服务层。规模锚点确实存在：Xendit 2024 年泰国公告称，2023 年交易量超过 320 million 笔、TPV 达 $25 billion、商户数
