chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品模式与版图
        blocks:
          - type: paragraph
            body: >-
              Xendit 官方材料和 Y Combinator 给出的身份一致：Xendit 是一家 2015 年创立的私人支付基础设施公司，帮助企业在东南亚收付款。最稳妥的一句话描述应比“支付网关”更宽。Xendit
              主页、YC
              档案、产品页和区域法律产品条款合在一起，显示出一套覆盖收款、结算、付款、直接借记、电子钱包、银行卡、虚拟账户、柜台支付、订阅和跨境工作流的栈，而不是单一结账组件。主页称企业可在印度尼西亚、菲律宾、马来西亚、泰国、越南、新加坡和香港使用
              100+ 种支付方式，官方法律条款则解释了聚合商和切换商两种结算方式。两者合在一起，支撑将 Xendit 视为后期区域支付基础设施，而非狭义
              PSP。限制在于，公开披露对版图和产品宽度的证明强于对经济性的证明：已留存来源描述了融资、资金管理和跨境能力，但没有给出经审计的收入、利润率或现金消耗数据。
