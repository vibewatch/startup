  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合与证明层级
        blocks:
          - type: paragraph
            body: >
              Xendit 的公开客户证据支持一个真正混合的客户基础，而不是单一狭窄买方队列。当前客户页面明确把客户分成电商、平台和市场、游戏、保险、旅行等类别，同时声称服务范围从 IG
              商户和线上企业到大型企业。这一宽覆盖又被一长串具名案例研究交叉验证，这些案例映射到不同买方和付款方结构：VCGamers、Tinvio 等市场，tiket.com、Sahid
              Hotels、Dijiwa、BookMyShow 等旅行和酒店企业，Qoala、IFG Life、BPJAMSOSTEK 等保险和公共利益收款流，以及 Nanovest、XL
              Axiata、StudioKado、Bakmi GM 等金融科技、电信、D2C 和线下餐饮工作流。关键尽调点是拆分证明质量。Traveloka、Lazada、Wawa Games、Pasarpolis 和
              Travelio 是当前客户页上的真实具名引用，但这些只是较轻的标识或用例证明。相比之下，VCGamers、tiket.com、Qoala、IFG Life 和 Tinvio
              的实施证明更有意义，因为它们的案例研究包含运营语境和可衡量结果。
