  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 公开锚点
      - 必须成立的条件
      - 估值区间
      - 概率信号
      - 决策含义
    rows:
      - - 乐观
        - 2024 TPV >US$32.5B、企业级路线图和区域市场增长，支撑可选性。
        - 尽调证明净收入稳稳高于 US$100M，毛利健康，集中度受控，且没有惩罚性股权结构表负担。
        - US$1.5B–2.0B
        - 15%–25%
        - 只有价格处于或低于区间低端，或证据集明显改善时，才值得看。
      - - 基准
        - 最后一个干净锚点是 2022 年 Series D 轮 / 独角兽时期，而公开支付可比公司大多落在约 1x 到 6x 收入之间。
        - 没有重大负面意外，但也没有经审计的上台阶证据；投资者继续因为经济性不透明而打折。
        - US$1.0B–1.5B
        - 50%–60%
        - 这是今天最站得住的公开证据区间，支持继续研究而不是买入。
      - - 悲观
        - 可比公司倍数压缩、价格发现偏弱，以及可见的监管或可用性复杂度，已存在于公开记录中。
        - 抽佣率、毛利、集中度或可靠性显著差于公开乐观派假设，或更低成交融资轮重置价格。
        - US$0.6B–1.0B
        - 25%–35%
        - 避免溢价入场，等待重置或更干净的经济性浮现。
    notes: 区间是情景带，不是点估计或 DCF 输出。它们来自最后一个干净融资锚点、公开可比公司的离散度，以及未解决的证据缺口。
    claimRefs:
      - CV037
      - CV040
      - CV041
      - CV042
      - CV043
      - CV047
      - CV048
      - CV049
      - CV050
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Adyen
        - 公开支付基础设施 / EV-revenue
        - ~7.2x EV/revenue；市值 ~US$34B
        - 可作为规模化、银行级、企业级处理商的溢价上限参考。
        - 盈利能力和机构化披露都远强于 Xendit。
      - - dLocal
        - 新兴市场支付 / EV-revenue
        - ~2.0x EV/revenue；市值 ~US$3.46B
        - 商业逻辑上最接近的公开新兴市场基础设施可比公司。
        - 跨境组合和全球商户画像不同于 Xendit 的本地支付通道集中度。
      - - Shift4
        - 商户收单 / EV-sales
        - 按来源口径不同，EV-sales 区间约 ~1.6x–3.4x
        - 可作为商户收单经济性的中段处理商参考。
        - 美国占比较高、杠杆和硬件敞口都明显不同。
      - - Marqeta
        - 支付 API / EV-sales
        - ~1.5x–1.6x EV / 销售额；EV ~US$1.0B
        - API 驱动平台参考，但经济性比溢价处理商更薄。
        - 发卡处理细分赛道窄于 Xendit 的收款 / 付款覆盖。
      - - PayPal
        - 规模化全球处理商 / EV-sales
        - ~1.2x EV / 销售额；EV ~US$40.04B
        - 说明即便支付量大且披露充分，也可能只按温和倍数交易。
        - 规模大得多，也更成熟、更多元。
      - - Block
        - 商户 + 生态支付 / EV-sales
        - ~1.6x–1.8x EV / 销售额；EV ~US$43B
        - 给可比组加入生态可选性和钱包敞口。
        - Cash App 和软件组合让它只是较松散的类比。
      - - Xendit（公开锚点）
        - 私募融资语境
        - 2022 年 Series D 轮 US$300M；独角兽时期估值语境；当前收入未解
        - 解释为什么今天宽情景带比精确点估值更稳妥。
        - 没有经审计的当前收入，没有新的新股融资轮，第三方估计也互相冲突。
    notes: 这是选择性可比组，覆盖最有决策价值的支付和基础设施参考，加上 Xendit 最后一个干净公开融资锚点；不是全球金融科技公司名单的穷尽宇宙。
    enumerationScope:
      coverage: partial
      basis: >-
        The table intentionally captures the most relevant public payment-infrastructure analogs and Xendit’s last clean
        funding anchor, but it excludes private comps without usable public metrics and many regional small caps.
    claimRefs:
      - CV011
      - CV012
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV037
      - CV040
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量不及预期
        - 经审计或管理层级净收入远低于约 US$100M，或扣除转付后的毛利明显弱于乐观情景所暗示的水平。
        - 基准区间失去支撑，溢价基础设施框架被打破。
        - 不要在悲观区间之上承保。
      - - 股权结构表负担比假设更重
        - 清算优先权、棘轮条款或转让限制实质性损害普通股经济性。
        - 表面估值不再代表新资金实际拥有的东西。
        - 暂停流程，直到清算瀑布经济性清楚。
      - - 可靠性或监管负担恶化
        - 核心市场出现重大反复故障，或有意义的新监管挫折。
        - 运营和合规成本一起上升，处理商溢价被压缩。
        - 从继续研究转向回避。
      - - 集中度被证明偏高
        - 少数商户、渠道或合作伙伴贡献了不成比例的毛利或损失风险。
        - 基础设施叙事比公开营销暗示的更窄、更脆弱。
        - 用更低倍数和更小上行情景重新定价。
      - - 资金管理或融资相邻业务资本占用高
        - 公司的非核心金融产品要靠大量资产负债表资本或准备金才能扩张。
        - 这门业务应采用低于轻资本基础设施平台的估值框架。
        - 施加资产负债表型金融科技折扣。
      - - 更弱市场成交价出现
        - 下调融资轮、疲弱要约或经验证的老股成交，明显低于基准情景中点。
        - 公开情景支撑下修，并确认 2021–2022 年估值标记过高。
        - 等待重置，不要摊入缺乏支撑的溢价。
    notes: 触发项围绕会改变估值的承保失败，而不是任何金融科技公司都有的普通运营风险。
    claimRefs:
      - CV030
      - CV031
      - CV039
      - CV043
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计收入桥
        - 当前经审计净收入、ARR 定义，以及从 TPV 到净收入的桥。
        - 真实净收入高于或低于当前第三方估计时，每个情景区间都会明显改变。
        - 索取 CFO 材料包、审计师审阅的桥，以及队列级收入定义。
      - - 毛利、抽佣率和准备金
        - 扣除合作伙伴转付后的毛利、准备金政策、拒付或损失率，以及任何受保护资金机制。
        - 这决定 Xendit 应该拿轻资本基础设施倍数，还是更低的风险调整框架。
        - 按支付通道、国家和商户队列索取单位经济性材料包。
      - - 集中度
        - 头部商户、合作伙伴、支付通道和行业集中度，以及按队列拆分的流失和 NRR。
        - 集中度意外压垮溢价的速度，会远快于收入增长救回溢价的速度。
        - 索取前 20 大商户和合作伙伴敞口，以及续约数据。
      - - 股权结构表和优先权
        - 清算优先权、棘轮条款、员工要约权、ROFR，以及此前融资轮的任何结构性权利。
        - 表面估值可能显著夸大普通股价值。
        - 审阅融资文件和清算瀑布分析。
      - - 监管资本和实体结构
        - 逐实体牌照、本地资本要求、受保护资金，以及任何待整改事项。
        - 护城河有一部分来自监管，但同一套监管栈也会吃掉利润率、拖慢扩张。
        - 索取法律实体图、审批文件和司法辖区备忘录。
      - - 资金管理和融资资本强度
        - 资金管理、卡、融资或提前结算产品的用途、利润率、资金来源和损失画像。
        - 相邻业务只有不把模型拖进重资产负债表经济性时，才支撑上行。
        - 索取产品族 P&L 和资金线。
      - - 当前市场成交价
        - 近期老股交易或基金估值标记的核验证据，包括方法论和转让机制。
        - 没有干净价格发现，建议就必须保持保守。
        - 索取要约数据、获批转让历史或基金估值标记文件。
    notes: 这些是从公开证据章节走向可投资承保判断所需的最低尽调项。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV044
      - CV047
      - CV048
      - CV049
      - CV050
