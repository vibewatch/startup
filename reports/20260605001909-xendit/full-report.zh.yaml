companyProfile:
  summary: >-
    Xendit 是一家 2015 年创立、以雅加达为中心的私人支付基础设施公司，帮助企业在东南亚接受支付、发放款项、运行订阅计费并管理结算，也已宣布向拉丁美洲扩张。公开材料支持几项判断：四位创始人仍构成领导核心，覆盖东南亚主要市场
    100 多种支付方式，运营规模真实存在——2021 年以来保持独角兽身份，2022 年完成 $300 million Series D，之后又出现 10,000 多家企业 / 客户、年度支付规模超过 $70 billion
    等公开信号。核心尽调问题不是 Xendit 是否构建出有意义的区域平台，而是当前收入质量、利润率、集中度、储备和股权结构条款，是否足够支撑明显高于独角兽底线的价格。
