          label: 仍没有 CAC 或留存桥
        - from: missing_take_rate
          to: underwriting_limit
          label: 利润率路径未知
        - from: missing_sales_efficiency
          to: underwriting_limit
          label: 资本效率未知
    approximationNotes: 只使用官方 TPV、交易和商户锚点，加上明确未知项； 不插入隐藏抽成率或利润率假设。
