      - number: '1.4'
        title: 里程碑、规模信号与反向运营证据
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Xendit 从一家创立于印度尼西亚的支付公司，走向更宽的区域基础设施平台，再进入早期全球扩张。官方来源和追踪平台支持一条路径：2015 年创立并获得 YC 时期种子支持，2020
              年扩张至菲律宾，2021 年完成 Series B 和 Series C 融资，2022 年围绕 Bank Sahabat Sampoerna 与 Dragonpay 做战略投资并完成 $300 million
              Series D，2023 年借 Payex 扩建马来西亚业务，2025–2026 年则在马来西亚规模化并推进拉丁美洲。官方 2025 年马来西亚材料称，已接入超过 4,500 家马来西亚企业、处理超过 RM5
              billion、可用性 99.5%、跨境交易同比增长 50%；ACV 和 Tech in Asia 称 Xendit 现在每年为超过 10,000 家客户处理超过 $70
              billion。上述数据是有用的规模信号，但更多由公司或合作伙伴传播放大，而不是审计数据。反向记录并非空白：Xendit 自己的状态页和独立故障追踪器显示，2025–2026 年产品和地区之间反复出现合作伙伴 /
              支付轨道中断；新闻室存档也单独警示有人冒用品牌诈骗。这些都不能证明系统性失败，但足以让运营韧性、合作伙伴集中度和信任控制成为后续章节的核心尽调主题。
