  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议仍是继续研究：规模真实，但公开价格支撑仍薄
        blocks:
          - type: paragraph
            body: >-
              公开证据让 Xendit 值得关注，但还不足以在溢价价格上干净买入。正向案例从规模开始：Xendit 称，2024 年处理超过 US$32.5 billion TPV，支持超过 10,000 家活跃商户和
              100,000+ 个子账户，并把 2026 年重点放在企业级扩张、跨境支付和合作伙伴。2024 年泰国扩张公告还提到超过 320 million 笔交易、US$25 billion 的 2023 TPV、超过
              6,000 家商户，以及交易量和活跃商户均增长 30%；TechCrunch 和 Pillsbury 也确认投资人已把公司融资推到 US$300 million Series D、累计融资 US$538
              million。这些都是区域基础设施故事的真实锚点。反向逻辑是，当前估值仍建立在很弱的公开价格发现上。已审阅来源没有给出经审计的当前收入、毛利、准备金经济性、集中度或股权条款；第三方数据库的收入估计分歧过大，更应视为不透明的证据，而不是经营表现的证据。真实规模、真实市场需求和薄弱当前经济披露叠在一起，建议因此保持继续研究，而不是买入。
