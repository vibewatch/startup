      - number: '8.4'
        title: 仍卡住承销的问题，以及什么会击穿投资逻辑
        blocks:
          - type: paragraph
            body: >-
              剩下的阻碍，正是金融科技里最快改变普通股回报的问题。公开材料没有从 TPV 到扣除伙伴转付后净收入的桥，没有披露毛利或准备金政策，没有商户或伙伴集中度数据，也看不到清算优先权、ratchet
              或老股转让限制。私募市场预览网站暗示有老股活动和股权结构字段，但可访问公开页面没有给出投资人需要的数字。与此同时，下行监控并非理论：StatusGator 显示可见事件，UpGuard 把 Xendit
              放在供应商风险界面上，多实体牌照足迹也意味着经常性合规成本。正确下一步不是直接否定公司，而是在管理层级证据到位前拒绝溢价承销。如果尽调证明净收入大致高于 US$100
              million、毛利健康、集中度受控、股权结构干净，且价格落在支付处理商估值区间中低端，判断可以转向观察。如果成交价格更弱、出现新的监管挫折，或可靠性和资本强度差于预期，投资逻辑应迅速压缩到悲观情景。
