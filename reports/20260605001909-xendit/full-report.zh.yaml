      - number: '6.4'
        title: 社会证明与自助服务入口
        blocks:
          - type: paragraph
            body: >
              在 Xendit 自有网站之外，外部社会证明范围已经足够重要，但也混杂到必须过滤。FeaturedCustomers 汇总 27 个案例研究、40 条推荐和 1,661 个引用评分，这是 Xendit
              拥有大量可引用用例库的有用证据。WordPress WooCommerce 插件列表显示 2,000+ 次安装，又增加了一个重要信号：Xendit 看起来有真实长尾商户分发入口，而不只是企业交易。FitGap 和
              SourceForge 也把产品定位为面向市场、电商和 SaaS 运营者的收款 / 付款 API
              层，与官方案例研究组合方向一致。但外部证明不能像直接案例研究那样干净对待。评论聚合器严谨度不一，客户样本往往很小，大量推荐并不揭示客户是否留下、扩张或流失。因此，这一外部层最好用来佐证 Xendit
              是一个同时覆盖企业和 SME 的真实生产平台，而不是替代管理层级留存或集中度数据。
            claimRefs:
              - CU005
              - CU009
