  - id: FI004
    title: 资本强度 / 现金流地图
    type: flow
    layout: wide
    summary: 历史股权融资可见，但当前现金是否充足， 取决于商户资金时点、合作方经济性、合规开销和未披露的资金管理敞口。
    data:
      nodes:
        - id: equity
          label: 历史股权资本
          detail: Series D 及此前轮次为扩张和邻近产品建设提供资金。
        - id: expansion
          label: 区域扩张和新产品
          detail: 泰国、马来西亚、越南，以及营运资金贷款等增值服务。
        - id: merchant_funds
          label: 商户资金时点
          detail: 聚合账户余额、切换器路由、提前结算和免费提现，都会塑造流动性需求。
        - id: ops_costs
          label: 合规和运营成本
          detail: 牌照、合作方管理、支持、拒付、争议和服务事故都会增加成本。
        - id: risk_events
          label: 宕机与安全风险面
          detail: 运营中断或安全问题会增加支持负担，并损害信任。
        - id: current_cash
          label: 当前现金和跑道
          detail: 未公开披露。
        - id: financing_dependency
          label: 融资依赖判断
          detail: 历史融资能力清楚，当前资金是否充足不清楚。
      edges:
        - from: equity
          to: expansion
          label: 资本为增长计划供血
        - from: expansion
          to: ops_costs
          label: 更多市场抬高合规和支持负荷
        - from: merchant_funds
          to: current_cash
          label: 时点和预先垫资影响流动性
        - from: ops_costs
          to: current_cash
          label: 无法公开判断烧钱速度
        - from: risk_events
          to: ops_costs
          label: 事故增加服务负担
        - from: current_cash
          to: financing_dependency
          label: 跑道仍未解决
        - from: equity
          to: financing_dependency
          label: 历史融资能力不能证明当前充足
