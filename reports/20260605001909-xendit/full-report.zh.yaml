  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流中的产品套件
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Xendit 拥有一套面向工作流的宽产品，而不是单一结账产品。Xendit 将自己呈现为区域支付基础设施层，服务从初创公司和 SME
              到更大平台的商户；公开产品材料显示，其在收款、付款、订阅、平台资金流转和较新的财务运营相邻产品上有真实宽度。收款侧，公司文档列出银行卡、虚拟账户、银行转账、直接借记、电子钱包、QR、柜台支付和先买后付，并带有明确的国家、货币和结算元数据。资金流出侧，Xendit
              同时记录供应商付款、工资等第一方付款，以及卖家提现、最后一公里跨境代发等第三方资金流。订阅看起来是真产品，不是营销外衣，因为文档暴露了调度器对象、计划创建、MIT 渠道前置条件和 webhook
              驱动确认。资金管理和费用管理页面把野心延伸到 PSP 工作流之外，但这些相邻产品在公开材料里的商业证据仍不足，因为采用率、余额和收入贡献没有披露。
