              等粗略代理，但公开单位经济性到此为止。没有已审阅官方来源披露抽佣率、毛利率、CAC、回本周期、NRR、损失率或集中度；第三方收入估算冲突剧烈，更适合作为不透明度证据，而不是业绩证据。
