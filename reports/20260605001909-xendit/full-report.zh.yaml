        title: 可靠性、安全与护城河边界
        blocks:
          - type: paragraph
            body: >-
              安全和可靠性信号存在，但在控制面强于深层基础设施。官方材料称 Xendit 是 PCI DSS Level 1，并描述 SSL 传输、AES-256 静态加密、callback-token
              校验和更广的开发者安全实践。牌照页面也暗示真实运营深度，因为 Xendit 在多个东南亚司法辖区列出支付、汇款、融资和支付系统许可。独立信号更复杂。UpGuard
              提供了有用的外部风险监控视角，但不能替代审计证据；StatusGator 则显示，2026 年 6 月 5
              日菲律宾虚拟账户银行转账组件出现部分中断。因此，公开护城河更像运营与区域护城河，而非纯技术护城河：本地支付方式覆盖、监管版图和平台资金流转工作流很难快速重建，而客户端 SDK
              层和大量可见接口逻辑更容易被同业复制。最大的剩余尽调问题不是 Xendit 是否有真实产品覆盖——它有——而是公开证据仍对核心架构、可靠性目标和损失控制披露严重不足。
