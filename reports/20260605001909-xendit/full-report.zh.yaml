      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Xendit 的领导层可见度异常集中在创始人身上。公司页面将 Moses Lo 列为创始人兼 CEO，突出 Bo Chen、Juan Gonzalez 和 Tessa Wijaya，Accel、Tracxn
              等第三方 / 合作伙伴来源也明确把四人全部列为创始人。与许多私人初创公司相比，这是一份更强的公开创始人记录，但外围治理信息很薄。已留存来源没有给出干净的现任董事会名单、委员会结构或投资人权利图，Wellfound
              主要强化团队宽度，而非正式治理。创始人之外的公开领导层深度，更多体现在 Jayson Poon 在马来西亚等具体市场角色，而不是完整披露的全球 C-suite
              梯队。因此尽调信号是混合的：创始人与市场的匹配度容易解释，因为同一批人仍锚定产品、运营和市场叙事；但关键人依赖也是真实风险，因为战略、声誉和区域扩张仍集中在小规模创始团队手中。公开数据质量也要谨慎处理：低质量档案和部分数据库在创始人身份、年龄、总部或创立年份上互相冲突，所以权威领导层事实应来自官方或投资人背书来源，而不是抓取型摘要。
