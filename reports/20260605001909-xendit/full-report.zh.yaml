      - number: '8.3'
        title: 公开可比公司给估值支撑划了比私营营销页更紧的边界
        blocks:
          - type: paragraph
            body: >-
              可比背景给 Xendit 可能获得多少溢价划出边界。Windsor Drake 称，支付公司在 M&A 中通常按约 4–6x 收入交易；只有收入质量、留存和监管定位异常强时，优质基础设施资产才会达到 10x
              或更高。公开可比公司也显示分化。截至 2026 年 6 月初，Multiples.vc 给 Adyen 的 EV/revenue 为 7.2x，但 dLocal 接近 2.0x，Shift4
              按来源口径不同落在低到中个位数区间，Marqeta 约 1.5x–1.6x，PayPal 约 1.2x，Block 约
              1.6x–1.8x。也就是说，可比市场确实会给有规模、资本轻、留存高的基础设施溢价，但不会无差别给。Xendit 很难干净放进溢价桶，因为公开收入估计互相矛盾：GetLatka 称其 2024 年收入为
              US$97.2 million、2021 年估值高达 US$2.7 billion；IncFact 只给出统计口径的 US$1–10 million
              区间，并明确说私营公司收入是模型估计。从这个缺口出发，最安全的桥是情景纪律，而不是假精确。仅凭公开证据，US$1.0–1.5 billion
              左右的基准情景，比显著高于最后一个干净独角兽锚点的价格更有防守性；更高的乐观情景需要尽调证明，总流水规模能转成可持续净收入和利润率。
