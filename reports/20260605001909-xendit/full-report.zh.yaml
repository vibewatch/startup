      - number: '3.4'
        title: 护城河、切换成本与可能的市场结局
        blocks:
          - type: paragraph
            body: >-
              Xendit 的护城河真实存在，但不是垄断型护城河。最强的可防守要素是区域抽象：一个集成即可在多个东南亚市场完成收款加付款，并由本地支付方式知识和平台工作流支撑，这些对初创公司、SME
              和扩张型商户很重要。因此切换成本不是主要来自银行卡处理代码，而是来自对账、付款运营、子商户或拆分资金流逻辑、伙伴入驻和合规设置。这有利于 Xendit，但也让大型商户多宿主变得理性，因为它们可以在 Xendit
              强的地方保留 Xendit，同时在其他替代方案明显更好的地方加入本地冠军或全球 PSP。公开记录显示两个弱点。第一，Xendit 自己的状态页显示，2026 年钱包、直接借记、虚拟账户和付款 /
              代发之间反复出现事故，使合作伙伴依赖风险仍然存在。第二，一项反向竞争对比认为，税务和多币种复杂度可能把跨境 SaaS 商户推向更全球化的替代方案。最可能的市场结局是持续碎片化：本地专精者守住本土市场深度，2C2P
              和全球玩家争夺更大企业账户，Xendit 则在商户需要东南亚区域运营商、而不是国内专精者或全球资金管理平台的场景里最强。
