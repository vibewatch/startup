        title: 直接区域与本地同业
        blocks:
          - type: paragraph
            body: >-
              面对东南亚直接同业时，商户若想要一个区域 API 覆盖本地支付方式加付款工作流，Xendit 的优势最明显。Xendit 主页和文档显示，其栈横跨 100+
              种支付方式、订阅、批量付款、自动付款、跨境工具和平台功能，覆盖七个具名亚洲市场。单一国家专精者较难匹配这种宽度。但本地冠军仍然重要，因为它们在本土市场看起来更深。DOKU 强调 45+ 种印度尼西亚方式、直接
              API 集成和国内银行付款。Midtrans 深耕 GoPay、QRIS、虚拟账户、银行卡、零售现金等印度尼西亚特定方式打包，入驻细节也呈现了激活本地轨道的现实。Dragonpay 仍是菲律宾专家，覆盖
              OTC、网银、钱包和付款；PayMongo 则用现代 API 优先型姿态，结合 QR Ph、钱包收款和平台资金拆分，服务超过 10,000 家企业。在马来西亚，Billplz 的计费 API，以及 Curlec
              的 FPX、DuitNow、循环和拆分结算工作流，说明本地银行转账和循环支付轨道并未完全商品化。Omise 仍可作为以泰国为根的 API 优先型支付和转账平台。净结果是：Xendit
              区域宽度更强，但当商户只关心单一国家时，本地专精者仍可能更深。
