  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 因素
      - 为何有利于 Xendit
      - 谁会进攻
      - 失守后的严重性
      - 尽调含义
    rows:
      - - 跨东南亚区域抽象
        - 一个运营方就能简化多条本地轨道和付款工作流
        - 本土市场的本地专家，以及服务跨境商户的全球 PSP
        - 高
        - 测算若商户把本地市场集成内建，会流失多少路由交易量
      - - 付款与平台工作流
        - 批量付款、自动付款，以及子商户 / 平台功能，会抬高运营粘性
        - Fazz、Dragonpay、PayMongo、Curlec、Airwallex 和 2C2P 都在争夺付款工作流
        - 高
        - 审查付款驱动的附加率、拆分流程使用率，以及按工作流划分的商户路由
      - - 开发者自助动线
        - 文档和 API 降低创业公司与区域 SMB 的采用摩擦
        - Stripe、PayMongo、Midtrans、Omise 和 Airwallex 也主打强开发者触点
        - 中
        - 按客群比较沙盒转化、实施时间和支持升级需求
      - - 本地监管与支付轨道认知
        - 支付方式、入驻和会员资格因国家而异，本地团队和本地轨道因此关键
        - DOKU、Midtrans、Dragonpay、Billplz 和 Curlec 在本土市场往往更深
        - 高
        - 要求按国家和支付方式提供本地牌照、会员资格和审批时长证据
      - - 企业级与跨境规模差距
        - 面向航空级编排或全球资金管理复杂度时，Xendit 并非明显最强的公开选择
        - Antom 旗下 2C2P，加上 Stripe、Adyen、Checkout.com 和 Airwallex
        - 高
        - 审查大客户赢单或输单原因，尤其是航空公司、市场平台和跨境 SaaS
      - - 合作伙伴依赖与可用性暴露
        - 商户靠 Xendit 屏蔽合作伙伴复杂度，因此事故会快速侵蚀信任
        - 任何冗余更强或拥有直接收单能力的竞争者，都能利用宕机窗口
        - 中至高
        - 审计 2026 年事故根因、备用路由，以及按支付轨道划分的合作伙伴集中度
      - - 市场碎片化与多家接入
        - 碎片化限制垄断力，但也让 Xendit 能与备用 PSP 共存
        - 商户可以保留 Xendit，同时把特定路由迁到本地或全球替代方
        - 中
        - 询问管理层：头部商户多家接入已有多普遍，仍以 Xendit 为主路由的交易量占比是多少
    notes: 本登记表是定性且有证据支撑的，不是概率模型。它旨在把耐久优势与当前公开记录中可见的风险区分开。
