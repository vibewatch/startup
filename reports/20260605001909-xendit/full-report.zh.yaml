  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Xendit 的货币化更偏交易费优先，而不是经典已披露 SaaS ARR 栈。Xendit
              定价页、帮助中心和主页反复表示，商户可以免费开始，交易成功时才收费；各国表格显示，定价会随支付轨道、地理位置、商户类别和结算模式而变。仅印度尼西亚就混合了固定虚拟账户费、按比例收取的银行卡
              MDR、随商户类型变化的钱包特定 MDR、QRIS 定价、先买后付按比例收费和固定付款费。马来西亚增加了可见的订阅项目、支付终端硬件费和 DuitNow 付款定价；xenPlatform
              文档又叠加月活跃子账户费和内部转账费。这足以证明公司能从多种商户工作流货币化，但不足以计算实际抽佣率，因为官方页面也称部分产品和通知会单独收费，定价还会随使用量变化。因此，可观察定价在列表费层面很强，但收入结构、折扣和净经济性仍是推断，而非披露。
