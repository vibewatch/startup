        - 持续
        - 零售连通改善快于批发结算，因此企业级资金管理和付款工作流仍面临延迟和不透明
        - 追问 Xendit 技术栈内有多少跨境结算和 FX 仍靠人工或合作伙伴
    notes: 驱动因素和约束按采用时间排序。同一趋势可能帮助收款，却仍留下付款、FX 或合规复杂度，因此市场结构 依然有利于基础设施供应商。
