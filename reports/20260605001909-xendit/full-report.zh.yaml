      - number: '7.4'
        title: 人才、集中度与扩张执行风险
        blocks:
          - type: paragraph
            body: >-
              Xendit 的公开故事已经大到值得认真看，但在投资人最需要下行细节的地方仍然不透明。CRO 任命信息称，Xendit 2024 年处理超过 US$32.5 billion TPV，服务超过 10,000
              家商户和 100,000+ 个子账户；2026
              路线图面向企业级扩张、跨境支付和生态伙伴。这些是规模信号，也把执行门槛抬高了。更深地卖给大企业、进入更多司法辖区，需要法律实体、合规、支持、结算和支付网络连接都具备运营纪律。公开管理层能见度仍然相对窄：Moses
              Lo 仍是保留记录中最显眼的高管，CRO
              加入扩充了商业深度，但公开材料没有回答班底厚度或继任问题。集中度风险也披露不足。规模口径无法说明收入有多少依赖少数大商户、行业或本地支付轨道，也看不出一个主要伙伴能制造多少宕机或准备金压力。人才风险和集中度风险因此应放在同一节：缺失变量是
              Xendit 是否已经有足够制度化深度，能管理一个更大、更受监管、更偏企业客户的运营模型，而不是继续过度依赖少数高管、商户或交易对手。
