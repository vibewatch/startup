  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管 / 牌照负担
        - 审批或支付网络准入延误
        - 现有或拟进入市场出现重大延误、获批资格丧失或监管谴责
        - 暂停承保扩张主张，直到法律实体和审批路径重新校准
      - - 运营可靠性
        - 单一支付通道事故频率
        - 核心支付方式每周反复出现合作伙伴端中断，或影响商户的事件后没有可信复盘
        - 把可靠性视为结构性问题而非短期波动；下调增长和留存假设
      - - 欺诈 / 安全
        - 欺诈损失或控制失效证据
        - 重大凭证滥用、webhook 漏洞利用、认证失效，或欺诈损失阶跃式上升
        - 上调风险评级；增加敞口前要求正式控制审查
      - - 支持 / 入驻
        - 激活和投诉趋势
        - 验证负担上升时，商户被拒、未解决投诉或支持积压仍处高位
        - 下调 SME 转化假设，并要求服务运营计划
      - - 利润率压力
        - 综合经济性恶化
        - 价格让步、准备金摩擦、FX 漏损或争议成本上升，却没有相应增购到增值产品
        - 压低抽佣率和估值假设
      - - 扩张执行
        - 国家上线效率
        - 定制配置、合作伙伴集成或本地审批反复比计划更久、成本更高
        - 要求按市场逐一约束 ROI，而不是只看区域 TAM 口径
      - - 集中度不透明
        - 管理层无法证明敞口
        - 尽调中拿不出头部商户、头部合作伙伴或头部支付通道集中度材料包
        - 在证伪前按高集中度处理，并保持保守仓位
    notes: 触发项刻意写成可观察的尽调事件，而不是抽象判断，便于在实时投资流程中监测。
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
      - CR047
      - CR048
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 关键驱动
      - 改变判断的条件
    rows:
      - - 建议
        - 继续研究
        - 公开证据显示规模真实，但价格支撑仍建立在经济性披露不完整之上。
        - 只有在审计或管理层级经济性数据到位、且入场价格克制时，才转向观察。
      - - 信心
        - 中
        - 市场增长、融资历史和经营规模主张可信，但当前收入质量还不可信。
        - 若披露经审计收入、毛利和股权结构表条款，可上调信心。
      - - 风险评级
        - 高
        - 多实体监管、合作伙伴端可靠性和不确定的单位经济性，都可能压缩股权投资逻辑。
        - 只有集中度、故障严重度、准备金或损失指标被记录清楚，风险才能下调。
      - - 估值立场
        - 偏高
        - 任何显著高于约 US$1.5 billion 的价格，都要求投资者为当前公开证据撑不起的部分买单。
        - 更低入场价格，或明显更强的经济性披露，会把立场推向合理。
      - - 决策含义
        - 等待尽调或更低成交价
        - 基准情景的公开证据支撑更接近 US$1.0–1.5 billion，而不是周期高点的溢价叙事。
        - 只有收入质量、优先权和集中度可承保时，才考虑行动。
    notes: 评估对价格敏感。本表总结的是公开证据今天能支撑什么，不是管理层未来可能在尽调中证明什么。
    claimRefs:
      - CV011
      - CV012
      - CV037
      - CV040
      - CV041
