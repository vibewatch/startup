  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的资金流
        blocks:
          - type: paragraph
            body: >-
              Xendit 的相关市场不是整个东南亚金融科技栈，也不只是结账组件品类。更合适的边界是 B2B 支付基础设施，服务那些需要在碎片化本地轨道上收款、对账、付款和结算的企业。Xendit
              自己的公开材料也一贯把公司放在这一基础设施层：目标客户包括初创公司和 SME、进入本地区的企业、电商卖家，以及需要子商户入驻、循环计费和付款的平台。因此纳入的支出包括线上支付受理、虚拟账户和银行转账收款、QR
              与钱包受理、用于循环支付的直接借记、退款和付款，以及商户仍需本地支付方式接入时的跨境结算或付款路由。排除的支出包括纯消费者钱包余额、从未触达数字轨道的国内现金交易，以及宽泛的消费金融或资金管理产品，除非公开来源显示它们对
              Xendit 核心栈具有商业实质。这个区分很重要，因为与估值相关的机会，是把逐国支付方式复杂度藏到商户身后的编排层，而不是 ASEAN 每一笔数字交易的全部 GMV。
