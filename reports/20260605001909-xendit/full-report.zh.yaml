      - number: '4.4'
        title: 收入质量、利润率路径与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的财务正面因素是定价透明：Xendit
              披露多个支付轨道和国家的列表费，因此收入机制可读。最强负面因素则是，公开记录仍未证明承销最关键的内容：当前收入、ARR、毛利率、烧钱速度、现金跑道、储备政策和客户集中度。区域条款显示，商户最终承担拒付和退款经济性，这能让
              Xendit 避开部分直接损失，但也暴露出围绕冻结、补偿和合作伙伴规则复杂度的运营负担。官方状态页和 StatusGator 显示，2026 年虚拟账户、直接借记和电子钱包组件反复中断；UpGuard
              则从外部提醒，安全和供应商风险状态仍是运营面的一部分。合在一起，公开证据支持 Xendit
              是一个真实、有规模、交易驱动的支付平台，具备多种货币化杠杆和历史上强劲的融资记录；但没有管理层数据，仍不能承销其当前收入质量或资本充足性。因此，融资依赖、利润率耐久性和现金跑道评估仍是活跃尽调阻塞点，而非已解决结论。
