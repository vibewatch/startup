      - number: '2.3'
        title: 买方、工作流与 Xendit 相关子赛道
        blocks:
          - type: paragraph
            body: >-
              这个市场里，买方并不总是最终用户，因此分层映射很关键。对线上卖家或 D2C
              商户来说，买方可能是创始人、支付负责人、财务负责人或产品经理，最终用户则是在结账页付款的消费者。对市场或平台来说，买方往往是平台运营或支付团队，既要收款，也要向卖家、司机、创作者或商户做下游付款。订阅或开票工作流里，预算负责人可能在财务或营收运营团队；直接借记重要，是因为工作流聚焦留存和收款，而非一次性结账转化。Xendit
              的产品材料能较好映射这些子赛道：线上支付使用支付方式和本地受理，工资、供应商或退款流程使用付款，银行转账收款和对账使用虚拟账户，循环扣款使用直接借记，本地
              QR、OTC、钱包和先买后付则帮助银行卡不占主导的市场提升转化。激活和结算层在不同方式之间并不统一；Xendit 文档显示，部分渠道因实体类型而异，需要额外材料或
              UAT，在结算时间、退款支持、商户发起交易、聚合商与切换商资金流上也不同。这正是支撑 API 优先型基础设施供应商存在的碎片化。
