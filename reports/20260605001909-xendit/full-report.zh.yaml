      - number: '7.2'
        title: 运营可靠性、欺诈与数据风险
        blocks:
          - type: paragraph
            body: >-
              Xendit 的公开运营记录说明，可靠性风险真实存在，即便事件通常集中在具体支付轨道，而不是整个平台宕掉。官方状态页和独立聚合器反复显示，虚拟账户、直接扣款、电子钱包和 OTC
              等方式在多个国家出现过伙伴端问题。菲律宾一次虚拟账户事件本身不会击穿投资逻辑，但这种模式值得关注，因为 Xendit
              卖给商户的是结账和资金管理关键流程里的信任。商户运营一旦依赖会异步失效的本地支付轨道，客户体验、退款和客服负荷会先恶化，远早于整个平台变黑。风险也延伸到欺诈和安全。Xendit 显然理解攻击面：文档覆盖
              2FA、细粒度权限、webhook 验证、安全 API key 管理、xenShield 欺诈控制、商户验证和 PCI 义务。这些都是有意义的缓释项，PCI
              证书也能让人相信卡业务由真实合规项目治理。但文档本身也给出警示：API key 暴露、webhook 管理不当、卡数据处理不合规和欺诈争议，都可能引发资金损失、监管和声誉事件。负面客户证据再添一层。保留下来的
              Trustpilot 样本很小、置信度不高，但投诉方向与开户摩擦和服务补救不佳一致。投资人正确的读法不是 Xendit 缺少控制，而是控制负担很高，并且必须随着一个已经可见的多支付轨道、多国家事件模式一起扩张。
