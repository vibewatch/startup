      - number: '1.3'
        title: 融资历史、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Xendit 历史里，融资形成过程是记录最完整的部分之一。官方 2022 年材料和 Tech in Asia 均显示，Coatue 与 Insight Partners 领投 $300 million
              Series D，使官方披露总额达到 $538 million；此前 2021 年 $150 million Series C 则被 DealStreetAsia 与独角兽身份联系起来。Tracxn
              进一步补充了早期轮次细节，包括 2021 年 3 月由 Accel 领投的 Series B，以及 YC 时期更早的种子融资；Accel 自己的被投企业页面也确认了 2015
              年初始投资年份和四位创始人组合。投资人结构在战略上有意义：YC 和 Accel 解释了早期风投背书，Tiger Global 标志着独角兽跃升，Coatue 加 Insight
              则传递出后期增长信心。同样重要的是仍未公开的部分。已留存来源没有显示债务额度、老股交易、董事会权利或清算优先权，2022 年之后追踪平台总额也与官方总额分歧。因此之后做估值时，可以把 Xendit
              的融资阶梯视为真实存在，但不能假设公开资本结构完整或已完全核对。
