  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 典型集成会从渠道激活推进到 API 对象创建、客户付款或出款动作、异步 webhook 处理和对账。
    data:
      nodes:
        - id: n1
          label: 入驻并激活渠道
          type: input
          detail: 商户验证实体信息，并启用所需的收款或出款通道；部分渠道还需要额外文件、联系支持或 UAT。
        - id: n2
          label: 配置 API 对象
          type: process
          detail: 商户通过控制台或 API 调用创建收款、出款、订阅或子账户对象。
        - id: n3
          label: 收款或发起出款
          type: process
          detail: 终端客户通过本地方式付款，或企业向收款人、员工、供应商或卖家打款。
        - id: n4
          label: 接收异步 webhook 更新
          type: process
          detail: 商户端点验证回调令牌、去重事件，并记录状态变化。
        - id: n5
          label: 结算、转账或对账余额
          type: process
          detail: 资金结算到账户，在主账户和子账户之间转移，或流经出款和余额流程。
        - id: n6
          label: 监控异常并重试
          type: output
          detail: 运营团队用状态视图、测试场景，以及手动或自动重试来处理失败。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: null
