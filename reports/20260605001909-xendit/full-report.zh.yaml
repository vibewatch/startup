  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Xendit 的相关性
    rows:
      - - 在线支付受理
        - 结账、支付链接、卡、钱包、QR、银行转账、OTC 支付、paylater 受理
        - 不与商户收款绑定的消费者钱包余额，从未触达数字支付轨道的线下现金
        - 商户或平台支付负责人；终端客户最终出资
        - 核心收款层，也是 Xendit 最清晰的收入池
      - - 虚拟账户和银行转账收款
        - 唯一支付识别码、便于对账的银行转账流程、本地银行支付轨道
        - 商户编排工作流之外的普通银行账户
        - 财务、运营或产品团队为基础设施付费；客户为交易出资
        - 在印尼和其他银行转账占比高、对账重要的市场很关键
      - - 付款 / 打款
        - 供应商付款、工资、退款、创作者或卖家打款、跨境最后一公里打款路由
        - 与支付运营无关的资金管理
        - 运营、财务、薪资或平台团队出预算；收款方收款
        - 是 Xendit 的重要切入口，因为发钱流程与结账是不同买方工作流
      - - 直接扣款和经常性收款
        - 订阅、发票和商户发起的本地银行支付轨道拉款
        - 在银行扣款无关市场里的传统纯卡经常性计费
        - 收入运营或财务拥有预算；终端用户授权账户扣款
        - 支持一次性结账之外的经常性收入和留存用例
      - - 平台 / 市场编排
        - 子商户入驻、收款加拆分或下游打款、平台对账
        - 没有资金流动的纯 SaaS 工作流工具
        - 平台产品、风险或支付团队出预算
        - 高价值细分，因为平台增加参与方和地理范围后，复杂度会叠加
      - - 跨境本地支付接入
        - 本地受理加本币结算、跨市场 QR 或打款连接
        - 批发代理行、单独的卡网络 FX、纯汇款消费应用
        - 区域扩张、财务或支付团队出预算
        - 对跨境商业很关键，但仍依赖国内支付方式集成和合规
      - - 嵌入式金融邻近业务
        - 资金管理、卡、融资和其他贴近支付栈销售的金融工作流
        - 没有公开支付基础设施关联的独立贷款或企业金融产品
