    "number": 5,
    "title": "Product & Technology",
    "summary": "Xendit has a genuinely broad public product surface spanning collections, payouts, subscriptions, platform money movement, and emerging treasury-style adjacencies, with one of the clearer developer surfaces among private Southeast Asian PSPs. The technical moat appears to come more from local-rail coverage, licensing, and platform workflows than from uniquely disclosed core infrastructure, because public evidence still stops short of deep architecture and reliability proof."
  },
  "sections": [
    {
      "id": "product-suite-in-customer-workflows",
      "title": "Product suite in customer workflows",
      "body": "Public evidence supports a broad, workflow-oriented suite rather than a single checkout product. Xendit presents itself as a regional payments infrastructure layer for merchants ranging from startups and SMEs to larger platforms, and its public product surfaces show real breadth in collections, payouts, subscriptions, platform money movement, and newer finance-operation adjacencies. On the collection side, the company documents cards, virtual accounts, bank transfers, direct debit, e-wallets, QR, over-the-counter, and paylater methods with explicit country, currency, and settlement metadata. On the money-out side, Xendit documents both first-party payouts such as vendor payments and payroll and third-party flows such as seller withdrawals and last-mile cross-border disbursements. Subscriptions appears to be a real product rather than marketing veneer because the docs expose scheduler objects, plan creation, MIT-channel prerequisites, and webhook-led confirmation. Treasury and expense-management pages extend the ambition beyond PSP workflows, but those adjacent products remain commercially under-evidenced in public materials because adoption, balances, and revenue contribution are not disclosed.",
