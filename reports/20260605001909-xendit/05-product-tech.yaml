    {
      "id": "developer-and-integration-posture",
      "title": "Developer and integration posture",
      "body": "Xendit’s developer posture is unusually legible for a private regional PSP. The company maintains a new docs surface with archived older references still visible, refreshed API pages in 2025-2026, concrete sandbox scenarios for payouts, and explicit webhook event catalogs for payments and payouts. The integration model is clearly asynchronous: merchants are expected to configure webhook URLs, validate x-callback-token headers, deduplicate events, respond quickly, and rely on retries and status views to converge state. The public tooling surface also appears broad. Xendit’s GitHub organization exposes multiple official SDK repositories, and public package pages show current Node, Python, Go, and Java distribution surfaces alongside a public Postman collection. That breadth lowers implementation friction and helps enterprise buyers believe the product is real across multiple engineering stacks. But it also means a lot of the visible engineering moat sits in interface quality and operational documentation rather than in private technical assets that are observable from public evidence.",
