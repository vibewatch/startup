evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and investor governance rights map for Xendit.
    whyItMatters: >-
      Without governance disclosure, it is hard to assess founder control, investor influence, and escalation paths for
      major strategic decisions.
    diligencePath: >-
      Request the latest board deck cover, board composition list, and cap-table summary directly from management or
      counsel.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: >-
      Any debt facilities, warehouse lines, secondary sales, or liquidation preference details attached to later funding
      rounds.
    whyItMatters: >-
      Later-stage investor rights and off-balance-sheet capital can materially change downside protection and effective
      valuation.
    diligencePath: Ask for round term sheets, debt schedules, and any secondary transaction summaries for 2021 onward.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single management-confirmed 2026 employee count and office footprint snapshot.
    whyItMatters: >-
      Public estimates range from exact counts to broad employee bands, making operating leverage and geography analysis
      noisy.
    diligencePath: Request current payroll headcount by country plus a current office and remote-work footprint list.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Current revenue, ARR, gross margin, take-rate, and burn or cash-runway disclosure.
    whyItMatters: >-
      The company appears scaled and well funded, but valuation and durability cannot be judged cleanly without
      economics.
    diligencePath: Request the last twelve months P&L, cohort or merchant economics, and current run-rate bridge from finance.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      A fuller dated chronology of internal product launches, governance changes, and market-entry execution that does
      not rely on public retrospectives.
    whyItMatters: >-
      The public milestone table is strong enough to ship, but a fuller internal chronology would improve causality and
      reduce dependence on tracker summaries.
    diligencePath: >-
      Request an internal company timeline or board-approved chronology covering launches, market entries, partnerships,
      and material incident responses.
    relatedQuestionRefs:
      - QO021
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: xendit-revenue-sam
    missingEvidence: >-
      Product-level TPV, take rate, gross margin, and country mix for Xendit's collections, payouts, direct debit, and
      cross-border products.
    whyItMatters: >-
      Without monetization and mix data, public flow-based TAM and SAM lenses cannot be converted into a precise revenue
      opportunity or defendable SOM by segment.
    diligencePath: >-
      Request management data room exports showing TPV, revenue, and gross profit by country, product line, and customer
      cohort for the last 24 months.
    relatedQuestionRefs:
      - QM024
      - QM028
  - type: missing-source
    severity: material
    topic: embedded-finance-materiality
    missingEvidence: >-
      Current adoption, revenue contribution, and customer overlap for treasury, cards, financing, and other
      business-operations adjacencies.
    whyItMatters: >-
      Adjacency can expand Xendit's valuation narrative, but without usage and revenue proof it should not be sized as
      core market today.
    diligencePath: >-
      Ask management for product attach rates, active users, balances, and revenue contribution for treasury, financing,
      and card products by market.
    relatedQuestionRefs:
      - QM023
      - QM028
  - type: missing-source
    severity: minor
    topic: country-split-traction
    missingEvidence: Public country-by-country merchant, TPV, and method-mix disclosure across Xendit's seven Asian markets.
    whyItMatters: >-
      Country-level demand is clearly real, but valuation and competitive work later in the report improve materially if
      the team can separate Indonesia from newer markets.
    diligencePath: >-
      Request a market scorecard with active merchants, TPV, acceptance-method share, payout volume, and net revenue by
      country for the latest quarter.
    relatedQuestionRefs:
      - QM024
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: >-
      Comparable public TPV, merchant counts, and country-level scope for smaller private PSPs, bank-owned processors,
      and less-visible local specialists not fully captured in the profile and capability tables.
    whyItMatters: >-
      Without cleaner public scale data, the landscape can rank breadth and posture, but not exact market-share
      ownership or the full long-tail of local incumbents.
    diligencePath: >-
      Request management’s live competitor list by country and segment, then ask for win-loss data, top local rivals,
      and share of merchant volume routed through secondary PSPs.
    relatedQuestionRefs:
      - QP001
      - QP023
      - QP026
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Executed fee schedules, MDRs, payout fees, FX markups, reserve terms, and volume discounts by country and payment
      method for Xendit and the major comparables.
    whyItMatters: >-
      Packaging is visible, but real pricing power determines unit economics, merchant switching incentives, and whether
      Xendit wins on cost or merely on integration convenience.
    diligencePath: >-
      Ask each party or management for current standard pricing cards, enterprise overrides, and anonymized top-20
      merchant pricing by market and workflow.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Merchant routing logic, multi-homing prevalence, churn reasons, and actual migration friction across collections,
      payouts, reconciliation, and compliance operations.
    whyItMatters: >-
      The public record proves broad workflow overlap, but it does not reveal how sticky Xendit is in practice once
      larger merchants already run more than one PSP.
    diligencePath: >-
      Interview lost and won merchants by segment, review renewal cohorts, and request routed-volume shares for
      merchants that keep Xendit alongside at least one alternative.
    relatedQuestionRefs:
      - QP016
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current consolidated revenue, ARR if applicable, and product or geography revenue mix for 2024-2026.
    whyItMatters: >-
      Without a current top-line anchor, valuation work and margin underwriting become guesswork even though pricing
      mechanics are visible.
    diligencePath: >-
      Request audited financial statements or management-certified monthly revenue packs plus a by-product, by-country
      revenue bridge.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net take rate, gross margin, CAC, payback, NRR, fraud loss rate, refund rate, and customer concentration metrics.
    whyItMatters: These are the core inputs for judging whether visible transaction growth converts into durable profitable growth.
    diligencePath: >-
      Request cohort dashboards, gross-to-net bridges, sales-efficiency metrics, and top-customer concentration reports
      by country and product.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt or credit facilities, reserve arrangements, and legal-entity
      capital requirements.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten from historical fundraising alone.
    diligencePath: >-
      Request latest board pack or treasury pack showing cash, burn, runway, debt schedule, reserve accounts, and
      entity-level capital obligations.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: adjacent-products
    missingEvidence: >-
      Customer counts, balances, revenue contribution, and country rollout detail for Global Treasury, Expense
      Management, and other treasury-style adjacencies.
    whyItMatters: >-
      Without adoption and monetization evidence, it is impossible to tell whether the adjacent products are meaningful
      wedge expanders or simply marketed extensions around the core payments stack.
    diligencePath: >-
      Request product KPI dashboards by adjacent module, including active customers, GPV or spend volume, balances where
      relevant, revenue contribution, and country-by-country activation status.
    relatedQuestionRefs:
      - QE016
    relatedTableRefs:
      - TE001
      - TE005
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Core processing architecture, cloud-region and failover design, RTO or RPO, fraud-loss and payout-failure metrics,
      latency percentiles, and contractual uptime commitments.
    whyItMatters: >-
      These are the inputs needed to judge whether public product breadth converts into resilient, defensible
      infrastructure rather than a well-documented but operationally opaque integration layer.
    diligencePath: >-
      Request architecture diagrams, incident-postmortem samples, SRE scorecards, fraud and payout-operating metrics,
      and standard customer SLA or MSA language for uptime and service credits.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE003
      - TE004
  - type: missing-source
    severity: material
    topic: portfolio-retention
    missingEvidence: Company-wide NRR, GRR, logo retention, churn, renewal timing, and contract duration by country and segment.
    whyItMatters: >-
      Case-study point metrics do not let an investor underwrite whether Xendit retains and expands its installed base
      at the portfolio level.
    diligencePath: >-
      Request cohort tables for top segments and the top 20 customers, including gross/logo churn and NRR for Indonesia
      and Philippines.
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-mix
    missingEvidence: >-
      Current active customer count, active merchants/accounts, and revenue or TPV split across SMEs, platforms, and
      enterprises.
    whyItMatters: >-
      Historical scale signals exist, but current customer-mix disclosure is needed to judge sales efficiency, segment
      resilience, and concentration.
    diligencePath: >-
      Ask management for current active-customer counts, monthly active merchant counts, TPV mix, and take-rate mix by
      segment and geography.
    relatedTableRefs:
      - TU001
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, top-10 customer TPV share, and sector concentration by TPV and net revenue.
    whyItMatters: >-
      Large-brand logos can hide material single-account exposure or a narrow sector mix that would matter in an
      investment committee downside case.
    diligencePath: >-
      Request top-customer concentration schedules and customer-level churn or downgrade history over the last 24
      months.
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Fresh customer-side or independent deployment writeups for Traveloka, Lazada, Grab, and other flagship logos.
    whyItMatters: >-
      Current public proof for several brand-name customers is logo-level and does not show production scope, spend,
      duration, or renewal.
    diligencePath: >-
      Ask Xendit for customer references or permissioned proof packs that show live scope, contract start date, payment
      methods used, and renewal status.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-coverage-gap
    missingEvidence: >-
      Direct regulator-by-regulator confirmation for each Indonesian entity Xendit lists under Bank Indonesia and OJK,
