    severity: minor
    topic: comparable-set-coverage
    missingEvidence: >-
      A fuller private-market comp set or direct Xendit revenue evidence to tighten the comparable table beyond public
      listed processors.
    whyItMatters: The public comp table is decision-useful, but a mixed public/private set would narrow the range materially.
    diligencePath: Add private transactions or management-supplied metrics before final IC valuation work.
    relatedQuestionRefs:
