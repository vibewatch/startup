    whyItMatters: Without a credible top-line anchor, scenario ranges become too sensitive to guesswork and comp selection.
    diligencePath: Request auditor-reviewed revenue bridge, revenue definitions, and cohort mix by market.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: >-
      Current liquidation preferences, participation, ratchets, ROFRs, transfer restrictions, and any structured rights
      from prior rounds.
    whyItMatters: Headline valuation can materially overstate what new common-equity capital really buys.
    diligencePath: Obtain financing documents, tender terms, and a common-equity waterfall model.
    relatedQuestionRefs:
      - QV026
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross profit after partner pass-through, reserve policy, loss rates, chargebacks, and safeguarded-funds
      requirements by rail and market.
    whyItMatters: >-
      This is the key evidence needed to decide whether Xendit deserves a capital-light processor premium or a
      lower-risk multiple.
    diligencePath: Request management operating pack by payment method, market, and merchant cohort.
    relatedQuestionRefs:
      - QV027
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-merchant, top-partner, and top-rail concentration with retention, NRR, and churn by cohort.
    whyItMatters: >-
      A regional infrastructure story can still be fragile if economics depend on a small set of merchants or
      counterparties.
    diligencePath: Request top-20 merchant and partner exposure, contract duration, and renewal data.
    relatedQuestionRefs:
      - QV028
  - type: private-evidence-only
    severity: material
    topic: price-discovery
    missingEvidence: Verified recent secondary clears or fund marks with methodology and transfer mechanics.
    whyItMatters: The recommendation stays conservative when no clean current market-clearing price is publicly observable.
    diligencePath: Request completed transfer history, fund-mark support, or approved tender documentation.
    relatedQuestionRefs:
      - QV002
      - QV030
