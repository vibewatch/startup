- id: operational-reliability-fraud-and-data
  title: Operational reliability, fraud, and data risk
  body: 'Xendit’s public operating record shows that reliability risk is real even if the incidents are usually rail-specific rather than platform-wide. The official status page and independent aggregators repeatedly show disruptions tied to partner-end issues across virtual accounts, direct debit, e-wallets, and over-the-counter methods in multiple countries. A single Philippines virtual-account incident is not thesis-breaking by itself, but the pattern matters because Xendit is selling trust into checkout and treasury-critical workflows. If merchant operations depend on local rails that fail asynchronously, then customer experience, refunds, and support load deteriorate long before the entire platform goes dark. The same section of risk extends into fraud and security. Xendit clearly understands the surface area: it documents 2FA, granular permissions, webhook verification, secure API-key handling, xenShield fraud controls, merchant verification, and PCI obligations. Those are meaningful
    mitigants, and the PCI certificate gives some comfort that card operations are governed by a real compliance program. But the documentation itself makes the cautionary point: exposed API keys, poor webhook hygiene, improper card-data handling, and fraud disputes can create money-loss, regulatory, and reputation events. Adverse customer evidence adds another layer. The retained Trustpilot surface is small and low-confidence, but the complaints are directionally consistent with onboarding friction and poor service recovery. The right investor read is therefore not that Xendit lacks controls; it is that the control burden is high and must scale with an incident pattern that is visibly multi-rail and multi-country.'
