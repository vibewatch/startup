- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / licensing burden
    - Approval or scheme-access slippage
    - Material delay, lost approval, or regulator censure in a current or launch market
    - Pause underwriting of expansion claims until legal-entity and approval path is re-baselined
  - - Operational reliability
    - Rail-specific incident cadence
    - Recurring weekly partner-end disruptions across core methods or no credible postmortems after merchant-impacting events
    - Treat reliability as structural, not transient; haircut growth and retention assumptions
  - - Fraud / security
    - Fraud-loss or control-slippage evidence
    - Major credential abuse, webhook exploit, lapsed certification, or step-change in fraud losses
    - Move risk rating higher and require formal control review before additional exposure
  - - Support / onboarding
    - Activation and complaint trend
    - Merchant rejection, unresolved complaints, or support backlog remains elevated while verification burden rises
    - Reduce SME conversion assumptions and demand service-ops plan
  - - Margin pressure
    - Blended economics deterioration
    - Pricing concessions, reserve friction, FX leakage, or dispute costs rise without matching upsell into value-added products
    - Compress take-rate and valuation assumptions
  - - Expansion execution
    - Country-launch efficiency
    - Tailored configurations, partner integrations, or local approvals repeatedly take longer or cost more than plan
    - Require market-by-market ROI discipline instead of headline regional TAM
  - - Concentration opacity
    - Management cannot document exposure
    - No top-merchant, top-partner, or top-rail concentration pack during diligence
    - Treat concentration as high until disproven and keep position size conservative
  notes: Triggers are intentionally phrased as observable diligence events rather than abstract judgments so they can be monitored in a live investment process.
