  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-coverage-gap
    missingEvidence: Direct regulator-by-regulator confirmation for each Indonesian entity Xendit lists under Bank Indonesia and OJK, plus any current approval conditions or remediation plans.
    whyItMatters: The top legal table is only partially corroborated from regulator-side materials, so entity-level approval drift could hide inside a disclosed but unverified structure.
    diligencePath: Request the legal-entity map, approval letters, renewal timetable, and external counsel memo covering each Indonesian entity and product line.
    relatedQuestionRefs:
    - QR001
    - QR020
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-concentration-gap
    missingEvidence: Top-bank, top-wallet, top-direct-debit, and top-OTC partner concentration by TPV, gross profit, and outage-weighted importance.
    whyItMatters: Xendit’s moat depends on local rails, but investors cannot score dependency risk without knowing whether a few partners dominate economics or reliability.
    diligencePath: Request partner concentration by market and method, with failover coverage and incident history by counterparty.
    relatedQuestionRefs:
    - QR014
    - QR025
    - QR026
  - type: private-evidence-only
    severity: material
    topic: outage-severity-gap
    missingEvidence: Incident counts by severity, merchant impact, SLA credits, lost TPV, and postmortems by payment method and market.
    whyItMatters: Public status surfaces show partner-end disruptions, but not whether those incidents are immaterial blips or merchant-material failures.
    diligencePath: Request the last twelve months of incident logs, severity taxonomy, TPV impact, and five example postmortems.
    relatedQuestionRefs:
    - QR009
    - QR021
    - QR027
  - type: missing-source
    severity: material
    topic: governance-depth-gap
    missingEvidence: Board composition, country leadership bench, succession plan, and second-line compliance or risk leadership depth.
    whyItMatters: The public record is founder-centric enough that investors cannot yet judge whether enterprise and multi-country execution is institutionally deep or still key-person dependent.
    diligencePath: Request board materials, executive org chart, succession coverage, and country compliance leads for each regulated market.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR028
  - type: private-evidence-only
    severity: material
    topic: expansion-roadmap-gap
    missingEvidence: Country-by-country launch plan with licensing path, local entity approach, partner prerequisites, and payback assumptions for each market entry.
    whyItMatters: Expansion risk is one of the chapter’s core uncertainties because scheme access, licensing, and tailored configurations appear market specific.
    diligencePath: Request the expansion model by country, including approvals needed, estimated cost, time to go live, and target contribution margin.
    relatedQuestionRefs:
    - QR024
    - QR029
