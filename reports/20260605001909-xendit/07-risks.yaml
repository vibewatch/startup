company:
  name: Xendit
chapter:
  number: 7
  title: Risks
  summary: 'Xendit’s risk profile is dominated by a multi-entity regulatory stack, visible partner-end reliability incidents across local rails, and rising competition that attacks blended payments economics rather than only headline MDR. The company has real mitigations—verification, fraud tooling, legal agreements, PCI controls, and deep regional integrations—but public disclosure remains weakest where investors most need comfort: concentration, outage severity, reserve policy, and leadership depth for cross-border expansion.'
sections:
- id: regulatory-and-legal-stack
  title: Regulatory and legal stack risk
  body: 'Xendit’s regulatory risk starts with structural complexity, not with a single known enforcement action. The company’s own licenses page says the group already spans multiple regulated entities in Indonesia and the Philippines, including Bank Indonesia payment-gateway and funds-transfer approvals, OJK-linked digital-finance, financing, and rural-bank entities, and BSP-registered OPS and remittance or virtual-asset permissions. That structure helps Xendit offer a wider product surface, but it also means regulatory change can hit several entities and business lines at once. The Philippines sources make the burden tangible: BSP’s OPS framework can cover payment gateways, can reach foreign providers serving Philippine customers, and expects regulated institutions to engage compliant OPS. Malaysia and Singapore reinforce the same pattern for future expansion. PayNet requires local incorporation, experience, equity, transaction volume, and BNM-regulated status before direct participation,
    while Singapore’s Payment Services Act is built around licensing, conduct, audit, investigations, and emergency powers. Legal risk compounds the regulatory stack. Xendit’s privacy policy explicitly allows cross-border data transfers and notes that foreign courts, regulators, and security authorities may access transferred data. Its contracts define prohibited transactions broadly and shift meaningful dispute, refund, and hold mechanics onto customers. The chapter’s first register therefore treats regulatory burden as a live operational constraint on speed, product mix, and cash-flow design rather than as a remote legal footnote.'
