evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited FY2024-FY2025 gross revenue, net revenue, take rate, and EBITDA margins for Flock Freight are not publicly
      reported.
    whyItMatters: >-
      Without financial disclosures, it is impossible to independently verify unit economics, gross margins, or burn
      rate.
    diligencePath: >-
      Request confidential audited income statements and management accounts under NDA during formal investment
      diligence.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: valuation-structure
    missingEvidence: >-
      The post-money valuation, share price, and liquidation preference seniority for the May 2025 Series E round were
      not disclosed.
    whyItMatters: Determines whether the 2025 recapitalization was a flat or down round relative to the 2021 $1.4B peak valuation.
    diligencePath: Examine Delaware corporate charter amendments and capitalization tables for Series E liquidation preferences.
    relatedQuestionRefs:
      - QO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: Complete list of independent and venture board directors following the Series E funding round.
    whyItMatters: Clarifies voting control between founder Oren Zaslansky, SoftBank, GLP, and Susquehanna.
    diligencePath: Obtain the certified board roster and voting agreements from company counsel.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor-cap-table
    missingEvidence: Complete cap table ownership percentages and secondary transactions among Seed through Series E investors.
    whyItMatters: Identifies whether early institutional investors experienced dilution or executed secondary liquidity.
    diligencePath: Request the detailed capitalization schedule and stock purchase agreement exhibits from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-revenue-recognition
    missingEvidence: Realized shipper pricing, discounts, accessorials, revenue mix, and gross-versus-net revenue-recognition policy.
    whyItMatters: List and marketing pricing do not establish recognized revenue, take rate, or revenue quality.
    diligencePath: >-
      Request customer invoices, carrier settlements, service-line revenue schedules, and the audited
      revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: financial-statements-and-unit-economics
    missingEvidence: >-
      Audited revenue, gross profit, operating expenses, CAC, payback, retention, customer concentration, and
      free-cash-flow history.
    whyItMatters: >-
      Qualitative margin language and operating proxies cannot establish profitability, sales efficiency, or durable
      unit economics.
    diligencePath: >-
      Request audited annual statements, current monthly management accounts, customer cohorts, and a
      shipment-to-gross-profit bridge.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash and restricted cash, monthly burn, runway, working-capital requirements, debt and guarantees,
      liquidation preferences, and next-round trigger.
    whyItMatters: >-
      Historical funding raised does not establish cash available or the company's ability to finance operations through
      a freight downturn.
    diligencePath: >-
      Request the latest balance sheet, 24-month cash forecast, debt schedule, capitalization table, Series E documents,
      and board financing plan.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table-coverage
    missingEvidence: >-
      Comprehensive census of enterprise production shippers and active motor carrier participants beyond sampled case
      studies.
    whyItMatters: >-
      Table TU003 relies on a selective sample of named customers and carriers; full account rosters are required to
      assess platform adoption breadth across diverse freight verticals.
    diligencePath: >-
      Request an anonymized or NDA-governed customer list categorized by annual freight spend, vertical industry, and
      lane volume.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and annual shipper churn rates across
      enterprise and mid-market customer segments.
    whyItMatters: >-
      Without retention disclosures, it is impossible to evaluate whether shippers continue booking shared truckloads
      across changing freight cycles or revert to standard TL/LTL brokers when spot rates drop.
    diligencePath: >-
      Request audited customer cohort retention metrics, gross retention percentages, and annual churn reports for
      FY2023 through FY2025 during formal private diligence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: >-
      Percentage of gross freight volume and net revenue generated by Flock Freight's top 5, top 10, and top 20
      enterprise shipper accounts.
    whyItMatters: >-
      High revenue concentration in a small number of enterprise accounts would present severe revenue volatility risk
      if an anchor retail customer renegotiated rates or defected.
    diligencePath: >-
      Obtain top customer revenue concentration schedules and customer lifetime value distributions under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: cargo-loss-rates
    missingEvidence: >-
      Audited annual cargo loss, freight damage, and unrecovered delay claim dollar figures across FlockDirect and
      standard shared truckload shipments.
    whyItMatters: >-
      Validating whether the company's sub-0.001% claim rate holds across high-velocity retail and multi-stop industrial
      freight cohorts without extensive unfiled claims.
    diligencePath: >-
      Review internal shipper dispute logs, loss ratio data from cargo excess insurers, and historical small-claims
      litigation records.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: financial-performance
    missingEvidence: Audited GAAP gross revenue, net revenue, gross margin %, and EBITDA figures for FY2024 and FY2025.
    whyItMatters: >-
      Without audited financial statements, investors cannot establish accurate valuation multiples or verify unit
      economics amidst the freight recession.
    diligencePath: >-
      Request audited GAAP financial statements, gross margin reconciliations, and quarterly cohort metrics directly
      from Flock Freight management.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Series E post-money valuation mark, liquidation preference seniority, and investor protective provisions.
    whyItMatters: >-
      Determines whether Series E investors hold senior liquidation preferences that subordinate common equity and
      earlier venture rounds in exit scenarios below $1.0 billion.
    diligencePath: >-
      Inspect Flock Freight's amended certificate of incorporation and investor rights agreement to analyze liquidation
      waterfall mechanics.
    relatedQuestionRefs:
      - QV006
