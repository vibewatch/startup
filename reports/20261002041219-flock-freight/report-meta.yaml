companyProfile:
  summary: >-
    Flock Freight is a late-stage private freight technology company that markets a Shared Truckload (STL) model to
    shippers and carriers. Founded in 2015 by Oren Zaslansky, the company is headquartered in Encinitas / Solana Beach,
    California, and positions its AI-powered pooling platform as a way to move partial freight without cross-docking
    while improving carrier utilization. The business has raised roughly $460 million across disclosed venture rounds,
    including a $60 million Series E in May 2025.
