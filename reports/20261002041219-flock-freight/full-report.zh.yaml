  - id: TP003
    title: 定价、包装与经济权衡对比
    columns:
      - 物流方案
      - 定价与结算机制
      - 承运商薪酬分配结构
      - 隐性与杂费附加费风险敞口
      - 商业权衡与尽调启示
    rows:
      - - Flock Freight (FlockDirect)
        - 按线性英尺与托盘计价（相比 FTL 约有 20% 折扣）
        - 基础干线运费 + 拼货补载分润；单趟收益最高提升 20%，增收 $0.20/英里
        - 多点提货/送货协同成本；压车滞留杂费（detention）
        - 货主享受到成本节约，但须承担多点经停带来的潜在在途时效波动
      - - Legacy LTL Carriers
        - 依据 NMFCA 货运等级、重量、密度及运输距离计费的综合费率表
        - 正式雇佣（W-2）/ 工会干线司机与专职转运码头装卸工人
        - 频繁产生复重费、品类重新划分费、各类杂费罚款
        - 1–2 块托盘初始费率较低，但超过 6 块托盘后费用急剧飙升
      - - Digital FTL Brokers
        - 动态现货市场整车运价或按既定线路协议定价
        - 依托数字竞价或直接派单模式，按单趟支付市场现货运价
        - 压车滞留费、压夜停留费（layover）、压车空跑补偿费（TONU）
        - 确保单点直达时效，但货主须为整车 100% 的车厢运力买单
      - - Traditional 3PLs
        - 合同成本加成或协商经纪毛利率（10%–18%）
        - 与承运商谈判底价并赚取中介服务差价
        - 管理费、燃油附加费、旺季作业附加费
        - 具备全运输方式的综合服务能力，但几乎不具备自研算法拼车能力
    notes: 数据综合自 Flock Freight 官方承运商介绍及新闻稿，并与北美货运经纪及 LTL 标准商业条款对比所得。
