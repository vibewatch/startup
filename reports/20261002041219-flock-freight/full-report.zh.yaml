      - number: '7.3'
        title: 交易对手、承运人与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 的商业模式在现货散客货主与独立汽车承运人之间动态权衡信用风险与营运资金占用。签约货主享有行业标准的 30 天账期，并以在途货物的持续留置权作为信用担保；自助门户用户则在货物送达 3
              天后由系统自动发起信用卡扣款，逾期欠款加收 12% 的年化利息。在供给端，Flock Freight 主要签约运营 53 英尺干线厢车与箱式货车的中小车队及个体车主，通过每英里额外 $0.20 的溢价补贴和
              STL AddOns 吸引司机接单执行多点路线。然而，承运人协议包含单方降价罚则，若拼单伙伴货物取消或漏提，平台将扣减基础运费，这在货运衰退期易引发承运人抵触甚至退网流失。通过 2025 年 5 月的 $60M
              Series E 轮融资，Flock Freight 历年累计吸纳风险投资达 $459.7M，但其仍需持续维持足够的货运撮合流动性，方能实现两位数毛利率并支撑算法研发，避免被稀释重组。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
