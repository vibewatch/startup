  - id: FU001
    title: 客户旅程与网络飞轮图
    type: journey-map
    summary: 直观呈现客户从最初询价到算法智能拼载、送达核验及承运人运力扩充的全流程演进。
    data:
      nodes:
        - label: 标段投标与询价报价
          buyer: Shipper Logistics Director
          touchpoints:
            - Instant rate quote via TMS integration or web portal
            - Linear-foot pricing selection (10 to 44 feet)
          experience: Shipper evaluates cost vs full truckload and selects guaranteed transit schedule.
        - label: 算法智能拼载
          buyer: Flock Freight Matching Engine
          touchpoints:
            - Evaluating 3+ trillion shipment combinations
            - Pairing 2-3 compatible freight loads along shared lane
          experience: Automated routing eliminates terminal cross-docking and optimizes deck utilization.
        - label: 承运人派单订舱
          buyer: Independent Motor Carrier
          touchpoints:
            - Load board notification with STL AddOns capacity match
            - Acceptance of multi-stop rate confirmation
          experience: Carrier books supplemental partial freight, earning up to 20% higher revenue per load.
        - label: 在途实时追踪
          buyer: Operations & Tracking Team
          touchpoints:
            - Continuous real-time telematics and driver check calls
            - Untouched pallet securement without terminal cross-docking
          experience: Logistics coordinators monitor shipment milestones with zero intermediate handling.
        - label: 运输履约与送达签收
          buyer: Consignee / Receiver
          touchpoints:
            - Real-time tracking and delivery confirmation
            - Single-driver untouched transit from origin to destination
          experience: Consignee receives freight undamaged (<0.001% claim rate) on guaranteed date.
        - label: 网络规模扩张
          buyer: Enterprise Account
          touchpoints:
            - Contract lane integration with managed transportation partners
            - Expansion into broader geographic lanes
          experience: Demonstrated 16-20% savings drives increased routing guide allocation.
    approximationNotes: 业务流程阶段综合自 Flock Freight 官方承运人协议、FreightWaves 报道及产品官方文档。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图与缓解矩阵
    type: matrix
    summary: 按发生概率、严重程度及应对成熟度评估核心运营、法律、交易对手与财务风险。
    data:
      columns:
        - 发生概率
        - 影响严重程度
        - 缓解成熟度
        - 残留风险姿态
      rows:
        - label: 货主对普通承运人提起的责任索赔
          values:
            - label: 低
              tone: positive
              detail: 严格以 MC33945 牌照作为财产经纪人运营，免除直接承运责任。
            - label: 极高
              tone: negative
              detail: 货主若主张重新认定承运性质，或使经纪平台直接面临灾难性货损索赔。
            - label: 健全
              tone: positive
              detail: 标准条款与 ADR 仲裁机制明确将责任转嫁至第三方汽车承运人。
            - label: 低
              tone: positive
              detail: 依照法律规定，公司残留风险敞口上限为过去 12 个月净收入或 $500。
        - label: 策略性货运身份欺诈
          values:
            - label: 中
              tone: warning
              detail: 行业内冒名接单提货与“二次转包（double-brokering）”等高智商欺诈激增。
            - label: 高
              tone: negative
              detail: 无法追回的货物被盗损害货主信心与承运人网络完整性。
            - label: 较高
              tone: positive
              detail: 强制通过 Highway 进行身份验证并启用平台多因素认证。
            - label: 中
              tone: warning
              detail: 伪造凭证与社会工程学攻击造成的残留脆弱性。
        - label: 违禁品托运与交叉污染
          values:
            - label: 中
              tone: warning
              detail: 货主可能无意或恶意托运危化品、易碎品或易腐品。
            - label: 高
              tone: negative
              detail: 拼载干货遭污染引发多方交叉索赔责任。
            - label: 中等
              tone: warning
              detail: 合同免责条款与每车 $100,000 货物保额上限。
            - label: 中
              tone: warning
              detail: 缺少线下越库检查环节，平台高度依赖托运人自觉。
        - label: 汽车承运人流失 / 拒单
          values:
            - label: 中
              tone: warning
              detail: 运力紧张周期内，小型车队可能不愿接受多停靠点路线的复杂度。
            - label: 极高
              tone: negative
              detail: 拼车失败导致单票货物单独运输，面临严重利润率亏损。
            - label: 适度
              tone: warning
              detail: $0.20/mile 的费率溢价与 STL AddOns 改善了司机路线经济性。
            - label: 高
              tone: negative
              detail: 拼载货物减少时的单方面降价条款可能推高承运人流失风险。
        - label: 清算优先权与资本积压
          values:
            - label: 高
              tone: negative
              detail: 累计超 $459.7M 风投资金推高了退出估值门槛。
            - label: 高
              tone: negative
              detail: 未能达到规模的退出或低价轮次资本重组将损害普通股价值。
            - label: 早期
              tone: warning
              detail: Series E 资金缓冲以及对两位数毛利率的追求。
            - label: 高
              tone: negative
              detail: 持续高利率环境与货运萧条限制了 IPO 与并购估值倍数。
        - label: 排放报告审计审查
          values:
            - label: 高
              tone: negative
              detail: 加州 SB 253 法案与 SEC 气候披露规则强制要求提供经过验证的 Scope 3 数据。
            - label: 中
              tone: warning
              detail: 减碳算法若出现差错，可能招致洗绿指责或监管罚款。
            - label: 成熟
              tone: positive
              detail: 标准化的 EPA SmartWay 与 GHG Protocol 计算模型。
            - label: 低
              tone: positive
              detail: 算法驱动的排放测算提供了可审计的合规文档。
    approximationNotes: 发生概率与严重程度依据合同条款、市场公开披露以及货运行业标准评定。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR006
      - CR013
      - CR014
  - id: FV001
    title: 建议与估值逻辑决策流
    type: flow
    summary: 决策流图展示市场规模、财务不透明度及估值倍数如何得出观察评级。
    data:
      nodes:
