      - number: '2.3'
        title: 买方客群细分、采购触发点与平台经济学
        blocks:
          - type: paragraph
            body: >-
              拼车货运的渗透取决于企业运输采购方与独立汽车承运人构成的双边市场机制。在货主端，预算决策权集中在物流总监、供应链副总裁及运输采购经理手中，他们对照严苛的准时保质交付（OTIF）窗口、零售合规罚款及客户留存指标来把控货运支出。核心促成因素包括消除货损（公司自述无中转站直达运输的货损索赔率低于
              0.001%，远低于标准转运站差错率），以及因减少空驶和中转里程带来的 15% 至 40% Scope 3 碳减排。在承运人端，驱动力来自增量收益：运输多点拼载货物的卡车司机填补空置板位后，每单收入最高可提升
              20%，每英里额外增加 $0.20。然而，推广阻力依然显著，包括货主对传统运输管理系统（TMS）路由指南的路径依赖、对多点经停交付排程的顾虑，以及持续压低基准现货运价的周期性货运萧条。
            claimRefs:
              - CM001
              - CM004
              - CM007
