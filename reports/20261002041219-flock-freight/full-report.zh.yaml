        title: 公司定位、运营模式与治理架构
        blocks:
          - type: paragraph
            body: >-
              Flock Freight（2014 年以 AuptiX 之名注册成立，2015 年正式开展业务）是一家货运物流科技经纪商，总部位于加利福尼亚州 Solana Beach 与
              Encinitas。公司作为数字货运经纪商运营，主打拼车货运（STL）方案；该作业模式旨在砍掉越库分拨中转站，消除传统轴辐式零担（LTL）网络特有的货损、延误与碳排放。创始人兼首席执行官 Oren
              Zaslansky 在 21 岁时曾创立拥有 125 辆卡车的货运车队，在创立 Flock Freight 前还建立了 SolSource Logistics。公司持有共益企业（Certified B
              Corporation）认证，建有正式董事会，成员涵盖主要风投机构代表；Susquehanna International Group 的 Dean Carlson 便随着公司 2025 年 Series E
              轮融资进入董事会。
