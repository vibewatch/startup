      - number: '4.3'
        title: 资本充足率与融资依赖
        blocks:
          - type: paragraph
            body: >-
              指定证据中最新披露的融资，是 2025 年 5 月完成的 $60M Series E 轮融资 [CI009]。第三方数据库显示，其经历 6 轮融资累计吸收资金约 $459M 至
              $460M；这一细微数据出入源于不同数据源统计口径，不宜过度解读为确定性数值 [CI010]。Flock 表示新进资本用于维持长期运营稳定、拓展拼车货运网络、深化系统集成、强化信息安全、迭代拼载算法及吸纳人才
              [CI011]。但融资金额并不等于账面可用现金：公开材料均未披露 2026 年 10
              月的现金余额、月度烧钱速度、现金跑道、负债情况、项目融资义务或清算优先权。因此，该公司仍需依靠私有财务数据来证明其资本充足性。FreightWaves
              关于成本攀升、运力过剩低效、利润侵蚀及行业并购整合的行业评述，更凸显了流动性缺失这一财务尽调漏洞的重要性 [CI013]。
