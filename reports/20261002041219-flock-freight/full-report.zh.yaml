      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 货运低效困境：买单空气还是买单货损
            body: >-
              拼车货运的核心经济驱动力，在于传统货运模式无法有效承接 10 到 44 英尺车厢长度的货物。据行业统计称，在标准 LTL 网络中，每 51 票货物就有 1 票产生索赔，平均索赔金额达 $3,777；而 FTL
              则迫使货主空置 29 到 34 英尺的车厢空间。Flock 借助算法将互补的拼载货物匹配为中途不落地的直达运输，把空驶和闲置底板空间转化为货主的成本节约与承运人的利润空间。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
          - type: callout
            title: 宏观货运衰退与路线密度瓶颈
            body: >-
              挂车利用不足的市场空间在理论上极其广阔，但算法拼载对路线的空间与时间密度要求极高。在长期货运低迷期，整车现货基准运价暴跌，货主拼货的动力被削弱；同时低迷的运力价格也挤压了 Flock
              从货主拼单结算与承运人运费支出之间赚取的毛利差价。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM012
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局、替代运输方式与既有方案
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 将其拼车货运（STL）平台精准切入传统整车运输（FTL）与零担运输（LTL）之间的夹缝地带 [CP001]。在货运物流中，运输中等规模货物（通常为 10 至 44 英尺车厢长度或 6
              至 12 个托盘）的货主历来面临低效的二选一困境 [CP002]。既有解决方案要么是订下整车运力并为闲置车厢买单，造成大面积底板空间浪费；要么是将货物送入传统 LTL 网络 [CP003]。传统 LTL
              依靠实体的轴辐式集运网络，货物在中途经历多轮越库装卸分拨，导致运力周转延误、附加杂费高昂，且行业常规货损索赔率据称超过 1% [CP004, CP005]。Flock Freight 的算法拼载服务
              FlockDirect 摒弃越库中转站，借助算法将多家货主的相容货物拼入同一辆干线厢车或冷藏挂车，由单一司机从始发地直达目的地 [CP001, CP006]。然而其面临广泛的竞争边界：传统重资产全国性 LTL
              承运人（如 Old Dominion Freight Line、Saia、XPO 和 Estes Express）拥有庞大的自有转运中心网络和高履约确定性；数字货运经纪平台（如 Uber Freight、C.H.
              Robinson 及承接 Convoy 技术的后继者）则长于自动化整车匹配 [CP002, CP007]。此外，货主往往习惯于由内部采购团队在传统运输管理系统（TMS）内分拆订单或沿用大宗 LTL
              费率，形成了阻碍采纳新兴运输模式的工作流惯性 [CP008]。
            claimRefs:
