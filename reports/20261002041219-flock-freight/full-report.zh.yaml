          - type: callout
            title: 经审计留存率与流失率披露缺失
            body: 尽管官方宣传物料宣称拥有数千家货主以及极高的承运人满意度，但 Flock Freight 既未披露客户流失率，也未公布同群留存率数据，平台在周期性货运萧条期的抗风险韧性依然存疑。
            calloutType: risk
            claimRefs:
              - CU004
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与法律风险治理
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 依据美国联邦汽车承运人安全管理局（FMCSA）财产经纪人营运许可（Docket Number MC33945）展业，在合同中明确免除了普通承运人直接承运责任。根据其 2026 年 4
              月更新的标准客户条款，公司明确其提供的是财产经纪与物流撮合中介服务，而非实际承运或无船/无车货运代理。因此，直接的货物灭失、损坏、被盗及运输延误均受《卡马克修正案》（Carmack Amendment，49
              U.S.C. 14706）管辖，货主须直接向第三方汽车承运人索赔，且每辆挂车承担的最高赔偿额严格受限于 $100,000（按实际占用车厢长度折算比例划分）。平台进一步构筑自我保护屏障，将公司整体责任上限设定为
              $500 与过去 12 个月经纪净收入之中的较高者，并规定争议须依据 Transportation ADR Council 规则在加州圣迭戈县进行具法律约束力的仲裁。在核心经纪责任之外，公司面临日益收紧的环境与
              ESG 监管合规要求，包括加利福尼亚州参议院第 253 号法案（SB 253）以及 SEC 拟议的气候披露规则，要求其 Scope 3 货运减排核算公式及碳抵消项目必须通过审计级验证。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR010
      - number: '7.2'
        title: 运营、网络安全与货物盗窃风险敞口
        blocks:
          - type: paragraph
            body: >-
              拼车货运多点提送的运营稳定性，取决于能否全面防范货物被盗、身份伪造冒领及沿途履约故障。面对全行业激增的假冒承运人提货与策略性货运盗窃，Flock Freight 强制通过 Highway
              进行承运人身份核验，在货主端和承运人端门户全量推行多因素认证（MFA），并部署 Crowdstrike 终端威胁检测系统。2023 年，该公司报告其员工钓鱼邮件易感基准为 2.93%，优于交通运输行业 8.5%
              的平均水平。即便如此，拼车货运仍衍生出独特的物理与算法失效风险。与加装铅封的点对点单程整车不同，同一挂车混装 2 至 3
              家不同货主的拼批货物，要求司机在无中途越库中转站的情况下执行复杂的多点经停与现场装卸。为控制运营风险敞口，Flock Freight 的客户协议明令禁止承运危险品、温控易腐品、活体动物、酒类、药品及单批价值超过
              $100,000 的高价值货物；任何未经许可夹带禁运品类的行为均将产生无法投保的重大潜在责任。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
