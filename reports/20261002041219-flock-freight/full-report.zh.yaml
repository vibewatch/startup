  - id: TP001
    title: 各类货运履约模式下的竞争对手画像
    columns:
      - 竞争对手 / 品类
      - 运营模式
      - 规模 / 融资参考
      - 目标客群
      - 核心价值主张
      - 关键痛点 / 局限性
    rows:
      - - Flock Freight
        - 采用算法驱动拼车模式的轻资产数字货运经纪平台
        - 累计融资 $395M；最高估值 $1.4B（2021年）；2025 年完成 $60M Series E 融资
        - 运输 10–44 线性英尺拼箱货的中型与大型企业货主
        - 免中转 STL 拼车，比 FTL 节省约 20% 成本且货损率 <0.001%
        - 极度依赖区域货源密度；承运商多平台接单（multi-homing）流失风险
      - - Legacy Asset LTL (Old Dominion, Saia, XPO)
        - 重资产实体轴辐式分拨转运网络
        - 数十亿美元上市市值/自有车队重资产规模
        - 标准托盘货主（全国范围，1–6 块托盘）
        - 遍布全国的分拨网点与确定性班期网络
        - 中转多次装卸货损率高（>1%）、枢纽延误严重、计费体积重规则不透明
      - - 数字货运经纪商（Uber Freight、Convoy 技术）
        - 厢式货车与冷藏整车轻资产数字撮合交易平台
        - 数十亿美元总货运流水规模，坐拥雄厚风投及产业资本支持
        - 寻求自动化现货运力的整车大型企业货主
        - 单车运单自动化撮合、即时报价、企业级 TMS API 对接
        - 缺乏多货主算法拼车能力；拼货仍按整车（FTL）计费走车
      - - Traditional 3PLs (C.H. Robinson, TQL)
        - 线上数字化与人工经纪结合的综合物流管理及货运代理
        - 行业领先的企业规模（总收入 $10B+），上市公司资产负债表
        - 面向全球 2000 强企业的全运输方式综合货运采购
        - 庞大的承运商网络底盘、全球供应链大合同、深度嵌合 TMS
        - 人工经纪人力成本高昂，传统拼货工具分散落后
      - - Shipper Status Quo (Internal Build / Routing Guides)
        - 内部物流团队依靠传统 TMS 路线指引与大宗 LTL 协议费率
        - 企业内部物流预算与签约保量承运商
        - 生产或零售补货节奏规律可预测的成熟货主
        - 直接掌握承运商合同控制权，排期结算确定性高
        - 车厢底板严重浪费（拉空气）或承受昂贵的大件 LTL 费率
    notes: Flock Freight 档案源自官方披露、Series E 报道及招聘信息；竞品分类代表美国货运物流的标准运营架构。
