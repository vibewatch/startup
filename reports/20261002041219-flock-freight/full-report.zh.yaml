  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与相邻赛道
        blocks:
          - type: paragraph
            body: >-
              北美地面货运市场传统上划分为整车运输（FTL）和零担运输（LTL）两大运营模式。传统 LTL 依靠重资产的轴辐式转运网络，在区域越库分拨点拼拆托盘货物。这一模式虽适合 1 到 6
              个托盘的小货量，但多次装卸搬运导致货物极易受损、产生不可预知的杂费并加剧时效波动。相比之下，FTL 提供直达且铅封的运输，但无论装载率高低，货主都必须支付整辆 48 英尺或 53 英尺挂车的费用。Flock
              Freight 将拼车货运（STL）定位为无中转站的中间层，把多批中等规模的拼载货物（通常为 10 到 44 英尺车厢长度，或 2 到 3
              家不同货主的订单）拼入单趟直达整车。砍掉越库中转站与中间二次装卸后，STL 既争夺利用率不足的 FTL 货量，也吃掉高价值、易碎敏感的 LTL
              货物，同时与包裹快递、短途驳运（drayage）及温控大宗运输保持明确区隔。
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM010
              - CM011
