  - id: FP001
    title: 竞争定位图：中等体量货运经济性与服务可靠度对比
    type: quadrant
    summary: 从非满载成本效益与货物搬运可靠度两大维度评估各货运模式。
    data:
      xAxis:
        label: 搬运与运输可靠度（从频繁中转倒货到高服务保障）
      yAxis:
        label: 中等体量货运成本效益（从车厢空间严重放空到高线性英尺优化）
      points:
        - label: Flock Freight (STL)
          x: 8.5
          'y': 8.8
          note: 专利算法拼载省去中转倒货，同时优化车厢装载成本
        - label: 数字整车经纪商
          x: 7.8
          'y': 3.5
          note: 运输可靠度与时效高，但运输非满载货物面临严重的成本惩罚
        - label: 传统枢纽零担（LTL）
          x: 3.2
          'y': 4.8
          note: 1–4 块托盘运价尚可，但货损索赔主张风险高且枢纽中转常有延误
        - label: 传统 3PL 经纪商
          x: 6.2
          'y': 5.2
          note: 具备跨运输方式的广泛运力，但人工拼载服务质量不稳定
        - label: 货主自运现状（自营整车）
          x: 7.2
          'y': 2.5
          note: 排期掌控度高，但为车厢放空买单导致利润大幅承压
        - label: 货主自运现状（大件零担）
          x: 4
          'y': 5.5
          note: 借承运人填补中等体量缺口，但面临不可预测的中转延误与重复搬运
    approximationNotes: 序数得分（1–10 分制）反映相对结构性表现：X 轴衡量无中转货损与准时送达表现；Y 轴衡量中等体量货物（10–44 线性英尺）的成本效益。
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP007
      - CP009
      - CP010
  - id: FI001
    title: 拼载整车收入与毛利依赖传导模型
    type: flow
    summary: 该模型将公开运营机制与评估毛利及现金转化所需的非公开财务输入端连接起来。
    data:
      nodes:
        - id: shipper-demand
          label: 货主需求
          detail: 货量不足单辆整车装载需求的货物
        - id: space-based-quote
          label: 空间计价报价
          detail: 按线性英尺或托盘计费
        - id: pooled-load
          label: 拼载运单
          detail: 通常包含两到三票货物
        - id: carrier-payment
          label: 承运人运费结算
          detail: 干线运费及已披露的 AddOn 增收激励
        - id: broker-gross-profit
          label: 经纪毛利
          detail: 货主账单金额扣除承运人及直接服务成本；具体金额未公开
        - id: cash-conversion
          label: 现金转化
          detail: 运营支出、营运资金、资本开支、负债及现金数据均无法获取
      edges:
        - from: shipper-demand
          to: space-based-quote
          label: 询价请求
        - from: space-based-quote
          to: pooled-load
          label: 匹配与定价
        - from: pooled-load
          to: carrier-payment
          label: 运力采购
        - from: carrier-payment
          to: broker-gross-profit
          label: 非公开利差
        - from: broker-gross-profit
          to: cash-conversion
          label: 非公开成本传导
    approximationNotes: 未对利润率或现金转化做数值测算；最后两个节点明确属于非公开数据缺口。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI008
      - CI012
  - id: FE001
    title: Flock Freight 技术与物流架构体系
    type: stack
    summary: 六层架构图展示表现层、服务协同层、算法匹配层、消息通信层、持久化层及外部核验层。
    data:
      layers:
        - label: 表现层
          detail: 基于 React 与 TypeScript 构建的货主 Web 门户、TMS 嵌入式界面及承运人数字化货源大厅。
          modules:
            - 货主 Web 门户
            - 承运人货源大厅
            - TMS 嵌入式 UI
        - label: API 与服务网关
          detail: 基于 REST 与 gRPC 管理工作负载路由、鉴权认证及 TMS 接口的分布式微服务。
          modules:
            - 工作负载路由网关
            - 认证与鉴权服务
            - 外部 TMS 接入 API
        - label: 算法拼载引擎
          detail: 运用运筹学与组合优化模型匹配零散货源，生成多点停靠路线。
          modules:
            - 图组合匹配器
            - 车厢装载空间预测优化器
            - 实时动态定价引擎
        - label: 异步消息层
          detail: 支持高吞吐交易处理的队列管理、事件分发与缓存架构。
          modules:
            - 分布式事件代理
            - 交易队列管理器
            - 缓存协同集群
        - label: 数据持久化层
          detail: 管理运营状态与运单记录的关系型数据库及 SQL 持久化工具。
          modules:
            - 关系型交易存储
            - 承运人历史数据库
            - 审计与货运总账
        - label: 车联网与身份认证基础设施
          detail: 集成第三方承运人准入核验（Highway）与车队远程信息流的云计算基础设施。
          modules:
            - Highway 承运人审核集成
            - 车队远程信息与 IoT 接入
            - 云容器编排
    claimRefs:
