              接入而无需签署排他协议，一旦整体整车现货运价回落，货主的平台切换成本极低。公司虽与第三方综合运输与采购管理服务商建立集成合作将拼车货运嵌入企业工作流，但净金额留存率（NRR）、毛金额留存率（GRR）以及前十大客户收入集中度等数据仍属未公开的私有指标。
