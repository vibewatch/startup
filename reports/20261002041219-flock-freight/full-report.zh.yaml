      - number: '2.2'
        title: 潜在市场空间、挂车利用率与货主端损失
        blocks:
          - type: paragraph
            body: >-
              行业测算历来将北美货运物流的核心潜在市场规模定在 $65B
              以上，而整体卡车货运的干线总支出更超过数千亿美元。在这个庞大市场中，算法拼载的潜在利润池来自普遍存在的挂车空置，以及本可避免的运力模式切换损耗。行业调研数据称，2023 年有 43%、2024 年有高达 58%
              的卡车处于半空载行驶状态，每单半载货物平均闲置 29 到 34 英尺可用车厢底板空间。货主卡在 10 英尺的 LTL 严格上限与昂贵的整车起步价之间，往往只能被迫承担浪费的车厢空间或高昂的转运站二次装卸成本。在
              LTL 网络中，大型企业货主每笔受损货物的平均索赔成本达 $3,777，年均货损与遗失支出高达 $6.3M，还要额外承受最高 $2.3M 的突发附加杂费。这些可量化的成本痛点，构成了算法拼载软件立足的经济切入点。
            claimRefs:
              - CM002
