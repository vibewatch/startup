              领投的 $60M Series E 轮融资，Susquehanna Private Equity Investments、SignalFire、GLP Capital Partners 与 Bracket
              Capital 参投。尽管 Series E 提供了维持研发和承运人系统对接的关键营运资金，但该笔交易未披露最新估值，使得 2021 年之后的股权估值以及清算优先权结构持续处于信息真空。
