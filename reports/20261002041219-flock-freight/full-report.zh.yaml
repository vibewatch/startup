  - id: TV002
    title: 投资逻辑正反论证矩阵
    columns:
      - 评估维度
      - 正向投资逻辑（牛市驱动力）
      - 反向投资逻辑（熊市风险点）
      - 核心分歧转折点
    rows:
      - - 品类开创
        - 专利拼载整车算法消除 10–44 英尺拼箱运输的结构性浪费
        - 拼载整车仍属运营利基市场，容易受到标准零担运价折扣的挤压
        - 独立承运人采纳度审计证实 STL 能在货运疲软期守住市场份额
      - - 单车经济模型（Unit Economics）
        - 按英尺计价为货主节省 20% 成本，同时承运人 STL AddOns 增收至多 $0.20/mile
        - 多点停靠装卸滞留时间、司机滞留费以及拼载落空侵蚀平台毛利率
        - 披露经核实的净收入变现率及每运输英里边际贡献
      - - 服务品质
        - 无中转直达实现 97.5% 准时送达率，货损率低于 0.001%
        - 恶劣天气或干线中断时，承诺送达窗口将带来沉重的违约赔偿责任
        - 第三方索赔主张审计，核实货损赔付与货主 SLA 退款争议频次
      - - 资本纪律
        - 2025 年顺利完成 $60M Series E 轮融资，在旷日持久的货运下行周期中为业务扩张提供资金
        - Series E 估值信息完全未公开，表明该轮融资为附带苛刻条款的防守型融资
        - 披露 Series E 投后估值、票息、参与分配权及清算优先顺序
    notes: 将尽调多方来源梳理出的核心价值驱动因素与运营阻力进行对比。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
  - id: TV003
    title: 乐观、基准与悲观情景估值模型
    columns:
      - 情景
      - 净收入预测
      - 隐含企业价值倍数（EV Multiple）
      - 企业估值区间
      - 核心运营假设
      - 发生概率信号
    rows:
