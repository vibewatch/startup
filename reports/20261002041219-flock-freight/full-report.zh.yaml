          detail: 净收入、毛利率及 Series E 条款严重不透明
        - id: n4
          label: 估值现实
          detail: 2021 年 Series D $1.3B 估值严重背离市场倍数现实
        - id: n5
          label: 下行敞口
          detail: Series E 高级清算优先权积压与货运周期疲软风险
        - id: n6
