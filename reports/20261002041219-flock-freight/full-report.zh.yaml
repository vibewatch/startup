            title: 承运人多平台兼营与算法履约脆弱性
            body: >-
              Flock Freight 的核心价值主张依赖于算法将多点拼载路线无缝匹配给独立汽车承运人。由于个体司机和小车队在各货运抢单平台间频繁切换，且在运力趋紧时更青睐简单的点对点单程整车，Flock
              必须持续维持溢价补贴（每英里额外补贴 $0.20），以防承运人流失至传统单点整车运输。
