      - number: '5.2'
        title: 核心拼载架构与算法匹配
        blocks:
          - type: paragraph
            body: >-
              Flock Freight
              的底层技术壁垒在于其拼车货运算法优化引擎，该引擎能够实时计算全网跨承运人复杂的多点路径组合。引擎打破静态班线调度模式，综合考量地理坐标、时效窗口、货物品类相容性及挂车物理尺寸等货物属性，计算生成最优的多点经停路线。后端系统基于
              Java、Spring Boot 和 Python 构建微服务，各服务间经由 REST 和 gRPC 接口交互，并采用异步消息队列处理分布式事务。车队运营集成远程车载信息系统（Telematics）与 IoT
              平台进行实时车辆追踪，关系型数据库则统管从下单、派单到结算的全生命周期业务状态。
