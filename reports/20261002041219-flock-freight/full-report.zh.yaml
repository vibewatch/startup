              公开证据描绘了一个在商业逻辑上自洽的利润机制：按实际占用空间向货主收费、拼载相容货物、提升承运人资产利用率，但并未声称承运人的收益增幅直接等同于 Flock 自身的盈利水平 [CI001, CI003,
              CI004, CI005]。证据亦显示其拼载撮合速度与官方公布的服务质量在历史上有所改善，这或许有助于压低运营摩擦与货损索赔敞口 [CI014, CI015,
              CI016]。然而，投资研判结论依然审慎，因为公开材料未披露总流水、确认营收、毛利润金额、实际毛利率、获客成本、回收周期、客户集中度、营运资金或自由现金流。目前无法得出任何关于现金跑道或盈利能力的确定性结论。下一步核心尽调任务，是建立从货物订单运力到货主结算账单、承运人运费支出、毛利润、运营支出、营运资金及账面现金的测算桥梁，并与审计后财报和最新股权架构表（Cap
              Table）进行勾稽。
