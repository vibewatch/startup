      - number: '3.3'
        title: 定价机制、切换阻力与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              拼车货运的底层商业机制建立在整车现货运价与 LTL 阶梯费率之间的价差套利之上 [CP001, CP016]。Flock Freight 依据占用的车厢长度与托盘数量计价，自述与整车包车相比可为货主平均节省
              20% 成本 [CP002, CP016]。依托免中转站越库装卸的直达运输，Flock 达成了 97.5% 的准时交付率，货损索赔率低于 0.001%，并辅以履约赔付承诺 [CP005,
              CP016]。相比之下，传统 LTL 定价存在不透明的体积重新分级核算费与燃油附加费，而整车现货对不满载货物极不友好 [CP003, CP016]。尽管账面经济效益显著，Flock 仍面临巨大的竞争切换阻力
              [CP008]。货运经纪行业的运力忠诚度极低：个体司机和小车队习惯于在 DAT、Truckstop.com 和 Uber Freight 等多个货运平台之间多头比价接单，完全按即时每英里单价和路线顺路程度做选择
              [CP007, CP014]。在需求端，大型企业货主高度依赖嵌入传统 TMS 的自动化路由指南，默认将货物二元划分为 LTL 或 FTL 订单 [CP008, CP015]。虽然 Flock
              的算法拼载专利和共益企业（B Corp）认证形成了初期差异化，但其长期壁垒完全取决于能否持续扩大货主订单密度，在不产生绕路延误的前提下维持算法拼载效率 [CP001, CP006, CP012]。
            claimRefs:
