        - 3.0x - 4.0x 净收入
        - $600M - $880M
        - 企业级 TMS 快速普及、货运市场持续复苏、毛利率扩张至 20% 以上
        - 低（15%）—— 取决于宏观货运市场快速复苏及经审计的毛利率扩张
      - - 基准情景
        - $100M - $130M 净收入
        - 1.5x - 2.2x 净收入
        - $150M - $285M
        - STL 干线密度温和增长、即期市场持续承压、总变现率走平
        - 中等（60%）—— 符合一级市场数字货运经纪估值倍数与市场阻力预期
      - - 悲观情景
        - $50M - $75M 净收入
        - 0.8x - 1.2x 净收入
        - $40M - $90M
        - 多点停靠路线承运人流失、客户拒单、优先股重度堆叠引发资本重组
        - 中高（25%）—— 主因货运衰退期拉长，且 Series E 资本结构未经证实
