  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 的公开商业模式始于按车厢占用的英尺长度或托盘计费，而非整辆挂车包车计价 [CI001]。公司声称这能为货主带来相较于整车运输平均 20%
              的成本节约，但这属于营销基准指标，而非实际客户成交价或经审计报告的收入 [CI002]。其官网称网络通常拼载 2 至 3 票货物，独立行业报道亦提及其实时拼车货运报价功能 [CI003,
              CI008]。这些事实共同佐证了一种基于交易提成的货运经纪模式，其中算法匹配优化可提升挂车利用率。然而，这些信息并未明确 Flock
              的货主账单是按全额还是净额确认营收、报价中有多少比例支付给卡车承运人，以及订阅制软件费是否构成实质性收入。此类会计准则与收入构成问题属于私有尽调范畴，无法直接套用模型假设。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
