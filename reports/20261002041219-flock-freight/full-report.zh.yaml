  - id: TM001
    title: 货运品类架构与业务边界定义
    columns:
      - 货运细分品类
      - 涵盖支出与货品特征
      - 排除支出与业务边界
      - 核心采购方与买单方
      - 对 STL 的战略相关性
    rows:
      - - Shared Truckload (STL)
        - 2–3 笔拼货订单（10–44 线性英尺）直达多点经停拼车；按线性英尺计价
        - 单托盘小件包裹、大宗干散货/罐车、平板机械运输、短驳拖车
        - 运输总监、物流副总裁（货主买单）
        - Flock Freight 核心品类；无分拨中心、零中转触碰的直达干线运输
      - - Traditional LTL
        - 轴辐式转运中心交叉理货；1–6 块托盘（<10 线性英尺）；依据 NMFC 货运分级计价
        - 直达整车、重型工业超限设备、特种包裹
        - 货运经理、出运协调员（货主买单）
        - 易损拼箱货与多托盘订单的核心市场份额供给方
      - - Full Truckload (FTL)
        - 独占 48 或 53 英尺厢式货车/冷藏货车；点到点专线干线运输
        - 10 英尺以下微型拼货、包裹、快递、铁海联运集装箱短驳
        - 供应链副总裁、物流采购总监（货主买单）
        - 传统替代方案；43%–58% 的货车处于拼货不满载状态，为 STL 释放空余车厢空间
      - - Legacy Partial (PTL)
        - 货运信息板即时拼货；经纪人按线性英尺进行现货撮合
        - 自动化实时图算法优化、保价与承诺交付时效
        - 货运经纪人、第三方物流调度员（货主买单）
        - 缺乏算法路径匹配与价格保证的非优化人工撮合雏形
    notes: 细分边界基于 Flock Freight 产品架构、官方条款以及行业通用运营定义划分。
