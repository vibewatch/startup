              - CR015
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 货物赔偿责任的结构性转嫁
            body: >-
              Flock Freight 的标准服务条款在法律上全面免除了直接承运人身份，并将平台自身赔偿限额锁定在过去 12 个月经纪净收入与 $500
              之中的较高者，迫使货主在遭遇货物破损或延误时必须直接向第三方实际承运人交涉索赔。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: 业务欺诈与多重核验关卡
            body: >-
              鉴于全美货运欺诈与盗窃犯罪呈上升态势，Flock Freight 推行强制性的 Highway
              承运人准入审查与多因素身份认证，以此构筑抵御二次转包倒卖（double-brokering）与冒领盗窃的核心风控防线。
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              Flock Freight
              在北美货运物流赛道提出了一套极具吸引力的技术解法：运用专利多点拼载算法将零散货运需求拼合为拼车整车（STL），彻底绕开传统零担（LTL）越库分拨中心。多头观点强调，这种免中转架构能有效保护易碎货物，达成超 97%
              的准时交付率，并依占用车厢尺数计价为货主节省高达 20% 成本（对比包整车）。同时，承运人伙伴获得填补不满载挂车的增收机会，每英里多赚最高 $0.20 或每天增收最高
              $200。然而，反向投资论点直指其极端的财务不透明与周期脆弱性。Flock Freight
              在轻资产货运经纪框架下运作，饱受旷日持久的货运萧条与现货运价下行冲击。在缺乏经审计的商品交易总额（GMV）、净金额留存率或单体边际贡献利润的情况下，外部投资人无从判断算法拼载究竟是沉淀了可持续的毛利率，还是仅仅在持续补贴亏本的多点提送运输。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
      - number: '8.2'
        title: 融资历史与估值倒挂隐忧
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 历经五轮机构风险投资，累计吸纳约 $399M 至 $459M 股权融资。公司估值巅峰出现在 2021 年 10 月，当时软银愿景基金二期（SoftBank Vision Fund
              2）领投其 $215M Series D 轮融资，将公司投后估值推高至 $1.3B（部分二级市场追踪机构报道其投前估值为 $1.0B 或企业价值为 $1.4B）。在此之前，公司于 2020 年底完成
              $113.5M Series C 轮融资（投后估值 $460M 至 $500M），并在 2020 年初完成 $50M Series B 轮融资。然而，此后的货运周期急转直下重塑了市场格局。2025 年 5
              月，Flock Freight 获得由 O'Neil Strategic Capital 领投的 $60M Series E 轮融资，Susquehanna Private Equity
              Investments、SignalFire、GLP Capital Partners 和 Bracket Capital 跟投。关键在于，公司并未公开 Series E
              轮投后估值、清算优先权条款及股权清偿顺位。这种缄默极大概率表明该轮为平价轮（flat round）、附加了下行结构化保护条款，甚至相比 2021 年牛市顶峰可能是一轮未公开披露的折价轮（down-round）。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV011
              - CV016
      - number: '8.3'
        title: 情景估值建模与下行风险触发条件
        blocks:
          - type: paragraph
            body: >-
              鉴于缺乏经核实的 GAAP 财务披露，估值建模须锚定物流科技行业可比乘数及分情景运营表现。在乐观情景（Bull Case）下，Flock Freight 重新提速 STL 在《财富》500
              强供应链中的企业级渗透，推动净营收向 $200M 靠拢，并守住高十几个百分点的毛利率；按 3.0x 至 4.0x 净营收的企业价值倍数估算，对应企业价值为 $600M 至 $800M。在基准情景（Base
              Case）下，货主端持续对价格敏感抵触、承运人多点路由复杂、全网货量疲软，将净营收压制在 $100M 至 $130M 区间；套用与市场贴合的数字货运经纪乘数（1.5x 至 2.2x 净营收），对应企业价值为
              $150M 至 $285M，相较 $1.3B 的 Series D 巅峰估值大幅缩水。在悲观情景（Bear Case）下，若干线运价持续低迷、承运人不断退网，叠加清算优先权偿付压力，可能迫使公司以低于 $100M
              进行困境重组或资产贱卖。下行触发因素包括 Series E 优先清算权顺位持续不透明、核心高管变动或主要承运人运力流失。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 可比公司对标、尽调核对清单与投资建议
        blocks:
          - type: paragraph
            body: >-
              一二级市场对标为 Flock Freight 的估值预期提供了冷静清醒的参照。传统重资产 LTL 与整车运输企业的市销率倍数仅为 0.8x 至 1.8x，EV/EBITDA 为 6.0x 至 10.0x；而
              Flexport、Loadsmart 和 Arrive Logistics 等数字物流聚合平台，估值均较 2021 年疫情期间的高点遭遇剧烈压缩。一级市场聚合数据报告了第三方对 Flock Freight
              $646.5M 收入的估算值（对应约 360 名员工和 2,000 家客户）；然而，该数字反映的是未经核验的货运总流水（gross freight billings），而非高毛利的软件收入。创始人
              Zaslansky 亦对兼并收购保持高度审慎，指出 75% 至 80%
              的并购都在毁灭价值，从而收窄了外延式退出的期权空间。因此，我们的投资建议为观望（Track），风险评级为高（High），估值立场偏高估（Stretched）。转向买入评级的前提是：在第一手尽调中核实经审计的
              GAAP 净营收，拿到能证明跨越整个货运周期维持两位数毛利率的实据，并完全穿透 Series E 轮清算优先权的分配瀑布流。
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 维持观望评级，静待审计后财报披露
            body: >-
              面对 Flock Freight，投资人应维持观望（Track）立场，而非按历史估值盲目下注成长型资本。建仓纪律要求按 2022 年以后的货运现实重新商定企业估值，摒弃未经核实、脱离现实的 $1.3B
              Series D 顶峰估值。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
              - CV012
          - type: callout
            title: Series E 轮清算优先权沉重隐忧
            body: 2025 年 5 月 $60M Series E 轮未披露的估值和清算条款带来了巨大的高顺位清算优先权隐忧；若未来退出金额低于 $1.0B，普通股股东和早期风险投资机构的权益或将面临严重减记稀释。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV013
