  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与服务形态
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 提供免中转站的货运服务，旨在用点对点直达拼车货运（STL）替代传统轴辐式零担运输（LTL）的分拨模式。通过其核心商业解决方案
              FlockDirect，平台允许商业货主按车厢尺数或托盘位购买专属挂车运力，无需为整车（FTL）买单，也无需让货物进入多次中转的越库分拨网络。砍掉集运分拨中心的货物倒装环节后，货物在单辆挂车内全程不落地，由同一承运司机从提货点直发目的地。除基础拼车货运预订外，公司还为运力端提供自动化利用率工具，包括
              STL AddOns；该工具能以程序化方式识别匹配的拼载散货，把已签约承运人未装满的挂车车厢填满。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
