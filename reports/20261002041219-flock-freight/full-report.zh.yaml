            body: >-
              Flock Freight 的商业客群分立于两端：托运多托盘货物的发货方，以及提供干线厢车与冷藏运力的汽车承运人。在货主端，核心商业买方是统管 10 至 44
              英尺车厢长度中等规模货运的运输经理、物流总监及供应链高管。这类货主历来面临两难抉择：要么为整车（FTL）买单以保障无中转直达时效，要么订购零担（LTL）运输但承担转运货损、复核重称费及交付延误风险。在运力端，Flock
              Freight 合作对象多为驾驶 53 英尺干线厢车和冷藏挂车的个体司机及中小车队，依托拼车货运算法帮其填满剩余车厢底板空间，从而提供增量收益。
