            body: >-
              公开资料中关于单量经济模型的证据，主要体现在承运人资产利用率上，而非 Flock 自身的边际贡献利润。据《Commercial Carrier Journal》报道，Flock 称 STL AddOns
              让承运人单车收益在原始预订货量基础上平均提升 77%，并将挂车利用率翻倍 [CI004, CI005]。Flock 另外对外宣传，部分拼载路线可让司机每英里多赚 $0.20，每天增收最高可达 $200
              [CI006, CI007]。这些均为承运人端收益指标，绝非 Flock 自身的营业收入、毛利润或现金流。2025
              年某投资人声称该公司维持持续增长的两位数毛利率，但并未提供具体百分比、分期时间序列、会计准则口径或审计核对表
              [CI012]。公司历史披露的履约服务指标可作为运营质量的代理变量，但其获客成本（CAC）、投资回收期、客户留存率、货损索赔开支及运力采买成本仍未公开披露。
