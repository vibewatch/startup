      - number: '1.3'
        title: 拼车货运价值主张与货运市场逆风
        blocks:
          - type: paragraph
            body: >-
              Flock Freight 的核心技术与商业逻辑立足于拼车货运（STL）路线匹配。公司的算法优化引擎实时计算逾 3 万亿种路线组合，把两到三批匹配的拼载货物拼入一辆 48 英尺或 53
              英尺干货箱或冷藏挂车中。面向商用货主，Flock Freight 宣称相比为整车空置空间买单可节省最高 20% 成本，且因绕开中转站，准时交付率达 97.5%，货损索赔率低于
              0.001%。面向汽车承运人，Flock Freight 宣称每单收益最高可增加 20%，每英里额外增加 $0.20，其 STL AddOns 功能更称承运人收益最高可提升
              77%。然而，该业务正顶着严峻的宏观货运逆风运行：自 2021-2022
              年货运周期见顶之后，整个货运科技与数字经纪板块遭遇严重的利润率侵蚀、持续的货量疲软以及多家明星竞争对手破产。在资本密集型的经纪业务中，且在未公开披露营收或净利润指标的前提下运营，外界必须对其财务跑道与单车模型保持持续审慎。
