      - number: '3.2'
        title: 竞品全貌、运营模式与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              将 Flock Freight 与传统巨头及数字化竞品对比，暴露出资产配置、运营周转速度与价值变现模式上的鲜明差异 [CP009]。传统重资产 LTL
              承运人重金投入实体分拨集运站与干线车队，靠对物理运力设备的硬控制保障履约确定性，代价是较高的货损率以及迂回运输带来的碳排放 [CP004,
              CP010]。数字货运经纪平台主攻单一货主的整车履约，依托自动化运力匹配与 API 现货定价，不涉及多货主混载拼装 [CP007, CP011]。Flock Freight
              则把自研多点优化算法与轻资产无车承运人模式相结合，宣称其实时计算数十亿种时空组合以拼载小批量货物 [CP006, CP012]。在运力端，Flock
              运营专门的承运人平台，开放小批拼载货源，宣称承运人每单收入最高可增加 20%，每英里多赚 $0.20，并能借助 STL AddOns 技术将挂车收益平均提升 77% [CP013,
              CP014]。尽管如此，老牌竞品仍掌握巨大的结构性优势：大型货运经纪商手握百亿美元级年化流水、更深厚的货主合同池和成熟的企业级 TMS 集成；而 Flock
              仍需依赖主动销售工程与顾问式培训，向货主推介拼车货运的几何装载逻辑 [CP007, CP015]。
