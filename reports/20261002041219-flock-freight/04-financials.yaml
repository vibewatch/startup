company:
  name: "Flock Freight"
chapter:
  number: 4
  title: "Financials"
  summary: "Flock Freight publicly describes a transaction-based Shared Truckload model priced by shipment space, with carrier-utilization metrics and a qualitative double-digit gross-margin signal. The assigned evidence does not disclose audited revenue, realized take rate, cash, burn, runway, working capital, debt, or current valuation, so financing adequacy remains ununderwritable from public data."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing"
    body: >-
      Flock Freight's public commercial model starts with shipper demand priced by linear foot or pallet rather than by a whole trailer [CI001]. The company says this produces average shipper savings of 20% versus truckload, but that is a marketing benchmark rather than realized customer pricing or reported revenue [CI002]. Its homepage says the network typically pools two to three shipments, while independent trade coverage describes instant Shared Truckload quotes [CI003, CI008]. Together, those facts support a transaction-based brokerage model in which better matching can improve trailer utilization. They do not establish whether Flock recognizes shipper billings gross or net, what portion of a quote is paid to carriers, or whether subscriptions are financially material. Those accounting and mix questions remain private-data diligence items rather than modeled assumptions.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-service-delivery"
    title: "Unit Economics and Service-Delivery Proxies"
    body: >-
      Public unit-economics evidence is strongest on carrier utilization, not on Flock's own contribution profit. Commercial Carrier Journal reported Flock's statement that STL AddOns increased carrier earnings by an average of 77% above the original booked load and doubled trailer utilization [CI004, CI005]. Flock separately advertises an additional $0.20 per mile and up to $200 more per day for selected shared loads [CI006, CI007]. These are carrier outcomes with explicit denominators; they are not Flock revenue, gross profit, or cash flow. A 2025 investor statement described a consistently growing double-digit gross-margin profile, but supplied no exact percentage, period series, accounting definition, or audited reconciliation [CI012]. Historical company-issued service metrics provide operating-quality proxies, while CAC, payback, retention, claims expense, and carrier-procurement costs remain undisclosed.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI012"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy"
    title: "Capital Adequacy and Financing Dependency"
    body: >-
      The latest disclosed financing in the assigned evidence is a $60 million Series E completed in May 2025 [CI009]. Independent databases place cumulative funding at approximately $459 million to $460 million across six rounds, a small source discrepancy that should not be converted into false precision [CI010]. Flock said the new capital supported long-term stability, Shared Truckload expansion, integrations, security, pooling improvements, and hiring [CI011]. Funding raised is not cash available: none of these sources reports the October 2026 cash balance, monthly burn, runway, debt, project-finance obligations, or liquidation preferences. The company therefore still depends on private financial access to demonstrate capital adequacy. FreightWaves' description of rising costs, inefficient capacity, margin erosion, and sector consolidation makes that missing liquidity evidence financially material rather than merely administrative [CI013].
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI013"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Verdict and Diligence Blockers"
    body: >-
      The public evidence supports a plausible margin mechanism: charge shippers for used space, pool compatible shipments, and improve carrier asset utilization without claiming that carrier uplift equals Flock economics [CI001, CI003, CI004, CI005]. It also shows a historical improvement in shipment-matching speed and company-reported service quality, which may support lower operating friction and claims exposure [CI014, CI015, CI016]. The underwriting conclusion remains cautious because the evidence does not quantify gross billings, recognized revenue, gross profit dollars, realized gross margin, CAC, payback, customer concentration, working capital, or free cash flow. No precise runway or profitability conclusion is supportable. The next diligence step is a bridge from shipment activity to shipper billings, carrier payments, gross profit, operating expenses, working capital, and cash, reconciled to audited statements and the latest capitalization table.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI014"
      - "CI015"
      - "CI016"
