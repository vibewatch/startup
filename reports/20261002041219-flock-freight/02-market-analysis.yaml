callouts:
  - calloutType: "insight"
    title: "The Freight Inefficiency Dilemma: Paying for Air vs Paying for Damage"
    body: "The core economic driver for Shared Truckload is the failure of legacy freight archetypes to serve shipments between 10 and 44 linear feet. In standard LTL networks, 1 in 51 shipments results in a damage claim averaging $3,777, while FTL forces shippers to leave 29 to 34 feet of trailer space empty. By algorithmically matching complementary partials into untouched direct transit, Flock converts deadhead and empty deck space into shipper cost savings and carrier margin."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM009"
  - calloutType: "risk"
    title: "Macro Freight Recession and Route Density Bottlenecks"
    body: "While the addressable market of underutilized freight is theoretically vast, algorithmic load-pooling requires extreme spatial and temporal lane density. During prolonged freight downturns where baseline truckload spot rates plummet, shippers face reduced financial urgency to consolidate, while depressed carrier rates compress the gross spread Flock can capture between consolidated shipper billing and carrier compensation."
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM012"
      - "CM014"
