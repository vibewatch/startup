company:
  name: "Flock Freight"
chapter:
  number: 7
  title: "Risks"
  summary: "Flock Freight's shared truckload model shifts primary cargo loss liabilities and transit delays onto third-party motor carriers under broker operating rules, yet faces structural freight fraud exposure, regulatory disclosure burdens, and working capital risk. While algorithmic pooling delivers reported 20% shipper savings and less than 0.001% claim rates, high-value freight exclusions and strict limitation-of-liability terms leave residual legal, operational, and counterparty risks."
sections:
  - id: "regulatory-and-legal-risk-governance"
    title: "Regulatory and Legal Risk Governance"
    body: "Flock Freight operates under Federal Motor Carrier Safety Administration (FMCSA) property broker operating authority Docket Number MC33945, explicitly contracting out of direct common-carrier liability. Under its standard customer terms and conditions updated in April 2026, the company specifies that it provides property brokerage and logistics intermediary services rather than motor carriage or freight forwarding. Consequently, direct cargo loss, damage, theft, and transit delays are governed by the Carmack Amendment (49 U.S.C. 14706) and adjudicated directly against third-party motor carriers, subject to strict per-trailer liability caps of $100,000 prorated by linear feet utilized. The platform further insulates itself by capping total corporate liability to the greater of $500 or trailing 12-month net brokerage revenue, while mandating binding arbitration in San Diego County under Transportation ADR Council rules. Beyond core broker-carrier liability, the company faces growing environmental and ESG regulatory compliance obligations, including California Senate Bill 253 (SB 253) and proposed SEC climate disclosure rules, which require audit-grade validation of its Scope 3 freight emissions avoidance formulas and carbon offset programs."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
  - id: "operational-cybersecurity-and-cargo-theft-exposure"
    title: "Operational, Cybersecurity, and Cargo Theft Exposure"
    body: "Operational integrity across shared truckload shipments hinges on preventing cargo theft, identity fraud, and execution failures across multi-stop routes. In response to industry-wide surges in fraudulent carrier pickups and strategic freight theft, Flock Freight mandates carrier identity verification through Highway, enforces multi-factor authentication (MFA) across shipper and carrier portals, and deploys Crowdstrike endpoint threat detection. The company reported a 2.93% employee phish-prone benchmark in 2023, outperforming the transportation industry average of 8.5%. Nonetheless, shared truckloads introduce unique physical and algorithmic failure modes. Unlike sealed single-stop truckloads, pooling two to three distinct shipper consignments on one trailer requires multi-stop sequencing and driver handling without intermediate cross-docking. To restrict operational risk, Flock Freight's customer agreement expressly bans hazardous materials, temperature-controlled perishables, live animals, alcohol, pharmaceuticals, and high-value cargo exceeding $100,000, meaning any unauthorized tender of excluded commodities creates severe uninsurable liabilities."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "counterparty-carrier-and-financial-model-risks"
    title: "Counterparty, Carrier, and Financial Model Risks"
    body: "Flock Freight's business model balances credit and working capital exposures between spot shippers and independent motor carriers. Shippers receive standard 30-day invoice payment terms backed by continuing general liens on freight in transit, while self-service portal users face automatic credit card billing three days post-delivery and 12% annual interest on overdue balances. On the supply side, Flock Freight contracts primarily with small-to-midsize fleets and owner-operators operating 53-foot dry vans and box trucks, utilizing financial incentives such as $0.20 per mile rate premiums and STL AddOns to ensure multi-stop acceptance. However, carrier agreements contain unilateral rate-reduction clauses when pooled partner loads are missed or cancelled, creating carrier dissatisfaction and potential network attrition during freight recessions. Having raised $459.7 million in cumulative venture capital through a $60 million Series E round in May 2025, Flock Freight remains dependent on sustained shipment liquidity to achieve double-digit gross margins and fund algorithms engineering without dilutive recapitalization."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
