chapter:
  number: 1
  title: "Company Overview"
  summary: "Flock Freight is an Encinitas/Solana Beach, California-based freight technology company and certified B Corporation founded in 2015 by CEO Oren Zaslansky. The company pioneered the patented Shared Truckload (STL) category, pooling partial freight shipments into multi-stop full truckloads to bypass traditional hub-and-spoke terminals while accumulating over $450 million in venture funding."
sections:
  - id: "executive-summary-identity"
    title: "Corporate Identity, Operating Model, and Governance"
    body: "Flock Freight (originally incorporated as AuptiX in 2014 and founded operationally in 2015) is a freight logistics technology brokerage headquartered in Solana Beach and Encinitas, California. The enterprise operates as a digital freight broker focused on Shared Truckload (STL) solutions, an operating mode designed to eliminate cross-dock terminals and the damage, delays, and carbon emissions characteristic of traditional hub-and-spoke Less-Than-Truckload (LTL) networks. Founder and Chief Executive Officer Oren Zaslansky previously founded a 125-truck freight fleet at age 21 and established SolSource Logistics before starting Flock Freight. The company holds Certified B Corporation status and maintains a formal corporate governance board featuring representatives from major venture backers, including Dean Carlson of Susquehanna International Group who joined the board in connection with the company's 2025 Series E financing round."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
      - "TO002"
  - id: "capitalization-and-funding-history"
    title: "Capitalization, Financing Trajectory, and Valuation History"
    body: "Flock Freight has completed six private equity and venture financing rounds spanning Seed through Series E, accumulating over $450 million in total equity financing according to secondary market tracking platforms and press records. The company secured a $50 million Series B round in February 2020 co-led by SignalFire and GLP Capital Partners, followed by an October 2021 Series D led by SoftBank Vision Fund 2 that raised $215 million at a peak post-money valuation of $1.4 billion (establishing unicorn status). In May 2025, amidst broader freight market contraction and venture sector down-rounds, Flock Freight secured a $60 million Series E round led by O'Neil Strategic Capital with participation from Susquehanna Private Equity Investments, SignalFire, GLP Capital Partners, and Bracket Capital. While the Series E provided essential operating capital to support continued engineering and carrier integrations, the transaction did not disclose an updated valuation, establishing an ongoing transparency gap regarding liquidation preference structure and post-2021 equity valuation."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "core-value-proposition-and-industry-pressures"
    title: "Shared Truckload Value Proposition and Freight Market Headwinds"
    body: "The core technical and commercial thesis of Flock Freight centers on Shared Truckload (STL) route matching. The company's optimization engine evaluates more than 3 trillion freight combinations in real time to pool two to three compatible partial shipments into a single 48-foot or 53-foot dry van or refrigerated trailer. For commercial shippers, Flock Freight advertises up to 20% cost savings compared to paying for empty full truckload space, supported by an on-time delivery rate of 97.5% and damage claims below 0.001% due to terminal bypass. For motor carriers, Flock Freight advertises load earnings increases of up to 20% and an additional $0.20 per mile, alongside an STL AddOns feature that reports up to 77% higher carrier earnings. However, the business operates against severe macro freight headwinds: the broader FreightTech and digital brokerage sector has suffered significant margin erosion, persistent volume softness, and high-profile competitor insolvencies following the 2021-2022 freight cycle peak. Operating in a capital-intensive brokerage environment without publicly disclosed revenue or net profitability metrics requires ongoing diligence around financial runway and unit economics."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO014"
      - "CO015"
      - "CO016"
