  - id: TV001
    title: Recommendation and Diligence Decision Framework
    columns:
      - Pillar
      - Evaluation
      - Key Evidence & Benchmark
      - Strategic / Diligence Implication
    rows:
      - - Recommendation
        - track
        - Series D peak of $1.3B unverified in 2025-2026 freight climate; Series E raised without valuation
        - Avoid new equity commitments until audited gross/net revenue and churn are disclosed
      - - Confidence Level
        - medium
        - Consistent primary corroboration on funding history, but zero public visibility into audited financials
        - Confidence constrained by private disclosure profile and absence of public financial filings
      - - Risk Rating
        - high
        - Cyclical freight recession exposure, broker liability, carrier retention, and preference stack overhang
        - Requires stress-testing carrier availability and downside protections against liquidation waterfall
      - - Valuation Stance
        - stretched
        - 2021 Series D post-money mark of $1.3B implies unsustainable multiples against estimated net revenue
        - Substantial valuation write-down likely required for secondary or next-round equity pricing
      - - Decision Threshold
        - Hold / Diligence Gate
        - Sustained double-digit gross margins and top-10 customer concentration below 30% required for re-rating
        - Request formal disclosure of Series E liquidation preference stack and 2024-2025 audited GAAP statements
    notes: Framework summarizes core investment parameters based on public capital raises and freight market conditions.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
  - id: TV002
    title: Investment Thesis versus Anti-Thesis Matrix
    columns:
      - Dimension
      - Thesis Argument (Bull Driver)
      - Anti-Thesis Argument (Bear Risk)
      - What Would Change the View
    rows:
      - - Category Creation
        - Patented shared truckload algorithms solve structural waste in 10-44 ft partial shipments
        - Shared truckload remains an operational niche vulnerable to standard LTL discount pricing
        - Independent carrier adoption audits proving STL sustains market share during soft markets
      - - Unit Economics
        - Linear-foot pricing saves shippers 20% while carrier STL AddOns yield up to $0.20/mile more
        - Multi-stop dwell times, driver detention fees, and missed pools erode platform gross margins
        - Disclosure of verified net revenue take-rate and contribution margin per hauled mile
      - - Service Quality
        - Terminal-free transit achieves 97.5% on-time delivery and damage rates under 0.001%
        - Guaranteed delivery windows impose severe penalty liabilities during severe weather or lane disruption
        - Third-party claims audit verifying damage payouts and shipper SLA refund dispute frequency
      - - Capital Discipline
        - Successfully closed $60M Series E in 2025 to fund expansion amidst protracted freight downturn
        - Complete omission of Series E valuation marks points to defensive financing with aggressive terms
        - Disclosure of Series E post-money valuation, coupon, participation rights, and liquidation seniority
    notes: Comparison of core value drivers against operating headwinds identified across diligenced sources.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
