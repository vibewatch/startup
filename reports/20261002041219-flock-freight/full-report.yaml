  - id: FR001
    title: Risk Heatmap and Mitigation Matrix
    type: matrix
    summary: >-
      Evaluation of key operational, legal, counterparty, and financial risks by likelihood, severity, and mitigation
      posture.
    data:
      columns:
        - Likelihood
        - Impact Severity
        - Mitigation Maturity
        - Residual Stance
      rows:
        - label: Shipper Common Carrier Liability Claims
          values:
            - label: low
              tone: positive
              detail: Operating strictly as property broker under MC33945 disclaims direct carriage.
            - label: critical
              tone: negative
              detail: Shipper reclassification attempts could expose brokerage to direct catastrophic cargo claims.
            - label: established
              tone: positive
              detail: Standard terms and ADR arbitration explicitly pass liability to third-party motor carriers.
            - label: low
              tone: positive
              detail: Residual corporate exposure legally capped at trailing 12-month net revenue or $500.
        - label: Strategic Freight Identity Fraud
          values:
            - label: medium
              tone: warning
              detail: Industry-wide surge in sophisticated fraudulent carrier pickups and double-brokering.
            - label: high
              tone: negative
              detail: Unrecovered freight theft damages shipper confidence and carrier network integrity.
            - label: advanced
              tone: positive
              detail: Mandatory Highway identity verification and platform multi-factor authentication.
            - label: medium
              tone: warning
              detail: Residual vulnerability to spoofed credentials and social engineering.
        - label: Prohibited Goods Tender & Contamination
          values:
            - label: medium
              tone: warning
              detail: Shippers may inadvertently or deceptively tender hazmat, breakables, or perishables.
            - label: high
              tone: negative
              detail: Contamination of co-loaded dry freight creates multi-party cross-claim liabilities.
            - label: moderate
              tone: warning
              detail: Contractual exclusions and per-trailer $100,000 cargo coverage caps.
            - label: medium
              tone: warning
              detail: Absence of physical cross-dock inspection makes platform reliant on shipper honesty.
        - label: Motor Carrier Attrition / Load Rejection
          values:
            - label: medium
              tone: warning
              detail: Small fleets may reject multi-stop route complexity during tight freight cycles.
            - label: critical
              tone: negative
              detail: Pooling failure forces single-shipment movement at steep margin losses.
            - label: moderate
              tone: warning
              detail: $0.20/mile rate premium and STL AddOns optimize driver routing economics.
            - label: high
              tone: negative
              detail: Unilateral rate reduction clauses when partner loads drop risk carrier churn.
        - label: Liquidation Preference and Capital Overhang
          values:
            - label: high
              tone: negative
              detail: Over $459.7M cumulative venture capital raised creates high exit valuation hurdle.
            - label: high
              tone: negative
              detail: Sub-scale exit or down-round recaps impair common equity value.
            - label: early
              tone: warning
              detail: Series E funding cushion and pursuit of double-digit gross margins.
            - label: high
              tone: negative
              detail: Sustained high interest rates and freight recession limit IPO and buyout multiples.
        - label: Emissions Reporting Audit Scrutiny
          values:
            - label: high
              tone: negative
              detail: California SB 253 and SEC climate disclosure rules mandate verified Scope 3 data.
            - label: medium
              tone: warning
              detail: Greenwashing accusations or regulatory fines if carbon reduction algorithms misstate.
            - label: established
              tone: positive
              detail: Standardized EPA SmartWay and GHG Protocol calculation models.
            - label: low
              tone: positive
              detail: Algorithmic emissions math provides auditable compliance documentation.
    approximationNotes: Likelihood and severity scored from contract terms, market disclosures, and freight industry standards.
    claimRefs:
