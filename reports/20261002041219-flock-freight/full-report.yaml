      - number: '6.3'
        title: Named Customer Deployments and Case Proof
        blocks:
          - type: paragraph
            body: >-
              Publicly verified enterprise customer references for Flock Freight are sparse but include sporting goods
              retailer Academy Sports, which reported saving 16% on underutilized truckload shipments through shared
              truckload routing. Historical case studies also reference craft beverage producer Stone Brewing utilizing
              shared truckloads for regional distribution. While these case references demonstrate production adoption
              among consumer retail and food-and-beverage shippers, broader enterprise customer disclosures are heavily
              mediated through company marketing rather than independent buyer case studies. On the carrier side,
              testimonials from small logistics operators such as J&P Logistics indicate operational satisfaction with
              load-booking simplicity and multi-stop rate premiums, yet comprehensive carrier retention or churn
              statistics are not publicly reported.
            claimRefs:
              - CU009
