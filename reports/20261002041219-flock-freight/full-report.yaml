  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Service Modalities
        blocks:
          - type: paragraph
            body: >-
              Flock Freight provides terminal-free freight shipping services designed to replace traditional
              hub-and-spoke less-than-truckload (LTL) handling with direct shared truckload (STL) routing. Through its
              primary commercial solution, FlockDirect, the platform allows commercial shippers to purchase dedicated
              trailer capacity priced on linear-foot or pallet bases rather than booking an entire full truckload or
              submitting shipments to multi-terminal cross-dock operations. By eliminating physical transshipment at
              consolidation hubs, shipments remain loaded on a single trailer driven by a single carrier from pickup to
              destination. In addition to primary shared truckload booking, the company provides automated capacity
              utilization tools for transportation providers, including STL AddOns, which programmatically identifies
              compatible partial freight to top off underutilized trailers already under contract.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
