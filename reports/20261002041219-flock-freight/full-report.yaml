      - number: '7.3'
        title: Counterparty, Carrier, and Financial Model Risks
        blocks:
          - type: paragraph
            body: >-
              Flock Freight's business model balances credit and working capital exposures between spot shippers and
              independent motor carriers. Shippers receive standard 30-day invoice payment terms backed by continuing
              general liens on freight in transit, while self-service portal users face automatic credit card billing
              three days post-delivery and 12% annual interest on overdue balances. On the supply side, Flock Freight
              contracts primarily with small-to-midsize fleets and owner-operators operating 53-foot dry vans and box
              trucks, utilizing financial incentives such as $0.20 per mile rate premiums and STL AddOns to ensure
              multi-stop acceptance. However, carrier agreements contain unilateral rate-reduction clauses when pooled
              partner loads are missed or cancelled, creating carrier dissatisfaction and potential network attrition
              during freight recessions. Having raised $459.7 million in cumulative venture capital through a $60
              million Series E round in May 2025, Flock Freight remains dependent on sustained shipment liquidity to
              achieve double-digit gross margins and fund algorithms engineering without dilutive recapitalization.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR011
              - CR012
