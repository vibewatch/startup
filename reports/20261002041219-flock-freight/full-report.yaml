      - number: '1.3'
        title: Shared Truckload Value Proposition and Freight Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              The core technical and commercial thesis of Flock Freight centers on Shared Truckload (STL) route
              matching. The company's optimization engine evaluates more than 3 trillion freight combinations in real
              time to pool two to three compatible partial shipments into a single 48-foot or 53-foot dry van or
              refrigerated trailer. For commercial shippers, Flock Freight advertises up to 20% cost savings compared to
              paying for empty full truckload space, supported by an on-time delivery rate of 97.5% and damage claims
              below 0.001% due to terminal bypass. For motor carriers, Flock Freight advertises load earnings increases
              of up to 20% and an additional $0.20 per mile, alongside an STL AddOns feature that reports up to 77%
              higher carrier earnings. However, the business operates against severe macro freight headwinds: the
              broader FreightTech and digital brokerage sector has suffered significant margin erosion, persistent
              volume softness, and high-profile competitor insolvencies following the 2021-2022 freight cycle peak.
              Operating in a capital-intensive brokerage environment without publicly disclosed revenue or net
              profitability metrics requires ongoing diligence around financial runway and unit economics.
            claimRefs:
              - CO005
              - CO006
              - CO014
              - CO015
              - CO016
