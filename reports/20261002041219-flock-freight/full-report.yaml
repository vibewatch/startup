      - number: '5.3'
        title: Deployment, Integration, and Reliability Controls
        blocks:
          - type: paragraph
            body: >-
              Flock Freight deploys its software platform across cloud infrastructure utilizing containerized
              orchestration, automated continuous integration pipelines, and distributed monitoring systems to maintain
              service availability. Shippers access services through a web platform or direct integrations with
              enterprise transportation management systems (TMS), while motor carriers interact via mobile-responsive
              portals and digital load boards. Because shipments bypass intermediate break-bulk terminals where damage
              commonly occurs during forklift cross-docking, the company claims damage rates below 0.001% alongside
              on-time delivery rates of 97.5%. Carrier onboarding integrates third-party compliance verification tools
              including Highway to validate operating authority, active safety scores, and insurance coverage prior to
              load dispatch.
            claimRefs:
              - CE010
              - CE011
