    title: 'Competitive Positioning Map: Mid-Size Freight Economics vs Service Reliability'
    type: quadrant
    summary: Evaluation of freight transportation modes across partial-capacity cost efficiency and cargo handling reliability.
    data:
      xAxis:
        label: Handling & Transit Reliability (Low Cross-Dock Rehandling to High Service Guarantee)
      yAxis:
