      - number: '3.3'
        title: Pricing Dynamics, Switching Friction, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The economic mechanism of shared truckload rests on price arbitrage between full truckload spot rates and
              volumetric LTL class-based tariffs [CP001, CP016]. Flock Freight prices its service based on linear-foot
              and pallet utilization, reporting average shipper savings of 20% compared to purchasing an entire
              dedicated truckload [CP002, CP016]. By providing truckload-level service without intermediate terminal
              cross-docking, Flock achieves on-time delivery rates of 97.5% and damage claim rates under 0.001%,
              supported by performance guarantees [CP005, CP016]. In contrast, LTL pricing structures impose opaque
              dimensional re-classification fees and fuel surcharges, while full truckload spot pricing penalizes
              underfilled trailers [CP003, CP016]. Despite these stated economic benefits, Flock faces meaningful
              competitive switching friction [CP008]. Carrier loyalty is inherently low in freight brokerage:
              owner-operators and small fleets routinely multi-home across multiple load boards (such as DAT,
              Truckstop.com, and Uber Freight), choosing loads strictly on immediate rate-per-mile and route convenience
              [CP007, CP014]. On the demand side, enterprise shippers rely on automated routing guides embedded in
              legacy TMS environments, which traditionally treat shipments as binary LTL or FTL orders [CP008, CP015].
              While Flock’s algorithmic pooling patents and B Corp certification provide initial differentiation,
              long-term defensibility requires scaling customer shipment density to sustain matching efficiency without
              incurring routing delays [CP001, CP006, CP012].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
