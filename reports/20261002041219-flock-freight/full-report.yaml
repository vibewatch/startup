    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Governance
        blocks:
          - type: paragraph
            body: >-
              Flock Freight (originally incorporated as AuptiX in 2014 and founded operationally in 2015) is a freight
              logistics technology brokerage headquartered in Solana Beach and Encinitas, California. The enterprise
              operates as a digital freight broker focused on Shared Truckload (STL) solutions, an operating mode
              designed to eliminate cross-dock terminals and the damage, delays, and carbon emissions characteristic of
              traditional hub-and-spoke Less-Than-Truckload (LTL) networks. Founder and Chief Executive Officer Oren
              Zaslansky previously founded a 125-truck freight fleet at age 21 and established SolSource Logistics
              before starting Flock Freight. The company holds Certified B Corporation status and maintains a formal
              corporate governance board featuring representatives from major venture backers, including Dean Carlson of
              Susquehanna International Group who joined the board in connection with the company's 2025 Series E
              financing round.
