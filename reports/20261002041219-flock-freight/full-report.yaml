      - number: '6.2'
        title: Adoption Trajectory and Operational Proof Points
        blocks:
          - type: paragraph
            body: >-
              Flock Freight claims thousands of commercial shippers move freight across its platform, but external
              verification of active accounts, shipment volume, and repeat usage rates remains limited. According to
              company research surveying 1,000 logistics decision-makers, 43% of truckload shipments moved partially
              empty in 2023, with shippers averaging 29 linear feet of unused deck space, while enterprise shippers paid
              up to $6.3 million annually in LTL damage and loss claims. The company positions its terminal-free
              FlockDirect pooled service as delivering an on-time pickup and delivery rate of 97.5% and a damage claim
              rate under 0.001%, compared to an industry LTL damage rate of 1.94%. Furthermore, carrier engagement tools
              such as STL AddOns report up to a 77% increase in carrier earnings and a 2x increase in trailer
              utilization, though audited volume disclosures are absent.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
