      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hubless Execution as a Structural Barrier to Handling Damage
            body: >-
              By orchestrating multi-stop freight routes algorithmically and preventing cargo from being offloaded at
              intermediary cross-docks, Flock Freight structurally removes the primary physical touchpoints responsible
              for cargo claims in standard LTL networks.
            calloutType: insight
            claimRefs:
              - CE001
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Flock Freight's commercial customer base is divided between shippers who tender multi-pallet freight and
              motor carriers who provide dry-van and refrigerated haulage capacity. On the shipper side, the primary
              economic buyers are transportation managers, logistics directors, and supply chain executives managing
              mid-sized freight between 10 and 44 linear feet. These shippers traditionally face an expensive dilemma:
              paying for an entire full truckload (FTL) to ensure rapid transit without intermediate handling, or
              booking less-than-truckload (LTL) service and risking terminal damage, reweigh fees, and delivery delays.
              On the carrier side, Flock Freight engages owner-operators and small-to-midsize fleets operating 53-foot
              dry vans and refrigerated trailers, offering them supplemental revenue by filling remaining linear deck
              space through shared truckload algorithms.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
