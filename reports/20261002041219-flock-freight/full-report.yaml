      - number: '6.4'
        title: Retention Dynamics and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Flock Freight's customer durability faces dual-sided retention and concentration challenges across
              volatile freight cycles. In contract terms, Flock Freight's standard broker-carrier agreements enforce
              strict operating rules, including mandatory 24-hour proof-of-delivery submission, full indemnity
              provisions, strict prohibitions against unauthorized re-brokering, and unilateral rate-reduction clauses
              for missed pools. Because shippers can tender loads spot-by-spot or via TMS integrations without long-term
              exclusivity, switching costs remain low when general truckload spot rates soften. The company has partner
              integrations with managed transportation and procurement providers to embed shared truckloads into
              enterprise workflows, but net revenue retention (NRR), gross revenue retention (GRR), and top-10 customer
              revenue concentration figures remain undisclosed private metrics.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Mid-Market Freight Dilemma
            body: >-
              Flock Freight captures economic surplus by targeting shipments that fall into the structural gap between
              10-foot LTL cutoffs and 53-foot FTL capacities, where shippers routinely pay full truckload rates to move
              air.
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
          - type: callout
            title: Absence of Audited Retention and Churn Disclosures
            body: >-
              While marketing materials report thousands of shippers and high carrier satisfaction, Flock Freight
              discloses neither customer churn rates nor cohort retention figures, leaving platform durability
              vulnerable during cyclical freight downturns.
            calloutType: risk
            claimRefs:
              - CU004
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Governance
        blocks:
          - type: paragraph
            body: >-
              Flock Freight operates under Federal Motor Carrier Safety Administration (FMCSA) property broker operating
              authority Docket Number MC33945, explicitly contracting out of direct common-carrier liability. Under its
              standard customer terms and conditions updated in April 2026, the company specifies that it provides
              property brokerage and logistics intermediary services rather than motor carriage or freight forwarding.
              Consequently, direct cargo loss, damage, theft, and transit delays are governed by the Carmack Amendment
              (49 U.S.C. 14706) and adjudicated directly against third-party motor carriers, subject to strict
              per-trailer liability caps of $100,000 prorated by linear feet utilized. The platform further insulates
              itself by capping total corporate liability to the greater of $500 or trailing 12-month net brokerage
              revenue, while mandating binding arbitration in San Diego County under Transportation ADR Council rules.
              Beyond core broker-carrier liability, the company faces growing environmental and ESG regulatory
              compliance obligations, including California Senate Bill 253 (SB 253) and proposed SEC climate disclosure
              rules, which require audit-grade validation of its Scope 3 freight emissions avoidance formulas and carbon
              offset programs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
