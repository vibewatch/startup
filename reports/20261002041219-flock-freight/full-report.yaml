      - number: '5.2'
        title: Core Pooling Architecture and Algorithmic Matching
        blocks:
          - type: paragraph
            body: >-
              The core technological differentiation of Flock Freight centers on its algorithmic freight pooling engine,
              which evaluates complex combinatorial routing options across carrier networks in real time. Rather than
              relying on static lane schedules, the engine evaluates freight characteristics including geographic
              coordinates, transit time constraints, commodity compatibility, and trailer dimensions to generate
              consolidated multi-stop itineraries. Backend systems orchestrate optimization workflows using
              microservices implemented in Java, Spring Boot, and Python, communicating through REST and gRPC interfaces
              with asynchronous messaging for distributed transaction handling. Fleet operations integrate with
              telematics and IoT platforms for vehicle tracking, while relational databases maintain operational state
              across booking, dispatch, and billing lifecycles.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
