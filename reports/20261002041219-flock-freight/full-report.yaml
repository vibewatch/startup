              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing in the assigned evidence is a $60 million Series E completed in May 2025
              [CI009]. Independent databases place cumulative funding at approximately $459 million to $460 million
              across six rounds, a small source discrepancy that should not be converted into false precision [CI010].
              Flock said the new capital supported long-term stability, Shared Truckload expansion, integrations,
              security, pooling improvements, and hiring [CI011]. Funding raised is not cash available: none of these
              sources reports the October 2026 cash balance, monthly burn, runway, debt, project-finance obligations, or
              liquidation preferences. The company therefore still depends on private financial access to demonstrate
              capital adequacy. FreightWaves' description of rising costs, inefficient capacity, margin erosion, and
              sector consolidation makes that missing liquidity evidence financially material rather than merely
              administrative [CI013].
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible margin mechanism: charge shippers for used space, pool compatible
              shipments, and improve carrier asset utilization without claiming that carrier uplift equals Flock
              economics [CI001, CI003, CI004, CI005]. It also shows a historical improvement in shipment-matching speed
              and company-reported service quality, which may support lower operating friction and claims exposure
              [CI014, CI015, CI016]. The underwriting conclusion remains cautious because the evidence does not quantify
              gross billings, recognized revenue, gross profit dollars, realized gross margin, CAC, payback, customer
              concentration, working capital, or free cash flow. No precise runway or profitability conclusion is
              supportable. The next diligence step is a bridge from shipment activity to shipper billings, carrier
              payments, gross profit, operating expenses, working capital, and cash, reconciled to audited statements
              and the latest capitalization table.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Raised Does Not Establish Runway
            body: >-
              The May 2025 Series E and cumulative funding totals show historical financing access, but none of the
              assigned sources reports current cash, burn, debt, working-capital needs, or remaining proceeds. Runway
              therefore remains a material diligence gap rather than an estimable public metric.
            calloutType: risk
            claimRefs:
