              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Cargo Liability Shift
            body: >-
              Flock Freight's standard terms legally disclaim motor carrier status and cap platform liability at the
              trailing 12-month net brokerage revenue or $500, forcing shippers to pursue third-party motor carriers
              directly for cargo damage or transit delays.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: Operational Fraud and Verification Gateways
            body: >-
              With transportation fraud escalating nationwide, Flock Freight's mandatory Highway carrier onboarding and
              multi-factor authentication serve as critical gatekeepers against double-brokering and fraudulent freight
              theft.
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Flock Freight presents a compelling technological premise in North American freight logistics: utilizing
              patented multi-stop pooling algorithms to consolidate partial truckload freight into shared truckloads
              (STL), bypassing conventional less-than-truckload (LTL) cross-dock terminals. Proponents highlight that
              this hubless architecture protects fragile cargo, achieves an on-time delivery rate exceeding 97%, and
              provides shippers with linear-foot pricing that saves up to 20% compared to dedicated full truckloads.
              Furthermore, carrier partners gain an opportunity to top off underutilized trailers, generating up to
              $0.20 more per mile or $200 per day in supplemental revenue. However, the investment anti-thesis centers
              on extreme financial opacity and cyclical vulnerability. Flock Freight operates within an asset-light
              brokerage framework subject to prolonged freight recessions and spot-rate deflation. Without audited gross
              merchandise volume (GMV), net revenue retention, or unit contribution margins, outside investors cannot
              determine whether algorithmic pooling achieves sustainable gross margins or merely subsidizes unprofitable
              multi-stop transit.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
      - number: '8.2'
        title: Capitalization History and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              Flock Freight has raised approximately $399 million to $459 million in cumulative equity financing across
              five institutional venture rounds. The company's capitalization apex occurred in October 2021, when
              SoftBank Vision Fund 2 led a $215 million Series D financing round that priced the business at a $1.3
              billion post-money valuation (reported by some secondary market trackers at $1.0 billion pre-money or $1.4
              billion enterprise value). This financing followed a $113.5 million Series C in late 2020 at a $460
              million to $500 million post-money mark and a $50 million Series B in early 2020. However, subsequent
              freight downturns altered market dynamics. In May 2025, Flock Freight secured a $60 million Series E round
              led by O'Neil Strategic Capital with participation from Susquehanna Private Equity Investments,
              SignalFire, GLP Capital Partners, and Bracket Capital. Crucially, the company withheld the Series E
              post-money valuation, liquidation preference terms, and share seniority structure. This silence strongly
              suggests a flat round, structured downside protections, or an unannounced down-round relative to its 2021
              bull-market peak.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV011
              - CV016
      - number: '8.3'
        title: Scenario Valuation Modeling and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Due to the absence of verified GAAP revenue disclosures, valuation modeling must be anchored on comparable
              logistics technology multiples and scenario-based operating performance. In our bull-case scenario, Flock
              Freight re-accelerates STL enterprise adoption across Fortune 500 supply chains, expanding net revenue
              toward $200 million while defending high-teens gross margins; at an enterprise-value multiple of 3.0x to
              4.0x net revenue, this yields an enterprise valuation range of $600 million to $800 million. In the
              base-case scenario, persistent shipper pricing resistance, carrier routing complexities, and sluggish
              freight volume cap net revenue near $100 million to $130 million; applying market-aligned digital
              brokerage multiples of 1.5x to 2.2x net revenue implies an enterprise value of $150 million to $285
              million, representing a substantial discount to the $1.3 billion Series D headline. In the bear-case
              scenario, ongoing freight rate deflation, carrier churn, and debt service on preference stacks force a
              distressed recapitalization or asset sale under $100 million. Downside triggers include continued opacity
              regarding Series E preference seniority, senior leadership turnover, or loss of primary carrier capacity.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Comparable Benchmarking, Diligence Checklist, and Investment Stance
        blocks:
          - type: paragraph
            body: >-
              Public and private comparables provide sobering context for Flock Freight's valuation expectations.
              Traditional asset-based LTL and truckload operators trade at 0.8x to 1.8x revenue and 6.0x to 10.0x
              EBITDA, whereas digital logistics aggregators such as Flexport, Loadsmart, and Arrive Logistics have
              experienced significant valuation compression from 2021 pandemic highs. Private market aggregators report
              third-party revenue estimates of $646.5 million for Flock Freight with approximately 360 employees and
              2,000 customers; however, this gross revenue figure represents unvetted gross freight billings rather than
              high-margin software revenue. Zaslansky has also emphasized caution regarding M&A, noting that 75% to 80%
              of acquisitions destroy value, which limits inorganic exit optionality. Consequently, our recommendation
              is track with a high risk rating and stretched valuation stance. Unlocking a buy stance would require
              primary verification of audited GAAP net revenue, proof of sustained double-digit gross margins through
              the freight cycle, and complete transparency into the Series E liquidation preference waterfall.
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track Stance Pending Audited Financial Disclosure
            body: >-
              Investors should maintain a track posture on Flock Freight rather than committing growth capital at
              historical marks. Entry discipline demands a renegotiated enterprise valuation reflecting post-2022
              freight realities rather than the unvalidated $1.3 billion Series D peak.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
              - CV012
          - type: callout
            title: Liquidation Preference Overhang from Series E Extension
            body: >-
              The undisclosed valuation and liquidation terms of the May 2025 $60 million Series E round create
              substantial risk of senior preference overhang, potentially impairing common shareholders and
              earlier-round venture investors in exit scenarios below $1.0 billion.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV013
