      - number: '4.2'
        title: Unit Economics and Service-Delivery Proxies
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is strongest on carrier utilization, not on Flock's own contribution
              profit. Commercial Carrier Journal reported Flock's statement that STL AddOns increased carrier earnings
              by an average of 77% above the original booked load and doubled trailer utilization [CI004, CI005]. Flock
              separately advertises an additional $0.20 per mile and up to $200 more per day for selected shared loads
              [CI006, CI007]. These are carrier outcomes with explicit denominators; they are not Flock revenue, gross
              profit, or cash flow. A 2025 investor statement described a consistently growing double-digit gross-margin
              profile, but supplied no exact percentage, period series, accounting definition, or audited reconciliation
              [CI012]. Historical company-issued service metrics provide operating-quality proxies, while CAC, payback,
              retention, claims expense, and carrier-procurement costs remain undisclosed.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
