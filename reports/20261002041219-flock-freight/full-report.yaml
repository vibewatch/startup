  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The North American surface freight market divides traditionally into Full Truckload (FTL) and
              Less-Than-Truckload (LTL) operating archetypes. Traditional LTL operates an infrastructure-intensive
              hub-and-spoke terminal network that consolidates palletized freight across regional breakbulk cross-docks.
              While suitable for 1-to-6 pallet consignments, this handling structure exposes freight to terminal
              re-handling, unpredictable accessorial charges, and transit variability. Conversely, FTL provides direct,
              sealed transit but requires paying for the entire 48-foot or 53-foot trailer regardless of utilization.
              Flock Freight defines Shared Truckload (STL) as a hubless middle tier that pools multiple mid-sized
              partial shipments (typically 10 to 44 linear feet or 2 to 3 distinct shipper orders) into a single direct
              truckload. By eliminating cross-dock facilities and intermediate re-handling, STL competes for
              underutilized FTL volume and high-value, damage-sensitive LTL freight while remaining distinct from parcel
              delivery, drayage, and temperature-controlled bulk transport.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing, Trailer Utilization, and Shipper Losses
        blocks:
          - type: paragraph
            body: >-
              Industry market sizing historically placed North American freight logistics above $65B in primary
              addressable spend, with broader trucking markets exceeding hundreds of billions in aggregate linehaul
              expenditure. Within this broader universe, the addressable economic pool for algorithmic pooling is
              defined by pervasive trailer underutilization and avoidable mode-switching penalties. Empirical industry
              survey data indicates that 43% of truckloads in 2023 and up to 58% in 2024 moved partially empty,
              stranding an average of 29 to 34 linear feet of usable trailer deck space per partial load. Shippers
              trapped between rigid 10-foot LTL cutoffs and high truckload minimums frequently absorb either wasted
              trailer space or punitive terminal re-handling costs. Enterprise shippers in LTL networks experienced
              average claim costs of $3,777 per damaged shipment and up to $6.3M in annual loss and damage expenses,
              compounded by up to $2.3M in unexpected accessorial surcharges. These quantifiable cost penalties create
              an addressable economic wedge that justifies algorithmic consolidation software.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
