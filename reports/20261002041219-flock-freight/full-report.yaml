      points:
        - label: Flock Freight (STL)
          x: 8.5
          'y': 8.8
          note: Patented algorithmic pooling eliminates terminal rehandling while optimizing deck space cost
        - label: Digital FTL Brokers
          x: 7.8
          'y': 3.5
          note: High transit reliability and speed, but severe cost penalty for moving partial truckloads
        - label: Legacy Hub LTL
          x: 3.2
          'y': 4.8
          note: Acceptable pricing for 1–4 pallets, but high damage claim risk and hub transit delays
        - label: Traditional 3PL Brokerage
          x: 6.2
          'y': 5.2
          note: Broad capacity access across modes, but manual consolidation yields inconsistent outcomes
        - label: Shipper Status Quo (In-House FTL)
          x: 7.2
          'y': 2.5
          note: High schedule control, but severe margin erosion from shipping empty trailer air
        - label: Shipper Status Quo (Volume LTL)
          x: 4
          'y': 5.5
          note: Fills mid-size gap via carriers, but subject to unpredictable terminal delay and re-handling
    approximationNotes: >-
