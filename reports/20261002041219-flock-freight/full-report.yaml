              - CR005
              - CR010
      - number: '7.2'
        title: Operational, Cybersecurity, and Cargo Theft Exposure
        blocks:
          - type: paragraph
            body: >-
              Operational integrity across shared truckload shipments hinges on preventing cargo theft, identity fraud,
              and execution failures across multi-stop routes. In response to industry-wide surges in fraudulent carrier
              pickups and strategic freight theft, Flock Freight mandates carrier identity verification through Highway,
              enforces multi-factor authentication (MFA) across shipper and carrier portals, and deploys Crowdstrike
              endpoint threat detection. The company reported a 2.93% employee phish-prone benchmark in 2023,
              outperforming the transportation industry average of 8.5%. Nonetheless, shared truckloads introduce unique
              physical and algorithmic failure modes. Unlike sealed single-stop truckloads, pooling two to three
              distinct shipper consignments on one trailer requires multi-stop sequencing and driver handling without
              intermediate cross-docking. To restrict operational risk, Flock Freight's customer agreement expressly
              bans hazardous materials, temperature-controlled perishables, live animals, alcohol, pharmaceuticals, and
              high-value cargo exceeding $100,000, meaning any unauthorized tender of excluded commodities creates
              severe uninsurable liabilities.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
