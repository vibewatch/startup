      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Carrier Multi-Homing and Algorithmic Execution Vulnerability
            body: >-
              Flock Freight's core value proposition requires seamless algorithmic pairing of multi-stop freight routes
              across independent motor carriers. Because owner-operators and small fleets multi-home aggressively across
              load boards and prioritize simple single-stop dispatches during tight capacity markets, Flock must
              continuously offer superior rate premiums ($0.20/mile extra) to prevent carriers from defecting to
              conventional single-point truckload loads.
            calloutType: risk
            claimRefs:
              - CP007
              - CP013
              - CP014
          - type: callout
            title: The Terminal-Free Moat vs Enterprise TMS Workflow Friction
            body: >-
              Flock Freight's sub-0.001% damage rate and 20% cost savings create an undeniable economic wedge against
              legacy LTL carriers burdened by physical hub networks. However, the primary competitive hurdle remains
              workflow inertia: until shared truckload is integrated natively as an automated execution mode inside
              enterprise TMS systems, adoption requires consultative sales cycles that slow enterprise penetration.
            calloutType: insight
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Flock Freight's public commercial model starts with shipper demand priced by linear foot or pallet rather
              than by a whole trailer [CI001]. The company says this produces average shipper savings of 20% versus
              truckload, but that is a marketing benchmark rather than realized customer pricing or reported revenue
              [CI002]. Its homepage says the network typically pools two to three shipments, while independent trade
              coverage describes instant Shared Truckload quotes [CI003, CI008]. Together, those facts support a
              transaction-based brokerage model in which better matching can improve trailer utilization. They do not
              establish whether Flock recognizes shipper billings gross or net, what portion of a quote is paid to
              carriers, or whether subscriptions are financially material. Those accounting and mix questions remain
              private-data diligence items rather than modeled assumptions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
