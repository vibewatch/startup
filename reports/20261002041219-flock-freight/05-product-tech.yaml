  - id: TE002
    title: Freight Pooling Workflow and Use Case Operating Dynamics
    columns:
      - User Operational Job
      - Legacy Freight Workflow
      - Flock Freight Technical Solution
      - Measurable Operational Benefit
      - Technical Limitation / Risk
    rows:
      - - Mid-volume freight transit (10-44 linear ft)
        - Book full truckload or traditional hub-and-spoke LTL
        - Algorithmic shared truckload pooling into direct haul
        - Shippers pay only for deck space occupied (20% claimed savings)
        - Matching depends on network liquidity and density in freight corridor
      - - Carrier capacity optimization on linehaul
        - Haul partial truckload with dead space or wait for freight
        - STL AddOns continuous scanning for compatible freight
        - Claimed 77% higher earnings and 2x trailer space utilization
        - Route deviations and multi-stop delivery driver delays
      - - High-value or fragile commodity transit
        - Multi-terminal cross-dock handling with forklifts
        - Terminal-free direct route with single driver
        - Claimed damage rate reduction to under 0.001%
        - Exclusion of hazmat, refrigerated, and temperature-sensitive goods
      - - Carrier compliance and onboarding
        - Manual phone vetting, insurance checks, and paper packet review
        - Integrated digital onboarding via Highway verification
        - Carrier verification completed in under five minutes
        - Vulnerability to carrier fraud or digital identity compromise
    notes: Workflow comparisons contrast traditional LTL hub-and-spoke mechanisms against Flock Freight direct multi-stop routing.
    claimRefs:
