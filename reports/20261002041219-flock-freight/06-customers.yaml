company:
  name: "Flock Freight"
chapter:
  number: 6
  title: "Customers"
  summary: "Flock Freight targets shippers with mid-sized freight (10 to 44 linear feet) and independent motor carriers seeking higher yields on unused deck space. Commercial adoption demonstrates 16% to 20% cost savings for enterprise shippers like Academy Sports, but customer proof remains heavily company-published and lacks verified retention or churn metrics."
sections:
  - id: "customer-segmentation-and-buyer-profiles"
    title: "Customer Segmentation and Buyer Personas"
    body: "Flock Freight's commercial customer base is divided between shippers who tender multi-pallet freight and motor carriers who provide dry-van and refrigerated haulage capacity. On the shipper side, the primary economic buyers are transportation managers, logistics directors, and supply chain executives managing mid-sized freight between 10 and 44 linear feet. These shippers traditionally face an expensive dilemma: paying for an entire full truckload (FTL) to ensure rapid transit without intermediate handling, or booking less-than-truckload (LTL) service and risking terminal damage, reweigh fees, and delivery delays. On the carrier side, Flock Freight engages owner-operators and small-to-midsize fleets operating 53-foot dry vans and refrigerated trailers, offering them supplemental revenue by filling remaining linear deck space through shared truckload algorithms."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-operational-metrics"
    title: "Adoption Trajectory and Operational Proof Points"
    body: "Flock Freight claims thousands of commercial shippers move freight across its platform, but external verification of active accounts, shipment volume, and repeat usage rates remains limited. According to company research surveying 1,000 logistics decision-makers, 43% of truckload shipments moved partially empty in 2023, with shippers averaging 29 linear feet of unused deck space, while enterprise shippers paid up to $6.3 million annually in LTL damage and loss claims. The company positions its terminal-free FlockDirect pooled service as delivering an on-time pickup and delivery rate of 97.5% and a damage claim rate under 0.001%, compared to an industry LTL damage rate of 1.94%. Furthermore, carrier engagement tools such as STL AddOns report up to a 77% increase in carrier earnings and a 2x increase in trailer utilization, though audited volume disclosures are absent."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-customer-proof"
    title: "Named Customer Deployments and Case Proof"
    body: "Publicly verified enterprise customer references for Flock Freight are sparse but include sporting goods retailer Academy Sports, which reported saving 16% on underutilized truckload shipments through shared truckload routing. Historical case studies also reference craft beverage producer Stone Brewing utilizing shared truckloads for regional distribution. While these case references demonstrate production adoption among consumer retail and food-and-beverage shippers, broader enterprise customer disclosures are heavily mediated through company marketing rather than independent buyer case studies. On the carrier side, testimonials from small logistics operators such as J&P Logistics indicate operational satisfaction with load-booking simplicity and multi-stop rate premiums, yet comprehensive carrier retention or churn statistics are not publicly reported."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics and Concentration Risks"
    body: "Flock Freight's customer durability faces dual-sided retention and concentration challenges across volatile freight cycles. In contract terms, Flock Freight's standard broker-carrier agreements enforce strict operating rules, including mandatory 24-hour proof-of-delivery submission, full indemnity provisions, strict prohibitions against unauthorized re-brokering, and unilateral rate-reduction clauses for missed pools. Because shippers can tender loads spot-by-spot or via TMS integrations without long-term exclusivity, switching costs remain low when general truckload spot rates soften. The company has partner integrations with managed transportation and procurement providers to embed shared truckloads into enterprise workflows, but net revenue retention (NRR), gross revenue retention (GRR), and top-10 customer revenue concentration figures remain undisclosed private metrics."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
callouts:
  - calloutType: "insight"
    title: "The Mid-Market Freight Dilemma"
    body: "Flock Freight captures economic surplus by targeting shipments that fall into the structural gap between 10-foot LTL cutoffs and 53-foot FTL capacities, where shippers routinely pay full truckload rates to move air."
    claimRefs:
      - "CU002"
      - "CU005"
  - calloutType: "risk"
    title: "Absence of Audited Retention and Churn Disclosures"
    body: "While marketing materials report thousands of shippers and high carrier satisfaction, Flock Freight discloses neither customer churn rates nor cohort retention figures, leaving platform durability vulnerable during cyclical freight downturns."
    claimRefs:
      - "CU004"
      - "CU015"
