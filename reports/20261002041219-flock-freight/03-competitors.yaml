callouts:
  - calloutType: "risk"
    title: "Carrier Multi-Homing and Algorithmic Execution Vulnerability"
    body: "Flock Freight's core value proposition requires seamless algorithmic pairing of multi-stop freight routes across independent motor carriers. Because owner-operators and small fleets multi-home aggressively across load boards and prioritize simple single-stop dispatches during tight capacity markets, Flock must continuously offer superior rate premiums ($0.20/mile extra) to prevent carriers from defecting to conventional single-point truckload loads."
    claimRefs:
      - "CP007"
      - "CP013"
      - "CP014"
  - calloutType: "insight"
    title: "The Terminal-Free Moat vs Enterprise TMS Workflow Friction"
    body: "Flock Freight's sub-0.001% damage rate and 20% cost savings create an undeniable economic wedge against legacy LTL carriers burdened by physical hub networks. However, the primary competitive hurdle remains workflow inertia: until shared truckload is integrated natively as an automated execution mode inside enterprise TMS systems, adoption requires consultative sales cycles that slow enterprise penetration."
    claimRefs:
      - "CP002"
      - "CP005"
      - "CP008"
      - "CP015"
