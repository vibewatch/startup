      - [BioNTech, "Integrated mRNA developer", "Not established in assigned sources", "Named as a major mRNA market participant; oncology and vaccine routes described by Eureka", "Reported oncology and platform breadth", "Eureka's landscape is AI-generated; no first-party BioNTech source in this pool"]
      - [Arcturus Therapeutics, "Specialist mRNA / saRNA developer", "Not established in assigned sources", "Respiratory, rare-disease, and vaccine routes described by Eureka", "Eureka attributes saRNA and inhaled-delivery focus", "No first-party program or clinical-outcome source in this pool"]
      - [CureVac, "mRNA developer; transaction scope unresolved", "Not established in assigned sources", "mRNA vaccines and cancer-immunotherapy assets described in landscape sources", "Specialist platform and oncology assets are reported", "Sources describe transaction scope differently; verify entity and assets"]
      - [Genor Biopharma, "Co-development partner / adjacent biologics platform", "Not established in assigned sources", "Cancer programs in a reported Genor-Abogen collaboration", "FLcube says Genor contributes antibody discovery while Abogen contributes mRNA", "Rights, economics, product ownership, and distribution are undisclosed"]
      - [SHINGRIX / established vaccination, "Status-quo alternative", "Not applicable to a private competitor comparison", "Named as the positive control in Abogen's Phase 1 shingles study", "Provides an established-treatment comparator in the trial design", "Registry entry does not report comparative results"]
    notes: >-
      Scope is limited to sources in this chapter's assigned pool, not an
      exhaustive census. Reported market lists are not market-share rankings;
      unavailable values are evidence gaps, not zero.
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP008, CP009, CP013, CP014, CP015]
  - id: TP003
    title: Capability and evidence-coverage matrix
    columns:
      - Company or alternative
      - Platform or program evidence
      - Stage or product evidence
      - Partnering or route evidence
      - Unresolved comparison
    rows:
      - [Abogen, "mRNA platform described by Dealroom", "ABO1108 Phase 1; registry lists active, not recruiting", "Genor cancer co-development reported by FLcube", "Manufacturing readiness, outcomes, rights, and scale"]
      - [Moderna, "Broad mRNA portfolio on company pipeline page", "Commercial vaccines and Phase 1-3 candidates listed", "Merck partnership for mRNA-4157 described in company pipeline and Eureka", "Relative cost, clinical efficacy, and realized price"]
      - [BioNTech, "Platform and oncology routes reported by Eureka", "Named in broad market lists", "CureVac transaction scope is described differently by sources", "Current program-level status, costs, and product performance"]
      - [Arcturus, "saRNA and delivery routes reported by Eureka", "Program-stage detail not independently verified in this pool", "No partner terms established", "Clinical outcomes, manufacturing scale, and cost"]
      - [Genor, "Antibody-discovery platform described by FLcube", "Cancer co-development reported; candidate-level stage not specified", "Collaboration with Abogen", "Economics, rights, and commercialization"]
      - [SHINGRIX, "Established vaccine named as trial control", "Positive control in Abogen Phase 1 record", "No partnership with Abogen asserted", "Head-to-head results are not posted"]
    notes: >-
      Evidence-presence matrix, not a score or independent technical benchmark.
      "Not established" means the assigned successful prefetched sources do not
      provide the comparison.
    claimRefs: [CP001, CP002, CP004, CP005, CP007, CP008, CP012, CP013]
  - id: TP004
    title: Pricing and packaging comparison
    columns:
      - Company or alternative
      - Public price in assigned evidence
      - Unit or contract model
      - Included scope or reimbursement
      - Underwriting implication
    rows:
      - [Abogen, "Not disclosed in assigned evidence", "Not disclosed", "Not disclosed", "Request program-specific pricing, rights, and reimbursement evidence"]
      - [Moderna, "Not disclosed in assigned evidence", "Not disclosed", "Pipeline page lists products and stages, not prices or contract terms", "Do not infer realized pricing from product availability"]
      - [BioNTech, "Not disclosed in assigned evidence", "Not disclosed", "Market and landscape reports do not provide comparable contract terms", "No like-for-like price benchmark"]
      - [Arcturus, "Not disclosed in assigned evidence", "Not disclosed", "No payer, customer, or contract detail in assigned evidence", "Commercialization economics remain unknown"]
      - [Genor-Abogen collaboration, "Not disclosed in assigned evidence", "Collaboration terms not disclosed", "FLcube reports platform contributions, not deal economics", "Obtain rights, milestones, cost-sharing, and commercialization terms"]
    notes: >-
      All cells are bounded to the assigned prefetched evidence. "Not disclosed"
      is not a claim that prices or agreements do not exist; it identifies
      missing public inputs for comparable underwriting.
    claimRefs: [CP008, CP010, CP012]
