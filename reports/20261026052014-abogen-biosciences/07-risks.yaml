    - type: missing-source
      severity: material
      topic: patent-freedom-to-operate
      missingEvidence: Patent-family ownership, claims, jurisdictions, licenses, prosecution status, and an independent freedom-to-operate opinion.
      whyItMatters: A reported patent count cannot establish enforceable protection or freedom to operate for the company's products in specific markets.
      diligencePath: Obtain the current patent schedule and family-level prosecution history, map claims to products and jurisdictions, and commission a qualified FTO review.
      relatedQuestionRefs:
        - QR009
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: manufacturing-readiness
      missingEvidence: Facility-level GMP status, batch release data, yields, capacity, and quality-system evidence.
      whyItMatters: Without operating evidence, the stated scalable-manufacturing capability cannot be assessed as a mitigation to clinical supply and execution risk.
      diligencePath: Request site audit materials, quality certifications, validated process data, batch disposition records, and capacity plans.
