    - type: stale
      severity: material
      topic: historical-regulatory-status
      missingEvidence: Current BPOM authorization conditions, post-authorization safety follow-up, and current clinical status for AWcorna and related programs.
      whyItMatters: Historical approval and trial reporting cannot establish present authorization, safety obligations, or commercial viability.
      diligencePath: Obtain current BPOM records, sponsor updates, safety reports, and trial-registry records directly from responsible study teams.
      relatedQuestionRefs:
