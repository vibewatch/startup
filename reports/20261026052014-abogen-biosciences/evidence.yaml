evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: A verified founder and executive roster, board composition, decision rights, biographies, and succession coverage.
    whyItMatters: >-
      Leadership identity and governance cannot be assessed from conflicting, thin directory records, limiting
      key-person and oversight diligence.
    diligencePath: >-
      Request an official organization chart, board roster, executive biographies, corporate registry extract, and
      succession or delegation plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing documents reconciling total proceeds, round dates, investor participation, valuation, dilution,
      and current cash.
    whyItMatters: >-
      Third-party financing records conflict on the headline Series C date and do not establish present liquidity,
      terms, or ownership.
    diligencePath: >-
      Reconcile the cap table and signed financing documents with management; request the current cash balance and
      use-of-proceeds schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: >-
      Current revenue, revenue run rate, customer or partner economics, cash balance, burn, headcount, and program-level
      budgets.
    whyItMatters: >-
      Without these private operating metrics, commercial traction, financing runway, and capital needs cannot be
      underwritten.
    diligencePath: >-
      Request audited financial statements and a current management KPI pack with revenue definitions, cash
      reconciliation, burn, and program budgets.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: walvax-relationship
    missingEvidence: >-
      The termination agreement, ownership and licensing schedule, manufacturing rights, liabilities, and any continuing
      Walvax obligations.
    whyItMatters: >-
      The reported termination may affect asset control and execution, but the available report does not show the legal
      or economic consequences.
    diligencePath: >-
      Review the executed collaboration and termination agreements and obtain written confirmation of current program,
      IP, and manufacturing rights.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: clinical-evidence
    missingEvidence: >-
      Numerical Phase I/II safety and immunogenicity results and an independently reviewable Phase III protocol or
      registry record.
    whyItMatters: Company-reported positive signals do not establish efficacy, comparative safety, or trial execution quality.
    diligencePath: >-
      Obtain the clinical study reports, protocol and registry entry, safety tables, and independent investigator
      review.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: abogen-addressable-market
    missingEvidence: >-
      Company- and program-level eligible populations, addressable geographies, launch timing, pricing, reimbursement,
      and adoption assumptions needed to derive SAM and SOM.
    whyItMatters: >-
      Broad global mRNA revenue estimates do not show which patients or spending pools Abogen can serve, so they cannot
      support a company-specific revenue or valuation case.
    diligencePath: >-
      Request program-level epidemiology, trial eligibility and regulatory plans, target-country pricing and
      reimbursement research, and explicit scenario assumptions; build a bottom-up estimate only after reconciling each
      indication and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-payer-segmentation
    missingEvidence: >-
      Named budget owners, payer coverage, procurement routes, treatment workflows, and partner economics for each
      target indication.
    whyItMatters: End-user labels and clinical-trial activity do not establish who authorizes or pays for routine treatment.
    diligencePath: >-
      Obtain interviews or written evidence from target-country hospitals, payers, procurement bodies, and any
      commercialization partners, broken out by indication and product.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable list and realized prices, payer terms, contract values, discounts, and reimbursement by indication for
      Abogen and named peers.
    whyItMatters: >-
      Without comparable unit and contract economics, buyer trade-offs, pricing power, and commercial moat cannot be
      assessed.
    diligencePath: >-
      Request indication-level price and reimbursement schedules, representative contract terms, and realized-price
      bridges from Abogen and relevant competitors.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent comparative clinical outcomes, manufacturing validation, quality-system evidence, and distribution or
      supply-access benchmarks.
    whyItMatters: >-
      Platform and pipeline breadth alone do not establish superior clinical performance, lower cost, or defensible
      switching costs.
    diligencePath: >-
      Obtain trial results and protocol-level comparisons, manufacturing audit evidence, and partner/customer references
      for each priority indication.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: conflicting-data
    severity: material
    topic: competitor-consolidation
    missingEvidence: >-
      Primary transaction documentation clarifying whether the BioNTech-CureVac transaction covered the whole company or
      specified mRNA oncology assets.
    whyItMatters: >-
      The assigned landscape sources describe different transaction scope, which changes the assessment of CureVac as an
      active competitor.
    diligencePath: >-
      Verify the transaction perimeter, closing status, retained CureVac programs, and any continuing third-party rights
      from primary transaction disclosures.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: >-
      Current audited income statement, balance sheet, cash-flow statement, monthly burn, debt schedule, cash
      restrictions, and program-level budgets are not available in the assigned public sources.
    whyItMatters: >-
      Without cash, burn, and committed-spend data, runway, financing dependency, and capital adequacy cannot be
      assessed.
    diligencePath: >-
      Request the latest audited statements, monthly management accounts, bank and restricted-cash schedules, debt
      documents, and budget by clinical program from management.
    relatedQuestionRefs:
      - QI004
      - QI006
  - type: private-evidence-only
    severity: material
    topic: commercialization-economics
    missingEvidence: >-
      Product-level sales, units, realized prices, gross margins, royalties, milestones, and revenue-recognition
      schedules are not reported.
    whyItMatters: >-
