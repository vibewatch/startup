company:
  name: Abogen Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Abogen is a Suzhou-based mRNA therapeutics developer with reported programs in
    infectious disease and oncology, and its shingles vaccine ABO1108 has entered
    Phase III according to company and independent industry reporting. Public
    sources document a substantial historical financing record and both a terminated
    Walvax collaboration and a separate Genor collaboration, but current financial
    scale, governance, and partnership economics remain unverified.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Tracxn describes Abogen Biosciences as a Suzhou-based developer of mRNA-based
      therapeutics for cancer and infectious diseases, with platforms for mRNA
      design, in-vitro synthesis, and lipid-nanoparticle delivery. AliensZone also
      identifies the company as a Suzhou biotechnology business, although that
      directory calls it discovery-stage while the documented Phase III program
      indicates that at least one asset is in late-stage clinical development.
      Those descriptions do not establish a current corporate stage or a commercial
      business model. The strongest grounded company-level positioning is therefore
      a private mRNA drug developer with vaccine and oncology activity, rather than
      a commercial product company. The 2026 market report includes Suzhou Abogen
      among its named mRNA therapeutics companies, but this is sector-list inclusion,
      not evidence of revenue, market share, or product commercialization. [CO001,
      CO002, CO016]
    claimRefs: [CO001, CO002, CO016]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership and capital formation
    body: >-
      Public leadership coverage is thin and inconsistent. Tracxn names Ying Bo
      and Dr InBev as co-founders and co-CEOs; AliensZone instead lists Bo Ying as
      founder and CEO. The name similarity may reflect transliteration, but the
      assigned evidence does not establish that, and it does not identify a board,
      current executive team, or succession structure. Tracxn records $1.13 billion
      across five funding rounds and lists an August 2021 $720 million Series C,
      while VCBeat describes a July 2021 Series C exceeding $700 million. The
      discrepancy should be reconciled against transaction documents; the tracker
      also lists an undisclosed Series C dated May 2022. These are reported
      financing amounts, not evidence of present cash, valuation, or available
      runway. The available sources do not support a current valuation or financing
      terms. [CO003, CO004, CO005, CO006, CO007, CO014, CO015]
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO014, CO015]
    tableRefs: [TO002]
  - id: partnerships-and-regulatory-history
    title: Partnerships and regulatory history
    body: >-
      Abogen's external relationships show both development reach and execution
      dependencies. Xinhua reported that Indonesia's BPOM issued an emergency-use
      authorization for AWcorna, an mRNA COVID-19 vaccine developed by Abogen with
      Walvax, for adults aged 18 and older. Separately, FLcube reported that Walvax
      terminated clinical trials for the co-developed COVID-19 vaccine and the
      related technology-development cooperation covering COVID-19 and herpes-zoster
      vaccines. That report does not establish the disposition of intellectual
      property, manufacturing assets, license rights, or remaining obligations.
      The same Fineline/FLcube article states that China's trial clearance for the
      ARCoV COVID-19 vaccine came in June 2020.
      FLcube also reported a co-development agreement with Genor for cancer mRNA
      medicines, combining Genor's antibody platform with Abogen's mRNA expertise.
      The agreement's current status, economics, and program ownership are not
      established in the assigned evidence. [CO008, CO011, CO012, CO013]
    claimRefs: [CO008, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: clinical-milestones-and-scale-gaps
    title: Clinical progress and what remains unknown
    body: >-
      The clearest current milestone is ABO1108, Abogen's lyophilized mRNA shingles
      vaccine. Abogen announced a Phase III study that it describes as multicenter,
      randomized, double-blind, and placebo-controlled, conducted with provincial
      CDCs across Guangxi, Zhejiang, Hebei, and Shandong. The company also reported
      favorable Phase I/II safety and immunogenicity findings, but the assigned
      announcement provides no numerical results or independent clinical-data
      review; those findings should remain company-reported. Its Phase III status
      demonstrates clinical progression, not efficacy, approval, or commercial
      readiness. The retained sources do not establish current revenue, cash,
      burn, headcount, customer count, or a reliable current valuation. The timeline
      records dated milestones reported in the assigned sources; the leadership
      and stakeholder tables are partial because the public record in this pool
      does not provide a full roster or cap table. [CO009, CO010]
    claimRefs: [CO009, CO010]
    figureRefs: [FO001]
