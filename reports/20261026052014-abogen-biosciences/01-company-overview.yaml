    title: Partnership rights need reconciliation
    body: >-
      FLcube reports that Walvax terminated the co-developed COVID-19 trial and
      related technology-development cooperation covering COVID-19 and herpes-zoster
      vaccines. The available evidence does not establish how this affected
      intellectual property, manufacturing, or Abogen's later proprietary
      ABO1108 program; request the underlying agreements and rights schedule.
    claimRefs: [CO013, CO009]
