  topStrengths:
    - >-
      ABO1108 has a reported Phase III milestone, providing a late-stage clinical signal without yet establishing
      efficacy or commercialization.
    - >-
      Abogen announced a proposed global Novartis license for ABO2203 and options on other programs, with substantial
      conditional economics if milestones are achieved.
    - >-
      A company-affiliated ABO1005 study provides technical detail on an mRNA-LNP rabies-vaccine candidate and
      preclinical results.
  topRisks:
    - >-
      Public evidence does not establish current cash, burn, runway, program budgets, or financing terms; reported
      funding totals are not current liquidity.
    - >-
      Walvax reportedly terminated COVID-19 and shingles development cooperation; surviving rights and program
      continuity remain unverified.
    - >-
      Clinical outcomes, current regulatory status, manufacturing quality controls, and commercial uptake remain
      insufficiently disclosed.
    - >-
      The Novartis agreement remains proposed and conditional; closing, cash receipt, option exercise, and milestone
      realization are unverified.
  unresolvedGaps:
    - >-
      Obtain a current fully diluted cap table, security terms, financing ask, and a dated valuation basis before
      underwriting an entry price.
    - >-
      Obtain current cash, burn, debt, runway, and program-level budgets to assess capital adequacy and financing
      dependence.
    - >-
      Verify Novartis closing, upfront payment receipt, option scope, milestone status, royalties, and executed partner
      rights.
    - >-
      Reconcile current trial and regulatory status with numerical human outcomes for ABO1108, ABO2203, and other named
      programs.
    - >-
      Validate manufacturing capacity, cGMP systems, batch release, quality controls, and commercial readiness through
      diligence.
    - >-
      Establish product-level revenue, paid doses, customer and payer identities, pricing, repeat demand, and partner
      economics.
