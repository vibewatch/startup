      - number: '6.2'
        title: Adoption evidence remains clinical and partner-led
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are development milestones and access events, not commercial utilization.
              Abogen's November 2021 release said ARCoV had completed Phase I and Phase II studies and was under Phase
              III evaluation, and described a manufacturing license for its COVID-19 vaccine. A ClinicalTrials.gov
              record for a Phase III SARS-CoV-2 vaccine study identifies Walvax as sponsor and Abogen as collaborator,
              but its retrieved page states that no results are posted; registry participation and site listings do not
              establish enrollment, efficacy, sales, or routine use. A separate report says Indonesia granted an
              emergency use authorization for AWcorna for adults, based on a Phase III study described as ongoing at 31
              sites in three countries. The source does not quantify doses delivered or subsequent sales.
            claimRefs:
              - CU005
