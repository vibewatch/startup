      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible strategic validation signal, not booked economics
            body: >-
              The announced Novartis license and options indicate partner interest in Abogen's platform, while closing,
              realized consideration, and downstream milestones remain unverified.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Development relationships can terminate
            body: >-
              FLcube's report of terminated Walvax collaborations is a concrete counter-signal; the public record does
              not show whether replacement partners or commercial programs offset it.
            calloutType: risk
            claimRefs:
              - CU009
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence-weighted risk thesis
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific adverse evidence is a 2024 report that Walvax and Abogen signed a
              termination agreement covering technical development cooperation for COVID-19 and shingles mRNA vaccines;
              the report says the parties would settle preliminary research, clinical, and related expenses but gives no
              amount or post-termination rights detail (CR005, CR013). Earlier reporting described the COVID-19 vaccine
              as having advanced through Phase I, II, and III studies, while a separate dispatch reported an Indonesian
              emergency-use authorization based on pivotal Phase III data when that trial was still ongoing (CR006,
              CR007). These are historical milestones, not confirmation of present status. The key underwriting issue is
              whether program assets, trial data, and future development can proceed after the collaboration ended; the
              assigned evidence does not answer that question (CR015).
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
