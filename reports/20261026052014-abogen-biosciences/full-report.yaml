              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR014
      - number: '7.4'
        title: Monitoring priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a monitoring plan, not a numerical probability score. First, obtain written
              confirmation of the current regulatory status and safety follow-up for AWcorna and any active Abogen-led
              studies; a withdrawn authorization, an unresolved safety signal, or inability to substantiate a required
              approval would materially weaken the clinical thesis (CR007). Second, verify with both former partners
              which party controls clinical data, intellectual property, manufacturing materials, and remaining
              obligations after the termination agreement; an inability to continue a strategically important program
              would be a thesis-break (CR013, CR015). Third, request current site-level quality and capacity evidence
              and a cash/burn forecast before treating scale-up or funding claims as operational protection (CR002,
              CR014). The matrix separates a reported event from conditional or unverified exposure; it does not imply
              quantified likelihood (CR016).
            claimRefs:
              - CR002
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
