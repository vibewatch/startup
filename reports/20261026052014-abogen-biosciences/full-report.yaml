              - CU011
      - number: '6.4'
        title: Retention, expansion, and customer economics are undisclosed
        blocks:
          - type: paragraph
            body: >-
              None of the assigned source texts provides an active customer or account count, revenue by customer,
              contract value, renewal or reorder history, net or gross retention, or a cohort of commercial users. The
              Novartis announcement describes a proposed license and potential future milestone and royalty economics;
              it does not report realized payments. Clinical-trial and authorization evidence is not a substitute for
              paid demand, prescribing, distribution, or patient uptake. Even the retrieved VCBeat text is a general
              description of the publisher rather than evidence about Abogen's adoption. The chapter's public proof is
              consequently partial: request executed agreement and closing documentation, product-level commercial data,
              partner references, country-level launch and dose records, and trial results before underwriting
              durability or expansion.
            claimRefs:
              - CU003
              - CU008
              - CU013
              - CU014
