              - CR007
              - CR009
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Collaboration termination is the clearest evidenced trigger
            body: >-
              The reported Walvax termination affects two named vaccine programs, but the available text does not
              establish asset rights, current status, or whether Abogen can continue either program independently.
            calloutType: risk
            claimRefs:
