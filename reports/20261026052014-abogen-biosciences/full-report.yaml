    rows:
      - - Recommendation
        - Track / research-more; no buy conclusion from this evidence set
        - Do not underwrite entry before current financing and operating evidence is verified.
      - - Confidence
        - Low; platform and reported milestones are visible, but economics and current terms are not
        - Confidence applies to the cautious process call, not to a numeric valuation.
      - - Risk rating
        - High; clinical translation and financing visibility remain material
        - Test program status, runway, partner rights, and manufacturing execution.
      - - Valuation stance
        - No supportable numeric mark or range; the profile's $3 B label is undated
        - Do not treat the listing as fair value or a current financing price.
      - - Return and exit
        - No target return, hold period, or exit value is supportable
        - Obtain a dated security/term sheet, cap table, and credible liquidity path.
    notes: >-
      Qualitative synthesis of the assigned sources; the AliensZone funding and valuation labels are undated and do not
