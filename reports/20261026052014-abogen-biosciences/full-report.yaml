      - number: '5.4'
        title: Controls and diligence boundaries
        blocks:
          - type: paragraph
            body: >-
              The available record is not enough to underwrite product quality or trust controls. The ABO2203 registry
              entry lists treatment-emergent and serious adverse-event measures, but the fetched page says no results
              are posted; a planned endpoint is not a safety outcome. The reviewed materials do not establish current
              trial status, validated human data for ABO1005, current cGMP capabilities, batch-release criteria,
              lot-to-lot consistency, security or privacy controls, or commercial manufacturing output. A
              mixed-institution Nature Communications paper includes an Abogen-affiliated author and describes a
              separate five-antigen mpox mRNA study; it should not be attributed as an Abogen-owned product or treated
              as an independent performance benchmark. One undated directory calls Abogen discovery-stage while the
              company calls itself clinical-stage, leaving the current portfolio-wide maturity unresolved.
            claimRefs:
              - CE001
              - CE011
              - CE012
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and payers are not interchangeable
        blocks:
          - type: paragraph
            body: >-
              Abogen's public evidence describes several different relationship types rather than a countable customer
              base. Novartis is the announced global licensee and option holder for ABO2203, subject to customary
              closing conditions; that is a strategic licensing relationship, not proof of a marketed product or
              recurring customer revenue. Walvax is identified as sponsor or collaborator in the COVID-19 vaccine
              development record, while an Indonesian report describes an authorization for AWcorna, a vaccine developed
              by Abogen with Walvax. Patients are intended end users, but the retrieved material does not identify
              treating institutions, purchase orders, doses administered, reimbursement, or who ultimately pays. The
              rows below are a partial map of named counterparties and user contexts, not an exhaustive customer roster.
            claimRefs:
              - CU001
              - CU002
