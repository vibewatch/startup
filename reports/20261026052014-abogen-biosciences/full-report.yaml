  - id: TV003
    title: Qualitative bull / base / bear cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bear
        - Program setbacks or financing needs precede validated commercialization.
        - Value could be impaired by delay, dilution, or loss of asset rights; no numeric floor is supportable.
        - A reported co-development termination is a material adverse signal; probability is not quantifiable.
      - - Base
        - Development continues without public evidence of current revenue, cash, burn, or financing terms.
        - Do not capitalize assumed market share or apply an unsupported multiple; no return estimate.
        - >-
          Planning baseline only, not a probability-weighted forecast; re-rate only on verified economics and
          milestones.
      - - Bull
        - Clinical success, durable rights, scalable manufacturing, and favorable financing are independently verified.
        - Value could improve with risk-adjusted commercialization, but no numeric range is supportable.
        - Upside is conditional, not evidenced as a probability; failure at a key milestone breaks the case.
    notes: >-
      Directional scenarios only; the assigned sources lack Abogen-specific cash flows, success probabilities,
      transaction multiples, and financing terms, so no numeric valuation or return is invented.
