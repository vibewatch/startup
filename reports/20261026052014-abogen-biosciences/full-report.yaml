      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The fetched report of Indonesia's BPOM decision says the EUA for AWcorna's primary two-dose series relied
              on safety and efficacy data from pivotal Phase III trials that were then ongoing across 31 sites in three
              countries (CR007). It does not establish the authorization's current conditions, subsequent safety
              monitoring, or present commercial status. A 2026 AI-generated competitive-landscape report reports an
              Abogen patent count in an ex-China mRNA/LNP corpus, but it does not establish patent ownership, claim
              scope, enforceability, or freedom to operate; it is not an independent patent benchmark (CR011, CR016).
              Separately, Abogen describes advanced AI technologies as part of its platform, while FDA material
              describes a 2025 draft guidance for AI information used in regulatory decision-making (CR001, CR009). That
              is conditional only: the evidence does not show that Abogen plans a U.S. filing or uses AI in a regulatory
              submission. Current litigation, enforcement, sanctions, and other legal posture remain unverified; absence
              of such evidence in this pool is not proof that no matter exists (CR012).
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR011
              - CR012
              - CR016
      - number: '7.3'
        title: Operating and financial exposure
        blocks:
          - type: paragraph
            body: >-
              Abogen's current website claims a clinically validated mRNA-LNP platform combining AI, automation, and
              scalable manufacturing; its fetched About page supplies no site-level capacity, yield, quality system, or
              manufacturing-readiness measure with which to verify those claims (CR001, CR002). A 2021 company release
              said the financing would support large-scale production capability, which establishes an intention at that
              time rather than successful scale-up (CR004). The release reported more than $700 million of Series C
              financing in 2021, while an undated third-party profile lists total funding and valuation figures without
              an as-of date or methodology; neither source establishes current cash, burn, or runway (CR003, CR010,
              CR014). A 2026 patient-oriented guide also cautions that clinical-trial registry status can lag site-level
              screening, but it is not Abogen-specific and cannot verify any Abogen program's current enrollment
              (CR008).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
