  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence-weighted recommendation is track / research-more, not a buy. AliensZone lists a "$3 B"
              valuation, "$1 B" total funding, and Series C stage, but the fetched profile gives no publication date,
              transaction terms, valuation basis, or denominator; it does not define whether the dollar fields are USD.
              Treat these as unverified directory labels, not a current financing mark, and do not treat total funding
              raised as cash available (CV003-CV005). Abogen's partnering page and a TeaserClub profile describe
              RNA-development and manufacturing capabilities, but those descriptions are not audited utilization,
              commercial performance, or margins (CV001-CV002). The retained sources do not support an entry price,
              target return, hold period, or exit value. Risk is high and confidence low because current dilution,
              program economics, and clinical status are not underwritten; the reported partner-trial termination is an
              adverse counterweight, not proof of company-wide failure (CV011-CV012).
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and comparability
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Abogen publicly describes a multi-format RNA and delivery platform and has a
              reported regulatory milestone: Xinhua says Indonesia's BPOM issued an emergency-use authorization for
              AWcorna and identifies Abogen with Walvax (CV001-CV002, CV009-CV010). That record does not establish
              current authorization status, sales, revenue, margins, or royalty rights. The countercase is specific:
              FLCube reports Walvax terminated clinical trials for a co-developed COVID-19 mRNA vaccine and says
              technology cooperation on that vaccine and a herpes-zoster vaccine was affected; it also says the COVID-19
              program had reached Phase I, II, and III studies (CV011-CV013). Those past stages do not establish
              successful outcomes or current status. The broad market forecast and AI-generated patent landscape provide
              sector context, not Abogen-specific revenue or valuation comparables (CV006-CV008, CV014-CV015).
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases remain qualitative because the assigned sources do not provide inputs for
              enterprise value, dilution-adjusted returns, or probability-weighted outcomes. Upside requires
              independently verifiable clinical success, durable product rights, evidence of manufacturing economics,
              and financing on tolerable terms; none is quantified here. The base case is continued development without
              public proof of monetization, so neither a category market forecast nor an undated profile mark can set
              Abogen's value (CV003-CV008, CV015). Downside includes further program setbacks or financing pressure; the
              reported Walvax termination makes this a diligence branch, not a forecast (CV011-CV012). ChinaMedAccess
              describes selected Chinese mRNA cancer-trial examples as mostly early-phase and not routine treatment, but
              it does not identify Abogen programs and cannot establish company readiness (CV014). Move from track to
              underwriting only after current cap-table preferences, cash and burn, program budgets, partner rights,
              clinical outcomes, and a dated financing basis are verified; otherwise no price target or exit value is
              supportable.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
