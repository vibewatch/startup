      - number: '6.3'
        title: Named relationships show both upside and execution risk
        blocks:
          - type: paragraph
            body: >-
              The October 2026 Novartis announcement expands Abogen's partner evidence beyond prophylactic vaccines: the
              proposed agreement covers a worldwide ABO2203 license and options on other platform programs. Its stated
              USD 575 million upfront payment is conditional on closing, while up to approximately USD 7.2 billion in
              milestones depends on all options being exercised and development, regulatory, and commercial milestones
              being achieved; neither amount is evidence of cash received or revenue recognized. Conversely, FLcube
              reported that Walvax terminated trials and technology-development cooperation covering COVID-19 and
              herpes-zoster vaccines. The available evidence therefore supports a material partner-dependence and
              execution question, but not a quantified concentration estimate. Conference speaker profiles document
              executive visibility in the RNA ecosystem, not buyer conversion or customer validation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
