              - CI004
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI012
              - CI013
      - number: '4.2'
        title: Pipeline milestones do not establish revenue
        blocks:
          - type: paragraph
            body: >-
              Pipeline progress gives a cost and commercialization context, not a revenue forecast. Synapse's snapshot
              dated 26 October 2026 lists an Abogen herpes-zoster vaccine at Phase 3, while Abogen's official
              announcement describes ABO1108 entering Phase III and a multi-center design. Neither source reports a
              program budget, trial cost, CMC expense, expected launch date, or expected sales. A clinical-stage
              milestone says nothing about the cash available to complete development. The Business Research Company
              (TBRC) forecast is a broad global mRNA therapeutics projection, not an Abogen-specific addressable market,
              product-price assumption, or market-share estimate. Accordingly, the bridge below marks cost and payment
              steps as unknown rather than sizing them.
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI011
              - CI015
      - number: '4.3'
        title: Unit economics and liquidity are not underwritable
        blocks:
          - type: paragraph
            body: >-
              Public economic data are insufficient for a unit-economics or solvency view. AliensZone displays total
              funding of $1B, valuation of $3B, and more than 500 employees, but gives no as-of date or currency basis
              for its dollar figures; these are undated directory entries. The aVenture page returned for Abogen company
              research contains a beta-coverage disclaimer, not operating financial metrics. Neither directory
              information nor a valuation can be converted into current cash: funding raised is not cash on hand,
              valuation is not proceeds, and headcount is not a cost run-rate. The reviewed sources report no revenue,
              gross margin, trial budget, capex, debt, cash burn, or runway.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI012
              - CI014
      - number: '4.4'
        title: Capital adequacy remains a diligence blocker
        blocks:
          - type: paragraph
            body: >-
              Capital intensity is the central underwriting risk: a multi-center Phase III program and a broader
              clinical pipeline imply continuing research, manufacturing, and regulatory investment, but the public
              record cannot quantify the commitment, runway, or dilution needed. The 2024 reports on Walvax's
              termination say the parties would settle preliminary research and clinical expenses without disclosing the
              amount or allocation. That raises a partner-obligation diligence question, not a measurable burn estimate.
              On this evidence, revenue quality, margin path, and capital adequacy are unproven. Underwriting requires
              current audited statements, a cash schedule, monthly burn, program budgets, debt and trial-cost
              allocation, plus executed licensing and royalty terms.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI013
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI010
              - CI012
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and evidenced maturity
        blocks:
          - type: paragraph
            body: >-
              Abogen describes its business as RNA-driven medicine development and says it has in-house capabilities
              spanning protein engineering, mRNA sequence design and synthesis, lipid nanoparticle (LNP) delivery,
              formulation, and commercial-scale manufacturing. That is company positioning, not independent verification
              of facility capacity or released product. The clearest named infectious-disease programs in the reviewed
              sources are the rabies candidate ABO1005 and the Abogen-Walvax COVID-19 vaccine AWcorna. Xinhua reported
              an Indonesian emergency-use authorization for AWcorna, while a company-affiliated paper reports animal
              studies for ABO1005. A ClinicalTrials.gov record identifies ABO2203, an mRNA-encoded CD19/CD3 T-cell
              engager for refractory autoimmune disease, but the fetched record has no results posted. A separate cancer
              collaboration with Genor is an announced co-development effort, not evidence of a named clinical-stage
              asset.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.2'
        title: What the ABO1005 evidence actually shows
        blocks:
          - type: paragraph
            body: >-
              ABO1005 is the most technically described asset in the assigned evidence. Its company-affiliated 2025
              study describes a codon-optimized rabies glycoprotein mRNA from the Pitman-Moore strain, formulated in
              LNPs, then freeze-dried. The paper specifies a pilot-scale freeze-drying cycle and reports particle size,
              encapsulation efficiency, mRNA integrity, and immunogenicity assessments over storage. It reports that the
              lyophilized formulation remained stable at 2–8 °C for at least 12 months under the study conditions. These
              are published study results, not a commercial release specification or proof of validated commercial-scale
              manufacturing. The architecture figure therefore traces this one documented candidate workflow and does
              not generalize it to every Abogen program.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Use cases and translation
        blocks:
          - type: paragraph
            body: >-
              Public sources show several distinct intended workflows rather than one interchangeable platform product:
              infectious-disease vaccination, a registered autoimmune-disease T-cell-engager study, and a cancer
              co-development with Genor that combines Genor's antibody discovery platform with Abogen's mRNA technology.
              In the ABO1005 Beagle post-exposure model, the paper reports survival in 6 of 6 dogs receiving two 15 μg
              doses, versus 5 of 6 in the inactivated-vaccine comparator group; this small animal study is not human
              efficacy evidence. The sources do not quantify deployment reliability, manufacturing throughput, realized
              patient benefit, or partner economics. The reported AWcorna authorization is historical reporting without
              a year in the fetched text, so its current label and status require confirmation from the regulator.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
