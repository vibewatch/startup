  - id: FR001
    title: Evidence-weighted risk heatmap
    type: matrix
    summary: >-
      Qualitative matrix separates directly reported events from material but conditional or unverified exposures; it
      does not assign probabilities.
    data:
      columns:
        - label: Evidence status
          detail: What is established by the assigned pool, not a general company-status conclusion.
        - label: Potential impact
          detail: Qualitative consequence if the exposure is realized; no numeric probability is implied.
        - label: Exposure certainty
          detail: Whether the event is reported, conditional, or unverified.
      rows:
        - label: Walvax program dependency
          values:
            - label: Termination reported for COVID-19 and shingles cooperation
              detail: Two media reports describe the end of technical-development cooperation.
            - label: Material if rights, data, or development continuity are impaired
              detail: Program-level consequences are not quantified in the retrieved text.
            - label: Event reported; downstream program outcome unknown
              detail: Settlement, rights, and continuation remain diligence items.
        - label: Manufacturing and quality
          values:
            - label: Company claims scalable manufacturing; no site metrics in the fetched page
              detail: This is a disclosure gap, not proof that capability is absent.
            - label: Potentially high if supply or reproducibility constrains studies
              detail: The available sources do not quantify this impact.
            - label: Capability and mitigation unverified
              detail: Facility, batch, yield, and quality-system evidence is needed.
        - label: Regulatory and AI controls
          values:
            - label: Historical Indonesia EUA; FDA AI guidance applies conditionally
              detail: Neither source establishes current authorization or Abogen filing plans.
            - label: Potentially material for approvals and evidence quality
              detail: Company-specific exposure depends on actual AI use and product status.
            - label: Current status and company-specific AI use unknown
              detail: Confirm with the current authorization holder and company.
        - label: Capital runway
          values:
            - label: 2021 financing and undated profile do not establish current cash or burn
              detail: Funding raised is not cash available.
            - label: Potentially high if milestone funding is insufficient
              detail: No current liquidity or burn figure is established.
            - label: Current financial protection unquantified
              detail: Obtain current cash, burn, commitments, and program budgets.
        - label: Post-termination obligations
          values:
            - label: Settlement reported; amounts, rights, and handoff terms are not
              detail: The retrieved reports do not provide the executed terms.
            - label: Material if rights or obligations block program continuity
              detail: Impact is conditional on the agreement and asset status.
            - label: Agreement and transfer status unknown
              detail: Review the signed termination and settlement documents.
        - label: Legal posture
          values:
            - label: Current litigation and enforcement status are not established
              detail: Silence in the assigned source pool is not evidence of absence.
            - label: Potentially high if a material matter exists
              detail: The evidence does not support a likelihood estimate.
            - label: Unknown; no inference of absence
              detail: Obtain a counsel-certified matter schedule and regulator correspondence.
