  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - Workflow or user need
      - Company solution described
      - Measurable evidence in the sources
      - Limitation
    rows:
      - - Rabies post-exposure vaccination
        - Two-dose lyophilized ABO1005 regimen in a Beagle-dog challenge model
        - The paper reports survival of 6/6 ABO1005-group dogs and 5/6 comparator-group dogs
        - Small preclinical groups; not evidence of human efficacy
      - - COVID-19 vaccination
        - AWcorna, developed by Abogen with Walvax
        - Xinhua reports Indonesian EUA for adults 18+ as primary and heterologous booster
        - Dispatch does not show the EUA date or present-day status; regulator confirmation is needed
      - - Refractory autoimmune disease
        - ABO2203 mRNA encoding a CD19/CD3 T-cell engager injection
        - Registry lists adverse-event outcome measures through 30 days after the last dose
        - No results are posted in the fetched record; efficacy and safety outcomes remain unknown
      - - Cancer medicine development
        - Genor antibody discovery combined with Abogen mRNA technology
        - Reported as a co-development agreement
        - No molecule, clinical status, response metric, or partner terms are available in the fetched text
    notes: >-
      Outcomes and milestones are attributed to the cited publication or report. Empty
      fields are evidence gaps, not zero values or evidence of no activity.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE012
      - CE013
  - id: TE003
    title: ABO1005 documented technology and operating steps
    columns:
      - Layer or process
      - Reported implementation
      - Dependency or control evidenced
      - Remaining technical diligence
    rows:
      - - Antigen payload
        - Codon-optimized rabies glycoprotein mRNA derived from the Pitman-Moore strain
        - Study describes sequence design and expression assessment
        - Human dose selection, clinical performance, and independent replication are not established
      - - LNP formulation
        - mRNA encapsulated with an ionizable-lipid formulation
        - Study reports measurement of concentration, integrity, particle size, and encapsulation efficiency
        - Commercial formulation specifications, batch acceptance limits, and comparability data are not public in these sources
      - - Lyophilization
        - Pilot-scale freeze-drying cycle followed by sealed-vial storage
        - Study reports a 2–8 °C stability assessment through month 12
        - Commercial-scale process validation, shipping excursion data, and longer shelf-life evidence are not shown
      - - Preclinical evaluation
        - Mouse immunogenicity and Beagle post-exposure challenge studies
        - Paper reports 6/6 survival in the ABO1005 group and 5/6 in the inactivated-vaccine group
        - Small animal cohorts do not establish human safety, efficacy, or effectiveness in routine deployment
      - - Clinical and quality systems
        - No ABO1005 human study or commercial batch specification is documented in the reviewed sources
        - ABO2203 registry lists planned adverse-event measures but no results
        - Current clinical status, cGMP readiness, release controls, and audit evidence require diligence
    notes: >-
      Process details and study outcomes are from the company-affiliated ABO1005 paper;
      they describe that candidate and must not be generalized to the full platform.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
      - CE012
figures:
  - id: FE001
    title: ABO1005 study-documented product architecture
    type: stack
    summary: >-
      The stack shows the ABO1005 candidate workflow described in one company-affiliated
      study, not a verified company-wide or commercial-scale architecture.
    data:
      layers:
        - label: Antigen-encoding sequence
          modules:
            - Codon-optimized RABV-G sequence derived from the Pitman-Moore strain
        - label: Transcript elements
          modules:
            - 5-prime and 3-prime untranslated regions and a poly(A) tail
        - label: LNP delivery
          modules:
            - mRNA encapsulated in lipid nanoparticles
        - label: Formulation characterization
          modules:
            - Study measurements include particle size and encapsulation efficiency
            - Study also measured mRNA integrity
        - label: Lyophilization and storage
          modules:
            - Pilot-scale freeze-drying process
            - Study evaluated storage at 2–8 °C through month 12
        - label: Preclinical evidence
          modules:
            - Mouse immunogenicity studies
            - Beagle post-exposure challenge study; not human efficacy evidence
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
