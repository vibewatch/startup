      - [ARCoV development, "Phase I and II completed; Phase III under evaluation, per Abogen", "As of 2021-11-29 release", "Company announcement", "Historical development milestone only", "No current status or outcome supplied by this dated claim"]
      - [Phase III registry, "ClinicalTrials.gov lists a Phase III SARS-CoV-2 vaccine study with Walvax as sponsor and Abogen as collaborator", "Registry record accessed 2026-10-26", "Public registry; no results posted in retrieved text", "Named clinical relationship and study surface", "Retrieved text does not establish enrollment, completion, or efficacy"]
      - [Indonesian authorization, "Xinhua reports EUA for AWcorna for adults as primary or heterologous booster; Phase III described at 31 sites in 3 countries", "Publication date not stated in retrieved text", "News report hosted on eng.yidaiyilu.gov.cn", "A reported regulatory access milestone", "No doses, procurement, revenue, or realized uptake disclosed"]
      - [ABO1108 clinical stage, "Abogen describes its shingles vaccine as undergoing Phase III trials in China", "As of 2026-10-02 release", "Company announcement", "Current pipeline milestone, not product adoption", "No commercialization, enrollment, or outcome data disclosed"]
      - [Novartis agreement, "Proposed global license plus options; up to approximately USD 7.2 billion in potential milestones if all options are exercised", "Announced 2026-10-02", "Company announcement", "Strategic partner signal with contingent economics", "Closing, payments, option exercise, milestones, and royalties not verified"]
    notes: >-
      Milestones are reported by different issuers and are not a common adoption metric. Trial phases, registry locations, authorization, and contingent deal value must not be summed or interpreted as users, revenue, or ARR.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU010, CU011]
