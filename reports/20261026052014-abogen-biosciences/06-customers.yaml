      - [Walvax Biotechnology, "Development partner and trial sponsor", "ClinicalTrials.gov names Walvax sponsor and Abogen collaborator; FLcube reports termination of related COVID-19 and shingles cooperation", "Clinical development evidence only; later termination is adverse", "Two sources support distinct stages; termination scope and replacement status need confirmation"]
      - [Indonesia BPOM / AWcorna, "Regulatory authority and reported market-access event; not a customer", "News report says BPOM issued EUA for AWcorna, developed by Abogen with Walvax", "Authorization does not show procurement, launch, or doses administered", "Single retrieved report; current authorization and market uptake need verification"]
    notes: >-
      Partial enumeration of named relationships found in the assigned pool. A regulator is not a paying customer; no named hospital, distributor, procurement contract, or commercial buyer is established here.
    enumerationScope:
      coverage: partial
      basis: Named public relationships in assigned sources; this does not enumerate all partners, buyers, licensees, or end users.
    claimRefs: [CU001, CU002, CU003, CU007, CU009, CU010, CU011]
