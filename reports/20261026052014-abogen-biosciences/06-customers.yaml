    - type: private-evidence-only
      severity: material
      topic: customer-economics
      missingEvidence: "Active customer and account counts, revenue by customer or product, contract values, paid doses, renewals, reorders, and gross/net retention cohorts."
      whyItMatters: "Without customer-level economics, commercial adoption, repeat demand, and concentration cannot be distinguished from clinical progress or contingent licensing value."
      diligencePath: "Request a dated customer and product revenue schedule, executed contracts, shipment and dose records, renewal history, and cohort retention analysis from management."
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: licensing
      missingEvidence: "Evidence that the proposed Novartis transaction closed, the upfront was received, options were exercised, or milestones were earned."
      whyItMatters: "The announced USD 575 million upfront and potential milestones are conditional terms rather than verified cash or recognized revenue."
      diligencePath: "Obtain closing confirmation, executed agreement summaries, payment records, and milestone/option status from Abogen and Novartis."
      relatedQuestionRefs: [QU006]
    - type: missing-source
      severity: material
      topic: clinical-adoption
      missingEvidence: "Current trial status, actual enrollment, study results, completed site activity, and transition from clinical supply to routine commercial distribution."
      whyItMatters: "Trial phases, sites, and an authorization do not show clinical outcomes, prescribing, purchasing, or user adoption."
      diligencePath: "Reconcile current registry records with sponsor reports, obtain results and enrollment tables, and verify launch, procurement, and dose data with local partners."
      relatedQuestionRefs: [QU002, QU007]
      relatedTableRefs: [TU002, TU003]
    - type: enumeration-incomplete
      severity: material
      topic: customer-segments
      missingEvidence: "An exhaustive list of paying customers, clinical and commercial partners, distributors, procurement counterparties, and revenue-bearing geographies."
      whyItMatters: "Public examples cannot establish the breadth of the customer base or quantify counterparty and channel concentration."
      diligencePath: "Request a complete counterparty schedule with role, status, territory, contract economics, revenue, and termination rights."
      relatedQuestionRefs: [QU001, QU003, QU005]
      relatedTableRefs: [TU001, TU003]
    - type: missing-source
