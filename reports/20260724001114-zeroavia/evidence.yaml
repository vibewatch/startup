evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A current post-money valuation or priced 2025 financing amount.
    whyItMatters: >-
      Without a fresh valuation mark, investors cannot test whether ZeroAvia is still being financed at a premium
      consistent with the 2024 strategic round narrative.
    diligencePath: Request the 2025 financing deck, term sheet summary, or board-approved cap-table update.
    relatedQuestionRefs:
      - QO009
      - QO022
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An official 2026 employee count by geography after layoffs.
    whyItMatters: >-
      Organization size is a key execution proxy for a certification-stage aerospace company and the current public
      record is contradictory.
    diligencePath: Ask management for a current org snapshot by function and site.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: backlog-quality
    missingEvidence: >-
      Breakdown of firm orders, options, letters of intent, and milestone-gated purchase rights behind the 2,000+
      pre-order claim.
    whyItMatters: Backlog quality determines whether customer interest is genuine commercial demand or mostly strategic optionality.
    diligencePath: Request a counterparty-by-counterparty order waterfall with legal status and expected conversion milestones.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, burn, and gross-margin data.
    whyItMatters: >-
      Company-overview conviction is limited without knowing whether commercialization is still pre-revenue or already
      generating meaningful component or defense income.
    diligencePath: Obtain board materials or management accounts showing revenue composition and cash burn.
    relatedQuestionRefs:
      - QO022
      - QO025
  - type: conflicting-data
    severity: minor
    topic: governance-scope
    missingEvidence: Entity-by-entity board map reconciling group board roles with ZeroAvia Ltd filing changes.
    whyItMatters: >-
      The public company narrative and UK subsidiary filing record are not contradictory, but they operate at different
      legal scopes and create avoidable confusion.
    diligencePath: Request a legal-entity chart plus current board and officer lists for each major operating entity.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: A complete milestone ledger with every demonstration, grant, and program slip across all entities since 2018.
    whyItMatters: >-
      The milestone table is intentionally selective and may omit secondary events that would help investors map program
      pacing in more detail.
    diligencePath: >-
      Build a full corporate and regulatory chronology from press releases, filing dates, and certification
      correspondence.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: route economics
    missingEvidence: >-
      Aircraft-level retrofit cost, hydrogen price assumptions, and utilization needed to convert market size into a
      defensible SAM.
    whyItMatters: >-
      Without route economics, top-down market size does not tell an investor whether the first deployments can clear
      operating-return hurdles.
    diligencePath: Request route-level business cases for RVL, Loganair, and Norway ODIN pilots.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: regional leadership
    missingEvidence: >-
      A harmonized method for comparing Europe, North America, and Asia-Pacific leadership using the same unit of
      analysis.
    whyItMatters: >-
      Analyst reports disagree on which region leads, so geographic prioritization can be distorted if a single report
      is taken literally.
    diligencePath: Normalize retained reports by segment scope, time horizon, and value-chain inclusion.
    relatedQuestionRefs:
      - QM016
      - QM017
  - type: private-evidence-only
    severity: material
    topic: order quality
    missingEvidence: Firm-versus-conditional breakdown for public orders and MOUs.
    whyItMatters: The company's market credibility depends on how much of the stated backlog is legally or economically actionable.
    diligencePath: Review customer agreement schedules and milestone conditions for the top counterparties.
    relatedQuestionRefs:
      - QM018
      - QM025
  - type: stale
    severity: minor
    topic: infrastructure timing
    missingEvidence: An updated 2026-2027 airport-readiness map specific to hydrogen, not just generic electric-aircraft planning.
    whyItMatters: The best retained infrastructure deep-dive is structural but older than the latest company route plans.
    diligencePath: Collect airport planning documents for Cotswold, East Midlands, Norwegian airports, and relevant US sites.
    relatedQuestionRefs:
      - QM011
      - QM015
  - type: missing-source
    severity: minor
    topic: som quantification
    missingEvidence: Publicly disclosed corridor-level demand or revenue model for named launch routes.
    whyItMatters: A real SOM requires more than press-release volume claims.
    diligencePath: Ask management for route, aircraft-count, and revenue assumptions by launch partner.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: commercial terms
    missingEvidence: Pricing, retrofit cost, and warranty terms across ZeroAvia and peers.
    whyItMatters: Without commercial terms, buyers cannot truly compare proposition strength or switching cost.
    diligencePath: Collect quotes, term sheets, or customer-side cost models for major programs.
    relatedQuestionRefs:
      - QP009
      - QP024
  - type: private-evidence-only
    severity: material
    topic: order conversion
    missingEvidence: Firm-versus-conditional order breakdown across ZeroAvia and peer announcements.
    whyItMatters: Public partnership breadth can overstate real commercial commitment.
    diligencePath: Review contract status and milestone conditions for disclosed counterparties.
    relatedQuestionRefs:
      - QP005
      - QP025
  - type: missing-source
    severity: material
    topic: technical benchmark
    missingEvidence: Normalized public data on power density, maintenance interval, and mission economics across peers.
    whyItMatters: The most important buyer criteria are still not comparable on a like-for-like basis.
    diligencePath: Build an engineering benchmark pack from management data and independent test results.
    relatedQuestionRefs:
      - QP007
      - QP024
  - type: private-evidence-only
    severity: minor
    topic: battery-electric substitution
    missingEvidence: Route-by-route crossover analysis for when battery-electric beats hydrogen-electric.
    whyItMatters: Substitute risk from players like magniX depends on mission specifics rather than generic technology labels.
    diligencePath: Model duty cycles, turnaround, and payload for short routes.
    relatedQuestionRefs:
      - QP019
      - QP025
  - type: stale
    severity: minor
    topic: peer stability
    missingEvidence: Updated 2026 funding and staffing snapshots for all peer companies.
    whyItMatters: Competitive position can shift quickly in a capital-intensive sector.
    diligencePath: Refresh peer financing, certification, and workforce data before investment committee.
    relatedQuestionRefs:
      - QP012
      - QP025
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Recognized revenue, backlog conversion, and average selling prices by product line.
    whyItMatters: >-
