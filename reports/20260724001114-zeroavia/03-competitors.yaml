- id: switching-costs-and-moat-durability
  title: Switching costs and moat durability
  body: 'Hydrogen-electric propulsion creates unusually high switching costs because the aircraft is only one part of the system. Airlines and airports must also solve hydrogen supply, training, maintenance, and handling. That means certification progress and partner ecosystems can become moat elements in their own right. ZeroAvia''s public ground-test, DOA, training, and modular power-system milestones therefore matter competitively even before final type certification is complete.


    Still, moat durability is not unambiguous. Universal Hydrogen''s failure shows the segment can eliminate well-known players. ZeroAvia''s own layoffs and schedule slippage show leadership can still be fragile. The moat today is best described as provisional: real, but not yet self-reinforcing enough to remove financing and execution risk.'
