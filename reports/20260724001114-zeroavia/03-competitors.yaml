chapter:
  number: 3
  title: Competitors
  summary: 'ZeroAvia sits in a relatively small first tier of regional hydrogen-electric aviation contenders, with the best disclosed combination of airline/OEM counterparties, modular product surface, and near-term retrofit mission fit in retained public sources. H2FLY remains a credible specialist, Airbus ZEROe a longer-horizon incumbent threat, and magniX an important battery-electric substitute. The competitive conclusion is favorable but conditional: ZeroAvia looks ahead on public proof, yet still operates in a segment where financing shocks and infrastructure complexity can quickly change the leaderboard.'
sections:
- id: landscape-and-peer-set
  title: Landscape and peer set
  body: 'The right competitive set around ZeroAvia has three layers. First are direct hydrogen-electric propulsion peers such as H2FLY. Second are larger hydrogen-aircraft initiatives such as Airbus ZEROe that compete more for strategic narrative and talent than for the exact same first deployments. Third are substitute zero-emission propulsion paths such as magniX''s battery-electric approach, which can win buyer attention on shorter routes even without hydrogen. Universal Hydrogen belongs in the landscape as a cautionary historical peer: its failure reduced crowding, but it also showed how hard this segment is.


    Within that set, ZeroAvia stands out for spanning both smaller and larger regional aircraft with ZA600 and ZA2000. That gives it a broader mission envelope than many peers, but it also increases execution burden.


    A second important boundary is between companies selling propulsion modules and companies selling whole-aircraft narratives. ZeroAvia increasingly belongs to the first camp because its modular fuel-cell, training, and airport-integration story can extend into defense or specialty airframes. That makes the peer set broader than hydrogen startups alone and partly explains why substitute technologies still matter.'
