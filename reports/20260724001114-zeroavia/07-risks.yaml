- id: people-financial-and-thesis-break-risk
  title: People, financial, and thesis-break risk
  body: 'Financial and people risks are now tightly intertwined. Independent 2026 reporting linked the companys layoffs directly to the amount of capital available after the late-2025 round. That means talent retention, schedule fidelity, and customer confidence can all deteriorate through the same channel if capital tightens again. Leadership transition deepens that sensitivity. Replacing a founder-CEO while simultaneously re-sequencing the product roadmap and protecting relationships with investors and regulators is possible, but it raises the coordination burden at exactly the wrong time.


    The public record does offer mitigants. Repeat investors stayed involved, runway was extended, regulators kept engaging, and a standalone fuel-cell module path may create earlier commercial traction than waiting for the full airline powertrain. But those are mitigants to risk, not proof that risk has been retired. The most important thesis-break triggers remain clear: failure to hit the revised certification path, evidence that module adjacency has become a permanent substitute for airline propulsion rather than a bridge to it, and any sign that financing access tightens before the company converts current momentum into certifiable deliverables.


    The practical diligence implication is straightforward. Investors should monitor this company as a series of linked milestones, not as a smooth trend line.'
