company:
  name: ZeroAvia
chapter:
  number: 7
  title: Risks
summary: 'ZeroAvias risk profile is dominated by execution under constraint: novel certification, hydrogen infrastructure dependence, high capital intensity, and leadership transition are all arriving at once. The company has real mitigants—UK CAA DOA, FAA special-conditions progress, strategic investors, grants, and a nearer-term module path—but most remain partial rather than complete de-riskers. Publicly, the highest-confidence adverse signals are the 2026 layoffs, roadmap compression, and management transition. The right risk stance is not “thesis broken,” but “high-risk, milestone-sensitive, and still externally financed.”'
sections:
- id: ranked-risk-posture
  title: Ranked risk posture
  body: 'ZeroAvias risk stack is unusually easy to see in public, which is better than hidden risk but not the same as low risk. The top tier contains certification timing, capital adequacy, and ecosystem dependence. Certification is first because no amount of demand signaling matters if the company cannot move from FAA special conditions and UK CAA design approval into certifiable, shippable products on the revised schedule. Capital is second because the 2025 financing round extended runway only alongside a major workforce reset and roadmap compression. Ecosystem dependence is third because hydrogen availability, airport procedures, training, and retrofit execution sit partly outside ZeroAvias direct control.


    Below that top tier sit operational and people risks. The company is scaling manufacturing readiness in Scotland, maintaining propulsion capability in Everett, and managing a cross-border certification and industrial program. At the same time, founder Val Miftakhov stepped down as CEO in 2026 and the UK entity recorded meaningful board churn. Those are not fatal signals, but they increase the cost of error during a critical operating window.


    The positive counterweight is that the company still has visible investor support, regulator engagement, and a product-sequencing strategy that prioritizes earlier module monetization. Those mitigants are real. They simply do not yet erase the severity of the core risks.'
