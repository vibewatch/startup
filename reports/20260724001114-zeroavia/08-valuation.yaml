- id: bull-base-bear-and-valuation-range
  title: Bull, base, and bear scenarios
  body: 'The bull case is not impossible. It requires the revised certification plan to hold, adjacent module revenue to validate earlier monetization, and concrete operator pathways such as RVL and Norway to harden into visible service-entry milestones. In that state, ZeroAvia could plausibly support a valuation range in the mid- to upper-hundreds of millions moving into the low single-digit billions because strategic scarcity and technology option value would remain high.


    The base case is less exciting but more probable: ZeroAvia stays financeable, keeps regulatory momentum, proves selected module or program milestones, yet still needs another large round before airline-scale economics are visible. That case supports a wide corridor rather than a point estimate, because what investors are really valuing is not current earnings power but milestone-adjusted future option value.


    The bear case is a further reset. Another delay, weaker fundraising, or evidence that the company is becoming an adjacency-only module supplier could drive a materially lower mark or a more dilutive bridge. In other words, downside here is not about technology irrelevance; it is about price and financing structure outrunning progress.'
