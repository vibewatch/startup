- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current cap table
    - Preference stack, dilution, and 2025 round terms
    - Entry price cannot be judged without structure
    - Request board-approved cap-table and term-sheet summary
  - - Cash and burn
    - Current cash, monthly burn, runway assumptions
    - Needed to test financing urgency
    - Review management accounts
  - - Backlog waterfall
    - Firm orders vs options vs MOUs vs conditional orders
    - Converts narrative into commercial quality
    - Request pipeline ledger by customer
  - - Commercialization timetable
    - Product-by-product milestone map
    - Needed to map value to time
    - Review program plan across module and engine paths
  - - Customer status ledger
    - Current stage for RVL, ODIN, American, Loganair, ASL, De Havilland
    - Tests whether proof is hardening or stalling
    - Request CRM / board pipeline summary
  - - Manufacturing capex plan
    - Scotland/US capex, staffing, and output assumptions
    - Affects dilution and downside severity
    - Review plant and operations budget
  notes: If these asks are answered well, the recommendation can improve quickly; if not, valuation should remain discounted.
