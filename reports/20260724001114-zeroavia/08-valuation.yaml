company:
  name: ZeroAvia
chapter:
  number: 8
  title: Valuation
summary: 'ZeroAvia should be treated as a strategically important but still price-sensitive aviation deep-tech opportunity. Public evidence supports a TRACK / research-more recommendation: the company has a top-tier strategic investor set, real certification progress, and unusually broad counterpart validation, yet still lacks a current primary-source valuation mark, disclosed revenue, gross margin, or cap-table clarity. The base case is that ZeroAvia remains financeable and advances through key regulatory milestones, which can justify a broad high-hundreds-of-millions to low-billions enterprise-value corridor. The bear case is equally credible if schedule or funding pressure forces another reset before routine commercial traction appears. That makes discipline around entry price, milestone triggers, and final diligence asks more important than top-down market excitement.'
sections:
- id: recommendation-thesis-and-anti-thesis
  title: Recommendation, thesis, and anti-thesis
  body: 'The recommendation is TRACK / research more rather than buy or avoid. The reason is not that ZeroAvia lacks promise; it is that the public evidence and the public valuation anchor are mismatched. On one side of the scale sit strong positives: a $150 million strategic Series C, follow-on financing in late 2025, regulatory progress with both the UK CAA and FAA, a launch-operator pathway, and adjacent module opportunities that can create earlier monetization than airline propulsion alone. On the other side sit equally material negatives: no public current post-money valuation in primary sources, no disclosed revenue, no disclosed gross margin, no disclosed cash balance, and independent evidence that the company already had to cut staff and compress the roadmap to fit the funding environment.


    The thesis is that ZeroAvia may still be one of the most credible hydrogen-electric aviation companies because it has multiple shots on goal and unusually strong strategic validation for its stage. The anti-thesis is that credibility alone does not guarantee attractive entry. In capital-intensive aviation, buying a good company at an undisciplined price can still be a weak investment.


    That is why price sensitivity matters so much here. A buyer should want either a clearly attractive entry range or meaningfully better private data before underwriting aggressively.'
