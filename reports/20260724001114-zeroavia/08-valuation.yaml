  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current priced valuation, 2025 round amount, cap-table terms, and preference stack.
    whyItMatters: Without them, investors cannot know whether the current entry is still rational relative to risk.
    diligencePath: Request latest financing documents, cap-table summary, and board-approved valuation materials.
    relatedQuestionRefs:
    - QV004
    - QV006
    - QV021
  - type: private-evidence-only
    severity: material
    topic: commercial proof
    missingEvidence: Current revenue, gross margin, bookings by commitment type, and customer-status ledger.
    whyItMatters: Scenario ranges remain guesswork until commercial quality is visible.
    diligencePath: Review management reporting pack and CRM stage ledger.
    relatedQuestionRefs:
    - QV018
    - QV029
  - type: conflicting-data
    severity: material
    topic: market comparables
    missingEvidence: A harmonized methodology for comparing hydrogen retrofit propulsion with eVTOL and broader advanced-aviation public comps.
    whyItMatters: Comparable misuse can produce false confidence in either direction.
    diligencePath: Build a bespoke comp framework tied to certification stage, capital intensity, and revenue model rather than aircraft type alone.
    relatedQuestionRefs:
    - QV013
    - QV015
  - type: conflicting-data
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: A fully normalized comparable set that matches ZeroAvia on propulsion model, certification stage, and revenue maturity.
    whyItMatters: The comparable valuation table is intentionally partial because no public comp cleanly matches a hydrogen-retrofit propulsion company at this stage.
    diligencePath: Build a custom comp set blending advanced aviation, propulsion, and milestone-based private rounds.
    relatedQuestionRefs:
    - QV013
    - QV015
    relatedTableRefs:
    - TV004
