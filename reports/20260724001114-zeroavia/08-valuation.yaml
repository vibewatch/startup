- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Certification slips again
    - Revised path loses credibility
    - Breaks bull/base timing assumptions
    - Move to avoid or deep caution
  - - Weak financing event
    - Bridge or down-round without milestone progress
    - Signals capital market skepticism and dilution pressure
    - Re-price downside immediately
  - - Adjacency drift
    - Module business eclipses airline propulsion path
    - Changes core business model being underwritten
    - Re-underwrite as components play
  - - No concrete service-entry progress
    - Launch paths remain narrative only
    - Undermines commercial-option value
    - Maintain track status or reduce interest
  notes: These are monitorable public or diligence-visible triggers, not abstract worries.
