- id: named-customer-proof-and-adoption-path
  title: Named customer proof and adoption path
  body: 'The strongest named proof is RVL Aviation. That announcement goes beyond logo usage by identifying the Cessna Grand Caravan as the launch aircraft, describing the intended operating context in the British Isles, and explicitly conditioning service on certification, retrofit, and training completion. Loganair is another high-value proof point because the retained record ties the relationship to real route geography, the Twin Otter and ATR-family fleet context, and a broader Scottish hydrogen ecosystem. It is still an MOU, not a production order, but it is more operationally grounded than a generic partnership press release.


    American Airlines provides powerful demand signaling through its conditional 100-engine purchase and investment, but it does not prove active service or repeat purchase. De Havilland Canada and Alaska add OEM and larger-aircraft pathway relevance, while ASL Aviation gives cargo-specific credibility. Project ODIN is the broadest public deployment pathway because it names fifteen Cessna Grand Caravans across fifteen Norwegian airports, indicating a programmatic multi-asset ambition rather than a single logo.


    Taken together, these proof points show that ZeroAvia has assembled an unusually broad first-ring customer narrative for its stage. What they do not yet show is normalized repeat usage, paid fleet expansion, or routine passenger service.'
