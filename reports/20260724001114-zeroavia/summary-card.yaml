  topStrengths:
    - >-
      Strategic financing depth: the 2024 $150M Series C and late-2025 follow-on round show repeat investor support from
      airlines, aerospace, sovereign, and climate-transition capital.
    - >-
      Real regulatory progress: UK CAA DOA and FAA special-conditions work indicate the program has moved well beyond
      concept stage.
    - >-
      Broader-than-average product surface for the category, including standalone fuel-cell modules and adjacent
      defense/UAV opportunities that can monetize before full airline-scale propulsion.
    - >-
      Named counterpart breadth across RVL, Loganair, American, ASL, De Havilland, Alaska, and Norway's ODIN pathway
      supports strong commercial-interest signaling.
    - >-
      Product and ecosystem strategy appears modular enough to create multiple shots on goal rather than dependence on
      one single aircraft program.
  topRisks:
    - >-
      Certification and timeline risk remain the central threat; final product approvals and routine commercial service
      are still ahead, and 2026 reporting already documented roadmap compression.
    - >-
      Capital intensity and opacity remain high: no public revenue, cash, margin, or 2025 financing-term disclosure is
      sufficient for precise underwriting.
    - >-
      Workforce cuts and leadership transition raise execution risk during a period that demands disciplined
      certification and commercialization progress.
    - >-
      Early deployments depend on hydrogen infrastructure, training, and partner coordination outside ZeroAvia's sole
      control.
    - >-
      Current valuation is not anchored by a fresh primary-source mark, leaving the company vulnerable to either
      over-optimistic narrative pricing or a future down-round reset.
  unresolvedGaps:
    - >-
      Current post-money valuation, 2025 financing amount, dilution terms, and preference stack are not publicly
      disclosed.
    - Current cash balance, monthly burn, and product-level gross margin are not public.
    - Customer-by-customer commercialization status, backlog conversion, and revenue concentration remain opaque.
    - The public record does not show routine zero-emission commercial service using ZeroAvia hardware.
    - Detailed supplier concentration, freedom-to-operate analysis, and capex ramp assumptions remain private.
