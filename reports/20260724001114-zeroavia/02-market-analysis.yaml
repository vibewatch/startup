  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: route economics
    missingEvidence: Aircraft-level retrofit cost, hydrogen price assumptions, and utilization needed to convert market size into a defensible SAM.
    whyItMatters: Without route economics, top-down market size does not tell an investor whether the first deployments can clear operating-return hurdles.
    diligencePath: Request route-level business cases for RVL, Loganair, and Norway ODIN pilots.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: material
    topic: regional leadership
    missingEvidence: A harmonized method for comparing Europe, North America, and Asia-Pacific leadership using the same unit of analysis.
    whyItMatters: Analyst reports disagree on which region leads, so geographic prioritization can be distorted if a single report is taken literally.
    diligencePath: Normalize retained reports by segment scope, time horizon, and value-chain inclusion.
    relatedQuestionRefs:
    - QM016
    - QM017
  - type: private-evidence-only
    severity: material
    topic: order quality
    missingEvidence: Firm-versus-conditional breakdown for public orders and MOUs.
    whyItMatters: The company's market credibility depends on how much of the stated backlog is legally or economically actionable.
    diligencePath: Review customer agreement schedules and milestone conditions for the top counterparties.
    relatedQuestionRefs:
    - QM018
    - QM025
  - type: stale
    severity: minor
    topic: infrastructure timing
    missingEvidence: An updated 2026-2027 airport-readiness map specific to hydrogen, not just generic electric-aircraft planning.
    whyItMatters: The best retained infrastructure deep-dive is structural but older than the latest company route plans.
    diligencePath: Collect airport planning documents for Cotswold, East Midlands, Norwegian airports, and relevant US sites.
    relatedQuestionRefs:
    - QM011
    - QM015
  - type: missing-source
    severity: minor
    topic: som quantification
    missingEvidence: Publicly disclosed corridor-level demand or revenue model for named launch routes.
    whyItMatters: A real SOM requires more than press-release volume claims.
    diligencePath: Ask management for route, aircraft-count, and revenue assumptions by launch partner.
    relatedQuestionRefs:
    - QM024
    - QM025
