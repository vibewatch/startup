- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Airline decarbonization pressure
    - Positive
    - Current
    - Creates willingness to trial new propulsion
    - Which carriers will fund actual conversions rather than only options?
  - - Lower fuel-cost volatility / maintenance promise
    - Positive
    - Current to medium term
    - Can improve regional route economics if proven
    - What real-world cost data supports the claim?
  - - Strategic partnerships and grants
    - Positive
    - Current
    - Subsidize first deployments and infrastructure
    - Which programs survive if public support softens?
  - - Certification novelty
    - Negative
    - Current
    - Slows entry into service and increases cash burn
    - What are the remaining approval gates by jurisdiction?
  - - Airport hydrogen and power infrastructure
    - Negative
    - Current to medium term
    - Can bottleneck route launches even with willing operators
    - Which airports are funded and shovel-ready?
  - - Fleet turnover and retrofit downtime
    - Negative
    - Medium term
    - Limits how quickly large fleets can adopt
    - What retrofit downtime and capex are required per aircraft?
  - - Conditional order quality
    - Negative
    - Current
    - Demand may be softer than backlog headlines imply
    - How many orders are firm versus milestone-gated?
  notes: Constraints are not reasons the market fails; they are reasons adoption likely happens corridor by corridor rather than as a broad fleet wave.
