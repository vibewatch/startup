        - FlightSafety / 运营商 MRO 生态
        - 飞行员和维修人员赋能
        - 中
        - 技术有进展，但客户上线延迟
        - 中高
        - 培训合作已落地
        - 中
      - - 首发运营商
        - RVL / 航空公司路径
        - 首个用例验证
        - 中高
        - 上线延迟侵蚀客户信心
        - 高
        - 多个已披露名称的交易对手
        - 中高
      - - 资本提供方
        - 战略投资者和气候投资者
        - 现金跑道和规模化资本
        - 高
        - 进一步融资缺口触发更多削减
        - 高
        - 老投资者继续参与
        - 高
      - - OEM / 机体路径
        - De Havilland 及类似伙伴
        - 平台接入与集成
        - 中
        - 动力总成有进展，但机体路径停滞
        - 中高
        - 多个机体目标
        - 中高
    notes: 多数早期商业风险是依赖风险，而不是纯需求风险。
    claimRefs:
      - CR019
      - CR020
      - CR026
      - CR030
      - CR033
      - CR043
  - id: TR004
    title: 人员 / 执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - CEO / 高管领导层
        - 里程碑密集期发生领导层交接
        - 中
        - 高
        - 执行董事长延续性和董事会监督
        - 审查寻任进展和决策权
      - - 认证和飞行测试人才
        - 裁员可能削弱稀缺专业能力
        - 中
        - 高
        - 管理层称现有团队足够
        - 梳理当前认证组织和外部顾问
      - - 制造领导层
        - 苏格兰爬坡需要有经验的工厂执行能力
        - 中
        - 中高
        - 政府和投资者支持
        - 索取工厂招聘和投产计划
      - - 财务领导层
        - 治理变动和已披露离任
        - 中
        - 中高
        - 新的董事会构成
        - 审查财务领导层连续性和控制
    notes: 人员风险被放大，因为高度专业化的航空航天人才很难快速替换。
    claimRefs:
      - CR007
      - CR009
      - CR010
      - CR031
      - CR038
  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 认证风险
        - 修订后的燃料电池认证路径再次滑坡
        - 到下一个主要申报周期仍无明确监管里程碑进展
        - 转入深度尽调或暂停
      - - 资本风险
        - 再次重置人员规模，或出现未披露紧急融资
        - 明确技术里程碑交付前出现重大削减
        - 假设降估值融资或投资逻辑承压
      - - 客户转化风险
        - 没有首发运营商服务日期，也没有模块复购证据
        - 未来 12 个月关系仍只停留在客户标识
        - 大幅折减商业证明权重
      - - 基础设施风险
        - 旗舰航线没有机场氢能就绪证据
        - ODIN / RVL 基础设施里程碑停滞
        - 把生态风险视为足以打破投资逻辑的变量
      - - 战略漂移风险
        - 模块相邻业务挤占航空公司推进系统路线图
        - 管理层叙事弱化核心机体认证
        - 改按组件型公司重新建模
    notes: 否决标准设计成可从管理层材料或后续公开里程碑观察。
    claimRefs:
      - CR028
      - CR029
      - CR036
      - CR037
      - CR042
      - CR044
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 跟踪 / 继续研究
        - 中低
        - 高
        - 对价格敏感；只适合宽区间
        - 没有私下尽调，或相较乐观叙事没有足够折价，不应承诺投资
    notes: 建议由估值不确定性驱动，而不是缺少战略兴趣。
    claimRefs:
      - CV001
      - CV008
      - CV031
      - CV040
      - CV042
  - id: TV002
    title: 投资逻辑 / 反方论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 战略投资者阵容、监管进展和多条产品路径，支撑真实期权价值
        - 经验证的现金、收入和订单转化数据，会显著强化投资逻辑
      - - 首发运营商和挪威路径，比泛泛的客户标识清单更具体
        - 明确的商业服务日期会让判断更偏正面
      - - 氢电航空仍可能创造稀缺战略资产
        - 再次重大滑坡或疲弱融资事件，会强化反方论点
      - - 资本强度、不透明和时间风险，仍可能压过战略光环
        - 更低入场价或更干净条款，可抵消部分运营不确定性
    notes: 反方论点主要围绕价格、稀释和时间，不是质疑技术野心是否存在。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV029
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 修订后的认证路径守住；模块收入形成牵引；RVL / ODIN 固化为服务里程碑
        - 约 $1.4B-$2.2B 企业价值区间；上行来自战略稀缺性
        - 执行仍然资本密集
        - 低至中
      - - 基准
        - 公司仍可融资，监管继续推进，但尚未全面商业爆发
        - 约 $0.7B-$1.3B 区间；期权价值仍在，但被不确定性稀释
        - 需要再融一轮大额资金，并持续兑现里程碑
        - 中
      - - 悲观
        - 再度延期、融资更紧，或战略漂向只做邻近模块
        - 约 $0.3B-$0.7B 区间，或高度稀释的过桥融资 / 估值下调轮
        - 进度、融资和客户转化风险叠加
        - 中
    notes: 区间是情景走廊，不是审计估值。它们反映的是按里程碑调整后的私营公司期权价值， 而非当前财务倍数。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV027
      - CV028
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照价值
      - 局限
    rows:
      - - Joby Aviation
        - 已上市、处于认证阶段的先进航空公司
        - 公开市场估值随里程碑和融资情绪波动
        - 显示市场愿意为长周期航空项目买单
        - eVTOL 模式不同于氢动力改装推进
      - - Archer Aviation
        - 已上市先进航空同业
        - 投资者关系材料和文件提供公开里程碑 / 融资数据点
        - 有助于理解认证阶段资本市场心理
        - 不是氢动力总成改装业务
      - - Vertical Aerospace
        - 已上市先进航空同业，披露融资方案和资金续航
        - 显示技术进展与融资风险可以并存
        - 最适合作为里程碑敏感下行的警示同业
        - 飞机类别和资本结构不同
      - - ZeroAvia 私募市场跟踪估值
        - Caplight / Tracxn / CB Insights 档案
        - 仅作方向参考；当前精确估值未经一手来源核验
        - 可辅助三角校验私募市场叙事
        - 方法不透明，条款缺失
    notes: 这些可比对象只作方向参考，不应当作公式化倍数集合。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and tracker references available for a certification-stage aviation
        valuation discussion.
    claimRefs:
      - CV004
      - CV013
      - CV014
      - CV015
      - CV016
      - CV035
  - id: TV005
    title: 投资假设破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资假设的冲击
      - 行动含义
    rows:
      - - 认证再次滑期
        - 修订后的路径失去可信度
        - 打破乐观 / 基准情景的时点假设
        - 转为回避或高度谨慎
      - - 融资事件偏弱
        - 无里程碑进展的过桥融资或估值下调轮
        - 释放资本市场怀疑和稀释压力信号
        - 立即重估下行情景
      - - 业务漂向邻近方向
        - 模块业务盖过航空公司推进主线
        - 尽调定价所依据的核心商业模式变了
        - 按零部件业务重新承销
      - - 投入运营没有实质进展
        - 首发路径仍停留在叙事层面
        - 削弱商业期权价值
        - 维持跟踪，或降低兴趣
    notes: 这些是可公开监测或尽调可见的触发项，不是抽象担忧。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前股权结构
        - 优先清偿顺位、稀释和 2025 年融资条款
        - 没有结构就无法判断入场价格
        - 要求提供董事会批准的股权结构表和投资条款清单摘要
      - - 现金与消耗
        - 当前现金、月度消耗、续航假设
        - 需要检验融资紧迫性
        - 审阅管理账
      - - 订单积压瀑布
        - 确定订单、选择权、MOU 和有条件订单的拆分
        - 把叙事转成商业质量
        - 按客户索取销售管线台账
      - - 商业化时间表
        - 按产品拆分的里程碑图
        - 需要把价值映射到时间
        - 审阅模块与发动机两条路径的项目计划
      - - 客户状态台账
        - RVL、ODIN、American、Loganair、ASL、De Havilland 当前阶段
        - 检验验证是在变硬还是停滞
        - 索取 CRM / 董事会销售管线摘要
      - - 制造资本开支计划
        - 苏格兰 / 美国资本开支、人员和产出假设
        - 影响稀释和下行情景严重度
        - 审阅工厂和运营预算
    notes: 如果这些问题回答扎实，推荐评级可以很快上调；否则估值仍应打折。
    claimRefs:
      - CV021
      - CV024
      - CV039
figures:
  - id: FO001
    title: ZeroAvia 里程碑时间线
    type: timeline
    layout: wide
    summary: 这组里程碑显示，ZeroAvia 已从早期演示推进到严肃的认证和客户路径活动， 但在 2026 年遭遇一次实质性的成本与时间表重置。
    data:
      items:
        - label: 成立
          date: '2018'
          detail: ZeroAvia 成立，英国运营实体随后于 2018 年 10 月注册成立。
          tone: neutral
        - label: 早期演示飞行
          date: 2019-2020
          detail: 美国和英国的氢电演示飞行把概念带入公开测试运营。
          tone: positive
        - label: Alaska Q400 合作
          date: Oct 2021
          detail: Alaska 支持 76 座 ZA2000 路径，并锁定最多 50 套套件。
          tone: positive
        - label: De Havilland MOU
          date: Dec 2021
          detail: Dash 8-400 改装和出厂装配探索增加 OEM 商业落地逻辑。
          tone: positive
        - label: American 有条件订单
          date: Jul 2024
          detail: American 增加投资，并在里程碑达成前提下签下 100 台发动机。
          tone: positive
        - label: C 轮达到 $150M
          date: Sep 2024
          detail: 广泛的战略投资人轮次完成，航空公司、OEM 和主权资本参与。
          tone: positive
        - label: RVL 成为首发运营商
          date: May 2025
          detail: ZeroAvia 确定首个目标英国 ZA600 货运运营商。
          tone: positive
        - label: 英国 CAA DOA
          date: Nov 2025
          detail: 公司称其成为首个获得这类批准的氢电推进开发商。
          tone: positive
        - label: Norway ODIN 拨款准备
          date: Nov 2025
          detail: 15 架飞机、15 座机场的网络概念入选欧盟拨款协议准备流程。
          tone: positive
        - label: 延长资金续航的融资轮
          date: Dec 2025
          detail: 进一步融资把资金续航延长两年，但也凸显公司聚焦眼前机会。
          tone: warning
        - label: 裁员与认证重置
          date: Jan 2026
          detail: 独立报道称员工数约砍半，ZA600 完整认证延后。
          tone: negative
        - label: FAA 特殊条件
          date: Apr 2026
          detail: 美国监管机构发布 600kW 系统的新型电动发动机条件。
          tone: positive
        - label: CEO 交接
          date: May-Jun 2026
          detail: 创始人卸任 CEO 但留任董事会；执行董事长负责运营。
          tone: warning
    approximationNotes: 2019-2020 年演示阶段依据 ZeroAvia 公开历史页概括， 而非单独的一手飞行测试记录。
    claimRefs:
      - CO001
      - CO010
      - CO014
      - CO017
      - CO019
      - CO020
      - CO021
      - CO026
      - CO028
      - CO030
      - CO031
      - CO038
