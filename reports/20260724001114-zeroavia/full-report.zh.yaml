      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，近期走向公开市场很难站住脚。IPO 级故事通常需要更清晰的收入基础、更强披露和更成熟的运营证明，而 ZeroAvia
              目前都没有提供。更可能的退出路径是另一轮后期私募、战略资本，或等技术和客户路径更成熟后进行战略并购。


              这并不意味着公司不可投资；它意味着关键尽调问题不是氢能航空是否有趣，而是眼前的具体价格和结构是否足以补偿风险。最重要的缺失项包括当前股权结构、2025
              年融资金额和条款、现金与烧钱细节、按承诺类型拆分的订单储备瀑布，以及逐产品商业化时间表。


              在这些资料到手之前，正确姿态是把公司放在观察名单首页，但不要假装能精确估值。
