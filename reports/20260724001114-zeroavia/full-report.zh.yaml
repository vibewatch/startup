      - number: '7.3'
        title: 运营、伙伴与技术风险
        blocks:
          - type: paragraph
            body: >-
              运营风险始于一个事实：ZeroAvia
              建的是全栈航空项目，而不是狭窄部件创业公司。它必须并行推进认证工作、燃料电池开发、制造就绪、机体集成、机场氢能就绪和培训。任何一条线都可能拖慢其他线。苏格兰制造项目在战略上合理，因为它锚定燃料电池电堆生产；但它也带来自己的场地爬坡风险。氢能基础设施是另一项系统依赖：航线启动需要燃料、处理、机场流程和运营商就绪，而不只是获批的动力总成。


              ZA600 与更大型液氢路径之间，技术挑战也发生实质变化。近期气态氢项目不能解决 40-80 座飞机所需的储存、热管理和系统集成问题。公开拨款和 KAERI 合作材料把液氢当成单独工作流，实际上承认了这一点。


              伙伴依赖进一步放大了图景。早期航空公司和运营商路径需要与启动运营商、机场、培训伙伴，以及可能的出租方或政府利益相关方协调。这张网络可以创造护城河，但在商业化之前也会制造脆弱性。任何节点延误，都可能在项目其余部分产生回响。
