      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              正向需求逻辑很直接。航空公司和监管方需要低排放推进选项，ZeroAvia
              自己的产品页面强调，在合适任务中燃料成本波动更低、维护更少、噪音更低，生命周期气候表现也大幅改善。市场报告支持底层宏观逻辑：可持续航空压力、战略合作和燃料电池改进都是真实驱动因素。


              负面逻辑同样重要。GAO 和 McKinsey/WEF 都明确指出，市场受到基础设施和认证约束。机场仍面对成本、电力和需求不确定性障碍。McKinsey/WEF 估计，到 2050
              年，替代推进需要数百太瓦时清洁能源，资本开支达到数万亿美元。FAA 认证仍逐案推进，截至 2026 年 3
              月，还没有任何有人驾驶电动飞机取得型号合格证。这些现实意味着，市场时点至少和系统协调一样取决于发动机性能。
