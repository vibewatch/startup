  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              建议是 TRACK / 继续研究，而不是买入或回避。原因不是 ZeroAvia 没有想象力，而是公开证据与公开估值锚并不匹配。天平一边是很强的正面因素：$150 million 战略 Series C、2025
              年末跟投融资、UK CAA 和 FAA
              双线监管进展、启动运营商路径，以及相邻模块机会——这些机会比单靠航司推进更早变现。另一边也有同样重的负面：一手资料没有公开当前投后估值、收入、毛利率、现金余额；独立证据还显示，公司已经为适应融资环境裁员并压缩路线图。


              投资论点是，ZeroAvia
              仍可能是最可信的氢电航空公司之一，因为它有多条破局路径，并且在所处阶段拿到了异常强的战略背书。反论点是，可信度本身不保证入场有吸引力。在资本密集型航空里，哪怕公司很好，出价不守纪律也可能是一笔弱投资。


              也正因此，价格敏感性在这里极其重要。买方要么拿到明确有吸引力的入场区间，要么拿到明显更好的私有数据，再去激进承销。
