      - number: '1.2'
        title: 领导层、治理与阶段
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 进入 2026 年时仍是创始人领导的规模化创业公司，但上半年结束时已经进入领导层过渡。公司 2026 年 6 月宣布，创始人 Val Miftakhov 已于 5 月 26
              日卸任首席执行官，同时留任董事会；在寻找永久 CEO 期间，执行主席 Christine Ourmières-Widener
              负责日常运营。这是一个重要阶段信号：公司不再只是技术驱动的创业叙事，而是在为资本纪律、认证和商业执行重新调整组织。


              留存公开申报中的治理记录提供了更多细节，而不是单纯的安心信号。Companies House 显示，Miftakhov 在 CEO 交接同日终止担任英国实体董事；Sergey Kiselev 于 2026 年 6
              月终止董事职务，Georgy Egorov 于 2026 年 1 月终止董事和秘书职务。同一申报历史显示，John William Royston King 于 2026 年 3
              月加入董事会。这些变动不能证明公司失序，但确实显示，承载公司英国主要运营的实体存在真实治理更替。


              从阶段看，ZeroAvia 仍更像后期风险投资 /
              成长期公司，而非商业成熟企业。它有庞大的产业雄心、重要战略投资者、公开认证工作和具名启动运营商，但没有披露经常性收入基础，没有公开估值更新，也没有证据表明已进入常态商业运营。因此，合适的阶段标签是：C
              轮后、规模化商业化前；领导层过渡和成本纪律正在定义近期执行环境。
