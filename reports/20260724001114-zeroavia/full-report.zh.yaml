  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的公开财务故事从产品范围开始。公司并不把自己呈现为依赖未来一款发动机销售的飞机 OEM。它销售面向运输机的推进系统、面向国防和 UAV
              用例的模块化燃料电池系统，以及在常态航空公司服务开始前就可能有价值的氢能赋能服务。这个区别重要，因为它创造了几条潜在收入通道：改装项目的发动机套件或动力总成、独立燃料电池发电系统、工程和机体集成工作、培训与支持，以及更长期的机场氢能或生态服务。留存记录因此支持一种比“认证后卖发动机”更宽的收入架构。


              问题在于定价不透明。公开公告在交易方、目标机体和战略意图上信息丰富，但没有披露已实现售价、订金、里程碑付款安排或毛利率。American 的有条件采购、挪威 15
              架飞机路径和国防模块交付都显示商业兴趣，但没有一个能让投资者把需求信号转化为已入账收入质量。因此，公开变现案例最强在包装宽度，最弱在合同经济性。


              一个重要正面因素是，管理层在 2025 年末把重点转向 SuperStack Flex 和其他独立燃料电池系统。这些产品可以触达国防、UAV 和辅助动力买方，不必等整套 ZA600
              推进包完成所有认证里程碑。这让收入故事比单一项目押注更有韧性，但也暗示公司在资本压力下优先推进最可能更早产生现金回款的产品。
