      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景并非不可能。它要求修订后的认证计划守住、相邻模块收入验证更早变现，且 RVL 和 Norway 等具体运营商路径固化为可见的入役里程碑。到了那种状态，ZeroAvia
              估值合理区间可能从数亿美元中高段走向低个位数十亿美元，因为战略稀缺性和技术期权价值仍会很高。


              基准情景没那么振奋，但概率更高：ZeroAvia
              仍能融到钱，保持监管动能，证明若干模块或项目里程碑，但在航司规模经济性清晰之前仍需要另一轮大额融资。这个情景支撑的是一条宽走廊，而不是一个点估值，因为投资人真正定价的不是当前盈利能力，而是经里程碑调整后的未来期权价值。


              熊市情景是进一步重置。再一次延误、募资变弱，或证据显示公司正变成只做相邻模块的供应商，都可能带来大幅下调估值或更稀释的过桥融资。换句话说，这里的下行不是技术无关紧要，而是价格和融资结构跑在进展前面。
