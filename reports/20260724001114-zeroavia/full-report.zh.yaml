      - number: '2.4'
        title: 区域优先级与规模缺口
        blocks:
          - type: paragraph
            body: >-
              地理图景混杂，但可以行动。Global Market Insights 称欧洲是最大市场、亚太增长最快；The Business Research Company
              则称北美既最大又增长最快。360iResearch 实际上调和了这种冲突：不同区域在不同层面领先，欧洲强在政策整合，北美强在认证准备和氢能资金，亚太强在产业动能。对 ZeroAvia
              而言，留存证据支持跨大西洋支线策略：英国和挪威项目、美国航空公司伙伴，以及未来通过 ITOCHU 等伙伴获得亚洲分销期权。


              尚未解决的规模缺口在于航线级经济性和买方转化质量。公开记录披露的氢气价格、改装 capex 或利用率不足，无法把 TAM 转成可信
              SAM。客户公告也没有稳定区分确定订单与有条件或里程碑门控承诺。正确结论是：市场真实且在增长，但可投资机会仍必须从具名走廊和交易方向内建模。
