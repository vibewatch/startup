      - number: '5.4'
        title: 差异化、信任与开放缺口
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的差异化在氢电架构、模块化和伙伴触达交汇处最强。Airbus 站在更大型飞机的时间线上，H2FLY 验证了支线燃料电池命题，magniX 展示了电池电动替代方案。ZeroAvia
              位于其中间：先做支线改装，再叠加可延伸到国防、eVTOL 和电力应用的模块化燃料电池业务。围绕更大型氢能发动机和 HTPEM 开发的专利，强化了公司正在构建专有技术经验，而不只是系统集成能力的判断。


              信任缺口在于，公开材料仍很少谈可靠性、服务负担、故障模式，或常态运营中的现场表现。监管里程碑有帮助，但不能替代在役证明。因此，投资者应把技术栈视为真实且有差异化，同时继续尽调储罐成熟度、供应商依赖、培训负担，以及商业规模下的可支持性。
