      - number: '8.2'
        title: 融资背景、入场纪律与可比公司
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 最新的硬公开融资锚是 2024 年 9 月 Series C，而不是 2025 年 12
              月延伸轮。后者对连续性和战略排序重要，但没有公开金额或条款，不能像完整披露的定价轮那样锚定内在价值。二级市场和私募跟踪平台指向较高的私有估值和持续投资人兴趣，但它们天生不完整，应当作为三角验证，而非事实本身。


              公开可比公司主要提供警示背景。Joby、Archer 和 Vertical Aerospace
              表明，投资人愿意多年资助认证阶段的航空公司；但它们也说明，估值会多快被流动性、里程碑交付和融资结构绑架。Vertical
              尤其有提醒意义：技术进展、预订单和融资包可以与严重下行风险并存。这些公司都不是直接的氢电改装可比对象，因此它们的价值在于显示市场对风险的容忍度，而不是给 ZeroAvia 套一个干净倍数。


              因此，入场纪律应假定股权结构不透明、多轮私募融资可能留下优先权包袱，并且在广泛航司规模收入出现之前，公司还需要一次大额融资。
            claimRefs:
              - CV004
