      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开可验证财务资产，是融资能力。ZeroAvia 2024 年 9 月 C 轮在该品类中规模很大，且战略辛迪加质量高；2025 年 12
              月融资轮证明，在经历艰难市场期后，现有和重复投资者仍愿意继续出资。不过，后一轮比前一轮更能说明问题。管理层称该轮把现金续航期延长两年，而 FlightGlobal
              报道称，融资金额不足以维持原有员工规模或路线图。这两个事实并不矛盾；合在一起，它们意味着公司通过重置成本结构、收窄近期目标来为连续性融资。


              裁员、先认证燃料电池系统再认证完整 ZA600 动力总成，以及强调 SuperStack Flex 等更早商业产品，都强化了这一解读。换句话说，ZeroAvia
              看起来仍能融资，但前提是根据更紧的资本市场调整运营计划。这比失败更好，却实质性改变了投资判断：投资者不再只是在资助增长故事，也是在资助一家管理现金续航期、排序里程碑、选择推迟哪些技术雄心的公司。


              公开申报没有披露当前现金余额、债务额度、月度烧钱速度或营运资本压力，因此无法精确量化资本充足性。实际判断是，ZeroAvia
              很可能有足够资本继续推进有意义的认证和模块交付里程碑，但披露证据不足以假设它能在没有另一场重大融资事件的情况下自筹资金走到全面规模化商业化。
