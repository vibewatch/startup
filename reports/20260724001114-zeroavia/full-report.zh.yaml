    data:
      nodes:
        - id: r1
          label: 监管复杂度
        - id: r2
          label: 时间线延后
        - id: r3
          label: 更高烧钱速度
        - id: r4
          label: 客户延迟
        - id: r5
          label: 融资压力
        - id: r6
          label: 估值下行
      edges:
        - from: r1
          to: r2
          label: 定制路径
        - from: r2
          to: r3
          label: 更长项目支出
        - from: r2
          to: r4
          label: 服务推后
        - from: r3
          to: r5
          label: 现金续航压缩
        - from: r4
          to: r6
          label: 证明变弱
        - from: r5
          to: r6
          label: 稀释 / 重估风险
    claimRefs:
      - CR021
      - CR026
      - CR027
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: ZeroAvia 依赖的是监管机构、设施、合作伙伴和基础设施参与者组成的网络，而不是一条简单供应链。
    data:
      nodes:
        - id: d1
          label: FAA / UK CAA
        - id: d2
          label: Everett 推进工作
        - id: d3
          label: 苏格兰制造
        - id: d4
          label: 首发运营商 / 航空公司
        - id: d5
          label: 氢基础设施
        - id: d6
          label: 培训 / MRO 生态
      edges:
        - from: d1
          to: d4
          label: 需要批准
        - from: d2
          to: d4
          label: 产品就绪
        - from: d3
          to: d4
          label: 生产就绪
        - from: d5
          to: d4
          label: 航线就绪
        - from: d6
          to: d4
          label: 运营就绪
    claimRefs:
      - CR013
      - CR014
      - CR019
      - CR020
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 战略质量高，但估值确定性低，因此更适合跟踪，而不是买入。
    data:
      nodes:
        - id: a
          label: 战略投资者 + 监管机构
        - id: b
          label: 具体路径（RVL / ODIN）
        - id: c
          label: 估值不透明 + 无公开收入
        - id: d
          label: 里程碑敏感风险
        - id: e
          label: 跟踪 / 继续研究
      edges:
        - from: a
          to: e
          label: 支撑兴趣
        - from: b
          to: e
          label: 支撑期权价值
        - from: c
          to: e
          label: 限制信心
        - from: d
          to: e
          label: 要求价格纪律
    claimRefs:
      - CV001
      - CV008
      - CV023
      - CV031
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资逻辑对认证时间、融资质量和客户转化最敏感。
    data:
      items:
        - label: 认证时间
          value: 10
        - label: 融资条款 / 稀释
          value: 9
        - label: 客户转化质量
          value: 8
        - label: 模块收入验证
          value: 7
        - label: 自上而下市场增长
          value: 4
    approximationNotes: 评分是用于尽调的序数敏感性权重，不是市场隐含 beta。
    claimRefs:
      - CV018
      - CV019
      - CV022
      - CV026
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 宽情景走廊比虚假的点估值更诚实。
    data:
      items:
        - label: 悲观 EV 区间
          low: 0.3
          mid: 0.5
          high: 0.7
          unit: $B
        - label: 基准 EV 区间
          low: 0.7
          mid: 1
          high: 1.3
          unit: $B
        - label: 乐观 EV 区间
          low: 1.4
          mid: 1.8
          high: 2.2
          unit: $B
    approximationNotes: 区间综合了融资锚点、追踪器标记、里程碑风险和可比偏好；它们不是已标记的交易价格。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 市场和战略证明强于财务披露和估值清晰度。
    data:
      items:
        - label: 战略背书
          score: 8
          detail: 投资者和交易方质量强
        - label: 监管动能
          score: 7
          detail: 真实里程碑，但不是终局批准
        - label: 商业证明
          score: 6
          detail: 具名路径不错，服务证明有限
        - label: 财务披露
          score: 2
          detail: 收入、利润率和股权结构大多未公开
        - label: 估值清晰度
          score: 3
          detail: 有追踪器；没有一级市场估值标记
        - label: 风险调整后的进入点
          score: 4
          detail: 需要价格纪律和私下尽调
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV034
      - CV040
