companyProfile:
  summary: >-
    ZeroAvia 是一家氢电航空推进公司，成立于 2018 年，核心运营足迹在华盛顿州 Everett，以及英国 Cotswold Airport / Kemble。公司开发面向小型支线飞机的 ZA600、面向更大 40-80
    座飞机的 ZA2000、SuperStack Flex 等模块化燃料电池系统，以及机场氢能和生态赋能能力。ZeroAvia 于 2024 年完成 $150M 战略 C 轮，并在 2025
    年末完成进一步融资，公司称该轮把现金续航期延长了两年。公开里程碑包括 UK CAA Design Organisation Approval、FAA 特殊条件进展、具名 RVL 启动运营商路径、挪威 ODIN
    部署计划，以及向国防客户交付具备飞行意图的燃料电池系统。公司进入 2026 年时也承压，出现裁员、路线图收缩和领导层交接。
