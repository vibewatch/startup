        title: 对比缺口与决策价值
        blocks:
          - type: paragraph
            body: >-
              公开竞争对比仍缺少买方最终选择系统时需要的指标。价格大多未披露。改装成本、功率密度、维护负担和确定订单转化很少被标准化。因此，当前公开定位奖励的是叙事、里程碑证据和交易方，而不是硬商业证明。


              即便存在这些缺口，具有决策价值的结论仍相当清楚：ZeroAvia 属于支线氢电竞争者第一梯队，尤其在改装驱动的商业部署上；但它还没有对 H2FLY 等专业公司形成不可击败的护城河，也不具备 Airbus
              等既有巨头的战略选择权。投资者应把公司视为具备竞争优势，但这种优势是有条件的。


              这种模糊意味着，投资者应把今天的竞争地图看作领先指标，而不是最终排名。与 Marshall、Safran、Horizon、Hybrid Air Vehicles 和 KAERI 的合作公告拓宽了 ZeroAvia
              的生态触达，但不会自动转化为已交付收入或持久护城河。不过，它们确实提高了缺少类似邻接选项的小型同行的门槛。
