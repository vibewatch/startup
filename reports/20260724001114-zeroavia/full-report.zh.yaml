      - number: '4.4'
        title: 投资判断缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              对投资判断而言，ZeroAvia
              的公开财务记录既好于许多风险投资阶段气候科技同行，也更差。更好，是因为公司有真实交易方、战略投资者、拨款、制造计划，以及通向多个产品界面的可见路径。更差，是因为几乎没有任何能把这些优势转化为投资级财务质量的指标公开。收入未披露。毛利率未披露。现金未披露。订单转化未披露。债务义务未披露。即便最强的类订单积压说法，也被表述为未来收入潜力，而不是已入账排期。


              因此，投资者拿到的是一个合理的战略结论，以及一份不完整的承保文件。战略结论是，ZeroAvia
              仍是更可信的氢能航空公司之一，因为它仍有资金、仍在推进监管流程，也仍在拓宽相邻收入通道。不完整之处在于，外部人还无法判断这些通道能否在下一次大额融资前成熟为有吸引力的单位经济性。


              因此，正确的财务结论是谨慎，但不否定。ZeroAvia
              看起来没有坏掉。它看起来依赖外部资本、利润率不透明，并且高度受里程碑排序影响。任何投资案例都应以管理层披露现金与烧钱速度桥接、产品级收入预测、订单积压瀑布图和制造资本开支计划为条件，而不是只押公开叙事。
