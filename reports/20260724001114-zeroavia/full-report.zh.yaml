      - number: '4.2'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的成本结构更接近资本密集型航空航天制造，而不是软件，甚至也不像轻工业集成。留存记录显示，公司有双地点布局：苏格兰的制造和 HTPEM 电堆计划、Everett
              的推进中心工作、英国持续飞机测试需求，以及与英美监管机构的认证互动。这些功能没有一个便宜，而且都必须在成熟交付量出现前获得资金支持。由拨款支持的苏格兰项目在战略上看起来合理，因为它围绕燃料电池电堆建立制造专业化能力；但它也让公司在约
              2028 年目标满产前，先承担设施建设、招聘、资质认证和小规模生产成本。


              公开单位经济性大多缺失。ZeroAvia 声称氢电推进可以降低维护成本，并最终降低燃料成本；模块化 SuperStack
              架构也暗示跨市场复用带来一些好处。但公司没有公开披露每套安装系统成本、现场维护负担、保修假设、营运资本周转或工厂利用率。实践中，最好的公开判断只能是方向性的：早期经济性可能被认证文档、定制集成、低初始产量和氢气处理复杂性拖累；上行来自模块复用，以及认证范围更小的国防或辅助动力应用。


              这种不对称很重要，因为公司的最大利润率问题不是氢电推进理论上能否经济，而是 ZeroAvia 必须背负小规模制造和项目费用多久，才会出现任何经常性交付节奏。今天，这个答案无法从公开信息中承保。
