      - number: '1.3'
        title: 资本基础与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              概览里最强的正面因素，是战略支持的质量和广度。ZeroAvia 2024 年 9 月 C 轮达到 $150M，由 Airbus、Barclays Sustainable Impact Capital 和 NEOM
              Investment Fund 共同领投，UK Infrastructure Bank 是基石投资者。其他披露参与方包括 Scottish National Investment Bank、American
              Airlines、IAG、ITOCHU、Breakthrough Energy Ventures、Horizons Ventures、Ecosystem Integrity Fund、Summa
              Equity、Alaska Airlines、Amazon Climate Pledge Fund 和 AP
              Ventures。这组投资者重要，因为它把财务投资者、航空公司、航空航天既有巨头、主权或政策关联资本，以及气候转型基金组合在一起。


              2025 年 12 月融资轮强化了这张利益相关方地图，但也把故事从增长融资改写成现金续航期延长。ZeroAvia
              称，新一轮融资把现金续航期延长两年，并将支持航空和国防用氢能动力与推进技术的产业化。GeekWire 的公开报道显示，到 2024 年 9 月，公司已累计融资超过 $250M；但留存官方材料未披露 2025
              年融资金额，也没有新的投后估值。因此，投资者应把资本基础视为战略上令人印象深刻，但仍然不透明。


              商业交易方本身也是验证利益相关方。American 在 2024 年 7 月增加投资，并签署 100 台发动机的有条件协议。Alaska 和 De Havilland 更早支持了与 ZA2000 相关的 Q400
              路径。信号很明确：大型航空公司和 OEM 希望获得氢电推进的期权价值。开放问题在于，一旦认证、经济性和基础设施必须同时跑通，这种利益相关方热情能转化成多少确定收入。
