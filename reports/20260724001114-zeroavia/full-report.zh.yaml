  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与任务适配
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的市场不是最宽泛意义上的“航空脱碳”，而是更窄的一块：在支线、货运和专用任务中，氢电推进能可信地替代既有涡轮经济性和排放的场景。公司自己的产品和市场页面聚焦 9-19 座飞机、40-80
              座支线涡桨机、运输机、UAV，以及邻近国防的动力应用。因此，正确的市场边界是小型飞机和特定任务运营的推进与动力系统市场，而不是整个商用喷气机市场。


              这种区分重要，因为物理约束和基础设施约束决定了，短途和专用运营才是最现实的第一批滩头阵地。ZA600 瞄准 Cessna Caravan、Dornier 228 等机型，ZA2000 瞄准 ATR 和 Dash
              8 机族。留存外部证据方向一致：H2FLY 2026 年评论同样指向支线飞机会成为第一轮真实氢能部署，而 Airbus 更庞大的 ZEROe
              愿景则在更远时间点。因此，氢电航空首先是受航线和任务约束的机会，之后才可能成为广泛航空替代故事。
