      - number: '3.3'
        title: 转换成本与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              氢电推进会产生异常高的转换成本，因为飞机只是系统的一部分。航空公司和机场还必须解决氢气供应、培训、维护和操作处理。因此，认证进展和伙伴生态本身可以成为护城河元素。即使最终型号认证尚未完成，ZeroAvia
              公开的地面测试、DOA、培训和模块化动力系统里程碑也有竞争意义。


              不过，护城河耐久度并不清晰。Universal Hydrogen 的失败说明，这个细分赛道可以淘汰知名玩家。ZeroAvia
              自身裁员和进度滑移也显示，领导地位仍可能脆弱。今天的护城河最适合描述为暂时成立：真实存在，但还没有强到能自我强化并消除融资和执行风险。
