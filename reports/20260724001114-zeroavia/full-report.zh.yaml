  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与用户任务
        blocks:
          - type: paragraph
            body: >-
              2026 年，ZeroAvia
              的产品故事已经宽于单一氢电发动机。公司公开销售完整动力总成、独立燃料电池发电模块、电动推进部件，以及邻近的氢能支持能力。商业侧，核心用户任务是用一个能降低排放、噪音并可能降低运营成本的系统，替代小型固定翼飞机上的涡轮推进。军民两用侧，同样的燃料电池和电力电子能力被推向
              UAV 和国防场景，在那里，续航、更低热特征和模块化机载电力很重要。


              这一点重要，因为它意味着 ZeroAvia 可以在完整机队级发动机认证完成前，追求多条商业化路径。ZA600 服务 Caravan、Dornier 等小型飞机平台，ZA2000 瞄准 Dash 8 和 ATR
              尺寸的涡桨机。SuperStack Flex 通过让公司在完整发动机包之外销售燃料电池系统，创造了更模块化的路径。因此，公司试图变现的不只是作为终端产品的推进系统，还包括让氢电航空成为可能的底层架构层。
