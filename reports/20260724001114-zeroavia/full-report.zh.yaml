      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管图景是混合的：技术上正面，但仍不完整。FAA 的拟议和最终特殊条件流程证明，美国路径处于活跃状态；UK CAA 的 Design Organisation Approval 证明，监管方认为 ZeroAvia
              有能力开展可认证设计工作。但两个事实都需要谨慎解读。特殊条件说明这项技术足够新，需要定制规则制定；它不是所有批准工作基本完成的信号。同样，DOA 是组织能力里程碑，不是商业运营批准。


              GAO 2026 年审查放大了警示：整个电动飞机行业的进展受到基础设施和认证复杂性约束。这一点重要，因为它把部分风险从“公司执行问题”转成“生态和监管成熟问题”。即使 ZeroAvia
              执行良好，也可能面对不完全由自己控制的节奏限制。


              法律风险可见度较低，但不应忽视。公开专利界面显示，公司拥有真实且在增长的 IP
              资产；但没有公开摘要能证明自由实施权、权利转让干净，或未来不会出现争议。对深科技推进公司而言，这些问题在燃料电池电堆、大型发动机架构和液氢系统周围尤其重要。留存公开记录没有发现重大诉讼，但这只是继续调查的理由，不是默认法律干净的理由。
