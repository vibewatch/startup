  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分地图与买方面
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的客户基础更适合理解为一张生态地图，而不是经典 SaaS
              账户列表。可见买方和用户集合覆盖支线航空公司、货运运营商、启动运营商、OEM、国防用户、培训伙伴、机场和拨款支持的部署联盟。这在战略上有吸引力，因为公司不只追求一条采用路径：运营商的直接发动机或改装需求、通过
              OEM 或飞机集成合作产生的间接需求，以及来自国防或无人平台的相邻动力系统需求。它也意味着买方、用户和付款方并不总是同一个实体。以挪威 ODIN
              项目为例，航空公司、机场、公共资金方和基础设施赋能方都影响这条路径。


              细分组合也揭示了 ZeroAvia 最现实的商业落点。小型飞机货运和特殊任务用例看起来最接近首批使用，因为它们更能容忍早期改装和更可控的运营条件。更广泛的客运航空公司推广仍可见，但常以 MOU
              和有条件承诺形式出现，而不是活跃机队部署。结果是，客户基础选择权很强，但证明质量不均。


              因此，投资者应把 ZeroAvia 的客户动作看成分阶段推进。第一步是旗舰关系和航线特定试点。第二步是培训、维护和氢能赋能。之后，持久收入扩张才变得可信。
