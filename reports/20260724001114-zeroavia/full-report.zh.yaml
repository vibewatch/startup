chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、场地与产品范围
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 是一家美英两地运营的氢电航空推进开发商，运营起点可追溯到 2018
              年。公司今天把自己定位成清洁飞行动力总成和动力系统公司，而不是单一飞机创业公司。官方材料始终围绕氢燃料电池、电机、燃料电池发电系统，以及让这些系统能在真实航司场景中运行的制氢和加注基础设施来描述业务。因此，公司横跨推进硬件、赋能部件和生态基础设施；这一点重要，因为其商业成败不只押在一个狭窄的认证事件上。


              地理布局同样是双国结构。Companies House 显示，活跃英国实体 ZeroAvia Ltd 位于 Kemble 的 Cotswold Airport Hangar C2；ZeroAvia
              自己的网站则列出华盛顿州 Everett 的美国运营场地。公司公开表述还称 ZeroAvia, Inc. 是美国控股公司，并把英国子公司描述为其最大的运营单元。合在一起，ZeroAvia
              更适合被理解为一家英美公司：英国侧有认证和测试深度，美国侧有制造、航空公司和投资者关系。


              产品范围足够宽，足以在第一章把它看成平台型公司。ZA600 是更近端的 9-19 座产品，ZA2000 则面向更大的 40-80 座支线涡桨机族。在这些产品周围，ZeroAvia
              还销售电动推进部件、模块化燃料电池系统和机场氢能解决方案。这种宽度在战略上有吸引力，因为它创造了更多射门机会，但也让资本配置和认证执行更复杂。
