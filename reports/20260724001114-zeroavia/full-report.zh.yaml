  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与可比公司
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 周围的正确竞争集合有三层。第一层是 H2FLY 等直接氢电推进同行。第二层是 Airbus ZEROe 等更大型氢能飞机倡议，它们更多争夺战略叙事和人才，而不是完全相同的首批部署。第三层是
              magniX 电池电动路线等零排放推进替代路径，即使没有氢，也能在短航线上赢得买方注意力。Universal Hydrogen 应作为警示性的历史同行放入版图：它的失败减少了拥挤度，也说明这个细分领域有多难。


              在这个集合中，ZeroAvia 的突出之处是用 ZA600 和 ZA2000 同时覆盖小型与更大型支线飞机。这给了它比许多同行更宽的任务包络，但也提高了执行负担。


              第二个重要边界，是卖推进模块的公司与讲整机叙事的公司之间的边界。ZeroAvia
              越来越属于前一类，因为其模块化燃料电池、培训和机场集成故事可以延伸到国防或特种机体。这让可比集合比氢能创业公司本身更宽，也部分解释了为什么替代技术仍然重要。
