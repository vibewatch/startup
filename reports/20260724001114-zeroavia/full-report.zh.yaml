      - number: '5.3'
        title: 部署路线图与支持模型
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的成熟度故事越来越由部件牵引。最强信号不只是最终发动机承诺，而是先达到公开里程碑的那些部件：在地面测试中复刻完整飞行剖面的认证意图燃料电池系统、向国防客户交付 SuperStack
              Flex、600kW 电动推进系统上的 FAA P-1 和特殊条件工作，以及 UK CAA DOA。公司从原型叙事转向可认证子系统和结构化项目时，正是会打出这类里程碑。


              支持就绪也正在成为产品的正式组成部分。FlightSafety 参与飞行员和维护培训，说明 ZeroAvia 理解运营采用是一个人机系统问题，而不只是硬件问题。与 Marshall、Safran、Horizon
              和 Hybrid Air Vehicles 的合作也显示，部署会通过伙伴在多个飞机类别中推进。因此，路线图看起来像一条分阶段的模块与伙伴递进路径，尽管公开证据仍未显示完整商业支持生态已经投入服务。
