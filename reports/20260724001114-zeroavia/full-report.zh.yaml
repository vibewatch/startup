      - number: '6.3'
        title: 留存、复购与扩张可见度
        blocks:
          - type: paragraph
            body: >-
              公开留存可见度是 ZeroAvia 客户章节最弱的一部分。公司没有披露
              NRR、GRR、流失、合同期限、续约比例、满意度分数或运营商运行可用率数据。即便最强客户公告，也通常被表述为试点、MOU、启动计划或有条件采购。这意味着，“具名证明”和“持久变现”之间存在实质缺口。实际来看，ZeroAvia
              能证明成熟交易方希望获得氢电航空敞口，但还不能证明这些交易方正在续约、扩张，或在规模上产生经常性收入。


              最接近扩张逻辑的东西，不是合同，而是架构。Caravan 路径可以延伸到其他小型涡桨机；Loganair、De Havilland 和 Alaska 相关项目打开更大型飞机弧线。与此同时，国防和 UAV
              模块需求为独立燃料电池系统创造第二条扩张循环。FlightSafety 等培训和支持关系可以在运营商开始走上这条路径后加深转换成本。但公开记录仍未确认这些循环已经开始转化为重复现金流。


              正确解读不是留存差，而是留存尚未被证明。对一家认证阶段航空公司，这个差别很重要。
