      - number: '7.4'
        title: 人员、财务与论点破裂风险
        blocks:
          - type: paragraph
            body: >-
              财务风险和人员风险现在已经绑得很紧。2026 年的独立报道把公司裁员直接指向 2025
              年末融资后可用资本的多少。也就是说，一旦资本再次收紧，人才留存、进度可信度和客户信心都可能沿着同一条链条恶化。领导层交接进一步放大了这种敏感性。公司一边更换创始人
              CEO，一边重新排序产品路线图，还要守住投资人和监管关系；这件事并非做不到，但它把协调负担抬高了，而时点恰恰最差。


              公开记录也给出了一些缓释因素。老股东继续参与，资金跑道得到延长，监管机构仍在互动，独立燃料电池模块路线也可能比等待完整航司动力系统更早带来商业牵引。但这些只是风险缓释，不是风险已经消失的证据。最关键的投资论点破裂触发点仍然清楚：修订后的认证路径落空；模块相邻业务从通往航司推进的桥梁，变成永久替代品；以及公司把当前势头转化为可认证交付物之前，融资渠道出现任何收紧迹象。


              实际尽调含义很直接。投资人应把公司当作一串相互绑定的里程碑来跟踪，而不是一条平滑趋势线。
