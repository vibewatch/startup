      - number: '1.4'
        title: 里程碑、认证与商业路径
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的里程碑记录显示了真实技术进展，但已不再支撑“商业飞行近在眼前”的轻松叙事。公司自己的历史强调从 2018 年成立、早期飞行演示、2021 年启动 50+ 座项目、2023 年 Dornier
              228 氢燃料电池测试活动，到 2024 年完成 $150M C 轮的基础时刻。2025 年，公司通过任命 RVL Aviation 为启动运营商、取得挪威 15 架配备 ZA600
              飞机及配套机场氢能基础设施项目，并获得 UK CAA Design Organisation Approval，进一步加深了商业路径。


              认证进展是实打实的。DOA 证明 UK CAA 认为 ZeroAvia 有能力按照商用航空规则设计可认证产品；FAA
              特殊条件发布则显示，美国监管方正在为公司电动发动机架构建立所需的个案规则集。对于任何新型推进公司，这些都是有意义的成就。


              负面抵消也同样重要。GAO 在 2026 年指出，FAA 仍未对任何有人驾驶电动飞机完成型号认证；CompositesWorld 报道称，ZeroAvia 已裁掉约一半员工，并把完整 ZA600
              动力总成认证进一步后移，同时优先推进燃料电池模块。由此可读出：ZeroAvia 已经摆脱科学项目状态，但还没有摆脱深科技经典挤压——认证复杂、基础设施依赖和资本强度同时压身。
