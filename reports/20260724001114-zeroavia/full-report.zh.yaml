      - number: '6.4'
        title: 集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              最大商业风险，是亮眼品牌背后隐藏的集中度。公开披露关系反复回到一小组高声望名字：American、Alaska、Loganair、RVL、De Havilland
              和挪威路径。这些名字有帮助，但如果实际收入基础仍很小或不经常性，它们可能制造虚假的多元化感。由于 ZeroAvia 不披露逐客户收入，外部人无法判断业务分散现金敞口的速度，是否和分散客户名号的速度一样快。


              采购摩擦也高于软件，甚至高于许多工业硬件类别。每一笔商业胜利不只需要客户关系，还需要机体集成、监管批准、氢气供应、维护流程和机组培训。因此，签署合作只是更长商业化漏斗中的一个阶段。关于裁员和认证延迟的负面报道会放大这一风险，因为每个具名交易方仍取决于执行里程碑继续前进。


              本章结论因此是正面但有条件。ZeroAvia 的具名客户证明高于同阶段平均，尤其体现在广度和生态深度上。不过，持久性和集中度仍比客户名号列表显示得更不透明。
