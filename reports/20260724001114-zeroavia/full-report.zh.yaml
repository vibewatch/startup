      - number: '2.2'
        title: 规模测算视角与买方地图
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估计已经很大，但内部并不一致，不能用单一数字锚定投资判断。Global Market Insights 给出的 2026 年市场约为 $1.2B；The Business Research
              Company 称为 $2.64B；360iResearch 更低，约
              $819.6M。差距不是噪音。它反映了不同机构对什么算氢能飞机市场、是否纳入部件和服务、基础设施和监管追赶速度的假设不同。本章更适合把这些报告作为规模测算镜头，而不是事实本身。


              比 TAM 更可投资的买方地图反而更清晰。航空公司和货运运营商是可见用户，但付款方和赋能方还包括出租方、OEM、战略投资者、机场和公共部门拨款机构。American Airlines、Alaska、De
              Havilland、RVL、Loganair 和挪威 ODIN
              项目都显示，早期采用是一个联盟问题，而不是简单的航空公司采购。预算必须同时覆盖飞机改装、培训、氢气供应和航线支持。这就是为什么在早期市场中，具名交易方比自上而下的市场数字更重要。
