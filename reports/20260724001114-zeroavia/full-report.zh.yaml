  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia 的风险栈在公开信息中异常容易看见，这比隐藏风险好，但不等于低风险。第一梯队是认证时点、资本充足性和生态依赖。认证排第一，因为如果公司不能按修订后时间表，从 FAA 特殊条件和 UK CAA
              设计批准推进到可认证、可交付产品，再多需求信号也没有意义。资本排第二，因为 2025
              年融资轮只是在大规模人员重置和路线图压缩同时发生时延长了现金续航期。生态依赖排第三，因为氢气可得性、机场流程、培训和改装执行部分不在 ZeroAvia 直接控制之内。


              第一梯队之下，是运营和人员风险。公司在苏格兰推进制造就绪，在 Everett 保持推进能力，并管理跨境认证和产业项目。与此同时，创始人 Val Miftakhov 在 2026 年卸任
              CEO，英国实体也记录了有意义的董事会更替。这些不是致命信号，但会在关键运营窗口提高犯错成本。


              正面抵消是，公司仍有可见投资者支持、监管互动，以及优先推进更早模块变现的产品排序策略。这些缓释因素真实存在。它们只是还没有抹掉核心风险的严重性。
