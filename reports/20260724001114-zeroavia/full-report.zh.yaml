        blocks:
          - type: paragraph
            body: >-
              公开架构已经足够做尽调。ZeroAvia 的产品页面呈现出一致的栈：氢气储存、燃料电池、电力电子、电机和飞机集成。ZA600 强调气态氢和面向小型机体的 600kW 连续系统；ZA2000
              加入液氢储存和面向更大型涡桨机的多兆瓦扩展。KAERI 合作凸显了储罐技术在更大架构中的中心地位，围绕 HTPEM 和大型发动机开发的专利则进一步说明，燃料电池规模化才是真正的技术前沿。


              重要结论是，ZeroAvia
              并不是简单地把一个推进盒子换成另一个。它试图协调一个多层运营模型，包含机上硬件、机场燃料物流、伙伴供应的子系统和支持流程。跑通后，产品差异化会更强；但它也更脆弱，因为认证、供应和集成风险分布在比传统发动机替换更多的接口上。
