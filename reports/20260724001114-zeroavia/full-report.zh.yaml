      - number: '6.2'
        title: 具名客户证明与采用路径
        blocks:
          - type: paragraph
            body: >-
              最强具名证明是 RVL Aviation。该公告不只是借用品牌背书，而是明确 Cessna Grand Caravan 是启动飞机，描述了 British Isles
              的目标运营场景，并明确把服务落地设定为取决于认证、改装和培训完成。Loganair 是另一个高价值证明点，因为留存记录把这段关系与真实航线地理、Twin Otter 和 ATR
              机族背景，以及更广泛的苏格兰氢能生态联系起来。它仍是 MOU，不是生产订单，但比泛泛的合作新闻稿更贴近运营。


              American Airlines 通过有条件 100 台发动机采购和投资给出了强需求信号，但不能证明已投入服务或重复采购。De Havilland Canada 和 Alaska 增加了 OEM
              与更大型飞机路径的相关性，ASL Aviation 则提供了货运特定可信度。Project ODIN 是最宽的公开部署路径，因为它点名 15 个挪威机场中的 15 架 Cessna Grand
              Caravan，显示的是项目化多资产雄心，而非单一品牌露出。


              合在一起，这些证明点显示，ZeroAvia 已为其阶段拼出异常宽的第一圈客户叙事。它们尚未证明的，是标准化重复使用、付费机队扩张或常态客运服务。
