  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Field reliability, service burden, and maintenance cost data for flight-intent ZeroAvia systems.
    whyItMatters: Public milestone and certification evidence does not tell investors whether the hardware can deliver airline-grade uptime.
    diligencePath: Request reliability growth curves, endurance-test data, and maintenance assumptions by platform.
    relatedQuestionRefs:
    - QE016
    - QE023
  - type: private-evidence-only
    severity: material
    topic: tank-integration
    missingEvidence: Detailed liquid-hydrogen tank mass, volume, and safety-case data for ZA2000-class deployments.
    whyItMatters: LH2 storage is one of the most consequential technical risks for scaling into 40-80 seat aircraft.
    diligencePath: Review KAERI work scope, tank test results, and integrated airframe mass-and-balance studies.
    relatedQuestionRefs:
    - QE011
    - QE018
