    - Use batteries or conventional fuel systems
    - SuperStack Flex fuel-cell system
    - Longer endurance and lower thermal signature
    - Customer performance data undisclosed
  - - Prepare crews and mechanics for new propulsion technology
    - Ad hoc operator training after aircraft delivery
    - FlightSafety training partnership
    - Can shorten adoption friction once certification arrives
    - Training content and regulatory governance still exploratory
  notes: Benefits reflect company claims and partner rationale, not yet routine fleet operating data.
