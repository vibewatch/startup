- id: differentiation-trust-and-open-gaps
  title: Differentiation, trust, and open gaps
  body: 'ZeroAvia''s differentiation is strongest where hydrogen-electric architecture, modularity, and partner reach intersect. Airbus is working at a larger-aircraft horizon, H2FLY validates the regional fuel-cell thesis, and magniX shows the battery-electric alternative. ZeroAvia sits between them with a retrofit-first regional strategy plus a modular fuel-cell business that can extend into defense, eVTOL, and power applications. The patents around larger hydrogen engines and HTPEM development strengthen the case that the company is building proprietary know-how rather than only system integration capability.


    The trust gap is that public materials still say little about reliability, service burden, failure modes, or field performance under regular operation. Regulatory milestones help, but they do not replace in-service proof. Investors should therefore treat the technology stack as real and differentiated, while keeping open diligence on tank maturity, supplier dependencies, training burden, and supportability at commercial scale.'
