- id: deployment-roadmap-and-support-model
  title: Deployment roadmap and support model
  body: 'ZeroAvia''s maturity story is increasingly component-led. The strongest signals are not only final engine promises, but the pieces that reached public milestones first: a certification-intent fuel-cell system that replicated a full flight profile in ground testing, shipment of SuperStack Flex to a defense customer, FAA P-1 and special-conditions work on the 600kW electric-propulsion system, and UK CAA DOA. Those are exactly the kinds of milestones a company hits when it is converting from prototype narrative into certifiable subsystems and structured programs.


    Support readiness is also becoming a formal part of the product. FlightSafety''s involvement on pilot and maintenance training implies that ZeroAvia understands operational adoption as a human-systems problem, not only a hardware problem. Partnerships with Marshall, Safran, Horizon, and Hybrid Air Vehicles also show that deployment will be partner-mediated across multiple aircraft categories. The roadmap therefore looks credible as a staged module-and-partner progression, even if public evidence still does not show a full commercial support ecosystem in service.'
