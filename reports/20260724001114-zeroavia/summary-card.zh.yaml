  topStrengths:
    - 战略融资有厚度：2024 年 $150M Series C 和 2025 年底跟进融资，显示航空公司、航空航天、主权资金和气候转型资本持续支持。
    - 监管进展真实可见：UK CAA DOA 和 FAA special-conditions 工作显示，项目已经明显走出概念阶段。
    - 产品面比同类公司更宽，既有独立燃料电池模块，也有相邻防务 / UAV 机会，可在完整航空公司级推进系统之前先变现。
    - 已点名交易对手覆盖 RVL、Loganair、American、ASL、De Havilland、Alaska 和 Norway 的 ODIN 路径，商业兴趣信号较强。
    - 产品和生态策略看起来足够模块化，能创造多次射门机会，而不是押注单一飞机项目。
  topRisks:
    - 认证和时间表仍是核心威胁；最终产品批准和常态化商业运营还在前方，2026 年报道已经记录路线图被压缩。
    - 资本强度和不透明度仍高：公开收入、现金、利润率或 2025 年融资条款披露都不足以支撑精确承保。
    - 裁员和领导层交接发生在最需要稳步推进认证和商业化的阶段，抬高了执行风险。
    - 早期部署依赖氢基础设施、培训和伙伴协同，很多环节不在 ZeroAvia 单独控制范围内。
    - 当前估值没有新的一级来源标记锚定，公司容易被过度乐观叙事定价，也可能在未来遭遇 down-round 重置。
  unresolvedGaps:
    - 当前投后估值、2025 年融资金额、稀释条款和优先股堆叠未公开披露。
    - 当前现金余额、月度烧钱速度和产品级毛利率未公开。
    - 逐客户商业化状态、订单积压转化和收入集中度仍不透明。
    - 公开记录没有显示使用 ZeroAvia 硬件的常态化零排放商业服务。
    - 详细供应商集中度、自由实施分析和 capex 爬坡假设仍属私有信息。
