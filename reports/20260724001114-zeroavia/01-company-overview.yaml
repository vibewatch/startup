- id: milestones-certification-and-commercial-path
  title: Milestones, certification, and commercial path
  body: 'ZeroAvia’s milestone record shows real technical progress, but it no longer supports an easy “commercial flight is imminent” story. The company’s own history highlights foundational moments from its 2018 founding through early flight demonstrations, the launch of the 50+ seat program in 2021, the 2023 Dornier 228 hydrogen fuel-cell test campaign, and the 2024 close of the $150 million Series C. In 2025 it deepened the commercial pathway by naming RVL Aviation as a launch operator, securing a Norway project for 15 ZA600-equipped aircraft and related airport hydrogen infrastructure, and receiving UK CAA Design Organisation Approval.


    Certification progress is tangible. DOA confirms that the UK CAA considers ZeroAvia capable of designing certifiable products under commercial aviation rules, while the FAA special-conditions publication shows the US regulator is building the case-specific rule set needed for the company’s electric engine architecture. Those are meaningful achievements for any novel propulsion company.


    The negative offset is equally material. GAO noted in 2026 that FAA had still not type-certified any manned electric aircraft, and CompositesWorld reported that ZeroAvia had laid off about half its workforce and pushed full ZA600 powertrain certification further right while prioritizing the fuel-cell module. The resulting read-through is that ZeroAvia has escaped science-project status, but it has not escaped the classic deep-tech squeeze of certification complexity, infrastructure dependence, and capital intensity.'
