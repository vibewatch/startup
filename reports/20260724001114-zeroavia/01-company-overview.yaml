company:
  name: ZeroAvia
chapter:
  number: 1
  title: Company Overview
  summary: 'ZeroAvia is a British-American hydrogen-electric aviation propulsion company that has moved well beyond concept stage, with a $150 million strategic Series C in 2024, a further runway-extending financing round in late 2025, named airline and OEM counterparties, and meaningful UK CAA / FAA certification progress around ZA600. The same public record also shows that the company entered 2026 under pressure: leadership changed, the UK subsidiary board turned over, and independent reporting says headcount was cut roughly in half while full ZA600 powertrain certification slipped. The result is a company with unusually strong strategic validation for its category, but with capital intensity, execution risk, and disclosure gaps still large enough to matter at chapter-one level.'
sections:
- id: identity-sites-and-product-scope
  title: Identity, sites, and product scope
  body: 'ZeroAvia is a US-UK hydrogen-electric aviation propulsion developer that traces its operating start to 2018 and today presents itself as a clean-flight powertrain and power-systems company rather than as a single-aircraft startup. Official materials consistently frame the business around hydrogen fuel cells, electric motors, fuel-cell power generation systems, and the hydrogen production and refueling infrastructure needed to make those systems operable in real airline settings. The company therefore sits across propulsion hardware, enabling components, and ecosystem infrastructure, which matters because its commercial success does not depend on one narrow certification event alone.


    The location picture is similarly dual-nation. Companies House identifies the active UK entity, ZeroAvia Ltd, at Hangar C2, Cotswold Airport in Kemble, while ZeroAvia’s own website lists a US operating site in Everett, Washington. Public company language also calls ZeroAvia, Inc. the US holding company and describes the UK subsidiary as its largest operating unit. That combination supports a practical reading of ZeroAvia as a British-American company with UK certification and testing depth and US manufacturing, airline, and investor relationships.


    Product scope is broad enough to support a chapter-one view of a platform company. The ZA600 is the nearer-term 9-19 seat offering, while ZA2000 is the larger 40-80 seat regional-turboprop family. Around those, ZeroAvia also markets electric propulsion components, modular fuel-cell systems, and airport hydrogen solutions. That breadth is strategically attractive because it creates more shots on goal, but it also complicates capital allocation and certification execution.'
