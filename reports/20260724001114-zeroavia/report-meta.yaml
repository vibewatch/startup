companyProfile:
  summary: >-
    ZeroAvia is a hydrogen-electric aviation propulsion company founded in 2018, with core operating
    footprints in Everett, Washington and the UK at Cotswold Airport / Kemble. The company develops
    ZA600 for smaller regional aircraft, ZA2000 for larger 40-80 seat aircraft, modular fuel-cell
    systems such as SuperStack Flex, and related airport-hydrogen and ecosystem-enablement capabilities.
    ZeroAvia raised a $150M strategic Series C in 2024 and completed a further financing round in
    late 2025 that it said extended runway for two years. Public milestones include UK CAA Design
    Organisation Approval, FAA special-conditions progress, a named RVL launch-operator pathway,
    Norway's ODIN deployment plan, and shipment of a flight-intent fuel-cell system to a defense customer.
    The company also entered 2026 under pressure, with layoffs, roadmap compression, and leadership transition.
  foundedDate: '2018-01-01'
  founders:
    - name: Val Miftakhov
      role: Founder; former CEO; board member
      background: >-
        Entrepreneur and public face of ZeroAvia's hydrogen-electric aviation strategy; stepped down
        as CEO in May 2026 while remaining on the board.
      claimRefs: [CO001, CO021]
  foundingLocation: Kemble / UK operating base with US expansion into Washington state
  headquarters: Everett, Washington, USA; Kemble/Cotswold, UK
  productSummary: >-
    ZeroAvia's product stack includes the ZA600 hydrogen-electric powertrain for 9-19 seat aircraft,
    the ZA2000 platform for larger regional turboprops, modular fuel-cell power-generation systems,
    electric-propulsion components, and support capabilities spanning training and hydrogen-enablement.
    Near-term commercial attention is increasingly focused on standalone fuel-cell modules and launch-
    operator pathways while the full ZA600 certification path continues.
  customerFocus: >-
    Regional airlines, cargo operators, launch operators, OEM partners, defense users, airports, and
    ecosystem stakeholders participating in early hydrogen-aircraft deployments.
  businessModel: >-
    Pre-scale propulsion and power-systems company monetizing through future engine and retrofit sales,
    standalone fuel-cell systems, integration work, support/training, and potentially airport-hydrogen
    enablement. Revenue quality remains largely private and milestone-dependent.
  stage: Post-Series C / pre-commercial
  fundingStatus: >-
    $150M disclosed Series C (Sep 2024) with major strategic and climate investors, plus a further late-
    2025 financing round that extended runway for two years but did not publicly disclose amount or terms.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO010, CO015, CO021, CO026, CU009, CI003]

