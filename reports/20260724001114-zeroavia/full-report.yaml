  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and user jobs
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia's product story in 2026 is broader than a single hydrogen-electric engine. The company openly
              markets complete powertrains, standalone fuel-cell power-generation modules, electric-propulsion
              components, and adjacent hydrogen-support capabilities. On the commercial side, the core user job is
              replacing turbine propulsion on smaller fixed-wing aircraft with a system that lowers emissions, noise,
              and potentially operating cost. On the dual-use side, the same fuel-cell and power electronics
              capabilities are marketed into UAV and defense contexts where endurance, lower thermal signature, and
              modular onboard power matter.


              This matters because it means ZeroAvia can pursue multiple commercialization paths before full fleet-scale
              engine certification is complete. ZA600 serves smaller aircraft such as Caravan- and Dornier-class
              platforms, while ZA2000 aims at Dash 8 and ATR-size turboprops. SuperStack Flex creates an even more
              modular path by letting the company sell a fuel-cell system outside a full engine package. The company is
              therefore trying to monetize not just propulsion as an end product, but the underlying architecture layers
              that make hydrogen-electric aviation possible.
