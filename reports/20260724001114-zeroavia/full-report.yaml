      - number: '8.2'
        title: Financing context, entry discipline, and comparable set
        blocks:
          - type: paragraph
            body: >-
              ZeroAvias latest hard public financing anchor is the September 2024 Series C, not the December 2025
              extension round. The later round matters for continuity and strategy sequencing, but without public amount
              or terms it cannot anchor intrinsic value the way a fully disclosed priced round can. Secondary and
              private trackers suggest a high private valuation and continued investor interest, yet they are incomplete
              by design and should be treated as triangulation rather than truth.


              Public comparables are useful mainly as cautionary context. Joby, Archer, and Vertical Aerospace show that
              investors will fund certification-stage aviation companies for years, but they also show how quickly
              valuations become hostage to liquidity, milestone delivery, and financing structure. Vertical is
              especially useful as a reminder that technical progress, pre-orders, and financing packages can coexist
              with severe downside risk. None of these companies is a direct hydrogen-electric retrofit comparable, so
              their value lies in showing market tolerance for risk, not in providing a clean multiple to slap onto
              ZeroAvia.


              Entry discipline should therefore assume cap-table opacity, possible preference overhang from multiple
              private rounds, and another substantial financing event before broad airline-scale revenue exists.
            claimRefs:
              - CV004
