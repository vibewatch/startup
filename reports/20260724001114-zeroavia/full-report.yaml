      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The positive demand case is straightforward. Airlines and regulators need lower-emission propulsion
              options, and ZeroAvia's own product pages emphasize lower fuel-cost volatility, lower maintenance, reduced
              noise, and sharply better lifecycle climate performance for suitable missions. Market reports support the
              underlying macro logic: they identify sustainable-aviation pressure, strategic partnerships, and fuel-cell
              improvement as real drivers.


              The negative case is just as important. GAO and McKinsey/WEF both make clear that the market is
              infrastructure- and certification-constrained. Airports still face cost, power, and demand-uncertainty
              barriers. McKinsey/WEF estimates that alternative propulsion will need hundreds of terawatt-hours of clean
              energy and capital spending that reaches into the trillions by 2050. FAA certification remains
              case-by-case and no manned electric aircraft had a type certificate as of March 2026. Those realities mean
              market timing depends at least as much on systems coordination as on engine performance.
