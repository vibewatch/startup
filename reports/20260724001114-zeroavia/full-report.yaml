      - number: '3.2'
        title: Customer proof and capability comparison
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia's most important competitive edge is not a single technical metric. It is the combination of
              disclosed airline, operator, and OEM relationships with a mission set that feels realistic. American's
              100-engine conditional agreement, Alaska's Q400 work, De Havilland's Dash 8-400 MOU, and RVL's
              launch-operator plan create a stronger proof surface than a pure concept story. H2FLY has credible
              hydrogen-electric specialization, but less visible commercial-counterparty breadth in retained sources.
              Airbus has scale and trust, but its horizon is farther out.


              The result is a market where ZeroAvia looks strongest when the question is “who might get a regional
              hydrogen-electric route into service first?” and weaker when the question is “who has the deepest balance
              sheet and industrial system?” Importantly, the disclosed counterparty set also spans both near-term
              cargo-style use cases and larger regional-aircraft pathways, which gives ZeroAvia more optionality than a
              competitor pinned to only one aircraft class.
