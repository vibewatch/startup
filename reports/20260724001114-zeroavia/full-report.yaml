  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer set
        blocks:
          - type: paragraph
            body: >-
              The right competitive set around ZeroAvia has three layers. First are direct hydrogen-electric propulsion
              peers such as H2FLY. Second are larger hydrogen-aircraft initiatives such as Airbus ZEROe that compete
              more for strategic narrative and talent than for the exact same first deployments. Third are substitute
              zero-emission propulsion paths such as magniX's battery-electric approach, which can win buyer attention
              on shorter routes even without hydrogen. Universal Hydrogen belongs in the landscape as a cautionary
              historical peer: its failure reduced crowding, but it also showed how hard this segment is.


              Within that set, ZeroAvia stands out for spanning both smaller and larger regional aircraft with ZA600 and
              ZA2000. That gives it a broader mission envelope than many peers, but it also increases execution burden.


              A second important boundary is between companies selling propulsion modules and companies selling
              whole-aircraft narratives. ZeroAvia increasingly belongs to the first camp because its modular fuel-cell,
              training, and airport-integration story can extend into defense or specialty airframes. That makes the
              peer set broader than hydrogen startups alone and partly explains why substitute technologies still
              matter.
