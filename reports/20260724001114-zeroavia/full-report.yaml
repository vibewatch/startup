      - number: '2.2'
        title: Sizing lenses and buyer map
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates are already large, but not internally consistent enough to anchor
              underwriting on a single number. Global Market Insights places the 2026 market at about $1.2 billion; The
              Business Research Company says $2.64 billion; and 360iResearch is lower at about $819.6 million. The gap
              is not noise. It reflects different assumptions about what counts as a hydrogen aircraft market, whether
              components and services are included, and how quickly infrastructure and regulation catch up. For this
              chapter, those reports are best used as sizing lenses rather than truth.


              The more investable buyer map is clearer than the TAM. Airlines and cargo operators are the visible users,
              but payers and enablers include lessors, OEMs, strategic investors, airports, and public-sector grant
              bodies. American Airlines, Alaska, De Havilland, RVL, Loganair, and the Norway ODIN program all show that
              early adoption is a consortium problem rather than a simple airline purchase. Budgets must cover aircraft
              conversion, training, hydrogen supply, and route support together. That is why named counterparties matter
              more than top-down market numbers in the early market.
