  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              ZeroAvias public financial story begins with product scope. The company does not present itself as an
              aircraft OEM dependent on one future engine sale. Instead it markets propulsion systems for transport
              aircraft, modular fuel-cell systems for defense and UAV use cases, and related hydrogen-enabling services
              that can matter before routine airline service begins. That distinction is important because it creates
              several potential revenue lanes: engine kits or powertrains for retrofit programs, standalone fuel-cell
              power-generation systems, engineering and airframe integration work, training and support, and
              longer-horizon airport-hydrogen or ecosystem services. The retained record therefore supports a broader
              revenue architecture than a simple “sell engines after certification” narrative.


              The problem is pricing opacity. Public announcements are rich on counterparties, target airframes, and
              strategic intent, but they do not disclose realized selling price, deposits, milestone-payment schedules,
              or gross margin. Americans conditional purchase, Norways 15-aircraft pathway, and defense-sector module
              shipments all show commercial interest, yet none lets an investor convert demand signal into booked
              revenue quality. As a result, the public case for monetization is strongest on packaging breadth and
              weakest on contract economics.


              One material positive is that managements late-2025 emphasis shifted toward SuperStack Flex and other
              standalone fuel-cell systems. Those products can reach defense, UAV, and auxiliary-power buyers without
              waiting for the entire ZA600 propulsion package to clear every certification milestone. That makes the
              revenue story more resilient than a single-program bet, but it also suggests the company is prioritizing
