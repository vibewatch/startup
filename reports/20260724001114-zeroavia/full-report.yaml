            body: >-
              The public architecture is clear enough to diligence. ZeroAvia's product pages show a consistent stack:
              hydrogen storage, fuel cells, power electronics, electric motors, and aircraft integration. ZA600
              emphasizes gaseous hydrogen and a 600kW continuous system for smaller airframes; ZA2000 adds
              liquid-hydrogen storage and multi-megawatt scaling for larger turboprops. The KAERI partnership highlights
              just how central tank technology is to the larger architecture, while patents around HTPEM and
              large-engine development reinforce that fuel-cell scale-up is the real technical frontier.


              The important conclusion is that ZeroAvia is not simply swapping one propulsion box for another. It is
              trying to coordinate a multi-layer operating model that includes on-aircraft hardware, airport fuel
              logistics, partner-supplied subsystems, and support processes. That makes the product more differentiated
              if it works, but also more fragile because certification, supply, and integration risk sit across more
