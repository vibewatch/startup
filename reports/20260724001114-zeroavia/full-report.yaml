      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              ZeroAvias cost structure looks much closer to capital-intensive aerospace manufacturing than to software
              or even light industrial integration. The retained record shows a dual-site footprint with manufacturing
              and HTPEM stack plans in Scotland, propulsion-center work in Everett, continued aircraft-testing needs in
              the UK, and certification engagement with both UK and US authorities. None of those functions is cheap,
              and all have to be funded before mature delivery volume exists. The Scotland project, supported by grants,
              appears strategically sensible because it creates manufacturing specialization around fuel-cell stacks,
              but it also commits the company to facility build-out, hiring, qualification, and subscale production
              costs ahead of full-rate output targeted around 2028.


              Public unit economics remain mostly unavailable. ZeroAvia claims hydrogen-electric propulsion can lower
              maintenance and eventually fuel costs, and the modular SuperStack architecture suggests some reuse
              benefits across markets. But there is no public disclosure of cost per installed system, field-maintenance
              burden, warranty assumptions, working-capital turns, or plant utilization. In practice, the best public
              read is directional: early economics are likely burdened by certification documentation, bespoke
              integration, low initial volumes, and hydrogen-handling complexity, while upside comes from module reuse
              and defense or auxiliary-power applications that require less certification scope.


              That asymmetry matters because it means the companys biggest margin question is not whether
              hydrogen-electric propulsion can ever be economic in theory, but how long ZeroAvia must carry subscale
              manufacturing and program expenses before any recurring delivery cadence emerges. Today that answer is not
              publicly underwritable.
