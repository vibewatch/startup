      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest publicly verifiable financial asset is access to capital. ZeroAvias September 2024 Series C
              was large for the category and strategically syndicated, and the December 2025 financing round
              demonstrated that existing and repeat investors were still willing to fund the company after a difficult
              market period. However, the later round is more revealing than the earlier one. Management said it
              extended runway for two years, while FlightGlobal reported the amount raised was not large enough to
              maintain the prior workforce or roadmap. Those two facts are not contradictory; together they imply the
              company financed continuity by resetting cost structure and narrowing near-term objectives.


              That interpretation is reinforced by the layoffs, the shift toward certifying the fuel-cell system before
              the full ZA600 powertrain, and the emphasis on earlier commercial products such as SuperStack Flex. In
              other words, ZeroAvia appears financeable, but only by adapting the operating plan to a tighter capital
              market. That is a better outcome than failure, yet it materially changes underwriting: investors are no
              longer funding only a growth story, but also a company managing runway, sequencing milestones, and
              choosing which technical ambitions to defer.


              Public filings do not disclose current cash balance, debt lines, monthly burn, or working-capital strain,
              so capital adequacy cannot be quantified precisely. The practical verdict is that ZeroAvia likely has
              enough capital to continue toward meaningful certification and module-delivery milestones, but not enough
              disclosed evidence to assume it can self-fund through full-scale commercialization without another
              significant financing event.
