  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment map and buyer surfaces
        blocks:
          - type: paragraph
            body: >-
              ZeroAvias customer base is better understood as an ecosystem map than as a classic SaaS account list. The
              visible buyer and user set spans regional airlines, cargo operators, launch operators, OEMs, defense
              users, training partners, airports, and grant-backed deployment consortia. That is strategically
              attractive because it means the company is pursuing more than one adoption pathway: direct engine or
              retrofit demand from operators, indirect demand through OEM or aircraft-integration collaborations, and
              adjacent power-system demand from defense or unmanned platforms. It also means the buyer, user, and payer
              are not always the same entity. In Norways ODIN program, for example, airlines, airports, public funders,
              and infrastructure enablers all matter to the pathway.


              The segment mix also reveals where ZeroAvia is most commercially realistic. Smaller-aircraft cargo and
              special-mission use cases appear closest to first use because they can tolerate earlier retrofits and more
              controlled operating conditions. Broader passenger-airline rollout remains visible, but often in the form
              of MOUs and conditional commitments rather than active fleet deployment. The result is a customer base
              with strong optionality but uneven proof quality.


              An investor should therefore think of ZeroAvias customer motion as staged. First come flagship
              relationships and route-specific pilots. Then come training, maintenance, and hydrogen enablement. Only
              after that does durable revenue expansion become plausible.
