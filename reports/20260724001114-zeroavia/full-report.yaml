      - number: '4.4'
        title: Underwriting gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              For underwriting purposes, ZeroAvias public financial record is both better and worse than many
              venture-stage climatetech peers. It is better because the company has real counterparties, strategic
              investors, grants, manufacturing plans, and a visible path to multiple product surfaces. It is worse
              because almost none of the metrics that convert those strengths into investment-grade financial quality
              are public. Revenue is undisclosed. Gross margin is undisclosed. Cash is undisclosed. Order conversion is
              undisclosed. Debt obligations are undisclosed. Even the strongest backlog-style claim is framed as
              future-revenue potential rather than as a booked schedule.


              That leaves an investor with a reasonable strategic conclusion but an incomplete underwriting file. The
              strategic conclusion is that ZeroAvia remains one of the more credible hydrogen-aviation companies because
              it is still financed, still moving through regulation, and still broadening into adjacent revenue
              channels. The incomplete file is that no outsider can yet tell whether those channels will mature into
              attractive unit economics before another large financing is needed.


              The correct financial verdict is therefore cautious but not dismissive. ZeroAvia does not look broken. It
              does look externally capital dependent, margin-opaque, and highly sensitive to milestone sequencing. Any
              investment case should be conditioned on management disclosing a cash-and-burn bridge, product-level
              revenue forecast, backlog waterfall, and manufacturing capex plan rather than on the public narrative
              alone.
