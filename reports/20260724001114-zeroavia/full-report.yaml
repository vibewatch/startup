      - number: '7.3'
        title: Operational, partner, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk begins with the fact that ZeroAvia is building a full-stack aviation program, not a
              narrow component startup. It has to move certification work, fuel-cell development, manufacturing
              readiness, airframe integration, airport-hydrogen readiness, and training in parallel. Each stream can
              slip the others. The Scotland manufacturing initiative is strategically sensible because it anchors
              fuel-cell stack production, but it introduces a site-ramp risk of its own. Hydrogen infrastructure is
              another system dependency: route launch requires fuel, handling, airport procedures, and operator
              readiness, not just a cleared powertrain.


              The technical challenge also changes materially between ZA600 and larger liquid-hydrogen pathways.
              Gaseous-hydrogen near-term programs do not solve the storage, thermal, and systems-integration issues
              needed for 40-80 seat aircraft. Public grant and KAERI partnership materials implicitly acknowledge this
              by treating liquid hydrogen as a separate workstream.


              Partner dependence compounds the picture. Early airline and operator pathways require coordination with
              launch operators, airports, training partners, and likely lessors or government stakeholders. That web can
              create moat, but before commercialization it also creates fragility. A delay at any node can reverberate
              across the rest of the program.
