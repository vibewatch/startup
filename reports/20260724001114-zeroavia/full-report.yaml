        title: Retention, repeat, and expansion visibility
        blocks:
          - type: paragraph
            body: >-
              Public retention visibility is the weakest part of ZeroAvias customer chapter. There is no disclosed NRR,
              GRR, churn, contract duration, renewal percentage, satisfaction score, or operator uptime data. Even the
              strongest customer announcements are usually framed as pilots, MOUs, launch plans, or conditional
              purchases. That means there is a meaningful gap between “named proof” and “durable monetization.” In
              practical terms, ZeroAvia can show that sophisticated counterparties want exposure to hydrogen-electric
              aviation, but it cannot yet show that those counterparties are renewing, expanding, or generating
              recurring revenue at scale.


              The closest thing to an expansion logic is architectural rather than contractual. Caravan pathways could
              extend into other small turboprops, while Loganair, De Havilland, and Alaska-related programs open
              larger-aircraft arcs. Parallel to that, defense and UAV module demand create a second expansion loop for
              standalone fuel-cell systems. Training and support relationships such as FlightSafety can deepen switching
              costs once an operator starts the path. But the public record still stops short of confirming that these
              loops have begun to convert into repeat cash flows.


              The right interpretation is not that retention is poor; it is that retention is unproven. For a
              certification-stage aviation company, that difference matters.
