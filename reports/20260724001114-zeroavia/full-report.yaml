      - number: '3.4'
        title: Comparison gaps and decision usefulness
        blocks:
          - type: paragraph
            body: >-
              Public competitor comparison still lacks the metrics buyers would eventually need to choose between
              systems. Pricing is mostly undisclosed. Retrofit cost, power density, maintenance burden, and firm order
              conversion are rarely normalized. That is why current public positioning rewards narrative, milestone
              evidence, and counterparties more than hard commercial proof.


              Even with those gaps, the decision-useful conclusion is fairly clear: ZeroAvia belongs in the first tier
              of regional hydrogen-electric contenders, especially on retrofit-led commercial deployment, but it does
              not yet possess an unbeatable moat over specialists such as H2FLY or the strategic optionality of
              incumbents such as Airbus. Investors should treat the company as competitively advantaged, but only
              conditionally so.


              That ambiguity means investors should treat today's competitive map as a leading indicator, not a settled
              ranking. Partnership announcements with Marshall, Safran, Horizon, Hybrid Air Vehicles, and KAERI broaden
              ZeroAvia's ecosystem reach, but they do not automatically translate into shipped revenue or enduring moat.
              They do, however, raise the bar for any smaller peer that lacks comparable adjacency options.
