      - number: '1.2'
        title: Leadership, governance, and stage
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia entered 2026 as a founder-led scaleup but ended the first half of the year in leadership
              transition. The company announced in June 2026 that founder Val Miftakhov had stepped down as chief
              executive effective 26 May, while remaining on the board, and that Executive Chair Christine
              Ourmières-Widener had been overseeing day-to-day operations during the search for a permanent CEO. That is
              a material stage signal: the company is no longer only a technology-led venture narrative, but an
              organization being reoriented for capital discipline, certification, and commercial execution.


              The governance record in retained public filings adds nuance rather than clean reassurance. Companies
              House shows Miftakhov’s termination as a director of the UK entity on the same date as the CEO transition,
              plus termination of Sergey Kiselev as a director in June 2026 and Georgy Egorov as director and secretary
              in January 2026. The same filing history shows John William Royston King joining as a director in March
              2026. Those moves do not prove dysfunction, but they do show real governance churn across the entity that
              houses the company’s main UK operations.


              Stage-wise, ZeroAvia still reads as late venture / growth-stage rather than commercially mature. It has a
              large industrial ambition, major strategic investors, public certification work, and named launch
              operators, but no disclosed recurring revenue base, no public valuation update, and no evidence yet of
              routine commercial service. The right stage label is therefore post-Series C, pre-scale commercialization,
              with leadership transition and cost discipline now defining the near-term execution environment.
            claimRefs:
              - CO007
              - CO021
              - CO022
