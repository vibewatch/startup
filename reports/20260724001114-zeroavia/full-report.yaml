figures:
  - id: FO001
    title: ZeroAvia milestone timeline
    type: timeline
    layout: wide
    summary: >-
      The milestone sequence shows a company that progressed from early demonstrations to serious certification and
      customer-path activity, but hit a material 2026 cost-and-timeline reset.
    data:
      items:
        - label: Founded
          date: '2018'
          detail: ZeroAvia founded and UK operating entity later incorporated in October 2018.
          tone: neutral
        - label: Early demo flights
          date: 2019-2020
          detail: US and UK hydrogen-electric demonstration flights move the concept into public test operations.
          tone: positive
        - label: Alaska Q400 collaboration
          date: Oct 2021
          detail: Alaska backs a 76-seat ZA2000 pathway and secures up to 50 kits.
          tone: positive
        - label: De Havilland MOU
          date: Dec 2021
          detail: Dash 8-400 retrofit and line-fit exploration adds OEM route-to-market logic.
          tone: positive
        - label: American conditional order
          date: Jul 2024
          detail: American increases investment and signs for 100 engines pending milestones.
          tone: positive
        - label: Series C reaches $150M
          date: Sep 2024
          detail: Broad strategic-investor round closes with airline, OEM, and sovereign-capital participation.
          tone: positive
        - label: RVL named launch operator
          date: May 2025
          detail: ZeroAvia identifies first targeted UK cargo operator for ZA600.
          tone: positive
        - label: UK CAA DOA
          date: Nov 2025
          detail: Company says it became the first hydrogen-electric propulsion developer with such approval.
          tone: positive
        - label: Norway ODIN award prep
          date: Nov 2025
          detail: 15-aircraft and 15-airport network concept selected for EU grant agreement preparation.
          tone: positive
        - label: Runway extension round
          date: Dec 2025
          detail: Further financing extends runway two years but underscores focus on immediate opportunities.
          tone: warning
        - label: Layoffs and certification reset
          date: Jan 2026
          detail: Independent reporting says headcount was cut roughly in half and full ZA600 certification moved right.
          tone: negative
        - label: FAA special conditions
          date: Apr 2026
          detail: US regulator publishes novel-electric-engine conditions for the 600kW system.
          tone: positive
        - label: CEO transition
          date: May-Jun 2026
          detail: Founder steps down as CEO while remaining on the board; Executive Chair leads operations.
          tone: warning
    approximationNotes: >-
      The 2019-2020 demonstration phase is summarized from ZeroAvia's public history page rather than separate primary
      flight-test records.
