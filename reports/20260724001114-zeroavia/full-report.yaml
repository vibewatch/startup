  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and mission fit
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia's market is not “aviation decarbonization” in the broadest sense; it is the narrower slice where
              hydrogen-electric propulsion can credibly replace incumbent turbine economics and emissions on regional,
              cargo, and specialized missions. The company's own product and market pages focus on 9-19 seat aircraft,
              40-80 seat regional turboprops, transport aircraft, UAVs, and defense-adjacent power applications. That
              makes the right market boundary a propulsion-and-power systems market for smaller aircraft and
              mission-specific operations, not the entire commercial jet market.


              This distinction matters because the physics and infrastructure constraints make short-haul and
              specialized operations the first realistic beachheads. ZA600 is aimed at aircraft such as the Cessna
              Caravan and Dornier 228, while ZA2000 targets ATR and Dash 8 families. The retained external evidence is
              directionally consistent: H2FLY's 2026 commentary also points to regional aircraft as the first real
              hydrogen rollout, while Airbus' much larger ZEROe vision sits further out in time. Hydrogen-electric
              aviation is therefore a route- and mission-constrained opportunity first, and a broad aviation replacement
              story only later.
