      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              A near-term public-market exit is hard to support from public evidence. An IPO-grade story would usually
              require a clearer revenue base, stronger disclosure, and more mature operating proof than ZeroAvia
              currently provides. More plausible exit paths are another late private round, strategic capital, or
              eventual strategic M&A once the technology and customer pathways are more mature.


              That does not make the company uninvestable; it means the key diligence question is not whether hydrogen
              aviation is interesting, but whether the specific price and structure on offer compensate for the risk.
              The most important missing items are a current cap table, the amount and terms of the 2025 financing, cash
              and burn detail, a backlog waterfall by commitment type, and a product-by-product commercialization
              timetable.


              Until those are in hand, the right posture is to keep the company on the front page of the watchlist but
              resist false precision.
