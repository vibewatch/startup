        title: Concentration and procurement risk
        blocks:
          - type: paragraph
            body: >-
              The biggest commercial risk is concentration hidden behind impressive branding. Publicly disclosed
              relationships repeatedly return to a small set of high-prestige names: American, Alaska, Loganair, RVL, De
              Havilland, and the Norway pathway. Those names are helpful, but they can create a false sense of
              diversification if the actual revenue base is still tiny or non-recurring. Because ZeroAvia does not
              disclose customer-by-customer revenue, no outsider can tell whether the business is diversifying cash
              exposure as quickly as it is diversifying logos.


              Procurement friction is also higher than in software or even many industrial hardware categories. Each
              commercial win requires not only a customer relationship but also airframe integration, regulatory
              approvals, hydrogen supply, maintenance procedures, and crew training. That means a signed partnership is
              only one stage of a longer commercialization funnel. Adverse reporting on layoffs and certification delays
              increases this risk because every named counterparty still depends on execution milestones moving forward.


              The chapter verdict is therefore favorable but conditional. ZeroAvias named customer proof is above
              average for its stage, especially in breadth and ecosystem depth. Durability and concentration, however,
