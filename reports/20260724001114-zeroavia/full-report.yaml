      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory picture is mixed in the technically positive but still incomplete sense. The FAAs proposed
              and final special-conditions process proves the US pathway is active, and the UK CAAs Design Organisation
              Approval proves the regulator views ZeroAvia as capable of carrying out certifiable design work. But both
              facts should be interpreted carefully. The special conditions are a sign that the technology is novel
              enough to need bespoke rulemaking, not a sign that all approval work is essentially done. Likewise, DOA is
              an organizational capability milestone, not a commercial operating approval.


              GAOs 2026 review broadens the warning: electric-aircraft progress is constrained by infrastructure and
              certification complexity across the sector. That matters because it shifts some risk from “company
              execution problem” to “ecosystem and regulatory maturation problem.” ZeroAvia may execute well and still
              face pacing limits outside its sole control.


              Legal risk is less visible but should not be ignored. Public patent surfaces suggest a real and growing IP
              estate, yet no public summary proves freedom to operate, assignment cleanliness, or the absence of future
              disputes. In a deep-tech propulsion company, those questions matter especially around fuel-cell stacks,
              large-engine architectures, and liquid-hydrogen systems. The retained public record did not surface major
              litigation, but that is a reason to investigate, not a reason to assume legal cleanliness.
