      - number: '2.4'
        title: Regional priority and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The geographic picture is mixed but actionable. Global Market Insights calls Europe the largest market and
              Asia Pacific the fastest-growing, while The Business Research Company says North America is both largest
              and fastest-growing. 360iResearch effectively reconciles the conflict by showing that different regions
              lead on different layers: Europe on policy integration, North America on certification preparation and
              hydrogen funding, and Asia Pacific on industrial momentum. For ZeroAvia specifically, retained evidence
              favors a transatlantic regional strategy with UK and Norway projects, US airline partners, and later Asian
              distribution optionality through partners such as ITOCHU.


              The unresolved sizing gaps are route-level economics and buyer conversion quality. The public record does
              not disclose enough about hydrogen price, retrofit capex, or utilization to turn TAM into a trustworthy
              SAM. Nor do customer announcements consistently distinguish firm orders from conditional or
              milestone-gated commitments. The correct conclusion is that the market is real and growing, but the
              investable opportunity must still be modeled from named corridors and counterparties inward.
            claimRefs:
