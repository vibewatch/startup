  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK / research more rather than buy or avoid. The reason is not that ZeroAvia
              lacks promise; it is that the public evidence and the public valuation anchor are mismatched. On one side
              of the scale sit strong positives: a $150 million strategic Series C, follow-on financing in late 2025,
              regulatory progress with both the UK CAA and FAA, a launch-operator pathway, and adjacent module
              opportunities that can create earlier monetization than airline propulsion alone. On the other side sit
              equally material negatives: no public current post-money valuation in primary sources, no disclosed
              revenue, no disclosed gross margin, no disclosed cash balance, and independent evidence that the company
              already had to cut staff and compress the roadmap to fit the funding environment.


              The thesis is that ZeroAvia may still be one of the most credible hydrogen-electric aviation companies
              because it has multiple shots on goal and unusually strong strategic validation for its stage. The
              anti-thesis is that credibility alone does not guarantee attractive entry. In capital-intensive aviation,
              buying a good company at an undisciplined price can still be a weak investment.


              That is why price sensitivity matters so much here. A buyer should want either a clearly attractive entry
              range or meaningfully better private data before underwriting aggressively.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV022
