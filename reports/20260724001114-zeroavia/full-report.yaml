companyProfile:
  summary: >-
    ZeroAvia is a hydrogen-electric aviation propulsion company founded in 2018, with core operating footprints in
    Everett, Washington and the UK at Cotswold Airport / Kemble. The company develops ZA600 for smaller regional
    aircraft, ZA2000 for larger 40-80 seat aircraft, modular fuel-cell systems such as SuperStack Flex, and related
    airport-hydrogen and ecosystem-enablement capabilities. ZeroAvia raised a $150M strategic Series C in 2024 and
    completed a further financing round in late 2025 that it said extended runway for two years. Public milestones
    include UK CAA Design Organisation Approval, FAA special-conditions progress, a named RVL launch-operator pathway,
    Norway's ODIN deployment plan, and shipment of a flight-intent fuel-cell system to a defense customer. The company
    also entered 2026 under pressure, with layoffs, roadmap compression, and leadership transition.
