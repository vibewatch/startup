      - number: '1.3'
        title: Capital base and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The strongest positive in the overview is the quality and breadth of strategic backing. ZeroAvia’s
              September 2024 Series C reached $150 million and was co-led by Airbus, Barclays Sustainable Impact
              Capital, and NEOM Investment Fund, with UK Infrastructure Bank as a cornerstone investor. Additional
              disclosed participants included Scottish National Investment Bank, American Airlines, IAG, ITOCHU,
              Breakthrough Energy Ventures, Horizons Ventures, Ecosystem Integrity Fund, Summa Equity, Alaska Airlines,
              Amazon Climate Pledge Fund, and AP Ventures. That mix matters because it combines financial investors,
              airlines, aerospace incumbents, sovereign or policy-linked capital, and climate-transition funds.


              The December 2025 financing round reinforced that stakeholder map while changing the story from growth
              funding to runway extension. ZeroAvia said the new round extended cash runway for two years and would
              support industrialization of hydrogen power and propulsion technologies for aviation and defense. Public
              reporting from GeekWire indicates the company had already raised more than $250 million by September 2024,
              but retained official materials do not disclose the amount of the 2025 round or a fresh post-money
              valuation. Investors should therefore treat the capital base as strategically impressive yet still opaque.


              Commercial counterparties double as validation stakeholders. American increased its investment and signed
              a conditional agreement for 100 engines in July 2024. Alaska and De Havilland each supported ZA2000-linked
              Q400 pathways earlier. The signal is clear: major airlines and OEMs want exposure to the option value of
              hydrogen-electric propulsion. The open question is how much of that stakeholder enthusiasm converts into
              firm revenue once certification, economics, and infrastructure have to work together.
