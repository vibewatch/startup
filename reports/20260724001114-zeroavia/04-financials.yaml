  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Recognized revenue, backlog conversion, and average selling prices by product line.
    whyItMatters: Without real revenue and pricing, the company cannot be valued on operating metrics rather than narrative strength.
    diligencePath: Request monthly bookings, billings, revenue, and conversion waterfall by program.
    relatedQuestionRefs:
    - QI001
    - QI006
    - QI022
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Current cash balance, monthly burn, and site-level capex plan after the 2025 financing reset.
    whyItMatters: Runway claims are unusable without the numerator and denominator behind them.
    diligencePath: Review latest management accounts, treasury position, and 24-month operating plan.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI025
  - type: missing-source
    severity: material
    topic: debt
    missingEvidence: Debt facilities, equipment leasing, or project-finance obligations if any.
    whyItMatters: Undisclosed leverage can materially change downside and dilution risk.
    diligencePath: Request debt schedule, security interests, and covenant summary.
    relatedQuestionRefs:
    - QI025
