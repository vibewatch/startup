- id: SR003
  title: Operational, partner, and execution risk
  body: |-
    Operationally, the biggest risk is that Color’s value proposition depends on a chain of actions that must all work: member activation, risk assessment, screening completion, abnormal-result follow-up, diagnosis support, treatment oversight, and survivorship. Many of those actions involve parties outside Color’s direct control. That makes off-platform coordination a central risk, not an edge case. AI adds another layer. The LLE architecture is more thoughtful than generic health-AI marketing and clearly tries to bound hallucination risk through guideline logic and clinician review, but the company still relies on model quality, correct logic encoding, and scalable oversight. The 2023 layoff wave adds a people and execution overlay: Color has already had to reset after a demand shock, so scaling the current oncology model requires sustained organizational focus and specialist coverage. The practical question is not whether risks exist, but whether the operating system can absorb them without visible degradation in care quality over time and across geographies.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
