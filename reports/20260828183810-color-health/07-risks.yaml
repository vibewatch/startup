- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / compliance
    - OCR inquiry, missed BAA, or reportable breach
    - Confirmed breach or formal corrective action process
    - Pause thesis until scope and controls are clear
  - - Patient safety / clinical quality
    - Documented adverse workflow failure or persistent delay trend
    - Evidence that recommendations or follow-up fail at scale
    - Reassess product credibility and customer durability
  - - AI dependency
    - Model access, cost, or policy deterioration
    - Material loss of capability or economics from partner change
    - Demand alternative-path plan and margin impact
  - - Partner concentration
    - Loss or weakening of major channel / network partner
    - Meaningful drop in referrals, platform access, or payer route
    - Recut growth and CAC assumptions
  - - Execution / staffing
    - Further layoffs, vacancies, or specialist shortages
    - Signs of reduced service quality or backlog growth
    - Downgrade scaling confidence
  - - Capital adequacy
    - Evidence of financing stress or inability to fund growth
    - Need for dilutive or defensive financing without proof gains
    - Reframe valuation and downside risk
  notes: These kill criteria are intentionally monitorable. They translate broad risk categories into decision-useful triggers.
