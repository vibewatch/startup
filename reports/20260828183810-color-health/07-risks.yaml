- id: SR004
  title: Kill criteria, monitoring, and unresolved diligence gaps
  body: |-
    Partner and model risk may ultimately be what turns manageable risks into thesis-breakers. Color’s strongest public proofs run through partners such as IBX, Collective Health, and Carrum, while parts of its AI stack and cloud footprint necessarily depend on third-party infrastructure and model providers. If one of those dependencies weakens, Color can lose access, proof, or economics faster than a more vertically controlled company would. Financial opacity compounds the issue because the public record does not show how much runway exists to absorb shocks. The balanced view is that many operating risks are manageable with process discipline, but a small number of high-severity failures—privacy breaches, patient-safety problems, financing stress, or partner shocks—would quickly challenge the entire investment case. Investors should therefore separate routine execution noise from true thesis-break triggers. That distinction should guide both diligence sequencing and valuation discipline in practice.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR033
  - CR034
