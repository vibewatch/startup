callouts:
- calloutType: risk
  title: The biggest danger is not one isolated bug; it is risk transmission across the workflow
  body: |-
    Color’s model spans clinical operations, AI, privacy, partners, and distributed care. A problem in one layer can quickly become a customer, margin, and financing problem if it is not contained early.
  claimRefs:
  - CR001
  - CR012
  - CR033
  - CR041
- calloutType: strength
  title: Some mitigations are real, not performative
  body: |-
    ASCO certification, clinician oversight, structured guideline logic, and explicit cloud-compliance rules give Color more visible risk controls than many healthcare-AI companies. The issue is not whether mitigations exist; it is whether they are strong enough at scale.
  claimRefs:
  - CR015
  - CR018
  - CR019
  - CR035
