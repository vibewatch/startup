callouts:
- calloutType: strength
  title: Revenue quality likely improved as Color moved away from pure COVID surge demand
  body: |-
    The reviewed evidence suggests Color’s current strategy leans toward recurring, enterprise-oriented cancer and population-health programs rather than temporary emergency-testing spikes. That is a healthier quality-of-revenue story, even if the exact mix remains undisclosed.
  claimRefs:
  - CI008
  - CI010
  - CI032
  - CI037
- calloutType: risk
  title: Public evidence is still too thin for a clean runway or margin call
  body: |-
    Color may be strong operationally, but the public record does not reveal current cash, burn, gross margin, retention, or concentration. Without those, an investor can describe the model but not fully underwrite it.
  claimRefs:
