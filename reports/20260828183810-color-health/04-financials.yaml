- id: SI002
  title: Traction, GTM proxies, and what public scale does—and does not—prove
  body: |-
    Public traction evidence suggests Color reached meaningful scale, but only part of that scale is directly underwritable. GetLatka estimates 2024 revenue at $219.5 million, which is the clearest recent revenue number available in reviewed public sources. Meanwhile, Color itself cites operational proof points such as more than 7 million patients served, more than 6,500 testing sites, more than 500 vaccination sites, nearly 1,000 partner organizations, and current outcomes claims including faster diagnosis, higher screening adherence, and positive first-year ROI. Those metrics demonstrate relevance, but they do not reveal mix: how much revenue comes from employers versus health plans, how much is recurring versus episodic, or what portion still reflects lower-quality historical COVID infrastructure work. The sales motion almost certainly remains enterprise and ROI-led. The employer and health-plan materials emphasize baseline analyses, medical-cost reduction, and integration into existing benefits or care-management systems, which points toward long cycles and multi-stakeholder approvals. Partner channels like Collective Health and Carrum can reduce distribution friction, but current public evidence does not quantify their CAC impact.
  claimRefs:
  - CI006
  - CI014
  - CI015
  - CI016
