evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding total and TO003 coverage
    missingEvidence: >-
      A company-authorized cap table or financing history that reconciles disclosed equity rounds with later
      private-database totals.
    whyItMatters: >-
      Current ownership, liquidation preference stack, and dilution history cannot be assessed confidently while
      lifetime funding totals disagree.
    diligencePath: Request investor deck, board materials, and legal financing schedules directly from the company.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: Audited 2024 revenue, gross margin, burn, and cash-balance statements.
    whyItMatters: >-
      The chapter can cite only third-party revenue estimates, which is insufficient for underwriting current operating
      leverage or runway.
    diligencePath: Request audited financial statements or quality-of-earnings materials from management.
    relatedQuestionRefs:
      - QO008
      - QO025
  - type: missing-source
    severity: minor
    topic: governance details and TO002 coverage
    missingEvidence: Current board composition, committee roles, and investor ownership percentages.
    whyItMatters: Governance quality and control rights are central to a late-stage private diligence process.
    diligencePath: Request board roster, governance documents, and financing-side ownership summary from counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: U.S. employer and payer SAM plus TM002 coverage
    missingEvidence: >-
      Segment-level eligible-member counts, pricing, win rates, and renewal economics for employer and health-plan
      cancer programs.
    whyItMatters: >-
      Without conversion and attach-rate data, the serviceable market can only be bounded indirectly with broad cost and
      TAM proxies.
    diligencePath: Request internal pipeline segmentation, pricing schedules, and booked-member counts by buyer type.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-estimate contradictions
    missingEvidence: >-
      Multiple independent market studies using a consistent definition of precision-oncology diagnostics versus
      care-orchestration markets.
    whyItMatters: >-
      Current public sources mix broad therapeutics TAMs with workflow and screening cost pools, making apples-to-apples
      benchmarking difficult.
    diligencePath: Commission triangulation across analyst reports and internal sales data definitions.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: missing-source
    severity: minor
    topic: buyer conversion and procurement timing
    missingEvidence: >-
      Observed sales-cycle durations and implementation conversion rates by employer, health-plan, and public-sector
      segment.
    whyItMatters: The adoption path is clear directionally but not yet precise enough for a rigorous bottoms-up forecast.
    diligencePath: Request CRM funnel data and implementation milestone conversion metrics from management.
    relatedQuestionRefs:
      - QM015
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing and win/loss transparency
    missingEvidence: Account-level pricing sheets, net effective reimbursement, and direct competitive win/loss rates by segment.
    whyItMatters: Without those data, the pricing and moat comparison must remain directional rather than conclusive.
    diligencePath: Request current proposal templates, discount bands, and CRM win/loss analysis by employer and health-plan cohort.
    relatedQuestionRefs:
      - QP012
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: direct feature parity gaps
    missingEvidence: >-
      Independent side-by-side product evaluations or customer scorecards comparing workflow outcomes across Color and
      named competitors.
    whyItMatters: Public vendor pages are useful for positioning but weak for proving implementation superiority.
    diligencePath: Interview buyers who evaluated Color against at least two named alternatives.
    relatedQuestionRefs:
      - QP011
      - QP025
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: switching-cost durability
    missingEvidence: >-
      Renewal behavior and time-to-value after implementation, especially in accounts using both Color and third-party
      diagnostics.
    whyItMatters: The thesis that Color can multi-home while remaining sticky depends on actual retention and workflow usage.
    diligencePath: Request customer cohort retention, product attach, and expansion data from management.
    relatedQuestionRefs:
      - QP014
      - QP015
      - QP024
    relatedTableRefs:
      - TP004
