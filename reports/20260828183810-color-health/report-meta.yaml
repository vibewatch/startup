  topStrengths:
    - Integrated Virtual Cancer Clinic spans screening through survivorship with a broader care surface than many point-solution competitors.
    - Real deployment proof exists through broad patient reach, named partners, and multi-channel distribution into employers and health plans.
    - Clinician-in-the-loop OpenAI workflows add differentiated oncology reasoning support rather than generic AI positioning.
    - The 2026 market still rewards workflow, data, and regulatory moats for high-quality HealthTech assets.
  topRisks:
    - The $4.6B 2021 mark screens stretched against the reviewed $219.5M public revenue proxy and current 2026 valuation bands.
    - Audited revenue, gross margin, retention, customer concentration, current cash, and cap-table terms are not publicly disclosed.
    - The 2023 layoff-driven reset shows execution whiplash after the COVID-era buildout.
    - Color may ultimately deserve a hybrid clinical-infrastructure multiple rather than a software-style scarcity premium.
    - Regulatory, privacy, and partner dependencies can all transmit directly into valuation outcomes.
  unresolvedGaps:
    - Audited GAAP financials and current cash-burn or runway data.
    - Revenue mix across employers, health plans, public-sector programs, and any residual episodic work.
    - NRR, GRR, renewal rates, and top-customer concentration.
    - Current cap table, liquidation preferences, debt, and secondary market history.
    - Measured AI productivity impact on clinician throughput, QA cost, and margin structure.
