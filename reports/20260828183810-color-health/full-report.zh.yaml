            body: >-
              最强技术证据来自 Color 对 AI 如何嵌入这些工作流的公开描述。公司的乳腺 X 线可及性计划描述了一个 AI 智能体：它收集患者病史、评估筛查资格，并生成结构化信息供临床医生复核。后来的 Large
              Language Expert 架构走得更深：混合系统先把指南蒸馏成明确的临床决策因素和布尔逻辑，再让 LLMs 承担受约束的问答角色，最后进入确定性评估。这比泛泛的“AI 助手”营销具体得多，也解释了
              Color
              如何尝试把指南驱动的肿瘤照护规模化运营。架构仍依赖人类临床医生，但这是有意为之：系统要输出推理痕迹、引用和可检查结果，让临床医生验证或推翻。放到产品层面，这项技术试图工业化专家复核，同时不假装可以把临床判断自动化掉。
