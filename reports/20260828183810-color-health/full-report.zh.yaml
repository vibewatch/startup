            body: >-
              财务结论因此是混合的。积极面是，Color
              具备真实买方相关性、可信的企业医疗基础设施故事，以及足以说明其不只是概念期公司的收入估算。负面是，几乎所有可用于投资判断的指标仍然缺失：实际定价、分部收入结构、毛利率、CAC、回本周期、留存、集中度、营运资本节奏和当前现金续航。即便融资图景，在不同来源之间也没有完全对齐；已审阅证据里唯一明确的盈利能力表述来自
