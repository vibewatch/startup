      - number: '2.4'
        title: 增长驱动、约束与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自癌症负担上升、筛查指南放宽、成本压力和随访编排需求。公开指南变化强化了这一点。USPSTF 现在建议从 40 岁开始每两年做一次乳腺 X 线筛查，平均风险成人从 45 岁开始做结直肠筛查，并建议
              50 至 80 岁的特定高风险吸烟者每年做低剂量 CT 筛查。这些建议会带来额外筛查量，也会增加围绕资格、方式选择、异常随访、致密乳腺问题和治疗交接的工作流复杂度。结直肠筛查缺口本身仍很大：NCCRT
              报告称，超过三分之一符合资格的成人仍未按建议接受筛查。该缺口叠加雇主成本压力，支撑了对 Color 这类编排层的需求。约束也很真实。公开来源仍没有给出干净的雇主福利
              SAM，实施转化率属于私有信息，一体化项目还必须克服成员行为、信任、隐私敏感性和既有提供方惯性。尽管如此，趋势是有利的：买方似乎正在从碎片化点解决方案，转向一体化、可衡量的癌症项目；这些项目需要证明诊断更快、可避免成本更低。
