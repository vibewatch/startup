      - number: '2.3'
        title: 买方分层与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方分层比 SAM 更清晰。Color 当前材料明确指向雇主、健康计划、工会、咨询机构和公共部门项目，但各分层的采纳逻辑不同。雇主关心总照护成本、残障负担、劳动力中断和福利
              ROI。健康计划关心更早干预、更好随访，以及在既有网络内避免晚期理赔升级。公共部门买方更关注可及性、分布式人群和弥合筛查缺口。公司的整合足迹也具有商业意义：Collective Health
              合作页面显示，资格数据流、使用数据摄取、SSO 和开票工作流可以标准化，从而降低实施摩擦。Carrum
              合作说明，买方越来越想要相互衔接的连续体，而不是彼此分离的筛查和治疗产品。简言之，市场问题不只是“谁有癌症风险？”，而是“谁控制预算，并愿意在治疗变成灾难性支出之前购买工作流问责？”这让 Color
              更像企业医疗和支付方运营销售，而不是消费者应用销售。
