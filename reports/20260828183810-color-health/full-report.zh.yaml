      - number: '8.3'
        title: 可比公司组与公开市场信号
        blocks:
          - type: paragraph
            body: >-
              可比公司组异常宽，这本身就说明问题。Tempus 和 Natera 体现了市场愿意为高速增长、数据密集、收入披露清晰，且投资者相信长期工作流杠杆的肿瘤平台支付什么价格。Guardant
              则说明，一旦报销和指南动能变得可见，经过临床验证的筛查龙头可以积累多少价值。另一端，Myriad 说明，当增长走弱、支付方摩擦上升时，分子检测公司可以跌到极低的收入倍数。Exact Sciences
              更适合作为战略规模参考，而不是干净的当前上市可比公司，因为它在 2026 年进入了交易情境。Invitae 给出反向案例：商业化和资本效率一旦失灵，品类热度本身保护不了股东权益。


              对 Color 来说，可比分析支持其战略相关性，但不支持自动给出溢价。
