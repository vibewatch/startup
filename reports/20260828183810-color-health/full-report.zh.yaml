  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格 1-10 分记分卡；战略质量强，估值支撑和财务透明度弱。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          note: 癌症成本和复杂度给雇主与支付方带来大痛点。
        - label: 产品差异化
          value: 7
          unit: /10
          note: 整合式癌症工作流叠加临床医生监督的 AI，方向上较有辨识度。
        - label: 运营证据
          value: 7
          unit: /10
          note: 已有真实合作伙伴、患者规模和部署证据。
        - label: 财务透明度
          value: 3
          unit: /10
          note: 收入、利润率、烧钱速度、留存和股权结构表披露仍弱。
        - label: 可比案例支撑
          value: 4
          unit: /10
          note: 可比案例更多验证战略相关性，而不是旧估值。
        - label: 下行保护
          value: 3
          unit: /10
          note: 当前现金、优先权和融资时点不公开。
        - label: 估值支撑
          value: 3
          unit: /10
          note: 按经审阅的 2026 年证据看，2021 年估值标记偏高。
    approximationNotes: 评分是分析师判断，基于截至 2026-08-28 保留的公开证据；不是管理层报告的 KPI。
    claimRefs:
      - CV013
      - CV014
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
