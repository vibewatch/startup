  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Color 的产品已不适合被描述为一家遗传学公司或单一癌症筛查供应商。按工作流看，它是一个虚拟癌症照护运营模式，由多个模块组成：Early Detection、Active Treatment
              Management、Survivorship care、Expert Medical Opinion、Cancer Connect，以及把这些模块串起来的 Virtual Cancer
              Clinic。这一点重要，因为公司卖的是长期照护层，而不是一次接触。工作流从诊断前的风险识别和筛查激活开始，经过异常结果随访和诊断支持，继续到主动治疗管理，再延伸到生存者照护和照护者支持。Virtual
              Cancer Clinic 是贯穿这段旅程的协调界面，但它并不声称取代本地照护场景。相反，它的作用似乎是围绕线下系统补上专家复核、虚拟支持和结构化肿瘤工作流。结果是一个模块化照护交付平台，而不是一次性产品。
