              成本结构让这门生意不再像轻量软件。Color
              模式显然依赖临床医生、检测运营、成员触达、医生监督、数据整合和随访导航。毛利故事因此从根本上是混合型的。相比更依赖自有检测项目菜单、制造或深度实验室商业化的诊断公司，Color
              的资本强度可能更低，但服务交付强度仍然很高。2023 年裁撤 300 名员工，是管理层在 COVID
              检测需求退潮后不得不重新压缩公司的最强公开信号。资本充足性方面，公开证据仍令人挫败地不完整。TechCrunch 报道 2021 年初有一轮 $167M Series D；Color 自己在同年晚些时候的
              Series E 新闻稿称，总融资以 $4.6B 估值达到 $378M。但已审阅公开披露中没有当前账上现金、债务、烧钱速度或现金续航。公开可比公司可帮助界定可能所需投入：Tempus 2025 年末持有
