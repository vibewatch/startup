      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              估值工作必须从一个过期但真实的锚点开始：Color 最近一次被直接确认的融资估值，是 2021 年 11 月 Series E 的 $4.6B。这个价格形成于完全不同的市场。GetLatka 对 2024
              年收入的估计为 $219.5M，是当前最好的公开收入分母，但它仍是第三方估计，不是经审计披露。如果这个数字方向正确，旧估值大约对应 21x 收入——明显高于本次核查的 2026 市场评论中出现的 6x 至 12x
              高端 HealthTech M&A 区间，也高于中个位数的上市软件公司中位数。这并不意味着旧价格不可能成立，但确实意味着它现在需要承担更重的举证责任。


              因此，入场纪律很关键。问题不只是 Color 是否应当相对增长更慢的检测供应商享有溢价，而是没有刷新财务披露时，它是否还应接近 2021 年繁荣期的溢价。只看公开证据，答案是否定的。
