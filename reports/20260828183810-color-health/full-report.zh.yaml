      - number: '3.2'
        title: 竞争者类别与最接近的具名对手
        blocks:
          - type: paragraph
            body: >-
              在具名公司中，Tempus 看起来是最接近的规模化一体化竞争者。其 2025 年业绩显示，它既有大型诊断业务，也有可观的数据和应用业务；这比纯实验室模式更接近 Color
              的“基础设施加智能”命题。Guardant、Foundation Medicine、Myriad、Natera、GRAIL 和 Exact Sciences 各自用更窄但有时更深的产品楔子竞争。Guardant
              在血液筛查和液体活检工作流上很强。Foundation Medicine 在治疗选择和伴随诊断上尤其强。Myriad 强在遗传风险和咨询支持检测。Natera 的 MRD 楔子很锐。GRAIL 有野心很高的
              MCED 筛查楔子，但检测限制也明确。Exact Sciences 在筛查和遗传/治疗指导上有品牌优势。Labcorp 和 Quest 重要，因为它们可以把肿瘤服务打包进长期诊断关系。Invitae
              作为持续竞争者的重要性较低，更像一个警示：广谱遗传学平台一旦跑在资本结构之前，会发生什么。
