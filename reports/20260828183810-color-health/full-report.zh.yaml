  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Color 的投资逻辑，在把公司看成癌症工作流基础设施平台、而不是传统基因组学供应商时最站得住。本次核查的证据支持这个定位。当前官网围绕 Virtual Cancer Clinic
              展开，覆盖筛查、诊断支持、治疗管理、康复期管理，也借雇主和健康计划做合作伙伴分发。与 OpenAI 的合作增加了一层差异化但仍处早期的工作流：Color 不是简单包装通用
              AI，而是在临床医生监督下使用推理工具，补上肿瘤照护的具体缺口，例如按风险调整的筛查计划和治疗前检查准备。这些是真实的产品信号，也重要，因为它们对应癌症照护中成本高、运营最疼的节点。


              反向逻辑在于，战略质量比经济性更容易验证。公开来源没有给出经审计收入、毛利率、留存、客户集中度或当前资本结构。2023 年裁员说明，COVID 时期扩张之后，管理层已经不得不重置。因此，问题不是 Color
              是否有意思，而是当前证据能否支持一笔对价格敏感的投资判断。
            claimRefs:
              - CV009
              - CV010
