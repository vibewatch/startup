  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险框架
        blocks:
          - type: paragraph
            body: >-
              Color
              的风险应按一家已经规模化的虚拟肿瘤运营商来排序，而不是按轻触型软件供应商来排序。最高严重度暴露集中在隐私与监管合规、患者安全与运营执行、伙伴依赖和财务不透明。公司处理高度敏感的癌症和遗传学邻近健康数据，在临床工作流中使用
              AI，并协调往往依赖第三方的照护，而这些第三方不受它控制。这个组合很强大，也意味着故障会迅速从一个领域传导到另一个领域。隐私或云合规疏漏可能变成客户和融资问题。向本地提供方交接缓慢或错误频发，可能同时变成质量和留存问题。因此，风险视角必须关注传导：一个弱点如何沿着照护交付、客户信任和资本需求扩散。这就是为什么这里的剩余风险排序，比通用初创公司风险清单更重要。
