  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Color 的轨迹从基因检测起步，先扩展到 COVID 公共卫生规模化，再转向以癌症为核心的虚拟护理和 AI 工作流模式。
