        title: 收入来源、变现逻辑与确认复杂度
        blocks:
          - type: paragraph
            body: >-
              Color 的公开财务故事首先来自买方结构，而不是公开价格表。公司当前界面展示的是可变现项目，卖给雇主、健康计划、公共部门机构，以及经由 Virtual Cancer Clinic
              进入的人群。这意味着一套混合收入栈：企业项目费、检测经济性、实施和数据整合工作，以及长期导航或临床支持服务。重要的是，这项服务已不再适合被理解为直面消费者基因组学。TechCrunch 的 2021 年融资报道和
              Color 当前网站都指向一个围绕分布式医疗基础设施和临床工作流交付搭建的业务。没有透明目录价，本身也说明问题：这是围绕避免癌症成本、分期前移和运营结果展开的顾问式销售，而不是低摩擦交易。因此，收入确认可能比单一
              PMPM 或按检测计费项更复杂，因为底层服务结合了软件、临床监督、诊断物流和随访协调。
