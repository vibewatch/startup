    type: bar
    layout: wide
    summary: 如果经审阅的 2024 年收入代理值按选定倍数区间估值，下表给出以百万美元计的示意企业价值。
    data:
      items:
        - label: 3.5x 上市软件底部倍数
          value: 768
        - label: 6x 低溢价医疗科技
          value: 1317
        - label: 10x 强势混合模式溢价
          value: 2195
        - label: 12x 经审阅溢价并购区间上沿
          value: 2634
        - label: 18x 上市高溢价可比公司视角
          value: 3951
        - label: ~21x，2021 年估值标记隐含
          value: 4600
