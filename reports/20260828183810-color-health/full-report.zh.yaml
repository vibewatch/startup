        - 需要产品、临床与法务对齐
        - 中
        - 中高
        - ASCO 与内部审核机制
        - 审查 QA 治理与事件委员会
      - - 资本效率型执行
        - 当前现金跑道未知
        - 中
        - 高
        - 既有融资基础
        - 审查烧钱速度、计划与应急预算
    notes: Color 在 COVID 后重置业务之后，执行风险集中在人员配置、流程成熟度，以及公司能否继续聚焦。
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 可监测触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 合规
        - OCR 调查、遗漏 BAA，或需报告的数据泄露
        - 确认发生泄露或进入正式整改流程
        - 在范围和控制措施厘清前暂停投资逻辑
      - - 患者安全 / 临床质量
        - 有记录的不良工作流失效，或延误趋势持续
        - 有证据表明建议或随访在规模化后失效
        - 重新评估产品可信度与客户持久性
      - - AI 依赖
        - 模型访问、成本或政策条件恶化
        - 合作伙伴变化导致能力或经济性显著受损
        - 要求替代路径计划，并评估利润率影响
      - - 合作伙伴集中度
        - 主要渠道 / 网络伙伴流失或转弱
        - 转诊量、平台访问或支付方路径明显下滑
        - 重算增长与 CAC 假设
      - - 执行 / 人员
        - 进一步裁员、岗位空缺或专家短缺
        - 服务质量下降或积压增长的迹象
        - 下调规模化信心
      - - 资本充足性
        - 出现融资压力或无法支撑增长的证据
        - 在证明力没有提升时需要稀释性或防御性融资
        - 重新框定估值与下行风险
    notes: 这些叫停标准有意选成可监测信号，把宽泛风险类别转成可用于决策的触发条件。
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR040
      - CR042
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 战略质地可信，但基于公开证据，价格承销依据仍然薄弱。
        - 保持跟踪，但不要按已过时的 2021 年估值承销新一轮融资。
      - - 信心
        - 中
        - 产品和市场信号强；财务披露仍不完整，且多为估计。
        - 数据室材料可能很快把判断推向任一方向。
      - - 风险评级
        - 高
        - 执行、监管、合作伙伴和资本结构不确定性都会影响价值。
        - 承销时保持下行约束，并设定明确叫停触发条件。
      - - 估值立场
        - 偏高
        - 与当前收入代理和已评估的 2026 年倍数区间相比，2021 年估值显得偏高。
        - 要么争取更低价格，要么要求显著更强的证据。
      - - 进入纪律
        - 低于 ~$1.5B-$2.0B 时改善
        - 这个区间更贴合基于已评估收入锚点的中高端混合型 HealthTech 倍数。
        - 低于这个区间，预期上行才开始补偿不透明度。
    notes: 根据已审阅公开证据判断当前承销立场；估值区间仅作示意，不构成正式公平性意见。
    claimRefs:
      - CV014
      - CV015
      - CV017
      - CV021
      - CV022
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点类型
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 一体化癌症工作流模型覆盖筛查、诊断、治疗和生存期管理中的高摩擦环节。
        - Virtual Cancer Clinic 以及雇主和支付方材料。
        - 如果证明客户仍只购买狭窄单点方案，该判断会被削弱。
      - - 投资逻辑
        - 临床医生在环的 AI 可能撬动工作流杠杆，而不必把投资逻辑押在全自动化上。
        - Color 与 OpenAI 关于 copilot 和诊疗评估支持的材料。
        - 若临床医生采用率低或经济性高度依赖人力，该判断会被削弱。
      - - 投资逻辑
        - 有意义的运营规模和患者触达表明，Color 不只是试点阶段故事。
        - 独立报道提到 7M+ 患者和广泛合作伙伴活动。
        - 如果当前收入质量主要来自残留或一次性项目，规模的价值会下降。
      - - 反向逻辑
        - 公开经济性不透明：收入、毛利率、留存、集中度和现金均未披露。
        - GetLatka 和 Tracxn 只提供方向性的第三方数据。
        - 经审计财务和近期队列数据会显著改善判断。
      - - 反向逻辑
        - 2021 年估值形成于截然不同的市场，可能已不能沿用。
        - Series E 轮披露与 2026 年估值区间对照。
        - 更高的当前收入基数，或高溢价 M&A 证据，可能支撑旧估值。
      - - 反向逻辑
        - COVID 后重置中的裁员暴露组织急转弯和执行风险。
        - MobiHealthNews 关于裁员的报道。
        - 如果能连续几年干净地聚焦肿瘤业务执行，这一担忧会缓和。
    notes: 配对本轮浮现的最强正反论点；各行来自已审阅证据的综合，而不只依赖管理层指引。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV021
      - CV022
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示意估值区间
      - 概率信号
      - 主要风险或解锁点
    rows:
      - - 乐观
        - Color 证明癌症项目增长可持续、工作流杠杆接近软件，并具备战略稀缺性。
        - ~$3.2B-$4.8B
        - 需要经审计证据证明当前收入质量和利润率配得上顶端 HealthTech 定价。
        - 解锁点是高溢价战略买家，或高溢价 crossover 融资。
      - - 基准
        - Color 是真实的混合型临床基础设施业务，但增长中等、披露不完整。
        - ~$1.6B-$2.4B
        - 最贴合当前公开证据和可比公司框架。
        - 主要风险是隐藏经济性弱于公开叙事。
      - - 悲观
        - 收入质量、集中度或利润率结构不及预期，融资也处于更弱的谈判位置。
        - ~$0.8B-$1.4B
        - 如果经审计证明改善前就需要新资本，这一情景概率会上升。
        - 触发信号是平轮或下轮融资，并伴随可见的执行或报销压力。
    notes: 区间是分析师以十亿美元计的估计，基于已审阅收入代理、2026 年 HealthTech 倍数评论和公开可比区间。
    claimRefs:
      - CV019
      - CV020
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV048
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All valuation references actively used in this chapter’s underwriting frame: direct public oncology or screening
        comparables plus one category-distress caution and one strategic-scale reference.
    columns:
      - 可比公司
      - 状态
      - 参考指标
      - 倍数 / 估值信号
      - 与 Color 的相关性
      - 局限
    rows:
      - - Tempus AI
        - 公开
        - 2026 年 Q2 收入 $382.5M；LTM 收入 $1.43B
        - EV/Sales 8.52x；企业价值 $12.17B
        - 精准肿瘤数据叠加工作流溢价的最佳参照。
        - 披露的经济性远比 Color 丰富，规模也更大。
      - - Guardant Health
        - 公开
        - 2026 年 Q2 收入 $335.0M；LTM 收入 $1.18B
        - EV/Sales 18.86x；企业价值 $22.35B
        - 临床验证筛查平台上行的最佳参照。
        - 公开市场溢价依赖报销和 Shield 动能，Color 尚未证明这些。
      - - Natera
        - 公开
        - 2026 年 Q2 收入 $752.8M；LTM 收入 $2.71B
        - EV/Sales 17.34x；企业价值 $46.11B
        - 展示肿瘤检测龙头在规模化后如何拿到高溢价倍数。
        - 检测业务版图更宽，公开披露也远深于 Color。
      - - Myriad Genetics
        - 公开
        - 2026 年 Q2 收入 $190.7M；LTM 收入 $806.6M
        - EV/Sales 0.49x；企业价值 $398.51M
        - 可作为成熟检测厂商遭遇支付方摩擦时的下行视角。
        - 业务组合不同，增长画像也弱得多。
      - - Exact Sciences
        - 战略参照
        - 2024 年收入 $2.76B，其中精准肿瘤业务 $655M
        - 2026 年交易语境下约 6.65x EV/Sales
        - 显示规模化癌症筛查资产可获得的战略价值。
        - 受 2026 年交易影响，已不再是干净的当前公开可比公司。
      - - Invitae
        - 品类反面警示
        - 2024 年申请 Chapter 11
        - 即便品类相关，股权价值仍被摧毁
        - 提醒投资人，基因组学叙事可能在资本和报销压力下失效。
        - 困境案例，不是干净的估值可比。
    notes: 选取这些公司是为了把 Color 放在高溢价肿瘤平台结果与下行检测厂商结果之间；估值混合使用公司官方发布和当前市场数据页面。
    claimRefs:
