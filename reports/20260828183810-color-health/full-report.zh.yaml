              Color 把软件与临床运营结合的地方，部署成熟度看起来最强。Early Detection、Active Treatment Management 和 Survivorship
              页面不是抽象承诺；它们描述了清晰用例、交接和可衡量干预。Expert Medical Opinion 嵌入照护中，而不是事后追加的复核。Cancer Connect 增加同伴和照护者支持。Collective
              Health 显示，整合可涉及资格数据流、SSO、计费和使用数据；Carrum 合作则显示，产品可以连接下游治疗路径。主要外部依赖也很清楚：本地治疗医生、福利平台、伙伴路径、指南机构，以及 OpenAI
              这类基础模型伙伴。这意味着架构并非完全自给自足。Color 掌握协调逻辑和虚拟临床层，但真实世界照护旅程的大部分仍留在平台之外。它既是优势——因为采用更灵活——也是产品风险，因为 Color
              不能完全控制的系统会限制协调质量。
