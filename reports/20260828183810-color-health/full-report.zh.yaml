      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最终尽调应聚焦最能快速收窄估值分布的具体数据。第一，投资者需要经审计 GAAP 财务报表和近期管理账，检验 GetLatka
              收入估计是否方向正确，并看清毛利率、烧钱速度和营运资金需求。第二，需要收入质量证据：客户集中度、续约行为、留存，以及雇主、健康计划、公共部门项目和任何残留一次性业务之间的分部组合。第三，需要当前股权结构表、优先股堆叠和现金位置，因为即便企业价值看起来合理，清算条款也可能抹掉预期上行。


              在这些问题解决之前，正确姿态是有纪律的好奇。Color 有足够的战略证据留在观察名单上，但估值证据还不足以支持追逐旧价格。
