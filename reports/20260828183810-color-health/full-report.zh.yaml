      - number: '2.2'
        title: 规模测算视角：广义 TAM、狭义筛查经济性与当前 SOM
        blocks:
          - type: paragraph
            body: >-
              公开数据支持多个 TAM 视角，但没有一个完美的投资测算数字。最宽的外部视角来自 Mordor Intelligence：其测算精准肿瘤市场 2026 年为 $127.68B，并预计 2031 年达到
              $201.27B。该数字包含治疗和诊断，因此高估了 Color 可直接触达的部分。更窄但仍有意义的视角来自 Color 自己的市场经济性分析：美国每年癌症筛查成本约 $43B，筛查、治疗和生存者照护合计超过
              $250B。两个数字都无法干净映射到 Color 的真实可服务市场，但共同界定了公司所在的经济区间。若把 GetLatka 对 2024 年收入 $219.5M 的估算当作粗略 SOM 锚点，Color
              相对任何一个口径都很小：约为 Mordor 全球 TAM 的 0.17%，约为美国 $43B 筛查成本池的 0.5%。因此，市场仍可很大，并不意味着 Color 已接近饱和。
