      items:
        - label: 创立
          date: '2013'
          detail: Color 围绕提升基因检测和预防性护理可及性成立。
          tone: positive
        - label: 公开发布
          date: 2015-03
          detail: Color Genomics 以平价遗传性癌症检测叙事推出。
          tone: positive
        - label: COVID 实验室搭建
          date: 2020-03
          detail: Bay Area 居家令发布后数周内，公司建成 CLIA 认证 COVID 实验室。
          tone: positive
        - label: San Francisco 检测点
          date: 2020-04
          detail: Color 与 San Francisco 上线首批高通量公共检测点之一。
          tone: positive
        - label: Series E 轮
          date: '2021-11-09'
          detail: 融资 $100M，估值 $4.6B，并强调拥有近 1,000 家机构合作伙伴。
          tone: positive
        - label: All of Us 角色
          date: 2021-2025
          detail: 在 NIH All of Us 项目中担任牵头伙伴，并作为唯一遗传咨询提供方。
          tone: positive
        - label: 裁员
          date: 2023-03
          detail: 在收缩 COVID 检测敞口的同时削减约 300 个岗位。
          tone: negative
        - label: OpenAI 合作启动
          date: '2023'
          detail: 开始与 OpenAI 共建肿瘤 copilot。
          tone: positive
        - label: Carrum 合作
          date: 2024-06
          detail: 为雇主癌症项目加入基于价值的治疗路径。
          tone: positive
        - label: Copilot 推出
          date: 2024-06
          detail: 宣布面向 200,000+ 个患者病例推出 AI care-plan 支持。
          tone: positive
        - label: MSK Direct 合作
          date: 2024-07
          detail: 将 Color 覆盖 50 州的模式与 Memorial Sloan Kettering 专家访问结合。
          tone: positive
        - label: ASCO Certified 里程碑
          date: 2025-08
          detail: 宣布获得首个虚拟诊所 ASCO Certified 认证。
          tone: positive
