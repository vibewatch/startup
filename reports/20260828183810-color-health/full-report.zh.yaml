  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻玩家、既有巨头与现状
        blocks:
          - type: paragraph
            body: >-
              Color 面对的不是一组边界整齐的同行。竞争场包括直接工作流玩家、带有相邻野心的诊断公司、全国性既有实验室、提供方主导的癌症中心，以及内部导航或病例管理团队这一现状。买方不必在“Color
              和某个具名初创公司”之间二选一；很多账户的替代方案，是把既有计划工作流、点解决方案和本地专家拼起来。最清晰的格局切分，是一体化企业肿瘤项目与诊断优先公司。Color
              属于前者。多数公开竞争对手属于后者，靠被开立的检测、可报销检测项目或提供方驱动的使用量变现。因此重叠是真实的，但只是部分重叠。Color
              卖的是面向买方的癌症筛查与照护管理运营层；若干对手卖的是面向临床医生的检测，之后可能扩展到相邻工作流领域。战略问题因此不只是谁的科学最好，而是谁控制购买和患者行动真正发生的工作流。
