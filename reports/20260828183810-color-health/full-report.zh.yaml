chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Color Health 现在把自己呈现为癌症照护基础设施公司，而不是最初进入市场时的消费者基因组学品牌。其公开网站强调 “Virtual Cancer
              Clinic”，覆盖预防、早筛、诊断支持、主动治疗管理、生存者照护和返岗支持。买方范围很宽：雇主、健康计划、工会、咨询机构和公共部门机构，都出现在当前导航和解决方案页面中。这个定位很关键：Color
              卖的不再是狭窄的检测产品，而是一个把数字工作流、照护协调、肿瘤医生主导的临床复核和福利整合拼在一起的运营模式。总部仍在加州
              Burlingame；公司仍然强调，提升可及性、速度和直接临床管理，可以同时降低癌症成本和癌症照护碎片化。概览来源还显示，Color 当前运营故事把既有的人群健康基础设施，与聚焦癌症服务的叙事合在一起。
