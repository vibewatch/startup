companyProfile:
  summary: >-
    Color Health 是一家私有医疗基础设施公司，总部位于加州 Burlingame，2013 年成立；如今核心是覆盖筛查、诊断支持、治疗管理和生存者照护的一体化 Virtual Cancer Clinic。公司在 COVID
    期间把公共卫生基础设施做大，随后随着检测需求退潮，于 2023 年裁撤约 300 个岗位，并把重心转向雇主、健康计划、公共部门项目和肿瘤工作流。Color 最近一次直接确认的融资标记是 2021 年 11 月以 $4.6B 估值完成
    $100M Series E；当前最好的公开收入锚点是第三方给出的 2024 年 $219.5M 估算。OpenAI 合作与广泛患者触达显示出真实战略价值，但当前经济性披露仍不足。
