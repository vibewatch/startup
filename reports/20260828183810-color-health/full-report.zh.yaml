      - number: '1.3'
        title: 资本历史、规模指标与披露质量
        blocks:
          - type: paragraph
            body: >-
              Color 的资本历史同时显示出很强融资杠杆和明显不透明。公司最后一次正式宣布估值是在 2021 年 11 月，当时 Color 以 $4.6B 估值完成 $100M Series
              E。该公告的官方披露称，总融资已达 $378M。此后，Color 自有网站没有出现后续公开轮次，投资人仍只能锚定 COVID 时代医疗科技热潮中的融资标记。第三方数据库对累计融资总额不一致：Tracxn
              目前汇总为 8 轮 $491M，GetLatka 则只显示 2 个主要轮次 $267M。差异并不推翻 Series E
              本身，但会削弱“总融资额”作为干净头条数字的可信度。收入同样不透明。在可访问第三方数据中，唯一当前数字是 GetLatka 对 2024 年收入 $219.5M
              的估算；它可作为方向性背景，却不能替代审计财务。员工规模估算集中在 600 人出头到 600 多人中段，说明即便 2023 年裁员后，公司仍有相当大的运营足迹。
