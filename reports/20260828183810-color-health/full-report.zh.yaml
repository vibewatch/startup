            body: >-
              公开牵引力证据显示 Color 已达到有意义的规模，但其中只有一部分能直接支持投资判断。GetLatka 估计 2024 年收入为 $219.5M，这是已审阅公开来源中最清晰的近期收入数字。与此同时，Color
              自己引用了运营证明点，包括服务超过 7M 名患者、超过 6,500 个检测点、超过 500 个疫苗接种点、近 1,000 家合作机构，以及当前结果主张：诊断更快、筛查依从性更高、第一年 ROI
              为正。这些指标证明了相关性，却没有揭示结构：收入有多少来自雇主、有多少来自健康计划；多少是经常性、多少是事件性；还有多少仍反映质量较低的历史 COVID 基础设施工作。销售动作几乎肯定仍由企业销售和 ROI
              驱动。雇主和健康计划材料强调基线分析、医疗成本降低，以及接入既有福利或照护管理系统，指向长周期和多方审批。Collective Health、Carrum
              这类伙伴渠道可以降低分销摩擦，但当前公开证据没有量化它们对 CAC 的影响。
