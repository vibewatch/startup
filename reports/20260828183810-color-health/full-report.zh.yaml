  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Color 的市场框成一个单一的“肿瘤”大桶。更有用的边界是分层的。最宽层面，公司处在精准肿瘤市场内，因为其工作流触及风险分层、基因组学指导的筛查和指南驱动的诊断。但在实际商业层面，Color
              竞争的是面向大人群销售的一体化癌症照护基础设施：雇主、健康计划、工会和公共机构想要更高筛查完成率、更快诊断和更低下游治疗成本。这个区分很重要。Color
              不试图掌握治疗收入、输注中心经济性或医院住院环节；它把自己嵌入这些支出池之前和周围的高摩擦工作流层。现状替代方案仍然普遍存在，包括碎片化的 PCP
              外呼、健康计划病例管理、区域癌症中心转诊网络，以及只处理旅程某个时点的点解决方案。Color 正是用这种碎片化现状，为一体化模式背书。
