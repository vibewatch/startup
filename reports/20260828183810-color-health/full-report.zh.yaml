      - number: '8.4'
        title: 情景区间与最终判断
        blocks:
          - type: paragraph
            body: >-
              情景框架很直接。乐观情景下，Color 证明一体化癌症工作流、合作伙伴触达和临床医生在环的 AI，能够支撑更高质量的收入，并拿到接近 HealthTech
              战略区间上沿的稀缺性倍数。该情景可以接近旧估值，但前提是披露强得多，并有耐久增长证据。基准情景更保守，也更符合公开证据：Color
              是一家真实、有真实牵引力的公司，但更适合按混合型临床基础设施资产估值，而不是顶尖分位的软件复利机器。悲观情景则是平轮或下轮：如果 2024
              年收入代理变量夸大了耐久收入质量，或者利润率、客户集中度、股权结构表遗留压力比外部投资者预期更差，结果就会如此。


              这个情景分布解释了为什么建议落在「观察」。原则上公司仍可投资，但公开证据还不足以在过期的 2021 年估值上形成确信。
