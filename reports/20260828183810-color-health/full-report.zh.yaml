      - number: '7.2'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              监管和法律栈是最清晰的硬风险层。HIPAA 隐私、安全、泄露通知和云服务业务伙伴义务，都适用于采用 Color 这类照护模式的公司，只要它在内部系统和伙伴之间创建、接收、维护或传输 ePHI。HHS
              指引明确指出，维护 ePHI 的云提供商即便只存储加密数据，也属于业务伙伴；这意味着 Color 的合规负担会延伸到供应商架构和合同控制。实验室监管也不是假设，而是当前议题。Color 的 HPV
              筛查材料明确提到自有 CAP 认证、CLIA 认证实验室，更广泛的 FDA 对诊断和 LDT 框架的监督仍是活跃政策变量。ASCO
              认证是真实缓释项，因为它传递出质量体系信号；但它不是隐私、实验室或临床运营故障的万能盾牌。正式政策总体也是如此：它们降低风险，但不能抹去事故、审计或规模扩张期间的运营暴露。
