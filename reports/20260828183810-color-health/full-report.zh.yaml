        title: 按买方、用户与支付方拆分客户
        blocks:
          - type: paragraph
            body: >-
              Color
              的客户基础应按渠道和工作流责任拆分，而不只是按客户类型。公司当前材料指向五个实用群体：雇主、健康计划、工会、公共部门机构，以及研究或国家健康计划。在多数部署中，经济买方是机构，终端用户是成员、员工、患者或参与者，经济收益归于试图借助更早发现和更好协调来降低癌症成本的支付方或赞助方。这一结构很重要，因为采纳方式是企业级、面向人群的，而不是消费者自助。它也意味着，一些最强客户证据来自渠道和嵌入式项目，而不是经典
              SaaS 客户数指标。因此，买方可能以福利负责人、医疗管理团队、工会受托人或公共卫生发起方的形式出现，而用户体验仍像一项跨场景的连续临床服务。
