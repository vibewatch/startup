  - id: TV005
    title: 投资逻辑破裂与叫停触发条件表
    columns:
      - 触发条件
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 融资低于基准情景区间
        - 新一轮增发融资明显低于 ~$1.5B EV
        - 表明内部人或新投资人不支持旧估值。
        - 立即重新承销；除非条款特别好，默认回避。
      - - 收入质量不及预期
        - 经审计收入、毛利率或留存显著低于隐含预期
        - 打断从战略质地到高溢价估值的桥。
        - 从观察转为回避。
      - - 合作伙伴转化偏弱
        - 主要雇主、支付方或转诊渠道采用或续约疲弱
        - 削弱分发和工作流规模化逻辑。
        - 下调假设上行，并重新审视可比公司组。
      - - 监管或合规冲击
        - 重大 HIPAA、实验室、报销或临床质量问题
        - 同时抬高风险溢价和客户摩擦假设。
        - 在事态受控前，按投资逻辑破裂处理。
      - - AI 仍高度依赖人力
        - Copilot 改善质量，但没有改善人力或吞吐经济性
        - 堵住稀缺性溢价的乐观情景。
        - 将估值上限压在混合服务型区间。
    notes: 定义最快使当前承销框架失效的可衡量事件。
    claimRefs:
      - CV046
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 三年经审计 GAAP 财务，加最新管理账
        - 验证收入锚点、利润率画像和烧钱速度。
        - 要求提供 CFO 材料包和审计师背书报表。
      - - 收入结构
        - 雇主、健康计划、公共部门项目以及任何残留一次性业务之间的分部拆分
        - 判断收入是否经常性、是否配得上溢价。
        - 管理层数据室加队列分析。
      - - 客户持久性
        - NRR、GRR、续约率、头部客户集中度和合同期限数据
        - 检验合作伙伴证明能否转成持久价值。
        - 商业分析导出和 Top 20 账户审查。
      - - 股权结构表与流动性
        - 当前股权结构表、优先权、债务、期权池和老股交易历史
        - 判断投资人真实回报机制。
        - 律师审核后的股权结构表和瀑布模型。
      - - 当前现金与现金跑道
        - 现金余额、债务契约、月度烧钱速度和融资时点
        - 澄清投资人承销的是选择权还是融资刚需。
        - 资金管理材料包和董事会材料。
      - - AI 生产率经济性
        - 临床医生吞吐量、人力组合、QA 成本，以及使用 copilot 后实际节省的时间或成本
        - 检验 AI 是改变利润率，还是只改善叙事。
        - 运营仪表盘加从试点到生产的指标。
    notes: 这些问题按其缩小估值分布、改变投资建议的速度排序。
    claimRefs:
      - CV013
      - CV043
      - CV048
      - CV051
      - CV052
