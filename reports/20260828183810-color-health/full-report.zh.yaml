      - number: '1.2'
        title: 领导层深度与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层深度是 Color 能够可信地把自己推到软件供应商之上的主要原因之一。Othman Laraki 仍是公司的核心高管和公众面孔；他在 Google 做产品领导、在 Twitter
              扩平台的经历，也解释了为什么 Color 仍把照护交付视为基础设施和工作流问题。但现有团队远不止 Laraki。Caroline Savello 负责癌症战略和结果，Rebecca Miksad 带来
              Flatiron Health 的临床与数据科学积累，Josh Sturm 负责商业扩张，Dany Matar 负责运营，Jake Hargraves 负责法律事务，Lee Mallabone
              领导工程。这种组合支撑了 Color 当前模式：企业分销、肿瘤级临床监督、监管纪律和软件执行必须同时到位。取舍在于关键人依赖。Laraki 的履历、融资引述和战略评论深深嵌入 Color
              叙事；即便管理层梯队更宽，高管连续性仍是有意义的尽调问题。
