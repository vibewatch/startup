      - number: '1.4'
        title: 里程碑、转向历史与当前可信度
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Color 一再把自身基础设施改造到当时最紧迫的医疗瓶颈上。公司从基因组学和遗传性癌症检测起步，疫情期间大规模切入 COVID 检测和疫苗接种项目；随着疫情需求退潮，管理层在 2023 年初裁撤约
              300
              个岗位，并重新聚焦政府远程医疗基础设施和预防工具。这轮演进的当前章节明确以癌症为先。网站、合作伙伴页面和近期博客现在都围绕更快诊断、更高筛查依从性、主动治疗管理和生存者照护展开。战略合作强化了这个转向：ACS
              增加教育和可信度，MSK Direct 增加专家触达，Carrum 增加价值导向治疗路径，Collective Health 增加福利系统整合，All of Us 与 WISDOM
              保留基因组学和研究脉络。OpenAI 合作是新方向最清晰的信号。Color 没有营销泛化 AI 自动化，而是把 AI
              用到筛查计划生成、治疗前准备等高度具体的肿瘤工作流，同时把临床医生监督放在中心。转向历史、运营宽度和未解决披露缺口叠加，让 Color 值得关注，但尽调负担仍重。
