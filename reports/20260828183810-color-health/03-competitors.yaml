- id: SP003
  title: Capabilities, packaging, switching costs, and channel power
  body: |-
    Capability comparison favors Color on enterprise workflow breadth but not on assay breadth, reimbursement maturity, or physician pull-through. That distinction is central to underwriting the moat. If the buyer wants one partner to close screening gaps, accelerate diagnosis, coordinate referrals, and support survivorship, Color’s positioning is differentiated. If the buyer wants the deepest advanced-cancer profiling menu, an FDA-cleared companion-diagnostic franchise, or entrenched physician ordering behavior, Foundation Medicine, Guardant, Myriad, or Natera can look stronger. Pricing transparency is poor across the set, which itself is strategically informative. The market still sells through reimbursement pathways, enterprise negotiations, bundled contracts, and patient-assistance programs more than through posted price cards. This supports the view that implementation and channel access are at least as important as underlying test science. It also explains why buyers can sometimes multi-home: keeping an existing diagnostics vendor while layering Color on top is often easier than replacing every assay pathway outright.
  claimRefs:
  - CP015
  - CP017
  - CP018
  - CP019
  - CP020
