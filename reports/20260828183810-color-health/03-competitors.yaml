- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Company
  - Public pricing visibility
  - Packaging model
  - What is included publicly
  - What remains unknown
  - Implication
  rows:
  - - Color
    - Low
    - Enterprise program / population contract
    - ROI framing, integrated clinical workflow, partnerships
    - Realized per-member pricing, renewal discounts, implementation fees
    - Sales execution matters more than list price
  - - Tempus
    - Low
    - Diagnostics plus data/applications
    - Segment revenue disclosure and contract value
    - Per-account pricing and enterprise bundling terms
    - Scaled cross-sell can pressure smaller rivals
  - - Guardant
    - Low
    - Per-test / screening program
    - Named products and test categories
    - Contract terms with employers or plans
    - Can compete narrowly on high-value tests
  - - Foundation Medicine
    - Low
    - Per-test diagnostic model
    - Portfolio, turnaround times, regulatory status
    - Net pricing, discounts, and enterprise bundles
    - Therapy-selection depth may justify premium economics
  - - Myriad
    - Low to medium
    - Reimbursed test plus patient-support model
    - Counseling and majority-no-OOP messaging for MyRisk
    - Net realized payer mix and enterprise deal structure
    - Reduces adoption friction without transparent list price
  - - Natera
    - Low
    - Reimbursed assay model
    - Coverage messaging and paired-test offer
    - Net pricing and employer/plan program terms
    - Coverage-led go-to-market can accelerate wedge adoption
  - - GRAIL
    - Low
    - Screening-test package
    - Galleri brand and limitations disclosure
    - Employer pricing and repeat-use terms
    - Novelty does not remove reimbursement uncertainty
  - - Labcorp / Quest
    - Low
    - Bundled diagnostics contract
    - Broad continuum and national lab infrastructure
    - Cross-subsidies and oncology-specific margins
    - Incumbents can use bundle economics defensively
  notes: Public pricing is sparse across the field, so the comparison focuses on packaging logic and disclosed commercial posture rather than pretending to know exact rates.
