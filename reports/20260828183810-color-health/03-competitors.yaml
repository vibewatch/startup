callouts:
- calloutType: strength
  title: Color competes from a workflow wedge many labs still lack
  body: |-
    Color’s best strategic position is not “better assay science than everyone else.” It is the combination of screening activation, care navigation, and employer/payer workflow ownership. That wedge stays meaningful even when buyers continue using third-party diagnostics.
  claimRefs:
  - CP002
  - CP015
  - CP020
  - CP025
- calloutType: risk
  title: Scale and channel power sit mostly outside Color today
  body: |-
    Public evidence suggests that the biggest competitors already control more clinician demand, broader lab distribution, or stronger reimbursement muscle. If Color cannot keep converting workflow breadth into measurable ROI, those forces can compress both growth and pricing power.
  claimRefs:
  - CP012
  - CP023
  - CP028
  - CP035
