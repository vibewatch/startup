  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim or risk
  - Threat
  - Severity
  - Why it matters
  - Mitigation or diligence ask
  rows:
  - - Enterprise workflow breadth
    - Incumbents copy navigation layer
    - High
    - Could compress pricing if workflow becomes table stakes
    - Obtain win/loss data showing workflow-led switching
  - - Employer / payer orientation
    - Benefits platforms influence vendor choice
    - Medium
    - Channel partners can shape distribution power
    - Audit partner-sourced pipeline and renewal rates
  - - Integration stickiness
    - Buyers internalize care navigation
    - High
    - Internal build is often the real alternative
    - Request implementation ROI versus internal baseline
  - - Clinical trust moat
    - Therapy-selection leaders outclass Color in assay credibility
    - High
    - Physician preference can cap product expansion
    - Clarify when Color partners rather than competes
  - - Capital discipline
    - Genomics peers repeat Invitae pattern
    - High
    - Debt and burn can destroy otherwise strong science businesses
    - Underwrite runway and cash needs conservatively
  - - Narrow-wedge entrants expanding
    - MCED or MRD players move upstream
    - Medium
    - Indirect competition can grow over time
    - Track roadmap and partnership moves of adjacent vendors
  - - Incumbent-lab bundling
    - Quest / Labcorp use pricing power
    - High
    - Bundling can lower buyer switching appetite
    - Ask for evidence of wins against bundled lab contracts
  - - Opaque market data
    - Public price and outcome gaps persist
    - Medium
    - Makes definitive ranking hard
    - Collect direct customer references and pricing sheets
  notes: Risks are ordered by residual strategic importance, not by certainty. The register focuses on how each threat could actually unwind Color’s thesis.
