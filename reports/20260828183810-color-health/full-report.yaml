  - id: FV002
    title: Valuation sensitivity on the $219.5M revenue proxy
    type: bar
    layout: wide
    summary: >-
      Illustrative enterprise values in USD millions if the reviewed 2024 revenue proxy is valued at selected multiple
      bands.
    data:
      items:
        - label: 3.5x public-software floor
          value: 768
        - label: 6x low premium HealthTech
          value: 1317
        - label: 10x strong hybrid premium
          value: 2195
        - label: 12x top end of reviewed premium M&A band
          value: 2634
        - label: 18x public premium comp lens
          value: 3951
        - label: ~21x implied by 2021 mark
          value: 4600
    approximationNotes: >-
      Values use the third-party 2024 revenue estimate of $219.5M and simple EV-to-revenue math; they illustrate
      sensitivity, not a full valuation model.
