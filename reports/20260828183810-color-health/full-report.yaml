      - number: '1.2'
        title: Leadership depth and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership depth is one of the main reasons Color can credibly pitch itself as more than a software
              vendor. Othman Laraki remains the central executive and public face of the company, and his background in
              product leadership at Google plus platform scaling at Twitter helps explain why Color still frames care
              delivery as an infrastructure and workflow problem. But the current team extends well beyond Laraki.
              Caroline Savello leads strategy and outcomes in cancer, Rebecca Miksad brings deep clinical and
              data-science credibility from Flatiron Health, Josh Sturm owns commercial expansion, Dany Matar runs
              operations, Jake Hargraves oversees legal matters, and Lee Mallabone leads engineering. This mix supports
              Color’s current model: it needs enterprise distribution, oncology-grade clinical oversight, regulatory
              discipline, and software execution simultaneously. The trade-off is key-person dependence. Laraki’s
              biography, financing quotes, and strategy commentary are deeply embedded in Color’s narrative, so
              executive continuity remains a meaningful diligence issue even with a broader bench in place.
