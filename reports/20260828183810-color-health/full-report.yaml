      - number: '1.3'
        title: Capital history, scale markers, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Color’s capital history shows both impressive fundraising leverage and meaningful opacity. The last formal
              company-announced valuation came in November 2021, when Color raised a $100 million Series E at a $4.6
              billion valuation. Official disclosure from that announcement said total financing had reached $378
              million. Since then, no later public round was surfaced on Color’s own site, so investors still anchor on
              a financing mark that was set during the COVID-era health-tech boom. Third-party databases disagree on the
              lifetime total: Tracxn now aggregates $491 million across eight rounds, while GetLatka shows only $267
              million across two major rounds. That discrepancy does not invalidate the Series E event itself, but it
              does reduce confidence in “total raised” as a clean headline figure. Revenue is similarly opaque. The only
              current number surfaced in accessible third-party data was GetLatka’s $219.5 million 2024 revenue
              estimate, which is useful as directional context but not a substitute for audited financials. Headcount
              estimates cluster in the low-to-mid 600s, suggesting a sizeable operating footprint despite the 2023
              layoffs.
