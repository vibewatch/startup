      - number: '4.3'
        title: Cost structure, capital adequacy, and category benchmarks
        blocks:
          - type: paragraph
            body: >-
              Cost structure is where the business stops looking like lightweight software. Color’s model clearly
              depends on clinicians, testing operations, member outreach, physician oversight, data integration, and
              follow-up navigation. That makes the gross-margin story fundamentally hybrid. The company may be less
              capital-intensive than diagnostics players that depend more heavily on proprietary assay menus,
              manufacturing, or deep lab commercialization, but it is still materially service-delivery intensive. The
              2023 layoff of 300 employees is the strongest public signal that management had to resize the company
              after COVID testing demand receded. For capital adequacy, the public evidence remains frustratingly
              incomplete. TechCrunch reported a $167 million Series D in early 2021, and Color’s own Series E release
              later that year said total financing reached $378 million at a $4.6 billion valuation. But there is no
              reviewed public disclosure of current cash on hand, debt, burn, or runway. Public comparators help frame
              what might be required: Tempus ended 2025 with $759.7 million of cash and marketable securities and still
              posted a sizable net loss, underscoring how expensive clinical-data hybrids can remain even at scale.
