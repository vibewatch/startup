              - CV022
      - number: '8.3'
        title: Comparable set and public-market signals
        blocks:
          - type: paragraph
            body: >-
              The comparable set is unusually wide, which is itself informative. Tempus and Natera show what the market
              will pay for fast-growing, data-rich oncology platforms with clear revenue disclosures and strong investor
              belief in long-term workflow leverage. Guardant shows how much value can accrue to a clinically validated
              screening leader once reimbursement and guideline momentum become visible. At the other end of the
              spectrum, Myriad shows how a molecular-testing company can trade at a deeply compressed revenue multiple
              when growth weakens and payer friction rises. Exact Sciences is better treated as a strategic-scale
              reference than as a clean current public comp because it moved into a transaction context in 2026. Invitae
              provides the adverse case: category excitement alone does not protect equity holders when
              commercialization and capital efficiency break down.


              For Color, that means comparable analysis supports strategic relevance, but not automatic premium pricing.
            claimRefs:
