    title: Valuation / return range across scenarios
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull ranges in USD billions based on the reviewed revenue proxy, market bands, and disclosure
      quality.
    data:
      items:
        - label: Bear case valuation
          low: 0.8
          base: 1.1
          high: 1.4
          unit: $B
        - label: Base case valuation
          low: 1.6
          base: 2
          high: 2.4
          unit: $B
        - label: Bull case valuation
          low: 3.2
          base: 4
          high: 4.8
          unit: $B
    approximationNotes: >-
      Ranges are editorial estimates, not a DCF. They reflect scenario-specific assumptions about revenue quality,
      growth, and the appropriate multiple band.
