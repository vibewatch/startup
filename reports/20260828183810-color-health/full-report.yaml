      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal stack is the clearest hard-risk layer. HIPAA privacy, security,
              breach-notification, and cloud-business-associate obligations all apply to a company with Color’s care
              model if it is creating, receiving, maintaining, or transmitting ePHI across internal systems and
              partners. The HHS guidance is explicit that cloud providers maintaining ePHI are business associates even
              when they only store encrypted data, which means Color’s compliance burden extends into vendor
              architecture and contractual controls. Lab regulation is also current, not hypothetical. Color’s
              HPV-screening materials explicitly reference an in-house CAP-accredited, CLIA-certified lab, and broader
              FDA oversight of diagnostics and LDT frameworks remains a live policy variable. ASCO certification is a
              real mitigation because it signals quality systems, but it is not a blanket shield against privacy, lab,
              or clinical-operational failure. The same is true of formal policies generally: they lower risk, but they
              do not erase operational exposure during incidents, audits, or scale-up periods.
            claimRefs:
