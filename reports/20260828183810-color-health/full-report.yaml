companyProfile:
  summary: >-
    Color Health is a private healthcare infrastructure company headquartered in Burlingame, California, founded in 2013
    and now centered on an integrated Virtual Cancer Clinic spanning screening, diagnosis support, treatment management,
    and survivorship. After scaling COVID-era public-health infrastructure and then cutting about 300 jobs in 2023 as
    testing demand receded, the company refocused on employers, health plans, public-sector programs, and oncology
    workflows. Color's last directly confirmed financing mark is a $100M Series E at a $4.6B valuation in November 2021;
    the best current public revenue anchor is a third-party 2024 estimate of $219.5M. The OpenAI collaboration and broad
    patient reach show real strategic relevance, but current economics remain under-disclosed.
  foundedDate: '2013-01-01'
  founders:
    - name: Othman Laraki
      role: Co-founder and CEO
      background: Former product leader at Google, co-founder of MixerLabs, and former Twitter vice president of product.
      claimRefs:
        - CO009
        - CO010
  foundingLocation: Burlingame, California, USA
  headquarters: Burlingame, California
  productSummary: >-
    An integrated Virtual Cancer Clinic that combines cancer-risk assessment, screening access, diagnosis support,
    active treatment management, expert medical opinion, survivorship, and clinician-supervised AI copilot workflows.
  customerFocus: >-
