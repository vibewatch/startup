              Detection, Active Treatment Management, and Survivorship pages are not abstract promises; they describe
              distinct use cases, handoffs, and measurable interventions. Expert Medical Opinion is built into care
              instead of added as an after-the-fact review. Cancer Connect adds peer and caregiver support. Collective
