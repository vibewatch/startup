figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Color’s trajectory runs from genetics launch to COVID public-health scale, then into a cancer-first virtual care
      and AI workflow model.
    data:
      items:
        - label: Founded
          date: '2013'
          detail: Color is formed around making genetics and preventive care more accessible.
          tone: positive
        - label: Public launch
          date: 2015-03
          detail: Color Genomics launches with an affordable hereditary cancer testing narrative.
          tone: positive
        - label: COVID lab buildout
          date: 2020-03
          detail: Company builds a CLIA-certified COVID lab within weeks of Bay Area shelter orders.
          tone: positive
        - label: San Francisco testing site
          date: 2020-04
          detail: Color and San Francisco launch one of the first high-capacity public testing sites.
          tone: positive
        - label: Series E
          date: '2021-11-09'
          detail: Raises $100M at a $4.6B valuation and highlights nearly 1,000 institutional partners.
          tone: positive
        - label: All of Us role
          date: 2021-2025
          detail: Serves as a lead partner and sole genetic-counseling provider in the NIH All of Us program.
          tone: positive
        - label: Layoffs
          date: 2023-03
          detail: Cuts about 300 roles while rolling back COVID-testing exposure.
          tone: negative
        - label: OpenAI collaboration starts
          date: '2023'
          detail: Begins building oncology copilots with OpenAI.
          tone: positive
        - label: Carrum partnership
          date: 2024-06
          detail: Adds value-based treatment pathways to employer cancer programs.
          tone: positive
        - label: Copilot rollout
          date: 2024-06
          detail: Announces 200,000+ patient-case rollout for AI care-plan support.
          tone: positive
        - label: MSK Direct collaboration
          date: 2024-07
          detail: Pairs Color’s 50-state model with Memorial Sloan Kettering specialist access.
          tone: positive
        - label: ASCO Certified milestone
          date: 2025-08
          detail: Publicizes first-virtual-clinic ASCO Certified designation.
          tone: positive
    approximationNotes: >-
