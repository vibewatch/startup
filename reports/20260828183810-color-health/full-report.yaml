      - number: '8.2'
        title: Valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Valuation work has to start from a stale but real anchor: Color’s last directly confirmed financing mark
              is the November 2021 Series E at $4.6 billion. That mark was set in a very different market. GetLatka’s
              2024 revenue estimate of $219.5 million provides the best current public denominator, but it is still a
              third-party estimate rather than audited disclosure. If that figure is directionally right, the old
              valuation implies roughly 21x revenue—well above the 6x to 12x premium HealthTech M&A band surfaced in
              reviewed 2026 market commentary and also above the mid-single-digit public software median. That does not
              mean the old price is impossible, but it does mean it now requires a stronger proof burden.


              Entry discipline therefore matters. The question is less whether Color deserves a premium to slower-growth
              testing vendors and more whether it deserves anything close to a 2021 boom-era premium without refreshed
              financial disclosure. On public evidence alone, the answer is no.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
