          label: Integrated Virtual Cancer Clinic with employer and payer channels
        - id: ai
          label: Clinician-in-the-loop AI for screening and treatment-workup support
        - id: scale
          label: Real operational reach and partner proof; 7M+ patients in independent coverage
        - id: opacity
          label: No audited revenue, margins, retention, or current cap-table disclosure
