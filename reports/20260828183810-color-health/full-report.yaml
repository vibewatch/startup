              7 million patients served, nearly 1,000 partner organizations, more than 100 major employers and
              universities, and healthcare programs deployed in 16 states plus federal initiatives. Those data say the
              company can reach large populations. They do not say how many of those organizations are active
              cancer-program customers today, how many renew, or what their contract values look like. The current
              customer-outcome pages improve the story by showing specific interventions—18-day diagnosis acceleration,
              24-hour oncologist review, caregiver support sessions, and treatment-related savings claims—but most of
              that evidence is case-based rather than cohort-based. That is enough to establish relevance, not enough to
