      - number: '3.2'
        title: Competitor classes and the closest named rivals
        blocks:
          - type: paragraph
            body: >-
              Among named companies, Tempus appears to be the closest scaled integrated competitor. Its 2025 results
              show a large diagnostics business plus a meaningful data-and-applications segment, which is much nearer to
              Color’s “infrastructure plus intelligence” thesis than a pure lab model. Guardant, Foundation Medicine,
              Myriad, Natera, GRAIL, and Exact Sciences each compete through narrower but sometimes deeper product
              wedges. Guardant is formidable in blood-based screening and liquid-biopsy workflows. Foundation Medicine
              is especially strong in therapy selection and companion diagnostics. Myriad is strong in hereditary risk
              and counseling-supported testing. Natera has a sharp MRD wedge. GRAIL has a high-ambition MCED screening
              wedge, albeit with explicit test limitations. Exact Sciences brings brand strength in screening and
              hereditary/treatment guidance. Labcorp and Quest matter because they can bundle oncology into
              long-standing diagnostic relationships. Invitae matters less as an ongoing competitor and more as a
              cautionary example of what happens when a broad genetics platform outruns its capital structure.
            claimRefs:
              - CP003
