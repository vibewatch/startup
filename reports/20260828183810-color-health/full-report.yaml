      - CV040
      - CV041
      - CV042
      - CV043
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scorecard on a 1-10 scale; strong on strategic quality, weak on valuation support and financial
      transparency.
    data:
      items:
        - label: Market opportunity
          value: 8
          unit: /10
          note: Large employer and payer pain point around cancer cost and complexity.
        - label: Product differentiation
          value: 7
          unit: /10
          note: Integrated cancer workflow plus clinician-supervised AI is directionally distinctive.
        - label: Operational proof
          value: 7
          unit: /10
          note: Real partners, patient scale, and deployment evidence exist.
        - label: Financial transparency
          value: 3
          unit: /10
          note: Revenue, margin, burn, retention, and cap-table disclosure remain weak.
        - label: Comparable support
          value: 4
          unit: /10
          note: Comps validate strategic relevance more than they validate the old price.
        - label: Downside protection
          value: 3
          unit: /10
          note: Current cash, preferences, and financing timing are not public.
        - label: Valuation support
          value: 3
          unit: /10
          note: The 2021 mark looks stretched on reviewed 2026 evidence.
    approximationNotes: >-
      Scores are analyst judgments based on retained public evidence as of 2026-08-28; they are not management-reported
      KPIs.
    claimRefs:
      - CV013
      - CV014
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
