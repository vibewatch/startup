  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization logic, and recognition complexity
        blocks:
          - type: paragraph
            body: >-
              Color’s public financial story starts with buyer structure, not a published price sheet. The company’s
              current surfaces show monetizable programs sold to employers, health plans, public-sector institutions,
              and populations routed through its Virtual Cancer Clinic. That implies a hybrid revenue stack: enterprise
              program fees, testing-related economics, implementation and data integration work, and longitudinal
              navigation or clinical-support services. Importantly, the offering is no longer best understood as
              direct-to-consumer genomics. TechCrunch’s 2021 funding coverage and Color’s current site both point toward
              a business built around distributed healthcare infrastructure and clinical workflow delivery. The absence
              of transparent list pricing is itself informative. This is a consultative sale framed around avoided
              cancer costs, stage shift, and operational outcomes, not a low-friction transaction. Revenue recognition
              is therefore likely more complex than a single PMPM or per-test line item, because the underlying service
              combines software, clinical oversight, diagnostics logistics, and follow-up coordination.
