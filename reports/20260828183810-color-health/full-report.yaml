  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Color’s market should not be framed as a single monolithic “oncology” bucket. The most useful boundary is
              a layered one. At the broadest level, the company sits inside precision oncology because its workflows
              touch risk stratification, genomics-informed screening, and guideline-based diagnostics. At the practical
              commercial level, though, Color is competing in the market for integrated cancer-care infrastructure sold
              to large populations: employers, health plans, unions, and public agencies that want better screening
              completion, faster diagnosis, and lower downstream treatment costs. This distinction matters. Color is not
              trying to own therapeutic revenue, infusion-center economics, or hospital inpatient stays. Instead, it is
              inserting itself into the high-friction workflow layer that precedes and surrounds those spend pools.
              Status-quo substitutes remain widespread, including fragmented PCP outreach, health-plan case management,
              regional cancer-center referral networks, and point solutions that handle only one moment of the journey.
              That fragmented status quo is exactly the problem Color is using to justify an integrated model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM023
              - CM039
