  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, and payer
        blocks:
          - type: paragraph
            body: >-
              Color’s customer base should be segmented by channel and workflow responsibility, not just by logo type.
              The company’s current materials point to five practical groups: employers, health plans, unions,
              public-sector institutions, and research or national-health initiatives. In most of these deployments, the
              economic buyer is an institution, the end user is a member, employee, patient, or participant, and the
              economic benefit accrues to a payer or sponsor trying to reduce cancer costs through earlier detection and
              better coordination. That structure is important because it means adoption is enterprise and population
              based, not consumer self-serve. It also means some of the strongest customer proof comes from channels and
              embedded programs rather than from a classic SaaS customer-count metric. A buyer can therefore show up as
              a benefits leader, medical-management team, union trustee, or public-health sponsor, while the user
              experience still feels like one continuous clinical service across settings.
