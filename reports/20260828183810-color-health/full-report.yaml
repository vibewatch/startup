            body: >-
              The strongest technical evidence comes from Color’s public description of how it applies AI inside those
              workflows. The company’s mammography-access initiative describes an AI agent that collects patient
              history, evaluates screening eligibility, and creates structured information for clinician review. Its
              later Large Language Expert architecture goes much deeper, describing a hybrid system that first distills
              guidelines into explicit clinical decision factors and Boolean logic, then uses LLMs in a constrained
              question-answering role before deterministic evaluation occurs. That is a meaningfully more specific
              architecture than generic “AI copilot” marketing. It also explains how Color is trying to operationalize
              guideline-driven oncology care at scale. The architecture still depends on human clinicians, but that
              dependency is intentional: the system is designed to produce reasoning traces, citations, and inspectable
              outputs that clinicians can validate or override. In product terms, the technology is trying to
