  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk frame
        blocks:
          - type: paragraph
            body: >-
              Color’s risks should be ranked as if the company were already a scaled virtual oncology operator, not as
              if it were a light-touch software vendor. The highest-severity exposures cluster around privacy and
              regulatory compliance, patient-safety and operational execution, partner dependency, and financial
              opacity. The company handles highly sensitive cancer and genetics-adjacent health data, uses AI inside
              clinical workflows, and coordinates care that often depends on third parties it does not control. That
              combination is powerful, but it also means failure can travel quickly from one domain into another. A
              privacy or cloud-compliance lapse can become a customer and financing problem. A slow or error-prone
              handoff to local providers can become both a quality and retention problem. The risk lens therefore has to
              focus on transmission: how one weakness propagates across care delivery, customer trust, and capital
              needs. This is why residual-risk ranking matters more here than a generic startup risk checklist used
              elsewhere.
            claimRefs:
