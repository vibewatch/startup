  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacencies, incumbents, and status quo'
        blocks:
          - type: paragraph
            body: >-
              Color does not face one neat peer set. Its competitive field includes direct workflow players, diagnostics
              companies with adjacent ambitions, incumbent national labs, provider-led cancer centers, and the status
              quo of internal navigation or case-management teams. That matters because a buyer does not need to choose
              “Color versus one named startup.” In many accounts, the alternative is to stitch together existing plan
              workflows, point solutions, and local specialists. The clearest landscape split is between integrated
              enterprise oncology programs and diagnostics-first companies. Color sits in the first group. Most public
              competitors sit in the second, monetizing through ordered tests, reimbursed assays, or provider-driven
              utilization. That makes overlap real but partial. Color is selling a buyer-facing operating layer for
              cancer screening and care management; several rivals are selling clinician-facing tests that can later
              expand into adjacent workflow territory. The strategic question is therefore not only who has the best
              science, but who controls the workflow where purchasing and patient action actually happen.
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP016
