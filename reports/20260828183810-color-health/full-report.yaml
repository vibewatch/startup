chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and business model
        blocks:
          - type: paragraph
            body: >-
              Color Health is currently presenting itself as a cancer-care infrastructure company rather than the
              consumer genomics brand with which it first entered the market. Its public site emphasizes a “Virtual
              Cancer Clinic” that spans prevention, early detection, diagnosis support, active treatment management,
              survivorship, and return-to-work support. The buyer set is broad: employers, health plans, unions,
              consultants, and public-sector institutions are all addressed explicitly in current navigation and
              solution pages. That positioning matters because it shows that Color is not selling a narrow testing
              product anymore; it is selling an operating model that combines digital workflow, care coordination,
              oncologist-led clinical review, and benefit integration. The headquarters remains Burlingame, California,
              and the company still leans heavily on the idea that access, speed, and direct clinical management can
              lower both cancer costs and cancer care fragmentation. The overview sources also show that Color’s
              operating story now combines legacy population-health infrastructure with a sharply focused
              cancer-services narrative.
