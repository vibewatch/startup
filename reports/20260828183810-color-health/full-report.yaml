      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. On the positive side, Color has real buyer relevance, a credible
              enterprise health infrastructure story, and a revenue estimate large enough to show this is more than a
              concept-stage company. On the negative side, almost every underwriting-grade metric remains missing:
              realized pricing, segment revenue mix, gross margin, CAC, payback, retention, concentration,
              working-capital timing, and current cash runway. Even the funding picture is not perfectly reconciled
              across sources, and the only explicit profitability language in reviewed evidence comes from a 2021
              financing announcement that predates layoffs and business reset. The right conclusion is not that Color is
              financially weak; it is that the public evidence is too thin to prove strength with confidence. A
              disciplined investor should view the company as commercially credible but financially under-disclosed,
              with diligence priority on margin structure, retention, concentration, and post-COVID capital needs.
