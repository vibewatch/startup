      - number: '2.2'
        title: 'Sizing lenses: broad TAM, narrow screening economics, and current SOM'
        blocks:
          - type: paragraph
            body: >-
              The public data supports multiple TAM lenses but not one perfect underwriting number. The broadest
              external lens comes from Mordor Intelligence, which places the precision oncology market at $127.68
              billion in 2026 and projects it to reach $201.27 billion by 2031. That figure includes therapeutics and
              diagnostics, so it overstates the portion directly available to Color. A narrower, still meaningful lens
              comes from Color’s own market-economics analysis, which cites roughly $43 billion in annual U.S.
              cancer-screening costs and more than $250 billion across screening, treatment, and survivorship. Neither
              figure maps neatly to Color’s actual serviceable market, but together they define the economic zone in
              which the company operates. Using GetLatka’s $219.5 million 2024 revenue estimate as a rough SOM anchor,
              Color appears tiny versus either lens: about 0.17% of Mordor’s global TAM and roughly 0.5% of the $43
              billion U.S. screening-cost pool. That is why the market can still be large without implying that Color is
              already near saturation.
