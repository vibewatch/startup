      - number: '3.4'
        title: Moat durability, encroachment risk, and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              Moat durability is real but conditional. Color benefits from workflow integration, employer and payer
              selling, and partnerships that connect screening to downstream treatment decisions. Those attributes are
              harder to replicate than a one-off test menu, but they are not impregnable. Large labs can bundle
              diagnostics into existing relationships. Provider-centered platforms like Tempus can move upstream over
              time. Benefits platforms can influence vendor selection. And sophisticated plans may internalize parts of
              the navigation layer. The strongest adverse signal is Invitae’s bankruptcy: genomics markets can punish
              companies that lack disciplined monetization or financing resilience. The most balanced conclusion is that
              Color is differentiated enough to stay strategically relevant and win in selected segments, but not yet
              dominant enough to assume outsized pricing power or immunity from adjacent encroachment. In other words,
              Color has a usable wedge, not a closed battlefield.
