  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Color’s product is no longer well described as a genetics company or a single cancer-screening vendor. In
              workflow terms, it is a virtual cancer-care operating model made up of multiple modules: early detection,
              active treatment management, survivorship care, Expert Medical Opinion, Cancer Connect, and the Virtual
              Cancer Clinic that ties those modules together. This matters because the company is selling a longitudinal
              care layer rather than a single encounter. The workflow starts before diagnosis with risk identification
              and screening activation, moves through abnormal-result follow-up and diagnosis support, continues into
              active treatment management, and then extends into survivorship and caregiver support. The Virtual Cancer
              Clinic is the coordinating surface across that journey, but it does not claim to replace local care
              settings. Instead, it appears designed to bring specialist review, virtual support, and structured
              oncology workflows around the in-person system. The result is a modular care-delivery platform, not a
              one-off product.
