      - number: '1.4'
        title: Milestones, pivot history, and present-day credibility
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that repeatedly repurposed its infrastructure around whatever
              healthcare bottleneck seemed most urgent. Color began with genomics and hereditary cancer testing, scaled
              hard into COVID testing and vaccination programs during the pandemic, then cut about 300 jobs in early
              2023 as pandemic demand receded and management refocused on government telehealth infrastructure and
              prevention tools. The current chapter of that evolution is explicitly cancer-first. The website,
              partnership pages, and recent blog posts now center on faster diagnosis, better screening adherence,
              active treatment management, and survivorship. Strategic partnerships reinforce that shift: ACS adds
              education and credibility, MSK Direct adds specialist access, Carrum adds value-based treatment pathways,
              Collective Health adds benefits-system integration, and All of Us plus WISDOM preserve the
              genomics-and-research lineage. The OpenAI collaboration is the clearest sign of the new direction. Rather
              than marketing generic AI automation, Color is applying AI to highly specific oncology workflows such as
              screening-plan generation and pre-treatment workups, while keeping clinician oversight at the center. That
              combination of pivot history, operating breadth, and unresolved disclosure gaps makes Color intriguing but
              still diligence-heavy.
