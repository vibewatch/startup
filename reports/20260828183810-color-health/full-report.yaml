      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Final diligence should focus on the specific data that would most quickly collapse the valuation
              distribution. First, investors need audited GAAP financials plus recent management accounts to test
              whether the GetLatka revenue estimate is directionally right and to understand gross margin, burn, and
              working-capital demands. Second, they need revenue quality evidence: customer concentration, renewal
              behavior, retention, and segment mix across employers, health plans, public-sector programs, and any
              residual episodic work. Third, they need the current cap table, preference stack, and cash position
              because liquidation terms can erase expected upside even if enterprise value looks reasonable.


              Until those issues are resolved, the right stance is disciplined curiosity. Color has enough strategic
              proof to stay on the watchlist, but not enough valuation proof to justify chasing the old price.
            claimRefs:
              - CV043
              - CV049
              - CV050
              - CV051
              - CV052
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV043
              - CV048
              - CV051
              - CV052
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not pay for the 2021 halo
            body: >-
              Color looks strategically relevant and potentially valuable, but the public evidence set still supports
              company quality more clearly than it supports the old price.
            calloutType: recommendation
            claimRefs:
              - CV044
              - CV047
          - type: callout
            title: The anti-thesis is opacity plus hybrid economics
            body: >-
              If Color’s current revenue base is less recurring or lower margin than outside investors infer, the
              valuation can compress quickly toward hybrid-services ranges.
            calloutType: risk
            claimRefs:
              - CV013
              - CV041
              - CV042
          - type: callout
            title: A data room could move the call fast
            body: >-
              Audited financials, retention, and cap-table disclosure would likely narrow the valuation range more than
              any additional high-level narrative about market size or AI positioning.
            calloutType: assumption
            claimRefs:
              - CV045
              - CV051
              - CV052
