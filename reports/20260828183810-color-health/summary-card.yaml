  topStrengths:
    - >-
      Integrated Virtual Cancer Clinic spans screening through survivorship with a broader care surface than many
      point-solution competitors.
    - >-
      Real deployment proof exists through broad patient reach, named partners, and multi-channel distribution into
      employers and health plans.
    - >-
      Clinician-in-the-loop OpenAI workflows add differentiated oncology reasoning support rather than generic AI
