callouts:
- calloutType: strength
  title: Customer traction is stronger than a raw logo list would suggest
  body: |-
    Color’s best proofs are embedded deployment surfaces—health-plan access, platform integrations, national initiatives, and end-to-end partner pathways—not just brand-name logos. That makes the customer base more operationally credible than a simple customer-count snapshot.
  claimRefs:
  - CU007
  - CU009
  - CU010
  - CU014
  - CU033
- calloutType: risk
  title: Retention and concentration remain the core customer diligence gaps
  body: |-
    The public record proves that Color can deploy and produce strong case-level outcomes. It does not prove how sticky those accounts are, how concentrated revenue is, or how much current adoption still depends on a small set of channels or historical COVID-era relationships.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU034
