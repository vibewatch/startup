company:
  name: Color Health
chapter:
  number: 6
  title: Customers
  summary: |-
    Color’s customer base is clearly real, but it is best understood as a channel-driven, enterprise-population business rather than a simple count of direct employer logos. The strongest current proofs come from health-plan and platform partners like IBX and Collective Health, employer-treatment channel expansion via Carrum, and national or research-scale programs such as NIH All of Us and WISDOM. Public evidence proves adoption breadth and deployment credibility far better than it proves retention, concentration, or renewal durability. The chapter’s bottom line is that Color has meaningful customer traction with credible expansion paths, but still needs management data to underwrite stickiness.
sections:
- id: SU001
  title: Customer segmentation by buyer, user, and payer
  body: |-
    Color’s customer base should be segmented by channel and workflow responsibility, not just by logo type. The company’s current materials point to five practical groups: employers, health plans, unions, public-sector institutions, and research or national-health initiatives. In most of these deployments, the economic buyer is an institution, the end user is a member, employee, patient, or participant, and the economic benefit accrues to a payer or sponsor trying to reduce cancer costs through earlier detection and better coordination. That structure is important because it means adoption is enterprise and population based, not consumer self-serve. It also means some of the strongest customer proof comes from channels and embedded programs rather than from a classic SaaS customer-count metric. A buyer can therefore show up as a benefits leader, medical-management team, union trustee, or public-health sponsor, while the user experience still feels like one continuous clinical service across settings.
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU022
  - CU023
  - CU030
  tableRefs:
  - TU001
- id: SU002
  title: Named customer proof and current deployment surfaces
  body: |-
    The named-customer proof is real, but uneven in quality. IBX is one of the clearest current health-plan proofs, because the partnership explicitly gives self-funded employers access to Color’s ASCO-certified Virtual Cancer Clinic and publishes concrete output metrics around engagement, screening adherence, diagnosis speed, and treatment savings. Collective Health gives a different kind of proof: not clinical outcomes, but technical and commercial maturity through eligibility feeds, SSO, utilization-data ingestion, and invoice-or-claims billing. Carrum adds downstream treatment validation by connecting Color’s cancer program to value-based Centers of Excellence. Public-sector and research relationships such as NIH All of Us and the WISDOM Study are also meaningful, especially for showing longitudinal, distributed deployment capability, but they should be weighted separately from recurring commercial revenue. Additional customer-facing pages around HPV screening and oncofertility also suggest that Color is still broadening the set of sponsor-visible use cases it can bring into existing accounts. That matters because expansion inside an existing sponsor can be easier than winning a net-new logo.
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU029
  - CU033
