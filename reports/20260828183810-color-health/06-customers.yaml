- id: TU003
  title: Named Customer Proof Table
  columns:
  - Customer / partner
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome or proof
  - Limitation
  rows:
  - - Independence Blue Cross (IBX)
    - Health plan / ASO channel
    - Virtual Cancer Clinic access for self-funded employers
    - Production / current partnership
    - Publishes engagement, adherence, diagnosis-speed, and treatment-savings metrics
    - No renewal or covered-life count
  - - Collective Health
    - Benefits platform
    - Eligibility, SSO, utilization and billing integration
    - Production / integrated
    - Shows real deployment plumbing and billing paths
    - Does not prove member-level outcomes
  - - Carrum Health
    - Employer treatment channel
    - End-to-end cancer program plus COE referrals
    - Production / current partnership
    - Extends from screening into treatment pathways
    - Partner proof rather than direct employer cohort disclosure
  - - NIH All of Us
    - National health initiative
    - Researcher workbench, genomics, secure dataset infrastructure
    - Production / ongoing program
    - Validates large-scale operational trust
    - Not a recurring commercial customer in the same sense
  - - WISDOM Study
    - Research / screening program
    - Longitudinal personalized screening study
    - Production / ongoing study
    - High participant scale with annual follow-up
    - Not a direct revenue analogue
  - - Public-sector / school systems
    - Government / institutional
    - Distributed testing and public-health programs
    - Historical production scale
    - Proves execution with distributed populations
    - Historical COVID-era volume not equal to current cancer demand
  notes: Named proof is strongest where Color is embedded into a real delivery surface or partner workflow.
