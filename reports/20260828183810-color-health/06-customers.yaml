  - FU002
- id: SU004
  title: Expansion logic, concentration risk, and final customer verdict
  body: |-
    The expansion logic is compelling: once Color enters through screening, benefit navigation, or health-plan distribution, it can expand into diagnosis support, active treatment management, Expert Medical Opinion, survivorship, and return-to-work support. That creates a plausible land-and-expand motion. But the same channel-heavy strategy introduces risk. Public evidence does not reveal concentration, renewal rates, NRR, or churn. Much of the strongest proof is indirect partner proof rather than direct customer cohort disclosure. And some of Color’s historical operating scale came from COVID-era demand that should not be mapped one-for-one to current cancer revenue. The best overall read is that Color has a real customer base and several credible routes to expansion, but the durability of that base remains under-disclosed. That is the line between traction and full underwriting confidence. The missing data are not cosmetic; they determine whether visible adoption converts into durable revenue quality over time.
  claimRefs:
  - CU021
  - CU024
  - CU028
  - CU032
  - CU034
