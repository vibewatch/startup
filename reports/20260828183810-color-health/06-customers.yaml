- id: TU006
  title: Channel / Procurement Friction Table
  columns:
  - Channel or step
  - Observed friction
  - Why it matters
  - Evidence
  rows:
  - - Health-plan route
    - Must fit existing care-management programs
    - Slows adoption but can unlock large populations
    - IBX and health-plan positioning
  - - Benefits platform integration
    - Requires eligibility, SSO, and billing setup
    - Creates implementation work before scale
    - Collective Health integration detail
  - - Employer purchase
    - Needs benefits, finance, and clinical buy-in
    - Lengthens cycle and proof burden
    - Employer ROI framing
  - - Treatment-network handoff
    - Requires downstream referral trust
    - Can expand value but adds partner dependence
    - Carrum partnership
  - - Research and public-sector programs
    - Procurement and program design can be bespoke
    - Makes revenue timing lumpy and hard to compare
    - All of Us / WISDOM / public-sector materials
  - - Care delivery itself
    - Local providers still influence execution quality
    - Customer experience is partly off-platform
    - VCC and case-study pages
  notes: Procurement friction is not a reason to reject the customer story, but it does explain why public logos alone understate implementation complexity.
