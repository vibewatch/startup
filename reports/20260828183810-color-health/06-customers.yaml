  - TU003
  figureRefs:
  - FU003
- id: SU003
  title: Adoption breadth versus denominator gaps
  body: |-
    Adoption breadth is easier to prove than durability. Color’s historical scale claims are large: more than 7 million patients served, nearly 1,000 partner organizations, more than 100 major employers and universities, and healthcare programs deployed in 16 states plus federal initiatives. Those data say the company can reach large populations. They do not say how many of those organizations are active cancer-program customers today, how many renew, or what their contract values look like. The current customer-outcome pages improve the story by showing specific interventions—18-day diagnosis acceleration, 24-hour oncologist review, caregiver support sessions, and treatment-related savings claims—but most of that evidence is case-based rather than cohort-based. That is enough to establish relevance, not enough to prove retention. In other words, Color has public proof of customer impact, but not public proof of customer persistence. The distinction is especially important for valuation and concentration analysis overall.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU025
