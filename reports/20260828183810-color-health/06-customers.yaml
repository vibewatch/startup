    - Revenue share and attach rates unknown
  - - Unions and labor funds
    - Union / member / fund sponsor
    - Distributed workforce access and navigation
    - Union page and Teamsters history
    - Distinct buyer channel for workforce populations
    - Current scaled union deployments not disclosed
  - - Public sector and schools
    - Agency / citizen or student / government
    - Population-scale access programs
    - 16-state and K-12 deployment history
    - Proves distributed execution
    - Current cancer-specific mix unclear
  - - Research / national-health initiatives
    - Program sponsor / participant / grant or program sponsor
    - Risk-based screening and data infrastructure
    - WISDOM and All of Us
    - High trust and operating credibility
    - Not equivalent to recurring commercial revenue
