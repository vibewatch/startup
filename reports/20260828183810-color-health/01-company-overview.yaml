company:
  name: Color Health
chapter:
  number: 1
  title: Company Overview
  summary: |-
    Color Health is a Burlingame-based, late-stage private healthcare infrastructure company that has evolved from genetics testing and COVID-era public-health operations into an oncologist-led Virtual Cancer Clinic. The strongest verified anchors are its November 2021 $100 million Series E at a $4.6 billion valuation, its current cancer-focused enterprise and public-sector go-to-market, and its OpenAI-enabled cancer copilot rollout in 2024. The main diligence caveats are disclosure opacity around current capitalization, audited financials, and exact headcount and patient totals, plus the strategic whiplash implied by the 2023 layoff-driven pivot away from COVID testing.
sections:
- id: SO001
  title: Identity, positioning, and business model
  body: |-
    Color Health is currently presenting itself as a cancer-care infrastructure company rather than the consumer genomics brand with which it first entered the market. Its public site emphasizes a “Virtual Cancer Clinic” that spans prevention, early detection, diagnosis support, active treatment management, survivorship, and return-to-work support. The buyer set is broad: employers, health plans, unions, consultants, and public-sector institutions are all addressed explicitly in current navigation and solution pages. That positioning matters because it shows that Color is not selling a narrow testing product anymore; it is selling an operating model that combines digital workflow, care coordination, oncologist-led clinical review, and benefit integration. The headquarters remains Burlingame, California, and the company still leans heavily on the idea that access, speed, and direct clinical management can lower both cancer costs and cancer care fragmentation. The overview sources also show that Color’s operating story now combines legacy population-health infrastructure with a sharply focused cancer-services narrative.
  claimRefs:
  - CO001
  - CO002
  - CO005
