  title: Color now owns a differentiated oncology operating narrative
  body: |-
    Color’s present-day positioning is more defensible than a simple test vendor or navigation point solution. Its current combination of direct clinical oversight, enterprise distribution, oncology partnerships, and AI-enabled workflow support gives it a broader operating footprint than most cancer-benefit upstarts.
