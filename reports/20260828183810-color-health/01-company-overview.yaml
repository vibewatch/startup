  body: |-
    The 2023 layoffs, the sharp step-down from COVID infrastructure into a cancer-first model, and conflicting private-database funding totals all signal that investors are still relying on a stale 2021 financing mark without clean visibility into today’s capitalization, profitability, or sustainable scale.
