chapter:
  number: 2
  title: Market Analysis
  summary: |-
    Color’s market is best understood as the overlap between precision-oncology diagnostics, U.S. cancer-screening economics, and enterprise-grade cancer-care workflow infrastructure. The broad external TAM lens is large—Mordor estimates $127.68 billion in 2026 precision oncology spend—but Color’s actual serviceable opportunity is narrower and more workflow-driven, centered on employers, health plans, unions, and public programs trying to reduce avoidable cancer costs through earlier detection and faster follow-up. Public evidence supports strong structural demand but still leaves a major diligence gap around the exact U.S. SAM for externally managed cancer programs.
sections:
- id: SM001
  title: Market boundary and status-quo substitutes
  body: |-
    Color’s market should not be framed as a single monolithic “oncology” bucket. The most useful boundary is a layered one. At the broadest level, the company sits inside precision oncology because its workflows touch risk stratification, genomics-informed screening, and guideline-based diagnostics. At the practical commercial level, though, Color is competing in the market for integrated cancer-care infrastructure sold to large populations: employers, health plans, unions, and public agencies that want better screening completion, faster diagnosis, and lower downstream treatment costs. This distinction matters. Color is not trying to own therapeutic revenue, infusion-center economics, or hospital inpatient stays. Instead, it is inserting itself into the high-friction workflow layer that precedes and surrounds those spend pools. Status-quo substitutes remain widespread, including fragmented PCP outreach, health-plan case management, regional cancer-center referral networks, and point solutions that handle only one moment of the journey. That fragmented status quo is exactly the problem Color is using to justify an integrated model.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM023
  - CM039
  tableRefs:
  - TM001
- id: SM002
  title: 'Sizing lenses: broad TAM, narrow screening economics, and current SOM'
  body: |-
    The public data supports multiple TAM lenses but not one perfect underwriting number. The broadest external lens comes from Mordor Intelligence, which places the precision oncology market at $127.68 billion in 2026 and projects it to reach $201.27 billion by 2031. That figure includes therapeutics and diagnostics, so it overstates the portion directly available to Color. A narrower, still meaningful lens comes from Color’s own market-economics analysis, which cites roughly $43 billion in annual U.S. cancer-screening costs and more than $250 billion across screening, treatment, and survivorship. Neither figure maps neatly to Color’s actual serviceable market, but together they define the economic zone in which the company operates. Using GetLatka’s $219.5 million 2024 revenue estimate as a rough SOM anchor, Color appears tiny versus either lens: about 0.17% of Mordor’s global TAM and roughly 0.5% of the $43 billion U.S. screening-cost pool. That is why the market can still be large without implying that Color is already near saturation.
