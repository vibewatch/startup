  title: Segment / Buyer Map
  columns:
  - Segment
  - Budget owner
  - Primary pain point
  - Adoption path
  - Why Color fits
  rows:
  - - Large self-insured employer
    - VP Benefits / CFO
    - Cancer is a top cost driver; disability and productivity loss
    - Consultant review -> pilot -> full benefit launch
    - Can prove ROI on screening and diagnosis speed
  - - Regional or national health plan
    - Medical management / oncology strategy leader
    - Late-stage claims, poor follow-up, fragmented case management
    - Product evaluation -> network fit -> member workflow integration
    - Acts upstream before oncology spend spikes
  - - Union / labor fund
    - Benefits trustees
    - Member access across distributed populations
    - Trustee evaluation -> carrier coordination -> member communications
    - High-touch navigation and access support
  - - Public-sector health program
    - Public-health administrator
    - Access gaps, low screening completion, dispersed populations
    - RFP / program design -> local deployment
    - Distributed care model and telehealth logistics
