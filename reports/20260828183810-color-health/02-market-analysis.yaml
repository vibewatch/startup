    - Benefits consultant
    - Need differentiated solution set for clients
    - Preferred-vendor evaluation
    - Helps Color enter employer cycles
  - - Cancer-center partner
    - Clinical leadership
    - Need easier access and better prepared referrals
    - Co-branded partnership / referral workflow
    - Expands specialist reach without replacing provider
  - - Benefits platform partner
    - Product / partnerships leader
    - Need integrated oncology vendor in marketplace
    - Technical integration -> client enablement
    - Reduces friction through SSO and eligibility data
  - - Research / screening collaborator
    - Academic / program PI
    - Need scalable risk-based workflow and participant logistics
    - Study or program partnership
    - Extends genomics and screening credibility
  notes: Budget owners are inferred from how current public pages frame the problem to employers, plans, and partners. Actual procurement authority will vary by account.
