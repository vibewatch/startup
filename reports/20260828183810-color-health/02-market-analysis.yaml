- id: SM003
  title: Buyer segmentation and adoption path
  body: |-
    Buyer segmentation is clearer than SAM. Color’s current materials explicitly target employers, health plans, unions, consultants, and public-sector programs, but the adoption logic differs by segment. Employers care about total cost of care, disability burden, workforce disruption, and benefit ROI. Health plans care about earlier intervention, better follow-up, and avoiding late-stage claims escalation inside existing networks. Public-sector buyers are more focused on access, distributed populations, and closing screening gaps. The company’s integration footprint also matters commercially: the Collective Health partner page shows that eligibility feeds, utilization-data ingestion, SSO, and invoicing workflows can be standardized, which reduces implementation friction. Carrum’s partnership demonstrates why buyers increasingly want a linked continuum rather than separate screening and treatment products. In short, the market is not just “who has cancer risk?” but “who controls a budget and is willing to buy workflow accountability before treatment becomes catastrophic?” That makes Color more of an enterprise-health and payer-operations sale than a consumer app sale.
