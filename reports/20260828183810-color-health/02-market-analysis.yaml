- id: SM004
  title: Growth drivers, constraints, and preserved contradictions
  body: |-
    The strongest growth drivers are rising cancer burden, widening screening guidelines, cost pressure, and the need for follow-up orchestration. Public guideline changes reinforce this. USPSTF now recommends biennial mammography starting at age 40, colorectal screening beginning at 45 for average-risk adults, and annual low-dose CT screening for defined high-risk smokers from age 50 to 80. Those recommendations create additional screening volume, but they also create additional workflow complexity around eligibility, modality choice, abnormal follow-up, dense-breast questions, and treatment handoffs. The colorectal screening gap alone remains large: NCCRT reports that more than one in three eligible adults are still not screened as recommended. That gap, combined with employer cost pressure, supports demand for orchestration layers like Color. Constraints remain real. Public sources still do not give a clean employer-benefit SAM, implementation conversion rates are private, and integrated programs must overcome member behavior, trust, privacy sensitivity, and incumbent-provider inertia. Still, the direction of travel is favorable: buyers appear to be moving away from fragmented point solutions toward integrated, measurable cancer programs that can show faster diagnosis and lower avoidable costs.
