callouts:
- calloutType: strength
  title: The market tailwind is workflow complexity, not just rising cancer incidence
  body: |-
    Color benefits when screening recommendations widen, risk stratification becomes more individualized, and buyers realize that follow-up—not just ordering tests—is the biggest operational bottleneck. Those forces make integrated orchestration more valuable over time.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
  - CM035
  - CM036
- calloutType: risk
  title: The exact U.S. SAM is still less precise than the headlines imply
  body: |-
    Public evidence supports large adjacent spend pools, but it does not yet deliver a single clean measure of the dollars truly available to outsourced employer and health-plan cancer programs. That gap should temper confidence in any overly precise TAM or penetration narrative.
  claimRefs:
  - CM010
  - CM011
  - CM034
  - CM040
