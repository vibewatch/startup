- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument type
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - Thesis
    - Integrated cancer workflow model addresses high-friction points across screening, diagnosis, treatment, and survivorship.
    - Virtual Cancer Clinic plus employer and payer materials.
    - Proof that customers still buy only narrow point solutions would weaken this view.
  - - Thesis
    - Clinician-in-the-loop AI may create workflow leverage without betting the thesis on full automation.
    - Color plus OpenAI materials on copilot and workup support.
    - Evidence of low clinician adoption or labor-heavy economics would weaken this view.
  - - Thesis
    - Meaningful operational scale and patient reach suggest Color is more than a pilot-stage story.
    - Independent coverage citing 7M+ patients and broad partner activity.
    - If current revenue quality is mostly residual or episodic, scale becomes less valuable.
  - - Anti-thesis
    - 'Public economics are opaque: revenue, gross margin, retention, concentration, and cash are not disclosed.'
    - GetLatka and Tracxn provide only directional third-party data.
    - Audited financials and recent cohort data would materially improve the view.
  - - Anti-thesis
    - The 2021 valuation was set in a very different market and may no longer transfer.
    - Series E disclosure versus 2026 valuation bands.
    - A higher current revenue base or premium M&A proof could support the old mark.
  - - Anti-thesis
    - COVID-reset layoffs show organizational whiplash and execution risk.
    - MobiHealthNews layoffs coverage.
    - Several clean years of oncology-focused execution would reduce this concern.
  notes: |-
    Pairs the strongest pro and con arguments surfaced in this run; rows are synthesized from reviewed evidence rather than management guidance alone.
