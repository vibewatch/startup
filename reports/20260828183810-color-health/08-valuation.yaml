- id: SVP005
  title: Exit readiness and final diligence asks
  body: |-
    Final diligence should focus on the specific data that would most quickly collapse the valuation distribution. First, investors need audited GAAP financials plus recent management accounts to test whether the GetLatka revenue estimate is directionally right and to understand gross margin, burn, and working-capital demands. Second, they need revenue quality evidence: customer concentration, renewal behavior, retention, and segment mix across employers, health plans, public-sector programs, and any residual episodic work. Third, they need the current cap table, preference stack, and cash position because liquidation terms can erase expected upside even if enterprise value looks reasonable.

    Until those issues are resolved, the right stance is disciplined curiosity. Color has enough strategic proof to stay on the watchlist, but not enough valuation proof to justify chasing the old price.
