  - CV049
  - CV050
  - CV051
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - Three years of audited GAAP financials plus latest management accounts
    - Validates the revenue anchor, margin profile, and burn.
    - Request CFO package and auditor-backed statements.
  - - Revenue mix
    - Segment split across employers, health plans, public-sector programs, and any residual episodic work
    - Determines whether revenue is recurring and premium-worthy.
    - Management data room plus cohort analysis.
  - - Customer durability
    - NRR, GRR, renewal rates, top-account concentration, and contract term data
    - Tests whether partner proof converts into durable value.
    - Commercial analytics export and top-20 account review.
  - - Cap table and liquidity
    - Current cap table, preferences, debt, option pool, and secondary history
    - Determines true investor return mechanics.
    - Counsel-reviewed cap table and waterfall model.
  - - Current cash and runway
    - Cash balance, debt covenants, monthly burn, and financing timing
    - Clarifies whether investors are underwriting choice or necessity.
    - Treasury package and board materials.
  - - AI productivity economics
    - Clinician throughput, labor mix, QA cost, and realized time or cost savings from copilot use
    - Tests whether AI changes margins or only improves narrative.
    - Operational dashboard plus pilot-to-production metrics.
  notes: |-
    These asks are prioritized by how quickly they would narrow the valuation distribution and change the recommendation.
