- id: SVP004
  title: Scenario ranges and final call
  body: |-
    The scenario frame is straightforward. In the bull case, Color proves that its integrated cancer workflow, partner reach, and clinician-in-the-loop AI can support premium revenue quality and a scarcity multiple near the top of HealthTech strategic ranges. That case can approach the old valuation, but only with much stronger disclosure and evidence of durable growth. The base case is more conservative and more plausible on public evidence: Color is a real company with real traction, but one best valued as a hybrid clinical-infrastructure asset rather than a top-decile software compounder. The bear case is a flat- or down-round outcome if the 2024 revenue proxy overstates durable revenue quality or if margins, concentration, and cap-table overhang prove worse than outside investors expect.

    That scenario spread is why the recommendation lands at track. The company remains investable in principle, but the public evidence does not yet support conviction at the stale 2021 mark.
