  title: Recommendation summary table
  columns:
  - Dimension
  - Current assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Strategic quality is credible, but price underwriting is still weak on public evidence.
    - Stay engaged, but do not underwrite a new round at the stale 2021 mark.
  - - Confidence
    - Medium
    - Product and market signals are strong; financial disclosure remains partial and estimated.
    - A data room could move the call in either direction quickly.
  - - Risk rating
    - High
    - Execution, regulatory, partner, and capital-structure uncertainty all affect value.
    - Underwrite with downside discipline and explicit kill triggers.
  - - Valuation stance
    - Stretched
    - The 2021 mark screens rich against current revenue proxy and reviewed 2026 multiple bands.
    - Seek either a lower price or substantially better proof.
  - - Entry discipline
    - Improves below ~$1.5B-$2.0B
    - That range better matches mid-to-upper hybrid HealthTech multiples on the reviewed revenue anchor.
    - Below this band, expected upside begins to compensate for opacity.
  notes: |-
    Assesses today’s underwriting stance using the reviewed public evidence set; valuation band is illustrative and not a formal fairness opinion.
