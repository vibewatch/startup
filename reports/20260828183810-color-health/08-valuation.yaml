- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing below base-case range
    - New primary round meaningfully below ~$1.5B EV
    - Signals that insiders or new investors do not support the old mark.
    - Re-underwrite immediately; default to avoid unless terms are exceptional.
  - - Revenue-quality disappointment
    - Audited revenue, gross margin, or retention materially below implied expectations
    - Breaks the bridge from strategic quality to premium valuation.
    - Move from track to avoid.
  - - Partner-conversion weakness
    - Major employer, payer, or referral channels show weak adoption or renewal
    - Undercuts the distribution and workflow-scale thesis.
    - Reduce assumed upside and revisit comp set.
  - - Regulatory or compliance shock
    - Material HIPAA, lab, reimbursement, or clinical-quality issue
    - Raises both risk premium and customer-friction assumptions.
    - Treat as thesis-breaking until contained.
  - - AI remains labor-heavy
    - Copilot improves quality but not labor or throughput economics
    - Blocks the scarcity-premium bull case.
    - Cap valuation at hybrid-services ranges.
  notes: |-
    Defines the measurable events that would most quickly invalidate the current underwriting frame.
  claimRefs:
