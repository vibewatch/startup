- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: exhaustive
    basis: |-
      All valuation references actively used in this chapter’s underwriting frame: direct public oncology or screening comparables plus one category-distress caution and one strategic-scale reference.
  columns:
  - Comparable
  - Status
  - Reference metric
  - Multiple / valuation signal
  - Relevance to Color
  - Limitation
  rows:
  - - Tempus AI
    - Public
    - Q2 2026 revenue $382.5M; LTM revenue $1.43B
    - 8.52x EV/Sales; $12.17B EV
    - Best reference for precision-oncology data plus workflow premium.
    - Discloses much richer economics than Color and is larger scale.
  - - Guardant Health
    - Public
    - Q2 2026 revenue $335.0M; LTM revenue $1.18B
    - 18.86x EV/Sales; $22.35B EV
    - Best reference for clinically validated screening platform upside.
    - Public premium depends on reimbursement and Shield momentum Color has not shown.
  - - Natera
    - Public
    - Q2 2026 revenue $752.8M; LTM revenue $2.71B
    - 17.34x EV/Sales; $46.11B EV
    - Shows how oncology testing leaders can earn premium multiples at scale.
    - Broader testing franchise and far deeper public disclosure than Color.
  - - Myriad Genetics
    - Public
    - Q2 2026 revenue $190.7M; LTM revenue $806.6M
    - 0.49x EV/Sales; $398.51M EV
    - Useful downside lens for mature testing vendors facing payer friction.
    - Business mix differs and growth profile is much weaker.
  - - Exact Sciences
    - Strategic reference
    - 2024 revenue $2.76B including $655M precision oncology
    - 6.65x EV/Sales around 2026 transaction context
    - Shows strategic value available to scaled cancer-screening assets.
    - No longer a clean current public comp because of 2026 transaction context.
  - - Invitae
    - Adverse category caution
    - Chapter 11 filing in 2024
    - Equity destruction despite category relevance
    - Reminds investors that genomics narratives can fail under capital and reimbursement pressure.
    - Distressed case, not a clean valuation comp.
  notes: |-
    Selected to bracket Color between premium oncology-platform outcomes and downside testing-vendor outcomes; values mix official company releases and current market-data pages.
