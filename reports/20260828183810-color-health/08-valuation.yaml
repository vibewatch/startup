- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation range
  - Probability signal
  - Primary risk or unlock
  rows:
  - - Bull
    - Color proves durable cancer-program growth, software-like workflow leverage, and strategic scarcity.
    - ~$3.2B-$4.8B
    - Needs audited proof that current revenue quality and margins deserve top-end HealthTech pricing.
    - Unlock is premium strategic buyer or premium crossover financing.
  - - Base
    - Color is a real but hybrid clinical-infrastructure business with moderate growth and incomplete disclosure.
    - ~$1.6B-$2.4B
    - Best fits current public evidence and peer framework.
    - Main risk is that hidden economics are worse than the public narrative implies.
  - - Bear
    - Revenue quality, concentration, or margin structure disappoint and financing occurs from a weaker negotiating position.
    - ~$0.8B-$1.4B
    - Becomes more likely if new capital is required before audited proof improves.
    - Trigger is flat or down round plus visible execution or reimbursement strain.
  notes: |-
    Ranges are analyst estimates in USD billions built from the reviewed revenue proxy, 2026 HealthTech multiple commentary, and public comparable bands.
