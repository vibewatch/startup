tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Key diligence gap
  rows:
  - - Virtual Cancer Clinic
    - Patients, employers, plans
    - Core operating layer
    - Coordinates the full continuum instead of a single point solution
    - Need production utilization and staffing metrics
  - - Early Detection
    - At-risk members / patients
    - Mature and prominent
    - Guideline-based screening plus access logistics
    - Need completion and false-positive workflow metrics
  - - Active Treatment Management
    - Patients in treatment
    - Mature and differentiated
    - Built-in multidisciplinary review and symptom support
    - Need production outcome benchmarks
  - - Survivorship Care
    - Cancer survivors
    - Mature but newer category emphasis
    - Long-tail risk management after treatment
    - Need retention and long-term engagement data
  - - Expert Medical Opinion
    - Treating patients and clinicians
    - Core embedded feature
    - Continuous, not one-time, oncology review
    - Need independent replication of savings claims
  - - Cancer Connect
    - Patients and caregivers
    - Real but narrower module
    - Peer-support layer broadens the care model
    - Need scale and repeat-usage metrics
  - - OpenAI-enabled copilot / LLE tools
    - Internal clinicians and oncology workflows
    - Emerging but scaling
    - Guideline logic plus AI reasoning and auditability
    - Need broad third-party benchmarking and production incident data
  notes: The matrix treats care modules and technical capabilities as product assets because Color’s differentiation comes from the combined workflow, not from a standalone software SKU.
