- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow problem
  - Color solution
  - Measurable benefit
  - Limitation
  rows:
  - - Get the right screening started
    - Clinical capacity and fragmented access delay screening
    - Early Detection plus AI-assisted intake and ordering support
    - Potentially faster access and better adherence
    - Depends on local imaging and patient follow-through
  - - Resolve abnormal screening quickly
    - Patients get stuck between screening and diagnosis
    - Virtual Cancer Clinic coordinates workup and referrals
    - Faster path to diagnosis
    - Off-platform providers still matter
  - - Confirm the right treatment plan
    - Specialist opinions arrive late or not at all
    - Embedded Expert Medical Opinion and tumor board review
    - Treatment changes and lower avoidable cost
    - Requires treating-provider cooperation
  - - Manage treatment side effects continuously
    - Care is reactive and fragmented during treatment
    - Active Treatment Management with ongoing oversight
    - Better symptom support and fewer disruptions
    - Labor intensive if case volume scales
  - - Support caregivers and emotional burden
    - Traditional oncology workflow under-serves families
    - Cancer Connect peer support
    - Higher continuity and non-clinical support
    - Outcome measurement is less standardized
  - - Manage survivorship risks
    - Post-treatment care is often episodic
    - Survivorship Care with tailored follow-up plans
    - Long-tail risk reduction and coordination
    - Longitudinal proof is still limited publicly
  notes: Each row maps a real job-to-be-done to a product intervention. This is more informative than a feature checklist for a care-delivery platform.
