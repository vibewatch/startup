callouts:
- calloutType: strength
  title: The product is more concrete than generic health-AI positioning
  body: |-
    Color’s public materials describe clear modules, real workflow boundaries, and a specific AI architecture with logic, review, and audit layers. That does not prove superiority, but it does separate the company from vaguer automation narratives.
  claimRefs:
  - CE009
  - CE011
  - CE014
  - CE034
- calloutType: risk
  title: Much of product quality still depends on coordination outside Color’s direct control
  body: |-
    Even a strong virtual operating layer cannot fully control local imaging, specialist availability, treating-provider cooperation, or production-scale partner dependencies. That makes orchestration the moat—but also the failure mode.
  claimRefs:
  - CE024
  - CE025
  - CE032
  - CE033
