- id: SE004
  title: Trust, safety, and unresolved product risks
  body: |-
    Trust and quality controls are unusually important in this chapter, and Color has stronger public signals than many health-AI companies. The ASCO Certified designation gives the Virtual Cancer Clinic an independent quality benchmark tied to oncology-practice standards, including explicit requirements for virtual-care coordination and patient safety. The LLE materials also show a real attempt to make AI interpretable through constrained tasks, explicit decision factors, logic layers, and reviewable reasoning traces. UCSF-linked validation adds some third-party weight to the AI-performance story, though most detailed evidence still comes from company-authored or partner-authored materials. Product maturity should therefore be rated as strong-but-not-fully-proven: the module set is concrete, the operating model is specific, and the quality controls are more robust than generic automation vendors, but outside visibility into software reliability, engineering velocity, and production-scale benchmarking remains limited. That last gap matters because impressive workflow design still has to survive daily operational reality.
  claimRefs:
  - CE021
  - CE022
  - CE030
  - CE031
  - CE033
  - CE034
