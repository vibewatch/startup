- id: SE003
  title: Deployment, dependencies, and capability maturity
  body: |-
    Deployment maturity looks strongest where Color combines software with clinical operations. The Early Detection, Active Treatment Management, and Survivorship pages are not abstract promises; they describe distinct use cases, handoffs, and measurable interventions. Expert Medical Opinion is built into care instead of added as an after-the-fact review. Cancer Connect adds peer and caregiver support. Collective Health shows that integrations can involve eligibility feeds, SSO, billing, and utilization data, while the Carrum partnership shows the product can connect into downstream treatment pathways. The main external dependencies are clear: local treating physicians, benefits platforms, partner pathways, guideline bodies, and foundation-model partners like OpenAI. This means the architecture is not fully self-contained. Color owns the coordination logic and virtual clinical layer, but large parts of the real-world care journey remain off platform. That is both a strength—because it makes adoption more flexible—and a product risk, because coordination quality can be limited by systems Color does not fully control.
  claimRefs:
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE023
  - CE024
  - CE025
