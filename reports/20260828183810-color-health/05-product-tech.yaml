- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Patient intake and history capture
    - Collects structured clinical context
    - Patient engagement and data quality
    - Incomplete histories can degrade downstream logic
  - - Guideline distillation
    - Turns text guidelines into decision factors and logic
    - Clinical experts plus LLE preprocessing
    - Guidelines change and require ongoing upkeep
  - - LLM question answering
    - Answers bounded clinical-factor questions
    - Foundation models and prompt controls
    - Model drift or retrieval errors still possible
  - - Deterministic logic engine
    - Applies Boolean rule structure to recommendations
    - Accurate rule encoding
    - Encoding mistakes can propagate at scale
  - - Clinician review layer
    - Validates, overrides, and acts on outputs
    - Clinical staffing and workflow design
    - Human review capacity can bottleneck throughput
  - - Orders, referrals, and coordination
    - Converts recommendations into real-world care actions
    - Local provider networks and facilities
    - Off-platform execution quality is variable
  - - Audit and explanation layer
    - Provides reasoning traces and evidence for review
    - Structured outputs and UX
    - Poor explainability would reduce trust
  notes: The architecture is reconstructed from Color’s public technical writing and clinical workflow pages. It is specific enough to be credible, but still lacks external production telemetry.
