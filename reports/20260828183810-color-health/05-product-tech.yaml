company:
  name: Color Health
chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Color’s product is a modular virtual oncology operating system rather than a single test or a generic navigation layer. Its strongest public modules are Early Detection, Active Treatment Management, Survivorship Care, Expert Medical Opinion, Cancer Connect, and the Virtual Cancer Clinic. The most important technical differentiator is the Large Language Expert architecture, which Color says combines LLM reasoning with explicit guideline logic and clinician review. Overall maturity appears high at the workflow and clinical-operations layer, with credible quality signals from ASCO certification, but key dependencies on partners, local providers, and limited third-party benchmarking still constrain conviction.
sections:
- id: SE001
  title: Product definition and module map
  body: |-
    Color’s product is no longer well described as a genetics company or a single cancer-screening vendor. In workflow terms, it is a virtual cancer-care operating model made up of multiple modules: early detection, active treatment management, survivorship care, Expert Medical Opinion, Cancer Connect, and the Virtual Cancer Clinic that ties those modules together. This matters because the company is selling a longitudinal care layer rather than a single encounter. The workflow starts before diagnosis with risk identification and screening activation, moves through abnormal-result follow-up and diagnosis support, continues into active treatment management, and then extends into survivorship and caregiver support. The Virtual Cancer Clinic is the coordinating surface across that journey, but it does not claim to replace local care settings. Instead, it appears designed to bring specialist review, virtual support, and structured oncology workflows around the in-person system. The result is a modular care-delivery platform, not a one-off product.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: SE002
  title: Technology and operating architecture
  body: |-
    The strongest technical evidence comes from Color’s public description of how it applies AI inside those workflows. The company’s mammography-access initiative describes an AI agent that collects patient history, evaluates screening eligibility, and creates structured information for clinician review. Its later Large Language Expert architecture goes much deeper, describing a hybrid system that first distills guidelines into explicit clinical decision factors and Boolean logic, then uses LLMs in a constrained question-answering role before deterministic evaluation occurs. That is a meaningfully more specific architecture than generic “AI copilot” marketing. It also explains how Color is trying to operationalize guideline-driven oncology care at scale. The architecture still depends on human clinicians, but that dependency is intentional: the system is designed to produce reasoning traces, citations, and inspectable outputs that clinicians can validate or override. In product terms, the technology is trying to industrialize expert review without pretending to automate away clinical judgment.
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE035
  tableRefs:
  - TE003
