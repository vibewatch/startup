      - number: '3.4'
        title: Moat durability, multi-homing risk, and where threats are strongest
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's moat looks most credible where implementation friction matters more than raw model novelty. The
              retained SpreeAI sources consistently emphasize one-photo onboarding, no new photography, and deployment
              live in days, which is a real procurement advantage for merchants that want fast proof-of-value. But the
              public evidence also shows why that edge may not be durable on its own. DRESSX and FASHN both integrate
              into existing stacks, making multi-homing or vendor switching plausible. True Fit and Bold Metrics argue
              for a different kind of defensibility—longitudinal fit outcomes, digital twins, and structured body
              data—which is harder to copy than a front-end try-on effect. Google, Snap, and Shopify add another
              pressure point by controlling consumer discovery or native media infrastructure. Just as important, many
              competitors already market the same outcome language of higher conversion and lower returns, so headline
              ROI rhetoric is no longer unique. The largest remaining diligence gaps are exactly the ones a buyer or
              investor would want for moat underwriting: public benchmark accuracy against named peers, realized
              enterprise pricing, and evidence on churn, exclusivity, or win-loss rates. Until those are disclosed,
              SpreeAI's differentiation is credible but only partially proven.
