  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's public narrative is strong on product ambition, brand partners, and valuation, but much thinner
              on the control evidence that usually de-risks a consumer-facing AI platform. The highest residual risk is
              legal and privacy exposure around uploaded photos, body measurements, and biometric-style geometry because
              the company publicly promises consent, deletion, and encryption yet does not publish trust artifacts,
              subprocessors, audit reports, or incident playbooks. The second cluster is concentration risk: John Imah,
              Bob Davidson, and a narrow band of named partners carry outsized weight in fundraising, credibility, and
              go-to-market signaling. Operational and security risk is not about a disclosed breach today; it is about
              the gap between the sensitivity of the data processed and the limited evidence of enterprise-grade
              controls. Finally, the valuation and ROI story still outruns the disclosed evidence on revenue quality,
              customer retention, and moat durability, which is why kill criteria need to stay hard and monitorable.
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
