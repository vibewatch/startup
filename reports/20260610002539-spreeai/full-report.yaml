  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Bottom line: price support still lags the narrative'
        blocks:
          - type: paragraph
            body: >-
              SpreeAI has enough signal to stay on a diligence list: the product story is clear, the company has public
              fashion validation, patents exist, and independent press repeats the $1.5 billion valuation anchor. But
              the valuation case remains thinner than the narrative case. The strongest public operating proof is still
              company-reported or event-stage evidence such as the claim that around 60 percent of Try On clicks convert
              and that deployments can go live quickly. The SEC trail confirms real exempt financing activity, yet those
              filings still do not disclose revenue, retention, gross margin, or preference terms. That means public
              evidence cannot translate the reported valuation into a risk-adjusted entry case. The correct
              recommendation is research-more with medium confidence, high risk, and a stretched valuation stance.
              SpreeAI may be a strong product and brand story, but public evidence has not yet earned the right to be
              treated like a de-risked software comp.
            claimRefs:
