      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Privacy / biometric exposure
        - Public incident, complaint, litigation, or regulator inquiry involving uploaded images or biometric-style data
        - Any disclosed enforcement action, breach notice, or consumer suit tied to core image-processing workflows
        - Immediate thesis break; pause underwriting until scope, controls, and remediation are proven
      - - Security assurance gap
        - Trust-center or audit evidence remains absent while enterprise sales claims scale
        - No credible third-party assurance roadmap or vendor transparency by the next financing process
        - Downgrade conviction; treat security posture as unproven infrastructure risk
      - - Partner-network concentration
        - Named fashion or academic affiliations fail to convert into repeatable retailer references
        - No production case studies or renewal-quality references from named brand partners before next round
        - Re-rate go-to-market claims; treat partnerships as branding rather than durable demand
      - - Founder dependence
        - Leadership transition or inability to show bench depth
        - John Imah departure, or continued absence of named deputies across finance, privacy, security, and product
        - Pause investment until succession and operating resilience are evidenced
      - - Valuation / model opacity
        - Unicorn valuation persists without customer-proofed economics
        - >-
          Still no public or diligenced evidence on revenue quality, retention, or cash efficiency when capital is
          re-raised
        - Move to research-more stance and underwrite on downside scenarios only
      - - Competitive parity
        - Peer tools show similar integration and sizing economics while SpreeAI lacks differentiated ROI proof
        - Two or more credible buyer references indicate vendor substitution on fit and returns outcomes
        - Assume pricing pressure and moat compression; cut terminal assumptions
    notes: >-
