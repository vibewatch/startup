      - number: '6.4'
        title: Expansion paths are visible, but concentration risk remains the chapter’s central adverse conclusion
        blocks:
          - type: paragraph
            body: |
              The upside case is straightforward. SpreeAI has a coherent fashion wedge: live or announced
              designer collaborations, a CFDA relationship that expands brand access, omnichannel language
              that fits high-touch commerce, and pilot-intake flows that suggest the company is still
              actively widening its merchant funnel. If one or two designer wins become repeatable templates
              for broader luxury or premium apparel rollouts, the product could compound through better
              references, richer fit data, and easier selling into similar accounts. The downside case is
              equally straightforward. The public proof set is still tiny and heavily curated around a
              handful of relationships, with one live verified brand-site deployment carrying
              disproportionate weight. No public source gives customer count, merchant mix, top-customer
              revenue exposure, or audited multi-account retention. The only reviewed source that publishes
              concrete NRR, onboarding, and sales-cycle figures is an explicitly simulated SWOT page, which
              makes it useful as an adverse prompt but not as diligence-grade evidence. That combination
              means the right underwriting stance is asymmetric: customer relevance is real, but broad
              durability and de-concentration remain unproven. For this chapter, the most important
              unanswered questions are not “does anyone use it?” but “how many merchants are live?” and
              “how much revenue depends on a very small number of showcase accounts?”
            claimRefs:
              - CU033
