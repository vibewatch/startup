      - number: '7.5'
        title: Monitoring indicators and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The investable version of this story requires faster movement from narrative proof to control proof. The
              core diligence principle should be simple: if SpreeAI wants to underwrite a premium multiple on
              sensitive-data consumer AI, it needs to evidence privacy governance, security assurance, repeatable
              enterprise ROI, and leadership depth at roughly the same pace as it promotes valuation and partnerships.
              The monitorable triggers therefore focus on public facts that are hard to spin away: a privacy or security
              event, persistent absence of trust artifacts, no conversion of named affiliations into production
              references, leadership turnover, or proof that adjacent vendors offer near-parity economics. None of these
              triggers alone guarantees failure, but each one meaningfully raises the odds that the company is still a
              well-branded concept rather than a de-risked software business. Until those gaps narrow, the chapter
              should be read as a cautionary risk register, not a minor caveat section.
            claimRefs:
