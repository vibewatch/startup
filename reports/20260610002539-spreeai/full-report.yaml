    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product Model
        blocks:
          - type: paragraph
            body: >-
              SpreeAI’s public materials are consistent about what the company is trying to sell even when they are
              inconsistent about where and when the company was formally founded. The homepage and product page describe
              a one-photo system that combines photorealistic try-on, fit or size prediction, and styling logic; they
              also say the experience avoids downloads, redirects, and new photography while delivering try-on output in
              under three seconds. The partner page frames the product as a white-label deployment for retailers that
              can go live quickly and fit into existing commerce stacks. SpreeAI’s privacy policy grounds that marketing
              language in a formal company identity by describing SpreeAI Corporation as a fashion-technology company
              serving retailers and consumers across websites, APIs, mobile apps, and partner integrations. Where the
              public record becomes less stable is identity metadata: LinkedIn says the company was founded in 2023 and
              is headquartered in Los Angeles, the terms list only an Incline Village mailing address, and Wikipedia
              says both founding year and headquarters are different. Later chapters should therefore reuse the product
              definition confidently, but should treat founding year and headquarters as disputed rather than canonical.
