      - number: '5.3'
        title: Differentiation, IP, and Roadmap Signals
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's strongest public moat signal is not the marketing copy; it is the combination of recent patent
              activity and role descriptions that map to a vertically integrated try-on stack. Patent records show work
              on remote apparel fitting from a single shopper image, simultaneous generation of multiple garmented
              avatars, and digital garment grading that maps garments from one body topology to another. Those filings
              make the company's differentiation story more concrete than the usual fashion-tech promise of “AI-powered
              personalization,” because they point to specific image-processing, fit-modeling, and rendering workflows.


              The company's own 2025 press cycle adds the commercial differentiation layer. Multiple distributed
              versions of the release say SpreeAI had four issued patents and twenty-three pending at the time, and they
              also introduce Protea as a retailer platform for integration and testing. The same sources and later Vogue
              coverage push the roadmap beyond current try-on and sizing into AI stylist, virtual wardrobe, broader
              hyper-personalized recommendations, and a more continuous online/offline shopping journey. That is
              directionally attractive because it expands SpreeAI from fit-reduction tooling toward basket expansion and
              wardrobe intelligence.


              Still, most roadmap evidence is company-originated or company-amplified. Public materials do not show a
              versioned product changelog, named API launches, or benchmark reports that would let an external reviewer
              separate shipped capability from planned capability. SpreeAI therefore looks differentiated on workflow
              design, fashion positioning, and IP velocity, but still early on independent proof that those assets
              translate into defensible market pull at scale.
