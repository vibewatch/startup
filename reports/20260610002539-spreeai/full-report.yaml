  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              SpreeAI sits inside the enterprise apparel and footwear ecommerce stack, specifically the software layer
              that helps a shopper decide whether an item looks right and fits well enough to buy now. The included
              spend is not all of retail AR, all 3D commerce, or all ecommerce personalization. It is the narrower pool
              of brand and retailer spending on virtual try-on, size prediction, fit guidance, and related merchandising
              flows that can be embedded in owned product pages and checkout journeys. That boundary matters because
              broad market reports frequently mix in-store mirrors, beauty try-on, eyewear, hardware, and generalized AR
              experiences that SpreeAI does not clearly serve today. Status-quo substitutes are still strong: size
              charts, better photography, merchandising content, lenient return policies, marketplace-native try-on from
              Google, and suite products from platforms such as Snap or Shopify. For diligence, the right comparison set
              is therefore conversion-and-returns software for online fashion, not every immersive-shopping tool.
