      - number: '8.2'
        title: Financing proof exists, but public economics remain opaque
        blocks:
          - type: paragraph
            body: >-
              The public financing record cuts both ways. The SEC Form D/A is useful because it shows a real private
              round structure: a $30 million exempt offering, $15 million sold, and one investor disclosed as of the
              July 2024 amendment. Yet the same SEC trail highlights the central valuation problem because the public
              corpus still lacks audited operating data, customer concentration, and detailed round economics.
              Independent coverage adds helpful context: Inc. says the company had nearly $100 million raised, close to
              40 partners, and a consumer launch window around late 2025 or early 2026. That still does not bridge the
              gap between story and price. Regulatory exposure also matters because SpreeAI explicitly processes
              biometric and image-derived data. Its own privacy policy references BIPA, while U.S. privacy rules and the
              EU AI Act continue to thicken in 2026. That does not break the thesis, but it raises execution and
              compliance costs exactly when the company still needs to prove durable software economics at scale.
            claimRefs:
              - CV006
