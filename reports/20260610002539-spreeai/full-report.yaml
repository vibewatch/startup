      - number: '8.3'
        title: Comparable ranges imply a wide valuation envelope
        blocks:
          - type: paragraph
            body: >-
              The most important takeaway from public comps is not a single correct multiple; it is the size of the
              range. Shopify still earns a software-style premium at more than 11x sales, but Stitch Fix trades below
              0.5x sales and Revolve plus ThredUp sit much closer to 1x to 2x sales. That spread matters because SpreeAI
              has not publicly shown where it belongs. If SpreeAI truly has high-margin recurring enterprise revenue
              with sticky retention and measurable conversion or returns impact, investors can argue for something
              meaningfully above commerce-retail comps. If the business is earlier, services-heavier, or still dominated
              by pilot deployments, the relevant comp set compresses quickly. The implied revenue math makes the problem
              visible: a $1.5 billion entry needs only about $129 million of revenue at Shopify’s multiple, but it needs
              hundreds of millions to more than a billion dollars under the fashion-commerce set. Without disclosed
              revenue, the bull case remains conditional and the base case has to underwrite a much lower supportable
              range than the headline mark.
            claimRefs:
