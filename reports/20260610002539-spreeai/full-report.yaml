      - number: '5.2'
        title: Architecture, Integration, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              SpreeAI does not publish a public API reference or architecture handbook, so the clearest technical
              disclosure comes from recruiting. Across AI research, AI infrastructure, principal platform, model
              evaluation, and mobile engineering roles, the company describes an end-to-end stack that spans training,
              evaluation, deployment, monitoring, model registry, experiment tracking, dataset lineage, and
              rollback-capable release automation. That is a much more opinionated operating model than a thin front-end
              widget vendor would need. It suggests SpreeAI is trying to own not only UX but also the model lifecycle,
              release quality, and partner-facing reliability of multimodal try-on systems.


              The hiring materials also reveal specific technical bets. Research roles mention diffusion, multimodal
              transformers, video modeling, controllability adapters, and human-centric representation learning.
              Platform roles mention Triton, vLLM, TensorRT-LLM, Ray Serve, TorchServe, ONNX Runtime, Kubernetes, and
              GPU resource management. Mobile roles point to camera capture, garment scanning, and client SDKs that call
              backend inference services. Model-evaluation roles emphasize dataset-driven benchmarking, regression
              detection, and CI/CD checks for realism, consistency, and performance.


              Together these disclosures paint a managed-integration architecture: retailer channels feed capture and
              catalog data into SpreeAI-run model services, while internal evaluation and observability gates police
              release quality. The partner portal and pilot-first language reinforce that interpretation. The trade-off
              is that the architecture looks sophisticated, but much of it must be inferred from job descriptions
              because public docs, sandbox instructions, and status transparency are not currently part of the public
              website surface.
