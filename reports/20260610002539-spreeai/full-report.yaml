      - number: '1.3'
        title: Funding, Scale, and Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              SpreeAI’s financing story is directionally strong but still incomplete at the level investors usually want
              for a canonical overview. Multiple sources agree that the company reached a $1.5 billion valuation in May
              2025 after a Davidson-led round, and TechCrunch independently placed SpreeAI on its 2025-unicorn list in
              January 2026. What remains less settled is the size of the capital stack and the exact round label.
              TechCrunch, citing PitchBook, says SpreeAI has raised $80 million and was founded in 2020; earlier People
              of Color in Tech and AFROTECH profiles said the company had nearly $60 million by 2024. That suggests
              meaningful capital came in before the unicorn event, but the retained primary materials do not disclose
              exact proceeds, ownership percentages, liquidation preferences, or whether the 2025 round should be
              treated as Series B in canonical reporting. Disclosure is even thinner on operating metrics: no retained
              source gave customer count, revenue, ARR, debt, or secondaries. The best current scale proxies are
              therefore LinkedIn’s 11-50 size band, roughly 30 visible employees on the company page, and a 13-role
              hiring slate spanning Los Angeles, New York, and San Francisco.
