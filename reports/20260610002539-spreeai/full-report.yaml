      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The strongest repeated leadership fact in retained sources is that John Imah is SpreeAI’s co-founder and
              CEO. The official history page pairs him with Bob Davidson and Lisa Park as co-founders and explicitly
              notes that Lisa Park is no longer affiliated, which is useful because most other sources omit her. Public
              governance coverage then converges around a board-level surface made up of Naomi Campbell, Bob Davidson,
              and Larry Ruvo, with Naomi’s 2024 board arrival highlighted in People of Color in Tech and later repeated
              in valuation coverage. The official team page fills in the operating bench with product, engineering,
              design, HR, partnerships, people, and privacy leaders, while June 2026 LinkedIn posts show Chelsea Suitos
              acting as the external partnerships lead at industry events. Imah’s prior résumé—spanning Samsung, Twitch,
              Amazon, Meta, Take-Two, and Snap—supports founder-market fit at the intersection of consumer technology
              and fashion. Even so, the company has not published a fuller board roster, governance rights, or
              executive-by-executive biographies beyond the public-facing team page. That makes founder and chair
              concentration a real diligence item even though the visible leadership surface is broader than a
              two-person founding story.
