      - number: '6.3'
        title: Durability evidence is indirect, while privacy and contracting create real adoption friction
        blocks:
          - type: paragraph
            body: |
              Public durability evidence is meaningfully thinner than adoption evidence. No reviewed source
              discloses merchant count, NRR, GRR, logo churn, contract length, or renewal cadence. The best
              public proxy for durability is relationship continuity: Sergio moved from spring announcement
              coverage to a December go-live release and still had a live try-on collection page at the June
              2026 access date. That is better than logo-only proof, but it is still not cohort evidence.
              Another mild durability signal is deployment design. SpreeAI repeatedly describes itself as a
              white-label system integrated into merchant sites, apps, and in-store workflows rather than a
              standalone marketplace, which should create some post-integration stickiness. But that
              potential stickiness comes with friction. The privacy policy says SpreeAI processes
              photographs, body measurements, and biometric information with explicit consent and may share
              results with partner retailers, while the terms grant broad rights around user data, avatars,
              and company content. For enterprise merchants, especially premium brands guarding customer
              trust, those requirements likely lengthen privacy, legal, and procurement review even if the
              product’s shopper value is obvious. In other words, the public record shows a plausible path
              to durable accounts, but not proof that durable accounts already exist at scale.
            claimRefs:
              - CU020
              - CU023
              - CU024
