      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Three growth drivers are clear. First, return economics are painful and getting harder to hide as
              online-fashion scale rises. Second, category normalization by Google, Snap, and Shopify reduces the
              novelty discount and trains buyers to expect try-on and fit guidance in mainstream commerce. Third, macro
              pressure in fashion is pushing brands toward AI tools that protect margin and improve personalization,
              even in a low-growth environment. The constraints are just as clear. Implementation still requires clean
              imagery, sizing metadata, and workflow discipline; costs can include new content production, QA, and
              integration work; and privacy obligations around body or image data are expanding across U.S. states and
              Europe. Quality also remains a real issue: even bullish category sources acknowledge problems with
              realism, brand fidelity, and standardized sizing. The biggest diligence gap for SpreeAI is not whether the
              category exists, but whether the company can win a large enough share of the narrow, high-readiness
              segment before platform bundles and compliance friction compress the independent software opportunity.
