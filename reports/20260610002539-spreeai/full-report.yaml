companyProfile:
  summary: >-
    SpreeAI is a private fashion-technology company that sells white-label virtual try-on, fit, and styling software to
    retail and fashion brands. Public product surfaces consistently describe a one-photo workflow that renders apparel
    photorealistically on the shopper, avoids new photography, and integrates into retailer sites, apps, and commerce
    stacks rather than operating as a standalone consumer marketplace. The company is led publicly by co-founder and CEO
    John Imah, with Bob Davidson serving as chairman and investor and Naomi Campbell providing visible board-level
    fashion credibility. Public momentum is real: retained sources support academic ties with MIT and Carnegie Mellon,
    collaboration with CFDA, 2025 partnerships with Sergio Hudson and Kai Collective, and a May 2025 valuation milestone
    at $1.5B. What remains unresolved is the operating proof behind that narrative. Founding year, headquarters, and
    cumulative capital raised still conflict across public sources, and no retained source disclosed revenue, ARR,
    retention, gross margin, customer concentration, or financing terms in enough detail to underwrite the current
    price.
