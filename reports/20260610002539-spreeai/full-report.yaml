      - number: '7.2'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              SpreeAI is not just a marketing site with a virtual demo; its own privacy policy says the platform handles
              photos, body measurements, biometric identifiers, partner integrations, and AI model improvement. That
              makes privacy execution foundational rather than optional. The company also takes expansive contractual
              rights over uploaded data and generated avatar content while requiring arbitration and class-action waiver
              for end users. For a U.S. vendor that may serve California consumers and could eventually reach EU users,
              the legal stack spans CCPA or CPRA rights, GDPR restrictions on profiling and tracking, and the broader
              AI-governance direction reflected in the EU AI Act and UK ICO guidance. The public question is not whether
              these rules exist; it is whether SpreeAI has the documentation, retention governance, vendor contracts,
              and notice flows to operationalize them. Because those controls are not evidenced publicly, privacy and
              legal compliance should be ranked as the top diligence item.
            claimRefs:
