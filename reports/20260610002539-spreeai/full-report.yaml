      - number: '7.4'
        title: Partner, people, and model risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests that SpreeAI's market position is amplified by a compact network: John Imah
              as founder-operator, Bob Davidson as chairman and financing anchor, CFDA and designer relationships for
              fashion credibility, and academic affiliations for technical legitimacy. That can accelerate early
              adoption, but it also means signal concentration is high. If those affiliations stall, the company has not
              yet published a deep bench of named executives, enterprise references, or audited outcomes to absorb the
              shock. Financial-model risk compounds the concentration issue. SEC filings confirm repeated fundraising,
              while public coverage confirms unicorn status, yet neither source class explains revenue quality, customer
              concentration, cash burn, or round economics. At the same time, adjacent vendors continue to market
              similar promises around fitting, personalization, and returns reduction. That combination—opaque economics
              plus increasingly legible competitive alternatives—creates a real chance that valuation outruns durable
              moat.
