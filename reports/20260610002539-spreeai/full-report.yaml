  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's public product story is unusually focused: one shopper photo is supposed to answer the core
              apparel buying questions of style, fit, and what-to-wear-with-it in the same session. The home and product
              pages consistently describe three modules on that surface — photorealistic try-on, fit and size
              prediction, and outfit intelligence — and they emphasize that the experience stays inside the retailer's
              own property rather than redirecting the shopper to a separate app. The customer either uploads one photo
              or uses a preset model, sees a render in under three seconds, checks the fit signal, and can move straight
              to checkout.


              The same pages stress low-friction deployment assumptions for the buyer side: no new photography, no body
              scan, and no required app install. SpreeAI also frames itself as brand-calibrated rather than generic,
              which matters because apparel fit tolerance varies by pattern block, fabric, and merchant merchandising
              strategy. The partner page extends that pitch into enterprise workflow terms by promising a
              platform-agnostic launch path that can be live within roughly a week and by presenting pilots as the
              standard entry point.


              What is missing from the public surface is nearly as important as what is present. The sitemap exposes a
              compact marketing-and-policy footprint rather than a deep documentation stack, so product claims are easy
              to understand but hard to independently benchmark. That leaves the workflow proposition clear for
              operators and shoppers, while leaving implementation depth, measurement methodology, and customer outcome
              proof largely outside the public record.
