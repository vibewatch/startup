  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacent fit vendors, and platform substitutes'
        blocks:
          - type: paragraph
            body: >-
              The closest direct alternatives to SpreeAI are the vendors that promise a merchant-facing virtual fitting
              or try-on layer rather than just sizing advice. DRESSX, FASHN, and Style.me all fit that bucket, but they
              approach it differently. DRESSX sells a broader modular suite spanning ecommerce try-on, AI content, and
              even an in-store mirror. FASHN looks more composable and developer-friendly, with public pricing and API
              documentation. Style.me emphasizes a managed 3D fitting room with avatars, sizing, styling, and analytics.
              A second competitor class attacks the same conversion problem through fit intelligence instead of rendered
              try-on imagery: True Fit, Bold Metrics, and 3DLOOK all sell confidence on sizing, measurement, and body
              data. A third class comes from platform substitutes and entrants. Google now owns a consumer-facing try-on
              surface in Shopping, Snap offers AR tooling and distribution, and Shopify already supports native 3D and
              AR product media. That means buyers can choose a specialist suite, a fit-intelligence layer, or a partial
              internal build rather than a single vendor category.
            claimRefs:
