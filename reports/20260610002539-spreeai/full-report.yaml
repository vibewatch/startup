      - number: '3.2'
        title: Feature scope, packaging, and what buyers can actually compare
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's strongest product message is that a single shopper photo unlocks try-on, fit, and styling
              without new photography, redirects, or app downloads. That is cleaner than Style.me's
              avatar-and-digitization-heavy workflow and more merchant-experience-oriented than the fit-only pitch from
              True Fit, Bold Metrics, or 3DLOOK. DRESSX competes with a broader suite: white-label PDP try-on, AI Twin
              inputs, AI Studio content generation, and in-store mirrors, which makes it broader but also potentially
              heavier. FASHN is the most conspicuous pricing outlier because it publishes self-serve monthly plans and
              API-oriented documentation; most of the others keep enterprise economics opaque. DRESSX and Style.me push
              buyers toward demos or contact-sales motions, while True Fit's Shopify offer still bills around
              order-volume tiers instead of simple flat enterprise list prices. The net effect is that public feature
              comparison is possible, but public economic comparison is weak. Merchants can observe who exposes APIs,
              who promises faster go-live, and who bundles fit or styling, but they cannot easily benchmark realized
              take-rates, discounts, or renewal economics from public pages alone.
