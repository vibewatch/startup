tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to SpreeAI
  rows:
  - - Embedded apparel virtual try-on and fit software
    - Software and services that add try-on, fit, or size prediction to owned ecommerce journeys
    - In-store mirrors, hardware rollouts, and generic retail AR budgets
    - Head of ecommerce or digital merchandising; brand or retailer software budget
    - Core category because it matches SpreeAI's one-photo PDP workflow
  - - App-based body scanning and size recommendation tools
    - Photo-led or smartphone-led sizing, fit scoring, and size guidance
    - Pure manual size-chart content without software layer
    - Ecommerce, product, or operations teams; approved by finance
    - Core adjacent layer because it solves the same return-rate problem
  - - Marketplace or platform-native try-on features
    - Merchant participation in Google, Snap, or platform bundles that surface try-on inside discovery or ads
    - Off-platform media spend that does not improve fit confidence
    - Platform or performance-marketing owners; merchant opt-in rather than standalone vendor deal
    - Important substitute because it can absorb part of the workflow without buying SpreeAI
  - - Beauty, eyewear, and jewelry try-on
    - Cross-category try-on spend where visual overlay is the main job
    - Categories that do not map cleanly to apparel drape, fit, and sizing logic
    - Category managers or brand teams in non-apparel verticals
    - Adjacent but not core because SpreeAI's retained evidence is fashion-specific
  - - In-store smart mirrors and immersive hardware
    - Mirror hardware, scanners, kiosks, and store-fixture programs
    - Pure software embedded in web or app PDPs
    - Store operations or capex owner
    - Mostly excluded because public VFR reports over-count these budgets versus SpreeAI's software-first model
  notes: Boundary uses SpreeAI's current product claims plus retained public market segmentation to separate software-led apparel workflows from broader immersive-commerce spending.
