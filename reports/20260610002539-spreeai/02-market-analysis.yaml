- id: market-sizing
  title: 'Sizing lenses: TAM, SAM, and SOM constraints'
  body: 'The largest public market shells are the online-fashion commerce market and the broader virtual fitting room market, but neither is a clean revenue pool for SpreeAI. Shopify frames fashion ecommerce at roughly USD 957 billion in 2026, while the Census shows U.S. ecommerce alone already at USD 326.7 billion in Q1 2026 and 16.9% of retail. Against that spend base, analyst estimates for virtual fitting rooms range from about USD 5.57 billion in 2024 to USD 8.27 billion in 2026, with long-term forecasts to USD 20.65 billion by 2030 or USD 30.41 billion by 2034 depending on source and scope. Those estimates are directionally useful because they consistently identify apparel, software, and virtual-store use cases as the largest pools. They are not clean SAMs for SpreeAI. A realistic SAM is narrower: online fashion merchants with meaningful returns pain, high-quality catalog data, and willingness to integrate customer-image or sizing flows. A realistic SOM is narrower still because public
    sources do not disclose SpreeAI pricing, customers, or deployment scale, and platform bundles from Google and Snap can capture portions of the workflow before an independent vendor does.'
