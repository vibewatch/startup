- id: buyer-map
  title: Buyer, user, payer, and adoption path
  body: The likely economic buyer is the ecommerce or digital-merchandising leader who owns conversion, return-rate, and merchandising KPI pressure, but the operational user base is broader. Product, merchandising, CRM, and ecommerce operations teams all touch the workflow because virtual try-on depends on image quality, size data, catalog structure, and downstream analytics. IT or engineering gets pulled in when the retailer needs a storefront integration, data export, or identity and consent controls. Finance becomes the payer or final approver when the solution is framed as margin protection or a multi-channel software line item rather than a creative experiment. The adoption path generally starts with a high-return category such as dresses, denim, or footwear, then moves to a limited pilot where the retailer measures conversion lift, return-rate change, and data quality. Vendors that can show recommendation coverage, SKU-level logic, and transparent feedback loops have the strongest
    shot at winning budget.
  claimRefs:
