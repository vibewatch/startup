  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: spreeai-pricing-and-capture
    missingEvidence: SpreeAI's pricing model, contract structure, deployment fees, and customer count are not publicly disclosed.
    whyItMatters: Without pricing and customer data, there is no defensible public bridge from generic category TAM to SpreeAI revenue capture.
    diligencePath: Request a customer list, pricing sheets, live contract examples, and category-level ACV / ROI cohorts from management.
    relatedQuestionRefs:
    - QM008
    - QM025
  - type: missing-source
    severity: material
    topic: spreeai-independent-case-studies
    missingEvidence: Independent retailer case studies for SpreeAI specifically, with measured conversion and return outcomes, were not found in retained public sources.
    whyItMatters: Third-party proof is required to separate SpreeAI's product claims from category-level optimism around try-on and fit tech.
    diligencePath: Ask for attributable customer references, before-and-after KPI decks, and category breakouts by apparel type.
    relatedQuestionRefs:
    - QM012
    - QM013
    - QM025
  - type: access-blocked
    severity: minor
    topic: paywalled-market-methodology
    missingEvidence: Full methodologies behind several analyst market reports remain paywalled or only partially visible in public summaries.
    whyItMatters: Methodology opacity is one reason public market sizes disagree and should not be over-trusted.
    diligencePath: Acquire full analyst reports only if needed for board materials; otherwise keep using multiple retained shells with explicit caveats.
    relatedQuestionRefs:
    - QM005
    - QM023
  - type: missing-source
    severity: material
    topic: privacy-implementation-details
    missingEvidence: SpreeAI-specific data retention, consent design, and jurisdictional compliance controls are not described in retained public sources.
    whyItMatters: Privacy and biometric rules can materially affect deployment speed, conversion friction, and enterprise buyer approval.
    diligencePath: Request SpreeAI's data flow diagram, DPA, retention schedule, and jurisdiction-by-jurisdiction compliance playbook.
    relatedQuestionRefs:
    - QM017
    - QM025
