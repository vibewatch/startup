- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Online fashion scale and digital penetration
    - Positive
    - Current
    - Large online apparel shell creates persistent decision-support need
    - What share of SpreeAI pipeline comes from apparel categories with structurally high returns?
  - - Returns economics and shopper expectations
    - Positive
    - Current
    - Retailers need margin relief without removing generous return policies
    - Can SpreeAI show measured return-rate deltas by category and cohort?
  - - Platform normalization by Google, Snap, and Shopify
    - Positive for adoption; negative for capture
    - Current to medium term
    - Category legitimacy rises, but platforms may bundle core functionality
    - How often does SpreeAI win when a retailer already uses platform-native try-on tools?
  - - Fashion AI as a 2026 executive priority
    - Positive
    - Current
    - Budgets may be easier to sponsor when AI is framed as productivity and personalization
    - 'Which internal KPI owner signs the deal: ecommerce, merchandising, operations, or CX?'
  - - Implementation cost and content readiness
    - Negative
    - Current
    - 3D assets, imagery QA, and integration work slow smaller buyers
    - How many weeks and how much client labor does a live deployment require?
  - - Metadata quality and sizing inconsistency
    - Negative
    - Current
    - Poor size charts or product data can break fit accuracy even when rendering looks good
    - What minimum data schema does SpreeAI require per SKU and per category?
  - - Biometric and privacy compliance
    - Negative
    - Current to medium term
    - Consent, retention, and jurisdictional rules can add legal review and UX friction
    - What personal data is stored, for how long, and under what user consent flow?
  - - Brand-fidelity and realism limits
    - Negative
    - Current
    - Luxury and fit-sensitive buyers may reject outputs that look plausible but not correct
    - What measured accuracy, confidence, and return outcomes exist by fabric and silhouette?
  notes: Direction reflects effect on SpreeAI's opportunity, not whether the broader retail industry likes the trend; several positive drivers also strengthen platform substitutes.
