  - type: missing-source
    severity: material
    topic: public-api-docs
    missingEvidence: Public API reference, SDK documentation, sandbox instructions, and implementation checklist for partner onboarding.
    whyItMatters: |-
      Without public technical docs it is difficult to verify integration depth, implementation burden, and how much partner rollout depends on custom services.
    diligencePath: |-
