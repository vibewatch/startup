  - type: private-evidence-only
    severity: material
    topic: sizing-benchmark
    missingEvidence: |-
      Independent benchmark design, sample size, merchant mix, and confidence intervals supporting the 99% sizing-accuracy and conversion-impact claims.
    whyItMatters: |-
      Sizing accuracy is central to the economic case, but public sources only repeat company-originated figures and do not show external validation.
    diligencePath: |-
      Request retailer-by-retailer test methodology, holdout design, false-positive / false-negative breakdowns, and any third-party validation report.
    relatedQuestionRefs:
    - QE005
    - QE024
  - type: private-evidence-only
    severity: material
    topic: security-attestations
    missingEvidence: |-
      SOC 2 / ISO 27001 status, security questionnaire responses, DPA terms, subprocessor list, and latest penetration-test summary.
    whyItMatters: |-
      Policy-level claims are useful, but production diligence for biometric data processors usually requires documentary proof and contractual controls.
    diligencePath: |-
