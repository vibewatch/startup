- id: TE004
  title: Trust / Privacy / Security / Compliance Table
  columns:
  - Control / Obligation
  - Public Status
  - Scope
  - Gap / Diligence Ask
  rows:
  - - Biometric consent
    - Explicitly disclosed
    - Privacy policy says biometric data is collected only with explicit consent
    - Request enterprise implementation detail for how retailer UX captures, stores, and audits consent
  - - Deletion rights
    - Explicitly disclosed
    - Users may request deletion of biometric data and other personal information
    - Request retention schedule, deletion SLA, and partner-shared data deletion workflow
  - - Encryption and RBAC
    - Explicitly disclosed
    - TLS in transit, AES-256-or-equivalent at rest, role-based access controls
    - Request architecture evidence, key-management details, and scope across sub-processors
  - - Security testing and incident response
    - Explicitly disclosed at policy level
    - Regular security assessments / penetration testing and incident response procedures
    - Request latest pen-test summary, remediation cadence, and breach-notification commitments
  - - Partner data sharing
    - Explicitly disclosed
    - Try-on results or fit data may be shared with partner retailers when the experience runs through them
    - Request data-flow map, DPA, subprocessor list, and cross-border transfer controls
  - - Public trust artifacts
    - Not publicly surfaced
    - No public SOC 2, ISO 27001, status page, or trust center on the official site
    - Treat enterprise security/compliance posture as unverified until documents are reviewed directly
  notes: |-
