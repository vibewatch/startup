- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Key Dependency
  - Primary Risk
  rows:
  - - Client capture layer
    - Collects shopper photo, optional measurements, and interaction state across web/mobile
    - Retailer UI integration plus mobile/web client code
    - No public SDK or API docs show exact client contract or device constraints
  - - Try-on / multimodal research layer
    - Improves realism, controllability, pose consistency, and garment rendering
    - Diffusion, multimodal transformers, video modeling, adapters/LoRA, human-centric representation learning
    - Public understanding comes from hiring copy rather than published papers or benchmarks
  - - Serving and inference layer
    - Runs production model inference for partner traffic
    - GPU orchestration plus runtimes such as Triton, vLLM, Ray Serve, ONNX Runtime, or TorchServe
    - Latency, GPU cost, and drift control are core operating risks for retailer-grade UX
  - - ML platform layer
    - Handles training, evaluation, registry, lineage, checkpointing, and deployment automation
    - Internal platform standards and release pipelines
    - Complexity suggests meaningful engineering overhead and operational dependence on platform maturity
  - - Evaluation / release gates
    - Benchmarks realism, consistency, regressions, and production readiness
    - Dataset-driven testing and CI/CD integration
    - No public quality report shows how these gates translate into field reliability
  - - Partner enablement layer
    - Supports retailer integration, testing, and rollout
    - Partner portal and Protea / pilot workflows
    - Managed-integration motion may scale slower than true self-serve APIs if implementation remains services-heavy
  notes: |-
    Architecture is inferred from public product pages, public hiring material, and patent disclosures. It should be read as the most defensible public model of the stack, not as vendor-confirmed internal architecture documentation.
