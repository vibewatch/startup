- id: s504
  title: Trust, Privacy, Security, Compliance, and Technical Risk
  body: |-
    For diligence purposes, SpreeAI's trust surface is both material and incomplete. The privacy policy explicitly says the service spans the website, APIs, mobile applications, and retailer integrations, and it confirms that the company processes photographs, body measurements, and biometric identifiers or biometric information to provide virtual try-on and sizing. It also states that biometric use requires explicit consent, that users can request deletion, and that try-on or fit data may be shared with the retailer when the experience runs through a retailer platform. Those are necessary disclosures for a product category built on sensitive personal data.

    The policy also lists concrete security controls — TLS in transit, AES-256-or-equivalent encryption at rest, role-based access controls, regular security assessments or penetration testing, and incident-response procedures. That is stronger public disclosure than many early-stage fashion-tech companies provide. But the public site does not surface the evidence enterprise buyers normally use to verify those statements, such as SOC 2, ISO 27001, a trust center, uptime history, public subprocessor disclosure, or downloadable security questionnaires.

    The terms layer adds more operational risk. They describe user data broadly enough to include scans, images, videos, size, height, and weight, and they authorize company and service-provider use of that data to operate, improve, and promote the service. They also disclaim continuity for features that depend on third-party products. In practice, that means diligence cannot stop at consumer policy review; a serious enterprise buyer still needs direct review of DPA terms, retention schedules, vendor boundaries, implementation architecture, and reliability commitments before treating SpreeAI as a low-risk production dependency.
  claimRefs:
