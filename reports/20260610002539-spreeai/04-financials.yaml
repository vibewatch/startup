- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: |-
    Financially, SpreeAI looks like a potentially attractive enterprise fashion-tech platform whose narrative is ahead
    of its disclosure set. The company seems to have a plausible revenue engine — enterprise retailer contracts with
    integration, try-on, sizing, and partner-tooling modules — and the category economics can work if conversion lift
    and return reduction are real at customer level. But the public record does not yet show realized pricing,
    customer concentration, renewal rates, gross margin, or burn discipline. That means investors can underwrite the
    story, not the model.

    The immediate diligence priority is not more top-of-funnel brand narrative; it is basic operating proof. A clean
    investment case would need cohort-level retailer results, contract structures, deployment costs, revenue mix,
    and cash/runway disclosure. Until that evidence is produced, the financial verdict is mixed: revenue quality is
    unproven, margin path is unproven, capital intensity is likely non-trivial, and financing dependency cannot be
    precisely sized. SpreeAI should be treated as a custom enterprise software-and-services business with potentially
    powerful category tailwinds, but not as a validator-clean growth story on public metrics alone.
  claimRefs:
  - CI007
  - CI023
