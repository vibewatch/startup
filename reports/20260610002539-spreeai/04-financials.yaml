- id: traction-gaps
  title: Public traction signals versus missing private metrics
  body: |-
    Public traction is visible mostly through positioning, partnerships, and headcount — not through financial
    disclosures. Multiple 2025 sources repeat a $1.5 billion valuation, and company-controlled announcements tie that
    financing narrative to new designer partnerships, patents, and broader fashion-industry visibility. LinkedIn and
    Tracxn place the company in a roughly 30-36 employee band, while public profiles consistently describe the
    business as a Series B virtual-try-on platform serving apparel brands. Those signals are enough to show the
    company is not pre-product or invisible, but they do not establish durable revenue quality.

    The missing metrics are exactly the ones needed for underwriting: no public ARR, no disclosed GMV processed
    through partner storefronts, no verified customer count, no retailer retention, no cohort-level return-reduction
    outcomes, no gross margin, and no channel or sales-efficiency data. Even capital databases disagree on the basic
    funding denominator, with GetLatka citing $22.5 million raised, Premier Alternatives citing $70.0 million, and
    Tracxn leaving the amount undisclosed. The result is a public picture where valuation optics are cleaner than the
    underlying operating metrics. SpreeAI may well have strong retailer momentum, but public evidence today supports a
    diligence posture of “interesting category and strong narrative, insufficient disclosed metrics.”
