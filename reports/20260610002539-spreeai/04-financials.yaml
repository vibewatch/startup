- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: |-
    The only hard primary-source financing datapoint in the reviewed set is SpreeAI's SEC Form D. That filing shows
    a $10 million exempt offering, $5 million sold, one investor, and $2.53 million of proceeds proposed for payments
    to named executives, directors, or promoters. It also explicitly declines to disclose the issuer's revenue range.
    That filing proves SpreeAI has used private-placement financing, but it does not establish the current 2026 cash
    balance, current burn, or remaining runway. Later secondary sources imply a much larger May 2025 financing event
    behind the $1.5 billion valuation, but they conflict on how much capital has actually been raised in total.

    That conflict matters because SpreeAI's operating model is likely cash-consuming even before direct revenue scale
    is visible. A business that promises photorealistic try-on, fit intelligence, partner integrations, garment
    ingestion, privacy controls, and retailer support almost certainly bears ongoing spend on engineering, model
    training, cloud inference, security/compliance, and enterprise onboarding. The privacy policy also shows that the
    product touches biometric data, which creates additional compliance and governance overhead. Without disclosed burn
    or cash, the prudent conclusion is that capital adequacy cannot be verified publicly. SpreeAI may be well funded,
    but the evidence is insufficient to determine whether 2025 valuation optics translate into multi-year runway or a
    near-term need for additional external financing.
