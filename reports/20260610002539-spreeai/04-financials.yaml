- id: unit-economics
  title: Unit economics proxies and GTM motion
  body: |-
    SpreeAI does not publish CAC, payback, gross margin, or retailer-level ROI cohorts, so public analysis has to
    rely on operating cues and category proxies. The product pitch emphasizes under-three-second rendering, one-photo
    onboarding, no downloads, and branded fit calibration. Those claims matter financially because they point toward
    a lower-friction retailer implementation and a shopper experience designed to lift conversion rather than to add
    a separate consumer destination. LinkedIn also describes garment-ingestion at scale, partner insights, and SDKs
    for web and mobile, implying that onboarding labor, catalog preparation, and account support are meaningful cost
    drivers even if exact service-delivery margins are unavailable.

    The best public proxies come from adjacent fit-and-try-on vendors rather than SpreeAI itself. True Fit reports
    1-2% sitewide conversion lift and up to 40% fit-related return reduction when its guidance is used, while 3DLOOK
    reports 96-97% body-measurement accuracy and 3.5% average weight-prediction error for its scanning stack.
    Those are not SpreeAI results and should not be treated as company traction, but they do show why apparel brands
    buy this category at all: modest conversion lift or return reduction can support meaningful enterprise ACV even
    without consumer subscription revenue. The diligence problem is that SpreeAI has not published its own realized
    lift, return delta, onboarding cost, or renewal performance, so the category thesis is stronger than the
    company-specific unit economics.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI005
