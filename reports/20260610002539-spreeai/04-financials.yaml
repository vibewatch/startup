company:
  name: SpreeAI
chapter:
  number: 4
  title: Financials
  summary: |-
    SpreeAI appears to monetize primarily through custom B2B retailer and brand contracts for photorealistic try-on,
    sizing, and partner tooling, but public underwriting evidence is thin: there is no disclosed list pricing,
    no verified revenue, no published ARR, and no public gross-margin or burn disclosure. The strongest hard
    financing datapoint is a 2023 SEC Form D showing a $10 million exempt offering with $5 million sold, while
    later secondary databases disagree sharply on total funding ($22.5 million, $70 million, or undisclosed)
    even as multiple 2025 sources repeat a $1.5 billion valuation. Public evidence therefore supports a custom,
    enterprise-led revenue model and strong fundraising optics, but not a clean view of revenue quality,
    unit economics, or runway.
sections:
- id: revenue-model
  title: Revenue model and pricing evidence
  body: |-
    The public evidence points to SpreeAI selling primarily through custom retailer and brand relationships rather
    than a self-serve consumer subscription. The homepage, product page, LinkedIn profile, and privacy policy all
    frame the platform as retailer-integrated virtual try-on, sizing, and partner tooling that runs inside partner
    storefronts, partner APIs, or branded surfaces. The create-account flow does not show a price grid, and the
    product page instead offers catalog-based demonstrations, which is consistent with an enterprise sales motion.

    The strongest public monetization cue is actually the lack of public monetization detail: SpreeAI's end-user
    terms say business partners and corporate clients should use separate customer terms, while the same terms also
    reference statements of work and 30-day invoice payment cycles. That combination suggests custom contracting,
    implementation scoping, and negotiated pricing, but it does not reveal ACV, minimum commitments, module pricing,
    or whether retailer contracts are recurring software subscriptions, services-heavy onboarding agreements, or a
    hybrid of both. The company also references partner tools, garment-ingestion workflows, APIs, and multi-surface
    SDKs, which supports a revenue model anchored on enterprise software access plus onboarding work, but public
    revenue recognition mechanics remain undisclosed.
  claimRefs:
