  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Risk or upside
      - Direction
      - Why it matters
      - Public signal
      - Diligence path
    rows:
      - - Sergio template can replicate
        - Upside
        - A live luxury deployment can become a reference architecture for similar brands
        - Joint release, WWD, and live Sergio page align
        - Ask for new brands won off the Sergio reference
      - - Kai broadens segment reach
        - Upside
        - Digitally native brands widen applicability beyond one luxury label
        - Kai collaboration cited by WWD and launch materials
        - Verify whether Kai is live and whether the brand expanded usage
      - - CFDA channel leverage
        - Upside
        - Industry access can reduce trust barriers with designers and brands
        - Public CFDA event and endorsement
        - Request pipeline and wins sourced through the CFDA relationship
      - - Small public proof set
        - Risk
        - Few named accounts can overstate diversification and roadmap breadth
        - Sergio, Kai, and CFDA dominate public evidence
        - Request full merchant count and top-10 concentration
      - - Merchant economics opaque
        - Risk
        - Without NRR, GRR, or renewal data, it is hard to separate novelty from durable spend
        - No public cohort or renewal metrics
        - Request merchant-level retention and expansion data
      - - Legal / privacy review burden
        - Risk
        - Biometric consent and partner data-sharing requirements can slow enterprise adoption
        - Privacy policy and terms
        - Request standard DPA package, retention schedule, and security-review cycle times
    notes: This table separates credible fashion-brand expansion vectors from the equally real risk that public proof remains concentrated and economics-light.
