  - id: TU006
    title: Implementation and data-governance friction table
    columns:
      - Friction point
      - Public evidence
      - Customer impact
      - Confidence
      - Mitigant or follow-up
    rows:
      - - Biometric consent
        - Privacy policy says photographs and biometric identifiers are processed with explicit consent
        - Adds legal-review and UX-consent work for merchants
        - Medium
        - Review consent flow and merchant implementation burden
      - - Partner data sharing
        - Policy says try-on results or fit data may be shared with partner retailers
        - Requires merchant comfort on data flows and consumer disclosures
        - Medium
        - Request sample partner privacy terms and DPA language
      - - Broad user-data license
        - Terms grant rights to host, analyze, and distribute content including avatars
        - Can trigger negotiation for enterprise merchants and premium brands
        - Medium
        - Clarify enterprise overrides in customer contracts
      - - Privacy / security diligence
        - Policy references encryption, access controls, and biometric retention commitments
        - Positive baseline but still invites customer security review
        - Medium
        - Request SOC-style materials or independent audit packet
      - - Simulated external metrics
        - Only concrete onboarding / NRR figures reviewed came from an explicitly simulated SWOT site
        - Outside investors may over-read unreliable numbers
        - Low
        - Treat numeric claims as unverified until management provides raw data
    notes: The friction table isolates non-product reasons why merchant adoption could move slower than the on-site demo language suggests.
