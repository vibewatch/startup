chapter:
  number: 6
  title: Customers
  summary: SpreeAI has enough public customer proof to show real fashion-brand adoption, but not enough to prove a broad or durable merchant base. Sergio Hudson is the clearest named production-style proof because a joint release, WWD coverage, and a still-live Sergio collection page all line up; Kai Collective and CFDA broaden the story, but public evidence remains concentrated in a small number of fashion relationships. Retention, merchant count, and concentration economics are still the biggest diligence gaps.
sections:
  - id: customer-segmentation-and-buying-centers
    title: Customer pattern is brand-led commerce enablement, with shoppers as users and merchants as payers
    body: |
      SpreeAI’s public customer motion is not a generic horizontal consumer app. The official partner,
      product, and onboarding surfaces all point to a B2B commerce model where fashion brands,
      e-commerce retailers, and high-touch luxury sellers are the economic buyers, while shoppers are
      the day-to-day users inside those merchants’ own experiences. The shopper uploads one photo,
      sees a photorealistic try-on, and gets fit guidance without downloading a separate app or
      leaving the merchant session. That matters because it clarifies who pays, who uses, and who
      benefits. The brand gets conversion and return-reduction upside; the shopper gets more
      confidence and less guesswork. The named public proof also clusters in fashion-first segments
      rather than broad retail: Sergio Hudson in luxury ready-to-wear, Kai Collective in digitally
      native contemporary fashion, and CFDA as an ecosystem channel into designer and brand
      relationships. Fashinnovation and Vogue UA extend that picture by framing SpreeAI as
      omnichannel infrastructure for online, in-store, and very-important-client contexts, which is a
      stronger fit with premium fashion commerce than with commodity mass retail.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU007
      - CU008
      - CU018
      - CU022
      - CU041
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-named-proof
    title: Adoption proof moved from broad positioning into a small but real set of named fashion relationships
    body: |
      The most important customer-development fact in this chapter is that SpreeAI’s public evidence
      has advanced beyond abstract product marketing, but only narrowly. May 2025 coverage
      established the company’s pitch around conversion and returns while flagging Sergio Hudson and
      Kai Collective as incoming fashion partners. By late 2025, that story became more concrete for
      Sergio Hudson: a joint December release called it SpreeAI’s first direct-to-consumer luxury
      fashion collaboration, said it went live in the United States on December 19, and described the
      technology as embedded in Sergio Hudson’s e-commerce experience. WWD independently reinforced
      that shoppers could experience the try-on on Sergio Hudson’s website, and the still-live
      “SPREEAI X Sergio Hudson Try-On Studio” collection page gives direct present-tense proof that
      the collaboration left announcement mode and became a customer-facing surface. Kai Collective
      is weaker proof: multiple reputable sources describe the collaboration, but the reviewed
      sources did not independently verify a live Kai shopping page. CFDA sits in between those two
      poles. It is not the same as a paying merchant, yet it broadens SpreeAI’s top-of-funnel access
      to designers and brands and shows the company is already selling a brand-native story into the
      fashion establishment.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
