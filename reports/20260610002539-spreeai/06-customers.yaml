    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Representative proof
      - Use case
      - Scale / strategic value
      - Gap
    rows:
      - - Luxury ready-to-wear labels
        - Brand founder or e-commerce lead buys; shopper uses; brand pays
        - Sergio Hudson
        - Photorealistic try-on for high-consideration ready-to-wear pieces
        - Strongest live named proof
        - No contract size, renewal, or multi-collection rollout data
      - - Digitally native contemporary womenswear
        - Brand leadership buys; global online shoppers use; brand pays
        - Kai Collective
        - Virtual try-on for digitally native boutique shopping
        - Named public collaboration
        - Live merchant page not independently verified in reviewed sources
      - - Designer / brand ecosystem channel
        - Designers and brands are economic buyers; shoppers remain users
        - CFDA conversation and ecosystem access
        - Brand education, credibility, and designer pipeline access
        - Broadens top-of-funnel beyond one label
        - Not equivalent to disclosed merchant ARR
      - - Enterprise fashion retailers and omnichannel merchants
        - Commerce, digital, and store-experience teams buy; shoppers use
        - Partners page, product page, create-account flow
        - Site, app, and in-store deployment with one-photo try-on
        - Clear ICP and onboarding motion
        - No named multi-brand retailer publicly confirmed
      - - VIP / clienteling programs
        - Personal stylists or high-touch sellers use on behalf of shoppers
        - Fashinnovation and product positioning
        - Remote styling and personalized high-touch commerce
        - Attractive luxury expansion vector
        - No named VIC customer publicly disclosed
    notes: Rows distinguish named live or announced proof from the broader buyer-user-payer pattern visible on SpreeAI’s current GTM surfaces.
