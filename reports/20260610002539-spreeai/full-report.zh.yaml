  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 底线：价格支撑仍落后于叙事
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 有足够信号留在尽调名单上：产品故事清楚，公司有公开的时尚行业验证，存在专利，独立媒体也反复提到 $1.5 billion
              的估值锚点。但估值论据仍比叙事论据薄。最强的公开运营证据仍来自公司自报或活动阶段证据，比如约 60% 的 Try On 点击会转化、部署可以很快上线等说法。SEC
              轨迹确认存在真实的豁免融资活动，但这些文件仍未披露收入、留存、毛利率或优先权条款。因此，公开证据无法把报道中的估值转化为风险调整后的入场案例。正确建议是继续研究，置信度中等、风险高、估值立场偏高。SpreeAI
              可能是一个强产品和强品牌故事，但公开证据尚不足以让它被当作已降风险的软件可比公司。
