      - number: '2.2'
        title: 规模测算视角：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >-
              最大的公开市场外壳是在线时尚电商市场和更广义的虚拟试衣间市场，但二者都不是 SpreeAI 的干净收入池。Shopify 将 2026 年时尚电商规模框定在约 USD 957 billion；Census
              则显示，仅美国电商在 2026 年 Q1 已达到 USD 326.7 billion，占零售 16.9%。对照这块支出基数，分析师对虚拟试衣间的估算从 2024 年约 USD 5.57 billion 到
              2026 年 USD 8.27 billion 不等，长期预测则因来源和范围不同，到 2030 年达 USD 20.65 billion，或到 2034 年达 USD 30.41
              billion。这些估算方向上有用，因为它们持续把服装、软件和虚拟门店用例列为最大池子。但它们不是 SpreeAI 的干净 SAM。现实 SAM
              更窄：有明显退货痛点、高质量目录数据，并愿意集成客户图像或尺码流程的在线时尚商户。现实 SOM 还要更窄，因为公开来源没有披露 SpreeAI 定价、客户或部署规模，而 Google 和 Snap
              的平台打包可以在独立供应商之前吃掉部分工作流。
