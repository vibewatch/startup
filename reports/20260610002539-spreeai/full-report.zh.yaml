          detail: John Imah 和狭窄的董事会—合作伙伴网络承担过大的信号权重
        - id: buyer_trust
          label: 买方信任
          detail: 企业部署和续约意愿
        - id: revenue_quality
          label: 收入质量
          detail: 转化和降低退货结果的持久性
        - id: financing
          label: 融资杠杆
          detail: 以支持性条款继续融资的能力
        - id: valuation
          label: 估值支撑
          detail: 独角兽定价是否仍站得住
      edges:
        - from: privacy_gap
          to: security_event
          label: 未回答的控制问题放大事件严重性
        - from: security_event
          to: buyer_trust
          label: 损害企业和消费者信任
        - from: partner_signal
          to: buyer_trust
          label: 削弱市场证明
        - from: key_person
          to: financing
          label: 改变投资者信心
        - from: buyer_trust
          to: revenue_quality
          label: 影响转化、留存和案例推荐
        - from: revenue_quality
          to: financing
          label: 塑造尽调和轮次条款
        - from: financing
          to: valuation
          label: 决定外部定价能力
        - from: revenue_quality
          to: valuation
          label: 支撑或削弱独角兽叙事
