        title: 身份与产品模式
        blocks:
          - type: paragraph
            body: >-
              即便公开信息对公司正式在哪里、何时成立说法不一，SpreeAI
              的公开材料对其想卖什么仍然一致。官网首页和产品页描述了一套单照片系统，结合写实试穿、合身或尺码预测、造型逻辑；材料还称，该体验不需要下载、跳转或重新拍摄，并能在三秒内给出试穿结果。合作伙伴页面把产品定位为面向零售商的白标部署，可快速上线并嵌入现有电商技术栈。SpreeAI
              的隐私政策把这套营销语言落到正式公司身份上：SpreeAI Corporation
              是一家时尚科技公司，通过网站、API、移动应用和合作伙伴集成服务零售商与消费者。公开记录不稳定的地方在身份元数据：LinkedIn 称公司成立于 2023 年、总部位于 Los Angeles，条款只列出
