      - number: '3.3'
        title: 分发力量、内部自建与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              最危险的替代品并不都长得像直接试穿供应商。Google 可以把虚拟试穿直接放进 Shopping 发现环节；Snap 可以让品牌把身体追踪 AR 嵌入自己的应用和网站，同时发布到 Snapchat
              的受众。Shopify 进一步降低门槛，因为它已经在受支持主题上原生支持产品图片、视频和 3D/AR 媒体。这意味着一些商户可以用平台媒体、AR
              模板和合身插件拼出更轻的替代方案，而不是购买完整专业工作流。对更小或偏实验的团队来说，这点重要，因为 FASHN 也提供低成本自助入口。因此，现状不是“不做事”这么简单。它可以是高质量摄影、尺码指导、3D
              媒体，以及叠在现有电商技术栈上的轻量 AR 或合身插件。当商户想让一个供应商负责引导上线和会话内信心时，SpreeAI 仍能讲出更简单的故事，但市场显然从上方和下方都提供了可信的部分替代方案。
