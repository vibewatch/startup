      - number: '5.4'
        title: 信任、隐私、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，SpreeAI
              的信任界面既重要又不完整。隐私政策明确称，服务覆盖网站、API、移动应用和零售商集成，并确认公司处理照片、身体测量，以及生物识别标识符或生物识别信息，用于提供虚拟试穿和尺码服务。政策还说明，使用生物识别需要明确同意，用户可以请求删除，当体验运行在零售商平台上时，试穿或合身数据可能与零售商共享。这些都是建立在敏感个人数据之上的产品类别所必需的披露。

              政策还列出具体安全控制：传输中 TLS、静态 AES-256 或同等加密、基于角色的访问控制、定期安全评估或渗透测试，以及事件响应流程。这比许多早期 fashion-tech
              公司提供的公开披露更强。但官网没有给出企业买方通常用来验证这些说法的证据，例如 SOC 2、ISO 27001、信任中心、正常运行时间历史、公开子处理方披露，或可下载安全问卷。

              条款层又增加运营风险。条款对用户数据描述足够宽，涵盖扫描、图像、视频、尺码、身高和体重，并授权公司和服务提供商使用这些数据来运营、改进和推广服务。条款还对依赖第三方产品的功能连续性作出免责。实际含义是，尽调不能停在消费者政策审阅；严肃企业买方在把
              SpreeAI 当成低风险生产依赖之前，仍需要直接审查 DPA 条款、留存计划、供应商边界、实施架构和可靠性承诺。
