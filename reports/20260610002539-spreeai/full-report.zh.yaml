  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻合身供应商与平台替代方案
        blocks:
          - type: paragraph
            body: >-
              最接近 SpreeAI 的直接替代方案，是那些承诺提供面向商户的虚拟试衣或试穿层、而不只是尺码建议的供应商。DRESSX、FASHN 和 Style.me 都属于这一类，但路径不同。DRESSX
              销售更宽的模块化套件，覆盖电商试穿、AI 内容，甚至店内镜子。FASHN 看起来更可组合、更偏开发者，公开定价和 API 文档。Style.me 强调托管式 3D
              试衣间，包含头像、尺码、造型和分析。第二类竞争者用合身智能而不是渲染试穿图像来攻击同一个转化问题：True Fit、Bold Metrics 和 3DLOOK
              都销售基于尺码、测量和身体数据的购买信心。第三类来自平台替代方案和新进入者。Google 现在在 Shopping 里拥有面向消费者的试穿界面，Snap 提供 AR 工具和分发，Shopify 已经原生支持 3D
              和 AR 产品媒体。这意味着买方可以选择专业套件、合身智能层，或部分内部自建，而不是只有一个供应商类别。
