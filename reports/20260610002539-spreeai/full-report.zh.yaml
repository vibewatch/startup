  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价证据
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，SpreeAI 主要通过定制化零售商和品牌关系销售，而不是自助式消费者订阅。官网首页、产品页、LinkedIn
              资料和隐私政策都把平台描述为零售商集成的虚拟试穿、尺码和合作伙伴工具，运行在合作伙伴店面、合作伙伴 API 或品牌自有界面内。创建账户流程没有显示价格表，产品页反而提供基于目录的演示，这符合企业销售动作。

              最强的公开变现线索，其实是缺少公开变现细节：SpreeAI 的终端用户条款称，业务合作伙伴和企业客户应使用单独客户条款；同一条款还提到工作说明书和 30
              天发票付款周期。这组信息指向定制合同、实施范围界定和谈判定价，但没有揭示
              ACV、最低承诺、模块定价，也没有说明零售商合同是经常性软件订阅、服务较重的引导上线协议，还是二者混合。公司还提到合作伙伴工具、服装摄入工作流、API 和多界面
              SDK，支持一种锚定企业软件访问加上线工作的收入模式，但公开收入确认机制仍未披露。
