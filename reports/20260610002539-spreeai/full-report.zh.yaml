      - number: '8.2'
        title: 融资证明存在，但公开经济性仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开融资记录有利有弊。SEC Form D/A 有用，因为它显示了真实的私募轮次结构：$30 million 豁免发行、已售出 $15 million，截至 2024 年 7 月修订时披露一名投资者。但同一条
              SEC 轨迹也凸显了核心估值问题：公开语料仍缺少经审计的运营数据、客户集中度和详细轮次经济条款。独立报道补充了有用背景：Inc. 称公司已融资近 $100 million，接近 40 个伙伴，消费者发布窗口约在
              2025 年末或 2026 年初。但这仍无法弥合故事与价格之间的缺口。监管敞口同样重要，因为 SpreeAI 明确处理生物识别和图像衍生数据。其隐私政策提到 BIPA，而美国隐私规则和 EU AI Act 在
              2026 年继续变厚。这不至于推翻投资逻辑，但会抬高执行和合规成本，而公司此时仍需要证明可规模化、耐久的软件经济性。
