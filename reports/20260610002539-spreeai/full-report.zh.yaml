      - number: '8.4'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              从继续研究走向可投资，路径很清楚，但需要大量证据。正向重估需要证明 SpreeAI 不只是视觉上
              impressive，而是商业上可复制：签约经常性收入、续约耐久性、不过度集中的客户结构，以及跨品牌成立的退货减少或转化提升。轮次本身也需要完全透明，因为即便标题投后估值真实，优先权条款也可能摧毁普通股结果。最后，公司应证明自己能让合规和信任随增长一起扩展，尤其是其政策披露已承认生物识别处理和多法域义务。在这些事项被确认之前，正确纪律不是否认上行，而是拒绝虚假的精确。这是一家公司值得继续尽调，而不是一个值得追价的价格。如果管理层能补上数据缺口，估值标记或许可以自圆其说；如果不能，向下重置路径会显著大于当前公开证据带来的上行惊喜。
