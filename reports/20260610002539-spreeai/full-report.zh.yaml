  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              SpreeAI
              的公开产品故事异常聚焦：一张购物者照片，应该在同一次会话里回答服装购买的核心问题——风格、合身度，以及“该搭什么”。首页和产品页持续描述这层界面上的三个模块：写实试穿、合身与尺码预测、穿搭智能；它们还强调，体验停留在零售商自有资产内，而不是把购物者跳转到单独应用。客户上传一张照片或使用预设模特，在三秒内看到渲染结果，查看合身信号，然后可直接进入结账。

              同一批页面也强调买方侧的低摩擦部署假设：不需要新摄影、不需要身体扫描，也不要求安装应用。SpreeAI
              还把自己定位为品牌校准，而不是通用方案；这点重要，因为服装合身容忍度会随版型、面料和商户陈列策略变化。合作伙伴页面把这一话术延伸到企业工作流，承诺平台无关的上线路径，可在约一周内上线，并把试点呈现为标准入口。

              公开界面缺什么，几乎和有什么一样重要。站点地图暴露的是紧凑的营销与政策足迹，而不是深文档技术栈，因此产品主张容易理解，却难以独立基准测试。这让运营方和购物者能清楚看到工作流命题，但实施深度、测量方法和客户结果证明大多仍在公开记录之外。
