      - number: '4.3'
        title: 公开牵引信号与缺失的私营公司指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力主要通过定位、合作伙伴和员工数可见，而不是财务披露。多个 2025 年来源重复 $1.5B 估值，公司控制的公告把这条融资叙事与新设计师合作、专利和更广时尚行业曝光联系起来。LinkedIn 和
              Tracxn 将公司放在约 30-36 人区间，公开资料也持续把业务描述为服务服装品牌的 Series B 虚拟试穿平台。这些信号足以说明公司不是产品前或不可见，但不能证明收入质量可持续。

              缺失指标正是承销所需的内容：没有公开 ARR，没有披露通过合作伙伴店面处理的
              GMV，没有经验证客户数，没有零售商留存，没有队列级退货减少结果，没有毛利率，也没有渠道或销售效率数据。甚至资本数据库连基本融资分母都不同：GetLatka 称已融资 $22.5 million，Premier
              Alternatives 称 $70.0 million，Tracxn 则不披露金额。结果是，公开图景里估值观感比底层运营指标更干净。SpreeAI
              也许确实有很强的零售商势能，但今天的公开证据支持的尽调姿态是：“有趣品类和强叙事，披露指标不足。”
