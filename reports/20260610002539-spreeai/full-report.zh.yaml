  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议仍为继续研究，因为叙事优势真实存在，但公开财务证明尚未跟上。
    data:
      nodes:
        - id: need
          label: 退货痛点存在
        - id: product
          label: 产品和品牌证明
        - id: price
          label: $1.5B 价格锚
        - id: gap
          label: 经济披露缺口
        - id: risk
          label: 竞争和合规风险
        - id: decision
          label: 继续研究
      edges:
        - from: need
          to: product
          label: 支撑需求
        - from: product
          to: price
          label: 解释叙事
        - from: price
          to: gap
          label: 需要证明
        - from: gap
          to: risk
          label: 提高下行敏感度
        - from: risk
          to: decision
          label: 阻止买入判断
        - from: gap
          to: decision
          label: 需要尽调
    approximationNotes: 逻辑链是分析师对公开证据的综合，不是公司提供的决策框架。
    claimRefs:
      - CV005
      - CV009
      - CV010
      - CV026
      - CV028
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 用不同公开可比公司倍数测算时，支撑 SpreeAI 据报道 $1.5B 估值所需收入会大幅变化。
    data:
      items:
        - label: 类 Shopify 的高端软件倍数
          value: 129.1
        - label: 类 ThredUp 的数字转售倍数
          value: 761.4
        - label: 类 Revolve 的时尚电商倍数
          value: 1315.8
        - label: 类 Stitch Fix 的受压缩时尚科技倍数
          value: 4054.1
      yAxis:
        label: 支撑 $1.5B 估值所需收入（USD M）
    approximationNotes: 每个柱状值只是用 $1.5B 除以引用的过去销售额倍数；该图仅作说明，不是对 SpreeAI 收入的预测。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可支撑价值区间很宽，因为公开证据尚未证明 SpreeAI 在软件溢价和时尚电商结果之间该落在哪一端。
    data:
      items:
        - label: 有软件式证明的乐观情景
          low: 1
          base: 1.4
          high: 1.8
          unit: USD B
          description: 需要经常性收入证明、强留存和可衡量的商户 ROI。
        - label: 完整证明前的基准情景
          low: 0.2
          base: 0.4
          high: 0.6
          unit: USD B
          description: 假设牵引力真实存在，但承销更接近增长型电商软件，而不是顶级平台软件。
        - label: 悲观情景 / 重估路径
          low: 0.05
          base: 0.2
          high: 0.5
          unit: USD B
          description: 反映推出速度放慢、合规摩擦，以及大型平台和同业带来的定价压力。
    approximationNotes: 区间是分析师基于公开可比倍数和有条件收入门槛构建的情景；当前披露有限，因此有意设得较宽。
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV049
      - CV050
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 可投性问题不在于 SpreeAI 有没有故事，而在于当前价格能否和已披露的经济证明挂钩。
    data:
      items:
        - label: 据报道估值
          value: '1.5'
          unit: USD B
        - label: 独立融资额
          value: ~100
          unit: USD M
        - label: 2024 Form D/A 已售金额
          value: '15'
          unit: USD M
        - label: 据报道合作伙伴数量
          value: ~40
        - label: 公开转化数据点
          value: ~60
          unit: '% of Try On clicks to sale'
        - label: 按 Shopify 倍数所需收入
          value: '129'
          unit: USD M
        - label: 按 Revolve 倍数所需收入
          value: '1316'
          unit: USD M
        - label: 建议
          value: research-more
        - label: 风险评级
          value: high
        - label: 估值立场
          value: stretched
    approximationNotes: KPI 混合了已确认公开数值，以及用公开市场倍数推导出的隐含收入测算。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV010
      - CV031
      - CV033
      - CV038
      - CV040
      - CV048
