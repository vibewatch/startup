      - number: '1.3'
        title: 融资、规模与披露质量
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的融资故事方向上强，但还没达到投资人通常需要的标准概览颗粒度。多方来源同意，公司在 2025 年 5 月 Davidson 领投后达到 $1.5B 估值，TechCrunch 又在 2026 年
              1 月把 SpreeAI 独立列入其 2025 年独角兽名单。更不确定的是资本结构规模和准确轮次标签。TechCrunch 引用 PitchBook 称 SpreeAI 已融资 $80M，成立于 2020
              年；更早的 People of Color in Tech 和 AFROTECH 资料称，公司到 2024 年已接近
              $60M。也就是说，在独角兽事件前已有相当资本进入，但保留的一手材料没有披露精确融资额、持股比例、清算优先权，或 2025 年轮次是否应在标准报道中视为 Series
              B。运营指标披露更薄：没有保留来源给出客户数、收入、ARR、债务或老股交易。目前最好的规模代理指标只能是 LinkedIn 的 11-50 人区间、公司页上约 30 名可见员工，以及横跨 Los
              Angeles、New York 和 San Francisco 的 13 个招聘岗位。
