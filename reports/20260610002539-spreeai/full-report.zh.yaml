      - number: '7.5'
        title: 监测指标与淘汰标准
        blocks:
          - type: paragraph
            body: >-
              这个故事要具备可投资性，就必须更快从叙事证明转向控制证明。核心尽调原则应当很简单：如果 SpreeAI 想用敏感数据消费 AI 支撑高溢价倍数，就需要以大致同样的节奏证明隐私治理、安全保证、可复制的企业 ROI
              和领导层厚度，而不是只推广估值和合作关系。因此，可监测触发器聚焦于难以包装的公开事实：隐私或安全事件、信任材料长期缺席、具名关联无法转化为生产环境背书、领导层流失，或有证据显示相邻供应商能提供接近同等的经济性。任何单一触发器都不必然意味着失败，但每一个都会显著提高一个概率：公司仍是包装良好的概念，而不是已降风险的软件业务。在这些缺口收窄前，本章应被视为一份谨慎的风险登记表，而不是轻微的附注。
