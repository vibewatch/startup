      - number: '5.3'
        title: 差异化、IP 与路线图信号
        blocks:
          - type: paragraph
            body: >-
              SpreeAI
              最强的公开护城河信号不是营销文案，而是近期专利活动与岗位描述共同指向一套垂直整合试穿技术栈。专利记录显示，公司在单张购物者图像远程服装合身、同时生成多个穿衣头像，以及把服装从一种身体拓扑映射到另一种身体拓扑的数字服装分级上有工作。这些申请让公司的差异化故事比常见的
              fashion-tech “AI 个性化”承诺更具体，因为它们指向明确的图像处理、合身建模和渲染工作流。

              公司自己的 2025 年传播周期补上了商业差异化层。多个分发版本的新闻稿称，当时 SpreeAI 已有 4 项授权专利、23 项待批专利，并推出 Protea 作为面向零售商的集成和测试平台。同一批来源以及后续
              Vogue 报道把路线图从当前试穿和尺码扩展到 AI 造型师、虚拟衣橱、更广泛的超个性化推荐，以及更连续的线上 / 线下购物旅程。方向上这有吸引力，因为它把 SpreeAI
              从减少合身问题的工具，扩展到篮子扩张和衣橱智能。

              不过，大多数路线图证据来自公司或由公司放大。公开材料没有展示版本化产品更新日志、具名 API 发布或基准报告，让外部审阅者无法区分已上线能力和规划能力。因此，SpreeAI 在工作流设计、时尚定位和 IP
              速度上看起来有差异化，但这些资产是否能转化为规模化、可防御的市场拉力，独立证明仍偏早。
