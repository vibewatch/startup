      - number: '4.2'
        title: 单位经济性代理指标与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 不公布 CAC、回本周期、毛利率或零售商级 ROI
              队列，因此公开分析只能依赖运营线索和品类代理指标。产品话术强调三秒内渲染、单照片引导、不需要下载，以及品牌校准的合身度。这些主张在财务上重要，因为它们指向摩擦更低的零售商实施，以及一种为提升转化而设计、而非新增独立消费者目的地的购物者体验。LinkedIn
              还描述了规模化服装摄入、合作伙伴洞察，以及面向 Web 和移动端的 SDK，意味着引导上线劳动、目录准备和客户支持都是重要成本驱动，即便具体服务交付毛利率不可得。

              最好的公开代理指标来自相邻合身和试穿供应商，而不是 SpreeAI 自身。True Fit 报告称，当其指导被使用时，全站转化率提升 1-2%，合身相关退货最多减少 40%；3DLOOK 报告其扫描技术栈有
              96-97% 身体测量准确率，以及 3.5% 平均体重预测误差。这些不是 SpreeAI
              结果，不应被视为公司牵引力，但它们确实说明服装品牌为什么会购买这一品类：即便没有消费者订阅收入，温和的转化提升或退货减少也能支撑可观的企业 ACV。尽调问题在于，SpreeAI
              没有公布自己的实际提升、退货变化、上线成本或续约表现，因此品类逻辑强于公司特定单位经济性。
