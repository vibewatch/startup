    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的公开叙事在产品野心、品牌伙伴和估值上很强，但在通常能为面向消费者的 AI
              平台降风险的控制证据上薄得多。最高的残余风险来自法律和隐私敞口：用户上传照片、身体测量数据和类似生物识别的几何信息，公司公开承诺同意、删除和加密，却没有发布信任材料、子处理方清单、审计报告或事故预案。第二组风险是集中度：John
              Imah、Bob Davidson 和少数具名伙伴，在融资、可信度和 GTM 信号上权重过大。运营和安全风险并不是今天已有披露的泄露事件，而是处理数据的敏感性与企业级控制证据有限之间的落差。最后，估值和 ROI
              故事仍跑在已披露的收入质量、客户留存和护城河耐久性证据前面，因此淘汰标准必须保持严格且可监测。
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
      - number: '7.2'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 不只是一个带虚拟演示的营销网站；其隐私政策写明，平台会处理照片、身体测量数据、生物识别标识符、伙伴集成和 AI 模型改进。这让隐私执行成为基础能力，而不是可选项。公司还对上传数据和生成的
              avatar 内容取得宽泛合同权利，同时要求终端用户接受仲裁和放弃集体诉讼。作为一家可能服务加州消费者、未来也可能触达欧盟用户的美国供应商，其法律栈横跨 CCPA 或 CPRA 权利、GDPR
              对画像和追踪的限制，以及 EU AI Act 和英国 ICO 指引所体现的更广 AI 治理方向。公开问题不是这些规则是否存在，而是 SpreeAI
              是否有文档、留存治理、供应商合同和通知流程，把规则落到运营里。由于这些控制没有公开证据，隐私和法律合规应排在尽调首位。
