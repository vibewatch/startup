        title: 耐久性证据是间接的，隐私和合同则制造真实采用摩擦
        blocks:
          - type: paragraph
            body: >
              公开耐久性证据明显弱于采用证据。没有审阅来源披露商户数量、NRR、GRR、logo 流失、合同期限或续约节奏。最好的公开耐久性代理指标是关系延续：Sergio 从春季公告报道推进到 12 月上线新闻稿，并且在
              2026 年 6 月访问日仍有在线试穿系列页面。这比只有 logo 的证明更好，但仍不是队列证据。另一个温和耐久性信号是部署设计。SpreeAI
              反复把自己描述为嵌入商户网站、应用和店内工作流的白标系统，而不是独立市场；集成完成后，这应当创造一定粘性。但潜在粘性伴随摩擦。隐私政策称，SpreeAI
              在明确同意下处理照片、身体测量和生物识别信息，并可能与合作零售商共享结果；条款则围绕用户数据、头像和公司内容授予广泛权利。对企业商户，尤其是守护客户信任的高端品牌而言，即便产品的购物者价值明显，这些要求也很可能拉长隐私、法律和采购审查。换句话说，公开记录显示通往耐久账户的路径合理，但没有证明耐久账户已经规模化存在。
