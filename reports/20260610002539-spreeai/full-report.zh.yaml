  - id: TV005
    title: 投资逻辑破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 完整尽调后仍缺少收入证明
        - 管理层无法提供已签 ARR、预订额和毛利率证据。
        - 估值仍只靠叙事，无法与软件经济性挂钩。
        - 暂停投资，或从低得多的基准重新定价。
      - - 客户集中度过高
        - 少数头部账户主导合同收入，或试点续约可见度弱。
        - 合作伙伴数量失去意义，客户流失带来的下行变成非线性。
        - 要求集中度契约、分阶段进入，或放弃。
      - - 合规准备度不成熟
        - 生物识别同意、数据治理和多司法辖区义务没有具体控制集。
        - 监管成本和事件风险可能抹掉早期商业收益。
        - 投资前要求补救计划。
      - - 竞争侵蚀差异化
        - 客户认为 Google 或其他供应商是成本更低且足够好的替代品。
        - 定价权和终局倍数压缩。
        - 转向悲观情景承销。
      - - 轮次条款保护投资者
        - 优先权堆叠、反稀释棘轮或偏重老股的结构吸收普通股上行。
        - 头部估值不再代表真实经济入场点。
        - 按完全转换基础建模，或直接退出。
    notes: 终止触发项应可监测，并绑定承销失效模式，而不是泛泛的运营担忧。
    claimRefs:
      - CV021
      - CV022
      - CV028
      - CV042
      - CV047
      - CV052
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR / 预订额
        - 已签 ARR、预订节奏和当前收入运行率。
        - 需要用来定位 SpreeAI 在可比倍数谱系中的位置。
        - 财务负责人；董事会 KPI 包和客户收入瀑布。
      - - 留存 / 集中度
        - 总留存率、NRR、头部客户占比和试点转生产转化。
        - 需要判断合作伙伴数量是否反映持久软件收入。
        - 收入运营；队列导出和前 20 大客户清单。
      - - 单位经济性
        - 毛利率、实施毛利、支持负担和现金消耗。
        - 需要判断 Shopify 式或商业式倍数是否站得住。
        - CFO；毛利桥和 12 个月现金计划。
      - - 轮次经济条款
        - 清算优先权、参与型优先股条款、老股交易和期权池扩张。
        - 需要把头部估值转化为真实投资者结果。
        - 律师和 CFO；已签条款清单加股权结构表。
      - - 合规 / 安全
        - 生物识别同意流程、模型治理、事件响应和监管映射。
        - 需要这些证据，因为产品处理生物识别数据，并面对 2026 年上升的 AI / 隐私审查。
        - 安全 / 隐私负责人；政策、审计和控制证据。
    notes: 这些问题直接映射未解决问题，并应作为从继续研究转向买入或按价跟踪的闸门。
    claimRefs:
      - CV019
      - CV021
      - CV023
      - CV024
      - CV042
      - CV052
