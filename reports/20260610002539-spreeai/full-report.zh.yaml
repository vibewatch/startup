companyProfile:
  summary: >-
    SpreeAI
    是一家私营时尚科技公司，向零售和时尚品牌销售白标虚拟试穿、合身度与造型软件。公开产品界面一致描述了一套单照片流程：把服装以写实效果渲染到购物者身上，避免重新拍摄，并接入零售商网站、应用和电商技术栈，而不是独立运营消费者市场。公司公开由联合创始人兼
    CEO John Imah 领导，Bob Davidson 担任董事长兼投资人，Naomi Campbell 提供可见的董事会层面时尚背书。公开势能真实存在：保留来源支持其与 MIT 和 Carnegie Mellon
    的学术关系、与 CFDA 的合作、2025 年与 Sergio Hudson 和 Kai Collective 的合作，以及 2025 年 5 月达到 $1.5B
    估值里程碑。尚未解决的是叙事背后的运营证明。成立年份、总部和累计融资在公开来源之间仍有冲突，也没有保留来源披露收入、ARR、留存、毛利率、客户集中度或融资条款，细到足以支撑当前价格。
