  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 该有向图梳理公开信息中似乎对 SpreeAI 产品交付和叙事可信度最关键的依赖关系。
    data:
      nodes:
        - id: brand_catalogs
          label: 零售品牌目录
          detail: 用于试穿的客户产品数据和部署界面
        - id: third_party_tools
          label: 第三方工具
          detail: 未公开点名的云、分析、支付和支持供应商
        - id: fashion_partners
          label: CFDA / 设计师伙伴
          detail: 品牌可信度和发布关注度
        - id: academic_partners
          label: 学术关联
          detail: 技术可信度和招聘信号
        - id: founder_network
          label: 创始人 / 董事长网络
          detail: 融资、媒体和战略信号
        - id: spree_platform
          label: SpreeAI 平台
          detail: 虚拟试穿、合身和个性化工作流
        - id: enterprise_adoption
          label: 企业采用
          detail: 生产环境推出和案例生成
        - id: valuation_story
          label: 估值故事
          detail: 为溢价定价和融资提供叙事支撑
      edges:
        - from: brand_catalogs
          to: spree_platform
          label: 提供部署内容和产品数据
        - from: third_party_tools
          to: spree_platform
          label: 支撑托管、分析和交易
        - from: fashion_partners
          to: enterprise_adoption
          label: 创造可信度和线索
        - from: academic_partners
          to: valuation_story
          label: 支撑技术护城河叙事
        - from: founder_network
          to: valuation_story
          label: 锚定融资和媒体关注
        - from: spree_platform
          to: enterprise_adoption
          label: 必须产出可衡量的 ROI
        - from: enterprise_adoption
          to: valuation_story
          label: 验证或削弱溢价倍数
