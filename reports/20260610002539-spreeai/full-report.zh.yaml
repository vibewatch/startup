            body: >
              本章最重要的客户开发事实是，SpreeAI 的公开证据已经超出抽象产品营销，但范围仍窄。2025 年 5 月报道围绕转化和退货建立了公司的销售话术，并把 Sergio Hudson 和 Kai
              Collective 标记为即将到来的时尚合作伙伴。到 2025 年底，Sergio Hudson 这条故事更具体：12 月联合新闻稿称其为 SpreeAI 首个直接面向消费者的奢侈时尚合作，表示该合作于 12
              月 19 日在美国上线，并描述技术已嵌入 Sergio Hudson 的电商体验。WWD 独立强化了这一点，称购物者可在 Sergio Hudson 网站体验试穿；仍然在线的 “SPREEAI X Sergio
              Hudson Try-On Studio” 系列页面，提供了直接的现在时证据，证明合作已经离开公告阶段，变成面向客户的界面。Kai Collective
              的证明更弱：多个可信来源描述了合作，但审阅来源没有独立验证一个在线 Kai 购物页面。CFDA 介于两者之间。它不等同于付费商户，但扩大了 SpreeAI
