      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              保留来源中最强、最反复出现的领导层事实是：John Imah 是 SpreeAI 的联合创始人兼 CEO。官方历史页面把他与 Bob Davidson、Lisa Park 并列为联合创始人，并明确说明 Lisa
              Park 已不再关联；这一点有用，因为多数其他来源都略过她。公开治理报道随后收敛到一个董事会层面界面：Naomi Campbell、Bob Davidson 和 Larry Ruvo。Naomi 2024
              年加入董事会先由 People of Color in Tech 突出报道，之后又在估值报道中被重复引用。官方团队页补充了产品、工程、设计、HR、合作伙伴、人员和隐私负责人；2026 年 6 月的
              LinkedIn 帖子显示 Chelsea Suitos 在行业活动中担任外部合作负责人。Imah 过往履历横跨 Samsung、Twitch、Amazon、Meta、Take-Two 和
              Snap，支撑其在消费者技术与时尚交叉点上的创始人-市场匹配。即便如此，公司尚未发布更完整的董事会名单、治理权利，或公开团队页以外逐位高管履历。因此，创始人与董事长权力集中仍是真实尽调项，尽管可见领导层界面比“两人创始故事”更宽。
