      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可能的经济买方是负责转化率、退货率和陈列 KPI 压力的电商或数字陈列负责人，但运营用户更宽。产品、陈列、CRM
              和电商运营团队都会碰到这一工作流，因为虚拟试穿依赖图像质量、尺码数据、目录结构和下游分析。当零售商需要门店前端集成、数据导出，或身份与同意控制时，IT
              或工程团队会被拉进来。若解决方案被包装成利润率保护或多渠道软件支出项，而不是创意实验，财务会成为付款方或最终批准人。采用路径通常从连衣裙、牛仔或鞋履等高退货类别开始，再进入有限试点，零售商衡量转化提升、退货率变化和数据质量。能展示推荐覆盖、SKU
              级逻辑和透明反馈回路的供应商，最有机会赢得预算。
