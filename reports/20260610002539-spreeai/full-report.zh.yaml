  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户模式由品牌主导的商业赋能构成，购物者是用户，商户是付款方
        blocks:
          - type: paragraph
            body: >
              SpreeAI 的公开客户动作不是通用横向消费者应用。官方合作伙伴、产品和引导上线界面都指向 B2B
              商业模式：时尚品牌、电商零售商和高触达奢侈品卖家是经济买方，购物者则在这些商户自有体验里成为日常用户。购物者上传一张照片，看到写实试穿，并在不下载单独应用、不离开商户会话的情况下获得合身指导。这点重要，因为它厘清了谁付款、谁使用、谁受益。品牌获得转化和退货减少的上行空间；购物者获得更高信心和更少猜测。具名公开证明也集中在时尚优先的细分，而不是宽泛零售：Sergio
              Hudson 属于奢侈成衣，Kai Collective 属于数字原生当代时尚，CFDA 则是进入设计师和品牌关系的生态渠道。Fashinnovation 和 Vogue UA 进一步扩展了这幅图景，把
              SpreeAI 描述为面向线上、店内和重要客户场景的全渠道基础设施；这比商品化大众零售更贴合高端时尚商业。
