        title: 功能范围、包装方式与买方实际可比内容
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 最强的产品信息是：一张购物者照片即可解锁试穿、合身和造型，不需要重新拍摄、跳转或下载应用。这比 Style.me 偏头像和数字化的重流程更干净，也比 True Fit、Bold Metrics 或
              3DLOOK 只讲合身的销售话术更面向商户体验。DRESSX 以更宽的套件竞争：白标 PDP 试穿、AI Twin 输入、AI Studio 内容生成和店内镜子，因此范围更广，但也可能更重。FASHN
              是最显眼的定价异类，因为它公布自助月度套餐和 API 导向文档；多数其他公司仍让企业经济性不透明。DRESSX 和 Style.me 把买方推向演示或联系销售流程，而 True Fit 的 Shopify
              产品仍按订单量层级计费，而不是简单的企业固定标价。净结果是，公开功能比较可行，但公开经济性比较很弱。商户能看到谁开放
