        - 需要生产环境证据，证明面对 Google 和其他虚拟试穿供应商时仍有可防守性。
      - - 头部估值可能夸大了当前去风险程度。
        - 公开 SEC 文件显示私募发行活动，但没有收入或优先权披露。
        - 需要经审计或董事会级别指标，把价格与收入质量连接起来。
      - - 监管和平台风险可能快速压缩价值。
        - 生物识别处理、州隐私扩张、EU AI Act 时间表和大型平台竞争都会推高执行成本。
        - 需要合规准备度、安全控制和差异化企业结果。
    notes: 各行刻意把看多和审慎框架配对，让投委会能看清哪些已确认、哪些仍需要尽调。
