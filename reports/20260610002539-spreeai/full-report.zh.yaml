  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 位于企业服装和鞋履电商技术栈中，具体是帮助购物者判断一件商品是否好看、是否合身到足以下单的软件层。纳入的支出不是全部零售 AR、全部 3D
              商务，也不是全部电商个性化，而是更窄的一池品牌和零售商支出：虚拟试穿、尺码预测、合身指导，以及可嵌入自有产品页和结账旅程的相关陈列流程。这个边界重要，因为宽口径市场报告常把店内镜子、美妆试妆、眼镜、硬件和通用
              AR 体验混在一起，而 SpreeAI 今天并不明显服务这些场景。现状替代方案仍然很强：尺码表、更好的摄影、陈列内容、宽松退货政策、Google 的市场原生试穿，以及 Snap 或 Shopify
              等平台的套件产品。因此，尽调中正确的比较集合是在线时尚的转化率和退货率软件，而不是所有沉浸式购物工具。
