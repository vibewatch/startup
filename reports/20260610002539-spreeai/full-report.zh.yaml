      - number: '5.2'
        title: 架构、集成与运营模式
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 没有公开 API 参考或架构手册，因此最清楚的技术披露来自招聘。AI 研究、AI
              基础设施、首席平台、模型评估和移动工程岗位描述了一套端到端技术栈，覆盖训练、评估、部署、监控、模型注册、实验追踪、数据血缘，以及支持回滚的发布自动化。这比一个轻薄前端组件供应商所需的运营模式更有主张。它暗示
              SpreeAI 想掌控的不只是 UX，还包括多模态试穿系统的模型生命周期、发布质量和面向合作伙伴的可靠性。

              招聘材料还暴露了具体技术押注。研究岗位提到扩散模型、多模态 transformers、视频建模、可控性适配器和以人为中心的表示学习。平台岗位提到 Triton、vLLM、TensorRT-LLM、Ray
              Serve、TorchServe、ONNX Runtime、Kubernetes 和 GPU 资源管理。移动岗位指向摄像头采集、服装扫描，以及调用后端推理服务的客户端
              SDK。模型评估岗位强调以数据集驱动的基准测试、回归检测，以及针对写实度、一致性和性能的 CI/CD 检查。

              合在一起，这些披露勾勒出一种托管集成架构：零售商渠道把采集和目录数据送入 SpreeAI
              运营的模型服务，内部评估与可观测性闸门则约束发布质量。合作伙伴门户和试点优先语言强化了这一解读。取舍在于，架构看起来复杂，但很大一部分必须从岗位描述推断；公开文档、沙盒说明和状态透明度目前还不是官网公开界面的一部分。
