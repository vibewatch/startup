  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 可支撑估值区间（USD B）
      - 概率信号
    rows:
      - - 乐观
        - SpreeAI 证明具备软件式经常性收入、广泛企业部署，并在规模品牌中可复制地提升转化或降低退货。
        - $1.0-$1.8
        - 只有尽调显示 >$125M 高毛利经常性收入和强留存时才可能成立。
      - - 基准
        - 公司有真实企业牵引，但收入规模仍有限，投资者按增长型商业软件而非顶级平台软件定价。
        - $0.2-$0.6
        - 在证据证明其经济性优于公开时尚科技可比公司前，这是最可能情景。
      - - 悲观
        - 试点转化缓慢，合规负担上升，买方可选择 Google 或其他供应商且无需支付溢价。
        - $0.05-$0.5
        - 如果产品证明停留在视觉层面而非财务层面，且轮次条款保护投资者，该情景会变得可信。
    notes: 这些是基于公开可比倍数和所需收入门槛的分析师估计；它们是情景工具，不是管理层指引。
