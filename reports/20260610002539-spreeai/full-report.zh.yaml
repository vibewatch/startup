      - number: '8.3'
        title: 可比区间意味着估值包络很宽
        blocks:
          - type: paragraph
            body: >-
              公开可比公司的最重要启示不是某个唯一正确的倍数，而是区间有多大。Shopify 仍以超过 11x 销售额获得软件式溢价，但 Stitch Fix 交易在 0.5x 销售额以下，Revolve 和 ThredUp
              则更接近 1x 到 2x 销售额。这个差距很重要，因为 SpreeAI 还没有公开证明自己该落在哪个位置。如果 SpreeAI
              真有高毛利、经常性的企业收入，且留存黏性强、能量化提升转化或降低退货率，投资者可以主张一个显著高于商业零售可比公司的倍数。如果业务更早期、服务成分更重，或仍主要由试点部署驱动，相关可比集合会迅速压缩。隐含收入数学让问题变得可见：按
              Shopify 倍数，$1.5 billion 入场只需要约 $129 million 收入；但在时尚商业集合下，则需要数亿美元到超过 $1
              billion。没有披露收入，乐观情景仍是有条件的，基准情景必须承保一个远低于标题估值的可支撑区间。
