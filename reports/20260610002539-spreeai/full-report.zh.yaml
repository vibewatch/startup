      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              审阅集合中唯一坚硬的一手融资数据点是 SpreeAI 的 SEC Form D。该文件显示，一笔 $10 million 豁免发行，已售 $5 million，1 名投资人，并计划将 $2.53 million
              募资用于向具名高管、董事或发起人付款。文件还明确拒绝披露发行人的收入区间。该文件证明 SpreeAI 使用过私募融资，但不能证明 2026 年当前现金余额、当前烧钱速度或剩余现金跑道。后续二手来源暗示，$1.5B
              估值背后有一笔规模大得多的 2025 年 5 月融资事件，但它们对实际累计融资金额互相冲突。

              这个冲突重要，因为在直接收入规模可见之前，SpreeAI 的运营模式很可能消耗现金。一个承诺写实试穿、合身智能、合作伙伴集成、服装摄入、隐私控制和零售商支持的业务，几乎必然持续承担工程、模型训练、云推理、安全 /
              合规和企业上线支出。隐私政策还显示产品触及生物识别数据，带来额外合规和治理开销。没有披露烧钱或现金时，审慎结论是：资本充足性无法公开验证。SpreeAI 可能资金充足，但证据不足以判断 2025
              年估值观感是否能转化为多年现金跑道，还是近期仍需要额外外部融资。
