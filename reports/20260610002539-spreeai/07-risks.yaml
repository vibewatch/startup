  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: privacy-controls
    missingEvidence: A public or diligenced retention schedule, subprocessor list, audit artifact, and biometric consent workflow evidence.
    whyItMatters: The company handles sensitive image and fit data, so legal risk cannot be underwritten on policy language alone.
    diligencePath: Request trust-center materials, privacy engineering SOPs, deletion SLAs, and vendor contracts under NDA.
    relatedQuestionRefs:
    - QR004
    - QR008
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement
    missingEvidence: Any court, regulator, or insurer record showing whether SpreeAI has faced privacy, biometric, or consumer-protection claims.
    whyItMatters: The absence of adverse public findings may simply reflect limited disclosure rather than a clean risk history.
    diligencePath: Run legal-database and state-court searches under paid services and ask management for a claims-and-disputes schedule.
    relatedQuestionRefs:
    - QR005
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Security certifications, pen-test summaries, uptime history, and named critical vendors or subprocessors.
    whyItMatters: Enterprise deployment risk is materially higher when a sensitive-data AI platform cannot evidence operational controls.
    diligencePath: Request SOC 2 or ISO roadmap, architecture overview, incident policy, and vendor resilience plan.
    relatedQuestionRefs:
    - QR010
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-round-terms
    missingEvidence: Round size, liquidation stack, revenue, gross margin, customer concentration, burn, and runway.
    whyItMatters: Public valuation without corresponding operating metrics makes it impossible to assess downside support or financing durability.
    diligencePath: Request cap-table summary, board materials, customer concentration data, and monthly management reporting under NDA.
    relatedQuestionRefs:
    - QR017
    - QR019
    - QR027
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: bench-depth
    missingEvidence: Named leaders below the founder/board layer and a documented succession plan across security, privacy, finance, and product.
    whyItMatters: Key-person risk cannot be diluted if operating depth is invisible at the moment external narrative concentration is high.
    diligencePath: Request org chart, leadership bios, retention plans, and delegated decision-rights matrix.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: enterprise-proof
    missingEvidence: Named production customers, audited ROI validation, renewal data, and implementation case studies beyond announcement-level partner proof.
    whyItMatters: Without repeatable production proof, partner signaling may overstate demand durability and moat strength.
    diligencePath: Request customer reference calls, ROI methodology, renewal cohorts, and implementation dashboard screenshots.
    relatedQuestionRefs:
    - QR015
    - QR027
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
