- id: operational-and-security-risk
  title: Operational and security risk
  body: 'Operationally, SpreeAI is selling a low-friction promise: one photo, no downloads, photorealistic try-on, and fast deployment into a brand''s catalog. That experience reduces onboarding friction but also means the system sits directly in the path of consumer trust, brand merchandising workflows, and partner data transfers. Public materials show cloud, analytics, and payment vendors exist, but they do not name those vendors or expose uptime, resilience, incident, or assurance documentation. The company therefore asks buyers and users to trust performance and security claims without the usual trust-center evidence. That gap matters more in 2026 than it might have in 2023 because regulators, insurers, and enterprise procurement teams increasingly expect documented AI governance, model monitoring, and security controls. Absent that evidence, the base-case risk is not a known incident but an inability to answer enterprise diligence questions fast enough when the company tries to scale
    up-market.'
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR036
