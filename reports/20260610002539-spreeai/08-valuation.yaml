  - CV052
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR / bookings
    - Signed ARR, bookings cadence, and current run-rate revenue.
    - Needed to locate SpreeAI on the comparable-multiple spectrum.
    - Finance lead; board KPI pack and customer revenue waterfall.
  - - Retention / concentration
    - Gross retention, NRR, top-customer share, and pilot-to-production conversion.
    - Needed to judge whether partner count reflects durable software revenue.
    - Revenue operations; cohort export and top-20 customer schedule.
  - - Unit economics
    - Gross margin, implementation margin, support burden, and cash burn.
    - Needed to know whether Shopify-like or commerce-like multiples are defensible.
    - CFO; margin bridge and 12-month cash plan.
  - - Round economics
    - Liquidation preferences, participating preferred terms, secondaries, and option-pool expansion.
    - Needed to convert headline valuation into real investor outcomes.
    - Counsel and CFO; executed term sheet plus cap table.
  - - Compliance / security
    - Biometric consent workflow, model governance, incident response, and regulatory mapping.
    - Needed because the product handles biometric data and faces rising 2026 AI/privacy scrutiny.
    - Security/privacy lead; policies, audits, and control evidence.
  notes: These asks map directly to the unresolved questions and should gate any shift from research-more to buy or track-at-price.
