- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof missing after full diligence
    - Management cannot provide signed ARR, bookings, and gross-margin evidence.
    - The valuation remains narrative-only and cannot be tied to software economics.
    - Pause investment or reprice from a much lower base.
  - - Customer concentration is excessive
    - Top few accounts dominate contracted revenue or pilots with weak renewal visibility.
    - Partner count loses meaning and downside from churn becomes nonlinear.
    - Require concentration covenant, staged entry, or decline.
  - - Compliance readiness is immature
    - No concrete control set for biometric consent, data governance, and multi-jurisdiction obligations.
    - Regulatory cost and incident risk can erase early commercial gains.
    - Demand remediation plan before investing.
  - - Competition erodes differentiation
    - Customers view Google or other vendors as good-enough substitutes at lower cost.
    - Pricing power and terminal multiple compress.
    - Move to bear-case underwriting.
  - - Round terms are investor-protective
    - Preference stack, ratchets, or secondary-heavy structure absorb common-equity upside.
    - Headline valuation ceases to represent the true economic entry point.
    - Model on an as-converted basis or walk away.
  notes: Kill triggers are monitorable and tied to underwriting failure modes rather than generic operating concerns.
  claimRefs:
