  - - Risk rating
    - high
    - Biometric-data compliance, launch timing, and platform competition can all compress value simultaneously.
    - Require stronger downside protection than a clean software round.
  - - Valuation stance
    - stretched
    - Comparable public multiples imply a wide range and most fashion-commerce comps sit far below software leaders.
    - Treat $1.5B as an earn-back threshold, not a default fair value.
  - - Near-term action
    - track with diligence
    - The company may be promising, but the next step is evidence collection rather than immediate conviction.
    - Push for diligence package before any term-sheet decision.
