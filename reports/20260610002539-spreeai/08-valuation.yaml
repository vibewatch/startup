- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Supportable valuation range (USD B)
  - Probability signal
  rows:
  - - Bull
    - SpreeAI proves software-like recurring revenue, broad enterprise deployment, and repeatable conversion or returns wins across scaled brands.
    - $1.0-$1.8
    - Possible only if diligence shows >$125M high-margin recurring revenue and strong retention.
  - - Base
    - Company has real enterprise traction, but revenue scale is still modest and investors price it like growth commerce software rather than elite platform software.
    - $0.2-$0.6
    - Most likely until evidence proves better economics than public fashion-tech comps.
  - - Bear
    - Pilots convert slowly, compliance burden rises, and buyers can choose Google or other vendors without paying a premium.
    - $0.05-$0.5
    - Becomes plausible if product proof is visual rather than financial and if round terms are investor-protective.
  notes: These are analyst estimates based on public comparable multiples and required revenue thresholds; they are scenario tools, not management guidance.
