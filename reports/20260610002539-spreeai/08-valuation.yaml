  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-proof
    missingEvidence: Signed ARR, bookings cadence, and gross-margin detail are not publicly disclosed.
    whyItMatters: Without revenue quality, the $1.5B mark cannot be tied to software economics or downside protection.
    diligencePath: Request board KPI pack, bookings bridge, and customer revenue waterfall.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Liquidation preferences, secondary mix, and any ratchets for the latest round are not public.
    whyItMatters: Preference overhang can materially change investor outcomes even if the headline valuation is accurate.
    diligencePath: Obtain executed term sheet, cap table, and post-money ownership schedule.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customers, ACVs, renewal rates, and concentration across the reported partner base are not public.
    whyItMatters: A broad partner count is less valuable if revenue is concentrated in pilots or a few design-led relationships.
    diligencePath: Request top-customer list, pilot-to-production funnel, and renewal cohorts.
