company:
  name: SpreeAI
chapter:
  number: 8
  title: Valuation
  summary: SpreeAI has enough public signal to merit continued diligence—visible product claims, patents, fashion validation, and a repeated $1.5B valuation anchor—but not enough disclosed economics to underwrite that price. With SEC filings showing real private financing but no public revenue, retention, margin, or round-term detail, the right call is research-more with high risk and a stretched valuation stance.
sections:
- id: bottom-line
  title: 'Bottom line: price support still lags the narrative'
  body: 'SpreeAI has enough signal to stay on a diligence list: the product story is clear, the company has public fashion validation, patents exist, and independent press repeats the $1.5 billion valuation anchor. But the valuation case remains thinner than the narrative case. The strongest public operating proof is still company-reported or event-stage evidence such as the claim that around 60 percent of Try On clicks convert and that deployments can go live quickly. The SEC trail confirms real exempt financing activity, yet those filings still do not disclose revenue, retention, gross margin, or preference terms. That means public evidence cannot translate the reported valuation into a risk-adjusted entry case. The correct recommendation is research-more with medium confidence, high risk, and a stretched valuation stance. SpreeAI may be a strong product and brand story, but public evidence has not yet earned the right to be treated like a de-risked software comp.'
  claimRefs:
  - CV005
  - CV008
  - CV009
  - CV010
  - CV011
  - CV016
  - CV048
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: financing-proof-and-regulation
  title: Financing proof exists, but public economics remain opaque
  body: 'The public financing record cuts both ways. The SEC Form D/A is useful because it shows a real private round structure: a $30 million exempt offering, $15 million sold, and one investor disclosed as of the July 2024 amendment. Yet the same SEC trail highlights the central valuation problem because the public corpus still lacks audited operating data, customer concentration, and detailed round economics. Independent coverage adds helpful context: Inc. says the company had nearly $100 million raised, close to 40 partners, and a consumer launch window around late 2025 or early 2026. That still does not bridge the gap between story and price. Regulatory exposure also matters because SpreeAI explicitly processes biometric and image-derived data. Its own privacy policy references BIPA, while U.S. privacy rules and the EU AI Act continue to thicken in 2026. That does not break the thesis, but it raises execution and compliance costs exactly when the company still needs to prove durable
    software economics at scale.'
  claimRefs:
  - CV006
  - CV007
  - CV010
  - CV011
