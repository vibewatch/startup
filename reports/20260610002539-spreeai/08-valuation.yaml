- id: diligence-gates
  title: What would move the call
  body: 'The path from research-more to investable is straightforward but evidence-intensive. A positive re-rate would require proof that SpreeAI is not just visually impressive but commercially repeatable: signed recurring revenue, renewal durability, customer concentration that is not excessive, and realized reductions in returns or increases in conversion that hold across brands. The round itself also needs full transparency because preference terms can destroy common-equity outcomes even when the headline post-money valuation is true. Finally, the company should show it can scale compliance and trust alongside growth, especially because its own policy disclosures acknowledge biometric processing and multi-jurisdiction obligations. Until those items are confirmed, the right discipline is not to deny the upside, but to refuse false precision. This is a business to keep diligencing rather than a price to chase. If management can close the data gaps, the mark may become defensible; if not,
    the downside reset path is materially larger than the upside surprise from current public evidence.'
