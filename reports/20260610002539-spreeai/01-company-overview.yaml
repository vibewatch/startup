callouts:
  - calloutType: strength
    title: Cross-disciplinary credibility is real even if the numbers are not fully disclosed
    body: >-
      SpreeAI’s public narrative is unusually reinforced across fashion, academic, and investor surfaces. The company can point to Davidson-led capital, Naomi Campbell and Larry Ruvo at board level, MIT and Carnegie Mellon collaboration language, and a CFDA-hosted public discussion. That does not validate unit economics, but it does show the company has been able to secure external credibility far beyond a typical early fashion-tech startup.
    claimRefs:
      - CO021
      - CO028
      - CO029
      - CO032
      - CO033
  - calloutType: risk
    title: Biometric processing and disclosure conflicts are the chapter-1 risk anchors
    body: >-
      The privacy policy confirms that biometric-style image and body data are part of the core service, while the terms impose arbitration and warranty limits. Separately, founding year, headquarters, and total raised all carry conflicting public values. Together, those issues mean diligence should not rely on one clean company-history narrative or assume compliance posture is lightweight just because the product is consumer-friendly.
    claimRefs:
      - CO009
      - CO013
      - CO025
      - CO026
      - CO042
  - calloutType: assumption
    title: Use product identity as ground truth, but treat company metadata as disputed
    body: >-
      The retained sources overwhelmingly agree that SpreeAI is building white-label AI try-on and fit software for retailers. They do not, however, agree on founding year, headquarters, exact capital raised, or the exact round label for the 2025 financing. This chapter therefore locks in product identity and visible leadership, while carrying company-metadata ambiguity forward as an explicit diligence caveat.
    claimRefs:
      - CO001
      - CO021
      - CO025
      - CO026
      - CO044
