company:
  name: SpreeAI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SpreeAI is a private fashion-tech company selling white-label AI try-on and fit software to retailers, with strong public evidence for its product positioning, leadership visibility, and a May 2025 $1.5 billion valuation milestone. The public record is materially weaker on canonical metadata such as founding year, headquarters, exact capital raised, and operating metrics, so this chapter treats those items as explicit diligence caveats rather than settled ground truth.
sections:
  - id: identity-and-product-model
    title: Identity and Product Model
    body: >-
      SpreeAI’s public materials are consistent about what the company is trying to sell even when they are inconsistent about where and when the company was formally founded. The homepage and product page describe a one-photo system that combines photorealistic try-on, fit or size prediction, and styling logic; they also say the experience avoids downloads, redirects, and new photography while delivering try-on output in under three seconds. The partner page frames the product as a white-label deployment for retailers that can go live quickly and fit into existing commerce stacks. SpreeAI’s privacy policy grounds that marketing language in a formal company identity by describing SpreeAI Corporation as a fashion-technology company serving retailers and consumers across websites, APIs, mobile apps, and partner integrations. Where the public record becomes less stable is identity metadata: LinkedIn says the company was founded in 2023 and is headquartered in Los Angeles, the terms list only an Incline Village mailing address, and Wikipedia says both founding year and headquarters are different. Later chapters should therefore reuse the product definition confidently, but should treat founding year and headquarters as disputed rather than canonical.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO016
      - CO025
      - CO026
      - CO043
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      The strongest repeated leadership fact in retained sources is that John Imah is SpreeAI’s co-founder and CEO. The official history page pairs him with Bob Davidson and Lisa Park as co-founders and explicitly notes that Lisa Park is no longer affiliated, which is useful because most other sources omit her. Public governance coverage then converges around a board-level surface made up of Naomi Campbell, Bob Davidson, and Larry Ruvo, with Naomi’s 2024 board arrival highlighted in People of Color in Tech and later repeated in valuation coverage. The official team page fills in the operating bench with product, engineering, design, HR, partnerships, people, and privacy leaders, while June 2026 LinkedIn posts show Chelsea Suitos acting as the external partnerships lead at industry events. Imah’s prior résumé—spanning Samsung, Twitch, Amazon, Meta, Take-Two, and Snap—supports founder-market fit at the intersection of consumer technology and fashion. Even so, the company has not published a fuller board roster, governance rights, or executive-by-executive biographies beyond the public-facing team page. That makes founder and chair concentration a real diligence item even though the visible leadership surface is broader than a two-person founding story.
    claimRefs:
      - CO014
      - CO015
      - CO019
      - CO028
      - CO029
      - CO030
      - CO031
    tableRefs:
      - TO002
  - id: funding-scale-and-disclosure-quality
    title: Funding, Scale, and Disclosure Quality
    body: >-
      SpreeAI’s financing story is directionally strong but still incomplete at the level investors usually want for a canonical overview. Multiple sources agree that the company reached a $1.5 billion valuation in May 2025 after a Davidson-led round, and TechCrunch independently placed SpreeAI on its 2025-unicorn list in January 2026. What remains less settled is the size of the capital stack and the exact round label. TechCrunch, citing PitchBook, says SpreeAI has raised $80 million and was founded in 2020; earlier People of Color in Tech and AFROTECH profiles said the company had nearly $60 million by 2024. That suggests meaningful capital came in before the unicorn event, but the retained primary materials do not disclose exact proceeds, ownership percentages, liquidation preferences, or whether the 2025 round should be treated as Series B in canonical reporting. Disclosure is even thinner on operating metrics: no retained source gave customer count, revenue, ARR, debt, or secondaries. The best current scale proxies are therefore LinkedIn’s 11-50 size band, roughly 30 visible employees on the company page, and a 13-role hiring slate spanning Los Angeles, New York, and San Francisco.
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO020
