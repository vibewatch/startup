  - id: milestones-partnerships-and-public-risks
    title: Milestones, Partnerships, and Public Risks
    body: >-
      The public milestone record centers on three themes: credibility-building partnerships, rapid brand elevation in 2025, and a legal posture that creates real diligence work. On the positive side, SpreeAI’s collaboration set is unusually broad for a still-private company: PR coverage, POCIT, and the CFDA event all point to MIT and Carnegie Mellon relationships; CFDA publicly endorsed the company; and 2025 retail coverage tied the company to Sergio Hudson and Kai Collective, culminating in a live direct-to-consumer Sergio Hudson rollout in December 2025. That sequence helps explain how SpreeAI bridged from AI infrastructure claims into visible fashion-industry relevance. On the risk side, the company’s own legal documents make it clear that biometric processing is core to the product and that customer or user disputes would face arbitration and broad warranty disclaimers. The same chapter also has to preserve unresolved identity conflicts: founding year, headquarters, and total capital raised do not line up cleanly across public sources. Those contradictions do not negate the company’s momentum, but they do mean chapter 1 should be treated as the place where later analysis inherits both the upside narrative and the caveats.
    claimRefs:
      - CO009
