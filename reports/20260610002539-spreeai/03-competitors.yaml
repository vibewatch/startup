chapter:
  number: 3
  title: Competitors
  summary: SpreeAI's closest public direct peers are DRESSX, FASHN, and Style.me, while True Fit, Bold Metrics, and 3DLOOK attack the same purchase-hesitation problem through fit intelligence instead of photoreal try-on. The clearest public wedge for SpreeAI is implementation simplicity—one photo, no new photography, and a bundled try-on/fit/styling flow inside the merchant experience—but the most durable moats visible across the market sit with structured fit data and platform-level distribution. Public pricing and win-loss evidence remain thin, so SpreeAI's real pricing power versus peers is still unproven from retained sources.
sections:
- id: landscape-and-competitor-classes
  title: 'Landscape: direct peers, adjacent fit vendors, and platform substitutes'
  body: 'The closest direct alternatives to SpreeAI are the vendors that promise a merchant-facing virtual fitting or try-on layer rather than just sizing advice. DRESSX, FASHN, and Style.me all fit that bucket, but they approach it differently. DRESSX sells a broader modular suite spanning ecommerce try-on, AI content, and even an in-store mirror. FASHN looks more composable and developer-friendly, with public pricing and API documentation. Style.me emphasizes a managed 3D fitting room with avatars, sizing, styling, and analytics. A second competitor class attacks the same conversion problem through fit intelligence instead of rendered try-on imagery: True Fit, Bold Metrics, and 3DLOOK all sell confidence on sizing, measurement, and body data. A third class comes from platform substitutes and entrants. Google now owns a consumer-facing try-on surface in Shopping, Snap offers AR tooling and distribution, and Shopify already supports native 3D and AR product media. That means buyers can choose
    a specialist suite, a fit-intelligence layer, or a partial internal build rather than a single vendor category.'
  claimRefs:
