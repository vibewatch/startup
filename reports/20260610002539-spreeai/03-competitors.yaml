  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: accuracy-benchmark
    missingEvidence: Head-to-head benchmark data showing SpreeAI accuracy, conversion lift, or return reduction versus named peers such as DRESSX, FASHN, Style.me, or True Fit.
    whyItMatters: Without comparative benchmark evidence, it is impossible to tell whether SpreeAI’s workflow simplicity translates into a durable product-performance edge or just a cleaner marketing message.
    diligencePath: Request merchant-level A/B tests, blind accuracy studies, and side-by-side implementation results with at least one direct try-on peer and one fit-only substitute.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: Realized SpreeAI contract structure, ASPs, discount ladders, and win-loss outcomes against direct and adjacent competitors.
    whyItMatters: Public packaging pages show feature scope but not bargaining power, price elasticity, or whether SpreeAI wins on value rather than discounting.
    diligencePath: Request recent proposals, closed-lost notes, discount approvals, and renewal pricing by customer segment, then compare them with the named peer set in TP003.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-evidence
    missingEvidence: Evidence on exclusivity clauses, multi-homing prevalence, integration unwind effort, and customer churn after pilot or initial rollout.
    whyItMatters: Moat durability in this category depends less on demo quality than on whether customers can cheaply layer or replace tools once the initial pilot ends.
    diligencePath: Request customer cohort churn, average implementation-to-live timeline, replacement case studies, and contract language on exclusivity or data portability.
    relatedQuestionRefs:
    - QP019
    - QP025
    relatedTableRefs:
    - TP004
