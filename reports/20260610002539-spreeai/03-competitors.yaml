- id: distribution-and-status-quo-alternatives
  title: Distribution power, internal build, and status-quo alternatives
  body: The most dangerous substitutes do not all look like direct try-on vendors. Google can place virtual try-on directly inside Shopping discovery, and Snap can let brands embed body-tracking AR inside their own apps and websites while also publishing to Snapchat's audience. Shopify lowers the barrier further because it already supports product images, video, and 3D/AR media natively on supported themes. That means some merchants can patch together a lighter-weight alternative from platform media, AR templates, and fit widgets instead of buying a full specialist workflow. For smaller or experimentation-minded teams, that matters because FASHN also exposes a low-cost self-serve entry point. The status quo is therefore not just doing nothing. It can mean high-quality photography, size guidance, 3D media, and lightweight AR or fit plugins assembled on top of an existing commerce stack. SpreeAI still wins a simpler story when the merchant wants one vendor to own onboarding and in-session
    confidence, but the market clearly offers credible partial substitutes from above and below.
  claimRefs:
