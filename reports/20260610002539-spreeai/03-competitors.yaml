- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - SpreeAI moat claim
  - competitive threat
  - severity
  - mitigation / diligence ask
  rows:
  - - One-photo onboarding reduces merchant and shopper friction
    - FASHN, DRESSX, and platform tooling also lower implementation barriers
    - High
    - Request time-to-live, implementation labor, and merchant engineering-hour benchmarks versus named peers
  - - Bundled try-on + fit + styling is stickier than a single widget
    - Merchants can still combine fit guidance, 3D media, and AR templates from multiple vendors
    - Medium-High
    - Request evidence on module attach rates, cross-feature usage, and churn after partial competitor displacement
  - - Merchant-controlled workflow beats channel dependency
    - Google and Snap control discovery or AR distribution at much larger scale
    - High
    - Request channel-share data, assisted-conversion attribution, and whether SpreeAI depends on partner traffic sources it does not own
  - - Fast deployment can win pilots and expansion
    - Self-serve or usage-based alternatives can undercut slower enterprise sales cycles
    - Medium-High
    - Request win-loss data by merchant size and whether price-sensitive pilots later expand or churn
  - - Visual confidence creates a defensible experience moat
    - True Fit, Bold Metrics, and 3DLOOK publish stronger public data-moat narratives around fit outcomes and body data
    - High
    - Request benchmark accuracy, return reduction, and repeat-purchase lift versus fit-only vendors
  - - Opaque pricing can preserve flexibility
    - Opaque pricing can also weaken procurement leverage and hide discount pressure
    - High
    - Request realized ASPs, discount ladders, gross margins, and renewal pricing evidence by customer cohort
  notes: Severity is an analytical judgment derived from retained public evidence. Each mitigation column item names the exact diligence artifact needed to convert the current narrative into an investable moat conclusion.
