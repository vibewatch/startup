tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor / class
  - target customer
  - core scope
  - pricing visibility
  - scale / proof marker
  - competitive implication
  rows:
  - - SpreeAI
    - Fashion merchants wanting one-photo try-on, fit, and styling in one flow
    - Merchant-controlled try-on, fit prediction, and styling using one shopper photo and existing catalog assets
    - No public enterprise fee card on retained pages
    - Live within a week; no new photography; no app download or redirect
    - Best positioned when buyers value simplicity and quick deployment over modular tooling
  - - DRESSX (direct)
    - Fashion and luxury brands across ecommerce and physical retail
    - Virtual try-on, AI Twin, AI Studio content tools, and in-store AI Mirror
    - Contact sales / demo-led
    - White-label REST API; Shopify, Magento, and Salesforce Commerce Cloud integrations; +40% conversion claim
    - Broader suite than SpreeAI and therefore a strong like-for-like enterprise rival
  - - FASHN (direct)
    - Brands, creatives, agencies, and consumer apps
    - API-first virtual try-on plus model creation and editing endpoints
    - Public $19 / $49 / $99 monthly tiers
    - 18M pre-training examples; public docs and API orientation
    - Strong pressure from below on experimentation, developer adoption, and price anchoring
  - - Style.me (direct)
    - Businesses of all sizes wanting 3D fitting and styling
    - Avatar-based virtual fitting room with sizing, styling, analytics, and garment digitization
    - Contact for pricing
    - +30% conversions; +280% engagement; up to -50% returns; go live within 4 weeks
    - Competes when buyers want a managed 3D fitting room rather than a one-photo pipeline
  - - True Fit (adjacent fit intelligence)
    - Retailers, marketplaces, AI labs, and Shopify merchants
    - Fit intelligence layer, agentic shopping agent, and item-level size guidance
    - Order-volume billing in Shopify tier model
    - 80M+ active users; 540M+ products; $616B annual transaction value
    - Attacks the same hesitation budget with a stronger public data-moat story than most try-on vendors
  - - Bold Metrics (adjacent fit intelligence)
    - Apparel businesses seeking white-label sizing and body-data tools
    - Virtual Sizer and Smart Size Chart based on digital twins and garment data
    - Demo-led on retained pages
    - 200M+ digital twins; 10B+ body data points; 600M+ fit simulations
    - Strong substitute when the buyer prioritizes sizing confidence over photoreal try-on
  - - 3DLOOK (adjacent measurement)
    - Made-to-measure, uniforms, ready-to-wear, and custom apparel businesses
    - Body scanning and 80+ measurements from two photos
    - Trial offered; enterprise details still plan-dependent
    - 30-60 second scan flow; 80+ long-term customers claimed
    - Useful adjacent option for measurement-heavy workflows rather than consumer-facing garment rendering
  - - Google / Snap / Shopify stack (substitute / entrant)
    - Merchants comfortable using platform infrastructure or partial internal build
    - Consumer VTO in Google Shopping, Snap AR SDK and Lens templates, Shopify native 3D/AR media
    - Platform-specific; not a single apples-to-apples SaaS contract
    - Google Shopping VTO, Snap Camera Kit, and native Shopify 3D/AR support
    - Most dangerous from distribution, native tooling, and partial-build optionality rather than white-glove merchant workflow
  notes: Rows compare the strongest public signal available for each competitor class. Scale/proof markers mix operating claims, published platform scale, and deployment evidence because realized enterprise revenue is rarely disclosed publicly.
