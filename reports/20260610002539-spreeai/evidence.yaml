    severity: material
    topic: funding-total
    missingEvidence: Canonical round-by-round financing history reconciling $22.5M, $70.0M, and undisclosed database records.
    whyItMatters: Conflicting funding totals distort capital-efficiency and runway calculations.
    diligencePath: Request cap table, signed financing docs, and management reconciliation of all historical rounds.
    relatedQuestionRefs:
      - QI016
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-traction
    missingEvidence: Verified customer count, top-customer concentration, logo retention, and expansion revenue by cohort.
