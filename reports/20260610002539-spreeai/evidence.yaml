evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      A management-confirmed founding date or incorporation record that reconciles 2020, 2022, and 2023 public
      references.
    whyItMatters: Later chapters need one canonical founding year for timeline, maturity, and valuation-context comparisons.
    diligencePath: >-
      Request certificate of incorporation, historical cap-table timeline, and management confirmation of launch versus
      incorporation date.
    relatedQuestionRefs:
      - QO004
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: A company-confirmed statement distinguishing legal domicile, mailing address, and operating headquarters.
    whyItMatters: Location affects legal tax and talent assumptions and should not drift across chapters.
    diligencePath: Ask management for legal entity state, operating HQ, and office footprint by function.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Exact round size, cap table, ownership percentages, preferences, and whether the 2025 financing was formally
      Series B.
    whyItMatters: Valuation context and stakeholder power cannot be judged cleanly from headline valuation alone.
    diligencePath: Request financing documents, cap table, and board approvals for the latest round.
    relatedQuestionRefs:
      - QO011
      - QO023
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Customer count, revenue, ARR, gross margin, and independently verified ROI or conversion performance.
    whyItMatters: The company’s investability cannot be judged on valuation and partnerships alone.
    diligencePath: Request KPI dashboard, board materials, and customer case-study data with cohort definitions.
    relatedQuestionRefs:
      - QO013
      - QO018
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-coverage
    missingEvidence: >-
      A complete board roster, senior-executive directory, and clearer role history for Lisa Park and other early
      leaders.
    whyItMatters: Current governance concentration and succession depth remain only partially visible.
    diligencePath: Request org chart, board list, and executive bios; compare against HRIS or data room materials.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: A management-validated chronology of financing, launches, patents, and customer rollouts.
    whyItMatters: The public record is good enough for direction but not exhaustive enough for definitive chronology.
    diligencePath: Ask management to mark up the public milestone table and add omitted dates or corrections.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: spreeai-pricing-and-capture
    missingEvidence: SpreeAI's pricing model, contract structure, deployment fees, and customer count are not publicly disclosed.
    whyItMatters: >-
      Without pricing and customer data, there is no defensible public bridge from generic category TAM to SpreeAI
      revenue capture.
    diligencePath: >-
      Request a customer list, pricing sheets, live contract examples, and category-level ACV / ROI cohorts from
      management.
    relatedQuestionRefs:
      - QM008
      - QM025
  - type: missing-source
    severity: material
    topic: spreeai-independent-case-studies
    missingEvidence: >-
      Independent retailer case studies for SpreeAI specifically, with measured conversion and return outcomes, were not
      found in retained public sources.
    whyItMatters: >-
      Third-party proof is required to separate SpreeAI's product claims from category-level optimism around try-on and
      fit tech.
    diligencePath: Ask for attributable customer references, before-and-after KPI decks, and category breakouts by apparel type.
    relatedQuestionRefs:
      - QM012
      - QM013
      - QM025
  - type: access-blocked
    severity: minor
    topic: paywalled-market-methodology
    missingEvidence: >-
      Full methodologies behind several analyst market reports remain paywalled or only partially visible in public
      summaries.
    whyItMatters: Methodology opacity is one reason public market sizes disagree and should not be over-trusted.
    diligencePath: >-
      Acquire full analyst reports only if needed for board materials; otherwise keep using multiple retained shells
      with explicit caveats.
    relatedQuestionRefs:
      - QM005
      - QM023
  - type: missing-source
    severity: material
    topic: privacy-implementation-details
    missingEvidence: >-
      SpreeAI-specific data retention, consent design, and jurisdictional compliance controls are not described in
      retained public sources.
    whyItMatters: >-
      Privacy and biometric rules can materially affect deployment speed, conversion friction, and enterprise buyer
      approval.
    diligencePath: >-
      Request SpreeAI's data flow diagram, DPA, retention schedule, and jurisdiction-by-jurisdiction compliance
      playbook.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: private-evidence-only
    severity: material
    topic: accuracy-benchmark
    missingEvidence: >-
      Head-to-head benchmark data showing SpreeAI accuracy, conversion lift, or return reduction versus named peers such
      as DRESSX, FASHN, Style.me, or True Fit.
    whyItMatters: >-
      Without comparative benchmark evidence, it is impossible to tell whether SpreeAI’s workflow simplicity translates
      into a durable product-performance edge or just a cleaner marketing message.
    diligencePath: >-
      Request merchant-level A/B tests, blind accuracy studies, and side-by-side implementation results with at least
      one direct try-on peer and one fit-only substitute.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
      Realized SpreeAI contract structure, ASPs, discount ladders, and win-loss outcomes against direct and adjacent
      competitors.
    whyItMatters: >-
      Public packaging pages show feature scope but not bargaining power, price elasticity, or whether SpreeAI wins on
      value rather than discounting.
    diligencePath: >-
      Request recent proposals, closed-lost notes, discount approvals, and renewal pricing by customer segment, then
      compare them with the named peer set in TP003.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-evidence
    missingEvidence: >-
      Evidence on exclusivity clauses, multi-homing prevalence, integration unwind effort, and customer churn after
      pilot or initial rollout.
    whyItMatters: >-
      Moat durability in this category depends less on demo quality than on whether customers can cheaply layer or
      replace tools once the initial pilot ends.
    diligencePath: >-
      Request customer cohort churn, average implementation-to-live timeline, replacement case studies, and contract
      language on exclusivity or data portability.
    relatedQuestionRefs:
      - QP019
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: recognized-revenue
    missingEvidence: ARR, recognized revenue, and revenue mix by software, services, and any consumer revenue stream.
    whyItMatters: Without recognized revenue and mix, valuation multiples and revenue quality cannot be tested.
    diligencePath: Request monthly management accounts, revenue bridge, and top-10 customer concentration table.
    relatedQuestionRefs:
      - QI004
      - QI022
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current unrestricted cash, monthly burn, hiring plan, and base/downside runway model.
    whyItMatters: Capital adequacy and next-round timing cannot be underwritten without cash and burn.
    diligencePath: Request treasury report, 13-week cash forecast, and 12-month operating plan.
    relatedQuestionRefs:
      - QI018
      - QI019
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales-cycle length, pilot-to-production conversion, and payback by retailer cohort.
    whyItMatters: Enterprise growth quality depends on whether customer acquisition scales efficiently.
    diligencePath: Request CRM funnel metrics, cohort CAC/payback tables, and signed-contract conversion by quarter.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-profile
    missingEvidence: Gross margin by module, onboarding cost per retailer, support burden, and cloud / inference cost intensity.
    whyItMatters: The margin path is impossible to judge without knowing how much services and compute dilute software economics.
    diligencePath: Request gross-margin waterfall, hosting/inference cost report, and services utilization by customer.
