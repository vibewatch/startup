company:
  name: Antora Energy
chapter:
  number: 6
  title: Customers
  summary: Antora has real customer proof, but the proof is concentrated in a small number of public projects and partner
    announcements. POET is the clearest named production reference, while utility and developer partners show that the company
    is moving beyond one-off validation. The public record still lacks retention, concentration, and expansion metrics, so
    the customer base looks real but not yet diversified enough to underwrite like a mature operating platform.
sections:
- id: customer-segmentation
  title: Customer segments and named proof
  body: "The visible customer set falls into four buckets: industrial heat users, utilities, large-load customers such as\
    \ data centers, and project-development partners who help site and finance the deployment. The most credible named proof\
    \ is POET, because the South Dakota project is already in energy delivery. Utility and developer partners are also important\
    \ because they show that Antora\u2019s workflow is not purely hypothetical. The downside is that the public record still\
    \ centers on a few high-profile names rather than a broad, disclosed book of repeat customers. Each segment likely has\
    \ a different contract form, which means the same product can still sell through different deal motions. A second useful\
    \ way to think about the customer base is by project type: one-off first deployments, utility-linked projects, and longer-horizon\
    \ developer-originated siting work. That split matters because each bucket implies different sales motions, financing\
    \ needs, and proof standards."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU001
  - TU003
- id: adoption-and-retention
  title: Adoption trajectory and retention gaps
  body: "Adoption appears to move from pilot or planning work into first commercial delivery and then into expansion across\
    \ more sectors and geographies. That is a meaningful step up from lab-scale validation, but public retention metrics are\
    \ missing. There is no disclosed customer count, churn, renewal rate, NRR, or GRR, so the only evidence of durability\
    \ is project progression and the company\u2019s claim that it has a growing pipeline of signed agreements. In diligence\
    \ terms, the issue is not whether customers exist; it is whether the first deployments turn into a repeatable customer\
    \ machine that can close the next project faster and with less bespoke effort. The customer lifecycle therefore depends\
    \ less on app-style engagement and more on whether each site can be replicated, expanded, and renewed after the first\
    \ commercial turn-on."
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU011
  - CU012
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: concentration-and-expansion
  title: Expansion loops and concentration risk
  body: Concentration risk remains high because the public record still leans on a few flagship projects. The positive side
    is that those projects can expand into more sectors if Antora can show project delivery, tariff fit, and host-site economics.
    The negative side is that each new project depends on utility interconnection, partner willingness, and a large amount
    of capital. In other words, customer expansion is possible, but it is still driven by project origination rather than
    by a viral or self-serve motion. That makes partner quality and customer concentration central diligence questions. Until
    more named projects are public, concentration has to be read as a structural risk rather than a quantified one.
  claimRefs:
  - CU009
  - CU010
  - CU013
  - CU014
  - CU015
  - CU016
callouts:
- calloutType: strength
  title: POET is real production evidence
  body: The POET deployment is the clearest sign that Antora has moved from promise to production. That matters far more than
    logos or generic interest statements.
  claimRefs:
  - CU002
  - CU005
- calloutType: risk
  title: The customer base is not yet broad enough
  body: Public proof is concentrated in a few named projects, and the company does not disclose retention or concentration
    metrics. That leaves room for one-off project success without true portfolio durability.
  claimRefs:
  - CU006
  - CU007
  - CU008
