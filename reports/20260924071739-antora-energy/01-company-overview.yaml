company:
  name: Antora Energy
chapter:
  number: 1
  title: Company Overview
  summary: Antora Energy is a 2018-founded industrial thermal-storage company that now combines a large U.S. manufacturing
    footprint with a $770 million cumulative raise and a first commercial-scale 5 GWh deployment in South Dakota. The company
    is still opaque on headcount, revenue, and valuation, but the 2026 Series C, customer-facing offtake signals, and domestic-supply-chain
    partnership activity make it materially more advanced than the prior refresh cycle.
sections:
- id: identity-and-leadership
  title: Identity, founders, and current positioning
  body: Antora Energy presents itself as a factory-built thermal-battery company for industry, data centers, and the grid.
    Across the current website and 2026 press materials, the company says it converts low-cost electricity into always-on
    heat and power by storing energy in solid carbon blocks and, in future products, can return that energy through thermophotovoltaic
    conversion. The company page names Andrew Ponec as CEO, David Bierman as Chief Commercial Officer, and Justin Briggs as
    Chief Operating Officer, while the founding story identifies the same three founders. The business is now marketed as
    a scale manufacturing and deployment platform rather than a lab-stage concept, with repeated emphasis on modular factory-built
    systems, industrial customers, and rapid project delivery.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
  - TO002
- id: capital-and-footprint
  title: Funding, manufacturing, and commercial scale
  body: The refresh materially changes Antora's capital and operating footprint. In February 2024, the company said its Series
    B brought total funding above $230 million; in July 2026, it announced a $550 million Series C led by G2 Venture Partners
    and Eclipse, bringing total capital raised to roughly $770 million. The Series C language is explicit that the money is
    meant to accelerate project deployment, expand production, and establish a second U.S. manufacturing hub. Antora also
    says its San Jose factory has expanded into a three-building manufacturing campus and that Project Big Stone, a 5 GWh
    South Dakota system, moved from construction to energy delivery in under 12 months. Those milestones are the clearest
    public markers that the company has progressed from prototype to first commercial-scale execution.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  figureRefs:
  - FO001
- id: gaps-and-implications
  title: What remains undisclosed and what it means
  body: The main diligence gap is not whether Antora has momentum; it is how much of that momentum translates into durable
    economics. None of the reviewed sources disclose current headcount, revenue, gross margin, burn, runway, or an equity
    valuation for the latest round. The company does disclose a strategic collaboration with GrafTech for carbon-based materials
    and says its Series C pipeline already includes signed agreements with hyperscalers and industrial leaders, but the customer
    roster is not public and the exact commercial terms are opaque. That leaves the investment case dependent on whether the
    company can replicate Project Big Stone at multiple sites without margin erosion or schedule slippage. For this refresh,
    the evidence supports strong execution and capital access, but not a fully underwritten financial model.
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
