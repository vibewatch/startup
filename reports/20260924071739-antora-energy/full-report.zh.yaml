  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              与 Antora
              估值直接相关的市场，处于工业供热、电网可靠性与多日长时储能的交汇地带。切合实际的支出分类绝非“所有固定式储能”，而是表前资本开支中用于购买可靠性、可再生能源调峰平抑（firming）或长时供热的那部分市场——在这些场景中，4
              小时电池难以满足需求。在公开记录中，这涵盖了以 POET
              为代表的工业承载企业、公用事业规划团队，以及面临并网排队延迟的大负荷买方。该范畴排除了常规的短时电力套利、绝大多数输电资本开支，以及无需储能的电网升级。当前的替代现状依然是燃气锅炉、调峰电站、抽水蓄能与锂离子电池的组合。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
      - number: '2.2'
        title: 多维度估算视角而非单一 TAM
        blocks:
          - type: paragraph
            body: >-
              公开的市场规模测算依据呈现为一系列不同的评估视角，而非单一确切的 TAM。最宽泛的视角是电池部署总量的快速攀升，证实买方正在储能领域投入资本。稍窄的视角是长时储能类别，DOE、NREL 与 C2ES
              均认为其价值会随着可再生能源渗透率提升与电网可靠性需求而增加，但该领域的商业化进展依然参差不齐。更窄的视角则是受政策支持的示范与部署补贴资金，反映该市场依然需要公共资金协助分担风险。综合来看，各项证据表明这是一个真实存在但受多重约束的市场，尚无法据此推导出已获验证的公司专属收入池。
