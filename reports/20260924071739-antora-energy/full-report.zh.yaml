      - CI006
      - CI007
      - CI011
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Antora 的技术体系可解构为材料化学、模组、系统与部署四层。
    data:
      layers:
        - id: chemistry
          label: 材料化学
          modules:
            - 固体碳储热核心
            - 高温储热
        - id: module
          label: 模组
          modules:
            - 工厂预制电池模组
            - 未来 TPV 转换路径
        - id: system
          label: 系统
          modules:
            - 换热循环回路
            - 控制与调度系统
        - id: deployment
          label: 部署
          modules:
            - 工厂园区
            - 用能现场 EPC 与并网
        - id: safety
          label: 安全与信任
          modules:
            - 碳材料安全叙事
            - 无热失控风险
        - id: ecosystem
          label: 生态体系
          modules:
            - Renewable Thermal Collaborative
            - GrafTech 碳材料供应
    approximationNotes: 本技术架构系根据公开描述推断，并非完整的工程原理图。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Antora 的客户拓展路径经历验证、生产部署与复购扩张循环。
    data:
      items:
        - label: 1. 验证应用场景
          detail: 工业或公用事业买方认可持续多日供热或稳定电力的商业价值。
        - label: 2. 搭建合作方架构
          detail: 开发商、公用事业公司与用能现场各方协议敲定，使项目具备可融资性。
        - label: 3. 部署首套系统
          detail: POET / Big Stone 是目前最明确的生产级项目标杆。
        - label: 4. 实际运行与经验积累
          detail: 可靠性、成本与正常运行时间成为真正的验证关键。
        - label: 5. 拓展新细分客群
          detail: 公用事业、数据中心以及其他工业用能现场成为下一波拓展目标。
        - label: 6. 复购与规模化
          detail: 客户能否持续复购，是当前尚未解决的核心验证点。
    approximationNotes: 本客户旅程系根据公开项目信息与招聘动态推断得出。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
      - CU013
