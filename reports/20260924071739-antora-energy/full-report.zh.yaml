  - id: FM001
    title: 市场规模分析视角
    type: pyramid
    summary: 从宏观储能需求层层拆解至 Antora 的受限切入市场。
    data:
      items:
        - label: 宏观储能需求
          value: 18.9 GW
          detail: 2025 年美国电池装机量创历史新高。
          claimRefs:
            - CM009
        - label: 政策支持
          value: $247M+
          detail: 加州对非锂长时储能（LDES）的专项配额。
          claimRefs:
            - CM008
        - label: LDES 定义标准
          value: 10+ hours
          detail: 将长时储能（LDES）与短时储能区分开来的政策定义。
          claimRefs:
            - CM006
        - label: 买方画像
          value: 3 buyer classes
          detail: 公开记录中可见电力公司、工业场址东道方及大负荷客户。
