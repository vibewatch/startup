        - $1.0B-$1.8B EV
        - 概率上升
        - 若客户验证落地且经济性得到披露，上行空间将进一步打开。
      - - 基准
        - 仅有一家公开客户或单点项目中标，执行持续推进，但经济效益依然不透明。
        - $600M-$900M EV
        - 最可能发生
        - 若证据依然单线孤立，建议保持观察而非买入。
      - - 悲观
        - 未披露新客户，融资平价轮或折价轮，项目进度推迟或成本超支。
        - $250M-$500M EV
        - 不可忽视
        - 若融资转弱或项目延误，投资逻辑需重新评估。
    notes: 因没有公开估值或收入基数披露，上述区间属于研判性质的情景锚点，并非正式估值。
    approximationNotes: >-
      These ranges are judgmental scenario markers rather than a formal mark because no public valuation or revenue base
      is disclosed.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 精选创立、融资、制造、客户及供应链里程碑，勾勒出 Antora 当前的公开业务全貌。
    data:
      items:
        - label: 创立
          date: '2018'
          detail: Andrew Ponec、David Bierman 与 Justin Briggs 创立 Antora。
          tone: positive
          claimRefs:
            - CO001
        - label: Series B 轮
          date: '2024-02-22'
          detail: 已披露融资 $150 million，带动公开总融资额突破 $230 million。
          tone: positive
          claimRefs:
            - CO006
        - label: Project Big Stone
          date: '2026-05-21'
          detail: 与 POET 绑定的 5 GWh 部署项目在 12 个月内实现供能交付。
          tone: positive
          claimRefs:
            - CO009
        - label: Series C 轮
          date: '2026-07-30'
          detail: $550 million 轮次资金用于产能扩张及建设第二个美国制造中心。
          tone: positive
          claimRefs:
            - CO007
            - CO008
        - label: 工厂园区
          date: 2026-09
          detail: Mintz 将 San Jose 场址描述为由三栋建筑组成的制造园区和一座大型超级工厂。
          tone: positive
          claimRefs:
            - CO010
        - label: GrafTech 战略合作
          date: '2026-09-10'
          detail: 宣布达成战略合作，为热电池供应碳基材料。
