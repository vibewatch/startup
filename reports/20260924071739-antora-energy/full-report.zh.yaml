companyProfile:
  summary: >
    Antora Energy 是一家总部位于 San Jose
    的工业热储能公司，业务已从单纯的技术验证迈入切实的制造与项目部署阶段。公司称，其将低成本电力以热能形式储存在固体碳块中，随后按需以工艺热或电力的形式释放能量。公开证据显示，公司已完成 $550 million Series C
    融资，累计已披露融资金额约 $770 million，推进了 5 GWh 的 Project Big Stone 项目部署，并拥有 Antora 和 Mintz
    所称的全美最大电池超级工厂之一的制造园区。剩余的公开盲区依然关键：收入、资金消耗、现金流维持时间（runway）、客户集中度，以及最新一轮融资的入场估值。
