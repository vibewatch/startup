    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创始人与业务现状
        blocks:
          - type: paragraph
            body: >-
              Antora Energy 将自身定位为面向工业、数据中心及电网的工厂预制热电池企业。在现有官网与 2026
              年的新闻通稿中，公司称其将低成本电力储存在固体碳块中，转化为全天候可用的热能与电力，并计划在未来产品中借助热生光伏（TPV）转换释放电能。公司官网将 Andrew Ponec 列为 CEO，David
              Bierman 列为 Chief Commercial Officer，Justin Briggs 列为 Chief Operating
              Officer，创立历程中同样记载了这三位联合创始人。该业务如今对外呈现为规模化制造与项目部署平台，而非实验室阶段概念，反复强调模块化工厂预制系统、工业客户与快速项目交付。
