        blocks:
          - type: paragraph
            body: >-
              本次更新显著修正了 Antora 的资本面貌与运营版图。2024 年 2 月，公司称其 Series B 融资使总融资金额超过 $230 million；2026 年 7 月，公司宣布完成由 G2 Venture
              Partners 与 Eclipse 领投的 $550 million Series C 融资，使累计筹集资金达到约 $770 million。Series C
