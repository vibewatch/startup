  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品、相邻方案与替代技术
        blocks:
          - type: paragraph
            body: >-
              Antora 的竞争格局呈现为一个多元的热储能技术谱系，而非单一的同类公司集合。公开汇总文章将 Rondo、Malta、Brenmiller、MGA Thermal、EnergyNest、1414 Degrees
              以及 Polar Night Energy 列为切实存在的热储能替代方案，各自在工作温度、储能介质与目标市场上各有侧重。Antora
              自身的定位与工业工艺用热和大负荷电网调峰高度重合，但采购方在评估时，仍会将其与锂电池、抽水蓄能以及燃气锅炉的经济性作对比。因此，真正的竞争实为一整套技术、电价机制与项目融资路径的综合权衡，而非面对单一直接对手。部分供应商更接近锅炉替代方案，而另一些则更侧重于电网级调峰或热电联产。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP010
              - CP013
      - number: '3.2'
        title: 能力对比与转换壁垒
        blocks:
          - type: paragraph
            body: >-
              核心差异化要素包括储能时长、运行温度、安全性、项目能量密度，以及供应商能否按期发货并完成系统安装。Antora
              的公开宣传重点强调固体碳、多日储能以及工厂模块化交付；竞品则侧重不同的储能介质、更低或更高的温度区间，或替代性的热电转换架构。然而切换成本绝不仅限于材料化学。热储能项目还取决于电网并网、因地制宜的定制化工程、公用事业电价架构、EPC
              施工承接能力，以及承载客户签署长期消纳协议的意愿。这些落地阻力筑起了一定护城河，但也给传统成熟技术和相邻方案凭借行业熟悉度赢得订单留下了空间。采购方更看重具备融资可行性的成熟项目背书，而非仅凭动听的材料学故事。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP015
              - CP018
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
