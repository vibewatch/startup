              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: 护城河韧性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Antora 的护城河更多体现于工程执行力，而非单纯的专利排他性。公司的工厂园区、首个 GWh
              级别部署项目以及本土供应链建设至关重要，因为热储能项目极难实现高可靠性的重复交付。然而，保留的研究资料显示，数家竞争对手已交付商业化系统，而在最短时长的电网储能市场中，锂离子电池依然构成了极具压迫感的竞争。实际层面的关键问题在于，Antora
              能否在交付工期、产品质量和成本结构上跑赢更广泛的热储能同行，同时避免自身被局限在单一客户客群中。严谨的执行力至关重要，因为该赛道如今已足够拥挤，光靠概念新颖早已无法促成交易。
            claimRefs:
              - CP014
              - CP015
              - CP018
          - type: table
            tableRef: TP003
