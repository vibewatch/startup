            body: >-
              尽调的核心疑点不在于 Antora
              是否具备势头，而在于这种势头有多少能转化为可持续的单位经济效益。所有已审阅的材料均未披露当前员工人数、收入、毛利率、资金消耗率、现金流维持时间（runway）或最新一轮融资的股权估值。公司确实披露了与
              GrafTech 在碳基材料领域的战略合作，并称其 Series C
              业务储备中已包含与超大规模数据中心服务商（hyperscaler）及工业龙头签署的协议，但客户名单尚未公开，具体的商业条款也缺乏透明度。这使得投资逻辑仍高度取决于公司能否在多处场地复刻 Project Big
              Stone，且不发生利润侵蚀或工期延误。就本次更新而言，证据支持其出色的执行力与资本获取能力，但尚不足以支撑建立经充分验证的完整财务模型。
