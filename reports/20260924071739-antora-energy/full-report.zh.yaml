  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入来源与商业化变现
        blocks:
          - type: paragraph
            body: >-
              Antora 的公开商业变现模式更倾向于基于具体项目的交付，而非软件订阅模式。最清晰的公开范例是 POET 项目，Antora
              及其项目合作伙伴在长期消纳承购协议下销售热能。这代表其收入与实际交付的热能、项目可用率以及合同条款结构挂钩，而非按席位收费或单纯销售硬件设备。公开的招聘信息与投资人推介材料还表明，公司已在核心产品周边构建了项目发起、开发与部署能力。目前缺失的是对投资决策至关重要的商业细节：公开标价、实际成交价、合同期限、价格调升机制以及客户集中度。这一缺失尤为关键，因为项目制收入在账面规模上或许庞大，但在扣除
              EPC 施工与电网并网成本后，利润率可能相当单薄。
            claimRefs:
              - CI001
              - CI002
