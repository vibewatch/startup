      - number: '2.3'
        title: 买方画像、预算负责人与采纳路径
        blocks:
          - type: paragraph
            body: >-
              相比市场规模，买方群体的构成更为明确。Antora
              的公开证据指向三类核心买方：需要保障电网可靠性与整合可再生能源的公用事业公司、需要全天候工业工艺热的工厂基地，以及需要快速获取稳定电力的大负荷客户（如数据中心）。预算审批权通常归属于公用事业公司的资源规划或发电团队、工业企业的运营团队，或者在联合选址模式下由开发商及项目融资机构主导。市场采纳分为不同阶段：先完成规划编制，继而选址与申请并网，随后开展项目施工，最后进入多日调度运行。这种漫长的推进节奏，正是单个项目虽能证明需求却尚未证明可复制市场份额的原因所在。
            claimRefs:
              - CM012
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动因素与推广制约条件
        blocks:
          - type: paragraph
            body: >-
              该市场的乐观情景十分清晰：用电需求持续攀升，可再生能源带来了更高的电网波动性，工业客户急需不依赖化石燃料燃烧的热力或电力方案。但推广的制约条件同样明确。长时储能仍需公共政策扶持，公用事业机构决策审慎，而锂离子电池在较短时长项目储备中占据主导地位。对
              Antora 而言，时机把握与技术本身同等重要。一个项目即便因解决切中痛点的问题而极具吸引力，但若电价机制设计、采购审批规则或并网进度滞后于工程交付方案，商业化变现仍可能十分缓慢。
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM021
      - number: '2.5'
        title: 证据图表
        blocks:
          - type: callout
            title: 买方痛点确凿存在
            body: 保留的参考资料描绘的绝非虚构市场，而是展示了公用事业、工业及大负荷用电领域的实际推进项目；在这些场景中，储能时长、供能可靠性以及供热经济性在当下已举足轻重。
            calloutType: strength
            claimRefs:
              - CM012
              - CM014
              - CM015
          - type: callout
            title: 公开测算尚不足以厘清 Antora 的独立 SAM
            body: 公开资料中并没有具备来源支撑、针对该公司的独立 SAM 或 SOM。投资者应当将储能行业的广泛增长视为宏观背景，而非对 Antora 收入的直接预测。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
