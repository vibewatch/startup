            body: >-
              正方逻辑在于，Antora
              是工业能源硬件领域极为罕见的标的，具备显而易见的项目交付与制造扩张势头。反方观点则认为，公开估值证据过于单薄，不足以支撑买入决策：最新融资头条虽然报道了巨额募资，却未公布隐含估值定价，而低可靠性的市场数据网站给出的估算噪音过大，无法作为可靠的估值基准。这代表任何可比公司对标都只能被视为参考框架，不能替代已披露的融资轮次或真实收入基数。若公司后续公布具体客户名单并披露经营指标，估值判断或将迅速调整；在此之前，估值定价在很大程度上仍依赖主观判断。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: 情景假设、退出路径与尽调需求清单
        blocks:
          - type: paragraph
            body: >-
              可行的估值框架应基于情景分析建立。乐观情景假定公司将项目推进势头转化为可复制的客户规模化采纳，并以高于当前一级市场行情的估值完成新一轮定价融资；悲观情景假定估值持平或下调（down
              round）、项目部署发生延期，或经济性指标持续缺乏透明度。基准情景则更为中肯：执行力稳步推进并展现一到两项公开佐证，但信息披露仍不足以支持买入决策。退出准备度取决于当前仍属空白的关键尽调依据——股权结构表、优先股堆叠（preference
              stack）以及项目融资条款——而非再多看一页关于市场需求的宣讲胶片。正因如此，投资评级依然维持 TRACK。
            claimRefs:
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
