  - id: FV001
    title: 建议推导逻辑
    type: flow
    summary: 决策链条从项目落地验证、制造端信誉、价格不透明度与下行风险出发，最终推导出 TRACK 建议。
    approximationNotes: 本图为定性逻辑流程图，不构成正式的财务模型。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV012
    data:
      nodes:
        - id: v1
          label: 已有项目落地证据
          type: start
        - id: v2
          label: 制造布局与团队招聘展现出规模化纪律
          type: process
        - id: v3
          label: 资方资金支持明确，但估值定价仍不透明
          type: process
        - id: v4
          label: 收入、股权结构表及优先股堆叠均未披露
          type: decision
        - id: v5
          label: 可比公司数据杂音过多，不足以支撑买入建议
          type: process
        - id: v6
          label: 乐观路径需要实名落地客户与溢价融资轮次
          type: process
        - id: v7
          label: 悲观情形对应平价/折价轮融资或项目进度延期
          type: process
        - id: v8
          label: 投资建议：TRACK
          type: end
      edges:
        - from: v1
          to: v2
          label: 落地执行证据
        - from: v2
          to: v3
          label: 规模化扩张真实推进
        - from: v3
          to: v4
          label: 交易定价仍不透明
        - from: v4
          to: v5
          label: 信息披露缺失限制了评估精度
        - from: v5
          to: v6
          label: 评级上调需要坚实证据
        - from: v5
          to: v7
          label: 下调触发条件至关重要
        - from: v6
          to: v8
          label: 信息披露更加透明
        - from: v7
          to: v8
          label: 扩张势头放缓
