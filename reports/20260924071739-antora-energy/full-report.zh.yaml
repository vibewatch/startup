  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              最大的法律与监管风险并非轰动性诉讼，而是业务对各项目具体审批许可、公用事业电价机制以及电网并网许可的重度依赖。Antora
              的项目有赖于能够保障热储能具备经济性的电价结构，而这些结构随时可能调整。保留资料虽未揭示重大行政执法处罚，但确实表明该公司依赖公共资助项目、与公用事业机构协商的特定安排以及创新示范类审批。因此，法律尽调应当聚焦于合同可执行性、电价机制的长期稳定性以及每个项目所在地的监管政策取向，而非泛泛对照通用公司法清单。即便公司自身并无任何法律丑闻，微小的监管政策变动也可能波及具体项目。由于每个落地的经济模型因地而异，实际层面的核心问题在于一个州行之有效的审批流程能否在下一个州顺利复制。这使得行政许可审批节奏与电价稳定性同传统诉讼风险核查一样举足轻重。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
