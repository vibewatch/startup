            body: >-
              运营风险深植于工厂制造与现场施工中。Antora
              在扩充产能的同时，还在发运并发起大型热资产安装，因此任一现场的工期延误都可能波及整体交付排期。合作伙伴风险同样不可忽视，因为公司的项目依赖公用事业机构、项目开发商、用能企业及原材料供应商。与 GrafTech
              的合作虽有助于碳材料的供应获取，但这并未消除供应商集中度或单点故障风险。在实际操作中，即便纸面方案看似消除了风险，只要某个合作方、实施现场或供应商出现闪失，公司仍可能损失工期或利润。最可能出现的失效模式，是单点延误在局部看似可控，却在整个排期中引发连锁反应。合作伙伴生态链同样至关重要，因为
              Antora 销售的并非纯软件产品；即便下游需求强劲，每个现场所依赖的实体合作方链条都可能拖慢推进节奏。
