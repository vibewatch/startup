  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Electricity input
        - Charges the thermal system
        - Low-cost power and interconnection
        - Tariff / grid access constraints
      - - Carbon thermal core
        - Stores energy as heat
        - Carbon block manufacturing and thermal insulation
        - Thermal loss and durability disclosure gaps
      - - Heat transfer loop
        - Moves stored heat to host equipment
        - Site-specific integration
        - Engineering complexity
      - - TPV path
        - Converts light to electricity in future products
        - Heat-to-power materials and cell stack
        - Future-product uncertainty
      - - Factory / EPC layer
        - Builds and installs systems
        - Labor, supply chain, and project management
        - Schedule risk
      - - Controls / software layer
        - Runs charging, dispatch, and safety controls
        - BMS, PCS, cyber assurance
        - Public disclosure gap
    notes: Public sources describe the layers but not a full supplier map.
