chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Antora’s product story is credible because it combines a specific thermal-battery chemistry, a factory-built
    delivery model, and at least one GWh-scale deployment. The public record is strongest on what the system does and
    weaker on the exact controls, vendor stack, and field-performance data. The result is a serious hardware platform
    with visible maturity, but not yet a fully bankable operating-asset stack.
sections:
  - id: product-definition
    title: What Antora delivers and who uses it
    body: >-
      Antora sells a factory-built thermal battery that stores low-cost electricity as heat and delivers around-the-
      clock heat or power to industrial sites, data centers, and grid-connected projects. The customer workflow is
      straightforward: charge during cheap or abundant electricity, hold heat in carbon, and then discharge when a
      host site needs process heat or firm capacity. The public pitch is not software-first or services-first; it is a
      physical energy asset with an operating model around project deployment, site integration, and long-duration
      dispatch. In other words, the product has to fit the plant rather than asking the plant to adapt to the
      product.
    claimRefs:
      - CE001
      - CE002
      - CE011
      - CE014
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-deployment
    title: Architecture, manufacturing, and deployment
    body: >-
      The architecture is visible enough to be useful in diligence. Antora describes solid carbon blocks, thermal
      storage at very high temperature, and future heat-to-power conversion via TPV. Manufacturing is also moving
      beyond concept: the company says the San Jose campus now spans multiple buildings, and the Big Stone project
      moved from construction to energy delivery in under 12 months. That combination suggests a real system stack,
      but the public record still stops short of a full one-line diagram, supplier map, or control-stack disclosure.
      The company’s own insight pages also show a steady public communication cadence around the product.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE015
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: trust-and-gaps
    title: Safety, trust, and remaining product gaps
    body: >-
      The trust story is mixed but promising. Antora emphasizes carbon’s safety advantages, no thermal runaway, and a
      lack of supply-constrained critical minerals. At the same time, the public record does not disclose a full
      security or controls certification stack, named inverter vendors, or field reliability curves. For a hardware
      company this matters: buyers will care not just about the chemistry, but about support, controls, integration,
      and long-term operations. The product is real, but the bankability packet is still incomplete. The official
      communications stream is active, but it is not a substitute for certification and field data.
      That gap is exactly where a utility or industrial customer will focus diligence before signing a larger contract.
    claimRefs:
      - CE009
      - CE010
      - CE012
      - CE013
      - CE016
callouts:
  - calloutType: strength
    title: This is now a real hardware stack
    body: >-
      Public evidence shows a chemistry, a manufacturing footprint, and at least one large deployment. That is more
      than a research narrative.
    claimRefs:
      - CE001
      - CE006
      - CE007
  - calloutType: risk
    title: Controls and reliability disclosure is still thin
    body: >-
      The system may be real, but buyers still need the controls, cybersecurity, and reliability packet before treating
      it like a standard industrial asset.
    claimRefs:
      - CE010
      - CE016
