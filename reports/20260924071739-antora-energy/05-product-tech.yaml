  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls and security
      missingEvidence: Named inverter vendors, BMS stack, and cyber certification details.
      whyItMatters: Utilities and large industrial customers will ask for this before deep integration.
      diligencePath: Request one-line diagrams, controls vendor lists, and security audits.
      relatedQuestionRefs:
        - QE006
        - QE008
    - type: missing-source
      severity: minor
      topic: reliability curves
      missingEvidence: Public field reliability, degradation, and warranty curves.
      whyItMatters: Bankability depends on the asset’s long-run performance, not only on chemistry.
      diligencePath: Request telemetry and warranty schedules.
      relatedQuestionRefs:
        - QE008
    - type: missing-source
      severity: minor
      topic: product roadmap
      missingEvidence: Detailed public roadmap for product releases and support structure.
      whyItMatters: Buyers need to know how support and upgrades are handled over time.
      diligencePath: Request product roadmap and support agreements.
      relatedQuestionRefs:
        - QE009
