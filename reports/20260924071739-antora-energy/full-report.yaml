  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Antora’s valuation-relevant market is the intersection of industrial heat, grid reliability, and multi-day
              storage. The right spend bucket is not “all stationary storage”; it is the portion of front-of-the-meter
              capital that buys reliability, renewable firming, or long-duration heat where four-hour batteries are not
              enough. In the public record, that includes industrial host sites such as POET, utility planning teams,
              and large-load buyers facing interconnection queues. It excludes ordinary short-duration arbitrage, most
              transmission capex, and grid upgrades that do not require storage. The status-quo alternative remains a
              mix of gas boilers, peakers, pumped hydro, and lithium-ion batteries.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
      - number: '2.2'
        title: Sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence supports a series of lenses rather than one neat TAM. The broadest lens is the fast
              growth in battery deployments overall, which confirms that buyers are spending on storage. A narrower lens
              is the long-duration category, where DOE, NREL, and C2ES all argue the value rises with renewable
              penetration and reliability needs, but commercialization remains uneven. A still narrower lens is
              policy-backed demonstration and deployment funding, which shows that the market still needs public
              de-risking. Taken together, the sources support a real but constrained market, not a verified
              company-specific revenue pool.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer set is more coherent than the market size. Antora’s public evidence points to three primary
              buyer classes: utilities that need reliability and renewable integration, industrial host sites that need
              around-the- clock process heat, and large-load customers such as data centers that need fast firm power.
              Budget ownership appears to sit with utility resource-planning or generation teams, industrial operations
              teams, or developer/ project-finance groups when the system is co-located. Adoption is staged: planning
              first, then site selection and interconnection, then project execution, then multi-day dispatch. That slow
              motion is why a project can prove demand without yet proving a repeatable market share.
            claimRefs:
              - CM012
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The bull case for the market is straightforward: electricity demand is rising, renewables create more
              volatility, and industrial customers want heat or power that does not depend on fossil fuel combustion.
              But the adoption constraints are just as clear. Long-duration storage still needs public support,
              utilities move carefully, and lithium-ion dominates the shorter-duration pipeline. For Antora, that means
              timing matters as much as technology. A project can be compelling because it solves a real problem, yet
              still monetize slowly if rate design, procurement rules, or interconnection timelines lag behind the
              engineering case.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM021
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The buyer problem is real
            body: >-
              The retained sources do not describe a fictional market. They show live utility, industrial, and
              large-load projects where duration, reliability, and heat economics matter today.
            calloutType: strength
            claimRefs:
              - CM012
              - CM014
              - CM015
          - type: callout
            title: Public sizing stops short of a clean Antora SAM
            body: >-
              There is no source-backed company-specific SAM or SOM. Investors should treat broad storage growth as
              context, not as a direct forecast of Antora revenue.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM021
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Antora’s competitive landscape is a thermal-storage stack, not a single peer set. The public roundup
              article names Rondo, Malta, Brenmiller, MGA Thermal, EnergyNest, 1414 Degrees, and Polar Night Energy as
              real thermal storage alternatives, each with different temperatures, storage media, and market focus.
              Antora’s own positioning overlaps most with industrial process heat and large-load firming, but the buyer
              still compares it against lithium-ion, pumped hydro, and gas-fired boiler economics. That means the real
              competition is a bundle of technologies, tariffs, and project-finance paths rather than a single direct
              rival. Some vendors are closer to boiler replacement, while others are closer to grid-scale firming or
              combined heat and power.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP010
              - CP013
      - number: '3.2'
        title: Capability comparison and switching costs
        blocks:
          - type: paragraph
            body: >-
              The main differentiators are duration, operating temperature, safety, project density, and whether the
              vendor can actually ship and install systems on a schedule. Antora’s public materials emphasize solid
              carbon, multi-day storage, and factory-built deployment; competitors emphasize different storage media,
              lower or higher temperatures, or alternate heat-to-power architectures. But the switching cost story is
              not just chemistry. A thermal-storage project also depends on interconnection, site-specific engineering,
              utility tariffs, EPC capacity, and host-customer willingness to sign long-term offtakes. Those frictions
              create some moat, but they also create room for incumbents and adjacent technologies to win on
              familiarity. Buyers also care about bankable references, not just a good chemistry story.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP015
              - CP018
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Antora’s moat looks stronger on execution than on pure IP exclusivity. The company’s factory campus, first
              GWh- scale deployment, and domestic supply-chain work all matter because thermal storage projects are
              difficult to deliver repeatedly. Still, the retained sources show that several competitors already have
              commercial systems, and the shortest-duration grid-storage market remains heavily contested by
              lithium-ion. The practical question is whether Antora can keep its schedule, quality, and cost structure
              ahead of a wider field of thermal-storage vendors while also avoiding being boxed into only one customer
              segment. Execution discipline matters because the category is now crowded enough that novelty alone will
              not carry deals.
            claimRefs:
              - CP014
              - CP015
              - CP018
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP018
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Antora’s public edge is execution density, not a monopoly
            body: >-
              The company’s public proof points are compelling because they combine hardware, manufacturing, and project
              delivery. But the same record shows a wide, active thermal-storage field, so the moat has to be earned
              repeatedly.
            calloutType: strength
            claimRefs:
              - CP008
              - CP009
              - CP014
          - type: callout
            title: Competing thermal chemistries already have commercial projects
            body: >-
              Public evidence does not support a “first mover with no peers” story. Several alternative thermal-storage
              approaches already have live projects or sizeable pilots, which means Antora must win on project economics
              and delivery, not just on novelty.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization
        blocks:
          - type: paragraph
            body: >-
              Antora’s public revenue model looks project-based rather than subscription-based. The clearest public
              example is the POET project, where Antora and its project partner sell heat under a long-term offtake
              arrangement. That implies revenue tied to delivered thermal energy, project availability, and contract
              structure rather than to seat counts or pure hardware sales. Public hiring and investor materials also
              suggest project origination, development, and deployment capabilities around the core product. What is
              missing is the commercial detail that matters for underwriting: list price, realized price, contract term,
              escalation, and customer concentration. That gap is especially important because project revenue can look
              large in headline terms while still being thin on margin after EPC and interconnection costs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
