            claimRefs:
              - CO005
              - CO016
      - number: '1.2'
        title: Funding, manufacturing, and commercial scale
        blocks:
          - type: paragraph
            body: >-
              The refresh materially changes Antora's capital and operating footprint. In February 2024, the company
              said its Series B brought total funding above $230 million; in July 2026, it announced a $550 million
              Series C led by G2 Venture Partners and Eclipse, bringing total capital raised to roughly $770 million.
              The Series C language is explicit that the money is meant to accelerate project deployment, expand
              production, and establish a second U.S. manufacturing hub. Antora also says its San Jose factory has
              expanded into a three-building manufacturing campus and that Project Big Stone, a 5 GWh South Dakota
              system, moved from construction to energy delivery in under 12 months. Those milestones are the clearest
              public markers that the company has progressed from prototype to first commercial-scale execution.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: What remains undisclosed and what it means
        blocks:
          - type: paragraph
            body: >-
              The main diligence gap is not whether Antora has momentum; it is how much of that momentum translates into
              durable economics. None of the reviewed sources disclose current headcount, revenue, gross margin, burn,
              runway, or an equity valuation for the latest round. The company does disclose a strategic collaboration
              with GrafTech for carbon-based materials and says its Series C pipeline already includes signed agreements
              with hyperscalers and industrial leaders, but the customer roster is not public and the exact commercial
              terms are opaque. That leaves the investment case dependent on whether the company can replicate Project
              Big Stone at multiple sites without margin erosion or schedule slippage. For this refresh, the evidence
              supports strong execution and capital access, but not a fully underwritten financial model.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO011
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public data still leaves the unit economics open
            body: >-
              The company's strongest public proof points are financing and execution milestones. The missing pieces
              that matter most for underwriting are revenue quality, gross margin, burn, and the terms behind the signed
              agreements and project-level financing.
            calloutType: risk
