              - CU004
              - CU006
              - CU013
      - number: '6.3'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Concentration risk remains high because the public record still leans on a few flagship projects. The
              positive side is that those projects can expand into more sectors if Antora can show project delivery,
              tariff fit, and host-site economics. The negative side is that each new project depends on utility
              interconnection, partner willingness, and a large amount of capital. In other words, customer expansion is
              possible, but it is still driven by project origination rather than by a viral or self-serve motion. That
              makes partner quality and customer concentration central diligence questions. Until more named projects
              are public, concentration has to be read as a structural risk rather than a quantified one.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: POET is real production evidence
            body: >-
              The POET deployment is the clearest sign that Antora has moved from promise to production. That matters
              far more than logos or generic interest statements.
            calloutType: strength
            claimRefs:
              - CU002
              - CU005
          - type: callout
            title: The customer base is not yet broad enough
            body: >-
              Public proof is concentrated in a few named projects, and the company does not disclose retention or
              concentration metrics. That leaves room for one-off project success without true portfolio durability.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The biggest legal and regulatory risk is not a headline lawsuit; it is the dependency on project-specific
              permits, utility tariffs, and interconnection approvals. Antora’s projects depend on a tariff structure
              that makes thermal storage economic, and those structures can change. The retained sources do not surface
              a major enforcement issue, but they do show that the company relies on public programs, negotiated utility
              arrangements, and first-of-kind approvals. That means legal diligence should focus on contract
              enforceability, tariff durability, and the regulatory posture of each deployment rather than on a generic
              corporate-law checklist. Small regulatory changes can therefore have project-level consequences even if
              the company itself has no legal scandal. Because each deployment has site-specific economics, the
              practical question is whether an approval that works in one state can be replicated in the next. That
              makes permitting tempo and tariff durability as important as any traditional litigation check.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational, quality, and partner risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk sits in the factory and in the field. Antora is scaling manufacturing while also shipping
              and installing large thermal assets, so a delay in one site can ripple through the broader schedule.
              Partner risk is equally important because the company’s projects depend on utilities, developers, host
              sites, and material suppliers. GrafTech helps on carbon access, but that does not eliminate concentration
              or single-point-of-failure risk. In practice, the company can look de-risked on paper and still lose time
              or margin if one partner, site, or supplier slips. The most likely failure mode is a delay that looks
              manageable in isolation but cascades across the schedule. The partner stack also matters because Antora is
              not selling a pure software product; every site depends on a chain of physical counterparties that can
              slow the schedule even when demand is strong.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
      - number: '7.3'
        title: Financial, model, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Financial risk is mostly about capital intensity and opacity. Antora has raised a lot of money, but the
              retained sources do not disclose burn, runway, or project-level contribution margin. That means the
              company can be executing well and still need another capital event if projects are slower or less
              profitable than expected. The thesis-break triggers are therefore straightforward: a missed flagship
              project, no repeat customer conversion, major cost inflation, or a financing gap before the next
              deployment wave. If any of those show up, the market will likely re-rate the story quickly. The Financial
              Analyst and MLQ pieces capture investor excitement, but neither changes the underlying capital-risk math.
              For investors, the most important discipline is to treat progress as a sequence of project milestones
              rather than as a single aggregate SaaS-style ARR curve.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a project-delivery risk story
            body: >-
              The core question is not whether the chemistry exists; it is whether Antora can keep delivering complex
              projects on time, on budget, and with enough repeatability to justify the capital being deployed.
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
              - CR014
          - type: callout
            title: No major legal scandal is visible
            body: >-
              The public record does not show a major lawsuit or enforcement action, so the risk map is dominated by
              operating and financing execution rather than by a visible litigation overhang.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment recommendation and thesis logic
        blocks:
          - type: paragraph
            body: >-
              Antora receives a TRACK recommendation rather than a BUY because the evidence has moved from concept risk
              to execution risk, but not to priced commercial proof. The South Dakota project and the company’s hiring
              and manufacturing trail show that the business is real and scaling, and the GrafTech collaboration
              suggests that at least one meaningful supply chain has been de-risked. Even so, no public revenue, cap
              table, or customer economics are disclosed, so the valuation question remains about entry price, not just
              company quality. Until a priced Series C or a broader set of named customers appears, the prudent stance
              is to monitor rather than force a full position.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable frame
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Antora is a rare industrial-energy hardware business with demonstrable deployment and
              manufacturing momentum. The anti-thesis is that public valuation evidence is too thin to justify a buy:
              the latest financing headline describes a huge raise, but not the implied price, and low-reliability
              market-data pages produce noisy estimates rather than a dependable mark. That means any comp set must be
              treated as a reference frame, not as a substitute for a disclosed round or revenue base. If the company
              later names customers and publishes operating metrics, the valuation call can move quickly; until then,
              the mark is mostly judgment.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Scenarios, exits, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A workable valuation frame is scenario-based. The bull case assumes the company converts project momentum
              into repeatable customer adoption and a priced round that steps up from the current private market; the
              bear case assumes a flat or down round, delayed deployments, or continuing opacity around economics. The
              base case is more modest: continued execution with one or two public proof points, but still not enough
              disclosure to justify a buy. Exit readiness depends on diligence artifacts that are still missing
              today—cap table, preference stack, and project-finance terms—not on one more slide about demand. That is
              why the recommendation stays TRACK.
            claimRefs:
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
