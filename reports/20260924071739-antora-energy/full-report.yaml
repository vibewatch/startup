              - CI006
              - CI007
              - CI011
              - CI013
      - number: '4.3'
        title: What cannot yet be underwritten
        blocks:
          - type: paragraph
            body: >-
              The financial gap is not just missing valuation data; it is missing operating metrics. Public sources do
              not disclose revenue, ARR, gross margin, burn, runway, or project-level contribution margin. Forge and
              Multiples provide private-market estimates, but those are not company disclosures and should be treated as
              indicative rather than definitive. The result is a company with strong capital access and visible
              execution signals, but still too little public evidence to build a clean forward model without data-room
              support. That is why the finance chapter should be read as a diligence map, not as a full model.
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital access is exceptional
            body: >-
              Whatever the exact economics, the company has already raised enough capital to keep scaling projects and
              manufacturing. That reduces near-term financing risk relative to most pre-commercial hardware peers.
            calloutType: strength
            claimRefs:
              - CI007
              - CI008
          - type: callout
            title: Public economics are still opaque
            body: >-
              Investors do not yet have the numbers needed to underwrite gross margin, burn, or payback. That opacity
              matters because the project model can look attractive even when project-level returns are weak.
            calloutType: risk
            claimRefs:
              - CI005
              - CI009
