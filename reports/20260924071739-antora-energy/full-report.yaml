chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founders, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Antora Energy presents itself as a factory-built thermal-battery company for industry, data centers, and
              the grid. Across the current website and 2026 press materials, the company says it converts low-cost
              electricity into always-on heat and power by storing energy in solid carbon blocks and, in future
              products, can return that energy through thermophotovoltaic conversion. The company page names Andrew
              Ponec as CEO, David Bierman as Chief Commercial Officer, and Justin Briggs as Chief Operating Officer,
              while the founding story identifies the same three founders. The business is now marketed as a scale
              manufacturing and deployment platform rather than a lab-stage concept, with repeated emphasis on modular
              factory-built systems, industrial customers, and rapid project delivery.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
