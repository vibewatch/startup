              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI011
      - number: '4.2'
        title: Cost structure, capex, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The economics are capital intensive by design. The company is expanding manufacturing, shipping large
              thermal assets, and building project-level infrastructure that depends on EPC, interconnection, and
              supply-chain execution. That means the cost stack likely includes factory labor, materials, controls,
              logistics, site-specific engineering, and project development overhead before any customer energy is
              delivered. The public capital picture reinforces that point: Antora raised a very large Series C and says
              the proceeds will accelerate deployments, expand production, and fund a second U.S. manufacturing hub.
              None of the retained sources show a capital-light or near-term self-funding profile. Any public model
              therefore has to assume substantial up-front capital tied to factories, projects, and working capital.
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI013
              - CI014
