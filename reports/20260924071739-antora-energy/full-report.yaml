      - number: '5.2'
        title: Architecture, manufacturing, and deployment
        blocks:
          - type: paragraph
            body: >-
              The architecture is visible enough to be useful in diligence. Antora describes solid carbon blocks,
              thermal storage at very high temperature, and future heat-to-power conversion via TPV. Manufacturing is
              also moving beyond concept: the company says the San Jose campus now spans multiple buildings, and the Big
              Stone project moved from construction to energy delivery in under 12 months. That combination suggests a
              real system stack, but the public record still stops short of a full one-line diagram, supplier map, or
              control-stack disclosure. The company’s own insight pages also show a steady public communication cadence
              around the product.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE010
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE014
      - number: '5.3'
        title: Safety, trust, and remaining product gaps
        blocks:
          - type: paragraph
            body: >-
              The trust story is mixed but promising. Antora emphasizes carbon’s safety advantages, no thermal runaway,
              and a lack of supply-constrained critical minerals. At the same time, the public record does not disclose
              a full security or controls certification stack, named inverter vendors, or field reliability curves. For
              a hardware company this matters: buyers will care not just about the chemistry, but about support,
              controls, integration, and long-term operations. The product is real, but the bankability packet is still
              incomplete. The official communications stream is active, but it is not a substitute for certification and
              field data. That gap is exactly where a utility or industrial customer will focus diligence before signing
              a larger contract.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: This is now a real hardware stack
            body: >-
              Public evidence shows a chemistry, a manufacturing footprint, and at least one large deployment. That is
              more than a research narrative.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE007
          - type: callout
            title: Controls and reliability disclosure is still thin
            body: >-
              The system may be real, but buyers still need the controls, cybersecurity, and reliability packet before
              treating it like a standard industrial asset.
            calloutType: risk
            claimRefs:
              - CE010
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and named proof
        blocks:
          - type: paragraph
            body: >-
              The visible customer set falls into four buckets: industrial heat users, utilities, large-load customers
              such as data centers, and project-development partners who help site and finance the deployment. The most
              credible named proof is POET, because the South Dakota project is already in energy delivery. Utility and
              developer partners are also important because they show that Antora’s workflow is not purely hypothetical.
              The downside is that the public record still centers on a few high-profile names rather than a broad,
              disclosed book of repeat customers. Each segment likely has a different contract form, which means the
              same product can still sell through different deal motions. A second useful way to think about the
              customer base is by project type: one-off first deployments, utility-linked projects, and longer-horizon
              developer-originated siting work. That split matters because each bucket implies different sales motions,
              financing needs, and proof standards.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.2'
        title: Adoption trajectory and retention gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption appears to move from pilot or planning work into first commercial delivery and then into
              expansion across more sectors and geographies. That is a meaningful step up from lab-scale validation, but
              public retention metrics are missing. There is no disclosed customer count, churn, renewal rate, NRR, or
              GRR, so the only evidence of durability is project progression and the company’s claim that it has a
              growing pipeline of signed agreements. In diligence terms, the issue is not whether customers exist; it is
              whether the first deployments turn into a repeatable customer machine that can close the next project
              faster and with less bespoke effort. The customer lifecycle therefore depends less on app-style engagement
              and more on whether each site can be replicated, expanded, and renewed after the first commercial turn-on.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU011
              - CU012
