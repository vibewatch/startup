companyProfile:
  summary: >
    Antora Energy is a San Jose-based industrial thermal-energy storage company that has moved from pure technology
    validation into visible manufacturing and project deployment. The company says it stores low-cost electricity as
    heat in solid carbon blocks, then discharges that energy as process heat or power. Public evidence now shows a $550
    million Series C, roughly $770 million of disclosed capital, the 5 GWh Project Big Stone deployment, and a
    manufacturing campus that Antora and Mintz describe as one of the country's largest battery gigafactories. The
    remaining public blind spots are still material: revenue, burn, runway, customer concentration, and the entry price
    for the latest round.
