  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Antora delivers and who uses it
        blocks:
          - type: paragraph
            body: >-
              Antora sells a factory-built thermal battery that stores low-cost electricity as heat and delivers
              around-the- clock heat or power to industrial sites, data centers, and grid-connected projects. The
              customer workflow is straightforward: charge during cheap or abundant electricity, hold heat in carbon,
              and then discharge when a host site needs process heat or firm capacity. The public pitch is not
              software-first or services-first; it is a physical energy asset with an operating model around project
              deployment, site integration, and long-duration dispatch. In other words, the product has to fit the plant
              rather than asking the plant to adapt to the product.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
