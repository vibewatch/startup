      diligencePath: Request financial statements, board decks, and project-level economics.
      relatedQuestionRefs:
        - QI005
        - QI007
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Public list pricing or contract pricing for heat or power delivery.
      whyItMatters: Monetization can only be modeled once pricing structure is known.
      diligencePath: Request executed offtake agreements and pricing schedules.
      relatedQuestionRefs:
        - QI002
    - type: missing-source
      severity: minor
      topic: valuation
      missingEvidence: An official company valuation for the Series C.
      whyItMatters: Private-market proxy marks are helpful but not definitive.
      diligencePath: Confirm deal terms, share count, and any secondary transactions.
      relatedQuestionRefs:
        - QI006
    - type: missing-source
      severity: minor
      topic: project finance obligations
      missingEvidence: Public debt, project-finance, or covenant stack.
      whyItMatters: The real capital burden could be lower or higher than the equity raise implies.
      diligencePath: Review project SPV debt documents and facility-level obligations.
      relatedQuestionRefs:
        - QI008
