evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A disclosed post-money valuation or comparable secondary market mark for the July 2026 Series C.
    whyItMatters: Without a valuation anchor, the refresh cannot benchmark entry price discipline or dilution risk.
    diligencePath: Look for company, investor, or filing disclosures and any contemporaneous secondary market marks.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Public revenue, gross margin, burn, and runway figures.
    whyItMatters: The company's scale-up case is strong, but cash conversion and capital efficiency remain unmodeled.
    diligencePath: Seek audited statements, investor letters, or customer contract disclosures in the next refresh.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee count or a source-quality headcount estimate.
    whyItMatters: Headcount is one of the most useful operating scale indicators and remains stale in the prior report.
    diligencePath: Use a current company profile, hiring source, or authoritative directory with a dated workforce estimate.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A second independent source that directly confirms the founder and operating-role map.
    whyItMatters: The leadership table is intentionally partial and should be cross-checked beyond the company page.
    diligencePath: Retain a second third-party source that names the same founders and roles.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: minor
    topic: TO003 stakeholder map
    missingEvidence: A current cap-table, board roster, or contractual disclosure that confirms the stakeholder hierarchy.
    whyItMatters: The stakeholder map is directional rather than exhaustive and should not be mistaken for ownership percentages.
    diligencePath: Seek a current investor list, board disclosure, or corporate filing that identifies control rights.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: Antora-specific SAM
    missingEvidence: A source-backed company-specific SAM or SOM.
    whyItMatters: Broad storage growth is not enough to estimate Antora’s own revenue pool.
    diligencePath: Request pipeline-by-segment, conversion, and expected delivery schedule from the company.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: buyer approval chain
    missingEvidence: Exact utility committee or board approval flow for each buyer class.
    whyItMatters: The sales cycle depends on who controls the capital.
    diligencePath: Obtain utility IRP documents and project governance from counterparties.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: conflicting-data
    severity: material
    topic: market enthusiasm versus monetization
    missingEvidence: Public evidence is bullish on storage demand but still thin on repeatable commercialization.
    whyItMatters: Timing, not just market size, drives valuation.
    diligencePath: Compare live procurement timelines and project close rates in the data room.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: competitor pricing
    missingEvidence: Public list pricing or realized contract pricing for most thermal-storage competitors.
    whyItMatters: Price is a major win driver, but public sources mostly disclose architecture and projects.
    diligencePath: Request commercial quotes and EPC packages for peer projects.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: peer operating metrics
    missingEvidence: Comparable utilization, degradation, and warranty data for most competitors.
    whyItMatters: Execution quality determines whether a vendor can scale beyond pilot projects.
    diligencePath: Seek field-performance disclosures and customer references.
    relatedQuestionRefs:
      - QP007
  - type: conflicting-data
    severity: material
    topic: substitute dominance
    missingEvidence: >-
      Some thermal-storage peers have operating projects while lithium-ion still dominates the shorter-duration
      pipeline.
    whyItMatters: Antora competes in both an emerging category and an incumbent-dominated one.
    diligencePath: Benchmark actual project awards, not just technology promises.
    relatedQuestionRefs:
      - QP008
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: revenue and margin
    missingEvidence: Revenue, gross margin, burn, and runway figures.
    whyItMatters: These are the core inputs for underwriting a hardware scale-up.
    diligencePath: Request financial statements, board decks, and project-level economics.
    relatedQuestionRefs:
      - QI005
      - QI007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public list pricing or contract pricing for heat or power delivery.
    whyItMatters: Monetization can only be modeled once pricing structure is known.
    diligencePath: Request executed offtake agreements and pricing schedules.
    relatedQuestionRefs:
      - QI002
  - type: missing-source
    severity: minor
    topic: valuation
    missingEvidence: An official company valuation for the Series C.
    whyItMatters: Private-market proxy marks are helpful but not definitive.
    diligencePath: Confirm deal terms, share count, and any secondary transactions.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: minor
    topic: project finance obligations
    missingEvidence: Public debt, project-finance, or covenant stack.
    whyItMatters: The real capital burden could be lower or higher than the equity raise implies.
    diligencePath: Review project SPV debt documents and facility-level obligations.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: controls and security
    missingEvidence: Named inverter vendors, BMS stack, and cyber certification details.
    whyItMatters: Utilities and large industrial customers will ask for this before deep integration.
    diligencePath: Request one-line diagrams, controls vendor lists, and security audits.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: minor
    topic: reliability curves
    missingEvidence: Public field reliability, degradation, and warranty curves.
    whyItMatters: Bankability depends on the asset’s long-run performance, not only on chemistry.
    diligencePath: Request telemetry and warranty schedules.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: product roadmap
    missingEvidence: Detailed public roadmap for product releases and support structure.
    whyItMatters: Buyers need to know how support and upgrades are handled over time.
    diligencePath: Request product roadmap and support agreements.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal duration, and satisfaction data.
    whyItMatters: These are the best indicators of whether project wins repeat.
    diligencePath: Request customer cohort data and renewal documents.
    relatedQuestionRefs:
      - QU005
      - QU009
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Customer concentration or revenue concentration metrics.
    whyItMatters: The public record is dominated by a small set of flagship projects.
    diligencePath: Request top-customer concentration and backlog by customer.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: minor
    topic: expansion
    missingEvidence: Evidence that current projects have converted into repeat purchase behavior.
    whyItMatters: Expansion is the path from proof to scale.
    diligencePath: Review win-back and follow-on project pipeline.
    relatedQuestionRefs:
