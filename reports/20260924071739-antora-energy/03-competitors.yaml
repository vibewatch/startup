    rows:
      - - Antora
        - Long-term offtake / project economics
        - Heat or power, project delivery, integration
        - Public list pricing undisclosed
        - Buyer must underwrite full system economics
      - - Thermal peers
        - Mostly undisclosed or project-specific
        - Heat storage, CHP, site integration
        - Public pricing sparse
        - Comparisons must use capability not sticker price
