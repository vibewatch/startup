        - Industrial heat, data centers, grid
        - Factory-built, multi-day storage, future TPV
        - Private economics still opaque
      - - Rondo Energy
        - Brick-based thermal battery
        - Commercial projects public; funding not in source
        - Industrial process heat
        - High-temperature brick storage and steam
        - Different medium and likely different economics
      - - Malta Inc.
        - Heat-pump / molten-salt LDES
        - Early commercial / project-stage
        - Utility-scale CHP and LDES
        - Can deliver heat and electricity
        - More complex system architecture
      - - Brenmiller Energy
        - Rock-based thermal storage
        - 103MWh cumulative projects / 4GWh capacity
        - Industrial steam and heat
        - Modular and already deployed
        - Smaller footprint than Antora’s headline scale
      - - MGA Thermal
        - Miscibility-gap alloy storage
        - 5MWh demo / 195MWh project planned
        - Industrial / grid storage
        - High density and long duration
        - Still earlier in commercialization
      - - Status quo
        - Gas boilers / lithium-ion / pumped hydro
        - Deeply established
        - Same reliability budgets
        - Familiar, financeable, bankable
        - Lower duration or higher emissions
    notes: >-
      The profile table focuses on public evidence visible in retained sources, not on an exhaustive universe of
