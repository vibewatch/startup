  topStrengths:
    - Large disclosed capital base with a credible, diversified investor syndicate.
    - Project Big Stone and the manufacturing campus show real deployment and scale-up execution.
    - The product can address high-temperature industrial heat, where few clean alternatives exist.
  topRisks:
    - The latest round's valuation is undisclosed, so investors still cannot benchmark price.
    - Revenue, gross margin, burn, and runway remain non-public.
    - Customer concentration, retention, and project-finance terms are still opaque.
    - Hardware manufacturing and deployment remain capital intensive.
  unresolvedGaps:
    - A disclosed post-money valuation or comparable secondary-market mark for the July 2026 Series C.
    - Revenue, gross margin, burn, runway, and project-level economics.
    - Customer concentration and retention metrics that would show whether project wins are repeatable.
    - Debt, project-finance, and preference-stack details that would clarify the true risk profile.
