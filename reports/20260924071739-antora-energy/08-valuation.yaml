company:
  name: Antora Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    Antora’s valuation case remains evidence-sensitive rather than formulaic: the company has real project momentum,
    a credible hardware moat, and public financing support, but the public record still does not disclose revenue,
    cap-table detail, or a price that would justify a buy. The current call is TRACK because the upside is real but
    the entry price is opaque and the commercial proof is still too thin for a higher-conviction valuation.
sections:
  - id: VSEC01
    title: Investment recommendation and thesis logic
    body: >-
      Antora receives a TRACK recommendation rather than a BUY because the evidence has moved from concept risk to
      execution risk, but not to priced commercial proof. The South Dakota project and the company’s hiring and
      manufacturing trail show that the business is real and scaling, and the GrafTech collaboration suggests that at
      least one meaningful supply chain has been de-risked. Even so, no public revenue, cap table, or customer economics
      are disclosed, so the valuation question remains about entry price, not just company quality. Until a priced
      Series C or a broader set of named customers appears, the prudent stance is to monitor rather than force a full
      position.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: VSEC02
    title: Thesis, anti-thesis, and comparable frame
    body: >-
      The thesis is that Antora is a rare industrial-energy hardware business with demonstrable deployment and
      manufacturing momentum. The anti-thesis is that public valuation evidence is too thin to justify a buy: the
      latest financing headline describes a huge raise, but not the implied price, and low-reliability market-data
      pages produce noisy estimates rather than a dependable mark. That means any comp set must be treated as a
      reference frame, not as a substitute for a disclosed round or revenue base. If the company later names
      customers and publishes operating metrics, the valuation call can move quickly; until then, the mark is mostly
      judgment.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV011
    tableRefs:
      - TV002
  - id: VSEC03
    title: Scenarios, exits, and diligence asks
    body: >-
      A workable valuation frame is scenario-based. The bull case assumes the company converts project momentum into
      repeatable customer adoption and a priced round that steps up from the current private market; the bear case
      assumes a flat or down round, delayed deployments, or continuing opacity around economics. The base case is more
      modest: continued execution with one or two public proof points, but still not enough disclosure to justify a
      buy. Exit readiness depends on diligence artifacts that are still missing today—cap table, preference stack, and
      project-finance terms—not on one more slide about demand. That is why the recommendation stays TRACK.
    claimRefs:
      - CV009
      - CV010
      - CV012
    tableRefs:
      - TV003
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Metric
      - Value
      - Why it matters
    rows:
      - - Recommendation
        - TRACK
        - Quality is improving, but price and commercial proof are still opaque.
      - - Confidence
        - Medium
        - Evidence supports the direction of travel, not a precise mark.
      - - Risk rating
        - High
        - Hardware scale-up, project execution, and financing risk remain material.
      - - Valuation stance
        - Hold until price is disclosed
        - No public valuation anchor is strong enough to justify a buy.
      - - Decision implication
        - Size conservatively
        - Treat the next priced round or customer disclosure as the re-underwrite point.
    notes: The table is intentionally qualitative because the public record does not disclose a usable price anchor.
    claimRefs:
      - CV001
      - CV003
      - CV010
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'Thesis: real project momentum'
        - AP South Dakota coverage plus company materials show deployment at scale.
        - A second named customer or repeat commissioning schedule.
      - - 'Thesis: manufacturing and supply-chain credibility'
        - The company page, hiring data, and GrafTech partnership imply scaling discipline.
        - Confirmed capacity ramp and a broader supplier base.
      - - 'Anti-thesis: price is opaque'
        - Financing headlines do not disclose an implied post-money valuation.
        - A public post-money, secondary mark, or priced tender offer.
      - - 'Anti-thesis: revenue and unit economics are not public'
        - Market-data estimates and outside commentary are noisy rather than definitive.
        - Disclosed revenue, margin bridge, or project contribution margin.
    notes: A public comp set is useful only as a reference frame because the underlying company mark is undisclosed.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation range
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Named customers disclosed, repeat deployments land on time, and a priced Series C steps up from the current market.
        - $1.0B-$1.8B EV
        - Rising
        - If customer proof arrives and economics are disclosed, upside expands.
      - - Base
        - One public customer or project win, continued execution, and still-opaque economics.
        - $600M-$900M EV
        - Most likely
        - If proof stays single-threaded, keep tracking rather than buying.
      - - Bear
        - No new customer disclosure, a flat or down round, and schedule slip or cost inflation.
        - $250M-$500M EV
        - Material
        - If financing weakens or projects slip, reset the thesis.
    notes: These ranges are judgmental scenario markers rather than a formal mark because no public valuation or revenue base is disclosed.
    approximationNotes: These ranges are judgmental scenario markers rather than a formal mark because no public valuation or revenue base is disclosed.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
