chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Antora’s market is best framed as a narrow wedge inside industrial heat, utility reliability, and long-duration
    storage rather than as “all storage” or “all clean energy.” Public evidence supports a buyer set centered on
    utilities, industrial host sites, and data-center-like large loads that need multi-day flexibility. The same
    evidence also shows that short-duration lithium-ion remains the default substitute, policy support is still
    necessary, and no source yet isolates a clean Antora-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Antora’s valuation-relevant market is the intersection of industrial heat, grid reliability, and multi-day
      storage. The right spend bucket is not “all stationary storage”; it is the portion of front-of-the-meter capital
      that buys reliability, renewable firming, or long-duration heat where four-hour batteries are not enough. In the
      public record, that includes industrial host sites such as POET, utility planning teams, and large-load buyers
      facing interconnection queues. It excludes ordinary short-duration arbitrage, most transmission capex, and grid
      upgrades that do not require storage. The status-quo alternative remains a mix of gas boilers, peakers, pumped
      hydro, and lithium-ion batteries.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Sizing lenses, not a single TAM
    body: >-
      Public sizing evidence supports a series of lenses rather than one neat TAM. The broadest lens is the fast
      growth in battery deployments overall, which confirms that buyers are spending on storage. A narrower lens is the
      long-duration category, where DOE, NREL, and C2ES all argue the value rises with renewable penetration and
      reliability needs, but commercialization remains uneven. A still narrower lens is policy-backed demonstration and
      deployment funding, which shows that the market still needs public de-risking. Taken together, the sources support
      a real but constrained market, not a verified company-specific revenue pool.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyers, budget owners, and adoption path
    body: >-
      The buyer set is more coherent than the market size. Antora’s public evidence points to three primary buyer
      classes: utilities that need reliability and renewable integration, industrial host sites that need around-the-
      clock process heat, and large-load customers such as data centers that need fast firm power. Budget ownership
      appears to sit with utility resource-planning or generation teams, industrial operations teams, or developer/
      project-finance groups when the system is co-located. Adoption is staged: planning first, then site selection and
      interconnection, then project execution, then multi-day dispatch. That slow motion is why a project can prove
      demand without yet proving a repeatable market share.
    claimRefs:
      - CM012
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM003
  - id: drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The bull case for the market is straightforward: electricity demand is rising, renewables create more volatility,
      and industrial customers want heat or power that does not depend on fossil fuel combustion. But the adoption
      constraints are just as clear. Long-duration storage still needs public support, utilities move carefully, and
      lithium-ion dominates the shorter-duration pipeline. For Antora, that means timing matters as much as technology.
      A project can be compelling because it solves a real problem, yet still monetize slowly if rate design,
      procurement rules, or interconnection timelines lag behind the engineering case.
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM021
    tableRefs: []
