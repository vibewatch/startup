  - calloutType: strength
    title: The buyer problem is real
    body: >-
      The retained sources do not describe a fictional market. They show live utility, industrial, and large-load
      projects where duration, reliability, and heat economics matter today.
    claimRefs:
      - CM012
      - CM014
      - CM015
  - calloutType: risk
    title: Public sizing stops short of a clean Antora SAM
    body: >-
      There is no source-backed company-specific SAM or SOM. Investors should treat broad storage growth as context,
      not as a direct forecast of Antora revenue.
    claimRefs:
      - CM010
      - CM011
      - CM021
