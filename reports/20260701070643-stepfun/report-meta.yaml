  topStrengths:
    - "Real, named device-level production proof: OPPO, Honor, ZTE, and Geely (via Qianli) all ship StepFun-powered
      features in mass-production hardware, not pilots."
    - A record 2026 capital sprint -- a Series B+ round exceeding RMB5 billion, a near-$2.5 billion pre-IPO round,
      and HKIC and industrial-investor backing -- shows deep and diversifying capital access.
    - Independently corroborated cost-efficiency architecture (sparse MoE routing, MFA/AFD attention design) is a
      genuine technical differentiator, not just benchmark framing.
    - "Founder-market fit is strong: CEO Jiang Daxin (ex-Microsoft VP) and a leadership bench drawn from ByteDance,
      Microsoft Bing, and the ResNet research lineage."
  topRisks:
    - A $10-12 billion IPO target implies a 57-68x forward revenue multiple against a reported $73.3 million of
      2025 revenue with no audited financial statement or filed prospectus available.
    - A CSRC-driven red-chip offshore-structure unwind and a stacked 2026 regulatory calendar create listing
      timing and execution risk.
    - Chairman Yin Qi also chairs Qianli Technology, StepFun's only proven automotive distribution partner, which
      has posted negative core net profit in three of the last four disclosed periods -- concentrating governance
      and channel risk in one interlinked relationship.
    - No source discloses a paying-customer count, retention/NRR, contract terms, or cap table, and StepFun's own
      Yuewen consumer app trails rivals on independent MAU rankings despite 40M+ device installs.
  unresolvedGaps:
    - No audited 2025 financial statement, cash position, burn, or gross margin is publicly available.
    - Full cap table and board roster remain undisclosed, including HKIC and state-capital ownership stakes.
    - Final IPO pricing, raise size, and cornerstone-lock-up terms are not yet set.
    - Device- and OEM-partner revenue-share terms (Geely, OPPO, Honor, ZTE) are undisclosed, so realized StepFun
      economics behind the 40M+ device footprint cannot be verified.
