      background: Former head of Microsoft Bing's core search team.
      claimRefs: [CO015]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, Xuhui District, China
  productSummary: >-
    A metered API platform (platform.stepfun.com / platform.stepfun.ai) serving the "Step" multimodal model
    family -- led by the flagship Step 3.7 Flash agentic vision-language model -- plus open-sourced Step-Audio,
    Step-Video, and Step1X image/audio/video tooling, distributed via GitHub/Hugging Face, and surfaced to
    consumers through the Yuewen (跃问) chat app and embedded smartphone/automotive assistants.
  customerFocus: >-
    Smartphone OEMs (OPPO, Honor, ZTE) and automotive partners (Geely, via Qianli Technology) embedding
    StepFun models on-device, plus developers and enterprises consuming the metered API platform.
  businessModel: >-
    Per-token/per-call API metering across chat, vision, voice, and agentic models, combined with device- and
    automotive-partner licensing of embedded multimodal features rather than flat software subscriptions.
  stage: Pre-IPO (Hong Kong listing filed June 2026, targeting $10-12B valuation)
  fundingStatus: >-
    Series B+ round exceeding RMB5 billion (~$718-733M) closed January 2026; nearing an almost $2.5 billion
    pre-IPO round as of May 2026; filed for a Hong Kong IPO on June 9, 2026 targeting $10-12 billion valuation
    and roughly a $500 million raise.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO013, CO026, CO034, CO039, CO042]
summary:
  headline: >-
    StepFun pairs genuine device-and-automotive distribution and a record 2026 financing sprint with a $10-12
    billion IPO target that public disclosure -- thin, unaudited, and third-party-reported -- cannot yet underwrite.
