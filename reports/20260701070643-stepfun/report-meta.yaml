companyProfile:
  summary: >-
    StepFun (阶跃星辰), formally Shanghai Jieyue Xingchen Intelligent Technology Co., Ltd, was founded in
    Shanghai in April 2023 by former Microsoft vice president Jiang Daxin alongside co-founders Zhu Yibo and
    Jiao Binxing, and is widely grouped among China's "Six AI Tigers." The company builds the multimodal "Step"
    model family -- spanning text, vision, video, and audio -- distributed through a metered developer API
    platform, open-weight GitHub/Hugging Face releases, its own 跃问 (Yuewen) consumer chat app, and embedded
    smartphone and automotive deployments with OPPO, Honor, ZTE, and Geely. A record 2026 capital sprint
    (a Series B+ round exceeding RMB5 billion, a near-$2.5 billion pre-IPO round, and a completed red-chip
    unwind) culminated in a June 2026 Hong Kong IPO filing targeting a $10-12 billion valuation, against a
    thin and largely unaudited revenue base.
  foundedDate: "2023-04-06"
  founders:
    - name: Jiang Daxin
      role: Founder & CEO
      background: Former Microsoft global/senior vice president who worked on Bing and Microsoft 365.
      claimRefs: [CO013]
    - name: Zhu Yibo
      role: Co-founder & CTO
      background: Former ByteDance AI-infrastructure and large-cluster lead.
      claimRefs: [CO014]
    - name: Jiao Binxing
