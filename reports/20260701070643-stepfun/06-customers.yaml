- id: TU005
  title: Expansion and concentration risk
  columns:
  - Expansion driver
  - Concentration / dependence risk
  - Potential impact
  - Diligence path
  rows:
  - - 60%+ domestic phone-brand coverage (OPPO, Honor, ZTE) creates a wide device-embedded distribution
      surface
    - Reach depends on continued goodwill and renewal from three OEM groups rather than a diversified
      account base
    - Loss or renegotiation of one major OEM relationship could remove a large share of the disclosed
      device install base
    - Request per-OEM contract terms, renewal dates, and revenue share
  - - Automotive AgentOS expansion to 1M+ target vehicles in 2026
    - Delivery vehicle is Qianli Technology, which derives 30.8%-39.7% of its own revenue from Geely Group
      alone and posted net losses in 2023-2025
    - Financial or strategic stress at Qianli/Geely could disrupt the cockpit channel StepFun relies on
      for auto-sector proof
    - Request StepFun's direct exposure/receivables tied to Qianli and any contractual protections if
      Qianli underperforms
  - - Tencent Cloud partnership extends automotive reach into Tencent's consumer ecosystem
    - Tencent is simultaneously a multi-round equity investor and the commercial partner, creating potential
      conflicts in negotiating arm's-length commercial terms
    - Related-party dynamics could mean automotive-partnership terms are not representative of independent
      market pricing
    - Request whether the Tencent Cloud commercial agreement was negotiated or approved independently
      of Tencent's board seat/equity position
  - - Enterprise vertical expansion via Huanxi Media JV and Shanghai United Media Group partnership
    - Only one enterprise JV (media/entertainment) has progressed to a signed framework agreement; the
      JV entity, funding, and delivery timeline are not yet finalized
    - Enterprise vertical revenue, if any, is likely immaterial in the near term relative to device/automotive
      scale
    - Track JV formation, capital contribution, and first commercial deliverable milestones
  - - Developer ecosystem (Starlight Program, open-weight releases) broadens the long-tail application
      base
    - No disclosed metric distinguishes committed/paying developers from free experimenters; program success
      is described only qualitatively
    - Developer ecosystem may be a weaker expansion lever than device/auto if it does not convert into
      disclosed paid usage
    - Request Starlight Program participant count, funded-project count, and any resulting commercial
      deployments
  notes: Risk framing draws on Qianli Technology's own IPO-prospectus disclosures (an independent, StepFun-adjacent
    data point) combined with StepFun's own partner announcements; StepFun itself does not publish customer-concentration
    metrics.
