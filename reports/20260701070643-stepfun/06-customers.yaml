- id: distribution-channel-dependency-and-verdict
  title: Distribution channel dependency and diligence verdict
  body: 'Ranking StepFun''s customer channels by how independently their evidence can be verified produces
    a clear ordering. Regulatory filings and third-party platform telemetry sit at the top: the HKEXnews
    filing and Wilson Sonsini''s legal confirmation independently corroborate the Huanxi Media joint venture,
    and Hugging Face/GitHub download and commit data independently corroborate developer-ecosystem activity.
    Device and automotive evidence sits in the middle: named feature press coverage (OPPO, Honor, ZTE)
    and joint-showcase or press-release material (Geely/Qianli, Tencent) are independently reported but
    ultimately trace back to company or partner disclosure of a specific feature or event, not to audited
    usage or revenue data. The weakest evidence is the consumer app: Yuewen''s absence from AICPB''s independent
    MAU ranking and its thin, complaint-heavy Google Play review base both point the same direction --
    StepFun has not converted its device-level reach into an independently measurable consumer audience
    of its own. Overall, this chapter finds genuine, verifiable customer proof at the device and automotive
    feature level, but no disclosed paying-customer count, retention metric, or contract term anywhere
    in the portfolio, and a Qianli/Geely/Tencent ownership and investment structure that concentrates
    the automotive channel inside a small, interlinked group rather than a diversified customer base.'
  claimRefs:
  - CU040
  - CU041
  - CU042
  - CU020
