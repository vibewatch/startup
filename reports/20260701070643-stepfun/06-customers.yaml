callouts:
- calloutType: strength
  title: Real, named device-level production proof
  body: OPPO Find X8 Ultra, Honor Magic8, and ZTE all ship named, independently-confirmed StepFun-powered
    features, not just logos or pilots, and Geely's Galaxy M9 has sold roughly 40,000 AgentOS-equipped
    units in three months.
  claimRefs:
  - CU024
  - CU025
  - CU027
  - CU031
- calloutType: risk
  title: No paying-customer, retention, or contract-term disclosure
  body: Across device, automotive, developer, and enterprise segments, no source discloses a paying-customer
    count, ARPU, NRR/churn, or contract length, making it impossible to size StepFun's true commercial
    customer base behind the device-install headline.
  claimRefs:
  - CU034
  - CU035
  - CU036
- calloutType: risk
  title: Automotive channel concentrated inside one Geely-anchored group
  body: Qianli Technology, StepFun's primary automotive distribution vehicle, derives 30.8%-39.7% of its
    own revenue from Geely alone, posted net losses in three of the last four disclosed periods, and shares
    a chairman with StepFun -- concentrating auto-channel risk inside a single interlinked group rather
    than an arm's-length customer.
  claimRefs:
  - CU015
  - CU016
  - CU018
  - CU039
- calloutType: insight
  title: Consumer app lags the device reach that is supposed to feed it
  body: Despite 42M+ device installs, Yuewen does not appear on AICPB's independently ranked China AI
    app list and carries only 58 Google Play reviews with recurring login-friction complaints, suggesting
    device-level distribution has not yet converted into an independently measurable consumer brand.
  claimRefs:
  - CU020
  - CU001
  - CU002
  - CU042
