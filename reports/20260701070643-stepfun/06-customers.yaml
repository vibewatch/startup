slug: stepfun
runDate: '2026-07-01'
company:
  name: StepFun
chapter:
  number: 6
  title: Customers
  summary: 'StepFun''s clearest customer proof is device-led: over 60% of China''s leading domestic smartphone
    brands (OPPO, Honor, ZTE) ship its multimodal models in named, production features, and a Geely/Qianli
    cockpit partnership has shipped roughly 40,000 Galaxy M9 vehicles in three months, but the company
    discloses no paying-customer count, no retention or contract-term metrics, and its own Yuewen consumer
    app trails every rival''s app on independent MAU rankings, leaving genuine C-end and API-revenue traction
    unverified behind the device and auto headline numbers.'
sections:
- id: consumer-app-and-developer-ecosystem
  title: 'Consumer app and developer ecosystem: broad reach, weak independent measurement'
  body: 'StepFun''s most direct customer relationships sit at the two ends of its distribution stack:
    the free-to-use Yuewen (跃问) consumer app and the open-weight developer ecosystem built around Hugging
    Face and GitHub. Neither shows strong independently-measured traction on its own. Yuewen''s Google
    Play listing carries only 58 reviews at a 4.2 rating as of its May 2026 update, and multiple named
    reviewers complain that the app blocks Google, email, or social login and only accepts a phone number
    -- friction serious enough that one reviewer reports being unable to chat or copy text at all without
    providing one. Independently, AICPB''s April 2026 China AI app ranking lists more than two dozen apps
    by monthly active users, from ByteDance''s Doubao at 336 million down to under a million for the smallest
    ranked entry, and Yuewen does not appear anywhere on that list. The developer side looks healthier
    by comparison: the stepfun-ai Hugging Face organization shows individual open-weight model variants
    with download counts in the hundreds of thousands, and the stepfun-ai GitHub organization maintains
    active repositories, including a vLLM fork, with ongoing commit activity through June 2026. Step 3.7
    Flash was also one of five major new models OpenRouter listed in a ten-day window ending June 4, 2026,
    alongside frontier releases from Anthropic and others, indicating the model remains commercially current
    on third-party marketplaces. None of this developer signal, however, distinguishes paying API accounts
    from free experimentation, and no source reviewed for this chapter discloses a developer-to-paid conversion
    rate.'
  claimRefs:
  - CU001
  - CU002
  - CU020
  - CU003
  - CU004
  - CU033
  tableRefs:
