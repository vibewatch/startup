- id: device-auto-and-enterprise-customer-proof
  title: 'Device, automotive, and enterprise customer proof: real named deployments, thin per-account
    detail'
  body: 'StepFun''s strongest customer evidence is device-led. Independent Chinese tech press directly
    ties named, shipped features to StepFun: 科创板日报 reported that OPPO''s Find X8 Ultra flagship''s ''one-tap
    memory capture'' feature runs on StepFun''s multimodal technology, Honor gave StepFun a ''Best Collaboration
    Award'' for powering the Magic8 series'' YOYO assistant memory feature, and ZTE co-launched an elder-care
    voice assistant with StepFun in July 2025 while its Nubia Z80 Ultra phone became the first device
    to natively embed the OpenClaw agent StepFun''s release material lists as a supported integration.
    Sina Technology''s coverage of StepFun''s late-2025 GELab-Zero open-source launch puts a number on
    this reach: over 60% of China''s domestic phone brands. On the automotive side, Geely Auto Group and
    Qianli Technology jointly showcased the AgentOS smart-cockpit voice agent with StepFun at WAIC 2025,
    and the lead vehicle, the Geely Galaxy M9, sold roughly 40,000 units in its first three months, with
    StepFun targeting over one million vehicles for 2026. Tencent Cloud has separately announced a strategic
    partnership to build AI cockpit agents on StepFun''s models, and Huanxi Media Group signed a Hong-Kong-filed
    framework agreement -- confirmed by both the HKEXnews regulatory filing and law firm Wilson Sonsini
    -- to form a joint venture applying StepFun''s models to film, TV, and game content. What is consistently
    missing across every one of these relationships is per-account commercial detail: no disclosed unit
    royalty, contract length, or revenue-share figure exists for any single OEM, automotive, or enterprise
    partner, so this evidence proves feature-level production use, not verified commercial scale.'
