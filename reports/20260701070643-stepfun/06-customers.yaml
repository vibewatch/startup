  rows:
  - - OEM smartphone (device-embedded)
    - Named feature press coverage (科创板日报, Sina Technology) plus one vendor-conferred award (Honor)
    - Independent media reporting, though ultimately sourced from company/PR disclosure of specific features
    - No independent unit-shipment or revenue data per OEM
  - - Automotive cockpit (Geely/Qianli/AgentOS)
    - Joint WAIC showcase (partner-proof), ECARX/Nasdaq press release (partner-proof), Qianli IPO-prospectus
      financial disclosure (filing-adjacent)
    - 'Mixed: partner-issued PR plus one genuinely independent financial disclosure (Qianli prospectus)'
    - StepFun's own revenue share from the automotive channel is not disclosed
  - - Cloud/hyperscaler (Tencent Cloud)
    - Financial-news coverage of the strategic partnership tied to StepFun's financing round
    - Independent financial press, but Tencent is also a StepFun investor
    - No shipped product or independent user data yet
  - - Enterprise vertical (Huanxi Media, media/finance)
    - Hong Kong regulatory filing (HKEXnews) and law-firm deal confirmation (Wilson Sonsini)
    - High independence (regulatory filing, legal advisor)
    - Framework agreement only; no completed JV or revenue data
  - - Developer / open-source
    - Hugging Face and GitHub platform telemetry (download counts, commit activity)
    - High independence (third-party platform data)
    - Telemetry does not distinguish production use from evaluation/testing
  - - Consumer app (Yuewen)
    - Google Play reviews (customer-authored) and AICPB independent MAU ranking (absence)
    - High independence for both, but both show weak or unmeasured traction
    - No StepFun-disclosed MAU/DAU/revenue to reconcile against the independent signals
  notes: This table summarizes how independently each distribution channel's customer evidence can be
    verified, ranking regulatory filings and third-party platform telemetry above partner-issued press
    releases and company self-reporting.
