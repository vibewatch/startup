- id: TU001
  title: Customer segmentation
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale or strategic value
  - Key evidence gap
  rows:
  - - Consumer (Yuewen app)
    - Individual end users (free; payment model undisclosed)
    - Chat, document parsing, StepClaw task agent, creative generation
    - 58 Google Play reviews, 4.2 rating; absent from AICPB top-ranked China AI apps
    - No disclosed MAU/DAU, revenue, or subscriber count
  - - Developer / open-source
    - Individual and organizational developers (free API tier + paid tiers)
    - Fine-tuning, self-hosting open-weight models, agent-harness integration (OpenClaw, Claude Code,
      KiloCode)
    - Hundreds-of-thousands-level Hugging Face downloads per model variant; active GitHub org
    - No disclosed count of paying API accounts or developer conversion rate
  - - OEM smartphone (OPPO, Honor, ZTE)
    - Device brands license/integrate the model; end consumers use it for free inside the phone UI
    - On-device multimodal features (screen capture-and-summarize, memory assistant, elder-care voice
      commands)
    - 60%+ of leading domestic phone brands; 42M+ cumulative device install base
    - No per-OEM revenue, royalty rate, or renewal term disclosed
  - - Automotive (Geely / Qianli Technology)
    - Auto group licenses cockpit software; vehicle buyers use it for free inside the car
    - AgentOS smart-cockpit voice agent, navigation/entertainment/vehicle-control orchestration
    - Galaxy M9 ~40,000 units sold in 3 months; 1M+ vehicle target for 2026
    - No disclosed per-vehicle royalty or contract length with Qianli/Geely
  - - Enterprise vertical (media, finance/news)
    - Corporate partners (Huanxi Media, Shanghai United Media Group) co-fund JV or licensing
    - AI-native film/TV/game content; financial-news vertical search
    - One disclosed JV framework agreement (Huanxi Media, Nov 2025); one named media partner (SUMG)
    - No disclosed revenue, timeline, or completion status for the Huanxi Media JV
  - - Robotics / embodied AI
    - Ecosystem partner (Zhiyuan Robotics) integrating multimodal models
    - Embodied-intelligence perception and interaction
    - Named at StepFun's Feb 2025 Step Up ecosystem day
    - No product, shipment, or revenue detail beyond the partnership announcement
  notes: Buyer/user/payer distinctions and scale figures are drawn from company and third-party disclosures
    reviewed for this chapter; segment revenue or account counts are not independently disclosed for any
    row.
