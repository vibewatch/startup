- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - National 'AI+' agent policy framework (CAC/NDRC/MIIT, May 2026)
    - Driver
    - Live now; priority scenarios through 2027-2030
    - Legitimizes and standardizes agent deployment, opening 19 priority sectors
    - How many of the 19 priority scenarios can StepFun's embedded models realistically address versus hyperscaler agent platforms?
  - - AI-generated-content labeling rules (effective September 2025)
    - Constraint
    - Already in force
    - Adds explicit/implicit labeling engineering burden to every deployed surface
    - What is StepFun's per-surface labeling compliance cost and audit status?
  - - CAC generative-AI service registration (868 services, April 2026)
    - Constraint and driver
    - Ongoing, roughly 72 new registrations per two months
    - Registration is now a market-entry ticket; also signals a fast-growing addressable service count
    - Is StepFun's Step platform among the registered services, and under which registration numbers?
  - - AI-phone / AI-PC / smart-cockpit device cycles (IDC, 中商产业研究院)
    - Driver
    - 2026 replacement cycles
    - Expands the device-embedded surface area for models like StepFun's
    - What share of AI-phone and smart-cockpit design wins does StepFun actually hold versus Doubao or Qwen?
  - - Chip export-control tightening (US loophole closure, May 2026)
    - Constraint
    - Effective immediately
    - Raises compute-access uncertainty and cost for training next-generation StepFun models
    - How exposed is StepFun's training-compute supply chain to the closed overseas-subsidiary loophole?
  - - Chinese LLM API price war (DeepSeek, MiMo, Kimi, H1 2026)
    - Constraint
    - Ongoing and accelerating
    - Compresses achievable API margin, pressuring StepFun to match low prices
    - Can StepFun sustain step-3.x pricing at DeepSeek/Kimi-adjacent levels while remaining profitable?
  - - OpenClaw agent-platform security incidents (Trojan skill packages)
    - Constraint
    - Ongoing since early 2026
    - Could slow enterprise agent adoption on the same platform where Step 3.5 Flash ranks highly
    - What security and verification controls does StepFun apply to its own agent-platform distribution?
  notes: Several rows are simultaneously drivers and constraints (e.g., registration volume, device cycles); the direction column reflects the net near-term effect on StepFun's addressable market rather than a permanent classification.
