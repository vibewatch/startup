- id: device-embedded-market
  title: 'Device-embedded AI: the phone, PC, and cockpit surfaces StepFun is actually chasing'
  body: 'StepFun''s own framing is explicit: rather than compete purely on cloud chat traffic, it embeds models inside smartphones, vehicles, and industrial hardware. Public reporting credits StepFun''s flagship models with powering AI features in more than 40 million smartphones and targeting deployment in more than one million vehicles through its Geely partnership -- numbers that only matter if the underlying device categories are themselves growing. On phones, IDC (corroborated by a second Chinese outlet) forecasts 2026 China shipments will fall 2.2% to about 278 million units, even as next-generation AI-phone shipments rise to 147 million units, 53% of the total and the first time AI phones cross half the market, under an ''edge-cloud synergy'' model. On PCs, IDC projects a roughly flat 42.22 million-unit China market in 2026 but 146.5% year-over-year growth in GenAI PCs, reaching an estimated 36.5% of the category by 2029. On automotive cockpits, 中商产业研究院''s industry forecast puts China''s smart-cockpit solutions market at RMB 182.8 billion in 2026, up from RMB 154.5 billion in 2025, with voice-interaction penetration nearly doubling from 26% to 48% in a year. Geely''s Galaxy M9, unveiled at WAIC 2025, is cited by both companies as the industry''s first mass-produced vehicle with an end-to-end voice-LLM-powered ''Agent OS'' cockpit built on StepFun''s Step-Audio model. Each of these device categories is expanding, but StepFun is one of several embedded-model suppliers competing for OEM design wins, and only one relationship -- Geely -- is publicly confirmed at scale, a concentration that independent analysis flags as a potential ceiling on how independent StepFun''s addressable market really is.'
