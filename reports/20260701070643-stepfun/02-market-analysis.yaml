  title: Device-embedded distribution, not chat traffic, is StepFun's real demand lens
  body: StepFun's own product and pricing pages, plus independent OpenRouter/OpenClaw usage rankings, show its addressable market is best measured through embedded-device reach (40M+ phones, 1M+ vehicle target) and developer/agent API usage rather than consumer chat traffic alone -- but that same device reach is roughly an order of magnitude smaller than ByteDance Doubao's disclosed distribution.
