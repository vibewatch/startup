  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: device-embedded-market-share
    missingEvidence: StepFun's individually attributable share of AI-phone and smart-cockpit design wins (versus Doubao, Qwen, and other embedded-model suppliers) is not independently disclosed.
    whyItMatters: 'The device-embedded distribution numbers StepFun discloses (40 million phones, one-million-vehicle target) come from a single secondary source and are dwarfed by rivals'' disclosed device reach (Doubao: 500 million-plus phones, 7 million-plus vehicles), so StepFun''s true share of the addressable device layer is unverified.'
    diligencePath: Request OEM design-win confirmations or per-model unit economics from StepFun, Geely, OPPO, Honor, or ZTE investor-relations or supply-chain disclosures, or await StepFun's Hong Kong IPO prospectus for segment disclosure.
