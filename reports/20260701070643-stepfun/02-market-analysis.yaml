    - TM003
  - type: conflicting-data
    severity: material
    topic: china-genai-market-sizing
    missingEvidence: Published China generative-AI market-size lenses (IMARC's ~$5.2 billion AIGC estimate, Forrester's >$70 billion AI-infrastructure figure, and IDC-sourced 1,944-trillion-token MaaS volume) use incompatible units and boundaries and cannot be reconciled into one TAM.
    whyItMatters: Without a reconciled sizing basis, any single-number TAM claim for StepFun's addressable market would overstate precision and could mislead a valuation exercise.
    diligencePath: Commission a bottom-up sizing specific to embedded-device plus agent-API spend, cross-checked against StepFun's own disclosed unit or revenue metrics once available (e.g., its Hong Kong IPO prospectus).
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: compute-exposure
    missingEvidence: StepFun's specific chip supply chain (which GPUs or domestic accelerators it trains on, and how exposed it is to the closed Nvidia/AMD overseas-subsidiary loophole) is not disclosed in the public sources reviewed.
    whyItMatters: Compute access materially affects whether StepFun can keep releasing frontier-competitive open models at its current cadence, especially as export enforcement tightens by headquarters location.
    diligencePath: Seek StepFun technical-paper compute disclosures or Hong Kong IPO-prospectus capex and vendor disclosures on training hardware.
    relatedQuestionRefs:
    - QM033
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-margin
    missingEvidence: StepFun's actual gross margin or unit economics per API token or per-device license are not publicly disclosed, so it is unclear whether current step-3.x pricing is profitable at DeepSeek/Kimi-adjacent price levels.
    whyItMatters: The price-war constraint (six Chinese API price cuts in H1 2026) means market-share gains could come at a margin cost that is not visible from public pricing pages alone.
    diligencePath: Review StepFun's Hong Kong IPO prospectus, once public, for segment gross-margin or unit-economics disclosure by product line.
    relatedQuestionRefs:
    - QM034
    relatedTableRefs:
    - TM004
