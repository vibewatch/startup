company:
  name: StepFun
chapter:
  number: 2
  title: Market Analysis
  summary: StepFun competes in China's foundation-model application and embedded-device AI layer -- consumer chat, developer/agent API, and OEM-embedded smartphone and automotive deployments -- rather than the full China AI or semiconductor economy. Multiple evidence-constrained lenses (a ~$5-20B narrow China AIGC estimate, >$70B upstream China AI-infrastructure spend, 1,944 trillion tokens of 2025 public-cloud MaaS usage, and 868 CAC-registered generative-AI services as of April 2026) show a fast-growing but commercially unsettled market. StepFun's evidenced footprint -- 40 million-plus embedded smartphones, a one-million-vehicle Geely target, and a top-three OpenRouter/OpenClaw developer usage rank -- is real but an order of magnitude smaller than ByteDance Doubao's device distribution, and sits inside a market simultaneously pushed by China's 'AI+' policy targets and squeezed by a six-round 2026 API price war, tightened chip export controls, and a Geely-concentration risk that independent analysis flags as a ceiling on how independent StepFun's addressable market really is.
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: 'StepFun should be read as a company competing inside China''s foundation-model application and embedded-device AI layer, not as a stand-in for China''s entire AI or semiconductor economy. IDC''s China AI agent market-glance draws exactly this line, separating model-development, application-development, and agent-development platforms from the underlying compute, storage, network, and semiconductor infrastructure stack beneath them. Inside that boundary, StepFun''s own platform.stepfun.com documentation shows the company monetizes per-token API metering across chat, vision, voice, and agentic ''step-3.x'' models rather than flat software licensing, and its Step-Audio voice model already ships as embedded cockpit software inside Geely''s production Galaxy M9 -- putting automotive smart-cockpit licensing, not just consumer chat, squarely inside the addressable spend. A fourth, easily overlooked segment is compliance: as of April 30, 2026 China had 868 nationally CAC-registered generative-AI services and 530 locally registered applications, and every one of StepFun''s public-facing surfaces must clear the same registration, security-assessment, and content-labeling gates that make compliance a recurring cost of doing business rather than a legal footnote. Excluded from this boundary is the much larger infrastructure layer -- Forrester puts China''s 2026 AI-infrastructure spending above $70 billion -- which StepFun consumes as a cost input rather than monetizes directly. Status-quo substitutes for StepFun''s surfaces range from native phone or car software without embedded generative AI, to larger hyperscaler-distributed alternatives (Doubao, Qwen) that OEM partners could choose instead.'
