      value: 80% of top-1,000 enterprises by 2027
      detail: 'IDC: mission-critical enterprise AI will prioritize sovereignty, nonpublic hosting, open technologies, and regional partners.'
    - label: China AI infrastructure spend (upstream layer)
      value: '> USD 70B in 2026'
