- calloutType: risk
  title: Single-OEM dependence narrows the addressable market
  body: StepFun's clearest automotive proof point runs entirely through Geely, and independent analysis warns this concentration may cap rather than expand StepFun's addressable market if rival automakers hesitate to hand their cockpit AI to a supplier so closely tied to one carmaker -- a risk sharpened by financing to China's model layer roughly halving in 2025.
  claimRefs:
  - CM022
  - CM023
  - CM027
- calloutType: risk
  title: Price war and compute controls squeeze margin from both sides
  body: Six rounds of Chinese API price cuts in H1 2026 compress the revenue StepFun can extract per token, while tightened U.S. chip export enforcement raises the cost and uncertainty of the compute needed to keep training frontier-competitive models -- a margin squeeze from both the demand and supply side of StepFun's addressable market.
  claimRefs:
  - CM032
  - CM033
  - CM034
