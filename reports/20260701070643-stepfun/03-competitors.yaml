- id: moat-durability-and-adverse-evidence
  title: Moat durability, commoditization risk, and adverse competitor evidence
  body: |-
    StepFun's most durable-looking claim is not benchmark leadership or consumer reach -- it is embedded multimodal device distribution (smartphone pre-installs and its Geely automotive relationship, detailed in chapter 2) combined with an explicit, still-active pursuit of AGI-oriented model scope that several peers have deprioritized. That wedge is real but conditional: Xiaomi's MiMo family alone already out-distributes StepFun by volume through the same device channel, and Geely's own April 2026 "Full-Domain AI 2.0" materials describe a multi-vendor, increasingly in-house cockpit and ADAS strategy rather than exclusive dependence on any single outside model supplier -- a genuine displacement risk for a concentrated OEM relationship.

    The adverse evidence is broader than any one competitor. First, capital access: Zhipu and MiniMax are already listed, Moonshot raised at $20 billion and DeepSeek at over $50 billion (the latter with a direct, voting investment from the National AI Industry Investment Fund), all materially deeper and more transparent capital bases than StepFun's reported near-$2.5 billion pre-IPO round. Second, consumer brand: StepFun's Yuewen app trails every other named competitor in this chapter on disclosed MAU, and the gap versus Doubao (336-345 million) or even DeepSeek's own consumer app (about 139 million) is an order of magnitude or more. Third, benchmark opacity: independent commentary on Chinese LLM leaderboards flags test-set leak and gaming concerns (disputed C-Eval results, self-reported scores without disclosed methodology), which should discount confidence in any single provider's self-reported ranking, StepFun's included, until independently reproduced. Fourth, commoditization: the 2026 API price war was started and sustained by DeepSeek, Xiaomi, and Moonshot, not StepFun, meaning StepFun must defend margin inside a pricing floor set by better-capitalized rivals rather than one it controls. None of this erases StepFun's device wedge, but it means that wedge -- not benchmark rank, app scale, or balance-sheet depth -- is the only place this chapter finds durable relative advantage.
