- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competitive threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Embedded multimodal device distribution (smartphone, Geely)
    - Bigger device incumbents (Xiaomi MiMo, ByteDance/Doubao ecosystem) can bundle their own models at
      far greater scale
    - High
    - '"Xiaomi MiMo alone holds ~21% of weekly Chinese-provider OpenRouter share; Doubao dwarfs Yuewen
      in MAU"'
    - Request device-level attach rates and renewal data for StepFun's own OEM deals versus public device-shipment
      claims
  - - AGI-oriented technical ambition and differentiation
    - Better-funded peers (Zhipu, Moonshot, MiniMax, DeepSeek) match or exceed StepFun on published benchmark
      scores
    - High
    - BenchLM's July 2026 leaderboard places Qwen3.7 Max, GLM-5.2, DeepSeek V4 Pro Max, and Kimi K2.6
      above StepFun's listed models
    - Ask for independently reproduced benchmark results rather than relying on self-reported scores
  - - Open-source / self-host developer goodwill
    - DeepSeek, Zhipu, and Moonshot all ship broader, more permissively licensed open-weight flagships
    - Medium
    - DeepSeek V4 (MIT) and GLM-5 (MIT) both ranked above StepFun's open releases in 2026 tracking
    - Clarify StepFun's own open-source release cadence and license terms versus these peers
  - - Consumer brand and app-level distribution
    - Doubao, Qianwen/Quark, DeepSeek, and Tencent Yuanbao all rank in China's top-10 apps by MAU; Yuewen
      does not appear in the top 50
    - High
    - AICPB's April 2026 China AI app MAU ranking
    - Request Yuewen's actual MAU/DAU and retention data to confirm or refute the public 'not top-50'
      signal
  - - Pricing competitiveness
    - The 2026 API price war (DeepSeek, Xiaomi, Kimi cuts declared permanent) compresses margin for every
      mid-tier provider, including StepFun
    - High
    - Apidog's May 2026 five-lab pricing comparison; DeepSeek's own pricing docs
    - Confirm StepFun's realized (not list) pricing and per-token margin against the price-war floor
  - - Capital access and state backing
    - Zhipu and MiniMax are already listed; Moonshot and DeepSeek raised at $20B+ and $50B+ respectively,
      the latter with direct state-fund participation
    - High
    - Zhipu/MiniMax IPO reporting; TrendForce on DeepSeek's National AI Industry Investment Fund stake
    - Compare StepFun's disclosed investor base and lock-up terms with these listed or state-backed peers
  - - Automotive / OEM channel concentration
    - A small number of device and auto partnerships anchor much of the device story; a lost or renegotiated
      deal would remove a large share of it
    - Medium
    - Geely's own 2026 'Full-Domain AI 2.0' materials describe multi-vendor, increasingly in-house cockpit
      AI ambitions rather than exclusive dependence on one outside model supplier
    - Request contract exclusivity terms and renewal dates for StepFun's OEM partnerships
  notes: Severity reflects risk to StepFun's competitive durability and pricing power rather than to overall
    Chinese AI demand; the register draws on the same sources cited in the profile and comparison tables
    above plus the adverse-angle sources noted in the evidence list.
