chapter:
  number: 3
  title: Competitors
  summary: 'StepFun competes against a Chinese foundation-model field that has consolidated to roughly
    ten meaningful providers, split between venture-funded pure-play peers (Zhipu AI/Z.ai, Moonshot AI/Kimi,
    MiniMax, Baichuan Intelligence) and big-tech-embedded or investor-independent labs (Alibaba Qwen,
    Baidu ERNIE, ByteDance Doubao, DeepSeek). By mid-2026 Zhipu and MiniMax have listed in Hong Kong,
    Moonshot raised at a $20 billion valuation, and DeepSeek closed a $7.4 billion round with direct state-fund
    participation -- all materially deeper capital access than StepFun''s reported near-$2.5 billion pre-IPO
    round. StepFun''s technical output (Step 3.5 Flash ranks #3 on OpenRouter''s free-model leaderboard)
    is real but its consumer app does not crack China''s top-50 by MAU, its models sit outside the national
    top five on independent 2026 leaderboards, and its clearest remaining wedge is embedded multimodal
    device distribution rather than consumer scale, benchmark leadership, or disclosed capital access.'
sections:
- id: landscape-and-peer-classes
  title: 'Landscape: peer startups, big-tech-embedded models, and adjacent entrants'
  body: |-
    StepFun's real competitive set is broader than the "Six AI Tigers" framing chapter 1 uses to describe its founding cohort. By Q2 2026 the Chinese foundation-model field has consolidated to roughly ten providers with meaningful public usage share -- Xiaomi, Alibaba (Qwen), Zhipu AI (rebranded internationally as Z.ai), DeepSeek, Moonshot AI, MiniMax, StepFun, ByteDance, Baidu, and Tencent -- with a longer tail of vertical or niche players (Baichuan Intelligence, Yi, Xunfei, KwaiKAT) behind them. Inside that set, StepFun sits alongside Zhipu AI, Moonshot AI, MiniMax, and Baichuan Intelligence as a venture-funded, pure-play foundation-model startup, distinct from big-tech-embedded programs -- Alibaba's Qwen, Baidu's ERNIE, and ByteDance's Doubao/Seed -- that ride an existing cloud, search, or consumer-app distribution stack, and distinct again from DeepSeek, which is investor-independent (High-Flyer-funded) until its first external round in mid-2026.

    Two adjacent classes matter as much as the named peer set. First, Xiaomi's MiMo model family is not one of StepFun's traditionally cited peers, yet it alone commands roughly 21% of weekly Chinese-provider OpenRouter token volume in Q2 2026 -- more than any single pure-play startup -- showing that a device incumbent can out-distribute every funded AI lab purely through smartphone and developer-tooling bundling, the same channel StepFun is trying to use as its own wedge. Second, internal build or reliance on blocked or export-controlled overseas frontier APIs remains a status-quo substitute for some regulated Chinese buyers, but data-localization rules and chip export controls push most domestic demand toward the ten-provider Chinese set profiled in this chapter.
