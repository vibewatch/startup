- id: comparative-dimensions
  title: 'Comparative dimensions: capability, pricing, distribution, and trust posture'
  body: |-
    On raw capability, independent July 2026 benchmark tracking places Qwen3.7 Max and GLM-5.2 at the top of the Chinese-model leaderboard (score 90 each), DeepSeek V4 Pro Max close behind at 87, and Kimi K2.6 at 81; StepFun's models, while a real "surprise performer" via Step 3.5 Flash's #3 rank on OpenRouter's free-model leaderboard, are not listed among the top five nationally ranked Chinese models on this leaderboard. On pricing, StepFun's own step-3.7-flash (CNY 0.27 cache-hit / 1.35 standard input / 8.1 output per million tokens) and step-3.5-flash (0.14/0.7/2.1) sit inside the same broad CNY-denominated band as DeepSeek, Qwen, and Kimi's tiers, but the 2026 API price war has been driven almost entirely by other labs: DeepSeek, Xiaomi MiMo, and Moonshot Kimi each declared 2026 price cuts permanent, with DeepSeek V4-Pro now at $0.87 output (about 34x below GPT-5.5) and Kimi K2.6 holding the lowest cache-hit floor in the market at $0.07.

    Distribution power diverges even more sharply than pricing. ByteDance's Doubao is China's most-used consumer AI app at 336-345 million monthly active users; Alibaba's Qianwen and Quark apps combine for roughly 380 million; Baidu's ERNIE-powered assistant (Wenxiaoyan) has about 200 million monthly and over 300 million registered users; and even DeepSeek's own consumer app ranks #4 nationally at roughly 139 million MAU. Kimi's consumer app, by contrast, ranks 8th at about 25 million MAU, and StepFun's Yuewen does not appear in China's top-50 AI apps by MAU at all. On trust and hardware posture, GLM-5 (Huawei Ascend) and Baidu ERNIE (Baidu Kunlun) lead on domestic-hardware independence relevant to export-control-sensitive buyers, while StepFun trains on NVIDIA Hopper -- a posture shared with most of the field but not a differentiator. Because most of these APIs are OpenAI-compatible and several ship permissively licensed open weights, enterprise and developer buyers can multi-home or switch providers with comparatively low technical friction, which caps how much lock-in any single vendor, including StepFun, can extract from pricing or model quality alone.
