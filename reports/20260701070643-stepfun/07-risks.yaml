company:
  name: StepFun
chapter:
  number: 7
  title: Risks
  summary: StepFun's risk profile is dominated by a stacked, fast-moving 2026 regulatory calendar (a CSRC-driven red-chip
    unwind, an amended Cybersecurity Law, and AI-content-labeling obligations), a compute supply chain squeezed by tightening
    US export-control enforcement against a domestic-chip alternative that still trails Nvidia, and a governance structure
    where the same chairman controls both StepFun and its financially fragile, only proven automotive-distribution partner,
    Qianli Technology.
sections:
- id: section-1
  title: 'Regulatory and listing risk: a red-chip unwind and a stacked 2026 compliance calendar'
  body: 'StepFun''s most immediate structural risk is regulatory rather than technical. Reuters reported on April 13, 2026
    that StepFun is unwinding its offshore Cayman Islands ''red-chip'' incorporation structure to pave the way for a planned
    Hong Kong IPO, after China''s securities regulator instructed some offshore-registered companies to dismantle such structures
    over shareholder-transparency and compliance-risk concerns. Two sources told Reuters the decision reflected StepFun being
    ''heavily backed by state capital,'' including Shanghai municipal and district government investment vehicles, and by
    April 2026 the company had completed conversion into a joint-stock company, with Qianli Technology chairman Yin Qi formally
    registered as StepFun''s chairman. Under the Trial Measures that have governed overseas listings since March 2023, indirect
    listings via red-chip structures require CSRC filing within three working days of an overseas listing application and
    face a 20-working-day review window; legal commentary notes that unwinding an existing red-chip structure can be legally
    complex and cost-prohibitive, with some companies delaying or abandoning IPO plans altogether. Layered on top of that
    listing-structure risk is a stacked compliance calendar: China''s amended Cybersecurity Law took effect January 1, 2026
    with a materially heavier tiered penalty regime (fines up to RMB 10 million or more for critical-infrastructure violations)
    and explicit AI-governance language, while the AI-generated-content Labeling Measures and mandatory GB 45438-2025 standard
    have required dual explicit/implicit labeling since September 1, 2025. On the opportunity side, HKEX''s March 2026 consultation
    proposes lowering weighted-voting-rights listing thresholds, which could ease (not tighten) StepFun''s path to a founder-friendly
    listing structure if adopted before its filing window closes.'
