- id: section-2
  title: 'Compute and supply-chain risk: export-control tightening meets a still-trailing domestic chip stack'
  body: 'StepFun''s second structural risk sits upstream, in the compute it needs to keep training frontier-competitive models.
    On May 31, 2026 the U.S. Bureau of Industry and Security closed a loophole that had let China-headquartered firms buy
    advanced Nvidia/AMD chips through overseas subsidiaries in Singapore, Malaysia, and Taiwan without an export license,
    resting on an ''ultimate parent company'' test that has technically been in force since November 2023 and now creates
    retroactive compliance exposure for any such transactions. Tech Times reported that Trump administration officials were
    internally divided in June 2026 over whether this had been an inadvertent policy gap following a 2025 decision to stop
    enforcing the Biden-era AI Diffusion Rule. The same month, BIS added dozens more Chinese entities to the Entity List for
    advanced-AI and high-performance-chip development tied to China''s military-industrial complex, even as CNBC reported
    the U.S. was holding off formally blacklisting DeepSeek, CXMT, and 100-plus other flagged firms to avoid escalating tensions
    with Beijing -- and the Pentagon''s June 2026 ''1260H list'' update added Alibaba, Baidu, and BYD. No source reviewed
    names StepFun directly on either list as of this chapter''s run date, but the rapid expansion of both rosters signals
    adjacency risk for any state-backed Chinese AI unicorn. StepFun''s own hedge is the Model-Chip Ecosystem Innovation Alliance
    it co-founded in July 2025 with roughly ten domestic chip vendors including Huawei Ascend, MetaX, Biren, Enflame, Iluvatar
    CoreX, and Moore Threads; Huawei''s newest Ascend 950PR delivers roughly 2.8x the inference throughput of Nvidia''s export-approved
    H20 but draws about 200W more power, and independent analysis finds the domestic stack still trails Nvidia''s Blackwell-class
    chips on per-chip efficiency and CUDA-ecosystem maturity, compensating with cluster-scale aggregation at nearly 4x the
    power draw. Beneath both risks sits the sheer capital intensity of frontier AI: a 100-to-10,000-GPU cluster requires $5
    million to over $500 million upfront in 2026, with hardware itself representing only about 35% of five-year total cost
    of ownership once networking, power, cooling, and staffing are included -- a capital bar StepFun must clear against far
    larger competitors.'
