- id: section-3
  title: 'Competitive and pricing risk: a consolidating field, an active price war, and a widening distribution gap'
  body: 'StepFun competes inside a China foundation-model field that KrASIA and JPMorgan both describe as consolidating fast.
    KrASIA groups StepFun with 01.AI, Baichuan AI, MiniMax, Moonshot AI, and Zhipu as China''s ''AI tigers,'' noting that
    Zhipu and MiniMax had already listed in Hong Kong by early 2026 while the rest, including StepFun, remain private and
    under funding pressure. JPMorgan''s February 2026 sector note argues the number of viable Chinese model developers has
    shrunk from more than 200 to fewer than ten, with future winners determined by deployment scale and monetization efficiency
    rather than model-release cadence -- and the bank initiated public analyst coverage on Zhipu and MiniMax with ''Overweight''
    ratings, but not on StepFun, consistent with StepFun''s comparatively thin public disclosure. The revenue gap is material:
    Zhipu''s 2025 revenue reached RMB 724.3 million (up from RMB 312.4 million in 2024), well above StepFun''s previously
    reported roughly RMB 500 million, while ByteDance alone plans to spend more than RMB 160 billion on AI procurement in
    2026 and Tencent''s 2025 capital expenditure reached RMB 79.2 billion -- an order of magnitude beyond the infrastructure
    scale StepFun has disclosed. This consolidation is compounding an active price war: Chinese labs cut API prices repeatedly
    through 2026, compressing per-token revenue just as compute costs remain capital-intensive, squeezing StepFun''s unit
    economics from both the demand and supply side simultaneously, with no evidence in the sources reviewed here that StepFun
    has achieved differentiated pricing power versus larger, better-capitalized rivals.'
  claimRefs:
  - CR028
  - CR029
  - CR030
