- calloutType: risk
  title: Interlocking directorate concentrates StepFun's automotive channel risk
  body: StepFun chairman Yin Qi also chairs Qianli Technology, the Geely-linked entity that is StepFun's only proven automotive
    distribution partner and which has posted three straight years of negative core net profit -- a governance and channel
    risk compounded in one relationship.
  claimRefs:
  - CR041
  - CR036
  - CR033
- calloutType: risk
  title: No audited financial baseline ahead of a $10-12 billion IPO target
  body: No audited 2025 financial statements or filed HKEX prospectus for StepFun were retrievable as of this chapter's run
    date, leaving its reported roughly RMB 500 million 2025 revenue unverified against its targeted cornerstone valuation.
  claimRefs:
  - CR042
  - CR005
- calloutType: assumption
  title: Absence of adverse security/litigation evidence is treated as a gap, not a clearance
  body: This chapter finds no public security certification, incident disclosure, lawsuit, or data-breach record for StepFun.
    That absence is recorded as an evidence gap requiring diligence follow-up, not as confirmation of a clean operational-risk
    record.
  claimRefs:
  - CR045
  - CR049
- calloutType: recommendation
  title: Track five public, monitorable thesis-break triggers between refreshes
  body: CSRC filing closure/HKEX prospectus status, Entity List or Pentagon 1260H designation, a StepFun-specific CAC enforcement
    action, non-arm's-length Qianli related-party disclosures, and Qianli's quarterly financial trend are all observable from
    outside the company and should anchor the next diligence refresh.
  claimRefs:
  - CR001
  - CR016
  - CR041
  - CR036
