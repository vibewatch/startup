- id: section-4
  title: 'Customer concentration and channel risk: a device footprint riding on a financially fragile automotive partner'
  body: StepFun's clearest device-adjacent proof points -- smartphone embedding with OPPO, Honor, and ZTE, and automotive
    cockpit AI with Geely -- are also its narrowest channel dependencies. On the smartphone side, three OEM groups reportedly
    carry StepFun's entire roughly 42-million-device distribution headline; OPPO's own public compliance statement commits
    only to general legal and data-protection compliance across its 60-plus countries, with no StepFun-specific service-level
    terms disclosed. On the automotive side, the channel runs entirely through Qianli Technology, the Geely-linked automotive-AI
    vehicle that is also chaired by StepFun's own chairman, Yin Qi. Qianli's 2025 annual report shows sales to Geely-affiliated
    companies at 29.26% of total revenue (ranging 30.8%-39.7% across 2022-2025), and its shareholders approved 2025-2026 related-party-transaction
    limits with Geely entities on December 31, 2025 with over 99% approval; a June 2025 cninfo filing shows Qianli, Geely,
    Megvii-linked Yin Qi entities, and Chongqing state funds jointly structuring an intelligent-driving joint venture with
    RMB 1.5 billion in committed capital, deepening rather than diversifying the relationship. Critically, Qianli's own second-quarter-2026
    prospectus update shows its core, non-recurring-excluded net profit has been negative for three straight years despite
    42.1% revenue growth in 2025, with its automotive-business gross margin at just 2.8% and the parent company's cumulative
    unrecovered losses near RMB 948 million -- meaning the channel StepFun's automotive proof runs through is itself under
    real financial strain. StepFun's parallel hedge against smartphone concentration is its Model-Chip Ecosystem Innovation
    Alliance and its state-linked capital base (Shanghai municipal/district funds and the Hong Kong Investment Corporation),
    but none of these reduce the single-point dependency on Qianli for automotive revenue.
