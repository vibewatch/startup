- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Red-chip / CSRC listing risk
    - CSRC filing status or HKEX prospectus publication
    - CSRC review not completed, or HKEX filing withdrawn/delayed past 2026-12-31
    - Delay entry/exit timing; reprice IPO-linked valuation assumptions.
  - - Chip export-control tightening
    - BIS Entity List or Pentagon 1260H list updates
    - Direct designation of StepFun, Qianli, or a named compute supplier
    - Reassess compute-supply continuity and apply a valuation discount for sanction risk.
  - - Automotive-channel concentration
    - Qianli Technology quarterly financial disclosures
    - Continued negative core net profit or a declining Geely revenue share signaling channel stress
    - Discount automotive-channel revenue assumptions; seek diversification evidence beyond Geely/Qianli.
  - - Content-labeling / Cybersecurity Law enforcement
    - CAC public enforcement actions or fines against generative-AI peers
    - Any documented StepFun-specific suspension, fine, or service restriction
    - Treat as a thesis-break trigger requiring immediate re-underwriting.
  - - Price-war margin compression
    - Published API rate-card changes across Chinese labs
    - Further StepFun price cuts below already-compressed 2026 levels without a volume offset
    - Re-model unit economics and revenue-per-token trajectory.
  - - Benchmark credibility
    - Independent, vendor-neutral benchmark publications
    - A material downgrade of StepFun's ranked position on an audited leaderboard
    - Reassess the product-differentiation thesis.
  - - Governance / interlocking directorate
    - Board disclosures or related-party-transaction filings
    - Any StepFun-Qianli related-party transaction disclosed on non-arm's-length terms
    - Escalate governance diligence; consider board-independence conditions precedent to investment.
  notes: Triggers are monitorable public-disclosure events chosen by this chapter's authors, not thresholds StepFun itself
    has published.
