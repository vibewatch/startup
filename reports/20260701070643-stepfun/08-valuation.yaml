- id: scenario-logic
  title: 'Scenario logic: index-flow-driven upside is real, but so is a fast reset if execution slips'
  body: 'The bull case is straightforward: if StepFun''s device and automotive footprint (40M+ smartphones, 1M+ target Geely
    vehicles) converts into monetizable API and licensing revenue at or above the $175.9 million 2026 projection, and the
    IPO prices near the top of its range with the same index-inclusion and cornerstone-lock-up support that has cushioned
    Zhipu''s share price, StepFun could plausibly compound toward the $12-20 billion range over the following year -- approaching
    Moonshot''s current mark. That outcome requires flawless execution: no repeat of the mid-2025 revenue-guidance miss
    already flagged in Chapter 4, continued device-partner cooperation, and no adverse turn in the CSRC-driven listing review.


    The base and bear cases are easier to defend from public evidence. Both Zhipu and MiniMax have swung more than 40-70%
    from their post-listing highs within six months of trading, so even a clean StepFun listing near $10-11 billion offers
    no guarantee of price stability -- Chinese AI-lab valuations in 2026 are as much a function of index flows, cornerstone
    lock-ups, and scarcity narratives as of underlying economics. The bear case adds a further downside path: a delayed
    or downsized listing tied to the ongoing red-chip and CSRC review, a repeat of 2025''s guidance miss, or a punitive
    device-partner revenue share, any of which could reset the mark back toward the $4-6 billion pre-money range earlier
    2026 reporting had already disclosed for StepFun.'
  claimRefs:
