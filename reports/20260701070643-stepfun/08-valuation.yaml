company:
  name: StepFun
chapter:
  number: 8
  title: Valuation
  summary: StepFun pairs a genuine device-and-automotive distribution wedge and a record 2026 financing sprint with a $10-12
    billion Hong Kong IPO target that implies a 57-68x forward revenue multiple -- stretched against public benchmarks but
    not the richest mark among its own Chinese AI-tiger peers. With no audited prospectus yet public, the evidence supports
    research-more at medium confidence, high risk, and a stretched valuation stance rather than a price-insensitive buy.
sections:
- id: recommendation-and-thesis
  title: 'Recommendation: a real device wedge priced at a level public disclosure cannot yet underwrite'
  body: 'StepFun enters this diligence with a genuinely differentiated distribution story: a completed share reform, a dismantled
    red-chip structure, and a nearly $2.5 billion pre-IPO round that drew the Hong Kong Investment Corporation alongside
    smartphone-ODM and component investors Huaqin, Longcheer, OmniVision, and ZTE. That investor mix is not generic financial
    capital; it is the same supply chain StepFun needs to keep its models embedded on device. Founder Jiang Daxin, a former
    Microsoft vice president, has built a roughly 500-person, 80%-technical team since April 2023, and the company has drawn
    outside recognition as one of the Chinese AI labs worth watching beyond DeepSeek.


    None of that resolves the pricing question this chapter must answer. StepFun''s Hong Kong IPO targets a $10-12 billion
    valuation against a reported $73.3 million of 2025 revenue and a market projection of $175.9 million for 2026 -- implied
    multiples of roughly 137-164x trailing and 57-68x forward revenue. Independent commentary explicitly ties the $12 billion
    figure to ''national champion'' sentiment and state-backed capital rather than to disclosed fundamentals, and no source
    reviewed here supplies an audited financial statement, cash position, or filed prospectus. Given a real but unverified
    thesis, a stretched-but-not-extreme multiple, and a thin evidence base, the appropriate call is research-more, not buy:
    track the filing and first two post-listing quarters, and do not commit capital above the low end of the range absent
    audited numbers.'
