    - Valuation is a target, not a priced outcome; revenue figures are third-party-reported, not audited.
  - - Zhipu AI (Z.ai, HKEX 02513)
    - Market cap vs. FY2025 revenue
    - ~576x static P/S (per 36Kr)
    - 'Closest disclosed public comp: first listed pure-play Chinese LLM company.'
    - Multiple is inflated by index-inclusion flows and thin free float, not necessarily a repeatable benchmark.
  - - MiniMax (HKEX 0100)
    - Market cap vs. FY2025 revenue
    - ~212x (HKD130.79B market cap vs. $79M revenue)
    - Second HKEX-listed Chinese AI-tiger; shows the post-listing volatility pattern this cohort exhibits.
    - Headline $1.87B net loss is mostly a non-cash preferred-share remeasurement, not a cash-burn signal.
  - - Moonshot AI (Kimi)
    - Private valuation vs. annualized recurring revenue
    - ~100x ARR ($20B valuation / $200M ARR)
    - Closest private-market Chinese comp by ARR multiple.
    - Private mark, not exchange-traded; ARR figure is company/advisor-reported.
  - - DeepSeek
    - Private valuation; no disclosed revenue metric
    - Valuation above $50B, no public revenue figure
    - Shows the ceiling of 2026 Chinese AI private valuations.
    - Cannot compute a revenue multiple; founder-controlled governance structure differs sharply from StepFun's.
  - - Baichuan Intelligence
    - Private valuation
    - ~$2.7-2.8B
    - Shows the low end of the disclosed Chinese AI-tiger valuation range.
    - Different strategy (vertical healthcare AI pivot) limits direct comparability.
  - - Palantir (PLTR, public benchmark)
    - Market cap vs. TTM revenue
    - ~53.5x P/S
    - Public-market ceiling reference for AI-premium software pricing.
    - Profitable, US-listed, government-exposed business; not a direct sector peer.
  notes: Multiples mix public market-cap ratios, private ARR multiples, and one unmeasurable case (DeepSeek); treat as directional
    context, not a like-for-like screen.
