- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited financials / prospectus
    - Cash, burn, gross margin, and segment revenue
    - Cannot underwrite the 57-68x forward multiple without verifying the revenue base behind it
    - HKEXnews filing once published; management diligence room.
  - - Cap table / ownership
    - Stake size held by HKIC, Shanghai state capital, and industrial investors
    - Determines dilution and whether the $10-12B target reflects real economic ownership or a headline round size
    - Request cap table and shareholder register from company or counsel.
  - - IPO pricing outcome
    - Final offer price, raise size, and cornerstone allocation
    - Directly resolves whether the entry multiple lands near 57x or 68x+
    - Monitor the HKEXnews listing announcement and pricing supplement.
  - - Device / OEM revenue-share terms
    - Per-device or revenue-share percentage with Geely, OPPO, Honor, and ZTE
    - Determines how much of the 40M+ device footprint converts to StepFun's own revenue versus partners'
    - Request partner contract terms via management or partner IR.
  - - Post-listing stabilization plan
    - Green-shoe option, lock-up schedule, and index-inclusion timeline
    - Zhipu/MiniMax precedent shows these mechanics drive much of the early post-listing price action
    - Review the prospectus stabilization section once filed.
  notes: Each ask is chosen because it could directly move the recommendation, confidence, or acceptable entry price above.
