- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - 2026 revenue reaches or exceeds the $175.9M projection, device/auto distribution converts into monetizable API and
      licensing revenue, and the IPO prices near $12B with Zhipu-style index-inclusion support.
    - At $12B against $175.9M revenue the multiple is ~68x; a further revenue doubling in 2027 at a stable multiple would
      approach $20-24B, near Moonshot's current mark.
    - Requires flawless IPO execution, sustained device-partner cooperation, and no repeat of the mid-2025 guidance miss.
    - low
  - - Base
    - IPO prices near $10-11B, 2026 revenue lands close to but not above the projection, and the stock trades with Zhipu/MiniMax-style
      volatility rather than a stable re-rating.
    - Implied value holds near $10-11B with wide post-listing swings; no durable re-rating without audited margin disclosure.
    - Index-flow and cornerstone-lock-up support fades once free float widens after unlock dates.
    - medium-high
  - - Bear
    - The listing is delayed or downsized by the ongoing red-chip/CSRC review, the mid-2025-style guidance miss recurs,
      or device-partner revenue share compresses StepFun's own take.
    - Valuation resets toward the $4-6B pre-money range disclosed earlier in 2026, a 50-60% haircut from the $10-12B target.
    - Regulatory timing risk, revenue-share compression, and margin ceiling from the 2026 API price war compound together.
    - medium
  notes: Scenarios use revenue-multiple frameworks, not a discounted-cash-flow model, because public evidence is too thin
    on margin and cash-flow conversion for StepFun specifically.
