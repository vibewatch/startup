- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - StepFun's 40M+ device footprint and Geely automotive program give it a distribution wedge few Chinese model peers
      can match.
    - thesis
    - Verified per-device economics or unit-level revenue-share terms would strengthen this into a monetization thesis rather
      than a distribution story.
  - - A record 2026 financing sprint (Series B+, ~$2.5B pre-IPO round, HKIC backing) shows deep and diversifying capital
      access.
    - thesis
    - A failed or materially repriced IPO would undercut this signal.
  - - The implied 57-68x forward revenue multiple is stretched versus Palantir's ~53.5x public benchmark but is not the
      most extreme mark in its own comp set (Zhipu ~576x, MiniMax ~212x).
    - thesis
    - An IPO pricing toward $12B rather than $10B would push the multiple further from defensible.
  - - No public source discloses StepFun's audited cash, burn, margin, or cap table.
    - anti-thesis
    - A filed prospectus with audited financials would materially improve underwriteability.
  - - Independent commentators tie the ~$12B target to national-champion sentiment and state-backed capital rather than
      disclosed fundamentals.
    - anti-thesis
    - An independently verified revenue base or credible path to profitability would rebut this critique.
  - - Every disclosed 2026 Chinese AI-tiger IPO in this comp set (Zhipu, MiniMax) has swung 40-70%+ from its post-listing
      high.
    - anti-thesis
    - A demonstrated post-listing stabilization period would reduce this risk for any StepFun entry price.
  notes: 'Arguments are intentionally price-sensitive: they describe what the current $10-12B target already assumes, not
    a generic view of company quality.'
