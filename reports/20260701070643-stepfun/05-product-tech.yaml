callouts:
- calloutType: strength
  title: Genuine cost-efficiency architecture, not just marketing framing
  body: Independent technical analysis corroborates the core efficiency mechanism -- fine-grained MoE routing activating ~11B of 198B parameters, plus a separately published MFA/AFD co-design for the larger Step-3 model -- as a real architectural differentiator, not just a benchmark artifact, even though the exact cost multiples StepFun advertises remain unaudited.
  claimRefs:
  - CE002
  - CE013
  - CE014
- calloutType: risk
  title: Benchmark framing conflates vendor-stated and independent results
  body: 'StepFun''s own release material mixes internally-reproduced comparison figures with officially reported third-party scores in the same chart, leads with a contamination-flagged SWE-Bench Verified score over the cleaner SWE-Bench Pro figure, and a vendor-neutral aggregator ranks the model far lower (#108 intelligence, #89 coding) than the "first place" framing StepFun applies to narrower agentic benchmarks.'
  claimRefs:
  - CE017
  - CE019
  - CE021
- calloutType: risk
  title: Trust and security disclosure lags the product surface area
  body: StepFun operates in a regulatory environment with binding AI-content-labeling and agent-security-warning obligations, and its flagship model is deeply integrated with the same OpenClaw ecosystem flagged for Trojan-laced skill packages -- yet no StepFun-specific labeling implementation, security certification, or platform SLA is disclosed in public sources.
  claimRefs:
  - CE024
  - CE025
  - CE028
- calloutType: assumption
  title: Domestic-chip diversification is a stated ambition, not yet a proven hedge
  body: The Model-Chip Ecosystem Innovation Alliance gives StepFun a credible-sounding path to reduce Nvidia dependence, and Step 3's architecture has genuinely been adapted for domestic accelerators, but independent commentary as of June 2026 still describes the alliance's progress as early-stage hardware adaptation rather than production-scale deployment.
  claimRefs:
  - CE015
  - CE044
