- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow
  - StepFun Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Ship code changes/tests autonomously
    - Human developer or expensive frontier-model agent loop
    - Step 3.7 Flash + Advisor Mode escalation
    - ~$0.19/task vs ~$1.76 for a larger advisor model (vendor claim, ~9.3x)
    - Cost multiple is StepFun's own scaffold estimate, not independently audited
  - - Parse dense financial reports, UI screenshots, documents
    - Manual extraction or GPT-4o-class vision APIs
    - Step 3.7 Flash native multimodal parsing
    - Single-pass ingestion of mixed visual/text input
    - SimpleVQA/V* scores are vendor-stated pending independent replication
  - - Answer questions needing fresh, multi-source evidence
    - Cascaded search + summarization pipelines
    - Web & visual search enhancement in Step 3.7 Flash
    - 79.2 SimpleVQA (Search), 75.82% BrowseComp (vendor)
    - Comparison models drawn from different eval harnesses, not strictly apples-to-apples
  - - Natural two-way voice conversation with tool use
    - Cascaded ASR + LLM + TTS pipelines
    - Step-Audio 2 end-to-end audio LLM with RAG + tool-calling
    - Vendor-claimed SOTA on several open ASR/paralinguistic benchmarks
    - Comparison authored entirely by StepFun, not an independent evaluator
  - - General assistant / search inside China
    - Doubao, ERNIE, DeepSeek consumer apps
    - 跃问 (Yuewen) app + embedded smartphone assistant
    - 40M+ embedded devices (per Company Overview)
    - Yuewen itself is absent from China's top-50 apps by MAU (per Competitors chapter)
  - - Run an agent privately on owned hardware
    - Cloud-only frontier APIs
    - Open-weight GGUF quantizations for llama.cpp/vLLM/SGLang
    - 100% tool-call success in one independent DGX Spark test
    - Requires >=128GB unified memory; local throughput ~27 tok/s vs ~400 tok/s cloud
  - - Operate desktop software via screen understanding
    - Manual UI scripting or RPA tools
    - STEP-GUI (gelab-zero) framework
    - Open-sourced, 2.2k GitHub stars
    - Framed as a research-grade GUI agent solution; production reliability unproven independently
  notes: Benefit figures are vendor-stated unless marked independent; limitations flag where independent corroboration is missing or partial.
