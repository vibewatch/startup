  - id: section-3
    title: Funding history, investors, and valuation trajectory
    body: >-
      StepFun's financing history shows a company that started slowly but has since compounded quickly. KrASIA and
      BigGo Finance both describe an angel/first round that reached unicorn valuation on the strength of founder
      networks, backed by Sequoia China (HongShan), Qiming Venture Partners, and IDG Capital; a 2024 Series A added
      US-dollar investors 5Y Capital and Shunwei Capital alongside Legend Capital; and a Series B, launched
      mid-2024 and closed around December 2024, brought in Shanghai State-owned Capital Investment and affiliated
      funds, the Hong Kong Investment Corporation (HKIC), and Tencent. On January 26, 2026, TechNode, KrASIA, Yicai,
      and C114 all reported that StepFun closed a Series B+ round exceeding RMB 5 billion (roughly $718-733
      million) -- called the largest single financing in China's large-model sector over the prior 12 months --
      with new industrial and state-linked investors (Shanghai SDIC/S&T Capital InnoFund, China Life Private Equity,
      Pudong Venture Capital, Xuhui Capital, Wuxi Liangxi Fund, Xiamen ITG Group, Huaqin Technology) alongside
      follow-on money from Tencent, Qiming, and 5Y Capital. By April 2026, StepFun had converted to a joint-stock
      company and dismantled its Cayman Islands "red-chip" structure, and by May 2026 KrASIA and CnTechPost
      reported it was nearing an almost $2.5 billion pre-IPO round -- with HKIC's only disclosed generative-AI
      investment to date, plus supply-chain investors Huaqin, Longcheer, OmniVision, and ZTE. Reuters cited Caijing
      reporting that the pre-IPO round targeted up to a $6 billion valuation ahead of a Hong Kong filing near a $10
      billion anchor valuation; FAQ.com.tw reported StepFun filed for that Hong Kong IPO on June 9, 2026, targeting
      $10-12 billion and roughly a $500 million raise.
