  - calloutType: risk
    title: Thin disclosed revenue and an offshore-structure unwind both need closing
    body: >-
      StepFun is pursuing a $10-12 billion IPO valuation against roughly $73 million of reported 2025 revenue,
      while simultaneously unwinding a red-chip structure under CSRC pressure -- either issue alone would warrant
      diligence, and together they are this chapter's clearest flags.
    claimRefs:
      - CO030
      - CO031
      - CO033
      - CO042
      - CO043
