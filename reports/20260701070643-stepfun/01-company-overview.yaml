    title: Full-stack physical-AI positioning is unusually concrete
    body: >-
      Unlike peers that emphasize chat apps or pure API sales, StepFun can point to shipped deployment evidence --
      40M+ smartphones and a named Geely vehicle program -- backing its "AI + terminal" strategy.
    claimRefs:
