  - calloutType: insight
    title: Capital markets are underwriting a compressed IPO sprint
    body: >-
      A record Series B+ round, a near-$2.5 billion pre-IPO round, and a Hong Kong IPO filing all landed within
      roughly five months of each other, with HKIC's only generative-AI bet among the backers.
