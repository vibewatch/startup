  - id: section-4
    title: Commercialization milestones -- models, partnerships, and scale
    body: >-
      StepFun's product chronology moved fast from the start: Chinese Wikipedia and KrASIA both place the roughly
      100-billion-parameter Step-1 launch in August 2023, months after founding, followed by the multimodal Step-1V
      in November 2023 and a trillion-parameter Step-2 Mixture-of-Experts preview in March 2024. At WAIC 2024 in
      July, StepFun officially launched Step-2, the Step-1.5V multimodal model, and the Step-1X image generator.
      February 2025 brought open-sourced Step-Video-T2V and Step-Audio, developed jointly with Geely; by WAIC 2025
      that automotive relationship had matured into a joint showcase of the Galaxy M9 -- billed as the world's
      first vehicle with a "human-like AI agent" -- powered by StepFun's end-to-end voice model and a jointly built
      Agent OS smart-cockpit system, per BusinessWire. StepFun open-sourced its flagship Step 3 (321 billion total,
      38 billion active parameters, Apache 2.0) on July 31, 2025, with a technical paper describing Multi-Matrix
      Factorization Attention and Attention-FFN Disaggregation designed to cut decoding costs versus DeepSeek-V3 and
      Qwen3 MoE 235B; February 2026 followed with the open-source Step 3.5 Flash (196B/11B active, 256k context).
      Reuters reported Step 3.5 Flash has since ranked among the three most-used models on the OpenClaw agent
      platform. On the deployment side, FAQ.com.tw and BigGo Finance both report StepFun models powering AI
      features on more than 40 million smartphones (OPPO, Honor, ZTE) and targeting more than one million Geely
      vehicles, serving an estimated 20 million daily users.
