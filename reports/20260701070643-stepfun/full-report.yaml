      - number: '2.5'
        title: Growth drivers, price competition, compute constraints, and regulation
        blocks:
          - type: paragraph
            body: >-
              Three structural drivers push in StepFun's favor. China's May 2026 CAC/NDRC/MIIT 'Implementation Opinions'
              is the country's first dedicated national policy framework for AI agents, defining them formally and
              naming 19 priority deployment scenarios across research, manufacturing, transport, finance, healthcare,
              and government. IDC's 'AI+' targets -- 70% smart-device/agent penetration by 2027, 90% by 2030, and 80% of
              China's top-1,000 enterprises prioritizing AI sovereignty by 2027 -- create durable demand for domestic,
              embeddable models. And China's device-replacement cycles (AI phones, GenAI PCs, smart cockpits) are all
              expanding the physical surface area for embedded AI. But the same forces double as constraints. China's
              2023 generative-AI measures and its 2025 AI-content labeling rules (effective September 1, 2025) impose
              recurring content-security, data, and explicit/implicit labeling obligations on every deployed surface.
              Compute access tightened further on May 31, 2026, when the U.S. Commerce Department closed a loophole that
              had let China-headquartered firms buy advanced Nvidia/AMD chips through overseas subsidiaries without a
              license -- extending export controls by ownership rather than delivery location. Pricing is compressing
              just as fast: Chinese labs cut API prices at least six times in H1 2026, with DeepSeek, Xiaomi MiMo, and
              Kimi making cuts permanent, pushing per-token prices 5-34x below Western frontier APIs; StepFun's own
              published step-3.5-flash and step-3.7-flash rates sit in the same competitive band rather than at a
              premium. Trust is also under strain: Chinese authorities have issued high-level warnings about
              Trojan-laced counterfeit skill packages on the OpenClaw agent platform -- the same ecosystem where Step
              3.5 Flash ranks near the top of usage charts. Finally, distribution is asymmetric: ByteDance's Doubao
              alone reaches over 500 million phone terminals and more than 7 million vehicles, roughly an order of
              magnitude beyond StepFun's disclosed footprint, while global automakers increasingly co-develop
              China-specific cockpit AI with local partners (Huawei HarmonyOS, XPeng, Momenta) rather than a single
              vendor -- and China's foundation-model layer saw financing roughly halve in 2025 to about 22 deals worth
              RMB 9.4 billion, tightening the capital available to independent players competing against these larger
              platforms.
