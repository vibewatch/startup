      - number: '8.4'
        title: 'Exit readiness and final diligence: the asks that would change this call'
        blocks:
          - type: paragraph
            body: >-
              StepFun has cleared the structural prerequisites for a listing -- share reform, red-chip unwind, and a
              cornerstone lineup that already includes state-linked and industrial capital of the kind that supported
              Zhipu's post-listing resilience. That is a necessary but not sufficient condition for a constructive
              valuation call. The evidence gap is specific and closeable: an audited prospectus with cash, burn, gross
              margin, and segment revenue; a cap table showing what HKIC, Shanghai state capital, and industrial
              investors actually own after the round; the final IPO pricing and raise size; and StepFun-specific device
              and OEM revenue-share terms rather than the industry-wide 30-60% norm cited elsewhere in this diligence.


              Each of these closes a distinct thesis-break trigger. A listing priced at or above $12 billion without new
              disclosure pushes the forward multiple past even Zhipu's stretched, index-inflated benchmark once those
              flow effects are stripped out. A post-listing swing on the scale Zhipu and MiniMax both experienced would
              confirm that this comp set's liquidity-driven repricing pattern applies to StepFun too, meaning any entry
              price at listing should be treated as provisional. And a further round of API price cuts across Zhipu,
              Kimi, and MiniMax -- already documented through mid-2026 -- signals a margin ceiling that applies to
              StepFun's own token-priced business regardless of how the IPO prices.
