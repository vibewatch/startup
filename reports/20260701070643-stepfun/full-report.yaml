      - number: '2.4'
        title: Buyer, user, payer, and adoption path across four distinct surfaces
        blocks:
          - type: paragraph
            body: >-
              StepFun's buyer map is not one funnel but at least four parallel ones. Individual consumers self-pay (or
              use free tiers) for its consumer chat and voice apps. Developers and agent builders meter usage directly
              against platform.stepfun.com, and StepFun's March 2026 Step Plan subscription -- four tiers from a
              standard RMB 49 to RMB 699 per month, with a standing developer-community discount -- is purpose-built for
              OpenClaw-agent and AI-coding workflows specifically; independent, usage-based evidence backs this
              segment's traction, with OpenRouter's real-call leaderboard placing Step 3.5 Flash (free) second globally
              in the week of March 9-15, 2026 at 1.34 trillion tokens, up 79% week-on-week. Smartphone and automotive
              OEMs are a third, structurally different buyer: their adoption trigger is a flagship product cycle or
              joint showcase -- the Galaxy M9's WAIC 2025 unveiling, for instance -- rather than a self-serve trial, so
              this channel depends on a small number of high-value relationships rather than broad conversion. A fourth
              buyer, the enterprise or regulated deployer, must clear CAC registration and content-labeling requirements
              before go-live, and IDC's own China AI agent market-glance shows this buyer segmented across many
              functions (finance, HR, customer service, supply chain) and industries (FSI, manufacturing, automobile,
              retail), meaning no single enterprise vertical dominates the opportunity. Crowding this same developer
              segment, IDC also tracks at least a dozen competing China AI-coding-IDE vendors -- Alibaba Qoder,
              ByteDance Trae, Baidu Comate, Tencent Codebuddy, and others -- even before StepFun's own share is counted,
              while IDC forecasts 35% of China's professional developers will adopt AI-native coding platforms by 2027
              even as top vendors' 2025 coding revenue stayed below RMB 100 million despite triple-digit usage growth.
