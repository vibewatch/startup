      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              StepFun's public leadership bench is more populated than many peers at this stage, but still leaves real
              governance gaps. KrASIA's profile names four technical leaders: founder-CEO Jiang Daxin; CTO Zhu Yibo, who
              previously led AI infrastructure and large-cluster operations at ByteDance; data lead Jiao Binxing,
              formerly head of Microsoft Bing's core search team; and chief scientist Zhang Xiangyu, a core author of
              the ResNet architecture. On January 26, 2026, StepFun announced that Yin Qi -- co-founder and former CEO
              of Megvii (Face++), one of China's earlier "AI Dragons," and concurrent chairman of the Geely-linked
              smart-driving firm Qianli Technology -- had been appointed chairman, tasked with overall strategy and
              technical direction. Gasgoo reported that Yin's dual role is explicitly meant to connect StepFun's model
              R&D to real-world hardware deployment data, forming a "Physical AI" feedback loop rather than a purely
              advisory chairmanship. The Standard reported, citing an interview with Jiang Daxin, that StepFun's team
              now exceeds 500 people with roughly 80% in algorithm and technical roles -- a marked jump from the roughly
              150-person team Chinese Wikipedia describes from an earlier period. What the public record does not supply
              is a complete current board roster, committee structure, or cap-table/ownership breakdown, which matters
              given how much of StepFun's capital base is state-linked and how concentrated strategic influence now sits
              with Jiang and Yin.
