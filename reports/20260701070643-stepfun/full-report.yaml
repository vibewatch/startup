  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              StepFun should be read as a company competing inside China's foundation-model application and
              embedded-device AI layer, not as a stand-in for China's entire AI or semiconductor economy. IDC's China AI
              agent market-glance draws exactly this line, separating model-development, application-development, and
              agent-development platforms from the underlying compute, storage, network, and semiconductor
              infrastructure stack beneath them. Inside that boundary, StepFun's own platform.stepfun.com documentation
              shows the company monetizes per-token API metering across chat, vision, voice, and agentic 'step-3.x'
              models rather than flat software licensing, and its Step-Audio voice model already ships as embedded
              cockpit software inside Geely's production Galaxy M9 -- putting automotive smart-cockpit licensing, not
              just consumer chat, squarely inside the addressable spend. A fourth, easily overlooked segment is
              compliance: as of April 30, 2026 China had 868 nationally CAC-registered generative-AI services and 530
              locally registered applications, and every one of StepFun's public-facing surfaces must clear the same
              registration, security-assessment, and content-labeling gates that make compliance a recurring cost of
              doing business rather than a legal footnote. Excluded from this boundary is the much larger infrastructure
              layer -- Forrester puts China's 2026 AI-infrastructure spending above $70 billion -- which StepFun
              consumes as a cost input rather than monetizes directly. Status-quo substitutes for StepFun's surfaces
              range from native phone or car software without embedded generative AI, to larger hyperscaler-distributed
              alternatives (Doubao, Qwen) that OEM partners could choose instead.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
          - type: table
