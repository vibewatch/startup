      - number: '4.4'
        title: 'Cost structure and capital intensity: a domestic-chip alliance does not remove the compute bill'
        blocks:
          - type: paragraph
            body: >-
              StepFun's public cost story centers on compute rather than customer-facing infrastructure. In July 2025 it
              co-founded the Model-Chip Ecosystem Innovation Alliance with roughly ten domestic chip and
              AI-infrastructure vendors -- including Huawei Ascend, MetaX, Biren, Enflame, Iluvatar CoreX, Moore
              Threads, and Cambricon -- explicitly to reduce dependence on foreign GPUs, and StepFun says its Step 3
              model reaches up to roughly 3x DeepSeek-R1's inference throughput on domestic chips and a 70%-plus
              throughput gain over DeepSeek-R1 on Nvidia Hopper hardware. By June 2026, however, industry commentary
              summarized by Baidu Baike said the alliance's progress remained concentrated in hardware adaptation and
              basic integration testing, with limited progress toward large-scale deployment or the kind of broad
              developer ecosystem that Nvidia-based platforms already have. That matters because frontier inference
              stays expensive regardless of chip origin: independent analyst data put global hyperscaler AI capex above
              $130 billion in a single quarter, projected combined cloud-provider capex above $520 billion for 2026,
              single H100 GPUs at $25,000-$40,000 and B200s at $30,000-$70,000, and GPU-collateralized asset-backed
              financing as an increasingly common way to fund 100-10,000-GPU deployments without diluting equity. Set
              against a Chinese large-model market 36Kr estimates at under RMB30 billion in 2024 and growing toward
              RMB70 billion-plus by 2026, StepFun's compute ambitions look proportionate to the opportunity, but nothing
              in the public record quantifies StepFun's own compute spend, chip mix, or resulting unit-cost savings.
