            body: >-
              Company Overview already covers StepFun's round-by-round funding chronology; this chapter's question is
              what recent reporting implies about present-day capital access and revenue quality. Caijing reported
              StepFun's 2025 revenue at roughly RMB500 million (about $73.3 million) with a 2026 projection near RMB1.2
              billion (about $175.9 million). That is a meaningfully lower base than the roughly RMB1 billion full-year
              2025 revenue target StepFun's own leadership stated in July 2025, when several hundred million RMB of
              contracted revenue had reportedly already been booked in H1 -- implying the company fell short of its own
              mid-year guidance. On the capital-access side, a February 2026 report described a two-tranche Pre-IPO
              round (roughly $4 billion and $5-6 billion pre-money) and a planned Hong Kong filing by mid-2026 with
              cornerstone pricing near $10 billion, consistent with the $10-12 billion range and June 9, 2026 filing
              date already established in Company Overview; internal documents cited separately point to a possible
              mid-2027 share lock-up. Independently reviewed registered-capital filings show StepFun raised its onshore
              registered capital twice in 2026 and registered a Hong Kong entity in May 2026, both consistent with
              active listing preparation. Set against already-listed peers, Zhipu AI reported audited 2025 revenue of
              RMB724 million at a 41% gross margin (still with a RMB4.72 billion net loss), and MiniMax reported roughly
              RMB543 million of 2025 revenue -- both larger and more disclosed than StepFun's still-unaudited figures.
