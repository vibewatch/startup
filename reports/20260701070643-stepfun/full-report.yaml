      - number: '7.6'
        title: 'Technical and product risk: benchmark opacity, unverified security posture, and a growing labeling burden'
        blocks:
          - type: paragraph
            body: >-
              StepFun's technical risk sits less in raw model quality than in what cannot be independently verified
              about it. Industry-wide analysis of 2.8 million LMArena model-comparison records found selective
              submissions had inflated leaderboard scores by up to 100 points through cherry-picking, with major labs
              submitting only their best-performing private-test variants rather than shipped production models; this
              pattern is not StepFun-specific, but no independent, StepFun-authorized reproduction of its own flagship
              agentic-benchmark claims was found among the sources reviewed here, leaving the same opacity risk
              unresolved for StepFun specifically. Separately, no independent security certification, bug-bounty
              program, or public incident-response disclosure for StepFun's platform, Step-Audio, or Step-Video was
              located, and no public litigation, data-breach disclosure, or class-action record naming StepFun was found
              either -- an absence that should be read as an evidence gap rather than a confirmed clean record.
              Compliance-wise, China's dual-track explicit/implicit AI-content-labeling regime has been mandatory since
              September 2025, and major platforms including Tencent, Douyin, RedNote, Weibo, and DeepSeek have already
              published compliance statements, while no equivalent public statement from StepFun was found for its
              Yuewen consumer app or API outputs. The compliance surface is still expanding: the Cyberspace
              Administration circulated a draft in April 2026 proposing additional mandatory ethics review, emergency
              procedures, and content-governance obligations specifically for AI services that simulate human
              interaction, expected to take effect around July 2026, which would add further recurring engineering and
              audit burden on top of the labeling regime StepFun's consumer surfaces must already clear.
