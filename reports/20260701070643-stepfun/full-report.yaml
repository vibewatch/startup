    columns:
      - trigger
      - evidence / threshold
      - transmission to thesis
      - action implication
    rows:
      - - IPO priced at or above $12B without new disclosure
        - No incremental audited financials between filing and listing
        - >-
          Pushes the implied forward multiple above 68x, past even Zhipu's index-inflated benchmark once flow effects
          are stripped out
        - Do not add capital; wait for post-listing disclosure.
      - - Post-listing swing exceeds 50% within two quarters
        - Share-price move of that magnitude within six months of listing, as seen at Zhipu and MiniMax
        - Confirms the comp set's liquidity-driven repricing pattern applies to StepFun too
        - Treat any post-listing entry price as provisional, not a stable mark.
      - - Device-partner revenue share proves punitive
        - StepFun-specific revenue-share disclosure at or above the 60% end of the industry norm
        - Compresses the realized take from the 40M+ device footprint, undercutting the distribution thesis
        - Downgrade valuation stance from stretched to expensive.
      - - Compute-rationing / API price war intensifies
        - Further token-price cuts or queuing at Zhipu, Kimi, or MiniMax
        - Signals a margin ceiling across the whole comparable set, including StepFun's own token-priced business
        - Re-underwrite the bear case probability upward.
      - - Regulatory or CSRC red-chip review delays or blocks the listing
        - Listing timeline slips beyond 2026
        - Removes the near-term liquidity catalyst this valuation depends on
        - Shift stance toward research-more/avoid until refiling.
