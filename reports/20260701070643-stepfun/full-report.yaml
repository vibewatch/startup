    A metered API platform (platform.stepfun.com / platform.stepfun.ai) serving the "Step" multimodal model family --
    led by the flagship Step 3.7 Flash agentic vision-language model -- plus open-sourced Step-Audio, Step-Video, and
    Step1X image/audio/video tooling, distributed via GitHub/Hugging Face, and surfaced to consumers through the Yuewen
    (跃问) chat app and embedded smartphone/automotive assistants.
  customerFocus: >-
    Smartphone OEMs (OPPO, Honor, ZTE) and automotive partners (Geely, via Qianli Technology) embedding StepFun models
