      - number: '5.2'
        title: 'Architecture: sparse MoE, attention disaggregation, and the domestic-chip wedge'
        blocks:
          - type: paragraph
            body: >-
              Step 3.7 Flash's cost efficiency rests on fine-grained MoE routing: independent technical analysis of the
              release describes 42 of 45 language layers as routed MoE layers, each holding 288 experts, with a learned
              router selecting only the top 8 per token -- roughly 5.6% of weights computing on any given token. A
              separate, larger model in the family, Step-3 (321B total / 38B active parameters), pushes further on
              hardware-aware efficiency: its co-design paper introduces Multi-Matrix Factorization Attention (MFA) to
              shrink KV-cache size and Attention-FFN Disaggregation (AFD) to split attention and FFN compute into
              specialized subsystems, claiming a decoding throughput of 4,039 tokens/second/GPU on Hopper hardware
              versus 2,324 for DeepSeek-V3 in the same test setup -- a StepFun-run, StepFun-favorable comparison rather
              than an independent benchmark. StepFun has also tried to reduce compute-supply risk directly: in July 2025
              it co-founded the Model-Chip Ecosystem Innovation Alliance with roughly ten domestic chip and platform
              vendors (Huawei Ascend, MetaX, Biren, Enflame, Iluvatar CoreX, Moore Threads, Cambricon among them) and
              adapted Step 3's MFA architecture to run on domestic accelerators including MetaX GPUs. As of June 2026,
              however, industry commentary characterized the alliance's progress as still concentrated in hardware
              adaptation and basic integration testing rather than large-scale production deployment. On the
              product-efficiency side, Step 3.7 Flash's Advisor Mode -- routing most of an agent trajectory through the
              cheap executor and escalating to a larger model only at planning or failure-recovery inflection points --
              is StepFun's own implementation of an escalation pattern it attributes to Anthropic, and its reported
              'emergent' cross-tool combination behavior (independently calling Python crop/zoom utilities inside
              visual-search loops) is a vendor observation StepFun itself has not put through independent reproduction.
