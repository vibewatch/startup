      - number: '5.5'
        title: Trust, safety, security, and compliance
        blocks:
          - type: paragraph
            body: >-
              StepFun's open-weight releases (Step 3.7 Flash, Step 3.5 Flash, Step-Audio 2, Step-Video-T2V, Step1X-Edit)
              are consistently distributed under the permissive Apache 2.0 license, which is a genuine trust and
              transparency positive versus fully closed competitors. Set against that, several trust gaps remain
              undocumented in the public record reviewed for this chapter. China's national AI-Generated Synthetic
              Content Labeling Measures, effective from their March 2025 issuance, require visible and technical
              (watermark/metadata) labeling of AI-generated audio, image, and video content -- an obligation that
              squarely covers Step-Audio's voice-cloning/TTS outputs and the step-2x-large/step-image-edit-2 image
              models, yet no StepFun-specific labeling or watermarking implementation is described in the sources
              reviewed. Separately, Chinese authorities (CNCERT/CC, MIIT, and the National Computer Virus Emergency
              Response Center) have warned about Trojan-laced counterfeit skill packages on the OpenClaw agent platform
              -- the same ecosystem StepFun's own release material lists as a supported, highly-ranked integration for
              both Step 3.5 and Step 3.7 Flash -- without any disclosed StepFun-specific skill-verification or
              sandboxing control. No independent SOC 2, ISO 27001, or comparable security certification is disclosed for
              the platform.stepfun.com API service, and the only available reliability signal is a low-reputation,
              crowd-sourced uptime monitor (operating normally as of July 1, 2026, 26 problem reports in 30 days) rather
              than a StepFun-published SLA or incident postmortem. Finally, Step-Audio 2's claimed state-of-the-art
              benchmark performance versus other open-source and commercial audio models is a comparison authored
              entirely by the StepFun team, not an independent evaluator.
