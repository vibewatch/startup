      - number: '2.2'
        title: Evidence-constrained sizing lenses for a market without one clean number
        blocks:
          - type: paragraph
            body: >-
              No single public figure cleanly sizes 'StepFun's market,' so this chapter preserves several source-backed
              lenses rather than manufacturing one TAM. The narrowest applications lens, IMARC's China generative-AI
              (AIGC) market estimate, puts 2025 value at roughly $5.16 billion, growing to $19.56 billion by 2034 at a
              15.96% CAGR -- a lens that likely understates StepFun's true addressable pool because it excludes
              embedded-device licensing. A much larger, adjacent lens is infrastructure: Forrester expects China's
              AI-infrastructure spending to exceed $70 billion in 2026, and Gartner puts worldwide AI spending at $2.59
              trillion (+47% year-over-year), figures that sit upstream of the layer StepFun actually monetizes. A usage
              lens comes from China's public-cloud model-as-a-service consumption, which reached 1,944 trillion tokens
              in 2025 (16x year-over-year), with ByteDance's Volcano Engine alone holding a 49.5% share -- evidence that
              usage is scaling far faster than any settled revenue pool. A regulatory-scale lens shows 868 nationally
              registered generative-AI services as of April 30, 2026, growing by 72 in just two months, while a
              global-share lens (Nikkei, via TrendForce) found Chinese open-source models jumped from about 1% to 15% of
              global usage share in a single year. Usefully, IDC's own China foundation-model tracker (CHC5530125)
              independently lists StepFun's 'Step Reasoner mini' alongside Qwen3-Max, DeepSeek, Kimi K2, and GLM-4.6 as
              one of the frontier models it follows, and separately sets national targets of 70% smart-device/agent
              penetration by 2027 and 90% by 2030, with 80% of China's top-1,000 enterprises expected to prioritize AI
              sovereignty by 2027. None of these lenses can be added together into a single number; taken together they
              show a fast-growing, usage-rich, but still commercially unsettled market.
