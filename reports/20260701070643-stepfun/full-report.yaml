      - number: '8.2'
        title: 'Price context: stretched versus public benchmarks, mid-pack versus its own Chinese AI-tiger peers'
        blocks:
          - type: paragraph
            body: >-
              The most useful lens here is not one multiple but a stack of them across a genuine peer set. Zhipu AI, the
              first Chinese large-model company to list in Hong Kong (January 8, 2026), reported FY2025 revenue of
              RMB724 million against a net loss of RMB4.72 billion; on a mid-2026 market value of roughly HK$495.8
              billion, that implies a static price-to-sales ratio near 576x -- an outlier even against the 20-40x
              ceiling independent analysis treats as extreme for top-tier global SaaS. MiniMax, listed one day later,
              reported $79 million of FY2025 revenue at a 25.4% gross margin and now trades near a $16.8 billion market
              cap, more than two-thirds below its 52-week high, implying roughly 212x revenue. Moonshot AI's private
              valuation rose from $4.3 billion to $20 billion in five months on the back of $200 million of annualized
              recurring revenue, near 100x ARR; DeepSeek's first external round priced it above $50 billion with no
              disclosed revenue metric at all; Baichuan Intelligence, pursuing a narrower healthcare-AI pivot, sits near
              $2.7-2.8 billion, the low end of this comparable set.


              Against that backdrop, StepFun's implied 57-68x forward multiple is stretched relative to Palantir's
              ~53.5x public-market benchmark, but it is not the richest mark in its own comp set -- Zhipu and MiniMax
              both trade far higher on a revenue-multiple basis, propped up in part by thin free float, Hang Seng Tech
              Index inclusion flows, and cornerstone lock-up mechanics rather than by audited margin or cash-generation
              evidence. StepFun's own pricing therefore looks defensible only if the 2026 revenue projection holds and
              the deal prices toward $10 billion rather than $12 billion.
