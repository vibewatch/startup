      - number: '3.2'
        title: 'Competitor profiles: scale, funding, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              Zhipu AI, rebranded internationally as Z.ai, became the first listed large language model company via a
              January 2026 Hong Kong IPO; its FY2025 annual report showed revenue of roughly CNY 724 million (about $105
              million, up 131.9% year over year) against a net loss of about CNY 4.72 billion, with its market
              capitalization trading above HK$400 billion by mid-2026. Its GLM-5 flagship is a 744-billion-parameter MoE
              model released under an MIT license and trained end-to-end on Huawei Ascend silicon, positioning Zhipu as
              the export-control-resilient choice for state-linked and enterprise buyers. Moonshot AI, maker of the Kimi
              model family, raised about $2 billion in May 2026 at a $20 billion valuation -- up from $4.3 billion at
              the end of 2025 -- led by Meituan's Long-Z Investments; its Kimi K2.6/K2.5 models compete on long-context,
              agent-swarm coordination, and are embedded in Cursor Composer 2, a Western developer tool. MiniMax listed
              in Hong Kong the same January 2026 window, raising about $619 million at a roughly $6.5 billion valuation
              with GIC, Baillie Gifford, and the Abu Dhabi Investment Authority as cornerstone investors, and ships a
              self-evolving agentic M-series (M2-M2.7).


              Baichuan Intelligence took a different path, pivoting from a broader platform strategy to vertical
              healthcare AI -- disbanding its finance and education teams to focus on models like Baichuan-M2, an
              open-source medical LLM that scored above OpenAI's gpt-oss-120b on the HealthBench benchmark -- while
              retaining backing from Alibaba, Tencent, Xiaomi, and multiple state-backed investment funds. DeepSeek, a
              High-Flyer hedge-fund spinout, operated with zero external investors until a June 2026 round that raised
              over CNY 50 billion (about $7.4 billion) at a valuation above CNY 330 billion, structured so most outside
              investors get no voting rights while the National AI Industry Investment Fund invested directly with full
              voting rights. Alibaba's Qwen, Baidu's ERNIE, and ByteDance's Doubao/Seed round out the big-tech-embedded
              tier: Qwen3.6-Plus is wired into Alibaba's Wukong enterprise platform and consumer Qwen App; ERNIE 5.1
              (not open-sourced, unlike ERNIE 4.5) claims 4th globally on the Arena Search leaderboard at about 6% of
              peer training cost; and Doubao/Seed 2.0 is ByteDance's consumer-first flagship with no separately
              disclosed funding round of its own.
