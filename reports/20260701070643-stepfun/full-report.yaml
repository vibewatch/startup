              shipped features to StepFun: 科创板日报 reported that OPPO's Find X8 Ultra flagship's 'one-tap memory capture'
              feature runs on StepFun's multimodal technology, Honor gave StepFun a 'Best Collaboration Award' for
              powering the Magic8 series' YOYO assistant memory feature, and ZTE co-launched an elder-care voice
              assistant with StepFun in July 2025 while its Nubia Z80 Ultra phone became the first device to natively
