  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Consumer app and developer ecosystem: broad reach, weak independent measurement'
        blocks:
          - type: paragraph
            body: >-
              StepFun's most direct customer relationships sit at the two ends of its distribution stack: the
              free-to-use Yuewen (跃问) consumer app and the open-weight developer ecosystem built around Hugging Face and
              GitHub. Neither shows strong independently-measured traction on its own. Yuewen's Google Play listing
              carries only 58 reviews at a 4.2 rating as of its May 2026 update, and multiple named reviewers complain
              that the app blocks Google, email, or social login and only accepts a phone number -- friction serious
              enough that one reviewer reports being unable to chat or copy text at all without providing one.
              Independently, AICPB's April 2026 China AI app ranking lists more than two dozen apps by monthly active
              users, from ByteDance's Doubao at 336 million down to under a million for the smallest ranked entry, and
              Yuewen does not appear anywhere on that list. The developer side looks healthier by comparison: the
              stepfun-ai Hugging Face organization shows individual open-weight model variants with download counts in
              the hundreds of thousands, and the stepfun-ai GitHub organization maintains active repositories, including
              a vLLM fork, with ongoing commit activity through June 2026. Step 3.7 Flash was also one of five major new
              models OpenRouter listed in a ten-day window ending June 4, 2026, alongside frontier releases from
              Anthropic and others, indicating the model remains commercially current on third-party marketplaces. None
              of this developer signal, however, distinguishes paying API accounts from free experimentation, and no
              source reviewed for this chapter discloses a developer-to-paid conversion rate.
            claimRefs:
