  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: peer startups, big-tech-embedded models, and adjacent entrants'
        blocks:
          - type: paragraph
            body: >-
              StepFun's real competitive set is broader than the "Six AI Tigers" framing chapter 1 uses to describe its
              founding cohort. By Q2 2026 the Chinese foundation-model field has consolidated to roughly ten providers
              with meaningful public usage share -- Xiaomi, Alibaba (Qwen), Zhipu AI (rebranded internationally as
              Z.ai), DeepSeek, Moonshot AI, MiniMax, StepFun, ByteDance, Baidu, and Tencent -- with a longer tail of
              vertical or niche players (Baichuan Intelligence, Yi, Xunfei, KwaiKAT) behind them. Inside that set,
              StepFun sits alongside Zhipu AI, Moonshot AI, MiniMax, and Baichuan Intelligence as a venture-funded,
              pure-play foundation-model startup, distinct from big-tech-embedded programs -- Alibaba's Qwen, Baidu's
              ERNIE, and ByteDance's Doubao/Seed -- that ride an existing cloud, search, or consumer-app distribution
              stack, and distinct again from DeepSeek, which is investor-independent (High-Flyer-funded) until its first
              external round in mid-2026.


              Two adjacent classes matter as much as the named peer set. First, Xiaomi's MiMo model family is not one of
              StepFun's traditionally cited peers, yet it alone commands roughly 21% of weekly Chinese-provider
              OpenRouter token volume in Q2 2026 -- more than any single pure-play startup -- showing that a device
              incumbent can out-distribute every funded AI lab purely through smartphone and developer-tooling bundling,
              the same channel StepFun is trying to use as its own wedge. Second, internal build or reliance on blocked
              or export-controlled overseas frontier APIs remains a status-quo substitute for some regulated Chinese
              buyers, but data-localization rules and chip export controls push most domestic demand toward the
              ten-provider Chinese set profiled in this chapter.
