        title: 'Retention and durability: no disclosed metric in any customer segment'
        blocks:
          - type: paragraph
            body: >-
              No source reviewed for this chapter discloses net revenue retention, gross revenue retention, renewal
              rate, or churn for any StepFun customer segment -- device, automotive, developer, or enterprise. The
              closest available proxy is a StepFun-sourced claim that terminal Agent API call volume grew nearly 170%
              quarter-on-quarter for three consecutive quarters through late 2025, but this figure has no disclosed
              absolute base, is not corroborated by an independent analytics provider, and measures call volume rather
              than customer retention. On the consumer side, the Yuewen app's thin, mixed Google Play review base (58
              reviews, 4.2 rating, with recurring login-friction complaints) is the only publicly visible satisfaction
              signal, and it is too small a sample to generalize about retention. Contract-level detail is equally
              absent: no source specifies a contract length, renewal date, or minimum-volume commitment for any named
              OEM, automotive, or enterprise relationship, which means it is impossible to tell whether StepFun's device
              and vehicle partnerships are durable multi-year commitments or agreements that could lapse or be
              renegotiated on short notice. This chapter treats retention, paying-customer count, and contract-term
