      - number: '5.3'
        title: Customer workflows, deployment footprint, and release roadmap
        blocks:
          - type: paragraph
            body: >-
              StepFun's most concrete efficiency pitch is agentic coding economics: Step 3.7 Flash's Advisor Mode is
              claimed to run an agent task for about $0.19 versus roughly $1.76 for a larger advisor model, a claim
              StepFun itself frames as an internal scaffold benchmark rather than an independently audited comparison.
              Beyond coding, the model line covers enterprise document/screenshot parsing (native multimodal
              perception), web/visual search-augmented question answering, end-to-end conversational voice agents via
              Step-Audio 2, and GUI-driven desktop automation via the STEP-GUI framework. Deployment is genuinely
              flexible on paper: Step 3.7 Flash ships for cloud, data-center, and local use, is integrated with vLLM,
              SGLang, Hugging Face Transformers, llama.cpp, the NVIDIA NeMo ecosystem, and NVIDIA NIM, and is available
              at release on StepFun's own platform, OpenRouter, and NVIDIA NIM (with DeepInfra, Fireworks AI, and Modal
              announced as forthcoming). Standard API access is rate-limited on a five-tier ladder (V0 through V5) gated
              by cumulative account recharge rather than a fixed developer plan, separate from a newer subscription
              'Step Plan.' Genuinely local deployment, however, has a real hardware floor: even the smallest published
              quantization needs at least 128GB of unified memory, which rules out ordinary consumer laptops and
              confines local runs to workstation-class hardware such as DGX Spark, Mac Studio M4 Max, or AMD Ryzen AI
              Max+ 395 systems. StepFun's release cadence across 2025-2026 -- Step-Audio 2 and Step-3's technical papers
              in July 2025, open-sourced Step-Audio 2 mini variants and a vLLM backend that August-September, Step 3.5
              Flash in February 2026, and Step 3.7 Flash in May 2026 -- shows a major model-family update roughly every
              one to three months, with Step-Audio 2 also distributed as a standard pip-installable PyPI package
              alongside its GitHub source.
