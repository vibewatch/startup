  - id: FU001
    title: 'StepFun customer journey map: segments, adoption surfaces, and expansion loops'
    type: journey-map
    layout: wide
    summary: >-
      Maps how StepFun distributes through five customer surfaces, from free open-weight/API access to device-embedded
      and vertical production deployments.
    data:
      items:
        - label: Consumer (Yuewen app)
          detail: Free chat/document/creative app; weak independent MAU signal
        - label: Developer / open-source
          detail: Hugging Face + GitHub self-serve access, tiered paid API
        - label: OEM smartphone (OPPO, Honor, ZTE)
          detail: Negotiated integration into flagship on-device features
        - label: Automotive (Geely / Qianli)
          detail: AgentOS cockpit co-developed and mass-produced in Galaxy M9
        - label: Enterprise vertical (Huanxi Media, SUMG, Zhiyuan Robotics)
          detail: Framework agreements / named partnerships in media, news, robotics
        - label: Awareness stage
          detail: Open-weight release on Hugging Face/GitHub; WAIC/Step Up ecosystem events
        - label: Trial stage
          detail: Free-tier API key or app download; developer experimentation
        - label: Negotiated integration stage
          detail: OEM/automotive/enterprise partnership agreement (framework or commercial)
        - label: Production deployment stage
          detail: Shipped feature in a named device, vehicle, or JV product
        - label: Expansion loop stage
          detail: >-
            Cross-sell into adjacent verticals (phones -> cars -> robotics/media) and developer ecosystem funding
            (Starlight Program)
    approximationNotes: >-
      Journey stages are qualitatively reconstructed from public announcements; no StepFun-disclosed conversion funnel
      exists between stages.
    claimRefs:
      - CU021
      - CU024
      - CU025
      - CU026
      - CU007
      - CU028
      - CU029
