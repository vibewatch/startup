      - number: '1.5'
        title: Adverse signals -- regulatory restructuring, disclosure gaps, and IPO execution risk
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse thread in StepFun's chapter-one record is regulatory rather than reputational.
              Reuters reported on April 13, 2026 that StepFun was unwinding its offshore "red-chip" incorporation
              structure after China's securities regulator instructed some red-chip companies to re-domicile before
              pursuing overseas listings, and that StepFun -- heavily backed by state capital -- judged an onshore
              structure more appropriate. BigGo Finance's analysis, and Reuters' own reporting that roughly a fifth of a
              recent cohort of approved Hong Kong listings involved offshore holdings, frame this as a sector-wide
              compliance wave that can delay listings or, in some cases, cause companies to abandon IPO plans given the
              cost of changing legal structure. Layered on top of that timing risk is a valuation-support question:
              BigGo Finance's compiled figures put StepFun's 2025 revenue at roughly CNY 500 million (about $73.3
              million) against a Hong Kong IPO filed at a $10-12 billion target valuation -- a gap this chapter treats
              as an explicit diligence flag rather than a resolved fact, since the revenue figures come from secondary
              market reporting rather than an audited filing. Finally, the same opacity that limits leadership
              visibility (section 2) extends to ownership: reviewed public sources do not disclose a full board roster
              or cap table, which is notable for a company converting to a joint-stock structure and courting
              public-market capital within months of that conversion.
