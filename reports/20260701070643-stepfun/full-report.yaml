      - number: '5.4'
        title: Benchmark credibility and competitive positioning
        blocks:
          - type: paragraph
            body: >-
              StepFun's own release material is unusually explicit that some of its headline comparisons are
              vendor-stated rather than independently reproduced: its Step 3.7 Flash benchmark chart notes that a
              rival's Terminal-Bench 2.1 score came from StepFun's own internal testing while other vendors' figures are
              their own reported results on a different benchmark version (Terminal-Bench 2.0), and it leads with the
              higher, contamination-flagged 76.5% SWE-Bench Verified score even though the more contamination-resistant
              SWE-Bench Pro figure (56.3%, good for 15th of 35 tracked models) is the cleaner signal per independent
              analysis. Independent hands-on testing on an NVIDIA DGX Spark did report a genuine positive: a 100%
              tool-call success rate across a multi-step evaluation suite, consistent with (though not proof of) the
              model's first-place 67.1 ClawEval-1.1 score. But a broader, vendor-neutral aggregator (Crafiq) ranks Step
              3.7 Flash a comparatively modest #108 overall on intelligence and #89 on coding -- a useful corrective to
              the narrower agentic-benchmark framing StepFun's own material emphasizes. StepFun also reports strong
              search-augmented scores (79.2 SimpleVQA-with-tool, 75.82% BrowseComp, 92.82% DeepSearchQA) and
              enterprise-occupation coverage (45.8% GDPval across 44 occupations, 98%+ pass rate on Tau2-bench Telecom
              tiers), and narrowed cross-harness performance variance from 43-73% (Step 3.5 Flash) to 64.5-71.5% on its
              own Step-SWE-Bench -- all still self-measured. Independent review coverage of Step 3.5 Flash's February
              2026 debut, by contrast, generated real Hacker News and local-inference community buzz, and StepFun's
              GitHub organization backs that up with roughly 1,700 followers and 32 public repositories, including a
              2,100+-star Step-3.5-Flash repo and a rapidly-growing Step-3.7-Flash repo.
