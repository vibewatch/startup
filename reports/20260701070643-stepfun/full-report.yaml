    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product/technology architecture
        blocks:
          - type: paragraph
            body: >-
              StepFun is the trade name of Shanghai Jieyue Xingchen Intelligent Technology Co., Ltd, incorporated in
              Shanghai's Xuhui district. Baidu Baike's corporate-registry entry dates founding to April 6, 2023, with
              Jiang Daxin as legal representative and initial registered capital of RMB 20 million; English-language
              coverage, including Wikipedia and Reuters, converges on "April 2023" without the more precise street
              address. Reuters and Wikipedia both name Jiang Daxin -- a former Microsoft global/senior vice president
              who worked on Bing and Microsoft 365 -- as founder, alongside co-founders Zhu Yibo and Jiao Binxing. The
              company's technical identity centers on the "Step" family of multimodal foundation models (language,
              vision, video, audio) and, per MIT Technology Review, an explicit and still-active pursuit of artificial
              general intelligence that many Chinese peers have deprioritized. StepFun's official platform currently
              headlines "Step 3.7 Flash," a production-oriented agentic Flash model, while its consumer chat product
              "跃问" (Yuewen) and a companion app called 冒泡鸭 give it direct-to-user distribution alongside its developer
              API. Press coverage repeatedly places StepFun among China's "Six AI Tigers" (六小虎) together with Zhipu AI,
              MiniMax, Moonshot AI, 01.AI, and Baichuan Intelligence, and describes its strategy -- per a StepFun
              executive quoted by 36Kr -- as closer to "China's xAI plus Tesla" than a pure chat-app play, reflecting
              its emphasis on embedding models into physical terminals rather than cloud subscriptions alone.
