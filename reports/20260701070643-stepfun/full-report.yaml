            body: >-
              StepFun's positive financial case is visible: official pricing spans five-plus monetization surfaces,
              named device and enterprise partners are real, and 2026 registered-capital and Hong Kong entity filings
              confirm active, well-financed listing preparation. The negative case is just as concrete. No source
              reviewed here discloses StepFun's cash on hand, monthly burn, runway, gross margin, or unit economics by
              product line, so capital adequacy and margin quality cannot be independently underwritten. AsiaICT's
              analysis frames the starkest version of the concern: a roughly $10 billion cornerstone valuation target
              against a low-hundreds-of-millions revenue base implies a revenue multiple in the tens of times, and
              StepFun had not filed a formal HKEX Application Proof as of May 20, 2026 despite a widely reported June
              2026 filing plan, adding execution-timing risk on top of the CSRC red-chip unwind already covered in
              Company Overview. The roughly RMB1 billion mid-2025 revenue guidance versus the roughly RMB500 million
              reported 2025 outturn remains unreconciled in every source reviewed, and the 30%-60% device-partner
              revenue-share norm cited in adverse reporting is not quantified for StepFun specifically. Until an audited
              statement or filed prospectus closes these gaps, this chapter's conclusion is cautious: StepFun looks like
              a real, fast-scaling commercial business, but public evidence still supports a research posture rather
              than a clean financial underwrite.
