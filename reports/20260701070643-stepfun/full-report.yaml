              showcased the AgentOS smart-cockpit voice agent with StepFun at WAIC 2025, and the lead vehicle, the Geely
              Galaxy M9, sold roughly 40,000 units in its first three months, with StepFun targeting over one million
              vehicles for 2026. Tencent Cloud has separately announced a strategic partnership to build AI cockpit
              agents on StepFun's models, and Huanxi Media Group signed a Hong-Kong-filed framework agreement --
              confirmed by both the HKEXnews regulatory filing and law firm Wilson Sonsini -- to form a joint venture
              applying StepFun's models to film, TV, and game content. What is consistently missing across every one of
              these relationships is per-account commercial detail: no disclosed unit royalty, contract length, or
              revenue-share figure exists for any single OEM, automotive, or enterprise partner, so this evidence proves
