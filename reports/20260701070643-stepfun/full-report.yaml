  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product line: from Step 3.7 Flash down to open-sourced audio, video, and image tooling'
        blocks:
          - type: paragraph
            body: >-
              StepFun's commercial surface is a single API platform (platform.stepfun.com in China, platform.stepfun.ai
              globally) that meters a family of models rather than one flagship product. The current flagship, Step 3.7
              Flash, is a 198B-parameter sparse Mixture-of-Experts vision-language model (196B language backbone plus a
              1.8B vision encoder) that activates roughly 11B parameters per token, supports a 256K context window, and
              is priced at RMB1.35/RMB0.27 (cache-miss/cache-hit) input and RMB8.1 output per million tokens. Its
              predecessor, Step 3.5 Flash (196B/11B active, 262K context), remains served and ranked #3 on OpenRouter's
              free-model leaderboard shortly after its February 2026 release. Below the Flash tier sits Step-2,
              StepFun's original trillion-parameter MoE model launched at WAIC 2024, and the Step-1V/Step-1.5V
              multimodal line that StepFun has said powers its more-than-40-million embedded smartphone AI features. A
              separate creative-tooling line covers text-to-image and image editing (step-2x-large, step-image-edit-2,
              billed per generated image) and an extensive audio family: Step-Audio 2, an open-source end-to-end
              speech-conversation LLM with retrieval-augmented generation and tool-calling, plus realtime, TTS,
              voice-cloning, and ASR product tiers each billed on their own metering unit, and installable via pip as
              well as GitHub. StepFun also open-sourced Step-Video-T2V, a 30B-parameter text-to-video model, and
              maintains developer-facing tooling beyond the models themselves, including the STEP-GUI GUI-agent
              framework (repository gelab-zero) and Step-Realtime-CLI/Console voice-agent tooling. On the consumer side,
              none of these models carry a separate consumer brand; they sit behind the 阶跃AI (跃问 / Yuewen) chat app and
              embedded device assistants, meaning StepFun's consumer distribution is entirely a reasoning-backend
              relationship rather than a stand-alone product.
