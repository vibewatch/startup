      - number: '6.4'
        title: 'Expansion and concentration risk: a wide device footprint riding on a narrow partner set'
        blocks:
          - type: paragraph
            body: >-
              StepFun's expansion story reads as broad -- phones, cars, cloud, media, robotics -- but the underlying
              distribution depends on a small number of relationships. Three phone OEM groups (OPPO, Honor, ZTE) carry
              the entire 42-million-device, 60%-brand-share headline, and Qianli Technology, StepFun's automotive
              cockpit vehicle, is itself financially exposed: its own IPO prospectus discloses that its top five
              customers took 41.5%-48.1% of revenue between 2022 and mid-2025, with Geely Group alone contributing
              30.8%-39.7%, while Qianli posted net losses in three of the last four disclosed periods. A June 2026 Sina
              Finance report adds that Qianli's controlling group raised 2026 related-party transaction limits over 80%
              year-on-year and approved a roughly 2x-premium acquisition of a related, insolvent radar-sensing company
              without a performance-compensation clause -- governance signals that should concern anyone relying on
              Qianli as StepFun's primary automotive distribution channel. A separate, independent business profile
              notes that StepFun's own chairman also controls Qianli, meaning the two companies sit inside one
              Geely-anchored group rather than being arm's-length counterparties. Tencent compounds this pattern: it is
              simultaneously a multi-round StepFun shareholder and the named commercial partner for AI cockpit agents, a
              structure that makes it harder to confirm the automotive partnership was priced at arm's length.
              Enterprise-vertical diversification (Huanxi Media, Shanghai United Media Group, Zhiyuan Robotics) remains
              at the framework-agreement or early-partnership stage, without a completed joint venture or disclosed
              revenue, so it is not yet a meaningful counterweight to the device/automotive concentration.
