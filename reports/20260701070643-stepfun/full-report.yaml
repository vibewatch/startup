      - number: '7.7'
        title: 'Synthesis: mitigation maturity, monitorable triggers, and where the thesis breaks'
        blocks:
          - type: paragraph
            body: >-
              Read together, StepFun's highest-severity risks cluster in three places: listing-execution risk from the
              CSRC red-chip unwind and stacked 2026 compliance calendar; compute-supply risk from tightening US
              export-control enforcement against a domestic-chip alternative that still trails Nvidia on efficiency and
              software maturity; and a governance/channel risk compounded by an interlocking directorate between
              StepFun's chairman and its sole proven automotive-channel counterparty, Qianli Technology, which is itself
              under real financial strain. None of these risks are individually fatal -- red-chip unwinds have completed
              successfully elsewhere, domestic chips are improving generation over generation, and interlocking
              directorates are common in China's state-linked technology sector -- but their mitigation maturity is
              uniformly low: almost none of the risk items in this chapter's registers have a StepFun-disclosed formal
              mitigation beyond the underlying relationship or restructuring itself. The clearest thesis-break triggers
              are therefore observable from outside the company: CSRC filing closure or an HKEX prospectus
              withdrawal/delay past year-end 2026; Entity List or Pentagon 1260H designation of StepFun, Qianli, or a
              named chip supplier; a documented CAC enforcement action against StepFun specifically; or a
              related-party-transaction disclosure showing non-arm's-length terms between StepFun and Qianli. Each of
              these is a public, monitorable event rather than a private one, which means diligence can track StepFun's
              risk trajectory between report refreshes without relying on company disclosure alone.
