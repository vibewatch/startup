      - number: '7.5'
        title: 'Governance and disclosure risk: an interlocking directorate and no audited baseline'
        blocks:
          - type: paragraph
            body: >-
              StepFun's governance profile carries two compounding gaps. First, its chairman, Yin Qi, concurrently
              chairs Qianli Technology -- the same Geely-linked entity that is StepFun's primary, and only proven,
              automotive distribution counterparty -- meaning the two companies' most important commercial relationship
              is negotiated across an interlocking directorate rather than at arm's length. No board minutes,
              related-party-transaction approval process, or independent-director attestation covering StepFun-Qianli
              dealings was found among the sources reviewed for this chapter. Second, no audited 2025 financial
              statements or filed HKEX prospectus for StepFun were retrievable as of this chapter's run date, leaving
              its reported roughly RMB 500 million 2025 revenue and targeted $10-12 billion valuation without an
              independently verified baseline -- a gap that matters given the scale of the implied revenue multiple.
              StepFun's investor base compounds the transparency question: Reuters reports state-linked capital
              including Shanghai municipal and district investment vehicles, and the 2026 pre-IPO round separately drew
              participation from the Hong Kong Investment Corporation, a fund wholly owned by the Hong Kong government
              whose own disclosure describes a dual mandate of financial return and enhancing Hong Kong's
              competitiveness. That dual mandate is not inherently adverse, but it means StepFun's ownership and
              governance decisions -- including the IPO domicile choice itself -- are shaped in part by public-policy
              objectives that a purely private-capital company would not carry, and the full cap table across StepFun's
              angel-through-pre-IPO rounds remains only partially disclosed via press reporting rather than a primary
              filing.
            claimRefs:
