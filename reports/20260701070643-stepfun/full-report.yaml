  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation turns on a real device-distribution wedge meeting a stretched entry price and a thin public
      disclosure set.
    data:
      nodes:
        - id: distribution
          label: Device & auto distribution
          detail: 40M+ smartphones and 1M+ target Geely vehicles give StepFun a differentiated go-to-market.
          tone: positive
        - id: capital
          label: 2026 financing sprint
          detail: Series B+, ~$2.5B pre-IPO round, and HKIC backing show deep capital access.
          tone: positive
        - id: target
          label: $10-12B IPO target
          detail: Implies ~57-68x forward revenue, stretched versus public benchmarks.
          tone: warning
        - id: disclosure
          label: Thin disclosure
          detail: No audited prospectus, cash, burn, or cap table is public yet.
          tone: warning
        - id: peers
          label: Peer volatility
          detail: Zhipu and MiniMax both swung 40-70%+ post-listing, so pricing at IPO is not price discovery.
          tone: warning
        - id: decision
          label: Research-more
          detail: Track the prospectus and first two post-listing quarters before committing capital.
          tone: neutral
      edges:
        - from: distribution
          to: decision
        - from: capital
          to: target
        - from: target
          to: decision
        - from: disclosure
          to: decision
        - from: peers
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV036
      - CV038
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: StepFun's IPO target only looks comfortable against a narrow band of assumed revenue multiples.
    data:
      items:
        - label: Reported 2025 revenue
          value: 73.3
          detail: Third-party-reported StepFun 2025 revenue (USD millions, Chapter 4).
          tone: neutral
        - label: Reported 2026 revenue projection
          value: 175.9
          detail: Third-party market projection, not company guidance (USD millions).
          tone: neutral
        - label: Revenue needed at 40x for $10B
          value: 250
          detail: USD millions required to support $10B at a 40x ceiling multiple.
          tone: warning
        - label: Revenue needed at 20x for $10B
          value: 500
          detail: USD millions required at 20x, the low end of the extreme-SaaS benchmark cited by 36Kr.
          tone: negative
        - label: Palantir-equivalent revenue at 53.5x for $10B
          value: 187
          detail: USD millions StepFun would need to match Palantir's public P/S ratio at a $10B valuation.
          tone: warning
    approximationNotes: >-
      Revenue thresholds are simple EV/revenue bridges using round-number multiples cited in this chapter's sources;
      they are not discounted cash-flow outputs.
    claimRefs:
      - CV036
      - CV037
      - CV034
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: The plausible valuation range is wide because multiple selection and IPO timing matter as much as revenue growth.
    data:
      items:
        - label: Bear case
          low: 4000
          mid: 5000
          high: 6000
          displayValue: $4B-$6B
          detail: Listing delayed/downsized or revenue guidance missed again; resets toward the pre-IPO pre-money range.
          tone: negative
        - label: Base case
          low: 9000
          mid: 10500
          high: 11500
          displayValue: $9B-$11.5B
          detail: IPO prices near the low-to-mid end of the target range with Zhipu/MiniMax-style post-listing volatility.
          tone: warning
        - label: Bull case
          low: 12000
          mid: 14000
          high: 20000
          displayValue: $12B-$20B
          detail: >-
            Revenue meets or exceeds projection and a further 2027 doubling holds the multiple, approaching Moonshot's
            mark.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based revenue-multiple outputs for investment-committee discussion, not management guidance or
      a priced outcome.
    claimRefs:
      - CV026
      - CV036
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: StepFun scores well on distribution and capital access, but poorly on disclosure quality and valuation support.
    data:
      items:
        - label: Device/auto distribution proof
          score: 8
          detail: 40M+ smartphones and a named 1M+ target vehicle program are real, verifiable deployment signals.
          tone: positive
        - label: Capital access
          score: 8
          detail: Series B+, ~$2.5B pre-IPO round, and HKIC backing show strong and diversifying financing access.
          tone: positive
        - label: Comparable-set positioning
          score: 6
          detail: Implied multiple is mid-pack versus Zhipu, MiniMax, and Moonshot, not the most extreme in the cohort.
          tone: neutral
        - label: Disclosure / evidence quality
          score: 3
          detail: No audited prospectus, cash, burn, margin, or cap table is public yet.
          tone: warning
        - label: Valuation support
          score: 4
          detail: Defensible only if 2026 revenue holds and pricing lands near $10B rather than $12B.
          tone: warning
        - label: Governance / execution risk
          score: 4
          detail: Regulatory red-chip review timing and device-partner revenue-share terms remain open.
          tone: warning
        - label: Peer-precedent price stability
          score: 3
          detail: Zhipu and MiniMax both show 40-70%+ post-listing swings, so IPO pricing is not price discovery.
          tone: warning
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from this chapter's evidence for IC discussion, not a
      vendor-supplied scorecard.
    claimRefs:
      - CV002
      - CV036
      - CV038
      - CV045
      - CV047
