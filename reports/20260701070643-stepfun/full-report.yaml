  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      StepFun monetizes across direct API usage, enterprise deals, device/OEM licensing, and chip-adaptation
      partnerships, but the bridge from list pricing to the roughly RMB500 million reported 2025 revenue still runs
      through undisclosed discount, revenue-share, and cost layers.
    data:
      nodes:
        - id: api
          label: Direct API / token usage
          detail: Official list pricing is public across text, vision, and audio models.
          tone: positive
        - id: enterprise
          label: Enterprise & vertical deals
          detail: Finance, content, and retail cooperation agreements are reported but contract terms are not public.
          tone: positive
        - id: device
          label: Device / OEM licensing
          detail: Phone, automotive, and IoT partnerships reportedly cover over half of leading domestic phone brands.
          tone: positive
        - id: chip
          label: Chip-adaptation licensing
          detail: Step 3 is reportedly licensed to and adapted for multiple domestic chip vendors.
          tone: neutral
        - id: addons
          label: Value-added platform services
          detail: Search and storage add-ons are separately priced but attach rate is unknown.
          tone: neutral
        - id: gross
          label: Gross revenue pool
          detail: All monetization surfaces accumulate before discounts, revenue-share, and partner effects.
          tone: positive
        - id: share
          label: OEM revenue-share & compute cost
          detail: Industry-norm 30%-60% device revenue-share and compute costs likely compress what StepFun retains.
          tone: warning
        - id: retained
          label: Reported 2025 revenue (~RMB500M)
          detail: Public list pricing and partnership counts do not reveal the realized margin behind this figure.
          tone: neutral
      edges:
        - from: api
          to: gross
        - from: enterprise
          to: gross
        - from: device
          to: gross
        - from: chip
          to: gross
        - from: addons
          to: gross
        - from: gross
          to: share
        - from: share
          to: retained
