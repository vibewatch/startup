      - number: '8.4'
        title: 退出准备度和最终尽调：哪些要求会改变本结论
        blocks:
          - type: paragraph
            body: >-
              StepFun 已补齐上市的结构性前置条件——股改、红筹拆除，以及已经纳入国资和产业资本的基石阵容；这类资本曾支撑 Zhipu
              上市后的韧性。上述条件必要，却不足以支撑积极估值结论。证据缺口很具体，也能补齐：经审计招股书披露现金、 烧钱速度、毛利率和分部收入；股权结构表说明本轮后 HKIC、上海国资和产业投资人实际持股；最终 IPO
              定价和募资规模； 以及 StepFun 自身设备和 OEM 收入分成条款，而不是本尽调其他部分引用的行业 30-60% 常态。


              每补上一个缺口，就能关掉一个会打穿投资论点的触发器。若没有新增披露，上市估值定在 $12 billion 或更高，一旦剔除指数资金流影响， 前瞻倍数会超过 Zhipu
              已被拉伸、又受指数推高的基准。若上市后波动达到 Zhipu 和 MiniMax 已经历的幅度，就会确认流动性驱动的重估模式同样适用于
              StepFun；也就是说，任何上市入场价都只能先按临时标记处理。Zhipu、Kimi、MiniMax 到 2026 年中已经出现又一轮 API 降价； 无论 IPO 如何定价，这都给 StepFun 自己按
              token 计价的业务压上毛利天花板。
