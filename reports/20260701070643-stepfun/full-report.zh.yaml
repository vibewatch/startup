      - number: '5.2'
        title: 架构：稀疏 MoE、注意力解耦和国产芯片切口
        blocks:
          - type: paragraph
            body: >-
              Step 3.7 Flash 的成本效率靠细粒度 MoE 路由撑住：围绕该版本的独立技术分析称，45 个语言层中有 42 个是路由 MoE 层，每层有 288 个专家，学习型路由器每个 token 只选前 8
              个——也就是任一 token 只动用约 5.6% 的权重。同一家族中另一个更大的模型 Step-3（321B 总参数 / 38B 激活参数）进一步押注硬件感知效率：其协同设计论文引入 Multi-Matrix
              Factorization Attention（MFA）来压缩 KV-cache，并用 Attention-FFN Disaggregation（AFD）把注意力和 FFN 计算拆到专门子系统；论文声称在
              Hopper 硬件上解码吞吐达到 4,039 tokens/second/GPU，同一测试设置下 DeepSeek-V3 为 2,324——这是 StepFun 自行运行、且对 StepFun
              有利的比较，不是独立基准。StepFun 也试图直接降低算力供应风险：2025 年 7 月，它与约 10 家国产芯片和平台厂商共同发起“模芯生态创新联盟”（包括 Huawei
              Ascend、MetaX、Biren、Enflame、Iluvatar CoreX、Moore Threads、Cambricon 等），并把 Step 3 的 MFA 架构适配到包括 MetaX GPU
              在内的国产加速器上。但截至 2026 年 6 月，行业评论仍把联盟进展描述为集中在硬件适配和基础集成测试，而不是大规模生产部署。产品效率一侧，Step 3.7 Flash 的 Advisor Mode
              把智能体轨迹大部分交给廉价执行器，只在规划或失败恢复拐点升级到更大模型；这是 StepFun 自己落地的一种升级模式，StepFun 将其归因于
              Anthropic。其据称“涌现”的跨工具组合行为（在视觉搜索循环中独立调用 Python 裁剪 / 缩放工具）也只是厂商观察，StepFun 自身尚未交给独立复现。
