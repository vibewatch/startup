        - 正方
        - 经验证的单设备经济性或单元级收入分成条款，会把它从分销故事强化为变现论点。
      - - 2026 年创纪录的融资冲刺（Series B+、约 $2.5B pre-IPO 轮、HKIC 支持）显示资本获取深、来源也在多元化。
