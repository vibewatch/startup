  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：同业创业公司、大厂嵌入式模型和相邻入局者
        blocks:
          - type: paragraph
            body: >-
              StepFun 的真实竞争集比第一章用来描述创始批次的「六小虎」框架更宽。到 2026 年
              Q2，中国基础模型领域已经收敛到约十家拥有可观公开使用份额的供应商——Xiaomi、Alibaba（Qwen）、Zhipu AI（国际上改名为 Z.ai）、DeepSeek、Moonshot
              AI、MiniMax、StepFun、ByteDance、Baidu 和 Tencent——其后还有更长尾的垂直或小众玩家（Baichuan
              Intelligence、Yi、Xunfei、KwaiKAT）。在这组公司里，StepFun 与 Zhipu AI、Moonshot AI、MiniMax、Baichuan Intelligence
              同属风险资本支持的纯基础模型创业公司；这不同于 Alibaba Qwen、Baidu ERNIE、ByteDance Doubao / Seed 等嵌入大厂的项目，后者依托既有云、搜索或消费者应用分发栈；也不同于
              DeepSeek，后者在 2026 年中首次外部融资前一直由 High-Flyer 资助、独立于外部投资人。


              还有两类相邻竞争者和具名同业同样重要。第一，Xiaomi MiMo 模型族并非 StepFun 传统上被拿来比较的同业，但它单独就在 2026 年 Q2 占中国供应商 OpenRouter 周度 token 量约
              21%，超过任何一家纯创业公司；这说明设备巨头仅靠智能手机和开发者工具捆绑，就能在分发上压过所有融资充足的 AI 实验室，而这正是 StepFun
              试图用作自身楔子的渠道。第二，对于部分受监管中国买方而言，内部自建或依赖受阻 / 受出口管制的海外前沿 API 仍是现状替代方案；但数据本地化规则和芯片出口管制，会把大多数国内需求推向本章画像中的十家中国供应商。
