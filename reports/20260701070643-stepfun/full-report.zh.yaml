      - number: '1.5'
        title: 负面信号——监管重组、披露缺口与 IPO 执行风险
        blocks:
          - type: paragraph
            body: >-
              StepFun 第一章记录中最清晰的负面线索不是声誉，而是监管。Reuters 于 2026 年 4 月 13 日报道，中国证券监管机构要求部分红筹公司在赴境外上市前迁回境内后，StepFun
              正在拆除离岸「红筹」注册架构；国资重度支持的 StepFun 也认为境内架构更合适。BigGo Finance 的分析，以及 Reuters
              自身关于近期获批香港上市队列中约五分之一涉及离岸控股的报道，都把这件事放在行业级合规潮里理解：架构调整会拖慢上市，在一些情况下还会因法律结构变更成本太高而让公司放弃
              IPO。时间风险之上，还有估值支撑问题：BigGo Finance 汇编数据将 StepFun 2025 年营收放在约 CNY 500 million（约 $73.3 million），而香港 IPO 目标估值为
              $10-12
              billion；本章把这条差距明确列为尽调警讯，而不是既定结论，因为营收数据来自二级市场报道，不是经审计申报文件。最后，限制领导层可见度的同一种不透明也延伸到所有权：已审阅公开来源没有披露完整董事会名单或股权结构；对于一家刚改制为股份有限公司、数月内就寻求公开市场资本的公司，这一点尤其值得注意。
