      - number: '2.4'
        title: 四个界面的买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              StepFun 的买方地图不是一条漏斗，而至少是四条并行路径。个人消费者为其消费者聊天和语音应用自付费，或使用免费层。开发者和 agent 构建者直接在 platform.stepfun.com
              上按使用量计费；StepFun 2026 年 3 月推出的 Step Plan 订阅从标准版 RMB 49 到 RMB 699 / 月分四档，并长期给予开发者社区折扣，明显是为 OpenClaw-agent 和
              AI coding 工作流设计。独立的使用量证据也支撑这一段牵引力：OpenRouter 真实调用排行榜显示，Step 3.5 Flash（free）在 2026 年 3 月 9-15 日当周以 1.34
              trillion tokens 位居全球第二，环比增长 79%。智能手机和汽车 OEM 是第三类、结构完全不同的买方：采用触发点是旗舰产品周期或联合展示，例如 Galaxy M9 在 WAIC 2025
              亮相，而不是自助试用；因此这一渠道依赖少数高价值关系，而不是广泛转化。第四类买方是企业或受监管部署方，上线前必须通过 CAC 备案和内容标识要求；IDC 自己的中国 AI agent market-glance
              显示，这类买方分布在多种职能（金融、HR、客服、供应链）和行业（FSI、制造、汽车、零售）中，没有单一企业垂直领域主导机会。同一开发者细分也很拥挤：IDC 追踪的中国 AI coding IDE
              竞争者至少十余家，包括 Alibaba Qoder、ByteDance Trae、Baidu Comate、Tencent Codebuddy 等；即便 IDC 预计到 2027 年中国 35% 专业开发者会采用
              AI-native coding 平台，2025 年头部厂商 coding 收入在三位数使用量增长下仍低于 RMB 100 million，StepFun 自身份额还未计算在内。
