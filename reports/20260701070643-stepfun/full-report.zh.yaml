      - number: '1.4'
        title: 商业化里程碑——模型、合作与规模
        blocks:
          - type: paragraph
            body: >-
              StepFun 的产品节奏从一开始就很快：Chinese Wikipedia 和 KrASIA 都把约 100-billion 参数的 Step-1 发布时间放在 2023 年 8
              月，也就是公司成立数月后；随后是 2023 年 11 月的多模态 Step-1V，以及 2024 年 3 月万亿参数 Step-2 Mixture-of-Experts 预览。在 2024 年 7 月 WAIC
              上，StepFun 正式发布 Step-2、Step-1.5V 多模态模型和 Step-1X 图像生成器。2025 年 2 月，公司开源与 Geely 共同开发的 Step-Video-T2V 和
              Step-Audio；到 WAIC 2025，这段汽车合作已经成熟为双方联合展示 Galaxy M9。BusinessWire 称，Galaxy M9 是全球首款搭载「类人 AI agent」的车型，由
              StepFun 端到端语音模型和双方共建的 Agent OS 智能座舱系统驱动。StepFun 于 2025 年 7 月 31 日开源旗舰 Step 3（总参数 321 billion、激活参数 38
              billion，Apache 2.0）；技术论文描述了 Multi-Matrix Factorization Attention 和 Attention-FFN Disaggregation，旨在相对
              DeepSeek-V3 和 Qwen3 MoE 235B 降低解码成本。2026 年 2 月，公司继续开源 Step 3.5 Flash（196B / 11B active，256k
              context）。Reuters 报道，Step 3.5 Flash 此后已跻身 OpenClaw agent 平台使用量前三。部署侧，FAQ.com.tw 和 BigGo Finance 均称 StepFun
              模型已为超过 40 million 部智能手机（OPPO、Honor、ZTE）提供 AI 功能，并瞄准超过 1 million 辆 Geely 汽车，服务估计 20 million 日活用户。
