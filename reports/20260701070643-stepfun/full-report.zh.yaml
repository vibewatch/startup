        title: 消费应用和开发者生态：触达广，但独立测量弱
        blocks:
          - type: paragraph
            body: >-
              StepFun 最直接的客户关系位于分发栈两端：免费使用的 Yuewen（跃问）消费应用，以及围绕 Hugging Face 和 GitHub
              搭建的开放权重开发者生态。两者单独看，都没有显示出强独立测量牵引力。Yuewen 的 Google Play 页面截至 2026 年 5 月更新时只有 58 条评论、评分 4.2，多名具名评论者抱怨应用拦住
              Google、邮箱或社交登录，只接受手机号——这种摩擦足够严重，以至于有评论者称不提供手机号就完全无法聊天或复制文本。另一个独立信号是，AICPB 2026 年 4 月中国 AI 应用月活榜列出二十多款应用，从
              ByteDance 的 Doubao 336 million MAU 一直到最小上榜应用低于 1 million，Yuewen 没有出现在榜单任何位置。相比之下，开发者侧更健康：stepfun-ai 的
              Hugging Face 组织下，个别开放权重模型变体下载量达到几十万；stepfun-ai GitHub 组织维护活跃仓库，包括一个 vLLM fork，且提交活动延续到 2026 年 6 月。Step 3.7
              Flash 也是 OpenRouter 截至 2026 年 6 月 4 日的十天窗口内列出的五个主要新模型之一，与 Anthropic
              等前沿发布并列，说明该模型在第三方市场上仍具商业时效性。但这些开发者信号都无法区分付费 API 账户和免费试用，本章审阅的来源也没有披露开发者到付费的转化率。
