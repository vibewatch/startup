      - number: '8.2'
        title: 价格背景：相对公开基准偏高，相对中国 AI 虎同伴处于中游
        blocks:
          - type: paragraph
            body: >-
              这里最有用的视角不是单个倍数，而是把一组真实可比公司叠起来看。Zhipu AI 是第一家在香港上市的中国大模型公司（2026 年 1 月 8 日），披露 FY2025 收入 RMB724 million、净亏损
              RMB4.72 billion；按 2026 年中约 HK$495.8 billion 的市值计算，静态市销率约 576x——即便相对独立分析认为全球顶级 SaaS 极端区间为 20-40x
              的上沿，这也是离群值。MiniMax 晚一天上市，披露 FY2025 收入 $79 million、毛利率 25.4%，当前市值约 $16.8 billion，较 52 周高点跌去超过三分之二，隐含约 212x
              收入。Moonshot AI 私募估值在五个月内从 $4.3 billion 升至 $20 billion，背后是 $200 million 年化经常性收入，接近 100x ARR；DeepSeek
              首轮外部融资把估值定在 $50 billion 以上，却完全没有披露收入指标；Baichuan Intelligence 正转向更窄的医疗 AI，估值约 $2.7-2.8 billion，处在这组可比公司的低端。


              放在这一背景下，StepFun 隐含 57-68x 远期倍数相对 Palantir 约 ~53.5x 的公开市场基准偏高，但并不是自己可比组中最贵的定价——Zhipu 和 MiniMax
              按收入倍数都高得多，其中一部分由稀薄自由流通盘、Hang Seng Tech Index 纳入资金和基石锁定机制托住，而不是由审计利润率或现金生成证据托住。因此，StepFun 自身定价只有在 2026
              年收入预测兑现、且交易按 $10 billion 而非 $12 billion 附近定价时，才看起来可辩护。
