      - number: '5.5'
        title: 信任、安全、安保和合规
        blocks:
          - type: paragraph
            body: >-
              StepFun 的开放权重版本（Step 3.7 Flash、Step 3.5 Flash、Step-Audio 2、Step-Video-T2V、Step1X-Edit）一贯采用宽松的 Apache 2.0
              许可证分发；相较完全闭源的竞争对手，这是真实的信任和透明度加分项。但与之相对，本章审阅的公开记录仍有多项信任缺口未被说明。中国《人工智能生成合成内容标识办法》自 2025 年 3 月发布起生效，要求对 AI
              生成的音频、图像和视频内容做显式与技术性（水印 / 元数据）标识——这项义务正好覆盖 Step-Audio 的语音克隆 / TTS 输出，以及 step-2x-large/step-image-edit-2
              图像模型；但已审阅来源没有描述 StepFun 专属的标识或水印实现。另一个问题是，中国主管机构（CNCERT/CC、工信部和国家计算机病毒应急处理中心）已警示 OpenClaw
              智能体平台上存在夹带木马的仿冒技能包——StepFun 自己的发布材料也把同一生态列为 Step 3.5 和 Step 3.7 Flash 支持且排名靠前的集成——但没有披露 StepFun
              专属的技能验证或沙箱控制。platform.stepfun.com API 服务未披露独立 SOC 2、ISO 27001 或同类安全认证；唯一可得的可靠性信号是一个声誉较低的众包可用性监测器（截至 2026 年
              7 月 1 日运行正常，30 天内有 26 条问题报告），而不是 StepFun 发布的 SLA 或事故复盘。最后，Step-Audio 2 声称相对其他开源和商业音频模型达到最先进基准表现，但整个比较由
              StepFun 团队撰写，并非独立评估者。
