      - number: '4.4'
        title: 成本结构与资本强度：国产芯片联盟并未消除算力账单
        blocks:
          - type: paragraph
            body: >-
              StepFun 公开成本叙事围绕算力，而不是面向客户的基础设施。2025 年 7 月，StepFun 与约十家国产芯片和 AI 基础设施厂商共同发起 Model-Chip Ecosystem Innovation
              Alliance，成员包括 Huawei Ascend、MetaX、Biren、Enflame、Iluvatar CoreX、Moore Threads 和 Cambricon，明确目标是降低对海外 GPU
              的依赖；StepFun 称其 Step 3 模型在国产芯片上的推理吞吐最高约为 DeepSeek-R1 的 3x，在 Nvidia Hopper 硬件上相对 DeepSeek-R1 也有 70%+ 吞吐提升。但到
              2026 年 6 月，Baidu Baike 汇总的行业评论称，该联盟进展仍集中在硬件适配和基础集成测试，距离大规模部署或 Nvidia
              平台已具备的广泛开发者生态仍进展有限。关键在于，无论芯片来自哪里，前沿推理都很贵：独立分析师数据把全球 hyperscaler 单季 AI capex 放在 $130 billion 以上，预计 2026
              年云服务商合计 capex 超过 $520 billion；单张 H100 GPU 价格为 $25,000-$40,000，B200 为 $30,000-$70,000；以 GPU
              为抵押的资产支持融资，也越来越常见地用于在不稀释股权的情况下资助 100-10,000 GPU 部署。对照 36Kr 估计的中国大模型市场——2024 年不足 RMB30 billion，到 2026 年增长至
