      - number: '7.4'
        title: 客户集中和渠道风险：设备足迹压在财务脆弱的汽车伙伴上
        blocks:
          - type: paragraph
            body: >-
              StepFun 最清晰的设备相邻证明点——与 OPPO、Honor、ZTE 的智能手机嵌入，以及与 Geely 的汽车座舱 AI——也构成最窄的渠道依赖。智能手机侧，三家 OEM 集团据称承载了 StepFun
              全部约 4200 万台设备分发叙事；OPPO 自己的公开合规声明只承诺其 60 多个国家的一般法律和数据保护合规，没有披露任何 StepFun 专属服务级条款。汽车侧，渠道完全通过 Qianli
              Technology 运行；这家 Geely 关联的汽车 AI 载体也由 StepFun 董事长 Yin Qi 担任董事长。Qianli 2025 年年报显示，对 Geely 关联公司的销售占总收入
              29.26%（2022-2025 年区间为 30.8%-39.7%）；其股东于 2025 年 12 月 31 日以超过 99% 赞成票批准 2025-2026 年与 Geely 实体的关联交易上限。2025 年
              6 月 cninfo 文件显示，Qianli、Geely、Megvii 关联的 Yin Qi 实体和重庆国资基金共同搭建一家智能驾驶合资公司，承诺资本 RMB 1.5
              billion，这进一步加深而非分散了关系。关键是，Qianli 自己的 2026 年二季度招股书更新显示，尽管 2025 年收入增长
              42.1%，其扣除非经常性损益后的核心净利润已连续三年为负，汽车业务毛利率只有 2.8%，母公司累计未弥补亏损接近 RMB 948 million——也就是说，承载 StepFun
              汽车证明的渠道本身正处在真实财务压力下。StepFun 对智能手机集中度的并行对冲，是“模芯生态创新联盟”和具国资关联的资本基础（上海市 / 区基金和 Hong Kong Investment
              Corporation），但这些都无法降低汽车收入对 Qianli 的单点依赖。
