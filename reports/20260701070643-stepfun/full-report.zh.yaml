      - number: '7.2'
        title: 算力和供应链风险：出口管制收紧，国产芯片栈仍落后
        blocks:
          - type: paragraph
            body: >-
              StepFun 的第二个结构性风险在上游，也就是支撑其持续训练前沿竞争力模型所需的算力。2026 年 5 月 31
              日，美国商务部工业与安全局（BIS）堵上了一个漏洞：此前中国总部企业可通过新加坡、马来西亚和台湾的海外子公司无出口许可证购买先进 Nvidia/AMD 芯片；新规依托自 2023 年 11
              月起技术上已生效的“最终母公司”测试，也让此类交易产生追溯合规风险。Tech Times 报道称，Trump 政府官员 2026 年 6 月内部对该漏洞是否源自 2025 年停止执行 Biden 时代 AI
              Diffusion Rule 后的意外政策空档意见不一。同月，BIS 又把数十家与中国军工复合体相关、从事先进 AI 和高性能芯片开发的中国实体加入 Entity List；同时 CNBC 报道，美国暂缓正式将
              DeepSeek、CXMT 及 100 多家其他被标记公司列入黑名单，以避免加剧与北京的紧张关系——五角大楼 2026 年 6 月更新的“1260H 清单”也加入了 Alibaba、Baidu 和
              BYD。截至本章运行日期，没有已审阅来源显示 StepFun 直接出现在任一清单上，但两份名单快速扩张，给任何有国资背景的中国 AI 独角兽都释放了邻近风险信号。StepFun 自己的对冲，是 2025 年 7
              月与约 10 家国产芯片厂商共同发起的“模芯生态创新联盟”，成员包括 Huawei Ascend、MetaX、Biren、Enflame、Iluvatar CoreX 和 Moore Threads；Huawei
              最新 Ascend 950PR 的推理吞吐约为 Nvidia 出口获批 H20 的 2.8 倍，但功耗高约 200W。独立分析认为，国产栈在单芯片效率和 CUDA 生态成熟度上仍落后于 Nvidia
              Blackwell 级芯片，只能用集群规模聚合来补偿，功耗接近 4 倍。两类风险之下还有前沿 AI 本身的资本强度：2026 年，一个 100 到 10,000 GPU 集群需要 $5 million 到超过
              $500 million 前期投入；计入网络、电力、冷却和人员后，硬件本身只占五年总拥有成本约 35%——这是一道 StepFun 必须在远大于自身的竞争对手面前跨过的资本门槛。
