      - number: '1.2'
        title: 领导层、治理和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              StepFun 公开可见的领导层比同阶段不少同行更完整，但治理缺口仍然存在。KrASIA 的公司画像列出四位技术负责人：创始人兼 CEO Jiang Daxin；CTO Zhu Yibo，曾负责
              ByteDance AI 基础设施和大集群运营；数据负责人 Jiao Binxing，曾任 Microsoft Bing 核心搜索团队负责人；首席科学家 Zhang Xiangyu，是 ResNet
              架构核心作者之一。2026 年 1 月 26 日，StepFun 宣布任命 Yin Qi 为董事长，负责整体战略和技术方向；Yin Qi 是 Megvii（Face++）联合创始人、前 CEO，也是 Geely
              关联智能驾驶公司 Qianli Technology 的现任董事长。Gasgoo 报道称，Yin Qi 的双重角色明确要把 StepFun 的模型研发接入真实硬件部署数据，形成「Physical
              AI」反馈回路，而不是只担任顾问型董事长。The Standard 引述对 Jiang Daxin 的采访称，StepFun 团队已超过 500 人，其中约 80% 从事算法和技术岗位；这比 Chinese
              Wikipedia 较早时期所述约 150 人团队明显扩大。公开记录缺少的是完整现任董事会名单、委员会结构以及股权 / 所有权拆分；考虑到 StepFun 的资本基础高度关联国资，而 Jiang 和 Yin
              的战略影响力又很集中，这些缺口很关键。
