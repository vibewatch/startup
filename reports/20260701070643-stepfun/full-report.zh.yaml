      - number: '3.3'
        title: 比较维度：能力、定价、分发和信任姿态
        blocks:
          - type: paragraph
            body: >-
              原始能力上，独立的 2026 年 7 月 benchmark 跟踪把 Qwen3.7 Max 和 GLM-5.2 放在中国模型排行榜首位（各 90 分），DeepSeek V4 Pro Max 以 87
              分紧随其后，Kimi K2.6 为 81 分；StepFun 的模型虽然凭 Step 3.5 Flash 在 OpenRouter 免费模型榜 #3
              的排名成为真实的「惊喜选手」，但没有出现在该榜单全国前五中国模型中。定价上，StepFun 自己的 step-3.7-flash（每 million tokens CNY 0.27 cache-hit /
              1.35 standard input / 8.1 output）和 step-3.5-flash（0.14 / 0.7 / 2.1）处在与 DeepSeek、Qwen、Kimi 各档类似的 CNY
              计价宽区间里；但 2026 年 API 价格战几乎完全由其他实验室驱动：DeepSeek、Xiaomi MiMo 和 Moonshot Kimi 都宣布 2026 年降价永久化，DeepSeek V4-Pro
              现在 output 价格为 $0.87（约比 GPT-5.5 低 34x），Kimi K2.6 则以 $0.07 保住市场最低 cache-hit 底价。


              分发能力比价格分化更尖锐。ByteDance Doubao 是中国使用量最高的消费者 AI 应用，MAU 达 336-345 million；Alibaba 的 Qianwen 和 Quark 应用合计约 380
              million；Baidu 的 ERNIE 驱动助手（Wenxiaoyan）月活约 200 million、注册用户超过 300 million；即便 DeepSeek 自有消费者应用也以约 139
              million MAU 位列全国 #4。相比之下，Kimi 消费者应用以约 25 million MAU 排第 8，StepFun 的 Yuewen 根本没有进入中国 AI 应用 MAU 前
              50。信任和硬件姿态上，GLM-5（Huawei Ascend）和 Baidu ERNIE（Baidu Kunlun）在国产硬件独立性上领先，这对受出口管制敏感的买方尤其相关；StepFun 则在 NVIDIA
              Hopper 上训练，这与行业大多数玩家相同，但不是差异化。由于这些 API 大多兼容 OpenAI，且数家提供宽松许可的开放权重，企业和开发者买方可以多供应商并用或切换供应商，技术摩擦相对较低；因此，包括
              StepFun 在内，任何单一供应商都难以仅靠定价或模型质量榨出太多锁定效应。
