  - id: FU001
    title: StepFun 客户旅程图：细分客群、采用触点与扩张循环
    type: journey-map
    layout: wide
    summary: 展示 StepFun 如何通过五类客户触点分发：从免费开放权重 / API 访问，到设备嵌入和垂直行业生产部署。
    data:
      items:
        - label: 消费者（Yuewen 应用）
          detail: 免费聊天 / 文档 / 创作应用；独立 MAU 信号弱
        - label: 开发者 / 开源
          detail: Hugging Face + GitHub 自助访问，分层付费 API
        - label: OEM 智能手机（OPPO、Honor、ZTE）
          detail: 通过谈判接入旗舰机端侧功能
        - label: 汽车（Geely / Qianli）
          detail: AgentOS 座舱共同开发，并在 Galaxy M9 量产
        - label: 企业垂直行业（Huanxi Media、SUMG、Zhiyuan Robotics）
          detail: 媒体、新闻、机器人领域的框架协议 / 具名合作
        - label: 认知阶段
          detail: Hugging Face/GitHub 上开放权重发布；WAIC/Step Up 生态活动
        - label: 试用阶段
          detail: 免费层 API key 或应用下载；开发者试验
        - label: 谈判集成阶段
          detail: OEM / 汽车 / 企业合作协议（框架或商业）
        - label: 生产部署阶段
          detail: 具名设备、车辆或合资产品中的已出货功能
        - label: 扩张循环阶段
          detail: 向相邻垂直领域交叉销售（手机 -> 汽车 -> 机器人 / 媒体），并为开发者生态提供资金支持（Starlight Program）
    approximationNotes: 旅程阶段是根据公开公告定性重建；StepFun 未披露阶段之间的转化漏斗。
    claimRefs:
