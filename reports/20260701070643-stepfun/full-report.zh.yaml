              StepFun 的扩张故事看上去很宽——手机、汽车、云、媒体、机器人——但底层分发依赖少数关系。三家手机 OEM 集团（OPPO、Honor、ZTE）承载了整个 42 million 台设备、60%
              品牌份额的头部叙事；Qianli Technology 作为 StepFun 的汽车座舱载体，自身财务也承压：其 IPO 招股书披露，2022 年至 2025 年中前五大客户贡献收入 41.5%-48.1%，仅
              Geely Group 一家就贡献 30.8%-39.7%；Qianli 在最近四个披露期间中有三个期间净亏损。新浪财经 2026 年 6 月报道还补充称，Qianli 控股集团把 2026
              年关联交易上限同比提高逾 80%，并批准以约 2 倍溢价收购一家关联且资不抵债的雷达感知公司，却没有设置业绩补偿条款——对于依赖 Qianli 作为 StepFun
              主要汽车分发渠道的投资者，这些治理信号值得担忧。另一份独立商业资料指出，StepFun 董事长也控制 Qianli，意味着两家公司处在同一个 Geely 锚定集团内，而不是保持独立交易对手关系。Tencent
              进一步强化了这种模式：它同时是 StepFun 多轮股东，又是 AI 座舱智能体的具名商业伙伴，这一结构让外界更难确认汽车合作是否按独立交易定价。企业垂直多元化（Huanxi Media、Shanghai
              United Media Group、Zhiyuan Robotics）仍停留在框架协议或早期合作阶段，没有完成合资公司或披露收入，因此还不足以对冲设备 / 汽车集中度。
