  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              StepFun 应被视为一家在中国基础模型应用层和嵌入式设备 AI 层竞争的公司，而不是中国整个 AI 或半导体经济的替身。IDC 的中国 AI agent market-glance
              正是沿这条线切分：它把模型开发、应用开发和 agent 开发平台，与底层算力、存储、网络和半导体基础设施堆栈区分开。在这条边界内，StepFun 自己的 platform.stepfun.com
              文档显示，公司通过聊天、视觉、语音和智能体式「step-3.x」模型按 token 计费，而不是售卖固定软件许可证；Step-Audio 语音模型已经作为嵌入式座舱软件装进 Geely 量产 Galaxy
              M9，也把汽车智能座舱授权而非仅消费者聊天明确纳入可服务支出。第四个容易被忽视的部分是合规：截至 2026 年 4 月 30 日，中国已有 868 个国家级 CAC 备案生成式 AI 服务和 530
              个地方备案应用，StepFun 的每一个公开界面都要通过同样的备案、安全评估和内容标识门槛；合规因此是持续经营成本，不是法律脚注。排除在边界之外的是更大的基础设施层——Forrester 估计中国 2026 年
              AI 基础设施支出超过 $70 billion——StepFun 消耗这层支出作为成本投入，而不是直接变现。StepFun 各界面的现状替代方案，从没有嵌入生成式 AI 的原生手机或车机软件，到 OEM
              合作伙伴可改选的更大 hyperscaler 分发替代品（Doubao、Qwen）不等。
