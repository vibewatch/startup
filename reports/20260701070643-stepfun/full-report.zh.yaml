        - 按 ARR 倍数看，最接近的中国私募可比公司。
        - 私募标记，不是交易所交易价格；ARR 数据来自公司 / 顾问报道。
      - - DeepSeek
        - 私募估值；无披露收入指标
        - 估值高于 $50B，无公开收入数据
        - 显示 2026 年中国 AI 私募估值的天花板。
        - 无法计算收入倍数；创始人控制的治理结构与 StepFun 差异很大。
      - - Baichuan Intelligence
        - 私募估值
        - ~$2.7-2.8B
        - 显示已披露中国 AI 虎公司估值区间的低端。
        - 战略不同（转向垂直医疗 AI），直接可比性有限。
      - - Palantir（PLTR，公开市场基准）
        - 市值相对 TTM 收入
        - 约 ~53.5x P/S
        - AI 溢价软件定价的公开市场天花板参考。
        - 盈利、美国上市、政府业务敞口高；不是直接行业同业。
    notes: 这些倍数混合了公开市场市值比、私募 ARR 倍数和一个无法测算案例（DeepSeek）；只能作方向性背景，不是逐项可比筛选。
