      - - 隐含的 57-68x 预期收入倍数高于 Palantir 约 53.5x 的公开市场基准，但在同组可比公司里并非最极端（Zhipu 约 576x，MiniMax 约 212x）。
        - 支持论点
        - 若 IPO 定价靠近 $12B 而非 $10B，倍数会更难自圆其说。
      - - 公开来源没有披露 StepFun 经审计的现金、烧钱速度、利润率或股权结构。
