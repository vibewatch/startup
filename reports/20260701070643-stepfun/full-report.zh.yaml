      - number: '8.3'
        title: 情景逻辑：指数资金驱动的上行真实存在，但执行失误也会快速重估
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果 StepFun 的设备和汽车足迹（40M+ 智能手机、1M+ 目标 Geely 车辆）能转化为可变现的 API 和授权收入，并达到或超过 $175.9 million 的 2026 预测；且
              IPO 靠近区间上端定价，并获得与 Zhipu 股价相似的指数纳入和基石锁定支撑，StepFun 有可能在随后一年复合到 $12-20 billion 区间，接近 Moonshot
              当前估值。这个结果要求执行零失误：不能重演第四章已标出的 2025 年中收入指引落空，设备伙伴继续配合，CSRC 驱动的上市审核也不能转向不利。


              基准和悲观情景更容易由公开证据支撑。Zhipu 和 MiniMax 上市后六个月内都较高点波动超过 40-70%，因此即便 StepFun 以接近 $10-11 billion
              顺利上市，也不能保证价格稳定——2026 年中国 AI 实验室估值既取决于底层经济性，也同样取决于指数资金、基石锁定和稀缺性叙事。悲观情景还多一条下行路径：红筹和 CSRC 审核导致上市延迟或缩水、2025
              年指引落空重演，或设备伙伴要求惩罚性收入分成；任一情况都可能把估值重置回 2026 年早些时候报道已披露的 $4-6 billion 投前估值区间。
