  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线：从 Step 3.7 Flash 到开源音频、视频和图像工具
        blocks:
          - type: paragraph
            body: >-
              StepFun 的商业入口是一套统一 API 平台（中国区 platform.stepfun.com、全球区 platform.stepfun.ai），按一组模型计量收费，而不是押注单一旗舰产品。当前旗舰
              Step 3.7 Flash 是一个 198B 参数的稀疏 MoE 视觉语言模型（196B 语言骨干加 1.8B 视觉编码器），每个 token 大约激活 11B 参数，支持 256K
              上下文窗口，输入价格为每百万 token RMB1.35/RMB0.27（缓存未命中/缓存命中），输出为 RMB8.1。上一代 Step 3.5 Flash（196B/11B 激活参数、262K
              上下文）仍在提供服务，并在 2026 年 2 月发布后不久排到 OpenRouter 免费模型榜第 3 位。Flash 层级之下是 Step-2，StepFun 在 WAIC 2024 推出的原始万亿参数 MoE
              模型，以及 Step-1V/Step-1.5V 多模态产品线；StepFun 称这条线支撑了超过 40 million 个嵌入式智能手机 AI
              功能。另一条创作工具线覆盖文生图和图像编辑（step-2x-large、step-image-edit-2，按生成图像收费），还有庞大的音频家族：Step-Audio 2 是开源端到端语音对话
              LLM，支持检索增强生成和工具调用；实时、TTS、语音克隆和 ASR 产品层级各自按不同计量单位收费，也可通过 pip 和 GitHub 安装。StepFun 还开源了 30B 参数文生视频模型
              Step-Video-T2V，并维护模型之外面向开发者的工具，包括 STEP-GUI GUI-agent 框架（仓库 gelab-zero）和 Step-Realtime-CLI/Console
              语音智能体工具。消费端没有单独承载这些模型的品牌；模型藏在阶跃AI（跃问 / Yuewen）聊天应用和嵌入式设备助手背后，因此 StepFun 的消费分发本质上完全是推理后端关系，而不是独立产品。
