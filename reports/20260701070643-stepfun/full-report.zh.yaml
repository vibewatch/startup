      - number: '5.4'
        title: 基准可信度和竞争定位
        blocks:
          - type: paragraph
            body: >-
              StepFun 的发布材料罕见地明说，部分头部对比来自厂商口径而非独立复现：其 Step 3.7 Flash 基准图注称，某竞争对手的 Terminal-Bench 2.1 分数来自 StepFun
              自己的内部测试，其他厂商数字则是各自报告的另一个版本（Terminal-Bench 2.0）结果；它还主打更高但被标记为污染的 76.5% SWE-Bench Verified 分数，尽管按独立分析，更抗污染的
              SWE-Bench Pro 分数（56.3%，在 35 个追踪模型中排第 15）才是更干净的信号。基于 NVIDIA DGX Spark 的独立上手测试确实给出一个正面结果：在多步骤评估套件中工具调用成功率达到
              100%，与模型 67.1 的 ClawEval-1.1 第一名成绩一致（但不能证明该成绩）。不过，更广泛、中立的聚合器 Crafiq 给 Step 3.7 Flash 的总体智能排名只有 #108、编程排名
              #89——这能修正 StepFun 自有材料强调的狭窄智能体基准叙事。StepFun 还报告了强劲的搜索增强分数（79.2 SimpleVQA-with-tool、75.82% BrowseComp、92.82%
              DeepSearchQA）和企业职业覆盖（44 个职业的 45.8% GDPval、Tau2-bench Telecom 各层级 98%+ 通过率），并把自家 Step-SWE-Bench 的跨评测性能方差从
              43-73%（Step 3.5 Flash）收窄到 64.5-71.5%——这些仍是自测。相比之下，Step 3.5 Flash 在 2026 年 2 月亮相时获得的独立评测覆盖，确实在 Hacker News
              和本地推理社区激起讨论；StepFun 的 GitHub 组织也提供佐证，约有 1,700 名关注者和 32 个公开仓库，包括 2,100+ star 的 Step-3.5-Flash 仓库，以及增长很快的
              Step-3.7-Flash 仓库。
