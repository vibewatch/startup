      - number: '2.3'
        title: 设备嵌入式 AI：StepFun 真正追逐的是手机、PC 和座舱界面
        blocks:
          - type: paragraph
            body: >-
              StepFun 自己的定位很明确：它不是只争云端聊天流量，而是把模型嵌进智能手机、汽车和工业硬件。公开报道将 StepFun 旗舰模型与超过 40 million 部智能手机的 AI 功能、以及通过 Geely
              合作瞄准超过 1 million 辆汽车的部署联系起来；只有底层设备品类本身也在增长，这些数字才有意义。手机侧，IDC（另有一家中国媒体交叉印证）预测 2026 年中国出货量将下降 2.2% 至约 278
              million 台，但下一代 AI 手机出货量会升至 147 million 台，占总量 53%，也是 AI 手机首次跨过市场一半，模式是「端云协同」。PC 侧，IDC 预计 2026 年中国市场约 42.22
              million 台、大体持平，但 GenAI PC 同比增长 146.5%，到 2029 年估计达到品类的 36.5%。汽车座舱侧，中商产业研究院行业预测显示，中国智能座舱解决方案市场 2026 年达到 RMB
              182.8 billion，高于 2025 年的 RMB 154.5 billion；语音交互渗透率一年内几乎翻倍，从 26% 升至 48%。Geely 的 Galaxy M9 在 WAIC 2025
              亮相，双方都称其为行业首款搭载端到端语音 LLM 驱动「Agent OS」座舱的量产车，底层采用 StepFun 的 Step-Audio 模型。这些设备品类都在扩张，但 StepFun 只是多个争取 OEM
              定点的嵌入式模型供应商之一；目前只有 Geely 这一段关系被公开确认达到规模，独立分析也把这种集中度列为潜在天花板，限制 StepFun 真实可服务市场的独立性。
