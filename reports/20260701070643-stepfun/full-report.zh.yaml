      - number: '7.8'
        title: 证据要点
        blocks:
          - type: callout
            title: 交叉任职集中 StepFun 的汽车渠道风险
            body: >-
              StepFun 董事长 Yin Qi 也担任 Qianli Technology 董事长；Qianli 是与 Geely 关联的实体，也是 StepFun
              唯一已证明的汽车分发伙伴，且核心净利润已连续三年为负——治理风险和渠道风险叠加在同一段关系里。
            calloutType: risk
            claimRefs:
              - CR041
              - CR036
              - CR033
          - type: callout
            title: $10-12 billion IPO 目标前没有经审计财务基线
            body: 截至本章运行日期，无法检索到 StepFun 经审计的 2025 年财务报表或已提交的 HKEX 招股书，因此其报道的约 RMB 500 million 2025 年收入，在目标基石估值面前仍未被验证。
            calloutType: risk
            claimRefs:
              - CR042
              - CR005
          - type: callout
            title: 没有反向安全 / 诉讼证据，应视为缺口而不是通关
            body: 本章没有找到 StepFun 的公开安全认证、事故披露、诉讼或数据泄露记录。这种缺席被记录为需要后续尽调跟进的证据缺口，而不是确认运营风险记录清白。
            calloutType: assumption
            claimRefs:
              - CR045
              - CR049
          - type: callout
            title: 两次刷新之间追踪五个公开、可监控的投资逻辑失效触发器
            body: >-
              CSRC 备案闭环 / HKEX 招股书状态、Entity List 或五角大楼 1260H 指定、点名 StepFun 的 CAC 执法行动、非独立交易的 Qianli 关联交易披露，以及 Qianli
              季度财务趋势，均可从公司外部观察，应成为下一次尽调刷新的锚点。
