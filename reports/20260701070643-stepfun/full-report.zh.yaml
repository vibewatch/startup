  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：真实设备切口定价过高，公开披露还无法承销
        blocks:
          - type: paragraph
            body: >-
              StepFun 进入本次尽调时，确实有一条差异化分发故事：完成股改、拆除红筹架构，并完成近 $2.5 billion 的 pre-IPO 轮，Hong Kong Investment Corporation
              与智能手机 ODM 和零部件投资方 Huaqin、Longcheer、OmniVision、ZTE 一同入局。这组投资人不是普通财务资本；它正是 StepFun 要把模型持续嵌入设备所需的供应链。创始人
              Jiang Daxin 曾任 Microsoft 副总裁，自 2023 年 4 月以来搭建了约 500 人、80% 技术人员的团队；公司也获得外部认可，被视为 DeepSeek 之外值得关注的中国 AI
              实验室之一。


              但这些都没有回答本章必须回答的定价问题。StepFun 香港 IPO 目标估值 $10-12 billion，对应其报道的 2025 年收入 $73.3 million 和市场预测的 2026 年收入
              $175.9 million——隐含倍数约为过去收入 137-164x、远期收入 57-68x。独立评论明确把 $12 billion 估值与“national
              champion”情绪和国资支持资本相连，而不是与已披露基本面相连；本章审阅的来源也没有提供审计财报、现金头寸或已提交招股书。面对真实但未验证的投资逻辑、偏高但非极端的倍数，以及薄弱证据基础，合适结论是继续研究，而不是买入：跟踪申报和上市后前两个季度；没有审计数字时，不要在区间低端以上投入资本。
            claimRefs:
