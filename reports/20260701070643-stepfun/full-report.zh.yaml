      - number: '5.3'
        title: 客户工作流、部署足迹和发布路线图
        blocks:
          - type: paragraph
            body: >-
              StepFun 最具体的效率卖点是智能体编程经济性：Step 3.7 Flash 的 Advisor Mode 据称能以约 $0.19 跑完一个智能体任务，而更大的 顾问模型约需 $1.76；StepFun
              自己也把这个说法框定为内部脚手架基准，而不是独立审计比较。编程之外，模型线覆盖企业文档 / 截图解析（原生多模态感知）、网页 / 视觉搜索增强问答、基于 Step-Audio 2
              的端到端对话式语音智能体，以及基于 STEP-GUI 框架的 GUI 驱动桌面自动化。纸面上部署确实灵活：Step 3.7 Flash 支持云端、数据中心和本地使用，已集成 vLLM、SGLang、Hugging
              Face Transformers、llama.cpp、NVIDIA NeMo 生态和 NVIDIA NIM，并在发布时登陆 StepFun 自有平台、OpenRouter 和 NVIDIA
              NIM（DeepInfra、Fireworks AI 和 Modal 宣布随后接入）。标准 API 访问采用五级限速阶梯（V0 到 V5），门槛看账户累计充值，而不是固定开发者套餐；另有较新的订阅制 “Step
              Plan”。真正本地部署仍有硬件底线：即便已发布的最小量化版本，也至少需要 128GB 统一内存，普通消费级笔记本因此出局，本地运行被限制在 DGX Spark、Mac Studio M4 Max 或 AMD
              Ryzen AI Max+ 395 这类工作站级硬件上。StepFun 在 2025-2026 年的发布节奏——2025 年 7 月 Step-Audio 2 和 Step-3 技术论文、同年 8-9 月开源
              Step-Audio 2 mini 变体和 vLLM 后端、2026 年 2 月 Step 3.5 Flash、2026 年 5 月 Step 3.7 Flash——显示它大约每 1 到 3
              个月更新一次主要模型家族；Step-Audio 2 也以标准 pip 可安装 PyPI 包的形式与 GitHub 源码一并分发。
