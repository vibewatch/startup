      - number: '7.6'
        title: 技术和产品风险：基准不透明、安全姿态未验证、标识负担加重
        blocks:
          - type: paragraph
            body: >-
              StepFun 的技术风险不太在原始模型质量，而在于无法独立验证的部分。针对 2.8 million 条 LMArena 模型比较记录的行业级分析发现，选择性提交通过挑选样本把排行榜分数最多抬高了 100
              分，主要实验室只提交表现最好的私有测试变体，而不是已上线生产模型；这种模式并非 StepFun 特有，但本章审阅的来源没有找到任何经 StepFun
              授权的独立复现来验证其旗舰智能体基准主张，因此同样的不透明风险在 StepFun 身上仍未解除。另一个缺口是，没有找到 StepFun 平台、Step-Audio 或 Step-Video
              的独立安全认证、漏洞赏金计划或公开事故响应披露；也没有找到点名 StepFun 的公开诉讼、数据泄露披露或集体诉讼记录——这种缺席应解读为证据缺口，而不是确认记录清白。合规上，中国显式 / 隐式双轨 AI
              内容标识制度已自 2025 年 9 月起强制执行，Tencent、Douyin、RedNote、Weibo、DeepSeek 等主要平台都已发布合规声明，但没有找到 StepFun 针对 Yuewen 消费应用或
              API 输出的同等公开声明。合规面还在扩张：国家网信办 2026 年 4 月发布征求意见稿，拟对模拟人类交互的 AI 服务增加强制伦理审查、应急程序和内容治理义务，预计约在 2026 年 7 月生效；这会在
              StepFun 消费端已经必须满足的标识制度之外，再增加持续工程和审计负担。
