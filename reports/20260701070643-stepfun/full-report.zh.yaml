        - Qianli/Geely 的财务或战略压力，可能扰乱 StepFun 依赖其证明汽车赛道能力的座舱渠道
        - 索取 StepFun 与 Qianli 相关的直接敞口 / 应收账款，以及 Qianli 表现不及预期时的合同保护
      - - Tencent Cloud 合作把汽车触达延伸进 Tencent 的消费生态
        - Tencent 同时是多轮股权投资方和商业合作伙伴，谈判公平商业条款时可能存在利益冲突
        - 关联方关系可能意味着汽车合作条款不能代表独立市场定价
        - 询问 Tencent Cloud 商业协议是否独立于 Tencent 的董事席位 / 股权位置谈判或批准
      - - 借 Huanxi Media 合资公司和 Shanghai United Media Group 合作拓展企业垂直场景
        - 目前只有一个企业合资项目（媒体 / 娱乐）走到已签框架协议阶段；合资实体、资金和交付时间表尚未最终敲定
        - 即便已有企业垂直收入，短期内相对设备 / 汽车规模也很可能不重要
        - 跟踪合资公司设立、出资和首个商业交付里程碑
      - - 开发者生态（Starlight Program、开放权重发布）扩大长尾应用基础
        - 没有披露指标区分已承诺 / 付费开发者和免费试用者；项目成效只做定性描述
        - 如果不能转化为已披露的付费使用，开发者生态可能比设备 / 汽车更弱，难以拉动扩张
