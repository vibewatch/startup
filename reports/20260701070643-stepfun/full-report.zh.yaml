      - number: '2.2'
        title: 没有干净单一数字的市场，只能用证据约束几组规模镜头
        blocks:
          - type: paragraph
            body: >-
              公开市场没有一个数字能干净框定「StepFun 的市场」，所以本章保留几组有来源支撑的镜头，而不是人为拼出一个 TAM。最窄的应用镜头来自 IMARC 的中国生成式 AI（AIGC）市场估计：2025 年规模约
              $5.16 billion，到 2034 年增至 $19.56 billion，CAGR 为 15.96%；这很可能低估 StepFun
              的真实可服务池，因为它排除了嵌入式设备授权。更大但相邻的镜头是基础设施：Forrester 预计中国 AI 基础设施支出将在 2026 年超过 $70 billion，Gartner 则把全球 AI 支出放在
              $2.59 trillion（同比 +47%）；这些数字位于 StepFun 实际变现层的上游。使用量镜头来自中国公有云模型即服务消费，2025 年达到 1,944 trillion tokens（同比
              16x），仅 ByteDance Volcano Engine 就占 49.5% 份额，说明使用量扩张远快于任何已经稳定的营收池。监管规模镜头显示，截至 2026 年 4 月 30 日，全国备案生成式 AI
              服务有 868 个，仅两个月增加 72 个；全球份额镜头（Nikkei，经 TrendForce）则显示，中国开源模型在全球使用份额一年内从约 1% 跳到 15%。有用的是，IDC
              自己的中国基础模型跟踪（CHC5530125）也把 StepFun 的「Step Reasoner mini」与 Qwen3-Max、DeepSeek、Kimi K2、GLM-4.6
              并列为其跟踪的前沿模型之一；IDC 还单独设定国家目标：到 2027 年智能设备 / agent 渗透率达到 70%，到 2030 年达到 90%，并预计中国 top-1,000 企业中 80% 到 2027
              年会优先考虑 AI 主权。这些镜头不能相加成一个总数；合在一起，它们描绘的是一个增长快、使用量充沛、但商业化仍未定型的市场。
