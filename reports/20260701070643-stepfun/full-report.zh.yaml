    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立和产品 / 技术架构
        blocks:
          - type: paragraph
            body: >-
              StepFun 是上海阶跃星辰智能科技有限公司的商业名称，公司注册在上海徐汇区。Baidu Baike 的工商登记条目显示，公司成立于 2023 年 4 月 6 日，法定代表人为 Jiang
              Daxin，初始注册资本 RMB 20 million；Wikipedia、Reuters 等英文报道均指向「2023 年 4 月」，但没有给出更精确的街道地址。Reuters 和 Wikipedia 都将曾参与
              Bing 和 Microsoft 365 的前 Microsoft 全球 / 高级副总裁 Jiang Daxin 列为创始人，并列出共同创始人 Zhu Yibo 和 Jiao
              Binxing。公司的技术身份围绕「Step」多模态基础模型族（语言、视觉、视频、音频）展开；据 MIT Technology Review，StepFun
              仍在明确追求通用人工智能，而不少中国同行已经降低了这一目标优先级。StepFun 官方平台目前主推「Step 3.7 Flash」这一面向生产的智能体式 Flash 模型；消费者聊天产品「跃问」(Yuewen)
              和配套应用冒泡鸭，则让它在开发者 API 之外也有直达用户的分发。媒体反复将 StepFun 与 Zhipu AI、MiniMax、Moonshot AI、01.AI、Baichuan Intelligence
              一起列入中国「六小虎」，并引用 36Kr 采访中的 StepFun 高管说法，称其策略更接近「中国的 xAI 加 Tesla」，而不是纯聊天应用；这反映出公司更强调把模型嵌入物理终端，而非只卖云端订阅。
