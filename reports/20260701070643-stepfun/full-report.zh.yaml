  - id: TV005
    title: 论点失效与退出触发条件表
    columns:
      - 触发条件
      - 证据 / 阈值
      - 对投资论点的影响
      - 行动含义
    rows:
      - - 未新增披露却以 $12B 或更高定价 IPO
        - 从申报到上市期间没有新增经审计财务数据
        - 隐含预期倍数被推高到 68x 以上；剥离资金流影响后，甚至超过 Zhipu 被指数纳入推高的基准
        - 不追加资金；等待上市后披露。
      - - 上市后两个季度内波动超过 50%
        - 上市六个月内出现这种幅度的股价变动，类似 Zhipu 和 MiniMax
        - 证实可比公司组由流动性驱动的重定价模式同样适用于 StepFun
        - 把任何上市后入场价都视为临时价格，而非稳定标记。
      - - 设备伙伴收入分成被证明过高
        - StepFun 专属收入分成披露达到或高于行业惯例 60% 上沿
        - 压缩 40M+ 设备覆盖带来的实际留存，削弱分发论点
        - 将估值立场从偏高下调为昂贵。
      - - 算力配给 / API 价格战加剧
        - Zhipu、Kimi 或 MiniMax 进一步下调 token 价格或出现排队
        - 表明整个可比组都有利润率天花板，包括 StepFun 自身按 token 定价的业务
        - 上调悲观情景概率并重新论证。
      - - 监管或 CSRC 红筹审查延迟或阻断上市
        - 上市时间表滑到 2026 年之后
        - 移除该估值依赖的近期流动性催化剂
        - 在重新申报前，将立场转向继续研究 / 回避。
    notes: 这些触发条件专门服务于估值判断，不是复述第 7 章已经覆盖的运营风险清单。
    claimRefs:
      - CV006
      - CV014
      - CV017
      - CV019
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务 / 招股书
        - 现金、烧钱速度、毛利率和分部收入
        - 若不核验背后的收入基数，无法论证 57-68x 预期倍数
        - HKEXnews 发布后的申报文件；管理层尽调资料室。
      - - 股权结构 / 所有权
        - HKIC、上海国资和产业投资者持股比例
        - 决定稀释幅度，也判断 $10-12B 目标反映真实经济权益还是一轮融资的表面规模
        - 向公司或法律顾问索取股权结构表和股东名册。
      - - IPO 定价结果
        - 最终发行价、募资规模和基石配售
        - 直接解答入场倍数落在约 57x 还是 68x+
        - 跟踪 HKEXnews 上市公告和定价补充文件。
      - - 设备 / OEM 收入分成条款
        - 与 Geely、OPPO、Honor 和 ZTE 的单设备或收入分成比例
        - 决定 40M+ 设备覆盖中有多少转化为 StepFun 自身收入，而不是伙伴收入
        - 通过管理层或伙伴 IR 索取合作合同条款。
      - - 上市后稳定计划
        - 绿鞋机制、锁定期安排和指数纳入时间表
        - Zhipu / MiniMax 先例显示，这些机制驱动上市初期的大部分价格波动
        - 招股书提交后审阅稳定价格章节。
    notes: 每个问题都可能直接改变上述建议、信心或可接受入场价，因此被列入。
    claimRefs:
      - CV002
      - CV038
      - CV039
      - CV044
      - CV048
