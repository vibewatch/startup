      - number: '7.7'
        title: 综合：缓释成熟度、可监控触发器和投资逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              合起来看，StepFun 最严重的风险集中在三处：CSRC 红筹回拆和密集 2026 合规日程带来的上市执行风险；美国出口管制执行收紧，而国产芯片替代在效率和软件成熟度上仍落后 Nvidia
              带来的算力供应风险；以及 StepFun 董事长与唯一已证明汽车渠道交易对手 Qianli Technology 之间交叉任职所放大的治理 / 渠道风险，而 Qianli
              自身又承受真实财务压力。单看其中任何一个风险都不致命——红筹回拆在其他公司已成功完成，国产芯片一代代改进，交叉任职在中国国资关联科技行业也常见——但这些风险的缓释成熟度普遍很低：本章风险清单中几乎没有任何事项披露了
              StepFun 的正式缓释措施，除了底层关系或重组本身。最清晰的投资逻辑失效触发器因此都能从公司外部观察：CSRC 备案闭环，或 HKEX 招股书在 2026 年底后撤回 / 延迟；StepFun、Qianli
              或具名芯片供应商被列入 Entity List 或五角大楼 1260H 清单；出现点名 StepFun 的 CAC 执法行动；或出现披露 StepFun 与 Qianli
              之间非独立交易条款的关联交易文件。每一项都是公开且可监控事件，而不是私下事件，因此尽调可以在两次报告刷新之间追踪 StepFun 的风险轨迹，而不只依赖公司披露。
