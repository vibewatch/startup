  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: StepFun 的 IPO 目标是否站得住，只在很窄的收入倍数假设区间内才显得稳妥。
    data:
      items:
        - label: 已报告 2025 收入
          value: 73.3
          detail: 第三方报告的 StepFun 2025 收入（百万美元，第 4 章）。
          tone: neutral
        - label: 已报告 2026 收入预测
          value: 175.9
          detail: 第三方市场预测，不是公司指引（百万美元）。
          tone: neutral
        - label: $10B、40x 倍数所需收入
          value: 250
          detail: 要用 40x 上限倍数支撑 $10B，所需收入（百万美元）。
          tone: warning
        - label: $10B、20x 倍数所需收入
          value: 500
          detail: 按 20x 计算所需收入；20x 是 36Kr 引用的极端 SaaS 基准下沿。
          tone: negative
        - label: $10B、Palantir 53.5x 等效收入
          value: 187
          detail: StepFun 若要在 $10B 估值下匹配 Palantir 公开市场 P/S 倍数，需要达到的收入（百万美元）。
          tone: warning
    approximationNotes: 收入门槛只是用本章来源引用的取整倍数搭出的 EV / 收入桥，不是折现现金流输出。
    claimRefs:
      - CV036
      - CV037
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可行估值区间很宽，因为倍数怎么选、IPO 何时发生，与收入增长同样重要。
    data:
      items:
        - label: 悲观情景
          low: 4000
          mid: 5000
          high: 6000
          displayValue: $4B-$6B
          detail: 上市延迟 / 缩水，或收入指引再次落空；估值重置到 pre-IPO 投前区间。
          tone: negative
        - label: 基准情景
          low: 9000
          mid: 10500
          high: 11500
          displayValue: $9B-$11.5B
          detail: IPO 定价落在目标区间低端至中段附近，上市后出现 Zhipu / MiniMax 式波动。
          tone: warning
        - label: 乐观情景
          low: 12000
          mid: 14000
          high: 20000
          displayValue: $12B-$20B
          detail: 收入达到或超过预测，且 2027 年再翻倍，倍数得以维持，估值接近 Moonshot 的估值标记。
          tone: positive
    approximationNotes: 区间本身是供投委会讨论的情景化收入倍数输出，不是管理层指引，也不是已定价结果。
    claimRefs:
      - CV026
      - CV036
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: StepFun 在分发和资本通道上得分高，但披露质量和估值支撑偏弱。
    data:
      items:
        - label: 设备 / 汽车分发验证
          score: 8
          detail: 40M+ 部智能手机和一个具名、目标 1M+ 辆的车辆项目，是真实且可核验的落地信号。
          tone: positive
        - label: 资本通道
          score: 8
          detail: Series B+、约 $2.5B pre-IPO 轮和 HKIC 背书，显示融资通道强且来源更分散。
          tone: positive
        - label: 可比公司定位
          score: 6
          detail: 隐含倍数相对 Zhipu、MiniMax 和 Moonshot 居中，不是这一组里最极端的。
          tone: neutral
        - label: 披露 / 证据质量
          score: 3
          detail: 审计版招股书、现金余额、烧钱速度、利润率和股权结构均未公开。
          tone: warning
        - label: 估值支撑
          score: 4
          detail: 只有 2026 收入兑现，且定价更接近 $10B 而不是 $12B，估值才站得住。
          tone: warning
        - label: 治理 / 执行风险
          score: 4
          detail: 监管层红筹审查时间，以及设备伙伴收入分成条款仍未明确。
          tone: warning
        - label: 同行先例价格稳定性
          score: 3
          detail: Zhipu 和 MiniMax 上市后都出现 40-70%+ 波动，因此 IPO 定价不等于价格发现。
          tone: warning
    approximationNotes: 分数为 0-10 的序数判断，基于本章证据综合而来，供投委会讨论；不是供应商提供的评分卡。
    claimRefs:
      - CV002
      - CV036
      - CV038
      - CV045
      - CV047
