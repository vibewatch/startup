companyProfile:
  summary: >-
    StepFun（阶跃星辰），正式主体为上海阶跃星辰智能科技有限公司，2023 年 4 月由前 Microsoft 副总裁 Jiang Daxin 在上海创立，共同创始人包括 Zhu Yibo 和 Jiao
    Binxing，通常被归入中国 AI「六小虎」。公司打造多模态「Step」模型族，覆盖文本、视觉、视频和音频；分发渠道包括按量计费的开发者 API 平台、GitHub / Hugging Face 开放权重、自己的跃问
    (Yuewen) 消费者聊天应用，以及与 OPPO、Honor、ZTE、Geely 合作的手机和车端嵌入式部署。2026 年创纪录的资本冲刺——超过 RMB5 billion 的 B+ 轮、接近 $2.5 billion 的 IPO
    前轮，以及完成红筹架构拆除——最终指向 2026 年 6 月提交香港 IPO，目标估值 $10-12 billion；但其收入基础仍薄，且大多未经审计。
