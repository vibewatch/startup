      - number: '1.3'
        title: 融资历史、投资方和估值轨迹
        blocks:
          - type: paragraph
            body: >-
              StepFun 的融资历史显示，公司起步不快，但随后加速放大。KrASIA 和 BigGo Finance 都称，天使 / 首轮融资凭借创始人网络把估值推到独角兽水平，投资方包括 Sequoia
              China（HongShan）、Qiming Venture Partners 和 IDG Capital；2024 年 A 轮引入美元基金 5Y Capital、Shunwei Capital 以及
              Legend Capital；2024 年中启动、约 2024 年 12 月关闭的 B 轮，则加入 Shanghai State-owned Capital Investment 及关联基金、Hong Kong
              Investment Corporation（HKIC）和 Tencent。2026 年 1 月 26 日，TechNode、KrASIA、Yicai 和 C114 均报道 StepFun 完成超过 RMB 5
              billion（约 $718-733 million）的 B+ 轮融资，被称为此前 12 个月中国大模型领域最大单笔融资；新进产业和国资关联投资方包括 Shanghai SDIC/S&T Capital
              InnoFund、China Life Private Equity、Pudong Venture Capital、Xuhui Capital、Wuxi Liangxi Fund、Xiamen ITG
              Group、Huaqin Technology，Tencent、Qiming、5Y Capital 也继续跟投。到 2026 年 4 月，StepFun 已改制为股份有限公司，并拆除 Cayman
              Islands「红筹」结构；到 2026 年 5 月，KrASIA 和 CnTechPost 报道称公司接近完成近 $2.5 billion 的 IPO 前轮，投资方包括 HKIC 迄今唯一披露的生成式 AI
              投资，以及供应链投资方 Huaqin、Longcheer、OmniVision 和 ZTE。Reuters 引用 Caijing 报道称，该 IPO 前轮目标估值最高 $6 billion，为香港上市前接近
              $10 billion 的锚定估值做铺垫；FAQ.com.tw 报道 StepFun 于 2026 年 6 月 9 日提交香港 IPO，目标估值 $10-12 billion，拟融资约 $500 million。
