  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和上市风险：红筹回拆叠加密集的 2026 合规日程
        blocks:
          - type: paragraph
            body: >-
              StepFun 最迫近的结构性风险不是技术，而是监管。Reuters 2026 年 4 月 13 日报道称，StepFun 正在拆除其离岸 Cayman Islands “红筹”注册架构，为计划中的香港 IPO
              铺路；此前中国证券监管机构因股东透明度和合规风险，要求部分离岸注册公司拆除此类架构。两名消息人士告诉 Reuters，这一决定反映 StepFun “受到国资重度支持”，包括上海市级和区级政府投资平台；到
              2026 年 4 月，公司已完成股份制改造，Qianli Technology 董事长 Yin Qi 正式登记为 StepFun 董事长。自 2023 年 3
              月起适用的《试行办法》规定，通过红筹架构间接境外上市，需在提交境外上市申请后三个工作日内向中国证监会（CSRC）备案，并面临 20
              个工作日审核窗口；法律评论指出，拆除既有红筹架构在法律上可能复杂且成本高昂，一些公司因此推迟甚至放弃 IPO 计划。叠加在上市架构风险之上的，是密集的合规日程：中国修订后的《网络安全法》已于 2026 年 1 月
              1 日生效，分级处罚显著加重（关键信息基础设施违规最高可罚 RMB 10 million 或更多），并明确加入 AI 治理表述；AI 生成内容标识办法和强制性 GB 45438-2025 标准也已自 2025 年
              9 月 1 日起要求显式 / 隐式双重标识。机会一侧，HKEX 2026 年 3 月咨询文件提议下调同股不同权上市门槛；如果在 StepFun
              申报窗口关闭前获采纳，可能放松（而不是收紧）其通往创始人友好型上市结构的路径。
