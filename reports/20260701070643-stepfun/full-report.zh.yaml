      - number: '3.2'
        title: 竞争者画像：规模、融资和战略方向
        blocks:
          - type: paragraph
            body: >-
              Zhipu AI 在国际上改名为 Z.ai，并通过 2026 年 1 月香港 IPO 成为首家上市的大语言模型公司；其 FY2025 年报显示，收入约 CNY 724 million（约 $105
              million，同比增长 131.9%），净亏损约 CNY 4.72 billion，到 2026 年中市值高于 HK$400 billion。其旗舰 GLM-5 是 744-billion 参数 MoE
              模型，采用 MIT license，并端到端在 Huawei Ascend 芯片上训练，把 Zhipu 定位成面向国资关联和企业买方的抗出口管制选择。Moonshot AI 是 Kimi 模型族的开发者，2026
              年 5 月由 Meituan Long-Z Investments 领投，以 $20 billion 估值融资约 $2 billion；这一估值高于 2025 年底的 $4.3 billion。Kimi K2.6
              / K2.5 模型在长上下文和 agent-swarm 协同上竞争，并嵌入西方开发者工具 Cursor Composer 2。MiniMax 也在 2026 年 1 月窗口期赴港上市，以约 $6.5
              billion 估值融资约 $619 million，GIC、Baillie Gifford 和 Abu Dhabi Investment Authority 为基石投资者，并推出自进化智能体 M
              系列（M2-M2.7）。


              Baichuan Intelligence 走了另一条路：它从更广的平台战略转向垂直医疗 AI，解散金融和教育团队，聚焦 Baichuan-M2 等模型；Baichuan-M2 是开源医疗 LLM，在
              HealthBench benchmark 上得分高于 OpenAI gpt-oss-120b，同时仍获得 Alibaba、Tencent、Xiaomi 和多只国资背景基金支持。DeepSeek 是
              High-Flyer 对冲基金孵化公司，在 2026 年 6 月之前没有外部投资人；该轮融资超过 CNY 50 billion（约 $7.4 billion），估值高于 CNY 330
              billion，结构上多数外部投资人没有投票权，而 National AI Industry Investment Fund 直接投资并拥有完整投票权。Alibaba Qwen、Baidu ERNIE 和
              ByteDance Doubao / Seed 构成大厂嵌入式梯队：Qwen3.6-Plus 接入 Alibaba 的 Wukong 企业平台和消费者 Qwen App；ERNIE 5.1（不同于 ERNIE
              4.5，未开源）声称以约 6% 的同业训练成本排到 Arena Search 全球第 4；Doubao / Seed 2.0 则是 ByteDance 以消费者为先的旗舰，未披露独立融资轮。
