      - number: '7.3'
        title: 竞争和定价风险：行业整合、价格战持续、分发差距扩大
        blocks:
          - type: paragraph
            body: >-
              StepFun 所处的中国基础模型赛道，KrASIA 和 JPMorgan 都描述为正在快速整合。KrASIA 将 StepFun 与 01.AI、Baichuan AI、MiniMax、Moonshot
              AI、Zhipu 一并归为中国“AI 虎”，并指出到 2026 年初 Zhipu 和 MiniMax 已在香港上市，其余公司（包括 StepFun）仍为私有且承受融资压力。JPMorgan 2026 年 2
              月行业报告认为，可行的中国模型开发商已从 200 多家缩减到少于 10 家，未来赢家取决于部署规模和变现效率，而不是模型发布节奏；该行对 Zhipu 和 MiniMax
              发起公开分析师覆盖并给出“Overweight”评级，却没有覆盖 StepFun，这与 StepFun 相对稀薄的公开披露相符。收入差距很实质：Zhipu 2025 年收入达到 RMB 724.3
              million（2024 年为 RMB 312.4 million），明显高于 StepFun 先前报道的约 RMB 500 million；ByteDance 一家公司计划 2026 年在 AI 采购上投入超过
              RMB 160 billion，Tencent 2025 年资本开支达到 RMB 79.2 billion——这些基础设施规模比 StepFun 已披露规模高一个数量级。行业整合还叠加主动价格战：中国实验室在
              2026 年反复下调 API 价格，单 token 收入在算力成本仍高度资本密集时被压缩，StepFun 的单位经济模型同时被需求侧和供给侧挤压；本章审阅的来源没有证据表明 StepFun
              相较规模更大、资本更充足的对手已有差异化定价权。
