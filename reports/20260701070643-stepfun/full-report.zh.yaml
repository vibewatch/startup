      - number: '7.5'
        title: 治理和披露风险：交叉任职叠加无审计基线
        blocks:
          - type: paragraph
            body: >-
              StepFun 的治理画像有两个相互叠加的缺口。第一，董事长 Yin Qi 同时担任 Qianli Technology 董事长——后者是 StepFun 主要且唯一已证明的汽车分发交易对手，又与 Geely
              关联——这意味着两家公司最重要的商业关系是在交叉任职董事之间谈判，而不是按独立交易完成。本章审阅的来源中，没有发现覆盖 StepFun-Qianli
              交易的董事会会议纪要、关联交易审批流程或独立董事证明。第二，截至本章运行日期，无法检索到 StepFun 经审计的 2025 年财务报表或已提交的 HKEX 招股书，因此其报道的约 RMB 500 million
              2025 年收入和目标 $10-12 billion 估值缺少独立验证基线；在隐含收入倍数如此高的情况下，这个缺口很重要。StepFun 的投资者基础进一步放大透明度问题：Reuters
              报道称其资本中包括上海市级和区级投资平台等国资关联资金；2026 年 pre-IPO 轮还另有 Hong Kong Investment Corporation
              参与，这是一只由香港政府全资拥有的基金，其披露文件称同时承担财务回报和提升香港竞争力的双重使命。双重使命本身不一定负面，但意味着 StepFun 的所有权和治理决策——包括 IPO
              地点选择——部分受公共政策目标塑造，而纯私营资本公司不会背负这一点。StepFun 从天使轮到 pre-IPO 轮的完整股权结构，仍只能通过媒体报道部分拼出，而不是来自一手文件。
