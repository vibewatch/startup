              按证据可被独立验证的强弱给 StepFun 客户渠道排序，层次很清楚。监管文件和第三方平台遥测排在最上方：HKEXnews 文件和 Wilson Sonsini 的法律确认独立佐证了 Huanxi Media
              合资事项，Hugging Face/GitHub
              下载和提交数据独立佐证了开发者生态活动。设备和汽车证据位于中间：具名功能媒体报道（OPPO、Honor、ZTE）和联合展示或新闻稿材料（Geely/Qianli、Tencent）虽由独立渠道报道，但最终仍回到公司或合作伙伴对某个功能或事件的披露，而不是审计后的使用或收入数据。最弱的是消费应用：Yuewen
              缺席 AICPB 独立 MAU 榜单，Google Play 评论基础又薄且投诉密集，两者都指向同一个结论——StepFun
              尚未把设备级触达转化为可独立测量的自有消费用户。总体看，本章在设备和汽车功能层面找到了真实、可验证的客户证明，但整个组合没有披露付费客户数、留存指标或合同期限；Qianli/Geely/Tencent
              的所有权和投资结构也把汽车渠道集中在一个小型、互相交织的集团里，而不是分散客户基础中。
