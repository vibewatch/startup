  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议的关键，是 StepFun 真实的设备分发切口，能否抵消偏高入场价和偏薄公开披露。
    data:
      nodes:
        - id: distribution
          label: 设备与汽车分发
          detail: 40M+ 部智能手机，以及 Geely 目标 1M+ 辆的车辆项目，给 StepFun 拼出差异化落地渠道。
          tone: positive
        - id: capital
          label: 2026 融资冲刺
          detail: Series B+、约 $2.5B pre-IPO 轮和 HKIC 背书，显示融资通道很深。
          tone: positive
        - id: target
          label: $10-12B IPO 目标
          detail: 隐含约 57-68x 远期收入，相比上市公司基准偏高。
          tone: warning
        - id: disclosure
          label: 披露偏薄
          detail: 审计版招股书、现金余额、烧钱速度和股权结构均未公开。
          tone: warning
        - id: peers
          label: 同行波动
          detail: Zhipu 和 MiniMax 上市后都出现 40-70%+ 波动，因此 IPO 定价不等于价格发现。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 投入资本前，跟踪招股书和上市后前两个季度。
          tone: neutral
      edges:
        - from: distribution
          to: decision
        - from: capital
          to: target
        - from: target
          to: decision
        - from: disclosure
          to: decision
        - from: peers
          to: decision
