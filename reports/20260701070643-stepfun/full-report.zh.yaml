      - number: '2.5'
        title: 增长驱动、价格竞争、算力约束和监管
        blocks:
          - type: paragraph
            body: >-
              三个结构性驱动有利于 StepFun。中国 2026 年 5 月 CAC / NDRC / MIIT《实施意见》是国内首个面向 AI agent 的国家级专门政策框架，正式定义 AI
              agent，并点名科研、制造、交通、金融、医疗、政务等 19 个优先部署场景。IDC 的「AI+」目标——2027 年智能设备 / agent 渗透率 70%、2030 年 90%，以及 2027 年中国
              top-1,000 企业中 80% 优先考虑 AI 主权——为国产、可嵌入模型创造持久需求。中国设备换新周期（AI 手机、GenAI PC、智能座舱）也在扩大嵌入式 AI 的物理触点。但同样的力量也构成约束。中国
              2023 年生成式 AI 办法和 2025 年 AI 内容标识规则（2025 年 9 月 1 日生效）对每一个已部署界面都施加持续的内容安全、数据和显性 / 隐性标识义务。算力获取在 2026 年 5 月 31
              日进一步收紧：U.S. Commerce Department 堵上漏洞，禁止中国总部企业通过海外子公司无许可证购买先进 Nvidia / AMD 芯片；出口管制从交付地延伸到所有权。价格压缩同样迅速：2026
              年上半年，中国实验室至少六次下调 API 价格，DeepSeek、Xiaomi MiMo 和 Kimi 将降价永久化，使每 token 价格比西方前沿 API 低 5-34x；StepFun 自己公布的
              step-3.5-flash 和 step-3.7-flash 费率也处于同一竞争区间，而不是溢价区间。信任也承压：中国主管部门已就 OpenClaw agent 平台上的植入木马假冒技能包发布高级别警示，而
              Step 3.5 Flash 正是在这个生态的使用量榜单靠前。最后，分发并不对称：ByteDance Doubao 单独就覆盖超过 500 million 部手机终端和超过 7 million 辆汽车，约比
              StepFun 已披露足迹高一个数量级；全球车企也越来越多与本地伙伴（Huawei HarmonyOS、XPeng、Momenta）共研面向中国的座舱 AI，而不是押注单一供应商。与此同时，中国基础模型层
              2025 年融资额约减半至约 22 笔、RMB 9.4 billion，独立玩家与这些更大平台竞争时可用资本更紧。
