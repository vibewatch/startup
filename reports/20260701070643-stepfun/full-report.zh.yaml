      - number: '3.4'
        title: 护城河耐久性、商品化风险和竞争者负面证据
        blocks:
          - type: paragraph
            body: >-
              StepFun 看起来最耐久的主张不是 benchmark 领先，也不是消费者触达，而是嵌入式多模态设备分发（手机预装和 Geely 汽车关系，见第二章）叠加对 AGI
              导向模型范围的明确、持续追求；若干同行已经降低了这一追求的优先级。这个楔子是真实的，但有条件：Xiaomi MiMo 系列已经通过同一设备渠道在使用量上超过 StepFun；Geely 自己 2026 年 4
              月「Full-Domain AI 2.0」材料也描述了多供应商、越来越内生化的座舱和 ADAS 战略，而不是排他依赖任何单一外部模型供应商。对于集中在一个 OEM 的关系来说，这是实质性替代风险。


              负面证据不止来自某一个竞争者。第一，资本获取：Zhipu 和 MiniMax 已经上市，Moonshot 以 $20 billion 估值融资，DeepSeek 以超过 $50 billion
              估值融资（后者还获得 National AI Industry Investment Fund 直接且有投票权的投资），这些资本基础都比 StepFun 报道中的近 $2.5 billion IPO
              前轮更深、更透明。第二，消费者品牌：StepFun 的 Yuewen 应用在披露 MAU 上落后本章所有具名竞争者；与 Doubao（336-345 million）或即便 DeepSeek 自有消费者应用（约
              139 million）相比，差距至少一个数量级。第三，benchmark 不透明：关于中国 LLM 排行榜的独立评论指出，测试集泄漏和刷榜风险（有争议的 C-Eval
              结果、未披露方法论的自报分数）会降低外界对任何单一供应商自报排名的信心，StepFun 也包括在内，除非结果得到独立复现。第四，商品化：2026 年 API 价格战由 DeepSeek、Xiaomi 和
              Moonshot 发起并维持，不是 StepFun；这意味着 StepFun 必须在资金更厚的对手设定的价格底部里保住利润，而不是掌控这个底部。上述证据并未抹掉 StepFun
              的设备楔子，但意味着这个楔子——而非 benchmark 排名、应用规模或资产负债表深度——才是本章找到的唯一耐久相对优势。
