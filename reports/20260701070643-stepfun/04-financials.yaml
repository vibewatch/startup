company:
  name: StepFun
chapter:
  number: 4
  title: Financials
  summary: 'StepFun publishes an unusually granular official rate card and shows real device- and enterprise-partner
    traction, but its financial underwriting case still rests almost entirely on third-party-reported
    numbers: a roughly RMB500 million 2025 revenue figure that appears to fall short of the company''s
    own roughly RMB1 billion mid-2025 guidance, a roughly $10 billion cornerstone IPO valuation target
    with no audited statement behind it, and no public disclosure of cash, burn, runway, or gross margin.
    Independently reviewed 2026 registered-capital and Hong Kong entity filings confirm StepFun is actively
    preparing to list, but until an audited prospectus closes the gap, this chapter treats StepFun as
    commercially credible yet still financially opaque.'
sections:
- id: revenue-model-and-pricing
  title: 'Revenue model and pricing: official rate cards are visible, realized economics are not'
  body: 'StepFun''s official open platform publishes an unusually granular rate card across text, vision,
    and audio models, with per-1M-token pricing for step-3.7-flash, step-3.5-flash, and step-1o-turbo-vision,
    plus separate usage pricing for realtime speech, text-to-speech, internet search, and file storage.
    That list-price transparency is real, but it sits alongside an explicit strategy statement: in July
    2025 a StepFun vice president said the company deliberately avoids both highly customized project
    delivery, which loses to open-source substitution, and pure token-priced APIs, which large platforms
    can commoditize by bundling model access with cloud sales. Instead, StepFun frames its commercialization
    around productized to-B and to-C revenue with device partners across phones, cars, IoT, and embodied
    robotics, plus vertical partnerships such as a dedicated finance joint venture and cooperation with
    Guotai Haitong. Independent reporting adds that enterprise services reportedly cover multiple Fortune
    500 clients and that AgentAPI call volumes have grown significantly, but neither claim is independently
    corroborated with company-disclosed figures, and a chip-adaptation licensing channel with domestic
    chip vendors adds a further, still-unquantified revenue surface. The result is a company with more
    visible pricing mechanics than most private AI peers, but no public bridge from any of these surfaces
    to realized, segment-level revenue.'
