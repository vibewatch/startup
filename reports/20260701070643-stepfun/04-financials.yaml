- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: StepFun shows reasonable revenue and partnership visibility, but cost, margin, and capital-adequacy
    visibility remain weak across every commercial line, and compute intensity stays high even where domestic
    chips substitute for Nvidia GPUs.
  data:
    columns:
    - Revenue visibility
    - Cost visibility
    - Capital dependence
    - Underwriting confidence
    rows:
    - label: Direct API / token business
      values:
      - label: high
        tone: positive
        detail: Official rate cards are public.
      - label: low
        tone: warning
        detail: No public cost-of-serving or margin data.
      - label: medium
        tone: neutral
        detail: Token business still depends on rented or owned compute.
      - label: medium
        tone: neutral
        detail: Good list-price visibility, weak realized-economics visibility.
    - label: Device / OEM licensing (phones, cars, IoT)
      values:
      - label: medium
        tone: positive
        detail: Partnership counts and device examples are public.
      - label: low
        tone: warning
        detail: No per-device fee or revenue-share disclosure.
      - label: high
        tone: warning
        detail: Ties revenue to OEM shipment cycles and a 30%-60% reported revenue-share norm.
      - label: low
        tone: warning
        detail: Revenue can be described but not modeled with confidence.
    - label: Enterprise & vertical deals (finance, content, retail)
      values:
      - label: medium
        tone: neutral
        detail: Named cooperation agreements exist but contract terms do not.
      - label: low
        tone: warning
        detail: No delivery-cost or gross-margin disclosure.
      - label: medium
        tone: neutral
        detail: Custom-delivery risk is explicitly flagged by StepFun's own leadership.
      - label: low
        tone: warning
        detail: Existence is visible; economics are not.
    - label: Domestic chip-alliance / compute strategy
      values:
      - label: low
        tone: neutral
        detail: This is a cost-mitigation strategy, not a revenue line.
      - label: medium
        tone: neutral
        detail: Throughput claims exist, but StepFun's own compute spend is not disclosed.
      - label: high
        tone: warning
        detail: Frontier-model inference stays capital intensive even with domestic-chip substitution.
      - label: low
        tone: warning
        detail: Alliance progress is reported as adaptation-stage, not yet ecosystem-scale.
    - label: External financing & IPO path
      values:
      - label: medium
        tone: neutral
        detail: Funding tranches and IPO terms are reported publicly.
      - label: low
        tone: warning
        detail: No cash, burn, or debt disclosure exists.
      - label: high
        tone: positive
        detail: Multiple 2026 financing tranches show real external capital access.
      - label: medium
        tone: neutral
        detail: Capital access is visible; capital adequacy is not.
