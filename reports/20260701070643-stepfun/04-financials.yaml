- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Audited financial statements / HKEX prospectus
    - Without them, revenue, margin, and loss figures remain third-party estimates only
    - Request the filed A1/PHIP prospectus once available on HKEXnews, or a management-shared audited
      2025 annual report.
  - - Cash, burn, and runway
    - Capital adequacy cannot be underwritten from revenue reporting alone
    - Request monthly cash-flow statements and a 12-24 month runway model under base/downside growth.
  - - Segment gross margin and unit economics
    - Cannot tell whether the device/enterprise mix is profitable or subsidized
    - Request segment P&L and per-partner contribution margin for the top device and enterprise accounts.
  - - Device/OEM revenue-share terms
    - Industry-norm 30%-60% take rates could materially change realized StepFun revenue
    - Request named-partner contract terms or at least an aggregate blended take-rate disclosure.
  - - Compute cost and chip-alliance economics
    - The domestic-chip alliance reduces some GPU dependency, but its cost/performance benefit is not
      separately quantified
    - Request StepFun's compute spend by chip vendor and any resulting unit-cost savings versus Nvidia-based
      inference.
  - - Reconciliation of 2025 revenue guidance vs. outturn
    - The roughly RMB1 billion mid-2025 target versus the roughly RMB500 million reported outturn is unreconciled
    - Request management commentary on the gap and updated 2026 guidance cadence.
  notes: These are the core blockers preventing a clean public-only underwriting case on StepFun as of
    2026-07-01.
