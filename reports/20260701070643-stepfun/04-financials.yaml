- id: gtm-and-device-partnerships
  title: 'GTM motion and device partnerships: distribution is real, sales efficiency proxies are not'
  body: 'StepFun''s go-to-market motion looks device-led rather than purely developer-led. ZTE''s Nubia
    Z80 Ultra was reported as the first smartphone to natively embed StepFun''s OpenClaw AI agent inside
    the operating system rather than as a separate app, and Tencent Cloud signed a strategic cooperation
    agreement with StepFun to build an ''AI Cockpit Agent'' linking Tencent''s music, video, maps, payment,
    and mobility services for in-vehicle use, deepening a relationship that started with Tencent''s Series
    B investment. Reporting also describes StepFun''s recent fundraising rounds as concentrated with consumer-electronics
    supply-chain investors -- Huaqin, Longcheer, OmniVision, and ZTE -- rather than purely financial backers,
    and says StepFun''s smartphone Agent partnerships covered more than half of China''s leading domestic
    phone brands as of mid-2025. That concentration cuts both ways: it gives StepFun real, named distribution
    partners, but it also ties near-term revenue growth to the shipment cycles and negotiated terms of
    a small number of manufacturers. None of the sources reviewed here disclose a customer-acquisition
    cost, payback period, net revenue retention figure, or contract-level pricing for any device or enterprise
    deal, so this chapter cannot verify whether the distribution is efficient or merely visible.'
  claimRefs:
