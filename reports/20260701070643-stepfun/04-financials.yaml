callouts:
- calloutType: insight
  title: StepFun already publishes rate-card pricing that rivals larger peers, paired with an explicit
    anti-commoditization strategy
  body: Official docs show granular per-model, per-modality pricing, while leadership has publicly rejected
    both custom-delivery and pure-API business models in favor of device- and vertical-partner distribution
    -- a clearer stated strategy than many private AI peers disclose.
  claimRefs:
  - CI001
  - CI005
  - CI007
  - CI008
- calloutType: risk
  title: A mid-2025 revenue target of roughly RMB1 billion was not met; the reported ~RMB500 million 2025
    outturn is about half of that guidance
  body: StepFun's own leadership targeted roughly RMB1 billion of full-year 2025 revenue in July 2025;
    the RMB500 million figure Caijing later reported for full-year 2025 implies a substantial shortfall
    that no source reviewed here reconciles.
  claimRefs:
  - CI016
  - CI017
  - CI035
- calloutType: recommendation
  title: Treat revenue, margin, and IPO figures as third-party-reported signals until an audited prospectus
    is available
  body: Caijing, Sina Finance, AsiaICT, and BigGo Finance provide directionally useful numbers, but this
    chapter still lacks a directly reviewed StepFun financial statement or HKEX filing to close the core
    underwriting loop on margin, cash, and burn.
  claimRefs:
  - CI018
  - CI036
  - CI037
  - CI038
