  topStrengths:
    - 真实、具名的设备级量产证明：OPPO、Honor、ZTE 和 Geely（经 Qianli）都在量产硬件中交付由 StepFun 驱动的功能，不是试点。
    - 2026 年融资冲刺创纪录——Series B+ 超过 RMB5 billion、近 $2.5 billion 的 pre-IPO 轮，加上 HKIC 和产业投资方背书——显示资金来源很深，也在变多元。
    - 独立佐证的成本效率架构（稀疏 MoE 路由、MFA/AFD 注意力设计）是真正技术差异点，不只是基准测试包装。
    - 创始人与市场匹配度强：CEO Jiang Daxin（前 Microsoft VP）和领导层来自 ByteDance、Microsoft Bing 以及 ResNet 研究谱系。
  topRisks:
    - $10-12 billion IPO 目标对据报道 2025 年收入 $73.3 million 隐含 57-68x forward revenue multiple，但公司没有可用的审计财报或已递交招股书。
    - CSRC 推动的红筹离岸架构拆除，以及 2026 年密集监管日程，带来上市 timing 和执行风险。
    - 董事长 Yin Qi 同时担任 Qianli Technology 董事长；Qianli 是 StepFun 唯一已验证的汽车分发伙伴，并且过去四个已披露期间有三个核心净利润为负，治理和渠道风险集中在这段关联关系上。
    - 没有来源披露付费客户数、留存 / NRR、合同条款或股权结构；StepFun 自有 Yuewen 消费 app 虽有 40M+ 设备安装，在独立 MAU 排名中仍落后对手。
  unresolvedGaps:
    - 没有公开的经审计 2025 财报、现金头寸、烧钱速度或毛利率。
    - 完整股权结构和董事会名单仍未披露，包括 HKIC 和国资持股比例。
    - 最终 IPO 定价、融资规模和基石锁定条款尚未确定。
    - 设备与 OEM 伙伴收入分成条款（Geely、OPPO、Honor、ZTE）未披露，因此无法核实 40M+ 设备覆盖背后的 StepFun 实际经济性。
