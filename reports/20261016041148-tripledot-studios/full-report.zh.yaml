      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开来源中最清晰的财务时间线是资本形成加并购。Tracxn 记录截至 2022 年 B 轮融资 $202M；GamesIndustry.biz 报道 2021 年 $78M、2022 年
              $116M，用于扩大游戏产品和收购能力。此后 Tripledot 继续通过收购改变收入基础：AppLovin 称其移动游戏剥离交易于 2025 年 6 月完成，支付 $400.0M 现金加约相当于
              Tripledot 全面摊薄股权 20% 的股权，并转让 10 家游戏工作室。GamesIndustry.biz 随后报道 2026 年 8 月又收购 Supersonic，交易额
              $40M。由此可见，融资依赖已较少取决于早期募资，更多取决于被收购组合能否保持留存、高效变现，并避免增加保留证据未公开的类债务义务。
