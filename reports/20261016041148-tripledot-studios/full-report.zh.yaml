            - 可复用的运营方法论
        - label: 变现与增长
          detail: 据报道，合并后的投资组合同时覆盖应用内广告和应用内购买。
          modules:
            - 付费用户获取
            - 创意测试
            - 应用内广告
            - 应用内购买
          outputs:
            - 规模化流量获取
            - 多元化变现路径
        - label: 全球部署覆盖
          detail: 外部报道显示，AppLovin 交割后共有 23 座城市的 12 家工作室。
          modules:
            - 伦敦、华沙、巴塞罗那和雅加达核心办公室
            - 扩大的北美和亚洲布局
            - mobilestrikeapp.com 等产品专属站点
          outputs:
            - 更广的人才池
            - 更高的运营复杂度
        - label: 支持与社区触点
          detail: 公开足迹覆盖企业招聘页面、产品专属网站，以及 LinkedIn 上的大量受众。
          modules:
            - LinkedIn 招聘与雇主品牌触点
            - 企业品牌网站
            - 产品专属目的地网站
          outputs:
            - 更广的获客和支持触点
            - 需要梳理的服务归属更加分散
        - label: 控制与可靠性缺口
          detail: 保留的公开证据无法验证安全认证、状态报告或共享服务归属。
          modules:
            - 未保留公开信任中心证据
            - 未保留公开正常运行时间或事故报告
            - 未保留官方共享系统文档
          outputs:
            - 需要管理层控制材料包
            - 需要交割后架构图
    approximationNotes: 该图将公开来源综合成若干层次，是运营模式图，而非经验证的内部系统图。
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE012
      - CE015
      - CE016
  - id: FU001
    title: 从触达至变现的客户旅程
    type: journey-map
    summary: 公开证据支持广泛的漏斗顶端触达和多个获客触点，但无法支持持久的付费用户留存或集中度质量。
    data:
      items:
        - label: 广泛的玩家触达
          tone: positive
          detail: 25M+ 投资组合日活用户的说法指向规模化消费者使用。
          touchpoints:
            - 休闲玩家是该投资组合的直接用户
            - 日活证据具有方向性，并非产品级数据
        - label: 双重变现
          tone: neutral
          detail: 收入依靠免费游戏中的广告和应用内购买。
          touchpoints:
            - 广告主从非付费游戏中变现
            - 应用内购买者带来直接消费者支出
        - label: 付费获客引擎
          tone: positive
          detail: SensorTower 仍显示，上个季度美国市场营销活动力度很大。
          touchpoints:
            - 美国广告支出 $10M-$100M
            - 1B-50B 次曝光和 1K-10K 个创意素材
        - label: 运营中产品的验证
          tone: positive
          detail: Woodoku Blast 仍显示当前下载量和活跃用户区间。
          touchpoints:
            - 上季度美国下载量 500K-1M
            - 上季度美国活跃用户 100K-500K
        - label: 渠道扩张
          tone: positive
          detail: OEM 预装计划和并购把客户触达扩展到纯应用商店发现之外。
          touchpoints:
            - 通过 Xiaomi、OPPO、VIVO 和 Samsung 的库存进行 AVOW 预装
            - AppLovin 和 Supersonic 交易扩大了触达面
        - label: 持久性盲点
          tone: risk
          detail: 公开来源没有披露核心留存或集中度指标。
          touchpoints:
            - 没有公开 NRR、GRR、流失率或合同期限披露
            - 目录估算相互冲突，削弱了规模判断的精确性
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU006
