      - number: '3.3'
        title: 多元化增强韧性，但整合与不透明变现限制护城河证明
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的持久性信号是多元化：独立交易报道和 TFN 分析都认为合并后的组合应避免过度依赖任何单款游戏，这对爆款驱动的品类很重要。但同一证据也表明竞争持久性尚未完全证明。TFN
              将合并集团按收入列为独立移动游戏工作室前五，却也强调要把分布在 17 座城市的 2,500 名员工整合起来，同时 Miniclip 和 Playtika
              等对手仍在积极招聘。交割后公开员工代理数据仍不一致，指定来源也没有披露买方合同条款或单款游戏变现细节。因此可辩护的结论是“具备显著广度的规模化运营商”，而不是“定价能力尚未得到证明或已形成锁定效应的发行商”。
            claimRefs:
