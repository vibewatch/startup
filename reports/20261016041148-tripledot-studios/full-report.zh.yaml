      - number: '1.4'
        title: 里程碑与当前执行风险
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的里程碑模式是在快速扩张的休闲游戏基础上靠收购扩张。时间线从 2017 年成立、2021 年融资及扩张办公点，到 2022 年收购 Live Play Mobile、2024 年收购
              Zephyr Mobile、2025 年完成 AppLovin 游戏组合交易，以及 2026 年从 Unity 收购
              Supersonic。这一过程证明了真实的执行能力，但同一证据也突出当前最大风险：整合。Tech Funding News 将 AppLovin 投资组合既视为 $2 billion 的估值标志，也视为横跨 17
              座城市、2,500 名员工的重大整合挑战。在管理层提供更清晰的交易后运营指标、治理归属和整合责任之前，最稳妥的判断是：Tripledot 已证明自己能买下并吸收资产，但公开披露尚未证明合并后的公司究竟是什么样。
