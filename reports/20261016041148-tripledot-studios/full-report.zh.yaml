              - CV012
              - CV013
      - number: '8.3'
        title: 情景框架与估值立场
        blocks:
          - type: paragraph
            body: >-
              正确框架应是情景区间，而不是点估计。乐观情景要求合并后的 AppLovin 组合将总规模转化为持久净收入、稳定留存和整合后的运营杠杆，且没有新的优先权或杠杆意外。基准情景假设 2025
              年交易价格对规模化资产基础而言方向上公平，但在经审计财务、组合集中度和单款游戏贡献变得可见前，同一进入点的上行空间有限。悲观情景聚焦不利报道强调的同一风险：在移动游戏下载走弱、用户获取经济性仍具竞争的同时整合更大的业务版图，可能压缩收购规模的价值。这一组合支持对最后可见价格锚点持公平而非有吸引力的判断。
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应聚焦少数真正可能改变建议的文件。第一，投资者需要已签署的 AppLovin 收购协议和当前股权结构表，以确认全面摊薄 20%
              股权对价是否在公开报道之外造成治理权、信息权或清算权悬置。第二，管理层应提供经审计的合并净收入、EBITDA、总额到净额衔接，以及单款游戏或工作室集中度，以便将 2025
              年总规模叙事转化为估值框架。第三，公司应展示被收购工作室的整合 KPI，包括留存、长期运营表现和现金转化。如果交割结构被证明在新资金之上拥有比公开记录暗示的更高优先级，如果合并经营数据无法支持从 2021 年
              $500 million A 轮标记到 2025 年 $2.0 billion 交易标记的跃升，或交易后整合 KPI 明显恶化，论点就会失效。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
