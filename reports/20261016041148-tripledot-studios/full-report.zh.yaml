      - number: '3.2'
        title: 公开证据更支持运营模式比较，而非定价比较
        blocks:
          - type: paragraph
            body: >-
              保留来源更能说明这些发行商如何运营，而不是如何定价。SensorTower 将 Tripledot
              描述为专注用户获取、长期运营和数据驱动开发的休闲及超休闲发行商，因此它最接近靠快速测试和组合优化竞争、而非靠企业合同或专有平台竞争的同业。Voodoo 在高量级、重实验的休闲发行上最为重叠；Playrix
              更接近规模化休闲系列；Lilith 更宽，因为已覆盖移动和 PC 长期运营发行。MTG
              更像相邻的老牌组合持有人，而非同类工作室。相反，保留的公开页面都没有披露标准化单款游戏定价、广告组合或实际单位经济性，无法据此得出定价权结论。
