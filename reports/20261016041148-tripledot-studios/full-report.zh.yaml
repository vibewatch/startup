      - number: '8.2'
        title: 为什么公司值得关注，但还不足以给出买入判断
        blocks:
          - type: paragraph
            body: >-
              正面情景是，Tripledot 看起来是已被验证的整合商，而非投机性工作室。LinkedIn 和公司自有材料仍将业务描述为数据驱动、由资深团队领导；公开报道则显示公司在 AppLovin
              组合交易前后都持续收购资产。这一点很重要，因为滚动收购平台只有在运营纪律经受住整合后才值得溢价。反方是，公开数据集在真正决定进入回报的变量上弱得多。LeadIQ 只给出 $100 million-$250
              million 的宽泛年收入估计；MLQ 的规模说法使用总收入而非经审计净收入；Dealroom 称部分投资者隐藏，持股比例也仅供参考；当前公开员工信号与交易报道中的 2,500
              多名合并员工无法清晰对账。换言之，规模证据足以保持关注，但透明度不足以让投资者有信心追价。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
