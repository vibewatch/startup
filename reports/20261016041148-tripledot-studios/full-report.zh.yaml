  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模证据让 Tripledot 仍具投资价值，但经济效益不透明和整合风险将可支持的结论限制在跟踪。
    data:
      nodes:
        - id: scale
          label: 存在规模证据
          detail: 公开报道指向 $2.0B 的 2025 年交易价值、10 家收购的工作室，以及约 25M 日活用户。
        - id: culture
          label: 运营模式可信
          detail: 公司控制的材料仍强调资深管理层，以及数据驱动的获客和长线运营方法。
        - id: opacity
          label: 核心经济效益仍不透明
          detail: 公开收入仍只是宽泛估算，而持股比例和投资者持仓则明确不完整或仅具指示性。
        - id: risk
          label: 执行下行风险真实存在
          detail: 独立的不利报道凸显整合复杂度、监管审查和更严峻的用户获取条件。
        - id: discipline
          label: 仍需价格纪律
          detail: 在缺少经审计的合并经济数据和清晰权利结构的情况下，最后一个可见估值只是参考点，而不是买入邀请。
        - id: decision
          label: 结果：跟踪 / 公允
          detail: 公司值得继续尽调，但在最后一个可见估值下，证据包不足以支持买入建议。
      edges:
        - from: scale
          to: culture
          label: 支持关注
        - from: culture
          to: opacity
          label: 但无法消除
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: discipline
          label: 要求
        - from: discipline
          to: decision
          label: 决定建议
    approximationNotes: 这是定性决策链，而非加权评分模型。
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
      - CV013
