        title: 收入模式与公开增长信号
        blocks:
          - type: paragraph
            body: >-
              保留来源一致将 Tripledot 描述为数据驱动的免费移动游戏发行商，其运营闭环从用户获取和长期运营开始，而不是合同制企业销售或透明的按席位定价。AppsFlyer
              将该模式归因于对用户获取、变现和产品决策的日常优化；Sensor Tower 则强调休闲及超休闲游戏的留存和变现。公开规模数据远弱于公开模式数据：Tracxn 只给出 £100M-£500M 的 2022
              年收入区间，Sensor Tower
              最新运营代理指标也只是国家和单款游戏快照，而非合并组合收入或总流水。因此，收入引擎方向上可见，但收入质量仍取决于单款游戏组合、总额到净额扣除，以及应用内购买与广告之间的分成等私有披露。
