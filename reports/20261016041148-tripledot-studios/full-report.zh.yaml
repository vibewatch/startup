      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Tripledot 面向消费者获客，但内部采用预算驱动。终端用户是通过 iOS 和 Android
              商店触达的广泛移动玩家；付费方则分为应用内购买者和为广告变现玩法买单的广告主。因此可见的预算决策者不是企业采购团队，而是组合负责人、增长与用户获取团队、变现运营人员，以及决定广告支出、LiveOps
              投入和收购资本投向的发行或工作室管理者。Woodoku Blast 在美国上一季度的下载量和活跃用户区间表明，单款游戏靠应用商店触达和留存闭环扩张；收购 Supersonic
              则把市场路径扩展到混合休闲发行，而不只是内部孵化游戏。
            claimRefs:
              - CM004
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM012
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最明显的驱动因素是数据驱动迭代、组合广度，以及广告和应用内购买模式之间的变现多元化。主要约束是可比性和整合。LeadIQ 在 2026 年 8 月估计收入 $100M-$250M、员工约 586 人；这一数字与
              JobVFX 的 2,500 多名集团员工、LinkedIn 对 500 人旧团队的描述，以及交易后独立估计的近 $2 billion
              年收入都难以对账。因此，即便投资者尚未套用估值倍数，公开市场规模也已对分母高度敏感。出售后 AppLovin
              仍保留少数股权，意味着市场扩张不仅取决于需求增长，也取决于整合和治理执行。估值时，应更多依赖经验证的交易后报告和收入构成，而不是单看标题式 TAM。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合从单一工作室转向组合型发行商
        blocks:
          - type: paragraph
            body: >-
              AppLovin 组合收购改变了 Tripledot 的可比对象。公开交易报道和 Tripledot 交易后的定位都指向一个拥有多家工作室、全球化移动游戏组合且日活超过 25 million
              的公司，这已不同于狭窄的挑战者工作室。指定证据中 SensorTower 点名的 Lilith Games、MTG、Playrix 和 Voodoo 具有方向性参考价值，覆盖 Tripledot
              当前面对的几类对手：规模化移动发行商、更广泛的游戏组合，以及围绕效果营销运营的公司。GamesIndustry 的收购时间线也显示 Tripledot
              持续购买能力和目录广度，因此组合管理本身已成为竞争模式的一部分，而不是一次性应对。
