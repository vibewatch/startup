      - number: '4.4'
        title: 财务判断与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Tripledot
              像一家规模化消费游戏滚动收购平台，拥有可证明的庞大付费获客引擎，也愿意投入资本扩张组合，但公开透明度仍不足以清晰判断现金转化。当前最佳证据支持变现基础设施确实存在、收购活动规模较大，却不能证明当前现金跑道、契约余量或单款游戏贡献利润。AppLovin
              交易后第三方来源的员工披露也明显分歧，使生产率和烧钱估算不可靠。在管理层提供当前现金、债务、整合成本和单款游戏 cohort 数据前，稳妥判断是：Tripledot 的利润率路径看似可行，但整个组合仍未得到证明。
