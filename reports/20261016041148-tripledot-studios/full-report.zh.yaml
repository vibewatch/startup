  summary: >-
    Tripledot Studios
    是一家总部位于伦敦的移动游戏发行商和投资组合整合商，专注休闲及超休闲游戏、长期运营和收购扩张。证据仍支持其具备真实的消费者触达能力和数据驱动的运营模式，但合并后公司的经审计经营数据、所有权结构和单款游戏组合仍仅部分披露。
