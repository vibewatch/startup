chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Tripledot 将自己定位为数据驱动的移动游戏公司，集中提供工具、分析和工作室支持，而不是只运营单款游戏品牌。官方及第三方描述在核心模式上基本一致：Tripledot
              开发并发行休闲手游，重视用户获取和长期运营，并靠分析驱动迭代来改善留存与变现。稳定的身份信息比当前规模披露更可靠。公开来源一致将公司置于伦敦，并将运营起点追溯至 2017
              年，但对当前规模说法不一，对法律实体与集团边界也只提供部分信息。因此，身份、总部和商业模式可作为后文的可靠事实，而员工数、收入和用户规模仍是待核查事项。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO005
              - CO006
              - CO009
              - CO016
      - number: '1.2'
        title: 管理层、业务版图与治理
        blocks:
          - type: paragraph
            body: >-
              指定证据只呈现了部分公开管理层。LinkedIn Life 将 Lior Shiff 和 Akin Babayigit 列为可见领导者；AppsFlyer 案例研究引用 CMO Mark Beck
              介绍公司的分析驱动运营方式；Tech Funding News 还将 Eyal Chameides 与 Shiff、Babayigit 一同列为创始人。公司控制的公开资料称其拥有 500
              人，分布在伦敦、华沙、巴塞罗那和雅加达；但其他当前资料给出 586 或 609 名员工，连基本员工基准都尚未确定。更重要的是，指定来源均未清楚披露 AppLovin
              交易后的董事会构成、委员会结构、投票控制或整合责任归属。因此，投资者可以确认创始人曝光度和运营理念，却不能仅凭公开证据判断治理深度、继任准备度或少数股东保护。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
      - number: '1.3'
        title: 资本、所有权与规模标志
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的融资历史大致可见，但总额无法清晰对账。GamesIndustry 与 Tracxn 均记载 2021 年 4 月融资 $78 million、2022 年 2 月完成 $116
              million B 轮；公开投资者归因也反复提到 20VC、Eldridge Industries 和 Lightspeed Venture Partners。最近一次规模跃升来自 AppLovin
              投资组合交易：Business Insider 描述的临时结构包括 $500 million 现金、$400 million 股权及收购融资需求；AppLovin 后来表示，签署的交易于 2025 年 6 月
              30 日完成，支付 $400 million 现金加相当于 Tripledot 全面摊薄股权约 20% 的股权。这些事实清楚表明 2025
              年资本结构和所有权发生重大变化，但仍没有提供股权结构表、债务文件、优先股堆叠或精确的交易后稀释数据，无法据此建立干净的当前估值或控制权图谱。
            claimRefs:
