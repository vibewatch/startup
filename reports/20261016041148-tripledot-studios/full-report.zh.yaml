      - - 反方论点
        - 公开记录对净收入质量、优先权悬置和合并后员工队伍经济模型仍过于不透明，不足以支持在私有尽调前提前付出高价。
        - 若已执行交易产生了超出预期的更高顺位权利、单款游戏集中度比暗示的更糟，或交割后整合指标走弱，则下调判断。
