  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - AppLovin 产品组合顺利整合，规模增长转化为经审计的净收入增长，被收购工作室维持住留存和变现。
        - 随着规模和现金创造能力的证据同步改善，未来以高于 2025 年估值的定价轮或老股转让将具备支撑。
        - 执行疲劳、单款游戏集中度和隐藏的优先权条款仍然重要。
        - 需要经审计的合并经济数据和稳定的整合 KPI。
      - - 基准
        - 2025 年交易估值大致公允，但公司需要时间和更多披露，下一次估值上调才有依据。
        - 最近可见估值对应的回报看起来较为均衡，并非不对称，因此理性选择是保持价格纪律并继续跟踪。
        - 披露仍不完整，上行空间要等证据确认。
        - 与当前资料包最匹配。
      - - 悲观
        - 整合速度慢于计划，用户获取经济模型持续承压，合并后的财务质量或权利结构令人失望。
        - 2025 年的估值之所以显得过高，是因为规模没有转化为持久的净经济效益，也没有带来投资者保护。
        - 监管、执行和治理方面的意外同时叠加。
        - 如果交割后的 KPI 偏弱，或最终资本结构表比公开证据显示的更苛刻，就会印证这一判断。
    notes: 这些是方向性的投资判断框架，而非数值 DCF 输出，因为经审计的合并净收入、EBITDA 和清算优先权均未公开。
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV012
      - CV013
      - CV014
