  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              指定证据将 Tripledot 定位在移动休闲游戏，而非更宽泛的游戏市场。Sensor Tower 称其面向 iOS 和 Android 开发、发行休闲及超休闲游戏；JobVFX
              还提到混合休闲游戏、LiveOps、广告中介和面向消费者的网页商店基础设施。因此相关支出不只是游戏开发，还包括扩张移动游戏所需的付费获取、留存、变现和发行基础设施。公开资料中最接近的替代者是
              Playrix、Voodoo、Lilith Games 和 MTG 等规模化休闲及长期运营发行商，说明现状替代方案是另一家争夺玩家时间和获客预算的全球移动发行商，而非非游戏软件工具。
            claimRefs:
              - CM001
              - CM002
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              这里最好的公开规模证据受限且来自多个视角，而不是一个泛化 TAM。Sensor Tower 品牌页面仅美国就显示出较大的当前运营信号：上一季度广告支出为 $10M-$100M、曝光量为
              1B-50B，说明付费分发持续且有规模。交易层面，AppLovin 2025 年 7 月的官方交割通知称 Tripledot 以 $400.0 million 现金加约相当于其全面摊薄股权 20% 的股权收购
              10 家游戏工作室；2025 年 5 月的一份独立汇总预计，交割后公司将拥有 12 家工作室、覆盖 23 座城市和 25 million DAU，年收入接近 $2
              billion。这些数字的单位、时间口径和范围不一致，不能组成干净的 TAM/SAM/SOM，但合在一起比一句“移动游戏市场很大”更可信地界定了市场机会。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
