artifact: company-overview
slug: tripledot-studios
runDate: '2026-10-16'
company:
  name: Tripledot Studios
chapter:
  number: 1
  title: Company Overview
  summary: Tripledot Studios is a London-headquartered, 2017-founded mobile-gaming consolidator that now defines itself through data-driven operations and acquisition-led scale. The assigned evidence supports repeated fundraising and M&A execution, culminating in the 2025 AppLovin portfolio close and the 2026 Supersonic acquisition, but it does not reconcile current headcount, total funding, board composition, or consolidated post-close revenue with high confidence.
sections:
  - id: identity-and-positioning
    title: Identity and operating model
    body: 'Tripledot presents itself as a data-driven mobile-games company that centralizes tools, analytics, and studio support rather than operating as a single-title label. Official and third-party descriptions align on the core operating model: Tripledot builds and publishes casual mobile games, emphasizes user acquisition and live operations, and uses analytics-led iteration to improve retention and monetization. The stable identity points are stronger than the current scale disclosures. Public sources consistently place the company in London and trace its operating start to 2017, but they disagree on current size and provide only partial visibility into the legal-entity versus group-level perimeter. That makes identity, headquarters, and business model reusable ground truth for later chapters, while headcount, revenue, and audience scale remain diligence items rather than settled facts.'
    claimRefs:
      - CO001
      - CO002
      - CO003
    tableRefs:
      - TO001
  - id: leadership-footprint-and-governance
    title: Leadership, footprint, and governance
    body: "The assigned evidence identifies only a partial public leadership bench. LinkedIn Life names Lior Shiff and Akin Babayigit as visible leaders, while the AppsFlyer case study quotes CMO Mark Beck on the company’s analytics-led operating style; Tech Funding News also names Eyal Chameides alongside Shiff and Babayigit as founders. Public company-controlled profiles describe a 500-person organization spread across London, Warsaw, Barcelona, and Jakarta, but other current surfaces point to 586 or 609 employees, which means even the basic workforce baseline is unsettled. Just as important, none of the assigned sources cleanly discloses board composition, committee structure, voting control, or post-close integration ownership after the AppLovin transaction. Investors can therefore establish founder visibility and operating ethos, but not governance depth, succession readiness, or minority-holder protections from public evidence alone."
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO016
    tableRefs:
      - TO002
  - id: capital-ownership-and-scale
    title: Capital, ownership, and scale markers
    body: "Tripledot’s funding history is visible in broad strokes but not cleanly reconciled in totals. GamesIndustry and Tracxn line up on a $78 million round in April 2021 and a $116 million Series B in February 2022, and public investor attribution repeatedly points to 20VC, Eldridge Industries, and Lightspeed Venture Partners across those financings. The more recent scale step-change came from the AppLovin portfolio transaction: Business Insider described a provisional structure with $500 million of cash, $400 million of equity, and acquisition financing needs, while AppLovin later said the signed deal closed on June 30, 2025 for $400 million in cash plus equity equal to roughly 20% of Tripledot’s fully diluted equity. Those facts support a clear conclusion that capital structure and ownership changed materially in 2025, but they do not supply the cap table, debt documents, preference stack, or precise post-close dilution required for a clean current valuation or control map."
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO012
      - CO013
      - CO016
    tableRefs:
      - TO003
  - id: milestones-and-current-risk
    title: Milestones and current execution risk
    body: "Tripledot’s milestone pattern is acquisition-led expansion on top of a fast-scaling casual-games base. The chronology runs from founding in 2017 to 2021 financing and office expansion, the 2022 Live Play Mobile deal, the 2024 Zephyr Mobile acquisition, the 2025 closing of AppLovin’s games portfolio, and the 2026 Supersonic purchase from Unity. That sequence establishes real execution capacity, but the same evidence also highlights the main current risk: integration. Tech Funding News frames the AppLovin portfolio as both a $2 billion valuation marker and a significant integration challenge spanning 2,500 employees across seventeen cities. Until management provides cleaner post-close operating metrics, governance ownership, and integration accountability, the strongest overview judgment is that Tripledot has proved it can buy and absorb assets faster than public disclosures prove what the combined company now looks like."
    claimRefs:
      - CO003
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    figureRefs:
      - FO001
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - As of
      - Confidence
      - Gap
    rows:
      - - Headquarters
        - London, England
        - '2026'
        - medium
        - Public sources support London, but they do not map the full post-close legal-entity footprint.
      - - Founded
        - 2017 operating start; UK legal entity incorporated in 2016
        - '2026'
        - medium
        - Assigned sources distinguish the brand launch from the earlier legal-entity incorporation date.
      - - Headcount
        - 'Conflicting: 500 people (company page), 609 employees (LinkedIn Life), 586 employees (LeadIQ)'
        - '2026'
        - low
        - Needs management-confirmed combined headcount and geographic split after AppLovin integration.
      - - Total funding raised
        - 'Conflicting: $202M (Tracxn) vs $252M (LeadIQ)'
        - '2026'
        - low
        - Needs cap-table-backed financing schedule and treatment of any non-primary capital.
      - - Valuation
        - 'Directional only: TFN says the AppLovin deal valued Tripledot at $2B'
        - '2025'
        - low
        - Needs current share count, preference stack, and any debt or seller-financing documents.
      - - Revenue / run-rate
        - 'Public proxies only: LeadIQ estimates $100M-$250M annual revenue; Tracxn shows a £100M-£500M FY2022 UK-entity band'
        - '2026'
        - low
        - Needs audited consolidated 2025-2026 revenue and a legal-entity-to-group bridge.
      - - Audience / user scale
        - Official site says Tripledot entertains millions; TFN says the combined entity would have 25M daily active users
        - 2025-2026
        - low
        - Needs company-defined DAU/MAU and title-level mix after the AppLovin close.
      - - Locations
        - Company cites London, Warsaw, Barcelona, and Jakarta; TFN describes a 17-city post-close footprint
        - 2025-2026
        - medium
        - Needs a current site list with owned studios, publishing assets, and remote-team coverage.
    notes: Combines company statements and third-party proxies; low-confidence rows highlight unresolved perimeter, valuation, and post-close consolidation gaps.
    claimRefs:
      - CO002
      - CO003
      - CO005
      - CO006
      - CO009
      - CO016
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background / evidence
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - - Lior Shiff
        - Publicly named founder / leader
        - LinkedIn Life names Shiff among Tripledot leaders, and TFN names him as a founder.
        - Founding and operating continuity for the data-led studio thesis.
        - 'High: founders remain central to the public identity and there is little public succession detail.'
      - - Akin Babayigit
        - Publicly named founder / leader
        - LinkedIn Life names Babayigit among Tripledot leaders, and TFN names him as a founder.
        - Founding continuity plus outward-facing stakeholder credibility.
        - 'High: founder visibility is strong, but delegated governance coverage is thin in assigned sources.'
      - - Mark Beck
        - Chief Marketing Officer / analytics voice
        - AppsFlyer quotes Mark Beck as CMO, and LeadIQ lists a chief marketing officer matching that role.
        - Direct evidence that marketing and UA are run through analytics-heavy operating loops.
        - 'Medium: supports the data-driven thesis, but broader functional reporting lines are not public.'
    notes: Partial public subset only; assigned evidence does not disclose the full executive bench, board committees, or post-close integration ownership.
    enumerationScope:
      coverage: partial
      basis: Rows include only leaders directly identifiable in assigned public sources; this is not a complete executive or board roster.
    claimRefs:
      - CO004
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - - AppLovin
        - Seller and minority equity holder at close
        - AppLovin said it received cash plus equity equal to about 20% of Tripledot’s fully diluted equity and transferred 10 studios.
        - Obtain shareholder-rights terms, information rights, and any lock-up or governance side agreements.
      - - 20VC
        - Lead 2022 Series B investor
        - Tracxn and Business Insider both associate 20VC with Tripledot’s institutional investor set.
        - Request round documents, ownership %, pro rata rights, and any board-observer arrangements.
      - - Eldridge Industries
        - Repeat institutional investor
        - Tracxn and Business Insider both associate Eldridge with the 2021-2022 financing stack.
        - Confirm current ownership, liquidation preferences, and whether participation changed after the AppLovin deal.
      - - Lightspeed Venture Partners
        - Repeat institutional investor
        - Tracxn and Business Insider both associate Lightspeed with the 2021-2022 financing stack.
        - Confirm current stake, protective provisions, and any secondary transactions.
      - - Unity / Supersonic
        - 2026 asset-sale counterparty
        - Tripledot and GamesIndustry describe the August 2026 Supersonic purchase as a $40M deal that expands hybrid-casual publishing.
        - Review integration milestones, retained management, and any contingent purchase-price adjustments.
    notes: Maps only public counterparties and named investors visible in assigned evidence; it is not a cap table and does not prove current control.
    enumerationScope:
      coverage: partial
      basis: Covers only counterparties and investors explicitly named in assigned public sources, not every shareholder or contractual stakeholder.
    claimRefs:
      - CO009
      - CO012
      - CO013
      - CO015
