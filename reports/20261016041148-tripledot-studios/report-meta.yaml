companyProfile:
  summary: >-
    Tripledot Studios is a London-based mobile-games publisher and portfolio consolidator focused on casual and
    hyper-casual titles, live operations, and acquisition-led scale. The evidence still supports a real consumer reach
    engine and a data-driven operating model, but the combined company's audited economics, ownership structure, and
    post-close title mix remain only partially disclosed.
  headquarters: London, United Kingdom
  productSummary: Free-to-play casual and hyper-casual mobile games across a multi-title portfolio.
  customerFocus: Consumer mobile gamers
  businessModel: Free-to-play mobile games monetized through in-app purchases, advertising, and acquisition-led portfolio expansion.
