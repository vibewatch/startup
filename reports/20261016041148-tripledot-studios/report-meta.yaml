  topStrengths:
    - >-
      Scaled consumer reach and visible paid-acquisition activity suggest a real operating business rather than a paper
      roll-up.
    - Acquisition-led expansion has broadened the portfolio and increased strategic surface area.
    - The company appears to operate with disciplined, data-driven user acquisition and live-ops tooling.
  topRisks:
    - Audited combined revenue, EBITDA, debt, and preference-stack details remain undisclosed.
    - Retention, churn, and title-level concentration are not publicly visible.
    - Integration burden rises as the business folds in additional studios and distribution surfaces.
  unresolvedGaps:
    - Audited 2025 combined net revenue, EBITDA, and a gross-to-net bridge for the post-AppLovin business.
    - Signed debt documents, current principal balance, maturity profile, and covenant package.
    - Current cap table and liquidation preferences, including AppLovin's exact information or governance rights.
    - Title-level revenue, DAU, retention, and gross-to-net mix across the acquired and legacy portfolio.
    - Full board composition, committee structure, and post-close integration ownership.
