summary:
  headline: >-
    Tripledot looks like a credible scaled mobile-gaming platform with a directionally defensible implied ~$2.0 billion
    post-close mark, but audited revenue quality, debt, and preference-stack opacity keep the most supportable call at
    track rather than buy.
