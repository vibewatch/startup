  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-governance
      missingEvidence: Current cap table, shareholder agreement, liquidation preferences, information rights, and any debt or vendor-financing package linked to the AppLovin close.
      whyItMatters: Governance rights and downside waterfall determine whether public growth claims translate into investable common-equity economics.
      diligencePath: Request the executed SPA, debt instruments, shareholder agreement, and a post-close fully diluted capitalization table.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001, TR003]
    - type: private-evidence-only
      severity: blocking
      topic: combined-portfolio-economics
      missingEvidence: Audited combined revenue, EBITDA, title-level gross-to-net, DAU, retention, and cohort payback across legacy, AppLovin, and Supersonic assets.
      whyItMatters: Without portfolio economics, it is impossible to judge whether Tripledot's enlarged scale is improving ROAS and cash generation or masking margin compression.
      diligencePath: Obtain audited 2025 and YTD 2026 management accounts plus title-level KPI bridges for the top franchises.
      relatedQuestionRefs: [QR003, QR004, QR007]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
