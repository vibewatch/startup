chapter:
  number: 7
  title: Risks
  summary: >-
    Tripledot's highest residual risk is not simple game-market volatility but the execution and
    transparency burden created by serial acquisitions culminating in the AppLovin portfolio deal.
    Official and third-party sources agree the company absorbed a much larger multi-studio asset
    base, but they diverge on financing details and leave current cap-table, control, and
    post-close operating economics materially under-disclosed.
sections:
  - id: acquisition-and-governance-overhang
    title: Acquisition scale and ownership opacity are the top underwritten risks
    body: >-
      The public record supports a large step-change in operating complexity. AppLovin said the
      gaming-business sale closed on June 30, 2025 after regulatory requirements were satisfied,
      while Latham said the deal added 10 studios and materially expanded Tripledot in the US and
      Asia. That scale can be a strategic advantage, but the remaining public disclosure is too thin
      to underwrite downside cleanly. AppLovin's official statement says consideration included
      $400.0 million in cash plus roughly 20% of Tripledot's fully diluted equity and no promissory
      note, while Tech Funding News described a $250 million promissory note structure. That
      conflict matters because governance rights, leverage, covenants, and liquidation preferences
      determine how much room management has if portfolio performance softens after integration.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001, TR003]
    figureRefs: [FR001]
  - id: operating-model-and-performance-marketing-risk
    title: Analytics-led user acquisition is a moat, but also a failure mode
    body: >-
      Public product-market evidence depicts a company built around user acquisition, live
      operations, and measurement discipline. Sensor Tower describes Tripledot as optimized around
      user acquisition and retention, and its U.S. snapshot shows very large ad-spend, impressions,
      and creative ranges. AppsFlyer's case study sharpens the risk: Tripledot's own CMO says
      data that is off by 10% or 20% can translate into meaningful money in an ad-driven game.
      That means execution risk is not limited to creative performance; it extends to data quality,
      attribution reliability, and the ability to keep monetization and retention signals coherent
      while a much larger portfolio is folded in. Without audited cohort payback and title-level
      gross-to-net disclosure, the residual exposure remains high.
    claimRefs: [CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: integration-cadence-and-kill-criteria
    title: Repeated M&A and distributed teams raise integration and monitoring demands
    body: >-
      Tripledot's risk profile is now partly a portfolio-integration story rather than a single-studio
      execution story. GamesIndustry.biz shows a repeated acquisition cadence before and after the
      AppLovin transaction, including Zephyr Mobile, Live Play Mobile, and Supersonic. The current
      official LinkedIn profile says Tripledot has 500 people across four offices, while LeadIQ says
      approximately 586 employees across four continents; Tech Funding News then frames the
      AppLovin integration as 2,500 employees across 17 cities. Those figures are not directly
      reconcilable from public evidence, so the right kill criteria are operational rather than
      narrative: failure to publish audited combined economics, elevated leadership churn inside
      acquired studios, or evidence that studio autonomy is breaking portfolio-level ROAS and live
      operations discipline should all move the investment case toward stop or re-price.
    claimRefs: [CR006, CR007, CR011, CR012, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Financing transparency lags transaction size
    body: >-
      The largest residual risk is that public sources still do not reconcile the AppLovin deal's
      exact debt-like component, governance rights, and downside protections for existing investors.
    claimRefs: [CR002, CR005]
  - calloutType: insight
    title: Data discipline is both operational edge and operational fragility
    body: >-
      Tripledot's public operating model depends on precise attribution and cohort reporting, so
      integration mistakes can hit both growth and margin before they show up in top-line numbers.
    claimRefs: [CR008, CR009, CR010]
  - calloutType: recommendation
    title: Demand audited post-close economics before underwriting margin durability
    body: >-
      The portfolio may be diversified, but the investment case should stay conditional until
      combined title-level revenue mix, cohort payback, debt, and cap-table rights are documented.
    claimRefs: [CR002, CR014, CR016]
