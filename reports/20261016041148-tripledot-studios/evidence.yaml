      - QU006
  - type: conflicting-data
    severity: material
    topic: conflicting-scale
    missingEvidence: Reconciled management numbers for current headcount, revenue basis, and portfolio scope.
    whyItMatters: >-
      Public directories disagree materially on current scale, which weakens confidence in precise customer and
      monetization metrics.
    diligencePath: >-
      Request audited or board-level KPI packs that define gross revenue, net revenue, DAU, and employee counting
