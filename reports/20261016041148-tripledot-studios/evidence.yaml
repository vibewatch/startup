evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, committee structure, voting control, and post-close integration ownership.
    whyItMatters: >-
      Without governance detail, investors cannot assess decision rights, succession resilience, or minority-protection
      terms after the AppLovin close.
    diligencePath: >-
      Request the current board deck, cap table, shareholder agreement, and an updated leadership-org chart with
      committee memberships.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-certified combined employee count and site list after the AppLovin integration.
    whyItMatters: Public headcount figures diverge enough to distort operating-scale, integration-cost, and productivity judgments.
    diligencePath: Request HRIS headcount by legal entity, geography, and acquired studio as of the latest month-end.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing schedule showing primary capital, any secondaries, seller financing, and current ownership
      percentages.
    whyItMatters: >-
      Public funding totals and valuation proxies are inconsistent, which weakens any ownership or mark-to-market
      conclusion.
    diligencePath: Request financing documents for the 2021 and 2022 rounds plus the post-AppLovin cap table and debt package.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited consolidated 2025-2026 revenue, EBITDA, and title-level mix across legacy and acquired portfolios.
    whyItMatters: >-
      The assigned public sources provide only indirect or legal-entity-level revenue proxies, which are insufficient
      for a clean scale or valuation read.
    diligencePath: Request audited management accounts, legal-entity bridges, and post-close product P&Ls.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      An independent market report that segments casual, hyper-casual, and hybrid-casual mobile gaming by geography,
      monetization model, and buyer economics in a way that maps directly onto Tripledot’s portfolio.
    whyItMatters: >-
      Without that lens, valuation must lean on constrained operating metrics and transaction comps rather than on a
      clean SAM/SOM stack.
    diligencePath: >-
      Obtain current category data from a market-data vendor or public-company disclosure set that breaks out casual
      mobile revenue pools and monetization mix by region.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: denominator-variance
    missingEvidence: >-
      A reconciled bridge between legacy Tripledot entity metrics and the post-AppLovin group metrics for revenue,
      headcount, DAU, and studio count.
    whyItMatters: Mixed denominators make market-share, productivity, and valuation-multiple comparisons unreliable.
    diligencePath: >-
      Request post-close management reporting or investor materials that explicitly separate legacy, acquired, and
      consolidated metrics.
  - type: private-evidence-only
    severity: minor
    topic: buyer-map
    missingEvidence: Internal budget splits across user acquisition, LiveOps, publishing, and direct-to-consumer monetization channels.
    whyItMatters: >-
      Those allocations determine how much of Tripledot’s addressable opportunity is really budget-available in each
      segment.
    diligencePath: Ask management for portfolio-level marketing, monetization, and publishing budget ownership by title and channel.
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public title-level monetization mix, pricing mechanics, and realized unit economics across Tripledot and its
      closest peers.
    whyItMatters: >-
      Without normalized monetization detail, the chapter cannot prove whether Tripledot's edge is pricing power,
      ad-tech leverage, or just portfolio scale.
    diligencePath: >-
      Request portfolio-level monetization disclosures or third-party app-economics data that separates IAP,
      advertising, and title-level revenue concentration.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: post-close-people-scale
    missingEvidence: Consolidated post-close employee count by acquired studio, geography, and current operating status.
    whyItMatters: >-
      Integration burden and recruiting defensibility depend on the true combined operating footprint, which public
      profile pages currently proxy inconsistently.
    diligencePath: >-
      Obtain an updated org view or management disclosure that reconciles acquired-studio headcount with current active
      staffing.
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, debt principal, maturity schedule, covenant package, and management runway assumptions.
    whyItMatters: >-
      Without liquidity and financing obligations, public evidence cannot support a confident capital-adequacy view
      after the 2025-2026 acquisitions.
    diligencePath: Request the latest board package, debt agreements, treasury summary, and a 12-18 month management runway bridge.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Title-level LTV, CAC, payback, payer rate, ARPDAU, platform fees, ad-network take rates, and gross-margin bridges.
    whyItMatters: >-
      The public evidence shows marketing scale and analytics capability, but not whether portfolio-level revenue
      converts into attractive contribution margins.
    diligencePath: Request title-level cohort dashboards and a gross-to-net waterfall for the top revenue titles.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: material
    topic: post-acquisition-scale
    missingEvidence: Management-confirmed current headcount, studio count, and post-close organizational perimeter.
    whyItMatters: >-
      Conflicting public scale estimates weaken any inference about operating leverage, integration cost, or fixed-cost
      absorption.
    diligencePath: >-
      Request an org snapshot and post-close operating plan that reconciles legacy Tripledot, AppLovin gaming assets,
      and Supersonic.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public or management-backed disclosure of IAP price ladders, discount cadence, and monetization mix by title.
    whyItMatters: >-
      Pricing visibility is necessary to separate list-price optics from realized monetization quality and player
      concentration risk.
    diligencePath: Request a pricing matrix for the top titles plus realized payer-mix and discount data.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Official public or diligence-room evidence covering privacy controls, security certifications, uptime/status
      reporting, and incident-response practice across the live portfolio.
    whyItMatters: >-
      Without control evidence, the product chapter cannot underwrite reliability, security, or compliance quality for a
      scaled multi-studio gaming platform.
    diligencePath: >-
      Request Tripledot's trust-center materials, certification letters, incident log, privacy architecture, and
      live-ops governance documentation by studio.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: shared-systems-architecture
    missingEvidence: >-
      An official architecture map showing which services, analytics systems, build pipelines, customer support tools,
      and backend components are shared across legacy and acquired studios.
    whyItMatters: >-
      Post-close value depends on real platform leverage, but the assigned public pool does not verify where
      centralization ends and studio-specific tooling begins.
    diligencePath: >-
      Request an engineering architecture review with system owners, deployment boundaries, and a pre/post-acquisition
      integration roadmap.
    relatedQuestionRefs:
      - QE003
      - QE004
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: title-level-operating-kpis
    missingEvidence: >-
      Studio-level DAU, retention, revenue, gross-to-net, and support metrics across legacy titles and the acquired
      AppLovin portfolio.
    whyItMatters: Portfolio diversification and integration quality cannot be properly judged from aggregate public counts alone.
    diligencePath: >-
      Request a title-by-title operating KPI pack plus post-close dashboards showing concentration, monetization mix,
      and live-ops performance.
    relatedQuestionRefs:
      - QE002
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Quantified NRR, GRR, churn, cohort retention, or repeat-purchase metrics by title or portfolio cohort.
    whyItMatters: Customer reach looks real, but investment conviction depends on whether that reach renews and monetizes durably.
    diligencePath: >-
      Request cohort dashboards by title and geography plus the internal definitions used for retention and payer
      conversion.
    relatedQuestionRefs:
