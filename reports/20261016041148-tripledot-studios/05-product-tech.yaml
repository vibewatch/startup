schemaVersion: "report-v2"
artifact: "product-tech"
slug: "tripledot-studios"
runDate: "2026-10-16"
company:
  name: "Tripledot Studios"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Tripledot's product stack is best understood as a scaled mobile-game portfolio plus a
    centralized data, user-acquisition, and live-operations operating model rather than a
    single software SKU. The 2025 AppLovin transaction materially expanded the studio and
    franchise footprint, but the assigned public evidence still leaves meaningful gaps around
    shared systems ownership, security controls, and post-close integration quality.
sections:
  - id: "portfolio-footprint"
    title: "Product footprint is a portfolio of mobile-game studios and franchises"
    body: |
      The retained evidence describes Tripledot as a mobile-game developer and publisher that
      builds casual and hyper-casual titles for iOS and Android, then scales them with
      data-driven development, live operations, and paid user acquisition. That operating model
      changed materially in 2025 when Tripledot closed the purchase of AppLovin's mobile gaming
      business, adding ten studios and well-known franchises such as Wordscapes, Project
      Makeover, Cooking Madness, West Game, and Clockmaker. GamesIndustry's company page also
      shows that this was not a one-off transaction: the portfolio had already expanded through
      Live Play Mobile in 2022 and Zephyr Mobile in 2024, and it kept consolidating with the
      2026 Supersonic acquisition. For diligence, this means the "product" is a portfolio and
      operating platform whose value depends on managing title mix, studio integration, and
      monetization diversity across many assets rather than on one flagship app.
    claimRefs: ["CE001", "CE003", "CE004", "CE008"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "operating-model"
    title: "The operating model appears analytics-led, but public architecture proof is thin"
    body: |
      Tripledot's own LinkedIn language and Sensor Tower's publisher description both point to a
      repeatable operating model: small teams move titles from conception to launch, then iterate
      using analytics, live ops, and performance marketing. Sensor Tower's U.S. ad-spend,
      creative-volume, and active-user ranges reinforce that this is a scaled user-acquisition
      machine rather than a pure organic-download publisher, while Mobile Marketing Reads says the
      AppLovin acquisition broadened the combined company across both in-app advertising and
      in-app purchase monetization. The one concrete public tooling signal in the assigned pool is
      LeadIQ's third-party attribution of Docker, GitLab CI, Redis, and Zendesk, which is useful
      as directional evidence of a modern live-service toolchain but not strong enough to verify
      shared infrastructure, build pipelines, or service ownership across acquired studios.
    claimRefs: ["CE002", "CE006", "CE012", "CE013"]
    tableRefs: ["TE003"]
  - id: "deployment-and-dependencies"
    title: "Deployment reach is global, but the public evidence is still aggregate"
    body: |
      The public record shows a globally distributed operating footprint, but mostly at aggregate
      rather than system-level resolution. Mobile Marketing Reads says the combined company would
      operate 12 studios across 23 cities and more than 2,500 employees after the AppLovin deal,
      while LinkedIn's official surfaces point to core offices in London, Warsaw, Barcelona, and
      Jakarta plus broad hiring across engineering, data science, art, and design functions. In
      addition, Sensor Tower's "top website" field points to mobilestrikeapp.com, implying that
      Tripledot's live portfolio now includes title-specific web surfaces beyond the corporate
      brand site. What remains missing is official documentation showing which shared services,
      backend components, and support layers are centralized versus studio-specific, so deployment,
      reliability, and integration judgments remain partly inferential.
    claimRefs: ["CE005", "CE009", "CE010", "CE014"]
  - id: "controls-and-risks"
    title: "Integration and control visibility are the main technical risks"
    body: |
      The highest-confidence public milestone is that the AppLovin deal actually closed with
      regulatory approvals, which removes transaction-closing uncertainty but does not clear the
      much harder post-close execution questions. Mobile Marketing Reads highlights a concrete
      integration challenge: Machine Zone had already seen leadership layoffs, and Tripledot's
      historical strength in casual games may not map cleanly onto acquired midcore and 4X
      studios. Public staffing signals are also inconsistent across Tripledot's own LinkedIn
      surfaces, which makes capacity planning hard to underwrite from public evidence alone.
      Most importantly, the assigned pool does not verify public security certifications, uptime
      disclosures, privacy controls, or incident-response transparency, so trust and quality
      controls should be treated as open diligence items rather than demonstrated strengths.
    claimRefs: ["CE011", "CE015", "CE016"]
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns:
      - "module / asset / product line"
      - "user"
      - "status / maturity"
      - "differentiation"
      - "diligence gap"
    rows:
      - ["Legacy casual portfolio", "Mass-market mobile puzzle / card players", "Mature / live", "Data-led casual publishing motion already operating before the 2025 acquisition", "Need title-level retention and gross-to-net metrics by game."]
      - ["AppLovin acquired casual franchises", "Existing mobile players of titles such as Wordscapes and Project Makeover", "Closed into portfolio on 2025-06-30", "Adds scaled, already-distributed franchises and studio count", "Need studio-by-studio system ownership and live-ops integration plan."]
      - ["Acquired midcore / 4X studios", "Higher-engagement strategy players", "Newer to Tripledot's historical focus", "Broadens genre mix beyond legacy casual concentration", "Need evidence on genre-specific product leadership and roadmap continuity."]
      - ["Portfolio monetization mix", "Players and ad buyers", "Active / diversified", "Public coverage says the combined portfolio spans both in-app purchases and in-app advertising", "Need audited revenue split and shared ad-tech dependencies."]
      - ["Title-specific web surfaces", "Players seeking game-specific content and support", "Observed in public market-data surface", "Suggests portfolio-level distribution beyond the corporate website", "Need confirmation of ownership, purpose, and support obligations for each site."]
    notes: "Rows mix official, trade-press, and market-data evidence; public figures describe portfolio-level scale, not audited per-title KPIs or technical ownership."
    claimRefs: ["CE003", "CE004", "CE006", "CE014"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "user job"
      - "current workflow"
      - "company solution"
      - "measurable benefit"
      - "limitation"
    rows:
      - ["Acquire new players", "Run large paid-user-acquisition campaigns across app stores and mobile ad inventory", "Scaled creative testing and paid distribution across Tripledot's portfolio", "Sensor Tower shows U.S. ad spend of $10M-$100M, 1B-50B impressions, and 1K-10K creatives last quarter", "Public data does not show CAC, payback, or channel efficiency by title."]
      - ["Launch and iterate new titles", "Small teams move from concept to launch with continuous testing", "Indie-style teams using creativity plus data from conception to launch", "Supports faster iteration and a reusable studio playbook", "No official public engineering docs verify the shared tooling or release pipeline."]
      - ["Monetize and retain existing players", "Operate live games with ad and IAP monetization loops", "Combined portfolio reportedly deepens both in-app advertising and in-app purchase capability", "Should diversify monetization and reduce reliance on a single title if execution holds", "No public source in the assigned pool verifies post-close revenue mix by studio or title."]
      - ["Support a broader global portfolio", "Coordinate many studios across regions and genres after acquisitions", "Tripledot adds operating footprint, talent, and franchises through repeated M&A", "Should widen the asset base and talent pool", "Integration complexity rises as acquired studios differ in genre, geography, and legacy systems."]
    notes: "Benefits are based on retained public metrics and stated operating model; they should not be read as verified unit economics or post-close integration outcomes."
    claimRefs: ["CE002", "CE006", "CE008", "CE013", "CE015"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "layer / process / component"
      - "role"
      - "dependency"
      - "risk"
    rows:
      - ["Studio portfolio layer", "Owns franchises, content pipelines, and game-specific operations", "Dependence on acquired studio leadership continuity and knowledge transfer", "Genre and studio heterogeneity can slow integration and roadmap coordination."]
      - ["Analytics / experimentation layer", "Supports data-led design, rapid prototyping, and live-ops iteration", "Needs shared telemetry, experimentation, and decision cadence across studios", "Assigned pool does not verify whether analytics systems are centralized or title-specific."]
      - ["Monetization / marketing layer", "Runs user acquisition and monetization across ads and IAP", "Depends on creative production, performance marketing, and ad-tech execution", "Large spend without CAC or payback disclosure makes efficiency hard to underwrite."]
      - ["Engineering toolchain signal", "Third-party surfaces attribute Docker, GitLab CI, Redis, and Zendesk to Tripledot", "Depends on outside enrichment quality because no official architecture doc is retained", "These tools may represent only part of the organization and not the acquired studios."]
      - ["Trust / control layer", "Should cover privacy, security, uptime, and incident management for live games", "Would normally rely on public trust-center, status, or certification evidence", "Assigned sources do not verify public controls, so reliability and compliance posture remain open diligence items."]
    notes: "The first three rows are operating-model synthesis from retained sources, while the tooling row is third-party inferred and the controls row reflects missing public verification rather than demonstrated weakness."
    claimRefs: ["CE002", "CE012", "CE013", "CE015", "CE016"]
