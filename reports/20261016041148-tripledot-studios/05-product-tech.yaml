callouts:
  - calloutType: "strength"
    title: "Scale now comes from portfolio breadth, not one title"
    body: "The AppLovin close added ten studios and multiple franchises, while external coverage says no single post-close game should exceed 10% of net revenue."
    claimRefs: ["CE003", "CE007"]
  - calloutType: "risk"
    title: "Integration risk is operational, not transactional"
    body: "The transaction cleared regulatory approvals, but integrating casual and midcore studios amid pre-existing layoffs at Machine Zone remains the harder execution question."
    claimRefs: ["CE015", "CE016"]
  - calloutType: "insight"
    title: "Public architecture evidence lags product scale"
    body: "Tripledot shows clear scale in studios, creatives, and operating footprint, but the assigned source pool does not verify shared systems ownership or trust controls at the same level of detail."
    claimRefs: ["CE005", "CE012", "CE013"]
