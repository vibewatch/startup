  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Public title-level monetization mix, pricing mechanics, and realized unit economics across Tripledot and its closest peers.
      whyItMatters: Without normalized monetization detail, the chapter cannot prove whether Tripledot's edge is pricing power, ad-tech leverage, or just portfolio scale.
      diligencePath: Request portfolio-level monetization disclosures or third-party app-economics data that separates IAP, advertising, and title-level revenue concentration.
      relatedQuestionRefs: [QP009]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: material
      topic: post-close-people-scale
      missingEvidence: Consolidated post-close employee count by acquired studio, geography, and current operating status.
      whyItMatters: Integration burden and recruiting defensibility depend on the true combined operating footprint, which public profile pages currently proxy inconsistently.
      diligencePath: Obtain an updated org view or management disclosure that reconciles acquired-studio headcount with current active staffing.
