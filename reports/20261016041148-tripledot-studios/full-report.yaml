  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale proof keeps Tripledot investable, but economics opacity and integration risk cap the supportable call at
      track.
    data:
      nodes:
        - id: scale
          label: Scale proof exists
          detail: >-
            Public reporting points to a $2.0B 2025 transaction value, 10 acquired studios, and roughly 25M daily active
            users.
        - id: culture
          label: Operating model is credible
          detail: >-
            Company-controlled materials still emphasize veteran leadership and a data-driven approach to acquisition
            and live operations.
        - id: opacity
          label: Core economics remain opaque
          detail: >-
            Public revenue is still a broad estimate, while ownership stakes and investor holdings are explicitly
            incomplete or indicative.
        - id: risk
          label: Execution downside is real
          detail: >-
            Independent adverse coverage highlights integration complexity, regulatory review, and tougher
            user-acquisition conditions.
        - id: discipline
          label: Price discipline is still required
          detail: >-
            Without audited combined economics and a clear rights stack, the last visible mark is a reference point
            rather than an invitation to buy.
        - id: decision
          label: 'Result: track / fair'
          detail: >-
            The company merits continued diligence, but the evidence pack does not justify a buy recommendation at the
            last visible mark.
      edges:
        - from: scale
          to: culture
          label: supports interest
        - from: culture
          to: opacity
          label: but does not remove
        - from: opacity
          to: risk
          label: amplifies
        - from: risk
          to: discipline
          label: requires
        - from: discipline
          to: decision
          label: sets recommendation
    approximationNotes: This is a qualitative decision chain, not a weighted scoring model.
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
      - CV013
