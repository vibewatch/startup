          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Analytics-led user acquisition is a moat, but also a failure mode
        blocks:
          - type: paragraph
            body: >-
              Public product-market evidence depicts a company built around user acquisition, live operations, and
              measurement discipline. Sensor Tower describes Tripledot as optimized around user acquisition and
              retention, and its U.S. snapshot shows very large ad-spend, impressions, and creative ranges. AppsFlyer's
              case study sharpens the risk: Tripledot's own CMO says data that is off by 10% or 20% can translate into
              meaningful money in an ad-driven game. That means execution risk is not limited to creative performance;
              it extends to data quality, attribution reliability, and the ability to keep monetization and retention
              signals coherent while a much larger portfolio is folded in. Without audited cohort payback and
              title-level gross-to-net disclosure, the residual exposure remains high.
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR015
      - number: '7.3'
        title: Repeated M&A and distributed teams raise integration and monitoring demands
        blocks:
          - type: paragraph
            body: >-
              Tripledot's risk profile is now partly a portfolio-integration story rather than a single-studio execution
              story. GamesIndustry.biz shows a repeated acquisition cadence before and after the AppLovin transaction,
              including Zephyr Mobile, Live Play Mobile, and Supersonic. The current official LinkedIn profile says
              Tripledot has 500 people across four offices, while LeadIQ says approximately 586 employees across four
              continents; Tech Funding News then frames the AppLovin integration as 2,500 employees across 17 cities.
              Those figures are not directly reconcilable from public evidence, so the right kill criteria are
              operational rather than narrative: failure to publish audited combined economics, elevated leadership
              churn inside acquired studios, or evidence that studio autonomy is breaking portfolio-level ROAS and live
              operations discipline should all move the investment case toward stop or re-price.
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing transparency lags transaction size
            body: >-
              The largest residual risk is that public sources still do not reconcile the AppLovin deal's exact
              debt-like component, governance rights, and downside protections for existing investors.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
          - type: callout
            title: Data discipline is both operational edge and operational fragility
            body: >-
              Tripledot's public operating model depends on precise attribution and cohort reporting, so integration
              mistakes can hit both growth and margin before they show up in top-line numbers.
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: callout
            title: Demand audited post-close economics before underwriting margin durability
            body: >-
              The portfolio may be diversified, but the investment case should stay conditional until combined
              title-level revenue mix, cohort payback, debt, and cap-table rights are documented.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing history and current price context
        blocks:
          - type: paragraph
            body: >-
              The visible financing path is clear enough to establish direction but not enough to underwrite precision.
              Public reporting says Tripledot raised $78 million in Series A, then $116 million in Series B in February
              2022, while Tracxn places the 2021 Series A at a $500 million post-money valuation. The next major price
              anchor is not a fresh outside round but the 2025 AppLovin transaction, which multiple reports described as
              valuing Tripledot at roughly $2.0 billion. AppLovin's closing release is important because it says the
              sale ultimately closed for $400.0 million in cash plus equity representing about 20% of Tripledot's fully
              diluted equity, and specifically says no promissory note was issued at closing. That means the public
              record does support a large step-up in enterprise significance, but it does not yet provide a clean,
              current third-party financing mark with audited combined economics behind it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Why the company can justify interest but not a buy call
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Tripledot looks like a proven consolidator rather than a speculative studio.
              LinkedIn and company-authored material still frame the business as data-driven and veteran-led, while
              public reporting shows the company kept buying assets before and after the AppLovin portfolio deal. That
              matters because a roll-up can deserve a premium only if operating discipline survives integration. The
              pushback is that the public data set is much weaker on the variables that actually determine entry
              returns. LeadIQ only offers a broad $100 million-$250 million annual revenue estimate, MLQ's scale claim
              uses gross revenue rather than audited net revenue, Dealroom says some investors are hidden and its
              ownership stakes are only indicative, and current public employee signals do not reconcile cleanly with
              the 2,500-plus combined workforce cited in transaction coverage. In other words, there is enough proof of
              scale to stay engaged, but not enough transparency to pay up confidently.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The right framing is a scenario range rather than a point estimate. A bull case needs the combined
              AppLovin portfolio to convert gross scale into durable net revenue, stable retention, and integrated
              operating leverage without a new preference or leverage surprise. A base case assumes the 2025 transaction
              mark was directionally fair for a scaled asset base, but that upside from the same entry point is capped
              until audited financials, portfolio concentration, and title-level contribution become visible. A bear
              case centers on the same risk that adverse reporting emphasizes: integrating a much larger footprint while
              mobile-game downloads soften and user-acquisition economics stay competitive can compress the value of
              acquired scale. That combination supports a fair, not attractive, stance on the last visible price anchor.
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence round should focus on the few documents that could actually move the recommendation.
              First, investors need the executed AppLovin purchase agreement and the current cap table to confirm
              whether the fully diluted 20% equity consideration created any governance, information, or
              liquidation-right overhang beyond what is visible in public reporting. Second, management should provide
              audited combined net revenue, EBITDA, gross-to-net bridges, and title or studio concentration so the 2025
              gross-scale narrative can be converted into a valuation framework. Third, the company should show
              integration KPIs for the acquired studios, including retention, live-ops performance, and cash conversion.
              The thesis breaks if the closed structure proves more senior to new money than the public record implies,
              if combined economics fail to support the step-up from the 2021 $500 million Series A mark to the 2025
              $2.0 billion transaction mark, or if post-close integration KPIs deteriorate meaningfully.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
