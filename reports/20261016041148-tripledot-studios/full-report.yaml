              - CE007
          - type: callout
            title: Integration risk is operational, not transactional
            body: >-
              The transaction cleared regulatory approvals, but integrating casual and midcore studios amid pre-existing
              layoffs at Machine Zone remains the harder execution question.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: Public architecture evidence lags product scale
            body: >-
              Tripledot shows clear scale in studios, creatives, and operating footprint, but the assigned source pool
              does not verify shared systems ownership or trust controls at the same level of detail.
            calloutType: insight
            claimRefs:
              - CE005
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is broad consumer usage with a narrower payer set
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a mass-market consumer entertainment business, not an enterprise software
              sales motion. LinkedIn and SensorTower both position Tripledot as a mobile-games publisher built around
              casual titles, while Polaris7 explicitly describes casual mobile players as the direct users and app
              stores, advertisers, ad exchanges, and payment processors as the commercial counterparties. That means
              "customer" splits across user, payer, and channel: players create reach, a smaller payer cohort buys
              virtual items, and advertisers monetize non-paying play. The practical diligence implication is that
              adoption quality depends on title-level engagement and monetization mix, not just raw audience totals or
              logo-style distribution claims.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
      - number: '6.2'
        title: Public adoption proof is current enough to show live scale, but mostly at the top of funnel
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is directionally strong. ATDb and Bitscale both cite 25M+ daily active users across the
              portfolio, while SensorTower shows a still-active user acquisition engine with U.S. last-quarter ad spend
              of $10M-$100M, 1B-50B impressions, and 1K-10K creatives. The same SensorTower snapshot gives live title
              and channel proof: Woodoku Blast is shown as the top app with 500K-1M U.S. downloads and 100K-500K U.S.
              active users in the last quarter, and Mobile Strike is shown as the top website with 100K-500K U.S.
              visits. AppsFlyer's case study is older, but it is still useful because it includes named executive
              commentary about production cohort-data usage rather than a vague marketing endorsement.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU007
              - CU010
              - CU011
              - CU013
              - CU014
              - CU016
      - number: '6.3'
        title: Named proof is strongest in channels and operating counterparts, not in disclosed end-customer rosters
        blocks:
          - type: paragraph
            body: >-
              Tripledot does not publish a named roster of consumer customers, which is normal for a games publisher, so
              the best named proof comes from public channel and operating evidence. SensorTower's title and website
              snapshots show production usage surfaces rather than pilot artifacts, and the ATDb profile attributes OEM
              preload distribution to AVOW relationships with Xiaomi, OPPO, VIVO, and Samsung, including reported
              performance uplifts versus other preload channels. GamesIndustry and Polaris7 also indicate that recent
              reach expansion came partly through acquisitions, especially the AppLovin portfolio purchase and the later
              Supersonic deal. Together these sources support real distribution breadth, but they still do not answer
              which titles, geographies, or payer cohorts generate the most durable customer economics.
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
      - number: '6.4'
        title: Durability and concentration remain the main blind spots
        blocks:
          - type: paragraph
            body: >-
              The core diligence gap is not whether Tripledot has users; it is whether that user base converts and
              endures in a diversified way. None of the retained sources disclose GRR, NRR, churn, contract length,
              repeat-purchase cadence, or title-level concentration, so there is no public bridge from audience scale to
              durable payer quality. Private-company aggregators also disagree materially on current scale: LeadIQ
              estimates about 586 employees and $100M-$250M of annual revenue as of August 2026, while other third-party
              profiles point to much larger portfolio scale and ATDb describes a 2,500+ person global studio footprint.
              That conflict does not negate adoption, but it does lower confidence in any precise public customer or
              monetization metric until management provides title-level cohorts and a cleaner gross-to-net view.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence clears the "real adoption" bar
            body: >-
              The best support is not logos alone: current SensorTower title and web traffic ranges, plus third-party
              DAU estimates and named acquisition-channel evidence, indicate a live and scaled customer surface.
            calloutType: strength
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
          - type: callout
            title: Durability is still under-documented
            body: >-
              No retained source provides churn, GRR, NRR, contract-length, or title-concentration data, and directory
              estimates disagree on scale, so customer quality remains less proven than customer reach.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Acquisition scale and ownership opacity are the top underwritten risks
        blocks:
          - type: paragraph
            body: >-
              The public record supports a large step-change in operating complexity. AppLovin said the gaming-business
              sale closed on June 30, 2025 after regulatory requirements were satisfied, while Latham said the deal
              added 10 studios and materially expanded Tripledot in the US and Asia. That scale can be a strategic
              advantage, but the remaining public disclosure is too thin to underwrite downside cleanly. AppLovin's
              official statement says consideration included $400.0 million in cash plus roughly 20% of Tripledot's
              fully diluted equity and no promissory note, while Tech Funding News described a $250 million promissory
              note structure. That conflict matters because governance rights, leverage, covenants, and liquidation
              preferences determine how much room management has if portfolio performance softens after integration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
