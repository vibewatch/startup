  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product footprint is a portfolio of mobile-game studios and franchises
        blocks:
          - type: paragraph
            body: |
              The retained evidence describes Tripledot as a mobile-game developer and publisher that
              builds casual and hyper-casual titles for iOS and Android, then scales them with
              data-driven development, live operations, and paid user acquisition. That operating model
              changed materially in 2025 when Tripledot closed the purchase of AppLovin's mobile gaming
              business, adding ten studios and well-known franchises such as Wordscapes, Project
              Makeover, Cooking Madness, West Game, and Clockmaker. GamesIndustry's company page also
              shows that this was not a one-off transaction: the portfolio had already expanded through
              Live Play Mobile in 2022 and Zephyr Mobile in 2024, and it kept consolidating with the
              2026 Supersonic acquisition. For diligence, this means the "product" is a portfolio and
              operating platform whose value depends on managing title mix, studio integration, and
              monetization diversity across many assets rather than on one flagship app.
            claimRefs:
