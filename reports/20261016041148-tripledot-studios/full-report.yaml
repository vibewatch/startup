      - number: '5.2'
        title: The operating model appears analytics-led, but public architecture proof is thin
        blocks:
          - type: paragraph
            body: |
              Tripledot's own LinkedIn language and Sensor Tower's publisher description both point to a
              repeatable operating model: small teams move titles from conception to launch, then iterate
              using analytics, live ops, and performance marketing. Sensor Tower's U.S. ad-spend,
              creative-volume, and active-user ranges reinforce that this is a scaled user-acquisition
              machine rather than a pure organic-download publisher, while Mobile Marketing Reads says the
              AppLovin acquisition broadened the combined company across both in-app advertising and
              in-app purchase monetization. The one concrete public tooling signal in the assigned pool is
              LeadIQ's third-party attribution of Docker, GitLab CI, Redis, and Zendesk, which is useful
              as directional evidence of a modern live-service toolchain but not strong enough to verify
              shared infrastructure, build pipelines, or service ownership across acquired studios.
            claimRefs:
              - CE002
              - CE006
              - CE012
              - CE013
          - type: table
            tableRef: TE003
