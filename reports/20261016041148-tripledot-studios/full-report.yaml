            title: Breadth is visible; hard lock-in is not
            body: >-
              The best-supported moat signal is portfolio diversification after the AppLovin transaction. The
              weakest-supported area is pricing power or switching-cost proof, because the retained public evidence does
              not expose normalized title economics or customer-side procurement terms.
