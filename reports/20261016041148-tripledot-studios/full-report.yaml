  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently describe Tripledot as a data-driven free-to-play mobile publisher whose
              operating loop starts with user acquisition and live operations, not with contracted enterprise sales or
              transparent per-seat pricing. AppsFlyer attributes the model to daily optimization across user
              acquisition, monetization, and product decisions, while Sensor Tower separately frames the company around
              retention and monetization of casual and hyper-casual titles. Public scale data is much weaker than public
              model data: Tracxn gives only a broad £100M-£500M 2022 revenue band, and Sensor Tower's freshest operating
              proxies are country- and title-level snapshots rather than consolidated portfolio revenue or gross
              bookings. That means the revenue engine is directionally visible, but revenue quality still hinges on
              private disclosures around title mix, gross-to-net deductions, and the split between in-app purchases and
              advertising.
