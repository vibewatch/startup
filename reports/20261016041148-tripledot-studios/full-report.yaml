  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: |-
              The assigned evidence places Tripledot inside mobile casual gaming rather
              than the broader games market. Sensor Tower describes the company as a
              mobile game developer and publisher focused on casual and hyper-casual
              titles for iOS and Android, while JobVFX extends that description to
              hybrid-casual games, LiveOps, ad mediation, and direct-to-consumer web
              store infrastructure. That means the relevant spend is not just game
              development; it also includes the paid-acquisition, retention, monetization,
              and publishing infrastructure required to scale mobile titles. The closest
              public substitutes in the pool are other scaled casual and live-service
              publishers such as Playrix, Voodoo, Lilith Games, and MTG, which suggests
              the status quo alternative is another global mobile publisher competing for
              player time and acquisition budgets rather than a non-gaming software tool.
            claimRefs:
              - CM001
              - CM002
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: |-
              The best public sizing evidence here is constrained and multi-lens rather
              than a single generic TAM. Sensor Tower's brand page shows large current
              operating signals in the US alone, including a last-quarter ad-spend band
              of $10M-$100M and 1B-50B impressions, which indicates meaningful ongoing
              paid distribution. At the transaction level, AppLovin's official July 2025
              close notice says Tripledot acquired 10 game studios for $400.0 million in
              cash plus equity worth about 20% of Tripledot's fully diluted equity, and
              an independent May 2025 synthesis projected a 12-studio, 23-city, 25
              million-DAU company generating nearly $2 billion of annual revenue once the
              deal closed. Those figures are too mixed in unit, time basis, and scope to
              serve as a clean TAM/SAM/SOM stack, but together they bound the market
              opportunity more credibly than a single broad "mobile gaming is huge"
              estimate would.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
