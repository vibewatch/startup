      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The clearest financial chronology in public sources is capital formation plus M&A. Tracxn records $202M of
              funding through the 2022 Series B, and GamesIndustry.biz reports $78M in 2021 followed by $116M in 2022 to
              expand game offerings and acquisition capacity. Since then, Tripledot has continued to use acquisitions to
              change its revenue base: AppLovin says its mobile-games divestiture closed in June 2025 for $400.0M cash
              plus equity equal to roughly 20% of fully diluted Tripledot, and AppLovin also says the deal transferred
              10 game studios. GamesIndustry.biz then reports a further $40M Supersonic acquisition in August 2026. That
              pattern implies financing dependency is now tied less to early-stage fundraising and more to whether
              acquired portfolios sustain retention, monetize efficiently, and avoid adding debt-like obligations that
              are not publicly described in the retained evidence.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Tripledot looks like a scaled consumer-games roll-up with a demonstrably large
              paid-acquisition engine and a willingness to deploy capital into portfolio expansion, but it is still not
              publicly transparent enough for clean underwriting on cash conversion. The best current evidence supports
              confidence in the existence of monetization infrastructure and in the magnitude of acquisition activity,
              not in current runway, covenant headroom, or per-title contribution margins. Headcount disclosures also
              diverge sharply across third-party sources after the AppLovin transaction, which makes productivity and
              burn heuristics unreliable. Until management provides current cash, debt, integration-cost, and
              title-level cohort data, the prudent view is that Tripledot's margin path is plausible but unproven at
              portfolio level.
            claimRefs:
              - CI007
              - CI010
