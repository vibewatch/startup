      - number: '5.3'
        title: Deployment reach is global, but the public evidence is still aggregate
        blocks:
          - type: paragraph
            body: |
              The public record shows a globally distributed operating footprint, but mostly at aggregate
              rather than system-level resolution. Mobile Marketing Reads says the combined company would
              operate 12 studios across 23 cities and more than 2,500 employees after the AppLovin deal,
              while LinkedIn's official surfaces point to core offices in London, Warsaw, Barcelona, and
              Jakarta plus broad hiring across engineering, data science, art, and design functions. In
              addition, Sensor Tower's "top website" field points to mobilestrikeapp.com, implying that
              Tripledot's live portfolio now includes title-specific web surfaces beyond the corporate
              brand site. What remains missing is official documentation showing which shared services,
              backend components, and support layers are centralized versus studio-specific, so deployment,
              reliability, and integration judgments remain partly inferential.
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE014
      - number: '5.4'
        title: Integration and control visibility are the main technical risks
        blocks:
          - type: paragraph
            body: |
              The highest-confidence public milestone is that the AppLovin deal actually closed with
              regulatory approvals, which removes transaction-closing uncertainty but does not clear the
              much harder post-close execution questions. Mobile Marketing Reads highlights a concrete
              integration challenge: Machine Zone had already seen leadership layoffs, and Tripledot's
              historical strength in casual games may not map cleanly onto acquired midcore and 4X
              studios. Public staffing signals are also inconsistent across Tripledot's own LinkedIn
              surfaces, which makes capacity planning hard to underwrite from public evidence alone.
              Most importantly, the assigned pool does not verify public security certifications, uptime
              disclosures, privacy controls, or incident-response transparency, so trust and quality
              controls should be treated as open diligence items rather than demonstrated strengths.
            claimRefs:
              - CE011
              - CE015
              - CE016
