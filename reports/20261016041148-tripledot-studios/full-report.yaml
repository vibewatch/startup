chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Tripledot presents itself as a data-driven mobile-games company that centralizes tools, analytics, and
              studio support rather than operating as a single-title label. Official and third-party descriptions align
              on the core operating model: Tripledot builds and publishes casual mobile games, emphasizes user
              acquisition and live operations, and uses analytics-led iteration to improve retention and monetization.
              The stable identity points are stronger than the current scale disclosures. Public sources consistently
              place the company in London and trace its operating start to 2017, but they disagree on current size and
              provide only partial visibility into the legal-entity versus group-level perimeter. That makes identity,
              headquarters, and business model reusable ground truth for later chapters, while headcount, revenue, and
              audience scale remain diligence items rather than settled facts.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO005
              - CO006
              - CO009
              - CO016
      - number: '1.2'
        title: Leadership, footprint, and governance
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies only a partial public leadership bench. LinkedIn Life names Lior Shiff
              and Akin Babayigit as visible leaders, while the AppsFlyer case study quotes CMO Mark Beck on the
              company’s analytics-led operating style; Tech Funding News also names Eyal Chameides alongside Shiff and
              Babayigit as founders. Public company-controlled profiles describe a 500-person organization spread across
              London, Warsaw, Barcelona, and Jakarta, but other current surfaces point to 586 or 609 employees, which
              means even the basic workforce baseline is unsettled. Just as important, none of the assigned sources
              cleanly discloses board composition, committee structure, voting control, or post-close integration
              ownership after the AppLovin transaction. Investors can therefore establish founder visibility and
              operating ethos, but not governance depth, succession readiness, or minority-holder protections from
              public evidence alone.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
      - number: '1.3'
        title: Capital, ownership, and scale markers
        blocks:
          - type: paragraph
            body: >-
              Tripledot’s funding history is visible in broad strokes but not cleanly reconciled in totals.
              GamesIndustry and Tracxn line up on a $78 million round in April 2021 and a $116 million Series B in
              February 2022, and public investor attribution repeatedly points to 20VC, Eldridge Industries, and
              Lightspeed Venture Partners across those financings. The more recent scale step-change came from the
              AppLovin portfolio transaction: Business Insider described a provisional structure with $500 million of
              cash, $400 million of equity, and acquisition financing needs, while AppLovin later said the signed deal
              closed on June 30, 2025 for $400 million in cash plus equity equal to roughly 20% of Tripledot’s fully
              diluted equity. Those facts support a clear conclusion that capital structure and ownership changed
              materially in 2025, but they do not supply the cap table, debt documents, preference stack, or precise
              post-close dilution required for a clean current valuation or control map.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO012
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and current execution risk
        blocks:
          - type: paragraph
            body: >-
              Tripledot’s milestone pattern is acquisition-led expansion on top of a fast-scaling casual-games base. The
              chronology runs from founding in 2017 to 2021 financing and office expansion, the 2022 Live Play Mobile
              deal, the 2024 Zephyr Mobile acquisition, the 2025 closing of AppLovin’s games portfolio, and the 2026
              Supersonic purchase from Unity. That sequence establishes real execution capacity, but the same evidence
              also highlights the main current risk: integration. Tech Funding News frames the AppLovin portfolio as
              both a $2 billion valuation marker and a significant integration challenge spanning 2,500 employees across
              seventeen cities. Until management provides cleaner post-close operating metrics, governance ownership,
              and integration accountability, the strongest overview judgment is that Tripledot has proved it can buy
              and absorb assets faster than public disclosures prove what the combined company now looks like.
