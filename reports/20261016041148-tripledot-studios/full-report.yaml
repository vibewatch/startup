      - number: '3.3'
        title: Diversification improved resilience, but integration and opaque monetization limit moat proof
        blocks:
          - type: paragraph
            body: >-
              The strongest durability signal in the assigned evidence is diversification: both independent transaction
              coverage and TFN's analysis say the combined portfolio should avoid overreliance on any single game, which
              matters in a hit-driven category. That said, the same evidence also makes clear that competitive
              durability is not fully proven. TFN frames the combined group as a top-five independent mobile-games
              studio by revenue, but also highlights the integration burden of folding in 2,500 employees across
              seventeen cities while rivals such as Miniclip and Playtika recruit aggressively. Public headcount proxies
              remain inconsistent after close, and the assigned sources do not expose buyer-side contract terms or
              title-level monetization detail. That leaves the defensible conclusion at "scaled operator with meaningful
              breadth" rather than "publisher with demonstrated pricing power or lock-in."
            claimRefs:
              - CP002
