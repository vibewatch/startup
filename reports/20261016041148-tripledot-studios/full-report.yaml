      - number: '4.2'
        title: GTM motion, cost structure, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Tripledot's commercial motion appears much closer to scaled performance marketing than to a
              relationship-led sales process. AppsFlyer says the company manages granular install, cost, and event data,
              and Sensor Tower's current U.S. proxy shows $10M-$100M of digital ad spend and 1K-10K active creatives in
              the last quarter, consistent with a high-throughput user acquisition machine. Those indicators help
              explain how Tripledot drives installs, but they do not reveal realized CAC, payback, ARPDAU, or gross
              margin by title. The public evidence therefore supports a view that Tripledot has sophisticated demand
              generation and cohort tooling, while leaving the actual margin path dependent on private cohort curves,
              platform fees, ad-network take rates, and post-acquisition operating costs.
