schemaVersion: "report-v2"
artifact: customers
slug: tripledot-studios
runDate: 2026-10-16
company:
  name: Tripledot Studios
chapter:
  number: 6
  title: Customers
  summary: >-
    Tripledot shows credible top-of-funnel customer scale for a consumer mobile-games
    model: multiple third-party sources describe 25M+ daily active users, SensorTower
    still shows live U.S. usage and marketing spend in the last quarter, and partner
    case-study evidence points to a production-grade acquisition machine. The weaker
    area is durability: public sources do not disclose GRR, NRR, churn, title-level
    concentration, or a clean bridge from broad portfolio reach to durable payer
    economics, and private-company directories materially disagree on revenue and
    headcount.
sections:
  - id: customer-mix
    title: Customer mix is broad consumer usage with a narrower payer set
    body: >-
      The retained evidence points to a mass-market consumer entertainment business,
      not an enterprise software sales motion. LinkedIn and SensorTower both position
      Tripledot as a mobile-games publisher built around casual titles, while Polaris7
      explicitly describes casual mobile players as the direct users and app stores,
      advertisers, ad exchanges, and payment processors as the commercial
      counterparties. That means "customer" splits across user, payer, and channel:
      players create reach, a smaller payer cohort buys virtual items, and advertisers
      monetize non-paying play. The practical diligence implication is that adoption
      quality depends on title-level engagement and monetization mix, not just raw
      audience totals or logo-style distribution claims.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Public adoption proof is current enough to show live scale, but mostly at the top of funnel
    body: >-
      Adoption evidence is directionally strong. ATDb and Bitscale both cite 25M+ daily
      active users across the portfolio, while SensorTower shows a still-active user
      acquisition engine with U.S. last-quarter ad spend of $10M-$100M, 1B-50B
      impressions, and 1K-10K creatives. The same SensorTower snapshot gives live title
      and channel proof: Woodoku Blast is shown as the top app with 500K-1M U.S.
      downloads and 100K-500K U.S. active users in the last quarter, and Mobile Strike
      is shown as the top website with 100K-500K U.S. visits. AppsFlyer's case study is
      older, but it is still useful because it includes named executive commentary about
      production cohort-data usage rather than a vague marketing endorsement.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named proof is strongest in channels and operating counterparts, not in disclosed end-customer rosters
    body: >-
      Tripledot does not publish a named roster of consumer customers, which is normal
      for a games publisher, so the best named proof comes from public channel and
      operating evidence. SensorTower's title and website snapshots show production
      usage surfaces rather than pilot artifacts, and the ATDb profile attributes OEM
      preload distribution to AVOW relationships with Xiaomi, OPPO, VIVO, and Samsung,
      including reported performance uplifts versus other preload channels. GamesIndustry
      and Polaris7 also indicate that recent reach expansion came partly through
      acquisitions, especially the AppLovin portfolio purchase and the later Supersonic
      deal. Together these sources support real distribution breadth, but they still do
      not answer which titles, geographies, or payer cohorts generate the most durable
      customer economics.
    claimRefs: [CU007, CU008, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain the main blind spots
    body: >-
      The core diligence gap is not whether Tripledot has users; it is whether that user
      base converts and endures in a diversified way. None of the retained sources
      disclose GRR, NRR, churn, contract length, repeat-purchase cadence, or title-level
      concentration, so there is no public bridge from audience scale to durable payer
      quality. Private-company aggregators also disagree materially on current scale:
      LeadIQ estimates about 586 employees and $100M-$250M of annual revenue as of
      August 2026, while other third-party profiles point to much larger portfolio scale
      and ATDb describes a 2,500+ person global studio footprint. That conflict does not
      negate adoption, but it does lower confidence in any precise public customer or
      monetization metric until management provides title-level cohorts and a cleaner
      gross-to-net view.
    claimRefs: [CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation by user, payer, and counterparty
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Casual mobile players
        - User; some become payers through IAP
        - Puzzle, card, and casual gameplay across mobile portfolio
        - 25M+ DAU cited by third-party profiles
        - Core audience volume supports both ads and direct spend
        - No public split by geography, title, or payer conversion
      - - In-app purchasers
        - Paying subset of players
        - Buy virtual items, currency, or related content
        - Monetization model confirmed, but no payer-rate disclosure
        - Direct consumer revenue stream inside free-to-play titles
        - No public ARPPU, payer mix, or repeat-purchase cadence
      - - Advertisers and ad exchanges
        - Commercial payer / counterparty
        - Monetize non-paying play through in-game ad inventory
        - SensorTower shows large recent ad-spend and impression ranges
        - Important to monetizing broad reach beyond IAP users
        - No public advertiser concentration or take-rate disclosure
      - - App stores and payment processors
        - Distribution and billing counterparty
        - Deliver reach, billing rails, and cash collection
        - Polaris7 names them as commercial counterparties
        - Gatekeepers for distribution and monetization
        - No public economics by platform or dependency concentration
    notes: >-
      Directional segmentation built from public business-model and channel evidence; Tripledot
      does not publish a full customer-mix disclosure.
    claimRefs: [CU001, CU002, CU003, CU004, CU006]
  - id: TU002
    title: Customer growth and adoption trajectory signals
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Portfolio daily active users
        - 25M+
        - 2026-07 to 2026-02 third-party snapshots
        - ATDb; Bitscale
        - Medium
        - Tripledot appears to have genuine scaled consumer reach
        - No title, geography, or MAU split
      - - Annual gross revenues
        - nearly $2B
        - 2026-02
        - Bitscale
        - Low
        - Portfolio monetization is directionally large if the directory estimate is right
        - No audited net revenue or gross-to-net bridge
      - - U.S. ad-spend / impression engine
        - $10M-$100M spend; 1B-50B impressions; 1K-10K creatives
        - Last quarter
        - SensorTower
        - Medium
        - Acquisition investment remains active in 2026
        - No global spend, CAC, or ROAS disclosure
      - - Woodoku Blast U.S. adoption
        - 500K-1M downloads; 100K-500K active users
        - Last quarter
        - SensorTower
        - Medium
        - At least one flagship title still shows current usage
        - No retention, payer mix, or portfolio share
      - - Mobile Strike web usage
        - 100K-500K visits; 1K-10K unique visitors; 1h-6h avg duration
        - Last quarter
        - SensorTower
        - Medium
        - Tripledot still operates a visible web traffic surface
        - No revenue linkage or cross-platform conversion data
    notes: >-
      Snapshot metrics are retained exactly as published; ranges and gross metrics are directional
      and do not establish audited net customer economics.
    claimRefs: [CU004, CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / channel
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Woodoku Blast players
        - Consumer users
        - Puzzle-game engagement and monetization surface
        - Production
        - SensorTower shows 500K-1M U.S. downloads and 100K-500K U.S. active users last quarter
        - Single-title snapshot with no retention or payer conversion
      - - Mobile Strike web audience
        - Consumer users
        - Web engagement for a live title surface
        - Production
        - SensorTower shows 100K-500K U.S. visits and 1h-6h average user duration per month last quarter
        - No public tie to revenue, reactivation, or broader portfolio usage
      - - AVOW / Xiaomi / OPPO / VIVO / Samsung preload channels
        - Acquisition and distribution counterparties
        - OEM preload user acquisition in harder-to-reach regions
        - Production
        - ATDb attributes 20% EMEA target outperformance and 15% better performance than other preload channels
        - Evidence is a secondary profile summary rather than direct OEM or audited cohort reporting
    notes: >-
      Sample only: this table captures named public usage surfaces and counterparties from the assigned
      pool, not a complete Tripledot customer roster.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to named public titles, web surfaces, and counterparties visible in the assigned
        2026 prefetched pool; Tripledot does not publish a complete customer roster.
    claimRefs: [CU007, CU008, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey from reach to monetization
    type: journey-map
    summary: >-
      Public evidence supports broad top-of-funnel reach and multiple acquisition surfaces,
      but not durable payer retention or concentration quality.
    data:
      items:
        - label: Broad player reach
          tone: positive
          detail: 25M+ portfolio DAU claims point to scaled consumer usage.
          touchpoints:
            - Casual players are the direct users of the portfolio
            - DAU evidence is directional rather than title-level
        - label: Dual monetization
          tone: neutral
          detail: Revenue relies on ads plus in-app purchases inside free-to-play titles.
          touchpoints:
            - Advertisers monetize non-paying play
            - In-app purchasers drive direct consumer spend
        - label: Paid acquisition engine
          tone: positive
          detail: SensorTower still shows heavy U.S. marketing activity in the last quarter.
          touchpoints:
            - U.S. ad spend of $10M-$100M
            - 1B-50B impressions and 1K-10K creatives
        - label: Live title proof
          tone: positive
          detail: Woodoku Blast still shows current download and active-user ranges.
          touchpoints:
            - 500K-1M U.S. downloads last quarter
            - 100K-500K U.S. active users last quarter
        - label: Channel expansion
          tone: positive
          detail: OEM preload programs and M&A broadened customer reach beyond pure store discovery.
          touchpoints:
            - AVOW preload through Xiaomi OPPO VIVO and Samsung inventory
            - AppLovin and Supersonic deals expanded surfaces
        - label: Durability blind spot
          tone: risk
          detail: Public sources do not disclose core retention or concentration metrics.
          touchpoints:
            - No public NRR GRR churn or contract-length disclosure
            - Conflicting directory estimates weaken precision on scale
    claimRefs: [CU001, CU002, CU004, CU006, CU007, CU010, CU011, CU013, CU014, CU016]
callouts:
  - calloutType: strength
    title: Public evidence clears the "real adoption" bar
    body: >-
      The best support is not logos alone: current SensorTower title and web traffic ranges,
      plus third-party DAU estimates and named acquisition-channel evidence, indicate a live
      and scaled customer surface.
    claimRefs: [CU004, CU006, CU007, CU008, CU010, CU011]
  - calloutType: risk
    title: Durability is still under-documented
    body: >-
      No retained source provides churn, GRR, NRR, contract-length, or title-concentration
      data, and directory estimates disagree on scale, so customer quality remains less proven
      than customer reach.
    claimRefs: [CU014, CU015, CU016]
