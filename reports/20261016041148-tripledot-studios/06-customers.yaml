  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Quantified NRR, GRR, churn, cohort retention, or repeat-purchase metrics by title or portfolio cohort.
      whyItMatters: Customer reach looks real, but investment conviction depends on whether that reach renews and monetizes durably.
      diligencePath: Request cohort dashboards by title and geography plus the internal definitions used for retention and payer conversion.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Title-level revenue, DAU, payer mix, and platform concentration across the current portfolio.
      whyItMatters: Without concentration data, it is unclear whether adoption is diversified or overly dependent on a few titles or channels.
      diligencePath: Obtain a title-by-title revenue and DAU bridge, including app-store, ad, and web channel shares.
      relatedQuestionRefs: [QU006]
    - type: conflicting-data
      severity: material
      topic: conflicting-scale
      missingEvidence: Reconciled management numbers for current headcount, revenue basis, and portfolio scope.
      whyItMatters: Public directories disagree materially on current scale, which weakens confidence in precise customer and monetization metrics.
      diligencePath: Request audited or board-level KPI packs that define gross revenue, net revenue, DAU, and employee counting conventions.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: minor
      topic: named customer and channel proof sample
      missingEvidence: A fuller list of named titles, geographies, and counterparties tied to production deployments and outcomes.
      whyItMatters: The public record proves some live surfaces, but it does not support a comprehensive named-customer map.
      diligencePath: Ask management for a top-title and top-channel roster with launch dates, geographies, and monetization roles.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
