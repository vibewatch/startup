company:
  name: "Tripledot Studios"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Public evidence supports Tripledot as a scaled mobile-gaming consolidator with a real
    2025 transaction-based valuation anchor around $2.0 billion, but the support is still
    weaker than a clean buy case because the combined company's audited net revenue,
    cap-table economics, and post-close preference stack remain opaque. The highest-supportable
    call from this source set is track with medium confidence and a fair valuation stance.
sections:
  - id: "price-context"
    title: "Financing history and current price context"
    body: >-
      The visible financing path is clear enough to establish direction but not enough to
      underwrite precision. Public reporting says Tripledot raised $78 million in Series A,
      then $116 million in Series B in February 2022, while Tracxn places the 2021 Series A
      at a $500 million post-money valuation. The next major price anchor is not a fresh
      outside round but the 2025 AppLovin transaction, which multiple reports described as
      valuing Tripledot at roughly $2.0 billion. AppLovin's closing release is important
      because it says the sale ultimately closed for $400.0 million in cash plus equity
      representing about 20% of Tripledot's fully diluted equity, and specifically says no
      promissory note was issued at closing. That means the public record does support a large
      step-up in enterprise significance, but it does not yet provide a clean, current
      third-party financing mark with audited combined economics behind it.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005"]
    tableRefs: ["TV001"]
  - id: "thesis-balance"
    title: "Why the company can justify interest but not a buy call"
    body: >-
      The positive case is that Tripledot looks like a proven consolidator rather than a
      speculative studio. LinkedIn and company-authored material still frame the business as
      data-driven and veteran-led, while public reporting shows the company kept buying assets
      before and after the AppLovin portfolio deal. That matters because a roll-up can deserve
      a premium only if operating discipline survives integration. The pushback is that the
      public data set is much weaker on the variables that actually determine entry returns.
      LeadIQ only offers a broad $100 million-$250 million annual revenue estimate, MLQ's
      scale claim uses gross revenue rather than audited net revenue, Dealroom says some
      investors are hidden and its ownership stakes are only indicative, and current public
      employee signals do not reconcile cleanly with the 2,500-plus combined workforce cited
      in transaction coverage. In other words, there is enough proof of scale to stay engaged,
      but not enough transparency to pay up confidently.
    claimRefs: ["CV006", "CV007", "CV008", "CV009", "CV010", "CV012", "CV013", "CV015"]
    tableRefs: ["TV002"]
    figureRefs: ["FV001"]
  - id: "scenario-view"
    title: "Scenario framing and valuation stance"
    body: >-
      The right framing is a scenario range rather than a point estimate. A bull case needs
      the combined AppLovin portfolio to convert gross scale into durable net revenue, stable
      retention, and integrated operating leverage without a new preference or leverage
      surprise. A base case assumes the 2025 transaction mark was directionally fair for a
      scaled asset base, but that upside from the same entry point is capped until audited
      financials, portfolio concentration, and title-level contribution become visible. A bear
      case centers on the same risk that adverse reporting emphasizes: integrating a much
      larger footprint while mobile-game downloads soften and user-acquisition economics stay
      competitive can compress the value of acquired scale. That combination supports a fair,
      not attractive, stance on the last visible price anchor.
    claimRefs: ["CV005", "CV009", "CV011", "CV012", "CV013"]
    tableRefs: ["TV003"]
  - id: "diligence-asks"
    title: "Final diligence asks and thesis-break triggers"
    body: >-
      The next diligence round should focus on the few documents that could actually move the
      recommendation. First, investors need the executed AppLovin purchase agreement and the
      current cap table to confirm whether the fully diluted 20% equity consideration created
      any governance, information, or liquidation-right overhang beyond what is visible in
      public reporting. Second, management should provide audited combined net revenue,
      EBITDA, gross-to-net bridges, and title or studio concentration so the 2025 gross-scale
      narrative can be converted into a valuation framework. Third, the company should show
      integration KPIs for the acquired studios, including retention, live-ops performance,
      and cash conversion. The thesis breaks if the closed structure proves more senior to new
      money than the public record implies, if combined economics fail to support the step-up
      from the 2021 $500 million Series A mark to the 2025 $2.0 billion transaction mark, or
      if post-close integration KPIs deteriorate meaningfully.
    claimRefs: ["CV002", "CV004", "CV006", "CV011", "CV012", "CV013", "CV014"]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Dimension", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Track", "Stay engaged, but do not underwrite a price-clearing round from this evidence set alone."]
      - ["Confidence", "Medium", "The direction of value creation is visible, but the core underwriting variables are still private."]
      - ["Risk rating", "High", "Execution, integration, and disclosure gaps matter more than demand proof at this stage."]
      - ["Valuation stance", "Fair", "The last visible $2.0B mark looks supportable as a reference point, not obviously attractive as an entry point."]
      - ["Entry discipline", "Wait for hard data", "A buy case needs audited combined economics, cap-table detail, and clean post-close rights disclosure."]
    notes: "Judgment uses only the assigned public source pack; no audited combined financial statements or cap-table documents were available."
    claimRefs: ["CV005", "CV012", "CV013", "CV014"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Lens", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "Tripledot has shown repeat M&A ambition, a data-driven operating culture, and a scaled 2025 platform expansion that can justify continued investor attention.", "Upgrade only if management shows audited combined net revenue/EBITDA, confirms the final rights stack, and proves integration KPIs are tracking plan."]
      - ["Anti-thesis", "The public record is still too opaque on net revenue quality, preference overhang, and combined-workforce economics to justify paying ahead of private diligence.", "Downgrade if the executed transaction created more senior claims than expected, if title-level concentration is worse than implied, or if post-close integration metrics weaken."]
    notes: "This table separates operating-quality arguments from price-discipline arguments; both are required for a buy call."
    claimRefs: ["CV006", "CV010", "CV011", "CV012", "CV013", "CV014"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "The AppLovin portfolio integrates cleanly, gross scale converts into auditable net revenue growth, and acquired studios sustain retention and monetization.", "A later priced round or secondary at a premium to the 2025 mark becomes supportable because scale and cash-generation proof improve together.", "Execution fatigue, title concentration, and hidden preference terms still matter.", "Would require audited combined economics and stable integration KPIs."]
      - ["Base", "The 2025 transaction mark was directionally fair, but the company needs time and disclosures before the next valuation step-up is justified.", "Returns from the last visible mark look balanced rather than asymmetric, so the rational call is track with price discipline.", "Disclosure stays partial and upside waits on proof.", "Best fits the current evidence pack."]
      - ["Bear", "Integration is slower than planned, user-acquisition economics stay pressured, and combined financial quality or rights structure disappoints.", "The 2025 mark proves stretched because scale did not translate into durable net economics or investor protections.", "Regulatory, execution, and governance surprises compound at once.", "Would be indicated by weak post-close KPIs or a more onerous final cap table than public evidence suggests."]
    notes: "These are directional underwriting frames rather than numerical DCF outputs because audited combined net revenue, EBITDA, and liquidation preferences are not public."
    claimRefs: ["CV004", "CV005", "CV011", "CV012", "CV013", "CV014"]
figures:
  - id: "FV001"
    title: "Recommendation logic"
    type: "flow"
    summary: "Scale proof keeps Tripledot investable, but economics opacity and integration risk cap the supportable call at track."
    data:
      nodes:
        - id: "scale"
          label: "Scale proof exists"
          detail: "Public reporting points to a $2.0B 2025 transaction value, 10 acquired studios, and roughly 25M daily active users."
        - id: "culture"
          label: "Operating model is credible"
          detail: "Company-controlled materials still emphasize veteran leadership and a data-driven approach to acquisition and live operations."
        - id: "opacity"
          label: "Core economics remain opaque"
          detail: "Public revenue is still a broad estimate, while ownership stakes and investor holdings are explicitly incomplete or indicative."
        - id: "risk"
          label: "Execution downside is real"
          detail: "Independent adverse coverage highlights integration complexity, regulatory review, and tougher user-acquisition conditions."
        - id: "discipline"
          label: "Price discipline is still required"
          detail: "Without audited combined economics and a clear rights stack, the last visible mark is a reference point rather than an invitation to buy."
        - id: "decision"
          label: "Result: track / fair"
          detail: "The company merits continued diligence, but the evidence pack does not justify a buy recommendation at the last visible mark."
      edges:
        - from: "scale"
          to: "culture"
          label: "supports interest"
        - from: "culture"
          to: "opacity"
          label: "but does not remove"
        - from: "opacity"
          to: "risk"
          label: "amplifies"
        - from: "risk"
          to: "discipline"
          label: "requires"
        - from: "discipline"
          to: "decision"
          label: "sets recommendation"
    approximationNotes: "This is a qualitative decision chain, not a weighted scoring model."
    claimRefs: ["CV005", "CV006", "CV009", "CV011", "CV012", "CV013"]
