  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-runway
      missingEvidence: Current cash balance, debt principal, maturity schedule, covenant package, and management runway assumptions.
      whyItMatters: Without liquidity and financing obligations, public evidence cannot support a confident capital-adequacy view after the 2025-2026 acquisitions.
      diligencePath: Request the latest board package, debt agreements, treasury summary, and a 12-18 month management runway bridge.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Title-level LTV, CAC, payback, payer rate, ARPDAU, platform fees, ad-network take rates, and gross-margin bridges.
      whyItMatters: The public evidence shows marketing scale and analytics capability, but not whether portfolio-level revenue converts into attractive contribution margins.
      diligencePath: Request title-level cohort dashboards and a gross-to-net waterfall for the top revenue titles.
      relatedQuestionRefs: [QI004, QI005]
      relatedTableRefs: [TI001, TI003]
    - type: conflicting-data
      severity: material
      topic: post-acquisition-scale
      missingEvidence: Management-confirmed current headcount, studio count, and post-close organizational perimeter.
      whyItMatters: Conflicting public scale estimates weaken any inference about operating leverage, integration cost, or fixed-cost absorption.
      diligencePath: Request an org snapshot and post-close operating plan that reconciles legacy Tripledot, AppLovin gaming assets, and Supersonic.
      relatedQuestionRefs: [QI003]
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Public or management-backed disclosure of IAP price ladders, discount cadence, and monetization mix by title.
      whyItMatters: Pricing visibility is necessary to separate list-price optics from realized monetization quality and player concentration risk.
      diligencePath: Request a pricing matrix for the top titles plus realized payer-mix and discount data.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI002]
