schemaVersion: "report-v2"
artifact: financials
slug: tripledot-studios
runDate: 2026-10-16
company:
  name: Tripledot Studios
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence shows an analytics-led free-to-play mobile-games model whose economics
    depend on paid user acquisition, live-ops retention, and acquisition-led scale, but realized
    pricing, gross margins, and title mix remain largely undisclosed. Historical funding totals
    $202M through the 2022 Series B, while the closed 2025 AppLovin transaction added 10
    studios for $400.0M cash plus equity worth about 20% of fully diluted Tripledot, making
    capital adequacy a function of acquisition integration as much as organic growth. The result
    is a readable revenue engine but an only partly underwritable cash-generation and runway
    profile.
sections:
  - id: revenue-model
    title: Revenue model and public traction
    body: >-
      The retained sources consistently describe Tripledot as a data-driven free-to-play mobile
      publisher whose operating loop starts with user acquisition and live operations, not with
      contracted enterprise sales or transparent per-seat pricing. AppsFlyer attributes the model
      to daily optimization across user acquisition, monetization, and product decisions, while
      Sensor Tower separately frames the company around retention and monetization of casual and
      hyper-casual titles. Public scale data is much weaker than public model data: Tracxn gives
      only a broad £100M-£500M 2022 revenue band, and Sensor Tower's freshest operating proxies
      are country- and title-level snapshots rather than consolidated portfolio revenue or gross
      bookings. That means the revenue engine is directionally visible, but revenue quality still
      hinges on private disclosures around title mix, gross-to-net deductions, and the split
      between in-app purchases and advertising.
    claimRefs: [CI001, CI002, CI003, CI011, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-efficiency-and-cost-structure
    title: GTM motion, cost structure, and unit-economics proxies
    body: >-
      Tripledot's commercial motion appears much closer to scaled performance marketing than to
      a relationship-led sales process. AppsFlyer says the company manages granular install, cost,
      and event data, and Sensor Tower's current U.S. proxy shows $10M-$100M of digital ad spend
      and 1K-10K active creatives in the last quarter, consistent with a high-throughput user
      acquisition machine. Those indicators help explain how Tripledot drives installs, but they
      do not reveal realized CAC, payback, ARPDAU, or gross margin by title. The public evidence
      therefore supports a view that Tripledot has sophisticated demand generation and cohort
      tooling, while leaving the actual margin path dependent on private cohort curves, platform
      fees, ad-network take rates, and post-acquisition operating costs.
    claimRefs: [CI001, CI010, CI011, CI012, CI015]
    tableRefs: [TI003]
  - id: capital-needs-and-financing
    title: Capital needs and financing dependency
    body: >-
      The clearest financial chronology in public sources is capital formation plus M&A. Tracxn
      records $202M of funding through the 2022 Series B, and GamesIndustry.biz reports $78M in
      2021 followed by $116M in 2022 to expand game offerings and acquisition capacity. Since
      then, Tripledot has continued to use acquisitions to change its revenue base: AppLovin says
      its mobile-games divestiture closed in June 2025 for $400.0M cash plus equity equal to
      roughly 20% of fully diluted Tripledot, and AppLovin also says the deal transferred 10 game
      studios. GamesIndustry.biz then reports a further $40M Supersonic acquisition in August
      2026. That pattern implies financing dependency is now tied less to early-stage fundraising
      and more to whether acquired portfolios sustain retention, monetize efficiently, and avoid
      adding debt-like obligations that are not publicly described in the retained evidence.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Financially, Tripledot looks like a scaled consumer-games roll-up with a demonstrably large
      paid-acquisition engine and a willingness to deploy capital into portfolio expansion, but it
      is still not publicly transparent enough for clean underwriting on cash conversion. The best
      current evidence supports confidence in the existence of monetization infrastructure and in
      the magnitude of acquisition activity, not in current runway, covenant headroom, or per-title
      contribution margins. Headcount disclosures also diverge sharply across third-party sources
      after the AppLovin transaction, which makes productivity and burn heuristics unreliable.
      Until management provides current cash, debt, integration-cost, and title-level cohort data,
      the prudent view is that Tripledot's margin path is plausible but unproven at portfolio level.
    claimRefs: [CI007, CI010, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["In-app purchases", "Player spend inside free-to-play titles", "player transaction", "Supported as a core monetization path, but no retained source discloses title-level mix or realized spend", "Directionally credible, quantitatively opaque", "Provide title-level IAP mix, payer rates, and gross-to-net bridge"]
      - ["In-app advertising", "Ad impressions monetized inside casual titles", "impression / session", "Supported by the ad-driven operating description and heavy UA intensity, but publisher take rates are not public", "Likely material but not separably disclosed", "Provide ad ARPDAU, network mix, and take-rate disclosure"]
      - ["Legacy portfolio revenue", "Recurring monetization from established titles such as solitaire, blackjack, and puzzle games", "portfolio title", "Historical revenue band disclosed only at company level for FY2022", "Evidence exists for scale, not for mix quality", "Provide title-by-title revenue, retention, and decay curves"]
      - ["Acquired portfolio revenue", "Revenue contribution added through studio and franchise acquisitions", "acquired studio / franchise", "2025 AppLovin deal added 10 studios and 2026 Supersonic added another business, but no acquired revenue breakout is public", "Material to scale but integration dependent", "Provide acquired-vs-legacy revenue split and integration cost bridge"]
    notes: "Rows distinguish visible monetization mechanisms from undisclosed realized mix; public sources support the existence of these streams but not their relative contribution."
    claimRefs: [CI001, CI002, CI003, CI007, CI008, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Consumer download", "List price appears free-to-play rather than paid download", "Realized revenue shifts to later monetization events; no retained source lists explicit storefront pricing policy by title", "Sensor Tower / AppsFlyer"]
      - ["In-app purchase baskets", "No retained source discloses SKU price ladders, payer tiers, or bundle structure", "Unknown discounting, promotional cadence, payer concentration, and refund rate", "AppsFlyer case study"]
      - ["Advertising inventory", "No retained source discloses CPM floors, mediation terms, or rev-share contracts", "Unknown mix by geography, title, and ad format", "Sensor Tower / SWOTAnalysis"]
    notes: "Public evidence is strong on monetization mechanism and weak on realized pricing; null-like unknowns are deliberate diligence gaps rather than omitted rows."
    claimRefs: [CI001, CI002, CI010, CI012, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["U.S. digital ad-spend proxy", "$10M-$100M last quarter", "medium", "Supports the view that growth still relies on a large paid-acquisition engine", "Provide global UA spend by title and geography"]
      - ["U.S. creative volume proxy", "1K-10K creatives last quarter", "medium", "Suggests a scaled experimentation loop rather than low-touch organic growth", "Provide creative-testing win rates and CAC movement over time"]
      - ["Internal cohort / cost / event tooling", "Present internally according to AppsFlyer case study", "medium", "Shows Tripledot likely tracks the data needed for LTV/CAC optimization even though it is not public", "Share cohort retention, LTV, and payback curves by major title"]
      - ["Current cash / debt / runway", null, "low", "Runway cannot be underwritten without current liquidity and financing obligations", "Provide cash balance, debt schedule, covenants, and management runway plan"]
      - ["Title-level gross margin / take rate", null, "low", "Gross-profit path depends on platform fees, UA spend, royalties, hosting, and support costs", "Provide title-level P&Ls and gross-to-net deductions"]
    notes: "Null values mean the retained public evidence does not disclose the metric at underwritable precision; they are intentional diligence requests, not formatting gaps."
    claimRefs: [CI001, CI010, CI011, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the acquisition-to-monetization sequence, but not the final margin split.
    data:
      nodes:
        - id: ua
          label: Paid and organic acquisition
          value: "$10M-$100M U.S. ad spend proxy; 1K-10K creatives"
          note: "Shows scaled demand generation, not consolidated CAC."
        - id: cohorts
          label: Installs, cohorts, and active users
          value: "Granular install / cost / event data; 500K-1M U.S. downloads for Woodoku Blast"
          note: "Public data is title-level and geography-limited."
        - id: engagement
          label: Live operations and retention
          value: "Analytics-led product and monetization decisions"
          note: "Public sources describe the operating model but not cohort retention curves."
        - id: monetization
          label: Monetization events
          value: "In-app purchase and ad monetization logic"
          note: "Realized payer mix and ad take rates are not public."
        - id: portfolio
          label: Portfolio revenue base
          value: "Legacy titles plus acquired studios and franchises"
          note: "2025 AppLovin close added 10 studios; 2026 Supersonic widened scope again."
        - id: grossprofit
          label: Gross profit outcome
          value: "Not publicly disclosed"
          note: "Needs platform-fee, UA, royalty, hosting, and support-cost bridge."
      edges:
        - from: ua
          to: cohorts
          label: acquire players
        - from: cohorts
          to: engagement
          label: retain and segment
        - from: engagement
          to: monetization
          label: convert play into spend / ad views
        - from: monetization
          to: portfolio
          label: aggregate by title portfolio
        - from: portfolio
          to: grossprofit
          label: subtract delivery and platform costs
    approximationNotes: "Ranges are copied from retained market-data proxies and are not management guidance."
    claimRefs: [CI001, CI007, CI008, CI009, CI010, CI011, CI015]
callouts:
  - calloutType: insight
    title: Monetization engine is visible before economics are
    body: >-
      Tripledot's public footprint is rich on acquisition scale and analytics discipline, but poor
      on realized revenue mix, title margins, and cash conversion, so the model is legible before
      the P&L is.
    claimRefs: [CI001, CI010, CI015]
  - calloutType: risk
    title: Acquisition scale raises the diligence bar
    body: >-
      The AppLovin close and subsequent Supersonic deal make legacy-versus-acquired performance,
      integration cost, and financing obligations central to underwriting, yet those bridges are
      not public.
    claimRefs: [CI007, CI008, CI009, CI015]
