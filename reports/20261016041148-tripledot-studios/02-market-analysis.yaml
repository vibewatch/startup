      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - ["Core casual mobile portfolio", "iOS and Android casual, hyper-casual, and hybrid-casual game development, publishing, LiveOps, and retention work", "Console, PC premium, and non-mobile entertainment spend", "Players as users; in-app purchasers and advertisers as payers", "This is the company’s directly described operating category."]
      - ["Performance marketing and monetization stack", "User acquisition, programmatic ad mediation, monetization optimization, analytics, and web-store operations", "Enterprise software sold to third parties as a stand-alone product category", "Internal growth teams buy the spend; advertisers and players fund returns", "These workflows determine adoption speed and margin in mobile gaming."]
      - ["Studio and franchise consolidation", "Studio M&A, portfolio integration, and franchise scale-up across acquired game teams", "Unrelated software roll-ups or non-gaming acquisitions", "Corporate development and capital providers fund expansion", "The AppLovin and Supersonic transactions materially widened reachable content inventory."]
      - ["Hybrid-casual publishing adjacency", "Third-party publishing, cross-promotion, and hybrid-casual title scaling", "Non-mobile publishing and unrelated media distribution", "Publishing teams buy traffic and support partner studios; players and advertisers pay back the model", "Supersonic expands Tripledot beyond only legacy in-house incubation."]
    notes: Market boundary is defined from company/category descriptions and transaction evidence; it is not an independently benchmarked TAM taxonomy.
    claimRefs: [CM001, CM002, CM007, CM011]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Sensor Tower", "2026", "United States, last quarter", "$10M-$100M ad spend; 1B-50B impressions", null, "Platform-estimated brand page metrics for Tripledot’s current operating footprint", "medium", "US-only quarter snapshot; indicates scale of distribution spend, not a clean TAM."]
      - ["Sensor Tower", "2026", "United States, last quarter", "500K-1M Woodoku Blast downloads; 100K-500K active users", null, "Top-app operating lens for one Tripledot title", "medium", "Single-title lens and US-only snapshot; not representative of the full portfolio."]
      - ["AppLovin", "2025", "Global portfolio transaction", "$400.0M cash plus ~20% of fully diluted equity; 10 studios acquired", null, "Official completed-sale disclosure for the mobile gaming business divestiture", "high", "Deal consideration and asset count, not a direct market-size estimate."]
      - ["The Design Lab", "2025", "Global post-close combined company", "12 studios; 23 cities; 25M DAU; nearly $2B annual revenue", null, "Independent post-announcement synthesis of the AppLovin acquisition", "medium", "Pro forma estimate after close; not audited and not a genre-specific TAM."]
      - ["LeadIQ", "2026", "Company-level estimate", "$100M-$250M annual revenue; ~586 employees", null, "Commercial directory estimate as of August 2026", "low", "Entity scope is unclear versus the post-acquisition group, so comparability is weak."]
    notes: Rows intentionally mix operating, transaction, and pro forma lenses because the assigned pool does not contain a clean independent TAM/SAM/SOM source for Tripledot’s category.
    claimRefs: [CM003, CM004, CM005, CM006, CM009, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Legacy Tripledot casual titles", "Internal portfolio and growth teams", "Broad mobile puzzle, card, and casual players", "In-app purchasers and advertisers", "Rapid prototyping, launch, LiveOps, and retention optimization", "Growth / user-acquisition leadership", "Retention and ROAS evidence strong enough to justify scaled spend."]
      - ["Acquired AppLovin franchises", "Tripledot group portfolio leadership", "Players of acquired casual/mobile franchises", "In-app purchasers and advertisers", "Integrate studios, preserve franchise momentum, and scale shared ops", "Group management and studio GMs", "Franchise durability plus cross-portfolio monetization upside."]
      - ["Supersonic hybrid-casual publishing", "Publishing leadership and partner-facing teams", "Hybrid-casual mobile players", "Mostly advertisers plus some in-app purchasers", "Publish and scale externally sourced or partner-supported titles", "Publishing and monetization leaders", "A title shows strong CPI/LTV fit for paid distribution."]
      - ["Direct-to-consumer monetization adjacency", "Monetization and web-store operators", "Existing paying players", "Players transacting outside app-store rails", "Move engaged users into higher-margin web-store or owned channels", "Monetization leadership", "Margin uplift and stronger direct player economics."]
    notes: Budget-owner rows are inferred from the disclosed operating model and transaction structure; the company does not publish a formal procurement map in the assigned pool.
    claimRefs: [CM002, CM004, CM007, CM012]
figures:
  - id: FM001
    title: Portfolio scale and distribution hierarchy
    type: pyramid
    summary: Public market evidence bounds Tripledot’s opportunity through mixed operating-scale layers rather than a clean external TAM/SAM/SOM stack.
    data:
      items:
        - label: Combined portfolio revenue lens
          displayValue: "~$2B annual revenue"
          note: Pro forma post-close estimate from an independent May 2025 synthesis
        - label: Combined audience lens
          displayValue: "25M daily active users"
          note: Post-close combined company estimate tied to the AppLovin acquisition
        - label: Studio-network footprint
          displayValue: "12 studios across 23 cities"
          note: Independent post-announcement scale lens for the combined platform
        - label: US ad-impression layer
          displayValue: "1B-50B impressions last quarter"
          note: Sensor Tower brand-page estimate for Tripledot’s US operating footprint
        - label: US user-acquisition spend layer
          displayValue: "$10M-$100M ad spend last quarter"
          note: Sensor Tower estimate; distribution budget signal rather than TAM
        - label: Observable title-demand layer
          displayValue: "500K-1M Woodoku Blast downloads last quarter"
          note: Sensor Tower top-app lens for a single Tripledot title in the US
        - label: Hybrid-casual publishing expansion
          displayValue: "$40M Supersonic acquisition"
          note: GamesIndustry.biz reported the August 2026 transaction and standalone operating model
    approximationNotes: Mixed units and time bases are intentional; this pyramid is an evidence-constrained scale stack, not a conversion funnel or a clean TAM/SAM/SOM decomposition.
    claimRefs: [CM003, CM004, CM006, CM007, CM013]
