  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: An independent market report that segments casual, hyper-casual, and hybrid-casual mobile gaming by geography, monetization model, and buyer economics in a way that maps directly onto Tripledot’s portfolio.
      whyItMatters: Without that lens, valuation must lean on constrained operating metrics and transaction comps rather than on a clean SAM/SOM stack.
      diligencePath: Obtain current category data from a market-data vendor or public-company disclosure set that breaks out casual mobile revenue pools and monetization mix by region.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: denominator-variance
      missingEvidence: A reconciled bridge between legacy Tripledot entity metrics and the post-AppLovin group metrics for revenue, headcount, DAU, and studio count.
      whyItMatters: Mixed denominators make market-share, productivity, and valuation-multiple comparisons unreliable.
      diligencePath: Request post-close management reporting or investor materials that explicitly separate legacy, acquired, and consolidated metrics.
    - type: private-evidence-only
      severity: minor
      topic: buyer-map
      missingEvidence: Internal budget splits across user acquisition, LiveOps, publishing, and direct-to-consumer monetization channels.
      whyItMatters: Those allocations determine how much of Tripledot’s addressable opportunity is really budget-available in each segment.
      diligencePath: Ask management for portfolio-level marketing, monetization, and publishing budget ownership by title and channel.
