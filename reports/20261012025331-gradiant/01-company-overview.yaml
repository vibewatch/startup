company:
  name: "Gradiant"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Gradiant is a Boston-based industrial water technology company founded at MIT that reached a $2.0B valuation in its May 2026 Series E financing. The company delivers turnkey water recycling, cooling, and wastewater infrastructure across semiconductors, AI data centers, and advanced manufacturing, self-reporting $500M-$750M in annual run-rate revenue while navigating private financial disclosure gaps and executive governance transitions."
sections:
  - id: "company-identity-and-product-architecture"
    title: "Company Identity and Product Architecture"
    body: "Founded at the Massachusetts Institute of Technology and headquartered in Boston, Massachusetts, Gradiant has established itself as an advanced water and wastewater infrastructure company serving mission-critical global industries. As artificial intelligence computing campuses and semiconductor fabrication facilities expand rapidly, water availability, purification quality, and wastewater disposal limits have emerged as binding physical bottlenecks. Gradiant addresses these industrial constraints by positioning itself as the dedicated water infrastructure layer of the AI economy. Rather than functioning as a component equipment vendor, the company designs, builds, and operates complete, vertically integrated water systems spanning freshwater intake, ultrapure water production, high-recovery wastewater recycling, and resource reclamation. In May 2026, Gradiant deployed HyperSolved, its dedicated cooling water infrastructure solution for AI data centers, across multiple global hyperscale operators to eliminate cooling-water constraints through integrated treatment, chemical formulations, and proprietary AI-driven operational controls."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO011"
    tableRefs:
      - "TO001"
    figureRefs: []

  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Governance Reorganization"
    body: "Gradiant's technological and commercial trajectory has been steered since inception by co-founders Anurag Bajpayee and Prakash Govindan, both MIT engineering doctoral graduates who translated proprietary thermodynamic separation research into commercial water treatment applications. In conjunction with the company's May 2026 Series E financing round, Gradiant formalized a significant executive governance reorganization. Anurag Bajpayee transitioned from Chief Executive Officer into the role of Executive Chairman, focusing on strategic global expansion and capital formation, while co-founder Prakash Govindan assumed the post of Chief Executive Officer to direct operational execution and hyperscale enterprise deployments. This executive transition followed broader reputational scrutiny in April 2025, when Bajpayee was linked to high-profile Cambridge Brothel Hearings, prompting public affirmations of institutional confidence from the company. To accelerate commercial scale across North America, Gradiant recruited Dr. Nish Vora, a thirty-year water sector veteran from Veolia, Suez, and GE Water, as Managing Director for the Americas."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO010"
    tableRefs:
      - "TO002"
    figureRefs: []

  - id: "capitalization-and-stakeholder-syndicate"
    title: "Capitalization, Investor Syndicate, and Valuation History"
    body: "On May 18, 2026, Gradiant finalized its Series E financing round, securing a post-money valuation of $2.0 billion and doubling its equity capitalization benchmark from its prior $1.0 billion unicorn valuation achieved in May 2023. The round was co-led by Boston-based technology venture firm Safar Partners and Australia's Hostplus Superannuation Fund, with participation from industrial software investor ClearVision Ventures alongside additional international institutions. Investor interest has been propelled by surging structural demand for industrial wastewater treatment and closed-loop recycling across semiconductor foundries, data centers, and advanced manufacturing campuses. However, while institutional backers emphasize Gradiant's technological differentiation and stated operational profitability, the company has not disclosed the specific primary capital dollar amount raised in Series E, the presence of secondary share liquidations, or liquidation preference structures, leaving detailed balance sheet capitalization metrics unverified in public disclosures."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO003"
    figureRefs: []

  - id: "operational-scale-and-milestone-chronology"
    title: "Operational Scale, Commercial Momentum, and Chronology"
    body: "Gradiant operates at substantial global industrial scale, self-reporting annual revenue run-rate between $500 million and $750 million as of late 2026, with an executive objective to reach $1.0 billion within two to three years. In the United States, commercial momentum is anchored by long-term operations and maintenance agreements, including a high-profile contract to operate ultrapure water systems for a major domestic semiconductor manufacturer, driving a projected $1.0 billion US order book target for the coming year. To support this North American expansion, the firm established regional offices in Phoenix, Syracuse, and Philadelphia, alongside launching its Houston Global Innovation Centre. Globally, Gradiant is expanding its Global Engineering Center in Coimbatore, India, doubling technical engineering headcount from 100 to over 200 professionals. Nevertheless, global operational expansion faces regional frictions: geopolitical tensions across the Middle East triggered an estimated 20% revenue contraction as regional capital expenditure cycles paused."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs: []
    figureRefs:
      - "FO001"

