  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Commercial Delivery Model
      - Primary Vendors
      - Capital & Operating Expenditure Structure
      - Typical Contract Commitment
      - Underwriting Risk & Diligence Implication
    rows:
      - - Turnkey Water-as-a-Service / BOOT
        - Gradiant, select specialized project developers
        - Low upfront customer capital; bundled volumetric / availability service tariff
        - 10 to 20 year multi-year operating agreements
        - Counterparty credit risk, off-take minimums, and long-term asset performance guarantees
      - - Traditional CapEx Equipment Sale + EPC
        - Equipment OEMs, civil water contractors, Veolia engineering packages
        - High initial capital expenditure; customer bears operational and chemical OpEx
        - 1 to 3 year design-build procurement contract
        - Cost overruns during installation and interface integration risk across distinct equipment packages
      - - Specialty Chemical Service & Consumables
        - Ecolab / Nalco Water, Kurita
        - Low equipment footprint; recurring operational chemical and consumables spend
        - 1 to 5 year recurring supply and technical monitoring agreements
        - Volatility of chemical pricing and lack of integrated brine concentration or zero-discharge capabilities
    notes: Comparative commercial models compiled from industry standard procurement structures in semiconductor manufacturing and hyperscale infrastructure. Actual realized pricing remains private under client NDAs.
