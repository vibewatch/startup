  - id: TP002
    title: Feature / Capability Matrix
    columns:
      - Buying Criteria
      - Gradiant
      - Global Conglomerates (Veolia / Ecolab)
      - Equipment OEMs (Aquatech / Ovivo)
      - Internal Hyperscaler Build
    rows:
      - - Full Lifecycle Turnkey Delivery
        - Supported (single accountable partner from sourcing to discharge)
        - Partial (often fragmented across distinct business units and local EPCs)
        - Unsupported (focused on discrete equipment sub-packages)
        - Unsupported (requires managing dozens of fragmented sub-contractors)
      - - Zero Liquid Discharge (ZLD) to Surface Water
        - Supported (engineered zero surface discharge in West Texas and fab projects)
        - Supported (proven thermal brine concentration capabilities)
        - Partial (requires pairing standalone RO with separate crystallizer vendors)
        - Unsupported (rarely develops proprietary brine concentration in-house)
      - - Integrated AI Operations (SmartOps / Digital Control)
        - Supported (native SmartOps AI optimizing dynamic recovery and chemical dosage)
        - Partial (offered via proprietary digital suites like Hubgrade)
        - Unsupported (basic PLC/SCADA controls without closed-loop predictive AI)
        - Unsupported (facilities software rarely optimizes extreme water chemistry)
      - - Specialized Semiconductor Fluoride / Scrubber Reclaim
        - Supported (>80% reclaim on complex streams across US and Asia fabs)
        - Supported (established industrial reference plants globally)
        - Supported (specialized resin and membrane filtration modules)
        - Unsupported (hazardous chemical streams outsourced to specialist vendors)
    notes: Evaluations reflect demonstrated commercial project awards and technical architectures reported across semiconductor and hyperscale data center facilities. Status-quo options denote standard engineering practice.
