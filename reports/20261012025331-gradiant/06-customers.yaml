company:
  name: "Gradiant"
chapter:
  number: 6
  title: "Customers"
  summary: "Gradiant's strongest current adoption evidence is company-reported: $300 million of 2026 semiconductor awards, several repeat projects, and deployed HyperSolved systems at unnamed hyperscalers. The public record supports enterprise traction across fabs and data centers, but it does not disclose customer identities, retention metrics, contract duration, customer concentration, or customer-verified outcomes."
sections:
  - id: "customer-segments"
    title: "Enterprise Segments and Buying Context"
    body: "Gradiant is pursuing a concentrated enterprise strategy rather than a high-volume customer model: an October 2026 Outlook Business interview quoted management targeting the top five to ten customers in each industry. The clearest disclosed segments are semiconductor fabs and hyperscale data centers, with additional company positioning across power and other applied industries. India adds semiconductor, printed-circuit-board, and solar customers; management said the country represented about 10% of revenue. Buyers are therefore likely facility owners and infrastructure operators, while day-to-day users are plant, utilities, and water-operations teams. That buyer/user mapping is analytical because the retained materials do not identify procurement roles, payers, or individual customer organizations."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-evidence"
    title: "Adoption and Deployment Evidence"
    body: "The freshest semiconductor signal is Gradiant's September 2026 announcement of $300 million in new contracts since the start of the year, covering five fab sites in New York, Virginia, Idaho, and Utah. The same company-issued release described several awards as repeat business, including a second phase and a scrubber-reclaim design previously used for the same unnamed customer in Singapore, Taiwan, and the United States. Data-center evidence progressed from two contract awards announced in May 2025 to a May 2026 statement that HyperSolved was deployed with several unnamed hyperscale operators. These disclosures demonstrate awards, repeat work, and some deployed systems, but they are not independent customer confirmations and do not provide recognized revenue, utilization, uptime, or measured customer outcomes."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability and Expansion Signals"
    body: "Repeat awards are the best available durability proxy, but they are not retention metrics. The disclosed second phase and multi-country reuse of a scrubber-reclaim design suggest account expansion after an initial engagement, while HyperSolved's sourcing-to-discharge scope and lifecycle support create multiple potential expansion surfaces from commissioning through operations. Gradiant also said five new India contracts included a repeat award from a global chipmaker and that India orders were on track to more than double in 2026. Those signals remain company-issued, and the retained evidence does not disclose NRR, GRR, churn, renewal rates, contract length, backlog conversion, or the recurring share of service and chemical revenue. Durability therefore remains plausible but unquantified."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU015"
    figureRefs:
      - "FU001"
  - id: "concentration-and-diligence"
    title: "Concentration, Procurement, and Disclosure Risk"
    body: "Public customer proof is unusually anonymous for a business emphasizing large strategic accounts: every end-customer example in the retained sources is described by category rather than legal name. Outlook reported that India contributed about 10% of revenue and that Middle East revenue had taken an approximately 20% hit as customers paused new investments amid geopolitical tensions, but no top-customer or vertical concentration schedule is available. Separately, an April 2025 Economic Times topic-page summary linked co-founder Anurag Bajpayee to an alleged Cambridge-area investigation; this secondary summary does not establish wrongdoing or provide the proceeding's disposition. Enterprise procurement diligence should therefore verify current legal status and any customer impact directly, alongside reference calls, concentration data, and contract-level renewal evidence."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU014"
      - "CU016"
