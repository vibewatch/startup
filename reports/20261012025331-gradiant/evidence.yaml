evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements for FY2025-2026 disclosing GAAP/IFRS revenue, gross profit margin, EBITDA, cash
      balance, and debt obligations.
    whyItMatters: >-
      Gradiant operates as a private company disclosing revenue ranges ($500M-$750M) via executive press statements
      without third-party auditor attestation.
    diligencePath: >-
      Request audited financial statements, historical revenue reconciliations, and cash flow disclosures under NDA
      prior to investment.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Exact primary capital amount raised in the May 2026 Series E round, net proceeds, share price, liquidation
      preferences, and secondary transaction components.
    whyItMatters: >-
      Company announced a $2.0B post-money valuation without disclosing total capital taken onto the balance sheet or
      investor protective provisions.
    diligencePath: Review certificate of incorporation, Series E stock purchase agreements, and capitalization table.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: >-
      Full roster of board of directors, committee chairs, independent directors, and institutional investor
      representatives.
    whyItMatters: >-
      Enables assessment of board-level oversight and key-person risk following the executive chairman and CEO role
      division.
    diligencePath: Obtain corporate governance disclosures and board observer agreements during management meetings.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent TAM, SAM, and SOM with a disclosed industrial-water boundary, geography, base year, forecast
      period, and methodology.
    whyItMatters: >-
      Without a comparable denominator, company revenue, orders, and vertical mix cannot establish market share or
      penetration.
    diligencePath: >-
      Commission or obtain a reputable industrial-water dataset and reconcile its categories to Gradiant's included
      products and served geographies.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: order-conversion
    missingEvidence: >-
      Audited revenue by segment and geography, backlog aging, cancellation rights, project duration, gross margin, and
      order-to-revenue conversion.
    whyItMatters: >-
      Orders, revenue, and forward targets use different periods and denominators and therefore cannot be treated as one
      growth series.
    diligencePath: >-
      Review audited statements, signed-contract schedules, backlog roll-forward data, and segment-level pipeline
      conversion with management.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: competitor-commercial-terms
    missingEvidence: >-
      Audited multi-year lifecycle cost comparisons and realized availability guarantees from competing conglomerates
      like Veolia and Ecolab in semiconductor fabs.
    whyItMatters: >-
      Without verified competitor contract terms and long-term operating costs, Gradiant claimed total cost of ownership
      savings cannot be independently confirmed.
    diligencePath: >-
      Request customer procurement bid evaluations and benchmarking studies comparing Gradiant HyperSolved against
      competing incumbent vendor bids.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margin-structure
    missingEvidence: >-
      Audited income statements, segment gross margin breakdown (equipment capex vs. recurring O&M and digital
      services), and exact EBITDA figures for FY2024 and FY2025.
    whyItMatters: >-
      Without verified gross margin figures and recurring software ARR, underwriting Gradiant $2 billion valuation
      requires relying on management guidance and peer multiples rather than audited cash profitability.
    diligencePath: >-
      Request comprehensive confidential information memorandum (CIM), audited financial statements from company CFO,
      and breakdown of recurring versus non-recurring revenue under NDA.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pfas-benchmarks
    missingEvidence: >-
      Independent third-party verification and longitudinal operating logs of PFAS destruction efficiency and byproduct
      composition for ForeverGone under industrial semiconductor wastewater matrices.
    whyItMatters: >-
      While Gradiant reports complete mineralization to CO2 and water with lab validation, real-world fab effluents
      contain variable co-contaminants that may affect electrochemical cell life and destruction kinetics.
    diligencePath: >-
      Request customer field pilot reports, electrode replacement schedules, and independent analytical reports
      measuring effluent PFAS down to sub-part-per-trillion levels under high-TDS semiconductor conditions.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: developer-telemetry
    missingEvidence: Public software developer telemetry, open-source repositories, or developer API documentation for SmartOps AI.
    whyItMatters: >-
      Gradiant operates as an industrial water infrastructure and facility engineering provider rather than a
      developer-facing software platform, so direct developer metrics like GitHub stars, package downloads, or public
      APIs are absent.
    diligencePath: >-
      Review industrial automation control architecture, SCADA integration documentation, and proprietary
      machine-learning algorithm specifications under technical diligence.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, cohort retention, and recurring-revenue mix.
    whyItMatters: >-
      Awards and repeat projects do not establish revenue durability or the proportion of recurring operations,
      chemicals, and service revenue.
    diligencePath: >-
      Request customer-cohort schedules, renewal histories, contract tenors, and revenue split by equipment, service,
      operations, and chemicals.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Legal customer names, site-level deployment status, contract values, customer-verified KPIs, and referenceability.
    whyItMatters: >-
      Unnamed company disclosures cannot establish logo quality, production status across all awards, or independently
      verified outcomes.
    diligencePath: >-
      Obtain a complete customer list under NDA and conduct reference calls with at least two semiconductor and two
      data-center customers.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-one, top-five, and top-ten customer revenue and backlog shares by vertical and geography.
    whyItMatters: >-
      A strategy centered on a small number of large accounts can amplify delays, cancellations, and procurement
      changes.
    diligencePath: >-
      Request audited revenue and backlog concentration schedules plus sensitivity to the loss or delay of each top-five
      customer.
  - type: missing-source
    severity: material
    topic: reputational-risk
    missingEvidence: >-
      Primary court records, current proceeding status, disposition, and evidence of any resulting customer or
      procurement impact.
    whyItMatters: A secondary topic-page summary cannot establish the underlying facts, outcome, or commercial consequences.
    diligencePath: >-
      Have counsel retrieve the relevant primary records and ask management for disclosure history, board response, and
      customer-impact analysis.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: contract liability and indemnity terms
    missingEvidence: >-
      Specific contractual performance guarantees, liquidated damages caps, and effluent liability provisions in
      Gradiant's $300M US semiconductor awards.
