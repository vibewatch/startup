        - $500M - $750M range (targeting $1B)
        - High
        - Establishes commercial scale and market leadership
        - Obtain audited FY2024-FY2025 income statements to confirm net revenue
      - - Gross Margin %
        - Undisclosed (industry peer range 30-45%)
        - Low
        - Determines underlying profitability of equipment vs services
        - Request gross margin bridge by project delivery and recurring service lines
      - - Geographic Revenue Concentration (India)
        - ~10% of total company revenue
        - Medium
        - Highlights growth in Asia-Pacific and engineering cost base
        - Verify regional revenue split across Americas, APAC, and EMEA
      - - Regional Disruption Impact (Middle East)
        - ~20% revenue contraction from geopolitical tension
        - High
        - Demonstrates vulnerability to regional macro and capital pauses
        - Audit paused project pipeline and contract termination exposure in Middle East
    notes: Metrics reflect official executive interviews and verified news reporting; precise audited gross margin and EBITDA remain private undisclosed figures.
