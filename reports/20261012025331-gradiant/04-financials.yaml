callouts:
  - calloutType: insight
    title: HyperSolved and the Hyperscale Revenue Pivot
    body: Gradiant expansion into AI data center cooling via HyperSolved represents a strategic shift toward hyperscale infrastructure, with management projecting data centers to account for 25% of revenue by 2027. While this creates substantial revenue tailwinds, it also increases customer concentration risk among top hyperscalers.
    claimRefs:
      - CI004
      - CI005
  - calloutType: risk
    title: Geopolitical Headwinds and Governance Exposure
    body: A 20% revenue contraction in the Middle East illustrates the cyclical and geopolitical sensitivity of large-scale industrial water infrastructure. Combined with April 2025 executive controversies involving CEO Anurag Bajpayee, institutional investors must exercise thorough governance and ESG diligence ahead of any potential IPO.
    claimRefs:
      - CI008
      - CI010
