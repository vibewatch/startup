      - number: '7.2'
        title: 监管合规、环境要求与法律风险
        blocks:
          - type: paragraph
            body: >-
              Gradiant 处于严格环境、市政和工业监管的交汇处，需遵守危险化学品处理、有毒排放和本地取水规定 [CR003,
              CR006]。在先进半导体制造中，制造设施会产生含氢氟酸、复杂化学溶剂、重金属和持久性含氟化合物的高危废水流 [CR002, CR003, CR012]。Gradiant
              在五个美国半导体基地的合同要求交付完整组合系统，包括氢氟酸废水处理和旨在完全消除液体排放的零液体排放（ZLD）工厂 [CR002,
              CR003]。处理这些复杂水流时的任何工艺失效或监管不合规，都可能招致严厉环境执法罚款、市政下水道排放许可被撤销，以及州和联邦环保机构立即下令停产 [CR003,
              CR006]。与此同时，地方市政水资源约束和许可复杂度日益限制超大规模 AI 数据中心及半导体晶圆厂的选址，因为单个 100MW 园区每天所需用水相当于一座拥有 80,000 名居民的城市 [CR006,
              CR007]。公司治理与法律风险也值得关注：2025 年马萨诸塞州 Cambridge 的历史性 brothel hearings 点名联合创始人 Anurag
              Bajpayee，形成潜在的关键人物声誉拖累，机构投资团队和 ESG 委员会必须评估这一影响 [CR012, CR013]。
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR012
              - CR013
