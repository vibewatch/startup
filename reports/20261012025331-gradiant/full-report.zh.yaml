  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是工业水与废水系统的设计、建设、运营、优化和化学支持，范围从取水、超纯水生产延伸至回用、资源回收和排放。该边界包括芯片、数据中心、电力、食品饮料、制药、采矿和先进制造所需的关键基础设施；不包括与工业场所无关的市政网络及通用数字基础设施。现状并非另一家水务供应商，而是内部工程团队、工程采购施工公司、设备专业商、化学品供应商和独立运营承包商的碎片化组合。Gradiant
              希望以一个承担责任的水务层替代多供应商协调负担，因此其可服务支出范围小于整个水务经济，却宽于任何单一处理技术。
            claimRefs:
              - CM001
              - CM014
              - CM015
