              - CR007
              - CR008
      - number: '7.3'
        title: 运营规模化、供应链与工程执行
        blocks:
          - type: paragraph
            body: >-
              在 92 个国家交付超过 3,000 座处理工厂的工业水系统，需要采购、专业制造和工程协调均不出错 [CR001, CR008]。为支持全球设计和工程执行并向 $1 billion 目标扩张，Gradiant
              正扩大印度 Coimbatore 的 Global Engineering Center（GEC），将工程人员从约 100 人增至超过 200 人 [CR004,
              CR005]。这次扩员把全球项目的核心工艺、详细设计和项目工程集中在印度，因而让设计中心与美国、欧洲和东亚实体部署地点之间产生跨境协调依赖 [CR004, CR005]。此外，Gradiant 的技术承诺依赖
              SmartOps AI 等专有数字 AI 平台，以及 CURE Chemicals 等专用耗材，以优化水回用并确保开机率 [CR006, CR008]。将 AI
              驱动控制系统接入关键冷却和废水运营，会引入网络物理可靠性风险、传感器漂移隐患和化学品供应链脆弱性 [CR006, CR007]。运营瓶颈或组件延迟可能在半导体晶圆厂和数据中心园区的严格建设进度下触发违约金
              [CR002, CR007]。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
