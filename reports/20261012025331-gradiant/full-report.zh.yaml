      - number: '6.3'
        title: 持久性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              重复获奖是现有最佳持久性代理指标，但不是留存指标。已披露的第二阶段项目和洗涤器回收设计的多国复用，说明初次合作后账户可能扩张；HyperSolved
              从取水到排放的范围及全生命周期支持，也从启用到运营创造了多个潜在扩张面。Gradiant 还称，印度五份新合同中包括一家全球芯片制造商的重复订单，且印度订单有望在 2026
              年增长一倍以上。这些信号均由公司发布，保留证据未披露 NRR、GRR、流失、续约率、合同期限、订单储备转化率，或服务和化学品收入的持续性占比。因此，持久性仍属合理推断，但无法量化。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU015
