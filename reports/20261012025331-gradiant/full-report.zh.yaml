            body: >-
              保留的来源没有提供针对 Gradiant 确切市场边界、方法透明且独立的市场规模估计。可辩护的规模证据来自自下而上推导：Gradiant 报告自 2026 年初以来在五个制造基地获得 $300 million
              美国半导体新合同；独立访谈将当前公司收入置于 $500 million 至 $750 million，管理层目标则是在两到三年内达到 $1 billion。公司发布的证据还预计，到 2027
