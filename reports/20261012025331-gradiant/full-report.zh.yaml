        - 高
        - 上市窗口推迟或估值倍数压缩
        - 高
        - 灵活资本化策略，维持进入私人资本市场的渠道
        - 若增长目标放缓，流动性延长期及潜在降价轮融资风险
    claimRefs:
      - CR004
      - CR005
      - CR009
      - CR010
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 建议汇总表
    columns:
      - 决策维度
      - 立场 / 评级
      - 支持证据与核心理由
      - 投资含义
    rows:
      - - 建议
        - 跟踪
        - AI 与晶圆厂用水业务商业进展强劲，但财务透明度不足且面临法律审查
        - 在 $2.0B 估值下保持积极跟踪，但不投入首轮资本
      - - 信心与立场
        - 中等 / 偏高
        - 2.7x–4.0x 收入估值倍数已计入无瑕疵的 $1.0B 扩张，而审计利润率尚无证明
        - 坚持要求审计财务披露及结构化下行清算保护
      - - 风险评级
        - 高
        - 中东地缘政治导致收入下降 20%，且 Cambridge 妓院听证会引发审查
        - 彻底开展关键人员尽调，并核查地区客户订单积压
      - - 退出准备度
        - 私募灵活性
        - 管理层称没有固定 IPO 时间表，并愿意继续寻求私人资本
        - 按 3–5 年流动性期限建模，而不是假设近期上市
    notes: 综合已披露的 Series E 估值标记、管理层访谈信息及据报道的地缘政治合同暴露。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV013
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点
      - 转向触发因素
    rows:
      - - 市场需求
        - AI 芯片与数据中心面临严重水资源约束，Gradiant 的全栈方案可解决这一问题
        - 半导体资本开支周期或超大规模客户重做冷却方案，可能拖慢采用
        - 超大规模客户转向远离高耗水蒸发式冷却架构
      - - 商业验证
        - $300M 新晶圆厂合同及 HyperSolved 部署验证了技术领先地位
        - 工业项目收入不均衡，造成季度现金流波动与执行风险
        - 多地半导体水基础设施建设延迟或取消
      - - 地域布局
        - 覆盖美国、印度及亚太的全球工程触达能力分散运营产能
        - 地区地缘政治冲突与项目暂停导致中东收入收缩 20%
        - 中东水处理资产长期冻结或进一步减值
      - - 治理与团队
        - MIT 深厚技术人才储备及经验丰富的水务行业资深管理层
        - 执行董事长与 Cambridge 妓院听证会有关联，增加尽调摩擦
        - 创始人被正式起诉、遭监管处罚或离任
    notes: 基于已核实的商业披露、治理报告及缺失的审计指标，对投资论点与反论点进行比较评估。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 运营与财务假设
      - 隐含估值与倍数
      - 下行触发因素与主要风险
    rows:
      - - 乐观情景
        - 25%
        - 2 年内收入达到 $1.0B；HyperSolved 占比达到 25%；美国订单储备达到 $1.0B
        - $3.50B 估值（远期收入倍数 3.5x）
        - GEC 工程中心产能受限或半导体晶圆厂延迟
      - - 基准情景
        - 55%
        - 收入达到 $750M；国内晶圆厂合同抵消中东疲软；利润率保持稳定
        - $2.25B 估值（收入倍数 3.0x）
        - 中东合同长期冻结或私人融资周期延长
      - - 悲观情景
        - 20%
        - 收入停滞在约 $500M；中东亏损扩大；治理拖累推迟 IPO
        - $1.50B 估值（按低迷基数的 3.0x 倍数，降价轮估值下调 25%）
        - 关键客户取消、妓院调查持续引发审查及现金消耗压力
    notes: 情景概率权重与隐含估值区间源自据报道的 $500M–$750M 收入基数及 2026 年 Series E 基准。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Gradiant 从 MIT 分拆公司成长为估值 $2.0B 的工业水基础设施领导者的时间顺序。
    data:
      items:
        - label: 2013：MIT 分拆公司成立
          detail: Anurag Bajpayee 与 Prakash Govindan 基于 MIT 水处理研究在波士顿共同创立 Gradiant。
          tone: neutral
        - label: 2023 年 5 月：独角兽估值（$1B）
          detail: Gradiant 完成 $225M Series D 融资后，估值达到 $1.0B，成为独角兽。
          tone: positive
        - label: 2023 年 10 月：扩张欧洲布局
          detail: 完成收购德国 H+E Group（Hager+Elsässer）51% 的控股股权，以扩大工业水解决方案规模。
          tone: positive
        - label: 2024 年上半年：商业加速
          detail: 据报道，2024 年上半年新增订单超过 $500M，并拓展至微电子与能源行业。
          tone: positive
        - label: 2025 年 4 月：Cambridge 妓院调查
          detail: 创始人兼 CEO Anurag Bajpayee 与 Cambridge 妓院听证会有关联；董事会与公司公开表示相信司法程序。
          tone: adverse
        - label: 2026 年 5 月 12 日：HyperSolved 上线
          detail: 发布并部署 HyperSolved，这是一套面向超大规模 AI 数据中心的交钥匙冷却水平台。
          tone: positive
        - label: 2026 年 5 月 18 日：$2B Series E 融资
          detail: 在 Safar Partners 与 Hostplus 领投下完成 Series E 融资，估值 $2.0B；建立新的执行董事长与 CEO 架构。
          tone: positive
        - label: 2026 年 8 月：美国地域扩张
          detail: 任命 Dr. Nish Vora 为美洲区董事总经理，在 Phoenix、Syracuse 与 Philadelphia 开设办公室，并启动 Houston Innovation Centre。
          tone: positive
        - label: 2026 年 10 月：全球交付与 GEC 扩张
          detail: 据报道收入运行率为 $500M–$750M，其中印度占 10%；在中东拖累下，Coimbatore 工程团队规模翻倍至 200+ 人。
          tone: neutral
    approximationNotes: 时间线里程碑反映公司公开公告及管理层披露；较早日期已与此前报道交叉核实。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO006
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: 受证据约束的市场规模视角
    type: pyramid
    summary: 定性规模分层将 Gradiant 广义的工业水边界，与公司层面实际已量化的商业指标区分开来。
    data:
      nodes:
        - label: 工业水基础设施
          value: Unquantified
          detail: 覆盖工业取水、处理、回用、回收与排放的广义边界。
        - label: 高耗水行业
          value: Multiple verticals
          detail: 芯片、数据中心、电力、食品、制药、采矿、可再生能源及先进制造。
        - label: AI 经济优先层
          value: Chips, data centers, power
          detail: 公司当前定位聚焦实体 AI 基础设施所需的水资源。
        - label: 公司当前收入
          value: $500M-$750M
          detail: Outlook Business 于 2026 年 10 月报道的管理层区间；未经审计。
        - label: 美国半导体订单
          value: $300M
          detail: 公司自述 2026 年初以来在五座晶圆厂新增的合同。
        - label: 数据中心业务占比
          value: ~25% by 2027
          detail: 公司对其全球业务占比的预测，不是市场份额。
    approximationNotes: 各层并非按比例表示，也不构成 TAM、SAM 或 SOM。美元数值混合了公司收入与合同金额，百分比是公司业务组合预测。
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM008
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按全生命周期整合度与工艺复杂度，展示水技术供应商及替代方案的战略定位。
    data:
      points:
        - label: Gradiant
          x: 9
          'y': 9
          note: 借助 SmartOps AI，从取水到零排放承担全生命周期责任。
        - label: 全球综合集团（Veolia / Ecolab）
          x: 7
          'y': 7.5
          note: 覆盖面广，通过多供应商整合管理化学品。
        - label: 专业设备 OEM
          x: 3
          'y': 6.5
          note: 特定组件技术能力强，但全生命周期范围有限。
        - label: 传统 EPC 承包商
          x: 4
          'y': 3.5
          note: 使用第三方通用设备建设交钥匙项目。
        - label: 内部工程建设
          x: 4.5
          'y': 4.5
          note: 采用闭环设施设计，但缺少专业卤水浓缩技术。
        - label: 市政排放现状
          x: 1.5
          'y': 1.5
          note: 场外运输与 POTW 排放易受地区用水上限影响。
    approximationNotes: 序数定位沿两条轴展开：全生命周期整合范围（x：0–10，从单点设备到完整交钥匙生命周期）与极端水处理复杂度（y：0–10，从基础过滤到零液体排放）。
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP014
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示客户如何从工业及 AI 数据中心用水需求，转化为多元收入流与利润率的运营及商业桥接图。
    data:
      nodes:
