      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是高耗水工业资产的所有者或开发商，预算责任分散在设施、公用事业、工艺工程、运营、可持续发展和资本项目团队之间。工厂运营人员与工艺工程师是日常用户，财务和高管赞助人则为产能、可靠性和合规投入资金。当水资源可得性、排放限制、产能扩张或责任碎片化威胁项目进度或产出时，客户便会启动采用。半导体领域的重复获奖，以及某一洗涤器回收设计超过
              80% 的回用表现，说明已验证的交付能力可以在现有客户中扩大范围。销售路径仍由项目驱动且技术密集，意味着认证和执行周期较长，而非软件式的无摩擦扩张。
