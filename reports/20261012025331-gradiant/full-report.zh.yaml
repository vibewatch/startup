      - number: '5.5'
        title: 知识产权护城河、技术差异化与关键尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的技术防御力建立在 288
              项已获授权及待审专利组成的广泛专有组合之上，围绕逆流膜机械结构、电化学销毁催化剂和载气萃取热力学形成显著知识产权护城河。技术基础源自麻省理工学院的研究，相较于主要拥有标准化反渗透和热蒸发硬件的传统水处理集团，形成深厚的热力学差异化。此外，Gradiant
              收购并整合了专业工程公司，包括欧洲工业水务老兵 H+E 和总部位于 Taiwan 的 WaterPark，借此以区域制造能力和本地工艺工程专业知识增强内部研发。尽管如此，对 Gradiant
              技术进行投资判断仍需严格审视若干未解决的尽调事项。公司报告了庞大的全球运营指标——每天减少 6.5 billion liters 淡水取用，在 92 个国家拥有超过 3,000
              个处理装置——但工厂级开机率、膜使用寿命和全生命周期更换成本仍无法从公开披露中独立验证。具体到 ForeverGone，记录阳极寿命、每千克销毁 PFAS
              的能耗以及复杂工业废物流下销毁副产物的独立纵向数据均未公开。投资者还必须评估过往领导层调查之后的地缘政治与高管稳定性，以及位于印度 Coimbatore、正从 100 人扩张到超过 200
              名工程师以支撑全球项目储备的 Global Engineering Center 的技术执行能力。
            claimRefs:
              - CE004
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
