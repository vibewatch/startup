          label: 工业与超大规模用水需求
        - id: contract
          label: 交钥匙工程与 DBO 承包
        - id: delivery
          label: 模块化部署与资本基础设施
        - id: recurring
          label: SmartOps AI 与持续运营维护服务
        - id: revenue
          label: 混合资本开支与经常性收入确认
        - id: cashflow
          label: 运营利润率与再投资空间
      edges:
        - from: demand
          to: contract
