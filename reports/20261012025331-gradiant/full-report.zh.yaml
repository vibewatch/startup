              - CE014
              - CE015
      - number: '5.2'
        title: 核心技术组合与模块化方案图
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的商业解决方案架构由四条主要产品线和应用套件组成，分别适配不同工业运行场景。对于高纯度制水和卤水浓缩，公司在专利 Counter-Flow Reverse
              Osmosis（CFRO）技术之外，还销售 RO Infinity 平台。传统高压反渗透系统会遇到严重渗透压障碍，热结晶器则需要巨大能耗；CFRO 采用逆流膜级，将工业卤水浓缩至最高 260,000 mg/L
              总溶解固体，同时在不超过 69 bar 的压力下运行。针对持久性化学污染，Gradiant 将 ForeverGone
              商业化为专门处理全氟和多氟烷基物质（PFAS）的现场一体化系统。传统颗粒活性炭或离子交换树脂只会将 PFAS 浓缩并转移到固体介质，后者还需异地危险焚烧或填埋；ForeverGone
              则通过微泡分馏浓缩含氟分子，再以电化学方式将其分解为二氧化碳和水。对于 AI 数据中心园区，Gradiant 将冷却技术打包为 HyperSolved 交钥匙平台，整合集装箱式及永久性水基础设施、自有 CURE
              处理化学品和自动化设施控制，让超大规模算力运营商免受当地市政供水约束。
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE010
