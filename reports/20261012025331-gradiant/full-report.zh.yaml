chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品架构
        blocks:
          - type: paragraph
            body: >-
              Gradiant
              创立于麻省理工学院，总部位于马萨诸塞州波士顿，已成为服务全球关键行业的先进水与废水基础设施公司。随着人工智能算力园区和半导体制造设施快速扩张，水资源可得性、净化质量和废水处置限制已成为硬约束。Gradiant
              将自己定位为 AI 经济的专用水基础设施层，解决这些工业约束。公司并非零部件设备供应商，而是设计、建设并运营完整的垂直一体化水系统，覆盖淡水取水、超纯水生产、高回收率废水回收和资源再生。2026 年 5
              月，Gradiant 推出 HyperSolved，为多家全球超大规模运营商部署专用 AI 数据中心冷却水基础设施，通过一体化处理、化学配方和自有 AI 驱动运营控制，消除冷却水约束。
            claimRefs:
              - CO001
              - CO002
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO011
              - CO014
      - number: '1.2'
        title: 高管领导与治理重组
        blocks:
          - type: paragraph
            body: >-
              Gradiant 自成立以来一直由联合创始人 Anurag Bajpayee 和 Prakash Govindan 主导技术与商业发展；两人均拥有 MIT
              工程博士学位，并将专有热力学分离研究转化为商业水处理应用。配合 2026 年 5 月 E 轮融资，Gradiant 正式进行重要的高管治理重组。Anurag Bajpayee
              从首席执行官转任执行董事长，专注战略全球扩张和资本筹集；联合创始人 Prakash Govindan 则出任首席执行官，负责运营执行和超大规模企业部署。此次交接发生在 2025 年 4
              月更广泛的声誉审查之后，当时 Bajpayee 被与备受关注的 Cambridge Brothel Hearings 联系起来，公司随后公开确认机构信心。为加速北美商业规模，Gradiant 聘请来自
              Veolia、Suez 和 GE Water、拥有 30 年水务行业经验的 Nish Vora 博士担任美洲董事总经理。
