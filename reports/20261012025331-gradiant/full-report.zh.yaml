        title: 展示项
        blocks:
          - type: callout
            title: 专有膜与电化学知识产权护城河
            body: >-
              Gradiant 拥有超过 288 项已获授权及待审专利组成的知识产权资产，核心是源自 MIT 的 Counter-Flow Reverse Osmosis（CFRO）技术；该技术可在中等运行压力（<=69
              bar）下将高盐卤水浓缩至 260,000 mg/L TDS，相较传统热卤水浓缩实现显著运营效率优势。
            calloutType: strength
