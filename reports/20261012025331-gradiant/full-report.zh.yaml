      - number: '1.4'
        title: 运营规模、商业动能与时间线
        blocks:
          - type: paragraph
            body: >-
              Gradiant 已达到相当大的全球工业规模，并自报截至 2026 年末年度收入运行率为 $500 million 至 $750 million，管理层目标是在两到三年内达到 $1.0
              billion。在美国，商业动能由长期运营维护协议支撑，其中包括为一家大型美国半导体制造商运营超纯水系统的高关注度合同，推动未来一年的美国订单储备目标预计达到 $1.0 billion。为支持北美扩张，公司在
              Phoenix、Syracuse 和 Philadelphia 设立区域办公室，并启动 Houston Global Innovation Centre。在全球范围内，Gradiant 正扩大其位于印度
              Coimbatore 的 Global Engineering Center，将技术工程人员从 100 人增至超过 200
              人。不过，全球运营扩张仍面临地区摩擦：中东地缘政治紧张导致区域资本开支周期暂停，收入估计收缩 20%。
