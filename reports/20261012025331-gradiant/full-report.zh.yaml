      - number: '6.4'
        title: 集中度、采购与披露风险
        blocks:
          - type: paragraph
            body: >-
              对一家强调大型战略客户的企业而言，公开客户证明异常匿名：保留来源中的每个终端客户例子都按类别而非法律名称描述。Outlook 报道称印度贡献约 10% 的收入，中东收入则因客户在地缘政治紧张期间暂停新投资而受到约
              20% 的冲击，但不存在头部客户或垂直行业集中度表。另有 2025 年 4 月 Economic Times 主题页摘要将联合创始人 Anurag Bajpayee 与一项据称发生在 Cambridge
              地区的调查联系起来；这份二手摘要既不能证明不当行为，也没有提供程序处置结果。因此，企业采购尽调应直接核实当前法律状态及任何客户影响，同时进行参考访谈、集中度分析和合同层面的续约证据核查。
            claimRefs:
              - CU010
              - CU011
              - CU014
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 重复获奖是最强的持久性代理指标
            body: 已披露的第二阶段项目、洗涤器回收设计的多国复用以及印度的重复订单，都说明现有客户账户有所扩张，但任何一项都不能替代客户群留存数据。
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: 公开证据不足以证明集中度和留存
            body: 保留证据没有点名任何终端客户，也未披露 NRR、GRR、流失、续约率、合同期限或头部客户份额；在作出投资判断前，需要管理层数据和客户参考访谈。
            calloutType: risk
            claimRefs:
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险架构与投资论点脆弱性
        blocks:
          - type: paragraph
            body: >-
              将 Gradiant 视为面向半导体制造和超大规模人工智能数据中心的专业水与废水基础设施供应商后，可以看到显著的运营、市场和战略风险 [CR001]。公司虽已在 2026 年初以来于 New
              York、Virginia、Idaho 和 Utah 等主要美国制造基地取得总额 $300 million 的半导体合同 [CR002]，但扩张目标仍要求管理极高的技术精度和项目执行风险
              [CR003]。半导体晶圆厂和 AI 数据中心的水基础设施存在单点故障：设备停机、化学失衡或处理能力瓶颈，都会直接令数十亿美元制造产线或算力集群停摆 [CR003, CR007]。因此，Gradiant
              的运营模式已从标准工业水技术转向关键基础设施交付，失效情形将带来灾难性责任和合同终止风险 [CR003, CR011]。此外，Gradiant 计划在两到三年内将收入近乎翻倍至 $1
              billion，这会给全球工程和项目交付组织带来巨大运营压力 [CR004,
              CR005]。管理层把资本和工程资源集中用于服务关键行业排名前五至十的客户，也使客户集中度和对超大规模资本开支周期的依赖成为主要下行脆弱点 [CR005, CR011]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR011
