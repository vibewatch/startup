              - CP007
              - CP014
      - number: '3.3'
        title: 商业打包、交付模式与客户锁定
        blocks:
          - type: paragraph
            body: >-
              先进工业水务的客户采购具有显著惯性；运营架构一旦启用，切换成本也很高。传统设备销售将运营风险、化学品采购和膜更换转嫁给工厂运营者，而 Gradiant 强调长期交钥匙运营和
              Build-Own-Operate-Transfer（BOOT）服务结构。这些多年期服务模式产生持续收入，同时让工业客户免受设施停机风险影响。Gradiant
              有意瞄准半导体、数据中心和工业垂直领域排名前五至十的企业客户，而不是追求碎片化的小规模部署。一旦接入半导体晶圆厂或超大规模园区，多设施复制就会形成强大的采用飞轮：客户先在 Singapore 和 Taiwan
              的国际制造厂验证 Gradiant 洗涤器回收系统，随后又在 New York、Virginia、Idaho 和 Utah 的美国设施扩建阶段重复下单，形成持久的账户锁定。
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP003
