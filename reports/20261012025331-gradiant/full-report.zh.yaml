  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 工业水务竞争格局与供应商分类
        blocks:
          - type: paragraph
            body: >-
              工业水处理竞争格局包括三类不同供应商，以及两种客户现状替代方案。Veolia Water Technologies 和 Ecolab
              等传统全球水务集团拥有巨大全球规模和深厚企业关系，但历史上往往通过碎片化子系统套件或持续化学耗材合同处理复杂工业项目，而不是运营端到端交钥匙设施。相反，Aquatech International 和 Ovivo
              等专业设备 OEM 制造膜过滤、离子交换或热蒸发的高性能组件，但通常销售离散设备包，需要客户或工程采购承包商（EPC）负责集成和运营。Gradiant
              将自己定位为一体化全生命周期供应商，以单一责任点设计、建设和运营完整水与废水设施。其在主要美国半导体制造基地的商业牵引展示了这一模式：自 2026 年初以来，公司通过交付从超纯水到零液体排放的端到端方案，拿下了
              $300 million 新合同。
            claimRefs:
              - CP001
              - CP003
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP011
              - CP014
      - number: '3.2'
        title: 能力矩阵与技术差异化
        blocks:
          - type: paragraph
            body: >-
              对关键行业的尽调显示，不同架构处理极端废水化学和监管排放约束的方式存在明显差异。半导体制造设施既需要 ppb 级超纯水（UPW）进水，也需要高回收率处理含氢氟酸和化学洗涤器废水等侵蚀性排放流。组件 OEM
              提供独立反渗透装置或结晶器，而 Gradiant 将自有 Carrier Gas Extraction（CGE）与反渗透技术结合，在复杂水流上实现超过 80% 的进料体积回收率。同样，在超大规模 AI
              数据中心，Gradiant 的 HyperSolved 平台把实体水处理硬件、自有 CURE 特种化学品和闭环 SmartOps AI 数字控制结合起来。这种端到端设计支持交钥匙超大规模园区交付，在 West
              Texas 等严重缺水流域实现面向地表水的零排放，并消除多供应商传统架构固有的协调开销和运营摩擦。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
