  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与全生命周期工业水平台
        blocks:
          - type: paragraph
            body: >-
              Gradiant 将自己定位为一体化工业水与废水处理基础设施供应商，解决其所谓现代 AI 经济的水务层问题。Gradiant
              不只是组件设备供应商或独立软件商，而是在关键制造行业设计、建设并运营完整的端到端水管理设施。在客户工作流中，Gradiant
              解决的是先进工业设施的核心运营瓶颈：尤其是半导体制造厂和超大规模人工智能数据中心，如果没有稳定的超高纯度工艺水供应和合规废水排放系统，就无法扩张。公司的交付模式覆盖完整工业水循环，依靠
              Reduce、Reclaim、Renew
              三项运营要务。首先，平台处理退化的市政回用水或受损工业水源，减少原水取用。其次，从复杂废水流中回收异丙醇等工业溶剂、重金属和浓缩盐等有价值资源。第三，将工业废水再生为高纯度工艺水，使先进制造环境中的现场回收回路达到超过
              90% 的回收率。为落地这一生命周期，Gradiant 将模块化实体硬件与自有特种化学品及自动预测监控结合，消除碎片化的多供应商交接。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
