      - number: '5.4'
        title: 子系统架构、技术依赖与运营失效模式
        blocks:
          - type: paragraph
            body: >-
              拆解 Gradiant 的运营架构可以看到一个多层工程系统，其中实体、化学和计算依赖彼此紧密耦合。在工厂进水和进料调节层，Selective Chemical Extraction（SCE）与 Fluidized
              Bed
              Crystallization（FBC）去除硬度阳离子、二氧化硅和重金属。这一调节至关重要，因为下游膜模块极易发生矿物结垢和不可逆表面污染。浓缩层依靠以逆流方式排列的专用半透膜元件，需要精确的压力调节和高耐久聚合物外壳，以承受强力工业清洗。数字监管层则部署
              SmartOps AI，持续优化系统设定值。SmartOps AI 通过 IoT 遥测和工厂 SCADA
              接口运行，预测膜污染趋势、安排主动反冲洗，并计算最佳混凝剂和阻垢剂投加率。然而，这种一体化架构也带来独特的技术依赖和运营失效模式。首要脆弱点是进料波动：上游化学浓度突然上升或出现模型未覆盖的共污染物，可能压垮预处理化学体系，导致膜灾难性结垢或电化学销毁阳极性能下降。此外，依赖算法控制设定值也使运营依赖持续传感器校准和网络完整性；传感器漂移可能导致化学品投加不佳。
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
