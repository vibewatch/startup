      - number: '3.4'
        title: 替代方案、在位者应对与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              判断护城河能否持久，需要考察替代冷却技术或在位者应对是否会取代 Gradiant
              的市场地位。在数据中心，直达芯片液冷快速采用，在封闭的机房回路内循环流体，令一些观察者预测设施用水需求会下降。然而，独立工程评审确认，数据大厅取消蒸发冷却，并不等于园区层面的用水需求消失：进水净化、散热回路、冷却塔排污管理以及地表零排放废水处理仍是关键现场约束。Gradiant
              的护城河建立在全球超过 3,000 座工厂的执行记录、高纯度工艺专利以及 $500 million 至 $750 million 的运营规模之上。不过，重要脆弱性仍然存在：Veolia
              等传统集团拥有更强的资产负债表能力，可为数亿美元项目融资；近期区域地缘政治紧张又使 Gradiant 中东业务收入收缩 20%，凸显其对地域执行的依赖。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
