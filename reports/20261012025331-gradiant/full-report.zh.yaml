      - number: '1.3'
        title: 资本结构、投资者联合体与估值历史
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 18 日，Gradiant 完成 E 轮融资，取得 $2.0B 投后估值；相较 2023 年 5 月实现的 $1.0B 独角兽估值，股权资本化基准翻倍。本轮由总部位于波士顿的科技创投机构
              Safar Partners 和澳大利亚 Hostplus Superannuation Fund 共同领投，工业软件投资者 ClearVision Ventures
              及其他国际机构跟投。半导体晶圆厂、数据中心和先进制造园区对工业废水处理及闭环回收的结构性需求激增，推动了投资者兴趣。然而，尽管机构支持者强调 Gradiant 的技术差异化和其所称的运营盈利能力，公司并未披露 E
              轮具体募集的一级资本金额、是否存在二级股份出售或清算优先权结构，因此资产负债表资本化细节仍未获公开披露验证。
