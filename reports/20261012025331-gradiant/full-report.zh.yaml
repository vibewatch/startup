      - CI003
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构展示 Gradiant 一体化工业水平台，从工厂自动化延伸至热结晶器排放。
    data:
      layers:
        - label: 智能监控与控制层
          detail: SmartOps AI 云端与边缘平台提供设施实时监控、预测性设定点优化、自动化学品投加及预防性维护遥测。
        - label: 特种化学品层
          detail: CURE Chemicals 产品组合旨在减少传统试剂用量、防止膜生物污堵，并稳定 AI 数据中心的冷却水循环。
        - label: 目标污染物销毁层
          detail: ForeverGone 微泡分馏与电氧化销毁引擎，结合 FRO 和 AquaCritox 湿式氧化，在现场永久销毁 PFAS 与复杂有机物。
        - label: 高级膜与浓缩层
          detail: RO Infinity 与专利逆流反渗透（CFRO）可在 <=69 bar 下将卤水浓缩至最高 260,000 mg/L TDS，并结合本地洗涤器回收系统。
        - label: 生物与选择性预处理层
          detail: Bio-Infinity 生物处理（UASB、AFB、MBBR、超声波）与选择性化学萃取（SCE 搭配 FBC）针对重金属、氟化物及二氧化硅。
        - label: 热浓缩与零液体排放层
          detail: 载气萃取（CGE）与机械蒸汽再压缩系统可回收最高 99% 的废水体积，并产出用于最终处置的干固体饼。
    approximationNotes: 分层拆解展示 Gradiant 模块化处理链在半导体与数据中心部署中的端到端技术层级。
    claimRefs:
      - CE013
      - CE014
      - CE015
  - id: FU001
    title: 基于证据的企业扩张路径
    type: journey-map
    summary: 从现场约束到重复扩张的概念性客户路径，区分已披露能力与未报告的转化、留存指标。
    data:
      items:
        - label: 现场约束
          detail: 水资源可用性、许可、排放限制或工艺水质量催生采购需求。
          touchpoints:
            - 设施规划
            - 公用工程
        - label: 一体化设计
          detail: Gradiant 将源水、处理、回用与排放作为一个系统整体规划。
          touchpoints:
            - 设计工程
            - 替代水源
        - label: 初始产能
          detail: 集装箱式或永久性系统可支持即时及长期产能。
          touchpoints:
            - 部署
            - 调试
        - label: 运营
          detail: 全生命周期支持从调试延伸至运营。
          touchpoints:
            - 水务运营
            - 可靠性支持
        - label: 优化
          detail: SmartOps AI 与 CURE Chemicals 集成在运营平台中提供。
          touchpoints:
            - 监控
            - 处理优化
        - label: 重复扩张
          detail: 已披露的二期项目及跨现场复用设计，是最清晰的公开扩张信号。
          touchpoints:
            - 新增阶段
            - 多地复制
    approximationNotes: 概念性顺序基于已披露的平台能力与重复获奖；这不是实测漏斗，也不代表任何转化率或留存率。
    claimRefs:
      - CU003
      - CU007
      - CU015
  - id: FR001
    title: 风险热力图：影响 × 可能性矩阵
