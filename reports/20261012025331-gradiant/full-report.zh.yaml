      - number: '7.4'
        title: 地缘政治波动、交易对手集中与资本配置
        blocks:
          - type: paragraph
            body: >-
              Gradiant 面临明显的地缘政治逆风和区域收入波动，暴露出交易对手与地域风险 [CR004, CR009]。首席运营官 Govind Alagappan 明确披露，中东地区收入因地缘政治紧张局势下滑约
              20%，多名客户在等待局势稳定期间暂停了新的资本投入 [CR004, CR009]。印度约占全球收入的 10%，美国仍是主要商业支点，但地缘分裂正直接威胁国际项目管线 [CR004,
              CR009]。财务方面，Gradiant 于 2026 年 5 月完成 Series E 融资，投后估值为 $2.0 billion，由 Safar Partners 和 Hostplus
              Superannuation Fund 领投 [CR004, CR010, CR014]。管理层释放信号称，
              公司将在潜在首次公开募股（IPO）和继续募集私人资本之间保留退出选择，现有投资人的流动性时间表因此仍未明确 [CR004, CR010]。与此同时，历史并购整合（例如收购德国 H+E Group
              (Hager+Elsässer) 51% 的控股权益） 说明并购后整合及多法域子公司治理风险仍在持续，可能侵蚀运营利润率 [CR015, CR016]。
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 工业水务层是关键基础设施瓶颈
            body: >-
              工业水处理已不再只是边缘性的可持续发展议题，而是半导体晶圆厂投产和 AI 数据中心开发的硬性运营约束。 Gradiant
              的超纯水或零液体排放系统一旦失效，就会直接叫停客户数十亿美元规模的运营，把执行风险放大为任务级负债。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR007
          - type: callout
            title: 地缘政治与工程集中度的权衡
            body: >-
              Gradiant 将 Coimbatore 全球工程中心扩充至 200 多名工程师，优化了成本结构和执行能力，却也制造了工程集中度风险。 与此同时，中东收入已被证实下滑
              20%，说明工业水务基础设施仍高度暴露于区域地缘政治不稳定。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的投资论点建立在其战略定位之上：它是支撑人工智能硬件制造和超大规模数据中心运营的关键水务基础设施层。
              先进半导体晶圆厂和高密度算力设施每天需要数百万加仑超纯水，造成严重的市政与监管瓶颈。Gradiant 通过垂直整合设计、 化学处理和零液体排放系统应对这些约束；自 2026
              年初以来，公司已在纽约、弗吉尼亚、爱达荷和犹他州拿下 $300 million 的新半导体合同，并与全球超大规模云厂商部署 HyperSolved 数据中心平台。反论点则指出，
              运营和治理上的重大脆弱性正在压低这轮商业扩张的含金量。Gradiant 披露，地缘政治紧张和客户暂停投资导致其中东业务收入 预计下滑 20%，地域波动由此暴露无遗。此外，围绕执行董事长 Anurag
              Bajpayee、且被广泛报道的妓院调查听证会引发了 对高管层的审视，形成尚未量化的治理与机构投资判断逆风，使近期资本化更加复杂。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV009
              - CV010
      - number: '8.2'
        title: 融资背景、倍数与情景分析
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Gradiant 完成 Series E 融资，投后企业估值为 $2.0 billion，由 Safar Partners 和 Hostplus Superannuation Fund
              共同领投，ClearVision Ventures 亦参与其中。管理层指引显示年收入在 $500 million 至 $750 million 之间，由此计算，$2.0 billion 估值对应 2.7x 至
              4.0x 收入进入倍数。相较于高增长工业科技和 水务基础设施同业，这一表面倍数看似合理，但该估值已经计入 Gradiant 未来两三年收入顺利走向 $1.0 billion 的预期。
              我们的情景模型检验这些底层假设有多脆弱。乐观情景下，超大规模云厂商快速采用 HyperSolved，美国晶圆厂加速建设， 推动收入达到 $1.0 billion，并以项目高毛利支撑估值扩张至 $3.5
              billion。基准情景下，国内水回收项目持续获胜， 抵消中东疲软，收入达到 $750 million，估值维持在 $2.25 billion。悲观情景下，区域项目继续延期、半导体资本开支消化、
              公司治理审查加剧，收入压缩至 $500 million，估值降至 $1.5 billion。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
      - number: '8.3'
        title: 可比基准、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              将 Gradiant 与 Xylem、Ecolab、Veolia 等上市水处理龙头及私营专业工程商比较后可以看出，Gradiant 凭借更高的公开增长率和
              微电子超纯水技术专长，享有收入倍数溢价。然而，成熟上市同业能提供经审计的 GAAP 毛利率、可预测的经常性服务收入和 透明资产负债表。相比之下，Gradiant 的运营扩张——截至 2026 年 8
              月美国员工数激增 55%、在 Phoenix、Syracuse 和 Philadelphia 新设办公室，以及公开提出达到 $1.0 billion
              国内订单储备的目标——仍未获独立财务文件验证。管理层已公开表示， 公司没有固定 IPO 时间表，并保留私募融资的灵活性。因此，机构投资判断必须在投资前完成严格尽调，重点取得经审计财务报表、
              检查盈利质量报告、核实订单储备转化率，并审阅涉及高管法律审查的正式董事会治理记录。
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: 建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              综合 Gradiant 的差异化技术能力、公司信息不透明度和地缘政治逆风，建议维持跟踪，风险评级为高，估值判断偏高， 分析置信度为中等。Gradiant 在复杂废水回收和超纯水生产上的技术护城河，使其受益于 AI
              的长期建设周期；但在没有经审计 利润率证明的情况下，接近 $2.0 billion Series E 估值入场的私人投资人仍面临显著下行风险。决策框架要求，在 Gradiant 正式提交
              S-1，或披露经审计的多年毛利率、现金消耗情况和客户集中度指标前，投资人暂缓直接投入资本。要从跟踪转为买入，必须有经审计
              的持续运营盈利证明、中东项目恢复的证据，以及高管治理悬置问题的正式解决。反过来，若合同持续取消或高管层发生更替导致论点失效， 则应直接采取回避立场。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 尽调结论：在获得经审计的透明度前维持跟踪
            body: >-
              Gradiant 在半导体和超大规模云厂商水务基础设施领域展现出不可否认的商业势头，但 2026 年 5 月确立的 $2.0 billion
              估值基准，在缺少经审计的单项目利润率、现金消耗披露及区域合同暂停解决方案的情况下，安全边际不足。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV013
          - type: callout
            title: 关键治理与地域脆弱性
            body: 投资人必须同时关注源于妓院调查听证会的高管法律审查，以及中东收入下滑 20% 的情况；两者共同威胁投资判断信心和 IPO 时间表。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
