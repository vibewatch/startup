      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              AI 基础设施、半导体本地化、更高的冷却需求、水资源短缺和更严格的排放要求，是最清晰的需求驱动因素。公司发布的预测描述了 2025 至 2035 年数据中心容量增长六倍，以及 100MW
              园区巨大的用水需求，但这些预测仍需独立验证。约束同样重要：许可、水源可得性、客户认证、项目融资、地缘政治暂停以及多工程学科整合，都可能延迟订单向确认收入的转化。独立报道称，中东紧张局势使 Gradiant
              区域收入下降约 20%；监管不确定性也仍是 PFAS 销毁技术的障碍。因此，溢价估值与其说取决于笼统的水务市场 CAGR，不如说取决于订单储备质量、重复业务、利润转化，以及一体化交付能否降低客户现场的进度风险。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM015
              - CM016
