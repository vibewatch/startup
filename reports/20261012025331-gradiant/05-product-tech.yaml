chapter:
  number: 5
  title: Product & Technology
  summary: Gradiant delivers a comprehensive industrial water and wastewater platform spanning ultrapure water generation, brine concentration, and zero liquid discharge for advanced semiconductor fabrication and hyperscale AI data centers. Its core technological differentiation rests on 288 approved and pending patents, featuring proprietary Counter-Flow Reverse Osmosis (CFRO) that achieves high brine concentration (up to 260,000 mg/L TDS) at moderate operating pressures, on-site ForeverGone electrochemical PFAS destruction, and SmartOps AI plant automation. While commercial traction is evidenced by $300 million in semiconductor water contracts and deployments with global hyperscalers, ongoing technical diligence must monitor long-term electrochemical electrode degradation, high capital intensity, and the absence of independent public software benchmarks.
sections:
  - id: product-definition-and-operating-model
    title: Product Definition and Full-Lifecycle Industrial Water Platform
    body: |-
      Gradiant positions itself as an integrated industrial water and wastewater treatment infrastructure provider, solving what it terms the water layer of the modern AI economy. Rather than functioning as a component equipment supplier or standalone software vendor, Gradiant designs, builds, and operates complete, end-to-end water management facilities across mission-critical manufacturing sectors. In customer workflow terms, Gradiant addresses the acute operational bottleneck where advanced industrial facilities—most notably semiconductor fabrication plants and hyperscale artificial intelligence data centers—cannot expand without guaranteed supplies of ultra-high-purity process water and compliant wastewater discharge systems.

      The company's delivery model spans the full industrial water cycle through three operating imperatives: Reduce, Reclaim, and Renew. First, the platform reduces raw freshwater intake by treating and drawing from degraded municipal reuse or impaired industrial supplies. Second, it reclaims valuable resources—including industrial solvents like isopropanol, heavy metals, and concentrated salts—from complex wastewater streams. Third, it renews industrial wastewater back into high-purity process water, enabling on-site recycling loops that exceed 90 percent recovery in advanced fabrication environments. To operationalize this lifecycle, Gradiant deploys modular physical hardware integrated with proprietary specialty chemistry and automated predictive monitoring, eliminating fragmented multi-vendor handoffs.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE014
    figureRefs:
      - FE001
  - id: product-portfolio-and-asset-matrix
    title: Core Technology Portfolio and Modular Solution Map
    body: |-
      Gradiant's commercial solution architecture is organized into four primary product lines and application suites tailored to distinct industrial operating regimes. For high-purity water generation and brine concentration, the company markets the RO Infinity platform alongside its patented Counter-Flow Reverse Osmosis (CFRO) technology. In contrast to traditional high-pressure reverse osmosis systems that face severe osmotic pressure barriers or thermal crystallizers that require immense energy inputs, CFRO uses counter-current membrane stages to concentrate industrial brine up to 260,000 mg/L total dissolved solids while operating at pressures at or below 69 bar.

      For persistent chemical contamination, Gradiant commercialized ForeverGone, an integrated on-site treatment system engineered specifically for per- and polyfluoroalkyl substances (PFAS). Where conventional granular activated carbon or ion-exchange resins merely concentrate and transfer PFAS to a solid medium that requires off-site hazardous incineration or landfilling, ForeverGone concentrates the fluorinated molecules via micro-foam fractionation and destroys them electrochemically into carbon dioxide and water. For AI data center campuses, Gradiant packages its cooling technologies into HyperSolved, a turnkey platform that integrates containerized and permanent water infrastructure, proprietary CURE treatment chemicals, and automated facility control to insulate hyperscale computing operators from local water municipal constraints.
    claimRefs:
      - CE003
      - CE005
      - CE008
      - CE010
    tableRefs:
      - TE001
  - id: workflow-integration-and-use-cases
    title: Mission-Critical Workflows Across Semiconductors and Hyperscale Data Centers
    body: |-
      The practical implementation of Gradiant's technology resolves specific failure modes within high-throughput industrial customer workflows. In semiconductor microelectronics manufacturing, fabrication facilities require millions of gallons daily of ultrapure water (UPW) while simultaneously generating highly toxic, complex chemical effluents such as hydrofluoric-acid wastewater. Standard industrial practice typically divides these responsibilities among separate original equipment manufacturers, resulting in coordination friction, uncoordinated discharge chemistry, and heavy reliance on hazardous waste disposal contractors. Gradiant replaces this fragmented workflow by installing unified treatment trains that combine selective chemical extraction, specialized membrane recovery, and local scrubber reclaim systems. In major fab deployments, this scrubber reclaim architecture recovers more than 80 percent of feed volume, directly relieving intake pressure on regional watersheds.

      Similarly, in artificial intelligence data center operations, cooling represents an urgent scaling limitation. A standard 100-megawatt hyperscale data center facility can consume cooling water volumes equivalent to a city of 80,000 residents every day. Under tightening municipal water restrictions in drought-prone regions such as the American Southwest, operators face prolonged permitting delays and community opposition. HyperSolved intervenes at the site intake and cooling loop interface, allowing data center operators to ingest lower-grade municipal effluent, stabilize cooling tower cycles of concentration with CURE specialty chemistry, and treat blowdown streams on-site to achieve minimum or zero liquid discharge.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
    tableRefs:
      - TE002
  - id: subsystem-architecture-and-operating-risks
    title: Subsystem Architecture, Technical Dependencies, and Operating Failure Modes
    body: |-
      Deconstructing Gradiant's operating architecture reveals a multi-tiered engineering system characterized by tightly coupled physical, chemical, and computational dependencies. At the plant intake and feed conditioning layer, Selective Chemical Extraction (SCE) and Fluidized Bed Crystallization (FBC) remove hardness cations, silica, and heavy metals. This conditioning is vital because downstream membrane modules are exceptionally vulnerable to mineral scaling and irreversible surface fouling. The concentration layer relies on specialized semi-permeable membrane elements arranged in counter-flow configurations, which demand precise pressure regulation and high-durability polymer housings capable of withstanding aggressive industrial cleaning regimes.

      At the digital supervisory layer, Gradiant deploys SmartOps AI to continuously optimize system setpoints. Operating through IoT telemetry and facility SCADA interfaces, SmartOps AI predicts membrane fouling tendencies, schedules proactive backwashing, and calculates optimal coagulant and anti-scalant dosing rates. However, this integrated architecture introduces distinct technical dependencies and operating failure modes. The primary vulnerability lies in feed variability: sudden surges in upstream chemical concentration or unmodeled co-contaminants can overwhelm pre-treatment chemistry, causing catastrophic membrane scaling or degrading electrochemical destruction anodes. Furthermore, reliance on algorithmic setpoint control creates an operational dependency on continuous sensor calibration and network integrity, where sensor drift can lead to sub-optimal chemical dosing.
    claimRefs:
      - CE004
      - CE009
      - CE010
      - CE012
    tableRefs:
      - TE003
  - id: intellectual-property-and-diligence-evaluation
    title: Intellectual Property Moat, Technical Differentiation, and Key Diligence Blockers
    body: |-
      Gradiant's technical defensibility is anchored in an extensive proprietary portfolio of 288 approved and pending patents, establishing significant intellectual property moats across counter-flow membrane mechanics, electrochemical destruction catalysts, and carrier gas extraction thermodynamics. The technological foundation originated in research conducted at the Massachusetts Institute of Technology, providing deep thermodynamic differentiation over legacy water treatment conglomerates whose portfolios primarily consist of commoditized standard reverse osmosis and thermal evaporation hardware. Furthermore, Gradiant's acquisition and integration of specialized engineering firms, notably European industrial water veteran H+E and Taiwan-based WaterPark, has augmented its internal R&D with regional fabrication capabilities and localized process engineering expertise.

      Nevertheless, underwriting Gradiant's technology requires rigorous scrutiny of several unresolved diligence items. While the company reports massive global operating metrics—including 6.5 billion liters of daily freshwater withdrawals reduced and over 3,000 treatment installations across 92 countries—independent empirical verification of plant-level uptime, membrane service lifespans, and lifecycle replacement costs remains inaccessible in public disclosures. Specifically, regarding ForeverGone, independent longitudinal datasets documenting anode lifespan, power consumption per kilogram of destroyed PFAS, and destruction byproduct verification under complex industrial waste streams are not publicly available. Investors must also evaluate geopolitical and executive stability following past leadership inquiries, as well as the technical execution capacity of Gradiant's expanding Global Engineering Center in Coimbatore, India, which is scaling from 100 to over 200 engineers to support global project backlogs.
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE013
