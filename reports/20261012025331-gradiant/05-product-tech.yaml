figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-tier architectural stack illustrating Gradiant's integrated industrial water platform from plant automation down to thermal crystallizer discharge.
    data:
      layers:
        - label: Intelligent Supervision & Control Layer
          detail: SmartOps AI cloud and edge platform providing real-time facility monitoring, predictive setpoint optimization, automated chemical dosing, and preventive maintenance telemetry.
        - label: Specialty Chemistry Layer
          detail: CURE Chemicals portfolio engineered to reduce traditional reagent volumes, prevent membrane biofouling, and stabilize cooling water loops in AI data centers.
        - label: Targeted Contaminant Destruction Layer
          detail: ForeverGone micro-foam fractionation and electro-oxidation destruction engine, alongside FRO and AquaCritox wet oxidation for permanent on-site PFAS and complex organics destruction.
        - label: Advanced Membrane & Concentration Layer
          detail: RO Infinity and patented Counter-Flow Reverse Osmosis (CFRO) concentrating brines up to 260,000 mg/L TDS at <=69 bar, combined with local scrubber reclaim systems.
        - label: Biological & Selective Pre-Treatment Layer
          detail: Bio-Infinity biological treatment (UASB, AFB, MBBR, ultrasound) and Selective Chemical Extraction (SCE with FBC) targeting heavy metals, fluorides, and silica.
        - label: Thermal Concentration & Zero Liquid Discharge Layer
          detail: Carrier Gas Extraction (CGE) and mechanical vapor recompression systems recovering up to 99% of wastewater volume and producing dry solid cakes for ultimate disposal.
    approximationNotes: Layer decomposition depicts the end-to-end technical hierarchy of Gradiant's modular treatment trains across semiconductor and data center deployments.
