  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Process
      - Core Component / Mechanism
      - Functional Role in Operating Stack
      - Critical Supply & Upstream Dependency
      - Primary Technical Risk
    rows:
      - - Feed Conditioning & Pre-Treatment
        - Selective Chemical Extraction (SCE) with Fluidized Bed Crystallization (FBC)
        - Removes hardness, heavy metals, and fluorides prior to membrane stages
        - Custom chemical formulations and reagent supply chain
        - Scaling and fouling if upstream chemical dosing drifts or raw feed fluctuates
      - - High-Recovery Concentration
        - Counter-Flow Reverse Osmosis (CFRO) membrane stacks
        - Concentrates high-salinity brine up to 260,000 mg/L TDS at <=69 bar
        - Specialized membrane elements and high-pressure vessel fabrication
        - Membrane mechanical integrity and degradation under aggressive cleaning regimes
      - - Targeted Contaminant Destruction
        - Electro-oxidation Destruction Engine & Advanced Oxidation (FRO/AquaCritox)
        - Destroys persistent organics and refractory PFAS into mineralized byproducts
        - Proprietary catalytic electrode materials and high-current electrical power
        - Electrode passivation and anode lifespan degradation over multi-year duty cycles
      - - Autonomic Plant Control
        - SmartOps AI predictive control and dynamic optimization algorithms
        - Continuously adjusts pumping, dosing, and recovery setpoints across facility
        - Sensor telemetry network, edge gateway compute, and facility SCADA connectivity
        - Algorithm drift under novel unmodeled influent feed anomalies or network disruption
    notes: Architecture mapping decomposes Gradiant full-stack platform into functional subsystems; technical risks reflect engineering constraints identified from process specifications.
