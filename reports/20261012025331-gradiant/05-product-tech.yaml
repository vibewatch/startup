  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Application
      - Conventional Treatment Workflow
      - Gradiant Solution Architecture
      - Measurable Operational Benefit
      - Key Technical Limitation
    rows:
      - - Semiconductor UPW Production & Reclaim
        - 'Multi-vendor train: conventional RO, ion exchange, and off-site hauling of toxic streams'
        - Integrated RO Infinity, CFRO brine concentration, and selective chemical extraction (SCE)
        - Achieves >80% scrubber reclaim recovery and enables >90% fab-wide water recycling
        - High capex and stringent feed pre-treatment requirements for abrasive slurries
      - - PFAS Elimination in Fab Wastewater
        - Adsorption (GAC/IX resin) with off-site incineration or hazardous landfilling
        - ForeverGone micro-foam fractionation combined with on-site electro-oxidation destruction engine
        - Permanently mineralizes PFAS into CO2 and water, eliminating off-site liability and EPA compliance risks
        - Power consumption per kilogram of destroyed contaminant under low-concentration influent
      - - AI Data Center Cooling & Wastewater Management
        - Disjointed potable water evaporative cooling with unmitigated blowdown discharge
        - HyperSolved containerized and permanent infrastructure integrating municipal reuse and ZLD
        - Eliminates freshwater dependency (saving up to millions of liters daily) and manages blowdown concentration
        - Requires complex integration with diverse municipal effluent quality and local discharge permits
      - - Zero Liquid Discharge (ZLD) Brine Concentration
        - Energy-intensive thermal evaporators and crystallizers prone to scaling and high opex
        - CFRO membrane concentration delivering up to 260,000 mg/L TDS at pressures <=69 bar
        - Recovers up to 99% of liquid discharge with lower energy consumption than pure thermal systems
        - Ultimate solid salt disposal remains necessary for residual crystallizer cake
    notes: Workflow comparisons contrast standard industry practices against Gradiant technical documentation and SEMI specifications; recovery rates are company-reported design targets.
