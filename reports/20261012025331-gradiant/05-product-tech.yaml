    - type: missing-source
      severity: material
      topic: pfas-benchmarks
      missingEvidence: Independent third-party verification and longitudinal operating logs of PFAS destruction efficiency and byproduct composition for ForeverGone under industrial semiconductor wastewater matrices.
      whyItMatters: While Gradiant reports complete mineralization to CO2 and water with lab validation, real-world fab effluents contain variable co-contaminants that may affect electrochemical cell life and destruction kinetics.
      diligencePath: Request customer field pilot reports, electrode replacement schedules, and independent analytical reports measuring effluent PFAS down to sub-part-per-trillion levels under high-TDS semiconductor conditions.
      relatedQuestionRefs:
        - QE009
    - type: missing-source
      severity: minor
      topic: developer-telemetry
      missingEvidence: Public software developer telemetry, open-source repositories, or developer API documentation for SmartOps AI.
      whyItMatters: Gradiant operates as an industrial water infrastructure and facility engineering provider rather than a developer-facing software platform, so direct developer metrics like GitHub stars, package downloads, or public APIs are absent.
      diligencePath: Review industrial automation control architecture, SCADA integration documentation, and proprietary machine-learning algorithm specifications under technical diligence.
