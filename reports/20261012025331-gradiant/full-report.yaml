        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Membrane and Electrochemical IP Moat
            body: >-
              Gradiant maintains an intellectual property estate of over 288 approved and pending patents, led by its
              MIT-originated Counter-Flow Reverse Osmosis (CFRO) technology that concentrates high-salinity brines up to
              260,000 mg/L TDS at moderate operating pressures (<=69 bar), achieving substantial operational efficiency
              advantages over conventional thermal brine concentration.
            calloutType: strength
            claimRefs:
              - CE004
