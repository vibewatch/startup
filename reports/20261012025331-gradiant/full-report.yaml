      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically the owner or developer of a water-intensive industrial asset, with budget
              responsibility split across facilities, utilities, process engineering, operations, sustainability, and
              capital-project teams. Plant operators and process engineers are the daily users, while finance and
              executive sponsors fund capacity, reliability, and compliance. Adoption is triggered when water
              availability, discharge limits, production expansion, or fragmented accountability threatens a project's
              schedule or output. Repeat semiconductor awards and reuse performance above 80% on one scrubber-reclaim
              design indicate that proven delivery can expand scope within an existing account. The sales path remains
              project-led and technically intensive, implying long qualification and execution cycles rather than a
              frictionless software-style expansion motion.
