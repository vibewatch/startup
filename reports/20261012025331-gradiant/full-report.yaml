      - number: '1.3'
        title: Capitalization, Investor Syndicate, and Valuation History
        blocks:
          - type: paragraph
            body: >-
              On May 18, 2026, Gradiant finalized its Series E financing round, securing a post-money valuation of $2.0
              billion and doubling its equity capitalization benchmark from its prior $1.0 billion unicorn valuation
              achieved in May 2023. The round was co-led by Boston-based technology venture firm Safar Partners and
              Australia's Hostplus Superannuation Fund, with participation from industrial software investor ClearVision
              Ventures alongside additional international institutions. Investor interest has been propelled by surging
              structural demand for industrial wastewater treatment and closed-loop recycling across semiconductor
              foundries, data centers, and advanced manufacturing campuses. However, while institutional backers
              emphasize Gradiant's technological differentiation and stated operational profitability, the company has
              not disclosed the specific primary capital dollar amount raised in Series E, the presence of secondary
              share liquidations, or liquidation preference structures, leaving detailed balance sheet capitalization
              metrics unverified in public disclosures.
