  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the design, construction, operation, optimization, and chemical support of
              industrial water and wastewater systems, from intake and ultrapure-water production through reuse,
              resource recovery, and discharge. This boundary includes mission-critical infrastructure for chips, data
              centers, power, food and beverage, pharmaceuticals, mining, and advanced manufacturing; it excludes
              municipal networks unrelated to industrial sites and general-purpose digital infrastructure. The status
              quo is not only another water vendor: it is a fragmented combination of internal engineering teams,
              engineering-procurement-construction firms, equipment specialists, chemical suppliers, and separate
              operations contractors. Gradiant's proposition is to replace that multi-vendor coordination burden with
              one accountable water layer, so its addressable spend is narrower than the whole water economy but broader
              than any single treatment technology.
