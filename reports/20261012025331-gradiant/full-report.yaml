chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Founded at the Massachusetts Institute of Technology and headquartered in Boston, Massachusetts, Gradiant
              has established itself as an advanced water and wastewater infrastructure company serving mission-critical
              global industries. As artificial intelligence computing campuses and semiconductor fabrication facilities
              expand rapidly, water availability, purification quality, and wastewater disposal limits have emerged as
              binding physical bottlenecks. Gradiant addresses these industrial constraints by positioning itself as the
              dedicated water infrastructure layer of the AI economy. Rather than functioning as a component equipment
              vendor, the company designs, builds, and operates complete, vertically integrated water systems spanning
              freshwater intake, ultrapure water production, high-recovery wastewater recycling, and resource
              reclamation. In May 2026, Gradiant deployed HyperSolved, its dedicated cooling water infrastructure
              solution for AI data centers, across multiple global hyperscale operators to eliminate cooling-water
              constraints through integrated treatment, chemical formulations, and proprietary AI-driven operational
              controls.
            claimRefs:
              - CO001
              - CO002
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO011
              - CO014
      - number: '1.2'
        title: Executive Leadership and Governance Reorganization
        blocks:
          - type: paragraph
            body: >-
              Gradiant's technological and commercial trajectory has been steered since inception by co-founders Anurag
              Bajpayee and Prakash Govindan, both MIT engineering doctoral graduates who translated proprietary
              thermodynamic separation research into commercial water treatment applications. In conjunction with the
              company's May 2026 Series E financing round, Gradiant formalized a significant executive governance
              reorganization. Anurag Bajpayee transitioned from Chief Executive Officer into the role of Executive
              Chairman, focusing on strategic global expansion and capital formation, while co-founder Prakash Govindan
              assumed the post of Chief Executive Officer to direct operational execution and hyperscale enterprise
              deployments. This executive transition followed broader reputational scrutiny in April 2025, when Bajpayee
              was linked to high-profile Cambridge Brothel Hearings, prompting public affirmations of institutional
              confidence from the company. To accelerate commercial scale across North America, Gradiant recruited Dr.
              Nish Vora, a thirty-year water sector veteran from Veolia, Suez, and GE Water, as Managing Director for
              the Americas.
