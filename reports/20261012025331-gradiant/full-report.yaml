  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Full-Lifecycle Industrial Water Platform
        blocks:
          - type: paragraph
            body: >-
              Gradiant positions itself as an integrated industrial water and wastewater treatment infrastructure
              provider, solving what it terms the water layer of the modern AI economy. Rather than functioning as a
              component equipment supplier or standalone software vendor, Gradiant designs, builds, and operates
              complete, end-to-end water management facilities across mission-critical manufacturing sectors. In
              customer workflow terms, Gradiant addresses the acute operational bottleneck where advanced industrial
              facilities—most notably semiconductor fabrication plants and hyperscale artificial intelligence data
              centers—cannot expand without guaranteed supplies of ultra-high-purity process water and compliant
              wastewater discharge systems.


              The company's delivery model spans the full industrial water cycle through three operating imperatives:
              Reduce, Reclaim, and Renew. First, the platform reduces raw freshwater intake by treating and drawing from
              degraded municipal reuse or impaired industrial supplies. Second, it reclaims valuable resources—including
              industrial solvents like isopropanol, heavy metals, and concentrated salts—from complex wastewater
              streams. Third, it renews industrial wastewater back into high-purity process water, enabling on-site
              recycling loops that exceed 90 percent recovery in advanced fabrication environments. To operationalize
              this lifecycle, Gradiant deploys modular physical hardware integrated with proprietary specialty chemistry
              and automated predictive monitoring, eliminating fragmented multi-vendor handoffs.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.2'
        title: Core Technology Portfolio and Modular Solution Map
        blocks:
          - type: paragraph
            body: >-
              Gradiant's commercial solution architecture is organized into four primary product lines and application
              suites tailored to distinct industrial operating regimes. For high-purity water generation and brine
              concentration, the company markets the RO Infinity platform alongside its patented Counter-Flow Reverse
              Osmosis (CFRO) technology. In contrast to traditional high-pressure reverse osmosis systems that face
              severe osmotic pressure barriers or thermal crystallizers that require immense energy inputs, CFRO uses
              counter-current membrane stages to concentrate industrial brine up to 260,000 mg/L total dissolved solids
              while operating at pressures at or below 69 bar.


              For persistent chemical contamination, Gradiant commercialized ForeverGone, an integrated on-site
              treatment system engineered specifically for per- and polyfluoroalkyl substances (PFAS). Where
              conventional granular activated carbon or ion-exchange resins merely concentrate and transfer PFAS to a
              solid medium that requires off-site hazardous incineration or landfilling, ForeverGone concentrates the
              fluorinated molecules via micro-foam fractionation and destroys them electrochemically into carbon dioxide
              and water. For AI data center campuses, Gradiant packages its cooling technologies into HyperSolved, a
              turnkey platform that integrates containerized and permanent water infrastructure, proprietary CURE
              treatment chemicals, and automated facility control to insulate hyperscale computing operators from local
              water municipal constraints.
