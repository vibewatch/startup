        - Specialized membrane elements and high-pressure vessel fabrication
        - Membrane mechanical integrity and degradation under aggressive cleaning regimes
      - - Targeted Contaminant Destruction
        - Electro-oxidation Destruction Engine & Advanced Oxidation (FRO/AquaCritox)
        - Destroys persistent organics and refractory PFAS into mineralized byproducts
        - Proprietary catalytic electrode materials and high-current electrical power
        - Electrode passivation and anode lifespan degradation over multi-year duty cycles
      - - Autonomic Plant Control
        - SmartOps AI predictive control and dynamic optimization algorithms
        - Continuously adjusts pumping, dosing, and recovery setpoints across facility
        - Sensor telemetry network, edge gateway compute, and facility SCADA connectivity
        - Algorithm drift under novel unmodeled influent feed anomalies or network disruption
    notes: >-
