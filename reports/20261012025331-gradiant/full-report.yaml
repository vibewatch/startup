      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              AI infrastructure, semiconductor localization, higher cooling demand, water scarcity, and stricter
              discharge requirements are the clearest demand drivers. Company-issued projections describe six-fold
              data-center capacity growth from 2025 to 2035 and very large water needs for a 100MW campus, but those
              forecasts require independent validation. Constraints are equally important: permitting, water-source
              availability, customer qualification, project financing, geopolitical pauses, and integration across
              multiple engineering disciplines can delay conversion from order to recognized revenue. Independent
              reporting says Middle East tensions reduced Gradiant's regional revenue by about 20%, while regulatory
              uncertainty remains a barrier for PFAS-destruction technologies. A premium valuation therefore depends
              less on a generic water-market CAGR than on backlog quality, repeat business, margin conversion, and
              whether integrated delivery reduces schedule risk at customer sites.
