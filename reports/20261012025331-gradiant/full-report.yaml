  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological progression of Gradiant from MIT spinout to $2.0B industrial water infrastructure leader.
    data:
      items:
        - label: '2013: MIT Spinout Founded'
          detail: Anurag Bajpayee and Prakash Govindan co-found Gradiant in Boston based on MIT water treatment research.
          tone: neutral
        - label: 'May 2023: Unicorn Valuation ($1B)'
          detail: Gradiant achieves $1.0B unicorn valuation following a $225M Series D investment round.
          tone: positive
        - label: 'Oct 2023: European Footprint Expansion'
          detail: >-
            Completed acquisition of a 51% majority stake in Germany's H+E Group (Hager+Elsässer) to scale industrial
            water solutions.
          tone: positive
        - label: 'H1 2024: Commercial Acceleration'
          detail: >-
            Reported over $500M in new orders in the first half of 2024, expanding into microelectronics and energy
            sectors.
          tone: positive
        - label: 'Apr 2025: Cambridge Brothel Investigation'
          detail: >-
            Founder/CEO Anurag Bajpayee linked to Cambridge brothel hearings; board and company publicly affirmed
            confidence in judicial process.
          tone: adverse
        - label: 'May 12, 2026: HyperSolved Launch'
          detail: Unveiled and deployed HyperSolved, a turnkey cooling water platform for hyperscale AI data centers.
          tone: positive
        - label: 'May 18, 2026: $2B Series E Financing'
          detail: >-
            Closed Series E funding at $2.0B valuation led by Safar Partners and Hostplus; established new Executive
            Chairman and CEO structure.
          tone: positive
        - label: 'Aug 2026: US Geographic Expansion'
          detail: >-
            Appointed Dr. Nish Vora as Americas MD, opened offices in Phoenix, Syracuse, and Philadelphia, and launched
            Houston Innovation Centre.
          tone: positive
        - label: 'Oct 2026: Global Delivery & GEC Scale'
          detail: >-
            Reported $500M-$750M revenue run-rate with 10% India share, doubling Coimbatore engineering workforce to
            200+ amidst Middle East drag.
          tone: neutral
