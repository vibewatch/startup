      - number: '6.3'
        title: Durability and Expansion Signals
        blocks:
          - type: paragraph
            body: >-
              Repeat awards are the best available durability proxy, but they are not retention metrics. The disclosed
              second phase and multi-country reuse of a scrubber-reclaim design suggest account expansion after an
              initial engagement, while HyperSolved's sourcing-to-discharge scope and lifecycle support create multiple
