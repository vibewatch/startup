    rows:
      - - Feed Conditioning & Pre-Treatment
        - Selective Chemical Extraction (SCE) with Fluidized Bed Crystallization (FBC)
        - Removes hardness, heavy metals, and fluorides prior to membrane stages
        - Custom chemical formulations and reagent supply chain
