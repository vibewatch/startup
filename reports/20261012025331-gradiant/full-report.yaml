        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Call: Maintain Track Stance Pending Audited Visibility'
            body: >-
              While Gradiant demonstrates undeniable commercial momentum in semiconductor and hyperscaler water
              infrastructure, the $2.0 billion valuation benchmark established in May 2026 leaves insufficient safety
              margin without audited unit margins, cash burn disclosure, and resolution of regional contract pauses.
