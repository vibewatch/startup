  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Industrial Water Competitive Landscape and Provider Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for industrial water treatment spans three distinct provider categories
              alongside two status-quo customer alternatives. Traditional global water conglomerates such as Veolia
              Water Technologies and Ecolab command massive global scale and deep corporate relationships, yet
              historically approach complex industrial projects through fragmented sub-system packages or recurring
              chemical consumables contracts rather than end-to-end turnkey facility operations. Conversely, specialized
              equipment OEMs such as Aquatech International and Ovivo manufacture high-performance components for
              membrane filtration, ion exchange, or thermal evaporation, but typically sell discrete equipment packages
              that require the customer or an engineering procurement contractor (EPC) to integrate and operate.
              Gradiant positions itself as an integrated full-lifecycle provider, designing, building, and operating
              complete water and wastewater facilities under single-point accountability. Commercial traction across
              major US semiconductor fabrication sites illustrates this model, where Gradiant captured $300 million in
              new contracts since early 2026 by delivering end-to-end solutions spanning ultrapure water to zero liquid
              discharge.
            claimRefs:
              - CP001
              - CP003
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP011
              - CP014
      - number: '3.2'
        title: Capability Matrix and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Diligence across mission-critical industries reveals stark differences in how competing architectures
              handle extreme wastewater chemistry and regulatory discharge constraints. Semiconductor fabrication
              facilities demand both ppb-level ultrapure water (UPW) intake and high-recovery treatment of aggressive
              effluent streams, including hydrofluoric-acid and chemical scrubber wastewater. While component OEMs
              supply standalone reverse osmosis units or crystallizers, Gradiant integrates proprietary Carrier Gas
              Extraction (CGE) and reverse osmosis technologies to achieve over 80% feed volume recovery on complex
              streams. Similarly, in hyperscale AI datacenters, Gradiant HyperSolved platform combines physical water
              treatment hardware with proprietary CURE specialty chemicals and closed-loop SmartOps AI digital control.
              This end-to-end design enables turnkey hyperscale campus delivery engineered for zero discharge to surface
              water in severely water-constrained basins such as West Texas, eliminating the coordination overhead and
              operating friction inherent in multi-vendor legacy architectures.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
      - number: '3.3'
        title: Commercial Packaging, Delivery Models, and Customer Lock-In
        blocks:
          - type: paragraph
            body: >-
              Customer procurement in advanced industrial water exhibits substantial inertia and high switching costs
              once an operational architecture is commissioned. Traditional equipment sales shift operating risk,
              chemical procurement, and membrane replacement onto plant operators, whereas Gradiant emphasizes long-term
              turnkey operations and Build-Own-Operate-Transfer (BOOT) service structures. These multi-year service
              models generate recurring revenue while insulating industrial customers from facility downtime risks.
              Gradiant commercial strategy deliberately targets the top five to ten enterprise accounts across
              semiconductor, datacenter, and industrial verticals rather than pursuing fragmented small-scale
              deployments. Once integrated into a semiconductor fab or hyperscale campus, multi-facility replication
              becomes a powerful adoption flywheel: customers that validated Gradiant scrubber reclaim systems in
              international fabrication plants in Singapore and Taiwan subsequently awarded repeat contracts for
              expansion phases across domestic facilities in New York, Virginia, Idaho, and Utah, creating durable
              account lock-in.
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP010
      - number: '3.4'
        title: Substitutes, Incumbent Response, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Assessing moat durability requires examining whether alternative cooling technologies or incumbent
              responses could displace Gradiant market position. In data centers, the rapid adoption of direct-to-chip
              liquid cooling recirculates fluids within closed computer room loops, leading some observers to predict
              declining facility water demand. However, independent engineering reviews confirm that eliminating
              evaporative cooling at the data hall does not eliminate campus-scale water requirements: incoming water
              purification, heat rejection loops, cooling tower blowdown management, and zero surface discharge
              wastewater treatment remain critical site constraints. Gradiant moat is anchored by its execution track
              record of over 3,000 plants globally, high-purity process patents, and operational scale reaching $500
              million to $750 million in revenue. Nevertheless, meaningful vulnerabilities persist: legacy conglomerates
              like Veolia possess superior balance-sheet capacity to finance multi-hundred-million-dollar projects,
              while regional geopolitical tensions recently triggered a 20% revenue contraction in Gradiant Middle East
              operations, underscoring geographic execution dependencies.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
              - CP014
