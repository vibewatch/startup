      - number: '7.2'
        title: Regulatory Compliance, Environmental Mandates, and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Gradiant operates at the nexus of stringent environmental, municipal, and industrial regulations governing
              hazardous chemical treatment, toxic effluent discharge, and local water extraction [CR003, CR006]. In
              advanced semiconductor manufacturing, fabrication facilities generate highly hazardous wastewater streams
              containing hydrofluoric acid, complex chemical solvents, heavy metals, and persistent fluorinated
              compounds [CR002, CR003, CR012]. Gradiant's contracts across five US semiconductor sites mandate the
              delivery of full-portfolio systems, including hydrofluoric-acid wastewater treatment and zero liquid
              discharge (ZLD) plants designed to eliminate liquid effluent entirely [CR002, CR003]. Any process failure
              or regulatory non-compliance in treating these complex streams risks severe environmental enforcement
              penalties, municipal sewer discharge revocations, and immediate operational shutdowns by state and federal
              environmental protection agencies [CR003, CR006]. In parallel, local municipal water resource constraints
              and permitting complexities increasingly restrict where hyperscale AI data centers and semiconductor fabs
              can be sited, as a single 100MW campus requires water equivalent to a city of 80,000 people daily [CR006,
              CR007]. On corporate governance and legal fronts, historical brothel hearings in Cambridge, Massachusetts
              in 2025 named co-founder Anurag Bajpayee, creating potential key-person reputational overhang that
              institutional underwriting teams and ESG committees must evaluate [CR012, CR013].
            claimRefs:
