            body: >-
              Gradiant is pursuing a concentrated enterprise strategy rather than a high-volume customer model: an
              October 2026 Outlook Business interview quoted management targeting the top five to ten customers in each
              industry. The clearest disclosed segments are semiconductor fabs and hyperscale data centers, with
              additional company positioning across power and other applied industries. India adds semiconductor,
              printed-circuit-board, and solar customers; management said the country represented about 10% of revenue.
              Buyers are therefore likely facility owners and infrastructure operators, while day-to-day users are
