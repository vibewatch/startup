  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Architecture and Investment Thesis Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Gradiant as the specialized water and wastewater infrastructure provider for semiconductor
              fabrication and hyperscale artificial intelligence data centers reveals significant operational, market,
              and strategic risks [CR001]. While the company has secured substantial commercial awards totaling $300
              million in semiconductor contracts since the beginning of 2026 across major US fabrication sites in New
              York, Virginia, Idaho, and Utah [CR002], its expansion targets require managing extraordinary technical
              precision and project execution risks [CR003]. Water infrastructure in semiconductor fabs and AI data
              centers represents a single point of failure where equipment outages, chemical imbalance, or treatment
              capacity bottlenecks directly halt multi-billion-dollar manufacturing lines or computing clusters [CR003,
              CR007]. Consequently, Gradiant's operating model transitions from standard industrial water technology to
              mission-critical infrastructure delivery where failure scenarios carry catastrophic liability and contract
              termination risks [CR003, CR011]. Furthermore, Gradiant's aggressive corporate goal of nearly doubling
              revenues to $1 billion within two to three years places severe operational strain on its global
              engineering and project delivery organization [CR004, CR005]. As management concentrates capital and
              engineering resources on serving the top five to ten customers across essential industries, customer
              concentration and dependency on hyperscale capital expenditure cycles become primary downside
              vulnerabilities [CR005, CR011].
