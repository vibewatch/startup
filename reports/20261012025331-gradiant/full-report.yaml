        title: Operational Scale, Commercial Momentum, and Chronology
        blocks:
          - type: paragraph
            body: >-
              Gradiant operates at substantial global industrial scale, self-reporting annual revenue run-rate between
              $500 million and $750 million as of late 2026, with an executive objective to reach $1.0 billion within
              two to three years. In the United States, commercial momentum is anchored by long-term operations and
              maintenance agreements, including a high-profile contract to operate ultrapure water systems for a major
              domestic semiconductor manufacturer, driving a projected $1.0 billion US order book target for the coming
              year. To support this North American expansion, the firm established regional offices in Phoenix,
              Syracuse, and Philadelphia, alongside launching its Houston Global Innovation Centre. Globally, Gradiant
              is expanding its Global Engineering Center in Coimbatore, India, doubling technical engineering headcount
              from 100 to over 200 professionals. Nevertheless, global operational expansion faces regional frictions:
