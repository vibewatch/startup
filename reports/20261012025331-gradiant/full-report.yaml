            body: >-
              Gradiant faces notable geopolitical headwinds and regional revenue fluctuations that demonstrate
              counterparty and geographic vulnerabilities [CR004, CR009]. Chief Operating Officer Govind Alagappan
              explicitly disclosed that Gradiant's Middle East revenues suffered a contraction of approximately 20% due
