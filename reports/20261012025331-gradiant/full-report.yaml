  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Gradiant's investment thesis centers on its strategic positioning as the essential water infrastructure
              layer powering artificial intelligence hardware fabrication and hyperscale data center operations.
              Advanced semiconductor fabs and high-density compute facilities require millions of gallons of ultrapure
              water daily, creating acute municipal and regulatory bottlenecks. Gradiant addresses these critical
              constraints through vertically integrated design, chemical treatment, and zero liquid discharge systems,
              demonstrated by $300 million in new semiconductor contracts secured across New York, Virginia, Idaho, and
              Utah since early 2026, alongside deployments of its HyperSolved data center platform with global
              hyperscalers. Conversely, the anti-thesis highlights substantial operational and governance
              vulnerabilities that temper this commercial expansion. Gradiant disclosed an estimated 20% revenue
              contraction across its Middle East operations caused by geopolitical tensions and customer investment
              pauses, underscoring geographic volatility. Furthermore, executive leadership scrutiny stemming from
              widely publicized brothel investigation hearings involving Executive Chairman Anurag Bajpayee presents an
              unquantified governance and institutional underwriting headwind that complicates near-term capitalization.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
