figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      A qualitative sizing stack separates Gradiant's broad industrial-water boundary from the
      company-specific commercial indicators that are actually quantified.
    data:
      nodes:
        - label: Industrial water infrastructure
          value: "Unquantified"
          detail: "Broad boundary covering industrial intake, treatment, reuse, recovery, and discharge."
        - label: Water-intensive industries
          value: "Multiple verticals"
          detail: "Chips, data centers, power, food, pharma, mining, renewables, and advanced manufacturing."
        - label: AI-economy priority layers
          value: "Chips, data centers, power"
          detail: "The company's current positioning concentrates on water required by physical AI infrastructure."
        - label: Current company revenue
          value: "$500M-$750M"
          detail: "Management range reported by Outlook Business in October 2026; unaudited."
        - label: U.S. semiconductor wins
          value: "$300M"
          detail: "Company-reported new contracts since the start of 2026 across five fab sites."
        - label: Data-center mix
          value: "~25% by 2027"
          detail: "Company forecast for share of its global business, not market share."
    approximationNotes: >-
      Layers are not proportional and do not constitute TAM, SAM, or SOM. Dollar values mix
      company revenue and contract awards, and the percentage is a company-mix forecast.
    claimRefs: [CM001, CM004, CM005, CM008, CM015]
callouts:
  - calloutType: risk
    title: Do not capitalize the generic water narrative
    body: >-
      The evidence supports strong vertical demand and company traction, but it does not establish
      an independently measured addressable market, market share, or order-to-revenue conversion.
    claimRefs: [CM005, CM008, CM011, CM012, CM013]
