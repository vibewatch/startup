company:
  name: Gradiant
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Gradiant addresses mission-critical industrial water infrastructure rather than a single equipment
    category, with near-term demand concentrated in semiconductors, AI data centers, and other
    water-intensive industries. Commercial indicators are substantial, but the available evidence
    does not support an independent TAM, SAM, or SOM; valuation work should therefore anchor on
    observable contracts, revenue, vertical mix, and execution constraints rather than a broad market estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is the design, construction, operation, optimization, and chemical support
      of industrial water and wastewater systems, from intake and ultrapure-water production through
      reuse, resource recovery, and discharge. This boundary includes mission-critical infrastructure
      for chips, data centers, power, food and beverage, pharmaceuticals, mining, and advanced
      manufacturing; it excludes municipal networks unrelated to industrial sites and general-purpose
      digital infrastructure. The status quo is not only another water vendor: it is a fragmented
      combination of internal engineering teams, engineering-procurement-construction firms, equipment
      specialists, chemical suppliers, and separate operations contractors. Gradiant's proposition is
      to replace that multi-vendor coordination burden with one accountable water layer, so its
      addressable spend is narrower than the whole water economy but broader than any single treatment technology.
    claimRefs: [CM001, CM014, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      No retained source provides a methodologically transparent, independent market-size estimate
      for Gradiant's exact boundary. The defensible sizing evidence is bottom-up. Gradiant reported
      $300 million of new U.S. semiconductor contracts across five fabrication sites since the start
      of 2026, while an independent interview placed current company revenue at $500 million to
      $750 million and management's target at $1 billion within two to three years. Company-issued
      evidence also projects that data centers could become about 25% of global business by 2027.
      These figures show material commercial demand, but orders are not revenue and company mix is
      not market share. They should be treated as traction and planning signals, not as a substitute
      for TAM, SAM, or SOM.
    claimRefs: [CM004, CM005, CM006, CM008, CM011, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The economic buyer is typically the owner or developer of a water-intensive industrial asset,
      with budget responsibility split across facilities, utilities, process engineering, operations,
      sustainability, and capital-project teams. Plant operators and process engineers are the daily
      users, while finance and executive sponsors fund capacity, reliability, and compliance.
      Adoption is triggered when water availability, discharge limits, production expansion, or
      fragmented accountability threatens a project's schedule or output. Repeat semiconductor
      awards and reuse performance above 80% on one scrubber-reclaim design indicate that proven
      delivery can expand scope within an existing account. The sales path remains project-led and
      technically intensive, implying long qualification and execution cycles rather than a
      frictionless software-style expansion motion.
    claimRefs: [CM008, CM009, CM010, CM014, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      AI infrastructure, semiconductor localization, higher cooling demand, water scarcity, and
      stricter discharge requirements are the clearest demand drivers. Company-issued projections
      describe six-fold data-center capacity growth from 2025 to 2035 and very large water needs for
      a 100MW campus, but those forecasts require independent validation. Constraints are equally
      important: permitting, water-source availability, customer qualification, project financing,
      geopolitical pauses, and integration across multiple engineering disciplines can delay
      conversion from order to recognized revenue. Independent reporting says Middle East tensions
      reduced Gradiant's regional revenue by about 20%, while regulatory uncertainty remains a
      barrier for PFAS-destruction technologies. A premium valuation therefore depends less on a
      generic water-market CAGR than on backlog quality, repeat business, margin conversion, and
      whether integrated delivery reduces schedule risk at customer sites.
    claimRefs: [CM002, CM003, CM007, CM015, CM016]
