    {
      "id": "milestones-customer-proof-and-diligence-risk",
      "title": "Milestones, customer proof, and diligence risk",
      "body": "Later chapters can anchor on a clear public chronology: December 2024 filing, January 2025 launch, March and April 2025 leadership additions, September 2025 Series A, October Sarasota world-headquarters announcement, December DTCP-backed EMEA expansion, and the March 31 2026 Series B plus Bashar appointment. Public proof points also show that Tenex is operating in real enterprise environments rather than just publishing vision material. BankInfoSecurity documented Payabli’s Google SecOps deployment with Tenex as MDR partner and a go-live in roughly a week, while Tenex’s own Sunrun case study claims a 97% alert reduction and dwell-time improvement from 72 hours to under 24 hours. Combined with repeated Fortune 500 and Global 2000 references, those items support a real-if-still-opaque enterprise traction story.\n\nThe main overview risk is not a surfaced public lawsuit or regulator action in the reviewed source set; it is disclosure quality. Tech Funding News explicitly notes that some operating metrics are self-reported and unaudited, while official materials disagree on headquarters wording, headcount, and even whether false-positive reduction is 95% or 98%. Public sources also do not disclose exact customer count, ARR, board structure, or the full capital stack. That means Tenex’s growth story is credible enough to reuse as later ground truth, but several headline metrics should remain ranges or diligence asks until later chapters get primary documents from management or investors.",
