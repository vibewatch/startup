    "number": 1,
    "title": "Company Overview",
    "summary": "Tenex is an AI-native MDR / AI-SOC company that incorporated in December 2024, launched publicly in January 2025, and by March 31 2026 had announced a $250 million Series B led by Crosspoint while third-party reporting put valuation above $1 billion. The public operating story is strong on founder pedigree, Google-first security expertise, and early customer proof, but weaker on exact customer count, ARR, board-control detail, and harmonized headquarters/headcount disclosure. Current evidence supports Sarasota as the best operating-HQ narrative, with explicit caveats for conflicting San Jose, Central Florida, and filing-address language."
  },
  "sections": [
    {
      "id": "identity-formation-and-service-model",
      "title": "Identity, formation, and service model",
      "body": "Tenex is best described as a private AI-native managed detection and response company that markets itself as the “AI SOC company.” The cleanest chronology starts with legal formation rather than with marketing copy: Tenex Security, Inc. appears in Florida records as a Delaware foreign corporation filed on 2024-12-13, and the business then launched publicly from stealth on 2025-01-20. From there, the operating narrative is consistent. Tenex says it was built to triage every alert, investigate every threat, and combine AI speed with accountable human analysts instead of selling a stand-alone security product.\n\nThe commercial model also looks more like a service layer wrapped around hyperscaler security stacks than a traditional software SKU. Pricing pages show a three-tier ladder from Google Cloud Security Platform as a Service to Advanced Oversight and full Comprehensive MDR, while launch materials say pricing can scale with a customer’s cloud-security-platform spend. That matters because it means Tenex monetizes both platform operation and outcome-oriented MDR. The company’s center of gravity is especially clear in Google-oriented materials: Tenex repeatedly claims Google SecOps depth, Microsoft compatibility, and orchestration across more than 300 tools. In practice, the chapter should treat Tenex as a fast-scaling AI-native security-services company whose public story is built on hyperscaler operational expertise rather than on a single packaged software product.",
