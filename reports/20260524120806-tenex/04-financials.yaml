- id: gtm-traction-and-sales-efficiency-proxies
  title: GTM motion, traction markers, and sales-efficiency proxies
  body: Tenex's go-to-market appears enterprise, partner-anchored, and deployment-led. The company repeatedly emphasizes Google SecOps implementation and operation, says it also supports Microsoft security environments, and frames customer success as a white-glove managed service rather than a self-serve platform motion. That is consistent with the Payabli case study, where Tenex and Google SecOps were reportedly live in about a week, implying a services-heavy sales process that turns platform setup into recurring MDR revenue. Public traction signals exist, but investors should treat them carefully. Tenex said it crossed $10 million revenue in September 2025 and $18 million revenue in December 2025, while Eric Foster told Business Observer the company reached $25 million of contracted revenue in the year after its first contract. Those are meaningful demand markers, yet all are company or founder supplied. Likewise, reported headcount of roughly 100 and 2026 hiring goals of 250 to 300 people indicate aggressive scaling, but they are proxies for demand and cost load, not audited sales efficiency.
