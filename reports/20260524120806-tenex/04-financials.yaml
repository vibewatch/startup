company:
  name: Tenex
chapter:
  number: 4
  title: Financials
  summary: Tenex's public financial picture shows real external financing and a clear services-led revenue model, but not enough disclosure to underwrite revenue quality like software. Public pages show a three-tier Google-SecOps-centered offering with no dollar pricing, while self-reported traction markers progressed from more than $10 million revenue in September 2025 to $25 million contracted revenue and roughly 100 employees by spring 2026. The $250 million Series B likely provides near-term capacity to expand, yet cash, burn, ARR, NRR, gross margin, and exact lifetime capital raised remain undisclosed, so the right verdict is positive on demand and financing access but cautious on margin durability and financing dependence.
sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue model, packaging, and pricing opacity
  body: 'Tenex is selling an outcome-led managed security service stack rather than a transparent software price card. Its public commercial pages consistently present three tiers: a Core Security Platform offer that implements and runs Google SecOps without full monitoring, an Advanced Oversight layer that adds human-and-AI threat review and hunting, and a Comprehensive MDR package with 24x7x365 monitoring, triage, remediation, automated containment, and post-incident reporting. Threat management, security automation, and incident response pages largely restate the same commercial architecture, which suggests upsellable delivery capabilities rather than separately posted standalone SKUs. What matters financially is not just that Tenex has products, but that it has service tiers that can expand from implementation into recurring monitoring and response. The problem is transparency. Public pages offer no dollar list pricing, minimums, contract duration, or discounting terms, so there is no reliable public bridge from pipeline or headcount to realized ASP, gross margin, or cohort economics.'
