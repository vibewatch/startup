- id: cost-structure-and-margin-drivers
  title: Cost structure and gross-margin drivers
  body: 'Tenex''s public positioning implies a hybrid cost structure: heavy service labor, active engineering buildout, cloud-platform management, and automation intended to compress incremental delivery cost over time. The company promises 24/7 monitoring, named customer support, incident response, and platform management, while also hiring software engineers, AI engineers, data scientists, and round-the-clock SOC personnel. That mix should create meaningful operating leverage only if the automation narrative is real. Management and investors argue that it is. Tenex claims it can analyze all alert telemetry in under a minute, orchestrate actions across more than 300 tools, and reduce false positives dramatically; Crosspoint goes further and argues the model can produce better gross margins than traditional software because AI reduces trapped labor. Investors should not underwrite that claim at face value. Public comp results show what durable cybersecurity economics look like once disclosed: CrowdStrike and SentinelOne sustain mid-70s to high-70s gross margins, Palo Alto guides to strong operating and free-cash-flow margins, and Rapid7 shows that AI-SOC messaging does not prevent flat ARR. Tenex may be building toward a better services margin model, but public proof is still absent.'
