- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public proxy
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue
    - Needed to separate bookings, contracted revenue, and earned revenue
    - Self-reported >$10M, >$18M, and $25M contracted-revenue markers
    - Revenue quality cannot be judged from contract headlines alone
    - Request monthly recurring revenue waterfall, GAAP revenue by quarter, and bookings-to-revenue bridge
  - - ARR and retention
    - Needed to judge recurring quality and expansion durability
    - No public ARR, NRR, or GRR for Tenex
    - Cannot benchmark like a software business
    - Request ARR by quarter, gross retention, net retention, and cohort renewal curves
  - - Realized pricing and discounting
    - Needed for CAC payback and margin analysis
    - Public pages show packages but no dollar price card
    - No support for ASP, discount, or sales-efficiency math
    - Request standard order forms, realized ASPs, and channel discount schedules
  - - Gross margin structure
    - Needed to test the AI-enabled services thesis
    - Only investor commentary says margins can exceed traditional software
    - Core margin claim is not auditable from public evidence
    - Request gross margin by package plus labor, cloud, and tooling cost split
  - - Cash on hand, burn, and runway
    - Needed to assess financing dependency after the Series B
    - Public funding amounts only
    - Cannot tell whether the company is overcapitalized or just adequately financed
    - Request latest balance sheet, cash forecast, and base/downside runway
  - - Customer concentration
    - Needed to assess enterprise risk and renewal sensitivity
    - Multiple Fortune 500 / Global 2000 customers are claimed, but no counts or mix disclosed
    - A few large logos could dominate contracted revenue
    - Request customer count, top-10 ARR share, and vertical mix
  - - Exact total raised and capital structure
    - Needed to know dilution, preferences, and financing overhang
    - Public rounds total at least $277M, but later Series A additions lack separate amounts
    - Lifetime funding and preference stack remain uncertain
    - Request fully diluted cap table, security classes, liquidation preferences, and any debt
  - - Public comp transferability
    - Needed to know whether software-like comp economics apply
    - CrowdStrike, SentinelOne, Palo Alto, and Rapid7 provide benchmark bands only
    - Tenex may deserve a premium or discount depending on services mix
    - Request internal package P&L and automation savings proof versus public-comp benchmarks
  notes: Each gap is directly tied to a concrete underwriting failure point rather than a generic request for more data.
