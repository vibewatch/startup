- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'The capital story is the cleanest part of Tenex''s public financial file, but it is still incomplete. Tenex publicly disclosed a $27 million Series A in September 2025 and a $250 million Series B in March 2026, which puts disclosed round sizes at at least $277 million. Additional Florida and DTCP investments were described as incremental Series A participation rather than separately sized new financings, so exact lifetime capital raised still cannot be pinned down from public materials alone. The use-of-funds language is consistent across sources: expand globally, scale engineering, add more human expertise behind MDR, build out Sarasota and EMEA, and keep hiring aggressively. That makes the $250 million round strategically important because Tenex is taking on simultaneous product, services, and geographic expansion. The catch is that none of the sources disclose cash on hand, debt, monthly burn, runway, or cap-table detail beyond the financing headlines and a Florida entity filing. Even the legal-address picture is mixed: Tenex markets Sarasota as its world headquarters, while the Florida filing still showed an Overland Park principal address as of late April 2026. The round likely buys time, but not underwriting precision.'
