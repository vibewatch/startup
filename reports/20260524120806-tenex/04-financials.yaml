  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact-total-raised
    missingEvidence: A closing-by-closing cap table and financing schedule showing exact dollars for every Series A extension and the post-Series B fully diluted share count.
    whyItMatters: Headline round sizes support the story, but exact lifetime funding and dilution still affect ownership, preferences, and valuation underwriting.
    diligencePath: Request the board-approved financing history, cap table, and security terms from counsel or finance.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-retention
    missingEvidence: Quarterly ARR, GRR, NRR, logo churn, and cohort expansion data by package and segment.
    whyItMatters: Without ARR and retention, Tenex cannot be benchmarked as a recurring-revenue asset or compared cleanly with public cyber comps.
    diligencePath: Request the operating dashboard used at board meetings, including ARR bridges and retention cohorts.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash, monthly net burn, hiring burn by function, and base/downside runway post-Series B.
    whyItMatters: A large round does not automatically prove financing independence; runway determines whether Tenex can fund simultaneous product, SOC, and geographic expansion.
    diligencePath: Request the latest monthly cash forecast and 12-to-24 month operating plan with scenario cases.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Standard order forms, realized ASPs, contract duration, discounting norms, and project-to-recurring conversion rates.
    whyItMatters: Tenex publishes packages but not dollars, so there is no public way to calculate payback, revenue quality, or pricing power.
    diligencePath: Request anonymized contracts, pricing approval policies, and pipeline conversion data by package.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-structure
    missingEvidence: Package-level gross margin, labor utilization, cloud and tooling cost split, and automation savings evidence.
    whyItMatters: The core investment debate is whether AI makes Tenex a superior services model or just a labor-heavy MDR provider with better marketing.
    diligencePath: Request package P&Ls, utilization reports, and a before/after automation productivity study.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer count, top-10 concentration, vertical mix, and concentration-adjusted churn or expansion behavior.
    whyItMatters: A few large enterprise logos could make contracted revenue appear strong while leaving renewal risk concentrated.
    diligencePath: Request a customer concentration schedule and cohort retention by segment and logo size.
    relatedQuestionRefs:
    - QI010
    - QI025
    relatedTableRefs:
    - TI005
