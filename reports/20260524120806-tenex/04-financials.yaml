- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The public evidence supports a constructive but cautious financial verdict. Tenex is not a pre-product story: it has raised a very large Series B, it has public partner and customer proof, and it has enough self-reported traction to believe the company is finding real demand in AI-native MDR. But the chapter does not support underwriting it like a transparent software compounder. There is no public dollar pricing, no public ARR, no NRR or retention data, no recognized-revenue bridge, no disclosed gross margin, and no public cash or burn disclosure. The comp set matters because it frames the gap. Public cyber leaders show that good software economics are possible, while Rapid7 shows that MDR-adjacent motions can still be capital constrained and slower growing. Tenex may ultimately deserve a premium because AI lowers delivery cost, but public evidence today only proves financing access and category interest, not durable revenue quality. My financial verdict is therefore positive on demand formation and near-term capital access, but still dependent on management diligence for realized pricing, cohort retention, gross margin structure, and runway.'
