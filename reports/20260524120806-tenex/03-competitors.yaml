      "id": "direct-peer-comparison-and-buyer-criteria",
      "title": "Direct peer comparison and buyer criteria",
      "body": "The direct-peer fight is about operating model, coverage breadth, packaging clarity, and trust in execution. Tenex markets an unusually explicit stair-step from Google SecOps platform management to Advanced Oversight and then full MDR, which can be appealing to teams that want to modernize tooling before outsourcing every response decision. Expel also packages clearly, with Starter, Select, and Premium bundles, but emphasizes Workbench transparency and more than 160 integrations rather than a Google-centered control plane. Arctic Wolf leans harder into a concierge operating model and Aurora Agentic SOC claims, pairing 10,000-plus environments, 1,000-plus security experts, and 200-plus integrations with messaging about lower attack frequency and severity. Deepwatch's pitch is closer to cyber-resilience-as-a-service, combining named experts, dynamic risk scoring, and strong ROI language. The common thread is that human-plus-AI language is now everywhere. CrowdStrike talks about agentic MDR with humans in the loop, Arctic Wolf stresses bounded autonomy with humans in the loop, Deepwatch says Precision MDR unites AI and human expertise, and Google and PwC both describe agentic SecOps as analyst augmentation rather than replacement. That lowers the novelty value of Tenex's AI-native branding. To win, Tenex will need buyers to believe its Google-native service design and staged packaging produce measurably better outcomes, easier adoption, or better economics than other service-led rivals—not merely comparable AI rhetoric.",
