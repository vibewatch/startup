    "number": 3,
    "title": "Competitors",
    "summary": "Tenex is entering a crowded MDR and AI-SOC field where the closest services-led peers are Arctic Wolf, Expel, and Deepwatch, while the hardest scale constraints come from platform-service incumbents like CrowdStrike and Palo Alto Networks. Tenex's clearest public wedge is Google SecOps-native platform operation plus AI-led managed response, but that wedge is not yet protected by public price transparency, customer-scale proof, or uniquely defensible AI messaging. The category is growing quickly, yet incumbent platform gravity and quote-led buying processes make proof of win-rate and switching friction the critical next diligence step."
  },
