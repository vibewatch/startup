      - number: '8.5'
        title: Recommendation, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              My recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance at
              the current headline price. I would not lead an investment on public evidence alone because the data set
              still supports the company more strongly than it supports the price. The right posture is price-sensitive
              and evidence-sensitive: stay engaged if the company can open the data room on recurring revenue quality,
              cap-table terms, burn, and concentration; step away if management asks investors to accept a premium
              multiple without showing those basics. The most important diligence asks are practical rather than
              theoretical: a monthly revenue and ARR bridge, cohort retention, package-level gross margin, cash and
              runway, hiring economics, customer concentration, and the exact preference stack. Those items directly
              determine whether Tenex belongs anywhere near the upper half of the public comp spectrum or should be
              marked closer to services-heavy or slower-growth security names. The thesis breaks if the company cannot
              show diversified recurring revenue, if automation economics are weaker than the sales story implies, if
              EMEA and channel expansion add cost faster than they add durable revenue, or if the next private or public
              comp reset pulls acceptable security multiples sharply lower. Until those questions are answered, the
              disciplined move is to keep Tenex on the front foot in diligence, not on the front foot in price.
