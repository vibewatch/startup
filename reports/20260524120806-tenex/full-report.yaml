  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category shift
        blocks:
          - type: paragraph
            body: >-
              Tenex should not be benchmarked against all cybersecurity or all AI-security spend. The cleanest public
              definition comes from Gartner’s market guide abstract, which describes MDR as remotely delivered,
              human-led, turnkey modern SOC functions aimed at cyberattack disruption and containment. That definition
              keeps the core market centered on managed detection, investigation, hunting, containment, and response
              work. It also means several adjacent budgets should stay outside the headline TAM: standalone SIEM, SOAR,
              or XDR licenses without operated response, generic MSSP monitoring, and one-off incident-response
              consulting all matter commercially, but they are substitutes or adjacencies rather than the direct market
              Tenex is selling into.


              At the same time, the category is expanding. Cyberproof, Google Cloud, and PwC all describe a shift from
              manual or rule-bound SOC work toward MXDR, AI-assisted triage, and agentic SecOps. That matters because
              Tenex’s own packaging is unusually explicit about this convergence. The company sells Google SecOps
              platform management, a human-plus-AI monitoring overlay, and a full 24x7 MDR layer. So the right market
              frame is neither commodity MSSP monitoring nor pure security software. It is the emerging managed-SecOps /
              AI-native-MDR wedge where platform operation, orchestration, and outcome ownership are sold together.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM045
