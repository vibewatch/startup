        title: Leadership, governance, and location record
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is rich on operators and thinner on formal governance. Official materials
              name Eric Foster, Edwin Solis, Ryan Shreve, and Venkata Koppaka as the founding team, with backgrounds
              spanning Cyderes, Google Cloud Security, Chronicle, FireMon, Garmin, and RiskIQ. Lou Manousos is publicly
              identified as chairman, Jan Grzymala-Busse joined as CISO in March 2025, Bashar Abouseido became president
              on March 31 2026, and Piers Morgan was added as Head of EMEA on April 8 2026. That is a credible operating
              bench for enterprise cyber services, especially given the company’s Google-first technical positioning and
              the financial-services security pedigree that Bashar brings.


              The caveat is that public governance detail stops well before a full control map. Reviewed sources do not
              surface committee structure, a complete current director slate, or clear investor-observer rights.
              Headquarters language also needs careful handling. The most current and repeated public framing points to
              Sarasota: the Series B release, Bashar announcement, Florida Opportunity Fund release, and local business
              coverage all center Sarasota or the Bee Ridge Road project. But the record is not fully harmonized. A
              March 2025 release says the company is headquartered in Central Florida, an April 2026 EMEA release says
              San Jose, and the Florida filing currently shows an Overland Park principal address. The safest overview
              conclusion is that Sarasota is the best current operating-HQ narrative, while legal and marketing records
              still require reconciliation before later chapters treat location as fully clean.
