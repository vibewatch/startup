          - type: callout
            title: Public security premiums are earned on software economics and disclosure depth
            body: >-
              CrowdStrike, Palo Alto Networks, and SentinelOne all publish revenue, ARR, and margin detail. Tenex does
              not need to look exactly like those companies, but it does need enough proof to explain why its multiple
              should live anywhere near their range.
