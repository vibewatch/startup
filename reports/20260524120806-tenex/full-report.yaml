            body: >-
              The post-sale motion is conceptually strong and evidentially thin. Tenex has done the organizational work
              to signal account expansion: it hired a dedicated VP of Customer Success, says every engagement gets named
              customer-success coverage, and frames success as proactive communication, measurable outcomes, and
              trust-based expansion. The package ladder also gives a believable upsell path from platform management to
              full MDR, and SC Media says the latest funding will support more integrations and partner growth. Those
              are all plausible foundations for net retention. But they are not the same thing as net retention. No
              public source in this run discloses NRR, GRR, logo churn, renewal rate, contract term, average contract
              value, or customer-count-by-package. No source discloses top-customer concentration, ecosystem
              concentration, or whether the direct model or the partner model drives most bookings. The result is a
