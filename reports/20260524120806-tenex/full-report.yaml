            body: >-
              The core technical differentiation case is plausible but should be stated carefully. Public competitor
              materials from CrowdStrike, Expel, Palo Alto Networks, Google, and PwC all show that human-plus-AI MDR and
              agentic-SOC language is now category standard, so Tenex cannot claim uniqueness from AI rhetoric alone.
              Its stronger wedge is operational lineage: Chronicle and Google pedigree in leadership and engineering,
              explicit Google SecOps implementation depth, clear alignment to Microsoft and AWS environments, and public
              claims of 300-plus tool orchestration. That combination makes Tenex look more like a hyperscaler-native
              services platform than a generic outsourced SOC. Maturity is therefore strongest where public proof is
              strongest: Google-centered deployment, managed SecOps packaging, customer outcomes around alert reduction
              and time to value, and formal SLO/DPA controls. Maturity is weaker where public evidence remains thin:
