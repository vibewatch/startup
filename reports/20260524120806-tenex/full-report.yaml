      - number: '8.2'
        title: >-
          Comparable framework: premium cybersecurity multiples exist, but they are earned on disclosure and software
          economics
        blocks:
          - type: paragraph
            body: >-
              The right comparable framework for Tenex is not “cybersecurity is hot, therefore $1 billion is fine.”
              Public comps show that security names can command premium valuations, but the spread is enormous and
              closely linked to revenue quality, disclosure, margin structure, and platform breadth. CrowdStrike ended
              FY2026 at $4.81 billion of revenue, $5.25 billion of ARR, and 78% GAAP subscription gross margin, while
              Palo Alto Networks guided roughly $11.3 billion of FY2026 revenue and traded at a far larger absolute
              scale. SentinelOne offers a smaller but still software-led benchmark with $1.001 billion of FY2026
              revenue, $1.119 billion of ARR, and 74% GAAP gross margin. Rapid7 is the cautionary anchor: it still
              generated $832 million of ARR and positive free cash flow in Q1 2026, but public markets only assigned it
              about a $0.48 billion market cap after ARR contraction. On a simple market-cap-to-revenue proxy, the
              spread runs from roughly 0.6x for Rapid7 to about 35.1x for CrowdStrike, with SentinelOne near 6.4x and
              Palo Alto near 18.7x. Tenable, CyberArk, and Zscaler show that even within security, public valuations
              vary widely based on category position and growth quality. Tenex’s challenge is that its current public
              package set looks more services-heavy than these software leaders, while its strongest revenue datapoint
              is founder-reported contracted revenue rather than disclosed ARR. That does not make the story impossible;
              it does mean the burden of proof for a premium multiple is still ahead of management, not behind it.
