        blocks:
          - type: paragraph
            body: >-
              The public product surface is clearer than a generic AI-SOC marketing page but still more services-led
              than software-led. Tenex consistently describes itself as an AI-native, human-led managed detection and
              response provider, and its commercial packaging resolves into a three-step ladder rather than a long list
              of separately priced products. Core Security Platform is the implementation-and-management layer for
              Google SecOps without continuous monitoring; Advanced Oversight adds human-and-AI threat detection,
              hunting, tuning, and advisory support; Comprehensive MDR adds 24x7x365 monitoring, triage, remediation,
              incident response, automated containment playbooks, post-incident reporting, and white-glove customer
              success. The threat-management, security-automation, and incident-response pages are best read as
              capability lenses within that ladder, not as proof of separate standalone SKUs. That matters because the
              customer job is operational: get a modern SecOps stack live, reduce alert noise, gain around-the-clock
              coverage, and move from platform ownership to platform outcomes. The upside is a coherent service
              progression from platform management to fully operated response. The downside is that public materials
              still stop short of showing modular API products, discrete usage-metered components, or deeply documented
              technical boundaries between the AI layer, orchestration layer, and human delivery layer.
