              enough for a conservative enterprise procurement process. External MDR buying guidance says serious buyers
              should expect 24x7 staffing, immediate remote mitigation, turnkey delivery, and integrations beyond
              provider-owned tooling. It also says MDR remains a human-led service, which matters because Tenex markets
