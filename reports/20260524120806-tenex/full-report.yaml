            body: >-
              The last major risk bucket is people plus financing. Public sources put Tenex near 100 employees in spring
              2026, while management and media sources discuss 250 to 300 hires through the year. The careers page makes
              clear that this is not a loose remote scale-up. It is an on-site-first, relocation-heavy operating model
