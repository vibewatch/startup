      - - Automation economics are weaker than claimed
        - Package-level gross margin and analyst-productivity data fail to show real leverage
        - Bull case loses the core reason for premium valuation support
        - Re-rate toward services-heavy comp band
      - - Concentration is too high
        - Top-10 customers or partner channels drive an outsized share of revenue with weak renewal proof
        - Makes the $25M traction signal fragile and volatile
        - Demand larger downside protections or pass
      - - Expansion adds cost faster than durable revenue
        - EMEA buildout and hiring plan widen burn without a matching step-up in recurring-quality revenue
        - Reduces runway and raises down-round risk
        - Assume next round is defensive rather than accretive
      - - Security multiple regime resets lower
        - Public security comps keep compressing toward Rapid7 / lower-mid-cap bands
        - Even good execution may not rescue entry returns from a premium starting price
        - Re-underwrite against lower exit multiples immediately
