              faster learning if it works, but it also narrows the hiring funnel at exactly the moment Tenex needs
              scarce AI, security, data, sales, and customer-success talent. Leadership additions such as Bashar
              Abouseido, Ryan Swigler, and Piers Morgan are positive mitigants, yet they also raise the bar: investors
              are no longer underwriting a scrappy pilot team, but a company pitching regulated enterprise readiness.
