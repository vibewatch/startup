              what is not public. I did not find a public status page, service-credit policy, detailed uptime history,
              SOC 2 or ISO attestation package, or customer-facing API and connector documentation. Buyers therefore get
              enough public evidence to believe Tenex has thought seriously about controls, but not enough to treat
