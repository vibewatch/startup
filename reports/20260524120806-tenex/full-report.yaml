        - Determines whether Tenex deserves software-like or services-like multiples
        - Finance + CEO data room
      - - Margin proof
        - Package-level gross margin, analyst productivity, automation uplift, services hours per customer
        - Bull case depends on real delivery leverage
        - Finance + operations review
      - - Cap table
        - Ownership, liquidation stack, participation terms, investor rights, employee dilution
        - Downside recovery and next-round economics depend on preference overhang
        - Legal + board materials
      - - Cash and runway
        - Cash balance, burn, hiring plan, budget sensitivity, expansion spend by geography
        - Series B size alone does not prove funding independence
        - Finance model review
      - - Customer durability
        - Customer count, top-10 concentration, contract terms, renewal and expansion behavior
        - A small-concentrated base can break the valuation quickly
        - Sales ops + customer success review
      - - Independent proof
