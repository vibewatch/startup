      - number: '2.4'
        title: Growth drivers, constraints, and implications for Tenex
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are structural rather than cyclical. ISC2’s 4.8 million workforce gap and
              budget-led staffing shortages explain why buyers increasingly prefer operated security outcomes over
              simply buying more tools. ENISA’s threat-landscape volume supports the urgency narrative, while
              Coalition’s premium credits show that cyber-insurance can now make MDR adoption financially easier rather
              than just operationally prudent. AI also matters on the supply side: Google and CSA both publish evidence
              that agentic or AI-assisted SecOps can cut response times and improve analyst productivity, while vendors
              across CrowdStrike and Palo Alto are now selling outcomes such as faster containment and lower noise, not
              just visibility.


              But adoption constraints are equally real. Expel and UnderDefense both warn that buyers still fear
              black-box outsourcing, shallow response ownership, and escalation models that dump work back on internal
              teams. Deepwatch adds integration, privacy, and provider-dependency friction. The EU AI Act raises another
              burden for EMEA-oriented vendors by making transparency and governance more central to AI-enabled SecOps
              claims. For Tenex, that combination is double-edged. The company is well aligned to the market’s
              fastest-moving wedge—cloud-delivered, AI-augmented, managed SecOps—but it still has to prove human
              accountability, trusted response, and enough operational depth to win against better-known platform and
              service incumbents. In short, the market is large enough and growing fast enough to matter, but Tenex’s
              valuation case depends on credible share capture inside a narrower, harder-to-win wedge than generic TAM
              rhetoric suggests.
