      - number: '1.3'
        title: Capital formation, stakeholder map, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Tenex’s capital formation has been exceptionally fast. Launch materials disclosed backing from Andreessen
              Horowitz, Shield Capital, and angels but not the seed size. By September 2025 the company announced a $27
              million Series A led by Crosspoint Capital Partners, then used October and December add-on releases from
              DeepWork Capital, the Florida Opportunity Fund, and DTCP to link financing directly to Sarasota and EMEA
              expansion. On March 31 2026 the company announced a $250 million Series B led by Crosspoint, while
              Bloomberg and Tech Funding News reported valuation above $1 billion. Because the seed amount is still
              undisclosed and the later 2025 closes are phrased as additions to the same Series A, the safest public
              statement is not a precise lifetime capital total but a disclosed-capital floor of $277 million before any
              seed dollars, secondaries, or debt.


              Commercial scale is directionally strong but numerically uneven. Official releases say Tenex cleared more
              than $10 million of revenue in its first six months and more than $18 million in its first three quarters,
              while SC Media and Business Observer place contracted revenue around $25 million by spring 2026. Headcount
              is less tidy: BankInfoSecurity says 73 employees on March 31, while Business Observer says around 100 and
              management talks about 250 to 300 hires through 2026. Those inconsistencies do not erase momentum, but
              they do mean the chapter should preserve ranges and caveats rather than pretend to precision. The durable
              signal is that Crosspoint has become the key financial sponsor while Google, Microsoft, and
              regional-investor relationships are strategically important to how the business scales.
