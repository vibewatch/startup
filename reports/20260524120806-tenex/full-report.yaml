  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Top-ranked risk picture: the hardest failure mode is not lack of demand but an AI-control story that outpaces
          public proof
        blocks:
          - type: paragraph
            body: >-
              Tenex's risk stack starts with a mismatch between ambition and public substantiation, not a missing
              market. The company clearly rides real tailwinds: ENISA still counts thousands of serious incidents, NIS2
              expands mandatory cyber controls across critical sectors, and the AI Act tightens disclosure and
              governance expectations for AI systems. Those forces help explain why Tenex can win attention from
              regulated buyers and late-stage investors. But they also make sloppy proof more dangerous. Tenex's public
              legal pages explicitly say cyber risk cannot be eliminated and that the site is offered without
              warranties, while the company simultaneously markets eye-catching performance claims such as 100% alert
              coverage, 85% automatic triage, and 98% fewer false positives. That is not automatically a contradiction,
              but it is a diligence problem because the fetched set does not include audited methodology, denominator
              definitions, or enterprise contract language that translates those claims into enforceable obligations. My
              severity ranking therefore starts with regulatory and substantiation risk as a multiplier on every other
              risk. If Tenex cannot show a credible AI-governance pack, privacy map, incident-reporting workflow, and
              KPI-audit trail, then customer expansion, valuation support, and even partner credibility will degrade
              faster than the topline narrative suggests.
