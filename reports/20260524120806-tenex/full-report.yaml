              ARR, NRR, gross margin, burn, and customer concentration remain undisclosed. Public proof still centers on
              a small number of named examples plus self-reported metrics. My financial conclusion is therefore not that
              Tenex lacks momentum. It is that the price of that momentum is already high, and the thesis breaks if
