      - number: '3.3'
        title: Incumbent and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              The biggest strategic threat to Tenex is not another startup saying "AI SOC"; it is incumbent platform
              gravity. CrowdStrike's Falcon Complete pairs MDR with a globally scaled Falcon platform, publishes
              public-company metrics of $5.25 billion ARR and $1.31 billion quarterly revenue, and even has a public AWS
              listing with a $325.36 price point and 299-endpoint minimum. Palo Alto shows the same pattern from a
              different angle: Unit 42 MDR sits on top of Cortex XDR, XSIAM pushes an AI-driven SOC platform with strong
              automation metrics, Prisma Cloud extends coverage from code to cloud, and the company reports $6.3 billion
              of next-generation security ARR. For buyers, those bundles can simplify vendor count, procurement, and
              executive comfort. They also create a substitute path to Tenex: run the platform internally, add a
              vendor-managed layer later, or stay with a single large security vendor across endpoint, cloud, identity,
              network, and SOC. Tenex does have a plausible wedge here because not every buyer wants to swallow an
              incumbent platform stack. Organizations already aligned to Google SecOps may prefer a specialist who will
              operate and optimize that environment rather than replace it. But that same Google-centricity cuts both
              ways. It sharpens Tenex's fit for one buyer cohort while widening dependence on a partner ecosystem that
              Tenex does not fully control.
