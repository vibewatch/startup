            title: The current price already assumes a proof curve that is not public
            body: >-
              The more-than-$1-billion valuation is above 40x the founder-reported contracted-revenue floor. That can
              work only if Tenex quickly proves recurring revenue quality, margin leverage, and concentration
              resilience.
            calloutType: risk
            claimRefs:
