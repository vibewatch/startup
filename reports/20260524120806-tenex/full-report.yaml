      - number: '3.4'
        title: Durability, switching costs, and what still needs proof
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Tenex has a credible positioning wedge but not yet a demonstrated moat. The
              good news is that the market backdrop is attractive: both MarketsandMarkets and Mordor show a
              fast-growing, cloud-delivered MDR category, and independent sources highlight the same structural demand
              drivers—alert overload, talent scarcity, and the move toward AI-assisted SecOps. Tenex also benefits from
              one real weakness in premium incumbents: external review sources show that Falcon Complete is widely
              respected but still criticized for cost, and public price transparency is scarce across the category. That
              creates an opening for a challenger if it can show better ROI, clearer packaging, or lower-friction
              deployment. The harder part is durability. Public sources do not prove that Tenex can displace incumbents
              at scale, hold customers once embedded, or defend its Google-first model against rivals that also
              emphasize integrations and human-validated AI. Multi-homing looks technically possible because many
              vendors support open ecosystems, yet platform-native bundles from CrowdStrike and Palo Alto can steadily
              raise switching cost through operational convenience and data gravity. The chapter's core diligence
              conclusion is therefore practical: Tenex's competitive story is believable enough to keep pursuing, but
              its moat should not be underwritten until management provides evidence on pricing, competitive win rates,
              customer references, and the real switching friction once Tenex becomes part of a customer's SecOps
              operating model.
