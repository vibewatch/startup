  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and where Tenex fits
        blocks:
          - type: paragraph
            body: >-
              Tenex should be benchmarked first against operated security outcomes, not against every security software
              SKU that mentions AI. Its own public ladder starts with Google SecOps platform management, adds a
              human-plus-AI oversight layer, and culminates in a fully managed MDR tier with 24x7x365 monitoring,
              remediation, and response playbooks. That means the most direct peers are service-led MDR providers
              selling outsourced security operations rather than software-only analytics. On that lens, Arctic Wolf,
              Expel, and Deepwatch are the cleanest direct comparisons because each markets a combination of always-on
              monitoring, threat hunting, expert analysts, and AI-augmented operations. CrowdStrike and Palo Alto
              Networks matter just as much, but as incumbent hybrids: both combine MDR or managed services with broad
              native platforms, public-company scale, and stronger category awareness. Those vendors can meet the same
              buyer need through a bundle that joins platform standardization with managed response. The substitute set
              is therefore broader than direct peers alone. Buyers can also keep SecOps in-house on Google SecOps,
              XSIAM, or Prisma-centered stacks, or use managed service partners tied to those platforms. The result is a
