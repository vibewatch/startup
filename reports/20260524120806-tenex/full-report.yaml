  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, packaging, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Tenex is selling an outcome-led managed security service stack rather than a transparent software price
              card. Its public commercial pages consistently present three tiers: a Core Security Platform offer that
              implements and runs Google SecOps without full monitoring, an Advanced Oversight layer that adds
              human-and-AI threat review and hunting, and a Comprehensive MDR package with 24x7x365 monitoring, triage,
              remediation, automated containment, and post-incident reporting. Threat management, security automation,
              and incident response pages largely restate the same commercial architecture, which suggests upsellable
              delivery capabilities rather than separately posted standalone SKUs. What matters financially is not just
              that Tenex has products, but that it has service tiers that can expand from implementation into recurring
              monitoring and response. The problem is transparency. Public pages offer no dollar list pricing, minimums,
              contract duration, or discounting terms, so there is no reliable public bridge from pipeline or headcount
              to realized ASP, gross margin, or cohort economics.
