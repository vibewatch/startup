  productSummary: >-
    Tenex sells a three-tier managed security stack: Core Security Platform for Google SecOps implementation and
    management, Advanced Oversight for human-and-AI monitoring and hunting, and Comprehensive MDR for 24x7 monitoring,
    triage, remediation, incident response, and customer-success coverage.
  customerFocus: >-
