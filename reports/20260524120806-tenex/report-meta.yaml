  market and competitor sources, and fetched source texts reviewed through May 24, 2026. Evidence is strong on
  Tenex's formation, founder pedigree, packaging, Google-centric operating model, financing chronology, and limited
  named customer proof. Evidence remains weak or conflicting on exact customer count, ARR/NRR, gross margin, burn,
  full cap table, board/control structure, and even some basics such as canonical headquarters wording and headcount.
  Several headline operating metrics are self-reported and unaudited, so this report treats momentum as real but many
  underwriting inputs as still provisional.
