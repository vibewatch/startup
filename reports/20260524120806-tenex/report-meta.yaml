companyProfile:
  summary: >-
    Tenex is a private AI-native, human-led managed detection and response company formed in December 2024 and launched
    publicly in January 2025. The company sells a three-tier ladder from Google SecOps platform management through
    Advanced Oversight to Comprehensive MDR, positioning itself as an operated security layer on top of Google-first and
    broader hyperscaler security environments. Public evidence shows unusually fast financing momentum, early enterprise
    proof, and a Sarasota-centered operating narrative, but the company remains financially opaque and several key
    operating metrics are still self-reported or inconsistent across sources.
