companyProfile:
  summary: >-
    Tenex 是一家私营 AI 原生、人主导的托管检测与响应（MDR）公司，成立于 December 2024，并于 January 2025 公开发布。公司销售三级阶梯产品，从 Google SecOps 平台管理，到
    Advanced Oversight，再到 Comprehensive MDR，把自己定位成覆盖 Google 优先及更广泛超大规模云厂商安全环境之上的运营型安全层。公开证据显示，Tenex
    融资推进异常快，已有早期企业客户证明，并围绕 Sarasota 构建运营叙事，但公司财务仍不透明，多项关键运营指标仍由公司自报，或在不同来源之间不一致。
