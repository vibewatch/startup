      - number: '5.4'
        title: 信任、支持、隐私和可靠性控制真实存在，但比成熟公开信任中心更窄
        blocks:
          - type: paragraph
            body: >-
              Tenex 的公开运营控制细节多于许多年轻 MDR 供应商，但还达不到完全成熟的公开信任中心。最强证据很具体：Service Level Objectives
              页面发布按严重度划分的确认、响应和解决窗口，定义严重度评分方式，并列出客户侧可见性问题、未经授权请求和审批延迟等排除项。数据处理协议也有实质内容。它把 Tenex
              定义为按客户指令行动的处理方，承诺公司不出售或分享个人数据，引用 SCC 和 UK Addendum 传输机制，承诺不得无故延迟数据泄露通知，并提供审计支持和子处理方义务。Sunrun
              案例研究增加了第二层信任：高严重度事件必须有人类检查点、红队验证和透明推理日志。客户支持语言对一家年轻供应商来说也格外明确：具名客户成功、从上线到扩张的所有权，以及董事会层面的可衡量结果，出现在套餐、Google
              和客户成功页面中。限制在于公开材料没有什么。我没有找到公开状态页、服务抵免政策、详细正常运行时间历史、SOC 2 或 ISO 认证包，或面向客户的 API 和连接器文档。因此，买家能从公开证据中相信 Tenex
              严肃思考过控制，但证据还不足以在企业尽调深度上把这些控制视为已由第三方充分证明。
