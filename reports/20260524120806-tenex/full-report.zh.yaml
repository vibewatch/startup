      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事是 Tenex 公开财务档案中最干净的一块，但仍不完整。Tenex 公开披露了 September 2025 的 $27 million Series A，以及 March 2026 的 $250
              million Series B，这让已披露轮次规模至少达到 $277 million。Florida Opportunity Fund 和 DTCP 的追加投资被描述为 Series A
              的增量参与，而不是单独标明规模的新融资，因此仅凭公开材料仍无法钉死精确累计融资。资金用途表述在各来源间一致：全球扩张、扩大工程团队、在 MDR 背后增加更多人类专家、建设 Sarasota 和
              EMEA，并继续激进招聘。这让 $250 million 轮次具有战略重要性，因为 Tenex
              正同时承担产品、服务和地域扩张。问题在于，没有任何来源披露现金余额、债务、月度烧钱速度、现金跑道，或融资标题和佛罗里达州实体备案之外的股权结构表细节。甚至法律地址图景也混杂：Tenex 把 Sarasota
              营销为全球总部，但佛罗里达州备案截至 late April 2026 仍显示 Overland Park principal address。这一轮融资大概率买来了时间，但没有买来承销精度。
