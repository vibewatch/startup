            body: >-
              Tenex 的公开客户证据足以回答「是否真的有人在用」这个问题，但还不足以推出广泛可背书。最强的独立具名证据来自 Payabli。Payabli 安全合规负责人在 Google Cloud Next 2026
              期间接受 BankInfoSecurity 采访时称，Payabli 部署了 Google SecOps，由 Tenex 担任 MDR
              合作伙伴，环境约一周上线。这个证据有分量，因为说话者是具名客户运营方，谈的是已上线部署，而不是公司新闻稿里的引用。Sunrun 是量化结果最强的案例，但来源是 Tenex
              自制案例研究，因此只能作为支持性材料，而非独立证明。Onspring 提供了公开支持性引语，但同样只出现在 Tenex 托管页面。具名客户标识之外，采用轨迹主要靠代理指标支撑：2025 年 3
              月签下首份合同，第一年签约收入 $25 million，2025 年底前声称已有多家 Fortune 500 客户，Series B 新闻稿声称同比增长
              318%。这些都是有用的牵引信号，但不能替代已披露客户数、活跃部署数，或队列层面的重复消费证据。
