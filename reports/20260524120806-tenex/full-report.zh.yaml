      - number: '2.4'
        title: 增长驱动、约束与对 Tenex 的含义
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自结构性因素，而不是周期。ISC2 的 4.8 million 人才缺口和预算导致的用工短缺，解释了为什么买家越来越偏好运营型安全结果，而不是简单再买工具。ENISA
              的威胁图景规模支撑了紧迫性叙事；Coalition 的保费抵扣则显示，网络保险现在可以让 MDR 采用在财务上更容易，而不只是运营上更审慎。AI 在供给侧同样重要：Google 和 CSA 都发布证据称，智能体或
              AI 辅助 SecOps 能缩短响应时间、提升分析师生产率；从 CrowdStrike 到 Palo Alto，各厂商现在销售的结果是更快遏制和更低噪声，而不只是可见性。


              但采用约束同样真实。Expel 和 UnderDefense 都警告，买家仍担心黑箱外包、响应所有权浅，以及把工作倒回内部团队的升级模型。Deepwatch 又增加了集成、隐私和供应商依赖摩擦。EU AI Act
              让面向 EMEA 的供应商背上另一重负担，因为 AI 赋能 SecOps 主张必须更强调透明度和治理。对 Tenex 来说，这组因素有两面性。公司与市场推进最快的切口——云交付、AI 增强、托管
              SecOps——高度一致，但仍必须证明人类可追责、可信响应，以及足够运营深度，才能赢过知名度更高的平台和服务既有厂商。简言之，市场足够大、增速也足以重要，但 Tenex 的估值逻辑取决于能否在一个比通用 TAM
              叙事更窄、也更难赢的切口里可信夺取份额。
