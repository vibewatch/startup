          type: process
          detail: 安全信号从云、身份、终端和网络控制进入 Tenex 运营环境。
        - id: w3
          label: AI 分诊与补充
          type: process
          detail: Tenex AI 汇总告警、排序、关联上下文并过滤噪声，再把任务交给下一环节。
        - id: w4
          label: 人工验证与狩猎
