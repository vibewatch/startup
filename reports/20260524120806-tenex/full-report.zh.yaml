        title: 领导层、治理与地点记录
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露对运营者着墨很多，对正式治理则薄一些。官方材料列出 Eric Foster、Edwin Solis、Ryan Shreve 和 Venkata Koppaka 为创始团队，背景横跨
              Cyderes、Google Cloud Security、Chronicle、FireMon、Garmin 和 RiskIQ。Lou Manousos 的公开身份是董事长，Jan Grzymala-Busse
              于 March 2025 加入任 CISO，Bashar Abouseido 于 March 31 2026 出任总裁，Piers Morgan 于 April 8 2026 加入担任 EMEA
              负责人。对企业网络安全服务来说，这是一支可信的运营班底，尤其考虑到公司 Google 优先的技术定位，以及 Bashar 带来的金融服务安全履历。


              但公开治理细节离完整控制图谱还差很远。已审阅来源没有呈现委员会结构、完整现任董事名单，或清晰的投资人观察员权利。总部表述也必须谨慎处理。最新且反复出现的公开口径指向 Sarasota：Series B
              发布稿、Bashar 任命公告、Florida Opportunity Fund 发布稿和本地商业报道都围绕 Sarasota 或 Bee Ridge Road 项目展开。但记录尚未完全统一。一份 March
              2025 发布稿称公司总部在中佛罗里达，April 2026 EMEA 发布稿称 San Jose，佛罗里达州备案目前显示 Overland Park principal
              address。最稳妥的概览结论是：Sarasota 是目前最佳的运营总部叙事，但法律和营销记录仍需对齐，后续章节不能把地点当作完全干净的信息。
