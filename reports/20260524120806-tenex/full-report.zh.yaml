      - number: '8.4'
        title: 投资逻辑、反向逻辑与退出准备度
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑很直接。Tenex 所处品类真实存在，市场有双位数增长，公司能进入公开融资市场，产品包装可信，也有早期企业级牵引。公司不是在兜售没有收入信号的抽象 AI
              智能体；它有一个有意义的签约收入标记、不断增长的员工基数，以及愿意支持它从 Series A 快速跃升到 Series B 的投资人。渠道和生态可选性同样重要：Tenex 公开瞄准 MSP、VAR
              和分销商，管理层也描述了与 Google 和 Microsoft
              安全环境的实质协同。反向逻辑同样清楚。公开证据尚未证明收入质量、软件式利润率或耐久留存；最好的毛利率评论来自领投方，而不是经营披露。品类反向来源也提醒，AI SOC
              叙事常常跑在运营现实前面，尤其是在持续调优、人工责任和平台依赖被淡化时。Kuppinger 的平台警告尤其相关，因为一体化既有厂商能吸收更多买方预算，并简化采购。退出方面，管理层希望走 IPO
              路径，但当前披露更像一家仍需要一到两个私人证明周期的公司。因此，战略出售或后续更有指标支撑的私募轮，比干净的近期 IPO 结果更容易承保。
