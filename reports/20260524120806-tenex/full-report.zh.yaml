      - number: '7.2'
        title: 运营风险：AI SOC 的上行真实存在，但抑制漂移、调优负担和薄弱保证会把速度变成隐藏错误
        blocks:
          - type: paragraph
            body: >-
              本章最强的反向证据来自品类层面；这很重要，因为 Tenex 正是卖进这个品类。Panther、Conifers、Prophet 和 KuppingerCole 都指向同一个不舒服的结论：AI SOC
              自动化可以有价值，但前提是它建立在成熟检测、可靠数据、持续调优和明确人工责任之上。Panther 强调，演示常会隐藏集成和调优税，还会隐藏可能自动关闭错误告警的抑制漂移。Conifers
              称，静态自动化会在环境变化下失效，且常停留在浅层分诊。KuppingerCole 称，全熄灯 SOC 仍不现实。Prophet 称，买方更应关注入侵处置，而不是误报压缩。Tenex 确实有真实缓释项。Google
              把智能体式 SecOps 表述为由人控制，Tenex 发布了 SLO；其 DPA
              和案例研究措辞也显示了对流程和护栏的关注。但公开信任面仍比谨慎企业买方希望看到的更薄。我没有找到公开状态页、审计包、正常运行时间历史或模型质量报告，能让投资人区分耐久控制质量与快速早期叙事。这把 AI
              可靠性和保证成熟度推入剩余风险的第一梯队。
