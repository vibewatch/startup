      - number: '7.3'
        title: 依赖风险：Google 优先优势也是最清楚的集中度，客户侧执行也是依赖链的一部分
        blocks:
          - type: paragraph
            body: >-
              Tenex 的切入点最容易被相信的地方，也正是依赖最可见的地方：Google SecOps。公司公开把自己定位为专为 Google 环境打造；文件中最好的独立部署证据，是 Payabli 称 Tenex 是
              Google SecOps 上线中的 MDR 伙伴。这在商业上有用，因为它让 Tenex 区别于通用 MDR 厂商。它也是集中度风险，因为 Google 重度环境之外的公开证明，仍薄于 Tenex
              跨平台叙事展示的宽度。伙伴计划让风险更结构化。Tenex 想要 MSP、VAR 和分销伙伴；DTCP 与 Piers Morgan 把下一段增长绑定到 EMEA 伙伴建设；甚至 Tenex 自己的 SLO
              也承认，客户审批和可见性缺口会拖慢结果。实际含义是，服务质量不只取决于 Tenex 的 AI 或分析师，还取决于超大规模云厂商路线图、伙伴激励、客户遥测卫生和本地市场拓展执行。投资人应把 Google
              依赖同时作为护城河和单点故障来承保。如果 Tenex 不能给出收入结构、部署结构，或可重复的非 Google 证据路径，伙伴优势可能从溢价切入点变成渠道集中度折价。
