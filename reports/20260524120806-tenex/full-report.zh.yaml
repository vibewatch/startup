        - 索取迁移手册、互操作性和退出条款
      - - 黑盒或浅层响应怀疑
        - 约束
        - 当前
        - 买家越来越会测试 MDR 厂商是否真正接手响应，还是只把告警升级回客户
        - 索取能证明全周期修复和问责的客户背书
      - - SMB 价格下限和最低规模门槛
        - 约束
        - 当前
        - 打包式 MDR 仍可能要求足够终端数或支出，从而排除更小账户
        - 澄清 Tenex 的最低可行账户规模，以及监督层级是否能降低入门成本
      - - 现有巨头平台化
        - 约束
        - 当前
        - 大型厂商让买家开始期待一套技术栈带来更低噪声、更快 MTTR 和跨域可见性
        - 测试 Tenex 在哪里靠执行胜出，而不是靠品牌或平台宽度
