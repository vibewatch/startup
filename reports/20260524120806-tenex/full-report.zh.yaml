      - number: '5.2'
        title: 运营模型看起来如何运转：AI 先做预分流和编排，再由人类负责判断和响应
        blocks:
          - type: paragraph
            body: >-
              Tenex 的公开架构主张虽不到代码层，但方向上具体。主页、Google 合作页面和客户故事都指向同一种运营模式：摄取广泛遥测，用领域专用 AI
              分流并关联告警，把最高置信度事件交给人类分析师，再通过剧本和客户沟通执行遏制或升级。主页明确把闭环拆成分流、调查、响应和适应；Google 部署页面则把它翻译成基础设置、AI
              增强分层、威胁狩猎和事件响应，以及持续优化。客户证明强化了同样的分工。Payabli 称其用 Google SecOps 和 Tenex 大约一周上线；Sunrun 案例研究描述 AI
              智能体做预分流、关联和富化，人类则对高严重度案例保留最终权威。这种一致性让宽泛运营模型变得可信：Tenex 不是声称没有人类复核者的完全自主防御，而是在声称一种倍增器架构，AI
              负责速度、规模和关联，人类分析师、威胁猎手和顾问负责判断、升级和可追责。证据仍偏营销，但至少在产品、客户和法律文本之间内部一致。
