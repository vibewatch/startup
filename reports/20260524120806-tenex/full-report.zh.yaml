          detail: 分析师来源显示，2026-2031 年市场增长，且对人类主导、AI 增强 MDR 有需求
        - id: funding
          label: 强劲融资
          detail: $27M Series A 到 $250M Series B，间隔约七个月
        - id: traction
          label: 真实牵引信号
          detail: $25M 签约收入下限和快速招聘雄心
        - id: gap
          label: 披露缺口
          detail: 没有公开 ARR、NRR、毛利率、烧钱速度或股权结构表细节
        - id: price
          label: 价格已含溢价
          detail: 名义估值 > $1B，签约收入下限倍数 >40x
        - id: rec
          label: 建议：继续研究
          detail: 保持跟进，但没有数据室证据，不要按该价格下注
      edges:
        - from: market
          to: funding
          label: 支撑兴趣
        - from: funding
          to: traction
          label: 支撑扩张
        - from: traction
          to: gap
          label: 仍不完整
        - from: gap
          to: price
          label: 让价格失去锚点
        - from: price
          to: rec
          label: 倒逼纪律
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 $1 billion 估值下，认可倍数越高，支撑价格所需的隐含收入就越低；这凸显当前入场价已经预设了大量证据。
    approximationNotes: 每根柱显示：在给定倍数下，要支撑 $1 billion 估值所需的收入水平。这是估值支撑敏感性，不是对 Tenex 实际收入的预测。
    claimRefs:
      - CV034
      - CV035
      - CV052
    data:
      items:
        - label: 5x 倍数
          value: 200
          unit: $M revenue needed
        - label: 8x 倍数
          value: 125
          unit: $M revenue needed
        - label: 10x 倍数
          value: 100
          unit: $M revenue needed
        - label: 12x 倍数
          value: 83
          unit: $M revenue needed
        - label: 15x 倍数
          value: 67
          unit: $M revenue needed
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间说明了当前价格为何容错很低：基准情景大致持平到下行，诱人回报需要明显更强的证明曲线。
    approximationNotes: 区间是基于公开可比公司倍数带和 Tenex 公开牵引下限构建的情景输出，用来框定结果，而不是声称能精确估出公允价值。
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV050
    data:
      items:
        - label: 悲观情景
          low: 105
          high: 250
          unit: $M
          annotation: 35-50M revenue-like scale at 3x-5x
        - label: 基准情景
          low: 480
          high: 960
          unit: $M
          annotation: 60-80M recurring-quality revenue at 8x-12x
        - label: 乐观情景
          low: 1200
          high: 2200
          unit: $M
          annotation: 100-140M recurring-quality revenue at 12x-16x
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 式评分显示，Tenex 在赛道和动量上得分扎实，但收入可见性、股权结构表清晰度和估值支撑得分偏弱。
    approximationNotes: 分数是以本章公开证据为锚的 10 分制判断，不是管理层记分卡，也不是机器生成结果。
    claimRefs:
      - CV016
      - CV018
      - CV035
      - CV036
      - CV038
      - CV042
      - CV045
      - CV050
    data:
      items:
        - label: 市场机会
          value: 8/10 — fast-growing MDR category with clear demand drivers
        - label: 产品 / 包装清晰度
          value: 7/10 — coherent ladder from SecOps management into full MDR
        - label: 客户 / 牵引证明
          value: 6/10 — real traction signal, but still narrow public proof set
        - label: 收入质量可见性
          value: 2/10 — no public ARR, NRR, or customer concentration
        - label: 利润率 / 单位经济性证明
          value: 2/10 — investor claims exist, independent proof does not
        - label: 竞争耐久性
          value: 5/10 — plausible wedge, but incumbent gravity is strong
        - label: 估值支撑
          value: 3/10 — current price discounts future proof that is not public yet
