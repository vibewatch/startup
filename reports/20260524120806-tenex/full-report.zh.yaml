    rows:
      - - 核心安全平台
        - 希望标准化 Google SecOps、但不想全面外包的安全负责人
        - 当前 / 已明确销售
        - Google SecOps 实施、平台管理、检测内容、仪表盘、培训
        - 让买方先现代化工具，再决定是否投入完整 MDR
        - 除营销级描述外，没有公开 API 或实施手册
      - - 高级监督服务
        - 希望增加监控和威胁狩猎、但不想启用完整 MDR 的团队
        - 当前 / 已明确销售
        - 人工 + AI 威胁检测、威胁狩猎、调优、新兴威胁顾问
        - 在平台运营和全天候 MDR 之间做出中间层
        - 没有公开附加率、人员配置模型或按层级拆分的结果基准
      - - 综合 MDR
        - 外包 24x7 监控、分诊和响应的组织
        - 当前 / 旗舰产品
        - 24x7x365 监控、AI + 人工分诊、补救、事件响应、客户成功
        - 最完整地呈现 Tenex 作为运营型 SOC 服务的定位
        - 公开证据主要是营销主张和少数案例，缺少广泛客户样本
      - - 威胁管理
        - 需要主动降低漏洞和风险的安全团队
        - 更大服务阶梯中的能力层
        - 漏洞评估、威胁情报集成、风险缓解计划、持续评估
        - 把 Tenex 从被动告警处理扩展为更宽的安全服务
        - 公开文档没有拆清哪些是产品化能力、哪些由分析师交付
      - - 安全自动化
        - 希望降低分析师琐事、加快响应的团队
        - 叙事很强但技术文档有限的能力层
        - 自动化检测与响应工作流，跨 300+ 工具编排
        - 把 AI 原生叙事连接到真实工作流压缩和规模化
        - 除案例引用外，没有公开连接器目录、工作流构建器文档或执行防护
      - - 事件响应 + 客户成功
        - 需要遏制、报告和持续指导的客户
        - 当前 / 明确打包
        - 自动遏制、事件消除、事后报告、具名客户成功
        - 让 Tenex 看起来更像结果型服务，而不只是告警叠层
        - 公开的可靠性、服务补偿和历史达成率数据仍然薄弱
