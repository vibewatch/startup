  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 月度 ARR / 收入桥、经常性与项目收入组合、NRR / GRR、队列留存
        - 决定 Tenex 应拿软件式还是服务式倍数
        - 财务 + CEO 数据室
      - - 利润率证明
        - 套餐级毛利率、分析师生产率、自动化提升、单客户服务工时
        - 乐观情景取决于真实交付杠杆
        - 财务 + 运营复核
      - - 股权结构表
        - 所有权、清算堆叠、参与权条款、投资人权利、员工稀释
        - 下行回收和下一轮经济性取决于优先权包袱
        - 法务 + 董事会材料
      - - 现金与跑道
        - 现金余额、烧钱速度、招聘计划、预算敏感性、按地区拆分的扩张支出
        - Series B 轮规模本身不能证明融资独立性
        - 财务模型复核
      - - 客户耐久性
        - 客户数、前十大集中度、合同条款、续约和扩张行为
        - 小而集中的客户基础会快速打穿估值
        - 销售运营 + 客户成功复核
      - - 独立证明
        - 客户访谈、KPI 定义、第三方验证、安全结果方法论
        - 需要检验 AI / 原生主张能否越过营销层面
        - 客户尽调 + 技术尽调
    notes: 每个尽调项都直接对应估值决策，而不是泛泛好奇。如果管理层答不上来，建议不应上调。
    claimRefs:
