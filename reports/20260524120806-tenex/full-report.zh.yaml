      - - AI 智能体生产力
        - 驱动
        - 近期
        - AI 辅助分诊和调查能放大分析师杠杆，告警量高的场景尤其明显
        - 要求提供人类监督和可衡量准确率证据，而不只看自动化口号
      - - 欧盟监管和 AI 治理
        - 驱动与约束
