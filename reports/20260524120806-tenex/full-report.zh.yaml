      - number: '3.3'
        title: 既有厂商与替代压力
        blocks:
          - type: paragraph
            body: >-
              Tenex 最大的战略威胁，不是另一家喊“AI SOC”的创业公司，而是既有平台的引力。CrowdStrike 的 Falcon Complete 把 MDR 与全球规模化 Falcon
              平台配对，披露公有公司指标：$5.25 billion ARR 和 $1.31 billion 季度收入，甚至有公开 AWS 上架信息，价格点为 $325.36，最低门槛 299 个端点。Palo Alto
              从另一个角度呈现同样模式：Unit 42 MDR 建在 Cortex XDR 之上，XSIAM 推出 AI 驱动 SOC 平台并展示强自动化指标，Prisma Cloud 把覆盖从代码延伸到云，公司报告 $6.3
              billion 下一代安全 ARR。对买家来说，这些捆绑包能简化供应商数量、采购和高管舒适度。它们也给 Tenex 制造替代路径：内部运营平台，稍后增加供应商托管层，或在端点、云、身份、网络和 SOC
              之间留在单一大型安全厂商。Tenex 在这里有一个合理切口，因为并非每个买家都想吞下既有厂商平台栈。已经对齐 Google SecOps 的组织，可能更偏好专业服务商来运营并优化该环境，而不是替换它。但同样以
              Google 为中心的定位也有两面性。它强化了 Tenex 对某类买家的适配，同时放大了对 Tenex 无法完全控制的合作伙伴生态的依赖。
