  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及为什么标题价格跑在公开 KPI 之前
        blocks:
          - type: paragraph
            body: >-
              Tenex 确实有融资动能，但估值故事仍更多是投资人给出的价格发现，而不是披露经营指标后的价格发现。公开融资记录在轮次规模上很强：Tenex 在 2025 年正式宣布 $27 million Series
              A，并在 2026-03-31 宣布 $250 million Series B；Bloomberg 报道称，最新一轮对公司的估值超过 $1
              billion。这意味着外部投资人在约七个月内接受了极陡的估值跃升；在任何未定规模的 DTCP 追加投资之前，公开披露的优先资本底线已至少为 $277 million。证据也指向真实商业牵引：Eric
              Foster 告诉 Business Observer，Tenex 在 2025 年 3 月拿下首份合同，并在随后一年达到 $25 million 签约收入；独立报道则把激进扩张至 300 人计划之前的员工数放在
              73 到约 100 人之间。问题在于公开材料仍没有说明什么。没有公开 ARR、NRR、毛利率、烧钱速度、现金余额或客户集中度披露，连 DTCP 追加投资金额也未披露。在当前超过 $1 billion
              的标题价格下，这些指标的缺失比融资本身更重要，因为入场经济性如今取决于公司到底是在成熟为具备软件质量的经常性收入资产，还是只是一个快速增长、募资叙事异常强的托管服务业务。
