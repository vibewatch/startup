      - - 在分析师耗尽前减轻告警疲劳
        - 分析师需要在割裂工具中手工分拣大量告警队列
        - 人工复核前，AI 先预分诊、打分、排序并拼好上下文
        - Tenex 称每条告警都在一分钟内完成分诊，覆盖率 100%
        - 速度和覆盖率说法主要来自公司披露，缺少独立基准
      - - 不按比例加人，也能找出更高价值威胁
        - 高级分析师把时间耗在追噪音上，而不是主动狩猎
        - Advanced Oversight 在平台运营之上叠加狩猎、复核和咨询支持
        - 公开定位是 AI 处理重复工作，人类专注判断和狩猎
        - 未公开利用率、队列深度或分析师 / 客户配比
      - - 快速遏制已确认事件
        - 在安全工具和 IT 团队之间手工升级
        - 自动化遏制处置剧本，加上分析师指导的修复和事件响应
        - Sunrun 案例研究称，告警量下降 97%，驻留时间降至 24 小时以内
        - 客户侧审批和变更控制延迟不计入 Tenex SLO
      - - 向董事会和运营团队证明服务有效
        - 从多个工具和供应商收集仪表盘
        - 仪表盘、报告、事后分析和具名客户成功管理
        - Ryan Swigler 的支持模型强调主动更新和可衡量结果
        - 公开材料尚未展示客户记分卡样例或 SLA 达成历史
    notes: 这些工作流条目混合了直接客户证据和 Tenex 自己发布的运营主张。有独立证据或客户背书时，收益最有力；只有供应商说法时，证据较弱。
