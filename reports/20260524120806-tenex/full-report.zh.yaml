      - number: '4.5'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但谨慎的财务结论。Tenex 不是产品前阶段故事：它完成了非常大的 Series B，有公开合作伙伴和客户证明，也有足够自报牵引，让人相信公司正在 AI 原生 MDR
              中找到真实需求。但本章不支持把它按透明软件复利资产来承销。公开材料没有美元定价、ARR、NRR
              或留存数据，没有确认收入桥接，没有披露毛利率，也没有公开现金或烧钱速度披露。可比组重要，因为它框定了差距。公开网络安全龙头显示，优质软件经济性可能成立；Rapid7 则显示，MDR
              相邻动作仍可能受资本约束且增速更慢。Tenex 最终可能因为 AI
              降低交付成本而配得上溢价，但今天的公开证据只证明融资能力和品类兴趣，尚未证明耐久收入质量。因此，我的财务结论是：需求形成和短期资本可得性为正面，但已实现定价、队列留存、毛利率结构和现金跑道，仍依赖管理层尽调。
