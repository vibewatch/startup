      - number: '3.4'
        title: 持久性、切换成本与仍需证明的内容
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Tenex 有可信的定位切口，但还没有证明护城河。好消息是市场背景有吸引力：MarketsandMarkets 和 Mordor 都显示云交付 MDR
              品类快速增长，独立来源也强调同样的结构性需求驱动——告警过载、人才稀缺，以及向 AI 辅助 SecOps 迁移。Tenex 还受益于高端既有厂商的一个真实弱点：外部评论来源显示，Falcon Complete
              广受尊重，但仍因成本被批评；整个品类的公开价格透明度也很低。若挑战者能证明更好 ROI、更清晰包装或更低摩擦部署，窗口就存在。更难的是持久性。公开来源尚未证明 Tenex
              能大规模替换既有厂商、嵌入后留住客户，或守住 Google 优先模型，抵御同样强调集成和人类验证 AI 的对手。多归属在技术上看似可行，因为许多厂商支持开放生态；但 CrowdStrike 和 Palo Alto
              的平台原生捆绑包，能通过运营便利和数据引力持续抬高切换成本。因此，本章核心尽调结论很实际：Tenex 的竞争故事可信到值得继续跟进，但在管理层提供定价、竞争胜率、客户推荐，以及 Tenex 成为客户 SecOps
