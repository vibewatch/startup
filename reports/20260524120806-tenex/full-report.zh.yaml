      - number: '7.4'
        title: 执行与财务风险：估值已经假设一条公开证据尚未完全挣到的证明曲线
        blocks:
          - type: paragraph
            body: >-
              最后一个主要风险桶是人才加融资。公开资料显示，2026 年春 Tenex 员工接近 100 人；管理层和媒体资料则讨论年内招聘 250 到 300
              人。招聘页面表明，这不是松散的远程扩张，而是以现场办公为先、重度搬迁的运营模型，分布在三个美国枢纽，同时公司还推进 EMEA。这种模型如果跑通，能形成更强文化和更快学习；但它也会在 Tenex 最需要稀缺
              AI、安全、数据、销售和客户成功人才的时点收窄招聘漏斗。Bashar Abouseido、Ryan Swigler 和 Piers Morgan
              等领导层补强是正向缓释项，但也抬高了门槛：投资人承保的已不再是草莽试点团队，而是一家向受监管企业市场兜售就绪度的公司。更高门槛之所以重要，是因为据报道 Series B 已把 Tenex 估值推到 $1
              billion 以上，而 ARR、NRR、毛利率、烧钱速度和客户集中度仍未披露。公开证明仍围绕少数具名案例和自报指标。因此，我的财务结论不是 Tenex
              缺少动能，而是这份动能的价格已经很高；如果私下尽调不能迅速补上留存、经审计自动化质量、多元客户证明和招聘效率缺口，投资逻辑就会破裂。
