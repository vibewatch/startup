      - number: '2.3'
        title: 买家、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向多方参与的采购，而不是单一终端用户交易。Gartner 把 MDR 评估框定为网络安全领导者的决策；Payabli
              案例则显示，日常拥护者可以在安全和合规团队，即便商业理由更宽，落在运营赋能上。大型企业里，运营买家通常是 CISO、安全运营负责人或安全工程负责人；用户群是 SOC 或负责响应的精简团队；一旦合同进入 24/7
              服务或平台整合范围，经济签字往往需要 CIO 或 CFO 支持。


              采用路径同样重要。Tenex 从 Google SecOps 平台管理，到 Advanced Oversight，再到完整 MDR
              的阶梯说明，许多客户一开始不会把所有事情外包。客户先现代化平台，再加专家眼睛，信任建立后才转向完整响应所有权。这个模式大概率更适合中端市场和企业买家，而不是最小 SMB。即便面向 SMB 营销的 AWS 打包
              CrowdStrike 方案，也有 299 个端点的最低门槛；评论来源仍把按端点计费列为反复出现的异议。因此，Tenex
              最合适的切口不是通用小企业安全，而是云原生和受监管买家：它们有足够遥测、人员痛点和复杂度，愿意为运营结果付费，而不只是再买更多工具。
