      - number: '8.2'
        title: 可比框架：网络安全高溢价倍数确实存在，但要靠披露和软件经济性挣来
        blocks:
          - type: paragraph
            body: >-
              Tenex 正确的可比框架不是「网络安全很热，所以 $1 billion 没问题」。公开可比公司显示，安全公司可以获得溢价估值，但区间极大，并与收入质量、披露、利润率结构和平台宽度紧密相关。CrowdStrike
              在 FY2026 结束时收入 $4.81 billion、ARR $5.25 billion、GAAP 订阅毛利率 78%；Palo Alto Networks 指引 FY2026 收入约 $11.3
              billion，交易规模也大得多。SentinelOne 提供了规模较小但仍由软件驱动的基准：FY2026 收入 $1.001 billion、ARR $1.119 billion、GAAP 毛利率
              74%。Rapid7 是警示锚点：它在 2026 年 Q1 仍产生 $832 million ARR 和正自由现金流，但 ARR 收缩后，公开市场只给了约 $0.48 billion 市值。用简单的市值 /
              收入代理指标看，区间从 Rapid7 约 0.6x 到 CrowdStrike 约 35.1x，SentinelOne 约 6.4x，Palo Alto 约 18.7x。Tenable、CyberArk 和
              Zscaler 也说明，即使同在安全领域，公开估值也会随品类位置和增长质量大幅分化。Tenex 的挑战在于，当前公开套餐组合看起来比这些软件领导者更偏服务；而它最强的收入数据点，是创始人报告的签约收入，不是已披露
              ARR。这不意味着故事不可能成立；它意味着管理层要证明溢价倍数，负担仍在前面，而不是已经完成。
