  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与 Tenex 位置
        blocks:
          - type: paragraph
            body: >-
              Tenex 首先应对标运营交付的安全结果，而不是每一个提到 AI 的安全软件 SKU。它自己的公开阶梯从 Google SecOps 平台管理起步，叠加人类 + AI 监督层，最后到完整托管 MDR 层，覆盖
              24x7x365 监控、修复和响应剧本。这意味着最直接的同行，是销售外包安全运营的服务型 MDR 供应商，而不是只卖软件分析的厂商。从这个视角看，Arctic Wolf、Expel 和 Deepwatch
              是最干净的直接对照，因为三者都营销一套组合：常开监控、威胁狩猎、专家分析师和 AI 增强运营。CrowdStrike 和 Palo Alto Networks 同样重要，但它们是既有混合型厂商：两者把 MDR
              或托管服务，与宽平台、公有公司规模和更强品类认知结合起来。这些厂商可以用一个捆绑包满足同一买家需求，把平台标准化与托管响应接在一起。因此，替代集合比直接同行更宽。买家也可以把 SecOps 留在内部，在
              Google SecOps、XSIAM 或 Prisma 中心栈上运营，或使用绑定这些平台的托管服务伙伴。结果是，Tenex 争夺的不是通用网络安全预算，而是云原生组织内部的运营型 SOC
              层；买家在专业服务商、既有厂商捆绑包和内部自建之间选择。
