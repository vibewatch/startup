            title: 当前价格已经假设一条尚未公开的证明曲线
            body: 超过 $1 billion 的估值，是创始人报告签约收入底线的 40x 以上。只有 Tenex 迅速证明经常性收入质量、利润率杠杆和集中度韧性，这个价格才跑得通。
