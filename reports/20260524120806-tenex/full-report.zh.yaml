      - number: '1.3'
        title: 融资形成、利益相关方图谱与规模信号
        blocks:
          - type: paragraph
            body: >-
              Tenex 融资推进异常快。发布材料披露 Andreessen Horowitz、Shield Capital 和天使投资人参投，但未披露种子轮规模。到 September 2025，公司宣布由
              Crosspoint Capital Partners 领投的 $27 million Series A，随后通过 October 和 December 的追加投资发布稿，把 DeepWork
              Capital、Florida Opportunity Fund 和 DTCP 的融资直接连接到 Sarasota 和 EMEA 扩张。March 31 2026，公司宣布由 Crosspoint 领投的
              $250 million Series B，Bloomberg 和 Tech Funding News 报道估值超过 $1 billion。由于种子轮金额仍未披露，后续 2025 交割又被表述为同一 Series
              A 的追加投资，最稳妥的公开说法不是精确累计融资，而是：未计入任何种子轮资金、老股交易或债务之前，已披露资本下限为 $277 million。


              商业规模方向上强，但数字不整齐。官方发布稿称，Tenex 在前六个月收入超过 $10 million，在前三个季度收入超过 $18 million；SC Media 和 Business Observer 则把
              spring 2026 前后的签约收入放在大约 $25 million。员工数更不规整：BankInfoSecurity 称 March 31 有 73 名员工，Business Observer 称大约
              100，管理层则谈到 2026 年招聘 250 to 300 人。这些不一致不会抹掉增长势头，但意味着本章应保留区间和注脚，而不是假装精确。更持久的信号是，Crosspoint 已成为关键财务赞助方，而
              Google、Microsoft 和区域投资人关系，对公司扩张方式具有战略重要性。
