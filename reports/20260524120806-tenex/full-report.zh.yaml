            body: >-
              Tenex 的公开定位暗示一种混合成本结构：大量服务人工、持续工程建设、云平台管理，以及旨在随时间压缩增量交付成本的自动化。公司承诺 24/7 监控、具名客户支持、事件响应和平台管理，同时招聘软件工程师、AI
              工程师、数据科学家和轮班 SOC 人员。只有自动化叙事为真，这种组合才会带来有意义的运营杠杆。管理层和投资人认为确实如此。Tenex 声称可在 1 分钟内分析全部告警遥测，跨 300
              个以上工具编排动作，并大幅减少误报；Crosspoint 更进一步，认为因为 AI
              减少被人工困住的成本，这个模型能产出优于传统软件的毛利率。投资人不应按字面承销这一说法。公开可比公司结果显示，耐久网络安全经济性一旦披露是什么样子：CrowdStrike 和 SentinelOne 维持 70%
              中段到高段毛利率，Palo Alto 指引强运营和自由现金流利润率，Rapid7 则显示 AI-SOC 叙事并不能阻止 ARR 走平。Tenex 可能正在搭建更好的服务毛利模型，但公开证明仍缺席。
