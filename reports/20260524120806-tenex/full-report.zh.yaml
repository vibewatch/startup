  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    columns:
      - 触发因素
      - 门槛 / 证据
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量未落地
        - 无可信 ARR / NRR / GRR 披露，或尽调中经常性收入组合仍显项目化
        - 软件式倍数支撑逻辑会被打穿
        - 按当前价格，从继续研究降为回避
      - - 自动化经济性弱于声称
        - 套餐级毛利率和分析师生产率数据未显示真实杠杆
        - 乐观情景失去支撑溢价估值的核心理由
        - 重估到服务偏重的可比区间
      - - 集中度过高
        - 前十大客户或合作渠道贡献过大收入占比，续约证明偏弱
        - $25M 牵引力信号会变得脆弱且波动
        - 要求更强下行保护，或直接放弃
      - - 扩张带来的成本快于耐久收入
        - EMEA 建设和招聘计划扩大烧钱，但经常性、高质量收入没有同步上台阶
        - 压缩现金跑道，抬高下一轮下调估值风险
        - 假设下一轮偏防御，而非增厚价值
      - - 安全板块倍数体系下移
        - 公开安全可比公司继续向 Rapid7 / 中低盘区间压缩
        - 即便执行不错，溢价入场价也可能吞掉回报
        - 立即按更低退出倍数重新承销
    notes: 这些是可衡量的叫停标准，不是泛泛风险。每一项都会直接改变估值支撑，而不只是影响经营舒适度。
