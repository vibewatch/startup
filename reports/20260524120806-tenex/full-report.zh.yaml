      - - 基准
        - 收入达到约 $60M-$80M，服务 / 软件属性混合，利润率只有部分证明
        - 8x-12x，更接近公开安全可比公司的中段
        - $480M-$960M
        - 约 0.5x-1.0x
        - 当前最符合公开证据的情景
      - - 悲观
        - 类收入规模停在约 $35M-$50M，留存不及预期，或安全板块倍数压缩
