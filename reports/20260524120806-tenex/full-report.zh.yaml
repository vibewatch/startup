      - number: '6.3'
        title: 耐久性与扩张：账户经营意图清楚，但公开续约和集中度披露几乎为空
        blocks:
          - type: paragraph
            body: >-
              售后动作在概念上很强，证据却很薄。Tenex
              已经做了组织配置来传递账户扩张信号：任命专职客户成功副总裁，称每个项目都有具名客户成功覆盖，并把成功定义为主动沟通、可衡量结果和基于信任的扩张。套餐阶梯也给出了可信的增购路径：从平台管理走向完整 MDR；SC
              Media 称最新融资将支持更多集成和伙伴增长。这些都可能成为净留存的基础。但它们不等于净留存。本轮公开资料没有披露
              NRR、GRR、客户流失、续约率、合同期限、平均合同价值，或按套餐划分的客户数。也没有资料披露头部客户集中度、生态集中度，或直营模式与伙伴模式哪一个贡献更多订单额。结果是，战略逻辑很强，但耐久性仍难承保。买方可以相信
              Tenex 想在账户内扩张，也为此设计了动作；但仅靠公开材料，买方仍无法判断平均客户会续约、扩张，还是在初始实施和早期效果期后悄悄离开。
