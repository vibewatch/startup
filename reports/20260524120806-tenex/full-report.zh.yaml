      - number: '8.5'
        title: 建议、最终尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              我的建议是继续研究，置信度中等，风险高；按当前标题价格看，估值立场偏高。我不会只凭公开证据领投，因为数据集对公司的支撑强于对价格的支撑。正确姿态应对价格敏感、对证据敏感：如果公司能开放数据室，说明经常性收入质量、股权结构条款、烧钱速度和集中度，就继续跟进；如果管理层要求投资人接受溢价倍数，却不展示这些基础数据，就退出。最重要的尽调问题是实操性的，而非理论性的：月度收入和
              ARR 桥、队列留存、套餐层面毛利率、现金和现金跑道、招聘经济性、客户集中度，以及精确的优先股堆叠。这些项目直接决定 Tenex
              是否应位于公开可比公司光谱的上半区，还是应被标在更偏服务或增长较慢的安全公司附近。如果公司无法证明多元化经常性收入，或自动化经济性弱于销售故事，或 EMEA
              与渠道扩张增加成本的速度快于增加耐久收入的速度，又或者下一轮私人或公开可比重置把可接受安全倍数大幅拉低，投资逻辑就会破裂。在这些问题回答之前，有纪律的做法是让 Tenex
              在尽调中保持主动，而不是在价格上保持主动。
