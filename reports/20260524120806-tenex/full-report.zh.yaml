      - number: '2.2'
        title: 规模测算视角与钱在哪里
        blocks:
          - type: paragraph
            body: >-
              公开市场规模故事有吸引力，但并不精确。MarketsandMarkets 预测 MDR 在 2026 年为 USD 6.28 billion、2031 年为 USD 19.01 billion；Mordor
              Intelligence 则估计 2026 年为 USD 5.09 billion、2031 年为 USD 13.45 billion。差异并不小；这意味着公开 TAM 工作高度依赖各发布方如何处理云安全、托管
              XDR 和服务包装等相邻支出。因此最稳妥的外部结论，是把 2026 TAM 看作大约 USD 5.1 billion to USD 6.3 billion 的区间，而不是一个激进的单点数字。


              在这个区间内部，若干集中信号比头部 TAM 更清晰。云交付 MDR 已是主导架构，大型企业仍贡献大部分当前支出，BFSI 仍是最大单一垂直。增长并不均匀：中小企业、医疗健康、MXDR
              和亚太都比体量更大或更成熟的同类增长更快。若把 Mordor 的云份额数据套到公开 TAM 区间，仅云交付代理口径就已经大约 USD 3.6 billion to USD 4.4 billion。对 Tenex
              来说，这比整体市场更有参考价值，因为公司的公开姿态是云原生、以超大规模云厂商为中心且 AI 主导。含义是：Tenex 不需要拿下整个 TAM 才能证明相关性，但投资人应保留不确定性，因为没有公开来源能干净隔离出
              Google 锚定或 AI 原生供应商的 SAM。
