      - number: '8.3'
        title: 乐观、基准与悲观：有吸引力的回报大多仍存在于未来证明曲线，而不是今天的证据
        blocks:
          - type: paragraph
            body: >-
              敏感性数学是保持纪律最清楚的理由。如果 Tenex 已经价值超过 $1 billion，那么公司需要大约 $200 million 的类收入规模才能以 5x 支撑该价格；8x 需要 $125
              million，10x 需要 $100 million，12x 需要 $83 million，15x 需要 $67 million。这些目标长期看并非不可能，但远高于当前公开收入底线。合理的乐观情景是，Tenex
              能把早期 $25 million 签约收入信号转化为约 $100 million 到 $140 million
              的经常性质量收入，同时证明自动化确实降低交付成本，且欧洲加渠道伙伴是在拓宽需求，而不只是拓宽支出。这可能支撑约 $1.2 billion 到 $2.2 billion
              的区间，也是当前入场价格开始显得有吸引力的第一块区域。基准情景没那么宽容：如果 Tenex 达到约 $60 million 到 $80 million 经常性质量收入，并配得上 8x 到 12x
              倍数，隐含价值只有约 $480 million 到 $960 million；相对当前标题估值最好也只是持平，仍有下行。悲观情景更严厉，但与证据一致：如果类收入规模停在约 $35 million 到 $50
              million，市场把公司按增长较慢或偏服务的安全厂商定价，价值会压缩到约 $105 million 到 $250 million。换句话说，当前价格是在提前支付公开证据尚未交付的证明。
