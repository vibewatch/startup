              Tenex 销售的是结果导向的托管安全服务栈，而不是透明软件价目表。公开商业页面持续呈现三个层级：Core Security Platform 负责实施和运行 Google
              SecOps，但不含完整监控；Advanced Oversight 叠加人类与 AI 威胁复核和狩猎；Comprehensive MDR 则包含 24x7x365
