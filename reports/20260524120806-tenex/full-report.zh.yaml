  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类迁移
        blocks:
          - type: paragraph
            body: >-
              Tenex 不应拿来对标所有网络安全支出，也不应对标所有 AI 安全支出。最清晰的公开定义来自 Gartner 的市场指南摘要：MDR 是远程交付、人主导、即插即用的现代 SOC
              功能，目标是打断并遏制网络攻击。这个定义把核心市场限定在托管检测、调查、威胁狩猎、遏制和响应工作上。也就是说，若干相邻预算不应进入头部 TAM：没有运营响应的独立 SIEM、SOAR 或 XDR 许可证，通用
              MSSP 监控，以及一次性事件响应咨询，都有商业意义，但它们是替代项或邻近项，不是 Tenex 正在销售的直接市场。


              同时，品类正在扩张。Cyberproof、Google Cloud 和 PwC 都在描述一场迁移：SOC 工作从手工或规则驱动，转向 MXDR、AI 辅助分流和智能体 SecOps。Tenex
              自身包装对这种融合表达得很直接，因此这一点重要。公司同时销售 Google SecOps 平台管理、人类 + AI 监控覆盖层，以及完整 24x7 MDR 层。所以正确的市场框架既不是商品化 MSSP
              监控，也不是纯安全软件，而是正在成形的托管 SecOps / AI 原生 MDR 切口：平台运营、编排和结果所有权一起销售。
