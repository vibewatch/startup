      - number: '5.3'
        title: 部署与集成：Google 证据最强，跨 Microsoft、AWS、CrowdStrike 和其他伙伴的广度也可信
        blocks:
          - type: paragraph
            body: >-
              Tenex 最清晰的产品强项不是公开自有控制台，而是声称能深度嵌入企业已在使用的主要安全生态。Google 是目前证据最足的一面。Tenex 在合作伙伴和产品页面中点名 Chronicle 或 Google
              SecOps、Mandiant intelligence、Gemini、仪表盘、剧本、摄取管线和持续调优。但集成面不止 Google。公开技术页面还点名 Microsoft Defender、Sentinel 和
              Entra ID；AWS Security Lake 和 GuardDuty；CrowdStrike Falcon；以及
              Wiz、WitnessAI、SentinelOne、Horizon3、Thinkst、Sublime Security 和 Flashpoint 等合作伙伴技术。这种广度重要，因为它支撑了公司叙事：Tenex
              是超大规模云厂商原生，且能编排 300 个以上工具，而不是只包住一个 SIEM。它也制造了真实依赖风险。Tenex
              的交付模型依赖客户遥测质量、客户自有或合作伙伴自有平台，以及第三方集成稳定性。公开页面证明生态对齐和服务经验；它们还没有证明，一旦主要伙伴改变经济性、路线图或访问模式，Tenex 的编排层仍然可移植、API
              优先或具备独立可防守性。
