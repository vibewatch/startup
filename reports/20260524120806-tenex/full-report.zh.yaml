      - number: '3.2'
        title: 直接同行对比与买家标准
        blocks:
          - type: paragraph
            body: >-
              直接同行之争，核心在运营模型、覆盖广度、包装清晰度和执行信任。Tenex 营销一个格外明确的阶梯：从 Google SecOps 平台管理，到 Advanced Oversight，再到完整
              MDR。这对想先现代化工具、再外包每个响应决策的团队有吸引力。Expel 包装也清楚，有 Starter、Select 和 Premium 捆绑包，但强调 Workbench 透明度和 160 个以上集成，而不是
              Google 中心控制平面。Arctic Wolf 更强调管家式运营模型和 Aurora Agentic SOC 主张，把超过 10,000 个环境、超过 1,000 名安全专家和超过 200
              个集成，与更低攻击频率和严重度的叙事配对。Deepwatch 的主张更接近网络韧性即服务，结合具名专家、动态风险评分和强 ROI 话术。共同点是，人类 + AI 语言如今到处都是。CrowdStrike
              谈人在环路中的智能体 MDR，Arctic Wolf 强调人在环路中的有边界自治，Deepwatch 称 Precision MDR 统一 AI 与人类专家，Google 和 PwC 也都把智能体 SecOps
              描述为分析师增强而非替代。这降低了 Tenex AI 原生品牌的新颖性。要赢，Tenex 需要让买家相信，它的 Google
              原生服务设计和分阶段包装，能产出可衡量的更好结果、更容易采用或更优经济性，而不只是和其他服务型对手一样讲 AI。
