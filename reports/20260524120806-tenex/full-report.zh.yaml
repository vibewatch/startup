  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Tenex 实际交付什么：分层托管 SecOps 服务，而不是盒装产品套件
        blocks:
          - type: paragraph
            body: >-
              公开产品表层比泛泛的 AI-SOC 营销页更清楚，但仍更偏服务而非软件。Tenex 一直把自己描述为 AI 原生、人主导的托管检测与响应供应商；它的商业包装最终呈现为三步阶梯，而不是一长串单独定价的产品。Core
              Security Platform 是 Google SecOps 的实施和管理层，不含持续监控；Advanced Oversight 加入人类与 AI 威胁检测、狩猎、调优和顾问支持；Comprehensive
              MDR 增加 24x7x365 监控、分流、修复、事件响应、自动遏制剧本、事件后报告和白手套式客户成功。威胁管理、安全自动化和事件响应页面最好理解为这套阶梯中的能力视角，而不是独立 SKU
              的证据。这一点重要，因为客户要完成的是运营任务：让现代 SecOps
              栈上线、减少告警噪声、获得全天候覆盖，并从拥有平台转向获得平台结果。上行空间在于，公司有一条从平台管理到完整运营响应的连贯服务升级路径。下行问题是，公开材料仍没有展示模块化 API 产品、离散用量计费组件，或
              AI 层、编排层和人类交付层之间足够详细的技术边界。
