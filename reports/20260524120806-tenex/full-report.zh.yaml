  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 细分组合：公开口径覆盖很广，但公开证据最契合运行合作伙伴安全栈的受监管企业买家
        blocks:
          - type: paragraph
            body: >-
              Tenex 公开呈现的客户分层，理论上很宽，硬证据却窄得多。公司把产品打成三档，对应不同买方需求：一类买方想把 Google SecOps 跑起来，但不想全外包；中间档买方需要更多人工和 AI 共同盯防；完整
              MDR 买方则要 24x7 监控和响应。官网「关于我们」称，公司可服务从 SMB 到 Fortune 500 企业的客户；Eric Foster 则告诉 Business
              Observer，商业甜点区在金融服务，尽管客户横跨零售、制造、政府和科技。Series B 和 EMEA 新闻稿也把 Tenex 明确放在 Google 与 Microsoft
              生态里的企业级市场。实际读法是，付款方和高管赞助人通常是安全负责人或合规负责人，日常用户是内部 SOC
              或安全运营团队；服务也常卖给已经标准化使用超大规模云厂商或主要安全厂商工具的账户。渠道形态同样关键：Tenex 公开招募 MSP、VAR
              和分销商，获客并非纯直营。覆盖面因此变宽，但仅靠公开材料，更难判断直接终端客户能见度和利润质量。
