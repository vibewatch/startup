            body: >-
              后续章节可以锚定一条清晰的公开时间线：December 2024 备案、January 2025 发布、March 和 April 2025 领导层补强、September 2025 Series
              A、October Sarasota 全球总部公告、December 获 DTCP 支持的 EMEA 扩张，以及 March 31 2026 Series B 和 Bashar 任命。公开证明点也显示，Tenex
              并非只发布愿景材料，而是在真实企业环境中运营。BankInfoSecurity 记录了 Payabli 的 Google SecOps 部署：Tenex 是 MDR 合作伙伴，大约一周上线；Tenex 自己的
