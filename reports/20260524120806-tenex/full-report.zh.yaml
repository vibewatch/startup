    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、成立与服务模型
        blocks:
          - type: paragraph
            body: >-
              Tenex 最准确的定义，是一家私营 AI 原生托管检测与响应公司，对外称自己是“AI SOC 公司”。最干净的时间线不是营销文案，而是法律成立记录：佛罗里达州记录显示，Tenex Security, Inc.
              作为特拉华州外州公司于 2024-12-13 备案，随后公司于 2025-01-20 走出隐身并公开发布。之后的运营叙事基本一致。Tenex 称，公司要分流每一条告警、调查每一个威胁，把 AI
              速度和可追责的人类分析师结合起来，而不是销售一个独立安全产品。


              商业模型也更像是包在超大规模云厂商安全栈外的一层服务，而不是传统软件 SKU。定价页面展示三级阶梯：从 Google Cloud Security Platform as a Service，到 Advanced
              Oversight，再到完整 Comprehensive MDR；发布材料还称，定价可随客户云安全平台支出扩展。这一点很重要，因为 Tenex 同时把平台运营和结果导向的 MDR 变现。公司重心在 Google
              取向材料里尤其清晰：Tenex 反复强调 Google SecOps 深度、Microsoft 兼容性，以及跨 300 个以上工具的编排。实操上，本章应把 Tenex 视为一家快速扩张的 AI
              原生安全服务公司；它的公开故事建立在超大规模云厂商运营能力上，而不是单一打包软件产品上。
