        - 把 EMEA 扩张计划视为愿景，而非可执行方案
      - - 客户证明深度
        - 留存和客户背书包
        - 仍只有一个强独立具名部署，且没有 NRR / 流失披露
        - 拒绝溢价估值倍数，或要求基于里程碑的结构
      - - 招聘和文化执行
        - 招聘生产率和流失率
        - 现场办公优先模型下，招聘目标落空、流失率上升或交付延迟
        - 重置增长和利润率假设；关注服务质量下滑
      - - 估值预期错配
        - 收入质量桥
        - 在没有经审计 ARR、利润率或集中度可见性的情况下，超过 $1B 的定价仍持续
        - 假设价格有下行空间，并要求更多投资人保护或推迟承诺
    notes: 阈值是投资把关启发式，而非已观察到的经营结果。它们把公开风险档案转成尽调检查点和投资逻辑破裂条件。
