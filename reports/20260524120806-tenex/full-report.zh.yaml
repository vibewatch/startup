  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高优先级风险图景：最难的失败模式不是需求不足，而是 AI 控制叙事跑在公开证据前面
        blocks:
          - type: paragraph
            body: >-
              Tenex 的风险堆栈始于雄心与公开证明之间的不匹配，而不是市场缺失。公司确实踩在真实顺风上：ENISA 仍统计到数千起严重事件，NIS2 把强制网络控制扩展到关键行业，AI Act 也收紧了 AI
              系统的披露和治理预期。这些力量解释了 Tenex 为什么能吸引受监管买方和后期投资人。但它们也让粗糙证据更危险。Tenex
              的公开法律页面明确称，网络风险无法消除，网站也不提供担保；与此同时，公司又营销醒目的性能主张，例如 100% 告警覆盖、85% 自动分诊、误报减少
              98%。这并不必然矛盾，但它是尽调问题，因为已抓取材料没有包含经审计的方法、分母定义，或能把这些主张转化为可执行义务的企业合同语言。因此，我的严重性排序从监管和证明风险开始，并把它视为其他每项风险的乘数。如果
              Tenex 拿不出可信的 AI 治理包、隐私地图、事件报告工作流和 KPI 审计轨迹，那么客户扩张、估值支撑，甚至伙伴可信度，都会比收入叙事显示的速度更快下滑。
