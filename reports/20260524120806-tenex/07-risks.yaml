    {
      "id": "operational-and-model-reliability-risk",
      "title": "Operational risk: AI SOC upside is real, but suppression drift, tuning burden, and thin assurance can turn speed into hidden error",
      "body": "The strongest adverse evidence in this chapter is category-level, and it matters because Tenex sells directly into that category. Panther, Conifers, Prophet, and KuppingerCole all converge on the same uncomfortable message: AI SOC automation can be valuable, but only when it sits on top of mature detections, reliable data, continuous tuning, and explicit human accountability. Panther highlights the integration and tuning tax that demos often hide, plus suppression drift that can auto-close the wrong alerts. Conifers says static automation breaks under environmental change and often stops at shallow triage. KuppingerCole says a fully lights-out SOC is still unrealistic. Prophet says buyers should care more about breach handling than false-positive compression. Tenex does have real mitigations. Google frames agentic SecOps as human-controlled, Tenex publishes SLOs, and its DPA plus case-study language show some attention to process and guardrails. But the public trust surface is still thinner than a cautious enterprise buyer would want. I did not find a public status page, audit package, uptime history, or model-quality report that would let an investor distinguish durable control quality from fast early-stage storytelling. That pushes AI reliability and assurance maturity into the top tier of residual risk.",
