  topStrengths:
    - >-
      Tenex has an experienced founder bench with deep Google, Chronicle, Cyderes, and enterprise-security operating
      pedigree.
    - >-
      The company established unusually fast financing momentum, progressing from a $27M Series A to a $250M Series B
      and a reported unicorn valuation within about a year of launch.
    - >-
      The product and GTM story are concrete: a clear three-tier ladder from Google SecOps management to full MDR rather
      than a vague AI-security pitch.
    - >-
      Public evidence includes at least one strong independent named customer reference (Payabli) plus broader Fortune
      500 and Global 2000 traction claims.
  topRisks:
    - >-
      The reported >$1B valuation outruns the public KPI set; ARR, NRR, gross margin, burn, cash, and preference-stack
      detail are not disclosed.
    - >-
      Many headline performance and traction metrics are self-reported or unaudited, while named customer proof is still
      narrow.
    - >-
      Google-first positioning and partner-led distribution are a wedge but also a concentration risk if non-Google
      proof and channel economics stay thin.
    - Public disclosures conflict on headquarters and headcount, and governance/control detail remains sparse.
    - >-
      The hiring plan and operating scale-up are aggressive for a company that still has limited public evidence on
      delivery leverage and renewal durability.
  unresolvedGaps:
    - Exact ARR, NRR, gross margin, burn, cash runway, and package-level unit economics are not public.
    - >-
      Current customer count, concentration, renewal behavior, contract terms, and average contract value are not
      publicly disclosed.
    - >-
      Independent evidence on automation accuracy, service attainment, and outcome methodology remains limited relative
      to the strength of Tenex's marketing claims.
    - >-
      The public file does not fully resolve Google-versus-non-Google deployment mix, partner dependence, or ecosystem
      concentration.
    - Canonical headquarters wording, full board/control structure, and exact capital-stack terms remain unresolved.
