summary:
  headline: >-
    Tenex is a credible AI-native MDR operator with exceptional fundraising momentum and real early customer proof, but
    the public file is still too thin and too self-reported to justify conviction at a reported valuation above $1B.
  overallScore: 5.2
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
