      "id": "adoption-trajectory-and-named-proof",
      "title": "Adoption trajectory: early traction is real, but the public named-proof set is still small and uneven in quality",
      "body": "Tenex has enough public customer evidence to clear the “is anyone really using this?” bar, but not enough to imply broad referenceability. The strongest independent named proof is Payabli. In a BankInfoSecurity interview recorded at Google Cloud Next 2026, Payabli's security-compliance leader described Google SecOps deployed with Tenex as the MDR partner and said the environment went live in about a week. That is meaningful because it is a named operator speaking to a live deployment, not just a company press quote. Sunrun is the strongest quantified outcome story, but the source is a Tenex-produced case study, so it should be treated as supportive rather than independent proof. Onspring contributes a public supportive quote, yet again only on Tenex-hosted pages. Beyond named logos, the adoption trajectory is mostly proxy-based: first contract in March 2025, $25 million of contracted revenue in the first year, multiple Fortune 500 customers claimed by late 2025, and 318% year-over-year growth claimed in the Series B release. Those are useful traction signals, but they are not substitutes for a disclosed customer count, active-deployment count, or cohort-level proof of repeat spend.",
