      "id": "scenario-analysis",
      "title": "Bull, base, and bear: most of the attractive return still lives in a future proof curve, not in today\u2019s evidence",
      "body": "The sensitivity math is the clearest reason to stay disciplined. If Tenex is already worth more than $1 billion, then the company would need roughly $200 million of revenue-like scale to justify that price at 5x, $125 million at 8x, $100 million at 10x, $83 million at 12x, and $67 million at 15x. Those are not impossible targets over time, but they are far above the current public revenue floor. A sensible bull case says Tenex can convert the early $25 million contracted-revenue signal into roughly $100 million to $140 million of recurring-quality revenue while proving that automation genuinely reduces delivery cost and that Europe plus channel partners broaden demand rather than just broadening spend. That could justify a roughly $1.2 billion to $2.2 billion range, which is the first zone where the current entry starts to look attractive. The base case is less forgiving: if Tenex reaches about $60 million to $80 million of recurring-quality revenue and merits an 8x to 12x multiple, the implied value is only about $480 million to $960 million, which is flat at best and still downside at the current headline mark. The bear case is harsher but evidence-consistent: if revenue-like scale stalls around $35 million to $50 million and the market prices the company more like slower-growth or services-heavy security vendors, value compresses toward roughly $105 million to $250 million. In other words, the current price is pre-paying for proof that public evidence has not yet delivered.",
