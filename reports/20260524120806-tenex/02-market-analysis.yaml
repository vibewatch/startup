      "id": "sizing-lenses-and-where-the-money-sits",
      "title": "Sizing lenses and where the money sits",
      "body": "The public market-sizing story is attractive but not precise. MarketsandMarkets projects MDR at USD 6.28 billion in 2026 and USD 19.01 billion in 2031, while Mordor Intelligence estimates USD 5.09 billion in 2026 and USD 13.45 billion in 2031. Those are not small differences; they imply that public TAM work depends heavily on how each publisher treats adjacent spend such as cloud security, managed XDR, and service packaging. The safest external conclusion is therefore a range-based 2026 TAM of roughly USD 5.1 billion to USD 6.3 billion, not a single heroic number.\n\nWithin that range, several concentration signals are clearer than the top-line TAM. Cloud-delivered MDR is already the dominant architecture, large enterprises still supply most current spend, and BFSI remains the single largest vertical. Growth is not uniform: SMEs, healthcare, MXDR, and Asia-Pacific are each growing faster than their larger or older peers. If Mordor’s cloud-share data are applied to the public TAM range, the cloud-delivered proxy alone is already roughly USD 3.6 billion to USD 4.4 billion. That is the more relevant lens for Tenex than the whole market, because the company’s public posture is cloud-native, hyperscaler-centric, and AI-led. The implication is that Tenex does not need the whole TAM to justify relevance, but investors should preserve uncertainty because no public source cleanly isolates a Google-anchored or AI-native provider SAM.",
