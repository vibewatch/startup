  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Public evidence supports a fast-growing but definition-sensitive MDR / AI-SOC market: 2026 TAM ranges from roughly USD 5.1B to USD 6.3B, cloud delivery already dominates, and large enterprises still drive current spend while SMEs, healthcare, and Asia-Pacific grow faster. Demand is pushed by threat pressure, staffing gaps, insurance and regulatory pressure, and AI-enabled SOC tooling, but restrained by trust, integration, sovereignty, and price-floor issues. For Tenex, the credible wedge is not all cybersecurity spend but cloud-native managed SecOps and MDR budgets where Google-anchored operations, AI triage, and human accountability matter."
  },
  "sections": [
    {
      "id": "market-boundary-and-category-shift",
      "title": "Market boundary and category shift",
      "body": "Tenex should not be benchmarked against all cybersecurity or all AI-security spend. The cleanest public definition comes from Gartner’s market guide abstract, which describes MDR as remotely delivered, human-led, turnkey modern SOC functions aimed at cyberattack disruption and containment. That definition keeps the core market centered on managed detection, investigation, hunting, containment, and response work. It also means several adjacent budgets should stay outside the headline TAM: standalone SIEM, SOAR, or XDR licenses without operated response, generic MSSP monitoring, and one-off incident-response consulting all matter commercially, but they are substitutes or adjacencies rather than the direct market Tenex is selling into.\n\nAt the same time, the category is expanding. Cyberproof, Google Cloud, and PwC all describe a shift from manual or rule-bound SOC work toward MXDR, AI-assisted triage, and agentic SecOps. That matters because Tenex’s own packaging is unusually explicit about this convergence. The company sells Google SecOps platform management, a human-plus-AI monitoring overlay, and a full 24x7 MDR layer. So the right market frame is neither commodity MSSP monitoring nor pure security software. It is the emerging managed-SecOps / AI-native-MDR wedge where platform operation, orchestration, and outcome ownership are sold together.",
