      "id": "operating-model-and-customer-workflow",
      "title": "How the operating model appears to work: AI pre-triage and orchestration, then humans for judgment and response",
      "body": "Tenex's public architecture claims are directionally specific even though they are not code-level. The homepage, Google partnership pages, and customer stories all point to the same operating pattern: ingest broad telemetry, use domain-specific AI to triage and correlate alerts, surface the highest-fidelity incidents to human analysts, then execute containment or escalation through playbooks and customer communication. The homepage explicitly breaks the loop into triage, investigate, respond, and adapt, while the Google deployment page translates that into foundational setup, AI-enhanced tiering, threat hunting and incident response, and continuous optimization. Customer proof reinforces the same division of labor. Payabli said it went live in about a week with Google SecOps and Tenex, while Sunrun's case study describes AI agents doing pre-triage, correlation, and enrichment, with humans keeping final authority on high-severity cases. That consistency makes the broad operating model believable: Tenex is not claiming fully autonomous defense with no human reviewer. Instead it is claiming a force-multiplier architecture where AI handles speed, scale, and correlation while human analysts, hunters, and advisors handle judgment, escalation, and accountability. The evidence is still marketing-heavy, but it is at least internally consistent across product, customer, and legal surfaces.",
