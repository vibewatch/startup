    {
      "id": "reliability-support-and-governance-controls",
      "title": "Trust, support, privacy, and reliability controls are real but narrower than a mature public trust center",
      "body": "Tenex has more public operating-control detail than many young MDR providers, but less than a fully mature public trust center. The strongest evidence is concrete: the Service Level Objectives page publishes severity-based acknowledge, respond, and resolve windows, defines how severity is scored, and lists exclusions for client-side visibility problems, unauthorized requests, and approval delays. The Data Processing Agreement is also substantive. It frames Tenex as a processor acting on the client's instructions, commits the company not to sell or share personal data, references SCC and UK Addendum transfer mechanisms, promises breach notice without undue delay, and offers audit support and subprocessor obligations. Sunrun's case study adds a second trust layer by describing mandatory human checkpoints for high-severity incidents, red-team validation, and transparent reasoning logs. Customer-support language is also unusually explicit for a young vendor: named customer success, onboarding-to-expansion ownership, and board-level measurable outcomes appear across package, Google, and customer-success pages. The caveat is what is not public. I did not find a public status page, service-credit policy, detailed uptime history, SOC 2 or ISO attestation package, or customer-facing API and connector documentation. Buyers therefore get enough public evidence to believe Tenex has thought seriously about controls, but not enough to treat those controls as fully third-party-proven at enterprise diligence depth.",
