evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Public revenue, ARR, gross margin, burn, and retention metrics tied to the January 2026 valuation step-up.
    whyItMatters: >-
      Without operating metrics, later valuation and unit-economics analysis cannot explain whether the valuation is
      deserved or promotional.
    diligencePath: >-
      Obtain management or investor materials showing revenue scale, growth, margin, burn, and retention as of the
      latest financing.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: Customer count, concentration, deployment count, headcount, and multi-location footprint.
    whyItMatters: >-
      These metrics determine whether Forge and Army milestones reflect broad traction or a narrow set of flagship
      deployments.
    diligencePath: Request current KPI pack or customer roster summary with concentration, active deployments, and employee count.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Independent litigation, outage, sanctions, complaints, or skeptical analyst coverage directly testing webAI's
      claims.
    whyItMatters: >-
      The current pool offers only a disclosure-quality caveat, not a strong external challenge to product, compliance,
      or go-to-market claims.
    diligencePath: >-
      Run a dedicated adverse search pass across court dockets, regulator records, outage reporting, and skeptical trade
      or analyst coverage.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Two additional dated milestones to reach an eight-item timeline with stronger pre-2024 and customer-validation
      coverage.
    whyItMatters: >-
      A fuller chronology would make it easier to separate enduring platform progress from a concentrated 2026
      announcement burst.
    diligencePath: >-
      Retrieve dated source pages for earlier partnerships, product launches, or financing events already alluded to in
      independent profiles.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: minor
    topic: leadership-table coverage for TO002
    missingEvidence: A fuller public board roster and clearly disclosed current roles for Ethan Baird and Tyler Mauer.
    whyItMatters: >-
      Leadership concentration and governance depth are central to company-overview risk, but the assigned pool only
      partially identifies the bench beyond David Stout, David Shuman, and Dr. PJ Maykish.
    diligencePath: >-
      Retrieve an official leadership or board page, cap-table materials, or investor decks that name current executive
      and director responsibilities.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study that isolates private or on-device enterprise AI spend by segment, geography, and
      growth rate.
    whyItMatters: Without it, TAM, SAM, and SOM cannot be tied to a defendable revenue pool or valuation multiple.
    diligencePath: >-
      Obtain Gartner, IDC, or banker materials with methodology, or build a bottom-up SAM from buyer counts and
      disclosed contract values.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment pricing, contract size, customer count, and expansion or retention metrics for enterprise, public-sector,
      and operations deployments.
    whyItMatters: Those metrics determine whether sovereign-AI demand converts into repeatable budget ownership and durable revenue.
    diligencePath: Request pricing sheets, customer references, and cohort metrics in management diligence.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: competitor-benchmarking
    missingEvidence: >-
      Direct current product, pricing, security, and benchmark documentation for Mistral AI, SambaNova Systems, Ollama,
      and other sovereign-AI peers.
    whyItMatters: >-
      Without direct peer evidence, this chapter can frame the competitive set and webAI's likely wedge, but it cannot
      prove durable superiority on economics, model quality, or security posture.
    diligencePath: >-
      Collect current peer pricing pages, security/compliance disclosures, benchmark reports, and named customer
      deployments, then rerun the comparison with peer-specific evidence instead of category-level proxies.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Public revenue, ARR, gross margin, and revenue-mix disclosure by software, services, and government contracts.
    whyItMatters: Valuation and contract announcements do not show whether revenue is recurring, high-margin, or concentrated.
    diligencePath: >-
      Request historical monthly revenue, segment mix, gross margin, and retention by cohort from the management data
      room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, burn rate, runway, debt facilities, and any project-finance or contract-working-capital obligations.
    whyItMatters: >-
      A fresh valuation is not the same as cash available, and capital needs cannot be judged from fundraising headlines
      alone.
    diligencePath: >-
      Request balance sheet, cash-flow statement, financing agreements, and monthly cash bridge through the next planned
      fundraise.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, channel economics, customer concentration, and realized price realization by segment.
    whyItMatters: >-
      Enterprise and public-sector deployments can hide services-heavy implementation work that does not scale like
      software.
    diligencePath: >-
      Request pipeline conversion, implementation effort per deployment, top-customer concentration, and realized
      pricing waterfall by segment.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: minor
    topic: pricing-disclosure
    missingEvidence: A current official price book or explicit statement that all enterprise pricing is custom and non-public.
    whyItMatters: >-
      Conflicting third-party price points can distort revenue-model assumptions and misstate contract size
      expectations.
    diligencePath: >-
      Ask management to reconcile published and unpublished pricing references and provide current packaging
      documentation.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: control-assurance
    missingEvidence: >-
      Named third-party security certifications, public uptime or status history, and customer-verified production
      performance benchmarks.
    whyItMatters: >-
      The retained evidence makes the local-first architecture plausible, but without assurance artifacts it is hard to
      underwrite whether the platform is enterprise-grade and supportable at scale.
    diligencePath: >-
      Request the current security pack, certification letters, reference architecture diagrams, benchmark methodology,
      and incident or status history for production deployments.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, gross churn, renewal cadence, contract length, and cohort retention by segment.
    whyItMatters: Without retention metrics, deployment proof cannot be converted into evidence of durable recurring revenue.
