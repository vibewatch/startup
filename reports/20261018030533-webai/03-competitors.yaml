      - Category
      - Scale or funding evidence
      - Target segment
      - Differentiation in retained evidence
      - Limitation
    rows:
      - ["webAI", "Sovereign/private AI platform", "$2.5B valuation; Series A disclosed in retained profiles", "Enterprise and public sector", "Owned-infrastructure deployment, workflow-specific assistants, DDIL-ready field use", "Pricing not publicly disclosed in retained independent coverage"]
      - ["Mistral AI", "Direct sovereign/private AI peer", "Not disclosed in this pool", "Not disclosed in this pool", "Named by AI Market Watch as a sovereign/private AI competitor", "No direct retained docs, pricing, or benchmark evidence"]
      - ["SambaNova Systems", "On-prem enterprise AI incumbent/adjacent", "Not disclosed in this pool", "Not disclosed in this pool", "Named by AI Market Watch as an on-prem enterprise AI competitor", "No direct retained docs, pricing, or benchmark evidence"]
      - ["Ollama", "Local runtime substitute", "Not disclosed in this pool", "Developers and local-model users implied by category", "Named by AI Market Watch as an on-device/local runtime competitor", "Retained pool does not show enterprise workflow, funding, or pricing detail"]
      - ["webAI.js Enterprise", "Adjacent browser/local enterprise substitute", "Not disclosed in this pool", "Organizations needing browser AI deployments", "Air-gapped deployment, custom model conversion, private telemetry, private endpoints", "Retained evidence shows deployment features but not broader workflow platform scale"]
      - ["Internal build / status quo", "Substitute rather than named vendor", "Customer labor and infrastructure costs not disclosed in this pool", "Enterprises already running sensitive workflows without private AI", "Avoids vendor dependency and can preserve existing processes", "No retained TCO or time-to-production benchmark"]
    notes: >-
      Unknown cells mean the assigned pool did not contain current direct competitor disclosures or
      independent benchmarks for that row; the table compares what the retained evidence actually
      supports rather than inferring missing competitor data.
    claimRefs: [CP005, CP006, CP008, CP009, CP010, CP013]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - webAI
      - Sovereign/on-prem peer set
      - Local runtime substitutes
      - Implication
    rows:
      - ["Runs on customer-controlled hardware", "Supported directly by official docs and Army use case", "Supported at category level only", "Supported by local-runtime category and webAI.js Enterprise", "Sovereignty is a real buyer filter, but named-peer detail is still shallow"]
      - ["Workflow-specific deployment", "Companion and Springshot examples show workflow embedding", "Unknown in retained direct competitor evidence", "webAI.js Enterprise shows deployment customization but not the same workflow case depth", "webAI looks strongest where adoption depends on fitting existing workflows"]
      - ["Disconnected or contested-network operation", "Supported by on-device docs and Project ARIA release", "Unknown in retained direct competitor evidence", "Local runtimes imply offline use but not multi-node operational resilience", "Defense and field operations appear to be a differentiated flank"]
      - ["Transparent public pricing", "Not published in retained independent coverage", "Unknown in retained direct competitor evidence", "Unknown in retained direct competitor evidence", "Buyers will need direct diligence to compare economics rather than relying on public materials"]
    notes: >-
      Matrix cells intentionally use supported, category-level language; "unknown" means the
      assigned pool lacked direct competitor evidence for that criterion, not that the capability
      is absent in the market.
    claimRefs: [CP002, CP003, CP006, CP007, CP010, CP011, CP012]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public pricing evidence
      - Package or contract signal
      - Included capability signal
      - Implication
    rows:
      - ["webAI", "Pricing not published", "Enterprise/platform sale implied by official and profile sources", "Companion, Navigator, Runtime, Network, CLI, and local deployment stack", "Evaluation will require direct commercial diligence rather than website normalization"]
      - ["webAI.js Enterprise", "Pricing not published", "Enterprise customization offer", "Model conversion, private telemetry, private endpoints, air-gapped deployment", "Substitute exists for browser/local deployments, but public economics are still opaque"]
      - ["Named peer set (Mistral / SambaNova / Ollama)", "No direct retained pricing pages", "No direct retained contract evidence", "Only category labels are supported in this pool", "Public materials in this pool are insufficient for apples-to-apples price comparison"]
      - ["Internal build / status quo", "No retained normalized cost evidence", "Labor plus infrastructure implied", "Maximum control, but buyer must assemble deployment and support", "This remains a real alternative when sovereignty matters and vendor pricing is opaque"]
    notes: >-
      This table compares disclosure level and packaging evidence, not normalized unit economics;
      the retained pool does not support credible seat, token, or contract-price benchmarking.
    claimRefs: [CP006, CP007, CP011, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained evidence positions webAI furthest toward customer-controlled deployment and
      regulated/offline workflow fit, with the rest of the landscape fragmenting by category.
    data:
      xAxis:
        label: Deployment sovereignty
        min: 1
        max: 5
        low: Cloud-dependent
        high: Runs on customer-controlled infrastructure
        description: Evidence-backed ordinal placement from the retained source descriptions
        scale: ordinal
      yAxis:
        label: Workflow specificity for regulated or offline use
        min: 1
        max: 5
        low: Generic assistant or pilot
        high: Embedded operational workflow
        description: Evidence-backed ordinal placement from retained source descriptions
        scale: ordinal
      points:
        - label: webAI
          x: 5
          y: 5
          note: Official docs and the Army release support owned infrastructure plus mission workflow deployment.
          claimRefs: [CP001, CP002, CP010]
        - label: Sovereign/private AI peers
          x: 4
          y: 3
          note: AI Market Watch names this class, but the assigned pool lacks direct workflow-depth evidence for named peers.
          claimRefs: [CP005]
        - label: On-prem enterprise AI peers
          x: 4
          y: 3
          note: SambaNova-style on-prem competition is explicit in the retained profile, but details remain category-level only.
          claimRefs: [CP005]
        - label: Local runtime substitutes
          x: 5
          y: 2
          note: Ollama-style and webAI.js-style substitutes score high on local control but show less retained evidence of enterprise workflow depth.
          claimRefs: [CP005, CP006]
        - label: Cloud AI suites
          x: 1
          y: 3
          note: Company framing treats cloud dependence as the main alternative when buyers accept generic assistants and centralized infrastructure.
          claimRefs: [CP004, CP012, CP013]
        - label: Internal build / status quo
          x: 4
          y: 2
          note: Internal builds preserve control but the retained pool does not show public evidence that they solve deployment friction faster than webAI.
          claimRefs: [CP011, CP012, CP013]
    approximationNotes: >-
      Ordinal coordinates are analytical placements derived from retained source descriptions rather
      than externally benchmarked market scores.
    claimRefs: [CP004, CP005, CP006, CP010, CP012, CP013]
callouts:
  - calloutType: insight
    title: webAI's strongest flank is not generic AI breadth
    body: >-
      The evidence here repeatedly points to sovereign deployment and hard workflow environments as
      the real wedge, especially where buyers care about private data, field resilience, or slow
      security review cycles.
    claimRefs: [CP002, CP010, CP012]
  - calloutType: risk
    title: The moat is directionally supported but not independently benchmarked
    body: >-
      Named competitors are present, but this worker pool does not contain current direct pricing
      pages, benchmark tests, or security/compliance comparisons for them, so durability claims
      should be treated as provisional.
    claimRefs: [CP005, CP007, CP014]
