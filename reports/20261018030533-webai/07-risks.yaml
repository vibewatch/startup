company:
  name: webAI
chapter:
  number: 7
  title: Risks
  summary: >-
    webAI's most consequential disclosed risks sit at the intersection of defense-contract execution,
    distributed-device security, hardware variability, and representation quality. The $14.5 million
    Project ARIA award supplies real execution exposure, while public evidence still lacks acceptance
    milestones, an independent security assessment, concentration data, and the current disposition of
    former engineers' allegations about a "fake demo" and inaccurate deal presentations.
sections:
  - id: regulatory-legal-and-representation
    title: Regulatory, legal, and representation risk
    body: >-
      The clearest adverse signal is Law360's January 2026 report that former engineers alleged in
      North Carolina state court that webAI allowed a "fake demo" and inaccurate presentations that
      endangered Qantas and U.S. Department of Defense deals. The available text is a subscription
      excerpt, so it establishes the existence and substance of reported allegations, not liability,
      adjudication, damages, or the present docket status. That distinction is investment-critical:
      enterprise and defense sales depend on technical representations surviving procurement and
      acceptance review. Separately, independent coverage of Project ARIA says no independently
      assessed security evaluation was disclosed. The immediate diligence priority is therefore the
      court record plus the Army's security, authorization, and acceptance evidence—not an inference
      that either an incident or a violation has already occurred.
    claimRefs: [CR004, CR006, CR007]
    tableRefs: [TR001]
  - id: operational-reliability-and-security
    title: Operational reliability and distributed security
    body: >-
      Project ARIA moves webAI from product claims into a demanding delivery environment: a
      $14.5 million firm-fixed-price program intended to run AI on existing handheld, laptop, and
      mounted hardware under denied or intermittent connectivity. Independent reporting identifies
      memory, battery, thermal, processor-compatibility, update-integrity, authorization, and
      synchronization challenges that accompany this design. webAI's own documentation reinforces
      hardware heterogeneity by listing three inference backends and model tiers ranging from 4 GB to
      64+ GB of memory. Local execution and peer exchange are plausible mitigations, but the public
      record does not identify device counts, exact algorithms, supported Army hardware, field-test
      results, contractual deliverables, or an operational acceptance date. Those missing milestones
      leave residual execution and security exposure high until independently evidenced.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR012, CR013, CR016]
    tableRefs: [TR002]
  - id: dependencies-adoption-and-financial-model
    title: Dependency, adoption, and financial-model risk
    body: >-
      webAI positions owned infrastructure as an escape from cloud dependency, but this shifts
      performance and lifecycle responsibility toward customer hardware, browser support, Apple
      Silicon, CPU fallbacks, model packaging, and disconnected fleet operations. Public relationship
      profiles name the Army, Oura, MacStadium, and Springshot, yet they do not provide revenue
      concentration, renewal, contract duration, or failure-remedy data. The strongest deployment
      outcome—100% adoption across Spirit Airlines' network in one hour and coverage of more than
      500 daily flights—is a webAI-authored claim rather than independently audited customer proof.
      Financial opacity compounds this risk: AGENCCY reports that pricing and the business model are
      not published, while webAI's $2.5 billion pre-money financing announcement omits the round size.
      Investors therefore cannot connect valuation to revenue quality, margins, burn, or concentration.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring framework and thesis-break triggers
    body: >-
      The risk posture should be monitored through evidence releases rather than categorical claims of
      safety or failure. Near-term positive indicators are Army acceptance on named hardware,
      disrupted-network test results, documented update and access-control mechanisms, independent
      security assurance, and repeatable customer deployments with measurable outcomes. Escalation
      triggers are an adverse court finding or substantiated misrepresentation, failure to pass Army
      acceptance or security gates, material field reliability problems, or inability to reproduce the
      company-reported adoption result with another customer. A financial thesis break would occur if
      undisclosed pricing, concentration, burn, or financing terms reveal economics inconsistent with
      the $2.5 billion pre-money mark. Until those records are produced, the matrix is qualitative
      diligence triage—not a measured incident-frequency model.
    claimRefs: [CR002, CR004, CR006, CR009, CR010, CR014, CR015, CR016]
    figureRefs: [FR001]
