        available in the assigned source pool through 2026-10-18.
    claimRefs: [CR004, CR005, CR006, CR007, CR011]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Hardware incompatibility or inadequate field performance
        - Existing devices span handheld, laptop, mounted, CPU, browser, and Apple backends
        - Medium
        - High
        - Documented architecture; field validation not public
        - High
        - Approved device list, workload benchmarks, battery, thermal, and latency tests
      - - Stale or divergent models after disrupted connectivity
        - Nodes may reconnect after outages and exchange models and data
        - Medium
        - High
        - Peer synchronization is described; conflict handling is not
        - High
        - Version policy, rollback, signing, reconciliation, and disconnected-duration tests
      - - Unauthorized model or data propagation
        - Distributed exchange expands update-integrity and authorization requirements
        - Unknown
        - High
        - Local control is asserted; independent assessment is absent
        - High
        - Threat model, red-team report, security certifications, and authorization evidence
      - - Contract delivery misses operational acceptance
        - Device counts, algorithms, deliverables, and acceptance dates are not public
        - Unknown
        - High
        - Firm-fixed-price award creates a defined commercial obligation
        - High
        - Statement of work, milestone schedule, acceptance tests, and payment triggers
    notes: >-
      Qualitative ratings synthesize the cited contract coverage and company documentation; no public
      failure-rate denominator, service-level history, field-test dataset, or independently assessed security
      report was available in the assigned pool.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR012, CR013, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or surface
      - Public concentration evidence
      - Failure scenario
      - Severity
      - Disclosed mitigation
      - Residual exposure
    rows:
      - - Defense program execution
        - U.S. Army Project ARIA
        - One named $14.5 million award; total revenue share undisclosed
        - Acceptance delay, security rejection, or scope underdelivery
        - High
        - Local-first design and existing-device deployment
        - High without milestone, margin, and concentration data
      - - Runtime and device ecosystem
        - WebGPU browsers, Apple MLX, llama.cpp, customer hardware
        - Installed mix and support burden undisclosed
        - Backend fragmentation degrades performance or increases support cost
        - Medium-high
        - Automatic backend routing and CPU fallback
        - Medium until fleet benchmarks and support economics are provided
      - - Customer proof and repeatability
        - Springshot / Spirit Airlines and other named relationships
        - Customer revenue and renewal concentration undisclosed
        - Company-reported adoption does not repeat across deployments
        - High
        - Workflow-embedded deployment is company-reported
        - High without customer-verified outcomes and cohorts
      - - Financing and pricing model
        - Investors, enterprise buyers, and capital markets
        - Pricing, business model, round size, burn, and runway are not public
        - Scaling costs or financing terms do not support the $2.5 billion pre-money mark
        - High
        - Company says capital supports platform scaling and customer rollouts
        - High until unit economics, proceeds, and preference terms are disclosed
    notes: >-
      Public relationship names are not revenue-concentration evidence. Financial cells preserve the distinction
      between the company-announced pre-money valuation and undisclosed round proceeds, revenue, burn, and cash.
    claimRefs: [CR001, CR008, CR010, CR012, CR013, CR014, CR015]
figures:
  - id: FR001
    title: Risk heatmap and mitigation maturity
    type: matrix
    summary: >-
      Qualitative diligence priorities based on disclosed exposure, evidence gaps, and mitigation maturity;
      labels are not statistical probabilities.
    data:
      columns:
        - Likelihood signal
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Defense contract acceptance
          note: Contract scope is funded, but acceptance evidence is not public.
          values:
            - label: Unknown
              note: No public milestone performance history.
            - label: High
              note: Mission-critical deployment and procurement consequences.
            - label: Early
              note: Architecture is described; field acceptance is not.
            - label: High
              note: Gated on hardware and disrupted-network tests.
        - label: Distributed security and update integrity
          note: No independently assessed security evaluation was found in the assigned evidence.
          values:
            - label: Unknown
              note: No incident-frequency denominator is public.
            - label: High
              note: Models and operational data may traverse disconnected nodes.
            - label: Claimed
              note: Local control is stated by webAI.
            - label: High
              note: Accreditation and control evidence remain unavailable.
        - label: Representation / litigation
          note: Law360 reports allegations; merits and disposition are unverified.
          values:
            - label: Active signal
              note: A specific reported court allegation exists.
            - label: High
              note: Could affect enterprise and defense procurement trust.
            - label: Undisclosed
              note: No response or remediation was available in the assigned source.
            - label: High
              note: Requires docket and governance review.
        - label: Hardware fragmentation
          note: Three backends and wide memory tiers increase support complexity.
          values:
            - label: Medium
              note: Heterogeneity is documented, but failure incidence is not.
            - label: Medium-high
              note: Performance and rollout timing may be affected.
            - label: Documented
              note: Routing and fallback mechanisms are described.
            - label: Medium
              note: Fleet-scale benchmarks are still needed.
        - label: Customer proof repeatability
          note: The strongest adoption outcome is company-authored.
          values:
            - label: Unknown
              note: No cross-customer denominator is public.
            - label: High
              note: Repeatability underpins enterprise expansion.
            - label: Case-specific
              note: One deployment narrative describes embedded workflow adoption.
            - label: High
              note: Needs customer-verified cohorts and renewals.
        - label: Financial and valuation opacity
          note: Pricing, round size, revenue, burn, and concentration are not public.
          values:
            - label: Confirmed gap
              note: Multiple core economic inputs are undisclosed.
            - label: High
              note: The $2.5 billion pre-money mark cannot be reconciled to public economics.
            - label: Undisclosed
              note: No public mitigation or financing cushion can be quantified.
            - label: High
              note: Unit economics and financing terms are required.
    approximationNotes: >-
      Ordinal labels are analyst triage based on cited public evidence and explicit gaps; they are not measured
      probabilities, incident counts, security scores, or forecasts.
    claimRefs: [CR002, CR004, CR006, CR009, CR010, CR012, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: >-
      A substantiated misrepresentation finding, failed Army acceptance or security review, or material field
      reliability issue would directly challenge webAI's mission-critical positioning.
    claimRefs: [CR002, CR004, CR006, CR016]
  - calloutType: recommendation
    title: Evidence required before risk can be underwritten
    body: >-
      Obtain the litigation docket, Army statement of work and acceptance record, independent security assurance,
      customer-verified deployment cohorts, and financial disclosures covering pricing, concentration, burn, and
      financing terms.
    claimRefs: [CR007, CR014, CR015, CR016]
