schemaVersion: "report-v2"
artifact: financials
slug: webai
runDate: 2026-10-18
company:
  name: webAI
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports an enterprise platform delivered on customer-owned infrastructure
    and at least one current public-sector contract, but it does not disclose webAI's billing
    model or recognized revenue. The January 2026 $2.5 billion pre-money round and October 2026
    $14.5 million Army award are public; realized pricing, revenue, gross margin, burn, runway,
    and customer concentration are not.
sections:
  - id: disclosed-revenue-model
    title: Disclosed revenue model is enterprise-led, but published monetization detail is thin
    body: >-
      The retained official pages describe webAI as an enterprise platform sold into private,
      on-premise, and public-sector deployments rather than as a mass-market cloud API. The most
      concrete monetization evidence in the assigned pool is a $14.5 million firm-fixed-price Army
      award. Product materials identify Navigator, Infrastructure, and Companion and refer to
      enterprise rollout, but they do not publish a billing unit, list price, contract duration, or
      revenue mix. AGENCCY likewise records the business model as not stated and pricing as not
      published. A low-reputation Fueler article does publish exact tiers, but it describes webAI as
      a cloud-first browser SaaS product, directly conflicting with the company's local-first
      architecture. Those figures therefore indicate a namesake or attribution failure rather than
      usable pricing evidence. The defensible conclusion is that webAI has commercial deployment
      pathways, while public evidence is too weak to forecast software, services, or contract mix.
    claimRefs: [CI001, CI002, CI003, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: delivery-economics
    title: Delivery economics likely benefit from local inference, but unit economics are mostly undisclosed
    body: >-
      webAI's product and documentation emphasize running inference on customer-owned hardware with
      automatic routing across browser, Apple Silicon, and CPU backends. That matters financially:
      if customers supply the device or cluster, a larger share of inference infrastructure burden
      can sit with the buyer instead of with webAI's own cloud bill. The January 2025 Winter
      Release also claims cluster management and more than 20,000 concurrent requests per minute,
      which at minimum suggests the company is selling throughput, orchestration, and workflow
      integration rather than a thin chat wrapper. Even so, public disclosures stop well short of
      decision-grade unit economics. There is no retained public evidence on gross margin, services
      attach rate, implementation cost, CAC, payback, or customer retention by cohort, so the
      favorable local-inference narrative should be treated as a gross-margin hypothesis rather than
      a proven operating profile.
    claimRefs: [CI001, CI004, CI005, CI013]
    tableRefs: [TI003]
  - id: capital-position
    title: Capital and contract disclosures show activity, but adequacy remains unknowable
    body: >-
      The clearest current financing signal is management's January 2026 announcement of an
      oversubscribed round at a $2.5 billion pre-money valuation. The amount was not disclosed;
      management said the capital would support Intelligence Labs, platform scaling, and customer
      rollout. Funding raised is not cash available, and the announcement does not reveal cash on
      hand, burn, runway, debt obligations, liquidation preferences, or the next-round trigger.
      Separately, the October 2026 $14.5 million firm-fixed-price Army award shows a contracted
      public-sector deployment, but contract value is not recognized revenue, cash received, or
      gross profit. The historical round chronology belongs in Company Overview; for forward
      capital adequacy, the retained evidence remains insufficient to determine financing duration
      or whether flagship awards convert into repeatable commercial revenue.
    claimRefs: [CI009, CI010, CI011, CI012, CI015, CI016]
  - id: verdict-and-blockers
    title: "Financial verdict: credible demand proof, but still a track-and-underwrite-later file"
    body: >-
      Financially, webAI has enough public evidence to show that customers pay for private AI
      deployment and public-sector programs, and that investors funded the thesis in early 2026.
      What it does not have is the disclosure set needed to underwrite revenue quality or margin
      path: no reliable list pricing, realized pricing, revenue, ARR, gross margin, burn, runway,
      customer concentration, or retention appears in the retained pool. Management's manifesto
      also frames success around models deployed and outcomes created rather than user counts,
      which is strategically coherent but analytically limiting. The $14.5 million Army award is a
      meaningful demand signal, not proof of revenue recognition, margin, backlog conversion, or
      customer diversification. The financial verdict is therefore credible commercial momentum
      with material private-data dependencies, not a business whose unit economics or capital
      adequacy can already be modeled from public evidence.
    claimRefs: [CI006, CI008, CI009, CI011, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Enterprise platform stack
        - Private AI workspace plus deployment stack spanning Navigator, Infrastructure, and Companion
        - Undisclosed
        - Officially described as a three-layer private AI ecosystem; billing model and revenue mix are not public
        - Company-claimed
        - Provide contract model, billing unit, software-versus-services mix, and average contract value
      - - Customer rollout programs
        - Scaling the sovereign platform and expanding customer deployments
        - Undisclosed
        - Named use of January 2026 funding; no pricing or recognized-revenue detail
        - Company-claimed
        - Provide implementation scope, rollout milestones, services attach, and revenue recognition
      - - Public-sector deployment programs
        - Mission-specific sovereign AI deployment on fielded hardware under firm-fixed-price contracts
        - Contract value
        - U.S. Army Project ARIA award disclosed at $14.5 million on 2026-10-08
        - Company-issued and syndicated
        - Show backlog, revenue-recognition schedule, and follow-on probability
      - - Runtime / inference economics
        - Local inference and orchestration on customer-owned hardware rather than vendor-hosted cloud inference
        - Gross-profit driver, not disclosed revenue line
        - Technically described; economic capture for webAI not publicly quantified
        - Inferred from official architecture
        - Disclose hosting mix, support burden, and gross-margin impact by deployment type
    notes: >-
      Mixes official product/contract disclosure with one inferred economics row; nulls mean the
      assigned pool does not disclose realized pricing, revenue mix, or recognition policy.
    claimRefs: [CI001, CI002, CI003, CI011, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer or evidence point
      - Public price / unit
      - Disclosure source
      - Interpretation
      - Diligence ask
    rows:
      - - Enterprise platform packaging
        - Not published
        - webAI product and funding announcements
        - Public pages describe products and rollout programs without a billing unit or list price
        - Obtain current price book, packaging map, and implementation statement-of-work templates
      - - Business model disclosure
        - Not stated
        - AGENCCY profile
        - Independent profile flags that public monetization detail remains incomplete
        - Reconcile company narrative with formal SKU and packaging structure
      - - Pricing disclosure status
        - "PricingNot published"
        - AGENCCY profile
        - Independent caution conflicts with third-party tiered pricing claims elsewhere
        - Confirm whether any public list pricing exists outside one low-reputation blog
      - - Third-party tiered pricing
        - Freemium, ~$39 per month, ~$249 per seat, ~$150,000 enterprise annual average
        - Fueler blog
        - "Rejected: the article describes a cloud-first browser product that conflicts with webAI's official architecture"
        - Confirm that these tiers belong to a namesake and exclude them from the operating model
    notes: >-
      Table intentionally separates official monetization surfaces from third-party pricing claims;
      conflicting public price evidence means none of these values should be treated as realized
      revenue or margin inputs.
    claimRefs: [CI001, CI002, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Inference infrastructure burden
        - Customer-owned hardware plus local routing across WebGPU, MLX, and llama.cpp
        - Medium
        - Suggests some cloud COGS can be shifted away from webAI, supporting a better gross-margin path
        - Quantify percent of workloads hosted by customers versus webAI-managed environments
      - - Throughput proxy
        - 20,000+ concurrent requests per minute
        - Medium
        - Indicates potential serving efficiency and enterprise readiness, but not monetization efficiency
        - Provide production utilization, uptime, and cost per served request
      - - Gross margin
        - null
        - Low
        - Gross margin determines whether sovereign deployment is actually attractive versus services-heavy delivery
        - Share blended and segment-level gross margin with services carve-out
      - - CAC / payback
        - null
        - Low
        - Sales efficiency is essential for judging whether enterprise deployments scale economically
        - Provide CAC, payback, sales cycle, and channel economics by segment
      - - Burn / runway
        - null
        - Low
        - Capital adequacy cannot be judged from valuation alone
        - Share cash balance, monthly burn, runway, and debt or project-finance obligations
    notes: >-
      Public evidence provides only qualitative or proxy signals for unit economics; null values are
      real diligence gaps, not zeros.
    claimRefs: [CI004, CI005, CI009, CI011, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a consultative enterprise and public-sector revenue path built on
      customer-owned hardware, while gross-profit and pricing conversion remain undisclosed.
    data:
      nodes:
        - id: friction
          label: Enterprise AI friction
          valueNote: "25% to production; <60% daily usage among workers with access"
          note: Buyers need deployment and adoption solved together, not just model access.
        - id: local-stack
          label: Local-first deployment
          valueNote: "No cloud API; automatic routing across WebGPU, MLX, and llama.cpp"
          note: Hardware and inference run close to the customer environment.
        - id: monetization
          label: Enterprise rollout
          valueNote: "Navigator, Infrastructure, Companion, and customer rollout programs"
          note: Official pages show deployable products, but not billing units or list prices.
        - id: scale
          label: Delivery-efficiency proxy
          valueNote: "20,000+ concurrent requests per minute; cluster and organization management"
          note: Suggests scalable deployment tooling rather than a one-off prototype.
        - id: contracts
          label: Public contract evidence
          valueNote: "$14.5M Army Project ARIA award"
          note: Shows current revenue-bearing deployment proof in public-sector programs.
        - id: blocker
          label: Underwriting blocker
          valueNote: "No public revenue, gross margin, burn, runway, or realized pricing"
          note: Public evidence supports momentum, not a full financial model.
    approximationNotes: >-
      This is a conceptual sequence based on disclosed operating steps; public sources do not
      disclose conversion rates or gross-profit percentages for each stage.
    claimRefs: [CI001, CI003, CI004, CI005, CI011, CI013, CI016]
callouts:
  - calloutType: risk
    title: Public evidence still does not clear the underwriting bar
    body: >-
      The January 2026 valuation step-up and October 2026 Army contract are real positives, but
      absent disclosure on revenue, gross margin, burn, runway, customer concentration, and
      realized pricing means the financial case remains directional rather than model-ready.
    claimRefs: [CI006, CI008, CI009, CI011, CI015, CI016]
