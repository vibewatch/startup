  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public NRR, GRR, gross churn, renewal cadence, contract length, and cohort retention by segment.
      whyItMatters: Without retention metrics, deployment proof cannot be converted into evidence of durable recurring revenue.
      diligencePath: Request cohort retention tables, renewal schedules, and segment-level contract duration from management or the data room.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-exposure
      missingEvidence: Customer count by segment, top-customer revenue share, and mix between public-sector and enterprise revenue.
      whyItMatters: A few named references can mask dependence on one contract, one vertical, or one channel partner.
      diligencePath: Request a customer concentration schedule showing top 5 accounts, annualized contract value, and public-sector share of ARR or bookings.
      relatedQuestionRefs: [QU007, QU008]
    - type: enumeration-incomplete
      severity: material
