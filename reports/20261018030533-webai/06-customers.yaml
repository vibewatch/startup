      - [Individual professionals / app users, End users in desktop workspace, Collaborative intelligence workspace, Help center documents people and Personas working in shared Spaces, Potential top-of-funnel and product-distribution surface, No public evidence of paid self-serve conversion or active-user scale]
    notes: >-
      Mixes direct company materials with independent profile pages; scale signals are public
      adoption indicators, not disclosed customer counts or revenue bands.
    claimRefs: [CU001, CU002, CU003, CU006]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Enterprise deployment commitment, "$30M Forge commitment", "2026-09-24", Yahoo/PRNewswire Forge announcement, Medium, Shows partner-backed enterprise demand and funded deployment capacity, Not customer count or booked revenue recognition]
      - [Named public-sector adoption, "$14.5M U.S. Army contract", "2026-10-08", webAI Project ARIA announcement plus syndicated Yahoo copy, High, Confirms at least one live mission-critical government program, Does not disclose what share of total customers or revenue this represents]
      - [Individual-user product surface, Desktop collaborative workspace documented, "Accessed 2026-10-18", webAI HelpCenter, Medium, Establishes an app workflow but not commercial adoption, "No conversion, MAU, or paid-user denominator"]
      - [Expansion posture, Customer rollout programs will expand, "2026-01-14", webAI funding announcement, Medium, Indicates management focus on scaling deployments after fundraising, No retention or renewal rates]
      - [Success metric orientation, Deployment/outcome-led rather than count-led, 2026, webAI manifesto, Medium, Explains why public proof emphasizes implementations over logo totals, No customer-count baseline]
    notes: >-
      Values are literal public signals; they are not interchangeable with ARR, customer
      count, NRR, or realized recurring revenue.
    claimRefs: [CU002, CU004, CU006, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [U.S. Army / Project ARIA, Public sector / defense, Sovereign resilient AI on soldiers' devices at the tactical edge, Public contract / field deployment path, Strongest named proof with disclosed contract value and customer quote, Single high-profile account does not show portfolio breadth]
      - [Forge AI Deployment, Channel / services partner for enterprise accounts, Build and deploy specialized AI systems for enterprise customers, Commercial commitment rather than end-customer logo, Indicates channel-assisted expansion into large organizations, Forge is not itself proof of many end customers already live]
      - [ŌURA, Healthcare / wellness, On-device personalized health AI case-study reference, Case-study style proof, Shows regulated and privacy-sensitive applicability, Public evidence does not confirm current contract value or scale]
      - [MacStadium, Infrastructure / enterprise partner, Apple Silicon infrastructure and scale case-study reference, Partner / case study, Suggests enterprise-scale infrastructure support, Infrastructure partnership is not the same as disclosed recurring customer revenue]
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named references visible in assigned prefetched sources as of the 2026-10-18
        run date; excludes undisclosed customers and nonpublic deployments.
    notes: >-
      Partial enumeration of public references only; rows combine direct customers, channel
      partners, and case-study proof because the public record does not provide a full
      production customer list.
    claimRefs: [CU004, CU006, CU007, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      webAI's public customer motion starts with privacy-sensitive evaluation, moves through
      implementation-heavy deployment, and expands via rollout programs and channel support.
    data:
      items:
        - label: Sovereignty-driven need discovery
          actor: Enterprise and public-sector buyers
          channel: Official positioning and analyst-style profiles
          touchpoints:
            - Privacy, security, and local-control requirements
            - Mission-critical environments that resist cloud dependency
          note: Demand surface is strongest where owned infrastructure matters.
          tone: opportunity
        - label: Documented individual-user product surface
          actor: Prospective users and developers
          channel: webAI HelpCenter
          touchpoints:
            - Desktop workspace introduction
            - People, Personas, and shared Spaces
          note: The documentation establishes workflow, not paid adoption or active-user scale.
          tone: risk
        - label: Solution design with customer data and workflows
          actor: webAI plus deployment partner
          channel: Forge enterprise services motion
          touchpoints:
            - Architecture and integration design
            - Specialized personas or company-wide deployments
          note: Services assistance is part of the expansion model.
          tone: opportunity
        - label: Production proof in named accounts
          actor: U.S. Army and cited case-study references
          channel: Project ARIA contract plus external profiles
          touchpoints:
            - Tactical-edge fielding
            - Oura, MacStadium, and Springshot references
          note: Real references exist, but the named set is still small.
          tone: positive
        - label: Rollout expansion
          actor: Existing enterprise and public-sector customers
          channel: Customer rollout programs
          touchpoints:
            - Broader deployment after initial implementation
            - Cross-team and cross-device scaling
          note: Expansion is discussed publicly, but renewal metrics are not.
          tone: opportunity
        - label: Remaining diligence gate
          actor: Investors and diligence teams
          channel: Missing public KPIs
          touchpoints:
            - Customer count and concentration
            - Retention, churn, pricing, and ACV
          note: Commercial durability remains the central unresolved checkpoint.
          tone: risk
    claimRefs: [CU001, CU002, CU005, CU007, CU009, CU012]
callouts:
  - calloutType: strength
    title: Disclosed relationships clear the concept-only threshold
    body: >-
      The Army contract and Forge commitment are specific commercial and deployment claims,
      although both are supported here by company-issued releases rather than independent
      original records.
    claimRefs: [CU004, CU006, CU007]
  - calloutType: risk
    title: Durability still depends on private metrics
    body: >-
      Public evidence does not disclose retention, customer count, concentration, or pricing,
      so commercial repeatability remains a diligence item rather than a verified strength.
    claimRefs: [CU009, CU010, CU012]
