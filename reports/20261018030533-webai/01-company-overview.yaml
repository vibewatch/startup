schemaVersion: report-v2
artifact: company-overview
slug: webai
runDate: 2026-10-18
company:
  name: webAI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    webAI presents itself as a sovereign, local-first enterprise AI platform built around
    specialized models that run on customer-controlled hardware rather than rented cloud
    infrastructure. Public evidence supports Austin headquarters, a 2019 founding narrative,
    a January 2026 funding/leadership expansion at a stated $2.5 billion pre-money valuation,
    and meaningful 2026 commercial/public-sector milestones, but revenue, customer count,
    headcount, pricing, and cap-table detail remain materially undisclosed.
sections:
  - id: identity-and-product
    title: Identity, positioning, and current product surface
    body: >-
      The cleanest identity through-line in the current source pool is that webAI is building a
      sovereign AI stack that keeps inference and orchestration on hardware the customer controls.
      Company-authored sources repeatedly frame the product around collaborative intelligence,
      specialized models, and local deployment, while independent profiles describe the company as
      Austin-based and founded in 2019. The developer documentation makes the operating model more
      concrete than the marketing site did in this fetch set: webAI says inference can run without a
      cloud API or network dependency, and its current documentation describes a desktop workspace
      where people, Personas, and shared Spaces can work together with intelligence running close to
      customer data. Public business-model detail is thinner than the product narrative; one
      independent profile explicitly lists pricing as unpublished and the business model as not
      stated, so later chapters should treat monetization structure as an open diligence item rather
      than a settled fact.
    claimRefs: [CO001, CO002, CO011, CO012, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership bench, and governance signal
    body: >-
      The assigned evidence supports a founder-led story centered on David Stout, who appears as
      co-founder and CEO across company and third-party sources. Independent profiles reviewed here
      place webAI's founding in 2019 and identify Ethan Baird and Tyler Mauer alongside Stout in the
      original team, but the pool provides far less public depth on the operating roles of those
      co-founders than on Stout himself. Governance disclosure is narrow but not absent: a January
      2026 company announcement quotes David Shuman as chairman of the board and introduces Dr. PJ
      Maykish as Chief Intelligence Officer through the launch of Intelligence Labs. That combination
      suggests an expanding senior bench, but it also underlines key-person concentration because the
      public narrative still depends heavily on Stout as strategy narrator and on a small set of named
      executives for credibility in defense and sovereign-AI use cases.
    claimRefs: [CO003, CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Funding context, stakeholder map, and scale signals
    body: >-
      The most supportable capital facts are directionally strong but still incomplete. webAI's own
      January 2026 announcement says a recently closed, oversubscribed round valued the company at
      $2.5 billion pre-money and names TIME Ventures, Atreides Management, Forerunner, and OXCART
      Ventures as participants. Separately, Tracxn reports $60 million of total funding across two
      rounds, with a September 2024 $700 million valuation marker preceding the January 2026 step-up.
      Those data points indicate a sharp valuation re-rating, but not enough public disclosure to
      connect valuation cleanly to revenue or margin. Commercially, the September 2026 Forge
      commitment and the October 2026 Army award are meaningful external validation of deployment
      demand, but they should not be mistaken for recurring SaaS revenue, ARR, or durable customer
      breadth without contract structure and conversion detail.
    claimRefs: [CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestone-sequence-and-gaps
    title: Milestone sequence and remaining diligence gaps
    body: >-
      The current pool is strong enough to establish a dated milestone spine, but not to claim a fully
      audited operating history. The evidence shows a 2019 founding narrative, a September 2024
      funding marker, a January 2026 leadership and valuation expansion, a September 2026 Forge
      partnership commitment, and an October 2026 Army contract award. Independent context also
      includes a cautionary reminder that at least one profile is compiled from webAI's own public
      materials and is not an independent audit, which matters because several cover metrics remain
      absent from the public record. The practical implication for later chapters is straightforward:
      treat the company identity, sovereign-AI positioning, and 2026 momentum as reasonably reusable
      ground truth, but leave revenue, customer count, headcount, detailed investor economics, and
      adverse-event coverage explicitly open until stronger third-party evidence is available.
    claimRefs: [CO003, CO006, CO007, CO008, CO009, CO010, CO015]
    figureRefs: [FO001]
