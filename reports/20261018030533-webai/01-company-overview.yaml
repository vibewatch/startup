  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Public revenue, ARR, gross margin, burn, and retention metrics tied to the January 2026 valuation step-up.
      whyItMatters: Without operating metrics, later valuation and unit-economics analysis cannot explain whether the valuation is deserved or promotional.
      diligencePath: Obtain management or investor materials showing revenue scale, growth, margin, burn, and retention as of the latest financing.
      relatedQuestionRefs: [QO003, QO004]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: Customer count, concentration, deployment count, headcount, and multi-location footprint.
      whyItMatters: These metrics determine whether Forge and Army milestones reflect broad traction or a narrow set of flagship deployments.
      diligencePath: Request current KPI pack or customer roster summary with concentration, active deployments, and employee count.
      relatedQuestionRefs: [QO004, QO007]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: adverse-evidence
      missingEvidence: Independent litigation, outage, sanctions, complaints, or skeptical analyst coverage directly testing webAI's claims.
      whyItMatters: The current pool offers only a disclosure-quality caveat, not a strong external challenge to product, compliance, or go-to-market claims.
      diligencePath: Run a dedicated adverse search pass across court dockets, regulator records, outage reporting, and skeptical trade or analyst coverage.
      relatedQuestionRefs: [QO008]
    - type: missing-source
      severity: minor
