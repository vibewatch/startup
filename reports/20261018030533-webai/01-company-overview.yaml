    rows:
      - ["TIME Ventures", "Named financing participant", "Part of the January 2026 round supporting the stated $2.5B pre-money valuation.", "Confirm check size, security terms, and board or information rights."]
      - ["Atreides Management", "Named financing participant", "Cited in both company and Tracxn funding evidence for the January 2026 financing.", "Clarify ownership stake, pro-rata rights, and follow-on appetite."]
      - ["Forerunner", "Named financing participant", "Appears in the January 2026 company announcement and Tracxn funding evidence.", "Verify position size and whether support extends beyond brand signaling."]
      - ["OXCART Ventures", "Named financing participant", "Named only in the company January 2026 announcement within this pool.", "Validate participation amount and strategic role."]
      - ["Forge AI Deployment", "Systems integrator / channel partner", "Committed $30M to build and deploy enterprise systems around webAI's platform.", "Separate booked services demand from financing-like language and map revenue recognition."]
      - ["U.S. Army / Project ARIA", "Public-sector customer / contract sponsor", "Awarded a $14.5M contract for tactical-edge deployment in October 2026.", "Determine contract duration, follow-on potential, and concentration risk."]
    notes: >-
      This table mixes capital providers with economically meaningful commercial stakeholders because
      the public record is stronger on named counterparties than on cap-table depth.
    enumerationScope:
      coverage: partial
      basis: >-
        Stakeholders explicitly named in the assigned source pool because they appear as investors,
        channel partners, or contract counterparties with plausible economic significance to webAI.
    claimRefs: [CO007, CO008, CO009, CO010]
