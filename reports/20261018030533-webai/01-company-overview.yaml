    notes: >-
      Enumeration is limited to named founders and senior leaders visible in the assigned source pool
      as of 2026-10-18; it is not a complete org chart or board roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Named founders and senior leaders explicitly identified in the assigned public source pool as
        of the run date, excluding undisclosed executives and board members not present in those texts.
    claimRefs: [CO003, CO004, CO005, CO006]
