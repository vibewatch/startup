chapter:
  number: 2
  title: "Market Analysis"
  summary: "webAI is not selling into the entire AI-software market; the assigned evidence supports a narrower sovereign, on-device enterprise AI segment where buyers care about local inference, data control, and deployment in denied or regulated environments. Demand signals are real, but the pool sizes the opportunity only through adoption and deployment proxies such as Deloitte survey data, Spirit Airlines' 500+ daily-flight rollout, and the Army's $14.5 million Project ARIA award. The chapter therefore treats TAM/SAM/SOM as a material diligence gap rather than accepting a generic AI TAM."
sections:
  - id: "market-boundary"
    title: "Market boundary: sovereign deployment, not generic AI spend"
    body: |
      The boundary that matters for webAI is narrower than "enterprise AI" in the abstract. Official and third-party descriptions consistently frame the product around running specialized models on hardware the customer already controls, keeping data local, and avoiding dependence on a centralized cloud API. That means the relevant spend is not every copilot seat or every model API call. It is the subset of software and infrastructure budget tied to private model deployment, orchestration, multimodal retrieval, and edge or fleet operation in settings where privacy, latency, resilience, or compliance change the buying criteria. The closest substitutes are generic cloud-hosted copilots, centralized inference APIs, and legacy pilots that never clear production requirements, which is why a broad generative-AI TAM would overstate webAI's practical addressable market.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing the niche with adoption and deployment lenses"
    body: |
      The assigned pool does not provide an independently audited dollar TAM, SAM, and SOM for private local-first enterprise AI, so the best public sizing lens is behavioral and deployment evidence. webAI's Deloitte commentary cites a 2026 survey of more than 3,200 leaders across 24 countries, which shows broad enterprise interest in AI, but it also shows the market narrows sharply when the test becomes production conversion and daily workflow usage. Only 25% of companies had moved 40% or more of experiments into production, and fewer than 60% of workers with tool access used AI daily. Those filters make webAI's niche look more like a constrained deployment market than a blanket software category. Proof points such as Spirit Airlines' 500+ daily-flight rollout and the Army's $14.5 million Project ARIA award show there is real spend inside that niche, but not enough to backfill a clean SAM or SOM.
    claimRefs: ["CM006", "CM007", "CM008", "CM009", "CM010", "CM011", "CM013"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyer-segmentation"
    title: "Buyer, user, and payer segmentation"
    body: |
      The visible customer pattern points to four buyer shapes rather than one homogeneous "AI buyer." First are enterprise platform and IT leaders who need private copilots, retrieval, and model orchestration on owned infrastructure. Second are operations leaders who want AI embedded inside a live workflow, such as inspections, compliance, or aircraft turnaround, where adoption depends on fitting the existing process instead of forcing a new one. Third are public-sector and defense program owners who need local execution when the cloud is unavailable or disallowed. Fourth are internal developer or ML-platform teams that need model conversion, telemetry, and bespoke integration. In each case, the user may be a frontline employee, analyst, or internal builder, but the payer is more likely to be a platform, operations, or mission-program budget than a self-serve seat purchaser.
    claimRefs: ["CM003", "CM012", "CM015"]
    tableRefs: ["TM003"]
  - id: "drivers-and-constraints"
    title: "Growth drivers and constraints"
    body: |
      The main demand drivers are explicit in the evidence: data sovereignty, low-latency local execution, resilience when connectivity is poor, and the promise of more predictable economics than cloud-dependent AI. That logic is strongest in regulated and mission-critical settings, which is why webAI highlights defense, aviation, manufacturing, healthcare, and financial-services use cases. The constraints are just as important. The same public material says enterprise AI often stalls on infrastructure, security reviews, and integration complexity; the product documentation also shows that deployment quality depends on hardware tiers spanning roughly 4 GB to 64+ GB of memory. The evidence is also announcement-heavy: PR Newswire remains an active company-controlled outlet, but it does not disclose pricing, customer counts, or segment economics. Until those data exist, investors should treat market size and adoption speed as partially proven rather than settled.
    claimRefs: ["CM008", "CM009", "CM013", "CM014", "CM015", "CM016"]
