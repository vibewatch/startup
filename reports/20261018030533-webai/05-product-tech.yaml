chapter:
  number: 5
  title: "Product & Technology"
  summary: "webAI is positioning a local-first sovereign AI stack rather than a single assistant SKU: public materials describe a desktop workspace, Personas, and a broader platform spanning runtime, orchestration, and enterprise customization. The strongest public proof is architectural rather than financial: documentation details local inference backends and model-tier routing, while October 2026 defense deployment materials show the stack running on customer-controlled field hardware. The tradeoff is that customer-controlled deployment also pushes hardware, security, monitoring, and lifecycle burden back onto the buyer, and the retained evidence set still lacks independent assurance on certifications, uptime, and production-scale benchmarks."
sections:
  - id: "product-surface"
    title: "Product surface and workflow fit"
    body: |-
      webAI's public product surface reads like a sovereign AI workspace plus a broader platform, not a single chatbot. The getting-started documentation describes a desktop environment where People, Personas, and shared Spaces work together on hardware the customer controls, while third-party profiles expand that surface into Navigator, Companion, Runtime, webFrame, Network, CLI, and vertical solutions such as multimodal retrieval, anomaly detection, and edge vision. That mix suggests the company is trying to sell both an end-user interaction layer and the underlying platform needed to build and run specialized models around proprietary workflows. The open question is commercial maturity by module: the retained evidence names many surfaces, but independent adoption depth by SKU is still thin.
    claimRefs: ["CE001", "CE005", "CE012", "CE013"]
    tableRefs: ["TE001", "TE002"]
  - id: "local-execution-architecture"
    title: "Local execution architecture"
    body: |-
      The clearest technical evidence is in webAI's own documentation. The on-device AI page says models run directly on local hardware with no cloud API or network dependency, then breaks execution into three backends: WebGPU for browser-native GPU inference, MLX for Apple Silicon desktops, and llama.cpp as a CPU fallback. The same page also describes automatic hardware routing, model tiers keyed to memory, and LoRA adapters attached through Personas. Taken together, the architecture appears optimized for matching model size and inference runtime to the deployment surface rather than forcing one model stack everywhere. That is directionally credible for a local-first product, but the retained public docs still do not give audited throughput, latency, or reliability benchmarks by backend.
    claimRefs: ["CE002", "CE003", "CE004", "CE011", "CE014"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "deployment-proof-and-dependencies"
    title: "Deployment proof and operating dependencies"
    body: |-
      The best public deployment proof in this pool is operational rather than benchmark-driven. webAI's October 2026 Army post describes software running directly on laptops, handhelds, and mounted compute already in the field, with the Intelligence Delivery Network coordinating collaboration under denied, disrupted, intermittent, and limited connectivity. TechEdgeAI's independent write-up of the Forge partnership supports the same operating model from a different angle: webAI provides the platform, while the deployment partner handles architecture, integration, secure installation, optimization, and ongoing operations. That operating model matters because it also defines the burden on customers. A local, customer-controlled stack can reduce cloud dependency, but it asks the buyer or integrator to own hardware fit, lifecycle management, monitoring, and parts of the security and operations envelope.
    claimRefs: ["CE006", "CE007", "CE008", "CE010"]
  - id: "differentiation-controls-and-gaps"
    title: "Differentiation, controls, and diligence gaps"
    body: |-
      webAI's differentiation story is consistent across company and third-party sources: it is selling sovereign, on-device, multi-model intelligence that runs near the customer's data rather than through a public-cloud API. That positioning is strategically coherent, especially for regulated, defense, or edge environments, and it is reinforced by the company's emphasis on local execution, hardware routing, and specialized Personas. But public evidence remains stronger on architecture than on assurance. The retained sources support privacy, local control, and implementation flexibility, yet they do not independently validate named security certifications, uptime history, or production-scale performance claims across enterprise deployments. For underwriting, the core technical debate is therefore not whether webAI has a plausible local-first architecture; it is whether the company can prove that architecture is repeatable and supportable at scale.
    claimRefs: ["CE008", "CE009"]
