        title: 资本与合同披露显示业务活跃，但充足性仍无法判断
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的融资信号，是管理层 2026 年 1 月宣布一轮超额认购融资，投前估值为 $2.5 billion。融资金额未披露；管理层称资金将支持 Intelligence
              Labs、平台扩张和客户上线。已筹资金不等于可用现金，而公告没有披露现金余额、烧钱、现金跑道、债务义务、清算优先权或下一轮触发条件。另一方面，2026 年 10 月金额为 $14.5 million 的 Army
              固定总价授标显示已有公共部门部署合同，但合同价值不等于已确认收入、收到的现金或毛利润。历史轮次时间线属于公司概览；对于前瞻性的资本充足性，保留证据仍不足以判断融资能持续多久，或旗舰授标能否转化为可重复的商业收入。
