      - number: '4.4'
        title: 财务结论：需求证据可信，但仍需跟踪，暂缓投资判断
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，webAI 的公开证据足以显示客户会为私有 AI 部署和公共部门项目付费，投资者也在 2026
              年初为这套论点提供了资金。但它没有足以评估收入质量或利润率路径的披露集：保留来源池中没有可靠目录定价、实际定价、收入、ARR、毛利率、烧钱、跑道、客户集中度或留存。管理层宣言还把成功定义为已部署的模型和创造的成果，而不是用户数；这在战略上自洽，但在分析上形成限制。$14.5
              million 的 Army
              授标是有意义的需求信号，但不是收入确认、利润率、积压订单转化或客户多元化的证据。因此，财务结论是：商业势头可信，但依赖大量私有数据；它还不是一家可以仅凭公开证据建模单位经济性或资本充足性的企业。
