              最清晰的技术证据来自 webAI 自己的文档。端侧 AI 页面称模型直接运行在本地硬件上，无需云 API 或网络依赖，并将执行拆为三个后端：WebGPU 用于浏览器原生 GPU 推理，MLX 用于 Apple
