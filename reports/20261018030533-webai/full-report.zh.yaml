    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              对分配证据最稳妥的解读是：webAI 的产品和品类差异化足以继续关注，但公开运营披露不足以支持在当前披露价格下高确信买入。2026 年 1 月融资反复被描述为 $2.5 billion
              投前估值轮，但公司公告没有披露融资金额，独立追踪机构对累计融资额也没有达成一致。这一组合很重要，因为这里的估值纪律与其说取决于主权 AI
              是否有吸引力，不如说取决于变现质量、客户广度和融资条款能否支撑这一估值。在证据到位前，正确姿态是继续跟踪该标的、要求更完整的 KPI 包，并只在入场条款更清晰后重新做投资判断。
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV001
              - CV004
              - CV014
              - CV010
              - CV011
      - number: '8.2'
        title: 公开记录实际支持什么
        blocks:
          - type: paragraph
            body: >-
              文件中的看多部分是真实的：webAI 始终将自己定位为在客户控制的基础设施上进行主权、local-first 部署；技术文档也展示了具体的本地后端，而不是模糊的 AI
              叙事。弱点不在产品想象力，而在估值支撑。独立目录式资料仍未发布定价，也没有提供经过审计的经济性；其中一份还明确称资料反映的是公司陈述，而非独立审计。这些资料可以帮助确认市场正在讨论
              webAI，且少数参考客户或行业反复出现，但它们不能替代收入质量、客户集中度、续约行为或真正的可比公司集合。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              基准情景必须以里程碑为基础，因为没有公开收入或现金流基数，无法进行常规倍数或 DCF 练习。在这一框架下，主权 AI、本地推理和企业封装可能对受监管或任务关键型买方有价值，因此 webAI
              值得继续关注。上行情景是，这些特征在市场重估本地 AI
              基础设施前转化为广泛且可重复的上线运动。下行情景更为熟悉：如果后续披露显示变现有限、客户覆盖狭窄，或融资条款让新资金处于明显次要地位，那么当前的标题估值就可能成为压缩或下轮融资的前奏，而非带来超额风险投资回报。
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 尽调问题与论点失效点
        blocks:
          - type: paragraph
            body: >-
              因此，尽调路径很直接。第一，要求提供 2026 年收入、ARR、毛利率、烧钱、跑道和留存数据包；没有这座运营桥梁，当前价格就无法与单位经济性或退出测算连接。第二，要求提供股权结构表以及 2026 年 1 月和
              2026 年 9 月融资的完整优先股堆叠，包括任何参与权、优先级或老股转让成分。第三，检验公开资料中反复出现的证明，究竟代表可规模化的企业
              cohort，还是仅仅是一小组定制化胜利。若变现披露薄弱、客户集中或融资条款让当前估值看起来由叙事而非业绩驱动，论点就会失效。
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据结论
            body: 在公司提供 KPI 桥梁以及支撑 2026 年估值的融资结构前，继续跟踪 webAI，而不要按当前标题估值买入。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
          - type: callout
            title: 核心投资判断缺口
            body: 决定性缺失证据不是产品愿景，而是收入质量、客户广度和资本结构透明度。
            calloutType: risk
            claimRefs:
              - CV007
              - CV010
              - CV015
