      - number: '4.2'
        title: 本地推理可能改善交付经济性，但单位经济性基本未披露
        blocks:
          - type: paragraph
            body: >-
              webAI 的产品和文档强调在客户自有硬件上运行推理，并在浏览器、Apple Silicon 和 CPU 后端之间自动路由。这在财务上很重要：如果客户提供设备或集群，更大部分推理基础设施负担就会落在买方，而不是
              webAI 自己的云账单上。2025 年 1 月的 Winter Release 还声称支持集群管理和每分钟超过 20,000
              个并发请求，这至少说明公司销售的是吞吐量、编排和工作流集成，而不是薄薄的聊天封装。即便如此，公开披露距离可用于决策的单位经济性仍很远。保留的公开证据没有毛利率、服务附加率、实施成本、CAC、回本周期或按
              cohort 划分的客户留存，因此有利的本地推理叙事应被视为毛利率假设，而不是已证实的运营画像。
            claimRefs:
              - CI001
