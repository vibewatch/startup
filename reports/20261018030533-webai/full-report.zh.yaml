  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：主权部署，而非泛 AI 支出
        blocks:
          - type: paragraph
            body: >-
              对 webAI 真正重要的边界，比抽象意义上的“企业 AI”更窄。官方和第三方描述都将产品定位为：在客户已经控制的硬件上运行专用模型、让数据留在本地，并避免依赖集中式云 API。因此，相关支出不是每个
              copilot 席位或每次模型 API 调用，而是与私有模型部署、编排、多模态检索以及边缘或车队运营相关的软件和基础设施预算；在这些场景中，隐私、延迟、韧性或合规会改变采购标准。最接近的替代方案是通用云托管
              copilot、集中式推理 API，以及始终无法满足生产要求的旧式试点项目；因此，宽泛的生成式 AI TAM 会高估 webAI 的实际可服务市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
