chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与当前产品形态
        blocks:
          - type: paragraph
            body: >-
              当前来源池对 webAI 最清晰的共同描述是：它正在打造一套主权 AI 技术栈，让推理和编排留在客户控制的硬件上。公司自有来源反复将产品定位为协作式智能、专用模型和本地部署；独立资料则将公司描述为总部位于
              Austin、成立于 2019 年。开发者文档比本次抓取到的营销网站更具体地说明了运营模式：webAI 表示推理可以不依赖云 API 或网络连接运行；当前文档还描述了一个桌面工作区，让人员、Personas
              和共享 Spaces 协同工作，同时让智能能力贴近客户数据运行。商业模式的公开细节比产品叙事薄弱；一份独立资料明确将定价列为未发布、商业模式列为未说明，因此后续章节应把变现结构视为待尽调事项，而不是既定事实。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO013
              - CO014
