        title: 创始人、管理层梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一条以 David Stout 为核心的创始人主导叙事：公司和第三方来源都将他列为联合创始人兼 CEO。本次审阅的独立资料将 webAI 的成立时间放在 2019 年，并指出 Ethan Baird
              和 Tyler Mauer 与 Stout 一同组成最初团队；但与 Stout 相比，来源池对这两位联合创始人运营职责的公开信息少得多。治理披露有限但并非空白：2026 年 1 月的公司公告引述 David
              Shuman 为董事会主席，并在 Intelligence Labs 发布时介绍 Dr. PJ Maykish 出任 Chief Intelligence
              Officer。这些安排显示高级管理层正在扩充，但也凸显关键人物集中度：公共叙事仍高度依赖 Stout 作为战略讲述者，以及少数具名高管在国防和主权 AI 场景中的可信度。
