              - CP012
      - number: '3.3'
        title: 持久性、切换成本与开放风险
        blocks:
          - type: paragraph
            body: >-
              当前来源池支持这样一个判断：webAI 可以靠私有数据集成、自有基础设施以及进入难以服务的环境制造切换成本；但它没有证明相对于具名同业，在价格或可量化性能上拥有持久护城河。AGENCCY
              的资料称定价未发布，保留的竞争者资料也没有提供 Mistral、SambaNova 或 Ollama 经过标准化的席位、token 或基础设施定价。Deloitte
              关于从试点走向生产的摩擦的评论，有助于解释架构和工作流嵌入为何重要；但它仍是公司发布的解读，而不是独立的胜率基准研究。实际结论是，webAI
              最强的侧翼似乎是主权、受监管或断网部署；而在买方主要关注模型质量、工具广度或透明经济性的领域，商品化风险仍未得到充分检验。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP014
