        title: 已披露的收入模式以企业为主，但公开变现细节很薄
        blocks:
          - type: paragraph
            body: >-
              保留的官方页面将 webAI 描述为面向私有、本地部署和公共部门部署销售的企业平台，而不是大众市场云 API。分配来源池中最具体的变现证据，是一项金额为 $14.5 million 的 Army
              固定总价合同。产品材料提到 Navigator、Infrastructure 和 Companion，也提到企业上线，但没有公布计费单位、目录价格、合同期限或收入组合。AGENCCY
              同样将商业模式记录为未说明、将定价记录为未发布。一篇声誉较低的 Fueler 文章确实公布了精确档位，但把 webAI 描述成 cloud-first 浏览器 SaaS 产品，与公司 local-first
              架构直接冲突。因此，这些数字更像同名或归因失败，而不是可用的定价证据。稳妥结论是：webAI 拥有商业部署路径，但公开证据太弱，无法预测软件、服务或合同组合。
