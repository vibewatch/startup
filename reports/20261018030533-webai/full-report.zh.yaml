      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              可见的客户模式指向四类买方，而不是一个同质化的“AI 买方”。第一类是需要在自有基础设施上运行私有 copilot、检索和模型编排的企业平台及 IT 负责人。第二类是希望把 AI
              嵌入现有工作流的运营负责人，例如检查、合规或飞机周转；这里的采用取决于能否嵌入原有流程，而不是强行换一套流程。第三类是公共部门和国防项目负责人，在云不可用或不允许使用时需要本地执行。第四类是需要模型转换、遥测和定制集成的内部开发者或
              ML 平台团队。每种场景中，用户可能是一线员工、分析师或内部构建者，但付费方更可能是平台、运营或任务项目预算，而不是自助购买席位的个人。
            claimRefs:
              - CM003
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM012
              - CM015
      - number: '2.4'
        title: 增长驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              证据明确指出主要需求驱动因素：数据主权、低延迟本地执行、网络连接较差时的韧性，以及相比依赖云的 AI 更可预测的经济性。这套逻辑在受监管和任务关键型场景中最强，因此 webAI
              强调国防、航空、制造、医疗和金融服务用例。约束同样重要。同一批公开材料称，企业 AI 经常卡在基础设施、安全审查和集成复杂度上；产品文档还显示，部署质量取决于约 4 GB 至 64+ GB
              的内存硬件档位。证据也高度依赖公告：PR Newswire 仍是公司控制的活跃渠道，但没有披露定价、客户数或分部经济性。在这些数据出现前，投资者应把市场规模和采用速度视为部分得到证明，而不是已被坐实。
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代解决方案类别
        blocks:
          - type: paragraph
            body: >-
              分配到的来源池不支持一份干净、单维度的同业名单，而是支持一个分层竞争格局。AI Market Watch 明确列出 Mistral AI、SambaNova Systems 和 Ollama
              为主要竞争者，覆盖主权 / 私有模型厂商、企业本地部署 AI 基础设施和本地模型运行时，而不是单一产品类别。webAI 自己的材料进一步拓宽了这一框架，认为真正的替代方案往往是依赖云的
              AI，或在安全审查、集成或部署阶段失败的通用试点。这一点很重要，因为买方的比较集合会随用例改变：受监管企业可能把 webAI 与本地部署或本地替代方案比较，而监管较少的买方仍可能默认选择云 copilot
              或内部自建。
