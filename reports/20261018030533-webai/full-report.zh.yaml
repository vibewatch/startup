        title: 融资背景、利益相关方图谱与规模信号
        blocks:
          - type: paragraph
            body: >-
              目前最有支撑的资本事实方向明确，但仍不完整。webAI 自己 2026 年 1 月的公告称，一轮近期完成且超额认购的融资按 $2.5 billion 投前估值计算公司价值，并列出 TIME
              Ventures、Atreides Management、Forerunner 和 OXCART Ventures 为参与方。另一方面，Tracxn 报告两轮融资共计 $60 million，并显示 2024 年
              9 月的 $700 million 估值标记先于 2026 年 1 月的上调。这些数据说明估值发生了明显重估，但公开披露仍不足以把估值与收入或利润率清晰连接起来。商业层面，2026 年 9 月的 Forge
              承诺和 2026 年 10 月的 Army 授标是部署需求的重要外部验证；但在缺少合同结构和转化细节前，不应将其误认为经常性 SaaS 收入、ARR 或稳定的客户覆盖。
