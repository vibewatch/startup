      - number: '3.2'
        title: webAI 看起来最强的地方
        blocks:
          - type: paragraph
            body: >-
              保留证据中最一致的优势，是部署主权与工作流专用性的结合。webAI 官方文档称，推理可以直接在客户硬件上运行，无需云 API、无需网络依赖，并能在 WebGPU、MLX 和 llama.cpp
              后端之间自动路由。HRTechEdge 对 Companion 的报道和 Army Project ARIA 发布稿从不同角度强化了同一主题：webAI
              销售的是贴近专有数据或断网现场设备的私有、工作流专用助手和模型。因此，与通用聊天机器人封装相比，webAI 更像是服务于重视主权、安全审查简化和韧性、而不是广泛公共模型生态的买方的平台厂商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
