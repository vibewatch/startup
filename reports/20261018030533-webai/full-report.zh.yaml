            body: >-
              webAI 在公司和第三方来源中的差异化叙事一致：它销售的是靠近客户数据运行的主权、端侧、多模型智能，而不是依赖公有云 API
              提供能力。这一定位在受监管、国防或边缘环境中具有战略一致性，并由公司对本地执行、硬件路由和专用 Personas
              的强调进一步强化。但架构证据明显强于保障证据。保留来源支持隐私、本地控制和实施灵活性，却没有独立验证具名安全认证、运行时间历史或跨企业部署的生产规模性能声明。对投资判断而言，核心技术问题因此不是 webAI
              是否拥有可信的 local-first 架构，而是公司能否证明这套架构可在规模化场景中重复部署并得到支持。
