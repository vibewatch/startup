  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 主权 AI 需求从早期受监管和公共部门案例，扩展到可重复的企业采用。
        - 如果部署广度和变现规模迅速提升，当前估值可以靠业绩消化。
        - 在行业倍数压缩前，执行仍取决于能否证明客户覆盖面。
        - 更多第三方客户验证和已披露的 KPI 进展。
      - - 基准
        - 产品差异化确实存在，但证据仍主要是叙述性材料加目录背景。
        - 只有后续披露显示收入质量强、融资条款清晰，价值才会兑现。
        - 目前的公开证据不足以支持精确的入场测算。
        - 管理层分享 KPI 数据包和股权结构细节。
      - - 悲观
        - 后续披露显示变现更弱、客户更集中，或优先权条款更不利。
        - 对外宣称的估值在后续轮次压缩或重置。
        - 下轮融资降价、倍数压缩，或新资金在结构上处于次级地位。
        - 收入、留存和融资结构持续不透明。
    notes: 情景仅用于方向判断，因为指定证据中没有披露公开收入、利润率或现金流基数。
