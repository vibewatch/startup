    title: 客户旅程图
    type: journey-map
    summary: webAI 的公开客户路径从重视隐私的评估开始，经过实施工作量较大的部署，再借助推广项目和渠道支持扩大。
    data:
      items:
        - label: 主权驱动的需求发现
          actor: 企业和公共部门买家
          channel: 官方定位和分析师式资料
          touchpoints:
            - 隐私、安全和本地控制要求
            - 排斥云依赖的任务关键型环境
          note: 自有基础设施重要的场景，需求最强。
          tone: opportunity
        - label: 已有文档说明的个人用户产品界面
          actor: 潜在用户和开发者
          channel: webAI HelpCenter
          touchpoints:
            - 桌面工作空间介绍
            - People、Personas 和共享 Spaces
          note: 文档说明了工作流，但没有证明付费采用或活跃用户规模。
          tone: risk
        - label: 结合客户数据和工作流的方案设计
          actor: webAI 加部署合作伙伴
          channel: Forge 企业服务路径
          touchpoints:
            - 架构和集成设计
            - 专门化 personas 或全公司部署
          note: 服务支持是扩张模式的一部分。
          tone: opportunity
        - label: 指定客户中的生产验证
          actor: U.S. Army 和引用的案例资料
          channel: Project ARIA 合同及外部资料
          touchpoints:
            - 战术边缘部署
            - Oura、MacStadium 和 Springshot 案例
          note: 确实有真实案例，但已点名的客户仍然很少。
          tone: positive
        - label: 推广扩张
          actor: 现有企业和公共部门客户
          channel: 客户推广项目
          touchpoints:
            - 初步实施后的更广泛部署
            - 跨团队、跨设备扩展
          note: 公开资料讨论了扩张，但没有续约指标。
          tone: opportunity
        - label: 剩余尽调关口
          actor: 投资人和尽调团队
          channel: 缺失的公开 KPI
          touchpoints:
            - 客户数量和集中度
            - 留存、流失、定价和 ACV
          note: 商业持久性仍是尚未解决的核心检查点。
          tone: risk
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU009
      - CU012
  - id: FR001
    title: 风险热力图与缓解成熟度
    type: matrix
    summary: 根据已披露风险敞口、证据缺口和缓解成熟度确定的定性尽调优先级；标签不是统计概率。
    data:
      columns:
        - 可能性信号
        - 影响
        - 缓解成熟度
        - 剩余风险敞口
      rows:
        - label: 国防合同验收
          note: 合同范围已有资金支持，但验收证据未公开。
          values:
            - label: Unknown
              note: 没有公开的里程碑执行历史。
            - label: 高
              note: 任务关键型部署和采购后果。
            - label: 早期
              note: 已描述架构，但没有现场验收。
            - label: 高
              note: 取决于硬件和受干扰网络测试。
        - label: 分布式安全与更新完整性
          note: 指定证据中没有找到经过独立评估的安全评价。
          values:
            - label: Unknown
              note: 没有公开的事件频率分母。
            - label: 高
              note: 模型和运营数据可能穿过断联节点。
            - label: 自述
              note: webAI 声称拥有本地控制。
            - label: 高
              note: 认证和控制证据仍无法获得。
        - label: 代理 / 诉讼
          note: Law360 报道了指控；实体问题和处理结果尚未验证。
          values:
            - label: 活跃信号
              note: 存在一项具体的已报道法院指控。
            - label: 高
              note: 可能影响企业和国防采购信任。
            - label: 未披露
              note: 指定来源中没有回应或补救措施。
            - label: 高
              note: 需要审阅案卷和治理。
        - label: 硬件碎片化
          note: 三个后端和宽泛的内存层级增加了支持复杂度。
          values:
            - label: 中
              note: 异构性已有记录，但故障发生率没有。
            - label: 中高
              note: 性能和推广时间可能受影响。
            - label: 已记录
              note: 已描述路由和回退机制。
            - label: 中
              note: 仍需要车队规模的基准测试。
        - label: 客户验证的可重复性
          note: 最强的采用成果由公司自行撰写。
          values:
            - label: Unknown
              note: 没有公开的跨客户分母。
            - label: 高
              note: 可重复性是企业扩张的基础。
            - label: 个案
              note: 一则部署叙述描述了嵌入式工作流采用。
            - label: 高
              note: 需要客户验证的群组和续约数据。
        - label: 财务与估值不透明
          note: 定价、轮次规模、收入、消耗和集中度均未公开。
          values:
            - label: 已确认缺口
              note: 多项核心经济输入未披露。
            - label: 高
              note: $2.5 billion 投前估值无法与公开经济数据对账。
            - label: 未披露
              note: 没有公开的缓解措施或融资缓冲可供量化。
            - label: 高
              note: 需要单位经济和融资条款。
    approximationNotes: 序数标签是分析师根据引用的公开证据和明确缺口进行的分诊；它们不是测量所得的概率、事件数量、安全评分或预测。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪，因为差异化和早期验证已经存在，但估值支撑弱于 $2.5B 的对外宣称估值。
    data:
      nodes:
        - id: demand
          label: 主权 AI 需求可信
          note: 受监管和任务关键型买家确实有理由偏好本地控制。
          claimRefs:
            - CV005
            - CV013
        - id: capability
          label: 产品架构具备差异化
          note: 本地后端和企业封装让产品不只是品牌说法。
          claimRefs:
            - CV005
            - CV006
        - id: proof
          label: 公开验证仍然有限
          note: 第三方资料只重复了少量客户和行业案例。
          claimRefs:
            - CV008
        - id: price
          label: 价格信号可见，但投资判断支撑薄弱
          note: $2.5B 估值已公开，但各跟踪机构记录的累计融资额仍不一致。
          claimRefs:
            - CV001
            - CV004
        - id: downside
          label: 下行风险是压缩或重置
          note: 后续披露可能显示，叙事跑在变现和条款质量之前。
          claimRefs:
            - CV014
        - id: decision
          label: 建议：跟踪 / 重新评估
          note: 只有披露 KPI 且融资条款透明后，才重新打开评估。
          claimRefs:
            - CV010
            - CV011
      edges:
        - from: demand
          to: capability
        - from: capability
          to: proof
        - from: proof
          to: price
        - from: price
          to: downside
        - from: downside
          to: decision
    approximationNotes: null
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV001
      - CV004
      - CV014
      - CV010
      - CV011
