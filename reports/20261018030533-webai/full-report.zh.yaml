      - number: '2.2'
        title: 用采用和部署视角衡量细分市场
        blocks:
          - type: paragraph
            body: >-
              分配到的来源池没有提供针对私有、local-first 企业 AI 的独立审计美元口径 TAM、SAM 和 SOM，因此最好的公开衡量方式是看行为和部署证据。webAI 的 Deloitte 评论引用了一项覆盖
              24 个国家、超过 3,200 名领导者的 2026 年调查，显示企业对 AI 的兴趣广泛；但当测试转向生产转化和日常工作流使用时，市场会明显收窄。只有 25% 的公司把 40%
              或更多实验投入生产，拥有工具访问权限的员工中也不到 60% 每天使用 AI。这些筛选条件显示，webAI 所处的细分市场更像受约束的部署市场，而不是一个包罗万象的软件类别。Spirit Airlines 每日
              500+ 航班的上线，以及 Army $14.5 million 的 Project ARIA 授标，证明该细分市场确实存在支出，但不足以补出清晰的 SAM 或 SOM。
