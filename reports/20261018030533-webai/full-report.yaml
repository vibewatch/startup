    summary: >-
      Public evidence points to a consultative enterprise and public-sector revenue path built on customer-owned
      hardware, while gross-profit and pricing conversion remain undisclosed.
    data:
      nodes:
        - id: friction
          label: Enterprise AI friction
          valueNote: 25% to production; <60% daily usage among workers with access
          note: Buyers need deployment and adoption solved together, not just model access.
