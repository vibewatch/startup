      - number: '4.2'
        title: Delivery economics likely benefit from local inference, but unit economics are mostly undisclosed
        blocks:
          - type: paragraph
            body: >-
              webAI's product and documentation emphasize running inference on customer-owned hardware with automatic
              routing across browser, Apple Silicon, and CPU backends. That matters financially: if customers supply the
              device or cluster, a larger share of inference infrastructure burden can sit with the buyer instead of
              with webAI's own cloud bill. The January 2025 Winter Release also claims cluster management and more than
              20,000 concurrent requests per minute, which at minimum suggests the company is selling throughput,
              orchestration, and workflow integration rather than a thin chat wrapper. Even so, public disclosures stop
              well short of decision-grade unit economics. There is no retained public evidence on gross margin,
              services attach rate, implementation cost, CAC, payback, or customer retention by cohort, so the favorable
              local-inference narrative should be treated as a gross-margin hypothesis rather than a proven operating
              profile.
