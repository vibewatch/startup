  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow fit
        blocks:
          - type: paragraph
            body: >-
              webAI's public product surface reads like a sovereign AI workspace plus a broader platform, not a single
              chatbot. The getting-started documentation describes a desktop environment where People, Personas, and
              shared Spaces work together on hardware the customer controls, while third-party profiles expand that
              surface into Navigator, Companion, Runtime, webFrame, Network, CLI, and vertical solutions such as
              multimodal retrieval, anomaly detection, and edge vision. That mix suggests the company is trying to sell
              both an end-user interaction layer and the underlying platform needed to build and run specialized models
              around proprietary workflows. The open question is commercial maturity by module: the retained evidence
              names many surfaces, but independent adoption depth by SKU is still thin.
            claimRefs:
