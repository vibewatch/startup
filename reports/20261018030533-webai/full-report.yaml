      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >
              The visible customer pattern points to four buyer shapes rather than one homogeneous "AI buyer." First are
              enterprise platform and IT leaders who need private copilots, retrieval, and model orchestration on owned
              infrastructure. Second are operations leaders who want AI embedded inside a live workflow, such as
              inspections, compliance, or aircraft turnaround, where adoption depends on fitting the existing process
              instead of forcing a new one. Third are public-sector and defense program owners who need local execution
              when the cloud is unavailable or disallowed. Fourth are internal developer or ML-platform teams that need
              model conversion, telemetry, and bespoke integration. In each case, the user may be a frontline employee,
              analyst, or internal builder, but the payer is more likely to be a platform, operations, or
              mission-program budget than a self-serve seat purchaser.
            claimRefs:
              - CM003
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM012
              - CM015
      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >
              The main demand drivers are explicit in the evidence: data sovereignty, low-latency local execution,
              resilience when connectivity is poor, and the promise of more predictable economics than cloud-dependent
              AI. That logic is strongest in regulated and mission-critical settings, which is why webAI highlights
              defense, aviation, manufacturing, healthcare, and financial-services use cases. The constraints are just
              as important. The same public material says enterprise AI often stalls on infrastructure, security
              reviews, and integration complexity; the product documentation also shows that deployment quality depends
              on hardware tiers spanning roughly 4 GB to 64+ GB of memory. The evidence is also announcement-heavy: PR
              Newswire remains an active company-controlled outlet, but it does not disclose pricing, customer counts,
              or segment economics. Until those data exist, investors should treat market size and adoption speed as
              partially proven rather than settled.
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
