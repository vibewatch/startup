  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest reading of the assigned evidence is that webAI has enough product and category
              differentiation to stay investable, but not enough public operating disclosure to justify a conviction buy
              at the disclosed price. The January 2026 financing is repeatedly described as a $2.5 billion pre-money
              round, yet the company announcement does not disclose the round amount and independent trackers do not
              agree on cumulative capital raised. That combination matters because valuation discipline here depends
              less on whether sovereign AI is interesting and more on whether monetization quality, customer breadth,
              and financing terms can support the mark. Until that proof exists, the right posture is to keep the name
              active, demand a fuller KPI pack, and re-underwrite only when the entry terms are clearer.
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV001
              - CV004
              - CV014
              - CV010
              - CV011
      - number: '8.2'
        title: What the public record actually supports
        blocks:
          - type: paragraph
            body: >-
              The bullish part of the file is real: webAI consistently positions itself around sovereign, local-first
              deployment on customer-controlled infrastructure, and the technical documents show concrete local backends
              rather than a vague AI narrative. The weak point is not product imagination; it is valuation support.
              Independent directory-style profiles still do not publish pricing, do not provide audited economics, and
              in one case explicitly say the profile reflects company statements rather than an independent audit. Those
              profiles help confirm that webAI is being discussed in the market and that a few reference customers or
              sectors recur, but they are not substitutes for revenue quality, customer concentration, renewal behavior,
              or a real comparable set.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario frame
        blocks:
          - type: paragraph
            body: >-
              The base case has to be milestone-based because no public revenue or cash-flow base is available for a
              conventional multiple or DCF exercise. In that frame, webAI earns continued attention because sovereign
              AI, local inference, and enterprise packaging could matter for regulated or mission-critical buyers. The
              upside case is that those attributes convert into a broad repeatable rollout motion before the market
              rerates local-AI infrastructure. The downside case is more familiar: if later disclosures show limited
              monetization, narrow customer breadth, or financing terms that heavily subordinate new money, the current
              headline valuation becomes a setup for compression or a down-round rather than outsized venture returns.
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The diligence path is therefore straightforward. First, ask for the 2026 revenue, ARR, gross margin, burn,
              runway, and retention pack, because without that operating bridge the current price cannot be tied to unit
              economics or exit math. Second, ask for the cap table and the exact preference stack from the January 2026
              and September 2026 financings, including any participation, seniority, or secondary components. Third,
              test whether the recurring proof points in public profiles represent a scalable enterprise cohort or only
              a small set of bespoke wins. A thesis break would be any combination of weak monetization disclosure,
              customer concentration, or financing terms that make the present mark look narrative-led rather than
              performance-led.
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Track webAI rather than buy at the current headline valuation until the company provides a KPI bridge and
              the financing stack behind the 2026 mark.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
          - type: callout
            title: Core underwriting gap
            body: >-
              The decisive missing evidence is not product vision; it is revenue quality, customer breadth, and
              capital-structure transparency.
            calloutType: risk
            claimRefs:
              - CV007
              - CV010
              - CV015
