      - number: '5.2'
        title: Local execution architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest technical evidence is in webAI's own documentation. The on-device AI page says models run
              directly on local hardware with no cloud API or network dependency, then breaks execution into three
              backends: WebGPU for browser-native GPU inference, MLX for Apple Silicon desktops, and llama.cpp as a CPU
              fallback. The same page also describes automatic hardware routing, model tiers keyed to memory, and LoRA
              adapters attached through Personas. Taken together, the architecture appears optimized for matching model
              size and inference runtime to the deployment surface rather than forcing one model stack everywhere. That
              is directionally credible for a local-first product, but the retained public docs still do not give
              audited throughput, latency, or reliability benchmarks by backend.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE011
              - CE014
