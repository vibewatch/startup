      - number: '3.1'
        title: Landscape and alternative solution classes
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool does not support a clean, one-dimensional peer list. Instead, it supports a
              layered competitive landscape. AI Market Watch explicitly names Mistral AI, SambaNova Systems, and Ollama
              as the main competitors, which spans sovereign/private model vendors, on-prem enterprise AI
              infrastructure, and local model runtimes rather than a single product category. webAI's own materials
