  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Disclosed revenue model is enterprise-led, but published monetization detail is thin
        blocks:
          - type: paragraph
            body: >-
              The retained official pages describe webAI as an enterprise platform sold into private, on-premise, and
              public-sector deployments rather than as a mass-market cloud API. The most concrete monetization evidence
              in the assigned pool is a $14.5 million firm-fixed-price Army award. Product materials identify Navigator,
              Infrastructure, and Companion and refer to enterprise rollout, but they do not publish a billing unit,
              list price, contract duration, or revenue mix. AGENCCY likewise records the business model as not stated
              and pricing as not published. A low-reputation Fueler article does publish exact tiers, but it describes
              webAI as a cloud-first browser SaaS product, directly conflicting with the company's local-first
              architecture. Those figures therefore indicate a namesake or attribution failure rather than usable
              pricing evidence. The defensible conclusion is that webAI has commercial deployment pathways, while public
              evidence is too weak to forecast software, services, or contract mix.
