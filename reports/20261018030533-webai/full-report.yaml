              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A substantiated misrepresentation finding, failed Army acceptance or security review, or material field
              reliability issue would directly challenge webAI's mission-critical positioning.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR016
          - type: callout
            title: Evidence required before risk can be underwritten
            body: >-
              Obtain the litigation docket, Army statement of work and acceptance record, independent security
              assurance, customer-verified deployment cohorts, and financial disclosures covering pricing,
              concentration, burn, and financing terms.
            calloutType: recommendation
            claimRefs:
