      - number: '4.3'
        title: Capital and contract disclosures show activity, but adequacy remains unknowable
        blocks:
          - type: paragraph
            body: >-
              The clearest current financing signal is management's January 2026 announcement of an oversubscribed round
              at a $2.5 billion pre-money valuation. The amount was not disclosed; management said the capital would
              support Intelligence Labs, platform scaling, and customer rollout. Funding raised is not cash available,
              and the announcement does not reveal cash on hand, burn, runway, debt obligations, liquidation
              preferences, or the next-round trigger. Separately, the October 2026 $14.5 million firm-fixed-price Army
              award shows a contracted public-sector deployment, but contract value is not recognized revenue, cash
              received, or gross profit. The historical round chronology belongs in Company Overview; for forward
              capital adequacy, the retained evidence remains insufficient to determine financing duration or whether
              flagship awards convert into repeatable commercial revenue.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
