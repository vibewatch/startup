              - CU011
              - CU012
      - number: '6.3'
        title: Expansion logic is visible; durability metrics are not
        blocks:
          - type: paragraph
            body: >-
              webAI's public messaging emphasizes deployment outcomes rather than volume metrics. The manifesto says
              success is measured by specialized models deployed and real-world value created, and the January 2026
              funding announcement says new capital will expand customer rollout programs after traction across public
              sector and enterprises. Those disclosures support a land-and-expand narrative built around
              implementation-heavy, mission-critical deployments, especially when combined with the Forge channel model.
              However, none of the cited materials provide NRR, GRR, logo retention, churn, renewal cadence, contract
              length, or cohort performance. The company may have strong deployment-level adoption, but the current
              public evidence does not prove durability of revenue or breadth of repeat expansion across the installed
              base.
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU012
      - number: '6.4'
        title: The open diligence item is concentration, not whether any customers exist
        blocks:
          - type: paragraph
            body: >-
              This chapter supports the existence of real buyers and live deployments, but it does not support
              diversification. Public proof clusters around defense/public-sector work, a partner-led enterprise motion,
              and a few named case-study references in adjacent verticals such as wearables and aviation. AGENCCY leaves
              pricing unpublished and business model details unstated, and cautions that its profile is derived from
              company pages rather than an independent audit. That makes it difficult to connect deployment claims to
              ACV or payback. webAI's own commentary on Deloitte's 2026 enterprise AI survey says implementation,
              security review, and integration work commonly block production deployment. The result is a chapter with
              specific company-reported proof but material diligence gaps around concentration, procurement friction,
              and commercial durability.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disclosed relationships clear the concept-only threshold
            body: >-
              The Army contract and Forge commitment are specific commercial and deployment claims, although both are
              supported here by company-issued releases rather than independent original records.
            calloutType: strength
            claimRefs:
              - CU004
              - CU006
              - CU007
          - type: callout
            title: Durability still depends on private metrics
            body: >-
              Public evidence does not disclose retention, customer count, concentration, or pricing, so commercial
              repeatability remains a diligence item rather than a verified strength.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and representation risk
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal is Law360's January 2026 report that former engineers alleged in North
              Carolina state court that webAI allowed a "fake demo" and inaccurate presentations that endangered Qantas
              and U.S. Department of Defense deals. The available text is a subscription excerpt, so it establishes the
              existence and substance of reported allegations, not liability, adjudication, damages, or the present
              docket status. That distinction is investment-critical: enterprise and defense sales depend on technical
              representations surviving procurement and acceptance review. Separately, independent coverage of Project
              ARIA says no independently assessed security evaluation was disclosed. The immediate diligence priority is
              therefore the court record plus the Army's security, authorization, and acceptance evidence—not an
              inference that either an incident or a violation has already occurred.
            claimRefs:
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
      - number: '7.2'
        title: Operational reliability and distributed security
        blocks:
          - type: paragraph
            body: >-
              Project ARIA moves webAI from product claims into a demanding delivery environment: a $14.5 million
              firm-fixed-price program intended to run AI on existing handheld, laptop, and mounted hardware under
              denied or intermittent connectivity. Independent reporting identifies memory, battery, thermal,
              processor-compatibility, update-integrity, authorization, and synchronization challenges that accompany
              this design. webAI's own documentation reinforces hardware heterogeneity by listing three inference
              backends and model tiers ranging from 4 GB to 64+ GB of memory. Local execution and peer exchange are
              plausible mitigations, but the public record does not identify device counts, exact algorithms, supported
              Army hardware, field-test results, contractual deliverables, or an operational acceptance date. Those
              missing milestones leave residual execution and security exposure high until independently evidenced.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Dependency, adoption, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              webAI positions owned infrastructure as an escape from cloud dependency, but this shifts performance and
              lifecycle responsibility toward customer hardware, browser support, Apple Silicon, CPU fallbacks, model
              packaging, and disconnected fleet operations. Public relationship profiles name the Army, Oura,
              MacStadium, and Springshot, yet they do not provide revenue concentration, renewal, contract duration, or
              failure-remedy data. The strongest deployment outcome—100% adoption across Spirit Airlines' network in one
              hour and coverage of more than 500 daily flights—is a webAI-authored claim rather than independently
              audited customer proof. Financial opacity compounds this risk: AGENCCY reports that pricing and the
              business model are not published, while webAI's $2.5 billion pre-money financing announcement omits the
              round size. Investors therefore cannot connect valuation to revenue quality, margins, burn, or
              concentration.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR008
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring framework and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture should be monitored through evidence releases rather than categorical claims of safety or
              failure. Near-term positive indicators are Army acceptance on named hardware, disrupted-network test
              results, documented update and access-control mechanisms, independent security assurance, and repeatable
              customer deployments with measurable outcomes. Escalation triggers are an adverse court finding or
              substantiated misrepresentation, failure to pass Army acceptance or security gates, material field
              reliability problems, or inability to reproduce the company-reported adoption result with another
              customer. A financial thesis break would occur if undisclosed pricing, concentration, burn, or financing
              terms reveal economics inconsistent with the $2.5 billion pre-money mark. Until those records are
              produced, the matrix is qualitative diligence triage—not a measured incident-frequency model.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
