            body: >-
              webAI's public materials do not describe a single ICP; instead they point to three overlapping demand
              surfaces. AI Market Watch frames the target customer set as enterprises, government/public sector and
              defense agencies, plus individual professionals, while the webAI help center describes a desktop workspace
