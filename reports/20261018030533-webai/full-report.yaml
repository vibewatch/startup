            body: >-
              The assigned evidence supports a founder-led story centered on David Stout, who appears as co-founder and
              CEO across company and third-party sources. Independent profiles reviewed here place webAI's founding in
              2019 and identify Ethan Baird and Tyler Mauer alongside Stout in the original team, but the pool provides
