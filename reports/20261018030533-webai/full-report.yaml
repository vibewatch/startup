      - number: '6.2'
        title: Public adoption proof is real, but concentrated in a few named references
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof comes from disclosed named relationships rather than broad portfolio
              statistics. In September 2026, a webAI-issued release syndicated by Yahoo said Forge AI Deployment
              committed $30 million to build and deploy private AI systems for enterprise customers, showing a
              services-assisted route into accounts. In October, a webAI release and its syndicated copy said the U.S.
              Army awarded webAI Public Sector a $14.5 million Project ARIA contract; the company release attributes to
              an Army official a statement about delivery to soldiers at the tactical edge. Directory profiles add ŌURA,
              MacStadium, and Springshot, but one profile explicitly says it was compiled from webAI's own pages and is
              not an independent audit. The named set therefore mixes customers, partners, and company-derived
              case-study proof.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
          - type: table
