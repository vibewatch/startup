  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: sovereign deployment, not generic AI spend'
        blocks:
          - type: paragraph
            body: >
              The boundary that matters for webAI is narrower than "enterprise AI" in the abstract. Official and
              third-party descriptions consistently frame the product around running specialized models on hardware the
              customer already controls, keeping data local, and avoiding dependence on a centralized cloud API. That
              means the relevant spend is not every copilot seat or every model API call. It is the subset of software
              and infrastructure budget tied to private model deployment, orchestration, multimodal retrieval, and edge
              or fleet operation in settings where privacy, latency, resilience, or compliance change the buying
              criteria. The closest substitutes are generic cloud-hosted copilots, centralized inference APIs, and
              legacy pilots that never clear production requirements, which is why a broad generative-AI TAM would
              overstate webAI's practical addressable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Sizing the niche with adoption and deployment lenses
        blocks:
          - type: paragraph
            body: >
              The assigned pool does not provide an independently audited dollar TAM, SAM, and SOM for private
              local-first enterprise AI, so the best public sizing lens is behavioral and deployment evidence. webAI's
              Deloitte commentary cites a 2026 survey of more than 3,200 leaders across 24 countries, which shows broad
              enterprise interest in AI, but it also shows the market narrows sharply when the test becomes production
              conversion and daily workflow usage. Only 25% of companies had moved 40% or more of experiments into
              production, and fewer than 60% of workers with tool access used AI daily. Those filters make webAI's niche
              look more like a constrained deployment market than a blanket software category. Proof points such as
              Spirit Airlines' 500+ daily-flight rollout and the Army's $14.5 million Project ARIA award show there is
              real spend inside that niche, but not enough to backfill a clean SAM or SOM.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
