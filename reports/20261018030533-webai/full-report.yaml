    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and current product surface
        blocks:
          - type: paragraph
            body: >-
              The cleanest identity through-line in the current source pool is that webAI is building a sovereign AI
              stack that keeps inference and orchestration on hardware the customer controls. Company-authored sources
              repeatedly frame the product around collaborative intelligence, specialized models, and local deployment,
              while independent profiles describe the company as Austin-based and founded in 2019. The developer
              documentation makes the operating model more concrete than the marketing site did in this fetch set: webAI
              says inference can run without a cloud API or network dependency, and its current documentation describes
              a desktop workspace where people, Personas, and shared Spaces can work together with intelligence running
              close to customer data. Public business-model detail is thinner than the product narrative; one
              independent profile explicitly lists pricing as unpublished and the business model as not stated, so later
              chapters should treat monetization structure as an open diligence item rather than a settled fact.
