        title: Durability, switching cost, and open risks
        blocks:
          - type: paragraph
            body: >-
              The current pool supports a thesis that webAI can create switching cost through private data integration,
              owned infrastructure, and deployment into hard-to-serve environments, but it does not prove durable moat
              on price or measurable performance versus named peers. AGENCCY's profile says pricing is not published,
              and none of the retained competitor references provide normalized seat, token, or infrastructure pricing
              for Mistral, SambaNova, or Ollama. The Deloitte commentary on pilot-to-production friction helps explain
              why architecture and workflow embedding may matter, yet it is still company-issued interpretation rather
              than an independent benchmark study of win rates. The practical conclusion is that webAI's strongest flank
              appears to be sovereign, regulated, or disconnected deployments, while commoditization risk remains
              under-tested anywhere buyers mainly care about model quality, tooling breadth, or transparent economics.
