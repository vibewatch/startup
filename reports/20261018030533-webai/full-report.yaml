      - number: '4.4'
        title: 'Financial verdict: credible demand proof, but still a track-and-underwrite-later file'
        blocks:
          - type: paragraph
            body: >-
              Financially, webAI has enough public evidence to show that customers pay for private AI deployment and
              public-sector programs, and that investors funded the thesis in early 2026. What it does not have is the
              disclosure set needed to underwrite revenue quality or margin path: no reliable list pricing, realized
              pricing, revenue, ARR, gross margin, burn, runway, customer concentration, or retention appears in the
              retained pool. Management's manifesto also frames success around models deployed and outcomes created
              rather than user counts, which is strategically coherent but analytically limiting. The $14.5 million Army
              award is a meaningful demand signal, not proof of revenue recognition, margin, backlog conversion, or
              customer diversification. The financial verdict is therefore credible commercial momentum with material
              private-data dependencies, not a business whose unit economics or capital adequacy can already be modeled
              from public evidence.
