      - number: '5.3'
        title: Deployment proof and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The best public deployment proof in this pool is operational rather than benchmark-driven. webAI's October
              2026 Army post describes software running directly on laptops, handhelds, and mounted compute already in
              the field, with the Intelligence Delivery Network coordinating collaboration under denied, disrupted,
              intermittent, and limited connectivity. TechEdgeAI's independent write-up of the Forge partnership
              supports the same operating model from a different angle: webAI provides the platform, while the
              deployment partner handles architecture, integration, secure installation, optimization, and ongoing
              operations. That operating model matters because it also defines the burden on customers. A local,
              customer-controlled stack can reduce cloud dependency, but it asks the buyer or integrator to own hardware
              fit, lifecycle management, monitoring, and parts of the security and operations envelope.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
      - number: '5.4'
        title: Differentiation, controls, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              webAI's differentiation story is consistent across company and third-party sources: it is selling
              sovereign, on-device, multi-model intelligence that runs near the customer's data rather than through a
              public-cloud API. That positioning is strategically coherent, especially for regulated, defense, or edge
              environments, and it is reinforced by the company's emphasis on local execution, hardware routing, and
              specialized Personas. But public evidence remains stronger on architecture than on assurance. The retained
              sources support privacy, local control, and implementation flexibility, yet they do not independently
              validate named security certifications, uptime history, or production-scale performance claims across
              enterprise deployments. For underwriting, the core technical debate is therefore not whether webAI has a
              plausible local-first architecture; it is whether the company can prove that architecture is repeatable
              and supportable at scale.
            claimRefs:
              - CE008
              - CE009
