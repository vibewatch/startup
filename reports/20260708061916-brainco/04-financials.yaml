    {
      "id": "cost-structure-and-capital-intensity",
      "title": "Cost structure, margin drivers, and capital intensity",
      "body": "BrainCo’s cost base is likely meaningfully more complex than a software-only neurotech startup. FocusCalm already implies hardware COGS, app support, content or program development, shipping, and customer support. The prosthetics business adds further burdens: custom fitting, clinician onboarding, coding support, trialing, device updates, and likely warranty or maintenance complexity. BrainCo’s own about page claims more than $500 million in R&D funding and a scientist-heavy workforce, while the public patent record shows active work on neurofeedback gaming and robotic-device manipulation. Red Dot and PRNewswire descriptions of the intelligent bionic hand point to EMG sensing, AI control, and individually programmable gestures, all of which imply substantial engineering effort and potentially higher bill-of-materials or support costs than a basic wearable. Public-welfare and disability-assistance programs can widen reach but may not convert directly into high-margin commercial revenue. The result is a business with several plausible gross-margin profiles inside one company: consumer headbands could improve with scale, institutional programs may have services content, and prosthetics likely remain the most capital- and support-intensive line. Public sources show the complexity, not the actual margin outcome.",
