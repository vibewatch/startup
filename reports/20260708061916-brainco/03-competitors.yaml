    {
      "id": "switching-costs-substitutes-and-moat",
      "title": "Switching costs, substitutes, and moat durability",
      "body": "Switching cost is where BrainCo’s two businesses separate most clearly. For consumer headbands, multi-homing is easy: a buyer can switch from FocusCalm to Muse or try a cheaper substitute with relatively low hardware retraining cost. That puts pressure on BrainCo to win through content, habit formation, team features, and customer support rather than through deep lock-in. Emotiv and Neurosity add another form of pressure by setting a technical benchmark for users who value raw data, channel count, or developer flexibility over coaching content. For schools and institutions, trust becomes a competitive variable: BrainFutures notes no available Focus EDU research, VICE documents the 2019 backlash, and Hunterbrook raises fresh questions on data governance, all of which could push buyers toward lower-risk wellness tools or toward doing nothing. In prosthetics, by contrast, switching costs are higher because fitting, clinician relationships, reimbursement, and training all create inertia. That benefits incumbents such as Ottobock, but it also means that if BrainRobotics secures clinical trust and coverage, its installed users may be stickier than FocusCalm users. Overall, BrainCo’s moat is not yet clearly sensor-led; it is a bundle of product packaging, institutional workflows, affordability claims, and channel execution that remains vulnerable if larger or better-trusted rivals respond aggressively.",
