    {
      "id": "prosthetics-and-incumbents",
      "title": "Prosthetics competition and channel power",
      "body": "BrainRobotics faces a very different competitive logic in prosthetics. Open Bionics’ Hero Arm page emphasizes affordability, a 340g standard hand, six grips, an 8kg lift capacity, children as young as eight, and a U.S. clinic network with insurance and funding support materials. Ottobock’s public shop pages are less consumer-friendly but reveal exactly why the company is hard to displace: Myo Plus sits inside a broader reimbursement and clinical-services ecosystem, and the bebionic hand page highlights multiple wrist options, PDAC verification, suggested HCPCS coding, reimbursement documents, and broader support infrastructure. BrainRobotics’ own public surfaces emphasize software-driven prosthetics and, in the Kneuro knee page, PDAC approval and clinician guides. Independent third-party descriptions, however, give more detail on BrainCo’s hand itself. Red Dot describes BrainRobotics’ AI hand as cost-effective, EMG-controlled, and individually programmable, while BrainCo’s 2025 PRNewswire release claims the Intelligent Bionic Hand is the world’s first mass-produced prosthetic hand with intuitive single-finger control. The competitive lesson is that BrainCo may have a strong accessibility narrative, but incumbents and specialists still hold meaningful advantages in clinic relationships, reimbursement services, and installed base.",
