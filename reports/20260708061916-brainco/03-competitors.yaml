  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "BrainCo competes in two quite different arenas at once: consumer/institutional EEG headbands where Muse, Emotiv, Neurosity, and NeuroSky define the field, and intelligent prosthetics where Open Bionics, Ottobock, and other channel-rich incumbents shape expectations. The direct competitive takeaway is that FocusCalm’s strongest differentiation is packaging and team-oriented use cases rather than a clearly superior sensor moat, while BrainRobotics must compete against prosthetics vendors with deeper reimbursement and clinic infrastructure. Big-tech wearables such as Apple Watch and Samsung Galaxy Ring are not EEG competitors, but they are substitute wellness devices that compress attention and budget for general stress, sleep, and recovery tracking."
  },
  "sections": [
    {
      "id": "landscape-and-classes",
      "title": "Landscape: direct peers, adjacents, and substitutes",
      "body": "BrainCo's competitive set is fragmented because its products solve more than one job. In EEG and neurofeedback, the closest direct peer is Muse: both products are non-invasive headbands sold into focus, calm, and brain-health routines, but Muse leans harder into meditation and sleep while FocusCalm leans into short-session performance training, games, and team management. Emotiv, Neurosity, and NeuroSky sit nearby but with a different posture. Their pages emphasize channels, raw data, developer or research use, and hardware specifications more than guided wellness content, making them stronger technical benchmarks than direct lifestyle substitutes. In prosthetics, the comparison set changes again. Open Bionics competes on affordability, clinic-network access, pediatric fit, and myoelectric functionality; Ottobock competes on reimbursement, product ecosystem, and incumbent clinical distribution; and other upper-extremity suppliers such as Fillauer expand the catalog even where public feature disclosure is thin. Outside those direct peers, Apple Watch and Samsung Galaxy Ring matter as indirect substitutes: they compete for wellness budget, sleep-tracking mindshare, and employer or consumer attention, even if they do not offer EEG neurofeedback or prosthetic control.",
