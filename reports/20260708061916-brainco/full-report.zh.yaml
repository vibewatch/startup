      - number: '8.4'
        title: 结论、上行触发因素与下行重估触发因素
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，BrainCo 像是一家一旦硬证据到来、估值就可能大幅上下摆动的公司。上行来自几类证明：FocusCalm 留得住付费用户，Kneuro 能把试用转成可报销装机，或公司的某条义肢 / BCI
              产品线拿到更清晰的监管和临床里程碑。公司结构透明、地缘政治噪音降低也会加分。下行则来自反面：付费留存弱、义肢转化停滞、学校或运动员信任冲击，或 BrainCo
              中国关联叙事带来的政策摩擦。同业参照会让判断更尖锐。Neuralink、Synchron、Precision 和 Neurolutions 都各自提供了更清楚的单线叙事——无论是高性能侵入式
              BCI、血管内务实路径、表面阵列规模，还是聚焦卒中康复。BrainCo 的宽度创造更多上行分支，也带来更多失望路径。总体看，公开证据支持把 BrainCo
              视为真实独角兽；但除非私人尽调补上披露缺口，估值区间上沿仍然脆弱。
