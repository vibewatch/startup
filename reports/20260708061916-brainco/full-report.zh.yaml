      - number: '8.3'
        title: BrainCo 适合哪种框架：硬件健康、医疗科技，还是战略期权价值？
        blocks:
          - type: paragraph
            body: >-
              没有单一框架能干净套住 BrainCo。纯消费者健康倍数语境太窄，会漏掉义肢和 BCI 平台故事。纯医疗科技倍数也不完整，因为 BrainCo
              在正式监管状态和经常性报销经济性上的公开证据太薄。最现实的框架是混合战略期权估值：投资人付钱买的是一组可能终局，而不是一台已经优化好的现金引擎。这些期权包括消费者神经反馈、学校或训练工具、义肢、机器人邻近的灵巧手，以及更广泛的
              neuro-AI 应用。问题是，执行路径仍然可信时，期权价值才配得上高溢价。BrainCo
              的公开负面因素——学校监控争议、国家安全审视、治理披露有限、财务透明度缺位——意味着任何头部平台溢价都应打实质折扣。因此，最可辩护的估值立场不是“便宜”或“明显错”，而是“偏紧；除非非公开尽调显示收入质量、监管进展和客户耐久性强于公开材料，否则撑不住”。
