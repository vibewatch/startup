      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              BrainCo 不同产品线的用户、买方和付款方差异很大。在消费健康里，用户和付款方通常是同一个人，直接购买 FocusCalm 头带和订阅；但 FocusCalm 机构页面显示，BrainCo
              也越来越多通过机构销售动作变现：大学、职业球队、诊所、企业和医疗雇主可以获得 demo、团队门户、研究项目和批量定价。教育场景中，单个学生是用户，但预算所有权可能在学生健康中心、运动部门、教师健康项目、STEM
              项目赞助方或其他机构级买方手里。在这个细分市场，采用取决于某个推动者能否同时证明健康价值，以及让学生佩戴 EEG
              硬件的观感可以接受。假肢场景中，用户是截肢者，但临床经济买方是假肢师、诊所、医院或康复服务提供者，报销编码变成核心。BrainRobotics 的 Kneuro 页面突出这种差异：它强调 PDAC
              批准、报销支持和临床医生指南，而不是生活方式语言。这种分离意味着 BrainCo 不是把一个简单设备 SKU 卖进一条预算线；它在追逐多个市场，而各市场的产品市场匹配、销售周期和证据门槛都明显不同。
