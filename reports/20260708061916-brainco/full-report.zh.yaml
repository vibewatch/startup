      - number: '5.3'
        title: 产品组合广度、部署路径与技术一致性
        blocks:
          - type: paragraph
            body: >-
              BrainCo 公开材料的一个显著特征是广度。技术页把产品分为人机交互和 BCI 调控两类，把智能仿生手和膝关节产品与 FocusXin、StarKids、Easleep、OxyZen、FocusZen 和
              BrainAI 并列。这种广度支持“共享核心、多重包装”的解读：BrainCo 似乎在多个商业界面复用信号采集、AI 解读和 app 反馈模式，而不是从零搭建每个产品。但广度也带来执行风险。FocusCalm 以
              app 为主，且部分消费化；学校和儿童产品线意味着客户管理、隐私和培训负担；假肢需要临床医生导入、适配、文档和报销支持；Revo2
              手的人形机器人角度又把平台推向另一组买方。站在产品技术尽调角度，这既是优势也是警示。它说明 BrainCo
              不是单产品故事，但也意味着产品管理、质量体系、固件维护和证据生成很可能要服务非常不同的用户和渠道。公开材料显示一个一致的技术家族，但没有说明公司是否已在运营上完全拆分消费、教育、医疗和机器人路线图。
