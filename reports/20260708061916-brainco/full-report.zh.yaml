            body: >-
              BrainCo 的教育客户故事更复杂，因为它把有吸引力的 STEM 参与和实质信任风险绑在一起。较无争议的一面，NeuroRacing 页面明确把脑波驱动的轨道赛车套装卖给课堂和 makerspace，邀请
              demo，并直接面向学区沟通。更宽的 BrainCo 目录也仍列出 FocusXin 和 StarKids，说明学校和儿童 BCI 产品仍是公开产品组合的一部分。更具争议的一面，Tech in Asia 关于
              BrainCo
              中国学校试点的报道描述了小学生佩戴头带、颜色反映实时专注度；公司则称设备用于学校试验，并未卖给公立学校。这个区分很重要：试点活动和部署不是一回事，但即便是试验，如果家长或监管者把产品视为监控，也会产生声誉风险。站在客户角度，这个细分市场因此既有希望，也很脆弱。技术可以吸引想要
