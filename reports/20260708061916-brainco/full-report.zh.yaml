      - number: '7.3'
        title: 地缘政治、国家安全与跨境运营风险
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的美国—中国双重足迹可能有商业价值，但现在已是实质风险因素。House Energy & Commerce 的公告明确把 BrainCo
              描述为潜在国家安全隐忧，理由是中国国家关联的数据访问和运动员脑波采集。Hunterbrook
              也从调查新闻角度推进同一主题。每项指控最终是否决定性，几乎不是关键；实际后果是：一家公司一旦被卷入国家安全叙事，客户、合作伙伴、学校、雇主和运动员可能在监管出手前就犹豫。Treasury 的 CFIUS 页面和
              BIS 出口管理背景说明了结构性原因。AI、传感、人类表现数据、跨境所有权或供应链组合在一起，即使不是传统国防硬件，也可能引来审查。BrainCo
              还暴露在政策波动中：数据安全规则、出口管制、采购限制或制裁，变化速度可能超过创业公司的产品路线图。因此，地缘政治风险影响的不只是融资或头条；它可以直接削弱合作、市场准入、客户信任和最终退出选项。
