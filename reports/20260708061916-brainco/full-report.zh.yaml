  - id: TV004
    title: 估值框架表
    columns:
      - 框架
      - 适用理由
      - 不足
      - 对 BrainCo 的含义
    rows:
      - - 消费级健康硬件 + 应用
        - FocusCalm 有消费级定价、应用订阅和行为训练定位
        - 漏掉假肢、学校工具和机器人相邻资产
        - 上行空间看得太窄
      - - 医疗科技 / 器械平台
        - Kneuro、假肢和临床相邻工作流支撑器械平台叙事
        - 公开记录缺少足够监管和报销清晰度，难以做干净的医疗科技可比
        - 部分有用，但不完整
      - - 战略期权价值 / 平台
        - 产品组合覆盖多个 BCI 和辅助技术场景
        - 透明度弱时，平台溢价应打折
        - 最现实的标题视角
      - - 机器人 / 灵巧手可选性
        - Revo2 和仿生手故事增加非医疗上行分支
        - 机器人相邻业务可能永远变不成实质收入
        - 只是更远期的上行
      - - 中国硬科技增长叙事
        - 2026 年大额融资和杭州制造叙事契合这个框架
        - 地缘政治和治理担忧也会拉高折现率
        - 可以同时支撑估值和折价
      - - 公开市场 IPO 叙事
        - CB Insights 在 2026 年提到 IPO 传闻语境
        - 公开市场通常要求比 BrainCo 目前更多的披露
        - 有潜在上行，但尚未完成投资测算
    notes: 混合框架最能解释当前估值，也解释为什么这一估值仍显拉伸。
