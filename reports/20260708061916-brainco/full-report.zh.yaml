      - number: '2.4'
        title: 增长驱动、采用约束与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动真实存在。BCI 和神经反馈来源指向 AI 信号处理、更广泛的认知健康采用，以及神经康复兴趣延续。EdTech
              来源强调个性化学习、云交付和数字课程投资。假肢来源强调截肢者需求、老龄化和残障人群规模，以及肌电和传感器驱动硬件持续改进。但 BrainCo 的路径同样受约束塑造。学校采用要交一笔信任税：BrainFutures
              描述课堂注意力监测，VICE 记录 2019 年叫停浙江学校部署的反弹，Hunterbrook 提出新的数据治理和监控担忧。消费级和机构级神经反馈还依赖有效性证据，而证据比市场叙事更薄；BrainFutures
              明确列出 Focus EDU 没有可用研究。医疗端，FDA 的批准和许可框架说明，设备可能需要 510(k)、PMA 或 de novo 审查；欧盟 MDR 则建立另一套合规制度。BrainCo
              自己的假肢页面提到 PDAC 批准和报销支持，但留存公开资料仍缺少按产品拆分、覆盖美国、欧盟和中国的清晰监管地图。总体看，BrainCo
              受益于强劲品类增长，但限制速度的不是原始市场规模，而是信任、证据、报销和监管执行。
