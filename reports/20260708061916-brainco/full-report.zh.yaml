  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与相邻赛道
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的相关市场更适合理解为多个赛道的重叠，而不是单一品类。FocusCalm 业务位于非侵入式 BCI 和神经反馈 / 健康市场，EEG
              头带、软件和内容卖给追求专注、减压或表现提升的消费者和机构。教育页面以及 BrainFutures 对 Focus EDU 的描述显示，公司第二个切入口进入学校、大学和教师健康预算，并带有 STEM
              邻近教学用例。BrainRobotics 部门则把第三个切入口伸向智能假肢和康复硬件，买方是临床渠道而非消费者，报销比 app 参与度更关键。因此，宽泛 EdTech
              与宽泛假肢及矫形市场数据只能作为外边界：它们包含大量 BrainCo 并不直接变现的支出池。各细分的实际替代品也不同。消费者可以选择冥想 app 或竞品神经反馈头显；学校可以什么都不做，采用咨询或 SEL
              项目，或完全避开 EEG 监测；截肢者可以选择传统假肢或其他肌电供应商。市场定义很关键，因为任何单一 TAM 页都可能用全部 EdTech 支出夸大触达，也可能因忽略假肢和机构健康而低估机会。
