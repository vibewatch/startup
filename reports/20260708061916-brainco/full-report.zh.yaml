  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: FocusCalm 与 BrainCo 的非侵入式 BCI 栈
        blocks:
          - type: paragraph
            body: >-
              留存记录显示，BrainCo 卖的不是普通冥想头带。FocusCalm 的科学和工作原理页面描述了一个具体神经反馈闭环：EEG 头带读取电活动，app 用 AI
              算法把该活动与目标“专注且平静”特征对比，用户看到由 1,250 个脑波数据点计算出的 FocusCalm
              Score。同一材料把产品框定为三步系统——学习、练习、挑战——而不是一次性测量设备。隐私披露还补充了重要实现细节：原始 EEG 和 IMU 信号在移动 app 本地处理，只有计算后的分数会传输到 BrainCo
              服务器。这很重要，因为它说明 BrainCo 至少内置了一些端侧信号处理逻辑，而不是默认把原始生物识别数据流上送。更宽的 BrainCo.cn 目录把栈从 FocusCalm 扩展到
              FocusZen、OxyZen、Easleep、FocusXin 和 StarKids。公开来看，这像是一个模块化非侵入式 BCI 平台策略：一个感知 /
              控制核心，多个商业包装，横跨专注训练、正念、睡眠和教育邻近用例。仍薄弱的是硬技术细节，比如当前产品组合各产品的电极数量、验证样本规模、分类器漂移管理或模型更新做法。
