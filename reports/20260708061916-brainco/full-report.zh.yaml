      - number: '5.2'
        title: 假肢控制栈：BrainRobotics 手部产品脉络与 Kneuro 膝关节
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的假肢证据比“智能肢体”这种模糊标签扎实得多。较早 Red Dot 对 BrainRobotics 手的报道描述了一款 AI
              假肢：它围绕肌电传感器搭建，捕捉残肢信号，把信号翻译成动作，并允许几分钟内编程手势，而不是只依赖少量固定动作库。BrainCo 自己 2026 年手部文章使用类似表述，称智能仿生手解读残肢的 EMG
              和神经电信号以推断用户意图。更新的 Revo2 材料则显示平台走向：Red Dot、iF Design 和 The Robot Report 都描述了一只更轻的灵巧手，带触觉感知、50-newton
              握力、20-kilogram 负载，并同时适用于康复和人形机器人。下肢端，Kneuro 文件组对于一家私营初创公司来说异常丰富。产品简报、用户指南、临床医生指南、编码指南、PDAC
              信函和报销支持文件共同描述了一款微处理器膝关节，具备交替上楼、走跑切换、防绊倒恢复、app 配置、5-day 续航、330-pound 体重上限，以及面向报销的 L-code 定位。因此，公开来看，BrainCo
              不太像概念阶段神经科技公司，更像一家在上肢和下肢品类中具备真实控制系统和设备集成执行力的公司。
