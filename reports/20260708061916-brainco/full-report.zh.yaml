  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 围绕 FocusCalm 的消费者、教练和健康用户
        blocks:
          - type: paragraph
            body: >-
              最容易验证的客户界面，是 FocusCalm 面向消费者和从业者的产品栈。App Store 和 Google Play 列表显示，移动产品仍在线，有订阅计划和头带加 app 的工作流，而不是纯硬件销售。App
              Store 列表还给出实用客户细节：支持 iPhone、集成 Apple Health、提供年度和月度订阅、53 个评分下为 3.9/5，并围绕压力管理、睡前准备、运动、工作和学校表现包装功能。FocusCalm
              自己的评论和结果页面把图景从个人消费者扩展到教练、临床医生、雇主、护士和运动员。留存证言显然带有宣传性，但确实显示公司试图落地多个真实用户群，而不只是卖给爱好者。重要的是，客户价值主张是行为层面的，而不是医疗层面的：在短时段中训练平静、专注和韧性，再长期跟踪深度、一致性、速度和
              FocusCalm
              分钟数等指标。这个主张可能打动消费者和表现专业人士，但也意味着需求耐久性取决于习惯养成、感知效果和对神经反馈主张的信任，而不只是临床医生处方。公开证据支持产品存在和一定使用广度；不足以支持对留存、付费转化或
              NPS 强度的强结论。
