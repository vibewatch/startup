      - number: '1.2'
        title: 创立故事、Harvard 根源与公开领导层记录
        blocks:
          - type: paragraph
            body: >-
              在留存公开资料中，创始人身份比更宽泛的实体结构更一致。Newswire、MIT Technology Review、BrainFutures 和 World Economic Forum 都把 Bicheng
              Han 标为创始人兼 CEO，并把公司起点放在 2015 年前后的 Harvard 脑科学研究和 Harvard Innovation Lab。各来源表述略有差异——有的说 2015 年 2
              月成立，有的强调孵化，有的描述 Harvard Center for Brain Science PhD 背景——但重叠部分足够强，可以把 Han 主导的 2015 年 Harvard
              孵化视为公开标准起源故事。更不透明的是当前高管梯队。留存的美国官方页面突出列出 Kevin Ufferfilge、Kendra Walker、Brian Varga 和 Ian Karman
              等商业团队成员，较早新闻稿则提到产品设计师 Sunny Guo。留存官方页面没有发布完整的现任董事会名单、股权图或正式公司治理页。这让 BrainCo 看起来仍由创始人驱动，围绕 Han
              存在明显关键人集中；公开团队界面比单一创始人更宽，但仍薄于正常后期独角兽披露包。
