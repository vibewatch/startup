        blocks:
          - type: paragraph
            body: >-
              公开证据最强的地方是融资，而不是经营表现。CB Insights 披露，BrainCo 12 轮累计融资 USD 527.79 million，2026 年 1 月 Series B-II 轮融资 USD
              272.22 million；EHangzhou 和 Pandaily 则描述了一笔约 RMB 2 billion / USD 280-288 million 的融资，用于加速核心 BCI
              研发、工程、制造和商业化。Neurofounders 称其为神经科技史上最大融资之一，BrainCo 自己的公开叙事也继续强调深度 R&D
              野心。从一般偿付能力角度看，这有帮助，但不足以承销跑道。留存来源没有披露当前现金、月度 burn、库存义务、工厂或工具 capex，或除 CB Insights 报道的宽泛 2026 年 IPO
              传闻之外的下一轮触发条件。负面一面同样重要：Hunterbrook 认为公司故事仍高度依赖融资和叙事；学校或国际市场出现信任冲击，可能拉长销售周期并抬高合规成本。财务上，相较许多初创公司，BrainCo
              看起来资金充足；但硬件、AI 和假肢商业化通常会在产生透明、高质量经常性收入之前消耗大量资本，因此公司仍高度依赖外部融资。
