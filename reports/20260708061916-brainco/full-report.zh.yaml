  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律结构与运营足迹
        blocks:
          - type: paragraph
            body: >-
              留存来源里，目前最清晰的美国法律界面不是 BrainCo 详细公司页，而是 FocusCalm。FocusCalm 条款写明，服务由 BrainCo, Inc.（DBA FocusCalm）运营；多个
              FocusCalm 页面把 Massachusetts 州 Somerville 的 120 Beacon Street 列为联系地址。这支持其确有美国商业实体，也解释了为什么早期新闻稿称 BrainCo 总部在
              Boston。与此同时，较新的中国侧资料和调查报道把公司描述为总部在 Hangzhou，并在 Hangzhou Future Sci-Tech City
              运营。因此，最能调和证据的看法不是单一总部故事，而是双界面结构：一端是 Somerville 的商业和品牌存在，绑定 FocusCalm 及 Harvard 起源叙事；另一端是更大的 Hangzhou
              运营中心，承载当前制造、融资和中国政府可见度。由于留存资料中 BrainCo 没有发布简明的集团结构页，后续章节应谨慎处理美国和中国引用，引用具体产品或实体，而不是预设一个统一合并的法律边界。
