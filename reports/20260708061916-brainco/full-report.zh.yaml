            body: >-
              BrainCo 的成本基础很可能比纯软件神经科技初创公司复杂得多。FocusCalm 已经意味着硬件 COGS、app
              支持、内容或项目开发、发货和客户支持。假肢业务又增加负担：定制适配、临床医生导入、编码支持、试用、设备更新，以及可能存在的保修或维护复杂度。BrainCo 自己的 about 页面称公司拥有超过 $500
              million R&D 资金和科学家密集型员工队伍；公开专利记录显示，公司在神经反馈游戏和机器人设备操控上持续投入。Red Dot 与 PRNewswire 对智能仿生手的描述指向 EMG 传感、AI
              控制和可单独编程手势，这些都意味着大量工程投入，以及可能高于基础可穿戴设备的物料清单或支持成本。公益和残障援助项目可以扩大触达，但未必能直接转化为高毛利商业收入。结果是，一家公司内部存在几种可能的毛利轮廓：消费级头带可随规模改善，机构项目可能含有服务内容，假肢则可能仍是资本和支持最密集的产品线。公开来源显示复杂性，但没有显示真实毛利结果。
