  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 披露估值区间与资本基础
        blocks:
          - type: paragraph
            body: >-
              公开估值里最硬的一条来自 CB Insights：BrainCo 2026 年 1 月的估值被报道为约 $1.03B 到 $1.30B 的区间，12 轮累计融资 $527.79M，并在 January 6,
              2026 完成 $272.22M 的 Series B-II 融资。EHangzhou 和 Pandaily 佐证了约 RMB 2 billion / $280-288M 的融资，并将其定义为 BCI
              领域的里程碑融资。从表面看，这一资本底座给了 BrainCo 实质地位；它不是种子期科研项目。但同一份公开记录也让估值解读变得困难，因为它缺少晚期投资人通常会看的支撑指标：收入 run
              rate、毛利率、现金消耗、用户数、合同集中度、报销转化和客户留存。因此，估值更多押在叙事和可选性上，而不是已披露财务复利。换句话说，资本市场已经把 BrainCo
              定价为一个战略性神经技术平台，旁边连着消费者、教育、义肢和机器人业务。业务是否已用透明经济性挣到这份溢价，公开材料仍无法证明。
