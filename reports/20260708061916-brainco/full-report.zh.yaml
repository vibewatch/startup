      - number: '3.3'
        title: 假肢竞争与渠道权力
        blocks:
          - type: paragraph
            body: >-
              BrainRobotics 在假肢领域面对的是完全不同的竞争逻辑。Open Bionics 的 Hero Arm 页面强调可负担性、340g 标准手、六种抓握、8kg 提举能力、低至 8
              岁儿童可用，以及带保险和资金支持材料的美国诊所网络。Ottobock 的公开商店页面对消费者不够友好，但恰好说明它为什么难以被替代：Myo Plus 嵌在更宽的报销和临床服务生态中；bebionic
              手页面突出多种腕部选项、PDAC 验证、建议 HCPCS 编码、报销文件和更广的支持基础设施。BrainRobotics 自己的公开界面强调软件驱动假肢；在 Kneuro 膝关节页面则强调 PDAC
              批准和临床医生指南。不过，独立第三方描述给出了 BrainCo 手部产品本身的更多细节。Red Dot 称 BrainRobotics AI 手具备成本效益、由 EMG 控制且可单独编程；BrainCo 2025
              年 PRNewswire 新闻稿则称 Intelligent Bionic Hand 是全球首个量产、具备直观单指控制的假肢手。竞争启示是，BrainCo
              可能有很强的可及性叙事，但既有厂商和专业公司仍在诊所关系、报销服务和装机基础上握有明显优势。
