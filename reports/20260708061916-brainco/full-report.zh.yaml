              IP 和监管图景有实质内容，但并不单纯。BrainCo 公开专利页显示，公司围绕用电子游戏做神经反馈训练、操控机器人设备等方向提交了专利，这与其神经反馈和假肢叙事方向一致。Kneuro 的报销材料更具体：下载的
              PDAC 批准信以及编码 / 报销指南显示，BrainCo 正在既有假肢计费和覆盖工作流内运作，而不是只靠消费者营销商业化。BrainRobotics 引用的 CMS 材料支持覆盖语言对下肢假肢的重要性，尤其是在
              K2 微处理器膝关节覆盖标准演进时。与此同时，留存公开记录仍留下明显缺口。已审阅的 FocusCalm 和 BrainCo
              产品页面没有给出设备规格和试验细节包，外部人士无法按医疗设备标准验证有效性主张。已审阅的公开材料也没有浮现 FocusCalm、智能仿生手或 Kneuro 的清晰 FDA 许可编号。用户要求覆盖
              BrainBot，但本轮留存来源没有找到当前 BrainBot 产品页，内容足以把它当作有充分记录的产品线。正确的尽调结论是，BrainCo
              有真实技术产物和商业化脚手架，但公开披露仍没有充分说明验证、监管状态，以及部分相邻产品的成熟度。
