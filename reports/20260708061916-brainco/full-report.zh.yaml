      - number: '7.2'
        title: 隐私、伦理与儿童数据风险
        blocks:
          - type: paragraph
            body: >-
              BrainCo 最显眼的声誉风险来自面向儿童和贴近课堂的使用场景。FocusCalm 隐私通知方向上是正面的：它称原始 EEG 和 IMU 信号在本地处理，只把计算后的分数传到 BrainCo
              服务器。这样能缓解部分消费者担忧。但教育叙事难得多。Tech in Asia
              关于中国学校试点的报道描述，教师通过头环颜色状态实时监控学生专注度；争议本身说明，脑数据产品很快会从“赋能”符号变成“监视”符号。FTC COPPA
              指引也说明，这不只是公关问题：面向儿童或牵涉儿童的数字产品，即使不完全是“儿童网站”，也可能触发额外隐私义务。BrainCo 公开目录仍包含 FocusXin 和
              StarKids，说明公司并未完全退出儿童和学校邻近类别。从风险看，教育和青少年部署可能成为一个细分市场：隐私设计、同意机制和社会合法性比产品表现更重要。公司可以扛过平庸的参与度指标；但如果叙事变成“在缺乏足够保障措施的情况下采集儿童脑数据”，就难得多。
