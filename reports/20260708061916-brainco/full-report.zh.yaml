      - number: '3.4'
        title: 切换成本、替代品与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              切换成本最能看出 BrainCo 两类业务的分化。消费级头带很容易多归属：买方可以从 FocusCalm 换到 Muse，或尝试更便宜的替代品，硬件再训练成本相对较低。这迫使 BrainCo
              通过内容、习惯养成、团队功能和客户支持取胜，而不是靠深度锁定。Emotiv 和 Neurosity
              还提供另一种压力：它们为那些看重原始数据、通道数或开发者灵活性超过教练内容的用户设定技术基准。学校和机构里，信任会成为竞争变量：BrainFutures 提到 Focus EDU 没有可用研究，VICE 记录
              2019 年反弹，Hunterbrook 提出新的数据治理问题，这些都可能把买方推向更低风险的健康工具，或干脆什么都不做。假肢则相反，切换成本更高，因为适配、临床关系、报销和训练都会产生惯性。这有利于
              Ottobock 等既有厂商，但也意味着，如果 BrainRobotics 拿到临床信任和覆盖，其已安装用户可能比 FocusCalm 用户更黏。总体看，BrainCo
              的护城河还不是清晰的传感器领先；它是产品包装、机构工作流、可负担性主张和渠道执行的组合。如果更大或更受信任的对手积极回应，这个组合仍会脆弱。
