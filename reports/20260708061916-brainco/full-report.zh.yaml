      - number: '1.5'
        title: 负面信号与后续章节必须解决的关键缺口
        blocks:
          - type: paragraph
            body: >-
              概览章节最重要的尽调启示是，BrainCo 的公开记录并不只是干净的宣传材料。Vice 记录了 2019 年浙江课堂注意力监测头带引发的反弹：隐私担忧在网上扩散后，官方要求一所学校停止使用。Hunterbrook
              随后把审视升级，指称 BrainCo 接受过与政府有关且受制裁的中国实体资金，在继续使用 Harvard 品牌的同时把总部转到 Hangzhou，并维持与公开否认相冲突的数据处理做法。FocusCalm
              在官网上作出罕见直接回应，称原始 EEG 和 IMU
              数据在本地处理、每次会话后清除、不与政府或军方共享，同时引用美国网络安全审计。回应缩窄了一条风险叙事，但没有解决全部问题：公开董事会构成仍不清楚，当前员工数未披露，留存记录里看不到精确的 FDA
              已批准设备标识，FocusCalm 美国实体与 BrainCo Hangzhou
              业务之间的法律或运营切分也只有很薄的记录。这些缺口很重要，因为它们影响投资者能给产品主张、监管表述以及当前独角兽估值的耐久性放多大权重。
