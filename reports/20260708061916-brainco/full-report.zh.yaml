        - 可检验聚焦临床去风险的价值
        - 市场和论点窄得多
      - - 消费级健康应用
        - 会强调订阅和留存纪律
        - 只看 FocusCalm 时，是有用的下行视角
        - 忽略假肢和 BCI 平台宽度
      - - 硬件 / 医疗科技平台
        - 会奖励监管、报销和转化清晰度
        - 如果 BrainCo 证明器械成熟度，这是有用的上行视角
        - 公开证据还不足以支撑完整溢价
    notes: 这是一组部分可比对象，用于框定估值视角，不是声称存在精确一一对应的倍数。
