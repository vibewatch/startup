  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、标价与变现结构
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的公开商业模式更像硬件加软件的混合栈，而不是单一 SaaS 或单一设备业务。FocusCalm
              产品页显示直接面向消费者的头带价格，对两台以上数量给出明确批量折扣提示，并用文字描述每位家庭或团队成员的终身会员。FocusCalm 的机构和医疗页面又叠加更多变现层：团队门户、自定义任务、批量定价、1 对 1
              和 1 对多部署选项，甚至类似联盟营销的职场项目。这意味着消费者标价只是一个收入界面；BrainCo
              可以合理地通过家庭、团队、诊所、大学和雇主渠道变现同一产品，各渠道实现经济性不同。假肢端，公开页面完全不像电商。BrainRobotics 强调试用、临床医生指南、编码支持和与 PDAC
              相关的商业化，说明收入由服务提供者工作流、报销和服务支持驱动，而不是 app
              订阅。结果是一种多收入流模式——消费级硬件、捆绑会员、机构健康合同和假肢项目——但公开证据停在变现机制层面，没有揭示规模、贡献毛利或经常性收入组合。
