      - 公开资本 / 估值信号
      - 估值视角贡献
      - 为何只能部分可比
    rows:
      - - Neuralink
        - 累计融资约 $1.3B，$650M Series E
        - 显示资本对 BCI 野心的顶级胃口
        - 侵入性和知名度都远高于 BrainCo
      - - Synchron
        - 累计融资约 $345M，$200M Series D
        - 显示临床路径清晰的里程碑能吸引多少资本
        - 血管内临床路径不同于 BrainCo 的混合模式
      - - Precision Neuroscience
        - 累计融资约 $155M，另有战略支持
        - 是严肃技术进展中间路线的有用可比
