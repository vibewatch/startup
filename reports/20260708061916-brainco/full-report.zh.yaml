  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管分类与证据生成风险
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的产品组合长期卡在分类问题上。FocusCalm
              对外是专注力和平静训练系统，应用商店文案围绕压力、睡眠、表现和幸福感展开；义肢业务则包括面向临床医生的膝关节和复杂仿生手，其控制系统更接近受监管医疗器械。FDA
              指引说得很清楚：美国医疗器械要按预期用途和风险画像承担分类、上市前路径和证据义务。问题在于，BrainCo
              公开材料擅长讲可能性和工作流，但逐产品监管状态仍不均衡。公司有时可以借“健康、训练或辅助技术”的框架获益；但一旦宣称、买方预期或部署场景把产品推向医疗器械审查，该框架就很难撑住。Kneuro 的可报销文档说明
              BrainCo 理解正式渠道支撑体系的重要性，可留存公开记录仍没有呈现 FocusCalm、智能仿生手或 Kneuro 清晰的 FDA clearance
              轨迹。因此，风险不只是“审批延误”，还包括产品定位滑移、意外证据负担，以及商业化宣称跑在规模化所需监管包之前。
