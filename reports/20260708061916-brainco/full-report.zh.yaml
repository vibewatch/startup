  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻公司与替代品
        blocks:
          - type: paragraph
            body: >-
              BrainCo 的竞争集合很碎片化，因为它的产品不只解决一个任务。在 EEG 和神经反馈中，最接近的直接同业是 Muse：两者都是非侵入式头带，卖进专注、平静和脑健康习惯，但 Muse
              更偏冥想和睡眠，FocusCalm 更偏短时段表现训练、游戏和团队管理。Emotiv、Neurosity 和 NeuroSky
              处在附近，但姿态不同。它们的页面更强调通道、原始数据、开发者或研究用途以及硬件规格，而不是引导式健康内容，因此更像技术基准，而非直接生活方式替代品。假肢中，对比集合再次变化。Open Bionics
              竞争点是可负担性、诊所网络准入、儿童适配和肌电功能；Ottobock 竞争点是报销、产品生态和既有临床分销；Fillauer 等其他上肢供应商也扩展了目录，即便公开功能披露偏薄。除这些直接同业外，Apple
              Watch 和 Samsung Galaxy Ring 也是间接替代品：它们争夺健康预算、睡眠追踪心智，以及雇主或消费者注意力，即使不提供 EEG 神经反馈或假肢控制。
