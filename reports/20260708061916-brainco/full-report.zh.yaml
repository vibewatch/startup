              横跨所有细分市场，公开记录更能证明“可能有客户”，却很难证明“客户质量”。FocusCalm 的应用商店足迹、订阅方案和用户证言说明确实存在真实用户触点，但公开来源没有披露活跃订阅数、续费行为、退款率或
              cohort
              留存。面向教育的产品问题相反：公开争议比客户规模更清楚，因此任何学区级增长说法，除非有合同数据和家长同意流程支撑，都应谨慎看待。义肢业务里，人的故事很有感染力，但从试用到适配用户再到获得报销的转化漏斗并不透明。信任是贯穿所有业务的变量。FocusCalm
              的隐私通知把原始信号本地处理当作卖点，但国会和媒体审视表明，脑数据处理可能变成获客障碍，尤其是在运动员、学校以及任何中国关联买方场景里。因此，客户结论需要分层看：BrainCo
