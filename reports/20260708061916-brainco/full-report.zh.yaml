      - number: '1.4'
        title: 融资历史、估值信号与里程碑脉络
        blocks:
          - type: paragraph
            body: >-
              公开来源可见的资本历史分为两个阶段。早期美国创业阶段由 BrainCo 自己 2016 年和 2017 年 Newswire 新闻稿记录：Boston Angel Club、Han Tan Capital 和
              Wandai Capital 领投 $5.5 million Pre-A 轮；CES 2017 产品发布；以及 2017 年涉及 20,000 台的中国课堂分销订单。但当前规模故事几乎完全是 2025-2026
              年的中国和全球资本故事。CB Insights 披露，BrainCo 12 轮累计融资 $527.79 million，2026 年 1 月 6 日 Series B-II 轮融资 $272.22
              million，2026 年 1 月估值区间为 $1.03-1.30 billion。EHangzhou、Pandaily 和 Neurofounders 共同旁证了 2026 年 1 月约 RMB 2
              billion 或 $280-288 million 的融资，并称其为 Neuralink 之后全球第二大 BCI 融资。这些来源还指向更偏产业而非纯风险资本的战略投资者阵容，包括 IDG
              Capital、Walden International、Lens Technology 以及其他电子产业相关投资方。因此，里程碑记录支持用户对 BrainCo 的核心定位——一家有 EEG
              和假肢敞口的中美神经科技公司；但也显示，在独角兽跃升之前，公司重心已明显转向中国。
