            body: >-
              留存公开记录在运营指标上异常薄。CB Insights 提供融资和估值数据，但其公开 BrainCo 页面仍把收入显示为 “0 FY
              undefined”；更合理的解读是缺少公开数据，而不是真实零收入结论。官方页面上，BrainCo 转而强调更软的牵引代理：2017 年 20,000
              台课堂采购订单公告、运动员和临床医生证言、产品品类广度，以及假肢展示或奖项。这些信号可以证明兴趣存在，但不能替代收入质量。公开标价也解决不了单位经济问题。FocusCalm
              页面显示零售价，但由于机构折扣、捆绑终身会员、雇主合同和团队配置，实际 ASP 可能明显不同。假肢更不透明：公开页面强调适配、报销和询价驱动流程，而非透明终端用户价格。留存来源均未披露
              CAC、回本周期、毛利率、硬件退货率、支持负担、流失率或活跃付费用户。财务上，最诚实的读法是 BrainCo 有变现路径和一些历史商业活动，但公开证据基础不足以承销收入质量或单位经济。
