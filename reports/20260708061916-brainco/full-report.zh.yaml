      - number: '2.2'
        title: 规模测算视角、区域拆分与相对市场体量
        blocks:
          - type: paragraph
            body: >-
              已发布的市场估算确认需求存在，但不给出单一精确的可服务市场。留存的 2026 年来源中，全球 BCI 市场从 Mordor Intelligence 的 2026 年基线 USD 1.4 billion，到
              Precedence Research 的 USD 3.33 billion 不等；The Business Research Company 为 USD 2.72 billion，Grand View
              Research 则预计 2030 年达到 USD 6.52 billion。这些差异不是无关紧要的噪音，而是反映了各家对临床神经假肢、消费级 EEG
              可穿戴、游戏、军事和智能家居应用的纳入范围不同。相邻品类也呈现同样模式。神经反馈市场小得多，但与 FocusCalm 直接相关，2026 年约 USD 1.74 billion；仿生假肢市场 2026 年约
              USD 1.96 billion，更宽泛的假肢及矫形市场则大数倍。EdTech 在 2026 年达到 USD 213.2-236.25 billion，体量巨大，但这个品类太宽，不能作为 BrainCo 实际
              TAM，因为大部分支出流向 LMS、SIS、内容和与 EEG 注意力训练无关的硬件。区域上，留存 BCI 和 EdTech 来源一致描述 North America 是当前最大收入池，Asia-Pacific
              是增长更快的地区，这与 BrainCo 的中美运营足迹匹配。正确结论不是 BrainCo 能覆盖这些市场的每一美元，而是它处在几个增长品类中，合计天花板很大，但可直接触达的楔形市场窄得多。
