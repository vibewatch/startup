      - number: '3.2'
        title: EEG 头带与神经反馈竞争
        blocks:
          - type: paragraph
            body: >-
              在头带品类里，BrainCo 的定位比技术护城河更容易理解。FocusCalm 自己的对比页称，Muse 主要是冥想和睡眠设备，而 FocusCalm
              设计成全天睁眼使用，配有游戏、团队管理和场景化冥想。这个框架与竞品官方页面大体一致。Muse 2 公开标价 USD 249.99，Muse S Athena 标价 USD 474.99；Muse
              科学页面强调研究背书、七个传感器、睡眠阶段追踪，以及符合加拿大、美国和欧洲标准的认证。Emotiv 处在更技术化也更昂贵的层级：Insight 是 5 通道头显，带表现指标；原始 EEG 在许可限制下可用，标价
              USD 1,500；EPOC X 是 14 通道研究级头显。Neurosity 的 Crown 明确以 8 通道 BCI 营销，NeuroSky 的 MindWave Mobile 2 突出单导联消费级和 OEM
              部署。在这个竞争场中，公开来源看不出 BrainCo 有明显传感器优势；优势在于把体验包装给运动员、教育者和机构健康买方，而这些人可能并不想要研究头显或纯冥想设备。
