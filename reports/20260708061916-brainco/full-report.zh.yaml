      - number: '1.3'
        title: 产品横跨专注训练、课堂工具和假肢
        blocks:
          - type: paragraph
            body: >-
              对一家仍以神经科技标签对外叙事的公司来说，BrainCo 的产品组合异常宽。FocusCalm 网站把公司定位在消费级神经反馈、脑训练、冥想和表现内容，交付载体是 EEG 头带和订阅 app。较早的
              Newswire 材料显示，这条线源自 Focus 1 产品族，并分为课堂和家庭使用。BrainFutures 与 2017 年课堂交易公告说明，Focus EDU——在较新的中国侧页面上称为
              FocusXin——围绕教师仪表盘搭建，用学生 EEG 头带可视化注意力信号。中国侧网站进一步扩展到 StarKids、Easleep、OxyZen、FocusZen 和 BrainAI
              解决方案。假肢端，Brainco.cn、BrainRobotics、Red Dot 和近期仿生手文章都支持一个真实的辅助设备业务：围绕 EMG 或残肢信号解读、AI 辅助手势控制，以及 Kneuro
              等相邻下肢硬件展开。这种广度有战略意义，因为 BrainCo 不是在承销单一产品市场匹配赌注；它横跨消费健康、教育邻近分析、康复硬件和公益假肢项目。代价是，每个市场都有不同的证据和监管负担。
