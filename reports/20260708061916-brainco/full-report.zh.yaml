        - 支撑高端微处理器膝关节定位
      - - Kneuro 软件层
        - 用户和临床医生 app 功能、远程固件更新、可调参数
        - 软件是设备价值主张的一部分
        - 带来支持、培训和版本控制负担
      - - BrainRobotics 手部产品线
        - EMG 驱动意图解码，支持可编程手势和 AI 自适应
        - 上肢控制栈比简单开 / 合肌电控制复杂得多
        - 如果真实使用中可靠性守得住，就是有用差异化
      - - Revo2 灵巧手
        - 383 g、50 N 握力、20 kg 负载、触觉感知、低噪音
        - 指向有意义的机械和传感改进
        - 可能从康复拓展到机器人相邻市场
    notes: 膝关节证据偏文档、接近商业化就绪；手部证据在演示、奖项和规格上更丰富，正式临床文档较少。
