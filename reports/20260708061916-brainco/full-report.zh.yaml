      - number: '8.2'
        title: 同业比较：侵入式 BCI 龙头与更窄的康复玩家
        blocks:
          - type: paragraph
            body: >-
              同业参照对 BrainCo 有双向作用。Neurofounders 和 MedTech Dive 显示，Neuralink、Synchron、Precision Neuroscience 等侵入式 BCI
              龙头，围绕清晰技术主张和越来越明确的临床里程碑，吸引了非常大的资本池。Neuralink 通常被报道为在 $650M Series E 之后累计融资约 $1.3B；Synchron 在 $200M Series
              D 之后约 $345M；Precision 在 $102M Series C 和后续战略支持之后约 $155M。它们并不是完美可比公司，因为侵入性更强，也往往更偏临床。但它们重要，因为它们锚定了投资人对 BCI
              规模资本能买到什么的预期：试验、监管进展、医院采用和数据护城河。相比之下，Neurolutions 代表一条更窄但去风险更清楚的路径：一款已获 FDA clearance 的卒中康复 BCI
              产品，由健康险计划按个案覆盖，但适应症更聚焦。BrainCo 的估值论点夹在两极之间。它比 Neurolutions
              更宽、更平台化，却不如融资最多的侵入式龙头在临床或财务上透明。这个中间位置可以支撑溢价可选性；如果投资人更看重清晰度而非宽度，也可以支撑折价。
