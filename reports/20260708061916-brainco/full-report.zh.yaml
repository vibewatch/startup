  - id: TV003
    title: 同行资本与成熟度对比表
    columns:
      - 公司
      - 公开资本信号
      - 临床 / 商业化状态
      - 为何影响 BrainCo 可比公司集合
      - 注意事项
    rows:
      - - BrainCo
        - 已融资 USD 527.79M；估值区间 $1.03-1.30B
        - 多场景平台，但公开经济性很薄
        - 表明 BrainCo 已按重大神经科技故事定价
        - 透明度不及理想的后期医疗科技可比公司
      - - Neuralink
        - $650M Series E 后，累计融资约 USD 1.3B
        - 人体植入，高曝光度皮层内路径
        - 设定野心上限和资本强度标杆
        - 侵入性高得多，不能直接比较
      - - Synchron
        - $200M Series D 后，累计融资约 USD 345M
        - 血管内 BCI 进入关键性试验和上市准备
        - 突出资本流向临床里程碑更清晰的项目
        - 相比 BrainCo 的混合模式，它仍是侵入式 / 临床优先
      - - Precision Neuroscience
        - $102M Series C 后，累计融资约 USD 155M
        - 早期人体测试，向 IDE 路径扩展
        - 说明中间路线侵入式 BCI 叙事也能拿到资本
        - 阶段更早，产品故事更窄
      - - Neurolutions
        - 已获 FDA 许可的家庭中风康复 BCI，并有医保覆盖支持
        - 路径更窄，但适应症更聚焦
        - 表明临床聚焦做到去风险后，不靠平台铺摊子也能创造价值
        - 市场范围更小，收入画像不同
      - - Blackrock / 更广泛侵入式领域
        - 技术信誉强、研究传承长
        - 临床深度和医院关系
        - 提醒投资人：BCI 资本追的是执行，不只是热度
        - 不是干净的初创公司倍数可比对象
    notes: 同行对比显示，BrainCo 的估值更多来自平台可选性，而不是同行正在构建的单项目证据。
