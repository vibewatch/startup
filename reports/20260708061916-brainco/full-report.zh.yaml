  summary: >-
    BrainCo 是一家与 Harvard 有渊源的神经科技公司，公开信息将创始人兼 CEO Bicheng Han 与公司绑定；它在 Somerville 以 FocusCalm 形成商业界面，同时在 Hangzhou
    拥有更大的运营中心。可见产品族覆盖 FocusCalm 消费级神经反馈、面向学校和儿童训练场景的 BCI 系统（如 FocusXin、StarKids），以及智能仿生手、Kneuro
    等辅助假肢。公开证据支持其融资规模真实、技术野心很宽，但相较其宣称的估值和产品广度，披露深度仍偏轻。
