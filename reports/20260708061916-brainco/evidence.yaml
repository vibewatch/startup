evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current employee count, hiring profile, or official headcount disclosure for 2026.
    whyItMatters: >-
      Headcount is one of the requested cover metrics and would help size BrainCo's execution capacity across wellness,
      education, and prosthetics.
    diligencePath: >-
      Request current headcount and location split directly from the company or obtain payroll, benefits, or recruiting
      disclosures through diligence.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, control map, and ownership or board-rights disclosure tied to the 2026 financing.
    whyItMatters: >-
      A late-stage unicorn without a visible board or governance map creates underwriting risk around control,
      oversight, and related-party decisions.
    diligencePath: >-
      Obtain the latest cap table, board observer list, shareholder rights summary, and any investor-side governance
      materials.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
