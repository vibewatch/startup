  topStrengths:
    - BrainCo 不是单一产品概念故事；公开来源支持其产品面覆盖神经反馈、教育相关 BCI 系统和假肢。
    - 2026 年 1 月融资和公开独角兽区间说明，成熟资本愿意按规模支持公司。
    - Kneuro 和更广泛的假肢记录显示，公司在真实设备和商业化上比普通纯健康可穿戴创业公司更有实质。
    - 业务宽度保留了几条战略上行分支，包括消费级神经反馈、辅助设备，以及贴近机器人的灵巧手。
  topRisks:
    - 收入、利润率、留存和现金效率数据公开披露太薄，支撑不了正常后期估值逻辑。
    - 校园监测争议、儿童数据敏感性和运动员数据审视，可能把客户信任变成增长瓶颈。
    - 中美地缘政治和国家安全叙事，可能抬高 BrainCo 的折现率，也压窄退出选项。
    - 产品组合足够宽，管理层分心和监管成熟度不均都是现实执行风险。
    - BrainCo 所处市场里还有 Neuralink、Synchron、Precision、Neurolutions 等知名度更高或临床路径更清晰的 BCI 竞争者，估值必须放在这套坐标里看。
  unresolvedGaps:
    - FocusCalm、教育产品和假肢的分部收入、毛利率、留存和单位经济。
    - 按产品拆分的监管和市场准入状态，尤其是假肢和面向学校的产品线。
    - 董事会构成、股权结构表细节，以及准确的中美法律 / 运营结构。
    - Kneuro 和其他假肢项目从试用到适配的转化率，以及报销表现。
    - 足以区分持久平台价值和叙事驱动可选性的证据。
