  topStrengths:
    - >-
      BrainCo is not a single-product concept story; public sources support a wide product surface across neurofeedback,
      education-adjacent BCI systems, and prosthetics.
    - >-
      The January 2026 financing and public unicorn range show that sophisticated capital providers were willing to fund
      the company at scale.
    - >-
      Kneuro and the broader prosthetics record suggest more real device and commercialization substance than a typical
      wellness-only wearable startup.
    - >-
      The company’s breadth leaves open several strategic upside branches, including consumer neurofeedback, assistive
      devices, and robotics-adjacent dexterous hands.
  topRisks:
    - >-
      Revenue, margins, retention, and cash-efficiency data remain too thin publicly to support a normal late-stage
      valuation case.
    - >-
      School-monitoring controversy, child-data sensitivity, and athlete-data scrutiny can turn customer trust into a
      growth bottleneck.
    - >-
      U.S.-China geopolitical and national-security narratives can widen BrainCo’s discount rate and narrow exit
      options.
    - The portfolio is broad enough that management distraction and uneven regulatory maturity are real execution risks.
    - >-
      BrainCo’s valuation sits in a market that also contains better-known or more clinically legible BCI competitors
      such as Neuralink, Synchron, Precision, and Neurolutions.
  unresolvedGaps:
    - >-
      Segment-level revenue, gross margin, retention, and unit economics for FocusCalm, education products, and
      prosthetics.
    - Product-by-product regulatory and market-access status, especially for the prosthetics and school-facing lines.
    - Board composition, cap-table details, and the exact U.S.-China legal / operational structure.
    - Trial-to-fit conversion and reimbursement performance for Kneuro and other prosthetics programs.
    - Evidence strong enough to distinguish durable platform value from narrative-driven optionality.
