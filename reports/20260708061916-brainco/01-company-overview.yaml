    {
      "id": "controversies-gaps",
      "title": "Adverse signals and the key gaps that later chapters must resolve",
      "body": "The most important diligence lesson from the overview chapter is that BrainCo's public record is not cleanly promotional. Vice documented the 2019 backlash against classroom attention-monitoring headbands in Zhejiang, where officials ordered a school to stop using them after privacy concerns spread online. Hunterbrook later escalated the scrutiny by alleging that BrainCo had accepted funding from government-linked and sanctioned Chinese entities, shifted its headquarters to Hangzhou while continuing to trade on Harvard branding, and maintained data-handling practices that conflicted with public denials. FocusCalm responded with an unusually direct on-site statement, asserting that raw EEG and IMU data are processed locally, purged after each session, and not shared with governments or militaries, while also citing a U.S.-based cybersecurity audit. That response narrows one risk narrative but does not resolve everything: public board composition remains unclear, current headcount is not disclosed, exact FDA-cleared device identifiers are not visible in the retained record, and the legal or operational split between FocusCalm's U.S. entity and BrainCo's Hangzhou operations remains thinly documented. Those gaps are material because they affect how much weight investors can place on product claims, regulatory assertions, and the durability of the current unicorn valuation.",
