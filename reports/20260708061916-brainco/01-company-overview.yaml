    {
      "id": "capital-milestones",
      "title": "Funding history, valuation signals, and milestone chronology",
      "body": "The capital history visible in public sources falls into two phases. The early U.S. startup phase is documented through BrainCo's own 2016 and 2017 Newswire releases: a $5.5 million Pre-A round led by Boston Angel Club, Han Tan Capital, and Wandai Capital; a CES 2017 product launch; and a 2017 Chinese classroom distribution order involving 20,000 units. The current scale story, however, is overwhelmingly a 2025-2026 China and global-capital story. CB Insights reports $527.79 million raised over 12 rounds, a January 6, 2026 Series B-II round of $272.22 million, and a January 2026 valuation band of $1.03-1.30 billion. EHangzhou, Pandaily, and Neurofounders all corroborate a roughly RMB 2 billion or $280-288 million financing in January 2026 and frame it as the second-largest BCI financing round globally after Neuralink. Those sources also point to a strategic investor set that is more industrial than purely venture-backed, including IDG Capital, Walden International, Lens Technology, and other electronics-linked investors. The resulting milestone record supports the user's core framing of BrainCo as a Chinese-American neurotechnology company with EEG and prosthetics exposure, but it also shows a business whose center of gravity shifted materially toward China before its unicorn step-up.",
