      - number: '7.2'
        title: Privacy, ethics, and child-data risk
        blocks:
          - type: paragraph
            body: >-
              BrainCo’s most visible reputational risk comes from child-facing and classroom-adjacent use cases.
              FocusCalm’s privacy notice is directionally positive because it says raw EEG and IMU signals are processed
              locally and only computed scores are transmitted to BrainCo servers. That can reduce some consumer
              concern. But the education story is much harder. Tech in Asia’s reporting on Chinese school trials
              described teachers monitoring student focus in real time through headband color states, and the
              controversy itself shows how quickly brain-data products can become symbols of surveillance rather than
              empowerment. FTC COPPA guidance underscores why the issue is not merely public relations: child-directed
              or child-implicating digital products can trigger additional privacy obligations even when they are not
              exclusively “kids’ sites.” BrainCo’s public catalog still includes FocusXin and StarKids, which means the
              company has not exited child- and school-adjacent categories altogether. In risk terms, education and
              youth deployments could become the segment where privacy design, consent mechanics, and social legitimacy
              matter more than product performance. A company can survive middling engagement metrics; it is much harder
              to survive a narrative that you are harvesting children’s brain data without adequate safeguards.
            claimRefs:
              - CR010
