  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory classification and evidence-generation risk
        blocks:
          - type: paragraph
            body: >-
              BrainCo’s product mix creates a persistent classification problem. FocusCalm is marketed as a focus and
              calm training system with app-store language around stress, sleep, performance, and well-being, while the
              prosthetics business includes clinician-facing knees and sophisticated bionic hands whose control systems
              touch more regulated medical-device territory. FDA guidance makes clear that U.S. medical devices face
              classification, premarket pathway, and evidence obligations based on intended use and risk profile. That
              matters because BrainCo’s public materials are strong on possibility and workflow but still uneven on
              product-by-product regulatory status. The company can sometimes benefit from framing products as wellness,
              training, or assistive technology, but that framing becomes harder to sustain if claims, buyer
              expectations, or deployment settings push a product toward medical-device scrutiny. Kneuro’s
              reimbursement-ready documentation shows BrainCo understands the importance of formal channel scaffolding,
              yet the retained public record still does not surface a clean FDA clearance trail for FocusCalm, the
              intelligent bionic hand, or Kneuro. The risk is therefore not only “approval delay.” It is also
              product-positioning drift, unexpected evidence burden, and the possibility that commercialization claims
              get ahead of the regulatory package needed for scale.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
