      - number: '1.3'
        title: Product breadth across focus training, classroom tools, and prosthetics
        blocks:
          - type: paragraph
            body: >-
              BrainCo's product portfolio is unusually broad for a company still described publicly through a
              neurotechnology lens. The FocusCalm site positions the company around consumer neurofeedback, brain
              training, meditation, and performance content delivered through an EEG headband and subscription app.
              Older Newswire materials show that this line originated in the Focus 1 family, split between classroom and
              home use. BrainFutures and the 2017 classroom deal announcement establish that Focus EDU—or, on newer
              China-facing pages, FocusXin—was built around teacher dashboards that visualize attention signals from
              student EEG headbands. The China-facing site broadens the portfolio further with StarKids, Easleep,
              OxyZen, FocusZen, and BrainAI solutions. On the prosthetics side, Brainco.cn, BrainRobotics, Red Dot, and
              recent bionic-hand articles all support a real assistive-device business built around EMG or residual-limb
              signal interpretation, AI-assisted gesture control, and adjacent lower-limb hardware such as Kneuro. This
              breadth is strategically important because it means BrainCo is not underwriting one product-market fit
              bet; it is spanning consumer wellness, education-adjacent analytics, rehabilitation hardware, and
              public-welfare prosthetics programs. The trade-off is that each market brings a different evidence and
              regulatory burden.
