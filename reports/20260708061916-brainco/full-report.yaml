      - number: '6.4'
        title: Customer quality, trust, and unresolved retention questions
        blocks:
          - type: paragraph
            body: >-
              Across all segments, the public record is much better at proving customer possibility than customer
              quality. FocusCalm’s app-store footprint, subscription plans, and testimonials show there are real user
              surfaces, but public sources do not disclose active subscribers, renewal behavior, refund rates, or
              retention by cohort. Education-facing products have the opposite problem: public controversy is clearer
              than customer scale, which means any district-level growth claim should be treated cautiously unless
              backed by contract data and parental-consent workflows. In prosthetics, the human stories are compelling,
              but the conversion funnel from trial to fitted user to reimbursed long-term customer is opaque. Trust is
              the cross-cutting variable. FocusCalm’s privacy notice makes local raw-signal processing a selling point,
              yet congressional and media scrutiny show that brain-data handling can become a customer acquisition
              barrier, especially for athletes, schools, and any China-linked buyer context. The customer verdict is
              therefore nuanced. BrainCo appears to have real customers or at least real users across consumer,
              education, and rehab channels, but public evidence remains too thin to determine which customer groups are
              truly sticky, profitable, or scalable under scrutiny.
            claimRefs:
              - CU006
