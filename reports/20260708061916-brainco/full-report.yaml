      - number: '8.4'
        title: Verdict, upside triggers, and downside re-rating triggers
        blocks:
          - type: paragraph
            body: >-
              From a diligence perspective, BrainCo looks like a company whose valuation can move sharply in either
              direction once harder evidence arrives. Upside could come from proof that FocusCalm retains paying users,
              Kneuro converts trials into reimbursed installations, or one of the company’s prosthetics or BCI lines
              secures cleaner regulatory and clinical milestones. A transparent corporate structure and reduced
              geopolitical noise would also help. Downside could come from the opposite: weak paid retention, stalled
              prosthetics conversion, school or athlete trust shock, or policy friction tied to BrainCo’s China-linked
              narrative. Peer context sharpens the judgment. Neuralink, Synchron, Precision, and Neurolutions each offer
              clearer single-thread narratives—whether high-performance invasive BCI, endovascular pragmatism,
              surface-array scale, or focused stroke rehab. BrainCo’s breadth creates more upside branches, but also
              more ways to disappoint. On balance, the public evidence supports recognizing BrainCo as a real unicorn,
              while also treating the upper end of the valuation range as vulnerable unless private diligence closes the
              disclosure gap.
            claimRefs:
