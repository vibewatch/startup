chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal structure, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The clearest current U.S. legal surface in the retained source set is FocusCalm rather than a detailed
              BrainCo corporate page. FocusCalm's terms state that the service is operated by BrainCo, Inc., DBA
              FocusCalm, and multiple FocusCalm pages list 120 Beacon Street in Somerville, Massachusetts as the contact
              address. That supports a real U.S. commercial entity and helps explain why older press releases described
              BrainCo as Boston-based. At the same time, more recent China-facing and investigative sources describe the
              company as Hangzhou-based and operating from Hangzhou Future Sci-Tech City. The best reconciled view is
              therefore not a single-headquarters story but a dual-surface structure: a Somerville commercial and brand
              presence tied to FocusCalm and legacy Harvard-origin marketing, paired with a larger Hangzhou operating
              center that anchors current manufacturing, financing, and Chinese government visibility. Because BrainCo
              does not publish a simple group-structure page in the retained set, later chapters should treat U.S. and
              China references carefully and cite the specific product or entity being discussed rather than assuming
              one consolidated legal perimeter.
