      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The user, buyer, and payer change materially across BrainCo's product lines. In consumer wellness, the
              user and payer are often the same person buying a FocusCalm headband and subscription directly, but
              FocusCalm's organization pages show that BrainCo increasingly sells through an institutional motion as
              well: universities, professional teams, clinics, businesses, and healthcare employers are offered demos,
              team portals, research studies, and volume pricing. In education, the individual student is the user, but
              budget ownership can sit with student-wellness centers, athletics departments, educator-wellness programs,
              STEM-program sponsors, or other institution-level buyers. In that segment, adoption depends on a champion
              who can justify both wellness value and the optics of placing EEG hardware on students. In prosthetics,
              the user is the amputee, but the clinical economic buyer is the prosthetist, clinic, hospital, or rehab
              provider, and reimbursement coding becomes central. BrainRobotics' Kneuro page underscores this difference
              by emphasizing PDAC approval, reimbursement support, and clinician guides rather than lifestyle language.
              This separation means BrainCo is not selling one simple device SKU into one budget line; it is pursuing
              several markets where product-market fit, sales cycle length, and evidence thresholds are materially
              different.
