      - number: '6.3'
        title: Amputees, clinicians, and rehabilitation users
        blocks:
          - type: paragraph
            body: >-
              The prosthetics customer base is best understood as a mixed end-user and clinical-channel market.
              BrainCo’s 2026 user stories emphasize return to work, daily independence, and restoration of fine-motor
              tasks such as writing, typing, grasping, and even music or climbing. Independent and semi-independent
              materials reinforce that the products are meant to change daily life rather than serve as static
              demonstrations: Red Dot described intuitive EMG-based control, The Robot Report profiled real-world use of
              the Revo2 hand, and BrainCo’s own stories highlighted confidence, autonomy, and social participation. WAIC
              showcase coverage and the “warmest side of technology” article are not equivalent to outcomes research,
              but they do indicate ongoing use cases involving amputees rather than a purely lab-bound prototype. Kneuro
              adds a separate but related customer class: clinicians, prosthetists, and reimbursed lower-limb patients.
              Its public materials prioritize trials, fitting, app setup, coding, and reimbursement support, which
              suggests customer success here depends as much on provider workflow as on patient delight. In short,
              BrainCo’s prosthetics customers are not only users; they are also clinicians and channel partners who have
              to trust the device enough to fit, document, and support it over time.
            claimRefs:
              - CU019
