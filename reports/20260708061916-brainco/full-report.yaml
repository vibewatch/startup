      - number: '1.2'
        title: Founding story, Harvard roots, and public leadership record
        blocks:
          - type: paragraph
            body: >-
              Across the retained public sources, the founder identity is more consistent than the broader entity
              structure. Newswire, MIT Technology Review, BrainFutures, and the World Economic Forum all identify
              Bicheng Han as founder and CEO and place the company's origin in or around Harvard brain-science research
              and the Harvard Innovation Lab in 2015. The sources vary slightly in phrasing—some say founded in February
              2015, some emphasize incubation, and some describe a Harvard Center for Brain Science PhD context—but the
              overlap is strong enough to treat 2015 Harvard incubation under Han as the public canonical origin story.
              What is less transparent is the current executive bench. The retained official U.S. pages prominently list
              commercial team members such as Kevin Ufferfilge, Kendra Walker, Brian Varga, and Ian Karman, while older
              press releases mention product designer Sunny Guo. None of the retained official pages publish a full
              current board roster, ownership map, or formal corporate governance page. That leaves BrainCo looking
              founder-led with meaningful key-person concentration around Han and with a public team surface that is
              broader than one founder but thinner than a normal late-stage unicorn disclosure package.
