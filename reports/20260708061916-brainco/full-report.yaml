            body: >-
              The retained public record is unusually thin on operating metrics. CB Insights provides funding and
              valuation data, but its public BrainCo page still shows revenue as “0 FY undefined,” which is better
              interpreted as missing public data than as a real zero-revenue conclusion. Across official pages, BrainCo
              instead highlights softer traction proxies: a 20,000-unit classroom purchase-order announcement from 2017,
              testimonials from athletes and clinicians, the breadth of product categories, and prosthetics showcases or
              awards. Those are useful proof-of-interest signals but not substitutes for revenue quality. Public list
              prices also fail to solve the unit-economics problem. FocusCalm’s page shows retail pricing, but realized
              ASP could differ materially because of institutional discounts, bundled lifetime memberships, employer
              contracts, and team configurations. Prosthetics are even more opaque: public pages emphasize fit,
              reimbursement, and quote-driven workflows rather than transparent end-user prices. None of the retained
              sources disclose CAC, payback, gross margin, hardware return rates, support burden, churn, or active paid
              users. Financially, the most honest reading is that BrainCo has monetization pathways and some historical
              commercial activity, but no public evidence base strong enough to underwrite revenue quality or unit
              economics.
