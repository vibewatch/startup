  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Reported valuation range and capital base
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation fact is the one surfaced by CB Insights: BrainCo’s January 2026 valuation
              was reported in a band of roughly $1.03B to $1.30B, with $527.79M raised over 12 rounds and a $272.22M
              Series B-II financing on January 6, 2026. EHangzhou and Pandaily corroborate a roughly RMB 2 billion /
              $280-288M financing and frame it as a milestone financing for the BCI field. On its face, that capital
              base gives BrainCo real standing. This is not a seed-stage science project. But the same public record
              makes valuation interpretation difficult because it lacks the normal supporting metrics a late-stage
              investor would want: revenue run rate, gross margin, cash burn, user counts, contract concentration,
              reimbursement conversion, and customer retention. Valuation therefore rests far more on narrative and
              optionality than on disclosed financial compounding. In other words, the capital market has already priced
              BrainCo as a strategic neurotechnology platform with consumer, education, prosthetics, and robotics
              adjacency. Whether the business has yet earned that premium through transparent economics remains unproven
              in public.
            claimRefs:
              - CV001
              - CV002
              - CV003
