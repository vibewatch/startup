  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              BrainCo's relevant market is best understood as an overlap rather than a single category. Its FocusCalm
              business sits inside the non-invasive BCI and neurofeedback/wellness market, where EEG headbands,
              software, and content are sold to consumers and institutions seeking focus, stress, or performance
              benefits. Its education pages and BrainFutures' Focus EDU description show a second wedge into school,
              university, and educator-wellness budgets, plus a STEM-adjacent teaching use case. Its BrainRobotics
              division creates a third wedge into smart prosthetics and rehabilitation hardware, where the buyer is
              clinical rather than consumer and reimbursement matters more than app engagement. Broad EdTech and broad
              prosthetics-and-orthotics figures therefore matter only as outer boundaries: they include large pools of
              spend that BrainCo does not directly monetize. The practical substitutes also differ by segment. Consumers
              can choose meditation apps or competing neurofeedback headsets; schools can do nothing, use counseling or
              SEL programs, or avoid EEG monitoring altogether; amputees can choose conventional prosthetics or other
              myoelectric vendors. Market definition matters because any single TAM slide can either overstate reach by
              using all EdTech spend or understate it by ignoring prosthetics and institutional wellness.
