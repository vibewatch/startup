      - number: '7.3'
        title: Geopolitical, national-security, and cross-border operating risk
        blocks:
          - type: paragraph
            body: >-
              BrainCo’s dual U.S.-China footprint may be commercially useful, but it is now a material risk factor. The
              House Energy & Commerce release explicitly frames BrainCo as a potential national-security concern tied to
              Chinese state-linked data access and athlete brain-wave collection. Hunterbrook pushes the same theme from
              an investigative-journalism angle. Whether every allegation ultimately proves decisive is almost secondary
              to the practical consequence: once a company is pulled into a national-security narrative, customers,
              partners, schools, employers, and athletes may hesitate even before any regulator acts. Treasury’s CFIUS
              page and BIS export-administration context show why this matters structurally. Technologies that combine
              AI, sensing, human performance data, and cross-border ownership or supply chains can attract review even
              if they are not classic defense hardware. BrainCo is also exposed to policy volatility: data-security
              rules, export controls, procurement restrictions, or sanctions can shift faster than a startup’s product
              roadmap. Geopolitical risk therefore affects more than financing or headlines; it can directly impair
              partnerships, market access, customer trust, and eventual exit options.
            claimRefs:
