      - number: '3.2'
        title: EEG headband and neurofeedback competition
        blocks:
          - type: paragraph
            body: >-
              Within headbands, BrainCo’s positioning is easier to understand than its technology moat. FocusCalm’s own
              comparison page says Muse is predominantly a meditation and sleep device while FocusCalm is designed for
              eyes-open use throughout the day, with games, team management, and scenario-specific meditations. That
              framing is broadly consistent with the official competitor pages. Muse 2 is publicly listed at USD 249.99
              and Muse S Athena at USD 474.99, with Muse’s science page emphasizing research backing, seven sensors,
              sleep-stage tracking, and certification against Canadian, U.S., and European standards. Emotiv occupies a
              more technical and expensive tier: Insight is a 5-channel headset with performance metrics, raw EEG
              availability subject to license, and a listed USD 1,500 price, while EPOC X is a 14-channel research-grade
              headset. Neurosity’s Crown is explicitly marketed as an 8-channel BCI, and NeuroSky’s MindWave Mobile 2
              highlights single-lead consumer and OEM deployment. Against that field, BrainCo’s edge is not obvious
              sensor superiority from public sources; it is packaging the experience for athletes, educators, and
              institutional wellness buyers who may not want a research headset or a pure meditation device.
