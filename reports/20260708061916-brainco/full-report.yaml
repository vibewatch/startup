        title: Revenue streams, list pricing, and monetization structure
        blocks:
          - type: paragraph
            body: >-
              BrainCo’s public commercial model looks like a hybrid hardware-plus-software stack rather than a single
              SaaS or single-device business. FocusCalm’s product page shows a direct-to-consumer headband price,
              explicit volume-discount prompts for quantities above two units, and text describing lifetime memberships
              for each family or team member. FocusCalm’s organization and healthcare pages add further monetization
              layers: team portals, custom assignments, volume pricing, 1-to-1 and 1-to-many deployment options, and
              even affiliate-style workplace programs. That means the consumer list price is only one revenue surface;
              BrainCo can plausibly monetize the same product through household, team, clinic, university, and employer
              channels with different realized economics. On the prosthetics side, public pages look nothing like
              ecommerce. BrainRobotics emphasizes trials, clinician guides, coding support, and PDAC-linked
              commercialization, which suggests revenue is driven by provider workflows, reimbursement, and service
              support rather than app subscriptions. The result is a multi-stream model—consumer hardware, bundled
              memberships, institutional wellness contracts, and prosthetics programs—but one where public evidence
              stops at the monetization mechanism and does not reveal scale, contribution margin, or recurring-revenue
              mix.
