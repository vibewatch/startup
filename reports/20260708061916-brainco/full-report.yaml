companyProfile:
  summary: >-
    BrainCo is a Harvard-linked neurotechnology company publicly associated with founder and CEO Bicheng Han, a
    Somerville-based FocusCalm commercial surface, and a larger Hangzhou operating center. Its visible product family
    spans FocusCalm consumer neurofeedback, school- and child-facing BCI systems such as FocusXin and StarKids, and
    assistive prosthetics including the intelligent bionic hand and Kneuro. Public evidence supports real financing
    scale and broad technical ambition, but disclosure depth still looks light relative to the valuation and product
    breadth being claimed.
