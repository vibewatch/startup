  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer, coach, and wellness users around FocusCalm
        blocks:
          - type: paragraph
            body: >-
              The easiest customer surface to verify is FocusCalm’s consumer and practitioner-oriented stack. The App
              Store and Google Play listings show a live mobile product, subscription plans, and a headband-plus-app
              workflow rather than a pure hardware sale. The App Store listing adds practical customer details: iPhone
              support, Apple Health integration, annual and monthly subscriptions, a 3.9/5 rating from 53 ratings, and
              feature framing around stress management, sleep preparation, sports, work, and school performance.
              FocusCalm’s own reviews and results pages extend that picture from individual consumers toward coaches,
              clinicians, employers, nurses, and athletes. The retained testimonials are clearly promotional, but they
              do show the company is trying to land across several real user groups rather than only selling to
              hobbyists. Importantly, the customer value proposition is behavioral rather than medical: train calm,
              focus, and resilience in short sessions, then track metrics such as depth, consistency, speed, and
              FocusCalm minutes over time. That can resonate with consumers and performance professionals, but it also
              means demand durability depends on habit formation, perceived results, and trust in neurofeedback claims
              rather than on a clinician’s prescription alone. Public evidence supports existence and some breadth of
              use; it does not support strong conclusions on retention, paid conversion, or net promoter strength.
            claimRefs:
