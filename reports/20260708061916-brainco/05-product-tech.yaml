    {
      "id": "ip-regulatory-and-open-gaps",
      "title": "IP signals, regulatory posture, and unresolved product diligence gaps",
      "body": "The IP and regulatory picture is mixed but substantive. BrainCo’s public patent page shows the company has filed around neuro-feedback training using video games and manipulating robotic devices, which is directionally consistent with its neurofeedback and prosthetics narratives. Kneuro’s reimbursement materials are even more concrete: the downloaded PDAC approval letter and coding/reimbursement guides show BrainCo is working inside established prosthetics billing and coverage workflows rather than trying to commercialize only through consumer marketing. CMS materials cited by BrainRobotics support the importance of coverage language for lower-limb prosthetics, especially as K2 microprocessor-knee coverage criteria evolve. At the same time, the retained public record leaves meaningful gaps. The reviewed FocusCalm and BrainCo product pages do not provide the kind of device-specification and trial-detail package that would let an outsider verify efficacy claims at a medical-device standard. The reviewed public materials also do not surface a clear FDA clearance number for FocusCalm, the intelligent bionic hand, or Kneuro. And while the user asked for BrainBot coverage, no retained source in this run surfaced a current BrainBot product page with enough substance to treat it as a well-documented product line. The correct diligence takeaway is that BrainCo has real technical artifacts and commercialization scaffolding, but public disclosure still under-specifies validation, regulatory status, and the maturity of some adjacent products.",
