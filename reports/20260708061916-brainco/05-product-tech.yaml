    {
      "id": "prosthetics-control-stack",
      "title": "Prosthetics control stack: BrainRobotics hand lineage and Kneuro knee",
      "body": "BrainCo’s prosthetics evidence is materially stronger than the vague “smart limb” label implies. Older Red Dot coverage of the BrainRobotics hand describes an AI prosthesis built around electromyography sensors that capture signals from the residual limb, translate those signals into movement, and allow gestures to be programmed in minutes rather than relying only on a small library of fixed motions. BrainCo’s own 2026 hand article uses similar language, stating that the intelligent bionic hand interprets EMG and neuroelectric signals from the residual limb to infer user intent. The newer Revo2 materials then show where the platform is going: Red Dot, iF Design, and The Robot Report all describe a lighter dexterous hand with tactile sensing, 50-newton grip force, 20-kilogram payload, and dual relevance to rehabilitation and humanoid robotics. On the lower-limb side, the Kneuro document set is unusually rich for a private startup. The product brief, user guide, clinician guide, coding guide, PDAC letter, and reimbursement-support document jointly describe a microprocessor knee with step-over-step stair ascent, walk-to-run, stumble recovery, app-based configuration, 5-day battery life, 330-pound weight limit, and reimbursement-oriented L-code positioning. Publicly, BrainCo therefore looks less like a concept-stage neurotech company and more like a company with real control-system and device-integration execution across upper- and lower-limb categories.",
