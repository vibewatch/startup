    "number": 5,
    "title": "Product & Technology",
    "summary": "BrainCo’s retained product record supports a broad non-invasive neurotechnology stack spanning EEG/neurofeedback wellness products, school-oriented BCI modulation products, and clinically mediated prosthetics. The strongest technical evidence is not a single “breakthrough” document but a mosaic: FocusCalm pages describing signal processing and local-device data handling, BrainCo’s Chinese product catalog, and a large body of Kneuro clinician/reimbursement materials. The result is a company with real device and control-system substance, but still uneven public disclosure on efficacy detail, BrainBot specifics, and FDA clearance status."
  },
  "sections": [
    {
      "id": "consumer-bci-stack",
      "title": "FocusCalm and BrainCo’s non-invasive BCI stack",
      "body": "The retained record shows that BrainCo is not just selling a generic meditation headband. FocusCalm’s science and how-it-works pages describe a specific neurofeedback loop: the EEG headband reads electrical activity, the app compares that activity against a target “focused and calm” signature using an AI algorithm, and the user sees a FocusCalm Score derived from 1,250 brainwave data points. The same materials frame the product as a three-step system—learn, practice, challenge—rather than a one-time measurement device. Privacy disclosures add an important implementation detail: raw EEG and IMU signals are processed locally in the mobile app, while only computed scores are transmitted to BrainCo servers. That matters because it suggests BrainCo has built at least some on-device signal-processing logic rather than shipping raw biometric streams upstream by default. The broader BrainCo.cn catalog expands the stack beyond FocusCalm into FocusZen, OxyZen, Easleep, FocusXin, and StarKids. Publicly, this looks like a modular non-invasive BCI platform strategy: one sensing/control core, multiple commercial wrappers spanning focus training, mindfulness, sleep, and education-adjacent use cases. What remains thin is hard technical specificity such as electrode count across the current portfolio, validation sample sizes, classifier drift management, or model-updating practices.",
