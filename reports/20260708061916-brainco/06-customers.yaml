    {
      "id": "schools-and-education-buyers",
      "title": "Schools, education programs, and student-facing deployments",
      "body": "BrainCo’s education-facing customer story is more complicated because it combines attractive STEM engagement with material trust risk. On the benign side, the NeuroRacing page explicitly markets a brainwave-powered slot-car set to classrooms and makerspaces, invites demos, and speaks directly to school districts. The broader BrainCo catalog also still lists FocusXin and StarKids, indicating that school- and child-facing BCI products remain part of the public portfolio. On the more controversial side, the Tech in Asia report on BrainCo’s school trials in China described primary-school students wearing headbands whose colors reflected moment-to-moment focus, while the company stated that devices were used in school trials and had not been sold to public schools. That distinction matters: pilot activity and deployment are not the same thing, but even trials can create reputational risk if parents or regulators view the product as surveillance. Customer-wise, this segment therefore looks simultaneously promising and fragile. The technology can appeal to schools that want STEM novelty, attention training, or measurable engagement, yet the buyer set is unusually sensitive to privacy, consent, and ethics. The public record supports real education interest, but also shows why customer acquisition, district expansion, and long-term retention may be much harder here than in consumer wellness.",
