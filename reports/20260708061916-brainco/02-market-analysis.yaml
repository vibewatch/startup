    "number": 2,
    "title": "Market Analysis",
    "summary": "BrainCo does not sell into one clean market; it operates at the overlap of non-invasive BCI, consumer neurofeedback, education/wellness software, and bionic prosthetics. Public 2026 market estimates are directionally attractive but definition-sensitive: retained sources size global BCI at roughly USD 1.4-3.33 billion in 2026, neurofeedback at USD 1.74 billion, bionic prosthetics at USD 1.96 billion, and broad EdTech at USD 213.2-236.25 billion. The investable conclusion is that BrainCo benefits from real secular growth in adjacent categories, but commercialization is gated by buyer fragmentation, privacy backlash in schools, and medical-device reimbursement and regulatory friction for prosthetics."
  },
  "sections": [
    {
      "id": "market-boundary-and-adjacencies",
      "title": "Market Boundary, Included Spend, and Adjacencies",
      "body": "BrainCo's relevant market is best understood as an overlap rather than a single category. Its FocusCalm business sits inside the non-invasive BCI and neurofeedback/wellness market, where EEG headbands, software, and content are sold to consumers and institutions seeking focus, stress, or performance benefits. Its education pages and BrainFutures' Focus EDU description show a second wedge into school, university, and educator-wellness budgets, plus a STEM-adjacent teaching use case. Its BrainRobotics division creates a third wedge into smart prosthetics and rehabilitation hardware, where the buyer is clinical rather than consumer and reimbursement matters more than app engagement. Broad EdTech and broad prosthetics-and-orthotics figures therefore matter only as outer boundaries: they include large pools of spend that BrainCo does not directly monetize. The practical substitutes also differ by segment. Consumers can choose meditation apps or competing neurofeedback headsets; schools can do nothing, use counseling or SEL programs, or avoid EEG monitoring altogether; amputees can choose conventional prosthetics or other myoelectric vendors. Market definition matters because any single TAM slide can either overstate reach by using all EdTech spend or understate it by ignoring prosthetics and institutional wellness.",
