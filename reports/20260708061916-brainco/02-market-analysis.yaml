    {
      "id": "drivers-constraints-and-regulation",
      "title": "Growth Drivers, Adoption Constraints, and Regulatory Friction",
      "body": "The demand-side drivers are real. BCI and neurofeedback sources point to AI-based signal processing, wider cognitive-wellness adoption, and continuing neurorehabilitation interest. EdTech sources emphasize personalized learning, cloud delivery, and digital curriculum investment. Prosthetics sources emphasize amputee need, aging and disability prevalence, and steady improvements in myoelectric and sensor-driven hardware. But BrainCo's path is shaped just as much by constraints. School adoption carries a trust tax: BrainFutures describes classroom attention monitoring, VICE documents a 2019 backlash that halted a Zhejiang school deployment, and Hunterbrook raises fresh data-governance and surveillance concerns. Consumer and institutional neurofeedback also depend on efficacy evidence that remains thinner than the market narrative; BrainFutures explicitly lists no available research for Focus EDU. On the medical side, FDA's approvals-and-clearances framework makes clear that devices may need 510(k), PMA, or de novo review, while the EU's MDR creates a separate compliance regime. BrainCo's own prosthetics pages reference PDAC approval and reimbursement support, but the retained public set still lacks a clean, product-by-product regulatory map across the U.S., EU, and China. Net, BrainCo benefits from strong category growth, yet the rate-limiting steps are trust, evidence, reimbursement, and regulatory execution rather than raw market size.",
