      "id": "sizing-lenses-and-geography",
      "title": "Sizing Lenses, Regional Split, and Relative Market Scale",
      "body": "Published market estimates confirm demand but not a single precise serviceable market. In retained 2026 sources, the global BCI market ranges from USD 1.4 billion in Mordor Intelligence's 2026 baseline to USD 3.33 billion in Precedence Research, with The Business Research Company at USD 2.72 billion and Grand View Research projecting USD 6.52 billion by 2030. Those differences are not trivial noise; they reflect varying inclusion of clinical neuroprosthetics, consumer EEG wearables, gaming, military, and smart-home applications. Adjacent categories show the same pattern. The neurofeedback market is much smaller but directly relevant to FocusCalm at about USD 1.74 billion in 2026, while the bionic prosthetics market is about USD 1.96 billion in 2026 and the broader prosthetics-and-orthotics market is several times larger. EdTech is enormous at USD 213.2-236.25 billion in 2026, but that category is far too broad to treat as BrainCo's actual TAM because most spend goes to LMS, SIS, content, and hardware unrelated to EEG attention training. Regionally, retained BCI and EdTech sources consistently describe North America as today's largest revenue pool and Asia-Pacific as the faster-growth region, which matches BrainCo's U.S.-China operating footprint. The right conclusion is not that BrainCo can address every dollar across these markets, but that it plays in several growing categories whose combined ceiling is large while the directly reachable wedge remains much narrower.",
