    {
      "id": "platform-and-dependency-risk",
      "title": "Platform and dependency risk",
      "body": "Aikido’s product is intentionally low-friction: API based, read-only by default, and tightly connected to source-control, cloud, CI, and workflow tools. That is commercially attractive because it reduces deployment pain and helps customers get value quickly, but it also creates a concentrated dependency map. GitHub state determines onboarding and access sync; cloud permissions determine CSPM visibility; PR gating depends on upstream SCM hooks; and the SCA story depends partly on third-party intelligence such as NVD, GitHub Advisory, and other feeds. When the company says it is ‘agentless’ and up in minutes, it is also saying that external platforms are a material part of the control plane.\n\nMitigants are real. Trust-center materials emphasize ephemeral code handling, default read-only scopes, and local scanning options for privacy-sensitive environments. Zen Firewall adds runtime protection and broad language support, and PR gating plus CI/API paths provide alternatives to a single workflow. Still, the operating model imports partner risk directly into product reliability. Permission changes, API-rate limits, or feed-quality problems can degrade coverage before Aikido itself ships a line of code. The local-scanning path also comes with a clear trade-off: privacy-sensitive buyers can keep code local, but the public docs say those accounts do not get UI AutoFix, which means one of the product’s flagship productivity claims does not travel cleanly to every deployment mode.",
