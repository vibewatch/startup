      "id": "regulatory-privacy-and-procurement-risk",
      "title": "Regulatory, privacy, and procurement risk",
      "body": "Aikido’s main legal risk is not an obvious active lawsuit or regulator action; it is the gap between what the public packet proves and what regulated buyers may demand. The company’s public legal surface is credible but incomplete: the privacy policy explicitly uses GDPR as the benchmark, the terms identify a Belgian legal entity, and the trust center plus compliance docs show a serious effort to package evidence for security reviews. But the same retained surface also shows limits. The public site terms are not tailored to HIPAA, FISMA, or GLBA interactions, and the packet reviewed here does not itself surface a customer DPA, subprocessor register, or detailed incident commitments. That does not mean those materials do not exist privately; it does mean the public legal surface alone is not enough to underwrite a regulated-enterprise expansion case.\n\nThe timing risk is rising because Aikido does not just sell generic AppSec anymore. Its documentation explicitly markets compliance pages for NIS2, DORA, GDPR, and other frameworks, while its SCA marketing now ties SBOM output to CRA readiness. That positioning can accelerate sales, but it also makes the product and trust team accountable for audit-grade mappings, not just good UX. If Aikido cannot substantiate those mappings during customer diligence, procurement cycles could lengthen, regulated opportunities could stall, and customer trust could break precisely where the company is trying to move up-market.",
