- id: named-customer-proof-and-measured-outcomes
  title: Named customer proof and measured outcomes
  body: 'Named customer proof is the chapter’s strongest evidence set because Aikido publishes more than a logo wall. Several stories expose operational numbers or concrete outcomes. n8n reports 92% noise reduction and a structured SLA process for 21-day high-severity findings. Supermetrics reports 75% noise reduction. Pathful says total issues fell 60% in two weeks. Petrosea says the fastest fix happened five seconds after detection and compliance-reporting time fell at least 80%. Birdie reports issues can be fixed in 30 seconds, while Simployer says developers now fix issues in under a minute. Visma, Oviva, AutoStore, Render, and HeyJobs add the scale layer: thousands of developers or hundreds of repositories rather than a single sandbox deployment. Even Smartendr’s AI pentest story is useful because it shows Aikido in a due-diligence and audit context, with 54 validated findings and automatic retesting. The limitation is that almost all of this proof is Aikido-authored, so it underwrites
    product usefulness better than renewal durability.'
