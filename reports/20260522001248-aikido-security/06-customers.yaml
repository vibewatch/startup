  - - AutoStore
    - Global automation / enterprise software
    - Unified AppSec across GitHub, GitLab, and Azure DevOps for a diverse codebase
    - Production
    - About 100 repositories and 100 developers rolled out in a few weeks by one engineer
    - Outcome proof is strongest on deployment efficiency, not on retention or cost savings
  - - HeyJobs
    - Recruitment platform / scaleup SaaS
    - Unified signals across code, containers, and cloud with clearer prioritization
    - Production
    - 95 repositories, 31 container registries, and 9 cloud environments connected; blast radius said to be significantly smaller
    - No quantified ARR, renewal, or explicit seat count
  - - n8n
    - Developer tools / workflow automation
    - Central vulnerability process with SLAs, team routing, and open-source security visibility
    - Production
    - 92% noise reduction and better ability to meet 21-day high-severity deadlines
    - Noise reduction is company-quoted rather than independently audited
  - - Simployer
    - HRTech / compliance-sensitive SaaS
    - Security embedded across teams and CI/CD with automatic fixes
    - Production
    - Developers now fix vulnerabilities in under a minute and security is handled like day-to-day work
    - No deployment scale metrics such as repos, users, or spend
  - - Birdie
    - HealthTech / home-care platform
    - Compliance automation, autofix, and developer-friendly vulnerability management
    - Production
    - Issue resolution can happen in about 30 seconds with click-to-merge workflows
    - Fast-fix metric is customer-quoted and not tied to broader volume or retention data
  - - Petrosea
    - Mining / industrial technology
    - Unified code, cloud, and compliance workflow for a 20-person engineering team
    - Production
    - Fastest fix in 5 seconds after detection and compliance-reporting time down at least 80%
    - Public evidence is a single customer story without contract or renewal detail
  - - Pathful
    - Education SaaS
    - Lower-noise vulnerability management and compliance support for student-data workflows
    - Production
    - Total issues fell 60% over two weeks and interns were able to remediate quickly
    - Short time window; no long-term retention or budget data
  - - Smartendr
    - Hospitality / payments software
    - AI pentest and continuous risk validation across application and integrations
    - Production
    - 54 validated findings with automatic retesting and partner-ready reporting
    - Focus is pentest value rather than core-seat expansion economics
