chapter:
  number: 6
  title: Customers
  summary: 'Aikido’s public customer proof shows real adoption among developer-led software teams, especially scaleups, enterprise platform teams, and portfolio rollouts that want lower-noise security embedded in normal engineering workflows. The strongest evidence is operational rather than logo-only: Visma says Aikido reaches 200+ portfolio companies and 6,000 developers; Oviva connected 75+ developers and 200+ repos within weeks; AutoStore rolled out roughly 100 repos and 100 developers in weeks; HeyJobs spans 95 repos, 31 registries, and 9 cloud environments; and named customers report 92% noise reduction, 75% noise reduction, 60% fewer issues, 80% less compliance-reporting time, and fixes in 5–30 seconds or under a minute. The underwriting gap is durability: public materials claim 100,000+ teams and triple customer growth, but they do not disclose exact current organizations, NRR, GRR, churn, or customer concentration.'
sections:
- id: customer-segment-mix
  title: Customer segment mix and who pays, uses, and benefits
  body: 'Aikido’s visible customers are not random logos. The public customer surface spans startup, scaleup, enterprise, and multi-company rollout contexts, but it is overwhelmingly software-led and engineering-owned. The people quoted in customer stories are CTOs, CISOs, VP Engineering, platform leaders, DevSecOps engineers, security engineers, and developers rather than procurement officers. That matters because it suggests the product wins where the buyer wants a unified workflow tool that developers will actually use. The customer-stories index explicitly spans Startup, Scaleup, and Enterprise, while fetched stories cover HealthTech, HRTech, LegalTech, HospitalityTech, SecurityTech, Manufacturing, education, and portfolio settings. Enterprise fit is also supported by the published enterprise plan sized for 2,000 repos, 1,000 containers, 100 cloud accounts, and 500 users plus multi-tenant and on-prem options. The caveat is denominator discipline: Aikido publicly alternates between organizations,
    developers, and teams, so breadth is obvious but exact customer mix is not.'
