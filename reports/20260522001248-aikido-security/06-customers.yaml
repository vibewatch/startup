  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Retention metrics and customer concentration are not publicly disclosed
    missingEvidence: Public sources do not provide exact current paying organizations, NRR, GRR, logo churn, contract duration, or top-customer ARR concentration.
    whyItMatters: Without those metrics, satisfaction proxies and deployment anecdotes cannot be converted into an underwritten durability view.
    diligencePath: Request cohort retention tables, top-10 customer concentration, contract-length distribution, and free-versus-paid account bridges from management.
    relatedQuestionRefs:
    - QU017
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof table is a partial sample of public references rather than a full customer roster
    missingEvidence: Aikido does not publish a complete named-customer list or renewal status for the accounts referenced in public case studies.
    whyItMatters: The named customer proof table is useful for validating production adoption, but a selective public sample can overrepresent ideal deployments.
    diligencePath: Request a fuller customer list, reference-call set, and renewal history by customer tier before treating TU003 as representative of the installed base.
    relatedTableRefs:
    - TU003
    relatedQuestionRefs:
    - QU014
    - QU023
    - QU025
