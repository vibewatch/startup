- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Item
  - Type
  - Impact
  - Diligence path
  rows:
  - - Tool consolidation
    - Expansion driver
    - High positive — multiple customers replace fragmented stacks or combine DAST, SAST, cloud, and compliance workflows in one platform
    - Request module attach rates and win-loss data versus point tools
  - - Workflow integrations
    - Expansion driver
    - High positive — GitHub, GitLab, Azure DevOps, CI/CD, Slack, Jira, Linear, PagerDuty, and Vanta make Aikido part of daily work
    - Request active integration count per customer and seat-level weekly engagement
  - - Portfolio rollout motion
    - Expansion driver
    - High positive — Visma shows one central win can open many portfolio-company deployments
    - Request multi-entity ARR concentration and conversion from pilot to portfolio standard
  - - Enterprise features
    - Expansion driver
    - Medium-high positive — multi-tenant, on-prem, security reports, and higher repo or cloud ceilings support upmarket selling
    - Request attach rates for enterprise services and their gross-margin profile
  - - Compliance-led buying
    - Expansion driver
    - Medium-high positive — audit reporting, Vanta integrations, and regulated-buyer proof create sales leverage in sensitive verticals
    - Request compliance-driven win rates and expansion by vertical
  - - SMB pricing sensitivity
    - Concentration risk
    - Medium-high negative — G2 comments and review summaries say pricing can feel steep for smaller businesses and pentest pricing can feel high
    - Request SMB churn, free-to-paid conversion, and discounting by customer size
  - - Curated public proof
    - Concentration risk
    - High negative — most concrete evidence is Aikido-authored case-study content, so independent retention proof remains thin
    - Request reference-call list, renewal cohorts, and third-party satisfaction by segment
  - - Opaque customer concentration
    - Concentration risk
    - High negative — public materials disclose teams and growth claims but not exact paying organizations, top-customer mix, NRR, or churn
    - Request top-10 ARR, gross retention, net retention, and contract-expiry calendar
  notes: The upside case is a workflow-expansion and consolidation story. The risk case is that public materials never convert that story into customer-economics disclosure.
