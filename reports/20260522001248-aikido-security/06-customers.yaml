tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Startups and small self-serve engineering teams
    - Founder or CTO buyer; developer or platform user; lightweight engineering budget payer
    - Fast code, cloud, and dependency scanning with low-friction onboarding and free-tier entry
    - Customer-stories page includes Startup segment; G2 free-tier review highlights straightforward setup
    - Broad top-of-funnel for future paid expansion, especially developer-led land motion
    - Public sources do not disclose free-to-paid conversion or SMB ACV
  - - Scaleup SaaS and regulated digital operators
    - CTO, VP Engineering, DevSecOps, and platform leads; developers as daily users; product or engineering budget owners
    - Noise reduction, CI/CD integration, compliance reporting, and faster remediation
    - Oviva, Birdie, Simployer, Jurimesh, Pathful, and HeyJobs are named proofs
    - Likely core recurring segment because security and delivery speed are both business-critical
    - Segment ARR and renewal data are not public
  - - Enterprise software and platform teams
    - CISO or security-platform lead buyer; engineering managers and developers as users; centralized security budget payer
    - Unify AppSec stack, workflow routing, and risk visibility across many repos and teams
    - AutoStore, Render, Human Security, Prove, Supermetrics, and n8n show enterprise-grade usage
    - Higher ACV and stronger expansion potential through workflow embed
    - Most evidence is curated vendor-authored proof rather than independent cohort disclosure
  - - Portfolio and multi-company operators
    - Central security function buyer; portfolio company engineers as users; group platform budget payer
    - Standardize scanning and reporting across many entities with predictable governance and pricing
    - Visma covers 200+ portfolio companies and 6,000 developers; earlier Aikido disclosure cited 175+ Visma companies
    - Very high strategic value because one sale can drive multi-entity adoption
    - Public proof is concentrated in one flagship example and does not disclose ARR concentration
  - - Regulated or transaction-heavy buyers
    - Security and platform leadership buyer; engineering teams as users; compliance or governance budget support
    - Audit readiness, GDPR or ISO support, evidence generation, and faster risk remediation
    - Health, HR, legal, education, and hospitality or payments references recur across fetched stories
    - Strong diligence-led expansion wedge because security posture directly affects sales and trust
    - Direct public-sector logo proof is still thin in this run
  - - Large enterprises with sensitive deployment needs
    - Security, compliance, and platform procurement buyer; distributed engineering teams as users; enterprise IT payer
    - On-prem scanning, multi-tenant governance, custom SLAs, and stakeholder-ready reports
    - Official enterprise and pricing surfaces describe these options plus high repo and cloud ceilings
    - Supports upmarket expansion beyond pure developer self-serve
    - Public materials do not disclose attach rates or how often enterprise services close deals
  notes: Segments are grouped by buyer and workflow shape rather than by undisclosed ARR split. Strategic value reflects public evidence quality and expansion logic, not private revenue mix.
