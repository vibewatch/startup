- id: adoption-trajectory-and-denominator-discipline
  title: Adoption trajectory and denominator discipline
  body: 'Public adoption trajectory is strong but messy. A May 2024 company post said Aikido had over 3,000 organizations and 6,000 individual developers within a year of launch, while TechCrunch independently reported roughly 3,000 small-to-midsize customers around the same fundraise. By January 2026, Aikido and multiple news outlets were saying the product was used by more than 100,000 teams and that the customer base had more than tripled over the prior year. Those are powerful growth signals, but teams are not the same thing as paying organizations, and neither measure tells us seat count, ARR mix, or free-versus-paid distribution. The better-underwritten part of the trajectory comes from deployment surfaces: Visma at 200+ portfolio companies and 6,000 developers, Oviva at 75+ developers and 200+ repos in weeks, AutoStore at about 100 repos and 100 developers, HeyJobs across 95 repos plus 31 registries and 9 clouds, and Render across roughly 30 repos and 50 developers. The conclusion
    is clear real adoption, but with unresolved denominator drift.'
