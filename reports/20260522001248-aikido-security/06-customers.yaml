- id: satisfaction-proxies-and-durability-gaps
  title: Satisfaction proxies and durability gaps
  body: 'Durability is the weak spot in the public record. Independent review surfaces are directionally positive: G2 shows 4.6/5 across 139 reviews, TrustRadius shows 8.1/10 across 2 reviews, FeaturedCustomers enumerates 46 reviews and testimonials plus 35 case studies and 5 videos, and SourceForge lists 6 user reviews with a 5.0/5 score. Those are real signals that users like the product and that public reference density is respectable for a young security vendor. But the adverse read matters too. G2’s summary says pricing can feel steep for smaller businesses, and individual reviews ask for deeper customization, better large-enterprise reporting, and cheaper pentest pricing. More importantly, none of the fetched public sources disclose exact current paying organizations, NRR, GRR, gross churn, logo churn, contract duration, or top-customer concentration. Repeat-usage proxies exist—n8n checks the feed at least five times a week, Render embeds regular reporting into operations, and Jurimesh
    pushes continuous evidence into Vanta—but they are still proxies, not auditable retention metrics.'
