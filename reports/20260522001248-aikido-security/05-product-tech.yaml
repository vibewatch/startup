- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Repo security triage
    - Review code, dependency, secret, and IaC risk in PRs and default branches.
    - Code scanning with PR comments, AI triage, AutoFix, and ticketing/chat integrations.
    - Official sources frame the value as lower noise and faster developer feedback.
    - Public evidence on false-negative rate and workflow precision remains limited.
  - - Dependency-install hardening
    - Stop malicious packages before they land on laptops or CI agents.
    - Safe Chain local proxy for npm, yarn, pnpm, npx, pnpx, pip, uv, and poetry.
    - Blocks typosquats, malware, and too-new releases without token setup.
    - Need central policy and fleet-management detail for large enterprises.
  - - Cloud and container hygiene
    - Discover risky assets across clouds, registries, VMs, containers, and runtimes.
    - Agentless CSPM plus container and runtime correlation.
    - Single view ties posture issues to workloads and outdated runtimes.
    - Public scale and data-lag metrics are absent.
  - - API exposure testing
    - Discover and test documented plus hidden endpoints.
    - Swagger-to-traffic, Zen discovery, authenticated fuzzing for REST and GraphQL APIs.
    - Potentially broader coverage than spec-only scanning.
    - Need stronger public proof on auth/session depth and scheduling.
  - - Compliance and customer evidence
    - Produce SBOMs, audits, trend reports, and control evidence for buyers or audits.
    - CycloneDX, SPDX, VEX, audit, SLA, team, and compliance report outputs.
    - Turns security scanning into externally consumable evidence.
    - Review sites imply some reporting and API depth is gated by plan.
  - - Runtime attack blocking
    - Catch exploit attempts that bypass pre-deploy scanning.
    - Zen sink tracing, rate limiting, bot/Tor/country controls, and AI monitoring.
    - Adds runtime validation and blocking in app context.
    - Needs more public benchmark data on performance and detection breadth.
  notes: This table translates product modules into user jobs and operating workflows, which is the most useful frame for diligence because Aikido sells integrated workflow reduction rather than isolated detection engines.
  enumerationScope:
    coverage: partial
    basis: Rows cover the major user jobs repeatedly surfaced in retained product, docs, and review sources, but they do not enumerate every integration-specific workflow.
