- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Main risk
  rows:
  - - Git providers + local scanners
    - Provide repo, branch, PR, and CI context for code scanning.
    - GitHub, GitLab, Azure DevOps, Bitbucket, or local scanner execution.
    - Coverage drops if repos cannot be connected or scanned locally.
  - - Cloud APIs
    - Ingest posture, VM, runtime, and asset data with minimal deployed infrastructure.
    - AWS, Azure, and GCP read-only API connectivity.
    - Permission gaps or API drift can reduce visibility and freshness.
  - - Registries + image metadata
    - Link container findings back to code owners and runtime assets.
    - Registry access plus package and image metadata.
    - Disconnected registries break end-to-end lineage and prioritization.
  - - Zen in-app runtime
    - Observe request-to-sink behavior and optionally block at runtime.
    - Language-specific libraries embedded into customer applications.
    - Performance, framework coverage, and rollout discipline become material.
  - - Opengrep + Aikido control plane
    - Execute rules, correlate findings, triage, autofix, and manage dashboards.
    - Open-source engine plus Aikido orchestration and integrations.
    - OSS maintenance and orchestration quality are critical dependencies.
  - - AI + report/export surfaces
    - Generate fixes, OpenAPI specs, custom rules, summaries, and compliance artifacts.
    - Model inference plus retained scan context and report templates.
    - Accuracy, governance, and data-boundary detail need diligence.
  notes: Aikido’s architecture is best understood as a control plane sitting on top of external source, cloud, registry, runtime, and OSS inputs. That creates flexibility and workflow fit, but also introduces ecosystem dependence.
  enumerationScope:
    coverage: partial
    basis: Rows summarize the main architectural layers visible in retained sources rather than every microservice or processing job.
