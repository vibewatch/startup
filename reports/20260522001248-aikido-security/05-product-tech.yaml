tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - SAST / code rules
    - Developers + AppSec
    - Core / mature
    - Opengrep-backed SAST with AI triage, custom rules, and autofix positioning; marketed as materially lower-noise than legacy tools.
    - Need independent benchmark evidence on precision, false negatives, and custom-rule depth.
  - - SCA / supply chain
    - Developers + AppSec
    - Core / mature
    - Reachability, malware intelligence, pre-CVE positioning, and SBOM/VEX outputs create a workflow richer than CVE-only lists.
    - Need deeper proof of reachability accuracy and malware-prevention efficacy in production accounts.
  - - Secrets / IaC scanning
    - Platform + DevOps
    - Core / mature
    - Active-secret validation plus Terraform, CloudFormation, Helm, and Dockerfile coverage keeps low-level misconfigurations in the same console.
    - Need false-positive and branch-workflow performance data on large monorepos.
  - - Cloud / VM / container posture
    - CloudSec + DevOps
    - Core / mature
    - Agentless CSPM combined with VM, runtime, registry, and container context supports correlation rather than separate consoles.
    - Need public scale, ingestion-latency, and multi-account evidence.
  - - API / DAST / surface monitoring
    - AppSec + platform
    - Growth / expanding
    - REST and GraphQL fuzzing with Swagger-to-traffic and Zen-assisted endpoint discovery extends coverage beyond static specs.
    - Need clearer public proof on auth/session handling, scheduling depth, and noisy-environment tuning.
  - - Zen runtime firewall
    - Platform engineers
    - Growth / differentiated
    - Open-source in-app firewall with sink tracing, rate limits, bot/Tor controls, OpenAPI generation, and runtime attack context.
    - Need telemetry, overhead, and enterprise rollout evidence by framework.
  - - Safe Chain
    - Developers + CI owners
    - Focused / OSS-led
    - Tokenless local package-install guardrail with malware blocking and a default 48-hour package-age policy.
    - Need attach-rate, adoption, and enterprise policy-management evidence.
  - - Reporting / compliance outputs
    - Security leaders + compliance
    - Core / mature
    - Audit, trend, SLA, malware, runtime, team, SBOM, VEX, and compliance-style outputs turn scans into buyer-facing evidence.
    - Need plan-by-plan entitlement detail and API depth for exported reports.
  - - Aikido Infinite / pentesting
    - Security teams + leadership
    - New / emerging
    - Validate-remediate-retest loop across releases is a differentiated narrative if execution holds.
    - Need independent benchmark, customer references, and GA evidence beyond launch coverage.
  notes: The rows cover the major product assets surfaced in retained official, technical-docs, and developer-signal sources. They should be read as the externally visible product map, not an internal engineering-component inventory.
  enumerationScope:
    coverage: partial
    basis: Rows include the principal product modules and OSS assets that are explicitly surfaced across retained materials, but they do not attempt to enumerate every integration, rule pack, or hidden beta capability.
