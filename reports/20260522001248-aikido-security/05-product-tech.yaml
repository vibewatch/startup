- id: runtime-open-source-and-roadmap-velocity
  title: Runtime, open-source assets, and roadmap velocity
  body: |-
    Aikido's public GitHub surface is unusually important to the product story because it shows the company ships more than polished landing pages. The AikidoSec organization hosts dozens of repositories, with Safe Chain and the multi-language Zen runtimes acting as concrete proof that the company invests in developer tooling, not just centralized dashboards. Opengrep strengthens that argument by giving Aikido an open static-analysis engine and consortium-backed governance story. Together, those assets make Aikido look more like a workflow platform with extensible technical building blocks than a purely closed-box scanner vendor.

    Roadmap velocity, however, is increasingly being defined by offensive testing and autonomous remediation. Independent 2026 coverage and Aikido's own materials show a strategic push into AI pentesting and the Infinite release-loop concept, reinforced by the Allseek and Haicker acquisition and fresh Series B funding. That direction is promising and strategically coherent with the rest of the stack, because Zen, OpenAPI generation, and scan context can all feed a richer exploit-validation workflow. But it is also the least mature part of the public product narrative. The core code and cloud modules appear established; the self-securing-software claims still need more independent benchmark and deployment evidence.
