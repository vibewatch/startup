  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: infinite-benchmarking
      missingEvidence: Independent benchmark methodology, customer reference set, and repeatable production evidence for Aikido Infinite versus core scanning modules or human pentest alternatives.
      whyItMatters: The newest and most ambitious product claim is the self-securing release loop; without stronger proof, investors cannot tell whether Infinite is differentiated reality or aggressive roadmap marketing.
      diligencePath: Request cohort-level customer references, benchmark methodology, exploit-validation precision metrics, and case studies showing validated remediation loops in production.
      relatedQuestionRefs:
        - QE020
        - QE026
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: fedramp-scope
      missingEvidence: Current FedRAMP package status, sponsoring agency, boundary definition, control inheritance map, and target authorization timeline.
      whyItMatters: Trust-center wording implies ambition, but regulated public-sector buyers need verified scope and milestones rather than roadmap phrasing.
      diligencePath: Request FedRAMP project plan, SSP milestones, sponsoring-party details, and any completed third-party assessment artifacts.
      relatedQuestionRefs:
        - QE025
        - QE026
      relatedTableRefs:
        - TE004
        - TE005
    - type: private-evidence-only
      severity: minor
      topic: zen-telemetry-boundaries
      missingEvidence: Publicly detailed Zen telemetry schema, retention behavior by deployment mode, and enterprise-grade performance data across major frameworks.
      whyItMatters: Zen is one of the most differentiated assets, so runtime overhead and data-boundary clarity matter disproportionately in diligence.
      diligencePath: Request architecture notes for Zen data egress and retention, benchmark results by framework, and reference deployments at scale.
      relatedQuestionRefs:
        - QE019
        - QE024
        - QE026
      relatedTableRefs:
        - TE003
        - TE004
