chapter:
  number: 5
  title: Product & Technology
  summary: Aikido Security has built a credible code-to-cloud-to-runtime application-security platform with unusually strong developer-native distribution and open-source leverage for a company of its age. Retained official, technical-docs, and developer-signal evidence supports broad module coverage across SAST, SCA, secrets, IaC, container, cloud, API, runtime, reporting, and newer continuous-pentest workflows, plus a delivery model built around read-only integrations, optional local scanners, and OSS runtime components such as Zen, Safe Chain, and Opengrep. The main diligence conclusion is positive on breadth, workflow fit, and trust posture, but more guarded on the newest offensive-testing claims, deeper enterprise telemetry/compliance detail, and independent proof behind some maturity and benchmark assertions.
sections:
- id: platform-scope-module-map-and-differentiation
  title: Platform scope, module map, and differentiation
  body: |-
    Aikido is not presenting a single scanner with add-ons; it is marketing a full application-security operating surface that starts in source code, extends into cloud and container posture, reaches into API and offensive testing, and ends with runtime controls and governance outputs. The retained module pages support that framing. Code products cover SAST, SCA, secrets, IaC, containers, and SBOM/compliance use cases, while cloud pages add CSPM and runtime inventory and the attack surface includes API fuzzing, DAST-style monitoring, pentests, and the newly launched Infinite workflow. Zen then sits as a separate runtime asset rather than a mere extension of the code scanner.

    What makes the product thesis more credible than generic bundle marketing is the amount of developer-native and open-source evidence underneath it. Aikido openly ties SAST to Opengrep, publishes Zen runtimes and Safe Chain on GitHub, and distributes through GitHub Marketplace with meaningful install volume. That does not prove every module is best-in-class, but it does show an architecture and go-to-market model built on workflow fit, auditable components, and distribution channels that developers actually touch. The main differentiation claim is therefore breadth plus low-noise automation, not extreme specialist depth in each individual category.
