      - number: '1.3'
        title: Capital formation, traction, and public scale
        blocks:
          - type: paragraph
            body: >
              Aikido's funding trajectory is unusually compressed. Public seed reporting in November 2023 described a €5
              million round co-led by Notion Capital and Connect Ventures, while the company and TechCrunch then
              documented a $17 million Series A in May 2024 led by Singular with continued support from Notion and
              Connect. The January 2026 Series B added $60 million led by DST Global, with PSG Equity and prior
              investors participating, and priced the company at a $1 billion valuation. The official about page now
              summarizes total capital raised at about $85 million, while BankInfoSecurity reports nearly $85 million
              across four rounds, implying some form of smaller pre-seed or convertible financing before the formal
              seed.


              Traction signals are strong but should be normalized carefully. The Series A narrative emphasized 3,000
              organizations and 6,000 developers, while the January 2026 company materials shifted to 100,000-plus teams
              and cited public customers such as the Premier League, Revolut, SoundCloud, and Niantic. Revenue
              reportedly increased fivefold in 2025 and customer count more than tripled, which is directionally
              impressive even if the company still does not publish ARR, gross margin, retention, or audited revenue.
              Review-platform evidence is positive on usability and breadth, but those datasets remain small, so
              institutional investors should treat them as supporting signal rather than final proof of durable
              enterprise product-market fit.
