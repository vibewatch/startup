              more like a workflow platform with extensible technical building blocks than a purely closed-box scanner
              vendor.


              Roadmap velocity, however, is increasingly being defined by offensive testing and autonomous remediation.
              Independent 2026 coverage and Aikido's own materials show a strategic push into AI pentesting and the
              Infinite release-loop concept, reinforced by the Allseek and Haicker acquisition and fresh Series B
              funding. That direction is promising and strategically coherent with the rest of the stack, because Zen,
              OpenAPI generation, and scan context can all feed a richer exploit-validation workflow. But it is also the
              least mature part of the public product narrative. The core code and cloud modules appear established; the
