      - number: '5.2'
        title: Developer workflow and operating model
        blocks:
          - type: paragraph
            body: >-
              The technical operating model is one of Aikido's strongest public assets. Documentation and product pages
              show onboarding through source-control integrations, read-only cloud connectors, registry access, optional
              local scanners for restricted environments, and in-app Zen libraries when customers want runtime coverage.
              That means the platform can start as lightweight SaaS-style scanning, but the fuller version depends on
              deeper customer telemetry from CI, runtime, cloud, and API traffic. Container and cloud materials
              repeatedly emphasize correlation: images, packages, VMs, runtimes, and repositories are linked so the
              system can prioritize issues in operational context rather than emitting isolated finding lists.


              The workflow after ingestion is equally important. Aikido documents PR feedback, CI gating, AI triage,
              AutoFix, SBOM export, compliance reporting, and API discovery flows that use both declared specs and
              observed traffic. Safe Chain extends the control point upstream into package installation, while Zen
              extends it downstream into application runtime. The result is a coherent loop from detection to
              prioritization to fix or block. The remaining diligence question is not whether the workflow exists; it is
              how consistently it performs at enterprise scale, across complex auth/session patterns, and under stricter
              deployment or data-handling requirements.
