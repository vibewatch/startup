  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      How developer-led buyers move from noise or compliance pain into pilot, rollout, repeat workflow use, and
      expansion with Aikido.
    data:
      items:
        - label: Awareness
          detail: >-
            The trigger is usually a combination of alert fatigue, fragmented tooling, audit pressure, or a need to make
            security usable for developers rather than a separate dashboard ritual.
          touchpoints:
            - Too many false positives
            - Compliance and audit deadlines
            - Security-tool sprawl
        - label: Evaluation
          detail: >-
            Teams compare Aikido against Snyk, GitHub Advanced Security, Detectify, Tenable, Black Duck, or multi-tool
            open-source stacks and focus on usability, signal quality, and integration fit.
          touchpoints:
            - Noise reduction demos
            - Proof-of-concept on a few repos
            - Competitor replacement tests
        - label: Initial rollout
          detail: >-
            The first deployment tends to connect repositories, cloud accounts, registries, and existing workflow
            systems quickly so teams can see issues in familiar tools without major enablement overhead.
          touchpoints:
            - GitHub or GitLab connection
            - Slack, Jira, Linear, or Vanta integration
            - Repository and cloud scan setup
        - label: Daily usage
          detail: >-
            The product becomes useful when teams triage fewer issues, auto-fix or route the ones that matter, and use
            reports or evidence exports for customer and audit conversations.
          touchpoints:
            - Main feed review
            - AutoFix and remediation guidance
            - Security audit reports and compliance evidence
        - label: Expansion / renewal
          detail: >-
            The best public expansion pattern is broader standardization: more repos, more teams, portfolio rollouts,
            enterprise services, or AI pentest adoption layered onto the core workflow.
          touchpoints:
            - Portfolio-company rollout
            - Enterprise features and on-prem
            - AI pentest and continuous testing
    approximationNotes: >-
      This journey map is reconstructed from fetched customer stories, pricing surfaces, and review pages. Aikido does
      not publish stage-conversion rates or average sales-cycle timing.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU040
      - CU043
