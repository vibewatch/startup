      - number: '6.5'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The expansion story is convincing even without retention disclosure. Public proof repeatedly shows Aikido
              replacing scattered stacks: Prove collapsed six AppSec tools into one platform; Go Autonomous switched
              from Snyk after a 1,000-plus vulnerability backlog; Render consolidated DAST and SAST; HeyJobs replaced a
              sprawl of dependency and alert tools; and Visma emphasizes predictable pricing and portfolio rollout.
              Integrations into GitHub, GitLab, Azure DevOps, CI/CD, Slack, Jira, Linear, PagerDuty, and Vanta make the
              product part of everyday work, which is the clearest visible stickiness vector. Enterprise
              features—multi-tenant portal, local deployment, security reports, and higher repo/container/cloud-account
              ceilings—support upmarket expansion. The central risk is that the public customer set is still curated and
              software-heavy. Aikido clearly has real customers; what public materials do not reveal is how much ARR
              sits in the largest accounts, how much usage is free versus paid, or whether expansion is broad-based
              versus concentrated in a handful of large engineering organizations.
