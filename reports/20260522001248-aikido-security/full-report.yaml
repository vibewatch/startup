      - number: '3.2'
        title: Capability, pricing, and strategic direction
        blocks:
          - type: paragraph
            body: >
              The competitor field breaks into distinct strategic models. Snyk remains a broad developer-first AppSec
              platform with add-on modules and seat-based pricing. GitHub Advanced Security sells native code and secret
              protection inside the largest developer workflow in the market. Semgrep competes on developer
              friendliness, free entry, and a contributor-based model. Veracode and Checkmarx emphasize enterprise-grade
              platform breadth, governance, and deeper large-account sales motions. Orca, Apiiro, and Jit are stronger
              examples of context-rich code-to-cloud or ASPM-style positioning, while Endor Labs and Mend push harder on
              software-supply-chain intelligence and prioritization.


              Price transparency itself is a strategic variable. Aikido publishes simple entry pricing, GitHub publishes
              active-committer pricing for code and secret protection, Snyk advertises starting plans, and Semgrep
              openly shows free and paid packaging. By contrast, much of the upper-enterprise field still relies on
              quote-driven procurement. AppSec Santa’s pricing guide notes how quickly enterprise AppSec stacks can move
              into the $30,000 to $150,000 annual range and above. That matters because Aikido is trying to win accounts
              where procurement simplicity and total-cost clarity are part of the product, not just a commercial
              footnote.
