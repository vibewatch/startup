  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and land motion
        blocks:
          - type: paragraph
            body: >
              Aikido's public monetization model is clearer than its actual financial performance. Official pricing,
              about, startup, and enterprise pages all point to a deliberate land-and-expand design: a free entry point,
              transparent list pricing for Basic, Pro, and Advanced tiers, and then a set of enterprise-only upsells
              such as custom SLA, multi-tenant management, on-prem or local deployment, broker support for internal
              applications, and premium onboarding or support. SourceForge independently mirrors the same tier structure
              and confirms a free plan with 2 users and 10 repositories, which makes the product unusually legible for
              startups and smaller engineering teams compared with many security vendors that force custom sales
              engagement early.


              That simplicity should not be confused with a pure one-line SaaS SKU. Partner and integration pages imply
              at least four monetization layers: recurring platform subscriptions, enterprise service packages,
              partner-led bundled sales through resellers and MSPs, and compliance or pentest-adjacent value capture
              tied to evidence generation and broader security workflows. The pricing page's AI pentest language
              suggests a usage-triggered or report-unlock component around offensive validation, but retained public
              materials do not disclose what percentage of revenue comes from recurring software versus one-off or
              service-like work. The most reasonable view is therefore a hybrid software-first model with attractive
              top-of-funnel accessibility and multiple expansion levers, but still no public revenue-mix disclosure
              robust enough for underwriting.
