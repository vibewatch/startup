      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >
              Leadership visibility is reasonably strong for a private European cybersecurity company of this age, but
              governance visibility is still partial. Current official hiring materials identify Willem Delbare as
              co-founder and CEO/CTO, Roeland Delrue as co-founder and COO, and Felix Garriau as co-founder and CMO. The
              same page also lists Madeline Lawrence as late co-founder and chief growth officer, alongside commercial
              leaders such as Thijs Janse and Louis Jonckheere. That gives a clear picture of who drives product,
              operations, marketing, growth, and U.S. expansion.


              Founder-market fit is one of the more persuasive elements of the overview. Public interviews and funding
              coverage repeatedly frame Aikido as a product built by former operators frustrated with noisy, fragmented
              developer-security tools. Delbare's prior company-building experience helps explain the team's speed in
              product packaging and go-to-market execution. But investors should separate leadership visibility from
              governance disclosure. Retained public materials identify capital providers and strategic backers, yet
              they do not provide a clean board roster, committee map, or independent-director structure. For a business
              now valued at $1 billion, that is a material diligence gap rather than a trivial omission.
