      - number: '8.3'
        title: Financing Context, Public Support, and Preference Overhang
        blocks:
          - type: paragraph
            body: |
              Publicly, Aikido's financing history is strong but incomplete. The retained record supports a
              path from €5 million seed funding in late 2023 to a $17 million Series A in May 2024 and a $60
              million Series B in January 2026, plus approximately €2 million of early convertible funding.
              That is enough to show credible investor demand and a capital base around $85 million. It is
              not enough to model downside precisely. The public record does not disclose the full cap table,
              preferred liquidation stack, anti-dilution mechanics, or whether any secondary liquidity was
              included in the latest round.

              Filing-derived evidence is directionally useful but not underwriting-grade. The Belgian BV
              entity had €18.2 million of assets and €14.7 million of equity at FY2025 year-end, yet also a
              negative gross margin and operating loss. The UK entity only appears in April 2026 filings with
              subsequent share-capital and accounting-period changes. That combination suggests the company is
              still building out its legal and reporting perimeter while scaling internationally. Investors can
              therefore say that Aikido is well financed. They cannot say, from public evidence alone, how
              much downside protection exists for common holders or late secondary buyers.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV028
              - CV037
              - CV038
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV024
