      - number: '4.4'
        title: Capital adequacy, financing dependency, and diligence blockers
        blocks:
          - type: paragraph
            body: >
              Public sources support the view that Aikido is well financed for its stage, but they do not let an
              investor calculate runway with confidence. The official about page and BankInfoSecurity both point to
              roughly $85 million of total disclosed funding, and the Series B announcement makes clear that management
              intends to spend aggressively on autonomous security and AI-driven pen testing. Solutions Magazine adds
              that revenue grew fivefold in 2025, nearly half came from the United States, and the customer base almost
              tripled, which suggests the company is scaling into a larger commercial footprint rather than simply
              warehousing capital. ARR Club's paywalled signal page goes further by placing ARR above $10 million in
              January 2026 and at $25 million by April 2026, but those figures should be treated as external estimate
              bands rather than verified company disclosure.


              The underwriting problem is not whether Aikido has momentum; it is whether that momentum converts into
              durable, efficient revenue. There is still no retained public disclosure of consolidated revenue, gross
              margin, net retention, CAC, payback, logo concentration, cash balance, debt, or runway months. Review data
              hints that the company is using transparent list pricing to disrupt a market full of expensive tool
              patchworks, while official enterprise and partner pages point to credible expansion vectors. Still,
              without management accounts and customer-cohort detail, investors cannot determine whether the business is
              a high-gross-margin SaaS compounder, a blended software-and-services model, or a capital-hungry growth
              story still proving its steady-state economics. The verdict is favorable on strategic trajectory and
              capital access, but still incomplete on revenue quality and cash durability.
