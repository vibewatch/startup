      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              The strongest competitive question is not whether Aikido has rivals; it clearly does. The real question is
              whether its wedge stays differentiated as AI-assisted scanning, autofix, and platform consolidation become
              table stakes. Several retained sources point toward convergence. Veracode and GitHub both emphasize
              AI-powered remediation. Jit and Apiiro emphasize context graphs and unified execution. Endor Labs pushes
              AI-native reasoning plus reachability. Orca argues that context and prioritization are the answer to alert
              fatigue. In other words, almost everyone is moving toward “fewer alerts, more context, faster fixes.”


              That convergence creates real commoditization risk. Aikido’s own alternative pages are useful because they
              expose the substitute set, but they are not neutral evidence. AppSec Santa’s alternatives guide is more
              helpful on the core trade-off: buyers look elsewhere when they need deeper specialization, richer
              ecosystems, or more mature enterprise controls than an all-in-one platform can offer. Aikido’s moat is
              therefore practical rather than absolute. If it can keep total cost low, setup easy, and cross-layer
              signal quality materially better, it can win a durable mid-market position. If larger platforms and deeper
              specialists close the simplicity gap, Aikido’s edge narrows quickly.
