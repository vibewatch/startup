  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, peer set, and substitute categories
        blocks:
          - type: paragraph
            body: >
              Aikido's substitute set is broader than a single named rival. The company's own comparison pages identify
              direct peers across several clusters: developer-first AppSec specialists such as Snyk and Semgrep;
              platform-native code hosts such as GitHub Advanced Security and GitLab Ultimate; enterprise-first AppSec
              vendors such as Veracode and Checkmarx; cloud or posture-centric platforms such as Orca, Jit, and Apiiro;
              and supply-chain-focused vendors such as Mend and Endor Labs. This is the right way to think about
              competition, because buyers do not compare one-for-one products with identical scope. They compare
              credible ways to solve the same problem inside their existing stack.


              That broader framing also means the status quo is not just “buy another tool.” Buyers can stick with a
              patchwork of open-source scanners, depend on platform-native features from GitHub or GitLab, outsource
              more work to pentesters or consultants, or combine code-only and cloud-only vendors. AppSec Santa’s 2026
              alternatives guide reinforces that the decision is often about depth versus simplicity rather than raw
              scanner count. Aikido’s main competitive advantage is simplicity, price visibility, and bundled coverage.
              Its main vulnerability is that specialized buyers can rationally choose a narrower but deeper platform.
