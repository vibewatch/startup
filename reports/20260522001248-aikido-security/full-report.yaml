      - number: '2.2'
        title: TAM, SAM, SOM, and contradictory estimates
        blocks:
          - type: paragraph
            body: >
              Third-party market estimates confirm that application security is already large, but they are not directly
              comparable. Mordor and Fortune both place the global application-security market around $14.8 billion to
              $14.9 billion in 2026, while Coherent is directionally similar at just above $15 billion.
              MarketsandMarkets, by contrast, publishes a much broader 2026 figure of $41.16 billion and a 2031 figure
              above $66 billion. The spread is too wide to average blindly. The more plausible interpretation is that
              the narrower cluster tracks core AppSec tooling and related services, whereas the larger figure pulls in a
              broader platform and services perimeter around application protection.


              For Aikido specifically, a bottom-up lens is more useful than a single industry headline. Mordor says
              large enterprises still account for the majority of spend, but small and medium enterprises are the
              faster-growing slice. That matters because Aikido's positioning, pricing, onboarding model, and industry
              pages all lean toward teams that need serious coverage without security-program overhead. A defensible
              2026 TAM for core AppSec sits near $15 billion, but Aikido's practical SAM is a smaller subset of
              cloud-native SMB, fintech, agency, and digitally native enterprise teams willing to buy integrated
              developer-first security. A reasonable analytical SAM band is roughly $2 billion to $3 billion, with a
              narrower near-term SOM below $1 billion until the company proves deeper penetration into very large
              enterprise accounts and regulated buyers.
