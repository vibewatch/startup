      - number: '7.3'
        title: Market-fit and operational execution risk
        blocks:
          - type: paragraph
            body: >-
              The official and independent customer record is directionally positive, but it still leaves execution
              risk. Official customer proof shows migrations away from a long list of incumbent point tools and
              repeatedly highlights noise reduction, fast onboarding, and rapid remediation. Pricing-page quotes even
              argue that Aikido responded quickly during the 2025 NPM supply-chain attacks, which is exactly the kind of
              behavior enterprise buyers want to hear. But independent evidence is thinner than the official story.
              Capterra’s review counts remain small, PeerSpot explicitly frames the product toward non-enterprise SaaS
              teams of 10-500 developers, and TrustRadius includes a reviewer request for agent-based infrastructure
              reporting that Aikido does not currently provide.


              That mix matters because Aikido is trying to compress many categories—SAST, SCA, IaC, malware, cloud,
              compliance, and runtime—into one opinionated workflow. If the product is too shallow for larger or more
              customized environments, the same breadth that helps SMB and mid-market adoption can become an
              enterprise-depth objection. The public status page adds only limited comfort here because it currently
              exposes a website uptime view rather than a richer component map for the entire platform. As a result, the
              residual risk is not that customers reject the developer-first thesis outright; it is that Aikido’s most
              compelling claims are easiest to prove in faster-moving engineering teams and hardest to prove in the
              slowest, most regulated procurement contexts.
            claimRefs:
              - CR008
              - CR027
              - CR028
              - CR029
              - CR030
