      - number: '5.4'
        title: Trust controls, reporting, and remaining risks
        blocks:
          - type: paragraph
            body: >-
              Public trust materials are strong enough to support enterprise relevance but not strong enough to close
              every diligence question. Aikido says it is ISO 27001:2022 and SOC 2 Type II compliant, runs annual
              pentests and a bug bounty, uses read-only access by default, avoids storing customer code after analysis,
              and keeps AI handling inference-only without training on customer data. Documentation also shows reporting
              is a first-class output surface rather than an afterthought: security audits, trends, runtime/framework,
              SLA, team-comparison, malware, SBOM, VEX, and compliance-style outputs are all productized. For many
              buyers, that combination of workflow coverage and trust messaging will be compelling.


              The remaining risks are concentrated in depth rather than breadth. Reviews still surface API and reporting
              limitations, some packaging friction, and occasional false positives. Trust-center language around FedRAMP
              remains in-progress rather than achieved. Zen's telemetry boundaries, large-scale runtime performance, and
              Infinite's benchmark methodology are not yet exposed at the depth a highly regulated buyer or strategic
              acquirer would want. The practical underwriting conclusion is that Aikido looks mature enough on the core
              platform and unusually strong on workflow fit, but newer offensive-testing and enterprise-trust claims
              should still be diligenced with primary materials rather than accepted at face value.
