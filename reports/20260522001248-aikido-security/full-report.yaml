      - number: '8.2'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: |
              Recommendation for new money is TRACK / RESEARCH MORE. The company itself may be high quality,
              but the current valuation is not yet sufficiently anchored by public evidence. Aikido's $1
              billion post-money round can be rationalized only under optimistic assumptions: that ARR was
              already closer to the $25 million ARR Club signal than the lower $10 million January signal,
              that growth remains very high through 2027, and that the business ultimately carries software-
              like gross margins rather than a heavier blended support and services profile.

              Confidence is medium-low because the core arithmetic depends on estimated ARR and proxy public
              multiples rather than audited management disclosure. Risk rating is high. If Aikido is already
              at $25 million ARR and can continue compounding, the current mark may eventually look merely
              aggressive. If the round closed closer to low-teens ARR, however, the price is above almost
              every observable public cyber multiple other than CrowdStrike. For existing insiders, holding
              can still be rational because the company now has fresh capital and momentum. For outside
              investors using only public evidence, the current mark should be treated as stretched.
            claimRefs:
              - CV011
              - CV012
              - CV022
              - CV023
              - CV024
              - CV034
              - CV035
