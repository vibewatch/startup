  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Regulated-market audit miss
        - >-
          Security review or procurement asks for DPA, subprocessor, or framework evidence that the public packet cannot
          support
        - >-
          Two or more meaningful regulated deals stall or downgrade because Aikido cannot furnish audit-grade materials
          quickly
        - >-
          Reduce conviction in regulated-customer expansion and treat compliance-reporting upside as watchlist, not base
          case
      - - Platform-dependency shock
        - GitHub, cloud, or CI permission or API change creates material blind spots or onboarding failures
        - A major integration remains degraded for more than a week or requires broader scopes that customers resist
        - Re-underwrite the speed and coverage thesis and cut adoption assumptions
      - - Local or on-prem parity gap
        - Privacy-sensitive deployments cannot match hosted workflow outcomes or AutoFix productivity
        - Lost deals or reference complaints cluster around hosted-versus-local feature differences
        - Cap on-prem upside and treat the deployment mix as margin- and velocity-negative
      - - Enterprise-depth gap
        - Reviews or reference calls repeatedly ask for richer infrastructure telemetry, customization, or support depth
        - Recurring agent, telemetry, or customization complaints remain unresolved over multiple quarters
        - Lower enterprise win-rate assumptions and shift valuation toward mid-market economics
      - - Signal-quality deterioration
        - Noise reduction, prioritization, or fix quality visibly worsens
        - >-
          Reference customers or review channels report rising false positives, missed issues, or weak remediation
          quality
        - Mark the core product moat as impaired and compress revenue-quality expectations
      - - Transparency shortfall after an incident
        - Status surface stays shallow or no credible RCA follows a public disruption
        - A visible incident occurs without component-level disclosure or a persuasive remediation narrative
        - Raise diligence burden materially and discount management credibility until disclosure improves
    notes: >-
      These triggers are framed around observable events that should show up in diligence, references, reviews, or
      future public materials rather than around intuition alone.
