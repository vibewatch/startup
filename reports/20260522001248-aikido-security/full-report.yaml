      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: |
              Public evidence does not support an IPO-ready conclusion. Aikido has the ingredients of a strong
              private growth company—clear category positioning, recent capital, and visible momentum—but not
              the disclosure standard a public-market underwriting process would require. The most important
              missing items are consolidated ARR and GAAP revenue, software versus services gross margin,
              retention by cohort and tier, cap-table and preference detail, and customer concentration. Those
              are not minor reporting gaps; they are the core variables that would determine whether the $1
              billion valuation is merely aggressive or fundamentally ahead of the business.

              That means the next diligence step is not better storytelling but better evidence. Management
              needs to show whether AI pentesting and unified code-to-cloud positioning are actually producing
              premium economics. If they are, the current mark may still compound. If they are not, the
              company is much more likely to face flat-to-down-round pressure before it ever reaches an IPO.
              On public evidence today, strategic optionality looks more plausible than near-term public-market
              readiness, and the diligence agenda should be built accordingly.
            claimRefs:
              - CV009
              - CV024
              - CV028
              - CV036
              - CV037
              - CV038
              - CV042
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV003
              - CV009
              - CV022
              - CV024
              - CV025
              - CV034
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The $1B mark only works if ARR is already much closer to $25M than $10M
            body: |
              Public evidence does not show a management-verified ARR figure. ARR Club's external signal says
              Aikido crossed $10M in January 2026 and $25M in April 2026. At the current valuation, that is
              the difference between roughly 100x ARR and 40x ARR. Either way the price is premium; the lower
              ARR reading makes it exceptionally hard to defend with public evidence.
            calloutType: risk
            claimRefs:
              - CV005
              - CV011
              - CV012
          - type: callout
            title: Strong company signals do not equal underwriteable entry price
            body: |
              Aikido can still be a strong company and a stretched investment at the same time. The company
              clearly has momentum, but the current price asks public investors to assume premium economics
              that have not been publicly shown.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV024
              - CV034
          - type: callout
            title: Filing evidence confirms scale-up investment mode, not mature software economics
            body: |
              The Belgian BV filing is valuable because it disproves any assumption that the business had
              already reached self-funding or fully visible software margins before the Series B. Until
              consolidated gross-margin and retention data are disclosed, valuation should incorporate a
              meaningful evidence discount.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV040
