      - number: '4.2'
        title: GTM motion and unit-economics proxies
        blocks:
          - type: paragraph
            body: >
              Aikido appears to combine low-friction inbound adoption with selective sales-assisted expansion. The
              Series A blog explicitly says the company is freemium and self-service, while official startup positioning
              frames the product as a practical answer for SMEs that need security and compliance without dedicated
              AppSec staff. Customer stories then reinforce a low-implementation narrative: one case says 150-plus
              developers were onboarded in 45 minutes, while others emphasize noise reduction, workflow fit, and monthly
              developer time saved. These are company claims rather than audited proof, but they point toward a model
              where deployment friction is intentionally minimized so that users can convert without a large
              professional-services burden.


              The upmarket side of the model is visible too. Enterprise and partner pages describe SSO, local scanners,
              scale for 2,000 repositories and 500 users, reseller commissions, MSP admin tooling, and co-sell motions.
              That suggests a second motion with higher ACV, longer sales cycles, and more partner leverage than the
              free tier alone would imply. Public review data is directionally supportive on usability and breadth, but
              the adverse signals matter for unit economics: G2 users complain about limited API depth, reporting on
              lower tiers, and pricing that can feel high for startups. Those issues can both help and hurt economics.
              Packaging limits may nudge upgrades, yet they can also slow conversion or expansion if small buyers sit on
              the free tier and sophisticated teams demand deeper platform capabilities before paying enterprise-level
              prices.
