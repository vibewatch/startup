      - number: '1.4'
        title: Milestones, mixed signals, and open questions
        blocks:
          - type: paragraph
            body: >
              The milestone record supports real momentum beyond fundraising headlines. Aikido launched publicly in
              April 2023, moved from seed to Series A within roughly six months, acquired AI-native pentesting teams
              Allseek and Haicker in September 2025, and introduced Aikido Infinite in February 2026 as a continuous AI
              pentesting and remediation product. The company is clearly evolving from a broad developer-security
              platform into a stronger autonomous-security thesis centered on self-securing software and machine-speed
              penetration testing.


              The same record also surfaces the main diligence cautions for later chapters. Public headcount reporting
              is inconsistent, with January and May 2026 sources citing 130, 164, 180, and 200-plus employees.
              Customer-disclosure denominators also vary between organizations, developers, and teams, making it risky
              to treat any one number as directly comparable over time. Review sources are broadly favorable, but the
              adverse points matter: users still flag missing advanced API and reporting capabilities, some lingering
              false positives, and feature gaps on lower tiers. Most importantly, governance structure, audited
              financials, and exact current customer-account counts remain private. The company looks fast-growing and
              credible, but not yet fully transparent.
