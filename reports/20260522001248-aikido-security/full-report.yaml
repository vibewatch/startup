  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope, module map, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Aikido is not presenting a single scanner with add-ons; it is marketing a full application-security
              operating surface that starts in source code, extends into cloud and container posture, reaches into API
              and offensive testing, and ends with runtime controls and governance outputs. The retained module pages
              support that framing. Code products cover SAST, SCA, secrets, IaC, containers, and SBOM/compliance use
              cases, while cloud pages add CSPM and runtime inventory and the attack surface includes API fuzzing,
              DAST-style monitoring, pentests, and the newly launched Infinite workflow. Zen then sits as a separate
              runtime asset rather than a mere extension of the code scanner.


              What makes the product thesis more credible than generic bundle marketing is the amount of
              developer-native and open-source evidence underneath it. Aikido openly ties SAST to Opengrep, publishes
              Zen runtimes and Safe Chain on GitHub, and distributes through GitHub Marketplace with meaningful install
              volume. That does not prove every module is best-in-class, but it does show an architecture and
              go-to-market model built on workflow fit, auditable components, and distribution channels that developers
              actually touch. The main differentiation claim is therefore breadth plus low-noise automation, not extreme
              specialist depth in each individual category.
