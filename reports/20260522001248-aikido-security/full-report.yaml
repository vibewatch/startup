  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >
              The most useful market boundary for Aikido is not generic cybersecurity spend. Aikido's own product and
              use-case pages show a platform that spans application security, software supply chain security, cloud
              posture, runtime or attack-surface coverage, and compliance-oriented evidence generation. That means the
              company's real addressable market includes more than pure SAST or DAST budgets, but also stops short of
              every security dollar a large enterprise might spend. The right boundary is code-to-cloud developer
              security for teams that want fewer tools, faster remediation, and audit readiness in one system.


              Retained official segment pages also show that Aikido is deliberately selling into multiple buyer
              environments: startups, enterprise teams, fintech, agencies, and partner-led channels. The substitute set
              therefore includes standalone AppSec tools, cloud-security tools, point compliance tools, manual or
              periodic pentesting, patchworks of open-source scanners, and internal buildouts inside CI/CD. Aikido's
              comparison pages make that explicit by framing Snyk, GitHub Advanced Security, Orca, Veracode, and Mend as
              status-quo alternatives. The implication for market sizing is important: a narrow lens based only on code
              scanning understates the problem Aikido is trying to solve, but a lens that includes all cloud-security
              and GRC spend overstates it.
