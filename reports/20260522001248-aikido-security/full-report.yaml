companyProfile:
  summary: >
    Aikido Security is a Ghent-founded developer-security platform built around a unified code-to-cloud workflow. The
    product spans SAST, SCA, secrets, IaC, container, cloud, API, runtime, reporting, and newer autonomous-pentesting
    workflows such as Aikido Infinite. The company sells through a freemium, transparent-pricing motion and then expands
    through enterprise features, partner channels, compliance-led workflows, and AI pentesting. Public customer proof is
    strongest in software-led teams and portfolio rollouts; public financial proof is strongest on funding and growth
    direction rather than audited operating quality.
