      - number: '3.3'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >
              Switching costs in AppSec rarely come from one scanner alone; they come from the workflow around it. Once
              a team connects repositories, CI/CD, ticketing, identity, cloud accounts, policy rules, compliance
              evidence, and historical findings into one platform, the cost of moving rises. That is especially true for
              GitHub and GitLab, where security is sold inside the system of record for code and pipelines. It is also
              true for enterprise-first vendors that have years of governance process and reporting wired into security
              teams. Buyers therefore often multi-home: one product for code or supply chain, one for cloud posture, one
              for compliance evidence, and one for pentesting or DAST.


              Multi-homing cuts both ways for Aikido. It lowers the absolute switching barrier because many buyers are
              already accustomed to mixing vendors, but it also means Aikido can be displaced in any one module by a
              stronger specialist. Platform-native distribution is the most serious structural competitor. GitHub and
              GitLab can attach security to repositories, workflows, and pricing plans users already trust. Specialist
              depth is the second structural competitor. Endor, Mend, Orca, Apiiro, Veracode, and Checkmarx can all
              claim expertise in narrower domains. Aikido's best defense is to be sufficiently broad, sufficiently
              accurate, and sufficiently easy to justify that consolidation beats specialization for the target account.
