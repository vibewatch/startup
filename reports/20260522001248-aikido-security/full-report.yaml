  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Maps how confirmed traction and market positioning are outweighed by valuation premium and disclosure gaps in the
      current recommendation.
    data:
      nodes:
        - id: traction
          label: Confirmed traction
          detail: $60M Series B, 100,000+ teams, 5x revenue growth, tripled customers
          tone: positive
        - id: model
          label: Developer-led platform model
          detail: Freemium and self-service motion can support efficient distribution if expansion works
          tone: positive
        - id: estimated_arr
          label: Estimated ARR band
          detail: ARR Club shows >$10M in Jan 2026 and $25M in Apr 2026
          tone: warning
        - id: multiple_gap
          label: Premium multiple gap
          detail: $1B implies ~40x-100x ARR on public estimate bands
          tone: adverse
        - id: missing_metrics
          label: Missing key metrics
          detail: Consolidated revenue, gross margin, NRR, burn, and preference stack are unavailable
          tone: adverse
        - id: recommendation
          label: TRACK / RESEARCH MORE
          detail: Company may be strong, but public evidence does not support a fresh BUY at the current mark
          tone: neutral
      edges:
        - from: traction
          to: model
          label: supports
        - from: model
          to: estimated_arr
          label: could lift ARR
        - from: estimated_arr
          to: multiple_gap
          label: determines valuation
        - from: missing_metrics
          to: recommendation
          label: blocks conviction
        - from: multiple_gap
          to: recommendation
          label: drives caution
        - from: traction
          to: recommendation
          label: prevents avoid call
    approximationNotes: >-
      Recommendation logic is an analytical framework built from public evidence. It is designed to show the decision
      chain, not to represent internal management or investor thinking.
    claimRefs:
      - CV003
      - CV005
      - CV011
      - CV024
      - CV034
