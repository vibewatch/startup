  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product thesis
        blocks:
          - type: paragraph
            body: >
              Aikido Security consistently presents itself as a developer-first unified security platform that connects
              code, cloud, and runtime security in one workflow. That identity is visible across the official about
              page, pricing page, press kit, customer stories, and the January 2026 Series B announcement. The company's
              pitch is not just broad feature coverage; it is that developers should receive fewer but higher-quality
              security tasks, with triage, remediation, and compliance evidence generation embedded into normal
              engineering work. The pricing page reinforces that this is a SaaS product with freemium entry,
              self-service onboarding, and paid expansion into broader platform governance, reporting, and enterprise
              services.


              Geographic identity requires more care than the usual headline. The press kit says Aikido was founded in
              Ghent, Belgium, and outside coverage repeatedly describes it as a Ghent-based Belgian startup. At the same
              time, the official about page currently lists a UK headquarters in London and a U.S. office in Chicago,
              while the careers page says the company is remote-friendly with a home base in Belgium and open roles
              across Ghent, London, Chicago, and San Francisco. The right synthesis is that Aikido is clearly
              Belgian-founded and still Belgium-centered in talent branding, but its current public operating footprint
              is multi-country and its exact legal headquarters structure is not fully transparent from retained
              sources.
