chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、运营足迹与产品逻辑
        blocks:
          - type: paragraph
            body: >
              Aikido Security 一直把自己定位成开发者优先的统一安全平台，把代码、云和运行时安全接到同一套工作流里。 官方关于页、定价页、媒体资料包、客户故事，以及 2026 年 1 月 Series B
              公告都在强化这一身份。 公司的卖点不只是功能覆盖广，而是让开发者拿到更少但质量更高的安全任务，并把分诊、修复和合规证据生成嵌进日常工程工作。 定价页也说明这是一款 SaaS
              产品：免费增值入口、自助接入，再向更广的平台治理、报告和企业服务付费扩张。


              地理身份比通常的标题更需要谨慎处理。媒体资料包称 Aikido 创立于比利时 Ghent，外部报道也反复把它描述成一家总部在 Ghent 的比利时创业公司。
              但官方关于页目前列出伦敦的英国总部和芝加哥的美国办公室，招聘页则称公司支持远程，以比利时为大本营，并在 Ghent、London、Chicago 和 San Francisco 招人。
              更合理的综合判断是，Aikido 明确源自比利时，人才品牌仍以比利时为中心；但当前公开运营足迹已经跨国，确切法律总部结构无法从留存来源完全看清。
