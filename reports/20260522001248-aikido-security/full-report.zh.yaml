companyProfile:
  summary: >
    Aikido Security 是一家创立于 Ghent 的开发者安全平台，围绕统一的代码到云工作流构建。产品覆盖 SAST、 SCA、secrets、IaC、容器、云、API、运行时、报告，以及 Aikido Infinite
    等较新的自主渗透测试流程。 公司靠免费增值和透明定价获客，再通过企业功能、合作伙伴渠道、合规驱动工作流和 AI 渗透测试扩张。
    公开客户证据在软件驱动团队和组合式铺开中最强；公开财务证据更多证明融资和增长方向，而不是经审计的经营质量。
