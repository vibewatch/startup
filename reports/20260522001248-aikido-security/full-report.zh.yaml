  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 方向
      - 证据
      - 对采用的影响
      - 注意事项
    rows:
      - - AI 辅助编码与更快发布
        - 驱动因素
        - Latio 报告和 Aikido 产品叙事
        - 发布节奏变快，扫描、修复和持续测试也要跟上
        - 如果 AI 功能质量不高，也会放大供应商噪音。
      - - API 与云原生复杂度
        - 驱动因素
        - Mordor、MarketsandMarkets、官方 API 和 DAST 页面
        - 扩大对代码到云统一可见性与测试的需求
        - 成熟团队可能更偏好更深的单点最佳工具。
      - - 供应链风险与 SBOM / VEX
        - 驱动因素
        - CISA SBOM 指南和 Aikido 合规页面
        - 推动买家转向 SCA、证据工具和供应商透明度
        - 仅靠 SBOM 并不能保证转化为付费产品。
      - - 监管与审计压力
        - 驱动因素
        - 官方页面中的 Cyber Resilience Act、DORA / PCI / NIS2 表述
        - 压缩金融科技和接受客户审计的软件公司的采购周期
        - 规则制造紧迫感，但预算仍按细分市场差异很大。
      - - 工具蔓延与误报
        - 整合驱动因素
        - Latio 和 Aikido 替代方案页面
        - 支撑单平台采购逻辑和减少积压的价值
        - 偏好最佳单点工具的买家可能仍更看重深度，而非整合。
      - - SMB 预算敏感
        - 约束
        - 初创企业和替代方案页面
        - 推动买家选择更便宜、免费增值或捆绑的方案
        - 除非公司向上进入大客户市场，否则可能限制 ACV。
      - - 企业切换成本与信任
        - 约束
        - 企业页面和替代品集合
        - 放慢替换既有安全栈的节奏
        - 让企业 SAM 更难快速变现。
      - - 渠道与集成依赖
        - 约束 / 助力
        - 合作伙伴页面及 Vanta / Drata / Sprinto 页面
        - 能打开新账户，但也把分销绑到外部伙伴身上
        - 伙伴主导收入的质量仍需验证。
