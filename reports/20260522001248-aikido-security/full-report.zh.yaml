      - number: '4.2'
        title: GTM 动作与单位经济代理指标
        blocks:
          - type: paragraph
            body: >
              Aikido 看起来把低摩擦自然流入采用与选择性的销售辅助扩张结合在一起。Series A 博客明确称公司采用免费增值和自助服务；
              官方创业公司定位则把产品包装成中小企业（SME）的实际答案：它们需要安全和合规，但没有专职 AppSec 人手。客户故事随后强化了低实施叙事： 一个案例称 150+ 名开发者在 45
              分钟内完成接入，其他案例则强调降噪、工作流契合和每月节省开发者时间。 这些是公司主张，不是经审计证明；但它们指向一种模型：公司有意压低部署摩擦，让用户无需承担大量专业服务负担就能转化。


              模型的高端市场一侧也能看见。企业和伙伴页面描述了 SSO、本地扫描器、支持 2,000 个代码仓库和 500 名用户的规模、 分销商佣金、MSP
              管理工具以及联合销售动作。这说明除免费层之外，还有第二套动作：ACV 更高、销售周期更长、伙伴杠杆更强。 公开评论数据在易用性和广度上方向性支持，但反向信号会影响单位经济：G2 用户抱怨 API
              深度有限、低阶套餐报告不足， 以及对创业公司来说价格可能偏高。这些问题可能同时利好和伤害经济性。包装限制可能推动升级， 但如果小买家停留在免费层、成熟团队在支付企业级价格前要求更深平台能力，也会拖慢转化或扩张。
