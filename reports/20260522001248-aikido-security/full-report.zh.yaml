      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >
              作为一家这个阶段的欧洲私营网络安全公司，Aikido 的领导层可见度相当强，但治理可见度仍不完整。 当前官方招聘材料列出 Willem Delbare 为联合创始人兼 CEO/CTO，Roeland Delrue
              为联合创始人兼 COO，Felix Garriau 为联合创始人兼 CMO。 同一页面还列出已故联合创始人兼首席增长官 Madeline Lawrence，以及 Thijs Janse、Louis
              Jonckheere 等商业负责人。 因此，谁在推动产品、运营、营销、增长和美国扩张，公开材料给出了清晰图谱。


              创始人与市场的匹配，是公司概览里更有说服力的部分。公开访谈和融资报道反复把 Aikido 描述成一款由前运营者打造的产品， 他们曾被噪声大、割裂的开发者安全工具困扰。Delbare
              过去的公司搭建经验，也解释了团队在产品包装和 GTM 执行上的速度。 但投资者需要把领导层可见度和治理披露分开看。留存公开材料列出了资本提供方和战略支持者，却没有给出干净的董事会名单、
              委员会地图或独立董事结构。对一家估值已达 $1 billion 的公司来说，这是实质性尽调缺口，不是无关紧要的遗漏。
