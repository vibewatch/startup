  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - 公司方案
      - 可衡量收益
      - 限制
    rows:
      - - 代码库安全分诊
        - 在 PR 和默认分支中审查代码、依赖、密钥和 IaC 风险。
        - 代码扫描，配合 PR 评论、AI 分诊、AutoFix、工单 / 聊天集成。
        - 官方来源把价值表述为更低噪声和更快开发者反馈。
        - 假阴性率和工作流精度的公开证据仍有限。
      - - 依赖安装加固
        - 恶意包落到笔记本或 CI 代理前先拦住。
        - Safe Chain 本地代理，覆盖 npm、yarn、pnpm、npx、pnpx、pip、uv 和 poetry。
        - 无需设置 token，就能拦截拼写仿冒包、恶意软件和过新的版本发布。
        - 大型企业仍需要中心策略和设备群管理细节。
      - - 云和容器卫生
        - 跨云、仓库、VM、容器和运行时发现风险资产。
        - 无代理 CSPM，加容器与运行时关联。
        - 单一视图把态势问题连到工作负载和过时运行时。
        - 缺少公开规模和数据延迟指标。
      - - API 暴露测试
        - 发现并测试已文档化和隐藏端点。
        - Swagger-to-traffic、Zen discovery、针对 REST 与 GraphQL API 的已认证模糊测试。
        - 覆盖面可能比只扫规格更广。
        - 需要更强公开证据，证明认证 / 会话深度和调度能力。
      - - 合规与客户证据
        - 为买方或审计产出 SBOM、审计、趋势报告和控制证据。
        - CycloneDX、SPDX、VEX、审计、SLA、团队和合规报告输出。
        - 把安全扫描转成外部可消费的证据。
        - 评论站点暗示部分报告和 API 深度受套餐限制。
      - - 运行时攻击拦截
        - 捕捉绕过预部署扫描的利用尝试。
        - Zen sink 追踪、速率限制、机器人 / Tor / 国家控制和 AI 监控。
        - 在应用上下文中加入运行时验证和拦截。
        - 需要更多关于性能和检测广度的公开基准数据。
    notes: 这张表把产品模块翻成用户任务和运营工作流。尽调时这个框架最有用，因为 Aikido 卖的是一体化工作流减负，而不是孤立检测引擎。
