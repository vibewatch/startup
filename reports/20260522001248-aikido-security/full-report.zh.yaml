      - number: '8.3'
        title: 融资背景、公开支持与优先权压力
        blocks:
          - type: paragraph
            body: >
              从公开信息看，Aikido 的融资历史强，但不完整。留存记录支持这样一条路径：2023 年底 €5 million 种子资金，2024 年 5 月 $17 million Series A，2026 年 1 月
              $60 million Series B，另有大约 €2 million 早期可转债资金。这足以显示可信的投资人需求，以及约 $85 million
              的资本基础。但还不足以精确建模下行。公开记录没有披露完整股权结构表、优先清算堆叠、反稀释机制，也没有说明最新一轮是否包含任何老股流动性。


              来自备案文件的证据方向上有用，但达不到承销级。比利时 BV 实体在 FY2025 年末有 €18.2 million 资产和 €14.7 million 权益，但毛利率和经营利润为负。英国实体只出现在 2026
              年 4 月备案中，随后有股本和会计期间变更。这一组合说明，公司在国际扩张的同时，仍在搭建法律和报告边界。因此，投资者可以说 Aikido 资金充足。但只看公开证据，无法说普通股持有人或后期老股买家有多少下行保护。
            claimRefs:
