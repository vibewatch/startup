        - 公司范围 ISMS 和企业信任姿态。
        - 尽调室需要证书范围和监督审核细节。
      - - SOC 2 Type II
        - 声称当前有效
        - SaaS 服务交付的运营控制。
        - 需要报告期、排除项和子服务清单。
      - - GDPR + 隐私姿态
        - 声称当前有效
