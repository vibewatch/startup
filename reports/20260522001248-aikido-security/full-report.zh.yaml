  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围、模块地图与差异化
        blocks:
          - type: paragraph
            body: >-
              Aikido 并不是在展示一个带附加模块的单一扫描器；它营销的是完整的应用安全操作面：从源代码起步，延伸到云和容器态势， 进入 API
              和进攻性测试，最后落到运行时控制和治理输出。留存模块页支持这一框架。代码产品覆盖 SAST、SCA、secrets、IaC、 容器以及 SBOM / 合规用例；云页面加入 CSPM 和运行时清单；攻击面包括
              API 模糊测试、DAST 式监控、渗透测试和新推出的 Infinite 工作流。 Zen 则作为单独的运行时资产存在，而不只是代码扫描器的延伸。


              让产品逻辑比泛泛的捆绑营销更可信的，是底层开发者原生和开源证据的数量。Aikido 公开把 SAST 绑定到 Opengrep， 在 GitHub 发布 Zen 运行时和 Safe Chain，并通过
              GitHub Marketplace 分发，且安装量有意义。这不能证明每个模块都是同类最佳， 但确实显示出一套架构和 GTM 模型，建立在工作流契合、可审计组件，以及开发者真实接触的分发渠道之上。
              因此，主要差异化主张是广度加低噪声自动化，而不是每个单一品类里的极端专家深度。
