  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 受监管市场审计失手
        - 安全评审或采购要求 DPA、子处理方或框架证据，而公开材料包无法支撑
        - 两个或更多有意义的受监管交易因为 Aikido 无法快速提供审计级材料而停滞或降级
        - 下调受监管客户扩张信心，把合规报告上行空间放进观察清单，而不是基准情景
      - - 平台依赖冲击
        - GitHub、云或 CI 权限 / API 变更制造实质盲区或接入失败
        - 一个主要集成降级超过一周，或需要更广权限而客户抵触
        - 重新评估速度与覆盖逻辑，并下调采用假设
      - - 本地扫描或本地部署一致性缺口
        - 隐私敏感部署无法达到托管工作流效果或 AutoFix 生产力
        - 流失交易或参考客户投诉集中在托管与本地功能差异
        - 限制本地部署上行空间，并把部署组合视为拖累毛利率和销售速度
      - - 企业深度缺口
        - 评论或参考访谈反复要求更丰富的基础设施遥测、定制化或支持深度
        - 代理、遥测或定制化投诉在多个季度内反复出现且未解决
        - 下调企业成交率假设，并把估值转向中端市场经济性
      - - 信号质量恶化
        - 降噪、优先级排序或修复质量明显变差
        - 参考客户或评论渠道报告误报上升、漏报问题或修复质量偏弱
        - 将核心产品护城河标记为受损，并压缩收入质量预期
      - - 事件后的透明度短板
        - 状态界面仍然很浅，或公开中断后没有可信 RCA
        - 发生可见事件，却没有组件级披露或有说服力的修复叙事
        - 显著提高尽调门槛，并在披露改善前折价管理层可信度
    notes: 这些触发项围绕可观察事件设计，应出现在尽调、参考访谈、评论或未来公开材料中，而不是只靠直觉。
