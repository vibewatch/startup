        - 透明
        - 按层级收取 10 用户平台费，另有企业级插件
        - $350 至 $1,050 / 月，10 用户
        - 帮助 Aikido 赢下预算敏感的中端市场买家。
      - - Snyk
        - 部分透明
        - 按贡献开发者计费，分多个方案和插件
        - 官方标题称起价 $25 / 月
        - 有竞争力，但模块蔓延可能抬高 TCO。
      - - GitHub Advanced Security
        - 透明
        - 密钥保护和代码安全按活跃提交者计费
        - 每名活跃提交者每月 $19 和 $30
        - 面向 GitHub 原生团队拥有巨大分发优势。
      - - Semgrep
        - 透明
        - 按贡献者计费，提供免费版和团队升级
        - 10 个代码库 / 10 名贡献者以内免费
        - 对 Aikido 形成强自下而上采用压力。
      - - Endor Labs
        - 半透明
        - 免费开发者层级，加 Core / Pro 和捆绑
