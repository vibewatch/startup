      - number: '1.3'
        title: 融资形成、牵引力与公开规模
        blocks:
          - type: paragraph
            body: >
              Aikido 的融资轨迹压缩得不寻常。2023 年 11 月的公开种子轮报道描述了一笔由 Notion Capital 和 Connect Ventures 共同领投的 €5 million 融资； 公司和
              TechCrunch 随后记录了 2024 年 5 月由 Singular 领投、Notion 和 Connect 继续支持的 $17 million Series A。 2026 年 1 月的 Series B
              又加入 $60 million，由 DST Global 领投，PSG Equity 和既有投资者参投，并把公司定价到 $1 billion 估值。 官方关于页现在总结累计融资约 $85 million，而
              BankInfoSecurity 报道四轮融资接近 $85 million，暗示正式种子轮前可能有规模更小的种子前轮或可转债融资。


              牵引力信号很强，但需要谨慎归一化。Series A 叙事强调 3,000 家组织和 6,000 名开发者；到 2026 年 1 月，公司材料转向 100,000+ 个团队， 并列出 Premier
              League、Revolut、SoundCloud、Niantic 等公开客户。收入据称在 2025 年增长五倍，客户数增加逾三倍； 即便公司仍未披露
              ARR、毛利率、留存或经审计收入，这一方向性表现也很亮眼。评论平台证据在易用性和广度上偏正面， 但样本仍小，机构投资者应把它当作支持信号，而不是持久企业级产品市场匹配的最终证明。
