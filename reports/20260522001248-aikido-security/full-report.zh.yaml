  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 当前成熟度 / 状态
      - 差异化
      - 尽调缺口
    rows:
      - - SAST / 代码规则
        - 开发者 + AppSec
        - 核心 / 成熟
        - 基于 Opengrep 的 SAST，配合 AI 分诊、自定义规则和 AutoFix 定位；官方宣传噪声显著低于传统工具。
        - 需要独立基准证明精度、假阴性和自定义规则深度。
      - - SCA / 供应链
        - 开发者 + AppSec
        - 核心 / 成熟
        - 可达性、恶意软件情报、pre-CVE 定位和 SBOM/VEX 输出，让工作流比只看 CVE 清单更丰富。
        - 需要在生产账户中更深入证明可达性准确度和恶意软件预防效果。
      - - 密钥 / IaC 扫描
        - 平台 + DevOps
        - 核心 / 成熟
        - 主动密钥验证，加上 Terraform、CloudFormation、Helm、Dockerfile 覆盖，把低层级错误配置留在同一个控制台里。
        - 需要大型 monorepo 上的误报率和分支工作流性能数据。
      - - 云 / VM / 容器态势
        - CloudSec + DevOps
        - 核心 / 成熟
        - 无代理 CSPM 结合 VM、运行时、仓库和容器上下文，支持关联分析，而不是拆成多个控制台。
        - 需要公开规模、摄取延迟和多账号证据。
      - - API / DAST / 暴露面监控
        - AppSec + 平台
        - 增长 / 扩张中
        - REST 和 GraphQL 模糊测试，配合 Swagger-to-traffic 与 Zen 辅助端点发现，把覆盖面扩展到静态规格之外。
        - 需要更清楚的公开证据，证明认证 / 会话处理、调度深度和噪声环境调优。
      - - Zen 运行时防火墙
        - 平台工程师
        - 增长 / 差异化
        - 开源应用内防火墙，带 sink 追踪、速率限制、机器人 / Tor 控制、OpenAPI 生成和运行时攻击上下文。
        - 需要按框架披露遥测、开销和企业推广落地证据。
      - - Safe Chain
        - 开发者 + CI 负责人
        - 聚焦 / OSS 主导
        - 无 token 的本地包安装护栏，带恶意软件拦截和默认 48 小时包龄策略。
        - 需要附加率、采用率和企业策略管理证据。
      - - 报告 / 合规输出
        - 安全负责人 + 合规
        - 核心 / 成熟
        - 审计、趋势、SLA、恶意软件、运行时、团队、SBOM、VEX 和合规类输出，把扫描结果转成面向买方的证据。
        - 需要逐套餐权益细节，以及导出报告的 API 深度。
      - - Aikido Infinite / 渗透测试
        - 安全团队 + 管理层
        - 新 / 早期
        - 验证—修复—复测闭环贯穿各次版本发布，如果执行守得住，就是差异化叙事。
        - 除了发布报道，还需要独立基准、客户推荐和 GA 证据。
    notes: 这些行覆盖留存官方、技术文档和开发者信号来源中浮现的主要产品资产。应把它看成外部可见的产品地图，而不是内部工程组件清单。
