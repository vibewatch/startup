      - number: '5.4'
        title: 信任控制、报告与剩余风险
        blocks:
          - type: paragraph
            body: >-
              公开信任材料足以支撑企业相关性，但不足以关闭每个尽调问题。Aikido 称自己符合 ISO 27001:2022 和 SOC 2 Type II，
              每年运行渗透测试和漏洞赏金，默认使用只读访问，分析后不存储客户代码，并把 AI 处理限制在推理、不用客户数据训练。 文档还显示，报告是一等输出面，而不是事后补丁：安全审计、趋势、运行时 /
              框架、SLA、团队对比、恶意软件、SBOM、VEX 和合规式输出都已产品化。 对许多买家来说，工作流覆盖和信任叙事的组合会很有吸引力。


              剩余风险集中在深度，而不是广度。评论仍暴露 API 和报告限制、部分包装摩擦，以及偶发误报。信任中心围绕 FedRAMP 的表述仍是进行中， 而非已经达成。Zen 的遥测边界、大规模运行时性能，以及
              Infinite 的基准测试方法论，都还没有披露到高度受监管买家或战略收购方想看的深度。 实际承保结论是：Aikido 的核心平台看起来足够成熟，工作流契合度异常强；但较新的进攻性测试和企业信任主张，
              仍应通过一手材料尽调，而不能照单全收。
