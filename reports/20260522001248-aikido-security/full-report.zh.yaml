      - number: '2.3'
        title: 买方、用户、付款方与渠道分层
        blocks:
          - type: paragraph
            body: >
              Aikido 的官方行业页和集成页暗示的是分层 GTM，而不是单一、铁板一块的 ICP。创业公司购买，是因为创始人、CTO 和早期开发者需要一款一体化工具， 在没有搭建专职 AppSec
              团队的情况下跑通安全编码和合规基础。企业买家关心 SSO、基于角色的访问、本地扫描器、monorepo 管理、 大型代码仓库或多云覆盖等规模化控制。金融科技买家优先考虑客户、审计师和监管方眼中的可信度，尤其围绕
              DORA、PCI DSS、ISO 27001 和 NIS2。 代理商和 MSP 则看重多租户管理、利润保护，以及证明自己能在不推高运营成本的情况下保护许多客户代码仓库。


              用户和付款方并不总是同一批人。跨细分市场看，开发者和平台工程师是日常用户；但预算所有者会变化： 创业公司里是创始人或 CTO，企业里是安全或平台负责人，金融科技里是合规和风险负责人，代理商里则是负责人或交付经理。
              伙伴和集成页给分层又加了一层。Vanta、Drata 和 Sprinto 不是纯粹竞争对手；它们是相邻的合规系统， 可以帮助 Aikido 在审计准备是首个购买触发点的场景落地。同样，分销商、MSP
              和技术伙伴动作可以把分发扩展到偏好服务主导采购或捆绑产品的账户。
