      - number: '4.4'
        title: 资本充足性、融资依赖与尽调阻塞点
        blocks:
          - type: paragraph
            body: >
              公开来源支持 Aikido 在当前阶段资金充足的判断，但不足以让投资者有信心计算现金跑道。官方关于页和 BankInfoSecurity 都指向约 $85 million 的已披露累计融资； Series B
              公告也清楚表明，管理层打算在自主安全和 AI 驱动渗透测试上激进投入。Solutions Magazine 补充称， 2025
              年收入增长五倍，近一半来自美国，客户群几乎增加三倍；这说明公司正在扩展更大的商业足迹，而不只是囤积资本。 ARR Club 的付费信号页更进一步，把 2026 年 1 月 ARR 放在 $10 million
              以上，2026 年 4 月放在 $25 million； 但这些数字应被视为外部估计区间，而不是经公司验证的披露。


              承保问题不在于 Aikido 有没有动能，而在于动能能否转化为持久、高效率收入。留存公开材料仍未披露合并收入、毛利率、
              净留存、CAC、回本周期、客户标识集中度、现金余额、债务或现金跑道月份。评论数据暗示公司用透明标价冲击一个充满昂贵工具拼盘的市场， 官方企业和伙伴页面则指向可信的扩张向量。即便如此，没有管理账和客户队列细节，
              投资者无法判断这家公司是高毛利 SaaS 复利机器、软件与服务混合模型，还是仍在证明稳态经济性的资本饥渴型增长故事。 结论是战略轨迹和资本可得性偏正面，但收入质量和现金耐久性仍不完整。
