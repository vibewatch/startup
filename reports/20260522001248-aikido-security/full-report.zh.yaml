  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Aikido 的正向逻辑很直接。公司显然不是零牵引力故事：2026 年 1 月 Series B 把估值打到 $1 billion，管理层称平台服务全球 100,000+ 个团队，官方 Series B
              文章和第三方报道都称收入增长 5x，客户基数在前一年增长超过 3 倍。产品逻辑也自洽。Aikido 把自己定位成统一的代码到云安全平台，早期 Series A
              信息强调免费增值、自助、开发者驱动的打法。如果该模式真能把高产品广度、低摩擦接入，以及向企业和 AI 渗透测试工作流的高效扩张结合起来，Aikido 仍可能长进溢价估值。


              反向逻辑比公开牛市叙事承认的更强。最好的公开 ARR 数据点来自 ARR Club，而不是管理层；这些数据暗示，$1 billion 估值建立在估计 40x–100x ARR
              区间上。来自备案文件的证据显示，比利时实体到 FY2025
              仍在亏损，而最重要的承销变量——合并收入、毛利率、NRR、烧钱速度、债务和清算优先权——仍不可得。换句话说，公开证据确认了增长和融资，但还不足以让人有把握按当前估值入场。
            claimRefs:
              - CV001
              - CV003
