      - number: '4.3'
        title: 备案衍生成本结构与公开规模
        blocks:
          - type: paragraph
            body: >
              最具体的公开财务证据不是管理层评论，而是登记和备案衍生记录。比利时 Aikido Security BV 摘要显示， 截至 2025-01-31 的财年，该实体报告资产 €18.2 million、权益
              €14.7 million、负债 €3.48 million， 同时毛利率为负 €3.73 million、经营利润为负 €4.43 million。上一年资产基数较小，为 €5.65 million，
              经营亏损也较小，为负 €0.86 million。若按字面解读，这意味着该报告实体到 2025 年初仍处于深度投资模式， 且随着公司扩张，支出显著爬坡。


              但投资者不应过度解读这些数字。比利时备案摘要是实体层面，不是完整合并管理账；Aikido 的公开运营足迹现在还包括一个英国总部标签、 一个美国办公室，以及一个新设英国法律实体。Companies House
              记录显示，AIKIDO SECURITY LTD 于 2026-04-09 成立， 随后把会计期间缩短至 2027-01-31，并在成立后立即提交资本文件。这说明公开法律结构比单看比利时备案更国际化。
              正确综合结论是：现有备案证据证明核心比利时实体完成资本积累且仍在亏损，但无法回答更难的问题： 合并毛利率、现金效率、收入确认，或渗透测试和服务活动在规模化后是增厚还是稀释利润率。
