      - number: '3.3'
        title: 切换成本、多栖使用与分发力量
        blocks:
          - type: paragraph
            body: >
              AppSec 的切换成本很少只来自某一个扫描器；成本来自围绕它搭起来的工作流。团队一旦把代码仓库、CI/CD、工单、身份、云账户、 策略规则、合规证据和历史发现接入同一平台，迁移成本就会上升。GitHub 和
              GitLab 尤其如此，因为安全被卖进代码和流水线的事实记录系统。 对企业优先厂商也一样，它们多年把治理流程和报告接进安全团队。买家因此常常多栖使用：一个产品管代码或供应链，一个管云态势，
              一个管合规证据，一个管渗透测试或 DAST。


              多栖使用是一把双刃剑。它降低了 Aikido 面对的绝对切换门槛，因为许多买家本来就习惯混用厂商；但它也意味着 Aikido 的任一模块都可能被更强专家替代。 平台原生分发是最严肃的结构性竞争者。GitHub 和
              GitLab 可以把安全附着到用户已经信任的代码仓库、工作流和定价计划上。 专家深度是第二个结构性竞争者。Endor、Mend、Orca、Apiiro、Veracode 和 Checkmarx
              都可以在更窄领域声称专业能力。 Aikido 最好的防守，是在足够广、足够准、足够容易证明合理性之间达成平衡，让目标账户相信整合胜过专精。
