  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与落地动作
        blocks:
          - type: paragraph
            body: >
              Aikido 的公开变现模型比实际财务表现清楚得多。官方定价、关于页、创业公司和企业页面都指向有意设计的先落地再扩张： 免费入口，Basic、Pro、Advanced
              分层的透明标价，然后是一组企业专属增购项，例如自定义 SLA、多租户管理、本地部署、 内部应用代理支持，以及高级接入或支持。SourceForge 独立镜像了同样的分层结构，并确认免费计划包含 2 名用户和 10
              个代码仓库； 与许多很早就强制进入定制销售的安全厂商相比，这让产品对创业公司和较小工程团队格外清晰。


              这种简单不应被误读成纯单线 SaaS SKU。伙伴和集成页面暗示至少四层变现：经常性平台订阅、企业服务包、 通过分销商和 MSP
              进行的伙伴主导捆绑销售，以及与证据生成和更广安全工作流绑定的合规或渗透测试相邻价值捕获。 定价页的 AI
              渗透测试语言暗示，围绕进攻性验证可能存在用量触发或报告解锁组件；但留存公开材料没有披露收入中有多少来自经常性软件，
              多少来自一次性或类似服务的工作。因此，最合理的判断是：这是一个软件优先的混合模型，漏斗顶部可及性强、扩张杠杆多， 但仍没有足以支撑承保的公开收入结构披露。
