      - number: '5.3'
        title: 运行时、开源资产与路线图速度
        blocks:
          - type: paragraph
            body: >-
              Aikido 的公开 GitHub 表面对产品故事格外重要，因为它说明公司交付的不只是打磨过的落地页。AikidoSec 组织托管数十个代码仓库， Safe Chain 和多语言 Zen
              运行时作为具体证据，证明公司投资开发者工具，而不只是集中式仪表盘。 Opengrep 又给 Aikido 增加了一个开放静态分析引擎和联盟背书的治理叙事。合在一起， 这些资产让 Aikido
              更像一个带有可扩展技术构件的工作流平台，而不是纯封闭盒扫描器厂商。


              但路线图速度正越来越由进攻性测试和自主修复来定义。独立 2026 年报道和 Aikido 自身材料都显示，公司战略性推进 AI 渗透测试和 Infinite 发布闭环概念； Allseek 与 Haicker
              收购以及新一轮 Series B 融资进一步强化了这一点。这个方向有前景，也与技术栈其余部分战略一致， 因为 Zen、OpenAPI
              生成和扫描上下文都能喂给更丰富的漏洞利用验证工作流。但它也是公开产品叙事中最不成熟的一块。 核心代码和云模块看起来已经建立；自我安全软件主张仍需要更多独立基准测试和部署证据。
