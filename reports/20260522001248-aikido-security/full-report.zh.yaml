      - number: '8.7'
        title: 展项
        blocks:
          - type: callout
            title: $1B 估值只有在 ARR 已经更接近 $25M 而非 $10M 时才成立
            body: >
              公开证据没有给出管理层验证过的 ARR 数字。ARR Club 的外部信号称，Aikido 在 2026 年 1 月跨过 $10M，并在 2026 年 4 月跨过 $25M。在当前估值下，这就是约 100x
              ARR 和 40x ARR 的差别。无论哪种读数，价格都属溢价；较低 ARR 读数让它极难用公开证据辩护。
            calloutType: risk
            claimRefs:
              - CV005
              - CV011
              - CV012
          - type: callout
            title: 强公司信号不等于可承销的入场价格
            body: |
              Aikido 可以同时是一家强公司，也是一笔估值偏高的投资。公司显然有动能，但当前价格要求公开市场投资者假设尚未公开证明的溢价经济性。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV024
              - CV034
          - type: callout
            title: 备案证据确认的是规模化投入阶段，不是成熟软件经济性
            body: |
              比利时 BV 备案有价值，因为它推翻了一个假设：业务在 Series B 前已经达到自我供血，或软件毛利率已经完全可见。在披露合并毛利率和留存数据前，估值应纳入有意义的证据折价。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV040
