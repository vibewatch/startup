      - number: '7.2'
        title: 平台与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Aikido 的产品有意把摩擦做低：基于 API，默认只读，并且紧密接入源代码管理、云、CI 和工作流工具。商业上这很有吸引力，因为部署痛点少，客户也能更快拿到价值，但它同时把依赖关系集中到几类外部平台上。
              GitHub 状态决定接入和访问同步；云权限决定 CSPM 可见度；PR 门禁依赖上游 SCM 钩子；SCA 能力又部分依赖 NVD、GitHub Advisory
              等第三方情报源。公司说自己「无代理」、几分钟即可上线，本质上也在说：外部平台是控制平面的重要组成部分。


              缓释因素确实存在。信任中心材料强调临时代码处理、默认只读权限，以及面向隐私敏感环境的本地扫描选项。Zen Firewall 增加运行时防护和广泛语言支持，PR 门禁加上 CI / API
              路径，也给客户提供了不止一种工作流选择。但这一运营模式会把合作伙伴风险直接导入产品可靠性。权限变更、API 速率限制或数据源质量问题，都可能在 Aikido
              自己还没发一行代码前就削弱覆盖。本地扫描路径也有明确取舍：隐私敏感买家可以把代码留在本地，但公开文档说这些账号拿不到 UI AutoFix，这意味着产品最醒目的生产力主张之一，不能无缝覆盖每一种部署模式。
