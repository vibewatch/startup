  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与采购风险
        blocks:
          - type: paragraph
            body: >-
              Aikido 的主要法律风险不是明显的活跃诉讼或监管行动，而是公开材料已经证明的内容与受监管买家可能要求之间的缺口。 公司的公开法律披露面可信但不完整：隐私政策明确以 GDPR
              为基准，条款识别出一个比利时法律实体，信任中心和合规文档也显示公司认真包装安全审查所需证据。 但同一批留存材料也显示了边界。公开网站条款并未针对 HIPAA、FISMA 或 GLBA
              互动定制，本次审阅的材料本身也没有浮现客户 DPA、 子处理方登记册或详细事件承诺。这并不意味着这些材料私下不存在；它意味着，仅靠公开法律披露面还不足以承保受监管企业扩张情景。


              时间风险正在上升，因为 Aikido 不再只是销售泛化 AppSec。其文档明确营销 NIS2、DORA、GDPR 和其他框架的合规页面， SCA 营销现在也把 SBOM 输出绑定到 CRA
              就绪。这种定位可以加速销售，但也让产品和信任团队必须对审计级映射负责， 而不只是提供好的 UX。如果 Aikido 无法在客户尽调中支撑这些映射，采购周期可能拉长，受监管机会可能停滞，
              客户信任也可能恰好在公司试图上移市场的位置破裂。
