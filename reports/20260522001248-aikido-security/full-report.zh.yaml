      - number: '7.3'
        title: 市场契合度与运营执行风险
        blocks:
          - type: paragraph
            body: >-
              官方和独立客户记录方向上偏正面，但仍留下执行风险。官方客户证据显示，客户从一长串既有单点工具迁移而来，并反复强调降噪、快速接入 和快速修复。定价页引用甚至称，Aikido 在 2025 年 NPM
              供应链攻击期间响应很快，这正是企业买家想听到的行为。但独立证据比官方叙事薄。Capterra 的评论数量仍少，PeerSpot 明确把产品指向 10–500 名开发者的非企业 SaaS
              团队，TrustRadius 也出现评论者要求基于代理 的基础设施报告，而 Aikido 目前并不提供。


              这组信号重要，因为 Aikido 试图把 SAST、SCA、IaC、恶意软件、云、合规和运行时等多个类别压缩进一个带明确取向的工作流。如果产品对大型或高度定制环境来说太浅，帮助 SMB
              和中端市场采用的同一广度，就会变成企业深度上的反对理由。公开状态页在这里提供的安慰有限，因为它目前展示的是网站可用时间视图，而不是覆盖整个平台的更细组件地图。因此，剩余风险不是客户会直接否定开发者优先逻辑；而是
              Aikido 最有吸引力的主张，最容易在行动快的工程团队中证明，最难在最慢、监管最重的采购场景里证明。
