      - - ARR 证明不及预期
        - 2026 年后经验证 ARR 仍低于 $25M，或到 2027 年低于 $60M
        - 当前估值依赖异常高增长；ARR 证明偏弱会打掉溢价理由
        - 按上市底部可比组重新定价；避免按接近上一轮估值出价
      - - 毛利率不像软件
        - 合并毛利率低于 ~70%，或服务业务明显拖累
        - Aikido 不再像高溢价软件，更像软件与交付混合业务
        - 从高溢价倍数切到 5x-10x 区间分析
      - - 留存和扩张失灵
        - NRR 低于 ~110%，或企业客户扩张偏弱
        - 自下而上的切入点没有复利；低初始 ACV 无法放大成估值支撑
        - 把 $1B 融资轮视为相对收入质量透支
      - - 出现平轮或下轮融资
        - 下一次定价融资不高于 $1B
        - 市场出清证据推翻当前估值，并暴露高溢价需求不足
        - 在条款正常化前，将新资金建议重置为回避
      - - 捆绑销售压缩定价
        - GitHub / GitLab / 大平台竞争显著压低赢单率或实际成交价
        - 在 Aikido 达到足够规模前，低价和简单这条切入口变窄
        - 用更低 ARR 和更低倍数重切基准 / 悲观情景
      - - 报告和结构仍不透明
        - 到下一轮融资周期仍未合并披露 ARR、毛利率和股权结构表
        - 持续不透明本身就是上市准备度和老股需求的风险信号
        - 任何新投资或老股购买前都必须做硬尽调
    notes: 这些阈值是分析触发项，不是管理层指引。设计重点是可观察、与估值有关，而不是精准预测经营结果。
    claimRefs:
      - CV023
      - CV026
      - CV028
      - CV033
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 优先级
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 1
        - 合并 ARR 与 GAAP / 管理口径收入桥
        - 没有公开合并收入披露；ARR Club 只是外部来源
        - 决定当前 $1B 估值到底是 40x、100x，还是更可辩护的水平
        - 索取 2025 年至最近季度的月度 ARR 和收入桥
      - - 2
        - 毛利率以及软件 / 服务组合
        - 比利时文件显示亏损，但没有合并产品经济性
        - 高溢价软件倍数需要软件型毛利结构
        - 索取按产品拆分的合并毛利率，以及支持 / 服务分摊
      - - 3
        - NRR / GRR 以及按层级拆分的扩张
        - 没有公开留存数据
        - 自下而上的定价只有在扩张异常强时，才支撑 $1B 估值
        - 索取按队列拆分的留存、logo 流失、扩张和降级率
      - - 4
        - 股权结构表和清算优先权
        - 没有公开优先股堆叠、反稀释或老股交易细节
        - 没有这些数据，就无法建模下行情景和晚入场回报
        - 索取完整股权结构表、条款清单摘要，以及任何附函流动性条款
      - - 5
        - 客户集中度和企业客户结构
        - 公开案例列出客户 logo，但没有集中度或 ACV 结构
        - 判断 5x 增长叙事能持续多久，必须有这些数据
        - 索取前 20 大客户占比、客群结构和合作伙伴集中度
      - - 6
        - AI 渗透测试变现证明
        - 产品叙事强，但变现和毛利率影响尚未公开证明
        - 高溢价上行取决于 AI 功能能否提高 ARPU 或留存，而不只是营销叙事
        - 索取 Aikido Attack / 渗透测试工作流的附加率、提升幅度和毛利率数据
    notes: 第 1-4 项是按当前估值承销任何新资金的前置门槛。第 5-6 项对判断上行能否超越叙事溢价至关重要。
    claimRefs:
      - CV009
      - CV024
      - CV028
      - CV038
      - CV041
