  - id: TU001
    title: 客户分层表
    columns:
      - 客群
      - 买方 / 用户 / 付款方
      - 用例
      - 规模
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 创业公司和小型自助式工程团队
        - 创始人或 CTO 是买方；开发者或平台团队是用户；轻量工程预算付款
        - 快速扫描代码、云和依赖，低摩擦上手，并有免费层入口
        - 客户案例页包含 Startup 客群；G2 免费层评价强调设置直接
        - 为未来付费扩张提供宽入口，尤其适合开发者主导落地
        - 公开来源未披露免费转付费转化率或 SMB ACV
      - - 成长期 SaaS 和受监管数字运营商
        - CTO、工程副总裁、DevSecOps 和平台负责人是买方；开发者是日常用户；产品或工程预算负责人付款
        - 噪音降低、CI/CD 集成、合规报告和更快修复
        - Oviva、Birdie、Simployer、Jurimesh、Pathful 和 HeyJobs 是具名证明
        - 可能是核心经常性客群，因为安全和交付速度都直接关系业务
        - 分客群 ARR 和续约数据未公开
      - - 企业软件和平台团队
        - CISO 或安全平台负责人是买方；工程经理和开发者是用户；集中安全预算付款
        - 统一多仓库、多团队的 AppSec 栈、工作流路由和风险可见性
        - AutoStore、Render、Human Security、Prove、Supermetrics 和 n8n 显示企业级使用
        - 工作流嵌入带来更高 ACV 和更强扩张潜力
        - 多数证据是供应商筛选和撰写的案例，而非独立队列披露
      - - 投资组合和多公司运营方
        - 集中安全职能是买方；组合公司工程师是用户；集团平台预算付款
        - 在多实体间标准化扫描和报告，并获得可预测的治理和定价
        - Visma 覆盖 200+ 家组合公司和 6,000 名开发者；Aikido 早期披露称覆盖 175+ 家 Visma 公司
        - 战略价值很高，因为一单可带动多实体采用
