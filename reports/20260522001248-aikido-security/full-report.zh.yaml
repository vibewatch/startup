  productSummary: >
    Aikido 提供统一软件安全平台，覆盖代码、云、运行时、合规证据生成和 AI 渗透测试。关键公开资产包括透明 SaaS 定价、本地扫描器和本地部署选项、通过 Zen 提供的运行时保护、通过 Safe Chain 和
