  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 当前投资建议中，已确认的增长动能和市场定位被估值溢价与披露缺口压过，图中映射了这条逻辑。
    data:
      nodes:
        - id: traction
          label: 已确认增长动能
          detail: B 轮融资 $60M，覆盖 100,000+ 个团队，收入增长 5x，客户数增长 3x
          tone: positive
        - id: model
          label: 开发者驱动的平台模式
          detail: 如果扩张跑通，免费增值和自助服务路径可以支撑高效分发
          tone: positive
        - id: estimated_arr
          label: 估算 ARR 区间
          detail: ARR Club 显示 2026 年 1 月 >$10M，2026 年 4 月 $25M
          tone: warning
        - id: multiple_gap
          label: 高溢价倍数缺口
          detail: 按公开估算区间，$1B 意味着约 40x-100x ARR
          tone: adverse
        - id: missing_metrics
          label: 关键指标缺失
          detail: 合并收入、毛利率、NRR、烧钱速度和优先股堆叠均未披露
          tone: adverse
        - id: recommendation
          label: 观察 / 继续研究
          detail: 公司可能很强，但公开证据不足以支撑在当前估值上新发出买入结论
          tone: neutral
      edges:
        - from: traction
          to: model
          label: 支撑
        - from: model
          to: estimated_arr
          label: 可能抬升 ARR
        - from: estimated_arr
          to: multiple_gap
          label: 决定估值
        - from: missing_metrics
          to: recommendation
          label: 阻碍确信
        - from: multiple_gap
          to: recommendation
          label: 推动谨慎
        - from: traction
          to: recommendation
          label: 避免得出回避结论
    approximationNotes: 投资建议逻辑是基于公开证据搭出的分析框架。它用于展示决策链，而不是代表管理层或投资人的内部想法。
    claimRefs:
      - CV003
      - CV005
      - CV011
      - CV024
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 展示不同 ARR 与倍数组合对应的隐含价值，突出 Aikido 要交付多少业绩才能支撑或超过当前 $1B 估值。
    data:
      items:
        - label: $25M ARR，10x 倍数
          value: 250
          detail: 低溢价的上市软件公司式结果
          tone: warning
          claimRefs:
            - CV030
        - label: $25M ARR，20x 倍数
          value: 500
          detail: 软件高溢价倍数，但仍只有当前估值的一半
          tone: warning
          claimRefs:
            - CV017
        - label: $25M ARR，40x 倍数
          value: 1000
          detail: 如果 ARR Club 2026 年 4 月 $25M 信号准确且溢价守住，就对应当前估值
          tone: neutral
          claimRefs:
            - CV011
        - label: $50M ARR，20x 倍数
          value: 1000
          detail: 如果 ARR 大约翻倍且 Aikido 仍拿到类似 PANW 的溢价，就对应当前估值
          tone: neutral
          claimRefs:
            - CV017
        - label: $80M ARR，18x 倍数
          value: 1440
          detail: 乐观情景低端支撑
          tone: positive
          claimRefs:
            - CV031
        - label: $100M ARR，20x 倍数
          value: 2000
          detail: 从当前入场价算，约 2x 新钱回报
          tone: positive
          claimRefs:
            - CV029
    approximationNotes: 价值单位为百万美元，是简单的 ARR 乘倍数场景。未调整净现金、债务、稀释或优先权负担。
    claimRefs:
      - CV011
      - CV017
      - CV029
      - CV030
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 给出本章情景模型隐含的悲观、基准和乐观结果区间。
    data:
      items:
        - label: 悲观情景
