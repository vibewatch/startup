  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 开发者主导的买方如何从噪音或合规痛点，进入试点、上线、重复使用工作流，并在 Aikido 上扩张。
    data:
      items:
        - label: 认知
          detail: 触发点通常是警报疲劳、工具碎片化、审计压力，或希望让安全变得适合开发者使用，而不是另开一个仪表盘仪式。
          touchpoints:
            - 误报太多
            - 合规与审计期限
            - 安全工具蔓延
        - label: 评估
          detail: 团队拿 Aikido 对比 Snyk、GitHub Advanced Security、Detectify、Tenable、Black Duck，或多工具开源栈， 重点看易用性、信号质量和集成契合度。
          touchpoints:
            - 降噪演示
            - 在少数代码库做 PoC
            - 竞品替换测试
        - label: 初始上线
          detail: 首次部署通常会快速连接代码库、云账户、镜像仓库和现有工作流系统，让团队不需要大量启用成本，就能在熟悉工具里看到问题。
          touchpoints:
            - GitHub 或 GitLab 连接
            - Slack、Jira、Linear 或 Vanta 集成
            - 代码库与云扫描设置
        - label: 日常使用
          detail: 当团队分诊的问题更少、能自动修复或路由真正重要的问题，并把报告或证据导出用于客户和审计沟通时，产品才变得有用。
          touchpoints:
            - 主信息流审查
            - AutoFix 与修复指引
            - 安全审计报告与合规证据
        - label: 扩张 / 续约
          detail: 公开材料里最好的扩张模式是更广泛标准化：更多代码库、更多团队、组合公司上线、企业服务，或在核心工作流之上采用 AI 渗透测试。
          touchpoints:
            - 投资组合公司上线
            - 企业功能与本地部署
            - AI 渗透测试与持续测试
    approximationNotes: 这张旅程图根据抓取的客户故事、定价页面和评论页面重建。Aikido 不公布阶段转化率或平均销售周期。
    claimRefs:
