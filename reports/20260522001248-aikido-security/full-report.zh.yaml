  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >
              Aikido 最有用的市场边界不是泛化的网络安全支出。Aikido 自己的产品页和用例页显示， 该平台横跨应用安全、软件供应链安全、云态势、运行时或攻击面覆盖，以及面向合规的证据生成。
              这意味着公司的真实可服务市场大于纯 SAST 或 DAST 预算，但也没有覆盖大型企业可能花出的每一美元安全支出。
              合适边界是代码到云的开发者安全：服务那些希望用一个系统减少工具数量、加快修复并做好审计准备的团队。


              留存官方细分页也显示，Aikido 有意卖进多个买方环境：创业公司、企业团队、金融科技、代理商和伙伴主导渠道。 因此，替代方案包括独立 AppSec
              工具、云安全工具、点状合规工具、手工或定期渗透测试、开源扫描器拼盘，以及 CI/CD 内部自建。 Aikido 的对比页直接把这一点说透，把 Snyk、GitHub Advanced
              Security、Orca、Veracode 和 Mend 框定为现状替代方案。 这对市场规模测算很关键：只看代码扫描，会低估 Aikido 想解决的问题；把所有云安全和 GRC 支出都纳入，又会高估。
