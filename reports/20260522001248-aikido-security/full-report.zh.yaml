      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 仅用公开证据，对 Aikido 的估值设置做 IC 风格定性评分。
    data:
      items:
        - label: 市场机会
          value: Medium-High
          detail: 软件安全市场空间大，整合和开发者优先工作流有真实需求
          tone: positive
          claimRefs:
            - CV021
        - label: 产品宽度
          value: Medium-High
          detail: 统一平台加 AI 渗透测试，在战略上有吸引力
          tone: positive
          claimRefs:
            - CV025
        - label: 增长信号
          value: High
          detail: B 轮融资加上 5x 收入增长和客户数增长 3x，显示动能明确
          tone: positive
          claimRefs:
            - CV003
        - label: 单位经济可见度
          value: Low
          detail: 未公开披露合并毛利率、NRR 或烧钱速度
          tone: adverse
          claimRefs:
            - CV009
        - label: 相对估值
          value: Stretched
          detail: 隐含 40x-100x ARR，高于大多数可观察的上市网络安全倍数
          tone: adverse
          claimRefs:
            - CV022
        - label: 证据质量
          value: Medium-Low
          detail: 融资事实强，能用于投资判断的经营指标弱
          tone: warning
          claimRefs:
            - CV024
        - label: 投资建议
          value: TRACK / RESEARCH MORE
          detail: 公开证据不足以支撑在 $1B 估值上新买入
          tone: neutral
          claimRefs:
            - CV034
    approximationNotes: KPI 值只是基于公开证据的分析判断。不是公司、投资人或任何第三方评级机构给出的评分。
    claimRefs:
      - CV003
      - CV009
      - CV022
      - CV024
      - CV025
      - CV034
