      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              公开证据不支持已具备 IPO 条件的结论。Aikido 具备强私有成长公司的要素——清晰的品类定位、近期资本和可见动能——但还没有达到公开市场承销流程需要的披露标准。最重要的缺失项包括合并 ARR 和 GAAP
              收入、软件与服务毛利率、按 cohort 和层级拆分的留存、股权结构表和优先权细节，以及客户集中度。这些不是小的报告缺口；它们是判断 $1 billion 估值只是激进还是根本跑在业务前面的核心变量。


              因此，下一步尽调不是讲出更好的故事，而是拿到更好的证据。管理层需要证明，AI 渗透测试和统一代码到云定位是否真的带来溢价经济性。如果能，当前估值仍可能继续复合。如果不能，公司在走到 IPO
              前更可能先面对平轮到降价轮的压力。按今天的公开证据，战略可选性比近期公开上市准备度更可信，尽调议程也应据此搭建。
            claimRefs:
              - CV009
