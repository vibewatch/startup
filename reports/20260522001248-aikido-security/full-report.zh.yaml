      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              情景分布异常宽，因为起始输入异常不确定。乐观情景需要的不只是执行好；Aikido 还必须继续保持异常值。在这种情况下，ARR 到 2027 年达到大约 $80 million 至 $100 million，AI
              渗透测试和企业增购加深变现，业务保住 18x–20x 的溢价倍数。这样得到的估值区间约为 $1.4 billion 至 $2.0 billion。这个情景可能发生，但对以 $1 billion
              入场的新投资者来说，只是勉强越过回报门槛。


              基准情景要难看得多。如果增长仍强但开始正常化，ARR 可能落在 $45 million 至 $60 million 区间，市场可能只给 10x–12x 倍数，对应 $450 million 至 $720
              million 价值。悲观情景更严厉：$25 million 至 $35 million ARR 配 5x–7x，得到 $125 million 至 $245
              million。若公开指标持续稀薄、捆绑压力上升，或业务毛利率低于软件优先投资者预期，这些结果并不极端。关键在于，当前价格只有在 Aikido 未来几年继续保持异常值时才站得住。
