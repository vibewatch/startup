      - number: '8.2'
        title: 建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >
              对新资金的建议是观察 / 继续研究。公司本身可能质量很高，但当前估值还没有被公开证据充分锚定。Aikido 的 $1 billion 投后估值轮只有在乐观假设下才说得通：ARR 已经更接近 ARR Club
              给出的 $25 million 信号，而不是 1 月份较低的 $10 million 信号；增长到 2027 年仍然很高；业务最终拥有类似软件公司的毛利率，而不是更重的支持与服务混合画像。


              置信度为中低，因为核心算术依赖估计 ARR 和公开可比倍数，而不是经审计的管理层披露。风险评级为高。如果 Aikido 已经达到 $25 million
              ARR，并且能继续复合增长，当前估值最终可能只是显得激进。可是，如果该轮更接近低十几百万 ARR 成交，价格就高过几乎所有可观察公开网络安全倍数，CrowdStrike
              除外。对现有内部投资者来说，持有仍可能合理，因为公司刚拿到新资金，也有动能。对只使用公开证据的外部投资者来说，当前估值应视为偏高。
            claimRefs:
