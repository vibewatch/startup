      - number: '5.2'
        title: 开发者工作流与运营模型
        blocks:
          - type: paragraph
            body: >-
              技术运营模型是 Aikido 最强的公开资产之一。文档和产品页显示，接入通过源码控制集成、只读云连接器、注册表访问、 受限环境可选本地扫描器，以及客户需要运行时覆盖时的应用内 Zen
              库完成。这意味着平台可以从轻量 SaaS 式扫描起步； 但更完整的版本依赖来自 CI、运行时、云和 API 流量的更深客户遥测。容器和云材料反复强调关联：
              镜像、包、VM、运行时和代码仓库被连接起来，让系统能在运营上下文中排定问题优先级，而不是吐出孤立发现清单。


              摄入之后的工作流同样重要。Aikido 文档列出了 PR 反馈、CI 门禁、AI 分诊、AutoFix、SBOM 导出、合规报告， 以及同时使用已声明规范和观测流量的 API 发现流程。Safe Chain
              把控制点向上游延伸到包安装，Zen 则向下游延伸到应用运行时。 结果是一条从检测到优先级排序、再到修复或阻断的连贯闭环。剩余尽调问题不是工作流是否存在，而是它在企业级规模、 复杂认证 /
              会话模式，以及更严格部署或数据处理要求下表现是否稳定。
