      - - 种子前 / 可转债融资
        - MandA 报道种子轮前有 ~€2M 天使可转债
        - 低
        - 关系到股权结构表清理和早期稀释历史。
        - 要求提供 SAFEs / 可转债明细表和转换机制。
      - - 比利时实体资产负债表
        - FY2025 资产 €18.2M；权益 €14.7M；负债 €3.48M
        - 高
        - 显示 Series B 和英国实体搭建前，BV 层面已积累多少资本。
        - 要求提供最近月末合并资产负债表。
      - - 比利时实体经营表现
        - FY2025 毛利 -€3.73M；经营结果 -€4.43M
        - 高
        - 确认到 2025 年初，核心实体尚未靠自身造血。
        - 要求披露 2025 年 2 月以来的月度烧钱速度和合并 P&L。
      - - 当前现金跑道
        - 无法用公开信息计算
        - 低
        - 现金跑道决定公司在达到稳态规模前，是否还依赖下一轮股权融资。
        - 要求披露现金余额、月度净烧钱和下行情景经营计划。
      - - 债务 / 项目融资义务
        - 未见留存公开证据显示存在债务，但披露并不完整
        - 低
        - 隐藏杠杆或担保会显著改变下行风险。
        - 要求提供债务明细、授信额度、租赁和或有负债。
    notes: 资本充足性方向上有利，因为公司近期完成了一笔大型 Series B；但头部融资之外的每一行，都仍需管理层直接提供证据，才足以承销。
