              Engineering、平台负责人、DevSecOps 工程师、安全工程师和开发者， 而不是采购官。这一点重要，因为它说明产品在买方想要统一工作流工具、且开发者真的会用的地方胜出。 客户故事索引明确覆盖
              Startup、Scaleup 和 Enterprise，抓取到的故事则覆盖 HealthTech、HRTech、LegalTech、HospitalityTech、
              SecurityTech、制造、教育和组合场景。公开企业计划支持 2,000 个代码仓库、1,000 个容器、 100 个云账户和 500
