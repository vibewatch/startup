        - 销售主导包装
        - 企业定价不透明会拖慢 SMB 采用，但适合大型受监管买家。
      - - Veracode
        - 以报价为主
        - 企业平台销售
        - 留存页面没有公开标价
        - 大客户里，信任和治理可能压过透明度。
      - - GitLab Ultimate
        - 透明的平台方案
        - 更大的 DevOps 套件，含高级安全 / 合规
        - 面向高级安全与合规的 Ultimate 层级
        - 捆绑降低 GitLab 原生团队引入额外供应商的需求。
