      - number: '8.5'
        title: 可比公司组合与相对估值
        blocks:
          - type: paragraph
            body: >
              可比组合分成三层分析。第一层是直接公开软件安全和 DevSecOps 参照：GitLab 是最接近的工作流平台类比，交易倍数约 4.5x 收入；Qualys 和 Tenable 分别约 5.2x 和
              2.7x。Rapid7 约 0.6x 收入，是安全厂商失去增长可信度后的警戒底部。这些公司没有一个是完美商业模式匹配，但都能说明：一旦增长放缓，或产品广度不再稀缺，正常化公开网络安全倍数会落在哪里。


              第二层是高溢价公开安全软件。Palo Alto Networks 按当前市值 / 收入替代口径约 20.7x，CrowdStrike 约
              34.3x。它们是公开市场天花板，不是中心情景。第三层是后期私有安全公司。Wiz 的 $12 billion 融资展示了 2024 年顶端私有云安全基准的样子；Snyk 的 $300 million ARR
              和最近 $7.4 billion 估值组合，暗示约 24.7x 的私有 AppSec 基准。放在这组参照中，除非 Aikido 已经更接近 ARR 估算区间的顶部，否则隐含 40x–100x 区间显得昂贵。
