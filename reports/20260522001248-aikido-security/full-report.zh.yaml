  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 为何重要
      - 尽调要求
    rows:
      - - 获客成本（CAC）
        - 未披露
        - 低
        - 必须拿到该项，才能判断免费增值和渠道打法是否高效转化为付费收入。
        - 要求按渠道披露混合 CAC，并按队列披露营销与销售回本周期。
      - - CAC 回本周期
        - 未披露；自助队列可能较好，企业客户更长
        - 低
        - 决定透明定价是在增厚增长，还是在稀释利润率。
        - 要求拆分自助、销售主导、合作伙伴主导队列的回本周期。
      - - 毛利率
        - 合并口径未公开；比利时实体 FY2025 文件显示毛利为负
        - 中
        - 拆开软件经济性与服务或重支持负担。
        - 要求披露合并毛利率桥，以及服务与软件的毛利率拆分。
      - - 实施负担
        - 公司称上手很快，开发者开销低
        - 中
        - 低实施负担可显著改善回本周期并降低支持成本。
        - 用价值实现时间数据、上手小时数和客户成功人员配比验证。
      - - 扩张潜力
        - 理论上较高，来自企业功能、合作伙伴捆绑、合规工作流和渗透测试邻近业务
        - 中
        - 如果免费和低端套餐有意压低价格，扩张就是核心。
        - 要求披露 NRR、模块附加率、席位 / 代码库扩张曲线。
      - - 支持 / 服务负担
        - 存在但未量化
        - 低
        - 企业上手、本地部署和类似渗透测试的工作会压低 SaaS 毛利率。
        - 要求披露专业服务收入占比、附加率和利用率。
      - - 定价权
        - 混合：标价透明且有颠覆性，但部分用户仍认为付费层级对初创公司偏贵
        - 中
        - 判断 Aikido 是靠低价抢份额，还是还有涨价空间。
        - 要求按层级和细分披露赢单 / 输单与续约数据。
