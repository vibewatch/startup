              客户基数在此前一年增加逾三倍。这些都是强增长信号，但团队不是付费组织，任何一个口径也无法说明席位数、ARR 构成或免费与付费分布。 轨迹中更能承保的部分来自部署表面：Visma 覆盖 200+ 家投资组合公司和
