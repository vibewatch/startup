  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变观点的证据
    rows:
      - - 增长证据
        - Series B 轮、100,000+ 个团队、5x 收入增长和客户基数翻三倍，显示真实动能
        - ARR 仍来自外部估计而非管理层验证，增长叙事还没形成完整投资支撑
        - 经验证的往绩 ARR 和按季度收入
      - - 产品定位
        - 统一的代码到云端平台加 AI 渗透测试，可以拉宽 ACV 并形成溢价定位
        - 如果支持或服务负担重，产品广度未必能转化为溢价经济性
        - 按产品线拆分的毛利率桥接，以及 AI 渗透测试附加率证据
      - - GTM 模型
        - 免费增值和自助服务可以带来高效的开发者主导获客
        - 起始 ACV 较低；若没有异常强的扩张指标，$1B 标记很难支撑
        - 按层级拆分的 NRR / GRR 和企业扩张队列
      - - 融资信号
        - 蓝筹投资人接受 $1B 价格，说明私人市场信心强
        - 公开投资人不知道股权结构表保护、优先股堆叠，也不知道是否嵌入任何老股交易
        - 完整股权结构表、清算优先权瀑布，以及任何内部人流动性条款
      - - 相对估值
        - 如果 Aikido 走上类似 Wiz/Snyk 的路径，做到异常大的 AppSec 规模，溢价可能合理
        - 公开估计区间仍隐含 40x-100x ARR，高于多数可观察网络安全倍数
        - 经验证 ARR 超过 $50M，并证明软件式毛利率
      - - 证据质量
        - 官方和备案来源支持公司存在、已融资且在国际扩张
        - 核心投资判断数据仍不可得，反向评论证据显示产品和定价有摩擦
        - 经审计财务、留存指标和客户集中度披露
    notes: 反向逻辑不是失败预测，而是一组事实：目前它们阻止只看公开证据的投资人有信心承销当前估值。
