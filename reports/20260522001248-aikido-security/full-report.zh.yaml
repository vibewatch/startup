      - number: '1.4'
        title: 里程碑、混合信号与未决问题
        blocks:
          - type: paragraph
            body: >
              里程碑记录支持融资标题之外的真实动能。Aikido 于 2023 年 4 月公开发布，约六个月内从种子轮推进到 Series A， 2025 年 9 月收购 AI 原生渗透测试团队 Allseek 和
              Haicker，并在 2026 年 2 月推出 Aikido Infinite， 定位为连续 AI 渗透测试和修复产品。公司显然正从广义开发者安全平台，演进成围绕自我安全软件和机器速度渗透测试的更强自主安全逻辑。


              同一记录也暴露了后续章节的主要尽调注意点。公开员工数报道并不一致，2026 年 1 月和 5 月来源分别提到 130、164、180 和 200+ 名员工。
              客户披露的分母也在组织、开发者和团队之间切换，直接横向比较任何一个数字都很危险。评论来源整体有利， 但反向点也重要：用户仍指出高级 API
              和报告能力缺失、部分误报残留，以及低阶套餐存在功能缺口。最重要的是，治理结构、 经审计财务和当前精确客户账户数仍属私有。公司看起来增长快且可信，但还没有完全透明。
