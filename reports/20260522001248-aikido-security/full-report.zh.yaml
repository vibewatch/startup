      - number: '2.2'
        title: TAM、SAM、SOM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              第三方市场估计确认应用安全已经是大市场，但这些估计并不能直接对比。Mordor 和 Fortune 都把 2026 年全球应用安全市场放在约 $14.8 billion 至 $14.9 billion，
              Coherent 的方向也类似，略高于 $15 billion。相反，MarketsandMarkets 发布的 2026 年数字要宽得多，为 $41.16 billion， 2031 年数字超过 $66
              billion。区间太宽，不能盲目平均。更合理的解释是，较窄的一组追踪核心 AppSec 工具和相关服务， 较大的数字则纳入了围绕应用保护的更广平台和服务边界。


              具体到 Aikido，自下而上的视角比单个行业标题更有用。Mordor 称大型企业仍占支出多数，但中小企业是增长更快的部分。 这一点重要，因为 Aikido
              的定位、定价、接入模式和行业页，都偏向那些需要严肃覆盖、又不想背上安全项目开销的团队。 2026 年核心 AppSec 的可辩护 TAM 接近 $15 billion，但 Aikido 的实际 SAM
              是更小的一块： 云原生 SMB、金融科技、代理商和数字原生企业团队，并且愿意购买集成式、开发者优先安全。合理的分析性 SAM 区间约为 $2 billion 至 $3 billion；
              在公司证明能更深打入超大型企业账户和受监管买家之前，近期 SOM 应低于 $1 billion。
