      - number: '2.4'
        title: 增长驱动、采用约束与市场逻辑
        blocks:
          - type: paragraph
            body: >
              结构性增长驱动很强。第三方市场报告和监管来源都指向同一方向：更多云原生应用、更多 API、更多开源依赖、更多 AI 生成代码，以及更多合规义务。 Latio 报告认为，AI
              辅助编码和扫描器整合正在重塑应用安全；CISA 则把 SBOM 和 VEX 抬升为软件供应链基本项。 EU Cyber Resilience Act 把生命周期安全和漏洞管理推入软件采购预期，Aikido
              自己的金融科技和合规页面也把 DORA、PCI、ISO 27001、 SOC 2、HIPAA、NIS2 和 OWASP 转化成具体买方痛点。


              但市场采用并非没有摩擦。AppSec 买家仍要处理工具噪声、类别重叠、点状产品之间的重复支出，以及误报淹没工作流时开发者的怀疑。 SMB
              和创业公司环境里价格敏感是真问题，大企业则常常偏好既有套件、内部自建或同类最佳专家工具。 因此，Aikido
              的市场逻辑最好概括为品类收敛加工作流简化。公司最清晰的赛道不是“所有网络安全”，而是帮助开发者和精简安全团队， 用一个集成平台替换割裂的 AppSec 和合规工作流。如果 Aikido
              持续在速度、可负担性和证据自动化最重要的场景取胜，市场足够大。 如果市场重新向重型企业套件集中，或买方认定同类最佳深度比整合更重要，采用速度就会慢于宽口径 TAM 暗示。
