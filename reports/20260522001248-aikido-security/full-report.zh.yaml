      - number: '3.2'
        title: 能力、定价与战略方向
        blocks:
          - type: paragraph
            body: >
              竞争者阵营分成几种不同战略模型。Snyk 仍是广义开发者优先 AppSec 平台，采用附加模块和按席位定价。 GitHub Advanced Security 在市场最大开发者工作流里销售原生代码和 secret
              保护。Semgrep 以开发者友好、免费入口和基于贡献者的模型竞争。 Veracode 和 Checkmarx 强调企业级平台广度、治理和更深入的大账户销售动作。Orca、Apiiro 和 Jit
              是上下文丰富的代码到云或 ASPM 式定位的更强例子， Endor Labs 和 Mend 则更用力推软件供应链情报和优先级排序。


              价格透明本身就是战略变量。Aikido 发布简单入门价，GitHub 发布代码和 secret 保护的 active-committer 定价， Snyk 宣传起步套餐，Semgrep
              公开展示免费和付费包装。相比之下，上层企业市场中很大一部分仍依赖报价驱动采购。 AppSec Santa 的定价指南提到，企业 AppSec 技术栈很快就能进入每年 $30,000 至 $150,000
              及以上区间。 这一点重要，因为 Aikido 想拿下的账户会把采购简单和总成本清晰当成产品的一部分，而不是商业脚注。
