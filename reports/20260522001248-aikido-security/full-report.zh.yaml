      - 影响
      - 精确尽调路径
    rows:
      - - 合并 ARR 与 GAAP / 管理口径收入桥
        - 阻碍对增长质量和估值支撑做干净承销
        - 要求月度 ARR 桥、收入确认政策和 FY2024-FY2026 管理账。
      - - 按软件、渗透测试和服务活动拆分毛利率
        - 无法判断非经常性工作是在增厚还是稀释毛利率
        - 要求披露产品线毛利率和支持成本分摊。
      - - 现金余额、烧钱速度和现金跑道月数
        - 资本充足性仍停留在叙事，无法计算
        - 要求最新现金报告、烧钱瀑布和 18 个月计划。
      - - NRR / GRR 以及按层级拆分的扩张
        - 无法判断落地后扩张是否真的在复利
        - 要求按队列披露客户留存、金额留存和升级率。
      - - 实际成交价和折扣纪律
        - 如果企业折扣激进，标价可能高估实际变现
        - 要求按套餐披露 ASP、年度预付占比和折扣审批政策。
      - - 客户集中度和地区组合
        - 未知是否暴露于少数大客户或美国需求过重
        - 要求前 20 大客户收入占比和逐地区 ARR 组合。
    notes: 这些是最低限度的阻塞项，仍把公开势能和真正财务承销隔开。
