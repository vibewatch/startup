  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、同业集合与替代类别
        blocks:
          - type: paragraph
            body: >
              Aikido 的替代集合远不止一个具名对手。公司自己的对比页列出了多个集群里的直接同业： Snyk 和 Semgrep 等开发者优先 AppSec 专家；GitHub Advanced Security 和
              GitLab Ultimate 等平台原生代码托管方； Veracode 和 Checkmarx 等企业优先 AppSec 厂商；Orca、Jit、Apiiro 等偏云或态势的平台；以及 Mend 和 Endor
              Labs 等聚焦供应链的厂商。 这是理解竞争的正确方式，因为买家不会只拿范围完全相同的一对一产品对比。他们比较的是在既有技术栈里解决同一问题的可信路径。


              这种更宽的框架也意味着，现状不只是“再买一个工具”。买家可以继续使用开源扫描器拼盘，依赖 GitHub 或 GitLab 的平台原生功能，
              把更多工作外包给渗透测试人员或顾问，或把只管代码和只管云的厂商组合起来。AppSec Santa 的 2026 替代方案指南也强化了这一点： 决策往往关乎深度与简单之间的取舍，而不是扫描器数量本身。Aikido
              的主要竞争优势是简单、价格透明和捆绑覆盖。 主要脆弱点则是，专业化买家完全可能理性选择范围更窄但深度更强的平台。
