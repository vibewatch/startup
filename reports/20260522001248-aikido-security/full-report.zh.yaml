    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 主要风险
    rows:
      - - Git 提供商 + 本地扫描器
        - 为代码扫描提供代码库、分支、PR 和 CI 上下文。
        - GitHub、GitLab、Azure DevOps、Bitbucket，或本地扫描器执行。
        - 如果代码库无法连接或本地扫描，覆盖率会下降。
      - - 云 API
        - 用最少部署基础设施摄取态势、VM、运行时和资产数据。
        - AWS、Azure、GCP 只读 API 连接。
        - 权限缺口或 API 漂移会削弱可见度和新鲜度。
      - - 仓库 + 镜像元数据
        - 把容器发现项连回代码负责人和运行时资产。
        - 仓库访问权限，加包与镜像元数据。
        - 断开的仓库连接会破坏端到端血缘和优先级排序。
      - - Zen 应用内运行时
        - 观察请求到 sink 的行为，并可选择在运行时拦截。
        - 嵌入客户应用的特定语言库。
        - 性能、框架覆盖和推广纪律会变得重要。
      - - Opengrep + Aikido 控制平面
        - 执行规则、关联发现项、分诊、AutoFix，并管理仪表盘。
        - 开源引擎，加 Aikido 编排和集成。
        - OSS 维护和编排质量是关键依赖。
      - - AI + 报告 / 导出界面
        - 生成修复、OpenAPI 规格、自定义规则、摘要和合规工件。
        - 模型推理，加留存扫描上下文和报告模板。
        - 准确性、治理和数据边界细节需要尽调。
    notes: 理解 Aikido 架构，最好把它看成叠在外部源代码、云、仓库、运行时和 OSS 输入之上的控制平面。这带来灵活性和工作流适配，也引入生态依赖。
