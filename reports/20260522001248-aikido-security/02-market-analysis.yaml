  - id: buyer-user-payer-segmentation
    title: Buyer, user, payer, and channel segmentation
    body: |
      Aikido's official industry and integration pages imply a segmented go-to-market rather than a single monolithic ICP. Startups buy because founders, CTOs, and early developers need an all-in-one tool that gets them to secure coding and compliance basics without standing up a dedicated AppSec team. Enterprise buyers care about scale controls such as SSO, role-based access, on-prem scanners, monorepo management, and large-repository or multi-cloud coverage. Fintech buyers prioritize credibility with customers, auditors, and regulators, especially around DORA, PCI DSS, ISO 27001, and NIS2. Agencies and MSPs, meanwhile, value multi-tenant management, margin protection, and proof they can secure many client repos without exploding operating cost.

      The user and payer are not always the same. Developers and platform engineers are the day-to-day users across segments, but budget owners change: founder or CTO in startups, security or platform leadership in enterprise, compliance and risk leaders in fintech, and principals or delivery managers in agencies. Partner and integration pages add a second layer to the segmentation. Vanta, Drata, and Sprinto are not pure competitors; they are adjacent compliance systems that can help Aikido land where audit readiness is the first buying trigger. Likewise, reseller, MSP, and technology-partner motions can expand distribution into accounts that prefer service-led procurement or bundled offerings.
