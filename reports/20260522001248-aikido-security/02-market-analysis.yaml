  - id: growth-drivers-adoption-constraints-and-thesis
    title: Growth drivers, adoption constraints, and market thesis
    body: |
      The structural growth drivers are strong. Third-party market reports and regulatory sources all point in the same direction: more cloud-native applications, more APIs, more open-source dependencies, more AI-generated code, and more compliance obligations. The Latio report argues that application security is being reshaped by AI-assisted coding and scanner consolidation, while CISA elevates SBOM and VEX into software-supply-chain fundamentals. The EU Cyber Resilience Act pushes lifecycle security and vulnerability management into software procurement expectations, and Aikido's own fintech and compliance pages translate DORA, PCI, ISO 27001, SOC 2, HIPAA, NIS2, and OWASP into concrete buyer pain.

      But market adoption is not frictionless. AppSec buyers still struggle with noisy tools, overlapping categories, duplicated spending between point products, and developer skepticism when false positives overwhelm workflows. Price sensitivity is real in SMB and startup environments, while large enterprises often prefer incumbent stacks, internal build, or best-of-breed specialists. That means Aikido's market thesis is best framed as category convergence plus workflow simplification. The company's clearest lane is not “all cybersecurity”; it is helping developers and lean security teams replace fragmented AppSec and compliance workflows with one integrated platform. If Aikido continues to win where speed, affordability, and evidence automation matter most, the market is large enough. If the market recenters around heavyweight enterprise suites or buyers decide best-of-breed depth matters more than consolidation, adoption will be slower than the broad headline TAM implies.
