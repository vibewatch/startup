evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A formal board roster, board observer list, and committee structure for the post-Series B company.
    whyItMatters: Governance maturity is central once a private company is valued at $1 billion and expanding internationally.
    diligencePath: Request the current board deck cover, cap table, and any board or observer consent schedules from the data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified ARR, revenue, gross margin, retention, and cash-burn metrics.
    whyItMatters: Later underwriting chapters need a clean denominator for growth, efficiency, and valuation sanity.
    diligencePath: >-
      Request monthly ARR bridge, FY2024 and FY2025 management accounts, gross-margin build, and board-approved
      operating plan.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A single authoritative current employee count and a dated explanation for the 130, 164, 180, and 200-plus public
      figures.
    whyItMatters: Headcount is a key scale and efficiency indicator that later financial and operational analysis will reuse.
    diligencePath: >-
      Ask finance or people ops for the latest employee census plus a quarter-by-quarter headcount bridge since January
      2025.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: customer-denominator
    missingEvidence: A normalized reconciliation of organizations, developers, teams, and named enterprise accounts.
    whyItMatters: Marketing-friendly team counts can overstate comparable customer scale if the denominator changes over time.
    diligencePath: >-
      Request a customer-count taxonomy defining paying organizations, active developers, active teams, and enterprise
      accounts by period.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: stale
    severity: material
    topic: sam-estimation
    missingEvidence: >-
