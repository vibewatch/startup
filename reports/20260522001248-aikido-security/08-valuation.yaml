  - id: TV005
    title: Thesis-break and trigger table
    columns:
      - Trigger
      - Threshold
      - Why it breaks the thesis
      - Action implication
    rows:
      - - ARR proof disappoints
        - Verified ARR still below $25M after 2026 or below $60M by 2027
        - Current mark relies on outlier growth; weak ARR proof collapses premium justification
        - Re-rate to public floor comp set; avoid paying anywhere near the last mark
      - - Gross margin is not software-like
        - Consolidated gross margin below ~70% or meaningful services drag
        - Aikido stops resembling premium software and starts resembling a blended delivery business
        - Move from premium-multiple case to 5x-10x range analysis
      - - Retention and expansion fail
        - NRR below ~110% or enterprise expansion is weak
        - Bottom-up wedge is not compounding; low initial ACV cannot scale into valuation support
        - Treat the $1B round as over-earning relative to revenue quality
      - - Flat or down round occurs
        - Next priced financing at or below $1B
        - Market-clearing evidence contradicts the current mark and reveals weak demand at a premium
        - Reset recommendation to AVOID for new money until terms normalize
      - - Bundling compresses pricing
        - GitHub / GitLab / large-platform competition materially lowers win rates or realized pricing
        - The affordability and simplicity wedge narrows before Aikido reaches enough scale
        - Re-cut base and bear cases using lower ARR and lower multiples
      - - Reporting and structure remain opaque
        - No consolidated disclosure on ARR, margins, and cap table through the next fundraise cycle
        - Persistent opacity itself becomes a risk signal for public-market readiness and secondary demand
        - Require hard diligence before any fresh investment or secondary purchase
    notes: >-
      Thresholds are analytical triggers rather than management guidance. They are designed to be
      observable and valuation-relevant, not to predict operational outcomes precisely.
