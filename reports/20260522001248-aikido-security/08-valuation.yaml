  - id: SV002
    title: Recommendation, Confidence, and Valuation Stance
    body: |
      Recommendation for new money is TRACK / RESEARCH MORE. The company itself may be high quality,
      but the current valuation is not yet sufficiently anchored by public evidence. Aikido's $1
      billion post-money round can be rationalized only under optimistic assumptions: that ARR was
      already closer to the $25 million ARR Club signal than the lower $10 million January signal,
      that growth remains very high through 2027, and that the business ultimately carries software-
      like gross margins rather than a heavier blended support and services profile.

      Confidence is medium-low because the core arithmetic depends on estimated ARR and proxy public
      multiples rather than audited management disclosure. Risk rating is high. If Aikido is already
      at $25 million ARR and can continue compounding, the current mark may eventually look merely
      aggressive. If the round closed closer to low-teens ARR, however, the price is above almost
      every observable public cyber multiple other than CrowdStrike. For existing insiders, holding
      can still be rational because the company now has fresh capital and momentum. For outside
      investors using only public evidence, the current mark should be treated as stretched.
    claimRefs:
      - CV011
      - CV012
      - CV022
      - CV023
      - CV024
      - CV034
      - CV035
    tableRefs:
      - TV001
  - id: SV003
    title: Financing Context, Public Support, and Preference Overhang
    body: |
      Publicly, Aikido's financing history is strong but incomplete. The retained record supports a
      path from €5 million seed funding in late 2023 to a $17 million Series A in May 2024 and a $60
      million Series B in January 2026, plus approximately €2 million of early convertible funding.
      That is enough to show credible investor demand and a capital base around $85 million. It is
      not enough to model downside precisely. The public record does not disclose the full cap table,
      preferred liquidation stack, anti-dilution mechanics, or whether any secondary liquidity was
      included in the latest round.

      Filing-derived evidence is directionally useful but not underwriting-grade. The Belgian BV
      entity had €18.2 million of assets and €14.7 million of equity at FY2025 year-end, yet also a
      negative gross margin and operating loss. The UK entity only appears in April 2026 filings with
      subsequent share-capital and accounting-period changes. That combination suggests the company is
      still building out its legal and reporting perimeter while scaling internationally. Investors can
      therefore say that Aikido is well financed. They cannot say, from public evidence alone, how
      much downside protection exists for common holders or late secondary buyers.
    claimRefs:
