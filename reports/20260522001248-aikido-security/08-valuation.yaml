  - id: SV005
    title: Comparable Company Set and Relative Valuation
    body: |
      The comparable set splits into three analytical layers. First are direct public software-security
      and DevSecOps references: GitLab is the closest workflow-platform analog and trades at roughly
      4.5x revenue, while Qualys and Tenable sit around 5.2x and 2.7x respectively. Rapid7, at roughly
      0.6x revenue, is the cautionary floor for a security vendor that loses growth credibility. None
      of these companies is a perfect business-model match, but they are all useful in showing where
      normalized public cyber multiples settle once growth slows or product breadth is no longer rare.

      The second layer is premium public security software. Palo Alto Networks screens around 20.7x
      and CrowdStrike around 34.3x on current market-cap-to-revenue proxies. Those are the public
      ceilings, not the central case. The third layer is late-stage private security. Wiz's $12
      billion round shows what the top-end private cloud-security benchmark looked like in 2024, and
      Snyk's combination of $300 million ARR and a most recent $7.4 billion valuation suggests a
      roughly 24.7x private AppSec benchmark. Against that set, Aikido's implied 40x-100x band looks
      expensive unless the company is already much closer to the top end of the ARR estimate range.
    claimRefs:
      - CV013
      - CV014
      - CV015
