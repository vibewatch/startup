  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Consolidated ARR, gross margin, retention, burn, and cap table are not publicly disclosed
      missingEvidence: >-
        Public sources confirm financing and rough growth direction, but not the core operating metrics
        needed to underwrite a $1B software valuation.
      whyItMatters: >-
        Without consolidated ARR or revenue, gross margin, NRR / GRR, burn, and preference detail,
        investors cannot determine whether the current mark is aggressive but fair or structurally too high.
      diligencePath: >-
        Request monthly ARR and revenue bridge, audited or reviewed financials, cohort retention, gross-
        margin split, and a full cap-table / term-sheet summary.
      relatedQuestionRefs:
        - QV003
        - QV028
        - QV029
    - type: stale
      severity: material
      topic: ARR anchor is still an external 2026 signal rather than management disclosure
      missingEvidence: >-
        The chapter's public ARR band comes from ARR Club rather than an official company disclosure or
        filing-quality revenue statement.
      whyItMatters: >-
        The difference between ~$10M and ~$25M ARR changes the implied multiple from roughly 100x to 40x,
        which materially changes valuation judgment.
      diligencePath: >-
        Request latest trailing ARR, quarter-end revenue, and a bridge between bookings, ARR, and GAAP
        revenue recognition.
      relatedQuestionRefs:
        - QV003
        - QV010
    - type: missing-source
      severity: material
      topic: Secondary pricing and liquidation-preference detail are unavailable
      missingEvidence: >-
        No retained public source discloses whether the Series B included secondary liquidity, what the
        liquidation preferences are, or how downside proceeds would waterfall.
      whyItMatters: >-
        Without this information, late-entry and common-share downside returns cannot be modeled.
      diligencePath: >-
        Request the Series B term-sheet summary, cap table, preference stack, and any secondary sale data.
      relatedQuestionRefs:
        - QV029
    - type: enumeration-incomplete
      severity: material
      topic: Comparable valuation table remains partial because private AppSec peers rarely disclose both ARR and valuation
      missingEvidence: >-
        Several private AppSec peers disclose funding or valuation, but not current ARR; others disclose ARR
        milestones without synchronized round pricing.
      whyItMatters: >-
        This limits direct apples-to-apples comparison for Aikido's current private multiple and forces a
        heavier reliance on public security and software proxies.
      diligencePath: >-
        Expand the comp set with any new 2026 private financing disclosures or leaked ARR / valuation data,
        and update the table when both figures are observable from retained sources.
      relatedQuestionRefs:
        - QV030
      relatedTableRefs:
        - TV004
