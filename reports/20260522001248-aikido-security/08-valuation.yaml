company:
  name: Aikido Security
chapter:
  number: 8
  title: Valuation
  summary: >-
    Aikido Security's January 2026 Series B set a $1.0 billion valuation, but public evidence only
    partially supports that mark. Public facts support real momentum: $60 million of fresh capital,
    100,000+ teams, 5x revenue growth, and a tripled customer base. Filing-derived facts also show
    the Belgian BV entity was still loss-making through FY2025 and that a new UK entity was only
    capitalized in April-May 2026. Estimated facts are much thinner: ARR Club, a low-tier external
    signal source, places ARR above $10 million in January 2026 and at $25 million in April 2026,
    implying roughly 40x-100x ARR at the current mark. Unavailable from public evidence are
    consolidated revenue, gross margin, NRR, burn, and liquidation preferences. Against public cyber
    and DevSecOps proxies—GitLab ~4.5x, Qualys ~5.2x, Tenable ~2.7x, Palo Alto ~20.7x, CrowdStrike
    ~34.3x—Aikido screens as stretched. Recommendation: TRACK / RESEARCH MORE, not a fresh BUY at
    the current public mark.
sections:
  - id: SV001
    title: Investment Thesis and Anti-Thesis
    body: |
      The positive case for Aikido is straightforward. The company is clearly not a zero-traction
      story: the January 2026 Series B established a $1 billion mark, management says the platform
      serves 100,000+ teams globally, and both the official Series B post and third-party coverage
      say revenue grew 5x while the customer base more than tripled over the prior year. The product
      thesis is also coherent. Aikido positions itself as a unified code-to-cloud security platform,
      and its earlier Series A messaging emphasized a freemium, self-service, developer-led motion.
      If that model truly combines high product breadth, low-friction onboarding, and efficient
      expansion into enterprise and AI pentesting workflows, Aikido could still grow into a premium
      valuation.

      The anti-thesis is stronger than the public bull story admits. The best public ARR datapoints
      come from ARR Club rather than management, and they imply that the $1 billion mark rests on an
      estimated 40x-100x ARR band. Filing-derived evidence shows the Belgian entity was still
      loss-making through FY2025, while the most important underwriting variables—consolidated
      revenue, gross margin, NRR, burn, debt, and liquidation preferences—remain unavailable. In
      other words, public evidence confirms growth and funding, but not enough operating quality to
      justify paying the current mark with conviction.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
