  - id: TV006
    title: Final diligence asks table
    columns:
      - Priority
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - 1
        - Consolidated ARR and GAAP / management revenue bridge
        - No public consolidated revenue disclosure; ARR Club is external only
        - Determines whether the current $1B mark is 40x, 100x, or something more defensible
        - Request monthly ARR and revenue bridge from 2025 through latest quarter
      - - 2
        - Gross margin and software vs services mix
        - Belgian filing shows losses but not consolidated product economics
        - Premium software multiples require software-like margin structure
        - Request consolidated gross margin by product and support / services allocation
      - - 3
        - NRR / GRR and expansion by tier
        - No public retention data
        - Bottom-up pricing only works at $1B if expansion is unusually strong
        - Request retention, logo churn, expansion, and downgrade rates by cohort
      - - 4
        - Cap table and liquidation preferences
        - No public preference stack, anti-dilution, or secondary detail
        - Downside and late-entry returns cannot be modeled without it
        - Request full cap table, term sheet summary, and any side-letter liquidity terms
      - - 5
        - Customer concentration and enterprise mix
        - Public stories name logos but not concentration or ACV mix
        - Needed to judge durability of the 5x growth narrative
        - Request top-20 customer share, segment mix, and partner concentration
      - - 6
        - AI pentesting monetization proof
        - Product narrative is strong, but monetization and margin effect are unproven publicly
        - Premium upside depends on AI features lifting ARPU or retention, not just marketing narrative
        - Request attach rate, uplift, and gross-margin data for Aikido Attack / pentest workflows
    notes: >-
      Items 1-4 are blocking for any new-money underwriting at the current valuation. Items 5-6 are
      essential to determine whether upside can move beyond a narrative premium.
