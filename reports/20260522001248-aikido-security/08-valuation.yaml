  - id: SV004
    title: Bull, Base, and Bear Scenarios
    body: |
      The scenario spread is unusually wide because the starting inputs are unusually uncertain. The
      bull case requires more than good execution; it requires Aikido to remain an outlier. In that
      case, ARR reaches roughly $80 million to $100 million by 2027, AI pentesting and enterprise
      upsell deepen monetization, and the business retains an 18x-20x premium multiple. That yields a
      valuation band of roughly $1.4 billion to $2.0 billion. It is possible, but it only barely
      clears the return hurdle for a new investor entering at $1 billion.

      The base case is much less flattering. If growth remains strong but normalizes, ARR may land in
      the $45 million to $60 million range and the market may assign only a 10x-12x multiple, which
      implies $450 million to $720 million of value. The bear case is harsher still: $25 million to
      $35 million of ARR at 5x-7x gives $125 million to $245 million. Those outcomes are not extreme
      if public metrics remain thin, bundling pressure rises, or the business proves to have lower
      gross margins than software-first investors expect. The key point is that the current price only
      works if Aikido remains an outlier for several more years.
    claimRefs:
