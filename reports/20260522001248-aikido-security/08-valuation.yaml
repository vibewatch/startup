  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Growth proof
        - Series B, 100,000+ teams, 5x revenue growth, and tripled customer base show genuine momentum
        - ARR is still externally estimated rather than management-verified, so the growth narrative is not fully underwritten
        - Verified trailing ARR and revenue by quarter
      - - Product positioning
        - Unified code-to-cloud platform plus AI pentesting can widen ACV and create premium positioning
        - Product breadth may not translate into premium economics if support or services load is heavy
        - Gross-margin bridge by product line and attach-rate proof for AI pentesting
      - - GTM model
        - Freemium and self-service can create efficient developer-led acquisition
        - Lower starting ACVs can make a $1B mark difficult to support without exceptional expansion metrics
        - NRR / GRR by tier and enterprise expansion cohorts
      - - Financing signal
        - Blue-chip investors accepted a $1B price, suggesting strong private conviction
        - Public investors do not know cap-table protections, preference stack, or whether any secondary was embedded
        - Full cap table, preference waterfall, and any insider liquidity terms
      - - Relative valuation
        - Premium may be warranted if Aikido is on a Wiz/Snyk-like path to outlier AppSec scale
        - Public estimate band still implies 40x-100x ARR, above most observable cyber multiples
        - Verified ARR above $50M plus evidence of software-like margins
      - - Evidence quality
        - Official and filing sources support the company exists, is funded, and is scaling internationally
        - Core underwriting data remain unavailable, and adverse review evidence shows some product/pricing friction
        - Audited financials, retention metrics, and customer-concentration disclosure
    notes: >-
      The anti-thesis is not a prediction of failure. It is the set of facts that currently prevents a
      public-evidence investor from underwriting the present valuation with conviction.
