  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: consolidated-financials
      missingEvidence: Current consolidated management P&L, balance sheet, and cash-flow statement across Belgian, UK, US, and any other entities.
      whyItMatters: Entity-level filing data is insufficient to judge real margin structure, cash usage, and leverage.
      diligencePath: Request monthly consolidated management accounts since February 2025 plus the latest board package.
      relatedQuestionRefs: [QI011, QI012, QI013, QI020]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: ARR bridge, GAAP or management revenue recognition policy, NRR / GRR, customer concentration, and realized pricing by plan.
      whyItMatters: Strong growth headlines can hide weak retention, heavy discounting, or non-recurring revenue.
      diligencePath: Request customer-cohort revenue data, renewal schedules, top-20 account concentration, and plan-by-plan ASPs.
      relatedQuestionRefs: [QI004, QI019, QI020, QI025]
      relatedTableRefs: [TI001, TI002, TI005]
    - type: private-evidence-only
      severity: material
      topic: runway
      missingEvidence: Current cash balance, monthly burn, hiring plan, and downside runway scenario.
      whyItMatters: A recent Series B implies capacity to invest, but not necessarily long-duration cash safety under slower growth.
      diligencePath: Request latest treasury report, monthly burn waterfall, and 12/18/24-month operating scenarios.
      relatedQuestionRefs: [QI016, QI017, QI023]
      relatedTableRefs: [TI004, TI005]
    - type: conflicting-data
      severity: minor
      topic: headcount
      missingEvidence: A single authoritative employee count and quarter-by-quarter headcount bridge for 2025-2026.
      whyItMatters: Headcount is a key denominator for operating leverage and revenue per employee.
      diligencePath: Request current census and quarterly people-rollforward since 2025-01-31.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI004]
    - type: private-evidence-only
      severity: material
      topic: monetization-mix
      missingEvidence: Breakout of recurring software revenue versus partner resale, services, support, and AI-pentest or validation revenue.
      whyItMatters: The public packaging suggests several monetization paths, but investors need to know which ones actually drive gross profit.
      diligencePath: Request revenue ledger by product line and gross margin by product or service family.
      relatedQuestionRefs: [QI001, QI003, QI018, QI021]
      relatedTableRefs: [TI001, TI002, TI003]
