  - id: filing-derived-cost-structure-and-public-scale
    title: Filing-derived cost structure and public scale
    body: |
      The most concrete public financial evidence comes not from management commentary but from registry and filing-derived records. The Belgian Aikido Security BV summary shows that for the fiscal year ended 2025-01-31 the entity reported €18.2 million of assets, €14.7 million of equity, and €3.48 million of liabilities, alongside a negative gross margin of €3.73 million and operating profit of negative €4.43 million. The prior year showed a smaller asset base of €5.65 million and a smaller operating loss of negative €0.86 million. Read literally, that means the reporting entity was still deeply investment mode through early 2025 and that spending ramped materially as the company scaled.

      But investors should not over-read those figures. The Belgian filing summary is entity-level, not a full consolidated management account, and Aikido's public operating footprint now includes a U.K. headquarters label, a U.S. office, and a newly formed U.K. legal entity. Companies House records show AIKIDO SECURITY LTD was incorporated on 2026-04-09, later shortened its accounting period to 2027-01-31, and filed post-incorporation capital documents immediately. That makes the public legal structure more international than the Belgian filing alone suggests. The correct synthesis is that the available filing evidence proves capital buildup and ongoing losses at the core Belgian entity, but does not answer the harder questions on consolidated gross margin, cash efficiency, revenue recognition, or whether pentest and services activity is margin accretive or dilutive at scale.
