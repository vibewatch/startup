company:
  name: Aikido Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Aikido's public financial picture is attractive on growth and capital formation but still thin on underwriteable operating detail. Official and retained third-party sources support a freemium, transparent list-pricing model with enterprise and partner upsells, a $60 million Series B at a $1 billion valuation in January 2026, and total disclosed funding around $85 million. Belgian filing-derived evidence also shows that the founding BV entity was still loss-making through the fiscal year ended 2025-01-31, with €18.2 million of assets and €14.7 million of equity, while external signals suggest ARR moved above $10 million by early 2026 and may have reached $25 million by April 2026. The central diligence conclusion is that Aikido likely has enough capital to keep investing aggressively, but revenue quality, realized pricing, consolidated margins, burn, and runway remain materially opaque.
sections:
  - id: revenue-model-pricing-and-land-motion
    title: Revenue model, pricing, and land motion
    body: |
      Aikido's public monetization model is clearer than its actual financial performance. Official pricing, about, startup, and enterprise pages all point to a deliberate land-and-expand design: a free entry point, transparent list pricing for Basic, Pro, and Advanced tiers, and then a set of enterprise-only upsells such as custom SLA, multi-tenant management, on-prem or local deployment, broker support for internal applications, and premium onboarding or support. SourceForge independently mirrors the same tier structure and confirms a free plan with 2 users and 10 repositories, which makes the product unusually legible for startups and smaller engineering teams compared with many security vendors that force custom sales engagement early.

      That simplicity should not be confused with a pure one-line SaaS SKU. Partner and integration pages imply at least four monetization layers: recurring platform subscriptions, enterprise service packages, partner-led bundled sales through resellers and MSPs, and compliance or pentest-adjacent value capture tied to evidence generation and broader security workflows. The pricing page's AI pentest language suggests a usage-triggered or report-unlock component around offensive validation, but retained public materials do not disclose what percentage of revenue comes from recurring software versus one-off or service-like work. The most reasonable view is therefore a hybrid software-first model with attractive top-of-funnel accessibility and multiple expansion levers, but still no public revenue-mix disclosure robust enough for underwriting.
