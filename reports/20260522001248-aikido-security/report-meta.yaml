companyProfile:
  summary: >
    Aikido Security is a Ghent-founded developer-security platform built around a unified
    code-to-cloud workflow. The product spans SAST, SCA, secrets, IaC, container, cloud,
    API, runtime, reporting, and newer autonomous-pentesting workflows such as Aikido Infinite.
    The company sells through a freemium, transparent-pricing motion and then expands through
    enterprise features, partner channels, compliance-led workflows, and AI pentesting. Public
    customer proof is strongest in software-led teams and portfolio rollouts; public financial
    proof is strongest on funding and growth direction rather than audited operating quality.
  foundedDate: '2022-09-01'
  founders:
    - name: Willem Delbare
      role: Co-founder / CEO & CTO
      background: Serial SaaS founder and primary public product, fundraising, and technical spokesperson.
      claimRefs: []
    - name: Roeland Delrue
      role: Co-founder / COO
      background: Operating co-founder tied to company building, scaling, and execution discipline.
      claimRefs: []
    - name: Felix Garriau
      role: Co-founder / CMO
      background: Category, brand, and go-to-market narrative leader.
      claimRefs: []
  foundingLocation: Ghent, Belgium
  headquarters: Ghent, Belgium / London, United Kingdom
  productSummary: >
    Aikido provides a unified software-security platform covering code, cloud, runtime,
    compliance evidence generation, and AI pentesting. Key public assets include transparent
    SaaS pricing, local scanners and on-prem options, runtime protection via Zen, supply-chain
    protection via Safe Chain and Opengrep, and the Aikido Infinite continuous pentesting flow.
  customerFocus: >
    Primary visible fit is cloud-native software companies, scaleups, enterprise platform teams,
    fintech buyers with audit pressure, agencies/MSPs, and portfolio-style rollouts where many
    repos or developers need lower-noise security embedded into normal engineering workflows.
  businessModel: >
    Freemium and self-service SaaS with published Basic, Pro, and Advanced list prices, then
    enterprise expansion via support, training, multi-tenant management, local deployment,
    partner resale/MSP motions, and AI-pentest or validation-adjacent monetization.
  stage: Late-stage private; Series B in January 2026 at $1B valuation
  fundingStatus: >
    About $85 million of total disclosed capital across seed, Series A, and Series B plus earlier
    convertible financing signals. The latest $60 million Series B was led by DST Global with PSG
    Equity and prior investors participating.
  claimRefs: []

summary:
  headline: >
    Aikido Security is a credible developer-first security platform with strong growth and product
    breadth, but the $1B valuation is ahead of what retained public operating evidence can support.
  overallScore: 6.6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
