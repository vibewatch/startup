company:
  name: Aikido Security
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Aikido Security is a Belgian-founded developer-first software security company that has expanded from an April 2023 launch into a unified code-to-runtime platform with freemium pricing, public customer proof, and fast capital formation. Retained sources support a November 2023 €5 million seed, a May 2024 $17 million Series A, and a January 2026 $60 million Series B at a $1 billion valuation, taking disclosed capital to roughly $85 million. Public traction is strong but not perfectly clean: customer, headcount, and headquarters disclosures vary across sources, board governance remains opaque, and third-party review coverage is still relatively shallow despite generally positive sentiment.
sections:
  - id: identity-footprint-and-product-thesis
    title: Identity, footprint, and product thesis
    body: |
      Aikido Security consistently presents itself as a developer-first unified security platform that connects code, cloud, and runtime security in one workflow. That identity is visible across the official about page, pricing page, press kit, customer stories, and the January 2026 Series B announcement. The company's pitch is not just broad feature coverage; it is that developers should receive fewer but higher-quality security tasks, with triage, remediation, and compliance evidence generation embedded into normal engineering work. The pricing page reinforces that this is a SaaS product with freemium entry, self-service onboarding, and paid expansion into broader platform governance, reporting, and enterprise services.

      Geographic identity requires more care than the usual headline. The press kit says Aikido was founded in Ghent, Belgium, and outside coverage repeatedly describes it as a Ghent-based Belgian startup. At the same time, the official about page currently lists a UK headquarters in London and a U.S. office in Chicago, while the careers page says the company is remote-friendly with a home base in Belgium and open roles across Ghent, London, Chicago, and San Francisco. The right synthesis is that Aikido is clearly Belgian-founded and still Belgium-centered in talent branding, but its current public operating footprint is multi-country and its exact legal headquarters structure is not fully transparent from retained sources.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO027
      - CO041
      - CO042
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance-visibility
    title: Founders, leadership, and governance visibility
    body: |
      Leadership visibility is reasonably strong for a private European cybersecurity company of this age, but governance visibility is still partial. Current official hiring materials identify Willem Delbare as co-founder and CEO/CTO, Roeland Delrue as co-founder and COO, and Felix Garriau as co-founder and CMO. The same page also lists Madeline Lawrence as late co-founder and chief growth officer, alongside commercial leaders such as Thijs Janse and Louis Jonckheere. That gives a clear picture of who drives product, operations, marketing, growth, and U.S. expansion.

      Founder-market fit is one of the more persuasive elements of the overview. Public interviews and funding coverage repeatedly frame Aikido as a product built by former operators frustrated with noisy, fragmented developer-security tools. Delbare's prior company-building experience helps explain the team's speed in product packaging and go-to-market execution. But investors should separate leadership visibility from governance disclosure. Retained public materials identify capital providers and strategic backers, yet they do not provide a clean board roster, committee map, or independent-director structure. For a business now valued at $1 billion, that is a material diligence gap rather than a trivial omission.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO044
    tableRefs:
      - TO002
  - id: capital-formation-traction-and-public-scale
    title: Capital formation, traction, and public scale
    body: |
      Aikido's funding trajectory is unusually compressed. Public seed reporting in November 2023 described a €5 million round co-led by Notion Capital and Connect Ventures, while the company and TechCrunch then documented a $17 million Series A in May 2024 led by Singular with continued support from Notion and Connect. The January 2026 Series B added $60 million led by DST Global, with PSG Equity and prior investors participating, and priced the company at a $1 billion valuation. The official about page now summarizes total capital raised at about $85 million, while BankInfoSecurity reports nearly $85 million across four rounds, implying some form of smaller pre-seed or convertible financing before the formal seed.

      Traction signals are strong but should be normalized carefully. The Series A narrative emphasized 3,000 organizations and 6,000 developers, while the January 2026 company materials shifted to 100,000-plus teams and cited public customers such as the Premier League, Revolut, SoundCloud, and Niantic. Revenue reportedly increased fivefold in 2025 and customer count more than tripled, which is directionally impressive even if the company still does not publish ARR, gross margin, retention, or audited revenue. Review-platform evidence is positive on usability and breadth, but those datasets remain small, so institutional investors should treat them as supporting signal rather than final proof of durable enterprise product-market fit.
