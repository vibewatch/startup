chapter:
  number: 3
  title: Competitors
  summary: >-
    Aikido competes in a crowded code-to-cloud application-security market where buyer alternatives span developer-native AppSec platforms, enterprise-first testing suites, cloud-security and ASPM specialists, DevSecOps platform bundles, and patchworks of open-source or managed-service substitutes. The closest direct peers are Snyk, Semgrep, GitHub Advanced Security, GitLab Ultimate, Veracode, Checkmarx, Orca, Endor Labs, Jit, and Apiiro, but they compete on very different dimensions: price transparency, module breadth, cloud depth, enterprise trust, supply-chain reachability, and native workflow distribution. Aikido’s strongest positioning appears to be breadth-plus-affordability for teams that want one platform and lower alert noise; its main competitive risks are platform bundling by GitHub and GitLab, enterprise depth from Veracode and Checkmarx, and code-to-cloud context leadership from vendors such as Orca, Apiiro, Jit, and Endor Labs.
sections:
  - id: landscape-and-competitive-set
    title: Landscape, peer set, and substitute categories
    body: |
      Aikido's substitute set is broader than a single named rival. The company's own comparison pages identify direct peers across several clusters: developer-first AppSec specialists such as Snyk and Semgrep; platform-native code hosts such as GitHub Advanced Security and GitLab Ultimate; enterprise-first AppSec vendors such as Veracode and Checkmarx; cloud or posture-centric platforms such as Orca, Jit, and Apiiro; and supply-chain-focused vendors such as Mend and Endor Labs. This is the right way to think about competition, because buyers do not compare one-for-one products with identical scope. They compare credible ways to solve the same problem inside their existing stack.

      That broader framing also means the status quo is not just “buy another tool.” Buyers can stick with a patchwork of open-source scanners, depend on platform-native features from GitHub or GitLab, outsource more work to pentesters or consultants, or combine code-only and cloud-only vendors. AppSec Santa’s 2026 alternatives guide reinforces that the decision is often about depth versus simplicity rather than raw scanner count. Aikido’s main competitive advantage is simplicity, price visibility, and bundled coverage. Its main vulnerability is that specialized buyers can rationally choose a narrower but deeper platform.
    claimRefs:
      - CP001
      - CP012
      - CP013
      - CP029
      - CP038
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-pricing-and-strategic-direction
    title: Capability, pricing, and strategic direction
    body: |
      The competitor field breaks into distinct strategic models. Snyk remains a broad developer-first AppSec platform with add-on modules and seat-based pricing. GitHub Advanced Security sells native code and secret protection inside the largest developer workflow in the market. Semgrep competes on developer friendliness, free entry, and a contributor-based model. Veracode and Checkmarx emphasize enterprise-grade platform breadth, governance, and deeper large-account sales motions. Orca, Apiiro, and Jit are stronger examples of context-rich code-to-cloud or ASPM-style positioning, while Endor Labs and Mend push harder on software-supply-chain intelligence and prioritization.

      Price transparency itself is a strategic variable. Aikido publishes simple entry pricing, GitHub publishes active-committer pricing for code and secret protection, Snyk advertises starting plans, and Semgrep openly shows free and paid packaging. By contrast, much of the upper-enterprise field still relies on quote-driven procurement. AppSec Santa’s pricing guide notes how quickly enterprise AppSec stacks can move into the $30,000 to $150,000 annual range and above. That matters because Aikido is trying to win accounts where procurement simplicity and total-cost clarity are part of the product, not just a commercial footnote.
