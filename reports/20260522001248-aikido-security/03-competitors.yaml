  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: win-rates
      missingEvidence: Real win/loss data by competitor, segment, ACV band, and reason code.
      whyItMatters: Public pages explain positioning, but only internal pipeline data can show where Aikido actually beats Snyk, GitHub, Veracode, or Orca.
      diligencePath: Request the past four quarters of competitor-coded win/loss analysis with ACV, segment, and primary loss reason fields.
      relatedQuestionRefs: [QP024]
      relatedTableRefs: [TP004]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Renewal, expansion, and displacement data for accounts using multiple AppSec vendors.
      whyItMatters: Multi-homing may make entry easier for Aikido but also makes long-term moat durability harder to prove without retention data.
      diligencePath: Request gross retention, expansion ARR, and displacement/churn analysis segmented by primary competitor and deployment size.
      relatedQuestionRefs: [QP017, QP024]
    - type: private-evidence-only
      severity: minor
      topic: pricing-realization
      missingEvidence: Realized discounts, packaging exceptions, and competitive takeout pricing versus list-price narratives.
      whyItMatters: Public pricing pages rarely capture how enterprise AppSec deals are actually transacted, which can distort competitive cost conclusions.
      diligencePath: Request recent quote data showing list price, discount rate, module attach, and competitor named in deal notes.
      relatedQuestionRefs: [QP011, QP024]
      relatedTableRefs: [TP003]
