callouts:
  - calloutType: risk
    title: Research-only posture while peers ship products
    body: |
      Three of FA's five closest alternative-architecture peers (Sakana AI, Liquid AI, and Imbue)
      have already deployed commercial products or production models as of mid-2026. FA's deliberate
      avoidance of commercialization — which the founders describe as necessary to maintain research
      focus — means it is accumulating no deployment experience, no customer feedback loops, and no
      revenue to reinvest. If a competitor's alternative architecture reaches production scale before
      FA publishes, FA risks being benchmarked against a peer's deployed system rather than setting
      its own terms.
    claimRefs:
      - CP033
      - CP040
      - CP039
      - CP012

  - calloutType: insight
    title: The GV/Sequoia coalition signals investor alignment, not competitive moat
    body: |
      The participation of GV (co-lead) and Sequoia in FA's seed round is notable not only for the
      capital but for the investor philosophy it represents. The GV post explicitly frames FA as a
      bet against the 'scale orthodoxy' that the same firms have backed in OpenAI, Anthropic, and
      others. This creates an interesting dynamic: FA's investors are hedging across paradigms,
      which validates the contrarian thesis but also means FA's success is not uniquely dependent on
      displacing transformer-based labs — it only needs to produce research outputs valuable enough
      to build a differentiated platform on.
    claimRefs:
      - CP001
      - CP002
      - CP030
      - CP027

