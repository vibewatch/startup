  - id: capability-comparison
    title: Capability Comparison and GTM
    body: |
      Capability comparison is where Flapping Airplanes looks both most interesting and most fragile.
      Its stated bet is that learning from dramatically less data is the real bottleneck, not simply
      reasoning quality or bigger compute clusters. Liquid AI is the closest technical analogue
      because it also argues for architectural change rather than more transformer scaling, but it
      has gone further in translating that bet into deployment claims and device partnerships. Sakana
      AI differs again: its evolutionary approach is less about replacing transformers outright than
      about orchestrating and merging models in ways that create efficiency from composition.
      Imbue, by contrast, has largely accepted mainstream model infrastructure and focused on agentic
      reasoning. Figure FP002 summarizes this spread: Flapping Airplanes scores high on thesis purity
      but low on externally visible capability breadth.

      GTM and packaging expose the biggest near-term disadvantage. TP004 shows that Flapping
      Airplanes has no pricing, no API access, and no developer tier at all. OpenAI, Anthropic, and
      Google DeepMind already offer list pricing, enterprise procurement paths, and broad developer
      familiarity. Liquid AI and Sakana AI sit in between: smaller footprint than frontier labs, but
      enough product surface to generate user feedback, partner learning, and some distribution.
      This matters because application-layer switching costs between transformer APIs are low. If an
      enterprise customer is already multi-homing across OpenAI, Anthropic, and Gemini, a future
      Flapping Airplanes product would not inherit lock-in automatically; it would need to win on
      performance, cost, trust, or a sharply differentiated workflow.

      Trust and regulatory posture also favor incumbents today. OpenAI, Anthropic, and DeepMind have
      public safety narratives, enterprise documentation, and operational histories. Flapping
      Airplanes has none published yet, which is understandable for a pure research lab but still a
      commercial handicap. The implication is that a future Flapping Airplanes launch cannot rely on
      novelty alone. It will need not only a better architecture claim, but a credible packaging and
      trust layer that closes the go-to-market distance between an elegant research result and an
      enterprise-ready product.
