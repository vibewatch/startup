          description: Data-efficient learning thesis; biologically-inspired but not neuromorphic; brain as existence proof
          detail: Company and investor framing centers on learning from much less data than frontier transformer systems without mechanically copying the brain.
        - label: Algorithm Research Layer
          description: Novel training algorithms and learning rules (undisclosed); possibly sparse coding, compressed sensing, or attention mechanism alternatives
          detail: The likely work includes alternative optimization rules, sparse representations, and other learning procedures that could improve sample efficiency.
        - label: Model Architecture Layer
          description: Custom or alternative model architectures (non-transformer or hybrid); architecture search space undisclosed
          detail: No architecture has been published, but the stated thesis implies experimentation beyond straightforward transformer scaling.
