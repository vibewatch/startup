callouts:
  - calloutType: risk
    title: No public technical signal creates due diligence blind spot
    body: |
      Flapping Airplanes has released no papers, no code, no model checkpoints, and no technical documentation as
      of June 2026—approximately five months after announcing a $180M seed round. While this is consistent with a
      deliberate pre-publication research posture, it means that all diligence on FA's technical approach must
      rely on indirect signals: founder backgrounds, investor theses, and analogues from peer labs. The
      ThunderKittens prior work provides meaningful evidence of kernel-level ML engineering ability, but it does
      not validate the data-efficiency thesis itself. Investors should request a technical briefing under NDA to
      assess the state of the core research program before any follow-on decision.
    claimRefs:
      - CE008
      - CE009
      - CE017
      - CE025
      - CE040

  - calloutType: insight
    title: Founder complementarity is the strongest technical signal
    body: |
      The combination of Ben Spector (GPU kernel optimization, Hazy Research ML systems), Asher Spector
      (compressed sensing, sparse signal theory, Stanford Statistics), and Aidan Smith (Neuralink neural
      engineering) represents an unusually well-matched founding team for the data-efficiency problem. Ben
      provides the ML systems execution layer, Asher provides the mathematical substrate (sparsity and efficiency
      theory), and Aidan provides biological neural system grounding. No single background would suffice; the
      combination creates a credible attack surface for the problem. This founder complementarity is the primary
      investable signal at this stage.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE026
      - CE027

