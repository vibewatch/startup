  - id: trust-safety
    title: Trust, Safety, and Compliance Posture
    body: |
      Trust and compliance at Flapping Airplanes must be evaluated in the context of what the company is not yet
      doing. Because FA has not released a model, API, or developer product, it is not yet exposed to the same
      operational safety burden as a deployed frontier model vendor. That partially explains why there is no
      published responsible-AI framework, no model cards, no red-teaming writeups, and no visible governance
      program. The absence is normal for a five-month-old research lab, but it is not strategically neutral. A
      company whose thesis is to discover radically more data-efficient learning methods could move from internal
      experimentation to commercial relevance very quickly if results are strong, and that would compress the time
      available to build privacy, misuse, security, and regulatory processes. Peer labs with product surfaces—most
      notably Anthropic and OpenAI—publish much more around deployment gating and safety methodology even when
      their exact internal workflows remain private. FA currently offers none of those external commitments.

      The right interpretation is not that Flapping Airplanes is presently unsafe, but that its trust stack is
      almost entirely latent. There are no disclosed external data-governance obligations, no evidence of
      compliance certifications, and no reason to assume the company has already implemented internal controls on
      par with more mature labs. That matters for two reasons. First, enterprise or government partners evaluating
      future licensing deals will want assurance that model development, benchmarking, and release processes are
      governed by more than founder judgment. Second, if FA's research agenda succeeds, the first externally
      visible product decision could arrive before a public safety narrative is in place. The dependency map in
      this section makes that sequencing risk explicit: technical success alone does not create deployment
      readiness. Talent, compute, benchmark design, publication, follow-on capital, and eventual governance all
      sit on the critical path between research ambition and monetizable product.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE033
      - CE036
      - CE038
    tableRefs:
      - TE004
    figureRefs:
      - FE003

  - id: developer-ecosystem
    title: Developer Ecosystem and External Signal
    body: |
      Flapping Airplanes has no public developer ecosystem in the conventional sense. There is no API, SDK,
      docs portal, package distribution, public tutorial series, or community forum attributable to the company as
      of June 2026. That makes it impossible to score developer adoption directly, so the only usable signal comes
      from adjacent founder reputation and comparison against peers. In FA's case, the most relevant proxy is
      ThunderKittens: a Hazy Research GPU-kernel library co-authored by Ben Spector that accumulated meaningful
      GitHub community interest. That project should not be mistaken for a Flapping Airplanes asset, but it does
      show that at least one founder has previously shipped technical work that sophisticated ML practitioners
      found valuable enough to star, fork, and discuss. Combined with Ben Spector's published research and the
      founders' Stanford and Neuralink pedigrees, this gives FA a credible recruiting and reputation channel even
      without a company-owned platform.

      The comparison nonetheless cuts against FA on product maturity. Labs such as Liquid AI, Sakana AI, Physical
      Intelligence, Anthropic, and OpenAI already expose at least one public surface—papers, deployed models,
      open-source artifacts, APIs, or trust documentation—that lets developers and partners evaluate technical
      quality from the outside. Flapping Airplanes exposes none of these. Its maturity map is therefore heavily
      skewed toward potential rather than observable capability: strong on founding-team signal and conceptual
      differentiation, near-zero on public artifacts, integrations, and deployment evidence. That does not make
      the company unattractive; it simply means the investment case remains dominated by team quality and thesis
      originality rather than product traction. For diligence, the practical implication is straightforward:
      investors should not infer ecosystem readiness from founder prestige. Until FA publishes either research or a
      developer-facing surface, the ecosystem category remains an intentional blank rather than an emerging moat.
    claimRefs:
      - CE017
      - CE018
      - CE022
      - CE023
