  - id: dev-workflow
    title: Development Workflow and Research Operations
    body: |
      The central product-tech question for Flapping Airplanes is not feature breadth but research execution.
      Public evidence suggests a lab built for multi-year experimentation rather than near-term release. GV's
      investment note and the founders' own media framing imply that the company expects to invent new training
      algorithms and perhaps a custom compute substrate before any commercialization is possible. That places the
      internal workflow, not a customer-facing product, at the heart of technical diligence. Unfortunately, the
      public record is almost silent on that workflow. There is no disclosed codebase architecture, no benchmark
      harness, no release cadence, no staging environment, no paper backlog, and no documentation describing how
      hypotheses are generated, tested, and invalidated. The evidence that does exist points to a likely research
      rhythm: a compact team of elite researchers iterating on algorithmic hypotheses, running large batches of
      experiments on GPU infrastructure, and delaying publication until there is a meaningful result worth
      defending.

      The funding scale changes the interpretation of that silence. A $180 million seed round gives FA time and
      budget to remain pre-product for several years, which reduces pressure to publish quickly but also increases
      the burden on diligence because outside observers cannot distinguish healthy stealth from stalled progress.
      Ben Spector's prior work suggests the lab may be unusually comfortable working close to the hardware and
      kernel layer, while the Prod incubator connection implies that some internal tooling and operational
      scaffolding could have been inherited or adapted from earlier startup-building environments. Even so, every
      concrete workflow milestone after founding remains analyst-constructed rather than company-disclosed: first
      proof-of-concept, first preprint, first external benchmark release, and eventual commercialization are all
      plausible steps, but none has a public date. The operating-flow figure and roadmap table therefore depict a
      likely research pipeline, not a confirmed one, and investors should treat workflow opacity as a primary
      diligence gap rather than a cosmetic issue.
