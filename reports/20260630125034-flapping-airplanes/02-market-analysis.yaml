  - id: sizing-lenses
    title: >-
      Sizing lenses — TAM available from analyst coverage, SAM and SOM not yet isolatable
    body: |-
      The most directly applicable TAM lens is ResearchAndMarkets' Foundation AI Models market estimate: $10.6B globally in 2025 at a 13.2% CAGR, implying approximately $12B in 2026. A second lens — enterprise generative AI — shows faster nominal growth: $4.66B in 2025 at 40.4% CAGR, implying approximately $6.52B in 2026, though this scope more narrowly captures application-layer enterprise spend than foundational research. Taken together, these two lenses bracket the addressable surface as $6.5B–$12B depending on how broadly one draws the buyer boundary.

      Neuromorphic computing provides a third lens relevant to Flapping Airplanes' architectural ambitions. Grand View Research estimates the segment at $5.28B in 2023 with 19.9% CAGR to $20.27B by 2030. Meticulous Research estimates $6.4B in 2025 growing at 16.5% CAGR to approximately $7.5B in 2026 and $35B by 2036. TBRC's narrower AI-in-neuromorphic computing sub-segment is estimated at $2.04B in 2025 growing at 35.1% to $2.76B in 2026. These neuromorphic figures capture enabling-technology demand, not Flapping Airplanes' direct product opportunity, since the company is pursuing data-efficient algorithms rather than neuromorphic hardware.

      Broader generative AI estimates diverge significantly by scope — figures in the fetched corpus range from $29B to over $83B in 2026 depending on whether application-layer, infrastructure, and model-provider revenue are bundled together. These wide ranges reflect definitional inconsistency across analyst firms rather than genuine market uncertainty, and they should be interpreted with that caveat when used in valuation models.

      A data-efficient AI sub-segment SAM cannot be isolated from any of these estimates. No analyst source surveyed in this research had carved out a distinct "data-efficient AI" or "bio-inspired AI" spending category. The SOM for Flapping Airplanes is effectively zero as of June 2026 — the company has no product, no customers, and no disclosed commercial pipeline. Any SAM or SOM model requires assumptions about what share of foundation model training or licensing spend would shift to a data-efficient paradigm, an assumption not supportable from public evidence and therefore reserved for primary diligence.
