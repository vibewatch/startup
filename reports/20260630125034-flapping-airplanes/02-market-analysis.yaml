  - id: TM004
    title: Growth Drivers and Constraints Table
    columns:
      - Driver or Constraint
      - Direction
      - Timing Horizon
      - Implication for Flapping Airplanes
      - Diligence Ask
    rows:
      - - Training data wall (high-quality internet data exhaustion)
        - Growth driver
        - Near-term (1-3 years)
        - Direct justification for data-efficient architecture investment; buyers already facing the constraint
        - Request benchmarks showing data-efficiency advantage versus transformer baseline on same task
      - - Inference cost economics (compute per query at scale)
        - Growth driver
        - Near-term (1-2 years)
        - Efficient models reduce operating cost for buyers with high query volumes; commercially compelling trigger
        - Quantify inference FLOP reduction versus equivalent-accuracy baseline models
      - - EU AI Act and global AI governance frameworks
        - Growth driver (directional)
        - Medium-term (2-4 years)
        - Interpretability and data minimization requirements may favor data-efficient architectures
        - Assess whether regulatory requirements specifically incentivize data-sparse or bio-inspired AI
      - - Venture investment in research-paradigm AI labs
        - Growth driver
        - Near-term (active in 2026)
        - Market validation signal; GV, Sequoia, Index co-investing signals category formation
        - Monitor whether research-paradigm category attracts additional institutional capital post-2026
      - - Open-source foundation model releases (Meta Llama and equivalents)
        - Constraint
        - Active now; worsening within 12-18 months
        - Commoditizes the baseline; any published technique becomes freely available without licensing revenue
        - Assess IP protection strategy, including patents, trade secrets, or closed-weights approach
      - - Scaling law durability (continued capability improvement from scale)
        - Constraint
        - Uncertain; active debate as of 2026
        - If scaling continues to deliver sufficient improvement, urgency of data efficiency paradigm is reduced
        - Request internal analysis of scaling curve versus data-efficient curve on canonical benchmarks
      - - Compute cost per FLOP trend (declining 40-50% annually)
        - Mixed (constraint on differentiation)
        - Ongoing; compresses efficiency advantage over time
        - Brute-force approaches get cheaper annually; data-efficient advantage must compound faster than compute deflation
        - Model financial scenarios where compute cost decline reduces value of efficiency advantage by 2030
      - - Research-to-commercialization timeline risk
        - Constraint
        - Long-term (5-10 year horizon for comparable paradigm shifts)
        - Pre-commercial research labs typically require 5-10 years from breakthrough publication to commercial deployment
        - Assess management's roadmap and investor expectations for first commercial milestone
    notes: >-
      Timing horizons are based on industry context and analyst qualitative signals, not formal
      event-driven schedules. The compute cost constraint row uses a commonly cited industry
      estimate for GPU cost per FLOP; the exact rate varies by architecture generation.
