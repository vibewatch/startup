  - id: buyer-segments
    title: >-
      Buyer and segment map — hyperscalers and enterprise AI teams are the most plausible
      near-term licensees; research labs bridge early adoption
    body: |-
      Primary buyers for foundation AI model capabilities in 2026 fall into five categories with distinct budget ownership and adoption dynamics. Hyperscalers (Google, Microsoft, Amazon, Meta) own the largest AI training budgets and have the strongest incentive to adopt efficiency improvements that reduce compute and operational costs at scale. These buyers are also potential acquirers or strategic investors and have demonstrated pattern of internalizing research lab outputs through partnerships or M&A. Enterprise AI teams — companies that have built internal AI practices but do not train frontier-scale models — represent the broadest market by count, with budget ownership typically split between the CTO and business-unit technology spend. Their adoption trigger is typically inference-cost reduction or model-size constraints for on-premises or privacy-sensitive deployment.

      Government and defense agencies represent a growing buyer segment motivated by AI independence concerns and national security AI investment mandates rather than commercial ROI. Academic and government research labs are likely early-stage adopters through collaboration agreements, co-publication, or licensing of research tools, rather than commercial licensing. Vertical AI builders — companies training domain-specific models for healthcare, legal, or financial services — face similar data constraints to large-scale models but have a more acute data scarcity problem due to smaller proprietary corpora; this segment may represent an underappreciated near-term market.

      IFR reported 38,000 US industrial robot installations in 2025 and 295,000 in China in 2024, suggesting that physical-world AI application deployment is accelerating and would benefit from more data-efficient training for robot perception and control tasks. However, robotics is a second-order opportunity for Flapping Airplanes — not a near-term buyer segment given the pre-commercial stage. Budget ownership for all buyer categories sits with either dedicated AI infrastructure budgets (hyperscalers), R&D and capital expenditure lines (enterprise and government), or research grant and contract budget pools (academic and government labs). The adoption path from research output to commercial contract is uncharted for Flapping Airplanes and represents the highest-uncertainty dimension of the market thesis.
