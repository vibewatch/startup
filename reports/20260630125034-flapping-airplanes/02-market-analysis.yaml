  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: regulatory AI demand signal
      missingEvidence: >-
        No published research had specifically quantified demand for data-efficient or
        interpretable AI driven by EU AI Act compliance requirements as of June 2026;
        the regulatory driver is directional but not yet measurable
      whyItMatters: >-
        If EU AI Act compliance requirements meaningfully accelerate demand for data-efficient
        AI, this could double the growth trajectory versus organic efficiency-economics demand
        alone; the regulatory uplift is not yet baked into any public market sizing
      diligencePath: >-
        Monitor EU AI Act implementing regulations and track enterprise AI compliance
        budgets via Gartner or IDC compliance-spend surveys in 2026-2027
      relatedQuestionRefs: [QM019]

    - type: private-evidence-only
      severity: blocking
      topic: SAM and SOM for data-efficient AI
      missingEvidence: >-
        No public analyst source has isolated a standalone market size for data-efficient AI or
        bio-inspired AI as a commercial category; SAM and SOM cannot be estimated without
        primary commercial pipeline disclosure from the company
      whyItMatters: >-
        Without a defensible SAM, valuation models for Flapping Airplanes must rely entirely on
        the broad foundation models TAM, which overstates the addressable opportunity by including
        competitors operating on the opposite paradigm
      diligencePath: >-
        Request company-authored market sizing model, commercial pipeline list, and any signed
        letters of intent or pilot agreements; commission bespoke analyst research on data-efficiency
        technology adoption among top-20 AI spenders
      relatedQuestionRefs: [QM013, QM025]

    - type: missing-source
      severity: material
      topic: data-efficient AI analyst category
      missingEvidence: >-
        No mainstream analyst firm (Gartner, IDC, Forrester, McKinsey, CB Insights) had published
        a market sizing or adoption forecast specifically for data-efficient AI as of June 2026;
        all relevant sizing must be inferred from adjacent categories
      whyItMatters: >-
        Absence of formal category sizing makes it impossible to independently validate the
        investment thesis from market data alone; the thesis depends on future analyst category
        formation that has not yet occurred
      diligencePath: >-
        Monitor Gartner Hype Cycle for AI additions, IDC AI spending forecast revisions, and
        academic AI efficiency benchmark publication cadence as leading indicators of category
        formation
      relatedQuestionRefs: [QM014]

    - type: private-evidence-only
      severity: material
      topic: commercial customer pipeline
      missingEvidence: >-
        No commercial agreements, pilot customers, letters of intent, or even named organizations
        with expressed interest have been disclosed by Flapping Airplanes as of June 2026; the
        buyer map is entirely hypothetical
      whyItMatters: >-
        Commercial pipeline evidence would substantially de-risk the market adoption thesis;
        absence confirms the company is purely pre-commercial and the buyer demand remains
        unvalidated
      diligencePath: >-
        Request a pipeline document from the founders showing any named organizations that have
        received a research preview, technical briefing, or commercial proposal
      relatedQuestionRefs: [QM013]
      relatedTableRefs: [TM003]

    - type: missing-source
      severity: minor
      topic: scaling law trajectory and data-efficiency comparison benchmarks
      missingEvidence: >-
        No public benchmark comparing data-efficiency of Flapping Airplanes' approach versus
        standard transformer scaling exists as of June 2026; the superiority of the paradigm
        cannot be independently verified from any external source
      whyItMatters: >-
        Without a published benchmark, the adverse risk that scaling law durability supersedes
        the data-efficiency paradigm cannot be quantified; this ambiguity must be resolved
        before any commercial adoption trigger analysis
      diligencePath: >-
        Request internal benchmark results from management showing task performance per training
        token or per training FLOP compared to a transformer baseline on the same dataset
      relatedQuestionRefs: [QM021, QM025]

    - type: conflicting-data
      severity: minor
      topic: generative AI TAM definitional inconsistency
      missingEvidence: >-
        Analyst estimates for the generative AI market in 2026 range from $29B to $83B+
        depending on whether application-layer, infrastructure, and model-provider revenue
        are bundled; no authoritative harmonized definition exists
      whyItMatters: >-
        Using the wrong definitional scope when citing TAM in investor materials or valuation
        models could misrepresent the opportunity by 3-4x; the inconsistency needs to be
        disclosed and the most appropriate scope selected
      diligencePath: >-
        Align on a definitional scope with the company (foundation model training and licensing
        only, or full generative AI stack) before applying any public TAM to a valuation model
      relatedQuestionRefs: [QM024]
      relatedTableRefs: [TM002]
