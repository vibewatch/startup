  topStrengths:
    - 创始背景横跨 Stanford、MIT、Neuralink 和 Prod 创业生态，质量极高；对一家种子期实验室来说，人才密度不同寻常。
    - 投资逻辑瞄准 AI 经济账里的真实结构性瓶颈：数据效率低，训练又重度消耗昂贵算力。
    - GV、Sequoia、Index Ventures 和 Menlo 的支持，意味着公司能接触到强资本和高质量技术网络。
  topRisks:
    - 尽管种子轮估值达到 $1.5 billion，公司没有公开产品、没有收入、没有基准研究，也没有披露商业化时间表。
    - 执行风险集中在三位联合创始人和一支很小的团队；任何核心人员离开或研究失手，都可能打穿投资逻辑。
    - 监管、算力供给和融资周期冲击，可能在研究优先的实验室跑出可商业化突破前就削弱它。
  unresolvedGaps:
    - 仍缺少已发表研究或基准证据，证明仿生学习逻辑能实质提升数据效率。
    - 管理层级别仍看不清烧钱速度、算力承诺、现金跑道，以及下一轮融资需要达到的里程碑。
    - 清晰产品路线图，以及能把研究接到商业部署上的具名设计伙伴或试点证据。
    - 种子轮的治理、董事会构成、IP 归属和优先股堆叠文件。
