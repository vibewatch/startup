  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-data
      missingEvidence: >
        Any evidence of signed customer contracts, pilot agreements, letters of intent, revenue
        bookings, named users, or customer-quoted validation of Flapping Airplanes' technology.
      whyItMatters: >
        Without any customer data, investors cannot evaluate commercial momentum, product-market
        fit, retention durability, or near-term revenue potential; the entire commercial thesis
        rests on research conviction.
      diligencePath: >
        Request CEO confirmation of any commercial discussions or early outreach; review board
        reports, founder communications, and any early-stage LOI register in the diligence data room.

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >
        Private pilot discussions under NDA, undisclosed research collaborators, academic partnership
        agreements, or stealth commercial engagements that have not been publicly announced.
      whyItMatters: >
        Undisclosed partnerships or pilots could indicate more commercial traction than public
        channels reveal — or confirm the complete absence; the enumeration table is limited to
        publicly verifiable proof channels.
      diligencePath: >
        Request a full list of all commercial discussions to date from CEO; ask for any NDA-bound
        research partnership disclosures, pilot agreements, or early-customer outreach logs in data room.
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: commercialization-pathway
      missingEvidence: >
        Any stated API pricing model, licensing fee structure, term-sheet framework, or specific
        commercialization timeline for Flapping Airplanes' eventual revenue model.
      whyItMatters: >
        Without a pricing or commercialization model, investors cannot model future revenue
        scenarios, unit economics, or capital requirements to reach first-revenue milestone.
      diligencePath: >
        Request any early-stage pricing deck, commercial scenario model, or use-of-funds memo
        from CEO before Series A; identify whether any internal pricing work has been done.
      relatedQuestionRefs:
        - QU011

    - type: private-evidence-only
      severity: material
      topic: commercialization-roadmap
      missingEvidence: >
        Any internal milestone-based commercialization roadmap, board-approved go-to-market plan,
        or defined research breakthrough that would trigger the shift from research to commercial mode.
      whyItMatters: >
        Without a commercialization roadmap, investors cannot assess whether the $180M seed
        capital will last until a commercially deployable milestone is reached, or whether a
        bridge round will be required before demonstrating customer traction.
      diligencePath: >
        Request board-approved strategy deck, use-of-funds memo, and any research-to-commercialization
        plan from CEO; cross-reference with estimated burn rate to assess runway vs. milestone gap.
      relatedQuestionRefs:
        - QU022

    - type: missing-source
      severity: minor
      topic: expansion-dynamics
      missingEvidence: >
        Any product roadmap, account-management framework, or expansion playbook for converting
        initial research partners into multi-team enterprise contracts with land-and-expand NRR.
      whyItMatters: >
        Long-term valuation depends on an expansion model that does not yet exist; the NRR upside
        case is fully hypothetical and cannot be stress-tested without product or go-to-market
        architecture.
      diligencePath: >
        Request any product or commercial roadmap, expansion scenario model, or indicative
        account structure from CEO or incoming Head of Business Development.
