callouts:
  - calloutType: risk
    title: Pre-Commercial Stage Creates Total Customer-Proof Gap
    body: >
      Flapping Airplanes' deliberate deferral of commercialization means that no customer
      traction, product-market fit evidence, retention data, or pipeline signal can be
      evaluated by investors today. The $180M seed capital was raised entirely on research
      conviction, not commercial momentum. The risk is that the research program takes
      longer than expected, or produces results that are technically valid but not commercially
      deployable, in which case the company would need a Series A before demonstrating any
      customer proof — at which point investor expectations and market conditions will have
      evolved significantly from the current research-lab narrative.
    claimRefs:
      - CU005
      - CU006
      - CU034

  - calloutType: strength
    title: Large and Growing TAM Across All Target Verticals
    body: >
      The macro opportunity for Flapping Airplanes is substantial. The enterprise generative AI
      market is projected to grow at 35%+ CAGR through 2030 (Grand View Research), with AI
      infrastructure spending exceeding $200 billion globally by 2027 (IDC). The three primary
      target verticals — robotics (553,000 unit installations in 2023 per IFR), pharma/drug
      discovery (acute labeled-data scarcity), and enterprise AI (large budgets) — collectively
      represent a multi-hundred-billion-dollar opportunity if the research delivers a commercially
      deployable data-efficiency advantage.
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU011
      - CU038

  - calloutType: recommendation
    title: Define a Commercialization-Readiness Milestone Before Series A
    body: >
      Investors evaluating a Series A should require a clear statement of the minimum viable
      research output that would trigger commercialization, a commercialization timeline, and
      a data-room commitment to first cohort retention and expansion data within 12 months of
      the first signed contract. Without these diligence anchors, the Series A will be valued
      on research conviction alone — with no customer proof gate and no mechanism to distinguish
      between a lab that is still genuinely pre-commercial and one that has quietly failed to
      attract early customers.
    claimRefs:
      - CU018
      - CU025
      - CU026

