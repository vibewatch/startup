  - id: concentration-risk-and-expansion-dynamics
    title: Concentration Risk and Expansion Dynamics
    body: >
      Flapping Airplanes' complete absence of customers means that customer concentration cannot
      be measured today but must be modeled forward to the first-commercial milestone. Historical
      patterns for deep-tech AI research labs transitioning to commercialization show that a single
      anchor customer — typically a large enterprise, a pharma company, or a government agency —
      creates 100% revenue concentration at day one. This creates extraordinary fragility: the
      loss of a single pilot partner, a shift in customer procurement priorities, or a key personnel
      change at the customer could reset commercial momentum entirely.

      At 2–3 customers, concentration remains extreme. Early AI infrastructure companies such as
      Cohere (circa 2022) and comparable research-derived API providers showed top-3 customer
      revenue concentration in the 60–80% range during their first commercial year. Meaningful
      diversification typically requires 10+ paying customers across 3+ distinct verticals, a
      threshold that likely lies 3–5 years beyond first deployment for a research-first company
      that has not yet started outbound sales.

      Government contracts from DARPA, NSF, DIU, or DOE could serve as anchor revenue with
      non-dilutive capital characteristics, but they introduce budget-cycle dependency risk: a single
      congressional appropriations decision could eliminate the largest customer with zero notice,
      as occurred with multiple defense AI contract companies in 2022–2023. Ben Spector's Hertz
      Foundation fellowship signals academic credibility relevant to government research procurement,
      but no grant or contract has been disclosed.

      The expansion model is conceptually attractive — a data-efficient training approach could
      scale from a single project to a platform used by multiple teams within the same enterprise —
      but no expansion data, account management function, or land-and-expand track record exists
      to validate this thesis. Enterprise IT budget surveys indicate that 25–30% of CIOs plan to
      defer new AI platform decisions in 2026 amid economic uncertainty, creating additional timing
      risk. The full expansion story is speculative and contingent on research breakthroughs not
      yet announced.
