  - id: named-customer-proof-and-absence
    title: Named Customer Proof and Absence Documentation
    body: >
      As of June 2026, Flapping Airplanes has zero publicly documented customers, named pilots,
      or paying users of any kind. The proof of absence is comprehensive and multi-channel.
      The company's research page (flappingairplanes.com/research) contains no customer list, no
      case-study page, no testimonial, and no named partner. A search of Gartner Peer Insights in
      the Large Language Model Technology market category returned no vendor listing and no reviews.
      G2's product directory likewise returned no listing and no user reviews — consistent with a
      company that has never shipped software to external users.

      A full scan of press coverage from inception (January 2026) through the run date — including
      Reuters, The Wall Street Journal, TechCrunch (January 29, February 16, March 15 articles),
      Axios, VentureBeat, and Wired — found no named customer, no customer-quoted testimony, and no
      announcement of a pilot deployment. Investment posts from GV, Sequoia, Index Ventures, and
      Menlo VC, which are typically the most likely venue for early named-customer proof in venture
      narratives, similarly contain no customer reference.

      This is not inadvertent pre-commercial status but a deliberate strategy. Co-founder Asher
      Spector stated explicitly: "if we start by signing big enterprise contracts, we're going to get
      distracted." AI researcher Gary Marcus has publicly questioned whether data-efficiency claims
      will attract enterprise customers without demonstrated production benchmarks. No third-party
      review platform, analyst note, or procurement database corroborates any customer engagement
      as of the run date. No co-authored enterprise preprint has been published on arXiv or similar
      databases through June 2026. No letter of intent, memorandum of understanding, or formal
      research-partnership agreement appears in any regulatory, press, or investor filing.
