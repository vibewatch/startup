  - id: retention-satisfaction-and-nrr-proxies
    title: Retention, Satisfaction, and NRR Proxies
    body: >
      Because Flapping Airplanes has no customers as of June 2026, no retention data, net revenue
      retention (NRR), gross revenue retention (GRR), churn rate, contract length, satisfaction
      score, or cohort metric can be established. The customer durability section is entirely
      prospective, anchored by industry proxy benchmarks from structurally comparable AI
      infrastructure and foundation-model companies.

      Enterprise AI data platform companies with high workload stickiness — specifically Databricks
      and Snowflake — have demonstrated NRR rates in the 128–145% range in their growth phases,
      driven by expansion as data workloads grow. These represent the best-case NRR scenario for
      any AI infrastructure product that becomes critical to an enterprise production stack.

      Foundation-model API providers at earlier commercial stages (Cohere, Mistral) show
      analyst-estimated NRR in the 110–120% range, with lower expansion premiums due to
      commoditization pressure from open-source alternatives. Developer and open-source tooling
      platforms (Hugging Face) show lower effective retention in the 80–90% range, reflecting
      high churn in the free tier and limited expansion incentives. Research-license contracts at
      universities and enterprise R&D labs typically achieve 75–90% logo retention, with renewal
      decisions driven by publication productivity and lab-budget cycles rather than business-value
      ROI.

      For investors evaluating Flapping Airplanes, the retention analysis is binary at this stage:
      no diligence is possible until the first contract is signed. The retention proxy benchmarks
      establish a reference range — roughly 75–145% NRR depending on the eventual product
      architecture and target segment — but all estimates are speculative until first cohort data
      is available. The diligence path requires requesting the first cohort renewal and expansion
      metrics from the CEO within 12 months of initial contract signing at the Series A stage.
