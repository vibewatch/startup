  - id: mitigations-monitoring
    title: Mitigations, Kill Criteria, and Monitoring
    body: >-
      Flapping Airplanes' management has publicly acknowledged the core risks. Ben Spector stated that radical
      research "probably fails on the first run" and is cheaper than incremental work, framing early failure as
      expected and recoverable. Aidan Smith acknowledged that "sometimes radically different things are just worse
      than the paradigm." These self-assessments indicate founder awareness, but no formal risk management
      framework, board-level risk committee, or incident response structure has been publicly disclosed.

      Investor structural mitigations include top-tier institutional backing from GV, Sequoia, Index, and Menlo
      Ventures, whose reputational capital and board seats provide governance support. NIST's voluntary AI Risk
      Management Framework is available to the company at no cost, but adoption has not been confirmed. The EO
      14110 rescission in January 2025 removed mandatory federal AI safety guidance, leaving voluntary frameworks
      as the primary governance reference.

      Thesis-break triggers that diligence should monitor include: (1) failure to publish a validated preprint
      within 18 months establishing data-efficiency metrics; (2) any co-founder departure; (3) confirmed government
      model-release restriction orders applied to Flapping Airplanes specifically; (4) AI compute costs escalating
      beyond the company's stated budget assumptions before a breakthrough; and (5) a comparable neolab publishing
      equivalent results from a publicly available approach before Flapping Airplanes.
    claimRefs:
      - CR012
      - CR013
      - CR030
      - CR044
      - CR042
    tableRefs:
      - TR005
    figureRefs:
      - FR002
      - FR003

