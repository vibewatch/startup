company:
  name: Flapping Airplanes
chapter:
  number: 7
  title: Risks
  summary: >-
    Flapping Airplanes carries critical execution, regulatory, and commercialization risk as a seed-stage
    research-first AI lab with no products, no revenue, and an unproven bio-inspired paradigm. The highest-severity
    near-term risks are compute concentration, key-person dependency across three co-founders, evolving US and EU
    AI regulation including active government model-release restrictions precedents established in June 2026, and
    the structural inability to raise a Series A without demonstrable technical milestones. No known litigation or
    regulatory enforcement action against the company has been publicly reported, but the absence of published
    research, public controls, and certifications creates material diligence gaps.

sections:
  - id: regulatory-legal
    title: Regulatory and Legal Risk Landscape
    body: >-
      Flapping Airplanes operates in the most fluid AI regulatory environment on record. In the United States,
      the Copyright Office released a pre-publication Part 3 report in May 2025 analyzing whether training AI
      models on copyrighted works without permission qualifies as fair use; no binding legal determination exists,
      leaving every US AI lab exposed to rights-holder litigation. The EU AI Act, which entered into force June 2024,
      requires providers of general-purpose AI systems to publish summaries of copyrighted training data and comply
      with transparency obligations applicable approximately 12 months after entry into force. Bio-inspired research
      involving training on biological or publicly available data may carry distinct provenance questions not yet
      resolved by regulators.

      BIS Export Administration Regulations require export licenses for advanced computing items destined for
      Country Group D:5 countries or Macau, including for entities outside those geographies with parent companies
      headquartered there. Flapping Airplanes' international research hiring—recruiting from MIT, Stanford, and
      Harvard—raises the possibility of inadvertent export-control exposure. Executive Order 14110 on AI governance
      was rescinded January 20, 2025, removing prior federal safety reporting requirements and creating policy
      uncertainty.

      Most critically, in June 2026 the Trump administration directed OpenAI to delay deployment of GPT-5.6 and
      directed Anthropic to suspend its Fable 5 and Mythos 5 models for government security review. This precedent
      establishes that government agencies can restrict AI model releases before commercialization. Venture capitalist
      Paul Kedrosky characterized these restrictions as "hugely bearish" for AI lab valuations. No litigation or
      enforcement action against Flapping Airplanes has been publicly reported as of the runDate, but the absence
      of legal counsel disclosures and no public certifications is itself a diligence gap.
    claimRefs:
      - CR001
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
