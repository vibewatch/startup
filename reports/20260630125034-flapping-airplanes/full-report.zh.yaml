  - id: FR001
    title: 风险严重度热力图
    type: matrix
    layout: standard
    summary: Flapping Airplanes 面临的主要风险按发生可能性与影响矩阵呈现，并按严重度层级组织。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 罕见
          values:
            - 监管合规（GDPR、CCPA，商业化前）
            - AI 版权诉讼（行业性，非公司特定）
            - 计算资源不可用或 GPU 价格飙升
        - label: 不太可能
          values:
            - 轻微治理结构缺口
            - 融资市场环境收紧
            - 研究范式产不出可验证结果
        - label: 可能
          values:
            - 学术合作中断
            - 前雇主协议引发 IP 争议
            - 关键研究员流失至 Big Tech
        - label: 较可能
          values:
            - 开源工具许可证变化
            - Series A 阶段投资人情绪转向
            - 政府模型发布限制（2026 年 6 月先例）
        - label: 几乎确定
          values:
            - 出口管制合规缺口（轻微）
            - 训练数据溯源挑战
            - 三位联合创始人任一离职
    approximationNotes: 可能性分层（按行排列，从顶部“罕见”到底部“近乎必然”）和影响评级均为定性判断，依据截至 2026 年 6 月可取得的公开证据及可比新型 AI 实验室先例。
    claimRefs:
      - CR011
      - CR016
      - CR020
      - CR026
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心风险如何层层传导，最终拖累融资、延缓商业化，甚至触发投资假设破裂事件。
    data:
      nodes:
        - id: compute_dep
          label: 算力依赖（集中度）
        - id: ip_risk
          label: 训练数据 IP 风险（未解决）
        - id: gov_restrict
          label: 政府模型发布限制
        - id: talent_risk
          label: 人才集中（三位联合创始人）
        - id: research_progress
          label: 研究进展风险（无论文发表）
        - id: investor_sentiment
          label: 新型 AI 实验室投资者情绪
        - id: fundraising_risk
          label: Series A 融资风险
        - id: thesis_break
          label: 投资假设破裂事件
      edges:
        - from: compute_dep
          to: fundraising_risk
        - from: ip_risk
          to: thesis_break
        - from: gov_restrict
          to: thesis_break
        - from: talent_risk
          to: research_progress
        - from: research_progress
          to: fundraising_risk
        - from: investor_sentiment
          to: fundraising_risk
        - from: fundraising_risk
          to: thesis_break
        - from: gov_restrict
          to: fundraising_risk
    approximationNotes: 传导箭头表示潜在因果路径；实际传导概率取决于每个触发事件的强度。
    claimRefs:
      - CR016
      - CR019
      - CR022
      - CR044
  - id: FR003
    title: 关键依赖图
    type: dag
    layout: standard
    summary: Flapping Airplanes 的研究运转与生存所依赖的主要外部资源。
    data:
      nodes:
