      - number: '7.4'
        title: 人员、执行与集中风险
        blocks:
          - type: paragraph
            body: >-
              公司的全部竞争优势都押在三位联合创始人身上。Ben Spector（CEO，Stanford PhD，师从 Chris Ré，创办 Prod 孵化器，孵化 Cursor、Mercor、Etched 和
              Decart，合计估值超过 $50B）被 GV 描述为人才吸引网络的核心，也被 Index Ventures 称为“提高身边每个人雄心”的人。Asher Spector（Stanford Statistics
              PhD，前北美辩论冠军）提供分析严谨性。Aidan Smith（Thiel Fellow，在 Georgia Tech 就读期间于 Neuralink 工作三年）负责生物启发研究架构。任何联合创始人离开——尤其是
              Ben Spector——都会是负面事件，而公司没有披露继任计划。

              Finance and Money 报道称，由前 OpenAI 高管 Mira Murati 共同创办的可比新型 AI 实验室 Thinking Machines Lab，有数名创始研究员流向 OpenAI 和
              Meta——这说明 Big Tech 的人才挖角压力是小型 AI 研究实验室面临的现实结构性风险。Flapping
              的非常规招聘模型（高中生、数学奥林匹克选手、没有标准资历的研究者）带来差异化，但当更常规的职业路径向优秀研究者打开时，也可能造成留任不确定性。没有公开披露股权结构、vesting 安排或留任框架。
