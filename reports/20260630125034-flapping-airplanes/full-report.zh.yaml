              的产品目录同样没有列表和用户评论——这与一家从未向外部用户交付软件的公司相符。

              从成立（2026 年 1 月）到运行日，对媒体报道进行全量扫描——包括 Reuters、The Wall Street Journal、TechCrunch（1 月 29 日、2 月 16 日、3 月 15
              日文章）、Axios、VentureBeat 和 Wired——没有发现具名客户、客户引用证词或试点部署公告。GV、Sequoia、Index Ventures 和 Menlo VC
              的投资文章通常最可能承载风投叙事中的早期具名客户证据，但这些文章同样没有客户引用。

              这不是无意造成的商业化前状态，而是有意策略。联合创始人 Asher Spector 明确表示：“如果我们一开始就签大型企业合同，就会分心。”AI 研究员 Gary Marcus
              公开质疑，在没有生产基准证明的情况下，数据效率主张能否吸引企业客户。截至运行日，没有第三方评论平台、分析师报告或采购数据库佐证任何客户接触。到 2026 年 6 月，arXiv
              或类似数据库也没有发布任何与企业共同署名的预印本。任何监管文件、新闻稿或投资人文件中，也没有出现意向书、谅解备忘录或正式研究合作协议。
