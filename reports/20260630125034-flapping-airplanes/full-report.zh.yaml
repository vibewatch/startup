chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品定位
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 是一家基础人工智能研究实验室，总部位于 California 州 San Francisco。公司创立于 2025 年，并在 2026 年 1 月 28–29
              日公开亮相，同时宣布 $180 million 种子轮。它的官方使命是开发能达到人类水平能力、同时训练数据消耗比当前前沿模型低几个数量级的 AI 系统；创始人把这个目标称为解决“数据效率问题”。


              公司名称有意释放一个哲学信号：早期航空先驱试图拍打机翼模仿鸟类，最终失败；真正的飞行来自理解底层物理，并造出结构不同的解法。Ben Spector 把当前 AI 范式比作拍翼路线，把 Flapping
              Airplanes 描述为在智能领域寻找等同于固定翼翼型的突破。研究议程因此不是模仿大脑，而是从大脑获得启发：Aidan Smith 在 Neuralink 工作三年，他把大脑称为“存在性证明”，说明
              Transformer + 梯度下降之外还有算法。


              截至 2026 年 6 月，Flapping Airplanes 尚未发布商业产品、模型权重、API 或公开基准结果。Asher Spector 在 2026 年 2
              月承认，公司无法给出商业化时间表，因为基础研究目标必须先行。已募资本主要投向算力，以支撑长周期实验工作；创始人估计，有前景的想法可能需要 5–10 年成熟。公司公开了研究者联系邮箱
              hi@flappingairplanes.com 和一个 Hugging Face 组织页，但两处技术内容都很少。
