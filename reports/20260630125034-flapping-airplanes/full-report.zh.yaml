        - 关键人集中意味着团队完整性假设破裂；论点取决于三人都在
        - 按前轮估值 40–60% 折价重新评估；谈判强化治理条款
      - - 里程碑前资本耗尽
        - 在可展示的研究里程碑或 Series B 交割前，消耗资金超过 $180M
        - 资本效率假设破裂；$1.5B 入场价失去执行信号支撑
        - 讨论桥接融资或关停；探索人才收购
      - - 政府算力限制
        - BIS、行政令或盟国对影响美国实验室的前沿 AI 算力进口或出口作出限制
        - GPU 获取受限威胁研究连续性；算力论点破裂
        - 法律审查合规路径；按受限访问调整估值
      - - Series B 失败
        - 到 2027 年 Q4 无法以 ≥$3B 估值完成 Series B 融资
        - 市场对研究进展的验证消失；种子投资者无法推动估值递进
        - 准备人才收购路径；为跟投谈判优先条款
    notes: 触发条件并不穷尽；每一项都应结合当时市场环境评估。
    claimRefs:
      - CV025
      - CV033
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 研究管线
        - 截至 2026 年 6 月，未公开发布任何同行评审论文、arXiv 预印本或内部白皮书
        - 全部 $1.5B 估值都押在一个未经验证的科学范式上；没有公开工作就无法建立客观基准
        - 任何跟投承诺前，创始人需提供预印本或内部研究白皮书
      - - 烧钱速度与资金续航
        - 算力支出计划和明确资金续航计算未公开披露
        - $180M 按每次训练 $50–200M 计算，只够 1–3 次实验；没有烧钱数据，就无法判断到 Series B 的时间线
        - 要求开放投资者资料室；与 CFO 或财务主管通话，确认每月算力分配
      - - IP 归属与前雇主协议
        - 未识别到已提交专利；Neuralink 和 Prod 相关前雇主 IP 清理未确认
        - 如果仿生研究借用了前雇主 IP，诉讼风险升高；防御性也会受影响
        - 外部 IP 律师审查三位联合创始人的雇佣协议
      - - 产品路线图
        - 未公开宣布商业产品路线图、设计伙伴名单或首个产品里程碑
        - 没有明确计划，研究到收入的路径完全是推测
        - 要求创始人提供桥接文件，说明从研究到产品的路径和目标垂直领域
      - - 公司治理
        - 董事会构成、正式治理结构、审计师或投资人席位条款均未公开披露
        - 11 人公司没有正式董事会，会放大少数投资人的治理风险
        - 审查投资条款清单或认购协议中的董事席位条款、观察员权利和保护性条款
      - - 团队留任
        - 股权归属安排、雇佣协议条款或留任计划均未公开
        - 任何联合创始人在 Series B 前离开，都会实质削弱投资论点和投资人地位
        - 要求所有联合创始人采用标准四年股权归属安排，并确认悬崖期
    notes: 尽调问题基于截至 2026-06-30 的公开信息缺口。
    claimRefs:
      - CV039
      - CV040
      - CV042
