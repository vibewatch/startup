      - number: '6.4'
        title: 留存、满意度与 NRR 代理指标
        blocks:
          - type: paragraph
            body: >
              因为截至 2026 年 6 月 Flapping Airplanes 没有客户，留存数据、净收入留存（NRR）、总收入留存（GRR）、流失率、合同期限、满意度评分或 cohort
              指标都无法建立。客户耐久性这一节完全是前瞻性的，锚点来自结构上可比的 AI 基础设施和基础模型公司的行业代理基准。

              工作负载粘性高的企业 AI 数据平台公司——尤其是 Databricks 和 Snowflake——在增长阶段展示过 128–145% 区间的 NRR，扩张由数据工作负载增长驱动。对任何成为企业生产栈关键环节的
              AI 基础设施产品来说，这是最优 NRR 情景。

              商业化较早期的基础模型 API 提供商（Cohere、Mistral）显示的分析师估算 NRR 在 110–120% 区间；开源替代带来的商品化压力压低了扩张溢价。开发者和开源工具平台（Hugging
              Face）的有效留存更低，约 80–90%，反映免费层高流失和扩张激励有限。大学和企业研发实验室的研究许可证合同通常实现 75–90% 的 logo
              留存，续约决策更多由发表产出和实验室预算周期驱动，而不是商业价值 ROI。

              对评估 Flapping Airplanes 的投资人来说，现阶段留存分析是二元的：首份合同签署前无法做尽调。留存代理基准建立了一个参考区间——取决于最终产品架构和目标客群，NRR 大约
              75–145%——但在首批 cohort 数据出现之前，所有估计都只是推测。尽调路径要求，在 A 轮阶段首份合同签署后 12 个月内，向 CEO 索取首批 cohort 的续约和扩张指标。
