      - number: '8.5'
        title: 建议、退出就绪度与最终尽调
        blocks:
          - type: paragraph
            body: >
              建议为继续研究。鉴于截至 2026 年 6 月公司零收入、零已发表研究且没有商业产品，标准财务框架无法支撑 $1.5B 种子估值。不过，团队质量和投资人背书异常强，科学论点一旦验证，可能代表 AI
              模型效率的阶跃式改善。因此，Flapping Airplanes 应进入潜在跟投观察名单，而不是在当前价格下坚定买入。

              退出就绪度低。公司尚未提交 S-1，没有披露上市时间表，商业开发仍处在最早阶段。考虑到团队水准，大型 AI 实验室（Google DeepMind、Anthropic、Meta
              AI）的战略收购兴趣是合理可能，但对零产品实体，人才收购估值通常远低于 $1.5B。若要以高于进入价格的完整退出溢价退出，需要 $3B+ 估值的 Series B 和商业验证。

              任何后续参与前的优先尽调事项：（1）发表论文或预印本，在基准任务上证明生物启发学习范式；（2）获取数据室访问权限，查看算力支出计划和资金跑道测算；（3）IP
              归属分析，包括前雇主协议和任何已提交临时专利；（4）清晰产品路线图，连接研究和商业部署；（5）董事会构成和正式治理结构，包括投资人代表。在这些事项解决前，以 $1.5B
              进入的风险调整后回报无法证明这种二元结果画像合理。

              必须按季度监控论点破裂触发器：任何联合创始人离开、24 个月内未发表，或到 2027 年 Q4 无法融资 Series B，都应被视为终止标准。
