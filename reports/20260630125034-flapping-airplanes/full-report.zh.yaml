          stage: Pilot
          note: |
            共同设计有限测试部署；可能涉及 NDA、技术协作和数据共享协议。
        - id: pilot-validation
          label: 试点结果验证
          stage: Conversion
          note: |
            伙伴在专有数据上评估模型表现；如果相对基线展现可衡量提升，伙伴会考虑商业合同。
        - id: first-contract
          label: 首个商业合同
          stage: Revenue
          note: |
            签署授权、API 访问或定制模型协议；首个收入事件出现，NRR 计时开始；留存和扩张指标变得可衡量。
        - id: expansion
          label: 企业多团队扩张
          stage: Growth
          note: |
            同一企业内部新增用例、团队或地域；扩张 NRR 累积；Flapping Airplanes 嵌入生产工作负载。
    claimRefs:
      - CU005
      - CU018
      - CU025
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: |
      截至 2026 年 6 月，从发现到签约客户的漏斗；由于公司仍处于商业化前状态，初始认知以下所有阶段均为零量。
    data:
      items:
        - label: 存在 AI 训练数据稀缺的可触达企业（TAM 估算）
          value: 18500
          note: Grand View Research 和 IDC TAM 代理；包括机器人 OEM、制药、企业 AI、政府实验室
        - label: 知晓 Flapping Airplanes 的组织（媒体触达代理）
          value: 1200
          note: 基于 Reuters / TechCrunch / WSJ 对可比种子期 AI 实验室的读者覆盖模式估算
        - label: 正在积极跟踪研究成果的技术评估者
          value: 200
          note: 代理值来自类似研究实验室发布后 6 个月阶段的学术引用和报道互动
        - label: 处于活跃试点讨论或 RFP 阶段的组织
          value: 0
          note: 截至 2026 年 Q2，没有活跃 GTM 项目，也未披露任何已确认试点讨论
        - label: 已签约付费客户
          value: 0
          note: 商业化前阶段；任何公开来源、监管文件或第三方目录都未确认客户，客户数为零
    claimRefs:
