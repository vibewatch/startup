      - number: '2.2'
        title: 测算口径——TAM 可借分析师覆盖，SAM 和 SOM 尚无法剥离
        blocks:
          - type: paragraph
            body: >-
              最直接可用的 TAM 口径，是 ResearchAndMarkets 对基础 AI 模型市场的估计：2025 年全球规模 $10.6B，CAGR 13.2%，意味着 2026 年约
              $12B。第二个口径是企业生成式 AI，名义增速更快：2025 年 $4.66B，CAGR 40.4%，意味着 2026 年约
              $6.52B；但这一范围比基础研究更窄，更多捕捉应用层企业支出。合并来看，两种口径把可触达市场夹在 $6.5B–$12B 之间，取决于买方边界画得多宽。


              类脑计算提供了第三个口径，与 Flapping Airplanes 的架构野心有关。Grand View Research 估计该领域 2023 年规模为 $5.28B，并以 19.9% CAGR 增至 2030
              年 $20.27B。Meticulous Research 估计 2025 年为 $6.4B，并以 16.5% CAGR 增至 2026 年约 $7.5B、2036 年 $35B。TBRC 更窄的类脑计算中 AI
              子领域，估计 2025 年为 $2.04B，并以 35.1% 增至 2026 年 $2.76B。这些类脑计算数字捕捉的是使能技术需求，不是 Flapping Airplanes
              的直接产品机会，因为公司追求的是数据高效算法，而非类脑硬件。


              更宽泛的生成式 AI 估计，会因口径不同而大幅分化——所抓取材料中的 2026 年数字从 $29B 到超过 $83B
              不等，取决于是否把应用层、基础设施和模型提供商收入打包。宽区间反映的是分析机构定义不一致，而不是真实市场不确定性；在估值模型中使用时，应带着这一限制解读。


              数据高效 AI 子领域的 SAM 不能从上述任何估计中剥离出来。本研究覆盖的分析师来源，没有一家把“数据高效 AI”或“生物启发 AI”划为独立支出品类。截至 2026 年 6 月，Flapping
              Airplanes 的 SOM 实际为零——公司没有产品、没有客户，也没有披露商业管线。任何 SAM 或 SOM
              模型，都必须假设基础模型训练或授权支出中有多少会转向数据高效范式；这一假设无法由公开证据支撑，因此应留给一手尽调。
