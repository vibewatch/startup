  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险版图
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes 处在有记录以来变化最剧烈的 AI 监管环境中。在美国，Copyright Office 于 2025 年 5 月发布了预出版的 Part 3
              报告，分析未经许可使用受版权保护作品训练 AI 模型是否构成合理使用；目前没有有约束力的法律结论，使每一家美国 AI 实验室都暴露在权利人诉讼之下。2024 年 6 月生效的 EU AI Act 要求通用 AI
              系统提供商发布受版权保护训练数据的摘要，并遵守大约在生效 12 个月后适用的透明度义务。涉及用生物数据或公开可用数据训练的生物启发研究，可能带来监管尚未解决的独特数据来源问题。

              BIS Export Administration Regulations 要求，面向 Country Group D:5
              国家或澳门的先进计算物项必须取得出口许可证；即便实体位于其他地区，只要母公司总部在上述地区，也包含在内。Flapping Airplanes 的国际研究招聘——从 MIT、Stanford 和 Harvard
              招人——带来无意触发出口管制的可能。关于 AI 治理的 Executive Order 14110 已于 2025 年 1 月 20 日被撤销，移除了此前的联邦安全报告要求，也制造了政策不确定性。

              最关键的是，2026 年 6 月，Trump 政府要求 OpenAI 推迟部署 GPT-5.6，并要求 Anthropic 暂停其 Fable 5 和 Mythos 5
              模型，接受政府安全审查。这个先例表明，政府机构可以在商业化前限制 AI 模型发布。风投 Paul Kedrosky 将这些限制称为对 AI 实验室估值“极度利空”。截至运行日，没有公开报道显示 Flapping
              Airplanes 遭遇诉讼或执法行动，但缺少法律顾问披露、也没有公开认证，本身就是尽调缺口。
