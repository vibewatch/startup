      - number: '6.5'
        title: 集中度风险与扩张动态
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 完全没有客户，这意味着今天无法衡量客户集中度，但必须向前建模到首个商业化里程碑。深科技 AI
              研究实验室走向商业化的历史模式显示，单一锚定客户——通常是大型企业、药企或政府机构——会在第一天形成 100%
              收入集中度。这带来极高脆弱性：失去一个试点合作方、客户采购优先级变化，或客户关键人员变动，都可能把商业动能彻底清零。

              到 2–3 个客户时，集中度仍然极端。Cohere（约 2022 年）等早期 AI 基础设施公司，以及类似研究衍生 API 提供商，在首个商业年份的前三大客户收入集中度为
              60–80%。真正有意义的分散通常需要横跨 3 个以上不同垂直领域的 10 个以上付费客户；对一家尚未开始外呼销售、研究优先的公司来说，这个门槛很可能在首次部署后 3–5 年才会出现。

              DARPA、NSF、DIU 或 DOE 的政府合同可以作为锚定收入，并具有非稀释资金特征，但会引入预算周期依赖风险：一次国会拨款决定就可能毫无预告地消灭最大客户，2022–2023 年多个国防 AI
              合同公司已经发生过类似情况。Ben Spector 的 Hertz Foundation fellowship 发出与政府科研采购相关的学术可信度信号，但没有披露任何拨款或合同。

              扩张模型在概念上有吸引力——数据高效训练方法可以从单个项目扩展为同一企业内多个团队使用的平台——但没有扩张数据、客户管理职能或先落地再扩张记录可以验证这个论点。企业 IT
              预算调查显示，在经济不确定背景下，25–30% 的 CIO 计划推迟 2026 年新的 AI 平台决策，带来额外时点风险。完整扩张故事仍属推测，并取决于尚未宣布的研究突破。
