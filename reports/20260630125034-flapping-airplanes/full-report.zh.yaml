  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 研究平台与技术资产
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 的产品形态更像内部研究平台，而不是面向市场的产品。公司明确押注数据效率：当前大型语言模型和相关前沿系统需要远多于生物系统的训练数据，而大脑已经证明，学习可以远比现在更省样本。

              重要的是，公司及其投资人并未把这件事描述成类脑硬件项目，也不是要照搬大脑机制；更接近的说法是，从生物学习中提炼原则，用来改进训练算法、架构，甚至系统级优化。这个区别很关键，因为它收窄了可能资产的边界。截至
              2026 年 6 月，没有证据显示公司已有公开模型、API、SDK、基准套件或开放论文管线。因此，可观察资产只剩研究计划本身、创始人的技术资本，以及实验室把理论落到实验里的能力。

              创始人匹配度是最强的正向信号。Ben Spector 通过 Hazy Research 和 ThunderKittens，在 GPU kernel、高效注意力计算和 ML 系统工程上具备直接可信度。Asher
              Spector 带来稀疏信号和压缩感知数学，可能为数据高效的表征学习提供启发，而不必预设标准 Transformer 扩展路径。Aidan Smith 在 Neuralink 的神经工程经验也有用，不是因为 FA
              在做 BCI
              硬件，而是因为公司明确在寻找生物学习的经验。组合起来，一个可信研究栈浮现出来：学习理论、系统优化和生物启发。缺口在于，尚无任何证据表明这些要素已经凝结成创始人论点之外的、可复现的内部资产。因此，本章的架构图和资产表应被理解为对披露意图和技术先验的综合，而不是对可运行产品栈的确认。
