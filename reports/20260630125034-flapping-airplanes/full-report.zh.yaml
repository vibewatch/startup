      - number: '4.2'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >
              根据 Flapping Airplanes, Inc. 于 2026-02-23 提交的 SEC Form D，种子轮从 79 名直接投资人处募得 $180,201,507（总发行额
              $180,451,978）。领投方包括 Google Ventures（GV）、Sequoia Capital（合伙人 David Cahn）、Index Ventures 和 Menlo
              Ventures。一个平行 SPV——“Flapping Airplanes Jan 2026 a Series of CGF2021 LLC”——由 Sydecar LLC 于 2026-03-13 备案，拥有
              39 名投资人和 $249,000 发行所得，用于基金组织和运营费用，反映大型种子轮中常见的集合共同投资载体。多家独立来源广泛报道，本轮隐含总估值约 $1.5 billion。根据 SEC 文件，公司注册于
              Delaware，总部位于 350 California St, Suite 1550, San Francisco, CA 94104。公司未公开披露烧钱速度、现金跑道预测或资金用途拆分。SEC
              文件中没有债务工具、可转债或项目融资义务。基于 AI 研究实验室薪酬基准（前沿实验室 AI 研究员总薪酬从 $300K 到 $1M+）和算力成本代理数据，一个 30–60 名研究员团队意味着年现金消耗约
