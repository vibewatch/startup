      - number: '2.3'
        title: 买方与细分市场地图——超大规模云厂商和企业 AI 团队最可能成为近期被授权方；研究实验室承接早期采用
        blocks:
          - type: paragraph
            body: >-
              2026 年，基础 AI 模型能力的主要买家可分为五类，各自预算归属和采用节奏不同。超大规模云厂商（Google、Microsoft、Amazon、Meta）掌握最大的 AI
              训练预算，也最有动力采用能够按规模降低算力和运营成本的效率改进。这些买家也可能成为收购方或战略投资人，并且已展现出通过合作或 M&A 吸收研究实验室成果的模式。企业 AI 团队——已搭建内部 AI
              实践、但不训练前沿规模模型的公司——按数量看是最广的市场，预算通常在 CTO 和业务单元技术支出之间拆分。它们的采用触发点通常是降低推理成本，或是在本地部署、隐私敏感场景中受到模型大小约束。


              政府和国防机构构成一个增长中的买方群体，动机来自 AI 自主性担忧和国家安全 AI 投资要求，而不是商业
              ROI。高校和政府研究实验室可能通过合作协议、共同发表或研究工具授权，成为早期采用者，而非传统商业授权客户。垂直 AI
              构建者——为医疗、法律或金融服务训练领域模型的公司——面对与大规模模型相似的数据约束，但由于自有语料更小，数据稀缺问题更尖锐；这一细分市场可能是被低估的近期机会。


              IFR 报告称，2025 年美国工业机器人安装量为 38,000 台，2024 年中国为 295,000 台，说明物理世界 AI 应用部署正在加速，并会受益于机器人感知和控制任务中更省数据的训练。不过，机器人对
              Flapping Airplanes 仍是二阶机会——考虑到公司尚未商业化，它不是近期买方细分。所有买方类别的预算归属，要么在专门 AI 基础设施预算中（超大规模云厂商），要么在 R&D
              与资本开支线中（企业和政府），要么在研究拨款和合同预算池中（高校和政府实验室）。从研究成果走到商业合同的采用路径，Flapping Airplanes 尚未跑通；这是市场论点中不确定性最高的一环。
