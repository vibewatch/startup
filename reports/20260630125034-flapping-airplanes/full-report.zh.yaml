      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              给收入前 AI 研究实验室估值，需要使用先例法，因为折现现金流分析不可行。四个参考框架相关：（1）可比 AI 研究实验室种子阶段的风投先例；（2）公开市场 AI
              公司倍数，用于长期退出校准；（3）下行情景下的可比人才收购和收购价格；以及（4）市场规模 / 估值比，用来校验市场机会是否合理。

              风投先例显示，$1.5B 种子轮估值位于 2024–2026 这批公司的高端，但并非没有先例。Anthropic 在 2022 年以 $4.1B 估值融资 $750M Series
              C，当时收入尚未显著起来——但它已经发表 Constitutional AI，并有清晰产品管线。Sakana AI 在 2025 年 11 月以 $2.65B 估值融资 $135M Series
              B，已有一些商业研究产品上线。Evolutionary Scale 以隐含约 $1.4B 估值融资 $142M Series A，方向是生物序列 AI——且已有模型（ESM Atlas）。Imbue 于 2023
              年为 AI 推理研究融资 $200M Series B。Liquid AI 为高效神经网络架构融资 $250M Series A。所有这些可比公司在相应融资阶段都比 Flapping Airplanes
              有更多研究验证。

              公开市场参照点是 Palantir FY2025 收入约 $2.9B，P/S 倍数为 70×，反映市场愿意为已验证 AI 平台支付的溢价。Flapping Airplanes 估值 $1.5B
              且零收入，意味着它需要达到 $21M 收入，才能匹配 Palantir 的 70× 倍数——这个里程碑不算高，但在没有定义商业产品或时间表的情况下无法排期。类脑计算市场预计到 2030 年达到
              $6–8B（GrandView、Research and Markets）；若捕获其中 5%，意味着约 $400M 收入，可能支撑高得多的估值——但要达到这种市场份额，必须先证明研究有效。
