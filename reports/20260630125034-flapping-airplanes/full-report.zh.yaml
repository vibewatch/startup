  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 的竞争格局，更适合看成分层堆栈，而不是单一同业组。最直接的概念同业，是那些以研究为先、明确主张替代架构或效率路线的实验室：Sakana AI
              使用进化式模型合并和集体智能；Liquid AI 推进液态神经网络与边缘部署；Imbue 聚焦推理优先的智能体，而非单纯预训练规模。Physical Intelligence 和
              EvolutionaryScale 属于相邻玩家，而不是正面竞争者，因为它们分别把新架构用于机器人和生物学；但两者同样争夺顶级研究人才、投资人注意力，以及定义后 Transformer
              前沿实验室形态的话语权。TP001 表明，这些团队在商业化成熟度上的差异，远大于野心上的差异。


              真正的现状对手并不是另一家隐身实验室，而是由 OpenAI、Anthropic 和 Google DeepMind 领导的 Transformer 生态。Flapping Airplanes
              的创始人明确表示，他们不直接与这些公司竞争，因为实验室攻击的是数据效率问题，而不是产品竞赛。今天从战略上看这是真的，但从商业上看只对了一半：任何成功的 Flapping Airplanes
              产出，最终仍需要替代、接入或显著胜过已经控制开发者使用、企业分销和信任界面的现有平台。FP001 捕捉了这种分裂：Flapping Airplanes 位于极度研究导向、替代架构的一端，而 OpenAI 和
              Anthropic 位于产品化 Transformer 的一端。


              格局剩余部分包括替代方案和潜在进入者。任何买方在评估未来 Flapping Airplanes 供给时，最直接的替代就是继续使用 Transformer
              API、内部开源栈或微调后的现有模型。内部自建同样重要：成熟企业可以组装多供应商 AI 系统，不必等待新实验室成熟。潜在进入者无法穷尽列举，但最可能的类别包括内部推进效率研究的现有前沿实验室、来自顶级 ML
              网络的学术衍生公司，以及从同一 Stanford/MIT/Hazy Research 圈层涌现的更多替代架构团队——Flapping Airplanes
              本身也出自这一圈层。正因如此，尽管大竞争地图已经清晰，未来进入者分析仍只能保持部分结论。
