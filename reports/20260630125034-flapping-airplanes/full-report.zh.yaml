            body: >
              Flapping Airplanes 是一家未提交任何交易所注册证券发行文件的 Delaware 私营公司，因此没有义务披露财务报表、烧钱速度、收入、ARR、员工数或前瞻指引。唯一公开财务文件是两份 SEC
              Form D（一份对应公司实体，一份对应 Sydecar SPV），它们确认了融资规模、投资人数量和有效发行日期，但不包含利润表、资产负债表或现金流信息。SEC EDGAR 全文搜索确认，公司未提交
              10-K、10-Q、S-1 或委托书。公司官网没有投资者关系栏目、财务新闻稿或年报。PitchBook、CB Insights、Crunchbase
              等第三方数据库从公开二手来源收录了本轮融资，但没有一家包含专有财务数据。这种财务缺口画像符合种子阶段私营 AI
              实验室的常态：整个投资论点依赖研究团队质量和研究策略，而非经验证的财务指标。关键尽调缺口包括：实际月度烧钱速度、截至 2026 年 6 月的剩余现金、按类别划分的资金用途计划、报告日员工数、Series A
