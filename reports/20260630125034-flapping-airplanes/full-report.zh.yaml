      - number: '3.3'
        title: 能力比较与 GTM
        blocks:
          - type: paragraph
            body: >
              能力比较最能显示 Flapping Airplanes 的有趣之处，也最能显示它的脆弱性。它公开押注的是：真正瓶颈不是单纯推理质量或更大的算力集群，而是用少得多的数据学习。Liquid AI
              是最接近的技术类比，因为它同样主张架构改变，而非更多 Transformer 扩展；但 Liquid 已更进一步，把这一押注转化为部署主张和设备合作。Sakana AI 又不同：它的进化式方法并不主要是直接替代
              Transformer，而是用编排和合并模型的方式，从组合中创造效率。相比之下，Imbue 基本接受了主流模型基础设施，把重点放在智能体式推理上。FP002 总结了这一分布：Flapping Airplanes
              的论点纯度很高，但外部可见能力宽度很低。


              GTM 与产品包装暴露了最大的近期劣势。TP004 显示，Flapping Airplanes 没有定价、没有 API 访问，也完全没有开发者层级。OpenAI、Anthropic 和 Google
              DeepMind 已经提供公开价目表、企业采购路径和广泛开发者熟悉度。Liquid AI 与 Sakana AI
              位于中间：足迹比前沿实验室小，但已有足够产品触点来产生用户反馈、伙伴学习和一定分销。这一点很关键，因为 Transformer API 之间的应用层切换成本很低。如果企业客户已经在
              OpenAI、Anthropic 和 Gemini 之间多家并用，未来 Flapping Airplanes 产品不会天然继承锁定；它必须靠性能、成本、信任，或一个高度差异化的工作流取胜。


              信任与监管姿态今天也更有利于现有玩家。OpenAI、Anthropic 和 DeepMind 有公开安全叙事、企业文档和运营历史。Flapping Airplanes
              尚未发布这些内容；这对纯研究实验室可以理解，但仍是商业短板。因此，未来 Flapping Airplanes
              发布时不能只靠新奇。它不仅需要更好架构的主张，还需要可信的包装和信任层，把优雅研究结果与企业就绪产品之间的 GTM 距离补上。
