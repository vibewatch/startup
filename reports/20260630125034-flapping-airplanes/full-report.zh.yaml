  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与目标垂直领域
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 已公开提出未来商业化的三个主要目标垂直领域：自主机器人、科学药物发现和生命科学，以及企业 AI 基础设施。公司的根本研究论点是，数据高效的 AI
              训练可以用少量标注数据达到或超过暴力规模化模型的性能；在标注数据结构性稀缺且生成成本高的领域，这天然具备产品市场契合度。

              自主机器人是最有说服力的近期目标。International Federation of Robotics 报告称，2023 年工业机器人安装量创下 553,000
              台纪录，但为新环境编程机器人仍然吃数据且脆弱。数据效率突破会压缩编程周期，并把演示需求降低几个数量级。

              药物发现和生命科学是第二个高价值目标。临床试验数据稀缺、昂贵且受监管，少样本分子或生物表征学习的任何进展都直接具备商业价值。学术文献（arXiv
              2304.15004）已经在分子性质预测任务中展示了可衡量的效率提升。

              企业 AI 基础设施——广义上指面向生产力流程的基础模型和 API——是第三个已声明垂直领域。不过，联合创始人 Asher Spector
              已明确降低早期企业签约的优先级，直言签合同会分散核心研究注意力。政府和国防机构（DARPA、NSF、DIU）通过科研拨款或专项采购构成第四个自然客群，尽管采购周期以年计。

              Grand View Research 预计，企业生成式 AI 软件市场到 2030 年的 CAGR 将超过 35%；IDC 估计，到 2027 年全球 AI 基础设施支出将超过
              $200B。这为未来任何商业化提供了有利宏观背景，但当前研究阶段与首笔收入之间的缺口没有公开闸门，也未披露时间表。
