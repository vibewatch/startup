      - number: '5.2'
        title: 开发流程与研究运营
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 的产品技术核心问题不是功能宽度，而是研究执行力。公开证据显示，这更像一个为多年实验搭建的实验室，而非准备近期发布的产品团队。GV
              的投资笔记和创始人的媒体表述都暗示，公司预期要先发明新的训练算法，甚至可能搭建自定义计算底座，商业化才有可能。因此，技术尽调的中心应是内部工作流，而不是面向客户的产品。问题在于，公开记录几乎没有描述这套工作流。没有披露代码库架构、基准测试框架、发布节奏、预发环境、论文储备，也没有文档说明假设如何提出、测试和证伪。现有证据只指向一种可能的研究节奏：一支小而精的研究团队围绕算法假设迭代，在
              GPU 基础设施上大批量跑实验，并等到结果足够有分量、经得住辩护后再发表。

              融资规模改变了这种沉默的含义。$180M 种子轮给了 FA 数年保持产品前状态的时间和预算，降低了快速发表的压力，但也提高了尽调负担，因为外部观察者无法区分健康的隐身研发和已经停滞的进展。Ben Spector
              的过往工作显示，实验室可能格外擅长贴近硬件和 kernel 层工作；与 Prod
              孵化器的关联也意味着，一些内部工具和运营脚手架可能继承或改造自更早的创业搭建环境。即便如此，成立之后每一个具体工作流里程碑仍然是分析师推演，而非公司披露：首个
              PoC、首篇预印本、首次外部基准发布，以及最终商业化，都是合理步骤，但没有任何公开日期。因此，运营流程图和路线图表描绘的是可能的研究管线，不是已确认的管线；投资人应把工作流不透明视为核心尽调缺口，而不是表面问题。
