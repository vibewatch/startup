      - number: '2.4'
        title: 增长驱动与采用约束——数据墙真实存在，但开源商品化和缩放定律的韧性也是重要反向力量
        blocks:
          - type: paragraph
            body: >-
              数据高效 AI 最强的结构性增长驱动，是训练数据墙。领先 AI 研究者已经指出，高质量人类生成互联网文本作为训练来源正接近耗尽，前沿实验室越来越依赖重复数据、合成数据或低质量数据。人类一生认知经验约等于 500
              billion token，而 LLM 训练语料达到 10–30 trillion
              tokens，两者对比凸显了低效：模型消耗了所有可想象人类经验的许多倍，却仍未学会以人类速度或深度泛化。无论具体机制是什么，这一约束都会抬高“用更少数据学到更多”的架构价值。


              推理成本经济性提供了第二个驱动。随着 AI 模型部署扩张，单次查询的推理算力成本往往主导总 AI 运营成本。更小、更高效的模型如果能以更低参数量达到同等任务表现，就能降低推理成本和延迟，让效率差异直接变成企业
              AI 买家的商业相关性。EU AI Act 和刚起步的全球 AI 治理框架，也在方向上创造了对更可解释、可审计、可能更数据稀疏 AI 系统的需求；但在 2–3 年视角下，这一监管驱动仍属推测。


              关键采用约束同样实质。开源商品化——尤其是 Meta 的 Llama 系列及同类——压缩了缺乏差异化效率的基础模型研究实验室的商业空白。任何模型方法一旦在发布后 12–18
              个月内可被开源项目复制，战略价值就会快速流失。缩放定律的韧性仍有争议：如果既有 Transformer 架构继续扩展仍能交付足够能力提升，数据效率范式的紧迫性就会下降。每 FLOP 算力成本趋势（每年约下降
              40–50%）也双向作用——它让暴力扩展的数据密集训练更便宜，部分抵消了数据高效架构的效率优势。最后，Flapping Airplanes 从研究走向产品的时间线完全未被验证；AI
              中可比的范式转移时刻（Transformer 从学术概念到生产规模）通常需要从发表到主流商业部署 5–10 年。
