      - number: '1.3'
        title: 融资历史、投资人与财务结构
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 在 2026 年 1 月完成 $180 million 种子轮，报道投后估值为 $1.5 billion；对于一家无产品公司而言，这是 AI 史上规模最大的种子轮之一。本轮由
              GV（Google Ventures）、Sequoia Capital 和 Index Ventures 联合领投，Menlo Ventures 参与。每家领投方都发布了专门的投资公告，说明为何押注这家公司。


              GV 题为 “Better Wings: Why We Invested in Flapping Airplanes” 的文章，把这笔投资描述为一场对抗主导 AI 发展的“规模正统”的“信念联盟”。GV
              指出，支持现有 AI 实验室的同一批机构，也在支持 Flapping Airplanes；他们把这一点解读为行业相信主流范式之外仍有重大增益空间的信号。Sequoia 合伙人 David Cahn
              则把本轮融资定义为押注“研究范式”而非“规模化范式”，并认为 AGI 可能还需要 2–3 个基础性突破，而不是单靠原始算力扩张。


              Index Ventures 的文章更强调个人关系如何形成信念：合伙人 Mark Xu 在 Harvard 认识 Asher；合伙人 Shardul Shah 在 Chris Ré 办公室偶遇
              Ben，随后散步交流，离开时称他“惊艳”。Index 把公司描述为正在组建一支“Avengers 式阵容”，每个可招募成员都有明确的超能力。


              资本主要指定用于算力，以支撑基础研究。公开信息中没有老股转让、债务工具或股权众筹。公司没有收入、产品或 ARR。除三位联合创始人构成创始管理团队外，尚无已披露的治理细节。本轮 $1.5 billion
              估值——对应 11 名员工且无产品——已在行业报道中受到明确批评，被视为 FOMO 驱动的新型 AI 实验室投资典型案例。
