  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              在 2026 年 AI 格局中，Flapping Airplanes 处在一个悖论位置：它既是史上获得融资的种子阶段 AI
              研究实验室里资历最强的一批，也几乎没有经过实证验证。看多论点站在三根支柱上。第一，团队履历异常出众——Benjamin Spector 的 Prod 孵化器孵化了 Cursor、Mercor、Etched 和
              Decart，这些公司合计价值超过 $50B；联合创始人 Aidan Smith 曾在 Neuralink 训练神经元，并持有 Thiel Fellowship；联合创始人 Asher Spector 是
              Stanford Statistics PhD 和北美辩论冠军。第二，研究论点——通过反向工程生物神经网络的数据效率，创造所需训练数据少几个数量级的 AI 系统——击中了前沿 AI 公认瓶颈。随着前沿训练单次
              run 成本升至 $50–200M（Epoch AI，2025），数据高效学习可能带来模型经济性的阶跃式改善。第三，Google Ventures、Index Ventures 和 Menlo Ventures
              三家全球最挑剔的深科技投资人背书，意味着其内部尽调认为研究路线可信。

              反论点同样有力。截至 2026 年 6 月，公司没有发表研究、没有产品、没有收入。$1.5B 投前估值绑定的是一个概念、11 名员工，以及一个从未在商业环境中测试过的论点。Sequoia 的“600B
              Question”（2024）正是点名了这种模式：AI 公司拿下数十亿美元投资，却没有相应收入爬坡。Illuminem（2026）把 Flapping Airplanes 列为六家以高估值融资的零收入 AI
              实验室之一。从生物启发研究走到企业产品，需要多年时间，且完全属于推演。
