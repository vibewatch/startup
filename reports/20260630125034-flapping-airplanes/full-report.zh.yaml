      - number: '7.5'
        title: 缓释措施、终止标准与监控
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes 管理层已公开承认核心风险。Ben Spector 表示，激进研究“第一次很可能失败”，且比渐进式工作更便宜；他把早期失败视为预期内且可恢复。Aidan Smith
              承认，“有时候，截然不同的东西就是比范式更差”。这些自我评估显示创始人知道风险，但没有公开披露正式风险管理框架、董事会层面的风险委员会或事件响应结构。

              投资人的结构性缓释包括 GV、Sequoia、Index 和 Menlo Ventures 等顶级机构背书；这些机构的声誉资本和董事会席位可以提供治理支持。NIST 的自愿 AI Risk Management
              Framework 可供公司免费使用，但公司是否采用尚未确认。2025 年 1 月 EO 14110 被撤销，移除了强制性的联邦 AI 安全指导，使自愿框架成为主要治理参考。

              尽调应监控的论点破裂触发器包括：（1）18 个月内未发布经验证的预印本，确立数据效率指标；（2）任何联合创始人离开；（3）确认有政府模型发布限制令专门适用于 Flapping Airplanes；（4）AI
              算力成本在突破出现前就超过公司已声明的预算假设；以及（5）可比新型 AI 实验室先于 Flapping Airplanes，从公开可用方法发表等价结果。
