      - number: '1.4'
        title: 里程碑、负面事件与发展轨迹
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 的时间线很短，但分量不轻。公司的实际起点可追溯到创始人的学术和孵化器经历——Ben 开发 ThunderKittens 和 Prod 投资组合成果，Asher 的统计学
              PhD 与辩论背景，以及 Aidan 在 Neuralink 的三年经历。三位联合创始人在 2025 年末低调汇合，启动实验室。Ben 于 2025 年 9 月正式从 Stanford PhD 项目休学。公司在
              2025 年私下创立，并在 2026 年 1 月 28–29 日公开发布，同时宣布 $180 million 种子轮。


              截至 2026 年 6 月，公开信息中未出现监管、诉讼或治理层面的负面事件。主要负面维度来自对无产品高估值的批评：techiexpert.com 认为 $1.5 billion
              估值让人想起互联网泡沫；financeand.money 在盘点六家无产品 AI 实验室时突出提到 Flapping
              Airplanes，并指出“其中大多数可能永远拿不出能证明自身估值合理的东西”。Foundation Capital 的 Ashu Garg 明确警告，大多数新型 AI
              实验室无法跨过真正有意义的技术门槛，最终结果只会比现有模型小幅更好。


              公司自己的表述也承认不确定性：Asher Spector 在 2026 年 2 月 TechCrunch 采访中说：“我也希望能给出时间表……但我们不知道答案。”实验室在 Sequoia 的 AI Ascent
              大会上展示了 GPU 虚拟化工作，Ben 也表示公司正在构建新的硬件原语，以更高效运行数据高效算法；但截至报告日，尚无论文、基准或检查点发布。管理层曾表示研究成果会“很快”发布，但未披露具体时间表。
