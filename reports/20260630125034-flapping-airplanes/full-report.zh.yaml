      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >
              对于以 $1.5B 投前估值进入种子阶段的投资，三种情景划定了投资结果区间。这些情景根据可获得的公开证据和先例校准；由于缺少财务数据，概率信号只能定性。

              乐观情景（15% 概率信号）：Flapping Airplanes 在 24 个月内发表标志性研究，在基准任务上展示人类水平的数据效率，并在 2028 年吸引 $6–10B 估值的 Series B。研究到
              2030 年转化为企业产品（训练 API 或模型效率工具），到 2031 年产生 $500M+ ARR。以 $25–40B 退出（2031–2032 年），意味着种子轮回报 17–27×。

              基准情景（40% 概率信号）：研究推进，但商业化滞后。2028 年，在有希望的内部结果之后，公司以 $3B 估值融资 Series B。首个产品在 2030 年发布，ARR 适中（2031 年达到
              $50–100M）。到 2033 年以 $5–8B 退出，意味着种子轮总回报 3–5×。从 Series B 到退出的稀释会把净 IRR 降至约 15–25%。

              悲观情景（45% 概率信号）：生物启发研究范式在 3–4 年内无法产出可验证结果。团队无法以保住种子投资人收益瀑布的估值融资 Series B。公司被人才收购或清算。种子投资人每 1 美元收回
              $0.10–$0.50。考虑到没有已发表研究，且科学论点高度推测，这是概率最高的情景。

              多个结构性风险因素推高了悲观情景概率：算力依赖、创始人集中、监管逆风（Axios AI+ 报道的 2026 年 6 月 Trump 政府模型限制），以及研究优先 AI 实验室在 5
              年窗口内完成商业化的历史基准率。
            claimRefs: []
