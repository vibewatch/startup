  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动或约束
      - 方向
      - 时间窗口
      - 对 Flapping Airplanes 的含义
      - 尽调问题
    rows:
      - - 训练数据墙（高质量互联网数据耗尽）
        - 增长驱动
        - 近期（1-3 年）
        - 直接支撑对数据高效架构的投资；买方已经遇到这个约束
        - 要求提供基准：在同一任务上，相比 transformer 基线显示数据效率优势
      - - 推理成本经济性（规模化后每次查询算力）
        - 增长驱动
        - 近期（1-2 年）
        - 高查询量买方可用高效模型降低运营成本；商业触发因素有说服力
        - 量化推理 FLOP 降幅，与同等准确率基线模型对比
      - - 欧盟 AI 法案与全球 AI 治理框架
        - 增长驱动（方向性）
        - 中期（2-4 年）
        - 可解释性和数据最小化要求可能有利于数据高效架构
        - 评估监管要求是否明确激励数据稀疏或仿生 AI
      - - 研究范式 AI 实验室的创投资金
        - 增长驱动
        - 近期（2026 年活跃）
        - 市场验证信号；GV、Sequoia、Index 共同投资，显示类别正在成形
        - 跟踪研究范式类别在 2026 年后是否继续吸引机构资本
      - - 开源基础模型发布（Meta Llama 及同类）
        - 约束
        - 当前已发生；12-18 个月内加剧
        - 开源模型把基线商品化；任何公开技术都可能免费流通，无法产生授权收入
        - 评估 IP 保护策略，包括专利、商业秘密或闭源权重路径
      - - 扩展定律韧性（规模继续推高能力）
        - 约束
        - 不确定；截至 2026 年仍在争论
        - 如果扩展继续带来足够提升，数据效率范式的紧迫性会下降
        - 要求内部分析：在标准基准上，对比扩展曲线和数据高效曲线
      - - 每 FLOP 算力成本趋势（每年下降 40-50%）
        - 混合（压缩差异化）
        - 持续；随时间压缩效率优势
        - 暴力扩展每年都在变便宜；数据高效优势必须比算力降价累积得更快
        - 建立财务情景：到 2030 年，算力成本下降会如何削弱效率优势价值
      - - 从研究到商业化的时间表风险
        - 约束
        - 长期（可比范式转变需 5-10 年）
        - 商业化前研究实验室从突破性论文发表到商业部署，通常需要 5-10 年
        - 评估管理层路线图，以及投资人对首个商业里程碑的预期
