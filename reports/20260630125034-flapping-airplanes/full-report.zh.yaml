      - number: '3.2'
        title: 同业实验室画像
        blocks:
          - type: paragraph
            body: >
              直接同业组并不主要由收入重叠界定，而是由论点相似性界定。Sakana AI 是最清楚的证明点：替代架构实验室可以走出研究姿态。它由前 Google 研究者于 2023 年创立，已以 $2.65 billion
              估值完成 $135 million Series B，也是这个群体中唯一已经在公开报道中看到有意义企业部署的实验室。Liquid AI 提供了同一逆共识本能的另一种版本。作为 MIT CSAIL
              衍生公司，它主张液态神经网络和混合架构能比纯 Transformer 交付更好的部署特性，并把这一论点与 Mercedes-Benz、Shopify 等真实边缘设备合作绑定。Imbue 在技术上离
              Flapping Airplanes 更远，但它通过把推理定义为瓶颈、并转向产品化编程智能体，争夺同一资本和人才池。


              两家相邻实验室很重要，因为它们展示了替代架构不必正面攻击通用语言建模也能取胜的路径。Physical Intelligence 围绕机器人和具身 AI
              聚集了庞大资金基础，但仍没有商业化时间表。EvolutionaryScale 聚焦蛋白质语言模型，能够指向 esmGFP 这一具体科学成果，而不是通用市场产品。这些案例对 Flapping Airplanes
              有意义：它们说明投资人愿意多年支持论点驱动型实验室，但公开证明往往先出现在更窄的垂直领域，因为成功标准更容易展示。


              TP002 把画像差异拉得很清楚。Flapping Airplanes 是组内商业化程度最低的一项：没有
              API、没有论文、没有公开安全或信任框架，也没有公开基准输出。这不推翻其论点，但意味着市场几乎完全是在承销创始人质量和投资人信念。Sakana、Liquid 等同业已经把研究叙事转化成产品触点；OpenAI 和
              Anthropic 则沿商业化曲线走得太远，已经不像同业，更像每个挑战者最终必须插入的默认运营环境。
