      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes
              采用纯研究支出成本结构，没有销售成本（COGS）、没有获客成本（CAC），也没有与收入挂钩的可变成本。主要成本驱动是研究员薪酬、算力基础设施和运营开销，全部由股权资本提供资金。Epoch AI 对 45 个前沿
              AI 模型的成本建模显示，硬件和能源成本占总开发成本 47–67%，R&D 人员占 29–49%，能源另占 2–6%。Ben Spector 在 TechCrunch
              采访中指出，基础研究“反常地更便宜”，因为激进想法可以在小规模上测试并失败，不必一路跑完整个扩展阶梯——这意味着早期烧钱可能低于研究成功后最终生产规模烧钱。不过，Epoch AI 也发现，自 2016
              年以来，前沿模型训练任务的摊销硬件和能源成本每年增长 2.4x；到 2027 年，最大规模训练任务预计将超过 $1 billion。如果 Flapping Airplanes
              最终推进大规模训练任务，仅算力成本就可能消耗大部分种子资本。研究人员成本同样可观：GV 描述的团队是“高中天才、数学奥赛选手和韧性十足的研究者”，非标准画像可能允许低于市场的基础薪资，但要吸引世界级 AI
              人才，仍需要有竞争力的总薪酬。由于没有商业产品，毛利率、营运资本需求、capex 计划和服务交付成本结构都未定义。
