      - number: '1.2'
        title: 领导层、创始人与团队构成
        blocks:
          - type: paragraph
            body: >
              创始团队刻意不走常规路线。Ben Spector 是年龄最大的成员，也是公司主要公众面孔；他原本在 Stanford University Hazy Research Lab 跟随 Professor Chris
              Ré 攻读计算机科学 PhD，2025 年 9 月离开项目创办 Flapping Airplanes，当时距离预计毕业大约还有 8 个月。他的学术工作聚焦高效 ML 系统、GPU kernel
              优化和硬件感知加速；他主导开发 ThunderKittens，这一快速 AI kernel 编写框架的性能可与 FlashAttention-3 竞争。Ben 在 MIT 获得 BS 和
              MEng，本科期间创办非营利创业加速器 Prod，并入选 2023 Hertz Foundation Fellow。Index Ventures 的 Shardul Shah 回忆，自己在 Stanford 与
              Ben 临时散步两小时后，立刻说：“Ben Spector 太惊艳了。”


              Asher Spector 是 Ben 大约年长一岁的哥哥，最近完成了 Stanford Statistics PhD。作为前北美辩论冠军，Asher 的分析和结构化能力补足了 Ben
              更具想象力、偏系统的打法。Index Ventures 的 Mark Xu 在 Harvard 学生时期就认识 Asher；Index 与 Spector 兄弟各自已有的关系，正是其联合领投本轮融资的入口。


              Aidan Smith 是 Thiel Fellow，曾在 Neuralink 担任脑机接口软件工程师三年——为神经数据构建 ML 研究系统并编写 neuralink.com——同时就读 Georgia
              Tech。他的 GitHub 资料写着“让飞机扇动翅膀”，早期媒体报道中列出的年龄为 21 岁。他对大脑如何编码和传输信息的深度接触，直接塑造了 Flapping Airplanes 的生物启发研究视角。


              启动时更大团队共有 11 人，包括一名 18 岁高中生。公司也确认，团队成员中有 International Mathematical Olympiad、International Olympiad in
              Informatics 和 International Physics Olympiad 奖牌获得者，以及美国辩论冠军。Flapping Airplanes
              招聘时更看重原始创造力而非履历，明确寻找没有“被规模教条灌输过”的人。前 Tesla AI Director、知名行业人物 Andrej Karpathy 担任顾问；前 Google AI 负责人 Jeff
              Dean 以天使身份投资。
