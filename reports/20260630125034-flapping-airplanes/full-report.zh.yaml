  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——基础模型、数据效率，以及缺少公认独立品类
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes 面向的是基础 AI 模型市场——这一市场涵盖大规模 AI 架构的训练、授权和部署，目标是服务多种下游应用。截至 2026 年 6 月，主流分析机构尚未把数据高效 AI
              或生物启发 AI 作为独立市场品类发布。最接近的正式覆盖，是广义基础模型、企业生成式 AI，以及作为硬件与架构子领域的类脑计算。因此，公司横跨三条彼此重叠的边界，却无法干净落入任何单一品类。


              实际市场边界应纳入几类组织：训练、授权、微调或调用前沿 AI
              模型用于研究或商业部署的机构；采购模型效率改进以降低算力和推理成本的机构；以及瞄准类脑或数据稀疏训练范式的硬件或架构开发者。应排除的是：只使用模型而不构建模型的纯 AI 应用软件公司；专注 AI
              专用芯片、但没有模型 IP 的半导体公司；以及只部署、不训练也不拥有底层模型的云端推理平台。现状替代方案包括继续用公开互联网数据扩展既有 Transformer 架构，采用并微调开源模型（Meta Llama
              系列及同类），以及用合成数据方法扩大有效训练语料，而不是转向生物启发路线。


              公司创始人明确把目标市场界定为大型科技组织和企业：未来它们会希望按规模授权或部署数据高效模型。这一框架意味着，公司潜在分销渠道更可能是授权或模型即服务，买家已投入 AI 基础设施，但受成本或数据天花板约束。截至
              2026 年 6 月，公开信息中没有商业协议、试点或已签 LOI；在研究成果交付前，市场机会仍停留在理论层面。
