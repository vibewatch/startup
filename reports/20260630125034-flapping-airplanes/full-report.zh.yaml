      - number: '5.3'
        title: 信任、安全与合规姿态
        blocks:
          - type: paragraph
            body: >
              评估 Flapping Airplanes 的信任与合规，必须先看清公司尚未做什么。FA 尚未发布模型、API
              或开发者产品，因此还没有承受已部署前沿模型供应商那种运营安全负担。这在一定程度上解释了为什么没有公开的负责任 AI 框架、模型卡、红队测试报告或可见治理计划。对一家成立 5
              个月的研究实验室来说，这种缺席很正常，但它并非战略上中性。公司的论点是发现数据效率大幅提升的学习方法；一旦结果足够强，内部实验可能很快跨入商业相关阶段，可用于搭建隐私、防滥用、安全和监管流程的时间会被压缩。已经对外暴露产品界面的同业实验室——尤其是
              Anthropic 和 OpenAI——即便具体内部流程仍保持私密，也会围绕部署闸门和安全方法发表更多内容。FA 目前没有提供这类对外承诺。

              正确解读不是 Flapping Airplanes
              现在不安全，而是它的信任栈几乎完全尚未显性化。没有披露外部数据治理义务，没有合规认证证据，也没有理由假设公司已经搭建了可媲美更成熟实验室的内部控制。这一点有两个原因值得关注。第一，未来评估授权交易的企业或政府合作方，会要求确认模型开发、基准测试和发布流程不只是靠创始人判断来治理。第二，如果
              FA
              的研究路线成功，首个对外可见的产品决策可能会早于公开安全叙事到来。本节依赖图把这种顺序风险摊开：单靠技术成功并不能带来部署就绪。人才、算力、基准设计、发表、后续资本和最终治理，都位于从研究雄心到可变现产品之间的关键路径上。
