      - CR034
      - CR022
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从证据评估出发，依次经过风险、信心和估值校验，最终给出 Flapping Airplanes 以 $1.5B 投前估值入场种子轮时的“继续研究”建议。
    data:
      nodes:
        - id: N1
          label: 证据评估：$180M 种子轮、11 名员工、零收入、零已发表研究
        - id: N2
          label: 估值校验：$1.5B 投前估值，∞ P/S——全球 AI 种子轮估值前 5%
        - id: N3
          label: 市场信号：仿生 AI 市场到 2030 年达 $6–8B；基础模型市场到 2032 年超过 $120B
        - id: N4
          label: 风险评估：严重——算力依赖、关键人、商业化不确定性
        - id: N5
          label: 信心评分：低——无技术验证、无财务数据、无已发表研究
        - id: N6
          label: 建议：继续研究——里程碑研究发表后列入 Series B 观察名单
      edges:
        - from: N1
          to: N5
        - from: N2
          to: N5
        - from: N3
          to: N5
        - from: N4
          to: N5
        - from: N5
          to: N6
    claimRefs:
      - CV042
      - CV012
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同市场份额、可比倍数和情景结果假设下，可支撑的隐含估值区间；用来把 $1.5B 入场价放回参照系。
    data:
      items:
        - label: 牛市：研究突破 + Series B 轮 10× → $25B 退出
          value: 12.5
        - label: 轻牛：12 个月研究推进后追平 Sakana AI（$2.65B）
          value: 2.65
        - label: 种子轮入场估值（当前）
          value: 1.5
        - label: 基准：验证更多后追平 Imbue Series B（~$1B）
          value: 1
        - label: 熊市：按人头成本之上的收购式招聘溢价
          value: 0.2
    claimRefs:
      - CV015
      - CV017
      - CV031
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 各情景的低—高估值区间，依据可比先例和市场规模估算。基准值取中位估计；低值和高值是概率加权的极端值。
    data:
      items:
        - label: 牛市情景退出价值（$B）
          low: 15
          high: 40
          mid: 25
        - label: 基准情景退出价值（$B）
          low: 3
          high: 8
          mid: 5
        - label: 熊市情景回收价值（$B）
          low: 0.05
          high: 0.5
          mid: 0.2
    claimRefs:
      - CV031
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的七维评分，评估 Flapping Airplanes 的种子轮投资画像。评分依据截至 2026 年 6 月的公开证据；采用 10 分制。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          note: 仿生 AI 市场到 2030 年达 $6–8B；基础模型市场到 2032 年超过 $120B
        - label: 研究验证
          value: 1 / 10
          note: 截至 2026 年 6 月，无已发表研究、无预印本、无基准测试
        - label: 竞争护城河
          value: 4 / 10
          note: 团队履历和 Karpathy 背书加分；但 IP 和产品护城河还没成形
        - label: 团队质量
          value: 8 / 10
          note: 连续创业者；Stanford 博士；Thiel Fellow / Neuralink；79 名投资者
        - label: 收入路径
          value: 1 / 10
          note: 截至 2026 年 6 月，没有产品、没有路线图，也未披露设计伙伴
        - label: 风险画像
          value: 2 / 10
          note: 严重：算力、关键人、监管和商业化风险均实质存在
        - label: 估值合理性
          value: 2 / 10
          note: $1.5B 种子轮、零收入；在缺乏验证的情况下高于所有可比研究实验室
    claimRefs:
      - CV010
      - CV026
      - CV042
