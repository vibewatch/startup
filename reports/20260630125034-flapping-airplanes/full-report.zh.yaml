            body: >
              截至 2026 年 6 月，Flapping Airplanes
              没有任何公开记录的客户、具名试点或付费用户。缺席证据跨渠道且完整。公司的研究页面（flappingairplanes.com/research）没有客户名单、案例研究页面、客户评价或具名合作方。在 Gartner
