      - number: '3.5'
        title: 证据要点
        blocks:
          - type: callout
            title: 同业已发产品，FA 仍保持纯研究姿态
            body: >
              截至 2026 年中，FA 五家最接近替代架构同业中的三家（Sakana AI、Liquid AI 和 Imbue）已经部署商业产品或生产模型。FA
              刻意回避商业化——创始人称这是维持研究专注所必需——意味着它没有积累部署经验、客户反馈循环，也没有可再投入的收入。如果竞争对手的替代架构在 FA 发布之前达到生产规模，FA
              可能会被迫对标同业已部署系统，而不是按自己的条件设定基准。
            calloutType: risk
