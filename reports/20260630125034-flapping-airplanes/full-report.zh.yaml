      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes 当前的护城河更像叙事，而不是运营事实。最强要素是创始人密度、顶级投资人入口，以及几年内专注硬研究而不受近期收入压力的许可。$180 million 种子轮给了约 7
              人规模实验室罕见的现金跑道；GV/Sequoia/Index/Menlo 联盟强烈说明，成熟资本想要押注反规模正统路线。FP003
              清楚呈现了这一点：公司资金跑道充足，相对规模而言人才异常集中。但这些都是投入，不是持久技术护城河的证明。


              TP003
              显示，如果研究成果持续不公开，护城河会快速侵蚀。公司没有外部可测试的论文、模型、基准、专利、定价或产品触点。知识产权因此保持隐藏，但也意味着没有可防守的公开成果、没有可领先的基准、也没有可复利的信任层。与此同时，五家最接近替代架构同业中的三家——Sakana
              AI、Liquid AI 和 Imbue——已经在市场上积累产品或部署证据。如果其中任何一家在 Flapping Airplanes 发布之前证明了商业上有用的非标准架构，市场可能得出结论：Flapping
              Airplanes 方向上正确，但战略上迟到。


              更持久的反作用来自现有玩家。OpenAI、Anthropic 和 Google DeepMind 不只是模型构建者；它们是带有定价、工具、安全姿态和客户关系的分销系统。由于 Transformer API
              之间切换成本很低，Flapping Airplanes 最终交付的任何突破，都可能被现有平台更快复制、封装或反制，而纯研究实验室还来不及搭建完整栈。因此，负面证据并不是 Flapping Airplanes
              显然错了；而是尚无替代架构实验室证明自己能在通用前沿性能上打过领先 Transformer 实验室，也没有公开路线图证明这种逆转近期可见。商业化时点、发布节奏和证明生成能力，才是核心尽调问题。
