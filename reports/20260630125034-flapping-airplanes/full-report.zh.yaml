            body: >
              融资事实由 2026-02-21 提交的 SEC Form D 精确确立：Flapping Airplanes, Inc. 融资 $180,451,978（总发行金额），首次销售日期为
              2026-01-16。该轮共有 79 名投资人。Form D 没有列明领投方。GV、Index Ventures 和 Menlo Ventures 分别发布了投资理由文章，但 Form D
              的多投资人结构显示，该轮更像拼装而成，而不是由单一强信念领投方锚定。

              $1.5B 投前估值由 TBPN Digest、CNBC、TechCrunch 和 The Guardian 确认。这意味着投后估值约为 $1.68B。以该估值为背景：

              收入倍数：∞（零收入）。单名员工估值：每名员工 $136M。可比种子轮估值：根据 PitchBook 数据，Flapping Airplanes 在 2025–2026 年全球所有种子阶段 AI
              融资中，投前估值位于前 5%。

              $180M 看起来主要会投向算力。HAI AI Index 2026 记录显示，前沿 AI 训练每次大型 run 成本为 $50–200M；按这个烧钱速度，种子资本只能支持 1 到 3 次训练实验，之后就需要
              Series B。公司没有披露 Series B 的公开时间表。股权结构表——Delaware C-corp、单一股权类别、79
              名投资人——没有揭示优先权层级、清算优先权、反稀释条款或董事会构成。这给后续投资人带来结构性不确定性。
