      - number: '7.3'
        title: 财务、资本与融资风险
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes 拥有 Form D 披露的 $180.45M 种子资本，但没有披露收入或商业合同。资本主要指定用于算力，团队 11 人；可比新型 AI 实验室的市场类比显示，月烧钱可能在
              $3–10M。没有收入时，未来 18–48 个月内再次融资在结构上不可避免，A 轮将按研究里程碑而非商业指标评估。Sequoia 合伙人 David Cahn 的“$600B
              question”分析指出，整个行业的 AI 基础设施投资与已实现收入之间的缺口正在扩大——这种宏观压力可能压缩 A 轮估值，并增加所有收入前 AI 实验室的融资摩擦。

              Finance and Money 识别出六家可比新型 AI 实验室——Humans&（$4.48B）、Reflection AI（$8B）、Periodic Labs（$300M）、Thinking
              Machines Lab（寻求 $50B）、Safe Superintelligence（$32B）和 Flapping Airplanes（$1.5B）——它们都在无产品、无收入状态下争夺同一批 A
              轮投资资本。Foundation Capital 的 Ashu Garg 警告，大多数新型 AI 实验室无法跨过足以产生意义的技术鸿沟。投资人对收入前 AI 实验室的情绪波动很大：Paul Kedrosky 于
              2026 年 6 月指出，政府 AI 访问控制会给整个 AI 实验室投资类别带来“重估压力”。

              Flapping 的 Form D 种子轮有 79 名投资人，投资人基础很广，这可能降低单个投资人的治理强度，但如果技术里程碑没有在投资人社群默认的时间表内达成，仍无法消除下一轮降估值或平轮跟投的风险。
