      - number: '7.2'
        title: 运营、算力与技术风险
        blocks:
          - type: paragraph
            body: >-
              最大的单一运营风险是算力集中。根据 TBPN Digest，整笔 $180M 种子轮“主要用于算力”，这意味着研究进展和公司生存直接绑定 GPU 市场动态。Epoch AI 分析显示，自 2016 年以来，前沿
              AI 模型训练成本每年增长 2.4×，预计到 2027 年单次训练将超过 $1B，其中硬件成本占总开发开支的 47–67%。Flapping Airplanes
              的数据效率论点旨在降低这些成本，但该论点尚未经过规模化验证——在展示突破之前，公司完全暴露于算力通胀和云基础设施定价。

              知识产权安全是第二层运营风险。截至 2026 年 1 月，公司有 11 名员工，包括以非标准条款聘用的高中天才和大学生，IP
              归属协议可能不如大型组织那样严密记录。没有披露任何公开的安全、安保或数据保护认证（SOC2、ISO 27001 或同等认证）。这种非常规人才模型——按 GV
              文章的说法，招聘那些“尚未被规模教条灌输”的人——虽有明确战略意图，却缩小了熟悉 IP 合规习惯、数据来源流程和安全协议的资深研究者池子。

              开源 AI 是结构性竞争风险：如果一家资金充足的实验室或学术团队在 Flapping Airplanes 产出商业产品前发表可比的数据高效方法，公司的独特研究优势可能迅速被侵蚀。CB Insights AI
              100 2026 报告认为，拥有专有、不可复制数据的公司护城河最持久；没有生产数据的纯研究实验室，天然更容易被复制或抢跑。
