  evidenceGaps:
  - type: private-evidence-only
    topic: IP and patent filings
    severity: material
    missingEvidence: No filed patents, provisional applications, or cleared prior-employer IP agreements have been identified
      in any public database, EDGAR, or USPTO filing as of June 2026.
    whyItMatters: The bio-inspired AI research thesis depends on proprietary IP; without confirmed ownership, the thesis has
      no defensible moat and carries litigation risk from Neuralink or Prod incubator employment agreements.
    diligencePath: USPTO patent search for Flapping Airplanes, Inc. and each co-founder; legal review of employment agreements
      from Neuralink, Stanford, and Prod for IP assignment clauses.
    relatedQuestionRefs:
    - QV022
  - type: missing-data-source
    topic: Time to first commercial revenue
    severity: material
    missingEvidence: No product roadmap, development timeline, design partner list, or revenue forecast has been publicly
      disclosed by Flapping Airplanes as of June 2026. The research-to-product timeline is entirely speculative.
    whyItMatters: Seed investors need a realistic commercialization window to model returns; without a stated timeline, the
      entire valuation rests on an unscheduled future event.
    diligencePath: Request internal product roadmap and research-to-product bridge document from founders; compare timeline
      to Evolutionary Scale (3 years from first paper to commercial API) and Sakana AI (2 years from research to product).
    relatedQuestionRefs:
    - QV023
  - type: missing-data-source
    topic: comparable-valuation-table
    severity: low
    missingEvidence: The comparable valuation table covers 6 companies but excludes later-stage AI labs (Mistral, Cohere,
      Inflection) that have commercial revenue and could provide additional pricing reference points.
    whyItMatters: A more complete comparable set would tighten the valuation range and reduce uncertainty in the bull and
      base scenario return calculations.
    diligencePath: Add Mistral, Cohere, and Inflection as comparables once their valuation data becomes publicly available
      through PitchBook or CB Insights.
    relatedTableRefs:
    - TV004
