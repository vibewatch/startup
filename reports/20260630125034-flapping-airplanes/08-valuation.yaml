- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Research Paradigm Failure
    - No published peer-reviewed paper or pre-print within 24 months of seed close (before Jan 2028)
    - Core thesis that bio-inspired learning is viable becomes unverifiable; paradigm may be invalidated
    - Full kill review; explore acqui-hire at below-valuation terms
  - - Co-founder Departure
    - Any of the three co-founders exits before Series B close
    - Key-person concentration means team integrity assumption broken; thesis contingent on all three
    - Re-evaluate at 40–60% discount to prior valuation; negotiate enhanced governance terms
  - - Capital Exhaustion Before Milestone
    - Burn exceeds $180M before a demonstrable research milestone or Series B close
    - Capital efficiency assumption broken; $1.5B entry price no longer justified by execution signal
    - Bridge or wind-down discussion; acqui-hire exploration
  - - Government Compute Restriction
    - BIS, executive order, or allied-nation restriction on frontier AI compute imports or exports affecting US labs
    - GPU access constraint threatens research continuity; compute thesis broken
    - Legal review of compliance pathway; valuation adjustment for restricted access
  - - Series B Failure
    - Unable to raise a Series B at ≥$3B valuation by Q4 2027
    - Market validation of research progress gone; seed investors cannot build valuation progression
    - Prepare acqui-hire track; negotiate preferential terms for follow-on
  notes: Triggers are non-exhaustive; each should be evaluated in context of contemporaneous market conditions.
  claimRefs:
  - CV025
  - CV033
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Research Pipeline
    - No peer-reviewed publication, arXiv pre-print, or internal whitepaper has been publicly released as of June 2026
    - The entire $1.5B valuation rests on an unvalidated scientific paradigm; no objective benchmark possible without published
      work
    - Founders to provide pre-print or internal research whitepaper before any follow-on commitment
  - - Burn Rate and Runway
    - Compute spend plan and explicit runway calculation not publicly disclosed
    - $180M at $50–200M per training run implies 1–3 experiments; timeline to Series B is unknown without burn data
    - Request investor data room; CFO or controller call to confirm monthly compute allocation
  - - IP Ownership and Prior-Employer Agreements
    - No filed patents identified; prior-employer IP clearance for Neuralink and Prod IP not confirmed
    - Litigation risk elevated if bio-inspired research borrows from prior employers' IP; affects defensibility
    - Outside IP counsel review of employment agreements for all three co-founders
  - - Product Roadmap
    - No commercial product roadmap, design partner list, or first-product milestone has been publicly announced
    - Path from research to revenue is entirely speculative without a stated plan
    - Request bridge document from founders describing research-to-product pathway and target vertical
  - - Corporate Governance
    - No board composition, formal governance structure, auditor, or investor-seat terms publicly disclosed
    - Eleven-employee company without formal board increases governance risk for minority investors
    - Review board seat terms, observer rights, and protective provisions in term sheet or subscription agreement
  - - Team Retention
    - No equity vesting schedule, employment agreement terms, or retention plan publicly available
    - Departure of any co-founder before Series B would materially impair the thesis and investor position
    - Request standard four-year vesting schedules with cliff confirmation for all co-founders
  notes: Diligence asks are based on publicly available information gaps as of 2026-06-30.
