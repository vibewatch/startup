companyProfile:
  summary: >-
    Flapping Airplanes is a San Francisco-based foundational AI research lab founded in 2025 by Ben Spector,
    Asher Spector, and Aidan Smith. The company is pursuing a contrarian thesis that biologically inspired
    learning can make advanced AI models dramatically more data efficient than today's frontier transformer
    systems. Publicly, the company has emerged only with a January 2026 seed round and investor-backed
    statements about its long-horizon compute-intensive research agenda; as of the run date it has not
    disclosed revenue, shipped a commercial product, or published benchmarked research results.
