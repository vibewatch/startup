  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Target Verticals
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes has publicly articulated three primary target verticals for eventual commercialization:
              autonomous robotics, scientific drug discovery and life sciences, and enterprise AI infrastructure. The
              company's fundamental research thesis — that data-efficient AI training can match or exceed the
              performance of brute-scale models while consuming a fraction of labeled data — has natural product-market
              fit in domains where labeled data is structurally scarce and expensive to generate.

              Autonomous robotics is the most compelling near-term target. The International Federation of Robotics
              reported a record 553,000 industrial robot installations in 2023, yet programming robots for novel
              environments remains data-intensive and brittle. A data-efficiency breakthrough would compress programming
              cycles and reduce demonstration requirements by orders of magnitude.

              Drug discovery and life sciences represent a second high-value target. Clinical trial data is scarce,
              expensive, and regulated, making any advance in few-shot molecular or biological representation learning
              directly commercially valuable. Academic literature (arXiv 2304.15004) already demonstrates measurable
              efficiency gains in molecular property prediction tasks.

              Enterprise AI infrastructure — broadly defined as foundation models and APIs for productivity workflows —
              is a third stated vertical. However, co-founder Asher Spector has explicitly deprioritized early
              enterprise contracting, stating directly that signing contracts would distract from core research.
              Government and defense agencies (DARPA, NSF, DIU) constitute a fourth organic segment through research
              grants or specialized procurement, though procurement cycles are measured in years.

              The enterprise generative AI software market is projected by Grand View Research to grow at a CAGR
              exceeding 35% through 2030, and IDC estimates total AI infrastructure spending will exceed $200 billion
              globally by 2027 — providing favorable macro context for any eventual commercialization, though the gap
              between current research stage and first revenue is ungated and undisclosed.
