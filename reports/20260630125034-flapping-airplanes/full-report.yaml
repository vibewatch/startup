      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: |
              Flapping Airplanes' moat is presently more narrative than operational. The strongest elements
              are founder density, access to elite investors, and permission to spend years on hard research
              without near-term revenue pressure. A $180 million seed round gives the company unusual runway
              for a lab of roughly seven people, and the GV/Sequoia/Index/Menlo coalition is a strong signal
              that sophisticated capital wants exposure to a bet against scale orthodoxy. FP003 captures that
              clearly: the company has ample funding runway and unusually concentrated talent for its size.
              But those are inputs, not proof of a durable technical moat.

              TP003 shows why the moat can erode quickly if research output stays private. The company has no
              published papers, models, benchmarks, patents, pricing, or product surface that outsiders can
              test. That keeps intellectual property hidden, but it also means there is no public artifact to
              defend, no benchmark to lead, and no trust layer to compound. Meanwhile, three of the five
              closest alternative-architecture peers—Sakana AI, Liquid AI, and Imbue—already have product or
              deployment evidence accumulating in the market. If one of those labs proves a commercially
              useful non-standard architecture before Flapping Airplanes publishes, the market may conclude
              that Flapping Airplanes was directionally right but strategically late.

              The more durable counterforce comes from incumbents. OpenAI, Anthropic, and Google DeepMind are
              not just model builders; they are distribution systems with pricing, tooling, safety posture,
              and customer relationships. Because switching costs between transformer APIs are low, any
              breakthrough that Flapping Airplanes eventually ships could be copied, wrapped, or countered by
              incumbent platforms faster than a pure research lab can build a full stack. The adverse
              evidence is therefore not that Flapping Airplanes is obviously wrong. It is that no
              alternative-architecture lab has yet demonstrated frontier-level general performance against
              the leading transformer labs, and no public roadmap yet proves that such a reversal is near-
              term. That makes commercialization timing, publication cadence, and proof generation the core
              diligence questions.
