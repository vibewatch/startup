              The single largest operational risk is compute concentration. Per TBPN Digest, the entire $180M seed raise
              is "primarily for compute," meaning research progress and company survival are directly coupled to GPU
              market dynamics. Epoch AI analysis shows frontier AI model training costs have grown 2.4× per year since
              2016 and are projected to exceed $1B per training run by 2027, with hardware costs comprising 47–67% of
              total development expenditure. Flapping Airplanes' data-efficiency thesis is intended to reduce these
              costs, but the thesis has not yet been validated at scale—until a breakthrough is demonstrated the company
              faces full exposure to compute inflation and cloud infrastructure pricing.

              Intellectual property security presents a secondary operational risk. With 11 employees as of January
              2026, including high-school prodigies and college students hired on non-standard terms, IP ownership
              agreements may not be as tightly documented as at larger organizations. No public safety, security, or
              data-protection certifications (SOC2, ISO 27001, or equivalent) have been disclosed. The unconventional
              talent model—hiring people "who have not yet been indoctrinated into the dogma of scale" per the GV
              post—while strategically intentional, reduces the pool of experienced researchers familiar with IP
              hygiene, data provenance procedures, and security protocols.

              Open-source AI is a structural competitive risk: if a comparable data-efficient approach is published by a
              well-funded lab or academic group before Flapping Airplanes produces a commercial product, the company's
              unique research advantage could erode quickly. The CB Insights AI 100 2026 report identifies companies
              with proprietary, non-replicable data as having the most durable moats—pure research labs without
              production data are inherently more vulnerable to being replicated or pre-empted.
