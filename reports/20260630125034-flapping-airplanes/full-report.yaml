      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes operates a pure research-expenditure cost structure with no cost-of-goods-sold (COGS),
              no customer-acquisition costs (CAC), and no revenue-linked variable costs. The primary cost drivers are
              researcher compensation, compute infrastructure, and operational overhead, all funded entirely from equity
              capital. According to Epoch AI's cost modeling across 45 frontier AI models, hardware and energy costs
              represent 47–67% of total development costs, R&D staff 29–49%, and energy an additional 2–6%. Ben Spector
              noted in a TechCrunch interview that fundamental research is "paradoxically cheaper" than incremental work
              because radical ideas can be tested and failed at small scale without running the full scaling ladder —
              meaning early-stage burn may be lower than the eventual production-scale burn if research proves
              successful. However, Epoch AI also finds that the amortized hardware and energy cost for frontier model
              training runs has grown at 2.4x per year since 2016, with the largest runs projected to exceed $1 billion
              by 2027. If Flapping Airplanes eventually pursues a scaled training run, compute costs alone could consume
              most of the seed capital. Research staff costs are substantial: GV describes a team of "high-school
              prodigies, math olympians, and gritty researchers" hired at non-standard profiles, which may allow
              below-market base salaries but still requires competitive total compensation to attract world-class AI
              talent. Gross margin, working capital requirements, capex plans, and service-delivery cost structures are
              all undefined because there is no commercial product.
