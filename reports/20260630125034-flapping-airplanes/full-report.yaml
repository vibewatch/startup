            body: >
              Flapping Airplanes represents an unusual financial profile even within the AI research-lab sector: $180M
              raised at a $1.5B pre-revenue valuation, with no commercial product, no customers, and a fully open-ended
              timeline to monetization. The valuation is supported entirely by founder pedigree and research thesis, not
              by any financial metrics. Multiple independent observers have noted that the 2025–2026 market environment
              has produced a cohort of billion-dollar-valued AI labs with no products or revenue, creating a
              structurally unusual capital formation pattern. The company's financial strength is the quality and scale
              of its capitalization: $180M provides meaningful runway even at high research burn rates, and the investor
              syndicate (GV, Sequoia, Index, Menlo) provides follow-on capital credibility. The financial weakness is
