              Spector described the eventual revenue model as one in which research outputs would be licensed or
              deployed through partnerships rather than a direct SaaS subscription product — a model analogous to
              technology licensing (Bell Labs model) or AI API access (Anthropic, Mistral, Cohere model). The most
              logical first commercial vehicle would be a research-collaboration agreement with a pharma company, a
