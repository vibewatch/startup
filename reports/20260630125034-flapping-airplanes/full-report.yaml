  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >
      Conceptual customer lifecycle from initial research awareness through first commercial contract and enterprise
      expansion, showing the sequential milestones Flapping Airplanes must clear before any stage generates revenue.
    data:
      nodes:
        - id: research-awareness
          label: Research Awareness
          stage: Pre-commercial
          note: >
            Researchers, investors, and enterprise AI leads discover Flapping Airplanes through published research,
            press coverage, and conference presentations.
        - id: technical-evaluation
          label: Technical Evaluation
          stage: Pre-commercial
          note: >
            Prospective adopters assess whether research outputs are applicable to their specific data-scarcity problem;
            typically requires a published benchmark or white-paper.
        - id: partnership-outreach
          label: Strategic Partnership Outreach
          stage: Commercial-exploration
          note: >
            Company identifies 2–3 high-fit target partners in priority verticals (robotics, pharma, enterprise AI) and
            initiates confidential discussions.
        - id: pilot-design
          label: Proof-of-Concept Design
          stage: Pilot
          note: |
            Co-design of limited test deployment; may involve NDA, technical collaboration, and data-sharing agreement.
        - id: pilot-validation
          label: Pilot Outcome Validation
          stage: Conversion
          note: >
            Partner evaluates model performance on proprietary data; if measurable improvement over baseline is
            demonstrated, partner considers commercial contract.
        - id: first-contract
          label: First Commercial Contract
          stage: Revenue
          note: >
            Licensing, API access, or custom model agreement executed; first revenue event and NRR clock begins;
            retention and expansion metrics become measurable.
        - id: expansion
          label: Multi-Team Enterprise Expansion
          stage: Growth
          note: >
            Additional use cases, teams, or geographies within the same enterprise; expansion NRR accrues; Flapping
            Airplanes becomes embedded in production workloads.
    claimRefs:
      - CU005
      - CU018
      - CU025
