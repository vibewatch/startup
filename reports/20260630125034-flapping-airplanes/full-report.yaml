chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Position
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes is a foundational artificial-intelligence research laboratory headquartered in San
              Francisco, California. The company was founded in 2025 and publicly launched on January 28–29, 2026, with
              the simultaneous announcement of a $180 million seed round. Its stated mission is to develop AI systems
              that can learn at human-level capability while consuming orders of magnitude less training data than
              current frontier models—a goal the founders frame as solving the "data efficiency problem."


              The company name is a deliberate philosophical signal: early aviation pioneers who tried to copy birds by
              flapping wings failed; real flight came from understanding the underlying physics and building
              structurally different solutions. Ben Spector has described the current AI paradigm as analogous to the
              flapping-wing approach and Flapping Airplanes as seeking the equivalent of the fixed-wing airfoil for
              intelligence. The research agenda is accordingly not about mimicking the brain but drawing inspiration
              from it: Aidan Smith, who spent three years at Neuralink, describes the brain as "an existence proof" that
              algorithms beyond transformer-plus-gradient-descent exist.


              As of June 2026, Flapping Airplanes has released no commercial product, model weights, API, or published
              benchmark results. Asher Spector acknowledged in February 2026 that the company cannot provide a
              commercialization timeline because fundamental research goals have to come first. Capital raised is to be
              deployed primarily for compute to support long-horizon experimental work, with the founders estimating
              that promising ideas may take 5–10 years to mature. The company has publicly shared an email for
              researchers (hi@flappingairplanes.com) and a Hugging Face organization page, but both are sparse on
              technical content.
