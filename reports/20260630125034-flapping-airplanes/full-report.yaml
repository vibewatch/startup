  - id: FR001
    title: Risk Severity Heatmap
    type: matrix
    layout: standard
    summary: Likelihood-versus-impact matrix of principal risks facing Flapping Airplanes, organized by severity tier.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
      rows:
        - label: Rare
          values:
            - Regulatory compliance (GDPR, CCPA pre-commercial)
            - AI copyright litigation (industry-wide, not company-specific)
            - Compute unavailability or GPU price spike
        - label: Unlikely
          values:
            - Minor governance structure gaps
            - Fundraising market conditions tighten
            - Research paradigm produces no validatable result
        - label: Possible
          values:
            - Academic partnership disruption
            - IP dispute from prior employer agreements
            - Key researcher attrition to Big Tech
        - label: Likely
          values:
            - Open-source tooling license change
            - Investor sentiment shift at Series A
            - Government model-release restriction (June 2026 precedent)
        - label: Near-Certain
          values:
            - Export controls compliance gap (minor)
            - Training data provenance challenge
            - Co-founder departure (any of three)
    approximationNotes: >-
      Likelihood tiers (rows, top=Rare to bottom=Near-Certain) and impact ratings are qualitative, based on available
      public evidence and comparable neolab precedents as of June 2026.
    claimRefs:
      - CR011
      - CR016
      - CR020
      - CR026
