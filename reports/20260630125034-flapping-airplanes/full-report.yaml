      - number: '1.3'
        title: Funding History, Investors, and Financial Structure
        blocks:
          - type: paragraph
            body: >
              Flapping Airplanes raised $180 million in a seed round that closed in January 2026 at a reported $1.5
              billion post-money valuation, making it one of the largest seed rounds in AI history for a pre-product
              company. The round was co-led by GV (Google Ventures), Sequoia Capital, and Index Ventures, with
              participation from Menlo Ventures. Each lead investor published a dedicated investment announcement
              articulating why they backed the company.


              GV's post, titled "Better Wings: Why We Invested in Flapping Airplanes," describes the investment as a
              "coalition of conviction" against the "scale orthodoxy" that has come to dominate AI development. GV noted
              that the same firms backing incumbent AI labs are also backing Flapping Airplanes—a signal they read as
              evidence of the field's belief that major gains remain available outside the dominant paradigm. Sequoia
              partner David Cahn characterized the round as a bet on the "research paradigm" versus the "scaling
              paradigm," arguing that AGI is likely 2–3 fundamental breakthroughs away, not a function of raw compute
              scaling.


              Index Ventures' post articulates the personal relationships that drove their conviction: partner Mark Xu
              knew Asher from Harvard; partner Shardul Shah met Ben in a chance encounter at Chris Ré's office and
              walked away calling him "a sensation." Index describes the company as assembling an "Avengers-style
              lineup" with specific recruitable superpowers.


              The capital is earmarked primarily for compute to support fundamental research. No secondary transactions,
              debt facilities, or equity crowdfunding have been reported. No revenue, products, or ARR exist. There are
              no known disclosed governance details beyond the three co-founders as the founding management team. The
              round's $1.5 billion valuation—with 11 employees and no product—has drawn explicit criticism in industry
              coverage as emblematic of FOMO-driven neolab investing.
