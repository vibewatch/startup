      - number: '3.2'
        title: Peer Lab Profiles
        blocks:
          - type: paragraph
            body: |
              The direct-peer set is defined less by revenue overlap than by thesis similarity. Sakana AI is
              the clearest proof point that an alternative-architecture lab can move beyond research posture:
              it was founded in 2023 by ex-Google researchers, has raised a $135 million Series B at a
              $2.65 billion valuation, and is the only lab in this cohort with meaningful enterprise
              deployments already visible in public reporting. Liquid AI offers a different variant of the
              same contrarian instinct. As an MIT CSAIL spinoff, it argues that liquid neural networks and
              hybrid architectures can deliver better deployment characteristics than pure transformers, and
              it pairs that thesis with actual edge-device partnerships such as Mercedes-Benz and Shopify.
              Imbue is further from Flapping Airplanes technically, but it competes for the same capital and
              talent pool by pitching reasoning as the bottleneck and by shifting toward productized coding
              agents.

              Two adjacent labs matter because they show where alternative architectures can win without
              attacking general-purpose language modeling head-on. Physical Intelligence has assembled an
              enormous funding base around robotics and embodied AI, yet still has no commercialization
              timeline. EvolutionaryScale has focused on protein language models and can point to a concrete
              scientific artifact, esmGFP, rather than a general-market product. Those examples matter for
              Flapping Airplanes because they show that investors will support thesis-driven labs for years,
              but public proof tends to arrive first in narrower verticals where success criteria are easier
              to demonstrate.

              TP002 makes the profile differences stark. Flapping Airplanes is the least commercialized entry
              in the set: no API, no papers, no published safety or trust framework, and no public benchmark
              output. That does not invalidate the thesis, but it does mean the market is underwriting almost
              entirely on founder quality and investor conviction. Peers such as Sakana and Liquid have
              already converted a research narrative into product surface area, while OpenAI and Anthropic
              have moved so far down the commercialization curve that they function less as peers than as the
              default operating environment into which every challenger must eventually insert itself.
