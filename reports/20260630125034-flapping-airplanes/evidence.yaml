  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Complete milestone log for post-launch period (Feb–June 2026) including any research conference presence, hires,
      or partnership announcements
    whyItMatters: >-
      Pre-commercial labs typically have sparse public milestone data; the timeline relies on press coverage which may
      omit internal progress
    diligencePath: Request a company-authored milestone document or board update from management covering H1 2026
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: product status
    missingEvidence: >-
      Technical roadmap, research publication plan, or any checkpoint demonstrating progress on data-efficient
      architectures
    whyItMatters: >-
      Without any published research artifacts, it is impossible to independently validate the core technical thesis or
      timeline to commercial relevance
    diligencePath: >-
      Request pre-publication research previews, internal benchmark results, or architecture overview from management
      during diligence
    relatedQuestionRefs:
      - QO011
      - QO020
  - type: private-evidence-only
    severity: material
    topic: team
    missingEvidence: Current headcount, senior research team roster, and key person departure history since January 2026
    whyItMatters: >-
      Talent concentration risk is central to the investment thesis; any attrition from the founding team would
      materially alter the risk profile
    diligencePath: Request current org chart, retention agreements, and any departures post-launch directly from company
    relatedQuestionRefs:
