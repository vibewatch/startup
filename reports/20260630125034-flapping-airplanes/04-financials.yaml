callouts:
  - calloutType: risk
    title: Open-Ended Research Timeline is the Primary Financial Risk
    body: >
      The central financial risk is the absence of any milestone-to-revenue event on the horizon.
      Unlike SaaS or marketplace companies where seed capital buys growth metrics, Flapping Airplanes'
      seed buys pure R&D time. If the research takes longer than expected — or if compute costs inflate
      materially — the company may need to raise a Series A before demonstrating any commercial output,
      at which point investor expectations will have evolved significantly from the current "bet on the
      thesis" mentality.
    claimRefs:
      - CI032
      - CI028
      - CI016

  - calloutType: strength
    title: $180M Seed Provides Substantial Research Runway
    body: >
      At proxy burn rates for comparable AI research labs, the $180M seed represents 2–5 years of
      operation without any commercial revenue. This is an unusually long pre-commercialization
      runway for a private company, giving the research team time to validate or discard multiple
      research directions. The SEC Form D confirms the round was essentially fully subscribed with
      79 direct investors and a broad institutional syndicate, reducing re-financing risk in the
      near term.
    claimRefs:
      - CI001
      - CI005
      - CI018

  - calloutType: assumption
    title: All Financial Metrics Are Undisclosed — Estimates Only
    body: >
      Every numerical estimate in this chapter beyond the SEC-filed round amount is a proxy derived
      from comparable AI research lab benchmarks. The company has not disclosed headcount, burn rate,
      runway, or any forward-looking financial guidance. Investors and diligence teams should treat
      all non-SEC-sourced figures in this chapter as illustrative scaffolding requiring direct
      verification in a data room.
    claimRefs:
      - CI019
      - CI023
      - CI024

