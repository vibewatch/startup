          detail: Required precursor to any commercial activity; timeline unknown
        - id: prototype
          label: Model prototype / proof-of-concept
          detail: First publicly demonstrable model; no launch date announced
        - id: pilot
          label: Paid pilot or research partnership
          detail: First revenue event; contingent on prototype completion
        - id: product
