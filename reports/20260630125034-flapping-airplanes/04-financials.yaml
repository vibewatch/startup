  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >
        Actual monthly cash burn rate and cash-on-hand as of June 2026; not publicly disclosed
        by company or investors.
      whyItMatters: >
        Burn rate determines the true runway and the next re-capitalization window. Without it,
        investors cannot assess capital adequacy or underwrite the next round.
      diligencePath: >
        Request audited or unaudited cash flow statement, most recent board monthly update, and
        CFO bridge table showing opening/closing cash and monthly burn by category.
      relatedQuestionRefs:
        - QI006
        - QI008
        - QI025

    - type: private-evidence-only
      severity: blocking
      topic: use-of-funds
      missingEvidence: >
        Planned use of funds by category (researcher salaries, compute, infrastructure, overhead)
        and any internal budget model or financial plan.
      whyItMatters: >
        Without a use-of-funds breakdown, it is impossible to assess whether the seed capital is
        adequate for the intended research scope or evaluate capital efficiency.
      diligencePath: >
        Request use-of-funds deck, internal operating budget, and any board-approved annual plan.
      relatedQuestionRefs:
        - QI023
        - QI025

    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: >
        Current headcount and team composition breakdown (research vs operations vs management)
        as of June 2026; no public source provides this data.
      whyItMatters: >
        Research team size is the primary driver of burn rate; without it all burn estimates
        are proxy-based with wide uncertainty ranges.
      diligencePath: >
        Request current org chart and headcount summary from CEO or HR in data room.
      relatedQuestionRefs:
        - QI006
        - QI018

    - type: private-evidence-only
      severity: material
      topic: revenue-model
      missingEvidence: >
        Any internal product roadmap, commercialization plan, or milestone-to-revenue model
        that describes expected path from research to commercial product.
      whyItMatters: >
        Without a commercialization roadmap, investors cannot assess the likelihood or timing
        of a revenue event; the investment is a pure research thesis bet.
      diligencePath: >
        Request any internal deck covering product roadmap, commercialization milestones,
        and earliest expected revenue date from management team.
      relatedQuestionRefs:
        - QI005
        - QI012
        - QI020

    - type: missing-source
      severity: material
      topic: gross-margin-model
      missingEvidence: >
        Any pricing model, cost-of-revenue structure, or gross-margin estimate for a hypothetical
        data-efficient AI model product; none exists as product is undefined.
      whyItMatters: >
        Gross margin structure determines whether the eventual business can fund itself or
        requires continued capital injection post-commercialization.
      diligencePath: >
        Build proxy gross margin model in diligence using comparable API/SaaS AI lab economics
        from Epoch AI benchmarks and public data from Anthropic API pricing.
      relatedQuestionRefs:
        - QI012

