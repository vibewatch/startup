  - id: milestones-trajectory
    title: Milestones, Adverse Events, and Trajectory
    body: >
      Flapping Airplanes' chronology is brief but consequential. The company traces its effective
      origin to the founders' academic and incubator work—Ben's development of ThunderKittens
      and Prod portfolio outcomes, Asher's statistics PhD and debate background, and Aidan's
      three-year Neuralink tenure—before the co-founders quietly converged in late 2025 to start
      the lab. Ben formally left Stanford's PhD program on leave in September 2025. The company
      was privately founded in 2025 and publicly launched on January 28–29, 2026, with the
      announcement of the $180 million seed round.


      No adverse regulatory, litigation, or governance events have been reported publicly as of
      June 2026. The principal adverse dimension is the critical commentary about pre-product
      valuations: techiexpert.com described the $1.5 billion valuation as reminiscent of the
      dot-com bubble, and financeand.money placed Flapping Airplanes prominently in a roundup
      of six AI labs with no products, noting that "most of them may never produce anything that
      justifies their valuations." Foundation Capital's Ashu Garg specifically warned that most
      neolabs will not cross the technical threshold required to matter and will end up with
      results only incrementally better than existing models.


      The company's own communications acknowledge the uncertainty: Asher Spector said in the
      February 2026 TechCrunch interview that "I wish I could give you a timeline… We don't know
      the answers." The lab presented its GPU virtualization work at Sequoia's AI Ascent conference,
      and Ben indicated that the company was building new hardware primitives to run data-efficient
      algorithms more efficiently—but no papers, benchmarks, or checkpoints have been released
      as of the run date. Leadership has signaled that research artifacts would be released "soon,"
      but no specific schedule has been disclosed.
