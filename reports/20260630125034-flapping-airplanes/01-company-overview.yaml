  - id: leadership-team
    title: Leadership, Founders, and Team Composition
    body: >
      The founding team is intentionally unconventional. Ben Spector, the eldest and primary public
      face of the company, was completing a PhD in computer science at Stanford University under
      Professor Chris Ré in the Hazy Research Lab when he left in September 2025, roughly eight
      months before expected completion, to co-found Flapping Airplanes. His academic work focused
      on efficient ML systems, GPU kernel optimization, and hardware-aware acceleration—he led the
      development of ThunderKittens, a framework for writing fast AI kernels that achieved
      performance competitive with FlashAttention-3. Ben earned his BS and MEng from MIT, founded
      Prod (a non-profit startup accelerator) while an undergraduate, and was named a 2023 Hertz
      Foundation Fellow. Index Ventures' Shardul Shah described an impromptu two-hour walk with
      Ben at Stanford as making him immediately say "Ben Spector is a sensation."


      Asher Spector, Ben's older brother by about a year, recently completed a PhD in Statistics at
      Stanford. A former North American debate champion, Asher's analytical and structuring
      abilities complement Ben's more imaginative, systems-oriented approach. Index Ventures' Mark
      Xu knew Asher from their time as students at Harvard, and the combination of their
      independent relationships with the Spectors is what drew Index to co-lead the round.


      Aidan Smith is a Thiel Fellow who spent three years as a brain-computer interface software
      engineer at Neuralink—building ML research for neural data and writing neuralink.com—while
      simultaneously attending Georgia Tech. His GitHub profile describes him as "making airplanes
      flap," and he is listed as Age 21 in early press coverage. His deep exposure to how the
      brain encodes and transmits information directly informs Flapping Airplanes' bio-inspired
      research perspective.


      The broader team at launch numbered 11 people, including an 18-year-old high-schooler.
      The company has also confirmed team members who are International Mathematical Olympiad,
      International Olympiad in Informatics, and International Physics Olympiad medalists, plus
      U.S. debate champions. Flapping Airplanes recruits for raw creative ability over credentials,
      explicitly seeking individuals who have not "been indoctrinated into the dogma of scale."
      Andrej Karpathy, former Director of AI at Tesla and a prominent industry figure, serves as
      an advisor; Jeff Dean, former Google AI chief, has invested as an angel.
