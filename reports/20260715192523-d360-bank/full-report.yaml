      - number: '7.3'
        title: Financial, people risk and mitigations
        blocks:
          - type: paragraph
            body: >-
              Financially, D360 carries the classic scaling-digital-bank risk set: ongoing burn, capital intensity and a
              multi-year path to profitability. The specific margin risk is that paying premium Sanabil profit rates to
              gather deposits compresses net interest margin relative to low-cost incumbents, while credit and
              financing-loss exposure grows as the financing book expands — Fitch and industry analysts characterise
              sector credit and margin conditions as manageable but tightening. If profitability is delayed, D360 faces
              financing-dependency and dilution risk at its next round. Crucially, the absence of audited financials —
              no disclosed revenue, margin, NPL ratio, capital-adequacy ratio or deposit-concentration data — materially
              elevates diligence risk and prevents independent verification of any of these exposures; that opacity is
              itself the largest residual uncertainty in the report. People and execution risk centres on key-person
              dependence on a high-profile CEO and a small senior team, plus intense competition for banking-technology
              and compliance talent in the Saudi market. Against these, the mitigations are real if unquantified: strong
              post-raise capital, SAMA oversight, aligned Vision 2030 policy support, committed strategic shareholders,
              and vendor SLAs. The risk heatmap ranks licence action and cyber/fraud as the highest-impact risks, with
              margin compression and retention/dormancy as the most likely, and the kill-criteria table ties each to a
              monitorable trigger — a SAMA sanction, a capital breach, sustained dormancy, a material security incident,
              or runway falling below twelve months without a profitability path. The investment implication is that
              D360's upside is real but underwritten on trust; closing the financial and reliability disclosure gaps is
              the precondition for converting these qualitative risks into quantified ones.
