  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              D360's investment case is a genuine two-sided one. The thesis is compelling on demand and momentum: a
              young, digitally-native Saudi market with near-universal mobile use, powerful Vision 2030 policy
              tailwinds, credible PIF-linked and Derayah backing, first-mover full-licence status, and one of the
              fastest customer ramps in the regional cohort — roughly three million customers and SAR 3 billion in
              deposits inside about eighteen months of launch. State backing further supports valuation resilience and
              exit optionality. The anti-thesis is equally clear: the price rests on trust rather than proof. With no
              disclosed revenue, margin, retention or capital-adequacy data, the valuation capitalises traction whose
              quality is unverified, and global neobank multiples have compressed from their 2021 peaks, tempering
              optimistic comparables. Weighing these, the recommendation is to watch/track with medium confidence and a
              medium-high risk rating: the business is attractive and the backing is real, but a conviction commitment
              should await disclosure of the unit economics. The recommendation-logic figure shows how fast traction,
              undisclosed economics, competitive/margin risk and a full valuation combine into that conditional stance,
              and the investment-KPI scorecard rates market attractiveness high, customer proof medium, moat durability
              and unit-economics visibility low, and valuation fair-to-stretched. The thesis/anti-thesis table pairs
              each argument with the specific evidence that would move it — almost all of which is currently withheld.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV023
