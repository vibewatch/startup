      - number: '1.3'
        title: Funding, ownership and valuation
        blocks:
          - type: paragraph
            body: >-
              In June 2026 D360 Bank's shareholders approved a 38.89% capital increase that lifted registered capital
              from SAR 2,100,000,000 to SAR 2,916,666,670. The increase issued 72,916,667 new shares at SAR 20.57 each,
              raising roughly SAR 1.5 billion of fresh equity, and separately created about 8.75 million employee-share
              (ESOP) shares worth close to SAR 87.5 million. Press coverage places the pre-money valuation near SAR 4.5
              billion (~US$1.2 billion) and the post-money valuation at approximately SAR 6 billion (~US$1.6 billion),
              and characterises the round as a Series A to fund lending and expansion. The transaction was disclosed to
              the market through Derayah Financial's Saudi Exchange (Tadawul) announcement. Derayah Financial is the
              largest single shareholder, its stake diluting from roughly 20.4% to about 16.35% while it subscribed an
              additional SAR 100 million; PIF-linked public-sector entities and strategic institutional investors hold
              the balance. The raise made D360 the largest Saudi digital bank by registered capital. The stakeholder map
              summarises these holdings and the diligence asks around the still-private full capitalization table.
