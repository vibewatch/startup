  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              D360's customer base is a broad mass-market Saudi retail cohort weighted toward youth and the
              digitally-native, with an emerging small-business segment layered on top. In segmentation terms the retail
              customer is simultaneously buyer, user and payer, while SME accounts introduce an owner who plays those
              roles for a business; use cases span everyday banking, Sanabil savings, cards, transfers and low-cost
              remittances. The adoption trajectory is the report's single strongest proof point. Within months of its
              early-2025 public launch D360 reported roughly one million customers, and by April 2026 it reported
              approximately three million customers and around SAR 3 billion in deposits — close to a threefold increase
              in about a year and one of the fastest ramps in the regional digital-bank cohort. Importantly, the
              parallel growth of deposits alongside accounts indicates genuinely funded adoption rather than empty
              sign-ups. That said, the figures come without denominators: there is no disclosure of the
              active-versus-registered ratio, the balance distribution, or the churn-adjusted net-add rate, and the
              arithmetic implied average balance of roughly SAR 1,000 per customer hints that a large share of accounts
              may be low-balance or secondary rather than primary. Financial-inclusion and digital-payment data confirm
              a large, reachable addressable pool, but the retail-versus-SME split of D360's own base is not public. The
              segmentation and trajectory tables therefore pair each disclosed figure with the specific missing
              denominator a diligence process would need to interpret it.
