      - number: '4.3'
        title: Capital adequacy, financing dependency and verdict
        blocks:
          - type: paragraph
            body: >-
              The clearest financial facts concern capital. In June 2026 D360 completed an approximately SAR 1.5 billion
              equity capital increase, lifting paid-up capital to roughly SAR 2.9 billion and setting a post-money
              valuation near SAR 6 billion (about US$1.6 billion) — a Series-A-style step-up corroborated by the
              exchange filing and multiple outlets. That capital both strengthens the regulatory base and signals
              continued financing dependency: like any bank scaling its balance sheet, D360 relies on shareholder equity
              until net profit income covers its cost base. The capital chapter's chronology is owned by Company
              Overview; here the financing facts are restated as local claims tied to the filing and news sources.
              Benchmarks sharpen the picture. Saudi banks earn net interest margins of roughly 2.8-3.0% on very large,
              low-cost deposit bases and the sector is highly profitable and well-capitalised; a challenger paying
              premium Sanabil rates to gather deposits faces structurally tighter early margins, and digital banks
              globally typically absorb several years of losses before profitability. PIF-linked ownership and Vision
              2030 policy support provide patient, well-resourced backing that de-risks the financing path, and no
              material debt or project-finance obligations are disclosed. The verdict is therefore two-sided: capital
              strength, credible backing and encouraging early traction on one side; on the other, the complete absence
              of audited financials — revenue, margin, burn and runway — which is the central diligence blocker. Until
              those private metrics are obtained, revenue quality and the path to profitability cannot be verified, and
              the capital-adequacy and gaps tables set out exactly what to request.
