  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              D360's single largest risk category is regulatory, because its entire franchise rests on a SAMA banking
              licence. It is fully prudentially regulated and supervised, which brings capital-adequacy, AML/KYC/CTF,
              consumer-protection, and — via the Personal Data Protection Law (PDPL) — data-privacy obligations,
              alongside Sharia-governance requirements for its Sanabil and financing products. Any enforcement action,
              capital-ratio breach or adverse change to licence conditions would be existential, which is why these
              entries top the severity-ranked register. Saudi legal and regulatory guides confirm SAMA's active,
              prescriptive supervision of fintech and digital banking and highlight data-localisation and privacy
              enforcement as rising compliance costs. A specific competitive-regulatory dynamic sharpens the picture: by
              licensing STC Bank and, most recently, Vision Bank, SAMA has ended D360's first-mover exclusivity, so the
              regulatory environment that once conferred scarcity value now enables direct rivals. No public record of
              material litigation or enforcement against D360 was identified, which is reassuring but not equivalent to
              a clean confirmed record given limited disclosure. The register is explicitly partial: private compliance
              posture, capital-adequacy ratios and any confidential regulatory correspondence are not public, so several
              high-severity rows carry residual exposure that only data-room access can resolve. The dependency map
              places SAMA at the head of D360's critical relationships, underscoring that regulatory standing is not
              just a compliance matter but the foundation of the whole investment thesis.
            claimRefs:
              - CR002
              - CR003
              - CR004
