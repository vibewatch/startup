      - number: '6.2'
        title: Named proof, retention and satisfaction
        blocks:
          - type: paragraph
            body: >-
              Named, verifiable customer proof is intrinsically limited for a mass-market consumer bank, because its
              customers are millions of individuals rather than referenceable enterprises. The available proof is
              accordingly a modest mix: a documented customer case surfaced in a customer-reference source, ecosystem
              partnerships that extend reach (payments, remittances and card networks), aggregate Sanabil savings
              uptake, and a sizeable app-store reviewer base. The named-proof table compiles these with each row
              cross-referenced to at least two independent sources, and the proof matrix makes clear that while
              production maturity is high, outcome specificity and retention visibility are low — this is case- and
              reviewer-based evidence, not audited outcomes. Retention is the decisive gap. D360 discloses no churn,
              dormancy, NRR, GRR or cohort-retention data, so the retention table is largely nulls, and the cohort
              figure is explicitly illustrative rather than reported. Independent signals fill part of the vacuum but
              weakly and negatively: the iOS app rates around 3.9 out of 5 and uninstall-tracking sources suggest a
              meaningful share of downloads do not persist as active users. Taken together these raise a central adverse
              question — whether headline account growth overstates active, primary-relationship usage. Until D360
              provides active-user ratios and cohort retention, the quality of its impressive top-line growth cannot be
              confirmed, and the customer-journey map's stage-to-stage conversion remains unquantified.
