      - number: '3.2'
        title: Capability, pricing, distribution and trust
        blocks:
          - type: paragraph
            body: >-
              On capability, incumbents lead decisively on product depth — full loan, card, wealth and corporate suites
              — while the digital banks are narrower but sharper on the specific jobs younger and SME customers value:
              fast digital account opening, fee-light transacting and competitive savings yields. D360 markets
              Sharia-compliant Sanabil savings products whose profit rates are positioned above what incumbents
              typically pay, which is the core mechanism by which a digital challenger pulls deposits away from banks
              encumbered by legacy cost bases. On pricing, the digital banks converge on a low-or-no monthly-fee model
              with free transfers, though competitors' complete fee tiers are not fully published, so the pricing table
              flags unknowns rather than inferring them. On go-to-market, the contrast is stark: STC Bank leans on
              telecom reach and the STC Pay base, incumbents on branch networks and entrenched salary-deposit
              relationships, and D360 on digital-first marketing to youth and SME segments. On trust and regulatory
              posture, all three digital banks operate under the same SAMA licence, but incumbents retain the deepest
              customer confidence and longest track records, a gap that slows deposit gathering for any new entrant.
              Switching costs — salary direct deposits, standing orders and loan ties — reinforce incumbency, though
              multi-homing is common: Saudi consumers routinely hold several banking apps and wallets at once, which
              cuts both ways by lowering the barrier to trying D360 while making primary-relationship capture harder.
              The capability matrix and positioning map summarise where each player is strong and where D360's
              youth-and-SME, high-yield, clean-UX wedge is genuinely differentiated versus merely comparable.
