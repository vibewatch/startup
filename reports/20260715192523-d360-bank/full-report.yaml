              whole-fintech lens drives the headline number by more than an order of magnitude. A defensible framing
              therefore treats the national fintech/payments pool as TAM, digital retail and SME banking as SAM, and
              D360's near-term penetration as SOM. The sizing-lens stack and the estimate-range figure make the
              divergence explicit and preserve the conflicting estimates rather than collapsing them into one
              false-precision TAM. A key caveat is that digital-only banking revenue remains small in absolute terms
              next to incumbent profit pools.
