  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product, modules and customer workflow
        blocks:
          - type: paragraph
            body: >-
              D360 is a branchless, mobile-first bank delivered through iOS, Android and web, and its product is best
              understood as a set of jobs a Saudi resident can complete entirely in-app. The flagship job is account
              opening: instead of a branch visit and paperwork, a customer verifies identity through the Kingdom's
              national digital-identity services (Nafath/Absher) and opens a fully-licensed account in minutes. From
              there the module set is a conventional retail bank rendered digitally — current accounts, Sharia-compliant
              Sanabil savings, mada debit and virtual cards with Apple Pay support, and instant local transfers over the
              SARIE and mada rails — plus an emerging SME-banking line for business accounts and payments. The workflow
              table maps each customer job to D360's solution and the measurable benefit (minutes versus days to open an
              account, instant low-fee transfers, immediate card issuance) while being candid about limitations:
              reliability and verification frictions surface in reviews, savings-rate tiers are not fully public, and
              card-reward and FX economics are undisclosed. The module-maturity map shows accounts, savings and cards as
              established while SME banking is still developing, which matches the roadmap emphasis and the traction
              milestones of roughly three million customers and SAR 3 billion in deposits reached in 2026. In short, the
              product surface is complete enough to run a primary banking relationship for a mass-retail customer, with
              SME depth the clearest area still being built out.
            claimRefs:
