chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, licence and launch
        blocks:
          - type: paragraph
            body: >-
              D360 Bank (البنك الرقمي 360) is a Riyadh-headquartered, fully-digital, Sharia-compliant bank and a Saudi
              joint-stock company. It was established on 15 February 2022 and operates without physical branches,
              serving customers entirely through its mobile app and web platform. The bank is consistently described as
              Saudi Arabia's first fully-licensed digital bank to commence full operations, distinguishing it from
              payment-app neobanks that lack a banking licence. Its regulatory path ran through the Saudi Central Bank
              (SAMA): after the digital-bank licensing process of 2021-2022, SAMA granted a no-objection to commence
              banking operations in late December 2024, and the bank launched services to the public in early 2025. D360
              is a direct instrument of Saudi Vision 2030's fintech strategy, which set out to license and grow domestic
              digital banks. The snapshot KPI table and milestone timeline below anchor the identity, licence and launch
              facts that later chapters treat as ground truth.
