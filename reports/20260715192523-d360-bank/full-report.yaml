      - number: '4.2'
        title: Traction, cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              D360's public traction is respectable for its age: roughly three million customers and about SAR 3 billion
              in deposits reported by April 2026, corroborated across multiple Saudi outlets. Beyond these two figures
              the private metrics that matter most for underwriting are absent — there is no audited revenue, net
              income, net interest margin, customer-acquisition cost, payback or cohort-retention disclosure. The cost
              structure of a digital bank is qualitatively different from an incumbent's: it is dominated by technology,
              cloud, compliance and customer acquisition rather than branch overhead, which can yield a structural
              cost-to-serve advantage once scaled but front-loads spend before revenue matures. The unit-economics table
              therefore reports the two disclosed metrics, an arithmetic implied deposits-per-customer of roughly SAR
              1,000 (which itself raises a balance-quality question about whether accounts are primary or low-balance
              secondary), and explicit nulls for CAC, payback and NIM. The unit-economics bridge is deliberately
              illustrative: indexing asset yield to 100 and subtracting premium deposit cost, technology and compliance,
              and acquisition spend shows why an early challenger paying above-market Sanabil rates can run a negative
              net margin during the land-grab phase. None of these figures are D360-reported; they exist to frame the
              shape of the problem and the questions diligence must answer, and the deposits-per-customer implication in
              particular should be verified against average-balance and active-account data.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI035
