  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization
        blocks:
          - type: paragraph
            body: >-
              As a licensed bank rather than a payments startup, D360's economics rest on classic banking mechanics
              adapted to a digital, Sharia-compliant model. Its primary revenue engine is net profit income — the spread
              between the return on financing assets and the profit paid to depositors on Sanabil savings products.
              Around this core sit fee-based streams: card interchange, payment and transfer fees, foreign-exchange
              margin, and an emerging SME-banking line carrying account, payment and financing fees. The consumer
              proposition is deliberately fee-light — free or low-fee current accounts paired with competitive savings
              profit rates — which shifts monetization toward the asset-side spread and interchange rather than account
              charges. This is the same low-friction pattern digital banks use to acquire price-sensitive, mobile-first
              customers, and it means revenue quality depends heavily on how profitably the roughly SAR 3 billion
              deposit base can be deployed. The revenue-model bridge traces the chain from customers to deposits to
              deployed financing assets to spread and, after deposit cost, to gross profit; fee income enters as a less
              rate-sensitive supplement. Crucially, while the existence and mechanics of these streams are clear, D360
              discloses none of the underlying values — margin, mix, interchange volumes or fee schedules — so the
              tables flag each as a diligence ask rather than a known quantity. The monetization table similarly
              captures list versus realized pricing and the unknown discounting and FX-spread economics that a proper
              review would need to resolve.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI028
