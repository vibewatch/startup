            body: >-
              Sizing the opportunity requires multiple lenses because analysts define the market differently. P&S
              Intelligence sizes the narrow Saudi digital-banking segment at roughly US$122 million in 2026, growing to
              about US$255 million by 2032 at a ~13% CAGR. Mordor Intelligence sizes the broader Saudi fintech market —
