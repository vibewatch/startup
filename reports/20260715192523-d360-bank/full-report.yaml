  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              D360 Bank operates in the market for Saudi Arabia's retail and SME banking demand delivered through
              fully-digital channels — deposits, savings, cards, payments and business banking — a subset of the
              national fintech sector. Included spend covers digital current and savings accounts, card and payment
              revenue, and SME banking; excluded is branch-based service delivery and non-bank corporate lending. The
              relevant adjacencies are digital payments and wallets (for example STC Pay), buy-now-pay-later and
              embedded finance, and the digital channels of incumbent banks. The most important status-quo substitutes
              D360 must displace are the mobile apps of dominant incumbents such as Al Rajhi and SNB and established
              payment apps, because most Saudis already hold a bank relationship. The buyer/segment map traces the path
              from the very large smartphone-owning population into D360's retail, underbanked and SME segments, and
              finally into deposit, payment and SME-banking revenue. Because incumbents already own the primary banking
              relationship for most adults, D360's boundary problem is less about creating demand than about redirecting
              existing flows and capturing the marginal new-to-bank, youth and SME customer, which shapes how the sizing
              lenses in the next section should be read, sized and underwritten by the market, financials and valuation
              chapters with appropriate caution and cross-checks.
