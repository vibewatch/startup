      - number: '8.3'
        title: Scenarios, triggers and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario framework makes the conditionality explicit. The bull case sees D360 scaling to
              multi-billion-dollar value by monetising deposits and expanding into SME banking while retention holds; it
              is supported by Vision 2030 and market-growth forecasts but constrained by the ultimate revenue-pool
              ceiling. The base case — the most likely on current evidence — treats the ~US$1.6 billion mark as full but
              justifiable, with a gradual re-rate as disclosure improves. The bear case sees overvaluation and
              down-round risk if dormancy, margin compression from premium Sanabil rates, or share loss to STC Bank and
              incumbents materialise. The valuation-return range spans roughly US$1.0 billion in the bear case to US$3+
              billion in the bull, and the sensitivity figure shows value is most exposed to margin and active-retention
              assumptions. The thesis-break table ties each downside to a monitorable trigger — a licence action, a
              capital-adequacy breach, mass dormancy, persistent negative spread, or sustained customer decline — with a
              clear action implication. Plausible exits include an eventual Tadawul IPO, a strategic sale, or continued
              PIF-anchored ownership. The final-diligence-asks table specifies exactly what would convert this watch
              stance into conviction: audited financials, net interest margin, cohort retention and active-usage ratios,
              capital-adequacy disclosure, and the preference/liquidation terms from the June 2026 round. Until those
              arrive, D360 is a high-potential, well-backed franchise carrying a full valuation underwritten on trust —
              attractive to watch, premature to underwrite with conviction.
