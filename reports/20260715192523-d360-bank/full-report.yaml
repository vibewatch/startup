      - number: '3.3'
        title: Moats, durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              D360's most cited moats are its first-mover full licence, post-raise capital strength, Sharia-compliant
              proposition and mobile user experience. Each, however, faces a concrete threat that the moat register
              makes explicit. The first-mover licence advantage is inherently decaying: as SAMA licenses additional
              digital banks — STC Bank already live and Vision Bank approved — exclusivity narrows and the advantage
              must be cashed in as deposit and customer share before parity arrives. Capital strength is real but
              relative; incumbents' scale and profitability let them subsidise digital investment at a level a young
              challenger cannot easily match, and they are actively upgrading their own apps to blunt the neobank
              differentiation gap. The Sanabil savings-rate edge is exposed to rate competition that can compress net
              interest margin, so durability hinges on whether D360 can sustain attractive yields without eroding
              profitability. The sharpest risks are commoditization and distribution: neobank propositions across the
              Gulf look increasingly similar, thinning differentiation and pressuring acquisition economics, while STC
              Bank's telecom-scale distribution is a direct threat to D360's customer-acquisition cost and pace. These
              are rated high-severity in the register and drive the diligence asks — benchmark customer-acquisition cost
              and conversion against STC Bank, verify sustainable margins at higher deposit yields, and track retention,
              active usage and NPS over time. The unresolved gaps — precise per-bank customer and deposit metrics,
              competitors' full pricing, and forward incumbent digital budgets — are the data most needed to move these
              judgements from qualitative to quantified.
