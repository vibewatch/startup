  topStrengths:
    - 沙特第一家拿到完整牌照的纯数字银行，PIF 关联资本与 Derayah 背书可信。
    - 牵引力异常快：上线约 18 个月内拿到 ~3 million 客户和 ~SAR 3 billion 存款。
    - 结构性顺风强：人口年轻、移动优先，Vision 2030 也在政策上支持 fintech。
    - 2026 年 6 月融资后，成为三家沙特数字银行里资本最厚的一家。
  topRisks:
    - 经审计财务、利润率、留存和资本充足率均未披露，估值核保基本靠信任。
    - Sanabil 高息存款利率叠加信贷敞口上升，可能挤压净息差。
    - STC Bank 拥有电信级分发能力，传统大行资本也足，竞争很强。
    - 账户增长 headline 可能高估活跃度和主账户关系，休眠风险需要验证。
  unresolvedGaps:
