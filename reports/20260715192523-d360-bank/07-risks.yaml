    {
      "id": "operational-partner",
      "title": "Operational, security and dependency risk",
      "body": "Operationally, D360 is a digital-only bank whose resilience depends on systems it largely does not own. Its core-banking engine is the vendor-supplied BOS/INCAT platform, which is efficient but concentrates continuity and lock-in risk; its transactions ride shared national rails (mada, SARIE) and its onboarding depends on the Nafath/Absher identity services; and its infrastructure sits with a cloud provider. Because these rails are shared across the whole Saudi digital-bank cohort, an outage is a single point of failure that D360 cannot fully control, though it is also not unique to D360. Cybersecurity and account-takeover fraud are the highest-severity operational risks: a digital-only bank is a high-value attack target, and a material breach would damage both balances and trust. The only public quality signal is app-store data — ratings around 3.9/5 and elevated uninstall signals — which hints at reliability and satisfaction frictions but is a weak proxy; uptime, SLA, incident and fraud-loss metrics are all undisclosed. The partner register ranks the vendor core platform, payment rails and capital backing as the most material dependencies. On capital, D360 depends on PIF-linked and Derayah shareholders to fund growth until it is self-sustaining; continued coverage suggests ongoing commitment, but a withdrawal of backing before profitability would be severe. These operational and partner exposures feed directly into the risk-transmission map, where reliability and dependency failures propagate into customer attrition, revenue and, ultimately, valuation.",
