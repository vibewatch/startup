  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "D360 Bank is Saudi Arabia's first fully-licensed, Sharia-compliant, branchless digital bank, headquartered in Riyadh and founded in February 2022. After receiving the Saudi Central Bank's (SAMA) no-objection to commence operations in December 2024 and launching publicly in early 2025, it scaled to roughly three million customers by April 2026. In June 2026 shareholders approved a 38.89% capital increase that raised close to SAR 1.5 billion of new equity at a SAR 6 billion (~US$1.6 billion) post-money valuation, making it the largest Saudi digital bank by capital. Derayah Financial is the largest single shareholder, alongside Public Investment Fund (PIF)-linked public-sector entities. This chapter establishes the ground-truth identity, leadership, ownership, funding chronology, and headline metrics reused throughout the report."
  },
  "sections": [
    {
      "id": "identity-and-license",
      "title": "Identity, licence and launch",
      "body": "D360 Bank (البنك الرقمي 360) is a Riyadh-headquartered, fully-digital, Sharia-compliant bank and a Saudi joint-stock company. It was established on 15 February 2022 and operates without physical branches, serving customers entirely through its mobile app and web platform. The bank is consistently described as Saudi Arabia's first fully-licensed digital bank to commence full operations, distinguishing it from payment-app neobanks that lack a banking licence. Its regulatory path ran through the Saudi Central Bank (SAMA): after the digital-bank licensing process of 2021-2022, SAMA granted a no-objection to commence banking operations in late December 2024, and the bank launched services to the public in early 2025. D360 is a direct instrument of Saudi Vision 2030's fintech strategy, which set out to license and grow domestic digital banks. The snapshot KPI table and milestone timeline below anchor the identity, licence and launch facts that later chapters treat as ground truth.",
