    {
      "id": "leadership-governance",
      "title": "Leadership, founders and governance",
      "body": "D360 Bank's executive leadership is headed by chief executive officer Eze Szafir (Ezequiel Szafir Holcman), an international digital-banking executive, with Taha A. AlKuwaiz serving as chairman of the board. Public trackers and the bank's ecosystem materials additionally identify a chief technology officer (reported as Sherif Alaa) and other senior operators such as Mai Al-Hamdan, although the private bank does not publish a complete executive roster, so coverage of roles below the CEO and chairman is partial and reported rather than company-confirmed. Governance is closely tied to Derayah Financial, the largest shareholder, whose nominees participate in board oversight. Key-person dependence is meaningful: the CEO is the public face of the franchise and the technology leadership owns the core platform, so any departure would be material. Independent company profiles catalogue the team and funding but do not disclose audited financial statements, a recurring transparency gap for this privately-held institution.",
