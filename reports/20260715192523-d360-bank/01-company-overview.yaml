    {
      "id": "scale-and-context",
      "title": "Scale, model and market context",
      "body": "D360 Bank reported reaching roughly three million customers and about SAR 3 billion in customer deposits by early-to-mid 2026, having earlier announced one million customers within months of launch. Its product suite spans retail personal accounts, the Sanabil savings product, cards and payments, plus digital SME and business banking. Because the bank is branchless, it can channel raised equity into customer acquisition, technology and lending rather than physical distribution, which underpins the growth-to-valuation logic captured in the snapshot-logic figure. The bank sits inside a Vision 2030 fintech mandate anchored by the Public Investment Fund's economic-diversification investment and a Saudi macro backdrop of oil-revenue diversification. The competitive and risk context is not uniformly favourable: the Saudi banking sector remains well-capitalised with highly profitable incumbents, while rating-agency commentary warns that sector growth is slowing as tighter liquidity pressures net interest margins — an adverse signal for a young lender still scaling its balance sheet. The milestone chronology consolidates the dated record used across the report.",
