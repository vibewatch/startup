      "id": "market-sizing",
      "title": "Market sizing through multiple lenses",
      "body": "Sizing the opportunity requires multiple lenses because analysts define the market differently. P&S Intelligence sizes the narrow Saudi digital-banking segment at roughly US$122 million in 2026, growing to about US$255 million by 2032 at a ~13% CAGR. Mordor Intelligence sizes the broader Saudi fintech market — which folds in payments, BNPL and embedded finance — at approximately US$3.2 billion in 2026, rising toward US$6 billion by 2031, and Verified Market Research corroborates strong double-digit growth without a transparent methodology. These figures are not directly comparable: the choice of a bank-only versus whole-fintech lens drives the headline number by more than an order of magnitude. A defensible framing therefore treats the national fintech/payments pool as TAM, digital retail and SME banking as SAM, and D360's near-term penetration as SOM. The sizing-lens stack and the estimate-range figure make the divergence explicit and preserve the conflicting estimates rather than collapsing them into one false-precision TAM. A key caveat is that digital-only banking revenue remains small in absolute terms next to incumbent profit pools.",
