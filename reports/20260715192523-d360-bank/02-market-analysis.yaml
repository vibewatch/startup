    {
      "id": "demographics-adoption",
      "title": "Demographics, adoption drivers and constraints",
      "body": "The addressable base is structurally attractive. Saudi Arabia has a population of roughly 35-37 million with a median age near 30, near-universal internet use above 90%, and mobile-subscription and smartphone penetration exceeding the population. These conditions lower the cost and friction of acquiring mobile-first banking customers and expand the top of the adoption funnel for every digital bank. Demand is reinforced by policy: Vision 2030's fintech strategy targets 525 fintech firms and a material GDP and jobs contribution by 2030, alongside cashless-payment goals, and the SME segment remains under-served by traditional banks — a distinct expansion market that D360's SME banking directly targets. Growth drivers span youth demographics, high mobile penetration, government policy and rising digital payments. The constraints are equally real: the Saudi banking market is concentrated among a few highly profitable incumbents, customer trust in new banks must be earned, switching propensity is low, and the digital-only revenue pool is small in absolute terms. Price sensitivity and account-dormancy behaviour for new digital banks remain unmeasured in public data, which is why the SOM and account-quality questions are carried forward as diligence gaps. Taken together, the demand side is one of the most favourable in the region while the supply side is unusually competitive, so the investment question is less whether the market grows and more whether a licensed digital challenger can win durable deposit share against entrenched, well-capitalised incumbents rather than merely adding low-balance accounts.",
