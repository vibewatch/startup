  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "D360 Bank competes in a Saudi banking market that is simultaneously one of the most digitally advanced in the region and one of the most concentrated. It sits inside a three-way race among newly-licensed pure-play digital banks — D360 Bank, STC Bank and Vision Bank — while facing entrenched, highly profitable incumbents such as Al Rajhi Bank, Saudi National Bank (SNB) and Riyad Bank whose mobile apps already serve tens of millions. D360 was first to a full digital-banking licence and, after its June 2026 capital increase, is the best-capitalised of the three digital entrants, but STC Bank leverages the Saudi Telecom Company's vast distribution and an installed STC Pay base of roughly three million users, and Vision Bank (the third licensee, approved by SAMA in 2025) is backed by large family conglomerates. Competition plays out on capability breadth, pricing (digital banks lead on savings profit rates and low fees while incumbents lead on product depth), go-to-market and distribution, and trust/regulatory posture where incumbents enjoy the deepest customer confidence. D360's defensible edges — first-mover licence, Sharia-compliant Sanabil savings rates, clean mobile UX and a well-capitalised balance sheet — are real but narrow, and the chapter flags material displacement and commoditization risk: distribution scale, incumbent digital investment and thin differentiation among neobanks could erode share and pricing power over time."
