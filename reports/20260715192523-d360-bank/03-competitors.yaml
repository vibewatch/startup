      "id": "landscape",
      "title": "Competitive landscape and peers",
      "body": "D360 Bank competes on two fronts at once. The first is the emerging cohort of licensed pure-play digital banks: SAMA has issued three full digital-banking licences, to D360 Bank, STC Bank and Vision Bank. STC Bank, backed by the Saudi Telecom Company and built on the STC Pay wallet, is the most formidable peer because it inherits an installed base of roughly three million wallet users and nationwide telecom distribution; it received SAMA operating approval and launched in early 2025. Vision Bank is the third and most recent licensee, receiving SAMA no-objection in 2025 and backed by large Saudi family conglomerates with capital around SAR 1.5 billion, but it trails the other two on live presence. The second front is the incumbents — Al Rajhi Bank, among the world's largest Islamic banks, together with Saudi National Bank and Riyad Bank — whose mobile apps already serve tens of millions and whose branch networks, salary relationships and trust remain formidable. Adjacent substitutes include established payment apps such as STC Pay and urpay, which cover transaction use-cases without a full banking licence. Market trackers and Vision 2030 coverage frame the three-bank digital race as a deliberate pillar of financial-sector reform. Against this field D360's distinguishing facts are that it was first to a full pure-play licence and, after its June 2026 capital increase, is the best-capitalised of the three digital entrants — advantages that must be converted into deposit and customer share before licensing exclusivity and product differentiation narrow.",
