    {
      "id": "valuation-comps",
      "title": "Valuation context and comparables",
      "body": "The June 2026 capital increase is the anchor. D360 raised roughly SAR 1.5 billion of new equity on a pre-money of about SAR 4.5 billion, setting a post-money valuation near SAR 6 billion (~US$1.6 billion) — a Series-A-style step-up corroborated by the Tadawul filing and multiple outlets. Two features temper how much weight to give this mark. First, it was set through a shareholder capital increase rather than an arm's-length external round, so it reflects insider conviction more than market price discovery, and entry discipline is correspondingly limited. Second, the implied multiples must be judged against comparables: at ~US$1.6 billion over about three million customers the value-per-customer is roughly US$530, and against ~SAR 3 billion (~US$800 million) of deposits the price-to-deposits multiple is about 2x. Benchmarked to global neobanks, that per-customer figure sits inside the range — broadly at or below Nubank's, below Revolut's more monetised base, and roughly in line with Monzo's — but is high for a bank that has not disclosed revenue or profitability, especially as sector multiples have normalised downward. Regional MENA-neobank data is too sparse for a clean read, and Saudi incumbent price-to-book levels provide only a loose floor. The comparable-valuation table lays these out with each row cross-referenced to at least two sources and flags that private-round terms and consistent MENA data are not public. The net conclusion is that the multiples are defensible but not cheap, and are only justified if D360 converts its low-balance accounts into engaged, profitable relationships.",
