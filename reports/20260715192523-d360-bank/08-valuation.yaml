  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "D360 Bank's June 2026 capital increase — roughly SAR 1.5 billion of new equity at a post-money valuation near SAR 6 billion (~US$1.6 billion), on a pre-money of about SAR 4.5 billion — prices it as a high-growth, state-backed digital bank at a Series-A-style step-up. The investment thesis is strong on demand and momentum: a young, digitally-native Saudi market, Vision 2030 policy tailwinds, credible PIF/Derayah backing, first-mover licence status, and a genuinely fast ramp to about three million customers and SAR 3 billion in deposits. The anti-thesis is that the price rests on trust rather than proof: with no disclosed revenue, margin, retention or capital-adequacy data, the ~US$1.6 billion valuation implies roughly US$530 per customer and about 2x deposits, multiples that are defensible against global neobank comparables (Nubank, Revolut, Monzo) only if D360 converts low-balance accounts into engaged, profitable relationships and defends margin against STC Bank and incumbents. Because valuation is set by a related-party capital increase rather than an arm's-length external round, entry discipline is limited and public evidence only partially supports the price. On balance the recommendation is to watch/track with medium confidence and a stretched-to-fair valuation stance: the upside case is real but underwritten on undisclosed unit economics, so the base case treats the current mark as full and the bear case sees it as overvalued if dormancy, margin compression or competitive share-loss materialise. This chapter sets out the thesis and anti-thesis, comparable multiples, bull/base/bear ranges, kill triggers and the final diligence asks that would move the view."
  },
  "sections": [
    {
      "id": "thesis",
      "title": "Thesis, anti-thesis and recommendation",
      "body": "D360's investment case is a genuine two-sided one. The thesis is compelling on demand and momentum: a young, digitally-native Saudi market with near-universal mobile use, powerful Vision 2030 policy tailwinds, credible PIF-linked and Derayah backing, first-mover full-licence status, and one of the fastest customer ramps in the regional cohort — roughly three million customers and SAR 3 billion in deposits inside about eighteen months of launch. State backing further supports valuation resilience and exit optionality. The anti-thesis is equally clear: the price rests on trust rather than proof. With no disclosed revenue, margin, retention or capital-adequacy data, the valuation capitalises traction whose quality is unverified, and global neobank multiples have compressed from their 2021 peaks, tempering optimistic comparables. Weighing these, the recommendation is to watch/track with medium confidence and a medium-high risk rating: the business is attractive and the backing is real, but a conviction commitment should await disclosure of the unit economics. The recommendation-logic figure shows how fast traction, undisclosed economics, competitive/margin risk and a full valuation combine into that conditional stance, and the investment-KPI scorecard rates market attractiveness high, customer proof medium, moat durability and unit-economics visibility low, and valuation fair-to-stretched. The thesis/anti-thesis table pairs each argument with the specific evidence that would move it — almost all of which is currently withheld.",
