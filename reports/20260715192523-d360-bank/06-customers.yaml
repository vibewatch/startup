    {
      "id": "expansion-concentration",
      "title": "Expansion, concentration and channel dependence",
      "body": "On expansion and concentration, D360's retail base is broad and therefore carries low single-customer concentration risk, which is a genuine strength: no handful of accounts dominates. The expansion logic is land-and-expand within the individual — cross-selling savings, cards and payments to deepen per-customer value — and, prospectively, a step from personal into SME banking that would raise revenue per relationship. The material concentration risks lie elsewhere: acquisition depends heavily on app-store channels, giving the model channel dependence and exposure to rising customer-acquisition costs; reach is extended through ecosystem partnerships that create partner dependence; and the deposit base skews to low balances, which is a funding-stability question. Comparative context matters — D360's growth outpaces most regional neobanks, but STC Bank commands a comparably large base through the STC Pay ecosystem, so scale alone is not a durable moat. Financial-inclusion policy and very high digital-payment penetration continue to expand the addressable pool, and SME-focused coverage frames under-served small businesses as the clearest future growth vector, though SME evidence today is early and thinly documented. The expansion-and-concentration table maps each growth driver to the risk it introduces and the diligence path to size it. The through-line of the chapter is that D360 has won attention and accounts at impressive speed; the open question is the durability and profitability of those relationships, which hinges on retention, active-usage and deposit-quality data that are not yet disclosed.",
