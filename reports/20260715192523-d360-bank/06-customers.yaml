  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "D360 Bank's customer base is a mass-market Saudi retail cohort skewed to youth and the digitally-native, augmented by an emerging SME segment. Its adoption trajectory is the strongest single proof point in the whole report: from roughly one million customers within months of its early-2025 launch to about three million customers and SAR 3 billion in deposits by April 2026, one of the fastest ramps among regional digital banks. Segmentation runs across buyer/user/payer (individuals are all three for retail; SME owners for business accounts), geography (Saudi Arabia), and use case (everyday banking, savings via Sanabil, cards, transfers). Named, verifiable customer proof is thin, however, because a consumer bank's customers are individuals rather than referenceable enterprises; the available proof is a mix of a documented customer case, ecosystem partnerships, savings-product uptake and app-store reviewer feedback. Retention and durability are the biggest evidence gap: D360 discloses no churn, dormancy, NRR or cohort-retention data, and independent review signals (including uninstall-tracking sources) flag the reliability and satisfaction frictions common to fast-scaling apps, raising the risk that headline account growth overstates active, primary-relationship usage. Concentration risk is low on the retail side (a broad base) but the model depends on app-store channels and on converting low-balance accounts into engaged, profitable ones. This chapter segments the base, charts the adoption curve, assesses the (limited) named proof, and is explicit that retention and active-usage data are the decisive unknowns."
  },
  "sections": [
    {
      "id": "segmentation-adoption",
      "title": "Segmentation and adoption trajectory",
      "body": "D360's customer base is a broad mass-market Saudi retail cohort weighted toward youth and the digitally-native, with an emerging small-business segment layered on top. In segmentation terms the retail customer is simultaneously buyer, user and payer, while SME accounts introduce an owner who plays those roles for a business; use cases span everyday banking, Sanabil savings, cards, transfers and low-cost remittances. The adoption trajectory is the report's single strongest proof point. Within months of its early-2025 public launch D360 reported roughly one million customers, and by April 2026 it reported approximately three million customers and around SAR 3 billion in deposits — close to a threefold increase in about a year and one of the fastest ramps in the regional digital-bank cohort. Importantly, the parallel growth of deposits alongside accounts indicates genuinely funded adoption rather than empty sign-ups. That said, the figures come without denominators: there is no disclosure of the active-versus-registered ratio, the balance distribution, or the churn-adjusted net-add rate, and the arithmetic implied average balance of roughly SAR 1,000 per customer hints that a large share of accounts may be low-balance or secondary rather than primary. Financial-inclusion and digital-payment data confirm a large, reachable addressable pool, but the retail-versus-SME split of D360's own base is not public. The segmentation and trajectory tables therefore pair each disclosed figure with the specific missing denominator a diligence process would need to interpret it.",
