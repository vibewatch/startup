  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "D360 Bank is a mobile-first, cloud-based digital bank delivered through iOS, Android and web with no physical branches. In customer-workflow terms it lets a Saudi resident open a fully-licensed bank account in minutes via digital identity verification, then hold current and Sharia-compliant Sanabil savings accounts, issue mada debit and virtual cards, make instant local transfers over the national payment rails, and access emerging SME-banking features. Architecturally the bank runs on a modern core-banking platform (reported to be the BOS system supplied by INCAT) hosted in the cloud, integrated to the Kingdom's shared payment and identity infrastructure — mada, SARIE and the Nafath/Absher digital-identity services — under SAMA regulation. Its differentiation is being first to a full pure-play licence, a clean high-rated app, and a Sharia-compliant savings proposition rather than any proprietary deep technology; the core platform is vendor-supplied, which is efficient but creates dependency. On trust and safety, D360 operates under SAMA prudential rules with biometric login, encryption and a Sharia governance framework, while app-store reviews are solid but not flawless (Apple rating around 3.9/5), pointing to the usual young-app reliability and support frictions. The chapter maps the module set, the customer workflow, the operating architecture, the critical dependencies and the roadmap, and flags that platform-vendor reliance and undisclosed reliability/SLA metrics are the main technical diligence gaps."
  },
  "sections": [
    {
      "id": "product-modules",
      "title": "Product, modules and customer workflow",
      "body": "D360 is a branchless, mobile-first bank delivered through iOS, Android and web, and its product is best understood as a set of jobs a Saudi resident can complete entirely in-app. The flagship job is account opening: instead of a branch visit and paperwork, a customer verifies identity through the Kingdom's national digital-identity services (Nafath/Absher) and opens a fully-licensed account in minutes. From there the module set is a conventional retail bank rendered digitally — current accounts, Sharia-compliant Sanabil savings, mada debit and virtual cards with Apple Pay support, and instant local transfers over the SARIE and mada rails — plus an emerging SME-banking line for business accounts and payments. The workflow table maps each customer job to D360's solution and the measurable benefit (minutes versus days to open an account, instant low-fee transfers, immediate card issuance) while being candid about limitations: reliability and verification frictions surface in reviews, savings-rate tiers are not fully public, and card-reward and FX economics are undisclosed. The module-maturity map shows accounts, savings and cards as established while SME banking is still developing, which matches the roadmap emphasis and the traction milestones of roughly three million customers and SAR 3 billion in deposits reached in 2026. In short, the product surface is complete enough to run a primary banking relationship for a mass-retail customer, with SME depth the clearest area still being built out.",
