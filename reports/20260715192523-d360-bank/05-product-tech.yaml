    {
      "id": "differentiation-trust",
      "title": "Differentiation, trust and safety",
      "body": "D360's differentiation is more commercial and regulatory than deep-technological. Its genuine edges are being first to a full pure-play SAMA licence, a clean and well-rated app experience, and a Sharia-compliant Sanabil savings proposition marketed on competitive profit rates — advantages of positioning, execution and licence rather than proprietary IP, since the core platform is vendor-supplied. The regulatory approval itself is a differentiating asset against unlicensed fintechs, but it is one the other two licensed digital banks also hold, so the moat is narrow. On trust and safety, D360 operates under SAMA prudential regulation with biometric login, encryption and a Sharia governance framework applied to its savings and financing products; the trust table captures these controls alongside their disclosure gaps — capital ratios, Sharia-board composition and penetration-test results are not public. The roadmap table reconstructs the milestone path from the 2024 SAMA no-objection through the early-2025 retail launch and 2026 traction milestones to the planned expansion of SME banking and financing, which is where future differentiation and revenue diversification are expected to come from. The maturity map underscores that the consumer proposition is mature while SME is nascent. Overall the technology story is competent and appropriately outsourced rather than exceptional, and the principal technical diligence items are the undisclosed reliability/SLA metrics, the vendor-platform dependency, and the still-forming SME roadmap and any proprietary data assets.",
