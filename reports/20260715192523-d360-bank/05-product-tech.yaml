    {
      "id": "architecture",
      "title": "Architecture, dependencies and reliability",
      "body": "Architecturally D360 follows the modern neobank pattern: a layered stack of in-house mobile and web presentation over a vendor-supplied core-banking engine, integrated to national payment and identity rails and hosted in the cloud. Technographic sources report the core to be the BOS platform from INCAT, a configuration that is efficient and fast to deploy but concentrates operational dependency on a third-party vendor. The integration layer binds D360 to shared national infrastructure — mada for card processing, SARIE for instant transfers, and Nafath/Absher for identity — which is common to every Saudi digital bank and therefore not a source of differentiation, but is a genuine concentration risk: an outage or policy change in any shared rail affects the whole cohort. The critical dependency map lays these out, and the architecture table pairs each layer with its role, dependency and risk, highlighting vendor lock-in and shared-infrastructure exposure as the salient technical concerns. On reliability and support, the public signal is limited to app-store data: the iOS app rates around 3.9 out of 5, solid but not flawless, with reviews citing the reliability, verification and support frictions typical of a young banking app. D360 discloses no uptime, SLA or penetration-test results, so operational resilience cannot be independently verified — a gap the diligence path flags for the data room. Continuous delivery happens through app-store releases rather than hardware or branch rollouts, which speeds iteration but makes app-store review sentiment a meaningful real-time quality gauge.",
      "claimRefs": [
        "CE005",
        "CE006",
        "CE007",
