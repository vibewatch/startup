      - number: '4.2'
        title: 增长、成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              以成立时间看，D360 的公开增长不错：截至 2026 年 4 月，多家沙特媒体相互印证，公司约有 300 万客户、约 SAR 30
              亿存款。除这两个数字外，承销最关键的私有指标都缺席——没有经审计收入、净利润、净息差、获客成本、回本周期或 cohort
              留存披露。数字银行的成本结构和既有银行在性质上不同：主导成本不是网点开销，而是技术、云、合规和获客。规模化之后，这可能带来结构性服务成本优势，但在收入成熟前会先把支出前置。单位经济表因此列出两个已披露指标，给出约
              SAR 1,000 的隐含人均存款这个算术结果（它本身也提出余额质量问题：账户到底是主账户，还是低余额的副账户），并对 CAC、回本周期和 NIM 明确留空值。单位经济桥刻意只做示意：把资产收益指数化为
              100，再扣除较高的存款成本、技术与合规、以及获客支出，说明为什么一家早期挑战者在用高于市场的 Sanabil 利率抢存款时，可能在圈地阶段跑出负净利差。这些数字都不是 D360
              报告值；它们存在的目的，是勾勒问题形状和尽调必须回答的问题，尤其是人均存款含义，需要用平均余额和活跃账户数据核验。
