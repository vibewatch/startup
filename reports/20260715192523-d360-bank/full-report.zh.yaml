      - number: '4.3'
        title: 资本充足、融资依赖与判断
        blocks:
          - type: paragraph
            body: >-
              最清楚的财务事实来自资本。2026 年 6 月，D360 完成约 SAR 15 亿股权增资，将实收资本提高到约 SAR 29 亿，并把投后估值定在约 SAR 60 亿（约 US$16 亿）——这是一次类似
              Series A 的估值跃升，交易所备案和多家媒体都能交叉印证。这笔资本既增强监管资本基础，也显示持续融资依赖：和任何扩张资产负债表的银行一样，D360
              在净收益收入覆盖成本基础前仍依赖股东权益。资本章节的时间线由公司概览负责；这里把融资事实作为本章局部论据，重新绑定到备案和新闻来源。基准让图景更清晰。沙特银行在极大、低成本存款基础上赚取约 2.8-3.0%
              净息差，行业盈利能力强、资本充足；一家挑战者为了吸收存款支付较高 Sanabil 利率，早期利差在结构上更紧，而全球数字银行通常要吸收数年亏损后才走向盈利。PIF 关联所有权和 Vision 2030
              政策支持提供了耐心、资源充足的后盾，降低融资路径风险；也没有披露重大债务或项目融资义务。因此结论是两面的：一边是资本实力、可信背书和令人鼓舞的早期增长；另一边是经审计财务完全缺席——收入、利差、烧钱和
              runway 都没有——这是核心尽调阻碍。在拿到这些私有指标前，收入质量和盈利路径无法验证，资本充足和缺口表则列清了具体要索取的数据。
