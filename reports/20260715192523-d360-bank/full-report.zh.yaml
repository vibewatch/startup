      - number: '5.3'
        title: 差异化、信任与安全
        blocks:
          - type: paragraph
            body: >-
              D360 的差异化更多来自商业和监管，而不是深层技术。真正优势是率先拿到完整纯数字 SAMA 牌照、干净且评分不错的 App 体验，以及以有竞争力利润率营销的、符合伊斯兰教法的 Sanabil
              储蓄主张——这些是定位、执行和牌照优势，而非专有 IP，因为核心平台来自供应商。监管批准本身是相对于无牌金融科技公司的差异化资产，但另外两家持牌数字银行也拥有同样资产，所以护城河很窄。信任和安全上，D360 在
              SAMA 审慎监管下运营，采用生物识别登录、加密，以及适用于储蓄和融资产品的 Sharia 治理框架；信任表记录这些控制，也列出披露缺口——资本比率、Sharia
              董事会构成和渗透测试结果都未公开。路线图表重建了从 2024 年 SAMA 无异议许可，到 2025 年初零售上线、2026 年增长里程碑，再到计划拓展 SME
              银行和融资的路径；后者被预期为未来差异化和收入多元化来源。成熟度图强调，消费者主张已成熟，SME 仍处早期。总体看，技术叙事是称职、外包得当，而不是出众；主要技术尽调项是未披露的可靠性 / SLA
              指标、供应商平台依赖、仍在成形的 SME 路线图，以及任何专有数据资产。
