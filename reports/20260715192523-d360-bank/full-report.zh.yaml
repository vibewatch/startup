      - number: '2.3'
        title: 人口结构、采用驱动与约束
        blocks:
          - type: paragraph
            body: >-
              可服务人群在结构上很有吸引力。沙特人口约 3500 万至 3700 万，中位年龄接近 30 岁，互联网使用率超过
              90%、几乎全民覆盖，移动订阅和智能手机渗透率还超过人口规模。这些条件降低了移动优先银行的获客成本和摩擦，也为每一家数字银行扩大了获客漏斗顶端。政策进一步强化需求：Vision 2030 的金融科技战略目标是在
              2030 年前培育 525 家金融科技公司，并贡献可观 GDP 和就业，同时推进无现金支付；SME 仍未被传统银行充分服务，是一个清晰的扩张市场，D360 的 SME
              银行业务正面向这一市场。增长驱动来自年轻人口结构、高移动渗透、政府政策和数字支付普及。约束同样真实：沙特银行市场集中在少数高盈利既有银行手中，新银行必须先赢得客户信任，客户转换意愿低，纯数字收入池绝对规模小。新数字银行的价格敏感度和账户休眠行为在公开数据中仍未被衡量，因此
              SOM
              和账户质量问题被列为后续尽调缺口。合起来看，需求端在区域内属于最有利的一类，但供给端竞争异常激烈；投资问题不是市场会不会增长，而是持牌数字挑战者能否从根基深、资本厚的既有银行手中赢得可持续存款份额，而不只是增加低余额账户。
