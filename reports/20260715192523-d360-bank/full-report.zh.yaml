  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与同业
        blocks:
          - type: paragraph
            body: >-
              D360 Bank 同时在两条战线上竞争。第一条是正在形成的持牌纯数字银行队列：SAMA 已发出三张完整数字银行牌照，分别给 D360 Bank、STC Bank 和 Vision Bank。由 Saudi
              Telecom Company 支持、建立在 STC Pay 钱包上的 STC Bank 是最强劲的同业，因为它继承了约 300 万钱包用户和全国电信分销网络；它已获得 SAMA 运营批准，并于 2025
              年初上线。Vision Bank 是第三家、也是最新获牌机构，2025 年获得 SAMA 无异议许可，由大型沙特家族企业集团支持，资本约 SAR 15
              亿，但实际上线存在感落后于前两者。第二条战线是既有银行——Al Rajhi Bank 是全球最大伊斯兰银行之一，另有 Saudi National Bank 和 Riyad Bank——它们的移动 App
              已服务数千万用户，网点网络、薪资账户关系和信任仍然强势。相邻替代品包括 STC Pay、urpay 等成熟支付 App，它们能覆盖交易场景，但没有完整银行牌照。市场追踪机构和 Vision 2030
              相关报道都把三家数字银行的竞赛视为金融部门改革的有意支柱。面对这片战场，D360 的差异化事实在于：它最早拿到完整纯数字牌照，并在 2026 年 6
              月增资后成为三家数字新进入者中资本最厚的一家——但这些优势必须在牌照稀缺性和产品差异收窄前转化为存款和客户份额。
