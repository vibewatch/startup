  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              D360 的投资案例确实是两面的。正面论点在需求和动能上很有吸引力：沙特市场年轻、数字原生，移动使用近乎全民覆盖，Vision 2030 政策顺风强，PIF 关联方和 Derayah
              背书可信，拥有先发完整牌照地位，并在区域队列中跑出最快客户爬坡之一——上线约 18 个月内约 300 万客户、SAR 30
              亿存款。国家背景还支撑估值韧性和退出可选项。反论点同样清楚：价格建立在信任而非证据上。公司未披露收入、利差、留存或资本充足率数据，估值资本化的是质量尚未验证的增长；同时全球新银行倍数已从 2021
              年峰值压缩，乐观可比公司需要打折。权衡之后，建议是以中等信心 watch/track，风险评级中高：业务有吸引力，背书也真实，但要形成高 conviction
              投入，应等单位经济披露。建议逻辑图展示了快速增长、未披露经济性、竞争 / 利差风险和完整估值如何组合成这种有条件立场；投资 KPI
              记分卡则把市场吸引力评为高，客户证明为中，护城河耐久性和单位经济可见度为低，估值为合理到偏高。论点 / 反论点表把每个论据同会改变判断的具体证据配对——其中几乎全部目前都被保留未披露。
