      - number: '6.3'
        title: 扩张、集中度与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              扩张和集中度方面，D360
              的零售客户基础广泛，因此单一客户集中度风险低，这是真正优势：没有少数账户主导全局。扩张逻辑是在个人客户内部先落地再深化——交叉销售储蓄、银行卡和支付，提高单客价值——并在未来从个人银行跨入 SME
              银行，提高每段关系收入。实质集中风险在别处：获客高度依赖 App Store
              渠道，让模式有渠道依赖，也暴露在获客成本上升之下；生态合作扩展触达，同时形成伙伴依赖；存款基础偏低余额，则带来资金稳定性问题。比较背景很重要——D360 增长快过多数区域新银行，但 STC Bank 通过 STC
              Pay 生态拥有相当大的用户基础，所以规模本身不是持久护城河。金融普惠政策和极高数字支付渗透率继续扩张可服务池，SME 相关报道也把服务不足的小企业定义为最清晰的未来增长方向，尽管今天的 SME
              证据仍早期且记录稀薄。扩张与集中度表把每个增长驱动同其引入的风险、以及测算该风险的尽调路径配对。本章主线是：D360
              以令人印象深刻的速度赢得注意力和账户；悬而未决的问题是这些关系能否持久、能否盈利，这取决于尚未披露的留存、活跃使用和存款质量数据。
