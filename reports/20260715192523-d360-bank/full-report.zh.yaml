  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              D360 最大的单一风险类别是监管，因为整个业务根基都建立在 SAMA 银行牌照上。它受到完整审慎监管和监督，必须满足资本充足、AML/KYC/CTF、消费者保护，以及通过 Personal Data
              Protection Law（PDPL）引入的数据隐私义务，同时还要满足 Sanabil 和融资产品的 Sharia
              治理要求。任何执法行动、资本比率违规或牌照条件不利变化都可能是生死攸关的，因此这些条目排在按严重度排序的风险登记表最前。沙特法律和监管指南确认，SAMA
              对金融科技和数字银行实行主动、规则细的监管，并强调数据本地化和隐私执法正在推高合规成本。一个具体的竞争性监管动态让图景更尖锐：通过给 STC Bank 以及最近的 Vision Bank 发牌，SAMA
              已经结束了 D360 的先发排他性；曾经赋予稀缺价值的监管环境，如今也放出了直接对手。未发现针对 D360
              的重大诉讼或执法公开记录，这令人放心，但在披露有限的情况下，并不等于已确认完全清白。风险登记表明确是部分视图：私有合规状态、资本充足率和任何保密监管往来都不公开，因此若干高严重度行仍有残余暴露，只有数据室访问才能解决。依赖图把
              SAMA 放在 D360 关键关系的首位，强调监管地位不只是合规问题，而是整个投资论点的地基。
