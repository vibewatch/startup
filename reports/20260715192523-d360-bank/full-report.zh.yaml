        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              D360 Bank 的执行层由首席执行官 Eze Szafir（Ezequiel Szafir Holcman）带领，他是国际数字银行高管；Taha A. AlKuwaiz
              担任董事会主席。公开追踪库和银行生态材料还提到一名首席技术官（报道称为 Sherif Alaa）以及 Mai Al-Hamdan 等其他高级运营人员。不过，这家私营银行并未公布完整高管名单，因此 CEO
              和董事长以下角色的覆盖并不完整，更多是外部报道而非公司确认。治理与最大股东 Derayah Financial 关系紧密，Derayah 提名人参与董事会监督。关键人依赖很明显：CEO
              是这项业务的公开门面，技术负责人掌握核心平台，任何离任都会产生实质影响。独立公司画像梳理了团队和融资，但没有披露经审计财报，这也是这家私营机构反复出现的透明度缺口。
