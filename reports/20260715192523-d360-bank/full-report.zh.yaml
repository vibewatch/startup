      - number: '7.2'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，D360 是一家纯数字银行，韧性取决于大量并非自有的系统。核心银行引擎是供应商提供的 BOS/INCAT 平台，效率高，但集中了承续和锁定风险；交易跑在共享国家轨道（mada、SARIE）上，开户依赖
              Nafath/Absher 身份服务，基础设施则放在云服务商处。由于这些轨道由整个沙特数字银行队列共享，任何宕机都是 D360 无法完全控制的单点故障，尽管这也不是 D360
              独有问题。网络安全和账户接管欺诈是最高严重度运营风险：纯数字银行是高价值攻击目标，重大入侵会同时伤害余额和信任。唯一公开质量信号是 App Store 数据——约 3.9/5
              的评分和较高卸载信号——它暗示可靠性和满意度摩擦，但只是弱代理；uptime、SLA、事故和欺诈损失指标均未披露。合作伙伴登记表将供应商核心平台、支付轨道和资本后盾列为最重要依赖。资本方面，D360 依赖 PIF
              关联和 Derayah
              股东供给增长资金，直到自身可持续；持续报道显示承诺仍在，但若在盈利前撤回支持，影响会很严重。这些运营和伙伴暴露直接进入风险传导图：可靠性和依赖故障会扩散为客户流失、收入受损，并最终影响估值。
