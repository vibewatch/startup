      - number: '1.3'
        title: 融资、所有权与估值
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月，D360 Bank 股东批准 38.89% 增资，将注册资本从 SAR 2,100,000,000 提高到 SAR 2,916,666,670。此次增发 72,916,667 股新股，每股
              SAR 20.57，募集约 SAR 15 亿新股本；同时另设约 875 万股员工持股（ESOP），价值接近 SAR 8750 万。媒体报道将投前估值放在约 SAR 45 亿（约 US$12 亿），投后估值约
              SAR 60 亿（约 US$16 亿），并把该轮描述为用于放贷和扩张的 Series A。交易通过 Derayah Financial 在 Saudi
              Exchange（Tadawul）的公告向市场披露。Derayah Financial 是最大单一股东，持股从约 20.4% 稀释到约 16.35%，同时追加认购 SAR 1 亿；PIF
              关联公共部门实体和战略机构投资者持有其余股份。增资后，按注册资本计，D360 成为沙特最大的数字银行。股东图总结了这些持股，并列出仍属私有信息的完整资本结构表所需核查事项。
