      - number: '7.3'
        title: 财务、人员风险与缓释
        blocks:
          - type: paragraph
            body: >-
              财务上，D360 承担的是扩张期数字银行典型风险组合：持续烧钱、资本密集，以及通向盈利的多年路径。具体利差风险在于，为吸收存款支付较高 Sanabil
              利润率，会让净息差相对于低成本既有银行被压缩；随着融资账簿扩张，信用和融资损失暴露也会增加——Fitch 和行业分析师把行业信用和利差条件描述为可控但趋紧。如果盈利推迟，D360
              下一轮融资将面临融资依赖和稀释风险。关键是，经审计财务缺席——未披露收入、利差、NPL
              率、资本充足率或存款集中度数据——显著抬高尽调风险，也阻止外部独立验证这些暴露；这种不透明本身就是报告中最大的残余不确定性。人员和执行风险集中在高曝光 CEO
              和小型高管团队的关键人依赖，以及沙特市场对银行科技和合规人才的激烈争夺。与这些相对，缓释因素真实但尚未量化：增资后的强资本、SAMA 监督、与 Vision 2030
              一致的政策支持、承诺明确的战略股东，以及供应商 SLA。风险热力图把牌照行动和网络 / 欺诈列为影响最高的风险，把利差压缩和留存 / 休眠列为最可能发生的风险；否决标准表则把每项风险同可监测触发器绑定——SAMA
              制裁、资本违规、持续休眠、重大安全事件，或 runway 在没有盈利路径时跌破 12 个月。投资含义是，D360 上行真实，但承销基础是信任；只有补齐财务和可靠性披露缺口，才能把这些定性风险转成可量化风险。
