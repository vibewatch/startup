  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现
        blocks:
          - type: paragraph
            body: >-
              D360 是持牌银行，不是支付创业公司，因此经济模型落在经典银行机制上，只是适配了数字化、符合伊斯兰教法的模式。核心收入引擎是净收益收入——融资资产回报与付给 Sanabil
              储蓄存款人的利润之间的利差。围绕这个核心的是收费型收入：银行卡交换费、支付和转账费、外汇价差，以及仍在发展的 SME
              银行业务线，后者带来账户、支付和融资费用。消费者主张刻意保持低费率——免费或低费活期账户，配合有竞争力的储蓄利润率——于是变现重心从账户收费转向资产端利差和交换费。这和数字银行获取价格敏感、移动优先客户的低摩擦模式一致，也意味着收入质量高度取决于约
              SAR 30
              亿存款基础能否被有利可图地部署。收入模型桥把链条从客户、存款、已部署融资资产、利差，一直追到扣除存款成本后的毛利；手续费收入则作为对利率敏感度较低的补充。关键在于，虽然这些收入流的存在和机制很清楚，D360
              没有披露任何底层数值——利差、结构、交换量或费率表都没有——因此各表把它们标为尽调问题，而不是已知量。变现表同样记录了标价与实际成交价，以及需要正式审查才能厘清的折扣和 FX 价差经济。
