  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              D360 Bank 所处市场，是沙特零售和 SME
              银行需求通过全数字渠道交付的部分——存款、储蓄、银行卡、支付和企业银行——它属于全国金融科技行业的一个子集。纳入的支出包括数字活期和储蓄账户、银行卡和支付收入，以及 SME
              银行；不包括网点服务交付和非银行企业贷款。相邻领域包括数字支付和钱包（例如 STC Pay）、BNPL 和嵌入式金融，以及既有银行的数字渠道。D360 最需要替代的现状，是 Al Rajhi、SNB
              等主导性既有银行的移动 App 和成熟支付 App，因为大多数沙特人已经有银行关系。买方 / 细分图追踪了路径：从规模很大的智能手机人群，进入 D360 的零售、欠充分服务和 SME 客群，最终转化为存款、支付和
              SME 银行收入。既有银行已经掌握多数成年人的主银行关系，因此 D360 的边界问题并不是创造需求，而是重新导流现有资金流，并捕捉边际上的新入行、年轻和 SME
              客户；这也决定了下一节的规模测算需要由市场、财务和估值章节带着适当谨慎和交叉校验来阅读、测算和承销。
