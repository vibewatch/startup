      - number: '6.2'
        title: 具名证明、留存与满意度
        blocks:
          - type: paragraph
            body: >-
              对一家大众消费银行而言，可具名、可验证的客户证明天然有限，因为客户是数百万个人，而不是可供引用的企业客户。因此，现有证据是一个不算强的组合：客户参考来源中出现的一则有记录客户案例，扩展触达的生态合作（支付、汇款和卡组织），Sanabil
              储蓄的汇总采用情况，以及规模不小的 App Store
              评论人群。具名证明表汇总这些证据，并让每一行至少交叉引用两个独立来源；证明矩阵也清楚显示，生产成熟度高，但结果具体性和留存可见度低——这是基于案例和评论者的证据，不是经审计结果。留存是决定性缺口。D360
              没有披露流失、休眠、NRR、GRR 或 cohort 留存数据，因此留存表大多为空值，cohort 图也明确只是示意而非报告值。独立信号填补了一部分空白，但力度弱且偏负面：iOS App 评分约
              3.9/5，卸载追踪来源暗示相当一部分下载并未沉淀为活跃用户。合起来，这些信号提出一个核心反向问题——标题账户增长是否夸大了活跃、主关系使用。D360 提供活跃用户比例和 cohort
              留存前，亮眼顶线增长的质量无法确认，客户旅程图的阶段到阶段转化也仍无法量化。
