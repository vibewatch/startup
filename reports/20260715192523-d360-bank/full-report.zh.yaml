      - number: '1.4'
        title: 规模、模式与市场背景
        blocks:
          - type: paragraph
            body: >-
              D360 Bank 报告称，到 2026 年初至年中客户约 300 万、客户存款约 SAR 30 亿；此前公司曾宣布上线数月内达到 100 万客户。产品组合覆盖零售个人账户、Sanabil
              储蓄产品、银行卡和支付，以及数字 SME 和企业银行。由于没有网点，银行可以把募集股本投向获客、技术和放贷，而不是实体分销；快照逻辑图正是围绕这一增长到估值的链条展开。银行处在 Vision 2030
              金融科技授权框架内，该框架由 Public Investment Fund
              的经济多元化投资和沙特摆脱石油收入依赖的宏观背景支撑。竞争和风险背景并非一边倒有利：沙特银行业资本充足，既有银行盈利能力很强；同时评级机构评论警告，在流动性收紧压低净息差的情况下，行业增长正在放缓——这对仍在扩张资产负债表的年轻放贷机构是一个反向信号。里程碑年表整合了报告各处使用的带日期记录。
