    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、牌照与上线
        blocks:
          - type: paragraph
            body: >-
              D360 Bank（البنك الرقمي 360）是一家总部位于利雅得的全数字、符合伊斯兰教法的银行，也是一家沙特股份公司。公司成立于 2022 年 2 月 15 日，没有实体网点，客户完全通过移动 App
              和网页平台办理业务。公开资料持续将其描述为沙特首家开始全面运营的完全持牌数字银行，这一点把它同没有银行牌照的支付 App 型新银行区分开来。它的监管路径经过 Saudi Central
              Bank（SAMA）：2021-2022 年数字银行牌照流程之后，SAMA 于 2024 年 12 月底给予开展银行业务的无异议许可，银行随后在 2025 年初向公众推出服务。D360 是 Saudi
              Vision 2030 金融科技战略的直接落地载体之一；该战略明确要发牌并培育本土数字银行。下方快照 KPI 表和里程碑时间线锚定了身份、牌照和上线事实，后续章节都以此为基础。
