      - number: '3.3'
        title: 护城河、耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              D360 最常被提到的护城河，是先发完整牌照、增资后的资本实力、符合伊斯兰教法的主张，以及移动端用户体验。不过，每一项都面对具体威胁，护城河清单对此逐项摊开。先发牌照优势天然会衰减：随着 SAMA
              继续给更多数字银行发牌——STC Bank 已上线，Vision Bank 已获批——排他性会收窄，D360
              必须在同质化到来前把优势兑现为存款和客户份额。资本实力是真实的，但也是相对的；既有银行的规模和盈利能力允许它们用年轻挑战者难以匹配的力度补贴数字化投入，并且它们正主动升级自有
              App，削弱新银行差异。Sanabil 储蓄利率优势暴露在利率竞争之下，可能压缩净息差，因此耐久性取决于 D360
              能否在不侵蚀盈利的情况下维持有吸引力的收益。最尖锐的风险是商品化和分销：海湾新银行主张越来越相似，差异变薄并挤压获客经济；同时 STC Bank 的电信级分销直接威胁 D360
              的获客成本和速度。这些在风险清单中被评为高严重度，并驱动尽调问题：把获客成本和转化率同 STC Bank 对标，验证较高存款收益下的可持续利差，并持续跟踪留存、活跃使用和
              NPS。未解决缺口——各银行精确客户和存款数据、竞争者完整定价、以及既有银行未来数字化预算——是把这些判断从定性推进到定量最需要的数据。
