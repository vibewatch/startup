      - number: '8.2'
        title: 估值背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月增资是锚点。D360 以约 SAR 45 亿投前估值募集约 SAR 15 亿新股本，把投后估值定在约 SAR 60 亿（约 US$16 亿）——这是一次类似 Series A
              的跃升，Tadawul
              备案和多家媒体均可印证。两个特征会削弱这个估值标记的权重。第一，它通过股东增资形成，而不是独立外部轮融资，因此更多反映内部人信心，而非市场价格发现，进入纪律也相应有限。第二，隐含倍数必须放到可比公司中判断：以约
              US$16 亿除以约 300 万客户，单客价值约 US$530；相对于约 SAR 30 亿（约 US$8 亿）存款，价格 / 存款倍数约 2x。与全球新银行相比，这个单客数落在区间内——大致等于或低于
              Nubank，低于变现更充分的 Revolut，约与 Monzo 相当——但对于一家未披露收入或盈利的银行仍然偏高，尤其是在行业倍数已向下正常化之后。MENA
              区域新银行数据过于稀疏，难以得出干净读数；沙特既有银行的市净率水平也只能提供松散底部。可比估值表列出这些关系，并让每一行交叉引用至少两个来源，同时标出私募轮条款和一致的 MENA
              数据并不公开。净结论是：这些倍数可以辩护，但不便宜；只有当 D360 把低余额账户转成高参与度、可盈利关系时，估值才站得住。
