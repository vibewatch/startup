      - number: '5.2'
        title: 架构、依赖与可靠性
        blocks:
          - type: paragraph
            body: >-
              架构上，D360 遵循现代新银行模式：自研移动端和网页展示层叠在供应商提供的核心银行引擎之上，并接入国家支付和身份轨道，托管在云上。技术画像来源称，其核心是 INCAT 的 BOS
              平台；这一配置高效、部署快，但把运营依赖集中到第三方供应商身上。集成层把 D360 绑定到共享国家基础设施——mada 处理银行卡，SARIE 处理即时转账，Nafath/Absher
              处理身份——这对每一家沙特数字银行都很常见，因此不是差异化来源，却是真实集中风险：任何共享轨道宕机或政策变化，都会影响整个队列。关键依赖图逐项列出这些关系，架构表则把每一层同角色、依赖和风险配对，突出供应商锁定和共享基础设施暴露这两个最显著技术问题。可靠性和支持方面，公开信号仅限
              App Store 数据：iOS App 评分约 3.9/5，扎实但并非无瑕，评论提到年轻银行 App 常见的可靠性、验证和支持摩擦。D360 没有披露 uptime、SLA
              或渗透测试结果，因此运营韧性无法被独立验证——这正是尽调路径为数据室标出的缺口。持续交付通过 App Store 版本发布完成，而不是硬件或网点铺设；这加快迭代，也让 App Store
              评论情绪成为有意义的实时质量仪表。
