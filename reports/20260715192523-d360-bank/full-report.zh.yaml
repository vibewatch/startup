  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品、模块与客户流程
        blocks:
          - type: paragraph
            body: >-
              D360 是一家无网点、移动优先的银行，通过 iOS、Android 和网页交付；理解它的产品，最好从沙特居民能完全在 App
              内完成的一组任务入手。旗舰任务是开户：客户不必去网点、填纸质材料，而是通过沙特国家数字身份服务（Nafath/Absher）验证身份，并在几分钟内开立一个完全持牌账户。此后，模块组合就是把传统零售银行数字化呈现出来——活期账户、符合伊斯兰教法的
              Sanabil 储蓄、支持 Apple Pay 的 mada 借记卡和虚拟卡、通过 SARIE 和 mada 轨道的本地即时转账——再加上一条面向企业账户和支付、正在形成的 SME
              银行业务线。流程表把每个客户任务对应到 D360 的解决方案和可衡量收益（几分钟而非几天开户、即时低费转账、即时发卡），也坦率标出限制：评论中出现可靠性和验证摩擦，储蓄利率分层没有完全公开，卡奖励和 FX
              经济未披露。模块成熟度图显示账户、储蓄和银行卡已经成型，SME 银行仍在发展，这与路线图重点以及 2026 年达到约 300 万客户、SAR 30
              亿存款的增长里程碑相吻合。简言之，对大众零售客户而言，产品覆盖面已经足够支撑一段主银行关系；SME 深度则是最明确仍在建设的区域。
