  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              D360 的客户基础是广泛的沙特大众零售人群，偏年轻和数字原生；其上叠加一个正在形成的小企业客群。从分层看，零售客户同时是购买者、使用者和付款者；SME
              账户则引入企业主，由企业主为一家公司承担这些角色。使用场景覆盖日常银行、Sanabil 储蓄、银行卡、转账和低成本汇款。采用轨迹是本报告最强的单一证明点。2025 年初公开上线后数月内，D360 报告约 100
              万客户；到 2026 年 4 月，公司报告约 300 万客户、约 SAR 30
              亿存款——约一年内接近三倍增长，也是区域数字银行队列中最快的爬坡之一。重要的是，存款与账户同步增长，说明采用并非空注册，而是真有资金进入。话虽如此，这些数字没有分母：未披露活跃 /
              注册比例、余额分布或扣除流失后的净新增率；按算术推算约 SAR 1,000 的人均余额也暗示，大量账户可能是低余额或副账户，而非主账户。金融普惠和数字支付数据确认了一个规模大、可触达的可服务池，但 D360
              自身客户基础中零售与 SME 的拆分并不公开。因此，分层和轨迹表把每个已披露数字同尽调解读所需的具体缺失分母配对。
