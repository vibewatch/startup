      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              机会规模必须用多重视角看，因为分析机构对市场定义并不一致。P&S Intelligence 估计，狭义沙特数字银行市场 2026 年约 US$1.22 亿，到 2032 年增至约 US$2.55 亿，CAGR 约
              13%。Mordor Intelligence 则把更宽的沙特金融科技市场——包括支付、BNPL 和嵌入式金融——估在 2026 年约 US$32 亿，到 2031 年接近 US$60 亿；Verified
              Market Research 也支持强劲双位数增长，但方法不透明。这些数字不能直接比较：只看银行，还是看整个金融科技，足以让标题数字相差一个数量级以上。因此，更稳妥的框架是把全国金融科技 / 支付池视为
              TAM，把数字零售和 SME 银行视为 SAM，把 D360 近期可渗透部分视为 SOM。规模视角堆叠图和估计区间图把差异摊开，保留冲突估算，而不是把它们压成一个带有虚假精确感的
              TAM。关键提醒是：与既有银行利润池相比，纯数字银行收入的绝对规模仍然很小。
