      - number: '3.2'
        title: 能力、定价、分销与信任
        blocks:
          - type: paragraph
            body: >-
              能力上，既有银行在产品深度上明显领先——完整贷款、银行卡、财富和公司业务套件都在手；数字银行更窄，但在年轻客户和 SME 最看重的具体任务上更锋利：快速数字开户、低费率交易和有竞争力的储蓄收益。D360
              主推符合伊斯兰教法的 Sanabil
              储蓄产品，利润率定位高于既有银行通常支付的水平；这是数字挑战者从背着传统成本基础的银行手中拉走存款的核心机制。定价上，数字银行趋向低月费或免月费，并提供免费转账；不过竞争者完整费率层级并未完全公布，因此定价表标出未知项，而不是自行推断。获客上，对比很鲜明：STC
              Bank 靠电信触达和 STC Pay 用户基础，既有银行靠网点网络和根深蒂固的薪资存款关系，D360 则靠面向年轻人和 SME 的数字优先营销。信任和监管姿态上，三家数字银行都在同一 SAMA
              牌照下运营，但既有银行保有最深客户信任和最长记录，这一差距会拖慢任何新进入者吸收存款。转换成本——薪资直存、定期支付指令和贷款绑定——强化了既有银行优势，不过多栖使用很常见：沙特消费者通常同时持有多个银行 App
              和钱包，这一因素双向作用，既降低试用 D360 的门槛，也让捕捉主银行关系更难。能力矩阵和定位图总结了各玩家强项，也说明 D360 面向年轻人和 SME、高收益、清爽 UX 的楔子，哪些是真差异，哪些只是可比项。
