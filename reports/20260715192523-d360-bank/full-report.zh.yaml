      - number: '8.3'
        title: 情景、触发器与尽调问题
        blocks:
          - type: paragraph
            body: >-
              情景框架把条件性说清楚。牛市情景认为，D360 能通过存款变现并扩展 SME 银行业务，在留存守住的情况下把价值推到数十亿美元；Vision 2030
              和市场增长预测支撑这一情景，但最终收入池上限形成约束。基准情景——基于现有证据最可能发生——认为约 US$16 亿估值偏满但可辩护，随着披露改善逐步重估。熊市情景则是，如果休眠、Sanabil
              高利率带来的利差压缩，或向 STC Bank 和既有银行流失份额兑现，公司将面临高估和下轮融资降价风险。估值回报区间从熊市约 US$10 亿到牛市 US$30
              亿以上不等；敏感性图显示，价值最受利差和活跃留存假设影响。论点破裂表把每个下行因素绑定到可监测触发器——牌照行动、资本充足违规、大规模休眠、持续负利差，或客户持续下降——并给出清晰行动含义。可行退出包括未来
              Tadawul IPO、战略出售，或继续由 PIF 锚定持有。最终尽调问题表明确列出哪些材料能把当前观望立场转为确信：经审计财务、净息差、cohort 留存和活跃使用比例、资本充足披露，以及 2026 年 6
              月融资的优先权 / 清算条款。在这些到位前，D360 是一个高潜力、强背书的业务，但估值已满、承销依赖信任——值得跟踪，过早下定论则还不够。
