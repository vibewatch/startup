  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "D360 Bank's financial profile is that of an early-stage, well-capitalised digital bank whose public disclosure is thin. As a licensed bank its revenue engine is net profit income (the spread between Sharia-compliant financing assets and the profit paid on Sanabil deposits) supplemented by card interchange, payment and FX fees and emerging SME-banking revenue. Public traction points are encouraging for its age — roughly three million customers and about SAR 3 billion in deposits by April 2026 — but income statement, margin, burn and runway figures are not publicly disclosed. The clearest financial fact is the June 2026 capital increase: approximately SAR 1.5 billion of new equity lifting paid-up capital and setting a post-money valuation near SAR 6 billion (~US$1.6 billion), which signals both shareholder conviction and continued financing dependency typical of a bank scaling its balance sheet. Saudi banking-sector benchmarks frame the opportunity and the risk: incumbents earn net interest margins of roughly 2.8-3.0% on far larger, cheaper deposit bases, while a challenger paying premium Sanabil profit rates to gather deposits faces structurally tighter early-stage margins and, like digital banks globally, a multi-year path to profitability. This chapter maps revenue streams, monetization, unit-economics proxies and capital adequacy, and is explicit that the absence of audited financials is the central diligence blocker."
  },
  "sections": [
    {
      "id": "revenue-monetization",
      "title": "Revenue streams and monetization",
      "body": "As a licensed bank rather than a payments startup, D360's economics rest on classic banking mechanics adapted to a digital, Sharia-compliant model. Its primary revenue engine is net profit income — the spread between the return on financing assets and the profit paid to depositors on Sanabil savings products. Around this core sit fee-based streams: card interchange, payment and transfer fees, foreign-exchange margin, and an emerging SME-banking line carrying account, payment and financing fees. The consumer proposition is deliberately fee-light — free or low-fee current accounts paired with competitive savings profit rates — which shifts monetization toward the asset-side spread and interchange rather than account charges. This is the same low-friction pattern digital banks use to acquire price-sensitive, mobile-first customers, and it means revenue quality depends heavily on how profitably the roughly SAR 3 billion deposit base can be deployed. The revenue-model bridge traces the chain from customers to deposits to deployed financing assets to spread and, after deposit cost, to gross profit; fee income enters as a less rate-sensitive supplement. Crucially, while the existence and mechanics of these streams are clear, D360 discloses none of the underlying values — margin, mix, interchange volumes or fee schedules — so the tables flag each as a diligence ask rather than a known quantity. The monetization table similarly captures list versus realized pricing and the unknown discounting and FX-spread economics that a proper review would need to resolve.",
