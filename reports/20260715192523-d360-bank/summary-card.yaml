  topStrengths:
    - First fully-licensed pure-play digital bank in Saudi Arabia with credible PIF-linked and Derayah backing.
    - 'Exceptionally fast traction: ~3 million customers and ~SAR 3 billion deposits within ~18 months of launch.'
    - Strong structural tailwinds — young, mobile-first population and Vision 2030 fintech policy support.
    - Best-capitalised of the three Saudi digital banks after the June 2026 raise.
  topRisks:
    - No audited financials, margins, retention or capital-adequacy disclosure — valuation underwritten on trust.
    - Net-interest-margin compression from premium Sanabil deposit rates and rising credit exposure.
    - Intense competition from STC Bank's telecom-scale distribution and well-capitalised incumbents.
    - Risk that headline account growth overstates active, primary-relationship usage (dormancy).
  unresolvedGaps:
