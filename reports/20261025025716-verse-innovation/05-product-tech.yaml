      - ["Personalization and machine learning", "Ranks content and supports creator and advertising use cases", "Behavioral data, model operations and language coverage", "Model evaluation, privacy basis, bias controls and infrastructure cost are undisclosed"]
      - ["Advertising and monetization", "Connects audiences to campaigns and emerging commerce formats", "Advertiser permissions, partners, virtual assets and payment processes", "FY24 audit findings included documentation and control weaknesses"]
      - ["Platform governance and IT controls", "Controls access, processes and operational execution", "IT policies, process workshops and documentation frameworks", "Remediation testing, certifications, incidents and service reliability evidence are gaps"]
    notes: "This is an evidence-bounded operating model, not a disclosed software architecture; dependencies and risks are retained where implementation detail is unavailable."
    claimRefs: [CE006, CE009, CE010, CE011, CE012, CE013]

figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: VerSe's publicly described product system links content supply to intelligence, distribution and monetization, but the implementation boundaries are not disclosed.
    data:
      layers:
        - label: Content and creator supply
          detail: Licensed publishers and individual creators provide the content supply.
          items:
            - name: Licensed publishers
              detail: Local-language content partners feed the consumer surfaces.
            - name: Individual creators
              detail: Historical reporting described a large creator ecosystem; current scale is not verified.
        - label: Data and identity
          detail: Behavioral and content signals are an implied dependency for personalization.
          items:
            - name: Behavioral signals
              detail: User and content signals are an implied dependency for personalization; public data lineage is not disclosed.
        - label: Intelligence and product systems
          detail: Reported AI and machine-learning systems rank content and support automation.
          items:
            - name: Personalization
              detail: Reported AI and machine-learning systems support content relevance.
            - name: Unified intelligence layer
              detail: April 2026 reporting described this as a planned cross-product automation layer.
        - label: Consumer and creator surfaces
          detail: Dailyhunt, Josh and other named products deliver reader and creator experiences.
          items:
            - name: Dailyhunt
              detail: Local-language news and content destination.
            - name: Josh
              detail: Short-video and creator surface.
            - name: Magzter and Oneindia
              detail: Additional named media products.
        - label: Monetization and controls
          detail: Advertising, subscriptions, commerce and live formats are reported monetization surfaces.
          items:
            - name: Advertising
              detail: Advertising systems are a stated AI use case and a reported control area.
            - name: Subscriptions, commerce and live formats
              detail: Reported expansion areas whose realized economics and controls are not public.
        - label: Reliability and governance
          detail: IT access, process controls, moderation and remediation evidence govern operating risk.
          items:
            - name: IT access and process controls
              detail: Reported remediation areas following FY24 audit findings.
    approximationNotes: "Layer order represents the reported operating logic, not a verified technical dependency graph or quantified data flow."
    claimRefs: [CE001, CE005, CE006, CE009, CE012]

callouts:
  - calloutType: strength
    title: Broad local-language distribution thesis
    body: The evidence supports a multi-surface local-language distribution and creator model with meaningful historical scale signals, although current product-level metrics are not available.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Architecture and control disclosure gap
    body: The investment case depends on AI and platform execution that is described strategically but not technically, while FY24 audit reporting identified control weaknesses relevant to advertising, virtual assets and IT processes.
    claimRefs: [CE006, CE009, CE010, CE011, CE012]
  - calloutType: recommendation
    title: Require product and trust evidence
    body: Before underwriting product defensibility, request current per-product cohorts, model evaluation and privacy materials, reliability metrics, security attestations, moderation controls and tested remediation evidence.
    claimRefs: [CE010, CE013, CE014]

