    claimRefs: [CU003, CU009, CU010, CU013]
figures:
  - id: FU001
    title: Customer journey from reach to durable monetization
    summary: The disclosed journey moves from audience and creator supply to engagement, monetization experiments, and the still-unverified durability layer.
    type: journey-map
    data:
      items:
        - label: Audience acquisition
          detail: Multilingual readers and short-video viewers enter Dailyhunt or Josh.
          touchpoints: [Dailyhunt content, Josh short video, 15-language distribution]
        - label: Repeat engagement
          detail: Reported MAU, DAU share, and video plays indicate an engagement surface.
          touchpoints: [150m Josh MAUs claimed, 49% DAU/MAU claimed, ">80bn monthly video plays claimed"]
        - label: Creator supply
          detail: Creators and content partners provide licensed or user-generated inventory.
          touchpoints: [">50m local-language creators claimed", ">100,000 partners and individual creators claimed"]
        - label: Advertiser demand
          detail: Audience and content inventory can be packaged for advertising.
          touchpoints: [Indian digital advertising growth context, monetization claims]
        - label: Commerce expansion
          detail: Management described influencer, social, live, and ecommerce monetization ambitions.
          touchpoints: [Influencer commerce, live commerce, ecommerce partnerships]
        - label: Durable revenue
          detail: Current paid conversion, renewals, retention, and concentration remain unverified.
          touchpoints: [No NRR or GRR disclosed, no cohort retention, no customer concentration data]
      xAxis: "Customer progression"
