      - [Canada Pension Plan Investment Board, Strategic investor, Led VerSe's 2022 financing, Investment relationship, Investor described VerSe as positioned in short video and local-language content, "Investor statement is not customer proof and does not establish product adoption."]
      - [Ontario Teachers' Pension Plan Board, Strategic investor, Participated in VerSe's 2022 financing, Investment relationship, Capital participation reported, "Financing participation is not evidence of paid customer use or retention."]
      - [Ecommerce partners, Commerce partner target, "Planned influencer, social, or live commerce integrations", Planned/targeted, Management described partnership ambitions, "No named operating partner, launch result, GMV, or repeat-purchase metric."]
    notes: "Partial enumeration of named parties and populations in the assigned pool; the sources do not identify three independently verified production customer deployments with outcomes."
