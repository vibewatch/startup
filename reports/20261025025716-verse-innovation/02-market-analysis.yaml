callouts:
  - calloutType: strength
    title: Multilingual distribution and monetization adjacency
    body: VerSe has disclosed or been described across local-language content, programmatic advertising and creator-campaign workflows, giving it multiple routes to monetize attention rather than a single product surface.
    claimRefs: [CM001, CM002, CM003, CM011]
  - calloutType: risk
    title: Large ceiling, unproven company-specific capture
    body: India's digital advertising ceiling is material, but public evidence does not isolate VerSe's reachable spend, monetizable activity, pricing, retention, take rate or contribution margin.
    claimRefs: [CM005, CM006, CM009, CM015]
  - calloutType: recommendation
    title: Require denominator evidence before underwriting SOM
    body: Request product-level cohorts, active and monetizable users, advertiser retention, yield/fill, subscription conversion and segment contribution margins before translating market breadth into valuation.
    claimRefs: [CM006, CM009, CM015]

