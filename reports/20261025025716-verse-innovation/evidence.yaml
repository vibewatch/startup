evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capitalization
    missingEvidence: Current cap table, preference stack, debt, warrants, secondary transactions, and cash balance.
    whyItMatters: Historic valuation and funding totals do not establish common-equity value, dilution, or liquidity.
    diligencePath: >-
      Obtain the latest capitalization table, financing documents, debt schedule, and board-approved cash forecast under
      NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board, committees, executive roster, succession coverage, and related-party disclosures.
    whyItMatters: A multi-product acquisition strategy increases dependence on governance quality and key-person continuity.
    diligencePath: >-
      Request current governance materials, shareholder agreements, board minutes, and an executive responsibility
      matrix.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A current, deduplicated definition of monthly active, daily active, paying, and monetizable users by product.
    whyItMatters: >-
      Reported user counts come from different years and may not be comparable to customers, payers, or
      revenue-generating accounts.
    diligencePath: >-
      Reconcile product analytics definitions and obtain cohort retention, monetization, and geographic splits for the
      latest twelve months.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: Current third-party price discovery after the 2022 financing.
    whyItMatters: >-
      The last documented $5 billion valuation may not represent current enterprise or equity value after later
      operating changes.
    diligencePath: >-
      Seek latest secondary transaction evidence, investor marks, independent valuation work, or a new financing term
      sheet.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete current leadership and board enumeration.
    whyItMatters: The named-person table is a source-bounded sample and may omit decision-makers or control holders.
    diligencePath: Obtain the current organization chart, board roster, and statutory filings.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Product-level active users, monetizable users, ad inventory, fill, yield, pricing, paid conversion and segment
      contribution margins.
    whyItMatters: >-
      Without denominators and unit economics, country-level advertising spend and historical reach cannot be converted
      into VerSe SAM, SOM or valuation support.
    diligencePath: >-
      Request monthly cohort, monetization and contribution-margin data by Dailyhunt, Josh, Premium, Collab and
      NexVerse.ai for the latest eight quarters.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: stale
    severity: material
    topic: user-reach
    missingEvidence: Current 2026 active, daily-active, monetizable and retained user counts by product.
    whyItMatters: >-
      The available Dailyhunt and Josh figures are company claims reported in 2022 and may not represent the current
      addressable audience.
    diligencePath: >-
      Obtain audited or board-pack operating dashboards with definitions, cohorts and reconciliation to reported
      revenue.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: missing-source
    severity: minor
    topic: advertising-market
    missingEvidence: >-
      A usable 2026 India digital advertising report from the retained Dentsu URL or another eligible independent
      source.
    whyItMatters: >-
      The current-run source was successfully fetched but its retained text is a U.S.-law disclaimer, leaving the latest
      market estimate dependent on older secondary research.
    diligencePath: >-
      Obtain the underlying Dentsu e4m report or a public 2026 India advertising forecast with methodology and
      geography.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Current cohort retention, advertiser renewal, creator retention, realized pricing, and contribution margin by
      VerSe product surface.
    whyItMatters: Reach and feature breadth do not establish durable competitive advantage or cash-generating economics.
    diligencePath: >-
      Request product-level cohort, advertiser, creator, pricing, and contribution-margin schedules for Dailyhunt, Josh,
      Premium, Collab, and NexVerse.ai.
    relatedQuestionRefs:
      - QP006
      - QP008
      - QP010
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: competitor-economics
    missingEvidence: Audited and consistently defined peer financial and user metrics on the same fiscal and accounting basis.
    whyItMatters: Reported revenue, cash flow, EBITDA, ARR, MAU, and DAU figures use different definitions and periods.
    diligencePath: >-
      Normalize peer disclosures to a common fiscal period and request management definitions before using them for
      valuation or benchmarking.
    relatedQuestionRefs:
      - QP002
      - QP005
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: A current exhaustive map of regional-language, creator, adtech, and short-video alternatives in India.
    whyItMatters: >-
      The assigned pool supports a representative landscape but cannot prove that all material entrants and substitutes
      are covered.
    diligencePath: >-
      Refresh competitor discovery by product class and validate the list with advertiser, creator, and
      distribution-partner interviews.
    relatedQuestionRefs:
      - QP001
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, debt, committed facilities, monthly cash burn, runway, acquisition consideration, and next-round
      trigger.
    whyItMatters: >-
      Historical funding and a forward profitability target cannot establish liquidity or whether another financing is
      required.
