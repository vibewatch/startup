callouts:
  - calloutType: recommendation
    title: Decision
    body: >-
      Track rather than buy: the operating trajectory is promising, but the public record does not support a current price-sensitive underwriting decision.
    claimRefs: [CV001, CV005, CV018]
  - calloutType: risk
    title: Principal valuation risk
    body: >-
      A historical $5 billion financing mark can overstate present common-equity value if growth, burn, preferences, debt, or market multiples have changed.
    claimRefs: [CV005, CV007, CV010, CV017]
  - calloutType: assumption
    title: Required diligence
    body: >-
      Obtain the fully diluted cap table, preference and debt waterfall, current financing or secondary price, audited FY25/FY26 accounts, and control-remediation evidence.
    claimRefs: [CV008, CV009, CV016, CV017]
