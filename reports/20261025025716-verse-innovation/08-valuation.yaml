  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, track, "Do not underwrite a buy without a current entry price"]
      - [Confidence, medium, "Operating evidence is meaningful but valuation evidence is incomplete"]
      - [Risk rating, high, "Burn, audit history, and private-company disclosure gaps remain material"]
      - [Valuation stance, unknown, "The last disclosed $5 billion mark is historical and no current price is exposed"]
    notes: Company-reported FY25 performance and historical financing disclosures are not a current common-equity valuation; unknown means the pool lacks a defensible current price.
    claimRefs: [CV001, CV004, CV005, CV016, CV017]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Scale and growth, "FY25 revenue from operations rose 88% to INR 1,930 crore", "Audited results showing growth quality and cash conversion"]
      - [Efficiency improvement, "Reported EBITDA burn improved 20% to INR 738 crore", "Sustained break-even with a reconciled cash bridge"]
      - [Capital access, "$805 million raised at a reported $5 billion valuation in April 2022", "Current financing terms and a fully diluted cap table"]
      - [Governance and reporting risk, "FY23 audit and control concerns were publicly reported", "Independent evidence that remediation is complete and controls remain effective"]
    notes: Evidence combines company-issued performance claims with third-party financing and adverse reporting; it does not independently validate management forecasts.
    claimRefs: [CV001, CV003, CV006, CV016, CV017]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "FY25 growth persists; H2 FY26 break-even target is achieved; AI and subscription monetization scale", "Current price could be justified only with a fresh audited valuation supporting durable cash conversion", "Lower probability until targets are evidenced", "Break-even slips or monetization does not improve"]
      - [Base, "Growth moderates; burn declines but remains material; current terms remain unavailable", "Track and demand a price discovery event before underwriting return", "Most supportable from available evidence", "No current cap table or audited cash bridge"]
      - [Bear, "Growth quality weakens; reported burn persists; old 2022 mark loses relevance", "Avoid or require a substantial price reset and stronger protections", "Material downside cannot be quantified from public evidence", "Down round, renewed control issues, or failed commercialization"]
      - [IPO-readiness case, "Planned IPO work advances but disclosure and governance milestones remain unverified", "Exit optionality is not a return assumption until filings and terms exist", "Speculative", "IPO timing slips or audit/governance issues recur"]
    notes: Scenarios are qualitative because the pool lacks a current valuation, validated comparable multiples, and a fully reconciled financial model; no probability-weighted price is invented.
    claimRefs: [CV002, CV004, CV005, CV011, CV016, CV017, CV019]
