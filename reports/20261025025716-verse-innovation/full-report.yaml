        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The public record in this pool identifies Virendra Gupta as founder and Umang Bedi as co-founder;
              reporting also describes Bedi as a former Facebook India managing director who joined VerSe in 2018 and
              was elevated to co-founder in 2020. The available sources do not provide a complete board roster,
              committee structure, voting arrangements, succession plan, or a current executive list. That gap matters
              because the business spans several operating models and has pursued acquisitions, international expansion,
              and an IPO-scale ambition. Based on the available record, founder and senior-operator dependence should be
