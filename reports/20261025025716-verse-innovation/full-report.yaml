      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The documented sequence runs from the 2007 Newshunt launch, through the 2022 financing and valuation
              event, to the 2024 Magzter acquisition and the FY24 cost reset reported in 2025. The evidence also records
              planned or reported AI, creator, commerce, and subscription initiatives, but it does not prove that all
              initiatives reached scaled commercialization. A peer source shows that comparable Indian short-video
              platforms have been pursuing cost reduction and subscription diversification, which reinforces competitive
              execution risk but is not an independent benchmark for VerSe. The central diligence gap is therefore not
              product identity; it is current economic quality: audited segment revenue, retention, cash runway,
