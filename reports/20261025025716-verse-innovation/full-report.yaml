        title: Capital history and operating scale
        blocks:
          - type: paragraph
            body: >-
              VerSe reported an $805 million financing led by CPPIB in 2022 at a $5 billion post-money valuation, with
              Ontario Teachers' Pension Plan Board, Luxor Capital, Sumeru Ventures, and existing backers participating.
              The same reporting said the company had raised more than $2 billion in total capital, while another
              account described $1.5 billion raised in the preceding year; these are different periods and should not be
              combined. Operating metrics are similarly period-specific: Dailyhunt and Josh user figures are
              company-reported, while Mint reported FY24 revenue of ₹1,261 crore and EBITDA burn of ₹710 crore after a
              difficult year. No source in the assigned pool establishes a current valuation, cash balance, debt,
              dilution, liquidation preferences, or current headcount.
