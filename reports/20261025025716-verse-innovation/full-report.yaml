  - id: FI001
    title: Disclosed revenue-to-profitability model
    type: flow
    summary: >-
      VerSe's disclosed model links audience and advertiser activity to multiple monetization surfaces, while the
      available evidence leaves realized take rates and cash conversion unresolved.
    data:
      nodes:
        - id: audience
          label: Multilingual audience
          detail: >-
            More than 300 million users in Sofina's portfolio description; later coverage says over 350 million users
            across platforms.
        - id: ad-products
          label: Advertising
          detail: Dailyhunt, Nexverse.ai, Valueleaf, and Josh advertising.
        - id: subscriptions
          label: Subscriptions
          detail: >-
            Magzter and Dailyhunt Premium are identified subscription surfaces; price, paid units, and churn are
            undisclosed.
        - id: commerce
          label: Commerce
          detail: Josh commerce includes VerSe Collab commissions, live-streaming gifts and tips, and physical e-commerce.
        - id: reported-revenue
          label: Reported operating revenue
          detail: INR 1,930 crore in FY25 according to cited coverage; product allocation is not disclosed.
        - id: reported-ebitda
          label: Reported EBITDA outcome
          detail: FY25 EBITDA margin reported at -38%; H2 FY26 profitability remains a management target.
      edges:
        - from: audience
          to: ad-products
        - from: audience
          to: subscriptions
        - from: audience
          to: commerce
        - from: ad-products
          to: reported-revenue
        - from: subscriptions
          to: reported-revenue
        - from: commerce
          to: reported-revenue
        - from: reported-revenue
          to: reported-ebitda
    approximationNotes: >-
      The flow expresses disclosed business mechanisms, not a proportional revenue bridge; no source supplies comparable
      segment values, take rates, or cash conversion.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI011
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      VerSe's publicly described product system links content supply to intelligence, distribution and monetization, but
      the implementation boundaries are not disclosed.
    data:
      layers:
        - label: Content and creator supply
          detail: Licensed publishers and individual creators provide the content supply.
          items:
            - name: Licensed publishers
              detail: Local-language content partners feed the consumer surfaces.
            - name: Individual creators
              detail: Historical reporting described a large creator ecosystem; current scale is not verified.
        - label: Data and identity
          detail: Behavioral and content signals are an implied dependency for personalization.
          items:
            - name: Behavioral signals
              detail: >-
                User and content signals are an implied dependency for personalization; public data lineage is not
                disclosed.
        - label: Intelligence and product systems
          detail: Reported AI and machine-learning systems rank content and support automation.
          items:
            - name: Personalization
              detail: Reported AI and machine-learning systems support content relevance.
            - name: Unified intelligence layer
              detail: April 2026 reporting described this as a planned cross-product automation layer.
        - label: Consumer and creator surfaces
          detail: Dailyhunt, Josh and other named products deliver reader and creator experiences.
          items:
            - name: Dailyhunt
              detail: Local-language news and content destination.
            - name: Josh
              detail: Short-video and creator surface.
            - name: Magzter and Oneindia
              detail: Additional named media products.
        - label: Monetization and controls
          detail: Advertising, subscriptions, commerce and live formats are reported monetization surfaces.
          items:
            - name: Advertising
              detail: Advertising systems are a stated AI use case and a reported control area.
            - name: Subscriptions, commerce and live formats
              detail: Reported expansion areas whose realized economics and controls are not public.
        - label: Reliability and governance
          detail: IT access, process controls, moderation and remediation evidence govern operating risk.
          items:
            - name: IT access and process controls
              detail: Reported remediation areas following FY24 audit findings.
    approximationNotes: >-
      Layer order represents the reported operating logic, not a verified technical dependency graph or quantified data
      flow.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
      - CE012
  - id: FU001
    title: Customer journey from reach to durable monetization
    summary: >-
      The disclosed journey moves from audience and creator supply to engagement, monetization experiments, and the
      still-unverified durability layer.
    type: journey-map
    data:
      items:
        - label: Audience acquisition
          detail: Multilingual readers and short-video viewers enter Dailyhunt or Josh.
          touchpoints:
            - Dailyhunt content
            - Josh short video
            - 15-language distribution
        - label: Repeat engagement
          detail: Reported MAU, DAU share, and video plays indicate an engagement surface.
          touchpoints:
            - 150m Josh MAUs claimed
            - 49% DAU/MAU claimed
            - '>80bn monthly video plays claimed'
        - label: Creator supply
          detail: Creators and content partners provide licensed or user-generated inventory.
          touchpoints:
            - '>50m local-language creators claimed'
            - '>100,000 partners and individual creators claimed'
        - label: Advertiser demand
          detail: Audience and content inventory can be packaged for advertising.
          touchpoints:
            - Indian digital advertising growth context
            - monetization claims
        - label: Commerce expansion
          detail: Management described influencer, social, live, and ecommerce monetization ambitions.
          touchpoints:
            - Influencer commerce
            - live commerce
            - ecommerce partnerships
        - label: Durable revenue
          detail: Current paid conversion, renewals, retention, and concentration remain unverified.
          touchpoints:
            - No NRR or GRR disclosed
            - no cohort retention
            - no customer concentration data
      xAxis: Customer progression
