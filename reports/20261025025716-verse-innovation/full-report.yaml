chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              VerSe Innovation is described in the assigned reporting as the Bengaluru-based parent of Dailyhunt, a news
              aggregator, and Josh, a short-video platform. The company began with the Newshunt portal in 2007 and has
              positioned itself around local-language content, artificial intelligence, creator distribution,
              advertising, and commerce. Its product set has expanded beyond advertising: the Magzter acquisition was
              presented as a move toward paid subscriptions, with Dailyhunt Premium intended to bundle international
              publications and an ad-free experience. The evidence supports a multi-app, multi-geography media platform,
              but it does not establish a current consolidated revenue mix or the contribution of each product.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
