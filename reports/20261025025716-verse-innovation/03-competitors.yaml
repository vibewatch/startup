  - id: TP003
    title: Capability, monetization, and moat comparison
    columns: [Buying criterion, VerSe evidence, Peer evidence, Assessment, Diligence gap]
    rows:
      - [Regional-language reach, "Dailyhunt content in 14-15 languages and a 100,000+ content-partner ecosystem reported in 2022 coverage", "ShareChat/Moj operates across multiple languages and reaches a large monetisable base", "Potential VerSe strength, but comparative engagement is unknown", "Language-level MAU, retention, and content supply by market"]
      - [Short-video distribution, "Josh reported 150M monthly active users and 49% daily-active share in ET coverage", "ShareChat/Moj combines social distribution with short video and micro-dramas", "Competitive scale is material on both sides", "Current DAU/MAU, cohort retention, and creator activity"]
      - [Monetization breadth, "Advertising, influencer commerce, live commerce, and subscription surfaces are described for VerSe", "ShareChat adds QuickTV subscriptions and ad-supported micro-dramas", "Both pursue multi-homing-resistant monetization, but execution is unproven", "Realized ARPU, take rate, renewal, and contribution margin"]
      - [Advertiser and creator switching costs, "VerSe reported 400 advertisers and performance-oriented billing in 2022 coverage", "Kofluence reports 52% marketer preference for micro-influencers in hyperlocal campaigns", "Demand exists, but supply and buyers can use multiple platforms", "Advertiser renewal, creator exclusivity, and incremental ROI"]
    notes: "Cells combine source-backed observations with explicitly labeled assessment; no unsupported feature parity or pricing has been imputed."
    claimRefs: [CP002, CP009, CP010, CP011, CP012, CP014]
