callouts:
  - calloutType: strength
    title: Distribution is the strategic asset
    body: VerSe's multilingual audience, creator supply, and multiple monetization surfaces can create cross-side reinforcement if retention and advertiser outcomes hold.
    claimRefs: [CP001, CP002, CP010]
  - calloutType: risk
    title: ShareChat is a credible execution benchmark
    body: ShareChat/Moj's reported cost discipline, cash-flow-positive core, and micro-drama expansion show that a direct peer is improving economics while adding adjacent inventory.
    claimRefs: [CP005, CP006, CP007, CP008]
  - calloutType: recommendation
    title: Underwrite durability, not reach alone
    body: The next diligence step should test cohort retention, advertiser renewal, creator economics, realized pricing, and contribution margins by product surface.
    claimRefs: [CP011, CP012, CP014]
