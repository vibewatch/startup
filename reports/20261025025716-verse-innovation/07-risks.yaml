    notes: "Sources: Economic Times, New Indian Express, Analytics India Magazine, Mathrubhumi, and Tofler; concentration is marked unknown where revenue or funding dependency is not disclosed."
    claimRefs: [CR003, CR004, CR005, CR006, CR009, CR010]
