  topStrengths:
    - Large multilingual consumer reach across Dailyhunt and Josh with a diversified product surface.
    - Reported FY25 revenue growth and lower EBITDA burn indicate operating improvement.
    - Institutional financing history and Magzter expansion provide strategic and capital depth.
  topRisks:
    - Current valuation, preference stack, debt seniority, and common-equity entry price are undisclosed.
    - Governance, audit-control, and transaction-scrutiny issues remain incompletely remediated in public evidence.
    - Segment margins, retention, advertiser quality, and cash conversion are not independently established.
  unresolvedGaps:
    - Full cap table, liquidation preferences, debt, warrants, and senior claims ahead of common equity.
    - Business-line revenue, gross margin, and burn contribution across major products.
    - Advertiser renewal, creator retention, subscription churn, and concentration metrics.
    - Board-level control-remediation tracker and tested evidence that FY24 weaknesses are closed.
    - Concrete IPO-readiness milestones, advisor scope, and governance workstreams.
