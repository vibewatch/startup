  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, debt, committed facilities, monthly cash burn, runway, acquisition consideration, and next-round trigger.
      whyItMatters: Historical funding and a forward profitability target cannot establish liquidity or whether another financing is required.
      diligencePath: Request the latest management accounts, 24-month cash forecast, debt schedule, facility covenants, acquisition payment schedule, and board-approved financing plan.
      relatedQuestionRefs: [QI005, QI008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Product-level revenue, gross margin, take rates, CAC, payback, retention, churn, and advertiser or creator concentration.
      whyItMatters: Consolidated revenue growth can conceal loss-making products, weak cohorts, or unfavorable gross-to-net economics.
      diligencePath: Request monthly cohort and segment reporting reconciled to audited accounts, including realized pricing, discounts, refunds, creator payouts, and customer concentration.
      relatedQuestionRefs: [QI004, QI006, QI008]
      relatedTableRefs: [TI002, TI003]
    - type: conflicting-data
      severity: material
      topic: restatement
      missingEvidence: Audited reconciliation explaining the FY23 income adjustment and tested closure of the internal-control weaknesses reported by Deloitte.
      whyItMatters: Restated figures and reported control gaps reduce confidence that period-over-period growth and margin comparisons are directly comparable.
      diligencePath: Obtain Deloitte's control findings, management remediation tracker, testing results, and an audited bridge from the originally filed FY23 numbers to the FY24 restated figures.
      relatedQuestionRefs: [QI007, QI008]
