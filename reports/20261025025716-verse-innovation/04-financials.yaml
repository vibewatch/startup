      - [Josh advertising, Not disclosed, Unknown, 30-35% of Josh revenue was described as advertising in the cited 2024 report, "Obtain realized yield, fill rate, platform fees, and customer concentration."]
      - [Dailyhunt Premium or Magzter subscription, Subscription price and paid units not disclosed, Unknown, Magzter is described as subscription-led and single-digit EBITDA positive, "Obtain price cards by market, paid subscribers, churn, ARPU, and revenue recognition policy."]
      - ["Josh commerce", "Commission, gifts, tips, and physical e-commerce terms not disclosed", "Unknown", "Commerce was described as 65-70% of Josh revenue in the cited 2024 report", "Obtain gross-to-net policy, creator payouts, refunds, and contribution margin by commerce type."]
      - [Nexverse.ai and Valueleaf, Advertiser performance and platform monetization, Unknown, Management projected $100 million revenue and 10% EBITDA margin for the combined business, "Obtain customer contracts, take rate, ROAS evidence, and realized FY25 performance."]
    notes: "No assigned source provides public list pricing or realized pricing schedules; all missing values remain unknown rather than being inferred from revenue or users."
    claimRefs: [CI002, CI006, CI011]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [FY25 operating revenue, "INR 1,930 crore", medium, "Shows scale and reported growth but not recurring revenue quality or segment mix.", "Reconcile to audited consolidated statements and segment disclosures."]
      - [FY25 total revenue including other income, "INR 2,071 crore", medium, "Separates a broader total from operating revenue but may include non-operating items.", "Obtain the full income statement and composition of other income."]
      - [FY25 EBITDA burn, "INR 738 crore", medium, "Indicates losses remained material despite a reported 20% reduction.", "Reconcile EBITDA, cash EBITDA, operating cash flow, and acquisition-related costs."]
      - [FY25 EBITDA margin, "-38%", medium, "Shows the company was not EBITDA positive on the reported consolidated measure.", "Obtain segment margins and bridge from EBITDA to cash burn."]
      - ["CAC, payback, gross margin, cash balance, net debt, runway, and NRR", null, low, "These are core underwriting inputs but are not disclosed in the assigned sources.", "Request a monthly management pack with cohort CAC, payback, gross margin, cash, debt, runway, and retention by business."]
    notes: "Values are reported or described in assigned external coverage; null denotes unavailable private evidence, not zero. EBITDA burn is not cash burn, and revenue is not ARR."
    claimRefs: [CI003, CI007, CI008, CI009, CI012, CI013, CI015, CI016]

