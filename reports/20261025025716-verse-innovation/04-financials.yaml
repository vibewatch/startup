    claimRefs: [CI001, CI002, CI003, CI007, CI011, CI015]

callouts:
  - calloutType: strength
    title: Reported operating improvement
    body: FY25 coverage reports higher operating revenue, lower EBITDA burn, and a narrower EBITDA margin loss, providing evidence of progress even though profitability was not yet achieved.
    claimRefs: [CI003, CI007, CI008, CI015, CI016]
  - calloutType: risk
    title: Revenue-quality and liquidity blind spots
    body: The assigned evidence does not disclose current cash, debt, runway, business-line margins, customer concentration, or realized pricing, while reported control weaknesses and a financial restatement require reconciliation before relying on the growth headline.
    claimRefs: [CI010, CI012, CI013, CI014]
  - calloutType: recommendation
    title: Underwrite to verified cash conversion
    body: Treat H2 FY26 profitability as a management objective and require audited segment economics, cash-burn reconciliation, and control-remediation evidence before upgrading the financial view.
    claimRefs: [CI009, CI010, CI012, CI014]

