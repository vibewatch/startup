  topStrengths:
    - Strong tailwinds from India's expanding UHNI, HNI, and family-office wealth pools
    - Integrated regulated platform spanning advice, execution, PMS, AIF, and IFSC alternatives
    - Blue-chip backing from MUFG, Euclidean, Peak XV, and TVS Capital alongside visible asset-scale proxies
  topRisks:
    - Group-level revenue, profit, cash, and retention metrics remain undisclosed despite a unicorn valuation
    - Regulatory complexity is high across SEBI and IFSCA entities, including a documented 2025 IFSC warning and investor-caution notices
    - Incumbents such as 360 ONE, Nuvama, Kotak, and global private banks retain stronger disclosure, distribution, and brand trust
  unresolvedGaps:
    - Audited FY24-FY26 revenue, margin, cash-flow, and burn data are not public
    - The precise terms, dilution, and governance consequences of the March 2026 TVS Capital round are undisclosed
    - Public sources conflict on PMS-level client and AUM data and do not disclose concentration, churn, or renewal behavior
