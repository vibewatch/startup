companyProfile:
  summary: Neo Group is a Mumbai-based private wealth and alternative-assets platform that combines advisory, broking, depository, PMS, Cat II and Cat III AIF, and GIFT City fund-management wrappers under one brand family. The company positions itself as a premium, knowledge-led, technology-powered partner for family offices, UHNIs, HNIs, institutions, and corporates, and public evidence shows it scaled quickly from a 2021 launch into a unicorn-marking PE round in March 2026.
  foundedDate: '2021-10-01'
  founders:
    - name: Nitin Jain
      role: Founder; Chairman & Managing Director
      background: Former Edelweiss executive who sources say launched Neo in 2021 with former Edelweiss colleagues.
      claimRefs: [CO010, CO011, CO012]
    - name: Varun Bajpai
      role: Co-Founder; Chairman
      background: Publicly listed Neo co-founder and chairman in the wealth-and-asset-management platform.
      claimRefs: [CO014]
    - name: Hemant Daga
      role: Co-Founder; CEO, Neo Asset Management
      background: Former Edelweiss Asset Management executive with deep alternative-credit and asset-management experience.
      claimRefs: [CO015, CO024]
    - name: Shajikumar Devakar
      role: Co-Founder; CEO, Neo Wealth Management
      background: Senior private-banking executive previously associated with 360 ONE Wealth, Barclays Wealth, and Deutsche Wealth Management.
      claimRefs: [CO019, CO021]
  foundingLocation: Mumbai, India
  headquarters: Mumbai, India
  productSummary: Advisory-led wealth management plus broking, depository, mutual fund/PMS/AIF distribution, PMS, Category II/III AIFs, private credit, and IFSC/GIFT City alternatives.
  customerFocus: Family offices, UHNIs, HNIs, institutions, and corporates in India and adjacent cross-border structures
  businessModel: Fee income from advisory, broking, distribution, portfolio management, alternative funds, and related premium wealth services
