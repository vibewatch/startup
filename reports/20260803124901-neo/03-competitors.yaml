- id: moat-durability-and-public-risks
  title: Moat durability and public risk signals
  body: 'The moat question is whether Neo can compound enough trust and workflow gravity before incumbents harden their position further. The public evidence suggests the strongest incumbent moats are recurring revenue, RM density, alternatives access, cross-border connectivity and the ability to attach adjacent services such as lending, estate planning and governance support. 360 ONE’s recurring-asset model and acquisition history set the scale benchmark. Nuvama’s breadth across client types makes it a formidable distribution machine. Anand Rathi and Motilal show that well-run relationship firms can reach material scale without matching the very largest player. Julius Baer and DBS keep the premium cross-border end contested. The public-market lens also shows risk: Citi flagged concerns over transactional revenue exposure, and public sources still do not provide clean apples-to-apples private-wealth fee schedules or win-loss data. That leaves Neo’s moat durability unresolved. Without proprietary
    evidence on retention, client migration and share of wallet, the fairest conclusion is that Neo is attacking an attractive but already professionalizing battlefield.'
