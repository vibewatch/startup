callouts:
- calloutType: insight
  title: The biggest substitute is still the status quo
  body: A large share of Indian rich-household wealth is still self-managed or served by informal channels, so Neo must first displace habits and trusted legacy relationships before it wins formal bake-offs against organized rivals.
  claimRefs:
  - CP026
  - CP029
  - CP035
- calloutType: risk
  title: Scale incumbents already stack the same wrappers Neo needs
  body: Public materials from 360 ONE, Nuvama, Motilal and other incumbents show that alternatives, advisory, family-office support and cross-border trust are not white-space features. Neo’s moat therefore hinges on execution, not category novelty.
