company:
  name: Neo Group
chapter:
  number: 3
  title: Competitors
  summary: Neo competes in Indian premium private wealth against a layered field rather than one neat peer set. The strongest domestic incumbents are 360 ONE, Nuvama, Anand Rathi Wealth and Motilal Oswal Private Wealth, while Kotak Private, Julius Baer India and DBS Private Bank compete on trust, international access and family-office style services. The main competitive risk is not only direct vendor overlap but also the status quo of self-managed or loosely institutionalized family capital, which means Neo’s moat must come from digital execution and premium-advisory quality rather than from scale today.
sections:
- id: neo-versus-organized-incumbents
  title: Neo versus organized incumbents
  body: 'Neo’s own public disclosures and funding coverage position it as a premium-segment wealth platform with multiple wrappers rather than a pure consumer-investing app. The Economic Times and Business Standard both put Neo around ₹35,000 crore of wealth AUA in 2024, with over ₹6,000 crore of alternatives AUM, while its official pages show broking, investment-advisory, PMS and AIF structures. That is meaningful, but it is still much smaller than the listed domestic incumbents. 360 ONE reported ₹6.74 lakh crore of AUM and 8,500-plus client families in FY26. Nuvama framed client assets at ₹4.5-plus trillion with 1,250 RMs. Anand Rathi and Motilal are smaller than 360 ONE or Nuvama in absolute scale, but they still operate at about ₹1 lakh crore and ₹1.96 lakh crore respectively. The competitive implication is clear: Neo is not entering a whitespace. It is attacking a field where scale incumbents already combine deep RM coverage with multi-wrapper product breadth.'
