  evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-wealth-fees
    missingEvidence: A comparable fee schedule or effective all-in pricing dataset across Neo and its main incumbent competitors.
    whyItMatters: Without comparable pricing data, packaging analysis can show structure and disclosure quality but cannot prove price leadership or margin pressure cleanly.
    diligencePath: Collect client-side proposals, RFP responses or channel checks showing advisory fees, wrapper fees, lending spreads and minimum-ticket policies.
    relatedQuestionRefs:
    - QP028
  - type: private-evidence-only
    severity: material
    topic: neo-win-rate
    missingEvidence: Neo’s internal win/loss, retention, NPS and share-of-wallet data against 360 ONE, Nuvama, Anand Rathi, Motilal and private-bank alternatives.
    whyItMatters: Moat durability cannot be judged confidently from public scale alone; execution and retention data are needed to show whether Neo actually converts premium prospects.
    diligencePath: Request cohort retention, source-of-business, competitive-loss codes and client-wallet penetration by segment and city.
    relatedQuestionRefs:
    - QP029
  - type: missing-source
    severity: minor
    topic: client-overlap
    missingEvidence: Public evidence on how often UHNI clients multi-home across several incumbents at once.
    whyItMatters: Multi-homing changes switching-cost assumptions and weakens any moat based only on account count.
    diligencePath: Use channel checks with RMs, family-office service providers or client interviews to estimate multi-homing prevalence.
    relatedQuestionRefs:
    - QP026
    - QP027
