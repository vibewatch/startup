- id: TP003
  title: Pricing / packaging comparison
  columns:
  - platform
  - public access model
  - publicly visible wrappers / entry point
  - relationship model
  - pricing disclosure gap
  - implication
  rows:
  - - Neo
    - Funding coverage and official site point to premium advisory plus broking and investment products
    - Official broking, advisory, PMS and AIF structures are visible
    - Hybrid digital plus adviser model
    - No clean all-in fee card in retained sources
    - Hard to prove price advantage publicly; product structure matters more than sticker price
  - - 360 ONE
    - High-touch full-stack private-wealth platform
    - Advisory, discretionary and non-discretionary mandates, distribution and lending
    - RM-led with broad service bundle
    - No simple public private-wealth fee card in retained sources
    - Competes on breadth and trust more than transparent entry pricing
  - - Nuvama
    - Integrated platform with products, advisory, capital and tech
    - Third-party and in-house products, advisory and capital solutions
    - RM-led plus technology-enabled servicing
    - Public materials disclose scale and segments, not standardized wealth fees
    - Can package more of the client wallet than Neo
  - - Anand Rathi Wealth
    - Private-wealth specialist with RM-heavy delivery
    - Public site emphasizes process and advisory relationship
    - CFO-like advisor model
    - No retained standardized fee schedule
    - Trust and RM quality may matter more than packaging
  - - Motilal Oswal Private Wealth
    - Open-architecture private wealth
    - Public site shows advisory, transaction, family and business solutions
    - Human-led with group-synergy cross-sell
    - No retained standardized fee sheet
    - Competes on breadth and family-service adjacency
  - - Julius Baer / DBS
    - Private-bank relationship entry
    - Booking-centre access, legacy planning, philanthropy, global connectivity
    - Private-banker-led
    - Pricing generally negotiated and not public in retained sources
    - Hardest for Neo to underwrite on price because trust and offshore access dominate
  notes: Public packaging data is much clearer than full private-wealth pricing. The table therefore compares relationship structure and visible wrappers rather than pretending to know negotiated client economics.
