- id: substitutes-and-status-quo
  title: Substitutes and the status quo
  body: 'A competitor map that lists only firms misses the status quo. Bernstein explicitly says much of India’s rich-household wealth is still self-managed or handled by unorganized channels. Hubbis adds that many family offices are still evolving and often operate more like sophisticated private-banking relationships than fully institutional investment platforms. That matters for Neo because a large share of competition will happen before a client ever reaches a formal beauty parade against 360 ONE or Nuvama. The substitute can be the family’s own finance office, a trusted local adviser, a promoter’s banking relationship or a partial do-it-yourself setup using listed-equity exposure, mutual funds and selective alternatives. Public surveys from Kotak show business-owning, aggressive investors dominate the ultra-HNI pool, which reinforces how sticky that status quo can be. Neo therefore has to replace not just rivals, but habits: self-management, fragmented external experts and legacy relationships
    that clients already trust.'
  claimRefs:
  - CP023
