- id: TP004
  title: Substitute map and switching-friction matrix
  columns:
  - substitute
  - why clients choose it
  - what breaks first
  - switching-friction artifact
  - implication for Neo
  rows:
  - - Self-managed promoter portfolio
    - Low explicit fees and direct control
    - Complexity rises with concentrated wealth, alternatives and cross-border needs
    - Existing habit and principal confidence
    - Neo must sell decision support before product
  - - Informal local advisor or broker
    - Trusted relationship and local access
    - Limited reporting, governance and product breadth
    - Personal trust built over years
    - Neo needs brand and RM credibility to displace this channel
  - - Partial family office
    - In-house control over family finances
    - Manager selection, governance and succession capability gaps
    - Internal staff and family politics
    - Neo can win as outsourced infrastructure or co-pilot
  - - Universal-bank private relationship
    - Balance-sheet trust and banking connectivity
    - May be less flexible or tech-forward than specialists
    - Bundled lending, deposits and branch relationships
    - Neo competes poorly unless digital/service gap is obvious
  - - Independent specialist platform
    - Perceived product depth or RM quality
    - May lack full family-office or cross-border support
    - Custom portfolios and RM bond
    - Neo needs clearer wedge than generic advice
  notes: This substitute table focuses on the pre-beauty-parade competition Neo faces before clients formally compare vendors.
  claimRefs:
