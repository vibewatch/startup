tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - public scale signal
  - target segment
  - differentiation
  - limitation / gap vs Neo
  rows:
  - - Neo Group
    - Premium wealthtech / organized wealth challenger
    - ₹35,000 Cr AUA and >₹6,000 Cr alts AUM in 2024; official PMS and AIF wrappers
    - Premium Indian consumers, HNI/UHNI, alternatives seekers
    - Digital-first execution with premium positioning
    - Public scale is still far below listed incumbents
  - - 360 ONE
    - Domestic full-stack wealth and asset manager
    - ₹6.74L Cr AUM; 8,500+ families; 32 offices
    - UHNI, HNI, family offices, treasury clients
    - Scale, recurring assets, lending and estate-planning adjacency
    - Neo cannot match its scale or acquisition-led reach today
  - - Nuvama Wealth
    - Integrated listed wealth platform
    - ₹4.5T+ client assets; 1,250 RMs; 100+ offices
    - Affluent, HNI, UHNI, family offices, corporates, institutions
    - Breadth across products, advisory, capital and tech
    - Heavier multi-segment platform may be less focused than Neo’s premium narrative
  - - Anand Rathi Wealth
    - RM-led private-wealth specialist
    - About ₹93,037 Cr to ₹1,00,000+ Cr AUM; 13,395 client families
    - HNI and UHNI families
    - High-touch RM model with strong profitability
    - Smaller product manufacturing breadth than largest integrated rivals
  - - Motilal Oswal Private Wealth
    - Open-architecture domestic wealth platform
    - ₹1,95,541 Cr AUM; 410+ wealth managers; 8,200+ HNI/UHNI customers
    - HNI, UHNI, family offices, NRIs, corporate treasuries
    - Open architecture, Hurun-family penetration and family-governance services
    - Less public evidence of proprietary digital wedge
  - - Kotak Private
    - Universal-bank private banking incumbent
    - Survey-led visibility into ultra-HNI behavior rather than disclosed AUM in this pack
    - Ultra-HNIs and business owners
    - Banking trust, estate-planning ecosystem and broad product suite
    - Public pack does not show the same operating metrics as listed pure plays
  - - Julius Baer India
    - Foreign boutique private bank
    - Largest foreign wealth manager in India; Euromoney 2026 boutique award
    - HNI and UHNI families with cross-border needs
    - Prestige, offshore booking and long-term family advisory
    - Less mass domestic branch density than local incumbents
  - - DBS Private Bank
    - Asian cross-border private bank
    - AA-/Aa1 ratings and 19-market network
    - Globally connected wealthy families and entrepreneurs
    - Balance-sheet trust, Asia connectivity and legacy planning
    - Not positioned as a domestic pure-play wealth specialist
  - - Status-quo substitute
    - Self-management / informal advisory / partial family office
    - Still large enough that Bernstein cites self-managed and unorganized wealth as the starting point
    - Promoter families and HNIs not yet paying for organized wealth management
    - Lowest explicit fee burden and existing trust
    - Weak reporting, governance and institutional depth once complexity rises
  notes: Rows compare Neo with the main incumbent and substitute categories visible in retained sources as of 2026-08-03; public scale signals are not standardized across firms.
  enumerationScope:
    coverage: partial
    basis: Covers Neo, the seven named competitor families in the prompt, and the status-quo substitute category. It excludes smaller local boutiques and single-product digital brokers that appear only tangentially in the retained evidence.
