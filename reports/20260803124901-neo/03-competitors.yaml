  - CP029
  - CP032
  - CP033
  - CP035
- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - why the threat is credible
  - diligence ask
  rows:
  - - Neo can win on digital premium experience
    - Incumbents already have RM trust and multi-wrapper breadth
    - High
    - Scale incumbents combine advisory depth with large product shelves and formal governance
    - Show digital-to-RM conversion, retention and NPS by segment
  - - Neo can use alternatives as a wedge
    - 360 ONE, Nuvama and Motilal all visibly attach alternatives or AIF capability
    - High
    - Official materials show organized competitors already own alternative wrappers
    - Quantify what share of Neo wins depend on alternatives and whether it is differentiated
  - - Neo can out-execute mid-tier rivals
    - Anand Rathi and Motilal show mid-sized relationship firms still scale well
    - Medium-High
    - They prove the market supports several credible RM-led models
    - Benchmark Neo RM productivity and wallet share against those peers
  - - Neo can defend globally mobile families
    - Julius Baer and DBS own cross-border trust, booking and balance-sheet credibility
    - Medium
    - Those platforms market international continuity and legacy planning better than local wealthtech challengers
    - Map what share of target clients need offshore access or banking connectivity
  - - Incumbent listed players may be distracted by public-market pressure
    - Public-market concerns do not erase recurring-revenue and distribution advantages
    - Medium
    - Citi sees risk in some revenue lines, but the same firms remain favored models in a slowdown
    - Test whether Neo wins when incumbents face market drawdowns or product dislocations
  - - Price transparency can differentiate Neo
    - Most private-wealth fees are negotiated and opaque across the market
    - Medium
    - Public sources do not show clean apples-to-apples fee cards
    - Collect actual competitor pricing from client-side evidence rather than relying on marketing pages
  notes: The register focuses on moat durability rather than near-term sales objections; several highest-severity threats come from incumbent capability stacking, not only from direct price competition.
