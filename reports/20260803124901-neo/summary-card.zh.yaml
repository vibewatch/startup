  topStrengths:
    - India UHNI、HNI 和家族办公室财富池扩张，给 Neo 带来强顺风。
    - 平台受监管且一体化，覆盖顾问、执行、PMS、AIF 和 IFSC 替代投资。
    - MUFG、Euclidean、Peak XV 和 TVS Capital 等蓝筹投资人背书，加上可见的资产规模代理指标。
  topRisks:
    - 尽管估值已达独角兽，集团层面的收入、利润、现金和留存指标仍未披露。
    - SEBI 和 IFSCA 实体带来高监管复杂度，包括 2025 年有记录的 IFSC 警告和投资者警示通知。
    - 360 ONE、Nuvama、Kotak 以及全球私人银行等既有玩家，在披露、分销和品牌信任上仍更强。
  unresolvedGaps:
    - 经审计 FY24-FY26 收入、利润率、现金流和烧钱数据不公开。
    - 2026 年 3 月 TVS Capital 轮次的具体条款、稀释和治理后果未披露。
    - 公开来源对 PMS 层面的客户和 AUM 数据互相冲突，也未披露集中度、流失或续约行为。
