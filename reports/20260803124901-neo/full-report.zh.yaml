            body: >-
              Neo Group 是一家快速增长的多实体印度财富与资产管理平台，旗下至少有六个受 SEBI 和 IFSCA 监管的独立法律实体，覆盖投资顾问、组合管理、股票经纪、Category III AIF、GIFT
              City IFSC 基金管理分支，以及 金融科技 / 支付部门。本章按五个领域给风险严重性排序——监管/法律、运营/质量/安全、伙伴/依赖、人员/执行、财务/模型——并认为三项风险最需要密切监控：2025 年 5
              月 IFSCA 对 Neo Asset Management IFSC 分支发出的执法警示已有记录，但完整法律依据仍未验证；尽管 TVS Capital 在 2026 年 3 月给出独角兽级（₹10,000
              crore 投前）估值，公司完全没有公开集团层面的收入、EBITDA 或现金消耗披露；由资本驱动的资深银行家招聘潮既推动增长，也让 Neo
              暴露在竞争者用同样合伙制薪酬打法挖人的风险中。严重性较低但仍重要的风险包括公共聚合器中第三方 AUM 数据不一致，以及创始人 / 高管继任规划未解决。风险热力图（Figure
              FR001）按定性可能性和严重性摆放这些事项，供投资委员会审阅。
