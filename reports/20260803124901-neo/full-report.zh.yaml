    summary: 公开证据看，Neo 的客户旅程先按客群建立信任，再进入受监管开户；关系加深后，客户会扩展到更多产品。
    data:
      nodes:
        - id: target-segment
          label: 目标客群
          detail: 家族办公室、私人财富客户、机构、企业以及 HNI/UHNI 投资者，通过不同价值主张进入。
        - id: trust-formation
          label: 信任形成
          detail: 潜在客户会看透明度、顾问质量、保密性，以及 Neo 的理念是否贴合自己的长期需求。
        - id: discovery
          label: 需求发现路径
          detail: 入站路径分到财富管理、家族办公室服务或投资 Neo 产品，说明线索捕获按客群拆分。
        - id: regulated-onboarding
          label: 受监管开户
          detail: KYC、产品适配性、投诉披露和具体实体注册，共同决定账户如何开立。
        - id: core-mandate
          label: 核心委托
          detail: 客户关系会按需求落到投顾、经纪、分销，或某个初始另类产品。
        - id: cross-sell
          label: 交叉销售 / 深化关系
          detail: Neo 可以把同一客户关系延展到 PMS、AIF、私人信贷、报表以及跨境结构。
        - id: renew-expand
          label: 续约 / 扩展
          detail: 长期价值取决于顾问连续性、信任，以及产品广度能否转成稳固的钱包份额。
    approximationNotes: 这条旅程根据官方客群页面、联系入口和监管 / 产品页面推断，并非来自 Neo 已发布的销售流程图。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU011
      - CU027
      - CU033
      - CU046
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 用流程图比用数字漏斗更站得住脚，因为公开证据支持采用的连续阶段，但不足以给出可靠的阶段转化率。
    data:
      nodes:
        - id: segment-interest
          label: 客群兴趣
          detail: Neo 公开面向家族办公室、私人财富、机构、企业和 HNI 另类投资者。
        - id: advisory-conversation
          label: 咨询对话
          detail: 潜在客户通过内容、转介绍或直接联系流程接触；这些流程按财富管理、家族办公室或产品需求定制。
        - id: entity-selection
          label: 实体选择
          detail: 客户关系按委托需求，在财富、分销、PMS、AIF 或 GIFT 结构之间选择。
        - id: go-live
          label: 上线
          detail: 披露的资产规模和顾问人数表明，平台已在有意义的规模上运营，而不只是试点。
        - id: wallet-expansion
          label: 钱包份额扩张
          detail: 另类资产、报表和产品分销的广度，让同一客户关系里的钱包份额有增长空间。
        - id: retention-test
          label: 留存检验
          detail: 续约环节公开证据变薄，因为没有分群数据、流失率和集中度披露。
      edges:
        - from: segment-interest
          to: advisory-conversation
          label: 分客群价值主张
        - from: advisory-conversation
          to: entity-selection
          label: 需求与适配性
        - from: entity-selection
          to: go-live
          label: KYC / 开户
        - from: go-live
          to: wallet-expansion
          label: 更广产品接入
        - from: wallet-expansion
          to: retention-test
          label: 续约与顾问连续性
    approximationNotes: 该流程只反映公开证据能支持的阶段逻辑；已审阅来源中，Neo 未披露线索到出资、开户或追加销售的转化率。
    claimRefs:
      - CU004
      - CU008
      - CU009
      - CU027
      - CU028
      - CU033
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: standard
    summary: Neo 的公开客户验证在客群定位和平台广度上最强，具体部署规模证据参差不齐，具名终端客户和留存可见度最弱。
    data:
      columns:
        - 证据具体度
        - 规模可见度
        - 留存可见度
      rows:
        - label: 家族办公室客群页面
          values:
            - 高
            - 中
            - 低
        - label: UHNI/HNI 财富管理文案
          values:
            - 中
            - 中
            - 低
        - label: 独立 PMS 门户
          values:
            - 中
            - 中
            - 低
        - label: 机构 / 企业定位
          values:
            - 中
            - 低
            - 低
        - label: 具名终端客户引用
          values:
            - 低
            - 低
            - 低
    approximationNotes: 矩阵值判断的是已审阅公开材料的证据质量，不是对 Neo 实际客户结果的判断。
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU020
  - id: FU004
    title: 留存 / 复用队列
    type: cohort
    layout: wide
    summary: 没有找到公开的按时间分桶留存队列，因此本图改为评分：公开证据各层中存在多少复用证据。
    data:
      columns:
        - 客群定位
        - 已上线产品证据
        - 留存可见度
      rows:
        - label: 官方客群页面
          values:
            - 100
            - 55
            - 10
        - label: 监管 / 开户页面
          values:
            - 75
            - 80
            - 20
        - label: 独立 PMS 门户
          values:
            - 40
            - 70
            - 20
        - label: 具名终端客户引用
          values:
            - 0
            - 0
            - 0
    approximationNotes: 这是按公开证据存在比例评分的证据深度队列；它不是收入、客户标识或资产留存队列。
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU023
      - CU050
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性和严重性摆放 Neo Group 头部风险项的定性热力图。
    data:
      columns:
        - 低严重性
        - 中等严重性
        - 高严重性
      rows:
        - label: 低可能性
          values:
            - 交易所 / 存管机构会员资格暂停
            - AMFI/BASL 未续期
            - 融资时间线披露含糊
        - label: 中等可能性
          values:
            - 营销内容出处疑虑
            - 创始人 / 高管离任
            - 新任 CEO 整合
        - label: 高可能性
          values:
            - 集团盈利能力未披露
            - IFSCA / GIFT City 执法
            - 资深银行家流失
    approximationNotes: 定性热力图；位置是分析师根据五张风险登记表里的严重性评级作出的评估，不是量化评分模型。
    claimRefs:
      - CR007
      - CR034
      - CR022
      - CR023
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Neo Group 的监管、运营和人才风险如何传导到利润率、融资和估值结果。
    data:
      nodes:
        - id: regulatory
          label: 监管 / IFSCA 执法
          detail: IFSCA 警告和多实体合规面抬高执法和牌照风险。
          tone: warning
        - id: dataQuality
          label: 数据质量 / 运营缺口
          detail: 第三方 AUM 数据不一致，安全姿态未披露，都会降低尽调信心。
          tone: warning
        - id: talent
          label: 人才战 / 大举招聘
          detail: 新资本支撑的合伙人式薪酬，加剧了资深银行家争夺。
          tone: warning
        - id: trust
          label: 投资者 / 客户信任
          detail: 监管和数据质量缺口压低机构和客户信心。
          tone: warning
        - id: margin
          label: 利润率压力
          detail: 全行业合规负担和人才成本通胀挤压财富管理机构利润率。
          tone: negative
        - id: financing
          label: 融资依赖
          detail: 高资本强度让 Neo 继续依赖连续的机构融资轮。
          tone: negative
        - id: growth
          label: AUM 增长耐久性
          detail: 增长取决于能否留住新聘银行家，以及 HNWI 财富周期顺风能否延续。
          tone: warning
        - id: valuation
          label: 估值风险
          detail: 独角兽级估值（2026 年 3 月）没有任何已披露盈利指标支撑。
          tone: negative
      edges:
        - from: regulatory
          to: trust
        - from: dataQuality
          to: trust
        - from: talent
          to: margin
        - from: talent
          to: growth
        - from: trust
          to: growth
        - from: margin
          to: financing
        - from: financing
          to: valuation
        - from: growth
          to: valuation
        - from: regulatory
          to: financing
    approximationNotes: 传导路径由分析师根据本章论据和风险登记表推断；公司未披露可验证该流程的风险模型。
    claimRefs:
      - CR007
      - CR022
      - CR036
      - CR034
      - CR033
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: Neo Group 的关键资本、监管和基础设施依赖。
    data:
      nodes:
        - id: capital
          label: 机构资本提供方
          detail: MUFG Bank、Euclidean Capital、Peak XV Partners、Crystal Investment Advisors 和 TVS Capital。
          tone: warning
        - id: sebi
          label: SEBI 注册
          detail: PMS、投资顾问、Category III AIF、股票经纪和 DP 注册。
          tone: neutral
        - id: ifsca
          label: IFSCA / GIFT City 分支机构
          detail: 基金管理实体注册；受一项有记录的 2025 年 5 月警告约束。
          tone: warning
        - id: exchanges
          label: 交易所与存管机构
          detail: NSE、BSE、MCX 会员资格；CDSL 和 NSDL 存管参与者注册。
          tone: neutral
        - id: rta
          label: KFintech (RTA)
          detail: 担任 Category III AIF 投资者服务的登记与转让代理。
          tone: neutral
        - id: amfi
          label: AMFI / BASL
          detail: 共同基金分销和经纪协会会员资格。
          tone: neutral
        - id: talentPool
          label: 资深银行家人才池
          detail: 近期靠合伙人式薪酬招聘；可能被竞争对手挖走。
          tone: warning
        - id: operatingEntities
          label: Neo Group 运营实体
          detail: 六个以上受监管法律实体，覆盖财富、资产管理、经纪和金融科技。
          tone: neutral
      edges:
        - from: capital
          to: operatingEntities
        - from: sebi
          to: operatingEntities
        - from: ifsca
          to: operatingEntities
        - from: exchanges
          to: operatingEntities
        - from: rta
          to: operatingEntities
        - from: amfi
          to: operatingEntities
        - from: talentPool
          to: operatingEntities
    approximationNotes: 依赖结构来自 Neo Group 自身的监管通知和实体页面；内部共享服务或合同依赖细节未公开披露。
    claimRefs:
      - CR019
      - CR003
      - CR020
      - CR021
      - CR005
      - CR023
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 已披露增长、可比公司倍数和未解决缺口，如何共同形成本章「跟踪 / 进一步研究」建议。
    data:
      nodes:
        - id: n1
          label: 已披露 AUM/ARR AUM 增长 + 一线投资者财团
          detail: 2024 年以来两轮融资，估值上升；投资者财团包括 MUFG、Peak XV、Euclidean、TVS Capital
        - id: n2
          label: FY23 以来收入和利润率未披露
          detail: 证据包未发现 FY24-FY26 P&L
        - id: n3
          label: 上市同业以高倍数交易，但倍数已披露
          detail: 360 ONE 约 42x P/E，Nuvama 约 26x P/E，基于经审计 FY26 结果
        - id: n4
          label: 监管和数据质量警示
          detail: 2025 年 5 月 IFSCA 警告；第三方 PMS AUM 报告不一致
        - id: n5
          label: 作者估算的 EV/revenue 和 EV/ARR-AUM 高于同业区间
          detail: 估算约 35x-70x EV/revenue，而上市同业约 9x-16x
        - id: n6
          label: 建议：跟踪 / 进一步研究；入场以披露为条件
          detail: 信心中等，风险评级中高，估值立场偏高
      edges:
        - from: n1
          to: n3
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 流程把多因素判断压缩成六个节点；完整推理见建议摘要和投资论点表。
    claimRefs:
      - CV001
      - CV005
      - CV050
      - CV023
      - CV027
      - CV040
      - CV047
      - CV052
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Neo Group 的作者估算倍数与上市可比公司的已披露倍数对比。
    data:
      items:
        - label: Neo Group（估算，低端收入 Rs 150cr）
          value: 70
          detail: 以 Rs 10,500cr 投后估值除以作者估算的 FY26 收入区间低端，得到隐含 EV/Revenue
          tone: risk
        - label: Neo Group（估算，高端收入 Rs 300cr）
          value: 35
          detail: 以 Rs 10,500cr 投后估值除以作者估算的 FY26 收入区间高端，得到隐含 EV/Revenue
          tone: risk
        - label: 360 ONE WAM（滚动 P/E）
          value: 42
          detail: Financial Express：约 42x 滚动盈利，对比 5 年中位数 32.7x
          tone: neutral
        - label: 360 ONE WAM（隐含 EV/Revenue）
          value: 16.4
          detail: 作者计算：PAT x P/E，再除以 FY26 收入
          tone: neutral
        - label: Nuvama Wealth Management（滚动 P/E）
          value: 26
          detail: Financial Express：约 26x 滚动盈利
          tone: neutral
        - label: Nuvama Wealth Management（隐含 EV/Revenue）
          value: 8.7
          detail: 作者计算：经营 PAT x P/E，再除以 FY26 收入
          tone: neutral
    approximationNotes: Neo Group 条形图基于作者估算的收入区间，而非已披露财务；同业 EV/Revenue 由作者用已披露 PAT、P/E 和收入推导，并非公司报告的倍数。
    claimRefs:
      - CV052
      - CV023
      - CV027
      - CV022
      - CV026
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: Neo Group 乐观 / 基准 / 悲观下一轮估值区间，以及作者估算的 FY26 收入带。
    data:
      items:
        - label: 悲观情景：下一轮估值
          low: 6000
          high: 9000
          mid: 7500
          detail: 增长放缓、监管升级，或相对 2026 年 3 月 Rs 10,000cr 融资前估值标记出现收入下行意外
          tone: negative
        - label: 基准情景：下一轮估值
          low: 10000
          high: 13000
          mid: 11500
          detail: AUM/ARR AUM 增长延续 2024-2026 年相近节奏
          tone: neutral
        - label: 乐观情景：下一轮估值
          low: 15000
          high: 22000
          mid: 18000
          detail: 行业估值重估，靠近 Bernstein 的十年 AUM 增长情景，同时 Neo 披露可与同业比较的盈利能力
          tone: positive
        - label: 作者估算 FY26 收入
          low: 150
          high: 300
          mid: 220
          detail: 以已披露 FY23 收入（Rs 65cr）为基数，按 2024-2026 年已披露客户资产 / 投顾资产增长外推；没有中期披露，因此区间很宽
          tone: opportunity
    approximationNotes: 所有区间（Rs crore）都是作者判断，锚定已披露融资历史和估算收入带，不是公司指引或正式 DCF。
    claimRefs:
      - CV055
      - CV032
      - CV051
      - CV001
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 支撑估值观点的核心已披露和估算数字。
    data:
      items:
        - label: 2026 年融资前估值
          value: Rs 10,000 cr
          detail: TVS Capital 轮，2026 年 3 月
          tone: neutral
        - label: 2026 年融资轮规模
          value: Rs 500 cr
          detail: 由 TVS Capital 领投
          tone: neutral
        - label: 已披露 ARR AUM
          value: Rs 50,000 cr
          detail: 随 2026 年 3 月融资轮披露
          tone: positive
        - label: 已披露客户资产总额
          value: Rs 1,00,000 cr
          detail: 随 2026 年 3 月融资轮披露
          tone: positive
        - label: 2024 年投顾资产
          value: Rs 35,000 cr
          detail: 在 2024 年 8 月 MUFG 领投轮披露
          tone: neutral
        - label: 资深财富顾问
          value: ~150
          detail: 按 2026 年 3 月披露
          tone: neutral
        - label: FY23 已披露收入
          value: Rs 65 cr
          detail: 最后披露的集团收入数字（Entrackr）
          tone: risk
        - label: 作者估算 FY26 收入区间
          value: Rs 150-300 cr
          detail: 仅为估算；公司未披露
          tone: risk
    approximationNotes: KPI 值结合了已披露数字和一个明确标注的作者估算（FY26 收入区间）。
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV003
      - CV013
      - CV051
