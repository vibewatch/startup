  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入轨道与受监管载体组合
        blocks:
          - type: paragraph
            body: >-
              Neo 的公开界面让一件事很清楚：这不是单一收费的咨询业务。Neo Wealth Management 列出经纪、托管参与人、投资顾问和研究能力。Neo Wealth Partners
              增加了另一个咨询和分销实体，并明确提到共同基金、PMS 和 AIF 产品。Neo Asset Management 再叠加 PMS、Category II 和 Category III AIF，以及一个 IFSC
              基金管理实体。换句话说，平台似乎可以从重叠的富裕客户关系中，把执行、咨询、分销、管理账户和另类资产制造都变现。


              问题在于，公开披露对实际变现的说明远薄于对载体的说明。HNI Portfolio 给出一个可用的 PMS 费用锚点——1% 固定费加浮动利润分成，最低投资门槛 ₹50 lakh——但 Neo
              自己的官方界面没有发布等价的管理费、咨询费或业绩报酬 费率表。这意味着财务分析师可以画出活动应如何转化为费用池，却还看不到哪条轨道主导毛利，或另类资产业务相对财富业务是否已经增厚利润率。
