  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与监管载体
        blocks:
          - type: paragraph
            body: >-
              Neo 面对的正确市场不是「印度储蓄」，甚至也不是整个零售投资市场。实际边界是面向 HNI、UHNI
              和家族办公室客户的有组织私人财富：收费咨询、组合构建、产品分销、另类资产入口、遗产和传承安排，以及其他高触达服务，并通过投资顾问、组合管理人、另类投资基金等注册架构承载。360
              ONE、Nuvama、Motilal Oswal、Julius Baer 和 DBS
              的公开公司页面也显示，商业任务远不止证券选择。买方常常还期待资金管理支持、慈善、借贷、跨境入口或家族治理帮助。这种宽度很重要，因为它解释了为什么 Neo
              可以同时像财富科技公司、私人银行替代品和家族办公室赋能者。它也说明市场规模测算应排除什么：自主存款、大众零售经纪，以及尚未为有组织咨询付费的其他储蓄池。
