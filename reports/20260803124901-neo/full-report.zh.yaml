      - number: '1.2'
        title: 领导层厚度、治理信号与监管足迹
        blocks:
          - type: paragraph
            body: >-
              领导层是 Neo 最强的正面信号之一。公开履历显示，创始团队和高管梯队来自 Edelweiss、Macquarie、ICICI、Goldman Sachs、Kotak Institutional
              Equities、Motilal Oswal、Nuvama、360 ONE、Barclays 和 Deutsche。Nitin Jain 统筹整个平台，Varun Bajpai
              带来资深机构和资本市场经验，Hemant Daga 与 Puneet Jain 负责另类资产，Riyaz Ladiwala 补上运营和报告基础设施，Shajikumar Devakar 从 360 ONE
              加入后拓宽财富管理业务。高端财富平台正需要这种履历密度，向客户和投资人同时释放信号。


              治理披露则更参差。Neo 确实在各实体发布了有意义的牌照和注册信息：Neo Wealth Management 列出股票经纪、托管参与人、投资顾问和研究分析师权限；Neo Wealth Partners
              列出自身投资顾问和分销资质；Neo Asset Management 列出 PMS、AIF 和 IFSC
              注册。这种广度确认集团确实是多载体结构。但公开记录仍没有完整董事会名单、委员会架构，也没有一张清晰的实体所有权图把所有牌照回接到控股公司。结果是，公司在商业许可上透明，在正式治理披露上仍偏稀薄。
