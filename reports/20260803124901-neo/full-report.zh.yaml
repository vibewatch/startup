      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的增长模式依赖一组相对集中的外部关系。自 2024 年 8 月以来，公司的机构资本来自 Peak XV Partners、MUFG Bank、Euclidean Capital、Crystal
              Investment Advisors、TVS Capital 等少数重复和新增投资方，覆盖至少五次融资，而不是一个宽口径财团；任何单一投资方撤出，或未来一轮融资失败，都可能压缩增长资本。GIFT City
              离岸基金管理业务完全依赖 IFSCA 牌照，而这张牌照已经出现一次有记录的警示。Category III AIF 的基金行政外包给 KFin Technologies
              这一单一具名登记与过户代理，公募基金分销也依赖 AMFI 和 BASL 注册持续有效。最尖锐的是，Citywire Asia 报道称，Neo
              面向资深私人银行家的快速招聘靠新资本和合伙制薪酬模式支撑——同一套机制让 Neo 能从既有私人银行挖人，也同样可能让竞争对手把人从 Neo 挖回去，尤其在未来融资延迟或竞争对手给出更高合伙权益时。表 TR003
              和依赖图（图 FR003）概括这些通道。
