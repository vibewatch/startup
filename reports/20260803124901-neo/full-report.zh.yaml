            body: >-
              Neo 的公开客户地图比零售财富应用或单一产品券商更宽。官方客群页面明确点名家族办公室、私人财富客户、机构、企业，以及成熟 UHNI/HNI 客户。家族办公室表述很重要，因为 Neo
              没有把这个群体描述成普通富裕家庭；它把他们描述为准机构客户，需要专门基础设施、定制投资框架、灵活性和全天候服务。落到买方—用户—付款方，指向的是本人、家族办公室
              CIO/CFO、企业主办公室或资金负责人担任买方和付款方，本人及其运营团队成为报告、咨询和执行支持的日常用户。公开实体栈也显示这种分层为什么有商业意义：Neo
              可以围绕同一关系提供财富咨询、经纪、托管服务、产品分销、PMS、AIF、私人信贷和 GIFT City 架构。原始联系页面进一步证明这是有意设计的获客路径，页面列出 12 个线下地点分类，并为 Wealth
              Management、Family Office Services 和 Invest in Neo Products 设置独立咨询路径。
