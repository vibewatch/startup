        - 已有具名产品页上线
        - 显示更广的另类资产栈里具备非公开市场信贷能力
        - 需要承销流程和损失历史证据
      - - NIIOF / 基建收益策略
        - 寻求基建收益敞口的客户
        - 已有具名产品页上线
        - 显示另类菜单不止是通用股票 / 基金壳
        - 需要资产组合、期限和流动性画像
      - - Cat III AIF
        - 成熟策略配置者
        - 已上线；两个具名基金公开
        - 在独立信托结构下加入类对冲或 treasury-plus 策略
        - 需要投资授权细节和已实现业绩记录
      - - GIFT City IFSC 分支机构
        - 跨境或符合 IFSC 资格的配置者
        - 已上线；注册信息已展示
        - 把另类平台延伸到印度本土 SEBI 边界之外
        - 需要 2025 年警告的完整背景和整改证据
      - - NeoFinity 金融科技板块
        - 移动优先的零售或大众富裕用户
        - 营销网站已公开上线
        - 把品牌扩展到传统私人财富渠道之外
        - 与 Neo 核心财富流程的直接连接没有公开文件说明
