      - number: '7.7'
        title: 缓释、监控与叫停标准
        blocks:
          - type: paragraph
            body: >-
              投资者应跟踪少量可监测触发点，而不是只依赖 Neo Group 披露的缓释措施；本章提到的大多数缓释（合规职能、合伙制薪酬、多元化交易所会员资格）都是公司声称，未获独立验证。最清晰的破题触发点包括：2025 年
              5 月 GIFT City 警示后 18 个月内出现第二次 IFSCA 或 SEBI 执法行动；在 2026 年 3 月 TVS Capital 交割后 12 个月内未能完成预期机构融资，考虑到 Neo
              已显示出对频繁注资的依赖；2024-2026 年资深银行家招聘 cohort 出现重大流失；下一次融资或退出事件时仍缺少经审计的集团层面财务；创始高管 Nitin Jain、Varun Bajpai、Hemant
              Daga 或 Puneet Jain 任何一人计划外离任且未披露继任者。Neo Group 更广泛的风险传导路径，是监管和人才竞争压力穿过投资者 / 客户信任与利润率，进一步传到融资依赖，最终影响估值支撑（图
              FR002）；资本强度和融资依赖位于链条中心，因此持续获得机构资本是当前增长和估值论证中最承重的假设。表 TR006 给出持续监控的具体触发点和阈值。
