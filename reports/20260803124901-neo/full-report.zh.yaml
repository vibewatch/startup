        - 私人银行招聘竞争加剧时，高级财富顾问流向 Kotak、Motilal Oswal、360 ONE、Julius Baer 或 DBS。
        - 公开报道高级员工离职，或 Citywire 式集中招聘报道点名 Neo Group。
      - - AUM / ARR AUM 增长停滞
        - 客户资产或 ARR AUM 增速显著低于 Bernstein 预计的行业约 18% CAGR 轨迹。
