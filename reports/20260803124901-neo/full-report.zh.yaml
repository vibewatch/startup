      - number: '4.3'
        title: 资本充足性与同业基准
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Neo 财务画像中最清楚的部分。2024 年 MUFG-Euclidean 轮把公司的股本基础提高到约 ₹1,000 crore，2026 年 3 月 TVS Capital 轮又以 ₹10,000
              crore 投前估值新增 ₹500 crore。这给 Neo
              带来真实股权支撑，也降低了立即紧急融资的概率。但它不能替代完整的资本充足性视图。审阅过的公开来源没有披露控股公司现金、债务授信、监管资本缓冲或现金续航计划。Moneycontrol 关于 Neo 正在申请
              NBFC 牌照的说明在财务上也重要，因为证券支持型借贷会把风险画像从费用驱动中介推向资产负债表敞口。


              公开同业展示了更好披露应有的样子。360 ONE、Nuvama 和 Anand Rathi 都发布收入、利润、AUM 和回报指标，让投资者测试客户资产或 ARR AUM 转化为收益的能力。Neo
              没有发布这些已审计产出。因此，同业集合帮助框定缺口：如果 Neo 想讲一个公开市场式估值故事，它最终需要公开市场式的单位经济、费率收益和利润率证据。
