      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 旗下受监管实体目前持有四类 SEBI 牌照和一张 IFSCA 牌照：Neo Wealth Partners（Investment Adviser INA000017958、BASL
              会员、AMFI ARN118471）、Neo Alternative Asset Managers（Portfolio Manager INP000007641，自 2022 年 11 月起为永久牌照）、Neo
              Alternatives Investment Trust（Category III AIF IN/AIF3/21-22/1001，自 2022 年 2 月起为永久牌照）、Neo Wealth
              Management（股票经纪 INZ000306537，拥有 NSE / BSE / MCX 会员资格及 CDSL / NSDL 存管参与人注册），以及 GIFT City IFSC 分支（IFSCA Fund
              Management Entity FSCA/FME/II/2023-24/084）。底层 SEBI 规则（Portfolio Managers 2020、Investment Advisers
              2013、Alternative Investment Funds 2012）过去一年均被修订，Neo 的合规义务仍在移动。最关键的是，IFSCA 自有文件门户显示，2025-05-07 有一则题为「IFSCA
              issues warning to Neo Asset Management Private Limited (IFSC Branch)」的新闻稿；TaxGuru
              一篇法律评论标题暗示问题与分支机构的「personnel presence」有关，但未能取得 IFSCA 完整命令或独立法律分析，无法确认具体违规点和整改状态——这是重大证据缺口。另一个独立风险是，Neo
              Group 2025 年 9 月公开披露，有欺诈性 WhatsApp / Telegram 群组冒用其品牌从事未经授权的交易计划，并引导受影响投资者使用公司申诉渠道、SEBI 的 SCORES 门户、Online
              Dispute Resolution 机制，以及全国网络犯罪门户 / 1930 热线。六个以上持牌实体并行运营，会放大任何单一合规失误升级为重大事项的表面积。表 TR001 按严重性排序。
