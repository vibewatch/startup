      - number: '2.3'
        title: 买方、用户、付款方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              印度有组织私人财富市场，与其说按简单收入档分层，不如说按决策场景分层。在最高端，企业主型 UHNI 本人和家族领导者通常是经济买方，类似 CFO 的家族成员、CIO、财务团队或可信顾问则成为日常用户。在 HNI
              和新兴富裕层级，买方可能仍是本人，但用户更常是关系经理、应用用户和跨产品协同的顾问。Nuvama、Motilal、Julius Baer 和 DBS 都显示，付款方也可能是家族办公室、企业资金部、NRI
              本人或国际记账结构，而不是个人零售账户。财富创造、流动性事件或跨境复杂度压过自我管理能力时，采纳通常开始。市场也在代际切换：EY、Nexdigm 和 Capgemini
              都指向一个正在崛起的富裕群体，他们期待数字化入口和个性化；Hubbis 则认为，顾问先倾听再分销，关系才会持久。
