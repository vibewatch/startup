      - number: '8.7'
        title: 展品
        blocks:
          - type: callout
            title: 两轮融资背后的一线投资方财团
            body: >-
              MUFG Bank、Peak XV Partners、Euclidean Capital 以及最新加入的 TVS Capital 都已支持 Neo
              Group，这为其增长叙事提供了尽调可信度，尽管公司自身财务披露仍很薄。
            calloutType: strength
            claimRefs:
              - CV005
              - CV008
          - type: callout
            title: FY23 之后收入和利润率未披露
            body: 本章关于 Neo Group 的每一个估值倍数都依赖作者估算的收入区间，因为证据包中未找到 FY24-FY26 收入、利润率或盈利数字。
            calloutType: risk
            claimRefs:
              - CV050
              - CV013
          - type: callout
            title: IFSCA 警示未解决
            body: IFSCA 2025 年 5 月对 Neo Asset Management IFSC 分支的警示，在证据包中没有公开确认整改；若升级，将直接触发破题。
            calloutType: risk
            claimRefs:
              - CV040
              - CV041
          - type: callout
            title: 估值倍数是作者估算，不是披露事实
            body: Neo Group 未披露收入，因此本章 EV / revenue 与 EV / ARR-AUM 比较依赖一个明确标注、范围很宽的作者估算收入区间，而不是虚构出的精确倍数。
            calloutType: assumption
            claimRefs:
              - CV051
              - CV052
              - CV053
          - type: callout
            title: 行业顺风真实存在，但分析师对定价保持克制
            body: Bernstein 对印度专业财富管理机构给出的约 18% 十年 AUM CAGR 预测，支撑结构性牛市情景；但 Citi 也另行建议投资者等待更好入场点，哪怕是其自己最看好的上市标的。
            calloutType: insight
            claimRefs:
              - CV032
              - CV033
