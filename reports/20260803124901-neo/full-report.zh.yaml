      - number: '1.3'
        title: 融资历史、规模演进与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Neo 的融资轨迹现在已经相当清楚。The Economic Times、Moneycontrol 和 BusinessLine 的 2024 年 8 月报道称，公司从 MUFG Bank 和 Euclidean
              Capital 融资 ₹400 crore，Peak XV 也参与，股本基础增至约 ₹1,000 crore。同一批报道把 Neo 描述为高速增长的私人平台，拥有近 ₹35,000 crore 财富资产、超过
              ₹6,000 crore 另类资产和约 1,200 名客户。到 2026 年 3 月，下一步融资更大、也更关键：留存的 ET、VCCircle、FinTech BizNews 和 Entrepreneur
              India 报道均称，TVS Capital 以 ₹10,000 crore 投前估值投资 ₹500 crore。这种一致性很重要，因为它直接反驳了用户简报中的 INR 440
              crore；已审阅来源没有一个支持那个较低数字。


              更新的 2026 年规模标记也显示，Neo 不再只用咨询 AUA 描述自己。ET 和 FinTech BizNews 转向更宽的平台指标，例如约 ₹1 lakh crore 客户资产和约 ₹50,000
              crore ARR AUM；Shajikumar 任命报道则另称财富资产超过 ₹40,000 crore、另类资产 ₹11,500
              crore。组合起来看，平台扩张速度已经超过旧的单一财富指标所能捕捉的范围，尽管公开披露仍没有逐项对账。投资人、客户和监管者都会影响这次转换，因此后续尽调需要像关注轮次规模一样，关注权利、集中度和跨实体经济性。
