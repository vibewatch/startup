      - - 私人财富客户导入
        - 潜在客户选择服务路径，并开始由关系驱动的发现流程
        - 联系表单会导入财富管理、家族办公室服务或 Neo 产品
        - 产品推介前已经做分层
        - 完整旅程没有公开 KYC / 开户流程图
      - - 共同基金 / PMS / AIF 分销
        - 顾问主导在多个载体之间配置
        - Neo Wealth Partners 以 IA 注册身份分销共同基金、PMS 和 AIF
        - 把顾问与分销放在同一个对外实体下
        - 收费架构和产品偏置控制没有公开
      - - 股票 / IPO / 债券执行
        - 通过券商 / DP 通道交易或认购
        - Neo Wealth 前端把股票、IPO 和债券与受监管券商业务一起营销
        - 把执行放进与顾问同一品牌生态
        - 需要证明跨实体数据交接和交易后报告
      - - PMS 委托导入
        - 客户评估管理人、签署披露，并向管理账户出资
        - PMS 页面展示披露文件、直接开户、投诉数据和冲突政策
        - 说明运营准备不止营销文案
        - 证据包中没有公开 API 或仪表盘截图
      - - 私募信贷配置
        - 通过管理人主导的资产获取和承销来配置另类资产
        - Neo Asset 公开页面提供专门的私募信贷入口
        - 显示能力不局限于公开市场载体
        - 没有公开的组合构建或减值历史数据
      - - 基建收益 / NIIOF 配置
        - 配置期限更长敞口的另类收益
        - 专门的 NIIOF 页面意味着一个具名基建收益策略
        - 为成熟配置者增加产品深度
        - 证据包中没有公开基金简报
      - - 客户服务 / 投诉升级
        - 先向实体解决问题，未解决再升级
        - 具名投诉邮箱、合规官和 SCORES 路径
        - 公开记录中有清晰升级路径
        - 核心财富实体未发布 TAT 和结案统计
    notes: 工作流行来自公开菜单、监管通知和联系入口推断，而非已披露的端到端流程手册。
