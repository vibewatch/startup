            body: >-
              护城河问题在于，Neo 能否在存量玩家进一步加固位置前，积累足够信任和工作流引力。公开证据显示，最强的存量护城河是经常性收入、RM
              密度、另类资产入口、跨境连接，以及借贷、遗产规划和治理支持等邻近服务的附着能力。360 ONE 的经常性资产模式和收购历史树立了规模标杆。Nuvama 横跨客户类型的宽度，让它成为强大的分销机器。Anand
              Rathi 和 Motilal 表明，经营良好的关系型公司即便不匹配最大玩家，也能达到可观规模。Julius Baer 和 DBS 让高端跨境端继续保持竞争。公开市场视角也显示风险：Citi
              提醒过交易性收入敞口的担忧，公开来源仍没有提供可干净横向比较的私人财富费率表或赢单 / 输单数据。这使 Neo 的护城河耐久性仍未解决。没有留存率、客户迁移和钱包份额的专有证据，最公允的结论是，Neo
