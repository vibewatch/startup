              和私人信贷等管理型产品迁移的大趋势，富裕资金正在离开纯传统储蓄工具。它也同时制造了对多个监管者和市场基础设施的运营依赖：SEBI 管 PMS、顾问和 AIF 规则；交易所和托管机构支撑执行层；SCORES
              处理投诉升级；IFSCA 负责 IFSC 活动。因此，公开产品图谱很宽，但外部可观察的业绩和规模很弱。第三方 PMS 目录对 Neo 的
