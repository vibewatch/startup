      - number: '8.5'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >-
              可比公司组由三家印度上市纯财富管理机构和四家私人银行既有玩家组成。360 ONE WAM 披露 FY26 总 AUM 为 Rs 6,74,492 crore、ARR AUM 为 Rs 3,11,940
              crore、收入 Rs 3,144 crore、PAT Rs 1,225 crore，按约 42x 滚动收益交易，高于五年中位数 32.7x。Nuvama Wealth Management 由 PAG
              控股，披露 FY26 客户资产超过 Rs 4.5 trillion，覆盖 4,750 多个 UHNI 家庭，收入 Rs 3,122 crore、经营 PAT Rs 1,049 crore、ROE 28.1%，按约
              26x 滚动收益交易。Anand Rathi Wealth 披露 FY26 收入 Rs 1,198 crore、PAT Rs 386 crore、AUM 超过 Rs 1,00,000 crore、ROE
              46.7%；但 Bernstein 仅给 Market-Perform 评级，并提示市场挂钩债券贡献其一半以上收入，是风险和估值顾虑。Motilal Oswal Private Wealth、Kotak
              Private Banking、Julius Baer India 和 DBS Private Bank
              则作为披露较少的既有竞争参照，而不是完全同口径的公开可比公司，因为它们均未单独披露财富部门财务。这个混合可比组跨越很不同的披露制度和资产负债表结构，限制了与 Neo Group
              严格比较倍数的意义；本文把它视为局部、示意性样本，而非印度财富管理机构的完整名录。
            claimRefs:
