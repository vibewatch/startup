      - number: '2.2'
        title: 多重视角下的规模与集中度
        blocks:
          - type: paragraph
            body: >-
              印度私人财富机会很大，但前提是先说清镜头。Knight Frank 给的是人群镜头：2024 年 85,698 名 HNWI，2026 年 19,877 名 UHNWI，两个群体仍在增长。Bernstein
              给的是流动财富镜头：约 300 万超富裕家庭持有 $2.7 trillion 流动金融财富，其中不少仍由自己管理，或由非正规渠道服务。EY 给的是更宽的资产池镜头：HNI/UHNI 资产池超过 $1
              trillion，管理型投资从 FY2022 的 $1.7 trillion 增至 FY2027 的 $3.9 trillion，家庭金融资产到 2028 年达到 $6 trillion。这些不是可互换的
              TAM。它们是层层嵌套的边界，从 Neo 可以直接追逐的窄人群，延伸到支撑行业的更宽金融化背景。集中度也重要：仅 Mumbai 就占印度超高净值人群的 35.4%，前 1% 家庭控制约 60%
              总财富，所以进入市场的密度与全国总量同样关键。
