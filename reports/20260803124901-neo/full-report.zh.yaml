      - number: '8.6'
        title: 破题触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              六类进展会打破本章已经偏谨慎的论点：针对 Neo Asset Management IFSC 分支的 IFSCA 警示正式升级；未来融资或申报门槛前仍不披露 FY24-FY26 收入和利润数据；下一轮估值低于
              2026 年 3 月设定的 Rs 10,000 crore 投前标记；在 Citywire 已经描述为竞争威胁的招聘市场升温中，资深顾问流向既有私人银行；AUM 或 ARR AUM 增速较行业约 18% 预测
              CAGR 明显放缓；第三方 PMS AUM 跟踪器对 Neo Asset Management 的数字继续无法调和。要关闭本章最重大的证据缺口，需要取得经审计或管理层编制的 FY24-FY26 财务、TVS
              Capital 轮条款清单或股东协议、IFSCA 整改状态的直接确认、冲突 PMS AUM 数字的对账、顾问人数和流失趋势数据、客户集中度指标、另类资产 AUM 如何计入 headline Rs 1 lakh
              crore 客户资产的说明，以及任何具体退出路径先例。在这些问题关闭前，本章认为 Neo Group 估值方向上受到增长和投资方质量支撑，但尚不能独立验证 2026 年 3 月轮所隐含的倍数。
