      - number: '7.6'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的财务模型资本消耗高，且财务披露不透明。公开报道记录了 2024 年 8 月至 2026 年 3 月之间至少五次融资：MUFG Bank / Euclidean Capital 领投的约
              ₹400 crore（$47.6-48 million）轮（2024 年 8 月；Moneycontrol 2024 年 12 月另有一篇看似相关融资报道，但与 8 月报道无法干净对账）、2025 年 2
              月一轮约 $20 million、估值约 $640 million 的融资，2025 年 8 月和 11 月的后续融资（其中一轮由 Crystal Investment Advisors 领投），以及 2026
              年 3 月 TVS Capital 以 ₹10,000 crore（约 $1.08 billion）投前估值投资 ₹500 crore（$53 million）、把 Neo
              推成独角兽的融资，且有九家以上独立媒体交叉印证。披露的 AUM / 客户资产数字也大幅跳升——从约 ₹51,500 crore（财富管理加另类投资，约 2025 年 5 月报道）到约 ₹1 lakh crore
              客户资产（2026 年 3 月报道）——增长逻辑上说得通，但并未对账到一个合并、经审计的单一数字。Neo Alternative Asset Managers 还运营私募信贷和困境债策略（Neo Dynamic
              Strategy Fund、Neo Treasury Plus Fund），天然承受信用质量和 NAV 损失暴露，公开披露没有拆出。已审阅来源均未披露 Neo Group 合并收入、EBITDA 或现金消耗；EY
              财富科技研究记录了刚性成本结构、合规负担和人才竞争带来的全行业利润率挤压，这直接适用于 Neo 这种多牌照、高招聘强度的模式。表 TR005 展开这些风险。
