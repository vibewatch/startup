      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的运营风险主要卡在数据质量不一致和技术控制披露不足，而不是任何已确认事件。公开 PMS 聚合平台对同一实体给出截然冲突的数字：IPOPlatform 显示 Neo Asset
              Management Private Limited 的 AUM 为 ₹0 crore、客户数为 0，而 Business Today 显示其一个方案下有 ₹5,275.22
              crore。这个差异说明第三方公开财富管理数据普遍不可靠，也意味着不能把任何聚合平台给出的 Neo AUM 数字当作权威口径。另一个问题是，第三方营销页面 HNIPortfolio 把「QGLP」投资理念标签归给
              Neo Asset PMS，但没有独立来源验证其来历，留下一个较小但未解决的内容准确性问题。NeoFinity 是 Neo Group
              的支付和金融科技部门，官网未披露任何独立安全认证、审计结果或事件记录，技术风险画像仍不透明。PMS、IA、券商、AIF、GIFT City
              分支、金融科技等六个以上独立持牌实体需要协同合规和运营，本身就是运营复杂度风险；已审阅的公开披露未回应这一点。表 TR002 细列这些失效模式。
