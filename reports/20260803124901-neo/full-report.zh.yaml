      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 由 Nitin Jain（董事长兼董事总经理）于 2021 年 10 月创立；他此前搭建过一个管理逾 USD 40 billion 客户资产的平台。共同创始人包括 Varun
              Bajpai（25 年以上经验，曾任 Macquarie Country Head）、Hemant Daga（前 Edelweiss Asset Management CEO，搭建过 USD 4 billion
              另类投资平台）和 Puneet Jain（CIO，前 Goldman Sachs，在 25 笔以上困境债交易中部署逾 USD 1
              billion）。这组机构履历是优势，但四位高管均未披露公开接班计划，同时离职风险也没有被回应。Shajikumar Devakar 在 360 ONE Wealth 及其他私人银行任职 22 年后，于约
              2025 年 5 月出任 Neo Wealth Management 共同创始人兼 CEO；截至 2026
              年中报告日期，他任期不足两年，带有近期高管任命常见的整合风险。最尖锐的风险仍来自同一轮资本驱动的招聘潮：Neo 借合伙制薪酬吸引资深关系经理，但这也制造流失风险。EY
              的财富科技研究显示，全行业下一代客户流失率约为上一代的四倍；公开资料中没有 Neo 专属数据证明新招银行家及其客户账本能被长期留住。表 TR004 按严重性排列这些执行风险。
