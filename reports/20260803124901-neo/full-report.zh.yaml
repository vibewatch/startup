      - number: '4.4'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论比披露包更好，而不是相反。Neo 几乎肯定有多条变现轨道、可信资本支持者，以及足够重要的印度私人财富客户规模。但公司仍要求外部投资人凭信任补上太多空白：没有已审计收入、没有
              EBITDA、没有现金、没有现金续航、没有产品级 AUM 对账、没有已实现费率收益历史，也没有公开解释 IFSC 警示如何解决。这些不是装饰性遗漏，而是判断 ₹10,000 crore
              投前估值反映的是持久经济性，还是仅仅反映成长赛道里强市场定位所需的核心指标。


              这导向一个谨慎但非负面的结论。Neo 在战略位置、商业宽度和印度财富顺风的结构契合上都不错。但从财务承销角度看，它仍受披露约束。下一包尽调必须回答：ARR AUM
              中有多少转化为实际经常性收入，另类资产业务贡献多少利润率，PMS 和 AIF 数据能否干净对账，以及下一阶段扩张背后有多少流动性。
