        title: 替代品与现状
        blocks:
          - type: paragraph
            body: >-
              只列公司名的竞争地图会漏掉现状本身。Bernstein 明确表示，印度富裕家庭财富中有很大一部分仍由自己管理，或由非正规渠道处理。Hubbis
              补充说，许多家族办公室仍在演进，运作方式往往更像成熟私人银行关系，而不是完全机构化的投资平台。这对 Neo 很重要，因为大量竞争会发生在客户进入与 360 ONE 或 Nuvama
              的正式比稿之前。替代品可能是家族自己的财务办公室、可信本地顾问、企业主的银行关系，或用上市股票敞口、共同基金和精选另类资产拼出的部分 自助方案。Kotak
              的公开调查显示，企业主型、进攻型投资者主导超高净值客群，这进一步说明现状有多粘。Neo 因此不只要替代对手，还要替代习惯：自我管理、碎片化外部专家，以及客户已经信任的旧关系。
