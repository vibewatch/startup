companyProfile:
  summary: >-
    Neo Group 是一家总部位于 Mumbai 的私人财富与另类资产平台，把咨询、经纪、托管、PMS、Cat II 和 Cat III AIF，以及 GIFT City
    基金管理载体放在同一品牌家族下。公司把自己定位为面向家族办公室、UHNI、HNI、机构和企业的高端、知识驱动、技术赋能伙伴；公开证据显示，它从 2021 年启动后快速扩张，并在 2026 年 3 月完成标志独角兽估值的 PE 轮。
