chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、主张与平台范围
        blocks:
          - type: paragraph
            body: >-
              Neo 的官方页面对公司想成为什么样子说得异常清楚，尽管已审计经营指标仍很少。首页先把 Neo 定位为印度领先的财富与资产管理平台，随后立即把集团拆分为财富管理、资产管理、Neo Wealth Partners
              和 NeoFinity。目标客群同样直白：家族办公室、私人财富客户、机构和企业。这种宽度很重要，因为 Neo 并不是把自己包装成单一 RM
              精品机构；它把自己塑造成一个多实体平台，覆盖执行、分销、产品制造，并最终延伸到支付邻近业务。


              客户主张也有鲜明气质。Neo 的 Why Neo 和 Who We Serve 页面反复强调机构级定制方案、透明度，以及大型印度家族办公室越来越像机构运作。财富管理页面把话说得更具体：面向成熟 HNI 和
              UHNI 客户的知识驱动、技术赋能咨询模式。再叠加公开和私人市场、全球投资、另类资产和自有技术层的明确表述，公开记录支撑的公司身份是高触达咨询加产品入口，而不是大众市场 金融科技分销。
