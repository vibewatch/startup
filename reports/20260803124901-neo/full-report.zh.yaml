      - number: '2.4'
        title: 增长驱动与采纳约束
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑的增长逻辑很扎实。商业利润、IPO、权益市场参与、数字化开户轨道，以及储蓄逐步迁入管理型投资，都继续创造财富。Capgemini 还通过全球 $83.5 trillion
              财富大转移给出更长周期的结构性顺风；Kotak 和 Hubbis
              则显示，印度家族越来越重视传承、治理和下一代参与。但采纳约束同样是结构性的。信任建立很慢，产品导向销售可能瞬间摧毁信任，许多富裕家庭仍没有运行机构化家族办公室流程。传承服务渗透不足，家族办公室定义仍模糊，迁移或跨境需求抬高监管和服务复杂度。对
              Neo 的实际含义是，市场增长本身不保证拿到份额。胜出的平台必须把数字便利、顾问质量、可信载体、密集城市覆盖和足够宽的产品组合放在一起，才有机会替代自我管理或碎片化非正式咨询。
