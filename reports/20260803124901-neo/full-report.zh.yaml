              数字来自融资公告中的公司自报；未能取得条款清单或股东协议来审阅投后持股、清算优先权或反稀释条款；Neo Group 曾表示计划把高管团队从约 40 人扩至约 100 人，这本身带来执行和成本吸收风险。
