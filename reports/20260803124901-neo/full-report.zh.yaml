        - 在后续融资、申报门槛或上市流程中，Neo 仍不披露 FY24-FY26 收入 / 利润数据。
        - 未来融资轮媒体报道或监管申报文件中缺少审计财务报表。
      - - 降价融资
        - 下一次融资事件的定价低于 2026 年 3 月 TVS Capital 轮隐含的 Rs 10,000 crore 投前估值标记。
        - 下一次披露融资公告中的投前估值报道。
