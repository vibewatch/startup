        title: 能力、分销与信任姿态
        blocks:
          - type: paragraph
            body: >-
              主要竞争者的差异，不在于能不能提供投资产品，而在于如何包装信任、分销和服务密度。360 ONE 销售全栈：咨询、全权委托、分销、另类资产、借贷、资金管理和遗产规划。Nuvama
              推动一个覆盖产品、咨询、资本市场入口和技术的一体化平台。Anand Rathi 强调类似 CFO、以数据支撑的 RM 关系。Motilal 倚重开放架构、Hurun 家族可信度和家族治理支持。Julius
              Baer 和 DBS 不太可能靠本土网点规模取胜，而是靠精品声誉、评级、记账中心入口和传承规划能力。Neo
              的潜在优势是数字化熟练度和高端定位，但存量玩家已经占住印度富裕家庭关心的大多数信任锚点：长经营历史、可识别的监管载体、大型 RM 梯队，以及可见的机构或上市公司治理。因此，功能对齐本身不够。Neo
              必须证明体验更好或利益更一致，而不只是再摆一层产品货架。
