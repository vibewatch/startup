      - number: '2.5'
        title: 公开证据仍无法拆出的部分
        blocks:
          - type: paragraph
            body: >-
              主要尽调风险是假精确。公开来源显示，这是一个富裕且正在正规化的市场，但没有拆出 Neo 的真实 SOM。印度家族办公室没有干净的公开普查，纯咨询、PMS、AIF
              和更宽家族办公室费用池之间也没有可靠公开拆分，更没有从新兴富裕投资者转化为付费私人财富客户的公开曲线。即便最好的数字，也混合了本质不同的镜头：HNWI 人数、UHNW
              城市集中度、流动金融财富、管理型投资存量和家庭金融资产总额。它们都有用，但回答的问题不同。因此，最佳下一步尽调应转向内部：Neo 的城市级客户组合、RM
              产能、各载体钱包份额、自我管理或私人银行存量客户迁移，以及另类资产、遗产规划和跨境产品在细分客群中的附着率。在这些披露前，本章应把 Neo 的市场描述为有吸引力且多层次，而不是一句可以直接拿来倍数估值的精确
              TAM。
