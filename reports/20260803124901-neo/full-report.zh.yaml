      - number: '8.4'
        title: 情景与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              Neo Group 未披露 FY23 之后收入，因此本章搭建的是明确标注的作者估算，不把任何精确倍数当作事实。以披露的 FY23 收入 Rs 65 crore 为基数，按 2024 年 8 月至 2026 年 3
              月 Neo 披露客户 / advisory asset base 约 2.9x 的增幅外推，得到一个很宽的 FY26 收入区间，约 Rs 150-300 crore。以 TVS Capital 轮后约 Rs
              10,500 crore 的近似投后估值计，这一区间隐含 EV / revenue 约 35x-70x；对比作者根据 Nuvama 和 360 ONE WAM 披露 FY26 收入、PAT 与滚动 P/E
              计算出的 8.7x-16.4x EV / revenue 区间。基准情景下，Neo Group 下一轮融资估值守在 Rs 10,000 crore 附近，符合其最近十九个月两轮的节奏。牛市情景假设更大行业按
              Bernstein 预测的约 18% 十年 AUM CAGR 重估，且 Neo 最终披露可与同业比较的盈利能力，从而支撑未来融资或上市时更高估值。熊市情景假设增长放缓、IFSCA
              警示升级，或未来披露显示收入远低于作者估算区间下沿；任何一种都可能让下一轮低于 Rs 10,000 crore 投前估值。
