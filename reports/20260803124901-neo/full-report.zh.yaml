      - number: '1.4'
        title: 里程碑、控制与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支持一个判断：Neo 是在并行搭能力，而不只是叠融资轮次。公开时间线显示，公司早期拿到另类投资和 PMS 注册，2023 年完成 Peak XV 轮，2024 年完成 MUFG-Euclidean
              轮，随后发布合并组合报告的公开说明，并在 2026 年完成 TVS 轮且明确提到治理措辞。这个顺序符合一家想在全面放大 UHNI
              业务前，先把产品制造和报告体系机构化的公司。人才叙事也贴合这条时间线：Shajikumar Devakar 在 2026 年以联合创始人兼财富 CEO 身份加入，更像是有意加强运营梯队，而不是随机改头衔。


              负面信号真实存在，但边界仍清楚。Moneycontrol 称 Neo 在 2024 年末申请 NBFC 牌照，但审阅材料从未确认这条路径是否获批或落地。更重要的是，IFSCA 在 2025 年 5 月对 Neo
              Asset Management 的 IFSC 分支发布警示通知，但留存证据没有解释底层问题，也没有说明是否整改。Neo 自己在 2025 年 9
              月发布的欺诈风险提示性质不同——它显示品牌能见度上升，也说明需要保护投资者，不一定指向公司不当行为——但仍应放进风险登记表。正确结论是，Neo
              的故事仍具备投资价值且逻辑连贯，但披露完整度还不足以跳过治理、监管控制或已审计经济性跟进。
