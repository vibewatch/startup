  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务定义与产品栈
        blocks:
          - type: paragraph
            body: >-
              Neo 把自己呈现为一个知识驱动、技术赋能的财富与资产管理平台，服务家族办公室、机构、企业，以及超高净值或高净值客户。公开材料显示，客户主张有意拆在多个受监管实体中，而不是作为单一总括产品销售。Neo
              Wealth Partners 负责咨询和分销；Neo Wealth Management 提供经纪、托管参与人和投资顾问等执行界面；Neo Alternative Asset Managers 承载 PMS
              以及 Cat II、Cat III 和 GIFT City 另类资产；NeoFinity 则被定位为独立的金融科技 和支付部门。这很重要，因为 Neo
              的服务定义围绕工作流展开：咨询、分销、执行、制造另类资产，再把客户留在同一品牌家族内。集团还把家族办公室业务描述为基础设施很重、具有机构属性，而不只是组合构建。这种宽度是真实的商业差异点，但也意味着尽调必须追踪每项活动、投诉渠道和监管边界分别归属哪个法律实体，不能先假设产品体验无缝。
