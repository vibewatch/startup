  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的投资逻辑有两层：一是结构性顺风，Bernstein 估计，印度专业财富管理机构 AUM 未来十年将从约 $300 billion 增至 $1.6
              trillion；二是公司自身的增长故事，披露客户资产从 2024 年 8 月约 Rs 35,000 crore 的 advisory assets，升至 2026 年 3 月 TVS Capital 轮时约
              Rs 1,00,000 crore 总客户资产和 Rs 50,000 crore ARR AUM，背后财团已包括 MUFG Bank、Peak XV Partners、Euclidean Capital 和
              TVS Capital。Neo 约 150 名资深财富顾问和 600 多名专业人员，说明公司确实在面向庞大的 UHNI、家族办公室和机构客户群搭建团队。反论点同样具体：除 FY23 单一数据点（收入 Rs 65
              crore、亏损收窄至 Rs 3.6 crore）外，Neo Group 未披露集团层面收入、利润率或盈利数字，因此本章所有 headline AUM 和 ARR AUM
              数字都来自公司自报，而非审计。叠在这个披露缺口之上的，还有 2025 年 5 月 IFSCA 对 Neo Asset Management IFSC 分支发出的警示且没有公开确认整改，以及第三方 PMS AUM
              对同一 Neo Asset Management 业务给出的数字明显不一致。与此同时，资本充足、透明度高得多的上市同业（360 ONE WAM、Nuvama、Anand
              Rathi）和私人银行既有玩家（Motilal Oswal、Kotak、Julius Baer、DBS）都在争抢同一钱包；印度家族办公室治理成熟度也被广泛描述为落后于其快速机构化进程。
