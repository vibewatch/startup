  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 已观察到的影响
      - 当前公开替代项
      - 严重度
      - 精确尽调路径
    rows:
      - - 经审计收入和 EBITDA
        - 没有这些数据，估值无法锚到盈利质量
        - 收入质量判断仍只能看方向
        - 360 ONE、Nuvama、Anand Rathi 的同业披露
        - 阻断
        - 索取经审计 FY2024-FY2026 利润表和管理层桥接
      - - 各通道分部结构
        - 需要弄清经纪、顾问、PMS 还是另类资产驱动毛利
        - ARR AUM 无法直接转成收入结构
        - 官方产品页面只显示载体
        - 重大
        - 按产品、客户分层和实体索取收入
      - - 实收费率收益 / 留存 bps
        - 决定经常性收入质量，以及估值倍数能否撑住
        - 无法与 360 ONE 的 78 bps 披露做同口径比较
        - 只有 ARR AUM 标题数字
        - 重大
        - 索取费率收益历史、留存 bps 和净新增流量
      - - PMS / AIF AUM 对账
        - 公开目录互相冲突，削弱对产品级规模的信心
        - 外部数据库显示 PMS AUM 从 ₹0 crore 到 ₹5,275.22 crore 不等
        - Business Today、HNI Portfolio 和 IPOPlatform 交叉验证
        - 重大
        - 索取计划层面 AUM，并附最新监管申报或管理员报表
      - - 现金、债务和续航期
        - 需要用来判断融资依赖和下行韧性
        - 即使股权支持强，资本充足性判断仍不完整
        - 只有股权融资标题新闻
        - 阻断
        - 索取财资报表、债务明细和 12-18 个月资金续航计划
      - - IFSCA 警告细节及结案
        - IFSC 业务潜在控制问题无法量化
        - 监管悬而未决的判断仍只能定性
        - 仅确认警告通知存在
        - 重大
        - 索取完整通知、回复、整改日志，以及如有则提供结案证明
      - - 客户集中度与流失
        - 高端财富业务即使 AUM 很大，也可能高度集中
        - 平均单客资产等替代指标很粗，可能掩盖集中度风险
        - 2024 年 ET 报道给出的约 1,200 名客户数
        - 重大
        - 索取前 10 大客户占比、客户年限曲线，以及季度总流失 / 净流失数据
    notes: 每一行都是具体的投资审核卡点，不是泛泛的信息请求。本章可以解释 Neo 的收入模型，但还无法验证其盈利能力或韧性。
