        title: Neo 与有组织存量玩家的对比
        blocks:
          - type: paragraph
            body: >-
              Neo 自己的公开披露和融资报道，把它定位为拥有多种载体的高端财富平台，而不是纯消费者投资应用。The Economic Times 和 Business Standard 都称 Neo 2024 年财富 AUA
              约 ₹35,000 crore，另类资产 AUM 超过 ₹6,000 crore；官方页面则显示其具备经纪、投资顾问、PMS 和 AIF 架构。这有意义，但规模仍远小于已上市的本土存量玩家。360 ONE 报告
              FY26 AUM 为 ₹6.74 lakh crore，服务 8,500 多个客户家庭。Nuvama 把客户资产表述为超过 ₹4.5 trillion，并有 1,250 名 RM。Anand Rathi 和
              Motilal 的绝对规模小于 360 ONE 或 Nuvama，但仍分别约 ₹1 lakh crore 和 ₹1.96 lakh crore。竞争含义很清楚：Neo
              不是进入空白地带。它进攻的是一个规模型存量玩家已经把深 RM 覆盖和多载体产品宽度结合起来的战场。
