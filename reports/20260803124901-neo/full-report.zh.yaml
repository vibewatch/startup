        - Neo 把财富、另类资产和家族办公室咨询放在同一平台下，约 150 名高级顾问和 600+ 名专业人员共同覆盖。
        - 已披露 AUM / ARR AUM 数字没有独立审计确认；这些数字随融资公告一起由公司自报。
      - - 客户
        - Neo 服务约 1,200+ 名 HNI / UHNI / 家族办公室客户，披露客户资产约 Rs 1 lakh crore。
        - 独立评论认为，印度家族办公室制度化整体跑在治理成熟度前面。
      - - 财务
        - Entrackr 称，Neo FY23 收入增长九倍至 Rs 65 crore，亏损收窄。
        - Neo Group 未披露 FY24-FY26 收入、利润率或盈利能力数字。
      - - 竞争 / 资本
        - MUFG、Peak XV、Euclidean Capital 以及现在的 TVS Capital 参投，释放出一线资本和治理尽调信号。
        - 360 ONE、Nuvama、Anand Rathi、Motilal Oswal、Kotak、Julius Baer 和 DBS 都在争夺同一批 UHNI 钱包，而且披露深度远高于 Neo。
      - - 风险与治理
        - Neo 横跨财富、资产管理和另类业务，分散了收入集中风险。
        - IFSCA 于 2025 年 5 月向 Neo Asset Management 的 IFSC 分支发出正式警告，公开信息中尚无确认解决结果。
    notes: 成对的论点 / 反论点信号综合了本章来源中的融资、可比公司、行业和监管证据。
