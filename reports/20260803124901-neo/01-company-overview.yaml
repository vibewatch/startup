company:
  name: 'Neo Group'
chapter:
  number: 1
  title: 'Company Overview'
  summary: 'Neo Group is a Mumbai-based private wealth and alternatives platform built around regulated advisory, broking, PMS, AIF, and IFSC wrappers for UHNIs, family offices, and adjacent institutional clients. Reviewed sources show a rapid climb from a 2021 founder launch and 2024 MUFG-Euclidean raise to a March 2026 TVS Capital round of ₹500 crore at a ₹10,000 crore pre-money valuation, but the operating disclosure still trails the valuation story on board visibility, audited financials, and warning-resolution detail.'
sections:
  -
    id: 'identity-business-model'
    title: 'Identity, proposition, and platform scope'
    body: |-
      Neo’s official surfaces are unusually clear on who the company wants to be even if they are still light on audited operating metrics. The homepage positions Neo as India’s premier wealth and asset management platform, then immediately splits the group across wealth management, asset management, Neo Wealth Partners, and NeoFinity. The target audience is equally explicit: family offices, private-wealth clients, institutions, and corporates. That breadth matters because Neo is not presenting itself as a single-RM boutique; it is presenting itself as a multi-entity platform with execution, distribution, product-manufacturing, and eventually payments adjacencies.
      
      The customer proposition also has a distinct flavour. Neo’s Why Neo and Who We Serve pages keep returning to institutional-grade bespoke solutions, transparency, and the view that large Indian family offices increasingly operate like institutions. The wealth-management page sharpens that into a more concrete pitch: a knowledge-led, technology-powered advisory model for sophisticated HNI and UHNI clients. Together with the explicit references to public and private markets, global investments, alternative assets, and a proprietary technology layer, the public record supports a company identity built around high-touch advice plus product access rather than mass-market fintech distribution.
