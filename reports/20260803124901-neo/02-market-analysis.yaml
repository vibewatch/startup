- id: preserved-gaps
  title: What public evidence still cannot isolate
  body: 'The main diligence risk is false precision. Public sources show a wealthy and formalizing market, but they do not isolate Neo’s true SOM. There is no clean public census of Indian family offices, no reliable public split between advice-only, PMS, AIF and broader family-office fee pools, and no public conversion curve from emerging affluent investors into paying private-wealth clients. Even the best numbers mix fundamentally different lenses: HNWI headcount, UHNW city concentration, liquid-financial wealth, managed-investment stock and total household financial assets. Those are all useful, but they answer different questions. The best next-step diligence is therefore internal: Neo’s city-level client mix, RM productivity, share of wallet by wrapper, migration from self-managed or private-bank incumbents, and segment-level attachment of alternatives, estate planning and cross-border products. Until those are disclosed, the chapter should frame Neo’s market as attractive and multi-layered,
    not as one precise multiple-ready TAM sentence.'
  claimRefs:
  - CM039
  - CM040
  - CM041
tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - primary buyer / payer
  - relevance to Neo
  rows:
  - - Fee-based HNI advisory
    - Asset-allocation advice, reporting, product selection, RM-led servicing
    - Retail execution-only trading and mass-market deposits
    - HNI principal and family decision-maker
    - Core Neo entry point in premium wealth
  - - PMS and discretionary mandates
    - Portfolio-management fees, mandate oversight, investment execution within managed wrappers
    - Self-managed brokerage accounts
    - Principal plus delegated family or finance office
    - Captures clients seeking more formalized delegation
  - - Alternatives and AIF allocation
    - Alternative-fund access, private credit, PE/VC, treasury and structured opportunities
    - Generic capital-market issuance or venture funding not tied to wealth allocation
    - UHNI, family office, promoter family
    - Important attach product for premium clients
  - - Family-office and succession services
    - Governance, estate planning, philanthropy, next-generation engagement, reporting
    - General legal or tax spend unrelated to wealth stewardship
    - Family principals, trustees, family office executives
    - Widens Neo from advisor to operating partner
  - - Cross-border private wealth
    - Offshore booking, global products, migration-linked planning, liquidity and legacy support
    - Pure overseas operating-business expansion capex
    - NRI or globally mobile Indian principal
    - Competes with Julius Baer, DBS and private-bank incumbents
  - - Status-quo substitute
    - Internal family finance handling and informal local advisors
    - Any fee-paying organized wealth platform
    - Self-managing principal
    - Main hurdle Neo must displace before it wins share
  notes: Boundary table separates organized private-wealth revenue pools from broader savings and execution-only activity; row language synthesizes SEBI wrappers with incumbent wealth-platform pages.
