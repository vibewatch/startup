company:
  name: Neo Group
chapter:
  number: 2
  title: Market Analysis
  summary: 'Neo Group sits inside India’s organized private-wealth market rather than the whole household-savings universe. Public evidence supports a layered view: demand is concentrated in HNI, UHNI, family-office and emerging-affluent cohorts; market size ranges from population lenses such as 85,698 HNWIs and 19,877 UHNWIs to asset-pool lenses from roughly $300 billion of specialized wealth AUM to $3.9 trillion of managed investments and $6 trillion of household financial assets. The growth case is strong, but adoption still depends on trust, succession complexity, regulatory wrappers and the shift from self-managed or informal advice to professionalized platforms.'
sections:
- id: market-boundary-and-regulatory-shells
  title: Market boundary and regulatory shells
  body: 'The right market for Neo is not “Indian savings” and not even the entire retail investment market. The practical boundary is organized private wealth for HNI, UHNI and family-office clients: fee-bearing advice, portfolio construction, product distribution, alternatives access, estate and succession work, and other high-touch services wrapped through registrations such as investment adviser, portfolio manager and alternative-investment-fund structures. Public company pages from 360 ONE, Nuvama, Motilal Oswal, Julius Baer and DBS also show that the commercial job goes well beyond security selection. Buyers often expect treasury support, philanthropy, lending, cross-border access or family governance help. That breadth matters because it explains why Neo can look like a wealthtech, a private-bank substitute and a family-office enabler at the same time. It also explains what should be excluded from market sizing: self-directed deposits, mass-retail broking, and other savings pools that
    do not yet pay for organized advice.'
