- id: multi-lens-size-and-concentration
  title: Multi-lens size and concentration
  body: 'India’s private-wealth opportunity is large, but only when the lens is stated precisely. Knight Frank gives a population lens: 85,698 HNWIs in 2024 and 19,877 UHNWIs in 2026, with both cohorts still rising. Bernstein gives a liquid-wealth lens: about 3 million uber-rich households holding $2.7 trillion in liquid financial wealth, much of it still self-managed or served by unorganized channels. EY gives broader asset-pool lenses: an HNI/UHNI pool above $1 trillion, managed investments growing from $1.7 trillion in FY2022 to $3.9 trillion by FY2027, and household financial assets reaching $6 trillion by 2028. These are not interchangeable TAMs. They are nested boundaries that move from the narrow population Neo can directly pursue to the broader financialization backdrop supporting the industry. Concentration also matters: Mumbai alone accounts for 35.4% of India’s ultra-rich, and the top 1% of households control around 60% of total wealth, so route-to-market density matters as much
    as national totals.'
