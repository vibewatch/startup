- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - lens
  - publisher
  - year
  - value
  - scope
  - why it matters
  - limitation
  rows:
  - - India HNWI population
    - Knight Frank
    - '2024'
    - 85698
    - Residents with >$10M assets
    - Useful top-down count of economically relevant wealthy households
    - Headcount is not the same as fee-paying clients or assets captured
  - - India HNWI population forecast
    - Knight Frank
    - '2028'
    - 93753
    - Residents with >$10M assets
    - Shows continued addressable cohort growth
    - Forecast, not current client base
  - - India UHNW population
    - Knight Frank
    - '2026'
    - 19877
    - Residents with >$30M assets
    - More relevant for Neo’s premium target segment
    - Counts people, not households or bookable assets
  - - India UHNW population forecast
    - Knight Frank
    - '2031'
    - 25217
    - Residents with >$30M assets
    - Signals future family-office and cross-border demand
    - Longer-dated forecast
  - - Uber-rich liquid financial wealth
    - Bernstein
    - '2025'
    - USD 2.7T
    - Liquid financial wealth of ~3M uber-rich households
    - Strong proxy for professionally manageable asset stock
    - Not all of it is contestable or fee-paying
  - - Specialized organized wealth AUM
    - Bernstein
    - 10-year outlook
    - USD 300B to 1.6T
    - Specialized wealth-manager AUM expansion path
    - Useful organized-market lens close to Neo’s competitive set
    - Model-based and dependent on formalization assumptions
  - - Managed investments industry
    - EY
    - FY2027
    - USD 3.9T
    - Indian managed investments stock
    - Broad financialization tailwind for wealth platforms
    - Too broad to treat as Neo’s direct SAM
  - - Household financial assets
    - EY
    - '2028'
    - USD 6.0T
    - Indian household financial assets
    - Upper boundary showing long-run wealth pool growth
    - Much broader than organized private wealth
  notes: Rows intentionally mix population, liquid-wealth and asset-stock lenses so the chapter preserves scope differences instead of collapsing them into one headline TAM.
