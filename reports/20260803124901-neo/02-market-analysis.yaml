- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - economic buyer
  - daily user
  - budget owner / payer
  - adoption trigger
  - current substitute
  rows:
  - - Emerging affluent professional
    - Self-directed principal
    - App user and light-touch adviser
    - Personal surplus and salary-linked savings
    - Needs diversification beyond deposits and gold
    - DIY investing or mass-market distributor
  - - Classic HNI entrepreneur
    - Business owner or promoter
    - Principal plus RM
    - Personal/family investment budget
    - Liquidity event, tax complexity or concentrated stock exposure
    - Trusted informal advisor or legacy broker
  - - UHNI family
    - Family patriarch/matriarch or lead decision-maker
    - Principal, spouse, CFO-like family member, RM
    - Family balance sheet
    - Need for alternatives, governance, borrowing and estate planning
    - Private bank plus fragmented specialists
  - - Single-family office
    - Family principal or chair
    - Family office executive team
    - Family office treasury
    - Need consolidated reporting, manager selection and governance
    - Internal staff plus outsourced specialists
  - - Global Indian / NRI principal
    - Internationally mobile founder or inheritor
    - Principal, private banker, legal-tax adviser
    - Offshore or cross-border wealth pool
    - Migration, overseas property or offshore-booking need
    - Foreign private bank
  - - Corporate treasury / promoter treasury
    - Promoter or finance chief
    - Treasury staff and adviser
    - Corporate surplus pool
    - Need yield management and capital-market connectivity
    - Bank treasury products or in-house desk
  notes: Buyer/user/payer distinctions are synthesized from incumbent client-segmentation pages and market reports; rows describe common operating patterns rather than an exhaustive census.
