- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - market implication
  - diligence ask
  rows:
  - - Wealth creation through business profits and capital markets
    - Driver
    - Current
    - Creates more HNI and UHNI households to target
    - Bridge Neo pipeline to liquidity events and promoter networks
  - - Shift from savings products to managed investments
    - Driver
    - Current to medium term
    - Expands fee-bearing pools for organized managers
    - Measure client migration from deposits to advised products
  - - Digital onboarding and mass-affluent financialization
    - Driver
    - Current
    - Lowers acquisition friction and broadens future HNI funnel
    - Validate digital acquisition cost and conversion to premium RM-led service
  - - Next-generation wealth transfer and personalization demand
    - Driver
    - Medium to long term
    - Rewards platforms that combine advisers with digital experiences
    - Request age-cohort mix and digital engagement metrics
  - - Trust and alignment requirements
    - Constraint
    - Persistent
    - Slows vendor switching and rewards existing trusted brands
    - Collect Neo win/loss reasons against incumbent advisers
  - - Family-office governance immaturity
    - Constraint
    - Persistent
    - Creates advisory demand but makes complex mandates slow to close
    - Request case studies on governance-led wins and implementation time
  - - Succession planning under-penetration
    - Constraint and driver
    - Persistent
    - Adds need for high-touch planning but requires specialized capability
    - Review estate-planning attach rate and partner dependence
  - - Cross-border, migration and wrapper complexity
    - Constraint
    - Current
    - Raises service burden and favors full-stack incumbents
    - Map what share of Neo clients need offshore or multi-wrapper capability
  notes: Implications and diligence asks translate source evidence into adoption consequences; they are not direct quotes from any one source.
