- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: The public case for growth is robust. Wealth creation continues through business profits, IPOs, equity-market participation, digital onboarding rails and the gradual migration of savings into managed investments. Capgemini adds a longer-dated structural tailwind through the $83.5 trillion global great wealth transfer, while Kotak and Hubbis show that Indian families increasingly care about succession, governance and next-generation engagement. But adoption constraints are equally structural. Trust is slow to earn, product-led selling can destroy it, and many wealthy families still do not run institutional family-office processes. Succession work is underpenetrated, family-office definitions are still blurry, and migration or cross-border demands raise regulatory and servicing complexity. The practical implication for Neo is that market growth alone does not guarantee capture. The winning platform must combine digital convenience with adviser quality, trusted wrappers, dense urban
    coverage and enough product breadth to replace self-management or fragmented informal advice.
