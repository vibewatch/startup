chapter:
  number: 4
  title: 'Financials'
  summary: 'Neo’s public financial story is strongest on wrapper breadth, fundraising, and top-of-funnel scale proxies rather than on audited P&L disclosure. Reviewed sources show a platform spanning advisory, broking, distribution, PMS, AIF, and IFSC products, with headline scale moving from roughly ₹35,000 crore of wealth assets and more than ₹6,000 crore of alternatives in 2024 to roughly ₹1 lakh crore of client assets and roughly ₹50,000 crore of ARR AUM by March 2026. The underwriting blocker is disclosure quality: product-level PMS databases conflict sharply, listed peers publish revenue and ROE metrics that Neo does not, and the public record still lacks audited revenue, margin, cash, runway, and warning-resolution detail.'
sections:
  -
    id: 'revenue-rails-and-regulated-wrappers'
    title: 'Revenue rails and regulated wrapper mix'
    body: |-
      Neo’s public surfaces make one thing clear: this is not a single-fee advisory business. Neo Wealth Management lists broking, depository-participant, investment-advisory, and research capabilities. Neo Wealth Partners adds another advisory and distribution entity that explicitly mentions mutual funds, PMS, and AIF products. Neo Asset Management then layers on PMS, Category II and Category III AIFs, and an IFSC fund-management entity. In other words, the platform appears able to monetise execution, advisory, distribution, managed accounts, and alternatives manufacturing from overlapping affluent client relationships.
      
      The problem is that public disclosure of realised monetisation is far thinner than public disclosure of wrappers. HNI Portfolio gives one usable PMS fee anchor—1% fixed plus variable profit sharing and a ₹50 lakh minimum ticket—but Neo’s own official surfaces do not publish equivalent management-fee, advisory-fee, or carry schedules. That means the financial analyst can map how activity should convert into fee pools, but cannot yet see which rail dominates gross profit or whether the alternatives business is already margin-accretive relative to the wealth arm.
