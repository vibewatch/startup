    id: 'disclosure-gaps-and-financial-verdict'
    title: 'Disclosure gaps and financial verdict'
    body: |-
      The financial verdict is better than the disclosure package, not the other way around. Neo almost certainly has multiple monetisation rails, credible capital backers, and enough client scale to matter in Indian private wealth. But the firm still asks outside investors to bridge too much on trust: no audited revenue, no EBITDA, no cash, no runway, no reconciled product-level AUM, no realised fee-yield history, and no public explanation of the IFSC warning resolution. Those are not cosmetic omissions. They are the core metrics required to judge whether a ₹10,000 crore pre-money valuation reflects durable economics or simply strong market positioning in a growing segment.
      
      That leads to a cautious but not negative conclusion. Neo looks strategically well positioned, commercially broad, and structurally aligned with favourable Indian wealth tailwinds. Yet from a financial-underwriting perspective it remains disclosure-constrained. The next diligence packet must answer how much of ARR AUM converts into actual recurring revenue, what the alternatives business contributes to margin, whether PMS and AIF data reconcile cleanly, and how much liquidity sits behind the next stage of scale.
