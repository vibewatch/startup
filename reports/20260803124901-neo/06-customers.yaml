  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-client-proof
    missingEvidence: Named wealth or family-office customer references with live mandate scope, production status, and measurable outcomes.
    whyItMatters: Segment-level positioning does not prove flagship-account quality, deployment depth, or referenceability.
    diligencePath: Request a reference list split by family office, private wealth, institution, and corporate segment, then validate production status in calls.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: material
    topic: PMS-portal-metrics
    missingEvidence: A canonical current PMS client-count and AUM schedule that reconciles HNI Portfolio, Business Today, IPOPlatform, and any direct SEBI filings.
    whyItMatters: Conflicting adoption proxies make it hard to judge real external investor traction in Neo Asset Management products.
    diligencePath: Obtain the latest management-certified PMS client/AUM file and tie it to regulator-submitted disclosures before using any third-party tracker number.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU002
    - TU003
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 client exposure, top-adviser asset concentration, and product concentration by segment.
    whyItMatters: Without concentration data, rapid AUM growth could still mask dependence on a handful of families, advisers, or mandates.
    diligencePath: Request a concentration schedule by client, adviser, and product sleeve for the latest quarter and compare it with prior-year figures.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: retention-and-contracts
    missingEvidence: Renewal cadence, contract terms, redemption behavior, and cohort retention by customer segment.
    whyItMatters: Recurring-revenue AUM alone cannot tell whether Neo’s customer base is truly sticky or simply large and recently acquired.
    diligencePath: Review sample mandates/MSAs and ask management for logo retention, revenue retention, and withdrawal cohorts by product and client type.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: access-blocked
    severity: material
    topic: IFSCA-warning-details
    missingEvidence: The full text of the IFSCA warning and any remediation or follow-up correspondence tied to Neo Asset Management’s IFSC branch.
    whyItMatters: A regulator-issued warning can affect institutional confidence, onboarding friction, and the perceived quality of governance.
    diligencePath: Retrieve the underlying PDF or regulator correspondence directly from IFSCA or Neo and review whether the issue was procedural, conduct-related, or already remediated.
    relatedQuestionRefs:
    - QU025
