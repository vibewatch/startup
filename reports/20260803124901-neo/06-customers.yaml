tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / public proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Family offices
    - 'Buyer/Payer: principals, CIO/CFO, family office leadership; User: principals and family office teams'
    - Comprehensive wealth preservation, alternatives access, governance, reporting, and succession support
    - Official segment page treats large family offices as institutional-grade and the contact page has a dedicated Family Office Services path
    - Likely highest-value mandates with multi-product wallet potential
    - No named family office client or revenue concentration disclosed
  - - Private wealth / UHNI / HNI
    - 'Buyer/Payer: wealth creator or delegated adviser; User: principal and support staff'
    - Core wealth advisory, execution, broking, DP, and curated investment products
    - Wealth-management copy explicitly speaks to sophisticated UHNI and HNI clients
    - Core advisory base and likely source of recurring AUM
    - No public customer count or cohort retention disclosed
  - - Institutions
    - 'Buyer/Payer: CIO, treasury, or investment committee; User: finance/investment staff'
    - Alternatives, cross-border structures, treasury-like allocation needs, and institutional-style reporting
    - Why Neo explicitly names institutions; family-office page frames some family offices as institution-like
    - Can expand Neo beyond private wealth into more formal mandates
    - No named institutional customer or procurement win disclosed
  - - Corporates / treasury-oriented clients
    - 'Buyer/Payer: promoter, CFO, treasury head; User: finance staff and decision-makers'
    - Liquidity management, investment sleeves, risk-managed product access, and capital-market adjacency
    - Why Neo explicitly names corporates; contact page routes product inquiries separately from advisory
    - Adds non-household asset pools and cross-sell opportunity
    - Corporate use cases are described at segment level, not through public case studies
  - - HNI alternative/PMS investors
    - 'Buyer/Payer/User: HNI or NRI investor and delegated adviser'
    - PMS, Category II/III AIF, private credit, and alternative products
    - Independent PMS portals and Neo asset pages show live product discoverability, minimum-ticket framing, and active tracking
    - Validates external product reach beyond brand marketing
    - Portal-reported client/AUM numbers conflict materially and need reconciliation
  notes: Segment rows synthesize official positioning, direct contact surfaces, and third-party product-tracking pages; scale proof is segment-level because named end-clients are mostly undisclosed.
