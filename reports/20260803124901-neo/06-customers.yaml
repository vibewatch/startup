figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Neo’s customer journey appears to begin with segment-specific trust building, move through regulated onboarding, and then expand across products as the relationship deepens.
  data:
    nodes:
    - id: target-segment
      label: Target segment
      detail: Family offices, private wealth clients, institutions, corporates, and HNI/UHNI investors enter through different value propositions.
    - id: trust-formation
      label: Trust formation
      detail: Prospects evaluate transparency, adviser quality, confidentiality, and the fit between Neo’s philosophy and their long-term needs.
    - id: discovery
      label: Discovery path
      detail: Inbound paths split into Wealth Management, Family Office Services, or Invest in Neo Products, reflecting segment-aware lead capture.
    - id: regulated-onboarding
      label: Regulated onboarding
      detail: KYC, product suitability, grievance disclosures, and entity-specific registrations shape how the account is opened.
    - id: core-mandate
      label: Core mandate
      detail: The relationship lands in advisory, broking, distribution, or an initial alternative product depending on client need.
    - id: cross-sell
      label: Cross-sell / deepen
      detail: Neo can extend the same relationship into PMS, AIFs, private credit, reporting, and cross-border structures.
    - id: renew-expand
      label: Renew / expand
      detail: Long-term value depends on adviser continuity, trust, and whether product breadth converts into durable wallet share.
  approximationNotes: This journey is inferred from official segment pages, contact surfaces, and regulatory/product pages rather than from a published Neo sales-process diagram.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU011
  - CU027
  - CU033
  - CU046
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: A flow is more defensible than a numeric funnel because public evidence supports sequential stages of adoption but not reliable stage-conversion rates.
  data:
    nodes:
    - id: segment-interest
      label: Segment interest
      detail: Neo publicly addresses family offices, private wealth, institutions, corporates, and HNI alternative investors.
    - id: advisory-conversation
      label: Advisory conversation
      detail: Prospects engage through content, introductions, or direct contact flows tailored to wealth, family office, or product demand.
    - id: entity-selection
      label: Entity selection
      detail: The relationship chooses among wealth, distribution, PMS, AIF, or GIFT structures depending on mandate needs.
    - id: go-live
      label: Go-live
      detail: Headline assets and adviser counts indicate the platform is operating at meaningful scale, not only in pilot mode.
    - id: wallet-expansion
      label: Wallet expansion
      detail: Breadth across alternatives, reporting, and product distribution enables share-of-wallet growth within the same relationship.
    - id: retention-test
      label: Retention test
      detail: Public evidence becomes thin at renewals because cohorts, churn, and concentration disclosures are absent.
    edges:
    - from: segment-interest
      to: advisory-conversation
      label: Segment-specific proposition
    - from: advisory-conversation
      to: entity-selection
      label: Needs and suitability
    - from: entity-selection
      to: go-live
      label: KYC / onboarding
    - from: go-live
      to: wallet-expansion
      label: Broader product access
    - from: wallet-expansion
      to: retention-test
      label: Renewal and adviser continuity
  approximationNotes: The flow reflects public stage logic only; Neo does not disclose lead-to-funding, onboarding, or upsell conversion rates in reviewed sources.
