- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from wealth advice into PMS, AIFs, private credit, and GIFT structures
    - If most assets sit in a narrow advisory sleeve, wallet share may be shallower than headline platform breadth suggests
    - High
    - Request product penetration by client cohort and asset mix by relationship
  - - Family-office institutionalisation
    - Large families may demand governance, reporting, and succession capability beyond product access
    - High
    - Test reference calls on reporting depth, service cadence, and next-generation engagement
  - - Advisor-led operating model
    - AUM per senior adviser may be high, making talent retention and adviser continuity critical
    - High
    - Ask for adviser tenure, client portability rules, and top-adviser concentration
  - - Regulated onboarding and committee diligence
    - Multiple registrations, direct onboarding flows, and institution-like buyers can slow conversion
    - Medium to high
    - Review onboarding SLAs, KYC friction, and institutional procurement win/loss data
  - - Trust and regulatory optics
    - Impersonation scams and the unresolved IFSCA warning can increase diligence and trust-verification friction
    - Medium to high
    - Obtain the underlying IFSCA warning text and complaint-resolution history by entity
  notes: Risk rows focus on how apparent breadth could still mask concentration, onboarding drag, or talent dependence in a relationship-driven wealth platform.
