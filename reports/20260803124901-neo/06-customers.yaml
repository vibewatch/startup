callouts:
- calloutType: insight
  title: Segment breadth is clear; flagship clients are not
  body: Neo has unusually explicit public segmentation for a private wealth platform, but the same materials stop short of naming end-clients. That means the story is strongest on who Neo wants to serve and weakest on which exact accounts prove the model today.
  claimRefs:
  - CU001
  - CU013
  - CU014
  - CU015
- calloutType: risk
  title: Durability still depends on private diligence
  body: Headline client assets, adviser count, and product breadth are encouraging, but public materials do not disclose concentration, contract length, or cohort retention. Investors should underwrite customer quality through reference calls, top-account schedules, and adviser-tenure analysis rather than through AUM alone.
  claimRefs:
  - CU020
  - CU021
  - CU043
  - CU044
  - CU050
