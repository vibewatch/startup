- id: expansion-and-friction
  title: Expansion dynamics, procurement, and advisory friction
  body: 'Neo''s expansion logic is straightforward: it can deepen a relationship from wealth advice and execution into product distribution, PMS, alternatives, private credit, and cross-border/GIFT City structures. Competitor disclosures from Anand Rathi, Motilal Oswal, and DBS show that upper-end wealth players compete on advisor density, hybrid digital-human servicing, succession support, and trusted multi-product breadth; Neo''s AI-led Infinity and Neomi references plus its publications library suggest it is following the same playbook. The friction is equally visible. Regulatory pages surface multiple SEBI registrations, compliance officers, complaint channels, investor-charter links, and direct onboarding flows, which means procurement is documentation-heavy and potentially slow for institutions or committee-driven family offices. Neo''s own caution notice about impersonation schemes shows brand-verification risk is operationally important during prospect conversion. The strongest adverse public signal is an IFSCA viewer page for a document titled as a warning to Neo Asset Management''s IFSC branch; because the underlying PDF body was not directly recoverable from the viewer path, the specific conduct remains unresolved, but it is material enough to keep regulatory diligence on the customer-acquisition path.'
