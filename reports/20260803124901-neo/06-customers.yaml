company:
  name: Neo Group
chapter:
  number: 6
  title: Customers
  summary: 'Neo clearly targets family offices, private wealth clients, institutions, corporates, and UHNI/HNI investors, and public disclosures imply rapid asset and adviser growth plus broad product breadth. The caveat is proof quality: named public clients are scarce, external PMS trackers conflict on current client/AUM counts, and public retention, concentration, and contract data remain largely undisclosed, so durability still has to be underwritten through private diligence rather than headline assets alone.'
sections:
- id: segment-architecture
  title: Segment architecture and who pays
  body: 'Neo''s public customer map is broader than a retail wealth app or a single-product broker. Official segment pages explicitly name family offices, private wealth clients, institutions, corporates, and sophisticated UHNI/HNI customers. The family-office language matters because Neo does not describe that cohort as generic affluent households; it describes them as quasi-institutional clients that need specialized infrastructure, bespoke investment frameworks, flexibility, and round-the-clock service. In practical buyer-user-payer terms, that points to principals, family office CIOs/CFOs, promoter offices, or treasury heads acting as buyers and payers, with principals and their operating teams as the day-to-day users of reporting, advice, and execution support. The public entity stack also shows why this segmentation matters commercially: Neo can serve the same relationship across wealth advisory, broking, depository services, product distribution, PMS, AIFs, private credit, and GIFT City structures. The raw contact page reinforces that this is a deliberate GTM design, showing 12 in-person location buckets and separate inquiry paths for Wealth Management, Family Office Services, and Invest in Neo Products.'
