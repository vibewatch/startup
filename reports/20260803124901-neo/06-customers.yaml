- id: adoption-and-public-proof
  title: Adoption proxies and public proof substitutes
  body: 'Public adoption evidence is strongest when read as platform scale and substitute customer proof rather than as named-client case studies. Leadership bios and financing coverage show a rising disclosed asset base: BusinessLine reported ₹35,000 crore of wealth assets and more than ₹6,000 crore of alternative assets in August 2024; the May 2025 leadership article cited more than ₹40,000 crore of wealth plus ₹11,500 crore of alternatives and a team of 600+ professionals; and March 2026 fundraise coverage cited about ₹1 lakh crore of client assets, roughly ₹50,000 crore of annualised recurring-revenue AUM, and about 150 senior wealth advisers. What is missing is the traditional named-customer layer. Reviewed official materials describe segments and product surfaces, not flagship end-clients. The best public substitute customer-proof comes from independent PMS portals that track Neo Asset Management for HNI allocators. Those portals at least confirm the products are externally discoverable and investable, but they disagree sharply on current active clients and AUM, so they validate surface adoption better than exact present scale.'
