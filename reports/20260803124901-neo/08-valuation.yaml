- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Why It Matters
  - Priority
  rows:
  - - Obtain FY24-FY26 audited or management P&L and balance sheet
    - Closes the revenue/margin disclosure gap that currently blocks like-for-like comparison with listed peers.
    - High
  - - Obtain the 2026 TVS Capital round term sheet / shareholders' agreement
    - Confirms post-money valuation, liquidation preference, ratchets, and other terms not visible in press coverage.
    - High
  - - Confirm IFSCA warning remediation status directly with Neo Asset Management
    - Assesses whether the May 2025 regulatory lapse has been closed or remains an open compliance risk.
    - High
  - - Reconcile PMS AUM figures across SEBI, ipoplatform.com, hniportfolio.com, and Business Today
    - Resolves a material data-quality gap that undermines confidence in third-party AUM verification.
    - Medium
  - - Request advisor/RM headcount and attrition trend data
    - Stress-tests the '~150 senior advisors' growth narrative against a competitive hiring environment.
    - Medium
  - - Request client-concentration and retention metrics (e.g., top-10 client % of AUM)
    - Assesses key-person and key-client concentration risk not visible from public sources.
    - Medium
  - - Clarify how alternative-assets AUM is treated versus wealth AUA in the disclosed ~Rs 1 lakh crore figure
    - Avoids double-counting when computing AUM-based valuation multiples.
    - Medium
  - - Confirm exit-path precedent (IPO plans, comparable secondary transactions)
    - Frames a realistic hold horizon given no company-specific exit evidence was found.
    - Low
  notes: Diligence asks are prioritised by how directly they close the blocking and material evidence gaps identified in this chapter.
