- id: recommendation-confidence-and-risk-rating
  title: Recommendation, Confidence, and Risk Rating
  body: 'This chapter''s recommendation is to track Neo Group and research further rather than to underwrite the March 2026 terms outright. Confidence in that recommendation is medium: it is anchored in consistent, multi-outlet corroboration of both the August 2024 and March 2026 funding rounds and their headline AUM figures, offset by the fact that those figures are entirely self-reported and the only disclosed profit-and-loss data point dates to FY23. The risk rating is medium-high, reflecting the combination of a strong sector tailwind with company-specific regulatory exposure (the unresolved IFSCA warning), talent-retention risk in an increasingly competitive senior-banker hiring market, and the PMS data-quality issues surfaced in independent trackers. The valuation stance is stretched: an author-estimated EV/revenue multiple of roughly 35x-70x and an EV/ARR-AUM ratio of about 0.21x both sit above the comparable ranges implied by 360 ONE WAM and Nuvama''s disclosed FY26 financials, even
    though the underlying Neo Group revenue figure is an estimate rather than a disclosed fact. No target return, hold period, or exit path is asserted here, since no public secondary or listing window specific to Neo Group was found in the evidence pack.'
