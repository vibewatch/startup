- id: scenarios-and-valuation-sensitivity
  title: Scenarios and Valuation Sensitivity
  body: Because Neo Group has not disclosed post-FY23 revenue, this chapter builds a clearly labelled author estimate rather than treating any exact multiple as fact. Scaling the disclosed FY23 revenue base of Rs 65 crore by the roughly 2.9x growth observed in Neo's disclosed client/advisory asset base between August 2024 and March 2026 implies a wide FY26 revenue range of roughly Rs 150-300 crore. Against the Rs 10,500 crore approximate post-money valuation from the TVS Capital round, that range implies an EV/revenue multiple of roughly 35x-70x, compared with an author-calculated 8.7x-16.4x EV/revenue range for Nuvama and 360 ONE WAM respectively, derived from their disclosed FY26 revenue, PAT, and trailing P/E. In the base case, Neo Group's valuation holds near the Rs 10,000 crore mark at its next raise, consistent with its recent two-rounds-in-19-months cadence. The bull case assumes the broader sector re-rates toward Bernstein's roughly 18% projected decade-long AUM CAGR and Neo eventually
    discloses peer-comparable profitability, supporting a materially higher valuation at a future round or listing. The bear case assumes growth decelerates, the IFSCA warning escalates, or a future disclosure reveals revenue well below the low end of the author-estimated range, any of which could produce a down round relative to the Rs 10,000 crore pre-money mark.
