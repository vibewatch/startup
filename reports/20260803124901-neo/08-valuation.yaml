chapter:
  number: 8
  title: Valuation & Investment Recommendation
  summary: Neo Group's March 2026 Rs 500 crore TVS Capital round at a Rs 10,000 crore pre-money valuation extends a tier-1-backed growth story built on disclosed AUM and ARR AUM scale, but with no post-FY23 revenue disclosure, an unresolved IFSCA warning, and conflicting third-party PMS data, this chapter recommends tracking rather than underwriting the round, at a medium confidence, medium-high risk rating, and a valuation stance that looks stretched against listed peers on an author-estimated basis.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'Neo Group''s investment case rests on a structural tailwind that Bernstein sizes at roughly $300 billion growing to $1.6 trillion in specialised Indian wealth-manager AUM over the next decade, combined with a company-specific growth story: disclosed client assets rose from about Rs 35,000 crore in assets under advisory in August 2024 to roughly Rs 1,00,000 crore in total client assets and Rs 50,000 crore in ARR AUM by the March 2026 TVS Capital round, backed by a syndicate that now includes MUFG Bank, Peak XV Partners, Euclidean Capital, and TVS Capital. Neo''s roughly 150 senior wealth advisors and 600-plus professionals signal genuine build-out against a large addressable UHNI, family-office, and institutional client base. The anti-thesis is equally concrete: Neo Group has not disclosed group-level revenue, margin, or profit figures since a single FY23 data point (Rs 65 crore revenue, a narrowing Rs 3.6 crore loss), so every headline AUM and ARR AUM figure in this chapter is self-reported
    rather than audited. Layered on top of that disclosure gap are a May 2025 IFSCA warning to Neo Asset Management''s IFSC branch with no confirmed public remediation, and materially inconsistent third-party PMS AUM figures for the same Neo Asset Management business. Meanwhile, well-capitalised, far more transparent listed peers (360 ONE WAM, Nuvama, Anand Rathi) and private-banking incumbents (Motilal Oswal, Kotak, Julius Baer, DBS) are all competing for the same wallet, and Indian family-office governance maturity is broadly described as lagging its rapid institutionalisation.'
