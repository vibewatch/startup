- id: financing-context-and-entry-discipline
  title: Financing Context and Entry Discipline
  body: 'Neo Group''s disclosed financing history shows two rounds in roughly nineteen months: Rs 400 crore led by MUFG Bank and Euclidean Capital in August 2024, when the company reported nearly Rs 35,000 crore in assets under advisory, over Rs 6,000 crore in alternative assets, and around 1,200 clients; and Rs 500 crore from TVS Capital in March 2026 at a Rs 10,000 crore pre-money valuation, alongside disclosure of roughly Rs 1,00,000 crore in total client assets and Rs 50,000 crore in ARR AUM. Hindu BusinessLine put cumulative equity capital raised at approximately $104 million (about Rs 1,000 crore) as of the 2024 round. No source in the evidence pack documents a separately priced financing event between these two rounds, though this absence of evidence is not proof of absence. Entry discipline for any prospective investor should explicitly account for the facts that these headline figures are self-reported in funding-announcement statements, that no term sheet or shareholders'' agreement
    detailing post-money ownership, liquidation preference, or anti-dilution terms was available for review, and that Neo Group has stated an intent to expand its executive team from roughly 40 to around 100 professionals, which carries its own execution and cost-absorption risk.'
