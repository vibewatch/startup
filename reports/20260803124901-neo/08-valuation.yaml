  title: Recommendation Summary Table
  columns:
  - Dimension
  - Assessment
  - Rationale
  rows:
  - - Recommendation
    - Track / research further before committing new capital
    - Disclosed AUM/ARR AUM growth and a tier-1 investor syndicate are encouraging, but undisclosed revenue/margin, an unresolved IFSCA warning, and conflicting PMS AUM data mean the March 2026 terms cannot yet be independently underwritten.
  - - Confidence
    - Medium
    - Multiple independent outlets corroborate both funding rounds and headline AUM figures, but those figures are self-reported and the only disclosed P&L data point is from FY23.
  - - Risk rating
    - Medium-High
    - Combines a strong structural sector tailwind with company-specific regulatory, talent-retention, and disclosure-quality risks.
  - - Valuation stance
    - Stretched relative to disclosed peer multiples
    - Author-estimated EV/revenue (~35x-70x) and EV/ARR-AUM (~0.21x) both sit above the approximate 9x-16x EV/revenue and ~0.06x-0.17x EV/AUM-style ranges implied by listed peers, though the revenue base is an estimate, not a disclosed figure.
  - - Target return / hold / exit
    - No public secondary or listing window identified
    - No source in the evidence pack documents a company-specific IPO timeline, strategic-sale process, or secondary-transaction precedent for Neo Group.
  - - Entry discipline
    - Condition any follow-on entry on audited financials and IFSCA resolution confirmation
    - Closes the two most material gaps (revenue/margin disclosure and regulatory-lapse remediation) before a fresh valuation mark can be relied upon.
