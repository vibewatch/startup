- id: comparable-set
  title: Comparable Set
  body: The comparable set combines three listed pure-play Indian wealth managers with four private-banking incumbents. 360 ONE WAM reported FY26 total AUM of Rs 6,74,492 crore, ARR AUM of Rs 3,11,940 crore, revenue of Rs 3,144 crore, and PAT of Rs 1,225 crore, trading at roughly 42x trailing earnings against a five-year median of 32.7x. Nuvama Wealth Management, majority-owned by PAG, reported FY26 client assets above Rs 4.5 trillion across 4,750-plus UHNI families, revenue of Rs 3,122 crore, operating PAT of Rs 1,049 crore, and a 28.1% ROE, trading at roughly 26x trailing earnings. Anand Rathi Wealth reported FY26 revenue of Rs 1,198 crore, PAT of Rs 386 crore, AUM above Rs 1,00,000 crore, and a 46.7% ROE, but Bernstein rates it only Market-Perform, flagging that market-linked debentures generate over half its revenue as a risk and valuation concern. Motilal Oswal Private Wealth, Kotak Private Banking, Julius Baer India, and DBS Private Bank round out the set as disclosure-light incumbent
    competitive references rather than like-for-like public comparables, since none separately reports wealth-division financials. This mixed comparable set, spanning very different disclosure regimes and balance-sheet structures, limits strict multiple comparability with Neo Group and is treated here as a partial, illustrative sample rather than an exhaustive registry of Indian wealth managers.
