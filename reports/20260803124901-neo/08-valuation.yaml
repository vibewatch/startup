  body: MUFG Bank, Peak XV Partners, Euclidean Capital, and now TVS Capital have all backed Neo Group, lending diligence credibility to its growth narrative even though its own financial disclosures remain thin.
  claimRefs:
  - CV005
  - CV008
- calloutType: risk
  title: Revenue and margin undisclosed since FY23
  body: Every valuation multiple in this chapter for Neo Group rests on an author-estimated revenue range because no FY24-FY26 revenue, margin, or profit figure was found in the evidence pack.
  claimRefs:
  - CV050
  - CV013
- calloutType: risk
  title: Unresolved IFSCA warning
  body: IFSCA's May 2025 warning to Neo Asset Management's IFSC branch has no confirmed public remediation in the evidence pack, and would be a direct thesis-break trigger if it escalates.
  claimRefs:
  - CV040
  - CV041
- calloutType: assumption
  title: Valuation multiples are author estimates, not disclosed facts
  body: Because Neo Group's revenue is undisclosed, the EV/revenue and EV/ARR-AUM comparisons in this chapter rest on a clearly labelled, wide author-estimated revenue range rather than an invented precise multiple.
  claimRefs:
  - CV051
  - CV052
  - CV053
- calloutType: insight
  title: Sector tailwind is real but priced with caution by analysts
  body: Bernstein's roughly 18% projected decade-long AUM CAGR for specialised Indian wealth managers supports the structural bull case, but Citi has separately urged investors to wait for better entry points even for its own top listed picks.
  claimRefs:
  - CV032
  - CV033
