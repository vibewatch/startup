  title: Bull Base Bear Scenario Table
  columns:
  - Scenario
  - Key Assumptions
  - Valuation / Outcome Range
  - Probability Signal / Trigger
  rows:
  - - Bull
    - Sector AUM re-rates toward Bernstein's decade-long growth case; Neo compounds ARR AUM growth and eventually discloses peer-comparable profitability.
    - Materially above the Rs 10,000 crore March 2026 pre-money mark at a future round or listing.
    - Requires disclosed profitability approaching listed-peer margins and no further regulatory escalation.
  - - Base
    - Neo continues raising growth capital at a cadence similar to 2024-2026, with AUM/ARR AUM growing steadily while revenue stays largely undisclosed.
    - Valuation holds near or modestly above the Rs 10,000 crore pre-money mark at the next financing.
    - Consistent with the pattern of two disclosed rounds in roughly 19 months at rising valuations.
  - - Bear
    - Growth decelerates, the IFSCA warning escalates, or a future disclosure reveals revenue well below the author-estimated Rs 150-300 crore FY26 range.
    - Down round or valuation markdown versus the Rs 10,000 crore pre-money mark.
    - These are identified as the most plausible down-round triggers given the evidence pack.
  notes: Scenario ranges are author judgments anchored to disclosed round history and estimated revenue bands, not company guidance.
