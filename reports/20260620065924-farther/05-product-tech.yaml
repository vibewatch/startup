  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: cybersecurity
      missingEvidence: SOC 2 Type II or ISO 27001 audit report or certification attestation letter for Farther Finance Advisors LLC and its platform
      whyItMatters: Institutional advisors and enterprise clients face vendor risk management obligations that typically require SOC 2 certification; absence of public certification is a material obstacle to institutional adoption
      diligencePath: Request SOC 2 Type II report or certification letter directly from Farther compliance team; search AICPA Trust Services registry
      relatedQuestionRefs:
        - QE006

    - type: missing-source
      severity: blocking
      topic: ai-governance
      missingEvidence: AI model governance policy, model cards for AI systems used in advice and administration, and regulatory disclosure describing AI usage in Form ADV
      whyItMatters: Farther's core value proposition centers on AI, yet there is no public disclosure of model selection, training data, update cadence, or hallucination/error controls — a growing regulatory requirement per SEC 2026 priorities
      diligencePath: Request AI governance documentation from Farther compliance; review latest Form ADV Part 2A filing on IAPD for AI-specific disclosures
      relatedQuestionRefs:
        - QE005
        - QE017

    - type: private-evidence-only
      severity: material
      topic: farther-asset-management
      missingEvidence: FAM investment performance track record, benchmark methodology, and private markets deal-flow sourcing documentation
      whyItMatters: FAM is a related-party entity through which Farther earns investment management revenue; performance, methodology, and conflicts of interest would be disclosed in a Form ADV Part 2A brochure but have not been independently verified
      diligencePath: Retrieve FAM Form ADV Part 2A (if separately registered) via IAPD; request performance attribution and methodology document from FAM
      relatedQuestionRefs:
        - QE007
        - QE010
        - QE011

    - type: missing-source
      severity: material
      topic: platform-architecture
      missingEvidence: Cloud provider, database infrastructure, AI/LLM model provider, and data-at-rest encryption specifics for the Farther platform
      whyItMatters: Architecture dependencies on specific cloud vendors (concentration risk), AI providers (cost and continuity), and data security controls are not publicly verifiable from marketing materials
      diligencePath: Request a vendor disclosure summary or abbreviated architecture document under NDA during commercial due diligence
      relatedQuestionRefs:
        - QE005
        - QE018

    - type: missing-source
      severity: material
      topic: direct-indexing
      missingEvidence: Minimum account size, index universe, tax-lot tracking methodology, and rebalancing frequency for Farther's direct indexing offering
      whyItMatters: Direct indexing is a differentiating but technically complex product requiring specific operational infrastructure; minimum size and methodology determine the actual addressable client segment
      diligencePath: Request FAM direct indexing program disclosure document; compare to Altruist's published Direct Indexing specs
      relatedQuestionRefs:
        - QE013

    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        No public GitHub repositories, API documentation, developer forums, or open-source
        contributions attributable to Farther or Brad Genser's engineering team
      whyItMatters: >-
        For a company positioning AI as its core differentiator, the absence of any public
