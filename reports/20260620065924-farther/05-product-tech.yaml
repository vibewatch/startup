            - High — admin automation at platform inception, not retrofitted
            - Medium — peers building comparable AI stacks
            - Tearsheet reporting; no independent benchmark
        - label: Multi-Custodial Integration
          values:
            - Live (core)
            - Medium — multi-custodial is table stakes for modern RIAs
            - Low — Orion and others also support multiple custodians
            - Confirmed (four custodians named publicly)
    approximationNotes: Maturity and differentiation ratings are the author's assessment based on public evidence; not based on independent product testing or benchmarking.
    claimRefs:
      - CE001
      - CE024
      - CE029

callouts:
  - calloutType: strength
    title: Ground-up AI-native architecture is a real structural advantage
    body: >-
      Unlike legacy wealth platforms that retrofit AI onto 1970s-era systems, Farther built
      its platform from inception with AI at its core. The founding team's prior exposure to
      fragmented private-wealth workflows provides credible motivation for a vertically
      integrated product design. The unified data model
      enables the tax-loss harvesting, asset location, and rebalancing modules to operate on
      a single source of truth — a structural efficiency that bolt-on stacks cannot easily
      replicate. This architecture advantage is the most defensible technical differentiator.
    claimRefs:
      - CE005
      - CE006
      - CE009

  - calloutType: risk
    title: No independent cybersecurity or AI governance disclosure
    body: >-
      Farther markets AI as central to its value proposition but has published no AI model
      governance framework, no SOC 2 certification, and no security whitepaper. As the SEC's
      2026 regulatory focus expands into AI-disclosure requirements for investment advisers,
      the absence of these disclosures becomes both a regulatory risk and a client-trust risk.
      Institutional advisors evaluating the platform face a vendor risk gap that competitors
      with SOC 2 certifications (common among mature RIA technology providers) do not present.
    claimRefs:
      - CE036
      - CE038
      - CE039

  - calloutType: risk
    title: Private markets and FAM methodology are entirely opaque
    body: >-
      Farther Asset Management's investment methodology, performance track record, benchmark
      construction, and private markets deal-flow sourcing are not publicly available.
      The direct indexing offering has no disclosed minimum account size or index universe.
      For any counterparty conducting investment manager due diligence, these are standard
      pre-investment disclosures that Farther currently cannot satisfy from public sources.
      A Form ADV Part 2A review is a minimum required step.
    claimRefs:
      - CE002
      - CE033
      - CE015

  - calloutType: insight
    title: Integration lock-in is a double-edged sword
    body: >-
      The unified platform architecture that creates Farther's workflow efficiency also
      creates advisor switching costs — advisors who build workflows around the Farther-native
      CRM, TLH, FAM, and portal may face significant friction if they decide to leave.
      This is positive for retention but means that advisor evaluation of the platform
      is effectively a long-term commitment decision, making sales cycles longer and
      raising the stakes of any platform reliability issues.
    claimRefs:
      - CE019
      - CE027

