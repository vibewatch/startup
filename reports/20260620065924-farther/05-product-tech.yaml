  - id: se-fam
    title: Farther Asset Management and investment capabilities
    body: >-
      Farther Asset Management (FAM) is the proprietary investment management layer of the
      platform, led by Chief Investment Officer Nick Panitsas. FAM delivers a suite of
      solutions exclusively through the Intelligent Wealth Platform: tax-aware model
      portfolios, curated private market investments, and dynamic tax-driven strategies.
      This vertical integration — where the RIA also controls the investment product layer
      — differentiates Farther from typical RIAs that rely solely on third-party model
      marketplaces (such as those offered by Orion or Envestnet).


      Private markets access is prominently marketed to both advisors and clients as an
      expansion of the investable universe. The Series D announcement cited this as a
      key platform feature enabling "portfolio diversification and improved return potential."
      RIABiz reporting on Farther Family Office reveals that Ben Seidenstein specifically
      chose Farther because it could operationally process private investment allocations —
      an area where large custodians remain constrained by scale-vetting requirements.
      The actual sourcing pipeline, selection methodology, minimum investment thresholds,
      and fee structure for private market products are not publicly disclosed, representing
      a material diligence gap.


      Direct indexing is listed as an available capability through FAM, though no independent
      review of the minimum account size, index universe, or tax-loss harvesting methodology
      has been published. Farther Asset Management's Form ADV (if separate from Farther
      Finance Advisors LLC) has not been located in public IAPD records, and the investment
      management methodology, benchmark construction, and performance history are not
      publicly available. Competitor Altruist launched its own Direct Indexing product
      in 2025 with model marketplace transparency, raising the comparison bar for what
      advisors can evaluate independently.
    claimRefs:
