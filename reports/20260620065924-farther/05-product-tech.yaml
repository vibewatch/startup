  - id: se-trust
    title: Trust, compliance, AI governance, and open diligence questions
    body: >-
      Farther operates as an SEC-registered investment adviser under CRD number 302050,
      subject to fiduciary obligation and full Form ADV disclosure requirements. Chief
      Compliance Officer Chris Powers oversees compliance. The company has implemented
      Osano as its cookie consent management platform, suggesting baseline privacy
      governance for its web properties. However, no independent third-party cybersecurity
      certification (SOC 2 Type II, ISO 27001, or similar) is publicly disclosed, and the
      company has not published a security whitepaper, penetration testing status, or breach
      history. This is a material gap for institutional advisors and enterprise clients
      with vendor risk requirements.


      On AI governance, Farther's positioning as "AI at its core" creates diligence
      obligations that have not yet been addressed publicly. The specific AI models used
      (whether proprietary, OpenAI, or other), the training data, model update cadence,
      hallucination controls, and client disclosure frameworks for AI-assisted advice are
      all undisclosed. The SEC's early 2026 thematic focus on AI (per Willkie Farr's
      regulatory update and Quarles' Form ADV guidance) suggests that AI-specific disclosures
      will be required in future Form ADV filings. Farther's current Form ADV disclosures
      have not been verified to address AI model usage.


      Form ADV Part 2A (brochure) disclosures for Farther Finance Advisors LLC are
      publicly accessible via IAPD but have not been independently retrieved and verified
      for this chapter. The brochure would provide binding disclosure of investment
      methodology, fee structure, conflicts of interest, and service-delivery risks —
      all critical inputs for evaluating the technology-delivery model. This represents
      a high-priority diligence item for any institutional counterparty.
    claimRefs:
      - CE036
      - CE037
      - CE038
      - CE039
      - CE040
