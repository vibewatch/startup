  - id: s5
    title: Adverse Research Findings and Evidence Limitations
    body: >-
      Mandatory adverse research for this chapter produced the following material findings.
      The most significant adverse finding is the three Form ADV Item 11 disciplinary alerts
      identified by AdvisorSearch.org — an Activity Restriction from an SRO, an
      Attorney/Accountant Authorization Revocation, and a Business License Revocation from
      an SRO. These are public disclosures in Form ADV Part 1A that Farther has not
      publicly explained; they affect less than 2.0%, 0.2%, and 0.1% of SEC-registered
      RIAs respectively. Their presence on a firm in a fundraising cycle does not necessarily
      indicate current operational risk (such disclosures may relate to historical
      affiliates), but the absence of a public management explanation is an information gap.


      A second adverse finding is the absence of publicly available information on: (a)
      any audited financial statements, (b) any cybersecurity incident or breach
      notification, (c) any SOC 2 or equivalent platform certification, (d) any client or
      advisor complaint history, and (e) any FINRA arbitration record. The absence of
      adverse evidence in public records is not the same as a clean record; for a firm with
      277 advisors and ~15,000 clients, the statistical probability of zero complaints or
      incidents is low, suggesting these records are either sealed in FINRA arbitration or
      genuinely absent. Publicly traded RIA comparables disclose audited financials,
      material incident history, and exam results; Farther's disclosure gaps are wider than
      would be acceptable for a firm seeking institutional capital at a $1 billion+ valuation.


      The valuation/funding claim is a third adverse signal: the post-money valuation of
      $1 billion+ represents approximately 62x regulatory AUM ($16 billion), a multiple
      that implies the market is pricing platform option value — not current cash flows —
      into the enterprise. At a 50-bps average advisory fee, $16 billion in AUM implies
      roughly $80 million in gross revenue. At a 25% operating margin (industry benchmark
      per InvestmentNews 2025 data), that implies ~$20 million in operating profit, making
      the unicorn valuation a 50x earnings multiple with no earnings confirmed. This
      premium is defensible only if the platform thesis is validated, advisor recruiting
      continues at current pace, and market conditions remain supportive — all of which
      represent execution risks that compound each other.
    claimRefs:
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
    figureRefs:
      - FR003

callouts:
  - calloutType: risk
    title: Form ADV Item 11 Disciplinary Alerts Require Explanation
    body: >-
      AdvisorSearch.org identifies three Form ADV Item 11 disciplinary alerts on Farther
      Finance Advisors: an Activity Restriction from an SRO (2.0% of firms), an
      Attorney/Accountant Authorization Revocation (0.2% of firms), and a Business License
      Revocation — SRO (0.1% of firms). None of these have been publicly explained by
      management. These are blocking diligence items: investors should demand the full
      Form ADV Part 1A, management written explanation of each disclosure, and legal
      counsel review before proceeding. The specific risk magnitude is unknown without
      this information.
    claimRefs:
      - CR003
      - CR004

  - calloutType: insight
    title: No Disclosed Enforcement Does Not Equal Clean Regulatory Record
    body: >-
      No SEC enforcement action, FINRA arbitration, or client complaint against Farther
      is identifiable in public sources. However, IAPD's online summary returns only
      minimal content (JS-only rendering), FINRA BrokerCheck covers broker-dealers
      not RIAs, and the full Form ADV Item 11 details are not in any publicly scrapable
      format. The absence of visible enforcement does not confirm a clean record; it
      confirms only that public sources are insufficient to verify the record.
    claimRefs:
      - CR044
      - CR045

  - calloutType: recommendation
    title: Five Blocking Diligence Asks Before Investment
    body: >-
      (1) Full Form ADV Part 1A including Item 11 management explanation. (2) Audited
      financial statements FY2023-FY2025 or equivalent management P&L with revenue, burn,
      and runway detail. (3) SOC 2 Type II or equivalent cybersecurity certification for
      the Intelligent Wealth Platform. (4) Advisor employment agreement template with
      non-compete, non-solicit, and client-ownership provisions clearly stated. (5) AUM
      transition schedule distinguishing regulatory AUM, in-transition, and pipeline to
      validate the $23 billion recruited-assets figure.
    claimRefs:
      - CR001
      - CR003
      - CR021
      - CR030
      - CR031

