sections:
  - id: s1
    title: Regulatory and Compliance Risk Environment
    body: >-
      Farther is a registered investment adviser under SEC CRD 302050, subject to the
      Investment Advisers Act of 1940, SEC examination, and a growing body of 2025-2026
      rulemaking. The SEC Division of Examinations 2026 fiscal-year priorities —
      documented by Goodwin Law, Grant Thornton, and SIA Partners — emphasize four areas
      directly relevant to Farther: (1) cybersecurity and Regulation S-P compliance,
      including the December 2024 amendments requiring incident response programs, 30-day
      breach notification, and vendor oversight; (2) AI disclosure accuracy ("AI-washing"),
      scrutinizing whether advisory firms' marketing materials accurately represent the
      extent and limitations of AI use; (3) AML/CFT program implementation following the
      FinCEN and SEC final rule requiring registered advisers to maintain formal AML
      programs, file Suspicious Activity Reports, and comply with recordkeeping requirements;
      and (4) fiduciary standards and conflicts of interest, including marketing rule
      compliance and off-channel communications recordkeeping.


      The most acute adverse finding in public records is AdvisorSearch.org's identification
      of three Form ADV Item 11 disciplinary alerts on Farther's public filing: an Activity
      Restriction from a Self-Regulating Organization (reported by approximately 2.0% of
      SEC-registered firms), an Attorney/Accountant Authorization Revocation (reported by
      approximately 0.2% of firms), and a Business License Revocation — SRO (reported by
      approximately 0.1% of firms). These disclosures appear in SEC Form ADV Part 1A,
      which covers legal and disciplinary history of the firm or its affiliates. The specific
      nature, timing, identity of the individual or entity involved, and current operational
      impact of these disclosures have not been publicly explained by Farther; they constitute
      a material diligence gap that must be resolved before any investment decision. Firms
      with these disclosure categories represent a small minority of SEC registrants, making
      their presence on a high-growth unicorn-stage RIA an anomaly requiring management
      explanation.


      Farther's rapid expansion — $5 billion in AUM at Series C (October 2024) to $16 billion
      in regulatory AUM and $23 billion in recruited assets by May 2026 — means the firm may
      cross thresholds that trigger additional regulatory obligations, including new-adviser
      exam priority classification, upgraded AML program requirements, and expanded Reg S-P
      obligations. The Willkie Farr 2026 regulatory update notes that the SEC continued to
      press firms on marketing rule compliance, cybersecurity incident response, and
      off-channel communications even under a more deregulatory posture. Quarles & Brady's
      2025 Form ADV update reminds advisers of AML/CFT final rule deadlines, Form 13F
      quarterly filing thresholds (crossed by advisers holding $100M+ in Section 13(f)
      securities), and annual Reg S-P brochure delivery obligations. The combination of
      rapid AUM growth and undisclosed disciplinary history creates regulatory risk above
      the industry baseline.
