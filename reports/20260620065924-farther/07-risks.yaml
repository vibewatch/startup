chapter:
  number: 7
  title: Risks
  summary: >-
    Farther's most material risks are regulatory compliance pressure under the SEC's
    2026 examination priorities (cybersecurity, AI-washing scrutiny, AML/CFT, Reg S-P)
    combined with three undisclosed Form ADV Item 11 disciplinary alerts whose specific
    nature, timing, and resolution are not publicly available. Legal liability from
    advisor recruiting is elevated by recent court rulings invalidating overbroad
    non-compete and non-solicit clauses, and by the industry-wide precedent of bulk
    client-data transfer disputes. Operational and financial risks — a single-stack
    platform with no disclosed SOC certifications, fixed W-2 cost structure exposed to
    market drawdowns, and a $1B+ unicorn valuation with no audited financials — round
    out a risk profile that is substantially higher than public evidence can fully
    characterize, requiring extensive data-room diligence before investment.

