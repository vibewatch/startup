        - Thesis softener — revenue model directly dependent on AUM trajectory
      - - Market cycle impact on revenue
        - S&P 500 sustained drawdown >20%; advisory fee revenue decline
        - Farther revenue decline > 15% with no disclosed cost reduction plan
        - Monitor burn rate impact; request updated runway calculation from management
      - - Co-founder departure
        - Public disclosure of Matthews or Genser role change or departure
        - Either co-founder leaves or reduces active operational role
        - Thesis break — investor scrutiny, advisor retention risk, potential down round
      - - Seidenstein FFO departure or AUM miss
        - FFO division AUM conversion from Seidenstein $1.5B Goldman book
        - AUM transferred < $500M within 18 months of hire OR Seidenstein departure
        - Thesis softener — signals FFO model not validated; Series D premium partly impaired
      - - Cybersecurity incident
        - Customer notification under Reg S-P 30-day breach notification requirement
        - Any breach notification to customers, or SEC examination finding on Reg S-P
        - Material risk event — monitor closely; may trigger SEC enforcement and client attrition
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR030
      - CR034
      - CR035
      - CR038
    notes: >-
      Kill criteria thresholds are analytical constructs for monitoring; they are not
      definitive investment rules. All triggers are monitorable from public sources except
      where noted as requiring management disclosure.

