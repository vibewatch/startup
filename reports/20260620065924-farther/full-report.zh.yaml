  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 理由
    rows:
      - - 建议
        - 跟踪
        - 增长轨迹和平台质量出色，但入场估值超过 $1B，且缺少经审计收入数据，无法给出有把握的买入判断；需要财务披露才能承保。
      - - 置信度
        - 中
        - 多个来源相互印证融资、AUM 和增长；但收入、利润率和股权结构不确定性高，限制了确信度。
      - - 风险评级
        - 高
        - AUM 倍数偏高、纪律处分事项未披露细节、管线 AUM 与已管理 AUM 的口径风险，以及超高速增长的执行依赖，共同构成高风险画像。
      - - 估值立场
        - 偏高
        - 估值约为已管理 AUM 的 6.7%，而 RIA M&A 常态为 1–3%，公司必须持续超高速增长且几乎没有容错；审计财务尚未支撑这一溢价。
      - - 决策含义
        - 跟踪并每 90 天复核；只有拿到管理账或收入披露后才启动正式尽调；若 AUM 倍数压缩，或财务证据支持 7–10× 远期收入估值，再重新校准为买入。
        - 对一家缺少财务基本面的独角兽阶段投资，采用标准入场纪律。
    notes: 建议仅反映可获得的公开证据。未接触审计财务、股权结构表或管理账；所有评估基于截至 2026-06-20 的公开备案、新闻稿和第三方报道。
