      - number: '6.5'
        title: 扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >
              Farther 的短期 AUM 增长过度依赖大型单次 wirehouse 扰动，而不是稳态有机招聘。Commonwealth LPL 收购触发一波 $1.7B；Goldman Sachs Personal
              Financial Management 退出带来 $649M；Ben Seidenstein 一人从 Goldman 带来 $1.5B。三项合计约 $4B recruited assets——约为当前 $15B
              AUM 的四分之一——且本质上来自两个机构的集中时间窗口。这使增长催化剂依赖持续的 wirehouse 扰动（M&A、费率变化、平台失败）。

              地理扩张叙事更分散：覆盖 51 个州，2025 年 Q2 招聘横跨 15 个州。SignalPoint 加深中西部覆盖；WMBC 锚定 California；Bell Tower 和 WealthFactor
              展示 Ohio 与 Oregon 触达。通过 Farther Family Office 向 UHNW 客户 land-and-expand，若现有顾问能把最富裕客户交叉推荐给
              FFO，将带来有意义的客单价升级。不过，这条路径尚未量化，FFO 也只是在 2026 年 4 月推出。

              顾问正式以「powered by Farther」子品牌运营（例如 SignalPoint、WMBC），这与完全 Farther 品牌顾问相比，形成不同的品牌关系。客户家庭认为自己是 Farther 客户还是
              SignalPoint/WMBC 客户，会影响流失建模；公开证据目前没有解决这一点。
