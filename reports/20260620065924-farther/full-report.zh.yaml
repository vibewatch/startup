      - number: '7.5'
        title: 负面研究发现与证据限制
        blocks:
          - type: paragraph
            body: >-
              本章的强制负面研究得出以下实质发现。最重要的负面发现，是 AdvisorSearch.org 识别出的三项 Form ADV Item 11 纪律警示——来自 SRO 的 Activity
              Restriction、Attorney/Accountant Authorization Revocation，以及来自 SRO 的 Business License Revocation。这些都是 Form
              ADV Part 1A 的公开披露，Farther 尚未公开解释；它们分别影响不到 2.0%、0.2% 和 0.1% 的 SEC 注册
              RIA。融资周期中的公司出现这些披露，不必然说明当前运营有风险（披露可能与历史关联方有关），但管理层没有公开说明，构成信息缺口。


              第二项负面发现，是公开渠道没有以下信息：（a）任何审计财务报表；（b）任何网络安全事件或泄露通知；（c）任何 SOC 2 或同等平台认证；（d）任何客户或顾问投诉记录；（e）任何 FINRA
              仲裁记录。公开记录里没有负面证据，不等于记录清白；一家有 277 名顾问、约 15,000 名客户的公司，投诉或事件为零的统计概率很低，说明这些记录要么封存在 FINRA 仲裁里，要么确实不存在。上市 RIA
              可比公司会披露审计财务、重大事件历史和检查结果；Farther 的披露缺口，已经超出一家以 $1 billion+ 估值寻求机构资本的公司通常可接受的范围。


              估值 / 融资主张是第三个负面信号：$1 billion+ 的投后估值约为监管 AUM（$16 billion）的 62 倍，这个倍数说明市场把平台期权价值——而非当前现金流——计入公司价值。按 50 bps
              平均咨询费率，$16 billion AUM 约对应 $80 million 总收入。按 25% 经营利润率（InvestmentNews 2025 数据中的行业基准）计算，经营利润约 $20
              million；在没有确认盈利的情况下，独角兽估值相当于 50x 盈利倍数。只有平台论点被验证、顾问招聘维持当前节奏、市场条件继续支持，这个溢价才站得住；而这些条件本身都会互相叠加执行风险。
