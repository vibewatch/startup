      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              对现有 Series D 投资者而言，Farther 近期最可信的流动性路径不是 IPO，而是战略
              M&A。公开股票市场目前要求金融科技公司具备成熟收入披露、审计财务，以及至少两到三年可证明的经营杠杆，才会给出超过 $1 billion 的估值。Farther 还没达到这条线。3–5 年 IPO 时间表符合
              GA 对成长期金融服务投资的典型持有期；公司当前轨迹——同比增长三倍，并建设面向 UHNW 客户的 Family Office 业务——说明若无不利冲击，到 2028–2029 年可能具备成功 IPO
              所需的运营画像。


              有强动机的战略收购方包括：美国大型银行（寻求独立 RIA 分销能力）、成熟 broker-dealer 或 wirehouse 网络（寻求技术现代化和有机增长人才）、大型 RIA
              聚合平台（寻求技术平台层，以差异化其整合 roll-up），以及国际财富管理机构（把 Farther 当作进入美国平台的入口）。General Atlantic 覆盖 20 个国家的全球网络，以及与
              Creative Planning 的既有关系，让它在有机增长持续时有条件推动 M&A 进程。


              论点破裂和否决触发项见下方 TV005。最终尽调要求（TV006）按证据缺口严重程度排序：Form ADV 纪律事项和缺少审计财务是阻断项；收入结构和 cap table
              结构是实质项；市场份额竞争定位属于信息项。任何以当前进入价格作出的投资决定，都必须以资本部署前获得阻断性尽调要求的满意答复为条件。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV039
              - CV042
              - CV043
