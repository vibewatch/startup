      - number: '4.2'
        title: AUM 和资产增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Farther 披露的资产历史，从创立时约 $1 billion 开始，随后沿着一系列与融资挂钩的里程碑上行。2024 年 10 月 Series C 交割时，公司报告 AUM 达 $5
              billion，约为上一年的 5x。到 2025 年 1 月，公司确认 AUM 为 $5 billion，并称 2024 年下半年又招募 23 名顾问。约 2025 年 7 月，公司宣布「recruited
              assets」超过 $13 billion——该指标明确定义为既包括已在管理的 AUM， 也包括未来数月计划加入的顾问预计带来的资产；这相当于较 2025 年初接近翻了两倍。


              2026 年 5 月 Series D 公告中，Farther 称自创立以来 recruited assets 达 $23 billion。AdvisorSearch.org 汇总 SEC IAPD 记录中的公司
              Form ADV 监管数据后显示，截至 2025 年初的数据抓取日，监管 AUM 为 $16.0 billion，持牌顾问 277 人，客户账户 14,965 个。$23 billion
              recruited-assets 口径与 $16 billion 监管 AUM 之间的 $7 billion 差距，来自几类因素：2025 年初至 2026 年 5 月的市场升值、Form ADV
              截图之后完成入职的新顾问，以及已承诺但尚未迁移完成的顾问客户资产管线。投资者必须把这两个指标视为本质不同的东西——recruited assets 是前瞻性管线指标，监管 AUM 则是受 SEC
              监管的已确认管理资产。


              2025 年 Inc. 5000 认可显示，Farther 三年收入增长约 11,968 percent，使其成为该测算期内美国增长最快的金融服务公司。该增长率由公司提交给 Inc.
              Magazine，未经独立审计；绝对收入基数没有披露，因此这个百分比虽很醒目，但无法换算成美元收入规模。
