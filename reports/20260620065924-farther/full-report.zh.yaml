chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和商业模式
        blocks:
          - type: paragraph
            body: >-
              Farther 是一家 AI 原生注册投资顾问（RIA），法律实体为 Farther Financial Advisors LLC，已在 SEC 注册，CRD 编号 302050。公司成立于 2019 年，并于
              2020 年 4 月公开推出，明确目标不是在旧系统上叠技术，而是从底层重建财富管理。其主要产品是 Intelligent Wealth
              Platform，一个专有的一体化生态，组合动态资产配置位置、税务智能投资组合管理、增强执行、AI 驱动洞察和私募市场准入。平台服务的客户横跨高收入个人、小企业、机构和超高净值家族；其中超高净值家族由 2026
              年 4 月推出的独立品牌 Farther Family Office（FFO）部门覆盖。


              Farther 通过仅收费的受托顾问模式变现。公司不设强制客户最低门槛，也不要求顾问签署竞业禁止协议，这是其有意区别于大型券商 和传统经纪交易商的地方。顾问以 W-2
              薪资员工身份受雇，同时获得公司股权和透明的分成结构。官网称，截至 2026 年 5 月，公司已招募资产达 $23B，并称平台让顾问有机增长达到行业平均的 3 倍，顾问约 90%
              的时间用于客户互动，而非行政事务。到 2025 年获得 Inc. 5000 认可时，Farther 三年收入增长约 11,968%，确认其为该期间美国增长最快的金融服务公司。


              公司采用多托管人平台，顾问可在不同托管人之间灵活选择，同时向客户呈现统一技术栈。多份公司和投资方资料把创立动机表述为：千禧一代未来十年将继承 $25T 财富，而 1970
              年代建成的旧系统不足以处理现代金融复杂度，例如创业公司股权薪酬和社会责任投资。
