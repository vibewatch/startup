      - number: '4.6'
        title: 财务结论与尽调议程
        blocks:
          - type: paragraph
            body: >-
              Farther 的收入模型在结构上质量较高——经常性、与 AUM 挂钩，且没有冲突性佣金结构——但无法独立验证。$16 billion 监管 AUM 和隐含的每年 $80–$160 million
              顾问收入，是公开可得财务信号中最可靠的部分；即便如此，该区间的置信度仍低，因为实际费率表、payout ratio 和顾问生产力分布都未披露。recruited assets（$23 billion）与监管
              AUM（$16 billion）之间的差距，要求买方在按更高数字 underwriting 之前，拿到管线资产与已管理资产的确认拆分。


              $1 billion+ 独角兽估值，意味着市场给予了远高于传统 AUM 倍数 RIA 估值的技术平台溢价。按 $16 billion 监管 AUM 计算，隐含 price-to-AUM ratio 为
              6–7x，而典型 RIA M&A 倍数为 AUM 的 2–3 percent，说明市场定价的是技术平台，而非传统顾问公司。若 Farther
              的技术确实能在规模化后提升顾问生产力和客户结果，这一估值可以辩护；但它对招聘和迁移管线的执行风险高度敏感。七年内四轮机构融资，且规模从 Series C（$72 million）加速到 Series D（$150
              million），显示公司采用增长资本模型，在达到盈利前很可能还要继续融资。


              五个阻断性尽调事项是：(1) FY2023–FY2025 经审计财务报表，(2) 费率表和实际平均顾问费率，(3) 月度 burn rate 和当前现金余额，(4) recruited assets 与监管
              AUM 的拆分及迁移率数据，(5) 完整 Form ADV Part 1A，包括两项 SRO 和 attorney/accountant 监管披露的性质。拿到这些材料之前，收入质量、利润率前景和资本 runway
              都无法独立 underwriting。
