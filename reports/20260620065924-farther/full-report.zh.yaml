      - number: '3.3'
        title: 既有平台提供商：Envestnet、Tamarac 和 Advisor360°
        blocks:
          - type: paragraph
            body: >-
              Envestnet 是主导性的财富科技既有玩家，截至 2025 年中支持约 $6.5T 资产、超过 2,000 万个账户。其 2025–2026 战略路线图横跨税务感知交易、顾问控制增强、自动化和生态集成，覆盖
              Envestnet 企业平台和 Envestnet Tamarac；后者专门服务独立 RIA，提供集成投资组合管理、再平衡、计费和 CRM。Envestnet
              自称是「行业连接度最高、最可定制的财富管理平台」。Envestnet 路线图释放出对 AI 原生新进入者价值主张的直接竞争回应：规模化个性化、AI 驱动客户洞察和更深的工作流自动化。不过，Envestnet 的
              B2B 分销模式意味着其创新必须穿过既有顾问公司关系，而不是用来招募个别顾问。这道分销护城河让 Farther 免于把 Envestnet 当作直接顾问招募竞争者，但同时也限制了 Farther 取代
              Envestnet 企业客户群的能力。Cerulli 认为，独立 RIA 渠道是第三方软件供应商增长最快的可服务机会之一，Orion 和 Envestnet 是该支出的主要受益者。已经使用 Envestnet 或
              Orion 的公司若要转向 Farther 中心栈，会面临有意义的切换成本——投资组合数据迁移、集成和客户门户访问都不是小障碍。Advisor360° 2025 Connected Wealth Report
              发现，顾问换公司的首要自述原因是想要更好的技术；这说明 Farther 提供的技术差异化，正是既有玩家最急于复制的资产。
