            body: >-
              Farther 于 2026 年 5 月 21 日完成 General Atlantic 领投的 $150M Series D，该轮融资确认其独角兽地位。CapitalG（Alphabet
              的独立成长基金）、Bessemer Venture Partners、Cota Capital 和 MassMutual Ventures 等既有投资方与 General Atlantic 一同参投。Series
              D 公告提到已招募资产超过 $23B，并将该轮融资表述为帮助 Farther 自 2025 年一季度以来实现同比增长三倍。General Atlantic 董事总经理兼全球金融服务负责人 Paul
              Stamas，以及副总裁 Laura Chen 均出现在官方材料引述中，显示领投方参与度较高。


              前一轮融资是 2024 年 10 月完成的 $72M Series C，由 CapitalG 和 Viewpoint Ventures 共同领投；当时公司 AUM 已超过 $5B，投后估值为
              $542M。CapitalG 普通合伙人 Jesse Wedler 在 Series C 材料中称，其投资前进行了多年评估。更早的种子轮、Series A 和 Series B
              在可得公开来源中未披露细节；任务上下文隐含 Series C 前合计约 $50M。截至 2026 年 5 月，公司全生命周期累计融资超过 $272M。准确投资方持股比例和完整资本结构表仍未公开。


              有一个差异值得注意：Built In NYC 将 2026 年 5 月融资描述为「Series F」，而 Farther
              自有新闻稿、AdvisorHub、WealthManagement.com、Fintech.Global 和其他主流媒体均统一称其为 Series D。Built In 文章中的 Series F
              标签看起来是编辑错误，不应视为事实。后续章节应以 Series D 作为标准轮次标签。
