      - number: '3.2'
        title: 技术原生 RIA 平台：Altruist、Orion 和 Savvy Wealth
        blocks:
          - type: paragraph
            body: >-
              Altruist 是专为独立顾问打造的全服务托管人与 RIA 平台。它提供数字开户、投资组合再平衡、通过简化模型实现的直接指数化 和模型市场，将自己定位为 Schwab、Fidelity 等传统托管人在小型
              RIA 场景下的降本替代方案。2025 年末，Altruist 推出税务管理套件 TaxIQ，并引入名为 Review & Release 的智能再平衡功能，进一步进入 Farther
              以税务智能回报为核心的价值主张。Altruist 的结构性优势在于托管人身份，这是 Farther 所没有的；想独立经营 RIA 且不希望依赖 Schwab 或 Fidelity 托管关系的顾问，可以在
              Altruist 上一站式完成。不过，Altruist 不包含顾问服务，也不以 W-2 形式招募顾问。Orion 经营十二个互联产品，分布在三类功能集群：交易和运营（投资组合会计、合规、风险智能）、数据和
              AI（Denali Data Layer、Denali AI、Strategic Insights）以及客户关系（Redtail CRM、客户门户、顾问门户）。Orion 称，2025 年其客户的有机增长比非
              Orion 公司快近 40%。Orion 的 Denali AI 被定位为企业级 AI，可在互联系统中放大顾问影响力——这与 Farther 的 AI 原生主张存在直接能力重叠。按顾问人数看，Orion 的
              Redtail CRM 曾是行业采用率最高的顾问 CRM，但其市场份额在 2021 至 2025 年间从约 46% 降至 26%，Wealthbox（22% 份额）和 Advyzon（12%
              份额）同期获得增长。Savvy Wealth 报告约 $5B AUM 和 100 多名顾问，并提供一体化平台，包含 AI 驱动 CRM、数字入驻、合规卸载和内部营销团队。Savvy 每周最多节省 19
              小时工作流的说法，与 Farther 减少行政负担的宣传相呼应；其品牌灵活模式（顾问可在 Savvy 的 RIA 实体下运营，也可使用自有品牌）瞄准同一批出走型顾问。Savvy 是风投支持的新进入者中与
              Farther 最直接的类比对象。
