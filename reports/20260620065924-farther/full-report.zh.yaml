      - number: '5.3'
        title: Farther Asset Management 与投资能力
        blocks:
          - type: paragraph
            body: >-
              Farther Asset Management（FAM）是平台自有投资管理层，由首席投资官 Nick Panitsas 领导。FAM 通过 Intelligent Wealth Platform
              独家提供一组解决方案：税务敏感的模型组合、精选私募市场投资和动态税务驱动策略。这种垂直整合——RIA 同时控制投资产品层——使 Farther 区别于那些完全依赖第三方模型市场（如 Orion 或
              Envestnet 提供的市场）的典型 RIA。


              私募市场准入被重点营销给顾问和客户，作为可投资范围的扩展。Series D 公告把它列为一项关键平台功能，可带来「组合分散化和提升回报潜力」。RIABiz 对 Farther Family Office
              的报道显示，Ben Seidenstein 选择 Farther 的一个具体原因，是平台能在运营上处理私募投资配置——这是大型托管方仍受规模审查要求约束的领域。私募市场产品的实际 sourcing
              pipeline、筛选方法、最低投资门槛和费率结构均未公开披露，构成重大尽调缺口。


              Direct indexing 被列为可通过 FAM 获得的能力，但没有独立评测披露最低账户规模、指数范围或税损收割方法。Farther Asset Management 的 Form ADV（若独立于
              Farther Finance Advisors LLC）未在公开 IAPD 记录中找到，投资管理方法、基准构建和历史业绩也不可公开获得。竞争对手 Altruist 于 2025 年推出自己的 Direct
              Indexing 产品，并具备模型市场透明度，抬高了顾问可独立评估的比较门槛。
