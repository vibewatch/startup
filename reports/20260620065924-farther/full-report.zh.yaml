      - number: '8.6'
        title: 附件
        blocks:
          - type: callout
            title: 建议 — 跟踪（升级条件：披露审计收入）
            body: >-
              Farther 展现出异常快的增长速度，平台溢价论点也可信；但在没有审计收入的情况下，>$1B 进入估值、未披露解释的 Form ADV 纪律事项，以及 $8B 待转入资产与管理 AUM
              的缺口叠加在一起，使当前水平无法给出有把握的买入判断。更有纪律的结论是跟踪：按季度监测 AUM 增长，只有收到管理账后才启动正式尽调；若（a）审计收入超过 $50 million，且有可信路径支撑 10×
              倍数，（b）三项 ADV Item 11 警示得到令人满意的解释，（c）按管理 AUM 计算的 AUM 倍数压缩到 4–5%，再升级为买入。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV016
              - CV029
          - type: callout
            title: 关键对抗性信号 — Form ADV 纪律披露
            body: >-
              AdvisorSearch.org 展示的 Farther Form ADV 显示三项 Item 11 纪律披露——来自 SRO 的 Activity Restriction（2.0%
              的公司）、Attorney/Accountant Authorization Revocation（0.2% 的公司），以及 Business License Revocation — SRO（0.1%
              的公司）。这些类别对任何注册投资顾问都很少见，对一家独角兽阶段、VC 支持的 RIA 更是高度异常。公司尚未公开解释。这是阻断性尽调事项：没有管理层书面解释和法律审查，不应推进投资。
            calloutType: risk
            claimRefs:
              - CV029
          - type: callout
            title: 关键假设 — 平台溢价支撑 AUM 倍数
            body: >-
              整个估值分析都建立在一个假设上：相对纯 AUM 咨询公司，Farther 能获得技术平台溢价；这与 PE 支持的 wealthtech 公司按 AUM 的 5–12% 交易、而非 RIA-M&A 通常 1–3%
              的水平一致。基于现有证据，这个假设合理，但没有收入数据无法验证。若 Farther 在管理 AUM 上的收入 yield 低于 25bps，10× 收入倍数将意味着估值低于 $500 million——低于当前
              Series D 标记。
            calloutType: assumption
            claimRefs:
              - CV013
              - CV025
              - CV032
