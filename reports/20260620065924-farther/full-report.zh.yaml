      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              为 Farther 搭可比公司组，需要区分三套参考框架：纯 AUM RIA 倍数（适用于存量客户账本部分）、接近 SaaS 的平台倍数（适用于技术基础设施）、以及 PE 支持的 wealthtech
              成长期融资轮（作为私募市场参照最直接）。没有单一框架能完整捕捉 Farther 的混合模式，缺少收入数据也让标准 EV/ARR 或 EV/Revenue
              交叉校验无法进行。可比表中的所有数字都来自公开披露或第三方报道；估算项均已标注。


              最直接可比的私募交易，是 Altruist 近期 $152 million 融资，由 GIC 领投，Salesforce Ventures、Baillie Gifford、Geodesic 和 ICONIQ
              参投。投后估值未公开披露，但行业报道此前曾把 Altruist Series F 的投前估值放在 $1.0–1.5 billion 区间。Altruist
              不是咨询平台，而是托管机构，因此比较并不完美；但两家公司都是技术原生公司，争夺同一批成长导向的独立顾问。


              聚合平台一侧，Focus Partners Wealth（原 Focus Financial Partners，后由 KKR 和 CI Financial 私有化）代表 PE
              支持聚合模式的规模终点，但结构上不同于 Farther 的有机招聘路径。General Atlantic 对 Creative Planning 的投资提供了另一个数据点：Creative Planning
              管理约 $50 billion AUM 时，GA 对其进行战略少数股权投资；隐含倍数未公开披露，但 GA 持续参与，说明其对 RIA 板块成长期倍数有信心。


              上市财富管理可比公司（LPL Financial、上市时期的 Focus Financial Partners、Envestnet、SEI Investments）按 AUM 的 1–4% 和收入的 1–3×
              交易——但这些都是成熟、多元化业务，不是超高速增长平台。Mercer Capital RIA 估值博客指出，随着 PE 资本寻找基于经常性费用的收入流，买方 / 卖方溢价已经扩大；行业整合速度（2025 年
              377 笔交易、$2.5T 被收购资产）也确认，私募市场对规模阶段 RIA 资产需求强劲。投资 KPI 图（FV004）从关键投资者维度给 Farther 打分，形成可直接提交 IC 的快照。
            claimRefs:
              - CV013
