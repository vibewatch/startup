      - number: '1.2'
        title: 创始人、领导团队和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Farther 由 Taylor Matthews 和 Brad Genser 共同创立。Matthews 担任 CEO，常驻旧金山；此前他在 ForUsAll 领导团队任职，曾帮助 AUM 在两年内从 $25M
              增至近 $1B。Genser 担任 CTO，2014 至 2019 年曾任 Goldman Sachs 副总裁，并在那里创立和领导专注私人财富管理的 AI
              团队。投资方画像和公司材料反复强调，两人的互补背景——Matthews 负责偏分销的运营，Genser 负责 AI/ML 技术架构——构成 Farther 技术优先论的基础。


              官方公司材料列出的现任领导团队包括 David Kilin（CFO）、Thor Gould（全球负责人，Farther Advisors——2025 年中被任命为董事总经理）、Ben
              Seidenstein（全球负责人，Farther Family Office——2026 年 4 月从 Goldman Sachs 加入，过去 13 年管理超过 $1.5B 客户资产）、Chris
              Powers（首席合规官）、Nick Panitsas（首席投资官，Farther Asset Management）、Megan Bailey（增长负责人副总裁）、Nicholas
              Corvino（人力负责人副总裁）、Cara Williams（顾问和客户体验副总裁）以及 Kate Gordon（业务运营负责人）。2025 年中，Farther 还任命 Bryan D'Alessandro
              和 Tim Bohnett 与 Gould 一同担任董事总经理，释放出在顾问成功职能上进行机构化建设的信号。


              关键人集中度很高。Taylor Matthews 掌控战略方向，是融资和招募叙事的主要公开面孔，似乎也维系着与主要投资者群体的核心关系。Brad Genser 掌握技术路线图，而该平台正是 Farther
              最主要的竞争差异化来源。任一创始人离开都会构成严重尽调风险。来自 Goldman Sachs 的 Seidenstein 虽然增强了团队深度，但也让新推出的 FFO 业务产生了一定关键人依赖。
