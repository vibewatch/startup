  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规风险环境
        blocks:
          - type: paragraph
            body: >-
              Farther 是 SEC CRD 302050 下的注册投资顾问，受 1940 年 Investment Advisers Act、SEC 检查以及 2025–2026 年不断增加的规则制定约束。SEC
              Division of Examinations 2026 财年重点——由 Goodwin Law、Grant Thornton 和 SIA Partners 记录——强调四个与 Farther
              直接相关的领域：(1) 网络安全和 Regulation S-P 合规，包括 2024 年 12 月修订要求的事件响应程序、30 天泄露通知和供应商监督；(2) AI
              披露准确性（「AI-washing」），审查顾问公司的营销材料是否准确呈现 AI 使用范围与局限；(3) AML/CFT 计划实施，依据 FinCEN 和 SEC 最终规则，注册顾问必须维持正式 AML
              计划、提交 Suspicious Activity Reports，并遵守记录保存要求；(4) fiduciary 标准和利益冲突，包括营销规则合规和 off-channel communications
              记录保存。


              公开记录中最尖锐的不利发现，是 AdvisorSearch.org 在 Farther 公开申报中识别出的三项 Form ADV Item 11 纪律警示：来自 Self-Regulating
              Organization 的 Activity Restriction（约 2.0% SEC 注册公司报告）、Attorney/Accountant Authorization Revocation（约 0.2%
              公司报告）以及 Business License Revocation — SRO（约 0.1% 公司报告）。这些披露出现在 SEC Form ADV Part
              1A，覆盖公司或其关联方的法律与纪律历史。Farther 尚未公开解释这些披露的具体性质、发生时间、涉及个人或实体身份以及当前运营影响；它们构成重大尽调缺口，必须在任何投资决策前解决。带有这些披露类别的公司只占
              SEC 注册机构中的少数，因此它们出现在一家高增长、独角兽阶段 RIA 身上，是需要管理层解释的异常信号。


              Farther 快速扩张——从 Series C（2024 年 10 月）时 $5 billion AUM，到 2026 年 5 月 $16 billion 监管 AUM 和 $23 billion
              recruited assets——意味着公司可能跨过触发额外监管义务的门槛，包括新顾问检查优先分类、升级 AML 计划要求和扩大 Reg S-P 义务。Willkie Farr 2026
              监管更新指出，即便在更偏放松监管的姿态下，SEC 仍继续在营销规则合规、网络安全事件响应和 off-channel communications 方面施压。Quarles & Brady 2025 Form
              ADV 更新提醒顾问关注 AML/CFT 最终规则期限、Form 13F 季度申报门槛（持有 $100M+ Section 13(f) 证券的顾问会跨过该门槛）以及年度 Reg S-P brochure
              交付义务。快速 AUM 增长与未披露纪律历史叠加，使监管风险高于行业基线。
