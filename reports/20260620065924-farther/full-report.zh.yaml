      - number: '5.2'
        title: 核心产品模块与顾问—客户工作流
        blocks:
          - type: paragraph
            body: >-
              Farther 平台在顾问端和客户端提供七个公开展示的产品模块。税务执行套件最突出：持续 tax-loss harvesting（TLH）全年运行，而不是只在年底操作；复杂的 asset location
              会在应税和税优账户层级之间策略性配置资产，以降低整个家庭的税务拖累。透明的税务影响计算器在任何交易执行前向客户展示预计税务结果，支持顾问与客户协同决策。个性化组合排除项能防止非预期交易（例如集中持有雇主股票），同时不牺牲分散化。自动再平衡器持续维持目标配置，并持续捕捉额外税损收割机会。


              顾问运营侧，CRM 集成模块提供从潜客到客户的完整生命周期视图；CX & Ops Tasks
              则把入站服务请求和顾问邮件转成结构化、按优先级排序的工作项，并由人工支持团队兜底。迁移提案工具降低从原托管方转入资产的行政负担。财务规划模块把客户的全部资产、负债和账户纳入动态计划，并随时间调整。顾问还可使用个性化营销页面、集中化材料库和增强的获客工具。


              客户端门户提供整合的财务仪表盘、文档存储、安全沟通和协作空间，可与 CPA、律师和家庭成员共享。Farther 网站还展示了 generational wealth planning
              服务线，为多代际客户把完整金融生态（顾问、家庭成员、法律专业人士、账户）协调到一个集成视图中。
