      - number: '2.5'
        title: 规模测算缺口、矛盾估计和尽调问题
        blocks:
          - type: paragraph
            body: >-
              四个重大规模测算缺口限制了本市场分析的精度。第一，没有公开来源披露独立 RIA 渠道的总顾问费收入；$107B–$179B 估算来自 AUM 和费率假设，而非实测数据。这是建模 Farther
              收入潜力时最重要的缺口。第二，Farther 的 SAM 未被公开划定：公司未披露目标顾问数、单顾问目标 AUM、内部产能模型或顾问管线转化率。第三，RIA M&A 整合对出走型 顾问池的影响并不明确——随着
              PE 支持的大型平台吸收中端 RIA，可触达的出走型招募池可能收缩。第四，公开来源中没有针对 Farther 阶段一体化 RIA 平台的单顾问收入或利润率基准。


              两个常被引用的数字造成市场规模混淆。InvestmentNews 将 RIA 市场描述为「接近 $4T 关口」的标题，具体指估算的 M&A 收购管线——即顾问退休和出走型 AUM
              中可供整合方收购的资产——并非总渠道 AUM。Cerulli 对 66,000+ 顾问退出对应 $3.9T 可收购 AUM 的估计，是交易流指标，不是渠道规模。Dakota 的 $14.3T 与 SEC 的
              $146T 测量的是完全不同边界（仅独立 RIA 对比全部注册顾问），不能当作同一市场的替代估计来比较。


              Farther 自有「已招募资产」指标（$23B）包括仍在原托管人处、正在转移或待转移的资产，而 SEC IAPD 报告的约 $16B AUM 反映实际管理资产。约 $7B
              的差距对收入运行率估算很重要。尽调应厘清已招募资产在 12 个月内转化的比例、每转化美元的平均收入，以及管线流失率。
