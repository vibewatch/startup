      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景区间很宽，更多反映财务披露缺失，而不是 Farther 业务质量本身存在真实不确定性。三种情景都假设核心运营模式完好：由平台驱动的财富管理，配套 AI-native
              工具和招募来的顾问。主要摆动变量是：（a）AUM 到收入的转化率；（b）已招募资产变成可收费管理 AUM 的速度；（c）固定技术成本随顾问基数扩大而摊薄后的经营杠杆；（d）IPO 或 M&A
              时市场给出的退出倍数。


              牛市情景要求管理 AUM 在 30 个月内达到 $50–60 billion（由当前招聘动能、Family Office UHNW 流入和市场升值驱动），约 50 bps 的 AUM 费率在 2028 年中前产生
              $250–300 million 总收入，并且 IPO 或战略收购按 10–15× 远期收入给平台定价——对应 $2.5–4.5 billion 退出。General Atlantic
              把金融服务公司从独角兽推向公开市场的过往记录（Creative Planning 定位）支持这条路径的可行性。


              基准情景假设 AUM 增长更保守（2027–2028 年达到 $35–45B），市场倍数部分压缩至 7–10× 收入，对应 $1.5–2.5 billion 区间估值。对短期投资者而言，以当前估值 1–2×
              的水平通过 M&A 出售给大型银行、broker-dealer 或 RIA 聚合平台，仍是最可能的流动性事件。


              熊市情景反映的是：竞争压力、顾问流失或 20–30% 市场回撤导致 AUM 增长停滞，同时纪律事项处理触发监管整改成本。在这种情景下，公司需要在 $1B 标记以下进行后续融资——即 down round——GA
              领投的财团会面临实质减记风险。触发敏感性图（FV002）展示 AUM 增长和收入 yield 假设如何改变预期估值结果。区间图（FV003）在明确假设下映射低 / 基准 / 高退出结果。
