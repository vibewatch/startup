      Farther 从创立（零 AUM）到 2026 年 5 月 Series D 的 AUM / 招募资产里程碑，显示 2024 年以来增长明显提速。
    data:
      items:
        - label: 2020 年 4 月（创立）
          value: 0
        - label: 2023 年中
          value: 375
        - label: 2024 年 10 月（$5B）
          value: 5000
        - label: 2025 年 2 月（$16B SEC）
          value: 16000
        - label: 2026 年 5 月（$23B 招募资产）
          value: 23000
    approximationNotes: >-
      数值单位为 USD millions。“2026 年 5 月”反映 Series D 公告中的招募资产（AUM + 管线）——不等同于已结算托管 AUM。farther.com 2026 年 1 月的 $15B 数据和 2025
      年 2 月 SEC $16B 数据可能反映不同计量日期 / 纳入口径。
    claimRefs:
      - CU008
      - CU009
      - CU013
      - CU041
  - id: FR001
    title: Farther 风险热力图——可能性 vs. 剩余严重性
    type: matrix
    layout: wide
    summary: 按严重性排序的风险，以可能性（高 / 中 / 低）和已知缓释后的剩余严重性绘制；缓释成熟度反映当前控制措施的成熟程度。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: Form ADV Item 11 披露（SRO 限制；律师 / 会计师资格撤销）
          values:
            - 高
            - 严重
            - 无——尚未解释
            - 严重
        - label: 数据安全 / Reg S-P 合规（事件响应；违规通知）
          values:
            - 高
            - 严重
            - Unknown
            - 严重
        - label: AML / CFT 项目建设（FinCEN 最终规则；SAR 申报；客户尽调）
          values:
            - 高
            - 高
            - 低
            - 高
        - label: SEC 对 AI-washing 的审查（营销主张 vs. 平台现实）
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 顾问法律责任（数据可携带性；竞业限制可执行性）
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 市场周期 / AUM 收入敏感性（20-25% 股票回撤）
          values:
            - 中
            - 高
            - 低（固定成本基础）
            - 高
        - label: 平台运营集中度（单一栈；未披露 BCP）
          values:
            - 中
            - 高
            - Unknown
            - 高
        - label: 估值 / 后续融资（$1B+ 独角兽；无盈利路径）
          values:
            - 中
            - 中
            - 低
            - 中
        - label: 创始人 / 领导层依赖（Matthews、Genser、Seidenstein）
          values:
            - 低（短期）
            - 高
            - 低
            - 中
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR013
      - CR021
      - CR030
      - CR033
      - CR034
      - CR038
    approximationNotes: 可能性和剩余严重性估算是分析师基于监管指引、行业先例和 Farther 特定披露作出的判断；没有精算数据。缓释成熟度只根据公开信息评估。
  - id: FR002
    title: 风险传导图——风险如何流向收入、客户与资本
    type: dag
    layout: wide
    summary: 有向无环图展示从根因到收入、客户留存和资本获取影响的主要传导路径。
    data:
      nodes:
        - id: reg_enforcement
          label: 监管执法（SEC / FinCEN）
          detail: 由 AML 不合规、Reg S-P 失效、AI-washing 或非官方渠道记录缺口触发
        - id: form_adv_disclosures
          label: Form ADV Item 11 披露
          detail: 三项未披露的纪律警示；具体性质和影响未知
        - id: data_breach
          label: 客户数据泄露
          detail: 邮箱账户接管；未授权电汇；约 15K 名 HNW 客户 PII 暴露
        - id: market_downturn
          label: 股票市场下行（>20%）
          detail: AUM 按比例下降；费用收入下滑；固定 W-2 成本不变
        - id: advisor_departure
          label: 高级顾问 / 创始人离职
          detail: Matthews、Genser 或 Seidenstein 离职；账簿或平台连续性受损
        - id: aum_revenue
          label: 基于 AUM 的收入下降
          detail: 收入随 AUM 下降；费用缺少多元化；按 $16B 估算为 50-100 bps
        - id: client_attrition
          label: 客户与顾问流失
          detail: 泄露或执法侵蚀信任；顾问账簿转投竞争对手
        - id: capital_access
          label: 后续资本获取受损
          detail: 降估值融资或 Series E 受阻；迫使成本削减或加速 M&A 退出
        - id: valuation_impairment
          label: 独角兽估值受损
          detail: AUM 倍数压缩；收入不达预期；监管折价压低企业价值
      edges:
        - from: form_adv_disclosures
          to: reg_enforcement
          label: 未解决历史提高检查概率
        - from: reg_enforcement
          to: client_attrition
          label: 执法触发声誉损害
        - from: reg_enforcement
          to: capital_access
          label: 执法让投资者观望
        - from: data_breach
          to: reg_enforcement
          label: 泄露触发 SEC Reg S-P 执法
        - from: data_breach
          to: client_attrition
          label: PII 暴露造成直接客户流失
        - from: market_downturn
          to: aum_revenue
          label: AUM 到收入 1:1 传导
        - from: aum_revenue
          to: valuation_impairment
          label: 独角兽估值下收入倍数压缩
        - from: aum_revenue
          to: capital_access
          label: 收入不达预期提高 Series E 风险
        - from: advisor_departure
          to: client_attrition
          label: 顾问账簿跟随离职顾问
        - from: advisor_departure
          to: aum_revenue
          label: 账簿流失直接减少 AUM
        - from: client_attrition
          to: aum_revenue
          label: 客户流失减少 AUM 和收入
        - from: valuation_impairment
          to: capital_access
          label: 降估值融资削弱用股权招募的能力
    claimRefs:
      - CR003
      - CR009
      - CR016
      - CR025
      - CR030
      - CR031
      - CR034
      - CR037
      - CR042
    approximationNotes: 传导图反映从监管指引、行业先例和财务模型分析提炼的定性联系；不对概率建模。
  - id: FR003
    title: Farther 依赖地图——关键外部依赖与失效场景
    type: dag
    layout: wide
    summary: |
      依赖地图展示 Farther 对外部监管机构、托管方、资本提供方和技术基础设施的依赖，并估算可替代性。
    data:
      nodes:
        - id: farther_core
          label: Farther Finance Advisors（RIA）
          detail: SEC CRD 302050；277 名顾问；$16B 监管 AUM；San Francisco / 多州
        - id: sec_finra
          label: SEC 和 FINRA / FinCEN
          detail: 主要监管方；检查权；AML / CFT 监督；Reg S-P 执法
        - id: schwab
          label: Charles Schwab Advisor Services
          detail: 重要顾问细分的主要托管方；清算和托管
        - id: fidelity_pershing
          label: Fidelity / BNY Pershing / Apex
          detail: 其他托管方；多托管方设置降低单点故障
        - id: general_atlantic
          label: General Atlantic（Series D 领投）
          detail: $150M Series D；战略性少数股权；此前为 Creative Planning 投资方
        - id: prior_investors
          label: CapitalG / Bessemer / Cota / MassMutual
          detail: Series A-D 轮参与方；影响董事会构成和治理
        - id: cloud_infra
          label: 云基础设施（未披露提供商）
          detail: 为 Intelligent Wealth Platform 提供计算和存储；身份未披露
        - id: advisor_pipeline
          label: 顾问招募管线（大型券商 / BD 出走）
          detail: AUM 增长全靠招募拉动；数据可携性存在法律责任
      edges:
        - from: farther_core
          to: sec_finra
          label: 已注册；检查义务；AML/CFT；Reg S-P 合规
        - from: farther_core
          to: schwab
          label: 多数顾问的主要托管方
        - from: farther_core
          to: fidelity_pershing
          label: 次要托管方；多平台带来运营复杂度
        - from: farther_core
          to: cloud_infra
          label: 平台托管；数据驻留；运行时长依赖（提供商未知）
        - from: farther_core
          to: advisor_pipeline
          label: AUM 增长完全取决于顾问招募流量
        - from: general_atlantic
          to: farther_core
          label: Series D 领投；战略性少数股权；未来资本通道
        - from: prior_investors
          to: farther_core
          label: 治理；Series E 参与权；董事会影响力
        - from: sec_finra
          to: farther_core
          label: Form ADV 披露和合规缺口带来执法风险
        - from: schwab
          to: farther_core
          label: 托管终止会迫使紧急迁移
    claimRefs:
      - CR001
      - CR015
      - CR019
      - CR025
      - CR031
      - CR036
      - CR038
    approximationNotes: 云基础设施提供商未公开披露，因此以通用节点呈现。托管方在总 AUM 中的占比为估算值；公开资料没有给出精确拆分。
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从规模证据、财务证据缺口和风险评估，推导到「跟踪」建议，并列出上调至「买入」的条件。
    data:
      nodes:
        - id: scale
          label: 规模证据
          description: $23B 招募资产；AUM 增长 5×；Inc. 5000 金融服务第 1 名
        - id: platform
          label: 平台溢价
          description: AI 原生自研技术栈；顾问迁移成本；GA 战略合作
        - id: missing
          label: 财务证据缺失
          description: 未公开披露经审计收入、利润率或现金头寸
        - id: risk
          label: 风险信号
          description: 3 项 Form ADV Item 11 警示；6.7% AUM 倍数高于 M&A 常规；管线口径存在基差风险
        - id: valuation
          label: 估值评估
          description: 当前入场价偏紧；承销前需要验证财务数据
        - id: recommendation
          label: 建议：跟踪
          description: 启动尽调；若经审计收入 >$50M 且增长 10x+，上调至买入
        - id: upgrade
          label: 上调条件
          description: 经审计财务可得；ADV 事项解释清楚；AUM 倍数压缩至 4–5%
    approximationNotes: 该流程是概念性逻辑链，不是因果模型。节点顺序反映各项证据在建议框架中的权重。
    claimRefs:
      - CV002
      - CV016
      - CV029
      - CV032
  - id: FV002
    title: 估值对 AUM 增长和费率收益率的敏感性
    type: bar
    layout: wide
    summary: 在不同 AUM 水平（$20B–$60B）和费率收益率假设（25bps–75bps）下，以 10× 收入倍数估算预期估值，展示未披露收费经济模型带来的宽区间。
    data:
      items:
        - label: $20B AUM / 25bps 收益率
          value: 500
          unit: USD million
          note: 10× × $50M 收入
        - label: $20B AUM / 50bps 收益率
          value: 1000
          unit: USD million
          note: 10× × $100M 收入
        - label: $20B AUM / 75bps 收益率
          value: 1500
          unit: USD million
          note: 10× × $150M 收入
        - label: $35B AUM / 25bps 收益率
          value: 875
          unit: USD million
          note: 10× × $87.5M 收入
        - label: $35B AUM / 50bps 收益率
          value: 1750
          unit: USD million
          note: 10× × $175M 收入
        - label: $35B AUM / 75bps 收益率
          value: 2625
          unit: USD million
          note: 10× × $262.5M 收入
        - label: $50B AUM / 25bps 收益率
          value: 1250
          unit: USD million
          note: 10× × $125M 收入
        - label: $50B AUM / 50bps 收益率
          value: 2500
          unit: USD million
          note: 10× × $250M 收入
        - label: $50B AUM / 75bps 收益率
          value: 3750
          unit: USD million
          note: 10× × $375M 收入
    approximationNotes: >-
      所有数值均为模型估算。AUM 分母采用管理 AUM（不是招募资产）。10× 收入倍数处于成长阶段 wealthtech 的中档；实际市场倍数将取决于退出时的盈利能力和增长率。费率收益率未知；25–75bps 区间覆盖 RIA
      顾问费的行业常规。
    claimRefs:
      - CV013
      - CV014
      - CV032
      - CV040
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: 以 >$1B Series D 入场估值为锚，给出熊市、基准和牛市情景下的低、中、高估值结果。
    data:
      items:
        - label: 熊市退出（2–3 年）
          low: 650
          mid: 800
          high: 950
          unit: USD million
          note: 降价轮；Series D 入场价的 0.65–0.95×
        - label: 基准退出 M&A（3–4 年）
          low: 1500
          mid: 2000
          high: 2500
          unit: USD million
          note: 战略出售；Series D 入场价的 1.5–2.5×
        - label: 牛市 IPO / 大型 M&A（4–6 年）
          low: 2500
          mid: 3500
          high: 4500
          unit: USD million
          note: 公开市场 / 高溢价战略交易；Series D 入场价的 2.5–4.5×
    approximationNotes: 回报倍数以 Series D 投后估值（>$1B）为基础。具体投资人的实际回报取决于入场价格、优先权结构以及后续融资带来的稀释——公开资料均未披露。
    claimRefs:
      - CV036
      - CV037
      - CV033
  - id: FV004
    title: 投资 KPI——IC 就绪评分
    type: kpi
    layout: standard
    summary: 按 1–5 分（5 = 最强）对 Farther 的七个投资维度打分，反映超常增长与结构性证据缺口之间的权衡。
    data:
      items:
        - label: 市场机会
          value: 5
          note: RIA 渠道 TAM >$4T；顾问出走有结构性顺风；UHNW 财富创造
        - label: 产品 / 技术差异化
          value: 4
          note: AI 原生自研平台形成迁移成本护城河；尚未确认 SOC 认证
        - label: 增长证明
          value: 4
          note: Series C 时 AUM 同比 5×；Inc. 5000 金融服务第 1 名；招募动能已确认
        - label: 收入质量 / 经济模型
          value: 2
          note: 没有经审计收入；费率收益率未知；AUM 到收入的转化未经验证
        - label: 治理 / 风险画像
          value: 2
          note: 3 项未披露 ADV Item 11 警示；没有经审计财务；股权结构不透明
        - label: 估值纪律
          value: 2
          note: 管理 AUM 倍数 6.7%，相对可比公司偏紧；管线与管理口径存在基差风险
        - label: 战略背书 / 退出路径
          value: 4
          note: GA 管理 $126B AUM，且有 wealthtech 记录；M&A 收购方池子很深
    approximationNotes: 评分是作者基于截至 2026-06-20 可得公开证据作出的判断。收入质量和治理评分受到私营公司披露限制的实质约束；若拿到经审计财务并解决 ADV 事项，评分会显著改善。
    claimRefs:
      - CV014
      - CV023
      - CV028
      - CV029
      - CV035
