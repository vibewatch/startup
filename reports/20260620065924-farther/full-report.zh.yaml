      - number: '7.2'
        title: 顾问招聘、法律责任与托管依赖风险
        blocks:
          - type: paragraph
            body: >-
              Farther 的增长模型本质上依赖顾问持续离开 broker-dealer 和 wirehouse 平台，并带来既有客户资产。这形成两个相互关联的法律风险向量：(1) 客户数据可携带性敞口，(2)
              non-compete / non-solicit 可执行性。


              数据可携带性方面，Ameriprise v. LPL Financial 争议具有代表性——Ameriprise 指控 LPL 使用 bulk-upload 工具，帮助顾问转移客户 Social Security
              numbers 和 account numbers。虽然 District Court 最终因实体仲裁即将开始而暂停法证设备搜索，但该案确认，招聘型公司可能因数据可携带做法而面临可观法律发现成本、声誉损害和
              FINRA 仲裁敞口。Farther 已从 Goldman Sachs、LPL/Commonwealth、Raymond James 和其他主要平台招聘；RIABiz 报道称，Farther 在招聘
              Goldman 顾问时「held its breath」，明确描述其意识到资源充足的 incumbent 公司可能进行法律报复。公开记录中尚未识别出针对 Farther 的实际诉讼，但结构性敞口重大且持续存在。


              non-compete/non-solicit 可执行性方面，2026 年 6 月 North Carolina Business Court 裁决（TMRW Wealth v.
              Abitz）有偏见地驳回了针对离职顾问的 non-competition 和 non-solicitation 主张，认定两项条款在适用法律下表面过宽。该裁决逻辑——non-solicitation
              条款不能触及员工实际未服务过的客户，non-compete 也只能限制与员工实际职责相同的工作——广泛适用于财富管理行业。Farther
              明确营销其不拿顾问收入流股权，并授予公司股权；但公司没有披露自身雇佣协议条款，也没有说明离职后客户限制（如有）依赖哪些安排。若 Farther 顾问协议包含过宽条款，可能不可执行，使客户资产在顾问离开时更脆弱。


              托管集中风险是相关依赖：Farther
              使用多家托管方（Schwab、Fidelity、Pershing、Apex）保管资产，因此若主要托管方发生平台宕机、托管费争议或关系终止，会扰乱部分顾问和客户群体的运营。Schwab 2025 RIA
              Outlook 数据显示，托管切换成本高，多托管迁移会造成扰动。公司没有公开披露备用托管方策略。
