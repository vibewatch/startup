      - number: '3.4'
        title: 顾问网络和整合方模式：Dynasty、Carson 与 Steward Partners
        blocks:
          - type: paragraph
            body: >-
              顾问网络整合方提供了不同于 Farther W-2 平台模式的选择：它们向希望独立但不想从零搭建自有 RIA 的顾问提供基础设施、合规、技术，有时还有股权或合伙经济性。Dynasty Financial
              Partners 支持了 OpenArc 出走；OpenArc 离开 Merrill Lynch 时管理约 $130B 资产，这是 Dynasty 支持超大型团队迁移能力的高知名度数据点。Dynasty
              的服务覆盖实体设立、投资运营、技术、合规和业务咨询。这一模式与 Farther 根本不同：Dynasty 顾问仍是独立主体，拥有自己的客户账本；Farther 顾问则是 W-2 员工，客户关系最终由
              Farther 实体拥有。经济取舍很清楚：Dynasty 顾问在出售时获得自己业务的完整企业价值，而 Farther 顾问用部分上行交换 Farther 平台股权参与和后台负担减轻。Carson Group
              经营带有合并公司股权权益的顾问合伙模式，Steward Partners 则作为与 Raymond James 关联的员工制 RIA 运营；两者都提供股权参与，直接竞争 Farther 的股权主张。Cerulli
              研究显示，RIA 整合方合计 AUM 已超过 $1.5T，并在组织结构和分销动态上开始接近经纪交易商，反映整合方模式走向成熟。Farther 的招募成功——2025 年全行业超过 11,000
              名顾问换公司，同比增长 16.2%——部分由这种结构性迁移驱动，也会受其反噬：任何把有吸引力经济性和更好技术结合起来的大型整合方，都会争夺同一批顾问候选人。
