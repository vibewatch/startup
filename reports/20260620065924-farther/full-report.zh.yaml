          - type: paragraph
            body: >
              Farther 的增长轨迹是独立 RIA 渠道中最激进的一类。2020 年 4 月上线时客户和 AUM 均为零；到 2023 年中，资产达到 $375M；到 2024 年底又增长 13x 至 $5B，约为上一年的
              5x。到 2026 年 1 月，farther.com 客户页显示 AUM 达 $15B；2026 年 5 月 Series D 公告则宣布 $23B「recruited assets」（更宽口径，包括 AUM
              以及入职管线中顾问预计带来的资产）。这一轨迹支撑了 Inc. 5000 将 Farther 评为美国三年收入增长 11,968%、排名第 #1 的最快增长金融服务公司。

              顾问人头是核心获客驱动。截至 2025 年 2 月，AdvisorSearch（来源为 SEC IAPD 数据）统计 277 名活跃顾问，服务 14,965 名客户，顾问 / 客户比例为 1:54，报告 AUM
              为 $16B。到 2026 年 4 月，管理层披露约 200+ 名财富管理人和约 19,000 名客户（InvestmentNews）。2025 年季度招聘节奏加快：2024 年 H2 新增 23
              名顾问，2025 年 Q2 单季从 15 个州新增 27 名顾问，Commonwealth LPL 扰动则在单次招聘浪潮中带来 16 名顾问、管理 $1.7B。Farther 称有机顾问增长为行业平均的
              3x，顾问 90% 时间从后台任务转向客户财富策略。这种平台效率是其从 wirehouse 招聘的核心价值主张。
