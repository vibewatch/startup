      - number: '2.2'
        title: 市场规模测算——TAM、SAM 和 SOM 的多重视角
        blocks:
          - type: paragraph
            body: >-
              三个测算视角都指向独立 RIA 机会。最宽的 TAM 是整个 SEC 注册投资顾问宇宙：2024 年，21,669 家顾问管理 $146T 监管 AUM，同比增长 12.8%。该数字包含远超 Farther
              模式范围的机构资产管理人、养老金顾问和银行信托部门，只能作为上限。


              运营上更相关的 TAM 是独立 RIA 渠道：按 Dakota Marketplace，截至 2025 年 12 月约 6,421 家公司跟踪 $14.3T AUM。按行业常见约 1.0%
              年顾问费率计算，可代理得到 $143B 年顾问费收入。对费率假设做敏感性分析，合理区间为 $107B–$179B（分别对应 0.75%–1.25%）。没有公开来源报告独立 RIA 渠道的总顾问费收入；该区间是由
              AUM 和费率推导的估算，应视为数量级代理，而非实测数字。近 70% 的独立 RIA 管理不足 $700M，却合计控制不到渠道资产的 9%；超过 $1B 的公司占公司数 22%，却控制总资产的
              88%——这种集中度有利于一体化平台。


              向前看，Cerulli Associates 预计管理账户资产将从 2024 年的 $13.7T（当年增长 19.8%）到 2028 年接近三倍，达到 $31.8T。按 Cerulli，高净值分段（$5M+
              可投资资产）预计到 2028 年将以约 9.3% CAGR 超过 $30T，这是与 Farther 全服务模式和 Farther Family Office 最相关的高端层级。Cerulli 还预计，独立 RIA
              渠道本身到 2028 年顾问人数增长 11.8%，是独立经纪交易商 4.7% 预计增幅的两倍多。


              Farther 的 SOM 锚定在 $23B 已招募资产（公司披露，2026 年 5 月）和约 $16B 已确认 AUM（SEC IAPD，2025 年 2 月）。对比独立 RIA 的 $14.3T
              AUM，Farther 当前渠道渗透率约 0.16%。Farther 的顾问产能——277 名持牌顾问，顾问与客户比例 1:54——才是近期 SOM 扩张的主要约束，而不是可服务客户池规模。
