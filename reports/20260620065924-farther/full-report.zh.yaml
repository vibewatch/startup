      - number: '2.4'
        title: 增长驱动、采纳约束和监管环境
        blocks:
          - type: paragraph
            body: >-
              独立 RIA 市场受益于复合结构性顺风。首要驱动是顾问流动性：Cerulli 预计独立 RIA 渠道到 2028 年顾问人数增长 11.8%，超过 IBD 4.7% 预计增幅的两倍；Schwab
              估计，行业未来五年需要 70,000 名或更多新员工，才能维持当前增长率。顾问出走由技术不满、经济偏好和未满足客户需求驱动：Cerulli 研究发现，91% 富裕客户希望顾问提供遗产规划，但只有 22%
              实际获得服务，这创造了 Farther 这类全平台 RIA 可填补的服务缺口。


              第二个驱动是财富积累。Cerulli 预计 $5M+ 家庭财富到 2028 年将以 9.3% CAGR 超过 $30T；管理账户 资产这一主要收费载体，预计将从 2024 年的 $13.7T 到 2028
              年接近三倍至 $31.8T。这些趋势扩大了综合平台上顾问的收入机会。2026 年的 SEC 监管环境增加第三股顺风：在 Atkins 主席领导下，SEC 已释放出放松监管、推动散户获得另类投资准入、促进 AI
              的优先方向——三者都利好 AI 原生、具备另类资产能力的 RIA 平台。


              三个结构性约束决定采纳速度。第一，费率压缩：机器人投顾和金融科技新进入者已经建立低于 50bps 的收费基准，挤压传统 1%
              顾问模式，并要求平台扩展服务来支撑溢价费率。第二，顾问切换成本：非招揽协议、离职协议风险、客户同意要求和托管人迁移摩擦，让转移在运营和法律上都很复杂——Goldman Sachs 对加入 Farther
              的前顾问仲裁就是具体例子。第三，资本强度：Farther 的 W-2 模式要求在顾问达到完整产能前先支付薪资，使单个招募成本高于竞争平台的 1099 承包人模式。AI 治理仍处早期：Schwab 2025
              年研究发现，只有 35% 的 RIA 公司有正式 AI 政策，57% 允许在无正式架构下探索 AI——这会拖慢 AI 原生平台优势的部署。
