  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与估值框架
        blocks:
          - type: paragraph
            body: >-
              Farther 于 2026 年 5 月完成 $150 million Series D，由 General Atlantic 领投。General Atlantic 是全球头部私募股权机构，截至 2025 年
              12 月 31 日，跨策略管理约 $126 billion。CapitalG、Bessemer Venture Partners、Cota Capital 和 MassMutual Ventures
              等既有投资者与新领投方一起参投。本轮把 Farther 投后估值推到 $1 billion 以上——官方新闻稿、RIABiz 报道、Fintech Global 和 Wealth Management
              杂志都独立确认了这个独角兽标记。公司自 2019 年创立以来累计股权融资随本轮达到 $272 million，超过 A 到 C 轮累计融资总额的两倍。


              估值演进给了一个有用锚点：2024 年 10 月由 CapitalG 领投的 Series C，在 $5 billion AUM 基础上给出 $542 million 投后估值——约相当于 AUM 的
              10.8%。到 Series D，Farther 披露已招募资产为 $23 billion（包括 $15 billion 管理 AUM，以及预计未来数月随顾问入职转入的约 $8 billion
              待转入资产）。仅按管理 AUM 计算，Series D 隐含倍数约 6.7%；按已招募资产计算约 4.3%。这两个指标都显著高于 RIA 行业 M&A 通常形成的 AUM 1–3%，说明市场承销的是
              wealthtech 平台溢价，而非传统咨询公司的倍数。


              整个估值分析受一个关键限制约束：Farther 没有披露审计收入、毛利率、EBITDA 或现金头寸。唯一经验证的收入信号是相对信号——Inc. 5000 排名按 2025 年收入把 Farther 列为总榜第
              #8、金融服务第 #1，反映三年收入增长约 12,000%。绝对收入分母未知，因此标准收入倍数方法（如
              EV/Revenue、EV/ARR）无法有信心地使用。这会拉宽情景区间，也要求投资者保持纪律：该估值是对增长延续的方向性押注，不是由多个财务倍数交叉验证出来的结果。
