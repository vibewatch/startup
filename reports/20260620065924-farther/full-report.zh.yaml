          tone: positive
        - id: advisors
          label: W-2 顾问网络（277+ 持牌）
          detail: 受薪顾问持有公司股权；90% 时间用于客户而非行政工作；来自 wirehouse 和 IBD，包括 Goldman Sachs。
          tone: positive
        - id: clients
          label: 客户基础（约 14,965 个账户）
          detail: 覆盖高收入个人、小企业、机构和 UHNW 家族；后者通过 2026 年 4 月上线的 Farther Family Office 服务。
          tone: neutral
