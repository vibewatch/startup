      - number: '6.4'
        title: 留存、满意度与耐久性缺口
        blocks:
          - type: paragraph
            body: >
              Farther 不披露 NPS、GRR、NRR 或顾问留存指标。对一家通过顾问招聘快速增长的早期 RIA
              平台而言，缺少公开耐久性数据是显著尽调缺口。核心风险是双向的：顾问流失（顾问把客户资产重新带走）和由顾问变化触发的客户家庭流失。Farther 自身的差异化政策——零 non-compete
              agreement——会放大两类风险，因为它拿掉了公司的一项关键留存杠杆。

              Farther 通过股权所有权（顾问获得 Farther 股权）、行业领先 payout 和带福利的 W-2
              雇佣结构，部分缓解顾问流失。股权成分尤其为顾问留下并提升其持股价值创造了财务激励。不过，公司没有公开披露 lockup period、vesting schedule 或 non-compete
              条款，因此这些留存机制无法独立验证。

              AdvisorSearch 在 Farther 的 Form ADV 申报中标记了纪律警示（2026 年 1 月 SEC 数据）：具体为公司或关联方层面的 SRO Activity Restriction 和
              Business License Revocation。这些不一定代表系统性合规失败，但属于未解决警示，尽调流程应追问——尤其考虑到该 RIA 快速增长，并同时管理来自多个 wirehouse
              渠道的客户资产，监管复杂度较高。
