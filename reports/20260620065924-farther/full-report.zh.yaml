  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：三层重叠
        blocks:
          - type: paragraph
            body: >-
              Farther 的竞争横跨三层结构不同但部分重叠的市场。第一层是技术原生 RIA 平台：这些公司从零搭建面向顾问的技术栈，并用技术区分顾问招募和客户服务主张。Altruist 和 Savvy Wealth
              是这一层最清晰的直接同业，两者都用一体化托管或运营能力和 AI 驱动工作流瞄准出走型 顾问。第二层是企业级财富科技既有玩家：Orion、Envestnet/Tamarac 等大型 B2B
              软件和服务公司，以集成投资组合管理、交易、CRM 和合规工具服务独立顾问市场。这些既有玩家不直接争夺顾问，但争夺顾问的技术钱包和平台忠诚度，否则这些顾问可能偏好 Farther
              的集成栈。第三层是顾问网络整合方：Dynasty Financial Partners、Carson Group 和 Steward Partners
              等合伙或挂靠模式，为顾问提供基础设施、后台服务，有时还提供股权，作为完全独立或 大型券商雇佣之外的选择。现状替代方案补全了竞争集合：尚未出走的大型券商员工、使用多供应商拼装栈的单体 RIA
              从业者，以及选择经纪交易商挂靠 而不是转成 RIA 的顾问。截至 2025 年 12 月，整个 RIA 格局有 6,421 家独立 RIA，监管约 $14.3T
              资产，形成巨大可招募市场，也推高平台竞争强度。整合方活动正在加速规模集中，让竞争环境更动态：2025 年 M&A 交易超过 370 笔，覆盖超过 $2T AUM。
