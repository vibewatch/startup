  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、相邻市场和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Farther 的可服务市场是美国注册投资顾问（RIA）服务市场，即 SEC 注册投资顾问向个人和机构客户提供的收费型受托财富管理。纳入支出包括基于 AUM 的顾问费（通常每年
              0.75%–1.25%）、财务规划预付费，以及由顾问公司直接收取的投资组合管理费。边界之外包括经纪交易商销售佣金、嵌入共同基金和 ETF 产品中的管理费率、保险保费，以及未单独持有 RIA
              注册的银行关联信托部门收费收入。


              独立 RIA 渠道——不隶属于经纪交易商或银行母公司的公司——是 Farther 招募和平台模式的主要市场分段。截至 2025 年 12 月，按 Dakota Marketplace 数据，该渠道约有 6,421
              家独立公司，管理约 $14.3T AUM。更广义的 SEC 注册顾问宇宙（2024 年 21,669 家公司，$146T RAUM）可作为 TAM 分析的外层上限，但其中包含机构、养老金和银行关联管理人，并非
              Farther 的主要目标。


              Farther 面临四类主要现状替代方案：（1）全服务大型券商（Morgan Stanley、Merrill Lynch、Wells
              Fargo、UBS），它们提供顾问基础设施、合规和品牌，以换取费用分成和产品分销经济性；（2）独立经纪交易商，在混合模式中提供部分顾问自主权；（3）成熟 RIA 财富科技平台——Envestnet（支持
              $6.5T、2,000 万个账户）、Orion、Altruist 和 Savvy——提供技术但不建立雇佣或股权关系；（4）完全自营的独立 RIA
              路径。每类替代方案在经济性、技术能力、客户所有权和合规支持之间取舍不同。两个相邻市场扩展了 Farther 的可选 TAM：面向 UHNW 家族（$50M+ 可投资资产）的多家族办公室分段，由 Farther
              Family Office 覆盖；以及小企业机构顾问市场——两者都是早期机会，而非近期核心 TAM。
