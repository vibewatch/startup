      - number: '7.3'
        title: 技术、运营与数据安全风险
        blocks:
          - type: paragraph
            body: >-
              Farther 把技术放在第一位，既是差异化，也是高度集中的运营风险。277 名顾问全部跑在同一个自研平台——Intelligent Wealth
              Platform——上；平台宕机、安全事件或关键软件缺陷会同时打到全部顾问和客户。公开渠道没有发现 SOC 2 Type II 认证、正常运行时间 SLA、业务连续性计划或灾难恢复文件。SEC 在 2026
              年把「运营韧性」单列为检查重点，这个缺口很实质。


              Farther 的业务形态放大了数据安全风险：14,965 个客户账户平均每个持有 $1.1
              million，账户里有大量个人身份信息（PII），包括社会安全号码、收入和税务数据、投资账户明细以及私募市场持仓。Lowenstein Sandler 的法律提示提到，SEC 在 2025 年 12 月因
              Regulation S-P 和 S-ID 违规处罚一家同时从事 RIA / broker-dealer 业务的机构；这个案例高度可比：该机构没有落实多因素认证、书面事件响应框架等基础控制，17
              个电子邮件账户被接管，约 8,500 人受影响。SEC 2026 年检查重点明确关注机构是否有政策发现并响应客户账户接管和欺诈电汇——执法先例里出现的正是这种失效模式。


              Farther 的 AI 平台还会引来额外监管审视。SEC 2026 年检查重点把「AI-washing」——对 AI 能力作误导性宣传——列为明确检查目标。Farther 的营销持续使用「AI-native
              platform」「intelligent wealth management」等说法，Series D 新闻材料也把 AI 放在核心价值主张上。如果平台真实 AI 功能与 Form
              ADV、客户材料和新闻稿里的描述不一致，公司就有执法暴露。Mercer Capital 2026 年财富管理报告指出，RIA 行业内只有 35% 的公司落地了正式 AI 治理政策；那些宣传 AI
              能力却没有足够内部控制的公司，暴露面很宽。Farther 尚未公开披露 AI 治理框架、模型验证流程或偏差测试程序。


              FinCEN/SEC 最终规则下的 AML/CFT 合规实施要求，给公司加上新的项目搭建义务——客户尽调、交易监测、SAR 申报——这些并不是传统 RIA 合规职能的原生能力。一家公司在不到两年里把 AUM 从
              5 billion 扩到 16 billion，还要同步搭合规基础设施，运营压力很高。围绕这些新义务，公开渠道没有看到合规负责人招聘或项目搭建公告。
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
