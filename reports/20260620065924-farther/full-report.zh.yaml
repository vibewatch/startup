              披露要求，缺少这些披露会同时成为监管风险和客户信任风险。机构顾问评估该平台时，会面对一个供应商风险缺口；拥有 SOC 2 认证的竞争对手（成熟 RIA 技术提供商中常见）并不存在同样问题。
