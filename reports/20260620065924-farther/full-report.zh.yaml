      - number: '4.5'
        title: 监管披露与不利财务信号
        blocks:
          - type: paragraph
            body: >-
              AdvisorSearch.org 汇总的 Farther SEC IAPD Form ADV 数据（截至 2026 年 1 月）识别出两项监管披露警示：来自 Self-Regulating
              Organization（SRO）的 Activity Restriction，按 SEC 数据约影响 2.0 percent 的 RIA 公司；以及 Attorney/Accountant
              Authorization Revocation，约影响 0.2 percent 的公司。这些披露出现在 SEC Form ADV Item 11，覆盖法律和纪律历史。由于研究日期 IAPD
              摘要页只返回导航内容，无法深入复核；这些披露的具体性质、发生时间和持续影响尚未通过直接访问完整 Form ADV Part 1A 确认。任何投资决策前，尽调都应直接拉取完整 Form
              ADV，并要求管理层直接解释两项事项。


              Form ADV 由投资顾问自报，没有独立审计或外部验证。Farther 报告或基于 Form ADV 数据推导的所有 AUM、客户数和顾问人头指标，都带有自报的固有限制。Farther
              从未发布经外部审计的财务报表，作为私营公司也没有义务发布；这意味着所有财务主张——包括 Inc. 5000 收入增长率、recruited-assets 里程碑和全部 AUM
              数字——都建立在管理层陈述之上，缺乏第三方验证。


              积极从 Goldman Sachs 和其他 wirehouse 挖顾问，会引入诉讼敞口。Goldman Sachs 尤其历来会依据其 protocol 和 non-solicitation agreements
              向离职顾问提出主张。RIABiz 提到，Farther 在 2024 年挖 Goldman Sachs 顾问时承认自身意识到法律风险。截至研究日期，尚未发现公开法院文件、FINRA 仲裁或新闻报道显示
              Farther 因挖角面临正在进行的诉讼；但没有确认诉讼并不等于风险消失，尤其考虑到 Seidenstein 这笔招聘的规模（$1.5 billion book）以及持续从 Goldman 相邻渠道招聘的节奏。
