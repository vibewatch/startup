  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与价值主张
        blocks:
          - type: paragraph
            body: >
              Farther 的客户架构明显分为两层。主要经济客户是被招募来的财务顾问——W-2 员工，获得薪资、Farther 股权和收入分成 payout 结构。这些顾问从原机构带来客户资产；Farther
              通过托管成本与顾问 payout 之间的利差，以及资产管理经济性变现。终端客户家庭是下游受益者，通过自己的顾问使用 Farther 的 Intelligent Wealth Platform。这种 B2B2C
              模式意味着，Farther 的获客单位是一次顾问迁移事件，而不是一次直接消费者 onboarding。

              Farther 的 Series D 新闻稿明确列出四类终端客户：高收入个人、由 Farther Family Office 服务的超高净值（UHNW）家庭、小企业和机构账户。实际公开证据更偏向 HNW 和
              UHNW。公司约 $1.1M 的平均客户余额（AdvisorSearch、SEC IAPD 数据，2025 年 2 月）反映客户基础主要是富裕家庭。Farther 有意不设强制最低门槛，让顾问能够服务更广 AUM
              区间——包括低于 $1M 的家庭——不过平均余额显示当前组合仍偏向六位数及以上客户。

              2026 年 4 月，Farther Family Office（FFO）推出，由前 Goldman Sachs 私人财富顾问 Ben Seidenstein（原 $1.5B book）领导，正式确立一个面向
              UHNW、centimillionaire 和 billionaire 的分层，提供定制顾问服务、无最低门槛、AI-native 基础设施和私募市场准入。FFO 的推出拓宽了可服务终端客户范围，并为已有 UHNW
              客户的 Farther 顾问创造自然上行通道。
