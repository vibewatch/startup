      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Farther 的市场是双边结构，财务顾问是主要采纳杠杆。顾问同时是买方（评估并选择平台）、用户（在平台上经营业务）和事实上的客户获取渠道（客户跟随顾问的公司选择）。终端客户是 AUM
              顾问费的最终付款方，但不会独立选择 Farther。这种顾问主导结构意味着，赢下一个顾问招募，本质上就等于赢下其客户资产账本。


              顾问分段包含两类人群：寻求独立、更好技术和股权所有权的出走型大型券商与 IBD 顾问——Farther 的主要招募目标；以及希望获得更强平台的既有独立 RIA
              经营者。出走型顾问的采纳触发因素是技术不满、对公司股权的需求，以及对客户所有权的需求共同作用。Farther 自有博客分析称，单年顾问公司变动超过 11,000 起；Citywire 报道 2025
              年人员迁移增长 16%。Advisor360 Connected Wealth Report 2025 和 Orion 2026 Wealthtech Survey 均指出，技术是顾问换公司的首要原因，直接验证
              Farther 的招募论点。


              终端客户分为三层：大众富裕家庭（$500K–$5M 可投资资产）——主要规模基础；HNW 和 UHNW 客户（$5M–$50M+）——单户收入最高的层级，由 Farther Family Office
              瞄准；以及小企业和机构客户——次级相邻市场。顾问费预算由终端客户家庭承担，但采纳路径完全穿过顾问关系。PE 支持的大型整合平台（Mariner、Hightower、Creative Planning、Carson
              Group、Corient）争夺同一批出走型顾问，并已开始推出自己的 W-2 加股权项目，用更雄厚资本复制 Farther 的结构性招募优势。
