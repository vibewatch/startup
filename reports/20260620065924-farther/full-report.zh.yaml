        - Series C 时 AUM 同比增长 5×；三年收入增长约 12,000%（Inc. 5000 金融服务第 1 名）；按招聘动能，自 2025 年 Q1 起 AUM 有望增至三倍。
        - 顾问招聘连续两个季度减速，或可信独立审计显示绝对收入过低，无法支撑任何溢价倍数。
      - - 平台溢价
        - AI-native、自建基础设施替代割裂的传统技术栈；工作流迁移后，顾问切换成本形成留存护城河。
        - 可信同业以显著更低成本实现功能对等，削弱切换成本论点。
      - - 战略投资方质量
        - General Atlantic（$126B AUM，20 个国家）带来金融服务行业经验，并投资过 Creative Planning；跨组合协同具备可行性。
        - GA 在下一轮融资中减持或下调投资估值；若失去锚定投资人的可信度，下一轮定价会明显受损。
      - - TAM 与结构性顺风
        - 未来十年 RIA 渠道 AUM 预计超过 $4T；顾问从 wirehouse 出走呈结构性加速；UHNW 财富创造推高服务复杂度。
        - 市场回撤 >25% 压缩基于 AUM 的收入；wirehouse 竞业限制被广泛维持，拖慢出走管线。
      - - UHNW 扩张
        - Farther Family Office（由前 Goldman、持有 $1.5B 账本的人士带队）打开 $10M+ 客户段，经济性为 100–200bps，高于标准顾问的 50–75bps。
        - Family Office 部门 12 个月内未能吸引第二位高知名度私人银行家；UHNW 客户留存难度高于 HNW 客户。
      - - 治理 / ADV 疑虑
        - N/A
        - >-
          三项 Form ADV Item 11 纪律处分警示（Activity Restriction from SRO、Attorney/Accountant Authorization Revocation、Business
          License Revocation）未公开解释；若具有实质性，将构成否决触发项。
    notes: 反论点栏同时记录证伪阈值和结构性风险事件。ADV 这一行作为逆向信号纳入，目前没有对应正向论点——投资前需要管理层解释。
