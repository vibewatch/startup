    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: 身份、平台、顾问网络、客户基础、机构资本和收入模型共同构成 Farther 的操作系统；关键依赖把联合创始人与平台、投资者关系同时连在一起。
    data:
      nodes:
        - id: founders
          label: 联合创始人（Matthews + Genser）
          detail: 2019–2020 年从零搭建平台；Matthews 负责分销和资本战略；Genser 负责 AI/ML 平台架构。
          tone: positive
