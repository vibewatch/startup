  - id: TV003
    title: 牛市、基准与熊市场景分析
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 概率信号
      - 主要下行触发项
    rows:
      - - 牛市
        - >-
          到 2028 年中，已管理 AUM 达到 $50–60B；按 AUM 的 50bps 计，收入为 $250–300M；Family Office UHNW 带来 15–20bps
          混合费率提升；无不利监管事件；市场持平或上涨。
        - 10–15× 远期收入 → $2.5–4.5B 估值；IPO 或大型 M&A，达到当前 Series D 入场估值的 2.5–4.5×。
        - 需要当前增长率延续；GA 支持 Creative Planning 扩张的先例提供部分支撑；但没有收入确认，概率低 / 中。
        - 市场回撤 >20%，压缩 AUM 超过 $10B，放慢收入爬坡。
      - - 基准
        - 2027–2028 年已管理 AUM 达到 $35–45B；收入按约 45bps 温和增长；部分释放经营杠杆；无重大监管行动。
        - 7–10× 远期收入 → $1.5–2.5B 估值；M&A 退出，达到 Series D 入场估值的 1–2×；持有 2–3 年。
        - 与观察到的增长轨迹最一致；wealthtech 市场正常化后，相比牛市倍数压缩；中等概率。
        - 顾问年流失率超过 10%；Altruist 或既有托管方发动价格战。
      - - 熊市
        - AUM 增长停滞在 $25B 以下；ADV 纪律处分事项需要整改；市场回撤 20–30%；招聘管线转化率低于 50%。
        - down-round，估值 $700–900M；为当前入场的 0.3–0.7×；资本损失重大。
        - 需要多个不利事件叠加，可能性不高但合理；鉴于治理缺口未披露，概率低 / 中，但影响很大。
        - SEC 就任一 ADV 事项采取正式执法行动；GA 被迫以不利价格出售。
    notes: 估值基于 AUM 倍数和远期收入假设估算；没有审计财务可将这些情景锚定到已验证收入。情景概率信号是作者基于可获得公开证据作出的判断。
