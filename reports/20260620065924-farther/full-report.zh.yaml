      - number: '5.5'
        title: 信任、合规、AI 治理与开放尽调问题
        blocks:
          - type: paragraph
            body: >-
              Farther 是 SEC 注册投资顾问，CRD 编号 302050，受 fiduciary obligation 和完整 Form ADV 披露要求约束。首席合规官 Chris Powers
              负责合规。公司已部署 Osano 作为 cookie consent 管理平台，说明其网站资产有基础隐私治理。不过，公司没有公开披露独立第三方网络安全认证（SOC 2 Type II、ISO 27001
              或类似认证），也未发布安全白皮书、渗透测试状态或泄露历史。对有供应商风险要求的机构顾问和企业客户而言，这是重大缺口。


              AI 治理方面，Farther 将自身定位为「AI at its core」，由此产生的尽调义务尚未公开回答。公司使用的具体 AI 模型（自有、OpenAI 或其他）、训练数据、模型更新节奏、幻觉控制，以及 AI
              辅助建议的客户披露框架均未披露。SEC 在 2026 年初对 AI 的专题关注（见 Willkie Farr 监管更新和 Quarles 的 Form ADV 指引）意味着，未来 Form ADV 申报可能需要
              AI 专项披露。Farther 当前 Form ADV 披露是否覆盖 AI 模型使用，尚未验证。


              Farther Finance Advisors LLC 的 Form ADV Part 2A（brochure）可通过 IAPD 公开访问，但本章未独立获取并验证。该 brochure
              会对投资方法、费率结构、利益冲突和服务交付风险作出有约束力披露——这些都是评估技术交付模型的关键输入。对任何机构交易对手而言，这是高优先级尽调事项。
