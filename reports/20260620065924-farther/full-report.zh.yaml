  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台设计理念与架构
        blocks:
          - type: paragraph
            body: >-
              Farther 的 Intelligent Wealth Platform 从底层自建，而不是把第三方点状方案或传统补丁工具拼在一起。管理层把该平台定位为从第一天起就 AI-native——刻意区别于那些必须把
              AI 改装到 1970 年代系统上的传统财富管理机构。结果是一个单一、集成的软件栈，把执行逻辑、数据管理、投资管理、顾问工作流和面向客户的 UX 合进一个系统。


              平台运营架构横跨五个功能层。最上层是统一门户，同时服务客户（仪表盘、财务全景、文档中心、协作空间）和顾问（CRM 管线、规划、再平衡、任务管理）。其下是 Intelligent Wealth Platform
              核心：自动化税务智能执行、AI 驱动的再平衡器、洞察与推荐引擎、财务规划工作流。Farther Asset
              Management（FAM）构成单独的产品层，提供平台独占的自有投资工具（模型组合、私募市场准入、direct indexing）。数据与集成层在托管方和 CRM 系统之间做自适应
              reconciliation；清算层通过多托管集成支持四家托管方——Pershing、Schwab、Fidelity 和 Apex。Farther
              尚未披露支撑这些层的底层技术供应商（云服务商、数据库、模型提供商）。


              公司称，其自适应数据技术「消除了困扰传统机构的常见错误」，让顾问能把 90 percent 的时间用于客户策略，而不是数据 reconciliation。这些绩效指标由公司陈述，未经独立验证。
