      - number: '4.3'
        title: 资本结构、融资历史与资金 runway
        blocks:
          - type: paragraph
            body: >-
              自 2019 年创立以来，Farther 已完成四轮机构融资。「公司概览」章节列出了逐轮完整时间线；本节聚焦未来资本充足性。Series D 于 2026 年 5 月 21 日交割，规模 $150
              million，由 General Atlantic 领投，CapitalG、Bessemer Venture Partners、Cota Capital 和 MassMutual Ventures
              继续参与。本轮使已披露融资总额达到约 $272 million，且单轮贡献超过累计融资的 55 percent，确认公司已进入以规模资本为主的融资模式。General Atlantic
              确认其投资前观察团队数年，这与其在金融服务平台投资中的模式一致，例如其对 Creative Planning 的少数股权投资。


              Farther 的 Series D 后估值超过 $1 billion——RIABiz 独立确认，公司新闻材料中的「unicorn」表述也暗示了这一点——较 2024 年 10 月 Series C 后 $542
              million 的投后估值约翻一倍。Series D 公告未公开准确估值。


              公司没有公开披露 burn rate、月度现金头寸、债务融资安排或表外义务。已审阅的 SEC 文件或投资者沟通中，也没有披露 credit
              facility、与托管相关的保证金授信额度或其他财务义务。因此，runway 只能按 Series D 募资额（$150 million）减去此前可用现金余额来估算，并受持续 burn rate 假设约束；没有
              data room 访问权无法确认这些假设。在每月 burn $5 million 的低消耗情景下，交割后剩余资本可支撑 30 个月；在每月 burn $20 million
              的高消耗情景下（与快速扩张顾问、平台工程人头和转型激励相符），runway 降至约 7–8 个月，需要追加资本或大幅放缓招聘节奏。这些只是示例估算，并非已确认数字。
