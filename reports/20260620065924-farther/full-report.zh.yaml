  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和费率架构
        blocks:
          - type: paragraph
            body: >-
              Farther 是一家仅收费受托注册投资顾问，SEC 注册 CRD 为 302050。按管理资产百分比收取的顾问管理费，是公司唯一有公开文件支持的收入流；公司不赚取佣金、12b-1
              尾随佣金或第三方产品推荐补偿。确切费率表——包括任何 AUM 分层断点、固定费用或最低收费——披露在 Form ADV Part 2A 中，但未在公司网站公布，因此外部无法独立核验标价费率与实际费率。将行业标准
              50–100 个基点顾问费率套用于 2025 年初报告的 $16B 监管 AUM，隐含年总顾问收入约 $80M–$160M；不过，在未确认 Farther 实际费率表前，该估算置信度较低。


              除核心顾问费外，还识别出两项潜在额外收入流，但均未确认：向第三方 B2B 授权 Intelligent Wealth
              Platform，以及来自私募市场准入的撮合费用。已审阅的投资方新闻稿、监管备案或第三方报道中，均未出现这两项收入流。Farther 将私募市场准入作为平台能力来推广，但仅收费 SEC
              注册会限制其从第三方产品发起方处获得补偿的形式。合在一起看，收入架构简单且经常性强，这是质量指标；但缺少公开费率和任何利润表数据，意味着没有数据室就无法独立验证。


              Farther 的 W-2 顾问雇佣模式叠加股权参与，且不设竞业禁止，明显不同于多数整合型 RIA 采用的独立承包人模式。该模式将最大成本——顾问薪酬——从可变
              分成比率转为固定薪资线，形成更高固定成本基数，也让利润率扩张路径上的经营杠杆敏感性更强。
