      - number: '4.4'
        title: 单位经济与运营成本结构
        blocks:
          - type: paragraph
            body: >-
              Farther 不披露任何损益表指标，包括收入、毛利率、顾问 payout ratio、运营费用或净利润。所有单位经济分析都依赖监管代理数据和行业基准。按 $16 billion 监管 AUM 分布在 277
              名顾问计算，平均每名顾问管理约 $57.8 million 客户资产——低于头部 wirehouse 和独立 RIA 生产者常见的 $100–$500 million
              区间，说明申报时顾问队伍可能更年轻，或客户资产迁移尚未完成。


              14,965 个客户账户、$16 billion AUM，对应平均客户余额约 $1.1 million，使 Farther 稳稳落在高净值区间，并高于大众市场 RIA 平均水平。这一分层与 Farther
              面向拥有成熟 HNW 客户资产的资深顾问招聘话术一致。顾问与客户约 1:54 的比例，也符合 HNW 导向 RIA 的常态。


              同业参照上，2025 InvestmentNews Advisor Benchmarking Study（覆盖 2024 年业绩）显示，美国顾问公司中位运营利润率为 27.8 percent，十亿美元级顾问约为
              28.6 percent。这些可作为 Farther 规模化后的长期目标基准；但从增长资本密集阶段达到这些利润率，需要 AUM 相对于固定人头和技术成本显著放大。Farther
              所处成长阶段的公司通常运营利润率为负或接近零，靠烧钱支持顾问招聘、平台开发和入职基础设施。Inc. 5000 三年约 11,968 percent 的收入增长，与 2022 年极小收入基数（$0.5–$1.5
              million）增长到一个有意义但仍未确认的 2025 年规模相符。


              顾问招聘是短期最主要的成本驱动。仅 2025 年 Q2，Farther 就新增 27 名顾问，并在 2024 年和 2025 年均被 AdvisorHub 评为顶级招聘方。行业证据确认，从 wirehouse
              转向 RIA 通常涉及转型支持、签约激励或最低收入保证，这会在顾问客户资产为平台产出之前形成前置现金成本。Farther 的 W-2 模式进一步放大这一点：它更早把可变薪酬转成固定工资。
