      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 独特战略位置：一体化 AI 平台叠加雇佣制顾问模式
            body: >-
              Farther 占据一块尚无直接同业规模化复制的竞争空白：垂直一体化的 AI 原生财富管理平台，顾问是带股权参与的 W-2 员工。Altruist 和 Savvy Wealth
              等技术原生同业服务独立顾问，但不拥有雇佣关系。Envestnet 和 Orion 等企业平台是 B2B SaaS 供应商，不招募顾问。Dynasty
              等网络整合方保留顾问完全独立。这一独特定位形成双重切换成本——技术锁定和股权归属——并随顾问任期累积。
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP014
          - type: callout
            title: 固定成本 W-2 模式带来财务脆弱性和竞争者追平风险
            body: >-
              Farther 的 W-2 雇佣模式，相较多数竞争者采用的独立承包人整合方模式，带来更高的单顾问固定成本。如果顾问招募放缓，或管理资产因市场回撤下降，就会产生财务脆弱性风险；AUM
              收费收入依赖市场表现，使该风险更突出。与此同时，Farther 用来招募顾问的股权和分成主张，正在被资金充足的竞争者复制：Carson Group、Steward Partners 和 PE
              支持的整合方都提供股权参与，吸引同一批出走型顾问候选人。技术护城河虽然真实存在，但考虑到 Orion Denali AI 和 Envestnet 的 AI 路线图投入，并非不可攻破。
            calloutType: risk
            claimRefs:
              - CP034
              - CP035
              - CP036
          - type: callout
            title: 顾问迁移浪潮同时创造机会和竞争压力
            body: >-
              2025 年超过 11,000 名顾问换公司，较前一年增加 16.2%，代表近年最高流动率。该结构性迁移利好所有争夺出走型 人才的平台，包括
              Farther。不过，同一波浪潮也在驱动资本充足的整合方，它们能在特定交易场景中出价更高或装备更强。Farther 在这种环境中的竞争优势，是 AI
              原生平台带来的入驻速度和简洁度；技术优势必须转化为更快的顾问产能爬坡和更好的客户留存指标，才能维持溢价定位。
