  - id: TV005
    title: 论点破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Form ADV 纪律事项
        - SEC 检查发现与三个未说明的 ADV Item 11 警示有关的重大合规违规；或管理层在尽调中拒绝解释这些警示
        - 直接削弱治理假设；抬高监管整改成本；压低 IPO/M&A 溢价
        - 若阻断项被确认具有重大性，则否决；追加部署资本前暂停并调查
      - - AUM 增长降速
        - 顾问招聘速度连续两个季度较 2025 年节奏下降 >30%；新增净招募资产低于 $500M/季度
        - 平台溢价靠增长速度支撑；一旦降速，牛市与基准情景估值路径即失效
        - 降低仓位规模；推进前要求披露收入；评估 M&A 加速器
      - - 收入 / 利润率不及预期
        - 管理账显示 AUM 到收入收益率低于 25bps（意味着即使按 15× 收入，收入基数也不足以支撑 $1B 估值）
        - 估值中的伪精确错误；会确认入场价格偏高，并要求重新定价下轮融资概率
        - 评估过桥融资条款；把熊市情景概率重新校准到 ≥50%
      - - 竞争性价格冲击
        - Altruist、Schwab 或 Fidelity 推出零费率或大幅折扣的托管 / 平台产品，Farther 经济模型无法匹配
        - 侵蚀技术溢价论据；压缩顾问获客倍数
        - 评估客户留存数据；若顾问流失率超过 10%，启动退出流程
      - - 关键人才离职
        - CEO Taylor Matthews 或 CTO Brad Genser 离职且没有继任计划；或 Seidenstein Family Office 负责人入职 18 个月内流失
        - 两位创始人都掌握不可替代的机构知识；Family Office 论点依赖 Seidenstein 的私人银行关系
        - 立即评估管理层；在继任清晰前有条件持有
    notes: 否决触发项指基本投资前提失效，而非暂时受损的事件。除收入 / 利润率触发项需要管理层权限外，监控指标均可公开获得（招聘公告、AUM 披露、SEC 执法数据库）。
    claimRefs:
      - CV014
      - CV015
      - CV029
      - CV033
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 优先级
      - 尽调路径
    rows:
      - - 经审计财务报表
        - Farther 未公开披露任何财年的经审计 P&L、资产负债表或现金流量表
        - 没有经审计收入、利润率和现金消耗数据，估值分析只能完全依赖 AUM 倍数和增长代理指标；无法做基本面承销
        - 阻断
        - 向投资者关系或通过 NDA 索取 FY2023、FY2024 和 TTM P&L；要求 Big 4 审计；核验每美元托管 AUM 的收入收益率
      - - Form ADV Item 11 纪律警示
        - 三项已披露 ADV 警示（来自 SRO 的活动限制、律师 / 会计师授权撤销、商业许可证撤销）没有公开解释
        - 这些警示类别很少见（在 SEC 注册主体中占比 <2% 至 <0.1%），出现在独角兽阶段 RIA 身上并不寻常；若未解决，就是阻断性治理风险
        - 阻断
        - 要求管理层逐项书面解释；获取法律意见，判断是否产生持续合规义务；用 SEC EDGAR 与 FINRA 记录交叉核对关联人员
      - - 股权结构与优先权条款
        - 已融资 $272M 的投资者持股、优先权条款、清算瀑布和期权池规模均未公开披露
        - 在非牛市退出情景下，优先权堆栈可能显著稀释普通股股东回报；未知悬挂项带来经济风险
        - 重大
        - 通过法律顾问索取资本结构表（完全稀释），包括 Series D 条款；厘清 1× 与 2× 优先权及参与权
      - - AUM 转化率（管线到托管）
        - $23B 招募资产与 $15B 托管 AUM 之间存在差额（约 $8B 管线），公司未披露转化时间表或历史转化率
        - 若管线转化慢或只能部分转化，实际 AUM 倍数会高于按托管 AUM 计算的结果；收入确认也会延后
        - 重大
        - 索取顾问入职时间线的历史队列数据；计算过去 12 个月管线到托管转化率；评估收费启动触发条件
      - - 收入结构与费率表
        - 公司未公开按客户分层拆分的顾问费率、平台费组成或其他收入线
        - 混合收费收益率决定绝对收入；同一 AUM 基数上 25bps 与 75bps 会带来 3× 收入和估值差异
        - 重大
        - 索取分层费率表；询问托管 AUM 的混合顾问费收益率；将平台 SaaS 组成（如有）与基于 AUM 的顾问服务分开理解
      - - 竞争留存与流失
        - 公司未公开顾问流失率，或顾问离职后客户 AUM 流失数据
        - 若离职顾问带走客户（RIA 领域很常见），招募资产管线会部分回撤；这是增长模型中的系统性风险
        - 信息性
        - 索取过去 24 个月顾问留存统计；询问任一顾问离职时留存与流失的 AUM；对标行业 85–92% 常模
    notes: 优先级：阻断 = 未解决前无法做投资决定；重大 = 会实质影响情景概率和信心水平；信息性 = 有助于监控，但不阻挡初始投资决定。
    claimRefs:
      - CV016
      - CV029
      - CV042
      - CV043
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Farther 的公开记录始于 2019 年技术优先的创立，随后资产快速增长并连续融资；2026 年 5 月跨过独角兽节点，但监管披露悬而未决，需要直接核验。
    data:
      items:
        - date: '2019'
          label: Farther 创立
          detail: Taylor Matthews 与 Brad Genser 于 2019 年成立 Farther，目标是用自研 AI 从零重建财富管理。
          tone: positive
        - date: 2020-04
          label: 疫情期间公开上线
          detail: Farther 于 2020 年 4 月上线，当时没有客户，也没有既有声誉；即便市场环境不利，技术优先叙事仍吸引了早期顾问。
          tone: neutral
        - date: ~2022
          label: 早期机构融资
          detail: 种子轮和早期风投轮完成融资（细节未公开）；Cota Capital 是已知早期支持者之一；Series C 前总额隐含约 $50M。
          tone: neutral
        - date: 2024-07
          label: Goldman Sachs 顾问管线
          detail: RIABiz 报道，自 2023 年 9 月以来，Farther 从 Goldman Sachs PFM 招募 10 名顾问，合计 AUM $649M；Goldman 对部分离职顾问提起仲裁请求。
          tone: adverse
        - date: 2024-10
          label: Series C：$72M，估值 $542M
          detail: $72M Series C 由 CapitalG 和 Viewpoint Ventures 共同领投；AUM 突破 $5B（同比 5x 增长）；投后估值 $542M。
