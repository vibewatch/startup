      - CV015
      - CV032
      - CV033
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Wealthtech platform and RIA aggregator private funding rounds and public comps with publicly disclosed or
        credibly reported valuations as of June 2026. Revenue-multiple comps excluded for Farther and direct peers due
        to absence of audited revenue data. Public RIA/wealth-management equities included for market-level AUM multiple
        context.
    columns:
      - 可比公司
      - 商业模式
      - 指标
      - 倍数 / 估值
      - 与 Farther 的相关性
      - 主要局限
    rows:
      - - Altruist
        - AI-native RIA 托管平台；面向增长型独立顾问
        - $152M 融资轮（GIC 领投，2025）；估计投前约 $1.0–1.5B
        - 估计估值约 $1.0–1.5B（技术原生财富平台）
        - 最接近的直接私营可比公司：顾问人群相同、技术定位相近，融资规模大致可比
        - Altruist 是托管方（不直接管理 AUM）；Farther 是 RIA；收入组合和利润率结构差异明显
      - - Savvy Wealth
        - AI-native RIA 平台，采用雇佣顾问模式；Series B 阶段
        - Series B（2024–2025）；估计估值区间 $50–150M
        - <$200M（估计；未公开披露）
        - 同一类别（面向增长顾问的 AI-native RIA）；为这一 cohort 提供估值下限
        - AUM 基数小得多；阶段更早；估值主要按交易规模和阶段常态估算
      - - Focus Partners Wealth
        - 大型 PE 支持的 RIA 聚合平台；合作公司合计 AUM $500B+
        - 由 KKR / CI Financial 私有化（2023）；此前公开市场：峰值约 15–20% AUM 倍数
        - 峰值公开估值约 $4B；私有化条款未披露
        - 展示 PE 支持聚合平台的规模终点；GA 过去对类似聚合业务的兴趣，说明 Farther 具备战略可选性
        - 聚合模式与有机招聘结构不同；Focus 收入更分散，而 Farther 仍处早期
      - - Creative Planning（GA 支持）
        - 超高净值独立 RIA；AUM $300B+
        - GA 战略少数股权投资（2020）；当前 AUM 约 $300B+
        - 估值未公开披露；投资时 AUM 倍数可能为 2–5%
        - 直接提供 GA 组合语境；显示 GA 对高端 RIA 平台经济性的论点，以及支持财富管理规模化的能力
        - 成熟度高得多、运营经验更久的 RIA；私募股权少数股权不能直接作为估值可比，但印证 GA 的论点和网络支持
      - - 公开 RIA / 财富科技样本
        - 上市公司：LPL Financial、SEI、Envestnet、AssetMark
        - 公开市场 EV/AUM 约 1–3%；EV/Revenue 1–3×；EV/EBITDA 15–25×（按 2025 年 Mercer/IN 数据中的成熟盈利平台）
        - AUM 的 1–3%（公开成熟 RIA）；AUM 的 5–12%（PE 支持的成长平台）
        - 给出财富科技 AUM 倍数在成熟度光谱上的下限与上限；Farther 高于上市公司地板，接近 PE 成长平台天花板
        - 公开可比公司是成熟、盈利业务；把它们的倍数套到尚未披露收入的独角兽，会低估成长溢价
    notes: >-
      除非直接披露，所有私营公司估值均按已报道融资规模和阶段惯例估算。上市公司倍数是时点值，会随股票市场环境变化。名单不完整：Compound Planning、Hightower Advisors（PE 支持）和 Dynasty
      Financial Partners 缺少已验证的 2026 年估值数据。
