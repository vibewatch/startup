figures:
  - id: FM001
    title: "Market sizing pyramid — TAM to SOM"
    type: pyramid
    layout: wide
    summary: >-
      Four nested market boundaries show Farther's $23B SOM as a small fraction (~0.16%)
      of the $14.3T independent RIA channel, itself a subset of the $146T total SEC-registered
      adviser market; the derived advisory fee revenue layer sits between AUM boundaries.
    data:
      items:
        - label: "TAM — All SEC-registered IA RAUM (2024)"
          value: "$146T"
          detail: >-
            21,669 registered investment advisers; includes institutional, pension, and
            bank-affiliated managers; $146T RAUM grew +12.8% YoY; broadest outer boundary.
          tone: neutral
        - label: "SAM — Independent RIA channel AUM (Dec 2025)"
          value: "$14.3T"
          detail: >-
            6,421 independent RIA firms per Dakota Marketplace; excludes wirehouses, IBDs,
            and bank trust departments; primary recruiting market for Farther. ~70% of
            firms manage under $700M but control under 9% of channel assets.
          tone: positive
        - label: "SAM (revenue proxy) — Est. advisory fee pool"
          value: "~$143B/yr"
          detail: >-
            Derived: 1.0% fee rate applied to $14.3T independent RIA AUM; plausible range
            $107–179B/yr; no aggregate fee revenue figure is publicly reported.
          tone: neutral
        - label: "SOM — Farther recruited assets (May 2026)"
          value: "$23B"
          detail: >-
            Company-stated May 2026; includes $16B confirmed AUM (SEC IAPD) plus ~$7B
            in pipeline assets; represents ~0.16% of independent RIA channel AUM.
          tone: positive
    approximationNotes: >-
      Advisory fee revenue SAM (~$143B) is a derived estimate applying a 1.0% fee assumption
      to Dakota's $14.3T AUM figure; not a reported market size. Farther's $23B recruited
      assets includes pipeline assets not yet fully transferred; confirmed AUM is ~$16B per
      SEC IAPD data. All figures in USD.
    claimRefs:
      - CM006
      - CM009
      - CM011
      - CM015
      - CM016
      - CM017

  - id: FM002
    title: Independent RIA advisory fee revenue — estimate range by fee-rate assumption
    type: range
    layout: standard
    summary: >-
      Annual advisory fee revenue from the independent RIA channel is estimated at $107–179B
      depending on fee-rate assumption applied to Dakota's $14.3T AUM base; the midpoint of
      $143B uses the industry modal 1.0% AUM fee.
    data:
      items:
        - label: "Low (75 bps fee rate on $14.3T AUM)"
          value: 107
          low: 95
          high: 115
        - label: "Base (100 bps fee rate on $14.3T AUM)"
          value: 143
          low: 130
          high: 155
        - label: "High (125 bps fee rate on $14.3T AUM)"
          value: 179
          low: 165
          high: 195
    approximationNotes: >-
      All values in USD billions (annual). Derived from Dakota's $14.3T independent RIA AUM
      figure (Dec 2025) using fee-rate sensitivity of 0.75%, 1.00%, and 1.25%. No public
      source reports aggregate advisory fee revenue for the independent RIA channel. Low/high
      bounds within each row reflect ~8B uncertainty band per tier. This is an
      order-of-magnitude estimate, not a measured figure.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM039

  - id: FM003
    title: Buyer and segment map — advisor-led two-sided market structure
    type: flow
    layout: wide
    summary: >-
      Farther's market is advisor-led; the advisor is buyer, user, and client acquisition
      channel simultaneously. PE-backed consolidators compete for the same advisors and have
      begun replicating Farther's W-2 plus equity recruiting model.
    data:
      nodes:
        - id: wirehouse_ibd
          label: "Advisor at Wirehouse / IBD"
          detail: >-
            Technology-constrained; limited equity ownership; non-compete risk upon departure;
            11,000+ advisors change firms annually; technology dissatisfaction is the #1 stated reason.
          tone: neutral
        - id: farther
          label: "Farther (W-2 + equity + AI platform)"
          detail: >-
            Recruits breakaway advisors with salary, equity, AI-native platform, and
            client-ownership rights; 277 licensed advisors as of early 2025.
          tone: positive
        - id: pe_consolidator
          label: "PE-Backed Consolidator (Mariner, Hightower, et al.)"
          detail: >-
            Well-capitalized; replicating W-2+equity programs; top 10 completed 100+ deals
            representing $880B+ in acquired assets in 2025; direct competing acquirers.
          tone: adverse
        - id: client_masaffluent
          label: "Mass-Affluent Client ($500K–$5M)"
          detail: >-
            Primary volume base; digital-first preferences; follows advisor's firm decision;
            pays AUM-based advisory fee; no independent platform selection.
          tone: neutral
        - id: client_hnw
          label: "HNW / UHNW Client ($5M+)"
          detail: >-
            Highest revenue per household; estate, tax, private market needs; served by
            Farther Family Office; 91% want estate planning but only 22% receive it.
          tone: positive
      edges:
        - from: wirehouse_ibd
          to: farther
          label: "breakaway recruits (11K+ advisor moves/yr)"
        - from: wirehouse_ibd
          to: pe_consolidator
          label: "also recruit to consolidators"
        - from: pe_consolidator
          to: farther
          label: "competes for same advisor pool"
        - from: farther
          to: client_masaffluent
          label: "serves via advisor"
        - from: farther
          to: client_hnw
          label: "serves via advisor + FFO"
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM023
      - CM025
      - CM026
      - CM027

  - id: FM004
    title: Advisor adoption funnel — market scale to Farther deployment
    type: funnel
    layout: standard
    summary: >-
      The advisor adoption funnel narrows from 11,000+ annual industry-wide moves through
      511 new independent RIA formations to Farther's cumulative base of 277 licensed
      advisors; relative scales illustrate Farther's current capture rate from the
      breakaway market.
    data:
      items:
        - label: "Annual advisor firm changes — industry-wide (2025)"
          value: 11000
          detail: >-
            Farther-cited estimate of advisor firm moves in one year; Citywire reports a
            16% jump in moves in 2025; represents the total annual breakaway candidate pool.
        - label: "New independent RIA formations (2025)"
          value: 511
          detail: >-
            511 new RIAs launched in 2025 with $80.6B in AUM per Dakota; advisors choosing
            full independence over joining an existing platform like Farther.
        - label: "Total Farther licensed advisors (cumulative through early 2025)"
          value: 277
          detail: >-
            Per SEC IAPD data; cumulative platform capacity across 51 states; not a single-year
            cohort; reflects Farther's total advisor base since founding.
        - label: "New Farther advisors added in H2 2024 (recent cohort)"
          value: 23
          detail: >-
            23 new advisors added in second half of 2024 per AdvisorHub; indicates pre-Series D
            recruiting run rate before $150M capital deployment.
    approximationNotes: >-
      Funnel stages are not directly comparable: 11,000 is annual industry-wide; 511 is the
      2025 new-firm formation count; 277 is Farther's cumulative advisor base; 23 is a single
      semi-annual cohort. Presented to illustrate relative market scale and Farther's current
      capture rate, not as a true conversion funnel with consistent time periods or denominators.
      Farther has not disclosed actual pipeline conversion data.
    claimRefs:
      - CM010
      - CM019
      - CM025
      - CM028
      - CM029

