    figureRefs: []

callouts:
  - calloutType: insight
    title: Two-sided market — advisor adoption is the growth bottleneck
    body: >-
      Farther's market is structurally two-sided but advisor-led: the advisor is buyer, user,
      and primary client acquisition channel in a single role. Winning an advisor recruit is
      functionally equivalent to winning their book of client assets, meaning Farther's growth
      ceiling is set by advisor recruitment capacity, not the size of the client opportunity.
      Cerulli's 11.8% independent RIA channel headcount growth projection through 2028 is the
      most important leading indicator for Farther's SAM expansion trajectory.
    claimRefs:
      - CM018
      - CM020
      - CM028

  - calloutType: risk
    title: PE-backed consolidators are replicating Farther's W-2 plus equity model
    body: >-
      Mariner, Hightower, Creative Planning, Carson Group, and Corient have significantly
      more capital than Farther and have begun offering W-2 plus equity programs that
      directly replicate Farther's primary recruiting differentiation. The top ten RIA
      acquirers completed over 100 transactions representing more than $880 billion in
      acquired assets in 2025. Farther's recruiting advantage depends on sustaining
      technology superiority that larger but slower-moving platforms cannot quickly replicate.
    claimRefs:
      - CM025
      - CM026
      - CM035

  - calloutType: assumption
    title: Advisory fee revenue TAM is a derived estimate, not a reported figure
    body: >-
      The $107–179 billion annual advisory fee revenue range is derived by applying fee-rate
      assumptions of 0.75%–1.25% to Dakota's $14.3 trillion independent RIA AUM figure.
      Neither aggregate advisory fee revenue nor exact independent RIA AUM is publicly
      reported with precision. The figure is an order-of-magnitude proxy; actual achievable
      TAM is likely lower due to fee compression and the subset of advisors who would not
      join Farther's W-2 model.
    claimRefs:
      - CM011
      - CM039
      - CM041

