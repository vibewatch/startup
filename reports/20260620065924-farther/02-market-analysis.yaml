  - id: s4
    title: Growth drivers, adoption constraints, and regulatory landscape
    body: >-
      The independent RIA market benefits from compounding structural tailwinds. The primary
      driver is advisor mobility: Cerulli projects 11.8% headcount growth in the independent
      RIA channel by 2028—more than double the 4.7% projected for IBDs—and Schwab estimates
      the industry will need 70,000 or more new staff over five years to sustain current
      growth rates. Advisor breakaways are driven by technology dissatisfaction, economic
      preferences, and unmet client demands: Cerulli research finds that 91% of wealthy
      clients wish their advisor offered estate planning, yet only 22% receive it, creating
      an addressable service gap that full-platform RIAs like Farther can fill.


      The second driver is wealth accumulation. Cerulli projects $5M+ household wealth to
      surpass $30 trillion by 2028 at 9.3% CAGR, and managed account assets—the primary
      fee-generating vehicle—are expected to nearly triple to $31.8 trillion by 2028 from
      $13.7 trillion in 2024. These trends expand the revenue opportunity for advisors on
      comprehensive platforms. The SEC regulatory environment in 2026 adds a third tailwind:
      under Chairman Atkins the agency has signaled priorities of deregulation,
      democratization of alternative investment access for retail investors, and AI
      promotion—each benefiting AI-native, alternatives-capable RIA platforms.


      Three structural constraints govern adoption pace. First, fee compression: robo-advisors
      and fintech entrants have established sub-50bps fee benchmarks, pressuring traditional
      1% advisory models and requiring service expansion to justify premium fees. Second,
      advisor switching costs: non-solicitation agreements, protocol departure risk, client
      consent requirements, and custodian transition friction make moves operationally and
      legally complex—the Goldman Sachs arbitration against former advisors who joined
      Farther is a concrete example. Third, capital intensity: Farther's W-2 model requires
      paying salary before advisors reach full production, raising per-recruit cost versus
      1099 contractor models at competing platforms. AI governance remains nascent: Schwab's
      2025 study found only 35% of RIA firms have formal AI policies, and 57% allow AI
      exploration without formal structure—slowing deployment of AI-native platform advantages.
