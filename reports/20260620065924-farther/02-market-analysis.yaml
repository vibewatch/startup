  - id: s5
    title: Sizing gaps, contradictory estimates, and diligence asks
    body: >-
      Four material sizing gaps limit the precision of this market analysis. First, no public
      source discloses aggregate advisory fee revenue for the independent RIA channel; the
      $107–179 billion estimate is derived from AUM and fee-rate assumptions, not measured
      data. This is the most important gap for modeling Farther's revenue potential. Second,
      Farther's SAM is not publicly bounded: the company has not disclosed its target advisor
      count, target AUM per advisor, internal capacity model, or advisor-pipeline conversion
      rate. Third, the impact of RIA M&A consolidation on the breakaway advisor pool is
      ambiguous—as PE-backed mega-platforms absorb mid-market RIAs, the pool of accessible
      breakaway recruits may contract. Fourth, no per-advisor revenue or margin benchmarks
      exist in public sources for integrated RIA platforms at Farther's stage.


      Two frequently cited figures create market-size confusion. The InvestmentNews headline
      describing the RIA market as "approaching a $4 trillion mark" refers specifically to
      the estimated M&A acquisition pipeline—advisor retirement and breakaway AUM available
      for consolidators—not to total channel AUM. The Cerulli estimate of $3.9 trillion in
      acquirable AUM across 66,000+ advisor exits is a deal-flow measure, not a channel
      size. The Dakota $14.3 trillion and SEC $146 trillion are measuring entirely different
      boundaries (independent RIA only versus all registered advisers) and are not comparable
      as alternative estimates of the same market.


      Farther's own "recruited assets" metric ($23 billion) includes assets at prior
      custodians that are in transit or pending transfer, while SEC IAPD-reported AUM of
      approximately $16 billion reflects assets actually under management. The approximately
      $7 billion gap is material for revenue run-rate estimation. Diligence should clarify the
      percentage of recruited assets that convert within 12 months, average revenue per
      converted dollar, and pipeline attrition rate.
    claimRefs:
      - CM039
      - CM040
      - CM041
      - CM042
      - CM043
      - CM044
      - CM045
