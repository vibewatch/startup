chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Farther operates at the intersection of two growing markets: the independent U.S. RIA
    channel (~$14.3T AUM, 6,421 firms as of December 2025 per Dakota) and the broader
    SEC-registered investment adviser universe ($146T RAUM, 21,669 advisers, 2024), with
    estimated independent-channel advisory fee revenue of $107–179B annually. Structural
    tailwinds—an accelerating advisor breakaway wave (16% jump in moves in 2025), a
    Cerulli-projected 11.8% headcount increase in the independent RIA channel by 2028, and
    HNW household wealth forecast to surpass $30T by 2028 at 9.3% CAGR—create a large and
    expanding addressable market. Material adoption constraints include fee compression from
    robo-advisors and new entrants, high advisor switching costs, competition from
    PE-backed mega-consolidators, and the early-stage AI governance posture at most RIA firms.

