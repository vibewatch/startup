      - number: '7.5'
        title: Adverse Research Findings and Evidence Limitations
        blocks:
          - type: paragraph
            body: >-
              Mandatory adverse research for this chapter produced the following material findings. The most significant
              adverse finding is the three Form ADV Item 11 disciplinary alerts identified by AdvisorSearch.org — an
              Activity Restriction from an SRO, an Attorney/Accountant Authorization Revocation, and a Business License
              Revocation from an SRO. These are public disclosures in Form ADV Part 1A that Farther has not publicly
              explained; they affect less than 2.0%, 0.2%, and 0.1% of SEC-registered RIAs respectively. Their presence
              on a firm in a fundraising cycle does not necessarily indicate current operational risk (such disclosures
              may relate to historical affiliates), but the absence of a public management explanation is an information
              gap.


              A second adverse finding is the absence of publicly available information on: (a) any audited financial
              statements, (b) any cybersecurity incident or breach notification, (c) any SOC 2 or equivalent platform
              certification, (d) any client or advisor complaint history, and (e) any FINRA arbitration record. The
              absence of adverse evidence in public records is not the same as a clean record; for a firm with 277
              advisors and ~15,000 clients, the statistical probability of zero complaints or incidents is low,
              suggesting these records are either sealed in FINRA arbitration or genuinely absent. Publicly traded RIA
              comparables disclose audited financials, material incident history, and exam results; Farther's disclosure
              gaps are wider than would be acceptable for a firm seeking institutional capital at a $1 billion+
              valuation.


              The valuation/funding claim is a third adverse signal: the post-money valuation of $1 billion+ represents
              approximately 62x regulatory AUM ($16 billion), a multiple that implies the market is pricing platform
              option value — not current cash flows — into the enterprise. At a 50-bps average advisory fee, $16 billion
              in AUM implies roughly $80 million in gross revenue. At a 25% operating margin (industry benchmark per
              InvestmentNews 2025 data), that implies ~$20 million in operating profit, making the unicorn valuation a
              50x earnings multiple with no earnings confirmed. This premium is defensible only if the platform thesis
              is validated, advisor recruiting continues at current pace, and market conditions remain supportive — all
              of which represent execution risks that compound each other.
