  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Form ADV disciplinary items
        - >-
          SEC examination reveals material compliance violation connected to the three undisclosed ADV Item 11 alerts;
          or management refuses to explain them in due diligence
        - Directly undermines governance assumption; increases regulatory remediation cost; reduces IPO/M&A premium
        - Kill if blocking items are confirmed material; pause and investigate before any additional capital deployment
      - - AUM growth deceleration
        - >-
          Advisor recruiting rate drops >30% from 2025 pace for two consecutive quarters; net new recruited assets below
          $500M/quarter
        - >-
          Platform premium rests on growth velocity; deceleration invalidates the bull and base case valuation
          trajectories
        - Reduce position sizing; demand revenue disclosure before proceeding; explore M&A accelerant
      - - Revenue / margin disappointment
        - >-
          Management accounts reveal AUM-to-revenue yield below 25bps (implying revenue base insufficient to justify $1B
          valuation at even 15× revenue)
        - False-precision error in valuation; would confirm stretched entry and require down-round probability repricing
        - Evaluate bridge financing terms; recalibrate to bear case probability ≥50%
      - - Competitive pricing shock
        - >-
          Altruist, Schwab, or Fidelity introduces a zero-fee or deeply discounted custodial/platform offering that
          Farther's economics cannot match
        - Erodes the technology-premium argument; compresses advisor acquisition multiples
        - Assess customer retention data; if advisor churn exceeds 10%, initiate exit process
      - - Key talent departure
        - >-
          CEO Taylor Matthews or CTO Brad Genser departure without succession plan; or loss of the Seidenstein Family
          Office lead within 18 months of hire
        - >-
          Both founders provide irreplaceable institutional knowledge; Family Office thesis rests on Seidenstein's
          private-banking relationships
        - Immediate management assessment; conditional hold pending succession clarity
    notes: >-
      Kill triggers represent events where the fundamental investment premise is invalidated rather than temporarily
      impaired. Monitoring metrics are public (recruiting announcements, AUM disclosures, SEC action databases) except
      for revenue/margin triggers which require management access.
