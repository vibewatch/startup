      - number: '4.3'
        title: Capital Structure, Funding History, and Runway
        blocks:
          - type: paragraph
            body: >-
              Farther has raised four institutional funding rounds since its 2019 founding. The Company Overview chapter
              contains the full round-by-round chronology; this section focuses on forward capital adequacy. The Series
              D closed May 21, 2026, at $150 million led by General Atlantic with continued participation from CapitalG,
              Bessemer Venture Partners, Cota Capital, and MassMutual Ventures. This raise brings total disclosed
              capital to approximately $272 million and represents more than 55 percent of cumulative capital raised in
              a single round, confirming that scale capital is now the primary financing mode. General Atlantic
              confirmed it observed the team for several years before investing, which is consistent with its pattern in
              financial-services platform investments such as its minority stake in Creative Planning.


              Farther's post-Series D valuation exceeds $1 billion — independently confirmed by RIABiz and implied by
              the company's own "unicorn" characterization in press materials — roughly doubling the $542 million
              post-money valuation following the Series C in October 2024. Exact valuation was not publicly disclosed in
              the Series D announcement.


              No public disclosure of burn rate, monthly cash position, debt facilities, or off-balance- sheet
              obligations has been made. The company has not disclosed a credit facility, custody- related margin line,
              or other financial obligation in any SEC filing or investor communication reviewed. Runway is therefore
              estimated as a function of Series D proceeds ($150 million) less any prior available cash balance and
              subject to ongoing burn rate assumptions that cannot be confirmed without data room access. At a low-burn
              scenario of $5 million per month the remaining capital would provide 30 months of runway from close; at a
              high-burn scenario of $20 million per month (consistent with rapid advisor scaling, platform engineering
              headcount, and transition incentives) runway falls to approximately 7–8 months, necessitating additional
              capital or a significant reduction in recruiting pace. These are illustrative estimates, not confirmed
              figures.
