      - number: '4.2'
        title: AUM and Asset Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Farther's disclosed asset history runs from approximately $1 billion at founding through a series of
              fundraising-linked milestones. At the Series C close in October 2024 the company reported $5 billion in
              AUM, representing approximately 5x year-over-year AUM growth. By January 2025 it confirmed $5 billion and
              23 additional advisors recruited in the second half of 2024. In approximately July 2025 the company
              announced surpassing $13 billion in "recruited assets" — a metric explicitly defined to include AUM
              already under management plus assets anticipated from advisors scheduled to join in the coming months;
              this represented a near-tripling since the start of 2025.


              At the Series D announcement in May 2026, Farther cited $23 billion in recruited assets across its
              founding-to-date history. The company's own Form ADV regulatory data, aggregated by AdvisorSearch.org from
              SEC IAPD records, showed $16.0 billion in regulatory AUM, 277 licensed advisors, and 14,965 client
              accounts as of the data pull date in early 2025. The $7 billion gap between the $23 billion
              recruited-assets figure and the $16 billion regulatory AUM reflects several factors: market appreciation
              from early 2025 to May 2026, new advisor onboarding completed since the Form ADV snapshot, and a pipeline
              of committed but not yet transitioned advisor books. Investors must treat these two metrics as measuring
              fundamentally different things — recruited assets is a forward-looking pipeline indicator while regulatory
              AUM is a confirmed managed-assets figure subject to SEC oversight.


              The Inc. 5000 recognition in 2025 reported approximately 11,968 percent three-year revenue growth, making
              Farther the fastest-growing financial services firm in the U.S. for that measurement period. This growth
              rate is submitted by the company to Inc. Magazine and is not independently audited; the absolute dollar
              revenue base is not disclosed, so the percentage growth, while dramatic, cannot be translated to a dollar
              revenue figure.
