      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Farther's market has a two-sided structure that makes the financial advisor the primary adoption lever.
              The advisor is simultaneously the buyer (evaluates and selects the platform), the user (operates their
              practice on it), and the de facto client acquisition channel (clients follow the advisor's firm decision).
              End clients are the ultimate payers of AUM-based advisory fees but do not independently select Farther.
              This advisor-led structure means winning an advisor recruit is functionally equivalent to winning their
              book of client assets.


              The advisor segment spans two sub-populations: breakaway wirehouse and IBD advisors seeking independence
              with better technology and equity ownership—Farther's primary recruiting target—and existing independent
              RIA operators seeking a more capable platform. The adoption trigger for breakaway advisors is a compound
              of technology dissatisfaction, desire for firm equity, and desire for client-ownership rights. Farther's
              own blog analysis cites more than 11,000 advisor firm changes in a single year; Citywire reported a 16%
              jump in moves in 2025. The Advisor360 Connected Wealth Report 2025 and the Orion 2026 Wealthtech Survey
              both identify technology as the leading reason advisors change firms, directly validating Farther's
              recruiting thesis.


              The end-client segment divides into three tiers: mass-affluent households ($500K–$5M investable
              assets)—the primary volume base; HNW and UHNW clients ($5M–$50M+)—the highest revenue-per-household tier
              targeted by Farther Family Office; and small-business and institutional clients—a secondary adjacency.
              Budget ownership for advisory fees sits with the end-client household, but the adoption path runs entirely
              through the advisor relationship. PE-backed mega-consolidators (Mariner, Hightower, Creative Planning,
              Carson Group, Corient) compete for the same breakaway advisor segment and have begun offering their own
              W-2 plus equity programs, replicating Farther's structural recruiting advantage with significantly greater
              capital behind them.
