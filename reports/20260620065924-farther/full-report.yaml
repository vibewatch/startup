      - number: '6.5'
        title: Expansion Dynamics and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Farther's near-term AUM growth is disproportionately driven by large single-event wirehouse disruptions
              rather than steady-state organic recruiting. The Commonwealth LPL acquisition triggered a $1.7B single
              wave; the Goldman Sachs Personal Financial Management wind-down produced $649M; and Ben Seidenstein alone
              brought $1.5B from Goldman. Together these three events account for approximately $4B in recruited assets
              — roughly a quarter of the current $15B AUM — from essentially two institutions in concentrated windows.
              This creates a dependency on continued wirehouse disruption (M&A, fee changes, platform failures) as a
              growth catalyst.

              The geographic expansion story is more diversified: 51 states are covered, and Q2 2025 recruiting spanned
              15 states. SignalPoint deepens the Midwest footprint; WMBC anchors California; Bell Tower and WealthFactor
              demonstrate Ohio and Oregon reach. The land-and-expand pathway to UHNW clients via Farther Family Office
              represents a meaningful ticket-size upgrade if existing advisors can cross-refer their most affluent
              clients to FFO. However, this pathway is as yet unquantified and FFO was only launched in April 2026.

              Advisors formally operate as "powered by Farther" sub-brands (e.g., SignalPoint, WMBC), which introduces a
              differentiated brand relationship compared to full Farther-branded advisors. Whether client households see
              themselves as Farther clients or SignalPoint/WMBC clients matters for churn modeling; this distinction is
              currently unresolved in public evidence.
            claimRefs:
              - CU036
              - CU037
              - CU038
              - CU039
