  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Valuation Setup
        blocks:
          - type: paragraph
            body: >-
              Farther completed a $150 million Series D in May 2026 led by General Atlantic, a leading global private
              equity firm managing approximately $126 billion across strategies as of December 31, 2025. Existing
              investors including CapitalG, Bessemer Venture Partners, Cota Capital, and MassMutual Ventures
              participated alongside the new lead. The round elevated Farther's post-money valuation above $1 billion —
              a unicorn mark confirmed independently by the official press release, RIABiz reporting, Fintech Global,
              and Wealth Management magazine. Total equity raised since the company's 2019 founding reached $272 million
              with this round, more than doubling the cumulative capital from rounds A through C combined.


              The valuation progression provides a useful anchor: the Series C in October 2024, led by CapitalG, set a
              post-money valuation of $542 million against $5 billion in AUM — implying roughly 10.8% of AUM. At the
              Series D, Farther reported $23 billion in recruited assets (including $15 billion in managed AUM and
              approximately $8 billion in pipeline assets expected from advisors onboarding over coming months). On
              managed AUM alone the Series D implied multiple is approximately 6.7%; on recruited assets it is
              approximately 4.3%. Both metrics are substantially above the 1–3% of AUM that RIA-industry M&A
              transactions typically generate, confirming the market is underwriting a wealthtech platform premium
              rather than a traditional advisory-firm multiple.


              A critical limitation governs the entire valuation analysis: Farther has not disclosed audited revenue,
              gross margin, EBITDA, or cash position. The only verified revenue signal is a relative one — the Inc. 5000
              ranking places Farther at #8 overall and #1 in financial services on 2025 revenues, reflecting three-year
              revenue growth of approximately 12,000%. The absolute revenue denominator is unknown, so standard
              revenue-multiple approaches (e.g., EV/Revenue, EV/ARR) cannot be applied with any confidence. This
              elevates scenario-range width and demands investor discipline: the valuation is a directional bet on
              growth continuation, not a triangulated financial multiple.
