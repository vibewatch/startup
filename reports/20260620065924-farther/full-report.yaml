      - number: '3.3'
        title: 'Incumbent Platform Providers: Envestnet, Tamarac, and Advisor360°'
        blocks:
          - type: paragraph
            body: >-
              Envestnet is the dominant wealthtech incumbent, supporting approximately $6.5 trillion in assets across
              more than 20 million accounts as of mid-2025. Its 2025–2026 strategic roadmap spans tax-aware trading,
              advisor control enhancements, automation, and ecosystem integrations across both the Envestnet enterprise
              platform and Envestnet Tamarac, which specifically serves independent RIAs with integrated portfolio
              management, rebalancing, billing, and CRM. Envestnet describes itself as "the industry's most connected,
              customizable wealth management platform." The Envestnet roadmap signals a direct competitive response to
              the value propositions of AI-native entrants: improved personalization at scale, AI-driven client
              insights, and deeper workflow automation. However, Envestnet's B2B distribution model means its innovation
              must flow through incumbent advisory firm relationships rather than being used to recruit individual
              advisors. This distribution moat insulates Farther from Envestnet as a direct advisor recruiting
              competitor while simultaneously limiting Farther's ability to displace Envestnet's enterprise clientele.
              According to Cerulli, the independent RIA channel represents one of the fastest-growing addressable
              opportunities for third-party software vendors, and Orion and Envestnet are the primary beneficiaries of
              that spend. Firms that already use Envestnet or Orion face meaningful switching costs to move to a
              Farther-centric stack—migration of portfolio data, integrations, and client portal access are non-trivial
              barriers. The Advisor360° 2025 Connected Wealth Report found that the number-one stated reason advisors
              switch firms is desire for better technology, underscoring why the technology differentiation that Farther
              offers is also the asset incumbents most urgently seek to replicate.
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP030
              - CP034
              - CP037
      - number: '3.4'
        title: 'Advisor Network and Aggregator Models: Dynasty, Carson, and Steward Partners'
        blocks:
          - type: paragraph
            body: >-
              Advisor network aggregators offer a distinct alternative to Farther's W-2 platform model: they provide
              infrastructure, compliance, technology, and sometimes equity or partnership economics to advisors who want
              independence but not the burden of building their own RIA from scratch. Dynasty Financial Partners backed
              the breakaway of OpenArc, which managed approximately $130 billion in assets when it departed Merrill
              Lynch—a high-profile data point demonstrating Dynasty's ability to support very large team transitions.
              Dynasty's service offering spans entity formation, investment operations, technology, compliance, and
              business consulting. This model is fundamentally different from Farther's: Dynasty advisors remain
              independent principals who own their client books, whereas Farther advisors are W-2 employees whose client
              relationships are ultimately owned by the Farther entity. The economic trade-off is clear: Dynasty
              advisors earn full enterprise value of their practice at sale, while Farther advisors trade some of that
              upside for equity participation in the Farther platform and relief from back-office overhead. Carson Group
              operates an advisor partnership model with equity stakes in the consolidated firm, and Steward Partners
              operates as an employee-based RIA affiliated with Raymond James, both offering equity participation that
              competes directly with Farther's equity proposition. Cerulli research shows that RIA consolidators
              collectively exceeded $1.5 trillion in AUM and are beginning to resemble broker-dealers in organizational
              structure and distribution dynamics, reflecting the maturing of the aggregator model. Farther's recruiting
              success—over 11,000 advisors changed firms industrywide in 2025, up 16.2% year-over-year—is partially
              driven by this structural movement but also subject to it: any large aggregator that combines attractive
              economics with better technology will compete for the same advisor candidates.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP018
