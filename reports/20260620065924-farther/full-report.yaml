      - number: '4.5'
        title: Regulatory Disclosures and Adverse Financial Signals
        blocks:
          - type: paragraph
            body: >-
              AdvisorSearch.org's aggregation of Farther's SEC IAPD Form ADV data as of January 2026 identifies two
              regulatory disclosure alerts: an Activity Restriction from a Self-Regulating Organization (SRO), affecting
              approximately 2.0 percent of RIA firms per SEC data, and an Attorney/Accountant Authorization Revocation
              affecting approximately 0.2 percent of firms. These disclosures appear in SEC Form ADV Item 11, which
              covers legal and disciplinary history. The specific nature, timing, and ongoing impact of these
              disclosures have not been confirmed through direct access to the full Form ADV Part 1A; the IAPD summary
              page returned only navigation content on the research date, limiting deeper review. Diligence should
              include a direct pull of the full Form ADV and a direct management explanation of both items before any
              investment decision.


              Form ADV filings are self-reported by investment advisers without independent audit or external
              verification. All AUM, client count, and advisor headcount metrics reported by Farther or derived from
              Form ADV data carry the inherent limitation of self-reporting. Farther has never published externally
              audited financial statements and is not obligated to do so as a private company; this means every
              financial claim — including the Inc. 5000 revenue growth rate, the recruited-assets milestone, and all AUM
              figures — rests on management assertion without third-party verification.


              The active poaching of advisors from Goldman Sachs and other wirehouses introduces litigation exposure.
              Goldman Sachs in particular has historically pursued claims against departing advisors under its protocol
              and non-solicitation agreements. RIABiz noted Farther's own acknowledgment of the legal risk in its 2024
              Goldman Sachs poaching episode. While no public court filings, FINRA arbitrations, or news reports
              documenting active litigation against Farther from poaching have been identified as of the research date,
              the absence of confirmed litigation does not eliminate the risk, particularly given the scale of the
              Seidenstein hire ($1.5 billion book) and the ongoing pace of Goldman-adjacent recruiting.
