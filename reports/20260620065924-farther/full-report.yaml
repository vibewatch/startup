      - number: '6.2'
        title: Adoption Trajectory and Asset Growth
        blocks:
          - type: paragraph
            body: >
              Farther's growth trajectory is one of the most aggressive in the independent RIA channel. Starting with
              zero clients and zero AUM at launch in April 2020, Farther reached $375M in assets by mid-2023, then grew
              13x to $5B by late 2024 — representing approximately 5x year-over-year growth. By January 2026, AUM stood
              at $15B according to the farther.com for-clients page, and the May 2026 Series D announcement declared
              $23B in "recruited assets" (a broader metric including AUM plus assets expected from advisors in the
              onboarding pipeline). This trajectory supports the Inc. 5000 ranking of Farther as the #1 fastest-growing
              financial services firm in America with 11,968% three-year revenue growth ending 2025.

              Advisor headcount is the core acquisition driver. As of February 2025, AdvisorSearch (sourcing from SEC
              IAPD data) counted 277 active advisors serving 14,965 clients at a 1:54 advisor/client ratio, with $16B in
              reported AUM. By April 2026, management disclosed approximately 200+ wealth managers and ~19,000 clients
              (InvestmentNews). The quarterly recruiting pace accelerated through 2025: 23 advisors in H2 2024, 27
              advisors in Q2 2025 alone from 15 states, and the Commonwealth LPL disruption added 16 advisors managing
              $1.7B in a single recruiting wave. Farther claims 3x organic advisor growth vs. the industry average, with
              90% of advisor time redirected to client wealth strategy rather than back-office tasks. This platform
              efficiency is the core value proposition that drives recruiting from wirehouses.
