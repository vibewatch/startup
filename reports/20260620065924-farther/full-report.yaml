      - number: '7.2'
        title: Advisor Recruiting, Legal Liability, and Custodial Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Farther's growth model is fundamentally dependent on the continuous flow of advisors departing
              broker-dealers and wirehouse platforms and bringing their existing client books. This creates two
              interconnected legal risk vectors: (1) client data portability exposure and (2) non-compete / non-solicit
              enforceability.


              On data portability: the Ameriprise v. LPL Financial dispute — in which Ameriprise accused LPL of using a
              bulk-upload tool to facilitate advisors transferring client Social Security numbers and account numbers —
              illustrates the legal exposure that any RIA recruiter faces when advisors depart carrying client data.
              While the District Court ultimately halted forensic device searches because the merits arbitration was
              imminent, the case confirms that recruiting firms can face substantial legal discovery costs, reputational
              damage, and FINRA arbitration exposure related to data portability practices. Farther has recruited from
              Goldman Sachs, LPL/Commonwealth, Raymond James, and other major platforms; RIABiz reported that Farther
              "held its breath" when recruiting Goldman advisors, explicitly describing awareness of potential legal
              retaliation from well-resourced incumbent firms. No actual litigation against Farther has been identified
              in public records, but the structural exposure is material and ongoing.


              On non-compete/non-solicit enforceability: a June 2026 North Carolina Business Court ruling (TMRW Wealth
              v. Abitz) dismissed non-competition and non-solicitation claims against a departing advisor with
              prejudice, finding both clauses facially overbroad under controlling law. The ruling's logic — that
              non-solicitation clauses cannot reach clients the employee did not actually serve, and that non-competes
              must restrict only work identical to the employee's actual duties — applies broadly across the wealth
              management industry. Farther explicitly markets that it does not take equity in advisors' revenue streams
              and grants equity in the firm; however, the company has not disclosed the terms of its own employment
              agreements or what post-departure client restrictions, if any, it relies upon. If Farther's advisor
              agreements contain overbroad provisions, they may be unenforceable, leaving client books vulnerable to
              departure.


              Custodial concentration risk is a related dependency: Farther uses multiple custodians (Schwab, Fidelity,
              Pershing, Apex) for asset custody, meaning a platform outage, custody fee dispute, or relationship
              termination at a primary custodian would disrupt operations for a portion of the advisor and client base.
              Schwab's 2025 RIA Outlook data shows that custodial switching costs are high and multi-custodian
              transitions are disruptive. No backup custodian strategy has been publicly disclosed.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
