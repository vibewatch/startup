              The unified platform architecture that creates Farther's workflow efficiency also creates advisor
              switching costs — advisors who build workflows around the Farther-native CRM, TLH, FAM, and portal may
              face significant friction if they decide to leave. This is positive for retention but means that advisor
              evaluation of the platform is effectively a long-term commitment decision, making sales cycles longer and
              raising the stakes of any platform reliability issues.
