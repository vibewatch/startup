      - number: '1.3'
        title: Funding history, capital structure, and investors
        blocks:
          - type: paragraph
            body: >-
              Farther closed a $150 million Series D led by General Atlantic on May 21, 2026, the round that confirmed
              unicorn status. Existing investors including CapitalG (Alphabet's independent growth fund), Bessemer
              Venture Partners, Cota Capital, and MassMutual Ventures participated alongside General Atlantic. The
              Series D announcement cited recruited assets surpassing $23 billion and framed the round as positioning
              Farther to triple year-over-year growth since Q1 2025. General Atlantic's Managing Director and Global
              Head of Financial Services, Paul Stamas, and Vice President Laura Chen were quoted in official materials,
              indicating a high-engagement lead investor relationship.


              The preceding round was a $72 million Series C closed in October 2024, co-led by CapitalG and Viewpoint
              Ventures, which placed a post-money valuation of $542 million on the company at a point when AUM had
              surpassed $5 billion. CapitalG's General Partner Jesse Wedler was quoted in the Series C materials stating
              years of evaluation preceded the investment. Prior rounds — seed, Series A, and Series B — are not
              publicly detailed in available sources; the implied aggregate from the task context is approximately $50
              million for pre-Series C rounds. Total lifetime capital raised exceeds $272 million across all rounds as
              of May 2026. Exact investor ownership percentages and the full capitalization table remain private.


              One discrepancy is noteworthy: Built In NYC described the May 2026 round as a "Series F" while Farther's
              own press release, AdvisorHub, WealthManagement.com, Fintech.Global, and other mainstream outlets
              uniformly describe it as a Series D. The Series F label in the Built In article appears to be an editorial
              error and should not be treated as factual. Later chapters should use Series D as the canonical round
              label.
