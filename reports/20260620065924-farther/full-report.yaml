            title: Private markets and FAM methodology are entirely opaque
            body: >-
              Farther Asset Management's investment methodology, performance track record, benchmark construction, and
              private markets deal-flow sourcing are not publicly available. The direct indexing offering has no
              disclosed minimum account size or index universe. For any counterparty conducting investment manager due
              diligence, these are standard pre-investment disclosures that Farther currently cannot satisfy from public
              sources. A Form ADV Part 2A review is a minimum required step.
