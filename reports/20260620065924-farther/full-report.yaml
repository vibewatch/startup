            title: Ground-up AI-native architecture is a real structural advantage
            body: >-
              Unlike legacy wealth platforms that retrofit AI onto 1970s-era systems, Farther built its platform from
              inception with AI at its core. The founding team's prior exposure to fragmented private-wealth workflows
