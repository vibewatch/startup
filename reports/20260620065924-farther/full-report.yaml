  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Farther's addressable market is the U.S. registered investment advisory (RIA) services market, defined as
              fee-based fiduciary wealth management delivered by SEC-registered investment advisers to individual and
              institutional clients. Included spend covers AUM-based advisory fees (typically 0.75%–1.25% per year),
              financial planning retainers, and portfolio management fees charged directly by the advisory firm.
              Excluded from this boundary are broker-dealer sales commissions, mutual fund and ETF management expense
              ratios embedded inside investment products, insurance premiums, and fee revenue of bank-affiliated trust
              departments that do not separately hold an RIA registration.


              The independent RIA channel—firms unaffiliated with a broker-dealer or bank parent—is the primary market
              segment for Farther's recruiting and platform model. As of December 2025, this channel comprised
              approximately 6,421 independent firms managing roughly $14.3 trillion in AUM per Dakota Marketplace data.
              The broader SEC-registered adviser universe (21,669 firms, $146T RAUM as of 2024) provides an outer
              ceiling for total addressable market analysis but encompasses institutional, pension, and bank-affiliated
              managers that are not Farther's primary targets.


              Farther faces four principal status-quo substitutes: (1) full-service wirehouses (Morgan Stanley, Merrill
              Lynch, Wells Fargo, UBS) that supply advisor infrastructure, compliance, and brand in exchange for
              fee-sharing and product distribution economics; (2) independent broker-dealers offering partial advisor
              autonomy within a hybrid model; (3) established RIA wealthtech platforms—Envestnet (supporting $6.5T
              across 20 million accounts), Orion, Altruist, and Savvy—that provide technology without an employment or
              equity relationship; and (4) the fully self-managed independent RIA path. Each substitute carries
              different tradeoffs of economics, technology capability, client-ownership rights, and compliance support.
              Two adjacencies extend Farther's optional TAM: the multi-family office segment for UHNW families ($50M+
              investable assets) addressed by Farther Family Office, and the small-business institutional advisory
              market—both early-stage opportunities rather than core near-term TAM.
