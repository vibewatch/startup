companyProfile:
  summary: >-
    Farther is an AI-native registered investment adviser (Farther Financial Advisors LLC, SEC CRD 302050) founded in
    New York in 2019 by Taylor Matthews (CEO) and Brad Genser (CTO). Publicly launched in April 2020, the company grew
    from approximately $1 billion in AUM at founding to $15 billion in managed AUM and $23 billion in recruited assets
    by May 2026, when it closed a $150 million Series D led by General Atlantic and confirmed unicorn status. Farther's
