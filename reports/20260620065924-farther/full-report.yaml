              On the firm-level side, three named RIA partnerships — SignalPoint Asset Management ($650M, ~500 Midwest
              families), Focus Financial Advisors ($130M, Rockford IL), and WMBC ($120M, California) — all join under
              branded co-branding agreements ("powered by Farther"), providing direct client organization testimonials.
              Jon Timson of SignalPoint cited "technology and operational infrastructure that aligns with our vision for
