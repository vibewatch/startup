      - number: '1.2'
        title: Founders, leadership team, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Farther was co-founded by Taylor Matthews and Brad Genser. Matthews, who serves as CEO and is based in San
              Francisco, previously served on the leadership team at ForUsAll where he helped grow assets under
              management from $25 million to nearly $1 billion in two years. Genser, who serves as CTO, was previously a
              Vice President at Goldman Sachs from 2014 to 2019 where he founded and led an AI team dedicated to private
              wealth management. Their complementary backgrounds — distribution-focused operations for Matthews and
              technical AI/ML architecture for Genser — are consistently cited in investor profiles and company
              materials as the basis for Farther's technology-first thesis.


              The current leadership team listed in official company materials includes David Kilin (CFO), Thor Gould
              (Global Head, Farther Advisors — appointed as Managing Director in mid-2025), Ben Seidenstein (Global
              Head, Farther Family Office — hired April 2026 from Goldman Sachs where he managed over $1.5 billion in
              client assets over 13 years), Chris Powers (Chief Compliance Officer), Nick Panitsas (Chief Investment
              Officer, Farther Asset Management), Megan Bailey (VP, Head of Growth), Nicholas Corvino (VP, Head of
              People), Cara Williams (VP, Advisor and Client Experience), and Kate Gordon (Head of Business Operations).
              In mid-2025 Farther also appointed Bryan D'Alessandro and Tim Bohnett as Managing Directors alongside
              Gould, signaling institutional build-out in the advisor success function.


              Key-person concentration is material. Taylor Matthews controls strategic direction, is the primary public
              face for fundraising and recruiting narratives, and appears to hold the central relationship with the
              major investor constituency. Brad Genser owns the technical roadmap for a platform that is Farther's
              primary competitive differentiator. The departure of either founder would represent a serious diligence
              concern. The Seidenstein hire from Goldman Sachs, while a depth-building signal, also creates a modest
              key-person dependency in the newly launched FFO segment.
