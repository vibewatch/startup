      - number: '3.2'
        title: 'Technology-Native RIA Platforms: Altruist, Orion, and Savvy Wealth'
        blocks:
          - type: paragraph
            body: >-
              Altruist is a full-service custodian and RIA platform built exclusively for independent advisors. It
              offers digital account opening, portfolio rebalancing, direct indexing via simplified models, and a model
              marketplace, positioning itself as a cost-reduction alternative to legacy custodians such as Schwab and
              Fidelity for smaller RIAs. In late 2025, Altruist launched TaxIQ, a tax management suite, and introduced a
              smart rebalancing feature called Review & Release, expanding further into Farther's core value proposition
              of tax-intelligent returns. Altruist's structural advantage is custodian status, which Farther lacks,
              making Altruist a one-stop-shop for the advisor who wants to run an independent RIA without a Schwab or
              Fidelity custodian relationship. However, Altruist does not include advisory services and does not recruit
              advisors onto a W-2 basis. Orion operates twelve connected products organized across three functional
              clusters: trading and operations (portfolio accounting, compliance, risk intelligence), data and AI
              (Denali Data Layer, Denali AI, Strategic Insights), and client relationships (Redtail CRM, client portal,
              advisor portal). Orion states that its clients grew organically nearly 40% faster than non-Orion firms in
              2025. Orion's Denali AI is positioned as enterprise AI that amplifies advisor impact across connected
              systems—a direct capability overlap with Farther's AI-native claims. Orion's Redtail CRM was the
              industry's most-adopted advisor CRM by headcount but declined from approximately 46% to 26% market share
              between 2021 and 2025 as Wealthbox (22% share) and Advyzon (12% share) gained ground. Savvy Wealth reports
              approximately $5 billion in AUM and more than 100 advisors, and offers an all-in-one platform with an
              AI-powered CRM, digital onboarding, compliance offloading, and in-house marketing agency. Savvy's up to 19
              hours per week in workflow savings claim mirrors Farther's admin-reduction pitch and its brand-flexibility
              model (advisors can operate under Savvy's RIA entity or their own brand) targets the same breakaway
              segment. Savvy represents the clearest direct analog to Farther among venture-backed new entrants.
