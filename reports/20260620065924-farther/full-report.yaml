      - number: '4.6'
        title: Financial Verdict and Diligence Agenda
        blocks:
          - type: paragraph
            body: >-
              Farther's revenue model is structurally high-quality — recurring, AUM-linked, and free of conflicted
              commission structures — but it is not independently verifiable. The regulatory AUM of $16 billion and
              implied advisory revenue of $80–$160 million per year represent the most reliable publicly available
              financial signal, but even this range carries low confidence because the actual fee schedule, payout
              ratio, and advisor productivity distribution are all undisclosed. The gap between recruited assets ($23
              billion) and regulatory AUM ($16 billion) requires buyers to obtain a confirmed breakdown of pipeline
              versus managed assets before underwriting to the higher figure.


              The $1 billion+ unicorn valuation implies a technology-platform premium well above traditional
              AUM-multiple RIA valuations. At $16 billion in regulatory AUM the implied price-to-AUM ratio is 6–7x
              versus a typical RIA M&A multiple of 2–3 percent of AUM, suggesting the market is pricing a technology
              platform, not a traditional advisory firm. That valuation is defensible if Farther's technology genuinely
              enables superior advisor productivity and client outcomes at scale, but it is highly sensitive to
              execution risk on the recruiting and transition pipeline. The series of four institutional rounds in seven
              years, accelerating in size from Series C ($72 million) to Series D ($150 million), indicates a
              growth-capital model that is likely to require continued raises before reaching profitability.


              The five blocking diligence items are: (1) audited financial statements for FY2023–FY2025, (2) fee
              schedule and average realized advisory fee rate, (3) monthly burn rate and current cash balance, (4)
              breakdown of recruited assets versus regulatory AUM with transition-rate data, and (5) full Form ADV Part
              1A including the nature of both SRO and attorney/accountant regulatory disclosures. Until these items are
              obtained, revenue quality, margin outlook, and capital runway cannot be independently underwritten.
