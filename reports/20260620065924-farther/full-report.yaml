      - number: '6.4'
        title: Retention, Satisfaction, and Durability Gaps
        blocks:
          - type: paragraph
            body: >
              Farther discloses no NPS, GRR, NRR, or advisor retention metrics. The absence of published durability data
              is a significant diligence gap for an early-stage RIA platform growing rapidly through advisor
              recruitment. The core risk is two-sided: advisor churn (advisors taking client books back out) and client
              household churn driven by advisor changes. Both are exacerbated by Farther's own differentiating policy
              feature — the zero non-compete agreement — which eliminates a key retention lever for the firm.

              Farther partially mitigates advisor churn through equity ownership (advisors receive equity in Farther),
              industry-leading payouts, and a W-2 employment structure with benefits. The equity component specifically
              creates a financial incentive for advisors to remain and grow their value stake. However, no lockup
              periods, vesting schedules, or non-compete terms are disclosed publicly, meaning these retention
              mechanisms cannot be independently verified.

              AdvisorSearch flagged disciplinary alerts in Farther's Form ADV filings (January 2026 SEC data):
              specifically, an SRO Activity Restriction and a Business License Revocation at the firm or affiliate
              level. These do not necessarily indicate systemic compliance failures, but they represent unresolved flags
              that a diligence process should interrogate — particularly given the RIA's rapid growth and the regulatory
              complexity of managing books from multiple wirehouse channels simultaneously.
            claimRefs:
