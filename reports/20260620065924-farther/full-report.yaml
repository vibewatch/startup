      - number: '2.2'
        title: Market sizing — TAM, SAM, and SOM across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Three sizing lenses converge on the independent RIA opportunity. The broadest TAM is the total
              SEC-registered investment adviser universe: 21,669 advisers managing $146 trillion in regulatory AUM as of
              2024, a 12.8% year-over-year increase. This figure encompasses institutional asset managers, pension
              advisers, and bank trust departments far outside Farther's model and serves as a ceiling bound only.


              The operationally relevant TAM is the independent RIA channel: approximately 6,421 firms tracking $14.3
              trillion in AUM as of December 2025 per Dakota Marketplace. Applying the industry modal advisory fee of
              approximately 1.0% annually yields a $143 billion annual advisory fee revenue proxy. Sensitivity to
              fee-rate assumptions produces a plausible range of $107–179 billion (at 0.75%–1.25% respectively). No
              public source reports aggregate advisory fee revenue for the independent RIA channel; this range is a
              derived estimate and should be treated as an order-of-magnitude proxy, not a measured figure. Nearly 70%
              of independent RIAs manage under $700 million, yet collectively control less than 9% of channel assets;
              firms above $1 billion represent 22% of firms but control 88% of total assets—concentration dynamics that
              favor integrated platforms.


              Looking forward, Cerulli Associates projects managed account assets to nearly triple from $13.7 trillion
              in 2024 (after 19.8% growth that year) to $31.8 trillion by 2028. The HNW segment ($5M+ investable assets)
              is projected to surpass $30 trillion by 2028 at approximately 9.3% CAGR per Cerulli—the premium tier most
              relevant to Farther's full-service model and Farther Family Office. The independent RIA channel itself is
              projected to grow advisor headcount 11.8% by 2028 per Cerulli, more than double the 4.7% projected for
              independent broker-dealers.


              Farther's SOM is anchored at $23 billion in recruited assets (company-stated, May 2026) and approximately
              $16 billion in confirmed AUM (SEC IAPD, February 2025). Against $14.3 trillion in independent RIA AUM,
              Farther currently represents approximately 0.16% channel penetration. Farther's advisor capacity—277
              licensed advisors at a 1:54 advisor-to-client ratio—is the primary constraint on near-term SOM expansion,
              not the size of the addressable client pool.
