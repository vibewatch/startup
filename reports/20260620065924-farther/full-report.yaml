              The regulatory identity is well-established. Farther Financial Advisors LLC is SEC-registered with CRD
              number 302050 and serves all 51 states. AdvisorSearch's review of Farther's SEC ADV filing (sourced from
              SEC IAPD data as of January 2026) identified multiple disciplinary disclosure alerts flagged in the ADV,
              covering categories including SRO activity restrictions, attorney/accountant authorization revocations,
              business license revocations, and civil action dismissals upon settlement affecting the firm or advisory
              affiliates. These alerts are not rare across RIA networks of Farther's scale and may relate to individual
              advisor histories rather than firm-level enforcement, but they represent items that require direct
              verification in due diligence before the regulatory record can be treated as clean.


              The RIABiz reporting from July 2024 documented that Goldman Sachs filed arbitration claims against some
              former PFM advisors who joined Farther, and that Farther's CEO stated the firm was "in good shape" with
              respect to those claims. This adversarial recruiting episode does not appear to have resulted in
              firm-level sanctions but underscores that Farther's aggressive talent acquisition strategy carries ongoing
              legal exposure. The full milestone chronology is captured in the milestone table and the timeline figure.
