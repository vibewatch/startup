  - id: FR002
    title: Risk Transmission Map — How Risks Flow to Revenue, Clients, and Capital
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing primary transmission pathways from root causes to outcome impacts on revenue,
      client retention, and capital access.
    data:
      nodes:
        - id: reg_enforcement
          label: Regulatory Enforcement (SEC/FinCEN)
          detail: Triggered by AML non-compliance, Reg S-P failure, AI-washing, or off-channel records gaps
        - id: form_adv_disclosures
          label: Form ADV Item 11 Disclosures
          detail: Three undisclosed disciplinary alerts; specific nature and impact unknown
        - id: data_breach
          label: Customer Data Breach
          detail: Email account takeover; unauthorized wire transfer; PII exposure for ~15K HNW clients
        - id: market_downturn
          label: Equity Market Downturn (>20%)
          detail: AUM declines proportionally; fee revenue drops; fixed W-2 costs remain
        - id: advisor_departure
          label: Senior Advisor / Founder Departure
          detail: Matthews, Genser, or Seidenstein departure; loss of book or platform continuity
        - id: aum_revenue
          label: AUM-Based Revenue Decline
          detail: Revenue falls with AUM; no fee diversification; estimated 50-100 bps on $16B
        - id: client_attrition
          label: Client and Advisor Attrition
          detail: Trust erosion from breach or enforcement; advisor book transfers to competitor
        - id: capital_access
          label: Impaired Follow-on Capital Access
          detail: Down round or blocked Series E; forces cost cuts or accelerated M&A exit
        - id: valuation_impairment
          label: Unicorn Valuation Impairment
          detail: AUM multiple compression; revenue miss; regulatory discount applied to enterprise value
      edges:
        - from: form_adv_disclosures
          to: reg_enforcement
          label: unresolved history raises exam probability
        - from: reg_enforcement
          to: client_attrition
          label: enforcement triggers reputation damage
        - from: reg_enforcement
          to: capital_access
          label: enforcement creates investor pause
        - from: data_breach
          to: reg_enforcement
          label: breach triggers SEC Reg S-P enforcement
        - from: data_breach
          to: client_attrition
          label: PII exposure causes direct client loss
        - from: market_downturn
          to: aum_revenue
          label: 1:1 AUM-to-revenue transmission
        - from: aum_revenue
          to: valuation_impairment
          label: revenue multiple compression at unicorn valuation
        - from: aum_revenue
          to: capital_access
          label: revenue miss raises Series E risk
        - from: advisor_departure
          to: client_attrition
          label: advisor book follows departing advisor
        - from: advisor_departure
          to: aum_revenue
          label: book departure reduces AUM directly
        - from: client_attrition
          to: aum_revenue
          label: client loss reduces AUM and revenue
        - from: valuation_impairment
          to: capital_access
          label: down round impairs ability to recruit with equity
    claimRefs:
      - CR003
      - CR009
      - CR016
      - CR025
      - CR030
      - CR031
      - CR034
      - CR037
      - CR042
    approximationNotes: >-
      Transmission map reflects qualitative linkages derived from regulatory guidance, industry precedent, and financial
      model analysis; it does not model probabilities.
