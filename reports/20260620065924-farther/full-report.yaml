      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The wide scenario range reflects the lack of financial disclosure rather than genuine uncertainty about
              Farther's business quality. In all three scenarios, the core operating model — platform-led wealth
              management with AI-native tooling and recruited advisors — is assumed intact. The primary swing variables
              are: (a) AUM-to-revenue conversion rate; (b) the rate at which recruited assets become billable managed
              AUM; (c) operating leverage as fixed technology costs amortize over a growing advisor base; and (d) the
              exit multiple the market assigns at IPO or M&A.


              The bull case requires that managed AUM reaches $50–60 billion within 30 months (driven by current
              recruiting momentum, Family Office UHNW flows, and market appreciation), that an AUM-based fee of
              approximately 50 basis points produces $250–300 million in gross revenue by mid-2028, and that an IPO or
              strategic acquisition values the platform at 10–15× forward revenue — implying a $2.5–4.5 billion exit.
              General Atlantic's track record of scaling financial services firms from unicorn to public market
              (Creative Planning positioning) supports the plausibility of this path.


              The base case assumes more conservative AUM growth (toward $35–45B by 2027–2028) and a partial market
              multiple compression toward 7–10× revenue, yielding a valuation in the $1.5–2.5 billion range. Exit via
              M&A to a major bank, broker-dealer, or RIA aggregator at 1–2× current valuation remains the most likely
              liquidity event for near-term investors.


              The bear case reflects AUM growth stalling due to competitive pressure, advisor attrition, or a 20–30%
              market drawdown, combined with disciplinary item resolution triggering regulatory remediation costs. In
              this scenario, a follow-on round would be required below the $1B mark — a down-round — and the GA-led
              syndicate would face material write-down risk. The trigger sensitivity figure (FV002) illustrates how
              assumptions on AUM growth and revenue yield shift expected valuation outcomes. The range figure (FV003)
              maps low/base/high exit outcomes under explicit assumptions.
