      - number: '7.3'
        title: Technology, Operational, and Data Security Risks
        blocks:
          - type: paragraph
            body: >-
              Farther's technology-first positioning is both a competitive differentiator and a concentrated operational
              risk. All 277 advisors operate through a single proprietary platform — the Intelligent Wealth Platform —
              which means a platform failure, security incident, or critical software defect affects the entire advisor
              and client base simultaneously. No disclosed SOC 2 Type II certification, uptime SLA, business continuity
              plan, or disaster recovery documentation has been identified in any public source. This gap is material
              given the SEC's 2026 emphasis on "operational resiliency" as a standalone examination priority.


              Data security risk is heightened by the nature of Farther's business: 14,965 client accounts holding an
              average of $1.1 million each contain substantial personally identifiable information (PII) including
              Social Security numbers, income and tax data, investment account details, and private market holdings. The
              Lowenstein Sandler legal alert describing the SEC's December 2025 enforcement action against a dual
              RIA/broker- dealer for Regulation S-P and S-ID violations is directly analogous: that firm suffered email
              account takeovers across 17 accounts, compromising approximately 8,500 individuals, after failing to
              enforce basic controls including multifactor authentication and written incident response frameworks. The
              SEC's 2026 exam priorities specifically focus on whether firms have policies to detect and respond to
              customer account takeovers and fraudulent wire transfers — the exact failure mode observed in the
              enforcement precedent.


              Farther's AI platform creates additional regulatory scrutiny. The SEC's 2026 examination priorities call
              out "AI-washing" — misleading claims about AI capabilities — as a specific examination target. Farther's
              marketing consistently uses terms like "AI-native platform" and "intelligent wealth management," and its
              Series D press materials prominently feature AI as a central value proposition. If the platform's actual
              AI functionality does not match marketing descriptions in Form ADV, client materials, and press releases,
              the firm faces enforcement exposure. Mercer Capital's 2026 wealth management report notes that across the
              RIA industry, formal AI governance policies are in place at only 35% of firms, creating broad exposure for
              firms that market AI capabilities without adequate internal controls. Farther has not publicly disclosed
              its AI governance framework, model validation protocols, or bias testing procedures.


              The AML/CFT compliance implementation requirement under the FinCEN/SEC final rule imposes new
              program-build obligations — customer due diligence, transaction monitoring, SAR filing — that are not
              native to traditional RIA compliance functions. For a firm scaling from 5 to 16 billion in AUM in under
              two years, building the compliance infrastructure in parallel with rapid growth is operationally
              demanding. No public disclosure of a compliance officer hire or program-build announcement has been made
              relative to these new obligations.
