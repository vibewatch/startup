      - number: '5.2'
        title: Core product modules and advisor-client workflow
        blocks:
          - type: paragraph
            body: >-
              Farther's platform delivers seven public-facing product modules across the advisor and client surfaces.
              The tax execution suite is the most prominently featured: continuous tax-loss harvesting (TLH) operates
              year-round rather than at end-of-year, while sophisticated asset location strategically places assets
              across taxable and tax-advantaged account tiers to minimize overall household tax drag. A transparent tax
              impact calculator shows clients projected tax outcomes before any trade executes, enabling collaborative
              advisor-client decision-making. Personalized portfolio exclusions prevent unintended trades (e.g.,
              concentrated employer stock positions) without sacrificing diversification. An automated rebalancer
              maintains target allocations and harvests additional tax-loss opportunities continuously.


              On the advisor operations side, the CRM integration module provides a full client lifecycle view from
              prospect through client, while CX & Ops Tasks converts inbound service requests and advisor emails into
              structured, prioritized work items backed by a human support team. Transition proposal tools streamline
              the administrative burden of asset transfers from prior custodians. The financial planning module
              integrates a client's full asset, liability, and account universe into a dynamic plan that adapts over
              time. Advisors also have access to personalized marketing pages, centralized collateral, and enhanced
              lead-generation tooling.


              For clients, the portal provides a consolidated financial dashboard, document storage, secure
              communication, and a collaboration space that can be shared with CPAs, attorneys, and family members. The
              Farther website also features service lines for generational wealth planning, which coordinates the full
              financial ecosystem (advisors, family members, legal professionals, accounts) into one integrated view for
              multi-generational clients.
