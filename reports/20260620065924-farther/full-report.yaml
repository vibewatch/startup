            and economics
        - id: discovery
          label: Discovery & Outreach
          description: >-
            Industry press (AdvisorHub, RIABiz), peer referrals, Commonwealth/Goldman disruption events, Farther
            recruiter outreach
        - id: onboarding
          label: Platform Onboarding (30-day)
          description: >-
            W-2 employment, equity grant, no non-compete, no mandatory minimum; AUM migration to
            Schwab/Fidelity/Pershing/Apex custodians
        - id: active-advisor
