            body: >-
              Farther markets AI as central to its value proposition but has published no AI model governance framework,
              no SOC 2 certification, and no security whitepaper. As the SEC's 2026 regulatory focus expands into
              AI-disclosure requirements for investment advisers, the absence of these disclosures becomes both a
              regulatory risk and a client-trust risk. Institutional advisors evaluating the platform face a vendor risk
              gap that competitors with SOC 2 certifications (common among mature RIA technology providers) do not
              present.
