      - number: '2.5'
        title: Sizing gaps, contradictory estimates, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Four material sizing gaps limit the precision of this market analysis. First, no public source discloses
              aggregate advisory fee revenue for the independent RIA channel; the $107–179 billion estimate is derived
              from AUM and fee-rate assumptions, not measured data. This is the most important gap for modeling
              Farther's revenue potential. Second, Farther's SAM is not publicly bounded: the company has not disclosed
              its target advisor count, target AUM per advisor, internal capacity model, or advisor-pipeline conversion
              rate. Third, the impact of RIA M&A consolidation on the breakaway advisor pool is ambiguous—as PE-backed
              mega-platforms absorb mid-market RIAs, the pool of accessible breakaway recruits may contract. Fourth, no
              per-advisor revenue or margin benchmarks exist in public sources for integrated RIA platforms at Farther's
              stage.


              Two frequently cited figures create market-size confusion. The InvestmentNews headline describing the RIA
              market as "approaching a $4 trillion mark" refers specifically to the estimated M&A acquisition
              pipeline—advisor retirement and breakaway AUM available for consolidators—not to total channel AUM. The
              Cerulli estimate of $3.9 trillion in acquirable AUM across 66,000+ advisor exits is a deal-flow measure,
              not a channel size. The Dakota $14.3 trillion and SEC $146 trillion are measuring entirely different
              boundaries (independent RIA only versus all registered advisers) and are not comparable as alternative
              estimates of the same market.


              Farther's own "recruited assets" metric ($23 billion) includes assets at prior custodians that are in
              transit or pending transfer, while SEC IAPD-reported AUM of approximately $16 billion reflects assets
              actually under management. The approximately $7 billion gap is material for revenue run-rate estimation.
              Diligence should clarify the percentage of recruited assets that convert within 12 months, average revenue
              per converted dollar, and pipeline attrition rate.
            claimRefs:
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Two-sided market — advisor adoption is the growth bottleneck
            body: >-
              Farther's market is structurally two-sided but advisor-led: the advisor is buyer, user, and primary client
              acquisition channel in a single role. Winning an advisor recruit is functionally equivalent to winning
              their book of client assets, meaning Farther's growth ceiling is set by advisor recruitment capacity, not
              the size of the client opportunity. Cerulli's 11.8% independent RIA channel headcount growth projection
              through 2028 is the most important leading indicator for Farther's SAM expansion trajectory.
            calloutType: insight
            claimRefs:
              - CM018
              - CM020
              - CM028
          - type: callout
            title: PE-backed consolidators are replicating Farther's W-2 plus equity model
            body: >-
              Mariner, Hightower, Creative Planning, Carson Group, and Corient have significantly more capital than
              Farther and have begun offering W-2 plus equity programs that directly replicate Farther's primary
              recruiting differentiation. The top ten RIA acquirers completed over 100 transactions representing more
              than $880 billion in acquired assets in 2025. Farther's recruiting advantage depends on sustaining
              technology superiority that larger but slower-moving platforms cannot quickly replicate.
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM035
          - type: callout
            title: Advisory fee revenue TAM is a derived estimate, not a reported figure
            body: >-
              The $107–179 billion annual advisory fee revenue range is derived by applying fee-rate assumptions of
              0.75%–1.25% to Dakota's $14.3 trillion independent RIA AUM figure. Neither aggregate advisory fee revenue
              nor exact independent RIA AUM is publicly reported with precision. The figure is an order-of-magnitude
              proxy; actual achievable TAM is likely lower due to fee compression and the subset of advisors who would
              not join Farther's W-2 model.
            calloutType: assumption
            claimRefs:
              - CM011
              - CM039
              - CM041
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Three Overlapping Layers'
        blocks:
          - type: paragraph
            body: >-
              Farther faces competition across three structurally distinct layers that partially overlap. The first
              layer is technology-native RIA platforms: firms that have built advisor-facing technology stacks from
              scratch and use that technology to differentiate the advisor recruiting and client-service proposition.
              Altruist and Savvy Wealth are the clearest direct peers in this tier, both targeting breakaway advisors
              with integrated custody or operations and AI-powered workflows. The second layer is enterprise wealthtech
              incumbents: large B2B software and services firms such as Orion and Envestnet/Tamarac that serve the
              independent advisory market with integrated portfolio management, trading, CRM, and compliance tooling.
              These incumbents do not directly compete for advisors but compete for the technology wallet and platform
              loyalty of advisors who might otherwise prefer Farther's integrated stack. The third layer is advisor
              network aggregators: partnership and affiliation models such as Dynasty Financial Partners, Carson Group,
              and Steward Partners that offer advisors infrastructure, back-office services, and sometimes equity as
              alternatives to full independence or wirehouse employment. Status-quo substitutes complete the competitive
              set: wirehouse employees who have not yet broken away, solo RIA practitioners using a multi-vendor cobbled
              stack, and advisors who choose broker-dealer affiliation rather than RIA conversion. The overall RIA
              landscape tracked 6,421 independent RIAs overseeing approximately $14.3 trillion in assets as of December
              2025, creating an enormous recruitment-addressable market and fueling intense platform competition.
              Consolidator activity—over 370 M&A transactions covering more than $2 trillion in AUM in 2025—is
              accelerating scale concentration and making the competitive environment more dynamic.
