        title: Named Customer and Advisor Transition Proof
        blocks:
          - type: paragraph
            body: >
              Farther's customer proof is strongest in the named advisor-transition category, where the public record
              documents several large book-of-business moves with specific AUM amounts and direct testimonials. The most
              significant transitions include Ben Seidenstein's $1.5B Goldman Sachs book (April 2026, leading the
              Farther Family Office), 16 Commonwealth advisors committing $1.7B in a single recruiting wave (2025), and
