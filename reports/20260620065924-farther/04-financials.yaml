    title: Revenue Model Bridge
    type: flow
    layout: standard
    summary: >-
      How client AUM converts to Farther's gross advisory revenue, advisor payout pool,
      and unconfirmed net operating result; all internal dollar flows are estimated or undisclosed.
    data:
      nodes:
        - id: client_aum
          label: Client AUM Pool
          detail: "$16B regulatory AUM (Form ADV, early 2025); $23B recruited-assets pipeline (May 2026, company-stated)"
        - id: fee_rate
          label: Advisory Fee Rate
          detail: "AUM-based annual fee; list rate undisclosed; industry range 50–100 bps on managed assets"
        - id: gross_revenue
          label: Gross Advisory Revenue
          detail: "Estimated $80M–$160M/yr at 50–100 bps on $16B AUM; not confirmed; actual fee schedule undisclosed"
        - id: advisor_payout
          label: Advisor Compensation Pool
          detail: "W-2 salaries, equity grants, and performance payouts; largest cost driver; specific amounts undisclosed"
        - id: platform_ops
