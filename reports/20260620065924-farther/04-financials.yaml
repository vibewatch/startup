        - id: aum_mgmt
          label: Advisor-Attributed AUM
          detail: "~$57.8M avg derived from $16B / 277 advisors; below top-performer range of $100M–$500M+"
        - id: advisor_revenue
          label: Advisor-Generated Revenue
          detail: "Estimated 50–100 bps on managed AUM per advisor; exact payout arrangement undisclosed"
        - id: unit_margin
          label: Per-Advisor Contribution Margin
          detail: "Revenue minus payout, compliance, and allocated platform costs; not disclosed; likely negative in first 12–18 months"
