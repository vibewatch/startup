  - id: s4
    title: Unit Economics and Operating Cost Profile
    body: >-
      Farther does not disclose any income statement metric, including revenue, gross margin,
      advisor payout ratios, operating expenses, or net income. All unit-economic analysis relies
      on regulatory proxy data and industry benchmarks. At the regulatory AUM of $16 billion
      spread across 277 advisors, the average advisor manages approximately $57.8 million in
      client assets — below the typical range of $100–$500 million seen at top-performing
      wirehouse and independent RIA producers, suggesting either a younger or partially
      transitioned advisor cohort at the time of the filing.


      With 14,965 client accounts and $16 billion in AUM, the average client balance is
      approximately $1.1 million, placing Farther solidly in the high-net-worth bracket and
      above the mass-market RIA average. This segmentation is consistent with Farther's
      recruitment pitch targeting experienced advisors with established HNW books of business.
      Advisor-to-client ratio of approximately 1:54 is in line with HNW-focused RIA norms.


      For peer context, the 2025 InvestmentNews Advisor Benchmarking Study (covering 2024
      performance) reported a median operating margin of 27.8 percent across U.S. advisory
      firms, with billion-dollar advisors achieving approximately 28.6 percent. These serve as
      long-run aspiration benchmarks for Farther at scale; reaching those margins from a growth-
      capital-intensive phase requires significant AUM scale relative to fixed headcount and
      technology costs. Firms in Farther's growth stage typically operate with negative or near-
      zero operating margins, burning capital to fund advisor recruiting, platform development,
      and onboarding infrastructure. The Inc. 5000 revenue growth of ~11,968 percent over three
      years is consistent with a very small starting revenue base ($0.5–$1.5 million in 2022)
      growing to a meaningful but still unconfirmed 2025 figure.


      Advisor recruiting represents the dominant near-term cost driver. Farther added 27 advisors
      in Q2 2025 alone and was ranked a top recruiter by AdvisorHub in both 2024 and 2025.
      Industry evidence confirms that wirehouse-to-RIA transitions involve transition assistance,
      signing incentives, or minimum revenue guarantees, creating front-loaded cash costs before
      the advisor's book is productive for the platform. Farther's W-2 model compounds this by
      converting variable compensation into fixed payroll earlier in the advisor lifecycle.
