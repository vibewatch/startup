chapter:
  number: 4
  title: Financials
  summary: >-
    Farther's economics are anchored by an AUM-based advisory fee model: regulatory
    filings show $16 billion in managed assets, 277 advisors, and 14,965 clients as of
    early 2025, implying annual gross revenue of $80–$160 million at industry-standard
    fee rates, while the company's own "recruited assets" figure of $23 billion (May 2026)
    includes a material onboarding pipeline not yet reflected in Form ADV. The firm raised
    $150 million in a Series D led by General Atlantic (May 2026) at a unicorn valuation
    above $1 billion, bringing lifetime capital to approximately $272 million; no audited
    financials, burn rate, or absolute revenue figures have been disclosed, leaving capital
    adequacy, margin profile, and unit economics as blocking diligence items.

