  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Absolute annual revenue (ARR, run rate, or audited annual figure), gross margin after
        advisor payout, and net revenue retention; none of these are publicly available.
      whyItMatters: >-
        Without dollar revenue figures and margin data, financial underwriting is impossible;
        the Inc. 5000 growth rate confirms direction but not magnitude.
      diligencePath: >-
        Request audited financial statements for FY2023–FY2025 and a CFO-prepared
        management P&L showing revenue, advisor compensation, gross margin, and EBITDA.

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Monthly cash burn rate, current bank balance, and runway estimate; no public disclosure
        of any cash or burn metric exists.
      whyItMatters: >-
        With a $150 million Series D, runway is likely adequate near-term, but the range of
        $5M–$20M/month burn produces a 7–30 month runway spread — too wide for underwriting.
      diligencePath: >-
        Request monthly P&L for trailing 12 months, current balance sheet, and management
        cash-flow projection with use-of-proceeds detail.
      relatedQuestionRefs:
        - QI003
        - QI016

    - type: private-evidence-only
