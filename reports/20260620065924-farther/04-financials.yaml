callouts:
  - calloutType: risk
    title: Recruited Assets vs. Regulatory AUM — Material Measurement Gap
    body: >-
      Farther's headline figure of $23 billion in recruited assets substantially exceeds the
      $16 billion in regulatory AUM reported through Form ADV. The difference is not a
      discrepancy but a definitional one: recruited assets include AUM from advisors who have
      committed to join but whose client books have not yet fully transferred. Buyers must
      confirm the breakdown of confirmed managed vs. pipeline committed vs. prospective assets
      before underwriting to the higher figure.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010

  - calloutType: insight
    title: Inc. 5000 Revenue Growth Is a Strong Signal but Not an Audited Figure
    body: >-
      Farther's ranking as #1 in financial services on the 2025 Inc. 5000 list with
      approximately 11,968 percent three-year revenue growth is striking confirmation of
      rapid commercialization. However, the growth rate is company-submitted and not audited.
      It implies a very small revenue base in 2022 (~$0.5–$1.5 million) growing to a substantial
      but unconfirmed 2025 figure. The percentage is directionally credible given AUM trajectory
      but does not substitute for an audited income statement.
    claimRefs:
      - CI017
      - CI018
      - CI040

  - calloutType: recommendation
    title: Five Blocking Diligence Items Must Be Resolved Before Financial Underwriting
    body: >-
      Revenue dollar figures, gross margin, burn rate, audited financials, and full Form ADV
      Part 1A disclosure details are all unavailable from public sources. These are blocking
      preconditions to any quantitative financial model. Diligence should prioritize: audited
      financials for FY2023–FY2025, the actual Form ADV Part 2A fee schedule, a management-
      prepared use-of-proceeds and cash-flow projection, and direct explanation of both SRO
      and attorney/accountant regulatory disclosures in Item 11.
    claimRefs:
      - CI019
      - CI034
      - CI031

