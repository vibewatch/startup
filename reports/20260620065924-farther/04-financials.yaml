  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: standard
    summary: >-
      Per-advisor unit economics from recruiting through book transition to AUM under
      management and contribution margin; all dollar nodes are estimated or unavailable.
    data:
      nodes:
        - id: advisor_recruit
          label: Advisor Recruited
          detail: "W-2 hire with equity; onboarding cost estimated 3–6 months of expected revenue; no confirmed data"
        - id: book_transition
