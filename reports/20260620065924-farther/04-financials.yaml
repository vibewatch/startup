  - id: s5
    title: Regulatory Disclosures and Adverse Financial Signals
    body: >-
      AdvisorSearch.org's aggregation of Farther's SEC IAPD Form ADV data as of January 2026
      identifies two regulatory disclosure alerts: an Activity Restriction from a Self-Regulating
      Organization (SRO), affecting approximately 2.0 percent of RIA firms per SEC data, and an
      Attorney/Accountant Authorization Revocation affecting approximately 0.2 percent of firms.
      These disclosures appear in SEC Form ADV Item 11, which covers legal and disciplinary
      history. The specific nature, timing, and ongoing impact of these disclosures have not been
      confirmed through direct access to the full Form ADV Part 1A; the IAPD summary page
      returned only navigation content on the research date, limiting deeper review. Diligence
      should include a direct pull of the full Form ADV and a direct management explanation of
      both items before any investment decision.


      Form ADV filings are self-reported by investment advisers without independent audit or
      external verification. All AUM, client count, and advisor headcount metrics reported by
      Farther or derived from Form ADV data carry the inherent limitation of self-reporting.
      Farther has never published externally audited financial statements and is not obligated to
      do so as a private company; this means every financial claim — including the Inc. 5000
      revenue growth rate, the recruited-assets milestone, and all AUM figures — rests on
      management assertion without third-party verification.


      The active poaching of advisors from Goldman Sachs and other wirehouses introduces
      litigation exposure. Goldman Sachs in particular has historically pursued claims against
      departing advisors under its protocol and non-solicitation agreements. RIABiz noted
      Farther's own acknowledgment of the legal risk in its 2024 Goldman Sachs poaching episode.
      While no public court filings, FINRA arbitrations, or news reports documenting active
      litigation against Farther from poaching have been identified as of the research date,
      the absence of confirmed litigation does not eliminate the risk, particularly given the
      scale of the Seidenstein hire ($1.5 billion book) and the ongoing pace of Goldman-adjacent
      recruiting.
    claimRefs:
      - CI031
      - CI032
      - CI034
      - CI042
      - CI043

  - id: s6
    title: Financial Verdict and Diligence Agenda
    body: >-
      Farther's revenue model is structurally high-quality — recurring, AUM-linked, and free of
      conflicted commission structures — but it is not independently verifiable. The regulatory
      AUM of $16 billion and implied advisory revenue of $80–$160 million per year represent the
      most reliable publicly available financial signal, but even this range carries low
      confidence because the actual fee schedule, payout ratio, and advisor productivity
      distribution are all undisclosed. The gap between recruited assets ($23 billion) and
      regulatory AUM ($16 billion) requires buyers to obtain a confirmed breakdown of pipeline
      versus managed assets before underwriting to the higher figure.


      The $1 billion+ unicorn valuation implies a technology-platform premium well above
      traditional AUM-multiple RIA valuations. At $16 billion in regulatory AUM the implied
      price-to-AUM ratio is 6–7x versus a typical RIA M&A multiple of 2–3 percent of AUM,
      suggesting the market is pricing a technology platform, not a traditional advisory firm.
      That valuation is defensible if Farther's technology genuinely enables superior advisor
      productivity and client outcomes at scale, but it is highly sensitive to execution risk
      on the recruiting and transition pipeline. The series of four institutional rounds in
      seven years, accelerating in size from Series C ($72 million) to Series D ($150 million),
      indicates a growth-capital model that is likely to require continued raises before
      reaching profitability.


      The five blocking diligence items are: (1) audited financial statements for FY2023–FY2025,
      (2) fee schedule and average realized advisory fee rate, (3) monthly burn rate and current
      cash balance, (4) breakdown of recruited assets versus regulatory AUM with transition-rate
      data, and (5) full Form ADV Part 1A including the nature of both SRO and
      attorney/accountant regulatory disclosures. Until these items are obtained, revenue
      quality, margin outlook, and capital runway cannot be independently underwritten.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI039
    tableRefs:
      - TI005
    figureRefs:
      - FI003

