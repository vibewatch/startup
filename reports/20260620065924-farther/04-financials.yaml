sections:
  - id: s1
    title: Revenue Model and Fee Architecture
    body: >-
      Farther operates as a fee-only fiduciary registered investment adviser under SEC
      registration CRD 302050. Advisory management fees charged as a percentage of assets under
      management are the firm's sole publicly documented revenue stream; it does not earn
      commissions, 12b-1 trails, or third-party product referral compensation. The exact fee
      schedule — including any AUM tier breakpoints, flat fees, or minimum charges — is disclosed
      in Form ADV Part 2A but is not published on the company website, preventing independent
      verification of list versus realized fee rates. Applying the industry-standard advisory fee
      range of 50–100 basis points to the $16 billion in regulatory AUM reported in early 2025
      implies annual gross advisory revenue of approximately $80–$160 million, though this
      estimate carries low confidence absent confirmation of Farther's actual fee schedule.


      Beyond the core advisory fee, two additional potential revenue streams have been identified
      but remain unconfirmed: B2B licensing of the Intelligent Wealth Platform to third parties
      and facilitation fees from private markets access. Neither stream appears in any investor
      press release, regulatory filing, or third-party reporting reviewed. Farther promotes
      private market access as a platform capability, but a fee-only SEC registration constrains
      the forms of compensation that can be earned from third-party product sponsors. Taken
      together, the revenue architecture appears simple and recurring, which is a quality
      indicator; the absence of published fee rates and any income statement data makes
      independent verification impossible without a data room.


      Farther's W-2 advisor employment model with equity participation and no non-compete
      agreements differs materially from the independent-contractor model used by most
      aggregator-style RIAs. This model shifts the largest cost — advisor compensation — to
      a fixed payroll line rather than a variable payout ratio, creating a higher fixed cost
      base and greater operating leverage sensitivity on the path to margin expansion.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI025
      - CI029
      - CI030
