  topStrengths:
    - >-
      AUM 增速异常快：Series C（2024 年 10 月）时管理 AUM 约 $5B，Series D（2026 年 5 月）时增至管理 AUM 约 $15B / 已招募资产 $23B——不到 18 个月约 3×；Inc.
      5000 金融服务第 1 名和约 12,000% 三年收入 CAGR，也印证了定义品类的增长速度
    - AI 原生的自研 Intelligent Wealth Platform 取代碎片化遗留技术栈；顾问工作流和客户数据一旦迁移，高切换成本会形成纯 AUM 可比公司不具备的耐久护城河
    - >-
      Tier-1 机构财团（General Atlantic $126B AUM、CapitalG/Alphabet、Bessemer Venture Partners、MassMutual
      Ventures）提供资本、金融服务领域经验，以及冲刺 IPO 或战略 M&A 退出的规模化打法
    - >-
      W-2 顾问模式叠加股权参与、无竞业限制、无客户最低门槛，使 Farther 的招聘话术更有差异化；2026 年 4 月推出 Farther Family Office 后，打开 UHNW / centimillionaire
      客群，单客经济性显著更高（100–200bps vs. 标准 50–75bps）
  topRisks:
    - 尚未披露经审计收入、毛利率或现金头寸；Inc. 5000 约 12,000% 三年 CAGR 无法换算为绝对收入，标准 EV/Revenue 估值三角定位跑不通，资本充足性和现金跑道也无法核验
    - >-
      Farther 的 SEC 文件中有三项未披露解释的 Form ADV Item 11 纪律处分提示——一项 SRO 活动限制（约 2% 公司报告）、一项律师 / 会计师授权撤销（约 0.2%）和一项营业执照撤销 — SRO（约
      0.1%）——均未公开说明；具体性质、时间和解决状态是任何投资决策前的阻断性尽调项
    - >-
      独角兽估值约等于 managed AUM 的 6.7×，而典型 RIA M&A 倍数为 AUM 的 1–3%，等于把持续高增长以几乎无容错的方式计入价格；顾问招聘降速、市场回撤 20–30%，或 $8B pipeline AUM
      缺口转化不足，都可能迫使估值大幅重置
    - 固定 W-2 成本结构意味着 AUM 回撤时收入收缩、薪酬却保持刚性；烧钱速度未披露，$150M Series D 按支出假设估计只能提供 7–30 个月现金跑道，若下一次资本事件前增长动能放缓，融资风险会上升
  unresolvedGaps:
    - 经审计收入、毛利率和利润表：绝对收入基数、毛利率、运营成本结构和 EBITDA 均未公开披露，是支撑任何前瞻倍数估值方法的必要数据
    - Form ADV Item 11 纪律处分提示：必须从管理层获得三项提示的具体性质、时间、受影响实体或个人身份，以及当前运营影响，才能判断监管风险
    - Series D 后准确估值和股权结构表：超过 $1B 的独角兽门槛已确认，但精确估值、稀释后股数、投资人持股比例和清算优先权堆叠均未公开
    - 烧钱速度、月度现金头寸和现金跑道：Series D 的 $150M 提供了资本，但支出运行率未披露，无法确认当前顾问增长速度下现金跑道是否充足
    - 已招募资产向 managed AUM 的转化率和时间表：$23B 已招募资产与 $15B managed AUM 之间约 $8B 差距，反映仍在 onboarding pipeline 中；其转化时间和折扣率未披露
