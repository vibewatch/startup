summary:
  headline: >-
    Farther 是定义品类的 AI 原生财富管理平台，AUM 增速极快，机构背书顶级；但缺少经审计财务，Form ADV 上三项纪律处分提示也没有解释，使其在超过 $1B 的独角兽估值下还无法被有把握地承销为买入——在财务披露前，按
    90 天节奏跟踪。
