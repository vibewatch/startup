summary:
  headline: >-
    Farther is a category-defining AI-native wealth platform with exceptional AUM growth
    velocity and elite institutional backing, but the absence of audited financials and
    three unexplained Form ADV disciplinary alerts prevent underwriting a confident buy at
    its greater-than-$1B unicorn valuation — track with a 90-day review cadence pending
    financial disclosure.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: null
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 272
    customerCount: 14965
    headcount: null
  topStrengths:
    - >-
      Exceptional AUM growth velocity: ~$5B managed AUM at Series C (October 2024) grew to
      ~$15B managed / $23B recruited assets at Series D (May 2026) — roughly 3× in under
      18 months — with Inc. 5000 #1 financial services ranking on approximately 12,000%
      three-year revenue CAGR confirming category-defining growth pace
    - >-
      AI-native proprietary Intelligent Wealth Platform replaces fragmented legacy stacks;
      once advisor workflows and client data are migrated, high switching costs create a
      durable moat that pure-AUM comparables do not possess
    - >-
      Tier-1 institutional syndicate (General Atlantic $126B AUM, CapitalG/Alphabet,
      Bessemer Venture Partners, MassMutual Ventures) provides capital, financial-services
      sector expertise, and a playbook for scaling to IPO or strategic M&A exit
    - >-
      W-2 advisor model with equity participation, no non-compete agreements, and no client
      minimums differentiates Farther's recruiting pitch; April 2026 launch of Farther
      Family Office opens a UHNW/centimillionaire segment with materially higher per-client
      economics (100–200bps vs. standard 50–75bps)
  topRisks:
    - >-
      No audited revenue, gross margin, or cash position has been disclosed; the Inc. 5000
      ~12,000% three-year CAGR cannot be converted to an absolute revenue figure, preventing
      standard EV/Revenue valuation triangulation and leaving capital adequacy and runway
      unverifiable
    - >-
      Three undisclosed Form ADV Item 11 disciplinary alerts on Farther's SEC filing — an
      SRO activity restriction (reported by ~2% of firms), an attorney/accountant
      authorization revocation (~0.2%), and a business license revocation — SRO (~0.1%) —
      have not been publicly explained; specific nature, timing, and resolution are blocking
      diligence items before any investment decision
    - >-
      Unicorn valuation at approximately 6.7× managed AUM versus typical RIA M&A multiples
      of 1–3% of AUM prices in sustained hyper-growth with no margin for slippage;
      deceleration in advisor recruiting, a market drawdown of 20–30%, or the conversion
      shortfall from the $8B pipeline AUM gap could each require a meaningful valuation reset
    - >-
      Fixed W-2 cost structure means revenue compresses with AUM drawdown while payroll
      remains fixed; burn rate is undisclosed and the $150M Series D provides estimated
      7–30 months of runway depending on assumed spend, creating financing risk if growth
      momentum slows before the next capital event
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, and income statement: absolute revenue base, gross
      margin, operating cost structure, and EBITDA are not publicly disclosed and are
      required to support any forward-multiple valuation approach
    - >-
      Form ADV Item 11 disciplinary alerts: specific nature, timing, identity of affected
      entity or individual, and current operational impact of all three alerts must be
      obtained from management and assessed before regulatory risk can be characterized
    - >-
      Exact post-Series D valuation and capitalization table: the greater-than-$1B unicorn
      threshold is confirmed but precise valuation, diluted share count, investor ownership
      percentages, and liquidation preference stack are not publicly available
    - >-
      Burn rate, monthly cash position, and runway: Series D proceeds of $150M provide
      capital but the spending run rate is undisclosed, preventing confirmation of adequate
      runway at the current advisor growth pace
    - >-
      Recruited-assets-to-managed-AUM conversion rate and timeline: the approximately $8B
      gap between $23B recruited assets and $15B managed AUM reflects an onboarding pipeline
      whose conversion timing and discount rate have not been disclosed
