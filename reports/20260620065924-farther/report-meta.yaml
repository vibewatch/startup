    co-invested. Prior rounds: Series C $72M (October 2024, $542M post-money, co-led by
    CapitalG and Viewpoint Ventures); pre-Series C implied approximately $50M aggregate.
    Total capital raised exceeds $272M; post-money valuation confirmed above $1B (unicorn),
    exact figure not publicly disclosed.
