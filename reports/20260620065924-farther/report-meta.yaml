companyProfile:
  summary: >-
    Farther is an AI-native registered investment adviser (Farther Financial Advisors LLC,
    SEC CRD 302050) founded in New York in 2019 by Taylor Matthews (CEO) and Brad Genser
    (CTO). Publicly launched in April 2020, the company grew from approximately $1 billion
    in AUM at founding to $15 billion in managed AUM and $23 billion in recruited assets by
    May 2026, when it closed a $150 million Series D led by General Atlantic and confirmed
    unicorn status. Farther's core product is the Intelligent Wealth Platform — a
    proprietary, all-in-one AI-native ecosystem combining dynamic asset location,
    tax-intelligent portfolio management, AI-driven insights, and private market access —
    delivered through an employed (W-2) advisor model. The April 2026 launch of Farther
    Family Office, headed by former Goldman Sachs private banker Ben Seidenstein, extends
    the platform upmarket to ultra-high-net-worth and centimillionaire clients. Inc. 5000
    ranked Farther #1 in financial services and #8 overall in 2025 on approximately 11,968
    percent three-year revenue growth.
  foundedDate: "2019-01-01"
  founders:
    - name: Taylor Matthews
      role: CEO, Co-Founder
      background: >-
        Former leadership team at ForUsAll; grew AUM from $25M to ~$1B in two years;
        primary public face for fundraising, advisor recruiting, and strategic direction
      claimRefs: [CO003, CO004]
    - name: Brad Genser
      role: CTO, Co-Founder
      background: >-
        Former VP at Goldman Sachs (2014–2019); founded and led an AI team for private
        wealth management; owns core technical architecture of the Intelligent Wealth
        Platform
      claimRefs: [CO005, CO006]
  foundingLocation: "New York, NY"
  headquarters: "New York, NY, USA"
  productSummary: >-
    Intelligent Wealth Platform: an AI-native, all-in-one advisory technology ecosystem
    offering dynamic asset location, tax-intelligent portfolio management, AI-driven
    insights, and access to private markets. Delivered via employed W-2 financial advisors
    to high-net-worth and ultra-high-net-worth clients; Farther Family Office (launched
    April 2026) extends the platform to centimillionaire and billionaire clients with
    bespoke services and no minimums.
  customerFocus: >-
    High-net-worth individuals, ultra-high-net-worth families served via Farther Family
    Office, small businesses, and institutional accounts; accessed through recruited W-2
    advisors transitioning from wirehouses and broker-dealers
  businessModel: >-
    Fee-only fiduciary model: advisory management fees charged as a percentage of AUM,
    with no commissions, 12b-1 trails, or third-party product compensation. Revenue scales
    proportionally with AUM; W-2 advisor employment creates a high fixed cost base with
    operating leverage potential at scale.
  stage: "Series D / Unicorn"
  fundingStatus: >-
    $150M Series D closed May 21, 2026, led by General Atlantic; existing investors
