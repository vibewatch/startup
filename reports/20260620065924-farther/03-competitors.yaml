  - id: advisor-networks
    title: "Advisor Network and Aggregator Models: Dynasty, Carson, and Steward Partners"
    body: >-
      Advisor network aggregators offer a distinct alternative to Farther's W-2 platform model:
      they provide infrastructure, compliance, technology, and sometimes equity or partnership
      economics to advisors who want independence but not the burden of building their own RIA
      from scratch. Dynasty Financial Partners backed the breakaway of OpenArc, which managed
      approximately $130 billion in assets when it departed Merrill Lynch—a high-profile data
      point demonstrating Dynasty's ability to support very large team transitions. Dynasty's
      service offering spans entity formation, investment operations, technology, compliance,
      and business consulting. This model is fundamentally different from Farther's: Dynasty
      advisors remain independent principals who own their client books, whereas Farther
      advisors are W-2 employees whose client relationships are ultimately owned by the Farther
      entity. The economic trade-off is clear: Dynasty advisors earn full enterprise value of
      their practice at sale, while Farther advisors trade some of that upside for equity
      participation in the Farther platform and relief from back-office overhead. Carson Group
      operates an advisor partnership model with equity stakes in the consolidated firm, and
      Steward Partners operates as an employee-based RIA affiliated with Raymond James, both
      offering equity participation that competes directly with Farther's equity proposition.
      Cerulli research shows that RIA consolidators collectively exceeded $1.5 trillion in
      AUM and are beginning to resemble broker-dealers in organizational structure and
      distribution dynamics, reflecting the maturing of the aggregator model. Farther's
      recruiting success—over 11,000 advisors changed firms industrywide in 2025, up 16.2%
      year-over-year—is partially driven by this structural movement but also subject to it:
      any large aggregator that combines attractive economics with better technology will
      compete for the same advisor candidates.
