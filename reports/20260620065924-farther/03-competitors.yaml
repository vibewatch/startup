    title: "Competitive positioning map"
    type: quadrant
    layout: wide
    summary: >-
      Farther occupies the high-integration, low-independence quadrant—deeply integrated
      AI-native platform combined with an employed-advisor model—distinguishing it from
      independent-advisor platforms (Altruist, Dynasty) and enterprise B2B vendors (Orion,
      Envestnet). Ordinal axes are evidence-backed assessments, not numeric measurements.
    approximationNotes: >-
      X and Y coordinates are ordinal evidence assessments on a 1–5 scale, not sourced
      numeric measurements. X=1 indicates legacy bolt-on technology; X=5 indicates AI-native
      architecture built from inception. Y=1 indicates fully employed with no practice
      ownership; Y=5 indicates fully independent with full practice ownership. Placement
      reflects competitive intelligence from company websites, press coverage, and industry
      analyst sources as of June 2026.
