  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: advisor-time-on-strategy
      missingEvidence: >-
        Independent verification or third-party advisor testimonials confirming that
        Farther advisors actually spend 90% of their time on client wealth strategy
        rather than administrative tasks; current evidence is company-claimed only.
      whyItMatters: >-
        If the 90% figure is marketing language rather than a measurable operational metric,
        it weakens the differentiation narrative for advisor recruiting and the AI-efficiency
        moat claim.
      diligencePath: >-
        Request advisor interviews or advisor satisfaction surveys from Farther; cross-check
        with independent advisor reviews on G2, Google, or similar platforms; review any
        published advisor testimonials citing specific time-savings numbers.
      relatedQuestionRefs:
        - QP013

    - type: missing-source
      severity: material
      topic: competitor-pricing
      missingEvidence: >-
        Exact payout rates, fee schedules, and advisor compensation structures for Farther,
        Savvy Wealth, Carson Group, Dynasty Financial Partners, and Steward Partners; all
        are privately held and do not publish compensation details.
      whyItMatters: >-
        Without comparable pricing and payout data, it is impossible to assess whether
        Farther's economics are superior to alternatives for the target advisor cohort.
        Payout rate is often the decisive variable in advisor recruiting.
      diligencePath: >-
        Obtain Farther's standard advisor compensation schedule via direct disclosure in
        due diligence; request comparable term sheets from Savvy, Carson, and Dynasty;
        cross-reference with industry surveys (InvestmentNews compensation surveys).
      relatedQuestionRefs:
        - QP016

    - type: missing-source
      severity: material
      topic: carson-steward-platform-detail
      missingEvidence: >-
        Detailed platform capabilities, advisor technology stack, and recruiting economics
        for Carson Group and Steward Partners; Carson Group's platform page returned a 404
        during research and Steward Partners has no independently verified public data
        in the fetch cache.
      whyItMatters: >-
        Carson Group and Steward Partners are significant aggregator competitors for the
        target breakaway advisor segment; without their platform details, the competitor
