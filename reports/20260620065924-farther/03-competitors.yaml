sections:
  - id: landscape-overview
    title: "Competitive Landscape: Three Overlapping Layers"
    body: >-
      Farther faces competition across three structurally distinct layers that partially overlap.
      The first layer is technology-native RIA platforms: firms that have built advisor-facing
      technology stacks from scratch and use that technology to differentiate the advisor
      recruiting and client-service proposition. Altruist and Savvy Wealth are the clearest
      direct peers in this tier, both targeting breakaway advisors with integrated custody or
      operations and AI-powered workflows. The second layer is enterprise wealthtech incumbents:
      large B2B software and services firms such as Orion and Envestnet/Tamarac that serve the
      independent advisory market with integrated portfolio management, trading, CRM, and
      compliance tooling. These incumbents do not directly compete for advisors but compete for
      the technology wallet and platform loyalty of advisors who might otherwise prefer Farther's
      integrated stack. The third layer is advisor network aggregators: partnership and affiliation
      models such as Dynasty Financial Partners, Carson Group, and Steward Partners that offer
      advisors infrastructure, back-office services, and sometimes equity as alternatives to full
      independence or wirehouse employment. Status-quo substitutes complete the competitive set:
      wirehouse employees who have not yet broken away, solo RIA practitioners using a
      multi-vendor cobbled stack, and advisors who choose broker-dealer affiliation rather than
      RIA conversion. The overall RIA landscape tracked 6,421 independent RIAs overseeing
      approximately $14.3 trillion in assets as of December 2025, creating an enormous
      recruitment-addressable market and fueling intense platform competition. Consolidator
      activity—over 370 M&A transactions covering more than $2 trillion in AUM in 2025—is
      accelerating scale concentration and making the competitive environment more dynamic.
    claimRefs:
      - CP001
      - CP003
