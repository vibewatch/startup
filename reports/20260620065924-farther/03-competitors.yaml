chapter:
  number: 3
  title: Competitors
  summary: >-
    Farther competes across three overlapping layers: technology-native advisor platforms
    (Altruist, Savvy Wealth), enterprise wealthtech incumbents (Orion, Envestnet/Tamarac),
    and advisor-network aggregators (Dynasty, Carson Group, Steward Partners). Its distinctive
    W-2 employee plus equity model occupies a narrow strategic position—high-integration
    platform combined with employed-advisor structure—creating switching costs from both
    technology lock-in and equity vesting, though the fixed-cost labor model creates
    financial fragility risk and well-funded peers are closing the AI capability gap.

