  - id: incumbent-platforms
    title: "Incumbent Platform Providers: Envestnet, Tamarac, and Advisor360°"
    body: >-
      Envestnet is the dominant wealthtech incumbent, supporting approximately $6.5 trillion
      in assets across more than 20 million accounts as of mid-2025. Its 2025–2026 strategic
      roadmap spans tax-aware trading, advisor control enhancements, automation, and ecosystem
      integrations across both the Envestnet enterprise platform and Envestnet Tamarac, which
      specifically serves independent RIAs with integrated portfolio management, rebalancing,
      billing, and CRM. Envestnet describes itself as "the industry's most connected,
      customizable wealth management platform." The Envestnet roadmap signals a direct
      competitive response to the value propositions of AI-native entrants: improved
      personalization at scale, AI-driven client insights, and deeper workflow automation.
      However, Envestnet's B2B distribution model means its innovation must flow through
      incumbent advisory firm relationships rather than being used to recruit individual
      advisors. This distribution moat insulates Farther from Envestnet as a direct advisor
      recruiting competitor while simultaneously limiting Farther's ability to displace
      Envestnet's enterprise clientele. According to Cerulli, the independent RIA channel
      represents one of the fastest-growing addressable opportunities for third-party software
      vendors, and Orion and Envestnet are the primary beneficiaries of that spend. Firms that
      already use Envestnet or Orion face meaningful switching costs to move to a Farther-centric
      stack—migration of portfolio data, integrations, and client portal access are non-trivial
      barriers. The Advisor360° 2025 Connected Wealth Report found that the number-one stated
      reason advisors switch firms is desire for better technology, underscoring why the
      technology differentiation that Farther offers is also the asset incumbents most urgently
      seek to replicate.
    claimRefs:
      - CP007
      - CP008
      - CP013
      - CP030
