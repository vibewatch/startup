  - id: named-customer-proof
    title: Named Customer and Advisor Transition Proof
    body: >
      Farther's customer proof is strongest in the named advisor-transition
      category, where the public record documents several large book-of-business
      moves with specific AUM amounts and direct testimonials. The most
      significant transitions include Ben Seidenstein's $1.5B Goldman Sachs book
      (April 2026, leading the Farther Family Office), 16 Commonwealth
      advisors committing $1.7B in a single recruiting wave (2025), and 10
      Goldman Sachs Personal Financial Management advisors totaling $649M
      (mid-2024). Notably, Gary Corderman — a 30-year Goldman veteran — cited
      the desire to join "a place that was growing" and participate in equity
      as his rationale, providing one of the more candid third-party endorsements
      of Farther's model.

      On the firm-level side, three named RIA partnerships — SignalPoint Asset
      Management ($650M, ~500 Midwest families), Focus Financial Advisors
      ($130M, Rockford IL), and WMBC ($120M, California) — all join under
      branded co-branding agreements ("powered by Farther"), providing direct
      client organization testimonials. Jon Timson of SignalPoint cited
      "technology and operational infrastructure that aligns with our vision
      for growth." Scott and David Coles of WMBC cited aligned values and
      technology. Jon Aldrich of Focus Financial called Farther's platform
      "best-in-class." These testimonials are all production deployments — no
      evidence of pilot or POC status. Bell Tower Advisors (Margie Carpenter,
      24 clients) and WealthFactor were among Farther's earliest 2023 recruits
      attesting to the platform's client-facing value. The common limitation
      across all cases is the absence of post-transition client outcome data
      (AUM growth, retention, or satisfaction improvement) beyond initial
      testimonials.
