company:
  name: Farther

chapter:
  number: 6
  title: Customers
  summary: >
    Farther operates a B2B2C model where recruited financial advisors are its
    primary paying customers (via revenue-sharing agreements) and end-client
    households (~19,000 as of April 2026, avg $1.1M balance) are ultimate
    beneficiaries. AUM grew from $375M in mid-2023 to $15B by January 2026,
    with $23B in recruited assets (AUM + pipeline) declared at the May 2026
    Series D. Recruting velocity is corroborated by named firm evidence:
    Commonwealth ($1.7B), Goldman Sachs breakaway ($649M + Seidenstein $1.5B),
    SignalPoint ($650M), and others. Critical gaps remain: no disclosed NPS, NRR,
    or advisor retention rates, and the company's explosive growth partially
    reflects large single-event wirehouse breakaways that introduce concentration
    risk.

sections:
  - id: customer-segmentation
    title: Customer Segments and Value Proposition
    body: >
      Farther's customer architecture is distinctly two-tiered. The primary
      economic customers are recruited financial advisors — W-2 employees who
      receive a salary, equity in Farther, and a revenue-sharing payout
      structure. These advisors bring client books from prior firms; Farther
      monetizes through the spread between custodian costs and advisor payouts
      plus asset-management economics. End-client households are the downstream
      beneficiaries who access Farther's Intelligent Wealth Platform through
      their advisor. This B2B2C model means Farther's unit of customer
      acquisition is an advisor transition event, not a direct consumer
      onboarding event.

      Farther's Series D press release explicitly lists four end-client segments:
      high-earning individuals, ultra-high-net-worth (UHNW) families served by
      Farther Family Office, small businesses, and institutional accounts. In
      practice, the public evidence skews toward HNW and UHNW. The firm's
      average client balance of approximately $1.1M (AdvisorSearch, SEC IAPD
      data, Feb 2025) reflects a predominantly affluent household base. Farther
      deliberately imposes no mandatory minimums, which allows advisors to serve
      a wider AUM range — including sub-$1M households — though the average
      balance suggests the current mix tilts toward six-figure-and-above clients.

      The April 2026 launch of Farther Family Office (FFO), led by former
      Goldman Sachs private wealth advisor Ben Seidenstein (ex-$1.5B book),
      formalizes a UHNW/centimillionaire-and-billionaire segment with bespoke
      advisory services, no minimums, AI-native infrastructure, and private
      market access. The FFO introduction widens the addressable end-client
      spectrum and creates an organic up-market pathway for existing Farther
      advisors with UHNW clients.
