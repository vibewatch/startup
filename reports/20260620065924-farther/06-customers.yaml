  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gaps
      missingEvidence: "Advisor retention rate (% of advisors remaining per year), client household churn rate, NPS, and NRR metrics; equity vesting schedule and lock-up periods."
      whyItMatters: "Without retention data, it is impossible to assess whether Farther's explosive AUM growth reflects durable customer relationships or a revolving door of advisor transitions. The zero non-compete policy amplifies this uncertainty."
      diligencePath: "Request advisor cohort data in management meetings: how many advisors joined vs departed per year since 2020, and what % of client AUM was retained when an advisor departed."
      relatedQuestionRefs:
        - QU020
    - type: missing-source
      severity: material
      topic: ffo-client-data
      missingEvidence: "Farther Family Office client count, AUM under FFO, and pipeline of UHNW clients since the April 2026 launch."
      whyItMatters: "FFO is a key strategic upmarket expansion. Without AUM or client data, it cannot be assessed whether FFO will become a material revenue contributor or remains a brand/recruiting signal."
      diligencePath: "Request FFO AUM and enrolled client count from management; monitor future press releases and Form ADV updates."
      relatedQuestionRefs:
        - QU023
    - type: missing-source
      severity: material
      topic: competitor-benchmarking
      missingEvidence: "Comparative AUM growth, client count, advisor count, and retention metrics for tech-RIA competitors such as Savvy Wealth, Compound Planning, and Carson Group."
      whyItMatters: "Without a peer benchmark, it is unclear whether Farther's growth represents industry-leading performance or is explained by the scale of wirehouse disruption events disproportionately affecting this period."
      diligencePath: "Pull Form ADV data from SEC IAPD for Savvy Wealth and Compound Planning; request analyst benchmarking from RIA market research providers."
      relatedQuestionRefs:
        - QU027
    - type: missing-source
      severity: minor
      topic: expansion-pathway-ffo
      missingEvidence: "Quantified cross-sell conversion rate from existing Farther advisor client base to Farther Family Office; formal referral protocol documentation."
      whyItMatters: "FFO's value as an expansion driver depends on whether existing advisors systematically refer UHNW clients or whether FFO operates as a standalone new channel."
      diligencePath: "Request FFO referral pipeline data and any advisor incentive structure for FFO cross-referrals in management interviews."
      relatedQuestionRefs:
        - QU005
    - type: private-evidence-only
      severity: minor
      topic: advisor-time-efficiency
      missingEvidence: "Third-party validation of Farther's claim that advisors spend 90% of their time on client strategy; no industry survey or independent audit has confirmed this benchmark."
      whyItMatters: "The 90% vs. 33% efficiency claim is a central recruiting pitch; if unverifiable, it undermines the differentiation narrative."
      diligencePath: "Request time-tracking data or independent advisor surveys; reference Cerulli or Schwab advisor productivity benchmarks for comparable data."
      relatedQuestionRefs:
        - QU012
        - QU013
    - type: missing-source
      severity: minor
      topic: disciplinary-alerts
      missingEvidence: "Details of the SRO Activity Restriction and Business License Revocation(s) identified in AdvisorSearch based on Farther's Form ADV; underlying incident descriptions, dates, and resolution status."
      whyItMatters: "Disciplinary alerts without context could reflect historical issues from acquired advisor books or could indicate current operational risk; without detail they cannot be properly assessed."
      diligencePath: "Pull Farther's full Form ADV Part 2A and Form CRS from SEC EDGAR; interrogate specific Item 11 disclosures in management diligence."
