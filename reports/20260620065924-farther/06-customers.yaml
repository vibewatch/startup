callouts:
  - calloutType: strength
    title: Rapid advisor recruiting with named, production-deployed evidence
    body: >
      Farther has assembled a verifiable track record of large advisor
      transitions: Goldman (x10 + Seidenstein), Commonwealth (x16), SignalPoint
      ($650M), WMBC, Focus Financial, and others — all in production and all
      backed by CEO or principal-level testimonials. The total documented named
      advisor AUM exceeds $4B across publicly confirmed transitions, corroborated
      by independent press coverage in RIABiz, InvestmentNews, and AdvisorHub.
    claimRefs:
      - CU020
      - CU023
      - CU024
      - CU026

  - calloutType: risk
    title: Retention metrics entirely undisclosed; zero non-compete amplifies churn risk
    body: >
      No NPS, NRR, GRR, advisor retention rate, or client household churn data
      has been disclosed. Farther's zero non-compete policy is simultaneously
      its top recruiting differentiator and its primary retention risk: any
      advisor can depart with the full client book at any time. Without visibility
      into equity vesting schedules, the strength of retention incentives
      cannot be assessed. The disciplinary alerts in Farther's Form ADV
      (SRO activity restriction, business license revocations) add a layer
      of compliance risk that warrants due-diligence investigation.
    claimRefs:
      - CU030
      - CU032
      - CU035

  - calloutType: risk
    title: AUM concentration in wirehouse event-driven recruiting
    body: >
      Approximately $3.8B in recruited AUM (Goldman PFM + Commonwealth cohort,
      plus $1.5B Seidenstein) traces to two institutions disrupted by external
      events (Goldman PFM wind-down, LPL/Commonwealth acquisition). These are
      not repeatable steady-state pipelines. If wirehouse disruption events
      slow, Farther's organic recruiting rate — 27 advisors in Q2 2025 —
      would imply a much lower quarterly AUM addition than the spike years
      suggest, making the current growth trajectory event-dependent.
    claimRefs:
      - CU036
      - CU039
      - CU037

  - calloutType: insight
    title: Farther Family Office creates a UHNW upgrade pathway but is unproven
    body: >
      The April 2026 FFO launch — with no minimum, AI-native infrastructure,
      and a credible $1.5B anchor advisor — addresses the UHNW white space
      that existing RIA platforms struggle to penetrate. The lack of imposed
      minimums is a structural differentiator. However, FFO was only six weeks
      old at the Series D announcement, and no UHNW client count or AUM figure
      for the new unit has been disclosed. Until FFO generates measurable
      separate economics, it should be treated as a strategic optionality
      signal rather than a near-term revenue driver.
    claimRefs:
      - CU006
      - CU026
      - CU027

