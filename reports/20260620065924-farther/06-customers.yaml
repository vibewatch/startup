acknowledgedWarnings:
  - dimension: figureType
    reason: "The planned Retention / repeat cohort figure is substituted with a bar figure (FU004) showing AUM milestone growth because Farther does not disclose any retention percentage or cohort data. No numerical retention cohort (0–100% columns) can be constructed from available public evidence. The bar figure provides the closest available proxy for growth trajectory."
