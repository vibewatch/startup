summary:
  headline: >-
    Farther is a category-defining AI-native wealth platform with exceptional AUM growth velocity and elite
    institutional backing, but the absence of audited financials and three unexplained Form ADV disciplinary alerts
    prevent underwriting a confident buy at its greater-than-$1B unicorn valuation — track with a 90-day review cadence
    pending financial disclosure.
