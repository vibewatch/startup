sections:
  - id: s1
    title: Identity, product, and business model
    body: >-
      Farther is an AI-native registered investment adviser (RIA) operating under the legal
      entity Farther Financial Advisors LLC, SEC-registered with CRD number 302050. The company
      was founded in 2019 and publicly launched in April 2020 with the explicit goal of rebuilding
      wealth management from the ground up rather than layering technology onto legacy systems. Its
      primary product is the Intelligent Wealth Platform, an all-in-one proprietary ecosystem
      that combines dynamic asset location, tax-intelligent portfolio management, enhanced
      execution, AI-driven insights, and access to private markets. The platform serves a broad
      client base spanning high-earning individuals, small businesses, institutions, and
      ultra-high-net-worth families through the separately branded Farther Family Office (FFO)
      division launched in April 2026.


      Farther generates revenue through a fee-only fiduciary advisory model. The company operates
      without mandatory client minimums and without non-compete agreements for advisors, which is a
      deliberate differentiation from wirehouses and traditional broker-dealers. Advisors are
      employed as W-2 salaried employees who also receive equity in the firm alongside transparent
      payout structures. The official homepage cites $23 billion in recruited assets as of May
      2026 and claims the platform enables 3x organic advisor growth versus industry average, with
      advisors spending approximately 90 percent of their time on client interactions rather than
      administrative tasks. As of the Inc. 5000 recognition in 2025, Farther achieved
      approximately 11,968 percent three-year revenue growth, confirming the company as the
      fastest-growing financial services firm in the United States for that period.


      The company operates as a multi-custodian platform, giving advisors flexibility across
      custodians while presenting a unified technology stack to clients. The founding motivation
      articulated in multiple company and investor sources was that millennials were poised to
      inherit $25 trillion over the following decade while legacy systems built in the 1970s were
      inadequate to handle modern financial complexity such as startup equity compensation and
      socially conscious investing.
