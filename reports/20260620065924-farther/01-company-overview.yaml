  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: post-series-d-valuation
      missingEvidence: >-
        Exact post-money valuation after the May 2026 Series D; only unicorn status (>$1B) is
        confirmed in public sources, not the precise figure.
      whyItMatters: >-
        Precise valuation is required for comparable analysis, AUM-to-valuation multiple
        calculation, and assessing whether the round was priced attractively relative to
        revenue or AUM comps.
      diligencePath: >-
        Request capitalization table and Series D term sheet from Farther management during
        formal due diligence.
      relatedQuestionRefs:
        - QO027

    - type: private-evidence-only
      severity: material
      topic: early-round-funding-details
      missingEvidence: >-
        Dates, amounts, and investors for pre-Series C funding rounds (seed, Series A, and
        Series B); total implied from the >$272M aggregate minus known Series C and D.
      whyItMatters: >-
        Historical round details are needed to understand dilution trajectory, historical
        valuation step-up, and the relative governance rights of early versus late investors.
      diligencePath: >-
        Request full capitalization table, term sheets, and investor rights agreements from
        Farther management; also check Crunchbase and PitchBook for partial round history.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO003

    - type: private-evidence-only
      severity: material
      topic: revenue-run-rate
      missingEvidence: >-
        Current annual revenue run rate (ARR) or total revenue; only the 3-year growth rate
        of approximately 11,968% (2025 Inc. 5000) is publicly available.
      whyItMatters: >-
        Revenue run rate is essential for evaluating the Series D valuation multiple,
        growth efficiency, and burn rate estimates.
      diligencePath: >-
        Request audited financial statements or management accounts from Farther in due
        diligence; cross-reference with regulatory ADV filings that may disclose AUM-fee
        revenue proxies.
      relatedQuestionRefs:
        - QO029

    - type: private-evidence-only
      severity: minor
      topic: total-headcount
      missingEvidence: >-
        Total employee headcount beyond the 277 licensed advisors; overall staff count
        including non-advisory employees is not publicly disclosed.
      whyItMatters: >-
        Full headcount is needed to assess burn rate, per-employee productivity, and
        organizational capacity relative to AUM.
      diligencePath: >-
        Request employee census or review the most recent Form ADV Part 2 brochure and
        company LinkedIn data for headcount signals.

    - type: enumeration-incomplete
      severity: minor
      topic: leadership-board-composition
      missingEvidence: >-
        Farther's formal board of directors composition, committee structure, and governance
        documents; the executive team is listed but board governance is not disclosed publicly.
      whyItMatters: >-
        Board composition affects understanding of investor control, founder independence,
        management oversight mechanisms, and governance risk.
      diligencePath: >-
        Request board composition, charter documents, and any governance policies from
        Farther management during due diligence.
      relatedQuestionRefs:
        - QO022
      relatedTableRefs:
        - TO002

    - type: enumeration-incomplete
      severity: material
      topic: investor-ownership-stakes
      missingEvidence: >-
        Precise ownership percentages for each investor group after the Series D; only round
        participation amounts and general roles are publicly disclosed.
      whyItMatters: >-
        Ownership stakes determine governance, exit dynamics, alignment between investor
        groups, and dilution impact on founders and employees.
      diligencePath: >-
        Request capitalization table with post-Series D fully diluted ownership breakdown
        from Farther management.
      relatedTableRefs:
        - TO003

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-early-rounds
      missingEvidence: >-
        Specific dates, amounts, and investors for Farther's seed, Series A, and Series B
        funding rounds; these appear in the milestone table as a combined entry with
        approximate aggregate.
      whyItMatters: >-
        Complete chronology is needed to understand the company's early development pace,
        historical dilution, and investor continuity from seed through Series D.
      diligencePath: >-
        Review historic press releases, Crunchbase and PitchBook records, and request
        historical funding documentation from Farther management.
      relatedTableRefs:
        - TO004

    - type: conflicting-data
      severity: minor
      topic: round-label-discrepancy
      missingEvidence: >-
        Independent confirmation of Farther's internal round count to resolve the Built In
        NYC "Series F" label versus the consensus "Series D" label used by Farther's own
        press release and all other mainstream sources.
      whyItMatters: >-
        If the Built In label reflected an insider count (treating seed, Series A, B, C, D
        as rounds 1–5 with an additional bridge making it F), it would suggest more dilutive
        rounds than the public record shows.
      diligencePath: >-
        Request Farther's complete round history and confirm the total number of equity
        financing rounds directly with management; compare against Crunchbase and PitchBook.
      relatedQuestionRefs:
        - QO024
