callouts:
  - calloutType: strength
    title: Unicorn milestone with multi-round institutional backing
    body: >-
      The Series D close confirms unicorn status backed by General Atlantic, CapitalG, Viewpoint
      Ventures, and Bessemer — all credible growth-stage and strategic investors. The sequential
      round progression from implied ~$50M pre-Series C to $542M post-Series C valuation in
      October 2024 to unicorn in May 2026 reflects rapid capital step-up consistent with strong
      growth signals including the $23B recruited asset milestone and Inc. 5000 top ranking.
    claimRefs:
      - CO012
      - CO014
      - CO016
      - CO018

  - calloutType: risk
    title: Regulatory disclosure alerts and advisor-poaching litigation exposure
    body: >-
      AdvisorSearch identifies multiple disciplinary alerts in Farther's SEC ADV filing across
      categories including SRO restrictions and civil settlements, and RIABiz reported Goldman
      Sachs arbitration claims against individual advisors who moved to Farther. While
      firm-level enforcement actions have not been identified, these items require direct
      due-diligence verification. The alerts may reflect advisor affiliate histories rather than
      Farther entity-level conduct, but that distinction needs confirmation from the ADV Part 2
      brochure and any firm disclosure documents.
    claimRefs:
      - CO034
      - CO035

