chapter:
  number: 1
  title: Company Overview
  summary: >-
    Farther is an AI-native registered investment adviser founded in New York in 2019 by
    Taylor Matthews (CEO) and Brad Genser (CTO) that has grown into a unicorn-status wealth
    management platform serving advisors and clients through its proprietary Intelligent Wealth
    Platform. The company closed a $150 million Series D led by General Atlantic in May 2026,
    bringing total capital raised above $272 million, recruited assets to $23 billion, and
    confirming unicorn status; key diligence gaps include the exact post-Series D valuation,
    revenue run rate, and early-round financing details.

