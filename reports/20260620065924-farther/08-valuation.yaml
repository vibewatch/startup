  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Form ADV disciplinary items
        - >-
          SEC examination reveals material compliance violation connected to the three
          undisclosed ADV Item 11 alerts; or management refuses to explain them in due
          diligence
        - >-
          Directly undermines governance assumption; increases regulatory remediation cost;
          reduces IPO/M&A premium
        - >-
          Kill if blocking items are confirmed material; pause and investigate before any
          additional capital deployment
      - - AUM growth deceleration
        - >-
          Advisor recruiting rate drops >30% from 2025 pace for two consecutive quarters;
          net new recruited assets below $500M/quarter
        - >-
          Platform premium rests on growth velocity; deceleration invalidates the bull and
          base case valuation trajectories
        - >-
          Reduce position sizing; demand revenue disclosure before proceeding; explore M&A
          accelerant
      - - Revenue / margin disappointment
        - >-
          Management accounts reveal AUM-to-revenue yield below 25bps (implying revenue
          base insufficient to justify $1B valuation at even 15× revenue)
        - >-
          False-precision error in valuation; would confirm stretched entry and require
          down-round probability repricing
        - >-
          Evaluate bridge financing terms; recalibrate to bear case probability ≥50%
      - - Competitive pricing shock
        - >-
          Altruist, Schwab, or Fidelity introduces a zero-fee or deeply discounted
          custodial/platform offering that Farther's economics cannot match
        - >-
          Erodes the technology-premium argument; compresses advisor acquisition multiples
        - >-
          Assess customer retention data; if advisor churn exceeds 10%, initiate exit process
      - - Key talent departure
        - >-
          CEO Taylor Matthews or CTO Brad Genser departure without succession plan;
          or loss of the Seidenstein Family Office lead within 18 months of hire
        - >-
          Both founders provide irreplaceable institutional knowledge; Family Office thesis
          rests on Seidenstein's private-banking relationships
        - >-
          Immediate management assessment; conditional hold pending succession clarity
    notes: >-
      Kill triggers represent events where the fundamental investment premise is invalidated
      rather than temporarily impaired. Monitoring metrics are public (recruiting announcements,
      AUM disclosures, SEC action databases) except for revenue/margin triggers which require
      management access.
    claimRefs:
      - CV014
      - CV015
      - CV029
      - CV033

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Priority
      - Diligence Path
    rows:
      - - Audited Financial Statements
        - >-
          Farther has not publicly disclosed audited P&L, balance sheet, or cash flow
          statements for any fiscal year
        - >-
          Without audited revenue, margin, and cash burn data, valuation analysis relies
          entirely on AUM multiples and growth proxies; fundamental underwriting is
          impossible
        - Blocking
        - >-
          Request FY2023, FY2024, and TTM P&L from investor relations or via NDA; require
          Big 4 audit; verify revenue yield per managed AUM dollar
      - - Form ADV Item 11 Disciplinary Alerts
        - >-
          Three disclosed ADV alerts (Activity Restriction from SRO, Attorney/Accountant
          Authorization Revocation, Business License Revocation) have no public explanation
        - >-
          These alert categories are rare (<2% to <0.1% of SEC registrants) and their
          presence on a unicorn-stage RIA is anomalous; unresolved, they represent a
          blocking governance risk
        - Blocking
        - >-
          Request written management explanation for each alert; obtain legal opinion on
          whether any creates ongoing compliance obligation; cross-reference with SEC EDGAR
          and FINRA records for associated persons
      - - Cap Table and Preference Structure
        - >-
          No public disclosure of investor ownership, preference terms, liquidation
          waterfall, or option pool size for the $272M raised
        - >-
          Preference stack can significantly dilute common shareholder returns in sub-bull
          exit scenarios; unknown overhang creates economic risk
        - Material
        - >-
          Request capitalization table (fully diluted) including Series D terms from legal
          counsel; understand 1× vs. 2× preferences and participation rights
      - - AUM Conversion Rate (Pipeline to Managed)
        - >-
          The gap between $23B recruited assets and $15B managed AUM (~$8B pipeline) has
          no disclosed conversion timeline or historical conversion rate
        - >-
          If pipeline conversion is slow or partial, the effective AUM multiple is higher
          than managed-AUM math implies; revenue recognition is also delayed
        - Material
        - >-
          Request historical cohort data on advisor onboarding timelines; calculate trailing
          12-month pipeline-to-managed conversion rate; assess fee commencement triggers
      - - Revenue Mix and Fee Schedule
        - >-
          No public breakdown of advisory fee rates by client segment, platform fee
          components, or other revenue lines
        - >-
          Blended fee yield determines absolute revenue; 25bps vs. 75bps on the same AUM
          base produces a 3× difference in revenue and valuation
        - Material
        - >-
          Request fee schedule by tier; ask for blended advisory fee yield on managed AUM;
          understand platform SaaS component (if any) separately from AUM-based advisory
      - - Competitive Retention and Churn
        - >-
          No public data on advisor attrition rate or client AUM churn after advisor
          departure
        - >-
          If departing advisors take clients with them (as is common in the RIA space),
          the recruited-asset pipeline partially reverses; this is a systemic risk in the
          growth model
        - Informational
        - >-
          Request advisor retention statistics for the last 24 months; ask for AUM retained
          vs. lost when any advisor has departed; benchmark against industry 85–92% norm
    notes: >-
      Priority levels: Blocking = investment decision cannot be made without resolution;
      Material = affects scenario probabilities and confidence level materially; Informational =
      useful for monitoring but does not gate the initial investment decision.
    claimRefs:
      - CV016
      - CV029
      - CV042
      - CV043

