    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Rationale
    rows:
      - - Recommendation
        - Track
        - >-
          Exceptional growth trajectory and platform quality, but >$1B entry valuation
          without audited revenue data prevents a confident buy call; requires financial
          disclosure to underwrite.
      - - Confidence
        - Medium
        - >-
          Multiple confirming sources on funding, AUM, and growth; high uncertainty on
          revenue, margins, and cap table limits conviction.
      - - Risk Rating
        - High
        - >-
          Elevated AUM multiple, undisclosed disciplinary items, pipeline-vs-managed AUM
          basis risk, and hyper-growth execution dependency combine for a high-risk profile.
      - - Valuation Stance
        - Stretched
        - >-
          At ~6.7% of managed AUM vs. 1–3% RIA M&A norms, the valuation requires sustained
          hyper-growth with no margin for error; the premium is not yet evidentially
          supported by audited financials.
      - - Decision Implication
        - >-
          Track with 90-day review cadence; initiate formal due diligence only upon receipt
          of management accounts or revenue disclosure; recalibrate to buy if AUM multiple
          compresses or financial evidence supports a 7–10× forward-revenue valuation.
        - >-
          Standard entry discipline for a unicorn-stage investment with missing financial
          fundamentals.
    notes: >-
      Recommendation reflects available public evidence only. No access to audited financials,
      cap table, or management accounts; all assessments are based on public filings, press
