  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Dimension
      - Thesis Argument
      - What Would Change the View
    rows:
      - - Growth Velocity
        - >-
          5× AUM growth YoY at Series C; ~12,000% three-year revenue growth (Inc. 5000 #1
          financial services); recruiting momentum set to triple AUM since Q1 2025.
        - >-
          Two consecutive quarters of advisor recruiting deceleration, or a credible
          independent audit showing absolute revenue too low to justify any premium multiple.
      - - Platform Premium
        - >-
          AI-native, custom-built infrastructure replaces fragmented legacy stacks; advisor
          switching cost creates retention moat once workflows migrate.
        - >-
          A credible peer achieves functional parity at materially lower cost, eroding the
          switching-cost argument.
      - - Strategic Backer Quality
        - >-
          General Atlantic ($126B AUM, 20 countries) brings financial services sector
          expertise and has invested in Creative Planning; cross-portfolio leverage plausible.
        - >-
          GA reduces position at next funding event or marks down the investment; loss
          of anchor investor credibility would materially impair next-round pricing.
      - - TAM and Structural Tailwinds
        - >-
          RIA channel projected to >$4T AUM over next decade; advisor breakaways from
          wirehouses structurally accelerating; UHNW wealth creation driving complexity.
        - >-
          Market downturn of >25% compresses AUM-based revenue; wirehouse non-competes
          broadly upheld, slowing breakaway pipeline.
      - - UHNW Expansion
        - >-
          Farther Family Office (led by ex-Goldman $1.5B book) opens $10M+ client segment
          with 100–200bps economics vs. standard 50–75bps advisory.
        - >-
          Family Office unit fails to attract a second high-profile private banker within
          12 months; UHNW clients prove harder to retain than HNW clients.
      - - Governance / ADV Concerns
        - N/A
        - >-
          Three Form ADV Item 11 disciplinary alerts (Activity Restriction from SRO,
          Attorney/Accountant Authorization Revocation, Business License Revocation) are
          not publicly explained; if material, would constitute a kill trigger.
    notes: >-
      Anti-thesis column items capture both disconfirming evidence thresholds and structural
      risk events. The ADV row is included as an adversarial signal with no current thesis
      counterpart — it requires management explanation before investment.
