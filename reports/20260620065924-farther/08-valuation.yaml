callouts:
  - calloutType: recommendation
    title: "Recommendation — Track (Upgrade Condition: Audited Revenue Disclosure)"
    body: >-
      Farther demonstrates exceptional growth velocity and a credible platform premium
      thesis, but the >$1B entry valuation without audited revenue, the undisclosed Form
      ADV disciplinary items, and the $8B pipeline-vs-managed-AUM gap together prevent a
      confident buy at current levels. The disciplined call is Track: monitor AUM growth
      quarterly, initiate formal due diligence only on receipt of management accounts, and
      upgrade to buy if (a) audited revenue exceeds $50 million with a credible path to
      10× multiple support, (b) the three ADV Item 11 alerts are satisfactorily explained,
      and (c) AUM multiple compresses to 4–5% on managed AUM.
    claimRefs:
      - CV002
      - CV016
      - CV029
  - calloutType: risk
    title: Critical Adversarial Signal — Form ADV Disciplinary Disclosures
    body: >-
      AdvisorSearch.org's display of Farther's Form ADV shows three Item 11 disciplinary
      disclosures — Activity Restriction from an SRO (2.0% of firms), Attorney/Accountant
      Authorization Revocation (0.2% of firms), and Business License Revocation — SRO
      (0.1% of firms). These categories are rare for any registered investment adviser and
      highly unusual for a unicorn-stage, VC-backed RIA. Their presence has not been
      explained publicly. This is a blocking diligence item: investment should not proceed
      without a written management explanation and legal review.
    claimRefs:
      - CV029
  - calloutType: assumption
    title: Key Assumption — Platform Premium Justifies AUM Multiple
    body: >-
      The entire valuation analysis rests on the assumption that Farther commands a
      technology-platform premium over a pure-AUM advisory firm, consistent with PE-backed
      wealthtech companies trading at 5–12% of AUM rather than the 1–3% RIA-M&A norm.
      This assumption is reasonable given the evidence but cannot be verified without
      revenue data. If Farther's revenue yield is below 25bps on managed AUM, a 10× revenue
      multiple would imply a valuation below $500 million — below the current series D mark.
    claimRefs:
      - CV013
      - CV025
      - CV032

