        - "<$200M (estimated; not publicly disclosed)"
        - >-
          Same category (AI-native RIA for growth advisors); provides lower valuation
          bound for the cohort
        - >-
          Much smaller AUM base; earlier stage; valuation largely estimated from deal size
          and stage norms
      - - Focus Partners Wealth
        - Large PE-backed RIA aggregator; $500B+ AUM across partner firms
        - "Taken private by KKR / CI Financial (2023); prior public market: ~15–20% AUM multiple at peak"
        - "~$4B peak public valuation; private terms undisclosed"
        - >-
          Illustrates scale endpoint for PE-backed aggregator; GA's prior interest in
          comparable aggregation plays informs Farther's strategic optionality
        - >-
          Aggregation model vs. organic recruiting are structurally different; Focus has
