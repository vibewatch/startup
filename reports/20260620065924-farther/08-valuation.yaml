chapter:
  number: 8
  title: Valuation
  summary: >-
    Farther's >$1 billion unicorn valuation following its $150 million Series D in May 2026
    rests primarily on exceptional AUM growth velocity (5×–3× year-over-year trajectories),
    an Inc.-verified revenue CAGR of ~12,000% over three years, and a platform-premium
    argument — but the absence of disclosed audited revenue, margins, or cash position means
    the valuation cannot be triangulated against financial fundamentals. At ~6.7× managed
    AUM (or ~4.3× recruited assets), the Series D mark significantly exceeds typical RIA
    M&A multiples (1–3% of AUM), implying investors are underwriting a wealthtech platform
    premium and sustained hyper-growth. The disciplined recommendation is to track: the
    investment thesis is compelling, but price sensitivity and missing financial evidence
    together prevent a confident buy call at current entry levels.

