  - id: comparable-analysis
    title: Comparable Valuation Analysis
    body: >-
      Building a comparable set for Farther requires distinguishing between three reference
      frameworks: pure-AUM RIA multiples (applicable to the book-of-business component),
      SaaS-adjacent platform multiples (applicable to the technology infrastructure), and
      PE-backed wealthtech growth-stage rounds (most directly comparable as a private
      market reference). No single framework fully captures Farther's hybrid model, and
      the absence of revenue data prevents standard EV/ARR or EV/Revenue cross-referencing.
      All figures in the comparable table are sourced from public disclosures or third-party
      reporting; estimates are labeled as such.


      The most directly comparable private transaction is Altruist's recent $152 million
      round, led by GIC with Salesforce Ventures, Baillie Gifford, Geodesic, and ICONIQ
      participating. While the post-money valuation was not publicly disclosed, industry
      reporting had previously placed Altruist in the $1.0–1.5 billion pre-money range for
      its Series F. The Altruist comparison is imperfect because Altruist is a custodian
      rather than an advisory platform, but both companies are technology-native firms
      competing for the same pool of growth-oriented independent advisors.


      On the consolidator side, Focus Partners Wealth (formerly Focus Financial Partners,
      taken private by KKR and CI Financial) represents the scale endpoint for a PE-backed
      aggregation model but differs structurally from Farther's organic recruiting approach.
      General Atlantic's investment in Creative Planning provides another data point: GA
      made a strategic minority investment when Creative Planning managed approximately
      $50 billion in AUM; the implied multiple was not publicly disclosed but GA's sustained
      involvement signals confidence in RIA sector multiples at the growth stage.


      Public wealth management comparables (LPL Financial, Focus Financial Partners when
      public, Envestnet, SEI Investments) trade at 1–4% of AUM and 1–3× revenue — but
      these are seasoned, diversified businesses, not hyper-growth platforms. The Mercer
      Capital RIA valuation blog notes that buyer/seller premiums have expanded as PE
      capital seeks recurring-fee-based revenue streams, and the industry consolidation
      pace (377 transactions, $2.5T in acquired assets in 2025) confirms robust private
      market demand for scale-stage RIA assets. The investment KPIs figure (FV004) scores
      Farther across key investor dimensions for an IC-ready snapshot.
