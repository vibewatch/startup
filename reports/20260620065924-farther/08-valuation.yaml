  - id: TV003
    title: Bull, Base, and Bear Scenario Analysis
    columns:
      - Scenario
      - Key Assumptions
      - Implied Valuation Logic
      - Probability Signal
      - Primary Downside Trigger
    rows:
      - - Bull
        - >-
          Managed AUM reaches $50–60B by mid-2028; revenue at 50bps of AUM = $250–300M;
          Family Office UHNW adds 15–20bps blended fee uplift; no adverse regulatory events;
          market flat to up.
        - >-
          10–15× forward revenue → $2.5–4.5B valuation; IPO or large M&A at 2.5–4.5×
          current Series D entry.
        - >-
          Requires continuation of current growth rate; precedent of GA Creative Planning
          scaling partially supports; low/medium probability given no revenue confirmation.
        - >-
          Market drawdown >20% compressing AUM by >$10B, slowing revenue ramp.
      - - Base
        - >-
          Managed AUM reaches $35–45B by 2027–2028; moderate revenue at ~45bps;
          operating leverage partially realized; no material regulatory action.
        - >-
          7–10× forward revenue → $1.5–2.5B valuation; M&A exit at 1–2× Series D
          entry; 2–3 year hold.
        - >-
          Most consistent with observed growth trajectory; multiple compression vs. bull
          as wealthtech market normalizes; medium probability.
        - >-
          Advisor attrition above 10% annually; Altruist or incumbent custodian price war.
      - - Bear
        - >-
          AUM growth stalls below $25B; ADV disciplinary items require remediation;
          20–30% market drawdown; recruitment pipeline converts below 50%.
        - >-
          Down-round at $700–900M; 0.3–0.7× current entry; material capital loss.
        - >-
          Requires adverse event combination unlikely but plausible given undisclosed
          governance gaps; low/medium probability but large impact.
        - >-
          Formal SEC enforcement action on any ADV item; GA forced seller at adverse price.
    notes: >-
      Valuations are estimates based on AUM multiples and forward revenue assumptions; no
      audited financials available to anchor these scenarios to verified revenue. Scenario
      probability signals are author judgments based on available public evidence.
