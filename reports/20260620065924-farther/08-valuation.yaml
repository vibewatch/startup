  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Audited annual financial statements (P&L, balance sheet, cash flow) for Farther
        covering at least FY2023–FY2025, confirming revenue base, gross margin, and cash burn.
      whyItMatters: >-
        Without audited revenue, standard EV/Revenue and EV/EBITDA valuation approaches
        are inapplicable; the entire analysis relies on AUM multiples and growth proxies,
        forcing wide scenario ranges and preventing confident buy conviction at >$1B entry.
      diligencePath: >-
        Request audited financials under NDA from investor relations; require Big 4 or
        equivalent audit; validate AUM-to-revenue yield (bps on managed AUM) and gross margin.
      relatedQuestionRefs:
        - QV018
        - QV022
        - QV028
        - QV030

    - type: private-evidence-only
      severity: blocking
      topic: disciplinary-disclosures
      missingEvidence: >-
        Written management explanation for each of the three Form ADV Item 11 disciplinary
        alerts (Activity Restriction from SRO, Attorney/Accountant Authorization Revocation,
        Business License Revocation — SRO) with timing, parties involved, and resolution status.
      whyItMatters: >-
        These alert categories are exceptionally rare for SEC-registered RIAs (0.1–2.0% of
        firms), and their unexplained presence on a unicorn-stage company constitutes a
        blocking governance risk that could indicate regulatory, legal, or compliance issues
        not visible from public filings.
      diligencePath: >-
        Request management explanation memo and legal counsel's opinion; cross-reference
        SEC EDGAR and FINRA BrokerCheck for associated persons; confirm no ongoing
        regulatory investigation.
      relatedQuestionRefs:
        - QV017

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Fully diluted capitalization table including Series D preference terms, liquidation
        waterfall, option pool size, secondary activity, and any debt instruments.
      whyItMatters: >-
        Preference structure determines actual investor economics at various exit scenarios;
        1× vs. 2× participating preference with a $272M cumulative stack could significantly
        dilute common/employee returns in bear-case scenarios.
      diligencePath: >-
        Obtain Series D term sheet and cap table from legal counsel under NDA; analyze
        waterfall at $750M, $1B, $1.5B, and $2.5B exit values.
      relatedQuestionRefs:
        - QV017

    - type: missing-source
      severity: material
      topic: comparable-valuations
      missingEvidence: >-
        Verified revenue multiples and post-money valuations for private wealthtech platform
        transactions comparable to Farther's 2026 stage, particularly for AI-native RIA or
        wealthtech custodian platforms in the $1–3B valuation range.
      whyItMatters: >-
        Public databases (Pitchbook, CB Insights) are paywalled; public comparables like LPL
        and Envestnet are structurally different businesses; the absence of private-comp data
        forces reliance on wide AUM-multiple ranges, reducing comparable table precision.
      diligencePath: >-
        Subscribe to Echelon Partners Wealthtech M&A Report, DeVoe & Company Deal Study, or
        FP Transitions Annual Review for verified private transaction multiples; cross-reference
        any disclosed deal terms from Savvy Wealth, Compound Planning, or other direct peers.
      relatedQuestionRefs:
        - QV010
        - QV008
        - QV013
      relatedTableRefs:
        - TV004
