      basis: >-
        Wealthtech platform and RIA aggregator private funding rounds and public comps with
        publicly disclosed or credibly reported valuations as of June 2026. Revenue-multiple
        comps excluded for Farther and direct peers due to absence of audited revenue data.
        Public RIA/wealth-management equities included for market-level AUM multiple context.
