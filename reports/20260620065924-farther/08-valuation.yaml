  - id: exit-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >-
      Farther's most credible near-term liquidity path for existing Series D investors is a
      strategic M&A event rather than an IPO. The public equity market currently demands
      seasoned revenue disclosure, audited financials, and at minimum two to three years of
      demonstrated operating leverage before valuing a financial technology company above
      $1 billion. Farther does not yet meet that bar. An IPO timeline of 3–5 years is
      consistent with GA's typical hold period for growth-stage financial services investments,
      and the company's current trajectory — tripling year-over-year growth and building a
      Family Office business that targets UHNW clients — suggests the operating profile needed
      for a successful IPO could be achieved by 2028–2029 absent adverse shocks.


      Strategic acquirers with compelling motivations include major U.S. banks (seeking
      independent RIA distribution capabilities), established broker-dealers or wirehouse
      networks (seeking technology modernization and organic growth talent), large RIA
      aggregators (seeking a tech platform layer to differentiate their consolidation roll-up),
      and international wealth managers (using Farther as a U.S. platform entry point). General
      Atlantic's global network across 20 countries and prior relationship with Creative Planning
      positions it well to facilitate an M&A process if organic growth continues.


      Thesis-break and kill triggers are documented in TV005 below. Final diligence asks (TV006)
      are prioritized by the severity of the evidence gap: the Form ADV disciplinary items and
      the absence of audited financials are blocking items; revenue mix and cap-table structure
      are material; market-share competitive positioning is informational. Any investment
      decision at current entry levels must be conditioned on satisfactory responses to the
      blocking diligence asks before capital deployment.
