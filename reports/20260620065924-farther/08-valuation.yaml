      - - Creative Planning (GA-backed)
        - Ultra-high-net-worth independent RIA; $300B+ AUM
        - "GA strategic minority investment (2020); current AUM ~$300B+"
        - "Valuation not publicly disclosed; AUM multiple likely 2–5% at investment"
        - >-
          Direct GA portfolio context; shows GA's thesis on premium RIA platform economics
          and its capacity to support wealth management scale
        - >-
          Much more mature, seasoned RIA; private equity minority stake not a direct
          valuation comp but confirms GA's thesis and network support
      - - Public RIA / Wealthtech Universe
