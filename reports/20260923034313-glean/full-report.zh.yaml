        blocks:
          - type: paragraph
            body: >-
              Glean 的乐观情景建立在三个相互咬合的命题上：（1）企业知识分散在 20-100+ 个 SaaS 应用中，这是一个永久性结构问题，并会随着每引入一个新 SaaS
              工具继续加重，从而为中立、多生态搜索层打开一个不断扩张且耐久的市场；（2）Glean 已跑出企业搜索史上最快 ARR 扩张曲线（3 年内 $10M → $200M+），并得到
              Databricks、eBay、Booking.com 等 200+ 家标杆企业客户验证；（3）向 Glean Agents（GA May 2025）的扩展，打开了企业工作流自动化中更大、更新的价值获取机会，而
              Microsoft 和 Google 尚未为多生态部署有效产品化。如果 Glean 到 2027 年达到 $500M ARR，并维持 80%+ 毛利率，20–25x ARR 倍数可支撑 IPO 时
              $10–$12.5B 估值——相对 June 2025 $7.2B 入场价有 40–75% 上行空间。 [CV001] [CV002] [CV003]


              悲观情景同样有三条严肃命题：（1）Microsoft 365 Copilot 和 Google Workspace Gemini 已捆绑在现有企业许可中，且快速改善；单独为 Glean
              付费的边际价值按季度收窄；（2）Glean 的 $7.2B 估值对应估计 $200M ARR 的 36x，相比上市企业软件可比公司偏贵（ServiceNow 为 16–18x 前瞻收入；Salesforce 为
              7–9x）；（3）Glean 未披露 NRR、总流失率或单位经济性——一家 $200M ARR 公司缺失这些指标并不常见，可能暗示留存挑战。如果 Microsoft/Google 在 24
              个月内实现多生态搜索对等，Glean 增长降至 <30% YoY，估值重置到 10–12x ARR，则隐含 $2–2.4B 估值——较 $7.2B 入场价减值 67–72%。 [CV004] [CV005]
