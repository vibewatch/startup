      - number: '7.2'
        title: 监管、法律与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              Glean 在欧洲客户关系中按 GDPR 充当数据处理者；一旦发生客户数据泄露，或 EU AI Act 对 AI 搜索和智能体 AI 系统施加新义务，监管敞口就会变得实质性。EU AI Act（August
              2024 生效，2026 开始执行）将部分 AI 系统归为「高风险」——如果 Glean 的智能体能力用于 HR、信用评估、安全关键系统等高风险企业场景，Glean 可能需要承担 Article 10–15
              下的注册、透明度和审计义务。Glean 尚未披露任何 EU AI Act 合规路线图。 [CR006] [CR007]


              美国州级 AI 监管碎片化且在升级：California SB 1047（AI 安全）在 2024 年被否决，但已引发 30+ 个州的模仿立法；拟议中的美国联邦 AI 立法仍停滞不前。Glean 的智能体 AI
              能力会代表员工自主执行动作，未来可能纳入透明度和问责要求。目前没有任何具体美国 AI 法规直接适用于 Glean 产品，但监管方向明显指向更强监督。 [CR008] [CR009]


              知识产权风险相对可控：Glean 主要靠执行力和自研数据（Enterprise Graph）竞争，而不是靠基础 AI 专利。公开记录中尚未发现针对 Glean 的专利侵权主张。主要 IP
              风险偏防御性——没有专利组合，Glean 难以排除复制其架构的竞争对手。Enterprise Graph
              作为商业秘密受到保护，但如果关键工程师流向竞争对手，逆向工程仍有可能。截至研究日期，公开记录中未发现重大诉讼。 [CR010] [CR011]
