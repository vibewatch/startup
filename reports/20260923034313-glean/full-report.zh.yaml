            title: 没有 NRR 数据，无法评估 ARR 质量
            body: >-
              最重要的财务尽调项是净美元留存率（NRR）。没有 NRR，投资人无法判断 Glean 的 $100M ARR 是由存量队列扩张驱动（质量高、可预测性强），还是主要由新增客户驱动（依赖成交量、暴露于流失）。拥有一流
              NRR（>120%）的企业 SaaS 公司能享受高溢价倍数；而在 Glean 当前增长阶段，NRR 低于 110% 的公司会面临倍数压缩风险。
