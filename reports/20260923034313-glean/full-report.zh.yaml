      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: Enterprise Graph 既是核心差异化，也是核心风险
            body: >-
              Enterprise Graph 同时是 Glean 最有说服力的差异化，也是最关键的单点架构风险。所有产品能力——Search、Assistant、Agents——都依赖 Enterprise Graph
              交付准确、按权限执行、可个性化的知识表示。Graph 一旦出现数据质量问题，会传导到全部产品。Graph 的价值也会随使用时间加深，形成锁定效应；但在新部署中，如果 Graph
              数据不足以有效个性化，又会带来冷启动问题。
            calloutType: insight
            claimRefs:
              - CE013
              - CE002
          - type: callout
            title: FedRAMP 缺口排除了 $8–10B 联邦 TAM
            body: >-
              Glean 尚未披露任何 FedRAMP 授权进展、时间表或投入计划。FedRAMP High 授权通常需要 12–24 个月，并要求大量工程和合规投入。没有 FedRAMP，Glean 无法进入美国联邦政府每年
              $8–10B 的 AI 软件 TAM；在这一市场，Microsoft（FedRAMP High）和 Google（FedRAMP High）拥有结构性优势。
            calloutType: risk
            claimRefs:
              - CE015
              - CE018
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与牵引力
        blocks:
          - type: paragraph
            body: >-
              截至 2024 年 12 月，Glean 服务 200+ 家企业客户，公开点名账号包括 Databricks、Duolingo、Plaid、BILL、Canva、Sony
              Electronics、Booking.com、eBay、Grammarly、Gong、Pagerduty、Hashicorp、Rubrik 和
              Snowflake。客户群明显偏向高增长科技公司，它们通常具备三个共同特征：（1）大型、碎片化的知识库，横跨 20+ 个 SaaS
              应用；（2）员工数与信息量比例高（工程密集型组织）；（3）愿意为能降低信息检索摩擦的企业软件支付溢价。[CU001] [CU002]


              ARR 到 2024 年 12 月达到 $100M，并据报道在 2025 年超过 $200M，意味着约 ~100% 同比增长率——位列企业软件史上最快的 ARR 规模化轨迹之一。若以 $200M ARR 和
              200+ 家客户计算，隐含平均合同价值（ACV）约为 $1M，符合 Glean 以企业为中心的商业化策略。该 ACV 高于面向 SMB SaaS 常见的
              $100K–$300K，但仍在大型企业软件合同范围内。[CU003] [CU004]


              Glean 报告 DAU/MAU 约为 40%，对企业软件来说异常高；生产力工具通常为 20–25%。较高日活参与度归因于 Glean 的多入口部署（Slack、Teams、Chrome 扩展），它让 Glean
              出现在员工自然工作流中，而不是要求单独切换应用。高 DAU/MAU 是净收入留存率的领先指标，也能降低流失风险，不过 Glean 尚未公开披露 NRR 或总流失率。[CU005] [CU006]
