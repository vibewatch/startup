      - number: '5.2'
        title: 集成、部署与可靠性
        blocks:
          - type: paragraph
            body: >-
              Glean 在企业 SaaS 栈中支持 100+ 个连接器集成，包括 Google Workspace、Microsoft
              365、Slack、Salesforce、GitHub、Jira、Confluence、Notion、Dropbox、Box、ServiceNow、Workday
              等。每个连接器都是为特定应用定制的集成，负责认证（OAuth 2.0）、增量索引（delta updates）和该应用的 ACL 继承。随着源应用 API 演进，要让 100+
              个连接器保持高可靠性，需要持续投入大量工程资源。[CE007] [CE008]


              部署选项包括云 SaaS（Glean 托管在 Google Cloud Platform / AWS 上）、部署在客户自有 GCP 或 AWS 账户中的私有云，以及未来的本地部署选项。Model Hub 于
              2025 年发布，让客户可选择由哪个底层 LLM 驱动 Glean Assistant，支持
              OpenAI、Anthropic、Google，并可能支持开源模型。这种模型无关架构在受监管行业里有信任和采购优势。[CE009] [CE010]


              Glean 覆盖多个部署入口：Glean Web 应用、Chrome 扩展、Slack 集成、Microsoft Teams 集成、Zoom
              集成和移动应用。多入口布局对日活使用至关重要：员工应在已有工作场景中遇到 Glean，而不是切到新的搜索界面。2025 年 9 月第三代 Glean Assistant
              增加了多步任务执行能力——可以用多个自动化步骤完成研究任务，而不再要求用户手动发出每个查询。[CE011] [CE012]
            claimRefs: []
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
