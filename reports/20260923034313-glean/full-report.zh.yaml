      - number: '6.3'
        title: 客户成功、NPS 与留存
        blocks:
          - type: paragraph
            body: >-
              公开记录中的 Glean 客户成功指标以正面为主。截至 2025 年，G2 Crowd 在 200+ 条评论中的平均评分为 4.6/5，核心主题包括搜索质量（“能找到其他工具找不到的东西”）、易于管理，以及
              Slack 集成质量。最常被提到的负面评论主题是：（1）连接器设置所需实施时间高于预期；（2）源系统元数据质量不一致时，搜索相关性会下降；（3）成本——多位评论者认为，相比 Microsoft 和 Google
              的捆绑替代品，Glean 显得昂贵。[CU013] [CU014]


              具名客户证言为 Databricks 和 Duolingo 部署提供了很强的社会证明。Databricks 用 Glean 管理工程和销售团队知识，并在多篇新闻稿中作为参考客户出现。Duolingo
              则被引用为使用 Glean 提升员工入职效率。两家公司均未披露具体生产力指标。[CU015] [CU016]


              负面客户信号主要来自成本：多条 G2 评论明确指出，对 Glean 使用频率较低的员工（例如每周一次，而非每日用户），Glean
              的单席成本很难合理化。这种使用集中风险会在企业续约中形成脆弱性：采购团队可能只保留高频用户席位，从而压缩 Glean 的单客户 ACV。$200M ARR 增长说明该风险尚未大规模显现，但它仍是 Glean
              定价模型中的结构性弱点。[CU017] [CU018]
