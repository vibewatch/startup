      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 观察：优秀公司，错误入场价
            body: >-
              Glean 是 2020s 最有吸引力的企业 AI 公司之一——真实 ARR、真实客户、真实留存、真实产品差异化。观察的投资建议不是怀疑公司，而是坚持估值纪律：在估计 ARR 的 36x、Series F
              $7.2B 入场价下，投资人面对超大规模云厂商捆绑风险时下行保护有限。基准情景到 2027 年回报为 -17%。高风险私人成长投资所需的安全边际（通常要求入场后 3-5x 预期回报）在 $7.2B
              价位拿不到。可在 $3-4B 入场价（老股交易、下调轮，或披露 NRR 的 IPO S-1）时重新评估。
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
          - type: callout
            title: NRR 披露是关键缺失信号
            body: >-
              Glean 在 $200M ARR 阶段仍未披露 NRR，这并不常见。大多数企业 SaaS 公司达到这一规模后，会把 NRR 作为最主要的增长质量信号披露。Glean 未披露
              NRR，可能意味着指标极强（>130%，留到 IPO 制造惊喜），也可能意味着存在问题（<110%，为避免投资人担忧而遮住）。考虑以 $7.2B 投资的 VC，不能在没有 NRR
              数据的情况下承销这条投资逻辑。私募尽调门槛是：披露 NRR >120%，否则不投。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
