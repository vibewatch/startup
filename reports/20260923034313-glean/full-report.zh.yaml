      - number: '3.3'
        title: 护城河评估与竞争耐久性
        blocks:
          - type: paragraph
            body: >-
              Glean 的主要护城河是跨应用广度（100+ 个集成）、权限感知索引，以及 Enterprise Graph 个性化层。Enterprise Graph
              是公司专属知识图谱，会学习每位员工的角色、团队和工作上下文；使用越多，切换成本越深。尚无竞争对手宣布过兼具深度（员工级上下文）和广度（跨应用数据）的可比个性化层。[CP011] [CP012]


              Glean 护城河能否顶住 Microsoft 365 Copilot，是最核心的竞争问题。Microsoft 正大举投资 Copilot 能力扩张，并在 2025 年宣布 M365 Copilot
              将无额外加价地捆绑进所有 E3/E5 许可——这实际上让现有企业 M365 客户免费获得该产品。这是对 Glean 采购理由的正面攻击。Glean 的回应是更高搜索质量，以及 Microsoft
              不易复制的跨应用覆盖范围，除非 Microsoft 能与 Salesforce、Slack、Atlassian 和 GitHub 建立排他合作。[CP013] [CP014]


              VC 市场已经释放信号：Google DeepMind 和 Microsoft OpenAI 投资代表一种转向捆绑 AI 策略的趋势，可能使企业搜索层商品化。不过，企业 IT
              买方调查显示，只要生产力收益可证明，60–70% 的公司仍更偏好同类最佳 AI 搜索工具，而不是捆绑方案。在 Microsoft Copilot 质量追上之前，这一偏好窗口可能只有 18–36
              个月。[CP015] [CP016] 这个窗口会继续收窄。
