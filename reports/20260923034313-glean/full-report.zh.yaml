      - number: '7.3'
        title: 运营、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Glean 的运营风险集中在三处：（1）LLM API 的可靠性和成本——Glean 的 AI 能力依赖第三方 API，可能遇到宕机、限流和调价；Model Hub
              降低单一供应商失效风险，但会增加集成复杂度。（2）连接器维护负担——100+ 个连接器需要随着源应用 API 变化持续维护；关键连接器（如 Slack、Salesforce）一次重大 API
              变更，就可能造成企业范围搜索中断。（3）安全泄露风险——Glean 会索引敏感企业数据（HR、法律、M&A）；一旦安全事件暴露客户数据，对企业信任和客户留存将是灾难性打击。 [CR012] [CR013]
              [CR014]


              财务风险：Glean 累计融资 $765M，但未披露烧钱速度、现金跑道或盈利时间表。在 $200M ARR、1,300–1,500 名员工的规模下，Glean 每年运营支出大概率烧掉
              $80–$150M。Series F（$150M，June 2025）按当前烧钱速度大概率提供 12–24 个月现金跑道。通往盈利需要二选一：（a）ARR 继续高速增至
              $400M+；或（b）显著裁员——二者都没有保证。LLM API 成本上升（大规模 GPT-4 推理成本）会随着 AI 使用增长挤压毛利。 [CR015] [CR016]


              人才与执行风险：Arvind Jain 是 Glean 和其产品愿景最显眼的外部代言人；公司未公开披露清晰接班计划。Glean 尚未披露高管离任，但从创业公司转向企业级公司（到 2026 年可能 1,500+
              名员工）会带来执行挑战：销售、客户成功和产品管理要同时扩张。国际扩张（EMEA、APAC）需要资深区域管理层和本地化投入。 [CR017] [CR018]
