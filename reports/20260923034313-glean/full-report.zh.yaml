              Glean 在 June 2025 的 $150M Series F 中获得 $7.2B 估值，意味着收入倍数约为估计 $200M ARR 的 36x——只有在 Glean 能再维持 3+ 年 80%+
              增长时，这种溢价估值才站得住。私募市场可比点包括：Moveworks（$2.9B，2023 估值，~$50M ARR → ~58x ARR）；Guru（$1.3B，2022，ARR 更低）；以及
              Elastic（上市公司，ELK stack 企业搜索，~7x 前瞻收入）。Moveworks 这个可比对象直接相关：Moveworks 是近身竞争对手，解决相似企业知识管理痛点。Elastic
              的公开市场倍数（7–8x）代表成熟但低增长企业搜索公司的底部。 [CV007] [CV008] [CV009]


              公开 SaaS 市场背景：Glean Series F（June 2025）时，BVP Nasdaq Emerging Cloud Index 交易在 8–10x 前瞻收入；第一四分位高增长云公司（>50%
              增长）为 15–20x；超高速增长 AI 公司（>80% 增长）为 25–40x。Glean 的 36x ARR 倍数处在 AI 溢价区间高端，只有在持续 >80% YoY 增长下才可维持。若增长降至 60%
              YoY，公开市场可比倍数会把入场倍数压缩到 ~20x ARR，隐含 $4B 估值——较 Series F 入场减值 44%。 [CV010] [CV011] [CV012]


              关键估值假设是 ARR 增长轨迹：在 $200M ARR、100% YoY 增长下，Glean 距离 $800M–$1B ARR 还有 3–4 年；这一规模可支持以 12–15x 收入 IPO，对应
              $10–15B 公开市场市值。关键路径包括：（1）维持 NRR 高于 120%；（2）在竞争性续约中正面赢过 Microsoft Copilot；（3）在 12–18 个月内证明 Agents
              增购收入。三者任何一项失败，都会构成实质性投资逻辑破裂事件。 [CV013] [CV014]
            claimRefs: []
