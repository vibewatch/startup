            body: >-
              Arvind Jain 的履历几乎无法复制：他既做过 9 年 Google 搜索基础设施工程师，又是 Rubrik（云数据管理，2024 年 IPO）的联合创始人。这种双重可信度（深厚搜索技术 + 已验证的企业
              CEO）让 Glean 的创始人-市场匹配在企业 AI 里处于最强一档。团队高密度招募前 Google 搜索工程师的能力，进一步形成会自我强化的人才护城河。
            calloutType: strength
