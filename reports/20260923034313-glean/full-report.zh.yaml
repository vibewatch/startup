          - type: callout
            title: 40% DAU/MAU 是极强留存信号
            body: >-
              ~40% 的 DAU/MAU 对企业软件非常出色，品类领先生产力工具通常只有 20–25%。这一指标说明 Glean 正在形成习惯性日常使用——这是企业软件的圣杯，能推动高溢价 NRR 和低总流失率。如果
              Glean 在客户数超过 200 家后仍能维持 40% DAU/MAU，留存经济应能支撑 120%+ NRR，从而支撑当前 $7.2B 估值的增长轨迹。
