      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 6 月，Glean 六轮累计融资约 $765 million。按估计每季度 $70–150M（每年 $280–600M）的烧钱速度，公司从 2025 年 6 月 Series F
              完成起估计拥有 1.5–3 年现金跑道。区间较宽，反映公开资料对运营成本估计的不确定性。[CI014] [CI015]


              公司能否走向盈利，取决于 ARR 是否继续每年 2x+ 增长：如果 Glean 到 2026 年达到 $400M ARR，在约 $350M 固定成本基础上释放经营杠杆，可能接近盈亏平衡。若 ARR 增速降至
              1.5x 或以下，公司在盈利前还需要追加资本，从而产生融资依赖风险。[CI016] [CI017]


              $7.2B 估值的 Series F 由预 IPO 机构投资人 Wellington Management 领投，这对 IPO 准备轨迹是正面信号。若 Glean 具备 $200M ARR 和 2x+
              增长，可能符合 2026–2027 年公开市场发行条件，不过软件 IPO 窗口仍不确定。公司尚未披露任何 IPO 计划。[CI018] [CI019]
