      - number: '1.3'
        title: 融资历史与资本位置
        blocks:
          - type: paragraph
            body: >-
              2019 至 2025 年，Glean 六轮累计融资约 $765M，并在 2025 年 6 月由 Wellington Management 领投的 Series F 中达到 $7.2B 估值。融资路径从
              2019 年 $15M Series A 到六年后的 $150M Series F，既反映早期投资人的坚定判断，也说明市场越来越愿意为已证明 ARR 增长的企业 AI 软件支付高倍数。[CO013]
              [CO014] [CO015]


              投资人组合非常强：Kleiner Perkins 和 Lightspeed Venture Partners 共同领投 Series A，并再次共同领投 Series
              D，展现了企业软件里少见的多轮坚定投入。Sequoia 领投 $100M Series C，使 Glean 于 2022 年 5 月进入独角兽行列。Series D 引入 Capital One
              Ventures、Databricks Ventures、Citi 和 Workday Ventures 等战略投资方——这些企业软件买方同时验证了产品市场匹配和战略相关性。Series E 加入
              Altimeter Capital 和 DST Global；Series F 加入 Wellington Management、Khosla Ventures、Bicycle Capital 和
              Geodesic Capital。[CO016] [CO017] [CO018]


              ARR 从 2023 年约 $40M 增至 2024 年 12 月的 $100M，增长 2.5x；到 2025 年底估计达到 $200M，公司披露的 2025 年内部目标为 $200–250M。公司在
              Series D 前一年（2024 年初）ARR 接近翻了四倍。企业客户已超过 200 家，2024 年大约同比翻倍。[CO019] [CO020] [CO021]


              截至 2025 年末，公司员工约 1,300–1,500 人，高于 Series E 时的不到 700 人。这一员工增长轨迹符合公司为全球多十亿美元软件机会扩张企业销售和商业化组织的阶段。[CO022]
              [CO023]
