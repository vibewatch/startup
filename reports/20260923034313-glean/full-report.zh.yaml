  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Glean 的竞争分三层：（1）捆绑 AI 搜索的平台型在位者——Microsoft 365 Copilot 和 Google Workspace Gemini——依靠既有装机基础分发；（2）专门的 AI
              企业搜索厂商——Elastic Enterprise Search、Coveo 和 Guru——覆盖更窄用例；（3）新兴 AI 生产力平台——Notion AI、Confluence AI 和
              ServiceNow Now Assist——从相邻软件品类向知识管理扩张。最危险的竞争对手是 Microsoft，它以 $30/user/month 的捆绑形式，把竞争产品分发给 400 million 现有
              M365 订阅用户。[CP001] [CP002]


              竞争动态在跨应用搜索广度和 RAG 准确性上偏向 Glean，但 Microsoft 和 Google 拥有结构性分发优势：它们的产品通过既有企业关系销售，预算已预先谈妥，不需要新的采购周期。Glean
              要赢下企业交易，必须同时跨过产品评估门槛和采购门槛。[CP003] [CP004]
            claimRefs: []
