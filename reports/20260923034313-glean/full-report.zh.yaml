      - - ARR 增长可持续性
        - $200M ARR、同比 100%；史上最快企业搜索增长轨迹；未来 3+ 年仍有高增长
        - 捆绑替代品改进后增长放缓；2025-2026 续约周期是第一场考验
        - 观察 2026 Q2-Q3 续约队列，寻找第一信号
