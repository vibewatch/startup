          - type: callout
            title: 估值倍数风险
            body: >-
              以约 $100–200M ARR 对应 $7.2B 估值，Glean 的交易倍数为 36–72x ARR，处在企业软件最高区间。这个定价要求 Glean 连续多年维持 2x+ ARR
              增长，把总可用市场从纯搜索扩展到智能体 AI，并证明其护城河能顶住占据主导地位的 Microsoft 365 Copilot。ARR 增长一旦放缓，当前估值就很难撑住。
            calloutType: risk
            claimRefs:
