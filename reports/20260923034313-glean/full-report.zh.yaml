      - number: '2.2'
        title: 市场规模
        blocks:
          - type: paragraph
            body: >-
              第三方对企业 AI 搜索和知识管理软件市场的规模估算差异很大，取决于定义范围。Gartner 对企业搜索软件市场的测算（2024 年）约为 $4.5B，CAGR 约 ~12%。IDC 对更宽泛企业 AI
              软件市场（包括 AI 助手、搜索和工作流自动化）的测算到 2026 年达到 $45B。与 Glean 定位最可比的市场——面向 250+ 员工公司的 AI 原生企业知识管理——估计 2025 年为
              $8–12B，到 2028 年随 AI 原生产品替代旧方案，以 25–30% CAGR 增至 $20–30B。[CM007] [CM008]


              TAM/SAM/SOM 拆解：全球 250+ 员工公司中的企业 AI 知识管理软件 TAM 估计为 $12B（2025 年）。按 $15/seat/month 定价假设，以及全球 250+ 员工企业中约 65M
              名知识工作者计算，年度潜在收入约为 $11.7B。Glean 的 SAM 收窄到英语为主市场（美国、英国、加拿大、澳大利亚）和 SaaS 渗透率高的行业，约为 $5–7B。Glean 在 3
              年窗口（2025–2027）的 SOM 基于当前 ARR 轨迹和已宣布的国际扩张计划，约为 $250–500M。[CM009] [CM010]


              由于品类定义不确定，规模测算信心为中低。分析师对 Microsoft 365 Copilot 是否应计入同一 TAM 存在分歧：纳入会把市场规模抬到 $45B+，但也会让 Glean 的 SOM
              显得更小；排除则意味着把它视为另一类捆绑产品。Gartner（$4.5B 企业搜索）和 IDC（$45B+ 企业 AI 软件）的估算冲突，正反映这种定义模糊，必须把它们视为上下界，而不是点估计。[CM011]
              [CM012]
