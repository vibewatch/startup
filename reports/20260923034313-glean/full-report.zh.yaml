      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: 续约经济中的使用集中风险
            body: >-
              Glean 的企业定价按席位收费，因此存在续约脆弱性：如果客户主要只有一小部分日活重度用户在使用 Glean，客户可能减少席位，而不是按相同规模续约。多条 G2 评论把成本标记为顾虑，IT
              整合周期中的采购团队也有动力砍掉使用不足的席位许可。Glean 的回应——通过 Agents 和 Canvas 扩宽用例——方向正确，但它必须在下一轮续约前让新产品成功被采用。
            calloutType: risk
