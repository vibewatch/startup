      - number: '2.3'
        title: 买方分层与增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              Glean 的主要买方是 500–10,000 人技术优先公司里的 CIO、CTO 和 CPO，这类公司 SaaS
              扩散最严重，信息碎片化痛点也最强。次级买方是金融服务、医疗和专业服务等行业中大型企业（10,000+ 名员工）的 IT
              总监和企业架构师。采购过程涉及多方：IT/安全团队控制采购，业务线经理推动采用，员工作为终端用户则可能因低参与度扼杀采用。[CM013] [CM014]


              关键增长驱动因素包括：（1）SaaS 加速扩散——普通企业使用 130+ 个 SaaS 应用，高于 2020 年的 80
              个，信息碎片化的增速超过内部搜索能力；（2）远程和混合办公常态化——远程员工不能依赖物理邻近或茶水间知识分享，更依赖数字知识检索；（3）LLM 商品化——GPT-4 级模型已可通过 API 使用，让 Glean
              能基于专有数据交付企业级 AI 回答，而不是泛互联网训练内容；（4）ROI 驱动的 AI 支出——企业必须证明 AI 投入有实在回报，而能量化减少搜索时间的生产力工具最容易自证。[CM015] [CM016]
              [CM017]


              关键采用约束包括：（1）Microsoft 365 Copilot 捆绑——这是最重大的结构性约束；已经购买 E3/E5 许可的企业会面临强烈内部压力，避免再为 AI
              搜索供应商单独付费；（2）数据安全顾虑——IT 团队对第三方供应商索引 HR 文件、法律文档和 M&A 记录等敏感公司数据高度谨慎；（3）集成复杂度——连接 100+ 个应用需要大量 IT
              资源和持续维护；（4）用户采用障碍——即便产品更好，知识工作者也可能抗拒改变搜索习惯。[CM018] [CM019] [CM020]
