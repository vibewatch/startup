      - number: '6.2'
        title: 商业化动作与销售流程
        blocks:
          - type: paragraph
            body: >-
              Glean
              的主要商业化动作是企业直销，并采用多倡导者切入策略：初始部署通常从一个部门（IT、工程或销售）开始，再通过产品驱动扩张到同一组织内的其他部门。这种先落地再扩张模式带来强劲的扩张收入动态；随着席位数和功能层级增加，单客户
              ACV 会随时间提高。企业内部的病毒系数被 Glean 的 Slack/Teams 入口放大：早期使用者在 Slack 频道分享 Glean 生成的回答时，其他员工能看到价值并申请访问。[CU007]
              [CU008]


              Glean 参与的企业采购周期通常为 3–6 个月，需要安全审查、法律审查和 IT 批准。采购环节的竞争护城河来自 Glean 的 SOC 2 Type II 和 ISO 27001
              认证，以及能满足信息安全团队数据暴露顾虑的权限感知索引架构。没有这些认证的竞争对手会在安全审查阶段出局，这让 Glean 的竞争范围缩小到 Microsoft 365 Copilot（捆绑）、Google
              Workspace Gemini（捆绑）和少数点状方案。[CU009] [CU010]


              定价按席位并绑定年度承诺；Glean 未公开披露单席价格，但行业报道显示为每用户每月 $15–$25，与 Microsoft Copilot for M365 定价（非企业
              $30/user/month）相当。大型部署的企业折扣会降低有效单席价格。高级层会增加 Glean Agents 访问权限。Glean 不提供自助免费层，刻意把客户群限制在由 IT
              管理采购的企业中。[CU011] [CU012]
