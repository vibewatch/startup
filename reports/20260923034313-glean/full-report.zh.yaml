        - Enterprise Graph + 100+ 个连接器 + Agents 相比超大规模云厂商领先 2-3 年
        - Microsoft 和 Google 可凭现有 API 合作，在 24 个月内复制连接器广度
        - 按季度跟踪超大规模云厂商连接器公告
      - - 估值
        - AI 时代愿意给超高速增长溢价，36 倍 ARR 有解释空间（$200M ARR 对应 $7.2B）
