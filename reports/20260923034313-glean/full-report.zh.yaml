chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Glean Technologies, Inc. 是一家企业 AI 平台公司，2019 年 3 月成立，总部位于 Palo Alto, California。公司打造 Work AI 平台，把企业搜索、AI
              助手和自主 AI 智能体统一到 100+ 个办公应用集成之上。Glean 的核心产品让知识工作者通过一个权限感知界面查询全部公司数据——从 Slack 消息、Salesforce 记录到 GitHub
              拉取请求——底层由大语言模型和检索增强生成（RAG）驱动。AI 助手基于公司自己的文档并附带引用来回答问题，避开通用 AI 聊天机器人常见的幻觉问题。2025 年，公司推出 Glean Agents（2025 年
              5 月 GA）——可利用公司数据执行多步工作流的自主智能体——以及 Enterprise Graph（2025 年 9 月），后者是个性化层，会按员工角色、团队和历史交互调整回答。[CO001] [CO002]
              [CO003]


              Glean 的商业模式是按席位计费的 SaaS，企业 ACV 通常在每年
              $100,000–$1,000,000，取决于席位数和模块使用量；大客户还会为高级智能体与治理功能付费。公司瞄准中型市场和大型企业组织（500–100,000+
              名员工），这些组织面临突出的知识管理碎片化问题。收入模式以订阅为主，智能体任务执行带来用量上浮。截至 2026 年 Q1，公司尚未披露自助服务层。[CO004] [CO005]
