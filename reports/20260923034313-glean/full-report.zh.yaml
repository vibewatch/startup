  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >-
              Glean 通过企业层按席位 SaaS 订阅创收。典型企业 ACV 从 $100,000 到超过 $1,000,000 不等，取决于席位数、模块（仅 Search，或 Search + Assistant +
              Agents）和部署复杂度。公司报告称，ARR 到 2024 年 12 月达到 $100 million，高于 2023 年约 $40 million，同比增长 2.5x。Business Insider
              披露，公司 2025 年底 ARR 内部目标为 $200–250 million，与持续 2x+ 增长一致。[CI001] [CI002] [CI003]


              收入按 ASC 606 以订阅方式确认，企业协议通常为年度或多年期合同，并按年预付。这带来有利的营运资本动态：现金先于收入确认被收取。Glean 未披露 Search、Assistant 和 Agents
              各模块收入结构，但 2025 年 5 月 Agents 的推出，可能在席位订阅之上增加一层按用量计费收入。[CI004] [CI005]


              ARR 进展：2022 年约 $10M（根据 ARR 翻四倍报道估算）、2023 年约 $40M、2024 年 $100M、2025 年目标 $200–250M。2024 年 2 月（Series D）前一年
              ARR 增长 4x 的报道说明，2022 到 2023 年是增长最快阶段。如果 2025 年 $200–250M 目标实现，将意味着 ARR 连续第三年实现 2x+ 增长。[CI006] [CI007]
