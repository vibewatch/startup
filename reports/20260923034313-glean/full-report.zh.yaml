          detail: Claude 模型；次要 LLM 选项
        - id: d3
          label: Google Gemini API
          detail: Gemini 模型；第三个 LLM 选项
        - id: d4
          label: GCP / AWS 基础设施
          detail: 核心计算、存储、网络
        - id: d5
          label: 源应用 API（100+）
          detail: Slack、Salesforce、Google Workspace、M365、Jira、Confluence 等
        - id: d6
          label: Glean Model Hub
          detail: LLM 路由层；提供多供应商韧性
        - id: d7
          label: Enterprise Graph 引擎
          detail: 个性化和知识图谱层；产品的核心依赖
        - id: d8
          label: Glean 产品（Search / Assistant / Agents）
          detail: 面向客户的产品；全部依赖 Enterprise Graph 引擎
      edges:
        - from: d1
          to: d6
        - from: d2
          to: d6
        - from: d3
          to: d6
        - from: d4
          to: d7
        - from: d5
          to: d7
        - from: d6
          to: d7
        - from: d7
          to: d8
    claimRefs:
      - CR014
      - CR003
  - id: FV001
    title: 投资建议逻辑流
    type: flow
    layout: standard
    summary: 决策流展示投资建议逻辑：强投资逻辑 + 强牵引 + 昂贵估值 = 观察建议。关键决策门槛是 NRR 是否披露、估值入场纪律，以及对超大规模云厂商竞争的持续监测。
    data:
      nodes:
        - id: f1
          label: 市场逻辑：需求能否持续？
          detail: 企业知识碎片化是结构性问题；中立、跨生态的搜索会有持续需求
        - id: f2
          label: 产品逻辑：是否可防守？
          detail: Enterprise Graph、100+ 个连接器、权限感知架构共同构筑切换成本护城河
        - id: f3
          label: 牵引逻辑：是否已验证？
          detail: $200M ARR、200+ 家企业、40% DAU/MAU、100% 同比增长
        - id: f4
          label: NRR：是否披露且 >120%？
          detail: 未披露：投资决策的关键门槛
        - id: f5
          label: 估值：入场价格是否可接受？
          detail: $7.2B 对应 36x ARR：按基准情景风险看过贵；需要 15-20x 入场
        - id: f6
          label: 观察：高信心观察名单
          detail: 监测 Series G、老股交易、IPO S-1，或市场回调后以 $3-4B 入场的机会
      edges:
        - from: f1
          to: f2
          label: 是 → 继续
        - from: f2
          to: f3
          label: 是 → 继续
        - from: f3
          to: f4
          label: 是 → 继续
        - from: f4
          to: f5
          label: 未知 → 谨慎推进
        - from: f5
          to: f6
          label: 否 → 观察；等待更好入场点
    claimRefs:
      - CV015
      - CV016
  - id: FV002
    title: 按 ARR 倍数和 2027 年 ARR 测算的估值敏感性
    type: bar
    layout: wide
    summary: 柱状图展示不同 ARR 和倍数情景下 Glean 隐含的 2027 年估值，并标出 $7.2B 的 Series F 入场估值作对比。只有乐观情景下 20x 倍数能带来回报；基准和悲观情景都会亏损。
    data:
      items:
        - label: 悲观 – 10x（$250M ARR）
          value: 2.5
        - label: 悲观 – 15x（$250M ARR）
          value: 3.75
        - label: 基准 – 10x（$400M ARR）
          value: 4
        - label: 基准 – 15x（$400M ARR）
          value: 6
        - label: 基准 – 20x（$400M ARR）
          value: 8
        - label: 乐观 – 15x（$600M ARR）
          value: 9
        - label: 乐观 – 20x（$600M ARR）
          value: 12
    claimRefs:
      - CV013
      - CV014
  - id: FV003
    title: 按情景划分的估值回报范围（2027 年退出）
    type: range
    layout: standard
    summary: >-
      区间图展示以 $7.2B Series F 入场为起点，2027 年可能退出估值（单位：$B）的分布。悲观情景意味着 -65% 减值；乐观情景意味着 +67% 回报。基准情景下会亏损
      -17%，说明若按基准情景投资，当前入场价过高。
    data:
      items:
        - label: 悲观情景估值区间
          low: 2
          high: 3.5
        - label: 基准情景估值区间
          low: 5
          high: 7
        - label: 乐观情景估值区间
          low: 10
          high: 13.5
        - label: 合理入场估值（15-20x ARR）
          low: 3
          high: 4
    claimRefs:
      - CV013
  - id: FV004
    title: 投资决策 KPI
    type: kpi
    layout: standard
    summary: 投资决策的关键绩效指标，展示当前数值与投资逻辑门槛的对照。
    data:
      items:
        - label: ARR（估计 2025 年）
          value: $200M+
          context: 考虑门槛：$100M+ ✓
        - label: ARR 同比增长
          value: ~100%
          context: 门槛：>80%，才能支撑 AI 溢价倍数 ✓
        - label: 企业客户
          value: 200+
          context: 门槛：100+ 个标杆客户 ✓
        - label: DAU/MAU 参与度
          value: ~40%
          context: 门槛：>30%，体现企业日常使用习惯 ✓
        - label: 净留存率（NRR）
          value: Not disclosed
          context: 门槛：需 >120% ✗（未知）
        - label: 入场估值
          value: $7.2B (36x ARR)
          context: 目标入场：$3-4B（15-20x ARR）✗（过贵）
        - label: 估值立场
          value: Expensive
          context: 36x ARR 没有安全边际
        - label: 投资建议
          value: TRACK
          context: Series G、老股交易或 IPO S-1 时再评估
    claimRefs:
      - CV015
