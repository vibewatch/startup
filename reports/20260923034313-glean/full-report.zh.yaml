companyProfile:
  summary: >-
    Glean 于 2019 年 3 月在 Palo Alto 创立，四位创始人都来自 Google 或 Meta：Arvind Jain（CEO，曾在 Google 工作 9 年，也是 Rubrik 联合创始人）、T.R.
    Vishwanath（CTO，前 Meta）、Tony Gentilcore（前 Google）和 Piyush Prahladka（前 Google AI）。公司的核心判断是，企业员工每天会在 20-100+ 个 SaaS
    应用里花 2-3 小时找信息；一个中立、跨生态的 AI 搜索层，可以把碎片化知识统一到一个智能界面里。Glean 平台分三层产品：Glean Search（向量 + BM25 混合搜索，并按权限索引）、Glean
    Assistant（基于 RAG 的对话式 AI，使用 Model Hub，支持 OpenAI、Anthropic 和 Gemini）以及 Glean Agents（自主工作流自动化，2025 年 5 月
    GA）。Enterprise Graph（2025 年 9 月）是公司的专属知识个性化层，会根据每位员工的角色、团队和工作场景调整上述三层产品。公司从 Kleiner
    Perkins、Lightspeed、Sequoia、General Catalyst、Altimeter、DST Global 和 Wellington Management 等投资方累计融资 $765M，2025 年 6 月
    Series F 后估值达到 $7.2B。ARR 从 $10M（2022 年估计）增至 $100M（2024 年 12 月披露），再到 $200M+（2025 年估计），同比增长约 100%；企业客户超过 200 家，包括
    Databricks、eBay、Booking.com、Duolingo、Canva、Sony Electronics 和 Plaid。CEO Arvind Jain 披露 DAU/MAU 约为 40%，高于企业软件常见的
    20-25%，说明日常使用习惯很强。公司约有 1,300-1,500 名员工，目前尚未盈利。投资建议为观察（TRACK）：投资逻辑很强，牵引力也真实，但以估计 ARR 计算，$7.2B 估值相当于 36x
    ARR；在超大规模云厂商捆绑风险和 NRR 未披露的情况下，安全边际不足。
