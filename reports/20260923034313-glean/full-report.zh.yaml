      - number: '8.3'
        title: 投资建议与退出准备度
        blocks:
          - type: paragraph
            body: >-
              建议：观察（高确信度观察名单；不要以 $7.2B Series F 入场价投资）。投资逻辑有吸引力，牵引力也真实——$200M ARR、200+ 家企业客户、40% DAU/MAU，以及企业搜索史上最快 ARR
              扩张。挡住投资的不是逻辑质量，而是估值：36x ARR 下，考虑超大规模云厂商捆绑风险，安全边际不足。更有吸引力的入场区间是 $3–4B（当前 ARR 的 15–20x），可来自市场调整中的平轮或
              下调轮，或以低于主轮价格的折扣参与老股交易。公司应在 Series G 或 IPO S-1 阶段重新评估。 [CV015] [CV016]


              退出准备度距离 IPO 还有 2–3 年。Glean 当前画像——$200M ARR、100% 增长、200+
              家企业客户、知名投资人阵容（Sequoia、KP、Lightspeed、Altimeter、Wellington）——符合 2027–2028 年以 $600–$800M ARR 递交 IPO 的条件。IPO
              前主要里程碑是：（1）公开披露 NRR 高于 120%；（2）Agents 收入占总 ARR 的有意义比例（>15%）；（3）自由现金流转正，或在 IPO 后 12 个月内有清晰转正路径。没有
              FedRAMP，Glean 会把联邦市场排除在 IPO TAM 之外，可能限制 S-1 叙事。 [CV017] [CV018]


              投资逻辑破裂触发器：（1）Microsoft Copilot 在 24 个月内展示多生态索引能力（Google Workspace + Slack + Salesforce 同时覆盖）；（2）Glean 披露
              NRR 低于 110%，指向留存问题；（3）ARR 增长连续两个季度低于 60% YoY；（4）重大企业数据泄露导致两个或以上 logo 级客户流失；或（5）关键联合创始人（Arvind
              Jain）离任且没有清晰接班公告。任一事件都会触发对投资逻辑的即时重审。 [CV019] [CV020]
            claimRefs: []
