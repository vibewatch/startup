      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: Microsoft 365 Copilot：结构性 TAM 天花板风险
            body: >-
              Microsoft 365 Copilot 可作为附加产品，以 $30/user/month 提供给 400+ million Microsoft 365 商业用户。如果企业 IT 买方认为 Copilot
              对搜索和 AI 助手用例“够用”，Glean 的有效 SAM 会明显收缩。Microsoft 捆绑约束是 Glean 投资人最需要跟踪的单一市场动态风险：它不会出现在分析师 TAM
              测算里，却会给企业客户可触达范围设置结构性天花板。
            calloutType: risk
            claimRefs:
              - CM005
              - CM019
          - type: callout
            title: AI 原生知识管理是新品类，不只是更好的搜索
            body: >-
              Glean 受益于创造了一个新的预算类别——“企业 Work AI”——而不是去争夺既有企业搜索预算。多数大型企业没有专门的企业搜索预算项；相关预算嵌在 IT 生产力或基础设施里。能交付可量化生产力收益的 AI
              原生平台可以为新增预算项提供理由，从而减轻与 Microsoft 和 Google 的零和竞争。
            calloutType: insight
            claimRefs:
