  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品平台架构
        blocks:
          - type: paragraph
            body: >-
              Glean 的 Work AI 平台有三层核心产品：Glean Search（基础企业搜索引擎）、Glean Assistant（对话式 AI 层）和 Glean Agents（自主工作流自动化层，2025 年
              5 月 GA）。三层都建在 Enterprise Graph 之上；Enterprise Graph 是公司专属知识表示，建模所有已连接应用中，文档、员工、团队和项目之间的关系。Enterprise Graph
              于 2025 年 9 月发布，是支撑 Glean 个性化能力的第三代架构。[CE001] [CE002]


              搜索层采用混合检索，把语义向量搜索（dense retrieval）与 BM25 关键词搜索结合，并按 Enterprise Graph
              对用户角色、团队和近期工作的信号加权。权限感知索引是基础架构约束：Glean 索引的每份文档都会继承源应用中的访问控制列表（ACL），确保搜索结果永远不会露出用户在源系统中无权访问的文档。这让 Glean
              区别于不执行权限校验、直接聚合数据的消费级搜索工具。[CE003] [CE004]


              AI 助手层使用检索增强生成：查询会从 Enterprise Graph 检索最相关文档，再把这些文档传给大语言模型（通过 Model Hub 支持 OpenAI GPT-4、Anthropic Claude 和
              Google Gemini），生成带引用的回答。Glean 不用公司数据微调基础 LLM，而是使用上下文检索；这样既降低幻觉风险，也避免把公司数据训练进模型权重后产生的数据隐私顾虑。[CE005] [CE006]
            claimRefs: []
