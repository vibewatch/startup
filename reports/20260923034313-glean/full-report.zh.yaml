  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Glean 参与的是企业 AI 搜索和知识管理软件市场——位于企业搜索、AI 助手和工作流自动化的交叉点。相关可服务市场覆盖拥有 250+ 名员工、同时使用三个以上企业 SaaS 应用（Slack、Google
              Workspace、Salesforce、GitHub 等）的组织中的知识工作者。它解决的核心问题是信息碎片化：企业员工估计每周要花 20% 工作时间在不同系统间找信息。McKinsey
              估计，提升知识工作者的信息检索效率，每年可在全球释放 $230B 生产力价值。[CM001] [CM002]


              市场边界：可服务机会包括（1）取代过时本地搜索设备的企业搜索软件（Elasticsearch、Solr、旧版 SharePoint）；（2）生产力套件的 AI 助手附加产品（Microsoft 365
              Copilot、Google Workspace
              AI）；（3）独立知识管理平台（Guru、Confluence、Notion）。排除范围包括消费者搜索（Google.com）、网页爬虫搜索引擎、电商商品搜索和公共网站站内搜索。AI
              智能体工作流自动化（Glean Agents）的相邻机会增加了第二层 TAM，但仍处早期，还未反映在多数分析师估算中。[CM003] [CM004]


              Glean 替代或竞争的关键现状方案包括：（1）Microsoft 365 Copilot，与 M365 E3/E5 捆绑，价格 $30/user/month，是最危险的在位者；（2）各 SaaS
              应用内置搜索（Salesforce Einstein、Slack AI、Google Drive search）；（3）人的组织知识和部落经验；（4）没有 AI 层的过时企业搜索设备。[CM005]
              [CM006]
