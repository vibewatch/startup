  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险概览
        blocks:
          - type: paragraph
            body: >-
              按剩余严重程度排序，Glean 面临五类重大风险：（1）被超大规模云厂商捆绑替代——Microsoft 365 Copilot 和 Google Workspace Gemini
              以零边际成本捆绑进既有企业许可，使 Glean 永久处于定价劣势；（2）LLM 供应商依赖——Glean 的 AI 能力依赖第三方 LLM
              API（OpenAI、Anthropic、Google），这些供应商可单方面调整可用性、价格和条款；（3）数据隐私与安全监管风险——全球 AI 数据处理监管正在收紧，尤其是欧洲 GDPR 执法和美国各州新兴 AI
              法；（4）人员集中风险——公司依赖四位联合创始人，其中 Arvind Jain 的 CEO 角色是最关键的单点领导风险；（5）执行风险——从 $200M 扩到 $1B+
              ARR，需要企业销售、客户成功和产品开发同时做到无失误。[CR001] [CR002] [CR003]


              超大规模云厂商捆绑是结构上最危险的风险：Microsoft 和 Google 拥有几乎无限的财务资源、既有企业关系，并正积极投资 AI 搜索能力。Microsoft 的 $30/user/month
              Copilot for M365（或已包含在企业 E5 许可中）已经触发预算整合审查，采购团队会追问 Glean 相比捆绑替代品是否提供了足够边际价值。Glean
              的回应——证明更好的搜索质量和连接器广度——可信，但它必须持续跑赢一个工程资源多 10x 且快速进步的竞争对手。[CR004] [CR005]
