      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >-
              Glean 由四位拥有深厚搜索和基础设施背景的大科技公司前工程师联合创立。Arvind Jain（CEO）曾联合创立 Rubrik（云数据管理独角兽，2024 年 IPO），并在 Google
              搜索基础设施担任首席工程师 9 年，因此少有地同时具备成功退出经历和大规模搜索系统的一手组织知识。T.R. Vishwanath（CTO，前 Meta）曾在 Facebook 负责大型分布式系统基础设施。Tony
              Gentilcore（前 Google）参与过 Google 核心搜索排序与相关性团队。Piyush Prahladka（前 Google）曾负责 Google 的 AI 和搜索产品开发。[CO006]
              [CO007] [CO008] [CO009]


              创始团队亲手搭建过 Google 搜索基础设施——全球最复杂的信息检索系统——这是 Glean 技术差异化最重要的来源。这一履历让 Glean 能高密度招到前 Google、前 Meta 和前 Dropbox
              搜索工程师；没有 Google 品牌背书的团队很难做到这一点。[CO010] [CO011]


              Arvind Jain 此前通过 Rubrik 完成退出，证明了其在企业软件里调配资本和跑通商业化的能力，相比首次创业 CEO，关键人风险明显更低。董事会包括 Kleiner Perkins（Mamoon
              Hamid）、Sequoia Capital 和 General Catalyst 的代表，带来顶级风险投资治理。[CO012]
