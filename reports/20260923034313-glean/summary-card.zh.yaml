  topStrengths:
    - ARR 扩张速度可能是企业搜索史上最快：$10M（2022 年估计）→ $100M（2024 年 12 月披露）→ $200M+（2025 年估计），约 100% YoY 增长。
    - 200+ 标杆企业客户（Databricks、eBay、Booking.com、Duolingo、Canva、Sony Electronics），DAU/MAU 约 40%，明显高于企业软件 20–25% 常态。
    - 100+ app 的多生态连接器，加上权限感知索引架构，形成技术防线；Microsoft 和 Google 各有生态利益冲突，很难中立复制。
    - >-
      连续创业团队深耕该领域（Arvind Jain 曾在 Google 9 年，也是 Rubrik 联合创始人），背后有 Sequoia、Kleiner Perkins、Lightspeed、Altimeter 和
      Wellington，是一线投资人组合。
    - Glean Agents（2025 年 5 月 GA）和 Enterprise Graph（2025 年 9 月）把 TAM 从搜索扩到更大的智能体工作流；目前没有同等规模的多生态竞争者。
  topRisks:
    - 超大规模云厂商捆绑销售：Microsoft 365 Copilot 和 Google Workspace Gemini 能以零边际成本塞进现有企业 license， 这是 Glean 无法完全化解的长期结构性定价逆风。
    - NRR 未披露：到 $200M ARR 规模仍没有净收入留存数据并不常见，也是最关键的缺失投资信号。
    - 估值偏高：$7.2B 对应 36x 估计 ARR，在乐观 / 基准 / 悲观情景下概率加权预期回报为负（-8%）；若要有吸引力的风险收益， 入场价应在 $3–4B（15–20x ARR）。
    - LLM API 依赖：所有 AI 能力都靠第三方 OpenAI / Anthropic / Google API；没有自研 LLM，推理用量放大后会持续带来供应商、成本和毛利率挤压风险。
    - EU AI Act 将在 2026 年 8 月执行；距离研究日约 15 个月，Glean 仍未披露面向欧洲客户的合规路线图。
  unresolvedGaps:
    - 净收入留存率（NRR）和 gross logo churn 未公开披露——任何投资决定前都必须尽调。
    - LLM 推理成本占总收入比例未披露——毛利率结构和单位经济性不透明。
    - 股权结构表，以及清算优先权下的优先股堆叠未披露——6 轮共融资 $765M，可能带来显著优先权压力。
    - EU AI Act 合规路线图未披露——欧洲企业部署存在重大监管风险。
    - FedRAMP 认证状态未披露——挡住 $8–10B 美国联邦政府 TAM，且没有公开补齐时间表。
