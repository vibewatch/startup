  - id: SE-process-architecture
    title: Hydro-to-Cathode® architecture and operating workflow
    body: >-
      The technical heart of Ascend Elements is Hydro-to-Cathode®, which the company describes as a
      patented direct precursor synthesis process. Public materials describe a sequence in which
      batteries are shredded into black mass, lithium is removed ahead of the core Hydro-to-Cathode®
      loop, and the remaining nickel, cobalt, and manganese stream is leached so that aluminum,
      copper, plastics, graphite, and other impurities are removed before direct precursor synthesis
      creates pCAM. That operating model differs from conventional hydrometallurgical recycling,
      which generally separates nickel, cobalt, and manganese into individual products and then
      recombines them through additional precipitation and precursor-forming steps, and from
      pyrometallurgical routes that rely on high-temperature smelting and often recover fewer
      battery-ready outputs. The company says this architecture eliminates up to 15 steps, and it
      layers microstructure engineering on top of the shortened process so composition and crystal
      behavior can be tuned during precursor formation rather than after multiple separate refining
      stages. The practical significance is that Ascend is trying to capture both yield and product
      performance advantages from a more direct manufacturing sequence, not just from recycled
      feedstock economics. Recent product claims also connect the process to downstream cell results,
      including longer cycle life and higher power capacity in batteries built from upcycled pCAM.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
      - CE012
      - CE013
      - CE037
      - CE038
    tableRefs:
