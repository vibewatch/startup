  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: apex-1-construction-status
      missingEvidence: Updated court-approved construction status, contractor posture, liquidity runway, and restart or pause plan for Apex 1 after Chapter 11.
      whyItMatters: Apex 1 is the facility that converts the Hydro-to-Cathode® story into scaled pCAM revenue, so uncertainty here directly affects commercialization timing and capex risk.
      diligencePath: Request bankruptcy filings, debtor-in-possession budget, EPC or contractor notices, and management's revised site schedule under NDA.
      relatedQuestionRefs: [QE017, QE026]
      relatedTableRefs: [TE005]
    - type: missing-source
      severity: material
      topic: patent-family-map
      missingEvidence: A full patent-family list linking Hydro-to-Cathode®, lithium extraction, and direct precursor synthesis claims to issued patents, jurisdictions, and remaining term.
      whyItMatters: Public sources confirm that the process is patented, but they do not show how broad or defensible the moat is against adjacent recyclers or cathode manufacturers.
      diligencePath: Pull a patent counsel memo or complete patent landscape review covering issued patents, applications, assignments, and claim scope.
      relatedQuestionRefs: [QE020]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: minor
      topic: developer-signal-surface
      missingEvidence: Direct practitioner telemetry such as public developer APIs, open-source repositories, customer engineering talks, or operator forums specific to Ascend's process platform.
      whyItMatters: This is a hardware and manufacturing company, so no public developer API surface was found; ReCell and the broader battery-recycling R&D community are only proxies for practitioner signal, not direct product-adoption evidence.
      diligencePath: Ask management for conference presentations, application-engineering notes, customer qualification workshops, or other technical-community artifacts that substitute for software-style developer signal.
      relatedQuestionRefs: [QE021]
    - type: missing-source
      severity: material
      topic: quality-qualification-packet
      missingEvidence: Customer qualification criteria, certificates of analysis, rejection rates, and any automotive-quality or safety audit documentation for Ascend materials.
      whyItMatters: Public pages show quality positioning and partner anecdotes, but they do not prove broad customer acceptance or repeatable manufacturing quality across programs.
      diligencePath: Request sample CoAs, qualification dashboards, customer acceptance milestones, and any ISO or automotive quality documentation in the data room.
      relatedQuestionRefs: [QE022]
      relatedTableRefs: [TE004]
