  - id: SE-roadmap-risk
    title: Roadmap credibility and technology risk after Chapter 11
    body: >-
      The adverse product conclusion is not that Hydro-to-Cathode® has been disproven; it is that
      the roadmap needed to monetize it at full pCAM scale is now impaired. TechCrunch,
      Recycling Today, and Electrive all reported that Ascend filed for Chapter 11 on April 9,
      2026, and attributed the event to insurmountable financial challenges, a history of fiscal and
      operational mismanagement, and the loss of expected government support. The most important
      technical implication is the changed status of Apex 1. Before the filing, company materials and
      the 2025 LCA white paper framed the Hopkinsville campus as the major pCAM scale-up site with
      late-2026 startup ambition and 2027 commercial-scale expectations. After the filing and DOE
      grant cancellation, the exact construction state, vendor continuity, and restart timetable are
      no longer publicly verified. That creates a split verdict for diligence. Base 1 demonstrates
      real operating capability and a useful product wedge in lithium carbonate, but the broader
      product thesis still requires investors to believe that a bankrupt company can complete,
      finance, and qualify a very large precursor manufacturing campus. Until there is fresh court,
      management, or contractor evidence, the product roadmap should be treated as conditional rather
      than committed.
    claimRefs:
      - CE024
      - CE026
      - CE027
      - CE028
      - CE029
      - CE034
      - CE040
    tableRefs:
      - TE005


