  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Ascend-specific SAM and SOM after bankruptcy
      missingEvidence: >-
        Public sources establish broad market growth but do not disclose a court-adjusted pipeline, retained customer
        volumes, or revised plant economics for Ascend after the April 2026 petition.
      whyItMatters: >-
        Without a bottom-up view of surviving contracts and output assumptions, any company-specific SAM or SOM would be
        more model fiction than sourced diligence.
      diligencePath: >-
        Request post-petition operating plan, customer-retention schedule, revised plant ramp, and bankruptcy-court
        materials describing expected commercial output by facility.
      relatedQuestionRefs:
        - QM024
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: blocking
      topic: Post-petition production volume and backlog
      missingEvidence: >-
        Retained sources say operations continue, but they do not disclose current production, plant utilization,
        customer backlog, or whether the pre-petition offtakes remain fully intact under court supervision.
      whyItMatters: >-
        This is the single biggest gap between a real market and realizable near-term revenue for Ascend.
      diligencePath: >-
        Obtain debtor operating reports, plant-level throughput data, revised backlog, and any disclosed amendments to
        commercial contracts during the Chapter 11 process.
      relatedQuestionRefs:
        - QM025
    - type: private-evidence-only
      severity: material
      topic: Contract pricing and minimum-volume economics
      missingEvidence: >-
        Public sources confirm the existence of Trafigura, Honda, and major-automaker relationships, but they do not
        disclose pricing formulas, minimum take-or-pay terms, margin floors, or default rights.
      whyItMatters: >-
        Contract economics determine whether Ascend's technical and policy positioning ever translated into durable cash
        generation.
      diligencePath: >-
        Review executed commercial agreements or redacted summaries showing pricing, volume commitments, product specs,
        term lengths, and any bankruptcy-era renegotiation clauses.
      relatedQuestionRefs:
        - QM027
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: material
      topic: Non-comparable market-size estimates
      missingEvidence: >-
        The retained analyst figures use different scopes and forecast windows, so the public record does not support a
        single reconciled TAM for Ascend's exact market boundary.
      whyItMatters: >-
        Compressing these figures into one number would overstate confidence and could hide how much of Ascend's value
        proposition depends on downstream material sales rather than recycling fees alone.
      diligencePath: >-
        Rebuild the market model from first principles using consistent scope definitions, geography, forecast year, and
        post-petition company constraints.
      relatedQuestionRefs:
        - QM028
      relatedTableRefs:
        - TM002
