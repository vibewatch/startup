  - id: TM003
    title: Segment / buyer map
    type: enumeration
    summary: Publicly evidenced buyer and payer groups for Ascend's recycled battery-material outputs.
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Automakers / battery OEMs
        - Major U.S. automaker, Honda, other OEM battery programs
        - Battery supply-chain, procurement, sustainability, and engineering teams
        - OEM purchasing and program budgets
        - Qualify recycled material, sign supply or collaboration agreement, ramp into domestic production
        - Supply-chain procurement with sustainability influence
        - Domestic content, recycled-content proof, and secure North American sourcing
      - - Cell / cathode manufacturing partners
        - Battery plants and cathode producers needing pCAM or lithium inputs
        - Process engineers, cathode qualification teams, manufacturing operations
        - Plant input budgets and long-term materials procurement
        - Technical qualification followed by multi-year materials supply
        - Manufacturing procurement and operations leadership
        - Domestic production economics and trusted product quality
      - - Traders / offtakers
        - Trafigura and similar downstream lithium counterparties
        - Metals-trading and battery-material marketing desks
        - Commodity trading books / offtake capital
        - Negotiate forward offtake against future plant output
        - Trading and commodity portfolio teams
        - Reliable battery-grade lithium carbonate supply into tight domestic chains
      - - Public-policy capital providers
        - DOE grant and tax-credit ecosystem rather than product end-users
        - Project-finance, compliance, and plant-build stakeholders
        - Grant disbursement, tax-credit eligibility, subsidized project economics
        - Award support, monitor milestones, influence bankability
        - Government program managers and internal finance/compliance teams
        - Domestic manufacturing build-out and supply-chain resilience
    notes: >-
      Buyer, user, payer, and budget-owner fields are inferred from the structure of the disclosed Honda, Trafigura,
      automaker, and policy relationships. Public sources validate relationship type more clearly than exact committee-
      level approval paths.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
  - id: TM004
    title: Growth drivers and constraints table
    type: data
    summary: Structural demand drivers and binding constraints for Ascend's market after the Chapter 11 filing.
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - EU recycled-content mandates and carbon-footprint rules
        - Positive
        - 2025-2035
        - Creates compliance pull for recycled battery materials and certification-ready supply chains
        - Verify how much of Ascend's pre-petition pipeline depended on EU-style compliance demand
      - - U.S. IRA 45X support for domestic pCAM and lithium-carbonate economics
        - Positive
        - 2023-2032
        - Improves economics for domestic battery-material production if plants operate and qualify
        - Confirm which Ascend outputs still qualify post-petition and at what production levels
      - - Global EV adoption and EU battery demand growth
        - Positive
        - 2025-2030
        - Supports long-run recycled-material demand even if U.S. momentum softens
        - Separate global category growth from Ascend's U.S.-weighted capture path
      - - Feedstock scarcity from 8-12 year battery life
        - Negative
        - 2026-2030
        - Delays commercial-scale end-of-life battery volumes and forces reliance on scrap or early retirements
        - Quantify Ascend's actual feedstock mix before and after the bankruptcy filing
      - - Lithium, cobalt, and nickel price deflation
        - Negative
        - 2024-2026
        - Compresses recovered-metal value and hurts recycler margins during scale-up
        - Stress-test economics at current commodity prices rather than 2022 peak assumptions
      - - DOE grant cancellation and Chapter 11 process
        - Negative
        - Immediate / 2026
        - Breaks the clean bridge from policy support to company execution and financing certainty
        - Determine revised plant plan, milestone schedule, and bankruptcy treatment of grant proceeds
      - - Softening U.S. EV market
        - Negative
        - 2025-2026
        - Slows the near-term domestic demand and retirement curve relevant to Ascend's core geography
        - Separate global EV momentum from the U.S. demand assumptions embedded in old plant plans
    notes: >-
      This table mixes structural market drivers with company-specific constraints because Ascend's April 2026 filing is
      now the decisive filter on how much of the market can be monetized. The adverse rows should be treated as current,
      not hypothetical.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM013
      - CM017
      - CM018
      - CM020
      - CM030
      - CM031
