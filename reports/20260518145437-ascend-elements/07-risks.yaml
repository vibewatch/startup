- id: mitigations-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'The investable path is narrow but monitorable. First, the company needs a court-backed emergence path or strategic sale, because bankruptcy risk outranks every other item. Second, it needs replacement capital on terms that do not simply defer failure into a more levered capital structure. Third, Apex must restart against a realistic design, contractor, and commissioning plan rather than another aspirational schedule. Finally, the market side has to stabilize through named customers, formula-priced contracts, and feedstock arrangements that can tolerate commodity volatility. If any one of those conditions fails, value should be written down toward distressed-asset recovery instead of growth-equity optionality. The reason is simple: after Chapter 11, there is no remaining margin for optimistic modeling error.'
