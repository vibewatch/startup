- id: market-feedstock-and-model
  title: Commodity, Feedstock, and Financial-Model Risk
  body: 'Ascend''s long-range model remains exposed to battery-material price swings and uneven feedstock access even if the court process stabilizes. Fastmarkets described a 2026 market with sharp lithium volatility, elevated nickel and manganese uncertainty, and intense competition for high-purity NCM black mass. Those conditions can be positive for revenue in isolated quarters, but they also increase working-capital needs and raise the risk that recycled-material margins do not behave the way legacy venture decks assumed. The problem is amplified by end-market softness: TechCrunch noted weaker EV demand and Chinese cost pressure, while Ascend itself conceded that CAM demand no longer supported the original Hopkinsville design. Historic capacity and profitability milestones from 2022-2023 therefore look too optimistic in hindsight. Sector precedent matters too: Li-Cycle''s restructuring shows that even well-known platforms can lose equity value before scale economics appear.'
