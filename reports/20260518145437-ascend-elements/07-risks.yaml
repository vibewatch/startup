- id: environmental-and-safety
  title: Environmental, Permitting, and Safety Exposure
  body: Environmental and permitting risk is not the top issue today, but it is meaningful because any restart must still clear ongoing compliance duties. DOE's own environmental assessment describes Apex as a large industrial complex with multiple buildings, a tall stack, and material waste, traffic, and occupational-safety considerations. The Georgia EPD variance shows that Ascend's operating model already depends on special treatment of hazardous battery materials so the company can recycle without a full RCRA Part B permit. That variance explicitly addresses air emissions, wastewater, residuals, catastrophic failures, and financial assurance. EPA guidance and Kentucky's public permit tools reinforce that these duties continue through closure, inspections, and any redesign. In other words, environmental risk is manageable only if the company maintains documentation discipline and can afford the compliance overhead during restructuring.
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
