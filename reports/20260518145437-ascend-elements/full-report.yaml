  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements should not be underwritten as merely a “battery recycler.” The retained official sources
              show a broader closed-loop market boundary spanning collection and processing of spent lithium-ion
              batteries, hydrometallurgical recovery of critical minerals, conversion into precursor cathode active
              material (pCAM), and battery-grade lithium carbonate output. Included spend therefore covers recycling
              fees and feedstock processing, downstream sales of recovered lithium products and pCAM, and
              compliance-driven purchasing of recycled material by domestic battery supply-chain participants. Excluded
              spend should include virgin mining, generic chemical production unrelated to battery materials, battery
              cell manufacturing, pack assembly, and EV sales themselves. Status-quo substitutes remain important
              because buyers can still source virgin or imported precursors rather than recycled domestic material, or
              postpone recycling economics when commodity prices are weak. Ascend’s Hydro-to- Cathode positioning
              matters precisely because it tries to replace multiple substitute steps—disposal or low-value recovery on
              the front end and imported pCAM or lithium salts on the back end—with one integrated domestic pathway.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM029
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
