      - number: '1.3'
        title: Funding History and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements built one of the largest private capital stacks in the North American battery recycling
              and materials sector before its bankruptcy filing. Battery Resourcers first raised smaller venture rounds,
              including a roughly $20 million Orbia-led financing and a roughly $70 million growth round, before the
              company rebranded and closed a $300 million Series C in October 2022. That Series C combined equity and
              debt and brought in a mix of climate-tech, sovereign, and strategic industrial investors including Fifth
              Wall Climate, SK ecoplant, the Oman Investment Authority, Lithium Americas, JLR InMotion Ventures, Hitachi
              Ventures, TDK Ventures, Orbia, and GLy Capital Management.

              Capital intensity increased further in September 2023 when Ascend Elements announced a $542 million Series
              D led by Decarbonization Partners, the BlackRock and Temasek joint venture, with participation from the
              Qatar Investment Authority and Temasek. Official and third-party reporting together indicate that the
              company had raised more than $1.1 billion across the 2022 and 2023 financings alone, while TechCrunch
              later reported that investors had put nearly $900 million of equity into the business by the time of
              bankruptcy. Even with that scale of backing, critical data remain opaque: no post-money valuation was
              disclosed for Series D, ownership percentages are not public, and it is unclear how stakeholder priorities
              have been reordered inside the Chapter 11 process.
