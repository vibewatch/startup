        title: Capital Raised, DOE Grants, and Capital Stack
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements accumulated one of the largest private capital stacks in North American battery recycling
              before bankruptcy. Battery Resourcers first raised approximately $20 million and then approximately $70
              million in early rounds, followed by a $300 million Series C in October 2022 and a $542 million Series D
              in September 2023. The Series C combined $200 million of equity and $100 million of debt, while the Series
