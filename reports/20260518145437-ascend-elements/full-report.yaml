  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements' disclosed financial model is industrial and B2B rather than SaaS-like. The company
              collects end-of-life batteries and production scrap, processes them through its Base 1 facility in
              Covington, Georgia, and monetizes higher-value outputs such as pCAM, CAM, and battery-grade lithium
              carbonate through Hydro-to-Cathode®. Public evidence confirms that this model has produced commercial
              transactions since January 2022, when Ascend announced its first commercial cathode sale to Navitas
              Systems, and that Base 1 was generating revenue by 2022 even though no revenue figure was disclosed. The
              best-documented customers and counterparties are Honda for recycled battery-material procurement, Koura
              for 5,000 metric tons per year of lithium carbonate, Trafigura for 15,000 metric tons per year under a
              take-or-pay structure, and an unnamed global automaker tied to an approximately $1 billion multi-year
              supply contract announced in December 2025. The company also created the AE Elemental joint venture in
              Poland, which along with the separate Apex 2 grant offer implies future European revenue pathways if a
              restructuring preserves expansion options. What remains missing is any public revenue split, shipment
              volume, or realization data by product line.
