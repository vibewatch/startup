              government backed the scale-up with two Battery Materials Processing awards: a $316 million pCAM grant
              visible on USAspending and a separate $164 million CAM grant that was later mutually cancelled. Trade
              coverage reported that roughly $206 million of the pCAM award was actually disbursed before DOE cancelled
              the remaining balance in October 2025, leaving Ascend with only part of the originally expected
              non-dilutive support. Poland also offered up to $320 million for a future Apex 2 plant, but public sources
              do not show a signed definitive grant agreement. The disclosed capital stack therefore exceeded $1.1
              billion received before Chapter 11, with most of that capital apparently directed into Base 1 operations,
