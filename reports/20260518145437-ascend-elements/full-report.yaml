      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements remains closely associated with its technical founders even after multiple executive
              transitions. Eric Gratz is still publicly listed as Co-Founder and CTO after having served as CEO from
              2016 to 2020, while Prof. Yan Wang remains Co-Founder and Chief Scientist and continues to anchor the
              company's scientific legitimacy through the Hydro-to-Cathode® invention story. The founders' prominence is
              reinforced by external recognition, including the 2022 AUTM Better World Award tied to commercialization
              of the underlying WPI technology, which helps explain why investors backed a manufacturing scale-up
              despite the company's heavy capital needs.

              The current operating leadership is materially different from the team that announced the largest
              financings. Linh Austin became President and CEO in early 2025 after previously serving on the board, and
              the company now publicly lists Ahmed Allouache, Tomasz Poznar, Barbara B. Knight, and Deacon Powell in
              senior roles. Mike O'Kronley, who was the public face of the Series C and Series D periods and the Apex 1
              groundbreaking, appears to have exited before the 2025 leadership reset. Governance disclosure remains
              incomplete, however, because the retained official sources name an executive roster but do not publish a
              full board composition or ownership-control map as of May 2026.
