      - number: '2.3'
        title: Buyer segmentation, payer logic, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports four practical buyer and payer groups around Ascend’s market position. First are
              automakers and battery OEMs seeking recycled-content supply and domestic battery-material security. Second
              are cell or cathode manufacturing partners that need pCAM or lithium inputs qualified into domestic
              plants. Third are trading and commodity counterparties such as Trafigura that can absorb battery-grade
              lithium carbonate through long-term offtake structures. Fourth are public-policy capital providers whose
              grants and tax credits materially shape project economics even though they are not end-users of the
              material. The adoption path is slow and qualification-heavy: technical validation of recycled output,
              commercial supply or offtake agreement, then volume ramp at domestic facilities. Honda and Trafigura
              matter because they validate different buyer motions, while the undisclosed major-U.S.-automaker pCAM
              contract suggests automotive willingness to buy if quality and scale are proven. What remains missing is a
              fully transparent post-petition view of which buyer motions are still active, delayed, or renegotiated
              under Chapter 11.
            claimRefs:
