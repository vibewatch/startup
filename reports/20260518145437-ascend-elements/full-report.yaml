            body: >-
              Public sources show how Ascend sells but not what it earns per unit. The company's contracts imply
              per-kilogram pricing for pCAM and CAM and per-metric-ton pricing for lithium carbonate, with at least one
              disclosed take-or-pay structure in Trafigura's lithium carbonate offtake, yet no source in the retained
              set publishes realized average selling prices, index formulas, discounts, or rebate mechanics. Management
              marketing claims that Hydro-to-Cathode® can deliver comparable or better performance than virgin material
              at lower cost, but no independent source in the retained evidence provides verified gross margin, EBITDA,
              cash conversion, or product- level cost of goods sold. As a result, the only public pricing ranges
              available for underwriting are market-context estimates rather than Ascend disclosures: 2024-2025 NMC pCAM
              generally traded in the mid-teens to mid-thirties dollars per kilogram, while battery-grade lithium
              carbonate had corrected into roughly the mid-single to mid-teens dollars per kilogram after the 2022
              spike. Those benchmarks help frame potential revenue and margin sensitivity, but they do not answer the
