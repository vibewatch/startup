        - Leaves Ni, Co, and Mn in solution while removing Al, Cu, plastics, and graphite
        - Chemical-process control and impurity management
        - Impurity carryover could impair precursor quality or yield
      - - Direct precursor synthesis
        - Transforms mixed metal solution directly into pCAM precursor
        - Patented operating know-how and recipe control
        - Scale-up to full pCAM volume remains unproven publicly
      - - Microstructure engineering
        - Tunes elemental crystal structure and particle behavior to customer specification
        - Customer qualification feedback and process-control accuracy
        - Public data do not show how customization performs across many chemistries
      - - Product finishing and qualification
        - Delivers NMC precursor sizes and technical-grade Li2CO3 for battery supply chains
        - Downstream battery-maker acceptance and quality testing
        - Detailed qualification standards and rejection rates are private
      - - Facility scale architecture
        - >-
          Base 1 handles 30,000 MT/year input and 3 kiloton/year lithium recovery; Apex 1 was intended for pCAM
          scale-out
        - Successful capital completion of Apex 1
        - Bankruptcy and grant loss now threaten the intended handoff from Base 1 to Apex 1
