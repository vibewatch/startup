      - number: '2.2'
        title: Multiple sizing lenses, not one headline TAM
        blocks:
          - type: paragraph
            body: >-
              The available market numbers support a large opportunity but not a single clean Ascend-specific TAM. The
              most directly retained analyst lens is MarketsandMarkets, which places global lithium-ion battery
              recycling at $18.6B in 2026 and $50.0B by 2033, while a narrower automotive lithium-ion battery recycling
              lens grows from $12.87B in 2025 to $36.33B by 2032 and an EV-battery-recycling endpoint reaches $23.72B by
              2035. These estimates cannot be averaged because they use different scopes and end years. Demand-side
              context still matters: BloombergNEF expects one in four new cars sold globally in 2025 to be electric,
              with China above 50% EV share, while the EU projects battery demand could grow 14x by 2030. For Ascend,
              the implication is that the market is big enough to matter, but company capture must be bounded by
              disclosed commercial proof points and bankruptcy-era execution risk rather than by any one global
              forecast. Broad market growth survived the filing; the company-specific path to monetize it became much
              less certain.
