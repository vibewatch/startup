  - id: FO001
    title: Ascend Elements Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Timeline of the founding, financing, partnership, product, and adverse milestones that define Ascend Elements'
      path from WPI spinout to active Chapter 11 restructuring.
    data:
      items:
        - label: Founded at WPI
          date: '2015-01-01'
          detail: Battery Resourcers was created around WPI-origin battery recycling research by Eric Gratz and Prof. Yan Wang
          tone: positive
        - label: Rebrand to Ascend Elements
          date: '2022-01-19'
          detail: Battery Resourcers adopted the Ascend Elements name as the company prepared for industrial scale-up
          tone: positive
        - label: Series C closed
          date: '2022-10-26'
          detail: Ascend announced a $300M round combining equity and debt for manufacturing expansion
          tone: positive
        - label: Apex 1 groundbreaking
          date: '2022-10-26'
          detail: The company began construction on the Hopkinsville, Kentucky pCAM site
          tone: positive
        - label: Honda agreement
          date: '2023-02-27'
          detail: Honda and Ascend reached a basic agreement on recycled battery materials procurement in North America
          tone: positive
        - label: Koura supply deal
          date: '2023-03-01'
          detail: Ascend disclosed a 5,000 MT/yr recycled lithium carbonate supply agreement with Koura
          tone: positive
        - label: Series D closed
          date: '2023-09-26'
          detail: Decarbonization Partners led a $542M financing with QIA and Temasek participation
          tone: positive
        - label: CAM grant cancelled
          date: '2025-02-27'
          detail: Ascend and DOE mutually agreed to cancel the $164M CAM award
          tone: negative
        - label: Poland support offer
          date: '2025-05-20'
          detail: Poland offered up to $320M to support a future battery materials plant
          tone: positive
        - label: Commercial lithium carbonate milestone
          date: '2025-09-15'
          detail: Base 1 reached commercial-scale battery-grade recycled lithium carbonate production above 99 percent purity
          tone: positive
        - label: pCAM grant balance cut
          date: '2025-10-21'
          detail: External reporting said DOE cancelled roughly $110M of remaining pCAM support
          tone: negative
        - label: Trafigura offtake signed
          date: '2025-11-15'
          detail: Ascend announced a 15,000 MT/yr take-or-pay lithium carbonate agreement with Trafigura
          tone: positive
        - label: Chapter 11 filing
          date: '2026-04-09'
          detail: The company filed for Chapter 11 protection in S.D. Texas as case 26-90440
          tone: negative
