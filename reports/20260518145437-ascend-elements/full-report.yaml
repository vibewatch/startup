      - number: '3.2'
        title: Competitor Profiles, Capabilities, and Commercial Packaging
        blocks:
          - type: paragraph
            body: >-
              The fetched evidence shows a sharp separation between companies with broad public proof and companies with
              mostly aspirational or partial proof. Redwood publishes both an operating-scale signal — over 20 GWh of
              batteries processed and more than 60,000 tons of critical materials annually — and a multi-partner
              commercial surface that includes Panasonic, GM Ultium Cells, Volkswagen Group of America, Volvo, Amazon,
              Toyota, and BMW of North America. Umicore’s public materials are more incumbent than startup-like: they
              emphasize a circular European battery-materials chain, battery recycling, and cathode and anode products
              rather than U.S.-specific partner logos. Li-Cycle’s public evidence is now split between historical DOE
              documentation of the spoke-hub system and current notices that Glencore Battery Recycling owns service
              continuity. RecycLiCo and ABTC each market high-recovery hydro-style routes, but the public commercial
              packaging differs: RecycLiCo positions a bespoke on-site “Clean Spot” module, while ABTC frames a Nevada
              operating plant plus a second planned facility supported by a federal grant. Pricing is the weakest public
              area across the category. None of the fetched official pages publish list prices or per-ton fees; what is
              visible instead are take-or-pay offtakes, partner programs, feedstock supply agreements, or bespoke
              project selling.
