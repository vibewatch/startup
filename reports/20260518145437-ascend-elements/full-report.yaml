      - number: '1.4'
        title: Operations, Facilities, and Commercial Milestones
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements' operating footprint was designed to pair recycling throughput with downstream
              battery-materials conversion. Base 1 in Covington, Georgia is the clearest proof point, with the company
              describing the site as a commercial facility capable of processing roughly 30,000 metric tons per year of
              lithium-ion batteries and black mass. In 2025 the company announced commercial-scale production of
              battery-grade recycled lithium carbonate at greater than 99 percent purity from Base 1, and it also signed
              commercial agreements with Koura, Trafigura, Honda, and an unnamed global automaker. Those milestones
              indicate that Ascend had real customer interest and product progression before the restructuring, even if
              public revenue and shipment figures remain undisclosed.

              Apex 1 in Hopkinsville, Kentucky was intended to be the large downstream manufacturing leap, with
              groundbreaking in 2022 for a roughly one-million-square-foot pCAM plant on a 140-acre site requiring more
              than $1 billion of planned capital investment. The broader scale-up plan also expanded to Europe after
              Poland offered up to $320 million in grant support for a future pCAM plant there. Public sources therefore
              show a coherent multi-site strategy spanning Georgia recycling, Kentucky pCAM scale-up, and Polish
              expansion, but they also show that this strategy outran execution once construction delays, capital
              shortfalls, and policy reversals began to accumulate.
