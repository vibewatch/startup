      - number: '2.4'
        title: Growth drivers, adoption constraints, and the bankruptcy reset
        blocks:
          - type: paragraph
            body: >-
              The structural tailwinds behind Ascend’s category remain intact. EU recycled-content mandates and carbon-
              footprint requirements create a compliance pull for recycled battery materials, and U.S. 45X manufacturing
              support still favors domestic pCAM and lithium-carbonate production. EV adoption outside the U.S. remains
              strong, and Ascend did prove commercial lithium-carbonate production plus multiple downstream
              relationships. But the market’s hard constraints are equally visible. Feedstock timing remains a
              chicken-and-egg problem because many EV packs sold from 2015 onward are only now reaching retirement
              windows. Recycling economics deteriorated sharply when lithium, cobalt, and nickel prices fell from 2022
              highs, reducing recovered-metal value. Those market pressures collided with company-level issues:
              CEO-cited fiscal and operational mismanagement, softening U.S. EV demand, and cancellation of $316M of DOE
              grant support. The result is not that the market disappeared; it is that policy and demand tailwinds were
              insufficient to offset capital intensity, execution risk, and bad timing at Ascend’s scale.
            claimRefs:
