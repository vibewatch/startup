  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation is supply-chain shaped, not broad-account shaped
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements does not look like a conventional enterprise vendor with hundreds of named accounts. Its
              public customer base is better understood as a battery-supply-chain map with different buyer, user, and
              payer roles. Honda is both a recycling-services customer and a potential buyer of recycled nickel, cobalt,
              and lithium for North American EVs. Koura is a battery-materials buyer that uses recycled lithium
              carbonate to make electrolyte inputs such as LiPF6. Trafigura is an offtake and channel partner that
              brings marketing and logistics reach rather than a visible end-user deployment. Freudenberg e-Power
              Systems / XALT represents a battery-application validation customer in heavy-duty systems. Public
              materials also point to at least one large unnamed U.S. pCAM customer and an unnamed automaker contract,
              which shows real demand but withholds the identity needed to assess concentration. The important diligence
              takeaway is that Ascend’s customer story is multi-segment and strategically relevant, but still sparse on
              account counts, revenue mix, and denominator metrics. That makes relationship quality more informative
              than logo count. Public proof is therefore a map of strategically important relationships, not a clean
              customer-count story. The visible set also skews toward announcements that matter for financing and
              industrial policy: OEM recycling, electrolyte feedstock, lithium-carbonate offtake, and validation
              shipments. That makes the chapter useful for testing whether demand exists at all, but poor for measuring
              how many accounts are live, how fast they expand, or how diversified near-term revenue really is.
