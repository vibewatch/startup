      - number: '7.2'
        title: Plant Execution and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              Apex 1 execution risk is no longer hypothetical. Public reporting says construction has been paused since
              late 2024, customers delayed pCAM deliveries by 12 to 18 months, and management reset the schedule by
              roughly a year. The contractor dispute compounds this operational fragility because a large
              chemical-processing site rarely restarts cleanly after litigation, re-bidding, and scope revision.
              Dependency risk is equally important: the plant still needs funding, buyers, suppliers, contractors, and
              regulators to line up at the same time. Ascend may be able to replace one counterparty, but replacing
              several simultaneously would slow commissioning and raise cost. That is why DOE support, customer timing,
              contractor stability, and feedstock access need to be treated as one integrated dependency system rather
              than as isolated risks.
