  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Bankruptcy, Funding Loss, and Legal Control
        blocks:
          - type: paragraph
            body: >-
              Ascend's current risk stack is anchored first by court control and second by federal-funding loss. The
              company is already in an active Chapter 11 case, which means operational decisions, financing flexibility,
              and stakeholder recoveries are now filtered through the bankruptcy process rather than through ordinary
              venture governance. Public summaries show a large balance-sheet footprint, thousands of creditors, and
              ongoing hearings, so this is not a light-touch filing. At the same time, the project lost both the $164
              million CAM grant and the remaining unused portion of the $316 million pCAM grant, with DOE explicitly
              saying the affected awards were not economically viable. That combination turns capital access into the
              central gating risk: without court-approved liquidity and replacement funding, even otherwise manageable
              execution problems become existential.
