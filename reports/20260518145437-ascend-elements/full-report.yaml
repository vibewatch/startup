  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Reset and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Ascend's valuation framework has reset from venture growth to distress recovery. Public sources show a
              company that once raised large pools of private and public capital, achieved a roughly $1.5 billion
              private valuation in 2023, and then entered Chapter 11 in April 2026. That arc is the core reason the
              recommendation is avoid for ordinary equity. Historical private marks no longer anchor value because court
              control, grant loss, contractor claims, and delayed customer demand all sit ahead of any residual upside.
              The only reason to keep Ascend on the radar at all is that battery-material assets can still carry
              strategic value for a buyer or priority-protected rescue investor. Without such protections, however, the
              public evidence does not support paying anywhere near historical valuation levels. That reset also means
              investors should separate enterprise relevance from security-level attractiveness: a strategically
              interesting asset can still be a poor equity investment if the court and financing stack capture most of
              the upside.
