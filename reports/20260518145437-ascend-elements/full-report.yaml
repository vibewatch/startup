  - id: FE001
    title: Product architecture map
    type: stack
    sourceRefs:
      - SE001
      - SE002
      - SE004
      - SE013
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE011
      - CE037
      - CE038
    data:
      layers:
        - label: Feedstock intake and shredding
          detail: >-
            Spent lithium-ion batteries and manufacturing scrap are discharged, shredded, and converted into black mass
            plus separated materials.
        - label: Lithium recovery line
          detail: >-
            Lithium is extracted before the core Hydro-to-Cathode® loop and refined into battery-grade lithium carbonate
            at Base 1.
        - label: Leaching and impurity removal
          detail: >-
            Aluminum, copper, plastics, graphite, and other impurities are removed while nickel, cobalt, and manganese
            remain in solution.
        - label: Direct precursor synthesis
          detail: >-
            Hydro-to-Cathode® converts the mixed metal stream directly into pCAM rather than separating and recombining
            each metal individually.
        - label: Microstructure engineering and product finishing
          detail: >-
            Composition and crystal structure are tuned to customer requirements across NMC precursor families and
            related outputs.
        - label: Commercial outputs
          detail: >-
            Outputs include NMC hydroxide precursors, battery-grade Li2CO3, and nickel, cobalt, and manganese sulfate
            streams for battery supply chains.
