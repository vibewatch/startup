      - number: '2.5'
        title: Diligence gaps and contradictory estimates that should stay unresolved
        blocks:
          - type: paragraph
            body: >-
              This chapter preserves uncertainty on purpose. The broad market studies establish that battery recycling
              and recycled-materials demand are real, but they do not isolate Ascend’s post-petition SAM, current
              backlog, or probable share of domestic battery-material spend. The public contract set is directionally
              useful yet incomplete: Trafigura shows real downstream demand, Honda shows OEM interest, and the company
              has referenced a $1B automaker contract, but pricing formulas, minimum take-or-pay obligations, bankruptcy
              treatment, and revised delivery timing are not public. Likewise, the technical footprint is better
              evidenced than current operating output. Ascend had commercially produced recycled lithium carbonate and
              promoted Hydro-to-Cathode environmental advantages before the filing, but retained sources do not prove
              present plant utilization, margin profile, or financing runway under court supervision. Investors should
              therefore retain the contradictory market estimates in the record, model only evidence-backed commercial
              proof points, and treat any precise bankruptcy-adjusted revenue forecast as a diligence ask rather than a
              sourced fact.
            claimRefs:
              - CM032
              - CM033
              - CM034
              - CM035
              - CM038
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Ascend competes against several distinct ways a battery maker or OEM can solve the same job. The closest
              direct peer is Redwood Materials, which pairs recycling with critical-material production, has named OEM
              and industrial partners, and publicly discloses materially larger current throughput and capital access
              than Ascend. Umicore is the clearest incumbent substitute because it combines cathode materials, anode
              materials, and battery recycling inside a long-established industrial platform. Li-Cycle matters less as
              an independent rival in May 2026 because its own site and Glencore’s page both say the company was
              acquired in August 2025, even though the DOE page still documents the historical spoke-hub buildout thesis
              and a $475 million Rochester loan. Retriev’s current manifestation through Cirba Solutions competes mainly
              on collection, handling breadth, and facility footprint, while RecycLiCo and ABTC represent hydro-style
              challengers that market high recovery and closed-loop positioning with less public proof of scaled
              customer access. The status quo substitute remains buying qualified virgin or incumbent-refined material
              instead of closing the loop with a recycler, and likely entrants include battery manufacturers that decide
              to internalize more of the recycling step or adopt on-site modular systems.
