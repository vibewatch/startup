  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope, facilities, and customer-facing outputs
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements' product is not a generic recycling service; it is a battery-materials supply chain that
              starts with spent lithium-ion batteries and manufacturing scrap and ends with battery-grade outputs that
              can re-enter cathode production. The customer workflow begins with feedstock intake, battery shredding,
              and black-mass production, then splits into two core value streams: lithium is extracted first to make
              battery-grade lithium carbonate, while the remaining nickel, cobalt, and manganese stream is converted
              into pCAM and related salts. Public product pages position the company as a supplier of NMC hydroxide
              precursors, recycled lithium carbonate, and intermediate nickel, cobalt, and manganese sulfates rather
              than merely a toll recycler. The commercial asset map is similarly concrete. Base 1 in Covington, Georgia
              is the only clearly operational large-scale facility and combines shredding, lithium recovery, and
              black-mass processing. Apex 1 in Hopkinsville, Kentucky was intended to become the flagship pCAM
              manufacturing campus, while Apex 2 in Poland remains a longer-dated European expansion option. That
              structure matters because the technology thesis is now bifurcated: Base 1 proves part of the flow at
              industrial scale, but the full Hydro-to-Cathode® pCAM scale-up still depends on facilities whose build and
              funding paths are now under stress.
