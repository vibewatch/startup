chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Mission, and Founding
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements presents itself as a vertically integrated North American battery materials company
              headquartered in Westborough, Massachusetts, with operations centered on turning spent lithium-ion
              batteries and black mass into higher-value battery inputs rather than stopping at commodity recovery. The
              company's public identity hinges on its claim that Hydro-to-Cathode® can directly synthesize precursor
              cathode active material from recycled feedstock, allowing it to sell pCAM, CAM, and lithium carbonate into
              the battery supply chain. That identity matters across the rest of the report because later claims about
              facilities, grants, partnerships, and bankruptcy all depend on whether Ascend could industrialize a
              closed-loop model rather than remain only a recycler.

              The founding story is comparatively well documented. The business began in 2015 at Worcester Polytechnic
              Institute as Battery Resourcers, Inc., built around research commercialized by Prof. Yan Wang and Eric
              Gratz, and it rebranded to Ascend Elements on January 19, 2022 as the company prepared for
              commercial-scale manufacturing. The rename marked a deliberate shift from research-rooted startup to
              capital-intensive industrial scale-up, while the retained company narrative continued to emphasize
              scientific founding credentials, patented process differentiation, and the goal of producing cathode-ready
              materials domestically from recycled batteries.
