            body: >-
              Deployment evidence is mixed but real. Base 1 reached commercial-scale lithium carbonate production in
              2025 and is the clearest proof that Ascend can operate at least part of the recycling-to-materials chain
              at industrial scale. Commercial and partner proof exists beyond marketing copy: Freudenberg e-Power
              Systems and XALT Energy received pCAM or CAM shipments and publicly described strong cycle-life and safety
              results; Honda signed a recycling collaboration agreement; Trafigura agreed to take 15,000 metric tons of
              lithium carbonate from 2027 through 2031; and Ascend announced a multiyear pCAM contract worth nearly $1
              billion with a major U.S. automaker. At the same time, the dependency map has become more fragile. Apex 1
              was meant to convert the Base 1 platform into a full domestic pCAM manufacturing campus, but the build was
              tied to federal funding, execution discipline, and bankruptcy-court outcomes that are now uncertain. Apex
              2 in Poland broadens the geographic vision but does not de-risk the near-term U.S. scale-up because it
              remains pre-construction. The result is a chapter with credible commercial signals on product-market
              relevance, but a heavier-than-normal dependence on one unfinished campus and on financing continuity to
              turn technical process claims into durable volume.
