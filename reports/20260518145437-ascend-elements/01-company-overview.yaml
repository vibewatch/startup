company:
  name: Ascend Elements
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ascend Elements is a Westborough, Massachusetts battery recycling and battery materials company founded at Worcester
    Polytechnic Institute in 2015 that says its Hydro-to-Cathode® process converts spent lithium-ion batteries into pCAM,
    CAM, and lithium carbonate, while Base 1 in Georgia reached commercial recycling and lithium carbonate milestones before
    2026. Despite raising over $1.1 billion across its Series C and D financings and receiving major DOE support for Apex 1,
    project delays, grant cancellations, and acknowledged operational mismanagement culminated in an April 2026 Chapter 11
    filing that remained active as of May 17, 2026.
sections:
  - id: identity-founding
    title: Company Identity, Mission, and Founding
    body: >-
      Ascend Elements presents itself as a vertically integrated North American battery materials company headquartered in
      Westborough, Massachusetts, with operations centered on turning spent lithium-ion batteries and black mass into
      higher-value battery inputs rather than stopping at commodity recovery. The company's public identity hinges on its
      claim that Hydro-to-Cathode® can directly synthesize precursor cathode active material from recycled feedstock,
      allowing it to sell pCAM, CAM, and lithium carbonate into the battery supply chain. That identity matters across the
      rest of the report because later claims about facilities, grants, partnerships, and bankruptcy all depend on whether
      Ascend could industrialize a closed-loop model rather than remain only a recycler.

      The founding story is comparatively well documented. The business began in 2015 at Worcester Polytechnic Institute as
      Battery Resourcers, Inc., built around research commercialized by Prof. Yan Wang and Eric Gratz, and it rebranded to
      Ascend Elements on January 19, 2022 as the company prepared for commercial-scale manufacturing. The rename marked a
      deliberate shift from research-rooted startup to capital-intensive industrial scale-up, while the retained company
      narrative continued to emphasize scientific founding credentials, patented process differentiation, and the goal of
      producing cathode-ready materials domestically from recycled batteries.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO033
    tableRefs:
      - TO001
  - id: leadership-founders
    title: Leadership, Founders, and Governance
    body: >-
      Ascend Elements remains closely associated with its technical founders even after multiple executive transitions. Eric
      Gratz is still publicly listed as Co-Founder and CTO after having served as CEO from 2016 to 2020, while Prof. Yan
      Wang remains Co-Founder and Chief Scientist and continues to anchor the company's scientific legitimacy through the
      Hydro-to-Cathode® invention story. The founders' prominence is reinforced by external recognition, including the 2022
      AUTM Better World Award tied to commercialization of the underlying WPI technology, which helps explain why investors
      backed a manufacturing scale-up despite the company's heavy capital needs.

      The current operating leadership is materially different from the team that announced the largest financings. Linh
      Austin became President and CEO in early 2025 after previously serving on the board, and the company now publicly
      lists Ahmed Allouache, Tomasz Poznar, Barbara B. Knight, and Deacon Powell in senior roles. Mike O'Kronley, who was
      the public face of the Series C and Series D periods and the Apex 1 groundbreaking, appears to have exited before the
      2025 leadership reset. Governance disclosure remains incomplete, however, because the retained official sources name an
      executive roster but do not publish a full board composition or ownership-control map as of May 2026.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO037
    tableRefs:
      - TO002
  - id: funding-investors
    title: Funding History and Stakeholder Map
    body: >-
      Ascend Elements built one of the largest private capital stacks in the North American battery recycling and materials
      sector before its bankruptcy filing. Battery Resourcers first raised smaller venture rounds, including a roughly $20
      million Orbia-led financing and a roughly $70 million growth round, before the company rebranded and closed a $300
      million Series C in October 2022. That Series C combined equity and debt and brought in a mix of climate-tech,
      sovereign, and strategic industrial investors including Fifth Wall Climate, SK ecoplant, the Oman Investment
      Authority, Lithium Americas, JLR InMotion Ventures, Hitachi Ventures, TDK Ventures, Orbia, and GLy Capital
      Management.

      Capital intensity increased further in September 2023 when Ascend Elements announced a $542 million Series D led by
      Decarbonization Partners, the BlackRock and Temasek joint venture, with participation from the Qatar Investment
      Authority and Temasek. Official and third-party reporting together indicate that the company had raised more than $1.1
      billion across the 2022 and 2023 financings alone, while TechCrunch later reported that investors had put nearly $900
      million of equity into the business by the time of bankruptcy. Even with that scale of backing, critical data remain
      opaque: no post-money valuation was disclosed for Series D, ownership percentages are not public, and it is unclear
      how stakeholder priorities have been reordered inside the Chapter 11 process.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO025
      - CO040
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: operations-milestones
    title: Operations, Facilities, and Commercial Milestones
    body: >-
      Ascend Elements' operating footprint was designed to pair recycling throughput with downstream battery-materials
      conversion. Base 1 in Covington, Georgia is the clearest proof point, with the company describing the site as a
      commercial facility capable of processing roughly 30,000 metric tons per year of lithium-ion batteries and black mass.
      In 2025 the company announced commercial-scale production of battery-grade recycled lithium carbonate at greater than
      99 percent purity from Base 1, and it also signed commercial agreements with Koura, Trafigura, Honda, and an unnamed
      global automaker. Those milestones indicate that Ascend had real customer interest and product progression before the
      restructuring, even if public revenue and shipment figures remain undisclosed.

      Apex 1 in Hopkinsville, Kentucky was intended to be the large downstream manufacturing leap, with groundbreaking in
      2022 for a roughly one-million-square-foot pCAM plant on a 140-acre site requiring more than $1 billion of planned
      capital investment. The broader scale-up plan also expanded to Europe after Poland offered up to $320 million in grant
      support for a future pCAM plant there. Public sources therefore show a coherent multi-site strategy spanning Georgia
      recycling, Kentucky pCAM scale-up, and Polish expansion, but they also show that this strategy outran execution once
      construction delays, capital shortfalls, and policy reversals began to accumulate.
    claimRefs:
      - CO010
      - CO011
