  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: Revenue run rate, gross margins, EBITDA, burn rate, and cash balance have not been disclosed.
      whyItMatters: Cannot assess commercial viability or model unit economics.
      diligencePath: Request Chapter 11 first-day affidavit, DIP filing, and management accounts from the bankruptcy estate.
      relatedQuestionRefs:
        - QI003
        - QI004
        - QI015
    - type: private-evidence-only
      severity: blocking
      topic: apex1-capex-actual
      missingEvidence: Actual capex spent on Apex 1 before the pause versus planned >$1 billion remains undisclosed.
      whyItMatters: This is critical to understanding sunk cost, asset value, and restructuring options.
      diligencePath: Request construction cost statements from the Chapter 11 estate or Kroll claims agent.
      relatedQuestionRefs:
        - QI011
        - QI020
    - type: private-evidence-only
      severity: material
      topic: asp-pricing
      missingEvidence: No ASP or realized pricing data for pCAM or lithium carbonate has been publicly disclosed.
      whyItMatters: Without realized pricing, revenue per unit and gross margin cannot be calculated.
      diligencePath: Request a pricing deck, supply-contract summaries, and customer-specific ASP history.
      relatedQuestionRefs:
        - QI027
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Investor ownership stakes, liquidation preferences, and debt seniority are not publicly disclosed.
      whyItMatters: The liquidation waterfall and likely investor recoveries cannot be modeled.
      diligencePath: Request the cap table from company counsel or Chapter 11 schedules.
      relatedQuestionRefs:
        - QI017
        - QI021
    - type: missing-source
      severity: material
      topic: dip-financing
      missingEvidence: No DIP financing terms or lender identity were publicly reported as of May 17, 2026.
      whyItMatters: DIP terms determine priority creditor position and can define the exit timeline.
      diligencePath: Monitor PACER case 26-90440 in the Southern District of Texas for DIP motion filings.
      relatedQuestionRefs:
        - QI015
    - type: private-evidence-only
      severity: material
      topic: creditor-schedule
      missingEvidence: Specific creditors, claim amounts, and priority classifications are not publicly available.
      whyItMatters: The petition disclosed 1,000-5,000 creditors, but not enough detail to assess estate pressure or contract risk.
      diligencePath: Request Schedules F and G from PACER and monitor creditors' committee formation.
      relatedQuestionRefs:
        - QI017
        - QI024
    - type: missing-source
      severity: material
      topic: peer-comparison
      missingEvidence: A full Redwood Materials and Li-Cycle peer financing comparison was not re-researched within this chapter's source set.
      whyItMatters: The cross-company capital-efficiency comparison remains only directional without refreshed peer data.
      diligencePath: Pull fresh 2026 Redwood and Li-Cycle funding, revenue, and bankruptcy data in a follow-up peer set.
      relatedQuestionRefs:
        - QI021
    - type: private-evidence-only
      severity: material
      topic: contract-counterparty
      missingEvidence: The unnamed automaker counterparty and exact supply-contract terms remain undisclosed.
      whyItMatters: Counterparty identity and termination rights matter for estimating estate value and restart viability.
      diligencePath: Confirm through Chapter 11 claims filings, contract-assumption motions, or a public customer announcement.
      relatedQuestionRefs:
        - QI014
