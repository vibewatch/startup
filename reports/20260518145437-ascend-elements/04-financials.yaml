callouts:
  - calloutType: risk
    title: Chapter 11 Filing and CEO-Acknowledged Mismanagement
    body: >-
      Ascend entered Chapter 11 with petition ranges showing liabilities up to $1 billion, while CEO
      Linh Austin publicly cited insurmountable financial challenges and a long history of fiscal and
      operational mismanagement. That combination makes financial recovery heavily dependent on court-
      supervised restructuring rather than normal operating execution.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
  - calloutType: insight
    title: "DOE Grant Collapse: $274M in Foregone Non-Dilutive Capital"
    body: >-
      The cancelled $164 million CAM award plus the roughly $110 million undisbursed remainder of the
      pCAM award created an estimated $274 million non-dilutive capital shortfall. That gap is the
      cleanest public explanation for why Apex 1's economics became much harder to fund.
    claimRefs:
      - CI017
      - CI019
      - CI020
      - CI023
  - calloutType: strength
    title: Commercial Contracts Still Matter in Restructuring
    body: >-
      Public reporting indicates the Trafigura take-or-pay offtake remained in force during Chapter 11,
      and Ascend had already announced a roughly $1 billion multi-year automaker supply contract. Those
      contracts provide potential estate value if production capability and customer confidence can be
      preserved.
    claimRefs:
      - CI030
      - CI031
      - CI032
