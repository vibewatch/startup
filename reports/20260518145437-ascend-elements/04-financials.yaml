artifact: financials
slug: ascend-elements
runDate: "2026-05-18"
company:
  name: Ascend Elements
chapter:
  number: 4
  title: Financials
  summary: >-
    Ascend Elements built a capital-intensive battery-materials model around Hydro-to-Cathode®,
    Base 1 commercial output, and long-dated B2B contracts for pCAM and lithium carbonate, but it
    never disclosed public revenue, margin, or cash-flow statements. Public evidence supports more
    than $1.1 billion of capital received before the April 2026 Chapter 11 filing, yet Apex 1's
    unfinished >$1 billion scale-up and the loss of roughly $274 million of expected DOE support
    left the company financially overextended. The core diligence verdict is that Ascend proved
    product-market relevance and contract demand, but private-company opacity and active bankruptcy
    leave revenue quality, unit economics, and restructuring value only partially visible.
sections:
  - id: revenue-model
    title: Revenue Model and Commercial Traction
    body: >-
      Ascend Elements' disclosed financial model is industrial and B2B rather than SaaS-like. The
      company collects end-of-life batteries and production scrap, processes them through its Base 1
      facility in Covington, Georgia, and monetizes higher-value outputs such as pCAM, CAM, and
      battery-grade lithium carbonate through Hydro-to-Cathode®. Public evidence confirms that this
      model has produced commercial transactions since January 2022, when Ascend announced its first
      commercial cathode sale to Navitas Systems, and that Base 1 was generating revenue by 2022
      even though no revenue figure was disclosed. The best-documented customers and counterparties
      are Honda for recycled battery-material procurement, Koura for 5,000 metric tons per year of
      lithium carbonate, Trafigura for 15,000 metric tons per year under a take-or-pay structure,
      and an unnamed global automaker tied to an approximately $1 billion multi-year supply contract
      announced in December 2025. The company also created the AE Elemental joint venture in Poland,
      which along with the separate Apex 2 grant offer implies future European revenue pathways if a
      restructuring preserves expansion options. What remains missing is any public revenue split,
      shipment volume, or realization data by product line.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI032
    tableRefs:
      - TI001
    figureRefs:
      - FI002
  - id: pricing-unit-economics
    title: Pricing Architecture and Unit Economics
    body: >-
      Public sources show how Ascend sells but not what it earns per unit. The company's contracts
      imply per-kilogram pricing for pCAM and CAM and per-metric-ton pricing for lithium carbonate,
      with at least one disclosed take-or-pay structure in Trafigura's lithium carbonate offtake,
      yet no source in the retained set publishes realized average selling prices, index formulas,
      discounts, or rebate mechanics. Management marketing claims that Hydro-to-Cathode® can deliver
      comparable or better performance than virgin material at lower cost, but no independent source
      in the retained evidence provides verified gross margin, EBITDA, cash conversion, or product-
      level cost of goods sold. As a result, the only public pricing ranges available for underwriting
      are market-context estimates rather than Ascend disclosures: 2024-2025 NMC pCAM generally traded
      in the mid-teens to mid-thirties dollars per kilogram, while battery-grade lithium carbonate had
      corrected into roughly the mid-single to mid-teens dollars per kilogram after the 2022 spike.
      Those benchmarks help frame potential revenue and margin sensitivity, but they do not answer the
      central diligence question of whether Ascend's contracts were profitable at commercial scale.
    claimRefs:
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI002
      - TI003
    figureRefs:
      - FI003
  - id: capital-stack-and-doe
    title: Capital Raised, DOE Grants, and Capital Stack
    body: >-
      Ascend Elements accumulated one of the largest private capital stacks in North American battery
      recycling before bankruptcy. Battery Resourcers first raised approximately $20 million and then
      approximately $70 million in early rounds, followed by a $300 million Series C in October 2022
      and a $542 million Series D in September 2023. The Series C combined $200 million of equity and
      $100 million of debt, while the Series D was led by Decarbonization Partners with Goldman Sachs
      acting as placement agent. In parallel, the U.S. government backed the scale-up with two Battery
      Materials Processing awards: a $316 million pCAM grant visible on USAspending and a separate
      $164 million CAM grant that was later mutually cancelled. Trade coverage reported that roughly
      $206 million of the pCAM award was actually disbursed before DOE cancelled the remaining balance
      in October 2025, leaving Ascend with only part of the originally expected non-dilutive support.
      Poland also offered up to $320 million for a future Apex 2 plant, but public sources do not show
      a signed definitive grant agreement. The disclosed capital stack therefore exceeded $1.1 billion
      received before Chapter 11, with most of that capital apparently directed into Base 1 operations,
      Apex 1 construction, and broader scale-up efforts.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
