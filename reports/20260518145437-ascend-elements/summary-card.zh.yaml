  topStrengths:
    - Hydro-to-Cathode® 和 Base 1 提供了可信技术证据，证明 Ascend 能用回收原料产出电池级产品
    - 与 Honda、Trafigura、Koura 等买家签下战略关系，说明市场确实需要回收电池材料
    - IRA 和欧盟电池政策顺风仍支撑本土、可追溯回收 pCAM 和碳酸锂的长期需求
  topRisks:
