- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity reflects competitive underwriting risk as of 2026-05-18, not a legal judgment about any counterparty’s obligations or insolvency outcomes.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Hydro-to-Cathode direct pCAM route is uniquely efficient
    - Redwood, Umicore, ABTC, and RecycLiCo all market closed-loop or high-recovery alternatives; the public record does not prove a permanent process monopoly
    - High
    - Request independent side-by-side cost, yield, and qualification benchmarking against Redwood, Umicore, ABTC, and RecycLiCo
  - - Named customer traction proves durable demand
    - Chapter 11 can still reset counterparties even after Honda, Trafigura, and automaker wins
    - Critical
    - Confirm post-petition status of Honda, Trafigura, and the unnamed automaker contract and test customer willingness to stay through restructuring
  - - Domestic-loop logistics create lock-in
    - Redwood and Retriev / Cirba show broader current footprint or collection breadth in public evidence
    - High
    - Verify feedstock commitments, collection rights, and geographic service-level differences versus Redwood and Cirba
  - - Capital intensity can be solved with strategic financing
    - Li-Cycle’s historical distress and Ascend’s own bankruptcy show financing risk is structural, not incidental
    - Critical
    - Rebuild a financing plan with contingency cases, milestone-based draws, and independent construction schedule review
  - - Incumbents cannot respond quickly
    - Umicore already operates cathode materials plus battery recycling and can sell trusted industrial continuity
    - Medium
    - Map which customers value North American circularity enough to pay for switching away from incumbent-qualified supply
  - - Centralized recycling networks are the only viable model
    - RecycLiCo’s on-site modular positioning and potential internal build by battery manufacturers could bypass centralized processors
    - Medium
    - Monitor OEM / cell-maker captive recycling plans and assess whether Ascend can offer service or technology modules instead of only centralized supply
