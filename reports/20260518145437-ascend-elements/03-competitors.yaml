- id: TP003
  title: Pricing / packaging comparison
  notes: The comparison is driven by disclosed contract structure because fetched public sources did not show list prices or standard per-ton fee cards for any material competitor.
  columns:
  - Offer / competitor
  - Public price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Ascend Elements
    - No list price; disclosed take-or-pay offtake and multi-year supply agreements
    - Recycling, lithium carbonate, pCAM / CAM, marketing / logistics via Trafigura
    - Per-ton economics, contract floor / ceiling, and post-petition terms are unknown
    - Commercial selling is contract-led, which can deepen lock-in but makes market clearing prices opaque
  - - Redwood Materials
    - No public rate card; partner and supply-program selling only
    - Battery recycling, critical-material recovery, cathode materials, energy storage adjacency
    - Processing fee structure and material pricing formulas not disclosed
    - Redwood competes on integrated supply and partner breadth rather than transparent posted pricing
  - - Li-Cycle / GBR
    - No public rate card; DOE references supply agreements and spoke-hub operating model
    - Battery intake, black-mass aggregation, hub processing concept, continuity under GBR
    - Current Glencore commercial packaging not publicly detailed in fetched sources
    - Ownership change may improve continuity but reduces transparency on standalone economics
  - - Umicore
    - No public list price in fetched battery pages
    - Cathode materials, anode materials, industrial-scale battery recycling
    - Pricing, contract lengths, and North American terms unknown
    - Buyers likely engage through enterprise supply contracts, reinforcing incumbent-style procurement
  - - Retriev / Cirba Solutions
    - No public price; contact-led recycling program selling
    - Cross-chemistry collection, recycling, battery management
    - Lithium-ion-specific unit economics unknown
    - Best suited to compliance and collection jobs where buyers can evaluate service breadth instead of downstream material yields
  - - RecycLiCo
    - No public price; bespoke on-site Clean Spot deployment
    - Closed-loop on-site recycling and upcycling into battery-ready materials
    - Module price, licensing structure, and operating service economics unknown
    - Packaging resembles project or plant integration rather than commodity recycling fees
  - - ABTC
    - No public list price; investor materials emphasize direct sales of battery-grade metals and plant capacity
    - Battery recycling, battery-grade metal products, primary extraction platform
    - Realized pricing, contract duration, and customer concentration unknown
    - ABTC sells a strategic domestic-supply narrative, but public pricing transparency is still low
