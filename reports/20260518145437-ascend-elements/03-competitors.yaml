tables:
- id: TP001
  title: Competitor profile table
  notes: Funding and pricing cells reflect only fetched public evidence; where no precise amount or price was verified, the row states unknown or uses a qualitative capital-access proxy.
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Ascend Elements (reference)
    - Integrated recycler + pCAM / lithium carbonate producer
    - Chapter 11 in April 2026; nearly $900M invested per TechCrunch; >$1.1B raised/grants since 2022 per Recycling Today
    - OEMs, battery manufacturers, energy storage supply chain
    - Hydro-to-Cathode direct pCAM route; Honda recycling relationship; Trafigura offtake + logistics
    - Balance-sheet distress and unfinished Kentucky scaleout overshadow technical differentiation
  - - Redwood Materials
    - Direct peer — integrated recycler + materials + energy storage
    - Over 20 GWh and 60,000+ tons annual output disclosed; Series E expanded to $425M by Jan 2026; total private capital raised $2.3B
    - OEMs, cell manufacturers, industrial and data-center energy customers
    - Largest disclosed North American scale in chapter; broad named partner set; recycling-to-materials plus energy storage adjacency
    - Still exposed to capital intensity and transition from recycling into broader energy infrastructure
  - - Li-Cycle / Glencore Battery Recycling
    - Direct peer in transition — spoke / hub recycler
    - Current business absorbed by Glencore; DOE closed $475M Rochester loan in Nov 2024; historical three-site spoke footprint disclosed
    - Battery feedstock suppliers, OEMs, battery manufacturing scrap sources
    - Proprietary spoke-hub model and historical North American sourcing agreements
    - No longer an independent challenger; current public pages emphasize ownership change more than standalone growth
  - - Umicore
    - Incumbent substitute — circular battery materials supplier
    - Publicly traded industrial incumbent; 135+ years recycling expertise; exact battery-materials revenue not disclosed in fetched sources
    - Automotive and mobility customers needing qualified battery materials and recycling
    - Cathode + anode materials plus battery recycling inside one circular platform
    - European incumbent posture rather than explicit U.S. domestic-loop positioning in fetched evidence
  - - Retriev / Cirba Solutions
    - Adjacent incumbent — cross-chemistry recycler and collector
    - 35 years of battery recycling experience; six facilities; largest operational footprint across North America claimed
    - Battery collection programs, industrial recyclers, OEM and scrap generators
    - Broad battery-chemistry handling and collection reach
    - Fetched evidence shows collection strength, not pCAM, CAM, or battery-grade lithium production
  - - RecycLiCo
    - Emerging hydro challenger — modular on-site recycler
    - Publicly traded on TSX / OTC / FSE; multi-tonne-per-day modular Clean Spot model; exact installed base unknown
    - Battery factories, recycling operations, customers wanting on-site closed-loop processing
    - Up to 99% cathode-metal recovery claimed; on-site modular deployment reduces logistics dependence
    - Commercial deployments, customer names, and scaled throughput remain sparse in fetched public evidence
  - - American Battery Technology Company
    - Emerging integrated challenger — recycling + primary extraction
    - NASDAQ-listed; Nevada recycling plant designed for 20,000 tpy and second planned plant for 100,000 tpy; selected for $150M DOE grant
    - OEMs, battery manufacturers, stationary storage, broader domestic battery-metal buyers
    - Hydro process, battery-grade metal outputs, and diversification across recycling and primary resources
    - Public evidence still points to earlier commercial scale than Redwood and less downstream cathode specificity than Ascend or Umicore
  - - Virgin / incumbent refined material supply
    - Status-quo substitute
    - Existing global materials supply chains; exact scale outside this chapter’s fetched scope
    - Cell manufacturers and OEMs prioritizing qualified supply over recycling provenance
    - Avoids recycler execution risk and already fits existing qualification workflows
    - Does not create a domestic closed loop or recycled-content advantage
