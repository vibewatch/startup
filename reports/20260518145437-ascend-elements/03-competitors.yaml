  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Umicore exact segment scale and customer concentration
    missingEvidence: Exact battery-materials segment revenue, North American revenue split, and named battery customers were not verifiable from the fetched public pages.
    whyItMatters: Without segment-level scale data, Umicore’s threat is directionally clear but cannot be sized precisely against Ascend or Redwood.
    diligencePath: Pull Umicore annual report segment notes or management presentations that break out battery-materials revenue and customer concentration.
    relatedQuestionRefs:
    - QP005
  - type: missing-source
    severity: material
    topic: RecycLiCo commercial deployments
    missingEvidence: The fetched public pages did not identify named paying customers, installed Clean Spot modules, or recurring commercial throughput for RecycLiCo.
    whyItMatters: The technology pitch is strong, but competitive weight depends on whether it has real deployed customers rather than only modular design claims.
    diligencePath: Request customer references, installed base counts, and operating throughput under NDA or from future investor presentations.
    relatedQuestionRefs:
    - QP007
  - type: missing-source
    severity: material
    topic: public pricing for battery recycling and pCAM contracts
    missingEvidence: No fetched source disclosed per-ton recycling fees, pCAM formula pricing, take-or-pay price floors, or standardized contract durations across the peer set.
    whyItMatters: Pricing opacity prevents a clean comparison of margin structure, switching economics, and whether any player can sustain premium pricing.
    diligencePath: Request customer contracts or management guidance with formula pricing, floors, escalators, and minimum-volume commitments.
    relatedQuestionRefs:
    - QP013
    - QP014
