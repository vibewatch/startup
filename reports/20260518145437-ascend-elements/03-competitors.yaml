company:
  name: Ascend Elements
chapter:
  number: 3
  title: Competitors
  summary: 'Ascend Elements competes in a battery-recycling field where the strongest 2026 alternatives are Redwood Materials in North America and Umicore as the incumbent circular-materials supplier. Li-Cycle’s standalone challenge has effectively ended inside Glencore, Retriev/Cirba remains strongest in cross-chemistry collection rather than pCAM, and RecycLiCo plus ABTC represent earlier-stage hydro-style challengers with narrower public proof of customer access. The chapter’s adverse read-through is stark: Ascend’s April 2026 Chapter 11 and Li-Cycle’s loss of independence show that technical claims and customer announcements do not offset execution, financing, and timing risk.'
sections:
- id: competitive-landscape
  title: Competitive Landscape and Buyer Alternatives
  body: Ascend competes against several distinct ways a battery maker or OEM can solve the same job. The closest direct peer is Redwood Materials, which pairs recycling with critical-material production, has named OEM and industrial partners, and publicly discloses materially larger current throughput and capital access than Ascend. Umicore is the clearest incumbent substitute because it combines cathode materials, anode materials, and battery recycling inside a long-established industrial platform. Li-Cycle matters less as an independent rival in May 2026 because its own site and Glencore’s page both say the company was acquired in August 2025, even though the DOE page still documents the historical spoke-hub buildout thesis and a $475 million Rochester loan. Retriev’s current manifestation through Cirba Solutions competes mainly on collection, handling breadth, and facility footprint, while RecycLiCo and ABTC represent hydro-style challengers that market high recovery and closed-loop positioning
    with less public proof of scaled customer access. The status quo substitute remains buying qualified virgin or incumbent-refined material instead of closing the loop with a recycler, and likely entrants include battery manufacturers that decide to internalize more of the recycling step or adopt on-site modular systems.
