- id: switching-costs-and-distribution
  title: Switching Costs, Multi-Homing, and Distribution Power
  body: 'The public evidence suggests that battery recycling is not a simple spot market. Feedstock collection, hazardous-material logistics, black-mass conversion, downstream refining, and output qualification all create compound switching costs. Ascend’s own disclosed relationships make that visible: Honda is framed as a closed-loop recycled-material customer, while Trafigura supplies global marketing and logistics for a multi-year lithium carbonate offtake. Li-Cycle’s DOE-backed project also rested on supply agreements and a spoke-hub footprint, indicating that collection and routing capacity were part of the product, not an incidental service. Redwood’s advantage is especially distributional: it combines named OEM and industrial partners, two U.S. campuses, and current materials throughput, which makes it harder for a buyer to replace with a single lower-scale alternative. Multi-homing appears most feasible at the intake and compliance layer because Cirba/Retriev, Redwood, Li-Cycle’s
    historical spoke network, and ABTC all market battery handling or processing. Multi-homing gets harder once the customer needs qualified, battery-grade outputs or integrated pCAM/CAM supply, where the set of credible substitutes narrows materially. RecycLiCo’s on-site modular pitch is notable because it offers a different path: instead of switching between centralized recyclers, a buyer could try to internalize more of the loop.'
