companyProfile:
  summary: "Ascend Elements is a Massachusetts-based battery recycling and battery-materials manufacturer founded in 2015 as Battery Resourcers and rebranded in 2022. Its core Hydro-to-Cathode® process is designed to turn spent lithium-ion batteries and manufacturing scrap into battery-grade lithium carbonate and nickel-manganese-cobalt precursor materials for new EV batteries. The company built an operating Base 1 facility in Covington, Georgia, pursued the larger Apex 1 pCAM campus in Hopkinsville, Kentucky, signed strategic agreements with Honda, Trafigura, and Koura, and won major DOE-backed support before funding cuts and project delays culminated in an April 2026 Chapter 11 filing. The diligence question is therefore no longer whether the technology is real, but whether the assets can emerge from restructuring with enough capital and customer confidence to scale."
