  productSummary: "Hydro-to-Cathode® battery upcycling process that converts end-of-life lithium-ion batteries and manufacturing scrap into pCAM, battery-grade lithium carbonate, and related metal-sulfate outputs for new EV battery supply chains"
  customerFocus: "Battery OEMs, cathode and cell manufacturers, feedstock suppliers, and strategic commodity partners"
  businessModel: "Process battery scrap and spent cells, then monetize recovered battery-grade materials through pCAM and lithium-carbonate supply agreements plus related recycling services"
  stage: "Chapter 11 / restructuring"
  fundingStatus: "Raised major private financings in 2022 and 2023, paired with DOE-backed manufacturing awards, but lost federal support and filed Chapter 11 in April 2026"
