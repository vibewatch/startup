  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业牵引
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 披露的财务模型是工业 B2B，不像 SaaS。公司收集报废电池和生产废料，在佐治亚州 Covington 的 Base 1 处理，再通过 Hydro-to-Cathode® 将
              pCAM、CAM 和电池级碳酸锂等更高价值产出变现。公开证据确认，这一模型自 2022 年 1 月起已产生商业交易，当时 Ascend 宣布向 Navitas Systems 完成首笔商业正极销售；Base 1
              到 2022 年也已产生收入，尽管没有披露收入数字。记录最充分的客户和对手方包括：Honda 采购回收电池材料；Koura 每年采购 5,000 公吨碳酸锂；Trafigura 以照付不议结构每年采购
              15,000 公吨；以及一家未具名全球车企，对应 2025 年 12 月宣布的约 $1 billion 多年期供应合同。公司还在波兰设立 AE Elemental 合资公司；这与单独的 Apex 2
              补助提议一起说明，如果重组保住扩张选项，未来仍有欧洲收入路径。缺失的是按产品线划分的公开收入拆分、出货量或实际变现数据。
