  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值重置与建议
        blocks:
          - type: paragraph
            body: >-
              Ascend 的估值框架已经从风险成长切换到困境回收。公开资料显示，公司曾募集大额私人和公共资本，2023 年私人估值约 $1.5B，随后在 2026 年 4 月进入 Chapter
              11。这个轨迹正是普通股权建议为回避的核心原因。历史私人估值已经不能锚定价值，因为法院控制、拨款损失、承包商索赔和客户需求推迟都排在任何剩余上行之前。仍把 Ascend
              放在观察名单上的唯一理由，是电池材料资产对买家或带优先权保护的救助投资人仍可能有战略价值。但如果没有这些保护，公开证据不支持按接近历史估值的水平出价。估值重置也意味着，投资人要区分企业相关性和证券层面的吸引力：一个战略上有意思的资产，如果大部分上行被法院和融资结构拿走，仍可能是糟糕的股权投资。
