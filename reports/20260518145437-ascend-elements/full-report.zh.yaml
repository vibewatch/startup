companyProfile:
  summary: >-
    Ascend Elements 是一家总部位于马萨诸塞州的电池回收和电池材料制造商，2015 年以 Battery Resourcers 名义成立，2022 年更名。其核心 Hydro-to-Cathode®
    工艺，目标是把废旧锂离子电池和制造废料转成电池级碳酸锂，以及用于新 EV 电池的镍锰钴前驱体材料。公司在佐治亚州 Covington 建成并运营 Base 1 设施，推动肯塔基州 Hopkinsville 更大规模的 Apex 1
    pCAM 园区，与 Honda、Trafigura 和 Koura 签署战略协议，并在资金削减和项目延误最终导致 2026 年 4 月 Chapter 11 申请前，拿到 DOE
    支持的重大扶持。因此，尽调问题已不再是技术是否真实，而是这些资产能否带着足够资本和客户信心走出重组，并完成规模化。
