      - number: '7.4'
        title: 大宗商品、原料与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              即使法院程序稳定下来，Ascend 的长期模型仍暴露在电池材料价格波动和原料获取不均的风险中。Fastmarkets 描述的 2026 年市场，锂价剧烈波动，镍和锰的不确定性偏高，高纯度 NCM
              黑粉竞争也很激烈。这些条件在个别季度可能利好收入，但也会抬高营运资金需求，并增加一个风险：回收材料利润率不按早期融资材料假设的方式运行。终端市场疲弱又放大了问题：TechCrunch 提到 EV
              需求走弱和中国成本压力，Ascend 自己也承认 CAM 需求已不足以支撑 Hopkinsville 的原始设计。事后看，2022-2023 年的历史产能和盈利里程碑都太乐观。行业先例也重要：Li-Cycle
              的重组说明，即便是知名平台，也可能在规模经济出现前损失股权价值。
