      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分布偏负面，因为每一个建设性结果都需要多个相互依赖的修复同时成立。乐观情景假设公司有资金支持地走出 Chapter 11、Apex
              可信重启，并通过客户重新签约恢复一条可融资的增长路径。基准情景假设重组时间很长，保留部分重启可选性，但估值远低于 2023
              年标记。悲观情景假设清算或出售流程主要惠及优先债权人。大宗商品背景重要，但更多是二阶放大器。锂和黑粉价格能帮助正常运转的回收商，却无法单独修复破裂的资本结构。因此，公开证据支持一套保守区间框架：普通股权买家几乎没有安全边际，而特殊机会资本也许还能找到结构化机会。这就是为什么情景表要用回收价值口径，而不是收入倍数：决定性变量是走出破产、capex
              完工和优先级结构，不只是长期赛道增长。
