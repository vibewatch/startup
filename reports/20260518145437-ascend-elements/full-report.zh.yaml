  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示意价值区间（USDm）
      - 概率信号
      - 关键下行触发点
    rows:
      - - 乐观
        - 有资金支持的脱离破产、承包商重置、客户重签合同，以及稳定大宗商品背景
        - 600-1,000
        - 概率低，因为多个里程碑必须全部过关
        - 重启进一步延误或无法筹集替代资本
      - - 基准
        - 重组拉长、选择性重启，并伴随所有权稀释
        - 200-500
        - 基于当前证据，这是最可信的公开路径
        - 法院程序拉长、客户经济性走弱或资本更昂贵
      - - 悲观
        - 清算、强制出售，或高级债权回收后剩余价值接近于零
        - 0-150
        - 概率不低，因为法院控制已经存在
        - 没有资金路径、出售流程不利，或出现重大新增负债
      - - 投资含义
        - 没有优先保护时，风险 / 回报不对称
        - 所有公开情景下均低于此前私人估值标记
        - 分布主要由基准和悲观情景主导
        - 将普通股权承销视为缺乏吸引力
    notes: 所有区间均为分析师基于公开证据和可比结果的估计，不是管理层指引或 法院提交的估值材料。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 案例
      - 指标 / 状态
      - 估值 / 公开信号
      - 相关性
      - 局限
    rows:
      - - Redwood Materials
        - 获得新 Series E 融资的私营电池回收 / 正极材料平台
        - 2025-2026 年融资后估值 > $6B
        - 说明市场愿意为有新动能的品类幸存者付多少钱
        - 私营公司溢价包含 Ascend 已不具备的增长可选性
      - - Umicore
        - 电池材料和回收领域规模化上市老牌企业
        - 2026 年 5 月市值 $7.05B
        - 多元化且盈利的老牌企业，可作上市可比上限
        - 不是一一对应的创业公司或困境资产
      - - American Battery Technology Company
        - 规模尚小的上市电池材料平台
        - 2026 年 5 月市值 $0.39B
        - 可作为投机性电池材料股的小市值上市参照
        - 仍未进入 Chapter 11，资产组合也不可直接比较
      - - Li-Cycle
        - 曾为上市回收商，经 CCAA / Chapter 15 重组后出售给 Glencore
        - 困境先例，而非干净的市值可比
        - 对资本密集型回收商而言，是最相关的下行类比
        - 结果更多反映法律程序和出售条款，而非正常交易倍数
    notes: 本表只覆盖部分公开参照，但这些参照最有助于界定截至 2026-05-18 Ascend 困境价值区间，也足以支撑决策。
