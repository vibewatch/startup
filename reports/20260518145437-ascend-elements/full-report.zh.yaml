      - number: '1.6'
        title: 证据展项
        blocks:
          - type: callout
            title: 已获专利的 Hydro-to-Cathode® 工艺达到商业相关产出
            body: >-
              Ascend Elements 不只是兜售回收概念：公司把 Base 1 建成商业化运营点，称 2025 年已商业规模生产电池级回收碳酸锂，并签下具名的下游供应和包销关系。即便进入 Chapter
              11，保留下来的证据仍指向一套技术上有差异的工艺和真实客户兴趣，而不是纯粹的商业化前科研项目。
            calloutType: strength
