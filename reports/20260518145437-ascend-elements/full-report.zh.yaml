      - number: '5.5'
        title: Chapter 11 后的路线图可信度与技术风险
        blocks:
          - type: paragraph
            body: >-
              负面产品结论不是 Hydro-to-Cathode® 被证伪，而是将其在完整 pCAM 规模上变现所需的路线图已经受损。TechCrunch、Recycling Today 和 Electrive
              都报道，Ascend 于 2026 年 4 月 9 日申请 Chapter 11，并将事件归因于无法克服的财务挑战、长期财务和运营管理不善，以及预期政府支持流失。最重要的技术含义，是 Apex 1
              状态改变。申请前，公司材料和 2025 年 LCA 白皮书把 Hopkinsville 园区描述为主要 pCAM 扩产站点，目标是 2026 年末启动、2027 年商业规模运行。申请和 DOE
              补助取消之后，确切施工状态、供应商连续性和重启时间表不再有公开验证。这为尽调带来分裂判断：Base 1
              证明了真实运营能力，也在碳酸锂上形成有用产品楔子；但更大的产品命题仍要求投资人相信，一家破产公司能完成、融资并认证一个非常大的前驱体制造园区。在新的法院、管理层或承包商证据出现前，产品路线图应被视为有条件，而不是已承诺。
