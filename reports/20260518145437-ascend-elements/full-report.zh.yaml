      - number: '5.2'
        title: Hydro-to-Cathode® 架构与运行流程
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 的技术核心是 Hydro-to-Cathode®，公司称其为已获专利的直接前驱体合成工艺。公开材料描述的顺序是：电池先被破碎成黑粉，锂在核心 Hydro-to-Cathode®
              循环前被移除，剩余镍、钴、锰流经过浸出，铝、铜、塑料、石墨和其他杂质被去除，随后通过直接前驱体合成生成
              pCAM。这一运营模型不同于传统湿法回收；后者通常把镍、钴、锰分离成单独产品，再通过额外沉淀和前驱体形成步骤重组。它也不同于依赖高温熔炼、往往回收更少电池可用产出的火法路线。公司称该架构最多可省去 15
              个步骤，并在缩短后的流程上叠加微观结构工程，使组成和晶体行为可在前驱体形成过程中调节，而不是等多个独立精炼阶段之后再调。实际意义在于，Ascend
              试图从更直接的制造序列中同时获得收率和产品性能优势，而不只是依靠回收原料的经济性。近期产品主张还把该工艺与下游电芯结果连接起来，包括用升级回收 pCAM 制造的电池拥有更长循环寿命和更高功率容量。
