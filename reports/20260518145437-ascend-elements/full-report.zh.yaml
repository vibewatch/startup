      - number: '2.3'
        title: 买方分层、付款逻辑与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据支持围绕 Ascend 市场位置的四类实际买方和付款方。第一类是寻求回收成分供应和本土电池材料安全的车企和电池 OEM。第二类是需要把 pCAM 或锂输入材料认证进国内工厂的电芯或正极制造伙伴。第三类是
              Trafigura
              这类交易和大宗商品对手方，可通过长期包销结构吸收电池级碳酸锂。第四类是公共政策资本提供方；补助和税收抵免会实质性改变项目经济性，即便他们不是材料最终用户。采用路径慢且重认证：先验证回收产出的技术性能，再签商业供应或包销协议，之后在国内设施放量。Honda
              和 Trafigura 重要，因为它们验证了不同买方动作；未披露的美国大型车企 pCAM 合同则说明，只要质量和规模得到证明，汽车客户愿意购买。缺口在于，Chapter 11
              之下哪些买方动作仍活跃、延后或重谈，公开市场还没有完整透明的申请后视图。
