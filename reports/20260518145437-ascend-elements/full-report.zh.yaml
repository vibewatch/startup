            body: >-
              抓取到的证据显示，有广泛公开证明的公司与只有愿景或局部证明的公司之间分化很明显。Redwood 同时公布了运营规模信号——已处理超过 20 GWh 电池、每年超过 60,000
              吨关键材料——以及多伙伴商业版图，伙伴包括 Panasonic、GM Ultium Cells、Volkswagen Group of America、Volvo、Amazon、Toyota 和 BMW of
              North America。Umicore 的公开材料更像成熟企业而非创业公司：它强调欧洲循环电池材料链、电池回收、正极和负极产品，而不是美国特定伙伴标识。Li-Cycle 的公开证据现在分成两部分：DOE
              对历史辐条—枢纽系统的记录，以及 Glencore Battery Recycling 拥有服务连续性的当前通知。RecycLiCo 和 ABTC 都营销高回收率湿法路线，但公开商业包装不同：RecycLiCo
              定位为定制化现场 “Clean Spot” 模块，ABTC
              则讲述内华达州运营工厂加一座由联邦补助支持的规划中第二工厂。定价是整个品类公开信息最弱的地方。抓取到的官方页面没有一家公布标价或每吨费用；可见的反而是照付不议包销、伙伴项目、原料供应协议或定制化项目销售。
