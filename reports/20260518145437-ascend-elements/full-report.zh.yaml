            body: >-
              公开记录几乎没有给出传统客户健康指标。公司没有披露 NRR、GRR、流失率、续约率，也没有披露头部客户收入集中度。唯一具名且公开说明时间条款和数量的交易对手是 Trafigura：协议覆盖 2027 至 2031
              年的 15,000 MT。Honda 2023 年的基本协议和 Freudenberg 2024 年的出货有意义，但两者都没有披露合同量或续约机制。2025 年风险明显抬升：Ascend 称 CAM
              需求已不足以支撑被取消的 DOE 拨款，之后行业报道又称大客户把 pCAM 交付推迟了 12 到 18 个月。2026 年 4 月的 Chapter 11
              申请又增加了一层采购摩擦，因为高度依赖认证的供应链需要确信供应连续性、营运资金和执行都能顶住。管理层和行业报道都称客户承诺仍在，这在方向上有帮助；但市场仍缺少能证明哪些合同真正耐久、哪些采购订单仍开放、以及头部客户是否在重新谈判、延期或转向其他供应的文件。实际尽调不能停在数
              客户名单。需要测试大交易对手是否在申请后增加了信用保护、缩短付款账期、推迟认证工作，或要求备选供应。破产前客户推迟、破产后又强调连续性，这种混合信号恰恰要求直接访谈客户并审阅文件，而不能只听管理层叙事。
