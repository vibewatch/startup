      - number: '4.2'
        title: 定价架构与单位经济模型
        blocks:
          - type: paragraph
            body: >-
              公开来源能看出 Ascend 怎么卖，却看不出每单位赚多少。公司的合同暗示 pCAM 和 CAM 按公斤定价、碳酸锂按公吨定价；Trafigura
              的碳酸锂包销至少披露了一个照付不议结构。但保留来源没有公布已实现平均售价、指数公式、折扣或返利机制。管理层营销称 Hydro-to-Cathode®
              可以用更低成本提供与原生材料相当或更好的性能；但保留证据中没有独立来源验证毛利率、EBITDA、现金转化或产品层面的销售成本。因此，可用于承销的公开定价范围只能来自市场背景估算，而非 Ascend
              披露：2024-2025 年，NMC pCAM 通常在每公斤十几美元中段到三十几美元中段交易；电池级碳酸锂在 2022
              年峰值后已回落到每公斤个位数中段到十几美元中段左右。这些基准有助于框定潜在收入和利润率敏感性，但不能回答核心尽调问题：Ascend 的合同在商业规模下是否盈利。
