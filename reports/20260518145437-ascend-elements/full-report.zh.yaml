      - number: '4.5'
        title: 财务结论与证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个混合但最终负面的财务判断。Ascend Elements 组装了超过 $1.1 billion 资本，建成了明确在生产和销售电池材料的 Base 1 运营资产，并通过
              Trafigura、Koura、Honda 和一家未具名全球车企的合同保留了至少部分重组价值。与此同时，公司私人身份意味着外界无法验证收入运行率、产品层面收入组合、毛利率、EBITDA、月度烧钱或现金余额；截至
              2026 年 5 月中旬，Chapter 11 也尚未给出公开 DIP 融资披露或详细债权人清单。这种不透明让人无法判断 Base 1 单独看是否具备经济吸引力，也无法判断商业合同能否支撑 Apex 1
              在破产后重启。因此，关键承销结论不是 Ascend 缺乏客户兴趣，而是若没有法院文件、管理层账目、供应合同细节和工厂层面资本开支数据，其财务图景仍过于不透明，无法有信心承销。
