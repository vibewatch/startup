              Ascend 当前的风险堆叠，第一层是法院控制，第二层是联邦资金流失。公司已经进入活跃的 Chapter 11
              案件，运营决策、融资灵活性和利益相关方回收都不再由普通风险投资治理决定，而要先经过破产程序。公开摘要显示资产负债表规模大、债权人数量以千计，听证仍在推进，因此这不是轻量级申请。同时，项目既失去了 $164M
