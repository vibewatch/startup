      - number: '2.4'
        title: 增长驱动、采用约束与破产重置
        blocks:
          - type: paragraph
            body: >-
              支撑 Ascend 品类的结构性顺风仍在。EU 回收含量强制要求和碳足迹要求为回收电池材料创造合规拉力；美国 45X 制造支持仍有利于本土 pCAM 和碳酸锂生产。美国以外的 EV 采用仍强，Ascend
              也确实证明了商业化碳酸锂生产和多个下游关系。但市场硬约束同样清楚。原料时点仍是先有鸡还是先有蛋的问题，因为 2015 年以来售出的许多 EV 电池包现在才进入退役窗口。锂、钴、镍价格从 2022
              年高点回落后，回收金属价值下降，回收经济性急剧恶化。这些市场压力与公司层面问题撞在一起：CEO 提到的财务和运营管理不善、美国 EV 需求走软，以及 $316M DOE
              补助支持被取消。结果不是市场消失，而是政策和需求顺风不足以抵消 Ascend 规模下的资本强度、执行风险和糟糕时点。
