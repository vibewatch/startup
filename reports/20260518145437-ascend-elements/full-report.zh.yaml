      - number: '1.4'
        title: 运营、设施与商业里程碑
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 的运营版图设计成把回收处理量和下游电池材料转化配对。佐治亚州 Covington 的 Base 1 是最清楚的证明点；公司称该商业设施每年可处理约 30,000
              公吨锂离子电池和黑粉。2025 年，公司宣布 Base 1 已用回收原料商业规模生产纯度高于 99% 的电池级碳酸锂，并与 Koura、Trafigura、Honda
              和一家未具名全球车企签署商业协议。这些里程碑说明，重组前 Ascend 确实有客户兴趣和产品进展，即便公开收入和出货数据仍未披露。

              肯塔基州 Hopkinsville 的 Apex 1 原本是下游制造的大跳跃：2022 年动工，计划在 140 英亩场地上建设约一百万平方英尺的 pCAM 工厂，需要超过 $1 billion
              计划资本投入。波兰后来愿意为当地未来 pCAM 工厂提供最高 $320 million 补助，扩张计划也因此延伸到欧洲。公开来源由此呈现出一套连贯的多站点策略——佐治亚州回收、肯塔基州 pCAM
              扩产、波兰扩张；但这些来源也显示，一旦施工延误、资本缺口和政策反转累积，这套策略就跑在了执行能力前面。
