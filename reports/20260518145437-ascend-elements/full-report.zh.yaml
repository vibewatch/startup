      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              多次高管更替后，Ascend Elements 仍与技术创始人高度绑定。Eric Gratz 2016 至 2020 年担任 CEO，之后仍公开列名为联合创始人兼 CTO；Yan Wang
              教授仍是联合创始人兼首席科学家，并通过 Hydro-to-Cathode® 的发明故事继续撑起公司科学可信度。外部奖项也强化了创始人存在感，包括 2022 年 AUTM Better World
              Award，该奖项与 WPI 底层技术商业化相关，也解释了为什么投资人愿意在重资本需求下支持制造扩张。

              当前运营领导层与宣布最大几轮融资时的团队已明显不同。Linh Austin 早前担任董事，2025 年初出任总裁兼 CEO；公司现在公开列出的高管还包括 Ahmed Allouache、Tomasz
              Poznar、Barbara B. Knight 和 Deacon Powell。Mike O'Kronley 曾是 Series C、Series D 和 Apex 1 动工阶段的公开代表，看起来已在 2025
              年领导层重置前离开。治理披露仍不完整，因为保留的官方来源只给出高管名单，截至 2026 年 5 月没有公布完整董事会构成或所有权控制图。
