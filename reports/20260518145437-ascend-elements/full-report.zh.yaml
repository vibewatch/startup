  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层由供应链塑造，而非广义账号驱动
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 不像传统企业软件供应商那样拥有数百个具名账号。其公开客户基础更适合理解为一张电池供应链地图，其中买方、使用方和付款方角色不同。Honda 既是回收服务客户，也是北美 EV
              所需回收镍、钴、锂的潜在买方。Koura 是电池材料买方，用回收碳酸锂生产 LiPF6 等电解液输入材料。Trafigura 是包销和渠道伙伴，带来营销和物流触达，而不是可见的终端用户部署。Freudenberg
              e-Power Systems / XALT 则代表重型系统中的电池应用验证客户。公开材料还指向至少一个未具名美国大型 pCAM
              客户和一份未具名车企合同，显示真实需求，但隐藏了评估集中度所需的身份。重要尽调结论是，Ascend
              的客户故事跨多个细分市场且具有战略相关性，但账号数量、收入组合和分母指标仍稀疏。因此，关系质量比标识数量更有信息量。公开证明是一张战略重要关系图，而不是干净的客户数量故事。可见关系也偏向那些对融资和产业政策有意义的公告：OEM
              回收、电解液原料、碳酸锂包销和验证性出货。这让本章适合测试需求是否存在，但不适合衡量有多少账号仍在运行、扩张有多快，或近期收入到底有多分散。
