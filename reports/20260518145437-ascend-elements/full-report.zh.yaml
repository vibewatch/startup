  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、设施与面向客户的产出
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements
              的产品不是通用回收服务，而是一条电池材料供应链：起点是废旧锂离子电池和制造废料，终点是可重新进入正极生产的电池级产出。客户流程从原料接收、电池破碎和黑粉生产开始，再分成两条核心价值流：先提取锂来制造电池级碳酸锂，剩余的镍、钴、锰流则转化为
              pCAM 和相关盐类。公开产品页把公司定位为 NMC 氢氧化物前驱体、回收碳酸锂，以及中间镍、钴、锰硫酸盐供应商，而不只是代工回收商。商业资产地图同样具体。佐治亚州 Covington 的 Base 1
              是唯一明确运营中的大型设施，结合了破碎、锂回收和黑粉处理。肯塔基州 Hopkinsville 的 Apex 1 原本要成为旗舰 pCAM 制造园区，波兰的 Apex 2
              则仍是更长期的欧洲扩张选项。这一结构重要，因为技术命题现在已分叉：Base 1 在工业规模证明了流程的一部分，但完整 Hydro-to-Cathode® pCAM 扩产仍依赖建设和融资路径已承压的设施。
