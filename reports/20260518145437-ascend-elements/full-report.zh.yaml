      - number: '2.2'
        title: 多重测算口径，而非单一 TAM 标题数字
        blocks:
          - type: paragraph
            body: >-
              现有市场数字支持机会足够大，但不能导出一个干净的 Ascend 专属 TAM。最直接保留下来的分析师口径来自 MarketsandMarkets：全球锂离子电池回收市场 2026 年为 $18.6B，2033
              年达 $50.0B；更窄的汽车锂离子电池回收口径从 2025 年 $12.87B 增至 2032 年 $36.33B；另一个 EV 电池回收终点到 2035 年达
              $23.72B。这些估算范围和终点年份不同，不能简单平均。需求端背景仍然重要：BloombergNEF 预计 2025 年全球每四辆新售汽车中就有一辆为电动车，中国 EV 占比超过 50%；EU 预计电池需求到
              2030 年可能增长 14x。对 Ascend
              而言，含义是市场足够大，值得关注；但公司可捕获份额必须由已披露商业证明点和破产期执行风险来约束，而不是由任意一个全球预测决定。大市场增长没有因破产申请消失；公司自身将其变现的路径却变得不确定得多。
