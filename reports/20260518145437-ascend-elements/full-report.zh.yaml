      - number: '7.5'
        title: 缓释措施、监控与退出条件
        blocks:
          - type: paragraph
            body: >-
              可投资路径很窄，但可以监控。第一，公司需要一条法院背书的出清路径或战略出售，因为破产风险压过所有其他事项。第二，替代资本的条款不能只是把失败推迟到杠杆更高的资本结构里。第三，Apex
              必须按现实的设计、承包商和投产计划重启，而不是再给一版愿景式时间表。最后，市场端要通过具名客户、公式定价合同和能承受大宗商品波动的原料安排来稳定下来。任一条件失效，价值都应下调到困境资产回收，而不是成长股权可选性。原因很简单：Chapter
