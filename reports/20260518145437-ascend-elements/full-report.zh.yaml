      - number: '3.4'
        title: 护城河耐久性与负面竞争映射
        blocks:
          - type: paragraph
            body: >-
              这个市场最残酷的竞争事实不是功能对比，而是近期的品类伤亡名单。TechCrunch 和 Recycling Today 都报道了 Ascend 2026 年 4 月的 Chapter 11；Li-Cycle
              当前页面也显示，另一家北美大型回收商已不再作为独立公开挑战者运营。这意味着市场筛选的东西比工艺新颖性更苛刻：资本续航、运营连续性，以及把伙伴公告转化为规模化交付产品的能力。Ascend 的
              Hydro-to-Cathode 仍有有意义的差异化，申请前也有 Honda、Trafigura 和未具名车企的公开商业证据，但这些没能阻止资不抵债。Redwood
              目前看起来最强，因为其公开记录同时具备规模、具名对手方和新资本。Umicore 的护城河不同：长期工业资历、合格正极材料和已验证回收率。ABTC 和 RecycLiCo
              仍可能构成替代风险，因为湿法回收和模块化部署会随着时间压缩技术差异；Retriev/Cirba 则可在买方只需要收集和合规、而非闭环正极供应时获胜。实际尽调结论是，Ascend 的竞争耐久性较少取决于
              Hydro-to-Cathode 是否真实——它显然真实到足以赢下合同——更多取决于 Chapter 11 后的公司能否恢复融资、守住对手方，并比资本更充足的对手更快重启规模化执行。
