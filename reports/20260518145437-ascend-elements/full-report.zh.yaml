  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Ascend Elements
              仅按“电池回收商”承销。保留的官方来源显示，其闭环市场边界更宽：废旧锂离子电池的收集和处理、关键矿物的湿法回收、向前驱体正极活性材料（pCAM）的转化，以及电池级碳酸锂产出。因此，纳入支出包括回收费和原料处理费、回收锂产品和
              pCAM 的下游销售，以及国内电池供应链参与方因合规而购买回收材料。排除支出应包括原生矿采、与电池材料无关的普通化学品生产、电芯制造、电池包组装和 EV
              销售本身。现状替代方案仍很重要，因为买方仍可采购原生或进口前驱体，而不是回收国内材料；大宗商品价格疲弱时，也可推迟回收经济性。Ascend 的 Hydro-to-Cathode
              定位之所以重要，正是因为它试图用一条整合的本土路径，替换前端的处置或低价值回收，以及后端的进口 pCAM 或锂盐等多个替代步骤。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM029
