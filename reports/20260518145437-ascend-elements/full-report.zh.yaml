            body: >-
              Ascend Elements 的制造计划高度依赖非稀释性联邦支持；到 2025 年底，两条主要 DOE 补助线要么被完全取消，要么被大幅削减。由此产生的缺口不只是预算问题；它削弱了 Base 1 运营证明点与
              Apex 1 资本密集型 pCAM 扩产之间的桥梁。
