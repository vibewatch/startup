              具名证明足以让人相信，Ascend 卖的不是纯假设产品。Honda 是最佳参考，因为合作出现在 Honda 自己的新闻网页上，且 2023 年公告明确延续了 2021 年回收关系。Koura
              是最清楚的具名电池材料客户：Ascend 公开承诺每年供应最高 5,000 公吨回收碳酸锂，新闻稿和行业报道都描述了 Koura 将其用于电解液材料的计划。Trafigura
              是最清楚的多年期包销锚点，披露协议覆盖 2027 至 2031 年、总量 15,000 公吨。Freudenberg e-Power Systems / XALT 为 Ascend
              提供了商用车电池应用中的材料出货参考，但公司自己表示，这批出货相对于目标完整规模项目仍然很小。这个区别重要：公开证明在具名对手方和已签里程碑上最强，但在重复出货量、产能利用率或后续订单方面弱得多。即便公开描述中最大的
