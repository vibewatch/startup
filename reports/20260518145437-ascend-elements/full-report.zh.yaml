      - number: '8.2'
        title: 可比公司组与市场背景
        blocks:
          - type: paragraph
            body: >-
              可比公司组给出的信号偏谨慎。Umicore 是最好的公开市场上端基准，因为它是规模化、多元化的在位企业，有最新投资者材料，2026 年 5 月市值约 $7.05B。ABAT
              提供了一个小得多的投机性公开参照，市值约 $0.39B。Li-Cycle 是最重要的下行情景类比：这家公开回收商先后进入 CCAA 和 Chapter 15，最后卖给 Glencore。Redwood
              Materials 是反例，说明市场仍会给有动能、多元可选项和新资本的赛道幸存者支付溢价估值。这些参照的价值不在于直接倍数，而在于边界。它们表明，Ascend 今天不能合理主张 Redwood
              式风险定价，而应在困境资产逻辑和仍在运转同行的公开价值之间夹逼估值。可比公司组的有用启示不是某一个倍数，而是资本市场奖励偿付能力、执行可信度和多元化，同时会严厉惩罚停摆项目和不透明的重组路径。
