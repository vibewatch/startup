      - number: '4.4'
        title: 资本强度、负面事件与 Chapter 11
        blocks:
          - type: paragraph
            body: >-
              负面财务故事是典型工业扩产失败：强融资和客户公告不足以把一个延误、暴露于诉讼、价值十亿美元的工厂推到完工。肯塔基州 Hopkinsville 的 Apex 1 曾被宣传为在 140
              英亩场地上、接近一百万平方英尺、投资超过 $1 billion 的项目；但公开来源没有显示它在公司失去 $164 million CAM 补助以及之后约 $110 million 未拨付 pCAM
              补助余额之前达到商业运营。约 $274 million DOE 支持落空之所以关键，是因为行业报道直接把破产与融资压力、施工延误和计划项目动能流失相连。Ascend 随后于 2026 年 4 月 9
              日在德克萨斯南区以案号 26-90440 申请 Chapter 11；申请区间显示资产超过 $1 billion，负债介于 $500 million 至 $1 billion，债权人 1,000 至 5,000
              名。CEO Linh Austin 公开描述了无法克服的财务挑战和长期财务、运营管理不善；行业报道还补充 Apex 1 诉讼、施工延误、合同流失、EV
              需求放缓和中国竞争等压力。公开证据因此支持一个结论：真实商业需求被资本强度和执行失败削弱。
