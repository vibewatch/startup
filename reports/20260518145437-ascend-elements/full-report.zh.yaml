    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、使命与创立
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 将自己定位为一家垂直整合的北美电池材料公司，总部在马萨诸塞州
              Westborough，运营重心不是把废旧锂离子电池和黑粉做到大宗商品回收就停下，而是进一步转成价值更高的电池输入材料。公司的公开身份押在一个主张上：Hydro-to-Cathode®
              能用回收原料直接合成前驱体正极活性材料，使公司可以向电池供应链出售 pCAM、CAM 和碳酸锂。这个身份会影响后文所有判断，因为设施、补助、合作和破产相关主张，最终都取决于 Ascend
              能否把闭环模式工业化，而不是只做回收商。

              创立故事相对有据可查。公司 2015 年诞生于 Worcester Polytechnic Institute，名为 Battery Resourcers, Inc.，围绕 Yan Wang 教授和 Eric
              Gratz 商业化的研究搭建；2022 年 1 月 19 日，公司为筹备商业规模制造更名为 Ascend
              Elements。更名标志着公司有意从研究型创业公司转向资本密集型工业扩张；保留下来的公司叙事继续强调科学家创始背景、专利工艺差异化，以及用回收电池在本土生产可直接进入正极体系的材料这一目标。
