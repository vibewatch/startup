      - number: '4.3'
        title: 融资额、DOE 补助与资本结构
        blocks:
          - type: paragraph
            body: >-
              破产前，Ascend Elements 积累了北美电池回收领域最大的一批私人资本。Battery Resourcers 早期先后融资约 $20 million 和约 $70 million，随后在 2022 年
              10 月完成 $300 million Series C，在 2023 年 9 月完成 $542 million Series D。Series C 包含 $200 million 股权和 $100
              million 债务；Series D 由 Decarbonization Partners 领投，Goldman Sachs 担任配售代理。同时，美国政府用两项 Battery Materials
              Processing 奖励支持扩产：USAspending 可见的一笔 $316 million pCAM 补助，以及另一笔后来双方同意取消的 $164 million CAM 补助。行业报道称，在 DOE 于
              2025 年 10 月取消剩余余额之前，pCAM 补助中约 $206 million 已实际拨付，Ascend 最终只拿到原本预期非稀释性支持的一部分。波兰还为未来 Apex 2 工厂提供最高 $320
              million，但公开来源没有显示已签署最终补助协议。因此，Chapter 11 前披露的资本结构已超过 $1.1 billion，且大部分资本显然投向 Base 1 运营、Apex 1 建设和更广泛扩张。
