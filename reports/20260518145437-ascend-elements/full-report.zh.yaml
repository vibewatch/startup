      - number: '1.5'
        title: 负面进展、DOE 补助丧失与 Chapter 11
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 故事的核心负面弧线，是商业和融资动能没有转化为完成的 Apex 1 扩产。2025 年 2 月，随着 Ascend 将策略转向 pCAM，公司与美国能源部（DOE）共同同意取消一笔
              $164 million 正极活性材料补助；到 2025 年 10 月，外部报道指里程碑未达后，DOE 又取消了另一笔 $316 million pCAM 补助中约 $110 million
              的剩余余额。补助反转抽走了关键的非稀释性资本，而项目本已面临延误、诉讼、EV 需求走弱和更便宜中国电池材料的压力。

              2026 年 4 月 9 日，财务后果变成明牌：Ascend Elements 在德克萨斯南区申请 Chapter 11 保护，申报资产超过 $1 billion，负债介于 $500 million 至 $1
              billion。公开报道将这次申请归因于 Apex 1 施工问题、合同流失、政策冲击和管理失误；Austin 自己的声明也提到无法克服的财务挑战，以及长期的财务和运营管理不善。BankruptcyObserver
              显示，截至 2026 年 5 月中旬案件仍在进行；Austin 同时表示 Trafigura 包销等关键商业合同仍有效，这意味着公司处在活跃重组中，而不是已完成清算。
