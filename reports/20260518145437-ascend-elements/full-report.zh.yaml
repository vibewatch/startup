      - number: '7.3'
        title: 环境、许可与安全暴露
        blocks:
          - type: paragraph
            body: >-
              环境和许可风险今天不是最靠前的问题，但仍然重要，因为任何重启都要继续满足合规义务。DOE 自己的环境评估把 Apex
              描述为一座大型工业综合体，包含多栋建筑、高烟囱，以及实质性的废弃物、交通和职业安全考量。Georgia EPD 的豁免显示，Ascend 的运营模式已经依赖对危险电池材料的特殊处理，才能在没有完整 RCRA
              Part B 许可的情况下开展回收。这项豁免明确覆盖空气排放、废水、残余物、灾难性故障和财务保证。EPA 指南和 Kentucky
              州的公开许可工具也强化了一点：这些义务会贯穿关停、检查和任何重新设计。换句话说，只有公司保持文件纪律，并且在重组期间付得起合规开销，环境风险才可控。
