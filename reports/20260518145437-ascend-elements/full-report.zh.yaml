        title: 部署状态、商业证明与关键依赖
        blocks:
          - type: paragraph
            body: >-
              部署证据有分歧，但真实存在。Base 1 在 2025 年达到商业规模碳酸锂生产，是 Ascend 至少能在工业规模跑通回收至材料链条一部分的最清楚证明。商业和伙伴证明不止营销文案：Freudenberg
              e-Power Systems 和 XALT Energy 收到了 pCAM 或 CAM 出货，并公开描述了强循环寿命和安全性结果；Honda 签署回收合作协议；Trafigura 同意在 2027 至 2031
              年拿走 15,000 公吨碳酸锂；Ascend 还宣布与一家美国大型车企签署价值接近 $1 billion 的多年期 pCAM 合同。与此同时，依赖地图变得更脆弱。Apex 1 原本要把 Base 1
              平台转化为完整本土 pCAM 制造园区，但建设绑定联邦资金、执行纪律和破产法院结果，如今都不确定。波兰的 Apex 2
              扩大了地域愿景，但仍处于开工前，不能降低美国近期扩产风险。本章因此呈现出可信的产品市场相关性商业信号，同时也显示公司对一个未完工园区和融资连续性的依赖高于常态；只有这些条件到位，技术工艺主张才能转成持久产量。
