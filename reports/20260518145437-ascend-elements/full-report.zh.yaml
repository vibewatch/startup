      - number: '7.2'
        title: 工厂执行与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              Apex 1 的执行风险已经不是假设。公开报道称建设自 2024 年末以来暂停，客户把 pCAM 交付推迟了 12 到 18
              个月，管理层又把时间表重置了大约一年。承包商纠纷进一步放大了运营脆弱性，因为大型化工处理场址经历诉讼、重新招标和范围修订后，很难干净重启。依赖风险同样关键：工厂仍需要资金、买家、供应商、承包商和监管方同时到位。Ascend
              也许能替换一个交易对手，但如果要同时替换多个，投产会变慢，成本也会上升。因此，DOE 支持、客户节奏、承包商稳定性和原料获取必须作为一个一体化依赖系统来审视，而不是拆成孤立风险。
