  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发点
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 法院程序恶化
        - 没有有资金支持的脱离破产路径、没有买方，或重大里程碑滑坡
        - 回收价值压缩，融资杠杆恶化
        - 转向只看清算的承销
      - - 替代资本惩罚性过高
        - 新资金只有在极端稀释或劣后经济条款下才到位
        - 历史私人估值标记失去意义
        - 回避普通股敞口
      - - Apex 持续停工
        - 重启错过更新后的时间表，或 capex 明显重新打开
        - 任何运营上行都被推迟到有用承销周期之外
        - 将工厂视为困境库存，而不是增长资产
      - - 客户经济性恶化
        - 交付进一步延迟，或定价 / 数量没有可见度
        - 收入假设和利润率预期失效
        - 将乐观和基准情景向悲观下修
    notes: 这些都是可公开监测的触发点，应迫使投资逻辑重写，而不是细颗粒度 内部 KPI 阈值。
    claimRefs:
      - CV009
      - CV027
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 申请后融资
        - DIP、现金抵押和现金跑道预算
        - 决定公司能否存活足够久以保留可选性
        - 调取完整案卷，审查融资命令或条款清单
      - - 资本结构和瀑布
        - 留置权优先级、担保债权和回收层级
        - 任何新资金都可能排在既有债权之后
        - 索取律师摘要和债权人层级
      - - Apex 完工预算
        - 补助丧失和诉讼后的更新 capex、进度表和预备金
        - 没有这些，基准情景就是猜测
        - 索取董事会批准的项目预算和关键路径
      - - 客户合同
        - 数量、定价、启动日期和控制权变更条款
        - 需要用来检验重启经济性是否仍可融资
        - 索取修订后的包销时间表和模型假设
    notes: 这些问题有意收窄且带有闸门性质；没有它们，公开证据只支持观察或 特殊机会研究，不支持普通投资决策。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
      - CV040
