          - type: callout
            title: Chapter 11 发生在延误、补助流失和承认管理失误之后
            body: >-
              对一家私人创业公司而言，负面证据异常直接。第三方报道把失败与诉讼、施工延误、EV 需求走弱和中国竞争联系起来；Austin
              的公开声明则提到长期的财务和运营管理不善。两者叠加后，这不只是外部环境导致的重组，也是内部执行失败导致的重组。
