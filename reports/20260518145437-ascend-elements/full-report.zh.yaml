      - - Koura 电解质材料需求
        - 一个具名电池材料买家可能主导早期碳酸锂需求能见度
        - 单一下游化学品买家可能影响爬坡时间和营运资本需求
        - 索取已出货量、库存承诺和按产品划分的客户集中度
      - - Trafigura 渠道扩张
        - 依赖渠道伙伴会降低终端客户组合能见度，并可能压缩利润率
        - Ascend 可以展示包销量，却无法证明终端用户采用已经多元化
        - 索取下游投放、定价瀑布和排他性条款
      - - Freudenberg 重型验证
        - 验证成功不等于规模化重复订单
        - 如果项目不能转化，叙事动能可能跑在收入兑现前面
        - 索取 XALT 的 SOP 时间、年度量计划和验收关口
      - - 未具名美国大型客户和未具名车企合同
        - 顶级账户身份不明，任何严谨的公开集中度分析都无从展开
        - 大量积压订单可能集中在一两个隐藏买家手里
        - 在 NDA 下索取前 5 大客户积压订单、收入占比和合同名称
      - - Chapter 11 加交付推迟
        - 采购委员会可能延迟授标、重新招标数量，或收紧信用条款
        - Ascend 正需要长期资质项目转化时，客户信心可能恰好被侵蚀
        - 索取客户联系日志、申请后的合同修订，以及暂停采购的任何交易对手
    notes: 主要风险不是缺少具名 logo，而是无法量化每个 logo 背后有多少经济性。
