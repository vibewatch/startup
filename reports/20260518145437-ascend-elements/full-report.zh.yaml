      - number: '2.5'
        title: 应保留未解的尽调缺口与相互矛盾估算
        blocks:
          - type: paragraph
            body: >-
              本章刻意保留不确定性。广义市场研究证明，电池回收和回收材料需求真实存在；但它们没有隔离出 Ascend 申请后的
              SAM、当前在手订单，或其可能占据的国内电池材料支出份额。公开合同组合有方向性价值但不完整：Trafigura 显示真实下游需求，Honda 显示 OEM 兴趣，公司也提到一份 $1B
              车企合同；但定价公式、最低照付不议义务、破产处理方式和修订后的交付时间均未公开。同样，技术足迹比当前运营产出更有证据支撑。申请前，Ascend 已商业化生产回收碳酸锂，并宣传 Hydro-to-Cathode
              环境优势；但保留来源不能证明法院监督下的当前工厂利用率、利润率画像或融资跑道。投资人因此应把相互矛盾的市场估算留在记录中，只建模有证据支撑的商业证明点，并把任何精确的破产调整后收入预测视为尽调问题，而不是有来源支持的事实。
