  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: standard
    summary: 公开可见需求沿三条路径推进：OEM 闭环回收、电池材料包销和重载应用验证。
    data:
      nodes:
        - label: Ascend 回收 + 材料平台
          description: 从废旧电池和废料生产回收服务、碳酸锂、pCAM 和 CAM。
        - label: Honda 闭环路径
          description: 从电池回收开始，并延伸到面向北美 EV 的再生矿物采购合作。
        - label: Koura 材料路径
          description: 在 LiPF6 等电解液材料中使用再生碳酸锂。
        - label: Trafigura 渠道路径
          description: 向下游电池供应链客户营销和分销碳酸锂。
        - label: Freudenberg / XALT 验证路径
          description: 在重载电池应用中测试并推出再生正极材料。
        - label: 未具名大客户路径
          description: 代表身份仍未披露的大型 pCAM 合同和车企合同。
      edges:
        - from: Ascend recovery + materials platform
          to: Honda closed-loop path
          label: 回收服务 + 采购协作
        - from: Ascend recovery + materials platform
          to: Koura materials path
          label: Li2CO3 供应协议
        - from: Ascend recovery + materials platform
          to: Trafigura channel path
          label: 15kt 多年期包销
        - from: Ascend recovery + materials platform
          to: Freudenberg / XALT validation path
          label: pCAM / CAM 出货 + 验证
        - from: Ascend recovery + materials platform
          to: Unnamed large-customer path
          label: $1B pCAM 合同 + 未具名车企合同
        - from: Trafigura channel path
          to: Unnamed large-customer path
          label: 下游 OEM / 电池客户仍未披露
