      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Ascend 尚不具备 IPO
              退出准备，最现实的退出是战略性资产出售、法院批准的重组，或带明确优先权保护的救助融资。这让尽调范围比普通私营公司轮次窄得多。投资人需要知道谁控制流程、还剩多少现金、前面有多少索赔、工厂能否按修订预算完工，以及客户是否仍会按可融资条款接收产品。在这些问题得到回答前，正确姿态是：特殊机会投资人最多继续研究，标准
              VC 或成长股权买家应回避。缺失证据不是装饰性信息；它正是区分可回收重组和价值陷阱的信息。上述事项披露前，合适的比较对象不是传统后期 VC 融资备忘录，而是重组工作流或特殊机会案卷。
