      - number: '1.3'
        title: 融资历史与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              申请破产前，Ascend Elements 在北美电池回收和材料领域搭起了最大的一批私人资本堆栈。Battery Resourcers 先完成几轮较小风险融资，包括 Orbia 领投的约 $20 million
              融资和约 $70 million 成长轮；更名后，公司在 2022 年 10 月完成 $300 million Series C。该 Series C 结合股权和债务，引入 Fifth Wall
              Climate、SK ecoplant、Oman Investment Authority、Lithium Americas、JLR InMotion Ventures、Hitachi Ventures、TDK
              Ventures、Orbia 和 GLy Capital Management 等气候科技、主权和战略产业投资方。

              2023 年 9 月，资本强度进一步抬升：Ascend Elements 宣布完成 $542 million Series D，由 BlackRock 和 Temasek 合资的 Decarbonization
              Partners 领投，Qatar Investment Authority 和 Temasek 参投。官方与第三方报道合起来显示，仅 2022 和 2023 年几轮融资，公司融资总额就超过 $1.1
              billion；TechCrunch 后来报道，破产前投资人已向公司投入近 $900 million 股权资金。即便背后资本达到这个量级，关键数据仍不透明：Series D
              没有披露投后估值，持股比例未公开，也不清楚 Chapter 11 程序中各利益相关方的优先级如何被重新排序。
