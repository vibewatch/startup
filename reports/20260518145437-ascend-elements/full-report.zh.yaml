        - 去除 Al、Cu、塑料和石墨，同时让 Ni、Co、Mn 留在溶液中
        - 化学过程控制和杂质管理
        - 杂质夹带可能损害前驱体质量或收率
      - - 直接前驱体合成
        - 将混合金属溶液直接转化为 pCAM 前驱体
        - 专利化操作诀窍和配方控制
        - pCAM 满量扩产尚无公开验证
      - - 微结构工程
        - 按客户规格调控元素晶体结构和颗粒行为
        - 客户认证反馈和工艺控制精度
        - 公开数据未显示定制化在多种化学体系中的表现
      - - 产品后处理和认证
        - 向电池供应链交付 NMC 前驱体粒径和技术级 Li2CO3
        - 下游电池制造商认可和质量测试
        - 详细认证标准和拒收率未公开
      - - 设施规模架构
        - Base 1 处理 30,000 MT/year 入料并回收 3 kiloton/year 锂；Apex 1 原计划用于 pCAM 扩产
        - Apex 1 成功完成资本到位
        - 破产和资助流失如今威胁 Base 1 向 Apex 1 交接的原定路径
    notes: 架构依据公开流程描述，而不是工厂 P&ID；缺口在良率、成本、开工率，以及按破产情景调整后的规模假设。
