      - number: '3.3'
        title: 切换成本、多供应商并用与分销权力
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，电池回收不是简单现货市场。原料收集、危险品物流、黑粉转化、下游精炼和产出认证共同形成复合切换成本。Ascend 自己披露的关系就能看出这一点：Honda 被定位为闭环回收材料客户，Trafigura
              则为多年期碳酸锂包销提供全球营销和物流。Li-Cycle 的 DOE 支持项目同样依托供应协议和辐条—枢纽布局，说明收集和路由能力是产品的一部分，不是附带服务。Redwood 的优势尤其体现在分销上：它结合具名
              OEM 和产业伙伴、两个美国园区以及当前材料处理量，使买方更难用单一较小规模替代方取代它。多供应商并用在入口和合规层最可行，因为 Cirba/Retriev、Redwood、Li-Cycle 历史辐条网络和
              ABTC 都营销电池处理或加工。一旦客户需要合格的电池级产出或整合式 pCAM/CAM 供应，多供应商并用就更难，可信替代集合会明显收窄。RecycLiCo
              的现场模块化叙事值得注意，因为它提供了另一条路：买方不在中心化回收商之间切换，而是尝试把更多闭环环节内化。
