  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代选项
        blocks:
          - type: paragraph
            body: >-
              Ascend 面对的竞争，不是单一同类公司，而是电池制造商或 OEM 解决同一任务的几条不同路径。最接近的直接同行是 Redwood Materials：它把回收和关键材料生产结合起来，有具名 OEM
              和产业伙伴，并公开披露了明显大于 Ascend 的当前处理量和资本获取能力。Umicore 是最清楚的存量替代者，因为它把正极材料、负极材料和电池回收放在一个长期存在的工业平台内。Li-Cycle 在 2026
              年 5 月作为独立竞争者的重要性较低，因为其官网和 Glencore 页面都显示公司已在 2025 年 8 月被收购，尽管 DOE 页面仍记录着历史上的辐条—枢纽扩建逻辑和 $475 million
              Rochester 贷款。Retriev 目前通过 Cirba Solutions 呈现，主要在收集、处理广度和设施网络上竞争；RecycLiCo 和 ABTC
              则代表湿法路线挑战者，主打高回收率和闭环定位，但公开可见的规模化客户获取证明较少。现状替代方案仍是购买合格原生材料或成熟精炼商材料，而不是通过回收商闭环；潜在进入者包括决定把更多回收环节内化的电池制造商，或采用现场模块化系统的玩家。
