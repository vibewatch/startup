  evidenceGaps:
  - type: missing-source
    severity: high
    topic: TU003 named customer proof coverage gap and unnamed top customers
    missingEvidence: Public materials do not identify the major U.S. pCAM customer or the leading global automaker behind the nearly $1B supply contract.
    whyItMatters: Without customer names, investors cannot test concentration, reference quality, procurement status, or whether one buyer dominates future revenue.
    diligencePath: Request a top-10 customer and backlog schedule under NDA, including customer names, product line, annual volume, and termination rights.
    relatedQuestionRefs:
    - QU007
    - QU017
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: high
    topic: Retention, churn, and contract durability
    missingEvidence: No retained source discloses NRR, GRR, logo churn, renewal rates, or standard term lengths across recycling, pCAM, CAM, or lithium carbonate customers.
    whyItMatters: This chapter can prove named counterparties, but it cannot underwrite customer lifetime value or renewal durability from public evidence alone.
    diligencePath: Request retention dashboards, contract-term templates, top-customer renewal history, and any cancellation or deferral logs by product line.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
  - type: missing-source
    severity: high
    topic: Retention cohort figure
    missingEvidence: No public source provides time-bucketed retention percentages for any named Ascend customer cohort.
    whyItMatters: The planned cohort figure cannot be populated honestly without inventing data, so the current figure uses nulls to document the gap.
    diligencePath: Request cohort tables by contract vintage for Honda, Koura, Trafigura, Freudenberg, and unnamed large OEM or battery buyers.
    relatedQuestionRefs:
    - QU022
  - type: missing-source
    severity: medium
    topic: Post-filing customer contract status
    missingEvidence: Public coverage says customer commitments continue, but retained sources do not include cure schedules, amended contracts, or customer-by-customer purchase-order status after the Chapter 11 filing.
    whyItMatters: Customer confidence risk depends on which contracts remain active, which were delayed before filing, and whether any counterparties are re-sourcing volumes.
    diligencePath: Review first-day motions, key customer cure notices, open purchase orders, and any commercial amendments signed after April 9, 2026.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
