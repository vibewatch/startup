- id: u603
  title: Durability, concentration, and Chapter 11 are the core customer diligence risks
  body: The public record gives almost no classic customer-health metrics. There is no disclosed NRR, GRR, churn, renewal rate, or revenue concentration by top account. The only named counterparty with explicit public time terms and quantity is Trafigura, whose agreement covers 15,000 metric tons from 2027 to 2031. Honda’s 2023 basic agreement and Freudenberg’s 2024 shipment are meaningful, but neither comes with disclosed contracted volumes or renewal mechanics. Risk rose materially in 2025, when Ascend said CAM demand no longer justified the canceled DOE grant and trade coverage later reported that major customers had pushed back pCAM deliveries by 12 to 18 months. The April 2026 Chapter 11 filing adds another layer of procurement friction because qualification-heavy supply chains depend on confidence in continuity, working capital, and execution. Management and trade coverage both say customer commitments remain in place, which is directionally helpful; however, the market still lacks
    the documents that would show which contracts are truly durable, which purchase orders are open, and whether any leading customers are renegotiating, deferring, or re-sourcing volumes. In practice, this means customer diligence should not stop at counting logos. It should test whether any large counterparty added credit protections, shortened payment terms, delayed qualification work, or demanded alternative supply after the filing. The combination of customer pushbacks before bankruptcy and continuity assurances after bankruptcy is exactly the kind of mixed signal that requires direct reference calls and document review rather than management narrative alone.
