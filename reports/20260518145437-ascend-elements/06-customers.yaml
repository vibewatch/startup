      label: Qualification with named counterparty
      detail: Materials are evaluated by OEM, materials, or battery-system counterparties such as Honda, Koura, or Freudenberg.
      tone: warning
    - id: j4
      label: Contract or offtake execution
      detail: Deals range from a basic agreement to explicit tonnage offtakes and validation shipments.
      tone: positive
    - id: j5
      label: Deployment into downstream chain
      detail: Materials enter EV, electrolyte, or heavy-duty battery applications through direct buyers or channels like Trafigura.
      tone: positive
    - id: j6
      label: Expansion / renewal / pause
      detail: Programs can expand into larger supply agreements or slow because of delivery pushbacks, financing concerns, or Chapter 11 risk review.
      tone: warning
