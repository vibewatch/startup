- id: u602
  title: Named proof is strongest on counterparties and contract milestones, weaker on scaled outcomes
  body: 'The named proof set is credible enough to show that Ascend is not selling a purely hypothetical product. Honda is the best reference because the collaboration appears on Honda’s own newsroom site and the 2023 announcement explicitly builds on the 2021 recycling relationship. Koura is the clearest named battery-materials customer: Ascend publicly committed to supply up to 5,000 metric tons of recycled lithium carbonate annually, and both press-release and trade coverage describe Koura’s intended use in electrolyte materials. Trafigura is the clearest multiyear offtake anchor, with a disclosed 15,000-metric-ton agreement spanning 2027 through 2031. Freudenberg e-Power Systems / XALT gives Ascend a shipped-material reference in a commercial-vehicle battery application, but the company itself says the shipment is small relative to the intended full-scale program. That distinction matters: public proof is strongest on named counterparties and signed milestones, but much weaker on recurring
    shipped volumes, production utilization, or repeated follow-on orders. Even the largest publicly described pCAM and automaker contracts remain unnamed, so proof of demand is real while proof of customer breadth is still incomplete.'
