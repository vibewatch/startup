tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / strategic value
  - gap
  rows:
  - - OEM recycling + procurement counterpart
    - Honda / American Honda is buyer and payer for recycling services; Honda is intended downstream user and potential payer for recycled nickel, cobalt, and lithium
    - Recycle Honda and Acura EV batteries, then feed recycled materials back into North American EV supply chain
    - Strongest OEM proof; relationship starts in 2021 and expands into 2023 procurement collaboration
    - No disclosed tonnage, pricing, or contract duration
  - - Battery-materials customer
    - Koura buys and pays; Koura uses the recycled lithium carbonate inside electrolyte materials for battery supply chains
    - Use recycled lithium carbonate to make LiPF6 and other battery materials in U.S. and Europe
    - Up to 5,000 metric tons annually; named demand-side buyer with explicit use case
    - Start cadence, pricing, and renewal mechanics are not public
  - - Channel / offtake counterparty
    - Trafigura buys and pays; Trafigura distributes to its global customer base; downstream OEM and battery customers are not named
    - Market and distribute recycled lithium carbonate across North American and European battery supply chains
    - 15,000 metric tons over 2027-2031; strongest public duration disclosure
    - Downstream end customers and margin split remain opaque
  - - Battery application validator
    - Freudenberg e-Power Systems / XALT is user and likely payer inside a heavy-duty battery program
    - Validate and launch recycled cathode materials in heavy-duty battery applications
    - Named shipment and technical validation proof in 2024
    - Shipment size and conversion to recurring program volume are undisclosed
  - - Large unnamed battery customer
    - Buyer / user / payer not publicly identified
    - Use sustainable pCAM in a major U.S. battery manufacturing process
    - Approx. $1 billion multiyear contract with option to expand to up to $5 billion
    - Identity is hidden, so concentration and reference quality cannot be verified
  - - Broader OEM and battery-manufacturer service segment
    - Ascend says OEMs and battery manufacturers use its logistics, materials tracking, recycling, and engineered materials offering
    - Feedstock intake plus pCAM / CAM / Li2CO3 sales
    - Supports the thesis that Ascend sells into several points of the battery chain, not one motion only
    - Public sources do not disclose logo count, segment mix, or revenue share
  notes: Segmentation is organized by role in the battery supply chain rather than by logo count because buyer, user, and payer often differ.
