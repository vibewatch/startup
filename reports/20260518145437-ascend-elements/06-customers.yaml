- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Closed-loop OEM model with Honda
    - Public OEM proof is heavily concentrated in one named automaker
    - If Honda slows or limits procurement, Ascend loses its strongest OEM reference and credibility anchor
    - Request tonnage commitments, qualification stage, and any follow-on Honda programs beyond the 2023 basic agreement
  - - Koura electrolyte-material demand
    - One named battery-materials buyer can dominate early lithium carbonate demand visibility
    - A single downstream chemistry buyer could shape ramp timing and working-capital needs
    - Request shipped volumes, inventory commitments, and customer concentration by product
  - - Trafigura channel expansion
    - Channel partner dependence reduces visibility into end-customer mix and may compress margin
    - Ascend can show offtake volume without proving diversified end-user adoption
    - Request downstream placements, pricing waterfall, and exclusivity terms
  - - Freudenberg heavy-duty validation
    - Validation success does not guarantee scaled recurring orders
    - Narrative momentum could outrun revenue realization if the program does not convert
    - Request SOP timing, annual volume plan, and acceptance gates at XALT
  - - Unnamed major U.S. customer and unnamed automaker contract
    - Unidentified top accounts prevent any rigorous public concentration analysis
    - A large share of backlog may sit with one or two hidden buyers
    - Request top-5 customer backlog, revenue share, and contract names under NDA
  - - Chapter 11 plus delivery pushbacks
    - Procurement committees may delay awards, re-bid volumes, or tighten credit terms
    - Customer confidence can erode precisely when Ascend needs long-duration qualification programs to convert
    - Request customer-contact log, contract amendments after filing, and any counterparties that paused purchases
  notes: The main risk is not lack of named logos; it is the inability to quantify how much economics sit behind each one.
