evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Post-money valuation per financing round, any secondary transaction pricing, and current restructuring-era equity
      valuation are not publicly disclosed.
    whyItMatters: >-
      Without a disclosed valuation ladder, investors cannot reconcile dilution, mark-to-market downside, or recovery
      prospects against the more than $1.1 billion of announced capital.
    diligencePath: >-
      Request the financing history, 409A or board valuation materials, and the latest restructuring cap-table
      waterfall.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      Current employee and contractor headcount by site and function is not publicly available in retained chapter
      sources.
    whyItMatters: >-
      Headcount is a core indicator of operating scale, burn, and whether Ascend retained enough technical and plant
      talent to restart growth under court supervision.
    diligencePath: >-
      Request an org chart, payroll snapshot, and post-filing headcount plan from management or the restructuring data
      room.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: lawsuits
    missingEvidence: >-
      Public sources reference Apex 1 construction lawsuits but do not identify each case, counterparty, claim amount,
      or procedural status.
    whyItMatters: >-
      Litigation could materially affect project economics, unsecured claims, and the feasibility of any restart or sale
      of Apex 1 assets.
    diligencePath: >-
      Pull Kentucky and federal dockets, compile complaint captions and claim amounts, and reconcile them against the
      bankruptcy schedules.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
