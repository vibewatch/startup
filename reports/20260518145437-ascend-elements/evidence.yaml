      publicly disclosed for any major round.
    whyItMatters: >-
      The Chapter 11 outcome will depend heavily on who controls the capital structure and which parties sit senior to
      common equity.
    diligencePath: Request the cap table, debt schedule, major investor side letters, and restructuring term sheets.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: bankruptcy-outcome
    missingEvidence: >-
      No retained chapter source disclosed a confirmed restructuring plan, stalking-horse buyer, or final emergence
      outcome as of May 17, 2026.
    whyItMatters: >-
      The difference between reorganization, asset sale, and liquidation will determine whether commercial contracts and
      technology assets retain investable value.
    diligencePath: >-
      Monitor bankruptcy court filings, Kroll notices, and future company or buyer announcements for plan milestones and
      sale motions.
  - type: private-evidence-only
    severity: material
    topic: Ascend-specific SAM and SOM after bankruptcy
    missingEvidence: >-
      Public sources establish broad market growth but do not disclose a court-adjusted pipeline, retained customer
      volumes, or revised plant economics for Ascend after the April 2026 petition.
    whyItMatters: >-
      Without a bottom-up view of surviving contracts and output assumptions, any company-specific SAM or SOM would be
      more model fiction than sourced diligence.
    diligencePath: >-
      Request post-petition operating plan, customer-retention schedule, revised plant ramp, and bankruptcy-court
      materials describing expected commercial output by facility.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: Post-petition production volume and backlog
    missingEvidence: >-
      Retained sources say operations continue, but they do not disclose current production, plant utilization, customer
      backlog, or whether the pre-petition offtakes remain fully intact under court supervision.
    whyItMatters: This is the single biggest gap between a real market and realizable near-term revenue for Ascend.
    diligencePath: >-
      Obtain debtor operating reports, plant-level throughput data, revised backlog, and any disclosed amendments to
      commercial contracts during the Chapter 11 process.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: Contract pricing and minimum-volume economics
    missingEvidence: >-
      Public sources confirm the existence of Trafigura, Honda, and major-automaker relationships, but they do not
      disclose pricing formulas, minimum take-or-pay terms, margin floors, or default rights.
    whyItMatters: >-
      Contract economics determine whether Ascend's technical and policy positioning ever translated into durable cash
      generation.
    diligencePath: >-
      Review executed commercial agreements or redacted summaries showing pricing, volume commitments, product specs,
