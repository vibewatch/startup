  title: Thesis / Anti-Thesis Table
  columns:
  - Pillar
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Historical strategic relevance
    - Battery recycling and pCAM remain strategically important to domestic supply chains
    - Strategic relevance did not stop Chapter 11 or DOE withdrawal
    - Funded emergence plan and signed customer recontracting
  - - Capital access
    - Ascend previously attracted large private and public funding pools
    - That history now implies a crowded stack and potential dilution rather than easy refinancing
    - Priority-protected new capital and transparent waterfall
  - - Comparable read-through
    - Redwood proves capital still flows to differentiated survivors
    - Li-Cycle and Ascend show the category destroys equity before scale if execution slips
    - Demonstrated restart milestones and cleaner unit economics
  - - Asset upside
    - Apex and Covington could still hold strategic asset value for a buyer
    - Paused construction, litigation, and policy loss reduce standalone negotiating power
    - A signed stalking-horse or strategic bid with disclosed economics
  notes: This table intentionally contrasts strategic option value with the current legal and financing reality; the swing factors are mostly non-public today.
