- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Post-petition financing
    - DIP, cash-collateral, and runway budget
    - Determines whether the company survives long enough to preserve optionality
    - Pull full docket and review financing orders or term sheets
  - - Capital structure and waterfall
    - Lien priority, secured claims, and recovery stack
    - Any new money may sit behind existing claims
    - Request counsel summary and creditor hierarchy
  - - Apex completion budget
    - Updated capex, schedule, and contingency after grant loss and litigation
    - Without this the base case is guesswork
    - Request board-approved project budget and critical path
  - - Customer contracts
    - Volume, pricing, start dates, and change-of-control provisions
    - Needed to test whether restart economics are still bankable
    - Request amended offtake schedule and model assumptions
  notes: These asks are intentionally narrow and gating; without them the public evidence supports monitoring or special-situations research, not a plain-vanilla investment decision.
