- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Court process degrades
    - No funded emergence path, no buyer, or major milestone slippage
    - Recovery value compresses and financing leverage worsens
    - Move to liquidation-only underwriting
  - - Replacement capital is punitive
    - New money arrives only at extreme dilution or junior economics
    - Historical private marks become irrelevant
    - Avoid common-equity exposure
  - - Apex remains paused
    - Restart misses refreshed schedule or capex reopens materially
    - Any operating upside is deferred beyond useful underwriting horizon
    - Treat the plant as distressed inventory, not a growth asset
  - - Customer economics deteriorate
    - Further shipment delays or no visibility on pricing / volume
    - Revenue assumptions and margin expectations fall apart
    - Cut bull and base scenarios toward bear
  notes: These are public-monitorable triggers that should force a thesis rewrite, not fine-grained internal KPI thresholds.
