- id: public-comps
  title: Comparable Set and Market Context
  body: 'The comp set is cautionary. Umicore is the best upper-end public benchmark because it is a scaled, diversified incumbent with current investor materials and a May 2026 market capitalization around $7.05 billion. ABAT provides a much smaller speculative public reference at roughly $0.39 billion. Li-Cycle is the most important downside analogue: a public recycler that moved through CCAA and Chapter 15 before being sold to Glencore. Redwood Materials is the counterexample, showing that the market still pays premium valuations for category survivors with momentum, diversified optionality, and fresh capital. Those references matter less as direct multiples and more as bounds. They show that Ascend cannot fairly claim Redwood-like venture pricing today and should instead be triangulated between distressed-asset logic and the public values of functioning peers. The useful lesson from the comp set is not a single multiple; it is that capital markets reward solvency, execution credibility,
    and diversification, while they heavily punish paused projects and opaque restructuring paths.'
