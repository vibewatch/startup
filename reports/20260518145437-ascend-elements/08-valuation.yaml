- id: exit-and-diligence
  title: Exit Readiness and Final Diligence Asks
  body: Ascend is not exit-ready for an IPO, and the most realistic exits are a strategic asset sale, a court-approved reorganization, or rescue financing with explicit priority protections. That makes diligence much narrower than in a normal private-company round. Investors need to know who controls the process, how much cash is left, what claims sit ahead of them, whether the plant can be completed on a revised budget, and whether customers will still take the product on bankable terms. Until those questions are answered, the right posture is research-more only for special-situations investors and avoid for standard venture or growth-equity buyers. The missing evidence is not cosmetic; it is exactly the information that separates a recoverable restructuring from a value trap. Until those items are disclosed, the proper comparison is to a restructuring workstream or special-situations case file, not to a conventional late-stage venture financing memo.
