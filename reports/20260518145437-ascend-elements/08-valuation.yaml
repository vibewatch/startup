- id: scenario-analysis
  title: Bull / Base / Bear Scenarios
  body: 'The scenario distribution skews negative because each constructive outcome requires multiple dependent fixes. The bull case assumes funded emergence, a credible Apex restart, and customer recontracting that restores a bankable growth path. The base case assumes a long restructuring with some restart optionality but a valuation well below the 2023 mark. The bear case assumes liquidation or a sale process that largely benefits senior claimants. Commodity context matters, but mostly as a second-order amplifier. Lithium and black-mass pricing can help a functioning recycler, yet they cannot overcome a broken capital structure on their own. Public evidence therefore supports a conservative range framework where ordinary-equity buyers have little margin of safety while special-situations capital might still find a structured opportunity. That is why the scenario table is framed in recovery-value terms instead of revenue multiples: the decisive variables are emergence, capex completion,
    and priority structure, not just long-run category growth.'
