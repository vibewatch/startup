- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric / status
  - Valuation / public signal
  - Relevance
  - Limitation
  rows:
  - - Redwood Materials
    - Private battery-recycling / cathode platform with fresh Series E funding
    - '> $6B post-money in 2025-2026 financings'
    - Shows what the market pays for a category survivor with fresh momentum
    - Private-company premium includes growth optionality Ascend no longer has
  - - Umicore
    - Scaled public incumbent in battery materials and recycling
    - $7.05B market cap in May 2026
    - Upper-bound public comp for a diversified, profitable incumbent
    - Not a like-for-like startup or distressed asset
  - - American Battery Technology Company
    - Subscale public battery-materials platform
    - $0.39B market cap in May 2026
    - Useful small-cap public reference for speculative battery-materials equity
    - Still not in Chapter 11 and not directly comparable on asset mix
  - - Li-Cycle
    - Former public recycler restructured through CCAA / Chapter 15 and sold to Glencore
    - Distress precedent rather than clean market-cap comp
    - Most relevant downside analogue for a capital-intensive recycler
    - Outcome reflects legal process and sale terms more than a normal trading multiple
