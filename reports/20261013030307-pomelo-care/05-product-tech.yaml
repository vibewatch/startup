callouts:
  - calloutType: "insight"
    title: "Dose-Response Dynamic in Virtual Maternal Care"
    body: "Peer-reviewed findings from SMFM 2026 indicate that clinical impact compounds over time, with preterm birth reductions expanding from 11.0% at one month to 24.4% at three or more months of prenatal engagement. This suggests that earlier patient onboarding is critical to maximizing clinical and financial returns."
    claimRefs:
      - "CE005"
      - "CE010"
  - calloutType: "risk"
    title: "HIE Interoperability and Clinical Labor Intensity"
    body: "Pomelo's technical workflow relies heavily on external Health Information Exchange ingestion and responsive provider teams. Any delays in external data integration or clinician staffing constraints could impair the platform's ability to maintain its sub-5-minute triage window and early complication detection."
    claimRefs:
      - "CE004"
      - "CE008"
      - "CE015"
