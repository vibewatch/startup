        - Commercially insured pregnant women, infants, and working mothers
        - Virtual obstetrics, midwifery, nutrition counseling, and NICU reduction
        - High commercial reimbursement spend; delivers 3-5x documented medical cost ROI
        - Exact fee-for-service vs capitation contract structure undisclosed
      - - Medicaid Managed Care (MCOs)
        - State Medicaid plans and managed care entities (e.g., Healthy Blue, Nebraska Total Care)
        - Medicaid-eligible mothers, underserved populations, rural maternity care deserts
        - 24/7 multimodal virtual access, hypertension monitoring, social determinant support
        - Substantial volume of covered lives; directly addresses high maternal mortality rates
        - Impact of Medicaid eligibility redeterminations on member churn unquantified
      - - Self-Insured Enterprise Employers
        - Corporate benefits leaders and self-insured employers (e.g., Koch Industries)
        - Employees and dependents planning pregnancy, postpartum, or pediatric care
        - Turnkey family benefit, lactation counseling, mental health, and midlife healthspan
        - Enhances employee retention and productivity; reduces costly preterm complications
        - Proportion of employer-direct revenue relative to payer contracts undisclosed
      - - Academic Health Systems & Providers
        - Health system leadership and OB-GYN departments (e.g., Penn Medicine, Mount Sinai)
        - Patients requiring continuous monitoring between in-person clinical visits
        - Collaborative outpatient monitoring, high-risk triage, and OB co-management
        - Clinical peer validation and bidirectional referral trust across hospital networks
        - Commercial revenue-sharing terms with hospital partners remain unconfirmed
