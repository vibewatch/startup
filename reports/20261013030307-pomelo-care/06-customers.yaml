    title: Dose-Response Evidence Creates Payer Retention Moat
    body: >-
      Peer-reviewed SMFM findings demonstrating that maternal risk reductions compound with engagement duration (from an
      11.0% preterm birth reduction at month one to 24.4% at three months) provide Pomelo with unique quantitative
      defense during health plan contract renewals.
    claimRefs:
      - CU008
      - CU009
      - CU010
