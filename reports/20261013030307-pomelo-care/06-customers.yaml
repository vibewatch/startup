figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer journey from payer/employer onboarding through 24/7 multimodal virtual clinical engagement and
      longitudinal postpartum retention.
    approximationNotes: Synthesized from Pomelo Care care delivery workflows and health plan integration specifications.
    data:
      items:
        - label: 1. Eligibility Verification
          touchpoints: Two-minute digital health plan or employer eligibility intake
        - label: 2. Predictive Risk Stratification
          touchpoints: Automated predictive analytics and claims data ingestion to flag maternal risk
        - label: 3. Care Team Assignment
          touchpoints: Dedicated nurse care partner, midwife, OB-GYN, dietitian, and therapist assigned
        - label: 4. Active Pregnancy Management
          touchpoints: 24/7 multimodal communications via SMS, phone, video, and remote blood pressure monitoring
        - label: 5. Labor & NICU Transition
          touchpoints: Coordination with in-person delivery hospital and 24/7 NICU family navigation
        - label: 6. Longitudinal Extension
          touchpoints: One-year postpartum pediatric care and transition into perimenopause/midlife programs
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU012
callouts:
