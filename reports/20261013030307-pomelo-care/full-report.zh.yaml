  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链支持继续尽调，但尚不足以形成有价格支撑的投资建议。
    data:
      nodes:
        - id: financing-mark
          label: $1.7B 投后融资估值
          detail: 2026 年 1 月的 Series C 提供当前优先股轮次参考。
        - id: distribution
          label: 庞大的资格覆盖范围
          detail: 公司报告覆盖人数超过 25M，而非活跃患者数。
        - id: clinical-proof
          label: 有希望的理赔证据
          detail: 公开结果显示参与时间越长，结果越好，但研究设计是观察性的。
        - id: operating-gap
          label: 缺少运营分母
          detail: 收入、利润率、留存、烧钱速度、集中度和参与转化率均未披露。
        - id: liquidity-gap
          label: 没有观察到市场价格
          detail: Forge 报告活动有限，且没有可用的 Forge Price。
        - id: recommendation
          label: 继续研究
          detail: 将估值和目标回报建立在经核实的非公开证据与进入条款上。
      edges:
        - from: financing-mark
          to: distribution
          label: 为预期规模定价
        - from: distribution
          to: clinical-proof
          label: 需要持续参与
        - from: clinical-proof
          to: operating-gap
          label: 未揭示经济性
        - from: operating-gap
          to: liquidity-gap
          label: 阻碍价格三角验证
        - from: liquidity-gap
          to: recommendation
          label: 强制执行进入纪律
    approximationNotes: 仅为定性逻辑；该流程不代表任何数值转化率、估值倍数或概率。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV013
      - CV016
