        - label: 3. 照护团队分配
          touchpoints: Dedicated nurse care partner, midwife, OB-GYN, dietitian, and therapist assigned
        - label: 4. 积极孕期管理
          touchpoints: 24/7 multimodal communications via SMS, phone, video, and remote blood pressure monitoring
        - label: 5. 分娩与 NICU 过渡
          touchpoints: Coordination with in-person delivery hospital and 24/7 NICU family navigation
        - label: 6. 长期延伸
          touchpoints: One-year postpartum pediatric care and transition into perimenopause/midlife programs
