      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据无法证明公司已具备退出准备度，也无法支持目标回报。Forge
              将市场活跃度描述为有限，且未显示匹配价格；其自身披露也提醒，私募证券具有高度投机性且流动性差。在评估新一轮融资或二级购买之前，投资人应将经审计财务报表与合同层面的收入对账，以覆盖生命为分母检验活跃注册和持续参与，按付款方审查续约与集中度，并建模完全摊薄后的资本结构和清算瀑布。投资论点的破坏性触发因素应包括：无法在不同付款方队列中复现结果、从符合资格到持续护理的转化疲弱、续约证据不利，或融资条款让新资本处于次级且没有相应的入场折价。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV013
