      - number: '4.2'
        title: 成本结构、毛利率驱动因素与服务交付
        blocks:
          - type: paragraph
            body: >-
              不同于纯软件数字导航供应商，Pomelo Care 是一家全栈虚拟医疗机构，成本结构高度依赖人力。公司全天候配置多学科临床团队，包括妇产科医生、认证护士助产士、护士、营养师和儿科专家，通过短信、视频和电话持续提供
              24/7 护理。此外，Pomelo 收购 The Doula Network 后，将社区线下导乐护理纳入服务包，引入了直接的线下人力成本和持证服务提供方网络开销。这种临床交付模式带来较高的医疗人员直接薪酬、覆盖
              46 个司法辖区的州级执照合规费用以及医疗事故保险负债，结构性地将毛利率压低至典型软件行业基准以下。要覆盖这些高昂的服务交付费用，公司必须获得大规模支付方风险合同；其目标市场是每次 NICU 住院超过 7.6
              万美元、每年早产分娩支出 260 亿美元的全国孕产医疗费用池。
