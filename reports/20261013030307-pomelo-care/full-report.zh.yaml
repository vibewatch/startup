      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 严格的临床验证与支付方协同
            body: >-
              Pomelo Care 不靠表层数字医疗应用的叙事，而是把商业推介建立在同行评审的理赔数据上 [CO008]。与 Penn LDI 的独立学术合作显示，孕期参与服务三个月或以上，可使早产率下降
              24.4%，NICU 住院时长缩短超过 26% [CO008]，直接为覆盖超过 2500 万人的健康计划带来经济节省 [CO006]。
            calloutType: strength
            claimRefs:
              - CO006
              - CO008
          - type: callout
            title: 17 亿美元估值下的财务信息不对称
            body: >-
              Pomelo 通过 Stripes 领投的 9200 万美元 Series C 达到独角兽地位 [CO002]，但对 GAAP 收入、经营利润率、客户集中度和现金消耗严格保密 [CO014]。GetLatka
              等第三方估算的 1.276 亿美元数字仍属推测 [CO013]，潜在投资者只能依靠私下尽调来验证增长是否足以支撑这一估值倍数 [CO014]。
            calloutType: risk
            claimRefs:
