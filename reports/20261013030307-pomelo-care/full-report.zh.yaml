      - number: '5.4'
        title: 差异化、合规控制与运营风险
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 的主要竞争差异来自全职多专科临床团队、价值型支付方整合和专有临床风险识别引擎。不同于市场目录、交易型远程医疗门户或自助孕期追踪应用，Pomelo
              与支付方伙伴共同对患者长期结果承担临床责任。为处理州 Medicaid 项目和雇主健康计划中的受保护健康信息（PHI），Pomelo 保持经验证的行政和技术防护措施，持有 SOC 2 Type II
              认证并执行严格的 HIPAA 合规控制。不过，技术和运营风险仍然明显。平台的预警能力高度依赖第三方 HIE 数据流和支付方理赔集成的及时性与完整性，而这些来源常受延迟或电子记录格式不完整影响。此外，Pomelo
              软件组件的独立架构基准测试和算法审计尚未公开，因而自动化在多大程度上能够脱离临床人力成本扩展，仍是尽调缺口。
            claimRefs:
              - CE007
              - CE008
              - CE013
              - CE015
      - number: '5.5'
        title: 展示项
        blocks:
