      - number: '6.4'
        title: 持久性、留存动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管临床疗效已有证明、全国覆盖人数持续增长，Pomelo Care 仍面临企业医疗签约固有的商业持久性和客户集中度风险。虚拟护理采购竞争拥挤，Tracxn 的行业分析师追踪到 1048
              家以上活跃虚拟医疗竞争者，其中包括 115 家已获融资实体，以及 Ro、One Medical 和 HealthTap 等资本充足的服务提供方，它们都在争夺支付方和雇主的关注。此外，Pomelo
              尚未公开披露关键客户留存指标，包括净收入留存率（NRR）、毛收入留存率（GRR）、多年合同续签率或年度客户流失率。Forge Global 的二级市场交易显示流动性有限，没有公开的股票清算价格，体现出 IPO
              前的不透明。由于健康计划签约通常会把大量覆盖人数集中在少数大型全国保险公司（如 Elevance 和 Centene 旗下公司），任何一个关键支付方流失或重新谈判合同，都会给 Pomelo
              的商业规模带来重大风险。评估多年队列留存和收入集中度，仍是判断长期商业持久性的首要尽调任务。
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 剂量—反应证据形成支付方留存壁垒
            body: SMFM 的同行评审结果显示，孕产风险降幅会随参与时长累积：从第一个月早产率下降 11.0%，扩大到三个月时下降 24.4%。这为 Pomelo 在健康计划合同续签时提供了独特的量化防御。
            calloutType: insight
            claimRefs:
              - CU008
              - CU009
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览与威胁结构
        blocks:
          - type: paragraph
            body: >-
              在 17 亿美元 Series C 估值下评估 Pomelo Care，需要在有吸引力的临床结果指标与医疗交付固有的严重交易对手、监管和人力风险之间取得平衡。公司于 2026 年 1 月新增股权融资 9200
              万美元，使披露的累计融资达到 1.71 亿美元，并提供预计可维持多年的运营跑道。不过，Pomelo 存在明显的结构性依赖：其商业引擎依靠覆盖 2500 万人的商业和 Medicaid
              业务中健康计划的价值型报销。如果无法持续证明早产或急诊就诊次数确实下降，公司将面临价值型回拨或合同不续签的下行风险。此外，私募二级市场数据表明，Series C 优先股带有 1.0x
              非参与型清算优先权，这种悬置结构需要估值持续大幅增长，普通股持有人才能收回资本。在缺乏经审计财务报表的情况下，投资者必须把合同持久性和临床人力通胀视为核心风险向量。
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR011
              - CR014
      - number: '7.2'
        title: 监管、法律与执照风险
        blocks:
          - type: paragraph
            body: >-
              运营全国性的虚拟孕产和女性医疗平台，会引入复杂的跨州监管摩擦，而且摩擦会随着地理覆盖扩张直接放大。Pomelo Care
              雇用包括医生、认证护士助产士、注册护士和治疗师在内的多学科临床团队；他们必须分别持有各州执照，并遵守各州不同的执业范围和医生监督规定。为应对州级医疗执业公司法原则，Pomelo
              必须维持彼此隔离的专业公司和行政服务协议；如果州监管机构或医疗委员会质疑实体治理，公司就会暴露于法律风险。Pomelo
              将虚拟护理平台定位为线下产科医生和助产士的补充，而不是实体诊所的替代品，因此急性孕产紧急情况中的临床协作失误，会带来持续的医疗事故责任风险。此外，与健康计划伙伴双向整合行政理赔数据，需要严格遵守 HIPAA
              隐私标准和州医疗隐私法律；数据泄露或未授权访问可能触发严厉的法定处罚，并立即导致支付方终止合同。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 运营执行、临床护理质量与平台安全
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 的运营可靠性取决于能否全天候提供多专科临床服务，并将响应时间中位数控制在五分钟以内。要在 2500
              万覆盖会员中维持这一严格服务水平，需要大量临床人员和灵活的排班，这让业务暴露于临床工资上涨和服务提供方倦怠风险。临床失败模式的下行风险严重：孕产相关并发症可能迅速恶化，任何虚拟分诊延迟、通信中断或遗漏风险信号，都可能造成不良围产结局、NICU
              住院，甚至死亡。技术基础设施上，Pomelo 正在开发和部署人工智能工具，用于自动化文档处理并辅助临床决策工作流。AI
              集成旨在提升服务提供方杠杆，但也引入模型幻觉、诊断偏差和未监控提示词漂移等潜在失败模式，可能损害临床判断。确保严格的同行评审临床验证，并维持冗余的临床升级协议，是不可妥协的运营要求。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: 伙伴依赖、支付方集中度与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 商业模式的韧性，根本上取决于它与一批高度集中的商业健康险计划、Medicaid 管理式医疗组织和自保雇主之间的关系。由于 Pomelo
              为受保成员提供零自付费用的护理，收入完全依赖付款方合作合同、企业客户留存，以及基于价值的风险结算。如果某个核心健康险计划重新谈判按服务收费的费率、调整共享节省基准，或将线上孕产导航服务收回内部运营，Pomelo
              的营收会立即承压。与此同时，公司正从聚焦孕产护理转向覆盖儿科、激素健康和中年健康周期的综合项目，这会带来显著的临床执行风险。扩大临床范围会分散运营重点、压紧专业人员配置，也迫使 Pomelo
              直接面对成熟的单点解决方案和传统医疗服务网络。在客户流失率和经审计的单位贡献利润率尚未披露的情况下，投资判断必须明确测试付款方重新签约和试点转化延期等压力情景。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 投资判断警示：付款方价值合同集中，临床人员工资上涨
            body: Pomelo Care 的经济性取决于证明净成本节省，并在 2,500 万受保生命中维持 24/7、多学科的响应速度。如果付款方合同出现追索，或临床人员成本激增，经营利润率将受到严重挤压。
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
              - CR014
          - type: callout
            title: 尽调重点：审计付款方合同续约率和结果结算条款
            body: 在评估后期融资或二级交易之前，投资人必须审计 Pomelo Care 的付款方续约率、医疗损失率共享节省的结算机制，以及跨州临床人员资质合规情况。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR006
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场立场
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 值得继续尽调，但还不足以支持不计价格的投资建议。正面逻辑包括规模可观的签约分销覆盖、据报道的临床结果关联，以及面向付款方的价值主张。限制在于：2026 年 1
              月的融资估值可见，但判断其合理性所需的经营分母不可见；指定来源没有提供经审计的收入、毛利率、留存、烧钱、活跃患者转化率或客户集中度。这种不对称支持“继续研究”的建议，置信度中等、风险评级高，估值立场偏紧。因此，入场纪律应建立在已验证的经营和资本结构证据上，而不是只看本轮估值。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
