chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与核心使命
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 是一家以证据为基础的虚拟医疗护理平台，处在孕产妇、婴儿与女性医疗的交汇处 [CO001]。医疗科技高管 Marta Bralic Kerns 于 2021 年创立公司，Pomelo
              Care 总部位于纽约市，成立初衷是应对美国孕产妇和婴儿健康结果中的系统性短板 [CO001]。不同于依赖健康追踪或异步教育内容的传统消费级数字医疗应用，Pomelo
              作为持牌临床服务提供方，由专门的多专科医疗团队提供 24/7 个性化护理 [CO007]。其临床模式整合医生、助产士、护士、治疗师、营养师和导乐，并与线下产科医生及儿科医生协作，补上常规就诊之间的护理缺口
              [CO005, CO007]。Pomelo 与主要商业支付方、Medicaid 健康计划及大型雇主合作后，已将合同覆盖范围扩展至全国 2500 多万人
              [CO006]。平台覆盖整个生育生命周期，包括备孕与生育指导、孕期监测、产后恢复、儿科基础护理，以及专门的中年围绝经期项目 [CO007]。配套的 Snapshot KPI Table 汇总了定义 Pomelo
              Care 当前公司覆盖面的主要已验证指标和运营参数。
            claimRefs:
              - CO001
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO013
              - CO014
      - number: '1.2'
        title: 管理层、创始人与公司治理
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 由 Marta Bralic Kerns 创立并持续领导；她担任 CEO 和主要执行董事 [CO001, CO004]。创立 Pomelo Care 前，Kerns 曾在 Flatiron
              Health 担任高级副总裁，在医疗科技和真实世界临床数据领域积累了丰富的管理经验，这为她驾驭复杂医疗数据流程和支付方报销结构提供了关键的创始人与市场匹配度
              [CO004]。公司治理仍高度集中，符合其私有、风险投资支持的企业状态：主要经营决策以 Kerns 为核心，职能负责人分别管理临床运营、数据工程和传播 [CO004]。虽然公司主要申报文件和投资者资料确认
              Kerns 是唯一创始人兼 CEO [CO001, CO002]，但第三方数据聚合商之间存在明显不一致 [CO005]。具体而言，GetLatka 在 2025 年 9 月的资料中错误地将 Eric
              Frenkiel 认定为 CEO [CO005]，这凸显了二手财务目录中自动抓取错误的普遍性，也说明必须回到一手来源核验 [CO004,
              CO005]。完整的董事会委员会架构和股权表决协议仍属私有信息，因此公司依赖创始人这一关键人风险仍在，需要标准的投资者监督。Leadership and Founder Table 列出了已知管理层和治理参数。
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 的资本结构通过四轮主要风险融资快速扩张，最终在 2026 年 1 月完成备受关注的 9200 万美元 Series C 融资 [CO002]。本轮由成长型股权机构 Stripes
              领投，Andreessen Horowitz、Atomico、PLUS Capital、BoxGroup 和 SV Angel 等知名医疗与科技风投机构跟投 [CO002, CO011]。Series C
              将投后估值推至 17 亿美元，使 Pomelo Care 成为虚拟女性与家庭健康领域的独角兽 [CO002]。私募市场数据库显示，公司累计融资额在 1.7107 亿美元（Forge Global 报告）至
              1.87 亿美元（Tracxn 报告的六次融资合计）之间 [CO003]。历史轮次包括 Andreessen Horowitz 于 2023 年 6 月领投的 2500 万美元 Series A，以及 First
              Round Capital 与 Andreessen Horowitz 于 2024 年 6 月联合领投的 4600 万美元 Series B [CO011, CO015]。公司还通过收购 The Doula
              Network，增强了将社区线下导乐护理与虚拟临床平台协同起来的能力 [CO012]。尽管资本支持充足，Pomelo Care 并未公开披露 GAAP 收入、毛利率或净现金消耗率 [CO014]。GetLatka
              估算的 1.276 亿美元收入仍未经验证，只能作为推测性基准而非经审计数字 [CO013, CO014]。Stakeholder or Investor Map 展示了机构投资者联盟和关键治理重点。
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO011
      - number: '1.4'
        title: 按时间排列的里程碑与循证规模
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 保持着激进的开发节奏，先建立同行评审的临床证据，再扩大商业支付方合同 [CO015]。公司于 2021 年获得初始融资、于 2023 年和 2024
              年完成机构轮融资后，重点使用严谨的行政理赔数据评估患者结果，而不是依赖自报问卷指标 [CO008, CO015]。Pomelo 与宾夕法尼亚大学 Leonard Davis Institute of Health
              Economics（Penn LDI）合作，在 Society for Maternal-Fetal Medicine（SMFM）2026 年会议上发布多计划结果，研究结果随后发表在 SMFM 的
              Pregnancy 期刊上 [CO008]。研究分析了六个健康计划近 4.5 万次分娩，显示出剂量—反应关系：孕期参与服务三个月或以上的患者，早产率下降 24.4%，NICU 住院时长下降 26%
              [CO008]。随后在 2026 年 ACOG、ISPOR 和 ARM 会议上的临床展示显示，产前参保者的 NICU 住院时长缩短 45%，每次完整护理事件的平均总成本减少 $9,038
              [CO009]。Pomelo 宣称，这些急诊和新生儿服务使用量的临床降幅可转化为面向医疗支付方的 3x 至 5x 投资回报 [CO010]。Company Milestone Timeline 展示了
              Pomelo 如何依托这一临床基础，从孕产护理扩展到覆盖 25M 人的综合女性医疗 [CO006, CO015]。
            claimRefs:
