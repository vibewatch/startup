  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方—支付方格局
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 采用 B2B2C 商业模式，向商业健康计划、Medicaid
              管理式医疗组织（MCO）和自保雇主等企业级医疗支付方销售虚拟护理解决方案，同时直接向孕期和产后人群提供零自付服务。在商业健康计划领域，保险公司与 Pomelo 签约，以降低商业保险人群中的孕产妇发病率和昂贵
              NICU 住院；剖宫产和新生儿并发症会在该人群中带来高额商业报销支出。对 Medicaid 管理式医疗计划，Pomelo
              解决孕产护理荒漠中的急性可及性差距，为共病负担较高的低收入母亲提供全天候、多模式虚拟服务。自保雇主将 Pomelo 作为专门的孕产和儿科福利，以降低员工流失、减少急诊支出并支持职场父母。Pomelo
              还与学术医疗系统和区域 OB-GYN 诊所形成互补合作，在预定线下就诊之间持续监测患者，建立值得信赖的协作临床网络，而非具有竞争关系的远程医疗替代品。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU001
            claimRefs:
