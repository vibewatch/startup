      - number: '6.3'
        title: 已命名客户部署与结果证明
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 的企业客户名单包括商业支付方、Medicaid MCO 和自保雇主领域的知名全国及区域医疗机构。已验证的企业部署包括 Elevance Health、Healthy Blue
              Nebraska、Nebraska Total Care（Centene 旗下公司）、Penn Medicine、Mount Sinai Health System 和 Koch
              Industries。同行评审研究验证的实证临床结果，进一步增强了客户参考质量。在一项于 2026 年完成的代表性研究中，Leonard Davis Institute of Health Economics
              与宾夕法尼亚大学（Penn LDI）合作，并在 Society for Maternal-Fetal Medicine（SMFM）上展示研究结果；研究人员分析了六个大型健康计划 44,988
              次分娩的行政理赔数据。研究显示剂量—反应临床收益：参与 Pomelo 三个月或更久的患者，早产率下降 24.4%，NICU 住院时长下降超过 26%。这些基于理赔的结果直接支撑 Pomelo
              的商业主张，使公司能够宣称，减少 NICU 天数、急诊就诊和可避免产科并发症可带来 3-5x 的投资回报，并据此向支付方采购委员会进行推广。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
