      - number: '4.4'
        title: 资本充足性、融资依赖与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 于 2026 年 1 月以 Stripes 领投的 9200 万美元 Series C 完成全国扩张融资，投后估值 17 亿美元，累计股权融资额达到 1.7107
              亿美元。资本化披露体现标准机构条款，包括 Series C 优先股 1.0x 非参与型清算优先权。尽管达到独角兽地位，Forge Global
              的二级市场追踪显示流动性有限，尚无明确交易定价。从机构投资判断角度看，Pomelo 的财务画像存在明显反差：临床结果和基于理赔的 ROI 在同行评审出版物中记录得异常充分，但经审计 GAAP
              收入、净收入留存率、软件到服务的毛利率、客户集中度和持续现金消耗等核心财务基本面仍属于未披露的私有数据。在经验证的财务报表确认顶线 ARR 是否足以支撑 17
              亿美元估值倍数之前，投资判断必须将收入规模和利润率持久性视为尚未确认的尽调缺口。
