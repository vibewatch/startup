      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 价格需要私有证据
            body: 将 $1.7B 视为最新融资估值，而不是独立验证的公允价值。新投资应以经审计的经济性、付款方层面的留存与集中度、活跃参与队列、现金续航和完全摊薄后的清算瀑布为前提。
            calloutType: recommendation
            claimRefs:
              - CV001
