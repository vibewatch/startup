            body: SMFM 2026 的同行评审结果表明，临床影响会随时间累积：产前参与一个月时，早产率降幅为 11.0%；参与三个月或更久时，降幅扩大至 24.4%。这说明，尽早让患者加入，对于最大化临床和财务回报至关重要。
