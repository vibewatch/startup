      - number: '8.3'
        title: 投资论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              可投资论点是：Pomelo 能把付款方准入转化为持续参与、可量化的理赔节省，并在女性和儿童健康领域反复扩张。公司材料称覆盖超过 2,500 万受保生命、支持近 7% 的美国出生人口，客户 ROI 为 3–5
              倍；一项 2026 年理赔研究称，参与至少三个月的人群结果更好。反论点同样重要：受保生命是符合资格的人群，不是活跃患者；ROI
              数字仍由公司提供；引用的研究是观察性研究，并非随机试验保证。扩展至儿科和中年护理会扩大机会，但也带来不同的证据、报销、转诊和人员配置要求。这些不确定性支持有条件的情景，而不是精确的估值预测。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
