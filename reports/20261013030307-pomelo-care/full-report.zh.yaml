  - id: FE001
    title: 虚拟照护交付与临床数据架构
    type: stack
    summary: 分层技术与运营架构覆盖会员参与、临床决策支持、数据摄取和合规控制。
    approximationNotes: 架构分层综合自已披露的临床模型、付费方集成文件和安全市场披露。
    data:
      layers:
        - label: 会员参与与准入层
          detail: 全渠道沟通界面通过 SMS、移动应用内消息、电话和同步视频，将会员连接至照护团队。
        - label: 多专科照护交付层
          detail: 专属照护团队包括护理伙伴、认证助产士、产科医生、儿科医生、营养师、导乐和哺乳顾问。
        - label: 临床智能与协议引擎
          detail: 基于证据的临床手册和决策支持工具识别早期孕期风险，并指导按协议执行干预。
        - label: 远程监测与遥测摄取
          detail: 连接式诊断管线收集蜂窝网络和 Bluetooth 血压读数、血糖记录及患者症状遥测数据。
        - label: 健康计划与临床数据集成
          detail: 双向接口接入区域健康信息交换平台（HIE）、付费方行政理赔文件和门诊 EHR 名单。
        - label: 安全、合规与基础设施底座
          detail: 符合 HIPAA 的托管基础设施、SOC 2 Type II 控制和基于角色的访问管理，共同保护敏感受保护健康信息。
    claimRefs:
