      - number: '8.2'
        title: 融资背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月 8 日，C 轮融资 $92M，报道的投后估值为 $1.7B。Forge 报告累计融资 $171.07M，上一轮 B 轮投后估值为 $499.22M，由此可见融资估值从 2024 年 6 月到
              2026 年 1 月约增长至 3.4 times。这只是优先股轮次估值的比较，不代表投资回报、收入增长或可用现金。Forge 同时显示暂无可用 Forge
              Price，并将市场活跃度标为有限，因此指定证据没有可观察的二级交易可用来检验本轮价格。其融资表提供了部分优先权信号，但不是完整的股权结构表或收益分配瀑布。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
