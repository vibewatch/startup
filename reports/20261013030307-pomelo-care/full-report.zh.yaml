        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 模式的核心运营原则，是与线下产科服务提供方协作，而非直接替代患者原有医疗关系。在与支付方合作的部署中，例如其为 STAR Medicaid 受益人接入 Dell Children's
              Health Plan，Pomelo
              充当下班后和两次就诊之间的虚拟护理伙伴。虚拟机构负责非紧急临床分诊、初步接诊和首次产前咨询，并协调常规基线化验。平台接手耗时的就诊间患者沟通后，减轻社区产科诊所的行政负担和临床人员倦怠，同时持续监测高风险患者。SMFM
              2026 Pregnancy Meeting
              上发表的同行评审研究验证了这种协作方式，显示持续的产前参与能显著减少孕产妇发病率和新生儿并发症。具体而言，既往医疗理赔记录不多的孕妇会员，往往存在更高的妊娠期高血压风险；Pomelo
              的就诊间监测能够成功识别并缓解这一风险。
