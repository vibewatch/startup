      - number: '6.2'
        title: 采用轨迹与覆盖人数扩张
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，Pomelo Care 快速扩大商业规模：覆盖范围从 2023 年年中在 44 个州接近两百万人，扩展到 2026 年 1 月超过 25M
              人。这一轨迹反映出全国和区域健康计划对循证孕产管理的广泛企业签约。到 2026 年初，Pomelo 报告称其合同支付方覆盖了美国全年出生人口的近
              7%，在孕产医疗服务中实现了显著的全国市场渗透。企业导入依靠自动化资格审核，将覆盖会员与专门的多专科护理团队在几分钟内匹配，临床人员响应时间中位数保持在五分钟以内，患者满意度达到 4.9 /
              5。为扩大现有客户账户中的钱包份额，Pomelo 最近推出儿科护理和围绝经期、绝经期中年健康项目，使公司从阶段性的孕产点解决方案转变为覆盖女性和儿童整个生命周期的纵向医疗平台。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
