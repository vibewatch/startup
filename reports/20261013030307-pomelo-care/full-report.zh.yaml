  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与护理项目组合
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care
              是一家专注于孕产、儿科和女性健康的专业虚拟医疗机构，服务覆盖孕期、产后恢复及后续阶段。公司不提供孤立的数字内容或单独的追踪工具，而是由指定的多学科团队持续提供虚拟护理。这些团队包括护理搭档、认证护士助产士、经认证的妇产科医生、儿科医生、注册营养师、导乐和哺乳顾问，直接与患者互动。患者通过统一的会员界面获得护理，包括异步
              SMS 和应用内消息、电话支持，以及每天 24 小时、每周 7 天提供的同步视频问诊。公司报告称，会员咨询的响应时间中位数不到五分钟。Pomelo 主要通过与商业健康计划和 Medicaid
              管理式医疗组织签约运营，已将核心护理范围从传统围产期管理扩展到生育和备孕咨询、儿科过渡支持及中年健康管理。
            claimRefs:
