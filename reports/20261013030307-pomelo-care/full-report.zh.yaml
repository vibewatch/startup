              则将自身经济性与支付方投资回报挂钩。据公司称，36 家健康计划合作伙伴通过减少早产分娩和新生儿重症监护住院，实现了 2x 至 4x 的基于理赔 ROI。UnitedHealthcare 和 Aetna
              等主要支付方正在提高签约标准，要求可验证的理赔结果来证明合同支出的合理性。不过，如果支付方要求承担更多共同下行风险，或试图自建护理管理项目以获取新生儿成本节省，这种价值型合同结构也会使 Pomelo Care
              面临被替代风险。
