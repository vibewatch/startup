            body: >-
              Pomelo Care 的经济投资判断基础，在于把主动识别临床风险转化为承担风险的支付方能够确认的理赔节省。在 ACOG 展示、并与 Penn LDI 合作发表于 Society for
              Maternal-Fetal Medicine（SMFM）Pregnancy 期刊的多中心理赔分析中，Pomelo 证明可显著减少可避免的医疗使用量。产前参与与 NICU 住院时长下降 45%、分娩相关 NICU
              成本下降 63%以及每次完整孕产护理事件平均支出减少 9038 美元相关。明确的剂量—反应效应显示，孕期参与三个月或更久的患者，早产率下降 24.4%，NICU 住院时长降低超过
              26%。这些经过理赔验证的临床改善，支撑公司宣称的客户 3-5x 投资回报，也为支付方承担持续 PMPM 费用并资助混合式导乐护理整合提供了经济依据。
