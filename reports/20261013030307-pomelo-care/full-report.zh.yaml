      - - 信心
        - medium
        - 融资和覆盖人数数据是最新的，但核心运营数据和资本表输入仍属非公开信息。
      - - 风险评级
        - high
        - 流动性不足、可观察市场活动有限、临床人力要求高且经济数据未披露，限制了投资判断。
      - - 估值立场
        - stretched
        - $1.7B 投后估值缺乏公开收入、利润率、留存、烧钱速度或活跃患者数据支持。
      - - 决策含义
        - 将任何价格建立在非公开证据之上
        - 要求核实经济数据、队列参与度、续约、集中度、现金 runway 和清算瀑布。
    notes: 评估采用 2026 年 1 月优先股轮次估值和指定公开来源；这不是公允价值意见，也不是二级市场报价。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV013
      - CV014
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 议题
      - 论点
      - 反论点
      - 哪些事实会改变判断
    rows:
      - - 分销
        - 超过 25M 的覆盖人数构成了庞大的合同准入渠道。
        - 覆盖人数代表符合资格的人数，不等于活跃患者或经常性收入。
        - 按付费方核对队列入组、持续参与度和收入。
      - - 临床与付费方价值
        - 已报道的理赔结果和公司宣称的 3-5x ROI，构成了可信的付费方价值主张。
        - 该研究为观察性研究，池中 ROI 证据由公司提供。
        - 在多个付费方队列中独立复现结果，并按合同验证节省金额。
      - - 扩张
        - 儿科和中年照护可能把合作关系延伸到孕产之外。
        - 不同的临床路径、报销、转诊和人员配置可能限制可迁移性。
        - 续签多产品合同，并取得按细分市场拆分的使用率、结果和贡献经济数据。
      - - 价格与流动性
        - 最新轮次吸引了成熟的风险投资者，并新增 $92M 融资。
        - Forge 显示市场活动有限且没有可用的 Forge Price；截至运行日期，轮次募集资金并不等于可用现金。
        - 经核实的二级交易，或有经审计运营结果支持的新融资。
    notes: 本表区分公司提供的证据与独立解读，不把覆盖人数、融资或临床结果转换成未披露的收入。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 公开证据可支持的估值区间
      - 概率信号
      - 下行情景或论点失效触发因素
    rows:
      - - 乐观
        - 已核实覆盖人数向持续参与度的转化；结果得到独立复现；续约稳固；孕产和扩张项目的贡献经济性改善。
        - 无法依据指定公开证据估算；只有在假设得到核实后，才可能支持 $1.7B 估值或溢价。
        - 只有经审计的增长、利润率、留存和跨项目采用率验证了经营杠杆，信号才为正面。
        - 结果复现失败，或扩张队列需要为每名参与患者投入明显更多的临床人力。
      - - 基准
        - 孕产业务仍具差异化，扩张循序渐进，付费方需求持续，但参与度和单位经济性仍然参差不齐。
        - 无法依据指定公开证据估算；在非公开指标核实前，进入价格需相对 $1.7B 估值打折。
        - 当前公开证据最符合这一有条件的情景：临床和分销信号与财务不透明并存。
        - 续约、集中度或现金 runway 证据弱于融资叙事所暗示的水平。
      - - 悲观
        - 符合资格人数规模难以转化为持续使用，节省金额无法复现，或资金需求增长快于合同经济性。
        - 大幅减值或下轮融资是可能的，但指定证据无法给出可信的绝对下限。
        - Forge 活动有限且没有显示价格，无法提供流动性市场的下行锚点。
        - 付费方续约疲弱、参与度低、融资条款不利，或无法为临床交付模式提供资金。
    notes: 情景结果是有条件的决策区间，不是预测；由于收入、利润率、留存、烧钱速度、持股和时间输入不可得，绝对值、概率、MOIC 和 IRR 均不提供。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Pomelo Care 自 2021 年成立以来，历经临床研究验证并扩张至 Series C。
    data:
      items:
        - label: 2021 年成立
          date: '2021-06-18'
          details: Marta Bralic Kerns 在纽约创办 Pomelo Care，提供全天候虚拟孕产妇和新生儿医疗服务。
          tone: positive
        - label: Series A 融资
          date: '2023-06-08'
          details: 在 Andreessen Horowitz 领投的 Series A 中获得 $25M，用于扩大商业健康计划集成。
          tone: positive
        - label: Series B 融资
          date: '2024-06-20'
          details: 在 First Round Capital 和 Andreessen Horowitz 领投的 Series B 中融资 $46M，用于扩大 Medicaid 合作。
          tone: positive
        - label: 结果展示
          date: '2025-09-08'
          details: 在多个会议上展示同行评议数据，显示总照护成本下降 8.8%，付费方 ROI 为 3.9:1。
          tone: positive
        - label: Series C 独角兽估值
          date: '2026-01-08'
          details: 在 Stripes 领投的 Series C 中融资 $92M，估值 $1.7 billion，成为女性数字健康独角兽。
          tone: positive
        - label: SMFM 旗舰论文
          date: '2026-03-12'
          details: 在 SMFM Pregnancy 与 Penn LDI 发表研究，显示早产率下降 24.4%，NICU 住院时长缩短 26%。
          tone: positive
        - label: ACOG 与 ARM 临床数据
          date: '2026-09-22'
          details: 发布多项研究数据，将虚拟照护与 NICU 住院时长缩短 45%、单次治疗平均成本降低 $9,038 联系起来。
          tone: positive
        - label: 多阶段全生命周期照护
          date: '2026-10-01'
          details: 将平台覆盖从孕产扩展至中年围绝经期和儿科照护，覆盖人数达 25 million。
          tone: positive
    approximationNotes: 里程碑日期对应公开新闻公告、同行评议展示日期和监管交易通知。
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
      - CO015
