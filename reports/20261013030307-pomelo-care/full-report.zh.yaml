  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 的可服务市场位于虚拟孕产护理、儿科支持和更广义女性数字医疗的交汇处。在美国，孕产妇和婴儿医疗既是商业支付方和州 Medicaid
              项目临床支出的最大集中领域之一，也是可避免并发症的主要来源之一。Pomelo
              并不取代本地产科临床医生，而是将自身定位为专门的虚拟护理层，与线下产科医生和儿科医生协同，监测孕产妇风险、补上护理缺口，并在急性并发症需要急诊住院前介入。传统现状高度依赖阶段性的线下产检，但这类就诊往往无法在两次预约之间识别妊娠期高血压和围产期情绪障碍等突发风险。现有替代方案包括健康计划内部护士热线、通用远程医疗供应商和独立的孕产护理协调项目。Pomelo
              的差异在于提供全天候、连续、多模式的临床管理，覆盖备孕、儿科和中年激素健康。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角、支出驱动因素与受限 TAM/SAM
        blocks:
          - type: paragraph
            body: >-
              评估 Pomelo Care 的可服务市场，不能只依赖单一自上而下的数字医疗预测，而要拆开不同的支出视角。宏观层面，仅早产每年就约占美国医疗支出 260
              亿美元，背后是新生儿重症监护住院时间延长和高复杂度分娩。全美每年约有 360 万名婴儿出生，其中约 10% 需要进入 NICU，12% 出生在孕产护理资源有限的县。Pomelo 报告称，公司已覆盖 2500
              万人，并在 2026 年完成 9200 万美元 Series C 后支持接近 7%
              的美国出生人口。不过，健康计划合同结构以及未披露的每会员每月（PMPM）或按病例计价，限制了对精确可服务市场（SAM）的拆分。支付方是否采用，根本取决于有记录的医疗理赔 ROI：同行评审研究显示，Pomelo
              的产前模式可使 NICU 住院时长减少 45%、与分娩相关的 NICU 成本减少 63%，每次分娩护理事件平均节省 9038 美元。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: 买方分层、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 虚拟护理平台的采购分为 Medicaid 管理式医疗组织（MCO）以及商业健康计划 / 自保雇主两类。在 Medicaid 领域，计划受严格的州医疗损失率（MLR）约束，并受 HEDIS
              质量指标等绩效激励机制影响。对这些买方而言，预算掌握在医疗总监和首席医疗官手中，他们希望改善产前护理及时性（TOPC）和产后护理（PPC）质量指标；这既可能带来数百万美元的州级质量激励报销，也能减少高成本新生儿理赔。商业健康计划和自保雇主则购买
              Pomelo，以压低灾难性分娩理赔、减少昂贵急诊使用，并提供有竞争力的家庭健康福利。采用通常需要 6 至 12
              个月的支付方签约，随后还要与区域健康信息交换平台（HIE）完成临床集成，以识别既往医疗记录有限的孕妇会员正在上升的临床风险。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、结构性采用瓶颈与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动 Pomelo Care
              的关键顺风包括全国孕产妇健康危机、产科医护人员普遍短缺，以及支付方转向价值型孕产风险安排。此外，公司向中年激素健康、围绝经期和儿科扩张，提高了每名覆盖会员在单次妊娠周期之外的潜在终身价值。不过，采用约束依然明显。建立价值型合同需要大量临床理赔验证，还要接入可能对虚拟平台持怀疑态度的本地医疗系统。另外，核心临床结果主要来自公司赞助或合作学术研究，在不同且独立的支付方队列中进行第三方复现，仍是持续的尽调要求。净收入留存率、合同流失率和确切毛利率等私有财务指标仍未披露，构成财务投资判断中的重大缺口。
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 基于理赔的 ROI 是支付方采用的首要触发因素
            body: >-
              不同于依赖用户参与度指标的消费级数字医疗应用，Pomelo Care 在健康计划中的采用由经过理赔审计的医疗成本降幅驱动。证明 NICU 住院时长下降 45%、每次分娩成本平均节省 9038
              美元，能为支付方进行企业级签约提供精算依据。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
          - type: callout
            title: 需要独立的多队列复现
            body: ISPOR、ACOG 和 SMFM 会议发表的结果显示临床疗效较强，但研究均与公司选定的学术伙伴合作完成。要保持品类领导地位，必须证明节省效果能在多样、未经筛选的区域 Medicaid 计划中稳定复现。
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 替代格局与同业画像
        blocks:
          - type: paragraph
            body: >-
              孕产妇与女性健康市场主要包含四类竞争替代方案：专门的虚拟孕产诊所、通用数字远程医疗平台、针对特定病症的点解决方案，以及传统实体产科诊所。第三方目录和市场追踪机构将 Pomelo Care 与 Midi
              Health（中年护理）、Vida Health（慢性病管理）和 Nourish（远程营养）等私营远程医疗平台并列。不过，Pomelo Care 作为负有临床责任的医疗机构，依托商业和 Medicaid
              健康计划合作，覆盖超过 2500 万人。第三方市场目录虽估算 Pomelo 年收入为 1.276
              亿美元，但公司未发布经审计财务报表，因此与私营同业比较规模时，只能依赖已披露融资轮次、覆盖人数和健康计划分销合同，而不是经验证的收入。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP014
      - number: '3.2'
        title: 能力矩阵与临床差异化
        blocks:
          - type: paragraph
            body: >-
              不同于依赖自动聊天机器人或异步健康内容的数字医疗入口，Pomelo Care 采用全职多专科临床团队，包括产科医生、助产士、护士、导乐和营养师，平均响应时间不到五分钟。Pomelo
              并不把服务定位为替代现有医疗提供方，而是主动与本地线下 OB-GYN 科室合作，在两次诊所预约之间监测患者并管理并发症。Pomelo Care
              与竞争性数字医疗服务之间最核心的临床差异，是其同行评审验证。在覆盖六个商业和 Medicaid 健康计划、近 4.5 万次分娩的行政理赔研究中，持续参与 Pomelo Care 三个月或更久的患者，早产率下降
              24.4%，NICU 住院时长下降 26%；这一严谨的临床证据标准，是基于应用的竞争者尚未证明的。
