        title: 收入架构与定价机制
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care 通过与商业健康计划、Medicaid 管理式医疗组织和自保雇主签订 B2B
              企业合同实现变现。在这些机构安排下，符合条件的已参保会员及其家属可零自付获得临床和护理导航服务。商业协议通常采用每会员每月（PMPM）或按参与分娩收取病例费，并配合与高成本孕产事件下降挂钩的价值型激励结构。公司已将合同覆盖面迅速扩展至
              46 个州的 25M 多名覆盖会员，其中包括覆盖全国六分之一以上 Medicaid 受益人的合作项目。不过，孕产医疗中的价值型合同在运营上仍很复杂，需要与每个支付方单独确定风险区间和归因基准。Owler
              等公开第三方平台目录估算年平台收入在 $100K 至 $5.0M 之间，凸显了经审计商业数据缺失以及实际企业合同价值的不透明。
