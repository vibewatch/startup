            title: 符合资格不等于使用
            body: 超过 2,500 万受保生命证明了分销能力，但不能证明活跃患者、收入或留存。估值能否获得支撑，取决于有多少符合资格的成员参与足够长时间，从而产生可复现的结果和付款方节省。
            calloutType: risk
