companyProfile:
  summary: >-
    Pomelo Care is a New York-based virtual medical care platform that delivers 24/7 maternity-to-midlife support across
    pregnancy, postpartum, pediatric, and women's health. It sells primarily to health plans and employers, supplements
    in-person OB-GYN and pediatric care, and has expanded to more than 25 million covered lives while keeping public
    financial disclosure limited.
  foundedDate: '2021-01-01'
