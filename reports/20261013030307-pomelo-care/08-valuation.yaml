    title: "Thesis and Anti-Thesis"
    columns:
      - "Issue"
      - "Thesis"
      - "Anti-thesis"
      - "What would change the view"
    rows:
      - - "Distribution"
        - "More than 25M covered lives provide a large contracted access channel."
        - "Covered lives measure eligibility, not active patients or recurring revenue."
        - "Cohort enrollment, sustained engagement, and revenue reconciliation by payer."
      - - "Clinical and payer value"
        - "Reported claims outcomes and 3-5x company-claimed ROI create a credible payer proposition."
        - "The study is observational and the ROI evidence in this pool is company-issued."
        - "Independent replication and contract-level savings validation across multiple payer cohorts."
      - - "Expansion"
        - "Pediatrics and midlife care could extend the relationship beyond maternity."
        - "Different clinical pathways, reimbursement, referrals, and staffing may limit transferability."
        - "Renewed multi-product contracts with segment-level utilization, outcomes, and contribution economics."
      - - "Price and liquidity"
        - "The latest round attracted established venture investors and added $92M of financing."
        - "Forge shows limited activity and no available Forge Price; round proceeds are not cash available as of the run date."
        - "A verified secondary transaction or a new financing supported by audited operating results."
    notes: "The table separates company-issued evidence from independent interpretation and does not convert covered lives, funding, or clinical outcomes into undisclosed revenue."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV012"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Publicly supportable valuation range"
      - "Probability signal"
      - "Downside or thesis-break trigger"
    rows:
      - - "Bull"
        - "Verified conversion from covered lives to sustained engagement; independently reproduced outcomes; durable renewals; improving contribution economics across maternity and expansion programs."
        - "Not estimable from assigned public evidence; could justify the $1.7B mark or a premium only after the assumptions are verified."
        - "Positive only if audited growth, margins, retention, and cross-program adoption validate operating leverage."
        - "Outcome replication fails or expansion cohorts require materially higher clinical labor per engaged patient."
      - - "Base"
        - "Maternity remains differentiated, expansion is gradual, and payer demand persists, but engagement and unit economics remain mixed."
        - "Not estimable from assigned public evidence; require an entry discount to the $1.7B mark until private metrics are verified."
        - "Current public evidence best fits this conditional case because clinical and distribution signals coexist with financial opacity."
        - "Renewal, concentration, or cash-runway evidence is weaker than the financing narrative implies."
      - - "Bear"
        - "Eligible-life scale converts poorly into sustained use, savings do not reproduce, or capital needs rise faster than contract economics."
        - "Material impairment or a down round is plausible, but no defensible absolute floor is available from the assigned evidence."
        - "Forge's limited activity and absent displayed price provide no liquid-market downside anchor."
        - "Weak payer renewals, low engagement, adverse financing terms, or inability to fund the clinical delivery model."
    notes: "Scenario outputs are conditional decision bands, not forecasts; absolute values, probabilities, MOIC, and IRR are withheld because revenue, margin, retention, burn, ownership, and timing inputs are unavailable."
    claimRefs:
      - "CV004"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV012"
      - "CV013"
      - "CV015"
