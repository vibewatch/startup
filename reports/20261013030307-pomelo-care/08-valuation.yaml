company:
  name: "Pomelo Care"
chapter:
  number: 8
  title: "Valuation"
  summary: "Pomelo Care's January 2026 Series C established a $1.7 billion post-money mark, but the assigned public evidence does not disclose revenue, margins, retention, burn, or an observable secondary price. The evidence supports a research-more recommendation, high risk rating, and stretched valuation stance until private operating and capitalization data can connect clinical proof and covered-life scale to investor returns."
sections:
  - id: "entry-stance"
    title: "Recommendation and Entry Stance"
    body: "Pomelo Care merits continued diligence, not a price-insensitive investment recommendation. The positive case combines a large contracted distribution footprint, reported clinical outcome associations, and a payer-oriented value proposition. The limiting fact is that the January 2026 financing mark is visible while the operating denominator needed to judge it is not: the assigned sources do not provide audited revenue, gross margin, retention, burn, active-patient conversion, or customer concentration. That imbalance supports a research-more recommendation with medium confidence, a high risk rating, and a stretched valuation stance. Entry discipline should therefore be tied to verified operating and capitalization evidence rather than to the round valuation alone."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "financing-and-price-support"
    title: "Financing Context and Price Support"
    body: "The January 8, 2026 Series C raised $92 million at a reported $1.7 billion post-money valuation. Forge reports cumulative funding of $171.07 million and a prior Series B post-money mark of $499.22 million, implying that the financing mark increased about 3.4 times between June 2024 and January 2026. That change is a comparison of preferred-round marks, not investment performance, revenue growth, or cash available. Forge also shows no available Forge Price and labels market activity limited, so the assigned evidence offers no observable secondary transaction with which to test the round price. Its financing table provides a partial preference signal, but not a complete cap table or proceeds waterfall."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "thesis-and-scenarios"
    title: "Thesis, Anti-Thesis, and Scenarios"
    body: "The investable thesis is that Pomelo can translate payer access into sustained engagement, measurable claims savings, and repeatable expansion across women's and children's health. Company materials report more than 25 million covered lives, nearly 7% of U.S. births supported, and 3-5x customer ROI; a 2026 claims study reported stronger outcomes with at least three months of engagement. The anti-thesis is equally important: covered lives are eligible populations, not active patients, the ROI figure remains company-issued, and the cited study is observational rather than a randomized guarantee. Expansion into pediatrics and midlife care widens the opportunity but introduces different evidence, reimbursement, referral, and staffing requirements. These uncertainties support conditional scenarios, not precise valuation forecasts."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: "Public evidence does not establish exit readiness or a supportable target return. Forge characterizes market activity as limited and does not display a matched price, while its own disclosures caution that private securities are highly speculative and illiquid. Before underwriting a new round or secondary purchase, investors should reconcile audited financial statements to contract-level revenue, test active enrollment and sustained engagement against the covered-life denominator, review renewal and concentration by payer, and model the fully diluted capitalization and liquidation waterfall. Thesis-break triggers should include failure to reproduce outcomes across payer cohorts, weak conversion from eligibility to sustained care, adverse renewal evidence, or financing terms that subordinate new capital without a compensating entry discount."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV007"
      - "CV009"
      - "CV013"
      - "CV015"
      - "CV016"
    figureRefs:
      - "FV001"
