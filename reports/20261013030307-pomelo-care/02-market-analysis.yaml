callouts:
  - calloutType: insight
    title: Claims-Based ROI as Primary Payer Adoption Trigger
    body: >-
      Unlike consumer digital health apps reliant on user engagement metrics, Pomelo Care's adoption among health plans
      is driven by claims-audited medical cost reductions. Demonstrating a 45% reduction in NICU length of stay and
      $9,038 in average delivery cost savings provides payers with actuarial justification for enterprise contracting.
    claimRefs:
      - CM008
      - CM010
  - calloutType: risk
    title: Need for Independent Multi-Cohort Replication
    body: >-
      While published outcomes in ISPOR, ACOG, and SMFM conferences show strong clinical efficacy, studies have been
      executed in collaboration with company-selected academic partners. Proving consistent savings across diverse,
      unselected regional Medicaid plans remains critical for sustained category leadership.
    claimRefs:
      - CM009
      - CM013
