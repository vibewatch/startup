chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care is an evidence-based virtual medical care platform operating at the intersection of maternal,
              infant, and women's healthcare [CO001]. Founded in 2021 by healthcare technology executive Marta Bralic
              Kerns and headquartered in New York City, the company was established to address systemic shortcomings in
              maternal and infant outcomes across the United States [CO001]. Unlike traditional consumer digital health
              applications that rely on wellness tracking or asynchronous educational content, Pomelo operates as a
              licensed clinical provider delivering 24/7 personalized care through dedicated multispecialty medical
              teams [CO007]. Its clinical model integrates medical doctors, midwives, nurses, therapists, dietitians,
              and doulas who collaborate with in-person obstetricians and pediatricians to close care gaps between
              routine clinical visits [CO005, CO007]. By aligning with major commercial payers, Medicaid health plans,
              and enterprise employers, Pomelo has scaled its contractual coverage to more than 25 million lives
              nationwide [CO006]. The platform provides comprehensive support across the reproductive lifecycle,
              including preconception and fertility guidance, pregnancy monitoring, postpartum recovery, pediatric
              primary care, and specialized midlife perimenopause programs [CO007]. The accompanying Snapshot KPI Table
              summarizes the primary verified metrics and operational parameters defining Pomelo Care's current
              corporate footprint.
            claimRefs:
              - CO001
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, Founders, and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care was founded and continues to be led by Marta Bralic Kerns, who serves as Chief Executive
              Officer and principal executive director [CO001, CO004]. Prior to establishing Pomelo Care, Kerns
              accumulated extensive executive experience in health technology and real-world clinical data as a senior
              vice president at Flatiron Health, providing critical founder-market fit for navigating complex healthcare
              data workflows and payer reimbursement structures [CO004]. Corporate governance remains closely held,
              reflecting the company's private venture-backed status, with primary executive decision-making centered
              around Kerns and functional leads overseeing clinical operations, data engineering, and communications
              [CO004]. While primary company filings and investor profiles confirm Kerns as the sole founder and Chief
              Executive Officer [CO001, CO002], third-party data aggregators exhibit notable discrepancies [CO005].
              Specifically, GetLatka erroneously identified Eric Frenkiel as CEO in its September 2025 profile [CO005],
              highlighting the prevalence of automated scraping errors among secondary financial directories and
              reinforcing the necessity of primary-source validation [CO004, CO005]. Complete board committee structures
              and equity voting agreements remain private, creating key-person reliance on the founder that requires
              standard investor oversight. The Leadership and Founder Table details known executive leadership and
              governance parameters.
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
      - number: '1.3'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care's capital structure has expanded rapidly through four major venture funding rounds,
              culminating in a landmark $92 million Series C financing announced in January 2026 [CO002]. The round was
              led by growth equity firm Stripes, with participation from prominent healthcare and technology venture
              firms including Andreessen Horowitz, Atomico, PLUS Capital, BoxGroup, and SV Angel [CO002, CO011]. The
              Series C financing established a post-money valuation of $1.7 billion, positioning Pomelo Care as a
              unicorn in the virtual women's and family health sector [CO002]. Private market databases indicate
              cumulative capital raised between $171.07 million (reported by Forge Global) and $187 million across six
              total financings (reported by Tracxn) [CO003]. Historical rounds include a $25 million Series A led by
              Andreessen Horowitz in June 2023 and a $46 million Series B co-led by First Round Capital and Andreessen
              Horowitz in June 2024 [CO011, CO015]. Strategic corporate development included the acquisition of The
              Doula Network, expanding Pomelo's capacity to coordinate in-person community doula care with its virtual
              clinical platform [CO012]. Despite this substantial capital backing, Pomelo Care does not publicly
              disclose GAAP revenue, gross margin, or net burn rate [CO014]. Third-party estimates like GetLatka's
              unverified $127.6 million revenue projection remain speculative benchmarks rather than audited figures
              [CO013, CO014]. The Stakeholder or Investor Map outlines the institutional syndicate and key governance
              priorities.
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO011
      - number: '1.4'
        title: Chronological Milestones and Evidence-Based Scale
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care has maintained an aggressive development cadence centered on establishing peer-reviewed
              clinical proof before scaling commercial payer contracts [CO015]. Following its initial funding in 2021
              and institutional rounds in 2023 and 2024, the company placed heavy emphasis on evaluating patient
              outcomes using rigorous administrative claims data rather than self-reported survey metrics [CO008,
              CO015]. In collaboration with the Leonard Davis Institute of Health Economics at the University of
              Pennsylvania (Penn LDI), Pomelo presented multi-plan outcomes at the Society for Maternal-Fetal Medicine
              (SMFM) 2026 meeting, with findings published in SMFM's Pregnancy journal [CO008]. The study analyzed
              nearly 45,000 deliveries across six health plans and demonstrated a dose-response relationship: patients
              engaged prenatally for three or more months experienced a 24.4% reduction in preterm births and a 26%
              reduction in NICU length of stay [CO008]. Subsequent clinical presentations at ACOG, ISPOR, and ARM in
              2026 demonstrated a 45% shorter NICU stay and $9,038 in average total episode cost reductions for prenatal
              enrollees [CO009]. Pomelo leverages these clinical reductions in expensive emergency and neonatal
              utilization to market a 3x to 5x return on investment to healthcare payers [CO010]. As illustrated in the
              Company Milestone Timeline, Pomelo has leveraged this clinical foundation to expand beyond maternity into
              comprehensive women's healthcare across 25 million covered lives [CO006, CO015].
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO010
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rigorous Clinical Validation and Payer Alignment
            body: >-
              Pomelo Care differentiates itself from surface-level digital health apps by anchoring its commercial pitch
              on peer-reviewed claims data [CO008]. Independent academic collaboration with Penn LDI demonstrates that
              three or more months of prenatal engagement yields a 24.4% reduction in preterm births and over 26%
              shorter NICU lengths of stay [CO008], directly driving economic savings for health plans covering over 25
              million lives [CO006].
            calloutType: strength
            claimRefs:
              - CO006
              - CO008
          - type: callout
            title: Financial Information Asymmetry at a $1.7B Valuation
            body: >-
              Despite achieving unicorn status through its $92 million Series C round led by Stripes [CO002], Pomelo
              Care maintains strict confidentiality around GAAP revenue, operating margins, customer concentration, and
              cash burn [CO014]. Third-party estimates such as GetLatka's $127.6 million figure remain speculative
              [CO013], leaving prospective investors reliant on private diligence to verify whether growth justifies the
              valuation multiple [CO014].
            calloutType: risk
            claimRefs:
              - CO002
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Pomelo Care sits at the intersection of virtual maternity care, pediatric
              support, and broader women's digital health. In the United States, maternal and infant healthcare
              represents one of the largest single concentrations of clinical spending and avoidable complications for
              both commercial payers and state Medicaid programs. Rather than replacing local obstetrical clinicians,
              Pomelo positions its solution as a specialized virtual care overlay that coordinates with in-person
              obstetricians and pediatricians to monitor maternal risk, close care gaps, and intervene before acute
              complications require emergency hospitalizations. The traditional status quo relies heavily on episodic
              in-person prenatal visits, which often fail to identify emergent risks such as gestational hypertension
              and perinatal mood disorders between appointments. Status-quo alternatives include internal health plan
              nurse lines, generic telehealth vendors, and standalone maternity care coordination programs. Pomelo
              differentiates by providing 24/7 continuous multimodal clinical management spanning preconception through
              pediatrics and midlife hormonal health.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Spend Drivers, and Constrained TAM/SAM
        blocks:
          - type: paragraph
            body: >-
              Evaluating Pomelo Care's addressable market requires examining distinct spending lenses rather than
              relying on a single top-down digital health projection. At the macroeconomic level, preterm births alone
              account for approximately $26 billion in annual U.S. healthcare expenditures, driven by extended neonatal
              intensive care unit (NICU) admissions and high-complexity deliveries. Across the nation, approximately 3.6
              million infants are delivered annually, with roughly 10% requiring NICU admission and 12% born in counties
              with limited maternal care access. Pomelo reports active commercial traction, covering 25 million lives
              and supporting nearly 7% of U.S. births following a $92 million Series C funding round in 2026. However,
              isolating a precise serviceable addressable market (SAM) remains constrained by health plan contract
              structures and undisclosed per-member-per-month (PMPM) or case-rate pricing. Payer adoption is
              fundamentally governed by documented medical claims ROI: peer-reviewed studies associate Pomelo's prenatal
              model with a 45% reduction in NICU length of stay, a 63% reduction in delivery-related NICU costs, and an
              average savings of $9,038 per delivery episode.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Procurement of Pomelo Care's virtual care platform is bifurcated across Medicaid managed care
              organizations (MCOs) and commercial health plans/self-insured employers. In the Medicaid segment, plans
              operate under tight state medical loss ratio (MLR) constraints and performance-based incentive frameworks
              such as HEDIS quality measures. For these buyers, budget ownership sits with medical directors and chief
              medical officers seeking to improve Timeliness of Prenatal Care (TOPC) and Postpartum Care (PPC) quality
              metrics, which can yield millions of dollars in state quality incentive reimbursements while reducing
              high-cost neonatal claims. Conversely, commercial health plans and self-insured employers purchase Pomelo
              to curb catastrophic delivery claims, lower costly emergency room utilization, and provide competitive
              family health benefits. Adoption pathways typically require 6 to 12 months of payer contracting, followed
              by clinical integration with regional health information exchanges (HIEs) to surface rising clinical risks
              among pregnant members who lack extensive prior medical history.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth Drivers, Structural Adoption Bottlenecks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Key tailwinds propelling Pomelo Care include the national maternal health crisis, widespread obstetrical
              workforce shortages, and payer migration toward value-based maternity risk arrangements. Furthermore,
              Pomelo's expansion into midlife hormonal health, perimenopause, and pediatrics expands its potential
              lifetime value per covered member beyond single pregnancy episodes. Nonetheless, meaningful adoption
              constraints persist. Establishing value-based contracts requires extensive clinical claims validation and
              integration with local healthcare systems that may view virtual platforms with skepticism. Additionally,
              because core clinical outcomes have been presented primarily through company-sponsored and partnered
              academic studies, third-party replication across diverse independent payer cohorts remains an ongoing
              diligence requirement. Private financial metrics—such as net revenue retention, contract churn, and exact
              gross margins—remain undisclosed, representing a material gap for financial underwriting.
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Claims-Based ROI as Primary Payer Adoption Trigger
            body: >-
              Unlike consumer digital health apps reliant on user engagement metrics, Pomelo Care's adoption among
              health plans is driven by claims-audited medical cost reductions. Demonstrating a 45% reduction in NICU
              length of stay and $9,038 in average delivery cost savings provides payers with actuarial justification
              for enterprise contracting.
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
          - type: callout
            title: Need for Independent Multi-Cohort Replication
            body: >-
              While published outcomes in ISPOR, ACOG, and SMFM conferences show strong clinical efficacy, studies have
              been executed in collaboration with company-selected academic partners. Proving consistent savings across
              diverse, unselected regional Medicaid plans remains critical for sustained category leadership.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Alternative Landscapes and Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              The maternal and women's health market comprises four primary categories of competitive alternatives:
              specialized virtual maternity clinics, generalist digital telehealth platforms, condition-specific point
              solutions, and traditional brick-and-mortar obstetric practices. Third-party directories and market
              trackers position Pomelo Care alongside private telehealth platforms including Midi Health in midlife
              care, Vida Health in chronic condition management, and Nourish in tele-nutrition. However, Pomelo Care
              differentiates itself by operating as an accountable clinical practice covering more than 25 million lives
              across Commercial and Medicaid health plan partnerships. While third-party market directories estimate
              Pomelo Care's annual revenue at $127.6 million, the company has not published audited financial
              statements, making scale comparisons with privately held peers contingent on disclosed funding rounds,
              lives covered, and health plan distribution contracts rather than verified revenue.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP014
      - number: '3.2'
        title: Capability Matrix and Clinical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Unlike digital health front doors that rely on automated chatbots or asynchronous wellness content, Pomelo
              Care deploys fully employed multispecialty clinical teams comprising obstetricians, midwives, nurses,
              doulas, and dietitians with an average response time under five minutes. Rather than positioning its
              services to replace existing healthcare providers, Pomelo deliberately partners with local in-person
              OB-GYN departments to monitor patients and manage complications between clinic appointments. The primary
              clinical differentiator separating Pomelo Care from competing digital health offerings is its
              peer-reviewed validation. In studies evaluating administrative claims across nearly 45,000 deliveries from
              six commercial and Medicaid health plans, sustained patient engagement with Pomelo Care for three months
              or longer was linked to a 24.4% reduction in preterm births and a 26% decline in NICU length of stay,
              establishing a rigorous clinical evidence standard that app-based competitors have not demonstrated.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP010
              - CP011
      - number: '3.3'
        title: Pricing, Packaging, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care structures its commercial model around enterprise contracts with health plans and self-insured
              employers, offering virtual care at zero out-of-pocket cost to eligible members. In contrast to point
              solutions that charge traditional per-member-per-month (PMPM) access fees or fee-for-service visit
              charges, Pomelo aligns its economics with payer return on investment. The company reports that 36 health
              plan partners achieve a 2x to 4x claims-based ROI driven by fewer preterm deliveries and reduced neonatal
              intensive care admissions. Major payers including UnitedHealthcare and Aetna are raising contracting
              standards, requiring verifiable claims-based outcomes to justify contracted spend. However, this
              value-based contracting structure exposes Pomelo Care to displacement risk if payers demand greater shared
              downside risk or attempt to build internal care-management programs to capture neonatal cost savings.
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Multi-Homing, and Strategic Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Pomelo Care's competitive positioning reveals significant advantages in clinical integration
              coupled with clear market vulnerabilities. The company's expansion beyond maternity into pediatrics and
              midlife care widens member lifetime value and provides defense against single-condition point solutions
              such as Midi Health. High clinical touch, rapid response times, and local physician collaboration generate
              substantial switching costs for participating health plans and patients. Nevertheless, moat durability
              faces headwinds from payer multi-homing, potential commoditization of telehealth triage, and clinical
              labor constraints. If dominant payers contract with multiple virtual providers simultaneously or develop
              proprietary digital triage systems, Pomelo Care's pricing power and enrollment exclusivity could diminish.
              Sustaining competitive leadership requires Pomelo to continuously defend its clinical claims advantage
              across diverse Medicaid and commercial payer populations.
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical Accountability as a Competitive Wedge
            body: >-
              Pomelo Care's competitive moat rests on published, peer-reviewed claims data and deep collaboration with
              community OB-GYNs rather than consumer app engagement. By demonstrating statistically significant
              reductions in preterm births and NICU stays across 45,000 deliveries, Pomelo establishes an outcomes-based
              contracting barrier that generalist digital health point solutions and non-clinical maternity trackers
              cannot easily replicate.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care monetizes its platform through business-to-business enterprise contracts with commercial
              health plans, Medicaid managed care organizations, and self-insured employers. Under these institutional
              arrangements, clinical and navigation services are delivered at zero out-of-pocket cost to eligible
              enrolled members and dependents. Commercial agreements typically deploy per-member-per-month (PMPM) or
              per-engaged-delivery case fees paired with value-based incentive structures tied to measurable reductions
              in high-cost maternal events. The company has rapidly scaled its contracted footprint to more than 25
              million covered lives across 46 states, including partnerships covering over one in six Medicaid
              beneficiaries nationwide. However, value-based contracting in maternal healthcare remains operationally
              complex, requiring bespoke alignment with each payer on risk corridors and attribution benchmarks. Public
              third-party platform directories such as Owler estimate annual platform revenues between $100K and $5.0M,
              highlighting the absence of audited commercial figures and the opacity surrounding realized enterprise
              contract value.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI005
              - CI011
      - number: '4.2'
        title: Cost Structure, Gross Margin Drivers, and Service Delivery
        blocks:
          - type: paragraph
            body: >-
              In contrast to pure-software digital navigation vendors, Pomelo Care functions as a full-stack virtual
              medical practice with a labor-intensive cost structure. The company employs multidisciplinary clinical
              teams around the clock, deploying obstetrician-gynecologists, certified nurse midwives, nurses,
              dietitians, and pediatric specialists who provide continuous 24/7 care via text, video, and phone.
              Furthermore, Pomelo's acquisition of The Doula Network integrated community-based, in-person doula care
              into its service bundle, introducing direct physical labor expenses and credentialed provider network
              overhead. This clinical delivery model incurs substantial direct medical personnel salaries, state
              licensing compliance expenses across 46 jurisdictions, and malpractice insurance liabilities that
              structurally compress gross margins below typical software industry benchmarks. These high service
              delivery expenses must be offset by high-volume payer risk contracts targeting national maternal expense
              pools that exceed $76,000 per NICU stay and $26 billion in annual preterm delivery spend.
            claimRefs:
              - CI008
              - CI009
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI006
              - CI009
              - CI011
      - number: '4.3'
        title: Economic ROI Dynamics and Value-Based Payer Translation
        blocks:
          - type: paragraph
            body: >-
              The economic underwriting foundation of Pomelo Care rests on converting proactive clinical risk detection
              into hard claims-based savings for risk-bearing payers. In multicenter claims analyses presented at ACOG
              and published in the Society for Maternal-Fetal Medicine (SMFM) Pregnancy journal in collaboration with
              Penn LDI, Pomelo demonstrated significant reductions in avoidable medical utilization. Prenatal engagement
              was associated with a 45% reduction in neonatal intensive care unit (NICU) length of stay, a 63% decline
              in delivery-related NICU costs, and a $9,038 reduction in average total maternity episode expense. A
              documented dose-response effect revealed that patients engaged prenatally for three months or longer
              experienced a 24.4% reduction in preterm births and over 26% lower NICU length of stay. These
              claims-verified clinical improvements underpin the company's reported 3-5x customer return on investment,
              providing the economic justification for payers to absorb ongoing PMPM fees and fund hybrid doula care
              integration.
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI004
              - CI006
              - CI007
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care capitalized its national expansion in January 2026 by raising $92 million in Series C funding
              led by Stripes at a $1.7 billion post-money valuation, bringing cumulative equity capital raised to
              $171.07 million. Corporate capitalization disclosures reflect standard institutional terms, including a
              1.0x non-participating liquidation preference on Series C preferred shares. Despite achieving unicorn
              status, secondary market tracking via Forge Global indicates limited liquidity with no established
              transaction pricing. From an institutional underwriting perspective, Pomelo's financial profile presents a
              sharp dichotomy: clinical outcomes and claims-based ROI are unusually well documented across peer-reviewed
              publications, yet core financial fundamentals—including audited GAAP revenue, net revenue retention,
              software-to-service gross margins, customer concentration, and ongoing cash burn—remain undisclosed
              private data. Until verified financial statements corroborate whether top-line ARR justifies a $1.7
              billion multiple, investment underwriting must treat revenue scale and margin durability as unconfirmed
              diligence gaps.
            claimRefs:
              - CI001
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Documented Episode-Level Claims ROI Drives Payer Adoption
            body: >-
              Pomelo Care's presentation of claims-based data showing $9,038 in average episode cost reductions and a
              45% decrease in NICU length of stay offers quantifiable economic proof that directly addresses commercial
              and Medicaid health plans' highest-cost maternity care drivers.
            calloutType: strength
            claimRefs:
              - CI002
              - CI006
              - CI013
          - type: callout
            title: Clinical Service Labor Intensity Limits Software-Like Operating Leverage
            body: >-
              Unlike pure digital navigation platforms, Pomelo employs full-time clinical teams across 46 states and
              acquired in-person doula operations. This clinical delivery overhead constrains gross margins to provider
              services ranges, creating structural operating cost drag that requires sustained payer volume to offset.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
          - type: callout
            title: Extreme Valuation Multiple Over Disclosed Financial Fundamentals
            body: >-
              At a $1.7 billion post-money valuation with $171.07 million in total equity raised, Pomelo Care trades at
              a premium unicorn valuation. However, third-party directory estimates of $100K to $5.0M in revenue
              highlight the total lack of verified public revenue figures, making audited revenue verification the
              primary underwriting blocker.
            calloutType: insight
            claimRefs:
              - CI001
              - CI010
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Care Program Portfolio
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care operates a specialized virtual medical practice focused on maternal, pediatric, and women's
              health throughout pregnancy, postpartum recovery, and beyond. Rather than providing isolated digital
              content or standalone tracking tools, the company delivers continuous virtual care through assigned
              multidisciplinary teams. These teams consist of nurse care partners, certified nurse-midwives,
              board-certified obstetricians and gynecologists, pediatricians, registered dietitians, doulas, and
              lactation consultants who interact directly with patients. Patient access is facilitated through a unified
              member interface offering asynchronous SMS and in-app messaging, phone support, and synchronous video
              consultations 24 hours a day, seven days a week. The company reports a median response time of under five
              minutes for incoming member inquiries. Operating primarily through contracts with commercial health plans
              and Medicaid managed care organizations, Pomelo has expanded its core care scope beyond traditional
              perinatal management into fertility and preconception counseling, pediatric transition support, and
              midlife healthspan care.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE009
      - number: '5.2'
        title: Clinical Workflow and Provider Network Integration
        blocks:
          - type: paragraph
            body: >-
              A central operational tenet of Pomelo Care's model is clinical collaboration with in-person obstetric
              providers rather than direct patient replacement. In payer partnership deployments, such as its
              integration with Dell Children's Health Plan for STAR Medicaid beneficiaries, Pomelo serves as an
              after-hours and between-visit virtual partner. The virtual practice manages non-urgent clinical triage,
              conducts preliminary intake and first-time prenatal consultations, and coordinates routine baseline
              laboratory work. By offloading time-intensive between-visit patient communications, the platform
              alleviates administrative burden and clinical burnout for community obstetric clinics while maintaining
              continuous surveillance over high-risk patients. Peer-reviewed research presented at the SMFM 2026
              Pregnancy Meeting validates this collaborative approach, showing that sustained prenatal engagement drives
              substantial reductions in maternal morbidity and neonatal complications. Specifically, pregnant members
              who lack extensive prior medical claims history frequently exhibit elevated risks for gestational
              hypertension that Pomelo's between-visit monitoring successfully identifies and mitigates.
            claimRefs:
              - CE002
              - CE005
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE011
      - number: '5.3'
        title: Technology Stack and Clinical Data Architecture
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care's technical operating model connects member engagement channels, clinical decision support
              software, and external health data feeds into an integrated virtual care platform. The software
              architecture ingests clinical data from regional Health Information Exchanges (HIEs) alongside continuous
              remote patient monitoring (RPM) telemetry, such as connected blood pressure cuffs and patient-reported
              symptoms. Proprietary clinical playbooks and predictive risk models process this inbound clinical stream
              to surface evolving complications—including gestational diabetes, preeclampsia, and perinatal mood
              disorders—weeks before they typically trigger emergency room visits or inpatient admissions. Clinicians
              interact with these prioritized patient insights through specialized provider dashboards that track care
              gaps and suggest protocolized interventions. This data-driven care delivery infrastructure allows employed
              clinicians to monitor thousands of covered lives across distributed geographic regions without sacrificing
              clinical responsiveness or adherence to evidence-based practice guidelines.
            claimRefs:
              - CE006
              - CE012
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE007
              - CE014
      - number: '5.4'
        title: Differentiation, Compliance Controls, and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care's primary competitive differentiation stems from its fully employed multispecialty clinical
              workforce, value-based payer integration, and proprietary clinical risk detection engine. In contrast to
              marketplace directories, transactional telehealth portals, or self-service pregnancy tracking apps, Pomelo
              assumes clinical responsibility for longitudinal patient outcomes alongside payer partners. To handle
              protected health information (PHI) across state Medicaid programs and employer health plans, Pomelo
              maintains verified administrative and technical safeguards, holding SOC 2 Type II certification and strict
              HIPAA compliance controls. However, significant technical and operational risks remain. The platform's
              early-warning capabilities rely heavily on the timeliness and fidelity of third-party HIE feeds and payer
              claims integration, which often suffer from latency or incomplete electronic record formatting.
              Furthermore, independent architectural benchmarking and algorithmic auditing of Pomelo's software
              components have not been made available in the public domain, representing a diligence gap regarding the
              extent to which automation scales independent of clinical labor costs.
            claimRefs:
              - CE007
              - CE008
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dose-Response Dynamic in Virtual Maternal Care
            body: >-
              Peer-reviewed findings from SMFM 2026 indicate that clinical impact compounds over time, with preterm
              birth reductions expanding from 11.0% at one month to 24.4% at three or more months of prenatal
              engagement. This suggests that earlier patient onboarding is critical to maximizing clinical and financial
              returns.
            calloutType: insight
            claimRefs:
              - CE005
              - CE010
          - type: callout
            title: HIE Interoperability and Clinical Labor Intensity
            body: >-
              Pomelo's technical workflow relies heavily on external Health Information Exchange ingestion and
              responsive provider teams. Any delays in external data integration or clinician staffing constraints could
              impair the platform's ability to maintain its sub-5-minute triage window and early complication detection.
            calloutType: risk
            claimRefs:
              - CE004
              - CE008
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Buyer-Payer Landscape
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care operates a business-to-business-to-consumer (B2B2C) commercial model that sells virtual care
              solutions to enterprise healthcare payers, including commercial health plans, Medicaid managed care
              organizations (MCOs), and self-insured employers, while delivering services directly to pregnant and
              postpartum individuals at zero out-of-pocket cost. In the commercial health plan segment, insurers
              contract with Pomelo to mitigate maternal morbidity and costly neonatal intensive care unit (NICU)
              admissions among commercially insured populations, where cesarean deliveries and neonatal complications
              generate high commercial reimbursement spend. For Medicaid managed care plans, Pomelo addresses acute
              access disparities across maternal care deserts, providing 24/7 multimodal virtual access for low-income
              mothers with high comorbidity burdens. Self-insured employers deploy Pomelo as a specialized maternal and
              pediatric health benefit to reduce employee turnover, lower emergency room expenditures, and support
              working parents. A complementary alignment exists with academic health systems and regional OB-GYN
              practices, which partner with Pomelo to provide continuous monitoring between scheduled in-person
              appointments, establishing a trusted collaborative clinical network rather than a competitive telemedicine
              substitute.
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: Adoption Trajectory & Covered Lives Expansion
        blocks:
          - type: paragraph
            body: >-
              Since its founding in 2021, Pomelo Care has experienced rapid commercial expansion, scaling from tracking
              toward two million covered lives across 44 states in mid-2023 to more than 25 million covered lives by
              January 2026. This trajectory reflects widespread enterprise contracting with national and regional health
              plans seeking evidence-based maternity management. By early 2026, Pomelo reported that its contracted
              payer footprint covered nearly 7% of all annual births in the United States, representing a significant
              national market penetration in maternal healthcare delivery. Enterprise onboarding relies on an automated
              eligibility intake that matches covered lives with dedicated multispecialty care teams within minutes,
              maintaining a median clinician response time of under five minutes and driving high patient satisfaction
              ratings of 4.9 out of 5. To expand wallet share across existing customer accounts, Pomelo recently
              introduced pediatric care and a midlife health program addressing perimenopause and menopause,
              transforming the company from an episodic maternity point solution into a longitudinal healthcare platform
              across women's and children's lifespans.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU012
      - number: '6.3'
        title: Named Customer Deployments & Outcome Proof
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care's enterprise customer roster includes prominent national and regional healthcare institutions
              spanning commercial payers, Medicaid MCOs, and self-insured employers. Verified enterprise deployments
              include Elevance Health, Healthy Blue Nebraska, Nebraska Total Care (a Centene affiliate), Penn Medicine,
              Mount Sinai Health System, and Koch Industries. Customer reference quality is reinforced by empirical
              clinical outcomes validated through peer-reviewed research. In a flagship 2026 study conducted in
              collaboration with the Leonard Davis Institute of Health Economics at the University of Pennsylvania (Penn
              LDI) and presented at the Society for Maternal-Fetal Medicine (SMFM), researchers analyzed administrative
              claims data from 44,988 deliveries across six large health plans. The study demonstrated a dose-response
              clinical benefit: patients engaged with Pomelo for three or more months experienced a 24.4% reduction in
              preterm births and an over 26% reduction in NICU length of stay. These claims-based outcomes directly
              underpin Pomelo's commercial proposition, enabling the company to market a 3-5x return on investment to
              payer procurement committees based on reductions in NICU days, emergency department visits, and avoidable
              obstetric complications.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU007
              - CU008
      - number: '6.4'
        title: Durability, Retention Dynamics & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite demonstrated clinical efficacy and national covered lives growth, Pomelo Care faces commercial
              durability and customer concentration risks inherent to enterprise healthcare contracting. Virtual care
              procurement is highly crowded, with industry analysts at Tracxn tracking over 1,048 active competitors in
              virtual healthcare, including 115 funded entities and well-capitalized providers such as Ro, One Medical,
              and HealthTap competing for payer and employer mindshare. Furthermore, Pomelo has not publicly disclosed
              key customer retention metrics, including net revenue retention (NRR), gross revenue retention (GRR),
              multi-year contract renewal rates, or annual customer churn. Secondary market trading on Forge Global
              indicates limited liquidity without public clearing share prices, reflecting pre-IPO opacity. Because
              health plan contracting typically concentrates significant covered lives within a small number of large
              national insurers (such as Elevance and Centene affiliates), the loss or contract renegotiation of a
              single key payer represents a material risk to Pomelo's commercial scale. Evaluating multi-year cohort
              retention and revenue concentration remains the principal diligence priority for underwriting long-term
              commercial durability.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dose-Response Evidence Creates Payer Retention Moat
            body: >-
              Peer-reviewed SMFM findings demonstrating that maternal risk reductions compound with engagement duration
              (from an 11.0% preterm birth reduction at month one to 24.4% at three months) provide Pomelo with unique
              quantitative defense during health plan contract renewals.
            calloutType: insight
            claimRefs:
              - CU008
              - CU009
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and Threat Topology
        blocks:
          - type: paragraph
            body: >-
              Underwriting Pomelo Care at its $1.7 billion Series C valuation requires balancing compelling clinical
              outcome metrics against severe counterparty, regulatory, and labor risks inherent in healthcare delivery.
              The company raised $92 million in fresh equity capital in January 2026, bringing total disclosed funding
              to $171 million and providing an estimated multi-year operational runway. However, Pomelo operates with
              acute structural dependencies: its commercial engine relies on value-based reimbursement with health plans
              across commercial and Medicaid books covering 25 million lives. Failure to continuously demonstrate
              documented reductions in preterm births or emergency department visits creates downside risk of
              value-based clawbacks or contract non-renewals. Furthermore, private secondary market data establishes
              that Series C preferred shares carry a 1.0x non-participating liquidation preference, creating an overhang
              structure that requires substantial sustained valuation growth to return capital to common holders. In the
              absence of audited financial statements, investors must treat contract durability and clinical labor
              inflation as central risk vectors.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR011
              - CR014
      - number: '7.2'
        title: Regulatory, Legal, and Licensure Exposure
        blocks:
          - type: paragraph
            body: >-
              Operating a national virtual maternity and women's healthcare platform introduces complex multi-state
              regulatory friction that scales directly with geographic reach. Pomelo Care employs a multidisciplinary
              clinical team—including physicians, certified nurse-midwives, registered nurses, and therapists—who must
              maintain individual state licensures and comply with divergent scope-of-practice and physician supervision
              regulations across each state. To navigate state-level Corporate Practice of Medicine doctrines, Pomelo
              must maintain carefully separated professional corporations and administrative service agreements,
              creating legal vulnerability if state regulators or medical boards challenge entity governance. Because
              Pomelo positions its virtual care platform as a supplement to in-person obstetricians and midwives rather
              than a substitute physical clinic, clinical coordination breakdowns during acute maternal emergencies
              present ongoing medical malpractice exposure. Additionally, integrating bidirectional administrative
              claims data from health plan partners requires strict compliance with HIPAA privacy standards and state
              healthcare privacy laws, where data breaches or unauthorized access would trigger severe statutory
              penalties and immediate payer contract terminations.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Operational Execution, Clinical Care Quality, and Platform Security
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care's operational reliability centers on its ability to deliver around-the-clock multispecialty
              clinical access with a targeted median response time of under five minutes. Maintaining this rigorous
              service level across 25 million covered lives requires substantial clinical headcount and flexible shift
              scheduling, leaving the business exposed to rising clinical wage inflation and provider burnout. Clinical
              failure modes represent severe downside risks: pregnancy-related complications can deteriorate rapidly,
              meaning any virtual triage delay, communication outage, or missed risk flag could result in adverse
              perinatal outcomes, neonatal intensive care unit admissions, or fatal events. On the technical
              infrastructure side, Pomelo is actively developing and deploying artificial intelligence tooling to
              automate documentation and assist clinical decision workflows. While AI integration aims to improve
              provider leverage, it introduces latent failure modes including model hallucinations, diagnostic bias, and
              unmonitored prompt drift that could compromise clinical judgment. Ensuring rigorous peer-reviewed clinical
              validation and maintaining redundant clinical escalation protocols remain non-negotiable operational
              imperatives.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Partner Dependencies, Payer Concentration, and Financial Model Risks
        blocks:
          - type: paragraph
            body: >-
              The durability of Pomelo Care's business model is fundamentally tied to its relationships with a
              concentrated group of commercial health plans, Medicaid managed care organizations, and self-insured
              employers. Because Pomelo provides care at zero out-of-pocket cost to covered members, revenue is entirely
              dependent on payer partner contracts, enterprise retention, and value-based risk reconciliations. If a
              single anchor health plan renegotiates fee-for-service rates, alters shared-savings benchmarks, or
              insources virtual maternity navigation, Pomelo faces immediate top-line compression. Furthermore, the
              company's strategic transition from focused maternity care into comprehensive pediatric, hormonal, and
              midlife healthspan programs introduces significant clinical execution risk. Broadening clinical scope
              dilutes operational focus, strains specialized staffing, and forces Pomelo to compete directly against
              established point solutions and legacy provider networks. In the absence of disclosed churn rates or
              audited unit contribution margins, underwriting must incorporate explicit stress tests against payer
              recontracting and extended pilot conversion delays.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Warning: Concentration in Payer Value-Based Contracts and Clinical Wage Inflation'
            body: >-
              Pomelo Care's economics depend on demonstrating net cost savings and maintaining 24/7 multidisciplinary
              response times across 25 million covered lives. If payer contracts experience clawbacks or clinical
              staffing costs surge, operating margins face severe compression.
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
              - CR014
          - type: callout
            title: 'Diligence Priority: Audit Payer Contract Renewal Rates and Outcome Settlement Clauses'
            body: >-
              Prior to underwriting later-stage capital or secondary transactions, investors must audit Pomelo Care's
              payer renewal rates, medical-loss-ratio shared-savings settlement mechanics, and cross-state clinician
              credentialing compliance.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR006
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Stance
        blocks:
          - type: paragraph
            body: >-
              Pomelo Care merits continued diligence, not a price-insensitive investment recommendation. The positive
              case combines a large contracted distribution footprint, reported clinical outcome associations, and a
              payer-oriented value proposition. The limiting fact is that the January 2026 financing mark is visible
              while the operating denominator needed to judge it is not: the assigned sources do not provide audited
              revenue, gross margin, retention, burn, active-patient conversion, or customer concentration. That
              imbalance supports a research-more recommendation with medium confidence, a high risk rating, and a
              stretched valuation stance. Entry discipline should therefore be tied to verified operating and
              capitalization evidence rather than to the round valuation alone.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV013
              - CV014
      - number: '8.2'
        title: Financing Context and Price Support
        blocks:
          - type: paragraph
            body: >-
              The January 8, 2026 Series C raised $92 million at a reported $1.7 billion post-money valuation. Forge
              reports cumulative funding of $171.07 million and a prior Series B post-money mark of $499.22 million,
              implying that the financing mark increased about 3.4 times between June 2024 and January 2026. That change
              is a comparison of preferred-round marks, not investment performance, revenue growth, or cash available.
              Forge also shows no available Forge Price and labels market activity limited, so the assigned evidence
              offers no observable secondary transaction with which to test the round price. Its financing table
              provides a partial preference signal, but not a complete cap table or proceeds waterfall.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Thesis, Anti-Thesis, and Scenarios
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Pomelo can translate payer access into sustained engagement, measurable
              claims savings, and repeatable expansion across women's and children's health. Company materials report
              more than 25 million covered lives, nearly 7% of U.S. births supported, and 3-5x customer ROI; a 2026
              claims study reported stronger outcomes with at least three months of engagement. The anti-thesis is
              equally important: covered lives are eligible populations, not active patients, the ROI figure remains
              company-issued, and the cited study is observational rather than a randomized guarantee. Expansion into
              pediatrics and midlife care widens the opportunity but introduces different evidence, reimbursement,
              referral, and staffing requirements. These uncertainties support conditional scenarios, not precise
              valuation forecasts.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish exit readiness or a supportable target return. Forge characterizes
              market activity as limited and does not display a matched price, while its own disclosures caution that
              private securities are highly speculative and illiquid. Before underwriting a new round or secondary
              purchase, investors should reconcile audited financial statements to contract-level revenue, test active
              enrollment and sustained engagement against the covered-life denominator, review renewal and concentration
              by payer, and model the fully diluted capitalization and liquidation waterfall. Thesis-break triggers
              should include failure to reproduce outcomes across payer cohorts, weak conversion from eligibility to
              sustained care, adverse renewal evidence, or financing terms that subordinate new capital without a
              compensating entry discount.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Requires Private Evidence
            body: >-
              Treat $1.7 billion as the latest financing mark, not as independently verified fair value. A new
              investment should be contingent on audited economics, payer-level retention and concentration, active
              engagement cohorts, cash runway, and the fully diluted liquidation waterfall.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV013
              - CV014
          - type: callout
            title: Eligibility Is Not Utilization
            body: >-
              More than 25 million covered lives demonstrate distribution capacity, but they do not establish active
              patients, revenue, or retention. Valuation support depends on how many eligible members engage long enough
              to generate reproducible outcomes and payer savings.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV009
