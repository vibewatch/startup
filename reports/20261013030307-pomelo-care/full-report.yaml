  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: The evidence chain supports continued diligence but stops before a price-supported investment recommendation.
    data:
      nodes:
        - id: financing-mark
          label: $1.7B post-money financing mark
          detail: January 2026 Series C provides a current preferred-round reference.
        - id: distribution
          label: Large eligibility footprint
          detail: Company reports more than 25M covered lives, not active patients.
        - id: clinical-proof
          label: Promising claims evidence
          detail: Reported outcomes improve with longer engagement, but the design is observational.
        - id: operating-gap
          label: Operating denominator missing
          detail: Revenue, margins, retention, burn, concentration, and engagement conversion are not disclosed.
        - id: liquidity-gap
          label: No observed market price
          detail: Forge reports limited activity and no available Forge Price.
        - id: recommendation
          label: Research more
          detail: Condition valuation and target returns on verified private evidence and entry terms.
      edges:
        - from: financing-mark
          to: distribution
          label: prices expected scale
        - from: distribution
          to: clinical-proof
          label: requires sustained engagement
        - from: clinical-proof
          to: operating-gap
          label: does not reveal economics
        - from: operating-gap
          to: liquidity-gap
          label: prevents price triangulation
        - from: liquidity-gap
          to: recommendation
          label: enforces entry discipline
    approximationNotes: Qualitative logic only; the flow does not imply a numeric conversion rate, valuation multiple, or probability.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV013
      - CV016
