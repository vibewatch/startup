  - id: TV001
    title: Recommendation Summary
    columns:
      - Decision dimension
      - Assessment
      - Evidence-bounded implication
    rows:
      - - Recommendation
        - research-more
        - Continue diligence, but do not treat the latest preferred-round mark as independently validated fair value.
      - - Confidence
        - medium
        - Financing and covered-life figures are current, while core operating and cap-table inputs remain private.
      - - Risk rating
        - high
        - >-
          Illiquidity, limited observed market activity, clinical labor requirements, and undisclosed economics
          constrain underwriting.
      - - Valuation stance
        - stretched
        - The $1.7B post-money mark is not supported by public revenue, margin, retention, burn, or active-patient data.
      - - Decision implication
        - Condition any price on private evidence
        - >-
          Require verified economics, cohort engagement, renewals, concentration, cash runway, and the liquidation
          waterfall.
    notes: >-
      Assessments use the January 2026 preferred-round mark and assigned public sources; they are not a fair-value
      opinion or a secondary-market quote.
