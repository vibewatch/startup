evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements, GAAP revenue breakdown, gross margin profile, and current operating cash burn rate.
    whyItMatters: >-
      Essential for evaluating operating leverage, margin viability, and balance sheet runway against a $1.7 billion
      post-money valuation.
    diligencePath: Request confidential historical income statement, balance sheet, and rolling 12-month cash forecast under NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance
    missingEvidence: Complete listing of executive officers, vice presidents, medical directors, and independent board directors.
    whyItMatters: Necessary to assess key-person dependence on the founder and confirm clinical governance oversight mechanisms.
    diligencePath: Review full corporate governance disclosures, executive committee charters, and management team directory.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization-and-investors
    missingEvidence: >-
      Detailed capitalization table showing ownership percentages, share classes, liquidation preference multiples, and
      option pool allocation.
    whyItMatters: >-
      Critical to model investor waterfall distributions, voting control dynamics, and downside returns across preferred
      share series.
    diligencePath: >-
      Obtain certified capitalization table and latest restated certificate of incorporation directly from company legal
      counsel.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: payer-contract-pricing
    missingEvidence: >-
      Audited per-member-per-month (PMPM) fee schedules, case-rate pricing bands, and value-based shared-savings
      contract percentages across commercial and Medicaid plans.
    whyItMatters: >-
      Without contract pricing mechanics, bottom-up serviceable market sizing (SAM and SOM) cannot be separated from
      gross underlying health plan covered lives.
    diligencePath: >-
      Review blinded customer contract exhibits and PMPM realization schedules during access-granted financial
      diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Audited financial statements, ARR, gross margins, and customer churn rates for Pomelo Care and private competitors
      such as Midi Health, Vida Health, and Nourish.
    whyItMatters: >-
      Without audited financial disclosures, market share and unit economics comparisons rely on unaudited estimates
      like GetLatka ($127.6M) rather than verified GAAP revenue.
    diligencePath: Request confidential CIMs or audited financial disclosures from management during underwriting diligence.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: underwriting-gap
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, gross margin breakdown between software and clinical
      services, sales and marketing CAC, and net cash burn.
    whyItMatters: >-
      Without audited income and cash flow statements, an institutional investor cannot verify whether Pomelo Care's
      $1.7 billion valuation is supported by sustainable unit economics or high-burn growth.
    diligencePath: >-
      Request confidential management financial package including audited 2024-2025 financial statements, 2026
      year-to-date income statements, cohort retention tables, and forward budget.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: algorithm-transparency-and-independent-evaluation
    missingEvidence: >-
      Access to technical white papers, algorithmic validation benchmarks, or independent code and architecture reviews
      evaluating Pomelo's risk-detection software stack.
    whyItMatters: >-
      Without independent software audits, investors cannot verify whether risk identification is driven by automated
      algorithmic decision support or predominantly by manual clinical labor.
    diligencePath: >-
      Request architecture diagrams, data pipeline SLAs, software engineering documentation, and external clinical
      algorithm validation reports during technical diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), annual logo churn, and payer revenue
      concentration metrics broken down by Medicaid MCO vs commercial employer accounts.
    whyItMatters: >-
      Without contract renewal rates and customer concentration data, it is impossible to verify whether the 25M covered
      lives base generates durable recurring economics or relies heavily on a few anchor health plans.
    diligencePath: >-
      Request historical cohort retention tables, customer concentration schedules (top 5 payers as % of revenue), and
      average contract duration during management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Complete roster of all 44 state health plan and employer contracts underlying Pomelo Care's 25 million covered
      lives footprint.
    whyItMatters: >-
      Public sources only reveal a sample of prominent partners (Elevance Health, Healthy Blue Nebraska, Nebraska Total
      Care, Penn Medicine, Mount Sinai), leaving the broader contract distribution unverified.
    diligencePath: >-
      Obtain the full enterprise customer registry, including lives covered per health plan and revenue contribution by
      account.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: payer-concentration-renewal
    missingEvidence: >-
      Audited customer-level revenue concentration, annual contract renewal rates, and shared-savings settlement
      reconciliations across health plan partners.
    whyItMatters: >-
      High customer concentration among top health plans or adverse shared-savings clawbacks would directly destabilize
      Pomelo Care's revenue predictability.
    diligencePath: >-
      Request cohort-level retention schedules, top-5 payer revenue breakdown, and value-based contract reconciliations
      during confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: regulatory-compliance-and-litigation-diligence
    missingEvidence: >-
      State-by-state clinical entity corporate structuring documents, corporate practice of medicine opinion letters,
      and formal multi-state licensing verification.
    whyItMatters: >-
      Discrepancies in multi-state corporate practice of medicine compliance or nurse-midwife supervisory agreements
      could trigger state medical board enforcement or billing suspensions.
    diligencePath: >-
      Obtain corporate formation documents for affiliated professional entities (PCs/PLLCs) and review state medical
      board compliance filings in key operational states.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
