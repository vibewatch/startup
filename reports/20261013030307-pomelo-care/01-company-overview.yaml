callouts:
  - calloutType: strength
    title: Rigorous Clinical Validation and Payer Alignment
    body: >-
      Pomelo Care differentiates itself from surface-level digital health apps by anchoring its commercial pitch on
      peer-reviewed claims data [CO008]. Independent academic collaboration with Penn LDI demonstrates that three or
      more months of prenatal engagement yields a 24.4% reduction in preterm births and over 26% shorter NICU lengths of
      stay [CO008], directly driving economic savings for health plans covering over 25 million lives [CO006].
    claimRefs:
      - CO006
      - CO008
  - calloutType: risk
    title: Financial Information Asymmetry at a $1.7B Valuation
    body: >-
      Despite achieving unicorn status through its $92 million Series C round led by Stripes [CO002], Pomelo Care
      maintains strict confidentiality around GAAP revenue, operating margins, customer concentration, and cash burn
      [CO014]. Third-party estimates such as GetLatka's $127.6 million figure remain speculative [CO013], leaving
      prospective investors reliant on private diligence to verify whether growth justifies the valuation multiple
      [CO014].
    claimRefs:
      - CO002
      - CO013
      - CO014
