company:
  name: Pomelo Care
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pomelo Care is a New York-based virtual medical care platform providing 24/7 maternity-to-midlife healthcare for
    women and infants, covering over 25 million lives across commercial and Medicaid health plans. Founded in 2021 by
    CEO Marta Bralic Kerns, the company reached a $1.7 billion valuation in January 2026 with a $92 million Series C led
    by Stripes, though audited financials remain undisclosed.
sections:
  - id: executive-summary-and-identity
    title: Corporate Identity and Core Mission
    body: >-
      Pomelo Care is an evidence-based virtual medical care platform operating at the intersection of maternal, infant,
      and women's healthcare [CO001]. Founded in 2021 by healthcare technology executive Marta Bralic Kerns and
      headquartered in New York City, the company was established to address systemic shortcomings in maternal and
      infant outcomes across the United States [CO001]. Unlike traditional consumer digital health applications that
      rely on wellness tracking or asynchronous educational content, Pomelo operates as a licensed clinical provider
      delivering 24/7 personalized care through dedicated multispecialty medical teams [CO007]. Its clinical model
      integrates medical doctors, midwives, nurses, therapists, dietitians, and doulas who collaborate with in-person
      obstetricians and pediatricians to close care gaps between routine clinical visits [CO005, CO007]. By aligning
      with major commercial payers, Medicaid health plans, and enterprise employers, Pomelo has scaled its contractual
      coverage to more than 25 million lives nationwide [CO006]. The platform provides comprehensive support across the
      reproductive lifecycle, including preconception and fertility guidance, pregnancy monitoring, postpartum recovery,
      pediatric primary care, and specialized midlife perimenopause programs [CO007]. The accompanying Snapshot KPI
      Table summarizes the primary verified metrics and operational parameters defining Pomelo Care's current corporate
      footprint.
    claimRefs:
      - CO001
      - CO006
      - CO007
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership, Founders, and Corporate Governance
    body: >-
      Pomelo Care was founded and continues to be led by Marta Bralic Kerns, who serves as Chief Executive Officer and
      principal executive director [CO001, CO004]. Prior to establishing Pomelo Care, Kerns accumulated extensive
      executive experience in health technology and real-world clinical data as a senior vice president at Flatiron
      Health, providing critical founder-market fit for navigating complex healthcare data workflows and payer
      reimbursement structures [CO004]. Corporate governance remains closely held, reflecting the company's private
      venture-backed status, with primary executive decision-making centered around Kerns and functional leads
      overseeing clinical operations, data engineering, and communications [CO004]. While primary company filings and
      investor profiles confirm Kerns as the sole founder and Chief Executive Officer [CO001, CO002], third-party data
      aggregators exhibit notable discrepancies [CO005]. Specifically, GetLatka erroneously identified Eric Frenkiel as
      CEO in its September 2025 profile [CO005], highlighting the prevalence of automated scraping errors among
      secondary financial directories and reinforcing the necessity of primary-source validation [CO004, CO005].
      Complete board committee structures and equity voting agreements remain private, creating key-person reliance on
      the founder that requires standard investor oversight. The Leadership and Founder Table details known executive
      leadership and governance parameters.
    claimRefs:
      - CO001
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: capitalization-and-investors
    title: Financing History and Capital Structure
    body: >-
      Pomelo Care's capital structure has expanded rapidly through four major venture funding rounds, culminating in a
      landmark $92 million Series C financing announced in January 2026 [CO002]. The round was led by growth equity firm
      Stripes, with participation from prominent healthcare and technology venture firms including Andreessen Horowitz,
      Atomico, PLUS Capital, BoxGroup, and SV Angel [CO002, CO011]. The Series C financing established a post-money
      valuation of $1.7 billion, positioning Pomelo Care as a unicorn in the virtual women's and family health sector
      [CO002]. Private market databases indicate cumulative capital raised between $171.07 million (reported by Forge
      Global) and $187 million across six total financings (reported by Tracxn) [CO003]. Historical rounds include a $25
      million Series A led by Andreessen Horowitz in June 2023 and a $46 million Series B co-led by First Round Capital
      and Andreessen Horowitz in June 2024 [CO011, CO015]. Strategic corporate development included the acquisition of
      The Doula Network, expanding Pomelo's capacity to coordinate in-person community doula care with its virtual
      clinical platform [CO012]. Despite this substantial capital backing, Pomelo Care does not publicly disclose GAAP
      revenue, gross margin, or net burn rate [CO014]. Third-party estimates like GetLatka's unverified $127.6 million
      revenue projection remain speculative benchmarks rather than audited figures [CO013, CO014]. The Stakeholder or
      Investor Map outlines the institutional syndicate and key governance priorities.
    claimRefs:
      - CO002
      - CO003
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO003
  - id: milestones-and-clinical-scale
    title: Chronological Milestones and Evidence-Based Scale
    body: >-
      Pomelo Care has maintained an aggressive development cadence centered on establishing peer-reviewed clinical proof
      before scaling commercial payer contracts [CO015]. Following its initial funding in 2021 and institutional rounds
      in 2023 and 2024, the company placed heavy emphasis on evaluating patient outcomes using rigorous administrative
      claims data rather than self-reported survey metrics [CO008, CO015]. In collaboration with the Leonard Davis
      Institute of Health Economics at the University of Pennsylvania (Penn LDI), Pomelo presented multi-plan outcomes
      at the Society for Maternal-Fetal Medicine (SMFM) 2026 meeting, with findings published in SMFM's Pregnancy
      journal [CO008]. The study analyzed nearly 45,000 deliveries across six health plans and demonstrated a
      dose-response relationship: patients engaged prenatally for three or more months experienced a 24.4% reduction in
      preterm births and a 26% reduction in NICU length of stay [CO008]. Subsequent clinical presentations at ACOG,
      ISPOR, and ARM in 2026 demonstrated a 45% shorter NICU stay and $9,038 in average total episode cost reductions
      for prenatal enrollees [CO009]. Pomelo leverages these clinical reductions in expensive emergency and neonatal
      utilization to market a 3x to 5x return on investment to healthcare payers [CO010]. As illustrated in the Company
      Milestone Timeline, Pomelo has leveraged this clinical foundation to expand beyond maternity into comprehensive
      women's healthcare across 25 million covered lives [CO006, CO015].
    claimRefs:
      - CO006
      - CO008
      - CO009
      - CO010
      - CO015
    figureRefs:
      - FO001
