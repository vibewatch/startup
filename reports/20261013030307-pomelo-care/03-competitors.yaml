    title: Feature / capability matrix
    columns:
      - Buying Criteria
      - Pomelo Care
      - Midi Health
      - Vida Health
      - Traditional In-Person OB-GYN
    rows:
      - - 24/7 Multispecialty Team Access
        - Yes (sub-5-minute median response)
        - Scheduled virtual visits only
        - Asynchronous coaching & video
        - On-call triage with clinic delay
      - - Peer-Reviewed Claims Outcomes
        - Yes (SMFM/Penn LDI claims study)
        - Self-reported symptom relief
        - Self-reported biometric tracking
        - Standard HEDIS quality reporting
      - - Maternal & Pediatric Continuum
        - Yes (Fertility, maternity, NICU, midlife)
        - No (Midlife & perimenopause only)
        - No (General adult cardiometabolic)
        - Maternity only; transitions to pediatrics
      - - In-Person OB-GYN Coordination
        - Yes (Collaborative referral partner)
        - Limited community referrals
        - No formal obstetric coordination
        - Primary provider of physical care
    notes: Capability ratings reflect public disclosures and published clinical study methodology; unsupported vendor comparison features are excluded.
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP010
      - CP011
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider Model
      - Contract Model
      - Included Capabilities
      - Discounts / Unknowns
      - Economic Implication
    rows:
      - - Pomelo Care
        - Payer-paid value-based risk sharing
        - 24/7 care team, remote monitoring, doula support
        - Exact PMPM or shared-savings rate undisclosed
        - Zero out-of-pocket for members; requires 2-4x ROI proof
      - - Specialized Telehealth (Midi / Nourish)
        - In-network FFS billing & employer PMPM
        - Virtual specialist visits & counseling
        - Copays/coinsurance vary by insurance plan
        - Predictable fee-for-service cash flow without downside risk
      - - Generalist Digital Health (Vida)
        - Employer PMPM subscription
        - Coaching app, device integration, content
        - Volume discounting by employer covered lives
        - Subject to digital health benefit consolidation and churn
      - - In-Person Status Quo OB-GYN
        - Fee-for-service episode / global maternity fee
        - In-person visits, lab work, labor & delivery
        - Facility fees and unbundled hospital charges
        - High baseline medical spend; payer bears 100% of complication costs
    notes: Contract terms derived from payer partnership announcements and member terms; private enterprise fee schedules remain undisclosed.
    claimRefs:
      - CP003
      - CP004
      - CP012
      - CP013
