callouts:
  - calloutType: insight
    title: Clinical Accountability as a Competitive Wedge
    body: Pomelo Care's competitive moat rests on published, peer-reviewed claims data and deep collaboration with community OB-GYNs rather than consumer app engagement. By demonstrating statistically significant reductions in preterm births and NICU stays across 45,000 deliveries, Pomelo establishes an outcomes-based contracting barrier that generalist digital health point solutions and non-clinical maternity trackers cannot easily replicate.
    claimRefs:
      - CP002
      - CP004
      - CP005
      - CP010
      - CP011
