callouts:
  - calloutType: risk
    title: 'Underwriting Warning: Concentration in Payer Value-Based Contracts and Clinical Wage Inflation'
    body: >-
      Pomelo Care's economics depend on demonstrating net cost savings and maintaining 24/7 multidisciplinary response
      times across 25 million covered lives. If payer contracts experience clawbacks or clinical staffing costs surge,
      operating margins face severe compression.
    claimRefs:
      - CR001
      - CR011
      - CR014
  - calloutType: recommendation
    title: 'Diligence Priority: Audit Payer Contract Renewal Rates and Outcome Settlement Clauses'
    body: >-
      Prior to underwriting later-stage capital or secondary transactions, investors must audit Pomelo Care's payer
      renewal rates, medical-loss-ratio shared-savings settlement mechanics, and cross-state clinician credentialing
      compliance.
    claimRefs:
      - CR004
      - CR006
      - CR012
