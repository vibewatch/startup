  - id: TR004
    title: People / execution risk register
    columns: [Role or function, Dependency or gap, Likelihood, Severity, Mitigation, Diligence path]
    rows:
      - ['Clinical operations', 'One visible lead-study route means execution quality matters disproportionately', 'Medium', 'High', 'Named PI and regulated protocol exist', 'Request enrollment and monitoring cadence']
      - ['CMC and manufacturing leadership', 'Process performance is central but not publicly quantified', 'Medium-High', 'High', 'Closed-process narrative and manufacturing partners', 'Request org chart and KPI dashboard']
      - ['Regulatory execution', 'Future filings or transfers will require clean comparability work', 'Medium', 'High', 'Existing Korean progress', 'Request regulatory plan and agency interaction log']
      - ['Alliance management', 'External partner set is small and high-leverage', 'Medium', 'Medium-High', 'Multiple visible counterparties already signed', 'Request partner-governance cadence and escalation map']
      - ['Finance and capital planning', 'Delays can quickly become financing events', 'High', 'High', 'Series D and grant history', 'Request runway-to-milestone model']
    notes: >-
      These are the functions where operational slippage would most quickly break the investment thesis.
    claimRefs: [CR031, CR032, CR033, CR034, CR035, CR036, CR037]
  - id: TR005
    title: Mitigation and kill criteria table
    columns: [Risk, Monitorable trigger, Threshold or event, Action implication]
    rows:
      - ['Comparability / CMC transfer', 'Agency feedback or internal validation miss', 'Failed bridge package or major manufacturing change without clean comparability evidence', 'Pause conviction and request full CMC review']
      - ['Clinical safety', 'Serious adverse-event trend', 'Unexpected toxicity pattern or inability to manage known CAR-T toxicities', 'Mark down platform translation probability']
      - ['Manufacturing reliability', 'Batch KPI deterioration', 'Repeated failure, deviation, or delayed-release pattern', 'Treat moat as unproven and model extra capital need']
      - ['Partner concentration', 'Counterparty slowdown or withdrawal', 'Loss of a visible clinical or manufacturing partner without replacement', 'Compress commercial-readiness assumptions']
      - ['Capital adequacy', 'Runway versus next proof point', 'Need for financing before next credible data milestone', 'Assume higher dilution and lower strategic leverage']
      - ['Platform translation', 'CLIP or Switchable advantage disappears in human or translational data', 'No evidence the novel platform features matter clinically', 'Re-rate story toward generic clinical-stage biotech risk']
    notes: >-
      These triggers are the shortest path from risk observation to investment action.
    claimRefs: [CR014, CR018, CR023, CR031, CR038, CR039, CR040]
