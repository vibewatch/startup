      - ['Comparability after manufacturing changes', 'FDA CGT comparability guidance and CAR-T development guidance', 'Korea / U.S. / global', 'No public comparability package disclosed', 'Medium-High', 'Critical', 'Closed-process design and one visible clinical path', 'High', 'Request CMC comparability package, change-control log, and transfer evidence']
