    notes: >-
      The legal register focuses on what is visible in retained sources and the risks that flow directly into clinical progression, not every theoretical biotech legal issue.
    enumerationScope:
      coverage: partial
      basis: Covers the most material regulatory and legal surfaces evidenced in reviewed sources; it is not an exhaustive catalogue of every possible approval, labor, or environmental issue.
