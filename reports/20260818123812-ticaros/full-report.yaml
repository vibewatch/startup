  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk surface
        blocks:
          - type: paragraph
            body: >-
              Ticaros' headline regulatory progress is real but narrow. The public file supports one visible
              lead-product path: TC011 in follicular lymphoma, now registered as a phase II Korean study after prior
              Korean approval milestones. That matters. It means the company is not only discussing preclinical
              concepts. But the same file does not expose the deeper proof package regulators and investors ultimately
              care about: no public comparability dossier, no validation summary, no inspection history, no published
              chemistry-manufacturing-controls bridge, and no public record of cross-site or cross-process transfers.
              FDA guidance on manufacturing changes and comparability for human cellular and gene therapy products,
              together with the 2024 CAR-T development guidance, makes clear that manufacturing changes and product
              comparability are central risks, not paperwork details. EMA gene-therapy guidance points in the same
              direction.

              Legal and IP risk also remain material. The switchable CAR concept has visible patent filings, and company
              history cites earlier patent registrations around Converter CAR. That is directionally positive for moat
              formation. Yet public patent presence is not the same as litigation-tested freedom to operate. The record
              also does not show how Ticaros would defend claims across solid-tumor adaptors, CAR backbone changes, or
              adjacent NK-cell collaborations if the program set broadens. The practical regulatory and legal takeaway
              is therefore mixed: Ticaros has enough progress to justify diligence, but not enough public documentation
              to eliminate approval, transfer, or IP challenge risk.
            claimRefs:
