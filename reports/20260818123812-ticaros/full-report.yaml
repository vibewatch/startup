      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              CAR-T is purchased and deployed through a much narrower channel than ordinary oncology drugs. The end user
              is the patient, but the operative buyer stack runs through specialist hematologists or oncologists,
              hospital cell-therapy programs, apheresis and transplant-capable centers, internal pharmacy and
              reimbursement teams, and then public or private payers that determine whether the episode is economically
              viable. UPMC's approved-therapy page and the current product landscape make clear that approved CAR-T
              delivery remains concentrated in experienced centers capable of leukapheresis, lymphodepletion, infusion,
              and serious-toxicity monitoring. That channel structure matters for Ticaros because it implies adoption is
              gated by clinical-center readiness, manufacturing logistics, and reimbursement confidence rather than by
              simple physician awareness.

              Ticaros' current path is even narrower because the company is still clinical stage. Today, the practical
              “customer” surfaces are trial sites, CDMO and research partners, and future licensing counterparties
              rather than revenue-generating treatment centers. ClinicalTrials.gov shows the sponsor-led
              follicular-lymphoma study is not yet recruiting, which means Ticaros has not yet crossed into broad
              clinical operations even within its chosen niche. The 2026 later-line FL opportunity is still medically
              relevant because the reviewed nature review highlights high unmet need after multiple prior lines, but the
              adoption path is staged: generate durable trial data, prove manufacturability and safety, secure a
              reimbursement strategy, then win site-by-site adoption. That is a slower and more institution-heavy market
              motion than a typical software or diagnostics go-to-market model.
            claimRefs:
              - CM008
              - CM009
              - CM010
