            body: >-
              Customer concentration is currently high because the public proof map is so small. One visible clinical
              route centers on Samsung Medical Center and the TC011 protocol. The manufacturing side is anchored by
              Minaris historically and Matica for TC091 supply work. The research-collaboration surface is anchored by
              Cartherics. The ecosystem-development surface is anchored by JLABS Korea. That is enough to show outside
              engagement, but it also means that any one relationship carries disproportionate signaling weight. If the
              TC011 study stalls, if manufacturing support slips, or if collaborators fail to deepen, the perceived
              customer story could deteriorate quickly because there is not yet a large set of offsetting public wins.

              The future go-to-market chain is also more complicated than the current public customer file. CAR-T
              adoption ultimately depends on specialized physicians, treating centers, manufacturing logistics,
              reimbursement, and patient selection. Broad oncology references make clear that CAR-T therapies require
              individualized cell collection and specialist delivery, while follicular lymphoma remains a specific and
              relatively narrow disease setting. So even if Ticaros' science succeeds, expansion into a broad customer
              base will not be automatic. The company must move from a sponsor-and-partner ecosystem into a true network
              of hospitals, investigators, and eventually payers. Public evidence today does not show that transition
              yet. It shows the prerequisites for it.
