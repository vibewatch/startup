              - CV018
              - CV019
              - CV023
          - type: figure
            figureRef: FV004
            claimRefs: []
      - number: '8.4'
        title: Public comps and scenario guardrails
        blocks:
          - type: paragraph
            body: >-
              The public comparable set is useful as a bracket, not as a formula. StockAnalysis pages show Allogene
              around $715 million market cap, Autolus around $599 million, Cabaletta around $495 million, and Lyell
              around $331 million as of the August 18, 2026 fetches. Those companies are not perfect analogs—they differ
              in modality, commercialization path, and customer structure—but together they define a live public band
              for clinical-stage cell-therapy names. Legend Biotech, at roughly $3.99 billion with far greater
              commercial maturity and revenue visibility, offers the most useful upper benchmark rather than a realistic
              default.

              Ticaros can plausibly sit somewhere between the lower clinical-stage cohort and a future premium platform
              mark if private diligence resolves the major unknowns. That is why the scenario ranges in this chapter are
              deliberately broad. The bear case keeps Ticaros near or even below the lower public band because opacity
              and financing risk dominate. The base case allows a modest platform premium if TC011, platform science,
              and partner logic hold up under private diligence. The bull case allows a low-unicorn-style outcome only
              if private evidence reveals far more commercial and manufacturing readiness than the public record
              currently shows. The scenarios are decision guardrails, not claims about the current price.
            claimRefs:
