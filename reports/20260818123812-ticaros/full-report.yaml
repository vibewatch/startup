      - number: '1.3'
        title: Funding history, development milestones, and current stage
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a credible capital and milestone arc even though it does not fully settle current
              valuation. Official history pages say Ticaros raised approximately $8 million across Series A and B by
              2020, then approximately $22 million in Series C in 2021. Korean news reports and the company timeline
              converge on a March 2026 Series D of KRW 20.8 billion, reportedly issued as redeemable convertible
              preferred shares and backed by SJ Investment Partners, Kiwoom Securities, and iM Investment Partners.
              Public profile platforms such as Caplight and CB Insights broadly align that the company has raised a
              little above $40 million cumulatively, although the exact total varies by provider and none of the
              accessible sources reviewed expose a clean cap-table bridge.

              Operationally, the milestone path is real. Ticaros' 2023 Korean IND approval for TC011 established the
              company as a clinical-stage developer rather than a preclinical platform. The company then used 2024 and
              2025 to expand partnerships, publish Switchable CAR and CLIP CAR work in Nature Communications-linked
              channels, and deepen manufacturing capability around a closed CliniMACS Prodigy process. In January 2026,
              MFDS approved a Phase II expansion of TC011 into follicular lymphoma, and Series D proceeds were publicly
              earmarked to finish TC011 Phase II work and accelerate TC091 into Phase I. The company is therefore past
              platform-only storytelling, but still short of commercial proof: there is no disclosed revenue base,
              marketed product, or validated late-stage licensing economics in the open record.
