      - number: '1.4'
        title: External validation, conflicting valuation signals, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest external validation for Ticaros is scientific and clinical rather than financial.
              PubMed-indexed CLIP CAR work published in 2025 showed that a CD99-mediated backbone can enhance
              immunological synapse formation and improve CAR-T function in lymphoma models; the authorship and
              competing-interest disclosures directly tie multiple inventors and employees to Ticaros. The Switchable
              CAR paper and its associated WIPO and US-family patent filings show the platform is not just marketing
              language but a formal invention stream with assignees tied to Seoul National University R&DB Foundation
              and Ticaros. Partnership evidence is also stronger than average for a private Korean biotech: Cartherics
              publicly described a collaborative research agreement around CLIP-CAR in iPSC-derived NK cells, and Matica
              publicly described a CDMO agreement for TC091 manufacturing.

              The weakest part of the file is investability at a precise price. Company materials do not disclose
              revenue, headcount, customer count, or post-money valuation. The reviewed Series D articles clearly
              confirm round size, named investors, and use of proceeds, but they do not themselves publish a quantified
              unicorn valuation. The only accessible valuation page reviewed, Caplight, shows an estimated valuation of
              approximately $197 million as of August 2026, materially below the broader market narrative that Ticaros
              has crossed unicorn status. That does not prove Caplight is right; it proves the open record is
              inconsistent. Diligence therefore has to carry forward two parallel truths: Ticaros' science and trial
              momentum are increasingly real, and its current financial scale remains materially under-disclosed.
            claimRefs:
              - CO018
              - CO025
