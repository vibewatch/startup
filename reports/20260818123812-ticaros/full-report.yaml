companyProfile:
  summary: >-
    Ticaros is a Seoul-based private CAR-T platform biotech founded in 2018 around Seoul National University and
    National Cancer Center immunology talent. The company is building a next-generation cell-therapy stack centered on
    CLIP CAR, Converter CAR, and Switchable CAR concepts, with TC011 as the lead public clinical program and TC091 as
    the named solid-tumor follow-on path. Public evidence shows meaningful scientific and translational progress,
    including peer-reviewed platform publications, a visible Korean phase II follicular-lymphoma study, and external
    manufacturing or collaboration relationships. The business remains pre-commercial, however, so the public record
    describes a capital-intensive clinical platform rather than a disclosed operating company.
