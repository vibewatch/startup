  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product actually is
        blocks:
          - type: paragraph
            body: >-
              Ticaros is not selling a generic CAR-T toolkit. Public materials frame the company as a next-generation
              cell-therapy developer built around a platform stack the pipeline page calls T-CAMS, short for Ticaros
              CAR-Augmenting Modular System. That stack has three named technology layers—CLIP CAR, Converter CAR, and
              Switchable CAR—plus a lead clinical program, TC011, and a closed manufacturing system. In
              customer-workflow terms, the intended product is not just a receptor construct. It is a way to design,
              manufacture, and eventually dose more selective or controllable CAR-T therapies for blood cancers and
              solid tumors. The company history also makes clear that this platform logic is how management narrates the
              business internally: Converter CAR appears in the 2008-2018 block, CLIP CAR in 2019-2020, Switchable CAR
              in 2024, and TC011 indication expansion in 2026.

              That matters for diligence because the investable asset is broader than a single indication. CLIP CAR is
              presented as a backbone upgrade, Converter CAR as an immune-enhancing logic layer, and Switchable CAR as a
              toxicity-control design. TC011 is the most concrete translational expression of that platform because it
              has a current public trial record. Everything else is earlier in the proof curve: scientifically
              interesting, increasingly peer-reviewed, but not yet publicly accompanied by product-level price, batch,
              or deployment metrics. The right underwriting read is therefore platform-first with one visible clinical
              spearhead, not a commercial therapy franchise already proved at operating scale.
