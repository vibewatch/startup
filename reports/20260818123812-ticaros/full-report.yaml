      - number: '3.2'
        title: Next-generation platform challengers
        blocks:
          - type: paragraph
            body: >-
              The second competitive layer is made up of companies trying to redefine CAR-T economics, logistics, or
              target reach rather than simply selling another autologous product. Allogene publicly positions itself
              around allogeneic AlloCAR T products and says ALPHA3 is the industry's first pivotal Phase II first-line
              consolidation trial of an investigational allogeneic CAR-T in large B-cell lymphoma. Caribou similarly
              positions itself around genome-edited allogeneic cell therapies enabled by its chRDNA CRISPR platform.
              These are not direct product matches to Ticaros, but they do compete for the same strategic narrative:
              next-generation cell therapy that solves what first-generation autologous CAR-T still struggles with.

              Ticaros overlaps with these challengers in ambition but not in exact mechanism. Allogene and Caribou focus
              more on off-the-shelf supply logic and genome editing, whereas Ticaros' public moat claims rest on CLIP
              CAR immune-synapse enhancement, Converter CAR checkpoint rewiring, Switchable CAR safety control, and a
              closed manufacturing process. That difference matters in partner conversations. A buyer looking for lower
              supply-chain friction may prefer allogeneic platforms; a buyer looking for better activity or safety
              inside an autologous framework may find Ticaros more interesting. The practical competitive result is that
              Ticaros is squeezed from two sides: by commercial autologous leaders above it and by better-capitalized
              next-gen redesign stories beside it.
