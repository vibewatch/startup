            body: >-
              Ticaros' public customer file has to be read differently from an enterprise software company or a
              commercial therapeutics company. There is no public list of paying hospital customers, recurring
              licensees, or treatment-center contracts. Instead, the customer surface is segmented across clinical
              investigators and treatment sites, manufacturing and CDMO counterparties, research collaborators,
              accelerator or ecosystem partners, and the future buyer-user-payer chain that would matter after
              commercialization. The most concrete current user visible in public evidence is the TC011 clinical path:
              Ticaros is the study sponsor, Won Seog Kim of Samsung Medical Center is the named principal investigator,
              and the protocol requires leukapheresis, manufacturing success, infusion, and long follow-up. That is a
              real user surface, but it is still a clinical-development surface.

              The other visible segments are equally important. Minaris and Matica sit on the manufacturing side,
              helping translate science into clinical supply. Cartherics is a modality-expansion collaborator rather
              than a product buyer, but it is still external proof that another biotech sees value in Ticaros' receptor
              design. JLABS Korea is not a customer, yet it matters as ecosystem validation because it gives Ticaros
              access to business-development and clinical-development support within the Johnson & Johnson innovation
              network. The key discipline is not to overstate any of these relationships. Together they prove interest
              and utility. They do not yet prove a revenue-diversified commercial base.
