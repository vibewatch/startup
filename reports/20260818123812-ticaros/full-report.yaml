  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and what Ticaros is actually selling into
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Ticaros is not “all oncology” and not even “all immunotherapy.” The
              closest commercial boundary is the CAR-T cell-therapy market plus the adjacent licensing and manufacturing
              ecosystem that supports next-generation cell therapies. MarketsandMarkets estimates the global CAR-T
              market at $6.78 billion in 2026, up from $5.98 billion in 2025, and forecasts $13.56 billion by 2031.
              Vision LifeSciences separately describes CAR-T as the most commercially successful cell-and-gene-therapy
              platform, with more than $5 billion in annual revenue and a current inflection point driven by
              earlier-line expansion, autoimmune opportunity, and next-generation platform innovation.

              That boundary still needs narrowing for Ticaros. Current approved spend clusters around hematologic
              malignancies, not solid tumors, and around highly specialized centers rather than broad community care.
              Ticaros' visible programs map into two distinct submarkets: TC011 in relapsed or refractory B-cell
              lymphoma and TC091 in solid tumors. In the nearer-term, the investable market is therefore later-line
              lymphoma treatment and partnering budgets around hematology CAR-T differentiation. The broader solid-tumor
              opportunity belongs in TAM, but not in a high-confidence near-term SAM, because the literature still
              describes solid tumors as the hardest domain for CAR-T due to infiltration, antigen heterogeneity, and
              tumor-microenvironment suppression.
