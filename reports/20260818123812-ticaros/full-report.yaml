      - number: '5.2'
        title: Platform architecture and mechanism design
        blocks:
          - type: paragraph
            body: >-
              The deepest technical evidence in the public file sits around CLIP CAR and Switchable CAR. The pipeline
              page says CLIP CAR is a proprietary CAR backbone, and the 2025 Nature Communications publication described
              in PubMed and Korean coverage gives that statement real content: the paper links CD99 to immunological
              synapse stabilization and reports that incorporating CD99 transmembrane and juxtamembrane domains into CAR
              design improved activation and anti-tumor activity in lymphoma models. That is more than branding. It is a
              specific mechanistic claim about how receptor architecture can improve synapse formation and thereby
              change CAR-T function. The same paper also disclosed inventor and company affiliations, which reinforces
              that this is internally originating science rather than third-party marketing language.

              Switchable CAR adds a different design logic. Public news coverage and the searchable PubMed entry
              identify the 2024 Nature Communications paper title as “Improved safety of chimeric antigen receptor T
              cells indirectly targeting antigens via switchable adaptors.” The company’s own pipeline summary
              translates that into plain English as controllable toxicities. The WIPO filing on dose-adjustable adaptors
              supports the same safety-oriented framing: instead of only hardwiring antigen recognition into the cell,
              the system uses an intermediary adaptor to modulate targeting. Converter CAR is strategically important in
              the product architecture because company materials present it as a tumor-microenvironment or
              immune-enhancing module, but accessible third-party technical detail remains lighter than for CLIP or
              Switchable. That asymmetry is itself an important diligence conclusion.
