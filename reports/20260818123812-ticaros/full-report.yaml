      - number: '3.3'
        title: Pricing, distribution power, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Pricing and distribution currently favor incumbents. HMPI's pricing analysis shows that approved CAR-T
              list prices remain very high, with Kymriah around $475,000, Yescarta around $373,000, Breyanzi around
              $410,300, and Carvykti around $465,000, before total episode costs. Those numbers matter because they show
              two things at once: first, the category can support premium pricing when reimbursement exists; second, any
              newcomer still has to clear an expensive, infrastructure-heavy clinical pathway before that pricing power
              becomes real. Ticaros has no disclosed public price, reimbursement contract, or commercial manufacturing
              scale, so any pricing comparison is necessarily relative rather than directly observed.

              Switching costs are also meaningful. Center accreditation, physician comfort, manufacturing reliability,
              toxicity-management playbooks, and payer precedent all make approved products sticky. Multi-homing can
              happen at the portfolio or trial level, especially for partners and institutions evaluating different
              modalities, but individual treatment decisions are still conservative because consequences are clinical
              and logistical, not just financial. That means Ticaros probably wins only if it proves a clearly
              differentiated benefit or if it monetizes through partnership rather than through immediate direct
              commercialization. Public sources do not yet show enough data to say which path will dominate.
            claimRefs:
