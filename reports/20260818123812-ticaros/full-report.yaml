      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The industry's secular growth drivers are visible and credible. MarketsandMarkets, BioInformant, Vision
              LifeSciences, and the approved-products review all point to the same expansion logic: more labeled
              products, more indications, movement into earlier lines of therapy, and intense innovation around
              allogeneic and in vivo platforms that aim to lower cost and reduce manufacturing delay. Ticaros' strategic
              fit with this trend is sensible. Its CLIP CAR and Converter CAR stories are built around solving the two
              hardest next-generation value propositions—better efficacy and better safety—while its public
              manufacturing narrative emphasizes reproducibility and closed processing. In other words, the company is
              not trying to enter a stagnant category.

              But the constraint side is just as important. The HMPI pricing analysis argues that list prices and
              wholesale acquisition costs have continued climbing even as the market expands, creating access and
              sustainability pressure. Approved-product overviews emphasize cytokine-release and neurotoxicity
              management burdens, while recent solid-tumor reviews frame the biological barriers as fundamental rather
              than cosmetic. Later-line follicular lymphoma is also not a monopoly market: the 2025 systematic review
              explicitly frames CAR-T against bispecific antibodies in the same treatment setting. For Ticaros, that
              means the growth case depends on demonstrating enough differentiation that specialized centers and future
              partners will tolerate clinical, manufacturing, and reimbursement friction. Public sources reviewed still
              do not disclose Ticaros pricing plans, COGS, or site-readiness economics, which keeps the commercial model
              partly abstract.
            claimRefs:
