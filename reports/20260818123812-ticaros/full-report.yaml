      - number: '7.3'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Ticaros' external ecosystem is helpful, but it also creates concentration and execution dependencies.
              Public proof clusters around a small set of counterparties: Samsung Medical Center and Won Seog Kim for
              the visible clinical path, Minaris for prior approval support, Matica for solid-tumor manufacturing work,
              Cartherics for platform collaboration, and JLABS Korea for ecosystem access. That is a credible start, yet
              it means relationship quality matters disproportionately. If any one of the visible pillars fails to
              deepen, the public story weakens because there are not many offsetting relationships disclosed in detail.
              The company also depends on a lead-product path that still centers on one visible public trial record
              rather than on a diversified multi-program clinical portfolio.

              There is a second-order dependency risk as well. The manufacturing narrative depends on an external
              equipment stack, external manufacturing support, and successful execution by collaborators who have their
              own priorities. Cartherics preserves its own development rights; Matica is a CDMO rather than an owned
              plant; Samsung Medical Center is an investigator site, not a guaranteed long-term account. None of that is
              unusual for biotech. It just means the external proof surface that helps the case today could also become
              a transmission channel for delays, reprioritization, or failed scale-up. Concentration and dependency are
              therefore not separate risks. They are the same risk viewed through different counterparties.
            claimRefs:
              - CR022
              - CR023
              - CR024
