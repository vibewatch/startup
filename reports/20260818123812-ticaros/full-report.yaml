  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The first valuation question is not whether Ticaros is interesting. It is whether public evidence is
              sufficient to price the company today. The answer is still no. Public sources do show real reasons to keep
              digging: Ticaros has raised meaningful private capital, advanced TC011 into a visible follicular-lymphoma
              study, published peer-reviewed platform work, and assembled manufacturing and collaboration relationships
              that are more substantive than pure concept-stage biotech signaling. Those facts justify serious
              diligence. But none of the retained public materials disclose the current post-money valuation, share
              price, liquidation preferences, or fully diluted cap table. Without those inputs, any hard valuation call
              is mostly theater.

              The right recommendation is therefore research-more and price-sensitive. Investors should continue only if
              the proposed entry price lands in a range that can still be defended after applying a substantial discount
              for missing economics and financing opacity. If the company is offered at a level that already assumes
              broad provider adoption, clean manufacturing reliability, and strong commercial pricing power, the public
              record is not strong enough to support it. If price instead reflects that Ticaros is still a
              capital-intensive, under-disclosed clinical platform with upside optionality, continued diligence can make
              sense.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV025
              - CV026
              - CV027
