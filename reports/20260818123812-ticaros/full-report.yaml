        title: Manufacturing, quality, and translation path
        blocks:
          - type: paragraph
            body: >-
              Ticaros' public manufacturing story is high level but directionally coherent. The pipeline page says the
              company optimized its process around Miltenyi’s CliniMACS Prodigy closed and automated system so that
              CAR-T production can be more reproducible and safer while reducing contamination risk and manual
              variability. The pipeline page even highlights “easy to tech transfer,” which is an important aspiration
              for any clinical cell-therapy platform. Minaris’ 2023 approval note, the TC011 ClinicalTrials.gov
              registry, and the 2025 Matica partnership article together show that the manufacturing narrative is not
              purely conceptual. There is a real Korean IND history, an active public phase II follicular-lymphoma
              registry, and visible external manufacturing support for solid-tumor CAR-T work.

              But the limits of the public file are equally clear. No reviewed source published batch-release
              performance, turnaround time, vector efficiency, dose-manufacture success rate, out-of-spec excursion
              history, cost per batch, or cross-site transfer data. The lead clinical registry also evidences only one
              visible product path—TC011 in relapsed or refractory follicular lymphoma—not a broad public operating
              record across CLIP, Converter, and Switchable programs. So the manufacturing read is positive but
              incomplete: Ticaros has moved beyond concept slides into regulated clinical activity, yet investors still
              lack the performance data that would convert a plausible process story into a fully underwritten
              manufacturing moat.
