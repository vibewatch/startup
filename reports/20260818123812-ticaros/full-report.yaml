      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is not that Ticaros lacks potential. It is that the public record remains too thin
              to measure its potential cleanly. The company operates in a category where eventual pricing can be high,
              where differentiated platform science can attract valuable licensing conversations, and where financing
              has continued to appear even before commercialization. Those are positives. But investors still do not
              know the current cash balance, burn, cash runway, planned CMC spend, expected manufacturing yield, or any
              product-level contribution margin. Public profile sites also conflict on valuation, and none of the
              accessible primary materials reconcile the cap table. That is too much uncertainty for precise financial
              modeling.

              The appropriate takeaway is to keep financial diligence tightly linked to milestone gating. A reasonable
              underwriter should ask for cash runway tied to TC011 and TC091 milestones, grant timing, CMC scale-up
              spending, and partnership inflow assumptions. If the company can show enough cash to reach a genuinely
              value-inflecting data event without a dilutive emergency raise, the risk profile improves. If not, future
              financing could dominate scientific upside. At the current public evidence level, Ticaros should be
              treated as a capital-intensive, under-disclosed clinical platform with upside optionality, not as a
              disclosed operating company.
