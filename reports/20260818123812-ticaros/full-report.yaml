        title: Durability, expansion, and visibility gaps
        blocks:
          - type: paragraph
            body: >-
              Standard customer-durability metrics are almost entirely absent. No reviewed source disclosed customer
              count, repeat purchase rate, NRR, GRR, retention, churn, renewal rate, treatment-center growth, or
              contract duration with hospitals or commercial buyers. Even where there are named counterparties, the
              economic depth is usually missing. Cartherics explicitly preserves both parties' development rights and
              points only to the possibility of future development or commercialization agreements. Matica's agreement
              shows clinical-supply intent for TC091, but not batch volume, term length, or spend. JLABS Korea is
              important for business-development access but is not a product customer at all. This means public
              durability has to be inferred from step-up logic, not from actual account economics.

              The step-up logic is directionally positive but still incomplete. The customer file expanded from clinical
              approval support into accelerator access, manufacturing partnerships, modality collaborations, and an
              updated registry-backed indication path. That suggests the ecosystem is deepening rather than shrinking.
              Yet the visible proof remains concentrated in a handful of counterparties and one principal clinical path.
              There is still no public evidence of broad provider-network onboarding, payer negotiation, or repeated
              account monetization. The practical conclusion is that Ticaros currently has ecosystem durability signals,
              not commercial retention metrics. That is enough for continued diligence, but not enough to underwrite
              customer stickiness with precision.
