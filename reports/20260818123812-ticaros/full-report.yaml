      - number: '5.4'
        title: Differentiation, roadmap, and open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Ticaros' differentiation case is strongest when stated narrowly. The company has a multi-pronged
              receptor-design thesis instead of a single construct, peer-reviewed support for two of those design ideas,
              a switchable-control patent family, and a visible clinical lead asset. That combination is enough to
              distinguish it from a simple me-too autologous CD19 program. It is also why partners like Cartherics and
              Matica matter: they suggest that the platform is extensible into NK or solid-tumor work and that outside
              counterparties find the science worth integrating. The roadmap visible in public history—Converter proof,
              CLIP development, Korean IND, Switchable publication, 2025 CLIP publication, and 2026 TC011 indication
              expansion—reads like cumulative platform building rather than one-off newsflow.

              Even so, the product-tech verdict should remain measured. The strongest proof is still pre-commercial and
              disproportionately company-generated or company-originated. Converter CAR has thinner accessible external
              evidence than CLIP or Switchable. Solid-tumor translation remains hard across the field, and the broader
              CAR-T literature still warns that toxicity, suppressive microenvironments, and manufacturing complexity
              remain substantial barriers. There is also almost no public operating disclosure around software controls,
              security, validation package depth, transfer metrics, or freedom-to-operate analysis. The result is a real
              technical moat signal, but not yet a public proof file strong enough to treat the moat as fully de-risked.
