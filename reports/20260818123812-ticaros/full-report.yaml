      - number: '7.4'
        title: Capital, people, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is capital and execution. Ticaros remains pre-commercial, has no public revenue or
              runway disclosure, and still appears dependent on milestone-linked financing. That means technical and
              operational delays are not only science problems; they are financing problems. If the company cannot reach
              the next credible proof event efficiently, future capital raises may occur before a clean de-risking
              moment. Public funding history and the 2026 Series D show repeated support, but not a self-funding
              business model. The investor must therefore monitor burn and proof conversion together rather than
              treating them as separate workstreams.

              People risk follows from the same logic. The public leadership roster is scientifically serious, but the
              company still needs sustained excellence across clinical operations, CMC, regulatory execution, and
              partnership management. The thesis breaks are straightforward. A failed comparability bridge, repeated
              manufacturing setbacks, slower-than-expected TC011 progress, loss of a visible partner, or evidence that
              switchable or CLIP advantages do not survive clinical translation would each materially compress the
              upside case. The public record today is strong enough to support continuing diligence, but not strong
              enough to dismiss those breakpoints.
