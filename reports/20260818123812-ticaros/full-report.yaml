      - number: '7.2'
        title: Operational, quality, and safety risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk surface is dominated by what cannot yet be measured publicly. Ticaros says it uses a
              closed, automated CliniMACS Prodigy-based manufacturing workflow to improve reproducibility and reduce
              contamination. That is the right operational story for a clinical-stage CAR-T developer. Yet no reviewed
              source discloses yield, turnaround time, batch failure rate, release deviation frequency, cost per batch,
              or transfer reproducibility. Minaris and Matica show that Ticaros is building real manufacturing
              relationships, but they do not substitute for operating dashboards. In other words, the public file tells
              investors how management wants the process to behave, not how the process has behaved across a meaningful
              batch history.

              Safety risk is equally live because the broader CAR-T field remains toxic and operationally unforgiving.
              The TC011 registry explicitly tracks adverse events, while multiple toxicity reviews underscore that
              cytokine release syndrome, neurotoxicity, and related inflammatory syndromes remain major concerns even as
              CAR-T design improves. Switchable CAR is strategically important here because it is supposed to create
              controllable targeting and reduced normal-cell toxicity. But the public evidence for that safety advantage
              is still preclinical and publication-based rather than human-outcome-based. Ticaros therefore faces a
              classic cell-therapy asymmetry: strong conceptual risk mitigations exist, but the proof needed to convert
              them into low residual operating risk is not public.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
