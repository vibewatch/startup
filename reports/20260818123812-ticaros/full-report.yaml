            body: >-
              Publicly visible funding provides a decent but incomplete map of capital adequacy. Official company
              history lists roughly $8 million across Series A and B and roughly $22 million in Series C; Korean
              business coverage confirms a March 2026 Series D of KRW 20.8 billion, with proceeds intended to finish
              TC011 Phase II work and push TC091 toward Phase I. Public profile databases broadly place cumulative
              funding at roughly $42.5 million to $42.7 million. The company also highlights repeated Ministry and KDDF
              grants across 2020 through 2025. Those facts make two things clear. First, Ticaros has been able to
              attract both private and non-dilutive capital repeatedly. Second, the company still appears to be funding
              development rather than scaling commercial operations.

              What cannot be derived from the open record is the actual runway after Series D. There is no disclosed
              cash balance, monthly burn, debt facility, or forecast use-of-funds schedule beyond generic program
              statements. The presence of RCPS structure in Series D also suggests a financing environment in which
              investors still seek downside protections common to private biotech. Relative to listed competitors and
              large-pharma incumbents, Ticaros remains small and funding-dependent. That is not unusual for the stage.
              It just means financing risk must be carried explicitly into the investment case rather than buried inside
              optimistic scientific assumptions.
