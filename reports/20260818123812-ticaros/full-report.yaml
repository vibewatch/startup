      - number: '4.2'
        title: Cost structure, pricing analogs, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The best public proxies for Ticaros economics come from the broader CAR-T market, not from
              company-specific disclosures. HMPI's 2026 pricing analysis shows list prices for approved products
              clustered in the high-hundreds-of-thousands of dollars per patient, while total treatment costs can
              approach $1 million once hospitalization and side-effect management are included. That signals strong
              eventual gross-profit potential for any product that wins approval and reimbursement—but it also signals a
              business model with expensive manufacturing, tight quality control, and heavy center-delivery
              requirements. Reviews and Ticaros' own process descriptions reinforce that the relevant cost stack
              includes vector or construct work, leukapheresis or cell processing, QA or QC release, cold-chain
              logistics, hospital support, and post-infusion monitoring.

              Ticaros' public process story around a closed CliniMACS Prodigy workflow and Matica CDMO support suggests
              management is already trying to compress manufacturing variability and contamination risk. But no source
              reviewed quantifies turnaround time, batch failure rate, cost per batch, or expected gross margin. That is
              a critical difference between scientific promise and financeable operations. Until the company discloses
              actual manufacturing performance or partner economics, the only honest unit-economics bridge is
              qualitative: premium category pricing is plausible, but so are large pre-commercial cash needs and weak
              near-term margins.
