      - number: '1.2'
        title: Leadership, founder-market fit, and institutional network
        blocks:
          - type: paragraph
            body: >-
              Ticaros' leadership profile looks stronger scientifically than commercially, but it is not a one-scientist
              shell. The public leadership roster names CEO Jae Won Lee, CTO Kyung Ho Choi, CSO Eun Young Choi, research
              director Hyung Bae Park, CMC director Sun Young Park, clinical-development leader Young Ok Kim, and
              business-management leader Sung Hoon Jung. Lee's background is notably finance-heavy for a Korean platform
              biotech—prior roles included DiNonA, Dimension Investment Advisory, Dream Technology Investment, HSBC, and
              BNP Paribas—while Kyung Ho Choi and Eun Young Choi bring the deepest translational credibility through
              Seoul National University faculty roles and prior work linked to the National Cancer Center, NIH, and
              Jackson Laboratory.

              That mix matters because Ticaros is pursuing a hybrid playbook: academic-origin platform science, Korean
              trial execution, government grant capture, and cross-border partnering. Official materials and news flow
              show the network is broader than a standard domestic lab spinout. The company lists City of Hope,
              Cartherics, JLABS Korea, GC Cell, WuXi/Minaris, and Oxford Gene Technology-related partners in its
              collaboration surface. That network does not prove commercialization readiness, but it does show that the
              company has built enough scientific and BD credibility to attract reputable collaborators across research,
              manufacturing, and open-innovation channels. The main governance gap is that public material remains
              descriptive rather than governance-heavy: there is no disclosed board composition, independent-director
              structure, ownership split, or succession framework.
