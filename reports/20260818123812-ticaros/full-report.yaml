  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Ticaros does not yet disclose the core operating metrics required for a conventional growth-company
              financial read. No reviewed company page, clinical-trial entry, or retrieved news article published
              revenue, ARR, cash balance, gross margin, backlog, customer count, or headcount. That pushes the chapter
              toward structure rather than precision. The likely future revenue model has three layers: direct product
              revenue if TC011 or later assets are approved; licensing, co-development, or milestone revenue if the
              platform is partnered earlier; and non-dilutive grant support during the pre-commercial buildout. Public
              evidence clearly supports the third layer today and plausibly supports the second as an option, but does
              not yet show the first.

              The absence of data does not mean the economics are trivial. It means the economics are still private. The
              Ticaros file already contains recurring references to platform partnerships, manufacturing process work,
              and clinical expansion, all of which are costly activities. Meanwhile, the industry analogs reviewed show
              that approved CAR-T products can support very high list prices but only after clearing complex
              manufacturing, toxicity, and reimbursement hurdles. So the revenue story is conceptually attractive but
              empirically thin. Financial underwriting therefore has to start with a disclosure-quality discount.
