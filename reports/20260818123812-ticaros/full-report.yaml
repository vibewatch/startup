      - number: '8.2'
        title: Why the story deserves attention in principle
        blocks:
          - type: paragraph
            body: >-
              There is a real thesis here. Ticaros is not trying to sell a solution to a fictional problem. CAR-T
              remains one of the most valuable oncology modalities, and Ticaros has assembled a platform story that is
              more differentiated than a single-asset CD19 clone. CLIP CAR and Switchable CAR have peer-reviewed
              support, the company frames Converter CAR as a tumor-microenvironment answer, the lead TC011 program is
              visible in the clinic, and external partners including Minaris, Matica, and Cartherics suggest that third
              parties take the platform seriously enough to work with it. Continued financing support, including the
              2026 Series D, reinforces that investors and partners have not abandoned the story.

              Those are precisely the features that can justify a premium to weaker concept-stage biotech names. A
              company with peer-reviewed platform science, one visible human-study route, and some manufacturing
              infrastructure logic should not be priced the same as a slide-deck-only startup. The caution is that this
              premium has to remain tethered to what has actually been proved. Ticaros has demonstrated platform
              ambition, not yet broad commercial execution. The public evidence supports valuation attention, not
              valuation exuberance.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV017
              - CV018
              - CV025
      - number: '8.3'
        title: Why public underwriting still fails today
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is not that Ticaros lacks scientific promise. It is that public evidence still fails the
              underwriting basics. No reviewed source publishes recognized revenue, gross margin, current cash, burn,
              batch economics, treatment-center count, or a clean revenue bridge from any collaboration. Even public
              valuation surfaces conflict: Caplight exposes a valuation estimate and CB Insights shows a financials
              page, but neither provides the cap-table clarity an investor would actually need to underwrite a private
              price. The company is therefore more opaque than every public comparable used in this chapter. Public
              peers disclose market caps, financial reports, investor-relations materials, and in some cases commercial
              revenue. Ticaros does not.

              That gap matters because advanced cell therapy is a proof-sensitive sector. A private company can look
              exciting while still being overpriced if investors are asked to pay for future manufacturing reliability,
              future payer acceptance, and future multi-center clinical expansion all at once. The public record does
              not yet show that those future states have been earned. It shows that they remain possible. Price must
              reflect that difference. If not, the appropriate answer is to wait rather than to rationalize false
              precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV006
            claimRefs:
