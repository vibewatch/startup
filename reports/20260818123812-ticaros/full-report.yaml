chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scientific roots, and what the company is building
        blocks:
          - type: paragraph
            body: >-
              Ticaros Co., Ltd. presents itself as a next-generation Korean immuno-oncology company focused on
              gene-modified T-cell therapies for cancer. Official company materials say the business was established in
              June 2018 and now operates its headquarters and research center from Seongsoo AK Valley in Seongdong-gu,
              Seoul, with an additional molecular immunology laboratory at Seoul National University College of
              Medicine. The company's scientific identity is unusually explicit for a private biotech: it says the
              platform was built from accumulated immunology and cell-therapy experience at Seoul National University
              and the National Cancer Center, and nearly every current corporate description centers on three
              proprietary platform ideas rather than on a single narrow asset.

              Those three ideas are CLIP CAR, Converter CAR, and Switchable CAR. CLIP CAR is framed as a CAR-backbone
              design that strengthens the immune synapse between engineered immune cells and tumor cells. Converter CAR
              is framed as a tumor-selective CTLA-4 inhibition strategy intended to improve efficacy without activating
              non-tumor-specific T cells systemically. Switchable CAR is framed as an adaptor-mediated control layer
              intended to reduce on-target off-tumor toxicity and widen addressable antigen space. In practical
              portfolio terms, Ticaros remains a clinical-stage rather than commercial-stage company: TC011 is the most
              advanced blood-cancer program, TC091 is the visible solid-tumor program, and the rest of the story is
              platform leverage, manufacturing reproducibility, and partnering optionality rather than booked product
              revenue.
