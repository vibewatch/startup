      - number: '2.4'
        title: Sizing verdict and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The most honest sizing verdict is layered. TAM is large because CAR-T expansion is real, solid tumors are
              vastly larger than hematologic malignancies, and the platform-licensing market around next-generation cell
              therapy is active. SAM is meaningfully smaller because Ticaros' present evidence base only supports adult
              relapsed or refractory B-cell lymphoma and preclinical or early-clinical solid-tumor expansion. SOM is
              smaller again because Ticaros still lacks public evidence of commercialization capability, reimbursement
              traction, or manufacturing throughput at revenue scale. The market story is therefore attractive in
              direction but not yet de-risked in share capture.

              The key diligence gap is not whether the market exists. It clearly does. The harder questions are whether
              Ticaros can reach the market with sufficient durability, whether its differentiation is strong enough to
              displace or complement better-capitalized peers, and whether Korea-first clinical proof can translate into
              global licensing or direct commercialization economics. A good underwriting stance is to carry forward a
              large-TAM, constrained-SAM, evidence-light-SOM framing. That avoids both mistakes common in private
              biotech analysis: dismissing the opportunity because the company is early, or assuming that a large
              oncology market automatically converts into a large near-term revenue market for one clinical-stage
              platform company.
            claimRefs:
              - CM006
              - CM017
              - CM018
              - CM023
              - CM027
              - CM028
              - CM032
              - CM033
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Incumbent commercial field
        blocks:
          - type: paragraph
            body: >-
              The first competitive layer is the established commercial CAR-T set. UPMC's approved-therapy list and the
              product sites for Yescarta, Breyanzi, and Carvykti show that the category is no longer experimental from a
              market-structure standpoint. These products are positioned as one-time, personalized treatments delivered
              through specialized centers, but they already benefit from physician familiarity, manufacturing
              infrastructure, approved labels, and payer experience. Yescarta states that more than 25,000 patients have
              been treated globally since approval. Breyanzi and Carvykti emphasize the same hospital-grade delivery
              model, and the approved-product review confirms that multiple CD19 and BCMA products already cover key
              hematology settings.

              For Ticaros, this means the blood-cancer target market is attractive but crowded. TC011 is not entering an
              empty later-line lymphoma niche; it is entering a field where several branded CAR-T therapies are already
              clinically normalized. Ticaros' burden is therefore comparative. If efficacy and safety are only similar,
              scale and channel power favor incumbents. If CLIP CAR or Switchable CAR deliver cleaner efficacy, reduced
              neurotoxicity, or better manufacturability, the company could still matter as a partner or differentiated
              entrant. But the baseline should remain clear: the incumbents own the current standard-setting position.
            claimRefs:
