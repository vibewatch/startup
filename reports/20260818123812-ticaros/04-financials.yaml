        - from: grants
          to: platform
          label: 'funds R&D'
        - from: platform
          to: partnership
          label: 'supports dealmaking'
        - from: platform
          to: tc011
          label: 'supports clinical assets'
        - from: tc011
          to: product
          label: 'requires approval and reimbursement'
