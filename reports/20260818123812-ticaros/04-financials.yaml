          detail: 'Vector/construct work, closed-process operations, QC and release'
        - id: logistics
          label: 'Clinical logistics'
          detail: 'Apheresis, delivery, center coordination, monitoring'
        - id: pricing
          label: 'Premium price potential'
          detail: 'Commercial analogs price in high-hundreds-of-thousands of USD'
        - id: margin
          label: 'Gross margin unknown'
          detail: 'No public Ticaros yield or cost data'
