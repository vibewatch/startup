          values: ['Multiple private rounds are publicly visible', 'Shows repeated investor access', 'No cap-table or cash-balance bridge', 'Positive but incomplete capital signal']
        - label: Government grants
          values: ['Non-dilutive support visible across several years', 'Reduces some R&D funding burden', 'Timing and spend restrictions are unclear', 'Helpful but not a substitute for core operating cash']
        - label: No revenue disclosure
          values: ['Operating scale remains opaque', 'Hard to project burn efficiency', 'Could hide either healthy or weak economics', 'Apply disclosure discount']
        - label: RCPS Series D structure
          values: ['Investors likely preserved downside protections', 'Suggests financing still prices real risk', 'Terms are not public', 'Assume future financing could still be dilutive']
    claimRefs: [CI001, CI003, CI018, CI022, CI024]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Unit, Current value or status, Quality, Diligence ask]
    rows:
      - ['Approved therapy sales', 'One-time treatment revenue after approval', 'Per treated patient', 'Not yet commercial', 'Hypothetical for Ticaros today', 'What is the launch plan and target pricing?']
      - ['Licensing or co-development', 'Upfronts, milestones, or research funding from partners', 'Per agreement', 'Plausible but not publicly monetized', 'Potentially real but undisclosed', 'Which current collaborations have economic terms?']
      - ['Government grants', 'KDDF and ministry support for R&D', 'Per award', 'Publicly visible in history page', 'Real but non-recurring by nature', 'What grant timing and restrictions apply?']
      - ['Clinical manufacturing or service revenue', 'Possible future platform or process monetization', 'Per program', 'Not publicly disclosed', 'Speculative', 'Is there any paid platform-service revenue today?']
    notes: >-
      This table distinguishes between visible support sources and hypothetical commercial revenues; only grant support is directly visible in public materials today.
    claimRefs: [CI001, CI003, CI008, CI020]
  - id: TI002
    title: Pricing / monetization table
    columns: [Price or contract archetype, List vs realized pricing, Included capabilities, Unknowns, Source]
    rows:
      - ['Approved autologous CAR-T list price', 'List prices around $373k-$475k by product', 'Manufacturing plus one-time infusion treatment', 'Episode cost materially exceeds list price', 'HMPI']
      - ['Ticaros future therapy price', 'Not publicly disclosed', 'Would include cell processing, infusion, and center support if commercialized', 'No public price, payer, or reimbursement benchmark', 'No reviewed Ticaros source']
      - ['Partnership milestone revenue', 'Not publicly disclosed', 'Could include research support, option fees, milestones, or licenses', 'No visible term sheets', 'No reviewed partner source with economics']
      - ['Grant funding', 'Award-size specific, non-product revenue', 'Supports R&D and clinical development', 'Not recurring product economics', 'Official history page']
    notes: >-
      Price visibility exists for approved category analogs, not for Ticaros itself.
    claimRefs: [CI006, CI007, CI010, CI015, CI020]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - ['List-price analog for approved CAR-T', '$373k-$475k', medium, 'Signals category pricing power if approved', 'Which price band does Ticaros target?']
      - ['Total episode cost analog', '~$1M', medium, 'Shows payer and hospital burden', 'How would Ticaros reduce total episode cost?']
      - ['Ticaros cost per batch', null, high, 'Determines gross-margin path', 'Request CMC and manufacturing-yield data']
      - ['Turnaround time', null, high, 'Affects site adoption and patient eligibility', 'Request manufacturing and release timeline data']
      - ['Gross margin', null, high, 'Core economic quality indicator', 'Request projected or observed margin bridge']
    notes: >-
      Null means the metric was not disclosed in reviewed public sources, not that the value is zero.
    claimRefs: [CI006, CI007, CI012, CI013, CI014]
  - id: TI004
    title: Capital adequacy table
    columns: [Cash source or obligation, Public status, Why it matters, Constraint, Source]
    rows:
      - ['Series A and B', '~$8M historical', 'Early capitalization', 'No detailed investor or cap-table bridge', 'Official history']
      - ['Series C', '~$22M historical', 'Scaled company toward clinic', 'No detailed ownership disclosure', 'Official history']
      - ['Series D', 'KRW 20.8B / ~$14M-$15M', 'Funds TC011 and TC091 next steps', 'Cash balance after close not disclosed', 'Official history + Korean news']
      - ['Government grants', 'Repeated KDDF and ministry support', 'Offsets some R&D burn', 'Magnitude is fragmented across awards', 'Official history']
      - ['Debt', null, 'Would affect financing risk materially if present', 'No reviewed source disclosed debt', 'No public disclosure found']
    notes: >-
      Capital adequacy can only be framed qualitatively because no reviewed source published current cash on hand or monthly burn.
    claimRefs: [CI003, CI004, CI018, CI021, CI022]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing metric, Impact, Exact diligence path]
    rows:
      - ['Cash balance and burn', 'Blocks runway estimate and financing-risk view', 'Request latest board deck or audited management accounts']
      - ['Revenue and margin', 'Prevents quality-of-revenue analysis', 'Request any internal operating plan or partner revenue bridge']
      - ['Cap table and preference stack', 'Blocks dilution and downside analysis', 'Request Series D term sheet and cap table']
      - ['Manufacturing yield and batch economics', 'Blocks unit-economics underwriting', 'Request CMC package and cost model']
      - ['Grant receipts and restrictions', 'Affects non-dilutive funding quality', 'Request grant schedule and use constraints']
    notes: >-
      These are the minimum missing finance items needed before a serious underwriting exercise can move beyond category analogs.
    claimRefs: [CI001, CI002, CI014, CI016, CI022, CI024, CI025]
