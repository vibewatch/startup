company:
  name: Ticaros Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: >-
    Ticaros' financial file is dominated by what is not public: no reviewed source discloses revenue, cash balance, gross margin, burn, ARR, customer count, or runway. What is public is enough to establish that the company remains financing-dependent but not enough to underwrite a precise cash-flow model. The strongest signals are funding history—approximately $8 million in Series A and B, approximately $22 million in Series C, and KRW 20.8 billion in Series D in March 2026—plus repeated government grants and the industry's very high CAR-T episode economics. The implication is straightforward: Ticaros may have attractive future unit economics if it reaches commercialization or licensing scale, but today investors are underwriting a capital-intensive clinical platform, not a disclosed operating business.
sections:
  - id: revenue-model-and-disclosure-quality
    title: Revenue model and disclosure quality
    body: >-
      Ticaros does not yet disclose the core operating metrics required for a conventional growth-company financial read. No reviewed company page, clinical-trial entry, or retrieved news article published revenue, ARR, cash balance, gross margin, backlog, customer count, or headcount. That pushes the chapter toward structure rather than precision. The likely future revenue model has three layers: direct product revenue if TC011 or later assets are approved; licensing, co-development, or milestone revenue if the platform is partnered earlier; and non-dilutive grant support during the pre-commercial buildout. Public evidence clearly supports the third layer today and plausibly supports the second as an option, but does not yet show the first.

      The absence of data does not mean the economics are trivial. It means the economics are still private. The Ticaros file already contains recurring references to platform partnerships, manufacturing process work, and clinical expansion, all of which are costly activities. Meanwhile, the industry analogs reviewed show that approved CAR-T products can support very high list prices but only after clearing complex manufacturing, toxicity, and reimbursement hurdles. So the revenue story is conceptually attractive but empirically thin. Financial underwriting therefore has to start with a disclosure-quality discount.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics-proxies
    title: Cost structure, pricing analogs, and unit-economics proxies
    body: >-
      The best public proxies for Ticaros economics come from the broader CAR-T market, not from company-specific disclosures. HMPI's 2026 pricing analysis shows list prices for approved products clustered in the high-hundreds-of-thousands of dollars per patient, while total treatment costs can approach $1 million once hospitalization and side-effect management are included. That signals strong eventual gross-profit potential for any product that wins approval and reimbursement—but it also signals a business model with expensive manufacturing, tight quality control, and heavy center-delivery requirements. Reviews and Ticaros' own process descriptions reinforce that the relevant cost stack includes vector or construct work, leukapheresis or cell processing, QA or QC release, cold-chain logistics, hospital support, and post-infusion monitoring.

      Ticaros' public process story around a closed CliniMACS Prodigy workflow and Matica CDMO support suggests management is already trying to compress manufacturing variability and contamination risk. But no source reviewed quantifies turnaround time, batch failure rate, cost per batch, or expected gross margin. That is a critical difference between scientific promise and financeable operations. Until the company discloses actual manufacturing performance or partner economics, the only honest unit-economics bridge is qualitative: premium category pricing is plausible, but so are large pre-commercial cash needs and weak near-term margins.
    claimRefs: [CI005, CI006, CI007, CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI002, TI003]
    figureRefs: [FI002, FI003]
  - id: capital-adequacy-and-financing-dependence
    title: Capital adequacy and financing dependence
    body: >-
      Publicly visible funding provides a decent but incomplete map of capital adequacy. Official company history lists roughly $8 million across Series A and B and roughly $22 million in Series C; Korean business coverage confirms a March 2026 Series D of KRW 20.8 billion, with proceeds intended to finish TC011 Phase II work and push TC091 toward Phase I. Public profile databases broadly place cumulative funding at roughly $42.5 million to $42.7 million. The company also highlights repeated Ministry and KDDF grants across 2020 through 2025. Those facts make two things clear. First, Ticaros has been able to attract both private and non-dilutive capital repeatedly. Second, the company still appears to be funding development rather than scaling commercial operations.

      What cannot be derived from the open record is the actual runway after Series D. There is no disclosed cash balance, monthly burn, debt facility, or forecast use-of-funds schedule beyond generic program statements. The presence of RCPS structure in Series D also suggests a financing environment in which investors still seek downside protections common to private biotech. Relative to listed competitors and large-pharma incumbents, Ticaros remains small and funding-dependent. That is not unusual for the stage. It just means financing risk must be carried explicitly into the investment case rather than buried inside optimistic scientific assumptions.
    claimRefs: [CI003, CI004, CI018, CI019, CI020, CI021, CI022, CI023, CI024]
    tableRefs: [TI004, TI005]
    figureRefs: [FI004]
  - id: financial-verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is not that Ticaros lacks potential. It is that the public record remains too thin to measure its potential cleanly. The company operates in a category where eventual pricing can be high, where differentiated platform science can attract valuable licensing conversations, and where financing has continued to appear even before commercialization. Those are positives. But investors still do not know the current cash balance, burn, cash runway, planned CMC spend, expected manufacturing yield, or any product-level contribution margin. Public profile sites also conflict on valuation, and none of the accessible primary materials reconcile the cap table. That is too much uncertainty for precise financial modeling.

      The appropriate takeaway is to keep financial diligence tightly linked to milestone gating. A reasonable underwriter should ask for cash runway tied to TC011 and TC091 milestones, grant timing, CMC scale-up spending, and partnership inflow assumptions. If the company can show enough cash to reach a genuinely value-inflecting data event without a dilutive emergency raise, the risk profile improves. If not, future financing could dominate scientific upside. At the current public evidence level, Ticaros should be treated as a capital-intensive, under-disclosed clinical platform with upside optionality, not as a disclosed operating company.
    claimRefs: [CI001, CI002, CI010, CI016, CI022, CI023, CI024, CI025, CI026]
