      background: Former DiNonA CFO, Dimension Investment Advisory VP, Dream Technology Investment MD, and treasury leader at HSBC and BNP Paribas.
      claimRefs: [CO010]
  foundingLocation: Seoul, South Korea
  headquarters: Seongdong-gu, Seoul, South Korea
  productSummary: >-
    Ticaros is developing CAR-T therapies and underlying receptor-design platforms: CLIP CAR as a backbone upgrade, Converter CAR as an immune-enhancing logic layer, Switchable CAR as a controllable-targeting and safety concept, and TC011 as the lead follicular-lymphoma program.
  customerFocus: >-
    Current external users and counterparties are clinical investigators, specialist treatment centers, manufacturing partners, research collaborators, and future hospital-payer stakeholders rather than a broad commercial customer base.
  businessModel: >-
    The likely future model combines direct therapy revenue if lead programs reach approval with partnership, licensing, or milestone income around the platform and non-dilutive grant support during the clinical buildout.
  stage: private, clinical-stage platform biotech
  fundingStatus: >-
    Publicly visible funding includes about $8 million across Series A and B, about $22 million in Series C, and roughly KRW 20.8 billion (~$14.3 million) in a March 2026 Series D. Current valuation terms, share price, and liquidation preferences are not publicly disclosed.
