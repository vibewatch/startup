  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current price and terms
      missingEvidence: Current round price per share, post-money valuation, liquidation preferences, and cap table.
      whyItMatters: A private-company valuation chapter is mostly incomplete without the actual price and terms.
      diligencePath: Request the latest term sheet, board financing materials, and fully diluted cap table.
      relatedQuestionRefs: [QV001, QV014, QV023]
      relatedTableRefs: [TV006]
    - type: private-evidence-only
      severity: material
      topic: economics and runway
      missingEvidence: Revenue, burn, runway, cost per batch, and margin or cash-yield bridge.
      whyItMatters: These are the variables that determine whether a platform premium is deserved or dangerous.
      diligencePath: Request management accounts, cash runway model, and CMC KPI dashboard.
      relatedQuestionRefs: [QV014, QV016, QV023]
      relatedTableRefs: [TV006]
    - type: private-evidence-only
      severity: material
      topic: commercialization and partner monetization
      missingEvidence: Site expansion, treatment-center plan, payer strategy, and monetization terms for visible partners.
      whyItMatters: Without these, investors are pricing future adoption mostly on hope.
      diligencePath: Request commercialization plan, partner contracts, and site-activation roadmap.
      relatedQuestionRefs: [QV015, QV017, QV023]
      relatedTableRefs: [TV004, TV005, TV006]
