      - ['Financing pressure', 'Need for capital before next real proof point', 'Shifts upside toward dilution rather than value creation', 'Demand downside protection or pass']
      - ['Platform translation miss', 'CLIP or Switchable advantages do not survive translation into clinically relevant data', 'Reduces differentiation to generic clinical-stage biotech', 'Re-rate to lower public-comp band']
      - ['Aggressive price asks', 'Proposed private mark already assumes low risk and broad future commercialization', 'Public evidence no longer supports entry discipline', 'Do not continue without exceptional private proof']
    notes: These triggers convert abstract uncertainty into investment-action rules.
    claimRefs: [CV020, CV036, CV037, CV038]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, Missing evidence, Why it matters, Owner or diligence path]
    rows:
      - ['Current financing terms', 'Price per share, post-money, liquidation preferences, and cap table', 'No exact valuation call is credible without these', 'Management / data room']
      - ['Runway and burn', 'Cash balance, monthly burn, and milestone-linked budget', 'Determines dilution and financing timing', 'Finance team / board materials']
      - ['Manufacturing economics', 'Yield, turnaround, cost per batch, and release history', 'Determines whether platform premium is deserved', 'CMC team / operations dashboard']
      - ['Clinical and provider expansion', 'Site list, enrollment, investigator map, and adoption plan', 'Shows whether one visible study can become a broader footprint', 'Clinical operations']
      - ['Partner economics', 'Contract scope, milestones, and recurring cash flows for Matica, Cartherics, or others', 'Separates logos from actual monetization', 'Alliance management']
      - ['IP and moat depth', 'FTO analysis and patent-defense strategy', 'A platform premium depends on defendability as well as novelty', 'Legal / external counsel']
    notes: These are the minimum items required to move from public-interest mode to actual price underwriting.
    claimRefs: [CV001, CV002, CV017, CV018, CV019, CV023]
