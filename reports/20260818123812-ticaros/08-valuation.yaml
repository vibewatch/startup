      - [base, 'TC011, platform science, and partner logic survive diligence, but economics remain early and commercial scale is still ahead.', 'Supportable range roughly $0.4B-$0.8B, a modest premium around the public clinical-stage band.', 'Execution risk stays high and premium remains conditional.', 'Most defensible starting case from current public evidence.']
      - [bull, 'Private materials show stronger clinical, manufacturing, and financing readiness than the public record reveals, and investors accept a platform premium.', 'Supportable range roughly $0.8B-$1.3B.', 'Requires proof that is not presently public.', 'Possible only with unusually strong private evidence.']
    notes: Ranges are guardrails, not claims about the actual current private mark.
