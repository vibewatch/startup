      - [anti-thesis, 'No reviewed public source discloses the current valuation, price per share, or preference stack.', 'Risk falls sharply if management shares the term sheet, cap table, or recent financing docs.']
      - [anti-thesis, 'Public evidence still does not show revenue, burn, runway, or margin, so investors may be asked to price future execution as though it were already proven.', 'Improves if private diligence closes the economics gap.']
