  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: manufacturing-performance
      missingEvidence: Batch success rate, turnaround time, yield, release deviations, and cost per batch for Ticaros' closed manufacturing workflow.
      whyItMatters: These are the operating metrics that would turn a plausible manufacturing story into a defensible product and moat story.
      diligencePath: Request the CMC dashboard, manufacturing transfer package, and recent batch-history summary.
      relatedQuestionRefs: [QE021]
    - type: private-evidence-only
      severity: material
      topic: platform-human-proof
      missingEvidence: Human efficacy and safety data attributable specifically to CLIP CAR, Converter CAR, or Switchable CAR design choices rather than only to the broader TC011 program.
      whyItMatters: Without design-specific human data, investors cannot tell how much of the moat survives translation from preclinical evidence into patient outcomes.
      diligencePath: Request program-level translational datasets and any unpublished human biomarker or safety readouts.
      relatedQuestionRefs: [QE023]
    - type: private-evidence-only
      severity: medium
      topic: systems-and-ip
      missingEvidence: Validated software-control documentation, cybersecurity package, and freedom-to-operate analysis.
      whyItMatters: Product-tech diligence is incomplete when digital controls and IP freedom are both major parts of the claimed moat.
      diligencePath: Request the validation master summary, security controls overview, and external IP counsel memo.
      relatedQuestionRefs: [QE020, QE022, QE018]
