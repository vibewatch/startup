company:
  name: Ticaros Co., Ltd.
chapter:
  number: 6
  title: Customers
summary: >-
  Ticaros does not yet have a publicly visible commercial customer base in the usual SaaS or medtech sense. The observable customer surface is pre-commercial and ecosystem-driven: one visible clinical path centered on the TC011 follicular lymphoma study and principal investigator Won Seog Kim at Samsung Medical Center, manufacturing counterparties such as Minaris and Matica, research collaborators such as Cartherics, and business-development ecosystem support through JLABS Korea. That is enough to prove external demand and real-world user touchpoints, but not enough to prove repeat revenue, payer adoption, hospital procurement, or diversified account growth. The right read is that Ticaros has credible translational users and counterparties, not a disclosed recurring commercial customer base.
sections:
  - id: customer-surface-and-segmentation
    title: Customer surface and segmentation
    body: >-
      Ticaros' public customer file has to be read differently from an enterprise software company or a commercial therapeutics company. There is no public list of paying hospital customers, recurring licensees, or treatment-center contracts. Instead, the customer surface is segmented across clinical investigators and treatment sites, manufacturing and CDMO counterparties, research collaborators, accelerator or ecosystem partners, and the future buyer-user-payer chain that would matter after commercialization. The most concrete current user visible in public evidence is the TC011 clinical path: Ticaros is the study sponsor, Won Seog Kim of Samsung Medical Center is the named principal investigator, and the protocol requires leukapheresis, manufacturing success, infusion, and long follow-up. That is a real user surface, but it is still a clinical-development surface.

      The other visible segments are equally important. Minaris and Matica sit on the manufacturing side, helping translate science into clinical supply. Cartherics is a modality-expansion collaborator rather than a product buyer, but it is still external proof that another biotech sees value in Ticaros' receptor design. JLABS Korea is not a customer, yet it matters as ecosystem validation because it gives Ticaros access to business-development and clinical-development support within the Johnson & Johnson innovation network. The key discipline is not to overstate any of these relationships. Together they prove interest and utility. They do not yet prove a revenue-diversified commercial base.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU013, CU014, CU015, CU020, CU021, CU024]
    tableRefs: [TU001, TU006]
  - id: named-proof-and-adoption-trajectory
    title: Named proof and adoption trajectory
    body: >-
      The strongest named proof in public sources is the Samsung Medical Center-linked TC011 study. ClinicalTrials.gov identifies Ticaros as sponsor and names Won Seog Kim, MD, PhD, of Samsung Medical Center as principal investigator. The registry also states that eligible patients must undergo leukapheresis and successful TC011 manufacture before infusion, which confirms that Ticaros has moved beyond lab-only claims into a defined clinical workflow. Sedaily's January 2026 coverage that TC011 won approval to expand into follicular lymphoma strengthens the same read by showing that the path is current, not stale. The proof surface is still narrow because the study record shows no location data and does not disclose multi-center site expansion, but it is real.

      Around that core clinical proof, the adoption trajectory broadens through partners rather than through obvious recurring buyers. In 2023 Minaris published the Korean clinical-approval milestone; in 2024 Ticaros entered Cartherics and JLABS Korea relationships; in 2025 Matica signed a CDMO deal for solid-tumor TC091 supply; and in 2026 the follicular-lymphoma indication-expansion story made the lead program more legible to hospitals and investigators. That sequence shows the external ecosystem getting deeper across development, manufacturing, and partnering. It still does not show a classic customer funnel from initial sale to deployed recurring account. Ticaros has adoption signals, but most of them are milestone-shaped rather than revenue-shaped.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU020, CU021, CU027, CU028, CU037]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001, FU002]
  - id: durability-expansion-and-gaps
    title: Durability, expansion, and visibility gaps
    body: >-
      Standard customer-durability metrics are almost entirely absent. No reviewed source disclosed customer count, repeat purchase rate, NRR, GRR, retention, churn, renewal rate, treatment-center growth, or contract duration with hospitals or commercial buyers. Even where there are named counterparties, the economic depth is usually missing. Cartherics explicitly preserves both parties' development rights and points only to the possibility of future development or commercialization agreements. Matica's agreement shows clinical-supply intent for TC091, but not batch volume, term length, or spend. JLABS Korea is important for business-development access but is not a product customer at all. This means public durability has to be inferred from step-up logic, not from actual account economics.

      The step-up logic is directionally positive but still incomplete. The customer file expanded from clinical approval support into accelerator access, manufacturing partnerships, modality collaborations, and an updated registry-backed indication path. That suggests the ecosystem is deepening rather than shrinking. Yet the visible proof remains concentrated in a handful of counterparties and one principal clinical path. There is still no public evidence of broad provider-network onboarding, payer negotiation, or repeated account monetization. The practical conclusion is that Ticaros currently has ecosystem durability signals, not commercial retention metrics. That is enough for continued diligence, but not enough to underwrite customer stickiness with precision.
    claimRefs: [CU016, CU017, CU018, CU019, CU022, CU023, CU031, CU032, CU033, CU034, CU035, CU038]
    tableRefs: [TU004, TU007]
  - id: concentration-and-go-to-market-risk
    title: Concentration and go-to-market risk
    body: >-
      Customer concentration is currently high because the public proof map is so small. One visible clinical route centers on Samsung Medical Center and the TC011 protocol. The manufacturing side is anchored by Minaris historically and Matica for TC091 supply work. The research-collaboration surface is anchored by Cartherics. The ecosystem-development surface is anchored by JLABS Korea. That is enough to show outside engagement, but it also means that any one relationship carries disproportionate signaling weight. If the TC011 study stalls, if manufacturing support slips, or if collaborators fail to deepen, the perceived customer story could deteriorate quickly because there is not yet a large set of offsetting public wins.

      The future go-to-market chain is also more complicated than the current public customer file. CAR-T adoption ultimately depends on specialized physicians, treating centers, manufacturing logistics, reimbursement, and patient selection. Broad oncology references make clear that CAR-T therapies require individualized cell collection and specialist delivery, while follicular lymphoma remains a specific and relatively narrow disease setting. So even if Ticaros' science succeeds, expansion into a broad customer base will not be automatic. The company must move from a sponsor-and-partner ecosystem into a true network of hospitals, investigators, and eventually payers. Public evidence today does not show that transition yet. It shows the prerequisites for it.
    claimRefs: [CU024, CU025, CU026, CU029, CU030, CU036, CU037, CU039, CU040]
    tableRefs: [TU005]
