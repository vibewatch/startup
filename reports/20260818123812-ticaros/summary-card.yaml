  topStrengths:
    - >-
      Ticaros has a differentiated public platform file built around CLIP CAR, Converter CAR, and Switchable CAR rather
      than a single simple asset.
    - >-
      TC011 provides a visible phase II follicular-lymphoma clinical path that makes the story more tangible than a
      purely preclinical biotech.
    - >-
      Peer-reviewed CLIP and Switchable publications plus patent work improve confidence that the core science is real
      and internally generated.
    - >-
      Repeated funding and external partners such as Minaris, Matica, Cartherics, and Samsung Medical Center support
      continued diligence.
  topRisks:
    - >-
      Current valuation, share price, cap table, and preference stack remain undisclosed, so entry discipline cannot be
      judged publicly.
    - >-
      Revenue, burn, runway, manufacturing yield, and batch economics remain private, making exact underwriting highly
      vulnerable to false precision.
    - Public customer and provider proof is narrow and ecosystem-driven rather than a diversified commercial base.
    - >-
      Regulatory comparability, CAR-T toxicity, and manufacturing execution remain material residual risks for any
      advanced-cell-therapy platform.
    - Financing dependence remains meaningful because delay can quickly become dilution.
  unresolvedGaps:
    - Current round terms, post-money valuation, liquidation preferences, and fully diluted cap table
    - Runway, monthly burn, and milestone-linked financing plan after the 2026 Series D
    - Manufacturing KPIs including yield, turnaround time, batch success, and cost per batch
    - Site expansion, treatment-center map, and future payer or procurement strategy
    - Partner economics and monetization depth for Matica, Cartherics, and any future alliances
