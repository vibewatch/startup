      - number: '5.4'
        title: 差异化、路线图与开放尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的差异化案例在窄口径下最强。公司有多支点受体设计论点，而不是单一构建体；其中两项设计理念有同行评审支持；Switchable
              控制有专利族；还有一个可见的临床领先资产。这个组合足以把它与简单跟随型自体 CD19 项目区分开来。Cartherics 和 Matica 这类伙伴之所以重要，也在这里：它们暗示平台可以延展到 NK
              或实体瘤工作，且外部交易对手认为这套科学值得整合。公开历史中可见的路线图——Converter 验证、CLIP 开发、韩国 IND、Switchable 发表、2025 年 CLIP 发表和 2026 年
              TC011 适应症扩展——读起来像持续累积的平台建设，而不是一次性新闻流。

              即便如此，产品技术结论仍应克制。最强证据仍处于商业化前，而且不成比例地来自公司生成或公司源头。Converter CAR 的可访问外部证据比 CLIP 或 Switchable
              薄。实体瘤转化在全行业仍然困难，更广泛的 CAR-T 文献也继续警示，毒性、抑制性微环境和制造复杂性仍是重大屏障。围绕软件控制、安全、验证包深度、转移指标或 freedom-to-operate
              分析，公开运营披露也几乎不存在。结果是技术护城河信号真实存在，但公开证明文件还不足以把护城河视为已经充分去风险。
