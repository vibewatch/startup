      - number: '8.4'
        title: 上市可比公司和情景护栏
        blocks:
          - type: paragraph
            body: >-
              上市可比公司组合适合做区间，不适合当公式。StockAnalysis 页面显示，截至 2026 年 8 月 18 日抓取时，Allogene 市值约 $715 million，Autolus 约 $599
              million，Cabaletta 约 $495 million，Lyell 约 $331
              million。这些公司不是完美参照——疗法形态、商业化路径和客户结构都不同——但合起来勾勒出临床阶段细胞治疗公司的实时上市区间。Legend Biotech 约 $3.99
              billion，商业成熟度和收入可见性高得多，更适合作为上沿基准，而不是现实默认值。

              Ticaros 如果能在私下尽调中解决主要未知数，合理位置可能介于较低临床阶段队列和未来高溢价平台标记之间。因此，本章情景区间刻意拉得很宽。悲观情景把 Ticaros
              放在接近甚至低于上市低端区间，因为不透明和融资风险占主导。基准情景在
              TC011、平台科学和合作逻辑经私下尽调站住脚时，允许适度平台溢价。乐观情景只有在私下证据显示商业和制造准备度远高于当前公开记录时，才允许低独角兽式结果。上述情景是决策护栏，不是对当前价格的断言。
