            body: >-
              公开来源中最强的具名证明，是以 Samsung Medical Center 为核心的 TC011 研究。ClinicalTrials.gov 将 Ticaros 识别为申办方，并列出 Samsung
              Medical Center 的 Won Seog Kim, MD, PhD 为主要研究者。登记信息还说明，合格患者必须先接受白细胞单采并成功制造 TC011，之后才能输注；这确认 Ticaros
              已从实验室主张走进定义清楚的临床工作流。Sedaily 2026 年 1 月关于 TC011
              获批扩展至滤泡性淋巴瘤的报道，也强化了同一判断：这条路径是当前的，不是过期的。证明范围仍然狭窄，因为研究记录没有地点数据，也没有披露多中心扩展，但它是真实的。

              围绕这条核心临床证明，采用轨迹不是由显性的经常性买方拓宽，而是由伙伴关系拉宽。2023 年，Minaris 发布韩国临床批准里程碑；2024 年，Ticaros 建立 Cartherics 和 JLABS
              Korea 关系；2025 年，Matica 签署面向实体瘤 TC091 供给的 CDMO 协议；2026
              年，滤泡性淋巴瘤适应症扩展故事让领先项目对医院和研究者更易理解。这一序列显示，外部生态在开发、制造和合作上加深。它仍没有展示从初始销售到部署经常性账户的经典客户漏斗。Ticaros
              有采用信号，但多数是里程碑形态，而不是收入形态。
