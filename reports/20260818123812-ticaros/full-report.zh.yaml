  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和进入纪律
        blocks:
          - type: paragraph
            body: >-
              第一个估值问题不是 Ticaros 有没有意思，而是公开证据今天是否足以给公司定价。答案仍是否定的。公开来源确实给出了继续深挖的理由：Ticaros 已融到可观私募资本，推进 TC011
              进入可见的滤泡性淋巴瘤研究，发表了同行评议平台工作，也搭建了制造和合作关系，实质性高于纯概念阶段生物科技公司的信号。上述事实足以支撑严肃尽调。但保留下来的公开材料没有披露当前投后估值、股价、清算优先权或完全稀释股权结构表。缺少这些输入，任何硬估值判断大多只是表演。

              因此，合适的建议是继续研究，而且必须对价格敏感。只有在拟议进入价格落在一个区间内，且在对经济条款缺失和融资不透明施加大幅折价后仍能自洽时，投资人才应继续推进。如果公司报价已经假设广泛医疗机构采用、制造可靠性干净过关、商业定价权强，公开记录还撑不住。反过来，如果价格反映
              Ticaros 仍是一个资本密集、披露不足、带上行可选性的临床平台，继续尽调才说得通。
