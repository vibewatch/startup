      - number: '5.2'
        title: 平台架构与机制设计
        blocks:
          - type: paragraph
            body: >-
              公开文件中最深的技术证据落在 CLIP CAR 和 Switchable CAR 上。管线页面称 CLIP CAR 是专有 CAR 骨架；2025 年 Nature Communications 论文在
              PubMed 和韩国报道中的描述，让这句话有了真实内容：论文把 CD99 与免疫突触稳定联系起来，并报告称，把 CD99 跨膜和近膜结构域纳入 CAR
              设计后，淋巴瘤模型中的激活和抗肿瘤活性得到改善。这不只是品牌包装，而是关于受体架构如何改善突触形成、进而改变 CAR-T
              功能的具体机制主张。同一论文还披露了发明人和公司关联，进一步说明这是内部源头科学，而非第三方营销语言。

              Switchable CAR 加入了另一套设计逻辑。公开新闻报道和可检索的 PubMed 条目显示，2024 年 Nature Communications 论文题为 “Improved safety of
              chimeric antigen receptor T cells indirectly targeting antigens via switchable
              adaptors”。公司自己管线摘要把它翻译成更直白的话：可控毒性。关于剂量可调适配器的 WIPO 申请也支撑同一套安全导向框架：系统不只是把抗原识别硬接进细胞，而是用中介适配器调节靶向。Converter
              CAR 在产品架构中具有战略重要性，因为公司材料把它呈现为肿瘤微环境或免疫增强模块；但与 CLIP 或 Switchable 相比，可访问的第三方技术细节更少。这种不对称本身就是重要尽调结论。
