      - - 反向逻辑
        - 已审阅的公开来源没有披露当前估值、每股价格或优先股堆叠。
        - 如果管理层分享条款清单、股权结构表或最近融资文件，风险会大幅下降。
      - - 反向逻辑
        - 公开证据仍看不到收入、烧钱速度、现金跑道或利润率，投资人可能被要求给未来执行定价，仿佛它已经得到证明。
        - 如果私有尽调补齐经济性缺口，判断会改善。
    notes: 表格把继续尽调的理由和不能盲目接受激进价格的理由分开。
    claimRefs:
      - CV008
      - CV009
      - CV017
      - CV018
      - CV025
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - TC011 仍然局限，制造和融资风险保持高位，私有尽调没有解决股权结构表或经济性缺口。
        - 可支持区间大约 $0.2B-$0.4B，接近或低于上市临床期队列下沿。
        - 稀释、转化缓慢和持续不透明。
        - 如果当前私有价格已经假设溢价执行，悲观情景就有意义。
      - - 基准
        - TC011、平台科学和伙伴逻辑经受住尽调，但经济性仍处早期，商业规模仍在前方。
        - 可支持区间大约 $0.4B-$0.8B，在上市临床期区间附近给小幅溢价。
        - 执行风险仍高，溢价仍有条件。
        - 从当前公开证据看，这是最站得住的起点。
      - - 乐观
        - 私有材料显示临床、制造和融资就绪度强于公开记录，且投资人接受平台溢价。
        - 可支持区间大约 $0.8B-$1.3B。
        - 需要目前未公开的证据。
        - 只有私有证据异常强时才可能成立。
    notes: 区间是护栏，不是对当前实际私有估值的断言。
    claimRefs:
      - CV024
      - CV029
      - CV036
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数、估值或状态
      - 相关性
      - 局限
    rows:
      - - Lyell Immunopharma
