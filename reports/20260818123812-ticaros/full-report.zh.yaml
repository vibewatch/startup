      - number: '7.2'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险的核心，是外界目前还无法公开衡量的东西。Ticaros 称，它采用基于封闭、自动化 CliniMACS Prodigy 的制造流程，以提高复现性并降低污染。这是临床阶段 CAR-T
              开发商应有的运营叙事。但已审阅来源没有披露收率、周转时间、批次失败率、放行偏差频率、单批成本或转移复现性。Minaris 和 Matica 说明 Ticaros
              在搭建真实的制造关系，但不能替代运营仪表盘。换句话说，公开材料告诉投资人的是管理层希望流程如何运转，而不是这个流程在足够多批次历史中实际如何表现。

              安全风险同样没有消失，因为整个 CAR-T 领域仍有毒性高、运营容错低的问题。TC011 注册记录明确追踪不良事件，多篇毒性综述也强调，即便 CAR-T
              设计持续改进，细胞因子释放综合征、神经毒性及相关炎症综合征仍是主要担忧。Switchable CAR
              在这里有战略意义，因为它本应带来可控靶向并降低正常细胞毒性。但支持这一安全优势的公开证据仍停留在临床前和论文层面，而非人体结局。Ticaros
              因而面对细胞治疗的典型不对称：概念上的风险缓释很强，但把它们转化为低残余运营风险所需的证据尚未公开。
