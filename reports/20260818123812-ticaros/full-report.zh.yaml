      - number: '6.3'
        title: 耐久性、扩张与可见性缺口
        blocks:
          - type: paragraph
            body: >-
              标准客户耐久性指标几乎全部缺席。审阅到的来源没有披露客户数、复购率、NRR、GRR、留存、流失、续约率、治疗中心增长，或与医院和商业买方签订合同的期限。即使存在具名交易对手，经济深度通常也缺失。Cartherics
              明确保留双方开发权利，只指向未来开发或商业化协议的可能性。Matica 协议显示了 TC091 临床供给意图，但没有批次量、期限长度或支出。JLABS Korea
              对业务开发接入重要，但根本不是产品客户。这意味着，公开耐久性只能从递进逻辑推断，而不能从实际账户经济性推断。

              递进逻辑方向上正面，但仍不完整。客户文件从临床批准支持，扩展到加速器接入、制造合作、技术模态协作和有登记支撑的适应症路径更新。这暗示生态在加深，而不是收缩。但可见证明仍集中在少数交易对手和一条主要临床路径上。公开证据仍没有显示广泛服务商网络入驻、支付方谈判或重复账户变现。实际结论是，Ticaros
              目前有生态耐久性信号，而不是商业留存指标。这足以继续尽调，但不足以精确承销客户黏性。
