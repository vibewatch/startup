      - number: '3.3'
        title: 定价、分销权力与转换成本
        blocks:
          - type: paragraph
            body: >-
              当前定价和分销都偏向既有厂商。HMPI 定价分析显示，获批 CAR-T 标价仍很高，Kymriah 约 $475,000，Yescarta 约 $373,000，Breyanzi 约
              $410,300，Carvykti 约
              $465,000，且这还未计入总治疗事件成本。这些数字同时说明两件事：第一，只要报销成立，品类可以支撑溢价定价；第二，新进入者仍要先穿过昂贵且重基础设施的临床路径，定价权才会变成现实。Ticaros
              没有公开披露价格、报销合同或商业化制造规模，因此任何定价比较都只能是相对判断，而非直接观察。

              转换成本也不低。中心认证、医生舒适度、制造可靠性、毒性管理手册和支付方先例，都会让获批产品有黏性。多产品并行可以发生在组合或试验层面，尤其是伙伴和机构评估不同技术模态时；但单个治疗决策仍然保守，因为后果是临床和物流问题，不只是财务问题。这意味着
              Ticaros 大概率只有在证明清晰差异化收益，或通过合作变现而不是立即直接商业化时，才能赢。公开来源还没有足够数据判断哪条路径会占主导。
