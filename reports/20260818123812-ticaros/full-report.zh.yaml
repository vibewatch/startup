  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品到底是什么
        blocks:
          - type: paragraph
            body: >-
              Ticaros 不是在出售通用 CAR-T 工具包。公开材料把公司定位为下一代细胞疗法开发者，围绕一个平台栈搭建；管线页面称之为 T-CAMS，即 Ticaros CAR-Augmenting Modular
              System。这个栈有三层具名技术——CLIP CAR、Converter CAR、Switchable CAR——再加上领先临床项目 TC011
              和封闭式制造系统。放到客户工作流里，目标产品不只是受体构建体；它是一套路径：设计、制造，并最终给患者使用更具选择性或可控性的 CAR-T
              疗法，用于血液肿瘤和实体瘤。公司历史也清楚显示，管理层就是用这套平台逻辑讲述内部业务：Converter CAR 出现在 2008-2018 板块，CLIP CAR 出现在
              2019-2020，Switchable CAR 出现在 2024，TC011 适应症扩展出现在 2026。

              这对尽调很重要，因为可投资资产比单一适应症更宽。公司把 CLIP CAR 呈现为骨架升级，Converter CAR 是增强免疫的逻辑层，Switchable CAR 是毒性控制设计。TC011
              是这个平台最具体的转化表达，因为它有当前公开试验记录。其余部分仍处在更早证明曲线上：科学上有意思，同行评审越来越多，但公开材料尚未附带产品级价格、批次或部署指标。正确的承销读法因此是平台优先，并有一个可见临床矛头；不是一个已在运营规模上证明自己的商业疗法组合。
