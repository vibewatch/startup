      - number: '4.2'
        title: 成本结构、定价类比与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Ticaros 经济性的最佳公开代理来自更广泛的 CAR-T 市场，而不是公司自身披露。HMPI 的 2026 年定价分析显示，获批产品标价集中在每名患者数十万美元高位；一旦计入住院和副作用管理，总治疗成本可接近
              $1 million。这说明，任何获批并获得报销的产品，最终毛利潜力都可能很强——但也说明这种商业模式伴随昂贵制造、严格质量控制和重中心交付要求。综述和 Ticaros
              自身工艺描述都强化了同一点：成本栈包括载体或构建体工作、白细胞单采或细胞处理、QA 或 QC 放行、冷链物流、医院支持和输注后监测。

              Ticaros 围绕封闭式 CliniMACS Prodigy 流程和 Matica CDMO
              支持讲述的公开工艺故事，说明管理层已经在尝试压缩制造波动和污染风险。但审阅到的来源没有量化周转时间、批次失败率、每批成本或预期毛利率。这是科学承诺和可融资运营之间的关键差异。在公司披露实际制造表现或伙伴经济性之前，唯一诚实的单位经济桥仍是定性的：溢价品类定价合理可期，但商业化前现金需求很大、近期利润率偏弱也同样合理。
