            body: >-
              公开可见融资为资本充足性提供了一张还算可用但不完整的地图。公司官方历史列出 A 轮和 B 轮合计约 $8 million、C 轮约 $22 million；韩国商业报道确认 2026 年 3 月 D 轮融资
              KRW 20.8 billion，资金用于完成 TC011 II 期工作，并推动 TC091 进入 I 期。公开档案数据库普遍把累计融资放在约 $42.5 million 至 $42.7
              million。公司还强调 2020 年至 2025 年间多次获得部委和 KDDF 资助。这些事实说明两点。第一，Ticaros
              一直能反复吸引私营资本和非稀释性资本。第二，公司看起来仍在为开发融资，而不是扩大商业运营。

              公开记录无法推导的是 D 轮之后的实际现金跑道。公司没有披露现金余额、月度烧钱、债务额度，或超出泛化项目表述的预测资金用途进度。D 轮采用 RCPS
              结构，也说明融资环境里，投资人仍在寻求私营生物技术投资中常见的下行保护。相较上市竞争者和大型制药既有厂商，Ticaros
              仍然体量小且依赖融资。这对所处阶段并不异常，只是意味着融资风险必须明确写进投资判断，而不能埋进乐观科学假设。
