      - number: '7.3'
        title: 合作方和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的外部生态有帮助，但也带来集中度和执行依赖。公开证据集中在少数合作方：可见临床路径上的 Samsung Medical Center 和 Won Seog Kim，提供此前审批支持的
              Minaris，负责实体瘤制造工作的 Matica，平台合作方 Cartherics，以及提供生态入口的 JLABS
              Korea。这个起点可信，但也意味着关系质量被放大。一旦任何一个可见支柱没有继续深化，公开叙事就会变弱，因为已详细披露、可抵消的关系并不多。公司还依赖一条核心产品路径，而这条路径仍围绕一项可见公开试验记录展开，并不是多项目、多临床管线分散支撑。

              还有一层二阶依赖风险。制造叙事依赖外部设备栈、外部制造支持，以及有自身优先级的合作方能否执行到位。Cartherics 保留自己的开发权；Matica 是 CDMO，不是自有工厂；Samsung Medical
              Center
              是研究者中心，不是确定的长期客户。这类安排在生物科技公司并不罕见。问题只是，今天帮助论证的外部证据面，未来也可能成为延误、重新排序优先级或放大失败的传导通道。因此，集中度和依赖不是两类风险，而是同一风险透过不同合作方呈现。
