  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与披露质量
        blocks:
          - type: paragraph
            body: >-
              Ticaros
              尚未披露常规成长型公司财务判断所需的核心运营指标。审阅到的公司页面、临床试验条目和新闻文章，都没有发布收入、ARR、现金余额、毛利率、积压订单、客户数或员工数。这使本章只能偏向结构，而不是精确测算。未来可能的收入模式有三层：如果
              TC011 或后续资产获批，产生直接产品收入；如果平台更早达成合作，产生授权、共同开发或里程碑收入；商业化前建设期获得非稀释性资助。公开证据今天明确支撑第三层，也合理支撑第二层作为选择权，但尚未显示第一层。

              缺少数据不代表经济性无关紧要，而是说明经济性仍是私有信息。Ticaros 档案中已经反复出现平台合作、制造工艺工作和临床扩展，这些活动都很烧钱。与此同时，审阅到的行业类比显示，获批 CAR-T
              产品可以支撑很高标价，但前提是先跨过复杂的制造、毒性和报销门槛。因此，收入故事在概念上有吸引力，实证上却很薄。财务承销必须从披露质量折价开始。
