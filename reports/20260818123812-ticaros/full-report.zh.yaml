      - number: '7.4'
        title: 资本、团队和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是资本和执行。Ticaros
              仍处于商业化前，没有公开收入或现金跑道披露，看起来仍依赖里程碑挂钩融资。这意味着技术和运营延误不只是科学问题，也是融资问题。公司若不能高效触达下一个可信证据事件，未来融资可能会早于清晰去风险节点到来。公开融资历史和
              2026 年 Series D 显示公司持续获得支持，但没有证明它具备自我造血的商业模式。因此，投资人必须把烧钱速度和证据转化放在一起跟踪，而不是当作两条独立工作流。

              人员风险也来自同一逻辑。公开领导层名单在科学上分量不轻，但公司仍需要在临床运营、CMC、监管执行和合作管理上持续优秀。投资逻辑破裂点很直接。可比性桥接失败、制造反复受挫、TC011
              进展慢于预期、失去可见合作方，或出现证据显示 Switchable 或 CLIP 优势无法穿透临床转化，每一项都会实质压缩上行空间。今天的公开记录足以支持继续尽调，但还不足以排除这些断点。
