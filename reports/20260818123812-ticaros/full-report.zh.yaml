      - number: '3.4'
        title: 护城河耐久性与竞争结论
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的护城河主张有逻辑，但仍不完整。CLIP CAR 论文为更强免疫突触形成提供了真实机制论据，Switchable CAR 专利族为安全控制提供了真实法律支架，公司现在又把这些平台主张与 TC011
              早期人体疗效和外部可见合作配在一起。这比只停留在幻灯片上的护城河更强。即便如此，它还不是耐久的商业护城河。公开证据没有显示全球中心覆盖、主导性制造规模、经常性产品收入或支付方锁定。从这个意义上说，Ticaros
              的护城河是科学优先，而不是市场优先。

              因此，竞争结论应保持平衡。Ticaros 在科学差异化上强于普通区域性 CAR-T 初创公司，但商业扎根程度远弱于获批龙头，资本实力也远弱于最大的平台挑战者。最可能的近期胜利条件，不是立刻从
              Novartis、Gilead、BMS 或 Legend 手中抢份额；而是拿出足够差异化的数据，让 Ticaros
              在现有产品受安全性、可制造性或实体瘤表现限制的细分场景里，成为可信的授权、共同开发或区域临床赢家。投资人应把这视为有条件的护城河，而不是已经确定的护城河。
