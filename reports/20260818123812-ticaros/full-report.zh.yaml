chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、科学根基，以及公司在搭建什么
        blocks:
          - type: paragraph
            body: >-
              Ticaros Co., Ltd. 将自己定位为一家下一代韩国免疫肿瘤公司，聚焦用于癌症治疗的基因改造 T 细胞疗法。公司官方材料称，业务成立于 2018 年 6 月，如今总部和研发中心位于 Seoul
              Seongdong-gu 的 Seongsoo AK Valley，并在 Seoul National University College of Medicine
              设有分子免疫学实验室。作为私营生物技术公司，Ticaros 的科学身份披露得异常清楚：公司称平台来自 Seoul National University 和 National Cancer Center
              积累的免疫学与细胞疗法经验；几乎所有现有公司描述都围绕三项专有平台理念展开，而不是押注单一狭窄资产。

              这三项理念是 CLIP CAR、Converter CAR 和 Switchable CAR。公司把 CLIP CAR 定义为一种 CAR 骨架设计，用来强化工程化免疫细胞与肿瘤细胞之间的免疫突触。公司把
              Converter CAR 定义为一种肿瘤选择性 CTLA-4 抑制策略，目标是在不系统性激活非肿瘤特异性 T 细胞的情况下提升疗效。公司把 Switchable CAR
              定义为一种由适配器介导的控制层，目标是降低 on-target off-tumor 毒性，并扩大可覆盖抗原空间。落到管线组合上，Ticaros 仍是临床阶段公司，不是商业阶段公司：TC011
              是进展最靠前的血液肿瘤项目，TC091 是可见的实体瘤项目，其余故事更多是平台杠杆、制造可重复性和合作选择权，而不是已经入账的产品收入。
