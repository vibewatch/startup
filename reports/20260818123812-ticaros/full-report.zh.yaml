      - number: '1.2'
        title: 领导层、创始人-市场匹配与机构网络
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的领导层画像是科学上强于商业化，但并非单科学家空壳。公开领导层名单包括 CEO Jae Won Lee、CTO Kyung Ho Choi、CSO Eun Young Choi、研究负责人
              Hyung Bae Park、CMC 负责人 Sun Young Park、临床开发负责人 Young Ok Kim，以及业务管理负责人 Sung Hoon Jung。Lee
              的履历对一家韩国平台型生物技术公司来说明显偏金融——曾任职 DiNonA、Dimension Investment Advisory、Dream Technology Investment、HSBC 和 BNP
              Paribas；Kyung Ho Choi 与 Eun Young Choi 则凭借 Seoul National University 教职，以及涵盖 National Cancer
              Center、NIH、Jackson Laboratory 的过往经历，带来最深的转化可信度。

              这组组合重要，因为 Ticaros 走的是混合打法：学术源头的平台科学、韩国临床执行、政府资助获取，以及跨境合作。官方材料和新闻流显示，其网络比标准的国内实验室孵化企业更宽。公司在合作版图中列出 City of
              Hope、Cartherics、JLABS Korea、GC Cell、WuXi/Minaris，以及 Oxford Gene Technology
              体系中的伙伴。这个网络不能证明商业化已经准备好，但说明公司已经积累了足够的科学与 BD
              可信度，能在研究、制造和开放创新渠道吸引声誉不错的合作者。主要治理缺口在于公开材料仍以描述为主，治理披露不足：没有董事会组成、独立董事结构、所有权拆分或继任框架。
