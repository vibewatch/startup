      - number: '4.4'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论不是 Ticaros
              没有潜力，而是公开记录太薄，无法干净地衡量这种潜力。公司所在品类未来定价可能很高，差异化平台科学可能吸引有价值的授权对话，商业化前也持续拿到融资。这些都是正面因素。但投资人仍不知道当前现金余额、烧钱速度、现金跑道、计划
              CMC 支出、预期制造良率或任何产品级贡献利润。公开档案网站在估值上也互相冲突，可访问的一手材料没有一份能对齐股权结构。不确定性太多，无法做精确财务建模。

              合适结论是把财务尽调牢牢绑在里程碑闸门上。合理承销方应要求公司提供与 TC011 和 TC091 里程碑绑定的现金跑道、资助到账时间、CMC
              扩产支出以及合作流入假设。如果公司能证明现金足以支撑到真正改变价值的数据事件，而不需要紧急稀释性融资，风险画像会改善。否则，未来融资可能压过科学上行。在当前公开证据水平下，Ticaros
              应被视为一个重资本、披露不足、带上行选择权的临床平台，而不是一家已披露运营细节的公司。
