      - number: '5.3'
        title: 制造、质量与转化路径
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的公开制造故事层级较高，但方向上连贯。管线页面称，公司围绕 Miltenyi 的 CliniMACS Prodigy 封闭自动化系统优化工艺，让 CAR-T
              生产更可重复、更安全，同时降低污染风险和人工波动。管线页面甚至强调 “easy to tech transfer”，这对任何临床细胞疗法平台都是重要目标。Minaris 的 2023 年批准说明、TC011
              ClinicalTrials.gov 登记，以及 2025 年 Matica 合作文章合在一起，说明制造叙事并非纯概念。这里有真实的韩国 IND 历史、活跃的公开 II 期滤泡性淋巴瘤登记，以及用于实体瘤
              CAR-T 工作的可见外部制造支持。

              但公开文件的边界同样清楚。审阅到的来源没有发布批次放行表现、周转时间、载体效率、剂量制造成功率、超规格偏差历史、每批成本或跨中心转移数据。领先临床登记也只证明一条可见产品路径——复发或难治性滤泡性淋巴瘤中的
              TC011——而不是 CLIP、Converter 和 Switchable 项目上的广泛公开运营记录。因此，制造判断是正面但不完整的：Ticaros
              已从概念幻灯片走进受监管临床活动，但投资人仍缺少性能数据，无法把一个可信的工艺故事转换成充分承销的制造护城河。
