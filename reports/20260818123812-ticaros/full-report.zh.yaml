      - number: '8.3'
        title: 为什么公开承销今天仍然失效
        blocks:
          - type: paragraph
            body: >-
              反向逻辑不是 Ticaros
              没有科学潜力，而是公开证据仍过不了承销基本功。已审阅来源没有发布确认收入、毛利率、当前现金、烧钱速度、批次经济性、治疗中心数量，也没有给出任何合作带来的清晰收入桥。即便公开估值表面也互相冲突：Caplight
              给出估值估计，CB Insights 有财务页面，但都没有提供投资人真正承销私募价格所需的股权结构清晰度。因此，Ticaros
              比本章使用的所有上市可比公司更不透明。上市同业会披露市值、财报、投资者关系材料，有些还披露商业收入。Ticaros 没有。

              该缺口很关键，因为先进细胞治疗是一个高度依赖证据的行业。私营公司看起来可以很令人兴奋，但如果投资人被要求一次性为未来制造可靠性、未来支付方接受度和未来多中心临床扩张买单，它仍可能被高估。公开记录还没有显示上述未来状态已经挣到。公开记录只显示它们仍有可能。价格必须反映这个差异。否则，合适答案是等待，而不是为虚假精确找理由。
