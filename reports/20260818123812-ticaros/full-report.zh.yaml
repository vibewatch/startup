companyProfile:
  summary: >-
    Ticaros 是一家总部位于 Seoul 的私营 CAR-T 平台生物技术公司，2018 年围绕 Seoul National University 和 National Cancer Center
    的免疫学人才创立。公司在搭建下一代细胞疗法栈，核心是 CLIP CAR、Converter CAR 和 Switchable CAR 三个概念；TC011 是公开披露的领先临床项目，TC091
    是具名的实体瘤后续路径。公开证据显示，公司在科学和转化上取得了有意义的进展，包括经同行评审的平台论文、可见的韩国 II
    期滤泡性淋巴瘤研究，以及外部制造或合作关系。不过业务仍处于商业化前阶段，公开记录描述的是一个重资本的临床平台，而不是一家已经披露运营指标的公司。
