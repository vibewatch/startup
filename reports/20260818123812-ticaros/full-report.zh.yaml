  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及 Ticaros 真正卖向哪里
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的正确市场边界不是“所有肿瘤”，甚至不是“所有免疫疗法”。最接近的商业边界是 CAR-T 细胞疗法市场，加上支撑下一代细胞疗法的相邻授权和制造生态。MarketsandMarkets 估算，全球
              CAR-T 市场 2026 年为 $6.78 billion，高于 2025 年的 $5.98 billion，并预测到 2031 年达到 $13.56 billion。Vision LifeSciences
              另行称，CAR-T 是商业上最成功的细胞和基因疗法平台，年收入超过 $5 billion，目前拐点由前线治疗扩展、自身免疫机会和下一代平台创新推动。

              这个边界对 Ticaros 仍需再收窄。当前获批支出集中在血液系统恶性肿瘤，而不是实体瘤；也集中在高度专科化中心，而不是广泛社区医疗。Ticaros 的可见项目对应两个不同子市场：复发或难治性 B 细胞淋巴瘤中的
              TC011，以及实体瘤中的 TC091。更近的期限内，可投资市场因此是后线淋巴瘤治疗，以及围绕血液学 CAR-T 差异化的合作预算。更广的实体瘤机会应放在 TAM 里，但不能放进高置信的短期
              SAM，因为文献仍把实体瘤描述为 CAR-T 最难打的领域，原因在于浸润、抗原异质性和肿瘤微环境抑制。
