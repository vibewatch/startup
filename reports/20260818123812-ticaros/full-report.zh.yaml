      - number: '1.4'
        title: 外部验证、冲突的估值信号与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Ticaros 最强的外部验证来自科学和临床，而不是财务。2025 年发表、PubMed 收录的 CLIP CAR 工作显示，CD99 介导的骨架可以增强免疫突触形成，并改善淋巴瘤模型中的 CAR-T
              功能；作者和利益冲突披露直接把多名发明人与员工关联到 Ticaros。Switchable CAR 论文及其对应的 WIPO 和美国同族 专利申请表明，平台不只是营销语言，而是一条正式发明流，受让方连到
              Seoul National University R&DB Foundation 和 Ticaros。合作证据也强于一般私营韩国生物技术公司：Cartherics 公开描述了围绕 iPSC 衍生 NK 细胞中
              CLIP-CAR 的合作研究协议，Matica 公开描述了 TC091 制造的 CDMO 协议。

              文件最薄弱之处，是能否按精确价格投资。公司材料没有披露收入、员工数、客户数或投后 估值。审阅到的 D 轮文章清楚确认了融资规模、具名投资人和资金用途，但文章本身没有发布量化的独角兽估值。审阅到的唯一可访问估值页面
              Caplight 显示，截至 2026 年 8 月，估算估值约 $197 million，显著低于市场上 Ticaros 已跨过独角兽门槛的更宽泛叙事。这不能证明 Caplight
              正确；它证明公开记录不一致。因此，尽调必须同时带着两条事实往前走：Ticaros 的科学和试验动能越来越真实，但其当前财务规模仍严重披露不足。
