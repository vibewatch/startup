      - number: '1.3'
        title: 融资历史、开发里程碑与当前阶段
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一条可信的资本和里程碑轨迹，尽管它不能完全钉住当前估值。公司官方历史页面称，Ticaros 到 2020 年通过 A 轮和 B 轮合计融资约 $8 million，2021 年 C 轮融资约 $22
              million。韩国新闻报道与公司时间线都指向 2026 年 3 月 D 轮融资 KRW 20.8 billion，据报道以可赎回可转换优先股发行，由 SJ Investment Partners、Kiwoom
              Securities 和 iM Investment Partners 支持。Caplight、CB Insights 等公开档案平台大体认可公司累计融资略高于 $40
              million，虽然不同提供方给出的精确总额不一，审阅到的可访问来源也没有给出清晰的股权结构桥。

              运营上，里程碑路径是真实存在的。Ticaros 2023 年取得韩国 TC011 IND 批准，使公司从临床前平台进入临床阶段开发者。随后，公司在 2024 年和 2025 年扩大合作、在 Nature
              Communications 系列公开渠道发表 Switchable CAR 与 CLIP CAR 工作，并围绕封闭式 CliniMACS Prodigy 工艺加深制造能力。2026 年 1 月，MFDS 批准
              TC011 扩展至滤泡性淋巴瘤 II 期，D 轮资金公开用途是完成 TC011 II 期工作并推动 TC091 进入 I
              期。因此，公司已经越过纯平台叙事，但还没有商业化证明：公开记录中没有披露收入基础、上市产品或已验证的后期授权经济性。
