  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 核心项目停滞
        - TC011 未能推进，或向 FL 扩展没有转成更强证据
        - 削弱近期去风险叙事
        - 向悲观情景压缩
      - - 制造弱点
        - 私有 KPI 审查显示良率差、延期或技术转移脆弱
        - 打破平台溢价逻辑
        - 暂停，或要求大幅折价
      - - 融资压力
        - 下一个真实验证点前就需要资本
        - 上行转向稀释，而不是价值创造
        - 要求下行保护，或放弃
      - - 平台转化失误
        - CLIP 或 Switchable 优势没有转化成临床相关数据
        - 差异化降到普通临床期生物科技水平
        - 重估到较低的上市可比区间
      - - 激进要价
        - 拟议私有估值已经假设低风险和广泛未来商业化
        - 公开证据不再支持入场纪律
        - 没有异常强的私有证据就不要继续
    notes: 这些触发项把抽象不确定性转成投资动作规则。
    claimRefs:
      - CV020
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前融资条款
        - 每股价格、投后估值、清算优先权和股权结构表
        - 没有这些，任何精确估值判断都站不住
        - 管理层 / 数据室
      - - 现金跑道和烧钱速度
        - 现金余额、月度烧钱速度和里程碑挂钩预算
        - 决定稀释和融资时点
        - 财务团队 / 董事会材料
      - - 制造经济性
        - 良率、周转时间、单批成本和放行历史
        - 决定平台溢价是否站得住
        - CMC 团队 / 运营看板
      - - 临床和医疗服务方扩展
        - 中心清单、入组、研究者地图和采用计划
        - 说明一项可见研究能否扩展成更广覆盖
        - 临床运营
      - - 伙伴经济性
        - Matica、Cartherics 或其他伙伴的合同范围、里程碑和经常性现金流
        - 把标识露出和真实变现分开
        - 联盟管理
      - - IP 和护城河深度
        - FTO 分析和专利防御策略
        - 平台溢价既取决于新颖性，也取决于可防御性
        - 法务 / 外部律师
    notes: 这些是从公开兴趣模式转向真正承销价格所需的最低项目。
    claimRefs:
      - CV001
      - CV002
      - CV017
      - CV018
      - CV019
      - CV023
