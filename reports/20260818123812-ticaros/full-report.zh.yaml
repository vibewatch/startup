      - number: '2.4'
        title: 规模判断与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最诚实的规模判断是分层的。TAM 很大，因为 CAR-T 扩张真实存在，实体瘤远大于血液系统恶性肿瘤，围绕下一代细胞疗法的平台授权市场也很活跃。SAM 明显更小，因为 Ticaros
              当前证据基础只支撑成人复发或难治性 B 细胞淋巴瘤，以及临床前或早期临床的实体瘤扩展。SOM 再小一层，因为 Ticaros
              仍缺少公开证据，证明自身具备商业化能力、报销牵引或收入规模下的制造吞吐。因此，市场故事方向上有吸引力，但份额获取还没有去风险。

              关键尽调缺口不是市场是否存在。市场显然存在。更难的问题是：Ticaros
              能否以足够持久性触达市场；其差异化是否强到足以替代或补充资本更充足的同行；韩国优先的临床证明能否转化为全球授权或直接商业化经济性。合理的承销立场，是沿用“大 TAM、受限 SAM、证据偏薄
              SOM”的框架。这样可以避开私营生物技术分析中常见的两个错误：因为公司早期就否定机会，或假设大肿瘤市场会自动转化为一家临床阶段平台公司的大规模短期收入市场。
