      - number: '8.2'
        title: 为什么这个故事原则上值得关注
        blocks:
          - type: paragraph
            body: >-
              这里确实有一条真实投资逻辑。Ticaros 不是在把方案卖给一个虚构问题。CAR-T 仍是最有价值的肿瘤治疗形态之一，而 Ticaros 搭出的平台叙事，比单一 CD19 资产克隆更有差异化。CLIP CAR 和
              Switchable CAR 有同行评议支持，公司把 Converter CAR 定位为肿瘤微环境答案，核心 TC011 项目在临床上可见，Minaris、Matica、Cartherics
              等外部合作方也说明第三方严肃到愿意与平台合作。包括 2026 年 Series D 在内的持续融资支持，进一步说明投资人和合作方并未放弃这条故事线。

              上述特征正是它相对更弱的概念阶段生物科技公司获得溢价的依据。一个有同行评议平台科学、一条可见人体研究路径、并具备一定制造基础设施逻辑的公司，不该和只有 PPT
              的创业公司同价。需要警惕的是，溢价必须锚定已经被证明的东西。Ticaros 证明了平台雄心，还没有证明广泛商业执行。公开证据支持关注估值，而不是为估值亢奋买单。
