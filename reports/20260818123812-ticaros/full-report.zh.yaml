  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 既有商业化阵营
        blocks:
          - type: paragraph
            body: >-
              第一层竞争是已经站稳的商业化 CAR-T 群体。UPMC 的获批疗法列表，以及 Yescarta、Breyanzi、Carvykti
              的产品网站显示，从市场结构看，这一品类已不再是实验性。各产品定位为通过专科中心交付的一次性个性化治疗，但已经享有医生熟悉度、制造基础设施、获批标签和支付方经验。Yescarta 称，自获批以来全球已有超过
              25,000 名患者接受治疗。Breyanzi 和 Carvykti 强调同样的医院级交付模式，获批产品综述也确认，多款 CD19 和 BCMA 产品已经覆盖关键血液学场景。

              对 Ticaros 来说，这意味着血液肿瘤目标市场有吸引力，但拥挤。TC011 进入的不是空白的后线淋巴瘤细分市场，而是一个已有多款品牌 CAR-T 疗法完成临床常态化的战场。因此，Ticaros
              的负担是比较性证明。如果疗效和安全性只是相近，规模和渠道权力会偏向既有厂商。如果 CLIP CAR 或 Switchable CAR
              能带来更干净的疗效、更低神经毒性或更好的可制造性，公司仍可能作为合作伙伴或差异化进入者有存在感。但基线必须清楚：现有厂商占据当前标准设定位置。
