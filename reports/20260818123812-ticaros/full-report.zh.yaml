  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户接触面与分层
        blocks:
          - type: paragraph
            body: >-
              Ticaros 的公开客户文件不能按企业软件公司或商业化疗法公司那样读。公开信息中没有付费医院客户、经常性被许可方或治疗中心合同名单。相反，客户接触面分布在临床研究者与治疗地点、制造和 CDMO
              交易对手、研究合作者、加速器或生态伙伴，以及商业化后才重要的未来买方—用户—支付方链条。公开证据中当前最具体的用户，是 TC011 临床路径：Ticaros 是研究申办方，Samsung Medical
              Center 的 Won Seog Kim 是具名主要研究者，方案要求完成白细胞单采、制造成功、输注和长期随访。这是真实用户界面，但仍然是临床开发界面。

              其他可见分层同样重要。Minaris 和 Matica 位于制造侧，帮助把科学转化为临床供给。Cartherics 是技术模态扩展合作者，而不是产品买方，但它仍是外部证明：另一家生物技术公司看到了 Ticaros
              受体设计的价值。JLABS Korea 不是客户，却作为生态验证有意义，因为它让 Ticaros 接入 Johnson & Johnson
              创新网络中的业务开发和临床开发支持。关键纪律是不要夸大这些关系。合在一起，它们证明外部兴趣和实用性；还不能证明收入多元的商业基础。
