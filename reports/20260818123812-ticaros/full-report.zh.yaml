      - number: '6.4'
        title: 集中度与商业化落地风险
        blocks:
          - type: paragraph
            body: >-
              客户集中度目前很高，因为公开证明图谱太小。一条可见临床路径集中在 Samsung Medical Center 和 TC011 方案。制造侧历史上由 Minaris 支撑，TC091 供给工作由 Matica
              支撑。研究合作面由 Cartherics 支撑。生态开发面由 JLABS Korea 支撑。这足以显示外部参与，但也意味着任一关系都承载了过高信号权重。如果 TC011
              研究停滞、制造支持滑坡，或合作者未能深化，外界感知中的客户故事可能迅速恶化，因为还没有大量公开胜利来对冲。

              未来商业化落地链条也比当前公开客户文件更复杂。CAR-T 采用最终取决于专科医生、治疗中心、制造物流、报销和患者选择。广泛肿瘤学资料清楚说明，CAR-T
              疗法需要个体化细胞采集和专科交付；滤泡性淋巴瘤则是具体且相对狭窄的疾病场景。因此，即便 Ticaros
              的科学成功，扩展到广泛客户基础也不会自动发生。公司必须从申办方和伙伴生态，走向真正由医院、研究者并最终由支付方组成的网络。今天的公开证据还没有显示这个转换，只显示了转换所需的前提。
