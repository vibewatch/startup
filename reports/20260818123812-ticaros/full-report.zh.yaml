  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险表面
        blocks:
          - type: paragraph
            body: >-
              Ticaros 最醒目的监管进展是真实的，但边界很窄。公开材料只支撑一条清晰的核心产品路径：TC011 用于滤泡性淋巴瘤，在此前韩国审批里程碑之后，如今已注册为韩国 Phase II
              研究。该进展有意义，说明公司谈的不是临床前概念。但同一套公开材料没有给出监管方和投资人最终最在意的深层证据包：没有公开可比性资料包、没有验证摘要、没有检查历史、没有已发表的 CMC
              桥接，也没有跨场地或跨工艺转移的公开记录。FDA 关于人用细胞和基因治疗产品制造变更与可比性的指南，加上 2024 年 CAR-T 开发指南，都说清楚了：制造变更和产品可比性是核心风险，不是文书细节。EMA
              基因治疗指南也指向同一件事。

              法律和 IP 风险同样仍然实质存在。Switchable CAR 概念已有可见专利申请，公司历史也提到 Converter CAR
              早期专利注册。这有助于护城河形成，是正向信号。但有公开专利，不等于自由实施空间已经经受诉讼检验。公开记录也没有说明，如果项目组合扩展到实体瘤适配器、CAR 骨架变更或相邻 NK 细胞合作，Ticaros
              会如何防守权利主张。因此，监管和法律上的实际结论是好坏参半：Ticaros 的进展足以支撑继续尽调，但公开文档还不足以消除获批、转移或 IP 挑战风险。
