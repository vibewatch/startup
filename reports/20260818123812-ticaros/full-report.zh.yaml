        - ~$331M
        - 上市临床期参照点下沿
        - 模态和公开市场语境不同
      - - Cabaletta Bio
        - 市值
        - ~$495M
        - 有用的自免 / CAR-T 临床期参照
        - 治疗路径不同于 Ticaros
      - - Autolus Therapeutics
        - 市值
        - ~$599M
        - 展示更成熟自体 CAR-T 上市公司的价值
        - 商业路径和地域不同
      - - Allogene Therapeutics
        - 市值
        - ~$715M
        - 本组所选上市临床期参照点上沿
        - 异体模型有实质差异
      - - Legend Biotech
        - 市值
        - ~$3.99B
        - 更成熟 CAR-T 公司的商业上沿基准
        - 成熟度太高，不适合作为 Ticaros 默认锚点
      - - Ticaros（Caplight 可见信息）
        - 私人市场估计
        - ~$197.42M 估计值
        - 找到的唯一可访问公开估值估计
        - 估计值不同于当前谈判中的私有价格
    notes: 可比组刻意选择可观察且当前的对象；相比臆测私人可比叙事，它更能框住现实。
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the most relevant public cell-therapy comps and one accessible private-estimate surface; undisclosed
        private rounds are not exhaustively represented.
