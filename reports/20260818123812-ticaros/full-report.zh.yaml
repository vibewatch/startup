      - number: '2.2'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              CAR-T
              的采购和落地渠道比普通肿瘤药窄得多。最终用户是患者，但实际买方栈要经过专科血液科医生或肿瘤科医生、医院细胞疗法项目、具备单采和移植能力的中心、院内药房和报销团队，再到决定治疗事件是否经济可行的公共或私营支付方。UPMC
              的获批疗法页面和当前产品格局都说明，获批 CAR-T 交付仍集中在有经验的中心，这些中心能处理白细胞单采、淋巴清除、输注和严重毒性监测。这个渠道结构对 Ticaros
              很关键，因为采用不靠简单的医生知晓度，而卡在临床中心准备度、制造物流和报销信心。

              Ticaros 当前路径更窄，因为公司仍在临床阶段。今天，实际“客户”界面是试验中心、CDMO 和研究伙伴，以及未来授权交易对手，而不是产生收入的治疗中心。ClinicalTrials.gov
              显示，申办方主导的滤泡性淋巴瘤研究尚未开始招募，这意味着 Ticaros 即便在所选细分领域内，也还没有进入广泛临床运营。2026 年后线 FL 机会仍有医学意义，因为审阅到的综述
              强调多线治疗后仍有高度未满足需求；但采用路径是分阶段的：生成持久试验数据，证明可制造性和安全性，锁定报销策略，然后逐中心赢得采用。这比典型软件或诊断产品的 商业化落地模式更慢，也更依赖机构。
