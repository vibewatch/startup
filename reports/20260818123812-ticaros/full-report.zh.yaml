      - number: '3.2'
        title: 下一代平台挑战者
        blocks:
          - type: paragraph
            body: >-
              第二层竞争来自一批试图重定义 CAR-T 经济性、物流或靶点覆盖的公司，而不只是再卖一款自体产品。Allogene 公开把自己定位在异体 AlloCAR T 产品上，并称 ALPHA3 是行业首个针对大 B
              细胞淋巴瘤的一线巩固、关键性 II 期研究性异体 CAR-T 试验。Caribou 同样围绕基因组编辑异体细胞疗法定位，底层是 chRDNA CRISPR 平台。它们不是 Ticaros
              的直接产品映射，但争夺的是同一套战略叙事：下一代细胞疗法要解决第一代自体 CAR-T 仍未解决的问题。

              Ticaros 与这些挑战者在野心上重叠，但机制并不相同。Allogene 和 Caribou 更聚焦现货供应逻辑和基因组编辑，而 Ticaros 公开宣称的护城河落在 CLIP CAR
              免疫突触增强、Converter CAR 检查点重接线、Switchable CAR
              安全控制，以及封闭式制造流程上。这种差异会影响合作伙伴对话。想降低供应链摩擦的买方，可能更偏好异体平台；想在自体框架内取得更好活性或安全性的买方，可能会觉得 Ticaros
              更有意思。实际竞争结果是，Ticaros 两面受挤：上方是商业化自体龙头，旁边是资本更充足的下一代重构故事。
