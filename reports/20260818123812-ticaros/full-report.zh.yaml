    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 官方和第三方里程碑显示，2018 至 2026 年，Ticaros 从成立走向临床执行和伙伴扩展。
    data:
      items:
        - date: 2018-06
          label: 成立
