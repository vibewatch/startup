      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              行业的长期增长驱动因素清晰且可信。MarketsandMarkets、BioInformant、Vision LifeSciences
              和获批产品综述都指向同一套扩张逻辑：标签产品更多、适应症更多、治疗线前移，以及围绕异体和体内平台的密集创新，目标是降低成本并减少制造延迟。Ticaros 与这条趋势的战略匹配合理。CLIP CAR 和
              Converter CAR 叙事围绕两个最难的下一代价值主张展开——更好疗效和更好安全性；公开制造叙事则强调可重复性和封闭式处理。换句话说，公司不是在进入一个停滞品类。

              但约束同样重要。HMPI
              定价分析指出，随着市场扩张，标价和批发采购成本仍继续上升，带来可及性和可持续性压力。获批产品综述强调细胞因子释放和神经毒性管理负担，近期实体瘤综述则把生物学屏障界定为根本问题，而非表面问题。后线滤泡性淋巴瘤也不是垄断市场：2025
              年系统综述明确把 CAR-T 与同一治疗场景中的双特异性抗体放在一起比较。对 Ticaros 而言，增长论点取决于能否证明足够差异化，让专科中心和未来伙伴愿意承受临床、制造和报销摩擦。审阅到的公开来源仍未披露
              Ticaros 定价计划、COGS 或中心准备度经济性，因此商业模式仍有一部分停留在抽象层面。
