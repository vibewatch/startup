evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, price per preferred share, and cap-table ownership after the March 2026 Series D.
    whyItMatters: >-
      Public round size alone does not establish whether Ticaros is actually priced like a unicorn or still a subscale
      clinical biotech.
    diligencePath: Request the Series D term sheet, cap table, and any 409A or internal mark documentation from management.
    relatedQuestionRefs:
      - QO010
      - QO025
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Revenue, headcount, monthly burn, and current cash balance.
    whyItMatters: >-
      Clinical progress is visible, but company scale and financing dependency cannot be underwritten without basic
      operating metrics.
    diligencePath: Ask for board materials or audited management accounts covering burn, headcount, and runway after Series D.
    relatedQuestionRefs:
      - QO012
      - QO025
  - type: missing-source
    severity: minor
    topic: cumulative-funding
    missingEvidence: A single authoritative source reconciling all funding rounds and grant totals.
    whyItMatters: Public database estimates vary, which introduces needless confusion into valuation and dilution analysis.
    diligencePath: Reconcile official financing records against investor confirmations and any local corporate filing extracts.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: korea-reimbursement
    missingEvidence: Korea-specific reimbursement assumptions or payer pathway for any future Ticaros product.
    whyItMatters: Commercial viability in cell therapy depends heavily on who pays and at what episode economics.
    diligencePath: Request payer-strategy materials, target pricing, and any reimbursement-preparation work from management.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Management's internal view of target share, center rollout, and partner strategy for TC011 and any follow-on
      assets.
    whyItMatters: Without a share-capture plan, the company can only be mapped to TAM and SAM, not to a defendable SOM.
    diligencePath: Ask for launch assumptions, center-priority lists, and partnering roadmaps.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: ticaros-pricing
    missingEvidence: Any public list price, reimbursement benchmark, or manufacturing-cost disclosure tied specifically to Ticaros.
    whyItMatters: Current market analysis relies on industry analogs rather than company-specific economics.
    diligencePath: Seek management disclosure or partner materials quantifying target price, COGS, and turnaround.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: direct-competition
    missingEvidence: Any head-to-head efficacy, safety, or manufacturing benchmark versus incumbent lymphoma CAR-T products.
    whyItMatters: Without comparative evidence, Ticaros differentiation remains directional rather than decision-grade.
    diligencePath: >-
      Ask management for internal benchmarking, translational comparisons, or trial readouts versus incumbent
      standard-of-care baselines.
    relatedQuestionRefs:
      - QP019
      - QP023
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partnership-conversion
    missingEvidence: >-
      Economic terms and option structure for Cartherics, City-of-Hope-linked work, or any undisclosed partner
      conversations.
    whyItMatters: >-
      Scientific partnerships matter financially only if they convert into licenses, milestones, or paid development
      paths.
    diligencePath: Request executed collaboration summaries and any term-sheet pipeline for platform licensing.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: minor
    topic: ticaros-commercial-pricing
    missingEvidence: Any public statement of intended pricing or market-access strategy for TC011 or future products.
    whyItMatters: The pricing table can compare incumbents, but Ticaros own competitive packaging remains hypothetical.
    diligencePath: Ask management for launch assumptions, target price band, and access strategy.
    relatedQuestionRefs:
      - QP011
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash balance, monthly burn, and milestone-linked cash runway after the March 2026 Series D.
    whyItMatters: >-
      Without runway visibility, investors cannot know whether Ticaros can reach value-inflecting clinical milestones
      before another financing.
    diligencePath: Request the latest cash waterfall, budget-to-milestone plan, and board-level runway analysis.
    relatedQuestionRefs:
      - QI011
      - QI020
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cost per batch, yield, turnaround time, and projected gross-margin assumptions.
    whyItMatters: >-
      These variables determine whether clinical success could convert into an economically attractive product or
      licensing business.
    diligencePath: Request the CMC operating model, manufacturing performance dashboard, and product-level margin model.
    relatedQuestionRefs:
      - QI010
      - QI021
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full cap table, preference stack, and Series D terms beyond the reported RCPS structure.
    whyItMatters: Ownership and preference overhang directly shape any future return for new investors.
    diligencePath: Request the Series D term sheet, shareholder register, and fully diluted capitalization table.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
    topic: manufacturing-performance
    missingEvidence: >-
      Batch success rate, turnaround time, yield, release deviations, and cost per batch for Ticaros' closed
      manufacturing workflow.
    whyItMatters: >-
      These are the operating metrics that would turn a plausible manufacturing story into a defensible product and moat
      story.
    diligencePath: Request the CMC dashboard, manufacturing transfer package, and recent batch-history summary.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: material
    topic: platform-human-proof
    missingEvidence: >-
      Human efficacy and safety data attributable specifically to CLIP CAR, Converter CAR, or Switchable CAR design
      choices rather than only to the broader TC011 program.
    whyItMatters: >-
      Without design-specific human data, investors cannot tell how much of the moat survives translation from
      preclinical evidence into patient outcomes.
    diligencePath: Request program-level translational datasets and any unpublished human biomarker or safety readouts.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: medium
    topic: systems-and-ip
    missingEvidence: Validated software-control documentation, cybersecurity package, and freedom-to-operate analysis.
    whyItMatters: >-
      Product-tech diligence is incomplete when digital controls and IP freedom are both major parts of the claimed
      moat.
    diligencePath: Request the validation master summary, security controls overview, and external IP counsel memo.
    relatedQuestionRefs:
      - QE020
      - QE022
      - QE018
  - type: private-evidence-only
    severity: material
    topic: commercial-customers
    missingEvidence: Paying-customer count, treatment-center list, hospital contracts, and any recurring revenue or batch orders.
    whyItMatters: These are the minimum items needed to distinguish ecosystem interest from commercial customer traction.
    diligencePath: Request the active-counterparty list, signed agreements summary, and any recurring purchase history.
    relatedQuestionRefs:
      - QU013
      - QU014
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: provider-network
    missingEvidence: Activated study sites, investigator map, center expansion plan, and any payer-engagement roadmap.
    whyItMatters: Customer scale in CAR-T depends on specialist centers and reimbursement pathways, not only on science.
    diligencePath: Request the site-activation tracker, referral strategy, and commercialization plan by center and geography.
    relatedQuestionRefs:
      - QU005
      - QU017
      - QU020
  - type: private-evidence-only
    severity: medium
    topic: partner-economics
    missingEvidence: >-
      Contract values, term lengths, renewal rights, and satisfaction references for Minaris, Matica, Cartherics, and
      JLABS-derived introductions.
    whyItMatters: Relationship logos are much less valuable than durable economics and repeat usage.
