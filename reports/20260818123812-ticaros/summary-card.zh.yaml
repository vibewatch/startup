  topStrengths:
    - Ticaros 的公开平台材料围绕 CLIP CAR、Converter CAR 和 Switchable CAR 展开，不是单一简单资产，差异化较强。
    - TC011 给出了清晰的 II 期滤泡性淋巴瘤临床路径，让故事比纯临床前生物技术公司更具体。
    - CLIP 和 Switchable 的同行评审论文，加上专利工作，提高了核心科学真实且由内部产出的可信度。
    - 多轮融资和 Minaris、Matica、Cartherics、Samsung Medical Center 等外部伙伴，支撑继续尽调。
  topRisks:
    - 当前估值、股价、股权结构和优先股堆叠仍未披露，公开信息无法判断入场纪律。
    - 收入、烧钱速度、现金跑道、制造良率和批次经济性仍属私有信息，精确承保很容易变成假精确。
    - 公开客户和服务方证据较窄，更像生态系统驱动，还不是多元化商业基础。
    - 监管可比性、CAR-T 毒性和制造执行，仍是任何先进细胞治疗平台的重大残余风险。
    - 融资依赖仍然显著，因为延误可能很快转化为稀释。
  unresolvedGaps:
    - 当前轮次条款、post-money 估值、清算优先权和完全摊薄股权结构
    - 2026 年 Series D 之后的现金跑道、月度烧钱速度和里程碑挂钩融资计划
    - 制造 KPI，包括良率、周转时间、批次成功率和单批成本
    - 站点扩张、治疗中心地图，以及未来付款方或采购策略
    - Matica、Cartherics 及未来联盟的合作伙伴经济性和变现深度
