company:
  name: Ticaros Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ticaros is a Seoul-based private CAR-T developer founded in 2018 around Seoul National University and National Cancer Center immunology talent, with three named platforms—CLIP CAR, Converter CAR, and Switchable CAR—and lead assets TC011 in B-cell lymphoma and TC091 in solid tumors. Public evidence shows meaningful technical and clinical progress: a 2023 Korean IND, a 2026 follicular-lymphoma expansion, a 2025 Nature Communications paper on the CLIP backbone, and a March 2026 KRW 20.8 billion Series D. The underwriter's core uncertainty is still company scale rather than science: public sources do not disclose revenue, headcount, or a primary-source post-money valuation, and the only accessible valuation estimate reviewed (Caplight) sits far below the company's emerging unicorn narrative.
sections:
  - id: identity-and-operating-thesis
    title: Identity, scientific roots, and what the company is building
    body: >-
      Ticaros Co., Ltd. presents itself as a next-generation Korean immuno-oncology company focused on gene-modified T-cell therapies for cancer. Official company materials say the business was established in June 2018 and now operates its headquarters and research center from Seongsoo AK Valley in Seongdong-gu, Seoul, with an additional molecular immunology laboratory at Seoul National University College of Medicine. The company's scientific identity is unusually explicit for a private biotech: it says the platform was built from accumulated immunology and cell-therapy experience at Seoul National University and the National Cancer Center, and nearly every current corporate description centers on three proprietary platform ideas rather than on a single narrow asset.

      Those three ideas are CLIP CAR, Converter CAR, and Switchable CAR. CLIP CAR is framed as a CAR-backbone design that strengthens the immune synapse between engineered immune cells and tumor cells. Converter CAR is framed as a tumor-selective CTLA-4 inhibition strategy intended to improve efficacy without activating non-tumor-specific T cells systemically. Switchable CAR is framed as an adaptor-mediated control layer intended to reduce on-target off-tumor toxicity and widen addressable antigen space. In practical portfolio terms, Ticaros remains a clinical-stage rather than commercial-stage company: TC011 is the most advanced blood-cancer program, TC091 is the visible solid-tumor program, and the rest of the story is platform leverage, manufacturing reproducibility, and partnering optionality rather than booked product revenue.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO024, CO033, CO034]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-and-scientific-governance
    title: Leadership, founder-market fit, and institutional network
    body: >-
      Ticaros' leadership profile looks stronger scientifically than commercially, but it is not a one-scientist shell. The public leadership roster names CEO Jae Won Lee, CTO Kyung Ho Choi, CSO Eun Young Choi, research director Hyung Bae Park, CMC director Sun Young Park, clinical-development leader Young Ok Kim, and business-management leader Sung Hoon Jung. Lee's background is notably finance-heavy for a Korean platform biotech—prior roles included DiNonA, Dimension Investment Advisory, Dream Technology Investment, HSBC, and BNP Paribas—while Kyung Ho Choi and Eun Young Choi bring the deepest translational credibility through Seoul National University faculty roles and prior work linked to the National Cancer Center, NIH, and Jackson Laboratory.

      That mix matters because Ticaros is pursuing a hybrid playbook: academic-origin platform science, Korean trial execution, government grant capture, and cross-border partnering. Official materials and news flow show the network is broader than a standard domestic lab spinout. The company lists City of Hope, Cartherics, JLABS Korea, GC Cell, WuXi/Minaris, and Oxford Gene Technology-related partners in its collaboration surface. That network does not prove commercialization readiness, but it does show that the company has built enough scientific and BD credibility to attract reputable collaborators across research, manufacturing, and open-innovation channels. The main governance gap is that public material remains descriptive rather than governance-heavy: there is no disclosed board composition, independent-director structure, ownership split, or succession framework.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO019, CO029, CO034, CO035]
    tableRefs: [TO002, TO003]
  - id: capital-formation-and-development-path
    title: Funding history, development milestones, and current stage
    body: >-
      Public evidence supports a credible capital and milestone arc even though it does not fully settle current valuation. Official history pages say Ticaros raised approximately $8 million across Series A and B by 2020, then approximately $22 million in Series C in 2021. Korean news reports and the company timeline converge on a March 2026 Series D of KRW 20.8 billion, reportedly issued as redeemable convertible preferred shares and backed by SJ Investment Partners, Kiwoom Securities, and iM Investment Partners. Public profile platforms such as Caplight and CB Insights broadly align that the company has raised a little above $40 million cumulatively, although the exact total varies by provider and none of the accessible sources reviewed expose a clean cap-table bridge.

      Operationally, the milestone path is real. Ticaros' 2023 Korean IND approval for TC011 established the company as a clinical-stage developer rather than a preclinical platform. The company then used 2024 and 2025 to expand partnerships, publish Switchable CAR and CLIP CAR work in Nature Communications-linked channels, and deepen manufacturing capability around a closed CliniMACS Prodigy process. In January 2026, MFDS approved a Phase II expansion of TC011 into follicular lymphoma, and Series D proceeds were publicly earmarked to finish TC011 Phase II work and accelerate TC091 into Phase I. The company is therefore past platform-only storytelling, but still short of commercial proof: there is no disclosed revenue base, marketed product, or validated late-stage licensing economics in the open record.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO020, CO021, CO022, CO023, CO024, CO030, CO032, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: external-validation-and-open-questions
    title: External validation, conflicting valuation signals, and diligence gaps
    body: >-
      The strongest external validation for Ticaros is scientific and clinical rather than financial. PubMed-indexed CLIP CAR work published in 2025 showed that a CD99-mediated backbone can enhance immunological synapse formation and improve CAR-T function in lymphoma models; the authorship and competing-interest disclosures directly tie multiple inventors and employees to Ticaros. The Switchable CAR paper and its associated WIPO and US-family patent filings show the platform is not just marketing language but a formal invention stream with assignees tied to Seoul National University R&DB Foundation and Ticaros. Partnership evidence is also stronger than average for a private Korean biotech: Cartherics publicly described a collaborative research agreement around CLIP-CAR in iPSC-derived NK cells, and Matica publicly described a CDMO agreement for TC091 manufacturing.

      The weakest part of the file is investability at a precise price. Company materials do not disclose revenue, headcount, customer count, or post-money valuation. The reviewed Series D articles clearly confirm round size, named investors, and use of proceeds, but they do not themselves publish a quantified unicorn valuation. The only accessible valuation page reviewed, Caplight, shows an estimated valuation of approximately $197 million as of August 2026, materially below the broader market narrative that Ticaros has crossed unicorn status. That does not prove Caplight is right; it proves the open record is inconsistent. Diligence therefore has to carry forward two parallel truths: Ticaros' science and trial momentum are increasingly real, and its current financial scale remains materially under-disclosed.
    claimRefs: [CO018, CO025, CO026, CO027, CO028, CO031, CO034, CO035, CO036]

