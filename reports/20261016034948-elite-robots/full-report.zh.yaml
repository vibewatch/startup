  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现范围与收入质量
        blocks:
          - type: paragraph
            body: >-
              Elite 的公开变现范围不止一个协作机械臂 SKU。公司和合作伙伴材料显示，核心硬件包括 EC、CS 系列，以及 CP 码垛和 CW
              焊接打包方案。因此，收入可以来自机械臂销售、打包工作站及附带的调试或服务范围，而不是纯软件订阅。StreetInsider/Evertise 的文章尤其重要，因为它指出 CW
              方案并未对焊接电源、夹具、编程、集成、安全审查、调试或服务规定统一范围。这种差异具有财务含义：即使审阅的公开材料仍未披露标价、折扣或实际 ASP，已确认收入和毛利也可能随报价显著变化。
