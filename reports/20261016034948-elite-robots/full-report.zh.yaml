            body: >-
              公开 traction 代理指标方向上较强，但还达不到审计就绪。The Robot Report 归档指向 2021 年 $27M B 轮融资；DBR77 后来称已在 50 多个国家部署超过 20,000
              台；一页 ELITE ROBOTS 页面仍显示 200+ 名员工、约 60 名研发人员、$4620K 研发支出和 5000Pcs 已部署协作机器人。同时，EC 系列宣传册称 Elite 年产能达到 10,000
              台，DBR77 称员工约 300 人，其中超过一半从事研发。这些指标合起来说明公司已有一定规模和工程投入，但它们来自不同年份的公司控制或合作伙伴转述披露，不能替代已确认收入、订单积压、利润率或营运资本披露。
