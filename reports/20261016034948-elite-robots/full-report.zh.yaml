      - number: '3.2'
        title: Elite 已披露的优势在于覆盖面、可重新部署性与自研技术栈
        blocks:
          - type: paragraph
            body: >-
              Elite 的公开材料持续强调协作机器人范围广、重新部署快、易操作，并兼容第三方平台。证据最充分的差异化并非独特定价能力，而是产品组合从标准 EC、CS
              协作机械臂延伸到码垛和焊接相关方案，同时反复宣称自研操作系统、固件、硬件和关节模块。这一组合适合汽车、电子、包装/物流和机床上下料等柔性制造场景；在这些场景里，买方通常更看重集成速度和足够性能，而不是定制机器人开发。不过，这些证明大多仍来自厂商或合作伙伴，因此矩阵在已发布规格和宣传信息上更强，在独立基准证据上更弱。
