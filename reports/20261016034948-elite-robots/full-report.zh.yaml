      - number: '1.3'
        title: 规模、成熟度与当前风险
        blocks:
          - type: paragraph
            body: >-
              产品成熟度是公开记录中最扎实的部分。官方及公司发布的材料持续显示，公司拥有 6 轴协作机器人产品组合，负载覆盖 3 至 30 kg，围绕 ISO 10218 和 ISO 13849 进行工业安全定位，产品发展也从
              EC 系列延伸到 CS 系列及 2023 年后续型号。规模信号方向积极但不精确：一处公司页面称有 200+ 名员工、100+ 项专利和 5000 台已部署协作机器人；2023 年 6 月 BusinessWire
              新闻稿则称已在 30 多个国家部署超过 10,000 台。这些指标可用于交叉验证，但日期差异太大，不能直接作为当前封面数字。客户可信度同样参差：Max Robotics 列出
              Bosch、Toyota、Foxconn、ZF、Unilever、AstraZeneca 和 KFC 等蓝筹客户，但证据池没有量化部署深度、合同规模或留存。最明确的当前不利事项不是商业而是法律：The Robot
              Report 归档记录了 Teradyne 软件纠纷中的 2026 年 4 月德国禁令，以及 2026 年 10 月条款未披露的和解，因此运营和知识产权影响在公开证据中仍未完全厘清。
