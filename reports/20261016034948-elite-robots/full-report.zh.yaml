    data:
      nodes:
        - label: 获取需求
          detail: 订单似乎来自直销，以及分销商、系统集成商和 OEM 合作伙伴。
          claimRefs:
            - CI005
            - CI012
        - label: 配置报价
          detail: 机械臂工具、软件集成、安全、调试和服务的范围，都取决于具体报价。
          claimRefs:
            - CI002
            - CI003
        - label: 机械臂收入
          detail: EC 和 CS 协作机器人硬件是核心变现产品。
          claimRefs:
            - CI001
        - label: 解决方案打包增售
          detail: CP 码垛和 CW 焊接把收入从机械臂延伸到配置好的工作站或工作单元。
          claimRefs:
            - CI002
        - label: 安装与支持
          detail: 公开材料提到售后服务、培训和调试，但没有给出价格。
          claimRefs:
            - CI004
            - CI012
        - label: 客户 ROI 证明
          detail: 公开经济性以回本期或 ROI 主张呈现，而非披露利润率。
          claimRefs:
            - CI011
      edges:
        - from: Demand capture
          to: Configuration quote
          label: 范围定义
          detail: 机会塑造看起来由项目驱动，而非自助式完成。
          claimRefs:
            - CI012
        - from: Configuration quote
          to: Robot arm revenue
          label: 硬件选型
          claimRefs:
            - CI001
        - from: Robot arm revenue
          to: Solution-package upsell
          label: 打包工作单元选项
          claimRefs:
            - CI002
        - from: Solution-package upsell
          to: Installation and support
          label: 调试与服务
          claimRefs:
            - CI003
        - from: Installation and support
          to: Customer ROI proof
          label: 价值逻辑
          claimRefs:
            - CI011
    approximationNotes: 这座桥展示的是公开描述的变现触点和报价范围依赖，而非实际收入确认、抽成率或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Elite 的公开产品栈将协作机械臂与控制器软件、安全控制、外围设备及合作伙伴搭建的工作单元分层组合。
    data:
      layers:
        - label: 工作流层
          detail: Elite 面向客户营销的工作任务。
          modules:
            - label: 装配与测试
            - label: 机床上下料
            - label: 码垛与物料搬运
          outputs:
            - label: Human-adjacent flexible automation
        - label: 外围设备层
          detail: 将机械臂变成特定工作流解决方案的工作单元扩展。
          modules:
            - label: 末端执行器
            - label: 视觉传感器
            - label: 力控传感器
            - label: AGV 复合机器人
        - label: 机械臂层
          detail: 覆盖当前和旧产品家族的六轴协作机械臂。
          modules:
            - label: CS 系列（3-30 kg）
            - label: EC 旧系列
            - label: 624-1800 mm 工作范围
        - label: 控制与软件层
          detail: 用于编程、连接和重新部署机器人的接口。
          modules:
            - label: 图形化编程
            - label: Web UI 远程控制
            - label: 开放式底层运动接口
            - label: Profinet / EtherNet-IP / Modbus
        - label: 安全层
          detail: 机器人层面的安全行为已有记录，但仍需外部验证。
          modules:
            - label: 18 项安全功能
            - label: 碰撞检测
            - label: ISO 10218 / ISO 13849 / ISO-TS 15066 声明
        - label: 合作伙伴解决方案层
          detail: Elite 经常与外部设备和本地合作伙伴一起出现在集成工作单元中。
          modules:
            - label: 检测与计量栈
            - label: 焊接相关工作站
            - label: 表面处理工作单元
          outputs:
            - label: Turnkey or semi-turnkey automation offers
    approximationNotes: 该产品栈反映公开材料明确记录的层次和依赖；不代表每个组件都由公司内部闭环提供。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，从应用发现到部署可能有合作伙伴参与，但留存证明基本止步于展示案例。
    data:
      items:
        - label: 发现与筛选
          detail: 制造业买方筛选行业适配性、负载、工作范围和安全定位。
          touchpoints:
            - 产品页面与展会曝光
            - 多垂直行业用例营销
        - label: 技术评估
          detail: 客户或集成商将 Elite 的机械臂和解决方案选项与工作流匹配。
          touchpoints:
            - 负载和工作范围比较
            - 报价级范围与工具审查
        - label: 合作伙伴协助设计
          detail: 分销商、集成商和 OEM 关系似乎帮助完成方案打包和销售。
          touchpoints:
            - TWT 和 Abiman 案例
            - 更广泛的分销商 / OEM 生态
        - label: 试点或现场部署
          detail: 公开展示重点是特定工厂或地区的应用部署。
          touchpoints:
            - 墨西哥 ZF 工厂
            - 西班牙机床上下料和新西兰码垛
        - label: 生产规模化
          detail: 一笔据报道达 3,000 台的订单，说明 Elite 能从演示走向大型项目。
          touchpoints:
            - 中国大型能源行业订单
            - 美洲增长主张
        - label: 扩张与留存
          detail: 部署之后的公开记录变得稀薄，也没有显示续约经济性。
          touchpoints:
            - 没有公开 NRR 或流失率
            - 没有头部客户占比披露
    claimRefs:
      - CU002
      - CU003
      - CU008
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在权衡公开缓释措施与剩余尽调缺口后，对信号最强风险的定性判断。
    data:
      columns:
        - label: 可能性
          detail: 风险在近期影响投资判断或市场执行的概率。
        - label: 影响
          detail: 风险兑现后的下行幅度。
        - label: 缓释成熟度
          detail: 指定证据池中可见的公开缓释证据强度。
        - label: 剩余暴露
          detail: 缓释措施之后的投资风险。
      rows:
        - label: 欧盟软件 / IP 争议
          note: 起诉、禁令和和解均已公开，但和解的经济条款没有公开。
          values:
            - label: 中
            - label: 高
            - label: 低
            - label: 高
        - label: 安全 / 合规证明缺口
          note: 官方安全声明存在，但证据池中没有公开监管机构结论或独立验证材料包。
          values:
            - label: 中
            - label: 高
            - label: 部分
            - label: 高
        - label: 对合作伙伴执行的依赖
          note: Elite 展示了广泛的 OEM / 集成商 / 分销商生态，但没有集中度细节。
          values:
            - label: 中
            - label: 中
            - label: 部分
            - label: 中
        - label: 披露一致性
          note: 公开规模和部署快照没有共同的截至日期。
          values:
            - label: 高
            - label: 中
            - label: 低
            - label: 中
        - label: 交钥匙范围不清
          note: 与 Elite 相关的指引称，报价责任因方案而异。
          values:
            - label: 中
            - label: 中
            - label: 部分
            - label: 中
        - label: 资本韧性不透明
          note: 指定证据池没有呈现当前收入、现金消耗、资金续航或保修准备金。
          values:
            - label: 中
            - label: 高
            - label: 低
            - label: 高
    approximationNotes: 定性评级综合了来源支持的信号和明确的证据缺口；不是由统计损失模型推导而来。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR010
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 结论取决于真实商业证明与不完整的价格支撑、尚未解决的法律和经济性尽调之间的权衡。
    data:
      nodes:
        - id: scale
          label: 商业化证明
          value: 20,000+ deployed units; 50+ countries
          note: 公司当前速览信息显示已有真实业务足迹
        - id: product
          label: 产品可信度
          value: 6 cobots; 3-30 kg; partner ecosystem
          note: 公开材料显示产品线广泛，并具备集成能力
        - id: financing
          label: 融资信号
          value: Series D on 2026-03-25; $142M total raised
          note: 近期获得资金支持其持续保持相关性
        - id: legal
          label: 法律拖累
          value: German injunction followed by undisclosed settlement
          note: 公开案件已结束，但经济和渠道影响仍不清楚
        - id: economics
          label: 缺失的投资判断输入
          value: No public revenue, margin, retention, or preference detail
          note: 公开证据无法锚定价格信心
        - id: call
          label: 建议
          value: research-more / unknown valuation
          note: 密切跟踪，但要求私有尽调或更低的入场价
      edges:
        - from: scale
          to: product
          label: 支持
        - from: product
          to: financing
          label: 有助于解释
        - from: financing
          to: legal
          label: 被……抵消
        - from: legal
          to: economics
          label: 放大
        - from: economics
          to: call
          label: 驱动
    approximationNotes: 该图为定性分析，因为来源池缺少搭建数值估值桥所需的已披露财务指标。
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
