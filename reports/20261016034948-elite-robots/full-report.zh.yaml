            body: >-
              公开融资背景方向上积极，但仍不足以完成投资判断。Tracxn 显示公司已完成 6 轮融资，最新一轮 D 轮日期为 2026 年 3 月 25
              日；这确认公司仍能获得投资人支持，也说明内部人或新投资人仍认为其技术或商业前景足以投入资金。公司还据称拥有较大的部署量、专利数量和国际覆盖，旧材料则显示其已多年努力扩大产能和应用。这些数据点支持公司在协作机器人领域仍具相关性。


              但这些信息无法证明最新估值具有吸引力。可访问的 Tracxn 页面将轮次详细经济条件锁在受限字段后；检索到的公司控制页面强调部署量、合作伙伴覆盖和
              ROI，却没有披露收入、毛利率、留存、订单积压或现金效率。近期一篇焊接领域第三方候选名单文章也将 Elite Robots
              描述为取决于适配度，并明确警告已发布规格不能证明焊接质量或完整单元的经济性。实际上，公开证据支持对公司继续尽调，却不足以让人对价格支付形成信心。
            claimRefs:
