  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Elite 的实际销售内容
        blocks:
          - type: paragraph
            body: >-
              留存证据支持的市场定义，核心是制造工厂内部的协作机器人部署，而不是全部工业自动化支出。Elite
              官方页面、镜像产品目录和留存的焊接采购指南反复覆盖机械臂、控制器、示教器/软件层，以及视觉、力传感、末端执行器、AGV 或模块化工作站等应用外围设备。这一点很关键，因为现有证据并未持续证明 Elite
              是交钥匙工作单元的总包商；同一个“系统”可以从机械臂加焊接包，延伸到更集成的单元，因此纳入支出取决于报价和集成商范围。实际市场边界应放在协作制造流程：安全、易编程、可重新部署的 6
              轴协作机器人替代或增强搬运、检测、机床上下料、焊接和码垛；而整条新建产线重构、工厂软件集成及其他定制工程支出，应视为相邻市场，不能自动计入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
