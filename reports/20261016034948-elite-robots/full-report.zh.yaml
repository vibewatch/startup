      - number: '3.3'
        title: 竞争耐久性受到 incumbent 信任、价格透明度不足与相邻进入者的挤压
        blocks:
          - type: paragraph
            body: >-
              主要耐久性风险在于，Elite 的公开优势容易描述，却难以由独立证据验证。证据池没有披露标价、实际折扣或赢单率，因此性价比仍是主张，而非经基准验证的事实。既有厂商带来的压力也不止于功能：The Robot
              Report 记录了 Teradyne 与 Elite 软件复制纠纷中的 2026 年 4 月德国禁令，随后双方于 2026 年 10
              月达成条款未披露的和解。和解结束了案件，却没有揭示其经济条件，也没有消除既有厂商愿意诉讼所带来的信任和渠道影响。最后，如果 Elite 推进 Centaur-G1 移动操作项目，相邻竞争对手还会扩展至
              Techman、DexForce 和 Aeolus 等新型移动或双臂平台；现有证据太薄，不能据此称 Elite 明显胜出。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
