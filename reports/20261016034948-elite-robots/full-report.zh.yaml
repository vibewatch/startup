  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议
        blocks:
          - type: paragraph
            body: >-
              公开记录支持有条件的关注，而不是有价格锚定的确定性投资判断。Elite Robots 似乎有真实商业存在：当前网站称已在 50 多个国家部署 20,000+ 台设备，并拥有 300+
              项专利或其他知识产权资产；Tracxn 仍将其归类为已融资 $142 million 的 D 轮公司。产品资料和面向经销商的页面也显示产品线广泛，市场进入依赖合作伙伴。这些因素不支持“零
              traction”判断，并表明公司已经搭建起有意义的硬件平台。


              问题在于，这不等于估值支撑。可获取的 2026 年融资证据确认近期完成了一轮融资，却没有提供新投资人用来锚定入场价格、下行保护或预期回报的完整经济条件。同时，The Robot Report 的 2026
              年报道显示，德国先发布禁令，随后纠纷以未披露条款和解。由于公开证据仍缺少收入、利润率、留存、订单积压、现金消耗和优先权结构的透明度，严谨结论应是继续研究，而不是买入；即便私募估值依赖比公开记录显示更强的经济性，也只能在其折价时考虑。
