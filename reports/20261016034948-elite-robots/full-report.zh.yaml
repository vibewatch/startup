        blocks:
          - type: paragraph
            body: >-
              指定证据池展示了 2026 年完整的法律风险链条，而不是一次性的新闻标题。两篇独立的 3 月报道称，Teradyne 就涉嫌复制 Universal Robots 软件起诉 Elite Robots
              的德国子公司，并分别向欧洲监管机构通报安全担忧。风险随后升级为 4 月禁令；The Robot Report 10 月归档更新又称双方已和解，但未披露条款。对投资判断而言，这一顺序很重要：Elite
              或许避免了无休止的诉讼程序，但外部投资人仍没有公开证据了解和解经济条件、产品补救义务、许可限制，或纠纷期间欧洲任何合作伙伴、经销商或终端客户承诺是否被打断。
