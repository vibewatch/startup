              - CV012
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：Elite Robots 将其宣称的装机量、产品广度和合作伙伴网络转化为持久的全球份额增长，同时新一轮 D 轮资本支持商业化，和解后诉讼不再阻碍渠道扩张。届时，公司的公开 footprint
              可被视为一家可规模化亚洲硬件挑战者的早期证据，其技术和分销可信度足以逐步成长为战略资产。


              基准情景更克制。业务可能真实且在增长，但投资人仍无法仅凭公开证据验证增长质量。如果收入转化、毛利率、服务负担或客户复购行为弱于营销 footprint
              所暗示的水平，那么最新一轮融资可能只能支持继续执行，而不足以支撑估值跃升。悲观情景则是隐性经济弱点叠加新的法律摩擦或渠道犹豫，使下轮融资降价、估值持平或战略买方折价都变得可能。在这种不对称性下，下行保护比叙事上行空间更重要。
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 最终尽调问题与否决条件
        blocks:
          - type: paragraph
            body: >-
              公开材料仍未证明退出准备度。公司可以指出国际覆盖、行业参考客户和广泛产品组合，但这里可获得的证据主要仍是营销、目录和摘要来源，称不上投资人级运营披露。在评估价格之前，尽调需要 2026
              年轮次备忘录或股权结构表材料、经审计或至少达到董事会级别的收入和毛利率历史、客户集中度、复购订单行为、质保或服务成本趋势，以及 Teradyne 纠纷和解的确切商业影响。


              否决条件应明确。如果管理层无法证明当前增长能转化为有吸引力的单位经济性，如果清算优先权或棘轮机制在结构上使新资本处于次位，或者法律和解仍限制软件、渠道伙伴或核心地域，就应放弃。反过来，如果私下尽调显示毛利率健康、复购需求可信、服务强度可控，且轮次条款仍为财务或战略上行空间留下余地，建议可以改善。在此之前，谨慎做法是密切跟踪公司，同时守住价格纪律。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
