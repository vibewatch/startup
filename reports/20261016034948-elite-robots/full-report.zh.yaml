            body: >-
              Elite Robots 销售的是协作机械臂及相邻自动化单元，而不是独立软件产品。在当前产品页、较早的 EC
              目录和首页文案中，公司将协作机器人用于装配、机床上下料、码垛、检测、测试、拧紧、焊接相关流程和物料搬运。当前网站将旗舰产品描述为 6 款 CS 系列协作机器人，负载覆盖 3-30 kg、臂展覆盖 624-1800
              mm；较早的 EC 材料则显示早期产品线围绕 3 kg、6 kg、12 kg 和 16 kg 等较轻负载等级。这个变化说明 SKU 范围可能逐步扩大，但公开证据仍未清楚说明哪些旧款 EC
