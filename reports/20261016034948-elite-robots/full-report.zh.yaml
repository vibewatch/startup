      - number: '4.3'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              资本估值证据很薄。Robo2u 列出截至 2026 年 3 月的 $1.2B 估值，并指出 Elite 于 2026 年遭 Teradyne 起诉，这带来潜在法律成本和渠道中断压力。但指定公开材料没有披露收入或
              ARR、毛利率、现金、烧钱、资金续航、债务或融资条款。因此几个核心投资判断问题仍未解决：解决方案收入是否背负可接受的服务负担，制造规模是否比回款更快消耗营运资本，以及距离下一轮融资还有多少余量。财务结论只能是定性的：Elite
              似乎有能力通过硬件加工程化自动化项目变现，但收入质量、利润率路径和融资依赖仍是尽调障碍。
