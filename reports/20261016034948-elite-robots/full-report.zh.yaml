chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              现有证据支持这样的判断：Elite Robots 是一家中国私营协作机器人公司，其运营历史早于证据池中可见的法人记录。Max Robotics 将 Elite 描述为一家总部位于上海、由北航机器人研究所工程师于
              2016 年创立的协作机器人制造商；Accio 则显示法人苏州艾利特机器人有限公司成立于 2018-02-07，且仍在存续。同一证据集显示，公司销售 6
              款协作机器人，负载和臂展覆盖较广，并将自己定位为自动化解决方案提供商，而不是单一产品厂商。地理覆盖比确切公司结构更清晰：独立报道指向美国、日本和德国分支，公司材料则称还通过经销商、合作伙伴及部署覆盖数十个国家。上海、苏州和郑州之间当前总部及运营版图如何划分，仍不明确，后续应通过工商登记、分支机构登记和投资人文件核实。
