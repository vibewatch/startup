      - number: '2.3'
        title: 采用驱动、采用阻力与估值含义
        blocks:
          - type: paragraph
            body: >-
              Elite
              的采用故事在这样的场景最有说服力：工厂需要低成本自动化，又不想承担传统工业机器人的部署负担。留存来源反复将劳动力压力、产线切换、稼动率、安全性和集成商灵活性列为核心驱动；产品口径据称强调快速重新部署、开放接口、工业协议和性价比。同一批来源也说明，估值不能简单套用泛化的协作机器人叙事。第一，应用经济性仍取决于报价和单元，尤其是焊接等责任风险更高的场景，公开机械臂规格并不能证明整套系统适配。第二，德国现行法律记录及随后未披露条款的和解表明，知识产权和渠道连续性风险可能打断欧洲采用。第三，公开证据仍缺乏独立市场价值基准、预算负责人披露和可调和的部署指标，因此市场逻辑可信，但还不足以支撑精确估值。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争横跨 OEM、打包单元与集成商
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，竞争格局更多由解决方案路径定义，而不是由一份固定的竞争对手名单定义。Elite 销售独立协作机械臂，也推出码垛、焊接和合作伙伴主导的自动化方案，因此买方会针对同一任务，将 Elite
              与其他机械臂厂商、品牌工作单元方案、系统集成商和内部自建方案比较。就机器人焊接而言，审阅的 StreetInsider 对比提到 FANUC CRX、Miller Electric Copilot、Fronius
              CWC 形式及集成商等现实替代方案。这使竞争范围归属成为首要采购标准：买方不只问谁的机械臂更好，还会问夹具、调试、安全工程和售后支持由谁负责。
