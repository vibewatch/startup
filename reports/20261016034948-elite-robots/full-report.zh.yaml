      - number: '1.2'
        title: 资本、管理层透明度与利益相关方
        blocks:
          - type: paragraph
            body: >-
              融资信息足以证明 Elite 已获得有意义的外部资本，但不足以核对当前确切累计金额或股权结构表。The Robot Report 归档仍显示一篇 2021 年 9 月关于 $27M B 轮的文章；Max
              Robotics 称公开来源显示，截至 2024 年 3 月累计融资约 $165.58M，另有报道称 2025 年 4 月完成 $13.8M 轮融资。Max
              还将郑州经开投资发展有限公司列为国资关联投资人，这一点重要，因为市级资本既能提供耐心支持，也可能影响地域布局和治理。证据池中的管理层透明度远弱于产品透明度：创始团队的北航背景可见，2026 年公司新闻稿将 Cao
              Yunan 列为媒体联系人，但没有清晰的公开董事会名单、管理委员会披露或所有权拆分。当前更合理的判断是，技术创始人与市场的匹配度看起来可信；关键人集中度、董事会独立性和投资人权利仍是尽调事项，而非已确认事实。
            claimRefs:
              - CO001
              - CO007
