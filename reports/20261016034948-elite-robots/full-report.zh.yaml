      - number: '2.2'
        title: 受证据约束的规模测算与买方分层
        blocks:
          - type: paragraph
            body: >-
              证据池没有协作机器人独立 TAM/SAM/SOM
              模型，因此规模测算必须受证据约束。可用的公开视角包括产品覆盖范围、部署数量说法、地理覆盖说法和产能陈述。这些视角方向上有用，却无法完全对齐：独立来源和公司关联来源对于 Elite 是部署了近 10,000 台、在
              30 多个国家部署超过 10,000 台，还是在 50 多个国家部署超过 20,000 台，意见不一；另一本宣传册又单独称年产能达到 10,000 台。稳妥判断是，Elite
              已超出试点阶段规模，目标市场覆盖广泛制造流程，但确切装机量和服务地域仍不确定。买方分层比自上而下的市场金额更清楚：电子、汽车、包装/物流、金属加工、检测、焊接和码垛在产品材料中反复出现，但公开来源仍未明确最终预算负责人，也未按地域和渠道拆出干净的
              SAM。
