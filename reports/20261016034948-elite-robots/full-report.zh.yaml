  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 据称的部署基数、专利和合作伙伴触达代表持久的份额增长；2026 年资金加速商业化；诉讼不再限制渠道
        - 只有私有尽调确认增长强劲、利润率良好且法律选择空间干净，才有理由在最新私募估值之上支付溢价
        - 服务负担、定价压力或隐藏的优先权拖累
        - 需要公开证据中不存在的多项私有证明
      - - 基准
        - 业务在增长，但经济性参差不齐；诉讼在程序上已解决，但交易对手尽调时仍会纳入考量
        - 除非管理层证明效率或留存异常突出，否则最理性的入场价应不高于最新私募估值
        - 本轮条款可能已经计入了公开数据无法验证的上行空间
        - 与当前公开记录最为一致
      - - 悲观
        - 营销口径的规模超过财务质量；法律和渠道摩擦拖慢采用；新资金附带保护性条款
        - 相比风险投资式升值，折价轮、平价轮或战略出售折价更可能出现
        - 股权结构表不透明、利润率更弱、客户集中或和解副作用
        - 如果尽调无法快速补上经济性和法律缺口，这一情景就更可能发生
    notes: 情景仅用于指示方向，因为指定证据池没有披露收入、利润率、留存或完整轮次条款；给出区间会制造虚假的精确感。
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
