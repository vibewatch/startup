company:
  name: Elite Robots
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Elite Robots appears to be a real, commercially active Chinese cobot maker with a
    2016 founding narrative, two established product lines, and visible international
    channel buildout, but its current financials, exact scale metrics, and governance
    depth remain only partially disclosed. Public evidence also shows an active legal
    overhang in 2026, even as company-issued materials continue to project product and
    deployment growth.
sections:
  - id: identity-operating-footprint
    title: Identity and operating footprint
    body: >-
      The assigned evidence supports Elite Robots as a private Chinese collaborative
      robotics company whose operating story predates the legal-entity record visible in
      the pool. Max Robotics describes Elite as a Shanghai-headquartered cobot producer
      founded in 2016 by engineers from Beihang University's Robotics Institute, while
      Accio identifies the legal entity Suzhou Elite Robot Co., Ltd. as established on
      2018-02-07 and still active. The same evidence set points to a company that sells
      six cobots across a broad payload and reach range and that presents itself as an
      automation-solutions provider rather than a single-product vendor. Geography is
      directionally clearer than exact corporate structure: independent coverage points
      to branches in the United States, Japan, and Germany, while company materials cite
      additional reach through distributors, partners, and deployments across dozens of
      countries. What remains less clear is the exact current headquarters and operating
      footprint split between Shanghai, Suzhou, and Zhengzhou, which later diligence
      should verify against corporate-registration, branch-registration, and investor
      documents.
    claimRefs: [CO001, CO002, CO005, CO006, CO011, CO014]
    tableRefs: [TO001, TO002]
  - id: capital-leadership-and-stakeholders
    title: Capital, leadership visibility, and stakeholder map
    body: >-
      Funding visibility is good enough to establish that Elite has raised meaningful
      external capital, but not good enough to reconcile the exact current total or cap
      table. The Robot Report archive still surfaces a September 2021 article on a $27M
      Series B, and Max Robotics says public sources point to roughly $165.58M
      cumulative by March 2024 plus a further reported $13.8M round in April 2025. Max
      also names Zhengzhou Economic Development Investment Development Co. as a
      state-linked investor, which matters because municipal capital can provide patient
      support while also shaping geography and governance. Leadership visibility is much
      weaker than product visibility in the assigned pool: the founding team's Beihang
      pedigree is visible, and a 2026 company-issued release names Cao Yunan as media
      contact, but the pool does not provide a clean public board roster, executive
      committee disclosure, or ownership breakdown. The right current reading is that
      technical founder-market fit looks plausible, while key-person concentration,
      board independence, and investor rights remain diligence items rather than closed
      facts.
    claimRefs: [CO001, CO007, CO009, CO010]
    tableRefs: [TO003]
  - id: scale-maturity-and-live-risks
    title: Scale, maturity, and live risks
    body: >-
      Product maturity is the strongest part of the public record. Official and
      company-issued materials consistently show a six-axis cobot portfolio spanning 3
      to 30 kg payloads, industrial safety positioning around ISO 10218 and ISO 13849,
      and a chronology from the EC Series to the CS Series and later 2023 model
      launches. Scale signals are directionally positive but imprecise: one company
      surface cites 200+ employees, 100+ patents, and 5000 deployed cobots, while a
      June 2023 BusinessWire release claimed over 10,000 units deployed across more
      than 30 countries. Those metrics are useful for triangulation but too unevenly
      dated to treat as clean current cover numbers. Customer credibility is also mixed:
      Max Robotics lists blue-chip names such as Bosch, Toyota, Foxconn, ZF, Unilever,
      AstraZeneca, and KFC, but the assigned pool does not quantify deployment depth,
      contract size, or retention. The clearest live adverse item is legal rather than
      commercial: The Robot Report archive records both an April 2026 German injunction
      in Teradyne's software dispute and an October 2026 settlement with undisclosed
      terms, leaving the operational and IP implications only partly resolved in public
      evidence.
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
