        - Global
        - 5,000 cobots deployment
        - null
        - Current official installed-base claim on the public product page
        - Medium
        - No vintage, segmentation, or audit method is disclosed
      - - Business Wire
        - "2023"
        - 30+ countries
        - 10,000+ units deployed
        - null
        - Company press release about commercial footprint
        - Medium
        - Promotional source and older than the 2026 refresh
      - - Origin of Bots
        - "2026"
        - 50+ countries
        - Nearly 10,000 cobots sold
        - null
        - Editorial company profile using disclosed operating history
        - Medium
        - Source chain is not fully transparent and conflicts with other public claims
      - - DBR77
        - "2026"
        - 50+ countries
        - 20,000+ units deployed
        - null
        - Marketplace profile framing global deployment reach
        - Low
        - Promotional tone and materially higher than other public deployment figures
      - - EC Series brochure
        - "2026"
        - China / global manufacturing
        - 10,000 units annual production scale
        - null
        - Brochure proxy for supply ambition and potential throughput
        - Low
        - Production capacity is not the same as installed base or market demand
      - - CreedTec citing Universal Robots / The Robot Report
        - "2026"
        - Global
        - 100,000+ cobots deployed by Universal Robots
        - null
        - Category benchmark for the leading incumbent's installed base
        - Medium
        - Competitor benchmark is not Elite's own addressable market estimate
    notes: >-
      Values are public proxies rather than a reconciled TAM/SAM/SOM model; conflicts are
      preserved and CAGR is null where the source did not publish a growth rate.
    claimRefs: [CM006, CM007, CM008, CM009, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - 3C / electronics
        - Electronics manufacturers
        - Line operators and automation teams working on high-changeover tasks
        - Not publicly disclosed
        - Pick and place, testing, tightening, and rapid line switching
        - Not publicly disclosed
        - Need for flexible automation in small-batch or changing production
      - - Automotive / auto parts
        - Automotive and auto-parts plants
        - Operators, maintenance, and process teams in repetitive handling cells
        - Not publicly disclosed
        - Assembly, machine loading/unloading, tightening, and inspection
        - Not publicly disclosed
        - Productivity, safety, and coexistence with human workers
      - - Packaging / logistics
        - Packaging and logistics operators
        - Material-handling teams
        - Not publicly disclosed
        - Stacking, destacking, palletizing, and goods movement
        - Not publicly disclosed
        - Labor reduction and easier end-of-line automation
      - - Metal processing / welding
        - Metalworking plants and welding-cell buyers
        - Welding and finishing operators plus integrators
        - Not publicly disclosed
        - Grinding, polishing, deburring, welding, and machine tending
        - Not publicly disclosed
        - Higher payload, reach, and configurable workstation needs
      - - Quality / vision inspection
        - Plants needing inspection automation
        - QA and line teams
        - Not publicly disclosed
        - Vision inspection and product photography / scanning
        - Not publicly disclosed
        - Accuracy, repeatability, and integration with partner devices
    notes: >-
      Buyer and user fields follow the explicit workflow context in retained sources; payer and
      budget-owner cells stay undisclosed where public evidence does not name them.
    claimRefs: [CM004, CM006, CM010, CM011, CM013, CM014]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Without an independent public TAM/SAM/SOM model, the retained evidence supports a layered
      workflow-and-footprint lens rather than a single generic market-size number.
    data:
      items:
        - label: Collaborative manufacturing demand
          displayValue: Price pressure, labor shortages, switching needs, and quality requirements
          detail: EC brochure names these as the forces pushing plants toward collaborative automation.
        - label: Human-adjacent cobot envelope
          displayValue: Safe, easy-to-program, redeployable six-axis automation
          detail: Official surfaces emphasize no-fence collaboration, drag teaching, and low-cost deployment.
        - label: Product coverage
          displayValue: 3-30 kg payloads and roughly 624-1,900 mm reach
          detail: The public product set spans light assembly through heavier palletizing and welding tasks.
        - label: Vertical workflow focus
          displayValue: Automotive, 3C electronics, packaging/logistics, metal processing, chemicals
          detail: These sectors recur across official, mirrored-catalog, and directory-style sources.
        - label: Public footprint proxies
          displayValue: 5,000 to 20,000+ deployments; 30+ to 50+ countries; 10,000 annual production scale
          detail: Public scale signals are directionally useful but materially inconsistent.
        - label: Diligence-constrained target slice
          displayValue: No independent TAM/SAM/SOM or named budget-owner map in the assigned pool
          detail: Use workflow, product-envelope, and installed-base proxies until customer budgets and market-value data are verified.
    approximationNotes: >-
      Layers combine workflow scope, product coverage, and public footprint proxies because the
      assigned pool does not contain a reconciled independent market-value model.
    claimRefs: [CM001, CM004, CM006, CM008, CM010, CM013]
