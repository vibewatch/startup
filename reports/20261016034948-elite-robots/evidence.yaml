evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: A current executive roster, named founders, board composition, and reporting lines.
    whyItMatters: >-
      Leadership concentration and governance quality affect succession risk, investor control, and execution
      resilience.
    diligencePath: Request an org chart, board list, founder biographies, and cap-table governance rights from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: Audited revenue, gross margin, burn, cash, current valuation, and round terms.
    whyItMatters: Capital efficiency, valuation support, and downside risk cannot be judged from fundraising headlines alone.
    diligencePath: Obtain audited financial statements, management accounts, and financing documents covering the 2024-2025 rounds.
    relatedQuestionRefs:
      - QO003
      - QO005
  - type: conflicting-data
    severity: material
    topic: current-scale-metrics
    missingEvidence: A dated, board-level snapshot for current headcount, installed base, countries served, and active customers.
    whyItMatters: Unsynchronized public scale metrics can overstate traction or hide slowdown when used as current cover facts.
    diligencePath: Request a dated KPI pack and reconcile it to CRM, shipment, and HR records.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: litigation-resolution
    missingEvidence: >-
      Settlement terms, product-remediation obligations, and any continuing restrictions related to the Teradyne
      dispute.
    whyItMatters: The existence of a settlement does not show whether Elite accepted product, software, or channel constraints.
    diligencePath: Review settlement documents, counsel summary, and any distributor/customer notices tied to the dispute.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: A verified cap table, lender list, major distributors, and customer concentration breakdown.
    whyItMatters: The stakeholder map is directional but incomplete without ownership, debt, and channel concentration detail.
    diligencePath: Request cap-table exports, debt schedules, and a top-customer/top-distributor concentration schedule.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: deployment-scale
    missingEvidence: >-
      A reconciled company-side ledger showing installed base, shipped units, active countries, and the vintage of each
      metric.
    whyItMatters: >-
      Conflicting scale claims weaken any bottom-up market share or valuation multiple analysis based on commercial
      traction.
    diligencePath: >-
      Request the latest board or investor KPI pack and reconcile it against distributor-country records and shipment
      logs.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent TAM/SAM/SOM work plus named budget-owner, pricing, and procurement-cycle evidence by segment and
      geography.
    whyItMatters: >-
      Without this evidence, the market case remains workflow-led and cannot support precision revenue ramp or valuation
      underwriting.
    diligencePath: >-
      Obtain customer pipeline segmentation, distributor win/loss data, and third-party market studies, then map them to
      actual budget holders by workflow.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Model-level list pricing, realized ASPs, distributor discounts, and service contract economics by region.
    whyItMatters: >-
      Without pricing evidence, Elite cannot be benchmarked credibly against OEM, package, or integrator alternatives on
      total cost of ownership.
    diligencePath: >-
      Request current quotes for EC, CS, CW, and CP offers plus two rival quotes for the same use case and compare scope
      line by line.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent cycle-time, uptime, safety, and deployment benchmarks versus Universal Robots, FANUC, and packaged
      welding alternatives.
    whyItMatters: >-
      The current chapter leans on vendor-authored proof, so moat quality and displacement risk are still
      underdetermined.
    diligencePath: >-
      Obtain third-party benchmark reports, customer references with measured ROI, and like-for-like pilot data across
      at least two competing vendors.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: minor
    topic: adjacent-entrants
    missingEvidence: >-
      Commercial deployment detail for Techman, DexForce, Aeolus, and Elite's own Centaur-G1 beyond positioning-style
      descriptions.
    whyItMatters: >-
      Adjacent mobile-manipulation entrants may matter later, but the current evidence does not show them displacing
      Elite's mainstream cobot portfolio today.
    diligencePath: >-
      Collect deployment case studies, customer names, and production metrics for mobile-manipulation systems targeting
      the same factory workflows.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Direct current sources for named competitors' installed bases, funding, target segments, and strategic direction
      on a comparable basis.
    whyItMatters: >-
      Without like-for-like scale evidence, the competitor profile can identify routes and capabilities but cannot rank
      commercial strength.
    diligencePath: >-
      Obtain current official filings or product pages and independent market coverage for Universal Robots, FANUC,
      Miller, Fronius, Techman, DexForce, and Aeolus.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance monthly burn runway debt covenants and any project-finance or vendor-finance obligations.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten without liquidity and obligation data.
    diligencePath: Request the latest board package treasury summary debt schedule and 12-month cash forecast.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited or management-certified revenue ARR revenue mix and gross margin by product geography and channel.
    whyItMatters: >-
      Deployment counts and valuation markers cannot be translated into revenue quality or margin durability without
      booked financial performance.
    diligencePath: Request monthly revenue bridges audited financial statements and backlog or deferred-revenue schedules.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Signed quotes invoices or customer contracts showing list price realized price discounts service scope and payment
      milestones for EC CS CP and CW deals.
    whyItMatters: >-
      The public sources reveal configurable scope but not monetization quality, so pricing power and services burden
      remain unclear.
    diligencePath: Sample recent deals by product family and reconcile quoted scope to invoiced revenue and gross profit.
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: litigation-contingency
    missingEvidence: Current status reserve insurance coverage and commercial impact assessment for the Teradyne litigation.
    whyItMatters: Legal exposure can consume cash delay channel development and change the cost of future financing.
    diligencePath: Obtain counsel memo board materials and contingent-liability schedule tied to the current case posture.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: safety-compliance
    missingEvidence: >-
      Independent certificate packs, test reports, or regulator filings confirming ISO, clean-room, and
      ingress-protection claims for the current product line.
    whyItMatters: >-
      Safety and compliance claims affect deployment in regulated or high-risk environments and should not rest only on
      vendor marketing.
    diligencePath: >-
      Request declarations of conformity, test reports, certificate numbers, and any third-party audit summaries for
      current CS-series SKUs.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Practitioner or developer-signal proof such as SDK documentation history, repos, release notes, forum activity,
      API communities, or status/security disclosures.
    whyItMatters: >-
      Integrator adoption, controller maturity, and long-term support are hard to judge when all software evidence is
      vendor-authored.
    diligencePath: >-
      Request SDK/package history, public incident reporting, and customer integration references; use a deeper search
      pass focused on practitioner communities if allowed.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-proof
    missingEvidence: Model-level uptime, warranty claims, field failure modes, service response times, and install-base by SKU.
    whyItMatters: >-
      Reliability and support burden drive ROI, warranty exposure, and implementation risk for industrial automation
      buyers.
    diligencePath: >-
      Request fleet uptime by model, top service-ticket categories, spare-parts lead times, and warranty reserve history
      from management.
    relatedQuestionRefs:
      - QE004
  - type: enumeration-incomplete
    severity: minor
    topic: product-portfolio
    missingEvidence: A current official statement showing which EC and CS models are actively sold, regionally available, or sunset.
    whyItMatters: >-
      Public materials mix older and newer lineups, which can confuse underwriting around roadmap continuity and channel
      inventory.
    diligencePath: Ask for the current SKU list by region, launch date, status, and announced replacement path for any legacy models.
    relatedQuestionRefs:
      - QE001
      - QE009
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Public NRR, GRR, churn, renewal rate, contract duration, or cohort data by segment.
    whyItMatters: >-
      Without durability metrics, it is not possible to tell whether customer growth is sticky, repeatable, or
      subsidized by fresh channel expansion.
    diligencePath: >-
      Request cohort retention, renewal, and average contract-term data by geography and channel for the last 8
      quarters.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 concentration, and direct-versus-channel revenue mix.
    whyItMatters: >-
      A handful of large industrial programs or distributor relationships could dominate bookings and make reported
      growth less durable than headline deployment breadth suggests.
    diligencePath: >-
      Ask management for customer concentration, pipeline mix, and distributor contribution by region and product
      family.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independent confirmation that showcased cases are sustained production deployments with measurable outcomes and
      live dates.
    whyItMatters: >-
      Named logos and testimonials are materially weaker than independently verified production references when
      assessing expansion, ROI, and reference quality.
    diligencePath: >-
      Obtain three reference calls or procurement records covering ZF Mexico, one palletizing deployment, and one
      machine-tending deployment.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: installed-base
    missingEvidence: >-
      A reconciled installed-base and geographic-footprint disclosure that defines whether counts refer to shipped
      units, deployed units, or cumulative history.
    whyItMatters: >-
      Conflicting deployment figures limit the usefulness of public adoption claims for valuation and concentration
      analysis.
    diligencePath: Ask Elite to reconcile 2023, 2025, and current deployment disclosures with the exact counting methodology.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: settlement-terms
    missingEvidence: Executed settlement, any license or code-remediation commitments, and notices sent to distributors or customers.
    whyItMatters: >-
      Those items determine whether the dispute ended cleanly or imposed economically meaningful restrictions on Elite's
      European business.
