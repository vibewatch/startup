      - [CP palletizing solution, Packaged palletizing cell with software and accessories, Per solution or cell, Marketed in 2024 with ROI under 12 months claim, Marketing-led proof rather than audited economics, Provide realized price attach rate and service margin]
      - [CW welding workstation, Configurable workstation around CS66 CS612 or CS620 arms, Per configured workstation, Options are public but quote scope varies by project, Scope variability limits comparability of revenue recognition and margin, Provide BOM software licensing and commissioning revenue share]
      - [Services and integration support, Commissioning training after-sales and partner-led deployment support, Per project or contract, Publicly referenced but not separately priced, Likely meaningful attachment revenue but no evidence on mix or renewal, Provide service attachment rate warranty reserve and regional support cost]
    notes: >-
      Based on official and partner-mediated public materials; status reflects disclosure quality rather than revenue
      magnitude, and no reviewed source provides realized price or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [EC and CS cobot arms, Not publicly disclosed, Specs are public but realized ASP is unknown, No list price contract term or rebate data in reviewed sources, Official cobots page and EC brochure]
      - [CP Series palletizing, Not publicly disclosed, ROI and performance claims are public but deal size is unknown, No published pricing for software columns scanners or installation, DBR77 profile]
      - [CW welding workstation, Configurable by arm power source and options but price is not public, Workstation scope varies by quote, Integration safety and service boundary are not standardized, StreetInsider Evertise article]
      - [After-sales and service, Not publicly disclosed, Warranty and regional service are discussed without pricing, Attachment rates support obligations and renewal economics are unknown, StreetInsider Evertise article and cobots page]
    notes: >-
      The reviewed public materials expose specifications configuration options and ROI language, but none disclose list
      price realized pricing or discount structure.
    claimRefs: [CI003, CI004, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Installed base markers, "5000Pcs deployment on 17fly; over 10,000 units across 40+ countries in 2023; over 20,000 units across more than 50 countries in DBR77", medium, Scale proxies imply demand but are not a consistent audited series, Reconcile shipments active installed base and geography by year]
      - [Production scale, "10,000 units annual production scale", medium, Capacity claims shape manufacturing utilization and working-capital needs, Provide plant utilization scrap and inventory turns]
      - [Series B financing, "$27M Series B", medium, Historical capital support suggests funding access but not current runway, Provide current cap table and follow-on financing terms]
      - [Engineering intensity, "~300 employees with >50% R&D in DBR77; 200+ employees about 60 R&D staff and $4620K R&D expense on 17fly", medium, Engineering-heavy model may pressure opex before scale, Provide actual 2025 and 2026 opex by function]
      - [Marketing payback proxy, "\"100k hours MTBF\" and ROI under 12 months claims", low, Supports the value proposition but not audited customer economics, Provide cohort-level payback warranty costs and retention]
      - [Cash burn and runway, null, low, Capital adequacy cannot be judged without liquidity data, Provide cash balance monthly burn debt covenants and next-round trigger]
    notes: >-
      Null means not publicly disclosed in the assigned source pack; mixed figures are non-comparable marketing or
      partner disclosures rather than an audited operating model.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI015]
figures:
  - id: FI001
    title: Publicly visible revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a project-configured model that starts with channel or direct demand and monetizes
      through hardware, solution packaging, and attached services, but without public price disclosure.
    data:
      nodes:
        - label: Demand capture
          detail: Orders appear to come through direct sales plus distributors system integrators and OEM partners.
          claimRefs: [CI005, CI012]
        - label: Configuration quote
          detail: Scope is quote-specific across arm tooling software integration safety commissioning and service.
          claimRefs: [CI002, CI003]
        - label: Robot arm revenue
          detail: EC and CS cobot hardware are the core monetized products.
          claimRefs: [CI001]
        - label: Solution-package upsell
          detail: CP palletizing and CW welding extend revenue beyond the arm into a configured workstation or cell.
          claimRefs: [CI002]
        - label: Installation and support
          detail: Public materials reference after-sales service training and commissioning but do not price them.
          claimRefs: [CI004, CI012]
        - label: Customer ROI proof
          detail: Public economics are framed as payback or ROI claims rather than disclosed margins.
          claimRefs: [CI011]
      edges:
        - from: Demand capture
          to: Configuration quote
          label: scope definition
          detail: Opportunity shaping appears project-led rather than self-serve.
          claimRefs: [CI012]
        - from: Configuration quote
          to: Robot arm revenue
          label: hardware selection
          claimRefs: [CI001]
        - from: Robot arm revenue
          to: Solution-package upsell
          label: packaged cell options
          claimRefs: [CI002]
        - from: Solution-package upsell
          to: Installation and support
          label: commissioning and service
          claimRefs: [CI003]
        - from: Installation and support
          to: Customer ROI proof
          label: value case
          claimRefs: [CI011]
    approximationNotes: >-
      This bridge shows publicly described monetization surfaces and quote-scope dependencies, not actual revenue
      recognition, take rates, or margin percentages.
    claimRefs: [CI001, CI002, CI003, CI011, CI012]
callouts:
  - calloutType: insight
    title: Engineering-heavy monetization, not pure SaaS
    body: >-
      Public evidence suggests Elite monetizes through hardware plus configured automation projects with attached service
      scope, so margin quality depends on mix discipline rather than on a clean subscription model.
    claimRefs: [CI001, CI002, CI003, CI011]
  - calloutType: risk
    title: Financial opacity is the main blocker
    body: >-
      A current valuation marker exists, but the reviewed public materials still do not expose revenue, margin, cash, or
      runway, so capital adequacy and financing dependency cannot be underwritten from public sources alone.
    claimRefs: [CI013, CI015, CI016]
