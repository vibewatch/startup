schemaVersion: "report-v2"
artifact: financials
slug: elite-robots
runDate: 2026-10-16
company:
  name: Elite Robots
chapter:
  number: 4
  title: Financials
  summary: >-
    Elite appears to monetize through cobot hardware plus engineered solution packages, but the assigned public evidence
    does not disclose price realization, revenue, margin, or liquidity. Traction proxies and a current $1.2B valuation
    marker suggest commercial momentum, yet inconsistent company-controlled scale disclosures and a 2026 Teradyne suit
    leave capital adequacy un-underwritable without direct diligence.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization surface and revenue quality
    body: >-
      Elite’s public monetization surface is broader than a single cobot-arm SKU. Company and partner materials show a
      core hardware line in the EC and CS families plus packaged CP palletizing and CW welding solutions, which implies
      revenue can come from arm sales, packaged workstations, and attached commissioning or service scope rather than a
      pure software subscription. The StreetInsider/Evertise write-up is especially important because it says the CW
      offer does not define a standard scope across welding source, fixture, programming, integration, safety review,
      commissioning, or service. That variability matters financially: it means booked revenue and gross profit can vary
      materially by quote even though the reviewed public materials still stop short of disclosing list price,
      discounting, or realized ASP.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-operating-proxies
    title: Public traction and operating proxies
    body: >-
      Public traction proxies are directionally strong but not audit-ready. The Robot Report archive points to a
      $27M Series B in 2021, and DBR77 later said over 20,000 units across more than 50 countries; an ELITE ROBOTS
      page still showed 200+ employees, about 60 R&D personnel, $4620K of R&D expense, and 5000Pcs of deployed cobots.
      Meanwhile the EC Series brochure said Elite had a 10,000-unit annual production scale, and DBR77 said roughly
      300 employees with more than half in R&D. Together these markers suggest meaningful volume and engineering
      intensity, but they are company-controlled or partner-mediated disclosures across different vintages, so they
      cannot substitute for recognized revenue, backlog, margin, or working-capital disclosure.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-blockers
    title: Capital adequacy and underwriting blockers
    body: >-
      The capital-marking evidence is thin. Robo2u listed a $1.2B valuation as of March 2026 and also flagged that
      Elite was sued by Teradyne in 2026, which introduces potential legal-cost and channel-disruption overhang. But
      the assigned public pack does not disclose revenue or ARR, gross margin, cash, burn, runway, debt, or financing
      terms. That leaves the core underwriting questions unresolved: whether solution revenue carries acceptable service
      burden, whether manufacturing scale consumes working capital faster than collections, and how much room exists
      before another fundraise. The financial verdict is therefore qualitative only: Elite appears capable of
      monetizing hardware plus engineered automation projects, but revenue quality, margin path, and financing
      dependency remain diligence blockers.
    claimRefs: [CI013, CI014, CI015, CI016]
