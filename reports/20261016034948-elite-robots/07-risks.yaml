company:
  name: "Elite Robots"
chapter:
  number: 7
  title: "Risks"
  summary: "Elite Robots' risk profile is led by a 2026 Europe-centered software/IP dispute with Teradyne that escalated from a March filing to an April injunction before an October settlement with undisclosed terms. Public product materials show real mitigation work around safety, quality, and partner reach, but the assigned pool still leaves material diligence gaps on authority findings, litigation economics, capital resilience, and channel-control concentration."
sections:
  - id: "legal-regulatory-overhang"
    title: "Legal and regulatory overhang remains the clearest downside path"
    body: "The assigned pool shows a full legal-risk arc in 2026 rather than a one-off headline. Two independent March reports say Teradyne sued Elite Robots' German subsidiary over alleged copying of Universal Robots software and separately notified European authorities about safety concerns. The risk then escalated into an April injunction before The Robot Report's October archive update said the dispute had settled without disclosing terms. That sequence matters for underwriting: Elite may have avoided an open-ended court process, but outside investors still lack public evidence on settlement economics, product-remediation obligations, licensing constraints, or whether any partner, distributor, or end-customer commitments in Europe were interrupted during the dispute."
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR016"]
    tableRefs: ["TR001"]
  - id: "operational-safety-proof"
    title: "Operational and safety mitigations exist, but public proof is still incomplete"
    body: "Elite's own materials present a coherent mitigation story: the current cobot page cites ISO 10218 and ISO 13849 alignment, 90 configurable collision-detection levels, and a 100,000-hour MTBF claim, while the EC brochure positions the business at a 10,000-unit annual production scale. Those are useful inputs, but they are not a substitute for direct diligence on safety incidents, certification scope, or field reliability. The same public pool that contains the lawsuit reports does not contain public authority findings, field-failure statistics, or a dated third-party validation package tying the claims to specific models, regions, or customer deployments. That leaves a meaningful residual risk that safety or quality assertions are directionally true but incomplete for the geographies and workloads an investor would actually underwrite."
    claimRefs: ["CR002", "CR005", "CR006", "CR007", "CR016"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "dependency-and-disclosure-risk"
    title: "Partner dependency and uneven disclosure raise execution risk"
    body: "Route-to-market and service execution appear partner-heavy. Elite's current site says it works through a growing OEM ecosystem, and DBR77 describes a broader network of distributors, system integrators, and robotic OEMs. That can accelerate global reach, but it also pushes delivery quality, safety engineering, commissioning, and after-sales responsiveness into counterparties the assigned pool does not quantify. The risk is amplified by uneven public disclosure: a legacy site shows 5,000 deployed cobots and roughly 60 R&D personnel, while DBR77 describes more than 20,000 units across 50 countries, with no common as-of date reconciling those snapshots. Investors therefore have to treat current service capacity, concentration, and unit economics as open diligence items rather than settled facts."
    claimRefs: ["CR008", "CR009", "CR010", "CR011", "CR012", "CR013", "CR014", "CR015"]
    tableRefs: ["TR003"]
  - id: "kill-criteria-and-diligence-path"
    title: "Kill criteria should focus on Europe, safety evidence, and capital resilience"
    body: "The cleanest thesis-break triggers are public or diligence-confirmed evidence that the Teradyne settlement imposed commercially meaningful restrictions, that a safety authority required remediation or sales limits, or that Elite's channel architecture hides concentrated service or warranty exposure. A second cluster of kill criteria is financial: because the assigned pool does not surface current revenue, burn, or runway, any sign of litigation-driven cash stress, delayed distributor collections, or rising warranty reserves would sharply worsen the risk profile. Until management can reconcile installed-base metrics, present model-by-model certification packets, and show who owns safety engineering and commissioning in packaged deployments, the prudent underwriting stance is high diligence intensity rather than assuming the public mitigation narrative is sufficient."
    claimRefs: ["CR004", "CR005", "CR010", "CR014", "CR015", "CR016"]
callouts:
  - calloutType: "risk"
    title: "Europe is the highest-signal downside monitor"
    body: "A legal arc that moved from complaint to injunction to settlement inside one year is material even though the public record no longer shows an open court fight. The unresolved question is not whether there was a dispute, but what Elite conceded or changed to make it end."
    claimRefs: ["CR001", "CR003", "CR004", "CR016"]
  - calloutType: "recommendation"
    title: "Required confirmatory diligence before underwriting growth claims"
    body: "Request the full settlement package, model-by-model certification evidence, authority correspondence, distributor and integrator concentration data, and current burn/runway disclosures. Those items determine whether Elite's public mitigation story is durable or only marketing-grade."
    claimRefs: ["CR005", "CR010", "CR015", "CR016"]
