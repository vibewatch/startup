    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Installed base / geography
        - 10,000+ units / 30+ countries
        - "2023-06-19"
        - Business Wire
        - medium
        - Confirms global commercial footprint by mid-2023
        - No split by active units, paying customers, or repeat orders
      - - Installed base / geography
        - 10,000 units / 40+ countries
        - date not disclosed in fetched text
        - Robotics247
        - medium
        - Suggests continued breadth and Americas momentum
        - No disclosure of installed-base methodology or customer count
      - - Installed base / geography
        - 20,000+ units / 50+ countries
        - "2025-01-06"
        - DBR77
        - low
        - Implies materially larger scale if accurate
        - Not reconciled with earlier 10,000-unit claims
      - - Large-order signal
        - 3,000-unit order from unnamed Chinese energy company
        - article says "last week"
        - Robotics247
        - medium
        - Shows ability to win very large industrial programs
        - Customer identity, shipment pace, and revenue timing are undisclosed
    notes: >-
      Public trajectory data mixes company-issued and lightly verified third-party claims; the
      table should be read as directional adoption evidence, not a reconciled KPI series.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - ZF plant, Mexico
        - Automotive / EV accessories
        - Testing and assemblying EV accessories
        - Official showcase; production status not independently verified
        - Named plant and use case on Elite's global cases page
        - No go-live date, scale, ROI, or outside confirmation in the pool
      - - Chinese energy company (unnamed)
        - Energy / new-energy manufacturing
        - Reported 3,000-cobot order
        - Order announced; deployment completion unverified
        - Independent news report provides concrete order size
        - Customer identity withheld and no utilization data disclosed
      - - TWT Robot Enterprise, Thailand
        - Distributor / integrator channel
        - Named testimonial about working with Elite on customer solutions
        - Reference relationship evidenced; end-customer production status unknown
        - Named company and quote on official product page
        - Partner reference, not end-user proof, and not independently verified
      - - Abiman Engineering, South Korea
        - Engineering / integration partner
        - Named testimonial on technology quality and service
        - Reference relationship evidenced; deployment depth unclear
        - Named company and quote on official product page
        - Qualitative endorsement without contract, fleet, or outcome metrics
    notes: >-
      Partial public enumeration of named proofs only; rows mix end-customer and channel
      references because the assigned pool does not contain a larger independently verified list.
    enumerationScope:
      coverage: partial
      basis: >-
        Selected named references available in the assigned public pool across current official
        showcases, testimonials, and one independent order report.
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU011
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests a partner-assisted path from application discovery to deployment,
      but retention proof largely stops after showcase references.
    data:
      items:
        - label: Discover and qualify
          detail: Manufacturing buyer screens industry fit, payload, reach, and safety positioning.
          touchpoints:
            - Product pages and trade-show visibility
            - Multi-vertical use-case marketing
        - label: Technical evaluation
          detail: Customer or integrator matches Elite's arm and solution options to the workflow.
          touchpoints:
            - Payload and reach comparison
            - Quote-level scope and tooling review
        - label: Partner-assisted design
          detail: Distributors, integrators, and OEM relationships appear to help package the sale.
          touchpoints:
            - TWT and Abiman references
            - Broader distributor/OEM ecosystem
        - label: Pilot or site deployment
          detail: Public showcases emphasize application deployment in specific plants or regions.
          touchpoints:
            - ZF plant in Mexico
            - Spain machine tending and New Zealand palletizing
        - label: Production scale-up
          detail: A reported 3,000-unit order implies Elite can move from demos to large programs.
          touchpoints:
            - Large China energy-sector order
            - Americas growth claims
        - label: Expansion and retention
          detail: The public record becomes thin after deployment and does not show renewal economics.
          touchpoints:
            - No public NRR or churn
            - No top-customer share disclosure
    claimRefs:
      - CU002
      - CU003
      - CU008
      - CU013
callouts:
  - calloutType: strength
    title: Breadth of industrial use cases is real
    body: >-
      The assigned pool includes both named showcases and a concrete large-order report, which is
      stronger evidence than logo-only customer pages and supports the view that Elite has real
      industrial traction across multiple workflows.
    claimRefs:
      - CU002
      - CU003
      - CU007
  - calloutType: risk
    title: Customer quality is less proven than customer reach
    body: >-
      Installed-base figures conflict across sources, most named proof is company-issued, and the
      pool has no public retention or concentration disclosure, so customer durability still needs
      direct diligence.
    claimRefs:
      - CU007
      - CU010
      - CU013
