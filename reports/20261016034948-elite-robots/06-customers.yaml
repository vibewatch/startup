schemaVersion: report-v2
artifact: customers
slug: elite-robots
runDate: 2026-10-16
company:
  name: Elite Robots
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real multi-vertical adoption, including a reported 3,000-unit
    energy-sector order, named showcase deployments in Mexico, Spain, and New Zealand, and
    broad distributor-led global reach. The harder underwriting question is durability: the
    assigned pool has inconsistent installed-base figures and no public NRR, churn, contract,
    or customer-concentration disclosure.
sections:
  - id: customer-footprint
    title: Customer footprint is broad across industrial workflows
    body: >-
      Elite Robots' public customer evidence points to a manufacturing-heavy buyer base rather
      than a narrow single-vertical niche. Company materials consistently position the platform
      in automotive, electronics, packaging/logistics, metal processing, household appliances,
      and medical-device workflows, while the current product site adds concrete global case
      examples in New Zealand, Spain, and Mexico. This matters because it shows the company is
      selling into repeatable automation jobs such as palletizing, machine tending, testing, and
      assembly, not just publishing generic logo slides. The caveat is that most named proofs
      are still company-issued showcases or testimonials, so breadth is better evidenced than
      depth of production usage.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU012
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption signals are positive, but the scale numbers do not reconcile cleanly
    body: >-
      The strongest independent adoption signal in the assigned pool is Robotics247's report
      that Elite received a 3,000-unit order from a Chinese energy company, which implies the
      company can land large industrial accounts. Beyond that, the public record is numerically
      messy. A June 2023 Business Wire release cited 10,000 units in 30-plus countries, while
      Robotics247 described 10,000 units in more than 40 countries and DBR77 later claimed
      20,000 units across more than 50 countries. The directional message is commercial reach
      and international expansion; the underwriting gap is that none of these public sources
      reconcile active fleets, shipped units, paying customers, or repeat-purchase behavior.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU002
  - id: named-proof
    title: Named proof is strongest for application fit, weaker for outcome and production status
    body: >-
      Elite's named proof is good enough to show real use-case variety but not good enough to
      prove customer quality. The official site points to a ZF plant deployment in Mexico, plus
      use cases in New Zealand and Spain, and the company cites named references in Thailand and
      South Korea. However, the public pool rarely discloses go-live dates, production-vs-pilot
      status, contract scope, or outcome metrics, and even the 2026 welding buyer guide stresses
      that published options and specifications are not evidence of weld quality or a complete
      delivered cell. For diligence, that means the public record is better at showing where the
      product can be used than whether customers expand, renew, and achieve measurable ROI.
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU003
  - id: retention-and-concentration
    title: Retention and concentration remain the key unresolved customer questions
    body: >-
      The pool supports a view that Elite can reach customers through partners, integrators, and
      geographic branches, but it does not disclose the commercial quality of that footprint.
      There is no public NRR, GRR, churn, renewal, cohort, contract-length, or top-customer-share
      disclosure in the assigned evidence. The combination of one very large reported order, heavy
      partner-channel language, and marketing-led case evidence creates real concentration and
      execution questions: how much growth is repeat business, how much is distributor-led, and
      how exposed is revenue to a handful of large accounts or geographies. Those are diligence
      asks, not facts the current public record can close.
    claimRefs:
      - CU008
      - CU011
      - CU013
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment / vertical
      - Buyer / user / payer
      - Use-case evidence
      - Scale / geography signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Automotive / EV manufacturing
        - Plant automation buyer; production or QA user; manufacturing capex payer
        - ZF Mexico EV-accessory testing/assembly showcase plus a reported 3,000-unit order from a Chinese energy company
        - Mexico named site plus unnamed large China account
        - Suggests Elite can win complex industrial workflows and large-account orders
        - End-customer names, shipment timing, and recurring revenue are not disclosed
      - - Electronics / 3C manufacturing
        - Factory automation engineering buyer; line technician user; plant ops payer
        - Official six-industry positioning and EC-series application examples
        - Repeated in official and third-party profile materials
        - Appears to be a core historic entry vertical for flexible automation
        - No independent customer list or live-usage metrics in the pool
      - - Packaging / logistics / palletizing
        - End-of-line automation buyer; packaging/logistics operator user; operations payer
        - New Zealand pick-pack and palletizing showcase; later CP palletizing solution push
        - New Zealand case plus 2024 packaged-solution expansion claim
        - Indicates movement from arm sales toward solution-led land-and-expand
        - Outcome metrics and repeat-order evidence are not public
      - - Distributor / integrator channel
        - Distributor or SI buyer; end-customer user; channel or plant budget payer
        - Named testimonials from TWT Robot Enterprise and Abiman Engineering plus DBR77 ecosystem profile
        - Thailand, South Korea, and multi-region partner references
        - Channel appears to amplify international reach and service coverage
        - Direct-vs-channel revenue mix and margin quality are undisclosed
    notes: >-
      Rows synthesize public proof by segment; null commercial metrics reflect absent public
      disclosure rather than zero activity.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU011
      - CU012
