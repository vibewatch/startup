      topic: developer-signal
      missingEvidence: Practitioner or developer-signal proof such as SDK documentation history, repos, release notes, forum activity, API communities, or status/security disclosures.
      whyItMatters: Integrator adoption, controller maturity, and long-term support are hard to judge when all software evidence is vendor-authored.
      diligencePath: Request SDK/package history, public incident reporting, and customer integration references; use a deeper search pass focused on practitioner communities if allowed.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: reliability-proof
      missingEvidence: Model-level uptime, warranty claims, field failure modes, service response times, and install-base by SKU.
      whyItMatters: Reliability and support burden drive ROI, warranty exposure, and implementation risk for industrial automation buyers.
      diligencePath: Request fleet uptime by model, top service-ticket categories, spare-parts lead times, and warranty reserve history from management.
      relatedQuestionRefs: [QE004]
    - type: enumeration-incomplete
      severity: minor
      topic: product-portfolio
      missingEvidence: A current official statement showing which EC and CS models are actively sold, regionally available, or sunset.
      whyItMatters: Public materials mix older and newer lineups, which can confuse underwriting around roadmap continuity and channel inventory.
      diligencePath: Ask for the current SKU list by region, launch date, status, and announced replacement path for any legacy models.
      relatedQuestionRefs: [QE001, QE009]
      relatedTableRefs: [TE001]
