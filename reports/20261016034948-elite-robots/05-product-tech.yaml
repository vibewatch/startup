    title: Product architecture map
    type: stack
    summary: Elite's public product stack layers collaborative arms with controller software, safety controls, peripherals, and partner-built cells.
    data:
      layers:
        - label: Workflow layer
          detail: Customer-facing jobs marketed by Elite.
          modules:
            - label: Assembly and testing
            - label: Machine tending
            - label: Palletizing and material handling
          outputs:
            - label: Human-adjacent flexible automation
        - label: Peripheral layer
          detail: Cell extensions that turn the arm into a workflow-specific solution.
          modules:
            - label: End-effectors
            - label: Vision sensors
            - label: Force-control sensors
            - label: AGV composite robots
        - label: Robot-arm layer
          detail: Six-axis collaborative arms across current and legacy product families.
          modules:
            - label: CS series (3-30 kg)
            - label: EC legacy series
            - label: 624-1800 mm reach envelope
        - label: Control and software layer
          detail: Interfaces used to program, connect, and redeploy the robots.
          modules:
            - label: Graphical programming
            - label: Web UI remote control
            - label: Open low-level motion interface
            - label: Profinet / EtherNet-IP / Modbus
        - label: Safety layer
          detail: Safety behavior is documented at the robot level but still needs external verification.
          modules:
            - label: 18 safety functions
            - label: Collision detection
            - label: ISO 10218 / ISO 13849 / ISO-TS 15066 claims
        - label: Partner-solution layer
          detail: Elite often appears in integrated cells with external devices and local partners.
          modules:
            - label: Inspection and metrology stacks
            - label: Welding-adjacent workstations
            - label: Surface-finishing cells
          outputs:
            - label: Turnkey or semi-turnkey automation offers
    approximationNotes: >-
      The stack reflects explicitly documented layers and dependencies from public
      materials; it does not imply a closed in-house stack for every component.
    claimRefs: [CE004, CE005, CE006, CE007, CE009]
callouts:
  - calloutType: strength
    title: Real product breadth is documented
    body: >-
      Unlike a concept-stage automation startup, Elite has multiple publicly documented
      cobot families, concrete payload/reach envelopes, and visible integration patterns.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Software lineage remains the sharpest technical risk
    body: >-
      The 2026 injunction and later settlement closed the public dispute, but not the
      diligence question of whether any software, licensing, or channel changes were required.
    claimRefs: [CE010, CE011]
  - calloutType: insight
    title: Public proof is richer on specs than on field performance
    body: >-
      The assigned pool says much more about payload, reach, and interfaces than about
      uptime, failure modes, developer adoption, or independently verified certifications.
    claimRefs: [CE005, CE007, CE008, CE012]
