schemaVersion: report-v2
artifact: product-tech
slug: elite-robots
runDate: 2026-10-16
company:
  name: Elite Robots
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Elite Robots appears to sell a real collaborative-robot portfolio, with current
    CS-series cobots spanning 3-30 kg and documented integration hooks for vision,
    force sensing, AGVs, common industrial protocols, and partner-built cells. The
    main product-tech risk is that most maturity, reliability, and compliance proof
    in the assigned pool is company-issued, while 2026 copyright litigation over
    allegedly infringing Universal Robots software leaves unresolved questions about
    software lineage, certification evidence, and whether any post-settlement product
    changes were required.
sections:
  - id: delivered-product-and-workflows
    title: Delivered product and customer workflows
    body: >-
      Elite Robots is selling collaborative robot arms and adjacent automation cells,
      not a standalone software product. Across its current product page, older EC
      catalogs, and homepage copy, the company positions its cobots for assembly,
      machine tending, palletizing, inspection, testing, tightening, welding-adjacent
      workflows, and material handling. The current website frames the flagship line
      as six CS-series cobots covering 3-30 kg payloads and 624-1800 mm reach, while
      older EC materials show an earlier line built around lighter 3 kg, 6 kg, 12 kg,
      and 16 kg payload classes. That pattern suggests a broadened SKU range over time,
      but the public pool still does not clearly state which legacy EC models remain
      actively sold versus superseded.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment-model
    title: Architecture and deployment model
    body: >-
      Elite's public architecture story is integration-heavy. The homepage says its
      cobots can be equipped with end-effectors, vision sensors, force-control sensors,
      and AGVs to form composite robots, while the current product page adds third-party
      platform compatibility, Web UI remote control, and graphical programming. The
      CS-series brochure goes further by describing modular software, open low-level
      motion interfaces, dense I/O, and support for Profinet, EtherNet/IP, and Modbus
      RTU/TCP. Taken together, the product looks oriented toward integrators and
      manufacturing engineers who need a configurable arm plus cell-level peripherals,
      not a vertically closed appliance. What remains missing is an independently
      validated view of SDK adoption, release cadence, or field integration quality.
    claimRefs: [CE004, CE005, CE006]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-safety-and-maturity
    title: Differentiation, safety, and maturity
    body: >-
      The concrete differentiation that is publicly documented is mostly mechanical and
      deployment-oriented: broad payload and reach coverage, no-fence collaborative
      positioning, drag-teach workflows, a claimed 100k-hour MTBF, and compatibility
      with partner-built cells for inspection, metrology, and finishing tasks. Elite
      also claims 18 safety functions and alignment with ISO 10218, ISO 13849-1 Cat3
      PLd, and ISO/TS 15066, plus collision-detection settings and remote Web UI
      operation. Those claims may be commercially meaningful, but in this pool they are
      still largely self-attested. There is no independent certificate pack, public
      status page, or practitioner/developer signal to show whether field reliability,
      support responsiveness, and controller maturity match the marketing narrative.
    claimRefs: [CE007, CE008, CE009, CE012, CE013]
  - id: adverse-technology-risk
    title: Adverse technology risk
    body: >-
      The clearest product-tech downside is software and IP risk. In April 2026,
      Teradyne Robotics said the Hamburg Regional Court issued a preliminary injunction
      against Elite Robots Germany over allegedly infringing Universal Robots software
      and products containing it in Germany. In October 2026, The Robot Report said the
      companies settled by mutual agreement, but neither side disclosed the terms or
      whether Elite had to change software, products, licenses, distributor behavior, or
      customer remediation. That means the dispute is no longer active in public, but
      the operational consequences for Elite's software stack, European channel, and
      product roadmap still remain opaque and should be diligenced directly with the
      company.
    claimRefs: [CE010, CE011]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user / buyer
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - CS series cobots
        - Plant engineers, integrators, OEM cell builders
        - Current flagship line on the official product site
        - Six cobots spanning 3-30 kg, 624-1800 mm reach, and Web UI / third-party platform positioning
        - Need model-level pricing, controller commonality, and install-base by SKU
      - - EC legacy series
        - Manufacturers needing lighter collaborative arms
        - Documented in older catalogs; current sell-through status is unclear
        - Earlier 3 kg, 6 kg, 12 kg, and 16 kg portfolio with 220V/48V deployment and drag-teach positioning
        - Need confirmation which EC SKUs are still current versus superseded
      - - Partner-integrated automation cells
        - Buyers procuring a full workflow, not just an arm
        - Showcased in company and partner materials
        - Combines Elite arms with inspection, metrology, welding, and finishing stations
        - Need a standard scope split for safety, commissioning, warranty, and service
      - - Peripheral integration layer
        - Integrators adapting the arm to a specific cell
        - Current capability claimed on homepage and product site
        - Supports end-effectors, vision, force sensing, AGVs, and third-party platforms
        - Need validated reference architectures and approved device lists
    notes: >-
      Public materials mix current official pages, older catalogs, and partner showcases;
      rows indicate what is documented publicly, not guaranteed current commercial scope.
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Elite Robots solution
      - Measurable benefit
      - Limitation
    rows:
      - - Machine tending and loading / unloading
        - Repetitive loading, unloading, and basic inspection on flexible lines
        - Compact cobot plus drag-teach programming and peripheral tooling
        - One company case says a hot-melt-machine deployment saved the labor cost of 2 persons and paid back in just over 8 months
        - Single company example; no independent cycle-time or uptime distribution in pool
      - - Palletizing and heavier handling
        - End-of-line moves and medium-to-high payload material transfer
        - CS620 / CS625 positioning for palletizing and welding-adjacent workflows
        - Business Wire claims 20 kg payload, 1800 mm reach, and up to 3.9 m/s TCP speed for CS620
        - No independent throughput benchmark or installed-cell safety validation
      - - Vision inspection and metrology
        - Part inspection, photography, and 3D measurement workflows
        - EC64-19 and CS66 showcased with partner devices and software
        - Partner showcase claims up to 1900 mm reach for EC64-19 and 0.015 mm measurement accuracy for one integrated stack
        - Demo evidence does not prove broad production adoption or repeatable field accuracy
      - - Flexible assembly, testing, and small-space automation
        - Lines that reconfigure frequently and need human-adjacent automation
        - No-fence collaborative positioning, drag teaching, Web UI, and AGV-compatible cells
        - Public sources claim quick redeployment, compact installation, and safe human-robot interaction
        - Need independent evidence on changeover time, failure rates, and support burden
    notes: >-
      Benefits are a mix of company case-study claims and showcase specifications; they
      screen workflow fit but do not independently validate production outcomes.
    claimRefs: [CE004, CE006, CE008, CE009, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key dependency
      - Risk
    rows:
      - - Robot arm and joints
        - Executes payload, reach, and repeatability envelope for the cell
        - Joint hardware, servo, encoder, and mechanical structure
        - Field failure rates and maintenance burden are not independently disclosed
      - - Controller and software stack
        - Handles programming, motion control, I/O, remote access, and protocol translation
        - Teach pendant, firmware upgrades, low-level interfaces, and plant-network integration
        - No public SDK or release-community signal in the assigned pool
      - - Safety and compliance controls
        - Implements collision handling, safety functions, and standards-aligned behavior
        - Correct cell configuration, risk assessment, and supporting certificate pack
        - Public evidence is company-issued; independent certification proof is absent here
      - - Peripheral and partner layer
        - Adds vision, force sensing, welding, metrology, AGVs, and finishing tools
        - Third-party devices, integrators, and local service coverage
        - Responsibility boundaries for safety, commissioning, and support are not standardized in public materials
    notes: >-
      This architecture table synthesizes Elite's official claims into deployment layers;
      it is useful for diligence scoping, not a substitute for a validated system design.
    claimRefs: [CE004, CE005, CE006, CE007, CE009]
figures:
