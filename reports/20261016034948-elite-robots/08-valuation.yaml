company:
  name: Elite Robots
chapter:
  number: 8
  title: Valuation
  summary: |-
    Elite Robots has enough public evidence to support a serious diligence effort, but not enough to underwrite a premium entry price or a clean buy recommendation. The accessible record shows a fresh 2026 Series D, meaningful deployment and product breadth claims, and a still-material legal overhang, while revenue, margin, retention, and cap-table terms remain undisclosed; the most supportable call is research-more with high risk and unknown valuation support.
sections:
  - id: recommendation-call
    title: Recommendation call
    body: |-
      The public record supports a conditional interest case rather than a priced conviction case. Elite Robots appears to have real commercial presence: its current site claims 20,000+ deployed units across 50+ countries and 300+ patents or other IP assets, while Tracxn still classifies the business as a Series D company that has raised $142 million. Product collateral and distributor-oriented pages also show a broad collaborative-robot lineup and a partner-heavy go-to-market model. That combination argues against a zero-traction view and suggests the company has built a meaningful hardware platform.

      The problem is that this is not the same as valuation support. The accessible 2026 financing evidence confirms a recent round, but not the full economics a new investor needs to anchor entry price, downside protection, or expected return. Meanwhile, The Robot Report's 2026 coverage shows that an injunction was granted in Germany before the dispute was later settled on undisclosed terms. Because the public evidence set still lacks revenue, margin, retention, backlog, cash-burn, and preference-stack visibility, the disciplined call is research-more rather than buy, and only at a discount to any private mark that relies on stronger economics than the public record shows.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV008, CV011, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-price-support
    title: Financing and price support
    body: |-
      Public financing context is directionally positive but still incomplete for underwriting. Tracxn shows six rounds and a latest Series D dated March 25, 2026, which confirms continued investor access and argues that insiders or new investors still saw enough technical or commercial promise to fund the business. The company also markets substantial deployment, patent, and international-footprint claims, and older materials show a multi-year effort to scale production and applications. Those data points support continued relevance in collaborative robots.

      They do not, however, establish whether the latest valuation is attractive. The accessible Tracxn page masks detailed round economics behind locked fields, and the retrieved company-controlled pages emphasize deployment, partner breadth, and ROI language without disclosing revenue, gross margin, retention, backlog, or cash efficiency. Even a recent third-party shortlist article on welding frames Elite Robots as fit-dependent and explicitly warns that published specs do not prove weld quality or complete-cell economics. In practice, public evidence supports diligence on the company, not payment confidence on the price.
    claimRefs: [CV002, CV003, CV005, CV006, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-downside
    title: Scenario framing
    body: |-
      The bull case is straightforward: Elite Robots turns its claimed installed base, product breadth, and partner network into durable global share gains while the fresh Series D capital supports commercialization and litigation no longer blocks channel expansion after settlement. In that case, the company's public footprint would read as early evidence of a scalable Asian hardware challenger with enough technical and distribution credibility to compound into a strategic asset.

      The base case is more restrained. The business may be real and growing, but investors still cannot verify the quality of that growth from public evidence alone. If revenue conversion, gross margins, service burden, or customer repeat behavior are weaker than the marketing footprint implies, then the latest round may only fund continued execution rather than support step-up valuation. The bear case combines hidden economic weakness with renewed legal friction or channel hesitation, which would make a down round, flat round, or strategic buyer discount plausible. With that asymmetry, downside protection matters more than narrative upside.
    claimRefs: [CV002, CV003, CV007, CV008, CV009, CV011, CV012]
    tableRefs: [TV003]
  - id: final-diligence-asks
    title: Final diligence asks and kill criteria
    body: |-
      Exit readiness is still unproven from public materials. The company can point to international reach, industry references, and a broad product set, but the evidence available here is still mostly marketing, directory, and summary-source level rather than investor-grade operating disclosure. Before underwriting a price, diligence needs the 2026 round memo or cap-table materials, audited or at least board-grade revenue and gross-margin history, customer concentration, repeat-order behavior, warranty or service-cost trends, and the exact commercial impact of the Teradyne dispute settlement.

      Kill criteria should be explicit. A pass is warranted if management cannot show that current growth converts into attractive unit economics, if liquidation preferences or ratchets structurally subordinate new capital, or if the legal settlement still constrains software, channel partners, or core geographies. Conversely, the recommendation could improve if private diligence shows healthy gross margins, credible repeat demand, manageable service intensity, and round terms that leave room for venture or strategic upside. Until then, the prudent stance is to track the company closely but preserve price discipline.
    claimRefs: [CV003, CV007, CV008, CV011, CV012]
