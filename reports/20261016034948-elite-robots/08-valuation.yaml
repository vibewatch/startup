      - [Anti-thesis, "Public evidence still cannot verify revenue quality, retention, or price-to-performance at the equity level", "Board-grade operating history or audited accounts would materially improve valuation confidence"]
      - [Anti-thesis, "The Teradyne dispute shows that litigation can interfere with commercialization or exit optics even if settlement ends the public case", "Full settlement terms and channel impact evidence would lower legal-overhang concern"]
    notes: "Thesis items summarize what public evidence suggests; anti-thesis items capture what remains unpriced or potentially overclaimed without private diligence."
    claimRefs: [CV002, CV003, CV007, CV008, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Claimed deployed base, patents, and partner reach reflect durable share gains; 2026 capital accelerates commercialization; litigation no longer constrains channels", "A premium to the latest private mark is only plausible if private diligence confirms strong growth, margins, and clean legal optionality", "Service burden, pricing pressure, or hidden preference overhang", "Requires multiple private proofs not present in public evidence"]
      - [Base, "Business is growing but economics are mixed; litigation is resolved procedurally but still weighed in counterparties' diligence", "Most rational entry is at or below the latest private mark unless management proves unusual efficiency or retention", "Round terms may already price in upside that public data cannot verify", "Most consistent with the current public record"]
      - [Bear, "Marketing scale outpaces financial quality; legal and channel friction slow adoption; new capital carries protective terms", "Down-round, flat-round, or strategic-sale discount becomes more plausible than venture step-up", "Opaque cap table, weaker margins, concentration, or settlement side effects", "Becomes likely if diligence cannot close the economics and legal gaps quickly"]
    notes: "Scenarios are directional because the assigned evidence pool does not disclose revenue, margins, retention, or full round terms; ranges would be false precision."
    claimRefs: [CV002, CV003, CV007, CV008, CV010, CV011, CV012]
