              - CP011
          - type: callout
            title: Public proof is marketing-heavy
            body: >-
              The reviewed evidence is rich in product claims and solution packaging, but thin on public pricing,
              independent TCO benchmarks, and side-by-side performance validation against incumbents.
            calloutType: risk
            claimRefs:
