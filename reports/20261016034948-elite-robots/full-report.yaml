        title: Adoption signals are positive, but the scale numbers do not reconcile cleanly
        blocks:
          - type: paragraph
            body: >-
              The strongest independent adoption signal in the assigned pool is Robotics247's report that Elite received
              a 3,000-unit order from a Chinese energy company, which implies the company can land large industrial
