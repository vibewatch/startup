      - number: '3.2'
        title: Elite's disclosed strengths are breadth, redeployment, and in-house stack
        blocks:
          - type: paragraph
            body: >-
              Elite's public materials consistently emphasize a broad cobot range, fast redeployment, easy operation,
              and compatibility with third-party platforms. The strongest supported differentiation is not unique
              pricing power, but a portfolio that stretches from standard EC and CS collaborative arms into palletizing
              and welding-adjacent offers, plus repeated claims of in-house operating system, firmware, hardware, and
              joint-module development. That mix is well aligned with flexible manufacturing use cases in automotive,
              electronics, packaging/logistics, and machine tending, where buyers often value integration speed and
              sufficient performance over bespoke robotics development. However, most of that proof is still
              vendor-authored or partner-amplified, so the matrix is much stronger on published specs and messaging than
              on independent benchmark evidence.
