      - number: '6.3'
        title: Named proof is strongest for application fit, weaker for outcome and production status
        blocks:
          - type: paragraph
            body: >-
              Elite's named proof is good enough to show real use-case variety but not good enough to prove customer
              quality. The official site points to a ZF plant deployment in Mexico, plus use cases in New Zealand and
              Spain, and the company cites named references in Thailand and South Korea. However, the public pool rarely
              discloses go-live dates, production-vs-pilot status, contract scope, or outcome metrics, and even the 2026
              welding buyer guide stresses that published options and specifications are not evidence of weld quality or
              a complete delivered cell. For diligence, that means the public record is better at showing where the
              product can be used than whether customers expand, renew, and achieve measurable ROI.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU011
      - number: '6.4'
        title: Retention and concentration remain the key unresolved customer questions
        blocks:
          - type: paragraph
            body: >-
              The pool supports a view that Elite can reach customers through partners, integrators, and geographic
              branches, but it does not disclose the commercial quality of that footprint. There is no public NRR, GRR,
              churn, renewal, cohort, contract-length, or top-customer-share disclosure in the assigned evidence. The
              combination of one very large reported order, heavy partner-channel language, and marketing-led case
              evidence creates real concentration and execution questions: how much growth is repeat business, how much
              is distributor-led, and how exposed is revenue to a handful of large accounts or geographies. Those are
              diligence asks, not facts the current public record can close.
            claimRefs:
              - CU008
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth of industrial use cases is real
            body: >-
              The assigned pool includes both named showcases and a concrete large-order report, which is stronger
              evidence than logo-only customer pages and supports the view that Elite has real industrial traction
              across multiple workflows.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU007
          - type: callout
            title: Customer quality is less proven than customer reach
            body: >-
              Installed-base figures conflict across sources, most named proof is company-issued, and the pool has no
              public retention or concentration disclosure, so customer durability still needs direct diligence.
            calloutType: risk
            claimRefs:
              - CU007
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory overhang remains the clearest downside path
        blocks:
          - type: paragraph
            body: >-
              The assigned pool shows a full legal-risk arc in 2026 rather than a one-off headline. Two independent
              March reports say Teradyne sued Elite Robots' German subsidiary over alleged copying of Universal Robots
              software and separately notified European authorities about safety concerns. The risk then escalated into
              an April injunction before The Robot Report's October archive update said the dispute had settled without
              disclosing terms. That sequence matters for underwriting: Elite may have avoided an open-ended court
              process, but outside investors still lack public evidence on settlement economics, product-remediation
              obligations, licensing constraints, or whether any partner, distributor, or end-customer commitments in
              Europe were interrupted during the dispute.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR016
      - number: '7.2'
        title: Operational and safety mitigations exist, but public proof is still incomplete
        blocks:
          - type: paragraph
            body: >-
              Elite's own materials present a coherent mitigation story: the current cobot page cites ISO 10218 and ISO
              13849 alignment, 90 configurable collision-detection levels, and a 100,000-hour MTBF claim, while the EC
              brochure positions the business at a 10,000-unit annual production scale. Those are useful inputs, but
              they are not a substitute for direct diligence on safety incidents, certification scope, or field
              reliability. The same public pool that contains the lawsuit reports does not contain public authority
              findings, field-failure statistics, or a dated third-party validation package tying the claims to specific
              models, regions, or customer deployments. That leaves a meaningful residual risk that safety or quality
              assertions are directionally true but incomplete for the geographies and workloads an investor would
              actually underwrite.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: Partner dependency and uneven disclosure raise execution risk
        blocks:
          - type: paragraph
            body: >-
              Route-to-market and service execution appear partner-heavy. Elite's current site says it works through a
              growing OEM ecosystem, and DBR77 describes a broader network of distributors, system integrators, and
              robotic OEMs. That can accelerate global reach, but it also pushes delivery quality, safety engineering,
              commissioning, and after-sales responsiveness into counterparties the assigned pool does not quantify. The
              risk is amplified by uneven public disclosure: a legacy site shows 5,000 deployed cobots and roughly 60
              R&D personnel, while DBR77 describes more than 20,000 units across 50 countries, with no common as-of date
              reconciling those snapshots. Investors therefore have to treat current service capacity, concentration,
              and unit economics as open diligence items rather than settled facts.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Kill criteria should focus on Europe, safety evidence, and capital resilience
        blocks:
          - type: paragraph
            body: >-
              The cleanest thesis-break triggers are public or diligence-confirmed evidence that the Teradyne settlement
              imposed commercially meaningful restrictions, that a safety authority required remediation or sales
              limits, or that Elite's channel architecture hides concentrated service or warranty exposure. A second
              cluster of kill criteria is financial: because the assigned pool does not surface current revenue, burn,
              or runway, any sign of litigation-driven cash stress, delayed distributor collections, or rising warranty
              reserves would sharply worsen the risk profile. Until management can reconcile installed-base metrics,
              present model-by-model certification packets, and show who owns safety engineering and commissioning in
              packaged deployments, the prudent underwriting stance is high diligence intensity rather than assuming the
              public mitigation narrative is sufficient.
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Europe is the highest-signal downside monitor
            body: >-
              A legal arc that moved from complaint to injunction to settlement inside one year is material even though
              the public record no longer shows an open court fight. The unresolved question is not whether there was a
              dispute, but what Elite conceded or changed to make it end.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR016
          - type: callout
            title: Required confirmatory diligence before underwriting growth claims
            body: >-
              Request the full settlement package, model-by-model certification evidence, authority correspondence,
              distributor and integrator concentration data, and current burn/runway disclosures. Those items determine
              whether Elite's public mitigation story is durable or only marketing-grade.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation call
        blocks:
          - type: paragraph
            body: >-
              The public record supports a conditional interest case rather than a priced conviction case. Elite Robots
              appears to have real commercial presence: its current site claims 20,000+ deployed units across 50+
              countries and 300+ patents or other IP assets, while Tracxn still classifies the business as a Series D
              company that has raised $142 million. Product collateral and distributor-oriented pages also show a broad
              collaborative-robot lineup and a partner-heavy go-to-market model. That combination argues against a
              zero-traction view and suggests the company has built a meaningful hardware platform.


              The problem is that this is not the same as valuation support. The accessible 2026 financing evidence
              confirms a recent round, but not the full economics a new investor needs to anchor entry price, downside
              protection, or expected return. Meanwhile, The Robot Report's 2026 coverage shows that an injunction was
              granted in Germany before the dispute was later settled on undisclosed terms. Because the public evidence
              set still lacks revenue, margin, retention, backlog, cash-burn, and preference-stack visibility, the
              disciplined call is research-more rather than buy, and only at a discount to any private mark that relies
              on stronger economics than the public record shows.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing and price support
        blocks:
          - type: paragraph
            body: >-
              Public financing context is directionally positive but still incomplete for underwriting. Tracxn shows six
              rounds and a latest Series D dated March 25, 2026, which confirms continued investor access and argues
              that insiders or new investors still saw enough technical or commercial promise to fund the business. The
              company also markets substantial deployment, patent, and international-footprint claims, and older
              materials show a multi-year effort to scale production and applications. Those data points support
              continued relevance in collaborative robots.


              They do not, however, establish whether the latest valuation is attractive. The accessible Tracxn page
              masks detailed round economics behind locked fields, and the retrieved company-controlled pages emphasize
              deployment, partner breadth, and ROI language without disclosing revenue, gross margin, retention,
              backlog, or cash efficiency. Even a recent third-party shortlist article on welding frames Elite Robots as
              fit-dependent and explicitly warns that published specs do not prove weld quality or complete-cell
              economics. In practice, public evidence supports diligence on the company, not payment confidence on the
              price.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Elite Robots turns its claimed installed base, product breadth, and
              partner network into durable global share gains while the fresh Series D capital supports
              commercialization and litigation no longer blocks channel expansion after settlement. In that case, the
              company's public footprint would read as early evidence of a scalable Asian hardware challenger with
              enough technical and distribution credibility to compound into a strategic asset.


              The base case is more restrained. The business may be real and growing, but investors still cannot verify
              the quality of that growth from public evidence alone. If revenue conversion, gross margins, service
              burden, or customer repeat behavior are weaker than the marketing footprint implies, then the latest round
              may only fund continued execution rather than support step-up valuation. The bear case combines hidden
              economic weakness with renewed legal friction or channel hesitation, which would make a down round, flat
              round, or strategic buyer discount plausible. With that asymmetry, downside protection matters more than
              narrative upside.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Final diligence asks and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is still unproven from public materials. The company can point to international reach,
              industry references, and a broad product set, but the evidence available here is still mostly marketing,
              directory, and summary-source level rather than investor-grade operating disclosure. Before underwriting a
              price, diligence needs the 2026 round memo or cap-table materials, audited or at least board-grade revenue
              and gross-margin history, customer concentration, repeat-order behavior, warranty or service-cost trends,
              and the exact commercial impact of the Teradyne dispute settlement.


              Kill criteria should be explicit. A pass is warranted if management cannot show that current growth
              converts into attractive unit economics, if liquidation preferences or ratchets structurally subordinate
              new capital, or if the legal settlement still constrains software, channel partners, or core geographies.
              Conversely, the recommendation could improve if private diligence shows healthy gross margins, credible
              repeat demand, manageable service intensity, and round terms that leave room for venture or strategic
              upside. Until then, the prudent stance is to track the company closely but preserve price discipline.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
