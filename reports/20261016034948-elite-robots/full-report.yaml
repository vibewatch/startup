        title: Exhibits
        blocks:
          - type: callout
            title: Competition is route-based, not just vendor-based
            body: >-
              Elite is competing simultaneously with arm OEMs, welding packages, palletizing packages, integrators, and
              internal-build paths, so quote scope matters almost as much as payload or repeatability.
            calloutType: insight
            claimRefs:
