  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The call turns on real commercial proof offset by incomplete price support and unresolved legal/economic
      diligence.
    data:
      nodes:
        - id: scale
          label: Commercial proof
          value: 20,000+ deployed units; 50+ countries
          note: Current company quick facts suggest real footprint
        - id: product
          label: Product credibility
          value: 6 cobots; 3-30 kg; partner ecosystem
          note: Public materials show a broad cobot lineup and integration story
        - id: financing
          label: Financing signal
          value: Series D on 2026-03-25; $142M total raised
          note: Recent capital access supports continued relevance
        - id: legal
          label: Legal overhang
          value: German injunction followed by undisclosed settlement
          note: Public case ended, but economic and channel effects remain unclear
        - id: economics
          label: Missing underwriting inputs
          value: No public revenue, margin, retention, or preference detail
          note: Public evidence cannot anchor price confidence
        - id: call
          label: Recommendation
          value: research-more / unknown valuation
          note: Track closely, but require private diligence or a cheaper entry
      edges:
        - from: scale
          to: product
          label: supports
        - from: product
          to: financing
          label: helps explain
        - from: financing
          to: legal
          label: offset by
        - from: legal
          to: economics
          label: amplifies
        - from: economics
          to: call
          label: drives
    approximationNotes: >-
      Figure is qualitative because the source pool lacks disclosed financial metrics required for a numeric valuation
      bridge.
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
