              Public traction proxies are directionally strong but not audit-ready. The Robot Report archive points to a
              $27M Series B in 2021, and DBR77 later said over 20,000 units across more than 50 countries; an ELITE
              ROBOTS page still showed 200+ employees, about 60 R&D personnel, $4620K of R&D expense, and 5000Pcs of
