      - number: '3.3'
        title: Durability is pressured by incumbent trust, weak price transparency, and adjacent entrants
        blocks:
          - type: paragraph
            body: >-
              The main durability risk is that Elite's public advantage is easier to describe than to verify
              independently. The assigned pool does not disclose list pricing, realized discounts, or win-rate data, so
              cost-performance remains a claim rather than a benchmarked fact. Incumbent pressure also extends beyond
              features: The Robot Report records an April 2026 German injunction in Teradyne's software-copying dispute
              with Elite, followed by an October 2026 settlement with undisclosed terms. The settlement ends that case
              but does not reveal its economics or erase the trust and channel implications of an incumbent's
              willingness to litigate. Finally, if Elite pushes its Centaur-G1 mobile-manipulation program, the adjacent
              rival set broadens to newer mobile or dual-arm platforms such as Techman, DexForce, and Aeolus, where the
              current evidence is too thin to call Elite a clear winner.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
