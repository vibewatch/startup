  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Elite Robots is selling collaborative robot arms and adjacent automation cells, not a standalone software
              product. Across its current product page, older EC catalogs, and homepage copy, the company positions its
              cobots for assembly, machine tending, palletizing, inspection, testing, tightening, welding-adjacent
              workflows, and material handling. The current website frames the flagship line as six CS-series cobots
              covering 3-30 kg payloads and 624-1800 mm reach, while older EC materials show an earlier line built
              around lighter 3 kg, 6 kg, 12 kg, and 16 kg payload classes. That pattern suggests a broadened SKU range
              over time, but the public pool still does not clearly state which legacy EC models remain actively sold
              versus superseded.
            claimRefs:
