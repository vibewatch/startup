              10,000 units in 30-plus countries, while Robotics247 described 10,000 units in more than 40 countries and
              DBR77 later claimed 20,000 units across more than 50 countries. The directional message is commercial
              reach and international expansion; the underwriting gap is that none of these public sources reconcile
