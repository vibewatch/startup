chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports Elite Robots as a private Chinese collaborative robotics company whose
              operating story predates the legal-entity record visible in the pool. Max Robotics describes Elite as a
              Shanghai-headquartered cobot producer founded in 2016 by engineers from Beihang University's Robotics
              Institute, while Accio identifies the legal entity Suzhou Elite Robot Co., Ltd. as established on
              2018-02-07 and still active. The same evidence set points to a company that sells six cobots across a
              broad payload and reach range and that presents itself as an automation-solutions provider rather than a
              single-product vendor. Geography is directionally clearer than exact corporate structure: independent
              coverage points to branches in the United States, Japan, and Germany, while company materials cite
              additional reach through distributors, partners, and deployments across dozens of countries. What remains
              less clear is the exact current headquarters and operating footprint split between Shanghai, Suzhou, and
              Zhengzhou, which later diligence should verify against corporate-registration, branch-registration, and
              investor documents.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO011
              - CO014
