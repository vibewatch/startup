      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              Elite's public architecture story is integration-heavy. The homepage says its cobots can be equipped with
              end-effectors, vision sensors, force-control sensors, and AGVs to form composite robots, while the current
              product page adds third-party platform compatibility, Web UI remote control, and graphical programming.
              The CS-series brochure goes further by describing modular software, open low-level motion interfaces,
              dense I/O, and support for Profinet, EtherNet/IP, and Modbus RTU/TCP. Taken together, the product looks
              oriented toward integrators and manufacturing engineers who need a configurable arm plus cell-level
              peripherals, not a vertically closed appliance. What remains missing is an independently validated view of
              SDK adoption, release cadence, or field integration quality.
            claimRefs:
              - CE004
              - CE005
              - CE006
