      - number: '2.3'
        title: Adoption drivers, adoption friction, and valuation implications
        blocks:
          - type: paragraph
            body: >-
              Elite's adoption story is strongest where plants need low-cost automation that can be deployed without the
              overhead of traditional industrial robotics. The retained sources repeatedly point to labor pressure,
              production-line switching, uptime, safety, and integrator flexibility as the core drivers, with product
              claims emphasizing fast redeployment, open interfaces, industrial protocols, and cost-performance. Those
              same sources also show why valuation should not simply capitalize a generic cobot narrative. First,
              application economics remain quote- and cell-specific, especially in welding and other higher-liability
              use cases where published arm specs do not prove full-system fit. Second, the live legal record in Germany
              and the later undisclosed settlement show that IP and channel-continuity risk can interrupt adoption in
              Europe. Third, the public pool still lacks independent market-value benchmarks, budget-owner disclosure,
              and reconciled deployment metrics, so the market case is credible but materially under-instrumented for
              precision valuation work.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans OEMs, packaged cells, and integrators
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a competitive landscape defined by route-to-solution more than by one
              named rival list. Elite is selling stand-alone collaborative arms, but it is also presenting palletizing,
              welding, and partner-led automation packages, which means buyers can compare Elite against other arm
              vendors, branded workcell offers, system integrators, and internal build decisions for the same job. In
              robotic welding specifically, the reviewed StreetInsider comparison names FANUC CRX, Miller Electric
              Copilot, Fronius CWC formats, and integrators as realistic alternatives. That makes competitive scope
              ownership a first-order buying criterion: the buyer is not only asking whose arm is better, but also who
              owns fixtures, commissioning, safety engineering, and after-sales support.
