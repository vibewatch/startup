      - number: '5.3'
        title: Differentiation, safety, and maturity
        blocks:
          - type: paragraph
            body: >-
              The concrete differentiation that is publicly documented is mostly mechanical and deployment-oriented:
              broad payload and reach coverage, no-fence collaborative positioning, drag-teach workflows, a claimed
              100k-hour MTBF, and compatibility with partner-built cells for inspection, metrology, and finishing tasks.
              Elite also claims 18 safety functions and alignment with ISO 10218, ISO 13849-1 Cat3 PLd, and ISO/TS
              15066, plus collision-detection settings and remote Web UI operation. Those claims may be commercially
              meaningful, but in this pool they are still largely self-attested. There is no independent certificate
              pack, public status page, or practitioner/developer signal to show whether field reliability, support
              responsiveness, and controller maturity match the marketing narrative.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
              - CE013
      - number: '5.4'
        title: Adverse technology risk
        blocks:
          - type: paragraph
            body: >-
              The clearest product-tech downside is software and IP risk. In April 2026, Teradyne Robotics said the
              Hamburg Regional Court issued a preliminary injunction against Elite Robots Germany over allegedly
              infringing Universal Robots software and products containing it in Germany. In October 2026, The Robot
              Report said the companies settled by mutual agreement, but neither side disclosed the terms or whether
              Elite had to change software, products, licenses, distributor behavior, or customer remediation. That
              means the dispute is no longer active in public, but the operational consequences for Elite's software
              stack, European channel, and product roadmap still remain opaque and should be diligenced directly with
              the company.
            claimRefs:
              - CE010
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real product breadth is documented
            body: >-
              Unlike a concept-stage automation startup, Elite has multiple publicly documented cobot families, concrete
              payload/reach envelopes, and visible integration patterns.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Software lineage remains the sharpest technical risk
            body: >-
              The 2026 injunction and later settlement closed the public dispute, but not the diligence question of
              whether any software, licensing, or channel changes were required.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
          - type: callout
            title: Public proof is richer on specs than on field performance
            body: >-
              The assigned pool says much more about payload, reach, and interfaces than about uptime, failure modes,
              developer adoption, or independently verified certifications.
            calloutType: insight
            claimRefs:
