  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Elite is actually selling
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a market definition built around collaborative robot deployments inside
              manufacturing plants rather than all industrial automation spend. Across Elite's official surfaces,
              mirrored product catalogs, and the retained welding buyer guide, the recurring scope is the robot arm,
              controller, pendant/software layer, and application-specific peripherals such as vision, force sensing,
              end effectors, AGVs, or modular workstations. That matters because Elite is not consistently evidenced
              here as a turnkey-cell prime contractor: the same "system" language can describe anything from an arm plus
              welding package to a more integrated cell, so included spend varies by quote and integrator scope. The
              practical market boundary is therefore collaborative manufacturing workflows where safe, easy-to-program,
              redeployable six-axis cobots can replace or augment manual handling, inspection, machine tending, welding,
              and palletizing tasks, while full greenfield line redesign, plant software integration, and other
              bespoke-engineering spend should be treated as adjacent rather than automatically captured.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain an independent TAM/SAM/SOM model for collaborative robotics, so sizing
              has to stay evidence-constrained. The usable public lenses are product-envelope breadth, deployment
              footprint claims, geographic reach claims, and production-capacity statements. Those lenses are
              directionally useful but not cleanly reconcilable: independent and company-linked sources disagree on
              whether Elite has nearly 10,000 cobots deployed, more than 10,000 units in 30-plus countries, or more than
              20,000 units across 50-plus countries, while a brochure separately claims 10,000 units of annual
              production scale. The safe read is that Elite has moved beyond pilot-stage volumes and is targeting a
              broad manufacturing workflow market, but the precise installed base and served geography remain uncertain.
              Buyer segmentation is clearer than top-down market value: electronics, automotive, packaging/logistics,
              metal processing, inspection, welding, and palletizing recur across the product materials, but public
              sources still stop short of naming the ultimate budget owner or isolating a clean SAM by geography and
              channel.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
