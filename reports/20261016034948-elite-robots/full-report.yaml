      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The capital-marking evidence is thin. Robo2u listed a $1.2B valuation as of March 2026 and also flagged
              that Elite was sued by Teradyne in 2026, which introduces potential legal-cost and channel-disruption
              overhang. But the assigned public pack does not disclose revenue or ARR, gross margin, cash, burn, runway,
              debt, or financing terms. That leaves the core underwriting questions unresolved: whether solution revenue
              carries acceptable service burden, whether manufacturing scale consumes working capital faster than
              collections, and how much room exists before another fundraise. The financial verdict is therefore
              qualitative only: Elite appears capable of monetizing hardware plus engineered automation projects, but
              revenue quality, margin path, and financing dependency remain diligence blockers.
