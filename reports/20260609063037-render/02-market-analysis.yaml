callouts:
  - calloutType: strength
    title: AI-Native Workloads Create a More Valuable Wedge Than Generic Hosting
    body: >-
      The most attractive part of Render's market is not generic web hosting but the subset of teams
      that need long-running, stateful, multi-service application infrastructure for AI-native
      products. Those workloads care about timeouts, private networking, background work, and
      predictable internal traffic costs in ways that brochure sites and lightweight serverless apps
      often do not.
    claimRefs:
      - CM003
      - CM017
      - CM021
      - CM023
      - CM026

  - calloutType: risk
    title: Free-Tier Competition and Hyperscaler Defaults Cap Obtainable Share
    body: >-
      Render's core buyer base is attractive but price-sensitive, and many adjacent workloads can
      stay on Vercel, Netlify, Supabase, Cloud Run, App Runner, or legacy PaaS. That means Render's
      real constraint is not whether the cloud market is large, but whether it can displace existing
      defaults once a team has already committed to another workflow or procurement ecosystem.
    claimRefs:
      - CM030
      - CM031
      - CM033
      - CM038
      - CM039
      - CM040

