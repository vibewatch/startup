  - id: contradictions-gaps
    title: Contradictory Estimates and Explicit Diligence Gaps
    body: |
      The fetched evidence supports a strong market thesis but not false precision. The accessible
      PaaS reports disagree on current market size and growth rate, so a range is more credible
      than a point estimate. More importantly, none of the fetched independent sources cleanly
      isolates the developer-centric deployment-cloud subsegment that Render actually competes in.
      They are useful directional inputs, not directly investable Render TAMs. The AI-native hosting
      wedge is even less directly measured: it shows up as part of broader AI spend, cloud spend,
      or generic PaaS growth rather than as its own audited market.

      Render-specific SAM and SOM remain the largest diligence gap. No fetched source independently
      discloses Render's paying-customer count, conversion from free to paid, segment mix by team
      size, or win rates in enterprise security reviews. The company-authored AI and free-tier
      articles are useful for identifying which workloads Render is trying to own, but they are not
      market-share evidence. For valuation work, the practical implication is to carry multiple
      sizing lenses, haircut Render-relevant TAM aggressively versus broad PaaS reports, and treat
      AI-native hosting as a genuine upside wedge that still needs sharper third-party measurement in
      a later refresh.
    claimRefs:
      - CM041
      - CM042
      - CM043
      - CM044

