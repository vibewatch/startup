  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: |
      Render's buyer map splits into at least five meaningful segments. Solo developers and small
      project owners are the fastest-moving cohort because buyer, user, and payer collapse into one
      person; adoption rises or falls on free-tier quality, Git-based deploy speed, and whether a
      full-stack prototype can go live without a credit card. Startup engineering teams are the
      next step up: founders, CTOs, or engineering leads usually own budget, while developers are
      the users and the company card is the payer. Their trigger is reduced DevOps burden — faster
      deployment, managed Postgres, workers, and fewer infrastructure decisions.

      Growth-stage SaaS teams and AI-native product teams add more operational complexity. They care
      less about the first deploy and more about preview environments, predictable pricing,
      long-running jobs, private networking, and stateful multi-service reliability. Enterprise
      platform and security teams introduce procurement, compliance, and governance stakeholders,
      lengthening cycles but raising contract value if Render qualifies. Two adjacent segments are
      only partly addressable: frontend-first teams can stay with Vercel or Netlify for static or
      lightweight workloads, while database-first builders can anchor on Supabase and choose app
      hosting separately. That segmentation is why Render's real market is neither a single SMB
      developer bucket nor a uniform enterprise cloud market.
    claimRefs:
      - CM019
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004

  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: |
      The strongest growth driver is the rise of AI-enabled software creation. Gartner's 2026 AI
      spending forecast and the 2025 Stack Overflow survey both suggest more developers are using
      AI tools while enterprises keep allocating budget to AI-ready infrastructure. That demand does
      not guarantee Render wins it, but it expands the pool of teams needing stateful backends,
      streaming, background work, and lower-ops deployment choices. Additional drivers include the
      persistence of free or near-free onboarding across the category, dissatisfaction with older
      PaaS economics, and growing aversion to stitching multiple infrastructure products together by
      hand.

      Constraints are equally clear. Hyperscaler inertia is real: many companies default to AWS or
      GCP-managed services for procurement, compliance, or standardization reasons. Migration is not
      trivial once runtime, data, CI/CD, networking, and team routines are embedded elsewhere.
      Compliance and governance raise friction in larger accounts. Price sensitivity is acute in the
      core developer and startup segment because substitutes anchor expectations with free tiers,
      usage-based pricing, or $5–$20 starter plans. And several incumbents hold strong positions in
      slices of the workload map: Vercel and Netlify in frontend/serverless, Supabase in
      database-first backends, Cloud Run and App Runner in hyperscaler-managed container hosting,
      and Fly.io or Railway for teams that want different control-versus-simplicity trade-offs.
    claimRefs:
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
