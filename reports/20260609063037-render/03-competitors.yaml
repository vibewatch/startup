  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: frontend-distribution-power
    missingEvidence: Public customer-count or revenue-share data that isolates how often Vercel and Netlify displace Render
      in the same buyer segment is missing.
    whyItMatters: Without segment-specific demand data, distribution-power comparisons rely on product surfaces and mindshare
      cues more than closed-won share evidence.
    diligencePath: Ask management for win-loss data by workload type and request channel or inbound attribution split versus
      frontend-first rivals.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: render-customer-defections
    missingEvidence: No public cohort data or case-study corpus in the fetched evidence quantifies customers leaving Render
      for Railway, Fly.io, Vercel, or Netlify.
    whyItMatters: Churn toward named rivals is a direct test of competitive pressure; without it, displacement risk stays
      directional rather than measured.
    diligencePath: Request customer churn reasons, competitor mentions in support tickets, and anonymized migration counts
      from management or channel partners.
    relatedQuestionRefs:
    - QP026
  - type: missing-source
    severity: minor
    topic: multi-homing-rate
    missingEvidence: No public survey or benchmark in the retained corpus quantifies what share of Render production customers
      multi-home across comparable PaaS tools.
    whyItMatters: Estimated switching cost is materially stronger if production multi-homing is rare and materially weaker
      if teams regularly split environments across multiple hosts.
    diligencePath: Run a customer survey or request cohort retention and cross-platform deployment data broken down by static,
      API, and stateful workload types.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP004
