- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Entry offer
  - Billing model
  - Free-tier or minimum
  - Implication for Render overlap
  rows:
  - - Render
    - Free prototype path plus managed paid services
    - Mixed managed-service pricing
    - Free web services can spin down; free Postgres expires; 750 free instance hours monthly
    - Useful for prototypes, but persistent production usage pushes paid adoption
  - - Railway
    - Free trial then credit-based entry
    - Usage-based
    - $1 monthly credits after initial trial; $5 Hobby minimum; $20 Pro minimum
    - Strong challenge for early full-stack teams and bursty workloads
  - - Fly.io
    - Paid resource consumption
    - Usage-based VM and service billing
    - No real free tier for new users in Render's 2026 comparison; billed by resources in Fly docs
    - Pressures Render on control-oriented buyers, not on simplicity-first buyers
  - - Heroku
    - Paid dynos and managed data services
    - Plan-based services
    - No visible free entry on the cited pricing page
    - Competes more on incumbent familiarity than on low-end price
  - - Vercel
    - Hobby then Pro
    - Seat plus usage-based web/compute model
    - Hobby free forever; Pro at $20 per month plus usage
    - Threat is strongest for frontend teams that can tolerate usage-sensitive economics
  - - Netlify
    - Free then credit-based growth path
    - Credit and feature tiering
    - Free plan includes 300 credits; higher plans expand credits and features
    - Good alternative for web teams, weaker bundled answer for stateful apps
  - - Cloud Run
    - Free request allowance
    - Managed container usage billing
    - Two million free requests per month
    - Strong substitute for stateless or bounded-duration services, less turnkey than Render
