slug: render
runDate: '2026-06-09'
company:
  name: Render
chapter:
  number: 8
  title: Valuation
  summary: 'Render’s February 2026 $1.5 billion post-money valuation is credible as a financing reference but not fully underwritten by public evidence because monetization, margin, retention, and financing-term disclosures remain sparse. Relative to private developer-cloud rounds and public cloud-platform benchmarks, the current mark looks best described as stretched but defensible only conditionally; recommendation: research-more, medium confidence, high risk.'
sections:
- id: financing-context-entry-discipline
  title: Financing context and entry discipline
  body: 'Render’s public valuation anchor is straightforward but incomplete. The company announced a $100 million Series C extension in February 2026 at a $1.5 billion post-money valuation, bringing total disclosed funding to $258 million and adding Georgian alongside existing investors including Addition, Bessemer, General Catalyst, and 01A. Historical public reporting shows a $50 million Series B in 2023, while Tracxn’s 2025 profile still listed only $157 million raised before the extension. SEC Form D evidence confirms that Render has long relied on outside capital, but it does not illuminate the economics of the latest round. Entry discipline therefore has to separate price discovery from value discovery: the round proves sophisticated investors were willing to pay $1.5 billion, but the public record still omits the revenue base, gross margin, retention profile, burn, and financing terms needed to decide whether that price is conservative or aggressive for a new investor. On public evidence
    alone, the right posture is to treat $1.5 billion as a real financing reference and not as a completed underwriting conclusion.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
