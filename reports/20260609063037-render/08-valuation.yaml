- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation range
  - Return logic vs $1.5B mark
  - Probability signal
  rows:
  - - Bull
    - Developer growth converts into enterprise monetization, owned-server rollout improves margins, and AI-native demand stays hot.
    - $2.5B-$4.0B
    - 1.7x-2.7x upside requires nine-figure revenue and premium growth comp treatment.
    - 'Low-to-medium: public signals are encouraging, but proof is missing.'
  - - Base
    - Growth stays strong, monetization proves healthy enough, and diligence mostly confirms current narrative without major positive surprises.
    - $1.2B-$1.8B
    - Roughly flat to modest upside; current round already captures much of the available public upside case.
    - 'Medium: most consistent with public evidence today.'
  - - Bear
    - Revenue quality disappoints, AI demand cools, pricing pressure rises, or reliability/support issues weigh on conversion and retention.
    - $0.75B-$1.1B
    - 0.5x-0.7x downside from the current mark, consistent with a flat or down-round reset.
    - 'Medium: not remote because the missing metrics are exactly the metrics that determine downside protection.'
  notes: Ranges are scenario-based valuation bands for IC discussion, not DCF outputs or management guidance. They are anchored to the public evidence gap as much as to the business opportunity.
