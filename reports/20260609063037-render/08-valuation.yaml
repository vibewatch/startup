- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Sample of public and private developer-cloud comparables with disclosed valuation references as of June 2026; excludes undisclosed private peers and hyperscalers because the population is open-ended and disclosure is uneven.
  columns:
  - Comparable
  - Status
  - Valuation metric
  - Current valuation / multiple
  - Why it matters
  - Main limitation
  rows:
  - - Render (subject)
    - Private
    - Post-money round value
    - $1.5B
    - Anchor price under review.
    - No public revenue or margin base disclosed.
  - - Railway
    - Private
    - Series B valuation
    - $1.0B
    - Closest disclosed 2026 private developer-cloud round.
    - No public revenue or margin disclosure for multiple work.
  - - Fly.io
    - Private
    - Reported 2023 valuation / 2024 revenue
    - $397M valuation; $11.2M revenue
    - Useful lower-scale developer-cloud checkpoint.
    - GetLatka data is secondary and lower-confidence.
  - - Vercel
    - Private
    - Series F valuation
    - $9.3B
    - Shows the upper bound for developer-cloud platform ambition and AI narrative strength.
    - Larger scale, stronger brand, and likely different enterprise mix.
  - - Fastly
    - Public
    - Market cap / revenue
    - $3.03B; ~4.7x revenue
    - Nearest smaller public cloud infrastructure benchmark by absolute valuation.
    - Edge/CDN mix differs from Render’s platform model.
  - - DigitalOcean
    - Public
    - Market cap / revenue
    - $17.67B; ~18.8x revenue
    - Developer-cloud and AI-native framing make it a useful public reference.
    - Much more disclosed, more mature, and broader infrastructure stack.
  - - Cloudflare
    - Public
    - Market cap / revenue
    - $87.58B; ~40.5x revenue
    - Shows how much premium public investors pay for elite growth plus clear disclosure.
    - Far larger, more diversified, and not a close product twin.
  notes: Comparable rows mix private rounds and public market caps deliberately because Render is private and opaque. The table is a bracketing device, not a clean apples-to-apples multiple set.
