- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current call
  - Why it lands here
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Real adoption and growth signals exist, but disclosed economics are too thin for a conviction buy at $1.5B.
    - Continue diligence; do not rely on headline valuation alone.
  - - Confidence
    - Medium
    - The direction of product-market fit is credible, but the missing metrics are central rather than peripheral.
    - Underwrite only after management KPI review.
  - - Risk rating
    - High
    - Competition, execution on owned servers, and mixed support/reliability evidence could compress the multiple.
    - Require explicit downside plan and thesis-break triggers.
  - - Valuation stance
    - Stretched
    - Public evidence supports the last round as a reference point, not an obvious discount to intrinsic value.
    - Do not assume immediate mark-up potential.
  - - Entry discipline
    - Only at proof or price advantage
    - Need private proof of revenue, margin, retention, and terms to justify the same or higher effective entry.
    - Ask for data room access or wait for a better entry.
  notes: This table translates public evidence into an IC posture; it is not a substitute for private diligence on monetization and financing terms.
