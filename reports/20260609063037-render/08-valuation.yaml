  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: monetization-disclosure
    missingEvidence: Current ARR or revenue run rate, gross margin, contribution margin, paid conversion, NRR, and churn disclosures.
    whyItMatters: Without monetization depth, the $1.5B mark cannot be translated into a supportable public-style multiple or downside case with confidence.
    diligencePath: Request current management KPI deck or data-room metrics showing monthly recurring revenue, gross margin by workload, and retention cohorts.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: Share price, liquidation preference, participation rights, anti-dilution provisions, board rights, and any secondary or tender allocation for the extension round.
    whyItMatters: Preference-stack and secondary mechanics determine true downside protection and whether the headline post-money valuation overstates common-equity economics.
    diligencePath: Request the latest cap table, term sheet, and financing documents under NDA from company counsel or lead investors.
    relatedQuestionRefs:
    - QV020
  - type: private-evidence-only
    severity: material
    topic: owned-server-unit-economics
    missingEvidence: Capital intensity, utilization targets, supply chain terms, depreciation policy, and payback metrics for any owned-server deployment.
    whyItMatters: Owned infrastructure could either expand gross margin or create a hidden capex burden that reduces the attractiveness of the current valuation.
    diligencePath: Ask management for owned-versus-hyperscaler workload mix, deployment schedule, capex budget, and gross-margin bridge by hosting model.
    relatedQuestionRefs:
    - QV011
    - QV024
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-boundary
    missingEvidence: A fuller set of disclosed private developer-cloud transactions and any strategic M&A references that map closely to Render’s product scope.
    whyItMatters: The comparable table is intentionally a sample because many private peers do not disclose valuation or revenue, so the comp range remains directionally useful but incomplete.
    diligencePath: Expand the comp screen with paid databases, banker books, and private financing materials once NDAs permit.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audited multi-year financial statements, cohort disclosures, governance detail, and evidence of banker or IPO-preparation workstreams.
    whyItMatters: Exit readiness determines whether upside should be benchmarked to future public-market comparables or treated as a private round hold scenario.
    diligencePath: Request audited financial packages, board materials on financing or IPO readiness, and any external advisor mandates.
    relatedQuestionRefs:
    - QV027
