- id: comparable-benchmarking-and-exit
  title: Comparable benchmarking and exit readiness
  body: 'The comparable set is useful as a bracket, not as a direct valuation formula. Among private peers, Render’s $1.5 billion mark sits above Railway’s newly disclosed $1.0 billion round and far above Fly.io’s last reported $397 million valuation, but well below Vercel’s $9.3 billion 2025 Series F. Among public peers, Render sits below Fastly’s roughly $3.0 billion market cap and far below DigitalOcean and Cloudflare, which trade at much larger absolute valuations and disclose the revenue needed to calculate current public multiples. Those public numbers show just how much disclosure quality matters: DigitalOcean, Cloudflare, and Fastly provide enough transparency to frame current market-cap-to-revenue ratios, while Render does not. That makes any public comp mapping necessarily conditional. Exit readiness is similar. Render may ultimately have an IPO or strategic-sale path, but public evidence does not yet show the breadth of audited metrics, cohort detail, governance disclosure, or
    banker-readiness that public-cloud investors usually expect. Today’s comp work therefore supports the range of outcomes, but not a clear claim that the company is ready for a public-market style premium.'
