- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Current evidence
  - Counterpoint
  - What would change the view
  rows:
  - - AI-native demand tailwind
    - Gartner projects 2026 AI spending at $2.59T and says infrastructure is >45% of that total.
    - Macro demand does not prove Render captures the spend efficiently.
    - Show enterprise AI revenue mix and workload-level monetization.
  - - Developer adoption
    - Render claims 4.5M+ developers and 250k+ monthly joins.
    - Adoption does not reveal paid conversion, seat depth, or customer concentration.
    - Disclose paid accounts, expansion metrics, and retention cohorts.
  - - Financing support
    - The extension was led by Georgian with strong insider participation.
    - A sophisticated syndicate validates the round, not necessarily a forward return at the same price.
    - Provide share price, terms, and any secondary/tender mechanics.
  - - Market structure
    - Multiple PaaS studies indicate a large, still-growing market.
    - The size estimates vary widely, so TAM alone is not a valuation proof point.
    - Show share gains in the subsegments Render actually serves.
  - - Competition
    - Private and public developer-cloud peers prove the category has real value creation.
    - They also show capital intensity and intense competition for the same workloads.
    - Demonstrate durable differentiation, especially beyond SMB and hobbyist usage.
  - - Operational quality
    - Render is currently operational and has real platform traction.
    - Trustpilot complaints and recent incidents argue against giving a premium to perceived reliability or support quality.
    - Show incident rate trend, SLA performance, and churn attributable to support issues.
  notes: 'The thesis and anti-thesis are intentionally price-sensitive: the same company can be attractive at one price and stretched at another.'
