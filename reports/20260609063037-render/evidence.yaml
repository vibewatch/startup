evidenceGaps:
  - type: missing-source
    severity: material
    topic: billing-complaint-denominator
    missingEvidence: >-
      Support SLA performance, ticket-resolution rates, NPS or CSAT by paid tier, and dispute-rate data for billing
      incidents.
    whyItMatters: >-
      Trustpilot shows real friction, but the review sample is self-selected and does not reveal whether billing or
      support issues are isolated edge cases or broader cohort problems.
    diligencePath: >-
      Request support operations dashboards, billing dispute rates, refund statistics, and cohort-level churn by plan
      tier from management.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: owned-server-mix
    missingEvidence: >-
      Percentage of workloads, regions, or spend already running on Render-owned servers versus AWS and GCP, plus the
      capex and gross-margin impact.
    whyItMatters: >-
      The own-server strategy could materially improve unit economics and control, but it could also introduce capacity
      and execution risk that is impossible to size from current public evidence.
    diligencePath: >-
      Ask for infrastructure cost by provider, owned-hardware utilization, deployment footprint by region, and forward
      capex plans.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: paying-customer-count
    missingEvidence: >-
      Current paying-workspace count, enterprise customer count, revenue concentration, and conversion rates from
      developer signups to paying organizations.
    whyItMatters: >-
      Developer signups are strong top-of-funnel evidence, but valuation quality depends on monetized customers,
      concentration, and retention rather than raw platform users alone.
    diligencePath: >-
      Request customer-count bridges by plan, ARR buckets, top-20 customer revenue concentration, and net retention by
      cohort.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount-precision
    missingEvidence: Exact June 2026 headcount and functional mix across engineering, infrastructure, go-to-market, support, and G&A.
    whyItMatters: >-
      CNBC only gives an approximate employee count while Tracxn lags at an older figure, so operating leverage and
      hiring burn cannot be evaluated cleanly from public data.
    diligencePath: >-
      Request a current org chart, payroll summary, hiring plan, and year-end headcount bridge from December 2024 to
      June 2026.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board-completeness
    missingEvidence: >-
      Full current board roster, board observers, committee structure, and complete executive roster beyond founder-CEO
      Anurag Goel, plus investor ownership by stake.
    whyItMatters: >-
      A founder-led private company can still have complex governance terms, protective provisions, or concentrated
      ownership that materially affect control and exit outcomes.
    diligencePath: Request a board list, cap table, financing documents, and current leadership directory from management or counsel.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: paying-customer-segmentation
    missingEvidence: Independent disclosure of Render's paying-customer count, segment mix, and free-to-paid conversion by cohort.
    whyItMatters: Without conversion and mix data, Render-specific SAM/SOM remains estimated and valuation sensitivity stays wide.
    diligencePath: >-
      Request internal cohort dashboards, board materials, or investor updates that split active paid customers by solo,
      startup, growth, enterprise, and AI-native segments.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: ai-native-hosting-share
    missingEvidence: >-
      A third-party dataset that isolates the AI-native application-hosting wedge from broader PaaS or public cloud
      categories.
    whyItMatters: >-
      The AI wedge likely carries higher growth and pricing power, but its size cannot be measured precisely from
      fetched public data.
    diligencePath: >-
      Find or commission analyst work scoped specifically to AI application orchestration, long-running inference
      backends, and agent infrastructure rather than generic cloud or PaaS.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-procurement-friction
    missingEvidence: >-
      Enterprise win/loss reasons split between product gaps, security review, compliance, procurement timing, and
      hyperscaler standardization.
    whyItMatters: >-
      Enterprise upside is meaningful, but without win/loss data it is impossible to know whether governance is a
      feature advantage or a sales bottleneck.
    diligencePath: >-
      Review CRM opportunity notes, security-review conversion metrics, and sales pipeline loss codes for regulated and
      enterprise accounts.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: material
    topic: deployment-cloud-segmentation
    missingEvidence: A repeatable external methodology that isolates developer-centric deployment cloud from the broader PaaS bundle.
    whyItMatters: >-
      Future refreshes need a market yardstick narrower than generic PaaS and less speculative than author
      shrink-factors.
    diligencePath: >-
      Identify analyst taxonomies or public-company segment disclosures that separate app deployment/runtime spend from
      integration, analytics, and middleware layers.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: free-tier-and-pricing-benchmarks
    missingEvidence: >-
      Time-series tracking for free-tier limits, starter pricing, and platform packaging changes across Render and its
      closest substitutes.
    whyItMatters: >-
      Starter pricing and free-tier rules change frequently and can meaningfully shift obtainable share in the core
      developer segment.
    diligencePath: >-
      Refresh the pricing matrix quarterly and archive change logs or pricing snapshots for Render, Railway, Fly.io,
      Heroku, Vercel, Netlify, Supabase, Cloud Run, and DigitalOcean.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: frontend-distribution-power
    missingEvidence: >-
      Public customer-count or revenue-share data that isolates how often Vercel and Netlify displace Render in the same
      buyer segment is missing.
    whyItMatters: >-
      Without segment-specific demand data, distribution-power comparisons rely on product surfaces and mindshare cues
      more than closed-won share evidence.
    diligencePath: >-
      Ask management for win-loss data by workload type and request channel or inbound attribution split versus
      frontend-first rivals.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: render-customer-defections
    missingEvidence: >-
      No public cohort data or case-study corpus in the fetched evidence quantifies customers leaving Render for
      Railway, Fly.io, Vercel, or Netlify.
    whyItMatters: >-
      Churn toward named rivals is a direct test of competitive pressure; without it, displacement risk stays
      directional rather than measured.
    diligencePath: >-
      Request customer churn reasons, competitor mentions in support tickets, and anonymized migration counts from
      management or channel partners.
    relatedQuestionRefs:
      - QP026
  - type: missing-source
    severity: minor
    topic: multi-homing-rate
    missingEvidence: >-
      No public survey or benchmark in the retained corpus quantifies what share of Render production customers
      multi-home across comparable PaaS tools.
    whyItMatters: >-
      Estimated switching cost is materially stronger if production multi-homing is rare and materially weaker if teams
      regularly split environments across multiple hosts.
    diligencePath: >-
      Run a customer survey or request cohort retention and cross-platform deployment data broken down by static, API,
      and stateful workload types.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Absolute revenue, ARR, and monthly revenue by product family and customer segment.
    whyItMatters: >-
      Without a revenue base and mix, it is impossible to underwrite growth quality, concentration, or valuation
      multiples.
    diligencePath: >-
      Request board materials or finance-pack revenue bridges with monthly recurring, usage, and enterprise revenue
      split.
