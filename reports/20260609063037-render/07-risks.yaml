  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-sla
    missingEvidence: A customer-facing Render SLA, service-credit policy, or equivalent uptime-remedy document in the public corpus.
    whyItMatters: Enterprise buyers compare formal reliability commitments, not only status dashboards and certifications.
    diligencePath: Request Render's standard SLA, uptime-credit language, and support SLO commitments used in enterprise contracts.
    relatedQuestionRefs:
    - QR011
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: owned-server-mix
    missingEvidence: Current share of workload on owned servers versus AWS and GCP, associated capex, procurement lead times, and incident rates.
    whyItMatters: The main strategic margin lever is also a major execution risk, and public reporting does not quantify current exposure.
    diligencePath: Request infra mix by workload, capex plan, vendor contracts, utilization targets, and reliability data segmented by substrate.
    relatedQuestionRefs:
    - QR015
    - QR030
    relatedTableRefs:
    - TR003
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: support-operations
    missingEvidence: Support staffing, ticket backlog, first-response and resolution SLOs, and the share of churn or disputes tied to support or billing.
    whyItMatters: Independent complaints point to trust friction, but public sources do not quantify whether this is edge noise or a conversion limiter.
    diligencePath: Request support org chart, ticket metrics, complaint taxonomy, refund data, and enterprise support package terms.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: ai-revenue-concentration
    missingEvidence: Revenue mix, retention, and gross margin for AI-native customers versus broader application-hosting customers.
    whyItMatters: The valuation story leans heavily on AI-native demand, but public sources do not show whether that demand is durable, diversified, or profitable.
    diligencePath: Request customer segmentation, cohort retention, expansion, and margin by AI-native versus non-AI workload classes.
    relatedQuestionRefs:
    - QR017
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
