  title: Risks
summary: 'Render''s highest residual risks are operational and model-driven rather than existential regulatory bans: the company still depends on AWS and GCP while simultaneously testing owned servers, recent public incident history shows recurring control-plane and partner issues, and support or billing friction remains visible in independent reviews without a surfaced public SLA. Compliance posture is meaningfully better than the complaint narrative implies—Render markets SOC 2 Type 2, ISO 27001, DPF coverage, HIPAA-ready or HIPAA-enabled options, and dashboard-accessible compliance documents—but enterprise conversion and valuation still depend on converting those controls into lower incident frequency, stronger procurement trust, and durable demand for AI-native workloads in the face of explicit-SLA competition.'
sections:
- id: severity-ranked-risk-overview
  title: Severity-Ranked Risk Overview
  body: 'Render''s risk stack is led by three severity-one items. First, operational reliability is good enough to show real resilience but not good enough to remove concern: the public status page still shows meaningful variance by component and region, including Singapore at 99.57% uptime over the displayed 90-day window, and recent incidents affected logs, metrics, GitHub connections, verification emails, custom domains, and Oregon Postgres connectivity. Second, infrastructure dependence is becoming more complex rather than simpler. CNBC says Render still runs on AWS and Google Cloud Platform, while also testing its own servers to reduce costs and prices; that creates a dual risk where the company remains exposed to hyperscaler incidents today while taking on hardware capacity and execution risk tomorrow. Third, the business model is increasingly tied to AI-native demand and enterprise procurement outcomes. Gartner still expects AI spending to surge in 2026, but it also warns that spending
    remains infrastructure-led and that enterprises have not yet broadly proven AI value. The thesis survives if Render keeps incident cadence contained, converts compliance and reliability investments into enterprise trust, and scales AI-heavy workloads without a support-quality backlash. It breaks if owned-server execution, partner incidents, and AI-demand normalization arrive simultaneously.'
