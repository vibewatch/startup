- id: TR005
  title: Mitigation, monitoring indicators, thesis-break triggers, and diligence asks
  columns:
  - risk
  - monitorable indicator
  - threshold or event
  - action implication
  rows:
  - - Operational reliability deterioration
    - Public status / IncidentHub incident count and affected components
    - Two or more customer-facing incidents per month for two consecutive months, or a major-region uptime metric falling below 99.9%
    - Escalate incident-postmortem diligence, require MTTR and error-budget data, and downgrade conviction on enterprise readiness.
  - - Owned-server execution misstep
    - Management disclosure on owned-server rollout, capex, or price changes
    - Evidence that owned-server expansion raises incident frequency, supply bottlenecks, or gross-margin pressure rather than reducing cost
    - Treat as thesis-break risk for the margin-expansion story; request capex, procurement, and capacity models immediately.
  - - Support and billing friction
    - Trust signals, refund disputes, ticket backlog, or plan-migration complaints
    - Visible spike in billing disputes or support complaints during or after the August 2026 workspace migration
    - Request support staffing, first-response SLOs, refund policy data, and churn by complaint cohort.
  - - Enterprise procurement gap
    - Win-loss outcomes against rivals with explicit SLAs or support SLOs
    - Repeated losses where SLA or support commitments are decisive
    - Require standard MSA/SLA package and proof of enterprise procurement improvements before underwriting upmarket expansion.
  - - AI-demand slowdown or price compression
    - Growth mix by AI-native customers and competitive pricing changes
    - AI-heavy revenue share weakens, or growth slows while rivals widen feature parity and price pressure
    - Re-rate valuation assumptions and shift diligence toward non-AI workload durability and retention.
  - - Compliance execution failure
    - Security incident, DPF lapse, or healthcare-procurement setback
    - Material security breach, lapsed certification, or failed healthcare deployment tied to compliance gaps
    - Pause investment thesis pending remediation evidence, third-party audit outputs, and customer-impact assessment.
  notes: Thresholds are intentionally monitorable and tied to diligence actions rather than abstract risk labels.
