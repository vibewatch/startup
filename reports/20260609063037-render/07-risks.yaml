- id: operational-reliability-and-support-risk
  title: Operational Reliability, Incident Response, and Support Risk
  body: 'Operationally, Render presents a mixed but intelligible picture. The positive case is substantial: during the October 2025 AWS us-east-1 outage, Render says active customer services stayed online, partly because it avoided higher-level AWS managed services, kept control-plane operations outside us-east-1, and had already distributed customer load across regions. The same writeup is useful precisely because it is not triumphalist: Render acknowledged improvised interventions, degraded tooling and communications, and the fact that a similar incident in us-west-2 would have been much worse. The public docs on Postgres HA, private networking, background workers, cron jobs, and Workflows show that Render keeps building mitigation primitives, including automatic failover, internal networking, retries, and durable-task orchestration. But those mitigations have limits. HA stays within a region and can lose a few seconds of writes, cron jobs hard-stop after 12 hours, and Workflows remains
    beta or early access rather than fully mature infrastructure. Independent adverse evidence points to the customer-facing side of the same issue: Trustpilot complaints cluster around support responsiveness, billing clarity, and unreliable free-tier wake-ups, suggesting that even when core architecture is strong, operational trust can still erode at the edges.'
