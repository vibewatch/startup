callouts:
  - calloutType: strength
    title: Render is strongest where apps need to stay alive
    body: >-
      The most defensible public product story is not static hosting or low-end hobby deployment. It is Render's combination of always-on services, workers, cron, private networking, managed Postgres/Key Value, and new durable-workflow tooling, which makes the platform materially better suited to full-stack, stateful, WebSocket-heavy, and AI-agent workloads than pure frontend or short-timeout serverless platforms.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE009
      - CE018
      - CE021
      - CE046

  - calloutType: risk
    title: Stateful support exists, but it is not frictionless
    body: >-
      Render's stateful story is real, yet the public docs are explicit about tradeoffs: persistent disks are single-instance and disable zero-downtime deploys, HA Postgres uses asynchronous replication and can lose a few seconds of writes in some failovers, and cron jobs cannot run indefinitely. Those are reasonable engineering choices, but they are still customer-facing product limits that matter in diligence.
    claimRefs:
      - CE005
      - CE011
      - CE013
      - CE049

  - calloutType: risk
    title: Security posture is credible, but enterprise diligence still needs private materials
    body: >-
      Render has enough public evidence to show serious security intent—SOC 2, ISO 27001, HIPAA-ready positioning, DPF coverage, a document center, and public disclosure contacts—but not enough to underwrite a regulated deployment on public evidence alone. SLA terms, recovery objectives, deeper architecture detail, and newer-product governance still require NDA-backed diligence.
    claimRefs:
      - CE029
      - CE030
      - CE031
      - CE032
      - CE033
      - CE050

