  - id: service-map-and-architecture
    title: Service Map and Technical Architecture
    body: >-
      Render's architecture is organized around a few opinionated primitives. Compute services include always-on web services and private services, plus non-ingress workers and scheduled jobs. Same-region resources inside the same workspace communicate over a private network using internal hostnames or internal database/cache URLs instead of public endpoints. Managed data services include Render Postgres and Render Key Value, while persistent disks provide a more flexible but more constrained state layer for single-instance services. Blueprints act as a Git-backed control plane that can declare interconnected services, databases, and environment groups in a single render.yaml file.

      The architecture is strongest where application operators want batteries included but not a serverless-only model. Render Postgres exposes read replicas, extensions such as pgvector and PostGIS, optional high availability, and connection-management tooling. Blueprints support preview-environment generation modes, while GitHub app and coding-agent surfaces extend deployment into PR previews and natural-language operations. The caveat is that Render's stateful primitives are not universal abstractions: cron jobs cannot use disks, workers and cron jobs can send but not receive private-network traffic, and disk-backed services lose both multi-instance scale-out and zero-downtime deploys. Those are acceptable design choices for some teams, but they are still meaningful architecture constraints that diligence should treat as product boundaries rather than footnotes.
