  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-sla
      missingEvidence: Contractual SLA terms, formal RTO and RPO commitments, incident escalation commitments, and service-credit language for enterprise customers.
      whyItMatters: Public status pages and badges do not substitute for contractual uptime and recovery obligations when underwriting mission-critical usage.
      diligencePath: Request enterprise MSA and support addendum, including any service-credit schedule and disaster-recovery commitments.
      relatedQuestionRefs:
        - QE016
        - QE021
      relatedTableRefs:
        - TE004
        - TE006
    - type: private-evidence-only
      severity: material
      topic: security-architecture-depth
      missingEvidence: Detailed public or private architecture materials on tenant isolation, key management, logging retention, backup policy, and HIPAA / BAA operating procedures.
      whyItMatters: Certifications and document-center access indicate seriousness, but they do not reveal whether Render's control implementation fits a regulated buyer's specific threat model.
      diligencePath: Request SOC 2 Type 2 report, ISO 27001 scope statement, security architecture review, BAA workflow, and sample customer security questionnaire responses.
      relatedQuestionRefs:
        - QE019
        - QE020
        - QE021
      relatedTableRefs:
        - TE006
    - type: private-evidence-only
      severity: material
      topic: workflow-and-agent-adoption
      missingEvidence: Adoption counts, reliability metrics, enterprise usage patterns, and GA timing for Workflows, MCP, and coding-agent surfaces.
      whyItMatters: These features are central to Render's AI-native differentiation story, but public evidence today mostly shows launch intent rather than scaled customer proof.
      diligencePath: Request product KPIs for Workflows and MCP, including active workspaces, error rates, attach rates, and roadmap dates.
      relatedQuestionRefs:
        - QE012
        - QE013
        - QE014
        - QE027
      relatedTableRefs:
        - TE001
        - TE004
    - type: private-evidence-only
      severity: material
      topic: workload-mix-and-scale
      missingEvidence: Paying workspace count, module penetration by product line, database counts, and revenue or retention split across web, worker, stateful, and AI-native workloads.
      whyItMatters: The moat case depends on whether customers actually concentrate in Render's strongest full-stack/stateful vectors rather than treating the platform as low-end hosting.
      diligencePath: Request product analytics by service type, ARR by module family, and customer-retention cohorts segmented by workload class.
      relatedQuestionRefs:
        - QE001
        - QE023
        - QE027
      relatedTableRefs:
        - TE001
        - TE005
    - type: missing-source
      severity: minor
      topic: api-ecosystem-depth
      missingEvidence: Broader public API references, SDK adoption data, or community-maintained integrations beyond the visible GitHub org and official GitHub app.
      whyItMatters: A stronger public developer ecosystem would make the platform more defensible and easier to evaluate for integration risk.
      diligencePath: Search for partner directories, package-registry downloads, public API references, and customer-built integrations, or request internal ecosystem metrics.
      relatedQuestionRefs:
        - QE023
        - QE027
      relatedTableRefs:
        - TE005
