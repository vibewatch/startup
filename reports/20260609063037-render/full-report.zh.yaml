  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与分层
        blocks:
          - type: paragraph
            body: >-
              理解 Render 的竞争集合，最简单的方法是按要完成的任务拆开。最直接重叠的是后端优先、有状态应用托管：团队想要基于 Git 的部署、托管服务，以及为常开 Web 应用、API、worker
              和数据库提供最少基础设施仪式感。在这条赛道上，Railway、Fly.io、Heroku 和 DigitalOcean App Platform 是最清楚的可比对象。Vercel 和 Netlify
              重要，但主要是在购买中心关注前端速度、预览链接、框架原生 Web 交付和短生命周期函数执行时，而不是关注长时间运行的 worker 或集成数据库时。Cloud Run、App Runner 和 Elastic
              Beanstalk 等超大规模云选项也是真实替代品，但它们更接近内部自建或云组装路径，而不是开箱即用 PaaS 的同等体验。Supabase
              是相邻玩家，而不是完全同类，因为它更多填补后端数据层，而不是通用托管层。这个分层重要，因为 Render 的胜负取决于工作负载形状，而不是一个无差别的“PaaS”类别。
            claimRefs:
