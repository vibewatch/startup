      - number: '2.2'
        title: 市场规模测算——广义 PaaS 与 Render 约束口径
        blocks:
          - type: paragraph
            body: |
              广义市场报告支持平台即服务（PaaS）类别规模大且仍在增长的结论，
              但彼此差异太大，不能直接作为单一 Render 总可用市场（TAM）。已抓取材料中，可访问估计
              从 2025 年约 $108.8 billion（DataM Intelligence）到 2025 年
              $208.6 billion（Fortune Business Insights）不等，其他发布方则集中在
              相近时期的约 $127 billion、$164 billion 和 $166 billion。这个跨度太宽，
              不能当作精确值。它很可能反映了不同的类别边界：有些报告把中间件、集成、
              分析和企业平台层也打包进去；这些支出对更大的 PaaS 生态重要，但并不直接
              对应 Render 的开发者部署细分市场。

              实操上，规模测算应同时保留几种视角。第一层是广义全球 PaaS 类别，
              方向上有吸引力，也明显扩张。第二层是受约束的开发者部署云切片，
              隔离出与托管应用、worker、托管数据和私有网络最相关的支出；
              对广义估计施加保守收缩因子后，可得到一个低置信度的 $8 billion 到
              $18 billion 全球口径，用于描述今天适配 Render 的市场。第三层再切出
              AI 原生 / 有状态应用楔子——长时间运行的智能体、流式、持久工作流和
              向量密集后端——今天大约 $2 billion 到 $5 billion。这些更窄数字是估算，
              不是第三方事实，但比假装所有 PaaS 支出都同等可触达更有决策价值。
