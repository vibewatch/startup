  - id: TE005
    title: 竞争姿态对比
    columns:
      - 平台
      - 公开材料中的最佳适配定位
      - 有状态 / 长时间运行支持
      - 数据 / 网络原语
      - AI / 开发者工作流信号
      - 对 Render 的含义
    rows:
      - - Render
        - 面向运行应用或智能体的开发者全栈云
        - 在持久服务、worker、cron 和 beta 版 Workflows 上都较强
        - 私有网络、Postgres、Key Value、磁盘
        - MCP、CLI 技能、预览环境、GitHub App
        - 本章参考平台
      - - Vercel
        - 面向 Web 应用和智能体型工作负载的 AI 云
        - 支持更长函数，但定位仍以 Web / 函数为中心
        - 更多靠 Marketplace 集成，而不是 Render 式内置私有网络 + 托管数据库组合
        - AI SDK 和预览工作流很强
        - 应用需要更常驻、多服务有状态时，Render 更有可比优势
      - - Netlify
        - 前端、预览、DNS、函数，以及边缘 / serverless 流程
        - 支持后台和计划任务，但公开定位仍是前端优先
        - 有数据 / 存储原语，但围绕私有服务网络的整合不如 Render
        - 预览能力强，AI / 智能体叙事也强
        - Render 的优势是更深的应用运行时和内部网络叙事
      - - Cloud Run
        - 面向服务和作业的 serverless 容器运行时
        - 作业和缩到零能力强；作业最长可运行 24 小时
        - 可直连 VPC，但数据库和缓存是独立的 Google 服务
        - 源代码部署和 AI 托管姿态不错
        - Render 提供更有主张的一体化 PaaS 控制平面
      - - AWS App Runner
        - 面向 Web 工作负载的托管容器应用
        - 曾适合微服务，但 2026 年已停止接收新客户
        - 对 AWS 服务的私有 VPC 访问
        - 支持终止通知之后，前向产品信号很少
        - 削弱了 App Runner 长期充当 Render 替代方案的意义
      - - Railway
        - 带可视画布的一体化智能云提供商
        - 即时网络和预览环境不错
        - 内置私有网络，但获取到的材料对数据 / 控制平面广度说得不够清楚
        - DX 和 PR 预览很强
        - 最接近的 UX 风格竞争者，但 Render 的托管状态和信任界面更深
      - - Fly.io
        - 分布式计算和硬件隔离沙箱
        - VM、智能体和分布式系统能力强
        - 内置私有网络和存储，计算全球分布
        - 沙箱叙事高度开发者导向
        - Fly 很强，但 Render 对主流应用团队更简单、托管程度更高
      - - DigitalOcean App Platform / Supabase 应用与后端平台
        - 应用托管加 worker 组件 / 带 Postgres 和 API 的后端平台
        - 对微服务或后端栈有用，但产品范围分在应用平台和后端平台两边
        - DO 有专用 IP 和 worker 支持；Supabase 有 Postgres/Auth/API
        - 托管原语不错，但运行时 + 运维 + 智能体工具链不够统一
        - Render 的差异化在于一个控制平面覆盖运行时、状态、预览和 AI 运维
    notes: 对比行采用各厂商自己的公开定位，因此描述的是产品形态，不是客观基准性能。
    claimRefs:
      - CE038
      - CE039
      - CE040
      - CE041
      - CE042
      - CE043
      - CE044
      - CE045
      - CE046
      - CE057
  - id: TE006
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 信号
      - 状态
      - 范围
      - 公开证据
      - 缺口 / 风险
    rows:
      - - SOC 2 Type 2
        - 公开列示；详细报告对较大工作区设有 NDA 门槛
        - 安全 / 保密 / 可用性保证
        - 安全页面 + 合规文件更新日志
        - 公开摘要较轻；报告本身不能公开下载
      - - ISO 27001
        - 公开列示；证书对较大工作区设有 NDA 门槛
        - 信息安全管理
        - 安全页面 + 合规文件更新日志
        - 表层页面没有公开范围声明或审计频率细节
      - - GDPR DPA + SOC 3
        - 所有工作区可见的文件中心
        - 采购 / 隐私文件
        - 合规文件更新日志
        - 无法回答更深的架构或运营韧性尽调问题
      - - HIPAA-ready 基础设施
        - 公开营销
        - 面向医疗工作负载，内置加密、审计控制和网络隔离
        - HIPAA 页面 + 安全页面
        - BAA 流程和具体共享责任细节在此未公开
      - - EU-US / UK / Swiss DPF
        - 截至 2025-01-06 已认证
        - 跨境隐私传输姿态
        - DPF 更新日志 + 安全页面
        - 仅有认证无法回答数据驻留或客户特定数据流设计
      - - 漏洞披露
        - 公开活跃
        - HackerOne 项目加 abuse / security 邮箱
        - 安全页面
        - 没有公开严重性统计或修复速度报告
      - - 运营透明度
        - 公开状态页和第三方事故镜像
        - 组件正常运行时间和近期事故
        - 状态页 + IncidentHub
        - 尽管关键组件正常运行时间不错，可见事故仍显示真实运营摩擦
      - - 质量 / 计费投诉
        - 存在负面公开评价
        - 免费层休眠行为、唤醒失败和计费投诉
        - Trustpilot 快照
        - 评论网站噪声大，但仍提示上手和计费信任风险
    notes: 信任表把直接公开的证据，与仍需 NDA 或客户访谈补足的尽调项分开。
