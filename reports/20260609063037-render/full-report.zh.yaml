      - number: '1.5'
        title: 可靠性、合规与反向信号
        blocks:
          - type: paragraph
            body: >-
              可靠性证据是混合的，但比单看评论表面更强。截至 2026 年 6 月 9 日，Render 自己的状态页显示主要服务类别近期可用性很高，包括 Oregon 的 web 服务可用性达到
              99.99%；IncidentHub 也独立描述平台处于运行状态。不过，同一批状态来源仍记录了持续不断的近期事件，影响 GitHub 连接、验证邮件投递、指标和 Postgres
              连接。这个模式支持一个务实结论：Render 运营上可信，但并非没有事故。


              对一家私营公司来说，合规姿态披露相对充分。公开材料指向 ISO 27001、SOC 2 Type 2、GDPR DPA、HIPAA 就绪，以及 Data Privacy Framework
              认证；部分文档还可按工作区层级通过控制台访问。主要负面信号来自归档的 Trustpilot
              评论，计费透明度、支持响应和免费层暂停反复出现。评论样本太小且有自选择偏差，不足以推翻更大的增长叙事，但足以支撑尽调中直接追问：计费争议、支持
              SLA，以及客户体验摩擦究竟集中在低价值免费用户，还是已经外溢到付费客户队列。
