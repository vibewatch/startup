      - - 让智能体操作服务
        - 通过开发工具查看指标 / 日志并触发动作
        - CLI 技能与 MCP 服务器，覆盖指标、日志、部署历史和 Postgres 查询
        - 让编码智能体更容易接管基础设施管理
        - 公开文档未披露采用情况、认证细节或企业治理深度
    notes: 这些工作流各行概括了公开材料里最显眼的运营模式；不能替代私下生产环境引用访谈。
