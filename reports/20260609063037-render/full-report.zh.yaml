      - number: '7.3'
        title: 运营可靠性、事件响应与支持风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Render 呈现出混合但可理解的图景。正面案例相当有分量：在 2025 年 10 月 AWS us-east-1 故障期间，Render 称活跃客户服务保持在线，部分原因是它避开了更高层的 AWS
              托管服务，把控制平面操作放在 us-east-1 之外，并已把客户负载分散到多个区域。同一篇复盘有用，恰恰因为它不唱凯歌：Render 承认存在临场干预、工具和沟通降级，以及如果类似事件发生在 us-west-2
              后果会糟糕得多。关于 Postgres HA、私有网络、后台 worker、cron 作业和 Workflows 的公开文档显示，Render
              仍在构建缓释基础能力，包括自动故障转移、内部网络、重试和持久任务编排。但这些缓释有边界。HA 仍限于单一区域，可能丢失数秒写入；cron 作业会在 12 小时后硬停止；Workflows 仍处于 beta 或
              early access，而不是完全成熟的基础设施。独立反向证据指向同一问题的客户侧：Trustpilot 投诉集中在支持响应、账单清晰度和免费层唤醒不可靠，说明即使核心架构很强，运营信任仍可能在边缘被磨损。
