  - id: FU001
    title: Render 客户旅程图
    type: journey-map
    layout: standard
    summary: 公开证据显示，开发者主导路径从发现进入试用、生产验证，再到更高保障的评估。
    data:
      items:
        - label: 发现
          value: Public pricing, customer stories, and comparison sites expose Render to developers exploring alternatives.
          note: 发现看起来更广泛、偏自下而上，而不是企业自上而下。
        - label: 试用或迁移
          value: Named stories frequently start as migrations from Heroku or more complex cloud setups.
          note: 从传统 PaaS 或 AWS 复杂度迁移，是可见获客切入点。
        - label: 生产验证
          value: ReadMe, Rime, and Hodinkee provide quantified or time-bound outcomes that imply real production use.
          note: 当披露迁移或节省指标时，生产叙事最强。
        - label: 可靠性与保障审查
          value: >-
            Status pages, Trustpilot, security pages, and compliance documents shape customer confidence after first
            use.
          note: 这一阶段同时有高正常运行时间信号，也有支持和宕机隐忧。
        - label: 扩张或停滞
          value: >-
            Customers likely expand through broader workspace use and compliance review, but public expansion metrics
            are undisclosed.
          note: 企业或受监管场景看起来比初始试用更少自助化。
