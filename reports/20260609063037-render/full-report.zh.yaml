    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与平台边界
        blocks:
          - type: paragraph
            body: >-
              Render 是一家位于 San Francisco 的云平台公司，2018 年成立，公开层面仍由创始人兼 CEO Anurag Goel 带队。从官网
              About、招聘和融资材料看，公司把自己定位为面向软件团队的现代云：团队可以更快部署，不必自己拼装底层基础设施原语。公开产品描述也持续把 Render 定义为全栈应用平台，而不是单一服务的托管工具。


              核心平台现在覆盖 web 服务、私有服务、静态站点、后台 worker、cron 任务、托管 Postgres、私有网络，以及通过 Blueprints
              实现的基础设施即代码。这种广度会影响后续尽调章节：Render 想成为应用团队的主要运行时，而不只是边缘托管或前端平台。同一批官方材料还显示，公司采用全球分布式远程团队，并以长期建公司为招聘姿态；这进一步说明
              Render 仍处在积极扩张期，而不是一个狭义优化现金收益的资产。
