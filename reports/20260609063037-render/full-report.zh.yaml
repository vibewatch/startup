  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 反向观点
      - 哪些证据会改变判断
    rows:
      - - AI 原生需求顺风
        - Gartner 预计 2026 年 AI 支出为 $2.59T，并称基础设施占比超过 45%。
        - 宏观需求不等于 Render 能高效吃到这笔支出。
        - 拿出企业 AI 收入结构和工作负载级商业化数据。
      - - 开发者采用
        - Render 称平台有 4.5M+ 开发者，每月新增 250k+。
        - 采用规模看不出付费转化、席位深度或客户集中度。
        - 披露付费账户、扩张指标和留存队列。
      - - 融资支持
        - 本次延伸融资由 Georgian 领投，内部投资人强力参与。
        - 成熟的投资团验证了这一轮，不等于同价进入还能拿到未来回报。
        - 提供每股价格、条款，以及任何老股 / 要约机制。
      - - 市场结构
        - 多份 PaaS 研究指向一个规模大且仍在增长的市场。
        - 规模估算差异很大，单看 TAM 不能证明估值。
        - 证明 Render 实际服务子赛道的份额提升。
      - - 竞争
        - 非上市和上市开发者云同行证明，这个品类确实能创造价值。
        - 它们也说明，同一批工作负载竞争激烈，且资本强度高。
        - 证明差异化可持续，尤其要超出中小企业和个人爱好者使用场景。
      - - 运营质量
        - Render 目前平台在正常运行，也有真实牵引力。
        - Trustpilot 投诉和近期事故不支持给感知可靠性或支持质量溢价。
        - 拿出事故率趋势、SLA 表现，以及由支持问题导致的流失。
    notes: 投资逻辑和反向逻辑刻意绑定价格：同一家公司在一个价格可能有吸引力，换一个价格就偏高。
