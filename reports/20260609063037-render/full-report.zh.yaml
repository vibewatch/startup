      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Render 的法律和监管画像，更像执行与采购摩擦问题，而不是已可见的执法行动。公司公开宣传 ISO 27001、SOC 2 Type 2、GDPR-DPA、HIPAA 就绪和 Data Privacy
              Framework 覆盖，并已在仪表盘直接展示部分合规文档，同时把更敏感材料放在 NDA 和更高工作区层级之后。这些确实能缓释企业尽调风险。但同一组证据也显示风险仍在哪里。HIPAA
              能力由套餐门槛控制，并非全量可用；相关监管框架是 HHS Security Rule，意味着 Render 的产品营销不能免除客户自行搭建合规架构和运营的责任。Render 也维护公开的 Privacy
              Policy、Terms of Service 和 Data Processing Addendum 页面，但已审阅语料未发现可与部分竞品相比的公开 SLA 或可用性补偿政策。这不能证明 Render
              缺少面向企业客户的私下合同救济，但意味着公开证据在认证和文档可得性上更强，在服务补救上更弱。因此，合规叙事足以支撑尽调，但还不足以消除受监管或重视可用性的买家的签约摩擦。
