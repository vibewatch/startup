    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 真实采用和增长信号已经出现，但披露的经济性太薄，支撑不了在 $1.5B 估值下高确信买入。
        - 继续尽调；不要只依赖表面估值。
      - - 置信度
        - 中
        - 产品-市场匹配的方向可信，但缺失的指标是核心项，不是边缘项。
        - 复核管理层 KPI 后再承接投资假设。
      - - 风险评级
        - 高
        - 竞争、自有服务器落地，以及支持 / 可靠性证据参差，都可能压缩倍数。
        - 要求明确下行情景方案和投资逻辑失效触发点。
      - - 估值立场
        - 偏高
        - 公开证据只能把上一轮价格当参照，不支持其相对内在价值有明显折价。
        - 不要假设短期就能上调估值。
      - - 入场纪律
        - 只有拿到证明或价格优势才进
        - 需要私下验证收入、毛利、留存和条款，才能支撑相同或更高的有效入场价。
        - 要求开放 data room，或等待更好的入场点。
    notes: 本表把公开证据转成投委会立场；不能替代对商业化和融资条款的私下尽调。
