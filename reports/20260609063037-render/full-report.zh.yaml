  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Render 的风险栈由三项一级严重风险领头。第一，运营可靠性足以显示真实韧性，但还不足以消除担忧：公开状态页仍显示组件和区域之间存在明显差异，包括 Singapore 在展示的 90 天窗口内正常运行时间为
              99.57%；近期事件影响了日志、指标、GitHub 连接、验证邮件、自定义域和 Oregon Postgres 连接。第二，基础设施依赖在变复杂，而不是变简单。CNBC 称 Render 仍运行在 AWS 和
              Google Cloud Platform 上，同时也在测试自有服务器以降低成本和价格；这带来双重风险：公司今天仍暴露在超大规模云厂商事件中，明天又要承担硬件容量和执行风险。第三，商业模式越来越绑定 AI
              原生需求和企业采购结果。Gartner 仍预计 AI 支出将在 2026 年激增，但也提醒支出仍由基础设施主导，企业尚未广泛证明 AI 价值。只要 Render
              能控制事件频率，把合规和可靠性投入转化为企业信任，并在没有引发支持质量反弹的前提下扩展 AI 重载工作负载，投资逻辑就能成立。若自有服务器执行、合作伙伴事件和 AI 需求常态化同时到来，投资逻辑就会破裂。
