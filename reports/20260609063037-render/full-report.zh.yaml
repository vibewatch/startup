  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Render 的公开估值锚点清晰但不完整。公司 2026 年 2 月宣布 $100 million Series C 延伸轮，投后估值 $1.5 billion，使已披露累计融资达到 $258
              million，并在 Addition、Bessemer、General Catalyst、01A 等既有投资者之外加入 Georgian。历史公开报道显示，2023 年有一轮 $50 million
              Series B；而 Tracxn 的 2025 年档案在延伸轮前仍只列示已融资 $157 million。SEC Form D 证据确认 Render
              长期依赖外部资本，但没有揭示最新一轮的经济条款。入场纪律因此必须区分价格发现和价值发现：这轮融资证明成熟投资人愿意支付 $1.5
              billion，但公开记录仍缺少收入基数、毛利率、留存画像、烧钱速度和融资条款，无法判断这个价格对新投资人是保守还是激进。仅看公开证据，正确姿态是把 $1.5 billion
              视为真实融资参照，而不是完整承保结论。
