              Render 的核心单位经济性叙事可信，但披露不完整。CNBC 报道称，公司仍跑在 AWS 和 Google Cloud Platform
              上，同时测试自有服务器；这是成本结构上最清楚的公开线索。如果成功，这一转向可能降低单位成本，支撑更低价格或更好毛利率；如果处理不当，它会引入硬件采购和容量风险，而这些风险在纯超大规模云转售模型下并不存在。产品文档还显示，Render
              正押注长时间运行的后台任务、私有网络和 Workflows，以服务有状态 AI 工作负载；这些工作负载的成本曲线很可能不同于静态站点或简单 web
              服务。财务盲点在于，所有公开材料都没有披露毛利率、云支出负担、支持成本、烧钱速度或现金跑道。反向证据也重要：Trustpilot
