  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有 Render 未披露的收入基数已经明显进入九位数，当前估值才显得清楚合理；若低于此，隐含倍数就会偏高。
    data:
      items:
        - label: 20x 下所需收入
          value: 0.075
          detail: 按 20x 支撑 $1.5B，需要 $75M 收入。
          tone: positive
        - label: 15x 下所需收入
          value: 0.1
          detail: 按 15x 支撑 $1.5B，需要 $100M 收入。
          tone: warning
        - label: 10x 下所需收入
          value: 0.15
          detail: 按 10x 支撑 $1.5B，需要 $150M 收入。
          tone: warning
        - label: 7.5x 下所需收入
          value: 0.2
          detail: 按 7.5x 支撑 $1.5B，需要 $200M 收入。
          tone: warning
        - label: 5x 下所需收入
          value: 0.3
          detail: 按 5x 支撑 $1.5B，需要 $300M 收入。
          tone: negative
    approximationNotes: 数值为以十亿美元计的年度收入，按估值除以倍数简单计算；它们是敏感性标记，不是预测。
    claimRefs:
      - CV022
      - CV027
      - CV031
      - CV043
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基准情景大致围绕最新一轮估值；乐观情景需要强得多的私下证据；悲观情景意味着明显的降轮风险。
    data:
      items:
        - label: 悲观情景
          low: 0.75
          mid: 0.9
          high: 1.1
          detail: 货币化披露薄弱、价格压力或运营摩擦，推动估值重置到上一轮以下。
          tone: negative
        - label: 基准情景
          low: 1.2
          mid: 1.5
          high: 1.8
          detail: 若尽调确认货币化健康、但没有重大上行惊喜，当前估值标记大体守住。
          tone: warning
        - label: 乐观情景
          low: 2.5
          mid: 3.2
          high: 4
          detail: 需要强劲企业货币化、持久留存，以及市场给予更接近 Vercel 式结果的高增长溢价。
          tone: positive
    approximationNotes: 区间是基于情景的股权价值示意，单位为十亿美元。它们反映情景权重和可比公司框架，不是 DCF 或管理层指引。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Render 在市场需求和采用动能上得分最高，但披露质量、估值支撑和执行风险透明度明显低得多。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: AI 基础设施顺风和广泛的 PaaS 增长支撑品类扩张。
          tone: positive
        - label: 采用证据
          score: 7
          detail: 4.5M+ 开发者和 >100% 增长表述，显示牵引力真实存在。
          tone: positive
        - label: 融资支撑
          score: 6
          detail: 优质投资人以有分量的估值参与本轮融资，验证市场兴趣。
          tone: neutral
        - label: 货币化证据
          score: 3
          detail: ARR、收入基数、毛利率或留存指标均未披露。
          tone: negative
        - label: 竞争护城河
          score: 5
          detail: 产品相关性真实，但赛道里有 Railway、Vercel、Fly、DigitalOcean 和超大规模云厂商挤压。
          tone: warning
        - label: 运营韧性
          score: 4
          detail: 近期事故叠加支持与计费投诉，提示需要谨慎。
          tone: negative
        - label: 估值支撑
          score: 3
          detail: 货币化分母未披露，当前价格只有在附加条件下才站得住。
          tone: negative
        - label: 证据质量
          score: 4
          detail: 证据足以支撑继续研究，但不足以支撑高确信度定价判断。
          tone: warning
    approximationNotes: 分数是基于公开证据综合形成的 0 到 10 序数判断，供投委会讨论；不是因子模型输出。
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV018
      - CV044
      - CV045
      - CV046
      - CV052
      - CV053
