  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 基于公开证据，呈现 Render 主要风险类别的残余严重度。
    data:
      columns:
        - 监管 / 法律
        - 可靠性 / 事故
        - 基础设施 / 依赖
        - 竞争 / 采购
        - 财务 / 模型
      rows:
        - label: 极高残余风险
          values:
            - 审阅材料中未见公开 SLA
            - 区域性或控制平面事故集中出现
            - 依赖 AWS/GCP，同时转向自有服务器
            - 明示 SLA 的竞争对手在企业交易中挤掉 Render
            - AI 需求或价格压缩打断估值叙事
        - label: 高残余风险
          values:
            - HIPAA 与合规落地仍受方案门槛限制
            - 支持与计费信任被侵蚀
            - GitHub 和上游供应商事故外溢
            - Railway、Vercel 和 DigitalOcean 缩小外界感知的可靠性差距
            - 基础设施切换期间毛利率路径不透明
        - label: 中等残余风险
          values:
            - DPF 与传输机制维护
            - Cron 任务和工作流成熟度受限
            - 依赖 Cloudflare 和 ClickHouse 分处理方
            - Heroku、Cloud Run 和 Fly.io 仍是可行替代
            - 8 月工作区迁移带来流失风险
        - label: 较低残余风险
          values:
            - 已有公开法律文件
            - 私有网络降低东西向暴露
            - Postgres HA 和备份降低数据库停机风险
            - 集成产品包仍让 Render 保持差异化
            - 新融资降低短期偿付风险
    approximationNotes: 单元格概括公开证据，不是精算概率。
