      - number: '5.5'
        title: 信任、安全、合规与公开缺口
        blocks:
          - type: paragraph
            body: >-
              Render 的公开信任姿态强于许多更小的开发者云平台。安全和合规界面公开列出 ISO 27001、SOC 2 Type 2、GDPR-DPA、HIPAA-ready 基础设施，以及 EU-US/UK/Swiss
              Data Privacy Framework 覆盖。dashboard 文档中心还通过显示哪些文档广泛可见、哪些需要 Organization 和 Enterprise 工作区签署 NDA
              才能访问，补充了分发细节。公开页面也列出滥用和安全报告联系方式，以及基于 HackerOne 的漏洞披露路径。这些足以说明，安全和合规是活跃产品向量，而不是事后补丁。

              尽调缺口在深度，而不是完全缺失。公开页面没有披露合同 SLA、正式 RTO/RPO、详细租户隔离架构、密钥管理设计、渗透测试结果、BAA 流程细节，或 Workflows 和 MCP
              等较新界面的广泛生产使用指标。独立信号也提醒投资者，开发者体验并非一致优秀：Trustpilot 投诉提到免费层休眠、Bad Gateway 唤醒问题和计费争议；独立监测还捕捉到近期影响 GitHub
              连接、自定义域名、指标和 Postgres 连接的事故。净判断是：信任姿态可信，企业意图真实，但仅靠公开细节仍不足以承保受监管或任务关键工作负载，必须直接进入尽调材料。
