        - 减少手工拼基础设施，让 PR 预览成为一等能力
        - 未公开部署失败率或发布延迟数据
      - - 运行异步队列任务
        - 将长时任务移出请求路径
        - Background workers 轮询由 Render Key Value 支撑的队列
        - 在保留一体化栈的同时，让 Web 路径保持响应
        - workers 无入站流量；未公开自动扩缩指导
      - - 运行定时维护或批处理任务
        - 用 cron 表达式调度命令
        - 从 Git 或 Docker 运行 Cron Jobs，按单次运行计费，并保证只运行一次
        - 适合不依赖外部调度器的周期性维护
        - 运行时长上限 12 小时，且不支持磁盘
      - - 以私有方式连接应用、缓存和数据库
        - 让东西向流量不走公网
        - 同区域、同工作区的私有网络，带内部主机名和内部 URL
        - 服务到服务、服务到数据的连接延迟更低，也更安全
        - 跨区域和公共站点场景仍要换用其他模式
      - - 承载实时 AI 聊天或 WebSocket 应用
        - 维持持久连接和长时间模型流
        - 持久 Web 服务 / worker、100 分钟请求上限，以及私有网络里的 Key Value
        - 比短超时 serverless 流程更适合有状态 AI 运行时
