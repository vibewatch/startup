      - - Fly.io
        - 非上市
        - 据报道的 2023 年估值 / 2024 年收入
        - $397M 估值；$11.2M 收入
        - 有助于校准较小规模的开发者云。
        - GetLatka 数据是二手来源，可信度较低。
      - - Vercel
        - 非上市
        - Series F 轮估值
        - $9.3B
        - 显示开发者云平台野心和 AI 叙事强度的上限。
        - 规模更大，品牌更强，企业客户结构可能不同。
      - - Fastly
        - 上市
        - 市值 / 收入
        - $3.03B；约 4.7x 收入
        - 按绝对估值看，是较接近的小型上市云基础设施基准。
        - Edge/CDN 组合不同于 Render 的平台模式。
      - - DigitalOcean
        - 上市
        - 市值 / 收入
        - $17.67B；约 18.8x 收入
        - 开发者云和 AI 原生叙事让它成为有用的上市参照。
        - 披露多得多，也更成熟，基础设施栈更宽。
      - - Cloudflare
        - 上市
        - 市值 / 收入
        - $87.58B；约 40.5x 收入
        - 显示上市投资人愿意为顶级增长加清晰披露支付多高溢价。
        - 规模大得多、业务更多元，也不是接近的产品孪生。
    notes: 可比行刻意混合非上市轮次和上市市值，因为 Render 非上市且不透明。本表用于框定区间，不是一组干净的同口径倍数。
