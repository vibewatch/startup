        title: 护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              Render 的护城河只在最匹配的切片里显得耐久：中等复杂度、全栈应用，需要类似 Heroku 的抽象、持久
              worker、集成有状态服务，以及足够结构来避免超大规模云蔓延。纯前端工作负载下，它没那么耐久，也始终暴露在开放容器和大型云生态带来的商品化压力下。最强的公开反向证据不是某一个突破型直接对手，而是替代品密度和买方摩擦的组合。Trustpilot
              目前评分较差，投诉集中在价格混乱、计费、支持和免费层休眠行为。AlternativeTo 显示替代品发现集合拥挤，进一步说明概念层面的切换很容易，即便生产切换很难。App Runner 在 2026
              年冻结新客户提醒我们，替代品菜单也可能突然变化；Gartner 的 AI 和云预测则显示，该类别会吸引更多资本和产品注意力。因此，Render 的竞争空间真实存在，但并没有垄断开发者偏好。
