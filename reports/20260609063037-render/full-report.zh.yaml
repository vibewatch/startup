      - number: '8.3'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Render 的投资逻辑是：它在 AI 基础设施支出加速之际，罕见地同时具备开发者采用、强增长和顺势的 AI 原生产品叙事。官方和 CNBC
              披露暗示，公司正在把产品相关性转化为规模化真实平台采用；延伸轮也显示投资人愿意以明显上台阶的价格为这个故事出资。反向逻辑是，公司可能仍过于不透明，无法负责任地估值。PaaS
              市场研究都指向上行，但区间很宽，也说明把大 TAM 叙事过度套到某家公司身上很容易。与此同时，Render 不仅要面对 Railway、Vercel、Fly.io 等资金充足的私有公司，也要面对
              DigitalOcean、Fastly、Cloudflare
              等披露更充分的上市公司，更不用说超大规模云厂商替代品。支持和账单投诉、近期事件、转向自有服务器，都在公开记录最薄的地方增加执行风险。公司可能很优秀；问题是当前价格是否已经假设了比公开证据更多的证明。
