      - number: '8.5'
        title: 可比基准与退出准备度
        blocks:
          - type: paragraph
            body: >-
              可比集合适合用来框定区间，而不是直接套公式估值。私有同业中，Render 的 $1.5 billion 估值高于 Railway 新披露的 $1.0 billion 轮次，也远高于 Fly.io 上次报告的
              $397 million 估值，但明显低于 Vercel 2025 年 $9.3 billion Series F。公开同业中，Render 低于 Fastly 约 $3.0 billion 市值，也远低于
              DigitalOcean 和 Cloudflare；后两者绝对估值更大，并披露了计算当前公开倍数所需的收入。那些公开数字显示披露质量有多重要：DigitalOcean、Cloudflare 和 Fastly
              的透明度足以框定当前市值 / 收入比，而 Render 没有。因此，任何公开可比映射都必然有条件。退出准备度也类似。Render 最终可能有 IPO
              或战略出售路径，但公开证据尚未显示公开云投资人通常期待的经审计指标广度、队列细节、治理披露或投行准备度。今天的可比工作因此支持结果区间，但不能清楚证明公司已经准备好获得公开市场式溢价。
