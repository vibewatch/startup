      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Render 更像可信但不完整。定价栈连贯，漏斗顶端看起来很大，2026
              年融资伴随公司报告的高速增长，而不是明显困境，并且估值更高。这些都利好收入质量和资本获取。利润率叙事也方向上可信：固定工作区订阅可以创造经常性收入，超额费用可以变现用量增长，自有服务器实验未来可能改善成本基础。但公开记录仍远不足以完成完整承保。绝对收入、年经常性收入（ARR）、毛利率、烧钱速度、现金跑道、获客成本（CAC）、回本周期、净留存率（NRR）、实际定价瀑布都没有披露；订阅、计算、数据库服务和较新
              AI /
              工作流功能之间的产品级收入组合也没有公开。计费清晰度、支持和事故节奏上的独立反向证据进一步提示不能过度自信。结论：变现设计和资本获取看起来足够强，值得继续跟进，但投资决策应以私有数据室中的收入组合、利润率、流动性和留存为前置条件。
