      - number: '5.2'
        title: 服务地图与技术架构
        blocks:
          - type: paragraph
            body: >-
              Render 的架构围绕少数带有明确取向的原语组织。计算服务包括常开 web 服务和私有服务，加上非入口 worker 和定时任务。同一工作区内同一区域资源通过私有网络通信，使用内部主机名或内部数据库 /
              cache URL，而不是公共 endpoint。托管数据服务包括 Render Postgres 和 Render Key
              Value；持久磁盘则为单实例服务提供更灵活、但限制也更多的状态层。Blueprints 充当由 Git 支撑的控制平面，可以在一个 render.yaml 文件中声明互相关联的服务、数据库和环境组。

              架构最强的场景，是应用运营者想要开箱即用，但不想要纯 serverless 模型。Render Postgres 暴露只读副本、pgvector 和 PostGIS
              等扩展、可选高可用和连接管理工具。Blueprints 支持预览环境生成模式，GitHub app 和 coding-agent 界面则把部署延伸到 PR 预览和自然语言操作。限制在于，Render
              的有状态原语并不是通用抽象：cron 任务不能使用磁盘，worker 和 cron
              任务可以发送但不能接收私有网络流量，磁盘支撑的服务既失去多实例横向扩展，也失去零停机部署。对一些团队来说这些是可接受的设计选择，但仍是有意义的架构约束，尽调应把它们视为产品边界，而不是脚注。
