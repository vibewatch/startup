      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: |
              Render 的买方地图至少可以拆成五个有意义的细分。个人开发者和小项目所有者
              是行动最快的群体，因为买方、用户和付款方合为一人；采用与否取决于
              免费层质量、基于 Git 的部署速度，以及全栈原型能否不绑信用卡就上线。
              初创公司工程团队是下一层：创始人、CTO 或工程负责人通常掌握预算，
              开发者是用户，公司卡是付款方。触发点是降低 DevOps 负担——更快部署、
              托管 Postgres、worker，以及更少基础设施决策。

              成长阶段 SaaS 团队和 AI 原生产品团队带来更高运营复杂度。他们不那么在意
              第一次部署，而更在意预览环境、可预测定价、长时间运行任务、私有网络，
              以及有状态多服务可靠性。企业平台和安全团队引入采购、合规和治理相关方，
              拉长周期，但如果 Render 过关，也会抬高合同价值。两个相邻细分只能部分触达：
              前端优先团队可继续用 Vercel 或 Netlify 承载静态或轻量工作负载；数据库优先
              构建者也可锚定 Supabase，再单独选择应用托管。正因如此，Render 的真实
              市场既不是单一 SMB 开发者桶，也不是一个均质的企业云市场。
