  - id: TR005
    title: 缓解措施、监测指标、打破投资逻辑的触发点与尽调要求
    columns:
      - 风险
      - 可监测指标
      - 阈值或事件
      - 行动含义
    rows:
      - - 运营可靠性恶化
        - 公开状态页 / IncidentHub 事故数量及受影响组件
        - 连续两个月每月发生两起或更多面向客户的事故，或主要区域正常运行时间指标低于 99.9%
        - 升级事故复盘尽调，要求 MTTR 和错误预算数据，并下调对企业就绪度的信心。
      - - 自有服务器执行失误
        - 管理层披露自有服务器铺开、资本开支或价格变化
        - 有证据显示自有服务器扩张没有降本，反而抬高事故频率、供应瓶颈或毛利率压力
        - 把它视为打破利润率扩张故事的投资逻辑风险；立即要求资本开支、采购和容量模型。
      - - 支持与计费摩擦
        - 信任信号、退款争议、工单积压或计划迁移投诉
        - 2026 年 8 月工作区迁移期间或之后，计费争议或支持投诉明显增加
        - 要求支持人员配置、首次响应 SLO、退款政策数据，以及按投诉队列拆分的流失。
      - - 企业采购缺口
        - 面对有明确 SLA 或支持 SLO 的对手时的输赢结果
        - 当 SLA 或支持承诺成为决定因素时反复输单
        - 在支撑上探市场扩张判断前，要求标准 MSA/SLA 包和企业采购改善证明。
      - - AI 需求放缓或价格压缩
        - AI 原生客户增长结构和竞争定价变化
        - AI 占比较高的收入占比走弱，或在对手扩大功能对等和价格压力时增长放缓
        - 重估估值假设，并把尽调转向非 AI 工作负载的耐久性和留存。
      - - 合规执行失败
        - 安全事件、DPF 失效或医疗采购受挫
        - 重大安全泄露、认证失效，或因合规缺口导致医疗部署失败
        - 暂停投资逻辑，等待补救证据、第三方审计结果和客户影响评估。
    notes: 阈值有意设为可监测，并绑定尽调动作，而不是抽象风险标签。
