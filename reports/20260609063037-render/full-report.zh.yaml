      - number: '8.6'
        title: 最终尽调事项与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              缺失工作异常清晰。在把当前估值视为可投资之前，投资人应要求提供当前 ARR
              或收入运行率、按工作负载划分的毛利率和贡献毛利、付费转化和净留存数据、股权结构表和优先股堆叠，以及任何自有服务器部署的详细经济性。这些项目不是装饰；它们直接决定 $1.5 billion
              的标题估值对应的是可持续经济性，还是只是动量和稀缺性。投资逻辑也应有清晰破裂条件。如果私下尽调显示收入或经常性支出显著低于支撑溢价开发者云倍数所需水平，融资文件显示结构重度偏向现有优先股持有人，自有服务器努力增加
              capex
              却没有抬升利润率，或支持和可靠性问题持续复发，当前估值就应被视为容易面临平轮或下轮。反过来，如果管理层能证明强变现、健康留存和干净条款结构，当前建议可能迅速上调，因为漏斗顶部采用和市场背景已经强到足以支持继续推进。
