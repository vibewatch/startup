      - number: '2.5'
        title: 相互矛盾的估计与明确尽调缺口
        blocks:
          - type: paragraph
            body: |
              已抓取证据支持强市场论点，但不支持虚假的精确性。可访问 PaaS 报告在当前
              市场规模和增长率上分歧明显，所以区间比点估计更可信。更重要的是，没有任何
              已抓取独立来源能干净隔离出 Render 实际竞争的开发者中心部署云子市场。
              这些报告适合作为方向性输入，而不是可直接投资的 Render TAM。AI 原生托管
              楔子的直接测量更少：它以更广义 AI 支出、云支出或通用 PaaS 增长的一部分出现，
              而不是一个独立审计的市场。

              Render 专属可服务市场（SAM）和可获取市场（SOM）仍是最大尽调缺口。没有已抓取来源独立披露
              Render 的付费客户数、免费转付费、按团队规模划分的细分市场组合，或企业安全
              审查中的胜率。公司自写的 AI 和免费层文章有助于识别 Render 想拿下哪些
              工作负载，但不是市场份额证据。用于估值时，务实含义是同时保留多种规模测算视角，
              相比广义 PaaS 报告大幅折减与 Render 相关的总可用市场（TAM），并把 AI 原生托管视为真实的
              上行楔子，但它仍需要在下一轮更新中获得更清晰的第三方测量。
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM044
      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: AI 原生工作负载创造的楔子比通用托管更有价值
            body: >-
              Render 市场中最有吸引力的部分不是通用网站托管，而是那些为 AI
              原生产品需要长时间运行、有状态、多服务应用基础设施的团队。这类工作负载会关心超时限制、私有网络、后台工作和可预测的内部流量成本；宣传页站点和轻量 serverless 应用往往不这么关心。
            calloutType: strength
            claimRefs:
