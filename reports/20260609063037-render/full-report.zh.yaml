      - number: '3.4'
        title: 切换成本、锁定效应与多归属
        blocks:
          - type: paragraph
            body: >-
              切换成本高度取决于工作负载。一旦 Render 部署使用了私有服务主机名、托管 Postgres、HA 设置、持久磁盘、cron 任务和 worker 进程，迁移就不再只是改
              DNS：还需要数据迁移、任务迁移、服务发现调整，并重新编码基础设施。Blueprints 会再增加一层温和黏性，因为它用 Render 自己的 IaC 格式描述多服务基础设施。相比之下，静态站点、预览环境和轻量
              API 封装层可以较容易多归属，因为几个对手都提供连接 Git 的部署、预览和短生命周期函数。这意味着 Render 在应用栈更深处最有防御力，而不是在展示层。开放问题是分发能力。Vercel 和 Netlify
              对前端团队可能拥有更强入站吸引力，但已保留的公开证据没有量化同一细分市场中相对 Render 的具体胜负份额，因此这个竞争优势是方向性的，而不是已测量的。
