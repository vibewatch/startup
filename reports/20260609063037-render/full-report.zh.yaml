  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分定义
        blocks:
          - type: paragraph
            body: |
              Render 不应按“全部公有云”测算，甚至也不应按全球 PaaS 全量测算。
              已抓取证据定义的是一个更窄的市场：面向开发者的托管部署基础设施，
              服务于那些想发布 Web 应用、API、worker、定时任务和托管数据服务、
              但不想运营低层云原语的团队。Render 自己的 AI 和免费层材料也持续
              围绕基于 Git 的部署、后台 worker、PostgreSQL、预览环境和私有网络来
              定义产品，而不是单纯转售原始算力或只做静态站点托管。因此，最贴近的
              市场边界，是位于超大规模云厂商托管服务与更简单的前端 / serverless
              工具之间、以开发者为中心的部署云。

              因此，纳入的支出包括托管运行时、后台任务执行、托管 Postgres 及相关
              数据服务、私有内部网络和部署工作流工具。排除的支出包括原始 IaaS、
              大规模模型训练基础设施、通用 SaaS 开发者工具，以及狭义静态托管或
              纯数据库预算。AI 原生托管需要在这个市场内单独处理，因为长时间运行的
              智能体、流式工作负载、向量数据库流量和持久工作流，需要的能力往往不是
              宣传页站点和轻量 serverless 函数所需要的。这条边界重要，因为它让
              Render 的可服务市场扎根于公司能赢的工作负载类别，而不是把所有云基础设施
              支出都算进去。
