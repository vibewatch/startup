      - number: '1.3'
        title: 融资历史、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              Render 在 2026 年 2 月的融资是本章的锚点事实。公司和新闻来源一致显示，业务完成 $100 million C 轮扩展融资，估值 $1.5 billion，由 Georgian
              领投，Addition、Bessemer、General Catalyst 和 01A 参投。同一批来源也一致给出 $258 million 累计融资，以及开发者规模叙事：平台开发者超过 4.5
              million，每月新增开发者超过 250,000。


              更早的融资历史较薄，但方向仍清楚。TechCrunch 记录了 2023 年 6 月的 $50 million B 轮，使累计资本达到 $77.5 million，并提到 Watershed 和 Red Bull
              等客户；BusinessWire 则强调 Render 在 2019 年赢得 TechCrunch Startup Battlefield。合在一起看，里程碑序列显示公司从创业比赛验证，走到严肃风投支持，再到
              AI 时代的重新定价。主要不确定性不是 Render 是否在扩张，而是有多少规模已经转化为付费组织、收入集中度和可持续的利润率结构。
