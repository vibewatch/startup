      - number: '3.2'
        title: 直接同业与包装方式
        blocks:
          - type: paragraph
            body: >-
              Railway 是体验层面最接近的挑战者。它的主页强调自动配置、服务拓扑、内置可观测性、私有连接和协议支持，定价则通过基于额度的新手导入和按量计划维持低门槛。Fly.io
              是另一类对手：更偏基础设施、更全球化、更以容器为中心，提供 Machines、明确资源计费和托管 Postgres，面向需要精细控制的运维者。Heroku
              仍是参考性既有玩家，因为它仍提供托管容器、数据服务和庞大生态，但经济姿态毫不掩饰地偏付费和企业。DigitalOcean App Platform 更以 SMB 价格为导向，主打更简单的应用部署、预览环境，以及
              API 和微服务的较低成本。这意味着 Render 并不是在打一片同质化市场。Railway 用开发者体验和轻松全栈组装进攻，Fly.io 用灵活性和全球控制进攻，Heroku
              用既有熟悉度进攻，DigitalOcean 则用可负担价格进攻。
