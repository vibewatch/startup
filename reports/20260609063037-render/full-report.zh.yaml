  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Render 向软件团队销售统一云运行时：团队想从 Git 直接发布，不必分别组装计算、私有网络、托管数据、任务执行和部署工具。Render 在定价页、GitHub app 页面和文档中公开列出静态站点、web
              服务、私有服务、后台 worker、cron 任务、Render Postgres、Render Key Value、Workflows、Blueprints、预览环境、CLI 和 MCP
              工具。这张服务地图重要，因为它把 Render 定位为全栈应用的主要运行平台，而不是狭义前端托管平台。

              公开材料中的客户工作流也很清楚。团队连接 Git repository 或 Docker image，在 dashboard 或 render.yaml Blueprint 中定义服务，然后让 Render 在
              push 时构建和部署。面向公网的流量落在静态站点或 web 服务；内部逻辑可转到私有服务、后台 worker、cron 任务和 Workflows；状态可放在 Postgres、Key
              Value，少数情况下放在持久磁盘。运营闭环再通过原生指标 / 日志、REST API、CLI、状态页和 MCP 界面运转。相比纯 JAMstack 或短生命周期函数工作负载，这套工作流更贴合长寿命
              API、worker 队列、WebSocket 和智能体系统。
