          - type: callout
            title: 免费层竞争和超大规模云默认选项限制可获取份额
            body: >-
              Render 的核心买方基础有吸引力，但价格敏感；许多相邻工作负载也可以留在 Vercel、Netlify、Supabase、Cloud Run、App Runner 或传统 PaaS 上。因此，Render
              的真实约束不是云市场够不够大，而是一旦团队已经投入另一个工作流或采购生态，公司能否替换既有默认选项。
