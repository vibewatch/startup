  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议逻辑从强需求和采用信号出发，最终卡在估值支撑瓶颈：货币化、条款和可靠性证据缺失。
    data:
      nodes:
        - id: market
          label: AI / PaaS 需求提供支撑
          type: start
        - id: adoption
          label: 4.5M+ 开发者 + >100% 增长表述
          type: process
        - id: competition
          label: 资金充足的私营和上市同行
          type: process
        - id: opacity
          label: ARR / 利润率 / 留存未披露
          type: decision
        - id: operations
          label: 支持、计费、事故、自有服务器风险
          type: process
        - id: valuation
          label: $1.5B 估值未获直接支撑
          type: process
        - id: decision
          label: 继续研究 / 高风险 / 偏高
          type: end
      edges:
