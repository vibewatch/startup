  - id: TV005
    title: 投资逻辑失效与否决触发点表
    columns:
      - 触发点
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 商业化不及预期
        - 私下尽调显示收入明显低于支撑溢价倍数所需水平，或付费转化偏弱。
        - 打破“采用规模能支撑当前标记”的假设。
        - 不按当前估值投资；在更低区间重新测算。
      - - 优先股堆叠压顶
        - 融资文件显示激进的高级优先权、参与权或反稀释保护。
        - 削弱普通股下行保护，并抬高有效入场估值。
        - 要求更低有效价格，否则退出。
      - - 自有服务器经济性不及预期
        - 资本开支上升，却看不到毛利或性能收益。
        - 原本可能改善毛利的杠杆变成执行和烧钱问题。
        - 视作负面估值催化，并向悲观情景重估。
      - - 可靠性 / 支持恶化
        - 事故频率仍高，或投诉模式在企业扩张阶段继续存在。
        - 削弱围绕平台质量和留存的溢价倍数论证。
        - 投资前要求更强运营证据。
      - - 竞争性价格压缩
        - Railway、超大规模云厂商或其他同行迫使核心工作负载打折。
        - 削弱商业化，增加 CAC 压力，并压缩前瞻倍数。
        - 将情景权重转向基准至悲观，并收紧入场纪律。
    notes: 触发点设计为可监控，并直接连接估值传导，而不是泛泛的运营担忧。
    claimRefs:
      - CV019
      - CV045
      - CV046
      - CV047
      - CV049
      - CV053
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和 ARR
        - 当前收入运行率、ARR，以及较上期的增长拆桥。
        - 需要用它把名义估值转成可支撑的倍数。
        - 管理层 KPI 材料或 CFO 尽调会。
      - - 毛利率
        - 按工作负载和托管模式拆分的毛利率与贡献利润率。
        - 决定自有服务器扩张是在增值还是毁值。
        - 财务 data room 和基础设施复核。
      - - 留存和付费转化
        - NRR、总留存率、付费席位或付费账户转化，以及企业客户结构。
        - 判断 4.5M 开发者采用主张是否耐久的必要证据。
        - CRO / 收入运营尽调。
      - - 融资条款
        - 股权结构表、优先股堆叠、反稀释，以及任何老股分配。
        - 决定入场真实经济性和下行保护。
        - 外部律师与领投方参与的法律尽调。
      - - 可靠性和支持
        - 事故频率、SLA 达成率、支持积压，以及与服务质量相关的流失。
        - 检验反向证据只是噪音，还是实际扩张约束。
        - 运营复核和客户推荐访谈。
      - - 退出准备度
        - 经审计财报、治理成熟度、投行沟通和 IPO 准备工作流。
        - 明确上行情景应围绕公开退出还是继续私有持有来框定。
        - 董事会层面尽调和外部顾问复核。
    notes: 这些问题是把当前公开证据判断转成可定价投资决策所需的最低材料包。
    claimRefs:
      - CV018
      - CV019
      - CV046
      - CV047
      - CV051
      - CV053
