  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Render 的公开客户故事更多按可见产品原型和开发者工作流分层，而不是按已披露收入队列分层。官方客户索引把案例归在 B2B、媒体、技术、电商和代理机构下；具名参考更偏数字原生软件公司、开发者工具供应商、AI
              原生构建者和互联网品牌，而不是披露合同范围的传统企业。ReadMe、Thatch、Rime、Hodinkee 和 PullFlow 是已抓取材料中最清楚的具名参考；更广的客户页还加入
              OCMI、Evolve、Reservamos、Fey、BeerMenus 和 Propeller Digital。这个组合说明，Render 可以赢下文档 SaaS、医疗福利软件、语音 AI
              基础设施、媒体或商业资产，以及代理机构或 SMB 工作负载。不过，公开记录没有披露客户规模桶、地域组合、收入区间、买方与用户拆分，或哪个细分市场贡献最多
              ARR。因此，公开证据展示的是用例广度，而不是按收入加权的分层模型。
