  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示意估值区间
      - 相对 $1.5B 标记的回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 开发者增长转化为企业商业化，自有服务器铺开后改善毛利，AI 原生需求保持火热。
        - $2.5B-$4.0B
        - 1.7x-2.7x 上行需要九位数收入，并享受高增长可比公司的溢价倍数。
        - 低至中：公开信号令人鼓舞，但证明仍缺失。
      - - 基准
        - 增长保持强劲，商业化健康度足够，尽调基本验证当前叙事，但没有重大正向惊喜。
        - $1.2B-$1.8B
        - 大致持平到小幅上行；当前轮次已经吃掉了公开证据所能支撑的大部分上行情景。
        - 中：最符合今天的公开证据。
      - - 悲观
        - 收入质量不及预期，AI 需求降温，定价压力上升，或可靠性 / 支持问题拖累转化和留存。
        - $0.75B-$1.1B
        - 相对当前标记有 0.5x-0.7x 下行，符合持平轮或降价轮重置。
        - 中：并不遥远，因为缺失的指标正是决定下行保护的指标。
    notes: 区间是供投委会讨论的情景估值带，不是 DCF 输出或管理层指引。它们既锚定公开证据缺口，也锚定业务机会。
