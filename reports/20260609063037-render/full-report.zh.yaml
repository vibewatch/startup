      - number: '7.4'
        title: 合作伙伴依赖与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Render 的依赖图谱让人不舒服，因为公司正试图上攻企业市场，却仍依靠多个外部平台。CNBC 称运行时仍坐在 AWS 和 GCP 上，安全页面也把 AWS、GCP、Cloudflare 和 ClickHouse
              列为子处理方或基础设施伙伴。近期围绕 GitHub 连接、上游提供商延迟验证邮件的公开事件表明，运营质量也取决于核心计算之外的供应商边缘。同时，Render
              所处市场拥挤，且竞争者对可靠性承诺越来越直白。Railway 推广与其直接重叠的全栈开发者云，包含私有网络、预览和可观测性，并按套餐发布 99.9% 到 99.999% 可用性目标。Vercel 发布
              99.99% Enterprise SLA。DigitalOcean App Platform 发布 99.95% 正常运行时间 SLA，并强势主打成本优势。Cloud Run 和 Heroku
              仍是托管应用运行的广泛替代，Fly.io 则以自有裸金属和沙盒化计算姿态吸引更偏基础设施的团队。这并不意味着 Render
              没有差异化；相反，它意味着公司必须靠一体化产品和更顺畅的执行取胜，因为替代集合很大，而且多家对手在公开材料中更明确地给出正式可靠性承诺。
