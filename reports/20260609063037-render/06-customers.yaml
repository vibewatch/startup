- id: FU001
  title: Render customer journey map
  type: journey-map
  layout: standard
  summary: Public evidence implies a developer-led path from discovery to trial, production proof, and higher-assurance evaluation.
  data:
    items:
    - label: Discover
      value: Public pricing, customer stories, and comparison sites expose Render to developers exploring alternatives.
      note: Discovery appears broad and bottom-up rather than enterprise-top-down.
    - label: Trial or migrate
      value: Named stories frequently start as migrations from Heroku or more complex cloud setups.
      note: Migration from legacy PaaS or AWS complexity is a visible acquisition wedge.
    - label: Production proof
      value: ReadMe, Rime, and Hodinkee provide quantified or time-bound outcomes that imply real production use.
      note: Production language is strongest where a migration or savings metric is disclosed.
    - label: Reliability and assurance review
      value: Status pages, Trustpilot, security pages, and compliance documents shape customer confidence after first use.
      note: This stage mixes high uptime signals with support and outage caveats.
    - label: Expand or stall
      value: Customers likely expand through broader workspace use and compliance review, but public expansion metrics are undisclosed.
      note: Enterprise or regulated motion appears less self-serve than initial trial.
