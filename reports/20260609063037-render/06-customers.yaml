- id: adoption-trajectory
  title: Adoption trajectory and platform-scale proof
  body: 'The most visible adoption metrics in public sources are platform-level, not customer-level. Render''s February 2026 funding announcement and supporting coverage say the platform has 4.5 million-plus developers and more than 250,000 new developers joining each month, while CNBC separately described adoption from more than 4.5 million developers and revenue growth well above 100 percent. Those are meaningful scale signals, but they should not be conflated with paying customers, active organizations, or production accounts because the disclosures speak in terms of developers on platform. Public press also broadens the named-proof set beyond the current customer page: TechCrunch in 2023 cited Watershed and Red Bull, and Business Wire in 2026 cited thousands of AI companies including Base44, Cognition, Luminai, Paradigm, and Fundamental Research Labs. The result is a credible story of broad developer adoption and a growing customer logo set, but not a disclosed count of billing accounts.

    '
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU028
  - CU040
  tableRefs:
  - TU002
  figureRefs:
  - FU003
- id: named-customer-proof
  title: Named customer proof and production-versus-pilot quality
  body: 'The named reference set is strongest where Render discloses a customer outcome and the customer''s own website confirms a live operating business. ReadMe is described as serving more than 5,000 companies and migrating from Heroku to Render with 90 seconds of downtime, which is unusually specific migration proof for a private infrastructure vendor. Rime is an enterprise AI voice company whose case study cites deployment in days instead of weeks and an 80 percent infrastructure-complexity reduction versus AWS. Hodinkee''s case study is the most quantified, citing a 56 percent cloud-cost reduction and a platform serving more than 20 million watch enthusiasts. Thatch and PullFlow are still useful named proofs because their public sites verify that they are live products, but the Render stories are more narrative and do not disclose contract size, spend, or renewal outcomes. That means public evidence points to production-like usage, but cannot fully distinguish mature recurring deployment
    from pilot, expansion, or a small-footprint account.

    '
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
