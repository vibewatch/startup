- id: retention-and-durability
  title: Retention, durability, and customer-experience proxies
  body: 'Public sources do not disclose NRR, GRR, churn, renewal rates, cohort retention, or even a paying-customer count, so customer durability cannot be directly underwritten from open materials. The best available proxies are mixed. Positive signals include migration outcomes in the case studies, public security and compliance materials, and a status page that shows high recent uptime across core components. Negative or cautionary signals include IncidentHub reports of multiple incidents in May and June 2026 and a Trustpilot archive showing a 2.7 out of 5 score from 21 customers, including complaints about slow responses on the free plan. These sources suggest customer experience is good enough to sustain visible adoption, but also that support and uptime are not frictionless. The sample sizes are small and noisy, so none of them substitute for cohort retention or revenue-expansion data. This is the chapter''s largest unresolved diligence hole.

    '
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU028
  - CU041
  - CU042
  tableRefs:
  - TU004
- id: expansion-concentration-and-procurement
  title: Expansion dynamics, concentration risk, and procurement friction
  body: 'Public evidence suggests a developer-led land-and-expand motion rather than a sales-led model with heavily disclosed enterprise cohorts. Render maintains a public pricing page, customer stories emphasize migrations from Heroku or AWS into fuller platform use, and the customer set is concentrated in companies that likely buy through engineering rather than centralized IT. Expansion into more regulated or security-sensitive use cases is visible in Render''s Security and Trust materials and in the December 2024 changelog that moved richer compliance documents behind organization or enterprise workspace controls and NDA gating. That is constructive for enterprise readiness, but it also implies a procurement step-up once a prospect moves beyond self-serve trial. Customer concentration remains unknowable from public sources because no top-customer, top-10, or geography mix data is disclosed. The visible customer roster also over-indexes toward AI-native and developer-tool names, which
    may or may not reflect actual revenue concentration.

    '
  claimRefs:
  - CU026
  - CU029
  - CU030
  - CU036
  - CU037
  - CU038
  - CU039
  tableRefs:
  - TU005
  - TU006
  figureRefs:
  - FU002
callouts:
- calloutType: risk
  title: Developer count is not customer count
  body: 'Render''s headline 4.5 million-developer metric is a strong platform-adoption indicator but it is not a disclosed paying-customer, active-organization, or production-account number. Any underwriting model that treats developer signups as monetized customers would overstate customer scale and understate concentration risk.

    '
  claimRefs:
  - CU003
  - CU005
  - CU040
- calloutType: risk
  title: Retention and concentration remain private-data holes
  body: 'Open materials provide real named-customer anecdotes and broad platform-scale adoption, but they do not disclose NRR, gross retention, top-customer share, expansion revenue, or regional customer mix. A diligence process still needs a customer-level revenue bridge, cohort retention, and top-account concentration schedule before customer quality can be underwritten.

    '
  claimRefs:
  - CU028
  - CU038
  - CU039
