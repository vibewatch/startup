  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production-vs-pilot
    missingEvidence: Named-customer contract scope, go-live dates, annual spend, and pilot-to-production conversion detail for ReadMe, Thatch, Rime, Hodinkee, and PullFlow.
    whyItMatters: Without commercial or deployment-scope detail, public case studies show credible usage but cannot fully prove production depth or durability.
    diligencePath: Request customer reference calls plus account-level deployment timelines and current ARR by named customer from the data room.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, gross logo retention, churn, renewal rate, and cohort retention by customer vintage or plan tier.
    whyItMatters: Customer quality cannot be underwritten without direct durability metrics, especially when public proof is concentrated in anecdotes.
    diligencePath: Request a customer cohort bridge covering at least 2024 through 2026 with retention and expansion by segment.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: procurement
    missingEvidence: Public evidence on security-review cycle length, percentage of sales-assisted deals, customer success staffing, and upgrade path from self-serve to enterprise.
    whyItMatters: Procurement friction directly affects conversion, expansion pace, and whether Render can move beyond developer-led trial into larger regulated deals.
    diligencePath: Ask management for funnel metrics from free-tier or self-serve entry into paid workspaces and enterprise contracts, plus median security-review duration.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
    - TU006
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Largest-customer share, top-10 customer concentration, expansion revenue contribution, and customer revenue by segment.
    whyItMatters: The visible customer roster is not revenue weighted, so concentration risk could be meaningfully better or worse than the public logo set suggests.
    diligencePath: Request a concentration schedule and expansion waterfall by customer for the last twelve months.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: geography
    missingEvidence: Customer counts, active organizations, and revenue mix by country, region, or cloud geography.
    whyItMatters: Public customer proof is vertical and logo based, which prevents assessment of regional concentration, localization needs, and outage exposure by geography.
    diligencePath: Request customer and ARR distribution by geography plus incident impact by region for the last twelve months.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
