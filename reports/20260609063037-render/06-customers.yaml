  rows:
  - - Public pricing visibility
    - Render maintains a public pricing page
    - Supports self-serve research and fast evaluation
    - Pricing alone does not reveal enterprise discounting or overage behavior
    - Request plan-level gross margin and upgrade mix
  - - Free-tier value proposition
    - Trustpilot reviews say setup is easy and the free tier works for small projects
    - Lowers trial friction for individual developers and small teams
    - Free-tier spin-down and support limits may constrain production use
    - Request free-to-paid conversion and churn by tier
  - - Support quality perception
    - Trustpilot includes complaints about slow responses on the free plan
    - Encourages upgrade for serious workloads
    - Can create negative early impressions for small accounts
    - Request support SLA and median first-response times by plan
  - - Compliance document access
    - Advanced compliance docs are gated to organization or enterprise workspaces after NDA
    - Appropriate for enterprise assurance processes
    - Adds a higher-touch step beyond initial self-serve evaluation
    - Request security-review cycle times and close rates after document-center access
  - - Third-party buyer research
    - Buyers can see Trustpilot and AlternativeTo, while G2 was JS-blocked during fetch
    - Some external research surfaces are available
    - Independent review depth is sparse and partially inaccessible
    - Request customer references and reference-call list by segment
  notes: These signals focus on buyer friction rather than core retention. Review evidence is small sample, but it is useful for understanding how self-serve and enterprise procurement may feel in practice.
