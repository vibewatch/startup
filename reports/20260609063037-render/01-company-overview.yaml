company:
  name: Render
chapter:
  number: 1
  title: Company Overview
  summary: Render is a 2018 San Francisco cloud-platform company led by founder-CEO Anurag Goel. February 2026 sources place it at a $1.5 billion valuation and $258 million total funding, with 4.5 million-plus developers on the platform and roughly 100 employees. Product breadth and AI-native positioning are strong, while paying-customer counts, exact governance structure, and the scale of billing/support friction remain unresolved.
sections:
- id: company-identity
  title: Company Identity and Platform Scope
  body: >-
    Render is a San Francisco cloud-platform company founded in 2018 and still led publicly by founder-CEO Anurag Goel. Across its official about, careers, and financing materials, the company presents itself as a modern cloud for software teams that want to deploy faster without assembling raw infrastructure primitives themselves. Public product descriptions consistently frame Render as a full-stack application platform rather than a single-service hosting tool.


    The core platform now spans web services, private services, static sites, background workers, cron jobs, managed Postgres, private networking, and infrastructure-as-code via Blueprints. That breadth matters for later diligence chapters because it means Render is trying to be the primary runtime for application teams, not just an edge-hosting or frontend platform. The same official corpus also shows a globally distributed remote team and a hiring posture built around long-term company building, which reinforces that Render is still in active expansion mode rather than operating as a narrowly optimized cash-yield asset.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO007
  - CO008
  - CO044
  tableRefs:
  - TO001
- id: leadership-governance
  title: Founder Leadership and Governance Posture
  body: >-
    The fetched public corpus is unusually founder-centric. CNBC, BusinessWire, and Tracxn all center Anurag Goel as the public face of the company, and CNBC adds the strongest founder-market-fit detail: Goel was Stripe’s eighth employee before founding Render. That experience matters because Render’s pitch relies on understanding developer workflows, infrastructure abstraction, and the economics of operating cloud services at software-company speed.


    Governance visibility, however, is materially thinner than product or funding visibility. Public sources clearly name major investors and show continued support from the core venture syndicate, but they do not expose a full current board roster, committee structure, or detailed ownership percentages. For diligence purposes, that means the company looks operationally mature enough to raise a nine-figure extension, yet still behaves like a founder-led private company whose internal governance is not fully inspectable from public documents alone. The leadership section should therefore be treated as partial and key-person dependence on Goel remains meaningful.
  claimRefs:
  - CO003
  - CO004
  - CO019
  - CO040
  - CO045
  tableRefs:
  - TO002
  - TO003
- id: funding-scale-milestones
  title: Funding History, Scale, and Milestones
  body: >-
    Render’s February 2026 financing is the anchor fact for this chapter. Company and news sources align that the business raised a $100 million Series C extension at a $1.5 billion valuation, led by Georgian with participation from Addition, Bessemer, General Catalyst, and 01A. Those same sources also align on $258 million total funding and on a developer-scale narrative: 4.5 million-plus developers on the platform and 250,000-plus new developers joining each month.


    The earlier financing history is thinner but still directionally clear. TechCrunch documented a $50 million Series B in June 2023 that took total capital to $77.5 million and cited customers such as Watershed and Red Bull, while BusinessWire highlighted Render’s 2019 TechCrunch Startup Battlefield win. Taken together, the milestone sequence shows a company that moved from startup-competition validation to serious venture backing and then to an AI-era re-rating. The main remaining uncertainty is not whether Render is scaling, but how much of that scale is monetized into paying organizations, revenue concentration, and durable margin structure.
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
