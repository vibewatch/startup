  rows:
  - - Workspace subscriptions
    - Flat-fee Hobby/Pro/Scale/Enterprise plans
    - Per workspace / month
    - Hobby free; Pro $25/month; Scale $499/month; Enterprise custom
    - Medium-high recurring potential, but paid-workspace count is undisclosed
    - Paid workspace count, churn, enterprise share
  - - Compute services
    - Usage-priced web services, workers, databases, and related infrastructure
    - Per service plan / usage
    - Pricing page shows service SKUs such as Starter web services at $7/month and Standard at $25/month
    - Medium; usage-linked and variable, with realized mix undisclosed
    - Revenue split and gross profit by service family
  - - Usage overages
    - Additional domains, build minutes, and bandwidth above included amounts
    - Per domain / 1000 minutes / GB
    - $0.25 per extra domain, $5 per extra 1000 build minutes, $0.15 per GB bandwidth
    - Medium; scales with active usage but can be lumpy
    - Attach rate and average overage revenue per paid workspace
  - - Governance / compliance packaging
    - Plan-gated security and admin controls for teams
    - Bundled with higher workspace plans
    - Pro adds audit logs and compliance reports; Scale adds SSO, SCIM, RBAC, HIPAA-enabled workspaces
    - Medium-high if these features lock in team accounts
    - Enterprise contract count, realized discounts, expansion rate
  - - AI / workflow expansion
    - Higher-value orchestration and stateful workload primitives
    - Per task / compute / unknown
    - Workflows bill on compute usage; monetization of newer AI primitives is not separately disclosed
    - Low-medium near term because attach rate is undisclosed
    - Workflow revenue, AI workload mix, gross margin by workload type
  notes: 'Public scope only: rows capture monetization mechanisms explicitly visible in Render pricing, changelog, blog, and product materials; they do not imply disclosed revenue contribution by stream.'
