- id: cost-structure-and-unit-economics
  title: Cost Structure, Gross-Margin Drivers, and Unit Economics
  body: 'Render''s core unit-economics narrative is plausible but not fully disclosed. CNBC reports the company still runs on AWS and Google Cloud Platform while testing its own servers, which is the clearest public clue on cost structure. If successful, that shift could lower unit costs and support lower prices or better gross margins; if mishandled, it introduces hardware procurement and capacity risks that do not exist under a pure hyperscaler pass-through model. Product documentation also shows that Render is leaning into long-running background jobs, private networking, and Workflows for stateful AI workloads, which likely carry different cost profiles than static sites or simple web services. The financial blind spot is that none of the public materials disclose gross margin, cloud-spend burden, support cost, burn, or cash runway. Adverse evidence matters here: Trustpilot complaints about billing clarity, support response, and unreliable free-tier behavior, plus multiple recent status
    incidents, create potential drag on monetization quality even if top-line demand is strong.'
  claimRefs:
