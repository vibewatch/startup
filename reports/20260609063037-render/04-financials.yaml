- id: capital-adequacy-and-funding-context
  title: Capital Adequacy and Funding Context
  body: 'Public financing evidence is good enough to sketch chronology but not liquidity. The company disclosed a $100 million Series C extension in February 2026 at a $1.5 billion valuation, taking total funding to $258 million. TechCrunch reported that the June 2023 Series B brought total funding to $77.5 million, and the SEC materials for Render Services, Inc. show a historical Form D connected to early fundraising. Tracxn''s archived 2025 profile also pointed to about $157 million raised before the new extension. That makes the 2026 round look like incremental growth capital rather than an emergency recapitalization, especially because CNBC paired it with revenue growth well above 100% and new technical hiring. What is still missing is the actual balance sheet: no public source here discloses cash on hand, monthly burn, runway, working-capital needs, or hardware capex commitments tied to owned servers. We also found no public evidence of debt facilities or project-finance obligations,
    but absence of disclosure is not proof of absence.'
