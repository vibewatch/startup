- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public status
  - Impact
  - Exact diligence path
  rows:
  - - Absolute revenue / ARR
    - Undisclosed
    - Prevents revenue-base, growth-quality, and multiple analysis
    - Request monthly revenue bridge, ARR, and trailing-twelve-month revenue by product
  - - Revenue mix by product
    - Undisclosed
    - Cannot tell whether subscriptions, compute, databases, or AI/workflows dominate monetization
    - Request product P&L with list-to-realized waterfall by plan
  - - Gross margin / cloud spend / owned-server economics
    - Undisclosed
    - Blocks evaluation of software leverage versus infrastructure pass-through
    - Request gross profit by product, hyperscaler spend, and owned-server depreciation assumptions
  - - Cash balance / burn / runway
    - Undisclosed
    - Capital adequacy cannot be verified from fundraising headlines alone
    - Request latest balance sheet, cash-flow statement, and runway scenario model
  - - CAC / payback / NRR
    - Undisclosed
    - Top-of-funnel scale may not translate into efficient or durable revenue
    - Request free-to-paid conversion, cohort retention, expansion, and payback by segment
  - - Realized pricing / discounting / customer concentration
    - Undisclosed
    - List pricing does not reveal true yield or exposure to a small number of large accounts
    - Request contract ASPs, discounting policy, and top-customer concentration
  notes: Every row is a genuine evidence gap, not an omitted estimate. These are the private metrics required before a full underwriting model is credible.
