  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Absolute revenue, ARR, and monthly revenue by product family and customer segment.
    whyItMatters: Without a revenue base and mix, it is impossible to underwrite growth quality, concentration, or valuation multiples.
    diligencePath: Request board materials or finance-pack revenue bridges with monthly recurring, usage, and enterprise revenue split.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross profit bridge separating hyperscaler spend, owned-server depreciation, support, and third-party service costs.
    whyItMatters: Margin path depends on whether Render can actually convert packaging and infrastructure choices into durable contribution margin.
    diligencePath: Request gross margin by product family plus cloud-vendor bills and owned-hardware depreciation assumptions.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash balance, monthly burn, and management runway scenario under base and downside cases.
    whyItMatters: Capital adequacy cannot be verified from a headline financing announcement alone.
    diligencePath: Request latest balance sheet, monthly cash-flow statement, and runway model used internally after the 2026 extension.
    relatedQuestionRefs:
    - QI015
    - QI020
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, payback, free-to-paid conversion, gross retention, and net revenue retention by cohort.
    whyItMatters: A large developer funnel only creates durable value if acquisition and expansion economics are efficient.
    diligencePath: Request funnel conversion, S&M spend by channel, and cohort retention and expansion by workspace segment.
    relatedQuestionRefs:
    - QI008
    - QI013
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Average realized workspace ARPU, enterprise discounting, and overage incidence by plan.
    whyItMatters: List prices and packaging changes do not reveal actual yield or price elasticity.
    diligencePath: Request a price waterfall from list to realized revenue by workspace plan, account size, and contract type.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI012
    - QI024
    - QI025
    relatedTableRefs:
