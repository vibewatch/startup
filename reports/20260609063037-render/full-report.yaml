    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Platform Scope
        blocks:
          - type: paragraph
            body: >-
              Render is a San Francisco cloud-platform company founded in 2018 and still led publicly by founder-CEO
              Anurag Goel. Across its official about, careers, and financing materials, the company presents itself as a
              modern cloud for software teams that want to deploy faster without assembling raw infrastructure
              primitives themselves. Public product descriptions consistently frame Render as a full-stack application
              platform rather than a single-service hosting tool.


              The core platform now spans web services, private services, static sites, background workers, cron jobs,
              managed Postgres, private networking, and infrastructure-as-code via Blueprints. That breadth matters for
              later diligence chapters because it means Render is trying to be the primary runtime for application
              teams, not just an edge-hosting or frontend platform. The same official corpus also shows a globally
              distributed remote team and a hiring posture built around long-term company building, which reinforces
              that Render is still in active expansion mode rather than operating as a narrowly optimized cash-yield
              asset.
