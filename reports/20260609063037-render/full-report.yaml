      - number: '3.2'
        title: Direct peers and packaging
        blocks:
          - type: paragraph
            body: >-
              Railway is the closest experience-level challenger. Its homepage emphasizes auto-configuration, service
              topology, built-in observability, private connections, and protocol support, while its pricing keeps entry
              low with credit-based onboarding and usage-based plans. Fly.io is a different style of rival: more
              infrastructure-forward, global, and container-centric, with Machines, explicit resource billing, and
              managed Postgres for operators who want fine-grained control. Heroku remains the reference incumbent
              because it still offers managed containers, data services, and a large ecosystem, but its economic posture
              is unapologetically paid and enterprise-tilted. DigitalOcean App Platform is more SMB-price-led, pitching
              simpler app deployment, preview environments, and lower cost for APIs and microservices. This means Render
              is not fighting one homogeneous field. Railway attacks on developer experience and easy full-stack
              assembly, Fly.io attacks on flexibility and global control, Heroku attacks on incumbent familiarity, and
              DigitalOcean attacks on affordability.
