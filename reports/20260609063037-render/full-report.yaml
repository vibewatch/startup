      - number: '8.2'
        title: Recommendation, confidence, risk, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a research-more recommendation, not a buy call. The positive side of the
              ledger is real: Render claims more than 4.5 million developers on platform, CNBC says growth is well above
              100%, and Gartner’s 2026 forecast points to unusually strong AI-infrastructure demand. That is enough to
              say the company is not being financed on narrative alone. But the negative side matters more at today’s
              price. The same announcement set that supports the round does not disclose ARR, revenue run rate, gross
              margin, net retention, or customer concentration. Trustpilot complaints around billing and support, plus
              recent incident history on IncidentHub and Render’s own status page, also argue against assigning an
              unquestioned premium multiple. Public comps with clearer disclosures give investors far more financial
              detail than Render does today. As a result, confidence is only medium, risk should be treated as high, and
              valuation stance should be treated as stretched rather than attractive until private diligence can show
              that monetization and margins justify the mark.
