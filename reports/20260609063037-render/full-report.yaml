      - number: '3.3'
        title: Frontend adjacencies and AI workloads
        blocks:
          - type: paragraph
            body: >-
              Vercel and Netlify compete for a different but strategically important slice of demand. Their surfaces
              foreground previews, functions, framework ergonomics, AI-oriented web tooling, and collaboration speed,
              which makes them formidable when the buyer thinks of deployment as a web-delivery workflow rather than an
              application-platform problem. That is why they can siphon demand from Render even when they are not
              perfect substitutes for stateful apps. Cloud Run broadens the competitive set further by handling frontend
              and backend services, queue processing, and hosted LLM workloads in a managed container model. AI agents
              make this distinction more important, not less. Render's own 2026 AI article argues that long-running
              agents and WebSocket-heavy applications need durable workers, data stores, and internal networking rather
              than short request ceilings. Vercel and Netlify are still relevant for agentic web apps and preview-driven
              teams, but the stateful, long-running AI slice tilts toward Render, Railway, Fly.io, and Cloud Run.
