      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The strongest growth driver is the rise of AI-enabled software creation. Gartner's 2026 AI
              spending forecast and the 2025 Stack Overflow survey both suggest more developers are using
              AI tools while enterprises keep allocating budget to AI-ready infrastructure. That demand does
              not guarantee Render wins it, but it expands the pool of teams needing stateful backends,
              streaming, background work, and lower-ops deployment choices. Additional drivers include the
              persistence of free or near-free onboarding across the category, dissatisfaction with older
              PaaS economics, and growing aversion to stitching multiple infrastructure products together by
              hand.

              Constraints are equally clear. Hyperscaler inertia is real: many companies default to AWS or
              GCP-managed services for procurement, compliance, or standardization reasons. Migration is not
              trivial once runtime, data, CI/CD, networking, and team routines are embedded elsewhere.
              Compliance and governance raise friction in larger accounts. Price sensitivity is acute in the
              core developer and startup segment because substitutes anchor expectations with free tiers,
              usage-based pricing, or $5–$20 starter plans. And several incumbents hold strong positions in
              slices of the workload map: Vercel and Netlify in frontend/serverless, Supabase in
              database-first backends, Cloud Run and App Runner in hyperscaler-managed container hosting,
              and Fly.io or Railway for teams that want different control-versus-simplicity trade-offs.
