      - number: '3.4'
        title: Switching costs, lock-in, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Switching cost is highly workload-specific. Once a Render deployment uses private service hostnames,
              managed Postgres, HA settings, persistent disks, cron jobs, and worker processes, moving is no longer just
              a DNS change: it requires data migration, job migration, service discovery changes, and re-encoding
              infrastructure. Blueprints add a modest extra layer of stickiness because they describe multi-service
              infrastructure in Render's own IaC format. By contrast, static sites, preview environments, and
              lightweight API wrappers can multi-home relatively easily because several rivals offer Git-connected
              deploys, previews, and short-lived functions. That means Render is most defensible deeper in the
              application stack than at the presentation layer. The open question is distribution power. Vercel and
              Netlify likely enjoy more inbound gravity for frontend teams, but the retained public evidence does not
