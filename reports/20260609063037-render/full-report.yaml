  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Render sells a unified cloud runtime for software teams that want to ship from Git without separately
              assembling compute, private networking, managed data, job execution, and deployment tooling. Across its
              pricing page, GitHub app page, and documentation, Render publicly lists static sites, web services,
              private services, background workers, cron jobs, Render Postgres, Render Key Value, Workflows, Blueprints,
              preview environments, CLI, and MCP tooling. That service map matters because it positions Render as a
              primary operating platform for full-stack applications rather than a narrow frontend host.

              The customer workflow is also clear in public materials. A team connects a Git repository or Docker image,
              defines services in the dashboard or a render.yaml Blueprint, and lets Render build and deploy on push.
              Public-facing traffic lands on static sites or web services; internal logic can move to private services,
              background workers, cron jobs, and Workflows; state can live in Postgres, Key Value, or in limited cases
              on persistent disks. The operations loop then runs through native metrics/logs, the REST API, CLI, status
              page, and MCP surfaces. This workflow is materially better aligned with long-lived APIs, worker queues,
              WebSockets, and agentic systems than with pure JAMstack or short-lived function workloads.
            claimRefs:
