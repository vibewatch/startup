  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Render's risk stack is led by three severity-one items. First, operational reliability is good enough to
              show real resilience but not good enough to remove concern: the public status page still shows meaningful
              variance by component and region, including Singapore at 99.57% uptime over the displayed 90-day window,
              and recent incidents affected logs, metrics, GitHub connections, verification emails, custom domains, and
              Oregon Postgres connectivity. Second, infrastructure dependence is becoming more complex rather than
              simpler. CNBC says Render still runs on AWS and Google Cloud Platform, while also testing its own servers
              to reduce costs and prices; that creates a dual risk where the company remains exposed to hyperscaler
              incidents today while taking on hardware capacity and execution risk tomorrow. Third, the business model
              is increasingly tied to AI-native demand and enterprise procurement outcomes. Gartner still expects AI
              spending to surge in 2026, but it also warns that spending remains infrastructure-led and that enterprises
              have not yet broadly proven AI value. The thesis survives if Render keeps incident cadence contained,
              converts compliance and reliability investments into enterprise trust, and scales AI-heavy workloads
              without a support-quality backlash. It breaks if owned-server execution, partner incidents, and AI-demand
              normalization arrive simultaneously.
