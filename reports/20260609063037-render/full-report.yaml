  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Render’s public valuation anchor is straightforward but incomplete. The company announced a $100 million
              Series C extension in February 2026 at a $1.5 billion post-money valuation, bringing total disclosed
              funding to $258 million and adding Georgian alongside existing investors including Addition, Bessemer,
              General Catalyst, and 01A. Historical public reporting shows a $50 million Series B in 2023, while
              Tracxn’s 2025 profile still listed only $157 million raised before the extension. SEC Form D evidence
              confirms that Render has long relied on outside capital, but it does not illuminate the economics of the
              latest round. Entry discipline therefore has to separate price discovery from value discovery: the round
              proves sophisticated investors were willing to pay $1.5 billion, but the public record still omits the
              revenue base, gross margin, retention profile, burn, and financing terms needed to decide whether that
              price is conservative or aggressive for a new investor. On public evidence alone, the right posture is to
              treat $1.5 billion as a real financing reference and not as a completed underwriting conclusion.
            claimRefs:
              - CV001
