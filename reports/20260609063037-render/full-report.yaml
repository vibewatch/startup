      - number: '8.3'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Render is that it has reached a rare combination of developer adoption, strong growth, and
              a timely AI-native product narrative just as spending on AI infrastructure accelerates. The official and
              CNBC disclosures imply that the company is converting product relevance into real platform adoption at
              scale, while the extension round shows investors were willing to fund that story at a meaningful step-up.
              The anti-thesis is that the company may still be too opaque to value responsibly. PaaS market studies all
              point upward, but their wide range also shows how easy it is to overfit large TAM narratives to a specific
              company. Meanwhile, Render competes against a deep bench of funded private players such as Railway,
              Vercel, and Fly.io as well as better-disclosed public companies like DigitalOcean, Fastly, and Cloudflare,
              not to mention hyperscaler substitutes. Support and billing complaints, recent incidents, and the move
              toward owned servers all add execution risk precisely where the public record is thinnest. The company may
              be excellent; the question is whether the current price already assumes more proof than public evidence
              provides.
