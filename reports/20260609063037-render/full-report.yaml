      - number: '8.6'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing work is unusually clear. Before treating the current mark as investable, an investor should
              request current ARR or revenue run rate, gross margin and contribution margin by workload, paid conversion
              and net retention data, the cap table and preference stack, and detailed economics for any owned-server
              deployment. Those items are not cosmetic; they directly determine whether the $1.5 billion headline
              valuation maps to durable economics or simply to momentum and scarcity. The thesis should also have crisp
              break conditions. If private diligence reveals revenue or recurring spend materially below the level
              needed to support a premium developer-cloud multiple, if financing documents show a structure that heavily
              favors existing preferred holders, if owned-server efforts add capex without margin lift, or if support
              and reliability issues keep recurring, the current mark should be treated as vulnerable to a flat or down
              round. Conversely, if management can prove strong monetization, healthy retention, and a clean term
              structure, the current recommendation could move up quickly because the top-of-funnel adoption and market
              backdrop are already strong enough to justify continued work.
