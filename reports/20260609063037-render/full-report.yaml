  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Residual-severity map of Render's principal risk buckets using only publicly supported evidence.
    data:
      columns:
        - Regulatory / legal
        - Reliability / incidents
        - Infrastructure / dependency
        - Competition / procurement
        - Financial / model
      rows:
        - label: Critical residual
          values:
            - No public SLA in reviewed corpus
            - Regional or control-plane incident cluster
            - AWS/GCP dependence plus owned-server transition
            - Explicit-SLA rivals displace Render in enterprise deals
            - AI-demand or price compression breaks valuation narrative
        - label: High residual
          values:
            - HIPAA and compliance execution remains plan-gated
            - Support and billing trust erosion
            - GitHub and upstream-provider incident spillover
            - Railway, Vercel, and DigitalOcean narrow perceived reliability gap
            - Opaque gross-margin path during infrastructure shift
        - label: Medium residual
          values:
            - DPF and transfer-mechanism upkeep
            - Cron-job and workflow maturity limits
            - Cloudflare and ClickHouse subprocessor dependence
            - Heroku, Cloud Run, and Fly.io remain viable substitutes
            - August workspace migration creates churn risk
        - label: Lower residual
          values:
            - Public legal documents exist
            - Private networking reduces east-west exposure
            - Postgres HA and backups reduce database downtime risk
            - Integrated product bundle still differentiates Render
            - Fresh capital reduces near-term solvency risk
    approximationNotes: Cells summarize public evidence and are not actuarial probabilities.
