      - number: '1.3'
        title: Funding History, Scale, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Render’s February 2026 financing is the anchor fact for this chapter. Company and news sources align that
              the business raised a $100 million Series C extension at a $1.5 billion valuation, led by Georgian with
              participation from Addition, Bessemer, General Catalyst, and 01A. Those same sources also align on $258
              million total funding and on a developer-scale narrative: 4.5 million-plus developers on the platform and
              250,000-plus new developers joining each month.


              The earlier financing history is thinner but still directionally clear. TechCrunch documented a $50
              million Series B in June 2023 that took total capital to $77.5 million and cited customers such as
              Watershed and Red Bull, while BusinessWire highlighted Render’s 2019 TechCrunch Startup Battlefield win.
              Taken together, the milestone sequence shows a company that moved from startup-competition validation to
              serious venture backing and then to an AI-era re-rating. The main remaining uncertainty is not whether
              Render is scaling, but how much of that scale is monetized into paying organizations, revenue
              concentration, and durable margin structure.
