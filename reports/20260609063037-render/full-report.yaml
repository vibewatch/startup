          conversion.
        - Breaks the idea that adoption scale supports the current mark.
        - Do not invest at the current valuation; re-underwrite at lower range.
      - - Preference-stack overhang
        - Financing documents show aggressive senior preferences, participation rights, or anti-dilution protections.
        - Reduces common-equity downside protection and raises effective entry valuation.
        - Demand a lower effective price or walk away.
      - - Owned-server economics miss
        - Capex rises without a visible gross-margin or performance benefit.
        - Turns a potential margin lever into an execution and cash-burn problem.
        - Treat as a negative valuation catalyst and re-rate toward bear case.
      - - Reliability / support deterioration
        - Incident cadence stays elevated or complaint patterns persist through enterprise scale-up.
        - Undermines premium-multiple arguments around platform quality and retention.
        - Require stronger operating evidence before investing.
      - - Competitive price compression
        - Railway, hyperscalers, or other peers force discounting for core workloads.
        - Weakens monetization, increases CAC pressure, and compresses forward multiples.
        - Shift case weighting toward base-to-bear and tighten entry discipline.
    notes: >-
      Triggers are designed to be monitorable and directly connected to valuation transmission rather than generic
      operating concerns.
    claimRefs:
      - CV019
      - CV045
      - CV046
      - CV047
      - CV049
      - CV053
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and ARR
        - Current run-rate revenue, ARR, and growth bridge from prior period.
        - Needed to translate the headline valuation into a supportable multiple.
        - Management KPI deck or CFO diligence session.
      - - Margins
        - Gross margin and contribution margin by workload and hosting model.
        - Determines whether owned-server expansion adds or destroys value.
        - Finance data room and infrastructure review.
      - - Retention and paid conversion
        - NRR, gross retention, paid-seat or paid-account conversion, and enterprise mix.
        - Required to judge durability of the 4.5M-developer adoption claim.
        - CRO / revenue-operations diligence.
      - - Financing terms
        - Cap table, preference stack, anti-dilution, and any secondary allocation.
        - Determines true economics at entry and downside protection.
        - Legal diligence with outside counsel and lead investors.
      - - Reliability and support
        - Incident frequency, SLA attainment, support backlog, and churn linked to service quality.
        - Tests whether adverse evidence is noise or a real scaling constraint.
        - Operations review and customer reference calls.
      - - Exit preparedness
        - Audited statements, governance maturity, banker dialogue, and IPO-readiness workstreams.
        - Clarifies whether upside should be framed around a public exit or private hold.
        - Board-level diligence and external advisor review.
    notes: >-
      These asks are the minimum package required to convert the current public-evidence view into a priceable
      investment decision.
    claimRefs:
      - CV018
      - CV019
      - CV046
      - CV047
      - CV051
      - CV053
