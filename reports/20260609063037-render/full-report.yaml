  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segmentation
        blocks:
          - type: paragraph
            body: >-
              Render's competitor set is easiest to understand by separating the job to be done. The most direct overlap
              is backend-first and stateful application hosting: teams that want Git-based deployment, managed services,
              and minimal infrastructure ceremony for always-on web apps, APIs, workers, and databases. In that lane,
              Railway, Fly.io, Heroku, and DigitalOcean App Platform are the clearest comparables. Vercel and Netlify
              matter, but mainly when the buying center is frontend velocity, preview links, framework-native web
              delivery, and short-lived function execution rather than long-running workers or integrated databases.
              Hyperscaler options such as Cloud Run, App Runner, and Elastic Beanstalk are credible substitutes, but
              they sit closer to internal build or cloud-assembly paths than to turnkey PaaS parity. Supabase is
              adjacent rather than fully peer-like because it fills the backend-data layer more than the general hosting
              layer. This segmentation matters because Render wins or loses by workload shape, not by one
              undifferentiated “PaaS” category.
            claimRefs:
