        title: Revenue Model, Pricing, and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Render's public monetization architecture is understandable even though reported financial output is not.
              The company uses a classic product-led funnel: a free Hobby entry point, paid Pro and Scale workspace
              subscriptions, usage-priced infrastructure, and overage charges on things like bandwidth, build minutes,
              and extra custom domains. The April 2026 workspace-plan reset moved Pro and Scale to flat monthly pricing
              with no seat fees, while the 2024 account-to-workspace migration explicitly said pricing was unchanged at
              that point. That combination suggests Render is trying to monetize collaboration and governance needs
              separately from raw compute consumption, which can improve revenue quality if team accounts become sticky.
              Public list prices are still only list prices: Render does not disclose realized discounts, the mix
              between subscriptions and infrastructure usage, or how much revenue comes from newer products like
              Workflows. That means the shape of monetization is visible, but the effective take rate and product mix
