      - number: '1.2'
        title: Founder Leadership and Governance Posture
        blocks:
          - type: paragraph
            body: >-
              The fetched public corpus is unusually founder-centric. CNBC, BusinessWire, and Tracxn all center Anurag
              Goel as the public face of the company, and CNBC adds the strongest founder-market-fit detail: Goel was
              Stripe’s eighth employee before founding Render. That experience matters because Render’s pitch relies on
              understanding developer workflows, infrastructure abstraction, and the economics of operating cloud
              services at software-company speed.


              Governance visibility, however, is materially thinner than product or funding visibility. Public sources
              clearly name major investors and show continued support from the core venture syndicate, but they do not
              expose a full current board roster, committee structure, or detailed ownership percentages. For diligence
              purposes, that means the company looks operationally mature enough to raise a nine-figure extension, yet
              still behaves like a founder-led private company whose internal governance is not fully inspectable from
              public documents alone. The leadership section should therefore be treated as partial and key-person
              dependence on Goel remains meaningful.
