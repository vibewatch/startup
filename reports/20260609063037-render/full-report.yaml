      - CV022
      - CV027
      - CV031
      - CV043
      - CV048
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The base case clusters around the latest round, the bull case requires much stronger private proof, and the bear
      case implies a meaningful down-round risk.
    data:
      items:
        - label: Bear case
          low: 0.75
          mid: 0.9
          high: 1.1
          detail: Weak monetization disclosure, pricing pressure, or operating friction drives a reset below the last round.
          tone: negative
        - label: Base case
          low: 1.2
          mid: 1.5
          high: 1.8
          detail: Current mark broadly holds if diligence confirms healthy monetization without major upside surprise.
          tone: warning
        - label: Bull case
          low: 2.5
          mid: 3.2
          high: 4
          detail: >-
            Requires strong enterprise monetization, durable retention, and premium growth treatment closer to
            Vercel-style outcomes.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based equity value illustrations in USD billions. They reflect case weighting and comp
      framing, not DCF or management guidance.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Render scores best on market demand and adoption momentum, but much lower on disclosure quality, valuation
      support, and execution-risk transparency.
    data:
      items:
        - label: Market demand
          score: 8
          detail: AI infrastructure tailwinds and broad PaaS growth support category expansion.
          tone: positive
        - label: Adoption proof
          score: 7
          detail: 4.5M+ developers and >100% growth commentary signal real traction.
          tone: positive
        - label: Financing support
          score: 6
          detail: Quality investors funded the round at a meaningful mark, validating interest.
          tone: neutral
        - label: Monetization proof
          score: 3
          detail: No disclosed ARR, revenue base, gross margin, or retention metrics.
          tone: negative
        - label: Competitive moat
          score: 5
          detail: Real product relevance, but crowded against Railway, Vercel, Fly, DigitalOcean, and hyperscalers.
          tone: warning
        - label: Operational resilience
          score: 4
          detail: Recent incidents plus support and billing complaints argue for caution.
          tone: negative
        - label: Valuation support
          score: 3
          detail: Current price can be defended only conditionally because the monetization denominator is undisclosed.
          tone: negative
        - label: Evidence quality
          score: 4
          detail: Enough to justify continued work, not enough to justify a conviction price call.
          tone: warning
    approximationNotes: >-
      Scores are 0 to 10 ordinal judgments synthesized from public evidence for investment-committee discussion; they
      are not factor-model outputs.
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV018
      - CV044
      - CV045
      - CV046
      - CV052
      - CV053
