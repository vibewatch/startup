          - type: callout
            title: Free-Tier Competition and Hyperscaler Defaults Cap Obtainable Share
            body: >-
              Render's core buyer base is attractive but price-sensitive, and many adjacent workloads can stay on
              Vercel, Netlify, Supabase, Cloud Run, App Runner, or legacy PaaS. That means Render's real constraint is
              not whether the cloud market is large, but whether it can displace existing defaults once a team has
              already committed to another workflow or procurement ecosystem.
