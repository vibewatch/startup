        - Web delivery, previews, AI web tooling, developer mindshare
        - Not the cleanest fit for long-running stateful services
      - - Netlify
        - Adjacent competitor
        - Static or frontend-led apps with previews and serverless glue
        - Free plan plus credit model on paid tiers
        - Deploy previews, Functions, AI models, Agent Runners
        - No first-party managed database position in the retained evidence
      - - Cloud Run
        - Incumbent substitute
        - Containers, batch jobs, queue workers, hosted LLMs
        - Managed container service with two million free requests per month
        - Hyperscaler ecosystem, broad workload envelope, container portability
        - Closer to cloud-native assembly than to integrated PaaS simplicity
