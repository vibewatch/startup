        title: Trust, Security, Compliance, and Public Gaps
        blocks:
          - type: paragraph
            body: >-
              Render's public trust posture is stronger than that of many smaller developer-cloud platforms. The
              security and compliance surfaces publicly list ISO 27001, SOC 2 Type 2, GDPR-DPA, HIPAA-ready
              infrastructure, and EU-US/UK/Swiss Data Privacy Framework coverage. The dashboard document center adds
              distribution detail by showing which documents are broadly visible and which require NDA-gated access for
              Organization and Enterprise workspaces. Public pages also expose abuse and security reporting contacts
              plus a HackerOne-based vulnerability disclosure path. That is enough to conclude that security and
              compliance are active product vectors rather than afterthoughts.

              The diligence gap is in depth, not in total absence. Public pages do not disclose a contractual SLA,
              formal RTO/RPO, detailed tenant-isolation architecture, key-management design, penetration-test results,
              BAA process detail, or broad production usage metrics for newer surfaces like Workflows and MCP.
              Independent signals also remind investors that developer experience is not uniformly excellent: Trustpilot
              complaints cite free-tier sleeping, Bad Gateway wake-up issues, and billing disputes, while independent
              monitoring captured recent incidents touching GitHub connections, custom domains, metrics, and Postgres
              connectivity. The net read is credible trust posture with real enterprise intent, but still not enough
              public detail to underwrite regulated or mission-critical workloads without direct diligence access.
