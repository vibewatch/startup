      - number: '7.2'
        title: Regulatory, Legal, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Render's legal and regulatory profile is more about execution and procurement friction than about any
              visible enforcement action. The company publicly advertises ISO 27001, SOC 2 Type 2, GDPR-DPA, HIPAA
              readiness, and Data Privacy Framework coverage, and it now exposes some compliance documents directly in
              the dashboard while gating more sensitive materials behind NDA and higher workspace tiers. Those are real
              mitigants for enterprise diligence. But the same evidence also shows where risk remains. HIPAA capability
              is plan-gated rather than universal, and the relevant regulatory framework is the HHS Security Rule, which
              means Render's product marketing does not remove customer responsibility for compliant architecture and
              operations. Render also maintains public Privacy Policy, Terms of Service, and Data Processing Addendum
              pages, yet the reviewed corpus did not surface a public SLA or uptime-credit policy comparable to what
              some rivals publish. That does not prove Render lacks private contractual remedies for enterprise
              customers, but it does mean public evidence is stronger on certifications and document availability than
              on service remedies. The compliance story is therefore credible enough to support diligence, but not yet
              strong enough to erase contracting friction for regulated or uptime-sensitive buyers.
