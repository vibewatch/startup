    rows:
      - - Render
        - Subject
        - Always-on APIs, workers, Postgres-backed full-stack apps
        - Free-tier prototype path plus paid managed services
        - Integrated workers, cron, private networking, managed Postgres, disks, Blueprints
        - Weaker than frontend specialists for preview-first or pure-edge workflows
      - - Railway
        - Direct peer
        - Fast multi-service full-stack apps and internal tools
        - Usage-based; free trial then $1 credits, $5 Hobby minimum, $20 Pro minimum
        - Autoconfig, service graph, private networking, built-in observability
        - Persistent always-on usage can outgrow the low-credit entry path
      - - Fly.io
        - Direct peer
        - Global, infra-forward apps needing container and placement control
        - Usage-based resource billing with per-resource line items
        - Machines, global placement, infra control, managed Postgres
        - Higher operational complexity and less turnkey abstraction
      - - Heroku
        - Direct peer / incumbent
        - Managed app deployment for teams that value ecosystem familiarity
        - Paid dynos, data services, and AI pricing; no visible hobby-first free path
        - Incumbent brand, add-ons, managed containers, data services
        - Higher economic floor than newer developer-cloud rivals
      - - DigitalOcean App Platform
        - Direct peer
        - SMB frontends, APIs, and microservices
        - Price-led posture; exact entry pricing not stated on the cited page
