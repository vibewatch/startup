  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The current valuation only looks clearly reasonable if Render’s undisclosed revenue base is already well into nine
      figures; below that, the implied multiple becomes demanding.
    data:
      items:
        - label: Revenue needed at 20x
          value: 0.075
          detail: $75M revenue needed to support $1.5B at 20x.
          tone: positive
        - label: Revenue needed at 15x
          value: 0.1
          detail: $100M revenue needed to support $1.5B at 15x.
          tone: warning
        - label: Revenue needed at 10x
          value: 0.15
          detail: $150M revenue needed to support $1.5B at 10x.
          tone: warning
        - label: Revenue needed at 7.5x
          value: 0.2
          detail: $200M revenue needed to support $1.5B at 7.5x.
          tone: warning
        - label: Revenue needed at 5x
          value: 0.3
          detail: $300M revenue needed to support $1.5B at 5x.
          tone: negative
    approximationNotes: >-
      Values are simple valuation-divided-by-multiple calculations in USD billions of annual revenue; they are
      sensitivity markers, not forecasts.
