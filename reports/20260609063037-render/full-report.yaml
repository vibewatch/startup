      - number: '8.4'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The scenario range is best expressed as valuation bands rather than pseudo-precise discounted cash flow
              outputs because Render does not disclose the core financial inputs needed for a formal model. A bull case
              above $2.5 billion requires more than just continued product excitement: it requires private diligence to
              confirm that Render has already reached substantial recurring revenue, that monetization is converting the
              developer base into enterprise spend, and that owned-server experimentation improves rather than harms
              gross margin. A base case around the current round suggests the February 2026 mark is roughly fair if
              growth stays very strong and quality metrics turn out to be healthy, but not obviously cheap on public
              evidence alone. A bear case below the round becomes plausible if monetization depth disappoints, AI demand
              proves cyclical, pricing pressure intensifies, or reliability and support frictions create churn or
              discounting pressure. Sensitivity work underscores the problem: at $1.5 billion, the implied revenue
              multiple swings from about 15x at $100 million of revenue to 5x at $300 million, and public sources do not
              reveal where Render actually sits on that spectrum.
