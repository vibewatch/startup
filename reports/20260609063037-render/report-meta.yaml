companyProfile:
  summary: Render is a San Francisco developer-cloud company founded in 2018 and led
    by founder-CEO Anurag Goel, an early Stripe employee. The platform bundles web
    services, private services, background workers, cron jobs, managed Postgres and
    Key Value, persistent disks, private networking, Blueprints infrastructure-as-code,
    and newer Workflows/MCP capabilities into a developer-first alternative to hyperscaler
    complexity. Render’s February 2026 $100 million Series C extension at a $1.5 billion
    valuation brought total disclosed funding to $258 million and underscored a strategic
    push toward “the cloud for AI-native software,” but public disclosures still stop
    short of revealing ARR, gross margin, retention, or paying-customer count.
