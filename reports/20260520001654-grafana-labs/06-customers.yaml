  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention disclosure gap
    missingEvidence: Segmented GRR, NRR, logo churn, and cohort retention tables for Grafana Cloud, Enterprise, and public-sector customers.
    whyItMatters: Without cohort disclosure, customer durability is being inferred from migration effort and workflow embed rather than measured renewals.
    diligencePath: Request cohort tables by segment plus last-12-month churn and renewal commentary from finance and sales operations.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration disclosure gap
    missingEvidence: Top-10 customer ARR share, top-10 partner-sourced ARR share, and largest-renewal exposure by quarter.
    whyItMatters: A 7,000-customer count can still mask outsized dependence on a few Fortune 50 accounts or channel relationships.
    diligencePath: Request customer concentration schedule, partner-sourced pipeline/ARR split, and largest upcoming renewals.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: free-to-paid conversion
    missingEvidence: Conversion rates from OSS or free-tier usage into Pro, Advanced, Enterprise, and Federal Cloud contracts.
    whyItMatters: The PLG narrative is compelling, but underwriting CAC efficiency requires actual conversion, expansion, and payback data.
    diligencePath: Request funnel data from growth and finance covering signups, activated teams, paid conversion, and expansion by cohort.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage
    missingEvidence: More independent, customer-authored ROI or renewal disclosures for large-logo accounts beyond Booking.com, SpotOn, Microsoft, Salesforce, and Wikimedia.
    whyItMatters: The current public proof set is enough to prove real production adoption, but not enough to measure breadth of quantified outcomes across the full customer base.
    diligencePath: Prioritize customer reference calls and renewal histories for two Fortune 50 accounts plus one public-sector deployment.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU002
