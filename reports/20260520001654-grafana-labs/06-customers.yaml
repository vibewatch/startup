callouts:
- calloutType: strength
  title: Wide PLG funnel with credible enterprise conversion
  body: Grafana’s customer evidence is strongest where a very large open-source and free-cloud funnel intersects with real enterprise case studies like Booking.com, SpotOn, Microsoft, and Salesforce. The data does not prove perfect conversion efficiency, but it does prove that Grafana has crossed from community tool into production platform.
  claimRefs:
  - CU001
  - CU011
  - CU015
  - CU019
  - CU021
- calloutType: risk
  title: The biggest customer-side risk is complexity, not lack of demand
  body: 'Independent reviews point to the same adverse theme: Grafana is flexible and cost-effective, but that openness comes with setup, tuning, documentation, and support friction. If newer AI and guided workflows do not reduce that tax, Grafana may under-convert less sophisticated teams even while remaining beloved by expert operators.'
  claimRefs:
  - CU030
  - CU031
  - CU041
- calloutType: risk
  title: Retention and concentration still need private diligence, not narrative inference
  body: The public story is good enough to underwrite real adoption and likely stickiness, but not enough to underwrite renewals rigorously. No public NRR, GRR, cohort data, or top-account concentration schedule was found, so investors should treat retention and concentration as mandatory follow-up asks rather than solved questions.
  claimRefs:
  - CU037
  - CU038
  - CU039
