- id: SU003
  title: GTM motion combines developer-led entry with marketplaces and enterprise procurement
  body: |-
    Grafana’s monetization ladder remains fundamentally product-led, but the monetization mechanics are more enterprise-shaped than the open-source brand alone suggests. Official pricing still preserves a low-friction entry path with a genuinely usable free tier, while Pro adds paid support and higher limits and Enterprise introduces large annual commitments, custom retention, premium support, and deployment flexibility. That design supports a familiar land-and-expand motion: teams start with dashboards and a narrow telemetry footprint, then add more active users, more signals, more retention, and higher governance requirements over time. The AWS Marketplace page and 2026 AWS strategic collaboration show how Grafana tries to remove enterprise procurement friction once workloads are production-critical: buyers can transact through marketplace billing, draw down cloud commitments, and tap migration funding instead of treating Grafana as a standalone vendor line item.

    The channel story extends beyond hyperscalers. Azure Managed Grafana provides an upgrade path into Grafana Enterprise, and Carahsoft’s public catalog shows Grafana packaging cloud and enterprise SKUs for government buyers through a distributor-led route. Federal Cloud goes a step further by explicitly packaging observability for agencies, SLED, systems integrators, and vendors serving regulated environments. The result is not a pure self-serve SaaS motion and not a pure top-down enterprise motion. It is a hybrid GTM: bottoms-up developer adoption creates internal demand, while marketplaces, distributors, and compliance packaging make the large-deal procurement path easier once Grafana becomes infrastructure rather than a point tool.
