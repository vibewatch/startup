- id: TU005
  title: Retention, expansion, and concentration signals
  columns:
  - Signal
  - Public value
  - Interpretation
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - NRR / expansion
    - 'null'
    - Likely positive because spend rises with more telemetry, users, retention, support, and compliance needs
    - Medium
    - Usage-based models can compound well if deployed teams keep broadening footprint
    - Request NRR by cloud, enterprise, and federal segments
  - - GRR / churn
    - 'null'
    - Not publicly disclosed
    - Medium
    - Cannot directly underwrite logo durability from public materials
    - Request GRR, logo churn, and gross dollar churn
  - - Workflow stickiness
    - Qualitative only
    - Booking.com and SpotOn both describe deep operational embed and migration effort
    - Medium
    - Suggests switching costs once dashboards, alerts, and labels are standardized
    - Request renewal commentary and implementation timelines by segment
  - - Customer concentration
    - 'null'
    - 7,000+ customers is broad, but no top-account ARR concentration is disclosed
    - Medium
    - A few Fortune 50 or public-sector accounts could still matter disproportionately
    - Request top-10 customer ARR share and renewal schedule
  - - Partner concentration
    - 'null'
    - Marketplace and distributor routes are visible, but partner-sourced revenue split is not public
    - Medium
    - Channel dependence can distort renewal and pricing power if too concentrated
    - Request partner-sourced pipeline and ARR share
  - - Adoption friction
    - Learning curve / support variance
    - Independent reviews cite complexity, documentation gaps, and uneven support
    - Medium
    - Complexity can slow expansion or hurt less sophisticated cohorts
    - Split health metrics by sophisticated cloud-native teams vs less-resourced buyers
  notes: The string “null” means the company has not publicly disclosed a reliable figure in the sources reviewed for this chapter; it does not mean the true value is zero.
