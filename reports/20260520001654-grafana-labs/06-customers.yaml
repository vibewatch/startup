chapter:
  number: 6
  title: Customers
  summary: 'Grafana Labs shows unusually broad customer surface area for an observability vendor: the public record supports 25M+ users, 7,000+ customers, meaningful enterprise reach, and credible production proof at Booking.com, SpotOn, Microsoft, Salesforce, and in community operations like Wikimedia. The underwriting read is favorable on adoption breadth, PLG-to-enterprise GTM design, and likely workflow stickiness, but still incomplete on the hard diligence questions that matter most for durability—NRR/GRR, cohort retention, partner-sourced revenue share, and top-account concentration.'
sections:
- id: SU001
  title: Customer base segmentation and top-of-funnel scale
  body: |-
    Grafana’s customer story starts with a very large adoption surface and then narrows into monetized production buyers. The strongest public anchor is not a revenue cohort table, but a combination of official scale claims and independent install proxies: Grafana says it now reaches more than 25 million users and more than 7,000 customers worldwide, while independent install-tracking data still shows broad use across finance, business services, retail, and software. That combination matters because it supports the core PLG thesis: the open-source and free-cloud entry points are genuinely broad enough to create a meaningful conversion pool rather than a marketing abstraction.

    The buyer ladder is also unusually heterogeneous. Individual developers and small teams can start on OSS or the free tier. Team leads and platform engineers then become the internal champions who standardize dashboards, alerting, and telemetry pipelines. Procurement only becomes central once security, retention, compliance, or spend commitments rise enough to justify Pro, Enterprise, or Federal Cloud. That means the buyer, user, and payer are often different at each stage: developers trigger the initial deployment, platform teams operationalize it, and central IT, security, or procurement pays once Grafana becomes shared infrastructure. The chapter-level read is that Grafana’s customer base is best segmented into community users, self-serve cloud teams, mid-market platform teams, large enterprise standardizations, and public-sector or regulated buyers rather than into one uniform customer archetype.
