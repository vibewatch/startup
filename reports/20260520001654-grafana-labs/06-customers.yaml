- id: SU004
  title: Stickiness appears high, but retention and concentration disclosure are still thin
  body: |-
    The retention case for Grafana is intuitive, but still under-disclosed. Public case studies make clear why deployed accounts can become sticky: Grafana often sits at the intersection of dashboards, alerting, routing, and telemetry normalization. Booking.com describes a multi-year stack transition tied to centralized telemetry and operational simplification. SpotOn describes a new operating model where ownership, routing, and troubleshooting all depend on standardized Grafana data. Those are not casual deployments. They suggest that once Grafana becomes part of the team’s day-to-day workflow, the switching cost is not just the software subscription; it is the institutional work required to re-plumb dashboards, alerts, labels, runbooks, and cross-team troubleshooting habits.

    What is missing is the hard retention math that would turn that intuition into underwritten durability. No public source reviewed here discloses NRR, GRR, logo churn, or cohort retention. Public materials also do not disclose top-customer concentration, top-partner concentration, or how much commercial revenue flows through cloud marketplaces versus direct sales. That means this chapter can underwrite stickiness qualitatively but not fully underwrite renewal quality quantitatively. The right read is positive but conditional: Grafana looks like a business with real workflow embed and natural usage-based expansion, but investors should still ask for explicit cohort and concentration schedules before treating that intuition as proven durability.
  claimRefs:
