- id: technical-regulatory-risks
  title: Technical, regulatory, and dependency risks
  body: |-
    The deepest product-side risk is not basic feature insufficiency but the operational burden of serving more signals, more workloads, and more compliance-heavy buyers at once. Grafana is explicit that Loki had to be redesigned for structured logs, analytical queries, and higher-cardinality workloads, and that Pyroscope 2.0 needed a ground-up rearchitecture to lower cost and complexity. That is healthy product investment, but it also tells investors that scale pressure is already real. Add k6, marketplace expansion, and new partner integrations, and the platform surface gets broader at the same time that every new layer must remain operationally coherent for users who already say complexity is their biggest pain point.

    Regulatory obligations intensify the same complexity problem. Grafana now sells a FedRAMP High and IL5-cleared managed product, offers enterprise security documentation and audits, and faces customer expectations shaped by GDPR breach timelines and NIS2 board-level accountability. Those are valuable capabilities and clear mitigants for regulated demand, but they also create more processes, audits, disclosures, and partner dependencies. The AGPL change adds another legal dimension: it helps sustainability against uncompensated hosted use, yet it introduces policy friction for enterprises and any service operator sensitive to network-copyleft obligations. In other words, Grafana’s legal and technical architecture is increasingly powerful, but increasingly difficult to keep simple.
