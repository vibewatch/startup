  - CR058
- calloutType: strength
  title: Best current mitigation
  body: Grafana’s strongest offset is community-plus-platform breadth. A 35-million-user footprint, meaningful ARR, adaptive telemetry messaging, and real regulated-cloud packaging give it more defensive options than a narrower observability point tool.
  claimRefs:
  - CR036
  - CR038
  - CR039
  - CR052
  - CR053
- calloutType: recommendation
  title: Private diligence must now shift to economics
  body: Before underwriting a premium private valuation, investors should require burn, gross margin by signal, NRR/GRR, plugin attach, partner-sourced bookings, and concentration data. Those missing metrics now matter more than whether Grafana has product relevance.
