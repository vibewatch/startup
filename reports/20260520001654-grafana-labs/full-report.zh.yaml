  - id: TE005
    title: 技术栈表
    columns:
      - 层
      - 主要实现
      - 代表性技术
      - 运营收益
      - 主要注意点
    rows:
      - - 展示层与控制平面
        - Grafana OSS / Enterprise / Cloud 部署形态
        - 仪表盘、Explore、告警、数据源查询编辑器
        - 面向多个后端的一套运维界面
        - 价值取决于关联能力和治理深度是否足以支撑标准化
      - - 采集与路由
        - Grafana Alloy 加 SDKs / 代理
        - OTLP、Prometheus 流水线、集群、远程配置、内置 UI
        - 用单一采集器叙事覆盖指标、日志、追踪和性能剖析数据
        - 从旧代理迁移会带来短期摩擦
      - - 指标存储
        - Grafana Mimir
        - Prometheus 兼容摄取、多租户、记录规则和告警规则
        - 不放弃 Prometheus 工作流，也能扩展长期指标存储
        - 分布式运维在规模化时仍需要专业能力
      - - 日志存储
        - Grafana Loki
        - 基于标签的索引、LogQL、Grafana 原生链接
        - 成本更低、运营更简单，比全索引替代方案更省事
        - 搜索模型依赖良好的标签治理
      - - 链路追踪存储
        - Grafana Tempo
        - 对象存储、TraceQL、Jaeger / Zipkin / OTel 协议
        - 让高容量追踪更便宜，并与其他信号打通
        - 功能理解比简单的 trace-ID 查询故事更复杂
      - - 性能剖析存储
        - Grafana Pyroscope
        - 连续性能剖析、pprof 端点、火焰图、对象存储
        - 补上代码级可见性和优化工作流
        - 相比仪表盘或日志，性能剖析仍要求组织更成熟
      - - 测试与合成执行
        - Grafana k6 与 Cloud Synthetics
        - JavaScript 脚本、浏览器 API、WebSockets、gRPC、CI/CD 自动化
        - 把主动可靠性工程拉进平台
        - 工具之外的商业深度尚未完全公开
      - - 治理与企业级外壳
        - Grafana Enterprise 和 Cloud 治理功能
        - RBAC、SAML、LDAP 同步、SCIM、企业插件、支持、BYOC / Federal Cloud
        - 让 Grafana 能进入受监管和自托管环境，同时不丢开源根基
        - 公开证据在安全架构细节上比包装话术更薄
    notes: 这是栈的实现层视角，不是价格表；各行按技术底座和运营责任组织。
