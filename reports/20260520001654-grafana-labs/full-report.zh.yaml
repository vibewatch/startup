  - id: TV007
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - ARR 工作假设
      - 倍数区间
      - 隐含估值
      - 成立条件
      - 失效触发因素
    rows:
      - - 乐观
        - $500M-$600M
        - 13x-15x
        - ~$7.0B-$9.0B
        - 市场风险偏好仍接近前四分位时，Grafana 还要证明留存够高端、利润率在改善， 且流动性路径更清晰。
        - 增长跌破高端软件门槛，或投资人不再为 Datadog 式溢价买单。
      - - 基准
        - $400M-$500M
        - 10x-12x
        - ~$4.0B-$6.0B
        - 投资人给 Grafana 高于广义 SaaS 中位数的溢价，但相对 Datadog 仍打折。
        - NRR 或毛利率缺少证据，投资人会把倍数压回 8-10x 附近。
      - - 悲观
        - $350M-$450M
        - 6x-8x
        - ~$2.0B-$4.0B
        - 市场把 Grafana 看成优质但不透明的私有软件资产，而不是高端公开可比公司。
        - 降价轮压力、增长变弱或流动性吃紧，会把定价压到这个区间之下。
      - - DCF 交叉校验
        - 收入和利润率路径未披露
        - 12%-14% 折现率；终值 EBITDA 用 15x-18x 视角
        - 除非增长保持 >30%，否则通常低于乐观情景倍数结果
        - 需要对长期利润率结构和现金转化有信心。
        - 若当前毛利率、烧钱速度或资本开支假设错误，DCF 校验会失效。
    notes: 情景区间刻意以范围呈现，不给虚假的单点目标。DCF 行只是三角校验工具，不是主方法。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV055
  - id: TV008
    title: 最终尽调问题与投资逻辑失效触发因素
    columns:
      - 主题 / 触发因素
      - 缺失证据或阈值
      - 为何重要
      - 行动含义
    rows:
      - - 当前 ARR
        - 需要管理层认证的当前 ARR 数字，并从 2025 年 9 月 >$400M 下限桥接到当前。
        - 在高端倍数下，20% 误差会让公允价值差出数十亿美元。
        - 没有这项证据，不从「观察」上调。
      - - NRR / GRR
        - 需要按 Cloud 与自托管部署拆分的队列留存和扩张数据。
        - 留存不强，10x 以上高端倍数很难辩护。
        - 留存偏弱会把判断推向悲观区间。
      - - 毛利率和烧钱速度
        - 需要按部署模式拆分的毛利率、经营亏损或利润，以及现金跑道。
        - 投资人无法判断 Grafana 是在走向 Datadog 式成熟，还是只是把收入做大。
        - 高烧钱会压低可接受入场价格。
      - - 优先股堆叠 / 清算条款
        - 需要完整股权结构表、优先股条款，以及任何结构化老股权利。
        - 普通股回报可能与表面估值大幅背离。
        - 沉重的优先权悬顶会压低投资人的有效上行。
      - - 老股定价路径
        - 需要 2025 年老股交易的隐含价格，以及任何 2026 年后续定价。
        - 2024 年之后缺少官方估值证据，市场出清价不清楚。
        - 若私募定价持平或下调，会支持更谨慎立场。
      - - 流动性 / IPO 路径
        - 除老股平台跟踪外，还需要董事会、治理、审计和投行准备度证据。
        - 没有 S-1 在案，就不能假设 IPO 时间。
        - 若 IPO 时间明显后延，私募市场要求回报门槛会上升。
    notes: 本表把尽调问题和投资逻辑失效条件放在一起，因为两者最终都是估值传导机制。
    claimRefs:
      - CV012
      - CV035
      - CV052
      - CV053
      - CV056
      - CV057
      - CV058
