  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与同业集合
        blocks:
          - type: paragraph
            body: >-
              Grafana 已不再作为单纯仪表盘厂商竞争。相关买方短名单现在横跨四个重叠群组：Datadog、Dynatrace、Elastic、New Relic
              等高端商业套件；Prometheus、OpenTelemetry、VictoriaMetrics、SigNoz
              等开源和开源核心构件；Honeycomb、SolarWinds、Sematext、groundcover、Better Stack、Sumo Logic、Sentry 等低成本或更窄的商业挑战者；以及 Azure
              Monitor、Google Cloud Observability 或拼接式内部栈等现状替代方案。这个广度很重要，因为许多团队仍会先标准化遥测和工作流，再标准化到单一商业供应商。


              最清晰的直接商业重叠，来自已经把日志、指标、追踪、仪表盘和相邻运维自动化打包销售的厂商。Datadog 仍是保留的上市可比公司中规模领先者，Dynatrace 从企业高端切入竞争，Elastic
              则从日志搜索和开放摄取角度竞争。New Relic 仍应列入名单，因为它营销广泛平台和公开自助定价，哪怕在这组来源中，其当前公开规模披露不那么突出。实际含义是，Grafana
              的输赢不太取决于团队是否需要可观测性，而更多取决于团队想要开放控制平面，还是更宽的单供应商运维套装。
