        - 披露付费客户定义、年度新增总客户和流失客户数。
      - - 披露客户隐含混合 ARR
        - 2024 年 >~$50k，2025 年 >~$57k
        - 低
        - 外部估算变现深度的代理指标。
        - 提供 ACV 分布、前十分位 ACV，以及 Cloud 与 Enterprise 的 ARPA 对比。
      - - SpendHound 年支出代理值
        - SMB 平均 $72,170；企业平均 $375,936
        - 低
