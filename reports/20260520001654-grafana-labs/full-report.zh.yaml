  - id: FE001
    title: 架构与数据流
    type: flow
    layout: wide
    summary: Grafana 的栈最好理解为：开放采集和专用存储，汇入共同的查询、告警和响应界面。
    data:
      nodes:
        - id: apps
          label: 应用、服务、基础设施
          type: input
          detail: 生产系统产生指标、日志、追踪和剖析数据。
        - id: k6
          label: k6 测试 / 合成监控
          type: input
          detail: 预生产和合成负载生成性能遥测。
        - id: alloy
          label: Alloy + SDK 采集
          type: process
          detail: 采集、批处理、转换并转发 OTLP / Prometheus 风格遥测。
        - id: mimir
          label: Mimir 指标存储
          type: storage
          detail: 长期 Prometheus / OTel 指标后端。
        - id: loki
          label: Loki 日志存储
          type: storage
          detail: 以标签索引的日志后端，支持低成本聚合。
        - id: tempo
          label: Tempo 追踪存储
          type: storage
          detail: 以对象存储优先的追踪后端，带 TraceQL 和链路链接。
        - id: pyro
          label: Pyroscope 剖析存储
          type: storage
          detail: 持续剖析后端，提供代码级资源洞察。
        - id: grafana
