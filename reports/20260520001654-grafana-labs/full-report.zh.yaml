  - id: TE001
    title: 产品组合与包装矩阵
    columns:
      - 产品 / 层
      - 主要用户任务
      - 交付模式
      - 当前成熟度
      - 差异点
      - 尽调缺口
    rows:
      - - Grafana
        - 查询、可视化、告警并探索跨来源遥测数据
        - OSS、Enterprise、Cloud
        - 成熟核心平台
        - 面向异构数据源的控制平面，而不是强制绑定单一后端
        - 公开资料未按部署模式量化插件附加率或付费转化
      - - Loki
        - 用 Prometheus 风格标签聚合并排查日志
        - OSS、Enterprise Logs、Cloud Logs 等日志形态
        - 成熟核心后端
        - 相比全文优先设计，基于标签的索引降低成本和运维负担
        - 需要客户证据说明复杂环境中标签优先搜索何时会成为限制
      - - Tempo
        - 存储、搜索并关联分布式追踪数据
        - OSS、Enterprise Traces、Cloud Traces 等追踪形态
        - 已成熟，但仍比 Grafana / Loki 更新
        - 对象存储优先的追踪架构，并与日志和指标强连接
        - 需要比营销案例更清晰的超大型生产部署公开证据
      - - Mimir
        - 大规模运行长期、多租户 Prometheus / OTel 指标
        - OSS、自托管、托管云底层服务
        - 成熟规模化产品
        - Prometheus 兼容性叠加水平扩展和长留存
        - 公开资料未披露运营经济性，也未按客户层级披露常见部署规模
      - - Pyroscope
        - 持续分析 CPU、内存和资源使用，精细到代码行
        - OSS、自托管、Cloud Profiles
        - 仍在成长期，但战略重要性高
        - 通过共享架构和 Grafana 关联补上第四类信号
        - 需要 2023 年收购后附加率和生产渗透的公开证据
      - - k6
        - 借助性能、浏览器和合成测试把可靠性左移
        - OSS CLI、CI/CD、Cloud k6、Synthetic Monitoring 等测试入口
        - 成熟工具，更广的平台角色仍在扩张
        - 开发者优先的测试即代码，与更广的 Grafana 遥测工作流天然贴合
        - 需要公开证据说明 k6 在多大程度上带动 Cloud 可观测性交叉销售
      - - Alloy
        - 从单一代理层采集、处理并导出指标、日志、追踪和性能剖析数据
        - OSS 采集器、Enterprise 机群管理、Cloud 入门路径
        - 战略性继任平台
        - OTel Collector 发行版，带 Prometheus 流水线、集群和集中配置
        - 从 Agent / Promtail 迁移的负担真实存在，文档仍在持续补齐
      - - Grafana Cloud / Enterprise 工作流产品
        - 将核心信号包装成 App Obs、RUM、IRM、AI 和受治理自托管部署等工作流
        - 托管 SaaS 或自托管商业版
        - 混合：治理能力成熟，工作流模块较新
        - 让 Grafana 靠包装工作流和企业控制能力在存储之上变现
        - 关于模块采用、模块级 SLA 和路线图交付的公开证据仍有限
    notes: 行里同时包含 OSS 产品和商业包装，因为 Grafana 的变现方式是把核心组件包进托管且受治理的工作流，而不是隐藏底层项目。
    enumerationScope:
      coverage: partial
      basis: >-
        This matrix covers the core modules and commercial packaging layers that materially define the Grafana product
        stack as of the run date; minor utilities and point features are intentionally omitted.
