      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的创始人—市场匹配度异常直接。Torkel Ödegaard 不是财务赞助方，也不是外聘高管；他因为对既有工具不满，亲手做出了最初的 Grafana 项目。Grafana
              官方创始人名单至今仍围绕同三个人：Raj Dutt、Torkel Ödegaard 和 Anthony Wood。Raj 仍担任 CEO 和主要商业发言人，Torkel 列为
              CGO，仍代表公司的技术与开源身份，Anthony 仍列为联合创始人。


              这种延续性降低了典型的创始人被替换风险，但也让机构叙事集中在少数人身上。Craft 当前资料补充 Tom Wilkie 为 CTO，显示创始三人组之外还有技术深度；但相对上市 SaaS
              同行，董事会层面的公开披露仍偏薄。尽调中的正向解读是创始人延续稳定；后续需要索取的是当前董事名单、委员会结构，以及公开材料没有写明的任何投资人观察员权利。
