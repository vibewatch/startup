      - number: '2.2'
        title: 市场规模与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开市场研究支持品类健康增长，但没有形成单一共识数字。Grand View Research 将可观测性工具 / 平台规模估为 2023 年 $2.71B、2030 年
              $5.40B；MarketsandMarkets 给出的数字是 2023 年 $2.4B、2028 年 $4.1B；Mordor Intelligence 用更宽的 2025 年基数 $2.9B，并预测到
              2031 年达到 $6.93B。三者方向一致——双位数增长、云部署占比高、企业支出驱动、北美采用强——但品类定义不同。


              更重要的尽调细节，是这些狭义软件研究与平台厂商瞄准的更大钱包之间存在落差。Sacra 认为 Grafana 正在追逐 $50B+ 的可观测性
              TAM，公开市场可比公司也显示该品类可以支撑可观企业价值，Datadog 在 2026 年 5 月市值约 $76.6B。更宽视角有助于评估战略上行空间，但不能与狭义可观测性工具报告直接对比。第 2
              章的正确结论是：Grafana 参与的是一个高速增长的核心品类，公开市场狭义规模到 2028–2031 年约为 $4B-$7B；如果平台融合继续推进，公司还有机会捕获大得多的全栈遥测钱包。
