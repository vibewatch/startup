      - number: '5.3'
        title: 部署灵活性与生态广度是核心商业杠杆
        blocks:
          - type: paragraph
            body: >-
              Grafana 通过三种运营形态销售同一套技术故事。开源仍是广泛采用引擎，也继续向自托管用户暴露核心产品能力。Grafana Enterprise
              将这个基础变成受治理的自托管商业产品，提供企业插件、数据源权限、SAML、LDAP 同步、RBAC、SCIM、报告和支持。Grafana Cloud
              抽象掉大部分运维负担，然后不仅变现存储和留存期，也变现应用可观测性、前端可观测性、数据库可观测性、Assistant、合成监控、k6 性能测试和 IRM
              等更高层工作流。由此形成一条阶梯：支持自托管实验、企业可控部署和托管云标准化，同时不强迫买方放弃同一 OSS 根基。


              生态角度同样重要。Grafana 文档和产品页面显示，平台围绕数据源连接性搭建，而不是围绕单一标准存储引擎。内置或文档化的数据源覆盖
              Prometheus、Elasticsearch、Loki、Jaeger、Tempo、Zipkin、Pyroscope、MySQL、PostgreSQL、Azure Monitor、Google Cloud
              Monitoring 和 AWS CloudWatch。企业插件将清单延伸到 ServiceNow、Oracle 等既有运维系统，而 Grafana 更广的产品定位明确提到 Salesforce、MongoDB
              等业务数据工具，以及 Slack、PagerDuty 等运维目的地。这意味着技术护城河不只是 LGTM 后端本身；还包括 Grafana 能成为异构资产控制平面的切入入口广度。
