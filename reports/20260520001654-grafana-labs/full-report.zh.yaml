        - Francisco Partners 与 TPG
        - 2023-11 完成交割
        - 以 $87/share 计算，股权价值约 $6.5B
        - 公开市场规模化可观测性资产；价格已披露，但增长质量未达高端档
        - 可作为下限可比，说明财务赞助方仍有兴趣，但低于高端云软件倍数。
      - - Grafana（私募融资参照）
        - 2024 年为现有投资人加 CapitalG；2025 年老股交易包括 Ontario Teachers' / Sapphire / Tiger
        - 2024-2025
        - 2024 年硬性定价 >$6B；2025 年价格未披露
        - 2024 年 ARR >$250M；2025 年 ARR >$400M
        - 说明即便倍数压缩之后，私募投资人仍愿支撑高端可观测性叙事。
    notes: 交易样本很小，因为规模化纯可观测性资产的收购仍然少见。New Relic 用来提供价格参照， 尽管本章当前来源集没有披露其精确的历史收入倍数。
