      - number: '3.2'
        title: 能力与定价动态
        blocks:
          - type: paragraph
            body: >-
              能力广度正在趋同，但包装仍高度差异化。Datadog、Dynatrace、New Relic 和 Elastic 都声称有广泛可观测性界面；Grafana
              则主打开放性、可组合性，以及围绕自适应遥测和自带云选项建立的定价哲学。团队如果从第一天就想要深度自动化、拓扑和更宽套件覆盖，Dynatrace 和 Datadog 仍给出最清晰的单供应商故事。Elastic
              处在独特的中间地带，因为它现在把自己营销成优先支持 OpenTelemetry、原生支持 Prometheus，但商业形态仍比 Grafana 的用量驱动云叙事更偏基础设施和部署导向。


              定价分布解释了为什么买方持续多栖。Grafana 发布免费层和每月 $19 加用量费的入门点，但 SigNoz、Sematext、SolarWinds、groundcover、Sentry
              等挑战者也都展示了低价或清晰起步价，让高端套件更容易被挑战。Datadog 和 Dynatrace 在买方需要更宽套装时可以证明更高价格合理，但它们的价目表也让成本控制论证成为每次续约的核心。因此，Grafana
              的核心竞争承诺不是“任何规模都最便宜”；而是如果团队愿意围绕 LGTM 栈组装，就能保留开放标准、连接既有工具，并且比深度捆绑的高端环境少花钱。
