      - number: '1.3'
        title: 产品栈与变现
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 现在覆盖了核心可观测性工作流的大部分环节。旗舰 Grafana 项目提供监控与可观测性仪表盘；Loki 用基于标签的索引处理日志；Tempo 提供分布式追踪；Mimir 为
              Prometheus 提供长期指标存储；Pyroscope 增加持续性能剖析；k6 则把平台延伸到负载测试。重要的尽调点不只是产品数量，而是邻接性：每个项目覆盖不同信号类型，同时仍接回同一套 Grafana
              界面和开放标准生态。


              商业化通过两层包装完成。Grafana Cloud 是全托管 SaaS 平台，Grafana Enterprise
              则是面向需要高级安全、治理、插件和支持买方的自托管商业版。公开定价给出可见的自助爬坡路径——免费层、每月 $19 起加用量费的 Pro、以及每年 $25,000 起的企业承诺——企业页面也明确显示
              SAML、LDAP、SCIM、RBAC、高级插件和响应 SLA 都位于付费层之后。这是教科书式开源核心模型，而不是单纯靠支持服务变现。
