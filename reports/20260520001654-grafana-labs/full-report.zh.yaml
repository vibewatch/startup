  - id: TI002
    title: 定价和变现表
    columns:
      - 产品 / 销售动作
      - 公开定价信号
      - 公开证据没有显示什么
      - 当前判断
      - 来源或尽调问题
    rows:
      - - Grafana Cloud Free
        - $0；10k 活跃序列；50 GB 日志 / 追踪 / 性能剖析；3 个用户；14 天留存。
        - 没有公开的免费转付费转化率。
        - 更像漏斗入口，而不是收入贡献项。
        - 索取免费转付费、激活，以及 PQL 转付费转化指标。
      - - Grafana Cloud Pro
        - 每月 $19 平台费加用量；指标每 1k 序列 $6.50；日志 / 追踪 / 性能剖析按处理、写入和保留计费。
        - 没有公开的实际 ASP、折扣阶梯或超额用量占比。
        - 用量模式扩张性好，但会让预测更复杂。
        - 按客户分层提供实际价格瀑布和超额用量发生率。
      - - Grafana Cloud Enterprise / Advanced 套餐
        - $25,000 年度消费承诺；自定义保留期；高级支持；BYOC / Federal Cloud；企业指标价格最低可到每 1k 序列 $3。
        - 未公开平均承诺规模或超额用量占比。
        - 大概率是大客户变现的核心路径。
        - 展示承诺层级、平均超额费率，以及超过承诺后的扩张模式。
      - - Grafana Enterprise 自管理版
        - 谈判式年度订阅；高级认证、RBAC、插件、支持和报告。
        - 未公开按用户、按集群或按实例的合同构成。
        - 商业价值清楚；定价机制仍是定制化。
        - 按部署架构和用户数披露定价框架。
      - - 独立合同基准
        - SpendHound 称 SMB 平均年支出约 $72k，企业平均年支出约 $376k；Vendr 和 CostBench 称 10–35% 折扣、$25k–$150k+ 年度合同很常见。
        - 这些数据集不是经审计的公司披露。
        - 可作为企业 ACV 和谈判杠杆的现实校验，但不是一手真相。
        - 按 ACV、折扣和留存画像分享前 20 大已签合同。
      - - 席位 / 用户定价代理值
        - 独立摘要对活跃用户定价说法不一，代理值约为每活跃用户每月 $8–$15。
        - 官方定价页面没有在一个地方把有效席位收费讲清楚。
        - 标价复杂度本身就是尽调点。
        - 提供当前活跃用户价目表，以及暴露在按用户计费下的 ARR 占比。
    notes: 本表区分官方标价和独立合同基准；公开标价并不等于实际净收入。
