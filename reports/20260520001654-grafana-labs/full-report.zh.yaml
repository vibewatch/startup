      - number: '6.2'
        title: 有名有姓的部署证据，云迁移和内部平台标准化最强
        blocks:
          - type: paragraph
            body: >-
              Grafana 的公开客户证据真实存在，但并不均匀。最强证据不在 logo 墙，而在详细客户故事：客户说明了具体迁移或运营结果。Booking.com
              是公开样本中最好的企业云案例。它的工程团队描述了一个两年转型：从多套可观测性工具迁到以 Grafana Cloud 为中心的集中化栈，并围绕 OpenTelemetry、可观测性即代码，以及大规模 Mimir 和
              Loki 使用来搭建。SpotOn 是最好的中端市场应用平台案例：公司说明它如何替换四套工具、统一标签、清理告警路由，并用由此获得的可见性加快故障排查、降低云支出。Microsoft 和 Salesforce
              展示的是另一种证据：内部平台用于高管仪表盘、KPI 跟踪、事件管理和服务健康运营。


              证据集中较弱的一面，是大客户覆盖广度。Grafana 的成功案例清单和 2026 年新闻材料列出 Bloomberg、Microsoft、Salesforce、NVIDIA、Anthropic、TomTom
              等客户，但其中不少仍停留在清单式确认，而不是带留存或 ROI 数据的量化案例研究。这一点对尽调很关键。公开记录足以证明 Grafana
              在企业和社区语境下都有生产相关性，但不足以仅凭客户名单出现就推断平均扩张、续约或价值兑现。因此，公开证据应更多押在 Booking.com、SpotOn、Microsoft、Salesforce 和
              Wikimedia 式运营使用上；Bloomberg 式提及最好视为足迹确认，而不是结果质量确认。
