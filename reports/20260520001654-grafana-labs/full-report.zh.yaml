      - number: '4.2'
        title: 单位经济与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Grafana 公开的单位经济论证依靠代理指标，而不是直接披露。最干净的由外而内指标，是已披露 ARR 与已披露客户数的关系。2024 年 8 月，超过 $250M ARR 除以超过 5,000
              个付费客户，意味着披露客户的混合 ARR 粗略高于 $50,000。2025 年 9 月，超过 $400M ARR 除以 7,000+ 组织，意味着披露组织的下限粗略高于
              $57,000。这些是粗略混合数，不是队列经济，但方向上符合一家销售实质生产工作负载的公司，而不是爱好者使用场景。开源漏斗可能很宽，但真正变现的部分似乎集中在严肃基础设施买方。


              独立定价数据也指向同一方向。SpendHound 称 SMB 年均支出约 $72,170，企业年均支出约 $375,936；Vendr 称买方通常能在标价基础上谈下 10–20%
              折扣，大型年度承诺交易折扣更深，达 20–35%。CostBench 和 CloudZero 也类似地把 Grafana 描述成一个平台：一旦留存期、用户、高级支持或多产品采用扩展，标价会低估总合同价值。这支持
              Grafana 能在企业账户内推动有意义 ACV 增长的观点，但也意味着收入模式依赖严格的定价执行，以及客户对用量计费的信任。


              反向解读是，同样的计量灵活性既帮助 Grafana 变现复杂可观测性资产，也可能制造账单冲击或人力冲击。CloudZero 认为实际账单可能落在初始估算的 2 到 5 倍，Sirius 则认为自托管完整 LGTM
              栈可能需要专职 SRE 人力，单个 FTE 年成本远高于 $300,000。这些批评不能否定产品—市场匹配；它们指出扩张风险在哪里。Grafana 的公开数据足以暗示健康变现潜力，但不足以证明毛利率耐久性、CAC
              效率或留存质量。这些仍是私营公司尽调问题，不是公开事实。
