      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              核心用户仍是技术团队：DevOps 工程师、SRE、平台工程团队、应用负责人和 IT 运维人员。Grafana 2025 年调研在这里尤其有用，因为它显示这些团队内部的采购行为正在变化。企业平均使用 8
              种可观测性技术；员工数超过 5,000 人的企业平均有 24 个数据源，SRE 平均有 18 个。成本是各角色的首要选择标准，但互操作性、开源基础、切换便利性和易用性仍是突出的第二层筛选条件。


              公开来源对经济买方的披露，没有用户画像那么清晰。调研显示，可观测性在三分之一组织中已经进入 CTO / C-level 关注范围，在金融服务业这一比例为 45%；Splunk 和 IBM 等厂商则直接面向
              CIO、CTO、DevOps 和工程团队营销。实际解读是，Grafana
              面对的是混合委员会：一线实践者关心互操作性和工作流适配，平台负责人关心标准化和数据重力，高管关心成本可预测性、供应商整合和业务影响。公开来源没有拆出不同角色预算归属的确切比例，这仍是尽调缺口。


              采用路径也有利于 Grafana 的开源基因。买方可以先从 Prometheus、OpenTelemetry 或 Grafana OSS
              与自托管使用开始，随后随着规模和合规需求上升，升级到托管云、企业安全与治理、更长留存期，以及 AI 辅助运维。可观测性领域常见这种动作：团队往往先标准化采集埋点，再集中数据，最后才梳理商业支出。
            claimRefs:
              - CM019
              - CM020
