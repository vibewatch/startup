  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱和严重度排序
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Grafana 的风险画像重点已经不是可观测性是否重要，而是品类成熟后谁来捕获价值。公开证据显示，公司已经具备真实规模——年经常性收入（ARR）超过 $400 million、客户超过
              7,000、用户超过 35 million，远程团队超过 1,400 人——但这些指标也提高了证明门槛：Grafana
              必须证明自己能把开源分发转化为耐久的企业经济性。承销担忧不是品类需求崩塌，而是当大型套件、超大规模云厂商和 OTel 原生工作流补齐核心可观测性管线时，利润率和定位会被挤压。


              TR001 的排序和 FR001 的热力图指向三项残余顶层风险。第一，来自 Datadog、Dynatrace、Elastic 和云厂商托管产品的竞争压力，可能在 Grafana
              试图进一步上探大客户的同一时点压缩胜率和定价。第二，技术和运营复杂度仍不低：Grafana 自己的 2026 年调查说开放性正在取胜，但复杂度仍是头号痛点，公司也在重构 Loki 和
              Pyroscope，以应对现代日志和性能剖析工作负载。第三，相对投资人被要求承销的规模，公司财务仍不透明。ARR 可见；烧钱、利润率、现金跑道和渠道集中度不可见。这些缺口让 Grafana
              看起来可投，但尚未完全出清风险。
