  - id: TI001
    title: 收入来源和质量表
    columns:
      - 收入流
      - 有证据支撑的机制
      - 当前数值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - Grafana Cloud 核心遥测
        - 托管指标、日志、追踪、性能剖析、合成监控，以及相关云可观测性用量计量。
        - 截至 2025 年 9 月，公司整体 ARR 超过 $400M，但 Cloud 占比未披露。
        - 若留存强，经常性质量高；用量波动也会增加预测噪音。
        - 按信号类型拆分 Cloud ARR、毛利率和收入。
      - - Grafana Enterprise 自管理软件
        - 面向高级认证、治理、插件、报告和支持的年度商业版。
        - 年度消费承诺起步 $25,000；实际合同规模需谈判。
        - 大概率是高价值企业收入，但与 Cloud 的收入占比未公开。
        - 提供 Enterprise ARR、续约率，以及自管理和 Cloud Enterprise 的拆分。
      - - 高级支持和客户成功
        - Pro 包含 8x5 支持，企业版还叠加高级支持 / 客户成功层。
        - 包装上能看到商业化，但未作为单独收入线披露。
        - 可能具备经常性，但比核心软件收入更依赖服务。
        - 展示支持附加率、支持收入和支持毛利率。
      - - 企业插件、安全和治理功能
        - 付费解锁 SAML / LDAP 增强、RBAC、企业数据源插件、报告和相关控制。
        - 产品包装可见，但未公开贡献占比。
        - 能加深锁定并抬高企业 ACV，但变现占比未知。
        - 按队列量化插件 / 安全附加率和增购贡献。
      - - 相邻产品和附加项
        - k6、IRM / OnCall、合成监控、AI 助手工作流及其他用量驱动模块扩大钱包份额。
        - 交叉销售入口清楚；产品级收入不公开。
        - 如果附加率真实，对扩张收入有帮助；但外部仍看不清。
        - 提供按产品族拆分的 ARR 桥接，以及相邻模块附加率。
    notes: 各行只隔离可由公开定价和产品材料支撑的收入机制；没有公开来源披露当前收入流占比或 GAAP 收入确认构成。
