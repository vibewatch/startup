        title: 展示材料
        blocks:
          - type: callout
            title: 开源核心飞轮是核心战略资产
            body: Grafana 最强的资产，是社区采用与可变现包装之间的连接。同一个品牌横跨开源项目、托管云、自托管企业软件，以及通过 AWS 的合作伙伴分发；因此用户和客户规模可以复利式增长，而不是被拆散。
