  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合广度已覆盖可观测性工作流的大部分
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的产品故事已不再是“Grafana 加相邻工具”。公司现在营销的是分层平台：Grafana 仍是查询、可视化、告警和探索遥测的控制平面，不论数据存在哪里；Loki、Tempo、Mimir
              和 Pyroscope 分别为特定信号类型提供专用后端。k6 把技术栈向左延伸到生产前和合成性能测试，Alloy 则成为指标、日志、追踪和性能剖析的首选采集层。在这些核心组件之上，Grafana Cloud
              将应用可观测性、前端可观测性 / RUM、数据库可观测性、AI Assistant、合成监控和事件响应管理打包成商业工作流界面，而不是让买方手工拼装每项能力。


              这种广度在战略上重要，因为 Grafana 仍遵循“大帐篷”产品逻辑，而不是封闭数据库逻辑。用户可以保留 Prometheus、OpenTelemetry、Jaeger、Zipkin、SQL
              存储或云监控工具，同时仍把 Grafana 用作可视化和排查界面。换句话说，产品组合在购买动作上设计成模块化，在运维体验上则保持统一。核心产品逻辑是：从仪表盘出发，在 Grafana
              具备成本或易用性优势的地方增加开放后端，然后随着运维人员希望把更多生命周期放在同一处，再扩展到性能剖析、测试、AI 分诊、RUM 和 IRM 等相邻工作流。
