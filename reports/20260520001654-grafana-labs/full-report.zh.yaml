chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 是一家总部位于纽约的可观测性软件公司，围绕 Grafana 项目建立。Torkel Ödegaard 在 2013 年 12 月创建该项目，并在 2014 年与 Raj
              Dutt、Anthony Wood 一起将其商业化。第三方公司资料将总部放在纽约，而 Grafana 自己的招聘材料强调全球化、远程优先的运营模式。公司称目前在 40+ 个国家拥有 1,600+
              名员工，这更像分布式工程和市场进入足迹，而不是单办公室的基础设施软件供应商。


              公司把自己定位为开放可观测性平台，使命是帮助构建者把整个业务中的信号转化为行动。这个定位很重要，因为 Grafana
              已不只是一个仪表盘产品：业务现在覆盖指标、日志、追踪、性能剖析和负载测试。公开证据也表明公司仍为私营。不过，官方 about 材料称其拥有 25M+ 用户和 7,000+
              客户，这些身份事实构成后续市场、产品、竞争和估值章节的基础。
