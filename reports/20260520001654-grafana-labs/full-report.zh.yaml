      - number: '8.2'
        title: 公开市场基准和倍数压缩
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给出最干净的现实检验：投资人现在愿意为规模化可观测性资产付多少钱。Datadog 是样本中的高端：2026 年 Q1 收入达到 $1.006 billion，全年收入指引为 $4.30
              billion-$4.34 billion，非 GAAP 经营利润率 22%，当季自由现金流 $289 million，MarketBeat 在 2026-05-20 显示市值约 $76.6 billion。这使
              Datadog 的市值 / 收入代理倍数处于十几倍高段；若按 $4.8 billion 现金调整成企业价值口径，则为十几倍中高段。Dynatrace 位于均衡增长中段：ARR $2.054
              billion、FY2026 收入 $2.018 billion、非 GAAP 经营利润率 29%、自由现金流 $529 million、市值接近 $11.9 billion，意味着公开倍数约
              6x。Elastic 是可比样本低端，市值约 $5.6 billion，对应 FY2026 收入指引 $1.734 billion-$1.736 billion，约 3x。


              这些公开数字与更广市场参考一致。一套公开 SaaS 倍数数据集把 2026 年 Q1 广义中位数定在 6.4x EV/revenue，BVP cloud index 定在 8.0x，2021 年峰值为
              18.6x。同一数据集把 20-40% 增长公司放在 5-8x 区间，把 40-60% 增长公司放在 8-11x 区间；Datadog 仍因规模、增长和盈利能力处在约 16x 的溢价队列。Multiples.vc
              2026 年 5 月调查从另一个角度强化了同一结论：软件估值分散如今较少由故事股动量驱动，更多由 AI 关联度、专业化、技术深度和盈利能力驱动。


              对 Grafana 来说，可比论证不是二元判断。公司有足够规模、开源触达和客户广度，应相对 Elastic 的低个位数倍数享有溢价。但在没有披露利润率、NRR 或现金流质量的情况下，它没有公开证据证明自己应与
              Datadog 肩并肩，长期享受十几倍高段倍数。市场证据只在一个前提下支持相对中位数的溢价：投资人愿意同时承销持续强增长，以及通向上市公司级盈利质量的可信路径。
