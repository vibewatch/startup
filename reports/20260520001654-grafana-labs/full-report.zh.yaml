  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑
      - 反向逻辑 / 会改变观点的因素
    rows:
      - - Grafana 已跨过后期规模门槛：ARR 超过 $400M、客户超过 7,000，且多次获得投资人支持。
        - 若 NRR、毛利率和烧钱仍不披露，仅靠规模不足以支撑溢价倍数。
      - - 开源触达和多信号产品广度，支撑其相对 Elastic 等低倍数同行享有溢价。
        - 若没有公开证据证明其盈利能力和留存接近 Datadog，Grafana 仍应低于这个高溢价公开龙头。
      - - 2024 年 >$6B 延展融资和 2025 年老股交易，说明机构仍买这个故事。
        - Forbes 对平轮的报道，以及互相冲突的二级市场标记，说明价格发现仍不确定。
      - - Splunk 和 New Relic 的战略交易说明，大买方仍看重规模化可观测性资产。
        - 这些交易落在中个位数倍数，而不是 2021 年式软件溢价。
      - - Grafana 有规模、品牌和投资人厚度，IPO 选择权仍然真实。
        - 截至 2026-05-20 尚无公开 S-1，因此不应把 IPO 时点当成近期估值催化。
