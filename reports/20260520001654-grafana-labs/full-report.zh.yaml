  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Grafana 的变现模式不只是简单的仪表盘订阅。官方产品和定价页面显示，核心有两种付费动作：Grafana Cloud 是托管、按用量计量的可观测性平台；Grafana Enterprise
              是面向需要安全、治理、高级支持和灵活部署选项买方的协商年度承诺产品。这个拆分在财务上重要，因为它让 Grafana 既能变现经典开源漏斗，也能承接更大的企业标准化项目。公司并不依赖单一按席位
              SKU；它可以对遥测量、年度支出承诺、高级功能，以及 k6、合成监控、AI 辅助工作流等相邻模块收费。


              作为私营基础设施供应商，Grafana 的公开标价异常清晰。Grafana Cloud Free 为 $0，Pro 每月 $19 起加用量费，Enterprise 从 $25,000 年度支出承诺起。Pro
              的指标价格从每 1,000 个可计费 series $6.50 起，企业批量价格低至每 1,000 个 series
              $3；日志、追踪和性能剖析则按独立的处理、写入和保留计量收费。这种透明度有助于理解产品，但不能解决真正的承销问题：折扣、用量承诺和超额费用之后，客户实际支付多少。SpendHound、Vendr、CloudZero
              和 CostBench 的独立定价数据都指向合同离散度大、定价复杂度不低。


              规模方面，公开记录清楚支持这是一家有实质商业牵引力的后期公司。Grafana 2024 年 8 月公告称业务已远超 $250M ARR，并有超过 5,000 个付费客户。2025 年 9 月新闻稿随后称 ARR
              已超过 $400M，客户群扩展到 7,000+ 组织。这个进展显示，开源采用正在强力转化为企业支出；但公司仍未按 Cloud、自托管
              Enterprise、支持或相邻产品披露收入结构。因此，收入质量看起来有希望，但披露仍比上市同行更薄。
