    rows:
      - - 开放、无锁定的可观测性控制平面
        - 高端套件说服采购向一个更宽的供应商收敛
        - 高
        - 大型企业可能更看重减少供应商，而不是开放性
        - 索取按交易规模和采购主导整合情景拆分的赢单 / 输单数据
      - - LGTM + 仪表盘生态
        - 更便宜的 open-core 和按主机计费挑战者会把更低价格预期常态化
        - 高
        - Grafana 既要继续在开放性上领先，也要守住价格和毛利
        - 测试成本优化导向销售和 BYOC 组合对毛利率的敏感性
      - - 与 Prometheus 和 OTel 对齐
        - 云原生默认项已满足足够多可观测性需求，Grafana Cloud 不一定能扩张
        - 中
        - 开放标准放大漏斗顶部，也可能压住变现上限
        - 按客群和超大规模云厂商足迹衡量 OSS 转 Cloud 转化
      - - 可视化和多源工作流领先
        - Elastic、Datadog、Dynatrace 持续补齐仪表盘和工作流短板
