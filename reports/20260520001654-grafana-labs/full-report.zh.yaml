    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 为何重要
    rows:
      - - 核心可观测性平台
        - 指标、日志、追踪、性能剖析、仪表盘、告警、存储与留存、OpenTelemetry 或 Prometheus 集成
        - 独立 SIEM、仅 CMDB 工具、通用 BI 分析
        - 平台工程、SRE、DevOps；付款方是工程或中央平台预算
        - Grafana 的核心品类，也是最干净的同类对比集合
      - - 全栈 / 邻近可观测性
        - APM、数字体验、拓扑、事件自动化、AI 辅助、遥测管线、数据库和网络可见性
        - 通用 ITSM 席位、无关安全支出、ERP 分析
        - 工程领导层、ITOps、CIO 或 CTO 赞助方
        - 扩大 Datadog、Dynatrace、Splunk、Elastic 和类似平台可获取的钱包份额
      - - 开源遥测采集和数据层
        - OpenTelemetry、Prometheus 兼容指标、自托管存储和查询、Kubernetes 原生采集
        - 封闭、仅限厂商的 SDK 和代理
        - 工程团队先使用；后续由集中化平台所有者接手
        - 对 Grafana 至关重要，因为标准化通常先于商业扩张
      - - 现状替代堆栈
        - 多个点工具、云原生内置能力、既有 APM 或日志工具、手工仪表盘
        - 单一厂商关联带来的统一平台收益
        - 应用所有者、SRE、IT 运营
        - 在许多账户中，这种碎片化现状才是真正要替换的对象
      - - 排除或范围外支出
        - 独立网络安全平台、通用数据湖、无关开发者工具、广义 ITSM 套件
        - n/a
        - CFO 或 CIO 仍可能为这些预算提供资金，但它们不是核心可观测性支出
        - 有助于避免夸大 Grafana 近期可变现 SAM
    notes: 各行区分 Grafana 核心可观测性预算、相邻全栈预算层，以及明确排除在外的支出类别。
