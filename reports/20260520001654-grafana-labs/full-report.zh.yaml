            title: 私营公司不透明度和补丁节奏仍然重要
            body: >-
              安全问题不会推翻投资逻辑，但会提高尽调成本。最近与 SCIM 相关的 CVE 取决于具体配置，不影响
              OSS，并且已在托管产品中修补；但安全公告索引显示多个产品反复有问题。再叠加公开董事会和经审计财务披露有限，管理层会议与客户背调就比单靠公开网页研究更重要。
