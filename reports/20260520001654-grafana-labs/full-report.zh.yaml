      - number: '5.2'
        title: 共享架构强调开放摄取、专用存储和跨信号关联
        blocks:
          - type: paragraph
            body: >-
              Grafana 产品家族的技术架构，比品牌数量初看上去更一致。Alloy 位于采集和路由边缘，为指标、日志、追踪和性能剖析暴露兼容 OpenTelemetry 与 Prometheus
              的管线。随后这些信号写入专用后端：Loki 负责基于标签索引的日志，Tempo 负责追踪，Mimir 负责 Prometheus 风格指标，Pyroscope 负责持续性能剖析。Grafana
              本身位于其上，作为查询和可视化层，通过数据源抽象、Explore、仪表盘和告警把栈缝合起来。k6
              部分位于稳定生产数据路径之外，但从产品角度看，它通过生成可在同一更广可观测性环境中分析的合成或负载遥测，闭合了一个重要环路。


              整个栈反复出现两种架构模式。第一，Grafana 偏好横向可扩展、多租户后端，并提供单二进制或简单启动的起点，规模扩大后再进入更分布式的运行模式。第二，它通过避免不必要的索引或存储重复来推动成本效率：Loki
              索引标签而不是日志正文，Tempo 依赖对象存储而不是重量级追踪索引，Pyroscope 和 Mimir
              都强调带有共享运维原语的耐久长期存储。好处是形成了一个可组合平台，并有可识别的运维模型。取舍在于，买方仍需要理解多个专用系统及其迁移路径，尤其是在 Grafana 将旧采集工具逐步迁入 Alloy 的过程中。
