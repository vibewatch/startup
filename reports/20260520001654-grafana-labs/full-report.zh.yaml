  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
    rows:
      - - 投资建议
        - 观察；只有价格低于 $5B 中段区间，或证明 ARR 超过 $500M 且留存具备溢价，才上调至买入。
      - - 信心
        - 中；公司质量证据充分，但私营公司不透明限制了估值精度。
      - - 估值立场
        - 按最近一次明确披露的 $6B 以上估值锚看，合理到偏高。
      - - 最后一个明确公开估值锚
        - 2024 年 8 月 Series D 延展轮，估值超过 $6B，新股与老股合计约 $270M。
      - - 最新披露运营规模
        - 截至 2025 年 9 月，ARR 超过 $400M，客户数超过 7,000。
      - - 基准情景估值区间
        - 按 10-12x 和 $400M-$500M 工作 ARR 估算，约 $4.0B-$6.0B。
      - - 乐观情景
        - 若 ARR 达到约 $500M-$600M，且市场给 Grafana Datadog 式溢价，估值约 $7.0B-$9.0B。
      - - 悲观情景
        - 若增长放缓且倍数压缩到 6-8x，约 $2.0B-$4.0B。
      - - 最可能退出路径
        - 近期 IPO 前，私募二级交易、另一轮后期融资或战略 M&A。
      - - 主要尽调卡点
        - 当前 ARR、NRR/GRR、毛利率、现金消耗和优先股堆叠。
    notes: 投资建议明确受价格和证据约束。区间结合已披露 ARR 下限、公开可比公司和市场倍数证据，而不是假设未披露的 2026 年估值标记。
