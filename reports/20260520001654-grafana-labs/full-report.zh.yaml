      - number: '7.5'
        title: 缓释、监控指标和尽调问题
        blocks:
          - type: paragraph
            body: >-
              Grafana 确实有真实的缓释资产。开源社区巨大，公司已经跨过有意义的 ARR 门槛，公共部门合规姿态、AWS
              合作和自适应遥测信息也都显示，管理层正在处理下一阶段增长最可能遇到的摩擦点。公司还受益于广泛产品栈；一旦客户采用多种信号和工作流，切换成本就会提高。这些因素解释了为什么风险图景严肃，但默认并不悲观。


              但证明责任现在从品类创建转向有纪律的执行。投资人若要把 Grafana
              承销成高确信度增长复利故事，应该要求私下证据：烧钱和现金跑道、按信号拆分的毛利率、企业插件挂载、NRR/GRR、头部客户和头部合作伙伴集中度，以及受超大规模云厂商渠道影响的真实签约额占比。最重要的公开监控项也很清楚：观察
              Grafana 能否继续赢得开发者而不变得过于复杂，遥测成本控制能否继续作为卖点而不是客户投诉，超大规模云厂商合作能否加深但不让 Grafana
              被去中介化，以及私募融资能否继续以健康条款完成。如果这些指标同时走弱，即使社区仍很大，投资逻辑也会明显变弱。
