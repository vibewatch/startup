  - id: TE004
    title: 集成生态表
    columns:
      - 生态分段
      - 代表性示例
      - Grafana 如何嵌入
      - 重要性
      - 约束
    rows:
      - - 指标与云监控
        - Prometheus、AWS CloudWatch、Azure Monitor、Google Cloud Monitoring 等数据源
        - Grafana 内置数据源，并在整个 LGTM 中使用 Prometheus 原生模式
        - 支撑控制平面逻辑，也降低推倒重来式替换的摩擦
        - 来源覆盖广，不等于一定能付费转化
      - - 日志与搜索
        - Loki, Elasticsearch
        - Grafana 可在同一 UI 查询原生 Loki 和外部日志存储
        - 让买家保留既有存储，同时把探索体验标准化
        - 体验会随查询语言和后端能力变化
      - - 追踪协议
        - Tempo, Jaeger, Zipkin, OpenTelemetry
        - Grafana 和 Tempo 支持从追踪到日志 / 指标的链接，以及开放追踪协议
        - 对大帐篷定位以及从旧追踪技术栈迁移很重要
        - 插桩质量仍决定实际排查价值
      - - 性能剖析
        - Pyroscope、Parca、基于 pprof 的应用
        - Grafana 增加性能剖析视图，并可把性能剖析数据与其他信号关联
        - 把平台延伸到资源优化和性能工程
        - 对许多运维团队来说，性能剖析仍是较新的实践
      - - SQL 与运营数据库
        - MySQL, PostgreSQL, MSSQL, Oracle
        - Grafana 数据源和 Enterprise 插件让运营数据无需全部搬进一个存储，也能被查询
        - 让 Grafana 超出纯基础设施遥测
        - 数据库集成覆盖面本身说明不了新增应用价值
      - - 业务与应用系统
        - MongoDB, Salesforce
        - Grafana 把自己定位成连接业务数据、应用数据和遥测数据的地方
        - 支撑更广用例，也让仪表盘更贴近业务
        - 公开文档在连接性上更强，在包装化分析工作流上更弱
      - - 事件与通知工具
        - Slack, PagerDuty
        - Grafana 告警和 IRM 可把排查和事件动作路由到运维人员已在使用的工具
        - 把信号可见性转化为运维响应
        - 公开资料没有细说各下游集成的深度
      - - IT 工作流系统
        - ServiceNow
        - Enterprise 插件和工作流集成让 Grafana 与既有 IT 流程工具共存
        - 对需要治理和工单连续性的大型企业有帮助
        - 公开资料没有量化这些集成多常带来净新增赢单
      - - 开发者与 CI/CD 工作流
        - GitHub、CI 系统、浏览器和 gRPC 测试目标
        - k6 面向测试即代码和自动化设计；Grafana 文档也明确提到 GitHub 等面向 CI/CD 的来源
        - 强化从预生产到生产的叙事
        - 面向 CI/CD 原生团队的商业包装，透明度仍低于 OSS 采用
      - - 插件与自定义扩展路径
        - 插件目录、自定义数据源插件、企业支持插件
        - 当缺少某个来源时，Grafana 允许客户安装有文档的插件或自己构建插件
        - 不必等待供应商路线图周期，生态也能保持可扩展
        - 自定义集成会增加维护负担和治理复杂度
    notes: 示例是代表性而非穷尽式；重点是展示 Grafana 可在客户环境中位于哪些系统之上、旁边或之间。
