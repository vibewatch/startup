  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Representative valuation peer set spanning premium public observability, balanced-growth public observability,
        lower-multiple mixed search/observability, and scaled strategic-takeout comparables; not a full census of every
        infrastructure software company.
    columns:
      - 可比对象
      - 类型
      - 与 Grafana 的相关性
      - 局限性
    rows:
      - - Datadog
        - 高溢价公开可观测性龙头
        - 公开市场愿意为可观测性规模、增长和盈利能力付多少，Datadog 是最佳参考。
        - 收入基数远大于 Grafana，公开盈利披露也明显更强。
      - - Dynatrace
        - 公开的均衡增长可观测性平台
        - 可作为 ARR 规模、盈利能力和现金流的中点基准。
        - 更多是企业自上而下的市场拓展，开源驱动分发弱于 Grafana。
      - - Elastic
        - 公开搜索加可观测性平台
        - 对具备可观测性敞口的多产品基础设施公司，是有用的低端参考。
        - 搜索 / AI 组合和商业模式不同，降低了直接可比性。
      - - Splunk
        - 战略收购可比交易
        - 显示大买方愿为规模化数据与可观测性平台支付什么价格。
        - 收入基数更大，交易前架构也不同于 Grafana。
      - - New Relic
        - 财务赞助方私有化可比交易
        - 对规模化但溢价较低的公开可观测性资产，是有用的底部参考。
        - 交易发生在 2023 年，不能直接反映 2026 年公开市场环境。
      - - 广义公开 SaaS 指数
        - 市场参考组
        - 提供后期软件公司的当前中位数和增长队列倍数区间。
        - 并非可观测性专属，不能替代公司层面的可比分析。
    notes: 这是判断性同业地图；真正定价工作放在下方公开市场和交易可比表中。
    claimRefs:
      - CV025
      - CV026
      - CV031
      - CV033
      - CV045
      - CV051
  - id: TV005
    title: 公开交易可比与估值倍数
    columns:
      - 公司
      - 2026 年市值 / 股权价值代理
      - 收入或 ARR 锚
      - 增长 / 盈利背景
      - 隐含倍数代理
      - 对 Grafana 的启示
    rows:
      - - Datadog
        - $76.58B 市值
        - FY2026 收入指引 $4.30B-$4.34B；Q1 收入 $1.006B
        - 32% 增长，22% non-GAAP 经营利润率，Q1 自由现金流 $289M
        - ~17-18x 市值 / 收入；按 EV 口径更低，因为现金有 $4.8B
        - 如果投资人认可 Datadog 式质量，这是 Grafana 的高端上限情景。
      - - Dynatrace
        - $11.94B 市值
        - FY2026 ARR $2.054B；收入 $2.018B
        - 19% 收入增长，29% non-GAAP 经营利润率，自由现金流 $529M
        - ~5.8-5.9x
        - 成熟可观测性平台的均衡增长中位参照。
      - - Elastic
        - $5.57B 市值
        - FY2026 收入指引 $1.734B-$1.736B
        - 17-18% 增长，18.6% non-GAAP 经营利润率，~112% 扩张率
        - ~3.2x
        - 可观测性敞口的更宽泛基础设施 / 搜索玩家的低端下限参照。
      - - Grafana 最近硬性定价
        - 披露估值锚点 >$6B
        - 2025 年 9 月 ARR 下限 >$400M
        - 利润率和留存未披露
        - 按 2025 年 ARR 下限计算 <=15x；若用更早 ARR 基数，倍数会明显更高
        - 说明当前披露锚点已经高于广义 SaaS 中位数。
      - - 广义公开 SaaS 中位数
        - EV / 收入基准，不是单家公司
        - 2026 年 Q1 中位数 6.4x；BVP Cloud 8.0x
        - 公开市场基准，不是单一发行人
        - 6.4x-8.0x
        - 划出中性区间，Grafana 必须解释为什么能拿到溢价。
    notes: 倍数有意用披露市值或 EV / 收入基准区间作为估值代理；要算出每个可比公司的精确企业价值， 还需要在本章公开来源之外完整归一化债务和现金。
    claimRefs:
