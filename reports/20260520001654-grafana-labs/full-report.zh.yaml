        - 复核仪表盘替换率，以及日志 / 追踪 / 性能剖析的附加率
      - - 成本控制叙事
        - 竞品围绕 AI、自动化和统一工作流的主张会盖过节省成本
        - 中
        - 成本是必要条件，但未必拿下每一个企业打包决策
        - 收集相对打包套件的净节省和故障解决时间证据
