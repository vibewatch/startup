            body: >-
              Prometheus 和 OpenTelemetry 的采用意味着许多团队先标准化遥测，再选择付费后端。相较封闭既有厂商，这降低了 Grafana 的进入摩擦，也让从 OSS 或自托管使用交叉销售到 Cloud
