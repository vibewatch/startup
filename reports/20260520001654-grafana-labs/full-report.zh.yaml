  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与漏斗顶端规模
        blocks:
          - type: paragraph
            body: >-
              Grafana 的客户故事先从极大的采用面展开，再收窄到已经付费的生产环境买家。最强的公开锚点不是收入队列表，而是官方规模口径和独立安装代理指标的组合：Grafana 称目前触达 25 million+
              用户、全球 7,000+ 客户，独立安装跟踪数据也显示，它在金融、商业服务、零售和软件行业都有广泛使用。这个组合很重要，因为它支撑了核心 PLG
              逻辑：开源和免费云入口确实足够宽，能形成有意义的转化池，而不是营销抽象概念。


              买家阶梯也异常多元。个人开发者和小团队可以从 OSS 或免费层开始。团队负责人和平台工程师随后成为内部推动者，标准化仪表盘、告警和遥测管线。只有安全、留存、合规或支出承诺高到足以支撑 Pro、Enterprise
              或 Federal Cloud 时，采购才会成为中心。也就是说，每个阶段的买家、用户和付款方往往不同：开发者触发最初部署，平台团队把它运营化；当 Grafana 变成共享基础设施后，中央
              IT、安全或采购再来付款。本章的判断是，Grafana 的客户群最好按社区用户、自助云团队、中端市场平台团队、大型企业标准化客户、公共部门或受监管买家来分，而不是归为一种统一客户画像。
