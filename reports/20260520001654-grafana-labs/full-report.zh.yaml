      - number: '6.4'
        title: 粘性看起来高，但留存和集中度披露仍薄
        blocks:
          - type: paragraph
            body: >-
              Grafana 的留存逻辑很直观，但披露仍不足。公开案例清楚说明了为什么已部署账户会变得有粘性：Grafana 往往处在仪表盘、告警、路由和遥测标准化的交叉点。Booking.com
              描述了与集中化遥测和运营简化绑定的多年栈迁移。SpotOn 描述了新的运营模式：所有权、路由和故障排查都依赖标准化的 Grafana 数据。这些不是随手部署。它们意味着，一旦 Grafana
              进入团队日常工作流，切换成本就不只是软件订阅费，还包括重接仪表盘、告警、标签、运行手册和跨团队排障习惯所需的组织工作。


              缺口在于硬留存数据。这里审阅的公开来源没有披露
              NRR、GRR、客户流失或队列留存。公开材料也没有披露头部客户集中度、头部合作伙伴集中度，或有多少商业收入来自云市场而非直销。因此，本章可以定性承销粘性，但还不能用量化方式完整承销续约质量。正确解读是正面但有条件：Grafana
              看起来确实有真实工作流嵌入和天然按使用扩张，但在把这种直觉当作已经证明的耐久性之前，投资人仍应要求明确的队列和集中度明细。
