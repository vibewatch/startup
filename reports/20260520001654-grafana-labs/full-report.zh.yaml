      - number: '6.3'
        title: GTM 组合：开发者先落地，市场渠道和企业采购再放大
        blocks:
          - type: paragraph
            body: >-
              Grafana 的变现阶梯本质上仍是产品驱动，但变现机制比单看开源品牌更像企业软件。官方定价仍保留低摩擦入口，免费层确实可用；Pro 增加付费支持和更高限额，Enterprise
              则引入大型年度承诺、自定义留存、高级支持和部署灵活性。这套设计支撑了熟悉的先落地、再扩张：团队从仪表盘和较窄的遥测足迹开始，随后增加活跃用户、更多信号、更长留存和更高治理要求。AWS Marketplace
              页面和 2026 年 AWS 战略合作显示，一旦工作负载进入生产关键状态，Grafana 会努力拆掉企业采购摩擦：买家可以通过市场账单交易，消耗云承诺额度，并使用迁移资金，而不是把 Grafana
              当作单独供应商条目处理。


              渠道故事不止于超大规模云厂商。Azure Managed Grafana 提供升级到 Grafana Enterprise 的路径，Carahsoft 公开目录则显示，Grafana
              通过分销商路线为政府买家打包云和企业 SKU。Federal Cloud 又进一步，把机构、SLED、系统集成商和服务受监管环境的供应商所需的可观测性明确打包。结果既不是纯自助
              SaaS，也不是纯自上而下企业销售，而是混合 GTM：自下而上的开发者采用创造内部需求；当 Grafana 从点工具变成基础设施后，市场、分销商和合规包装让大单采购路径更容易。
