      - number: '7.4'
        title: 执行和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Grafana 的公开规模口径足以证明牵引力，但不足以完整承销企业级盈利质量。公司现在披露 ARR、客户数、用户数和广泛投资人支持，而第三方跟踪器仍把 Grafana 描述为 IPO
              前公司，二级市场活动有限。这意味着市场能看到需求证据，却看不到判断烧钱纪律、毛利率韧性，或当公司销售更多合规重、大企业产品时 PLG 效率还能剩多少所需的财务报表。承销风险不是 Grafana
              明显弱，而是业务已经长到让私有公司不透明变得不舒服的阶段。


              执行风险直接来自这种不透明。Grafana 必须支持全球分布式团队，持续招聘稀缺基础设施和 OSS
              人才，在延展到性能剖析、负载测试、AI、云厂商可观测性和市场经济性的同时守住核心品牌，并管理合作伙伴驱动的分发，避免过度依赖任何单一渠道。插件和席位定价结构也有双面性：它创造了清晰的变现杠杆，但也会在买家质疑遥测预算时，让企业级加固变得更贵。因此，TR004
              和 TR005 比营收头条更重要。没有烧钱、毛利率、NRR 和渠道组合的更好可见性，投资人无法干净地区分健康扩张和仍依赖宽松私募市场条件的增长。
