      - number: '8.3'
        title: 交易基准和情景测算
        blocks:
          - type: paragraph
            body: >-
              交易样本有用，因为它显示，当公开倍数不是唯一决策依据时，战略买家或财务买家实际为规模化可观测性资产付了多少钱。Cisco 在 2024 年 3 月以约 $28 billion 收购 Splunk；Splunk
              刚披露 FY2024 收入 $4.216 billion、ARR $4.208 billion，意味着收购倍数约 6.6x 到 6.7x。New Relic 约 $6.5 billion
              的私有化交易显示，规模化但溢价较低的可观测性资产仍有显著战略价值，但不享受 Datadog 式云溢价。合在一起看，这些交易说明，真实可观测性平台的私募和战略底价远未陷入困境，但明显低于许多私有公司在
              2021-2022 年享受的峰值周期软件估值。


              因此，情景分析比点估计更重要。保守情景只使用 2025 年 9 月披露的 ARR >$400 million 下限，以及 2026 年广义 SaaS 增长队列 5-8x 区间，支持约 $2.0
              billion-$3.2 billion，尚未加入任何溢价调整。基准情景假设 Grafana 在 $400 million-$500 million 工作 ARR 区间上应获得 10-12x 溢价带，支持约
              $4.0 billion-$6.0 billion。乐观情景假设 ARR 为 $500 million-$600 million，并获得 Datadog 式 13-15x 溢价，支持约 $7.0
              billion-$9.0 billion。这些区间符合业务质量所暗示的水平，同时仍尊重公开市场证据自 2021 年以来已经明显重置的事实。


              DCF 在这里最多只能作为三角验证，因为太多关键输入未披露。Damodaran 当前软件资本成本数据把公开软件折现率放在高个位数，但私有公司流动性不足、股权结构不确定和披露风险，会把现实的 Grafana
              折现率推到约 12-14%。没有公开毛利率、经营利润率或资本开支披露，DCF 结论应视为支持性而非决定性。实践中，基于倍数的框架仍是本章更诚实的估值方法。
