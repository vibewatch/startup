      - number: '4.4'
        title: 对标结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开可观测性可比公司让 Grafana 的机会很明显，也让其披露缺口无法忽视。Datadog 在 2026 年 Q1 产生 $1.006B 收入，同比增长 32%，非 GAAP 经营利润率 22%，自由现金流
              $289M。Dynatrace 在 2026 财年退出时 ARR 为 $2.054B，收入 $2.018B，非 GAAP 经营利润率 29%，自由现金流 $529M。Elastic 2026 财年 Q3
              结果显示收入 $450M，非 GAAP 经营利润率 18.6%，净扩张约 112%，调整后自由现金流 $54M。放在这个背景下，Grafana 超过 $400M 的 ARR
              已经可观，但相对最大上市领导者仍明显未到同等规模。


              这个比较有两面。乐观解读是，Grafana 已经建立足够规模、定价可信度和资本可得性，是可观测性领域真正的后期资产。谨慎解读是，投资人仍无法判断公司会走向 Datadog 式的盈利规模、Dynatrace
              式的平衡增长，还是更长的 Elastic 式经营杠杆爬坡。公开证据没有披露毛利率、自由现金流、净留存、客户集中度或 CAC / 回本周期。即使累计融资额也没有干净对齐：一篇使用 Crunchbase 数据的
              Crunchbase News 文章称 Grafana 已融资超过 $805M，而常被重复的公开简写数字低得多，也没有单一主要账本支持。


              因此第 4
              章的结论是：需求、可信度和变现潜力正向，但承销定价仍被卡住。收入质量看起来强于披露质量。资本可得性看起来扎实。利润率路径和现金烧钱纪律仍不透明。最低尽调包很清楚：经审计或管理层认证的收入结构、按部署模式拆分的毛利率、队列留存、CAC
              / 回本周期、现金与债务明细，以及能对齐一级与二级交易款项的融资账本。没有这套材料，可以判断 Grafana 是强业务，但不能高置信地完整定价。
