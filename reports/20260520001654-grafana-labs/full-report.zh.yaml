  - id: TE003
    title: 功能成熟度表
    columns:
      - 能力
      - 当前状态
      - 成熟度判断依据
      - 商业相关性
      - 未解问题
    rows:
      - - 仪表盘 / Explore / 告警
        - 成熟
        - Grafana OSS 和 Enterprise 文档显示，公司已长期拥有一个控制平面，可跨多种数据源查询、可视化、探索和告警
        - 仍是把用户带入其余技术栈的切入点
        - 公开资料没有展示仅使用仪表盘的用户如何转为付费
      - - 日志（Loki）
        - 成熟
        - Loki 支持多租户和水平扩展，定位是带 Grafana 原生工作流的高成本效率日志后端
        - 对 LGTM 先落地再扩张和 Cloud Logs 经济性很重要
        - 相比全索引日志搜索的取舍，仍取决于具体客户场景
      - - 追踪（Tempo）
        - 成熟，且仍在活跃创新
        - Tempo 自 2021 年起 GA，文档强调 TraceQL、span 衍生指标、Parquet 后端工作和跨信号链接
        - 对 APM 式扩张和 Application Observability 包装至关重要
        - 最新追踪查询功能需要更多公开客户证据
      - - 指标（Mimir）
        - 企业级规模下成熟
        - 文档和 README 强调长期 Prometheus 存储、多租户和高规模运行，包括非常大的活跃序列数
        - 是 Cloud 指标经济性和大型企业自托管的基础
        - 公开证据没有展示毛利率或硬件效率数据
      - - 持续性能剖析（Pyroscope）
        - 仍在成长期，但已战略整合
        - Pyroscope 现已并入 Grafana，共享架构并进入 Cloud 包装，但收购发生在 2023 年
        - 增加差异化第四信号，也加深开发者工作流
        - 公开附加率和采用证据仍稀少
      - - 性能与合成测试（k6）
        - 工具成熟，仍在扩进平台组合
        - k6 作为开源测试软件已站稳脚跟，如今也贯穿 Cloud 定价和合成测试工作流
        - 对可靠性左移和提高钱包份额很重要
        - 需要证据说明 k6 多常带动更广的可观测性支出
      - - 遥测采集（Alloy）
        - 战略性强，迭代快
        - Alloy 现在承接未来采集器投资，发布节奏快，并提供从旧代理迁移的指南
        - 是标准化入门和控制遥测成本的关键
        - 迁移复杂度不低，可能拖慢升级
      - - AI / App Obs / RUM / IRM 工作流产品
        - 商业上已可见，但更年轻
        - 定价和 Cloud 页面如今明确推广这些模块，但各模块的公开技术深度不同
        - 这些产品是走向更高价值商业包装的最清晰路径
        - 公开文档更擅长讲包装，弱于模块级参考部署
    notes: 成熟度评级区分长期存在的核心能力和较新的包装工作流；这是基于证据的运营判断，不是供应商评分卡徽章。
