  - id: TP004
    title: 定价 / 打包对比
    columns:
      - 厂商
      - 入门价格锚点
      - 主要计费单位
      - 打包形态
      - 竞争解读
    rows:
      - - Grafana Cloud
        - 免费；Pro 起价 $19/mo + 用量费
        - 平台费 + 用量
        - 开放可观测性平台、免费层，Enterprise 承诺用量从 $25k/year 起
        - 让 Grafana 低成本落地，并随用量扩张，同时守住 BYOC 和开放标准
      - - Datadog
        - 按模块定价；日志按每 GB 摄取 / 扫描 $0.10 计费
        - 按模块、按 GB、按事件，以及其他附加项
        - 高度模块化套件定价
        - 打包能力强，但买方容易觉得贵且难以建模
      - - Dynatrace
        - $7 / $29 / $58 按主机分层，另有日志 GiB 定价
        - 按主机、按 GiB，pod / container 附加项
        - 结构化企业价目表
        - 定价偏高但清晰，强化企业级定位
      - - Elastic
        - 托管版按资源；无服务器版按用量；自管理版按许可证
        - 基础设施 / 用量 / 许可证
        - 多种部署模式
        - 适合混合资产，但比 Grafana 以云为主的叙事更偏基础设施
      - - SigNoz
        - 每月 $49 团队方案
        - 含额度池的用量计费
        - 开源牵引的云服务，另有企业版 / 自托管选项
        - 直接挤压 Grafana 和 Datadog 式套件的低端市场
      - - groundcover
        - Pro 版每主机每月 $30
        - 按主机
        - 按主机计费，适合 BYOC / 本地部署
        - 吸引不信任按摄取量计费的可观测性团队
      - - SolarWinds
        - 每节点每月 $7.42
        - 按节点
        - 面向混合资产的套件
        - 把更便宜的混合监控替代方案带进 RFP
      - - Azure / Google
        - 即用即付，含基础免费额度
        - 按 GB、按样本、按 span
        - 云原生服务定价
        - 云中心买家切换意愿低，默认云服务往往够用
    notes: 本表只比较公开的入门价格锚点和计费单位；实际交易里的企业折扣谈判和用量细节会有很大差异。
