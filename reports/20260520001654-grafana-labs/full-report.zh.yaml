      - number: '1.5'
        title: 里程碑与风险背景
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的时间线重要，因为公司反复从单一开源可视化工具扩展成更广的全栈可观测性平台。公开来源能看到这条序列：Grafana 始于 2013 年，公司成立于 2014 年，通过 J.P.
              Morgan 等关系获得企业验证，Tempo 带来追踪能力扩展，2022 年和 2024
              年融资事件显示投资人继续以数十亿美元估值为这一战略提供资金。贯穿其中的不是单个功能，而是围绕相邻可观测性信号搭建平台的策略。


              主要反向力量是运营复杂度。Grafana 公开安全公告索引显示多个产品反复出现漏洞，2025 年 SCIM
              缺陷也证明，启用高级身份管理功能后，企业与云控制平面可能带来真实的权限提升风险。公开报道同时显示补丁发布迅速，OSS
              用户也不在该特定问题的影响范围内；但投资人仍应把安全响应纪律视为产品质量叙事的一部分。另一个结构性限制是披露：董事会构成、经审计的当前收入、以及确切累计融资额仍未完全公开。
