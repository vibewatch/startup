      - CE051
  - id: TE002
    title: 架构组件表
    columns:
      - 组件 / 层
      - 系统角色
      - 关键依赖 / 协议
      - 重要性
      - 主要技术风险
    rows:
      - - Alloy 与 SDK 插桩
        - 从应用和基础设施采集并路由指标、日志、追踪和性能剖析数据
        - OTLP、Prometheus 流水线、Loki / Pyroscope 组件
        - 统一摄取层，减少单独采集器的需求
        - 从 Agent 或 Promtail 迁移可能改变指标、配置和 UI 假设
      - - Grafana 查询与控制平面
        - 提供仪表盘、Explore、告警和跨信号导航
        - 数据源 API、查询编辑器、告警规则、权限
        - 让异构后端在运维人员眼里变成一套体验
        - 如果买家只选择免费 OSS 层，控制平面价值会变弱
      - - Loki 日志后端
        - 存储日志，并用以标签为中心的索引处理查询
        - 标签元数据、LogQL、采集器转发
        - 低成本日志留存和从指标跳转到日志，是 LGTM 经济模型的核心
        - 对期待任意全文优先搜索的团队，纯标签索引可能不够直观
      - - Tempo 追踪后端
        - 存储追踪数据，支持追踪搜索、span 衍生指标和从追踪到日志 / 指标的链接
        - Jaeger、Zipkin、OpenTelemetry、对象存储
        - 让 Grafana 把追踪数据成本压到足以支撑广泛采样和关联
        - 搜索和后端表现取决于规范的插桩与属性设计
      - - Mimir 指标后端
        - 提供长期、多租户指标存储和查询扩展能力
        - Prometheus / OpenTelemetry 指标、Helm / Jsonnet / YAML 配置
        - 为已超出原生 Prometheus 能力的企业撑住 LGTM 的指标支柱
        - 真实规模下的运维调优和成本，在公开资料中并不透明
      - - Pyroscope 性能剖析后端
        - 聚合持续性能剖析数据，并与其他信号关联
        - pprof 端点、SDKs、Alloy、对象存储
        - 不离开 Grafana 工作流，就能做代码级资源分析
        - 性能剖析价值取决于部署纪律和跨应用附加率
      - - k6 测试平面
        - 生成预生产或合成负载和测试遥测
        - JavaScript APIs、HTTP、WebSockets、gRPC、browser APIs 等接口
        - 把可观测性从事后诊断延伸到主动可靠性测试
        - 从测试到可观测性的数据闭环在战略上清楚，但商业化证据不足
      - - 告警与事件工作流
        - 信号分析后触发并路由运维动作
        - Grafana 告警、IRM、Slack、PagerDuty
        - 把原始遥测转化为运维响应
        - 公开证据显示路由覆盖面存在，但看不出各工作流的深度或采用率
      - - 对象存储与部署底座
        - 支撑长期持久性，并帮助控制追踪 / 指标 / 性能剖析成本
        - S3、GCS、Azure Blob 或兼容对象存储；Kubernetes 或 VM 部署
        - 共享存储原语让多产品运维更连贯
        - 依赖对象存储和分布式基础设施，仍让买家面对真实的平台复杂性
    notes: 本表描述的是功能架构，而不是 SKU 包装；行按运维人员职责和共享依赖组织，不按标价组织。
