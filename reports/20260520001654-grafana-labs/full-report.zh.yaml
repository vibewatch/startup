      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动是结构性的，不是周期性的。CNCF 称，受访组织中的云原生采用率达到 89%，93% 正在使用、试点或评估 Kubernetes，80%
              已在生产环境运行。Kubernetes、CI/CD、GitOps、微服务和事件驱动架构都会放大团队必须理解的服务数、信号数和故障模式。OpenTelemetry
              又带来一股顺风，因为它让采集埋点具备可移植性和厂商中立性，降低采用现代平台的切换成本。


              AI 是下一个扩张向量，但不是唯一向量。Grafana 调研显示，近半组织正在研究统一应用 / 基础设施可观测性、SLO 和 LLM 可观测性；从 Splunk 到 Dynatrace 再到
              Elastic，厂商都在推动 AI 辅助根因、智能体式排查和业务上下文映射。品类持续吸收相邻用例，而不是停留在仪表盘和日志搜索，这支撑了估值倍数。


              反向力量同样真实。Grafana 调研显示，可观测性支出平均占计算基础设施支出的 17%，复杂度、噪音和成本是最主要障碍；Elastic 2026 年研究称，97% 组织经历过成本意外，96%
              正在主动采取成本控制措施。大型企业正在整合工具集，而不是增加更多点状产品；即使有 OpenTelemetry，一旦团队嵌入某个供应商的存储、查询、工作流和 AI 层，下游切换摩擦也不会消失。落到 Grafana
              身上，增长机会很大，但净扩张不仅取决于功能论证，也同样取决于能否打赢成本控制论证。
