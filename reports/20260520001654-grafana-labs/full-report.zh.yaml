      - number: '7.3'
        title: 技术、监管和依赖风险
        blocks:
          - type: paragraph
            body: >-
              最深的产品侧风险不是基础功能不足，而是同时服务更多信号、更多工作负载和更多合规重买家所带来的运营负担。Grafana 明确表示，Loki 必须为结构化日志、分析查询和更高基数工作负载重新设计，Pyroscope
              2.0 也需要从零重构以降低成本和复杂度。这是健康的产品投入，但也告诉投资人，规模压力已经真实存在。再加上
              k6、市场扩张和新的合作伙伴集成，平台表面积正在变大；而每增加一层，又都必须对那些已经说复杂度是最大痛点的用户保持运营一致性。


              监管义务会加剧同一个复杂度问题。Grafana 现在销售 FedRAMP High 和 IL5 通过的托管产品，提供企业安全文档和审计，并面对由 GDPR 违规披露时限和 NIS2
              董事会级问责塑造的客户预期。这些能力很有价值，也是受监管需求的明确缓释，但也带来更多流程、审计、披露和合作伙伴依赖。AGPL 变更又增加了法律维度：它有助于抵御无偿托管使用、提升可持续性，但也给企业和任何对网络
              copyleft 义务敏感的服务运营方带来政策摩擦。换句话说，Grafana 的法律和技术架构越来越强，也越来越难保持简单。
