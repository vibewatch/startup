      - number: '8.5'
        title: 建议和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议是观察（TRACK），不是买入（BUY），因为公开记录对 Grafana 公司质量的支撑，强于对高溢价后期入场倍数的支撑。使用披露的 ARR 下限、公开可观测性可比公司和 2026 年 SaaS 估值区间，约
              $4 billion-$6 billion 的基准估值区间站得住。这让最后一个硬公开标记 >$6 billion 看起来介于合理到偏高之间，而不是明显有吸引力。类似股票的问题因此不是 Grafana
              好不好，而是新投资人是否因为私有公司不透明、流动性延迟和竞争不确定性获得了足够折价。


              什么会改变判断？最快的建设性重估路径，是证明当前 ARR 已经大约超过 $500 million，NRR 舒服地高于
              115%，毛利率符合高端基础设施软件水准，并且没有惩罚性优先股堆叠。在这种事实组合下，Grafana 可以合理主张 12-15x
              区间，支撑基准情景上半段，甚至支撑乐观情景。什么会打破判断也同样清楚：增长滑入十几倍低段队列，公开市场倍数再次下调，流动性路径弱于预期，或有证据显示开源触达没有转化为高端企业留存。


              因此，尽调议程非常具体。投资人需要当前 ARR 和队列留存、按部署模式拆分的毛利率、现金和债务细节、完整优先权和清算明细，以及 2025 年二级交易相对 2024
              年隐含的是平价、上行还是下行。在这些数据到手前，正确做法是有纪律地监控和估值设闸，而不是泛泛认可公司质量。
