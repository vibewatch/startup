      - number: '1.4'
        title: 资本、规模与公司状态
        blocks:
          - type: paragraph
            body: >-
              资本方面，已披露融资事件的锚点仍是 2022 年 4 月 Series D。Grafana Labs 官方称其融资 $240M，由 GIC 领投，J.P. Morgan
              作为新投资人加入。之后的报道补上了公司公告本身没有强调的估值背景：Forbes 写道，公司信源将 2022 年 4 月融资与 $6B 估值相连；TechCrunch 则在 2024 年 8 月报道，同一
              Series D 约 $270M 的延伸轮让公司估值超过 $6B。


              一家仍未上市的基础设施供应商，能公开披露到这种运营规模，已经相当可观。TechCrunch 报道，Grafana 到 2024 年 8 月已超过 $250M ARR、拥有 5,000+ 付费客户；Grafana
              2026 年 about 页面现在称有 25M+ 用户和 7,000+ 客户。SEC 全文搜索截至 2026-05-20 没有返回 S-1 命中，Craft
              也仍将公司归为私营。合在一起，这些信号支持一个判断：Grafana Labs 是一家后期但仍未上市的开源基础设施公司，已有实质规模，并且仍能进入私募资本市场。
