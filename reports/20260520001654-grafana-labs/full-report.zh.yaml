  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 所卖的市场，比经典仪表盘更宽，但又比泛 IT
              运维软件更窄。实际购买单元是可观测性平台，帮助团队采集、关联、存储并处理指标、日志、追踪，以及越来越多的性能剖析。商业领导者现在还会销售真实用户监控、数字体验、拓扑和安全上下文、AI
              辅助根因分析，以及遥测管线控制等相邻层。Grafana 受其直接影响，因为公司的产品集已经覆盖仪表盘、指标、日志、追踪、性能剖析和负载测试；买方不会孤立评估这些能力。


              同时，现状仍高度碎片化。Datadog、Dynatrace、Elastic、Splunk、New Relic 和 IBM 都在营销多信号平台，Prometheus、OpenTelemetry、Kubernetes
              和 VictoriaMetrics 则让开源基础层保持强势。结果是，纳入市场的支出口径可以从狭义可观测性工具软件预算，一直延伸到更广的遥测、监控、事件和 AI 运维钱包。尽调时，这种边界逻辑比任何单张 TAM
              幻灯片更重要：狭义分析师定义可能低估 Grafana 的机会，厂商钱包口径则可能高估近期真正可变现的部分。
