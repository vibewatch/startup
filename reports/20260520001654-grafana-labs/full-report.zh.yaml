    summary: 2026 年市场锚点显示，私募优质软件公司的溢价倍数已较 2021 年峰值明显回落。
    data:
      items:
        - label: 2021 年公开 SaaS 峰值
          value: 18.6
          unit: x EV/revenue
        - label: 2026 年 Q1 SaaS 中位数
          value: 6.4
          unit: x EV/revenue
        - label: 2026 年 Q1 BVP 云指数
          value: 8
          unit: x EV/revenue
        - label: Datadog 代理倍数
          value: 17
          unit: x revenue
        - label: Dynatrace 代理倍数
          value: 5.9
          unit: x ARR/revenue
        - label: Elastic 代理倍数
          value: 3.2
          unit: x revenue
        - label: 基于 2025 年 ARR 下限的 Grafana 硬锚代理倍数
          value: 15
          unit: x ARR max
    approximationNotes: 上市公司价值采用市值或基准代理；Grafana 则用最后披露的 >$6B 估值，对照 2025 年 9 月 >$400M 的 ARR 下限。
    claimRefs:
      - CV009
      - CV018
      - CV021
      - CV024
      - CV026
      - CV028
  - id: FV003
    title: 估值里程碑时间线
    type: timeline
    layout: wide
    summary: 估值故事来自一串已披露的经营里程碑，不是公开价格发现一路推出来的直线。
    data:
      items:
        - label: 2021 年私募估值参考
          date: '2021-01-01'
          detail: TechCrunch 称，2024 年 >$6B 的估值高于 2021 年的 $3B 估值。
        - label: Series D 轮
          date: '2022-04-07'
          detail: Grafana 正式宣布 $240M 的 Series D 轮融资。
        - label: Series D 延展轮
          date: '2024-08-21'
          detail: Grafana 披露约 $270M 的一级和二级延展交易，估值超过 $6B，当时 ARR >$250M、客户 >5,000 家。
        - label: 更大规模后的二级交易
          date: '2025-09-30'
          detail: Grafana 在一笔二级交易中披露 ARR >$400M、客户 >7,000 家，但未披露价格。
        - label: 2026 年流动性图景
          date: '2026-05-20'
          detail: SEC 搜索仍看不到 S-1；二级市场追踪器对当前私募估值意见不一。
    approximationNotes: 2021 年节点是引用的过往参考，并非当前章节来源材料里一手披露的融资轮次文件。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV012
      - CV013
      - CV014
  - id: FV004
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于 Grafana 最终落在宽口径 SaaS 中位数和 Datadog 式高溢价可观测性经济性之间的哪个位置。
    data:
      nodes:
        - id: N1
          label: 已披露规模
          detail: '>$400M ARR、>7,000 家客户、35M+ 用户'
          type: input
        - id: N2
          label: 市场重置
          detail: 2026 年 Q1，公开 SaaS 中位数约 6.4x，BVP 云指数约 8.0x
          type: input
        - id: N3
          label: 溢价可比上限
          detail: Datadog 凭更强增长和盈利能力，交易倍数仍在十几倍中高段
          type: input
        - id: N4
          label: 不透明折价
          detail: 没有公开 S-1，也没有公开 NRR、利润率、烧钱速度或股权结构条款
          type: risk
        - id: N5
          label: '>$6B 估值合理到偏紧'
          detail: 最后一个硬披露估值标记已经隐含相对宽口径软件中位数的溢价倍数
          type: insight
        - id: N6
          label: 跟踪
          detail: 只有入场价格更低，或财务证据更充分时，才买入
          type: output
      edges:
        - from: N1
          to: N5
          label: 支撑溢价叙事
        - from: N2
          to: N5
          label: 压住可接受倍数
        - from: N3
          to: N5
          label: 划定上行空间上限
        - from: N4
          to: N5
          label: 需要折价
        - from: N5
          to: N6
          label: 现有证据支持保持纪律
    approximationNotes: 这张逻辑图有意保持定性，只总结决策链，不加入新事实。
    claimRefs:
      - CV026
      - CV045
      - CV052
      - CV054
      - CV056
