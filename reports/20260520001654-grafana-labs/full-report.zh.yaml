        - 直接商业套件
        - TTM 收入 $1.68B；市值 $5.56B
        - 以日志 / 搜索为中心的团队和开放采集买方
        - 以日志为中心的平台、Prometheus 原生和 OTel 优先叙事、serverless 选项
        - 商业形态仍更受基础设施 / 部署方式驱动
      - - New Relic
        - 直接商业套件
        - 保留公开平台信号；定价页面透明
        - 想要平台覆盖广、且可自助购买的团队
        - 宽可观测性平台，并明确强调定价透明
        - 当前公开规模信号在保留来源集中不那么可见
      - - Prometheus + OpenTelemetry
        - 开源基础层
        - 许多团队默认采用的免费标准层
        - Kubernetes 重度使用、工程主导的采用者
        - 可移植指标和采集标准；装机基础巨大
        - 单独看不是完整商业控制平面
      - - VictoriaMetrics / SigNoz
        - 开放核心 / 成本挑战者
        - Prometheus 兼容、开源主导定位
        - 替换高价套件的成本敏感团队
        - 成本更低、兼容开源的替代方案，主攻锁定效应
        - 商业足迹小于高价套件，覆盖面也更窄
      - - Azure Monitor / Google Cloud Observability 原生服务
        - 超大规模云厂商原生替代品
        - 绑定云账户上下文，按用量计费
        - 已标准化在 Azure 或 Google Cloud 上的团队
        - 贴近原生云环境、托管 Prometheus 桥接和简单采购路径
        - 更适合以云为中心的技术栈，不是中立多云控制平面
