  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和最后硬估值
        blocks:
          - type: paragraph
            body: >-
              作为一家私有可观测性公司，Grafana 的估值历史异常清楚，但只到某个点为止。官方公司记录给出三个硬里程碑：2022 年 4 月 $240 million Series D，2024 年 8 月约 $270
              million 的 Series D 新股加老股延伸轮、估值超过 $6 billion，以及 2025 年 9 月一笔二级交易，确认运营规模超过 $400 million ARR 和 7,000
              客户，但未披露价格。这意味着投资人有一个清晰的已定价后期锚点，一个锚点之后的清晰运营更新，随后就是一大片缺口：当前确切估值、确切 ARR、留存、利润率和股权结构仍然私有。


              承销含义很重要。2024 年 8 月，披露的 >$6 billion 估值对应 >$250 million ARR 和 >5,000 客户，意味着公开倍数大约为 ARR 的 24x 或更低。公司在 2025 年
              9 月披露 >$400 million ARR 后，即使估值标记未动，同一估值锚点也会压缩到约 15x 或更低。这仍是溢价估值，但不再明显脱离最好的公开可观测性公司。市场问题因此不是 Grafana
              是否应相对慢速同行享有溢价，而是当前证据是否足以支撑一个仍高于广义 SaaS 中位数的溢价。


              反向细节在于 2024 年融资后的不透明。Forbes 报道称，Grafana 在 2024 年讨论过一笔内部轮，估值持平 $6
              billion，一些外部投资人认为这个价格对当时市场偏贵。与此同时，二级市场跟踪器分歧很大：TechStackIPO 仍显示最后已知私募估值为 $6 billion，Forge 则显示 2026 年 2 月
              Series E 标记为 $9 billion。由于两个二级跟踪器都不是已披露定价的新股融资，审慎做法是锚定公司官方披露，并把这些跟踪器视为需求不确定性的证据，而不是公允价值证明。
