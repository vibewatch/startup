      - number: '6.5'
        title: 客户口碑偏正面，复杂度和支持仍是主要反向信号
        blocks:
          - type: paragraph
            body: >-
              独立评论图景总体偏正面。G2 的评论量和评分支撑了这个判断：真实运营人员普遍喜欢
              Grafana，定性主题也吻合更广的产品逻辑——团队看重灵活性、可视化、插件广度，以及把多个数据源的可观测性集中起来的能力。这与公司相对更封闭套件的最强竞争定位一致。重视成本控制、开放性和可组合性的客户，通常有足够公开理由偏好
              Grafana。


              反向解读不是流失恐慌，而是运营摩擦。评论和对比页面反复出现同一组风险：搭建可能困难，高级告警和仪表盘需要专业能力，文档和上手引导并不总是充分，支持体验相比高端全托管竞争对手更不稳定。这意味着 Grafana
              的客户风险不是产品市场契合度弱，而是开放、模块化平台的经典取舍：熟练团队会得到更低成本和更高灵活性，但期待开箱即用工作流的买家会觉得要求更高。尽调应转化为两个问题。第一，按细分拆开客户健康度，因为成熟云原生团队喜欢的东西，资源不足的买家可能觉得笨重。第二，测试
              Grafana 的 AI、引导式工作流和市场打包是否真的在新队列里降低复杂度税。
            claimRefs:
              - CU028
