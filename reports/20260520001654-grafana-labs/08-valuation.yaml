  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: Exact current ARR and a bridge from the disclosed September 2025 ARR floor above $400 million.
    whyItMatters: The chapter's fair-value range moves materially depending on whether current ARR is closer to $400 million or already above $500 million.
    diligencePath: Request management-certified ARR, bookings, and cohort bridge under NDA.
  - type: private-evidence-only
    severity: material
    topic: retention-and-margin
    missingEvidence: NRR, GRR, gross margin by deployment model, and current burn or free cash flow.
    whyItMatters: Premium software multiples require evidence of durable retention and a credible path to public-company-quality profitability.
    diligencePath: Request cohort retention tables, gross-margin bridge, and monthly cash-burn schedule.
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Preferred share terms, liquidation stack, and whether the 2025 secondary implied a flat, up, or down price to the 2024 mark.
    whyItMatters: Headline valuation can overstate common-equity value when preference terms are heavy.
    diligencePath: Review the cap table, secondary transaction pricing memo, and liquidation waterfall.
  - type: conflicting-data
    severity: minor
    topic: current-private-mark-and-tv004-comparable-valuation-table-coverage
    missingEvidence: A canonical 2026 price reference that reconciles the $6 billion TechStackIPO tracker and the $9 billion Forge tracker.
    whyItMatters: Conflicting tracker marks confirm private-market demand uncertainty and should not be mistaken for clean price discovery.
    diligencePath: Use only official financing documents or a board-approved 409A or tender memo to reset the valuation anchor.
    relatedTableRefs: [TV004]
  - type: missing-source
    severity: minor
    topic: exit-timing
    missingEvidence: Public evidence of governance, audit, and banker readiness that would support a near-term IPO timeline.
    whyItMatters: Exit timing changes required return thresholds for late-stage private investors.
    diligencePath: Ask management for IPO readiness workstreams and external advisor engagement history.
