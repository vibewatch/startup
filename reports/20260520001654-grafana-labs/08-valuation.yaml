- id: public-market-benchmarks
  title: Public market benchmarks and multiple compression
  body: |-
    Public comps give the cleanest reality check on what investors will currently pay for scaled observability assets. Datadog is the premium end of the set: Q1 2026 revenue reached $1.006 billion, full-year revenue guidance was $4.30 billion-$4.34 billion, non-GAAP operating margin was 22%, free cash flow was $289 million in the quarter, and MarketBeat showed a market capitalization of about $76.6 billion on 2026-05-20. That places Datadog at a high-teens market-cap-to-revenue proxy, or mid-to-high teens on an enterprise-value basis after adjusting for $4.8 billion of cash. Dynatrace sits in the balanced-growth middle: $2.054 billion of ARR, $2.018 billion of FY2026 revenue, 29% non-GAAP operating margin, $529 million of free cash flow, and a market capitalization near $11.9 billion imply roughly a 6x public multiple. Elastic is the low end of the relevant set, at approximately $5.6 billion of market cap against $1.734 billion-$1.736 billion of FY2026 revenue guidance, or roughly 3x.

    Those public numbers line up with broader market references. A public SaaS multiples dataset pegged the Q1 2026 broad median at 6.4x EV/revenue, the BVP cloud index at 8.0x, and the 2021 peak at 18.6x. The same dataset places 20-40% growth companies in a 5-8x band and 40-60% growers in an 8-11x band, while Datadog still sits in a premium cohort around 16x because of its scale, growth, and profitability. Multiples.vc's May 2026 survey reinforces the same conclusion from a different angle: valuation dispersion across software is now driven less by story stock momentum and more by AI relevance, specialization, technical depth, and profitability.

    For Grafana, this means the comp argument is not binary. The company has enough scale, open-source reach, and customer breadth to deserve a premium to Elastic's low-single-digit multiple. But without disclosed margin, NRR, or cash-flow quality, it does not have public proof that it should sit shoulder to shoulder with Datadog at a persistent high-teens multiple. The market evidence supports a premium to the median only if investors are willing to underwrite both continued strong growth and a credible path to public-company-quality profitability.
