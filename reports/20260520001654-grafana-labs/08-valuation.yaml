- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis
  - Anti-thesis / what would change the view
  rows:
  - - Grafana has crossed late-stage scale thresholds with $400M+ ARR, 7,000+ customers, and repeated investor support.
    - Scale alone does not justify a premium multiple if NRR, margin, and burn remain undisclosed.
  - - Open-source reach and multi-signal product breadth justify a premium to lower-multiple peers such as Elastic.
    - Without public proof of Datadog-like profitability and retention, Grafana should still trade below the premium public leader.
  - - The 2024 >$6B financing extension and 2025 secondary show institutional demand for the story.
    - Forbes' flat-round reporting and conflicting secondary marks show that price discovery is still uncertain.
  - - Strategic deals for Splunk and New Relic show large buyers still value scaled observability assets.
    - Those deals were struck at mid-single-digit multiples, not at 2021-style software premiums.
  - - IPO optionality remains real because Grafana has scale, brand, and investor depth.
    - No public S-1 exists through 2026-05-20, so IPO timing should not be treated as a near-term valuation kicker.
  notes: The anti-thesis column is intended as a live monitoring checklist rather than a generic risk list.
