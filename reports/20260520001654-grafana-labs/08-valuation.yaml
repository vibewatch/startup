  - CV054
  - CV056
callouts:
- calloutType: recommendation
  title: TRACK at the last hard disclosed mark
  body: Grafana looks like a real late-stage observability platform, but the current public evidence set still supports only a disciplined valuation range, not a conviction premium. The most investable setup is either a lower entry price or a better disclosed financial packet.
  claimRefs:
  - CV055
  - CV056
- calloutType: risk
  title: Private-market price discovery is still incomplete
  body: Official disclosures clearly show operating scale, but they do not disclose exact current ARR, NRR, margin, burn, or the preference stack. Conflicting secondary marks and no public S-1 mean that current value should be treated as an underwriting range rather than a known price.
  claimRefs:
  - CV012
  - CV015
  - CV053
