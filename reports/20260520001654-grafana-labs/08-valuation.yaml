- id: transaction-benchmarks-and-scenario-work
  title: Transaction benchmarks and scenario work
  body: |-
    The transaction set is useful because it shows what strategic or sponsor buyers have actually paid for scaled observability assets when public multiples alone were not the decision driver. Cisco paid approximately $28 billion for Splunk in March 2024, and Splunk had just reported $4.216 billion of FY2024 revenue and $4.208 billion of ARR, implying a takeout multiple around 6.6x to 6.7x. New Relic's take-private at about $6.5 billion shows that scaled but less premium observability assets still command meaningful strategic value, but not at Datadog-like cloud premiums. Together, those deals suggest that the private and strategic floor for real observability platforms is far from distressed, yet materially below the peak-cycle software marks that many private companies enjoyed in 2021-2022.

    Scenario analysis therefore matters more than point estimates. A conservative case that uses only the disclosed September 2025 ARR floor above $400 million and broad 2026 SaaS growth-cohort ranges of 5-8x supports roughly $2.0 billion-$3.2 billion before any premium adjustment. A base case that assumes Grafana deserves a premium band of 10-12x on a $400 million-$500 million working ARR range supports roughly $4.0 billion-$6.0 billion. A bull case that assumes $500 million-$600 million ARR and a Datadog-like 13-15x premium supports roughly $7.0 billion-$9.0 billion. Those bands align with what the business quality suggests while still respecting the fact that public market evidence has reset materially since 2021.

    DCF can act only as a triangulation method here because too many key inputs are undisclosed. Damodaran's current software cost-of-capital data puts public software discount rates in the high-single digits, but private-company illiquidity, cap-table uncertainty, and disclosure risk push a realistic Grafana discount rate into roughly the 12-14% range. Without public gross margin, operating margin, or capex disclosure, the DCF conclusion should be treated as supportive rather than dispositive. In practice, the multiple-based framework remains the more honest valuation method for this chapter.
