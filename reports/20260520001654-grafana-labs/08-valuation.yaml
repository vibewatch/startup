  rows:
  - - Recommendation
    - TRACK; improve to BUY only below the mid-$5B range or with proof of $500M+ ARR and premium retention.
  - - Confidence
    - Medium; company quality is well evidenced but valuation precision is constrained by private-company opacity.
  - - Valuation stance
    - Fair to stretched at the last hard disclosed mark above $6B.
  - - Last hard public valuation anchor
    - August 2024 Series D extension at over $6B, with approximately $270M of primary and secondary proceeds.
  - - Latest disclosed operating scale
    - More than $400M ARR and more than 7,000 customers as of September 2025.
  - - Base-case valuation band
    - Approximately $4.0B-$6.0B on 10-12x and $400M-$500M working ARR.
  - - Bull case
    - Approximately $7.0B-$9.0B if ARR reaches roughly $500M-$600M and the market gives Grafana a Datadog-like premium.
  - - Bear case
    - Approximately $2.0B-$4.0B if growth slows and multiples compress to 6-8x.
  - - Most likely exit
    - Private secondary, another late-stage round, or strategic M&A before a near-term IPO.
  - - Primary diligence blockers
    - Current ARR, NRR/GRR, gross margin, cash burn, and preference stack.
  notes: Recommendation is explicitly price-sensitive and evidence-sensitive. Ranges combine disclosed ARR floors with public comp and market-multiple evidence rather than assuming an undisclosed 2026 mark.
