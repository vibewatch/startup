- id: TV008
  title: Final diligence asks and thesis-break triggers
  columns:
  - Topic / trigger
  - Missing evidence or threshold
  - Why it matters
  - Action implication
  rows:
  - - Current ARR
    - 'Need a current management-certified ARR figure and bridge from the >$400M September 2025 floor.'
    - A 20% error changes fair value by billions of dollars at premium multiples.
    - No upgrade from TRACK without it.
  - - NRR / GRR
    - Need cohort retention and expansion by cloud vs self-managed deployment.
    - Premium multiples above 10x are difficult to defend without strong retention.
    - Weak retention would shift the case toward the bear band.
  - - Gross margin and burn
    - Need gross margin by deployment model, operating loss or profit, and cash runway.
    - Investors cannot judge whether Grafana is maturing toward Datadog or merely scaling revenue.
    - High burn would compress acceptable entry price.
  - - Preference stack / liquidation terms
    - Need full cap table, preferred terms, and any structured secondary rights.
    - Common-equity outcomes can diverge sharply from headline valuation.
    - A heavy preference overhang lowers effective investor upside.
  - - Secondary pricing path
    - Need the implied price of the 2025 secondary and any 2026 follow-on mark.
    - Official valuation evidence after 2024 is missing, so market clearing price is unclear.
    - A flat or down private mark would support a more cautious stance.
  - - Liquidity / IPO path
    - Need board, governance, audit, and banking readiness evidence beyond secondary-platform tracking.
    - No S-1 on file means IPO timing cannot be assumed.
    - If IPO timing slips materially, required private-market return thresholds rise.
  notes: This table combines diligence asks with thesis-break conditions because both are ultimately valuation transmission mechanisms.
