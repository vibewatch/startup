- id: TV007
  title: Bull / base / bear scenario analysis
  columns:
  - Scenario
  - Working ARR assumption
  - Multiple band
  - Implied valuation
  - What has to be true
  - What breaks it
  rows:
  - - Bull
    - $500M-$600M
    - 13x-15x
    - ~$7.0B-$9.0B
    - Grafana proves premium retention, margin improvement, and a cleaner liquidity path while market appetite remains near the top quartile.
    - Growth slips below premium software thresholds or investors stop paying Datadog-like premiums.
  - - Base
    - $400M-$500M
    - 10x-12x
    - ~$4.0B-$6.0B
    - Investors give Grafana a premium to the broad SaaS median but still a discount to Datadog.
    - Lack of proof on NRR or gross margin keeps investors closer to 8-10x.
  - - Bear
    - $350M-$450M
    - 6x-8x
    - ~$2.0B-$4.0B
    - Market treats Grafana more like a good but opaque private software asset than a premium public comp.
    - Down-round pressure, weaker growth, or liquidity stress pushes pricing below even this band.
  - - DCF cross-check
    - Revenue and margin paths undisclosed
    - 12%-14% discount rate; 15x-18x terminal EBITDA lens
    - Typically below the bull-case multiple outcome unless growth remains >30%
    - Requires confidence in long-term margin structure and cash conversion.
    - Breaks down if current gross margin, burn, or capex assumptions are wrong.
  notes: Scenario bands are deliberately presented as ranges, not a false single-point target. The DCF row is a triangulation device, not the lead method.
