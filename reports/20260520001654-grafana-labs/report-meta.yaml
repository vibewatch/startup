tagline: "Open source observability platform for metrics, logs, traces, and dashboards"
headline:
  summary: |
    Grafana Labs has grown from an open-source dashboarding project into one of the most credible independent observability platforms in the market. The company now spans dashboards, metrics, logs, traces, profiles, testing, and telemetry collection through Grafana plus the broader LGTM stack, and public disclosures support late-stage scale with 25M+ users, 7,000+ customers, and ARR above $400M. That combination of OSS adoption, product-led growth, and enterprise packaging makes Grafana a real strategic asset in a still-expanding observability category.

    The main question is not whether Grafana is a real company with product-market fit; it is whether a new investor is being compensated for the remaining opacity. The last hard public valuation anchor — over $6B in the August 2024 Series D extension — still implies a premium multiple versus broad SaaS medians, while Grafana remains under-disclosed on gross margin, burn, NRR/GRR, and cap-table terms. Competition from Datadog, Dynatrace, Elastic, and hyperscaler-managed offerings is real, and Grafana's own breadth introduces complexity even as it strengthens the platform.

    Net: this is a strong company worth tracking closely, but the public record supports business quality more clearly than it supports aggressive entry pricing. Grafana looks attractive on product, distribution, and strategic relevance; it looks only selectively attractive on valuation.
  investmentStance: "TRACK"
  investmentThesis: |
    Grafana combines an unusually strong open-source distribution engine with enough commercial scale to matter in enterprise observability. However, the last disclosed >$6B mark already prices in a meaningful quality premium, and key underwriting inputs — retention, margin, burn, and preference structure — remain private. The name merits ongoing attention, but entry discipline matters.
