companyProfile:
  summary: >
    Grafana Labs is a late-stage private observability company founded in 2014 by
    Raj Dutt, Torkel Ödegaard, and Anthony Wood after Ödegaard created Grafana in
    late 2013. From that dashboarding origin, the company has expanded into a broad
    open observability platform spanning Grafana, Loki, Tempo, Mimir, Pyroscope,
    k6, and Alloy, sold through open-source, managed cloud, enterprise, and
    regulated-cloud packaging. Public disclosures now support meaningful scale —
    25M+ users, 7,000+ customers, and ARR above $400M — while also confirming that
    Grafana remains private and still materially under-discloses the financial
    quality-of-earnings inputs investors need for high-conviction underwriting.
  foundedDate: "2014-01-01"
  founders:
    - name: "Raj Dutt"
      role: "Co-founder & CEO"
      background: "Commercialized Grafana with the founding team and remains the company's primary public and investor-facing executive."
      claimRefs: [CO003, CO004]
