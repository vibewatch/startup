evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance disclosure
    missingEvidence: >-
      A current board roster, committee structure, and investor observer-rights summary are not fully visible in
      reviewed public sources.
    whyItMatters: >-
      Control, governance quality, and investor influence can materially affect strategic flexibility and future
      financing terms.
    diligencePath: >-
      Request the latest board materials, governance summary, and a current cap-table/observer schedule directly from
      management.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table public coverage
    missingEvidence: >-
      The public record does not fully enumerate the current executive bench or board-level governance around the
      leadership table.
    whyItMatters: >-
      Leadership concentration and succession risk cannot be judged cleanly without a fuller executive and governance
      roster.
    diligencePath: Request the current executive-team list, board roster, and reporting lines from management.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: >-
      Reviewed primary sources do not provide an audited current revenue figure or an exact, current
      total-capital-raised figure.
    whyItMatters: Revenue quality and cumulative capital inform dilution, valuation support, and operating leverage judgments.
    diligencePath: >-
      Request the latest board-approved financial package, revenue bridge, and financing history from management or the
      data room.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table public chronology
    missingEvidence: >-
      The public record almost certainly omits smaller launches, governance changes, and customer milestones not
      captured in the chronology table.
    whyItMatters: >-
      The chapter can ship with a partial public chronology, but internal diligence should confirm whether any omitted
      events materially change the narrative.
    diligencePath: Request an internal corporate timeline covering financing, leadership, product launches, and adverse events.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: grafana-sam-som
    missingEvidence: A management-ready SAM and SOM model for Grafana by buyer size, deployment mode, and open-standards readiness.
    whyItMatters: >-
      Public sources validate category growth but do not isolate the monetizable subset that Grafana can win in the next
      three to five years.
    diligencePath: >-
      Request pipeline segmentation, contract values, OSS-to-paid conversion cohorts, and win/loss data by competitor
      class.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      A public or company-provided dataset that quantifies which role actually owns the observability budget across
      enterprise deals.
    whyItMatters: >-
      The market clearly has mixed user and executive stakeholders, but public sources do not quantify who signs or
      funds the contract often enough to size selling motion risk precisely.
    diligencePath: >-
      Ask management for buyer maps from recent enterprise wins, procurement artifacts, and win-loss analysis broken out
      by budget owner persona.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: grafana-win-loss
    missingEvidence: Win-loss data by competitor class plus gross margin and attach-rate outcomes for cost-optimization-led deals.
    whyItMatters: >-
      Public sources show the competitive shape, but they do not reveal whether Grafana actually wins often enough
      against Datadog, Dynatrace, Elastic, or cloud-native defaults in the highest-value segments.
    diligencePath: >-
      Request a recent win-loss deck split by competitor, deal size, deployment mode, and whether open standards or cost
      savings decided the outcome.
    relatedTableRefs:
      - TP006
  - type: private-evidence-only
    severity: material
    topic: oss-to-cloud-conversion
    missingEvidence: >-
      OSS-to-Cloud conversion cohorts, retention, and expansion metrics segmented by Prometheus, Loki, Tempo, Mimir, and
      Alloy entry points.
    whyItMatters: >-
      Grafana’s moat depends heavily on open-source entry translating into durable commercial expansion, but that
      conversion bridge is not public.
    diligencePath: >-
      Request cohort conversion data and NRR by entry product, self-managed vs cloud, and by competitor encountered at
      expansion.
    relatedTableRefs:
      - TP003
      - TP006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Company-specific gross margin, CAC, payback, logo retention, gross retention, and net revenue retention by Cloud
      versus Enterprise.
    whyItMatters: >-
      These metrics determine whether Grafana is scaling like a high-quality infrastructure SaaS business or simply
      buying growth with private capital.
    diligencePath: >-
      Request the last eight quarters of KPI reporting used by management and the board, including cohort retention and
      sales-efficiency metrics.
    relatedQuestionRefs:
      - QI011
      - QI012
      - QI024
    relatedTableRefs:
      - TI003
      - TI006
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Quarter-end cash, debt schedule, monthly burn, covenant package, and base / downside runway model.
    whyItMatters: >-
      Without balance-sheet data, investors cannot judge capital adequacy, downside resilience, or the need for another
      primary raise.
    diligencePath: >-
      Request current balance sheet support, debt agreements, treasury schedule, and the operating model used for board
      liquidity reviews.
    relatedQuestionRefs:
      - QI018
      - QI019
    relatedTableRefs:
      - TI004
  - type: conflicting-data
    severity: material
    topic: cumulative-capital-raised
    missingEvidence: >-
      A financing ledger that reconciles every primary round, secondary transaction, tender, and any undisclosed early
      financing.
    whyItMatters: >-
      Conflicting public totals distort dilution analysis, cap-table history, and the interpretation of current
      valuation support.
    diligencePath: >-
      Request the full financing chronology from finance or legal, including dates, securities, primary proceeds, and
      secondary proceeds.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI005
      - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Actual contract waterfalls, overage incidence, user-billing exposure, retention extensions, and discount bands by
      segment.
    whyItMatters: >-
      Public list pricing is transparent, but pricing realization determines revenue quality, upsell durability, and
      customer satisfaction risk.
    diligencePath: >-
      Request anonymized top-20 customer contracts and a pricing-operations memo covering standard discounts, renewal
      policy, and exception handling.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI021
      - QI022
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: module-adoption-and-attach
    missingEvidence: >-
      Module-level adoption, paid attach, and retention for Assistant, IRM, Application Observability, Frontend
      Observability, and enterprise plugins.
    whyItMatters: >-
      Chapter 5 can verify the products exist and are priced, but not whether they materially deepen monetization or
      customer stickiness.
    diligencePath: >-
      Request product-family ARR, attach, expansion, and active-customer metrics split by Cloud module and Enterprise
      plugin bundle.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: security-architecture-depth
    missingEvidence: >-
      Detailed public architecture evidence for how Cloud security controls, Federal Cloud boundaries, and
      module-specific security guarantees are implemented.
    whyItMatters: >-
      Packaging-level compliance language is not the same as proof of secure-by-design architecture or module-by-module
      maturity in regulated deployments.
    diligencePath: >-
      Request current security architecture review materials, certification scopes, shared-responsibility matrices, and
      recent product security postmortems for the cloud control plane.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: minor
    topic: ai-workflow-proof
    missingEvidence: >-
      Independent customer or benchmark evidence showing how much Grafana Assistant and adaptive telemetry improve MTTR,
      query productivity, or telemetry waste reduction in production.
    whyItMatters: >-
      AI and optimization claims are strategically important roadmap signals, but their underwriting value depends on
      measurable customer outcomes rather than vendor positioning alone.
    diligencePath: >-
      Request customer references, module-level case studies, and before/after operational metrics for AI Assistant and
      Adaptive Telemetry deployments.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: material
    topic: retention disclosure gap
    missingEvidence: >-
      Segmented GRR, NRR, logo churn, and cohort retention tables for Grafana Cloud, Enterprise, and public-sector
      customers.
    whyItMatters: >-
      Without cohort disclosure, customer durability is being inferred from migration effort and workflow embed rather
      than measured renewals.
    diligencePath: >-
      Request cohort tables by segment plus last-12-month churn and renewal commentary from finance and sales
      operations.
    relatedQuestionRefs:
      - QU021
    relatedTableRefs:
      - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration disclosure gap
    missingEvidence: Top-10 customer ARR share, top-10 partner-sourced ARR share, and largest-renewal exposure by quarter.
    whyItMatters: A 7,000-customer count can still mask outsized dependence on a few Fortune 50 accounts or channel relationships.
    diligencePath: Request customer concentration schedule, partner-sourced pipeline/ARR split, and largest upcoming renewals.
    relatedQuestionRefs:
      - QU022
      - QU023
    relatedTableRefs:
      - TU005
  - type: private-evidence-only
    severity: material
    topic: free-to-paid conversion
    missingEvidence: Conversion rates from OSS or free-tier usage into Pro, Advanced, Enterprise, and Federal Cloud contracts.
    whyItMatters: >-
      The PLG narrative is compelling, but underwriting CAC efficiency requires actual conversion, expansion, and
      payback data.
    diligencePath: >-
      Request funnel data from growth and finance covering signups, activated teams, paid conversion, and expansion by
      cohort.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage
    missingEvidence: >-
      More independent, customer-authored ROI or renewal disclosures for large-logo accounts beyond Booking.com, SpotOn,
      Microsoft, Salesforce, and Wikimedia.
    whyItMatters: >-
      The current public proof set is enough to prove real production adoption, but not enough to measure breadth of
      quantified outcomes across the full customer base.
    diligencePath: >-
      Prioritize customer reference calls and renewal histories for two Fortune 50 accounts plus one public-sector
      deployment.
    relatedQuestionRefs:
      - QU026
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: profitability disclosure
    missingEvidence: Audited burn, free cash flow, gross margin by signal, and cash-runway schedules.
    whyItMatters: >-
      Public ARR alone cannot show whether Grafana’s operating model is scaling efficiently or still depends on generous
      private financing conditions.
    diligencePath: >-
      Request the last eight quarters of management reporting, board materials on burn multiple, and margin bridges by
      logs, metrics, traces, profiles, and enterprise-seat revenue.
    relatedQuestionRefs:
      - QR020
      - QR031
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: partner concentration
    missingEvidence: Channel-sourced bookings, marketplace mix, hyperscaler concentration, and direct-versus-partner renewal rates.
    whyItMatters: >-
      Grafana’s cloud partnerships are both advantages and dependencies; without concentration data, investors cannot
      judge strategic independence or revenue quality.
    diligencePath: >-
      Request sourced pipeline, booked ARR, renewal ARR, and gross-margin contribution by AWS, Azure, public sector, and
      direct enterprise channels.
    relatedQuestionRefs:
      - QR024
      - QR031
    relatedTableRefs:
      - TR003
      - TR004
  - type: conflicting-data
    severity: material
    topic: valuation path
    missingEvidence: Definitive terms and completion status of the reported 2026 financing or tender process.
    whyItMatters: >-
      Public trackers and articles imply large valuation markers, but not a fully transparent, liquid market-clearing
      price.
    diligencePath: >-
      Request the latest signed term sheets, secondary pricing history, board valuation memos, and preference stack for
      the most recent rounds.
    relatedQuestionRefs:
      - QR021
      - QR031
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: enterprise durability
    missingEvidence: NRR, GRR, logo churn, expansion by product line, and cohort behavior during telemetry-optimization cycles.
    whyItMatters: >-
      Grafana’s risk case turns on whether openness converts into durable enterprise revenue rather than usage that is
      easy to optimize away.
    diligencePath: >-
      Request cohort tables by segment, spend band, cloud channel, and product mix, with special attention to
      enterprise-plugin attach and multicloud customers.
    relatedQuestionRefs:
      - QR023
      - QR031
    relatedTableRefs:
      - TR004
      - TR005
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: Exact current ARR and a bridge from the disclosed September 2025 ARR floor above $400 million.
    whyItMatters: >-
      The chapter's fair-value range moves materially depending on whether current ARR is closer to $400 million or
      already above $500 million.
    diligencePath: Request management-certified ARR, bookings, and cohort bridge under NDA.
  - type: private-evidence-only
    severity: material
    topic: retention-and-margin
    missingEvidence: NRR, GRR, gross margin by deployment model, and current burn or free cash flow.
    whyItMatters: >-
      Premium software multiples require evidence of durable retention and a credible path to public-company-quality
      profitability.
    diligencePath: Request cohort retention tables, gross-margin bridge, and monthly cash-burn schedule.
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Preferred share terms, liquidation stack, and whether the 2025 secondary implied a flat, up, or down price to the
      2024 mark.
    whyItMatters: Headline valuation can overstate common-equity value when preference terms are heavy.
    diligencePath: Review the cap table, secondary transaction pricing memo, and liquidation waterfall.
  - type: conflicting-data
    severity: minor
    topic: current-private-mark-and-tv004-comparable-valuation-table-coverage
    missingEvidence: >-
      A canonical 2026 price reference that reconciles the $6 billion TechStackIPO tracker and the $9 billion Forge
      tracker.
    whyItMatters: >-
      Conflicting tracker marks confirm private-market demand uncertainty and should not be mistaken for clean price
      discovery.
    diligencePath: Use only official financing documents or a board-approved 409A or tender memo to reset the valuation anchor.
    relatedTableRefs:
      - TV004
  - type: missing-source
    severity: minor
    topic: exit-timing
    missingEvidence: Public evidence of governance, audit, and banker readiness that would support a near-term IPO timeline.
    whyItMatters: Exit timing changes required return thresholds for late-stage private investors.
    diligencePath: Ask management for IPO readiness workstreams and external advisor engagement history.
