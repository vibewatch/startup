- id: milestones-and-risk-context
  title: Milestones and risk context
  body: |-
    Grafana Labs' chronology matters because the company has repeatedly expanded from one open-source visualization tool into a broader full-stack observability platform. The sequence is visible in public sources: Grafana starts in 2013, the company is founded in 2014, enterprise validation appears through relationships like J.P. Morgan, tracing expands with Tempo, and the 2022 and 2024 financing events show investors continuing to fund the strategy at multibillion-dollar valuations. The through-line is not a single feature but a platform strategy built around adjacent observability signals.

    The main counterweight is operational complexity. Grafana's public advisory index shows recurring vulnerabilities across multiple products, and the 2025 SCIM flaw demonstrated that enterprise and cloud control planes can produce real privilege-escalation risk when advanced identity-management features are enabled. Public reporting also suggests patching was rapid and that OSS users were outside the blast radius of that particular issue, but investors should still treat security response discipline as part of the product-quality story. The other structural limitation is disclosure: board composition, audited current revenue, and exact total capital raised are still not fully public.
