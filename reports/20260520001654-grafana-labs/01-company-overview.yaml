company:
  name: Grafana Labs
chapter:
  number: 1
  title: Company Overview
  summary: Grafana Labs is a New York-headquartered, remote-first observability company founded in 2014 by Raj Dutt, Torkel Ödegaard, and Anthony Wood on top of the Grafana project Torkel created in late 2013. The company pairs an open-source core spanning Grafana, Loki, Tempo, Mimir, Pyroscope, and k6 with commercial Grafana Cloud and Grafana Enterprise offerings, and says it now serves 25M+ users and 7,000+ customers. Public evidence indicates it remains private; its April 2022 $240M Series D is linked by later reporting to a $6B valuation, while current diligence should still track private-company disclosure limits and recurring security-advisory obligations.
sections:
- id: identity-operating-model
  title: Identity and operating model
  body: |-
    Grafana Labs is a New York-based observability software company built around the Grafana project that Torkel Ödegaard created in December 2013 and commercialized with Raj Dutt and Anthony Wood in 2014. Third-party company profiles place headquarters in New York, while Grafana's own careers material emphasizes a global, remote-first operating model. The company says it now has 1,600+ employees across 40+ countries, which is consistent with a distributed engineering and go-to-market footprint rather than a single-office infrastructure vendor.

    The company positions itself as an open observability platform whose mission is to help builders turn signals into action across their business. That framing matters because Grafana is no longer just a dashboard product: the business now spans metrics, logs, traces, profiles, and load testing. Public evidence also indicates the company remains private. Even so, the official about material claims 25M+ users and 7,000+ customers, which makes these identity facts foundational for later chapters on market, product, competition, and valuation.
