- id: product-stack-and-monetization
  title: Product stack and monetization
  body: |-
    Grafana Labs now spans most of the core observability workflow. The flagship Grafana project provides monitoring and observability dashboards; Loki handles logs using label-based indexing; Tempo provides distributed tracing; Mimir offers long-term metrics storage for Prometheus; Pyroscope adds continuous profiling; and k6 extends the platform into load testing. The important diligence point is not just product count but adjacency: each project covers a different signal type while still connecting back to the same Grafana interface and open standards ecosystem.

    Commercialization happens through two packaging layers. Grafana Cloud is the fully managed SaaS platform, while Grafana Enterprise is the self-managed commercial edition for buyers that want advanced security, governance, plugins, and support. Public pricing creates a visible self-serve ramp—free tier, Pro from $19 per month plus usage, and enterprise commitments from $25,000 annually—while the enterprise page makes clear that SAML, LDAP, SCIM, RBAC, premium plugins, and response SLAs sit behind the paid layer. This is a textbook open-core model rather than pure support monetization.
