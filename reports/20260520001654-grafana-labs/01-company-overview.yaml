- id: founders-and-leadership
  title: Founders and leadership
  body: |-
    Grafana Labs' founder-market fit is unusually direct. Torkel Ödegaard did not arrive as a financial sponsor or hired executive; he built the original Grafana project himself after becoming frustrated with existing tools. Grafana's official founder list still centers the same three people: Raj Dutt, Torkel Ödegaard, and Anthony Wood. Raj remains CEO and the main commercial spokesperson, Torkel is listed as CGO and still embodies the technical and open-source identity of the company, and Anthony remains listed as co-founder.

    That continuity lowers classic founder-displacement risk, but it also concentrates institutional narrative around a small group. Craft's current profile adds Tom Wilkie as CTO, showing technical depth beyond the founding trio, yet public board-level disclosure remains thin relative to public SaaS peers. For diligence purposes, the positive read is stable founder continuity; the follow-up ask is a current board roster, committee structure, and any investor observer rights that are not spelled out in public materials.
