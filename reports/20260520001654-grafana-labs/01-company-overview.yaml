callouts:
- calloutType: strength
  title: Open-core flywheel is the central strategic asset
  body: Grafana's strongest asset is the linkage between community adoption and monetizable packaging. The same brand spans open-source projects, managed cloud, self-managed enterprise software, and partner-led distribution through AWS, which is why user and customer scale can compound rather than fragment.
  claimRefs:
  - CO011
  - CO022
  - CO024
  - CO033
  - CO041
- calloutType: risk
  title: Private-company opacity and patch cadence still matter
  body: Security does not negate the thesis, but it does raise diligence cost. The recent SCIM-related CVE was configuration-specific, excluded OSS, and was patched in managed offerings, yet the advisory index shows recurring issues across products. Pair that with limited public board and audited-financial disclosure, and management meetings plus customer references matter more than public web research alone.
  claimRefs:
  - CO037
  - CO039
  - CO040
  - CO045
