- id: capital-scale-and-status
  title: Capital, scale, and company status
  body: |-
    On capital, the anchor disclosed financing event remains the April 2022 Series D. Grafana Labs officially said it raised $240 million, with GIC leading and J.P. Morgan joining as a new investor. Later reporting filled in valuation context that the company itself did not emphasize in the announcement: Forbes wrote that company sources tied the April 2022 financing to a $6 billion valuation, and TechCrunch reported in August 2024 that a roughly $270 million extension to that same Series D left the company valued at more than $6 billion.

    The operating scale disclosed publicly is already substantial for a still-private infrastructure vendor. TechCrunch reported more than $250 million ARR and 5,000 paying customers by August 2024; Grafana's 2026 about page now claims 25M+ users and 7,000+ customers. SEC full-text search returned zero S-1 hits through 2026-05-20, and Craft still classifies the company as private. Together those signals support the judgment that Grafana Labs is a late-stage but still private open-source infrastructure company with meaningful scale and ongoing access to private capital.
