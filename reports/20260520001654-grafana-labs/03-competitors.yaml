  rows:
  - - Grafana Labs
    - Reference company
    - Private; 2024 valuation coverage at $6B
    - Cloud-native teams, platform engineering, multi-source observability
    - Open, composable LGTM stack; Grafana Cloud pricing starts free and usage-based; BYOC/no-lock-in pitch
    - Private revenue and conversion data remain opaque externally
  - - Datadog
    - Direct commercial suite
    - $3.67B TTM revenue; $76.58B market cap
    - Cloud-native and enterprise teams wanting one-vendor breadth
