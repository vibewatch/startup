  - - New Relic
    - Direct commercial suite
    - Public platform signal retained; transparent pricing surface
    - Teams wanting broad platform coverage with self-serve motion
    - Broad observability platform and explicit pricing transparency language
    - Current public scale signals are less visible in this retained source set
  - - Prometheus + OpenTelemetry
    - Open-source base layer
    - Free, standards-led default for many teams
    - Kubernetes-heavy and engineering-led adopters
    - Portable metrics and instrumentation standard; huge installed base
    - Not a full commercial control plane on their own
  - - VictoriaMetrics / SigNoz
    - Open-core / cost challenger
    - Prometheus-compatible and open-source-led positioning
    - Cost-sensitive teams replacing premium suites
    - Lower-cost, open-source-compatible alternatives that attack lock-in
    - Smaller commercial footprint and narrower breadth than premium suites
  - - Azure Monitor / Google Cloud Observability
    - Hyperscaler-native substitute
    - Bundled with cloud-account context and pay-as-you-go pricing
    - Teams already standardized on Azure or Google Cloud
    - Native cloud proximity, managed Prometheus bridges, and simple procurement path
    - Best for cloud-centric stacks, not neutral multi-cloud control planes
