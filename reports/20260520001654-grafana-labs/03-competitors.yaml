    - Premium but explicit, reinforcing enterprise positioning
  - - Elastic
    - Hosted resource-based; serverless usage-based; self-managed license-based
    - Infrastructure / usage / license
    - Multiple deployment modes
    - Flexible for mixed estates but more infra-shaped than Grafana’s cloud-led narrative
  - - SigNoz
    - $49/month team plan
    - Usage with included pool
    - Open-source-led cloud plus enterprise/self-hosted options
    - Direct low-end pressure on Grafana and Datadog-style suites
  - - groundcover
    - $30 per host per month Pro
    - Per host
    - Host-based and BYOC/on-prem friendly
    - Appeals to teams that distrust ingestion-based observability bills
