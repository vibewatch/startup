    - Per node
    - Hybrid-estate oriented suite
    - Brings cheaper hybrid monitoring alternative into RFPs
  - - Azure / Google
    - Pay-as-you-go with free basic allotments
    - Per GB, per sample, per span
    - Native cloud service pricing
    - Good enough default for cloud-centric buyers with low switching appetite
