  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: grafana-win-loss
    missingEvidence: Win-loss data by competitor class plus gross margin and attach-rate outcomes for cost-optimization-led deals.
    whyItMatters: Public sources show the competitive shape, but they do not reveal whether Grafana actually wins often enough against Datadog, Dynatrace, Elastic, or cloud-native defaults in the highest-value segments.
    diligencePath: Request a recent win-loss deck split by competitor, deal size, deployment mode, and whether open standards or cost savings decided the outcome.
    relatedTableRefs:
    - TP006
  - type: private-evidence-only
    severity: material
    topic: oss-to-cloud-conversion
    missingEvidence: OSS-to-Cloud conversion cohorts, retention, and expansion metrics segmented by Prometheus, Loki, Tempo, Mimir, and Alloy entry points.
    whyItMatters: Grafana’s moat depends heavily on open-source entry translating into durable commercial expansion, but that conversion bridge is not public.
    diligencePath: Request cohort conversion data and NRR by entry product, self-managed vs cloud, and by competitor encountered at expansion.
    relatedTableRefs:
    - TP003
