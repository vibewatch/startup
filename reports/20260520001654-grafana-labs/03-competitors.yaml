  rows:
  - - Grafana Cloud
    - Free; Pro from $19/mo + usage
    - Platform fee + usage
    - Open observability platform, free tier, Enterprise commit from $25k/year
    - Lets Grafana land cheaply and expand with usage while preserving BYOC and open standards
  - - Datadog
    - Module-specific pricing; logs at $0.10 per ingested/scanned GB
    - Per module, per GB, per event, and other add-ons
    - Highly modular suite pricing
    - Powerful for bundles, but easy for buyers to perceive as expensive and hard to model
  - - Dynatrace
    - $7 / $29 / $58 host-based tiers plus log GiB pricing
    - Per host, per GiB, per pod/container add-ons
