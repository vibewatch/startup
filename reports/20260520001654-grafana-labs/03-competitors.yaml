chapter:
  number: 3
  title: Competitors
  summary: Grafana competes against premium full-stack suites led by Datadog, Dynatrace, Elastic, and New Relic; against open-source and open-core substitutes led by Prometheus, OpenTelemetry, VictoriaMetrics, and SigNoz; and against cloud-native defaults from Microsoft and Google. Its strongest edge is openness, cost control, and multi-source flexibility, while its biggest weakness is bundle depth versus better-capitalized enterprise suites. The category remains highly contestable because open standards reduce instrumentation lock-in even as commercial vendors push AI-assisted operations and broader workflow bundles.
sections:
- id: landscape-and-peer-set
  title: Landscape and peer set
  body: "Grafana is no longer competing as a dashboard-only vendor. The relevant buyer shortlist now spans four overlapping groups: premium commercial suites such as Datadog, Dynatrace, Elastic, and New Relic; open-source and open-core building blocks such as Prometheus, OpenTelemetry, VictoriaMetrics, and SigNoz; lower-cost or narrower commercial challengers such as Honeycomb, SolarWinds, Sematext, groundcover, Better Stack, Sumo Logic, and Sentry; and status-quo substitutes from Azure Monitor, Google Cloud Observability, or stitched internal stacks. That breadth matters because many teams still standardize telemetry and workflows before they standardize a single commercial vendor.\n\nThe clearest direct commercial overlap is with vendors that already sell logs, metrics, traces, dashboards, and adjacent operational automation in one package. Datadog remains the scale leader in the retained public comp set, while Dynatrace competes from the enterprise high end and Elastic competes from the\
    \ log-search and open-ingestion angle. New Relic still belongs on the list because it markets a broad platform and public self-serve pricing, even if its current public scale disclosures are less front-and-center in this source set. The practical implication is that Grafana wins or loses less on whether teams need observability at all and more on whether they want an open control plane or a broader single-vendor operations bundle."
