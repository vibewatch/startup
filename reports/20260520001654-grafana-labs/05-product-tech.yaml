- id: TE005
  title: Technology stack table
  columns:
  - Layer
  - Primary implementation
  - Representative technologies
  - Operational benefit
  - Main caveat
  rows:
  - - Presentation and control plane
    - Grafana OSS / Enterprise / Cloud
    - Dashboards, Explore, alerting, data source query editors
    - One operator surface over many backends
    - Value depends on enough correlation and governance depth to justify standardization
  - - Collection and routing
    - Grafana Alloy plus SDKs / agents
    - OTLP, Prometheus pipelines, clustering, remote config, built-in UI
    - Single collector story across metrics, logs, traces, and profiles
    - Migration from older agents adds short-term friction
  - - Metrics storage
    - Grafana Mimir
    - Prometheus-compatible ingestion, multi-tenancy, recording and alert rules
    - Long-term metrics scale without abandoning Prometheus workflows
    - Distributed operations still require expertise at scale
  - - Log storage
    - Grafana Loki
    - Label-based indexing, LogQL, Grafana-native links
    - Lower cost and simpler operations than fully indexed alternatives
    - Search model depends on good label hygiene
  - - Trace storage
    - Grafana Tempo
    - Object storage, TraceQL, Jaeger / Zipkin / OTel protocols
    - Makes high-volume tracing more affordable and connected to other signals
    - Feature understanding is more complex than simple trace-ID lookup stories
  - - Profile storage
    - Grafana Pyroscope
    - Continuous profiling, pprof endpoints, flame graphs, object storage
    - Adds code-level visibility and optimization workflows
    - Profiling still requires more organizational maturity than dashboards or logs
  - - Testing and synthetic execution
    - Grafana k6 and Cloud Synthetics
    - JavaScript scripting, browser API, WebSockets, gRPC, CI/CD automation
    - Brings proactive reliability engineering into the platform
    - Commercial depth beyond the tool itself is not fully public
  - - Governance and enterprise envelope
    - Grafana Enterprise and Cloud governance features
    - RBAC, SAML, LDAP sync, SCIM, enterprise plugins, support, BYOC / Federal Cloud
    - Lets Grafana sell into regulated and self-managed environments without abandoning OSS roots
    - Public evidence is thinner on security architecture details than on packaging language
  notes: This is an implementation-layer view of the stack, not a pricing table; rows are organized around technical substrate and operating responsibility.
