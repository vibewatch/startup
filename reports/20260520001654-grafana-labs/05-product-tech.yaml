callouts:
- calloutType: strength
  title: Open control plane plus specialized stores is the defining product advantage
  body: Grafana wins technically when a customer wants one operator experience across heterogeneous tools instead of one proprietary backend for every signal. The combination of Grafana, LGTM backends, and Alloy makes that proposition concrete.
  claimRefs:
  - CE001
  - CE011
  - CE031
  - CE041
- calloutType: risk
  title: Collector migration is the clearest near-term execution risk
  body: Grafana’s move from Agent and Promtail toward Alloy is strategically coherent, but the migration docs themselves show that config conversion, changed metrics, and behavior differences can create friction for existing operators.
  claimRefs:
  - CE009
  - CE032
  - CE033
  - CE044
- calloutType: insight
  title: Grafana is monetizing workflow adjacency, not just storage
  body: The most important product expansion signal is that Grafana now prices and packages Application Observability, RUM, Assistant, Synthetics, k6, and IRM as workflows built above the core signal backends.
  claimRefs:
  - CE025
