  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: module-adoption-and-attach
    missingEvidence: Module-level adoption, paid attach, and retention for Assistant, IRM, Application Observability, Frontend Observability, and enterprise plugins.
    whyItMatters: Chapter 5 can verify the products exist and are priced, but not whether they materially deepen monetization or customer stickiness.
    diligencePath: Request product-family ARR, attach, expansion, and active-customer metrics split by Cloud module and Enterprise plugin bundle.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: security-architecture-depth
    missingEvidence: Detailed public architecture evidence for how Cloud security controls, Federal Cloud boundaries, and module-specific security guarantees are implemented.
    whyItMatters: Packaging-level compliance language is not the same as proof of secure-by-design architecture or module-by-module maturity in regulated deployments.
    diligencePath: Request current security architecture review materials, certification scopes, shared-responsibility matrices, and recent product security postmortems for the cloud control plane.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: ai-workflow-proof
    missingEvidence: Independent customer or benchmark evidence showing how much Grafana Assistant and adaptive telemetry improve MTTR, query productivity, or telemetry waste reduction in production.
    whyItMatters: AI and optimization claims are strategically important roadmap signals, but their underwriting value depends on measurable customer outcomes rather than vendor positioning alone.
    diligencePath: Request customer references, module-level case studies, and before/after operational metrics for AI Assistant and Adaptive Telemetry deployments.
    relatedQuestionRefs:
    - QE025
