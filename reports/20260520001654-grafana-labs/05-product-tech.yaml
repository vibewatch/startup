- id: TE003
  title: Feature maturity table
  columns:
  - Capability
  - Current state
  - Why the maturity call is supportable
  - Commercial relevance
  - Open question
  rows:
  - - Dashboards / Explore / alerting
    - Mature
    - Grafana OSS and Enterprise docs show a long-established control plane for querying, visualizing, exploring, and alerting across many data sources
    - Still the wedge that pulls users into the rest of the stack
    - Public sources do not show paid conversion by dashboard-only users
  - - Logs (Loki)
    - Mature
    - Loki is multi-tenant, horizontally scalable, and positioned as a cost-efficient log backend with Grafana-native workflows
    - Important for LGTM land-and-expand and for Cloud Logs economics
    - Tradeoff versus fully indexed log search remains customer-case dependent
  - - Traces (Tempo)
    - Mature with active innovation
    - Tempo has been GA since 2021 and docs emphasize TraceQL, span-derived metrics, Parquet backend work, and cross-signal links
    - Critical for APM-style expansion and Application Observability packaging
    - Need more public customer evidence on the newest trace-query features
  - - Metrics (Mimir)
    - Mature at enterprise scale
    - Docs and README emphasize long-term Prometheus storage, multi-tenancy, and high-scale operation including very large active-series counts
    - Foundational for Cloud metrics economics and large-enterprise self-hosting
    - Public evidence does not show gross-margin or hardware-efficiency data
  - - Continuous profiling (Pyroscope)
    - Growth-stage but strategically integrated
    - Pyroscope is now folded into Grafana with shared architecture and Cloud packaging, but the acquisition only dates to 2023
    - Adds a differentiated fourth signal and developer workflow depth
    - Public attach-rate and adoption proof remain sparse
  - - Performance and synthetic testing (k6)
    - Mature tool, still expanding into platform bundle
    - k6 is well-established as open-source testing software and now appears throughout Cloud pricing and synthetics workflows
    - Important for shifting reliability left and increasing wallet share
    - Need evidence on how often k6 expands into broader observability spend
  - - Telemetry collection (Alloy)
    - Strategic and fast-moving
    - Alloy now receives future collector investment, ships on a rapid release cadence, and offers migration guides from older agents
    - Key to standardizing onboarding and controlling telemetry cost
    - Migration complexity is non-trivial and can slow upgrades
  - - AI / App Obs / RUM / IRM workflow products
    - Commercially visible but newer
    - Pricing and Cloud pages clearly market these modules now, but public technical depth varies by module
    - These products are the clearest path to higher-value commercial packaging
    - Public documentation is stronger on packaging than on module-level reference deployments
  notes: Maturity ratings distinguish between long-standing core capabilities and newer packaged workflows; they are evidence-based operating judgments, not vendor scorecard badges.
  enumerationScope:
    coverage: partial
    basis: The rows cover the main capability domains that matter for underwriting the Grafana stack; smaller utilities and experimental subfeatures are intentionally rolled up into broader capability buckets.
