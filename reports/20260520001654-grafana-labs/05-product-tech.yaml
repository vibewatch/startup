- id: TE001
  title: Product portfolio and packaging matrix
  columns:
  - Product / layer
  - Primary user job
  - Delivery model
  - Current maturity
  - Differentiator
  - Diligence gap
  rows:
  - - Grafana
    - Query, visualize, alert on, and explore telemetry across sources
    - OSS, Enterprise, Cloud
    - Mature core platform
    - Control plane for heterogeneous data sources rather than one required backend
    - Public sources do not quantify plugin attach or paid conversion by deployment mode
  - - Loki
    - Aggregate and investigate logs with Prometheus-style labels
    - OSS, Enterprise Logs, Cloud Logs
    - Mature core backend
    - Label-based indexing lowers cost and operating burden versus full-text-first designs
    - Need customer evidence on when label-first search is a limitation in complex estates
  - - Tempo
    - Store, search, and correlate distributed traces
    - OSS, Enterprise Traces, Cloud Traces
    - Mature but still newer than Grafana/Loki
    - Object-storage-first tracing and strong linkages to logs and metrics
    - Need clearer public evidence on very large production deployments beyond marketing examples
  - - Mimir
    - Run long-term, multi-tenant Prometheus / OTel metrics at scale
    - OSS, self-managed, managed cloud backing service
    - Mature scale product
    - Prometheus compatibility plus horizontal scale and long retention
    - Public sources do not disclose operational economics or common deployment sizes by customer tier
  - - Pyroscope
    - Continuously profile CPU, memory, and resource usage to line-level detail
    - OSS, self-managed, Cloud Profiles
    - Growth-stage but strategically important
    - Adds fourth signal with shared architecture and Grafana correlation
    - Need public proof of attach rate and production penetration after the 2023 acquisition
  - - k6
    - Shift reliability left through performance, browser, and synthetic testing
    - OSS CLI, CI/CD, Cloud k6, Synthetic Monitoring
    - Mature tool with broader platform role still expanding
    - Developer-first tests-as-code and native fit with broader Grafana telemetry workflows
    - Need public evidence on how much k6 drives cross-sell into Cloud observability
  - - Alloy
    - Collect, process, and export metrics, logs, traces, and profiles from one agent layer
    - OSS collector, Enterprise fleet management, Cloud onboarding path
    - Strategic successor platform
    - OTel Collector distribution with Prometheus pipelines, clustering, and centralized config
    - Migration burden from Agent/Promtail is real and still under active documentation
  - - Grafana Cloud / Enterprise workflow products
    - Turn core signals into packaged workflows like App Obs, RUM, IRM, AI, and governed self-hosted deployment
    - Managed SaaS or self-managed commercial
    - 'Mixed: mature governance, newer workflow modules'
    - Lets Grafana monetize above storage through packaged workflows and enterprise controls
    - Public evidence on module adoption, module-level SLAs, and roadmap delivery remains limited
  notes: Rows mix OSS products and commercial packaging because Grafana monetizes by wrapping core components into managed and governed workflows rather than by hiding the underlying projects.
