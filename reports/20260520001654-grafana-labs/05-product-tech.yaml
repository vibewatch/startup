- id: FE002
  title: Product evolution timeline
  type: timeline
  layout: wide
  summary: Grafana’s product evolution shows a clear path from dashboards into full-stack observability, testing, profiling, collector unification, and AI-assisted workflows.
  data:
    items:
    - date: 2013-12
      label: Grafana OSS origin
      detail: Grafana begins as an open-source dashboarding tool before the broader platform exists.
    - date: 2020-10
      label: Tempo announced
      detail: Grafana starts building its own tracing backend to round out the LGTM stack.
    - date: 2021-06
      label: Tempo GA and k6 acquisition
      detail: Tempo reaches 1.0 and Grafana buys k6 to extend from observability into testing.
    - date: 2023-03
      label: Pyroscope + Phlare merge
      detail: Grafana acquires Pyroscope and folds profiling into the platform under Grafana Pyroscope.
    - date: 2024-04
      label: Agent to Alloy transition
      detail: Grafana deprecates Agent and shifts future collector investment to Alloy.
    - date: '2026'
      label: Workflow packaging expands
      detail: Cloud packaging now foregrounds AI Assistant, Application Observability, Frontend Observability, Database Observability, and IRM.
  approximationNotes: The early dashboarding milestone is company-history context, while later milestones are product-line events directly tied to the current stack.
