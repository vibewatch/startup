chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs is a New York-based observability software company built around the Grafana project that
              Torkel Ödegaard created in December 2013 and commercialized with Raj Dutt and Anthony Wood in 2014.
              Third-party company profiles place headquarters in New York, while Grafana's own careers material
              emphasizes a global, remote-first operating model. The company says it now has 1,600+ employees across 40+
              countries, which is consistent with a distributed engineering and go-to-market footprint rather than a
              single-office infrastructure vendor.


              The company positions itself as an open observability platform whose mission is to help builders turn
              signals into action across their business. That framing matters because Grafana is no longer just a
              dashboard product: the business now spans metrics, logs, traces, profiles, and load testing. Public
              evidence also indicates the company remains private. Even so, the official about material claims 25M+
              users and 7,000+ customers, which makes these identity facts foundational for later chapters on market,
              product, competition, and valuation.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO032
      - number: '1.2'
        title: Founders and leadership
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs' founder-market fit is unusually direct. Torkel Ödegaard did not arrive as a financial
              sponsor or hired executive; he built the original Grafana project himself after becoming frustrated with
              existing tools. Grafana's official founder list still centers the same three people: Raj Dutt, Torkel
              Ödegaard, and Anthony Wood. Raj remains CEO and the main commercial spokesperson, Torkel is listed as CGO
              and still embodies the technical and open-source identity of the company, and Anthony remains listed as
              co-founder.


              That continuity lowers classic founder-displacement risk, but it also concentrates institutional narrative
              around a small group. Craft's current profile adds Tom Wilkie as CTO, showing technical depth beyond the
              founding trio, yet public board-level disclosure remains thin relative to public SaaS peers. For diligence
              purposes, the positive read is stable founder continuity; the follow-up ask is a current board roster,
              committee structure, and any investor observer rights that are not spelled out in public materials.
            claimRefs:
