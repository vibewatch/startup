  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth now covers most of the observability workflow
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs’ product story is no longer “Grafana plus adjacent tools.” The company now markets a layered
              platform where Grafana remains the control plane for querying, visualizing, alerting on, and exploring
              telemetry wherever it is stored, while Loki, Tempo, Mimir, and Pyroscope each provide a purpose-built
              backend for a specific signal type. k6 extends the stack left into pre-production and synthetic
              performance testing, and Alloy has become the preferred collection layer for metrics, logs, traces, and
              profiles. On top of those core components, Grafana Cloud packages application observability, frontend
              observability / RUM, database observability, AI Assistant, synthetics, and incident response management as
              commercial workflow surfaces instead of leaving the buyer to assemble every capability manually.


              That breadth matters strategically because Grafana still follows a “big tent” product logic rather than a
              closed-database logic. The user can keep Prometheus, OpenTelemetry, Jaeger, Zipkin, SQL stores, or cloud
              monitoring tools and still use Grafana as the visualization and investigation surface. In other words, the
              portfolio is designed to be modular in purchase motion but unified in operator experience. That is the
              central product thesis: start from dashboards, add open backends where Grafana has a cost or usability
              edge, and then expand into adjacent workflows like profiling, testing, AI triage, RUM, and IRM as
              operators want more of the lifecycle in one place.
