      - number: '6.5'
        title: Customer sentiment is favorable, but complexity and support remain the main adverse read
        blocks:
          - type: paragraph
            body: >-
              The independent review picture is directionally favorable. G2’s review volume and score support the idea
              that Grafana is widely liked by real operators, and the qualitative themes match the broader product
              thesis: teams value flexibility, visualizations, plugin breadth, and the ability to centralize
              observability across many data sources. That lines up with the company’s strongest competitive positioning
              versus more opinionated suites. Customers that care about cost control, openness, and composability
              generally have enough public reason to prefer Grafana.


              The adverse read is not churn panic; it is operational friction. Reviews and comparison pages consistently
              surface the same risks: setup can be hard, advanced alerting and dashboards take expertise, documentation
              and onboarding are not always sufficient, and support experiences vary more than with premium fully
              managed competitors. That means Grafana’s customer risk is not weak product-market fit. It is the classic
              tradeoff of an open, modular platform: cheaper and more flexible for skilled teams, but more demanding for
              buyers that expect turnkey workflows. For diligence, that translates into two asks. First, split customer
              health by segment because sophisticated cloud-native teams may love what less-resourced buyers find
              cumbersome. Second, test whether Grafana’s AI, guided workflows, and marketplace packaging are actually
              reducing that complexity tax in newer cohorts.
            claimRefs:
