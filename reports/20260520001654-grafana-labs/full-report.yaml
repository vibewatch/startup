      - number: '5.2'
        title: Shared architecture emphasizes open ingestion, specialized stores, and cross-signal correlation
        blocks:
          - type: paragraph
            body: >-
              The technical architecture across Grafana’s product family is more consistent than the brand proliferation
              first suggests. Alloy sits at the edge of collection and routing, exposing OpenTelemetry- and
              Prometheus-friendly pipelines for metrics, logs, traces, and profiles. Those signals are then written into
              specialized backends: Loki for label-indexed logs, Tempo for tracing, Mimir for Prometheus-style metrics,
              and Pyroscope for continuous profiles. Grafana itself is the query and visualization layer on top, with
              data source abstractions, Explore, dashboards, and alerting stitching the stack together. k6 sits partly
              outside the steady-state production data path, but in product terms it closes an important loop by
              generating synthetic or load telemetry that can be analyzed in the same wider observability environment.


              Two architectural patterns repeat across the stack. First, Grafana favors horizontally scalable,
              multi-tenant backends with one-binary or simple-bootstrap starting points and more distributed operating
              modes as scale grows. Second, it pushes cost efficiency by avoiding unnecessary indexing or storage
              duplication: Loki indexes labels rather than log bodies, Tempo relies on object storage rather than
              heavyweight trace indexes, and Pyroscope and Mimir both stress durable long-term storage with shared
              operational primitives. The benefit is a composable platform with a recognizable operator model. The
              tradeoff is that buyers still need to understand several specialized systems and their migration paths,
              especially as Grafana phases older collection tooling into Alloy.
