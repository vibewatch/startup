  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk landscape and severity ranking
        blocks:
          - type: paragraph
            body: >-
              Grafana’s risk profile in 2026 is less about whether observability matters and more about who captures the
              value as the category matures. Public evidence shows a company with real scale — more than $400 million of
              ARR, more than 7,000 customers, more than 35 million users, and a 1,400-plus remote team — but those same
              metrics increase the burden to prove that Grafana can convert open-source distribution into durable
              enterprise economics. The underwriting concern is not category demand collapse; it is margin and
              positioning compression as large suites, hyperscalers, and OTel-native workflows close the gap on core
              observability plumbing.


              The ranking in TR001 and the heat map in FR001 point to three residual top-tier risks. First, competitive
              pressure from Datadog, Dynatrace, Elastic, and hyperscaler-managed offerings can compress win rates and
              pricing at the exact moment Grafana is trying to move further upmarket. Second, technical and operating
              complexity remains non-trivial: Grafana’s own 2026 survey says openness is winning, but complexity is
              still the top pain point, and the company is rearchitecting Loki and Pyroscope to cope with modern log and
              profile workloads. Third, the company remains financially opaque relative to the size investors are being
              asked to underwrite. ARR is visible; burn, margin, cash runway, and channel concentration are not. Those
              gaps make Grafana look investable, but not yet fully de-risked.
            claimRefs:
