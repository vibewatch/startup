      - number: '7.2'
        title: Competitive and market structure risks
        blocks:
          - type: paragraph
            body: >-
              Grafana’s best-known moat — open-source reach plus multi-signal flexibility — is also the part of the
              stack most exposed to commoditization. OpenTelemetry makes telemetry collection and export more portable,
              while AWS, Azure, and Google keep pulling observability deeper into their own control planes. At the same
              time, Datadog and Dynatrace sell broad module sets with enterprise packaging, and Elastic explicitly
              positions itself as OTel-first and strong on high-cardinality economics. Honeycomb competes from the
              opposite direction with modern debugging workflows and budget-control messaging. The market risk is not
              that Grafana lacks product coverage; it is that too many adjacent vendors can now make a credible “good
              enough + easier procurement” pitch.


              This is where Grafana’s March 2026 AWS partnership cuts both ways. It clearly improves distribution,
              credits, and migration support, but it also acknowledges that marketplace access and cloud-aligned GTM
              matter increasingly in observability. If the category consolidates around suite vendors and hyperscalers,
              Grafana’s independent position could become harder to defend without either superior economics or a
              meaningfully better developer workflow. The flow map in FR002 shows how these upstream pressures can
              cascade into slower new-logo adds, softer expansion, tighter gross margins, and a harder private-funding
              story.
