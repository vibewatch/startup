    layout: wide
    summary: >-
      Recent events show Grafana moving upmarket and broadening scope at the same time it adds new legal, compliance,
      and scale burdens.
    approximationNotes: >-
      The timeline includes only public events most relevant to residual risk and mitigation, not every company
      milestone.
    data:
      items:
        - date: 2021-04
          label: Core projects relicensed to AGPLv3
          detail: >-
            Grafana switches Grafana, Loki, and Tempo from Apache 2.0 to AGPL, increasing sustainability but adding
            enterprise-policy friction.
          tone: negative
        - date: 2021-06
          label: k6 acquired
          detail: >-
            Grafana expands from observability into performance testing, increasing product breadth and integration
            scope.
