      - number: '2.2'
        title: Market sizing and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Public market studies support healthy category growth but not a single consensus number. Grand View
              Research sizes observability tools/platforms at $2.71B in 2023 and $5.40B by 2030; MarketsandMarkets puts
              the market at $2.4B in 2023 and $4.1B by 2028; Mordor Intelligence uses a broader 2025 base of $2.9B and
              projects $6.93B by 2031. All three point in the same direction—double-digit growth, cloud-heavy
              deployment, enterprise-led spend, and strong North American adoption—but they define the category
              differently.


              The more important diligence nuance is the gap between these narrow software studies and the broader
              wallet that platform vendors target. Sacra argues Grafana is pursuing a $50B+ observability TAM, and
              public market comps show the category can support substantial enterprise value, with Datadog carrying
              roughly $76.6B of market capitalization in May 2026. That broader lens is useful for strategic upside, but
              it is not apples-to-apples with narrow observability-tools reports. The right Chapter 2 conclusion is that
              Grafana participates in a fast-growing core category with a narrower public market of roughly $4B-$7B by
              2028-2031 and optionality to capture a much larger full-stack telemetry wallet if platform convergence
              continues.
            claimRefs:
