            title: Private-company opacity and patch cadence still matter
            body: >-
              Security does not negate the thesis, but it does raise diligence cost. The recent SCIM-related CVE was
              configuration-specific, excluded OSS, and was patched in managed offerings, yet the advisory index shows
              recurring issues across products. Pair that with limited public board and audited-financial disclosure,
