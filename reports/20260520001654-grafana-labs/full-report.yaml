      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Open standards enlarge Grafana's wedge into the category
            body: >-
              Prometheus and OpenTelemetry adoption means many teams standardize telemetry before they pick a paid
              backend. That lowers entry friction for Grafana relative to closed incumbents and makes cross-sell from
              OSS or self-managed usage into Cloud or Enterprise structurally plausible.
            calloutType: strength
            claimRefs:
              - CM013
              - CM014
              - CM022
              - CM045
          - type: callout
            title: Cost optimization is the category's hardest headwind
            body: >-
              Buyers still want more observability, but they increasingly demand less data waste. Survey and vendor
              evidence align that telemetry cost, unpredictable spend, and tool sprawl drive consolidation pressure,
              which can help platform winners but hurt expansion pricing if Grafana cannot prove efficiency.
            calloutType: risk
            claimRefs:
              - CM024
              - CM025
              - CM037
              - CM038
          - type: callout
            title: Unified observability wins before full tool consolidation
            body: >-
              Public evidence suggests organizations are aligning on shared data and workflows before they fully
              eliminate legacy tools. That favors open, composable platforms like Grafana, but it also means coexistence
              and migration tooling are part of the product requirement, not just the sales pitch.
            calloutType: insight
            claimRefs:
              - CM028
              - CM030
              - CM039
          - type: callout
            title: Key diligence ask is Grafana SAM-by-segment, not generic TAM
            body: >-
              Public studies validate a growing category, yet they do not isolate the monetizable subset for Grafana by
              buyer size, deployment model, and open-standards readiness. Management should provide pipeline by segment,
              average contract values, migration win rates, and attach rates from OSS to Cloud or Enterprise.
            calloutType: recommendation
            claimRefs:
              - CM042
              - CM043
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer set
        blocks:
          - type: paragraph
            body: >-
              Grafana is no longer competing as a dashboard-only vendor. The relevant buyer shortlist now spans four
              overlapping groups: premium commercial suites such as Datadog, Dynatrace, Elastic, and New Relic;
              open-source and open-core building blocks such as Prometheus, OpenTelemetry, VictoriaMetrics, and SigNoz;
              lower-cost or narrower commercial challengers such as Honeycomb, SolarWinds, Sematext, groundcover, Better
              Stack, Sumo Logic, and Sentry; and status-quo substitutes from Azure Monitor, Google Cloud Observability,
              or stitched internal stacks. That breadth matters because many teams still standardize telemetry and
              workflows before they standardize a single commercial vendor.


              The clearest direct commercial overlap is with vendors that already sell logs, metrics, traces,
              dashboards, and adjacent operational automation in one package. Datadog remains the scale leader in the
              retained public comp set, while Dynatrace competes from the enterprise high end and Elastic competes from
              the log-search and open-ingestion angle. New Relic still belongs on the list because it markets a broad
              platform and public self-serve pricing, even if its current public scale disclosures are less
              front-and-center in this source set. The practical implication is that Grafana wins or loses less on
              whether teams need observability at all and more on whether they want an open control plane or a broader
              single-vendor operations bundle.
