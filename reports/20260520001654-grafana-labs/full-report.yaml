      - number: '8.5'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK, not BUY, because the public record supports Grafana's company quality more
              strongly than it supports a premium late-stage entry multiple. A base-case valuation band of roughly $4
              billion-$6 billion is defensible using the disclosed ARR floor, public observability comps, and 2026 SaaS
              valuation ranges. That makes the last hard public mark above $6 billion look fair-to-stretched rather than
              obviously attractive. The stock-like question is therefore not whether Grafana is good. It is whether a
              new investor is getting enough discount for private-company opacity, delayed liquidity, and competitive
              uncertainty.


              What would change the view? The fastest path to a constructive re-rating is evidence that current ARR is
              already above roughly $500 million, with NRR comfortably above 115%, gross margin consistent with premium
              infrastructure software, and no punitive preference stack. Under that fact pattern, Grafana could
              plausibly argue for a 12-15x range that supports the upper half of the base case or even the bull case.
              What would break the view is equally clear: growth drifting into the low-teens cohort, public multiples
              resetting lower again, a weaker-than-expected liquidity path, or evidence that open-source reach is not
              translating into premium enterprise retention.


              The diligence agenda is therefore highly specific. Investors need current ARR and cohort retention,
              deployment-model gross margin, cash and debt detail, a full preference and liquidation schedule, and
              clarity on whether the 2025 secondary implied a flat, up, or down price relative to 2024. Until those data
              are in hand, the right call is disciplined monitoring and valuation gating rather than a generic quality
              endorsement.
            claimRefs:
              - CV054
              - CV055
              - CV056
              - CV057
              - CV058
          - type: table
