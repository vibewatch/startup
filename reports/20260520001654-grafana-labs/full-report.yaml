  - id: TR006
    title: Mitigation strategies and kill criteria
    columns:
      - Risk
      - Existing mitigation
      - Monitorable trigger
      - Kill threshold / event
      - Action implication
    rows:
      - - Competitive suite and hyperscaler pressure
        - Open-source distribution, multicloud positioning, large installed base
        - Win-rate slippage versus Datadog / cloud-native alternatives
        - Sustained loss of strategic enterprise deals or materially weaker expansion in cloud-heavy accounts
        - Reduce conviction on long-term pricing power and category leadership
      - - Telemetry-cost and complexity backlash
        - Adaptive Telemetry, Loki redesign, Pyroscope 2.0 rearchitecture
        - Customer messaging shifts from flexibility to cost pain and complexity fatigue
        - Public or private cohorts show optimization-led churn or stalled usage growth despite strong demand
        - Treat economics as structurally weaker than topline suggests
      - - AGPL and legal adoption friction
        - Free enterprise binary, proprietary licensing path, Apache legacy versions
        - More enterprise objections tied to AGPL or reduced OSS contribution pace
        - Evidence that AGPL materially slows enterprise expansion or catalyzes a meaningful fork ecosystem
        - Re-underwrite the sustainability-versus-distribution tradeoff
      - - Partner dependence
        - AWS credits, marketplaces, FedStart, Azure-managed channel
        - Rising sourced-bookings concentration or weaker direct-customer ownership
        - One hyperscaler or partner becomes mission-critical to growth or renewal economics
        - Haircut channel-driven revenue quality and strategic independence
      - - Compliance / security incident
        - FedRAMP High, IL5, SOC 2, ISO 27001, DPA and audit processes
        - Material breach, failed control renewal, or regulatory disclosure event
        - Loss of major authorization, breach with broad customer impact, or recurring audit exceptions
        - Pause underwriting until remediation and customer impact are clear
      - - Financial opacity and financing path
        - Strong ARR, active investors, secondary market access
        - No improvement in disclosure quality and weaker private financing conditions
        - Inability to raise or tender at acceptable terms before profitability is visible
        - Treat valuation as fragile and insist on wider downside protection
      - - Execution dilution from big-tent strategy
        - Diversified product set and cross-signal workflow ambition
        - Roadmap sprawl, weak attach, or fragmented product narrative
        - Evidence that breadth is hurting product coherence or sales productivity
        - Prefer narrower thesis or require clearer product-line accountability
    notes: >-
      Kill criteria are qualitative thresholds tied to publicly monitorable events; they should be converted into
      numeric board metrics during private diligence.
