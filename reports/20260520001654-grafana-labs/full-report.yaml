  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and last hard mark
        blocks:
          - type: paragraph
            body: >-
              Grafana's valuation history is unusually well-known for a private observability company, but only up to a
              point. The official company record gives three hard milestones: a $240 million Series D in April 2022, a
              roughly $270 million primary-and-secondary extension of that Series D in August 2024 at a valuation above
              $6 billion, and a September 2025 secondary transaction that confirmed operational scale above $400 million
              ARR and 7,000 customers without disclosing price. That means investors have one clear priced late-stage
              anchor, one clear operating update after that anchor, and then a large gap where exact current valuation,
              exact ARR, retention, margin, and cap-table structure are all still private.


              The underwriting implication is important. In August 2024, the disclosed >$6 billion valuation sat against
              >$250 million ARR and >5,000 customers, implying a disclosed multiple of roughly 24x or lower on ARR. Once
              the company disclosed >$400 million ARR in September 2025, that same valuation anchor would have
              compressed to roughly 15x or lower even if the mark had not moved. That is still a premium valuation, but
              it is no longer obviously detached from the best public observability names. The market question is
              therefore not whether Grafana deserves a premium to slower peers; it is whether current evidence is strong
              enough to justify a premium that still sits above broad SaaS medians.


              The adverse wrinkle is opacity after the 2024 round. Forbes reported that Grafana discussed a 2024 inside
              round at a flat $6 billion valuation and that some outside investors viewed that price as rich for the
              market. Meanwhile, secondary-market trackers diverge materially: TechStackIPO still shows a $6 billion
              last-known private valuation while Forge shows a February 2026 Series E mark of $9 billion. Because
              neither secondary tracker is a disclosed priced primary financing, the prudent stance is to anchor on
              official company disclosures and treat the trackers as proof of demand uncertainty rather than proof of
              fair value.
