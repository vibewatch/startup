      - number: '6.2'
        title: Named deployment proof is strongest in cloud migrations and internal platform standardization
        blocks:
          - type: paragraph
            body: >-
              Grafana’s public customer proof is real, but uneven. The strongest proof is not in logo walls; it is in
              detailed customer stories where the customer explains a specific migration or operational outcome.
              Booking.com is the best enterprise cloud example in the public set. Its engineering team describes a
              two-year shift away from multiple observability tools toward a centralized Grafana Cloud stack built
              around OpenTelemetry, observability-as-code, and large-scale Mimir and Loki usage. SpotOn is the best
              mid-market application-platform example: the company explains how it replaced four tools, standardized
              tagging, cleaned up alert routing, and used the resulting visibility to speed troubleshooting and cut
              cloud spend. Microsoft and Salesforce show a different proof style: internal platform use for executive
              dashboards, KPI tracking, incident management, and service-health operations.


              The weaker part of the evidence set is large-logo breadth. Grafana’s success inventory and 2026 press
              materials list customers such as Bloomberg, Microsoft, Salesforce, NVIDIA, Anthropic, TomTom, and others,
              but many of those mentions remain list-level confirmations rather than quantified case studies with
              retention or ROI data. That distinction matters for diligence. The public record is strong enough to prove
              production relevance across enterprise and community contexts, but not strong enough to infer average
              expansion, renewal, or value realization from logo presence alone. Public proof should therefore be
              weighted most heavily toward Booking.com, SpotOn, Microsoft, Salesforce, and Wikimedia-style operational
              usage, while Bloomberg-style mentions are best treated as confirmation of footprint rather than
              confirmation of outcome quality.
