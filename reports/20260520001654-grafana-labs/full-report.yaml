        - Lets buyers keep incumbent stores while standardizing exploration
        - Experience varies by query language and backend capabilities
      - - Tracing protocols
        - Tempo, Jaeger, Zipkin, OpenTelemetry
        - Grafana and Tempo support trace-to-log / trace-to-metric links and open tracing protocols
        - Important for big-tent positioning and migration from older tracing stacks
        - Instrumentation quality still governs actual investigation value
      - - Profiles
        - Pyroscope, Parca, pprof-based applications
        - Grafana adds profile views and can correlate profiles with other signals
        - Extends the platform into resource optimization and performance engineering
        - Profiling remains a newer discipline for many operators
      - - SQL and operational databases
        - MySQL, PostgreSQL, MSSQL, Oracle
        - >-
          Grafana data sources and Enterprise plugins keep operational data queryable without moving everything into one
          store
        - Expands Grafana beyond pure infrastructure telemetry
        - Database integration breadth says little about net-new application value
      - - Business and application systems
        - MongoDB, Salesforce
        - Grafana positions itself as a place to connect business and application data as well as telemetry
        - Supports broader use cases and makes dashboards more business-relevant
        - Public documentation is stronger on connectivity than on packaged analytic workflows
      - - Incident and notification tools
        - Slack, PagerDuty
        - Grafana alerting and IRM can route investigation and incident action into the tools operators already use
        - Converts signal visibility into operational response
        - Public sources do not detail depth of each downstream integration
      - - IT workflow systems
        - ServiceNow
        - Enterprise plugins and workflow integrations let Grafana coexist with established IT process tooling
        - Helpful in large enterprises that need governance and ticketing continuity
        - Public sources do not quantify how often these integrations drive net-new wins
      - - Developer and CI/CD workflows
        - GitHub, CI systems, browser and gRPC test targets
        - >-
          k6 is designed for tests-as-code and automation, while Grafana docs explicitly mention CI/CD-oriented sources
          like GitHub
        - Improves the pre-prod to prod narrative
        - Commercial packaging around CI/CD-native teams remains less transparent than OSS adoption
      - - Plugin and custom extension path
        - Plugin catalog, custom data source plugins, enterprise-supported plugins
        - Grafana lets customers install documented plugins or build custom ones when a source is missing
        - Keeps the ecosystem extensible without waiting for vendor roadmap cycles
        - Custom integrations add maintenance burden and governance complexity
