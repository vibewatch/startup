  - id: TE002
    title: Architecture components table
    columns:
      - Component / layer
      - Role in system
      - Key dependency / protocol
      - Why it matters
      - Primary technical risk
    rows:
      - - Alloy and SDK instrumentation
        - Collect and route metrics, logs, traces, and profiles from apps and infrastructure
        - OTLP, Prometheus pipelines, Loki / Pyroscope components
        - Unifies ingestion and reduces the need for separate collectors
        - Migration from Agent or Promtail can change metrics, configs, and UI assumptions
      - - Grafana query and control plane
        - Provides dashboards, Explore, alerting, and cross-signal navigation
        - Data source APIs, query editors, alert rules, permissions
        - Makes heterogeneous backends usable as one operator experience
        - Control-plane value weakens if buyers choose only the free OSS layer
      - - Loki log backend
        - Stores logs and processes queries with label-centric indexing
        - Label metadata, LogQL, collector forwarding
        - Cost-efficient log retention and metric-to-log pivots are central to LGTM economics
        - Label-only indexing can be less intuitive for teams expecting arbitrary full-text-first search
      - - Tempo trace backend
        - Stores traces, enables trace search, span metrics, and trace-to-log/metric links
        - Jaeger, Zipkin, OpenTelemetry, object storage
        - Lets Grafana keep traces cheap enough for broad sampling and correlation
        - Search and backend behavior depend on disciplined instrumentation and attribute design
      - - Mimir metrics backend
        - Provides long-term, multi-tenant metrics storage and query scale
        - Prometheus / OpenTelemetry metrics, Helm/Jsonnet/YAML configs
        - Anchors the metrics leg of LGTM for enterprises that outgrow plain Prometheus
        - Operational tuning and cost at real scale are not transparent in public sources
      - - Pyroscope profiling backend
        - Aggregates continuous profiles and correlates them with other signals
        - pprof endpoints, SDKs, Alloy, object storage
        - Adds code-level resource analysis without leaving Grafana workflows
        - Profiling value depends on deployment discipline and attach-rate across apps
      - - k6 testing plane
        - Generates pre-production or synthetic load and test telemetry
        - JavaScript APIs, HTTP, WebSockets, gRPC, browser APIs
        - Extends observability from reactive diagnosis into proactive reliability testing
        - Testing-to-observability data loops are clear strategically but under-documented commercially
      - - Alerting and incident workflows
        - Trigger and route operator action after signal analysis
        - Grafana alerting, IRM, Slack, PagerDuty
        - Turns raw telemetry into operational response
        - Public evidence says routing breadth exists, but not the depth or adoption of each workflow
      - - Object storage and deployment substrate
        - Backs long-term durability and helps keep tracing / metrics / profiling cost manageable
        - S3, GCS, Azure Blob or compatible object storage; Kubernetes or VM deployment
        - Shared storage primitives make multi-product operation more coherent
        - Reliance on object storage and distributed infrastructure still leaves buyers with real platform complexity
    notes: >-
      This table describes functional architecture rather than SKU packaging; rows are organized by operator
      responsibilities and shared dependencies, not by list price.
