      - number: '3.3'
        title: Open standards and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              Grafana’s open-source roots are an asset, but they also guarantee ongoing substitute pressure. Prometheus
              remains the default open-source metrics layer for Kubernetes-heavy teams, and OpenTelemetry has made
              vendor-neutral instrumentation the expected baseline rather than a niche preference. That does not mean
              observability is commoditized end-to-end: dashboards, alerting, long-term storage, query performance,
              retained context, and incident workflows still create real switching costs. But it does mean a buyer can
              increasingly keep instrumentation constant while shopping the backend. VictoriaMetrics’ own competitive
              messaging is especially relevant because it explicitly cites replacing Grafana Cloud for lower
              metrics-storage cost.


              Hyperscaler-native substitutes now reinforce that portability. Microsoft pairs Azure Monitor with
              Prometheus metrics and Azure Managed Grafana, while Google offers Managed Service for Prometheus inside
              Cloud Observability. Those moves matter because they reduce the lock-in advantage of closed suites and
              keep “stay inside the cloud account” as a credible default answer for many teams. For Grafana, this is a
              double-edged sword: open standards expand the reachable installed base, but they also make it easier for
              buyers to stop at the open-source or cloud-native layer if Grafana cannot prove enough value above raw
              telemetry collection.
