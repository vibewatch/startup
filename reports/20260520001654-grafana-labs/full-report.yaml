          detail: Marketplace and credit support boost distribution while deepening hyperscaler dependence.
          tone: neutral
        - date: 2026-04
          label: Grafana 13 and Loki redesign launched
          detail: The company responds directly to complexity and scale pressures in logs and OTel workflows.
          tone: neutral
        - date: 2026-05
