  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it is unavailable publicly
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Audited revenue / GAAP statements
        - Private company with no public audited income statement in the reviewed set.
        - Prevents precise revenue-quality and profitability analysis.
        - Request audited or management-certified historical P&L and ARR bridge.
      - - Revenue mix by Cloud / Enterprise / support / adjacent products
        - Company discloses scale and pricing, not stream percentages.
        - Blocks valuation of mix quality and expansion durability.
        - Request revenue mix by product family and deployment model for the last eight quarters.
      - - Gross margin and hosting / service-delivery cost
        - No public gross-margin disclosure.
        - Impossible to distinguish software leverage from services or hosting drag.
        - Provide gross margin by Cloud, self-managed Enterprise, and professional services.
      - - CAC and payback
        - No public sales-efficiency disclosure.
        - Prevents assessment of capital efficiency and go-to-market scalability.
        - Provide CAC by segment, payback, and sales-capacity ramp assumptions.
      - - Retention cohorts / NRR / GRR
        - No public cohort disclosure.
        - Expansion quality and churn resilience are still opaque.
        - Provide logo retention, GRR, NRR, and cohort ARR by signup year.
      - - Cash, debt, and runway
        - No public balance-sheet detail or debt schedule was identified.
        - Capital adequacy cannot be underwritten directly.
        - Provide current cash, debt, monthly burn, and downside runway model.
      - - Customer concentration and top-account exposure
        - Named logos are public, revenue concentration is not.
        - Large account risk could distort the ARR story.
        - Provide top-10 customer concentration and largest renewal calendar.
      - - Verified cumulative capital raised
        - Public totals diverge materially across sources.
        - Dilution and valuation support remain partially inferential.
        - Provide full financing ledger separating primary, secondary, and tender flows.
    notes: >-
      These are not formatting gaps. They are the exact private-company financial disclosures required to move from
