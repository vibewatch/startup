      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Open-core flywheel is the central strategic asset
            body: >-
              Grafana's strongest asset is the linkage between community adoption and monetizable packaging. The same
              brand spans open-source projects, managed cloud, self-managed enterprise software, and partner-led
              distribution through AWS, which is why user and customer scale can compound rather than fragment.
