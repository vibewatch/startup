      - number: '5.3'
        title: Deployment flexibility and ecosystem breadth are core commercial levers
        blocks:
          - type: paragraph
            body: >-
              Grafana sells the same technical story through three operational envelopes. Open source remains the broad
              adoption engine and still exposes core product capabilities for self-managed users. Grafana Enterprise
              turns that base into a governed self-hosted commercial product with enterprise plugins, data source
              permissions, SAML, LDAP sync, RBAC, SCIM, reporting, and support. Grafana Cloud abstracts most of the
              operating burden away and then monetizes not just storage and retention, but higher-level workflows such
              as Application Observability, Frontend Observability, Database Observability, Assistant, Synthetics, k6
              performance testing, and IRM. The result is a ladder that supports self-managed experimentation,
              enterprise-controlled deployment, and managed cloud standardization without forcing a buyer to abandon the
              same OSS roots.


              The ecosystem angle is equally important. Grafana docs and product pages show that the platform is built
              around data source connectivity rather than one canonical storage engine. Built-in or documented sources
              cover Prometheus, Elasticsearch, Loki, Jaeger, Tempo, Zipkin, Pyroscope, MySQL, PostgreSQL, Azure Monitor,
              Google Cloud Monitoring, and AWS CloudWatch. Enterprise plugins extend that list into incumbent
              operational systems such as ServiceNow and Oracle, while Grafana’s broader product positioning explicitly
              references business data tools like Salesforce and MongoDB and operational destinations such as Slack and
              PagerDuty. This means the technical moat is not just the LGTM backends themselves; it is also the breadth
              of entry points through which Grafana can become the control plane for heterogeneous estates.
