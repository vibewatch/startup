      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: TRACK at the last hard disclosed mark
            body: >-
              Grafana looks like a real late-stage observability platform, but the current public evidence set still
              supports only a disciplined valuation range, not a conviction premium. The most investable setup is either
              a lower entry price or a better disclosed financial packet.
            calloutType: recommendation
            claimRefs:
              - CV055
              - CV056
          - type: callout
            title: Private-market price discovery is still incomplete
            body: >-
              Official disclosures clearly show operating scale, but they do not disclose exact current ARR, NRR,
              margin, burn, or the preference stack. Conflicting secondary marks and no public S-1 mean that current
              value should be treated as an underwriting range rather than a known price.
            calloutType: risk
            claimRefs:
              - CV012
              - CV015
              - CV053
