  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Lifecycle from developer discovery to standardized enterprise or regulated deployment and later expansion.
    approximationNotes: >-
      Journey stages are synthesized from pricing, marketplace, enterprise, and customer-story materials; public sources
      do not disclose precise stage conversion rates.
    data:
      nodes:
        - id: discover
          label: Developer or team discovery
          detail: >-
            An engineer or small platform team adopts OSS or the free tier to solve a concrete monitoring, dashboarding,
            or alerting pain.
        - id: standardize
          label: Team standardization
          detail: >-
            Shared dashboards, alerting, and telemetry conventions spread inside the team; Grafana becomes a common
            operator surface.
        - id: managed-cloud
          label: Managed cloud adoption
          detail: >-
            The team shifts into Grafana Cloud when it wants less infrastructure management and more bundled metrics,
            logs, and traces workflows.
        - id: procurement
          label: Enterprise or compliance review
          detail: >-
            Security, retention, plugin, support, or compliance requirements trigger Pro, Enterprise, Federal Cloud, or
            marketplace procurement.
        - id: platform
          label: Org-wide platform use
          detail: >-
            Leadership dashboards, incident workflows, KPI views, and broader telemetry ingestion make Grafana shared
            infrastructure.
        - id: expand
          label: Expansion and renewal
          detail: >-
            Spend rises through more signals, more active users, longer retention, support tiers, and regulated
            deployment needs.
