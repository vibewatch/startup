      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core users are still technical teams: DevOps engineers, SREs, platform engineering teams, application
              owners, and IT operations staff. Grafana's 2025 survey is especially useful here because it shows how
              buying behavior is changing inside those teams. Companies use an average of eight observability
              technologies; companies with more than 5,000 employees average 24 data sources, and SREs average 18. Cost
              is the top selection criterion across roles, but interoperability, open-source grounding, ease of
              switching, and ease of use remain prominent secondary filters.


              The economic buyer is less cleanly disclosed in public sources than the user persona. The survey suggests
              observability has reached CTO/C-level relevance at one-third of organizations and 45% in financial
              services, while vendors like Splunk and IBM market directly to CIO, CTO, DevOps, and engineering teams.
              The practical interpretation is that Grafana sells through a mixed committee: practitioners care about
              interoperability and workflow fit, platform leaders care about standardization and data gravity, and
              executives care about cost predictability, vendor consolidation, and business impact. Public sources do
              not isolate the exact percentage split of budget ownership by role, which remains a diligence gap.


              The adoption path also favors Grafana's open-source heritage. Buyers can start with Prometheus,
              OpenTelemetry, or Grafana OSS and self-managed usage, then graduate into managed cloud, enterprise
              security and governance, longer retention, and AI-assisted operations as scale and compliance needs rise.
              That motion is common in observability because teams often standardize instrumentation first, centralize
              data later, and only then rationalize commercial spend.
