  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs sells into a market that is broader than classic dashboarding and narrower than generic IT
              operations software. The practical buying unit is an observability platform that helps teams collect,
              correlate, store, and act on metrics, logs, traces, and increasingly profiles. Commercial leaders now sell
              adjacent layers such as real-user monitoring, digital experience, topology and security context,
              AI-assisted root-cause analysis, and telemetry pipeline controls. That matters for Grafana because the
              company's product set already spans dashboards, metrics, logs, traces, profiles, and load testing; buyers
              do not evaluate those in isolation.


              At the same time, the status quo remains highly fragmented. Datadog, Dynatrace, Elastic, Splunk, New
              Relic, and IBM all market multi-signal platforms, while Prometheus, OpenTelemetry, Kubernetes, and
              VictoriaMetrics keep the open-source base layer strong. The result is a market where included spend can
              mean anything from a narrow observability-tools software budget to a much broader telemetry, monitoring,
              incident, and AI-operations wallet. For diligence, that boundary logic matters more than any single TAM
              slide: a narrow analyst definition can understate Grafana's opportunity, while a vendor-wallet definition
              can overstate what is actually monetizable in the near term.
            claimRefs:
