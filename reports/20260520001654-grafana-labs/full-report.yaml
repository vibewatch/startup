  - id: FV004
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Recommendation depends on where Grafana lands between broad SaaS medians and Datadog-style premium observability
      economics.
    data:
      nodes:
        - id: N1
          label: Disclosed scale
          detail: '>$400M ARR, >7,000 customers, 35M+ users'
          type: input
        - id: N2
          label: Market reset
          detail: Public SaaS median ~6.4x and BVP cloud ~8.0x in Q1 2026
          type: input
        - id: N3
          label: Premium comp ceiling
          detail: Datadog still trades in the mid-to-high teens because of superior growth and profitability
          type: input
        - id: N4
          label: Opacity discount
          detail: No public S-1, no public NRR, margin, burn, or cap-table terms
          type: risk
        - id: N5
          label: Fair-to-stretched at >$6B
          detail: Last hard disclosed mark already implies a premium multiple versus broad software medians
          type: insight
        - id: N6
          label: TRACK
          detail: Buy only on lower entry price or better financial proof
          type: output
      edges:
        - from: N1
          to: N5
          label: supports premium narrative
        - from: N2
          to: N5
          label: caps acceptable multiple
        - from: N3
          to: N5
          label: defines upside ceiling
        - from: N4
          to: N5
          label: requires discount
        - from: N5
          to: N6
          label: current evidence favors discipline
    approximationNotes: The logic chart is intentionally qualitative; it summarizes the decision chain rather than adding new facts.
    claimRefs:
      - CV026
      - CV045
      - CV052
      - CV054
      - CV056
