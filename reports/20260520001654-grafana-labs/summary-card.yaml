  topStrengths:
    - >-
      Open-source-led distribution plus a modular LGTM stack makes Grafana a credible control plane for heterogeneous
      observability estates.
    - >-
      >$400M ARR, 7,000+ customers, and 25M+ users show real conversion from OSS adoption into late-stage commercial
      scale.
    - >-
      Big-tent architecture and OpenTelemetry / Prometheus friendliness preserve customer flexibility and lower lock-in
      anxiety versus closed suites.
    - >-
      Hybrid packaging across OSS, Grafana Cloud, Enterprise, and Federal Cloud broadens monetization paths from PLG
      teams to regulated enterprise buyers.
    - >-
      Customer proof from Booking.com, SpotOn, Microsoft, and Salesforce supports production relevance beyond logo-wall
      marketing.
  topRisks:
    - >-
      Datadog, Dynatrace, Elastic, and hyperscaler-managed offerings can outbundle Grafana or simplify procurement in
      large accounts.
    - >-
      Private-company opacity around burn, gross margin, NRR/GRR, cash runway, and cap-table preferences limits
      underwriting confidence.
    - Stack breadth and migrations into Alloy and newer AI/RUM/IRM modules can increase complexity and support burden.
    - AGPL licensing and enterprise governance packaging can create procurement friction for some organizations.
    - >-
      The last hard public mark above $6B still looks fair-to-stretched absent proof of $500M+ ARR with strong retention
      and margin quality.
  unresolvedGaps:
    - Current ARR above the September 2025 >$400M floor and revenue mix by Cloud, Enterprise, and add-on workflows.
    - Gross margin by deployment model, cash burn, debt, runway, and path to profitability.
    - NRR/GRR, logo churn, cohort retention, and top-customer concentration.
    - 2025 secondary pricing and the full preference / liquidation stack relative to the 2024 >$6B mark.
    - Share of bookings influenced by AWS/Azure/marketplace channels and any resulting partner concentration.
