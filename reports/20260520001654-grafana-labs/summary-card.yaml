summary:
  headline: >-
    Grafana is a genuine late-stage observability platform leader with open-source-led scale and >$400M ARR, but the
    last hard >$6B valuation still looks fair-to-stretched until private financial quality becomes more transparent.
  overallScore: 6.9
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
