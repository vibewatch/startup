- id: growth-drivers-and-constraints
  title: Growth drivers and constraints
  body: |-
    The strongest growth drivers are structural rather than cyclical. CNCF says cloud-native adoption reached 89% among surveyed organizations, with 93% using, piloting, or evaluating Kubernetes and 80% already running it in production. Kubernetes, CI/CD, GitOps, microservices, and event-driven architectures all multiply the number of services, signals, and failure modes teams have to understand. OpenTelemetry adds another tailwind by making instrumentation portable and vendor-neutral, lowering the switching cost to adopt modern platforms.

    AI is the next expansion vector, but not the only one. Grafana's survey shows nearly half of organizations are investigating unified application/infrastructure observability, SLOs, and LLM observability, while vendors from Splunk to Dynatrace to Elastic are pushing AI-assisted root cause, agentic investigation, and business-context mapping. This supports valuation multiples because the category keeps absorbing adjacent use cases instead of staying confined to dashboards and log search.

    The counterweights are just as real. Observability spend averages 17% of compute infrastructure spend in Grafana's survey, complexity, noise, and cost are top hurdles, and Elastic's 2026 research says 97% of organizations have experienced cost surprises while 96% are taking active cost-control steps. Large enterprises are consolidating toolsets rather than adding more point products, and even OpenTelemetry does not eliminate downstream switching friction once teams are embedded in a vendor's storage, query, workflow, and AI layers. For Grafana, that means growth opportunity is large, but net expansion depends on winning the cost-control argument as much as the feature argument.
