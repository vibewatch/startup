- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cloud migration and hybrid estates
    - Positive
    - Now
    - More services and environments increase telemetry needs and troubleshooting complexity
    - How much of Grafana pipeline comes from multi-cloud or hybrid environments?
  - - Kubernetes, microservices, and event-driven architectures
    - Positive
    - Now to 3 years
    - Distributed systems multiply signals, dependencies, and failure modes that require correlation
    - What share of Grafana workloads already depend on Kubernetes or container observability?
  - - OpenTelemetry and Prometheus standards
    - Positive
    - Now
    - Portable instrumentation lowers adoption friction and expands the addressable installed base
    - How often does Grafana displace closed agents with OTel or Prometheus-first migrations?
  - - Unified observability, SLOs, and AI-assisted operations
    - Positive
    - 1 to 3 years
    - Observability budget expands from debugging into governance, automation, and business context
    - What are attach rates for SLO, AI assistant, and adjacent modules?
  - - Telemetry cost inflation and data-volume growth
    - Negative
    - Now
    - High ingestion, retention, and analysis costs can cap expansion or force optimization-first buying
    - Can Grafana show measurable cost-per-signal advantages versus incumbents?
  - - Vendor consolidation and procurement pressure
    - Negative
    - Now to 2 years
    - Fewer vendors per account means larger RFPs but harder point-solution landings
    - What are Grafana win rates in consolidation-driven deals?
  - - Self-managed inertia and migration friction
    - Negative
    - Ongoing
    - OTel eases collection, but storage, query, workflow, and training migration still create switching friction
    - How long does migration from incumbent APM or log vendors usually take?
  - - Talent and process maturity gaps
    - Negative
    - Ongoing
    - Teams that lack SRE or platform maturity underuse tools and struggle to operationalize SLOs or AI
    - What services, onboarding, or partner motions reduce time-to-value?
  notes: Rows connect structural demand tailwinds to the economic and organizational frictions that determine net expansion and valuation durability.
