callouts:
- calloutType: strength
  title: Open standards enlarge Grafana's wedge into the category
  body: Prometheus and OpenTelemetry adoption means many teams standardize telemetry before they pick a paid backend. That lowers entry friction for Grafana relative to closed incumbents and makes cross-sell from OSS or self-managed usage into Cloud or Enterprise structurally plausible.
  claimRefs:
  - CM013
  - CM014
  - CM022
  - CM045
- calloutType: risk
  title: Cost optimization is the category's hardest headwind
  body: Buyers still want more observability, but they increasingly demand less data waste. Survey and vendor evidence align that telemetry cost, unpredictable spend, and tool sprawl drive consolidation pressure, which can help platform winners but hurt expansion pricing if Grafana cannot prove efficiency.
  claimRefs:
  - CM024
  - CM025
  - CM037
  - CM038
- calloutType: insight
  title: Unified observability wins before full tool consolidation
  body: Public evidence suggests organizations are aligning on shared data and workflows before they fully eliminate legacy tools. That favors open, composable platforms like Grafana, but it also means coexistence and migration tooling are part of the product requirement, not just the sales pitch.
  claimRefs:
  - CM028
  - CM030
  - CM039
- calloutType: recommendation
  title: Key diligence ask is Grafana SAM-by-segment, not generic TAM
  body: Public studies validate a growing category, yet they do not isolate the monetizable subset for Grafana by buyer size, deployment model, and open-standards readiness. Management should provide pipeline by segment, average contract values, migration win rates, and attach rates from OSS to Cloud or Enterprise.
  claimRefs:
  - CM042
  - CM043
