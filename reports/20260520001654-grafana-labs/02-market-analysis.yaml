tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core observability platform
    - Metrics, logs, traces, profiles, dashboards, alerting, storage and retention, OpenTelemetry or Prometheus integration
    - Standalone SIEM, CMDB-only tooling, generic BI analytics
    - Platform engineering, SRE, DevOps; payer is engineering or central platform budget
    - Grafana's core category and the cleanest apples-to-apples peer set
  - - Full-stack / adjacent observability
    - APM, digital experience, topology, incident automation, AI assistance, telemetry pipelines, database and network visibility
    - Generic ITSM seats, unrelated security spend, ERP analytics
    - Engineering leadership, ITOps, CIO or CTO sponsors
    - Expands the wallet captured by Datadog, Dynatrace, Splunk, Elastic, and similar platforms
  - - Open-source instrumentation and data layer
    - OpenTelemetry, Prometheus-compatible metrics, self-managed storage and query, Kubernetes-native collection
    - Closed vendor-only SDKs and agents
    - Engineering teams initially; later centralized platform owners
    - Critical wedge for Grafana because standardization usually precedes commercial expansion
  - - Status-quo substitute stack
    - Multiple point tools, cloud-native built-ins, incumbent APM or logging tools, manual dashboards
    - Unified-platform benefits from single-vendor correlation
    - App owners, SREs, IT operations
    - This fragmented status quo is the real replacement target in many accounts
  - - Excluded or out-of-scope spend
    - Standalone cybersecurity platforms, general data lakes, unrelated developer tooling, broad ITSM suites
    - n/a
    - CFO or CIO may still fund these budgets, but not as core observability spend
    - Useful to avoid overstating Grafana's near-term monetizable SAM
  notes: Rows distinguish Grafana's core observability budget from adjacent full-stack wallet layers and explicit out-of-scope spend categories.
