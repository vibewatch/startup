- id: TI004
  title: Capital adequacy and burn-runway table
  columns:
  - Capital item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Series D (Apr 2022)
    - $240M
    - Medium
    - Anchor financing round for the current capital structure.
    - Confirm primary proceeds, liquidation stack, and any preferred terms still in force.
  - - Series D extension (Aug 2024)
    - ~$270M in primary and secondary proceeds at >$6B valuation
    - Medium
    - Shows access to sizable capital and liquidity without IPO execution.
    - Separate primary cash to company from secondary liquidity to sellers.
  - - 2025 tender / secondary liquidity
    - Official 2025 secondary plus Forbes-reported tender offer up to $150M
    - Low
    - Important because liquidity for holders is not the same as balance-sheet cash for operations.
    - Provide exact tender size, seller mix, and whether any proceeds reached the company.
  - - Cash on hand
    - Not publicly disclosed
    - Low
    - Core input for runway and financing dependency.
    - Provide quarter-end cash, restricted cash, and short-term investments.
  - - Monthly burn
    - Not publicly disclosed
    - Low
    - Needed to size capital intensity and downside protection.
    - Provide monthly burn for the last 12 months and plan-versus-actual burn.
  - - Runway
    - Not calculable from public data
    - Low
    - Investors cannot tell whether Grafana is self-funding or financing growth.
    - Provide base / downside runway cases and burn-reduction levers.
  - - Debt / covenants
    - No public debt quantum, rate, or covenant package identified
    - Low
    - Debt could materially change equity value and risk.
    - Provide debt schedule, interest cost, covenants, and any security interests.
  - - Capital need outlook
    - 2026 private-funding rumor plus disclosed investment in AI, M&A, and Japan expansion suggest capital appetite remains active
    - Low
    - Future financing may support growth rather than rescue liquidity, but public data is insufficient to prove that.
    - Provide board-approved operating plan, hiring plan, and next-round trigger assumptions.
  notes: 'The table is explicit about where public data stops: capital access is visible, but burn and runway are not.'
