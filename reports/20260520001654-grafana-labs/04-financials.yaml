- id: TI002
  title: Pricing and monetization table
  columns:
  - Offer / motion
  - Public pricing signal
  - What public evidence does not show
  - Current read
  - Source or diligence ask
  rows:
  - - Grafana Cloud Free
    - $0; 10k active series; 50 GB logs/traces/profiles; 3 users; 14-day retention.
    - No public conversion rate from free to paid.
    - Useful funnel entry point rather than revenue contributor.
    - Request free-to-paid conversion, activation, and PQL-to-paid conversion metrics.
  - - Grafana Cloud Pro
    - $19/month platform fee plus usage; metrics at $6.50 per 1k series; logs/traces/profiles billed on process, write, and retain.
    - No public realized ASP, discount ladder, or overage mix.
    - Usage-based model can scale well but complicates forecasting.
    - Provide realized price waterfalls and overage incidence by customer segment.
  - - Grafana Cloud Enterprise / Advanced
    - $25,000 annual spend commit; custom retention; premium support; BYOC/Federal Cloud; enterprise metrics pricing can be as low as $3 per 1k series.
    - No public disclosure of average commit size or overage mix.
    - Likely the core path to large-account monetization.
    - Show commit tiers, average overage rate, and expansion patterns above commit.
  - - Grafana Enterprise self-managed
    - Negotiated annual subscription; advanced auth, RBAC, plugins, support, and reporting.
    - No public per-user, per-cluster, or per-instance contract mix.
    - Commercial value is obvious; pricing mechanics remain bespoke.
    - Disclose pricing framework by deployment architecture and user count.
  - - Independent contract benchmarks
    - SpendHound says average SMB spend is ~$72k/year and average enterprise spend is ~$376k/year; Vendr and CostBench say 10–35% discounts and $25k–$150k+ annual deals are common.
    - These datasets are not audited company disclosures.
    - Useful reality check on enterprise ACV and negotiation leverage, but not primary truth.
    - Share the top 20 signed contracts by ACV, discount, and retention profile.
  - - Seat / user pricing proxies
    - Independent summaries disagree on active-user pricing, with proxies around $8 to $15 per active user per month.
    - Official pricing surfaces do not make the effective seat charge fully clear in one place.
    - List-price complexity itself is a diligence point.
    - Provide the current active-user rate card and the percentage of ARR exposed to user-based billing.
  notes: This table separates official list pricing from independent contract benchmarks; public list pricing is not realized net revenue.
