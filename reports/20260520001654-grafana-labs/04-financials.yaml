- id: TI001
  title: Revenue streams and quality table
  columns:
  - Stream
  - Evidence-backed mechanism
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Grafana Cloud core telemetry
    - Managed metrics, logs, traces, profiles, synthetic monitoring, and related cloud observability usage meters.
    - Company-wide ARR exceeded $400M by Sep 2025, but Cloud share is undisclosed.
    - High recurring quality if retention is strong; usage variability can also raise forecasting noise.
    - Break out Cloud ARR, gross margin, and revenue by signal type.
  - - Grafana Enterprise self-managed software
    - Annual commercial edition for advanced auth, governance, plugins, reporting, and support.
    - Starts at $25,000 annual spend commit; realized contract sizes are negotiated.
    - Likely high-value enterprise revenue, but revenue mix versus Cloud is not public.
    - Provide Enterprise ARR, renewal rates, and split between self-managed and Cloud Enterprise.
  - - Premium support and customer success
    - 8x5 support in Pro and premium support / customer-success layers in enterprise offerings.
    - Commercially visible in packaging, but not disclosed as a separate revenue line.
    - Potentially recurring but more service-linked than core software revenue.
    - Show support attach rate, support revenue, and support gross margin.
  - - Enterprise plugins, security, and governance features
    - Paid access to SAML/LDAP enhancements, RBAC, enterprise data source plugins, reporting, and related controls.
    - Visible in product packaging; no public contribution disclosed.
    - Can deepen lock-in and enterprise ACV, but monetization share is unknown.
    - Quantify plugin/security attach rate and upsell contribution by cohort.
  - - Adjacent products and add-ons
    - k6, IRM/OnCall, synthetic monitoring, AI assistant workflows, and other usage-driven modules expand wallet share.
    - Cross-sell surface is visible; product-level revenue is not.
    - Helpful for expansion revenue if attach is real, but still opaque externally.
    - Provide product-family ARR bridge and attach rates for adjacent modules.
  notes: Rows isolate supportable revenue mechanisms from public pricing and product materials; no public source discloses current stream percentages or GAAP revenue-recognition mix.
