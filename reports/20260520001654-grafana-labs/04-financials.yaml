  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Company-specific gross margin, CAC, payback, logo retention, gross retention, and net revenue retention by Cloud versus Enterprise.
    whyItMatters: These metrics determine whether Grafana is scaling like a high-quality infrastructure SaaS business or simply buying growth with private capital.
    diligencePath: Request the last eight quarters of KPI reporting used by management and the board, including cohort retention and sales-efficiency metrics.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI024
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Quarter-end cash, debt schedule, monthly burn, covenant package, and base / downside runway model.
    whyItMatters: Without balance-sheet data, investors cannot judge capital adequacy, downside resilience, or the need for another primary raise.
    diligencePath: Request current balance sheet support, debt agreements, treasury schedule, and the operating model used for board liquidity reviews.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: cumulative-capital-raised
    missingEvidence: A financing ledger that reconciles every primary round, secondary transaction, tender, and any undisclosed early financing.
    whyItMatters: Conflicting public totals distort dilution analysis, cap-table history, and the interpretation of current valuation support.
    diligencePath: Request the full financing chronology from finance or legal, including dates, securities, primary proceeds, and secondary proceeds.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Actual contract waterfalls, overage incidence, user-billing exposure, retention extensions, and discount bands by segment.
    whyItMatters: Public list pricing is transparent, but pricing realization determines revenue quality, upsell durability, and customer satisfaction risk.
    diligencePath: Request anonymized top-20 customer contracts and a pricing-operations memo covering standard discounts, renewal policy, and exception handling.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI021
    - QI022
    relatedTableRefs:
    - TI002
