- id: benchmarked-verdict-and-blockers
  title: Benchmarked verdict and diligence blockers
  body: |-
    Public observability comps make Grafana’s opportunity obvious and its disclosure gap impossible to ignore. Datadog generated $1.006 billion of Q1 2026 revenue with 32% year-over-year growth, 22% non-GAAP operating margin, and $289 million of free cash flow. Dynatrace exited fiscal 2026 with $2.054 billion of ARR, $2.018 billion of revenue, 29% non-GAAP operating margin, and $529 million of free cash flow. Elastic’s Q3 fiscal 2026 results showed $450 million of revenue, 18.6% non-GAAP operating margin, about 112% net expansion, and $54 million of adjusted free cash flow. Against that backdrop, Grafana’s more-than-$400 million ARR is already material, but still clearly subscale to the largest public leaders.

    That comparison cuts both ways. The bullish interpretation is that Grafana has already built enough scale, pricing credibility, and capital access to be a real late-stage asset in observability. The cautious interpretation is that investors still cannot tell whether the company is headed toward Datadog-style profitable scale, Dynatrace-style balanced growth, or a longer Elastic-like march toward operating leverage. Public evidence does not disclose gross margin, free cash flow, net retention, customer concentration, or CAC/payback. Even cumulative capital raised is not cleanly reconciled: a Crunchbase News item using Crunchbase data said Grafana had raised more than $805 million, while the commonly repeated public shorthand is much lower and not supported by a single primary ledger.

    Chapter 4’s verdict is therefore favorable on demand, credibility, and monetization potential, but blocked on underwriteability. Revenue quality appears stronger than disclosure quality. Capital access appears solid. Margin path and cash-burn discipline remain opaque. The minimum diligence package is clear: audited or management-certified revenue mix, gross margin by deployment model, cohort retention, CAC/payback, cash and debt schedule, and a financing ledger that reconciles primary versus secondary proceeds. Without that package, Grafana can be judged as a strong business, but not fully priced with conviction.
