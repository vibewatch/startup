- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - PsiQuantum
    - Private valuation / no-NISQ utility-scale strategy
    - ~$7B valuation cited by TechCrunch
    - Closest strategic analogy for bypassing NISQ and pursuing utility-scale hardware
    - Photonic modality and much larger capitalization differ from Oratomic
  - - Quantinuum
    - Private valuation / IPO watch
    - ~$10B pre-money private valuation per Crunchbase; other 2026 IPO guides reference higher IPO ambitions
    - Premium benchmark for high-credibility quantum hardware/software stack
    - Trapped-ion full-stack platform with Honeywell ownership and deeper proof base
  - - IonQ
    - Public market cap and revenue
    - ~$9B market cap per Lambda; $130M FY2025 revenue per company release
    - Shows public quantum premium and revenue proof threshold
    - Ion-trap public company with revenue, acquisitions, and different disclosure profile
  - - Rigetti Computing
    - Public market cap / SEC filing
    - ~$2.5B market cap per Lambda; SEC 10-K risk factors
    - Lower public hardware comp for pure-play quantum risk
    - Superconducting platform and public-market volatility limit read-through
  - - D-Wave Quantum
    - Public market cap / SEC filing
    - ~$1.4B market cap per Lambda; SEC 10-K risk factors
    - Public quantum liquidity and commercialization-risk evidence
    - Annealing plus gate-model strategy differs from fault-tolerant neutral atoms
  - - Infleqtion
    - Neutral-atom public-market milestone
    - 2026 public listing; run brief cites ~$1.8B SPAC valuation and source confirms at least $550M gross proceeds
    - Most relevant modality/status comp for neutral atoms
    - SPAC terms and public trading performance require separate confirmation
  notes: Comparable set is sample coverage of valuation-relevant quantum hardware comps; some private valuations are reported
    by media/analyst sources and require primary-document confirmation.
