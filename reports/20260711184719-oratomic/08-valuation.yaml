  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation evidence
    missingEvidence: Primary term sheet or company/investor confirmation of the approximately $1.5 billion post-money valuation.
    whyItMatters: The recommendation is price-sensitive, and public articles reviewed corroborate the round amount more strongly
      than the valuation.
    diligencePath: Request financing documents from Oratomic and lead investors; reconcile with cap table and option pool.
  - type: private-evidence-only
    severity: material
    topic: technical roadmap
    missingEvidence: Independent expert review of error-correction thresholds, atom movement loss, packaging, controls, and
      roadmap budget.
    whyItMatters: The current thesis rests on translating architecture and lab milestones into a full utility-scale machine.
    diligencePath: Commission a quantum hardware diligence panel with access to non-public roadmap and experimental data.
  - type: missing-source
    severity: material
    topic: customer proof
    missingEvidence: Paid customer, government milestone, or strategic partner budget evidence specific to Oratomic.
    whyItMatters: Skipping NISQ means the company may have no revenue proof before a large follow-on financing.
    diligencePath: Interview target agencies, strategic partners, and potential early adopters under NDA.
  - type: missing-source
    severity: material
    topic: financial model
    missingEvidence: Burn rate, hiring plan, fabrication budget, runway, and follow-on capital plan.
    whyItMatters: Capital intensity and runway determine dilution risk and whether $300 million is enough to reach a value-creating
      milestone.
    diligencePath: Review board-approved operating plan, monthly cash budget, and milestone financing plan.
  - type: conflicting-data
    severity: minor
    topic: comparable valuations
    missingEvidence: Primary documents for private valuation marks and SPAC transaction values, especially Quantinuum and
      Infleqtion.
    whyItMatters: Comparable valuation rows are useful directional anchors but weak if based only on secondary summaries.
    diligencePath: Fetch registration statements, merger proxy materials, and investor presentations for each transaction.
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table
    missingEvidence: A fully exhaustive global list of quantum hardware private rounds, public market caps, and M&A values
      as of 2026-07-11.
    whyItMatters: The comparable table is a representative set, not a complete valuation database.
    diligencePath: Use PitchBook/CapIQ/Crunchbase exports to refresh the full comp set before IC.
    relatedTableRefs:
    - TV004
