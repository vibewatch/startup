- id: scenario-underwriting
  title: Bull, base, and bear underwriting
  body: The appropriate framework is not a SaaS revenue multiple; it is a milestone-weighted option valuation. In the bull
    case, Oratomic validates the 10,000-to-20,000-qubit architecture, secures a first strategic or government-funded milestone,
    and keeps the market window open long enough for a strategic sale, IPO, or large crossover round. In the base case, it
    earns a flat-to-modest markup only if the Series A funds credible hardware proof without revealing a fatal scale bottleneck.
    In the bear case, error-correction thresholds, atom loss, controls, packaging, or capital-market compression force a down-round.
    The asymmetric payoff is attractive only if investors can negotiate entry and governance that preserve a path to more
    than 3x net return after dilution; otherwise the same evidence supports watching from the sidelines.
