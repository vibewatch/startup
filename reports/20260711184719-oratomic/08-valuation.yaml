  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence base
  - Decision implication
  rows:
  - - Recommendation
    - Research-more / track
    - Large market and credible team, but pre-revenue and unproven scale
    - Do not buy at reported price without milestone-gated structure
  - - Confidence
    - Medium-low
    - Strong source coverage for round and market; weak Oratomic-specific financial disclosure
    - Require confirmatory technical, customer, and cap-table diligence
  - - Risk rating
    - High
    - Technical scale, capital intensity, and multiple compression remain unresolved
    - Size as optionality, not core growth equity
  - - Valuation stance
    - Expensive / stretched
    - ~$1.5B assumed post-money on no revenue; comps support quantum premium only with proof
    - Seek lower entry, structured milestones, or observe
  - - Return posture
    - Target >3x before dilution
    - A $1.5B entry needs >$4.5B exit before future dilution
    - Hold only if path to credible $5B+ exit emerges
  notes: Assessment combines public funding coverage, market/comparable data, and an explicit task-provided valuation assumption;
    no audited Oratomic financials were available.
