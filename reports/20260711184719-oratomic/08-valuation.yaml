- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Scale proof failure
    - No independent error-corrected scale evidence within 18-24 months
    - Weakens core 10K-20K qubit thesis
    - Avoid new money or mark down
  - - Financing break
    - Next round below reported $1.5B post-money or with punitive preferences
    - Signals current entry overpaid and future dilution is unfavorable
    - Do not lead; negotiate reset only
  - - Customer proof gap
    - No paid government or strategic milestone despite no-NISQ strategy
    - Extends zero-revenue period and increases financing dependency
    - Track only until contract evidence appears
  - - Key-person loss
    - CEO/CTO/founding scientific lead departure or IP dispute
    - Directly impairs technical execution and fundraising credibility
    - Pause or exit if governance cannot replace
  - - Competitive displacement
    - Rival modality demonstrates utility-scale path first with better economics
    - Reduces exit probability and strategic scarcity
    - Reprice or redeploy capital
  - - Market multiple compression
    - Public quantum basket sells off 50%+ without Oratomic-specific proof offset
    - Compresses exit comparables and late-stage appetite
    - Require lower entry and stronger downside terms
  notes: Triggers are designed as monitorable investment-governance thresholds rather than generic risks.
