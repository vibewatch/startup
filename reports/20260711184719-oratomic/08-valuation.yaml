- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Valuation terms
    - Executed term sheet, post-money confirmation, option pool, preference stack
    - Determines whether $1.5B entry can produce fund-level returns
    - 'Lead investor / counsel: request financing docs and cap table'
  - - Technical roadmap
    - Independent review of error-correction thresholds and hardware scale budget
    - Converts architecture claim into milestone probability
    - 'Quantum expert panel: review papers, lab data, and roadmap'
  - - Customer demand
    - Paid LOIs, government milestones, or strategic partner budget owners
    - Offsets no-NISQ revenue gap and validates use case urgency
    - 'Commercial diligence: interview agencies and strategic partners'
  - - Runway and burn
    - Monthly burn, fabrication budget, hiring plan, and milestone runway
    - Hardware capital intensity determines future dilution risk
    - 'CFO diligence: inspect budget and board-approved operating plan'
  - - Competitive benchmark
    - Side-by-side roadmap against PsiQuantum, Quantinuum, IonQ, Infleqtion, QuEra, Atom Computing
    - Tests scarcity and likely exit buyer appetite
    - 'Technical/market diligence: comp roadmap matrix'
  - - Governance and talent
    - Founder retention, IP assignment, Caltech licenses, and key-person contingency
    - Protects against founder/lab dependency
    - 'Legal and HR diligence: verify assignments and retention'
  notes: These asks are the minimum evidence package needed to move from research-more to a priced recommendation.
