    - Flat to 2x mark from $1.5B if proof improves without punitive dilution
    - Runway and customer evidence remain thin
    - Validated roadmap and insider follow-on support
  - - Bear
    - Scale proof slips; quantum multiples compress; next financing below current mark
    - <$1.5B down-round or option-value impairment
    - Technical threshold failure, key-person loss, structured preferences
    - No independent scale evidence within 18-24 months
