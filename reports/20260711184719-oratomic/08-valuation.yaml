- id: financing-context-and-entry-discipline
  title: Financing context, dilution, and entry discipline
  body: 'The $300 million Series A is well corroborated, including lead investors and broad syndicate participation. The approximately
    $1.5 billion post-money valuation, however, should be treated as a diligence input rather than a public-source-verified
    fact because the reviewed financing articles did not independently print the post-money price. If that price is accurate,
    it implies roughly $1.2 billion pre-money and about 20% new-money dilution before any option-pool increase, liquidation
    preference, pro-rata expansion, or follow-on structure. That matters because the security stack can consume much of the
    upside for a new minority investor if future rounds are required before revenue. Entry discipline should therefore tie
    price and structure to milestones: verified error-correction progress, an independently reviewed scale budget, customer
    or government demand signals, and insider willingness to finance the next hardware step without punitive preferences.'
