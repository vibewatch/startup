- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis evidence
  - Anti-thesis or risk
  - What would change the view
  rows:
  - - Market scale
    - 2030-2040 forecasts support a large quantum prize
    - Forecast dispersion is wide and timing uncertain
    - More customer budget evidence or procurement awards
  - - Technical differentiation
    - 10K-20K qubit architecture and neutral-atom flexibility
    - Architecture is not yet a full-scale machine
    - Independent replication of error-corrected scale path
  - - Founder/investor quality
    - Caltech origins and top-tier Series A syndicate
    - Key-person and lab-to-company execution risk
    - Hiring plan, retention, and milestone governance
  - - Commercial model
    - Skipping NISQ may avoid distraction
    - No near-term revenue or customer proof
    - Paid government or strategic milestone contract
  - - Competitive position
    - Below PsiQuantum and Quantinuum headline values
    - Better-funded or public rivals have more capital and visibility
    - Evidence Oratomic beats modality-specific scaling bottlenecks
  - - Valuation
    - Quantum market premium exists across public/private comps
    - Reported entry is rich versus current fundamentals
    - Lower entry price or stronger protective terms
