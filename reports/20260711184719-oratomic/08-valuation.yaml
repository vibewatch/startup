- id: final-diligence-and-thesis-breaks
  title: Final diligence asks and thesis-break triggers
  body: 'Before a priced commitment, the diligence path should focus on evidence that changes probability rather than narrative
    polish. Technical diligence must test whether the architecture can preserve error-correction thresholds when scaled and
    whether the 6,100-qubit array milestone maps to Oratomic’s own roadmap. Commercial diligence should verify whether government
    letters of intent, strategic partners, or cloud-channel discussions can convert into paid milestones despite the no-NISQ
    strategy. Financing diligence should obtain the capitalization table, preference stack, option-pool plan, runway model,
    and insider follow-on intentions. Thesis-break triggers are explicit: failure to show independent scale progress within
    18 to 24 months, a structured or down-round financing below the reported price, key-person loss, or evidence that a better-capitalized
    modality wins the utility-scale race first.'
