schemaVersion: report-v2
artifact: customers
slug: oratomic
runDate: '2026-07-11'
company:
  name: Oratomic
chapter:
  number: 6
  title: Customers
  summary: 'Oratomic has no public customers, revenue, product availability, retention metrics, or NISQ access offer today.
    The customer case is therefore a target-segment and adjacent-demand analysis: government programs, national-lab access,
    and competitor case studies show category pull, but none should be counted as Oratomic customer proof.'
sections:
- id: customer-base-null-and-target-segmentation
  title: Customer base is null; segmentation is a target-market exercise
  body: Oratomic should be underwritten as a pre-customer company. The public record reviewed for this chapter includes the
    company launch, July 2026 financing coverage, Caltech/IQIM technical context, and independent reporting, and none of those
    sources identifies a paying customer, design partner, pilot deployment, price card, access program, ARR, or revenue. That
    absence matters because the company is intentionally bypassing the NISQ prototype market that competitors use to seed
    research and enterprise users. The useful customer lens is therefore not a current installed base; it is a target segmentation
    map for future buyers that might value fault-tolerant neutral-atom computing. The most plausible buyers are government
    and defense programs, national labs, pharma and chemistry R&D organizations, finance quant teams, logistics and industrial
    optimization groups, and AI/scientific-computing users. Buyers, users, and payers will often differ, creating procurement
    complexity before Oratomic can convert technical milestones into commercial accounts.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-government-demand
  title: Adoption trajectory depends on category demand, not Oratomic traction
  body: 'There is credible category demand, but it should not be mistaken for Oratomic adoption. Government demand is visible
    through the Department of Commerce quantum letters of intent, DARPA benchmarking, DOE-DARPA coordination, the National
    Quantum Initiative surface, and the 2026 White House quantum executive order. National-lab access programs also show how
    scientists can become early users through facility-mediated channels before direct procurement. These signals strengthen
    the market case for a future Oratomic product, but the current company-specific trajectory remains pre-commercial: no
    customer count, no active usage, no production deployment, and no disclosed utilization. The adverse view is equally important.
    BCG says quantum computing today provides no tangible advantage over classical computing in either commercial or scientific
    applications, and its timeline places broad quantum advantage after 2030. That creates a commercialization gap between
    Oratomic''s large financing and customer evidence.'
  claimRefs:
  - CU005
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
