- id: named-proof-is-adjacent-not-oratomic
  title: Named customer proof is abundant only in adjacent markets
  body: 'The named proof table deliberately uses adjacent industry evidence because Oratomic has no announced customers. It
    includes government programs, national-lab access, and competitor case studies from Pasqal, IonQ, and QuEra. Those sources
    show that real institutions are experimenting with quantum workflows in energy, chemistry, automotive, aerospace, finance,
    telecom, national labs, and defense-adjacent settings. The evidence quality varies: some rows are public-sector incentives
    or benchmarking programs, some are exploratory pilots, and some are closer to production-like or commercial-access claims.
    None proves Oratomic product-market fit. The diligence implication is to use these examples as a map of buyer pain and
    reference-call targets, not as customer validation for Oratomic. Management should be asked whether any of these verticals
    have signed letters of intent, paid engineering work, cloud access commitments, or budgeted procurement pathways for Oratomic
    specifically.'
