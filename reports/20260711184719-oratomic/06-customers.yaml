- id: retention-durability-and-switching-dynamics
  title: Retention and durability are unmeasured; switching costs are only a hypothesis
  body: Retention analysis is almost entirely a gap. There is no public Oratomic NRR, GRR, churn, renewal term, cohort retention,
    satisfaction, reference-call, or repeat-purchase evidence. Adjacent stories suggest that durable relationships could emerge
    when a buyer invests in custom algorithms, training, user agreements, publications, and HPC integration; examples include
    Hyundai expanding IonQ work and EDF maintaining a long-running quantum effort with Pasqal. But those are proxies. They
    do not establish Oratomic durability, and they may overstate retention because many quantum collaborations are innovation
    programs rather than production contracts. The cohort figure therefore uses illustrative analogs only. Investment diligence
    should treat all retention cells as null until Oratomic provides private evidence such as signed design-partner agreements,
    repeat scope expansions, paid milestones, renewal rights, named technical champions, and reference calls.
  claimRefs:
  - CU024
  - CU028
  - CU033
  - CU034
  - CU035
  - CU043
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-procurement-friction
  title: Expansion path is plausible but exposed to concentration and procurement friction
  body: 'If Oratomic reaches convincing utility-scale milestones, expansion could follow a land-and-expand path: government
    or lab validation, vertical proof in pharma/chemistry/finance/logistics, cloud or HPC access, and then dedicated systems
    or recurring access contracts. The risk is concentration. Public orders and strategic programs appear to anchor much of
    early quantum demand, and a first wave of customers could be a small set of agencies, labs, hyperscalers, or regulated
    enterprises. Procurement friction is also high because buyers will likely require security review, export-control sensitivity
    assessment, benchmarking, proof against classical alternatives, user agreements, and multi-year budgets. The lack of a
    NISQ sales wedge increases the stakes: Oratomic may have superior long-term architecture, but it has fewer near-term customer
    learning loops than competitors selling prototypes or cloud access today.'
  claimRefs:
  - CU036
