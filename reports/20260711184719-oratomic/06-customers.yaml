    - Awareness helps narrative but may not convert into Oratomic revenue
    - Separate threat-model interest from signed compute contracts
  - - Fault-tolerance-only product strategy
    - No NISQ sales wedge; first revenue may arrive years after funding
    - Raises customer proof and concentration risk until utility-scale milestones
