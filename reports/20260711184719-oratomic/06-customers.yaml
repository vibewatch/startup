  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Oratomic customer status
    missingEvidence: Customer list, design-partner LOIs, paid pilots, customer references, and any revenue-supporting contracts
      for Oratomic specifically.
    whyItMatters: Without this evidence, all named proof remains adjacent and cannot validate Oratomic product-market fit.
    diligencePath: Request management-provided customer pipeline, signed agreements, and reference calls with named buyer,
      user, and payer contacts.
    relatedQuestionRefs:
    - QU001
    - QU009
    - QU026
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Retention gap
    missingEvidence: NRR, GRR, churn, renewal terms, cohort retention, satisfaction scores, and repeat-scope expansion evidence.
    whyItMatters: Durability and future expansion are core to valuation but cannot be measured before customer launch.
    diligencePath: Ask for cohort tables once any pilots or design partners exist; require definitions for revenue retention
      and logo retention.
    relatedQuestionRefs:
    - QU011
    - QU013
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table
    missingEvidence: A complete universe of Oratomic private discussions, undisclosed government contacts, and competitor
      deployments is unavailable from public sources.
    whyItMatters: The public enumeration may miss stealth design partners or overrepresent competitors with better marketing
      pages.
    diligencePath: Reconcile the public table against management CRM exports, data-room customer materials, and procurement
      correspondence.
    relatedQuestionRefs:
    - QU009
    - QU018
    - QU019
    - QU020
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Procurement friction
    missingEvidence: Procurement pathway, security requirements, export-control posture, and customer onboarding plan for
      Oratomic systems or access.
    whyItMatters: Government and regulated-enterprise buyers could delay revenue even if the technology works.
    diligencePath: Request GTM plan, target account list, contracting model, compliance roadmap, and agency/hyperscaler partnership
      status.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU025
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: Quantum adoption timing
    missingEvidence: Independent benchmark evidence that Oratomic can outperform classical systems on buyer-relevant workloads
      before the end of the decade.
    whyItMatters: Adjacent demand is strong, but BCG warns quantum has no tangible current advantage over classical computing.
    diligencePath: Require benchmark roadmap, third-party validation milestones, and side-by-side comparisons with classical
      and AI methods.
    relatedQuestionRefs:
    - QU006
    - QU024
