figures:
- id: FU001
  title: Customer journey map — target adoption surfaces
  type: journey-map
  layout: wide
  summary: Oratomic customer adoption is a future journey from strategic validation to vertical proofs and eventual utility-scale
    deployment.
  data:
    items:
    - label: Strategic awareness
      detail: Government, labs, and regulated enterprises monitor fault-tolerant quantum progress and PQC timelines.
      touchpoints:
      - NIST PQC
      - White House quantum policy
      - Oratomic launch research
    - label: Technical validation
      detail: Expert buyers evaluate whether architecture and benchmarks can reach utility-scale advantage.
      touchpoints:
      - DARPA benchmarking
      - Caltech/IQIM research
      - Architecture due diligence
    - label: Access / co-development
      detail: Early users would likely engage through labs, HPC centers, cloud channels, or private design-partner work.
      touchpoints:
      - OLCF QCUP analog
      - Pawsey-QuEra analog
      - private LOIs to verify
    - label: Vertical proof
      detail: Use cases must become measurable in pharma, chemistry, finance, logistics, defense, or AI workflows.
      touchpoints:
      - Pasqal EDF/BASF analogs
      - IonQ Hyundai/Airbus analogs
      - IonQ NYSE finance analog
    - label: Procurement
      detail: Commercial conversion likely requires security review, budget ownership, procurement, and proof beyond classical
        systems.
      touchpoints:
      - agency awards
      - enterprise POCs
      - benchmark evidence
    - label: Expansion / retention
      detail: Durability would come from custom algorithms, trained users, workflow integration, and recurring access or system
        contracts.
      touchpoints:
      - algorithm libraries
      - HPC integrations
      - renewal data to request
  approximationNotes: Journey stages are inferred from adjacent government and competitor adoption surfaces; Oratomic has
    no current customer journey data.
