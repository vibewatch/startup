      - number: '7.3'
        title: Operational, quality, security, and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the largest company-controlled execution challenge. Caltech’s 6,100-qubit array record
              is impressive, yet it is still a lab-scale predecessor to a utility-scale, error-corrected commercial
              machine. Neutral-atom hardware depends on high-performance lasers, optical tweezers, vacuum systems,
              control electronics, chip packaging, and precise atom movement; PostQuantum’s supply-chain analysis
              highlights that the winners may include specialized component vendors rather than only computer builders.
              Oratomic’s use of proceeds for hardware fabrication and team expansion confirms that the risk is not
              software-only. Reliability, atom loss, fidelity, calibration drift, uptime, cyber/physical lab controls,
              and reproducibility must all clear before customers or government buyers can rely on the system. The
              mitigation posture is still early because no public source provides supplier redundancy, quality-system
              certification, uptime targets, or security-control evidence.
            claimRefs:
              - CR005
