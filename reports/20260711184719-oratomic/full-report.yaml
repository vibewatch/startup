      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is public-sector urgency: policy, defense, CHIPS-style incentives, and
              benchmarking programs can keep capital flowing before enterprise ROI is obvious. Error correction is the
              second driver because useful applications depend on deeper circuits, better fidelity, and lower overhead.
              Oratomic’s claim that 10,000-20,000 reconfigurable atomic qubits could be enough for cryptographically
              relevant computation would materially expand the reachable market if independently validated. The
              constraints are equally important. BCG says current quantum computing has no tangible commercial or
              scientific advantage at scale, remains far more expensive per hour than classical computing, and is still
              many orders of magnitude from useful gate depth. Neutral atoms add their own supply-chain and engineering
              constraints around lasers, optics, vacuum systems, atom loss, and specialist talent.
            claimRefs:
