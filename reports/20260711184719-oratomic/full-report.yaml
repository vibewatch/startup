  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Oratomic’s risk stack is dominated by regulatory/legal exposure, scale-up execution, and
              financing/valuation sensitivity rather than ordinary go-to-market risk. The company has a large $300
              million Series A and credible Caltech-linked science, but the plan deliberately skips near-term NISQ
              revenue and concentrates value in a utility-scale machine targeted around the end of the decade. That
              creates an option-like profile: the upside is meaningful if the 10,000-to-20,000-qubit architecture works,
              while residual exposure remains high because cryptography, export-control, IP, supplier, and financing
              constraints can each delay customer access before revenue exists. For underwriting, the investment
              implication is to avoid treating the round as de-risked growth capital. It should be monitored like a
              milestone-gated deep-tech program with explicit proof points for compliance, logical-qubit progress,
              supplier readiness, and valuation resilience.
            claimRefs:
