      - number: '1.4'
        title: Milestones, adverse lens, and cover-metric gaps
        blocks:
          - type: paragraph
            body: >-
              The chronology compresses dramatically. In 2025, the Endres lab demonstrated a 6,100-neutral-atom qubit
              array, giving Oratomic a credible experimental context. On March 31, 2026, Oratomic and Caltech publicized
              a lower-resource Shor architecture and the company emerged from stealth. By July 2026, it had raised a
              mega-round and was being valued like an option on near-term fault tolerance, despite no disclosed revenue
              or customers. The adverse lens is material: BCG's broader forecast still places full-scale fault tolerance
              after 2040, while market commentary warns that quantum valuations can race ahead of revenue and
              commercialization. Government activity cuts both ways. NIST's post-quantum-cryptography standards and
              White House quantum policy increase strategic urgency, but Commerce's May 2026 quantum LOIs named
              neutral-atom peers rather than Oratomic. The chapter therefore supports Oratomic as an elite technical
              team with capital, not as a commercially validated vendor.
