  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price-sensitive thesis
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with tracking rights rather than immediate buy at the reported price. The
              thesis is real but still option-like: Oratomic combines a credible Caltech/Harvard founder base, a large
              quantum end-market, a distinctive neutral-atom architecture, and a $300 million investor syndicate that
              can fund a serious hardware sprint. The anti-thesis is equally central to valuation: the company is
              pre-revenue, has no announced customers, is explicitly not monetizing NISQ systems, and asks investors to
              underwrite a leap from lab-scale and architectural evidence to a utility-scale fault-tolerant system by
              the end of the decade. At an assumed approximately $1.5 billion post-money valuation, entry is not about
              paying for current fundamentals; it is paying for milestone probability, market timing, and access to one
              of the few credible teams pursuing cryptographically relevant quantum hardware.
