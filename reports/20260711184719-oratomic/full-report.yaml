      - number: '7.5'
        title: Financial/model risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Financial risk is severe because the company is pre-product and pre-revenue while operating in a
              capital-intensive hardware category. The reported roughly $1.5 billion post-money valuation can be
              rationalized as a breakthrough option, but adverse market sources warn that quantum valuations may be too
              far ahead of revenue and that 2026 public-comparable sentiment can reverse quickly. Oratomic should
              therefore be underwritten with staged evidence: legal and IP files complete, export controls classified,
              supplier redundancy documented, logical-qubit milestones independently reviewed, and runway tied to
              milestones rather than narrative. Kill criteria should be explicit. A failure to show reproducible
              progress toward error-corrected logical operations, a blocked license or export classification, a major
              talent departure, a down-round before core milestones, or credible evidence that the 10,000-qubit
              architecture is not manufacturable should reprice or stop the investment.
