  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              This chapter sizes Oratomic against provider revenue in quantum computing, not against the much larger
              economic value-at-stake that consultants use to describe end-user savings. The included spend pool is
              hardware, software, cloud access, services, consulting, training, and application-development revenue tied
              to quantum computing. Excluded or adjacent pools include quantum sensing, quantum networking, post-quantum
              cybersecurity tools sold without quantum-computing access, and the productivity gains that pharma,
              finance, logistics, or defense users might ultimately capture. Oratomic’s closest wedge is narrower still:
              neutral-atom, fault-tolerant systems and the optical, control, cloud, and services stack around them. The
              practical substitute today is not another quantum box; it is classical HPC, GPUs, AI libraries, and
              experienced heuristic solvers, because broad quantum advantage remains unproven.
            claimRefs:
