      - number: '3.4'
        title: Capability, pricing, GTM, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, Oratomic scores high on architectural ambition but low on commercial maturity. Its
              10,000-to-20,000-qubit claim is unusually efficient if validated, yet it is still an architecture and
              research result rather than a customer-accessible machine. Rivals separate into two groups. First are
              cloud-ready or revenue-generating platforms: QuEra, Pasqal, IonQ, Rigetti, IBM, D-Wave, and
              AWS/Azure-hosted providers expose access, pricing, or service tiers today. Second are
