      - number: '2.2'
        title: TAM, SAM, SOM, and contradictory sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The market is clearly large enough to attract venture and public funding, but the public estimates are too
              dispersed to average. A single 2030 quantum-computing market quantity ranges from BCC Research’s $7.3
              billion to The Business Research Company’s $16.27 billion and MarketsandMarkets’ $20.20 billion. BCG is
              even more conservative for the near term, framing the 2030 provider market at only $1 billion to $2
              billion after cutting NISQ-era expectations, while preserving a much larger 2040 provider market and
              economic-value outlook. McKinsey’s 2026 monitor, as summarized and critiqued by PostQuantum, moves the
              lens out to 2035 with a $43 billion to $71 billion quantum-computing market and trillion-dollar economic
              value. For Oratomic, SAM is the neutral-atom fault-tolerant slice, and SOM remains an explicit gap because
              no price, capacity, or customer pipeline is public.
