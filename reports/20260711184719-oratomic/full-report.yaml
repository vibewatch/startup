      - number: '1.2'
        title: Founders, leadership, and governance concentration
        blocks:
          - type: paragraph
            body: >-
              The leadership story is the strongest part of the overview but also a source of concentration risk.
              Oratomic's public launch materials name a compact group of quantum-error-correction, neutral-atom, AI, and
              optical-engineering specialists, with Dolev Bluvstein as CEO, Hsin-Yuan (Robert) Huang as CTO, and
              Caltech-linked senior figures including Manuel Endres and John Preskill anchoring scientific credibility.
              This is founder-market fit in a literal sense: the company exists because the same scientific group
              concluded that a neutral-atom architecture could lower the qubit burden enough to make fault-tolerant
              machines plausible sooner than expected. The diligence issue is not whether the founders are relevant; it
              is whether such a small expert group can scale hardware engineering, fabrication, cryogenic packaging, and
              product execution. Public sources reviewed for this chapter also do not disclose board seats, observer
              rights, founder vesting, or leadership changes after launch, so governance must be treated as a
              private-document diligence item.
