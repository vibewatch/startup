      - number: '6.5'
        title: Expansion path is plausible but exposed to concentration and procurement friction
        blocks:
          - type: paragraph
            body: >-
              If Oratomic reaches convincing utility-scale milestones, expansion could follow a land-and-expand path:
              government or lab validation, vertical proof in pharma/chemistry/finance/logistics, cloud or HPC access,
              and then dedicated systems or recurring access contracts. The risk is concentration. Public orders and
              strategic programs appear to anchor much of early quantum demand, and a first wave of customers could be a
              small set of agencies, labs, hyperscalers, or regulated enterprises. Procurement friction is also high
              because buyers will likely require security review, export-control sensitivity assessment, benchmarking,
              proof against classical alternatives, user agreements, and multi-year budgets. The lack of a NISQ sales
              wedge increases the stakes: Oratomic may have superior long-term architecture, but it has fewer near-term
              customer learning loops than competitors selling prototypes or cloud access today.
            claimRefs:
