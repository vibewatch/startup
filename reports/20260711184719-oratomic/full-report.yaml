      - number: '7.2'
        title: Regulatory, legal, privacy, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              The legal risk is unusually central because Oratomic’s own thesis is tied to Shor’s algorithm, the same
              mechanism that drives national-security and post-quantum migration concern. NIST says quantum-capable
              machines may eventually break widely used cryptographic systems and that organizations should migrate to
              quantum-resistant standards; ENISA similarly frames mitigation before a quantum-capable attacker arrives.
              In parallel, Commerce/BIS export controls and law-firm analyses show that quantum computing is already a
              controlled advanced-technology category, with deemed-export, allied-alignment, and research-collaboration
              issues. The IP picture is also incomplete: Oratomic is described as a Caltech spinout and its founder
              ecosystem has relevant patent filings, but public sources do not disclose the exact Caltech or Harvard
              license economics. Residual exposure therefore remains high until counsel verifies export classifications,
              invention assignments, license scope, government-rights clauses, and data-security obligations.
            claimRefs:
              - CR013
              - CR014
