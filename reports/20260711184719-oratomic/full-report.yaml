      - number: '5.2'
        title: Neutral-atom architecture and module map
        blocks:
          - type: paragraph
            body: >-
              The technical stack begins with individual neutral atoms trapped in optical tweezers and extends through
              atom shuttling, Rydberg entangling operations, error-correction software, real-time decoding, and
              AI-assisted design loops. Caltech’s public materials and the Nature logical-processor paper make the
              operating model unusually concrete: atoms can be moved during computation, optical-tweezer arrays can
              create dense storage and entangling zones, and transversal operations can exploit parallel physical gates.
              Oratomic’s differentiation is the claim that this reconfigurability collapses the error-correction
              overhead enough to make cryptographically relevant workloads possible with roughly 10,000 to 20,000
              physical qubits rather than million-qubit machines. The module map still has private gaps around atom
              source, laser suppliers, packaging, control electronics, and how internal AI tooling actually closes
              hardware-design loops.
