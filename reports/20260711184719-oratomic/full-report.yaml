      - number: '2.5'
        title: Diligence implications and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The investability issue is not whether quantum computing can support a large eventual market; it is
              whether Oratomic can convert a theoretical neutral-atom architecture into a validated utility-scale
              product before better-capitalized modalities and classical substitutes absorb the practical workflows. The
              adverse evidence is material: present-day advantage is not proven, current unit economics are poor,
              enterprise buyers usually require short ROI windows, and market reports disagree sharply on the same 2030
              label. The diligence plan should therefore avoid a single TAM multiple and underwrite milestones:
              independent utility-scale validation, logical-qubit roadmap, gate fidelity, atom-loss mitigation,
              manufacturing/supply chain, channel strategy, and proof that a buyer will pay for Oratomic-specific
              access. Until those items are evidenced, Oratomic’s SOM should be recorded as unknown rather than inferred
              from broad TAM.
            claimRefs:
