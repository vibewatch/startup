      - number: '7.4'
        title: Partner, people, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The dependency map is concentrated. Oratomic needs university-origin IP and continuing scientific
              credibility from Caltech/Harvard-linked founders; it needs specialized optical and control-equipment
              suppliers; it needs capital providers comfortable with long-duration hardware risk; and it may need
              government policy support or procurement credibility to bridge the gap before commercial revenue. The
              founding team is a strength, but it also creates key-person risk because the highest-value claims rest on
              a small group of physicists and advisors. The public record also lacks named customers or production
              deployments, so partner risk cannot be offset by customer pull yet. Diligence should treat university
              licenses, supplier capacity, export-control classification, and talent-retention plans as dependency
              evidence, not administrative clean-up.
