      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely early buyers are sophisticated institutions with R&D, national-security, or cloud-channel
              budgets rather than ordinary enterprise software buyers. Government and defense agencies can pay for
              validation, foundry capacity, and mission applications through appropriations or program awards. Pharma,
              chemicals, and materials teams care about molecular and materials simulation; finance cares about risk,
              portfolio, and cryptography workflows; logistics and manufacturing care about optimization. Cloud and HPC
              providers may become channels if they can package scarce quantum hardware as hybrid access. Users and
              payers are often different: scientists and quants run the workflows, while agency program executives, R&D
              heads, CIOs, CROs, and cloud GMs own budgets. The adoption path therefore looks like research monitoring,
              POC, benchmark validation, security/procurement review, and only then production use.
