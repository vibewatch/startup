        title: Comparable valuations and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Comps show why Oratomic can command a quantum premium while also showing why the price is stretched.
              PsiQuantum and Quantinuum provide high-private-valuation benchmarks for teams pursuing utility-scale
              hardware; IonQ, Rigetti, and D-Wave show public-market liquidity and the scale of narrative-driven quantum
              market caps; Infleqtion and other 2026 SPAC or IPO references show an exit window for neutral-atom and
              adjacent platforms. Yet those same comps warn against over-reading headline values. IonQ has public
              revenue evidence that Oratomic lacks, public pure-plays have seen sentiment-driven drawdown risk, and
              filings for public comps emphasize commercialization and capital-intensity risks. Oratomic is not
              exit-ready today: it needs validated technology milestones, customer evidence, audited use-of-funds and
              runway, and a cleaner public valuation trail.
