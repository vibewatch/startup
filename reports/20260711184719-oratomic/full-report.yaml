        title: Other modalities and distribution incumbents
        blocks:
          - type: paragraph
            body: >-
              Non-neutral-atom rivals matter because enterprise and government buyers typically fund a portfolio of
              modalities, not a purist hardware thesis. PsiQuantum has the strongest capitalization signal among private
              peers: a $1 billion Series E at a $7 billion valuation with NVIDIA collaboration and utility-scale sites
              in Brisbane and Chicago. Quantinuum has the highest reported private valuation in this source set, at $10
              billion pre-money, and combines H-series hardware, enterprise software, and partnerships such as SoftBank.
              IonQ and D-Wave are public-market adoption comps with revenue and cash disclosures, while Rigetti supplies
              superconducting access through cloud and hardware orders. IBM, Google, AWS, Azure, and IonQ Cloud create
              the distribution layer: they own developer workflows, pricing meters, training surfaces, and procurement
              trust. This makes Oratomic vulnerable if its eventual hardware must route through channels that already
