companyProfile:
  summary: >-
    Oratomic 是一家位于 Pasadena, California 的量子计算硬件创业公司，源自 Caltech 相关研究，并于 2026 年 3 月 31
    日结束隐身。公司正用光镊困住的可重构中性原子阵列开发容错、实用规模量子计算机，并主张一台具备密码学相关能力的机器只需约 10,000-20,000 个物理量子比特，而不是此前假设的约 1,000,000 个。2026 年 7
    月，公司完成 $300M A 轮，ARCH Venture Partners、Spark Capital 与 Khosla Ventures 共同领投，报道投后估值约 $1.5B。公司明确放弃近期 NISQ
    产品，目标是在本十年末推出实用规模机器。
  foundedDate: '2026-03-31'
  founders:
    - name: Dolev Bluvstein
      role: 联合创始人兼 CEO
      background: 前 Harvard 量子物理学家；Caltech 相关研究人员，是中性原子纠错突破的核心人物。
