        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              早期买方很可能是拥有研发、国家安全或云渠道预算的复杂机构，而不是普通企业软件买家。政府和国防机构可以通过拨款或项目奖励支付验证、代工产能和任务应用。制药、化学和材料团队关心分子与材料模拟；金融关心风险、组合和密码学工作流；物流和制造关心优化。云和
              HPC 供应商若能把稀缺量子硬件包装成混合访问，可能成为渠道。用户和付款方往往不同：科学家和量化人员运行工作流，机构项目主管、研发负责人、CIO、CRO 和云业务 GM
              掌握预算。因此，采用路径更像是研究跟踪、POC、基准验证、安全 / 采购审查，之后才是生产使用。
