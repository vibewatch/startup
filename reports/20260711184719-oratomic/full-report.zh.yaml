  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 未来实用服务，不是今天的产品
        blocks:
          - type: paragraph
            body: >-
              Oratomic
              的产品与技术故事应读作未来实用服务工作流，而不是已经发货的量子计算产品。公司及其发布稿把雄心定义为：用中性原子、光镊和超高效率纠错打造实用规模、容错量子计算机。用客户语言说，预期任务是让科学家、政府实验室、密码学团队，以及最终的企业研究人员提交需要可靠逻辑量子比特的工作负载，而不是使用今天的噪声原型。重要的尽调边界是，TechCrunch
