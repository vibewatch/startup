  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 规模证明失败
        - 18-24 个月内没有独立的纠错规模证据
        - 削弱核心 10K-20K 量子比特论点
        - 避免投入新资金，或下调估值
      - - 融资破裂
        - 下一轮低于据报 $1.5B 投后估值，或带有惩罚性优先权
        - 表明当前入场价格过高，未来稀释不利
        - 不领投；只谈重置条款
      - - 客户证明缺口
        - 尽管不走 NISQ 策略，仍没有付费政府或战略里程碑
        - 拉长零收入期，并提高对融资的依赖
        - 只跟踪到合同证据出现
      - - 关键人流失
        - CEO / CTO / 创始科学负责人离职，或出现 IP 争议
        - 直接损害技术执行和融资可信度
        - 若治理无法替换，暂停或退出
      - - 竞争替代
        - 竞争技术路线先证明实用规模路径，且经济性更好
        - 降低退出概率和战略稀缺性
        - 重新定价，或重新配置资本
      - - 市场倍数压缩
        - 上市量子股票组合下跌 50%+，且没有 Oratomic 特定证据抵消
        - 压缩退出可比项和后期资金胃口
        - 要求更低入场价和更强下行条款
    notes: 触发项被设计成可监控的投资治理阈值，而不是泛泛的风险。
    claimRefs:
      - CV012
      - CV029
      - CV030
      - CV031
      - CV035
      - CV038
      - CV040
      - CV043
      - CV046
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 估值条款
        - 已签署的投资条款清单、投后估值确认、期权池、优先权栈
        - 决定 $1.5B 入场价能否产生基金级回报
        - 领投方 / 律师：索取融资文件和股权结构表
      - - 技术路线图
        - 对纠错阈值和硬件规模预算的独立评审
        - 把架构主张转成里程碑概率
        - 量子专家小组：评审论文、实验室数据和路线图
      - - 客户需求
        - 付费 LOI、政府里程碑，或战略伙伴预算负责人
        - 抵消无 NISQ 收入缺口，并验证用例紧迫性
        - 商业尽调：访谈机构和战略伙伴
      - - 资金续航与现金消耗
        - 月度现金消耗、制造预算、招聘计划和里程碑资金续航
        - 硬件资本强度决定未来稀释风险
        - CFO 尽调：检查预算和董事会批准的运营计划
      - - 竞争基准
        - 与 PsiQuantum、Quantinuum、IonQ、Infleqtion、QuEra、Atom Computing 并排对照路线图
        - 测试稀缺性和潜在退出买方胃口
        - 技术 / 市场尽调：可比公司路线图矩阵
      - - 治理和人才
        - 创始人留任、IP 转让、Caltech 授权和关键人预案
        - 防住创始人 / 实验室依赖
        - 法务和 HR 尽调：核验转让和留任
    notes: 这些要求是从 research-more 走向可定价建议所需的最低证据包。
