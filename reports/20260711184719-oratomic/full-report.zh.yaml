              Quantinuum；它们未必便宜或广泛开放，但资本化规模更大，拥有战略站点和企业伙伴关系。多数硬件供应商的定价仍不透明，因此缺乏支撑的单元格应保持明确：Oratomic 定价未知，PsiQuantum
