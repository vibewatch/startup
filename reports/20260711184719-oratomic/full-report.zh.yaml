      - number: '5.2'
        title: 中性原子架构与模块地图
        blocks:
          - type: paragraph
            body: >-
              技术栈从被光镊困住的单个中性原子开始，延伸到原子搬运、Rydberg 纠缠操作、纠错软件、实时解码和 AI 辅助设计循环。Caltech 公开材料和 Nature
              逻辑处理器论文让运行模型异常具体：原子可以在计算中移动，光镊阵列可以创建密集存储区和纠缠区，横向操作可以利用并行物理门。Oratomic
              的差异化在于主张：这种可重构性大幅压缩纠错开销，使密码学相关工作负载可能只需要约 10,000 到 20,000
              个物理量子比特，而不是百万量子比特机器。模块地图仍有私有缺口，包括原子源、激光供应商、封装、控制电子，以及内部 AI 工具究竟如何闭合硬件设计循环。
