        - Crunchbase 称私人融资投前估值 ~$10B；其他 2026 IPO 指南提到更高 IPO 目标
        - 高可信量子硬件 / 软件栈的溢价基准
        - Honeywell 持股的离子阱全栈平台，证据基础更深
      - - IonQ
        - 公开市值和收入
        - Lambda 数据显示市值 ~$9B；公司公告 FY2025 收入 $130M
        - 显示公开量子溢价和收入验证门槛
        - 离子阱上市公司，已有收入和收购，披露画像不同
      - - Rigetti Computing
        - 公开市值 / SEC 文件
        - Lambda 数据显示市值 ~$2.5B；SEC 10-K 风险因素
        - 纯量子风险的较低公开硬件可比公司
        - 超导平台和公开市场波动限制可比性
      - - D-Wave Quantum
        - 公开市值 / SEC 文件
        - Lambda 数据显示市值 ~$1.4B；SEC 10-K 风险因素
        - 公开量子流动性和商业化风险证据
        - 退火加门模型策略，不同于容错中性原子
      - - Infleqtion
        - 中性原子公开市场里程碑
        - 2026 年公开上市；研究简报引用约 $1.8B 的 SPAC 估值，来源确认总募资至少 $550M
        - 中性原子最相关的技术路线 / 状态可比公司
        - SPAC 条款和上市后交易表现还需单独确认
    notes: 可比公司集只是覆盖与估值相关的量子硬件样本；部分私有估值来自媒体 / 分析师来源， 还需要一手文件确认。
