              单量子比特操控准确率，以及跨数百微米的原子移动。最强架构证明是 arXiv 上的 Shor 资源估计，加上环面码纠错和横向门的相关工作。不过，关键反向发现是，头部 10,000
              量子比特数字仍是理论值。即便相邻中性原子演示，也报告了原子损失、时钟速度，以及性能仍高于表面码阈值等限制。因此，产品成熟度地图把阵列规模和概念架构评得高于完整系统集成、客户工作流和可靠性运营。
