            body: >-
              Oratomic 的风险栈主要由监管 / 法律暴露、扩产执行和融资 / 估值敏感性主导，而不是普通市场进入风险。公司拥有大额 $300M A 轮和可信的 Caltech 相关科学基础，但计划有意跳过近期 NISQ
              收入，把价值集中在一台目标约在本十年末实现的实用规模机器上。这创造了一种期权式画像：如果 10,000 到 20,000
              量子比特架构跑通，上行空间可观；但残余暴露仍高，因为密码学、出口管制、IP、供应商和融资约束，都可能在收入出现前推迟客户访问。承销时，投资含义是不能把这一轮视为已经降险的增长资本。它应像里程碑闸门式深科技项目一样被监测，并为合规、逻辑量子比特进展、供应商就绪和估值韧性设定明确证明点。
