            body: >-
              法律风险异常核心，因为 Oratomic 自身论点绑定 Shor 算法，而这一机制正是国家安全和后量子迁移担忧的来源。NIST
              表示，具备量子能力的机器最终可能破解广泛使用的密码系统，组织应迁移到抗量子标准；ENISA 也主张在具备量子能力的攻击者到来之前缓解风险。与此同时，美国商务部 / BIS
              出口管制和律所分析显示，量子计算已经属于受管制的先进技术类别，涉及视同出口、盟友协调和研究合作问题。IP 图景也不完整：Oratomic 被描述为 Caltech
              分拆公司，其创始人生态有相关专利申请，但公开来源没有披露 Caltech 或 Harvard 授权的确切经济条款。因此，在法律顾问验证出口分类、发明转让、授权范围、政府权利条款和数据安全义务之前，残余暴露仍高。
