  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              本章按量子计算供应商收入来衡量
              Oratomic，而不是按咨询机构用于描述终端用户节省的更大经济价值池来衡量。纳入的支出池包括与量子计算绑定的硬件、软件、云访问、服务、咨询、培训和应用开发收入。排除或相邻的池子包括量子传感、量子网络、没有量子计算访问能力的后量子网络安全工具，以及制药、金融、物流或国防用户最终可能获得的生产率收益。Oratomic
              最贴近的切入点更窄：中性原子、容错系统，以及围绕它们的光学、控制、云和服务栈。今天真正的替代品不是另一台量子盒子，而是经典 HPC、GPU、AI 库和经验丰富的启发式求解器，因为广义量子优势仍未被证明。
