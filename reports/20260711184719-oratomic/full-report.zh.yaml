chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Oratomic 是一家刚公开亮相、总部在 Pasadena 的量子计算硬件公司，核心押注中性原子阵列、光镊和超高效率纠错。公司并不把自己定位成又一家近期 NISQ
              访问供应商。公开材料和融资报道指向一个更窄、风险也更高的任务：在本十年末造出实用规模、容错量子计算机，靠光和原子推进，而不是在技术成熟前销售原型系统。这让 Oratomic 作为 A
              轮公司的画像异常二元。身份事实有较强支撑——Oratomic 官网、Caltech、PitchBook 和 Pasadena Now 都指向其 Caltech 关联的 Pasadena
              足迹——但商业模式基本仍是未来时。收入、客户数、定价和产品可得性都不可得，因此封面画像应明确保留
              null，而不是从融资规模倒推牵引力。这个判断需要直接用管理层文件验证，不能从发布节奏推断；同一组公开记录既支持突破性雄心，也显示商业证明缺失。
