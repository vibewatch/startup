      - number: '2.5'
        title: 尽调含义与未解的规模缺口
        blocks:
          - type: paragraph
            body: >-
              投资性问题不在于量子计算能否支撑一个巨大的最终市场，而在于 Oratomic
              能否把理论上的中性原子架构转化为经过验证的实用规模产品，并赶在资本更充足的模态和经典替代品吸收实际工作流之前完成。反向证据很重要：当下优势尚未被证明，当前单位经济性较差，企业买家通常要求短 ROI
              窗口，市场报告对同一个 2030 年标签分歧很大。因此，尽调计划应避免使用单一 TAM 倍数，而要承销里程碑：独立实用规模验证、逻辑量子比特路线图、门保真度、原子损失缓解、制造 /
              供应链、渠道策略，以及买方愿意为 Oratomic 专属访问付费的证明。在这些项目有证据之前，Oratomic 的 SOM 应记录为未知，而不是从广义 TAM 推断。
