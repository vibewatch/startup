        title: 收入模型：今天没有，未来是期权价值
        blocks:
          - type: paragraph
            body: >-
              Oratomic 应按无收入公司建模。公司概览章负责历史融资时间线；本章只用同一组融资事实评估未来资金充足性。最干净的公开商业模式事实是负向事实：Oratomic
              称自己不会在通往容错机器的路上追求中间产品或商业系统，TechCrunch 同样报道它没有销售 NISQ 系统的计划。这意味着当前收入流、定价、ARR、客户收入、收入结构和收入确认都为
              null，而不是只是未披露的估计。未来模型可能包括实用规模算力访问、专用系统访问、算法 / 应用合作或授权，但这些是承销假设，不是已发布
              SKU。因此，收入桥梁是一种分阶段期权：科学架构必须先变成可靠机器，使用量才可能变成可确认收入。
