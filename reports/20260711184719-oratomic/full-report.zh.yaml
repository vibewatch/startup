      - number: '2.2'
        title: TAM、SAM、SOM 与相互矛盾的规模口径
        blocks:
          - type: paragraph
            body: >-
              这个市场显然大到足以吸引风险资本和公共资金，但公开估计分散得无法直接取平均。仅 2030 年量子计算市场规模一项，就从 BCC Research 的 $7.3B 到 The Business Research
              Company 的 $16.27B，再到 MarketsandMarkets 的 $20.20B。BCG 对近期更保守，在下调 NISQ 时代预期后，将 2030 年供应商市场定在仅 $1B 到
              $2B，同时保留更大的 2040 年供应商市场和经济价值前景。PostQuantum 对 McKinsey 2026 年监测报告的摘要和批评，则把视角拉到 2035 年，给出 $43B 到 $71B
              的量子计算市场和万亿美元级经济价值。对 Oratomic 来说，SAM 是中性原子容错切片，SOM 仍是明确缺口，因为公开信息中没有价格、产能或客户管线。
