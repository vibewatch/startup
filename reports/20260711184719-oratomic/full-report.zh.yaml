        title: 财务 / 模型风险、缓释手段和推翻投资论点的触发器
        blocks:
          - type: paragraph
            body: >-
              财务风险很重：公司仍处于产品和收入之前，却在烧钱强度很高的硬件赛道里推进。据称约 $1.5 billion 的投后估值，可以把它理解成一次突破期权；但反向市场信号也在提醒，量子估值可能跑在收入太前面，2026
              年公开可比公司的情绪也可能快速反转。因此，Oratomic 只能按分阶段证据来承保：法律和 IP
              文件齐备、出口管制分类明确、供应商冗余有文档、逻辑量子比特里程碑经过独立复核，现金续航也要绑定里程碑，而不是绑定叙事。停止投资的标准要写清楚。若公司无法展示朝可复现纠错逻辑操作的进展，牌照或出口分类被卡，核心人才离开，核心里程碑前出现降价轮，或有可信证据显示
