              报道的约 $1.5B 投后估值，应按中等置信度的报道数字处理，而不是已提交备案的事实。查阅来源均未披露老股转让、债务或授信额度。利益相关方含义很清楚：Oratomic
              有足够资本招聘和搭建，但融资辛迪加也引出后续问题——治理权、储备金能力、与战略投资人 Infleqtion 的冲突，以及 Caltech 知识产权条款。因此，下一个证据门槛是融资交割包，而不是另一篇媒体报道。
