  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、巨头、相邻玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              Oratomic 加入的是一场拥挤的实用规模量子竞赛，而不是开辟一个无人争夺的新类别。最接近的直接同行是中性原子专家 QuEra、Pasqal、Atom Computing、Infleqtion 和
              planqc；它们都声称光学控制原子具备同样宽泛的扩展优势，多数已经在销售云端、本地部署或政府支持项目。巨头和相邻层更宽：PsiQuantum 走光子容错路线，Quantinuum 和 IonQ
              销售俘获离子访问，Rigetti 和 IBM 运营超导系统，D-Wave 销售退火和门模型产品，Google Quantum AI 仍是设定基准的研究巨头。买方也有替代选择：经典 HPC 与 GPU
              模拟器、量子启发式优化、内部研究团队，以及维持不使用量子的现状工作流。因此，现实竞争问题不是 Oratomic
              是否有差异化架构，而是该架构能否在资金更充足的对手、云平台和上市供应商锁定客户、开发者心智和采购可信度之前成熟。
