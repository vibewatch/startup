              逻辑量子比特部署表述以及网络合作。Infleqtion 增加了上市公司资本、传感器 / 客户宽度，以及到 2028 年实现 100 个逻辑量子比特的路线图。planqc 规模较小，但在欧洲具备战略相关性：€50M
