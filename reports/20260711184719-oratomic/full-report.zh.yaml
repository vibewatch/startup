              时间线被压缩得很厉害。2025 年，Endres 实验室展示了 6,100 个中性原子量子比特阵列，为 Oratomic 提供了可信的实验背景。2026 年 3 月 31 日，Oratomic 与 Caltech
              公开低资源 Shor 架构，公司也结束隐身。到 2026 年 7 月，公司已完成巨额融资，并在没有披露收入或客户的情况下，被按近期容错期权来估值。反向证据很重要：BCG 的更广泛预测仍把全规模容错放在 2040
              年之后，而市场评论也警告，量子估值可能跑在收入和商业化之前。政府活动有两面性。NIST 的后量子密码标准和白宫量子政策提升了战略紧迫性，但美国商务部 2026 年 5 月量子意向书点名的是中性原子同行，而不是
              Oratomic。因此，本章支持的结论是：Oratomic 是一支拥有资本的顶尖技术团队，而不是经过商业验证的供应商。
