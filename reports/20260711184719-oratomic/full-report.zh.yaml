              相关资深人物提供科学可信度。这是真正字面意义上的创始人-市场匹配：公司之所以成立，是因为同一科学团队判断，中性原子架构可以把量子比特负担降到足够低，让容错机器比预期更早变得可行。尽调问题不是创始人是否相关，而是这么小的专家团队能否扩展硬件工程、制造、低温封装和产品执行。为本章查阅的公开来源也没有披露董事席位、观察员权利、创始人归属期或发布后的领导层变化，因此治理必须列为私有文件尽调项。
