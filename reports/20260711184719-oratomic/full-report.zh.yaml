      - number: '2.4'
        title: 增长驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自公共部门紧迫性：政策、国防、CHIPS 式激励和基准测试项目，都能在企业 ROI 清晰之前继续供给资本。纠错是第二个驱动因素，因为有用应用依赖更深电路、更高保真度和更低开销。Oratomic 声称
              10,000-20,000 个可重构原子量子比特足以支持密码学相关计算；若能被独立验证，将实质扩大可触达市场。约束同样重要。BCG
              认为，当下量子计算在规模化商业或科学应用中没有可感知优势，每小时成本仍远高于经典计算，并且距离有用门深仍差许多个数量级。中性原子还带来激光、光学、真空系统、原子损失和专门人才等供应链与工程约束。
