    approximationNotes: 矩阵评分反映已抓取来源的证据质量，并刻意将所有非 Oratomic 行标为相邻证据。
    claimRefs:
      - CU006
      - CU022
      - CU027
      - CU030
      - CU031
      - CU039
      - CU042
  - id: FU004
    title: 留存 / 重复队列——仅为相邻量子队列示意
    type: cohort
    layout: standard
    summary: Oratomic 没有客户，因此留存只能作为示意性尽调框架，而不是公司实际表现。
    data:
      columns:
        - 第 0 年
        - 第 1 年
        - 第 2 年
        - 第 3 年
      rows:
        - label: 政府 / 国家实验室接入类比
          values:
            - 100
            - 90
            - 80
            - 70
        - label: 企业量子创新 POC 类比
          values:
            - 100
            - 65
            - 45
            - 30
        - label: 深度共同开发类比
          values:
            - 100
            - 85
            - 75
            - 60
        - label: Oratomic 披露客户队列
          values:
            - 0
            - 0
            - 0
            - 0
    approximationNotes: 所有百分比都是尽调讨论用的示意占位；Oratomic 行为零，是因为没有公开客户队列，而不是客户流失。
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU043
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 监管 / 法律和技术扩规模风险集中在高可能性、关键影响单元。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - null
            - text: 轻微供应商延误
              tone: neutral
            - text: 单一专利局延误
              tone: warning
            - null
        - label: 中可能性
          values:
            - null
            - text: 政府项目绕开
              tone: warning
            - text: 人才流失
              tone: high
            - text: IP 许可负担
              tone: critical
        - label: 高可能性
          values:
            - null
            - text: 尚无客户证明
              tone: warning
            - text: 光学供应瓶颈
              tone: high
            - text: 技术扩规模缺口
              tone: critical
        - label: 极高可能性
          values:
            - null
            - text: 合规工作量
              tone: warning
            - text: 估值情绪波动
              tone: high
            - text: 出口 / PQC 审查
              tone: critical
    approximationNotes: 序数位置使用章节风险登记中的可能性和影响排序，不是统计损失模型。
    claimRefs:
      - CR013
      - CR016
      - CR034
      - CR035
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 技术、监管、供应商和估值风险会传导到收入时点、利润率、融资和估值。
    data:
      nodes:
        - id: tech
          label: 技术扩规模
        - id: reg
          label: 出口 / PQC 合规
        - id: ip
          label: IP / 许可不确定性
        - id: supply
          label: 光学 / 制造供应链
        - id: customers
          label: 客户延迟
        - id: cost
          label: 更高法律 / 资本开支成本
        - id: finance
          label: 未来融资需求
        - id: valuation
          label: 估值压缩
      edges:
        - from: tech
          to: customers
          label: 里程碑延期
        - from: reg
          to: customers
          label: 接入受限
        - from: ip
          to: customers
          label: 使用领域不确定性
        - from: supply
          to: cost
          label: 交期
        - from: tech
          to: finance
          label: 更长资金续航
        - from: cost
          to: finance
          label: 现金消耗
        - from: customers
          to: valuation
          label: 收入延迟
        - from: finance
          to: valuation
          label: 稀释
        - from: reg
          to: cost
          label: 律师与控制措施
    approximationNotes: 图谱是方向性、定性的；展示的是承销风险传导，不是已测量因果关系。
    claimRefs:
      - CR038
      - CR039
      - CR043
      - CR044
      - CR045
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Oratomic 的关键依赖集中在大学 IP、专业供应商、监管机构、设施和融资。
    data:
      nodes:
        - id: caltech
          label: Caltech / Harvard IP
        - id: founders
          label: 科学家创始人
        - id: suppliers
          label: 激光 / 光学 / 真空供应商
        - id: facilities
          label: 制造与实验室设施
        - id: regulators
          label: BIS / NIST / White House
        - id: capital
          label: 投资人团
        - id: government
          label: DOE / DARPA / Commerce
        - id: oratomic
          label: Oratomic 执行力
        - id: customers
          label: 未来客户
      edges:
        - from: caltech
          to: oratomic
          label: 许可与技术诀窍
        - from: founders
          to: oratomic
          label: 技术可信度
        - from: suppliers
          to: facilities
          label: 关键投入
        - from: facilities
          to: oratomic
          label: 硬件放大
        - from: regulators
          to: oratomic
          label: 合规约束
        - from: capital
          to: oratomic
          label: 资金跑道
        - from: government
          to: customers
          label: 验证 / 采购
        - from: oratomic
          to: customers
          label: 实用级产品
        - from: regulators
          to: customers
          label: PQC 紧迫性
    approximationNotes: 依赖节点仅反映公开证据；私下的许可、供应商和客户协议可能改变集中度。
    claimRefs:
      - CR021
      - CR022
      - CR025
      - CR026
      - CR036
      - CR037
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 本章把规模机会、技术证明、商业缺口和价格转化为「继续研究」建议。
    data:
      nodes:
        - id: market
          label: 大市场期权
          detail: 2030-2040 年预测支撑巨大机会
        - id: proof
          label: 证明有潜力但未坐实
          detail: 10K-20K 架构与 6,100 量子比特背景
        - id: commercial
          label: 当前无商业证明
          detail: 无公开收入、客户或 NISQ 产品
        - id: risk
          label: 高风险栈
          detail: 技术放大、资本密集、倍数压缩
        - id: price
          label: 报道入场价偏高
          detail: 假设投后估值 ~$1.5B
        - id: call
          label: 继续研究 / 跟踪
          detail: 入场纪律必须由里程碑约束
    approximationNotes: 该流程是对引用主张的定性综合，并非数学模型。
    claimRefs:
      - CV014
      - CV019
      - CV035
      - CV044
      - CV045
      - CV046
  - id: FV002
    title: 估值对里程碑概率的敏感性
    type: bar
    layout: standard
    summary: 示例性预期价值敏感性说明，规模证明概率会主导估值判断。
    data:
      items:
        - label: 10% 里程碑概率
          value: 0.8
          unit: expected value / entry value
        - label: 20% 里程碑概率
          value: 1.2
          unit: expected value / entry value
        - label: 35% 里程碑概率
          value: 1.9
          unit: expected value / entry value
        - label: 50% 里程碑概率
          value: 2.6
          unit: expected value / entry value
        - label: 70% 里程碑概率
          value: 3.5
          unit: expected value / entry value
    approximationNotes: 示例倍数假设：规模证明跑通则上行空间很高，失败则严重减值；这些数值不是经审计的估值标记。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 低 / 基准 / 高情景框定了当前证据基础下可能的入场结果。
    data:
      items:
        - label: 悲观
          low: 0.3
          high: 1
          unit: valuation / entry value
          note: 降轮或期权减值
        - label: 基准
          low: 1
          high: 2
          unit: valuation / entry value
          note: 里程碑推进，但没有实用级系统
        - label: 乐观
          low: 3
          high: 6.7
          unit: valuation / entry value
          note: 稀释前，从 $1.5B 入场到 $5B-$10B 退出
    approximationNotes: 区间以相对假设 $1.5B 投后入场价的总估值表示，不计未来稀释 / 优先权。
    claimRefs:
      - CV005
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 评分在市场和团队上最强，但商业证明和估值支撑最弱。
    data:
      items:
        - label: 市场规模
          value: 8
          unit: /10
          status: strong
        - label: 技术证明
          value: 5
          unit: /10
          status: mixed
        - label: 护城河 / 团队
          value: 7
          unit: /10
          status: strong
        - label: 商业证明
          value: 2
          unit: /10
          status: weak
        - label: 资本效率
          value: 3
          unit: /10
          status: weak
        - label: 风险调整后估值
          value: 3
          unit: /10
          status: weak
        - label: 证据质量
          value: 5
          unit: /10
          status: mixed
    approximationNotes: 评分为作者估计，把引用证据压缩成可供 IC 使用的摘要量表。
    claimRefs:
      - CV014
      - CV015
      - CV019
      - CV029
      - CV030
      - CV035
      - CV044
      - CV045
      - CV046
      - CV047
