tables:
- id: TM001
  title: Market definition and boundary
  columns:
  - Category
  - Included spend
  - Excluded or adjacent spend
  - Buyer / payer
  - Relevance to Oratomic
  rows:
  - - Core quantum-computing market
    - Hardware, software, cloud access, services, consulting, training, application-development revenue
    - End-user productivity gains and broad economic value-at-stake
    - Cloud providers, enterprises, government labs, systems integrators
    - Sets TAM floor but overstates Oratomic because it includes all modalities and NISQ services
  - - Neutral-atom fault-tolerant systems
    - Neutral-atom processors, control stack, optical/vacuum subsystems, cloud or facility access
    - Quantum sensing, networking, and non-neutral-atom hardware
    - Government, cloud/HPC operators, pharma/chemistry/finance/logistics R&D groups
    - Closest SAM lens, but public pages disclose limited revenue sizing
  - - Applications enabled by quantum computing
    - Optimization, simulation, machine learning, cryptography, quantum chemistry, materials modeling
    - Classical AI-only software and non-quantum HPC sold for the same workflows
    - Business-unit users and central innovation/R&D budgets
    - Defines buyer jobs-to-be-done and why adoption may wait for fault tolerance
  - - Status-quo substitutes
    - Classical HPC, GPU clusters, AI libraries, approximate solvers, internal research teams
    - True quantum hardware revenue
    - CIO, CTO, research computing, line-of-business analytics teams
    - Dominates near-term purchasing because quantum advantage is unproven
  - - Other quantum modalities
    - Superconducting, trapped-ion, annealing, photonic, silicon spin, topological systems
    - Neutral-atom-specific optical-tweezer architecture
    - Same enterprise/government budgets plus modality-specific partners
    - Competes for scarce pilots, talent, grants, and cloud distribution
  notes: Boundary uses provider revenue as TAM/SAM denominator; economic value-at-stake is treated as an adjacency, not revenue.
