    - Useful SAM lens but numeric values are behind the report
  - - Oratomic evidence-constrained SOM
    - 2026 to 2030
    - Company-specific
    - Unknown / not supportable
    - null
    - Would require price, capacity, customer pipeline, and delivery schedule
    - Low
    - Pre-revenue and no announced customers make SOM a diligence gap
