slug: oratomic
runDate: '2026-07-11'
company:
  name: Oratomic
chapter:
  number: 2
  title: Market Analysis
  summary: 'Quantum computing is a real but definition-sensitive market: public 2030 estimates span $7.3B-$20.2B, while long-term provider and economic-value lenses are much larger. Oratomic’s relevant SAM is the neutral-atom fault-tolerant slice, but its SOM is unknown because the company is pre-revenue with no public customers, pricing, or capacity plan.'
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'This chapter sizes Oratomic against provider revenue in quantum computing, not against the much larger economic value-at-stake that consultants use to describe end-user savings. The included spend pool is hardware, software, cloud access, services, consulting, training, and application-development revenue tied to quantum computing. Excluded or adjacent pools include quantum sensing, quantum networking, post-quantum cybersecurity tools sold without quantum-computing access, and the productivity gains that pharma, finance, logistics, or defense users might ultimately capture. Oratomic’s closest wedge is narrower still: neutral-atom, fault-tolerant systems and the optical, control, cloud, and services stack around them. The practical substitute today is not another quantum box; it is classical HPC, GPUs, AI libraries, and experienced heuristic solvers, because broad quantum advantage remains unproven.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: TAM, SAM, SOM, and contradictory sizing lenses
  body: The market is clearly large enough to attract venture and public funding, but the public estimates are too dispersed to average. A single 2030 quantum-computing market quantity ranges from BCC Research’s $7.3 billion to The Business Research Company’s $16.27 billion and MarketsandMarkets’ $20.20 billion. BCG is even more conservative for the near term, framing the 2030 provider market at only $1 billion to $2 billion after cutting NISQ-era expectations, while preserving a much larger 2040 provider market and economic-value outlook. McKinsey’s 2026 monitor, as summarized and critiqued by PostQuantum, moves the lens out to 2035 with a $43 billion to $71 billion quantum-computing market and trillion-dollar economic value. For Oratomic, SAM is the neutral-atom fault-tolerant slice, and SOM remains an explicit gap because no price, capacity, or customer pipeline is public.
