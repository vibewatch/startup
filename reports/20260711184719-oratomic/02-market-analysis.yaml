- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Driver or constraint
  - Direction
  - Timing
  - Implication for Oratomic
  - Diligence ask
  rows:
  - - Public funding and strategic industrial policy
    - Driver
    - 2026-2030
    - Can subsidize validation and foundry/supply-chain access before commercial demand is mature
    - Identify whether Oratomic has grant, LOI, or agency-validation access
  - - Error-correction and lower-qubit-count architectures
    - Driver
    - 2027-2030
    - Could pull utility-scale timing toward Oratomic’s end-of-decade plan
    - Validate architecture under independent benchmarks and not just theory
  - - Cloud and hybrid access models
    - Driver
    - 2026-2030
    - May let buyers pilot without owning a machine
    - Clarify whether Oratomic will sell systems, cloud access, or partnerships
  - - Neutral-atom scalability and optical-tweezer flexibility
    - Driver
    - 2026-2032
    - Supports a differentiated SAM versus superconducting and trapped-ion systems
    - Compare gate fidelity, atom loss, and speed to modality alternatives
  - - No demonstrated broad quantum advantage
    - Constraint
    - Current
    - Keeps budgets in research/POC rather than production procurement
    - Require use-case proof where classical methods fail economically
  - - Quantum cost and ROI gap
    - Constraint
    - Current to medium term
    - Limits enterprise willingness unless value is large and time-sensitive
    - Model cost per useful logical operation versus HPC/GPU alternatives
  - - Supply-chain and talent bottlenecks
    - Constraint
    - 2026-2030
    - Optics, lasers, vacuum systems, and specialist physicists can slow scaling
    - Audit vendors, hiring plan, and manufacturing dependencies
  - - Cryptography and national-security scrutiny
    - Both
    - 2026-2035
    - Creates demand for PQC and government validation but raises trust/export-control risk
    - Map customers subject to PQC migration and security review requirements
  notes: Timing buckets reflect public-source horizons; several drivers are contingent on fault-tolerance evidence rather than current revenue.
