  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Caltech license
    missingEvidence: Executed Caltech and Harvard license agreements, field-of-use scope, sublicensing rights, royalties, and government-rights terms.
    whyItMatters: IP encumbrance can block commercialization or change economics after the investment is priced.
    diligencePath: Outside counsel should review executed licenses, invention assignments, patent prosecution files, and sponsored-research obligations.
    relatedQuestionRefs:
    - QR008
    - QR016
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: export controls
    missingEvidence: ECCN classifications, deemed-export controls, technology-control plan, foreign national access matrix, and customer/cloud access policy.
    whyItMatters: Quantum computing is a controlled advanced technology and non-compliance could block partnerships or trigger enforcement.
    diligencePath: Commission export-control counsel memo before close and require board-level compliance reporting.
    relatedQuestionRefs:
    - QR004
    - QR010
    - QR028
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: supplier readiness
    missingEvidence: Critical supplier list, lead times, dual-source status, quality agreements, inventory buffers, and failure-mode plans.
    whyItMatters: Optics, lasers, vacuum systems, and controls can gate hardware scale-up and burn.
    diligencePath: Run supplier diligence calls under NDA and tie financing milestones to dual-source coverage.
    relatedQuestionRefs:
    - QR012
    - QR017
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: technical milestones
    missingEvidence: Independent technical diligence on error budgets, logical-qubit roadmap, atom-loss assumptions, and reproducibility metrics.
    whyItMatters: The main valuation driver is not the 6,100-qubit predecessor but progress toward fault-tolerant logical operations.
    diligencePath: Hire independent neutral-atom and error-correction reviewers to inspect lab data and roadmap.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR027
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: customer proof
    missingEvidence: Named design partners, LOIs, government procurement paths, or customer problem statements tied to utility-scale milestones.
    whyItMatters: Without customer pull, valuation relies entirely on technical optionality and investor sentiment.
    diligencePath: Request customer pipeline, design-partner letters, and government program applications.
    relatedQuestionRefs:
    - QR020
    - QR025
  - type: private-evidence-only
    severity: material
    topic: runway and dilution
    missingEvidence: Burn plan, headcount plan, capex schedule, milestone budget, insider support, and next-round financing assumptions.
    whyItMatters: Hardware R&D can consume the Series A before proof arrives, forcing dilution or down-round risk.
    diligencePath: Review monthly cash forecast and tranche investment against technical and compliance milestones.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR023
  - type: private-evidence-only
    severity: material
    topic: people retention
    missingEvidence: Founder vesting, retention grants, succession plan, technical leadership bench, and hiring pipeline for hardware manufacturing and compliance.
    whyItMatters: Key-person loss could impair both technology transfer and investor confidence.
    diligencePath: Review employment agreements, retention packages, references, and succession coverage.
    relatedQuestionRefs:
    - QR015
  - type: enumeration-incomplete
    severity: minor
    topic: Regulatory / legal risk register
    missingEvidence: A full counsel-led survey of every applicable export, sanctions, privacy, safety, tax-credit, and facility-permitting rule.
    whyItMatters: The public-source register is sufficient for investment triage but not a closing legal checklist.
    diligencePath: Convert this risk register into a closing checklist owned by outside counsel.
