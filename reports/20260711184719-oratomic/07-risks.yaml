    - Pause or reprice; require independent technical review
  - - Export-control compliance
    - Outside-counsel classification and technology-control plan
    - No ECCN/deemed-export memo before foreign national, cloud, or customer access
    - Block customer expansion; hold financing proceeds in milestone tranche
  - - IP/license dependency
    - Complete Caltech/Harvard license and assignment package
    - Missing field-of-use rights, burdensome reach-through economics, or unresolved inventorship
    - Treat as thesis-break unless cured before close
