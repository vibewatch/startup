  figureRefs:
  - FR001
- id: regulatory-legal-ip
  title: Regulatory, legal, privacy, and IP exposure
  body: 'The legal risk is unusually central because Oratomic’s own thesis is tied to Shor’s algorithm, the same mechanism that drives national-security and post-quantum migration concern. NIST says quantum-capable machines may eventually break widely used cryptographic systems and that organizations should migrate to quantum-resistant standards; ENISA similarly frames mitigation before a quantum-capable attacker arrives. In parallel, Commerce/BIS export controls and law-firm analyses show that quantum computing is already a controlled advanced-technology category, with deemed-export, allied-alignment, and research-collaboration issues. The IP picture is also incomplete: Oratomic is described as a Caltech spinout and its founder ecosystem has relevant patent filings, but public sources do not disclose the exact Caltech or Harvard license economics. Residual exposure therefore remains high until counsel verifies export classifications, invention assignments, license scope, government-rights
    clauses, and data-security obligations.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR041
  tableRefs: []
  figureRefs: []
- id: operational-quality-security
  title: Operational, quality, security, and supply-chain risk
  body: Operational risk is the largest company-controlled execution challenge. Caltech’s 6,100-qubit array record is impressive, yet it is still a lab-scale predecessor to a utility-scale, error-corrected commercial machine. Neutral-atom hardware depends on high-performance lasers, optical tweezers, vacuum systems, control electronics, chip packaging, and precise atom movement; PostQuantum’s supply-chain analysis highlights that the winners may include specialized component vendors rather than only computer builders. Oratomic’s use of proceeds for hardware fabrication and team expansion confirms that the risk is not software-only. Reliability, atom loss, fidelity, calibration drift, uptime, cyber/physical lab controls, and reproducibility must all clear before customers or government buyers can rely on the system. The mitigation posture is still early because no public source provides supplier redundancy, quality-system certification, uptime targets, or security-control evidence.
  claimRefs:
  - CR005
  - CR010
  - CR011
  - CR012
  - CR035
  - CR038
  - CR039
  - CR044
  tableRefs:
  - TR002
  figureRefs: []
- id: partner-people-dependencies
  title: Partner, people, and dependency risk
  body: The dependency map is concentrated. Oratomic needs university-origin IP and continuing scientific credibility from Caltech/Harvard-linked founders; it needs specialized optical and control-equipment suppliers; it needs capital providers comfortable with long-duration hardware risk; and it may need government policy support or procurement credibility to bridge the gap before commercial revenue. The founding team is a strength, but it also creates key-person risk because the highest-value claims rest on a small group of physicists and advisors. The public record also lacks named customers or production deployments, so partner risk cannot be offset by customer pull yet. Diligence should treat university licenses, supplier capacity, export-control classification, and talent-retention plans as dependency evidence, not administrative clean-up.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
