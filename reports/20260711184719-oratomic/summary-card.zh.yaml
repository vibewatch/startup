  topStrengths:
    - Caltech / Harvard 顶级创始团队（Bluvstein、Endres、Preskill、Huang）站在一项走同行评审路线的突破背后，声称容错所需量子比特可减少约 100x。
    - 按阶段看资本极厚：$300M Series A 由 ARCH、Spark、Khosla 联合领投，Bezos Expeditions 等一线机构跟投。
    - 中性原子的可重构性，加上已演示的 6,100 量子比特阵列，让量子比特效率逻辑有了真实实验锚点。
    - 2026 年政府量子投资形成强顺风：美国商务部 $2B 股权计划、DARPA / DOE，以及白宫行政令都在加码。
  topRisks:
    - 10,000 量子比特核心主张仍停在理论层面：全尺寸容错机器尚不存在，公开演示也只到子规模组件。
    - 公司尚无收入、无产品、无客户；约 ~$1.5B 投后估值更像期权定价，缺少可承销的基本面。
    - 资本强度和稀释压力都高：量子硬件需要持续数亿美元级融资，且 PsiQuantum（累计融资约 ~$4B）、Quantinuum（估值约 ~$10B）等对手资金更厚。
    - 对少数学院派创始人的关键人依赖很高。
    - 军民两用与监管暴露：Shor 算法能力会引来出口管制和国家安全审查。
  unresolvedGaps:
    - 约 ~$1.5B 投后估值、股权结构和优先股堆叠都缺少一手确认。
    - 烧钱速度、现金跑道和资金用途细节未披露。
    - 硬件路线图，以及通往可工作的容错机器时间表，尚无独立验证。
    - 客户、合同、收入模式和商业化计划均未披露。
