- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Lower physical-qubit requirement
    - QuEra, Pasqal, Quantinuum, and Google disclose logical-qubit/error-correction roadmaps
    - High
    - Demand a milestone plan tying Oratomic architecture to measured logical error rates
  - - Neutral-atom scaling advantage
    - Multiple direct peers use neutral atoms and have cloud or government channels
    - High
    - Benchmark against QuEra, Atom, Pasqal, Infleqtion, and planqc on fidelity-adjusted logical operations
  - - Scientific founder brand
    - Competitors also have Harvard/MIT/Nobel/Honeywell/Google pedigree
    - Medium
    - Assess recruiting pipeline, retention, and exclusive IP rights from Caltech/Harvard work
  - - Pure fault-tolerance focus
    - Pre-commercial focus sacrifices NISQ revenue, customer feedback, and SDK habit formation
    - High
    - Request design partners, paid pilots, and a channel strategy before next financing
  - - Potential channel partnerships
    - AWS, Azure, IBM, IonQ, D-Wave, Pasqal, and QuEra already own access pathways
    - High
    - Map target cloud/hyperscaler economics and exclusivity restrictions
  - - Capital intensity funded by $300M Series A
    - PsiQuantum, Quantinuum, Pasqal, Infleqtion, and Atom have comparable or larger capital signals
    - High
    - Model next-round timing under delayed hardware milestones and supplier constraints
  - - Cryptographically relevant Shor positioning
    - Regulatory scrutiny and post-quantum migration can change demand timing or exportability
    - Medium
    - Obtain dual-use/export-control assessment and government procurement pathway evidence
  notes: Severity is an investment-committee judgment based on competitor scale, channel control, and proof maturity, not a quantified probability.
