- id: direct-neutral-atom-profiles
  title: Direct neutral-atom competitor profiles
  body: 'The direct neutral-atom cohort is already commercially legible. QuEra has the clearest cloud bridge: Aquila is a 256-qubit neutral-atom system available on Amazon Braket, and Libra is announced for Braket in 2028 with more than 256 error-corrected logical qubits. Its more than $230 million financing and AWS partnership pressure Oratomic on distribution and proof cadence. Pasqal is simultaneously pursuing cloud access, industrial use cases, a public listing, and a roadmap to 200+ logical qubits by 2029. Atom Computing is now the most direct funding peer, disclosing more than $300 million raised, a 1,200+ fully connected qubit system, Microsoft logical-qubit deployment language, and networking partnerships. Infleqtion adds public-company capital, sensor/customer breadth, and a 100-logical-qubit-by-2028 roadmap. planqc is smaller but strategically relevant in Europe through a €50 million Series A, DLR on-premise work, cloud plans, and HPC integration.'
