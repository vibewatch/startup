- id: moat-switching-costs-and-adverse-evidence
  title: Switching costs, lock-in, moat durability, and adverse evidence
  body: 'The durable moat case is not simply that Oratomic uses neutral atoms; multiple peers use the same substrate. The better argument is a bundle of qubit efficiency, Caltech/Harvard talent, reconfigurable arrays, and a pure fault-tolerance focus. That bundle could become powerful if it reaches a useful machine before buyers standardize on QuEra/AWS, Pasqal Cloud, IBM, IonQ, or other channels. Until then, lock-in mostly accrues to competitors: cloud marketplaces embed billing, SDKs, security review, budget approvals, and user training, while partnerships with AWS, Microsoft, NVIDIA, Cisco, SoftBank, DLR, and government programs create distribution and credibility advantages. Multi-homing lowers single-vendor lock-in for buyers but raises the bar for Oratomic because customers can keep experimenting elsewhere while waiting. The adverse evidence is material: better-funded rivals are scaling fast, public companies have revenue and liquidity, and even Quantinuum/SoftBank acknowledge current
    hardware and revenue-model limitations across the sector. Oratomic''s moat is therefore plausible but not yet durable.'
