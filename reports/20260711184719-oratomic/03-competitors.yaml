  - - Infleqtion
    - Direct neutral atom
    - Public INFQ; >$550M gross proceeds; $1.8B value report
    - Government, enterprise, sensing and software
    - Broader quantum sensing/customer base and public capital
    - Broader focus may dilute FTQC-specific execution
  - - planqc
    - Direct neutral atom
    - €50M Series A; DLR 100-qubit system
    - European industry, science, government
    - On-prem, cloud, and HPC-integrated full-stack products
    - Smaller capital base than U.S. peers
  - - PsiQuantum
    - Photonic FTQC
    - ' $1B Series E; $7B valuation'
    - Government-backed utility-scale sites
    - Silicon photonics and million-qubit-scale ambition
    - Pre-commercial; capital-intensive site buildout
  - - Quantinuum
    - Trapped ion / software
    - ~$600M raise at $10B pre-money
    - Enterprise, chemistry, security, AI
    - High-fidelity H-series systems and end-decade FTQC roadmap
    - Hardware performance and revenue models still maturing
  - - IonQ
    - Trapped ion public company
    - $130M 2025 revenue; $3.3B cash/investments
    - Cloud, enterprise, government
    - Public revenue proof and major-cloud integrations
    - Roadmap depends on scaling many physical and logical qubits
  - - Rigetti
    - Superconducting public company
    - 107-108 qubit systems; $8.4M C-DAC order
    - Cloud and on-premise research/HPC
    - Chiplet superconducting stack and Braket/QCS access
    - Fidelity lower than top trapped-ion claims
  - - D-Wave
    - Annealing and gate-model public company
    - FY2025 revenue +179%; >$884M liquidity
    - Optimization, hybrid solvers, enterprise cloud
    - Commercial Leap service, on-prem Advantage2, customer base
    - Annealing is not a direct universal FTQC substitute
  - - Google / IBM / hyperscalers
    - Incumbent platforms
    - 'IBM: 2,300+ available qubits; Google Willow benchmark'
    - Developers, researchers, enterprises
    - Developer ecosystem, cloud trust, fabrication and research depth
    - May prioritize ecosystem control over neutral-atom openness
  - - Classical HPC / GPU / internal build
    - Substitute / status quo
    - Existing budgets and installed compute
    - Optimization, simulation, AI teams
    - Known tooling, deterministic procurement, no quantum risk
    - May fail on future classically intractable chemistry or cryptography jobs
