  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Oratomic pricing and customers
    missingEvidence: Oratomic price book, channel plan, named design partners, and customer commitments.
    whyItMatters: Without pricing or buyer proof, competitive maturity remains materially behind peers with cloud access and public revenue.
    diligencePath: Request board materials, design-partner LOIs, pilot agreements, and any cloud or government channel term sheets.
    relatedQuestionRefs:
    - QP010
    - QP023
    relatedTableRefs:
    - TP003
  - type: conflicting-data
    severity: material
    topic: Comparable logical-qubit metrics
    missingEvidence: A normalized, fidelity-adjusted logical-qubit and logical-operations benchmark across Oratomic, QuEra, Pasqal, Atom, Quantinuum, Google, and IBM.
    whyItMatters: Competitors report qubits, atoms, logical qubits, operations, and availability in incompatible units, which can overstate or understate readiness.
    diligencePath: Commission a technical benchmark memo using physical qubits, gate fidelity, logical error rate, QOPS, and application depth.
    relatedQuestionRefs:
    - QP006
    - QP020
    - QP026
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: Enterprise discounts and realized pricing
    missingEvidence: Actual realized enterprise contract values, reserved-capacity discounts, and support pricing across cloud-access competitors.
    whyItMatters: List or token pricing may not reflect what strategic buyers pay after credits, grants, or reserved capacity.
    diligencePath: Interview quantum procurement teams and request anonymized invoice or contract examples from channel partners.
    relatedQuestionRefs:
    - QP010
    - QP015
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Supply and partner access
    missingEvidence: Oratomic supplier contracts for lasers, cryogenic packaging, photonics/control electronics, and fabrication capacity.
    whyItMatters: Competitors have visible hyperscaler, semiconductor, government, and public-market relationships that could constrain supplier and channel access.
    diligencePath: Review supplier MOUs, single-source dependencies, exclusivity clauses, and capex schedule against competitor commitments.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP004
