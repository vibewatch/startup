chapter:
  number: 3
  title: Competitors
  summary: 'Oratomic has a sharp neutral-atom fault-tolerance thesis, but its competitive moat is not yet durable: direct neutral-atom peers already have cloud access, public-market paths, and hyperscaler partnerships, while photonic, trapped-ion, superconducting, annealing, and platform incumbents control distribution and buyer trust.'
sections:
- id: landscape-and-substitutes
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'Oratomic is entering a crowded utility-scale quantum race rather than creating a new uncontested category. The closest direct peers are neutral-atom specialists QuEra, Pasqal, Atom Computing, Infleqtion, and planqc, all of which claim the same broad scaling advantage of optically controlled atoms and most of which already market cloud, on-premise, or government-backed programs. The incumbent and adjacent layer is broader: PsiQuantum pursues photonic fault tolerance, Quantinuum and IonQ sell trapped-ion access, Rigetti and IBM operate superconducting systems, D-Wave sells annealing and gate-model products, and Google Quantum AI remains a benchmark-setting research incumbent. Buyers also have substitutes: classical HPC and GPU simulators, quantum-inspired optimization, internal research teams, and status quo no-quantum workflows. The practical competitive question is therefore not whether Oratomic has a differentiated architecture; it is whether that architecture can mature before
    better-funded rivals, cloud platforms, and public vendors lock in customers, developer mindshare, and procurement credibility.'
