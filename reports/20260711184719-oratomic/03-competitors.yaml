- id: capability-pricing-and-trust-comparison
  title: Capability, pricing, GTM, and trust comparison
  body: 'On capability, Oratomic scores high on architectural ambition but low on commercial maturity. Its 10,000-to-20,000-qubit claim is unusually efficient if validated, yet it is still an architecture and research result rather than a customer-accessible machine. Rivals separate into two groups. First are cloud-ready or revenue-generating platforms: QuEra, Pasqal, IonQ, Rigetti, IBM, D-Wave, and AWS/Azure-hosted providers expose access, pricing, or service tiers today. Second are fault-tolerance-focused challengers such as PsiQuantum and Quantinuum, which may not be cheap or broadly open but have larger capitalization, strategic sites, and enterprise partnerships. Pricing remains opaque across most hardware vendors, so unsupported cells should stay explicit: Oratomic pricing is unknown, PsiQuantum is pre-commercial, and many enterprise deals are negotiated. Trust posture favors public companies, SEC/F-4 filers, hyperscaler-hosted products, and vendors with named government or enterprise
    references; Oratomic must still convert a prestigious scientific team into procurement-grade assurance.'
