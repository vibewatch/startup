  - TI004
  figureRefs:
  - FI003
- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'Financially, Oratomic is an unusually well-funded but still unpriced research-and-hardware option. Revenue quality is zero today because there is no disclosed revenue; margin path is promising only if the lower-qubit architecture translates into lower capital and service-delivery costs; and capital intensity remains high because lasers, atom-control systems, packaging, facilities, and specialized talent must be funded before commercial usage exists. The adverse case is not that quantum demand is imaginary; it is that the market pays for breakthrough optionality while the business has not yet shown business-model proof. The verdict is track/research-more rather than underwrite: require data-room evidence on burn, capex, hiring, customer commitments, pricing architecture, post-money valuation, and round terms before assigning revenue multiples or treating the $300 million as enough to reach utility-scale commercialization.'
  claimRefs:
  - CI023
  - CI024
