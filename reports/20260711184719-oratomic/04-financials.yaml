company:
  name: Oratomic
chapter:
  number: 4
  title: Financials
  summary: 'Oratomic is a pre-revenue, pre-product quantum hardware company whose only public financial anchor is a $300 million Series A. The financial case is therefore an adequacy-and-optionality analysis: no current revenue quality exists, public-company quantum filings show heavy burn even after commercialization, and the diligence blockers are burn, capex, pricing, and milestone-based financing dependency.'
sections:
- id: revenue-model
  title: 'Revenue model: none today, option value later'
  body: 'Oratomic should be modeled as pre-revenue. The Company Overview chapter owns the historical funding chronology; this chapter uses the same financing facts only to assess forward adequacy. The cleanest public business-model fact is negative: Oratomic says it is not pursuing intermediate products or commercial systems on the way to a fault-tolerant machine, and TechCrunch likewise reports that it has no plans to sell NISQ systems. That means current revenue streams, pricing, ARR, customer revenue, revenue mix, and revenue recognition are all null rather than merely undisclosed estimates. A future model could include utility-scale compute access, dedicated system access, algorithm/application partnerships, or licensing, but those are underwriting hypotheses, not announced SKUs. The revenue bridge is therefore a staged option: scientific architecture must become a reliable machine before usage can become recognized revenue.'
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI006
  - CI034
  - CI037
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-and-traction
  title: 'GTM and traction: demand signals without customer proof'
  body: 'Oratomic has strong category pull but no measurable sales-efficiency evidence. Government interest in quantum, including Department of Commerce letters of intent with nine companies for up to $2 billion, is a sector demand signal; it is not an Oratomic customer, backlog, revenue contract, or utilization commitment. The fetched sources disclose launch, founder pedigree, research claims, and the $300 million Series A, but not customers, pilots, pipeline conversion, CAC, payback, channel margin, or sales-cycle length. That changes the diligence posture: the first finance workstream is not optimizing a known GTM motion, but proving whether a future quantum-access product can translate technical scarcity into paid demand without services-heavy economics. Until Oratomic discloses pilots or customer commitments, GTM efficiency should be treated as a gap and benchmarked only qualitatively against public quantum peers.'
  claimRefs:
  - CI012
  - CI013
  - CI027
  - CI028
  - CI039
  tableRefs:
  - TI005
- id: cost-structure-and-unit-economics
  title: 'Cost structure: hardware R&D before margin math'
  body: 'The cost stack is capital-intensive even if the architecture succeeds. Oratomic describes a build that spans advanced optical systems, electronics, atomic physics, mathematical algorithms, error correction, and AI-automated design loops; third-party coverage adds fabrication scale-up, packaging, and control-hardware work. The 10,000-to-20,000-qubit thesis matters financially because it could lower the eventual hardware burden versus million-qubit approaches, but it does not create a gross margin today. Unit economics remain mostly null: no cost per qubit, utilization, bill of materials, service labor, warranty profile, uptime target, or support model is public. Public-company filings are useful as guardrails: IonQ, Rigetti, and D-Wave demonstrate that quantum revenue can coexist with R&D and operating cash use well above revenue, so Oratomic''s pre-revenue burn risk should be treated as structural rather than temporary.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI014
  - CI015
