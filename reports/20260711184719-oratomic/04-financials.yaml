  - FI004
- id: capital-adequacy
  title: 'Capital adequacy: large cash proxy, undisclosed burn'
  body: The $300 million Series A is a meaningful capitalization event for a newly public deep-tech company, and official Oratomic text confirms the co-leads and recruiting intent. But adequacy cannot be converted into a precise runway because the cash receipt schedule, monthly burn, lab capex, supplier deposits, payroll ramp, and debt obligations are undisclosed. A qualitative multi-year runway is plausible only under controlled burn; it becomes much shorter if Oratomic approaches public quantum peers' annual operating cash use while simultaneously building labs and hiring. The expected next-round trigger is therefore likely a technical milestone package, facility/hiring scale, or runway threshold—not a revenue multiple. Investors should require a board-approved budget, cash reconciliation, capex purchase order schedule, and milestone financing plan before treating the Series A as sufficient through fault-tolerant launch.
  claimRefs:
  - CI001
  - CI002
  - CI007
  - CI022
  - CI025
  - CI026
  - CI030
  - CI031
  - CI032
  - CI033
  - CI040
  - CI042
