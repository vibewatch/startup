    "number": 1,
    "title": "Company Overview",
    "summary": "Oratomic is a Pasadena-based Caltech spinout pursuing fault-tolerant neutral-atom quantum computers rather than near-term NISQ revenue. Public evidence strongly supports the March 2026 launch, elite founder-market fit, and $300 million July 2026 Series A, while revenue, customers, company-confirmed headcount, governance rights, and the reported roughly $1.5 billion valuation remain diligence gaps."
  },
  "sections": [
    {
      "id": "identity-and-model",
      "title": "Identity, headquarters, and business model",
      "body": "Oratomic is a newly public, Pasadena-based quantum-computing hardware company built around neutral-atom arrays, optical tweezers, and ultra-efficient error correction. The company is not positioning itself as another near-term NISQ access vendor. Its public materials and funding coverage point to a much narrower and riskier mission: build a utility-scale, fault-tolerant quantum computer by the end of the decade, using light and atoms rather than selling prototype systems while the technology matures. That makes the company profile unusually binary for a Series A startup. The identity facts are reasonably well supported — Oratomic's site, Caltech, PitchBook, and Pasadena Now all point to a Caltech-linked Pasadena footprint — but the business model is mostly future-tense. Revenue, customer count, pricing, and product availability remain unavailable, so the cover profile should explicitly carry nulls rather than infer traction from the size of the financing. This should be tested directly against management documents rather than inferred from press cadence, because the same public record supports both breakthrough ambition and missing commercial proof.",
