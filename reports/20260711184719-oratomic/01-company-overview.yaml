    {
      "id": "capital-and-stakeholders",
      "title": "Funding history, valuation, and stakeholder map",
      "body": "The July 2026 Series A is the defining corporate event. Multiple independent reports and market-data profiles corroborate a $300 million round, with ARCH Venture Partners, Spark Capital, and Khosla Ventures as co-leads and a broad syndicate that includes Bezos Expeditions, Index Ventures, General Catalyst, Lowercarbon Capital, Bain Capital, Formation, Nebular, named angels, Infleqtion, and other investors. The total public capital raised is therefore $300 million unless management discloses earlier seed instruments or converted SAFEs. A roughly $1.5 billion post-money valuation is reported by Crypto Briefing, but the chapter should treat that as a medium-confidence reported figure rather than a filed fact. No source reviewed discloses secondaries, debt, or credit facilities. The stakeholder implication is clear: Oratomic has enough capital to recruit and build, but the financing syndicate also raises follow-up questions about governance rights, reserve capacity, conflicts with strategic investor Infleqtion, and Caltech intellectual-property terms. A financing-close package is therefore the next evidence threshold, not another media citation.",
