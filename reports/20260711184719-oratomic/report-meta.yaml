companyProfile:
  summary: "Oratomic is a Pasadena, California quantum-computing hardware startup that emerged from stealth on March 31, 2026 out of Caltech-linked research. It is developing fault-tolerant, utility-scale quantum computers using reconfigurable neutral-atom arrays trapped in optical tweezers, and argues that a cryptographically-relevant machine could be built with roughly 10,000-20,000 physical qubits rather than the ~1,000,000 previously assumed. In July 2026 it raised a $300 million Series A co-led by ARCH Venture Partners, Spark Capital, and Khosla Ventures at a reported post-money valuation of about $1.5 billion. The company explicitly forgoes near-term NISQ products, targeting a utility-scale machine by the end of the decade."
  foundedDate: "2026-03-31"
