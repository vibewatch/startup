  topStrengths:
    - "Elite Caltech/Harvard founding team (Bluvstein, Endres, Preskill, Huang) behind a peer-reviewed-track breakthrough claiming a ~100x reduction in qubits needed for fault tolerance."
    - "Exceptional capitalization for stage: $300M Series A co-led by ARCH, Spark, and Khosla with Bezos Expeditions and other tier-one backers."
    - "Neutral-atom reconfigurability and demonstrated 6,100-qubit array give the qubit-efficiency thesis a real experimental anchor."
