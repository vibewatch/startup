  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: AI design loop
    missingEvidence: Oratomic technical demonstrations, code reviews, experiment logs, and validation results for the claimed
      internal AI hardware-design engine.
    whyItMatters: The AI loop is part of the differentiation claim but is supported publicly only by reporting, not reproducible
      technical documentation.
    diligencePath: Request a product architecture review with screenshots, experiment history, objective functions, and before/after
      calibration data.
    relatedQuestionRefs:
    - QE011
    - QE023
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: material
    topic: utility service readiness
    missingEvidence: Public API, SLA, support, incident response, deployment, pricing, and customer-access documentation.
    whyItMatters: The company has no product today, so investors need to separate a lab roadmap from a purchasable utility
      service.
    diligencePath: Ask for a staged product-readiness plan and milestones tying lab capability to customer onboarding and
      support.
    relatedQuestionRefs:
    - QE002
    - QE013
    - QE015
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: material
    topic: error-correction threshold proof
    missingEvidence: Independent reproduction of Oratomic-specific logical error rates, thresholds, decoder latency, and atom-loss
      budgets at thousands of physical qubits.
    whyItMatters: The core investment thesis depends on converting theoretical qubit efficiency into below-threshold, sustained
      logical operations.
    diligencePath: Commission an external technical review of the arXiv assumptions, decoder implementation, and lab data
      against independent benchmarks.
    relatedQuestionRefs:
    - QE005
    - QE008
    - QE014
    - QE021
    - QE025
    relatedTableRefs:
    - TE005
  - type: enumeration-incomplete
    severity: minor
    topic: supplier and facility map
    missingEvidence: Named suppliers and redundancy plans for lasers, optics, atom/vacuum systems, control electronics, packaging,
      and facilities.
    whyItMatters: The critical dependency map is necessarily generic without supplier names, lead times, yields, and safety
      controls.
    diligencePath: Request BOM-level supplier lists, single-source analysis, spare-parts plans, safety procedures, and facilities
      scale-up budget.
    relatedQuestionRefs:
    - QE003
    - QE016
    relatedTableRefs:
    - TE001
    - TE003
  - type: access-blocked
    severity: minor
    topic: external regulatory and partner pages
    missingEvidence: Some potential external pages were broken or redirected during fetch, including ENISA and one competitor
      partner page.
    whyItMatters: It limits corroboration of broader quantum-security policy and neutral-atom peer messaging but does not
      block the chapter thesis.
    diligencePath: Refresh the URLs or replace them with archived/official equivalents during the next report update.
