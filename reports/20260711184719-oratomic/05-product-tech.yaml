- id: differentiation-and-dependencies
  title: Differentiation, Caltech know-how, and critical dependencies
  body: 'The differentiation thesis combines qubit efficiency, Caltech-origin know-how, and a talent base that spans error
    correction, neutral-atom physics, AI, and optical engineering. Those strengths matter because neutral atoms have a rare
    combination of high qubit-count scaling and reconfigurable connectivity, while prior logical-processor work shows how
    zoned storage, entangling, and readout regions can support logical operations. The same architecture creates hard dependencies:
    precision lasers, optical modulators, vacuum systems, Rydberg excitation hardware, imaging, FPGA or low-latency control
    electronics, decoding software, and scarce Caltech/Harvard-grade talent all have to scale together. The critical dependency
    map treats Caltech IP and talent as a central node because the company’s proof claims are tightly coupled to a small group
    of researchers and their lab results.'
  claimRefs:
  - CE005
  - CE008
