chapter:
  number: 5
  title: Product & Technology
  summary: Oratomic is best understood as a pre-product R&D company pursuing a future fault-tolerant quantum-computing utility
    using reconfigurable neutral atoms. The strongest proof points are Caltech/IQIM research, a 6,100-atom array precedent,
    and technical work on error correction; the central risk is the gap between theoretical resource estimates and a demonstrated
    utility-scale machine.
sections:
- id: product-definition
  title: Future utility, not a product today
  body: Oratomic’s Product & Technology story should be read as a future utility-service workflow, not as a shipping quantum-computing
    product. The company and its launch release define the ambition as a utility-scale, fault-tolerant quantum computer built
    with neutral atoms, optical tweezers, and ultra-efficient error correction. In customer terms, the intended job is to
    let scientists, government labs, cryptography teams, and ultimately enterprise researchers submit workloads that require
    reliable logical qubits rather than today’s noisy prototypes. The important diligence boundary is that TechCrunch reports
    Oratomic is explicitly skipping the NISQ-product phase; there is therefore no current SKU, customer integration surface,
    pricing, uptime commitment, or support process to underwrite. The most honest product definition is an R&D program aimed
    at becoming a future compute utility.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE041
  - CE042
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: architecture-stack
  title: Neutral-atom architecture and module map
  body: 'The technical stack begins with individual neutral atoms trapped in optical tweezers and extends through atom shuttling,
    Rydberg entangling operations, error-correction software, real-time decoding, and AI-assisted design loops. Caltech’s
    public materials and the Nature logical-processor paper make the operating model unusually concrete: atoms can be moved
    during computation, optical-tweezer arrays can create dense storage and entangling zones, and transversal operations can
    exploit parallel physical gates. Oratomic’s differentiation is the claim that this reconfigurability collapses the error-correction
    overhead enough to make cryptographically relevant workloads possible with roughly 10,000 to 20,000 physical qubits rather
    than million-qubit machines. The module map still has private gaps around atom source, laser suppliers, packaging, control
    electronics, and how internal AI tooling actually closes hardware-design loops.'
