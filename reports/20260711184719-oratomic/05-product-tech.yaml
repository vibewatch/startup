  - - AI design loop
    - Optimize hardware layouts and QEC thresholds
    - Internal data, simulation stack, automated experiments
    - Private evidence and overfitting to lab conditions
  - - Utility service layer
    - Expose reliable workloads to future customers
    - Scheduling, security, support, SLAs, API tooling
    - Not publicly defined today
