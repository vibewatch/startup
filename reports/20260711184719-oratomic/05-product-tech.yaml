- id: trust-safety-security
  title: Trust, safety, security, and quality controls
  body: 'Trust for Oratomic has two layers. First, the machine itself needs a quality system that proves physical calibrations,
    syndrome extraction, atom-loss handling, decoding, resource estimation, and reliability metrics are stable enough for
    useful logical workloads. Public neutral-atom work shows pieces of that loop, but Oratomic has not disclosed a production
    quality program, certifications, incident process, export-control posture, or customer data boundary. Second, the product
    is dual-use by design: the strongest near-term value claim is cryptographically relevant Shor capability that could threaten
    RSA and ECC. NIST’s post-quantum standards, the 2035 migration horizon, DARPA benchmarking, and the 2026 White House quantum
    order all raise the bar for security governance. Any diligence should require controls for publication review, customer
    eligibility, export compliance, and responsible cryptography disclosure before commercialization.'
  claimRefs:
