- id: maturity-and-proof
  title: Proof points versus maturity gap
  body: 'The evidence base is stronger than a pure white paper but weaker than a working utility-scale system. The strongest
    physical proof point is the Caltech 6,100-neutral-atom array: public sources report about 13 seconds of coherence, roughly
    99.98% single-qubit manipulation accuracy, and atom movement over hundreds of micrometers. The strongest architecture
    proof is the arXiv Shor resource estimate plus related work on toric-code error correction and transversal gates. However,
    the critical adverse finding is that the headline 10,000-qubit number is theoretical. Even adjacent neutral-atom demonstrations
    report limitations such as atom loss, clock speed, and performance still above surface-code thresholds. The product maturity
    map therefore rates array scale and conceptual architecture higher than complete system integration, customer workflow,
    and reliability operations.'
  claimRefs:
