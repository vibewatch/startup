  topStrengths:
    - >-
      Vertically integrated AI-factory and GPU-cloud stack spans compute, networking, storage, cooling, power, and grid
      orchestration.
    - >-
      A USD 2 billion equity round and reported USD 10 billion debt facility demonstrate unusual access to strategic and
      institutional capital.
    - >-
      Named Meta and OpenAI agreements plus more than 900 MW of company-reported contracted capacity provide meaningful
      demand signals.
  topRisks:
    - >-
      Multi-site construction, permitting, grid connection, and commissioning delays could compound the platform's high
      capital intensity.
    - >-
      Audited revenue, utilization, margins, cash burn, runway, and site-level unit economics are not publicly
      disclosed.
    - >-
      Large financing requirements and an unsuccessful IPO process increase refinancing, dilution, and
      capital-availability risk.
    - >-
      Customer concentration, contract protections, NVIDIA-linked supplier concentration, and governance controls remain
      insufficiently disclosed.
  unresolvedGaps:
    - >-
      Obtain audited revenue, cash flow, utilization, unit economics, cash runway, and customer-concentration data by
      operating site.
    - >-
      Reconcile contracted, financed, under-construction, commissioned, and revenue-producing capacity with milestone
      dates and acceptance evidence.
    - >-
      Review the fully diluted cap table, preference stack, investor rights, project-level debt, covenants, maturities,
      collateral, and financing waterfall.
    - >-
      Verify customer contract duration, take-or-pay protections, renewal and termination rights, pricing, churn, and
      customer-level capacity allocations.
    - >-
      Obtain the complete permitting and grid-approval register plus independent security, reliability, energy, and
      water-performance evidence.
