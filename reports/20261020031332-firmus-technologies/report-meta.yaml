companyProfile:
  summary: >-
    Firmus Technologies is an Australian-incorporated AI-infrastructure platform that develops and operates vertically
    integrated AI factories and GPU cloud services. Its public proposition combines compute, networking, storage, liquid
    cooling, power management, and grid orchestration across an Asia-Pacific expansion program. Strategic investors and
    named hyperscale customer agreements validate access to capital and demand, while limited operating disclosure
    leaves utilization, unit economics, and project conversion unverified.
