      - ["Large enterprises", "CIO, CTO, data and AI leadership", "Internal product and data-science teams", "Cloud or transformation budget", "Performance, cost, reliability, and migration readiness", "No independently verified workload economics"]
      - ["Education and research", "University research-computing leadership", "Researchers and model developers", "Research infrastructure, grants, or consortium funding", "Access to local high-performance compute", "Named users and recurring budget evidence are sparse"]
