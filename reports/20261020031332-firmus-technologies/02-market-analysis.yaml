        - label: Tasmania plus Melbourne initial scope
          value: 150
          unit: MW
          note: "Combined first-stage scope reported in 2025."
        - label: Wesley Vale proposal
          value: 52
          unit: MW
          note: "Proposal subject to a complete major-project submission."
        - label: St Leonards facility
          value: 104
          unit: MW
          note: "Part of the reported Tasmanian pipeline."
        - label: Bell Bay development
          value: 288
          unit: MW
          note: "Reported as approved; operating status is not established here."
        - label: Combined Tasmanian demand request
          value: 444
          unit: MW
          note: "Long-term energy arrangement remained under assessment."
    approximationNotes: "Source-reported values are shown without transformation. Several markers overlap, and project maturity ranges from target to proposal or approval."
    claimRefs: [CM005, CM011, CM012, CM014]
callouts:
  - calloutType: risk
    title: A project pipeline is not a serviceable market
    body: >-
      Firmus's announced gigawatts and investment value measure planned supply and capital
      ambition. They do not establish contracted demand, commissioned capacity, utilization,
      revenue, or a defensible obtainable-market share.
    claimRefs: [CM004, CM005, CM006, CM014]
  - calloutType: insight
    title: Financing is part of the adoption constraint
    body: >-
      The reported withdrawal of the planned IPO after the earlier float announcement
      makes funded capex and commissioning evidence more decision-useful than headline
      project value when assessing adoption timing.
    claimRefs: [CM015, CM016]
