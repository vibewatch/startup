callouts:
  - calloutType: risk
    title: Contracted capacity is not retention
    body: >-
      More than 900 MW of company-reported contracted capacity is a demand signal, but without customer-level allocations, utilization, billing, renewal, or churn data it cannot establish durable revenue or diversified demand.
    claimRefs: [CU001, CU012, CU013]
