company:
  name: Firmus Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Firmus publicly identifies hyperscale model developers, sovereign and education users, and broader enterprise AI buyers, with more than 900 MW of contracted capacity claimed across all customers. Named Meta, OpenAI, and AI Singapore references strengthen demand validation, but public evidence does not disclose revenue by customer, utilization, renewals, churn, contract duration, or concentration.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying centers
    body: >-
      Firmus addresses several buyer groups rather than a single homogeneous customer base. An independent market profile describes enterprises, government agencies, education institutions, startups, and scaleups as target customers, while also listing Meta, OpenAI, AI Singapore, Fireworks, HTX, and Rafay among notable relationships. The strongest public proof is concentrated in AI model developers and sovereign or research workloads: Firmus itself describes dedicated-capacity agreements with Meta and OpenAI, and its website presents AI Singapore's SEA-LION work as a deployed case study. The available material identifies users and use cases, but it does not identify the contracting entity, payer, contract value, procurement cycle, or revenue contribution for each segment. Segment economics therefore remain a diligence question rather than a demonstrated feature of the customer mix.
    claimRefs: [CU002, CU003, CU005, CU009, CU010, CU016]
    tableRefs: [TU001]
  - id: adoption-and-deployment-proof
    title: Adoption and deployment proof
    body: >-
      Public adoption evidence spans contracts, construction milestones, commissioning, and executed workloads, but those stages should not be treated as interchangeable. Firmus says total contracted capacity exceeds 900 MW, yet that aggregate does not disclose how much capacity is operational, occupied, billed, or attributable to each customer. More concrete deployment signals include the Brooklyn GB300 cluster being commissioned and handed over to run customer models, an Indonesian data hall being handed over for HyperCube installation, and the operating 3 MW Media Hub site in Singapore. The AI Singapore case study adds workload evidence by reporting 200 experiments, 100 candidate models, and 99.072 PFLOP/s of total compute. These metrics demonstrate activity, not recurring revenue or customer retention.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU008, CU014, CU015]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The evidence set does not support a retention conclusion. No source provides net revenue retention, gross revenue retention, churn, renewal rates, contract terms, backlog conversion, customer-level utilization, satisfaction, or revenue concentration. The disclosed total of more than 900 MW contracted across all customers is commercially relevant, but its denominator and customer distribution are absent. A Forbes analysis frames the operator risk directly: AI-infrastructure operators carry long-duration utilization and refinancing exposure while suppliers are paid when equipment ships. An independent company profile likewise reports no public revenue or profitability figures. Investors should therefore treat named logos and capacity agreements as demand validation, not proof of durable unit economics, and request contract and cohort data before underwriting expansion.
    claimRefs: [CU001, CU011, CU012, CU013]
