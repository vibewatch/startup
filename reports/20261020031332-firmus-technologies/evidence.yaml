evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board and executive roster, committee mandates, delegated authorities, succession plans, and
      related-party policies.
    whyItMatters: >-
      Founder concentration and a capital-intensive expansion program require independently verifiable oversight and
      succession controls.
    diligencePath: >-
      Request the board pack, governance charter, committee terms, executive organization chart, succession plan, and
      director biographies.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current revenue, utilization, customer concentration, headcount, and a site-by-site operating and commissioning
      schedule.
    whyItMatters: >-
      Announced facilities and financing cannot establish current commercial scale or conversion of capital into
      revenue-producing capacity.
    diligencePath: >-
      Obtain monthly management accounts, contracted-versus-live capacity, customer concentration, utilization,
      staffing, and commissioning evidence by facility.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Fully diluted capitalization, investor allocations, preference stack, board rights, transfer restrictions, and
      project-level debt.
    whyItMatters: >-
      Round size and named investors do not show control, dilution, seniority, cash availability, or financing
      obligations.
    diligencePath: >-
      Request the signed capitalization table, financing documents, shareholder agreement, debt schedule, and
      sources-and-uses statement.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An audited bridge from total accelerator-compute spend to Firmus-addressable geography, workload, commissioned
      supply, realistic utilization, pricing, and obtainable share.
    whyItMatters: >-
      Without a denominator-consistent bridge, announced capex and megawatts cannot be converted into TAM, SAM, SOM,
      revenue, or valuation support.
    diligencePath: >-
      Obtain management's market model and reconcile it to commissioned-site data, customer contracts, utilization,
      pricing, and independent market datasets.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level pricing, contract duration, minimum commitments, cancellation rights, pipeline conversion,
      retention, and budget ownership.
    whyItMatters: Named user categories do not establish willingness to pay, durable demand, or an efficient adoption path.
    diligencePath: >-
      Review anonymized customer contracts and pipeline cohorts by segment, including buyer, payer, workload, committed
      capacity, term, and realized utilization.
    relatedQuestionRefs:
      - QM004
      - QM009
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: capacity-maturity
    missingEvidence: >-
      A site-by-site reconciliation of announced, approved, financed, under-construction, energized, installed, and
      revenue-producing capacity.
    whyItMatters: >-
      The retained megawatt figures overlap and sit at different maturity stages, so they cannot be summed or valued as
      operating supply.
    diligencePath: >-
      Request a dated project schedule with permits, grid milestones, funded capex, GPU delivery, commissioning,
      customer acceptance, and live IT load for every site.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Realized customer prices, reservation or take-or-pay terms, discounts, SLA remedies, migration costs and renewal
      outcomes across comparable workloads.
    whyItMatters: >-
      Without matched contract economics, lower infrastructure cost cannot be translated into buyer savings,
      gross-margin durability or switching cost.
    diligencePath: >-
      Obtain anonymized contracts and invoices for at least three cohorts, then benchmark identical accelerator, region,
      utilization and network assumptions against neocloud and hyperscaler quotes.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-benchmark
    missingEvidence: >-
      Independent, workload-normalized performance, uptime, energy and total-cost benchmarks spanning Firmus and named
      direct competitors.
    whyItMatters: >-
      Vendor claims and broad market taxonomies cannot establish whether Firmus's integration advantage persists after
      workload, facility and geography are normalized.
    diligencePath: >-
      Commission matched workload tests and collect audited availability, power usage effectiveness, water usage and
      delivered token-cost data by site.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited revenue, ARR where applicable, revenue recognition policy, realized pricing, backlog, and customer
      concentration.
    whyItMatters: Without these inputs, revenue scale, recurrence, concentration, and recognition quality cannot be underwritten.
    diligencePath: Obtain audited statements plus monthly revenue and bookings cohorts by product, site, and customer.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Utilization, power cost, direct service cost, gross margin, capex per MW and GPU, maintenance burden, and cohort
      payback.
    whyItMatters: These variables determine whether claimed infrastructure efficiency produces durable contribution margin.
    diligencePath: Request site-level monthly operating statements and utilization cohorts reconciled to invoices and power bills.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A transaction-level capitalization schedule distinguishing equity proceeds, committed and drawn debt, duplicate
      announcements, and currencies.
    whyItMatters: Conflicting secondary totals cannot establish capitalization, dilution, leverage, or available liquidity.
    diligencePath: Reconcile board-approved financing documents, bank statements, debt draw notices, and the current cap table.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, committed capex, debt covenants, maturity schedule, collateral, and
      downside sources and uses.
    whyItMatters: Facility size alone cannot determine runway, refinancing exposure, or the timing of the next capital raise.
    diligencePath: >-
      Obtain treasury statements, debt agreements, covenant certificates, project budgets, and a 24-month downside cash
      forecast.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Independent workload benchmarks showing tokens per watt, cost per token, GPU utilization, and comparable baseline
      methodology by deployed site.
    whyItMatters: >-
      Efficiency is the central differentiation claim, but public materials do not quantify the advantage on a
      comparable, audited basis.
    diligencePath: >-
      Obtain raw MLPerf and production workload runs, power telemetry, baseline definitions, and an independent
      engineering review.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current security certifications, privacy and sovereign-data control mapping, penetration-test summary, uptime
      history, recovery objectives, and incident-response evidence.
    whyItMatters: >-
      Regulated and sovereign workloads require control evidence beyond a statement that infrastructure supports local
      and multi-tenant operation.
    diligencePath: >-
      Request SOC 2 or ISO scope, audit exceptions, data-flow diagrams, SLA history, disaster-recovery tests, and the
      incident register.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: deployment-maturity
    missingEvidence: Site-by-site installed, commissioned, accepted, available, and utilized accelerator and megawatt counts.
    whyItMatters: >-
      The public roadmap mixes operating deployments with announced future capacity and therefore cannot establish
      delivery completion.
    diligencePath: >-
      Reconcile procurement records, commissioning certificates, customer acceptance, live telemetry, and utilization by
      site and month.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer surface or practitioner-community proxy showing API usage, software releases, engineering
      adoption, support quality, or operator experience.
    whyItMatters: >-
      No assigned source provides bottom-up validation of the software and operations layer from developers or facility
      practitioners.
    diligencePath: >-
      Review public repositories, package registries, API documentation, release notes, engineering talks, operator
      hiring, and named practitioner references.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer cohorts, NRR, GRR, churn, renewal rates, contract duration, satisfaction, and expansion revenue are not
      publicly disclosed.
    whyItMatters: >-
      Without cohort and contract evidence, named customers and workload activity cannot establish durable recurring
      demand.
    diligencePath: >-
      Request anonymized customer cohorts, signed-contract schedules, renewal and churn history, customer references,
      and monthly utilization by cohort.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      The complete customer roster, customer-level MW allocations, revenue contribution, operational status, channel
      exposure, and top-customer concentration are unavailable.
    whyItMatters: >-
      The reported portfolio total above 900 MW could still be concentrated in a small number of counterparties or
      pre-operational commitments.
    diligencePath: >-
      Obtain the contract register and a customer schedule showing counterparty, site, MW, start date, term, take-or-pay
      terms, billed revenue, utilization, renewal rights, and channel source.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability
    missingEvidence: >-
      Verified incident and outage history, security certifications, penetration-test results, uptime by site, insurance
      coverage, and remediation records.
    whyItMatters: >-
      The public pool supports architecture and policy claims but cannot quantify operational resilience, cyber
      exposure, or the financial effect of service failures.
    diligencePath: >-
      Review the security and reliability data room, certification reports, insurer loss runs, incident postmortems,
      service-level performance, and customer credits by site.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer-level contracted MW, revenue, utilization, take-or-pay terms, credit support, renewal dates, termination
      rights, and top-customer concentration.
    whyItMatters: >-
      Projected offtake cannot establish revenue durability or debt-service capacity without counterparties,
      enforceability, ramp timing, and concentration.
    diligencePath: >-
      Reconcile signed contracts to the capacity plan and financing model, then stress the top five customers for delay,
      default, non-renewal, and lower utilization.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR002
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: permitting
    missingEvidence: >-
      A complete site-by-site register of permits, appeals, environmental conditions, grid approvals, regulator
      correspondence, compliance dates, and responsible owners.
