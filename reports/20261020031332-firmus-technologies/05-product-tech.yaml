company:
  name: Firmus Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Firmus presents an integrated product stack spanning GPU cloud access, modular AI-factory
    infrastructure, liquid cooling, grid-aware orchestration, and a VAST-based data layer.
    Public evidence shows operating deployments and large announced expansion plans, but it does
    not independently quantify efficiency, reliability, security, or delivery performance.
sections:
  - id: product-and-workflow
    title: Product definition and customer workflow
    body: >-
      Firmus sells access to accelerated compute rather than AI models: the customer-facing
      surface is Firmus Cloud, while the physical delivery system is a modular AI Factory designed
      around dense GPU workloads. The company describes training, fine-tuning, inference, and
      sovereign workloads as the core jobs, with infrastructure intended to combine compute,
      networking, power, cooling, storage, and orchestration rather than asking customers to
      assemble those layers themselves. The announced NVIDIA arrangement extends that workflow
      into procurement and capacity access for AI-native, enterprise, and software-vendor
      customers. This is a vertically integrated infrastructure proposition, but no public
      service catalog, uptime commitment, deployment lead time, or workload-level pricing and
      performance schedule was found in the assigned evidence.
    claimRefs: [CE001, CE002, CE003, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture-and-dependencies
    title: Architecture and critical dependencies
    body: >-
      The disclosed architecture joins Firmus's HyperCube liquid-cooled platform to NVIDIA's DSX
      blueprint and accelerator roadmap, while VAST AI OS is the selected data layer. Firmus also
      describes a Model-to-Grid control framework linking model behavior, GPU performance, thermal
      conditions, energy pricing, and grid signals. That design is specific enough to identify
      major dependencies: NVIDIA for accelerators and reference architecture, VAST for data
      movement and multi-tenant storage, local grids for power, and specialist cooling operations.
      The integration may let layers evolve independently, but the evidence consists chiefly of
      company and supplier descriptions; interface boundaries, failover design, telemetry
      accuracy, and measured end-to-end bottlenecks are not publicly documented.
    claimRefs: [CE005, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Maturity, deployment, and roadmap
    body: >-
      The product is beyond a concept-stage architecture: Firmus lists Singapore retrofits and
      prior platform milestones, while VAST and TechEDT report active AI-factory deployments at
      thousands-of-GPU scale. The June 2026 Batam announcement adds a 360 MW campus and an
      agreement covering up to 170,000 NVIDIA accelerators across 2027 and 2028, but these are
      announced capacity and roadmap figures, not proof that the full estate is installed,
      accepted, or utilized. A low-reputation independent article also characterizes Firmus as
      relatively early in its evolution as a data-center operator after its cryptocurrency-mining
      origins. Underwriting should therefore separate operating sites from contracted or planned
      capacity and require site-by-site commissioning, acceptance, utilization, and incident data.
    claimRefs: [CE004, CE006, CE016]
  - id: differentiation-trust-and-risk
    title: Differentiation, trust, and technical risk
    body: >-
      Firmus's differentiation thesis is systems-level efficiency: liquid cooling, closed-loop
      water design, dense modular infrastructure, silicon-aware orchestration, and responsiveness
      to grid conditions. The Australian independently explains why those features matter, but it
      also identifies operational complexity, scarce specialist technicians, construction delays,
      supply constraints, and changing technology standards as execution risks. Forbes adds that
      operators retain long-duration utilization and refinancing risk even when suppliers are paid
      at delivery. Public material refers to in-country data control and secure multi-tenant
      workloads, yet the reviewed sources do not disclose certifications, audit reports, privacy
      controls, uptime history, recovery objectives, or incident response. The technical thesis is
      plausible and differentiated; the control environment and quantified advantage remain
      diligence items rather than verified strengths.
    claimRefs: [CE011, CE012, CE013, CE014, CE015]
callouts:
  - calloutType: risk
    title: Roadmap scale is not operating proof
    body: >-
      Treat announced megawatts and accelerator counts as deployment targets until Firmus supplies
      commissioning, acceptance, utilization, reliability, and customer workload evidence by site.
    claimRefs: [CE004, CE006, CE016]
