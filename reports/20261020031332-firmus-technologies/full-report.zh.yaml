    type: journey-map
    summary: 公开证据追踪了从资格评估到工作负载执行的过程，但续约和扩张情况仍未披露。
    data:
      nodes:
        - label: 1. 工作负载匹配
          detail: 已描述企业、政府、教育、初创公司和规模化初创公司的需求，但无法获得分群数量。
          touchpoints:
            - AI Factory
            - Firmus Cloud
        - label: 2. 容量协议
          detail: 专用容量协议以及所有客户合计超过 900 MW 的签约容量构成需求信号。
          touchpoints:
            - Contracted MW
            - Dedicated compute
        - label: 3. 站点准备
          detail: 在交付和安装算力前，先准备数据大厅和 HyperCube 系统。
          touchpoints:
            - Data hall
            - HyperCube
        - label: 4. 调试并交付
          detail: 据报道，Brooklyn GB300 集群已安装、调试并交付，用于运行客户模型。
          touchpoints:
            - Commissioning
            - Customer handover
        - label: 5. 执行工作负载
          detail: SEA-LION 案例报告了实验、候选模型和交付的算力总量。
          touchpoints:
            - Experiments
            - Model evaluation
        - label: 6. 续约与扩张
          detail: 公开资料没有客户群、续约、流失、利用率或客户级扩张数据来闭合这一阶段。
          touchpoints:
            - Renewal data unavailable
            - Expansion data unavailable
    approximationNotes: 阶段顺序仅用于分析；不代表转化率、各阶段客户群规模相等，也不代表每个点名客户都完成了所有阶段。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU009
      - CU012
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对投资论点影响最大的六项风险，从发生可能性、影响、缓释成熟度和剩余严重性四个维度进行定性矩阵分析。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 风险已发生或相关流程当前存在的证据，不是统计概率。
        - id: impact
          label: 影响
          detail: 对交付、流动性或投资价值的潜在影响。
        - id: mitigation
          label: 缓释成熟度
          detail: 截至本次运行日期、已有公开证据支持的成熟度。
        - id: residual
          label: 剩余严重性
          detail: 纳入已披露缓释措施后的分析师排序。
      rows:
        - label: 多站点资本执行
          note: 据报道，先前计划估算为 A$73.3 billion，并有 US$10 billion 债务融资额度。
          values:
            - label: 中高
            - label: 高
            - label: 部分
            - label: 高
        - label: 利用率与再融资
          note: 供应商获得付款后，运营方仍承担占用率和再融资风险。
          values:
            - label: 不确定
            - label: 高
            - label: 公开证明有限
            - label: 高
        - label: 许可与电网接入
          note: 据报道，相关事项存在进行中的申诉、信息请求和一项尚未决定的能源申请。
          values:
            - label: 流程进行中
            - label: 高
            - label: 部分
            - label: 高
        - label: NVIDIA 集中度
          note: 供应商、投资人、平台和信用支持角色相互重叠。
          values:
            - label: 结构性
            - label: 高
            - label: 合同层面
            - label: 中高
        - label: 冷却与环境表现
          note: 资料池中没有政策和用水声明的独立运营验证。
          values:
            - label: 不确定
            - label: 高
            - label: 政策阶段
            - label: 中高
        - label: 资本市场执行
          note: 2026 年 10 月的 ASX 上市已撤回，公司转而寻求私募融资。
          values:
            - label: 当前
            - label: 高
            - label: 正在寻求替代融资
            - label: 高
    approximationNotes: 各类别是基于所引事实的分析师定性判断，不是公司评级、概率或量化损失模型。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 从规模目标到决策门槛的推荐逻辑
    type: flow
    summary: 战略资本和开发目标支持持续跟踪，但杠杆和缺失的运营证据不支持无条件买入。
    data:
      nodes:
        - id: reported-scale
          label: 据报道的规模目标
          detail: Southgate 的目标是到 2028 年达到最高 1.6 GW。
        - id: capital-validation
          label: 资本验证
          detail: $2 billion 轮融资意味着投后估值高于 $10.5 billion。
        - id: leverage
          label: 杠杆敞口
          detail: 第三方来源报告存在 $10 billion 债务融资额度。
        - id: evidence-gap
          label: 缺失的估值分母
          detail: 无法获得经审计的经营经济性、利用率、集中度和担保条款。
        - id: diligence-gates
          label: 尽调门槛
          detail: 核实合同、站点经济性、契约、股权结构表、优先股堆叠和 IPO 申报文件。
        - id: recommendation
          label: 持续跟踪 / 继续研究
          detail: 只有在价格可支撑且运营证据得到核实后，才重新评估。
    approximationNotes: 该流程为定性判断，不为未披露的运营输入赋予概率、转化率或价值。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV012
      - CV013
