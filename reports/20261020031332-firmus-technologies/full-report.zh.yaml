            title: 一体化是最清晰的差异化
            body: Firmus 声称掌控计算、网络、电力、冷却和电网编排，由此形成了更完整的成本与主权方案，而更窄的 GPU 云或组件供应商未必能匹敌。
            calloutType: strength
