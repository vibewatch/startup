  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 收入支撑的产能占用、正向单位经济性、债务偿付有保障，且 IPO 披露经审计
        - 只有这些里程碑实现后，高于据报道 $10.5 billion 的估值才具备可验证性
        - 建设成本或需求不及预期会抹去经营杠杆
        - 核实从已签约到已通电的转化，以及经审计现金生成
      - - 基准
        - 资本获取和建设继续推进，但经营经济性仍未公开
        - 要求相对 8 月估值有明显折价、分阶段投入资本或保护性条款
        - 融资进展掩盖了利用率低或客户集中的问题
        - 站点级利用率、利润率和客户数据仍不可得
      - - 悲观
        - 利用率不足、再融资压力和基础设施估值倍数压缩
        - 4 月的 $5.5 billion 估值可作为下行参考，约比 $10.5 billion 低 48%，但不是底线
        - 契约压力、稀释或商业化延迟
        - 占用率低、未达成通电里程碑或再融资条款不利
    notes: 约 48% 的下行参考值根据据报道的 $5.5 billion 和 $10.5 billion 估值计算；由于经营输入缺失，未赋予情景数值概率或内在估值区间。
    claimRefs:
      - CV002
      - CV004
      - CV008
      - CV011
      - CV013
      - CV014
