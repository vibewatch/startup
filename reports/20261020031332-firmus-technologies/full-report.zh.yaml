      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              报道中的目标用户覆盖企业、教育、政府、初创公司、成长型公司、AI
              实验室和超大规模云厂商，但它们的采购方式不同。政府和受监管企业是最清晰的主权计算客群：技术负责人和采购团队可能看重本国工作负载控制，最终则由财务部门或机构预算支付产能费用。AI
              实验室和超大规模云厂商更可能围绕已交付 GPU、电力、网络和投产里程碑谈判大额产能承诺。中小企业和研究用户可能消费 Firmus
              Cloud，而不是签下整座设施。采用取决于工作负载评估、安全与主权审查、基准验证、商业承诺、站点通电和生产迁移。公开证据列出了广泛用户群，但未披露预算归属、定价、最低承诺或各细分市场的合同转化。
            claimRefs:
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              加速器计算、主权部署和受限的区域电力需求是核心增长驱动。Firmus 还声称可降低电网负荷、用水、占地和建设成本，若能独立证明，可能改善买方 ROI。但执行证据更不宽容：拟议的 52 MW Wesley Vale
              项目面临完整提案截止期，更广泛的塔斯马尼亚管线取决于对 444 MW 长期能源申请的评估，当地团体还提出了用水和噪音担忧。资本负担同样关键，因为全国已宣布投资额和运营产能并不等价。Australian
              Financial Review 报道的 10 月 6 日 IPO 计划，被 The Urban Developer 于 10 月 9
              日报道的撤回所取代，说明融资渠道变化可能快于实体项目管线。因此，估值应跟踪已投产产能、签约收入、利用率和已落实资本开支，而不是项目总值或计划兆瓦数。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 项目管线不是可服务市场
            body: Firmus 宣布的吉瓦数和投资额衡量的是计划供给与资本雄心，不能证明已签约需求、已投产产能、利用率、收入或站得住脚的可获得市场份额。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: callout
            title: 融资也是采用约束的一部分
            body: 计划 IPO 在早先宣布上市后被报道撤回，因此评估采用时，已落实资本开支和投产证据比项目总值更有决策价值。
            calloutType: insight
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只是 GPU 云厂商名单。Tracxn 将 CoreWeave、Together AI、FluidStack、Crusoe 及若干分布式计算平台列入 Firmus 的同行；另一份市场画像则将
              Submer、LiquidStack 和 KyotoCooling 列为专业基础设施替代方案。买方还可以从 AWS、Microsoft Azure、Google Cloud 或 Oracle
              采购，使用传统数据中心主机并另行采购加速器，或自行建设。这些选择解决的是同一任务的不同部分：以可接受的电力、主权、部署速度和单位成本获得可靠 AI 计算。因此，Firmus
              同时争夺云工作负载和实体基础设施层的控制权。Tracxn 报道的 363 家活跃竞争者凸显了市场碎片化，但其分类很宽泛，不能理解为 363 家直接可比的 AI 工厂运营商。
            claimRefs:
              - CP002
              - CP003
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
      - number: '3.2'
        title: 能力、分销与锁定
        blocks:
          - type: paragraph
            body: >-
              Firmus 声称的差异化在于跨计算、网络、电力、冷却和电网编排的垂直协同设计，以及 APAC
              主权计算版图。相比单独拼接主机、冷却供应商、硬件供应商和编排层，这可能降低协调成本；当产能、液冷设计、电力接入和长期设施被捆绑时，也可能加深锁定，迁移不再只是云软件决策。但同一体化也增加了执行暴露。报道显示，计划中的
              CDC 合作在只建成一座 42 MW 中心后终止，说明即使宣布了大型全国扩张，合作伙伴准入和交付安排仍会改变。超大规模云厂商保有分销和生态优势，而专业供应商让成熟买方只采购冷却或设施层，不必采用 Firmus
              的全栈方案。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
