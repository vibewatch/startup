      - number: '3.3'
        title: 商业证明与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              资本渠道是竞争资产，但不能证明利用率或持久利润率。Firmus 称一项 US$10 billion 债务融资将支持其到 2028 年部署最高 1.6 GW；Tracxn 则称，在其宽泛的竞争者群体中，Firmus
              按累计融资额排名第二。但 Forbes 指出该品类的结构性不对称：设备供应商在硬件发货时收款，而运营商承担利用率和再融资风险。ABC 也提醒，在招股说明书提交前，IPO 流传数字仍属推测。指定证据中没有
              Firmus 价目表、实际单位价格、迁移条款、服务级别救济或标准化的竞争合同对比。因此，在审阅合同、利用率队列和已交付站点经济性之前，投资判断应把能源效率、价格优势和客户锁定视为可验证假设，而不是已证明的护城河。
            claimRefs:
