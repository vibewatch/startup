      - number: '1.3'
        title: 融资轨迹与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Firmus 宣布 2026 年 8 月完成全额认购的 USD 2 billion 战略股权融资，并称交易将投后估值推高至 USD 10.5 billion 以上。该融资之前，公司披露的进展包括早期
              HyperCube 研究、可再生能源供电的数据大厅和一体化计算部署、新加坡主权 AI 项目启动以及 Project Southgate。2026 年 10 月撤回 IPO 是更尖锐的当前信号。Firmus
              称拟议条款未反映其长期前景，并将转向私募资本；独立报道则提到需求疲弱、估值阻力和未来资金需求担忧。撤回并未取消项目，但撤掉了计划中的公开股权融资路径，使扩张依赖替代资本。因此，里程碑记录一方面显示真实的技术和募资进展，另一方面也显示验证需求正在扩大：管理层应在一份可审计的排期中核对运营产能、建设里程碑、已承诺融资和投产日期。
