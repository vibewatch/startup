  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式可见，但变现不可见
        blocks:
          - type: paragraph
            body: >-
              Firmus 展示了两个相互关联的商业界面：Firmus Cloud 让客户访问 GPU 基础设施，Firmus AI Factories
              则由公司设计并运营为模块化、垂直整合的基础设施。这支持一个涵盖云计算和专用基础设施的合理产能与服务收入模式，但保留的官方页面没有公布标价、合同计量单位、折扣、收入确认条款或实际费率。3 MW Media Hub
              部署和 SEA-LION 工作负载指标说明实体产能和计算已经交付，但二者都不能证明收入或毛利。下方桥接图因此是机制图，不是量化预测。
