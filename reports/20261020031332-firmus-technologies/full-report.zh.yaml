chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Firmus Grid Limited 以 Firmus Technologies 名义经营，自称是一家整合型 AI Factory Platform 公司。其运营方案覆盖实体 AI 工厂、GPU
              云产能、冷却、电力管理和感知电网的软件，而不是传统的纯托管模式。公司称其于 2019 年在澳大利亚注册，2026 年 8 月公告将总部列为悉尼。10
              月的独立报道描述了一个分布于澳大利亚、新加坡、印度尼西亚和马来西亚的七座工厂组合，但其中只有两座在运营，五座仍在开发。这一区分至关重要：已宣布或已签约产能不等于已投产、可产生收入的产能。本报告审阅的公开来源未披露当前收入、利用率、客户集中度、员工人数或逐地点完整运营排期，因此这些指标仍是明确的尽调缺口，而不是可推断的封面指标。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 领导层、治理与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Firmus 由联席首席执行官 Oliver Curtis 和 Tim Rosenfield
              领导。现有证据显示创始人集中度较高，但未列出完整董事会、委员会架构、独立董事或继任机制。这一缺失值得关注：平台正进行资本密集型、多国扩张，同时需要反复获得大规模股权和债务资金。Curtis
              此前因内幕交易被定罪并服刑一年，这是治理尽调中的重要事实，但不能证明当前存在不当行为；投资者应核实此后采用的控制措施、授权边界、关联方政策和董事会监督。战略支持力度很大：8 月融资包括
              Coatue、NVIDIA、Blackstone 管理的基金和 Jane
              Street。它们的参与证明了公司可接触专业资本和生态关系，但投资者声望或融资规模都不能替代股权结构表条款、锁定期、清算优先权或项目层面融资披露。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
