      - number: '4.2'
        title: 资本市场势头超过运营披露
        blocks:
          - type: paragraph
            body: >-
              独立报道普遍指向 2026 年 8 月 $2 billion 股权融资，投后估值超过 $10.5 billion；Forbes 报道此前一年筹得股权资金超过 $3 billion。同一证据集还报告 2026 年
              2 月有一项 $10 billion 债务融资。这些是融资事件，不是收入、ARR、已入账积压订单或可用现金。二手数据库对总资本和轮次也存在重大分歧：InforCapital 报告四轮合计 $12.8
              billion，而 Silicon Valley Investclub 报告九条记录合计至少 $25.7 billion，并明显重复了若干融资。逐笔交易披露比任一总额更有决策价值。
            claimRefs:
              - CI004
