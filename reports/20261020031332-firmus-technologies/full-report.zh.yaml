      - number: '4.3'
        title: 利用率与融资结构主导单位经济性
        blocks:
          - type: paragraph
            body: >-
              AI 工厂需要先投入土地、电网接入、冷却和稀缺 GPU 硬件。The Australian 指出回报取决于机器保持忙碌，而需求可能不均衡；Forbes
              同样认为，设备供应商在硬件发货时收款，运营商却承担利用率和再融资风险。Firmus 声称建设成本和电网负荷更低，但公开证据未量化每 MW 资本开支、每 GPU
              资本开支、交付电力成本、维护负担、毛利率或回本期。一项据报道的 $10 billion
              融资额度可能提供资金能力，但若没有已提款余额、契约、到期日、利息成本、项目层面担保和已承诺租户经济性，就不能转化为可靠的现金跑道估算。
