  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Firmus 应按垂直整合的 AI 基础设施运营商来评估：它把高密度 GPU
              计算、冷却、网络、电力接入和云接入层组合在一起。除非支出明确转向加速器密集型训练或推理，否则这一边界不包括规模更大的普通公有云、企业托管和通用数据中心地产。现状不只是另一家新云厂商；成熟买家还可以预订超大规模云厂商的
              GPU 实例、托管自有系统或内部建设。Firmus 更窄的切入口是主权化、区域部署的产能，在这里数据本地性、部署速度和能源效率更重要。其官网描述了模块化 AI 工厂和新加坡 3 MW
              改造项目，但效率优势仍属于公司声明，尚无公开的每 token 成本、利用率或独立标准化电力数据。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持干净的 TAM/SAM/SOM 计算。一篇低置信度市场文章引用 2026 年澳大利亚云支出 A$33.6 billion 和 AI 专用云基础设施支出 A$946
              million，但未公开底层数据集或方法。公司相关报道则描述了一个计划中的澳大利亚五站点、1.6 GW 项目，到 2028 年成本最高可达 A$73.3 billion；其他报道重复了 1.6 GW
              目标，能佐证已宣布的范围，但不能证明需求、利用率、收入或经济性。因此，这些视角是背景，而非可相加的市场估算。可投资的规模测算任务，是核对已签约、已获批、在建、已通电和已产生收入的产能，再套用现实的利用率和定价。公开来源没有提供这座桥梁。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
