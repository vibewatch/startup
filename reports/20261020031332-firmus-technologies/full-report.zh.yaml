      - number: '4.4'
        title: 财务结论与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是高资本、基础设施驱动的增长故事，而不是已证明的高质量收入故事。Firmus
              有可信的已部署计算和机构资本渠道证据，但当前收入、毛利率、利用率、客户集中度、现金、烧钱和债务义务仍属私有信息。低质量二手页面增加了噪音：一处将 Firmus 估为 $5.9 billion，另一篇 AI
              生成文章则报道了不同的 A$6 billion
              融资快照。因此，投资判断应锚定管理层提供的合同、账单和利用率队列、站点级贡献利润以及资金来源与用途表。在这些材料将融资能力与运营现金创造对上之前，收入质量和资本充足性仍是重大缺口。
