              Factory。公司将训练、微调、推理和主权工作负载描述为核心任务，基础设施拟把计算、网络、电力、冷却、存储和编排结合起来，不让客户自行拼装这些层。已宣布的 NVIDIA 安排把工作流延伸到面向 AI
              原生企业和软件供应商客户的采购与产能获取。但这是一项垂直整合基础设施方案，指定证据中没有找到公开的服务目录、正常运行时间承诺、部署周期或工作负载级定价和性能排期。
