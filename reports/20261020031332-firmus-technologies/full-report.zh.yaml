  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 论点
      - 证据
      - 哪些信息会改变判断
    rows:
      - - 投资论点
        - 大额战略股权支持
        - 据报道，公司以高于 $10.5 billion 的估值完成了 $2 billion 轮融资
        - 核实已到账现金、投资人权利及剩余承诺
      - - 投资论点
        - 大规模开发目标
        - 据报道，Southgate 计划到 2028 年达到最高 1.6 GW
        - 分别核实已通电、已签约和处于建设阶段的容量
      - - 投资论点
        - 已有一定运营足迹
        - Firmus 将 Loyang 和 Media Hub 列为新加坡部署项目
        - 获取站点级利用率、收入和服务水平历史
      - - 反投资论点
        - 估值上涨快于已披露的经营表现
        - 据报道，估值从 4 月的 $5.5 billion 上升至 2026 年 8 月的 $10.5 billion 以上
        - 经审计的增长和利润率证据可能支撑这次重估
      - - 反投资论点
        - 杠杆放大交付风险
        - Forbes 和 SetterVC 报称存在 $10 billion 债务融资额度
        - 将契约和到期日与已签约现金流匹配
      - - 反投资论点
        - 核心估值分母缺失
        - 已审阅来源未提供经审计收入、现金流、利用率、客户集中度和优先权信息
        - 提供完整的财务、合同、债务及资本结构数据室
    notes: 关于公司平台和部署的表述由公司发布；融资和风险观察均归因于所列第三方来源。
