  topStrengths:
    - 垂直整合的 AI 工厂与 GPU 云栈覆盖计算、网络、存储、冷却、电力和电网编排。
    - 一轮 USD 2 billion 股权融资，以及据报道规模达 USD 10 billion 的债务额度，显示公司获得战略资本和机构资本的能力非同寻常。
    - 已点名的 Meta 和 OpenAI 协议，加上公司报告的超过 900 MW 合同容量，构成了有分量的需求信号。
  topRisks:
    - 多站点建设、许可、电网接入和调试延误，可能进一步放大平台的高资本强度。
    - 经审计收入、利用率、利润率、现金消耗、现金跑道和站点级单位经济性均未公开披露。
    - 庞大的融资需求和未成功的 IPO 进程，增加了再融资、稀释和资本可获得性风险。
    - 客户集中度、合同保障、与 NVIDIA 绑定的供应商集中度以及治理控制仍披露不足。
  unresolvedGaps:
    - 按运营站点取得经审计收入、现金流、利用率、单位经济性、现金跑道和客户集中度数据。
    - 将合同容量、已融资容量、在建容量、已调试容量和产收容量，与里程碑日期及验收证据逐项核对。
    - 审阅完全稀释后的股权结构表、优先股堆叠、投资人权利、项目层面债务、契约、到期日、抵押品和融资瀑布。
    - 核实客户合同期限、照付不议保障、续约和终止权利、定价、流失率以及客户层面的容量分配。
    - 取得完整的许可和电网审批登记册，以及独立的安全性、可靠性、能源和水资源绩效证据。
