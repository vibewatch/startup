              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The freshest independent reporting in the assigned pool says Firmus received commitments for a $2 billion
              equity round at a post-money valuation above $10.5 billion in August 2026. GlobalData's Verdict report
              also says the transaction brought equity raised over the preceding year to more than $3 billion. Forbes
              places the April 2026 mark at $5.5 billion, implying that the headline valuation roughly doubled in four
              months. SetterVC independently displays the April and August marks, but expressly warns that its funding
              and valuation data are estimates. These marks establish a financing trajectory, not intrinsic value: none
              supplies a revenue multiple, cash-flow yield, or audited balance-sheet bridge.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on access to large pools of equity and debt, a stated 1.6 GW Southgate ambition, and a
              vertically integrated platform that Firmus says reduces infrastructure resource requirements. The official
              site also identifies two Singapore deployments, which is more substantive than a purely conceptual
              development story. The anti-thesis is stronger at the present price: Forbes highlights that operators
              retain utilization and refinancing risk after equipment suppliers are paid, and the reviewed evidence
              reports a $10 billion debt facility. Most importantly, the eight assigned sources do not provide audited
              revenue, EBITDA, cash flow, utilization, customer concentration, or preference terms. That missing
              denominator prevents a defensible public-market or project-finance valuation.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should therefore use milestones rather than false precision. A bull case requires
              contracted demand to convert into revenue-backed occupancy, positive unit economics, and debt service
              coverage, with an exchange filing providing governance and audited financials. The base case assumes
              capital access and construction continue while economics remain private; under that condition, no public
              evidence supports paying the August headline mark without a material discount, staged funding, or
              protective terms. The bear case combines utilization shortfall, refinancing pressure, and multiple
              compression. The reported April $5.5 billion mark is a useful downside reference, about 48% below $10.5
              billion, but it is not a valuation floor or intrinsic-value estimate.
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Decision, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track/research-more, with medium-low confidence and high risk. The financing roster
              and deployment ambition justify continued work, but they do not answer whether a new investor can earn an
              acceptable risk-adjusted return from an entry above $10.5 billion. Public materials discuss an IPO
              ambition or timetable, yet the assigned evidence includes neither an exchange filing nor a
              completed-listing notice. The decision should change only after management supplies audited financials,
              site-level contracted versus energized capacity, utilization and customer concentration, debt covenants, a
              fully diluted cap table, liquidation preferences, and a normalized campus milestone and capex schedule.
              Failure to provide those items, or evidence of weak occupancy or stressed refinancing, is a thesis-break
              signal.
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Continue diligence, but do not underwrite a new investment at the reported mark until operating cash
              generation, capital structure, and investor protections are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
          - type: callout
            title: Thesis-break conditions
            body: >-
              Stop or reprice if management cannot reconcile contracted, energized, and utilized capacity; if debt terms
              are mismatched to cash flows; or if a listing process does not deliver audited disclosure.
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV013
