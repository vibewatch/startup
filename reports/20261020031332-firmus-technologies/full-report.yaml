              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic capital access is demonstrated
            body: >-
              A fully subscribed USD 2 billion round with Coatue, NVIDIA, Blackstone, and Jane Street is meaningful
              financing validation, although terms and deployment timing remain undisclosed.
            calloutType: strength
            claimRefs:
