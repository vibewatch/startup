      - number: '6.2'
        title: Adoption and deployment proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence spans contracts, construction milestones, commissioning, and executed workloads,
              but those stages should not be treated as interchangeable. Firmus says total contracted capacity exceeds
              900 MW, yet that aggregate does not disclose how much capacity is operational, occupied, billed, or
              attributable to each customer. More concrete deployment signals include the Brooklyn GB300 cluster being
              commissioned and handed over to run customer models, an Indonesian data hall being handed over for
              HyperCube installation, and the operating 3 MW Media Hub site in Singapore. The AI Singapore case study
              adds workload evidence by reporting 200 experiments, 100 candidate models, and 99.072 PFLOP/s of total
              compute. These metrics demonstrate activity, not recurring revenue or customer retention.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
