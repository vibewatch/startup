        - id: likelihood
          label: Likelihood
          detail: Evidence of occurrence or current process, not a statistical probability.
        - id: impact
          label: Impact
          detail: Potential effect on delivery, liquidity, or investment value.
        - id: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced maturity as of the run date.
        - id: residual
          label: Residual severity
          detail: Analyst ranking after the disclosed mitigation.
