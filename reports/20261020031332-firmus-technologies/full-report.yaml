        min: 1
        max: 5
        low: Narrow component
        high: End-to-end platform
        scale: ordinal
        description: Analyst-assigned 1-5 score based only on product scope described in retained sources.
      yAxis:
        label: Observed delivery evidence
        min: 1
        max: 5
        low: Limited retained proof
        high: Broad retained proof
        scale: ordinal
        description: Analyst-assigned 1-5 score based on operational status and scale evidence in retained sources.
      points:
        - label: Firmus
          x: 5
          'y': 3
          detail: >-
            Broad company-claimed integration; two operating sites reported, with delivery pivots and multiple sites
            still planned.
        - label: CoreWeave
          x: 2
          'y': 4
          detail: Public focused GPU-cloud peer in Tracxn; no full facility-integration comparison retained.
        - label: FluidStack
          x: 2
          'y': 3
          detail: Managed GPU infrastructure peer with significant reported funding but limited retained operating detail.
        - label: Crusoe
          x: 3
          'y': 3
          detail: Combined AI data-centre and cloud scope; retained evidence does not support a finer delivery comparison.
        - label: Hyperscalers
          x: 4
          'y': 5
          detail: >-
            Broad public cloud incumbents with distribution advantage; point is categorical rather than
            company-specific.
        - label: Cooling specialists
