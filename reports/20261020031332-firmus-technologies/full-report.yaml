              - CU007
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU009
              - CU012
              - CU015
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The evidence set does not support a retention conclusion. No source provides net revenue retention, gross
              revenue retention, churn, renewal rates, contract terms, backlog conversion, customer-level utilization,
              satisfaction, or revenue concentration. The disclosed total of more than 900 MW contracted across all
              customers is commercially relevant, but its denominator and customer distribution are absent. A Forbes
              analysis frames the operator risk directly: AI-infrastructure operators carry long-duration utilization
              and refinancing exposure while suppliers are paid when equipment ships. An independent company profile
              likewise reports no public revenue or profitability figures. Investors should therefore treat named logos
              and capacity agreements as demand validation, not proof of durable unit economics, and request contract
              and cohort data before underwriting expansion.
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted capacity is not retention
            body: >-
              More than 900 MW of company-reported contracted capacity is a demand signal, but without customer-level
              allocations, utilization, billing, renewal, or churn data it cannot establish durable revenue or
              diversified demand.
            calloutType: risk
            claimRefs:
              - CU001
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk prioritization and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is capital and delivery execution. An April 2026 report put the then-planned
              national program at A$73.3 billion, while three reviewed sources describe a US$10 billion debt facility;
              those figures are financing scale, not proof that all capital remains available or that the revised
              project portfolio is fully funded. The operating model also leaves Firmus carrying utilization and
              refinancing risk after equipment suppliers are paid. That asymmetry matters because a later profile
              reports that the proposed CDC-linked 1.6 GW rollout would not proceed after roughly 42 MW had been
              deployed. The investment implication is therefore to underwrite each campus and committed customer
              separately rather than treating announced aggregate capacity as one de-risked portfolio.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Regulatory, grid, and environmental execution
        blocks:
          - type: paragraph
            body: >-
              Site delivery is exposed to approval sequencing and power availability. The reviewed profile says Bell
              Bay's approval is under appeal, Wesley Vale required additional information before a major-project
              decision, and Hydro Tasmania had not decided on a request associated with about 444 MW across three
              Tasmanian sites. These are identifiable process dependencies, not evidence that approval or supply will
              fail, but delay at any one can shift energization, revenue, and financing schedules. Firmus has published
              energy and water commitments, including dry-mode cooling and future reporting. Those measures improve
              mitigation maturity, yet the assigned evidence does not provide independently audited outcomes across
              operating and planned sites. Approval documents, executed grid contracts, and measured water and power
              data remain the decisive diligence materials.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Operational, financial, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Firmus is vertically ambitious: it says its platform spans cooling systems through grid orchestration
              software, while NVIDIA is reported as both an investor and the primary chip supplier. A company-issued
              syndicated announcement describes a partnership through 2034, a 360 MW Batam campus, revenue sharing, and
              credit support, and projects US$25 billion to US$30 billion of six-year receipts from committed offtake.
              These arrangements can support procurement and demand, but they also concentrate technology roadmap,
              counterparty, and contract-performance exposure. The withdrawal of the planned ASX float and pursuit of
              private funding further raise the importance of funding terms, covenant headroom, and milestone-linked
              draw availability. None of funding raised, debt capacity, or projected offtake should be treated as
              unrestricted cash or realized revenue.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
      - number: '7.4'
        title: Monitoring indicators, kill criteria, and diligence path
        blocks:
          - type: paragraph
            body: >-
              The following are proposed investor controls, not company-published thresholds. Pause underwriting if a
              core campus lacks final, unappealed approvals and binding power arrangements sufficiently ahead of its
              contracted delivery date; if committed funding and permitted debt draws do not cover remaining
              construction plus contingency; or if customer contracts lack creditworthy, enforceable take-or-pay
              protections. Treat a material deterioration in NVIDIA supply, credit support, or platform economics as a
              dependency trigger. Require independent evidence for uptime, security incidents, insurance, water, and
              power performance before accepting operational mitigation as mature. A thesis break would be simultaneous
              slippage in site energization, financing, and contracted demand, because that combination would turn
              schedule risk into liquidity and refinancing risk rather than a recoverable construction delay.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break combination
            body: >-
              Concurrent site delay, weaker contracted demand, and constrained financing would convert a construction
              schedule miss into a liquidity and refinancing problem.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: callout
            title: Evidence boundary
            body: >-
              Company policies and partnership announcements show intended mitigation, but they do not independently
              verify uptime, security, utilization, customer concentration, or cash availability.
            calloutType: assumption
            claimRefs:
              - CR002
              - CR005
