        - id: capacity
          label: Available compute capacity
          detail: Firmus Cloud and dedicated facilities expose GPUs and infrastructure to customers.
        - id: workloads
          label: Customer workload activity
          detail: Experiments, model development, training, and inference consume capacity.
        - id: revenue
          label: Recognized revenue
          detail: Price, contract unit, billing basis, and recognition policy are not public.
