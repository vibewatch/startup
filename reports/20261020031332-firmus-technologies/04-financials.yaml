    approximationNotes: "The sequence is an evidence-backed mechanism map only; it contains no forecast, conversion rate, or assumed monetary value."
    claimRefs: [CI001, CI002, CI006, CI012, CI013]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      Reported equity rounds and a debt-facility ceiling do not establish unrestricted cash,
      drawn debt, construction commitments, monthly burn, or covenant headroom.
    claimRefs: [CI004, CI006, CI016]
  - calloutType: recommendation
    title: Gate underwriting on a site-level economics pack
    body: >-
      Require contracts, billing cohorts, utilization, contribution margin, capex, debt terms,
      and downside sources-and-uses before assigning a revenue-quality or runway conclusion.
    claimRefs: [CI009, CI012, CI013, CI016]
