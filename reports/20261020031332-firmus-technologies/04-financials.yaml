  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Firmus Cloud, "Customer access to GPU infrastructure", "GPU-hour or contract capacity; undisclosed", "Product and workload delivery disclosed; revenue unavailable", "Cannot assess recurring share or take-or-pay protection", "Revenue by product, bookings, backlog, contract duration, and renewal data"]
      - [Dedicated AI Factory capacity, "Design and operation of modular high-density facilities", "MW, rack, GPU, or reserved capacity; undisclosed", "Facilities and deployment model disclosed; contract economics unavailable", "Potentially contracted infrastructure revenue, but tenancy terms are private", "Executed customer contracts, committed MW, commencement dates, and termination rights"]
      - [Sovereign and enterprise infrastructure, "Regional or dedicated AI-compute deployment", "Project or managed-service fee; undisclosed", "SEA-LION usage evidence exists without a disclosed commercial value", "Delivery proof does not establish pricing or margin", "Customer invoices, project scope, recognized revenue, and direct service costs"]
      - [Infrastructure efficiency layer, "Cooling, power, grid orchestration, and integrated operations", "Bundled or separately charged; undisclosed", "Official materials describe capability, not monetization", "Could improve cost position but is not a separately verified stream", "Pricing architecture, transfer pricing, attach rate, and savings retained by Firmus"]
    notes: "Public source review as of 2026-10-20; units and commercial terms are marked undisclosed rather than estimated, and deployment metrics are not treated as revenue."
    claimRefs: [CI001, CI002, CI003, CI009, CI014]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Offer, Price or contract unit, List versus realized, Discounts or unknowns, Underwriting implication]
    rows:
      - [Firmus Cloud, "Not publicly disclosed", "Neither list nor realized pricing found", "Term, minimum spend, utilization charge, and discounting unknown", "Cannot estimate revenue per GPU-hour or compare price realization"]
      - [Dedicated AI Factory, "Not publicly disclosed", "No public site-level tariff or capacity contract", "Tenor, escalation, take-or-pay, pass-throughs, and termination rights unknown", "Revenue durability and project-finance coverage cannot be tested"]
      - [Sovereign or enterprise deployment, "Not publicly disclosed", "No public project fee or managed-service schedule", "Hardware resale, implementation, and recurring-service mix unknown", "Recognition timing and gross-margin mix remain unavailable"]
    notes: "The retained official sources describe products and deployments but publish no list pricing; null pricing is an evidence gap, not a zero value."
    claimRefs: [CI001, CI002, CI009]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue and ARR, "Unavailable", High, "Sets scale and recurring mix", "Audited monthly revenue bridge by product, site, and customer"]
      - [Gross margin, "Unavailable", High, "Tests whether efficiency claims translate into economics", "Site and product gross margin with power, cooling, hardware depreciation, and support allocation"]
      - [Utilization, "Unavailable", High, "Primary operating leverage and downside variable", "Available versus contracted versus billed GPU-hours by cohort and site"]
      - [Capex per MW and per deployed GPU, "Unavailable", High, "Determines build efficiency and financing need", "Committed and incurred capex, including grid, land, cooling, networking, and hardware"]
      - [Debt facility, "US$10B facility reported; drawn balance unavailable", Medium, "Creates capacity but also refinancing and covenant exposure", "Facility agreement, draw schedule, pricing, maturity, covenants, collateral, and guarantees"]
      - ["Cash, burn, and runway", "Unavailable", High, "Determines next-round dependency and construction resilience", "Latest cash balance, unrestricted cash, monthly burn, sources and uses, and downside runway"]
    notes: "Unavailable values were not estimated. The debt figure is a reported facility size, not cash on hand, and confidence labels describe disclosure confidence rather than business quality."
    claimRefs: [CI006, CI009, CI012, CI013, CI016]
