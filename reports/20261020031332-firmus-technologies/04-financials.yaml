company:
  name: Firmus Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Firmus has attracted very large equity and debt commitments, but the retained public
    evidence does not disclose revenue, realized pricing, margins, utilization, cash, burn,
    or runway. Its vertically integrated AI-factory model is therefore financeable at scale
    but not yet underwritable from public operating economics.
sections:
  - id: revenue-model
    title: Revenue model is visible, but monetization is not
    body: >-
      Firmus presents two related commercial surfaces: Firmus Cloud, which gives customers
      access to GPU infrastructure, and Firmus AI Factories, which it says it designs and
      operates as modular, vertically integrated infrastructure. That supports a plausible
      capacity-and-services revenue model spanning cloud compute and dedicated infrastructure,
      but the retained official pages do not publish list prices, contract units, discounts,
      revenue recognition terms, or realized rates. The 3 MW Media Hub deployment and the
      SEA-LION workload metrics show that physical capacity and compute have been delivered,
      yet neither establishes revenue or gross profit. The bridge below is consequently a
      mechanism map, not a quantified forecast.
    claimRefs: [CI001, CI002, CI003, CI009, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-pricing
    title: Capital-market traction exceeds operating disclosure
    body: >-
      Independent coverage converges on a $2 billion August 2026 equity round at a post-money
      valuation above $10.5 billion, while Forbes reports more than $3 billion of equity raised
      over the preceding year. The same evidence set reports a $10 billion debt facility in
      February 2026. These are financing events, not revenue, ARR, booked backlog, or cash
      available. Secondary databases also disagree materially on total capital and round count:
      InforCapital reports $12.8 billion across four rounds, whereas Silicon Valley Investclub
      reports $25.7 billion or more across nine entries and visibly duplicates several financings.
      The transaction-level disclosures are more decision-useful than either aggregate.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI016]
    tableRefs: [TI002]
  - id: unit-economics-and-capital
    title: Utilization and financing structure dominate unit economics
    body: >-
      AI factories require upfront spending on land, grid connections, cooling, and scarce GPU
      hardware. The Australian notes that returns depend on keeping machines busy and that demand
      can be uneven; Forbes similarly argues that operators retain utilization and refinancing
      risk while equipment suppliers are paid when hardware ships. Firmus claims lower construction
      cost and grid draw, but public evidence does not quantify capex per MW, capex per GPU,
      delivered power cost, maintenance burden, gross margin, or payback. A reported $10 billion
      facility may provide funding capacity, yet without drawn balance, covenants, maturity,
      interest cost, project-level security, and committed tenant economics it cannot be converted
      into a reliable runway estimate.
    claimRefs: [CI006, CI012, CI013, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence threshold
    body: >-
      The public record supports a high-capital, infrastructure-led growth story rather than a
      demonstrably high-quality revenue story. Firmus has credible evidence of deployed compute
      and access to institutional capital, but current revenue, gross margin, utilization,
      customer concentration, cash, burn, and debt obligations remain private. Low-quality
      secondary pages add noise: one framed Firmus at $5.9 billion, while an AI-generated article
      reported a different A$6 billion financing snapshot. Underwriting should therefore anchor
      on management-provided contracts, billing and utilization cohorts, site-level contribution
      margins, and a sources-and-uses schedule. Until those materials reconcile financing capacity
      with operating cash generation, revenue quality and capital adequacy remain material gaps.
    claimRefs: [CI004, CI010, CI015, CI016]
