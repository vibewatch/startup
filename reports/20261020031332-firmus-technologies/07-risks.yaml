schemaVersion: report-v2
artifact: risks
slug: firmus-technologies
runDate: 2026-10-20
company:
  name: Firmus Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Firmus's principal risks are the execution and financing demands of a multi-site AI
    infrastructure build, active permitting and grid dependencies, and concentration around
    NVIDIA-linked hardware and commercial structures. Public mitigations exist, but much of
    the evidence is company-issued and does not replace audited operating, security,
    utilization, or concentration data.
sections:
  - id: risk-prioritization
    title: Risk prioritization and investment implication
    body: >-
      The highest residual exposure is capital and delivery execution. An April 2026 report
      put the then-planned national program at A$73.3 billion, while three reviewed sources
      describe a US$10 billion debt facility; those figures are financing scale, not proof
      that all capital remains available or that the revised project portfolio is fully
      funded. The operating model also leaves Firmus carrying utilization and refinancing
      risk after equipment suppliers are paid. That asymmetry matters because a later profile
      reports that the proposed CDC-linked 1.6 GW rollout would not proceed after roughly
      42 MW had been deployed. The investment implication is therefore to underwrite each
      campus and committed customer separately rather than treating announced aggregate
      capacity as one de-risked portfolio.
    claimRefs: [CR001, CR002, CR003, CR008]
    figureRefs: [FR001]
  - id: regulatory-environmental
    title: Regulatory, grid, and environmental execution
    body: >-
      Site delivery is exposed to approval sequencing and power availability. The reviewed
      profile says Bell Bay's approval is under appeal, Wesley Vale required additional
      information before a major-project decision, and Hydro Tasmania had not decided on a
      request associated with about 444 MW across three Tasmanian sites. These are identifiable
      process dependencies, not evidence that approval or supply will fail, but delay at any
      one can shift energization, revenue, and financing schedules. Firmus has published energy
      and water commitments, including dry-mode cooling and future reporting. Those measures
      improve mitigation maturity, yet the assigned evidence does not provide independently
      audited outcomes across operating and planned sites. Approval documents, executed grid
      contracts, and measured water and power data remain the decisive diligence materials.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR001]
  - id: operations-and-dependencies
    title: Operational, financial, and partner dependencies
    body: >-
      Firmus is vertically ambitious: it says its platform spans cooling systems through grid
      orchestration software, while NVIDIA is reported as both an investor and the primary chip
      supplier. A company-issued syndicated announcement describes a partnership through 2034,
      a 360 MW Batam campus, revenue sharing, and credit support, and projects US$25 billion to
      US$30 billion of six-year receipts from committed offtake. These arrangements can support
      procurement and demand, but they also concentrate technology roadmap, counterparty, and
      contract-performance exposure. The withdrawal of the planned ASX float and pursuit of
      private funding further raise the importance of funding terms, covenant headroom, and
      milestone-linked draw availability. None of funding raised, debt capacity, or projected
      offtake should be treated as unrestricted cash or realized revenue.
    claimRefs: [CR002, CR004, CR005, CR006, CR007, CR014]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators, kill criteria, and diligence path
    body: >-
      The following are proposed investor controls, not company-published thresholds. Pause
      underwriting if a core campus lacks final, unappealed approvals and binding power
      arrangements sufficiently ahead of its contracted delivery date; if committed funding
      and permitted debt draws do not cover remaining construction plus contingency; or if
      customer contracts lack creditworthy, enforceable take-or-pay protections. Treat a
      material deterioration in NVIDIA supply, credit support, or platform economics as a
      dependency trigger. Require independent evidence for uptime, security incidents,
      insurance, water, and power performance before accepting operational mitigation as
      mature. A thesis break would be simultaneous slippage in site energization, financing,
      and contracted demand, because that combination would turn schedule risk into liquidity
      and refinancing risk rather than a recoverable construction delay.
    claimRefs: [CR003, CR004, CR005, CR007, CR009, CR010, CR011, CR012, CR013, CR015]
