    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Accelerator supply and reference architecture
        - NVIDIA
        - Primary chip supplier, investor, and platform partner
        - High strategic concentration
        - Allocation, roadmap, pricing, or architecture changes delay capacity
        - High
        - Long-term partnership and credit support are reported
        - High without alternate supply and migration plan
      - - Batam procurement and demand support
        - NVIDIA and AI-native customers
        - Revenue share, credit support, and claimed offtake
        - Contract details undisclosed
        - Customer default or weaker credit support impairs project finance
        - High
        - Company reports committed offtake and aligned economics
        - High until contracts and guarantees are reviewed
      - - Grid energy availability
        - Hydro Tasmania and other energy providers
        - Supply and connection for planned sites
        - Site-specific physical dependency
        - Approval, connection, or curtailment delays energization
        - High
        - Company energy policy and partial contracting
        - High for requests still under assessment
      - - Campus rollout partner continuity
        - CDC Data Centres
        - Previously linked to national rollout
        - Material strategy change reported
        - Replacement sites or delivery capacity lag prior plan
        - Medium-high
        - Firmus is pursuing its own and other regional projects
        - Medium-high until replacement schedule is reconciled
      - - Growth capital access
        - Private lenders and equity investors
        - Construction and expansion funding
        - Large debt facility plus withdrawn IPO
        - Draw conditions tighten or private round prices below plan
        - High
        - Multiple institutional backers are reported
        - High without covenant and liquidity disclosure
    notes: >-
      Partial dependency register from public evidence; funding commitments are not treated as
      cash available, and projected offtake is not treated as recognized revenue.
    claimRefs: [CR002, CR004, CR005, CR006, CR007, CR008, CR011]
