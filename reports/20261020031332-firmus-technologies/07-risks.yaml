    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Construction and financing slippage across a capital-intensive build
        - Medium-high
        - High
        - Large debt and equity capacity reported, terms not reviewed
        - High
        - Site-by-site sources and uses, contingencies, draw conditions, and completion guarantees
      - - Capacity underutilization or refinancing pressure
        - Uncertain
        - High
        - Offtake is claimed, but contract quality and concentration are private
        - High
        - Contracted versus available MW, take-or-pay terms, utilization, and debt-service profile
      - - Cooling, power, or water performance misses company targets
        - Uncertain
        - High
        - Policies, dry-mode design, and telemetry publication are company-stated
        - Medium-high
        - Independent uptime, power-usage, water-usage, thermal, and maintenance records
      - - Integrated platform failure across hardware, cooling, and grid orchestration
        - Uncertain
        - High
        - Company reports internal platform breadth and benchmark recognition
        - Medium-high
        - Architecture review, incident history, redundancy tests, warranties, and insurance
    notes: >-
      Qualitative assessment from the assigned evidence; no public incident log, audited uptime
      series, security certification pack, or site-level operating cost record was available.
    claimRefs: [CR001, CR002, CR003, CR006, CR012, CR013, CR014, CR015]
  - id: TR003
