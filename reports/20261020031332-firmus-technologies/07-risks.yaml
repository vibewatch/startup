          values:
            - label: Structural
            - label: High
            - label: Contractual
            - label: Medium-high
        - label: Cooling and environmental performance
          note: Policies and water claims lack independent operating verification in the pool.
          values:
            - label: Uncertain
            - label: High
            - label: Policy-stage
            - label: Medium-high
        - label: Capital-market execution
          note: The October 2026 ASX float was withdrawn and private funding was pursued.
          values:
            - label: Current
            - label: High
            - label: Alternative funding sought
            - label: High
    approximationNotes: >-
      Categories are qualitative analyst judgments anchored to the cited facts; they are not
      company ratings, probabilities, or a quantitative loss model.
    claimRefs: [CR001, CR003, CR004, CR007, CR009, CR010, CR011, CR012, CR013]
