company:
  name: Firmus Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Firmus is an Australian-incorporated, Sydney-headquartered AI infrastructure
    platform that combines AI factories with GPU cloud services. Its August 2026
    financing established a company-stated post-money valuation above USD 10.5
    billion, but the October withdrawal of a much larger proposed IPO exposes
    material financing, governance, and execution questions.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      Firmus Grid Limited trades as Firmus Technologies and describes itself as
      an integrated AI Factory Platform company. The operating proposition spans
      physical AI factories, GPU cloud capacity, cooling, power management, and
      grid-aware software rather than a conventional colocation-only model. The
      company says it was incorporated in Australia in 2019, and its August 2026
      announcement identifies Sydney as its headquarters. Independent reporting
      in October described a seven-factory portfolio across Australia, Singapore,
      Indonesia, and Malaysia, but only two sites as operational and five as
      under development. That distinction is central: announced or contracted
      capacity is not equivalent to commissioned, revenue-producing capacity.
      Public sources reviewed here do not disclose current revenue, utilization,
      customer concentration, headcount, or a complete location-by-location
      operating schedule, so those measures remain explicit diligence gaps
      rather than inferred cover metrics.
    claimRefs: [CO001, CO002, CO008, CO009]
    tableRefs: [TO001]
  - id: leadership-governance-and-stakeholders
    title: Leadership, governance, and stakeholders
    body: >-
      Firmus is led by co-chief executives Oliver Curtis and Tim Rosenfield. The
      available evidence indicates meaningful founder concentration but does not
      identify a complete board, committee structure, independent directors, or
      succession framework. That omission matters because the platform is
      attempting a capital-intensive, multi-country buildout while depending on
      repeated access to large pools of equity and debt. Curtis's prior
      insider-trading conviction and one-year prison term are material
      governance diligence facts, not proof of current misconduct; investors
      should verify the controls, delegated authorities, related-party policy,
      and board oversight adopted since then. Strategic backing is substantial:
      the August round included Coatue, NVIDIA, Blackstone-managed funds, and
      Jane Street. Their participation validates access to sophisticated capital
      and ecosystem relationships, but neither investor prestige nor round size
      substitutes for cap-table terms, lockups, liquidation preferences, or
      project-level financing disclosure.
    claimRefs: [CO003, CO004, CO005, CO006]
    tableRefs: [TO002, TO003]
  - id: financing-trajectory-and-milestones
    title: Financing trajectory and milestone record
    body: >-
      Firmus announced a fully subscribed USD 2 billion strategic equity round
      in August 2026 and said the transaction placed its post-money valuation
      above USD 10.5 billion. That financing followed a company-reported
      progression from early HyperCube research through renewable-powered data
      hall and integrated compute deployments, a Singapore sovereign-AI launch,
      and Project Southgate. The October 2026 IPO withdrawal is the sharper
      current signal. Firmus said the proposed terms did not reflect its
      long-term prospects and that it would pursue private capital, while
      independent reports described weak demand, valuation resistance, and
      concern over future funding needs. The withdrawal did not cancel the
      projects, but it removed a planned public-equity route and left expansion
      dependent on alternative capital. The milestone record therefore shows
      real technical and fundraising progress alongside a widening verification
      need: management should reconcile operating capacity, construction
      milestones, committed financing, and commissioning dates in one auditable
      schedule.
    claimRefs: [CO005, CO006, CO007, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
