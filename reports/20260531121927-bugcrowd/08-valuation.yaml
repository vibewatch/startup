  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger Event
      - Threshold / Observable Signal
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth deceleration
        - >-
          Any public or diligence-revealed figure showing YoY revenue growth below 20% for any
          recent period
        - >-
          Collapses the 40%+ growth narrative; pushes applicable multiple toward 3–5x (Rapid7-tier);
          base-case valuation drops below $1B
        - Exit secondary position or write down; do not enter primary until new lower anchor confirmed
      - - SVB covenant breach or distress signal
        - >-
          Any public notice of covenant violation, forced amortization, credit facility amendment,
          or restructuring
        - >-
          Signals operational distress; constrains M&A and exit; may trigger investor rights and
          governance changes; accelerates bear-case probability
        - Halt primary diligence; probe covenant terms; assess dilutive equity-raise risk
      - - Down round or flat financing below $1B
        - >-
          Any new primary equity round at a per-share price implying post-money valuation
          below $1B; or a secondary-market price collapse below $1.00/share
        - >-
          Confirms overvaluation at the $2B implied price; preference waterfall analysis becomes
          critical; common-share dilution amplified by anti-dilution provisions
        - Avoid until new capitalization structure is visible; assess anti-dilution impact on
          common; may create attractive secondary entry at post-down pricing
      - - HackerOne IPO at premium valuation
        - >-
          HackerOne S-1 filed with disclosed revenue above $150M and valuation above $2B;
          or secondary trades above $10/share
        - >-
          Resets peer benchmark for crowdsourced security platforms; clarifies public multiple
          environment; Bugcrowd upward or downward re-rating depends on relative metrics
        - Monitor IPO pricing and comparable multiples; use as real-time market read on Bugcrowd
          pricing
      - - AI triage margin collapse
        - >-
          Evidence of valid submission rates falling below 3% platform-wide, or management
          disclosure of triage COGS growing faster than 25% YoY without equivalent revenue growth
        - >-
          Destroys platform economics; managed-program gross margins compress toward 20–30%;
          multiple re-rates toward "AI-disrupted" bucket (sub-4x); HackerOne IBB pause is
          early signal this risk is materializing
        - Exit; AI substitution thesis confirmed; revisit at sub-$600M entry if AI defensive
          measures demonstrate efficacy
    notes: >
      Threshold definitions are qualitative and indicative rather than contractually defined.
      All triggers are based on publicly observable signals or data-room evidence that a prospective
      investor would be able to monitor. The list is not exhaustive; additional triggers related
      to regulatory changes (FedRAMP suspension, GDPR enforcement action), customer concentration
      loss (OpenAI or DoD program cancellation), or leadership departure could also break the thesis.
    claimRefs:
      - CV025
      - CV027
      - CV031
      - CV032
      - CV033
      - CV038

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - >-
          FY2023–FY2025 audited P&L, balance sheet, and cash flow; Big-4 auditor preferred
        - >-
          Confirms or refutes CEO's $100M revenue claim and 40%+ growth; reveals true COGS,
          blended gross margin, burn rate, and net cash position; prerequisite for any valuation
          model
        - Request via NDA from CFO Robert Taccini; require Big-4 audited statements if available
      - - SVB debt covenant terms
        - >-
          Full credit agreement including financial covenants (minimum ARR, maximum leverage),
          interest rate, maturity date, drawdown schedule, and change-of-control provisions
        - >-
          Covenant breach risk determines downside scenario constraints; change-of-control clauses
          affect M&A exit optionality; undisclosed terms represent an unquantifiable contingent liability
        - Request from CFO; legal review of credit agreement; benchmark against SVB ESG standard terms
      - - Capitalization table
        - >-
          Full cap table showing preference stack by series, common share count, option pool
          size, and any warrants or convertible instruments
        - >-
          Required for preference-adjusted return modeling; determines actual return to common
          vs. preferred in any exit scenario; identifies anti-dilution exposure in down round
        - Request from CFO/General Counsel via NDA; verify against Forge COI data
      - - Net revenue retention and gross dollar retention
        - >-
          NRR by cohort for at least 2 years; gross logo churn rate; net new vs. expansion ARR split
        - >-
          Core SaaS quality metric; determines whether growth is organic or reliant on new-logo
          acquisition; NRR above 120% required for premium (10x+) multiple justification
        - Request from CEO/CFO; benchmark against Bessemer NDR benchmarks (>120% = excellent)
      - - Mayhem acquisition financial terms
        - >-
          Acquisition price, earn-out structure, Mayhem P&L at time of acquisition, integration
          budget, and Dr. Brumley retention terms
        - >-
          Validates "nearly doubled valuation" claim; reveals earn-out risk if Mayhem technology
          milestones are not met; integration costs affect burn rate and gross margin
        - Request from CFO; review Mayhem pre-acquisition financials separately
      - - Forge $506M COI valuation basis
        - >-
          Underlying COI document filed with Forge that generated the $506.24M "Series E-1"
          post-money valuation; or confirmation from company that no new equity round was closed
          at that price
        - >-
          A $1.5B+ unexplained discrepancy between COI-based ($506M) and media-reported ($2B)
          valuation is material; if the COI reflects a real financing event, it could indicate
          an undisclosed down round or structured tranche
        - Request COI document from General Counsel; verify against Forge's methodology disclosure;
          seek company clarification on what constitutes the "Series E-1"
    notes: >
      Diligence items are listed in approximate priority order from highest to lowest urgency.
      Items 1–3 (audited financials, SVB covenants, cap table) are absolute prerequisites for
      any primary investment decision. Items 4–6 are required for valuation model refinement
      and scenario probability weighting. All items are standard in data-room access for
      growth-stage cybersecurity investments.
    claimRefs:
      - CV010
      - CV012
      - CV031
      - CV032
      - CV036
      - CV039

