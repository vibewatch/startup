  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >
        FY2023–FY2025 audited P&L, balance sheet, and cash flow statement from a Big-4 auditor;
        no public financial disclosure exists.
      whyItMatters: >
        The $2B informal valuation rests entirely on an unaudited CEO disclosure of "approaching
        $100M" revenue. Without audited financials, the revenue trajectory, gross margins, burn
        rate, and net cash position are all unverifiable, making any scenario probability weighting
        speculative.
      diligencePath: >
        Request via NDA from CFO Robert Taccini; require Big-4 audit engagement letter and audited
        statements for FY2023–FY2025.
      relatedQuestionRefs:
        - QV002
        - QV019

    - type: partial-coverage
      severity: material
      topic: comparable-valuation-table-completeness
      missingEvidence: >
        The comparable valuation table (TV004) covers eight representative public and M&A comps
        but excludes pure-play penetration testing vendors (Cobalt.io, Synack), private
        HackerOne funding rounds, and any crowdsourced security-specific M&A precedents.
        Private company transaction multiples in the crowdsourced/bug-bounty subsegment are
        not systematically documented in public data sources.
      whyItMatters: >
        Without crowdsourced-security-specific transaction comps, the multiple range in TV004
        is dominated by broader cybersecurity SaaS benchmarks that may over- or under-estimate
        the subsegment premium. The comparables are directionally valid but not subsegment-precise.
      diligencePath: >
        Request HackerOne and Synack valuation data from primary VCs; search for any PE or
        strategic acquisition of bug-bounty or crowdsourced-security assets in Mergermarket,
        PitchBook, and Windsor Drake proprietary deal databases.
      relatedTableRefs:
        - TV004
      relatedQuestionRefs:
        - QV007
        - QV008
        - QV009

    - type: private-evidence-only
      severity: blocking
      topic: svb-covenant-terms
      missingEvidence: >
        The full credit agreement for the $50M SVB Enterprise Software Group facility including
        all financial covenants, interest rate, maturity date, drawdown schedule, and change-of-
        control provisions.
      whyItMatters: >
        Restrictive covenants could constrain M&A exit optionality, force dilutive equity raises
        if ARR growth targets are missed, or accelerate debt repayment in a change-of-control
        scenario — all material to the exit pathway analysis.
      diligencePath: >
        Request full credit agreement from CFO; legal review of covenant terms; benchmark against
        SVB Enterprise Software Group standard facility terms for comparables.
      relatedQuestionRefs:
        - QV014

    - type: private-evidence-only
      severity: material
      topic: capitalization-table
      missingEvidence: >
        Full cap table showing preference stack by series, common share outstanding, option pool
        size and strike distribution, any warrants, and anti-dilution provisions for each series.
      whyItMatters: >
        Required to compute preference-adjusted exit returns for common shareholders; anti-
        dilution provisions in a down round determine true dilutive impact beyond headline share
        issuance; Forge $506M COI-based data may already reflect a down-event requiring cap table
        verification.
      diligencePath: >
        Request from General Counsel via NDA; verify class structure against Forge COI source data;
        model preference waterfall under bear, base, and bull scenarios.
      relatedQuestionRefs:
        - QV024

    - type: conflicting-data
      severity: material
      topic: valuation-discrepancy
      missingEvidence: >
        The underlying COI document filed with Forge that generated the $506.24M "Series E-1"
        post-money valuation for October 2025, or company clarification of what financing event
        this represents and whether it constitutes a flat or down event versus the February 2024
        Series E at above $1B.
      whyItMatters: >
        A $1.5B+ discrepancy between the COI-based valuation ($506M) and the media-reported
        informal valuation ($2B) is material; if the COI reflects a real financing event, it
        could indicate an undisclosed down round or a structured tranche that affects the
        common/preferred allocation in any exit scenario.
      diligencePath: >
        Request COI document from General Counsel; seek company clarification through investor
        relations; verify against Forge's stated COI methodology and cross-check against
        Tracxn, PitchBook, and CB Insights records.
      relatedQuestionRefs:
        - QV004
        - QV016
