summary:
  headline: >
    Bugcrowd 是真正的众包网络安全市场领导者：已获 FedRAMP Moderate 授权，拥有 1,200+ 企业客户，据报收入增长 40%+，收购 Mayhem 后拼出差异化的 AI+人工平台；但非正式约 $2B 估值相对
    $1.2B–$1.7B 的基准分析偏高，六项关键尽调仍未解开，且财务披露不透明（未披露经审计收入、NRR 或毛利率）压低确信度；在拿到 data room 前应维持观察 / 继续研究。
