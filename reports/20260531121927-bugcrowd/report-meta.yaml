companyProfile:
  summary: |
    Bugcrowd is a San Francisco–headquartered AI-powered crowdsourced cybersecurity platform
    founded in 2012 in Sydney, Australia by Casey Ellis, Chris Raethke, and Sergei Belokamen.
    The company pioneered the commercial bug bounty market and operates a multi-product
    Security Knowledge Platform™ spanning Bug Bounty, Vulnerability Disclosure Programs (VDP),
    Penetration Testing as a Service (PTaaS), and External Attack Surface Management (EASM).
    CrowdMatch™ AI technology matches 500,000+ vetted security researchers to client programs.
    Bugcrowd serves 1,200+ enterprise customers including OpenAI, Google, T-Mobile, and the
    US Department of Defense across 65+ industries in 29+ countries. CEO Dave Gerry (joined
    November 2022) led the February 2024 $102M Series E (led by General Catalyst, implied
    valuation above $1B), a $50M SVB growth capital facility in October 2024, the May 2024
    acquisition of UK-based Informer (ASM), and the November 2025 acquisition of Mayhem
    Security (AI-native automated code/API/SBOM testing). Total cumulative capital is
    approximately $234M+. PTaaS grew 75%+ in FY2024; channel partners represent 20%+ of
    revenue. Bugcrowd achieved FedRAMP Moderate Authorization in February 2026.
  foundedDate: "2012-01-01"
  founders:
    - name: "Casey Ellis"
      role: "Founder / Chief Strategy Officer"
      background: "Primary public face of Bugcrowd's founding; currently listed as Founder on Bugcrowd's official leadership page as of May 2026; previously held Chief Strategy Officer title; Australian entrepreneur who relocated Bugcrowd to San Francisco"
