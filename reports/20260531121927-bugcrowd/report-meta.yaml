coverageNotes: |
  This report was produced on 2026-05-31 using publicly available sources only. Bugcrowd is
  a private company and has not disclosed audited annual revenue, ARR, gross margin, NRR,
  EBITDA, or cap table details. The "approaching $100M" revenue figure is from a CEO
  statement in February 2024; FY2026 revenue is analyst-estimated at $170–185M based on
  40%+ growth trajectory. The ~$2B informal valuation is from SecurityWeek reporting on the
  November 2025 Mayhem Security acquisition and is not a confirmed disclosed valuation; the
  $506M Forge Global COI figure represents an October 2025 secondary-market data point.
  The $102M Series E (February 2024) is confirmed from press releases and contemporaneous
  media. Total cumulative capital (~$234M+) is derived from confirmed round disclosures
  plus the SVB $50M debt facility. All multiples, scenarios, and forward estimates are
  analyst-derived and should be treated as illustrative approximations, not confirmed
  projections.

