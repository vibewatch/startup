evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Official or third-party validated Bugcrowd valuation as of 2026, including post-Mayhem cap table and 409A
      appraisal.
    whyItMatters: >-
      Without a confirmed valuation, investment-stage analysis and multiple-based pricing are unreliable; the spread
      between implied unicorn ($1B) and near-double ($2B) is material for diligence.
    diligencePath: >-
      Request latest 409A valuation or cap table summary directly from Bugcrowd or lead investor General Catalyst under
      NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited or independently confirmed annual revenue / ARR figure for FY2024-2025; the $100M figure is a CEO verbal
      estimate.
    whyItMatters: >-
      Revenue underpins valuation multiples, growth credibility, and path-to-profitability assessment; without audited
      numbers, growth claims cannot be independently verified.
    diligencePath: >-
      Request audited financial statements or management accounts under NDA; compare to similar cybersecurity SaaS
      benchmarks.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: >-
      Total current employee count as of 2025-2026; only FY2024 new-hire data (161) and a 2024 estimate of ~350 base
      employees are publicly available.
    whyItMatters: >-
      Headcount trajectory is a proxy for revenue per employee efficiency and burn rate; needed to assess whether talent
      strategy post-Mayhem integration is on track.
    diligencePath: LinkedIn headcount trend analysis or direct request from company HR/investor relations.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      SVB debt facility covenant terms, interest rate, maturity date, and any covenants restricting M&A, distributions,
      or additional leverage.
    whyItMatters: >-
      Debt covenants can materially constrain operating flexibility; adverse covenants could impede future acquisitions
      or distress the company if revenue targets are missed.
    diligencePath: Review credit agreement directly with Bugcrowd treasury or CFO under NDA.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: minor
    topic: platform-technology
    missingEvidence: >-
      Independent technical assessment or analyst deep-dive into CrowdMatch AI accuracy, Mayhem integration milestones,
      and platform differentiation vs. HackerOne AI offerings.
    whyItMatters: >-
      Bugcrowd's competitive moat depends on the AI platform differentiating effectively; claims are currently
      self-reported without independent technical validation.
    diligencePath: >-
      Commission independent technical review or reference checks with enterprise security engineers who have used both
      Bugcrowd and HackerOne platforms.
    relatedQuestionRefs:
      - QO012
      - QO015
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: low
    topic: analyst-methodology
    missingEvidence: >
      Detailed methodological breakdowns—survey sample sizes, customer interview counts, secondary source
      cross-checks—are not publicly available for most analyst firms (MarketsandMarkets, Fortune Business Insights,
      Global Growth Insights) publishing crowdsourced security or PTaaS market estimates.
    whyItMatters: >
      Without published methodology, it is impossible to distinguish well-sourced estimates from data-extrapolation,
      introducing model risk when using analyst sizing figures as inputs to enterprise value or market penetration
      models.
    diligencePath: >
      Obtain full methodology appendix directly from analyst firm licensing desks; cross-validate with primary research
      from IANS Research, Gartner, or IDC on the PTaaS or ASM sub-segments.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >
      Bugcrowd's revenue segmentation by product line (bug bounty, VDP, PTaaS, ASM) is not publicly disclosed, making it
      impossible to independently calculate Bugcrowd's specific SAM share or SOM penetration rate from any of the
      analyst market estimates above.
    whyItMatters: >
      Without product-level revenue data, the SOM layer of the market sizing pyramid is necessarily an author estimate;
      an inflated SOM assumption could distort the enterprise value model significantly.
    diligencePath: >
      Request product-line revenue breakdown in due diligence; benchmark against publicly disclosed competitor data from
      HackerOne (if available) and Synack estimates.
  - type: missing-source
    severity: material
    topic: market-saturation
    missingEvidence: >
      No public data exists on bug bounty program cancellation rates, renewal rates, or churn signals for the
      large-enterprise segment, making it impossible to independently assess market saturation risk from high Fortune
      500 adoption rates (63%).
    whyItMatters: >
      If large-enterprise adoption is approaching natural saturation, Bugcrowd's future revenue growth would depend
      disproportionately on expansion revenue within existing customers and SME acquisition—a materially different
      growth model from new-logo market penetration.
    diligencePath: >
      Request gross-logo retention, net revenue retention, and new-customer-by-segment data from Bugcrowd management in
      due diligence; query peer CISO references on program renewal patterns.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: low
    topic: roi-comparison
    missingEvidence: >
      No independent, peer-reviewed study publishes a systematic ROI comparison between bug bounty / crowdsourced
      testing and traditional project-based penetration testing at equivalent scope and duration. Vendor-published ROI
      claims exist but are not independently audited.
