  claims:
    - id: CM001
      statement: >
        Bugcrowd's primary addressable market encompasses four distinct but converging offensive security sub-markets: bug bounty platforms, vulnerability disclosure programs (VDPs), penetration testing as a service (PTaaS), and attack surface management (ASM).
      type: observed
      topic: market-boundary
      sourceRefs:
        - SM025
        - SM008
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QM001
        - QM025

    - id: CM002
      statement: >
        Excluded from Bugcrowd's primary addressable market are traditional non-platform penetration testing firms operating on project-based contracts, SIEM/SOAR vendors, endpoint detection products, firewall appliances, and pure DAST/SAST static-analysis tools.
      type: inferred
      topic: market-boundary
      sourceRefs:
        - SM025
        - SM009
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QM001

    - id: CM003
      statement: >
        Adjacent markets of growing strategic relevance to Bugcrowd include breach-and-attack simulation (BAS), continuous threat exposure management (CTEM), and adversarial exposure validation (AEV)—categories that Gartner consolidated in its 2026 Market Guide for Adversarial Exposure Validation.
      type: third-party-reported
      topic: market-boundary
      sourceRefs:
        - SM013
        - SM014
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QM001

    - id: CM004
      statement: >
        Traditional project-based penetration testing engagements—Bugcrowd's primary status-quo substitute—charge $10,000–$100,000+ per annual assessment and deliver point-in-time rather than continuous security coverage.
      type: third-party-reported
      topic: market-boundary
      sourceRefs:
        - SM009
        - SM006
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QM015

    - id: CM005
      statement: >
        DAST/SAST static analysis tools automate code scanning but do not replicate the creativity, contextual reasoning, and adversarial perspective of human ethical hackers in finding complex vulnerabilities.
      type: third-party-reported
      topic: market-boundary
      sourceRefs:
        - SM025
        - SM005
      confidence: medium
      freshness: current

    - id: CM006
      statement: >
        MarketsandMarkets projects the global PTaaS market to grow from USD 0.72 billion in 2026 to USD 1.98 billion by 2031 at a CAGR of 22.6%.
