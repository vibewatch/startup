  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      Demand for bug bounty and crowdsourced security services is highly concentrated among large enterprises. Companies with more than 1,000 employees account for approximately 61% of all bug bounty platform contracts in the US. Among Fortune 500 companies in the US and Canada, 63% run a bug bounty program, and 42% of US-based technology companies use continuous vulnerability disclosure programs. North America holds approximately 49% of the global bug bounty market by revenue, followed by Europe at 27% and Asia-Pacific at 18%. The financial services vertical (BFSI) captures approximately 23.7% of crowdsourced security engagements, driven by regulatory obligations; technology, healthcare, and government follow as primary verticals.

      The budget owner is typically the CISO or VP of Security, who controls a security allocation within an IT budget where enterprises devote 8–12% of total IT spend to cybersecurity. Security engineers, AppSec teams, and DevSecOps practitioners are the primary day-to-day users of crowdsourced testing platforms. Payers are corporate security departments, except in the federal government segment where program fees flow through agency IT security budgets governed by CISA BOD-20-01. By Q4 2023, 90% of all Federal Civilian Executive Branch (FCEB) vulnerability submissions went through the CISA-operated VDP platform that Bugcrowd jointly manages with EnDyna. SMEs currently account for approximately 42.7% of crowdsourced security engagements and represent the fastest-growing cohort, with PTaaS SME adoption projected at a CAGR of 24.6%—higher than the large-enterprise rate. Large enterprises dominate total spending at approximately 72% of the market, but the SME segment presents the highest incremental growth opportunity.
