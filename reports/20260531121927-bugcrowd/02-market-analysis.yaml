callouts:
  - calloutType: risk
    title: Market Sizing Definitional Ambiguity Is a Valuation Risk
    body: >
      The five-order-of-magnitude spread between crowdsourced security market estimates ($99.83M to $133.2B) reflects profound definitional inconsistency rather than genuine market disagreement. Investors who accept a broad ecosystem TAM without applying a rigorous boundary definition will systematically overestimate the addressable opportunity. Bugcrowd's defensible SAM is approximately $4.1B (bug bounty + PTaaS + ASM combined), not the $133B figure sometimes cited for the broader cybersecurity platform market.
    claimRefs:
      - CM010
      - CM011
      - CM012

  - calloutType: insight
    title: Regulatory Tailwinds Create Durable Enterprise Demand
    body: >
      The SEC's 2023 cybersecurity disclosure mandate and CISA's BOD-20-01 federal VDP directive are structural demand multipliers that transform bug bounty and VDP from discretionary security investments into governance requirements. This regulatory floor is likely durable: even if enforcement priorities shift, the institutional compliance frameworks organizations have built around these mandates create switching costs that benefit incumbent platforms.
    claimRefs:
      - CM026
      - CM030

