figures:
- id: FU001
  title: Bugcrowd Customer Segmentation Journey Map
  type: journey-map
  layout: wide
  summary: 'Customer journey from initial security trigger through multi-product platform adoption, mapped across five primary
    buyer segments.

    '
  data:
    items:
    - label: Trigger
      description: Regulatory mandate (SEC/CISA BOD-20-01), peer breach, cyber-insurance renewal, or board inquiry
      segments:
      - 'Large Tech: Public software release or AI product launch'
      - 'Financial Services: PCI-DSS or regulatory compliance requirement'
      - 'Government: CISA mandate or FedRAMP procurement requirement'
      - 'IoT / Hardware: Product security concern, firmware vulnerability awareness'
      - 'Telecom / Media: Large external attack surface, public-facing apps'
    - label: Evaluation
      description: Platform assessment vs. HackerOne, self-managed, traditional pentest
      segments:
      - 'Large Tech: CrowdMatch AI depth; researcher quality; API integrations (Jira/GitHub)'
      - 'Financial Services: PCI/SOC 2 certifications; API testing specialization'
      - 'Government: FedRAMP authorization; SEWP/OMNIA procurement vehicle'
      - 'IoT / Hardware: Firmware testing capability; VRT taxonomy coverage'
      - 'Telecom / Media: Scale of researcher pool; public program management'
    - label: Pilot
      description: Private VDP or scoped private bug bounty; integration assessment
      segments:
      - 'Large Tech: Private program; Jira/Slack integration; ASE triage quality'
      - 'Financial Services: API-focused private program; compliance mapping'
      - 'Government: FedRAMP-authorized VDP via Carahsoft / direct'
      - 'IoT / Hardware: Scoped private program on AXIS OS or firmware surface'
      - 'Telecom / Media: Revamped or newly structured public bounty'
    - label: Production Expansion
      description: Public bug bounty, PTaaS, EASM; multi-product platform adoption
      segments:
      - 'Large Tech: Public BB + PTaaS + Mayhem API; e.g. OpenAI, BigCommerce, Atlassian'
      - 'Financial Services: Public BB + expanded pen testing; e.g. NAB, Rapyd, Wise'
      - 'Government: Agency-wide VDP + scoped BB programs; expanding to PTaaS'
