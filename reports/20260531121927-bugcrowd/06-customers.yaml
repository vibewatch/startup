- id: retention-satisfaction
  title: Retention Signals, Review Sentiment, and Adverse Feedback
  body: 'Bugcrowd does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or cohort-level churn
    data. The absence of these metrics is a material diligence gap for prospective investors. Qualitative retention signals
    from case studies are positive: NAB expanded from VDP to bug bounty and then to expanded penetration testing; ExpressVPN
    has been a Bugcrowd customer for over three years; Rapyd expanded from private to public programs; and BigCommerce progressed
    from a two-year private program to a public program. These multi-product progression patterns suggest reasonable net expansion
    within the existing customer base, consistent with the 40%+ annual revenue growth claimed by CEO Gerry in February 2024.

    Third-party review signals are materially positive. Gartner Peer Insights shows 4.9/5 from 27 verified ratings. PeerSpot
    shows 8.4/10 as of May 2026, with 47% of reviewers identifying as large-enterprise users. G2 shows 4.3/5 across 61 reviews,
    noting ease of use, proactive researcher community, and structured triage. TrustRadius shows 9.4/10 from three enterprise
    reviews.

    Adverse signals are recurring but concentrated in two themes. First, account manager and moderator quality variance: multiple
    independent reviews on TrustRadius, PeerSpot, and Gartner note that "the success of your program highly depends on the
    moderator assigned." TrustRadius reviewers report dealing with up to four different account managers in a single year.
    PeerSpot reviewers cite "a lot of internal churn at the moment." Second, support response time: PeerSpot and Gartner reviewers
    note that when tickets require customer input, resolution time can range from one to seven days, which some enterprise
    customers find insufficient for critical-severity findings.

    An isolated but public adverse data point: a one-star Gartner Peer Insights review from February 2019 cited explicit scope
    violations by Bugcrowd staff and researchers—disregarding instructions not to create new accounts during testing. This
    represents a single older case; no similar scope-violation incident has been reported in recent reviews as of May 2026.

    PeerSpot mindshare data reveals competitive erosion: Bugcrowd''s mindshare in the Penetration Testing Services category
    declined from 17.2% to 10.4% year-over-year by May 2026, placing it second behind HackerOne (12.3%), also down from 21.5%.
    Both platforms are losing share, likely to expanded coverage of this category by broader cybersecurity platforms and emerging
    specialists.

    '
