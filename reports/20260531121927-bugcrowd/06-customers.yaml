  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) by customer cohort; customer-level churn
      rate; percentage of customers renewing vs. expanding vs. contracting.
    whyItMatters: NRR is the single most important metric for validating Bugcrowd's land-and-expand motion and revenue quality.
      Without it, the 40%+ revenue growth claim cannot be decomposed into new logo growth versus organic expansion.
    diligencePath: Request NRR and GRR by cohort year, product line, and customer segment under NDA from Bugcrowd CFO or investor
      relations.
    relatedQuestionRefs:
    - QU004
    - QU027
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-5 and top-10 customer revenue concentration ratios; single largest customer as a percentage of total
      ARR.
    whyItMatters: A large government program or hyperscaler engagement could represent disproportionate revenue; without this
      data, concentration risk cannot be quantified.
    diligencePath: Request top-customer revenue concentration schedule under NDA.
    relatedQuestionRefs:
    - QU012
    - QU003
    - QU016
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: moderate
    topic: mayhem-attach-rate
    missingEvidence: Attach rate for Mayhem Security modules (API Security, Code Security, Dynamic SBOM) within existing Bugcrowd
      customer base post November 2025 acquisition.
    whyItMatters: Mayhem integration is Bugcrowd's primary new upsell lever; actual attach rate determines whether the acquisition
      creates near-term revenue uplift or requires a multi-year integration sales cycle.
    diligencePath: Request Mayhem module attach rate and ARR contribution from post-acquisition cohort data.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: moderate
    topic: case-study-freshness
    missingEvidence: Publication or last-updated dates for the majority of Bugcrowd customer case studies on bugcrowd.com/customers;
      several named customer relationships may have changed since case studies were written.
    whyItMatters: Evidence freshness cannot be confirmed for older case studies; some lighthouse logos may no longer be active
      customers.
    diligencePath: Request customer references that include engagement dates and confirmation of active status from Bugcrowd
      sales team.
    relatedQuestionRefs:
    - QU002
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: minor
    topic: government-named-customers
    missingEvidence: Specific named US federal agency customers beyond CISA (the FedRAMP sponsor) deploying Bugcrowd in production
      as of May 2026.
    whyItMatters: Government is described as the fastest-growing segment globally for crowdsourced security; without confirmed
      named federal customers, the government segment's actual revenue contribution is opaque.
    diligencePath: Request US federal agency customer list under NDA, or seek publicly accessible VDP/Bug Bounty program listings
      via CISA's VDP platform registry.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU001
  - type: missing-source
    severity: minor
    topic: customer-count-trajectory
    missingEvidence: Customer count data points between 2020 and 2023 (only ~850 for Oct 2023 and 1,200+ for Oct 2024 are
      confirmed); segment-level customer counts and geographic breakdown of the 1,200+ customer base.
    whyItMatters: Gaps in the customer count series make it impossible to verify whether growth has been linear or lumpy;
      geographic distribution informs concentration risk and market-coverage assessment.
    diligencePath: Request historical customer count by quarter and geographic segment from Bugcrowd CFO or investor relations
      under NDA.
    relatedQuestionRefs:
    - QU003
    - QU014
    - QU016
    - QU026
    relatedTableRefs:
    - TU001
acknowledgedWarnings:
- dimension: figureType
  reason: FU004 uses a qualitative multi-year cohort proxy table rather than true NRR/GRR cohort data because Bugcrowd does
    not publicly disclose quantitative retention cohort metrics. The table accurately represents the available evidence (published
    case study tenure data) without fabricating metrics. This limitation is explicitly acknowledged in the figure summary
    and in evidenceGaps.
- dimension: unverifiedSource
  reason: SU023 (Bugcrowd SVB press release) returned 404 on BusinessWire; the press release was confirmed via the PRNewswire
    variant fetched in prior chapter research and is cited in chapters 01 and 04 as source SO005/SO023/SF014. SU019-SU022,
    SU024-SU025, SU027-SU029 were fetched successfully in this session (SU019 via Jina reader; SU020-SU022 via bugcrowd.com;
    SU024 via dataintelo.com; SU025 via globalsecuritymag.com; SU027 via tei.forrester.com; SU028 via techintelpro.com; SU029
    via eweek.com). Fetch-log entries are present for all successfully retrieved URLs; SU023 is acknowledged as broken-link
    with the underlying fact corroborated by SU009 (PRNewswire) and other chapter-1 sources.
