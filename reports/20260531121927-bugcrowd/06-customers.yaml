- id: FU003
  title: Adoption and Deployment Funnel
  type: funnel
  layout: standard
  summary: 'Discovery-to-deployment funnel for enterprise Bugcrowd customers, with illustrative stage-gate metrics drawn from
    publicly available data.

    '
  data:
    items:
    - label: Trigger / Awareness
      value: 100
      detail: Regulatory pressure (SEC, CISA BOD-20-01, PCI, DORA/NIS2), peer breach, insurance renewal, or AI/cloud expansion
        creates initial demand. 88% of CISOs expected security budget growth in 2026.
    - label: Evaluation (Bugcrowd vs. HackerOne / self-managed pentest)
      value: 70
      detail: Buyer evaluates CrowdMatch AI depth, managed-triage SLO (P1 in 1 business day), integration catalog (19+ connectors),
        and certification stack (FedRAMP, SOC 2, PCI-DSS). Migration from HackerOne offered at no extra cost.
    - label: Pilot (private VDP or scoped private bug bounty)
      value: 45
      detail: Typically private program. Wise received first valid P1 within 24 hours of launch; Rapyd used private program
        before going public. OpenAI launched exclusively on Bugcrowd in April 2023.
    - label: Production (paid platform deployment)
      value: 25
      detail: 1,200+ active enterprise customers as of Oct 2024; 300+ added in FY2024. ~2,000 live engagements simultaneously.
        PTaaS grew 75%+ in FY2024. Over 20% of revenue from channel partners.
    - label: Platform Expansion (2+ products; SDLC integration)
      value: 12
      detail: 'Multi-product progression documented: NAB (VDP + BB + PTaaS), Rapyd (private → public + API specialization),
        BigCommerce (private → public). Mayhem modules (API, Code, SBOM) as new expansion levers from Nov 2025.'
  approximationNotes: 'Stage values are illustrative conversion estimates based on industry SaaS benchmarks and available
    Bugcrowd public data. No public stage-level conversion rates have been disclosed by Bugcrowd.

    '
