  - id: TR005
    title: Mitigation and Kill Criteria Table
    notes: >
      Kill criteria represent thesis-breaking events, not normal operating risks. Thresholds
      are illustrative based on publicly observable business model characteristics and should
      be calibrated with the company's actual financial and operational metrics under NDA.
      Monitoring should begin at investment close and be reviewed quarterly.
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - FedRAMP Authorization Loss
        - CISA sponsorship withdrawal or FedRAMP Board revocation notice
        - Any formal notification of revocation or downgrade from FedRAMP Moderate
        - Immediate re-underwrite; federal revenue segment effectively zeroed; Carahsoft contracts affected
      - - Platform Data Breach Exposing Client Vulnerability Intelligence
        - Public breach disclosure, SEC-equivalent regulatory notification, or dark-web evidence of stolen CVE data
        - Confirmed exfiltration of unremediated vulnerability data from any named enterprise customer program
        - Thesis-break trigger; enterprise churn cascade likely; regulatory enforcement exposure materially elevated
      - - HackerOne Competitive Re-Rating — Mindshare > 50% in BBP
        - PeerSpot or Gartner mindshare data showing HackerOne exceeding 50% BBP share with Bugcrowd below 25%
        - Single measurement of HackerOne ≥50% and Bugcrowd ≤25% BBP mindshare in same period
        - Competitive thesis weakens; re-examine land-and-expand economics and win-rate data
      - - SVB Covenant Breach or Debt Acceleration
        - SVB issues a notice of default or demands covenant cure; Bugcrowd discloses covenant waiver in press
        - Any formal debt acceleration trigger or publicly disclosed covenant waiver event
        - Liquidity crisis risk; M&A activity suspended; potential down-round required to cure; exit window narrows
      - - AI Autonomous Scanners Displace >50% of Bugcrowd Crowdsourced Findings
        - Annual platform data showing AI-attributed findings exceeding human-attributed findings by >2:1 ratio
        - Two consecutive annual reports showing AI tools account for >50% of valid critical/high findings
        - Human-researcher network value thesis challenged; platform pivot to AI-first required to sustain margins
