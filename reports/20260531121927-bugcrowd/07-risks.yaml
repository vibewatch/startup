  - id: concentration-dependency-mitigation
    title: Concentration, Dependency, and Mitigating Evidence
    body: >
      Bugcrowd's revenue and operational model embeds several concentration risks. Channel
      partner revenue exceeded 20% of FY2024 total revenue, and the April 2026 Carahsoft
      partnership—which provides federal access through NASA SEWP V, OMNIA Partners, and
      E&I Cooperative contracts—routes all US government procurement through a single
      master aggregator. A Carahsoft relationship disruption, pricing renegotiation, or
      a government agency's decision to go direct would affect federal revenue without
      a ready alternative distribution channel. Similarly, Bugcrowd's AWS Marketplace
      channel grew 32x in one year (from $34,500 to $1.126M), concentrating cloud-channel
      revenue in a single hyperscaler's commercial marketplace with revenue-share and
      policy exposure. Named lighthouse customers—OpenAI, Google, T-Mobile, and the
      US Department of Defense—each carry outsized reputational weight; loss of any
      flagship reference would reduce sales-cycle credibility across the enterprise segment.

      Mitigating evidence is meaningful but not conclusive. Bugcrowd's 100% PeerSpot
      recommendation rate versus HackerOne's 86% signals high delivered value among
      deployments. The 8.4/10 PeerSpot rating exceeds HackerOne (8.1) despite a smaller
      reviewer population, and 4.9/5 on Gartner Peer Insights (27 enterprise reviews)
      further supports satisfaction quality. FedRAMP Moderate authorization (February/March
      2026) and the Carahsoft partnership unlock an estimated addressable federal
      cybersecurity market that exceeds $14B by 2026. The December 2025 AI Triage
      Assistant launch directly addresses the triage bottleneck risk identified by
      reviewers, and the Mayhem acquisition positions Bugcrowd as the only platform
      offering both crowdsourced human testing and AI-autonomous code/API security from
      a unified platform. No material layoffs, financial distress signals, or
      platform-level security breaches have been publicly reported as of May 2026.
      Investors should request customer concentration schedules, SVB covenant
      documentation, audited financials, and NRR/GRR cohort data under NDA before
      committing capital.
