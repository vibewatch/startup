tables:
  - id: TR001
    title: Regulatory / Legal Risk Register
    enumeration: true
    notes: >
      Likelihood estimates are qualitative assessments based on regulatory precedents and
      public evidence as of May 2026; they are not actuarial probabilities. Severity reflects
      potential revenue, reputational, and operational impact. Coverage is partial — undisclosed
      litigation, IP disputes, and non-US regulatory matters outside GDPR scope are excluded.
      Rows are ordered by severity.
    enumerationScope:
      coverage: partial
      basis: >
        Enumeration of known regulatory and legal risks based on FedRAMP marketplace listing,
        RFC-0031 proposed rulemaking, GDPR Enforcement Tracker, ISO certifications, and
        public terms-of-service / safe-harbor provisions as of May 2026. Undisclosed litigation
        and IP disputes are excluded.
    columns:
      - Risk / Rule / Case
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - Platform Data Breach — Researcher/Client Vulnerability Intelligence
        - Global
        - No confirmed breach as of May 2026; risk is ongoing
        - Medium (breach probability inherent in operating a security platform handling sensitive CVEs)
        - Critical — loss of enterprise trust, federal authorization, potential litigation
        - ISO 27001:2022/27018 certifications; FedRAMP controls; role-based access; researcher vetting
        - Moderate — no breach history is positive; FedRAMP continuous monitoring adds detection capability
        - Obtain SOC 2 Type II audit report and FedRAMP system security plan under NDA
      - - FedRAMP Moderate Authorization Maintenance / Revocation Risk
        - US Federal
        - Authorization achieved February/March 2026; continuous monitoring obligation ongoing
        - Low-Medium (FedRAMP revocation is rare but triggered by control failures or audit gaps)
        - High — loss revokes federal market access and triggers Carahsoft contract disruption
        - Continuous monitoring program; CISA as sponsoring agency; Coalfire advisory support
        - Low-Medium — recent achievement reduces near-term revocation risk but adds ongoing overhead
        - Request POA&M (Plan of Action and Milestones) documentation and most recent third-party assessment report
      - - FedRAMP Incident Reporting Rule Change — RFC-0031
        - US Federal
        - Proposed; finalized by end June 2026; enforcement begins January 1, 2027
        - High (rule change is effectively certain; compliance requirement is a matter of timing)
        - High — operational non-compliance risks corrective action plan and potential authorization revocation
        - Seven-month implementation window; Coalfire advisory relationship; existing incident response program
        - Medium — compressed notification timelines for severe events (15 min for N5/Class C) require tooling investment
        - Confirm incident response plan gaps vs. RFC-0031 tiered timeline requirements; request implementation roadmap
      - - GDPR and Multi-Jurisdictional Data Privacy Enforcement
        - EU and multi-national
        - Active ongoing obligation; no known Bugcrowd-specific enforcement action as of May 2026
        - Medium (industry-wide GDPR enforcement at €6.28B total fines; Bugcrowd processes EU researcher and client data)
        - High — material fine and DPA suspension exposure if data handling misstep occurs
        - ISO 27018; GDPR Standard Model Clauses; DPA agreements with EU customers; legal review
        - Medium — no known violations; multi-jurisdiction complexity increases residual exposure
        - Request GDPR compliance framework documentation, DPA templates, and record of processing activities (RoPA)
      - - Researcher Misconduct / Safe-Harbor Liability
        - US, EU, and applicable local jurisdictions
        - No known pending litigation involving researcher scope violations as of May 2026
        - Low-Medium (isolated historical Gartner review cited scope violation in 2019; no recent pattern)
        - Medium — customer contract termination, reputational damage, and potential litigation if researcher exceeds scope
        - Terms of service; scoped program definitions; researcher vetting and code-of-conduct; managed triage oversight
        - Low — safe-harbor provisions are standard practice; historical incident is isolated
        - Request claims history for researcher-related disputes; confirm cyber-liability insurance coverage
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025

