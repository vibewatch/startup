  - id: TR003
    title: Partner and Dependency Risk Register
    notes: >
      Concentration and failure-scenario assessments are qualitative and based on publicly
      available commercial agreements and financial disclosures as of May 2026. Covenant
      terms for the SVB facility are not publicly disclosed; rows involving the debt facility
      reflect standard enterprise software credit package assumptions. Rows ordered by severity.
