acknowledgedWarnings:
  - dimension: figureType
    reason: >
      FR001 uses a qualitative 3x3 risk heatmap matrix rather than a quantitative
      probability-weighted matrix, because Bugcrowd does not publicly disclose financial
      metrics needed to compute expected-value impact scores. Risk placement reflects
      publicly observable evidence and expert judgment, which is explicitly disclosed
      in the figure's approximationNotes field.
  - dimension: unverifiedSource
    reason: >
      SR009 (Forge Global) shows a Series E-1 valuation of $506M for October 2025,
      which appears inconsistent with Bugcrowd's own $1B+ unicorn characterisation
      following the February 2024 Series E. Both figures are reported as-found;
      the discrepancy likely reflects the difference between the post-Series-E
      primary-round valuation and secondary-market pricing on Forge. No audited
      valuation document is available to resolve the discrepancy.
  - dimension: unverifiedSource
    reason: >
      SR014 (G2 Bugcrowd reviews) was accessed via the Wayback Machine snapshot
      dated November 21, 2025, because the live G2 page returned a bot-challenge
      response. The archived content reflects reviews as of November 2025 rather
      than May 2026; review themes (payout delays, triage quality, moderator variance)
      are corroborated by contemporaneous PeerSpot and TrustRadius sources.


