        - Sole US federal distribution partner for FedRAMP-authorized Bugcrowd; SEWP V, OMNIA, E&I vehicles
        - High — all identified US federal procurement routes current run through Carahsoft
        - Carahsoft relationship disruption or pricing renegotiation reduces federal revenue without ready alternative
        - High — federal segment is Bugcrowd's stated highest-growth channel for 2026–2027
        - Partnership announced April 2026; contractual relationship reduces near-term disruption risk
        - Medium — single-aggregator dependency is standard for gov-tech but creates structural vulnerability
      - - AWS Marketplace — Cloud Channel
        - Amazon Web Services
        - Commercial marketplace for co-sell and self-service Bugcrowd subscription; Tackle-enabled
        - Medium — grew 32x YoY to $1.126M; represents an emerging but still small share of total revenue
        - AWS policy change, de-listing, or revenue-share renegotiation disrupts cloud-channel revenue
        - Medium — early-stage channel; absolute dollar impact limited but growth trajectory matters
        - Multi-cloud channel strategy possible; GCP and Azure Marketplace not confirmed as of May 2026
        - Low-Medium — channel is emerging, absolute exposure manageable; diversification path available
      - - General Catalyst — Lead Investor and Board Control
        - General Catalyst (Mark Crane, Partner; Paul Sagan, Board Chair)
        - $102M Series E lead; board chair and board member; IPO/exit path influence
        - Medium-High — two General Catalyst representatives on board; IPO timing is investor-driven
        - Investor priority divergence (IPO timing, M&A exit preference) could create governance friction
        - Medium — management and investor misalignment on exit timing is common at unicorn stage
        - Alignment documented in Series E announcement; board governance strengthened post-investment
        - Low-Medium — General Catalyst has strong cybersecurity thesis alignment; exit path friction is manageable
