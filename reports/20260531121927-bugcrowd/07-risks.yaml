      - - SVB $50M Growth Capital Facility
        - Silicon Valley Bank (First Citizens BancShares subsidiary)
        - Primary debt financing; operational runway and M&A capital
        - Single-lender; $50M represents ~27% of cumulative equity raised
        - Covenant breach triggers acceleration of debt; limits strategic flexibility during downturn
        - High — covenant breach at a growth inflection point could constrain M&A and headcount
        - Revenue growth trajectory; 40%+ YoY growth reduces covenant pressure; General Catalyst equity backstop
        - Medium — covenant terms undisclosed; external assessment not possible without NDA access
      - - Carahsoft — US Federal Government Aggregator
