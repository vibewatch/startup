  - id: competitor-profiles
    title: Competitor Profiles—Scale, Funding, Customers, and Strategic Direction
    body: >
      HackerOne is the largest bug bounty and vulnerability coordination platform by community
      scale and program count. With $159.4M raised across five rounds (most recent $49M Series E
      in 2022) and an estimated annual revenue of approximately $750M per compworth.com, HackerOne
      anchors the enterprise market. Its 2025 Annual Hacker-Powered Security Report documented
      $81M in bounty payouts to researchers during July 2024–June 2025—a 13% year-over-year
      increase—and a 210% surge in AI-related vulnerability reports, including 560 valid reports
      submitted by fully autonomous AI agents. HackerOne's strategic direction emphasizes
      "bionic hackers" (AI-augmented researchers) and has launched an AI-powered triage service
      called Hai Triage. Its principal limitation versus Bugcrowd is narrower platform breadth:
      HackerOne is primarily a bug bounty and VDP platform with lighter PTaaS and no integrated
      ASM module.

      Synack differentiates through extreme researcher quality controls. Founded by former NSA
      operatives Jay Kaplan and Mark Kuhr, the company has raised $112M from Kleiner Perkins,
      Greylock, and GGV Capital. The SRT's multi-stage technical assessment, identity verification,
      and background screening accept fewer than 10% of applicants—making it the most
      restrictive researcher model in the market. Synack's Sara AI Pentesting (powered by the
      Synack Autonomous Red Agent, or Sara) handles continuous reconnaissance and initial exploit
      validation at machine speed, with SRT researchers then focusing on complex adversarial
      judgment. GigaOm's 2025 PTaaS Radar recognized Synack as both a Leader and Fast Mover.
      Synack's estimated revenue of $65–100M positions it as a smaller but premium-priced
      provider; its principal limitation is the restricted researcher community size relative
      to Bugcrowd and HackerOne.

      NetSPI competes primarily in PTaaS and ASM without a crowdsourced researcher model.
      Backed by $500M from KKR, it holds a strong position in financial services (seven of the
      top ten US banks) and cloud security. Its product suite covers continuous pentesting,
      ASM, and breach-and-attack simulation, making it a more direct ASM competitor than a
      crowdsourced security peer. NetSPI acquired Hubble in 2024 to extend its asset intelligence
      capabilities. Cobalt.io, with ~$37M raised and ~507 employees, has positioned itself
      as the accessible mid-market PTaaS alternative, offering modular crowdsourced pentest
      engagements at generally lower price points than Bugcrowd or Synack.

      Intigriti and YesWeHack are the dominant European crowdsourced security platforms.
      Intigriti raised €21M+ in Series B (2022, led by Octopus Ventures) and achieved 650%
      growth from its 2020 Series A, establishing itself as the EU's fastest-growing platform.
      YesWeHack closed a €26M Series C in 2026 led by Wendel, with new board member Renaud
      Deraison (co-founder of Tenable) adding vulnerability-management ecosystem credibility.
      YesWeHack serves 70% of CAC 40 companies and public sector clients across France, Spain,
      Canada, and Singapore. Both platforms benefit from GDPR-native data residency and local
      researcher communities, creating structural barriers to Bugcrowd's European expansion.
