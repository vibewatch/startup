  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: bugcrowd-pricing
      missingEvidence: >
        Bugcrowd's full published price list and actual ARR breakdown by product line (bug bounty vs. PTaaS vs. ASM vs. VDP)
        are not publicly available; pricing data is derived from third-party procurement databases with limited sample sizes.
      whyItMatters: >
        Without confirmed pricing benchmarks, investors cannot reliably model revenue per customer or compare pricing power
        against HackerOne and Synack at equivalent scope levels.
      diligencePath: >
        Request anonymized customer contract data, ARR by product segment, and average contract value trend from Bugcrowd
        management during financial due diligence; supplement with additional Vendr/SpendHound records.
      relatedQuestionRefs:
        - QP012
        - QP013
        - QP026
        - QP027

    - type: private-evidence-only
      severity: material
      topic: market-position
      missingEvidence: >
        HackerOne and Synack do not publicly disclose audited revenue figures; estimates from Growjo, compworth.com, and
        Tracxn are model-derived and may not reflect current performance.
      whyItMatters: >
        Accurate competitive revenue benchmarking is required to assess Bugcrowd's relative market share trajectory and
        pricing power. Current estimates place HackerOne at ~$750M and Synack at $65–100M, but these are unverified.
      diligencePath: >
        Seek investor references or channel partner data points for HackerOne and Synack revenue estimates; monitor
        hiring cadence and program count growth as leading indicators of platform revenue trajectory.
      relatedQuestionRefs:
        - QP003
        - QP004

    - type: missing-source
      severity: minor
      topic: ai-submission-risk
      missingEvidence: >
        No publicly available data shows Bugcrowd's valid submission rate (valid reports / total submissions) trend
        over 2024–2026, or a direct comparison of valid-submission-rate impact between Bugcrowd and HackerOne during
        the AI flooding period.
      whyItMatters: >
        The valid submission rate is the leading operational indicator of whether AI-generated flooding is materially
        degrading platform value for enterprise clients; without this metric, the severity of the structural risk is
        estimated rather than measured.
      diligencePath: >
        Request operational metrics on valid submission rate, triage throughput, and AI-related enforcement actions
        from Bugcrowd management; compare with HackerOne's published report data.
      relatedQuestionRefs:
        - QP016
        - QP023
        - QP024
