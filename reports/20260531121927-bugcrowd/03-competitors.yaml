callouts:
  - calloutType: risk
    title: AI-Generated Submission Flooding Is an Existential Threat to the Crowd Model's Economics
    body: >
      The 334% queue spike at Bugcrowd, the Curl project's HackerOne shutdown (95% invalid
      submissions), and HackerOne's April 2026 program suspension collectively signal that the
      fundamental economics of crowd-sourced vulnerability disclosure are under structural pressure.
      AI systems can generate plausible-looking vulnerability reports at near-zero marginal cost,
      inverting the signal-to-noise ratio that platforms depend on to deliver value to enterprise
      clients. Platforms that cannot cost-effectively filter this noise will see program ROI decline
      and customer churn accelerate. Bugcrowd's enforcement policy (bans, suspensions, identity
      verification) is a necessary response but creates permanent operational overhead. Investors
      should track valid submission rates quarter-over-quarter as the leading indicator of platform
      health.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024

  - calloutType: insight
    title: Full-Platform Breadth Is Bugcrowd's Primary Differentiation Against Single-Product Peers
    body: >
      No direct competitor offers the combination Bugcrowd provides post-2025 acquisitions:
      open bug bounty, managed VDP, PTaaS, continuous ASM (via Informer), and AI-native
      code/API security automation (via Mayhem). HackerOne is stronger in raw community scale
      but lacks integrated ASM. Synack offers superior researcher quality but no open bounty
      or VDP. NetSPI has strong PTaaS and ASM but no crowd model. This multi-product breadth
      creates cross-sell lock-in and supports higher total contract values—but the acquisition
      integration risk (CrowdMatch AI + Informer data + Mayhem automation on a single platform)
      is a near-term execution dependency that diligence should verify.
    claimRefs:
      - CP009
      - CP026
      - CP029

