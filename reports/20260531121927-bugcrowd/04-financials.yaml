callouts:
  - calloutType: risk
    title: Absent Audited Financials Make Revenue Quality Unverifiable
    body: >
      The only public revenue figure for Bugcrowd—"approaching $100 million in annual revenues" growing
      over 40%—is a CEO verbal statement in a February 2024 TechCrunch interview. No audited financial
      statements, reviewed financials, or independently verified revenue figures exist in the public
      domain. Third-party statistical estimators (IncFact) place Bugcrowd in a $10–100M revenue band,
      confirming the opacity rather than corroborating the verbal figure. Investors must obtain and
      independently verify audited financials before underwriting any valuation multiple or growth
      narrative. The absence of public financials is expected for a private company but does not reduce
      the diligence obligation.
    claimRefs:
      - CI033
      - CI034

  - calloutType: risk
    title: SVB Debt Covenant Terms Are an Unquantified Constraint
    body: >
      The October 2024 $50M SVB Enterprise Software Group facility carries undisclosed covenant terms.
      SVB's managing director confirmed this was an "expansion" of a prior credit facility, implying
      a relationship with covenants already in place. Standard growth-stage software credit facilities
      impose minimum ARR or ARR growth covenants, minimum liquidity covenants, and change-of-control
      provisions. If Bugcrowd's post-Mayhem integration causes a temporary growth deceleration, any
      revenue-tied covenant could require amendment or waiver, adding refinancing risk. Diligence must
      obtain the full credit agreement before any investment decision.
    claimRefs:
      - CI020
      - CI021
      - CI036

