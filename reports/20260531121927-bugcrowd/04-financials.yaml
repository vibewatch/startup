  - id: unit-economics-margins
    title: Cost Structure, Gross Margin Profile, and Unit Economics
    body: >
      Bugcrowd's cost structure reflects a hybrid SaaS-plus-managed-services business operating in a
      capital-light marketplace model. The dominant cost-of-revenue items are triage and program
      management personnel (security analysts, program managers), cloud infrastructure, and the costs
      of delivering PTaaS engagements (researcher coordination, scoping, reporting). Researcher bounty
      payouts—which can range from $300 to $5,000 for typical findings and up to $50,000+ for critical
      enterprise vulnerabilities—are sponsor-funded pass-throughs and do not appear as COGS in
      Bugcrowd's own income statement under principal/agent accounting.

      For the platform and SaaS subscription revenue tier, gross margins are expected to resemble
      comparable cybersecurity SaaS businesses. Industry benchmarks compiled by CFO Advisors for 2026
      place median gross margins for cybersecurity SaaS at 72–78%, with top performers exceeding 80%.
      Bugcrowd's platform/SaaS revenue streams (subscriptions, ASM licensing, some triage fees) likely
      fall within this range, though exact figures are not publicly disclosed. The PTaaS managed-service
      component carries lower gross margins than pure-SaaS—typical in managed security services—
      estimated at 40–60% before central overhead allocation. On a blended basis across all five revenue
      streams (including the relatively high-margin ASM and subscription layers), Bugcrowd's gross
      margin is estimated at 55–70%, though this cannot be confirmed without audited financials.

      Unit economics at the customer level are partially constructable from public data. The Vendr
      database indicates total annual customer cost (platform fees + researcher rewards) of $100,000
      to $300,000 for mid-market organizations and $300,000 to $1,000,000+ for enterprise. Platform
      fees alone (the Bugcrowd-revenue component) are $30,000 to $200,000+ annually. Given 1,200+
      customers and an estimated $100M+ in annual revenue as of FY2024, average revenue per customer
      (ARPU) is approximately $83,000 per year—consistent with Vendr's mid-market benchmarks. Costbench
      documents a median contract of $6,500/year from 8 community-sourced purchases, indicating that
      entry-level program scopes can be much smaller, and the $83,000 ARPU is skewed toward larger
      enterprise contracts.

      Key unit-economics metrics—CAC, LTV, gross logo churn, and net dollar retention—are not publicly
      disclosed. Industry benchmarks suggest B2B cybersecurity SaaS CAC payback periods of 18–28 months
      at scale. Bugcrowd's 300+ new customers added in FY2024 at a 40%+ growth rate suggests sales
      efficiency, but without confirmed CAC or contract-value distribution data, the payback period
      cannot be independently verified. Operating expense (OpEx) drivers include the FY2024 hiring of
      161 new employees and the integration costs of two acquisitions (Informer in May 2024 and Mayhem
      Security in November 2025), both of which added headcount and R&D obligations. Burn rate remains
      undisclosed; the combination of 40%+ revenue growth and $152M in strategic capital raised in
      FY2024 (equity + debt) suggests the company is investing aggressively in growth rather than
      targeting near-term profitability. No evidence of material layoffs or financial distress was
      found in public sources as of May 2026.
