  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Audited or independently reviewed annual revenue and ARR figures for FY2023, FY2024, and FY2025.
        The only public figure is a CEO verbal estimate of "approaching $100M" in February 2024,
        which cannot serve as a basis for investment underwriting without corroboration.
      whyItMatters: >
        All valuation multiples, growth-rate credibility, and capital-efficiency calculations rest on an
        unverified verbal disclosure. The gap between a $10M and $100M revenue estimate (per IncFact's
        statistical range) is large enough to materially change valuation conclusions.
      diligencePath: >
        Request FY2023 and FY2024 audited financial statements or externally reviewed management
        accounts from CFO Robert Taccini under NDA; compare against similar-stage cybersecurity
        SaaS companies (Synack, NetSPI, Cobalt.io peer benchmarks).
      relatedQuestionRefs: [QI001, QI002, QI015]
      relatedTableRefs: [TI003, TI005]

    - type: private-evidence-only
      severity: material
      topic: debt-covenants
      missingEvidence: >
        Full terms of the October 2024 $50M SVB Enterprise Software Group credit facility, including
        covenant package, interest rate, drawdown schedule, maturity date, and change-of-control
        provisions. SVB acknowledged this is an "expansion" of a prior facility, suggesting
        covenants have been in place since at least the initial credit agreement.
      whyItMatters: >
        Restrictive financial covenants (minimum ARR, leverage limits) can force amendment discussions
        or waivers if the company's growth decelerates, adding refinancing risk and constraining
        strategic flexibility (additional M&A, distributions).
      diligencePath: >
        Request the full SVB credit agreement from CFO Taccini; engage credit counsel to review
        all covenants, default triggers, and change-of-control provisions before any investment.
      relatedQuestionRefs: [QI010, QI016]
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: material
      topic: acquisition-accounting
      missingEvidence: >
        Purchase price, goodwill allocation, earn-out structure, and integration cost schedule for
        both Informer (May 2024) and Mayhem Security (November 2025). Mayhem Security raised $36M
        pre-acquisition; no acquisition price or financing source was disclosed.
      whyItMatters: >
        Unknown acquisition obligations affect true cash burn, balance sheet leverage, and free
        cash flow generation; earnout structures tied to Mayhem integration milestones could
        represent contingent liabilities material to runway assessment.
      diligencePath: >
        Request closing balance sheets, purchase price allocations, and earnout schedules for both
        acquisitions from CFO Taccini; have M&A counsel review representations and warranties.
      relatedQuestionRefs: [QI017]
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        CAC, LTV, net dollar retention, and gross logo churn for FY2022–FY2025. Without these
        metrics, the quality and durability of Bugcrowd's recurring revenue cannot be independently
        verified, and the payback period on growth investment cannot be calculated.
      whyItMatters: >
        NDR above 100% is critical for SaaS valuation at growth-stage multiples; if Bugcrowd's
        customer base is not expanding in aggregate (NDR < 100%), the 40%+ growth rate is entirely
        new-logo-dependent, increasing capital requirements and risk.
      diligencePath: >
        Request monthly cohort-level ARR data, CAC broken down by channel, and ACV distributions
        from Bugcrowd's CRM and finance systems.
      relatedQuestionRefs: [QI005, QI006, QI007]
      relatedTableRefs: [TI003, TI005]

