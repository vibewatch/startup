  - id: funding-capital
    title: Funding History and Capital Structure
    body: >
      Bugcrowd has raised approximately $234M in total capital since founding across five venture
      equity rounds, seed financing, and a dedicated debt facility. The funding trajectory reflects
      a company that built steadily through the 2010s and then executed a step-change raise in 2024
      to fund international expansion, M&A, and AI platform investment.

      The most recent and largest equity event was the $102M Series E in February 2024, led by
      General Catalyst with participation from Rally Ventures and Costanoa Ventures. CEO Dave Gerry
      publicly stated in a TechCrunch interview that the company's valuation was "significantly up"
      from the 2020 Series D, though no specific valuation was disclosed. Multiple independent
      outlets placed the implied valuation above $1B after the round, characterizing Bugcrowd as a
      unicorn. In October/November 2024, Bugcrowd secured an additional $50M growth capital facility
      from Silicon Valley Bank (a division of First Citizens Bank), structured as debt through SVB's
      Enterprise Software Group, designated for AI platform scaling, innovation investment, and
      potential additional M&A. The November 2025 acquisition of Mayhem Security reportedly
      nearly doubled Bugcrowd's valuation according to SecurityWeek reporting, though no official
      figure has been confirmed.

      The investor base is notably diverse, spanning US growth-stage venture (General Catalyst,
      Rally Ventures, Costanoa, Triangle Peak, Paladin Capital), Australian institutional and
      venture capital (Blackbird Ventures, Hostplus), and strategic capital (Salesforce Ventures,
      Industry Ventures). This mix provides both growth-oriented board pressure and deep APAC
      market relationships. The $50M SVB debt facility adds financial leverage to an otherwise
      equity-heavy structure, which may constrain operational flexibility depending on covenant
      terms (which are not publicly disclosed). Total private investment of ~$234M against
      approaching-$100M annual revenue (as of early 2024) implies a capital-efficient trajectory
      relative to many cybersecurity SaaS peers.
