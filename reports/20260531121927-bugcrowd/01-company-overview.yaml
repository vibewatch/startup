  - id: milestones-history
    title: Milestones, Timeline, and Adverse Events
    body: >
      Bugcrowd's corporate history spans from a 2012 Australian startup to a multi-product global
      cybersecurity platform. The company was founded in Sydney, Australia in 2012 by Casey Ellis,
      Chris Raethke, and Sergei Belokamen, who recognized the untapped potential of crowdsourcing
      security expertise in a structured, commercially mediated marketplace. The headquarters
      relocated to San Francisco in 2013, when the company also closed its first seed funding from
      Rally Ventures to support US market expansion.

      The mid-2010s saw accelerating platform investment and customer growth: Series A (2015,
      Costanoa Ventures), Series B (2016, Blackbird Ventures), and Series C (2018, Triangle Peak
      Partners) funded product expansion from a single bug bounty product into VDPs, penetration
      testing, and attack surface management. By fiscal 2019, the PTaaS line had grown 400% YoY
      and Bugcrowd expanded offices into Australia, Bangalore, Costa Rica, London, and Salt Lake
      City. The April 2020 Series D ($30M, Rally Ventures) was announced during the COVID-19
      pandemic, with CEO Ashish Gupta noting a 20% surge in vulnerability reports during March
      2020 as remote work elevated cyber risk.

      Dave Gerry assumed the CEO role in November 2022, initiating an executive team rebuild.
      The February 2024 Series E ($102M) added General Catalyst to the board and unlocked funds
      for acquisitions and international growth. Bugcrowd acquired Informer in May 2024 (ASM
      and continuous pentesting) and Mayhem Security in November 2025 (AI-native security
      testing). In 2023, the platform facilitated discovery of nearly 23,000 high-impact
      vulnerabilities. By October 2024 the customer roster exceeded 1,200. As of May 2026,
      no public record of material regulatory enforcement, data breach at Bugcrowd itself, or
      significant litigation has been identified; however, competitive pressure from HackerOne
      and a declining PeerSpot mindshare (10.4% in May 2026 vs 17.2% a year prior) represent
      ongoing adverse market dynamics the company must address.
