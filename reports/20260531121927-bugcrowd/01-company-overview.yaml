callouts:
  - calloutType: strength
    title: Dual Moat — Data and Community Scale
    body: >
      Bugcrowd's 500,000+ researcher community and 12+ years of proprietary vulnerability data
      in its Security Knowledge Platform represent compounding competitive advantages. The
      CrowdMatch AI is trained on these unique datasets, making the matching algorithm increasingly
      accurate with scale—a flywheel that pure-software competitors cannot easily replicate.
    claimRefs:
      - CO020
      - CO036

  - calloutType: risk
    title: Declining Mindshare Amid Intensifying Competition
    body: >
      Bugcrowd's PeerSpot mindshare in Penetration Testing Services fell from 17.2% to 10.4%
      between May 2025 and May 2026, while competitor HackerOne (12.3%) leads the category.
      This declining trend warrants monitoring; it may reflect the crowded market consolidating
      around a few dominant platforms or customers exploring newer point solutions powered
      by autonomous AI security tools.
    claimRefs:
      - CO033
      - CO034

  - calloutType: risk
    title: Valuation Opacity and Leverage
    body: >
      Bugcrowd has not officially disclosed its valuation despite reports placing it above $1B
      and claims of a near-doubling after the Mayhem acquisition. The addition of $50M in debt
      from SVB creates financial leverage whose covenant terms are not public. Diligence should
      confirm these terms before any investment or partnership decision.
    claimRefs:
      - CO017
      - CO024
      - CO025

