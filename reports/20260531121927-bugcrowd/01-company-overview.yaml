company:
  name: Bugcrowd
chapter:
  number: 1
  title: Company Overview
  summary: >
    Bugcrowd, founded in 2012 by Casey Ellis and two co-founders, is an AI-powered crowdsourced
    cybersecurity platform headquartered in San Francisco, CA. The company raised $102M in a
    February 2024 Series E led by General Catalyst (implied valuation above $1B), followed by
    a $50M SVB debt facility in late 2024, bringing cumulative capital to approximately $234M+.
    Serving 1,200+ enterprise customers—including OpenAI, Google, T-Mobile, and the US DoD—through
    bug bounty, penetration testing, vulnerability disclosure, and attack surface management products,
    Bugcrowd accelerated its AI-native platform strategy through the 2024 acquisition of Informer
    and the November 2025 acquisition of Mayhem Security, which reportedly nearly doubled its
    valuation.

sections:
  - id: company-identity
    title: Identity, Business Model, and Product Suite
    body: >
      Bugcrowd is an AI-powered crowdsourced cybersecurity platform that bridges a global community
      of ethical hackers with enterprises seeking proactive security testing. Founded in 2012 in
      Australia by Casey Ellis, Chris Raethke, and Sergei Belokamen, the company relocated its
      primary headquarters to San Francisco, California, while maintaining a secondary office in
      Sydney, Australia. As of May 2026, Bugcrowd operates a global, predominantly remote workforce
      and serves clients across more than 65 industries in over 29 countries.

      The company pioneered the commercial bug bounty market and has since expanded into a
      multi-product security marketplace. Its core AI-driven CrowdMatch™ technology matches over
      500,000 vetted security researchers to client programs based on more than 100 skill, experience,
      and engagement-fit dimensions. The patented Security Knowledge Platform™ aggregates over 12
      years of proprietary vulnerability data from thousands of engagements, powering threat
      intelligence, triage prioritization, and remediation guidance for enterprise security teams.

      Bugcrowd's business model is a "skills-as-a-service" marketplace: clients pay platform
      subscription and service fees to run Bug Bounty programs, Vulnerability Disclosure Programs
      (VDPs), Penetration Testing as a Service (PTaaS), and Attack Surface Management (ASM)
      engagements. Revenue is generated through SaaS access fees, managed triage services, and
      facilitation fees on researcher payouts. The PTaaS line grew over 75% in 2024, and the
      company added AI Penetration Testing and AI Bias Assessments to its portfolio, targeting the
      rapidly growing AI security use case. In 2024 the company acquired UK-based Informer (adding
      continuous ASM and integrated pentesting) and in November 2025 acquired Mayhem Security
      (adding AI-native automated code, API, and SBOM security testing), creating what Bugcrowd
      describes as the industry's first fully adaptive human-plus-machine security platform.
