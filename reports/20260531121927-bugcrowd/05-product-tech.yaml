callouts:
  - calloutType: strength
    title: "Security Knowledge Graph as Durable Data Moat"
    body: >
      With 12+ years of proprietary vulnerability, asset, and researcher data stored in a graph
      database and powering CrowdMatch AI, engineered triage, and remediation recommendations,
      Bugcrowd's Security Knowledge Graph represents a compounding data advantage that is
      difficult for new entrants to replicate on a comparable timeline.
    claimRefs:
      - CE004
      - CE034

  - calloutType: risk
    title: "Mayhem Integration Timeline Is an Unquantified Execution Risk"
    body: >
      Bugcrowd completed the Mayhem Security acquisition in November 2025 with 11 employees.
      No public integration roadmap or Crowdcontrol unification timeline has been disclosed.
      Failure to integrate Mayhem capabilities smoothly within 12–18 months risks customer
      confusion, product fragmentation, and diluted value from the combined platform claim.
    claimRefs:
      - CE002
      - CE030
      - CE031

  - calloutType: risk
    title: "Moderator Quality Variance Creates Uneven Customer Experience"
    body: >
      Independent reviews on Gartner Peer Insights, TrustRadius, and PeerSpot consistently
      identify moderator and account manager quality as the primary driver of program outcome
      variance. Internal organizational churn has compounded support continuity concerns for
      some enterprise customers.
    claimRefs:
      - CE028
      - CE029

