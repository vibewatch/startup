  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Mayhem integration timeline
      missingEvidence: >
        A detailed technical roadmap and completion timeline for integrating Mayhem Security's
        API, Code, and SBOM capabilities into the Crowdcontrol platform.
      whyItMatters: >
        Without a published integration timeline, customers cannot assess whether the combined
        human+AI platform claim is immediately actionable or a 12–18 month aspiration; this
        affects the valuation thesis.
      diligencePath: >
        Request from Bugcrowd: (1) Mayhem integration roadmap with milestones and target dates;
        (2) which Crowdcontrol UI elements currently surface Mayhem capabilities; (3) customer
        references who have used Mayhem-sourced findings in production.
      relatedQuestionRefs: [QE017]
      relatedTableRefs: [TE005]

    - type: missing-source
      severity: material
      topic: PTaaS capability scope
      missingEvidence: >
        Detailed technical documentation of what PTaaS engagements cover beyond basic external
        web application testing (e.g., internal network, API, mobile, cloud configuration).
      whyItMatters: >
        PTaaS is the fastest-growing revenue line (75%+ in 2024) and its scope breadth
        directly affects enterprise substitutability for traditional pen test firms.
      diligencePath: >
        Obtain Bugcrowd PTaaS engagement scope documentation, sample Statement of Work, and
        at least two customer references who have used PTaaS for compliance (SOC 2, PCI-DSS) audits.
      relatedQuestionRefs: [QE022]
      relatedTableRefs: [TE001]

    - type: missing-source
      severity: minor
      topic: Security Knowledge Graph schema and data governance
      missingEvidence: >
        Independent description of the SKG's data schema, retention policies, researcher
        data handling practices, and quality controls for ingest and deduplication.
      whyItMatters: >
        The SKG is positioned as the core competitive moat; its data quality and governance
        directly determine the accuracy of CrowdMatch AI and triage AI outputs.
      diligencePath: >
        Request from Bugcrowd: SKG architecture documentation, data governance policies,
        any third-party data quality or AI model audits.
      relatedQuestionRefs: [QE003]

    - type: private-evidence-only
      severity: minor
      topic: Triage AI false-positive and false-negative rates
      missingEvidence: >
        Any independent or audited benchmark of the triage AI's false-positive rate (valid
        bugs rejected) and false-negative rate (invalid bugs escalated) at current scale.
      whyItMatters: >
        Triage quality is a primary competitive claim and a key cost driver; unverified
        triage accuracy creates enterprise due-diligence risk.
      diligencePath: >
        Request from Bugcrowd: internal triage accuracy metrics; ask for customer interviews
        with high-volume program owners who can speak to triage rejection rates.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]

