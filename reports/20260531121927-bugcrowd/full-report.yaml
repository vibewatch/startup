            title: Dual Moat — Data and Community Scale
            body: >
              Bugcrowd's 500,000+ researcher community and 12+ years of proprietary vulnerability data in its Security
              Knowledge Platform represent compounding competitive advantages. The CrowdMatch AI is trained on these
              unique datasets, making the matching algorithm increasingly accurate with scale—a flywheel that
              pure-software competitors cannot easily replicate.
            calloutType: strength
            claimRefs:
