      - number: '6.4'
        title: Expansion, Concentration Risk, and Procurement Friction
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's land-and-expand motion is well-documented across its case-study library. The canonical
              progression is: (1) VDP or private bug bounty program → (2) expanded scope and public program → (3) PTaaS
              and/or ASM adoption → (4) platform-level integration into SDLC/DevSecOps pipeline. NAB, Rapyd,
              BigCommerce, and Wise each demonstrate at least two steps of this progression in published case studies.
              The addition of Mayhem Security's automated API, Code, and SBOM capabilities in November 2025 creates a
              fourth paid module that customers can expand into without changing vendors.

              Concentration risk is not quantitatively disclosed. The company has not reported its top- five or top-ten
              customer revenue concentration. The 1,200+ customer count and broadly diversified named logos (technology,
              finance, telecom, media, government, education, IoT/hardware) suggest a reasonably distributed revenue
              base, but the absence of disclosure means dependence on any single large customer—such as a hyperscaler or
              federal agency running a large multi-year managed program—cannot be ruled out.

              Channel partner dependence exceeds 20% of revenue, creating partner-side concentration risk if key
              resellers churn. The Carahsoft government distribution partnership, announced April 2026, adds structured
              government procurement access but concentrates federal sector distribution through a single master
              government aggregator.

              Procurement friction is sector-dependent. Enterprise procurement typically follows a standard SaaS
              evaluation cycle (proof-of-concept scoped program, security review, legal, MSA). The FedRAMP Moderate
              authorization issued February 2026—sponsored by CISA—removes the largest procurement barrier for US
              federal agencies, which previously required independent Agency ATOs. Bugcrowd's platform is available via
              NASA SEWP V contracts NNG15SC03B and NNG15SC27B, OMNIA Partners contract R240303, and E&I cooperative
              contract EI00063~2021MA, enabling streamlined co-operative purchasing at the state and local level. For
              financial services, PCI-DSS and SOC 2 Type II certifications address the primary compliance
              pre-qualifications in the buying process. For European buyers, ISO 27001:2022, ISO 27018, and GDPR
              Standard Model Clauses simplify compliance diligence.

              The lack of published pricing creates friction in SMB evaluation; Bugcrowd's website directs all pricing
              inquiries to a sales conversation, which is standard for enterprise security SaaS but extends evaluation
              timelines versus self-serve competitors. Managed migrations from competing platforms (e.g., HackerOne) are
              offered at no extra cost, reducing switching costs for inbound customers but not materially affecting
              outbound churn risk.
