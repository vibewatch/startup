      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Material Valuation Discrepancy — Forge $506M vs. $2B Media Narrative
            body: >
              Forge Global's COI-based "Series E-1" post-money valuation of $506.24M (October 2025) versus the ~$2B
              implied by SecurityWeek's Mayhem acquisition reporting creates a $1.5B+ unexplained discrepancy. Forge's
              methodology relies on company-submitted Certificate of Incorporation documents—legal filings that capture
              actual capitalization events—rather than press releases. This discrepancy is the single most material
              uncertainty in Bugcrowd's valuation picture and must be resolved through data-room diligence before any
              primary investment decision.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: callout
            title: The Rule of 40 Gap — Growth Without Margin Confirmation
            body: >
              Bugcrowd satisfies the Rule of 40 growth component alone with its reported 40%+ revenue growth. However,
              the profitability component—which requires a positive free cash flow margin to complement growth—is
              unknown. Without audited margins, the Rule of 40 score cannot be computed, and the premium multiple (10x+)
              that the Rule of 40 threshold typically supports for SaaS companies cannot be defensibly assigned.
            calloutType: insight
            claimRefs:
              - CV029
              - CV034
          - type: callout
            title: Entry Discipline — Secondary at Reset Price is More Attractive
            body: >
              At an entry price of $1.2B–$1.5B (achievable through secondary market transactions or a post-down-round
              primary), a base-case exit at $2.5B–$3.0B (12–14x FY2028E revenue of ~$220M in a strategic acquisition)
              delivers a 1.7–2.5x gross return. This risk/return profile is acceptable for a high-conviction secondary
              buyer. It is not acceptable for a primary investor at the $2B informal implied price, where base-case
              returns are flat to negative and downside risk extends to sub-$1B.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
