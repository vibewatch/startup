      - number: '3.3'
        title: Pricing, Engagement Models, and GTM Distribution
        blocks:
          - type: paragraph
            body: >
              Bugcrowd does not publish list pricing; all programs are custom-quoted. Based on contract databases
              tracking real enterprise purchases, average annual SMB pricing is $54,591 and average annual enterprise
              pricing is $79,752, according to SpendHound's dataset of 160 Bugcrowd customers (published May 2026).
              Vendr's pricing analysis provides more granular detail: platform fees for private bug bounty programs
              start at $30,000–$60,000 per year for small-to-medium scope and rise to $75,000–$120,000+ for larger
              configurations; public bug bounty programs run $75,000–$150,000+ annually. Researcher reward budgets are
              paid on top of platform fees—ranging from $50,000 for small private programs to $500,000+ for mature
              public programs at enterprise scale. Total all-in annual cost for a mid-market organization typically
              falls between $100,000 and $300,000; large enterprises with public programs invest $300,000–$1,000,000+
              per year. Multi-year contracts often close at 15–40% below list pricing.

              Costbench's benchmark data (8 verified purchases) shows a median annual contract of $6,500—likely
              reflecting narrow scope entry-level engagements—with monthly pricing ranging from $5,000 to $120,000.
              Bugcrowd's pricing is described as premium relative to Cobalt.io and mid-tier European platforms but
              generally comparable to or below HackerOne for equivalent enterprise scope. At least four documented
              hidden costs exist beyond list price: implementation, training, expanded analytics, and add-on managed
              services that add 15–30% to base platform fees.

              GTM distribution relies on direct enterprise sales (approximately 80% of revenue) and a channel partner
              model that contributed over 20% of revenue as of 2024 CEO guidance, up from a standing start. HackerOne
              similarly relies on direct enterprise sales but has a broader program marketplace that drives self-service
              adoption among smaller organizations. Synack distributes primarily through direct enterprise sales with
              higher average contract values. Intigriti and YesWeHack rely heavily on European public-sector and
              regulated- industry channels, with EU GDPR compliance positioning as a purchasing criterion absent from
              Bugcrowd's default positioning.
