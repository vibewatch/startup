figures:
  - id: FO001
    title: Bugcrowd Corporate Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Chronological view of Bugcrowd's key founding, financing, product, governance, and scale milestones from 2012 to
      2025.
    data:
      items:
        - label: 2012 — Founded
