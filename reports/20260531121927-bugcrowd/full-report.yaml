      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's leadership team was substantially rebuilt starting in late 2022 under CEO Dave Gerry, who
              joined the company in November 2022 from WhiteHat Security where he had served as Chief Revenue Officer
              and Chief Operating Officer. Gerry holds an MBA from Suffolk University and a BA from Merrimack College,
              and brings over a decade of cybersecurity industry experience across organizations including NTT,
              Veracode, Sumo Logic, and The Herjavec Group. Under his leadership the company raised its $102M Series E,
              completed two strategic acquisitions, expanded channel partner revenue to over 20% of the business, and
              posted 40%+ annual revenue growth.

              Chief Financial Officer Robert Taccini, appointed in 2022, brings nearly three decades of finance
              experience including prior CFO roles at WhiteHat Security and HyperGrid, and VP Business Operations
              Finance at Cisco Systems. Chief Information and Security Officer Nicholas McKenzie joined in 2021 from
              National Australia Bank, where he served as Executive General Manager and Chief Security Officer. Chief
              Technology Officer Braden Russell leads engineering. Dr. David Brumley—co-founder of Mayhem Security,
              Carnegie Mellon University professor, and renowned AI security researcher—joined as Chief AI and Science
              Officer following the November 2025 acquisition, adding deep technical AI security expertise to the
              C-suite. Chief Strategy and Trust Officer Trey Ford and Chief Marketing Officer Emily Ferdinando round out
              the current executive team.

              Casey Ellis, the primary public face of Bugcrowd's founding, is listed as "Founder" on the leadership page
              as of May 2026 and has previously held the Chief Strategy Officer title. His ongoing involvement
              represents continuity of founding vision. Board governance strengthened materially after the February 2024
              Series E: Mark Crane (Partner, General Catalyst) and Paul Sagan (Senior Advisor, General Catalyst) joined
              the board, with Sagan assuming the Board Chair role. Advisory board members from T-Mobile and Navan bring
              active enterprise CISO perspectives. The company has experienced notable CEO succession, having been led
              by Ashish Gupta during the Series D era (2020) before Gerry's appointment; this leadership change was
              accompanied by a broader executive team rebuild that positions the company for its current growth phase.
