            title: Declining Mindshare Amid Intensifying Competition
            body: >
              Bugcrowd's PeerSpot mindshare in Penetration Testing Services fell from 17.2% to 10.4% between May 2025
              and May 2026, while competitor HackerOne (12.3%) leads the category. This declining trend warrants
              monitoring; it may reflect the crowded market consolidating around a few dominant platforms or customers
              exploring newer point solutions powered by autonomous AI security tools.
