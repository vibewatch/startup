  - id: FE002
    title: Customer / Researcher Operating Workflow
    type: flow
    layout: standard
    summary: >
      End-to-end lifecycle from program configuration through continuous researcher testing, managed triage, customer
      review, and remediation feedback loop.
    data:
      nodes:
        - id: n1
          label: Customer configures program brief and scope in Crowdcontrol
          detail: Scope, reward table, VRT customization, target access, launch date
        - id: n2
          label: CrowdMatch AI selects and activates matched researchers
          detail: 100+ dimension matching; researcher skills, history, impact; continuous refresh
        - id: n3
          label: Researchers conduct testing and submit vulnerability reports
          detail: Public or invite-only access; markdown-based structured submission; Bugcrowd VRT rating
        - id: n4
          label: ASE triage — validation and prioritization (P1 within 1 business day)
          detail: In-house Application Security Engineers + AI models; CVE assignment via CNA status
        - id: n5
          label: Valid findings routed to customer via Jira, ServiceNow, or webhook
          detail: Bi-directional sync; CVSS-rated; remediation guidance from Security Knowledge Graph
        - id: n6
          label: Customer reviews, accepts, rewards, and remediates; feedback improves SKG
          detail: 7-day acceptance SLO; reward payout; resolved status updates researcher profile
      edges:
        - from: n1
          to: n2
          label: Program launch triggers CrowdMatch
        - from: n2
          to: n3
          label: Activated researchers gain access to targets
        - from: n3
          to: n4
          label: Submission enters triage queue
        - from: n4
          to: n5
          label: Triaged finding pushed to customer tools
        - from: n5
          to: n6
          label: Customer takes action
        - from: n6
          to: n1
          label: Continuous improvement; researcher performance updates SKG
