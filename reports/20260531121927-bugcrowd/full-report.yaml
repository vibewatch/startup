      - number: '2.2'
        title: Sizing the Opportunity—TAM, SAM, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              The market for Bugcrowd's products sits inside the $240 billion global cybersecurity spending envelope
              that Gartner projects for 2026—a 12.5% year-over-year increase from $213 billion in 2025. The relevant
              serviceable available market (SAM) aggregates three analyst-defined sub-segments: bug bounty platforms at
              approximately $2.1 billion (Global Growth Insights, 2026), PTaaS at $0.72 billion (MarketsandMarkets,
              2026), and ASM at $1.25 billion (Fortune Business Insights, 2026), producing a combined SAM of roughly
              $4.1 billion. All three sub-segments exhibit double-digit growth rates: PTaaS at 22.6% CAGR to 2031, ASM
              at 21.0% CAGR to 2034, and bug bounty platforms at 15.84% CAGR to 2035. Within PTaaS, the cloud security
              pentesting sub-segment is forecast to grow at 25.8% CAGR, reflecting the 61% cloud incident rate among
              organizations in 2024.

              Market sizing estimates diverge dramatically depending on the market boundary definition chosen, creating
              a material diligence risk. Narrow estimates focused on crowdsourced security platforms alone range from
              $99.83 million (360 Research Reports, 2026, CAGR 6.2%) to approximately $135–274 million from Cognitive
              Market Research and Research and Markets, reflecting strict crowdsourced-only definitions. Broader
              platform definitions that include enterprise-facing bug bounty, PTaaS, and managed services yield the
              $2.1B figure from Global Growth Insights. Future Market Insights publishes an estimate of $133.2 billion
              for 2025 at a 7.5% CAGR, which appears to capture a broad cybersecurity platform ecosystem far beyond
              crowdsourced testing—rendering it incomparable to platform-centric estimates. This five-order-of-magnitude
              spread between credible analyst estimates underscores why Bugcrowd diligence must anchor on segment-level
              figures from MarketsandMarkets, Fortune Business Insights, and Global Growth Insights rather than blended
              ecosystem numbers. Contradictory estimates should be retained as a signal that no authoritative boundary
              definition has emerged for this market category.
