      - number: '6.2'
        title: Named Customer Proof Points and Case Studies
        blocks:
          - type: paragraph
            body: >
              Bugcrowd publishes a substantial library of customer case studies at bugcrowd.com/customers. The strongest
              evidence concentrates in several production deployments with quantified outcomes rather than generic
              testimonials.

              National Australia Bank (NAB), Australia's largest business bank serving eight million customers across
              900+ locations, adopted Bugcrowd in a staged progression from VDP to public bug bounty. NAB cited the
              program as providing a new talent pipeline of security researchers, a low false-positive rate at no retest
              cost, and discovery of "numerous critical findings" that complemented existing assurance controls. NAB has
              since expanded pen testing services with Bugcrowd beyond the initial engagement.

              Rapyd, a UK-based global fintech payments platform, transitioned to Bugcrowd during a period of major
              acquisitions when its core API-heavy business required specialized testing. Bugcrowd's CrowdMatch
              technology connected Rapyd with hackers matching its API security skill profile. In the first program
              year, 15 critical vulnerabilities and approximately 40 total vulnerabilities were discovered. Rapyd's
              average time-to-fix across all severity levels is 18 days versus an industry average of 31 days—a 42%
              improvement.

              Wise (formerly TransferWise), a global money-transfer platform, started with a private bug bounty program
              and received its first valid critical ("P1 Business Critical") vulnerability within 24 hours of launch.
              CISO Shan Lee stated the finding "would not have been discovered in a traditional penetration test,"
              directly validating the incremental discovery value of crowdsourcing over compliance-check pentesting.

              Atlassian, the enterprise collaboration software company, engaged Bugcrowd on quarterly bespoke
              methodology assessments covering partner marketplace applications. Senior Manager of Security Vlad
              Yastreboff noted that Bugcrowd "hit the ground running" and delivered a full vulnerability report across
              all high-risk partner apps in nine weeks. CISO Adrian Ludwig publicly stated "it's a win-win situation."

              BigCommerce (Nasdaq: BIGC) operated a private bug bounty since 2020 before launching a public program with
              Bugcrowd. In the private program, nearly 500 researchers participated and more than 75% of vulnerabilities
              were validated within four days of submission; 114 vulnerabilities were rewarded. The public program
              extended scope and researcher participation further.

              OpenAI launched its bug bounty program exclusively on Bugcrowd's platform in April 2023. In March 2025,
              OpenAI increased its maximum bounty payout from $20,000 to $100,000 for "exceptional and differentiated
              critical findings," citing commitment to rewarding meaningful, high-impact security research. The
              Bugcrowd-hosted program covers OpenAI's services and infrastructure (excluding model safety/jailbreaks),
              with roughly 75% of submissions triaged within seven days and over 200 bounties awarded as of early 2025.

              The 2024 Forrester TEI study (commissioned by Bugcrowd, based on surveys of 39 decision- makers and four
              practitioner interviews) found a composite enterprise buyer realized 268% ROI and $1.43M net present value
              over three years, avoided two full-time security hires, reduced traditional penetration-test costs by 60%,
              reduced material breach risk by up to 30%, and reduced cybersecurity insurance premiums by 9%.
