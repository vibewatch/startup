  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Module Architecture
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's commercial offering is organized around four core products delivered through its Security
              Knowledge Platform™ SaaS infrastructure: Managed Bug Bounty, Vulnerability Disclosure Program (VDP),
              Penetration Testing as a Service (PTaaS), and External Attack Surface Management (EASM, formerly Informer
              following the 2024 acquisition). Each product targets a distinct phase of a customer's offensive security
              lifecycle—from continuous crowdsourced vulnerability discovery and coordinated disclosure to
              compliance-mandated pen testing and external attack surface visibility.

              The November 2025 acquisition of Mayhem Security (formerly ForAllSecure) materially expanded the
              portfolio. Mayhem contributes three AI-native capabilities: API Security testing (fully automated,
              replacing manual methods), Code Security (continuous automated testing to ship secure code faster), and
              Dynamic SBOM profiling (runtime application analysis for identifying risky and unused third-party
              dependencies). Mayhem also provides reinforcement learning environments for builders of foundational large
              language models. This creates what Bugcrowd describes as the industry's first truly adaptive,
              human-plus-machine security platform—combining crowdsourced human ingenuity with autonomous AI-driven
              testing across the full software development lifecycle, from development to production.

              Bug Bounty is the mature flagship product. The platform's Engagement Simulator, built on data from
              thousands of past programs, lets customers forecast submission volumes, reward spend, and scope tradeoffs
              before going live. Managed migrations from competing platforms are offered at no extra cost, reflecting a
              "crawl, walk, run" maturity model. VDP supports responsible disclosure under defined terms, with
              multi-method submission, engineered triage, integrations, and reporting. The PTaaS line claimed 75%+
              growth in 2024 and supports AI Penetration Testing and AI Bias Assessments as newer SKU extensions.
