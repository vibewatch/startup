      - number: '8.2'
        title: Comparable Company and Transaction Lens
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's valuation must be triangulated across two comp universes: public cybersecurity SaaS companies
              and comparable M&A transactions. The public market as of Q1 2026 is defined by significant dispersion. At
              the premium end, CrowdStrike (CRWD) trades at approximately 18.6x NTM EV/Revenue (35x LTM per multiples.vc
              data), reflecting platform leadership, 75% gross margins, and a path to GAAP profitability; Palo Alto
              Networks (PANW) trades at approximately 20.5x LTM revenue. At the compression end, SentinelOne (S) trades
              at 3.52x NTM EV/Revenue as investors price in its profitability trajectory, while Rapid7 (RPD) has
              compressed to approximately 0.85x LTM revenue ($855M EV against $851M LTM revenue)—a cautionary floor
              reference for what happens when platform growth stalls and competitive moat narrows. The sector-wide
              cybersecurity median is approximately 7.8x revenue per Windsor Drake's Cybersecurity Valuation Report
              2026; the SaaS Capital Index public SaaS median was 6.4x in Q1 2026, while Aventis Advisors'
              post-AI-disruption-adjusted index reads 3.4x.

              On the M&A side, the 2025 transaction set illustrates the bifurcation between "platform" and "feature"
              asset pricing. Google's $32 billion acquisition of Wiz (~32x ARR) represents a hyperscaler strategic
              premium unachievable for most private companies. Veeam's $1.7 billion acquisition of Securiti AI (~11x
              ARR) and Palo Alto Networks' $25 billion acquisition of CyberArk (~18.6x ARR) reflect AI-native and
              identity-security premiums. Francisco Partners' $2.2 billion take-private of Jamf (~3x ARR) illustrates
              the PE-floor pricing for profitable but slower-growth DevMgmt assets. The Solganick Q4 2025 report and
              Mergermarket Dealspeak 2026 analysis confirm that high-growth cybersecurity companies (>20% revenue
              growth) achieved a 2025 median M&A multiple of 13.7x, while slow-growth peers averaged 3.5x; current 2026
              deal discussions cluster at 6x–8x ARR for most transactions, with only highly strategic assets commanding
              8x–10x. Bugcrowd's estimated 40%+ revenue growth trajectory—if confirmed by audited financials—positions
              it in the premium bucket, but the absence of verification is a material gating factor for any multiple
              assignment above 8x.
