  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Private Valuation Evidence
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's private valuation is defined by three publicly observable data points in unresolved tension.
              The first anchor is the February 2024 Series E: $102 million raised led by General Catalyst at an implied
              valuation above $1 billion, with multiple media outlets characterizing the company as achieving unicorn
              status after CEO Dave Gerry stated the valuation was "significantly up" from the Series D. The second
              anchor is the November 2025 Mayhem Security acquisition: SecurityWeek—citing direct communication from
              Bugcrowd—reported that the transaction "nearly doubled" the company's valuation from its post-Series E
              baseline above $1B, implying an informal post-acquisition implied valuation approaching $2 billion, though
              no official confirmation has been made public. The third anchor—and the most adversarially significant—is
              Forge Global's reported post-money valuation of $506.24 million for a "Series E-1" round as of October
              2025, derived from company-submitted Certificate of Incorporation (COI) data. Forge explicitly states its
              methodology uses COI-based capitalization rather than press-release narratives, and its $506M figure
              stands in unexplained conflict with the $2B media characterization. This discrepancy may reflect a
              separate financing tranche, a preference-based liquidation analysis, or a methodological difference—but it
              is unexplained in public sources and constitutes a material adverse signal for investors anchoring to the
              $2B mark.

              Revenue context: CEO Gerry disclosed "approaching $100 million" in total revenue growing over 40% annually
              in February 2024. Applying this trajectory implies approximately $140M–$160M by end of FY2025 and
              $170M–$185M by end of FY2026 assuming moderate deceleration to 25–30% growth. Total cumulative capital
              stands at approximately $234M ($184M equity across five rounds plus $50M SVB debt facility). No audited
              financial statements exist publicly as of May 2026. Secondary market shares traded at approximately $1.62
              per share on notice.co and private platforms, but the implied market capitalization cannot be derived
              without the outstanding share count. Bugcrowd has not filed a formal S-1 or announced an IPO timeline as
              of May 2026; the company remains private with secondary trading available through Forge, EquityZen, and
              Nasdaq Private Market.
