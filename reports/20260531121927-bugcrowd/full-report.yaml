      - number: '8.4'
        title: Capital Structure, Dilution Overhangs, and Adverse Valuation Signals
        blocks:
          - type: paragraph
            body: >
              Several capital structure and market-context factors compound the valuation uncertainty. First, the $50M
              SVB Enterprise Software Group debt facility (closed October 2024) carries undisclosed covenant terms;
              restrictive provisions such as minimum ARR growth thresholds, maximum leverage ratios, and
              change-of-control triggers are standard in growth-capital facilities and could constrain future M&A,
              restrict dividends or distributions, or force dilutive equity raises if revenue targets are missed. No
              covenant terms have been disclosed publicly, creating a material diligence gap for any prospective
              investor.

              Second, with approximately $184M in equity raised across five rounds plus the $50M SVB debt facility, the
              preference stack is substantial. In any sub-$1B exit scenario, common shareholders and employee option
              holders would absorb disproportionate dilution through the liquidation waterfall. Anti-dilution provisions
              standard in preferred stock (broad-based weighted-average or, less commonly, full-ratchet) mean a
              down-round financing would amplify dilution beyond headline share issuance. The full capitalization table
              is not publicly available, making preference-adjusted return modeling impossible without data-room access.

              Third, the Forge Global COI-derived valuation of $506.24M is an adverse and unexplained signal. Forge's
              methodology explicitly relies on company-submitted Certificate of Incorporation documents rather than
              press releases; the $506M post-money assigned to the "Series E-1" in October 2025 implies that some
              financing event in or around October 2025—coinciding with the SVB facility close or Mayhem acquisition
              structure—established a formal per-share price well below the $1B+ unicorn narrative, representing what
              would effectively be a flat or down event versus the February 2024 Series E. Without the underlying COI
              document, this interpretation cannot be confirmed, but the discrepancy is $1.5B+ wide and materially
              relevant.

              Fourth, macro conditions present structural headwinds. Aventis Advisors' SaaS index compressed to 3.4x
              median EV/Revenue by March 2026 under AI disruption fears, and the SaaS Capital Index stood at 6.4x—both
              down from peak levels. Cybersecurity M&A deal discussions are clustering at 6x–8x ARR per Mergermarket
              2026 data, with the Nasdaq CTA Cybersecurity Index down 14% from its October 2025 high. Private company
              valuations have "slid well below the levels seen during the 2021–2022 funding boom" according to ION
              Analytics. Down rounds hit 22% of all US VC deals in Q2 2024 per Kimball Esq.'s analysis. Companies that
              raised at peak 2021–2024 multiples and have not grown into those valuations face the most pressure.
