  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Current Mitigation
      - Diligence Ask
    rows:
      - - CrowdMatch AI and 12-year proprietary vulnerability dataset
        - >-
          HackerOne and Synack investing in competing AI models (Hai Triage, Sara AI); dataset advantage could narrow as
          competitors accumulate similar depth
        - Medium
        - >-
          Bugcrowd's dataset spans bug bounty + PTaaS + VDP + ASM across 12 years; more cross-product breadth than
          single-category peers
        - >-
          Assess whether Bugcrowd's vulnerability taxonomy and cross-product learning create compounding advantages not
          easily replicated, or whether AI APIs commoditize triage intelligence
      - - 500K+ vetted researcher community and CrowdMatch matching
        - >-
          AI-generated submissions flooding the researcher community's signal value; HackerOne's larger community
          (1.5M+) offers more raw volume
        - High
        - Policy enforcement (submission bans, suspensions, identity verification); AI detection of low-quality reports
        - >-
          Measure valid submission rate (valid/total) over time; assess whether AI noise is disproportionately affecting
          Bugcrowd vs. HackerOne; model long-term researcher incentive structure
      - - CISA federal VDP contract and government segment anchoring
        - >-
          Contract renewal risk; competing proposals from HackerOne or new entrants at re-bid; policy changes reducing
          mandatory VDP scope
        - Low-Medium
        - >-
          50+ FCEB agencies onboarded with institutional process dependency; EnDyna co-management creates administrative
          moat
        - >-
          Verify contract term and renewal timeline; assess likelihood of competitive re-bid; map which agencies could
          switch vendors
      - - Full-platform integration (BBP + VDP + PTaaS + ASM + AI)
        - >-
          Competitors building comparable suites: HackerOne expanding PTaaS, NetSPI expanding ASM, Synack adding AI
          automation; potential unbundling if buyers prefer best-of-breed
        - Medium
        - >-
          Mayhem Security (November 2025) added AI-native code/API/SBOM testing; Informer (2024) added continuous ASM;
          creating cross-sell lock-in
        - >-
          Assess platform integration depth (single pane of glass vs. bolt-on acquisitions); measure multi-product
          attach rate and retention vs. single-product customers
      - - AI-generated submission flooding as industry-wide structural risk
        - >-
          Platforms that cannot cost-effectively filter AI noise may see customer churn as program ROI declines;
          freelance AI tools could commoditize basic vulnerability discovery
        - High
        - >-
          Bugcrowd implementing tiered enforcement policy; investing in AI detection of fake reports; 'Quality Era'
          industry-wide governance shift
        - >-
          Track quarterly valid submission rate and customer NPS alongside submission volume growth; assess whether
          enforcement overhead is structurally absorbed or creates a cost structure disadvantage
    notes: >
      Severity ratings (Low / Low-Medium / Medium / High) are qualitative assessments based on the evidence gathered
      through May 2026; no quantitative probability model was applied. The AI submission flooding risk is assessed as
      High because the structural economics of the threat—AI report generation at near-zero marginal cost—are not
      reversible by enforcement alone and may require fundamental platform redesign. The CISA contract risk is rated
      Low-Medium because government switching costs are high and no competing bid has been publicly disclosed.
