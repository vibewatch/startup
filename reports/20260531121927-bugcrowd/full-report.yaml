  - id: FV004
    title: Investment KPI Scorecard — Bugcrowd Valuation Assessment
    type: kpi
    layout: standard
    summary: >
      IC-ready scoring across seven key investment dimensions for Bugcrowd as of May 2026. Scores reflect publicly
      available evidence; private or undisclosed metrics are noted.
    approximationNotes: >
      All scores are qualitative assessments on a 1–10 scale based on available public evidence. Dimensions marked
      "estimate" rely on CEO disclosures, third-party benchmarks, or analytical inference rather than audited data.
      Scoring methodology follows standard pre-investment scorecard conventions for growth-stage private cybersecurity
      companies.
    claimRefs:
      - CV009
      - CV014
      - CV025
      - CV031
      - CV033
      - CV039
      - CV041
    data:
      items:
        - label: Market Opportunity
          value: 8/10
          detail: >-
            Large addressable market (crowdsourced security, PTaaS, ASM); 12.5–22.6% CAGR across sub-segments; AI-driven
            threat expansion validates continued demand growth
          tone: positive
        - label: Revenue Growth Evidence
          value: 6/10
          detail: >-
            CEO-confirmed 40%+ YoY growth at $100M+ base (Feb 2024); no audited verification; estimate only; score
            deducted for opacity
          tone: neutral
        - label: Platform Moat and Differentiation
          value: 7/10
          detail: >-
            Proprietary CrowdMatch AI; 12-year vulnerability dataset; FedRAMP authorized; Mayhem AI acquisition; 500K+
            vetted researchers; deducted for HackerOne mindshare leadership
          tone: positive
        - label: Financial Transparency and Quality
          value: 3/10
          detail: >-
            No audited financials; no NRR, gross margin, or CAC/LTV publicly disclosed; Forge $506M vs. $2B discrepancy
            unexplained; SVB covenants undisclosed
          tone: negative
        - label: Capital Structure Risk
          value: 4/10
          detail: >-
            $184M equity preference stack; $50M SVB debt with undisclosed covenants; Forge COI data implies possible
            down-round event; no cap table available
          tone: negative
        - label: Valuation Attractiveness
          value: 4/10
          detail: >-
            $2B informal mark is 40–65% above base-case DCF/comp range; only justified in 20% bull scenario; secondary
            market at $1.62/share implies uncertainty; Stretched stance
          tone: negative
        - label: Exit Visibility
          value: 6/10
          detail: >-
            Strong strategic buyer universe (CrowdStrike, Palo Alto, hyperscalers); IPO window reopening (Netskope Sep
            2025 precedent); FedRAMP makes federal acquisition possible; no S-1 or confirmed IPO timeline as of May 2026
          tone: neutral
