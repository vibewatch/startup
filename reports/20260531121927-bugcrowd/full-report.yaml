  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger Event
      - Threshold / Observable Signal
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth deceleration
        - Any public or diligence-revealed figure showing YoY revenue growth below 20% for any recent period
        - >-
          Collapses the 40%+ growth narrative; pushes applicable multiple toward 3–5x (Rapid7-tier); base-case valuation
          drops below $1B
        - Exit secondary position or write down; do not enter primary until new lower anchor confirmed
      - - SVB covenant breach or distress signal
        - Any public notice of covenant violation, forced amortization, credit facility amendment, or restructuring
        - >-
          Signals operational distress; constrains M&A and exit; may trigger investor rights and governance changes;
          accelerates bear-case probability
        - Halt primary diligence; probe covenant terms; assess dilutive equity-raise risk
      - - Down round or flat financing below $1B
        - >-
          Any new primary equity round at a per-share price implying post-money valuation below $1B; or a
          secondary-market price collapse below $1.00/share
        - >-
          Confirms overvaluation at the $2B implied price; preference waterfall analysis becomes critical; common-share
          dilution amplified by anti-dilution provisions
        - >-
          Avoid until new capitalization structure is visible; assess anti-dilution impact on common; may create
          attractive secondary entry at post-down pricing
      - - HackerOne IPO at premium valuation
        - >-
          HackerOne S-1 filed with disclosed revenue above $150M and valuation above $2B; or secondary trades above
          $10/share
        - >-
          Resets peer benchmark for crowdsourced security platforms; clarifies public multiple environment; Bugcrowd
          upward or downward re-rating depends on relative metrics
        - Monitor IPO pricing and comparable multiples; use as real-time market read on Bugcrowd pricing
      - - AI triage margin collapse
        - >-
          Evidence of valid submission rates falling below 3% platform-wide, or management disclosure of triage COGS
          growing faster than 25% YoY without equivalent revenue growth
        - >-
          Destroys platform economics; managed-program gross margins compress toward 20–30%; multiple re-rates toward
          "AI-disrupted" bucket (sub-4x); HackerOne IBB pause is early signal this risk is materializing
        - >-
          Exit; AI substitution thesis confirmed; revisit at sub-$600M entry if AI defensive measures demonstrate
          efficacy
    notes: >
      Threshold definitions are qualitative and indicative rather than contractually defined. All triggers are based on
      publicly observable signals or data-room evidence that a prospective investor would be able to monitor. The list
      is not exhaustive; additional triggers related to regulatory changes (FedRAMP suspension, GDPR enforcement
      action), customer concentration loss (OpenAI or DoD program cancellation), or leadership departure could also
      break the thesis.
