      - number: '5.2'
        title: Platform Architecture, AI Engine and Integrations
        blocks:
          - type: paragraph
            body: >
              The platform's technical architecture centers on two proprietary AI assets: CrowdMatch™ and the Security
              Knowledge Graph. The Security Knowledge Graph is a graph-database infrastructure storing 12+ years of
              vulnerability data, asset profiles, researcher performance histories, remediation steps, and attack
              surface intelligence from thousands of engagements. It provides the data substrate for four platform
              capabilities: researcher matching, engineered triage, reporting/analytics, and remediation
              recommendations.

              CrowdMatch AI draws on the Security Knowledge Graph to match researchers and penetration testers to
              customer programs across 100+ dimensions. The matching algorithm evaluates the complete portfolio of a
              researcher's Bugcrowd history—points and rewards earned, skills, report volume, report and communication
              quality, testing accuracy, depth, and aggregate report impact—and continuously updates assessments as new
              data arrives. This is Bugcrowd's primary claimed differentiation versus competitors that activate
              researchers with less data-driven selection processes.

              The platform's SaaS portal, Crowdcontrol (tracker.bugcrowd.com), is FedRAMP moderate-authorized for US
              government deployment. Pre-built connectors span 19 named integrations: Jira (bi-directional ticket sync),
              GitHub (multi-repository support), ServiceNow (IT Incident, Security Incident, and Vulnerability Response
              with two-way sync), Azure Boards, Trello, IBM SOAR, Kenna, Qualys, Nucleus, Slack, Microsoft Teams,
              HackEDU, Code Warrior, PagerDuty, Splunk On-Call, Nuclei, Cloudflare Zero Trust, and Opsgenie—plus
              outgoing webhooks and a REST API for custom integrations. Webhooks use HMAC-SHA256 signature validation
              with configurable event triggers.

              In Q4 2025 Bugcrowd released two additional platform capabilities: AI Connect and Asset View. AI Connect,
              built on the open-source Model Context Protocol (MCP), provides secure read-only integration between a
              customer's internal AI tools and live Bugcrowd vulnerability data, with role-based access controls intact.
              Asset View unifies EASM-discovered assets with offensive testing workflows into a single inventory and
              scoping interface.
