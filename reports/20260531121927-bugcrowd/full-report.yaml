      - number: '5.4'
        title: Trust, Security Compliance and Quality Controls
        blocks:
          - type: paragraph
            body: >
              Bugcrowd operates a dedicated Trust Center (trust.bugcrowd.com) hosted on SafeBase and holds a broad set
              of third-party certifications covering information security, cloud data privacy, government authorization,
              and payment security. The certification stack includes SOC 2 Type II (Security, Availability,
              Confidentiality), SOC 3 (public summary), ISO 27001:2022 (ISMS), ISO 27018 (personal data in cloud),
              FedRAMP at moderate impact level, CSA STAR Level 1 (self-assessed), NIST alignment, and PCI-DSS
              (QSA-assessed). This breadth of attestations is material for enterprise procurement, particularly in US
              federal, financial services, and regulated industry verticals.

              The FedRAMP moderate authorization is a significant differentiator, enabling US federal agencies to use
              the platform for offensive security testing. Bugcrowd also adopted GDPR Standard Model Clauses and a Data
              Processing Addendum covering consent, data portability, right to be forgotten, right to restrict
              processing, and international data transfers. ISO 27001 certification maps to most GDPR obligations,
              providing an integrated compliance posture.

              Bugcrowd has run its own bug bounty program on internal and external targets since 2013—a concrete signal
              that the company uses its product as a self-assurance control. The PCI-DSS assessment is performed by a
              PCI Qualified Security Assessor (QSA), and the platform supports customers in meeting PCI-DSS, SOC 2,
              HIPAA, DORA, NIS2, and CISA BOD 20-01 mandates.

              Diligence gaps in the compliance posture include: the CSA STAR Level 1 is self-assessed with no
              third-party attestation; the most recent SOC 2 Type II report, ISO 27001 certificate expiry date, and
              latest PCI-DSS QSA assessment date are not publicly disclosed (access typically requires NDA); and the
              scope of Bugcrowd's FedRAMP authorization boundary (i.e., which platform modules are in-scope) is not
              documented publicly.
