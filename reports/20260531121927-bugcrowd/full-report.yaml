  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Vertical Coverage
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's paying customer base exceeded 1,200 organizations as of October 2024, up from approximately 850
              in October 2023—a 41% year-on-year gain confirmed in the SVB debt facility press release. CEO Dave Gerry's
              2024 year-in-review disclosed that the company added over 300 net-new customers during FY2024 and
              maintained nearly 2,000 live engagements on the platform simultaneously, spanning Bug Bounty, VDP, PTaaS,
              and EASM engagements. The company states it operates across 65+ industries in 29+ countries, reflecting a
              deliberately horizontal go-to-market that prioritizes any organization with a material digital attack
              surface.

              Segment analysis based on named references and case studies reveals five primary buyer clusters. First,
              large-cap technology firms (Atlassian, OpenAI, Google, BigCommerce, Cloudinary, Outreach) use Bugcrowd for
              continuous crowdsourced testing of externally exposed applications, APIs, and SaaS products, and
              frequently expand from private bug bounty to public programs and PTaaS. Second, financial services and
              fintech players (Rapyd, Wise, Kenna Security) drive use cases centered on API security, PCI-DSS compliance
              alignment, and continuous testing during M&A-period attack surface expansion. Third, telecommunications
              and media companies (T-Mobile, TX Group) leverage the platform for large-scope public programs and
              DevSecOps integration. Fourth, public sector and education organizations (US CISA, Monash University,
              Minnesota Secretary of State, Code.org, Schoology) access Bugcrowd through the FedRAMP-authorized
              government SKU and, from April 2026, via Carahsoft government procurement vehicles including NASA SEWP V
              and OMNIA Partners contracts. Fifth, IoT and hardware vendors (Axis Communications, NETGEAR, Motorola,
              Fitbit, Aruba Networks) use scoped private programs to address firmware and embedded-OS vulnerability
              discovery—a segment reinforced by the 2025 Inside the Mind of a CISO report's finding of an 88%
              year-over-year increase in hardware vulnerabilities.

              Channel partner revenue exceeded 20% of total revenue in FY2024, indicating meaningful distribution
              through VARs and managed-security-service providers. The Carahsoft partnership formalizes public sector
              distribution but specific agency names under FedRAMP deployment have not been publicly confirmed as of May
              2026.
