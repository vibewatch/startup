  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - FY2023–FY2025 audited P&L, balance sheet, and cash flow; Big-4 auditor preferred
        - >-
          Confirms or refutes CEO's $100M revenue claim and 40%+ growth; reveals true COGS, blended gross margin, burn
          rate, and net cash position; prerequisite for any valuation model
        - Request via NDA from CFO Robert Taccini; require Big-4 audited statements if available
      - - SVB debt covenant terms
        - >-
          Full credit agreement including financial covenants (minimum ARR, maximum leverage), interest rate, maturity
          date, drawdown schedule, and change-of-control provisions
        - >-
          Covenant breach risk determines downside scenario constraints; change-of-control clauses affect M&A exit
          optionality; undisclosed terms represent an unquantifiable contingent liability
        - Request from CFO; legal review of credit agreement; benchmark against SVB ESG standard terms
      - - Capitalization table
        - >-
          Full cap table showing preference stack by series, common share count, option pool size, and any warrants or
          convertible instruments
        - >-
          Required for preference-adjusted return modeling; determines actual return to common vs. preferred in any exit
          scenario; identifies anti-dilution exposure in down round
        - Request from CFO/General Counsel via NDA; verify against Forge COI data
      - - Net revenue retention and gross dollar retention
        - NRR by cohort for at least 2 years; gross logo churn rate; net new vs. expansion ARR split
        - >-
          Core SaaS quality metric; determines whether growth is organic or reliant on new-logo acquisition; NRR above
          120% required for premium (10x+) multiple justification
        - Request from CEO/CFO; benchmark against Bessemer NDR benchmarks (>120% = excellent)
      - - Mayhem acquisition financial terms
        - >-
          Acquisition price, earn-out structure, Mayhem P&L at time of acquisition, integration budget, and Dr. Brumley
          retention terms
        - >-
          Validates "nearly doubled valuation" claim; reveals earn-out risk if Mayhem technology milestones are not met;
          integration costs affect burn rate and gross margin
        - Request from CFO; review Mayhem pre-acquisition financials separately
      - - Forge $506M COI valuation basis
        - >-
          Underlying COI document filed with Forge that generated the $506.24M "Series E-1" post-money valuation; or
          confirmation from company that no new equity round was closed at that price
        - >-
          A $1.5B+ unexplained discrepancy between COI-based ($506M) and media-reported ($2B) valuation is material; if
          the COI reflects a real financing event, it could indicate an undisclosed down round or structured tranche
        - >-
          Request COI document from General Counsel; verify against Forge's methodology disclosure; seek company
          clarification on what constitutes the "Series E-1"
    notes: >
      Diligence items are listed in approximate priority order from highest to lowest urgency. Items 1–3 (audited
      financials, SVB covenants, cap table) are absolute prerequisites for any primary investment decision. Items 4–6
      are required for valuation model refinement and scenario probability weighting. All items are standard in
      data-room access for growth-stage cybersecurity investments.
