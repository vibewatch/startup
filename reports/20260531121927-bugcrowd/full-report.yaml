      - number: '5.3'
        title: Researcher and Customer Workflow Operations
        blocks:
          - type: paragraph
            body: >
              Bugcrowd's operational model distinguishes it from a pure self-serve marketplace: a staffed in-house team
              of Application Security Engineers (ASEs) triages every inbound submission before escalation to the
              customer. ASEs serve as the primary quality gate, validating vulnerabilities against scope and technical
              criteria and communicating directly with researchers on clarification requests.

              The platform publishes explicit triage service-level objectives (SLOs). P1 (critical) issues are actioned
              within one business day. All new submissions are actioned within three business days (Pacific Time
              business hours; federal holidays excluded). Customers in turn are expected to accept triaged submissions
              within seven days to preserve researcher engagement—lengthy acceptance delays are documented to correlate
              with lower submission volumes over time. Premium SLA tiers offering faster turnaround and non-business-day
              coverage are available by contract.

              The researcher side of the platform supports public and invite-only programs, with researchers accessing
              submissions via the Crowdcontrol portal and reporting through structured templates. Bugcrowd's
              Vulnerability Rating Taxonomy (VRT)—an open-source taxonomy maintained on GitHub with 539 stars and 125
              forks as of May 2026—defines baseline priority ratings for common vulnerability types and may be
              customized per program brief. Bugcrowd is an official CVE Numbering Authority (CNA), enabling CVE
              assignment for eligible platform-discovered vulnerabilities.

              Bugcrowd's 2026 Inside the Mind of a Hacker report (based on 2,000+ respondents) found that 82% of ethical
              hackers now use AI in their workflows (up from 64% in 2023), and 72% believe team collaboration yields
              better results—with 61% finding more critical vulnerabilities in teams. These trends increase the volume
              and complexity of researcher-generated findings flowing into the triage pipeline, raising the operational
              bar for the ASE team and AI-assisted triage systems.

              Independent reviews on Gartner Peer Insights and PeerSpot highlight two recurring limitations: moderator
              and account manager quality variance (a good moderator delivers materially stronger program results per
              TrustRadius), and internal organizational churn that has led to support continuity concerns among some
              enterprise customers. One Gartner review (rated 1 star, Feb 2019) cited explicit scope violations by
              Bugcrowd staff and researchers—though this represents an isolated older case, it was surfaced in the 2026
              Gartner review set.
