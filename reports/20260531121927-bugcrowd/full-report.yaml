      - number: '8.3'
        title: Revenue Multiple Ranges and Scenario Framing
        blocks:
          - type: paragraph
            body: >
              Three scenarios frame Bugcrowd's investable valuation range. The base case (55% probability weight)
              assumes 25–30% revenue growth sustaining from the ~$140M FY2025 baseline, FedRAMP contributing $10–15M in
              incremental federal revenue, Mayhem integration proceeding without major disruption, and AI headwinds
              remaining contained. This yields estimated FY2026 revenue of $170–185M. Applied against a 7–9x
              sector-median multiple, the implied valuation is $1.2B–$1.7B. At the midpoint ($1.4B), this is 30% below
              the informally reported $2B mark, suggesting the current entry price is stretched for base-case
              expectations.

              The bear case (25% probability) assumes growth decelerates to 15–20%—triggered by AI triage cost inflation
              compressing managed-program margins, increased competitive pressure from HackerOne and Synack, or SVB
              covenant headwinds constraining operational flexibility. Estimated FY2026 revenue of $150–165M applied
              against a 3–5x multiple (consistent with Rapid7-tier multiple compression for decelerating platforms)
              implies a valuation of $450M–$825M. This range overlaps with Forge's COI-based $506M figure, suggesting
              the bear case is not implausible if growth stalls and the COI data reflects a post-compression round. At
              $450M–$500M, common shareholders face significant liquidation preference waterfall losses given the $184M
              cumulative equity preference stack.

              The bull case (20% probability) assumes 35%+ revenue growth sustained—FedRAMP unlocking $25–30M in federal
              bookings, Mayhem's AI-native code and API security driving platform NRR above 130%, and market re-rating
              to 12–15x on the AI-adaptive-security-platform narrative. Estimated FY2026 revenue of $190–215M at 12–15x
              yields an implied valuation of $2.3B–$3.2B, justifying and exceeding the $2B informal mark. The Windsor
              Drake Revenue Growth vs. Multiple Correlation table supports this: companies growing 30%+ achieved an
              average multiple of ~16x in M&A; companies growing 20–30% averaged ~8.5x. The Bugcrowd bull thesis
              requires both growth confirmation and the market remaining receptive to crowdsourced-security platform
              stories as distinct from AI-commoditized penetration testing.
