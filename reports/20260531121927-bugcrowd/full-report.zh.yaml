  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场与竞争风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Bugcrowd 在 Bug Bounty Platforms（BBP）类别中占据第二位，PeerSpot 心智份额为 33.7%，落后于 HackerOne 的 37.4%。在
              Penetration Testing Services（PTS） 类别中，Bugcrowd 位列第三，心智份额为 10.4%，同比从 17.2% 下滑；HackerOne 的 PTS 份额也从 21.5% 降至
              12.3%。这说明两家既有平台都在一个不断扩大的竞争场中丢份额， 竞争者包括 Synack、Intigriti、YesWeHack、NetSPI、Cobalt.io，以及专注 Web3 的专业平台。
              HackerOne 的研究员社区超过 150 万人，而 Bugcrowd 为 500,000，这让 HackerOne 在项目量和 企业品牌认知上拥有结构性规模优势。

              Synack 的邀请制、人机混合渗透测试模式瞄准高端企业细分市场，单个漏洞赏金范围为 $2,000–$100,000+，显著高于 Bugcrowd 标准项目通常的 $300–$5,000 区间。Synack 和
              NetSPI 都在加深托管渗透测试能力，直接竞争 Bugcrowd 的 PTaaS 产品线。欧洲市场由 Intigriti （总部比利时，100,000+ 研究员）和
              YesWeHack（总部法国，面向政府和受监管行业）争夺； 两者在没有美国中心化企业流程开销的情况下提升心智份额。

              核心竞争风险有两层：（1）HackerOne 可通过定价灵活性或自动化改善重新夺回企业心智份额； （2）“其他”类别（Intigriti、YesWeHack、Immunefi、HackenProof）合计持有超过
              55% 的 PTS 心智份额，显示市场碎片化可能侵蚀 Bugcrowd 的定价权和胜率。Bugcrowd 的 PeerSpot 评分为 8.4/10（HackerOne 为 8.1），推荐率为
              100%（HackerOne 为 86%），说明已经 部署平台的客户满意；但公司没有公开胜率数据、失单分析和竞争替换情况。 Mayhem Security 收购和 FedRAMP
              授权代表差异化投入，但相较资本充足的竞争场仍处早期。
