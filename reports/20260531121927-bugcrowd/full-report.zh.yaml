companyProfile:
  summary: >
    Bugcrowd 是一家总部位于 San Francisco 的 AI 驱动众包网络安全平台，2012 年由 Casey Ellis、Chris Raethke 和 Sergei Belokamen 在 Sydney,
    Australia 创立。公司开创了商业化漏洞赏金市场，运营多产品 Security Knowledge Platform™，覆盖 Bug
    Bounty、漏洞披露计划（VDP）、渗透测试即服务（PTaaS）和外部攻击面管理（EASM）。CrowdMatch™ AI 技术把 500,000+ 名经过审核的安全研究员匹配到客户项目。Bugcrowd 服务 1,200+
    家企业客户，包括 OpenAI、Google、T-Mobile 和 US Department of Defense，横跨 29+ 个国家的 65+ 个行业。CEO Dave Gerry（2022 年 11 月加入）牵头完成
    2024 年 2 月 $102M Series E（General Catalyst 领投，隐含估值超过 $1B）、2024 年 10 月 $50M SVB 成长资本授信、2024 年 5 月收购英国
    Informer（ASM），以及 2025 年 11 月收购 Mayhem Security（AI 原生自动化代码 / API / SBOM 测试）。累计资本总额约 $234M+。FY2024 PTaaS 增长
    75%+；渠道合作伙伴贡献收入 20%+。Bugcrowd 于 2026 年 2 月取得 FedRAMP Moderate Authorization。
