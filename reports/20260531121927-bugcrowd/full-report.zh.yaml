  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——层级、替代品与相邻进入者
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的竞争版图可分成三个同心层级和两个替代类别。第一层，HackerOne 和 Synack 是最直接的众包同行。HackerOne 以 37.4% 的从业者心智份额（PeerSpot，2026 年
              1 月）领先漏洞赏金平台类别，高于 Bugcrowd 的 33.7%；其研究员社区超过 1.5M，为 Amazon、Microsoft、Goldman Sachs 和 US DoD 等企业客户的 1,950+
              个活跃项目服务。Synack 在这一层中定位不同——其仅限邀请的 Synack Red Team（SRT）约 1,500 名经过严格审核的白帽黑客（录取率低于 10%）优先追求质量而非社区规模，并由 Sara
              AI Pentesting 提供自动化连续侦察补充。G2 在 Summer 2026 Penetration Testing 的 Grid Report 和 Enterprise Grid Report 中均将
              Synack 评为 Leader。

              第二层，NetSPI 和 Cobalt.io 专注 PTaaS 及相邻攻击面管理，没有大型开放研究员社区。NetSPI 获 KKR 和 Sunstone Partners $500M
              支持，服务美国前十大银行中的七家，估计年收入约 $175.7M；其 2024 年收购 Hubble，扩展 ASM 和 BAS 产品。Cobalt.io 占据中端市场 PTaaS 细分，累计融资约
              $37M，估计年收入 $131.4M，主要靠成本更低的模块化项目竞争。

              第三层，Intigriti（欧洲，融资 €21M，300+ 客户）和 YesWeHack（欧洲，2026 年 €26M Series C，40 个国家 500+ 客户）主导欧洲漏洞赏金项目，服务法国 CAC 40
              的 70% 以及法国、西班牙、加拿大、新加坡的公共机构。两家公司都在国际扩张，但主要根基仍在欧洲。

              主要现状替代品是传统一次性渗透测试，每次项目 $10,000–$100,000+——非连续、非订阅、非众包。内部红队可作为大型企业的部分替代，但受人数和广度限制。相邻 AI 原生自动化扫描工具（如
              Rapid7、Bishop Fox Cosmos、Veracode）与 Bugcrowd 的 Mayhem Security AI 自动化和 ASM
              模块部分重叠，但无法复制复杂、多步骤利用链所需的人类研究员判断。
