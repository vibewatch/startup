      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              2022 年底起，Bugcrowd 在 CEO Dave Gerry 带领下大幅重建领导团队。Gerry 于 2022 年 11 月从 WhiteHat Security 加入，曾任首席营收官和首席运营官。他拥有
              Suffolk University MBA 和 Merrimack College BA，在 NTT、Veracode、Sumo Logic、The Herjavec Group
              等机构积累了十多年网络安全行业经验。在他领导下，公司完成 $102M Series E、两笔战略收购，把渠道合作伙伴收入提升至业务的 20%+，并实现 40%+ 的年度收入增长。

              CFO Robert Taccini 于 2022 年上任，带来近三十年财务经验，曾任 WhiteHat Security 和 HyperGrid 的 CFO，以及 Cisco Systems
              业务运营财务副总裁。首席信息与安全官 Nicholas McKenzie 于 2021 年从 National Australia Bank 加入，此前担任执行总经理兼首席安全官。CTO Braden
              Russell 负责工程。Dr. David Brumley 是 Mayhem Security 联合创始人、Carnegie Mellon University 教授和知名 AI 安全研究员，2025 年 11
              月收购后出任首席 AI 与科学官，为高管层补上深厚的 AI 安全技术能力。首席战略与信任官 Trey Ford、首席营销官 Emily Ferdinando 构成当前高管团队的其余部分。

              Casey Ellis 是 Bugcrowd 创立故事中最主要的公开代表；截至 2026 年 5 月，领导层页面仍将其列为“Founder”，他此前也曾任首席战略官。他的持续参与延续了创始愿景。2024 年 2
              月 Series E 之后，董事会治理明显加强：Mark Crane（General Catalyst 合伙人）和 Paul Sagan（General Catalyst 高级顾问）加入董事会，Sagan
              出任董事会主席。来自 T-Mobile 和 Navan 的顾问委员会成员带来一线企业 CISO 视角。公司经历过值得注意的 CEO 更替：Series D 阶段（2020 年）由 Ashish Gupta
              领导，之后 Gerry 上任；这次领导层变动伴随更广泛的高管团队重建，使公司进入当前增长阶段。
