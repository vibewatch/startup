      - number: '2.4'
        title: 增长驱动、约束与采用摩擦
        blocks:
          - type: paragraph
            body: >
              多重结构性力量支撑连续和众包安全测试的持续需求。短期最强监管驱动来自 SEC 2023 年 7
              月最终规则：上市公司必须在判定网络安全事件具有重大性后的四个工作日内披露，并每年披露网络安全风险管理、战略和治理。该规则迫使 CISO 向董事会和投资者证明主动安全实践，把漏洞赏金和 PTaaS
              采用同时变成降风险手段和披露资质。CISA Binding Operational Directive 20-01 同样为所有 Federal Civilian Executive Branch 机构采用 VDP
              设定法律底线；Bugcrowd 通过 CISA 平台合作直接受益，该合作在 2023 年支持 50+ 个机构报告 1,094 个有效漏洞。欧盟和英国监管框架，包括 Cyber Resilience Act 与
              Cyber Security and Resilience Bill，也在欧洲市场形成类似顺风。威胁侧，2021 至 2023 年数据泄露上升 72%，70%
              的组织至少遭遇一次源自未知或未管理互联网暴露资产的攻击。云迁移加深结构性缺口：43% 的 IT 和业务领导者表示自身攻击面正在不可控地扩大，61% 的组织在前一年遭遇云安全事件。AI 驱动防御可最多缩短 80
              天泄露响应时间，并将事件成本降低约 $1.9M，进一步支撑连续测试平台的 ROI 逻辑。

              采用摩擦仍然显著。最常被提及的约束是数据保密：58% 的组织担心向外部众包研究员分享敏感系统访问，限制了医疗、国防和金融服务行业渗透。约 47% 的企业把法律和监管复杂性列为国际漏洞赏金项目落地障碍，尤其是
              GDPR、地区性道德黑客法律和跨境责任暴露。在平台层面，大量低质量提交会给客户安全团队造成运营负担，使 AI 辅助分诊质量成为采购关键标准。近期调查中，29% 的公司把供应商集成复杂性列为障碍，具体是需要接入
              SIEM、SOAR 和 CI/CD 管道。总体看，这些约束利好拥有最强研究员审核、AI 分诊自动化和特定司法辖区安全港框架的平台。
