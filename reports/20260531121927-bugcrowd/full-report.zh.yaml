    rows:
      - - 收入增长放缓
        - 任何公开或尽调披露数据表明，最近任一时期 YoY 收入增长低于 20%
        - 40%+ 增长叙事崩塌；适用倍数被推向 3–5x（Rapid7 档）；基准情形估值跌破 $1B
        - 退出二级市场持仓或减记；在新的更低锚点确认前，不进入一级市场
      - - SVB 契约违约或困境信号
        - 任何公开通知显示契约违约、强制摊还、信贷额度修订或重组
        - 释放运营困境信号；限制 M&A 和退出；可能触发投资人权利和治理变化；提高悲观情景概率
        - 暂停一级市场尽调；追问契约条款；评估摊薄性股权融资风险
      - - 低于 $1B 的估值下调融资或平轮融资
        - 任何新的一级股权融资，其每股价格暗示投后估值低于 $1B；或二级市场价格跌破 $1.00 / 股
        - 证实 $2B 隐含价格高估；优先权瀑布分析变得关键；反稀释条款放大普通股稀释
        - 在新资本结构清晰前回避；评估反稀释对普通股的影响；估值下调融资后的价格可能创造有吸引力的二级入场点
      - - HackerOne 以高估值 IPO
        - HackerOne 提交 S-1 招股说明书，披露收入超过 $150M、估值超过 $2B；或老股交易价格高于 $10/share
        - 重置众包安全平台的同业基准；厘清公开市场倍数环境；Bugcrowd 的上调或下调重估取决于相对指标
        - 跟踪 IPO 定价和可比公司倍数；作为 Bugcrowd 定价的实时市场读数
      - - AI 分诊毛利率塌陷
        - 平台范围内有效提交率低于 3% 的证据，或管理层披露分诊 COGS 同比增长超过 25%、但收入没有同步增长
        - 摧毁平台经济性；托管项目毛利率压缩至 20–30%；估值倍数重估至「AI 冲击」桶（低于 4x）；HackerOne IBB 暂停是该风险正在显现的早期信号
        - 退出；AI 替代逻辑得到验证；若 AI 防御措施证明有效，可在低于 $600M 的入场价重新评估
    notes: >
      门槛定义是定性、指示性的，并非合同约定。所有触发条件都基于公开可观察信号，或潜在投资者可在数据室监测的证据。 清单并不穷尽；监管变化（FedRAMP 暂停、GDPR 执法行动）、客户集中度流失（OpenAI 或 DoD
      项目取消）、管理层离任等额外触发项，也可能打破投资逻辑。
    claimRefs:
      - CV025
      - CV027
      - CV031
      - CV032
      - CV033
      - CV038
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - FY2023–FY2025 经审计损益表、资产负债表和现金流量表；优先提供 Big-4 审计版本
        - 证实或推翻 CEO 关于 $100M 收入和 40%+ 增长的说法；揭示真实 COGS、综合毛利率、烧钱速度和净现金头寸；是任何估值模型的前置条件
        - 通过 NDA 向 CFO Robert Taccini 索取；如有 Big-4 审计报表，要求提供
      - - SVB 债务契约条款
        - 完整信贷协议，包括财务契约（最低 ARR、最高杠杆率）、利率、到期日、提款安排和控制权变更条款
        - 契约违约风险决定悲观情景约束；控制权变更条款影响 M&A 退出选择；未披露条款构成无法量化的或有负债
        - 向 CFO 索取；法务审阅信贷协议；对照 SVB ESG 标准条款做基准比较
      - - 股权结构表
        - 完整股权结构表，列出各轮优先股堆叠、普通股股数、期权池规模，以及任何认股权证或可转债工具
        - 用于按优先权调整的回报建模；决定任何退出情景下普通股与优先股的实际回报；识别估值下调轮中的反稀释风险
        - 通过 NDA 向 CFO / 总法律顾问索取；对照 Forge COI 数据核验
      - - 净收入留存率和总美元留存率
        - 至少 2 年按队列划分的 NRR；总客户流失率；新增客户 ARR 与扩张 ARR 拆分
        - 核心 SaaS 质量指标；判断增长来自存量扩张还是依赖新客户获取；若要支撑溢价（10x+）倍数，NRR 需高于 120%
        - 向 CEO / CFO 索取；对照 Bessemer NDR 基准（>120% = 优秀）
      - - Mayhem 收购财务条款
        - 收购价格、或有对价结构、收购时 Mayhem P&L、整合预算，以及 Dr. Brumley 留任条款
        - 验证「估值几乎翻倍」说法；若 Mayhem 技术里程碑未达成，揭示或有对价风险；整合成本会影响烧钱速度和毛利率
        - 向 CFO 索取；单独审阅 Mayhem 收购前财务数据
      - - Forge $506M COI 估值依据
        - 触发 Forge 生成 $506.24M「Series E-1」投后估值的底层 COI 文件；或公司确认没有按该价格完成新一轮股权融资
        - COI 口径（$506M）与媒体报道（$2B）估值相差 $1.5B+ 且无法解释，属于重大事项；若 COI 反映真实融资事件，可能意味着未披露的估值下调轮或结构化分批融资
        - 向总法律顾问索取 COI 文件；核验 Forge 方法披露；要求公司说明「Series E-1」具体指什么
    notes: |
      尽调事项按大致优先级从高到低排列。第 1–3 项（经审计财务、SVB 契约、股权结构表）是任何新股投资决策的绝对前置条件。第 4–6 项用于细化估值模型和给情景概率赋权。所有事项都是成长阶段网络安全投资数据室的标准材料。
    claimRefs:
      - CV010
      - CV012
      - CV031
      - CV032
      - CV036
      - CV039
