  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块架构
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的商业产品围绕四个核心产品组织，并通过 Security Knowledge Platform™ SaaS 基础设施交付：托管式 Bug
              Bounty、漏洞披露计划（VDP）、渗透测试即服务（PTaaS）和 外部攻击面管理（EASM，2024 年收购后原 Informer 并入）。每个产品对应客户进攻性安全
              生命周期的不同阶段，从持续众包漏洞发现、协同披露，到合规要求的渗透测试和外部攻击面 可视化。

              2025 年 11 月收购 Mayhem Security（前 ForAllSecure）后，产品组合实质扩张。Mayhem 带来三项 AI 原生能力：API 安全测试（完全自动化，替代手工方法）、代码安全
              （持续自动化测试，加快安全代码发布）和动态 SBOM 剖析（运行时应用分析，用来 识别高风险和未使用的第三方依赖）。Mayhem 还为基础大语言模型构建者提供强化学习环境。 这拼出了 Bugcrowd
              所称行业首个真正自适应的人机结合安全平台——把众包人类创造力与 自主 AI 驱动测试结合起来，覆盖从开发到生产的完整软件开发生命周期。

              Bug Bounty 是成熟旗舰产品。平台的 Engagement Simulator 基于数千个历史项目数据， 让客户上线前预测提交量、奖励支出和范围取舍。公司免费提供从竞争平台迁移的托管服务，
              对应“爬、走、跑”的成熟度模型。VDP 按明确条款支持负责任披露，包含多方法提交、工程化 分诊、集成和报告。PTaaS 产品线称 2024 年增长 75%+，并支持 AI 渗透测试和 AI 偏差评估等 较新的
              SKU 扩展。
