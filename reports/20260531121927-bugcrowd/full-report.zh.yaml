      - number: '3.3'
        title: 定价、项目模式与 GTM 分销
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 不公布标价，所有项目均为定制报价。根据跟踪真实企业采购的合同数据库，SpendHound 在 2026 年 5 月发布的 160 家 Bugcrowd 客户数据集显示，SMB 平均年费为
              $54,591，企业平均年费为 $79,752。Vendr 的定价分析给出更细颗粒度：私有漏洞赏金项目平台费，小到中等范围起价为每年 $30,000–$60,000，大型配置升至
              $75,000–$120,000+；公开漏洞赏金项目每年 $75,000–$150,000+。研究员奖励预算另计于平台费之上——小型私有项目从 $50,000 起，成熟企业级公开项目可达
              $500,000+。中端市场组织的年度总成本通常落在 $100,000–$300,000；拥有公开项目的大型企业每年投入 $300,000–$1,000,000+。多年期合同成交价往往较标价低 15–40%。

              Costbench 基准数据（8 笔已验证采购）显示，年度合同中位数为 $6,500——可能反映范围较窄的入门级项目——月度价格区间为 $5,000 至 $120,000。Bugcrowd 定价相对
              Cobalt.io 和中端欧洲平台被描述为溢价，但在等同企业范围下通常与 HackerOne 相当或更低。标价之外至少存在四类有记录的隐藏成本：实施、培训、扩展分析和附加托管服务，这些会把基础平台费抬高
              15–30%。

              GTM 分销依赖直销企业销售（约 80% 收入）和渠道合作伙伴模式；后者按 2024 年 CEO 指引已从零起步贡献超过 20% 收入。HackerOne
              同样依靠直销企业销售，但拥有更广的平台项目市场，推动小型组织自助采用。Synack 主要通过直销企业销售分销，平均合同价值更高。Intigriti 和 YesWeHack
              高度依赖欧洲公共部门和受监管行业渠道，并把 EU GDPR 合规定位为采购标准；这不是 Bugcrowd 默认定位的一部分。
