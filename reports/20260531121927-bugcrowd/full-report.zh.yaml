      - number: '3.2'
        title: 竞争对手画像——规模、融资、客户与战略方向
        blocks:
          - type: paragraph
            body: >
              按社区规模和项目数量看，HackerOne 是最大的漏洞赏金与漏洞协调平台。HackerOne 五轮融资合计 $159.4M（最近一轮为 2022 年 $49M Series E），compworth.com
              估计年收入约 $750M，是企业市场锚点。其 2025 Annual Hacker-Powered Security Report 记录，2024 年 7 月至 2025 年 6 月向研究员支付 $81M
              赏金，同比增长 13%；AI 相关漏洞报告激增 210%，其中包括完全自主 AI 智能体提交的 560 份有效报告。HackerOne 的战略方向强调“仿生黑客”（AI 增强研究员），并推出名为 Hai
              Triage 的 AI 驱动分诊服务。相较 Bugcrowd，其主要短板是平台宽度较窄：HackerOne 主要是漏洞赏金和 VDP 平台，PTaaS 较轻，也没有集成 ASM 模块。

              Synack 通过极端研究员质量控制实现差异化。公司由前 NSA 人员 Jay Kaplan 和 Mark Kuhr 创立，已从 Kleiner Perkins、Greylock 和 GGV Capital 融资
              $112M。SRT 的多阶段技术评估、身份验证和背景筛查录取率低于 10%，是市场上限制最严的研究员模型。Synack 的 Sara AI Pentesting（由 Synack Autonomous Red
              Agent，简称 Sara，驱动）以机器速度处理连续侦察和初始利用验证，随后由 SRT 研究员专注复杂对抗判断。GigaOm 2025 PTaaS Radar 同时将 Synack 评为 Leader 和
              Fast Mover。Synack 估计收入为 $65–100M，定位较小但溢价更高；其主要短板是研究员社区规模相对 Bugcrowd 和 HackerOne 受限。

              NetSPI 主要在 PTaaS 和 ASM 竞争，没有众包研究员模型。公司获 KKR $500M 支持，在金融服务（美国前十大银行中的七家）和云安全领域站位强。其产品矩阵覆盖连续渗透测试、ASM
              和攻防演练模拟，因此相比众包安全同行，它更像直接 ASM 竞争对手。NetSPI 于 2024 年收购 Hubble，扩展资产情报能力。Cobalt.io 融资约 $37M、员工约 507
              人，把自己定位为更易采购的中端市场 PTaaS 替代方案，提供模块化众包渗透测试项目，价格通常低于 Bugcrowd 或 Synack。

              Intigriti 和 YesWeHack 是欧洲主导性的众包安全平台。Intigriti 在 Series B（2022 年，Octopus Ventures 领投）融资 €21M+，相较 2020 年
              Series A 实现 650% 增长，确立了欧盟增长最快平台的定位。YesWeHack 于 2026 年完成 Wendel 领投的 €26M Series C，新董事 Renaud
              Deraison（Tenable 联合创始人）加入，增强了漏洞管理生态可信度。YesWeHack 服务 70% 的 CAC 40 公司，以及法国、西班牙、加拿大和新加坡的公共部门客户。两家平台都受益于 GDPR
              原生的数据驻留和本地研究员社区，为 Bugcrowd 欧洲扩张设置结构性壁垒。
