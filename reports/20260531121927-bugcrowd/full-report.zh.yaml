      - number: '5.4'
        title: 信任、安全合规与质量控制
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 运营专门的 Trust Center（trust.bugcrowd.com），由 SafeBase 托管，并持有覆盖 信息安全、云数据隐私、政府授权和支付安全的一组广泛第三方认证。认证栈包括
              SOC 2 Type II （安全性、可用性、保密性）、SOC 3（公开摘要）、ISO 27001:2022（ISMS）、ISO 27018 （云中个人数据）、FedRAMP 中等影响级别、CSA STAR
              Level 1（自评）、NIST 对齐和 PCI-DSS（QSA 评估）。这组证明对企业采购很重要，尤其是在美国联邦、金融服务和 受监管行业垂直领域。

              FedRAMP Moderate 授权是重要差异化，让美国联邦机构可以用该平台开展进攻性安全测试。 Bugcrowd 还采用 GDPR 标准模式条款和数据处理附录，覆盖同意、
              数据可携带权、被遗忘权、限制处理权和国际数据传输。ISO 27001 认证映射到大多数 GDPR 义务，形成整合式合规姿态。

              Bugcrowd 自 2013 年起就在内部和外部目标上运行自己的漏洞赏金项目——这是公司把自身 产品作为自我保障控制的具体信号。PCI-DSS 评估由 PCI 合格安全评估师（QSA） 执行，平台支持客户满足
              PCI-DSS、SOC 2、HIPAA、DORA、NIS2 和 CISA BOD 20-01 要求。

              合规姿态的尽调缺口包括：CSA STAR Level 1 是自评，没有第三方证明；最新 SOC 2 Type II 报告、ISO 27001 证书到期日和最新 PCI-DSS QSA 评估日期未公开（通常需签
              NDA 才能访问）； Bugcrowd 的 FedRAMP 授权边界范围（即哪些平台模块在范围内）没有公开记录。
            claimRefs:
