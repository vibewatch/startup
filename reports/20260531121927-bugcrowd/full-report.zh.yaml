      - number: '7.2'
        title: AI、技术替代与平台质量风险
        blocks:
          - type: paragraph
            body: >
              对 Bugcrowd 市场模型最具结构性的风险，是 AI 加速漏洞发现超过人类分诊和修复能力。 2026 年 3 月 27 日，HackerOne 正式暂停 Internet Bug
              Bounty（IBB）项目的新漏洞提交； 这是开源社区自 2013 年以来运行时间最长的奖励项目之一。HackerOne 给出的理由是“漏洞发现 与开源维护者修复能力之间失衡”。Dark Reading
              引用的专家把原因归于 AI 工具：自动化扫描器 用 AI 生成的“低质内容”淹没平台，使有效提交率从约 15% 降到 5% 以下。Anthropic 的 Claude Opus 4.6 在两周内独立发现 22 个
              Firefox 漏洞，展示了 AI 辅助发现的规模。这种“分诊 疲劳”动态威胁 Bugcrowd 的经济模型：如果每个有效发现的分诊成本急剧上升，托管项目 利润率会被压缩，研究员奖励经济性也会恶化。

              Bugcrowd 自己的 Inside the Mind of a Hacker 2026 报告（2,000+ 受访者）发现，82% 的 研究员现在在工作流中使用 AI，高于 2023 年的
              64%。这会加速发现量，但也提高低严重性 商品化发现的风险，消耗 Bugcrowd 分诊资源。更关键的是，65% 研究员表示因披露路径不清晰
              而暂不提交漏洞；这是一项平台质量风险，说明实际发现没有被完整捕获。PeerSpot 截至 2026 年 5 月的评论确认，分诊流程“相比三年前变慢”，内部流动
              升高，需要客户输入才能解决工单时响应时间下降。Bugcrowd 于 2025 年 12 月推出 AI Triage Assistant，直接回应分诊瓶颈；Mayhem Security
              收购则增加自动化、近零误报的代码和 API 测试。不过，截至 2026 年 5 月，这些缓解措施能否顶住行业范围内 AI 生成提交激增，仍未 被证明。如果自动扫描工具（包括
              Mayhem）能替代大多数低复杂度众包发现，Bugcrowd 的 500,000 研究员网络对常规项目的价值主张，可能只剩下精英、聚焦逻辑漏洞的项目。
