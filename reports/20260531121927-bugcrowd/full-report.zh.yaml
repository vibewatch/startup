      - number: '8.2'
        title: 可比公司与交易视角
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的估值必须在两个可比宇宙中三角校准：上市网络安全 SaaS 公司和可比 M&A 交易。截至 2026 年 Q1，公开市场分化明显。 在高端，CrowdStrike（CRWD）约以 18.6x
              NTM EV/Revenue 交易（multiples.vc 数据显示 LTM 为 35x），反映平台领导地位、 75% 毛利率和通往 GAAP 盈利的路径；Palo Alto Networks（PANW）约以
              20.5x LTM 收入交易。在压缩端，SentinelOne（S） 以 3.52x NTM EV/Revenue 交易，投资者将其盈利路径计入价格；Rapid7（RPD）则压缩至约 0.85x LTM
              收入（$855M EV 对 $851M LTM 收入），这是平台增长停滞、竞争护城河变窄时会出现的警示性底部参照。按 Windsor Drake 的 Cybersecurity Valuation Report
              2026，网络安全行业收入倍数中位数约为 7.8x；SaaS Capital Index 的上市 SaaS 中位数在 2026 年 Q1 为 6.4x，而 Aventis Advisors 经 AI
              扰动调整后的指数为 3.4x。

              M&A 侧，2025 年交易集显示「平台」资产和「功能」资产定价出现分叉。Google 以 $32B 收购 Wiz（约 32x ARR），代表 超大规模云厂商的战略溢价，多数私营公司无法复制。Veeam 以
              $1.7B 收购 Securiti AI（约 11x ARR），Palo Alto Networks 以 $25B 收购 CyberArk（约 18.6x ARR），反映 AI
              原生和身份安全溢价。Francisco Partners 以 $2.2B 将 Jamf 私有化（约 3x ARR），说明盈利但增速较慢的 DevMgmt 资产存在 PE 底价。Solganick Q4 2025
              报告和 Mergermarket Dealspeak 2026 分析确认，高增长网络安全公司（收入增长 >20%）在 2025 年的 M&A 倍数中位数为 13.7x，低增长同行平均为 3.5x； 当前 2026
              年交易讨论多数聚集在 6x–8x ARR，只有高度战略性的资产能拿到 8x–10x。Bugcrowd 估计 40%+ 的收入增长轨迹——若经审计财务确认—— 可把它放进溢价桶，但缺少验证是给予 8x
              以上倍数的重大门槛。
