      - number: '6.3'
        title: 留存信号、评论情绪与负面反馈
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 不公开净收入留存（NRR）、总收入留存（GRR）或客户群组层面的流失数据。缺少这些 指标，是潜在投资者的实质尽调缺口。案例研究中的定性留存信号偏正面：NAB 从 VDP 扩展到
              漏洞赏金，再到扩大渗透测试；ExpressVPN 已成为 Bugcrowd 客户超过三年；Rapyd 从私有 项目扩展到公开项目；BigCommerce 从两年私有项目推进到公开项目。这些多产品递进模式说明
              现有客户群内的净扩张合理存在，也与 CEO Gerry 在 2024 年 2 月声称的 40%+ 年收入增长一致。

              第三方评论信号明显正面。Gartner Peer Insights 显示 27 个已验证评分为 4.9/5。PeerSpot 截至 2026 年 5 月为 8.4/10，其中 47%
              评论者认定自己是大型企业用户。G2 在 61 条评论中 为 4.3/5，并提到易用性、主动的研究员社区和结构化分诊。TrustRadius 来自三条企业评论， 评分为 9.4/10。

              负面信号反复出现，但集中在两个主题。第一，客户经理和主持人质量波动：TrustRadius、 PeerSpot 和 Gartner 的多条独立评论指出，“项目成功高度依赖分配给你的主持人”。
              TrustRadius 评论者报告一年内最多对接四位不同客户经理。PeerSpot 评论者提到“眼下内部 变动很多”。第二，支持响应时间：PeerSpot 和 Gartner
              评论者指出，当工单需要客户输入时，解决时间可能从一天到七天不等；部分企业客户 认为这不足以支持关键严重性发现。

              一个孤立但公开的负面数据点：2019 年 2 月 Gartner Peer Insights 一条一星评论称，Bugcrowd 员工和研究员明确违反范围要求——无视测试期间不得创建新账户的指示。这是单个较早案例；
              截至 2026 年 5 月，近期评论没有报告类似范围违规事件。

              PeerSpot 心智份额数据显示竞争侵蚀：到 2026 年 5 月，Bugcrowd 在 Penetration Testing Services 类别中的心智份额同比从 17.2% 降至 10.4%，位居
              HackerOne（12.3%）之后第二； HackerOne 也从 21.5% 下滑。两家平台都在丢份额，原因可能是更广泛网络安全平台和新兴专门 厂商扩大了对这一类别的覆盖。
