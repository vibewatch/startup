      - number: '8.3'
        title: 收入倍数区间与情景框架
        blocks:
          - type: paragraph
            body: >
              三个情景界定了 Bugcrowd 的可投估值区间。基准情景（55% 概率权重）假设收入在 ~$140M 的 FY2025 基线上维持 25–30% 增长， FedRAMP 带来 $10–15M
              增量联邦收入，Mayhem 整合不出现重大中断，AI 逆风保持可控。由此得到的 FY2026 收入估计为 $170–185M。 套用 7–9x 的行业中位数倍数，隐含估值为
              $1.2B–$1.7B。中点（$1.4B）比非正式报道的 $2B 标记低 30%，说明当前入场价相对于 基准预期偏紧。

              悲观情景（25% 概率）假设增长降至 15–20%，触发因素可能是 AI 分诊成本膨胀压缩托管项目利润率、HackerOne 和 Synack 的竞争压力加大， 或 SVB 契约逆风限制运营灵活性。FY2026
              收入估计 $150–165M，套用 3–5x 倍数（与增长放缓平台的 Rapid7 级倍数压缩一致），隐含估值 为 $450M–$825M。该区间与 Forge 基于 COI 的 $506M
              数字重叠，说明若增长停滞且 COI 数据反映压缩后的融资轮，悲观情景并不离谱。 在 $450M–$500M 估值下，考虑 $184M 累计股权优先权堆叠，普通股股东会在清算优先权瀑布中承受显著损失。

              乐观情景（20% 概率）假设收入持续增长 35%+：FedRAMP 打开 $25–30M 联邦订单，Mayhem 的 AI 原生代码与 API 安全把平台 NRR 推高至 130% 以上，市场按 AI
              自适应安全平台叙事重估至 12–15x。FY2026 收入估计 $190–215M，按 12–15x 计算，隐含估值为 $2.3B–$3.2B， 足以支撑并超过 $2B 的非正式标记。Windsor Drake
              的 Revenue Growth vs. Multiple Correlation 表支持这一点：增长 30%+ 的公司在 M&A 中平均倍数约 ~16x；增长 20–30% 的公司平均约
              ~8.5x。Bugcrowd 的乐观逻辑要求两件事同时成立：增长得到确认，市场也继续愿意把 众包安全平台故事视作区别于 AI 商品化渗透测试的独立叙事。
