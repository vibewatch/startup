      - number: '7.3'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 于 2026 年 2 月 / 3 月获得 FedRAMP Moderate 授权，由美国网络安全和基础设施安全局（CISA）
              赞助。借助这一授权，公司可以用云原生平台服务美国联邦机构，不再要求各机构单独做运行授权（Authority-to-Operate） 评估。收入端因此打开一扇重要窗口，但合规义务也变成常态： Bugcrowd
              必须按照 FedRAMP 规则维持持续监控、可审计控制，并及时报告事件，才能保住授权。

              2026 年 5 月，FedRAMP 发布 RFC-0031，拟大幅重写事件报告要求。该提案计划在 2026 年 6 月底前作为 2026 年 FedRAMP
              合并规则（CR26）的一部分最终落地，通知时限分层：Class D（FedRAMP High）系统发生灾难级（N5）事件时要求 15 分钟内通知，Class A（FedRAMP Low）系统发生可忽略（N1）
              事件时为 1 个工作日。Bugcrowd 是 FedRAMP Moderate（Class C）提供商，将面临强制性的公开状态页可用性 和结构化事件报告要求，且需提交持续报告和最终报告。执法从 2027 年 1
              月 1 日开始，留给 Bugcrowd 大约 7 个月来搭建合规流程；该平台处理联邦项目参与者的敏感漏洞情报，运营改造并不轻。

              全球 GDPR 暴露也很大：GDPR Enforcement Tracker 记录截至 2026 年 5 月已有 3,183+ 起执法行动， 罚款总额达 €6.28B。Bugcrowd
              运营跨司法辖区的研究员社区，也处理涉及欧盟组织项目的漏洞数据， 因而长期承担数据处理协议和标准模型条款义务。平台持有 ISO 27001:2022 和 ISO 27018
              认证，提供了合规底座；但一旦数据处理出错，GDPR 罚款金额仍然可观。截至 2026 年 5 月， 公开渠道没有确认 Bugcrowd 自有平台数据发生数据泄露或安全事件，这是一个有意义的缓释因素。研究员不当行为
              ——如未经授权访问数据或违反范围——带来的法律责任，Bugcrowd 通过服务条款和安全港条款处理；但如果某个 具名企业客户的漏洞数据卷入高严重性事件，即使有合同保护，也可能造成声誉损害并引发潜在诉讼。
