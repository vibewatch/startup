            title: 市场规模定义不清就是估值风险
            body: >
              众包安全市场估计从 $99.83M 到 $133.2B，相差五个数量级，反映的是深层定义不一致，而不是真实市场分歧。投资者若接受宽口径生态 TAM，却不施加严格边界定义，就会系统性高估可寻址机会。Bugcrowd
              可辩护的 SAM 约为 $4.1B（漏洞赏金 + PTaaS + ASM 合计），不是有时被引用的更广泛网络安全平台市场 $133B。
