    enumeration: true
    notes: >
      可能性估计为定性评估，依据截至 2026 年 5 月的监管先例和公开证据；并非精算概率。严重性反映潜在收入、声誉和运营影响。覆盖不完整——未披露诉讼、知识产权争议以及 GDPR
      范围外的非美国监管事项均排除在外。各行按严重性排序。
    enumerationScope:
      coverage: partial
      basis: >
        Enumeration of known regulatory and legal risks based on FedRAMP marketplace listing, RFC-0031 proposed
        rulemaking, GDPR Enforcement Tracker, ISO certifications, and public terms-of-service / safe-harbor provisions
        as of May 2026. Undisclosed litigation and IP disputes are excluded.
    columns:
