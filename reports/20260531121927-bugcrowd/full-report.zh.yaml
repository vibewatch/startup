      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 缺少经审计财务报表，收入质量无法验证
            body: >
              Bugcrowd 唯一公开收入数字，是 2024 年 2 月 TechCrunch 访谈中 CEO 口头表示“年收入 接近 $100M”、增长超过 40%。公开领域没有经审计财务报表、审阅财务报表或独立
              核验的收入数字。第三方统计估算器（IncFact）把 Bugcrowd 放在 $10–100M 收入区间， 这不是印证口头数字，而是在确认不透明。投资者在承销任何估值倍数或增长叙事前，必须
              取得并独立核验经审计财务报表。私有公司没有公开财务报表可以理解，但这不会降低尽调 义务。
            calloutType: risk
