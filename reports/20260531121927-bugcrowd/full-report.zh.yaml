      - number: '8.4'
        title: 资本结构、稀释悬置与反向估值信号
        blocks:
          - type: paragraph
            body: >
              多个资本结构和市场背景因素叠加，放大了估值不确定性。第一，$50M SVB Enterprise Software Group 债务工具（2024 年 10 月关闭） 未披露契约条款；最低 ARR
              增长门槛、最高杠杆率、控制权变更触发条款等限制性规定，是增长资本工具中的常见安排，可能限制未来 M&A、
              限制股息或分配，或在收入目标未达时迫使公司进行稀释性股权融资。契约条款没有公开披露，给任何潜在投资者留下重大尽调缺口。

              第二，公司已通过五轮股权融资约 $184M，另有 $50M SVB 债务工具，优先股堆叠不轻。任何低于 $1B 的退出情景中，普通股股东和员工期权持有人
              都会通过清算瀑布承受不成比例的稀释。优先股常见的反稀释条款（广义加权平均，或较少见的全棘轮）意味着一旦出现降估值融资，稀释会超过表面 新发股数。完整股权结构表不公开，没有数据室访问就无法做优先权调整后的回报模型。

              第三，Forge Global 基于 COI 推导的 $506.24M 估值是一个反向且未解释的信号。Forge 的方法明确依赖公司提交的公司注册证书文件， 而不是新闻稿；2025 年 10 月 “Series
              E-1” 被赋予 $506M 轮后估值，意味着 2025 年 10 月前后——与 SVB 工具关闭或 Mayhem 收购结构重合——某个融资事件确立了正式每股价格，显著低于 $1B+ 独角兽叙事，实质上相对
              2024 年 2 月 Series E 会是平轮或下行事件。 没有底层 COI 文件，无法确认这一解读；但差异超过 $1.5B，且具有重大相关性。

              第四，宏观环境形成结构性逆风。受 AI 扰动担忧影响，Aventis Advisors 的 SaaS 指数到 2026 年 3 月压缩至 3.4x 中位 EV/Revenue， SaaS Capital
              Index 为 6.4x，二者均低于高峰。按 Mergermarket 2026 数据，网络安全 M&A 交易讨论集中在 6x–8x ARR；Nasdaq CTA Cybersecurity Index 较
              2025 年 10 月高点下跌 14%。ION Analytics 称，私营公司估值已经「远低于 2021–2022 融资热潮期间的水平」。 Kimball Esq. 分析显示，降估值融资在 2024 年 Q2
              占所有美国 VC 交易的 22%。那些在 2021–2024 年高峰倍数融资、却尚未用增长消化估值的公司， 压力最大。
