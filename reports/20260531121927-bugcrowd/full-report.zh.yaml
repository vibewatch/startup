      - number: '5.2'
        title: 平台架构、AI 引擎与集成
        blocks:
          - type: paragraph
            body: >
              平台技术架构以两项专有 AI 资产为中心：CrowdMatch™ 和 Security Knowledge Graph。 Security Knowledge Graph 是图数据库基础设施，存放 12+
              年的漏洞数据、资产画像、 研究员表现历史、修复步骤，以及来自数千个项目的攻击面情报。它为四项平台能力提供数据 底座：研究员匹配、工程化分诊、报告 / 分析和修复建议。

              CrowdMatch AI 借助 Security Knowledge Graph，在 100+ 个维度上把研究员和渗透测试员 匹配到客户项目。匹配算法评估研究员在 Bugcrowd
              上的完整历史组合——获得的积分和奖励、 技能、报告量、报告与沟通质量、测试准确性、深度，以及总体报告影响，并在新数据进入后 持续更新评估。这是 Bugcrowd
              相对竞争对手的主要差异化主张：后者通常用更少数据驱动的 筛选流程激活研究员。

              平台 SaaS 门户 Crowdcontrol（tracker.bugcrowd.com）已获 FedRAMP Moderate 授权，可 部署于美国政府。预置连接器覆盖 19
              个具名集成：Jira（双向工单同步）、GitHub（多仓库 支持）、ServiceNow（IT Incident、Security Incident 和 Vulnerability Response，双向
              同步）、Azure Boards、Trello、IBM SOAR、Kenna、Qualys、Nucleus、Slack、Microsoft Teams、HackEDU、Code
              Warrior、PagerDuty、Splunk On-Call、Nuclei、Cloudflare Zero Trust 和 Opsgenie；另有外发 webhook 和 REST API
              支持自定义集成。Webhook 使用 HMAC-SHA256 签名验证，并可配置事件触发器。

              2025 年 Q4，Bugcrowd 发布两项新增平台能力：AI Connect 和 Asset View。AI Connect 基于开源 Model Context
              Protocol（MCP）构建，在保留基于角色访问控制的前提下，让客户 内部 AI 工具与实时 Bugcrowd 漏洞数据进行安全只读集成。Asset View 把 EASM 发现的资产
              与进攻性测试工作流统一到一个库存和范围界定界面。
