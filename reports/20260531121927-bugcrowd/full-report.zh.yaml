chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与产品矩阵
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 是一家 AI 驱动的众包网络安全平台，把全球白帽黑客社区与需要主动安全测试的企业连接起来。公司 2012 年由 Casey Ellis、Chris Raethke 和 Sergei
              Belokamen 在 Australia 创立，后将主要总部迁至 California 的 San Francisco，同时在 Sydney, Australia 保留第二办公室。截至 2026 年 5
              月，Bugcrowd 拥有全球化、以远程为主的员工队伍，客户覆盖 29+ 个国家的 65+ 个行业。

              公司开创了商业化漏洞赏金市场，随后扩展为多产品安全市场。其核心 AI 驱动技术 CrowdMatch™ 会基于 100+ 个技能、经验和参与匹配维度，把 500,000+
              名经过审核的安全研究员分配到客户项目。获得专利的 Security Knowledge Platform™ 汇聚数千次项目中的 12+ 年专有漏洞数据，为企业安全团队提供威胁情报、分诊优先级和修复指引。

              Bugcrowd 的商业模式是“技能即服务”市场：客户支付平台订阅和服务费，运行 Bug Bounty 项目、漏洞披露计划（VDP）、渗透测试即服务（PTaaS）和攻击面管理（ASM）项目。收入来自 SaaS
              访问费、托管分诊服务以及研究员奖金的撮合费。PTaaS 业务线 2024 年增长超过 75%，公司又把 AI Penetration Testing 和 AI Bias Assessments
              加入产品组合，瞄准快速增长的 AI 安全场景。2024 年，公司收购英国 Informer（增加连续 ASM 和集成渗透测试）；2025 年 11 月收购 Mayhem Security（增加 AI
              原生自动化代码、API 和 SBOM 安全测试），形成 Bugcrowd 所称行业首个完全自适应的人机结合安全平台。
