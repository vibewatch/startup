          label: 授权 FedRAMP Moderate；撤销将终止联邦市场
        - from: m3
          to: m1
          label: $50M 债务授信；违反契约会限制运营
        - from: m4
          to: m1
          label: $102M Series E 股权；董事会控制退出时机
        - from: m5
          to: m8
          label: 将 Bugcrowd 路由至 SEWP V / OMNIA / E&I 联邦采购
        - from: m1
          to: m5
          label: FedRAMP 授权平台通过 Carahsoft 授权使用
        - from: m6
          to: m1
          label: AWS Marketplace 联合销售；政策变化会扰乱渠道
        - from: m7
          to: m1
          label: 人工研究供应；质量下降削弱平台价值
  - id: FV001
    title: 推荐逻辑 — 从证据到投资立场
    type: flow
    layout: wide
    summary: |
      从四个输入证据域，经关键分析问题，到“跟踪 / 进一步研究”建议和估值偏高立场的逻辑链。
    approximationNotes: |
      节点标签是已评估证据的定性摘要；方向箭头权重反映相对证据强度，而非定量概率。每个决策节点的置信度反映截至 May 2026 可用公开证据的权重。
    claimRefs:
      - CV007
      - CV026
      - CV028
      - CV031
      - CV033
      - CV039
    data:
      nodes:
        - id: revenue
          label: 收入证据
          detail: CEO：~$100M，40%+ 增长（Feb 2024）；无已审计验证；意味着 $170–185M FY2026E
        - id: valuation-anchors
          label: 估值锚点
          detail: Series E：$1B+ 独角兽；Mayhem 非正式 $2B；Forge COI：$506M — 存在重大分歧
        - id: comps
          label: 可比倍数
          detail: 行业中位数 6.4–7.8x；高增长 M&A 13.7x；当前交易集中在 6–8x ARR
        - id: risks
          label: 结构性风险
          detail: SVB 契约未披露；优先权堆栈 $184M；AI 分诊逆风；22% VC 下轮
        - id: base-val
          label: 基准情景估值
          detail: $1.2B–$1.7B，按 7–9x FY2026E 收入；较非正式 $2B 标记低 30%
        - id: entry
          label: 入场价格背景
          detail: 非正式 $2B 隐含价格；二级市场 $1.62/share；无确认的一级市场锚点
        - id: recommendation
          label: 跟踪 / 进一步研究
          detail: 不要按 $2B 一级市场估值投资；在 $1.2–$1.5B 且有资料室时重新评估；6 个尽调门槛
      edges:
        - from: revenue
          to: base-val
          label: 输入收入估算
        - from: comps
          to: base-val
          label: 推动倍数区间
        - from: risks
          to: base-val
          label: 压低倍数下限
        - from: valuation-anchors
          to: entry
          label: 设定非正式入场
        - from: base-val
          to: recommendation
          label: 相对入场偏高
        - from: entry
          to: recommendation
          label: 入场价相对基准溢价
        - from: risks
          to: recommendation
          label: 财务不透明构成门槛
  - id: FV002
    title: 估值敏感性 — EV/Revenue 倍数 vs. FY2026E 收入估算
    type: bar
    layout: wide
    summary: |
      FY2026 收入估算与 EV/Revenue 倍数的八种组合所隐含的企业价值（十亿美元），展示从熊市情景下限到牛市情景上限的宽区间，以及非正式 $2B 标记所在位置。
    approximationNotes: |
      收入估算是从 CEO 披露进行的方向性外推；并非已审计数据。倍数来自可比公司分析和行业基准。所有数值均为十亿美元，四舍五入到一位小数。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV014
      - CV018
    data:
      items:
        - label: $150M 收入 × 3.5x（熊市下限）
          value: 0.5
        - label: $165M 收入 × 5x（熊市上限）
          value: 0.8
        - label: $170M 收入 × 7x（基准下限）
          value: 1.2
        - label: $185M 收入 × 9x（基准上限）
          value: 1.7
        - label: $185M 收入 × 10.8x（打平 $2B）
          value: 2
        - label: $190M 收入 × 12x（乐观底线）
          value: 2.3
        - label: $215M 收入 × 15x（乐观上限）
          value: 3.2
        - label: 行业中位数 7.8x × $180M 中点
          value: 1.4
  - id: FV003
    title: 估值与回报区间——乐观 / 基准 / 悲观情景对照非正式 $2B 估值
    type: range
    layout: standard
    summary: |
      三种情景下的企业价值区间，并与 SecurityWeek 在 Mayhem 收购报道中隐含的非正式 $2B 估值对照。所有数值单位均为十亿美元。
    approximationNotes: >
      各区间代表每个情景内部的不确定性带，不是置信区间。乐观情景中点（$2.75B）和基准情景中点（$1.45B）是低端点和高端点的简单平均。概率权重（乐观 20%、基准 55%、悲观 25%）为定性估计。按这些权重隐含的期望值约为
      ~$1.5B；受悲观情景不对称影响，略低于基准情景中点。所有数值单位均为十亿美元。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV007
    data:
      items:
        - label: 悲观情景（~25% 概率）
          low: 0.45
          high: 0.83
          mid: 0.64
        - label: 基准情景（~55% 概率）
          low: 1.2
          high: 1.7
          mid: 1.45
        - label: 乐观情景（~20% 概率）
          low: 2.3
          high: 3.2
          mid: 2.75
        - label: 非正式 $2B 估值（SecurityWeek）
          low: 2
          high: 2
          mid: 2
  - id: FV004
    title: 投资 KPI 评分卡——Bugcrowd 估值评估
    type: kpi
    layout: standard
    summary: |
      截至 2026 年 5 月，对 Bugcrowd 七个关键投资维度给出可供 IC 使用的评分。评分基于公开证据；私有或未披露指标另行标注。
    approximationNotes: |
      所有分数均为 1–10 分制的定性评估，基于现有公开证据。标注「估计」的维度依赖 CEO 披露、第三方基准或分析推断，而非审计数据。评分方法沿用成长阶段私有网络安全公司投前评分卡的常规做法。
    claimRefs:
      - CV009
      - CV014
      - CV025
      - CV031
      - CV033
      - CV039
      - CV041
    data:
      items:
        - label: 市场机会
          value: 8/10
          detail: 可触达市场大（众包安全、PTaaS、ASM）；各子赛道 CAGR 为 12.5–22.6%；AI 驱动的威胁扩张支撑需求持续增长
          tone: positive
        - label: 收入增长证据
          value: 6/10
          detail: CEO 确认在 $100M+ 基础上同比增长 40%+（2024 年 2 月）；无审计验证；仅为估计；因透明度不足扣分
          tone: neutral
        - label: 平台护城河与差异化
          value: 7/10
          detail: 自研 CrowdMatch AI；12 年漏洞数据集；获 FedRAMP 授权；收购 Mayhem AI；500K+ 名经审核研究员；因 HackerOne 心智份额领先扣分
          tone: positive
        - label: 财务透明度与质量
          value: 3/10
          detail: 无经审计财务数据；未公开披露 NRR、毛利率或 CAC/LTV；Forge $506M 与 $2B 的差距未解释；SVB 契约条款未披露
          tone: negative
        - label: 资本结构风险
          value: 4/10
          detail: $184M 优先股堆叠；$50M SVB 债务且契约条款未披露；Forge COI 数据暗示可能发生降估值轮事件；无股权结构表
          tone: negative
        - label: 估值吸引力
          value: 4/10
          detail: 非正式 $2B 估值比基准情景 DCF/可比公司区间高 40–65%；只有 20% 概率的乐观情景能支撑；老股市场每股 $1.62 暗示不确定性；判断为偏高
          tone: negative
        - label: 退出可见度
          value: 6/10
          detail: >-
            战略买家池扎实（CrowdStrike、Palo Alto、超大规模云厂商）；IPO 窗口重启（Netskope 2025 年 9 月先例）；FedRAMP 让联邦收购具备可行性；截至 2026 年 5 月，无
            S-1 或已确认 IPO 时间表
          tone: neutral
