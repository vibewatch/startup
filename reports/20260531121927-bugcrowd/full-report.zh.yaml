  - id: FE001
    title: Bugcrowd Security Knowledge Platform — 产品架构栈
    type: stack
    layout: wide
    summary: |
      从客户界面到产品套件、AI/智能引擎、数据基础和集成枢纽的五层架构。
    data:
      layers:
        - label: 客户与研究员界面
          modules:
            - name: Crowdcontrol 门户
              description: tracker.bugcrowd.com — program management, submission tracking, analytics
            - name: 研究员门户
              description: Public and private program discovery, submission, reward tracking
            - name: Insights 仪表板
              description: KPIs, performance metrics, transition-time analytics
        - label: 产品套件
          modules:
            - name: 托管 Bug Bounty
              description: Crowdsourced, always-on vulnerability discovery
            - name: VDP
              description: Coordinated responsible disclosure with managed triage
            - name: PTaaS
              description: On-demand penetration testing with 72-hour launch
            - name: EASM
              description: Continuous external attack surface discovery and monitoring
            - name: Mayhem AI
              description: Automated API, code, and SBOM security testing
        - label: AI 与智能引擎
          modules:
            - name: CrowdMatch™ AI
              description: Researcher matching across 100+ dimensions
            - name: Engineered Triage AI
              description: Submission validation and prioritization (human ASE + AI models)
            - name: Engagement Simulator
              description: Data-driven program design and ROI forecasting
            - name: AI Connect (MCP)
              description: Read-only bridge to customer AI tools for remediation advice
        - label: 数据基础
          modules:
            - name: Security Knowledge Graph
              description: 12+ years of vulnerability, asset, and researcher data
            - name: 研究员画像存储
              description: Skill sets, certifications, performance history
            - name: Asset View
              description: Unified external attack surface inventory
            - name: Vulnerability Rating Taxonomy (VRT)
              description: Open-source priority classification
        - label: 集成与 API 层
          modules:
            - name: 预置连接器
              description: Jira, GitHub, ServiceNow, Azure Boards, Slack, MS Teams, and 13 others
            - name: 出站 webhooks
