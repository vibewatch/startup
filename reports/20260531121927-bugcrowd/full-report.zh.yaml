      - number: '7.5'
        title: 集中度、依赖与缓释证据
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的收入和运营模型嵌入了多重集中度风险。渠道合作伙伴收入超过 FY2024 总收入的 20%；2026 年 4 月的 Carahsoft 合作通过 NASA SEWP V、OMNIA
              Partners 和 E&I Cooperative 合同打开联邦准入，但也把美国政府采购都导向 单一主聚合商。若 Carahsoft
              关系中断、价格重谈，或政府机构决定直采，联邦收入会受影响，且没有现成替代分销渠道。 类似地，Bugcrowd 的 AWS Marketplace 渠道一年增长 32x（从 $34,500 到
              $1.126M），把云渠道收入集中在一家超大规模 云厂商的商业市场上，暴露于分成和政策变化。具名灯塔客户——OpenAI、Google、T-Mobile 和美国国防部——各自都有超出收入本身的
              声誉权重；任何旗舰参考客户流失，都会削弱企业客户销售周期中的可信度。

              缓释证据有分量，但还不能定论。Bugcrowd 在 PeerSpot 的推荐率为 100%，高于 HackerOne 的 86%，说明已部署客户感知到的价值高。 PeerSpot 评分 8.4/10，高于
              HackerOne（8.1），尽管评价人数更少；Gartner Peer Insights 上 4.9/5（27 条企业评价）也支持 客户满意度较高。FedRAMP Moderate 授权（2026 年 2 月
              / 3 月）和 Carahsoft 合作打开了一个到 2026 年估计超过 $14B 的可服务 联邦网络安全市场。2025 年 12 月发布的 AI Triage Assistant
              直接瞄准评价者指出的分诊瓶颈，Mayhem 收购则让 Bugcrowd 成为唯一一个 在统一平台上同时提供众包人工测试和 AI 自主代码 / API 安全的平台。截至 2026 年 5
              月，公开渠道没有重大裁员、财务困境信号或平台级 安全泄露。投资者出资前，应在 NDA 下索取客户集中度明细、SVB 契约文件、经审计财务以及 NRR/GRR 队列数据。
