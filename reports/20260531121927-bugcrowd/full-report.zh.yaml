      - number: '6.2'
        title: 具名客户证据与案例研究
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 在 bugcrowd.com/customers 发布了大量客户案例研究。最强证据集中在几个生产环境 部署，它们给出了量化结果，而不是泛泛推荐语。

              National Australia Bank（NAB）是澳大利亚最大的商业银行，服务 800 万客户、覆盖 900+ 个地点。NAB 采用 Bugcrowd 时按阶段从 VDP 走向公开漏洞赏金。NAB
              称，该项目带来新的 安全研究员人才管线、低误报率且无需复测成本，并发现“多个关键发现”，补充了 现有保障控制。之后，NAB 又把与 Bugcrowd 的渗透测试服务扩大到初始项目之外。

              Rapyd 是总部在英国的全球金融科技支付平台，在重大收购期间转向 Bugcrowd，当时其以 API 为核心的业务需要专门测试。Bugcrowd 的 CrowdMatch 技术把 Rapyd 连接到符合其
              API 安全 技能画像的黑客。项目第一年发现 15 个关键漏洞和约 40 个总漏洞。Rapyd 在所有严重性等级上 的平均修复时间为 18 天，而行业平均为 31 天，提升 42%。

              Wise（前 TransferWise）是全球汇款平台，最初使用私有漏洞赏金项目，并在上线 24 小时 内收到第一个有效关键（“P1 Business Critical”）漏洞。CISO Shan Lee
              表示，该发现“传统 渗透测试发现不了”，直接验证了众包相对合规检查 式渗透测试带来的增量发现价值。

              Atlassian 是企业协作软件公司，委托 Bugcrowd 按季度做定制方法论评估，覆盖合作伙伴市场 应用。安全高级经理 Vlad Yastreboff 指出，Bugcrowd
              “一上来就跑得很快”，并在九周内 为所有高风险合作伙伴应用交付完整漏洞报告。CISO Adrian Ludwig 公开表示“这是双赢”。

              BigCommerce（Nasdaq: BIGC）自 2020 年起运营私有漏洞赏金，随后通过 Bugcrowd 启动公开 项目。在私有项目中，近 500 名研究员参与，超过 75%
              的漏洞在提交后四天内被验证，114 个 漏洞获得奖励。公开项目进一步扩大了范围和研究员参与度。

              OpenAI 于 2023 年 4 月在 Bugcrowd 平台上独家启动漏洞赏金项目。2025 年 3 月，OpenAI 把“卓越且差异化的关键发现”的最高赏金从 $20,000 提高到
              $100,000，称其致力于奖励有意义、高影响的安全研究。由 Bugcrowd 托管的项目覆盖 OpenAI 的 服务和基础设施（不含模型安全 / 越狱），截至 2025 年初，约 75% 的提交在七天内完成
              分诊，已发放 200 多笔赏金。

              2024 年 Forrester TEI 研究（由 Bugcrowd 委托，基于 39 名决策者调查和 4 次从业者访谈） 发现，复合型企业买方三年实现 268% ROI 和 $1.43M
              净现值，避免招聘两名全职安全人员， 将传统渗透测试成本降低 60%，把重大泄露风险最多降低 30%，并将网络安全保险费降低 9%。
