  - id: TP004
    title: 护城河耐久性与竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 现有缓释措施
      - 尽调问题
    rows:
      - - CrowdMatch AI 和 12 年自有漏洞数据集
        - HackerOne 和 Synack 正在投入竞争 AI 模型（Hai Triage、Sara AI）；竞争对手积累相近深度后，数据集优势可能收窄
        - 中
        - Bugcrowd 数据集横跨漏洞赏金 + PTaaS + VDP + ASM，积累 12 年；比单品类同业覆盖更宽
        - 核查 Bugcrowd 的漏洞分类体系和跨产品学习是否形成不易复制的复利优势，还是 AI API 会把分诊智能商品化
      - - 500K+ 名经审查研究员社区和 CrowdMatch 匹配
        - AI 生成提交淹没研究员社区信号价值；HackerOne 更大的社区（1.5M+）提供更多原始量
        - 高
        - 政策执行（提交禁令、暂停、身份验证）；用 AI 识别低质量报告
        - 按时间衡量有效提交率（有效 / 总量）；评估 AI 噪声是否对 Bugcrowd 的影响大于 HackerOne；建模长期研究员激励结构
      - - CISA 联邦 VDP 合同和政府客户锚点
        - 合同续约风险；HackerOne 或新进入者在重新招标时提出竞争方案；政策变化缩小强制 VDP 范围
        - 低-中
        - 50+ 个 FCEB 机构已接入，并形成机构流程依赖；EnDyna 共同管理形成行政护城河
        - 验证合同期限和续约时间线；评估竞争性重招标概率；梳理哪些机构可能切换供应商
      - - 全平台集成（BBP + VDP + PTaaS + ASM + AI）
        - 竞争对手正在搭建相近套件：HackerOne 扩展 PTaaS，NetSPI 扩展 ASM，Synack 增加 AI 自动化；若买方偏好最佳单品，可能出现拆包
        - 中
        - Mayhem Security（2025 年 11 月）补上 AI 原生代码 / API / SBOM 测试；Informer（2024）补上持续 ASM；制造交叉销售锁定
        - 核查平台集成深度（单一控制台还是收购后外挂）；衡量多产品附加率、留存率，并与单产品客户对比
      - - AI 生成提交泛滥作为行业级结构性风险
        - 平台若无法低成本过滤 AI 噪声，项目 ROI 下降会带来客户流失；自由职业者 AI 工具可能把基础漏洞发现商品化
        - 高
        - Bugcrowd 正在执行分级执法政策；投入 AI 假报告检测；行业转向“质量时代”治理
        - 按季度跟踪有效提交率、客户 NPS 和提交量增长；评估执法开销能否被结构性吸收，还是会制造成本结构劣势
    notes: >
      严重性评级（低 / 低-中 / 中 / 高）是基于截至 2026 年 5 月收集证据作出的定性判断； 未使用定量概率模型。AI 提交泛滥风险评为高，因为该威胁的结构性经济逻辑——AI
      以接近零边际成本生成报告——无法只靠执法逆转，可能需要平台做根本性重构。CISA 合同风险评为低-中，因为政府切换成本高，且尚无公开披露的竞争性投标。
