      - number: '2.2'
        title: 机会规模——TAM、SAM 与互相矛盾的估计
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 产品所在市场落在 Gartner 预计 2026 年全球网络安全支出 $240B 的大盘内，较 2025 年 $213B 同比增长
              12.5%。相关可服务市场（SAM）由三个分析师定义的子板块组成：漏洞赏金平台约 $2.1B（Global Growth Insights，2026 年）、PTaaS
              $0.72B（MarketsandMarkets，2026 年）和 ASM $1.25B（Fortune Business Insights，2026 年），合计 SAM 约
              $4.1B。三个子板块均为两位数增长：PTaaS 到 2031 年 CAGR 为 22.6%，ASM 到 2034 年 CAGR 为 21.0%，漏洞赏金平台到 2035 年 CAGR 为 15.84%。在
              PTaaS 内，云安全渗透测试子板块预计以 25.8% CAGR 增长，呼应 2024 年组织中 61% 的云事件发生率。

              市场规模估计会随市场边界定义大幅分化，构成实质尽调风险。只聚焦众包安全平台的窄口径估计，从 $99.83M（360 Research Reports，2026 年，CAGR 6.2%）到 Cognitive
              Market Research 与 Research and Markets 给出的约 $135–274M 不等，反映严格的众包限定。把面向企业的漏洞赏金、PTaaS 和托管服务纳入的平台宽口径，则得到
              Global Growth Insights 的 $2.1B 数字。Future Market Insights 发布的 2025 年 $133.2B、CAGR 7.5%
              估计，似乎捕捉了远超众包测试的广义网络安全平台生态，因此不能与平台中心估计相比。可信分析师估计之间出现五个数量级差距，说明 Bugcrowd 尽调必须锚定 MarketsandMarkets、Fortune
              Business Insights 和 Global Growth Insights 的分板块数据，而不是混合生态数字。互相矛盾的估计应被保留为信号：这一市场类别还没有形成权威边界定义。
