      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              自创立以来，Bugcrowd 已通过五轮风险股权融资、种子融资和专项债务授信累计筹集约 $234M 资本。融资轨迹显示，公司在 2010 年代稳步搭建基础，随后在 2024 年完成跃迁式融资，用于国际扩张、并购和
              AI 平台投入。

              最近且规模最大的一次股权事件，是 2024 年 2 月由 General Catalyst 领投、Rally Ventures 和 Costanoa Ventures 参投的 $102M Series E。CEO
              Dave Gerry 在 TechCrunch 采访中公开表示，公司估值较 2020 年 Series D “显著上升”，但未披露具体估值。多家独立媒体把该轮后的隐含估值放在 $1B 以上，并将 Bugcrowd
              称为独角兽。2024 年 10/11 月，Bugcrowd 又从 Silicon Valley Bank（First Citizens Bank 旗下部门）获得 $50M 成长资本授信，通过 SVB
              Enterprise Software Group 以债务形式安排，用于 AI 平台扩容、创新投入和潜在追加并购。据 SecurityWeek 报道，2025 年 11 月收购 Mayhem Security
              后，Bugcrowd 估值接近翻倍，但官方尚未确认具体数字。

              投资者基础相当多元，覆盖美国成长期风投（General Catalyst、Rally Ventures、Costanoa、Triangle Peak、Paladin
              Capital）、澳大利亚机构和风投资本（Blackbird Ventures、Hostplus）以及战略资本（Salesforce Ventures、Industry
              Ventures）。这种组合既带来增长导向的董事会压力，也带来深厚的 APAC 市场关系。SVB $50M 债务授信给原本偏股权的结构加入财务杠杆；具体约束条款未公开，可能限制运营弹性。以约 $234M
              私募投资对比 2024 年初接近 $100M 的年度收入，Bugcrowd 相比许多网络安全 SaaS 同行呈现出更高的资本效率。
