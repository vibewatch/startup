      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: AI 生成提交洪泛威胁众包模式经济性
            body: >
              Bugcrowd 队列激增 334%、Curl 项目关闭 HackerOne（95% 提交无效），以及 HackerOne 2026 年 4 月暂停项目，共同说明众包漏洞披露的基础经济性正承受结构性压力。AI
              系统能以近零边际成本生成看似可信的漏洞报告，倒置平台为企业客户交付价值所依赖的信噪比。无法以高成本效率过滤噪声的平台，会看到项目 ROI 下滑、客户流失加速。Bugcrowd
              的执法政策（封禁、暂停、身份验证）是必要回应，但会形成永久运营开销。投资者应把有效提交率的环比变化作为平台健康的领先指标。
            calloutType: risk
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
          - type: callout
            title: 全平台宽度是 Bugcrowd 对单一产品同行的主要差异化
            body: >
              2025 年收购后，没有直接竞争对手能提供 Bugcrowd 的组合：开放漏洞赏金、托管 VDP、PTaaS、连续 ASM（经由 Informer）和 AI 原生代码 / API 安全自动化（经由
              Mayhem）。HackerOne 的原始社区规模更强，但缺少集成 ASM。Synack 的研究员质量更优，但没有开放赏金或 VDP。NetSPI 的 PTaaS 和 ASM
              很强，但没有众包模式。这种多产品宽度创造交叉销售锁定，并支撑更高总合同价值；但收购整合风险（把 CrowdMatch AI、Informer 数据和 Mayhem
              自动化整合到单一平台）是近期执行依赖，尽调应予核实。
