      - number: '1.4'
        title: 里程碑、时间线与不利事件
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的公司史从 2012 年一家澳大利亚创业公司，延伸到今天的多产品全球网络安全平台。Casey Ellis、Chris Raethke 和 Sergei Belokamen 于 2012 年在
              Sydney, Australia 创立公司，看到了把安全专长众包并放进结构化商业市场的未开发潜力。2013 年，公司把总部迁至 San Francisco，并完成来自 Rally Ventures
              的首笔种子融资，以支持美国市场扩张。

              2010 年代中期，平台投入和客户增长开始加速：Series A（2015 年，Costanoa Ventures）、Series B（2016 年，Blackbird Ventures）和 Series
              C（2018 年，Triangle Peak Partners）推动产品从单一漏洞赏金扩展到 VDP、渗透测试和攻击面管理。到 2019 财年，PTaaS 业务线同比增长 400%，Bugcrowd 办公室扩展到
              Australia、Bangalore、Costa Rica、London 和 Salt Lake City。2020 年 4 月 Series D（$30M，Rally Ventures）在 COVID-19
              疫情期间宣布，CEO Ashish Gupta 当时指出，远程办公抬升网络风险，2020 年 3 月漏洞报告激增 20%。

              Dave Gerry 于 2022 年 11 月出任 CEO，启动高管团队重建。2024 年 2 月 Series E（$102M）把 General Catalyst
              引入董事会，并为收购和国际增长释放资金。Bugcrowd 于 2024 年 5 月收购 Informer（ASM 和连续渗透测试），于 2025 年 11 月收购 Mayhem Security（AI
              原生安全测试）。2023 年，平台促成发现近 23,000 个高影响漏洞。到 2024 年 10 月，客户名单超过 1,200 家。截至 2026 年 5 月，未发现 Bugcrowd
              自身存在重大监管执法、数据泄露或重大诉讼的公开记录；但来自 HackerOne 的竞争压力，以及 PeerSpot 心智份额下滑（2026 年 5 月 10.4%，一年前为
              17.2%），构成公司必须应对的持续不利市场动态。
