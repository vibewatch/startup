  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争地形
        blocks:
          - type: paragraph
            body: >
              Bugcrowd
              的核心可寻址市场覆盖四个彼此独立但正在融合的进攻性安全子市场：漏洞赏金平台、漏洞披露计划（VDP）、渗透测试即服务（PTaaS）和攻击面管理（ASM）。这些类别共同定义了一个市场：企业采购经过审核的安全研究员访问能力，并越来越多地叠加
              AI，在攻击者利用漏洞前发现问题。纳入范围包括平台订阅与访问费、托管分诊服务、由平台撮合的研究员赏金支付，以及连续 ASM 订阅费。排除范围包括按一次性、非订阅合同运作的传统非平台渗透测试公司；SIEM 和
              SOAR 厂商；端点检测与响应产品；防火墙和网络安全设备；以及不含人工研究员参与、只自动扫描代码的纯 DAST/SAST 静态分析工具。

              主要现状替代方案是传统项目制渗透测试，每次年度评估收费
              $10,000–$100,000+，提供的是一次性而非连续覆盖。内部红队可作为大型企业的部分替代，但受产能和技能广度限制。战略相关性正在上升的相邻市场包括攻防演练模拟（BAS）、连续威胁暴露管理（CTEM）和对抗性暴露验证（AEV）——Gartner
              在 2026 年把这些类别整合，用来覆盖自动化和 AI 驱动的进攻性安全验证工具。这些相邻领域既与 Bugcrowd 的 Mayhem Security AI 自动化能力重叠，也提供集成增购路径。Gartner
              预计，采用 CTEM 框架的组织泄露率将下降三分之二，使 CTEM 成为 Bugcrowd 这类连续测试平台的结构性需求驱动因素。
