      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              漏洞赏金和众包安全服务需求高度集中在大型企业。员工数超过 1,000 人的公司约占美国全部漏洞赏金平台合同的 61%。在美国和加拿大的 Fortune 500 公司中，63% 运行漏洞赏金项目，42%
              的美国科技公司使用连续漏洞披露计划。北美按收入约占全球漏洞赏金市场 49%，欧洲为 27%，亚太为 18%。金融服务（BFSI）垂直约占众包安全项目
              23.7%，主要受监管义务驱动；科技、医疗和政府是随后主要垂直。

              预算所有者通常是 CISO 或安全副总裁，他们在 IT 预算中掌控安全分配，而企业通常把总 IT 支出的 8–12% 投向网络安全。安全工程师、AppSec 团队和 DevSecOps
              从业者是众包测试平台的一线日常用户。付款方是企业安全部门；但在联邦政府板块，项目费用来自受 CISA BOD-20-01 约束的机构 IT 安全预算。到 2023 年 Q4，Federal Civilian
              Executive Branch（FCEB）全部漏洞提交的 90% 通过 CISA 运营、Bugcrowd 与 EnDyna 共同管理的 VDP 平台流转。中小企业目前约占众包安全项目
              42.7%，且是增长最快的队列；PTaaS 中小企业采用预计 CAGR 为 24.6%，高于大型企业。大型企业约占市场总支出 72%，但中小企业板块提供最高的增量增长机会。
