      - number: '5.3'
        title: 研究员与客户工作流运营
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的运营模型不同于纯自助市场：内部配备的应用安全工程师（ASEs）团队会在升级给 客户前分诊每一个入站提交。ASEs 是首要质量关，负责按范围和技术 标准验证漏洞，并就澄清请求直接与研究员沟通。

              平台公开了明确的分诊服务级别目标（SLOs）。P1（关键）问题会在一个工作日内处理。所有 新提交会在三个工作日内处理（太平洋时间工作时段；不含联邦假日）。客户随后应在七天内
              接受已分诊提交，以维持研究员参与度——文件记录显示，接受延迟过长会随着时间推移与提交量 下降相关。合同可购买更快周转和非工作日覆盖的高级 SLA 层级。

              研究员侧支持公开和邀请制项目，研究员通过 Crowdcontrol 门户访问提交，并用结构化模板 报告。Bugcrowd 的 Vulnerability Rating Taxonomy（VRT）是托管在
              GitHub 上的开源分类法， 截至 2026 年 5 月有 539 个 star 和 125 个 fork，为常见漏洞类型定义基础优先级评分，并可按 项目说明定制。Bugcrowd 是官方 CVE
              Numbering Authority（CNA），可为符合条件的平台 发现漏洞分配 CVE。

              Bugcrowd 2026 年 Inside the Mind of a Hacker 报告（基于 2,000+ 受访者）发现，82% 的 伦理黑客现在在工作流中使用 AI（2023 年为 64%），72%
              认为团队协作能带来更好结果， 其中 61% 在团队中发现更多关键漏洞。这些趋势会增加流入分诊管线的研究员发现数量和复杂度， 抬高 ASE 团队和 AI 辅助分诊系统的运营门槛。

              Gartner Peer Insights 和 PeerSpot 的独立评论反复指出两项限制：主持人和客户经理质量 波动（TrustRadius 显示，优秀主持人能显著提升项目结果），以及内部组织变动导致部分企业
              客户担心支持连续性。一个 Gartner 评论（2019 年 2 月，1 星）提到 Bugcrowd 员工和研究员 明确违反范围要求——测试时无视不得创建新账户的指令；虽然这是一个孤立且较早的案例， 但仍出现在
              2026 年 Gartner 评论集中。
