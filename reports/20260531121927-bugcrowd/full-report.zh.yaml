          - type: callout
            title: SVB 债务契约条款是未量化约束
            body: >
              2024 年 10 月的 $50M SVB Enterprise Software Group 额度没有披露契约条款。 SVB 董事总经理确认这是此前授信额度的“扩展”，意味着原有关系里已经有契约约束。
              标准成长期软件信贷额度会设置最低 ARR 或 ARR 增长契约、最低流动性契约， 以及控制权变更条款。如果 Bugcrowd 在 Mayhem 整合后出现短期增速放缓，任何与收入挂钩
              的契约都可能需要修改或豁免，从而增加再融资风险。尽调必须在任何投资决定前取得 完整授信协议。
