      - number: '5.5'
        title: 路线图、差异化与技术风险
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 2025–2026 年产品策略，是把多产品组合整合进一个自适应平台——把人类主导的 众包测试与 Mayhem 的 AI 自动化进攻性安全合并。Mayhem 收购新增的能力直接回应 SDLC
              左移需求：开发阶段的自动化 API 安全测试、连续代码安全扫描，以及用于供应链合规的动态 SBOM 生成。Mayhem 的强化学习环境还为基础 LLM 模型的 AI 安全测试增加了一项新兴能力，
              打开一个早期但潜在高价值的细分市场。

              平台差异化建立在三根支柱上：专有 Security Knowledge Graph（来自 12+ 年项目历史的数据 护城河，新进入者很难在类似时间内复制）、CrowdMatch
              AI（公司称研究员匹配质量可把高影响 发现提升 2x+），以及 SaaS 产品套件的宽度（Bug Bounty + VDP + PTaaS + EASM + Mayhem AI 统一在一个平台）。2025
              年秋季，G2 在众包测试、渗透测试、缺陷跟踪 和 DevOps 类别中连续第七个周期把 Bugcrowd 评为领导者。Gartner Peer Insights 上，平台 来自 27 条企业评论的评分为
              4.9/5。

              关键技术风险包括：（1）Mayhem 整合——全部 11 名 Mayhem 员工加入 Bugcrowd，Mayhem 平台 与 Crowdcontrol
              的整合被描述为正在推进，但没有公开整合路线图或完成时间表；（2）主持人 依赖——独立评论持续指出，项目质量高度依赖被分配的主持人，导致客户体验不均；（3）分诊 AI 不透明——辅助分诊团队的 AI
              模型只有定性描述，没有独立验证或基准测试；（4）Security Knowledge Graph 专有锁定——该图谱是竞争资产，但架构和数据治理不透明，如果数据质量控制
              或研究员数据处理实践未被审查，就会形成尽调风险；（5）FedRAMP 边界范围——FedRAMP 授权 范围内的具体模块没有公开列举。
