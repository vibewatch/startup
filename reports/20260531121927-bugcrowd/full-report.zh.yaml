      - number: '6.4'
        title: 扩张、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >
              Bugcrowd 的先落地再扩张动作在案例研究库里记录充分。典型路径是：（1）VDP 或私有 漏洞赏金项目 →（2）扩大范围并启动公开项目 →（3）采用 PTaaS 和 / 或 ASM →（4）在平台 层集成进
              SDLC / DevSecOps 管线。NAB、Rapyd、BigCommerce 和 Wise 的公开案例各自至少展示 了这一路径中的两个步骤。2025 年 11 月加入 Mayhem Security
              的自动化 API、代码和 SBOM 能力后，客户无需更换供应商就能扩展到第四个付费模块。

              集中度风险没有量化披露。公司没有报告前五大或前十大客户收入集中度。1,200+ 客户数量和 广泛多元的具名客户标识（科技、金融、电信、媒体、政府、教育、IoT / 硬件）说明收入基础可能
              较分散；但没有披露意味着无法排除对单一大客户的依赖，例如运行大型多年托管项目的 超大规模云厂商或联邦机构。

              渠道伙伴贡献超过 20% 收入，如果关键转售商流失，会形成伙伴侧集中度风险。Carahsoft 政府 分销合作于 2026 年 4 月宣布，增加结构化政府采购入口，但也把联邦部门分销集中到单一政府 主聚合商。

              采购摩擦取决于行业。企业采购通常遵循标准 SaaS 评估周期（概念验证范围项目、安全审查、 法务、MSA）。2026 年 2 月获得、由 CISA 赞助的 FedRAMP Moderate 授权，移除了美国联邦
              机构最大的采购障碍；此前机构通常需要独立 Agency ATO。Bugcrowd 平台可通过 NASA SEWP V 合同 NNG15SC03B 和 NNG15SC27B、OMNIA Partners 合同
              R240303，以及 E&I cooperative contract EI00063~2021MA 采购，让州和地方层面可以简化合作采购。对金融服务买方，PCI-DSS 和 SOC 2 Type II
              认证覆盖购买流程中的主要合规预审条件。对欧洲买方，ISO 27001:2022、 ISO 27018 和 GDPR 标准模式条款简化合规尽调。

              未公开定价会增加 SMB 评估摩擦；Bugcrowd 网站把所有价格询问导向销售对话，这对企业安全 SaaS 是标准做法，但相较自助式竞争对手会拉长评估周期。从竞争平台（如 HackerOne）托管
              迁移不额外收费，降低了流入客户的切换成本，但对流出流失风险没有实质影响。
