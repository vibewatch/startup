  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与垂直覆盖
        blocks:
          - type: paragraph
            body: >
              截至 2024 年 10 月，Bugcrowd 付费客户超过 1,200 家，高于 2023 年 10 月约 850 家； SVB 债务额度新闻稿确认同比增长 41%。CEO Dave Gerry 的 2024
              年回顾披露，公司在 FY2024 新增 300 多个净新客户，并在平台上同时维持近 2,000 个进行中项目，覆盖 Bug Bounty、 VDP、PTaaS 和 EASM 项目。公司称业务横跨 29+ 个国家的
              65+ 个行业，体现了刻意横向化的 GTM：优先服务任何拥有实质数字攻击面的组织。

              基于具名引用和案例研究的分层分析显示，主要买方集群有五类。第一，大型科技公司 （Atlassian、OpenAI、Google、BigCommerce、Cloudinary、Outreach）用 Bugcrowd
              对外暴露 的应用、API 和 SaaS 产品做持续众包测试，并经常从私有漏洞赏金扩展到公开项目和 PTaaS。第二，金融服务和金融科技玩家（Rapyd、Wise、Kenna Security）围绕 API 安全、
              PCI-DSS 合规对齐，以及 M&A 期间攻击面扩张中的持续测试来使用平台。第三，电信和媒体公司 （T-Mobile、TX Group）把平台用于大范围公开项目和 DevSecOps 集成。第四，公共部门和教育
              组织（US CISA、Monash University、Minnesota Secretary of State、Code.org、Schoology） 通过 FedRAMP 授权的政府 SKU 使用
              Bugcrowd，并从 2026 年 4 月起可经由 Carahsoft 政府 采购工具采购，包括 NASA SEWP V 和 OMNIA Partners 合同。第五，IoT 和硬件供应商 （Axis
              Communications、NETGEAR、Motorola、Fitbit、Aruba Networks）用有范围限定的私有 项目发现固件和嵌入式 OS 漏洞；2025 年 Inside the Mind of
              a CISO 报告发现硬件漏洞同比 增加 88%，进一步强化了这一细分市场。

              FY2024，渠道伙伴收入超过总收入的 20%，说明 VAR 和托管安全服务提供商带来有意义分销。 Carahsoft 合作把公共部门分销正式化，但截至 2026 年 5 月，公司尚未公开确认 FedRAMP
              部署下的具体机构名称。
