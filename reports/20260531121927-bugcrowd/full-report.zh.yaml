      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓解措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - 平台数据泄露——研究员 / 客户漏洞情报
        - 全球
        - 截至 2026 年 5 月无已确认泄露；风险持续存在
        - 中（运营处理敏感 CVE 的安全平台天然存在泄露概率）
        - 严重 — 企业信任、联邦授权可能受损，并可能引发诉讼
        - ISO 27001:2022/27018 认证；FedRAMP 控制；基于角色的访问；研究员审核
        - 中等 — 无泄露历史是正面信号；FedRAMP 持续监控增加检测能力
        - 在 NDA 下获取 SOC 2 Type II 审计报告和 FedRAMP 系统安全计划
      - - FedRAMP Moderate 授权维护 / 撤销风险
        - 美国联邦
        - 2026 年 2/3 月获得授权；持续监控义务仍在执行
        - 低-中（FedRAMP 撤销很少见，但控制失效或审计缺口会触发）
        - 高——一旦失去授权，联邦市场准入会被取消，并扰乱 Carahsoft 合同
        - 持续监控计划；CISA 作为发起机构；Coalfire 提供顾问支持
        - 低-中——近期获批降低了短期撤销风险，但增加了持续运维负担
        - 要求提供 POA&M（行动计划和里程碑）文件及最新第三方评估报告
      - - FedRAMP 事件报告规则变更 — RFC-0031
        - 美国联邦
        - 已提议；预计 2026 年 6 月底前定稿；2027 年 1 月 1 日开始执行
        - 高（规则变更基本确定；合规要求只是时间问题）
        - 高——运营不合规可能触发整改计划，甚至撤销授权
        - 七个月实施窗口；Coalfire 顾问关系；既有事件响应计划
        - 中——严重事件的通知时限被压缩（N5/Class C 为 15 分钟），需要投入工具建设
        - 对照 RFC-0031 分级时限要求确认事件响应计划缺口；要求提供实施路线图
      - - GDPR 及多司法辖区数据隐私执法
        - 欧盟及多国
        - 持续生效义务；截至 2026 年 5 月，未见针对 Bugcrowd 的特定执法行动
        - 中（行业层面 GDPR 罚款累计 €6.28B；Bugcrowd 处理欧盟研究员和客户数据）
        - 高——若数据处理出错，可能面临重大罚款和 DPA 暂停风险
        - ISO 27018；GDPR 标准合同条款；与欧盟客户签署 DPA；法律审查
        - 中——未见已知违规；多司法辖区复杂性抬高剩余敞口
        - 要求提供 GDPR 合规框架文件、DPA 模板及处理活动记录（RoPA）
      - - 研究员不当行为 / 安全港责任
        - 美国、欧盟及适用的本地司法辖区
        - 截至 2026 年 5 月，未见涉及研究员越界的未决诉讼
        - 低-中（2019 年一条历史 Gartner 评论曾提到越界；近期未见模式化问题）
        - 中——若研究员超出范围，可能导致客户合同终止、声誉受损及潜在诉讼
        - 服务条款；有范围边界的项目定义；研究员筛选与行为准则；托管分拣监督
        - 低——安全港条款是行业标准做法；历史事件较孤立
        - 要求提供研究员相关争议的索赔历史；确认网络责任保险覆盖范围
