  topStrengths:
    - YMTC 已经达到工业规模，是中国唯一的大型 NAND 主力厂商，产品覆盖晶圆、嵌入式存储、SSD 和零售存储。
    - Xtacking 给 YMTC 一条差异化架构叙事；国内 OEM 通道和国家支持，帮助它继续在中国市场拿份额。
    - 公开证据支持可观市场相关性，包括 2025 年全球 NAND 份额约 11.8%，以及仍在推进 IPO 准备。
  topRisks:
    - U.S. Entity List 限制，以及未来任何二级制裁扩张，可能进一步卡住设备获取、客户和资本市场灵活性。
    - YMTC 在节点领先度上仍落后 Samsung 等头部厂商；先进海外设备受限，可能拖慢追赶。
    - NAND 周期性强、资本开支重，供给过剩、价格疲软或产能利用率低，都可能很快压住利润率。
    - 审计盈利、治理细节和真实客户集中度披露仍不足。
  unresolvedGaps:
    - 包括利润率、现金、债务和 capex 细节的经审计财务报表尚未公开。
    - 董事会结构、管理层权限和治理决策权，在公开来源中仍不透明。
    - 客户集中度，以及 hyperscaler 和智能手机 OEM 需求的持续性，目前仍只能看到一部分。
