chapter:
  number: 2
  title: Market Analysis
  summary: 'YMTC operates in a large, cyclical, strategically contested NAND market whose value pool is now being reshaped by AI infrastructure, enterprise SSD demand, and Chinese domestic-substitution policy. The most defensible public market lens is not a single TAM claim but a stacked view: roughly US$52 billion global NAND revenue in 2025, a US$46 billion first quarter in 2026 driven by pricing and enterprise demand, and a buyer mix that spans smartphones, PCs, servers, and retail storage—with YMTC strongest in domestic Chinese channels and cost-sensitive segments.'
sections:
- id: market-boundary-and-what-ymtc-actually-sells
  title: Market boundary, included spend, and what YMTC actually addresses
  body: 'YMTC is in the NAND flash business, not the whole memory market and not the DRAM market. That distinction matters because many public articles discuss Chinese ‘memory’ ambition broadly, while YMTC’s commercial surfaces—officially—are 3D NAND wafers, enterprise SSDs, client SSDs, embedded UFS/eMMC, and ZHITAI-branded consumer storage. Those products map to the main NAND value pools: smartphones and other mobile devices, notebooks and PCs, cloud or enterprise servers via SSDs, and retail after-market storage. The most useful boundary is therefore global NAND and NAND-derived storage revenue, with DRAM treated as an adjacent but separate market led domestically by CXMT. Competitor product pages from Samsung, SK hynix, Micron, Kioxia, and Sandisk confirm that the relevant battlefield is broad and multi-segmented, with enterprise SSD now disproportionately important because AI infrastructure is pushing storage performance, capacity, and pricing at the same time.'
