- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for YMTC
  rows:
  - - 3D NAND wafers and dies
    - Raw NAND flash sold into controllers and modules
    - DRAM, logic, analog, foundry, packaging-only revenue
    - Module makers and storage vendors
    - Core technology and manufacturing franchise.
  - - Enterprise SSD
    - Server and data-center SSD revenue using NAND
    - Compute, networking, HBM, controller-only revenue
    - Hyperscalers, server OEMs, enterprise IT
    - Fastest-growing high-value NAND sink in 2026.
  - - Client SSD
    - Notebook, desktop, and workstation SSD revenue
    - HDDs and DRAM DIMMs
    - PC OEMs, distributors, end users
    - Visible route for Lenovo-style design wins and ZHITAI products.
  - - Embedded mobile storage
    - UFS and eMMC for smartphones and other devices
    - Application processors, DRAM, radio chips
    - Smartphone and device procurement teams
    - Large domestic-China demand pool and substitution lever.
  - - Retail and channel storage
    - ZHITAI branded SSD, portable SSD, and memory-card sales
    - Enterprise-only procurement and non-flash accessories
    - Consumers, gamers, and retailers
    - Brand-building path beyond component supply.
  notes: Boundary intentionally excludes DRAM so YMTC is not conflated with CXMT or the full memory market.
