  evidenceGaps:
  - type: missing-source
    severity: material
    topic: TM002 sam-som gap
    missingEvidence: A source-backed China-only NAND SAM or segment-specific addressable-spend model for YMTC.
    whyItMatters: Without a cleaner regional or channel SAM, valuation work must rely on broader revenue pools and share windows rather than a tight bottom-up market model.
    diligencePath: Use procurement, customs, or OEM-design-win datasets to estimate China domestic NAND demand by segment.
    relatedQuestionRefs:
    - QM008
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-qualification
    missingEvidence: A current list of hyperscaler, server, or enterprise platforms fully qualified for YMTC SSDs.
    whyItMatters: Enterprise SSD is the highest-value segment in the current NAND cycle, so qualification depth materially affects achievable share.
    diligencePath: Request platform qualification matrices, controller partnerships, and endurance-validation decks from management or distributors.
    relatedQuestionRefs:
    - QM013
    - QM020
  - type: private-evidence-only
    severity: minor
    topic: customer-count-model
    missingEvidence: Segment-level customer counts or shipment concentration across smartphone OEMs, PC OEMs, hyperscalers, and retail channel partners.
    whyItMatters: Adoption breadth and concentration risk cannot be modeled well from isolated design-win anecdotes.
    diligencePath: Obtain sales mix by segment, top customers, and regional channel split from internal reporting.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
