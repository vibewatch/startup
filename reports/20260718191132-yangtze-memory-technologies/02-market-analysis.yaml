- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI-driven enterprise SSD demand
    - Positive
    - Now
    - Raises the value of NAND suppliers feeding server and AI storage demand
    - How much of YMTC volume is actually enterprise versus consumer?
  - - Chinese domestic substitution policy
    - Positive
    - Now to medium term
    - Improves design-win odds with domestic OEMs
    - What share of shipments is policy-supported rather than purely economic?
  - - Tight NAND supply and rising pricing
    - Positive
    - Now
    - Helps challengers break into OEM and channel accounts
    - How durable are shortage conditions once new capacity ramps?
  - - Domestic-equipment substitution
    - Mixed
    - Medium term
    - Allows capacity expansion under sanctions but may cap frontier pace
    - What yield or cost penalties persist versus foreign tools?
  - - Overseas security and compliance concerns
    - Negative
    - Persistent
    - Limits penetration in sensitive western or regulated channels
    - Which overseas customers will accept YMTC at all?
  - - Memory-cycle volatility
    - Negative
    - Persistent
    - Can compress margins quickly after shortage periods
    - What is break-even pricing under normalized conditions?
  - - Enterprise validation burden
    - Negative
    - Medium term
    - High-end SSD wins require endurance and firmware proof
    - How many enterprise platforms are fully qualified today?
  - - Expansion into DRAM
    - Mixed
    - Medium term
    - Could enlarge TAM but also dilute focus
    - Is DRAM optionality additive before yields stabilize?
  notes: Rows mix structural drivers and constraints; they are not all equally priced into the market at the same time.
