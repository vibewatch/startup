- id: sizing-lenses-and-where-growth-is-coming-from
  title: Sizing lenses and where current growth is coming from
  body: 'Public sources support multiple sizing lenses, and they should be kept separate rather than collapsed into one false-precision TAM. The broadest lens is the global NAND market: EE Times and Reuters-linked coverage anchor 2025 revenue around US$52 billion. Counterpoint-derived 2026 reporting then shows a much hotter near-term picture, with first-quarter NAND revenue reaching US$46 billion as AI-related demand and pricing reset the market. Within that total, enterprise SSD is the most important sub-segment right now. Counterpoint coverage summarized by SamMobile and InfotechLead says enterprise SSD represented 43% of Q1 2026 NAND revenue and could exceed 60% by year-end. That is strategically important for YMTC because it explains why data-center and server storage matter so much more than a legacy smartphone-memory lens alone. It also explains why investors are willing to entertain IPO narratives now: the memory cycle has turned sharply positive while capacity additions remain tight
    and buyers are looking for incremental supply.'
