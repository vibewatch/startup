  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2024-2026 income statement, balance sheet, and cash-flow statement.
    whyItMatters: Without audited statements, valuation and solvency analysis remain dependent on estimates and media summaries.
    diligencePath: Obtain the IPO prospectus, lender package, or full management accounts.
    relatedQuestionRefs:
    - QI023
    - QI025
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Gross margin, depreciation, and product-mix bridge by wafer, SSD, and embedded-memory segment.
    whyItMatters: Share gains can destroy value if bit-cost or module economics are still structurally weak.
    diligencePath: Request segment margin schedules and fab-utilization disclosures.
    relatedQuestionRefs:
    - QI024
  - type: missing-source
    severity: material
    topic: cash-and-debt
    missingEvidence: A clean public disclosure of cash balance, debt structure, and subsidy timing.
    whyItMatters: Capital adequacy cannot be underwritten from ownership and capex headlines alone.
    diligencePath: Collect balance-sheet disclosures, debt agreements, and use-of-funds detail from the listing package.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
