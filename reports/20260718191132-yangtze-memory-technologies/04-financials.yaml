company:
  name: Yangtze Memory Technologies
chapter:
  number: 4
  title: Financials
  summary: 'YMTC’s financial story is now large enough to underwrite on scale but not yet on quality: public sources support a roughly US$5-7 billion 2024 revenue base, more than RMB 20 billion of Q1 2026 revenue, and cumulative investment above RMB 160 billion, but still do not disclose cash, debt, or gross margin cleanly. The result is a company whose industrial ambition and capital needs are visible, while profitability, capital efficiency, and runway remain materially opaque.'
sections:
- id: revenue-model-and-market-pricing
  title: Revenue model and market pricing
  body: 'YMTC’s revenue model is hardware-native and therefore structurally different from software or platform businesses that investors often benchmark with generic growth metrics. The company sells wafers, SSDs, and embedded memory into OEM, channel, and enterprise flows, so revenue quality depends on utilization, yield, mix, and NAND pricing rather than on subscription retention. Public evidence is strongest on product scope and directional growth: China Daily says Q1 2026 revenue exceeded RMB 20 billion, while share data shows that YMTC moved from a low-teens challenger position toward relevance in global rankings during a rising-price cycle. What public sources do not show is just as important. There is no clean disclosure of realized ASPs, segment revenue, or customer-level profitability, so the chapter has to avoid pretending YMTC has SaaS-style visibility. The core financial takeaway is that scale is real, but price-taking and cycle exposure still dominate revenue quality.'
