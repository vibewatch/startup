- id: peer-context-and-financial-verdict
  title: Peer context and financial verdict
  body: Peer context helps frame YMTC’s numbers without pretending they are audited equivalents. Micron provides the best benchmark for how memory earnings can surge and collapse with the cycle, while Kioxia offers a more NAND-pure comparison set. Against that backdrop, Hurun’s US$22 billion 2025 valuation and the later US$28 billion to US$42 billion IPO chatter imply mid-single-digit revenue multiples if YMTC’s 2024-2026 revenue path is interpreted generously. Those multiples are not inherently absurd in a hot memory cycle, but they do require belief that share gains, domestic demand, and policy backing will continue long enough to justify huge ongoing capex. The most important diligence blockers remain cash balance, margin structure, and capital efficiency. The scale argument is already proven; the quality-of-earnings argument is not.
