  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-reliability
    missingEvidence: A public or shared customer qualification list, field failure data, and endurance-validation history for YMTC enterprise SSDs.
    whyItMatters: Enterprise revenue quality depends on reliability proof, not only on product-page existence.
    diligencePath: Request qualification matrices, failure-rate data, and platform references from management or distributors.
    relatedQuestionRefs:
    - QE023
    - QE025
  - type: conflicting-data
    severity: material
    topic: xtacking-node-mix
    missingEvidence: A reconciled explanation of how much shipped volume in 2025-2026 is really on Xtacking 3.0 or 4.0 versus older 128-layer generations.
    whyItMatters: Investors need to know whether roadmap claims already drive commercial volume or mostly marketing positioning.
    diligencePath: Cross-check shipment mix against teardown data, product BOMs, and management disclosures.
    relatedQuestionRefs:
    - QE022
    - QE024
  - type: missing-source
    severity: minor
    topic: TE005 roadmap completeness
    missingEvidence: A fuller public roadmap that links each announced generation to exact release dates, yields, and customer deployments.
    whyItMatters: The public roadmap is credible but incomplete on operational proof.
    diligencePath: Obtain investor technical roadmaps or distributor launch calendars.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE005
