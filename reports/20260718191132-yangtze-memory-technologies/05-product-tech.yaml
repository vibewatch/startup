chapter:
  number: 5
  title: Product & Technology
  summary: 'YMTC now has a broad enough storage stack to be judged as a full product company, not merely a Chinese NAND fab: official pages show current enterprise, client, embedded, and retail lines, while Xtacking remains the core technical differentiator. The strongest caveat is not absence of products but incomplete proof on node mix, enterprise reliability, and how far domestic equipment localization can keep the roadmap on pace with Samsung, SK hynix, Micron, and Kioxia.'
sections:
- id: product-stack-and-customer-jobs
  title: Product stack and customer jobs
  body: 'YMTC is now selling a storage platform, not a single memory die. Official pages show a full ladder from 3D NAND to enterprise SSDs, client SSDs, UFS, eMMC, and branded retail modules under ZHITAI. That matters because the company can participate in more customer workflows than a component-only supplier can: mobile OEMs can buy embedded storage, PC vendors can buy client SSDs, cloud or server buyers can qualify enterprise modules, and retail buyers can buy finished drives. The commercial meaning is straightforward. YMTC no longer has to prove only that it can etch NAND; it must prove it can package, qualify, support, and refresh products across multiple use cases. The product stack is broad enough that later diligence should separate where YMTC already has credible volume products from where it still lacks proof of large-scale field validation.'
