      - number: '3.3'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in NAND are highly segment-dependent. A phone OEM or retail distributor can multi-source
              more freely than an enterprise platform owner who must validate firmware, endurance, and controller
              behavior over long qualification cycles. That makes YMTC’s current share gains more believable in phones,
              channels, and domestic client devices than in globally exposed enterprise fleets. The domestic-policy
              layer deepens the moat: localization incentives make Chinese buyers more willing to try YMTC, while
              western buyers often treat it as commercially or politically non-procurable. That policy premium is real
              but fragile. If incumbents cut price hard in a down-cycle, or if sanctions widen again, part of YMTC’s
              current advantage could prove cyclical rather than durable. The moat is therefore best described as a mix
              of Xtacking-led technical credibility, a competitive cost curve, and privileged domestic distribution
              access. The durability question is therefore about persistence, not mere entry. YMTC has already proven it
              can enter the set; what remains to be proven is how much of its current wedge survives when incumbents
              lean harder on price, qualification, and ecosystem leverage. Buyers cannot ignore that distinction when
              modeling durable share. It remains a live test.
