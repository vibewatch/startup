      - number: '4.2'
        title: Cost structure, R&D, and profitability
        blocks:
          - type: paragraph
            body: >-
              Public cost evidence is fragmentary but still revealing. TrendForce’s 2025 reporting says YMTC swung from
              a profit in 2023 to a small reported loss in the first nine months of 2024 while R&D rose toward RMB 6
              billion. That is a familiar memory-industry pattern: product and process investment often stays elevated
              through the cycle, and gross-margin quality can move faster than reported revenue suggests. YMTC’s fabs
              and product breadth imply large fixed costs, heavy depreciation, and high working-capital needs, yet the
              public record does not disclose gross margin by product or even a clean cash balance. That makes
              profitability the key unresolved underwriting issue. Investors can be confident that YMTC is not a lightly
              capitalized startup; they cannot yet be equally confident about normalized earnings power across a
              down-cycle. The most sensible framing is that YMTC has achieved industrial scale before achieving
              industrial transparency. That missing bridge is why headline revenue growth cannot be taken at face value
              as proof of durable earnings quality. In a hardware memory business, the line between strategic scale-up
              and value-destructive scaling often sits inside yield, depreciation, and product mix rather than inside
              revenue alone.
