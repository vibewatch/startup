  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              YMTC’s risk stack starts with regulation, and regulation here is not a background issue. The Entity List
              became effective in December 2022 and remains the core operating constraint because it attacks tool
              access, customer comfort, and U.S. legal process simultaneously. The 1260H story is often misunderstood.
              Removal from the Pentagon list in 2026 reduced one reputational overhang, but it did not restore normal
              BIS treatment or reopen U.S. equipment channels. On top of that, Dutch export-control tightening
              reinforces the practical ceiling on advanced-tool access. The legal record matters because it shows the
              restrictions are not abstract: Micron litigation and PTAB proceedings explicitly absorbed YMTC’s
              export-control status into the case record. That means sanctions are not only a supply-chain risk; they
              are also a legal-friction multiplier that can tax partnerships, customers, and IP defense.
