  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Field structure and share order
        blocks:
          - type: paragraph
            body: >-
              YMTC now competes inside an oligopolistic NAND market rather than at its edge. Public 2025 and 2026
              rankings consistently show Samsung first, SK hynix second, and Kioxia, Western Digital or SanDisk, Micron,
              and YMTC clustered below. That matters because YMTC is no longer just a Chinese industrial-policy story;
              it is already large enough to appear in global revenue tables and to matter to incumbent pricing behavior.
              The cleaner interpretation is that YMTC has entered the top tier of relevant competitors without yet
              becoming the undisputed third player. CXMT belongs in the chapter because buyers, investors, and
              policymakers discuss domestic memory champions together, but its focus is still DRAM. For YMTC itself, the
              strategically important fact is not only share but the shape of the field: most rivals have broader global
              trust and equipment access, while YMTC has the stronger domestic-policy tailwind. Investors should
              therefore treat YMTC as a participant in the incumbent set already, but one whose commercial gravity is
              still concentrated in the parts of the market where Chinese buyers can choose on supply assurance and
              policy logic, not only on longest-established brand comfort. That framing prevents overclaiming a
              universal win while still recognizing that YMTC is no longer marginal. It also means competitor analysis
              must preserve both global share context and the much narrower set of channels where YMTC can actually
              convert that share into durable customer relationships. Timing matters too.
            claimRefs:
