      - number: '2.4'
        title: Growth drivers, adoption constraints, and why the market is not fully open
        blocks:
          - type: paragraph
            body: >-
              Three forces are clearly expanding YMTC’s addressable opportunity: AI-driven storage demand, a global NAND
              shortage or tightness that gives alternative suppliers a chance to break in, and Chinese industrial policy
              that nudges domestic OEMs toward local memory. However, the market is not frictionless. U.S. sanctions
              still constrain tool access, overseas security perceptions still limit adoption outside friendly channels,
              and the NAND cycle itself can reverse quickly once new capacity and prices normalize. Even pro-YMTC
              coverage acknowledges that the company’s strongest current demand is domestic and price-sensitive, not yet
              a global premium-franchise position. Reuters-linked coverage of new fabs and local-equipment dependence
              shows the upside and the constraint in one frame: YMTC is scaling because the market wants more supply,
              but it is scaling under a technology-access regime that can still widen or narrow its gap to Samsung, SK
              hynix, Micron, Kioxia, and Sandisk. That means the right market conclusion is
              large-and-open-but-conditional, not large-and-easy.
