      - number: '8.3'
        title: Discounts, premiums, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The sanctions discount is real and should be front and center. YMTC is still structurally harder to own,
              supply, or partner with than Micron, SK hynix, or Kioxia, and its profitability disclosures remain far
              thinner than those public peers. That is why the chapter does not treat high strategic importance as a
              free pass to any valuation. At the same time, ordinary flash comparables also understate the case, because
              YMTC is not merely another NAND vendor. It is a national strategic asset for Chinese semiconductor
              independence, backed by policy, protected by domestic demand, and timed into a favorable memory window.
              The right recommendation is therefore track: attractive enough to keep under close watch, but not
              transparent enough to underwrite aggressively on current public evidence alone. A fair stance does not
              mean a small company or a weak franchise. It means that a large part of the strategic upside is already
              visible in the headline ranges, while several downside protections still depend on evidence the public
              record does not yet provide.
