  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and customer jobs
        blocks:
          - type: paragraph
            body: >-
              YMTC is now selling a storage platform, not a single memory die. Official pages show a full ladder from 3D
              NAND to enterprise SSDs, client SSDs, UFS, eMMC, and branded retail modules under ZHITAI. That matters
              because the company can participate in more customer workflows than a component-only supplier can: mobile
              OEMs can buy embedded storage, PC vendors can buy client SSDs, cloud or server buyers can qualify
              enterprise modules, and retail buyers can buy finished drives. The commercial meaning is straightforward.
              YMTC no longer has to prove only that it can etch NAND; it must prove it can package, qualify, support,
              and refresh products across multiple use cases. The product stack is broad enough that later diligence
              should separate where YMTC already has credible volume products from where it still lacks proof of
              large-scale field validation.
