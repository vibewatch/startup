      - number: '7.3'
        title: Financial and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              The financial and geopolitical risks are mutually reinforcing. Memory is cyclical even for unrestricted
              leaders; for YMTC the cycle is amplified by high capex, high R&D, and limited western commercial
              optionality. TrendForce’s report of a 2024 loss after 2023 profit illustrates how fast the earnings
              picture can change under heavy spending. At the same time, geopolitical escalation remains a constant
              possibility. Even without a new blacklist event, more screening, more secondary-sanctions anxiety, or a
              broader regional crisis could shrink reachable demand or delay equipment deliveries. Taiwan-related
              escalation would affect far more than YMTC alone, but a constrained Chinese memory producer would be
              especially exposed. The result is that financial-model risk cannot be separated from foreign-policy risk.
              Both strike through margin resilience and capital access. That is why a benign demand backdrop should be
              treated as a temporary cushion rather than as structural protection. If the cycle worsens while policy
              tightens, YMTC would face pressure on both cash generation and strategic optionality at the same time.
              That asymmetry is the heart of the risk case. Both matter at once.
