  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and market pricing
        blocks:
          - type: paragraph
            body: >-
              YMTC’s revenue model is hardware-native and therefore structurally different from software or platform
              businesses that investors often benchmark with generic growth metrics. The company sells wafers, SSDs, and
              embedded memory into OEM, channel, and enterprise flows, so revenue quality depends on utilization, yield,
              mix, and NAND pricing rather than on subscription retention. Public evidence is strongest on product scope
              and directional growth: China Daily says Q1 2026 revenue exceeded RMB 20 billion, while share data shows
              that YMTC moved from a low-teens challenger position toward relevance in global rankings during a
              rising-price cycle. What public sources do not show is just as important. There is no clean disclosure of
              realized ASPs, segment revenue, or customer-level profitability, so the chapter has to avoid pretending
              YMTC has SaaS-style visibility. The core financial takeaway is that scale is real, but price-taking and
              cycle exposure still dominate revenue quality.
