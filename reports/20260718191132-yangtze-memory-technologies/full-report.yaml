      - number: '5.4'
        title: Technology gap and underwriting view
        blocks:
          - type: paragraph
            body: >-
              YMTC has closed the gap far faster than many skeptics expected, but it has not erased it. Samsung and SK
              hynix still set the pace on scale, global qualification depth, and the frontier of high-layer NAND
              commercialization. Micron and Kioxia remain important because they show how much product execution sits
              above the die itself: firmware, endurance, platform tuning, and enterprise trust matter alongside density.
              YMTC’s genuine strength is that it no longer needs to defend whether it has a competitive architecture or
              a broad enough product map. It does. The more difficult question is whether localized equipment,
              incomplete public reliability disclosure, and sanctions-limited ecosystem access will slow the next few
              generations enough to preserve an incumbent edge. That is why the chapter’s verdict is favorable on
              product credibility but still cautious on roadmap certainty. That is a meaningful achievement even before
              full frontier parity is reached.
