  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and what YMTC actually addresses
        blocks:
          - type: paragraph
            body: >-
              YMTC is in the NAND flash business, not the whole memory market and not the DRAM market. That distinction
              matters because many public articles discuss Chinese ‘memory’ ambition broadly, while YMTC’s commercial
              surfaces—officially—are 3D NAND wafers, enterprise SSDs, client SSDs, embedded UFS/eMMC, and
              ZHITAI-branded consumer storage. Those products map to the main NAND value pools: smartphones and other
              mobile devices, notebooks and PCs, cloud or enterprise servers via SSDs, and retail after-market storage.
              The most useful boundary is therefore global NAND and NAND-derived storage revenue, with DRAM treated as
              an adjacent but separate market led domestically by CXMT. Competitor product pages from Samsung, SK hynix,
              Micron, Kioxia, and Sandisk confirm that the relevant battlefield is broad and multi-segmented, with
              enterprise SSD now disproportionately important because AI infrastructure is pushing storage performance,
              capacity, and pricing at the same time.
