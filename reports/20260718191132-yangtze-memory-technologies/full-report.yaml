chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, stage, and business scope
        blocks:
          - type: paragraph
            body: >-
              Yangtze Memory Technologies is best understood as China's scaled NAND champion rather than as an
              early-stage startup. Official company materials place the founding in July 2016, headquarters in Wuhan,
              and the operating model in the integrated-device-manufacturer camp: YMTC says it designs chips,
              manufactures wafers, handles packaging and test, and sells system-level products as well as chips. The
              public website and product catalog show a much broader commercial surface than a single wafer program,
              covering 3D NAND wafers, embedded UFS and eMMC, enterprise SSDs, client SSDs, and the ZHITAI
              consumer-storage line. The footprint is also non-trivial. YMTC says it has R&D centers in Wuhan, Beijing,
              and other cities, plus more than 8,000 employees, including roughly 6,000 R&D engineers. That scale,
              together with the current Wuhan fab complex and active IPO process, makes the right stage label late-stage
              private strategic hardware company, not laboratory project.
