      - number: '1.3'
        title: Technology path, product evolution, and strategic milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence around YMTC is milestone-based. Official releases establish a coherent path
              from the 2018 launch of Xtacking, to 2019 mass production of 64-layer Xtacking NAND, to 2020 introduction
              of 128-layer TLC and 1.33Tb QLC, to 2022 enterprise SSD diversification, and to the 2025 recognition of
              Xtacking 4.0 at FMS. The current company profile extends that chronology further, pointing to Gen5 TLC
              mass production in 2024 and Gen5 QLC product release in 2025. Reuters, EE Times Asia, and China Daily then
              connect that technology path to industrial scale: two operating fabs with combined 200,000 wafers per
              month, a third Wuhan fab due to start late in 2026, and two more planned fabs under tighter reliance on
              domestic equipment. The core takeaway for later chapters is that YMTC now has both a credible architecture
              narrative and a credible manufacturing narrative; the risk is not whether it has products, but whether
              sanctions, domestic-tool dependence, and heavy capex will let it keep pace with Korean, Japanese, and U.S.
              incumbents over multiple generations.
