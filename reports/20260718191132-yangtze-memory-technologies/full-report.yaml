        title: Anchors and comparable set
        blocks:
          - type: paragraph
            body: >-
              Valuing YMTC requires more than choosing one headline number. The cleanest dated anchor is Hurun’s US$22
              billion 2025 valuation, because it is specific and already published. The 2026 IPO preparation changes the
              framing, however, by introducing a forward market-clearing scenario where valuation is driven by current
              memory-cycle enthusiasm, strategic self-sufficiency, and capital-market appetite. That is why the chapter
              uses multiple anchors. Public peers show what the market pays for memory leverage in good times,
              Kioxia-type analogs show what a NAND-heavier model can look like, and CXMT shows how Chinese
              strategic-memory narratives can push valuations higher than simple trailing fundamentals might suggest.
              The task is not to defend any single number mechanically; it is to judge which numbers are supportable
              under bull, base, and bear assumptions. Comparable discipline is crucial.
