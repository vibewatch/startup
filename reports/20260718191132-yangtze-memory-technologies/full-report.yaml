      - number: '5.2'
        title: Xtacking architecture and why it matters
        blocks:
          - type: paragraph
            body: >-
              Xtacking remains the central technology thesis. YMTC’s own description emphasizes separate processing of
              the memory array and peripheral CMOS wafers before wafer bonding, and third-party teardown work explains
              why that matters: it can lift I/O density and improve the performance-versus-area tradeoff by freeing more
              space for storage cells. The strongest supportive evidence is long-run, not single-cycle. YMTC launched
              Xtacking in 2018, mass-produced 64-layer parts in 2019, announced 128-layer products in 2020, and later
              positioned Xtacking 3.0 and 4.0 as the basis for more advanced nodes. At the same time, TechInsights
              introduced an important caution. Early retail SSDs marketed around Xtacking 3.0 still showed 128-layer
              dies in teardown, which means the roadmap narrative can run ahead of mass deployment. That does not negate
              the architecture; it means diligence must separate public launch claims from broad shipping mix.
