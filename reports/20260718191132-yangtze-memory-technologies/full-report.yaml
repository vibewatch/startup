      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more nuanced than ‘phone OEMs buy chips.’ In embedded mobile storage, the buyer is
              usually a device OEM or module integrator, the user is the device platform team or end user, and the
              budget owner sits inside smartphone or device procurement. In client and enterprise SSD, the buyer can be
              an OEM, hyperscaler, server vendor, or channel partner; the user can be an end consumer, enterprise IT
              team, or cloud operator. Notebookcheck- and Lenovo-related coverage shows how YMTC now enters mainstream
              systems indirectly through OEM configurations, while BusinessKorea and TrendForce show the ZHITAI brand
              trying to build direct retail pull in Korea and broader Asia. Official YMTC portfolio pages also matter
              because they show the company’s own segmentation logic across enterprise SSD, client SSD, UFS, eMMC, and
              retail storage. The adoption path therefore differs by segment: domestic smartphone and notebook design
              wins reward cost and supply assurance, enterprise SSD wins reward endurance and controller compatibility,
              and retail products rely on distributor trust plus value pricing.
