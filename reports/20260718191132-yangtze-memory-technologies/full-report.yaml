            body: >-
              The capital story is enormous and explicitly state-backed. Public reports now place cumulative investment
              above RMB 160 billion, while 2026 ownership summaries say the Big Fund phases I and II still hold more
              than 23% and Hubei Changsheng remains the largest single shareholder. The Reuters fab reporting, the Phase
              III venture coverage, and the STAR Market preparation all point in the same direction: YMTC still needs
              large pools of long-duration capital to keep expanding capacity and closing process gaps. The
              no-controlling-shareholder structure matters because it signals a coalition of state-backed investors
              rather than a classic founder-led capital stack. The practical implication is that cash adequacy is less
              about whether capital exists in the system and more about whether that capital continues to back
