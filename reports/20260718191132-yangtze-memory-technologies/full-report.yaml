companyProfile:
  summary: >-
    YMTC is a Wuhan-headquartered private memory IDM founded in 2016 that has become China's only scaled NAND champion.
    The company sells 3D NAND wafers, enterprise and client SSDs, UFS, eMMC, and ZHITAI-branded retail storage, while
    public evidence supports more than 8,000 employees, low-teens global NAND share, and a 2025 private-market valuation
    anchor around US$22 billion. Strategic importance and state-backed capital have enabled continuing fab expansion
    despite Entity List restrictions, but audited profitability and governance transparency remain limited.
