- id: durability-view
  title: Durability view
  body: 'Durability is plausible but not yet richly disclosed. YMTC’s retail and client routes can scale faster than enterprise because they require less validation, while mobile and local cloud demand can absorb capacity more quickly than western customers can. That creates a sensible commercial wedge: prove quality where switching costs are manageable, then move upward. The challenge is that public sources do not disclose the data that would prove durability cleanly. There is no NRR, no repeat-purchase curve, and no named top-customer revenue mix. As a result, the right investment view is not that the company lacks customers. It clearly has them. The right view is that YMTC has strong enough domestic traction to matter, but still not enough transparent customer-quality data to treat that traction as fully derisked.'
