- id: apple-hyperscalers-and-whats-missing
  title: Apple, hyperscalers, and what is still missing
  body: The Apple story is the most instructive adverse customer data point in the entire report. Multiple carried reports say Apple qualified YMTC memory and then halted the plan when U.S. controls tightened. That is powerful because it shows a concrete path where technical progress was not enough to protect commercialization. Hyperscaler exposure looks better directionally but weaker as proof. Industry analysis names Alibaba, Tencent, ByteDance, and other domestic firms, yet public case studies remain scarce and often omit exact deployment scope. That means investors should treat domestic server or cloud traction as strong directional evidence, not as fully closed reference-quality proof. The most important commercial unknowns are still concentration, repeat orders, and enterprise production references by name. That gap should not be read as disbelief in domestic cloud relevance; it should be read as a reminder that strategic customer lists and true production-grade case studies are different
    evidence classes. For underwriting, the second class matters much more than the first.
  claimRefs:
