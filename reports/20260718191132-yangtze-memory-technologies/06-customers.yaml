- id: geography-and-commercial-concentration
  title: Geography and commercial concentration
  body: 'The geographic center of gravity is still China even when proof appears abroad. The Notebookcheck and TechPowerUp Lenovo evidence was explicitly tied to German-market devices rather than to North America, while BusinessKorea’s distributor story shows a nearby-Asia channel push rather than a broad western reopening. On the smartphone side, the strongest public signals still cluster around Chinese Android OEMs rather than Apple. Industry analysis goes further by naming Chinese cloud and technology groups such as Huawei, Alibaba, Tencent, and ByteDance as important demand anchors. The common pattern is clear: YMTC’s commercialization is strongest where local supply assurance and localization matter most, and weakest where export-control or reputational screens raise procurement friction. That concentration creates upside and risk at the same time. Because of that pattern, concentration is not only a numerical issue but also a proof-quality issue: the better-documented the current customer
    examples are, the more obvious it becomes that the evidence cluster is still narrow relative to YMTC''s full ambition.'
