  name: Yangtze Memory Technologies
chapter:
  number: 6
  title: Customers
  summary: 'YMTC has crossed the line from inferred demand to named commercial proof: Xiaomi-related handset storage, Lenovo notebook SSD placement, and active ZHITAI retail launches all show that shipments are real. But the company’s customer quality is still heavily concentrated in China and nearby channels, hyperscaler proof remains thinner than client-list narratives imply, and the lost Apple path remains the clearest reminder that geopolitics can still override technical qualification.'
sections:
- id: segment-map-and-best-proof
  title: Segment map and best proof
  body: 'YMTC’s customer map is multi-segmented, but the quality of proof is uneven. Public evidence is strongest for three surfaces: Chinese smartphone OEM adoption, Lenovo laptop SSD placement, and ZHITAI-branded retail products. Those three routes matter because they show three different buying motions. Smartphones buy into a BOM decision, PCs buy through an OEM sourcing choice, and retail products buy through sell-through and distributor trust. Together they prove that YMTC is already commercial, not merely preparing to be commercial. They do not yet prove broad global enterprise adoption. The clearest named proofs are Xiaomi and Lenovo, while retail proof mainly shows that YMTC can carry a branded-storage proposition through channels rather than just through component sales. Even this proof should be read carefully. Each named example demonstrates real commercialization, but each also comes with a scope limitation: Xiaomi is a supply-chain report, Lenovo is region-specific, and retail
    launches prove product movement more than enterprise stickiness.'
