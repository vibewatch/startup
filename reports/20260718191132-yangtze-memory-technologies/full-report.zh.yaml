      - number: '2.4'
        title: 增长驱动、采用约束，以及为什么市场并非完全开放
        blocks:
          - type: paragraph
            body: >-
              三股力量正清晰扩张 YMTC 的可触达机会：AI 驱动的存储需求、让替代供应商有机会切入的全球 NAND 短缺或紧张，以及推动国内 OEM
              转向本地存储的中国产业政策。但市场并非没有摩擦。美国制裁仍限制设备获取，海外安全观感仍限制友好渠道之外的采用，NAND 周期本身也可能在新增产能和价格正常化后迅速反转。即便是支持 YMTC
              的报道，也承认公司当前最强需求来自国内且对价格敏感，还不是全球高端品牌地位。Reuters 关于新晶圆厂和本地设备依赖的报道，把上行空间和约束放在同一画面：YMTC
              正在扩张，因为市场需要更多供给；但它是在技术获取制度下扩张，这套制度仍可能拉宽或收窄它与 Samsung、SK hynix、Micron、Kioxia 和 Sandisk
              的差距。因此，正确的市场结论是“大且开放、但有条件”，不是“大且容易”。
