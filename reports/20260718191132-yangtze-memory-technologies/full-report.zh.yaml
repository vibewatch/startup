      - number: '1.4'
        title: 制裁、诉讼和主要未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录在身份和产品节奏上偏正面，但在地缘政治和法律复杂性上明显反向。Federal Register 记录确认，美国商务部自 December 16, 2022 起将 YMTC 列入 Entity
              List；Reuters 称，公司此后加强了与 AMEC 等本土供应商的协作，因为美国设备获取受限。MemoryMarket 报道，美国国防部 February 2026 1260H list 移除了
              YMTC，这在声誉和采购障碍上小幅减压，但同一报道也称，更广泛的限制仍在。Micron 冲突也是真实问题，不是假设：地区法院证据开示命令和 January 2026 USPTO 局长复审命令显示，专利诉讼和
              IPR 争议仍在进行，YMTC 的 Entity List 身份本身就是案卷的一部分。最后，即便 IPO
              动能存在，核心经济性仍披露不足。公开来源支撑估值、规模和增长方向，但无法支撑可靠的当前毛利率、经常性组合或正常化自由现金流图景。因此，后续章节应把估值和盈利能力当作仍在进行的尽调问题，而不是既定事实。
