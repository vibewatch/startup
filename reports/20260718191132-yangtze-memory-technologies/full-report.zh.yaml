      - number: '6.3'
        title: Apple、超大规模云厂商，以及仍缺什么
        blocks:
          - type: paragraph
            body: >-
              Apple 故事是整份报告里最有启发性的反向客户数据点。多篇转引报道称，Apple 曾认证 YMTC
              存储，随后在美国管制收紧后叫停计划。这很有力，因为它展示了一条具体路径：技术进步不足以保护商业化。超大规模云厂商敞口在方向上更好，但作为证据更弱。行业分析点名 Alibaba、Tencent、ByteDance
              和其他国内公司，但公开案例研究仍稀少，且常常省略确切部署范围。因此，投资者应把国内服务器或云端进展视为强方向性证据，而不是完全闭合、可引用级别的证明。最重要的商业未知数仍是集中度、重复订单，以及具名企业生产参考。这个缺口不应被理解为不相信国内云相关性；它应被理解为一个提醒：战略客户名单和真正生产级案例研究属于不同证据类别。承销时，第二类远比第一类重要。
