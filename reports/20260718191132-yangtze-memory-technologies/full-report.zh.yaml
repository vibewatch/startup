  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分段图谱和最佳证据
        blocks:
          - type: paragraph
            body: >-
              YMTC 的客户图谱是多分段的，但证据质量不均衡。公开证据在三条表面上最强：中国智能手机 OEM 采用、Lenovo 笔记本 SSD 搭载，以及 ZHITAI
              品牌零售产品。这三条路径很重要，因为它们显示了三种不同购买动作。智能手机进入 BOM 决策，PC 通过 OEM 采购选择进入，零售产品则靠终端动销和经销商信任。合起来，它们证明 YMTC
              已经商业化，而不是只是在准备商业化。它们还不能证明广泛的全球企业级采用。最清晰的具名证明是 Xiaomi 和 Lenovo；零售证明主要说明 YMTC
              能通过渠道承载一个品牌存储主张，而不只是通过组件销售。即便如此，这些证明也要谨慎解读。每个具名例子都展示了真实商业化，但每个例子都有范围限制：Xiaomi 是供应链报道，Lenovo
