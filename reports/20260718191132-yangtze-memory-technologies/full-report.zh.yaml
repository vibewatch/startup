      - number: '2.2'
        title: 市场规模口径与当前增长来源
        blocks:
          - type: paragraph
            body: >-
              公开来源支持多个规模口径，这些口径应分开看，而不是压成一个虚假精确的 TAM。最宽的口径是全球 NAND 市场：EE Times 和 Reuters 转引报道把 2025 收入锚定在约 US$52
              billion。基于 Counterpoint 的 2026 报道又显示，近期市场更热，第一季度 NAND 收入达到 US$46 billion，AI 带来的需求和价格重估正在重置市场。在总量内部，企业级 SSD
              是眼下最重要的子板块。SamMobile 和 InfotechLead 摘要的 Counterpoint 报道称，企业级 SSD 占 Q1 2026 NAND 收入的 43%，到年底可能超过 60%。这对
              YMTC 具有战略意义，因为它解释了为什么数据中心和服务器存储远比传统智能手机存储视角更重要。它也解释了为什么投资者此时愿意考虑 IPO 叙事：存储周期已经急剧转正，而新增产能仍紧，买家在寻找增量供给。
