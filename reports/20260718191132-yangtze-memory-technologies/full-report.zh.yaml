      - number: '1.3'
        title: 技术路径、产品演进和战略里程碑
        blocks:
          - type: paragraph
            body: >-
              围绕 YMTC 的最强公开证据来自里程碑。官方发布串起了一条连贯路径：2018 年推出 Xtacking，2019 年量产 64 层 Xtacking NAND，2020 年推出 128 层 TLC 和
              1.33Tb QLC，2022 年扩展企业级 SSD，并在 2025 年于 FMS 获得 Xtacking 4.0 认可。当前公司简介把时间线继续往前推，指向 2024 年 Gen5 TLC 量产和 2025 年
              Gen5 QLC 产品发布。Reuters、EE Times Asia 和 China Daily 又把这条技术路径与工业规模连起来：两座运营晶圆厂合计 200,000 片/月，第三座武汉晶圆厂预计 2026
              年末启动，另有两座晶圆厂在规划中，且对国产设备依赖更重。给后文的核心结论是，YMTC
              现在既有可信的架构叙事，也有可信的制造叙事；风险不在于它是否有产品，而在于制裁、国产设备依赖和沉重资本开支，能否让它在多个世代上跟住韩国、日本和美国既有巨头。
