  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              YMTC 的风险栈从监管开始，而这里的监管不是背景问题。Entity List 于 December 2022 生效，并仍是核心运营约束，因为它同时打击设备获取、客户舒适度和美国法律程序。1260H
              故事经常被误读。2026 年从美国国防部名单移除，降低了一个声誉包袱，但并没有恢复正常 BIS
              待遇，也没有重新打开美国设备渠道。除此之外，荷兰出口管制收紧进一步强化了先进设备获取的实际天花板。法律记录重要，因为它说明限制不是抽象的：Micron 诉讼和 PTAB 程序已经明确把 YMTC
              的出口管制状态纳入案卷。这意味着制裁不只是供应链风险；它也是法律摩擦放大器，会给合作伙伴、客户和 IP 防御征税。
