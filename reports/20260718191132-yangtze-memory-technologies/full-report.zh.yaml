  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈和客户任务
        blocks:
          - type: paragraph
            body: >-
              YMTC 现在销售的是一个存储平台，而不是单颗存储裸片。官方页面展示了从 3D NAND 到企业级 SSD、客户端 SSD、UFS、eMMC，以及 ZHITAI
              品牌零售模块的完整阶梯。这很重要，因为相比只卖组件的供应商，公司能参与更多客户工作流：移动 OEM 可以购买嵌入式存储，PC 厂商可以购买客户端
              SSD，云或服务器买家可以认证企业级模块，零售买家可以购买成品硬盘。商业含义很直接。YMTC 不再只需要证明自己能刻蚀
              NAND；它必须证明自己能在多个用例中封装、认证、支持并迭代产品。产品栈已经足够宽，后续尽调应拆开看：哪些地方 YMTC 已有可信的规模化产品，哪些地方仍缺乏大规模现场验证证明。
