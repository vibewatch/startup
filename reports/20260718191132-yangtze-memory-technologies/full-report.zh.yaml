  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局、阶段和业务范围
        blocks:
          - type: paragraph
            body: >-
              Yangtze Memory Technologies 更适合被理解为中国的规模化 NAND 冠军，而不是早期创业公司。官方材料显示，公司成立于 July
              2016，总部在武汉，运营模式属于集成器件制造商：YMTC 称自己设计芯片、制造晶圆、负责封装和测试，并销售系统级产品和芯片。公开网站和产品目录显示，它的商业触面远不止单一晶圆项目，覆盖 3D NAND
              晶圆、嵌入式 UFS 和 eMMC、企业级 SSD、客户端 SSD，以及 ZHITAI 消费级存储线。布局也不轻。YMTC 称其在武汉、北京和其他城市设有 R&D 中心，员工超过 8,000 人，其中约
              6,000 名为 R&D 工程师。这一规模，加上现有武汉晶圆厂集群和正在推进的 IPO 进程，使它更应被标为后期私营战略硬件公司，而不是实验室项目。
