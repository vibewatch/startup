      - number: '3.3'
        title: 切换成本、分销和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              NAND 的切换成本高度取决于板块。手机 OEM 或零售经销商比企业平台所有者更容易多源采购；后者必须在漫长认证周期里验证固件、耐久性和控制器行为。因此，YMTC
              当前份额增长在手机、渠道和国内客户端设备上更可信，在面向全球的企业机群上则没那么可信。国内政策层加深了护城河：本地化激励让中国买家更愿意尝试
              YMTC，而西方买家往往把它视为商业上或政治上不可采购。政策溢价真实存在，但也脆弱。如果既有巨头在下行周期大幅降价，或制裁再次扩大，YMTC
              当前优势的一部分可能被证明是周期性的，而不是持久的。因此，护城河最好被描述为 Xtacking
              带来的技术可信度、具竞争力的成本曲线，以及特权化国内分销入口的混合体。耐久性问题关乎能否持续，而不只是能否进入。YMTC
              已经证明自己能进入这个集合；仍待证明的是，当既有巨头更用力地压价格、压认证和用生态杠杆时，当前楔入点还能留下多少。买家在建模持久份额时不能忽视这个区分。它仍是一个正在发生的测试。
