      - number: '7.4'
        title: 缓释视角和否决条件
        blocks:
          - type: paragraph
            body: >-
              公开记录确实显示出缓释，但缓释是局部的。设备本地化和持续国家支持降低即时生存风险，强劲的 2026 需求也在产能被吸收时帮助公司遮住部分低效。但这些是缓冲，不是解药。YMTC
              没有恢复正常的西方采购渠道，没有逃离大宗存储周期，也没有披露足够治理或环境细节来抹掉执行担忧。对投资者来说，最重要的否决条件不是某一条孤立负面标题，而是更严制裁和更弱 NAND
              市场同时出现；这一组合会同时攻击成本结构和需求。因此，风险章节支持谨慎立场，同时也承认 YMTC 已经证明自己能比许多批评者预期活得更久。能否存活已经不再是问题；能否活得好仍是问题。压力会迅速复合。
