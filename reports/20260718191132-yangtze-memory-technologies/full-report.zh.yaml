      - number: '6.4'
        title: 耐久性视角
        blocks:
          - type: paragraph
            body: >-
              耐久性有可能成立，但披露还不充分。YMTC
              的零售和客户端路径可以比企业级更快扩张，因为它们需要的验证更少；移动和本地云需求也能比西方客户更快吸收产能。这形成了一个合理的商业楔子：先在切换成本可控的地方证明质量，再向上移动。挑战在于，公开来源没有披露能干净证明耐久性的数据。没有净留存率（NRR），没有重复购买曲线，也没有具名头部客户收入组合。因此，正确的投资观点不是公司缺客户。它显然有客户。正确观点是，YMTC
              的国内牵引力已强到值得重视，但透明的客户质量数据仍不足，不能把这份牵引力视为完全去风险。
