        title: 运营、依赖和客户传导
        blocks:
          - type: paragraph
            body: >-
              运营风险最好理解为制裁转译成工程和商业现实。Reuters 关于国产设备的报道令人鼓舞，因为它显示 YMTC
              在失去正常设备获取后没有冻结。但它同样带来风险，因为国产来源设备链并不等同于不受约束地获取最优外国设备。因此，AMEC 和 NAURA 同时是缓释节点和依赖节点。同样的转译逻辑也出现在客户侧。Apple
              放弃采购路径不只是新闻轶事；它是已认证商业路径被政治阻断的最干净例子。这种传导风险延伸到西方 OEM 筛查、承包商尽调，以及任何在评估技术前先把 YMTC
              当成合规问题的买家。实际操作中，设备风险和客户风险是同一个问题在不同位置的表达。两者连接直接，并非理论推演。
