  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和市场定价
        blocks:
          - type: paragraph
            body: >-
              YMTC 的收入模式是硬件原生的，因此结构上不同于投资者常用通用增长指标去对标的软件或平台公司。公司向 OEM、渠道和企业流销售晶圆、SSD 和嵌入式存储，所以收入质量取决于产能利用率、良率、组合和 NAND
              定价，而不是订阅留存。公开证据在产品范围和方向性增长上最强：China Daily 称 Q1 2026 收入超过 RMB 20 billion；份额数据则显示，YMTC
              在涨价周期里从低双位数挑战者位置走向全球排名里的相关性。公开来源没有显示的部分同样重要。已实现 ASP、分板块收入或客户级盈利能力都没有干净披露，因此本章必须避免假装 YMTC 拥有 SaaS
              式可见度。核心财务结论是，规模真实存在，但价格接受者属性和周期敞口仍主导收入质量。
