      - number: '4.2'
        title: 成本结构、R&D 和盈利能力
        blocks:
          - type: paragraph
            body: >-
              公开成本证据零散，但仍有信息量。TrendForce 的 2025 报道称，YMTC 从 2023 盈利转为 2024 前九个月小幅报告亏损，同时 R&D 升至接近 RMB 6
              billion。这是存储行业熟悉的模式：产品和工艺投资往往在周期中保持高位，毛利率质量变化可能快于报告收入所暗示的速度。YMTC
              的晶圆厂和产品广度意味着庞大固定成本、沉重折旧和高营运资本需求，但公开记录既没有按产品披露毛利率，也没有披露清晰现金余额。这让盈利能力成为最关键的未解承销问题。投资者可以确信 YMTC
              不是轻资本创业公司；但还不能同样确信它在下行周期中的正常化盈利能力。最合理的框架是，YMTC
              先达到工业规模，后达到工业透明度。缺失的桥梁，正是不能把标题收入增长直接视为持久盈利质量证明的原因。在硬件存储业务里，战略性扩产和毁值式扩张的边界，往往藏在良率、折旧和产品组合里，而不只在收入里。
