companyProfile:
  summary: >-
    YMTC 是一家总部在武汉的私营存储 IDM，成立于 July 2016；它已经成为中国唯一实现规模化的 NAND 冠军。公司销售 3D NAND 晶圆、企业级和客户端 SSD、UFS、eMMC，以及 ZHITAI
    品牌零售存储产品。公开证据支撑其员工超过 8,000 人、全球 NAND 份额处在低双位数，并以 2025 私募市场估值约 US$22 billion 作为锚点。战略重要性和国家支持资本让公司在 Entity List
