  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 锚点和可比集合
        blocks:
          - type: paragraph
            body: >-
              给 YMTC 估值不能只挑一个标题数字。最干净的有日期锚点是 Hurun 的 US$22 billion 2025 估值，因为它具体且已经发布。不过，2026 IPO
              准备改变了框架，引入一个前瞻公开市场定价场景：估值由当前存储周期热度、战略自主叙事和资本市场胃口共同驱动。因此，本章使用多个锚点。公开同业显示市场在好时期愿意为存储杠杆支付多少，Kioxia 类型参照显示更偏
              NAND 的模式可能长什么样，CXMT 则显示中国战略存储叙事如何把估值推到高于简单历史基本面的位置。任务不是机械捍卫任何单一数字，而是判断哪些数字在乐观、基准和悲观假设下站得住。可比纪律至关重要。
