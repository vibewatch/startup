      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱比“手机 OEM 买芯片”更复杂。在嵌入式移动存储里，买方通常是设备 OEM 或模块集成商，用户是设备平台团队或终端用户，预算掌握在智能手机或设备采购部门。客户端和企业级 SSD 里，买方可以是
              OEM、超大规模云厂商、服务器厂商或渠道合作伙伴；用户可以是终端消费者、企业 IT 团队或云运营商。Notebookcheck 和围绕 Lenovo 的报道显示，YMTC 现在会通过 OEM
              配置间接进入主流系统；BusinessKorea 和 TrendForce 则显示，ZHITAI 品牌正在韩国和更广泛亚洲市场尝试建立直接零售拉力。YMTC 官方产品组合页面同样重要，因为它显示公司自身按企业级
              SSD、客户端 SSD、UFS、eMMC 和零售存储做分层。因此，不同板块的采用路径不同：国内智能手机和笔记本设计导入奖励成本和供给保障，企业级 SSD
              设计导入奖励耐久性和控制器兼容，零售产品则依赖经销商信任和价值定价。
