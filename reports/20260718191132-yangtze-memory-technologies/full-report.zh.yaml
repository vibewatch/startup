      - number: '8.4'
        title: 最终尽调观点
        blocks:
          - type: paragraph
            body: >-
              剩余尽调路径异常清楚。投资者需要经审计财务、毛利率桥、头部客户组合，以及精确的资本开支或补贴计划，才能把任何激进 IPO
              标记视为完全可辩护。他们还需要更好的答案：当前出货量中有多少真正跑在最新节点上；如果国内需求转弱，客户集中度会如何变化。在此之前，正确立场是平衡，而不是否定。YMTC
              已经取得足够规模和技术可信度，足以支撑严肃估值讨论，Hurun 的 US$22 billion 锚点看起来合理。仍不确定的是，在市场为 IPO
