  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及 YMTC 实际覆盖的部分
        blocks:
          - type: paragraph
            body: >-
              YMTC 做的是 NAND flash，不是整个存储市场，也不是 DRAM 市场。这一区分很重要，因为很多公开文章会宽泛讨论中国的“存储”雄心，而 YMTC 官方商业触面是 3D NAND 晶圆、企业级
              SSD、客户端 SSD、嵌入式 UFS/eMMC 和 ZHITAI 品牌消费级存储。这些产品对应主要 NAND 价值池：智能手机和其他移动设备、笔记本和 PC、通过 SSD
              进入云或企业服务器，以及零售售后存储。因此，最有用的边界是全球 NAND 和 NAND 衍生存储收入；DRAM 应作为相邻但独立的市场处理，国内由 CXMT 牵头。Samsung、SK
              hynix、Micron、Kioxia 和 Sandisk 的竞品页面也确认，真正的战场宽且多分段；企业级 SSD 现在格外重要，因为 AI 基础设施正在同时推高存储性能、容量和价格。
