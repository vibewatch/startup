      - number: '3.2'
        title: YMTC 赢在哪里，赢不了哪里
        blocks:
          - type: paragraph
            body: >-
              当国内 OEM 更看重供给保障、竞争性定价和政策一致性，而不是西方风险筛查时，YMTC 更容易赢。智能手机和零售渠道的证据最强：Xiaomi 报道和韩国渠道扩张说明，YMTC
              能在奖励可接受性能和激进成本的板块拿到真实份额。企业级存储不同。既有巨头仍拥有更深的认证历史、更强的全球客户信任，以及更广的企业控制器和平台支持。这意味着 YMTC 并没有在所有地方同口径击败 Samsung 或
              Micron；它是在中国买家能接受较新供应商、且制裁不会自动阻断采用的地方选择性拿单。这个区分很重要，因为它让 YMTC
              的护城河看起来更像区域性和路径特定，而不是普适性。换句话说，采购团队能接受低信任但低摩擦的国内替代时，YMTC 最强；全球认证历史本身就是产品一部分时，YMTC
              最弱。理解为什么设计导入标题不会自动转化为无限制全球企业份额，这一区分是核心。同一个买家仍会因板块和地理位置不同而表现很不一样。
