              资本故事体量巨大，且明确由国家支持。公开报道现在把累计投资放在 RMB 160 billion 以上；2026 年所有权摘要称，Big Fund 一期和二期仍持有超过 23%，Hubei Changsheng
              仍是最大单一股东。Reuters 的晶圆厂报道、三期基金相关合资报道，以及科创板准备，都指向同一方向：YMTC
              仍需要大规模、长周期资本池，才能继续扩产并缩小工艺差距。无控股股东结构很重要，因为它传递的是一组国家支持投资者联盟，而不是典型创始人主导的资本栈。实际含义是，现金充足性更少取决于体系里是否有资本，更多取决于这些资本是否继续支持有经济纪律的扩张。国家支持降低短期生存风险，但也让外界更难推断真实的独立回报门槛。
