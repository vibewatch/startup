      - number: '8.2'
        title: 情景逻辑和倍数驱动因素
        blocks:
          - type: paragraph
            body: >-
              主要驱动因素很直接：收入规模、低双位数份额能否持续、存储上行周期持续多久，以及公开市场投资者愿意忽略多少制裁折价。低端的悲观情景假设周期降温，公司仍难以被西方资本承销，且毛利率透明度始终不足以支撑溢价倍数。基准情景假设
              YMTC 守住份额增量、留住国内客户，并以更接近十亿美元计的高十位数或低三十位数区间挂牌。乐观情景则要求更多：国内 AI
              和存储需求持续火热，利润率正常化，战略存储独立性带来的溢价压过制裁谨慎。三种情景都可能成立，所以估值必须表达为区间，而不是精确点估计。实际要点是，公开市场投资者并不是只在数字之间选择，而是在关于这些数字在周期正常化后能有多持久的叙事之间选择。在这种背景下，估值纪律比任何一条乐观标题都更重要。区间纪律仍然必要。
