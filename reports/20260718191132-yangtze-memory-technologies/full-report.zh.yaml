      - number: '1.2'
        title: 所有权、治理和资本结构可见度
        blocks:
          - type: paragraph
            body: >-
              YMTC 有国家资本支持且战略重要，但治理图景在股权上比在高管上更透明。China Daily 关于 YMTC 科创板申报的报道称，公司没有控股股东，Hubei Changsheng Development 持股
              26.54%，为最大股东，另有国家 IC 基金和地方国资资本支持。Bamboo Works 和申报报道都显示，YMTC 最近完成股份制改造，引入 16 家机构投资者，并在 IPO
              工作前选出首届董事会。沿革仍然重要。YMTC 仍与重组后的 Tsinghua Unigroup 体系相连；2022 重组协议和配套法律报道显示，Wise Road/JAC 牵头的财团以 RMB 54.9
              billion 收购了重组后 Unigroup 的 100%。公开披露仍薄弱的是现任董事会图谱、委员会结构，或清晰的当前高管阵容。独立报道过去曾称 Chen Nanxiang 为代理 CEO
              或董事长，但当前官方公开界面并没有披露足够多高管信息，不能把领导层连续性视为完全透明。
