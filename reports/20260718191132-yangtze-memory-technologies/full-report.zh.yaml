      - number: '7.3'
        title: 财务和地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              财务风险和地缘政治风险相互强化。即便对不受限制的龙头来说，存储也是周期性行业；对 YMTC 来说，高资本开支、高 R&D 和有限西方商业可选项会放大周期。TrendForce 报道的 2024 亏损、此前
              2023
              盈利，说明重投入下盈利图景变化可以多快。与此同时，地缘政治升级始终可能发生。即便没有新的黑名单事件，更多筛查、更多二级制裁焦虑，或更广泛的区域危机，都可能缩小可触达需求或延迟设备交付。台海升级会影响远不止
              YMTC，但受约束的中国存储生产商会尤其暴露。结果是，财务模型风险无法与外交政策风险分开。两者都会穿透到利润率韧性和资本可获得性。这就是为什么良性的需求背景应被视为临时缓冲，而不是结构性保护。如果周期恶化同时政策收紧，YMTC
              会同时承受现金生成和战略可选项压力。这种不对称性是风险案例的核心。两者同时重要。
