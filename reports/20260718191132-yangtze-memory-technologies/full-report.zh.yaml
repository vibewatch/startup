      - number: '6.2'
        title: 地理和商业集中度
        blocks:
          - type: paragraph
            body: >-
              即便证据出现在海外，地理重心仍在中国。Notebookcheck 和 TechPowerUp 关于 Lenovo 的证据明确关联德国市场设备，而不是北美；BusinessKorea
              的经销商故事显示的是近邻亚洲渠道推进，而不是广泛的西方重新开放。智能手机侧，最强公开信号仍集中在中国 Android OEM，而不是 Apple。行业分析进一步点名 Huawei、Alibaba、Tencent
              和 ByteDance 等中国云和科技集团是重要需求锚点。共同模式很清楚：在本地供给保障和本地化最重要的地方，YMTC
              的商业化最强；在出口管制或声誉筛查提高采购摩擦的地方，它最弱。这种集中同时创造上行和风险。正因为这一模式，集中度不只是数字问题，也是证据质量问题：当前客户例子记录得越好，越能看出证据簇相对 YMTC
              的全部雄心仍然狭窄。
