      - number: '5.2'
        title: Xtacking 架构及其重要性
        blocks:
          - type: paragraph
            body: >-
              Xtacking 仍是核心技术命题。YMTC 自己的描述强调，先分别处理存储阵列和外围 CMOS 晶圆，再做晶圆键合；第三方拆解解释了这为什么重要：它可以提升 I/O 密度，并通过释放更多空间给存储单元，改善性能
              / 面积权衡。最强支撑证据来自长期路径，而不是单个周期。YMTC 在 2018 年推出 Xtacking，2019 年量产 64 层产品，2020 年发布 128 层产品，之后又把 Xtacking 3.0 和
              4.0 定位为更先进节点的基础。同时，TechInsights 提出了重要提醒。早期围绕 Xtacking 3.0 营销的零售 SSD，在拆解里仍显示 128
              层裸片，这意味着路线图叙事可能跑在大规模部署之前。这不会否定架构本身；它意味着尽调必须区分公开发布说法和广泛出货组合。
