  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构和份额顺位
        blocks:
          - type: paragraph
            body: >-
              YMTC 现在是在寡头化 NAND 市场内部竞争，而不是站在边缘。2025 和 2026 的公开排名持续显示 Samsung 第一、SK hynix 第二，Kioxia、Western Digital 或
              SanDisk、Micron 与 YMTC 聚在其后。这一点很重要，因为 YMTC 已经不只是中国工业政策故事；它的体量已经足以出现在全球收入表里，也足以影响既有巨头的定价行为。更干净的解读是，YMTC
              已进入主要竞争者的第一梯队，但还没有成为无可争议的第三名。CXMT 需要放进本章，因为买家、投资者和政策制定者会把国内存储冠军放在一起讨论，但它的重点仍是 DRAM。对 YMTC
              本身而言，战略重点不只是份额，还有格局形状：多数对手拥有更广的全球信任和设备获取，YMTC 则拥有更强的国内政策顺风。因此，投资者应把 YMTC
              视作已经进入既有厂商集合的参与者，但它的商业重心仍集中在中国买家能基于供给保障和政策逻辑做选择的市场部分，而不只是基于历史最久品牌带来的舒适感。这样的框架既避免夸大成全球通吃，也承认 YMTC
              已不再边缘。它还意味着，竞争分析必须同时保留全球份额背景，以及 YMTC 真正能把份额转化为持久客户关系的更窄渠道集合。时点也很重要。
