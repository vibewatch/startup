      - number: '8.3'
        title: 折价、溢价和建议
        blocks:
          - type: paragraph
            body: >-
              制裁折价真实存在，并且应放在最前面。相比 Micron、SK hynix 或 Kioxia，YMTC
              在持有、供货或合作上仍结构性更难，盈利披露也远薄于这些上市同业。因此，本章不会把高度战略重要性当成通往任何估值的免费通行证。与此同时，普通闪存可比公司也会低估这个案例，因为 YMTC 不只是另一个 NAND
              厂商。它是中国半导体独立的国家战略资产，有政策支持，有国内需求保护，也踩在有利的存储窗口。正确建议因此是观察：足够有吸引力，值得密切跟踪；但仅靠当前公开证据，还不够透明，不能激进承销。合理立场并不意味着公司小或业务地位弱。它意味着，战略上行的大部分已经体现在标题区间里，而若干下行保护仍依赖公开记录尚未提供的证据。
