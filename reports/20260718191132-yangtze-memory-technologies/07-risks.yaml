company:
  name: Yangtze Memory Technologies
chapter:
  number: 7
  title: Risks
  summary: 'YMTC’s risk profile is dominated by stacked constraints rather than one isolated weakness: the Entity List still limits equipment and customer freedom, Dutch controls reinforce the frontier-tool ceiling, Micron litigation keeps legal friction alive, and any Apple-style commercial path can still be interrupted by politics. At the same time, domestic localization and state backing clearly mitigate survivability risk, so the key diligence question is whether mitigation is strong enough to keep margin, roadmap, and customer access intact through the next memory down-cycle.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'YMTC’s risk stack starts with regulation, and regulation here is not a background issue. The Entity List became effective in December 2022 and remains the core operating constraint because it attacks tool access, customer comfort, and U.S. legal process simultaneously. The 1260H story is often misunderstood. Removal from the Pentagon list in 2026 reduced one reputational overhang, but it did not restore normal BIS treatment or reopen U.S. equipment channels. On top of that, Dutch export-control tightening reinforces the practical ceiling on advanced-tool access. The legal record matters because it shows the restrictions are not abstract: Micron litigation and PTAB proceedings explicitly absorbed YMTC’s export-control status into the case record. That means sanctions are not only a supply-chain risk; they are also a legal-friction multiplier that can tax partnerships, customers, and IP defense.'
