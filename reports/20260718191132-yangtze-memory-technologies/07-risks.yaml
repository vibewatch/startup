- id: mitigation-view-and-kill-criteria
  title: Mitigation view and kill criteria
  body: The public record does show mitigation, but the mitigation is partial. Localization of tools and continuing state support reduce immediate survivability risk, and strong 2026 demand helps the company hide some inefficiency while capacity is absorbed. Yet these are buffers, not cures. YMTC has not normalized western procurement access, has not escaped the commodity memory cycle, and has not disclosed enough governance or environmental detail to erase execution concerns. For investors, the most important kill criterion is not one isolated bad headline. It is the combination of tougher sanctions and a weaker NAND market at the same time, because that combination would attack both cost structure and demand simultaneously. The risk chapter therefore supports a cautious stance even while acknowledging that YMTC has already proved it can survive longer than many critics expected. Surviving is no longer the question; surviving well still is. Pressure can compound quickly.
