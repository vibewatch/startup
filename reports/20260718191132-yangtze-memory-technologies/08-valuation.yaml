    - Chinese strategic-memory comparator
    - Shows what domestic strategic premium can do
    - Closest China memory-market narrative peer
    - DRAM economics differ from NAND
  notes: The comp set is deliberately mixed to capture both pure NAND logic and strategic-memory premium logic.
