  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - Income statement, balance sheet, cash flow
    - Anchors revenue and solvency quality
    - IPO prospectus / auditor review
  - - Gross-margin bridge
    - Product mix, yield, depreciation, subsidies
    - Separates strategic scale from economic quality
    - Management accounts and fab economics
  - - Customer concentration
    - Top customers by revenue and region
    - Tests concentration and geopolitical fragility
    - Sales-mix disclosure
  - - Capex / subsidy structure
    - Phase-by-phase funding and support terms
    - Tests capital efficiency and policy dependency
    - Prospectus and shareholder agreements
  - - Node-mix proof
    - Share of volume on newest generations
    - Tests technology-gap narrative
    - Technical diligence and teardown review
  notes: These are the minimum asks required to move from public-market curiosity to stronger conviction.
