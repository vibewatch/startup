- id: scenario-logic-and-what-drives-multiples
  title: Scenario logic and what drives multiples
  body: 'The main drivers are straightforward: revenue scale, low-teens share sustainability, the duration of the memory up-cycle, and how much of a sanctions discount public investors are willing to ignore. At the low end, a bear case assumes the cycle cools, the company remains difficult for western capital to underwrite, and gross-margin transparency never improves enough to justify premium multiples. A base case assumes that YMTC holds its share gains, keeps domestic customers, and prices a listing closer to the high-teens or low-thirties of billions. A bull case assumes more than that: domestic AI and storage demand stay hot, margins normalize, and strategic memory independence commands a premium that overwhelms sanctions caution. Because all three scenarios are plausible, valuation has to be expressed as a range rather than as a precise point estimate. The practical point is that public-market investors are not choosing only between numbers but between narratives about how durable
    those numbers could be once the cycle normalizes. In that setting, valuation discipline matters more than any one bullish headline. Range discipline remains essential.'
