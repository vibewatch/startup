- id: final-diligence-view
  title: Final diligence view
  body: The remaining diligence path is unusually clear. Investors need audited financials, a gross-margin bridge, top-customer mix, and a precise capex or subsidy schedule before treating any aggressive IPO mark as fully defensible. They also need a better answer on how much of current volume is truly on the newest nodes and how customer concentration changes if domestic demand softens. Until then, the correct stance is balanced rather than dismissive. YMTC has already achieved enough scale and technical credibility to justify a serious valuation discussion, and the US$22 billion Hurun anchor looks reasonable. What remains uncertain is how much farther the market should go before it is paying for an IPO dream rather than for a proven industrial business. That evidence hurdle is the core reason conviction remains capped today.
