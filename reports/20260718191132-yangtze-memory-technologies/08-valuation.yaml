- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Sanctions escalation
    - More tool or customer restrictions
    - Cuts TAM and delays roadmap
    - Move to downside case and widen discount
  - - Cycle reversal
    - NAND pricing or margins cool sharply
    - Shrinks revenue and multiple support
    - Reset valuation framework lower
  - - IPO delay or weak pricing
    - Process slips or prices far below range
    - Signals capital-market skepticism
    - Reassess strategic-premium assumption
  - - Audit disappointment
    - Profit, cash, or subsidy data underwhelm
    - Damages quality-of-earnings case
    - Move from track toward avoid
  notes: Trigger thresholds are directional because public evidence remains incomplete on the internal plan.
