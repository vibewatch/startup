companyProfile:
  summary: YMTC is a Wuhan-headquartered private memory IDM founded in 2016 that has become China's only scaled NAND champion. The company sells 3D NAND wafers, enterprise and client SSDs, UFS, eMMC, and ZHITAI-branded retail storage, while public evidence supports more than 8,000 employees, low-teens global NAND share, and a 2025 private-market valuation anchor around US$22 billion. Strategic importance and state-backed capital have enabled continuing fab expansion despite Entity List restrictions, but audited profitability and governance transparency remain limited.
  foundingLocation: Wuhan, Hubei, China
  headquarters: Wuhan, Hubei, China
  productSummary: Integrated 3D NAND platform spanning wafers, enterprise SSDs, client SSDs, embedded UFS and eMMC, and ZHITAI consumer storage products built around the Xtacking architecture roadmap.
  customerFocus: Chinese smartphone OEMs, PC and storage channels, enterprise and server buyers, and domestic cloud or data-center operators seeking NAND and storage products.
  businessModel: 'IDM memory model: YMTC designs and manufactures NAND, then monetizes through wafer sales, embedded memory, enterprise and client SSDs, and branded retail storage.'
  stage: Late-stage private strategic semiconductor manufacturer
  fundingStatus: State-backed capital structure with cumulative public investment above RMB 160 billion, alongside active STAR Market IPO preparation as a potential future funding source.
