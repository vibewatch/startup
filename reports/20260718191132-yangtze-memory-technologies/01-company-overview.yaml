- id: ownership-governance-and-capital
  title: Ownership, governance, and capital structure visibility
  body: Ownership is state-backed and strategically important, but the governance picture is more transparent on shareholding than on executives. China Daily's report on YMTC's STAR Market filing says the company has no controlling shareholder and that Hubei Changsheng Development is the largest holder at 26.54%, with additional support from the national IC fund and local state-backed capital. Bamboo Works and the filing coverage both show that YMTC recently completed a shareholding reform that brought in 16 institutional investors and elected a first board ahead of IPO work. Parentage still matters. YMTC remains tied to the restructured Tsinghua Unigroup orbit, and the 2022 restructuring agreement plus related legal coverage show that the Wise Road/JAC-led consortium acquired 100% of the restructured Unigroup for RMB 54.9 billion. What is still thin is public disclosure on the live board map, committee structure, or clearly current executive bench. Independent reporting has named Chen Nanxiang
    as acting CEO or chairman in prior years, but the current official public surface is not executive-rich enough to treat leadership continuity as fully transparent.
