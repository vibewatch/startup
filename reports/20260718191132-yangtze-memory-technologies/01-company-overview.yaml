- id: sanctions-litigation-and-open-gaps
  title: Sanctions, litigation, and the main unresolved diligence gaps
  body: 'The public record is favorable on identity and product cadence, but it remains materially adverse on geopolitical and legal complexity. The Federal Register record confirms that Commerce added YMTC to the Entity List effective December 16, 2022, and Reuters says the company has since intensified collaboration with local suppliers such as AMEC because U.S. equipment access was curtailed. MemoryMarket reports that the Pentagon''s February 2026 1260H list removed YMTC, which modestly eases one reputational and procurement barrier, but the same report also states that broader restrictions remain in place. The Micron conflict is also real rather than hypothetical: district-court discovery orders and a January 2026 USPTO director-review order show active patent litigation and IPR fights in which YMTC''s Entity List status is itself part of the record. Finally, even with IPO momentum, core economics are still under-disclosed. Public sources support valuation, scale, and growth direction,
    but not a reliable current gross margin, recurring mix, or normalized free-cash-flow picture. That is why later chapters should treat valuation and profitability as live diligence questions, not as settled facts.'
