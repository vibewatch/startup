company:
  name: Yangtze Memory Technologies
chapter:
  number: 1
  title: Company Overview
  summary: YMTC is a Wuhan-based private memory IDM founded in 2016 that has grown from China's first 3D NAND program into a scaled NAND supplier with Xtacking-based products spanning wafers, embedded memory, and SSDs. Public evidence now supports a $22 billion Hurun unicorn valuation, active Shanghai STAR Market IPO preparation, and rapid capacity expansion under sanctions, but leadership visibility, precise board control, and durable profitability remain less transparent than the technology and market-share story.
sections:
- id: identity-stage-and-footprint
  title: Identity, footprint, stage, and business scope
  body: 'Yangtze Memory Technologies is best understood as China''s scaled NAND champion rather than as an early-stage startup. Official company materials place the founding in July 2016, headquarters in Wuhan, and the operating model in the integrated-device-manufacturer camp: YMTC says it designs chips, manufactures wafers, handles packaging and test, and sells system-level products as well as chips. The public website and product catalog show a much broader commercial surface than a single wafer program, covering 3D NAND wafers, embedded UFS and eMMC, enterprise SSDs, client SSDs, and the ZHITAI consumer-storage line. The footprint is also non-trivial. YMTC says it has R&D centers in Wuhan, Beijing, and other cities, plus more than 8,000 employees, including roughly 6,000 R&D engineers. That scale, together with the current Wuhan fab complex and active IPO process, makes the right stage label late-stage private strategic hardware company, not laboratory project.'
