    whyItMatters: >-
      The overview can verify scale direction, but durable profitability and cash burn still drive valuation and
      survivability judgments.
    diligencePath: Review IPO counseling filings, lender materials, or management accounts once accessible.
    relatedQuestionRefs:
      - QO014
      - QO025
