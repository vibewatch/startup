evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current official executive roster, board composition, and committee structure tied to the live pre-IPO
      governance setup.
    whyItMatters: >-
      Leadership continuity and governance quality are central to underwriting execution risk and public-market
      readiness.
    diligencePath: >-
      Obtain the latest corporate-registration extracts, IPO counseling documents, or investor materials that enumerate
      directors and senior management.
