- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Xtacking differentiation
    - Incumbents keep outspending YMTC on process and layers
    - High
    - Technical edge can compress if frontier gap widens
    - Track layer-count, performance, and yield evidence yearly
  - - Domestic OEM access
    - Chinese buyers re-open to incumbents in a price war
    - High
    - Policy tailwind may be cyclical when supply loosens
    - Ask for top-customer retention and win-loss data
  - - Entity-list insulation of domestic market
    - Secondary sanctions widen customer reluctance
    - Critical
    - Would further reduce reachable TAM and valuation support
    - Monitor BIS and customer-screening developments
  - - Retail / channel traction
    - Channel wins fail to translate into enterprise trust
    - Medium
    - Could cap upmarket margin expansion
    - Separate channel sell-through from enterprise adoption
  - - Capital scale
    - Down-cycle hurts margins faster than share helps
    - High
    - NAND remains a commodity-like cycle business
    - Stress-test cost curve against lower ASP scenarios
  notes: The register focuses on durability of YMTC’s current competitive position rather than on every company risk that appears later in the dedicated Risks chapter.
