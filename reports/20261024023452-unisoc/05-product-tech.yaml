company:
  name: Unisoc
chapter:
  number: 5
  title: Product & Technology
  summary: Unisoc presents a broad full-scenario communications portfolio spanning 4G/5G smartphone platforms, connectivity, wearables, automotive and IoT, with meaningful deployment signals but public evidence that remains weighted toward company claims and partner coverage. Independent security research shows that modem/application-processor isolation and patch distribution are material product risks.
sections:
  - id: product-scope
    title: Product scope and customer workflow
    body: >-
      Unisoc delivers semiconductor platforms rather than finished devices: its products sit inside
      smartphones, wearables, connected vehicles, televisions and IoT equipment, where the immediate
      buyer is typically an OEM or device integrator and the end user experiences the resulting
      connectivity, imaging, display and application performance. The official product surface lists
      Smart Phone, AIoT, Automotive Electronics, Smart Display and Smart Wear as main businesses,
      while its technology surface highlights 5G, 6G, multimedia, Wi-Fi 6 and gaming capabilities.
      The company describes a full range of 4G and 5G solutions from entry-level to high-end devices.
      This is a credible product-line map, but most breadth, reliability and customer-scale assertions
      are company-issued or company-distributed rather than independently audited. The clearest
      workflow evidence is the chipset-to-device path: a platform is selected by an OEM, integrated
      with modem and application software, certified with operators, and shipped in a branded device.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, deployment and maturity
    body: >-
      The public architecture is best understood as a layered communications platform: modem and
      radio capabilities provide 4G/5G and adjacent connectivity; application-processing and
      multimedia IP support displays, imaging and gaming; device software and OEM integration turn
      those blocks into phones, wearables, vehicles and industrial systems; and operator
      certifications and field testing enable deployment. Unisoc says its 5G portfolio includes the
      T9100, T8300, T8200 and T8100, and its T760 is described by ANI as a 6nm 5G SoC with 3.2 TOPS
      AI computing and FHD+ 120Hz display support. The company reports more than 100 5G-powered
      devices available across several regions as of March 2025, field tests in 116 countries,
      platforms shipped to 85 markets, and certifications from 56 operators. These are useful
      maturity indicators, but they do not disclose failure rates, silicon revision history, update
      SLAs, or component-level benchmark methodology. China's 2025 communications statistics show a
      large and growing 5G deployment environment, which supports addressable demand but does not
      prove Unisoc share or product performance.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, trust and technical risk
    body: >-
      Differentiation rests on breadth, regional price-performance positioning and integration across
      communication scenarios rather than on a publicly documented proprietary manufacturing process.
      Unisoc claims self-developed multimedia IP and Wi-Fi 6 IP, and presents a multi-mode,
      high-integration approach for balancing 5G performance and battery life. Deployment scale is
      also a switching asset because OEMs and operators must qualify a platform across markets.
      However, security is a direct counterweight to that scale. Kaspersky reported CVE-2024-39432
      and CVE-2024-39431 affecting Unisoc SoCs and described attack paths through modem
      communication with the application processor; it also said Unisoc developed and released
      patches after notification, while warning that software updates may not fully resolve complex
      hardware-architecture limitations. Cybernews separately reported a 2026 disclosure involving
      reused modem firmware in T612, T616, T606 and T7250, with testing limited to controlled
      infrastructure and no confirmed real-carrier exploit. The diligence implication is that
      security maturity must be assessed at the chip, firmware, OEM integration and patch-adoption
      layers, not inferred from product breadth or operator certifications.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
