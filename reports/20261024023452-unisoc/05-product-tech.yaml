    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Connectivity and modem, "4G/5G, Wi-Fi, Bluetooth, RedCap, satellite and related communications", "Standards, RF design, operator certification and modem firmware", "Firmware isolation and disclosure response must be tested across chip families"]
      - [Application processing and multimedia, "AI, imaging, display, audio-visual and gaming experiences", "OEM software stack, drivers and application workloads", "Public benchmark methodology and sustained performance data are limited"]
      - [Device integration, "Turns the platform into a phone, wearable, vehicle or IoT product", "OEM engineering, Android/RTOS integration, thermal and power design", "Customer-specific integration and patch adoption are not transparent"]
      - [Certification and field deployment, "Enables operator and market launch", "Operator labs, regional regulations and device qualification", "Certifications do not establish reliability, security or sell-through"]
      - [Security maintenance, "Patches modem and SoC vulnerabilities and supports downstream fixes", "Unisoc releases, OEM adoption and end-user update behavior", "Residual exposure may persist where hardware architecture limits software remediation"]
    notes: "This architecture is an analytical synthesis of disclosed capabilities and security reporting; it is not an official block diagram, and undocumented implementation details remain an evidence gap."
    claimRefs: [CE005, CE008, CE012, CE013, CE014]
