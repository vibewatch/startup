evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete current board, executive, committee, appointment, succession, and ultimate-beneficial-owner records.
    whyItMatters: >-
      Governance independence, key-person dependence, control rights, and related-party exposure cannot be assessed from
      a chairman-and-CEO snapshot.
    diligencePath: >-
      Obtain the IPO counseling materials, current articles, shareholder register, board roster, committee charters,
      executive biographies, and related-party schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited segment revenue, gross margin, operating margin, cash flow, cash, debt, current headcount, and a defined
      customer count.
    whyItMatters: >-
      Reported revenue, shipments, and market share do not establish earnings quality, liquidity, leverage, labor scale,
      or concentration.
    diligencePath: >-
      Obtain audited financial statements, debt and cash schedules, HR records, and a customer ledger with a stated
      active-customer definition.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Prospectus-grade segment revenue, geography mix, chipset ASP, design-win conversion, and total addressable chip
      spend.
    whyItMatters: >-
      Without denominators and product mix, ecosystem and shipment indicators cannot be translated into Unisoc SAM, SOM,
      margin, or valuation sensitivity.
    diligencePath: >-
      Obtain the IPO prospectus, audited segment notes, OEM design-win pipeline, and a bottom-up model by device
      category and geography.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: >-
      A current, independently defined smartphone application-processor share series with consistent quarter and
      geography.
    whyItMatters: >-
      The available company and secondary figures use different periods and definitions, so share momentum cannot be
      compared cleanly.
    diligencePath: Reconcile Counterpoint/CINNO/Omdia definitions and obtain the underlying quarterly shipment denominator.
    relatedQuestionRefs:
      - QM002
      - QM007
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: OEM-level design-win, pricing, retention, and segment-budget evidence.
    whyItMatters: Public product pages establish possible use cases but not paid adoption, budget ownership, or switching economics.
    diligencePath: Request anonymized OEM pipeline, contract terms, win/loss analysis, and customer concentration by segment.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: missing-source
    severity: minor
    topic: adoption-constraints
    missingEvidence: A public study of failed pilots, substitution losses, or qualification bottlenecks specific to Unisoc.
    whyItMatters: >-
      The assigned search pool returned no direct adverse-market result, leaving downside evidence thinner than the
      demand evidence.
    diligencePath: >-
      Review OEM teardown data, procurement losses, regulatory actions, and independent analyst downside cases in the
      next refresh.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Unisoc, MediaTek and Qualcomm realized ASPs, contract structures, discounts and gross margins by
      segment.
    whyItMatters: >-
      Without realized pricing and margin evidence, value-tier differentiation cannot be translated into a durable
      economic moat or comparable unit economics.
    diligencePath: >-
      Obtain prospectus-grade segment disclosures, OEM contract samples or channel checks covering price, rebates,
      silicon content and gross margin.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      A primary-source customer and supplier concentration schedule with revenue shares, second-source status and
      contract duration.
    whyItMatters: >-
      A single tracked customer and four tracked suppliers are not enough to assess concentration, switching cost or
      supply interruption exposure.
    diligencePath: >-
      Review IPO filing schedules, audited customer concentration notes, supplier agreements and OEM qualification
      records.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: A complete current roster of merchant SoC, connectivity, automotive and internal-build alternatives by end market.
    whyItMatters: >-
      The assigned public pool does not establish the full entrant and specialist set, so displacement analysis may omit
      narrow but credible substitutes.
    diligencePath: >-
      Commission a current channel and design-win map by device category, geography, node, modem capability and OEM
      account.
    relatedQuestionRefs:
      - QP001
      - QP002
  - type: stale
    severity: minor
    topic: competitive-scale
    missingEvidence: >-
      A current like-for-like smartphone AP share series with identical geography, quarter and methodology across
      Unisoc, MediaTek, Qualcomm, Apple and HiSilicon.
    whyItMatters: >-
      The available figures span a 2021 domestic snapshot and 2024–2025 global estimates, limiting direct trend
      interpretation.
    diligencePath: Reconcile the latest Counterpoint or equivalent dataset with a common quarter and market definition.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue-quality
    missingEvidence: Audited segment revenue, revenue-recognition policy, realized ASPs, rebates, returns, and customer concentration.
    whyItMatters: >-
      Without these inputs, reported scale cannot be translated into recurring quality, pricing power, or
      concentration-adjusted revenue.
    diligencePath: >-
      Obtain audited statements, segment schedules, the top-20 customer ledger, contract samples, and invoice-to-revenue
      reconciliations.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-and-cost-structure
    missingEvidence: >-
      Gross margin by product family, foundry and packaging costs, warranty provisions, inventory reserves, operating
      expenses, and capex.
    whyItMatters: >-
      Fabless scale does not reveal contribution margin, fixed-cost absorption, or sensitivity to foundry and support
      costs.
    diligencePath: >-
      Request the audited cost-of-goods bridge, supplier terms, inventory aging, warranty history, and product-level
      contribution margins.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
