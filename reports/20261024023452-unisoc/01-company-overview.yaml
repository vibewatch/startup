company:
  name: Unisoc
chapter:
  number: 1
  title: Company Overview
  summary: Unisoc is a Shanghai-based fabless semiconductor designer with a broad communications-chip portfolio, reported 2024 revenue above CNY 14.5 billion, and a reported 14% share of global smartphone AP/SoC shipments in Q4 2024. The company has entered STAR Market IPO counseling, but public evidence still does not provide a prospectus-grade board roster, cap table, audited profitability, debt, headcount, or customer count.
sections:
  - id: identity-and-operating-scope
    title: Identity and operating scope
    body: >-
      Unisoc traces its operating history to Spreadtrum, founded in 2001, and is
      headquartered in Shanghai. Its business is fabless semiconductor design:
      the official product surfaces span smartphone, AIoT, automotive
      electronics, smart-display, wearable, tablet, and communications
      technologies rather than chip fabrication. That breadth makes the company
      more than a single smartphone-processor vendor, but the assigned public
      corpus is strongest on mobile SoCs and connectivity. Company-authored
      material describes both 4G and 5G platforms and global device deployments;
      these statements establish product scope, not independently verified
      revenue mix or profitability by product line.
    claimRefs: [CO001, CO002]
    tableRefs: [TO001]
  - id: capital-and-ipo-trajectory
    title: Capital and IPO trajectory
    body: >-
      Public capital records show a long private-market history rather than a
      clean current financing ledger. Tracxn reports $1.45 billion raised across
      four rounds, including a $635 million Series D in March 2020 at a
      $7.95 billion post-money valuation and an $815 million Series E in April
      2021. C114 separately reports two 2024 financings totaling CNY 6 billion
      and a CNY 70 billion valuation. Those figures use different currencies,
      dates, and transaction bases and should not be collapsed into one current
      valuation. The latest assigned evidence says Unisoc began STAR Market IPO
      counseling, making audited filing disclosure the principal route to
      reconcile capital, debt, and ownership.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO014]
    figureRefs: [FO001]
  - id: leadership-control-and-governance
    title: Leadership, control, and governance
    body: >-
      The accessible leadership evidence identifies Ma Daojie as chairman and
      Ren Qiwei as chief executive, but it does not provide biographies,
      appointment dates, committee membership, or a complete board roster.
      Unisoc is described as part of Tsinghua Unigroup, while C114 reports
      Beijing Unisoc Investment Management as the controlling shareholder with
      a 32.22% stake. That control structure and the legacy of the parent group
      deserve focused diligence: Xinhua reported that former Tsinghua Unigroup
      chairman Zhao Weiguo was convicted of multiple crimes in 2025. The record
      concerns a former parent-group executive, not a finding against current
      Unisoc management, but it raises the bar for related-party, internal-control,
      and board-independence review.
    claimRefs: [CO003, CO004, CO015, CO016]
    tableRefs: [TO002, TO003]
  - id: scale-signals-and-disclosure-limits
    title: Scale signals and disclosure limits
    body: >-
      The strongest public scale signals concern 2024 activity. C114 reports
      revenue above CNY 14.5 billion and 1.6 billion chips shipped, while C114
      and a syndicated Unisoc release both cite Counterpoint for a 14% global
      smartphone AP/SoC shipment share in Q4 2024. This corroborates meaningful
      shipment scale but does not establish margin quality, cash generation, or
      concentration risk. The assigned evidence does not support a current
      employee count or a distinct customer count, and the company release's
      references to brands and devices should not be converted into customers.
      Audited revenue recognition, segment mix, gross margin, cash, debt, and
      related-party balances remain material IPO diligence items.
    claimRefs: [CO010, CO011, CO012, CO013]
