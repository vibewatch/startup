callouts:
  - calloutType: risk
    title: Principal thesis-break trigger
    body: "A sustained export-control or supplier-access restriction that prevents compliant shipment to material customers would break the operating thesis; current public evidence does not quantify this scenario."
    claimRefs: [CR001, CR002, CR013]
  - calloutType: assumption
