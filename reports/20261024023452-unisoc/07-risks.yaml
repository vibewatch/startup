      - [Entity List and foreign-direct-product rules, United States, medium, critical, "BIS framework and compliance dates are described; company status is unconfirmed", "High: an identified designation or supplier restriction could impair access", "Run current Entity List, ownership, supplier and customer screening with counsel."]
      - [SMIC-specific export-license review policy, United States / China supply chain, medium, critical, "External rule is documented; actual Unisoc wafer sourcing is not verified", "High if Unisoc production materially depends on controlled SMIC capacity", "Verify foundry allocation by node and site, applicable classifications, licenses, and qualified alternatives."]
      - [STAR Market IPO counseling and disclosure execution, China, medium, high, "Counseling and advisors are reported; current filing status is not confirmed", "Medium-high: delays or disclosure deficiencies could constrain capital access", "Obtain the current CSRC counseling record, filing timetable, legal opinions, and disclosure exceptions."]
    notes: "Likelihood and residual exposure are analytical risk ratings based on the cited regulatory posture and explicit evidence gaps; they are not company-reported probabilities."
    enumerationScope:
      coverage: partial
      basis: "Publicly described U.S. export-control and cross-border enforcement exposures reviewed through 2026-10-24"
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR015]
  - id: TR002
    title: Partner / ownership / financing dependency risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Ownership and related-party opacity after former-parent restructuring, medium, high, "IPO counseling and shareholder disclosures are partially reported", "High", "Current board, beneficial owners, related parties, and control rights."]
      - [Financing or valuation expectations not converting into durable liquidity, medium, high, "Reported funding and IPO process provide a possible capital path", "Medium-high", "Audited cash, debt, burn, working capital, round close and use of proceeds."]
      - [Governance contagion from former parent distress and corruption history, low-to-medium, high, "Restructuring and new ownership are reported", "Medium-high", "Independently verify current controls, executive accountability and related-party transactions."]
      - [Disclosure quality insufficient for public-market underwriting, high, high, "IPO advisors and counseling are reported", "High", "Obtain prospectus-grade financials, customer concentration, cap table and litigation certificates."]
    notes: "Rows distinguish reported historical events and financing plans from unresolved current-state diligence; no row asserts a current Unisoc violation or cash shortfall."
    enumerationScope:
      coverage: partial
      basis: "Public reporting on Unisoc financing, IPO counseling, ownership history and former-parent distress"
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Operational / quality / security and partner risk register
    columns: [Dependency or failure mode, Counterparty / role, Likelihood, Severity, Mitigation maturity, Residual exposure, Monitoring or kill criterion]
    rows:
      - ["Foundry, packaging, or component interruption", "SMIC is Wafergraph's largest tracked supplier by market cap; Hua Hong, JCET and Ceva are also listed", medium, critical, "Relationship provenance and production shares are not verified", "High", "Kill if a license denial or sole-source interruption prevents material production; verify node/site allocation and qualified alternatives."]
      - [Product security or payment-security failure, "Chip hardware and software ecosystem", low-to-medium, high, "Company describes an integrated security solution; independent assurance is absent", "Medium-high", "Require certifications, vulnerability history, incident response tests and material security notices."]
      - ["Customer concentration or design-win loss", "Wafergraph tracks Nokia as one customer but does not establish the full customer population", medium, high, "Company reports broad shipments; independent concentration evidence is absent", "Medium-high", "Kill if a material customer loss is not replaced within two design cycles; obtain revenue and shipment concentration."]
      - [Channel and export-screening failure across global business, "Distributors, customers and regulators in 133 countries", medium, high, "Company footprint is reported; control effectiveness is not public", "High", "Audit distributor controls and stop criteria for denied-party, end-use or license exceptions."]
    notes: "The corpus confirms product breadth and geographic claims but does not disclose supplier concentration, incidents, or quality rates; these rows are monitoring hypotheses and diligence asks."
    claimRefs: [CR003, CR010, CR011, CR012, CR013, CR014, CR015, CR016]
