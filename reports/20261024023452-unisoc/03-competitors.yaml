    claimRefs: [CP002, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Supplier or route, Price or contract model, Included capabilities, Discount or realization evidence, Buyer implication]
    rows:
      - [Unisoc, "Not publicly disclosed in assigned pool", "Mobile, IoT, automotive, display and wearable platforms are described", "No realized ASP, discount, or contract evidence", "Value-tier economics are plausible but not underwritten"]
      - [Qualcomm, "Not publicly disclosed in assigned pool", "Broad merchant mobile and connectivity scope not documented here", "No peer pricing evidence", "Scale cannot be translated into a price premium from this pool"]
      - [MediaTek, "Not publicly disclosed in assigned pool", "Direct smartphone SoC peer; detailed package not documented here", "No peer pricing evidence", "Historical shipment scale is not a realized price comparison"]
      - [Rockchip, "Not publicly disclosed in assigned pool", "Adjacent listed semiconductor alternative", "No contract or discount evidence", "May matter in adjacent workloads, but substitution is unquantified"]
      - ["Infinix Smart 10 retail proxy", "About EUR60 for the complete handset", "Unisoc T7250 (12 nm) inside the cited device", "Retail device price only; chip price and discount are unknown", "Shows value-tier placement without establishing Unisoc ASP or margin"]
      - [Internal build, "Engineering and supply-chain cost rather than list price", "Custom roadmap and integration control", "No Unisoc customer build-versus-buy study", "Requires diligence on NRE, validation, software and opportunity cost"]
    notes: "No source in the assigned pool provides comparable list pricing, realized ASP, contract terms, discounts, or gross margin; all such cells remain unknown."
    claimRefs: [CP010, CP013, CP014, CP016]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Unisoc is positioned as a broad-scope challenger with meaningful regional reach, while incumbent scale and independent proof remain stronger for listed peers.
    data:
      xAxis: "Evidence of merchant scale and distribution"
      yAxis: "Breadth of documented product scope"
      points:
        - {label: "Unisoc", x: 3, y: 5, note: "Broad official scope and reported operator/device reach; independent financial disclosure is limited"}
        - {label: "Qualcomm", x: 5, y: 4, note: "Large public market-cap signal; assigned pool lacks comparable product detail"}
        - {label: "MediaTek", x: 4, y: 4, note: "Historical China shipment scale; assigned pool lacks current comparable product detail"}
        - {label: "Apple", x: 4, y: 3, note: "Vertical device ecosystem; not a general merchant supplier"}
        - {label: "HiSilicon", x: 2, y: 3, note: "Domestic ecosystem peer; historical shipment snapshot is adverse"}
        - {label: "Internal build", x: 1, y: 4, note: "Potential scope control, but no public evidence of Unisoc customer build economics"}
    approximationNotes: "Ordinal 1-5 analyst scores summarize only the assigned evidence; they are not performance benchmarks, market-share estimates, or value-proportional measures."
    claimRefs: [CP001, CP002, CP003, CP011, CP012]
callouts:
  - calloutType: strength
    title: Regional distribution is the clearest differentiator
    body: Unisoc's reported operator certifications, broad handset-brand footprint and 4G/5G deployment across emerging markets provide a credible distribution advantage, although the evidence is partly company-supplied and does not disclose realized economics.
    claimRefs: [CP006, CP007, CP008]
  - calloutType: risk
    title: Competitive durability is not yet priced from public evidence
    body: The assigned evidence does not establish Unisoc's pricing, gross margin, customer concentration, switching cost, or independent performance lead; incumbent scale and OEM multi-homing therefore remain material displacement risks.
    claimRefs: [CP010, CP013, CP014]
  - calloutType: recommendation
    title: Underwrite as a challenger, not an incumbent substitute
    body: Treat Unisoc as a credible value-tier and emerging-market challenger, but require prospectus-grade customer concentration, realized pricing, margin, roadmap and supply-chain evidence before assigning an enduring moat.
    claimRefs: [CP010, CP013, CP014]
