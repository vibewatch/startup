  topStrengths:
    - Broad communications-chip portfolio with smartphone, IoT, automotive, display, and wearable coverage.
    - >-
      Reported Q4 2024 smartphone AP/SoC share and large 2024 shipment and financing aggregates indicate meaningful
      operating scale.
    - Global product deployment claims span more than 140 countries and 270 operators.
  topRisks:
    - Audited margins, cash, debt, liquidity, revenue mix, and customer concentration remain unavailable.
    - Export-control and foundry-access exposure could constrain product execution and supply continuity.
    - Governance and parent-group history raises underwriting and IPO-execution risk.
  unresolvedGaps:
    - Prospectus-grade board, leadership, cap-table, and financing-term disclosure remains incomplete.
    - Audited gross margin, operating margin, cash balance, debt, burn, and runway remain unavailable.
    - Revenue mix and customer concentration across smartphones, IoT, automotive, and other segments remain unclear.
