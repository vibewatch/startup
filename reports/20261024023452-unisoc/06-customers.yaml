chapter:
  number: 6
  title: Customers
  summary: Unisoc shows broad device reach and named OEM relationships, but the public record is materially stronger on shipments, brands, and market access than on recurring revenue, retention, or customer concentration. The most decision-relevant gap is the absence of customer-level production, renewal, and revenue-denominator evidence.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Unisoc sells semiconductor platforms into device makers and connectivity
      ecosystems rather than directly to end consumers. Its own product surface
      spans smartphones, AIoT, automotive electronics, smart displays, wearables,
      tablets, and related connectivity solutions, indicating a multi-segment
      OEM and platform strategy. The smartphone page describes 4G and 5G
      solutions from entry-level to high-end devices and says products have been
      shipped in more than 140 countries and regions and through 270 operators.
      That supports geographic and channel breadth, but it does not identify
      account-level revenue, contract duration, or payer concentration. The
      customer model therefore appears strategically diversified by use case,
      while its financial durability remains unverified.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and evidence of scale
    body: >-
      Public adoption evidence is strongest where an external source reports
      shipment volumes or where a named device can be checked independently.
      China Daily reported 800,000 Unisoc SoCs shipped in May 2021, up 63 times
      year over year, while attributing the broader domestic ranking to CINNO
      and National Business Daily. A 2025 BusinessWire India release, carried
      by ANI, reported 14% global smartphone AP/SoC share in Q4 2024, more than
      100 5G-powered devices available across several regions, 116 countries
      with 5G field tests, 85 markets shipped, and 56 operator certifications.
      These are useful scale indicators but are partly company-provided and do
      not establish active use, renewal, gross margin, or customer-level
      economics. A C114 filing report further states 1.6 billion chips shipped
      globally in 2024, but that figure needs prospectus-grade verification.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, expansion, and durability
    body: >-
      Named OEM evidence provides a credible route from chipset design to
      production devices, but the public corpus does not consistently distinguish
      pilot, reference design, and mass production. Unisoc lists vivo, Transsion,
      realme, Motorola, Nokia, Samsung, Honor, and ZTE as brands whose devices
      use its chipsets; the 2025 India release additionally names moto, nubia,
      HMD, Xiaomi, OPPO, Lava, Reliance Jio, and Realme. GSM Arena independently
      lists the Unisoc T7250 in the Xiaomi Redmi A5, which is direct product
      evidence rather than a logo. Wafergraph records only one tracked customer,
      Nokia, while warning that relationship provenance must be checked, so its
      graph is a concentration signal rather than a complete customer census.
      No retained source supplies NRR, GRR, churn, renewal, contract length, or
      revenue by account. Independent market evidence also shows both an
      expansion surface and a constraint: CNBC Africa reported rapid growth in
      sub-$100 smartphones, while GSMA identifies device affordability as a
      major reason almost one billion Africans remained offline in 2025. The
      central diligence ask is customer-level shipment and renewal data tied to
      audited revenue.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
