    notes: "Issuer relationship differs by row: official/company-distributed claims are not independent benchmarks, and the IPO/debt account is secondary reporting."
    claimRefs: [CV002, CV003, CV004, CV005, CV006]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Prospectus confirms durable growth, improving margins, diversified customers, and clean preferences", "Reported CNY70bn becomes a defensible entry reference; upside depends on earnings and IPO conversion", "Low-to-medium until primary disclosure", "IPO filing contradicts reported growth or terms"]
      - [Base, "Commercial scale persists but audited economics and segment mix remain incomplete", "Track at an unverified / provisional fair stance; wait for price and terms", "Highest on current evidence", "No timely financial or cap-table disclosure"]
      - [Bear, "Export restrictions, competition, customer concentration, or parent liquidity pressure compress access and multiples", "Down round, delayed liquidity, and preference overhang can impair common-equity returns", "Material and not fully quantified", "Failed listing, major customer loss, or financing stress"]
      - [Research-more gate, "Obtain audited statements, cap table, debt, preference, revenue mix, and customer concentration", "No target return or exit price until these are verified", "Mandatory before an investment decision", "Management cannot provide primary evidence"]
    notes: "Scenarios are qualitative because public sources do not support a reliable DCF, comparable-company multiple, or probability-weighted target price."
    claimRefs: [CV004, CV005, CV009]
