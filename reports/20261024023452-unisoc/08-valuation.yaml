company:
  name: Unisoc
chapter:
  number: 8
  title: Valuation
  summary: Unisoc has credible scale in value-tier smartphone and connectivity silicon, but public evidence does not yet support underwriting the reported 2024 private valuation as an investable price. A track/research-more stance is warranted until audited financials, cap-table terms, and IPO disclosures establish earnings quality, dilution, and downside protection.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Public evidence supports a scaled semiconductor platform, not a fully underwritten equity value. The company describes broad communications capability, 19 R&D centers, eight sales and support centers, and coverage across mobile, AIoT, automotive electronics, and other segments (CV002). Independent reporting places Unisoc behind MediaTek and Qualcomm in a 2021 smartphone-processor snapshot despite rapid shipment growth (CV001), while a 2025 company-distributed release claims 14% global smartphone AP/SoC share in Q4 2024 (CV006). Those metrics are not equivalent in period, methodology, or issuer, so they support commercial relevance rather than a precise multiple. C114 reports two 2024 financing rounds totaling CNY6 billion at a CNY70 billion valuation and revenue above CNY14.5 billion (CV004), but the fetched report is a secondary account of a filing and does not provide audited margins, cash, debt, preference terms, or a full capitalization table. The appropriate decision is track/research more, with no buy call at an unverified price.
    claimRefs: [CV001, CV002, CV004, CV006]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Unisoc has moved from a niche domestic challenger toward a globally distributed supplier: its own site says its platforms have shipped in more than 140 countries and regions, through 270 operators, with more than 400 million units shipped since 2018 (CV003); the 2025 release names more than 100 5G-powered devices, 85 markets, 56 operator certifications, and brands including Motorola, nubia, ZTE, and HMD (CV006). Market infrastructure also remains supportive: China recorded 1.204 billion 5G mobile users at the end of 2025 and 2.888 billion mobile-IoT terminal users (CV007), while GSMA forecasts African mobile-industry economic contribution to rise from $240 billion in 2025 to $290 billion by 2030 (CV008). The anti-thesis is that scale may be concentrated in lower-priced devices, exposed to export controls and platform competition, and not yet convertible into durable margin or cash flow. SCMP's cited 2021 data show only 4.1 million quarterly smartphone processors for Unisoc versus 28.8 million each for MediaTek and Qualcomm (CV001). Wafergraph labels the company private and says its relationship map is based on Wikipedia and a secondary source, explicitly leaving supplier/customer edges for diligence rather than treating them as verified financial evidence (CV010).
    claimRefs: [CV001, CV003, CV006, CV007, CV008, CV010]
    tableRefs: [TV002]
  - id: scenario-valuation
    title: Scenario valuation and return logic
    body: >-
      A conventional revenue-multiple framework is only a screening tool here because the public corpus does not disclose audited revenue quality, gross margin, operating margin, cash conversion, debt, or share terms. The reported CNY70 billion 2024 valuation and CNY14.5 billion-plus revenue imply roughly 4.8x reported revenue, but that calculation is an analyst-derived ratio, not a verified enterprise-value or equity-value multiple; it also ignores the distinction between financing valuation, preference rights, and net debt (CV004). The scenario table therefore uses probability signals and explicit evidence gaps rather than false precision. Bull requires prospectus-grade confirmation of revenue, margin, growth, customer concentration, and clean preference terms; base assumes commercial scale but incomplete disclosure and geopolitical risk; bear assumes multiple compression, down-round or liquidity pressure, and slower commercialization. Samsung's public market capitalization illustrates the enormous scale gap between a listed diversified semiconductor/electronics incumbent and an unlisted fabless challenger, so it is contextual rather than a directly comparable multiple (CV009). No target return or exit price is supportable until the missing inputs are obtained.
    claimRefs: [CV004, CV009]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breaks
    title: Exit readiness and thesis-break triggers
    body: >-
      C114 reports that Unisoc began IPO counseling for a STAR Market listing and identifies Guotai Haitong Securities and China Securities as advisers (CV004), which is a potentially useful liquidity path but not evidence that listing, timing, pricing, or approval is assured. A separate Straits Times report describes early-stage discussions about IPOs for Unisoc within Tsinghua Unigroup while noting there was no guarantee of a float and that the parent needed to reduce its debt-to-equity ratio below 50% within two years (CV005). The valuation decision should therefore be revisited on defined triggers: a filed prospectus with audited statements and cap table; verified gross-margin and cash-flow progression; disclosed customer and segment concentration; evidence that export-control exposure is manageable; and financing terms that clarify liquidation preference, conversion, and dilution. A thesis break is any failed or delayed IPO process combined with a down round, material customer loss, adverse regulatory restriction, or evidence that reported growth does not translate into cash generation.
    claimRefs: [CV004, CV005, CV010]
    figureRefs: [FV001]
