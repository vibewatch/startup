callouts:
  - calloutType: recommendation
    title: Track, do not underwrite yet
    body: >-
      The reported financing valuation is a useful diligence anchor, not a validated entry price. Require audited financials, capitalization and preference terms, segment mix, and a credible liquidity path before upgrading.
    claimRefs: [CV004, CV005]
  - calloutType: risk
    title: Missing economics are decision-critical
    body: >-
      Revenue and shipment scale do not establish ARR, margin, cash available, or common-equity value; the current public evidence leaves those distinctions unresolved.
    claimRefs: [CV004, CV005, CV010]
