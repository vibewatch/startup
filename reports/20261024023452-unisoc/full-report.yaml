  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand shape
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the design and sale of communication and application chips to handset and
              connected-device manufacturers, not the retail value of finished phones. Unisoc's own product surface
              spans smartphones, AIoT, automotive electronics, smart displays, wearables, tablets, and 5G technologies;
              its application pages also describe 5G IoT and industrial-IoT solutions. That boundary includes silicon,
              platform software, and design wins sold into device OEM workflows. It excludes carrier service revenue,
              device retail margin, and downstream digital-economy output. This distinction matters because a large
              mobile-services economy is an adoption context rather than Unisoc's addressable chip revenue. The company
              page reports 4G platforms shipped in more than 140 countries and regions and across 270 operators, while a
              separate company page claims more than 400 million units shipped since 2018. Those are distribution
              indicators, not a current market-share denominator.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM016
      - number: '2.2'
        title: Multiple sizing lenses, not one headline TAM
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing evidence is a set of non-equivalent lenses. GSMA reports that mobile
              technologies and services contributed $240 billion to Africa's economy in 2025 and forecasts $290 billion
              by 2030; that is an ecosystem-output lens, not chip spend. Canalys reporting cited by CNBC Africa records
              19.2 million smartphone shipments in Africa in Q2 2025, up 7% year over year, with sub-$100 models up 38%.
              The company-oriented Accio page describes a 2026 focus on entry-level 4G/5G smartphones, rugged devices,
              and senior phones, but its listed marketplace observations are not a verified industry market-size
              series.       Multiples and C114 both report 2024 Unisoc revenue of CNY14.5 billion and more than 1.6
              billion chips shipped; these are company scale indicators, not TAM. The evidence therefore supports a
              bottom-up diligence path using device shipments, attainable OEM design wins, chipset ASPs, and Unisoc's
              product mix rather than an invented SOM percentage.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Unisoc sells to OEMs and device makers; the end user is usually a consumer, enterprise worker, or
              connected-device operator, while the budget owner is the OEM product and procurement organization. The
              adoption path begins with a platform qualification and design win, proceeds through modem, RF,
              operating-system, camera, multimedia, and power validation, and ends in volume production. In
              price-sensitive markets, the trigger is a credible performance-per-dollar proposition and 4G/5G
              availability. GSMA identifies device affordability, limited digital skills, and lack of relevant content
              as barriers to mobile-internet use in Africa; handset financing is one response. This favors low-cost chip
              platforms but also creates ASP and margin pressure. Unisoc's official material identifies industrial IoT,
              financial payment, smart-display, smart-cockpit, and wearable use cases, broadening the buyer map beyond
              smartphones without proving revenue contribution for any segment.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include the migration from 2G/3G to 4G/5G, affordable 5G devices, AI-enabled edge and
              connectivity workloads, and expansion of mobile internet in under-connected regions. The official site
              says its 5G portfolio serves consumer and IoT applications, and GSMA expects African mobile-economy
              contribution to rise through 2030. Constraints are equally material: affordability and financing can keep
              unit growth from translating into chipset pricing power; OEM qualification and software integration create
              switching friction but lengthen sales cycles; and supply-chain exposure, export-control policy, and
              incomplete public financial disclosure limit underwriting confidence. Reported 2024 scale of CNY14.5
              billion in revenue and more than 1.6 billion chips demonstrates volume, but it does not disclose ASP,
              gross margin, or segment mix. The practical valuation implication is that volume, geography, and ecosystem
              breadth are more observable than recurring revenue, gross margin, or segment profitability. Any valuation
              case should stress ASP, mix, design-win conversion, and policy scenarios separately.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable question is mix, not market size alone
            body: >-
              Unisoc has credible exposure to volume smartphone and connectivity demand, but the public corpus cannot
              convert ecosystem growth into Unisoc chip revenue, margin, or attainable share. Underwriting should
              require product-mix, ASP, design-win, and geography disclosure before treating the market as a valuation
              multiple expansion driver.
            calloutType: insight
            claimRefs:
              - CM009
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is wider than smartphone chip vendors. Unisoc competes directly with
              MediaTek, Qualcomm, Apple and, in China, HiSilicon for application processors and modem integration; it
              also faces Rockchip and other specialist designers in adjacent embedded, display, connectivity and
              automotive workloads. The company’s own site positions it across smartphones, AIoT, automotive
              electronics, smart display and wearables, while third-party material describes a fabless model spanning
              consumer and industrial electronics. Public evidence places Unisoc fourth in global smartphone application
              processors in 2024–2025, but the periods and methodologies differ across sources, so the ranking is
              directional rather than a single clean time series.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP012
      - number: '3.2'
        title: Buyer trade-offs, distribution and capability
        blocks:
          - type: paragraph
            body: >-
              Buyers choose among these suppliers on more than peak benchmark performance. OEMs weigh modem and
              connectivity coverage, power/performance balance, software and reference-design maturity, roadmap
              credibility, operator certification, geographic support, and per-device economics. Unisoc reports
              shipments through 270 operators and devices from brands including vivo, Transsion, realme, Motorola,
              Nokia, Samsung, Honor and ZTE; a supply-chain dataset separately records four tracked suppliers and one
              tracked customer, but that bounded count is not a concentration schedule. In India, a company-issued
              release describes more than 100 5G-powered devices, but the syndicated release is not independent proof of
              realized share or pricing. GSMArena lists one approximately EUR60 handset using a Unisoc T7250, which
              demonstrates a value-tier device placement but not the chip price or economics.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP013
              - CP014
              - CP016
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              Unisoc’s moat is best described as ecosystem and execution-based rather than patent- or price-proven. Its
              accumulated 4G footprint, operator certifications, regional handset relationships and portfolio breadth
              can lower adoption friction, while the company’s stated Wi-Fi and multimedia capabilities broaden the
              platform sale. However, public evidence does not establish realized gross margins, contractual lock-in,
              switching costs, customer concentration, or an enduring performance lead. China Daily reporting shows
              MediaTek and Qualcomm ahead of Unisoc in a 2021 domestic shipment snapshot, while Qualcomm’s much larger
              public market capitalization is a scale signal rather than a measure of product superiority. GSMA
              identifies device affordability as a barrier within Africa’s large mobile-internet usage gap, supporting
              value-tier demand but also sustained price pressure. The principal displacement risks are incumbent
              roadmap execution, OEM multi-homing, and commoditization in price-sensitive tiers.
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional distribution is the clearest differentiator
            body: >-
              Unisoc's reported operator certifications, broad handset-brand footprint and 4G/5G deployment across
              emerging markets provide a credible distribution advantage, although the evidence is partly
              company-supplied and does not disclose realized economics.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: callout
            title: Competitive durability is not yet priced from public evidence
            body: >-
              The assigned evidence does not establish Unisoc's pricing, gross margin, customer concentration, switching
              cost, or independent performance lead; incumbent scale and OEM multi-homing therefore remain material
              displacement risks.
            calloutType: risk
            claimRefs:
              - CP010
              - CP013
              - CP014
          - type: callout
            title: Underwrite as a challenger, not an incumbent substitute
            body: >-
              Treat Unisoc as a credible value-tier and emerging-market challenger, but require prospectus-grade
              customer concentration, realized pricing, margin, roadmap and supply-chain evidence before assigning an
              enduring moat.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue scale is visible, but revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              C114 reported that UNISOC generated more than RMB14.5 billion of revenue and shipped 1.6 billion chips in
              2024. Those figures establish operating scale, but they do not reveal revenue recognition, segment mix,
              customer concentration, realized pricing, rebates, warranty provisions, or the share of sales attributable
              to smartphone SoCs versus AIoT, automotive, display, and wearable products. Dividing the two reported
              figures produces a quotient below RMB9.1 of revenue per shipped chip; this is not an average selling price
              because the revenue perimeter and shipment denominator may differ. Official product breadth and syndicated
              traction claims support multiple commercial streams, but neither source discloses contracts or audited
              mix.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
