  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Commercial scale and market access support tracking, while disclosure and downside gaps prevent a buy
      recommendation.
    data:
      nodes:
        - id: scale
          label: Scale signals
          detail: Global footprint, 400m-plus units since 2018, and reported Q4 2024 share
        - id: market
          label: Market access
          detail: 5G, IoT, smartphone and operator reach across multiple regions
        - id: economics
          label: Unverified economics
          detail: Audited margins, cash conversion, debt and segment mix unavailable
        - id: liquidity
          label: Liquidity uncertainty
          detail: IPO counseling and early-stage float discussions are not assured
        - id: downside
          label: Downside exposure
          detail: Export controls, competition, concentration and parent financing pressure
        - id: decision
          label: Decision
          detail: Track / research more; no buy at an unverified price
