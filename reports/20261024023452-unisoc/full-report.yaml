  - id: FU001
    title: Customer adoption journey
    summary: >-
      Unisoc's public customer evidence progresses from platform qualification and field tests to device availability
      and geographic shipment, while retention and expansion remain unobserved.
    type: journey-map
    data:
      items:
        - label: Platform qualification
          detail: 5G field tests in 116 countries are reported for March 2025.
          touchpoints:
            - Operator tests
            - Regional certification
        - label: Market access
          detail: 5G platforms are reported shipped to 85 markets and certified by 56 operators.
          touchpoints:
            - Operator certification
            - Market launch
        - label: Device production
          detail: >-
            More than 100 5G-powered devices are reported available across Europe, Latin America, Southeast Asia, and
            South Asia.
          touchpoints:
            - OEM integration
            - Device availability
        - label: Consumer device proof
          detail: GSM Arena lists the Unisoc T7250 in the Xiaomi Redmi A5, released March 21, 2025.
          touchpoints:
            - Named model
            - Independent specification
        - label: Geographic scale
          detail: Unisoc reports 4G platforms conducted in more than 140 countries and regions through 270 operators.
          touchpoints:
            - Global distribution
            - Operator channel
        - label: Durability check
          detail: No retained source discloses NRR, GRR, churn, renewal, or account-level revenue.
          touchpoints:
            - Renewal data missing
            - Concentration unverified
    approximationNotes: The ordered stages synthesize distinct public indicators and do not imply conversion rates or a common cohort.
    claimRefs:
      - CU007
      - CU008
      - CU011
      - CU013
      - CU015
      - CU016
