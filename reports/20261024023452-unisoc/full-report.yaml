              - CI006
              - CI008
              - CI012
      - number: '4.2'
        title: Distribution breadth is a sales proxy, not a unit-economics answer
        blocks:
          - type: paragraph
            body: >-
              UNISOC says its 4G platforms have shipped through 270 operators in more than 140 countries and exceeded
              400 million units since 2018. A syndicated company release separately claimed more than 100 5G-powered
              devices by March 2025, shipments to 85 markets, and certifications from 56 operators. These figures
              indicate qualification and distribution reach, but they do not disclose sales cycles, channel discounts,
              customer acquisition cost, design-win conversion, attach rates, or contribution margin. Public data for
              Rockchip show what a listed peer can disclose—trailing revenue, profit margin, cash, leverage, and free
              cash flow—but that peer snapshot is a diligence benchmark, not a direct estimate of UNISOC economics.
            claimRefs:
              - CI006
              - CI008
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI012
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI008
              - CI012
      - number: '4.3'
        title: Financing and an IPO process do not establish runway
        blocks:
          - type: paragraph
            body: >-
              C114 reported two 2024 financing rounds totaling RMB6 billion at a RMB70 billion valuation and later
              reported that UNISOC entered STAR Market IPO counseling. The financing amount is historical capital
              raised, not current cash available, and the assigned evidence contains no cash balance, debt schedule,
              operating cash flow, capital expenditure, burn, or runway. Capital intensity therefore remains
              unquantified. The downside case also includes product-support exposure: two 2026 security reports
              described remote-code-execution paths affecting UNISOC modem implementations, while one reported no vendor
              response or identified firmware update at publication. No assigned source quantifies remediation,
              warranty, recall, or customer-support cost.
            claimRefs:
              - CI003
              - CI004
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public case is strongest on scale and weakest on quality of earnings. Reported revenue, shipment
              volume, broad product coverage, and operator reach are consistent with a substantial fabless semiconductor
              business. External demand indicators are mixed: China’s 2025 mobile-data-service revenue declined 3.1%,
              while mobile-IoT revenue grew 4.9%, suggesting that UNISOC’s portfolio diversification may matter as
              smartphone and connectivity economics evolve. Nevertheless, no defensible judgment can yet be made on
              gross margin, working capital, cash conversion, leverage, or runway. The investment stance should remain
              diligence-gated until audited financials, segment economics, customer concentration, and a current
              liquidity bridge are available.
            claimRefs:
              - CI009
              - CI011
              - CI012
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not the same as earnings quality
            body: >-
              Reported revenue and shipment volume support commercial relevance, but the absent mix, pricing, margin,
              and cash-flow bridge prevents an earnings-quality judgment.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: callout
            title: Security exposure has no public cost envelope
            body: >-
              Reported modem vulnerabilities may require engineering and OEM support, but the affected population, patch
              status, cost sharing, and provisions are unavailable.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Unisoc delivers semiconductor platforms rather than finished devices: its products sit inside smartphones,
              wearables, connected vehicles, televisions and IoT equipment, where the immediate buyer is typically an
              OEM or device integrator and the end user experiences the resulting connectivity, imaging, display and
              application performance. The official product surface lists Smart Phone, AIoT, Automotive Electronics,
              Smart Display and Smart Wear as main businesses, while its technology surface highlights 5G, 6G,
              multimedia, Wi-Fi 6 and gaming capabilities. The company describes a full range of 4G and 5G solutions
              from entry-level to high-end devices. This is a credible product-line map, but most breadth, reliability
              and customer-scale assertions are company-issued or company-distributed rather than independently audited.
              The clearest workflow evidence is the chipset-to-device path: a platform is selected by an OEM, integrated
              with modem and application software, certified with operators, and shipped in a branded device.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE012
              - CE015
      - number: '5.2'
        title: Architecture, deployment and maturity
        blocks:
          - type: paragraph
            body: >-
              The public architecture is best understood as a layered communications platform: modem and radio
              capabilities provide 4G/5G and adjacent connectivity; application-processing and multimedia IP support
              displays, imaging and gaming; device software and OEM integration turn those blocks into phones,
              wearables, vehicles and industrial systems; and operator certifications and field testing enable
              deployment. Unisoc says its 5G portfolio includes the T9100, T8300, T8200 and T8100, and its T760 is
              described by ANI as a 6nm 5G SoC with 3.2 TOPS AI computing and FHD+ 120Hz display support. The company
              reports more than 100 5G-powered devices available across several regions as of March 2025, field tests in
              116 countries, platforms shipped to 85 markets, and certifications from 56 operators. These are useful
              maturity indicators, but they do not disclose failure rates, silicon revision history, update SLAs, or
              component-level benchmark methodology. China's 2025 communications statistics show a large and growing 5G
              deployment environment, which supports addressable demand but does not prove Unisoc share or product
              performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE008
              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE010
              - CE012
      - number: '5.3'
        title: Differentiation, trust and technical risk
        blocks:
          - type: paragraph
            body: >-
              Differentiation rests on breadth, regional price-performance positioning and integration across
              communication scenarios rather than on a publicly documented proprietary manufacturing process. Unisoc
              claims self-developed multimedia IP and Wi-Fi 6 IP, and presents a multi-mode, high-integration approach
              for balancing 5G performance and battery life. Deployment scale is also a switching asset because OEMs and
              operators must qualify a platform across markets. However, security is a direct counterweight to that
              scale. Kaspersky reported CVE-2024-39432 and CVE-2024-39431 affecting Unisoc SoCs and described attack
              paths through modem communication with the application processor; it also said Unisoc developed and
              released patches after notification, while warning that software updates may not fully resolve complex
              hardware-architecture limitations. Cybernews separately reported a 2026 disclosure involving reused modem
              firmware in T612, T616, T606 and T7250, with testing limited to controlled infrastructure and no confirmed
              real-carrier exploit. The diligence implication is that security maturity must be assessed at the chip,
              firmware, OEM integration and patch-adoption layers, not inferred from product breadth or operator
              certifications.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad platform coverage
            body: >-
              Unisoc combines 4G/5G mobile platforms with adjacent connectivity, multimedia, wearable, automotive and
              IoT categories, creating multiple integration surfaces for OEMs.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: callout
            title: Security is a product-level diligence gate
            body: >-
              Independent disclosures identify modem/application-processor attack paths and a later modem-firmware
              exploit report; patch release is positive, but downstream adoption and residual hardware exposure remain
              unverified.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Unisoc sells semiconductor platforms into device makers and connectivity ecosystems rather than directly
              to end consumers. Its own product surface spans smartphones, AIoT, automotive electronics, smart displays,
              wearables, tablets, and related connectivity solutions, indicating a multi-segment OEM and platform
              strategy. The smartphone page describes 4G and 5G solutions from entry-level to high-end devices and says
              products have been shipped in more than 140 countries and regions and through 270 operators. That supports
              geographic and channel breadth, but it does not identify account-level revenue, contract duration, or
              payer concentration. The customer model therefore appears strategically diversified by use case, while its
              financial durability remains unverified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
      - number: '6.2'
        title: Adoption and evidence of scale
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest where an external source reports shipment volumes or where a named
              device can be checked independently. China Daily reported 800,000 Unisoc SoCs shipped in May 2021, up 63
              times year over year, while attributing the broader domestic ranking to CINNO and National Business Daily.
              A 2025 BusinessWire India release, carried by ANI, reported 14% global smartphone AP/SoC share in Q4 2024,
              more than 100 5G-powered devices available across several regions, 116 countries with 5G field tests, 85
              markets shipped, and 56 operator certifications. These are useful scale indicators but are partly
              company-provided and do not establish active use, renewal, gross margin, or customer-level economics. A
              C114 filing report further states 1.6 billion chips shipped globally in 2024, but that figure needs
              prospectus-grade verification.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, expansion, and durability
        blocks:
          - type: paragraph
            body: >-
              Named OEM evidence provides a credible route from chipset design to production devices, but the public
              corpus does not consistently distinguish pilot, reference design, and mass production. Unisoc lists vivo,
              Transsion, realme, Motorola, Nokia, Samsung, Honor, and ZTE as brands whose devices use its chipsets; the
              2025 India release additionally names moto, nubia, HMD, Xiaomi, OPPO, Lava, Reliance Jio, and Realme. GSM
              Arena independently lists the Unisoc T7250 in the Xiaomi Redmi A5, which is direct product evidence rather
              than a logo. Wafergraph records only one tracked customer, Nokia, while warning that relationship
              provenance must be checked, so its graph is a concentration signal rather than a complete customer census.
              No retained source supplies NRR, GRR, churn, renewal, contract length, or revenue by account. Independent
              market evidence also shows both an expansion surface and a constraint: CNBC Africa reported rapid growth
              in sub-$100 smartphones, while GSMA identifies device affordability as a major reason almost one billion
              Africans remained offline in 2025. The central diligence ask is customer-level shipment and renewal data
              tied to audited revenue.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
