      - number: '1.4'
        title: Scale signals and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale signals concern 2024 activity. C114 reports revenue above CNY 14.5 billion and
              1.6 billion chips shipped, while C114 and a syndicated Unisoc release both cite Counterpoint for a 14%
              global smartphone AP/SoC shipment share in Q4 2024. This corroborates meaningful shipment scale but does
              not establish margin quality, cash generation, or concentration risk. The assigned evidence does not
              support a current employee count or a distinct customer count, and the company release's references to
              brands and devices should not be converted into customers. Audited revenue recognition, segment mix, gross
              margin, cash, debt, and related-party balances remain material IPO diligence items.
