chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Unisoc traces its operating history to Spreadtrum, founded in 2001, and is headquartered in Shanghai. Its
              business is fabless semiconductor design: the official product surfaces span smartphone, AIoT, automotive
              electronics, smart-display, wearable, tablet, and communications technologies rather than chip
              fabrication. That breadth makes the company more than a single smartphone-processor vendor, but the
              assigned public corpus is strongest on mobile SoCs and connectivity. Company-authored material describes
              both 4G and 5G platforms and global device deployments; these statements establish product scope, not
              independently verified revenue mix or profitability by product line.
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO001
            claimRefs:
