      - number: '1.3'
        title: Leadership, control, and governance
        blocks:
          - type: paragraph
            body: >-
              The accessible leadership evidence identifies Ma Daojie as chairman and Ren Qiwei as chief executive, but
              it does not provide biographies, appointment dates, committee membership, or a complete board roster.
              Unisoc is described as part of Tsinghua Unigroup, while C114 reports Beijing Unisoc Investment Management
              as the controlling shareholder with a 32.22% stake. That control structure and the legacy of the parent
              group deserve focused diligence: Xinhua reported that former Tsinghua Unigroup chairman Zhao Weiguo was
              convicted of multiple crimes in 2025. The record concerns a former parent-group executive, not a finding
              against current Unisoc management, but it raises the bar for related-party, internal-control, and
              board-independence review.
