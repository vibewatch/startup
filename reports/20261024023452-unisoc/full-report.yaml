      - number: '1.2'
        title: Capital and IPO trajectory
        blocks:
          - type: paragraph
            body: >-
              Public capital records show a long private-market history rather than a clean current financing ledger.
              Tracxn reports $1.45 billion raised across four rounds, including a $635 million Series D in March 2020 at
              a $7.95 billion post-money valuation and an $815 million Series E in April 2021. C114 separately reports
              two 2024 financings totaling CNY 6 billion and a CNY 70 billion valuation. Those figures use different
              currencies, dates, and transaction bases and should not be collapsed into one current valuation. The
              latest assigned evidence says Unisoc began STAR Market IPO counseling, making audited filing disclosure
              the principal route to reconcile capital, debt, and ownership.
