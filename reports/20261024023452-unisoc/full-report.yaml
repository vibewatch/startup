  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitical and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Export-control exposure is the most directly evidenced risk. Holland & Knight describes December 2024 BIS
              rules that added entities to the Entity List and introduced controls on advanced-computing and
              semiconductor-manufacturing items, including foreign-direct- product rules. The same source says
              U.S.-origin items, software, and technology cannot be exported to prohibited end users or for prohibited
              end uses, while foreign-made items can fall under the rules through U.S.-origin components, software, or
              technology. Unisoc is not identified in the reviewed text as an Entity List target, so the appropriate
              conclusion is exposure to changing licensing, component, and customer-screening requirements rather than a
              confirmed designation. Holland & Knight also reports that SMIC's license-review policy was changed to a
              presumption of denial for items subject to the EAR, except for case-by-case review of items used in 200 mm
              wafer production. Wafergraph identifies SMIC as the largest supplier by market capitalization among four
              suppliers it tracks for Unisoc, but its page relies on only two secondary references and explicitly warns
              that relationship provenance requires checking. This combination raises a potentially material
              foundry-access and compliance risk without proving that Unisoc's actual production is concentrated at SMIC
              or that any current shipment is restricted.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Governance, ownership, and financial resilience
        blocks:
          - type: paragraph
            body: >-
              The reviewed evidence links Unisoc to a financially and governance-sensitive ownership history. Reuters
              reports that Wise Road Capital took control in 2022 after former parent Tsinghua Unigroup faced
              bankruptcy, while AsiaOne reports that former Tsinghua Unigroup chairman Zhao Weiguo received a suspended
              death sentence for corruption and embezzlement. These facts concern the former parent and its chairman,
              not a proven Unisoc offense, but they increase the need for beneficial-ownership, related-party, board,
              and capital- allocation diligence. Reuters also reported a proposed 10 billion yuan funding round and an
              approximately 70 billion yuan valuation based on confidential sources in 2023; the report does not
              establish that the round closed. C114 later describes IPO counseling, 2024 financing totaling 6 billion
              yuan, and 2024 revenue exceeding 14.5 billion yuan, but its text is a secondary report of a filing and
              does not provide audited statements. The principal residual risk is therefore disclosure quality and
              financing dependence, not a verified liquidity shortfall.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, technology, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Unisoc's operating model spans mobile, IoT, automotive, display, wearables, and connectivity products. Its
              official site describes self-developed 5G, multimedia, Wi-Fi 6, and gaming capabilities, as well as
              financial-payment security solutions that integrate chip hardware and software. These are company
              statements and establish product scope, not independently verified reliability or security outcomes.
              Reuters reports, citing Unisoc's website, that the company did business in 133 countries. The company's
              smartphone page claims more than 400 million platform shipments since 2018 across more than 140 countries
              and regions and 270 operators, while a 2021 China Daily report showed Unisoc's monthly domestic
              smartphone-SoC shipments remained far below MediaTek and Qualcomm at that point. These figures establish
              breadth and historical execution pressure, not current customer concentration or reliability. Wafergraph's
              supplier and customer map is explicitly limited, so manufacturing concentration, yield, recalls, outages,
              breaches, and warranty performance remain unresolved. Monitoring should focus on license denials,
              qualified-foundry continuity, production design wins, security advisories, recalls, and material quality
              claims; sustained inability to ship compliant products or a material design-win loss would break the
              operating thesis.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Principal thesis-break trigger
            body: >-
              A sustained export-control or supplier-access restriction that prevents compliant shipment to material
              customers would break the operating thesis; current public evidence does not quantify this scenario.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              No assigned source confirms a current Unisoc enforcement action, outage, breach, recall, supplier
              concentration, or liquidity shortfall; those items remain diligence paths rather than negative findings.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR009
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a scaled semiconductor platform, not a fully underwritten equity value. The
              company describes broad communications capability, 19 R&D centers, eight sales and support centers, and
              coverage across mobile, AIoT, automotive electronics, and other segments (CV002). Independent reporting
              places Unisoc behind MediaTek and Qualcomm in a 2021 smartphone-processor snapshot despite rapid shipment
              growth (CV001), while a 2025 company-distributed release claims 14% global smartphone AP/SoC share in Q4
              2024 (CV006). Those metrics are not equivalent in period, methodology, or issuer, so they support
              commercial relevance rather than a precise multiple. C114 reports two 2024 financing rounds totaling CNY6
              billion at a CNY70 billion valuation and revenue above CNY14.5 billion (CV004), but the fetched report is
              a secondary account of a filing and does not provide audited margins, cash, debt, preference terms, or a
              full capitalization table. The appropriate decision is track/research more, with no buy call at an
              unverified price.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Unisoc has moved from a niche domestic challenger toward a globally
              distributed supplier: its own site says its platforms have shipped in more than 140 countries and regions,
              through 270 operators, with more than 400 million units shipped since 2018 (CV003); the 2025 release names
              more than 100 5G-powered devices, 85 markets, 56 operator certifications, and brands including Motorola,
              nubia, ZTE, and HMD (CV006). Market infrastructure also remains supportive: China recorded 1.204 billion
              5G mobile users at the end of 2025 and 2.888 billion mobile-IoT terminal users (CV007), while GSMA
              forecasts African mobile-industry economic contribution to rise from $240 billion in 2025 to $290 billion
              by 2030 (CV008). The anti-thesis is that scale may be concentrated in lower-priced devices, exposed to
              export controls and platform competition, and not yet convertible into durable margin or cash flow. SCMP's
              cited 2021 data show only 4.1 million quarterly smartphone processors for Unisoc versus 28.8 million each
              for MediaTek and Qualcomm (CV001). Wafergraph labels the company private and says its relationship map is
              based on Wikipedia and a secondary source, explicitly leaving supplier/customer edges for diligence rather
              than treating them as verified financial evidence (CV010).
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Scenario valuation and return logic
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple framework is only a screening tool here because the public corpus does not
              disclose audited revenue quality, gross margin, operating margin, cash conversion, debt, or share terms.
              The reported CNY70 billion 2024 valuation and CNY14.5 billion-plus revenue imply roughly 4.8x reported
              revenue, but that calculation is an analyst-derived ratio, not a verified enterprise-value or equity-value
              multiple; it also ignores the distinction between financing valuation, preference rights, and net debt
              (CV004). The scenario table therefore uses probability signals and explicit evidence gaps rather than
              false precision. Bull requires prospectus-grade confirmation of revenue, margin, growth, customer
              concentration, and clean preference terms; base assumes commercial scale but incomplete disclosure and
              geopolitical risk; bear assumes multiple compression, down-round or liquidity pressure, and slower
              commercialization. Samsung's public market capitalization illustrates the enormous scale gap between a
              listed diversified semiconductor/electronics incumbent and an unlisted fabless challenger, so it is
              contextual rather than a directly comparable multiple (CV009). No target return or exit price is
              supportable until the missing inputs are obtained.
            claimRefs:
              - CV004
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV009
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              C114 reports that Unisoc began IPO counseling for a STAR Market listing and identifies Guotai Haitong
              Securities and China Securities as advisers (CV004), which is a potentially useful liquidity path but not
              evidence that listing, timing, pricing, or approval is assured. A separate Straits Times report describes
              early-stage discussions about IPOs for Unisoc within Tsinghua Unigroup while noting there was no guarantee
              of a float and that the parent needed to reduce its debt-to-equity ratio below 50% within two years
              (CV005). The valuation decision should therefore be revisited on defined triggers: a filed prospectus with
              audited statements and cap table; verified gross-margin and cash-flow progression; disclosed customer and
              segment concentration; evidence that export-control exposure is manageable; and financing terms that
              clarify liquidation preference, conversion, and dilution. A thesis break is any failed or delayed IPO
              process combined with a down round, material customer loss, adverse regulatory restriction, or evidence
              that reported growth does not translate into cash generation.
            claimRefs:
              - CV004
              - CV005
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not underwrite yet
            body: >-
              The reported financing valuation is a useful diligence anchor, not a validated entry price. Require
              audited financials, capitalization and preference terms, segment mix, and a credible liquidity path before
              upgrading.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: Missing economics are decision-critical
            body: >-
              Revenue and shipment scale do not establish ARR, margin, cash available, or common-equity value; the
              current public evidence leaves those distinctions unresolved.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV010
