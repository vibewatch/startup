company:
  name: Unisoc
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence indicates meaningful scale—more than RMB14.5 billion of 2024
    revenue and 1.6 billion chips shipped—but does not disclose audited segment
    mix, gross margin, cash, debt, burn, or runway. The result is a commercially
    credible but not yet underwritable financial profile whose IPO process should
    be treated as a potential disclosure catalyst rather than proof of capital adequacy.
sections:
  - id: revenue-evidence
    title: Revenue scale is visible, but revenue quality is not
    body: >-
      C114 reported that UNISOC generated more than RMB14.5 billion of revenue
      and shipped 1.6 billion chips in 2024. Those figures establish operating
      scale, but they do not reveal revenue recognition, segment mix, customer
      concentration, realized pricing, rebates, warranty provisions, or the share
      of sales attributable to smartphone SoCs versus AIoT, automotive, display,
      and wearable products. Dividing the two reported figures produces a quotient
      below RMB9.1 of revenue per shipped chip; this is not an average selling
      price because the revenue perimeter and shipment denominator may differ.
      Official product breadth and syndicated traction claims support multiple
      commercial streams, but neither source discloses contracts or audited mix.
    claimRefs: [CI001, CI002, CI005, CI007]
    tableRefs: [TI001, TI002]
  - id: conversion-and-economics
    title: Distribution breadth is a sales proxy, not a unit-economics answer
    body: >-
      UNISOC says its 4G platforms have shipped through 270 operators in more
      than 140 countries and exceeded 400 million units since 2018. A syndicated
      company release separately claimed more than 100 5G-powered devices by
      March 2025, shipments to 85 markets, and certifications from 56 operators.
      These figures indicate qualification and distribution reach, but they do
      not disclose sales cycles, channel discounts, customer acquisition cost,
      design-win conversion, attach rates, or contribution margin. Public data
      for Rockchip show what a listed peer can disclose—trailing revenue, profit
      margin, cash, leverage, and free cash flow—but that peer snapshot is a
      diligence benchmark, not a direct estimate of UNISOC economics.
    claimRefs: [CI006, CI008, CI010, CI012]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-and-downside
    title: Financing and an IPO process do not establish runway
    body: >-
      C114 reported two 2024 financing rounds totaling RMB6 billion at a
      RMB70 billion valuation and later reported that UNISOC entered STAR Market
      IPO counseling. The financing amount is historical capital raised, not
      current cash available, and the assigned evidence contains no cash balance,
      debt schedule, operating cash flow, capital expenditure, burn, or runway.
      Capital intensity therefore remains unquantified. The downside case also
      includes product-support exposure: two 2026 security reports described
      remote-code-execution paths affecting UNISOC modem implementations, while
      one reported no vendor response or identified firmware update at publication.
      No assigned source quantifies remediation, warranty, recall, or customer-support cost.
    claimRefs: [CI003, CI004, CI013, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The public case is strongest on scale and weakest on quality of earnings.
      Reported revenue, shipment volume, broad product coverage, and operator
      reach are consistent with a substantial fabless semiconductor business.
      External demand indicators are mixed: China’s 2025 mobile-data-service
      revenue declined 3.1%, while mobile-IoT revenue grew 4.9%, suggesting that
      UNISOC’s portfolio diversification may matter as smartphone and connectivity
      economics evolve. Nevertheless, no defensible judgment can yet be made on
      gross margin, working capital, cash conversion, leverage, or runway. The
      investment stance should remain diligence-gated until audited financials,
      segment economics, customer concentration, and a current liquidity bridge
      are available.
    claimRefs: [CI009, CI011, CI012, CI016]
