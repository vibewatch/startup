      - [5G platforms, "Chip/platform basis; licensing split unknown", "Not disclosed", "Not disclosed", "Operator certification cost and OEM terms unavailable", "Qualification breadth is not evidence of margin"]
      - [AIoT connectivity, "Chip, module, or platform mix not disclosed", "Not disclosed", "Not disclosed", "Channel and support obligations unavailable", "Recurring versus transactional revenue cannot be separated"]
      - [Automotive electronics, "Program and lifecycle pricing not disclosed", "Not disclosed", "Not disclosed", "No tooling, warranty, or price-down schedule", "Backlog quality and lifetime program margin are unknown"]
    notes: "The assigned evidence contains product and reach claims but no public price list, customer contract, realized-price schedule, or revenue-recognition policy."
    claimRefs: [CI005, CI006, CI008, CI012]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - UNISOC value or status
      - Confidence
      - Interpretation
      - Diligence ask
    rows:
      - ["2024 revenue", ">RMB14.5B", "Medium; reported by C114", "Establishes scale, not revenue quality", "Audited revenue and recognition policy"]
      - ["2024 chip shipments", "1.6B chips", "Medium; reported by C114", "Volume denominator lacks product mix", "Units by family, customer, and geography"]
      - ["Revenue / reported chips quotient", "<RMB9.1 per chip", "Low; derived from two aggregate figures", "Not ASP because numerator and denominator perimeters may differ", "Reconciled revenue and unit perimeter"]
      - ["Gross margin", null, "Unavailable", "Fabless economics cannot be underwritten", "Audited gross margin and bridge by segment"]
      - ["Cash, debt, burn, and runway", null, "Unavailable", "Historical funding does not establish current liquidity", "Latest balance sheet, cash flow, debt schedule, and monthly liquidity plan"]
      - ["Security remediation cost", null, "Unavailable", "Reported modem flaws create unquantified support and warranty exposure", "Affected-unit scope, patch plan, OEM cost sharing, and provisions"]
      - ["Rockchip public-peer profit margin", "26.14% trailing", "Medium; Yahoo Finance snapshot", "Disclosure benchmark only; not a UNISOC estimate", "Select comparable set and normalize product mix and accounting"]
    notes: "Null means the assigned public evidence does not disclose the metric; the Rockchip row is a public-disclosure comparator and not a proxy applied to UNISOC."
    claimRefs: [CI001, CI002, CI010, CI012, CI015]
