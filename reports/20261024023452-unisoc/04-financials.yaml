callouts:
  - calloutType: insight
    title: Scale is not the same as earnings quality
    body: >-
      Reported revenue and shipment volume support commercial relevance, but the
      absent mix, pricing, margin, and cash-flow bridge prevents an earnings-quality judgment.
    claimRefs: [CI001, CI002, CI012]
  - calloutType: risk
    title: Security exposure has no public cost envelope
    body: >-
      Reported modem vulnerabilities may require engineering and OEM support,
      but the affected population, patch status, cost sharing, and provisions are unavailable.
    claimRefs: [CI013, CI014, CI015]
