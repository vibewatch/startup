callouts:
  - calloutType: insight
    title: The investable question is mix, not market size alone
    body: Unisoc has credible exposure to volume smartphone and connectivity demand, but the public corpus cannot convert ecosystem growth into Unisoc chip revenue, margin, or attainable share. Underwriting should require product-mix, ASP, design-win, and geography disclosure before treating the market as a valuation multiple expansion driver.
    claimRefs: [CM009, CM014, CM016]
