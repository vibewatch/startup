tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Original Medicare reimbursement
    - Clinician-led advocacy billed into Medicare-aligned navigation or care-management pathways
    - Covered service / reimbursable encounter
    - Publicly presented as a primary current channel
    - Medium-high quality once reimbursable, but rules and collections are undisclosed
    - Request average reimbursement per patient month, denial rates, and collection lag
  - - Medicare Advantage reimbursement
    - Plan-paid advocacy or supplemental coverage layered on MA benefits
    - Covered member / reimbursed service
    - Many plans publicly said to cover Solace nationwide
    - Medium-high quality, but plan variation and prior authorization matter
    - Request MA plan mix, reimbursement rates, and utilization by carrier
  - - Commercial insurance reimbursement
    - Coverage expansion into employer-sponsored and other commercial plans
    - Covered member / contracted reimbursement
    - Publicly disclosed as expanding, but not sized
    - Medium quality because channel existence is public but economics are opaque
    - Request launch dates, payer list, realized rates, and patient copay exposure
  - - Non-Medicare self-pay
    - Hourly advocacy with free intro calls
    - Hourly engagement
    - Available, but no public rate card
    - Low visibility because prices and volume are undisclosed
    - Request self-pay rate card, conversion, and share of total revenue
  - - Platform take-rate
    - Solace retains a variable share of reimbursements paid to advocates
    - Percent of reimbursement
    - Mechanism disclosed; exact percentage not public
    - Medium-quality mechanism with low pricing transparency
    - Request gross-to-net waterfall from payer reimbursement to Solace revenue
  - - Provider or payer embedded referrals
    - Referrals and earlier-in-journey embedding with providers and payers
    - Referred patient volume
    - Publicly discussed, but monetization structure is not separated
    - Unknown
    - Request whether any enterprise, referral, or implementation fees exist beyond reimbursement
  notes: Rows distinguish publicly visible channels from the still-undisclosed realized reimbursement rates and revenue mix across those channels.
