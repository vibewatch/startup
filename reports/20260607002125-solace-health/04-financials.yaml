  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: A gross-to-net waterfall showing payer reimbursement, advocate payout, and Solace’s retained platform share.
    whyItMatters: Without the retained share, patient and advocate scale cannot be translated into company revenue or margin.
    diligencePath: Request payer-by-payer reimbursement waterfalls, advocate payout schedules, and gross-to-net revenue recognition policy.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: payer-mix
    missingEvidence: Revenue and patient mix split across Original Medicare, Medicare Advantage, commercial plans, and self-pay.
    whyItMatters: Payer mix determines reimbursement durability, concentration risk, and how transferable the model is beyond Medicare-led coverage.
    diligencePath: Request a trailing-12-month payer-mix table by patients, reimbursement volume, and recognized revenue.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-arr
    missingEvidence: Current revenue, ARR, realized reimbursement per patient month, and any seasonality or concentration disclosures.
    whyItMatters: Top-line scale is essential for sizing valuation, growth quality, and enterprise value per revenue style benchmarks.
    diligencePath: Request a monthly revenue bridge for the last 24 months with revenue by payer and recognized versus billed amounts.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, runway scenarios, and any debt, factoring, or other financing obligations.
    whyItMatters: Capital adequacy cannot be underwritten without knowing how quickly Series C cash is consumed and whether leverage exists.
    diligencePath: Request current balance sheet, trailing burn, 24-month budget, and debt or covenant schedule.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: Representative commercial payer contracts, patient cost-share terms, and realized reimbursement rates outside Medicare.
    whyItMatters: Commercial expansion is strategically important, but public evidence does not show whether it is economically superior or merely experimental.
    diligencePath: Request sample commercial payer agreements, launch cohorts, and realized net revenue per covered commercial patient.
    relatedQuestionRefs:
    - QI006
    - QI023
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: plan-level-coverage-proof
    missingEvidence: Representative plan documents or billing examples proving Solace reimbursement at the plan and patient level.
    whyItMatters: Public coverage claims are directionally credible but still rely heavily on company-originated language rather than plan-level proof.
    diligencePath: Collect Medicare Advantage Evidence of Coverage excerpts, Explanation of Benefits samples, and de-identified claim examples.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI001
