- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Current public state
  - Impact
  - Exact diligence path
  rows:
  - - Current revenue or ARR
    - Not publicly disclosed
    - Cannot size the business or benchmark valuation quality
    - Request monthly revenue, ARR, and trailing twelve month reimbursement revenue
  - - Take rate on reimbursements
    - Variable share disclosed but exact percentage absent
    - Cannot translate patient volume into Solace revenue
    - Request gross-to-net reimbursement waterfall by payer type
  - - Payer mix
    - Not publicly disclosed
    - Cannot judge concentration across Original Medicare, Medicare Advantage, commercial, and self-pay
    - Request payer mix by revenue and by patients served
  - - Gross margin stack
    - Not publicly disclosed
    - Cannot assess scalability of a labor-backed advocacy model
    - Request advocate compensation, clinician oversight cost, and claims admin cost
  - - Claims denials, DSO, and write-offs
    - Not publicly disclosed
    - Working-capital and reimbursement risk remain unknown
    - Request denial rate, days sales outstanding, collections, and bad debt
  - - Cash, burn, and runway
    - Not publicly disclosed
    - Capital adequacy cannot be underwritten from public evidence alone
    - Request current cash, monthly burn, runway, and downside plan
  - - Commercial contract terms
    - Coverage expansion disclosed, but rates and copays are not
    - Cannot judge upside beyond Medicare-led reimbursement
    - Request representative commercial payer agreements and realized patient responsibility
  - - Cohort retention or repeat utilization
    - Not publicly disclosed
    - Revenue quality and durability remain uncertain
    - Request repeat-case rate, retention cohorts, and revenue concentration by diagnosis or payer
  notes: These are not cosmetic omissions; each gap blocks a specific underwriting question that public sources cannot close.
