- id: TI002
  title: Pricing / monetization table
  columns:
  - Channel or benchmark
  - Public price or economic term
  - List vs. realized pricing
  - Included capabilities
  - Discounts or unknowns
  - Implication
  rows:
  - - Covered Medicare or Medicare Advantage patient
    - Usually $0 to patient after standard deductible or coinsurance
    - Realized patient out-of-pocket, not list reimbursement
    - Dedicated advocate plus clinician-led intake and ongoing coordination
    - Payer reimbursement rate is undisclosed
    - Strong access signal, weak ASP transparency
  - - Commercial insured patient
    - Coverage check required; public price not posted
    - Potentially realized through insurer reimbursement
    - Advocacy, coordination, and navigation support
    - Contracted rate, copay, and payer list are not fully public
    - Commercial upside exists but cannot be modeled from public pricing
  - - Non-Medicare self-pay patient
    - Hourly rates plus free intro calls
    - Fallback list-style path exists but rates are hidden
    - Intro call and hourly advocacy support
    - Exact hourly price and discounts are undisclosed
    - Confirms a fallback monetization path without underwriting clarity
  - - Traditional private advocate benchmark
    - $100-$500 per hour; $225-$650 consult; $5,000-$15,000 complex cancer coordination
    - External market benchmark, not Solace realized pricing
    - Comparable advocacy and care-coordination tasks
    - Benchmark only; not evidence of Solace ASP
    - Shows why payer reimbursement could be demand-enabling
  - - Reimbursement split
    - Variable share of Medicare reimbursement retained by Solace
    - Realized platform economics, not public list pricing
    - Billing infrastructure, matching, records, and advocate support tooling
    - Exact take rate and advocate payout split are undisclosed
    - Unit economics hinge on an unpublished gross-to-net share
  notes: Public evidence mostly describes patient cost share and reimbursement mechanics rather than a published Solace rate card.
