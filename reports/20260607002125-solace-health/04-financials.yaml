  - - Series B deployment
    - Patient and advocate product development plus national network scale
    - Medium
    - Indicates capital was spent on operating infrastructure, not just brand
    - Request milestone attainment and resulting unit improvements
  - - Series C deployment
    - Advocate-network expansion, platform investment, clinical research, payer/provider partnerships, and hiring or marketing
    - High
    - Current burn and growth assumptions flow from these uses
    - Request 24-month operating plan and planned hiring cadence
  - - Cash on hand
    - null
    - Low
    - Most direct adequacy indicator
    - Request unrestricted cash, restricted cash, and cash covenant detail
  - - Monthly burn
    - null
    - Low
    - Needed for runway math and burn multiple
    - Request monthly net burn and trailing-12-month burn multiple
  - - Runway months
    - null
    - Low
    - Defines next financing urgency
    - Request base, upside, and downside runway scenarios
  - - Debt or project-finance obligations
    - No public disclosure found
    - Medium
    - Hidden leverage could change risk materially
    - Request debt schedule, warehouse lines, and any recourse obligations
  - - Next round or liquidity trigger
    - No public trigger disclosed; CEO mentioned a 2028 IPO goal
    - Medium
    - Clarifies whether capital need is strategic or existential
    - Request explicit financing trigger metrics and board plan
  notes: Public funding history is clear, but cash, burn, runway, and leverage remain private and therefore block a full adequacy judgment.
