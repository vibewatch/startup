  columns:
  - Item
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Total capital raised
    - $211M
    - High
    - Headline capital buffer entering the next phase
    - Request post-close cash balance and cap-table detail
  - - Latest financing
    - $130M Series C at >$1B valuation
    - High
    - Reduces near-term financing pressure and resets external signaling
