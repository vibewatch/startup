- id: named-proof
  title: Named Patient and Provider Proof
  tableRefs:
  - TU003
  figureRefs:
  - FU003
  body: >-
    Named proof exists, but it is overwhelmingly testimonial and referral-oriented rather than enterprise-logo oriented. On the provider side, Dr. Luke Nelligan of Marian University and Dr. Daniel Anzaldua of St. Vincents Hospital both publicly endorse Solace, with Nelligan specifically saying he has seen better results for older patients referred to the service. On the patient and caregiver side, Diane J. describes using Solace after losing access to her cardiologist because of insurance-network changes, while Alexa and Hilary describe advocate support during their father’s cancer journey. Fresh fetched story pages add more concrete named examples: Julia’s heart-disease case includes telehealth coordination and a successful insurance appeal, Robert’s Alzheimer’s caregiving case includes weekly check-ins and a caregiver support group, Liz’s father got specialist access accelerated from months to weeks, Pearl’s memory-workup case included neurologist access plus family meetings, and Esther’s multi-condition case was organized across several specialists within 48 hours. Additional named stories also cover Parkinson’s-related emergency escalation, prior-authorization reversal before surgery, dialysis logistics, kidney care, hospice coordination, and even a transplant-list reinstatement case reported by MedCity. These examples show that Solace can point to real-world usage across both patient self-start and clinician referral pathways, but most public proof is still company-curated and qualitative, not independently measured production ROI from a disclosed payer, provider system, or employer sponsor.
