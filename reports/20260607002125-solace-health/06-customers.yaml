  description: Customer segments, activation surfaces, and repeat-support loops across Solace’s patient-centric model.
  layout: wide
  summary: Solace’s journey starts with a patient or referring clinician and expands through ongoing advocacy, family inclusion, and payer/provider reinforcement.
