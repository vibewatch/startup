  evidenceGaps:
  - type: missing-source
    severity: material
    topic: employer-and-sponsor-logos
    missingEvidence: Named employer, payer, or provider-system customer list with contract scope, launch dates, and current status.
    whyItMatters: Without sponsor logos and contract scope, it is difficult to separate commercial expansion from marketing intent.
    diligencePath: Request top 10 commercial / sponsor accounts, current live status, and any public-reference permissions.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and average contract length by payer cohort.
    whyItMatters: Satisfaction proxies are positive, but true durability and expansion economics cannot be underwritten without retention data.
    diligencePath: Request payer-cohort retention tables, renewal calendar, and historical churn causes.
    relatedQuestionRefs:
    - QU019
    - QU021
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: payer-mix
    missingEvidence: Revenue and patient volume split across Original Medicare, Medicare Advantage, commercial coverage, and self-pay.
    whyItMatters: Solace’s concentration and reimbursement risk cannot be judged from public materials without knowing which payer channels dominate volume and revenue.
    diligencePath: Request payer-mix bridge, top-payer concentration, and reimbursement-code dependence analysis.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU001
    - TU005
  - type: conflicting-data
    severity: minor
    topic: customer-scale-consistency
    missingEvidence: A single canonical public definition for lifetime helped, current monthly patients, and review counts.
    whyItMatters: Metric inconsistency does not erase adoption proof, but it reduces precision when underwriting growth and conversion quality.
    diligencePath: Ask management to reconcile homepage counters, cumulative helped counts, and review denominators into one metric glossary.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: outcome-survey-methodology
    missingEvidence: Methodology, sample size, survey timing, and denominator behind the 98% better-outcomes claim and review counts.
    whyItMatters: Satisfaction is central to the thesis, but without methodology it is hard to compare Solace with other navigation models.
    diligencePath: Request the underlying survey instrument, sample frame, response rate, and deduplication policy across review channels.
    relatedQuestionRefs:
    - QU009
    - QU013
    relatedTableRefs:
    - TU004
