tables:
- id: TU001
  title: Customer segmentation table
  description: Solace customer base segmented by user, payer, referral source, and public proof quality.
  columns:
  - Segment
  - Buyer / User / Payer
  - Primary use case
  - Public scale / proof
  - Revenue / strategic value
  - Gap
  notes: Segmentation mixes end users, payer channels, and referral sources because Solace is not a pure employer-first B2B platform; public sponsor-account disclosure remains limited.
  rows:
  - - Patients with new or complex diagnoses
    - 'User: patient; payer: Medicare, Medicare Advantage, or commercial plan when eligible'
    - Specialist search, treatment coordination, second opinions, logistics after diagnosis
    - '>20,000 patients monthly and >200,000 helped cumulatively on public sources'
    - Core demand pool and primary end-user cohort
    - No segment split by diagnosis acuity or payer published
  - - Chronic-illness and multi-provider patients
    - 'User: patient; payer usually insurer / Medicare'
    - Care coordination, medication issues, record sharing, adherence, chronic-condition management
    - Specialties list spans chronic illness, COPD, kidney disease, heart disease, MS, Parkinson’s, mental health and more
    - High repeat-usage potential because needs are longitudinal
    - No disclosed retention or visit-frequency cohorts
  - - Family caregivers and loved ones
    - 'User: caregiver / family member; payer tied to patient plan'
    - Elder care, dementia support, distant caregiving, hospice and care transitions
    - Home, outcomes, and Medicare pages contain caregiver quotes and stories
    - Broadens acquisition beyond the patient alone
    - No disclosed caregiver share of users or revenue
  - - Billing / insurance navigation users
    - 'User: patient or caregiver; payer may be insurer plus occasional self-pay'
    - Prior authorization, claim appeals, billing disputes, coverage verification
    - Multiple official articles and testimonials mention bill disputes and authorization reversals
    - High-value wedge that proves ROI quickly to users and payers
    - No separate conversion or savings metric published
  - - Referring clinicians and practices
    - 'Buyer influence: physician / clinic; user remains patient'
    - Referral workflow, continuity of care, reduced staff admin burden
    - Public referral funnel, physician testimonials, 48-hour intake promise, and EHR updates
    - Strongest public B2B-adjacent proof channel
    - No public referral-volume or partner-practice count
  - - Commercial and payer sponsors
    - 'Buyer / payer: Medicare, Medicare Advantage, emerging commercial and employer-sponsored plans'
    - Covered advocacy embedded into care management and navigation economics
    - Official and press sources name nationwide Medicare / MA coverage and newer commercial-plan expansion
    - Main upside for diversification beyond Medicare-first demand
    - No named employer roster, payer mix, or sponsor concentration disclosed
