      tone: neutral
    - label: Coverage check
      detail: Patient or provider verifies Medicare, Medicare Advantage, or commercial eligibility; zero-out-of-pocket messaging lowers conversion friction.
      tone: positive
    - label: Physician intake
      detail: Solace physician evaluates fit, preserves clinical oversight, and matches the patient to the right advocacy lane.
      tone: positive
    - label: Dedicated advocate match
      detail: One advocate takes over calls, scheduling, authorizations, records, and family communication across phone, video, text, and email.
      tone: positive
    - label: Longitudinal support loop
      detail: Support continues as long as needed, with check-ins, EHR updates, and re-engagement when new issues arise.
      tone: positive
    - label: Referral / sponsor flywheel
      detail: Satisfied patients, caregivers, clinicians, and payers become repeat referrers, strengthening provider and payer embedding.
      tone: positive
