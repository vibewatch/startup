company:
  name: Solace Health
chapter:
  number: 6
  title: Customers
  summary: 'Solace’s public customer proof is strongest at the patient, caregiver, and referral-provider layers: the company says it serves more than 20,000 patients monthly, has helped more than 200,000 patients and families, and supports that narrative with thousands of reviews plus named physician and patient testimonials. Coverage through Medicare and Medicare Advantage is the current core payer channel, while commercial and employer-sponsored coverage is emerging but still lightly disclosed in public sponsor-logo terms. Satisfaction signals are strong, but sponsor retention, payer mix, and concentration remain major diligence gaps.'
sections:
- id: customer-segmentation
  title: Customer Segmentation and Buying Layers
  tableRefs:
  - TU001
  - TU006
  figureRefs:
  - FU001
  body: Solace’s customer evidence is strongest at the end-user and referral-provider layers rather than in a classic employer-first enterprise motion. The company’s public surfaces consistently describe patients, family caregivers, and loved ones as the core users, with use cases spanning new diagnoses, chronic illness, specialist search, billing disputes, prior authorizations, second opinions, elder care, dementia support, disability support, and behavioral health coordination. Fresh specialty pages for cancer, chronic illness, and elder care plus state pages for California and Virginia show Solace packaging the same care-coordination promise into diagnosis-specific and geography-specific acquisition surfaces, including local-resource and supporting-physician messaging. The paying channel today is still dominated by Medicare and Medicare Advantage coverage, while providers act as an important referral source and payers are framed as the economic beneficiary because Solace says its clinician-led model reduces friction, delays, and avoidable utilization. Commercial insurance and employer-sponsored coverage now appear in public materials, but public named sponsor accounts remain sparse. That means Solace should be analyzed as a patient-centric care-navigation company whose real proof sits in patient engagement and provider referrals, with payer and employer expansion still earlier in public disclosure.
