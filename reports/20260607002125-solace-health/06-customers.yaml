- id: TU005
  title: Expansion and concentration risk table
  description: Main growth vectors and concentration exposures visible from public evidence.
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  notes: This table distinguishes visible expansion vectors from the missing disclosures that would quantify payer, referral, or sponsor concentration.
  rows:
  - - Commercial and employer-sponsored plan coverage
    - Public materials still disclose few named employer or commercial sponsor accounts
    - Upside is large if coverage converts into real sponsor volume; proof is still thin
    - Request commercial-member count, employer logos, and percent of revenue outside Medicare / MA
  - - Deeper provider referrals and earlier care embedding
    - Heavy dependence on referral-channel performance could create concentration in a few systems or physician groups
    - Could accelerate growth and improve outcomes, but channel dependence can shift bargaining power
    - Request referral volume by provider group and share of starts from top 10 referrers
  - - Nationwide virtual model and broad specialty catalog
    - Nationwide promise may mask uneven depth by specialty, state, or behavioral-health availability
    - Supports broad TAM expansion but raises staffing and quality-control complexity
    - Request state-level advocate density and specialty fill rates
  - - Dedicated-advocate longitudinal model
    - No public cohort, visit-frequency, or renewal data to prove repeat economics
    - Could create strong retention if cases stay active; cannot yet underwrite from public data
    - Request relationship length distribution and repeat-engagement cohorts
  - - Payer-savings narrative
    - No public payer mix or top-payer concentration data
    - If Medicare / MA dominates too heavily, reimbursement or coding changes become material
    - Request revenue split across Original Medicare, MA, commercial, and self-pay
  - - Large testimonial base and high review counts
    - Review growth could still come mainly from company prompts and not from a diversified sponsor base
    - Good conversion aid, but not a substitute for disclosed sponsor retention
    - Request share of reviews from recurring users and review cadence by quarter
- id: TU006
  title: Provider referral and sponsor evidence table
  description: Public proof that Solace’s growth is supported by provider referrals and payer-aligned workflows.
  columns:
  - Surface
  - Public evidence
  - Buyer / user implication
  - Limitation
  notes: This table focuses on referral-provider proof because named employer or payer customer logos are limited in public materials.
  rows:
  - - Referral intake channels
    - Providers can submit referrals through the website, email, or fax
    - Low-friction workflow helps clinician adoption
    - No public referral-volume disclosure
  - - Fast onboarding
    - Eligibility check is framed as taking minutes and intake is usually available within 48 hours
    - Reduces risk that urgent cases stall between referral and activation
    - No published conversion rate from referral to matched case
  - - Clinical oversight
    - Patients first meet with a Solace physician, while the referring clinician remains responsible for medical decisions
    - Supports reimbursement and provider comfort without replacing the care team
    - No disclosed dropout rate at physician intake
  - - Longitudinal coordination loop
    - Advocates log updates in Solace’s EHR and keep providers informed while handling logistics
    - Makes Solace more embedded than a one-off navigation call center
    - No public provider NPS or staff-time savings metric
  - - Payer-aligned economics
    - Official payer materials say the model reduces barriers, improves continuity, and lowers avoidable utilization
    - Creates a basis for expansion beyond patient self-pay or ad hoc advocacy
    - No named payer contract list or public ROI study yet
