      - number: '2.3'
        title: 买方、用户和支付方地图：雇主买的是简化，Solace 当前的证据点仍是 Medicare 倡导
        blocks:
          - type: paragraph
            body: >-
              在雇主导航中，经济买方通常是自保雇主或福利负责人，用户是员工或被扶养人，经济回报是成本趋势下降和福利满意度提升。Quantum 的 2026 年报告显示了雇主现在在采购什么：一个能跨保险公司、PBM
              和医疗服务方负责到底的向导；由临床人员主导的导航，而不是纯呼叫中心支持；质量优先的就医引导；以及用 AI 增强人类专家，而不是替代他们。Quantum 还报告，93%
              的雇主希望技术方案仍包含人工支持。这有利于能把数字分诊和高接触干预结合起来的平台。

              Solace 与这种需求模式部分重叠，但起点不同。其证据支撑最强的上市路径是 Medicare 和 Medicare Advantage 倡导服务，靠直接计费基础设施和对齐 CMS
              的照护管理工作流驱动。Solace 也披露了商业保险覆盖可用性，以及更深入的支付方 / 医疗机构合作野心，但没有披露雇主客户数、覆盖人数、PMPM
              定价或商业收入结构。与此同时，现有导航供应商主推更广的雇主套件：Quantum 称服务 500+ 家雇主；Included 将倡导、导航和虚拟医疗提供给雇主和健康计划；Rightway 加入 PBM 集成和
              ROI 主张；Transcarent 强调统一合作伙伴访问和报告；HealthJoy 结合 AI、礼宾支持、账单申诉和就医引导。实际结论是，Solace 具备切入雇主导航的可信相邻性，但今天的公开证据更像一个扎根
              Medicare 的倡导滩头阵地，并具备支付方 / 医疗机构扩张潜力，而不是已被验证的雇主品类领导者。
