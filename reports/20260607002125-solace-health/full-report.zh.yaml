      - number: '2.2'
        title: 规模测算视角：全球导航 TAM 有参考价值，但美国 SAM 仍受证据约束
        blocks:
          - type: paragraph
            body: >-
              抓取资料中最干净的自上而下市场估算来自 Mordor Intelligence 的全球医疗导航平台预测：2025 年 USD 11.40 billion，2026 年 USD 12.25 billion，到
              2031 年 USD 17.61 billion，CAGR 为 7.52%。Mordor 还报告，2025 年雇主贡献 45.63% 的市场收入，北美占 45.25%。这些数字支持方向性透镜：2025
              年隐含全球雇主切片约 USD 5.2 billion，隐含北美雇主切片约 USD 2.35 billion。但这些仍是分析师模型抽象，不是美国限定、倡导限定、Solace 特定的 SAM。

              更强的需求证据来自美国成本压力和复杂度，而不是精准公开 SAM 模型。KFF 称，雇主赞助保险覆盖 154 million 名 65 岁以下人群，2025 年平均保费达到单人 USD 9,325、家庭 USD
              26,993。Mercer 称，2025 年雇主赞助健康成本达到每名员工 USD 17,496；2026 年续保涨幅在干预前平均 9.2%，即使调整计划后仍为 6.7%。McKinsey 另预计，2024 至
              2026 年商业医疗成本每年上涨 9% 到 10%。CMS 补充了更广的支付方背景，预计到 2033 年全国医疗支出平均增长 5.8%，其中 Medicare
              增长尤其强。合在一起，这些资料解释了为什么导航预算被优先排序，但仍没有隔离出 Solace 今天可在 Medicare、MA、商业雇主、支付方和医疗机构渠道中赢下的收入池。
