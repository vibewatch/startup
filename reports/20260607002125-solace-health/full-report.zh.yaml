  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Solace 已经拿到严肃的后期融资信号。2026 年 2 月的 Series C 把公司推过 $1 billion 门槛，使累计融资达到约 $211 million，并伴随可见的患者级牵引：每月超过
              20,000 名患者、超过 2,000 名倡导员，以及明确声称同比增长
              10x。这足以排除对业务的随意否定，但不足以仅凭公开证据按当前估值承销买入。记录中仍缺收入、抽成率、毛利率、烧钱速度、回款质量，以及该轮背后的精确优先股堆叠。换句话说，Solace
              更像是一家可信公司，价格却缺少足够文档支撑；不是一家弱公司，只是融了一轮好看的钱。因此正确判断是以中等置信度观察、高风险、估值偏高：保持跟进，因为切入口真实；但在把当前轮次视为可投资之前，要求私有证据确认，或等待更有吸引力的进入条款。
