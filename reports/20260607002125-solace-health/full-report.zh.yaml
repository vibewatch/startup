      - number: '3.3'
        title: 替代品、切换成本和分销力量
        blocks:
          - type: paragraph
            body: >-
              Solace 也在与现状替代品竞争，这些替代品看起来并不像风投支持的导航平台。抓取到的 Solace 定价说明区分了三类耐久替代方案：独立私人倡导员，历史上按现金收取约 $100 到 $500
              每小时；医院雇佣的倡导员，免费但大多局限于一个机构和一次照护事件；保险公司赞助的个案管理员，免费但结构上存在冲突，因为他们为健康计划工作。Solace 的答案是：让许多 Medicare 和 Medicare
              Advantage
              受益人的会员费用很低或为零，同时配一名具名、独立的倡导员和“代办到底”的工作流。信任建立后，这会形成关系型黏性，但比不上雇主套件的采购锁定效应；后者通过一份合同销售，并嵌入福利、药房、分析和合作伙伴生态。这个差异重要，因为宽平台有更清晰的公开分销：Quantum
              称有 500+ 家雇主，Rightway 超过 3 million 名会员，HealthJoy 有 1,800+ 家客户，Transcarent/Accolade 超过 20 million 名会员和
              1,700+ 家客户。
            claimRefs:
              - CP030
              - CP032
              - CP036
              - CP049
              - CP051
      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Solace
              的护城河在窄车道里看起来更耐久，在广义医疗导航品类标题下则没那么强。最强的公开差异化不是平台宽度，而是利益一致和工作流设计：倡导员为患者工作，而不是为医院或保险公司工作；上手路径包含临床人员监督；Medicare
              和许多 Medicare Advantage
              计划可以覆盖服务；倡导员承担了相当一部分行政负担。这些特征尤其匹配面对碎片化照护的老年、慢病或新确诊患者。主要战略风险在于，品类买方越来越想要一个平台同时提供集成导航、药房支持、质量导流、虚拟医疗、分析和
              AI。Included 的 CEO 已经把许多导航工作描述为商品化，Transcarent-Accolade 合并也显示规模玩家正在变宽。CMS 新的 Principal Illness Navigation
              支付是双刃剑：它验证了 Solace 底层的报销逻辑，也让医疗服务方、支付方和社区型导航项目更容易获得理由。因此，Solace 作为专注、可报销的倡导领导者最强；在正面对抗企业套件采购战时更弱。
