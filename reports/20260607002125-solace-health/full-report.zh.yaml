  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与定位
        blocks:
          - type: paragraph
            body: >-
              Solace 不是大型雇主导航供应商的直接翻版，尽管这些供应商主导了公开品类讨论。Solace
              的公开材料强调保险覆盖的患者权益倡导、由临床人员主导的信息采集，以及一名具名倡导员代表患者执行工作，而不只是把员工引导穿过福利堆栈。这让 Solace 最接近面向 Medicare 和 Medicare
              Advantage 会员、可报销的患者倡导服务，并与支付方 / 医疗机构照护管理有一定重叠，而不是正落在传统自保雇主导航桶里。相比之下，Included Health、Quantum
              Health、Rightway、Transcarent/Accolade 和 HealthJoy
              都主要把自己包装成面向雇主、健康计划或组织的平台，把导航与更广泛的福利、临床、药房或编排层结合起来。实际结果是战场分裂：当任务是“把患者盘子里的医疗作业拿走”时，Solace
              最强，尤其是在复杂慢病、老龄化、诊断、账单和治疗准入工作流里；当买方想要一个企业合同、可衡量的雇主节省、点解决方案集成和福利管理杠杆时，大型套件更强。
