  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开可见的 Solace 技术栈分层：上层是入口和录入，中层是临床医生监督下的编排，底层是 EHR / 计费基础设施。
    data:
      layers:
        - id: access-layer
          label: 入口与录入层
          detail: 患者和医疗服务方入口负责资格核验、转诊和首次线上问诊排期。
          sublayers:
            - id: eligibility
              label: Eligibility check
              detail: Website flow to confirm Medicare, Medicare Advantage, and expanding commercial coverage.
            - id: referral
              label: Referral channels
              detail: Provider referrals via website, email, or fax with intake usually available within 48 hours.
        - id: clinical-layer
          label: 临床编排层
          detail: Solace 医生或心理学家完成初诊，并在临床监督下把患者接给专属倡导员。
          sublayers:
            - id: intake-visit
              label: Virtual clinician intake
              detail: Short virtual visit establishes fit and directs the case.
            - id: matching
              label: Advocate matching
              detail: Dedicated advocate is paired based on background, need, and goals.
        - id: execution-layer
          label: 倡导员执行层
          detail: 倡导员长期处理沟通、排期、病历收集、申诉、照护协调和家属更新。
          sublayers:
            - id: communications
              label: Remote communication
              detail: Phone, video, text, email, secure messaging, and virtual visits.
            - id: playbooks
              label: Workflow playbooks
              detail: Scheduling, referrals, prior auth, billing disputes, transitions, and resource navigation.
        - id: platform-layer
          label: 数据与报销层
          detail: 公开材料显示，服务工作流底层有自研 EHR / 数据平台、患者笔记和 Medicare 计费支持。
          sublayers:
            - id: ehr
              label: Solace EHR / EMR
              detail: Advocates log updates and connect patient history across the case.
            - id: billing
              label: Billing infrastructure
              detail: Technology handles Medicare billing and supports the platform’s reimbursement share.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE017
      - CE018
      - CE019
      - CE020
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 从资格核验到临床初诊、匹配、远程支持和幕后执行，公开可见的运营流程。
    data:
      nodes:
        - id: w1
          label: 资格或病情叙述录入
          detail: 患者或医疗服务方提交个案并核验覆盖范围。
        - id: w2
          label: 线上临床初诊
          detail: Solace 医生或心理学家在一次短线上问诊中评估匹配度。
        - id: w3
          label: 专属倡导员匹配
          detail: 根据需求和背景，为患者匹配一名倡导员。
        - id: w4
          label: 远程协作
          detail: 电话、视频、短信、邮件、安全消息、笔记和家属同步支撑这段关系。
