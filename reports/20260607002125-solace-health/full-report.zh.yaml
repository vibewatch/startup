  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 报销完整性
        - CMS 对齐服务的已付赔付率、审计例外和追偿
        - 任一 CMS 或 MA 审计发现，或拒付 / 追偿率连续两个季度高于 10%
        - 下调收入预期，并在承销更多上行前要求计费整改证据。
      - - 覆盖广度
        - 具名计划覆盖、头部支付方集中度和商业保险结构
        - 最大支付方收入占比超过 40%，或 12 个月后商业保险结构无实质进展
        - 将支付方集中度视为投资逻辑上限，而非暂时启动问题。
      - - 安全与信任
        - 独立审计范围、事件日志和泄露披露
        - 重大 PHI 事件、外部审计失败，或无法提供控制证据
        - 视为投资逻辑破裂，因为隐私信任是产品根基。
      - - 人员产能
        - 倡导员流失、个案量、监督者比例和患者响应时间
        - 流失率超过 20%，响应时间中位数超过两个工作日，或监督比例下降
        - 下调增长假设，并要求运营稳定计划。
      - - 网络 / 可及性执行
        - 网内专科预约成功率和反复目录失败
        - 重点专科预约失败率持续高于 15%
        - 假设受影响队列的结果交付更弱、留存更低。
      - - 伙伴驱动扩张
        - 支付方 / 服务方合作的转诊转化
        - 尽管有融资和已宣布战略，仍没有实质嵌入式胜利，或试点转化疲弱
        - 下调商业和企业端上行，主要按更窄的 Medicare 服务承销 Solace。
    notes: 这些阈值是投资者侧否决标准，不是管理层指引。它们用于在尽调和投后跟踪中，把已抓取的公开证据转化为具体监控规则。
