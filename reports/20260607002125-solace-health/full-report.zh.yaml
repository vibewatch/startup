      - number: '7.2'
        title: 监管、法律与覆盖风险
        blocks:
          - type: paragraph
            body: >-
              Solace 的监管风险不在于某个已知公开执法事件，而在于它依赖一组很窄的报销和隐私条件。CMS 2024 年医师收费表调整，为在开单医生监督下工作的辅助人员提供 Principal Illness
              Navigation 及相关服务的可付费路径；Solace 公开的临床模式页面也明确写到医生接诊，以及倡导员按发起临床医生的 incident-to
              模式工作。这个契合是资产，但也意味着文档质量、医疗必要性、监督和按计划划定的资格不是后台细节，而是收入的核心依赖。Solace 自有材料反复提醒，不同计划的资格不同；其 Medicare
              说明也指出，Medicare Advantage 计划可能比 Original Medicare 设置更严格的网络和预授权规则。再叠加虚拟平台处理 PHI 的 HIPAA
              义务、多州执照要求和行为健康覆盖差异，哪怕还没考虑传统诉讼风险，公司已经有不小的合规暴露面。HHS 指引把业务伙伴保护措施和数据泄露通知流程列为明确义务；一篇 2026 年医疗法律分析认为，OCR 待定的
              Security Rule 修订可能要求年度审计、资产清单、MFA、加密和更快的供应商通知，进一步加重运营负担。CMS 的 CY 2026 Medicare Advantage
              最终规则也说明，申诉和利用管理护栏仍是移动靶，而不是已经定型的基础设施。已抓取材料没有出现针对 Solace 的诉讼、OCR 行动或披露的数据泄露，因此正确姿态不是洗白，而是紧密监测。公开尽调仍需要 Solace
              逐计划的支付证明和法律状态确认。
