chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与交付模式
        blocks:
          - type: paragraph
            body: >-
              Solace Health 由 Jeremy Gurewitz 和 Sara Sargent 在 2022 年创立，起点是 Gurewitz 帮助母亲应对胰腺癌治疗的经历。融资新闻稿称公司位于 Redwood
              City,
              California，官方营销网站则更强调使命，而不是公司所在地。核心产品是一个虚拟倡导平台：患者通常先完成一次简短的医生初评，被匹配给一名专属倡导员，再通过短信、电话、视频和异步跟进持续协作。官方页面始终把
              Solace 定位成保险覆盖的医疗权益倡导服务，以 Medicare 和许多 Medicare Advantage 计划为锚，2026
              年资料中开始出现商业保险扩张。公司呈现出的临床框架也比纯市场平台更正式。Solace Health Medical Group
              被描述为一个由临床人员主导的医疗服务集团，在医生和心理学家监督下全国提供服务；公司的信任材料称平台符合 HIPAA、数据加密，并把 PHI
              限制在最小必要范围内。关键细节在角色边界：倡导员承担大量行政和协调工作，但 Solace 反复说明，他们不诊断、不开处方，也不替代主治医生。
