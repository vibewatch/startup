      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              保留下来的官方资料给出的领导层画像窄但清晰。两位创始人仍站在前台：Jeremy Gurewitz 是公开 CEO，也是公司起源故事的承载者；Sara Sargent 是联合创始人兼首席产品官。临床侧，Solace
              公开列出 John Taylor 为首席医疗官、Mark Upton 为医疗总监，强化了公司希望把倡导服务嵌入医生监督的照护管理结构，而不是把它放在旁边。未公开的信息同样重要。在保留的资料集中，Solace
              没有披露公开董事会名单、创始人持股、投资人董事权利，也没有披露创始人和医疗领导层之外更广泛的职能负责人。对一家已经拿到后期风险资本的公司来说，这是明显的尽调盲区。它也带来关键人风险：Gurewitz 和
              Sargent 看起来掌握了大部分公开战略叙事、产品论点和投资人沟通，一旦离任或职责受扰，影响很可能很大。供后续章节使用的实际结论是：Solace
              看起来由创始人主导、由临床人员监督，但从公开市场信息标准看，治理并不透明。
