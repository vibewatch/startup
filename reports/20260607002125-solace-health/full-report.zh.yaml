  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与模式暴露
        blocks:
          - type: paragraph
            body: >-
              Solace 的风险栈由一个事实塑形：产品坐在美国医疗混乱的中段，而不是一个干净的软件端点。公司可以快速增长——近期报道提到超过 2,000 名倡导员、每月服务超过 20,000 名患者、$130 million
              Series C，以及超过 $1 billion
              的估值——但这些表层信号并不能移除结构性摩擦；正是这些摩擦决定倡导时间能否真正转化为可报销、高质量、可信任的服务。核心问题不是人们是否需要帮助来导航医疗；抓取证据强烈表明他们需要。问题是，Solace 在
              Medicare 规则、Medicare Advantage
              计划限制、医疗服务方网络混乱和人力密集型服务模式中运营时，能否让这个由临床人员监督、高接触的模式保持合规、稳定且经济上耐久。因此，热力图把报销完整性、员工队伍扩张和信任保障放在残余严重度最高的格子里，因为这些风险会同时击中结果、可付费用量和商业可信度。
