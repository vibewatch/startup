      - number: '4.2'
        title: 收入质量、公开牵引力与单位经济
        blocks:
          - type: paragraph
            body: >-
              相比纯现金支付的倡导业务，收入质量方向上更好，因为报销似乎移除了主要消费者定价障碍，公开规模信号也不轻。Series C 材料和独立报道称，Solace 通过超过 2,000 名倡导员组成的网络，每月服务超过
              20,000 名患者；BusinessWire 还称同比 10x 增长。这组信号说明，需求确实有支付方支撑，不只是零散患者获客。与此同时，服务显然带有人力交付成本：官方 Medicare
              覆盖文案称，患者与倡导员每沟通一小时，背后大约伴随三小时协调工作；公开服务范围横跨排期、医疗服务方协调、事前授权、账单争议和社会需求支持。这些事实让抽成率、使用率和回款质量成为决定利润率的关键。但公开记录恰恰没有提供这些输入。Factually
              的独立评测有用，因为它指出大多数直接覆盖证明仍来自公司，应该对照计划文件核验；这让 Solace
              的收入质量证据足以勾勒机制，但不足以完成单位经济模型。关于账单争议、事前授权和患者倡导员职责的额外官方指南，让服务组合更清晰：Solace
              倡导员被期待追文件、处理申诉、降低账单，并管理照护转衔。这些活动可能通过作用于系统里昂贵的失灵点来提高收入质量，但也确认了另一点：除非报销收益率和倡导员利用率足够强，否则毛利率会被人力密集型工作约束。
