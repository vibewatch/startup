      - number: '6.2'
        title: 采用轨迹与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              公开规模信号有意义，但并不同步。Solace 2026 年 2 月 Series C 材料和独立跟进报道称，平台每月服务超过 20,000 名患者，并拥有超过 2,000
              名倡导员组成的全国网络。另有多个当前官方页面称，Solace 已累计帮助超过 200,000 名患者、个人或家庭，而抓取时首页仍显示较小的 45K+
              已帮助患者计数。最安全的解读是，公司确有全国采用和快速增长，但部分网站计数器滞后，或使用了不同分母。满意度和社会证明页面在品类中也算大：结果页面引用 8,332 条评价、4.7 星，转诊页面引用超过 18,000
              条五星评价，外部评价聚合平台则指向规模较小但仍有意义的 Trustpilot 评价基数。对尽调而言，关键结论是 Solace 已从零散需求跨入规模化使用，但公开采用仪表盘仍缺少一套标准指标。
