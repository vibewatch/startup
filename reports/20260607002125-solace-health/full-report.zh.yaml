  - id: TV005
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 报销稳固性破裂
        - 可计费路径、监督权限或支付方报销倡导工作的意愿出现实质回撤
        - 削弱 Solace 区别于纯礼宾式服务或导航服务商的核心切入点。
        - 在管理层证明替代变现引擎前，立即视为投资逻辑失效。
      - - 商业扩张停滞
        - 除零散保险公司引用外，没有证据显示商业保险覆盖成为实质第二增长腿
        - 让公司过度依赖 Medicare 主导的增长，并收窄长期倍数支撑。
        - 维持观察建议；如果估值仍假设广泛支付方扩张，则下调。
      - - 经济性披露令人失望
        - 尽调发现抽成率弱、毛利率低、回款差或拒付率高
        - 把一个有希望的叙事，变成杠杆有限、服务占比过重的模型。
        - 不按当前价格推进；从更低入场区间重新承保，或直接退出。
      - - 后续融资嵌入重优先级
        - 下一轮引入惩罚性优先权、参与权或棘轮条款，与溢价增长轮不匹配
        - 即使企业价值不变，新资金回报也可能急剧恶化。
        - 除非价格实质重置，否则按类似普通股回报预期应视为不投。
      - - 品类重置加深
        - 导航资产新的公开市场或 M&A 标记显著低于私有市场溢价预期
        - 缩小可辩护退出的集合，并提高 Solace 证明异常优异经济性的门槛。
        - 收紧入场纪律，并下调复查基准估值区间。
    notes: 阈值有意保持方向性，因为决定性变量是政策、支付方经济性和融资条款，而不是某一条已披露收入线。
    claimRefs:
