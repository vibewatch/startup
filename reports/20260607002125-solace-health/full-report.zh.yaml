          value: Her death sharpens the case for patient advocacy as a distinct service layer.
          tone: neutral
        - label: 2022 创立
          value: Jeremy Gurewitz and Sara Sargent found Solace.
          tone: positive
        - label: 2024 Series A 轮
          value: $14M Series A led by Inspired; total funding reaches $21M.
          tone: positive
        - label: 2024 报销环境
