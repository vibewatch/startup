      - number: '8.4'
        title: 退出准备度、尽调请求与投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              退出可选性存在，但目前只有轮廓。MedCity 报道管理层目标是可能在 2028 年 IPO；融资节奏也说明 Solace 能吸引可信的成长投资人。即便如此，公开记录仍无法支撑 IPO
              或控股出售所需的承销材料，因为核心经济桥仍被遮住。最终尽调清单很直接：拿到支付方结构、报销瀑布、回款数据、利润率堆叠和股权结构瀑布，解释 >$1 billion
              头条估值究竟买到了什么。同一套材料也决定放弃触发器。如果报销规则或支付方意愿后退，商业保险扩张被证明很浅，或未来融资条款意味着高优先级和新钱上行空间很薄，投资逻辑会很快破裂。反过来，如果尽调显示报销经济性持久、条款干净，Solace
