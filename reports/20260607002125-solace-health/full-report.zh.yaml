  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与报销机制
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是一个由报销支撑的倡导模式，而不是透明 SaaS 价目表。Solace 的患者页、FAQ 和 Medicare 覆盖页称，Original Medicare 和许多 Medicare
              Advantage 计划覆盖该服务，现在也在扩展到商业保险；公开的患者成本主张集中在 94%-95% 的用户无需自付。支付方页面补充了运营细节：一名 Solace
              医生或心理学家完成信息采集，随后倡导员在发起临床人员监督下工作。CMS 的 2024 年 Principal Illness Navigation
              规则独立重要，因为它明确为在计费从业者监督下由辅助人员提供的导航式服务创建了支付。Bloomberg 补上了缺失的变现环节：Solace 的技术处理 Medicare
              计费，公司从支付给倡导员的报销中保留可变比例。对不在覆盖计划内的用户，Solace
              公开提到小时费率和免费初次咨询电话，但仍未发布价目表。实际结论是：这是一个临床人员主导、保险计费的服务平台，并有自费后备路径，不是经典订阅目录。Solace 自己的照护协调指南进一步强化了这一框架，明确把
              Medicare 支持与 Chronic Care Management、Transitional Care Management 和 Medicare Advantage 协调项目挂钩。这不能证明 Solace
              只按某一个代码族收费，但确实增强了公开论据：业务围绕可报销的协调工作搭建，而不是围绕可自由支配的消费者支出。
