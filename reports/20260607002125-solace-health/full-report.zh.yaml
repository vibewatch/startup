      - number: '5.2'
        title: 临床与技术架构
        blocks:
          - type: paragraph
            body: >-
              交付架构有三层可见结构。第一层是临床资格确认：支付方和 Medicare 材料描述一名 Solace
              医生或心理学家做初始评估，再把患者连接给倡导员。第二层是倡导员队伍本身，公开资质描述大方向偏临床，但并不完全一致。支付方页面称倡导员包括 RN、LCSW
              和其他持证临床人员；消费者页面则简化为注册护士和其他医疗专业人员；Bloomberg 摘录称，在 Series C 时名册全是注册护士。第三层是软件和数据层。Series B 材料描述了自研 EHR
              和数据平台；转诊页面称倡导员在 Solace EHR 中记录更新；Bloomberg 摘录又加入了 Medicare 计费工具和用于患者病史的内部
              EMR。这足以支持一套真实运营堆栈，但还不足以详细绘制托管、互操作性、API
              覆盖或安全架构。今天外部能看见的护城河，因此是临床监督下的工作流编排和报销赋能，而不是披露很深的技术栈。转诊页面进一步强化了这一点：倡导员联系各方索取病历、记录更新，并在 Solace EHR
              内保持个案有序。换句话说，Solace 可见架构的重点不在自助式患者应用，而在一套工作流系统，让受过临床训练的人能够规模化协调复杂照护。
