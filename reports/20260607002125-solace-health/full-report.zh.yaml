  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会视角快照，把 Solace 的品类优势与当前公开证据缺口放在一起看。
    data:
      items:
        - label: 市场需求
          value: 8/10
          detail: 医疗可负担性压力和有人引导的就医导航需求都真实存在，而且还在上升。
        - label: 患者 / 产品验证
          value: 8/10
          detail: 公司还年轻，月度患者、倡导员和消费者验证信号已经很强。
        - label: 报销护城河
          value: 7/10
          detail: Medicare 支付支持的倡导服务有差异化，但耐久性仍需直接尽调。
        - label: 经济性可见度
          value: 3/10
          detail: 收入、利润率、回款和烧钱速度仍未披露。
        - label: 执行 / 政策风险
          value: 4/10
          detail: 交付高度依赖人，再叠加报销依赖，风险仍然偏高。
        - label: 估值吸引力
          value: 3/10
          detail: 按公开记录真正能支撑的证据看，当前估值标记偏高。
        - label: 证据质量
          value: 4/10
          detail: 最强的论据仍更多来自融资材料和公司口径，而不是独立建模。
    approximationNotes: 这些分数是投委会基于留存资料库作出的判断输入，不是管理层披露的 KPI。
