  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 相对于 2026 年 2 月估值锚点，公开记录暴露的主要驱动因素对价值的示意性相对影响。
    data:
      items:
        - label: 商保扩张证明足够实质
          value: 0.5
          detail: 如果商保覆盖成为有意义的第二增长腿，估值有望正向重估。
        - label: 抽成率和利润率披露转明
          value: 0.6
          detail: 最大上行驱动，因为它把使用量转成可投资的经济性。
        - label: 独立结果证据出现
          value: 0.2
          detail: 有帮助，但不如收入质量和报销耐久性关键。
        - label: 上市导航服务可比公司进一步压缩
          value: -0.5
          detail: 如果类别定价继续向 Accolade 式结果靠拢，就是下行因素。
        - label: 回款或拒付画像令人失望
          value: -0.7
          detail: 最大下行驱动，因为报销摩擦会摧毁市场感知的经营杠杆。
    approximationNotes: 这些值是分析师式相对影响估计，表示相对于当前锚点的方向性 x 倍变化，不是已观察到的市场变动。
