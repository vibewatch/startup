      - number: '1.3'
        title: 融资、投资人和规模快照
        blocks:
          - type: paragraph
            body: >-
              Solace 的融资节奏是公司阶段最清晰的信号。公司 2024 年完成 $14 million Series A，2025 年 4 月完成 $60 million Series B，2026 年 2 月完成由
              IVP 领投的 $130 million Series C，估值超过 $1 billion。Series C 之后的独立报道把累计融资列为 $211 million，可见投资人包括 Inspired
              Capital、Craft Ventures、Torch Capital、Menlo Ventures、SignalFire、IVP 和 RiverPark
              Ventures。规模主张很强，但需要谨慎处理。Series C 材料和下游报道称，截至 2026 年初，Solace 拥有超过 2,000 名倡导员，每月服务超过 20,000 名患者。公司还宣传倡导员平均经验
              16 年、98% 报告结果改善，以及以保险覆盖为主的模式——大多数患者几乎或完全不自付。累计触达叙事不够干净：首页显示已帮助 45K+ 名患者，而其他公司页面称已帮助约 200,000
