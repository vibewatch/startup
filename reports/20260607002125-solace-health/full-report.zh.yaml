  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 相对于 2026 年 2 月估值锚点的相对低 / 基准 / 高结果，而不是用美元给出虚假的精确度。
    data:
      items:
        - label: 悲观结果 vs 2026 年 2 月估值
          low: 0.4
          base: 0.6
          high: 0.8
          unit: x
          note: 报销或可比公司压力把业务推向上市导航服务的出清水平。
        - label: 基准结果 vs 2026 年 2 月估值
          low: 0.9
          base: 1.1
          high: 1.4
          unit: x
          note: Solace 增长填上本轮估值，但尚未证明品类领先的经济性。
        - label: 相对 Feb-2026 估值的乐观结果
          low: 1.6
          base: 2
          high: 2.5
          unit: x
          note: 商业化扩张和单位经济性强，支撑私人市场给出溢价结果。
        - label: 当前公开参照
          low: 1
          base: 1
          high: 1
          unit: x
          note: 投后估值和股数未披露，因此这个锚点只是概念性参照，不是精确值。
    approximationNotes: 区间值只是后期轮投资评估相对回报的经验锚；除未披露的 Series C 条款可能已内含的摊薄外，不再计入未来摊薄。
    claimRefs:
