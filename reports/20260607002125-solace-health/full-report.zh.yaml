            body: >-
              抓取资料支持一个清晰的同业集合，但不是一个同质化品类。如果 Solace 试图走向更完整的倡导加照护体验，Included 和传统 Accolade
              是最接近的参照；两者都把倡导与虚拟临床服务和福利指导配对。Quantum 和 Rightway 也是临床主导的导航平台，但公开定位明显以雇主和 ROI 为先：Quantum
              销售分层导航包，强调理赔节省、拒赔减少、高成本理赔参与和大型集成层；Rightway 则把导航与透明收费 PBM 和福利管理工作流减负结合起来。Transcarent/Accolade 是这一组里最宽的套件，结合
              AI WayFinding、照护体验、药房、倡导、专家医学意见和统一采购封装。HealthJoy 临床深度相对更轻，但作为 HR
              主导部署的福利操作系统和参与层更强。企业端公开定价大多不透明，因此有用的比较点不是标称价目表，而是打包方式、买方朝向，以及谁承担会员费用。
