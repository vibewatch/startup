      - number: '6.4'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              Solace 的留存证据方向正面，但不完整。公开页面称，每位患者都会获得一名专属倡导员，并可持续相伴；Solace
              还明确说，患者可以按需要一直与同一倡导员合作，也可以之后回来寻求新帮助。最新具名故事增加了定性纵向证据：Robert 的照护案例包括每周跟进和支持小组连接；Liz 的父亲在专科准入加速后收到每日跟进；Pearl
              的记忆力检查故事包括提醒和家庭会议；Esther 的多专科案例在初始 48 小时动员后仍保持协调。评价页面对该品类来说很强：官方页面引用 8,332 条评价、4.7 星和超过 18,000
              条五星评价，第三方评价聚合平台报告来自 357 条 Trustpilot 评价的 4.5 分。与此同时，公司没有公开披露
              NRR、GRR、客户数流失、续约率、合同期限或队列留存，而这些才是投资人真正想要的耐久性指标。外部评论也指出保险资格、倡导员可用性、行政流程和远程医疗怀疑等较窄问题。结果是：满意度和重复关系意愿看起来强，但尚未转化成量化留存经济。
