        - 导航、倡导、AI 原生计划设计、初级保健、专科护理、心理健康
        - 护理交付覆盖面远宽于 Solace
        - 公开定位以雇主和组织为先，不以 Medicare 为先
      - - Quantum Health
        - 雇主导航与护理协调平台
        - 25+ 年；500+ 个雇主；850+ 项集成
        - 自保雇主及员工人群
        - 导航、护理协调、医护机构指导、药房支持、分析
        - 很契合追求 ROI 和集成深度的雇主采购
        - 会员关系通过雇主福利建立，而不是独立患者倡导
      - - Rightway
        - 护理导航 + PBM
        - 3M+ 会员；覆盖数十万 Fortune 500 员工；近期客户留存率 >97%
        - 雇主和卫生系统
        - 导航、账单帮助、药房福利管理、App 驱动的会员支持
        - 同业中药房 / PBM 邻近能力最强
        - 定位不围绕可报销的 Medicare 患者倡导
      - - Transcarent + Accolade
        - 广义企业健康与福利平台
        - '>20M 会员；>1,700 个雇主和健康计划客户；Accolade FY2024 收入约 $414M'
        - 自保雇主、健康计划、工会和会员
        - AI 导航、倡导、专家意见、虚拟初级保健、药房、专科护理、单点方案商店
        - 套件最宽，单一合同企业采购叙事最强
        - 买方和功能范围都远宽于 Solace 当前赛道
      - - HealthJoy
        - 福利操作系统 / 礼宾层
        - 1,800+ 客户；94% 满意度；单点方案使用率 2.5x
        - 雇主、顾问、HR 和财务负责人
        - 福利 OS、JoyAI、礼宾服务、引导、报告
        - 面向 HR 买方的参与度和操作系统叙事强
        - 临床深度和倡导专属性不如 Solace
      - - 现状替代品
        - 私人倡导员、医院倡导员、保险公司个案经理
        - 私人倡导员通常 $100-$500/小时；医院和保险公司项目通常对会员免费
        - 已在医院或健康计划内的患者和照护者
        - 阶段性医院帮助、存在利益冲突的保险公司导航，或现金付费私人倡导
        - 熟悉，且已嵌入现有照护场景
        - 连续性有限、范围更窄，或激励不一致
    notes: 公开规模和范围比较的是异质模式；各行强调披露的买方 / 渠道取向，以及抓取语料能支持的可比点，而不是相同的单位经济。
