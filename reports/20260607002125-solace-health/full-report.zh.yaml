      - number: '2.4'
        title: 增长驱动与采用约束：成本通胀有利，但宽度、信任和数据摩擦仍卡住采用
        blocks:
          - type: paragraph
            body: >-
              导航的增长逻辑很直接。雇主成本上涨快于工资和总体通胀；McKinsey 称，许多雇主希望节省超过 10%，并可能为此更换保险公司。Mercer 显示，高绩效网络、可变共付额和 EPO
              设计的使用都在增加，这些都要求会员更好地选择医疗服务方和福利。Quantum 的趋势报告称，参与方式正从被动了解福利，转向高摩擦动作，例如专科协调、药房批准，以及引导至 Centers of
              Excellence。CMS 的 2024 年 Principal Illness Navigation 和 Community Health Integration
              报销变化，也为高风险病情所需的医疗必要导航、照护协调和患者自我倡导创造了 Medicare 顺风。

              但采用并非没有摩擦。KFF 称，网络充足性或目录准确性仍没有全国标准；CMS 发现 45.1% 的 Medicare Advantage 目录地点不准确，其中 38.4% 的错误可能阻断就医。KFF
              还引用了神秘顾客证据，显示打给列名 QHP 医疗服务方的电话有 73% 未能约到诊，并引用另一项审查称 48.7% 的 MA
              目录不准确。这种失灵创造了对导航员的需求，但也抬高了供应商的运营负担：验证网络真实情况、协调病历、解决准入问题，都吃人力、吃数据。同时，雇主端巨头越来越常把导航与相邻产品打包，新进入者必须证明覆盖宽度或更好的
              ROI。对 Solace 而言，最大剩余约束是证据，而不是品类逻辑：抓取记录支持需求和相邻性，但还不能证明精准商业 SAM、雇主渗透率，或支付方 / 医疗机构集中度画像。
