      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于收入和轮次条款未披露，情景框架应相对于 2026 年 2
              月估值，而不是假装能精确到美元。乐观情景取决于三个相互咬合的证明：报销保持持久，商业保险或支付方扩张变得明显重要，管理层证明可变分成报销模型能产出有吸引力的平台经济性，而不只是高服务吞吐量。届时，Solace
              才能证明相对当前估值有明确溢价。基准情景更温和，也更有用：Medicare
              主导的牵引仍真实，支付方关系继续加深，公司逐步消化本轮估值，但没有快到足以证明突破性经济性并获得大幅重估。悲观情景正是公开市场可比公司所警告的：品类倍数压缩，报销或回款比预期更不稳，未来融资或交易价格更接近传统导航基准。因此决策应围绕情景触发器，而不是单一头条估值数字。
