  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 融资表现突出且患者牵引真实，但经济性和条款仍不透明。
        - 保持跟踪；不要把当前轮次当作仅凭公开记录即可买入的机会。
      - - 置信度
        - 中
        - 融资和使用证据可信；收入、利润率和优先股堆叠未公开。
        - 将其作为 IC 初筛观点，不是最终批准。
      - - 风险评级
        - 高
        - 报销耐久性、回款质量和未来轮次条款可能显著改变回报。
        - 任何新增进入前，都要先做下行情景承销。
      - - 估值立场
        - 偏高
        - 超过 $1B 的估值靠强劲势头支撑，而非公开收入或利润率披露。
        - 需要更低价格结构或更强私有证据，才足以改善判断。
      - - 进入纪律
        - 当前估值仅限尽调
        - 公开记录支持保持兴趣，但不足以直接承销。
        - 相比盲目参与后期新股，优先选择跟踪、结构化进入或折价老股敞口。
      - - 什么会改变判断
        - 经济性 + 条款
        - 支付方结构、抽成率、利润率、回款和股权结构清晰度会直接移动公允价值。
        - 只有当这组信息披露且符合高溢价结果时，才上调判断。
    notes: 本表刻意对价格敏感：公司质量强，并不能抵消独角兽以上估值下薄弱的经济性披露。
