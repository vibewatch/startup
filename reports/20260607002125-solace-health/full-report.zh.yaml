  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入和 ARR
        - 当前收入、ARR，以及按支付方和队列拆分的增长桥
        - 需要把独角兽信号转成估值模型，而不是融资标题。
        - 财务资料包：月度收入桥、过去十二个月视图和董事会预算。
      - - 报销经济性
        - 抽成率、总额到净额瀑布、拒付率、申诉和应收账款周转天数
        - 检验 Solace 是可规模化平台，还是薄利的服务中介。
        - 结合支付方合同、计费运营和回款仪表盘，审阅收入周期。
      - - 支付方结构和扩张
        - 来自 Original Medicare、Medicare Advantage、商业保险和自费的患者与收入占比，以及已签商业合同
        - 判断集中度风险，以及商业上行叙事是否现实。
        - 商业和支付方尽调，包含合同摘要和上线时间表。
      - - 股权结构表和优先权
        - 完全摊薄股数、Series C 股价、清算堆叠、老股成分和按比例认购权
        - 条款不透明时，回报可能与表面估值大不相同。
        - 法务和财务审阅最新股权结构表及交易文件。
      - - 独立结果证据
        - 第三方或同行评议研究，显示成本趋势下降、依从性改善或就医时间缩短
        - 能强化一个判断：倡导服务正在变成耐久基础设施，而不是融资周期主题。
        - 临床研究和支付方 ROI 材料包，包括任何未发表分析。
      - - 退出准备度
        - 审计状态、投行准备、数据室成熟度，以及管理层更新后的 IPO 或战略出售计划
        - 后期定价需要可信的流动性路径，不能只靠品类热度。
        - 董事会层面尽调，访谈 CFO、法律顾问和任何外部顾问。
    notes: 每个问题都对应保留公开材料暴露出的具体承保缺口；没有一项是装饰性问题。
