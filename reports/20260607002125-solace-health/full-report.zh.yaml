  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 主题
      - 投资逻辑
      - 反向逻辑
      - 什么会改变观点
    rows:
      - - 可报销切入点
        - Solace 拥有差异化的可报销倡导切入点，而不是纯现金付费的礼宾模式。
        - 具体抽成率、拒付画像和报销耐久性仍未披露。
        - 展示代码级计费机制、实际费率，以及按支付方拆分的稳定回款。
      - - 患者牵引
        - 20k+ 月度患者和 2k+ 倡导员表明使用真实、供给侧有深度。
        - 单靠使用量不能证明收入质量或运营杠杆。
        - 披露按队列拆分的每患者月收入、利用率和贡献利润。
      - - 品类时点
        - 雇主和支付方面临更高成本和更复杂流程，医疗导航只会更相关，而不是相反。
        - 医疗导航也已经变成拥挤且持续整合的市场，宽平台可以用规模压过更窄的切入点。
        - 证明 Solace 能打入企业渠道或与企业渠道合作，同时不牺牲经济性。
      - - 可比公司支撑
        - Garner 和 Included 说明，规模化、高质量的导航资产仍会得到投资人奖励。
        - 这些公司公开披露的 ARR、盈利能力或股权结构表质量，都多于 Solace。
        - Solace 需要对齐这种披露标准，或用估值折让补偿。
      - - 退出可选性
        - 2028 年 IPO 目标和强联合投资方，说明未来存在可行的流动性路径。
        - 目前还没有公开 S-1 招股说明书、经审计财务报表或优先权瀑布，退出时间更多是叙事，不是证据。
        - 展示投行准备度、审计质量，以及能支撑 IPO 或战略出售测算的股权结构表。
    notes: 各行把公司质量论点和价格质量论点分开，保证推荐结论保持克制。
