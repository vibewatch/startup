      - number: '7.3'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Solace 是一个有人参与的照护平台，失效画像和自助 SaaS 产品完全不同。公司称其符合 HIPAA、使用加密数据处理，并且只采集最低必要
              PHI；但已抓取的公开证据没有给出投资人衡量剩余安全风险所需的独立审计细节、事故历史或控制测试。如果 OCR 最终落地近期医疗法律评论所述的 HIPAA Security Rule
              修订，年度审计、资产清单、MFA、加密和更快的业务伙伴通知会继续抬高控制负担。服务交付也从根上是远程的：Solace
              靠电话、视频、短信和邮件工作，倡导员在屏幕外协调大量照护旅程。这可以提高效率，也会带来分诊错误、跟进不一致，以及患者对重度远程医疗模式的不信任。已抓取材料中最负面的公开信号不是已证实不当行为的指控，而是更软的预警：投诉容易集中在行政不一致、资格意外和可用性限制上。高接触服务扩张快过监督、QA
              和排班纪律时，正是这些摩擦最容易被放大。
