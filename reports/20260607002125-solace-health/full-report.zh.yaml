  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 相对估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 报销保持稳固，商业保险覆盖变得有实质意义，Solace 在倡导服务量之上证明有吸引力的平台经济性。
        - 在多年持有期内，支持约为 2026 年 2 月估值锚点的 1.6x 至 2.5x；因为公司会开始更像顶级私有导航赢家，而不是公开市场落后者。
        - 商业扩张可能仍然偏浅；人力密集度仍可能压住利润率。
        - 有可能，但在变现和支付方结构披露改善之前，证据仍偏少。
      - - 基准
        - Medicare 主导的采用继续推进，支付方关系加深，Solace 在不立刻证明品类领先经济性的情况下，逐步消化本轮估值。
        - 支持大约为 2026 年 2 月锚点的 0.9x 至 1.4x；除非披露质量改善，否则投资人只能保住价值或获得中等上行。
        - 叙事仍强于模型，限制重估空间。
        - 这是今天公开记录下最可信的情景。
      - - 悲观
        - 报销稳固性转弱，支付方扩张停滞，或品类倍数压缩到传统导航资产的结果。
        - 支持约为 2026 年 2 月锚点的 0.4x 至 0.8x；如果后续轮次条款加入很重的优先级，结果会更差。
        - 公开可比公司和整合结果已经说明，这条路径并非假想。
        - 不是基准情景，但考虑到披露缺口，现实性太强，不能忽视。
    notes: 区间相对 2026 年 2 月估值标记给出，因为确切投后估值、股数和优先级都未公开披露。
