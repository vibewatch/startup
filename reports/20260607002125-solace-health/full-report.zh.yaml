  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              最适合把 Solace
              的产品理解成由临床人员监督的医疗权益倡导工作流，而不是独立消费者应用。面向患者的旅程从资格或病情信息采集开始，接着是一场简短的虚拟临床问诊，然后交接给一名按患者需求匹配的专属倡导员。此后，交付变成高接触、持续性的服务：Solace
              称倡导员通过电话、视频、短信、电子邮件、虚拟访问和安全消息工作，同时也在触点之间继续做看不见的工作。服务覆盖面很宽，但逻辑一致。官方页面反复描述同一批任务——排期、转诊、文书资料、病历整理、事前授权、账单争议、照护协调、转衔和本地资源寻找——说明
              Solace 销售的是一个可在许多用例中复用的倡导模型，而不是一组互不相连的工具菜单。工作流也被刻意设边界。Solace
              明确表示，倡导员不诊断、不开处方、不替代主治医生，也不提供法律建议；在协调平台受过临床训练的人力与其非诊断角色时，这一点很重要。公开页面还强调持续性：同一名倡导员可以按需要一直参与，公司把这种连续性框定为产品的一部分，而不是附加服务层。连续性重要，因为
              Solace 的许多用例——二次意见、事前授权拉锯、账单争议和照护转衔——展开周期是数天或数周，而不是一次电话内完成。
