      - number: '4.3'
        title: 资本充足性、可比信号和披露结论
        blocks:
          - type: paragraph
            body: >-
              从标题数字看，资本充足性很强。Solace 完成 $14 million Series A、$60 million Series B 和 $130 million Series C；MedCity 和
              Bloomberg 将累计融资列为 $211 million，最新估值超过 $1 billion。公开资金用途表述持续指向倡导员网络扩张、平台投资、临床研究、支付方和医疗服务方合作；在 Bloomberg
              的叙述中，还包括大量营销和招聘。这足以说明，公司在 2026 年 2
              月融资后并不明显缺钱。但这还不足以承销流动性。已审阅的公开资料仍缺少账上现金、月度烧钱、现金跑道、债务和报销营运资本周转。可比信号有参考，但噪音大，不能定案。Accolade 的 TTM 收入约 $440
              million，但在约 $621 million 收购前市值仅约 $570 million；CNBC 将该退出放在数字健康公开市场更艰难的背景中。Garner 展示了区间另一端：Series D 时披露 130%
              增长，Series E 时披露约 $200 million 的总 ARR，但这些披露来自更宽的雇主导航模式。因此结论是平衡的：Solace
              的融资位置看起来强，但公开披露仍太薄，无法有信心地建模收入质量、利润率或现金跑道。MobiHealthNews 又补充了一个谨慎可比信号：Accolade
              在私有化交易前裁员并缩小规模，凸显更宽的导航平台要撑住公开市场预期有多难。这个背景让我们更不能从任何单一可比结果外推稳定倍数。
