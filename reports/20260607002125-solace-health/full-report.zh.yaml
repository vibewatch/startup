      - number: '5.3'
        title: 信任、合规与成熟度
        blocks:
          - type: paragraph
            body: >-
              信任和成熟度是混合图景。正面看，Solace 持续称自己符合 HIPAA、使用加密数据处理、只使用最小必要 PHI，并让患者信息不进入支付界面。它还提到
              Vanta，并运营全国远程模式；公开资料称，该模式已经通过超过 2,000 名倡导员每月服务超过 20,000 名患者。CMS 的 2024 年 Principal Illness Navigation
              框架提供了有用背景，因为它说明联邦报销基础设施现在已经存在，可支持由辅助人员参与、受监督的导航式服务。但这是背景支持，不是对 Solace 本身的背书。弱点在证明深度。资料包没有提供具名托管供应商、可用性
              SLA、互操作细节、公开发布说明、除 Vanta 提及之外的独立审计材料，抓取到的 HIPAA-notice URL 也没有实质性隐私通知。同样，产品路线图证据偏宽泛而非颗粒化：Series B 和 C
              材料谈到平台投资、临床研究，以及更早嵌入支付方 / 医疗服务方，但没有披露带日期的功能发布或安全路线图检查点。这让 Solace
              在服务规模上看起来商业成熟，但技术细节披露仍不足。甚至公司的支持和内容页面也更偏运营，而不是面向发布：它们帮助患者理解 Medicare
              变化、安全基础和工作流预期，却没有暴露技术买方通常想看的颗粒化变更日志、可用性仪表盘或审计包。对尽调而言，负担因此从读文档转向索取内部运营证据。
