  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：医疗导航比权益倡导更宽，但 Solace 目前只覆盖其中一部分
        blocks:
          - type: paragraph
            body: >-
              抓取到的市场资料把医疗导航定义成临床、财务和行政混合工作流，而不是单一软件功能。Included Health
              将导航描述为一个单一入口，可覆盖理赔与倡导支持、账单问题、专家临床支持、成本可见性，以及面向雇主、健康计划和企业的照护协调。Mordor
              进一步把市场拆成入口导航、健康权益倡导、病种垂直导航和一般导航，再把终端用户分为雇主、支付方或健康计划、医疗机构或医疗系统，以及其他。这个边界很重要，因为 Solace 目前并没有等比例映射到所有层级。

              Solace 的公开证据最强的是 Medicare
              覆盖的倡导服务：由临床人员发起信息采集，倡导员作为临床人员工作的延伸，支持慢病和急性病，并协助事前授权、医疗服务方协调和医疗行政。这显然与导航市场中的健康权益倡导和照护协调切片重叠。但这并不自动让 Solace
              等同于现有巨头面向雇主销售的完整导航堆栈；那些平台会把福利入口、就医引导、PBM 集成、虚拟医疗或计划管理打包在一个平台内。远程医疗和直接照护交付也是相邻品类，而不是同一件事；CMS 仍把远程医疗视为单独的
              Medicare 覆盖类别。因此，用于市场规模和估值的正确框架应是“Solace 与一个快速增长的导航市场有重叠”，而不是“Solace 已经等于整个导航平台市场”。
