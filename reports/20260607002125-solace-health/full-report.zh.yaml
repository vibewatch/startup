      - number: '8.2'
        title: 可比估值视角：为什么当前估值偏高
        blocks:
          - type: paragraph
            body: >-
              可比公司给出的信号是要守纪律，而不是不相信。Accolade 是最清楚的公开警示：2025 年 5 月，其约 $0.44 billion 的过去十二个月收入，对应约 $0.57 billion 市值；公司后来以约
              $621 million 卖给 Transcarent。即便考虑盈利能力偏弱和公开市场压力，这个结果也说明，只要经济性不达标，仅有导航规模并不能拿到溢价倍数。Garner 指向另一个方向，但关键差异很大：其
              2025 和 2026 年轮次达到 $1.35 billion 和 $2.74 billion，同时拥有 130% 增长、约 $200 million 的总 ARR，以及接近 800 个客户。Included
              Health 又给出另一类质量信号，因为它称自己已经盈利、保持两位数增长，并且没有优先股堆叠。最新雇主市场报道还显示，Included 正把导航推进替代性计划设计，靠 AI
              引导的初级照护分诊和先共付定价，说明更广义的导航平台正试图同时掌握照护指引和福利结构。Solace
              目前更像这个品类最强的私营叙事，而不是最弱的公开市场结局；但其公开披露质量仍更像故事，而不是模型。错配之下，当前价格显得偏高，而不是荒唐。
