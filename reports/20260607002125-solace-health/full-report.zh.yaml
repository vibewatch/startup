  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与购买层
        blocks:
          - type: paragraph
            body: >-
              Solace
              的客户证据在终端用户和转诊医疗服务方层最强，而不是典型雇主优先的企业销售动作。公司的公开页面持续把患者、家庭照护者和亲友描述为核心用户，用例横跨新诊断、慢病、专科医生寻找、账单争议、事前授权、二次意见、老年照护、失智支持、残障支持和行为健康协调。最新的癌症、慢病、老年照护专题页，加上
              California 和 Virginia 的州页面，显示 Solace 正把同一套照护协调承诺包装进按诊断和地理划分的获客页面，并加入本地资源和配套医生信息。今天的付费渠道仍由 Medicare 和
              Medicare Advantage 覆盖主导；医疗服务方是重要转诊来源，支付方则被框定为经济受益者，因为 Solace
              称其临床人员主导模式可以降低摩擦、延误和可避免利用。商业保险和雇主赞助覆盖现在出现在公开材料中，但公开具名赞助账户仍稀少。这意味着，分析 Solace
              应把它视为以患者为中心的照护导航公司：真正证据在患者参与和医疗服务方转诊里，支付方和雇主扩张在公开披露中仍更早期。
