  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the strongest valuation or scale signals visible in the retained healthcare-navigation corpus: Solace
        itself, the Accolade public and control outcomes, Garner's two disclosed private rounds, and Included's
        profitability signal. Several strategic competitors remain in the table as status references even when clean
        valuation data is unavailable.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Solace Series C 轮
        - '>20k 名患者/月；>2k 名倡导专员；$130M 新资金'
        - 2026 年 2 月估值 > $1B
        - 直接的入场锚点，也是报销支持的倡导服务获得投资人支持的最强信号。
        - 确切投后估值、股数和优先权未披露。
      - - Accolade 公开市场
        - 约 $0.44B TTM 收入；公开医疗导航基准
        - 2025-05-30 市值约 $0.57B（约 1.3x 市值 / 收入）
        - 展示盈利能力偏弱时，公开市场如何给规模化导航资产定价。
        - 市值不是企业价值，公开市场情绪可能低估战略价值。
      - - Transcarent / Accolade 控制权结果
        - Accolade 以 $621M 出售；合并平台覆盖 >20M 名会员和 >1,700 家客户；Transcarent 最近一次私有估值约 $2.2B
        - 控制权交易加战略合并，不是少数股权融资
        - 对品类整合和广度提供有用的战略清算参考。
        - 控制权溢价和合并后公司范围，让它对 Solace 的读数并不完美。
      - - Garner Series D 轮
        - 收入增长 130%；约 700 家组织；2.5M 名会员
        - 2025 年估值 $1.35B
        - 证明私有投资人仍会为高增长导航资产支付溢价。
        - 雇主优先的医生排名模型，区别于 Solace 由 Medicare 主导的倡导切入点。
      - - Garner Series E 轮
        - 约 $200M 总 ARR；近 800 家客户；增长连续五年翻倍以上
        - 2026 年估值 $2.74B
        - 对一个变现和披露都充分得多的导航公司来说，这是高端私有可比对象。
        - Garner 披露了 Solace 尚未披露的 ARR 和规模，因此表面倍数不能直接套用。
      - - Included Health
        - 已盈利；双位数增长；约 300 家雇主和健康计划；无优先股堆叠
        - 私有规模和质量信号；保留材料中没有干净估值
        - 说明该品类可以走向盈利，并搭出更干净的股权结构表。
        - 保留材料没有直接估值标记，且雇主照护范围比 Solace 更宽。
    notes: 可比视角在有估值信号处使用估值信号，在缺少估值处使用状态信号；这是有意为之，因为保留材料不足以支撑一个干净的导航市场统一倍数。
