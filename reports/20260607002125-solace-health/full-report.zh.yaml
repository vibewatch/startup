      - number: '7.5'
        title: 人才、执行与放弃标准
        blocks:
          - type: paragraph
            body: >-
              人才风险重要，因为 Solace 卖的是连续性、判断力和韧性，不只是软件工作流入口。公司承诺给每位患者配一名长期陪伴的专属倡导员；其自我描述也强调护士、LCSW
              和其他持证临床人员在临床医生监督下工作。因此人员质量、主管带宽和留存，比一个泛泛的员工数更重要。但公开材料没有披露倡导员流失率、个案负载、响应时间
              SLA，或主管与倡导员比例。全远程早期组织可以跑得很快，也可能把运营压力藏到服务一致性下滑之后才暴露。因此，正确的投资姿态应以阈值为准：如果报销完整性变弱，若安全或质量事件击穿公众信任，若合作方驱动的增长停滞，或若人力指标显示倦怠和监督偏薄，投资逻辑就应迅速下调。Solace
              仍可能在医疗体系里搭出有价值的一层，但已抓取证据说明，公司需要证明持久执行，而不只是需求存在。
