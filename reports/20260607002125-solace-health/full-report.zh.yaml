          type: input
          detail: Series C 融资 $130M，估值 >$1B，累计融资约 $211M。
        - id: n2
          label: 牵引力证明
          type: process
          detail: 每月 20k+ 患者、2k+ 倡导员和 10x 增长，指向真实采用。
        - id: n3
          label: 报销切入点
          type: process
          detail: 可变分成 Medicare 计费叠加 MA 和选择性商保覆盖，形成差异化路径。
        - id: n4
          label: 披露缺口
          type: process
          detail: 收入、利润率、回款和股权结构条款仍未披露。
        - id: n5
          label: 可比公司重估风险
          type: process
          detail: Accolade 和更广泛导航服务可比公司显示，只有规模并不保证高溢价结果。
        - id: n6
          label: 建议：观察
          type: output
          detail: 继续贴近公司，但没有私下尽调或更好的入场纪律之前，不要按当前估值做投资测算。
      edges:
        - from: n1
          to: n2
          label: 由此支撑
        - from: n2
          to: n3
          label: 强化
        - from: n3
          to: n4
          label: 仍受阻于
        - from: n4
          to: n5
          label: 风险因其上升
        - from: n5
          to: n6
          label: 迫使保持纪律
    approximationNotes: 这条流程是投资委员会逻辑图，不是确定性模型；每个节点都把多个公开事实压缩成一个门槛判断。
