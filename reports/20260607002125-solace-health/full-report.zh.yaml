      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最大上行空间在于，从 Medicare 优先的覆盖服务扩张到更广的商业保险和嵌入式照护路径。Solace
              现在称，其全国覆盖商业保险，包括雇主赞助计划；多篇融资文章称，下一阶段是更深的支付方和医疗服务方合作，把倡导更早放进照护旅程。最大风险是集中度：公开证据仍显示，公司重度依赖 Medicare 和 Medicare
              Advantage 报销、转诊医疗服务方渠道，以及公司控制的证言，而不是多元化的公开赞助方名单。谁在大规模付费也存在透明度风险，因为公开材料没有拆分 Original Medicare、Medicare
              Advantage 和商业保险量，也没有披露最大支付方或最大转诊来源敞口。公开雇主标识有限、没有披露赞助方队列，且患者计数不一致，让人很难判断 Solace
              的商业扩张究竟仍是早期试点，还是已经带来有意义的收入多元化。
