      - number: '7.4'
        title: 合作方、依赖与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              Solace 不只依赖自己的倡导员网络，也依赖外部系统来决定倡导能否真正奏效。Medicare Advantage 计划设计、预授权、服务方网络宽度和服务方目录准确性，都会影响 Solace
              能否把患者带到可用的网内照护。CMS 的目录审查报告和 KFF 的网络充足性研究显示，这些摩擦是系统性问题，不是零星个案；这解释了 Solace 的需求，也意味着公司暴露在无法完全控制的问题上。KFF
              发现，2024 年 Medicare Advantage 有近 53 million 项预授权裁定，其中 4.1 million 项被拒，超过 80% 的上诉拒赔随后被推翻；HHS-OIG 称其相关工作推动了
              CMS、行业和国会行动。Fierce 对同一研究的摘要也强调，不同保险公司的差异很大，进一步说明患者摩擦会因计划而明显分化。增长战略又加一层风险。Solace
              近期融资报道强调，要深化支付方和服务方合作，把倡导更早嵌入照护流程；但商业保险扩张仍处在早期。因此支付方和服务方渠道执行变得关键，尤其是 Quantum Health、Transcarent
              等更大的既有玩家，已经大规模向雇主和健康计划销售一体化导航平台。雇主成本压力上升可能推高买方对导航的兴趣，但也会抬高 ROI 审查，压缩买方对差结果、弱转化或模糊报销经济性的容忍度。
