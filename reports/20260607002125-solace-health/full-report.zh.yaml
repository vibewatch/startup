      - number: '6.3'
        title: 具名患者与医疗服务方证明
        blocks:
          - type: paragraph
            body: >-
              具名证明存在，但压倒性地偏证言和转诊导向，而不是企业标识导向。医疗服务方侧，Marian University 的 Dr. Luke Nelligan 和 St. Vincents Hospital 的 Dr.
              Daniel Anzaldua 都公开背书 Solace；Nelligan 还特别表示，他看到被转诊到该服务的老年患者结果更好。患者和照护者侧，Diane J. 描述了因为保险网络变化而失去心脏科医生访问后使用
              Solace；Alexa 和 Hilary 描述了父亲癌症历程中获得的倡导员支持。最新抓取的故事页面增加了更具体的具名例子：Julia 的心脏病案例包含远程医疗协调和一次成功的保险申诉；Robert
              的阿尔茨海默病照护案例包含每周跟进和照护者支持小组；Liz 的父亲把专科准入从数月加速到数周；Pearl 的记忆力检查案例包括神经科访问和家庭会议；Esther 的多病情案例在 48
              小时内跨多个专科组织起来。其他具名故事还覆盖帕金森病相关急诊升级、术前事前授权逆转、透析后勤、肾脏照护、临终关怀协调，甚至包括 MedCity 报道的一例恢复移植名单资格案例。这些例子说明，Solace
              可以指向横跨患者自发启动和临床医生转诊路径的真实使用，但大多数公开证明仍由公司筛选且偏定性，而不是来自已披露支付方、医疗系统或雇主赞助方、经独立测量的生产环境 ROI。
