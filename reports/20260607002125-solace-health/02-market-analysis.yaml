  - id: growth-and-constraints
    title: "Growth drivers and adoption constraints: cost inflation helps, but breadth, trust, and data friction still gate adoption"
    body: |-
      The growth case for navigation is straightforward. Employer costs are rising faster than wages and general inflation; McKinsey says many employers want more than 10% savings and may switch carriers to find them. Mercer shows increasing use of high-performance networks, variable copays, and EPO designs that all require members to make better provider and benefit choices. Quantum's trend report says engagement is shifting from passive benefits awareness to high-friction actions such as specialist coordination, pharmacy approvals, and guidance to Centers of Excellence. CMS's 2024 Principal Illness Navigation and Community Health Integration reimbursement changes also create a Medicare-tailwind for medically necessary navigation, care coordination, and patient self-advocacy for high-risk conditions.

      But adoption is not frictionless. KFF says there is still no national standard for network adequacy or directory accuracy, and CMS found 45.1% of Medicare Advantage directory locations inaccurate, with 38.4% carrying errors likely to block access. KFF also cites secret-shopper evidence showing 73% of calls to listed QHP providers failed to secure appointments and a separate review finding 48.7% of MA directories inaccurate. That dysfunction creates demand for navigators, but it also raises the operational burden on vendors: proving network truth, coordinating records, and resolving access issues are labor- and data-intensive. At the same time, employer incumbents increasingly bundle navigation with adjacent products, so entrants must prove breadth or superior ROI. For Solace specifically, the biggest remaining constraint is evidence, not category logic: the fetched record supports demand and adjacency, but not a precise commercial SAM, employer penetration, or payer/provider concentration profile.
