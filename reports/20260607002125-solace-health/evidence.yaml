evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: advocate-credentials
    missingEvidence: >-
      A current credential mix for active advocates, broken out by RN, LCSW, physician, psychologist, and other licensed
      staff.
    whyItMatters: >-
      Credential mix affects clinical scope, reimbursement defensibility, operational staffing, and later
      market-comparison claims.
    diligencePath: Request an active advocate roster by license type plus any supervising-clinician ratio and state-practice matrix.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, founder ownership, investor board seats, protective provisions, and any observer rights.
    whyItMatters: >-
      Control rights and board composition determine who can shape strategy, financing terms, and founder succession
      risk.
    diligencePath: >-
      Obtain the current cap table, charter, investor-rights agreement, and latest board-consent package from
      management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-precision
    missingEvidence: Exact post-money valuation, share count, option-pool refresh, and liquidation stack for the 2026 Series C.
    whyItMatters: >-
      A public >$1B headline is directionally useful, but pricing discipline and return scenarios depend on exact
      security terms.
    diligencePath: Review the Series C term sheet, stock purchase agreement, and capitalization table immediately after close.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: >-
      Disclosure of debt facilities, venture credit, founder or investor secondary sales, and exact ownership
      percentages.
    whyItMatters: >-
      These terms directly affect dilution, seniority, downside protection, and realized liquidity before any future
      exit.
    diligencePath: >-
      Ask for a financing-history schedule that reconciles equity rounds, debt, SAFEs/notes, and any secondary
      transactions.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: cumulative-reach
    missingEvidence: >-
      A single management-defined cumulative patient metric with a frozen denominator and distinction between patients,
      families, and accounts.
    whyItMatters: >-
      Inconsistent reach counters can inflate traction narratives and complicate market-share or cohort-quality analysis
      later in the report.
    diligencePath: >-
      Request a monthly historical utilization table showing unique patients, family accounts, and active advocates by
      month.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, payer mix, headcount, and office-location data are absent from public sources.
    whyItMatters: >-
      Without operating metrics, investors cannot judge efficiency, burn, organizational scale, or how much the >$1B
      valuation rests on future expectations.
    diligencePath: >-
      Request board materials or data-room metrics covering ARR/revenue, gross margin, active users, headcount, and
      geographic staffing mix.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Internal launch chronology, provider-partnership milestones, and any formal complaint, litigation, or enforcement
      history beyond public web traces.
    whyItMatters: >-
      The company overview can ship with a public chronology, but later diligence on operating risk and go-to-market
      execution benefits from a fuller timeline.
    diligencePath: >-
      Ask management for a board-level timeline of product launches, payer/provider wins, and any material disputes or
      compliance events.
    relatedQuestionRefs:
      - QO023
      - QO026
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-precision
    missingEvidence: >-
      Public U.S.-only revenue pools for advocacy-first navigation by employer, payer, provider, and Medicare
      reimbursement channel.
    whyItMatters: >-
      Without a cleaner denominator, any Solace-specific SAM or SOM risks overstating the company's current reachable
      market.
    diligencePath: >-
      Request management's internal segmentation of covered lives, reimbursable episodes, and revenue by buyer channel,
      then reconcile that to external employer and CMS benchmarks.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: solace-commercial-traction
    missingEvidence: >-
      Solace's employer client count, commercial covered lives, retention, pricing model, and independently measured ROI
      outside Medicare.
    whyItMatters: >-
      Commercial and employer expansion is central to upside, but public evidence today only proves adjacency, not scale
      or efficiency.
    diligencePath: >-
      Request cohort data by channel, renewal curves, savings methodology, and at least one independently auditable
      employer or payer case study.
    relatedQuestionRefs:
      - QM022
      - QM025
  - type: missing-source
    severity: material
    topic: payer-provider-concentration
    missingEvidence: >-
      Number and concentration of payer and provider partnerships, including what share of volume comes from Medicare,
      MA, commercial, and provider referrals.
    whyItMatters: >-
      Channel concentration determines both growth durability and bargaining power, especially if Solace expands through
      payer or provider embedding.
    diligencePath: >-
      Ask for top-contract exposure, channel revenue mix, and any concentration thresholds tied to renewal or
      reimbursement changes.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: employer-proof
    missingEvidence: >-
      Independent employer-side proof that Solace's advocacy model lowers trend or improves benefits satisfaction in
      non-Medicare populations.
    whyItMatters: >-
      The category tailwind is clear, but market leadership claims are weaker without buyer-verified commercial
      outcomes.
    diligencePath: >-
      Request employer references, third-party evaluations, or channel-partner case studies that separate employer
      outcomes from Medicare-member outcomes.
    relatedQuestionRefs:
      - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-coverage
    missingEvidence: >-
      Publicly comparable data on smaller regional navigators, payer-owned navigation products and provider-built
      care-management entrants.
    whyItMatters: >-
      These omitted players may matter in specific geographies or payer channels even if they are not the main national
      peers.
    diligencePath: >-
      Expand the competitor census with payer, provider and regional-navigation discovery work and add rows if public
      scale data exists.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Realized contract values, PEPM rates, reimbursement yields, discounts and gross-margin structure for Solace and
      enterprise peers.
    whyItMatters: Public packaging alone is not enough to judge pricing power or resilience against bundled-suite competition.
    diligencePath: >-
      Request payer contracts, MA reimbursement by code, enterprise rate cards and realized-price cohorts from
      management.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: >-
      Solace’s current payer-provider partner counts, referral concentration, Medicare versus Medicare Advantage mix and
      cohort-level retention.
    whyItMatters: >-
      Distribution durability and channel concentration determine whether Solace can scale without relying on expensive
      direct patient acquisition.
    diligencePath: Ask for partner roster, referral share by channel and retention by payer or provider cohort.
    relatedQuestionRefs:
      - QP027
  - type: missing-source
    severity: material
    topic: retention-and-multi-homing
    missingEvidence: >-
      Win-loss data, repeat-use rates, member retention and evidence on how often patients or sponsors multi-home with
      broader navigation suites.
    whyItMatters: Without this data, the durability of Solace’s relationship-based switching costs is hard to judge.
    diligencePath: >-
      Request churn, repeat-use, referral-source persistence and competitive displacement data from management or payer
      partners.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: A gross-to-net waterfall showing payer reimbursement, advocate payout, and Solace’s retained platform share.
    whyItMatters: Without the retained share, patient and advocate scale cannot be translated into company revenue or margin.
    diligencePath: >-
      Request payer-by-payer reimbursement waterfalls, advocate payout schedules, and gross-to-net revenue recognition
      policy.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: payer-mix
    missingEvidence: Revenue and patient mix split across Original Medicare, Medicare Advantage, commercial plans, and self-pay.
