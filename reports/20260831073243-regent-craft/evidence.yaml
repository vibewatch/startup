evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: >-
      A direct source disclosing Regent Craft's August 2026 post-money valuation or internal 409A / priced-round
      valuation mark.
    whyItMatters: >-
      The report can verify funding size but not the entry price required to confirm unicorn status or benchmark
      dilution.
    diligencePath: >-
      Request the Series B term sheet, a board-approved financing summary, or an investor letter disclosing the
      valuation.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, run-rate, gross margin, and customer deposit conversion data for 2025-2026.
    whyItMatters: Factory completion and orders do not by themselves prove commercial economics or near-term cash generation.
    diligencePath: Request the latest management financial package and a contract-conversion schedule for launch customers.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: minor
    topic: headcount-disclosure
    missingEvidence: A dated employee count by location and function.
    whyItMatters: >-
      Headcount is a useful proxy for manufacturing readiness and cash burn, but the public record only exposes teams
      and offices.
    diligencePath: Request a current org chart or payroll summary and reconcile it against manufacturing ramp plans.
    relatedQuestionRefs:
      - QO019
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, committee structure, and any investor governance rights attached to the Series B and debt
      facility.
    whyItMatters: Late-stage financing quality depends on who controls approvals, information rights, and downside protections.
    diligencePath: Request board materials, the cap table, investor-rights agreements, and debt covenant package.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: minor
    topic: certification-risk
    missingEvidence: >-
      A current primary regulatory filing or Coast Guard design-basis document rather than media summaries and company
      commentary.
    whyItMatters: >-
      The core certification thesis is central to timing risk, but the public record still depends on company and
      journalistic summaries.
    diligencePath: Request direct Coast Guard correspondence, design-basis agreement excerpts, or Lloyd's milestone reports.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      Additional third-party dated milestone sources for every company timeline entry, especially the 2024 D.C. office
      opening and 2025 factory-groundbreaking items.
    whyItMatters: >-
      The chronology is robust enough for overview work, but some entries still rely on company timeline disclosures
      more than independent reporting.
    diligencePath: >-
      Pull local Rhode Island coverage, partner announcements, or official permitting records for each remaining
      single-source milestone.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
