- id: milestones-scale-demand
  title: Milestones, manufacturing scale, and early demand signals
  body: Regent's public milestone record is unusually dense for a private maritime-mobility startup. The company timeline starts with the June 2021 Brittany Ferries order, then moves through the August 2022 relocation to Rhode Island, the September 2022 quarter-scale flight milestone, the January 2023 Japan Airlines strategic investment, the October 2023 Series A and Marine Corps agreement, the July 2024 D.C. office opening, the January 2025 groundbreaking of the Quonset manufacturing plant, the March 2025 full-scale prototype sea-trial milestone, and the July 2025 launch of REGENT Defense. By March and June 2026, Regent was claiming an order book above $10 billion across six continents, first deliveries in 2027, and the completion of a 255,000-square-foot production site at 1 Seaglider Way. The company also says it has multiple years of manufacturing capacity booked and has already reinvested $71.5 million into Rhode Island while creating more than 100 jobs before full ramp. The customer-quality
    evidence is still largely pre-delivery rather than revenue-backed, but the combination of commercial launch partners, factory completion, and defense contract expansion makes Regent look more operationally mature than a concept-stage transport startup.
