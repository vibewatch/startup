company:
  name: Regent Craft
chapter:
  number: 1
  title: Company Overview
  summary: Regent Craft is a Rhode Island seaglider manufacturer founded in 2020 by Billy Thalheimer and Mike Klinker, building the 12-passenger Viceroy and a defense-oriented product family around wing-in-ground effect vessels. Retained 2026 sources support the $240 million Series B, $340 million total committed capital, a 255,000-square-foot factory, Marine Corps and launch-partner traction, and a commercial order book above $10 billion across six continents. The key unresolved issues are the undisclosed post-money valuation, absent public revenue and headcount disclosure, and still-evolving certification mechanics.
sections:
- id: identity-product-footprint
  title: Identity, product logic, and operating footprint
  body: 'Regent Craft describes itself as the developer and manufacturer of all-electric seaglider vessels for coastal transportation. Across the homepage, company page, and Viceroy product page, the company makes a consistent argument: a seaglider combines aircraft-like speed with the dock access and operating economics of a maritime vessel. The flagship Viceroy is presented as a 12-passenger, two-crew platform that operates in three modes — float, foil, and flight in ground effect — at roughly 180 mph over water for about 180 miles with current batteries. Regent also keeps its infrastructure thesis explicit. It says the craft is intended to use existing dock infrastructure rather than purpose-built runways or vertiports, which is central to its claimed cost and deployment advantage. The careers page and 2026 test-campaign release tie the operating footprint together: headquarters, testing, and manufacturing are concentrated in North Kingstown, Rhode Island, while a Washington, D.C. office
    focuses on certification and defense engagement. That two-site footprint is credible and repeatedly corroborated, but public materials remain much stronger on product vision and physical footprint than on operating metrics such as revenue, headcount, or deployed fleet count.'
