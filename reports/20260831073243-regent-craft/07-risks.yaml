- calloutType: risk
  title: The category can still fail on timing even if the concept works
  body: The public evidence supports technical seriousness and demand, but it also shows that certification, route approvals, reliability proof, and funding still need to line up in sequence. A slip in one can impair all four.
  claimRefs:
  - CR003
  - CR011
  - CR024
  - CR027
  - CR039
- calloutType: recommendation
  title: Use milestone discipline, not narrative enthusiasm
  body: Treat human flight, route approvals, customer conversion milestones, and private reliability data as hard diligence gates. If those do not progress on schedule, the thesis should de-rate quickly regardless of the backlog headline.
