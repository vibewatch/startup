    - Stereo vision, radar, sonar, and integration software
    - Maritime sensing performance metrics are described qualitatively, not quantitatively.
  - - Operator interface and training
    - Enable maritime captain control, awareness, and safe procedures
    - Type rating, simulation, and training program
    - Training throughput and pass/fail data are unavailable.
