- id: maturity-roadmap-and-dependencies
  title: Maturity is advancing from prototype proof toward manufacturing, but dependencies remain
  body: >-
    The roadmap is now easier to parse because Regent has accumulated both technical and
    industrial milestones. The company moved from a quarter-scale demonstration flight in
    2022 to full-scale sea trials and hydrofoiling work, kicked off a 2026 test campaign,
    completed its first manufacturing facility, and raised a much larger Series B to support
    production and certification. That sequence gives the product maturity story real shape:
    concept, subscale proof, full-scale on-water transition, manufacturing readiness, then
    first customer deliveries targeted for late 2027. The main dependencies are equally clear.
    Product readiness still depends on Coast Guard and Lloyd's pathway execution, successful
    human flight and further hull-to-foil-to-flight validation, supplier choices that remain
    undisclosed on the public site, and the company's ability to turn a multidisciplinary
    hiring plan into reliable production quality. Relative to air-taxi peers, Regent's maritime-first
    pathway may reduce infrastructure complexity, but it also means investors are underwriting
    a category that still has little comparable in-service history.
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
