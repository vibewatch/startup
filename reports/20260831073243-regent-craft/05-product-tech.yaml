company:
  name: Regent Craft
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Regent's product stack is unusually concrete for a new mobility category: a 12-passenger
    Viceroy platform, a defense/autonomous Squire drone, a larger Monarch roadmap, a
    completed manufacturing site, and a steadily expanding body of technical explanation
    around hull-foil-flight transitions, digital flight controls, distributed propulsion,
    and maritime sensing. The strongest technical strengths are the dock-based operating
    model, hydrofoils plus ground effect, and a maritime-first certification path with
    Lloyd's Register and the U.S. Coast Guard. The biggest gaps are still private: named
    propulsion supplier, battery pack architecture, quantitative safety/reliability metrics,
    cybersecurity controls, and module-level certification maturity.
sections:
- id: product-definition-and-missions
  title: Product definition in operator workflow terms
  body: >-
    Regent is delivering a maritime mobility system rather than a single tourism craft.
    The Viceroy page and FAQ frame the current commercial product as a 12-passenger,
    all-electric seaglider that can also be configured for cargo, offshore logistics,
    search and rescue, and defense missions. The operator workflow is intentionally familiar:
    passengers or cargo board at a dock, the craft departs on its hull, transitions to
    hydrofoils outside crowded harbor areas, then flies in ground effect over open water.
    That operating flow matters because it explains why Regent keeps emphasizing existing
    dock infrastructure and maritime captains instead of airport gates, runways, or vertiports.
    The product family is broader than Viceroy alone. FAQ and defense materials describe
    a hybrid/autonomous Viceroy variant, the Squire autonomous drone, and a 100-passenger
    Monarch roadmap. In customer terms, Regent is selling faster harbor-to-harbor mobility
    with lower infrastructure burden; in technical terms, it is packaging hydrodynamics,
    electric propulsion, sensing, and flight-control software into one operator-facing
    vessel system.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-core-technologies
  title: Architecture combines maritime hardware with modern control and perception systems
  body: >-
    Regent's technical articles make the architecture more legible than the landing-page
    marketing alone. The craft operates in three modes — float, foil, and fly — and the
    company repeatedly argues that the combination of hydrofoils and digital flight controls
    is what makes its seaglider design different from older wing-in-ground attempts. The
    wing article explains that earlier ekranoplan designs traded stability for heavy or
    inefficient configurations, whereas Regent claims modern digital control systems now
    manage instability without sacrificing aerodynamic efficiency. The Viceroy page adds
    several concrete architecture elements: retractable hydrofoils, distributed blown-wing
    propulsion with 12 redundant electric motors, fly-by-wire steering, synthetic vision,
    radar, forward-looking sonar, and traffic advisory systems. The sensing article adds
    another important layer by describing a large-baseline stereo-vision approach from
    NODAR as a better maritime-perception fit than lidar in glare and spray-heavy conditions.
    Together these disclosures support a differentiated architecture thesis: maritime hull
    and hydrofoils for dock and wave operations, aircraft-like wing efficiency in ground
    effect, and software-assisted sensing and control to bridge the historically unstable
    parts of WIG flight.
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
