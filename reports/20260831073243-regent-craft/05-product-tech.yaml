  rows:
  - - Viceroy electric
    - Ferry, airline, offshore, and coastal operators
    - Full-scale prototype and pre-delivery commercial product
    - 12 passengers, 180 mph, dock-based operation, three-mode travel
    - Public ASP, BOM, and supplier details remain undisclosed.
  - - Viceroy hybrid / autonomous variant
    - Defense and long-range operators
    - Roadmap / defense configuration
    - Longer stated range and autonomous positioning for dual-use missions
    - Public certification path and configuration differences are not fully disclosed.
  - - Squire autonomous drone
    - Defense and uncrewed mission operators
    - Prototype / test stage
    - Autonomous seaglider architecture extends the family beyond crewed transport
    - Public payload, sensing stack, and production plan remain limited.
  - - Monarch seaglider
    - Large inter-island and high-density coastal operators
    - Concept / design-partner stage
    - 100-passenger roadmap expands category beyond boutique routes
    - No public timeline, pricing, or configuration detail comparable to Viceroy.
  - - Rhode Island manufacturing campus
    - Regent production and quality teams
    - Complete and ramping
    - Co-locates manufacturing, testing, and office functions on one campus
    - Public throughput, takt time, and acceptance-rate metrics are absent.
  notes: >-
    Rows distinguish delivered product lines from enabling assets because Regent's product
    maturity now depends as much on the production system as on the craft itself.
