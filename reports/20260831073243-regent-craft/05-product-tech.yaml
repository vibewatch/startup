- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Harbor-to-harbor passenger travel
    - Ferry or short-haul air plus airport friction
    - Electric Viceroy from dock to dock
    - Faster point-to-point travel with no airport dependency
    - Commercial service not yet live.
  - - Inter-island freight and parcels
    - Truck to airport or slower marine cargo legs
    - Cargo-configured seaglider with 3,500-lb payload
    - Speed and coastal access for time-sensitive goods
    - Payload and frequency economics not publicly modeled by Regent.
  - - Offshore personnel transfer
    - Helicopter or marine support vessel
    - Viceroy offshore-logistics configuration
    - ADNOC says up to 80% lower operating costs versus helicopters
    - Proof point is pre-deployment and use-case specific.
  - - Search and rescue / medevac
    - Traditional marine or helicopter response
    - Search-and-rescue interior plus fast coastal transit
    - Rapid response over water with payload flexibility
    - Public clinical or operational response metrics are unavailable.
  - - Defense littoral logistics
    - Legacy boats, helicopters, or runway-dependent aircraft
    - Crewed and autonomous seaglider variants
    - Low-signature, runway-independent coastal mobility
    - Mission certification and military procurement path remain early.
  notes: >-
    Benefits are source-backed mission claims, not observed in-service KPIs, because Regent
    has not yet entered broad commercial operations.
