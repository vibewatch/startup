- id: TV004
  title: Comparable valuation table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: >-
      Selected public comparables and one cautionary public cohort name chosen for similar regulated-mobility,
      autonomy, or certification risk characteristics; not a full sector screen.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Joby Aviation
    - Public market cap and enterprise value
    - $6.9B market cap; $5.39B enterprise value as of Aug. 28, 2026
    - Closest U.S. public passenger advanced-mobility valuation reference with certification-sensitive risk.
    - Aircraft certification path, public liquidity, and disclosure depth differ materially from Regent.
  - - Archer Aviation
    - Public market cap and enterprise value
    - $4.43B market cap; $2.99B enterprise value as of Aug. 28, 2026
    - Useful reference for how public markets price pre-scale mobility OEM optionality.
    - Different product architecture, route economics, and investor base than maritime WIG craft.
  - - Aurora Innovation
    - Public market cap and enterprise value
    - $11.68B market cap; $10.55B enterprise value as of Aug. 28, 2026
    - Shows the premium public markets can place on regulated autonomy and long-duration commercialization narratives.
    - Truck autonomy is not directly comparable to seaglider certification or asset intensity.
  - - Mobileye Global
    - Public market cap and enterprise value
    - $7.29B market cap; $5.85B enterprise value as of Aug. 28, 2026
    - Anchors the value investors may assign to safety, perception, and autonomy credibility.
    - Supplier/software profile is structurally different from a vehicle OEM with route operations.
  - - EHang Holdings
    - Public market cap
    - $0.34B market cap as of Aug. 30, 2026; down sharply year over year
    - Adverse comparable showing how novel-mobility valuations can compress when commercialization confidence weakens.
    - China-specific regulatory and market context differs from Regent's U.S.-led pathway.
  notes: >-
    Public comparable values are snapshots from retained market-data pages around the run date and should be used as
    valuation fences, not as direct marks for Regent. Regent's private, pre-service, maritime-specific status warrants
    a discount to cleaner public references.
