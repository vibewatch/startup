  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-money-valuation
    missingEvidence: Exact August 2026 post-money valuation, liquidation preferences, anti-dilution provisions, and option-pool refresh.
    whyItMatters: A valuation chapter cannot responsibly issue a conviction buy without knowing the actual entry price and downside protections.
    diligencePath: Request the executed term sheet, board financing memo, and counsel summary of the round.
    relatedQuestionRefs:
    - QV004
    - QV025
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Erebor debt size by tranche, maturity, collateral, amortization, covenant package, and any milestone-linked restrictions.
    whyItMatters: Debt can subordinate new equity and materially change the downside in delay scenarios.
    diligencePath: Review the credit agreement and management's internal cash-runway model.
    relatedQuestionRefs:
    - QV005
    - QV025
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: order-book-quality
    missingEvidence: Deposit coverage, cancellation rights, customer concentration by value, and delivery sequencing for the largest backlog accounts.
    whyItMatters: Backlog headline value is not a reliable valuation input unless it converts into durable collectible demand.
    diligencePath: Review the top customer contracts and monthly pipeline conversion reporting.
