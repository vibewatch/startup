slug: regent-craft
runDate: '2026-08-31'
company:
  name: Regent Craft
chapter:
  number: 8
  title: Valuation
  summary: >-
    Regent looks more credible operationally than many concept-stage mobility startups, but the public file still does
    not support a conviction buy because the most important valuation input is missing: a disclosed post-money price for
    the August 2026 $240 million Series B. The correct stance on public evidence is research-more with medium confidence,
    high risk, and price discipline anchored to milestones rather than backlog headlines. Scenario analysis supports a
    wide implied valuation range of roughly $0.8-1.5 billion bear, $1.8-3.0 billion base, and $3.5-5.5 billion bull,
    with first human flight, certification progress, launch-partner conversion, and financing durability as the gating
    variables.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline should stay evidence-sensitive
  body: >-
    Regent has now cleared the threshold from concept story to serious industrial program. The company has raised a large
    August 2026 round, completed a 255,000-square-foot manufacturing facility, articulated a clear late-2027 delivery
    target, and assembled visible launch, airline, cargo, offshore, and defense relationships. Those facts support a live
    investment file rather than a speculative watchlist entry. They do not, however, justify a buy recommendation on public
    evidence alone. The decisive gap is valuation transparency. Public sources confirm the size and structure of the Series
    B but not the post-money valuation, liquidation preferences, anti-dilution terms, debt covenants, or deposit quality
    behind the order book. Without those inputs, the right recommendation is research-more rather than buy, and the right
    pricing posture is milestone-gated rather than narrative-led. Recommendation summary table TV001 and thesis / anti-thesis
    table TV002 convert that stance into an IC-ready frame, while recommendation logic figure FV001 shows why the combination
    of strong proof on demand and manufacturing but weak proof on price and downside protection leads to a conditional,
    evidence-sensitive view instead of a conviction mark.
  claimRefs:
