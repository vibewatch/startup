- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Anti-thesis
  - What would change the view
  rows:
  - - Regent has uncommon demand proof for a pre-service mobility startup.
    - Backlog quality, deposits, and cancellation rights remain undisclosed.
    - Review top-customer contracts, deposits, and amendment history.
  - - Factory completion and new funding raise the odds of real commercialization.
    - Factory readiness does not equal repeatable output, yield, or reliability.
    - Inspect throughput plans, QA metrics, and supplier readiness reviews.
  - - The seaglider product is differentiated across passenger, cargo, offshore, and defense use cases.
    - A broad mission set can also dilute focus and increase certification complexity.
    - Confirm program prioritization and route-specific launch sequencing.
  - - Named launch partners create visible first-service pathways.
    - Narrative concentration around a few launch proofs can exaggerate near-term revenue readiness.
    - Obtain route, vessel-count, and launch-readiness dashboards from operators.
  - - New debt plus equity shows external confidence in the program.
    - Debt terms may create senior claims or milestone pressure not visible publicly.
    - Review Erebor covenants, collateral, and maturity structure.
  - - Public comps show investors will pay for regulated mobility optionality.
    - Public comps are more liquid, more disclosed, and often farther along on certification or revenue proof.
    - Apply a private-company and execution discount until Regent discloses more.
  notes: Thesis pairs are designed to stress-test the investment case rather than summarize management messaging.
