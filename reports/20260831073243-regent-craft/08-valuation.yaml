- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Human flight or certification slips materially; launch partners defer; financing reopens before delivery proof.
    - Implied valuation range compresses to about $0.8-1.5B on heavy execution and dilution discounts.
    - Schedule slip, debt pressure, weak contract quality, or a softening launch roster.
    - Adverse media persists, milestones miss, and no price anchor emerges.
  - - Base
    - Human flight clears, certification pathway advances, late-2027 delivery target remains plausible, and first operators stay engaged.
    - Implied valuation range sits around $1.8-3.0B with a private-company discount to stronger public comps.
    - Reliability metrics stay private, cap table terms remain partly opaque, and multi-route ramp stays slow.
    - Milestones continue on time and the next financing clears without visible distress.
  - - Bull
    - Regent converts flagship partners into operating launches, demonstrates factory discipline, and shows credible reliability data.
    - Implied valuation range expands to about $3.5-5.5B as milestone probability rises and discount narrows.
    - Public markets for mobility remain volatile and certification can still widen timelines.
    - Multiple launch geographies progress together and backlog converts into visible deliveries.
  notes: Scenario values are author-coded probability-weighted private-market ranges, not company-disclosed valuations.
