tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Strong operating momentum but public valuation, preference, and debt-term visibility are insufficient for a buy.
    - Keep Regent in the active funnel but do not underwrite an entry price from headline momentum alone.
  - - Confidence
    - Medium
    - Manufacturing, funding, and customer-intent proof are real, but price support is incomplete.
    - Re-rate upward only after private financing and contract-quality data are reviewed.
  - - Risk rating
    - High
    - Certification, reliability, concentration, and capital-stack opacity still dominate downside.
    - Use milestone gates and explicit kill triggers.
  - - Valuation stance
    - Unsupported on public evidence
    - The August 2026 round size is known; the post-money valuation is not.
    - Avoid price commitments until a disclosed or diligenced anchor exists.
  - - Hold / review window
    - 12-24 months
    - Key catalysts are first human flight, certification progress, and late-2027 delivery readiness.
    - Track milestones through 2027 before changing posture.
  notes: Recommendation fields are author-coded from public evidence and explicitly price-sensitive.
