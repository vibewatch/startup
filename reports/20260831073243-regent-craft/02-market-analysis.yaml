  evidenceGaps:
  - type: missing-source
    severity: material
    topic: third-party market sizing
    missingEvidence: Independent market studies that isolate 50-200 mile coastal passenger, freight, and offshore demand in a way that maps directly to Regent's range envelope.
    whyItMatters: Most quantitative demand signals currently come from Regent-authored surveys or disclosed backlog rather than neutral market analysts.
    diligencePath: Collect route-level ferry, airline, and harbor throughput data for the top candidate geographies and build a bottoms-up market model.
    relatedQuestionRefs:
    - QM007
    - QM024
  - type: private-evidence-only
    severity: material
    topic: operator economics
    missingEvidence: Actual delivered route economics, load factors, and operating-cost results from pilot customers or trial operators.
    whyItMatters: The market thesis is strongest where time and cost improve simultaneously, but public evidence remains pre-service and modeled.
    diligencePath: Request pilot economics, ticket-price assumptions, and operating-cost comparisons from launch operators and offshore partners.
    relatedQuestionRefs:
    - QM017
    - QM020
    - QM025
  - type: missing-source
    severity: minor
    topic: community adoption
    missingEvidence: Independent community surveys or public consultation records beyond Regent's own research in Hawaii and other early markets.
    whyItMatters: Community acceptance can shape route approvals and infrastructure deployment even when operator interest is strong.
    diligencePath: Pull local hearing records, feasibility studies, and third-party survey work from Hawaii, Japan, and other route candidates.
    relatedQuestionRefs:
    - QM010
    - QM011
    - QM023
  - type: missing-source
    severity: material
    topic: route approval timing
    missingEvidence: Primary regulator or port-authority documents for route-specific approval pathways in early deployment geographies.
    whyItMatters: Market demand alone does not create service revenue; route approval timing determines when demand can actually convert.
    diligencePath: Request Coast Guard, state DOT, harbor, and local permitting documents for named launch corridors.
    relatedQuestionRefs:
    - QM019
    - QM020
