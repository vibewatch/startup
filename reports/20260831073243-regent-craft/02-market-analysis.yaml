tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or workflow
  - Excluded spend or substitute edge
  - Buyer / payer
  - Why Regent is relevant
  rows:
  - - Short-haul coastal passenger travel
    - Tickets and operations for 50-200 mile coastal trips
    - Long-haul aviation and inland transit
    - Ferry operators, airlines, tourism operators, local transport stakeholders
    - Viceroy range and dock-based boarding directly address these routes.
  - - Inter-island passenger mobility
    - Island-hopping transport where airport friction is high
    - Transoceanic service and inland commuter rail
    - Regional airlines, local operators, public-sector transport bodies
    - Hawaii materials frame seagliders as affordable, accessible, renewable inter-island transport.
  - - Coastal freight and middle-mile cargo
    - Time-sensitive regional cargo and parcel movement along coasts
    - Deep-sea container shipping and long-haul air freight
    - Logistics operators and freight carriers
    - DHL and Yamato examples show seagliders as a multimodal network extension.
  - - Offshore energy personnel transfer
    - Crew movement to rigs and offshore assets
    - Blue-water shipping and heavy-lift logistics
    - Energy logistics operators
    - ADNOC is testing the vehicle against helicopter economics and emissions.
  - - Defense littoral logistics
    - Troop, cargo, ISR, medevac, and launched-effects mobility over water
    - Land warfare logistics and strategic airlift
    - Defense organizations and government buyers
    - Regent positions the platform for distributed maritime operations.
  notes: Rows define the nearer market boundary rather than a full theoretical transportation TAM; excluded spend clarifies where Regent is not directly competing.
