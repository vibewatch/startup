chapter:
  number: 2
  title: Market Analysis
  summary: Regent Craft is not trying to sell into a generic aviation TAM; the nearer-market wedge is 50-200 mile coastal passenger, freight, offshore, and defense routes where roads are congested, docks already exist, and speed matters more than cruise altitude. Retained sources support a strong demand thesis — more than 1 billion passengers on seaglider-capable routes, global and U.S. survey evidence favoring cost and convenience, and concrete buyer pilots in Hawaii, Japan, the Middle East, and U.S. coastal launch corridors. The main market constraints remain certification timing, infrastructure coordination, and the fact that signed interest still materially exceeds in-service proof.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, substitutes, and what Regent is actually selling into
  body: 'Regent''s addressable market is best defined as regional coastal mobility rather than aviation in the broadest sense. The company''s own research centers on trips of roughly 50 to 200 miles, which aligns with the current Viceroy range envelope and naturally emphasizes over-water or coast-hugging routes where highways are congested, airports are inconvenient, or ferry service is slow. That boundary matters because it identifies both the included spend and the status quo substitutes. Regent is not primarily attacking long-haul aviation, inland rail, or deep-sea cargo shipping. It is targeting short-haul coastal passenger trips, inter-island freight, offshore crew transfer, and defense littoral logistics. The strongest substitute evidence comes from Regent''s survey work: on these routes, most people still travel by car or other road modes, with smaller shares using air, rail, or water. In other words, the market is broader than ferries alone. The buyer decision is not seaglider versus
    airplane in isolation; it is seaglider versus the combined inconvenience, cost, and time penalties of incumbent road, ferry, and short-haul flight options.'
  claimRefs:
