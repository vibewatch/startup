callouts:
- calloutType: insight
  title: The biggest substitute is not the ferry terminal but the private car
  body: Regent's own survey work suggests short coastal trips are still dominated by road travel, which means the company wins by improving door-to-door convenience rather than by merely being a greener ferry.
  claimRefs:
  - CM005
  - CM006
  - CM037
- calloutType: strength
  title: Buyer discovery risk is lower than in many new mobility categories
  body: Hawaii, Japan, DHL, ADNOC, and The Twenty Five all show that operators can already see where the seaglider fits into real passenger, cargo, offshore, and defense workflows.
  claimRefs:
  - CM019
  - CM023
  - CM025
  - CM040
  - CM043
- calloutType: risk
  title: Commercial interest still outruns operational proof
  body: The order book and partner ecosystem are strong demand signals, but service launch still depends on certification, route approvals, and delivery execution that have not yet fully converted into live recurring service.
  claimRefs:
  - CM031
