- id: evidence-constrained-sizing
  title: 'Evidence-constrained sizing: demand floors are clearer than top-down TAM'
  body: 'The retained evidence does not justify a heroic top-down trillion-dollar mobility TAM. It does justify several bounded sizing lenses. Regent''s global survey says more than 1 billion passengers already travel routes that a seaglider could serve, while the same analysis notes that ferries and planes each carry about 4 billion passengers per year. Those are market-boundary and substitution facts, not revenue forecasts, but they establish that the trip pool is non-trivial. The clearest commercial floor is Regent''s own disclosed order-book progression: more than $7.5 billion in orders by January 2023, $9 billion by the end of 2024, and more than $10 billion by March-June 2026. That is not TAM; it is better interpreted as an early SOM floor or proof that operators across geographies are willing to sign up for the category before broad service launch. Geography-specific lenses reinforce that point. Hawaii route studies surfaced a $30 one-way fare estimate on selected inter-island routes,
    Japan analysis suggests 25 million annual passenger opportunities, and offshore energy buyers like ADNOC are testing whether seagliders can displace helicopter economics on crew transport. Together these lenses support a real market, but not a clean single-number TAM.'
  claimRefs:
  - CM008
  - CM009
  - CM013
