- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Congested short-haul coastal travel
    - driver
    - Current
    - Creates demand for faster door-to-door alternatives
    - Prioritize routes where road or airport friction is structurally high.
  - - Existing dock infrastructure
    - driver
    - Current
    - Reduces infrastructure burden relative to new-runway or vertiport concepts
    - Validate port modification capex by route.
  - - Consumer focus on convenience, comfort, and cost
    - driver
    - Current
    - Market will switch for utility, not for novelty alone
    - Test ticket-price parity and total travel time assumptions.
  - - Corporate decarbonization goals in logistics
    - driver
    - 2025-2030
    - Supports cargo pilots if service quality is maintained
    - Quantify emissions and reliability gains for shippers.
  - - Financing and charging partners
    - driver
    - Current
    - Can lower adoption friction for operators
    - Confirm who funds vessels, docks, and charging on first routes.
  - - Certification and route approvals
    - constraint
    - Current to launch
    - Delays commercialization if Coast Guard and local approvals slip
    - Track design-basis, inspection, and route-specific approval milestones.
  - - Incumbent operator relationships
    - constraint
    - Persistent
    - Ferry and marine operators own routes, docks, and customer trust
    - Map partner incentives and revenue-share terms.
  - - Pre-service execution gap
    - constraint
    - Persistent until launch
    - Orders and MOUs exceed delivered proof today
    - Monitor pilot-to-delivery conversion and on-time entry into service.
  notes: Rows mix demand-side pull factors with operator, infrastructure, and regulatory constraints that determine timing.
