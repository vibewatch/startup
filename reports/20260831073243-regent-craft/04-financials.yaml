  title: The public file still does not support a real runway or margin model
  body: No retained source discloses cash on hand, burn, gross margin, deposit coverage, or debt terms, so the Series B improves confidence without eliminating underwriting blindness.
  claimRefs:
  - CI028
  - CI029
  - CI030
