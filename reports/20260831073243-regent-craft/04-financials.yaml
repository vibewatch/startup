- id: financial-verdict-and-diligence-blockers
  title: Financial verdict, revenue quality, and unresolved diligence blockers
  body: >-
    Financially, Regent currently looks like a demand-validated but still pre-revenue
    manufacturing company rather than a business with demonstrated revenue quality.
    The order book matters because it shows cross-continental customer interest and
    can support supplier, financing, and hiring confidence, but backlog is not the
    same thing as revenue and public materials do not disclose deposit size, cancellation
    rights, delivery sequencing, or how much of the order book is tied to firm purchase
    agreements versus lighter-weight commitments. Certification progress with the
    Coast Guard and Lloyd's Register is strategically important because it governs
    when backlog can convert into cash receipts. The same is true for named launch
    partners such as The Twenty Five, Mokulele-related Hawaii efforts, DHL, and ADNOC:
    they improve credibility, but they do not substitute for audited revenue, margin,
    or cash conversion data. The correct investment posture is therefore not that
    Regent lacks demand, but that its revenue quality and margin path remain unproven
    in public. The next step in diligence is to convert backlog, factory, and financing
    momentum into a cash-flow model built on deposits, bill of materials, labor productivity,
    warranty, and debt terms.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI026
  - CI027
