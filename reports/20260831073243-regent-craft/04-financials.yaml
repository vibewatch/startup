- calloutType: recommendation
  title: Underwrite backlog conversion, not backlog headline value
  body: The next diligence step is to test how much of the order book is backed by deposits, cancellable MOUs, delivery sequencing, and financing support, because those variables determine whether the factory becomes a high-quality revenue engine or a cash sink.
