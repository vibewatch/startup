  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-cost-drivers
  title: Unit economics and cost drivers are visible only in fragments
  body: >-
    The public record gives several directionally useful cost signals without disclosing
    Regent's internal unit economics. The Viceroy page and FAQ repeatedly emphasize
    lower operating and maintenance costs from all-electric propulsion, and Regent's
    dock-based deployment thesis reduces airport or vertiport build-out requirements
    for launch markets. ADNOC L&S adds the strongest external economic proof point:
    in offshore logistics it said Regent's seaglider could reduce operating costs
    by up to 80% versus helicopters. Hawaii feasibility materials added an illustrative
    one-way fare of about $30 on selected inter-island routes, which is useful as
    an operator-side affordability signal but not as Regent revenue guidance. Beyond
    those points, critical underwriting fields remain blank in public sources: aircraft
    ASP, bill of materials, battery replacement cycle, labor content per vessel, gross
    margin by vehicle type, warranty reserve, and working-capital timing. In other
    words, there is enough evidence to argue that operator economics may be attractive
    on some routes, but not enough to underwrite Regent's own gross-margin path with
    confidence.
  claimRefs:
  - CI003
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
