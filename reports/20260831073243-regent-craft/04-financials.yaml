  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Viceroy vessel sales
    - Sale of 12-passenger seagliders to operators
    - Vessel / delivery milestone
    - Commercial backlog disclosed; no public recognized revenue
    - Medium demand quality, low revenue-quality visibility
    - Provide signed contract form, deposit schedule, and revenue-recognition policy.
  - - Monarch program / larger-platform design work
    - Future sale of larger-capacity seagliders plus design-partner work
    - Program milestone / vessel
    - Strategic-design activity disclosed; commercialization later than Viceroy
    - Low current revenue visibility
    - Separate funded engineering payments from future aircraft-style sales.
  - - Squire / defense systems
    - Government contracts and defense product-line commercialization
    - Contract value / milestone
    - USMC contract expansion and defense product line disclosed
    - Higher credibility than generic pipeline, still milestone-dependent
    - Provide contract structure, options, and margin profile by phase.
  - - Aftermarket / maintenance / parts
    - Support, maintenance, and parts tied to delivered fleet and UAE plans
    - Annual service contract / parts sales
    - Implied by UAE JV and launch-operator model; pricing undisclosed
    - Plausible but not publicly quantified
    - Show expected attachment rate and service gross margin.
  - - Training / launch enablement
    - Captain training, route launch, and certification-adjacent support
    - Training seat / operator package
    - Six-week captain program disclosed; monetization not disclosed
    - Early ancillary stream, likely immaterial before entry into service
    - Clarify whether training is included in vessel sale or sold separately.
  notes: Regent's public materials support multiple future revenue streams, but none of the retained sources disclose recognized revenue or realized mix.
