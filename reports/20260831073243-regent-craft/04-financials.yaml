slug: regent-craft
runDate: '2026-08-31'
company:
  name: Regent Craft
chapter:
  number: 4
  title: Financials
  summary: >-
    Regent Craft now has enough publicly disclosed capital to move from prototype work
    into factory ramp, but the public underwriting picture remains incomplete. The
    strongest verified positives are a $240 million Series B split evenly between
    equity and debt, more than $340 million of total funding commitments, a completed
    255,000-square-foot factory, $10 billion-plus of backlog, and a late-2027 first-delivery
    target. The biggest blockers are also clear: no public revenue, cash, burn,
    gross margin, deposit, cancellation, or realized pricing disclosures. Financially,
    Regent still looks like a capital-intensive pre-revenue manufacturer whose order
    book supports demand but not yet revenue quality.
sections:
- id: financial-model-and-monetization
  title: Revenue model and monetization path
  body: >-
    Regent is not presently a direct-to-consumer ticketing company. Its own FAQ says
    operators, not Regent, will set passenger ticket prices, which means Regent's
    primary monetization is best understood as vehicle sales plus adjacent support
    revenues rather than retail fare capture. The Viceroy page and FAQ show a multi-mission
    hardware platform sold into passenger, cargo, offshore, search-and-rescue, and
    defense use cases. The company also signals future service-adjacent revenue streams
    through captain training, aftermarket support, and the UAE manufacturing-and-service
    joint-venture model. Public evidence supports strong commercial intent, but it
    does not yet support recognized revenue, realized pricing, or mix by stream. Hawaii
    materials show why the category can be financeable for operators: Pacific Current
    was positioned as a financing and charging-infrastructure partner, while Regent
    argued that existing dock infrastructure and lower operating costs can help customers
    launch service without building airports or vertiports. That improves customer
    affordability, but it still leaves Regent's own revenue-recognition mechanics
    largely undisclosed.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI036
