    - Realized passenger pricing unknown by route and operator
    - FAQ
    - Regent monetization should not be modeled as direct ticket revenue.
  - - Oʻahu-Maui or Oʻahu-Kauaʻi illustrative fare around $30
    - Route-study estimate, not published fare card
    - Could vary with subsidy, utilization, and financing terms
    - Hawaiʻi Seaglider Initiative materials
    - Useful affordability proxy for operators, not Regent ASP.
  - - Viceroy vessel selling price
    - Not publicly disclosed in retained sources
    - No list price, discount policy, deposits, or escalation formula disclosed
    - Viceroy page / FAQ / company timeline
    - Hardware revenue cannot be tied to order book with precision.
  - - Offshore logistics economics versus helicopters
    - ADNOC L&S says up to 80% lower operating costs
    - Partner trial claim, not a realized contracted rate
    - ADNOC L&S announcement
    - Strong operator-economics signal for one use case.
  - - Defense contract pricing
    - Total disclosed contract values reach $15M, but no per-unit economics
    - Pricing, milestones, options, and margin split undisclosed
    - Series B release / defense releases
    - Defense can bridge demand credibility but not full hardware pricing transparency.
  notes: >-
    Pricing evidence is asymmetric: public materials show affordability logic for
    operators but not Regent's own realized hardware or service pricing.
