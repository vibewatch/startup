- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue recognized to date
    - Impossible to assess traction quality or historical conversion of backlog into sales
    - Request audited 2024-2026 revenue by product and customer segment.
  - - Backlog composition and deposit coverage
    - Cannot distinguish firm purchase agreements from softer reservations or MOUs
    - Review top-20 contracts for deposit size, cancellation rights, and delivery windows.
  - - Cash burn and runway
    - Cannot judge adequacy of the 2026 raise
    - Obtain monthly cash burn, quarterly liquidity bridge, and downside cases.
  - - Gross margin by vehicle family
    - Prevents valuation based on manufacturing learning curve
    - Request standard-cost model, BOM, labor, scrap, and warranty assumptions.
  - - Debt terms from Erebor
    - Unknown leverage burden and covenant risk
    - Review loan agreement, security package, and milestone conditions.
  - - Working-capital cycle
    - Unclear whether deposits fund inventory or factory ramp
    - Request inventory days, supplier terms, customer milestones, and cash-conversion cycle.
  - - Aftermarket and training economics
    - Service upside may be under- or over-stated
    - Obtain forecast attachment rate and gross margin by support stream.
  notes: This table is intentionally null-heavy because the public record does not yet support a full underwriting model.
