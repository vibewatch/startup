  topStrengths:
    - Regent has stronger physical execution proof than many mobility startups, including a completed 255,000-square-foot factory and a large 2026 financing.
    - The company has visible multi-segment demand across passenger, cargo, offshore, and defense use cases rather than a single narrow narrative.
    - The Twenty Five, Ocean Flyer, DHL, ADNOC, and other partners provide real-world launch pathways across multiple geographies and mission types.
  topRisks:
    - The most important valuation input — Regent's actual August 2026 post-money valuation and preference stack — is still undisclosed.
    - Certification, route approvals, and first human flight timing remain the core drivers of whether backlog can convert into revenue on schedule.
    - The capital stack includes debt from Erebor Bank, but public evidence does not disclose covenant or collateral terms.
    - Public evidence on deposits, cancellations, reliability, and operating economics remains too thin for a conviction price call.
  unresolvedGaps:
    - Exact August 2026 post-money valuation, liquidation preferences, anti-dilution terms, and option-pool refresh.
    - Erebor debt terms, including maturity, covenants, collateral, and any milestone-linked restrictions.
    - Deposit-backed order quality, cancellation rights, delivery sequencing, and customer concentration by value.
    - Reliability, maintenance, safety, and early route-economics evidence close to commercial launch.
