companyProfile:
  summary: >-
    Regent Craft is a privately held U.S. maritime-mobility startup building electric seagliders: hydrofoiling
    wing-in-ground-effect vessels designed for fast coastal passenger, cargo, offshore, rescue, and defense use.
    The company was founded in December 2020 by Billy Thalheimer and Mike Klinker. As of the run date it has a
    completed Rhode Island manufacturing facility, more than $340 million of disclosed capital raised across equity
    and debt, a commercial order book spanning six continents, and visible launch-partner proof. The central
    investment limitation is that Regent's latest valuation, cap-table protections, and debt terms remain undisclosed.
  foundedDate: '2020-12-01'
  founders:
    - name: Billy Thalheimer
      role: Co-founder and CEO
      background: MIT-trained engineer and Regent's chief executive leading commercialization and external positioning.
      claimRefs: [CO004, CO005]
    - name: Mike Klinker
      role: Co-founder and CTO
      background: MIT-trained engineer and Regent's technical co-founder leading the product and engineering vision.
      claimRefs: [CO004, CO006]
  foundingLocation: Rhode Island, USA
  headquarters: Providence, Rhode Island, USA
  productSummary: >-
    Viceroy is Regent's flagship 12-passenger electric seaglider; the broader product family also includes the
    defense-oriented Squire and a larger Monarch concept, all built around waterborne hull, hydrofoil, and ground-effect flight.
  customerFocus: Coastal transport operators, ferry and airline partners, offshore-logistics users, cargo operators, and defense stakeholders.
  businessModel: Vehicle sales with potential training, support, aftermarket, and defense-program revenue.
  stage: Series B
  fundingStatus: >-
    Regent announced a $240 million August 2026 Series B split evenly between equity and debt, bringing disclosed
    capital raised to about $340 million. Public sources do not disclose the post-money valuation.
  disclosureProfile: private-undisclosed
