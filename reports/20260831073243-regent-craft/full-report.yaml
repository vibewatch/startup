          - type: callout
            title: Use milestone discipline, not narrative enthusiasm
            body: >-
              Treat human flight, route approvals, customer conversion milestones, and private reliability data as hard
              diligence gates. If those do not progress on schedule, the thesis should de-rate quickly regardless of the
              backlog headline.
