      - number: '3.3'
        title: Pricing, distribution power, and customer-access asymmetry
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is weak across most of the cohort. Regent does not publish a standard vehicle
              ASP or operating-cost sheet in retained public materials. BETA, Electra, Joby, and Wisk likewise
              foreground technology, certification, and partnerships more than open pricing. Candela is comparatively
              more legible on performance economics, publishing the P-12's charging profile and energy-use claims and
              openly framing major operator savings versus conventional vessels. Incumbents also have structural
              distribution advantages. Hornblower already operates across more than 100 ports and destinations; Brittany
              Ferries already owns short-sea customer relationships; Bristow already serves offshore buyers with
              certified aircraft and safety-first workflows. Regent's partner model in Hawaii, The Twenty Five, DHL, and
              ADNOC partially offsets this by piggybacking on operator ecosystems rather than building direct demand
              from scratch. But until deliveries begin, route owners and incumbent operators still have the stronger
              distribution hand.
