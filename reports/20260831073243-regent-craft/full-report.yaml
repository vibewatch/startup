      - number: '7.3'
        title: Partner, customer, and financing dependencies can amplify any execution slip
        blocks:
          - type: paragraph
            body: >-
              Regent's commercial narrative is powered by a handful of highly visible dependencies. The Twenty Five
              anchors the U.S. launch story, Hawaiʻi stakeholders anchor inter-island relevance, Ocean Flyer anchors an
              international operator case, and DHL plus ADNOC anchor non-passenger diversification. These relationships
              are strategically useful, but they raise dependency risk because the narrative value of each may exceed
              its near-term revenue share. Certification advisers, financing partners, and investors add another layer
              of exposure. The 2026 Series B and Erebor debt facility materially improved capital adequacy, yet the
              company still has no public cash, burn, or covenant disclosure. That means investors cannot tell how much
              delay the balance sheet can absorb. If certification or production slips, the transmission mechanism is
              direct: launch partners wait, backlog conversion slows, fixed costs continue, and capital needs rise. Even
              the positive customer breadth in cargo and offshore verticals can become a risk if pilots fail to convert
              into scaled contracts. The public evidence supports diversified interest, but not diversified realized
              cash flow.
            claimRefs:
              - CR020
