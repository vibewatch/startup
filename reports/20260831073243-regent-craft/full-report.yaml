      - number: '2.4'
        title: Drivers, constraints, and why adoption timing still matters
        blocks:
          - type: paragraph
            body: >-
              The demand-side drivers are legible. Consumers in Regent's own surveys prioritize convenience, comfort,
              and cost more than novelty or sustainability, which is exactly the profile of a market ready to switch if
              a new mode materially improves door-to-door utility. Existing dock infrastructure and
              financing-plus-charging partnerships lower adoption friction for operators compared with
              infrastructure-heavy alternatives. Corporate shippers such as DHL add another tailwind because
              decarbonization pressure increasingly matters so long as service quality is preserved. But the market is
              not frictionless. Route approval and certification still gate deployment, as shown by FlightGlobal's
              earlier classification concerns and BBC's reporting that local and regulatory approvals remain
              prerequisites even after order announcements. Incumbent operators also have assets and relationships that
              matter: Hornblower's 250-plus-vessel network and Brittany Ferries' established cross-channel system
              illustrate that Regent must slot into real operating ecosystems, not empty white space. The market case is
              therefore strongest where a buyer has acute time-cost pain, underused waterfront infrastructure, and a
              willingness to coordinate financing, certification, and operations together.
