  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - First human flight timing breaks
        - Material slip beyond management's imminent-flight framing without a revised credible schedule
        - Weakens milestone confidence and delays all downstream delivery assumptions
        - Re-rate valuation range downward and suspend positive scenario weight
      - - Late-2027 delivery path weakens
        - FAQ or partner launch timing moves materially beyond late 2027
        - Pushes backlog conversion and cash-in timing farther out
        - Increase discount rate and treat order-book quality more skeptically
      - - Flagship launch partners defer or resize
        - The Twenty Five or another visible operator pushes launch timing or vessel count lower
        - Raises concentration risk and challenges near-term commercial proof
        - Re-underwrite the customer case before committing new capital
      - - Financing returns before de-risking
        - Regent needs fresh capital before certification and launch proof become visible
        - Suggests burn or capex burden is outrunning milestone conversion
        - Assume dilution / covenant stress and move to a more conservative range
      - - Reliability or safety data remain unavailable near service entry
        - No private or public operating envelope emerges as launch approaches
        - Prevents transition from strategic story to underwritable transport asset
        - Keep recommendation at research-more or downgrade further
    notes: Kill triggers are tied to measurable milestones emphasized repeatedly in retained sources.
    claimRefs:
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - August 2026 cap table
        - Post-money valuation, liquidation preferences, option pool refresh, and anti-dilution terms
        - No public source currently supports Regent's exact price or downside protection structure
        - Request financing deck, term sheet, and counsel summary
      - - Erebor debt package
        - Principal terms, collateral, amortization, maturity, and financial covenants
        - Debt can materially change equity value and downside severity
        - Request credit agreement and lender presentation
      - - Order-book quality
        - Deposits, cancellation rights, delivery sequencing, and customer concentration by value
        - Backlog headline is not the same as collectible demand
        - Review top-10 contracts and board reporting
      - - Certification master schedule
        - Human flight gates, Coast Guard reviews, LR workstreams, and route-approval sequence
        - Timing is the single biggest driver of scenario probability
        - Request program management office tracker and regulator workback
      - - Reliability and safety package
        - Test envelope, maintenance assumptions, dispatch targets, and incident reporting framework
        - Valuation premium is hard to defend without an underwritable operating profile
        - Request engineering and operations diligence session
      - - Factory and supplier readiness
        - Throughput plan, yield targets, QA escapes, and top-supplier concentration
        - Manufacturing quality controls determine whether backlog can convert efficiently
        - Request site visit and supplier scorecards
    notes: These asks define the minimum evidence needed to move from research-more to a priceable investment view.
    claimRefs:
      - CV007
      - CV009
      - CV015
      - CV016
      - CV036
