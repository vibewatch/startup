              rather than a business with demonstrated revenue quality. The order book matters because it shows
              cross-continental customer interest and can support supplier, financing, and hiring confidence, but
              backlog is not the same thing as revenue and public materials do not disclose deposit size, cancellation
              rights, delivery sequencing, or how much of the order book is tied to firm purchase agreements versus
              lighter-weight commitments. Certification progress with the Coast Guard and Lloyd's Register is
              strategically important because it governs when backlog can convert into cash receipts. The same is true
              for named launch partners such as The Twenty Five, Mokulele-related Hawaii efforts, DHL, and ADNOC: they
