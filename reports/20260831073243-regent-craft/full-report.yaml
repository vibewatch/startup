            body: >-
              The August 2026 financing is the most important financial development in the file. Regent disclosed a $240
              million Series B made up of $120 million of equity and $120 million of debt, bringing total capital raised
              or committed to more than $340 million. Management tied that raise directly to full-scale manufacturing,
              certification milestones, first human flight, defense expansion, and customer deliveries. The completed
              255,000-square-foot manufacturing facility in North Kingstown materially changes the company's readiness
              profile: Regent now has a real production site with dedicated assembly, battery and systems installation,
              and water-based test operations. Yet the scale-up is still inherently cash-hungry. The company has
              promised 300 jobs with potential expansion to 750, is staffing finance, manufacturing, supply chain,
              certification, and operations teams, and still expects first deliveries only in late 2027. Debt from
              Erebor helps bridge the factory ramp but also introduces obligations that equity alone would not. Since
              neither cash-on-hand nor monthly burn is publicly disclosed in retained sources, capital adequacy is
