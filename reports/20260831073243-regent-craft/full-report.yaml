  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Regent's recommendation stays at research-more because strong market and execution proof is offset by missing
      price support and high milestone risk.
    data:
      nodes:
        - id: v1
          label: Large order book and customer interest
          description: Demand proof is real but not yet equal to booked cash flow.
        - id: v2
          label: Factory + Series B strengthen credibility
          description: Physical manufacturing and capital access reduce concept risk.
        - id: v3
          label: Certification and launch milestones still pending
          description: Human flight, approvals, and first deliveries remain future catalysts.
        - id: v4
          label: Post-money valuation undisclosed
          description: Price support and downside protection are not public.
        - id: v5
          label: Research-more recommendation
          description: Keep the file active but do not underwrite an entry price yet.
      edges:
        - from: v1
          to: v5
          label: supports upside
        - from: v2
          to: v5
          label: adds credibility
        - from: v3
          to: v5
          label: keeps risk high
        - from: v4
          to: v5
          label: blocks buy call
    approximationNotes: Logic chain is author-coded from retained evidence and explicitly price-sensitive.
    claimRefs:
