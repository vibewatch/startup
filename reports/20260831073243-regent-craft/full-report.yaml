companyProfile:
  summary: >-
    Regent Craft is a privately held U.S. maritime-mobility startup building electric seagliders: hydrofoiling
    wing-in-ground-effect vessels designed for fast coastal passenger, cargo, offshore, rescue, and defense use. The
    company was founded in December 2020 by Billy Thalheimer and Mike Klinker. As of the run date it has a completed
    Rhode Island manufacturing facility, more than $340 million of disclosed capital raised across equity and debt, a
    commercial order book spanning six continents, and visible launch-partner proof. The central investment limitation
    is that Regent's latest valuation, cap-table protections, and debt terms remain undisclosed.
