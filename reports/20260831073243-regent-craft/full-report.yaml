        title: Revenue model and monetization path
        blocks:
          - type: paragraph
            body: >-
              Regent is not presently a direct-to-consumer ticketing company. Its own FAQ says operators, not Regent,
              will set passenger ticket prices, which means Regent's primary monetization is best understood as vehicle
              sales plus adjacent support revenues rather than retail fare capture. The Viceroy page and FAQ show a
              multi-mission hardware platform sold into passenger, cargo, offshore, search-and-rescue, and defense use
              cases. The company also signals future service-adjacent revenue streams through captain training,
              aftermarket support, and the UAE manufacturing-and-service joint-venture model. Public evidence supports
              strong commercial intent, but it does not yet support recognized revenue, realized pricing, or mix by
              stream. Hawaii materials show why the category can be financeable for operators: Pacific Current was
              positioned as a financing and charging-infrastructure partner, while Regent argued that existing dock
              infrastructure and lower operating costs can help customers launch service without building airports or
              vertiports. That improves customer affordability, but it still leaves Regent's own revenue-recognition
              mechanics largely undisclosed.
