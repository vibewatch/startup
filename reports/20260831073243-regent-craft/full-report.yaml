      - number: '7.2'
        title: Operational risk centers on turning promising tests into repeatable safe operations
        blocks:
          - type: paragraph
            body: >-
              Regent's technology story is increasingly specific, but most public proof is still milestone-based rather
              than operational-statistical. The company has shown hull, foil, and subscale flight proof; it has advanced
              sensing, hydrofoiling, and autonomy narratives; and it now has a manufacturing site. Yet the public file
              still lacks dispatch reliability, MTBF, battery-abuse, sensing false-positive, sea-state envelope, or
              maintenance-interval data. That gap matters because new mobility hardware often fails not on concept
              validity but on repeatability at operating tempo. The manufacturing facility reduces one class of risk by
              giving Regent a real production base, but it introduces another: quality drift, tooling, workforce
              training, and supplier execution become central once the company leaves the prototype phase. Squire's
              Rhode Island testing clearance is a useful sign that defense-related experimentation is moving forward,
              but it also highlights that key operational permissions and safety reviews still sit on the critical path.
              Operationally, Regent appears serious and methodical; risk remains high because serious, methodical work
              is still underway.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
