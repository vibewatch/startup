      - number: '3.4'
        title: Moat durability, multi-homing, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Regent's moat claims rest on the conjunction of speed, maritime access, and a supposedly simpler
              certification route than air taxis. That combination is real, but it is not automatically durable. Candela
              can win buyers who do not need 180 mph if lower complexity, DNV-oriented approval, and lower-energy ferry
              economics are enough. BETA, Joby, Wisk, and Electra can win buyers who prefer aviation-native
              infrastructure or who value broader route flexibility over dock access. Incumbents can multi-home or wait.
              A ferry or logistics operator could pilot Regent for one corridor while continuing to run its core network
              on existing vessels or helicopters. FlightGlobal's earlier classification uncertainty and BBC's
