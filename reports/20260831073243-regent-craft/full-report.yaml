      - number: '8.4'
        title: Exit readiness remains early, so final diligence should focus on thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Regent is not yet exit-ready in the conventional late-stage sense because the public record still lacks
              the metrics that allow investors to separate premium-quality backlog from aspirational demand. A strategic
              acquisition is easier to imagine near term than an IPO because defense, maritime, and industrial buyers
              could value the category position before recurring operating history is fully visible; public investors
              typically will not. That does not mean the company should be marked pessimistically by default. It means
              the right final step is targeted diligence on the few variables that most heavily move value: the actual
              cap table and preference stack, Erebor debt terms, deposit-backed order quality, route and certification
              milestone timing, launch-partner readiness, factory throughput, supplier readiness, and first-service
              reliability metrics. Thesis-break and kill triggers table TV005, final diligence asks table TV006, and
              investment KPIs figure FV004 translate those unknowns into a monitoring plan. If human flight, late-2027
              delivery timing, or financing durability break, the file should de-rate quickly. If those three improve
              while price remains disciplined, Regent can graduate from research-more to a real investable opportunity.
            claimRefs:
