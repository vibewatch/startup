      - number: '8.2'
        title: Financing context and public comparables bound the upside, but do not pin the price
        blocks:
          - type: paragraph
            body: >-
              The August 2026 financing matters because it changes both credibility and capital-stack risk. Regent
              disclosed that the round totaled $240 million and combined $120 million of equity with $120 million of
              debt from Erebor Bank. That is a meaningful positive signal because investors and lenders funded the
              transition toward manufacturing, certification, and delivery readiness at the same moment the company
              finished its factory. It is also a warning that future investors may sit behind senior obligations or face
              preference overhang that is not visible in the public record. Public filings and market-data pages for
              Joby, Archer, Aurora, Mobileye, and EHang provide useful valuation fences rather than direct pricing
              matches. Joby and Archer show that pre-scale passenger mobility platforms can trade in
              multi-billion-dollar public bands even before mature profitability. Aurora and Mobileye show that
              regulated autonomy and safety software can sustain large valuations when investors believe the platform
              can scale. EHang shows the downside: novel-mobility public names can also compress sharply when
              commercialization confidence weakens. Comparable valuation table TV004 and valuation sensitivity figure
              FV002 therefore frame Regent as a private, illiquid, maritime-specific mobility company that deserves a
              discount to clean public comparables until certification, delivery cadence, and contract quality become
              observable.
            claimRefs:
              - CV004
