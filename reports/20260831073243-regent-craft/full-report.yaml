      - number: '5.2'
        title: Architecture combines maritime hardware with modern control and perception systems
        blocks:
          - type: paragraph
            body: >-
              Regent's technical articles make the architecture more legible than the landing-page marketing alone. The
              craft operates in three modes — float, foil, and fly — and the company repeatedly argues that the
              combination of hydrofoils and digital flight controls is what makes its seaglider design different from
              older wing-in-ground attempts. The wing article explains that earlier ekranoplan designs traded stability
              for heavy or inefficient configurations, whereas Regent claims modern digital control systems now manage
              instability without sacrificing aerodynamic efficiency. The Viceroy page adds several concrete
              architecture elements: retractable hydrofoils, distributed blown-wing propulsion with 12 redundant
              electric motors, fly-by-wire steering, synthetic vision, radar, forward-looking sonar, and traffic
              advisory systems. The sensing article adds another important layer by describing a large-baseline
              stereo-vision approach from NODAR as a better maritime-perception fit than lidar in glare and spray-heavy
              conditions. Together these disclosures support a differentiated architecture thesis: maritime hull and
              hydrofoils for dock and wave operations, aircraft-like wing efficiency in ground effect, and
              software-assisted sensing and control to bridge the historically unstable parts of WIG flight.
            claimRefs:
