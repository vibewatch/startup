  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct, adjacent, and incumbent substitutes'
        blocks:
          - type: paragraph
            body: >-
              Regent does not face a single clean peer group. The nearest over-water electric alternative is Candela,
              whose hydrofoiling P-12 ferry targets waterborne passenger service with much lower energy use and a more
              traditional vessel-certification frame, but at a far lower speed and shorter range envelope than Regent.
              Adjacent competition comes from regional electric or hybrid aviation companies such as BETA, Electra,
              Joby, and Wisk. These companies attack similar customer pain around short-haul travel time, but they rely
              on airports, vertiports, or aviation certification rather than dock-to-dock coastal infrastructure.
              Incumbent substitutes remain powerful. Bristow already serves offshore energy transportation with a large
              helicopter fleet, while Hornblower and Brittany Ferries demonstrate that established marine operators
              control routes, docks, passengers, and operating know-how. Regent's core strategic question is therefore
              not simply whether its craft is technically novel, but whether that novelty creates a superior wedge
              against each of these competitor classes in real deployment settings.
