              unit economics. The Viceroy page and FAQ repeatedly emphasize lower operating and maintenance costs from
              all-electric propulsion, and Regent's dock-based deployment thesis reduces airport or vertiport build-out
              requirements for launch markets. ADNOC L&S adds the strongest external economic proof point: in offshore
              logistics it said Regent's seaglider could reduce operating costs by up to 80% versus helicopters. Hawaii
              feasibility materials added an illustrative one-way fare of about $30 on selected inter-island routes,
              which is useful as an operator-side affordability signal but not as Regent revenue guidance. Beyond those
              points, critical underwriting fields remain blank in public sources: aircraft ASP, bill of materials,
