        blocks:
          - type: paragraph
            body: >-
              The core regulatory risk is straightforward: Regent is commercializing a vehicle category that does not
              yet have a long operating history or a settled playbook for certification at scale. Regent's FAQ,
              congressional appropriations language, and public policy commentary all point to the Coast Guard as the
              lead U.S. regulator under a maritime pathway, with Lloyd's Register supporting certification and
              international flag-state work. That is positive because it creates an identifiable lane. It is also risky
              because the lane is still being built. FlightGlobal's earlier reporting captured the category ambiguity
              directly, and later BBC and Axios coverage still frame route trials and approvals as necessary steps
              before service. The congressional directive in House Report 119-173 reduces long-term regulatory
              uncertainty by funding Coast Guard certification capacity, but it does not eliminate near-term schedule
              risk or the possibility that design reviews, operator rules, or route-specific approvals take longer than
              management targets. Public evidence does not show major litigation, enforcement, or product-liability
              actions today, but absence of disclosed disputes should be treated as a current observation rather than a
              de-risked legal endpoint.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
