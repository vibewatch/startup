      - number: '3.2'
        title: 'Capability comparison: where Regent is differentiated and where peers are simpler'
        blocks:
          - type: paragraph
            body: >-
              On pure mission geometry, Regent is unusual. The Viceroy is designed for about 12 passengers at roughly
              180 mph over water while using docks rather than runways or vertiports. Candela is slower and
              shorter-range but already optimized around conventional waterborne passenger operations and DNV-oriented
              certification. BETA, Electra, Joby, and Wisk all emphasize very different infrastructure and regulatory
              assumptions. BETA argues from piloted range and national flight-test footprint. Electra argues from
              150-foot takeoff and landing plus a broad preorder book. Joby emphasizes fast, quiet, app-enabled urban
              and regional air-taxi travel with years of FAA work. Wisk is betting on four-passenger autonomy with six
              aircraft generations and a large patent estate. In other words, Regent is not the broadest or the most
              traditionally certifiable platform; it is the platform most directly centered on coastal over-water
              mobility with aircraft-like speed. That is a real differentiation, but it narrows the initial buyer set to
              routes where water access is an advantage rather than a constraint.
