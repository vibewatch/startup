      - number: '1.4'
        title: Regulatory pathway, adverse questions, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              Regent's regulatory story improved materially in 2026 but is not fully closed. Axios and Regent's own
              congressional update both frame the Viceroy as a maritime vehicle overseen primarily by the U.S. Coast
              Guard rather than by the FAA, which is strategically important because it implies a more tailored
              certification path for wing-in-ground craft. Lloyd's Register further confirms that it is advising Regent
              and helping define a design basis agreement with the Coast Guard. Still, adverse evidence matters here.
              FlightGlobal reported in 2023 that U.S. authorities had not yet decided whether the vehicle should be
              treated as an aircraft or a maritime craft, and BBC reporting on UK route concepts underscores that
              route-level regulatory approvals still sit between order announcements and service entry. Those issues are
              why the chapter stops short of calling Regent fully de-risked. The biggest diligence gaps are financial
              rather than visionary: no retained source discloses the 2026 post-money valuation, current recognized
              revenue, or a clean public headcount. Governance visibility is also thin, with a defense advisory-board
              reference but no full public board roster. Regent's identity and momentum are clear; the underwriting
              picture is not yet complete.
