  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments span operators, ecosystem partners, and strategic backers
        blocks:
          - type: paragraph
            body: >-
              Regent's customers are best understood as a layered ecosystem rather than a single buyer archetype. In
              passenger markets, the direct buyer is usually an operator or platform — such as The Twenty Five,
              Mokulele, or Ocean Flyer — while the end user is a traveler and the economic payer is a mix of operator
              capital, route revenue, and in some markets public infrastructure or financing partners. Hawaiʻi is the
              clearest example: the HSI coalition includes airlines, cargo players, community groups, and transportation
              agencies because the seaglider proposition touches passenger access, freight affordability, and resilience
              at the same time. In Japan, the relevant customer surface extends beyond one airline to a broader mix of
              aviation, shipping, logistics, and tourism stakeholders. Regent's cargo and offshore opportunities have
              different buyers altogether: DHL is evaluating coastal logistics use cases, while ADNOC L&S is testing
              offshore personnel transfer. This diversity is a strategic strength because it broadens the adoption
              surface, but it also means conversion dynamics, contract terms, and concentration risk will differ sharply
              by segment.
            claimRefs:
