      - number: '8.3'
        title: Bull, base, and bear cases should be underwritten from milestones rather than slogans
        blocks:
          - type: paragraph
            body: >-
              Regent's scenario spread is wide because the company has unusually strong demand and ecosystem evidence
              for a startup that still lacks a disclosed valuation anchor. The bear case assumes that first human flight
              and certification slip, flagship launch partners defer commercial rollout, and the mixed equity-plus-debt
              capital stack proves less durable than the order-book headline implies. In that case, Regent could still
              be strategically interesting yet worth only a heavily risk-discounted private mark. The base case assumes
              first human flight is completed, certification continues advancing, the late-2027 delivery target remains
              plausible, The Twenty Five and selected non-passenger partners progress from pilot narratives into
              contracted deployment, and the next round clears without visible distress; that supports a
              low-single-digit billion valuation range, but still one materially below premium public autonomy comps.
              The bull case requires something stronger: repeated proof that Regent can convert backlog into deliveries,
              show a credible reliability envelope, and open more than one launch geography without losing schedule
              control. Bull / base / bear scenario table TV003 and valuation / return range figure FV003 keep the
              analysis explicit: the recommended stance improves only when milestone probability and price transparency
              improve together.
            claimRefs:
              - CV010
              - CV011
              - CV012
