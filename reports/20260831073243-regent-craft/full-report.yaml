      - number: '7.4'
        title: Execution talent and measurable kill criteria should govern diligence discipline
        blocks:
          - type: paragraph
            body: >-
              The people risk is not merely whether Regent can hire; it is whether it can synchronize certification
              talent, manufacturing leadership, operations crews, defense relationships, and safety governance fast
              enough for a new category. The careers page shows that the company knows these functions matter, but
              public materials do not disclose depth by team, attrition, safety-review cadence, or the internal handoffs
              between engineering, certification, and operations. The right response is therefore to define measurable
              kill criteria. If first human flight materially slips, if customer-route approvals fail to progress, if no
              public reliability envelope emerges, if flagship launch partners delay, or if financing needs recur before
              first deliveries, the thesis should weaken quickly. Regent deserves credit for building real assets and
              advancing a real pathway; it does not deserve a free pass from milestone discipline.
