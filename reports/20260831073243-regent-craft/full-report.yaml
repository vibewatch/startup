              - CV014
          - type: callout
            title: The missing post-money valuation is the central valuation problem
            body: >-
              Public evidence supports company quality better than it supports entry price. Without the round valuation,
              preference stack, debt terms, or deposit quality, the downside cannot be priced tightly.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
