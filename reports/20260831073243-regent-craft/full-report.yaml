              milestones. The company moved from a quarter-scale demonstration flight in 2022 to full-scale sea trials
              and hydrofoiling work, kicked off a 2026 test campaign, completed its first manufacturing facility, and
              raised a much larger Series B to support production and certification. That sequence gives the product
