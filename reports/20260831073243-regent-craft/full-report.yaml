  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in operator workflow terms
        blocks:
          - type: paragraph
            body: >-
              Regent is delivering a maritime mobility system rather than a single tourism craft. The Viceroy page and
              FAQ frame the current commercial product as a 12-passenger, all-electric seaglider that can also be
              configured for cargo, offshore logistics, search and rescue, and defense missions. The operator workflow
              is intentionally familiar: passengers or cargo board at a dock, the craft departs on its hull, transitions
              to hydrofoils outside crowded harbor areas, then flies in ground effect over open water. That operating
              flow matters because it explains why Regent keeps emphasizing existing dock infrastructure and maritime
              captains instead of airport gates, runways, or vertiports. The product family is broader than Viceroy
              alone. FAQ and defense materials describe a hybrid/autonomous Viceroy variant, the Squire autonomous
              drone, and a 100-passenger Monarch roadmap. In customer terms, Regent is selling faster harbor-to-harbor
              mobility with lower infrastructure burden; in technical terms, it is packaging hydrodynamics, electric
              propulsion, sensing, and flight-control software into one operator-facing vessel system.
            claimRefs:
