            body: >-
              The company page dates Regent Craft's founding to December 2020 and names Billy Thalheimer and Mike
              Klinker as co-founders. Retained 2026 company statements consistently identify Billy Thalheimer as chief
              executive officer and Mike Klinker as chief technology officer, reinforcing a founder-led operating
              structure. Public visibility into the broader executive bench is thinner: the careers and newsroom
              surfaces describe functional teams, but they do not publish a normalized current management roster or a
              standard board of directors page. Capital formation, by contrast, is comparatively well documented. Regent
              says it completed a $60 million Series A in October 2023, then closed a $240 million Series B on August
              27, 2026. The Series B is described consistently across Regent, AeroTime, eVTOL Insights, and Crunchbase
              News as a 50-50 split between equity and debt. Mare Liberum and AE Ventures co-led the equity portion and
              Erebor Bank provided the debt facility, while existing backers including Founders Fund, Caffeinated
              Capital, Lockheed Martin Ventures, Japan Airlines, and Giant Step Capital also participated. The result is
              a more institutionally legible cap-table narrative than many hard-tech transport startups have at this
              stage, even though the run did not surface an actual post-money valuation or a cap-table document that
              would let an outside investor quantify dilution and control.
