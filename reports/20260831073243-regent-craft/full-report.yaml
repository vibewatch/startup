      - number: '2.3'
        title: Buyers, users, payers, and adoption pathways by segment
        blocks:
          - type: paragraph
            body: >-
              The buyer map is diversified even if the vehicle is singular. In passenger travel, the user is the
              traveler but the buyer is usually an operator, airline affiliate, tourism company, or public
              transportation stakeholder deciding whether a new route can fill a gap left by roads, airports, or
              ferries. Hawaii shows this clearly: local government, Hawaiian and Alaska ecosystem partners, Mokulele,
              community groups, and infrastructure players all participate because seagliders touch passenger access,
              freight affordability, and resiliency at the same time. In Japan the ecosystem looks different but the
              logic is similar: shipping, aviation, tourism, and logistics players all matter because coastal mobility
              is a cross-sector problem. Cargo buyers care less about novelty than about time, emissions, and network
              fit, which is why DHL is testing seagliders as an extension of regional logistics rather than as a
              stand-alone product category. Offshore energy buyers focus on safety, efficiency, and crew-transfer
              economics, making ADNOC a different but still highly logical early adopter. The market is therefore
              multi-buyer and multi-payer, with the strongest early adoption path running through institutional
              operators rather than direct consumer retail demand.
