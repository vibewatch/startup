            body: >-
              Regent's public record is strongest on process and pathway, weaker on measured outcomes. The FAQ, careers
              page, and sensing article all emphasize safety as the company's core value and describe certification,
              testing, and operations as separate functions. The company says the U.S. Coast Guard is the primary
              regulator under 46 C.F.R. Subchapter T, that maritime captains will receive seaglider-specific type
              ratings, and that captain training will run for six weeks across coursework, classroom instruction,
              simulation, and in-vessel training. Lloyd's Register is advising on the maritime certification path,
              including design-basis and international flag-state work, while Congress has explicitly directed Coast
              Guard capacity-building for WIG inspection and certification. These are meaningful governance and safety
              controls, but they are not the same as published dispatch reliability, mean-time-between-failure, incident
              rates, or battery-abuse test results. Public trust therefore rests on visible seriousness, partner
              quality, and step-by-step test progression more than on disclosed statistical reliability.
