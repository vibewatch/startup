        title: Exhibits
        blocks:
          - type: callout
            title: Regent has already built visible mitigations for its biggest risks
            body: >-
              The company is not treating certification, testing, and manufacturing as abstract future tasks; it has
              built dedicated teams, a factory, public regulator engagement, and named partner pathways that directly
              target the highest-risk areas.
