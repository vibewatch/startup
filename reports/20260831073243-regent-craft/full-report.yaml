  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes, and what Regent is actually selling into
        blocks:
          - type: paragraph
            body: >-
              Regent's addressable market is best defined as regional coastal mobility rather than aviation in the
              broadest sense. The company's own research centers on trips of roughly 50 to 200 miles, which aligns with
              the current Viceroy range envelope and naturally emphasizes over-water or coast-hugging routes where
              highways are congested, airports are inconvenient, or ferry service is slow. That boundary matters because
              it identifies both the included spend and the status quo substitutes. Regent is not primarily attacking
              long-haul aviation, inland rail, or deep-sea cargo shipping. It is targeting short-haul coastal passenger
              trips, inter-island freight, offshore crew transfer, and defense littoral logistics. The strongest
              substitute evidence comes from Regent's survey work: on these routes, most people still travel by car or
              other road modes, with smaller shares using air, rail, or water. In other words, the market is broader
              than ferries alone. The buyer decision is not seaglider versus airplane in isolation; it is seaglider
              versus the combined inconvenience, cost, and time penalties of incumbent road, ferry, and short-haul
              flight options.
