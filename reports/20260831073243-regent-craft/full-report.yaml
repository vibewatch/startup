        title: Exhibits
        blocks:
          - type: callout
            title: Regent is investable enough to stay in the funnel
            body: >-
              The combination of funding, factory completion, named launch pathways, and multi-segment demand means
              Regent has moved well beyond a slideware mobility narrative.
            calloutType: strength
            claimRefs:
              - CV004
              - CV005
              - CV012
