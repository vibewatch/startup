            title: The category can still fail on timing even if the concept works
            body: >-
              The public evidence supports technical seriousness and demand, but it also shows that certification, route
              approvals, reliability proof, and funding still need to line up in sequence. A slip in one can impair all
              four.
            calloutType: risk
