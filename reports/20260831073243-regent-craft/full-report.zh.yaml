      - CU011
      - CU016
      - CU021
      - CU024
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 客户验证在具名合作方和战略契合度上最强，生产成熟度和留存可见度较弱。
