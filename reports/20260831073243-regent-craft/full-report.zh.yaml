companyProfile:
  summary: >-
    Regent Craft 是一家美国私营海事出行初创公司，正在打造电动海上滑翔器：一种水翼、地效翼船艇，面向高速沿海客运、 货运、离岸作业、救援和防务场景。公司由 Billy Thalheimer 和 Mike Klinker 于
    2020 年 12 月创立。截至本报告运行日， 公司已建成 Rhode Island 制造工厂，披露的股权和债务融资合计超过 $340 million，商业订单横跨六大洲， 也有可见的启动合作伙伴证明。核心投资限制在于 Regent
    最新估值、股权结构表保护条款和债务条款仍未披露。
