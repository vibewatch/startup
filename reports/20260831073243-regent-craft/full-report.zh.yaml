      - number: '8.2'
        title: 融资背景和公开可比公司限定上行，但不能锚定价格
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月融资很重要，因为它同时改变可信度和资本结构风险。Regent 披露，本轮总额 $240 million，由 $120 million 股权和 Erebor Bank 提供的 $120
              million
              债务组成。这是有意义的正面信号：公司刚完成工厂，投资人和贷款人就在同一时间为制造、认证和交付准备阶段提供资金。它也是警示：未来投资人可能排在优先债务之后，或面对公开记录看不见的优先股堆叠压力。Joby、Archer、Aurora、Mobileye
              和 EHang 的公开申报与市场数据页提供的是估值护栏，而不是直接定价样本。Joby 和 Archer 说明，尚未规模化的客运出行平台即便没有成熟盈利，也可能在公开市场获得数十亿美元估值区间。Aurora 和
              Mobileye 说明，只要投资人相信平台能规模化，受监管的自主驾驶和安全软件可以支撑大额估值。EHang 则给出下行案例：商业化信心变弱时，新型出行上市公司也会快速压缩。可比估值表 TV004 和估值敏感性图
              FV002 因此把 Regent 定位为一家私有、非流动、专注海上场景的出行公司；在认证、交付节奏和合同质量可观察之前，它相对干净的公开可比公司应有折价。
