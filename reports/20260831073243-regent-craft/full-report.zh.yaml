      - number: '5.4'
        title: 成熟度正从原型证明走向制造，但依赖项仍在
        blocks:
          - type: paragraph
            body: >-
              Regent 已积累技术和工业里程碑，路线图现在更容易拆解。公司从 2022 年四分之一比例演示飞行，推进到全尺寸海试和水翼工作， 启动 2026 年测试活动，完成第一座制造设施，并完成规模大得多的 Series
              B，以支持生产和认证。 这条顺序让产品成熟度叙事有了真实形状：概念、缩比证明、全尺寸水上过渡测试、制造准备度， 然后是目标在 2027 年末的首批客户交付。主要依赖项同样清楚。产品就绪仍取决于 Coast
              Guard 和 Lloyd's 路径执行、 成功载人飞行及进一步船体到水翼到飞行验证、公开网站未披露的供应商选择，以及公司能否把跨学科招聘计划转成可靠生产质量。 相较空中出租车同行，Regent
