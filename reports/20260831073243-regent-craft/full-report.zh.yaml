  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律姿态在改善，但仍是最大闸门风险
        blocks:
          - type: paragraph
            body: >-
              核心监管风险很直接：Regent 正在商业化一种没有长期运营历史、也没有成熟规模化认证剧本的载具品类。Regent 的 FAQ、 国会拨款语言和公共政策评论都指向 Coast
              Guard，将其视为海事路径下的美国主要监管方，Lloyd's Register 则支持认证和国际船旗国工作。这是正面信号，因为它创造了一条可识别路径；但也有风险，因为这条路径仍在建设中。
              FlightGlobal 早前报道直接捕捉到品类模糊性，后续 BBC 和 Axios 报道仍把航线试验和批准列为服务前必要步骤。 House Report 119-173 中的国会指令通过资助 Coast
              Guard WIG 检验和认证能力，降低了长期监管不确定性， 但没有消除短期排期风险，也没有排除设计审查、运营商规则或特定航线批准耗时超过管理层目标的可能性。
              公开证据今天没有显示重大诉讼、执法或产品责任行动；但未披露争议只能视为当前观察，不能当作法律风险已消除的终点。
