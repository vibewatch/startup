        title: 财务结论、收入质量和未解尽调卡点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Regent 眼下更像一家需求已验证、但仍处于收入前阶段的制造公司，而不是已经证明收入质量的业务。
              订单储备重要，因为它显示跨洲客户兴趣，也能支撑供应商、融资和招聘信心；但积压订单不等于收入，公开材料也没有披露定金规模、 取消权、交付顺序，或订单储备中有多少来自确定采购协议、多少只是更轻量承诺。Coast
              Guard 和 Lloyd's Register 的认证进展有战略意义，因为它决定积压订单何时能转成现金回款。The Twenty Five、Mokulele 相关 Hawaii 工作、 DHL 和 ADNOC
              等具名启动伙伴也一样：它们提高可信度，但不能替代经审计收入、利润率或现金转化数据。 正确投资姿态不是说 Regent 没有需求，而是公开证据尚未证明收入质量和利润率路径。下一步尽调应把积压订单、
              工厂和融资势头转成现金流模型，模型要建立在定金、物料清单、劳动生产率、质保和债务条款之上。
