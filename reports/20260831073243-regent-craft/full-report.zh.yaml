  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Regent 的典型客户旅程从生态接触和可行性研究起步，走到下单意向、基础设施协调、交付，最后才是航线扩张。
    data:
      nodes:
        - id: discover
          label: 发现 / 市场兴趣
        - id: evaluate
          label: 可行性、航线和生态研究
        - id: contract
          label: 订单、MOU 或战略投资
        - id: prepare
          label: 认证、融资、基础设施协调
        - id: deploy
          label: 首次交付 / 首发航线
        - id: expand
          label: 复购 / 多航线扩张
    approximationNotes: 这些旅程节点来自 The Twenty Five、Hawaiʻi、JAL、DHL 和 ADNOC 等合作模式的归纳，不是 Regent 公开销售漏斗。
    claimRefs:
      - CU003
      - CU011
      - CU014
      - CU018
      - CU030
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: wide
    summary: 客户证据从广泛生态兴趣推进到具体航线启动和实际运营时，公开证据明显变薄。
    data:
      items:
        - label: 已公开点名的生态方和运营方
          value: 20
        - label: 具名运营方或战略伙伴，且海上滑翔机角色明确
          value: 10
        - label: 公开了具体航线或使用场景的合作方
          value: 6
        - label: 目前已有 Regent 常态化服务的合作方
          value: 0
    approximationNotes: 计数由作者按保留来源编码，展示证据层级，不代表 Regent 披露的 CRM 漏斗。
    claimRefs:
