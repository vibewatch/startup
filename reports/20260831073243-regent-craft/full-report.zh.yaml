        title: 资本充足度明显改善，但规模化仍跑在公开可见度前面
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月融资是文件里最重要的财务进展。Regent 披露了一笔 $240 million Series B， 由 $120 million 股权和 $120 million
              债务组成，使累计已融资或承诺资本超过 $340 million。 管理层把这笔融资直接绑定到全尺寸制造、认证里程碑、首次载人飞行、防务扩展和客户交付。North Kingstown 已建成的
              255,000-square-foot 制造设施，实质改变了公司的准备度画像：Regent 现在有真实生产基地， 包含专门总装、电池与系统安装，以及水上测试作业。但规模化天然吃现金。公司承诺 300
              个岗位，并可能扩张到 750 个； 正在补充财务、制造、供应链、认证和运营团队；首批交付仍预计要到 2027 年末。Erebor 的债务帮助衔接工厂爬坡，
              但也带来单纯股权融资没有的义务。由于纳入的来源没有公开现金余额或月度烧钱速度，资本充足度提高了，但还不能完全承销。
