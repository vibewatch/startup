            body: >-
              只看任务几何，Regent 很特殊。Viceroy 设计为约 12 名乘客、在水上约 180 mph，同时使用码头而不是跑道或垂直起降场。 Candela 更慢、航程更短，但已经围绕传统水上客运运营和 DNV
              导向认证做优化。BETA、Electra、Joby、Wisk 的基础设施和监管假设完全不同。BETA 讲的是有人驾驶航程和全国飞行测试足迹；Electra 讲 150-foot 起降和庞大预订量； Joby
              强调快速、安静、App 驱动的城市及区域空中出租车，并已投入多年 FAA 工作；Wisk 押注四座自主飞行， 有六代飞机和大量专利。换句话说，Regent
              不是覆盖最广或最容易按传统路径认证的平台；它是最直接围绕沿海水上出行、 同时提供近似飞机速度的平台。这是真实差异化，但也把早期买方限制在那些把水上接入视为优势而不是约束的航线。
