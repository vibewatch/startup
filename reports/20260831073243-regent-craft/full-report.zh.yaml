  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险最高点出现在认证不确定性与从原型走向量产的执行难度交汇处。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高严重性
          values:
            - 产品责任突发
            - 工厂质量跑偏
            - 航线审批 / 认证延迟
        - label: 中高严重性
          values:
            - 创始人集中
            - 培训准备缺口
            - 标杆客户滑期
        - label: 中等严重性
          values:
            - 治理复杂度
            - 离岸试点未转化
            - 国际审批滞后
    approximationNotes: 该矩阵由作者按保留证据编码，旨在概括相对剩余敞口，而不是精算概率。
    claimRefs:
      - CR004
      - CR011
      - CR017
      - CR021
      - CR026
      - CR033
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主导传导路径是认证或审批延迟，进而拖慢交付、增加客户转化风险、推高融资压力并压缩估值。
    data:
      nodes:
        - id: r1
          label: 认证 / 航线延迟
        - id: r2
          label: 交付滑期
        - id: r3
          label: 客户信心受损
        - id: r4
          label: 积压订单转化放缓
        - id: r5
          label: 烧钱继续 / 再融资风险
        - id: r6
          label: 估值和投资逻辑走弱
      edges:
        - from: r1
          to: r2
          label: 推迟服务投运
        - from: r2
          to: r3
          label: 削弱上线信心
        - from: r2
          to: r4
          label: 延后收入转化
        - from: r4
          to: r5
          label: 现金流缺口扩大
        - from: r5
          to: r6
          label: 稀释和风险溢价上升
        - from: r3
          to: r6
          label: 叙事受损累积
    approximationNotes: 该图概括监管、客户和财务证据中最可能出现的下行情境链条。
    claimRefs:
      - CR003
      - CR020
      - CR024
      - CR027
      - CR035
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Regent 启动服务取决于监管方、首发客户、工厂执行和融资能否保持同步。
    data:
      nodes:
        - id: p1
          label: Coast Guard / LR
        - id: p2
          label: 制造基地
        - id: p3
          label: 首发伙伴
        - id: p4
          label: 货运 / 离岸试点
        - id: p5
          label: Erebor / 投资人
        - id: p6
          label: 交付后投运
      edges:
        - from: p1
          to: p6
          label: 认证关口
        - from: p2
          to: p6
          label: 质量和产能关口
        - from: p3
          to: p6
          label: 航线启动关口
        - from: p4
          to: p6
          label: 多元化关口
        - from: p5
          to: p6
          label: 融资桥
    approximationNotes: 该图只突出保留公开材料中反复出现的依赖项。
    claimRefs:
      - CR015
      - CR021
      - CR022
      - CR025
      - CR028
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Regent 仍被归为继续研究：市场与执行证据很强，但价格支撑缺失、里程碑风险高，抵消了上行理由。
    data:
      nodes:
        - id: v1
          label: 大额订单簿和客户兴趣
          description: 需求证据真实存在，但还不能等同于已入账现金流。
        - id: v2
          label: 工厂落地 + Series B 增强可信度
          description: 实体制造和资本通道降低概念风险。
        - id: v3
          label: 认证和首发里程碑仍未落地
          description: 载人飞行、审批和首批交付仍是未来催化剂。
        - id: v4
          label: 投后估值未披露
          description: 价格支撑和下行保护没有公开。
        - id: v5
          label: 继续研究建议
          description: 保留跟踪，但暂不为入场价格背书。
      edges:
        - from: v1
          to: v5
          label: 支撑上行
        - from: v2
          to: v5
          label: 增加可信度
        - from: v3
          to: v5
          label: 风险仍高
        - from: v4
          to: v5
          label: 阻止买入结论
    approximationNotes: 逻辑链由作者按保留证据编码，并明确对价格敏感。
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV013
      - CV016
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值拉开差距的最大变量，是里程碑概率、价格透明度和积压订单转化质量。
    data:
      items:
        - label: 熊市情景
          value: 1.2
        - label: 基准情景中点
          value: 2.4
        - label: 牛市情景中点
          value: 4.5
        - label: 上市可比公司边界中点
          value: 5.9
    approximationNotes: 数值是作者编码的隐含估值中点，单位为 $B；保留的上市可比公司只用作边界，不是直接估值标记。
    claimRefs:
      - CV017
      - CV023
      - CV024
      - CV028
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Regent 的隐含估值区间仍然很宽，因为已知的是融资规模，不是本轮价格。
    data:
      items:
        - label: 熊市（$B）
          low: 0.8
          high: 1.5
        - label: 基准（$B）
          low: 1.8
          high: 3
        - label: 牛市（$B）
          low: 3.5
          high: 5.5
    approximationNotes: 区间是作者根据里程碑结果、上市可比公司边界和 Regent 披露缺口推断出的私募市场估值带。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 改变 Regent 估值立场前，最该盯住的监测指标。
    data:
      items:
        - label: 首次 Viceroy 载人飞行状态
          value: pending
        - label: 2027 年末交付目标状态
          value: at-risk-if-slip
        - label: 具名首发伙伴进入主动部署准备
          value: 2+
        - label: 公开或私下共享可靠性边界
          value: 'no'
        - label: 首批交付前新融资
          value: unknown
        - label: 股权结构 / 债务条款已尽调
          value: 'no'
    approximationNotes: KPI 值是截至运行日期的基线尽调状态，不是公司披露的经营指标。
    claimRefs:
      - CV010
      - CV011
      - CV014
      - CV036
      - CV037
      - CV039
