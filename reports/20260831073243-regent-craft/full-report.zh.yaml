              Regent 的公开里程碑记录，在私营海事出行初创公司里异常密集。公司时间线从 2021 年 6 月 Brittany Ferries 订单开始， 随后是 2022 年 8 月迁至 Rhode
              Island、2022 年 9 月四分之一比例飞行里程碑、2023 年 1 月 Japan Airlines 战略投资、2023 年 10 月 Series A 与 Marine Corps 协议、2024 年
              7 月 D.C. 办公室开设、2025 年 1 月 Quonset 制造工厂破土、2025 年 3 月全尺寸原型海试里程碑，以及 2025 年 7 月 REGENT Defense 发布。到 2026 年 3
