      - number: '8.3'
        title: 乐观、基准、悲观情景应围绕里程碑承销，而不是口号
        blocks:
          - type: paragraph
            body: >-
              Regent
              的情景跨度很宽，因为它作为一家尚无披露估值锚的创业公司，却拥有异常强的需求和生态证据。悲观情景假设首次载人飞行和认证延期，旗舰首发伙伴推迟商业铺开，股权加债务的混合资本结构没有订单簿标题暗示的那么耐久。届时，Regent
              仍可能具备战略价值，但私募标记只能打入重风险折价。基准情景假设首次载人飞行完成、认证继续推进、2027 年末交付目标仍可信，The Twenty Five
              和部分非客运伙伴从试点叙事推进到签约部署，下一轮融资也没有明显压力；这支持个位数低段的十亿美元估值区间，但仍应明显低于高溢价公开自主驾驶可比公司。乐观情景需要更强证据：Regent
              能反复证明自己可把订单积压转成交付，展示可信可靠性包线，并在不丢掉进度控制的情况下打开不止一个首发地区。乐观 / 基准 / 悲观情景表 TV003 和估值 / 回报区间图 FV003
              让分析保持明示：只有里程碑概率和价格透明度一起改善，推荐立场才应上调。
