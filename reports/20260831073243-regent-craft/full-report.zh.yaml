      - number: '5.2'
        title: 架构把海事硬件与现代控制、感知系统结合起来
        blocks:
          - type: paragraph
            body: >-
              Regent 的技术文章让架构比落地页营销更容易看清。船艇有三种模式——漂浮、水翼和飞行——公司反复强调， 水翼和数字飞控的组合，才是其海上滑翔器设计不同于早期地效翼尝试的地方。机翼文章解释说，早期
              ekranoplan 设计为了稳定性牺牲了重量或效率，而 Regent 声称现代数字控制系统现在能管理不稳定性，同时不牺牲气动效率。 Viceroy 页面补充了几个具体架构元素：可收放水翼、12
              台冗余电机的分布式吹翼推进、线传转向、合成视觉、雷达、 前视声呐和交通提示系统。感知文章又加了一层重要信息：NODAR 的大基线立体视觉方案，比 lidar
              更适合眩光和飞溅严重的海事感知场景。合在一起，这些披露支撑了一个差异化架构逻辑：用海事船体和水翼处理码头与波浪工况， 用近似飞机的机翼效率完成地效飞行，再用软件辅助感知和控制去跨过 WIG
              飞行历史上不稳定的部分。
