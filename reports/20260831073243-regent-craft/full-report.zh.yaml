      - number: '1.4'
        title: 监管路径、反向问题和尚未解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              Regent 的监管叙事在 2026 年明显改善，但还没有完全闭环。Axios 和 Regent 自己的国会更新都把 Viceroy 定位为主要由 U.S. Coast Guard 而非 FAA
              监管的海事载具；这在战略上重要，因为它意味着地效翼船可能走更定制化的认证路径。 Lloyd's Register 也确认正为 Regent 提供咨询，并帮助与 Coast Guard
              界定设计基础协议。不过，反向证据仍然重要。 FlightGlobal 2023 年报道称，美国监管机构当时尚未决定该载具应按飞机还是海事船艇处理；BBC 对英国航线概念的报道也说明，
              航线级监管批准仍卡在订单公告和服务落地之间。这些问题解释了本章为什么没有把 Regent 称为已经完全去风险。 最大的尽调缺口不在愿景，而在财务：没有纳入本报告的来源披露 2026
              年融资后估值、当前确认收入或干净的公开员工数。 治理可见度也薄弱，只有防务顾问委员会的提及，没有完整公开董事会名单。Regent 的身份和势头清楚，但投资判断图景还没拼完整。
