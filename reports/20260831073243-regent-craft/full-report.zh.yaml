            body: >-
              Regent 交付的是一套海事出行系统，而不是单一旅游船艇。Viceroy 页面和 FAQ 把当前商业产品描述为 12 座、
              全电动海上滑翔器，也可配置为货运、离岸物流、搜救和防务任务。运营商工作流刻意保持熟悉：乘客或货物在码头登船， 船艇以船体状态离港，在拥挤港区外切换到水翼，随后在开阔水面上进入地效飞行。这条运营流程重要，
              因为它解释了 Regent 为什么反复强调现有码头基础设施和海事船长，而不是机场登机口、跑道或垂直起降场。 产品族也不止 Viceroy。FAQ 和防务材料描述了混合动力 / 自主 Viceroy
              变体、Squire 自主无人机， 以及 100 座 Monarch 路线图。对客户来说，Regent 卖的是更快的港到港出行，且基础设施负担更低；
              从技术上看，它把流体动力学、电推进、感知和飞控软件打包成一个面向运营商的船艇系统。
