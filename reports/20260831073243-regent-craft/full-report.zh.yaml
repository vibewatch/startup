  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品，以及 Regent 真正切入的需求
        blocks:
          - type: paragraph
            body: >-
              Regent 的可触达市场，最好定义为区域沿海出行，而不是最宽泛的航空。公司自己的研究聚焦约 50 至 200 miles 的行程， 这与当前 Viceroy
              航程包络一致，也自然指向水上或贴海岸线航线：公路拥堵、机场不便，或渡轮太慢。 这个边界重要，因为它同时界定了纳入的支出和现有替代方案。Regent 主要不是在进攻长途航空、内陆铁路或远洋货运，
              而是瞄准短途沿海客运、岛际货运、离岸人员转运和防务濒海物流。最强的替代证据来自 Regent 的调研：在这些航线上， 大多数人仍乘私家车或其他道路交通，少部分选择航空、铁路或水路。换句话说，市场不只比渡轮大。
              买方决策也不是孤立地比较海上滑翔器和飞机，而是比较海上滑翔器与既有道路、渡轮、短途航班合在一起的不便、成本和时间惩罚。
