    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品逻辑和运营版图
        blocks:
          - type: paragraph
            body: >-
              Regent Craft 自称为面向沿海交通的全电动海上滑翔器开发商和制造商。官网首页、公司页和 Viceroy 产品页讲的是同一套逻辑： 海上滑翔器兼具近似飞机的速度、码头接入能力和船艇经济性。旗舰
              Viceroy 被描述为 12 名乘客、2 名机组的平台， 在水上以漂浮、水翼和地效飞行三种模式运行；搭载当前电池时，水面速度约 180 mph，航程约 180 miles。 Regent
              对基础设施逻辑也说得很直接：船艇设计为使用现有码头基础设施，而不是专用跑道或垂直起降场； 这是其成本和部署优势主张的核心。招聘页和 2026 年测试活动公告把运营版图串了起来：总部、测试和制造集中在 Rhode
              Island 的 North Kingstown，Washington, D.C. 办公室负责认证和防务对接。这个双地点布局可信，
              也被反复印证，但公开材料仍然更擅长证明产品愿景和实体足迹，收入、员工数、已部署船队数量等运营指标披露得少得多。
