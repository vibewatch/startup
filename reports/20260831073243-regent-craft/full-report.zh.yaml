        title: 退出准备仍早，最终尽调应盯住破坏投资逻辑的触发器
        blocks:
          - type: paragraph
            body: >-
              按照传统后期项目标准，Regent
              还没有进入退出就绪状态，因为公开记录仍缺少能让投资人区分高质量积压订单和愿望式需求的指标。近期更容易想象战略收购，而不是首次公开募股（IPO）：防务、海事和工业买家可能在经常性运营历史完全可见前，就愿意为品类位置付费；公开市场投资人通常不会。这不意味着公司默认应被悲观看待，而是说最后一步应把尽调集中到最能移动价值的少数变量：实际股权结构表和优先股堆叠、Erebor
