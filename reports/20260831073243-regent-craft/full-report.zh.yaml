  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分横跨运营商、生态伙伴和战略支持方
        blocks:
          - type: paragraph
            body: >-
              理解 Regent 客户，最好把它看成分层生态，而不是单一买方画像。在客运市场，直接买方通常是运营商或平台——如 The Twenty Five、Mokulele 或 Ocean
              Flyer；终端用户是旅客，经济付款方则混合了运营商资本、航线收入， 以及某些市场的公共基础设施或融资伙伴。Hawaiʻi 是最清楚的例子：HSI 联盟包括航空公司、货运玩家、社区组织和交通机构，
              因为海上滑翔器主张同时触及乘客可达性、货运可负担性和韧性。在 Japan，相关客户面不止一家航空公司， 而是延伸到航空、航运、物流和旅游利益相关方。Regent 的货运和离岸机会又有完全不同的买方：DHL
              在评估沿海物流用例， ADNOC L&S 在测试离岸人员转运。这种多元性是战略优势，因为它拓宽了采用面；但它也意味着不同细分市场的转化动态、 合同条款和集中度风险会明显不同。
