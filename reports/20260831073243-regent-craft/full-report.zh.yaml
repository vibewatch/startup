      - number: '2.4'
        title: 驱动因素、约束，以及为什么采用节奏仍然重要
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动因素清楚。Regent 自有调研显示，消费者把便利、舒适和成本排在新奇或可持续性之前；如果一种新交通方式能实质提升门到门效用，
              这正是愿意切换的市场画像。现有码头基础设施，加上融资和充电合作伙伴，相比重基础设施替代方案，能降低运营商采用摩擦。 DHL
              等企业托运人带来另一股顺风：只要服务质量守得住，脱碳压力就越来越重要。但市场并非没有摩擦。 FlightGlobal 早前的分类担忧和 BBC
              关于本地及监管批准在订单公告后仍是前置条件的报道，都说明航线批准和认证仍然卡着部署。 既有运营商也握有重要资产和关系：Hornblower 的 250 多艘船网络、Brittany Ferries
              成熟的跨海峡系统表明， Regent 必须嵌入真实运营生态，而不是进入一片空白市场。因此，市场论证最强的地方，是买方有急迫时间成本痛点、 有未充分利用的滨水基础设施，并愿意把融资、认证和运营一起协调起来。
