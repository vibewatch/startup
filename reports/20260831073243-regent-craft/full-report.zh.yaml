      - number: '5.3'
        title: 信任、安全和合规是核心差异点，但仍有一部分停留在定性层面
        blocks:
          - type: paragraph
            body: >-
              Regent 的公开记录在流程和路径上最强，在量化结果上较弱。FAQ、招聘页和感知文章都把安全称为公司的核心价值， 并把认证、测试和运营描述为独立职能。公司称，U.S. Coast Guard 是 46
              C.F.R. Subchapter T 下的主要监管机构， 海事船长将获得海上滑翔器专门型别等级，船长培训为六周，覆盖课程、课堂教学、模拟和艇上训练。 Lloyd's Register
              正为海事认证路径提供咨询，包括设计基础和国际船旗国工作；美国国会也已明确要求为 WIG 检验和认证建设 Coast Guard 能力。这些治理和安全控制有意义，但不等于已公布的签派可靠性、平均故障间隔、
              事故率或电池滥用测试结果。因此，公开信任更多建立在可见的严肃程度、合作伙伴质量和逐步测试进展上，而不是披露的统计可靠性。
