      - number: '2.3'
        title: 按细分市场拆解买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              即便载具只有一种，买方地图仍然分散。在客运里，用户是旅客，但买方通常是运营商、航空公司关联方、旅游公司或公共交通利益相关方， 他们决定一条新航线能否填补道路、机场或渡轮留下的缺口。Hawaii
              把这一点展示得很清楚：地方政府、Hawaiian 和 Alaska 生态伙伴、Mokulele、社区组织和基础设施玩家都参与其中，因为海上滑翔器同时触及乘客可达性、货运可负担性和韧性。 Japan
              的生态不同，但逻辑相似：航运、航空、旅游和物流玩家都重要，因为沿海出行是跨行业问题。货运买方不太在意新奇， 更在意时间、排放和网络匹配，所以 DHL 把海上滑翔器作为区域物流延伸来测试，而不是一个独立产品品类。
              离岸能源买方关注安全、效率和人员转运经济性，因此 ADNOC 是不同类型但仍很合理的早期采用者。 因此，这个市场是多买方、多付款方结构，最强的早期采用路径来自机构运营商，而不是直接消费者零售需求。
