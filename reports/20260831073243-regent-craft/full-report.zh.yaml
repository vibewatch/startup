  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接、相邻和既有替代品
        blocks:
          - type: paragraph
            body: >-
              Regent 没有一个干净的单一同业组。最接近的水上电动替代方案是 Candela；其水翼 P-12 渡轮瞄准水上客运服务， 能耗更低，认证框架也更接近传统船艇，但速度和航程包络都远低于
              Regent。相邻竞争来自 BETA、Electra、Joby、Wisk 等区域电动或混合动力航空公司。它们解决的是类似的短途出行时间痛点，但依赖机场、垂直起降场或航空认证，
              而不是码头到码头的沿海基础设施。既有替代品仍很强。Bristow 已用大型直升机机队服务离岸能源交通； Hornblower 和 Brittany Ferries
              则证明，成熟海运运营商掌握航线、码头、乘客和运营诀窍。因此， Regent 的核心战略问题不只是船艇技术是否新颖，而是这种新颖性在真实部署场景里，能否对每一类竞争者打出更好的楔子。
