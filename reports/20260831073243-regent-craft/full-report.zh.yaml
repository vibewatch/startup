      - number: '7.2'
        title: 运营风险集中在把有希望的测试转成可重复的安全运营
        blocks:
          - type: paragraph
            body: >-
              Regent
              的技术叙事越来越具体，但公开证据大多仍停留在里程碑，而不是运营统计。公司已经展示船体、翼型和缩比飞行验证，也讲清了感知、水翼和自主航行路线，并且已有制造场地。可是公开材料仍缺少派遣可靠性、MTBF、电池滥用测试、感知误报、海况包线和维护间隔数据。这个缺口关键：新出行硬件往往不是败在概念是否成立，而是败在运营节奏下能否反复稳定跑起来。制造设施把
              Regent 带到真实生产基地，压低了一类风险，却打开了另一类风险——离开原型阶段之后，质量漂移、工装、员工培训和供应商执行就成了核心。Squire
              在罗德岛州获得测试许可，说明防务相关试验在推进；但这也提醒，关键运营许可和安全审查仍在关键路径上。运营上看，Regent 严肃且有章法；风险仍高，因为这些严肃、有章法的工作还没完成。
