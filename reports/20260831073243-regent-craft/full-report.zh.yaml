  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 推荐意见和价格纪律应随证据更新
        blocks:
          - type: paragraph
            body: >-
              Regent 如今已经越过从概念故事到严肃工业项目的门槛。公司在 2026 年 8 月完成大额融资，建成 255,000 平方英尺制造设施，明确提出 2027
              年末交付目标，并搭起可见的首发、航空、货运、海上能源和防务关系。这些事实足以把它放进活跃投资档案，而不只是投机观察名单。但仅靠公开证据，还不足以给出买入建议。关键缺口是估值透明度。公开来源确认 Series B
              的规模和结构，但没有给出投后估值、清算优先权、反稀释条款、债务契约，或订单簿背后的定金质量。缺少这些输入，正确建议是继续研究而不是买入；定价立场也应由里程碑把关，而不是被叙事牵着走。推荐摘要表 TV001
              和正反论点表 TV002 把这一立场转成可提交 IC 的框架；推荐逻辑图 FV001 说明，需求和制造证据强、价格和下行保护证据弱，两者叠加后，只能得出有条件、随证据更新的判断，而不是高确信度评级。
