    approximationNotes: 现金流阶段基于已披露里程碑推断，因为 Regent 尚未发布正式的资金来源与用途或现金跑道桥图。
    claimRefs:
      - CI007
      - CI008
      - CI013
      - CI030
      - CI032
      - CI039
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Regent 以海事船体和水翼打底，上层是数字控制的电动地效飞行器，并配套海事专用感知套件。
    data:
      layers:
        - id: mission-layer
          label: 任务层
          detail: 覆盖客运、货运、海上物流、防务和搜救任务集。
        - id: vehicle-layer
          label: 载具层
          detail: 船体浮航、水翼过渡，以及开放水域的地效飞行。
        - id: control-layer
          label: 推进与控制层
          detail: 分布式电动推进、12 个冗余电机、线控转向和数字飞控软件。
        - id: sensing-layer
          label: 感知与操作员层
          detail: 立体视觉、雷达、声纳、合成视觉、移动地图和交通提示系统支撑海事态势感知。
    approximationNotes: 公开架构描述来自产品页和工程解读；模块边界是摘要归纳，不是源自详细工程图。
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE012
      - CE015
      - CE016
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: Regent 的运营商流程从码头而不是机场开始，先后经过浮航、水翼和飞行，再回到海事码头基础设施。
    data:
      nodes:
        - id: w1
          label: 码头登乘 / 装载
          description: 乘客或货物使用现有海事接入点。
        - id: w2
          label: 浮航模式离港
          description: 船体在港内低速移动。
        - id: w3
          label: 水翼过渡
          description: 出港后，水翼把载具抬离波浪阻力。
        - id: w4
          label: 地效巡航
          description: 在开放水域达到近似飞机的速度。
        - id: w5
          label: 水翼和浮航降落
          description: 在目的地附近受控回到海事运营状态。
        - id: w6
          label: 到港 / 运营商周转
          description: 现有码头基础设施支持卸载和周转。
      edges:
        - from: w1
          to: w2
          label: 海事离港
        - from: w2
          to: w3
          label: 港外加速
        - from: w3
          to: w4
          label: 开放水域过渡
        - from: w4
          to: w5
          label: 下降抵达
        - from: w5
          to: w6
          label: 基于码头回收
    approximationNotes: 本图强调工作流和基础设施逻辑，而非内部子系统细节，因此与 FE001 区分开。
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE017
      - CE018
      - CE035
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 产品就绪取决于监管方、认证顾问、感知系统、制造能力，以及训练有素的海事运营人力。
    data:
      nodes:
        - id: d1
          label: U.S. Coast Guard
        - id: d2
          label: Lloyd's Register
        - id: d3
          label: 感知栈集成
        - id: d4
          label: 数字飞控
        - id: d5
          label: 制造园区
        - id: d6
          label: 船长培训管线
        - id: d7
          label: 商业交付
      edges:
        - from: d1
          to: d7
          label: 认证关口
        - from: d2
          to: d7
          label: 顾问 / 国际路径
        - from: d3
          to: d7
          label: 危险感知就绪
        - from: d4
          to: d7
          label: 稳定性与包线控制
        - from: d5
          to: d7
          label: 制造质量和吞吐量
        - from: d6
          to: d7
          label: 合格操作员
    approximationNotes: 依赖项仅限已留存公开来源点名的参与方和系统；具体供应商未公开披露，因此供应商节点保持高层级。
    claimRefs:
      - CE014
      - CE019
      - CE020
      - CE021
      - CE022
      - CE024
      - CE033
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 成熟度在任务定义和制造准备度上最强，认证路径清晰度居中；已披露可靠性和供应商透明度最弱。
