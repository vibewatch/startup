              公开记录给出几条方向性有用的成本信号，但没有披露 Regent 内部单位经济性。Viceroy 页面和 FAQ 反复强调全电推进带来的更低运营和维护成本，Regent
              的码头部署逻辑也降低了启动市场对机场或垂直起降场建设的需求。 ADNOC L&S 提供了最强的外部经济性证明点：在离岸物流中，Regent 的海上滑翔器据称可将运营成本较直升机最高降低 80%。 Hawaii
              可行性材料给出了部分岛际航线约 $30 的示例单程票价；这对运营商侧可负担性有参考价值， 但不是 Regent 的收入指引。除此之外，公开来源中的关键承销字段仍是空白：载具 ASP、物料清单、电池更换周期、
              单船劳动力投入、按载具类型划分的毛利率、质保准备金和营运资金节奏。换言之，证据足以说明部分航线的运营商经济性可能有吸引力， 但不足以有把握地承销 Regent 自身毛利率路径。
