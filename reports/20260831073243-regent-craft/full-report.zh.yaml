      - number: '7.3'
        title: 合作伙伴、客户和融资依赖会放大任何执行失误
        blocks:
          - type: paragraph
            body: >-
              Regent 的商业叙事由少数高度可见的依赖撑起。The Twenty Five 支撑美国首发故事，夏威夷利益相关方支撑岛际场景，Ocean Flyer 支撑国际运营商案例，DHL 和 ADNOC
              则支撑非客运多元化。这些关系有战略价值，但也抬高依赖风险，因为每段关系的叙事价值可能高于近期收入占比。认证顾问、融资伙伴和投资人又增加一层敞口。2026 年 Series B 和 Erebor
              债务工具显著改善资本充足度，但公司仍没有公开现金、烧钱速度或契约披露。投资人因此无法判断资产负债表能扛住多长延迟。一旦认证或生产滑坡，传导很直接：首发伙伴等待，订单积压转化变慢，固定成本继续跑，资本需求上升。即便货运和海上能源垂直的客户面是好事，试点如果不能转成规模化合同，也会变成风险。公开证据支持兴趣来源多元，但还不支持已实现现金流多元。
