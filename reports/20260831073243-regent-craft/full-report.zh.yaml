  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和商业化路径
        blocks:
          - type: paragraph
            body: >-
              Regent 目前不是一家直接面向消费者售票的公司。自家 FAQ 称，乘客票价由运营商而非 Regent 制定， 这意味着 Regent
              的主要商业化应理解为整机销售加邻近支持收入，而不是收取零售票价。Viceroy 页面和 FAQ 展示的是一个多任务硬件平台，销售到客运、货运、离岸、搜救和防务用例。公司还通过船长培训、售后支持， 以及 UAE
              制造和服务合资模式，释放未来服务邻近收入流信号。公开证据支持强商业意图，但还不能支撑已确认收入、 实际定价或按收入流拆分的组合。Hawaii 材料解释了为什么该品类对运营商有融资可能：Pacific
              Current 被定位为融资和充电基础设施伙伴，Regent 则主张现有码头基础设施和更低运营成本能帮助客户在不建设机场或垂直起降场的情况下启动服务。 这提升了客户可负担性，但 Regent
              自己的收入确认机制仍大体未披露。
