        title: 创始人、资本形成和利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              公司页显示 Regent Craft 于 2020 年 12 月创立，并列明 Billy Thalheimer 和 Mike Klinker 为联合创始人。 纳入本报告的 2026 年公司声明也稳定地把
              Billy Thalheimer 称为 CEO、Mike Klinker 称为 CTO， 说明公司仍是创始人主导的运营结构。外界对更大管理层的可见度较低：招聘和新闻页面会描述职能团队，
              但没有发布标准化的现任管理层名单，也没有董事会页面。相比之下，融资脉络记录得更清楚。Regent 称 2023 年 10 月完成 $60 million Series A，随后在 2026 年 8 月 27
              日完成 $240 million Series B。 Regent、AeroTime、eVTOL Insights 和 Crunchbase News 对 Series B 的表述一致：股权和债务 50-50
              分拆。 Mare Liberum 和 AE Ventures 共同领投股权部分，Erebor Bank 提供债务融资额度，Founders Fund、 Caffeinated Capital、Lockheed
              Martin Ventures、Japan Airlines、Giant Step Capital 等既有投资方也参与。 结果是，相比许多同阶段硬科技交通初创公司，Regent
              的股权结构叙事更容易被机构理解；但本轮并未披露实际融资后估值， 也没有股权结构表文件，外部投资人仍无法量化稀释和控制权。
