      - - 认证总排期
        - 载人飞行关口、Coast Guard 审查、LR 工作流和航线批准顺序
        - 时间是情景概率的最大单一驱动因素
        - 索取项目管理办公室跟踪表和监管倒排计划
      - - 可靠性和安全包
        - 测试包线、维护假设、派遣目标和事件报告框架
        - 没有可测算的运营画像，估值溢价难以自洽
        - 要求工程和运营尽调会议
      - - 工厂和供应商就绪度
        - 产能计划、良率目标、QA 逃逸和头部供应商集中度
        - 制造质量控制决定积压订单能否高效转化
        - 要求现场走访和供应商评分卡
    notes: 这些问题定义了从继续研究转向可定价投资判断所需的最低证据。
    claimRefs:
      - CV007
      - CV009
      - CV015
      - CV016
      - CV036
