      - number: '7.4'
        title: 执行人才和可量化否决标准应约束尽调纪律
        blocks:
          - type: paragraph
            body: >-
              人才风险不只是 Regent
              能不能招到人，而是能不能足够快地同步认证人才、制造领导、运营机组、防务关系和安全治理，支撑一个新品类。招聘页显示公司知道这些职能重要，但公开材料没有披露各团队深度、流失率、安全评审节奏，或工程、认证、运营之间的内部交接。因此，正确做法是先定义可量化的否决标准。若首次载人飞行明显延期，客户航线审批推进不动，公开可靠性包线仍缺位，旗舰首发伙伴推迟，或首次交付前融资需求再次出现，投资逻辑应快速降级。Regent
              因为搭了真实资产、推进了真实路径，值得认可；但不能因此免于里程碑纪律。
