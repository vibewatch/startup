            body: >-
              Regent 的公开客户文件更擅长解释交易对手为什么感兴趣，而不是证明他们签约后会怎么做。商业服务尚未开始， 因此没有披露净留存率（NRR）、总留存率（GRR）、流失率、利用率、续约率或活跃船队使用数据。
              唯一可见的耐久性信号是间接的：The Twenty Five 从 30 艘扩展到最高 60 艘；HSI 从 2022 年网络开发工作延续到 2024 年更广泛公私参与的联盟；Regent
