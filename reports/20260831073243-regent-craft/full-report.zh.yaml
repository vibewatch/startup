        - 提高折现率，并更审慎看待订单簿质量
      - - 旗舰投运伙伴推迟或缩小规模
        - The Twenty Five 或其他可见运营商推迟投运时间，或下调船只数量
        - 抬高集中度风险，并削弱近期商业证明
        - 投入新资本前，重新测算客户论证
      - - 降险前融资需求回归
        - Regent 在认证和投运证明可见前就需要新资本
        - 表明烧钱或资本开支负担跑在里程碑转化之前
