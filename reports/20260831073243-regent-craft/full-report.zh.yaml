      - number: '2.2'
        title: 证据受限的规模测算：需求下限比自上而下的 TAM 更清楚
        blocks:
          - type: paragraph
            body: >-
              纳入证据不足以支撑一个激进的自上而下万亿美元级出行总可用市场（TAM）。但它能支撑几个有边界的测算视角。 Regent 的全球调研称，超过 1 billion
              名乘客已经在行驶可由海上滑翔器服务的航线；同一分析还指出， 渡轮和飞机每年各承运约 4 billion 名乘客。这些是市场边界和替代事实，不是收入预测，但足以说明出行池并不小。 最清楚的商业下限，是 Regent
              自己披露的订单储备推进：到 2023 年 1 月超过 $7.5 billion， 到 2024 年末达 $9 billion，到 2026 年 3-6 月超过 $10 billion。这不是
              TAM，更适合理解为早期可获取市场（SOM） 下限，或证明各地区运营商愿意在大规模服务启动前为这个品类签约。按地理区域看的证据也强化了这一点。 Hawaii 航线研究给出了部分岛际航线单程约 $30
              的票价估计；Japan 分析提示每年 25 million 人次机会； ADNOC 等离岸能源买方在测试海上滑翔器能否在人员转运中替代直升机经济性。合在一起，这些视角支持一个真实市场， 但还不能给出干净的单一
              TAM 数字。
