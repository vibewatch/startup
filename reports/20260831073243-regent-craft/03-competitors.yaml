- id: moat-and-risks
  title: Moat durability, multi-homing, and competitive risk
  body: 'Regent''s moat claims rest on the conjunction of speed, maritime access, and a supposedly simpler certification route than air taxis. That combination is real, but it is not automatically durable. Candela can win buyers who do not need 180 mph if lower complexity, DNV-oriented approval, and lower-energy ferry economics are enough. BETA, Joby, Wisk, and Electra can win buyers who prefer aviation-native infrastructure or who value broader route flexibility over dock access. Incumbents can multi-home or wait. A ferry or logistics operator could pilot Regent for one corridor while continuing to run its core network on existing vessels or helicopters. FlightGlobal''s earlier classification uncertainty and BBC''s route-approval caution underscore that timing matters: differentiation only becomes a moat if Regent launches before adjacent categories mature around it. The public record therefore supports a nuanced conclusion: Regent is highly differentiated, but the moat is still execution-dependent
    rather than locked in by network effects or transparent pricing power.'
