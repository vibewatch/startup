  - FU003
- id: retention-and-durability-visibility
  title: Retention, repeat purchase, and usage durability remain largely unobservable
  body: >-
    Regent's public customer file is much better at explaining why counterparties are interested
    than at proving what they do after signing. There is no disclosed NRR, GRR, churn, utilization,
    renewal rate, or active-fleet usage because commercial service has not yet started. The only
    visible durability signals are indirect: The Twenty Five expanded from 30 to up to 60 vessels;
    HSI persisted from a 2022 network-development effort into a 2024 coalition with broader public
    and private participation; and Regent's order-book progression implies at least some continuing
    partner momentum across years. Those are helpful but imperfect substitutes for cohort data. Even
    named launch operators may still be revising routes, financing assumptions, certification timing,
    and end-customer positioning. Customer durability should therefore be treated as an open question,
    not inferred from logos or order counts alone.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-and-concentration-risk
  title: Expansion potential is broad, but concentration and conversion risk still matter
  body: >-
    Regent's expansion logic is compelling: one core vehicle can serve premium coastal travel,
    inter-island transportation, cargo, offshore logistics, and later defense-related applications.
    The same partner network often compounds across geographies because one successful corridor can
    become a template for others. But the early customer roster also creates concentration questions.
    A few visible names carry disproportionate signaling weight: The Twenty Five for early U.S.
    launch credibility, Hawaiʻi stakeholders for inter-island proof, Ocean Flyer for international
    operator readiness, and DHL/ADNOC for non-passenger verticals. If any of those flagship proofs
    stall, the narrative damage could exceed the revenue loss. Likewise, many customer relationships
    are still dependent on financing, local approvals, and ecosystem coordination rather than simple
    point-product substitution. Regent has breadth of interest, but still needs to prove that this
    breadth converts into durable, distributed adoption rather than a handful of highly visible pilots.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
