runDate: '2026-08-31'
company:
  name: Regent Craft
chapter:
  number: 6
  title: Customers
  summary: >-
    Regent's customer story is broad and strategically interesting, but still early in
    maturity. The company has credible named counterparties across coastal passenger,
    inter-island, cargo, offshore-energy, and defense-adjacent ecosystems, with especially
    strong proof from The Twenty Five, Hawaiʻi coalition partners, JAL, DHL, ADNOC L&S,
    and Ocean Flyer. What remains missing is production deployment, recurring usage, and
    retention data. The customer base therefore supports demand credibility and multi-segment
    expansion potential, while leaving concentration, conversion, and renewal risk materially
    unresolved.
sections:
- id: customer-segments-and-payers
  title: Customer segments span operators, ecosystem partners, and strategic backers
  body: >-
    Regent's customers are best understood as a layered ecosystem rather than a single buyer
    archetype. In passenger markets, the direct buyer is usually an operator or platform —
    such as The Twenty Five, Mokulele, or Ocean Flyer — while the end user is a traveler and
    the economic payer is a mix of operator capital, route revenue, and in some markets public
    infrastructure or financing partners. Hawaiʻi is the clearest example: the HSI coalition
    includes airlines, cargo players, community groups, and transportation agencies because the
    seaglider proposition touches passenger access, freight affordability, and resilience at the
    same time. In Japan, the relevant customer surface extends beyond one airline to a broader
    mix of aviation, shipping, logistics, and tourism stakeholders. Regent's cargo and offshore
    opportunities have different buyers altogether: DHL is evaluating coastal logistics use cases,
    while ADNOC L&S is testing offshore personnel transfer. This diversity is a strategic strength
    because it broadens the adoption surface, but it also means conversion dynamics, contract terms,
    and concentration risk will differ sharply by segment.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption
  title: Named customer proof is real, but mostly pre-service or pilot-stage
  body: >-
    The strongest named proof today comes from counterparties that have moved beyond logo-level
    association into specific public commitments. The Twenty Five is the clearest U.S. launch
    proof: Regent calls it the first U.S. delivery and launch partner, and The Twenty Five's own
    site lays out a 2027 launch plan and a scale path toward up to 60 seagliders. Hawaiʻi provides
    another strong cluster of proof. Regent's 2022-2024 materials connect Mokulele, Hawaiian
    Airlines, Alaska Airlines, Pacific Current, HDOT, and other local groups to a route-development
    and affordability agenda; Mokulele is presented as an expected early operator, while Hawaiian
    joined as a design partner and investor. Internationally, JAL's investment and the later Japan
    certification project suggest ecosystem commitment even though paid service is not yet live.
    Ocean Flyer offers one of the stronger non-U.S. operator signals because its own site is built
    around a seaglider operating plan for New Zealand. Cargo and offshore proof are also meaningful:
    DHL is assessing coastal logistics deployment and ADNOC L&S selected Regent for a proof-of-concept
    in offshore transport. Across all of these, the limiting fact is the same: public proof is ahead
    of production deployment.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
