  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Premium coastal travel operators
    - Buyer/operator platform; user traveler; payer operator plus ticket revenue
    - Fast premium coastal and membership-based travel
    - The Twenty Five up to 60 vessels
    - Early flagship U.S. launch proof
    - No live utilization, renewal, or route-yield data.
  - - Inter-island passenger operators
    - Buyer airline/operator; user residents and tourists; payer operator and fare base
    - Hawaiʻi passenger mobility
    - Mokulele plus broad HSI coalition
    - Large route-development and policy relevance
    - Feasibility and approval work still in progress.
  - - Strategic airline design partners
    - Buyer/strategic investor airline; user future passengers; payer airline capital
    - Product shaping and network integration
    - Hawaiian Airlines and JAL
    - Adds credibility, market access, and route insight
    - Design partnership does not equal signed production deployment.
  - - Cargo and logistics operators
    - Buyer logistics carrier; user shipper/end customer; payer logistics network
    - Coastal and island cargo movement
    - DHL exploration, Young Brothers adjacency
    - Opens non-passenger revenue pathways
    - No disclosed operating schedule or shipment-volume commitments.
  - - Offshore and maritime industrial operators
    - Buyer offshore logistics operator; user crew and field teams; payer industrial budget owner
    - Personnel transfer and offshore support
    - ADNOC L&S proof-of-concept
    - Strong operator-economics proof if validated
    - Still pilot-stage rather than routine contracted service.
  notes: >-
    Segment definitions separate direct buyers from end users because Regent's route economics and
    conversion dynamics differ across travel, cargo, and industrial markets.
