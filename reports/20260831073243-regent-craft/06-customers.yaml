    - Pre-service and feasibility-stage
    - Strong local ecosystem alignment across transport, energy, and community groups
    - Coalition support is not the same as delivered aircraft or retained riders.
  - - Hawaiian Airlines / JAL
    - Strategic airline design and network partners
    - Product shaping and ecosystem integration
    - Strategic / pre-service
    - Airline involvement improves credibility and route insight
    - Design and investment relationships do not prove production deployment.
  - - Ocean Flyer
    - New Zealand coastal passenger operator
    - Planned seaglider network in New Zealand
    - Pre-service but operator-specific
    - One of the stronger international operator-intent signals because Ocean Flyer markets a seaglider service directly
    - Timelines and economics are still future-facing.
  - - DHL / ADNOC L&S
    - Cargo and offshore industrial operators
    - Coastal logistics and offshore crew-transfer evaluation
    - Pilot / proof-of-concept
    - Broadens customer proof beyond passenger travel and adds economics-sensitive use cases
    - Neither relationship yet proves repeat contracted operations.
  notes: >-
    Named-customer proof is intentionally limited to the highest-signal counterparties visible in the
    retained source set. Most remain pre-service, so the relevant proof is specificity and durability,
