chapter:
  number: 6
  title: Customers
  summary: 'Tengden’s customer base is visible through missions and public-sector use cases rather than through a disclosed account roster. Public evidence points to five main buyer groups: defense-linked users, meteorological and weather-modification authorities, emergency-management systems, logistics and cargo-route operators, and industrial or infrastructure patrol users. The strongest named proof points are Morocco’s reported TB-001K acquisition, Yibin’s weather-modification firefighting mission, Wuhu and Zigong cargo-delivery and airdrop tests, and Tengden’s own claim that its platforms are already used in emergency, weather, patrol, and transport scenarios. That is enough to show real adoption, but not enough to quantify active customers, retention, revenue concentration by account, or utilization depth. Expansion potential remains strongest in China and China-aligned markets, while allied-government and regulated-operator expansion faces trust and procurement barriers.'
sections:
- id: customer-segmentation
  title: Customer base and segmentation
  body: 'Tengden''s customer base is best reconstructed by mission and payer, not by a public customer list—because the company does not publish one. Official and third-party materials point to five clear customer groups: PLA or defense-linked buyers, meteorological and public-safety authorities, local emergency-management systems, logistics and cargo-route operators, and industrial or infrastructure users needing patrol, mapping, or inspection. In each case, the end user, payer, and buyer can differ materially. A provincial emergency department may pay for a rescue-capable cargo platform; a weather bureau may sponsor a cloud-seeding aircraft; a military unit may use a reconnaissance platform through an integrator; and a local-government-backed industrial park may underwrite a route demonstration.


    That makes Tengden''s customer story look real but fragmented. It is not a consumer or simple enterprise SaaS customer base. It is a mix of programmatic, government, and mission-specific buyers whose procurement cycles are long and whose reference quality depends heavily on public deployment proof. The public evidence supports this multi-payer structure clearly.'
