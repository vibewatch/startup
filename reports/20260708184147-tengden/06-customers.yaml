- id: named-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'Named-customer proof is strongest where external parties or independent media tie a Tengden platform to a visible mission. Morocco''s reported TB-001K acquisition is the clearest foreign customer example. Yibin''s weather-modification firefighting mission is the clearest public-service proof point. Wuhu and Zigong cargo demonstrations provide industrial and local-government evidence. Those are not trivial—they show customers and public authorities trust Tengden enough to place its aircraft into sensitive logistics, disaster, and defense-adjacent roles.


    But they are not the same thing as a disclosed customer roster. Most public evidence is at the level of one mission, one route, one province, or one export report. That means named proof is real but thin, and every bullish customer claim should be discounted for opacity on program size, contract duration, and repeat economics. That is why reference quality must be judged at the mission level first and only secondarily at the revenue level.'
