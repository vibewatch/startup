- id: adoption-and-deployment
  title: Adoption trajectory and deployment depth
  body: 'Public adoption evidence is stronger than for many private UAV manufacturers, but it is still milestone-based rather than cohort-based. The D18 Wuhu production launch, the cross-provincial cargo demo highlighted by Army Recognition, the 1.2-ton air-drop test, the Yibin weather-modification and firefighting example, and Morocco''s reported TB-001K acquisition all show Tengden systems being used or procured for real missions. Official pages also say the family has already been widely applied in emergency rescue, weather services, patrol, transport, and other fields.


    The missing layer is operational depth. No public source in this corpus discloses total active customers, repeat-purchase rates, revenue concentration by named account, or active-platform utilization by mission. So adoption should be read as real and multi-vertical, but not as quantified customer-scale proof. Even so, the available evidence is enough to reject the view that Tengden remains purely experimental. Its aircraft are already entering operationally meaningful contexts where reliability and mission success matter to public buyers.'
