- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'Durability and expansion risk sit in channel dependence and geopolitics. Domestically, Tengden likely benefits from state-linked procurement logic, local industrial-policy support, and product fit for western-China and emergency missions. Internationally, however, the procurement path is much narrower. U.S. and allied policy increasingly privilege Blue UAS or equivalent trusted-supply frameworks and scrutinize foreign-made drone systems. That is directly relevant to Tengden because it caps the set of governments and regulated operators that can buy Chinese large-UAV systems.


    The customer verdict is therefore mixed but usable. Tengden clearly has mission-grade customers or public-sector users, yet its expansion path is constrained by opacity, concentration, and export trust barriers. The company looks stronger as a China- and China-aligned program supplier than as a globally diversified customer-franchise story. The company remains easier to model as a program supplier than as a broad commercial franchise.'
