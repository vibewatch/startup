- id: deployment-roadmap-and-reliability
  title: Deployment, roadmap, and reliability disclosure
  body: 'Deployment and reliability evidence is strongest where hardware milestones exist. Official pages give specification envelopes; Army Recognition, Tencent, and cargo-drop reporting show D18 production ramping in Wuhu, a cross-provincial logistics demo, and a 1.2-ton emergency airdrop trial. Expo and media coverage also show Tengden moving from concept display to serializable industrial assets. But the public record is much thinner on uptime, mean-time-between-failure, spare-part logistics, or maintenance intervals—precisely the metrics that matter once customers try to operationalize large UAV fleets.


    This asymmetry shapes the roadmap read. Tengden is strong on public prototype and platform breadth, credible on early industrialization, and weak on disclosed fleet-reliability metrics. That is normal for a private hardware company, but it means the technology case still relies heavily on engineering claims and milestone evidence rather than on operating statistics.'
