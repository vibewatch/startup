company:
  name: Tengden
chapter:
  number: 5
  title: Product & Technology
  summary: 'Tengden’s technology story is a family of large mission-specific UAV systems rather than one drone: the TB-001 lineage for long-endurance fixed-wing operations, D18 and Cloud-Roc for heavy logistics, Turbulent River Dragon for amphibious missions, and Featherless Arrow for high-altitude unmanned-helicopter operations. Official product pages consistently emphasize modular payload reconfiguration, multi-engine redundancy, common platform architecture, plateau and harsh-weather performance, and broad mission flexibility across defense, emergency, cargo, weather, mapping, and patrol scenarios. Public evidence is strong on hardware breadth and engineering intent, credible on industrialization milestones such as Wuhu D18 production and large-payload demos, and much thinner on civil certification, uptime, maintenance, or formal reliability disclosure. The product verdict is therefore strong on platform versatility and mission fit, but still incomplete on public trust, safety, and validation
    controls.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Tengden''s product stack is best understood as a family architecture rather than as one hero drone. Official pages present the Twin-Tailed Scorpion line as the core fixed-wing platform family, with the original TB-001, the more powerful TB-001A, the composite TB-001B, and the four-engine D18 all sitting on a common twin-boom logic. Around that family sit the Cloud-Roc transport UAV, the amphibious Turbulent River Dragon, and the high-altitude unmanned helicopter Featherless Arrow. In customer-workflow terms, that means Tengden is selling mission-fit aircraft systems for reconnaissance, patrol, emergency response, weather modification, cargo, mapping, and maritime or plateau operations rather than a one-size-fits-all airframe.


    That portfolio breadth matters technically because it spreads engineering effort across deployment modes—runway fixed wing, heavy cargo, amphibious, and helicopter—while preserving common product DNA such as redundancy, mission-payload modularity, and rugged-environment claims. The company is therefore closer to a systems-house building a product family than to a single-SKU UAV vendor. The lineup is unusually broad.'
