  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Tengden 的核心投资逻辑是战略稀缺性。中国同时具备公开三年财务记录、清晰的大型 UAV 产品族，并且可信连接防务邻近与工业低空场景的民营公司并不多。如果 TB-001 谱系、D18
              货运扩建和低空经济政策顺风能转成复购项目，Tengden 可能成为中国少数在大型国有集团之外实现规模化的独立大型 UAV 龙头之一。


              反向逻辑是：战略稀缺性在私募估值里可能已经被过度资本化。公司仍在亏损，收入盘子小，客户和营运资本画像都有风险，可信市场的出口路径也受限。因此，公开证据支持把 Tengden
              看成一家有真实期权价值的公司，但不支持随手接受任何价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
