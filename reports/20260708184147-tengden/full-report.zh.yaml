  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础和分层
        blocks:
          - type: paragraph
            body: >-
              Tengden 的客户基础最好按任务和付款方重建，而不是按公开客户名单——因为公司没有公布名单。官方和第三方材料指向五类清晰客户：PLA
              或防务相关买方、气象和公共安全主管机构、地方应急管理系统、物流和货运航线运营商，以及需要巡逻、测绘或巡检的工业或基础设施用户。每种情形下，最终用户、付款方和采购方都可能差异很大。省级应急部门可能为一套具备救援能力的货运平台付款；气象局可能赞助一架人工增雨飞机；军方单位可能通过集成商使用侦察平台；地方政府支持的产业园可能为航线演示买单。


              这让 Tengden 的客户故事看起来真实但碎片化。它不是消费级，也不是简单企业 SaaS
              客户基础；它是一组项目制、政府和任务特定买方的组合，采购周期长，参考价值高度依赖公开部署证明。公开证据清楚支持这种多付款方结构。
