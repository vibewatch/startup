        blocks:
          - type: paragraph
            body: >-
              持久性和扩张风险落在渠道依赖和地缘政治上。国内方面，Tengden 可能受益于国家相关采购逻辑、地方产业政策支持，以及对中国西部和应急任务的产品适配。国际方面，采购路径却窄得多。美国及盟友政策越来越偏向 Blue
              UAS 或同等可信供应框架，并审查外国制造无人机系统。这与 Tengden 直接相关，因为它封住了部分能够购买中国大型无人机系统的政府和受监管运营商。


              客户结论因此混合但可用。Tengden
              显然拥有任务级客户或公共部门用户，但扩张路径受不透明、集中度和出口信任壁垒限制。公司作为中国及中国盟友项目供应商更强，而不是一个全球分散客户特许经营故事。建模时，把公司看成项目供应商比看成广泛商业特许经营更容易。
