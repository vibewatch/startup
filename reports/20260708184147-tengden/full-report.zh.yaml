              - CV005
      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              估值先看两个公开锚点。第一，36Kr 称 Tengden 在 2023 年完成超过 RMB 1B 融资后，估值已超过 RMB 12.2B。第二，2026 年 IPO 计划拟募资 RMB
              3.021B，发行股份占发行后总股本 10% 至 25%；由此推得的投后区间很宽，从最大稀释端的约 RMB 12.1B，到发行比例最紧时的约 RMB
              30.2B。区间低端接近已知独角兽估值；区间高端则需要公开市场给出极其激进的接盘。


              以 Tengden 自身 2025 年收入 RMB 379.42M 计算，已知的 RMB 12.2B 估值锚已经约等于 32 倍历史收入。对于一家仍在亏损、硬件很重的工业和防务 UAV
              公司，这个定价很贵，除非投资人相信收入能快速跃升，利润率拐点也会出现。这种不对称正是为什么 IPO 头部区间的账面数字应视为情景噪声，而不是公允价值。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: table
