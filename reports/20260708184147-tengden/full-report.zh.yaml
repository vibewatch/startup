      - number: '7.4'
        title: 财务模型风险、缓释因素和论点破坏点
        blocks:
          - type: paragraph
            body: >-
              财务模型风险很突出：Tengden
              仍在亏损，却还要提前投入、等待规模起来。申报材料显示收入在增长，但研发强度很高，客户集中度大，应收款压力也不小。下行情景因此不是明天就破产，而是战略漂移：持续摊薄、航线转化慢于预期、利润率不及预期，以及继续依赖政策驱动或国家关联资本。


              风险有办法跟踪。投资人可以盯住三个投资假设失效触发点：D18
              及相关平台没能转成复购项目；出口和可信供应壁垒切断重要客户池；收入增长后，现金转化和亏损曲线仍看不到改善。因此，风险结论很重，但可以分析：Tengden
              是高机会、高摩擦的硬件项目，不是顺滑复利标的。披露更充分可以降低不确定性，却抹不掉这个品类底层的摩擦。
