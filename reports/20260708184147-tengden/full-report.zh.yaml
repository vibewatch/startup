      - number: '5.4'
        title: 差异化、信任和合规
        blocks:
          - type: paragraph
            body: >-
              Tengden 的差异化建立在三根技术支柱上。第一是面向续航和载荷的机体设计：TB-001 变体推进长航时，D18 和 Cloud-Roc
              推进重载货运。第二是模块化：公司反复围绕即插即用载荷、快速构型变化和开放任务架构来描述产品家族。第三是适应高原起降、结冰、海事作业和应急物流等困难环境。这些都是中国工业无人机用途中的有意义护城河。


              公开层面的信任和合规图景不够成熟。不同于 EHang 等载人 eVTOL 开发商，Tengden
              并未把清晰可见的民用认证路径或正式适航里程碑公开营销为核心产品差异化。这不意味着它的系统不合规；它意味着外部故事在飞机性能和任务适配上强得多，在第三方验证、运行安全披露、网络控制或认证流程透明度上弱得多。投资者因此应把产品案例理解为技术上有吸引力，但公共信任控制披露仍不足。这种披露不对称会影响尽调和采购信任。
