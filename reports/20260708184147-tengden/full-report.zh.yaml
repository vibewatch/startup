      - number: '3.3'
        title: 护城河、渠道权力和替代风险
        blocks:
          - type: paragraph
            body: >-
              Tengden 最强的护城河是架构。官方材料反复强调模块化机身、开放任务架构、多发冗余，以及同一平台家族内的部件复用。这一点重要，因为公司可以覆盖侦察、巡逻、气象、货运、测绘和应急任务，而不必每次从零开始。D18
              的模块化货舱、TB-001 家族共享的双尾梁逻辑，再加上两栖和直升机邻近产品，共同创造了比单一用途出口 UCAV 更宽的应用包线。


              反面压力在于，宽度可能被规模压过。AVIC 和 CASC 拥有更强国家支持、更深出口记录，以及武装无人机市场中更可见的装机基础。MQ-9A 和 Aerosonde
              等西方系统受益于盟友信任、成熟支持生态和采购资格，而中国平台往往缺少这些。即便 Tengden
              看似与解放军相连，这在国内可能有帮助，到了海外却会反向作用，因为它强化地缘和信任壁垒。因此，护城河在平台多样性和中国任务适配上真实存在；在全球渠道权力、盟友市场准入和公开证明的切换成本上则弱得多。
