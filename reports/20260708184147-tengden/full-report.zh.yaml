      - number: '7.3'
        title: 运营和依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险是产品集合的自然结果。大型无人机搭载重载荷，在结冰条件、海事环境、山区地形或应急场景飞行，带来的维护和安全要求比小型消费级无人机复杂得多。公开来源在冗余、模块化和载荷能力上很丰富，但在故障率、签派可靠性、MTBF
              和服务响应上很弱。D18 工业化还在飞机风险之外叠加了制造和培训风险。


              伙伴和渠道依赖会放大这些运营问题。Tengden
              看起来高度依赖地方政府产业支持、国家相关采购逻辑、专门供应链和仍在成形的运营生态。如果任何一块滞后——审批、发动机、飞行机组、航线许可或公共预算——商业故事都可能停住，即便飞机本身技术上可靠。因此，缺失运营统计不是表面的披露问题，而是实质性的风险放大器。
