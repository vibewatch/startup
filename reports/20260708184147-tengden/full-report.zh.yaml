            body: >-
              竞争结论是：中国市场内建设性，海外市场选择性成立。按产品宽度、面向续航的设计，以及把重载货运飞机商业化的意愿看，Tengden 显然属于中国独立大型无人机制造商第一梯队。摩洛哥据报采购 TB-001K，以及芜湖
              D18 产能建设，都说明 Tengden 并未停留在原型机阶段。


              但公开记录没有显示 Tengden 在规模游戏中赢过最大国家冠军，也没有显示它拥有可与 Wing Loong 或 CH 出口相当的广泛国际客户名单。最可支撑的结论是：Tengden
