companyProfile:
  summary: >-
    Tengden（Sichuan Tengden Sci-tech Innovation Co., Ltd.）是一家位于成都的大型无人机开发商，2016 年由原 Chengdu Aircraft Design Institute
    高管聂海涛创立。公司面向防务、物流、应急响应、气象及其他工业场景，开发 Double-tailed Scorpion 系列、货运无人机、水陆两栖无人机和无人直升机。2026 年公司进入创业板 IPO
    审核后，公开披露明显增加；但客户集中、持续亏损、出口敞口和治理仍是关键承销问题。
