      - number: '2.2'
        title: 买方、垂直场景和采用路径
        blocks:
          - type: paragraph
            body: >-
              与 Tengden 相关的需求环境，不由消费级无人机出货量定义，而由续航、载荷和复杂环境部署真正重要的关键任务场景定义。Tengden
              官方材料和本地部署报道指向物流、人工影响天气、应急救援、测绘、安全巡逻，以及其他工业 / 政府任务。People’s Daily 等公开来源也强化了一个判断：农业和基础设施巡检是规模化最成熟的低空类别；而
              Tengden 自身产品组合显示，它更接近重载货运、公共服务和防务，而不是喷洒或客运。买方地图因此覆盖 PLA 各军种、地方应急管理部门、气象主管机构、物流运营商和工业巡检用户，每类买方的付款方和成功标准都不同。


              这种多样性重要，因为采用路径不是同一个漏斗。防务买方关心
              ISR、打击集成、续航和采购周期。地方政府和公共服务买方关心载荷可靠性、恶劣天气性能和航线审批。企业物流用户关心道路、直升机或传统飞机表现不足地区的航线经济性和交付时效。芜湖 D18 产线、宜宾人工影响天气任务和
              2025 年 9 月货物空投测试都说明，概念营销之外存在市场拉力。但它们仍不足以证明规模化、重复、商业上有吸引力的采购。从里程碑演示转向可持续项目，是采用问题的核心。
