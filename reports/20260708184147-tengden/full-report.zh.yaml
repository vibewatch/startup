      - number: '8.3'
        title: 可比公司与牛 / 基准 / 熊情景
        blocks:
          - type: paragraph
            body: >-
              公开可比公司找不到干净的一一对应，但仍能给估值划边界。中国先进空中交通上市公司 EHang 在 2026 年 7 月市值约 USD 0.42B，指引 2026 年收入约 RMB 600M，且仍在亏损；与
              Tengden 隐含的约 USD 1.7B 私募估值相比，估值层级低得多。美国及盟友体系内的防务或 UAV 邻近上市公司，如 AeroVironment、Kratos、Textron、Elbit、Boeing 和
              Lockheed，市值都大得多，但它们也拥有更多收入、更分散的防务敞口、更强的可信定位，或已经建立的公开市场流动性。


              Tengden 因此卡在尴尬的中间地带。它比已上市的防务工业公司早得多、风险也高得多；但按收入口径，估值已经远高于许多新兴空中交通或细分 UAV
              公司。可比公司更支持带期权意识的纪律化方法，而不是追动量。使用公开可比公司的正确方式，是给乐观预期设上限，而不是算出一个伪精确的同业倍数。
            claimRefs:
