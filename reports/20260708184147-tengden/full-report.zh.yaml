            body: >-
              资本可得性目前是 Tengden 财务画像中最强的一环。IPO 申报拟募集人民币 30.21 亿元，多个 2025-2026 年报道显示，公司此前已完成大额私募融资，包括 2023 年一笔超过人民币 10
              亿元的融资，将估值推至人民币 122 亿元以上。芜湖建设报道也指向有意义的工业资本开支野心，一个聚焦 D18 的基地被描述为总投资最高人民币 20 亿元、年产能超过 50 架固定翼无人机。


              公开证据仍无法回答的是现金是否充足。公开文本中的申报摘录没有披露简单的期末现金标题数字、月度烧钱、资金
              runway，也没有可在无完整数据室情况下信赖的明确债务负担摘要。因此，公司看起来可融资，但不能说已经清晰自我供血。其生存和扩张取决于继续获得国家相关资本、IPO 募资，或两者同时获得。
