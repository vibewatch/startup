chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图和产品范围
        blocks:
          - type: paragraph
            body: >-
              Tengden 不是概念阶段的无人机创业公司；它是一家总部位于成都的大型无人机制造商，产业版图在法律上可见，产品家族清晰，IPO 进程公开。Qichacha 和保荐文件把法律主体锚定为 Sichuan
              Tengden Sci-tech Innovation Co., Ltd.，成立于 2016-09-26；公司自有页面则描述 2016
              年创立，并将其定位为国内智能飞行器研发、制造和应用解决方案的领先企业。公开申报材料和联系页面显示，公司总部位于成都金牛高新技术产业园金科东路 50
              号；注册经营范围也远超纯研发，覆盖航空服务、航空器零部件、无人机航空货运、租赁、物流和进出口。这一点重要，因为后续章节应把 Tengden 视为硬件加运营公司，而不只是防务原型机厂商。


              产品家族也比让公司出名的 Double-tailed Scorpion 品牌更宽。官方页面显示，核心 TB-001 谱系之外，还有动力增强的 TB-001A、国产化的 TB-001B、四发 D18
              货运平台、水陆两栖的 Hunjianglong、Featherless Arrow 直升机，以及 Cloud-Roc
              等更新物流机型。合在一起，这些产品覆盖双发、三发、四发固定翼系统，也覆盖两栖和旋翼平台。官网宣称的任务场景包括侦察、巡逻、物流、气象、应急响应、货物投送等多用途。概览层面的含义很直接：Tengden
              的身份建立在平台宽度和模块化工程能力上；未解的问题是，这种宽度有多少会转化为可重复收入，而不只是展示价值。
