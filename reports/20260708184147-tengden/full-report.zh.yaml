      - number: '8.4'
        title: 建议、置信度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的建议不是一刀切拒绝，而是在价格约束下暂缓。牛市情景下，如果 D18 及相关物流平台放量成为复购项目，利润率继续改善，IPO
              过程也验证机构需求强劲，投资人可以为溢价估值找到理由。基准情景下，Tengden
              的战略相关性和真实增长值得认可；但在亏损、集中度和出口摩擦仍未解决时，不能相对公开可比公司给无限制溢价。熊市情景下，如果增长不及预期或风险认知变硬，公开市场或二级买家可能把公司压向更低的硬件式倍数。


              因此，估值立场应是：「只有相较当前私募估值大幅折价，或拿到实质更强证据，才值得考虑。」最终尽调问题很清楚：按板块拆分的收入、订单储备、现金和债务、复购历史、机队可靠性，以及 IPO
              实际簿记反馈。没有这些，单靠战略稀缺性就加价买入还太早。这里价格纪律比叙事热情更重要。
