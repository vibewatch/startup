  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和增长质量
        blocks:
          - type: paragraph
            body: >-
              对一家民营防务和工业无人机制造商而言，Tengden 的公开财务故事异常可见，因为其 2026
              年创业板申报披露了三年经营数据。收入模式本身仍只披露了一部分：公司称其研发、生产、销售并服务高端无人机系统，应用于防务装备、低空经济和通用航空；但它没有公布类似 SaaS ARR
              的指标、单机定价、服务附加率或合同期限。因此，公开证据支持的是硬件加系统与服务模式，而不是干净的经常性软件故事。


              最重要的结论是：规模真实存在，但相对已投入资本和估值叙事仍偏小。2023 至 2025 年收入快速上升，但公司整个期间都处于深度亏损。这种模式在产品周期长、研发负担重的战略硬件类别中常见，但它意味着投资者必须把
              Tengden 承销为资本密集型平台押注，而不是短期可盈利的无人机 OEM。
