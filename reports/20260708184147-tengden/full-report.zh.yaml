  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Tengden 的风险画像由四个一阶敞口主导：监管和地缘政治约束、资本密集和持续亏损、客户与渠道集中，以及大型无人机系统在困难环境中的运营复杂度。这些不是投机性的边缘情形。IPO
              申报本身披露了持续亏损、高研发、大客户集中和毛利率波动；CASI
              和出口政策来源显示，公司处在政治敏感类别；产品家族自身设计逻辑——重载荷、高原作业、海事用途、人工影响天气和多发系统——也意味着维护和飞行安全要求不低。


              正确框架因此不是「有没有风险？」，而是「哪些风险会打破论点，哪些风险在正确定价后可管理？」Tengden
              只有在地缘、融资和执行风险被视为核心而非附带因素时才具备可投资性。投资者还应记住，公司暴露在复合风险栈中，几个中等冲击可能互相作用并放大。久而久之，这会显著放大下行波动。
