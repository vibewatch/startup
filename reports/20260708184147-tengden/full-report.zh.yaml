      - number: '1.2'
        title: 创始人、团队和治理
        blocks:
          - type: paragraph
            body: >-
              聂海涛是 Tengden 公开叙事里的关键人物。Qichacha 和独立报道都称其为董事长、法定代表人，外部报道还把他的履历追溯到 Chengdu Aircraft Design and Research
              Institute；据称他曾参与 J-10 和 FC-1 战斗机项目。这个背景解释了 Tengden
              为什么能拼出一条更像系统公司的产品线，而不是业余无人机公司的产品线。人才信号也一致：独立招聘页面显示，公司在总体设计、气动、结构、动力、控制律、任务系统、载荷集成和软件等岗位招聘；2025 年校招信息则描述了
              11 个领域、77 个专业方向，并拥有大量资深和获奖工程师。


              治理披露仍只亮出一部分。Eastmoney 称股权基础分散，聂海涛通过直接持股和一致行动安排控制 23.57% 表决权；Qichacha 显示股东名单很长，披露的最大股东持股仅
              10.62%。因此，公开来源指向创始人主导控制，但没有清晰多数股东。员工人数披露也有噪声：官网关于页面称员工 900 余人，招聘资料称 1,100 余人。这些不一致不推翻 Tengden
              已具规模这一大判断，但意味着后续财务和组织比较应避免虚假精确。董事会名单、委员会结构和 D 轮后股权条款缺失，是概览层面最清晰的治理缺口。
