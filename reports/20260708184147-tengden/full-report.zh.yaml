      - number: '3.2'
        title: 能力和细分板块比较
        blocks:
          - type: paragraph
            body: >-
              纸面上，Tengden 旗舰平台可信。官方材料称，最初的 TB-001 是翼展 20 米、最大起飞重量 2.8 吨、续航 35 小时的双发平台；TB-001A 是 3.6 吨、续航 50
              小时的三发增强版；TB-001B 是 1.95 吨、续航 46 小时、采用复合材料结构并搭载国产化机载部件的变体。D18 把产品家族推向物流，最大起飞重量 4.35 吨、载荷 1.8 吨；云鸾运输无人机则推进到
              2 吨载荷和 12 立方米货舱。


              但能力宣称需要放进语境。Army Recognition 对 Wing Loong II 的分析描述了一个翼展 20.5 米、外挂载荷约 480 千克、续航 20 至 32 小时的平台；MQ-9A 标杆则是超过
              27 小时续航和约 1.7 吨载荷。CASC 的 CH-4 在载荷上低于这些更重系统，但出口扩散很广。这让 Tengden 处在不寻常的中间地带：部分变体发布的续航数字长于许多同业，D18
              和云鸾具备有意义的货运专门化；但相比最知名的国际项目，它在机队规模、利用率和重复合同赢单上的公开证据要少得多。
