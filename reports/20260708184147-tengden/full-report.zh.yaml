  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图和竞争对手集合
        blocks:
          - type: paragraph
            body: >-
              Tengden 不是在单一无人机市场竞争。其公开产品家族覆盖长航时双尾梁 ISR / 打击飞机、四发货运无人机、水陆两栖无人机和大型无人直升机，因此相关竞争对手会随任务而变。在防务邻近的 MALE
              和大型固定翼任务中，最清晰的中国参照是 AVIC 的 Wing Loong 系列和 CASC 的 CH 系列，国际标杆则包括 GA-ASI 的 MQ-9A、以色列 Heron 家族等系统。在战术 ISR
              场景，Textron 的 Aerosonde 体量小得多，因此更像能力边界，而不是直接同业。


              Tengden 的独特位置在于，它试图把军用级续航和载荷，与民用物流、气象、应急、巡检用途接起来。这种宽度是真实差异化，但也意味着 Tengden
              在军贸出口中要面对更强的国家队对手，在国内货运无人机领域要面对不断扩大的竞争。竞争问题不在于 Tengden 有没有能用的飞机，而在于其军民混合产品组合能否在更大国家冠军和更受信任的西方供应商面前赢得重复采购。
            claimRefs:
