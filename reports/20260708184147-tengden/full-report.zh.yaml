      - number: '1.3'
        title: 资本轨迹和披露跃迁
        blocks:
          - type: paragraph
            body: >-
              Tengden 公开证据集最大的变化，是 2025-2026 年 IPO 进程。Qichacha IPO 面板显示，公司于 2025-07-02 辅导备案，2026-05-24 完成辅导，2026-06-16 获
              SZSE 受理，2026-06-25 进入问询。申报文件和后续报道称，Tengden 拟募资人民币 30.21 亿元，CICC 担任保荐机构，Tianjian 为审计机构，King & Wood
              Mallesons Chengdu 为法律顾问。该申报终于露出硬财务数据：2023 年收入人民币 1.7475 亿元，2024 年人民币 3.150 亿元，2025 年人民币 3.7942
              亿元；净亏损持续存在；毛利率改善但仍波动；研发支出很重，2025 年仍吃掉超过一半收入。招股书还暴露了严重客户集中，前三个报告期内前五大客户每年贡献超过四分之三销售额。


              私募市场信号方向上很强，但仍不完整。36Kr 和 Eastmoney 都称 Tengden 2023 年融资超过人民币 10 亿元，并跨过人民币 122 亿元私募估值；PitchBook
              风格聚合器和私募市场追踪方则把公司放在约 $1.7 billion。Eastmoney 还报道了 2025 年 6 月由机构投资者参与的 D 轮，但未披露规模或估值。资本市场的核心结论是：Tengden
              已吸引足够资本和政策支持，足以冲刺一笔很大的 IPO；但当前申报仍没有给投资者一个干净的 2025 年后估值标记、优先权结构或流动性画像，无法判断估值是否合理。拟议 IPO 本身约为 2025
              年收入的八倍，也提醒承销争论仍围绕未来战略相关性，而非当前财务成熟度。
