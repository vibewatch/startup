            body: >-
              财务结论是：Tengden 具备真实收入牵引、改善中的毛利经济性，以及异常强的政策同向资本获取能力，但仍未通过独立财务成熟度测试。业务在增长，但亏损仍大，研发强度仍极端，客户集中度高，营运资本需求看起来也不轻。


              这并不让故事失去吸引力。在中国战略无人机类别中，如果公司被视为具备可信规模增长和最终利润率杠杆的国家能力资产，公开市场投资者可能容忍亏损。但这也意味着承销负担转向更窄的一组尽调问题：已交付订单储备、防务与民用分部收入、现金和债务状况、服务收入占比、客户续约深度，以及当前扩张支出正常化后的利润率路径。在这些问题回答之前，Tengden
