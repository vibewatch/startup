      - number: '5.2'
        title: 架构和运营模型
        blocks:
          - type: paragraph
            body: >-
              公开运营模型以模块化硬件为中心。TB-001 家族页面反复强调载荷快速重构、多发动力冗余，以及机身、动力、载荷舱模块的共通性。D18 通过模块化货运机身和快速锁定架构，把这个思路延伸到物流；Cloud-Roc
              则强调尾部投放货舱和全流程货物装载工作流。两栖和直升机产品从不同物理条件下呈现同一模式：Turbulent River Dragon 针对水 / 陆起降和海事长航时优化，Featherless Arrow
              聚焦高原旋翼机可靠性、热管理，以及动力—传动—旋翼集成。


              换句话说，Tengden 的架构不是软件栈，而是一套设计哲学：打造可复用机体家族，再按不同载荷、气候、海拔和任务条件重新调校。在工业无人机市场，客户买的是任务结果，不只是飞行小时；这就是实在的产品优势。
