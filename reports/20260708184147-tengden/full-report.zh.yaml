      - number: '4.2'
        title: 成本结构、利润率和盈利质量
        blocks:
          - type: paragraph
            body: >-
              申报材料对成本结构的说明，比对变现质量的说明更清楚。毛利率从 2023 年到 2024 年大幅改善，2025 年仍高于 2023
              年基线，说明产品结构、规模或制造学习可能发挥了作用。但公司在三个报告期每年都把超过一半收入投向研发，2023 年研发支出甚至超过收入。仅这一点就解释了为什么收入增长没有转化为盈利。


              另外两个信号也重要。第一，客户集中度极高：前三年中前五大客户都贡献了收入的大多数，这意味着增长质量与少数账户绑定，也很可能与国家或项目集中绑定。第二，应收账款占收入比例很高，符合长回款周期和项目制销售特征。对防务和工业供应商而言，这些不必然构成否决，但它们让公司的财务风险高于独角兽估值标题可能暗示的水平。
