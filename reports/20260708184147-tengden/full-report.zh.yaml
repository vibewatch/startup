      - number: '2.4'
        title: Tengden 的市场结论
        blocks:
          - type: paragraph
            body: >-
              市场章节支持一个建设性但有边界的结论。Tengden
              所处赛道是中国优先级上升最快的产业政策领域之一，产品组合也对齐最早受益的若干类别：货运、巡检、应急、气象和防务邻近任务。这比一家等待大众消费监管追上的愿景型载人 eVTOL
              创业公司要好。因此，宏观背景应获得正面计分。


              同时，公开记录仍无法把政策雄心转化为可靠的公司特定 TAM 或
              SAM。正确的尽调问题是运营性的、分板块的：有多少航线或项目在运行，交付并飞行的平台有多少，防务预算与民用预算各自集中到什么程度，怎样的定价或利用率能让这些任务算得过账？在这些问题回答之前，Tengden
              的市场案例应被理解为大且有支撑，而不是已被精确量化或去风险。后续章节尤其应测试，公司当前证明点究竟落在可规模化预算池里，还是散落在被地方热情放大的试点项目中。
