      - number: '1.4'
        title: 里程碑、部署和身份层面的风险
        blocks:
          - type: paragraph
            body: >-
              Tengden 的里程碑记录足以支撑真实产业叙事。产品时间线从 2017 年 TB-001 首飞开始，经过 2019 年两栖机型和直升机发布、2020 年 TB-001A、2022 年 TB-001B 与
              D18，再到 2024 年 Cloud-Roc。近期规模信号包括 2025 年 6 月芜湖 D18 总装线投产、据称人民币 20 亿元的地方产业园建设，以及 CASI 观察到 Tengden 自贡二期场地约
              45,000 平方米，当地报道预计年产 200 架大型无人机。民用部署证明也存在：Global Times 报道 Tengden 气象改造无人机支援宜宾山火响应，Changjiang Daily 报道 D18
              完成面向应急救援场景的 1.2 吨货物空投测试。


              同一组证据也解释了为什么 Tengden 的身份框架必须偏风险。CASI 明确把 TB-001 变体与 PLA Rocket Force 和 PLA Navy 可能的采购或评估联系起来；2025 年 3
              月出口报道则把 TB-001K 与摩洛哥相连。这些事实不是旁枝末节；它们塑造了后续所有关于客户、竞争、监管和估值的讨论。Tengden
              的荣誉、专利和产品宽度支持它是中国更严肃的大型无人机平台之一这一判断，36Kr 也认为成功 IPO
              将使其成为成都第四家上市无人机公司。但公司的身份无法与军事敞口、客户集中，以及董事会结构、现金、客户结构披露不完整分开。后续章节因此应把概览视为工程严肃性已被证明，但货币化韧性和隐含价格下的可投资性仍未证明。
