  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算纪律
        blocks:
          - type: paragraph
            body: >-
              分析 Tengden 时，很容易把一切锚定在巨大的低空经济标题数字上；但这样会模糊载人 eVTOL、消费级或农业多旋翼，以及 Tengden
              实际服务的重型工业和防务无人机需求之间的差异。中国公开来源把低空经济宽泛定义为约 1,000 米以下、涉及有人和无人航空器的活动。这个宽口径有上下文价值，因为它解释了该行业为何成为战略政策重点，也解释了 CAAC
              和新华社引用的测算为何能到 2025 年人民币 1.5 万亿元、2035 年人民币 3.5 万亿元。但这些自上而下的数字不是 Tengden 的直接 TAM。Daxue
              等市场评论者明确展示，生态系统里很大部分落在下游运营、小型无人机、基础设施和载人 eVTOL 叙事上，并不能干净映射到大型固定翼平台。


              Tengden 的正确边界更窄：防务无人机采购、重载货运 / 物流无人机、人工影响天气飞机、应急 /
              公共安全部署，以及奖励续航、载荷和复杂地形性能的工业巡检或巡逻系统。这个框架仍处于大市场之内，但不再是简单的万亿人民币故事。公开证据强力支持巨大的赋能背景；它还没有分离出有来源支撑的 Tengden SAM 或
              SOM。因此，本章的规模测算视角保留多个公开估计，最后刻意留下缺口，而不是给出虚假精确目标。
