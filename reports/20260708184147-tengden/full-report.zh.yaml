      - number: '2.3'
        title: 驱动因素和约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动是政策。中国把低空经济纳入中央增长规划，设立专门的 NDRC 部门，并重写民航法和标准体系，让规模化运营合法化、组织化。这个排序对 Tengden 异常有利，因为政策先于完全开放的载人 eVTOL
              市场，优先支持货运、巡检、公共服务和工业用途。四川—重庆等区域集群也有帮助，因为 Tengden
              的平台比城市空中出租车叙事更适合山区物流、应急响应和长航时任务。中国既有工业基础、认证速度和基础设施投资计划，给国内制造商提供了比大多数西方市场更快、更协调的商业化跑道。


              约束也真实存在，不能靠政策乐观带过。公开来源反复提到审批慢、基础设施滞后和标准缺口，即便法律框架正在改善。载人 eVTOL 面临尤其困难的技术和运营成本约束，但 Tengden
              并未完全隔离在外：其平台仍需要获批航线、安全运行走廊、合格机组、维护网络，以及能在试点后继续存在的公共服务或企业预算。此外，公开的军用无人机市场估计仍不透明，出口管制或采购壁垒也可能大幅削减外部 TAM。对
              Tengden 而言，市场故事在需求方向上很强，在可清晰货币化的边界上很弱。
