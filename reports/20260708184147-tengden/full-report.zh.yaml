              缺失的一层是运营深度。本材料库中没有公开来源披露总活跃客户数、复购率、按具名账户划分的收入集中度，或按任务划分的活跃平台利用率。因此，采用应被理解为真实且多垂直，但不能当作量化客户规模证明。即便如此，现有证据足以反驳
