            body: >-
              硬件里程碑存在的地方，部署和可靠性证据最强。官方页面给出规格边界；Army Recognition、Tencent 和货物投放报道显示，D18 在芜湖爬坡生产，完成跨省物流演示和 1.2
              吨应急空投试验。展会和媒体报道也显示，Tengden
              正从概念展示转向可序列化的工业资产。但公开记录在正常运行时间、平均故障间隔、备件物流或维护周期上薄得多——而这些指标正是客户尝试运营大型无人机机队后最重要的东西。


              这种不对称塑造了路线图判断。Tengden
              在公开原型机和平台宽度上很强，在早期工业化上可信，但披露的机队可靠性指标很弱。对民营硬件公司而言，这很正常；但它意味着技术案例仍高度依赖工程宣称和里程碑证据，而不是运营统计。
