  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块图谱
        blocks:
          - type: paragraph
            body: >-
              Tengden 的产品栈最好被理解为家族架构，而不是一款英雄无人机。官方页面把 Twin-Tailed Scorpion 系列呈现为核心固定翼平台家族，最初的 TB-001、动力更强的 TB-001A、复合材料
              TB-001B 和四发 D18 都建立在共同双尾梁逻辑上。围绕该家族的是 Cloud-Roc 运输无人机、水陆两栖的 Turbulent River Dragon 和高原无人直升机 Featherless
              Arrow。放到客户工作流里看，Tengden 销售的是适配任务的飞行器系统，服务侦察、巡逻、应急响应、人工影响天气、货运、测绘，以及海上或高原作业，而不是一款通吃所有场景的机体。


              这种产品组合宽度在技术上重要，因为它把工程投入分散到跑道固定翼、重载货运、两栖和直升机等部署模式，同时保留冗余、任务载荷模块化、复杂环境适应等共同产品
              DNA。因此，公司更接近一家构建产品家族的系统公司，而不是单一 SKU 无人机供应商。产品线异常宽。
