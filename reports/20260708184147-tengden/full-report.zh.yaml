      - number: '7.2'
        title: 监管、法律和地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险不寻常，因为 Tengden 同时跨在国内产业政策和海外采购猜疑之间。国内，低空经济正通过立法、NDRC 机构化和地方产业政策获得支持。海外，尤其在美国盟友生态中，外国制造无人机限制、Blue
              UAS 可信供应规则、FCC 行动和出口政策讨论正朝相反方向移动。Tengden 不需要进入每一个西方市场才能成功，但趋势明显缩窄其可出口
              TAM，也会让公司更难卖给原本最具信用、最有参考价值的高信任政府、基础设施或公共安全买方。


              申报材料内部还有一层法律合规问题：社保缺口、税收政策依赖和持续亏损可能性都被披露为风险。单独看，没有一项是致命的；合在一起，它们强调公司仍处于建设期，而不是低意外的运营期。实践中，这意味着 Tengden
              可以在中国受到战略支持，同时也会被那些本应最具信用、最有示范价值的海外买方筛掉。
