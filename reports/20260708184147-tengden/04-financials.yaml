- id: capital-adequacy-and-expansion
  title: Capital adequacy, financing dependency, and expansion capex
  body: 'Capital access is currently the strongest part of Tengden''s financial profile. The IPO filing targets RMB 3.021 billion of fresh proceeds, and multiple 2025-2026 articles show that the company already completed large private rounds, including a 2023 financing above RMB 1 billion that pushed valuation above RMB 12.2 billion. Wuhu build-out reporting also points to meaningful industrial-capex ambitions, with a D18-focused base framed around up to RMB 2 billion of investment and annual capacity above 50 fixed-wing UAVs.


    What public evidence still cannot answer is cash adequacy. The filing excerpts available in public text disclose no simple headline cash-on-hand, no monthly burn, no runway, and no explicit debt burden summary that can be trusted without the full data room. The company therefore looks financeable, not cleanly self-funding. Its survival and expansion depend on continuing access to state-linked capital, IPO proceeds, or both.'
