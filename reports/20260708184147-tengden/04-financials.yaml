company:
  name: Tengden
chapter:
  number: 4
  title: Financials
  summary: 'Tengden’s 2026 IPO filing makes it one of the more transparent private Chinese UAV companies: revenue rose from RMB 174.75 million in 2023 to RMB 315.00 million in 2024 and RMB 379.42 million in 2025, while attributable net losses remained heavy at roughly RMB 468.81 million, RMB 364.48 million, and RMB 425.73 million. Gross margin improved from 11.04% to 27.40% before easing to 24.21%, but R&D stayed extremely high at 118.66%, 57.97%, and 55.78% of revenue, top-five-customer concentration stayed above 76%, and receivables remained large relative to sales. Public evidence therefore supports real growth and strong capital access—including a 2023 financing above RMB 1 billion and a 2026 IPO raise target of RMB 3.021 billion—but not stand-alone financial maturity or low-capital-intensity economics.'
sections:
- id: revenue-model-and-growth
  title: Revenue model and growth quality
  body: 'Tengden''s public financial story is unusually visible for a private defense-and-industrial UAV manufacturer because its 2026 ChiNext filing exposes three years of operating data. The revenue model itself is still only partly disclosed: the company says it researches, produces, sells, and services high-end UAV systems for defense equipment, low-altitude-economy applications, and general aviation, but it does not publish the equivalent of SaaS ARR, per-aircraft pricing, service attach rates, or contract duration. Public evidence therefore supports a hardware-plus-systems-and-services model, not a clean recurring-software story.


    The most important takeaway is that scale is real but still modest relative to the capital deployed and the valuation narrative. Revenue rose sharply from 2023 to 2025, yet the company remained deeply loss-making throughout the period. That pattern is common in strategic hardware categories with long product cycles and large R&D loads, but it means investors must underwrite Tengden as a capital-intensive platform bet rather than as a near-term profitable drone OEM.'
