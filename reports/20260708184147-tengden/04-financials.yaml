- id: cost-structure-and-earnings
  title: Cost structure, margins, and earnings quality
  body: 'The filing gives a clearer read on cost structure than on monetization quality. Gross margin improved substantially from 2023 to 2024 and remained above the 2023 baseline in 2025, suggesting that mix, scale, or manufacturing learning helped. But the company still spent more than half of revenue on R&D in each of the three reported years, and in 2023 R&D exceeded revenue entirely. That alone explains why revenue growth did not translate into profitability.


    Two other signals matter. First, customer concentration is extremely high: the top five customers represented the large majority of revenue in all three years, which means growth quality is entangled with a small account set and likely with state or program concentration. Second, receivables were a large share of revenue, consistent with long collection cycles and project-based selling. These are not automatically disqualifying for a defense-and-industrial supplier, but they make the business financially riskier than a headline unicorn valuation might imply.'
