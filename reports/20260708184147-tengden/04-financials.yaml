- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is that Tengden has real topline traction, improving gross economics, and unusually strong access to policy-aligned capital, but still fails the test of stand-alone financial maturity. The business is growing, yet losses remain large, R&D intensity remains extreme, customer concentration is high, and working-capital demands appear material.


    That does not make the story unattractive. In strategic Chinese UAV categories, public investors may tolerate losses if the company is seen as a national-capability asset with credible volume growth and eventual margin leverage. But it does mean the underwriting burden shifts to a narrower set of diligence asks: delivered backlog, segment revenue by defense versus civil, cash and debt position, service revenue mix, customer renewal depth, and the margin path once current expansion spending normalizes. Until those are answered, Tengden''s financial case should be read as financeable and growing, not yet de-risked. The filing is useful, but not sufficient on its own.'
