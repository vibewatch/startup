- id: comparable-set-and-scenarios
  title: Comparable set and bull/base/bear scenarios
  body: 'Public comparables do not offer a clean like-for-like, but they are still useful guardrails. EHang, a Chinese advanced-air-mobility public company, had a July 2026 market cap of roughly USD 0.42 billion and guided to around RMB 600 million of 2026 revenue while still loss-making; that is a far lower valuation scale than Tengden’s implied USD ~1.7 billion private mark. U.S. and allied defense or UAV-adjacent public companies such as AeroVironment, Kratos, Textron, Elbit, Boeing, and Lockheed all sit at much larger market caps, but they also come with either far more revenue, more diversified defense exposure, stronger trust positioning, or established public-market liquidity.


    That leaves Tengden in an awkward middle zone. It is much earlier and riskier than listed defense-industrial companies, yet already priced far above many emerging-air-mobility or niche-UAV valuations on a sales basis. The comps therefore support a disciplined, option-aware approach rather than a momentum-chasing one. The right use of public comps is therefore to bound optimism, not to deliver a fake-precision peer multiple.'
