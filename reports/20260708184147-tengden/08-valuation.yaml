  - id: CV012
    statement: That band implies a wide possible post-money valuation range of roughly RMB 12.1 billion to RMB 30.2 billion.
    type: estimated
    topic: ipo-range
    sourceRefs:
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV013
