company:
  name: Tengden
chapter:
  number: 8
  title: Valuation
  summary: 'Tengden is a strategically interesting but expensively framed private UAV company. Public sources point to a 2023 financing above RMB 1 billion at a valuation above RMB 12.2 billion, while the 2026 IPO structure implies a very broad possible post-money range of roughly RMB 12.1 billion to RMB 30.2 billion depending on issuance percentage. Against 2025 revenue of RMB 379.42 million and continued losses, the known valuation anchor already implies roughly 32x trailing sales—difficult to justify for a capital-intensive, loss-making defense-and-industrial hardware company without much stronger evidence of repeat programs and margin inflection. Public comps reinforce caution: EHang’s July 2026 market cap was about USD 0.42 billion despite 2026 revenue guidance of roughly RMB 600 million, while larger listed defense or UAV-adjacent companies trade at much bigger market caps but also have vastly greater scale and trust positioning. The recommendation is therefore price-disciplined: pass
    at the known private mark absent stronger evidence, and only engage at a meaningful discount or with materially better diligence.'
sections:
- id: thesis-and-antithesis
  title: Investment thesis and anti-thesis
  body: 'The core investment thesis for Tengden is strategic scarcity. China has relatively few private companies with a public three-year financial record, a visible large-UAV product family, and credible links to both defense-adjacent and industrial low-altitude use cases. If the TB-001 lineage, D18 cargo buildout, and low-altitude-economy policy tailwinds convert into repeat programs, Tengden could become one of the few scaled independent large-UAV champions in China outside the biggest state conglomerates.


    The anti-thesis is that strategic scarcity is already overcapitalized in the private valuation. The company is still loss-making, its revenue base is small, its customer and working-capital profile are risky, and trusted-market export paths are constrained. Public evidence therefore supports a company with real option value, but not a price that can be accepted casually.'
