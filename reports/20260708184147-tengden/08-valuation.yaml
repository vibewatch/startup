  claims:
  - id: CV001
    statement: The strongest bull-case thesis is that Tengden could become one of the few scaled independent large-UAV champions in China outside the biggest state conglomerates.
    type: inferred
    topic: bull-thesis
    sourceRefs:
    - SV001
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: The strongest anti-thesis is that strategic scarcity and industrial-policy enthusiasm are already overcapitalized in the private valuation.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV001
    - SV002
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: Tengden has genuine strategic relevance because it combines product breadth, defense-adjacent demand, and low-altitude-economy optionality.
    type: inferred
    topic: strategic-relevance
    sourceRefs:
    - SV001
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV004
    statement: That relevance does not erase losses, concentration, working-capital risk, or export friction, which all directly reduce acceptable valuation.
    type: inferred
    topic: valuation-counterweight
    sourceRefs:
    - SV001
    - SV002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
    - QV017
  - id: CV005
    statement: 'The investment case is therefore symmetric: strong strategic upside, but only at a disciplined entry price.'
    type: inferred
    topic: symmetry
    sourceRefs:
    - SV001
    - SV002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
    - QV018
  - id: CV006
    statement: Public evidence supports option value, not a no-brainer premium.
    type: inferred
    topic: option-value
    sourceRefs:
    - SV001
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
    - QV017
  - id: CV007
    statement: The IPO process can validate or disprove the current narrative because it forces a public price-clearing event.
    type: inferred
    topic: ipo-optionality
    sourceRefs:
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV020
  - id: CV008
    statement: Until that happens, current valuation must be judged against incomplete but still cautionary public evidence.
    type: inferred
    topic: incomplete-evidence
    sourceRefs:
    - SV001
    - SV002
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV017
  - id: CV009
    statement: 36Kr reports Tengden’s valuation exceeded RMB 12.2 billion after a more-than-RMB-1-billion financing in 2023.
