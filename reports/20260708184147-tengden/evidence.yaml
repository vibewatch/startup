evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Named board members, committee structure, and a full governance summary after the IPO filing.
    whyItMatters: >-
      Without board detail, investors cannot judge independence, defense-policy oversight, or related-party control
      quality.
    diligencePath: Request the full draft prospectus, board roster, and shareholder agreements from management or the sponsor.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: 2025-d-round
    missingEvidence: Round size, valuation, security terms, and board rights for the June 2025 D round.
    whyItMatters: The latest private mark and preference stack drive entry price discipline and dilution risk.
    diligencePath: Obtain the June 2025 financing documents or a verified cap-table update.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current audited or board-approved employee count by site and function.
    whyItMatters: Public headcount disclosures range from 900+ to 1,100+, making scale comparisons noisy.
    diligencePath: Request an HR snapshot by location, R&D versus production versus operations, and contractor use.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, order backlog, and runway as of the IPO filing period.
    whyItMatters: Overview-level valuation, capital-adequacy, and IPO-need assessment remain incomplete without liquidity data.
    diligencePath: Use the full prospectus financial statements and management discussion to populate cash, debt, and backlog.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: Revenue split by defense, military trade, weather, logistics, and other civil verticals.
    whyItMatters: >-
      Business-model concentration and export-risk exposure cannot be underwritten from product/deployment anecdotes
      alone.
    diligencePath: Request segment revenue, top-customer list by vertical, and active-platform deployment counts.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      A source-backed SAM or SOM specifically for large fixed-wing industrial, defense, cargo, and public-service UAVs
      relevant to Tengden.
    whyItMatters: >-
      Macro low-altitude-economy headlines are too broad to underwrite revenue potential or valuation multiples for this
      company.
    diligencePath: >-
      Request Tengden management segmentation, delivered-platform counts, and backlog by mission type; triangulate with
      procurement data and route economics.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: procurement-conversion
    missingEvidence: Repeat-order rates, paid-route utilization, and procurement conversion from pilots to scaled programs.
    whyItMatters: Deployment anecdotes do not prove durable market demand or recurring spend.
    diligencePath: >-
