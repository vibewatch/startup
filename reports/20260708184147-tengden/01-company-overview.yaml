- id: capital-trajectory-and-disclosure-step-up
  title: Capital trajectory and disclosure step-up
  body: 'The biggest shift in Tengden’s public evidence set is the 2025-2026 IPO process. Qichacha’s IPO panel shows counseling filing on 2025-07-02, counseling completion on 2026-05-24, acceptance by SZSE on 2026-06-16, and inquiry on 2026-06-25. The filing package and downstream coverage say Tengden is seeking RMB 3.021 billion with CICC as sponsor, Tianjian as auditor, and King & Wood Mallesons Chengdu as counsel. That filing finally surfaces hard financials: revenue of RMB 174.75 million in 2023, RMB 315.0 million in 2024, and RMB 379.42 million in 2025; persistent net losses; gross margin that improved but remained volatile; and heavy R&D spending that still consumed more than half of revenue in 2025. The prospectus also surfaces severe customer concentration, with the top five customers contributing more than three quarters of sales in each reported year.


    Private-market signaling is directionally strong but still incomplete. 36Kr and Eastmoney both say Tengden raised more than RMB 1 billion in 2023 and crossed a RMB 12.2 billion private valuation, while PitchBook-style aggregators and private-market trackers place the company around $1.7 billion. Eastmoney additionally reports a June 2025 D round with institutional investors but without disclosed size or valuation. The central capital-markets takeaway is that Tengden has attracted enough capital and policy support to pursue a very large IPO, yet the current filing still leaves investors without the clean post-2025 mark, preference stack, or liquidity profile needed to decide whether the valuation is justified. The planned IPO itself is roughly eight times 2025 revenue, which is a reminder that the underwriting debate is still about future strategic relevance rather than present financial maturity.'
