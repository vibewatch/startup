company:
  name: Tengden
chapter:
  number: 1
  title: Company Overview
  summary: Tengden is a Chengdu-based large-UAV manufacturer founded in 2016 by former Chengdu Aircraft Design Institute executive Nie Haitao. Public evidence now anchors the company through a live ChiNext IPO process, visible product breadth across the Double-tailed Scorpion family and cargo UAVs, and reported unicorn financing, but also shows persistent losses, high customer concentration, conflicting headcount signals, and deep military/geopolitical exposure. The overview supports a serious engineering franchise with improved disclosure, not yet a cleanly underwritten business.
sections:
- id: identity-footprint-and-product-scope
  title: Identity, footprint, and product scope
  body: 'Tengden is not a concept-stage drone startup; it is a Chengdu-headquartered large-UAV manufacturer with a legally visible industrial footprint, a defined product family, and a public IPO process. Qichacha and the sponsor filing anchor the legal entity as Sichuan Tengden Sci-tech Innovation Co., Ltd., incorporated on 2016-09-26, while the company’s own surfaces describe a 2016 founding and position it as a leading domestic enterprise in intelligent aerial-vehicle research, manufacturing, and application solutions. Public filings and the contact page place the headquarters at 50 Jinke East Road in Chengdu’s Jinniu High-tech Industrial Park, and the registered business scope goes well beyond pure R&D to include aviation services, aircraft parts, UAV air cargo transport, leasing, logistics, and import-export. That matters because later chapters should treat Tengden as a hardware-plus-operations company, not just a defense prototype house.


    The product family is also broader than the Double-tailed Scorpion brand that made the company famous. Official pages show the core TB-001 lineage plus the power-enhanced TB-001A, the localized TB-001B, the four-engine D18 cargo platform, the amphibious Hunjianglong, the Featherless Arrow helicopter, and newer logistics aircraft such as Cloud-Roc. Together these products span twin-engine, triple-engine, and four-engine fixed-wing systems plus amphibious and rotary-wing platforms. Mission claims on the official site cover reconnaissance, patrol, logistics, meteorology, emergency response, cargo drop, and other multi-role use cases. The overview implication is straightforward: Tengden’s identity rests on platform breadth and modular engineering, while the open question is how much of that breadth converts into repeatable revenue rather than demonstration value.'
