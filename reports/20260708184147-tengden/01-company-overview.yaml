- calloutType: risk
  title: The filing surfaces a business that is still early relative to its price
  body: The IPO ask is extremely large relative to current revenue, while losses, R&D intensity, and customer concentration remain high. That does not invalidate the franchise, but it means the overview supports engineering seriousness much more clearly than financial maturity.
  claimRefs:
