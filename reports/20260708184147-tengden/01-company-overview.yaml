- calloutType: insight
  title: Tengden’s identity is inseparable from policy and military context
  body: Tengden’s growth story sits at the intersection of low-altitude-economy industrial policy, PLA-linked demand, and foreign military exports. Any later recommendation must therefore price not only technical upside, but also procurement concentration and geopolitical exclusion risk.
