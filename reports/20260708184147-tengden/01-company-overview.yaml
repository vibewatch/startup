- id: milestones-deployments-and-identity-risks
  title: Milestones, deployments, and identity-level risks
  body: 'Tengden’s milestone record is strong enough to support a real industrial narrative. The product timeline runs from the 2017 TB-001 first flight through the 2019 amphibious and helicopter launches, the 2020 TB-001A, the 2022 TB-001B and D18, and the 2024 Cloud-Roc. Recent scale signals include the June 2025 launch of the Wuhu D18 final-assembly line, a reported RMB 2 billion local industrial-park buildout, and CASI’s observation that Tengden’s Zigong phase-II site covered roughly 45,000 square meters with local coverage projecting 200 large UAVs a year. Civil deployment proof exists as well: Global Times reported Tengden’s weather-modification UAV supporting the Yibin wildfire response, and Changjiang Daily reported a 1.2-ton D18 cargo airdrop test aimed at emergency-rescue scenarios.


    The same evidence set also reveals why Tengden deserves a risk-heavy identity framing. CASI explicitly ties TB-001 variants to likely PLA Rocket Force and PLA Navy procurement or evaluation, while March 2025 export reporting linked the TB-001K to Morocco. Those facts are not incidental; they shape every later discussion about customers, competition, regulation, and valuation. Tengden’s honors, patents, and product breadth support the claim that it is one of China’s more serious large-UAV platforms, and 36Kr argues a successful IPO would make it Chengdu’s fourth listed drone company. But the company’s identity is inseparable from military exposure, customer concentration, and incomplete disclosure on board structure, cash, and customer mix. Later chapters should therefore treat the overview as proven on engineering seriousness and still unproven on monetization durability and investability at the implied price.'
