- id: founder-bench-and-governance
  title: Founder, bench, and governance
  body: 'Nie Haitao is the key person in Tengden’s public narrative. Qichacha and independent coverage identify him as chairman and legal representative, and outside reporting traces his pedigree to the Chengdu Aircraft Design and Research Institute, where he reportedly participated in the J-10 and FC-1 fighter programs. That background helps explain why Tengden was able to assemble a product line that looks more like a systems house than a hobbyist drone company. The workforce signal is consistent: independent recruiting pages show hiring across overall design, aerodynamics, structures, power, control laws, mission systems, payload integration, and software, while a 2025 campus posting describes 11 domains and 77 specialties with a large pool of senior and award-winning engineers.


    Governance, however, is only partially illuminated. Eastmoney describes a dispersed ownership base in which Nie controls 23.57% of voting rights through direct and concert-party arrangements, while Qichacha shows a wide shareholder roster and a largest disclosed shareholder at only 10.62%. Public sources therefore suggest founder-led control without a clean majority owner. Headcount disclosure is also noisy: the official about page says 900-plus employees, while a recruiting profile says 1,100-plus. Those inconsistencies do not invalidate the broader point that Tengden has scale, but they do mean later financial and organizational comparisons should avoid false precision. The missing board roster, committee structure, and post-D-round cap-table terms are the clearest overview-level governance gaps.'
