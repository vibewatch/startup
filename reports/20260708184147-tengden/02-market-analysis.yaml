callouts:
- calloutType: strength
  title: Policy timing favors Tengden’s category
  body: China’s low-altitude economy is being organized around cargo, inspection, industrial, and public-service use cases before fully open passenger-eVTOL markets. That sequencing is unusually favorable to Tengden’s heavy fixed-wing, weather, emergency, and cargo platforms.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM017
  - CM036
  - CM037
- calloutType: risk
  title: Big macro TAM, weak company-specific SAM
  body: Official projections make the low-altitude economy look enormous, but most public numbers are too broad to underwrite Tengden. Without segment revenue, route economics, and delivered-platform counts, a trillion-yuan headline is a backdrop, not a valuation anchor.
  claimRefs:
