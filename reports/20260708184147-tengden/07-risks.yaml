  claims:
  - id: CR001
    statement: The filing, customer evidence, and policy sources together show Tengden’s most important risks are geopolitical restriction, capital intensity, customer concentration, and operational execution.
    type: inferred
    topic: risk-map
    sourceRefs:
    - SR013
    - SR016
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR002
    statement: Geopolitical and export restriction risk is structural because it arises from product category and country-of-origin trust issues, not from one temporary event.
    type: inferred
    topic: structural-geopolitical
    sourceRefs:
    - SR001
    - SR005
    - SR010
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR003
  - id: CR003
    statement: Capital-intensity risk is active because Tengden remains loss-making while still funding R&D and manufacturing scale-up.
    type: inferred
    topic: capital-risk
    sourceRefs:
    - SR013
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR004
    statement: Customer concentration risk is active because the filing shows top-five customers accounted for a large majority of revenue in every reported year.
    type: third-party-reported
    topic: customer-concentration
    sourceRefs:
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR005
    statement: Operational reliability risk is high because the company flies large mission systems in difficult environments without public fleet-level reliability disclosure.
    type: inferred
    topic: operational-risk
    sourceRefs:
    - SR016
    - SR017
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR006
    statement: These are thesis-level rather than housekeeping risks because each can directly damage growth, valuation, or market access.
    type: inferred
    topic: thesis-level
    sourceRefs:
    - SR013
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR007
    statement: The right underwriting question is therefore about mitigation quality and trigger conditions, not about whether the risks exist.
    type: inferred
    topic: framing
    sourceRefs:
    - SR013
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR019
    - QR021
  - id: CR008
    statement: Tengden should be treated as a high-friction strategic hardware program rather than as a low-risk growth company.
    type: inferred
    topic: overall-framing
    sourceRefs:
    - SR013
    - SR015
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR025
  - id: CR009
    statement: 'Domestic Chinese policy is directionally supportive: NDRC institutionalization and legal upgrades are intended to accelerate low-altitude-economy development.'
    type: observed
    topic: domestic-support
    sourceRefs:
    - SR019
    - SR020
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR010
    statement: 'Foreign policy direction is more hostile: Blue UAS, FCC foreign-made-drone determinations, and congressional actions point toward tighter trusted-supply standards in U.S.-aligned markets.'
    type: observed
    topic: foreign-hostility
    sourceRefs:
    - SR005
    - SR006
    - SR010
    - SR011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR009
  - id: CR011
    statement: The State Department and congressional materials show the U.S. policy trend is to make allied access easier for domestic systems and harder for Chinese-origin ones in trusted channels.
    type: inferred
    topic: policy-trend
    sourceRefs:
    - SR008
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR023
  - id: CR012
    statement: That policy divergence does not eliminate Tengden’s export options, but it does narrow access to high-trust government and critical-infrastructure customers.
    type: inferred
    topic: tam-constrain
    sourceRefs:
    - SR005
    - SR010
    - SR011
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR009
  - id: CR013
    statement: The filing itself discloses social-insurance and housing-fund compliance gaps for some employees.
    type: third-party-reported
    topic: labor-compliance
    sourceRefs:
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR014
    statement: The filing also warns of continued losses, revenue fluctuation, gross-margin decline risk, and tax-policy dependence.
    type: third-party-reported
    topic: filing-risk-factors
    sourceRefs:
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
    - QR011
  - id: CR015
    statement: Taken together, Tengden faces the unusual combination of supportive home-market policy and restrictive foreign trusted-procurement trends.
    type: inferred
    topic: policy-asymmetry
    sourceRefs:
    - SR019
    - SR020
    - SR005
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR023
  - id: CR016
    statement: CASI’s framing of Tengden as a PLA-and-civil supplier reinforces why foreign trust screens matter more here than for an ordinary industrial drone company.
    type: third-party-reported
    topic: pla-trust-risk
    sourceRefs:
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR023
  - id: CR017
    statement: Legal and regulatory risk is therefore medium domestically and high internationally.
    type: inferred
    topic: regulatory-verdict
    sourceRefs:
    - SR013
    - SR015
    - SR019
    - SR020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR025
  - id: CR018
    statement: Large multi-engine cargo and ISR UAVs inherently create more safety, maintenance, and route-management risk than small consumer drones.
    type: inferred
    topic: large-uav-complexity
    sourceRefs:
    - SR016
    - SR017
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
  - id: CR019
    statement: Official Tengden pages emphasize redundancy, power margin, anti-icing, and modularity, which are useful mitigations but not substitutes for disclosed reliability statistics.
    type: inferred
    topic: mitigation-vs-proof
    sourceRefs:
    - SR017
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
    - QR013
  - id: CR020
    statement: No public source in the corpus disclosed MTBF, dispatch reliability, mean maintenance interval, or spare-part performance for Tengden fleets.
    type: open-question
    topic: reliability-null
    sourceRefs:
    - SR016
    - SR017
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR024
  - id: CR021
    statement: Wuhu industrialization and the 50-plus annual-capacity ambition add manufacturing-ramp and utilization risk on top of flight-system risk.
    type: inferred
    topic: manufacturing-risk
    sourceRefs:
    - SR016
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR014
  - id: CR022
    statement: The operational ecosystem also depends on route approvals, trained operators, and local support infrastructure, which can slow commercialization even when aircraft capability is real.
    type: inferred
    topic: ecosystem-risk
    sourceRefs:
    - SR019
    - SR020
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR014
    - QR015
  - id: CR023
    statement: Partner and channel dependence is meaningful because Tengden appears to benefit from local-government industrial support, state-linked procurement channels, and a still-forming low-altitude operating stack.
    type: inferred
    topic: dependency-stack
    sourceRefs:
    - SR016
    - SR019
    - SR021
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR015
    - QR016
  - id: CR024
    statement: Localization claims on TB-001B and weather-modification variants help supply autonomy, but they do not remove dependence on specialized suppliers and execution quality.
    type: inferred
    topic: supply-chain-risk
    sourceRefs:
    - SR017
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR015
  - id: CR025
    statement: Operational and dependency risks are manageable only if Tengden can show stable repeat missions and support performance, which the public record does not yet do.
    type: inferred
    topic: ops-manageability
    sourceRefs:
    - SR016
    - SR017
    - SR025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR016
    - QR022
  - id: CR026
    statement: Financial-model risk remains acute because Tengden’s losses, R&D intensity, and receivables profile imply ongoing dependence on outside capital.
    type: inferred
    topic: financial-model-risk
    sourceRefs:
    - SR013
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR017
    - QR018
  - id: CR027
    statement: The downside case is not necessarily sudden insolvency; it is prolonged dilution, slower conversion from demos to programs, and disappointment on margin path.
    type: inferred
    topic: downside-shape
    sourceRefs:
    - SR013
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR017
    - QR018
  - id: CR028
    statement: The IPO raise target and prior private rounds are real mitigants because they improve Tengden’s ability to absorb near-term losses.
    type: inferred
    topic: capital-mitigant
    sourceRefs:
    - SR013
    - SR014
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR019
  - id: CR029
    statement: But capital access is not the same as capital adequacy, because public sources still do not provide enough runway and balance-sheet detail.
    type: inferred
    topic: adequacy-gap
    sourceRefs:
    - SR013
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR018
    - QR024
  - id: CR030
    statement: The three most important monitoring indicators are loss trajectory, repeat-program evidence, and any tightening or loosening of trusted-procurement regimes.
    type: inferred
    topic: monitoring-indicators
    sourceRefs:
    - SR005
    - SR010
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR020
  - id: CR031
    statement: A thesis-break event would be clear evidence that demos are not converting into repeat programs despite ongoing capital deployment.
    type: inferred
    topic: thesis-break-1
    sourceRefs:
    - SR016
    - SR024
    - SR025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR021
  - id: CR032
    statement: A second thesis-break event would be further hardening of foreign trusted-supply frameworks that materially closes off non-Chinese government buyers.
    type: inferred
    topic: thesis-break-2
    sourceRefs:
    - SR005
    - SR010
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR021
  - id: CR033
    statement: A third thesis-break event would be revenue growth without corresponding improvement in losses, receivables burden, or margin profile.
    type: inferred
    topic: thesis-break-3
    sourceRefs:
    - SR013
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR021
  - id: CR034
    statement: The best near-term diligence asks are cash/debt detail, delivered-fleet reliability metrics, repeat-order history, and segment revenue by defense versus civil missions.
    type: open-question
    topic: diligence-asks
    sourceRefs:
    - SR013
    - SR016
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR024
  - id: CR035
    statement: 'The overall risk verdict is high severity but still analyzable: Tengden’s risks are real, visible, and partly mitigable, but several—especially geopolitical trust barriers—are outside management control.'
    type: inferred
    topic: final-verdict
    sourceRefs:
    - SR005
    - SR013
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR025
  - id: CR036
    statement: The filing’s receivables and concentration data mean financing risk can worsen even if headline revenue keeps growing.
    type: inferred
    topic: cash-conversion-risk
    sourceRefs:
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR017
    - QR028
  - id: CR037
    statement: Morocco-style export proof demonstrates opportunity, but it also highlights that Tengden’s foreign path may concentrate in politically permissive markets rather than diversified trusted ones.
    type: inferred
    topic: export-concentration
    sourceRefs:
    - SR028
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR026
    - QR028
  - id: CR038
    statement: Because operational data are sparse, maintenance, uptime, and failure-mode risk are likely underpriced by headline mission demonstrations alone.
