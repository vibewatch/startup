    topic: ops-underdisclosure
    sourceRefs:
    - SR016
    - SR017
    - SR029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR027
  - id: CR039
    statement: Several important mitigations—trusted-market access, route approvals, ecosystem buildout, and industrial support—depend on external regulators or policy actors more than on Tengden alone.
    type: inferred
    topic: external-mitigation-dependence
    sourceRefs:
    - SR010
