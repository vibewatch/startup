- id: regulatory-and-legal
  title: Regulatory, legal, and geopolitical risk
  body: 'Regulatory and legal risk is unusual because Tengden straddles domestic industrial policy and foreign procurement suspicion. At home, the low-altitude economy is being supported through legislation, NDRC institutionalization, and local-industrial policy. Abroad, especially in U.S.-aligned ecosystems, foreign-made drone restrictions, Blue UAS trusted-supply rules, FCC actions, and export-policy debates are moving in the opposite direction. Tengden does not need access to every Western market to succeed, but the direction of travel clearly narrows its exportable TAM and can complicate any ambitions to sell into high-trust government, infrastructure, or public-safety buyers.


    There is also a legal-compliance layer inside the filing itself: social-insurance gaps, tax-policy dependence, and the possibility of continued losses are disclosed risks. None of these alone is fatal, but together they underline that the company is still in a build-out phase rather than a low-surprise operating phase. In practice, this means Tengden can be strategically favored in China while simultaneously being screened out by precisely the overseas buyers that would otherwise be most creditworthy and reference-worthy.'
