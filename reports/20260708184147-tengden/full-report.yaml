      - number: '8.4'
        title: Recommendation, confidence, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most supportable recommendation is not a categorical rejection, but a price-conditioned pass for now.
              In the bull case, investors could justify a premium valuation if D18 and related logistics platforms scale
              into repeat programs, margins continue to improve, and the IPO process validates strong institutional
              demand. In the base case, Tengden deserves credit for strategic relevance and real growth, but not an
              unconstrained premium against public comps while losses, concentration, and export frictions remain
              unresolved. In the bear case, public markets or secondary buyers could push the company toward a much
              lower hardware-style multiple if growth disappoints or risk perception hardens.


              Accordingly, the valuation stance should be 'only at a substantial discount to the current private mark or
              with materially better evidence.' The final diligence asks are clear: revenue split by segment, backlog,
              cash and debt, repeat-order history, fleet reliability, and actual IPO book-building feedback. Without
              those, paying up for strategic scarcity alone looks premature. Price discipline matters more here than
              narrative enthusiasm.
