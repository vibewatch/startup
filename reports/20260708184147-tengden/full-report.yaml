      - number: '7.4'
        title: Financial-model risk, mitigations, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Financial-model risk is acute because Tengden remains loss-making while investing ahead of scale. The
              filing shows growth, but also very high R&D intensity, large customer concentration, and material
              receivables. That means the downside case is not bankruptcy tomorrow; it is strategic drift: continued
              dilution, slower-than-expected route conversion, margin disappointment, and dependence on policy-driven or
              state-linked capital.


              Mitigation is possible. Investors can monitor three thesis-break triggers: failure to turn D18 and related
              platforms into repeat programs, evidence that export and trusted-supply barriers shut off important
              customer pools, and continued inability to improve cash-conversion and loss profile despite revenue
              growth. The risk verdict is therefore severe but analyzable: Tengden is a high-opportunity, high-friction
              hardware program, not a clean compounder. Better disclosure could lower uncertainty, but it cannot erase
              the category’s underlying friction.
