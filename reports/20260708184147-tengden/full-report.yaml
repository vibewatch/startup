      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the natural consequence of the product set. Large UAVs carrying heavy payloads, flying
              in icing conditions, maritime environments, mountainous terrain, or emergency contexts create more complex
              maintenance and safety demands than small consumer drones do. Public sources are rich on redundancy,
              modularity, and payload capability, but they are weak on failure rates, dispatch reliability, MTBF, and
              service response. D18 industrialization adds manufacturing and training risk on top of aircraft risk.


              Partner and channel dependence intensify those operational issues. Tengden appears to rely heavily on
              local-government industrial support, state-linked procurement logic, specialized supply chains, and a
              still-forming operating ecosystem. If any one of those pieces lags—approvals, engines, flight crews, route
              permissions, or public budgets—the commercial story can stall even if the aircraft themselves are
              technically sound. That is why missing operating statistics are not a cosmetic disclosure problem but a
              material risk amplifier.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
