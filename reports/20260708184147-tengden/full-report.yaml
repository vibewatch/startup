      - number: '8.2'
        title: Current financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Valuation context begins with two public anchors. First, 36Kr says Tengden crossed a valuation above RMB
              12.2 billion after a more-than-RMB-1-billion financing in 2023. Second, the 2026 IPO plan targets RMB
              3.021 billion of fresh proceeds while issuing between 10% and 25% of post-issue shares, implying a very
              broad post-money range from roughly RMB 12.1 billion at the dilutive floor to RMB 30.2 billion at the
              tightest issuance case. The lower end of that range is close to the known unicorn mark; the upper end
              would require an extremely aggressive public-market reception.


              Relative to its own 2025 revenue of RMB 379.42 million, the known RMB 12.2 billion valuation anchor
              already implies roughly 32 times trailing sales. That is rich for a loss-making, hardware-heavy industrial
              and defense UAV company unless investors believe revenue can step up sharply and margins can inflect. That
              asymmetry is exactly why the headline upper-end IPO math should be treated as scenario noise, not as fair
              value.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
