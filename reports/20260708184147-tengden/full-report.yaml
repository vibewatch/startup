  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk map
        blocks:
          - type: paragraph
            body: >-
              Tengden's risk profile is dominated by four first-order exposures: regulatory and geopolitical constraint,
              capital intensity and persistent losses, customer and channel concentration, and operational complexity of
              large UAV systems in difficult environments. These are not speculative edge cases. The IPO filing itself
              discloses continued losses, high R&D, large customer concentration, and margin volatility; CASI and
              export-policy sources show the company sits in a politically sensitive category; and the product family's
              own design logic—heavy payloads, plateau operation, maritime use, weather modification, and multi-engine
              systems—implies nontrivial maintenance and flight-safety demands.


              The right framing is therefore not 'Are there risks?' but 'Which risks can break the thesis and which are
              manageable if priced correctly?' Tengden is investable only if the geopolitical, financing, and execution
              risks are treated as central rather than incidental. Investors should also remember that the company is
              exposed to a compound-risk stack, where several moderate shocks can interact and magnify each other. This
              compounds downside volatility materially. Over time.
            claimRefs:
