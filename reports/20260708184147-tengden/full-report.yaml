      - number: '3.3'
        title: Moats, channel power, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Tengden's strongest moat is architectural. Its official materials repeatedly emphasize modular fuselages,
              open mission architectures, multi-engine redundancy, and reuse of components across a common platform
              family. That matters because it lets the company address reconnaissance, patrol, weather, cargo, mapping,
              and emergency tasks without restarting from scratch each time. The D18's modular cargo bay, TB-001
              family's shared twin-boom logic, and the amphibious and helicopter adjacencies together create a broader
              application envelope than a single-purpose export UCAV.


              The counterweight is that breadth can be outgunned by scale. AVIC and CASC enjoy stronger state backing,
              deeper export track records, and more visible installed bases in armed-drone markets. Western systems like
              MQ-9A and Aerosonde benefit from allied trust, mature support ecosystems, and procurement eligibility that
              Chinese platforms often lack. Even Tengden's apparent PLA connectivity, which likely helps at home, cuts
              the other way abroad because it reinforces geopolitical and trust barriers. The moat is therefore real in
              platform versatility and Chinese mission fit, but much weaker in global channel power, allied-market
              access, and publicly evidenced switching costs.
