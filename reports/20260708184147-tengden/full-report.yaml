        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Tengden's product stack is best understood as a family architecture rather than as one hero drone.
              Official pages present the Twin-Tailed Scorpion line as the core fixed-wing platform family, with the
              original TB-001, the more powerful TB-001A, the composite TB-001B, and the four-engine D18 all sitting on
              a common twin-boom logic. Around that family sit the Cloud-Roc transport UAV, the amphibious Turbulent
              River Dragon, and the high-altitude unmanned helicopter Featherless Arrow. In customer-workflow terms,
              that means Tengden is selling mission-fit aircraft systems for reconnaissance, patrol, emergency response,
              weather modification, cargo, mapping, and maritime or plateau operations rather than a one-size-fits-all
              airframe.


              That portfolio breadth matters technically because it spreads engineering effort across deployment
              modes—runway fixed wing, heavy cargo, amphibious, and helicopter—while preserving common product DNA such
              as redundancy, mission-payload modularity, and rugged-environment claims. The company is therefore closer
              to a systems-house building a product family than to a single-SKU UAV vendor. The lineup is unusually
              broad.
