  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Tengden is strategic scarcity. China has relatively few private companies
              with a public three-year financial record, a visible large-UAV product family, and credible links to both
              defense-adjacent and industrial low-altitude use cases. If the TB-001 lineage, D18 cargo buildout, and
              low-altitude-economy policy tailwinds convert into repeat programs, Tengden could become one of the few
              scaled independent large-UAV champions in China outside the biggest state conglomerates.


              The anti-thesis is that strategic scarcity is already overcapitalized in the private valuation. The
              company is still loss-making, its revenue base is small, its customer and working-capital profile are
              risky, and trusted-market export paths are constrained. Public evidence therefore supports a company with
              real option value, but not a price that can be accepted casually.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
