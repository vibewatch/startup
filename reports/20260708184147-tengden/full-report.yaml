    sections:
      - number: '4.1'
        title: Revenue model and growth quality
        blocks:
          - type: paragraph
            body: >-
              Tengden's public financial story is unusually visible for a private defense-and-industrial UAV
              manufacturer because its 2026 ChiNext filing exposes three years of operating data. The revenue model
              itself is still only partly disclosed: the company says it researches, produces, sells, and services
              high-end UAV systems for defense equipment, low-altitude-economy applications, and general aviation, but
              it does not publish the equivalent of SaaS ARR, per-aircraft pricing, service attach rates, or contract
              duration. Public evidence therefore supports a hardware-plus-systems-and-services model, not a clean
              recurring-software story.


              The most important takeaway is that scale is real but still modest relative to the capital deployed and
              the valuation narrative. Revenue rose sharply from 2023 to 2025, yet the company remained deeply
              loss-making throughout the period. That pattern is common in strategic hardware categories with long
              product cycles and large R&D loads, but it means investors must underwrite Tengden as a capital-intensive
              platform bet rather than as a near-term profitable drone OEM.
