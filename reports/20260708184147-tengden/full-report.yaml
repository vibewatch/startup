        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Tengden's customer base is best reconstructed by mission and payer, not by a public customer list—because
              the company does not publish one. Official and third-party materials point to five clear customer groups:
              PLA or defense-linked buyers, meteorological and public-safety authorities, local emergency-management
              systems, logistics and cargo-route operators, and industrial or infrastructure users needing patrol,
              mapping, or inspection. In each case, the end user, payer, and buyer can differ materially. A provincial
              emergency department may pay for a rescue-capable cargo platform; a weather bureau may sponsor a
              cloud-seeding aircraft; a military unit may use a reconnaissance platform through an integrator; and a
              local-government-backed industrial park may underwrite a route demonstration.


              That makes Tengden's customer story look real but fragmented. It is not a consumer or simple enterprise
              SaaS customer base. It is a mix of programmatic, government, and mission-specific buyers whose procurement
              cycles are long and whose reference quality depends heavily on public deployment proof. The public
              evidence supports this multi-payer structure clearly.
