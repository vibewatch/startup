  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and rival set
        blocks:
          - type: paragraph
            body: >-
              Tengden does not compete in a single drone market. Its public product family spans long-endurance
              twin-boom ISR/strike aircraft, four-engine cargo drones, amphibious UAVs, and a large unmanned helicopter,
              so the relevant rival set changes by mission. In defense-adjacent MALE and large fixed-wing missions, the
              clearest Chinese reference points are AVIC's Wing Loong line and CASC's CH series, while the international
              benchmarks are systems such as GA-ASI's MQ-9A and Israel's Heron family. In tactical ISR, Textron's
              Aerosonde sits in a much smaller class and therefore acts more as a capability boundary than a direct
              peer.


              Tengden's distinctive position is that it tries to bridge military-style endurance and payload with civil
              logistics, weather, emergency, and inspection use cases. That breadth is a real differentiator, but it
              also means Tengden faces stronger state-backed rivals in military exports and a widening domestic field in
              cargo UAVs. The competitive question is less whether Tengden has capable aircraft than whether its mixed
              civil-military portfolio can win repeat procurement against larger state champions and better-trusted
              Western suppliers.
