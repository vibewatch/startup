              is modularity: the company repeatedly frames the family around plug-and-play payloads, rapid configuration
              changes, and open mission architecture. Third is adaptation to difficult environments such as plateau
              takeoff, icing, maritime operation, and emergency logistics. Those are meaningful moats in Chinese
