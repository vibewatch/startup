  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing discipline
        blocks:
          - type: paragraph
            body: >-
              The temptation with Tengden is to anchor everything on giant low-altitude-economy headlines, but that
              would blur the distinction between passenger eVTOL, consumer or agricultural multicopters, and the much
              narrower slice of heavy industrial and defense UAV demand that Tengden actually serves. Chinese public
              sources define the low-altitude economy broadly as activity below roughly 1,000 meters involving manned
              and unmanned aircraft. That broad definition is useful context, because it explains why the sector has
              become a strategic policy priority and why CAAC- and Xinhua-cited estimates reach RMB 1.5 trillion by 2025
              and RMB 3.5 trillion by 2035. But those top-down numbers are not Tengden’s direct TAM. Daxue and other
              market commentators explicitly show how much of the ecosystem sits in downstream operations, small drones,
              infrastructure, and passenger-eVTOL narratives that do not map cleanly to large fixed-wing platforms.


              The right boundary for Tengden is narrower: defense UAV procurement, heavy cargo/logistics UAVs,
              weather-modification aircraft, emergency/public-safety deployments, and industrial inspection or patrol
              systems that reward endurance, payload, and rugged-terrain performance. That framing still sits inside a
              large market, but it is no longer a simplistic trillion-yuan story. Public evidence strongly supports a
              huge enabling backdrop; it does not yet isolate a source-backed SAM or SOM for Tengden. That is why the
              sizing lens in this chapter preserves multiple public estimates and ends with a deliberate gap rather than
              a false-precision target.
