companyProfile:
  summary: Tengden (Sichuan Tengden Sci-tech Innovation Co., Ltd.) is a Chengdu-based large-UAV developer founded in 2016 by former Chengdu Aircraft Design Institute executive Nie Haitao. The company develops the Double-tailed Scorpion series, cargo UAVs, amphibious UAVs, and unmanned helicopters for defense, logistics, emergency response, meteorology, and other industrial uses. Public disclosure has improved materially because the company entered ChiNext IPO review in 2026, but important underwriting questions remain around customer concentration, sustained losses, export exposure, and governance.
  foundedDate: '2016-09-26'
