  customerFocus: Military and security users, emergency-management and meteorological agencies, logistics operators, and other industrial/government operators.
  businessModel: Hardware and system sales plus related services for defense and industrial UAV deployments; specific pricing and recurring-service mix remain lightly disclosed.
