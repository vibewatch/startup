  topStrengths:
  - Strong large-UAV product breadth across twin-engine, triple-engine, four-engine, amphibious, helicopter, and cargo platforms.
  - Founder and engineering bench have rare aerospace pedigree and visible large-system design capability.
  - IPO filing has improved visibility into revenue, losses, customer concentration, and risk factors versus typical Chinese private defense tech.
  topRisks:
  - High dependence on defense and government demand creates geopolitical, procurement, and export risk.
  - The company remains loss-making and is seeking to raise an amount far above current annual revenue.
  - Customer concentration and late-year revenue recognition reduce quality and predictability of reported growth.
  unresolvedGaps:
  - Exact post-2025 valuation and round size for the June 2025 D round remain undisclosed.
  - Public sources do not fully disclose standalone cash, burn, runway, or board composition.
  - Revenue split between defense, cargo logistics, weather, and other civil uses remains unclear.
disclaimer: Assessment is based on public evidence available through the 2026-07-08 run date; private-order backlog, cash, and detailed governance remain under-disclosed.
