- id: capability-and-segment-comparison
  title: Capability and segment comparison
  body: 'On paper, Tengden''s flagship platforms are credible. Official materials describe the original TB-001 as a 20-meter-wingspan, 2.8-ton MTOW, 35-hour-endurance twin-engine platform, the TB-001A as a 3.6-ton, 50-hour triple-engine enhancement, and the TB-001B as a 1.95-ton, 46-hour composite-structure variant with localized onboard components. The D18 shifts the family toward logistics with a 4.35-ton MTOW and 1.8-ton payload, while the Cloud-Roc transport UAV pushes to a 2-ton payload and 12-cubic-meter cargo bay.


    But capability claims need context. Army Recognition''s Wing Loong II analysis describes a 20.5-meter-wingspan platform with around 480 kilograms of external payload and 20 to 32 hours of endurance, while the MQ-9A benchmarks at more than 27 hours of endurance and roughly 1.7 tonnes of payload. CASC''s CH-4 sits below those heavier systems on payload but has broad export diffusion. This leaves Tengden in an unusual middle ground: longer-endurance published figures than many peers on some variants, meaningful cargo specialization on D18 and Cloud-Roc, but far less public evidence on fleet scale, utilization, and repeat contract wins than the best-known international programs.'
