  title: Tengden competes on breadth, not just one airframe
  body: Official materials show a coherent family spanning long-endurance ISR aircraft, heavy cargo UAVs, an amphibious platform, and a large unmanned helicopter. That breadth is unusual for a private UAV maker and is a real competitive asset in China.
