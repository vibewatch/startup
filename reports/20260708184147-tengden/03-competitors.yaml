- id: competitive-verdict
  title: Competitive verdict for Tengden
  body: 'The competitive verdict is constructive inside China and selective abroad. Tengden clearly belongs in the top tier of Chinese independent large-UAV manufacturers by product breadth, endurance-oriented design, and willingness to commercialize heavy cargo aircraft. Morocco''s reported TB-001K acquisition and the Wuhu D18 production build-out show that Tengden is not confined to prototypes.


    Still, the public record does not show Tengden winning the scale game against the largest state champions, and it does not show a broad international customer roster comparable to Wing Loong or CH exports. The most supportable conclusion is that Tengden has a differentiated product family and credible domestic relevance, but a moat that remains narrower than the marketing suggests because procurement trust, channel power, and delivered-fleet data are still under-disclosed.'
