- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Bull read
  - Bear read
  - What would change the view
  rows:
  - - National specialty brand relevance
    - Dense store base and investor quality support strategic relevance
    - Strategic relevance can still coexist with weak economics
    - Audited mature-store cohorts
  - - Direct-operated model
    - Protects consistency and brand control
    - Keeps capital intensity and execution burden at HQ
    - Store-level payback and margin proof
  - - Premium-accessible positioning
    - Differentiates from pure discounters and high-price cafes
    - Can be squeezed by both discount anchors and premium expectations
    - Same-store resilience through a price-war cycle
  - - IPO narrative
    - Could improve disclosure and liquidity
    - Can also inflate expectations before economics are proven
    - Draft prospectus-quality financial package
  notes: Manner's thesis and anti-thesis can both be true until disclosure resolves the economic argument.
