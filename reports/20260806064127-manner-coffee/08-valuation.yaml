  - CV033
  - CV038
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited revenue and EBITDA
    - No public audited P&L for Manner
    - Shrinks valuation uncertainty immediately
    - Request latest audited financial statements
  - - Store cohorts and same-store sales
    - No public cohort deck or mature-store metrics
    - Determines whether scale quality matches narrative
    - Request store cohort pack by city and vintage
  - - Cap table and preferences
    - No public preference stack or dilution data
    - Changes return math materially
    - Request cap table and investor-rights summary
  - - Controls and incident metrics
    - No public KPI pack on complaints, audits, or staffing
    - Tests whether risk discount should narrow
    - Request compliance and operations dashboard
  notes: Replacing proxies with private evidence would tighten the range far faster than adding more media commentary.
