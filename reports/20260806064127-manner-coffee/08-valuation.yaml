- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Traffic holds but margin quality disappoints; opacity discount stays high
    - US$2.0B-US$2.4B
    - Price war, labor strain, weak mature-store economics
    - Possible if new disclosure is underwhelming
  - - Base
    - Brand relevance holds; economics are decent but not exceptional; disclosure improves partially
    - US$2.6B-US$3.0B
    - Disclosure remains incomplete and public investors stay selective
    - Most supportable from current public evidence
  - - Bull
    - Mature-store payback, same-store sales, and controls beat proxies; IPO prep sharpens credibility
    - US$3.2B-US$3.8B
    - Evidence must catch up to the narrative quickly
    - Needs audited validation
  - - Rich tail
    - Banker or momentum-driven valuation stretches toward top rumor range
    - US$4.0B-US$4.5B
    - Narrative outruns provable economics
    - Not a disciplined underwriting base today
  notes: The corridor is deliberately wide because evidence about Manner's mature economics remains partial.
