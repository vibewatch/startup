- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - What it contributes
  - Status or filing surface
  - Relevance
  - Limitation
  rows:
  - - Luckin Coffee
    - Closest disclosed China coffee scale comp
    - 20-F plus 2025-2026 results
    - Best disclosure proxy for coffee habit and margin pressure
    - Larger, more digital, different governance history
  - - Starbucks
    - Premium benchmark and global disclosure standard
    - 10-K plus IR surfaces
    - Useful for premium brand economics and China context
    - Global diversification and seating model distort transferability
  - - Mixue
    - Value-pole beverage comp
    - HKEX prospectus
    - Helps bracket discount-scale valuation logic
    - Very different price architecture and operating model
  - - Nayuki
    - HK public-market beverage disclosure reference
    - IR financial-report surface
    - Shows what listed branded beverage scrutiny looks like
    - Category and market history differ materially
  notes: No single comp is sufficient; the value comes from how the set brackets Manner from several angles.
