- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak mature-store economics
    - Payback or mature margins materially below proxy expectations
    - Premium narrative loses credibility
    - Cut range and pause conviction
  - - Service / labor control not improving
    - Another widely visible incident or rising complaint rates
    - Execution discount widens
    - Require operational remediation evidence
  - - Opaque IPO prep
    - Management cannot provide prospectus-quality financial pack
    - Narrative premium remains unsupported
    - Keep to track / watchlist
  - - Public comp multiple compression
    - China coffee or beverage multiples de-rate further
    - Ceiling range should move lower
    - Re-cut scenario table
  notes: The chapter treats kill triggers as measurable evidence failures, not vibes.
  claimRefs:
