- id: peer-set-and-valuation-method
  title: Peer set and valuation method
  body: 'The most defensible method for Manner is scenario-based comparable analysis rather than a bottom-up DCF. A DCF would create the illusion of rigor while hiding the absence of audited revenue, capex, working-capital, and cash-flow data. Public comps are still useful, but each one plays a different role. Luckin is the closest disclosed Chinese coffee comp on habit, convenience, and price pressure; Starbucks represents a premium-branded China benchmark with very different cost structure; Mixue is a value-pole bracket; and Nayuki shows what Hong Kong public scrutiny looks like for a branded beverage chain. None is perfect, but together they define the corridor. The other important choice is how to use Manner’s unit-economics anecdotes. Coffinance’s figures are interesting enough to shape scenario intuition, yet not robust enough to anchor a single multiple. The chapter therefore weights public filings and disclosure standards more heavily than one-off economics claims. That keeps the
    conclusion honest: Manner may deserve a premium private narrative, but not false precision.'
  claimRefs:
