- id: TP003
  title: Pricing / packaging comparison
  columns:
  - competitor
  - public price anchor
  - packaging / format bias
  - promotional posture
  - rivalry implication
  rows:
  - - Manner Coffee
    - RMB15-RMB25 core range
    - Small direct-operated coffee bars and pickup-oriented stores
    - Not publicly framed around extreme subsidy pricing in retained pack
    - Defends the middle lane between premium cafés and discount chains
  - - Luckin Coffee
    - Value-focused; exact stable price grid not retained here
    - Pickup-heavy and delivery-integrated digital chain
    - Heavy launch and promotion engine is visible
    - Most dangerous where frequency, convenience, and app habit dominate
  - - Starbucks China
    - Premium umbrella; higher-spend positioning than Manner
    - Sit-down café and loyalty-oriented experience
    - Promotions exist, but premium status is the core lever
    - Anchors the high end and shapes willingness-to-pay
  - - Cotti Coffee
    - RMB9.9 campaign cited; convenience-store adjacency widening basket
    - Coffee-led stores plus convenience-style retail items
    - Highly aggressive traffic capture
    - Raises the promotional bar and can pressure basket economics
  - - Peet's Coffee China
    - Around RMB40 for core premium brand; Ora targets roughly RMB15-RMB25
    - Premium coffee plus lower-priced sub-brand experiment
    - Avoids broad price wars; selective delivery only
    - Shows premium brands may need a second format to stay relevant
  - - M Stand
    - No stable retained list-price grid in current pack
    - Boutique flagship-store emphasis
    - Not retained as a promo-led chain
    - Closer quality benchmark than volume benchmark for Manner
  - - Costa China
    - Average prices above RMB35 in cited Jiemian summary
    - Traditional premium store format plus RTD retail success
    - Less innovative and less price-aggressive in retained pack
    - Illustrates the risk of staying premium without enough novelty or pace
  notes: Where the retained pack does not provide stable, directly comparable list pricing, the row says so rather than inventing a number.
