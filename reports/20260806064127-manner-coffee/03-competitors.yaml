- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim or pressure point
  - why it matters
  - current evidence
  - severity
  - diligence ask
  rows:
  - - Premium-accessible positioning
    - This is Manner’s clearest visible differentiation from both Starbucks and deep-discount chains
    - Multiple sources frame Manner as quality-led but below Starbucks pricing
    - Medium
    - Request price elasticity and customer-switching data by city tier
  - - Owned-demand deficit
    - If rivals control repeat orders through apps and rewards, product quality alone may not sustain share
    - Luckin and Starbucks disclose richer app or rewards surfaces than Manner
    - High
    - Request MAU, repeat frequency, and loyalty-redemption data
  - - Direct-operated control
    - Control can preserve quality and training standards
    - Official site rejects franchising and FoodTalks still describes direct operation
    - Medium
    - Request mature-store economics and labor-productivity comparison versus peers
  - - Scale mismatch versus Luckin
    - Network size affects procurement, delivery relevance, and launch velocity
    - Luckin’s store count, customer count, and revenue scale dwarf Manner’s
    - High
    - Request management view on where Manner can win without matching scale
  - - Price-war spillover from Cotti
    - Discounting can reset consumer expectations even if Manner avoids the lowest prices
    - Cotti’s 9.9-RMB posture and convenience-store extension widen the battlefront
    - High
    - Stress-test margin and traffic under deeper subsidy scenarios
  - - Premium-segment fragility
    - Premium coffee can work, but slow adaptation can still cause closures
    - Costa closures and Peet’s strategic adjustments show premium is not self-protecting
    - Medium
    - Request evidence that Manner’s premium cues improve retention and mature-store productivity
  notes: This register focuses on the specific rival behaviors most likely to erode Manner’s niche, not on generic market risks already covered in the market chapter.
