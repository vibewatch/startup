- id: head-to-head-scale-capability-and-price
  title: 'Head-to-head: scale, capability, and price architecture'
  body: 'On measurable power, Luckin is the dominant reference point. It enters 2026 with more than 33,000 stores, over 93 million monthly transacting customers, and a hybrid self-operated plus partnership model that gives it far more rollout flexibility than Manner. Starbucks is structurally different: its relevance comes from being the premium umbrella brand with visible rewards depth and a long public expansion plan, not from trying to win every office pickup order. Cotti represents the opposite edge of the market: aggressive 9.9-RMB traffic capture, rapid network rollout, and willingness to expand into convenience-style baskets. Manner’s own price band of roughly RMB15 to RMB25 places it between those poles. That is attractive strategically because it avoids the deepest subsidy war and still undercuts classic premium chains, but it also means Manner must keep proving there is a large enough customer cohort that prefers curated quality over either maximum status or maximum discount.'
