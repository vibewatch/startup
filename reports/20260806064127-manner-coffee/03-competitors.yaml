  rows:
  - - Manner Coffee
    - Direct premium-accessible peer
    - 2,234 directly operated stores; sixth in cited ranking
    - Urban daily specialty coffee at roughly RMB15-RMB25
    - Curated quality plus direct-managed control in dense city districts
    - Smaller network and thinner public loyalty evidence than scale leaders
  - - Luckin Coffee
    - Mass mobile leader
    - 33,596 stores at March 2026; 93.1m monthly transacting customers
    - Great-value, mobile-first, high-frequency coffee and beverages
    - Owned demand loop, partnership-assisted rollout, supply-chain scale, rapid innovation
    - Margin pressure rises with delivery intensity and promotions
  - - Starbucks China
    - Premium incumbent
    - ~7,500 stores by end-2024; 9,000-store target publicized
    - Premium café experience and status-led routine
    - Brand umbrella and visible rewards ecosystem
    - Higher ticket and less pickup-optimized format
  - - Cotti Coffee
    - Discount growth challenger
    - 10,000+ stores by Oct 2024; aimed materially higher
    - Ultra-value coffee with RMB9.9-style traffic tactics
    - Aggressive pricing, rapid expansion, adjacency into convenience baskets
    - Economics and long-term quality perception are less proven publicly
  - - M Stand
    - Boutique premium peer
    - 356 stores across 28 cities
    - Design-forward boutique specialty coffee
    - Strong brand aesthetics and flagship-store halo
    - Much smaller scale than Manner or mass leaders
  - - Peet's Coffee China
    - Premium specialist
    - 260+ stores in 2025
    - Premium coffee around roughly RMB40, with Ora sub-brand at lower price points
    - Quality commitment and selective premium focus
    - Avoids price wars and expands more slowly
  - - Costa China
    - Premium legacy incumbent
    - 389 stores in Nov 2024, down from 453 in 2023
    - Traditional premium coffee retail
    - Legacy awareness and RTD distribution support
    - Physical-store relevance has weakened amid local innovation and price competition
  notes: The rows are a selected rivalry set rather than an exhaustive list of every Chinese coffee chain; they focus on the operators that most shape Manner’s pricing, demand capture, or premium-reference environment.
