  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and brand-control risk
        blocks:
          - type: paragraph
            body: >-
              Manner’s first risk cluster is not glamorous, but it is foundational: food retail in China is a licensed,
              regulated activity, and Manner is no longer a tiny neighborhood coffee bar operating below notice. The
              public materials retained for this run show that the company now sits inside a regulatory environment that
              expects chain operators to maintain food-safety controls across stores, any distribution or
              central-kitchen functions, and increasingly blended online/offline delivery channels. That matters because
              Manner’s core model depends on reproducibility at speed. Once the network is large, a compliance miss is
              not just a store problem; it can become a brand problem. The same is true on the legal side. Public
              case-study and legal-explainer materials indicate that trademark conflict around the “Manner” name has
              already been part of the company’s history. The combination of larger scale, possible IPO preparation, and
              persistent copycat or franchise-misuse risks means legal and regulatory diligence should be treated as a
              live operating variable rather than a checklist item.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR034
