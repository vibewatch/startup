      - number: '7.3'
        title: Dependency, competition, and model risk
        blocks:
          - type: paragraph
            body: >-
              Manner’s third risk cluster comes from the fact that its model sits between two poles. It is more premium
              and craft-coded than Luckin or Cotti, but it still competes in a market whose pricing reference points are
              increasingly shaped by large chains, delivery subsidies, and convenience expectations. Recent sector
              commentary shows that China’s coffee war can push prices to extraordinary lows while still leaving
              industry margins under pressure. That does not mean Manner must imitate the cheapest offers, but it does
              mean consumers are constantly reminded of lower anchors. At the same time, Manner’s direct-operated format
              concentrates dependency risk. The company keeps more control than a franchised chain would, yet that same
              control keeps payroll, equipment uptime, site productivity, and supplier performance on the parent’s
              shoulders. In addition, the company remains associated with dense office-district routines and fast pickup
              behavior, which creates exposure to footfall shifts, landlord bargaining power, and city-mix
              concentration. This is a model that can scale elegantly when demand is healthy, but it can also transmit
              shocks quickly.
            claimRefs:
              - CR018
              - CR019
              - CR020
