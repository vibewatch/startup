  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what public traction can actually be seen
        blocks:
          - type: paragraph
            body: >-
              Manner’s revenue model looks simpler and cleaner than many retail rollups because the public record still
              points overwhelmingly to directly operated stores rather than franchising. The official website rejects
              agency or franchise channels, while FoodTalks still described the network as more than 2,000 directly
              operated stores in late 2025. That means the main economic engine should be self-operated beverage sales,
              with ancillary upside from delivery, limited retail merchandise, and perhaps future packaged or
              ready-to-drink extensions—but not from a large royalty stream already visible in public documents. Public
              traction evidence is thinner than one would want for a private company at this valuation, yet it is not
              nonexistent: Jiemian offered unusually specific store-day-revenue, ticket, and cup-volume markers, and
              those numbers imply Manner already sits on a multi-billion-renminbi sales base if even a large share of
              the network resembles the cited stores. The problem is that system-sales proxies are not the same thing as
              audited revenue, revenue mix, or cohort productivity.
