      - number: '6.4'
        title: Expansion and concentration risks in the customer base
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is probably the biggest unresolved issue in this chapter. Most public evidence
              still points toward Shanghai and other top-tier city use cases, which means Manner’s existing proof may be
              unusually biased toward places where coffee culture, commuting density, and price tolerance are already
              favorable. The same logic that makes Manner look attractive in Shanghai also limits the confidence one can
              have about smaller cities or newer cohorts. Lifestyle collaborations can help pull in adjacent audiences,
              but they do not automatically prove durable repeat usage outside the brand’s home turf. And digital
              ordering support helps, yet it does not erase the reality that service quality, staffing pressure, and
              lower-tier economics may differ sharply from the conditions that made Manner successful in the first
              place. The current verdict is therefore not that Manner lacks expansion potential, but that the public
              customer proof is still too concentrated in mature urban contexts to clear concentration risk on its own.
            claimRefs:
              - CU005
              - CU006
