  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchors and data quality
        blocks:
          - type: paragraph
            body: >-
              Manner’s valuation story begins with a familiar private-market problem: there are enough public signals to
              know the business matters, but not enough audited disclosure to know exactly what it is worth. The
              headline anchor that is easiest to cite is Hurun’s roughly RMB20 billion placement, reinforced
              directionally by database-style pages and repeated IPO articles. But these are not the same thing as an
              audited market-clearing price. They are markers of perceived importance, private-market appetite, and
              banker storytelling. At the same time, the adverse side of the record is unusually valuable here. WOWLS
              openly argues that the valuation may be bloated, not because Manner lacks relevance, but because the
              public record does not yet prove economics strong enough to justify a very rich multiple. The key
              discipline for this chapter is therefore separating strong evidence from loud evidence. Public-comp
              filings from Luckin and Starbucks show what real disclosure looks like. Manner still does not offer that
              level of visibility, which is why the anchor set must be treated as a corridor rather than a point
              estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
