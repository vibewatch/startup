  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the customers are and where they show up
        blocks:
          - type: paragraph
            body: >-
              Manner’s customer base looks simpler than many software or enterprise companies: the buyer, user, and
              payer are usually the same individual. The complexity comes not from account structure but from occasion
              structure. The strongest evidence points to first-tier and new first-tier city users—especially
              Shanghai-based professionals, commuters, and quality-seeking urban consumers who want better coffee than a
              discount chain without paying Starbucks-level prices. Shanghai government data on takeout coffee, plus
              Daxue, KrASIA, and Chinese Tourists Agency commentary, all point toward a customer base shaped by commute
              density, office routines, and a habit-forming coffee culture. Yet Manner is not only an office-worker
              chain. Scenic Shanghai branches, cultural activations, and fashion collaborations show that some locations
              also attract tourists, lifestyle consumers, and social-content seekers. The result is a customer map with
              one core segment—urban habitual users—and several valuable adjacent segments that can widen brand reach
              without necessarily becoming the same type of repeat buyer.
