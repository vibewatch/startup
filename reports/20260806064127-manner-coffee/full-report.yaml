      - number: '2.3'
        title: 'Growth drivers: adoption, supply, and format accessibility'
        blocks:
          - type: paragraph
            body: >-
              Three forces make the segment genuinely attractive. First, consumer adoption is broadening quickly.
              Shanghai government data show that per-capita consumption is moving up fast and that coffee has become a
              regular part of urban daily life rather than a novelty import. FLTR Magazine captured the cultural
              transition well: coffee in China has moved from curiosity to habit, especially in Shanghai and other
              globally exposed cities. Second, the supply side is improving. Yunnan’s specialty rate rose from 8% in
              2021 to 31.6% in 2025, total export value reached RMB860 million in 2025, and Statista still says the
              province accounts for roughly 98% of domestic production. That matters for Manner because a quality-led
              chain has more chance to defend everyday premium pricing when local supply quality improves.


              Third, the format is accessible. Manner’s typical price points sit well below classic Starbucks pricing
              while staying above deep-discount promotional coffee. Its compact direct-operated stores and fast pickup
              logic fit the reality that Shanghai takeout orders rose 40% from 2019 to 2023 and that online ordering is
              central to daily consumption. The same underlying trend also benefits rivals such as Luckin and Cotti,
              which is why Manner cannot treat demand growth as proprietary. But the existence of a large, increasingly
              habitual, digitally addressable fresh-coffee audience means Manner does not need to create the category
              from scratch; it only needs to win a particular slice of it consistently.
            claimRefs:
