  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and the asset stack behind it
        blocks:
          - type: paragraph
            body: >-
              Manner is best described as a specialty-coffee operating system delivered through compact urban stores,
              not as a generic café chain. The core output is an affordable-premium espresso drink, but the real product
              bundle includes a very small store footprint, semi-automatic preparation that preserves craft cues,
              brand-led collaborations, and a directly controlled retail environment. The anti-franchise stance on the
              official site matters because it shows the company sees consistency and control as part of the product
              itself, not just a legal preference. Multiple external write-ups also point to the same underlying
              architecture: tiny “window shop” origins, rapid replication through low-rent formats, and brand equity
              built from balancing specialty signals with everyday accessibility. In practical terms, Manner’s assets
              are beverages, store format, equipment stack, training system, sourcing and roasting discipline, and a
              collaboration engine that keeps the brand culturally fresh.
