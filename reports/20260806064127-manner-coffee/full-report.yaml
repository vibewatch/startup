            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV019
              - CV031
              - CV032
              - CV033
              - CV034
              - CV041
      - number: '8.4'
        title: Underwriting conclusion and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The practical investment conclusion is constructive on company relevance but disciplined on price. Manner
              clearly belongs on the list of nationally meaningful China consumer brands, yet the open-web evidence
              still supports a track or research-more stance more naturally than a confident buy call. The issue is not
              whether the business exists or whether consumers care; those questions are already answered. The issue is
              whether the currently circulated valuation ranges are sufficiently supported by audited disclosure,
              mature-store economics, governance readiness, and control evidence. Right now, they are not. That does not
              mean the story is broken. It means the next diligence round should focus less on new narrative and more on
              proving the economics that the narrative implies. If management can close the biggest evidence gaps,
              valuation precision could improve quickly. If it cannot, uncertainty itself becomes part of the price. For
              an IC-style discussion, the healthiest framing is fair-to-full valuation with real upside optionality only
              after the evidence base improves.
            claimRefs:
