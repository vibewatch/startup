        title: Retention, durability, and what public satisfaction signals really mean
        blocks:
          - type: paragraph
            body: >-
              The public signal on durability is mixed. On the positive side, Manner’s accessible price band, dense
              urban store presence, and review patterns are exactly the kinds of features that can support habit
              formation. On the negative side, no retained source provides cohort retention, repeat-purchase frequency,
              churn, or customer lifetime value. So investors are forced to reason from proxies instead of metrics. The
              strongest proxies include crowded branches, review advice to order online during peak periods, and the
              company’s ability to keep using collaborations and digital touchpoints to refresh demand. The strongest
              negative signals include wait-time complaints, evidence of single-staffed shops under stress, and public
              incidents that suggest service quality can break under pressure. In other words, Manner likely has genuine
              repeat usage in its strongest neighborhoods, but the retained pack still does not let us quantify whether
              that repeat behavior is resilient enough to survive expansion beyond the most coffee-mature districts.
            claimRefs:
              - CU009
              - CU023
              - CU024
              - CU025
              - CU026
              - CU027
              - CU034
              - CU035
              - CU038
