        title: Differentiation, quality controls, and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              Manner’s differentiation sits at the intersection of price, process, and perception. It wants to feel more
              artisanal than Luckin without charging or merchandizing exactly like Starbucks. The way it gets there is
              through compact stores, semi-automatic preparation, higher-touch barista training, and a curation layer of
              seasonal menus and collaborations. The same ingredients also create dependency risk. Equipment choices,
              milk and bean quality, barista skill, founder-level sourcing discipline, and first-tier site density all
              matter. If any of those weaken, the product may still be coffee, but it will be less recognizably
              “Manner.” The hiring surfaces are informative here: public careers and recruiting traces are the closest
              available practitioner proxy for an internal systems buildout, yet they are still much thinner than the
              code, status, or API surfaces a software business would expose. That makes the product look credible, but
              only partially inspectable. Another subtle dependency is site choreography: a small-format concept depends
              on disciplined queue design, back-bar layout, and fast replenishment so that craft steps do not become
              visible bottlenecks during commuter peaks.
