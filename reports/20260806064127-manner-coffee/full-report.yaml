      - number: '8.3'
        title: Bull, base, bear, and range logic
        blocks:
          - type: paragraph
            body: >-
              Once the evidence is separated into anchors, comp standards, and scenario drivers, the range becomes
              clearer. The bull case is not fantasy: Manner has real brand strength, dense urban relevance, and enough
              scale to attract top-tier capital and IPO speculation. If mature-store economics are stronger than
              outsiders expect and direct operation continues to protect quality, the company can plausibly support a
              premium narrative. The bear case is equally straightforward. Price-war reference points, labor and service
              strain, and private-company opacity may mean that public investors will underwrite Manner more cautiously
              than late-stage private investors have. That tension is why a corridor is more honest than a point target.
              The base case should sit closer to the middle of the public anchor set, not the very top of rumor-driven
              numbers. It is easy to imagine why Manner could someday justify a higher mark; it is much harder to prove
              that the proof already exists. Investors should therefore underwrite upside only if they know exactly
              which missing documents would move the range and why.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
