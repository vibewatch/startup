chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and store model
        blocks:
          - type: paragraph
            body: >-
              Manner Coffee was founded in 2015 in Shanghai's Jing'an District by Han Yulong and Lu Jianxia and built
              its early identity around a tiny grab-and-go format rather than a lounge-like cafe. Multiple retained
              sources describe the first outlet as a two-square-meter or similarly minimal storefront, which matters
              because the small-box model is not a cosmetic detail: it is the operating logic that let Manner sell
              specialty-style espresso drinks at mainstream urban prices. Public descriptions from Baidu Baike, Jiemian
              Global, KrASIA, Bamboo Works, and later IPO-coverage summaries all converge on the same
              proposition—high-quality but affordable coffee, mainly in the RMB15-RMB25 band, designed to make coffee a
              daily habit rather than an occasional premium indulgence.


              That model stayed direct-operated as the chain scaled. Manner's official website explicitly warns that it
              has never opened franchising or agency channels and that third-party franchise sites are fraudulent.
              FoodTalks' 2025 IPO-rumor follow-up adds that an internal franchise-interest survey did not amount to an
              actual franchising launch. This matters for later chapters because Manner's brand consistency, labor
              intensity, and capital needs all flow from the same decision to keep stores small, standardized, and
              company-run rather than shifting execution risk to franchisees. Even when Manner broadened beyond espresso
              into tea, juice, baked goods, drip bags, equipment, and collaboration merchandise, the core identity
              remained a direct-operated, premium-accessible specialty coffee chain rooted in high-throughput urban
              pickup occasions.
