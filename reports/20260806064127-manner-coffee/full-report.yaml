  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, player classes, and where Manner actually competes
        blocks:
          - type: paragraph
            body: >-
              The competitive mistake with Manner is to ask whether it is simply a smaller Starbucks or a slower Luckin.
              The retained evidence suggests it is neither. Manner sits in the overlap between value-chain convenience
              and boutique quality: it sells at everyday-premium prices, operates tiny direct-managed stores, and
              thrives best in dense urban districts where consumers want better coffee than a subsidy-led mass chain but
              do not want a long café stay or a Starbucks ticket. That means the real rivalry set is multi-layered.
              Luckin and Cotti are the scale and price leaders that pressure everyday frequency; Starbucks, Peet’s, and
              Costa are premium incumbents that shape willingness-to-pay and quality benchmarks; M Stand and similar
              boutique operators show how design-forward specialty coffee can win attention but scale more slowly. In
              other words, Manner competes across multiple classes at once, but it is strongest only in the narrow
              middle: premium-accessible, fast, urban, and tightly curated.
