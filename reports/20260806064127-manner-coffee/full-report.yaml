              while the NEIWAI, UCCA, and Rest With Manner campaigns prove that the brand can turn collaboration
              audiences into drink purchases, themed visits, merchandise engagement, and social posting. This is
              meaningful evidence, but it is not the same as retention proof. It tells us that Manner can attract and
