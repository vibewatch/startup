  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and multi-lens sizing
        blocks:
          - type: paragraph
            body: >-
              The first analytical mistake with Manner is to equate its opportunity with all coffee spend in China. The
              broad market is certainly large: Shanghai government reporting said China’s coffee industry reached
              RMB265.4 billion in 2023 and RMB354.9 billion in 2025, while third-party market reports frame the 2025
              market anywhere from roughly US$10.8 billion to US$21 billion depending on category coverage and
              methodology. But those broad numbers include instant coffee, at-home beans, RTD, equipment, e-commerce,
              and regional formats that are not cleanly comparable to Manner’s directly operated grab-and-go stores.
              Manner’s practical TAM is better framed as urban coffee consumption, its SAM as fresh-ground specialty and
              premium-mass coffee bought in first- and second-tier cities, and its SOM as the subset of that market
              willing to buy from dense, direct-operated micro stores at an everyday RMB15-RMB25 ticket.


              That narrower lens still yields an attractive market. Shanghai alone had 9,553 coffee shops at end-2023
              and 10,336 by 2025, making it the world’s densest big-city coffee market. Per-capita coffee consumption in
              China rose from 16.74 cups in 2023 to 28.57 cups in 2025, and the number of market entities in the coffee
              sector roughly doubled between 2021 and 2025. Statista’s survey topics reinforce the same direction:
              fresh-ground coffee is growing rapidly, acceptable café price bands are trackable, and specialty coffee
              now has enough scale to support province-level customer and spend data. For Manner, the take-away is that
              the market is no longer demand-constrained at the national level; it is segmentation-constrained by where
              that demand is concentrated and what price-service proposition clears at scale.
