        title: Workflow, equipment, and the operating architecture of the cup
        blocks:
          - type: paragraph
            body: >-
              The most important technical distinction in Manner is that it does not appear to optimize purely for
              automation. Challenger Project, Liepin, and other retained sources all point to a semi-automatic,
              barista-intensive workflow built around imported coffee machines, high-end grinders, and several months of
              training through Manner Lab Coffee Academy. That makes the workflow more craft-dependent than Luckin’s
              cashier-less scale machine, but also more defensible for customers who care about specialty cues. Ewha
              adds that automated ordering and scheduling systems support the operation, while Siam and Baidu indicate
              online channels and delivery are becoming more important. So the architecture is hybrid: digital ordering
              and back-end scheduling on one side, highly skilled manual preparation on the other. That hybrid model can
              be powerful, but it also means service quality depends on the company’s ability to recruit, train, and
              retain capable people at scale.
