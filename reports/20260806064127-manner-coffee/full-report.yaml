      - number: '3.3'
        title: Distribution power, owned demand, and switching behavior
        blocks:
          - type: paragraph
            body: >-
              The more important competitive question is not who has the best latte recipe, but who controls the next
              ten orders. Luckin’s investor materials and profile summaries make its advantages explicit: mobile
              ordering, cashier-less operations, pick-up density, data-driven site selection, and large-scale customer
              engagement. Starbucks discloses a visible rewards club and benefits from habit formation among consumers
              who want a formal loyalty ladder. Cotti uses distribution aggression differently by widening baskets and
              piggybacking on price-led trial. Against those systems, Manner’s public evidence is conspicuously thinner.
              Its direct-operated model likely helps quality control, training, and visual consistency, but the retained
              official materials do not provide the same public visibility into loyalty mechanics, customer frequency,
              or owned-demand tools that Luckin and Starbucks expose. In a low switching-cost category where app
              promotions, commuting routes, and delivery interfaces can re-route demand quickly, that disclosure gap
              matters because it makes Manner’s competitive durability harder to verify than its brand desirability.
