        blocks:
          - type: paragraph
            body: >-
              Manner 的差异化落在价格、流程和感知的交叉点。它想比 Luckin 更有手作感，又不完全按 Starbucks
              的方式定价或做商品化。实现路径是紧凑门店、半自动制备、更高触点的咖啡师培训，以及季节菜单和联名构成的策划层。同一组要素也制造依赖风险。设备选择、牛奶和咖啡豆质量、咖啡师技能、创始人级采购纪律，以及一线选址密度都很重要。任何一项变弱，产品仍是咖啡，但就不那么像「Manner」了。招聘入口在这里有信息价值：公开招聘页
              和招聘痕迹是观察内部系统建设最接近的一线代理指标，但它们仍远薄于软件公司会暴露的代码、状态页或 API
              接口。另一个细微依赖是点位动线编排：小型门店概念依赖严谨排队设计、吧台后场布局和快速补货，才能让手作步骤在通勤高峰不变成看得见的瓶颈。
