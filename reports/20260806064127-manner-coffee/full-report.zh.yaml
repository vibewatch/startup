      - number: '3.3'
        title: 分发能力、自有需求与切换行为
        blocks:
          - type: paragraph
            body: >-
              更重要的竞争问题不是谁的拿铁配方最好，而是谁控制接下来的十杯。Luckin 的投资者材料和简介摘要把优势讲得很清楚：移动点单、无收银运营、取餐密度、数据驱动选址和大规模客户互动。Starbucks
              披露了可见的会员俱乐部，并受益于想要正式忠诚度阶梯的消费者养成习惯。Cotti 则以不同方式打分发：扩大消费篮子，并借价格驱动试饮。面对这些系统，Manner
              的公开证据明显更薄。直营模型可能有助于质量控制、培训和视觉一致性，但留存的官方材料并没有像 Luckin 和 Starbucks 那样公开展示忠诚度机制、客户频次或自有需求工具。在一个切换成本很低的品类里，应用
              促销、通勤路线和外卖界面都能快速改写需求流向；披露空白因此很关键，因为它让 Manner 的竞争耐久度比品牌吸引力更难验证。
