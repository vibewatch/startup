              - CV037
      - number: '8.2'
        title: 可比公司组与估值方法
        blocks:
          - type: paragraph
            body: >-
              对 Manner 来说，最能站得住的方法是情景化可比分析，而不是自下而上的 DCF。 DCF 会制造严谨假象，却把缺少经审计收入、资本开支、营运资本和现金流数据的问题藏起来。
              上市可比公司仍有用，但每家公司扮演的角色不同。Luckin 是习惯、便利性和价格压力上最接近且有披露的中国咖啡可比公司； Starbucks 代表在中国的高端品牌基准，但成本结构差异很大；Mixue
              是低价带参照；Nayuki 展示了品牌饮品连锁在港股公开审视下会是什么样。 没有一个完美，但合在一起能定义区间。另一个重要选择，是如何使用 Manner 的单店经济性轶事。 Coffinance
              的数字足以塑造情景直觉，但不足以锚定单一倍数。因此，本章给上市文件和披露标准的权重高于一次性经济性主张。 这样结论才诚实：Manner 也许配得上一级市场的溢价叙事，但不配假精确。
