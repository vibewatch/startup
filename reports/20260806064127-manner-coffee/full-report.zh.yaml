  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与多视角规模测算
        blocks:
          - type: paragraph
            body: >-
              分析 Manner 时，第一个误区是把机会等同于中国所有咖啡支出。广义市场当然很大：上海政府报道称，中国咖啡产业在 2023 年达到 RMB265.4 billion，2025 年达到 RMB354.9
              billion；第三方市场报告则根据品类覆盖和方法不同，将 2025 年市场放在约 US$10.8 billion 到 US$21 billion
              之间。但这些宽口径数字包含速溶咖啡、家庭咖啡豆、RTD、设备、电商和区域业态，并不能与 Manner 的直营即买即走门店干净对比。Manner 的实际 TAM 更适合定义为城市咖啡消费，SAM
              是一二线城市购买的现磨精品和大众精品咖啡，SOM 则是愿意在密集直营微型门店以日常 RMB15-RMB25 客单价购买的那部分市场。


              收窄视角后，市场仍然有吸引力。仅上海一地，2023 年底咖啡店就有 9,553 家，2025 年达到 10,336 家，是全球咖啡店密度最高的大城市。中国人均咖啡消费从 2023 年 16.74 杯升至 2025
              年 28.57 杯，咖啡领域市场主体数量在 2021 至 2025 年间大致翻倍。Statista
              的调查主题也指向同一方向：现磨咖啡快速增长，可接受的咖啡馆价格带可以追踪，精品咖啡已有足够规模支撑省级客户和消费数据。对 Manner
              来说，结论是全国层面已不再缺需求；真正的约束在细分市场——需求集中在哪里，以及什么价格服务组合能规模化跑通。
