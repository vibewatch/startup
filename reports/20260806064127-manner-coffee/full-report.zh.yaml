  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开可见的真实牵引力
        blocks:
          - type: paragraph
            body: >-
              与许多零售整合型公司相比，Manner 的收入模型看起来更简单、更干净，因为公开记录仍压倒性指向直营门店，而非加盟。官方网站拒绝代理或加盟渠道，FoodTalks 到 2025 年末仍将网络描述为超过 2,000
              家直营店。这意味着主要经济引擎应是自营饮品销售，外卖、有限零售商品，以及未来或许出现的包装饮品或 RTD
              延伸带来附加上行；公开文件里还看不到一条已经很大的特许权使用费收入流。对这个估值水平的非上市公司来说，公开牵引力证据比理想状态薄，但并非没有：Jiemian
              给出了少见具体的单店日收入、客单价和杯量指标；如果网络中哪怕相当一部分门店接近所引门店，这些数字也意味着 Manner 已坐在数十亿人民币销售底盘上。问题在于，系统销售代理指标不等于经审计收入、收入结构或门店批次
              生产力。
