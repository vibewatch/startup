            body: >-
              最干净的财务框架是：Manner 的收入质量可能好于披露质量。一家在密集城区销售可重复、低客单饮品的直营精品连锁，完全可以是一门好生意；Manner
              的公开单店经济性指标也比许多消费创业公司更鼓舞人心。但留存资料包仍无法让投资人测试：这些漂亮门店是否具有代表性，新城市批次
              是否站得住，上海之外外卖佣金或劳动力通胀会吃掉多少，以及公司还能在不牺牲控制力的情况下拿出多少现金继续扩张。与 Luckin 的详细申报文件相比，Manner 在收入结构、GMV、同店销售、单店
              资本开支、债务和现金流上仍是黑箱。这不代表故事弱，而代表披露不足。因此，财务结论是有希望但有条件：核心门店经济性可能强，资本强度有意义，管理层拿出真实连锁层面账目之前，融资依赖仍未解决。
