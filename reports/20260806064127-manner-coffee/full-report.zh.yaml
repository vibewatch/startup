        - 执行杠杆和不透明度主导风险图谱
        - 定价纪律很重要
      - - 估值立场
        - 合理到偏满
        - 公开锚点更能证明重要性，而非明显便宜
        - 等更好的进入价格，或更充分披露
    notes: 建议更多由估值支撑和披露质量驱动，不是源于对需求的怀疑。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV037
  - id: TV002
    title: 投资逻辑 / 反投资逻辑表
    columns:
      - 论点
      - 多头解读
      - 空头解读
      - 什么会改变判断
    rows:
      - - 全国精品咖啡品牌价值
        - 密集门店和投资人质量支撑战略价值
        - 有战略价值，也可能经济性偏弱
        - 经审计的成熟门店分组数据
      - - 直营模式
        - 守住一致性和品牌控制
        - 资本强度和执行压力都留在总部
        - 门店级回本和利润率证据
      - - 精品可及定位
        - 区别于纯折扣品牌和高价咖啡馆
        - 折扣锚点和精品预期可能两头挤压
        - 穿越价格战周期的同店韧性
      - - IPO 叙事
        - 可能改善披露和流动性
        - 也可能在经济性验证前推高预期
        - 准备招股书级财务包
    notes: 在披露解决经济性争议之前，Manner 的投资逻辑和反投资逻辑可能同时成立。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV030
      - CV036
  - id: TV003
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 空头
        - 流量守住，但利润质量低于预期；不透明折价仍高
        - US$2.0B-US$2.4B
        - 价格战、用工压力、成熟门店经济性偏弱
        - 若新增披露不及预期，该情景可能成立
      - - 基准
        - 品牌价值守住；经济性不错但不突出；披露部分改善
        - US$2.6B-US$3.0B
        - 披露仍不完整，公开市场投资者继续挑剔
        - 当前公开证据最能支撑
      - - 多头
        - 成熟门店回本、同店销售和控制水平优于代理指标；IPO 准备增强可信度
        - US$3.2B-US$3.8B
        - 证据必须快速追上叙事
        - 需要经审计验证
      - - 高估值尾部
        - 银行家或动量驱动的估值拉向传闻区间上沿
        - US$4.0B-US$4.5B
        - 叙事跑在可证明经济性前面
        - 今天不能作为有纪律的投资测算基准
    notes: 区间刻意放宽，因为 Manner 成熟门店经济性的证据仍不完整。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 提供什么锚点
      - 状态或披露面
      - 适用性
      - 局限
    rows:
      - - Luckin Coffee
        - 披露最接近的中国咖啡规模可比公司
        - 20-F 加 2025-2026 年业绩
        - 咖啡消费习惯和利润率压力的最佳披露代理
        - 规模更大、数字化更深，治理历史不同
      - - Starbucks
        - 高端基准和全球披露标准
        - 10-K 加 IR 披露
        - 可用于理解高端品牌经济性和中国语境
        - 全球多元化和堂食座位模型削弱可迁移性
      - - Mixue
        - 低价端饮品可比公司
        - HKEX 招股书
        - 帮助框定折扣规模估值逻辑
        - 价格结构和运营模式差异很大
      - - Nayuki
        - 香港公开市场饮品披露参考
        - IR 财报披露
        - 展示上市品牌饮品公司会受到怎样审视
        - 品类和市场历史差异显著
    notes: 没有单一可比公司足够；价值来自这组公司从多个角度框定 Manner。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV035
    enumerationScope:
      coverage: sample
      basis: >-
        This table samples the most decision-relevant disclosed public beverage comps for Manner, not the entire global
        cafe universe.
  - id: TV005
    title: 击穿投资逻辑和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 成熟门店经济性偏弱
        - 回本或成熟门店利润率显著低于代理预期
        - 精品叙事失去可信度
        - 下调区间并暂停高确信判断
      - - 服务 / 用工控制没有改善
        - 再次出现广泛可见事件，或投诉率上升
        - 执行折价扩大
        - 要求提供运营整改证据
      - - IPO 准备不透明
        - 管理层无法提供招股书级财务包
        - 叙事溢价仍缺支撑
        - 保持跟踪 / 观察名单
      - - 公开可比公司倍数压缩
        - 中国咖啡或饮品倍数进一步下修
        - 上沿区间应下移
        - 重切情景表
    notes: 本章把终止触发因素视为可衡量的证据失败，而不是感觉。
    claimRefs:
      - CV029
      - CV033
      - CV038
      - CV041
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计收入和 EBITDA
        - Manner 没有公开经审计 P&L
        - 可立即压缩估值不确定性
        - 要求提供最新经审计财务报表
      - - 门店分组和同店销售
        - 没有公开门店分组材料或成熟门店指标
        - 决定规模质量是否匹配叙事
        - 要求按城市和开业批次提供门店分组包
      - - 股权结构表和优先权
        - 没有公开优先权层级或稀释数据
        - 会显著改变回报计算
        - 要求提供股权结构表和投资者权利摘要
      - - 控制和事件指标
        - 没有关于投诉、审计或人员配置的公开 KPI 包
        - 检验风险折价是否应缩窄
        - 要求提供合规和运营仪表盘
    notes: 用私有证据替代代理指标，会比增加更多媒体评论更快收窄区间。
    claimRefs:
      - CV016
      - CV030
      - CV037
      - CV039
      - CV040
