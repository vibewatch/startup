      - number: '1.4'
        title: 门店经济性、里程碑与负面运营信号
        blocks:
          - type: paragraph
            body: >-
              Manner 公开叙事中最吸引人的部分，是紧凑门店业态似乎能做到高出杯量，同时不滑入 Luckin 式补贴逻辑。Jiemian 报道单店日均收入约 RMB7,500、客单约 RMB20、日均约 400
              杯。KrASIA 进一步给出多头口径：平均门店日出杯超过 500 杯，最佳门店可达 700 杯，2020 年收入 RMB200 million-RMB300 million，上海门店盈利，并声称单店月净利润
              RMB57,000、净利率约 24%。这些数字部分来自管理层口径，达不到申报级别，但足以解释蓝筹投资人为何持续出资支持扩张。它们也解释了 Manner
              为何抗拒加盟：只有紧凑门店在保持产品质量和人员标准的同时维持高杯量，模型才跑得通。


              同一套效率逻辑也会制造运营压力。TechNode、Yicai、SCMP、Sina 和 Dao 均报道了 2024 年 6 月上海咖啡师与顾客之间的冲突。Sina 称 2023 年只有 1,225
              名员工有社保缴纳记录；Yicai 描述日出杯 500 杯的门店由约 3 名员工支撑；TechNode 报道，有人称部分低杯量门店只有 1 人负责备货、点单、出品和清洁。Manner
              道歉，承诺培训和运营调整，并表示会改善员工关怀。该事件不应被解读为一次性公关尴尬，而应被视为证据：当网络规模跑在门店级流程能力前面时，Manner 的小店高周转系统会产生真实执行压力。
