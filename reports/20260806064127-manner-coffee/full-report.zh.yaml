      - number: '2.4'
        title: 约束：门店淘汰、价格战与低线迁移风险
        blocks:
          - type: paragraph
            body: >-
              同一个市场，收入口径上令人兴奋，运营口径上却很残酷。Daxue 称 2024 年至 2025 年 8 月有 172,892 家咖啡店开出，但 119,726
              家关闭，闭店率足以说明低进入门槛并不等于可持续经济性。Daxue 还称，促销咖啡价格已被打到 RMB9.9、RMB8.8，甚至券后 RMB2.9。Ken Research 同样描述了一个有超过 1,000
              个品牌竞争的市场；FoodTalks 2025 年末门店排名则显示规模龙头已经多么密集：Manner 为 2,234 家时，Luckin 接近 28,000 家，Cotti 超过 15,000
              家，Starbucks China 超过 8,000 家。在这种环境里，市场靠便利、补贴、密度和品牌共同出清，而不只看咖啡豆质量。


              低线城市扩张因此成了 Manner 最关键的市场问题。KrASIA 认为，还没有精品咖啡馆证明自己能在乡镇或低线中国规模化攻城；Daxue 则把 Manner
              的全国化测试定义为：一个诞生于上海的精品身份，在精品咖啡文化更薄、价值竞争更狠的地区是否仍有吸引力。粗略系统销售代理指标说明了问题的重要性：把 Jiemian 的 RMB7,500 单店日均收入套用到
              FoodTalks 的 2,234 家门店，得到的年化系统销售额约 RMB6.1 billion，仅相当于 2025 年行业总量约 1.7%。空间很大。问题在于，增量市场是否落在 Manner
              能赢的细分里，并且不需要放弃支撑现有优势的直营、高服务模型。
