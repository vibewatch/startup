  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与数据质量
        blocks:
          - type: paragraph
            body: >-
              Manner 的估值故事，始于一级市场常见的问题：公开信号足以证明这家公司重要，但经审计披露不足以说明它到底值多少钱。 最容易引用的头部锚点，是 Hurun 约 RMB20B 的榜单估值，数据库式页面和反复出现的
              IPO 文章也在方向上强化了这一点。 但这些并不等于经审计、能完成市场出清的价格。它们只是市场感知重要性、一级市场胃口和投行叙事的标记。 同时，记录里的负面侧在这里反而很有价值。WOWLS
              公开主张估值可能偏肿，原因不是 Manner 不重要，而是公开记录尚未证明其经济性强到足以支撑很高的倍数。 因此，本章的关键纪律，是把强证据和响声大的证据分开。Luckin 和 Starbucks
              的上市可比公司文件展示了真正披露应有的样子。 Manner 仍没有这种可见度，所以锚点组合必须被当作区间，而不是点估计。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
