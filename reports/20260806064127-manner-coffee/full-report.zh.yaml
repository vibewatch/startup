  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户是谁，以及他们在哪里出现
        blocks:
          - type: paragraph
            body: >-
              Manner
              的客户基础看起来比许多软件或企业服务公司简单：买方、用户和付款者通常是同一个人。复杂性不在账户结构，而在消费场景结构。最强证据指向一线和新一线城市用户——尤其是上海专业人士、通勤者，以及追求品质的城市消费者；他们想喝到比折扣连锁更好的咖啡，又不想支付
              Starbucks 级价格。上海政府关于外带咖啡的数据，加上 Daxue、KrASIA 和 Chinese Tourists Agency
              的评论，都指向一个由通勤密度、办公室日常和习惯化咖啡文化塑造的客户群。不过，Manner
              不只是办公室白领连锁。上海景区门店、文化活动和时尚联名显示，部分点位也吸引游客、生活方式消费者和社交内容创作者。结果是一张客户地图：一个核心人群——城市习惯性用户——外加几个有价值的相邻人群，它们能扩大品牌触达，却未必变成同一类重复买家。
