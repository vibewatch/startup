      - number: '7.4'
        title: 财务不透明、缓释成熟度与投资论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是不透明。Manner 已大到足以吸引蓝筹资本、IPO 传闻和公众关注，但仍是私营公司，披露少到让投资人无法直接检验最关键的问题：
              成熟门店经济性、现金生成、资金续航、集中度和治理深度。这并不否定公司；它改变的是投资人该如何承销风险。 一家公司可以在战略上很亮眼，但如果内部控制、排班设计或单店经济性比公开叙事暗示的更薄，运营上仍会脆弱。
              正确反应不是被每篇负面文章吓到，而是把风险图谱压成可监测指标。哪些指标能说明用工问题真正修复，而不是只是不再上新闻？ 哪些数字能证明直营扩张仍在挣到自己的成本？哪些法律文件能说明 IP 历史可控，而不是仍在拖尾？
              在这些问题回答前，Manner 应被视为强势消费品牌，但带有真实执行杠杆——也就是说，结果区间比单一头条估值暗示的更宽。
