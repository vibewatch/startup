  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与品牌控制风险
        blocks:
          - type: paragraph
            body: >-
              Manner 的第一组风险并不光鲜，但它是底座：中国食品零售是持证、受监管的生意，Manner 已不再是小到不被关注的街角咖啡吧。
              本次留存的公开资料显示，公司现在处在一套监管环境里：连锁经营者要把食品安全控制贯穿门店、任何配送或中央厨房职能，以及越来越融合的线上 / 线下外卖渠道。 这很关键，因为 Manner
              的核心模式靠高速复制。一旦网络变大，合规失误就不只是单店问题，而会变成品牌问题。 法律侧也是如此。公开案例研究和法律解读材料显示，围绕「Manner」名称的商标冲突已经写进公司历史。 规模变大、可能筹备
              IPO、山寨或加盟误用风险长期存在，叠在一起意味着法律与监管尽调应被视为活的经营变量，而不是清单项。
            claimRefs:
              - CR001
