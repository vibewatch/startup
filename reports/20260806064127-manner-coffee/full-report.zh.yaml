      - number: '2.3'
        title: 增长驱动：采用、供给与业态可得性
        blocks:
          - type: paragraph
            body: >-
              三股力量让这一细分市场确实有吸引力。第一，消费者接受度正在快速拓宽。上海政府数据显示，人均消费上行很快，咖啡已从新奇舶来品变成城市日常。FLTR Magazine
              很好地捕捉了文化迁移：在中国，咖啡已经从好奇心变成习惯，尤其在上海和其他全球化程度较高的城市。第二，供给侧在改善。云南精品率从 2021 年的 8% 升至 2025 年的 31.6%，总出口额达到 RMB860
              million，Statista 仍称该省贡献国内产量约 98%。这对 Manner 很重要：本地供给质量提升后，强调品质的连锁更有机会守住日常精品定价。


              第三，业态本身容易触达。Manner 的典型价格明显低于经典 Starbucks 定价，又高于深度折扣促销咖啡。紧凑直营门店和快速取餐逻辑，契合上海外带订单在 2019 至 2023 年增长
              40%、线上点单成为日常消费核心的现实。同一底层趋势也利好 Luckin、Cotti 等对手，所以 Manner
              不能把需求增长当成自己的专属资产。但庞大、越来越习惯化、可数字触达的现制咖啡人群已经存在，Manner 不需要从零创造品类；它只需要持续赢下其中一块。
