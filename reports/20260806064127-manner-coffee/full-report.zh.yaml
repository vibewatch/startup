      - number: '5.2'
        title: 工作流、设备与一杯咖啡的运营架构
        blocks:
          - type: paragraph
            body: >-
              Manner 最重要的技术差异，是它看起来并未纯粹为自动化优化。Challenger Project、Liepin 和其他留存资料都指向一种半自动、咖啡师密集的工作流：进口咖啡机、高端磨豆机，以及通过
              Manner Lab Coffee Academy 进行数月培训。与 Luckin 的无收银规模机器相比，这让流程更依赖手作；但对在意精品信号的消费者来说，也更有防御性。Ewha
              补充，自动点单和排班系统支撑运营；Siam 和 Baidu
              则显示线上渠道和外卖变得更重要。因此，架构是混合的：一边是数字点单和后端排班，一边是高技能手工制备。混合模型可以很有力，但也意味着服务质量取决于公司能否在规模上招到、训练并留住有能力的人。
