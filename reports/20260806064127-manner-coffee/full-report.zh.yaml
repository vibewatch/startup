companyProfile:
  summary: >-
    Manner Coffee 是一家总部位于上海的精品咖啡连锁，由 Han Yulong 和 Lu Jianxia 于 2015 年创立。公司从上海一家极小门店扩张为全国性直营网络，门店超过 2,000
    家；模型围绕城市即买即走点位、平价精品定价和高出杯意式浓缩服务搭建。公开证据支持这是一门具备强品牌相关性、蓝筹投资人背书和真实全国规模的生意，但公司对现金生成、治理和成熟门店经济性的披露仍有限。
