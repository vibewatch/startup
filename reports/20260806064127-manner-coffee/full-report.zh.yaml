            body: >-
              按可衡量实力看，Luckin 是主导性参照点。它进入 2026 年时门店超过 33,000 家，月交易客户超过 93 million，并拥有自营加合作门店的混合模型，扩张灵活性远高于
              Manner。Starbucks 的结构不同：其相关性来自高端伞状品牌、可见的会员权益深度和长期公开扩张计划，而不是试图赢下每一个办公室取餐订单。Cotti 代表市场另一端：激进用 9.9-RMB
              抓流量、快速铺网，并愿意扩展到便利型消费篮子。Manner 自身约 RMB15 至 RMB25 的价格带位于两极之间。战略上这很有吸引力，因为它避开最深的补贴战，同时仍低于经典高端连锁；但这也意味着 Manner
              必须持续证明，有足够大的消费者群体更偏好策划过的品质，而不是最高身份感或最低折扣。
