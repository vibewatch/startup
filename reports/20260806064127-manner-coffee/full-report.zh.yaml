  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 区间最该随缺失的经济性和披露变量移动，而不是只随叙事移动。
    data:
      items:
        - label: 成熟门店利润率证明
          value: 9
          unit: /10
          note: 支撑倍数的最大摆动因素
        - label: 经审计收入规模
          value: 8
          unit: /10
          note: 快速收窄收入不确定性
        - label: 披露 / 治理质量
          value: 8
          unit: /10
          note: 改变不透明折价
        - label: 价格战强度
          value: 7
          unit: /10
          note: 可能压缩公开同业的估值胃口
    claimRefs:
      - CV016
      - CV019
      - CV030
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前公开证据支持一个宽区间，基准情形落在头部叙事的中低位附近。
    data:
      items:
        - label: 熊市
          low: 2
          high: 2.4
          unit: US$B
          note: 经济性不及预期，不透明折价延续
        - label: 基准
          low: 2.6
          high: 3
          unit: US$B
          note: 品牌相关性强，披露仍不完整
        - label: 牛市
          low: 3.2
          high: 3.8
          unit: US$B
          note: 客群表现和利润率验证溢价故事
        - label: 高估尾部
          low: 4
          high: 4.5
          unit: US$B
          note: 声量跑在当前证据前面
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按 IC 口径打分，品牌相关性和市场匹配度强于估值支撑和证据质量。
    data:
      items:
        - label: 市场吸引力
          value: 8
          unit: /10
          detail: 中国咖啡市场体量仍大，也还在扩张
        - label: 品牌 / 客户验证
          value: 7
          unit: /10
          detail: Manner 在核心市场的相关性清晰
        - label: 护城河韧性
          value: 6
          unit: /10
          detail: 品牌和业态重要，但折扣锚仍然很强
        - label: 经济性可见度
          value: 4
          unit: /10
          detail: 公开单店经济性仍不完整，也未经审计
        - label: 风险 / 控制成熟度
          value: 5
          unit: /10
          detail: 劳工和披露问题仍然重要
        - label: 估值支撑
          value: 5
          unit: /10
          detail: 估值公允到偏满，并不明显便宜
    claimRefs:
      - CV019
      - CV031
      - CV032
      - CV033
      - CV034
      - CV041
