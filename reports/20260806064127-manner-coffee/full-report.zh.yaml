chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与门店模型
        blocks:
          - type: paragraph
            body: >-
              Manner Coffee 于 2015 年由 Han Yulong 和 Lu Jianxia 在上海静安区创立，早期身份围绕极小的即买即走业态，而不是休闲堂食式咖啡馆。多份留存资料把首店描述为 2
              平方米或同样极简的街边小店；这一点重要，因为小店模型不是外观细节，而是运营逻辑：它让 Manner 能以主流城市价格卖出精品风格的意式浓缩饮品。Baidu Baike、Jiemian
              Global、KrASIA、Bamboo Works 以及后续 IPO 报道摘要的公开描述，都指向同一个主张——高品质但负担得起的咖啡，主要落在 RMB15-RMB25
              价格带，把咖啡做成日常习惯，而非偶尔消费的高端享受。


              随着连锁扩张，这套模型仍坚持直营。Manner 官方网站明确警示，公司从未开放加盟或代理渠道，第三方加盟网站均为欺诈。FoodTalks 2025 年 IPO
              传闻跟进报道也补充，内部加盟意向调查并不等于实际开放加盟。后续章节要回到这一点：Manner
              的品牌一致性、劳动强度和资本需求，都来自同一个选择——让门店保持小型、标准化、公司运营，而不是把执行风险转给加盟商。即便 Manner 从意式浓缩
              扩展到茶饮、果汁、烘焙、挂耳、设备和联名商品，核心身份仍是一家根植于城市高出杯快取场景的直营、平价精品咖啡连锁。
