              2026 年 Q1 申报文件展示了规模、外卖和促销强度碰撞后的结果：外卖费用可能远快于收入增长，门店层面利润率可能压缩，甚至品类领导者也可能看到同店销售走弱。对 Manner
              来说，含义很清楚：劳动力质量、外卖结构和租金纪律，与消费者对品牌的喜爱同样重要。
