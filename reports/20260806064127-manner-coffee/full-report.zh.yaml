      - number: '1.2'
        title: 创始人、控制权与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑一个稳定的创始人故事，但不能支撑透明治理。Baidu Baike、Bamboo Works 和 FoodTalks 都将 Han Yulong 与 Lu Jianxia
              识别为创始夫妻；EqualOcean 2021 年 3 月报道称，Temasek 轮之后二人仍持有约 40% 股份。这足以把 Manner
              视为一家由创始人塑形的公司，而不是股权分散、职业经理人主导的平台。同一批资料也显示，管理层守住了连锁最有辨识度的选择之一——即便投资人压力和全国扩张加速，公司仍坚持直营而非加盟。


              公开资料没有给出董事会图谱、委员会结构，也没有披露创始人和运营实体 Shanghai Yinhe Industrial Co., Ltd.
              之外的核心高管梯队。治理空白不是不当行为的证据，但对尽调很关键：公司规模已大到投资人应当看到更多控制权、继任深度，以及门店运营、人力、财务和合规责任人的信息。2024 年 6
              月劳工事件让这种治理稀薄更重要：公开讨论很快从个别咖啡师转向人员配置政策、流程设计，以及组织扩张是否快过了一线管理系统。
