  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、玩家类别，以及 Manner 真正的竞争位置
        blocks:
          - type: paragraph
            body: >-
              看 Manner 的竞争时，误区是问它究竟是更小的 Starbucks，还是更慢的 Luckin。留存证据显示都不是。Manner
              位于性价比便利和精品品质的交叠处：以日常精品价销售，运营极小直营门店，并在消费者想要比补贴型大众连锁更好的咖啡、但不想久坐咖啡馆或支付 Starbucks
              价格的密集城区最容易跑出。这意味着真正的对手集合是多层的。Luckin 和 Cotti 是规模与价格领导者，压迫日常高频；Starbucks、Peet’s 和 Costa
              是高端既有玩家，塑造支付意愿和品质标杆；M Stand 及类似精品经营者展示设计感精品咖啡如何赢得注意力，但扩张更慢。换句话说，Manner
              同时跨多个类别竞争，但只有狭窄中间带最强：平价精品、快速、城市、高度策划。
