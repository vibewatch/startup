      - number: '7.2'
        title: 劳动力、品质与运营风险
        blocks:
          - type: paragraph
            body: >-
              公开记录里最显眼的负面事件，是 2024 年 6 月的用工争议。它重要不只因为发生了两起事件，而是因为报道都指向同一个底层机制：
              小店型、高周转模式在排班和流程缓冲过薄时会变脆。公开报道把这些事件与长时间等待、激进的早高峰流程、弱店单人值守以及出杯量压力联系起来。 这些不能证明 Manner
              整套系统已经坏掉，但足以证明下行路径真实存在。公司的价值主张，是用可负担价格交付接近精品咖啡的品质，同时不采用传统咖啡馆那种宽敞、慢服务模式。
              因此，用工组织、排队管理、清洁纪律和培训质量都是核心经济变量。一旦顾客直接看见等待、不稳定或员工压力，模式原本低摩擦的便利性就会反过来伤害品牌。
              运营尽调因此应少看抽象文化表述，多看可衡量的排班、培训、审计和投诉指标。
