      - number: '8.4'
        title: 投资判断与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              实际投资结论是：认可公司重要性，但价格要有纪律。Manner 显然应列入中国具有全国分量的消费品牌清单，但公开网络证据更自然地支持跟踪或继续研究，而不是直接给出有把握的买入判断。
              问题不在于这门生意是否存在，也不在于消费者是否在意；这些问题已经有答案。问题在于，当前流传的估值区间是否有足够的经审计披露、成熟门店经济性、治理准备度和控制证据支撑。
              现在还没有。这不意味着故事已经坏掉。它意味着下一轮尽调应少追新叙事，多证明叙事所暗示的经济性。 如果管理层能补上最大的证据缺口，估值精度可能很快提高。如果不能，不确定性本身就会成为价格的一部分。
              对投委会讨论来说，最健康的表述是：估值公允偏满，只有在证据基础改善之后，才有真正的上行选择权。
