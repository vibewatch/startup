    rows:
      - - 人均消费增长
        - 驱动因素
        - 2023 为 16.74 杯，2025 为 28.57 杯
        - 咖啡正从偶发购买变成习惯性消费
      - - 上海门店密度
        - 驱动因素
        - end-2023 为 9,553 家门店；2025 为 10,336 家
        - 加深最早孕育 Manner 的城市级生态
      - - 云南精品化升级
        - 驱动因素
        - 到 2025，精品率从 8% 升至 31.6%
        - 强化以品质驱动的连锁品牌所需的供给侧支撑
      - - 数字化点单与外卖
        - 驱动因素
        - 2019-2023，上海外卖订单增长 40%
        - 支撑微型门店的便利性经济模型
      - - 价格战
        - 约束因素
        - 促销价被打到 RMB9.9、RMB8.8 和 RMB2.9
        - 压缩品质可及品牌的定价空间
      - - 高开关店率 / 供给过剩
        - 约束因素
        - 2024 至 Aug 2025，新开 172,892 家、关闭 119,726 家
        - 说明许多经营者门槛低、持续性弱
      - - 下沉市场迁移
        - 约束因素
        - Manner 仍高度集中在一线城市
        - 核心都市圈之外的增长仍未被验证
      - - 直营资本负担
        - 约束因素
        - 前六大中，Manner 与 Starbucks 是主要直营连锁
        - 限制 Manner 相比重合作的对手扩张速度
    notes: 这里把需求、供给和运营模式因素放在一起，因为市场顺风真实存在，但并非每种业态都能同样变现。
