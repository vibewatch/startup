  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与背后的资产栈
        blocks:
          - type: paragraph
            body: >-
              Manner
              更像一套由城市小店交付的精品咖啡操作系统，而不是普通咖啡馆连锁。核心产出是一杯平价精品意式浓缩饮品，但真正的产品包还包括极小门店面积、保留手作感的半自动制备、品牌驱动的联名，以及直接控制的零售环境。官方网站反加盟立场很重要，因为它说明公司把一致性和控制也视为产品本身的一部分，而不只是法律偏好。多篇外部文章也指向同一底层架构：从微型「窗口店」起步，靠低租金业态快速复制，并在精品信号与日常可得之间取得平衡来建立品牌资产。落到实际，Manner
              的资产包括饮品、门店形态、设备栈、培训系统、采购和烘焙纪律，以及让品牌保持文化新鲜感的联名引擎。
