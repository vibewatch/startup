      - number: '7.3'
        title: 依赖、竞争与模式风险
        blocks:
          - type: paragraph
            body: >-
              Manner 的第三组风险，来自它的模式卡在两极之间。它比 Luckin 或 Cotti 更高端、更有精品感，但仍在一个价格锚点越来越受大型连锁、外卖补贴和便利性预期塑造的市场里竞争。
              近期行业评论显示，中国咖啡战能把价格压到极低，同时让行业利润率继续承压。这不意味着 Manner 必须模仿最低价，但消费者会不断被更低的价格锚点提醒。 同时，Manner
              的直营形态会集中依赖风险。公司比加盟连锁保留更多控制权，但这种控制也把薪酬、设备在线率、点位产出和供应商表现都压在母公司肩上。
              公司还与密集办公商圈日常和快速自提行为绑定，因此暴露在客流变化、房东议价能力和城市结构集中度之下。 需求健康时，这个模式可以优雅扩张；一旦有冲击，它也会传导得很快。
