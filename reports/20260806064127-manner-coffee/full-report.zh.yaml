            body: >-
              耐久度的公开信号是混合的。正面看，Manner 可负担的价格带、密集城市门店和评论模式，正是能够支撑习惯形成的特征。负面看，没有留存资料给出分组
              留存、复购频次、流失率或客户生命周期价值。因此，投资人只能用代理指标而不是硬指标推理。最强代理指标包括拥挤门店、高峰期建议线上下单的评论，以及公司持续用联名和数字触点刷新需求的能力。最强负面信号包括等待时间投诉、单人门店承压证据，以及表明服务质量会在压力下断裂的公开事件。换句话说，Manner
              在最强街区很可能确有真实复购，但留存资料包仍无法量化这种重复行为是否足够有韧性，可以穿越最成熟咖啡街区之外的扩张。
