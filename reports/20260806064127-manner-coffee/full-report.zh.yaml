      - number: '2.2'
        title: 买方分层与 Manner 的可服务市场
        blocks:
          - type: paragraph
            body: >-
              Manner 的 SAM 建在城市日常消费上，而不是宽泛的咖啡好奇心上。上海政府报道把外带咖啡增长与 28 至 43 岁消费者相连，Daxue 和学术 Manner
              研究则反复把品牌锚定在白领、一线城市和写字楼区行为。Siam 研究补上了运营纹理：Manner 门店聚集在购物中心、办公楼、社区街铺，甚至地铁站；微信小程序、外卖平台和电商触点用来缩短等待、扩大触达。这不是传统
              Starbucks 那种「第三空间」停留市场，而是便利加品质市场：买方、用户和付款者往往是同一个人，购买频繁、客单低，并强烈受通勤路线和办公室密度影响。


              这套分层逻辑也解释了 Manner 市场为何小于整体行业大盘口径。FoodTalks 称，尽管 Manner 到 2025 年末已有超过 2,200
              家门店，全国门店数仍排名第六，意味着这家连锁已有分量，但仍远小于价格战和加盟巨头。Daxue 称到 2025 年 Manner 仍有 73.9% 门店位于一线城市，KrASIA 和 Bamboo Works
              也将网络描绘为高度集中在上海和前五大城市。这种集中不只是风险，也证明了 Manner 认为自身产品市场匹配最强的位置。公司今天真正可服务的市场，是高频、平价精品的城市现制咖啡场景，而不是全国饮品总盘子。
