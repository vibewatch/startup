      - number: '8.3'
        title: 乐观、基准、悲观情景与区间逻辑
        blocks:
          - type: paragraph
            body: >-
              把证据拆成锚点、可比公司标准和情景驱动因素后，区间会更清楚。乐观情景并不虚：Manner 确实有品牌强度、在密集城市里的强存在感，以及足以吸引顶级资本和 IPO 传闻的规模。
              如果成熟门店经济性强于外部预期，且直营继续保护品质，公司有可能支撑溢价叙事。 悲观情景同样直白。价格战锚点、用工和服务压力、私营公司不透明，可能让二级市场投资人比后期一级市场投资人更谨慎地给 Manner 定价。
              这种张力说明，用区间比给点目标更诚实。基准情景应更靠近公开锚点组合的中段，而不是传闻数字的顶端。 很容易想象 Manner 将来为什么能证明更高估值；难得多的是证明证据现在已经存在。
              因此，投资人只有在清楚知道哪些缺失文件会推动区间、以及为什么会推动时，才应承销上行。
