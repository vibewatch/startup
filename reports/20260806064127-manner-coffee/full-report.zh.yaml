      - number: '1.3'
        title: 融资历史、估值锚与实体规模
        blocks:
          - type: paragraph
            body: >-
              Manner 的资本历史显示，公司多次拿到高质量投资人，尽管精确股权结构和清算顺位仍未披露。公开资料将 2018 年 Series A 归因于 Today / Capital Today，将 2020 年 12
              月战略轮归因于 H Capital 和 Coatue；2021 年 2 月 Temasek 投资时估值约 US$1.3 billion，2021 年 5 月 Meituan Longzhu 轮将估值推高至
              US$2 billion 以上，随后 2021 年一笔融资里程碑据 Jiemian 称把估值抬至 US$2.8 billion。FoodTalks、Marketech
              APAC、Marketing-Interactive 和 The Standard 均转述 Bloomberg 来源的 2025 年讨论，称 Manner 最早可能在 2026 年以最高 US$3 billion
              估值寻求香港 IPO。Baidu Baike 另称，胡润 2024 Global Unicorn List 对公司的估值为 RMB20 billion，2025 年榜单为 RMB20.5 billion。


              实体规模比财务规模更容易验证。Jiemian 报道 2023 年末门店达到第 1,000 家，Yicai 称截至 2024 年 6 月 20 日门店接近 1,300 家，Baidu 称 2025 年 2 月达到
              1,800 家，FoodTalks 引用 2025 年 11 月中旬超过 2,000 家直营店以及 Narrow Door 追踪的 2,234 家门店。地理分布仍然集中：2023 年末超过一半门店在上海；按
              KrASIA / Bamboo 的统计，约 56% 在上海；KrASIA 引用的数据称 88% 位于前五大城市；Siam 研究到 2024 年底仍描述其集中在一线城市。因此，Manner
              更像是一家仍在验证可迁移性的第一梯队城市规模冠军，而不是全国均衡连锁。
