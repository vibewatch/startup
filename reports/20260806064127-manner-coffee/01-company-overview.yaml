- id: unit-economics-and-adverse-signals
  title: Store economics, milestones, and adverse operating signals
  body: 'The most attractive part of the public Manner story is that the compact store format appears capable of high throughput without the brand dropping into Luckin-style subsidy logic. Jiemian reported about RMB7,500 of average daily revenue per store, roughly RMB20 per customer, and about 400 cups per day. KrASIA pushed the bull case further, citing average stores above 500 cups a day, best stores up to 700 cups, 2020 revenue of RMB200 million-RMB300 million, Shanghai-store profitability, and a claimed monthly net profit of RMB57,000 per store at about a 24% margin. Those numbers are partly management-linked and not filing-grade, but they do explain why blue-chip investors kept funding the rollout. They also help explain why Manner has resisted franchising: the model only works if a compact store can sustain high cup throughput while keeping product quality and staffing standards high.


    The downside is that the same efficiency logic can produce operational stress. TechNode, Yicai, SCMP, Sina, and Dao all covered the June 2024 conflicts between baristas and customers in Shanghai. Sina said only 1,225 employees had social-insurance contributions in 2023, while Yicai described 500-cup stores staffed by around three workers and TechNode reported claims that some lower-volume stores had only one person covering stock, ordering, drink-making, and cleaning. Manner apologized, promised training and operational adjustments, and said it would improve employee care. The incident should be read not as a one-off PR embarrassment but as evidence that Manner''s small-store, high-turnover system can create real execution strain when network size outruns store-level process capacity.'
