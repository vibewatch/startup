- id: funding-scale-and-footprint
  title: Funding history, valuation anchors, and physical scale
  body: 'Manner''s capital history shows repeated access to high-quality investors, even though the exact cap table and liquidation stack remain undisclosed. Public sources attribute the 2018 Series A to Today/Capital Today, the December 2020 strategic round to H Capital and Coatue, a February 2021 Temasek investment at roughly a US$1.3 billion valuation, a May 2021 Meituan Longzhu round that pushed valuation above US$2 billion, and a later 2021 financing milestone that Jiemian says lifted valuation to US$2.8 billion. FoodTalks, Marketech APAC, Marketing-Interactive, and The Standard—each relaying Bloomberg-sourced 2025 discussions—say Manner may seek a Hong Kong IPO as early as 2026 at up to a US$3 billion valuation. Baidu Baike separately says Hurun''s 2024 Global Unicorn List valued the company at RMB20 billion and the 2025 list at RMB20.5 billion.


    Physical scale is easier to verify than financial scale. Jiemian reported the 1,000th store milestone in late 2023, Yicai said the chain had nearly 1,300 stores by 20 June 2024, Baidu said it reached 1,800 stores by February 2025, and FoodTalks cited over 2,000 directly operated stores and 2,234 Narrow Door-tracked stores by mid-November 2025. Geography is still concentrated: more than half the stores were in Shanghai in late 2023, roughly 56% sat in Shanghai on KrASIA/Bamboo''s accounting, 88% were in the top five cities on KrASIA''s cited data, and the Siam study still described first-tier-city concentration at end-2024. Manner therefore looks less like a nationally balanced chain and more like a first-tier-city scale champion that is still proving portability.'
