- id: founders-and-governance
  title: Founders, control, and governance opacity
  body: 'The retained public record supports a stable founder story but not a transparent governance one. Baidu Baike, Bamboo Works, and FoodTalks all identify Han Yulong and Lu Jianxia as the founding couple, while EqualOcean reported in March 2021 that the two still held about 40% of shares after the Temasek round. That is enough to treat Manner as a founder-shaped business rather than a diffuse professionally managed platform. The same sources also reinforce that management has protected one of the chain''s most distinctive choices—remaining directly operated instead of franchising—even as investor pressure and national rollout accelerated.


    What the public sources do not provide is a board map, committee structure, or a named executive bench beyond the founders and the operating entity, Shanghai Yinhe Industrial Co., Ltd. The governance gap is not proof of wrongdoing, but it is material for diligence because the company is now large enough that investors should expect more visibility on control rights, succession depth, and who owns store-operations, HR, finance, and compliance accountability. The labor incidents of June 2024 make this governance thinness more important: public discussion quickly moved from individual baristas to questions about staffing policy, process design, and whether the organization had expanded faster than its frontline-management systems.'
  claimRefs:
  - CO002
  - CO005
  - CO017
