companyProfile:
  summary: Manner Coffee is a Shanghai-headquartered specialty coffee chain founded in 2015 by Han Yulong and Lu Jianxia. The company scaled from a tiny Shanghai storefront into a national direct-operated network with more than 2,000 stores, built around grab-and-go urban locations, premium-accessible pricing, and high-throughput espresso service. Public evidence supports a business with strong brand relevance, notable blue-chip investors, and real national scale, but still limited disclosure on cash generation, governance, and mature-store economics.
