  foundingLocation: Jing'an District, Shanghai, China
  headquarters: Shanghai, China
  productSummary: Espresso-based coffee drinks, seasonal beverages, beans and retail coffee products, plus adjacent bakery or collaboration items sold primarily through direct-operated small-format stores and digital ordering surfaces.
  customerFocus: Urban office workers, commuters, and value-conscious specialty coffee consumers in China's first-tier and new first-tier cities, with some expansion into broader national and lifestyle-collaboration audiences.
  businessModel: Direct consumer beverage sales through company-operated micro-stores, pickup and delivery workflows, and tightly standardized specialty-coffee operations designed for fast urban throughput rather than long in-store dwell time.
  stage: Late-stage private / likely pre-IPO but still publicly under-disclosed as of the run date
  fundingStatus: Public reporting supports blue-chip backing from investors including Temasek, Meituan Dragon Ball, ByteDance, H Capital, and Coatue, along with historical valuation marks above US$2 billion and current headline valuation anchors around RMB20 billion / US$2.8 billion.
