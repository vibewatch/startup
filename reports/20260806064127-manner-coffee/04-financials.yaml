- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public evidence
  - current status
  - why it matters
  - diligence ask
  rows:
  - - Historical equity backing
    - Temasek-led 2021 round; later investor roster reported to include ByteDance and Meituan-linked capital
    - Partially visible
    - Demonstrates prior capital access and investor quality
    - Request full cap table and post-money history
  - - Current cash on hand
    - No retained public disclosure
    - Unknown
    - Central to runway and expansion pace
    - Request latest cash, restricted cash, and short-term investments
  - - Debt / lease obligations
    - No retained public disclosure
    - Unknown
    - Direct-operated stores can hide meaningful fixed commitments
    - Request debt schedule and lease liabilities
  - - Runway months
    - No retained public disclosure
    - Unknown
    - Determines dependence on IPO or new private round
    - Request management runway under base and stress scenarios
  - - Planned financing path
    - Late-2025 IPO reporting at up to ~US$3B valuation
    - Potentially active but unconfirmed
    - Could fund expansion, systems, and governance upgrades
    - Request explicit use-of-proceeds plan and listing readiness status
  - - Legal / brand contingency
    - Trademark dispute and labor-management issues remain visible overhangs
    - Material risk area
    - May consume cash or management attention even if not huge financially
    - Request legal reserve and contingent-liability view
  notes: This table is intentionally honest about what is not public. Capital adequacy is the chapter's biggest unresolved area.
