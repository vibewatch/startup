tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current public value / status
  - quality
  - diligence ask
  rows:
  - - Self-operated beverages
    - Owned-store drink sales
    - Sales per store / network
    - Core visible revenue engine
    - High-quality if repeatable; directly customer-paid
    - Request audited revenue and same-store sales by cohort
  - - Delivery / mini-program orders
    - Third-party delivery and digital ordering
    - Channel mix %
    - Clearly present in the model, but no public Manner mix disclosed
    - Likely material but margin-dilutive
    - Request order mix by walk-in, pickup, and delivery
  - - Seasonal or non-coffee products
    - Menu extensions and limited products
    - SKU / mix contribution
    - No retained quantified mix for Manner
    - Unknown contribution
    - Request category revenue mix and gross margin by product type
  - - Packaged / retail products
    - Beans, RTD, or other off-premise items
    - Revenue share
    - No retained public quantified stream
    - Currently unproven in retained pack
    - Request whether retail is strategic or immaterial
  - - Franchise / royalty / partnership income
    - Fees from third-party-operated stores
    - Royalty or service revenue
    - Not visible because Manner still says no franchising
    - Absent today, which simplifies revenue quality
    - Confirm whether any pilot partnership economics exist
  notes: 'The retained pack points to a simpler revenue model than many coffee chains: direct-operated beverage sales first, with most other streams either small, private, or not yet active publicly.'
