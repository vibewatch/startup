- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'On capital adequacy, the public story is much weaker than the operating story. Company Overview established the historical funding chronology, and the retained sources here are enough to restate only the forward-looking essentials: Temasek led a round at about a US$1.3 billion valuation in 2021, later investors reportedly included ByteDance and Meituan-related capital, and by late 2025 multiple outlets were again describing a potential Hong Kong IPO at up to roughly US$3 billion. That is useful directional context, but it does not answer the key underwriting questions. No retained source discloses cash on hand, debt, monthly burn, lease obligations, or runway. That leaves investors with a tension: if Manner’s mature stores really are attractive, then retained earnings may be meaningful; if the company still needs a public listing to fund rapid expansion, labor-system upgrades, and legal or brand contingencies, then cash generation may not be sufficient for the growth ambition. The
    gap is not just informational; it is central to valuation.'
