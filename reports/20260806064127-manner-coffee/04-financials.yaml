- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - impact on underwriting
  - closest public proxy
  - exact diligence path
  rows:
  - - Audited revenue
    - Cannot test true scale or growth rate
    - Store-count × store-day proxy
    - Request audited annual and trailing-twelve-month revenue
  - - Revenue mix by channel
    - Cannot separate pickup from delivery margin quality
    - Qualitative online-channel evidence only
    - Request channel revenue, orders, and contribution margins
  - - Same-store sales and cohort productivity
    - Cannot test whether expansion is dilutive
    - Jiemian strong-store snapshot only
    - Request cohort table by opening year and city tier
  - - Cash, debt, and runway
    - Cannot judge financing dependency
    - IPO rumor coverage only
    - Request latest balance sheet and 12-month cash forecast
  - - Capex and payback per store
    - Cannot test capital intensity properly
    - Micro-store narrative only
    - Request build cost, remodel cost, and payback by format
  - - Customer frequency / retention
    - Cannot underwrite revenue quality durability
    - Brand and loyalty narratives only
    - Request repeat-rate, MAU, and cohort retention by channel
  notes: Every missing line item here is a real blocker to underwriting, not a cosmetic disclosure preference.
