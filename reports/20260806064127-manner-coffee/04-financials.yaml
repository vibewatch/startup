- id: unit-economics-cost-structure-and-channel-pressure
  title: Unit economics, cost structure, and digital-channel pressure
  body: 'The most attractive public financial evidence for Manner is at store level. Jiemian’s snapshot of RMB7,500 in average daily revenue, roughly RMB20 average spend, about 400 cups per day, and around RMB57,000 monthly net profit suggests a compelling mature-store profile in strong districts. KrASIA’s comments about 500-plus cups per day and peak stores around 700 cups reinforce the view that throughput, not luxury pricing, is the heart of the model. The academic sources add context: moderate prices, trained baristas, high-density channel placement, and online-offline integration are all treated as strategic levers. Still, China coffee economics are not benign. Luckin’s 2025 and Q1 2026 filings show what happens when scale, delivery, and promotion intensity collide: delivery expenses can rise much faster than revenue, store-level margins can compress, and even the category leader can see same-store sales weaken. For Manner, the implication is clear: labor quality, delivery mix, and
    occupancy discipline will matter as much as consumer love for the brand.'
