- id: TI003
  title: Unit economics table
  columns:
  - metric
  - public value / proxy
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Average daily revenue per store
    - ~RMB7,500
    - Medium
    - Primary public anchor for store productivity
    - Request distribution by city tier and store age
  - - Average order value
    - ~RMB20
    - Medium
    - Links cup volume to sales density
    - Request split by beverage type and discounting
  - - Cups per day
    - ~400 average; 500+ common in some stores; top stores ~700
    - Medium
    - Throughput is the main engine of small-store economics
    - Request cups/day by format and daypart
  - - Monthly net profit per leading store
    - ~RMB57,000
    - Medium
    - Suggests mature-store attractiveness
    - Request median and quartile store contribution, not just top stores
  - - Net margin at cited store level
    - ~23.75%
    - Medium
    - Provides rare public profitability clue
    - Request gross margin, labor ratio, rent ratio, and delivery-fee ratio
  - - Annualized system-sales proxy
    - ~RMB6.1B
    - Low
    - Directional scale anchor for valuation work
    - Replace proxy with audited revenue and GMV
  - - Delivery economics
    - Visible in model, but no Manner public %
    - Low
    - Critical because peer filings show strong margin sensitivity
    - Request channel contribution margin after commissions
  notes: The table separates direct public store markers from estimates. The system-sales figure is a proxy, not a reported company number.
