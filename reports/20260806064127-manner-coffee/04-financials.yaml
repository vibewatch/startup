- id: TI002
  title: Pricing / monetization table
  columns:
  - item or comparator
  - public price anchor
  - what it likely represents
  - what it does not prove
  - implication
  rows:
  - - Manner core drinks
    - RMB15-RMB25
    - Everyday premium-accessible menu positioning
    - Realized net revenue after vouchers, channel fees, or wastage
    - Supports better revenue quality than deep discount coffee if traffic holds
  - - Average Manner basket
    - ~RMB20
    - Typical customer spend per order in cited Jiemian snapshot
    - All-city or all-format average across the chain
    - Useful bridge from cup volume to store-day revenue
  - - Luckin
    - Value-led public positioning
    - Mass-frequency price umbrella and promo elasticity benchmark
    - A stable comparable list-price grid in retained pack
    - Shows the price pressure Manner must resist
  - - Starbucks China
    - Premium umbrella positioning
    - Top-end benchmark for willingness-to-pay
    - Manner’s realized share of premium demand
    - Frames how Manner can undercut without becoming discount
  - - Peet's China
    - ~RMB40 on premium brand; Ora at roughly RMB15-RMB25
    - Upper-end premium and dual-brand contrast
    - Directly comparable same-city realized ticket
    - Shows how even premium chains may need lower-price experiments
  notes: Official list pricing and media snapshots are useful positioning anchors, but they are not realized revenue, net margin, or channel-adjusted basket economics.
