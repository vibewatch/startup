  - type: private-evidence-only
    severity: material
    topic: labor-model-data
    missingEvidence: No public staffing ratios, attrition, shift economics, or complaint-rate dashboard exists for Manner despite the 2024 controversy.
    whyItMatters: That prevents investors from telling whether the incidents were isolated or systemic.
    diligencePath: Request store-tier staffing model, attrition by role, customer complaint rates, and overtime / break compliance metrics.
