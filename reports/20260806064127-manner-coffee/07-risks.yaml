  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: license-and-audit-pack
    missingEvidence: No public license inventory, audit pass rates, recall history, or formal incident-response KPI pack is available for Manner.
    whyItMatters: Without it, the chapter can identify the applicable regulatory burden but not judge compliance maturity.
    diligencePath: Request all active food-business licenses, regional audit scores, corrective-action logs, and incident escalation policies.
    relatedQuestionRefs:
