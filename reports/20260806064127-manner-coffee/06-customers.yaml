- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - First-tier commuter success
    - Shanghai and top-tier concentration may overstate chain-wide repeatability
    - Expansion thesis could fail in less mature coffee cities
    - Request repeat rates and payback by city tier
  - - Lifestyle collaborations
    - Campaign excitement may not convert into routine orders
    - High awareness but weak long-term economics
    - Request cohort conversion from campaign buyers to repeat buyers
  - - Digital ordering convenience
    - Channel growth may improve access without improving loyalty
    - Order volume could rise faster than durable repeat usage
    - Request channel retention and contribution by QR, pickup, and delivery
  - - Tourist / destination branches
    - Photo-driven or scenic traffic may not behave like daily coffee routines
    - Reported demand may look stronger than commuter-only reality
    - Split performance for scenic / destination stores versus routine stores
  - - Compact store model
    - Queues and service strain may cap repeat rates if staffing is thin
    - Satisfaction deterioration can erode retention quietly
    - Request wait-time, complaint, and remake metrics by cohort
  - - Sparse public CRM disclosure
    - No public cohort data to test concentration or expansion durability
    - Underwriting remains inference-heavy
    - Request customer database segmentation, MAU, and cohort retention
  notes: The table converts public proof gaps into specific management asks rather than pretending they are already answered.
