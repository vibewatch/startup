  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / visibility
  - strategic value
  - gap
  rows:
  - - First-tier office commuters
    - Usually the same individual across all three roles
    - Fast daily coffee before or during work
    - Highest visibility in Shanghai and top-tier districts
    - Core repeat-volume segment
    - Need order-frequency and basket data by daypart
  - - Quality-seeking young professionals
    - Individual buyer-user-payer
    - Accessible specialty coffee without Starbucks ticket
    - Strongly supported across consulting and media sources
    - Defines the brand’s main positioning edge
    - Need clearer demographic and income distribution
  - - Tourists / scenic-location visitors
    - Individual buyers
    - Coffee plus view or destination stop
    - Visible in Trip.com branch content
    - Adds visibility and social spread
    - Unclear repeat value outside travel context
  - - Lifestyle / collaboration participants
    - Individual buyers with social-posting behavior
    - Matcha, themed drinks, merchandise, pop-ups
    - Visible in named campaigns
    - Expands discovery beyond commuter base
    - Need conversion from campaign participation to repeat usage
  - - Delivery / QR-order users
    - Individual buyers
    - Avoid queues and improve convenience
    - Publicly visible but not quantified
    - Extends demand beyond walk-in traffic
    - Need channel mix and repeat-rate by channel
  notes: Segments reflect public usage patterns and campaign evidence, not a management CRM export.
