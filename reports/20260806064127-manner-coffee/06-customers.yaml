- id: TU003
  title: Named customer proof table
  columns:
  - customer / audience
  - segment
  - deployment / use case
  - production vs pilot
  - outcome / proof
  - limitation
  rows:
  - - Tripadvisor reviewer at Jinhongqiao branch
    - Urban coffee customer
    - In-person branch visit and service review
    - Production customer experience
    - Praised quality and cleanliness; complained about slow service; recommended online pre-order
    - Single review, not a representative sample
  - - Trip.com reviewers / travelers
    - Tourist and lifestyle audience
    - Branch visits, scenic seating, QR/app ordering behavior
    - Production customer experience
    - Accessible pricing, queue strategies, and destination appeal are visible
    - AI-generated summary and branch heterogeneity reduce precision
  - - Kimi mini-program buyers
    - Digital collaboration audience
    - Co-branded drink and AI pickup-line mini-program flow
    - Live campaign activation
    - Positive reactions, coupons, merchandise, and social spread
    - No repeat-purchase or basket-value data
  - - NEIWAI collaboration participants
    - Lifestyle / fashion audience
    - Buy three drinks and post café photo on Xiaohongshu to join raffle
    - Live campaign activation
    - Shows purchase-plus-content loop and female lifestyle audience reach
    - Campaign proof does not equal long-term retention
  - - UCCA exhibition audience
    - Art and culture audience
    - Banana-themed drinks, pop-up store, mug
    - Live campaign activation
    - Shows ability to convert art partnership into physical-store interaction
    - No published sales or repeat outcome
  - - Rest With Manner collaboration consumers
    - Gen Z and lifestyle shoppers
    - Immersive themed flagship spaces and limited merchandise
    - Live campaign activation
    - Shows cross-category discovery and brand-community building
    - Partner-authored and not a direct repeat-usage metric
  - - Atlantis consumer-engagement study
    - Academic / conceptual audience proof
    - Promotion and engagement analysis
    - Analytical, not live branch deployment
    - Shows Manner had enough public customer momentum to attract academic study
    - Not direct operational retention proof
  notes: This is a partial enumeration of the named public customer or campaign proofs visible in retained sources, not a full census of Manner’s consumer base.
