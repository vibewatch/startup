  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: digital-architecture
    missingEvidence: No public architecture, uptime, escalation, or channel-routing documentation for Manner's ordering, scheduling, or delivery-support systems.
    whyItMatters: The company increasingly relies on digital support, but the retained pack does not show how resilient, integrated, or internally built those systems are.
    diligencePath: Request system map, vendor list, order-routing logic, incident-response playbook, and channel uptime metrics.
    relatedQuestionRefs:
    - QE007
    - QE008
    - QE009
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: quality-kpis
    missingEvidence: No public pass rates, refresh cadence, drink-error rates, or customer-service quality KPIs for the training academy or store network.
    whyItMatters: A craft-heavy model scales only if the company can standardize quality faster than it adds stores and staff.
    diligencePath: Request academy curriculum, certification rates, mystery-shop scores, incident logs, and remake/error metrics by store cohort.
    relatedQuestionRefs:
    - QE006
    - QE012
    - QE017
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: supply-dependency
    missingEvidence: No public detail on machine suppliers, grinder maintenance cycles, milk contracts, roasting capacity, or contingency inventory.
    whyItMatters: These dependencies directly affect product consistency and downtime risk in a store network built on specialized preparation.
