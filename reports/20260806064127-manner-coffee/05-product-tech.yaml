- id: trust-safety-and-roadmap-risks
  title: Trust, safety, and roadmap risks as the system scales
  body: 'The biggest product-tech risks are not whether Manner can roast beans or pull espresso—they are whether the operating system can remain stable while the network expands. Yicai’s labor-controversy reporting shows how service quality can fracture under staffing pressure. FoodTalks’ franchise-survey article shows that the company is being pulled between tight control and the expansion logic of a much larger chain. And the trademark dispute means even brand-control surfaces can become operational risk if customers, partners, or counterfeit actors exploit confusion. The roadmap is therefore visible mostly through fragments: more stores, more digital support, more collaborations, possible experiments around distribution or franchise logic, and ongoing supply-chain involvement from the founder. What is missing is an explicit public roadmap for digital ordering architecture, reliability metrics, incident-response standards, or quality KPIs by store cohort. That is the core diligence gap
    for this chapter. That missing telemetry is unusual for a chain of this ambition.'
