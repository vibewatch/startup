  summary: Manner's product stack runs from beans and equipment through barista execution to the brand-experience layer.
  data:
    layers:
    - label: Brand / experience layer
      description: Affordable specialty positioning, collaborations, seasonal menus, and everyday-premium identity
      detail: This top layer tells customers why Manner feels more curated than a discount chain without becoming a luxury café.
    - label: Store operation layer
      description: Small direct-operated stores, pickup workflow, and delivery expansion
      detail: The store layer is optimized for speed, dense urban footfall, and controlled execution rather than long dwell time.
    - label: Preparation layer
      description: Semi-automatic machines, high-end grinders, milk handling, and barista preparation steps
      detail: Craft cues remain visible because drink quality is produced through human execution supported by professional equipment.
    - label: Control layer
      description: Training academy, quality-control routines, anti-franchise governance, and assessments
      detail: This layer tries to standardize taste and service while protecting channel integrity as the network grows.
    - label: Supply layer
      description: Bean sourcing, roasting, ingredients, and urban site selection
      detail: Sourcing discipline and dense-city location strategy anchor consistency and throughput underneath the consumer-facing brand.
