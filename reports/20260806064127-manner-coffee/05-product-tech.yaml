  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Semi-automatic machines
    - Preserve craft and extraction control
    - Skilled baristas and maintenance
    - Training burden and inconsistent execution
  - - High-end grinders
    - Bean consistency and flavor expression
    - Imported equipment and calibration
    - Downtime or calibration drift affects quality
  - - Ordering / scheduling systems
    - Reduce friction and support fast operations
    - Digital tools and store discipline
    - Public tooling visibility is low
  - - Delivery / online channels
    - Extend reach beyond foot traffic
    - Platform integrations and store workflow
    - Can complicate timing and unit economics
  - - Roasting / sourcing discipline
    - Protect bean quality and differentiation
    - Founder attention and supply-chain systems
    - Scale may dilute standards if oversight weakens
  - - Training academy
    - Standardize taste, service, and process
    - Instructor quality and barista retention
    - Rapid hiring can outpace training capacity
  notes: The architecture is mostly an operating model rather than a software stack, which is appropriate for a retail coffee chain.
