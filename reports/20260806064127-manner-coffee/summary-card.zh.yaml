  topStrengths:
    - 公开证据支持它作为直营精品咖啡连锁具备少见的全国规模：门店超过 2,000 家，2025 年底有 2,234 家门店引用。
    - 公司围绕高密度城市自提场景，做出“高级但可负担”的差异化定位，而不是押注 lounge 式 cafe 经济模型。
    - 蓝筹投资人和反复出现的 IPO 传闻说明，机构资本认为 Manner 具备战略相关性。
    - 如果单店经济模型成立，小店、高吞吐模型看起来能跑出可观系统销售额。
    - 中国咖啡市场增长仍有结构性支撑，给 Manner 留出足够大的市场底盘。
  topRisks:
    - 审计财报、现金余额、债务和成熟门店经济模型仍未披露。
    - 2024 年 6 月劳工争议暴露出，一线缓冲太薄时，声誉问题会迅速放大。
    - 品类价格战可能压缩投资人愿意为“高级但可负担”咖啡连锁支付的倍数。
    - 直营模式把执行、薪酬和合规负担集中压在母公司身上。
    - 法务、牌照和治理能否支撑未来 IPO，公开材料只露出一部分。
  unresolvedGaps:
    - 审计收入、EBITDA、capex、现金余额、债务和 24 个月现金续航。
    - 同店销售、成熟店利润率、回本周期和城市层面 cohort 表现。
    - 股权表、清算优先权、反稀释保护和任何二级流动性历史。
    - 完整牌照地图、食品安全审计节奏、事件 KPI 包，以及董事会 / 委员会治理材料。
