- id: constraints-churn-and-lower-tier-translation
  title: 'Constraints: churn, price wars, and lower-tier translation risk'
  body: 'The same market that looks exciting at the top line is brutal at the operating line. Daxue said 172,892 coffee stores opened between 2024 and August 2025, but 119,726 closed, a closure rate severe enough to show that low entry barriers do not translate into durable economics. It also said promotional coffee prices had been pushed down to RMB9.9, RMB8.8, and even RMB2.9 with vouchers. Ken Research similarly describes a market with more than 1,000 brands competing, while FoodTalks’ late-2025 store ranking shows just how much denser the scale leaders already are: Luckin was near 28,000 stores, Cotti above 15,000, and Starbucks China above 8,000 when Manner was at 2,234. In that environment, the market clears on a mixture of convenience, subsidies, density, and brand—not just bean quality.


    This is where lower-tier-city expansion becomes the pivotal market question for Manner. KrASIA argued that no boutique coffee house had yet proved it could conquer rural or lower-tier China at scale, and Daxue framed Manner’s nationwide test as whether a Shanghai-born premium identity could still feel compelling where specialty-coffee culture is thinner and value competition is fiercer. A rough system-sales proxy shows why the issue matters: applying Jiemian’s RMB7,500 average daily revenue figure to FoodTalks’ 2,234-store count suggests about RMB6.1 billion of annualized system sales, or only about 1.7% of the 2025 industry total. The headroom is large. The question is whether the incremental market lies in segments Manner can win without abandoning the direct-operated, higher-service model that created its existing advantage.'
