- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer / user / payer
  - Need state
  - Channel preference
  - Evidence for Manner fit
  rows:
  - - First-tier office commuters
    - Usually the same individual across buyer, user, and payer
    - Fast, reliable daily caffeine with decent quality
    - Pickup, mini-program, delivery
    - Core Manner micro-store use case in Shanghai and similar districts
  - - Lifestyle / social urban consumers
    - Individual buyer-user, sometimes group occasions
    - Aspirational but affordable specialty experience
    - Walk-in, co-branded pop-ups, social sharing
    - Supported by Daxue’s collaboration and lifestyle framing
  - - Delivery-first users
    - Individual payer and user
    - Convenience during office or home routines
    - Delivery platform or mini-program
    - Shanghai takeout growth and Manner’s national delivery launch support this segment
  - - Lower-tier curiosity buyers
    - Individual payer and user
    - Affordable introduction to specialty coffee
    - Mall-based stores and promotional offers
    - Less proven for Manner because brand equity is strongest in mature coffee cities
  - - At-home or retail coffee buyers
    - Household buyer
    - Beans, drip bags, and related products
    - E-commerce
    - Relevant to product adjacency but not the core store-based SAM
  notes: Focuses on who buys and how they adopt, because Manner’s serviceable market is defined more by routine urban behavior than by formal enterprise procurement.
