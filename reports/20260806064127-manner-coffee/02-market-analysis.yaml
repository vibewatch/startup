- id: segment-shape-and-manner-sam
  title: Buyer segments and Manner’s serviceable market
  body: 'Manner’s SAM is built around urban routine consumption rather than broad coffee curiosity. Shanghai government reporting tied takeout-coffee growth to consumers aged 28 to 43, while Daxue and the academic Manner studies repeatedly anchor the brand in white-collar, first-tier-city, office-district behavior. The Siam study adds operational texture: Manner stores cluster in shopping centers, office buildings, community street retail, and even subway stations, with online ordering through WeChat mini-programs, delivery platforms, and e-commerce touchpoints used to reduce wait times and widen reach. This is not a ‘third space’ hangout market like traditional Starbucks; it is a convenience-plus-quality market where the buyer often equals the user and the payer, and where the purchase decision is frequent, low-ticket, and strongly shaped by commute routes and office density.


    That segmentation logic also explains why Manner’s market is narrower than the overall industry headline. FoodTalks placed Manner sixth in national store count in late 2025 despite having more than 2,200 stores, which means the chain is already meaningful but still far smaller than the price-war and franchise heavyweights. Daxue said 73.9% of Manner stores were still in first-tier cities by 2025, while KrASIA and Bamboo Works portrayed the network as highly concentrated in Shanghai and the top five cities. That concentration is not just a risk; it is also evidence of where Manner believes its product-market fit is strongest. The company’s real serviceable market today is the high-frequency premium-accessible fresh-coffee occasion in dense urban China, not the entire national beverage market.'
