- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters
  rows:
  - - Per-capita consumption growth
    - Driver
    - 16.74 cups in 2023 to 28.57 cups in 2025
    - Coffee is becoming a habitual rather than occasional purchase
  - - Shanghai store density
    - Driver
    - 9,553 shops at end-2023; 10,336 in 2025
    - Deepens the city-level ecosystem that originally nurtured Manner
  - - Yunnan specialty upgrade
    - Driver
    - Specialty rate up from 8% to 31.6% by 2025
    - Improves supply-side support for quality-led chains
  - - Digital ordering and delivery
    - Driver
    - Takeout orders up 40% in Shanghai 2019-2023
    - Supports micro-store convenience economics
  - - Price wars
    - Constraint
    - Promotional prices pushed to RMB9.9, RMB8.8, and RMB2.9
    - Compresses room for premium-accessible brands
  - - High churn / oversupply
    - Constraint
    - 172,892 openings versus 119,726 closures from 2024 to Aug 2025
    - Shows low barriers and weak durability for many operators
  - - Lower-tier market translation
    - Constraint
    - Manner remains highly concentrated in first-tier cities
    - Growth outside core metros is still unproven
  - - Direct-operated capital burden
    - Constraint
    - Manner and Starbucks are the main directly owned chains in the top six
    - Limits how fast Manner can scale versus partnership-heavy rivals
  notes: Pairs demand, supply, and operating-model factors because the market tailwind is real but not equally monetizable for every format.
