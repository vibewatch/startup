tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens
  - Included spend / behavior
  - Excluded spend / behavior
  - Why it matters for Manner
  rows:
  - - Broad China coffee TAM
    - Retail coffee products, cafes, chains, delivery, beans, RTD, and household consumption
    - Non-coffee beverages and generalized snack spend
    - Useful for macro direction but too broad for underwriting Manner store economics
  - - Fresh-ground coffee market
    - Cafe and chain purchases of prepared coffee drinks
    - Instant coffee, home pods, and commodity bean trading
    - Closer to where Manner competes operationally
  - - Urban specialty / premium-mass coffee SAM
    - Prepared coffee purchased in first- and second-tier cities by office, lifestyle, and delivery users
    - Rural mass beverage spend and most at-home instant consumption
    - Best public approximation of Manner’s current serviceable market
  - - Manner SOM
    - Direct-operated micro-store purchases at RMB15-RMB25 price points
    - Franchise-heavy, deeply subsidized, or third-space-heavy demand pools
    - Frames what share Manner can realistically win without changing its model
  notes: Uses qualitative boundaries because public market reports disagree on total dollar size but align on the much narrower segment where Manner actually operates.
