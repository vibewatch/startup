  topStrengths:
    - Hardware-agnostic autonomy architecture addresses multiple robot form factors and field environments.
    - Public evidence includes concrete construction workflows and partner-backed deployments.
    - Financing scale and reported deployment breadth provide meaningful strategic and capital validation.
  topRisks:
    - >-
      No audited revenue, ARR, margin, retention, cash, burn, or runway disclosure supports a conventional software
      underwriting case.
    - >-
