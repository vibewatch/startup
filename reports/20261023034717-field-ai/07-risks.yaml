        - label: Pilot-to-production conversion
          values: ["Medium", "High", "Low", "High"]
        - label: Integration and partner dependency
          values: ["Medium", "High", "Partial", "Medium-high"]
        - label: Cybersecurity and privacy
          values: ["Medium", "High", "Low", "High"]
        - label: Capital and valuation compression
          values: ["Medium", "High", "Low", "High"]
    claimRefs: [CR001, CR006, CR013, CR015, CR019]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: The decisive question is whether Field AI can demonstrate safe, repeatable operation by defined operating domain and software version, with customer-level utilization and incident evidence. Public claims of risk-aware design are not a substitute for those denominators.
    claimRefs: [CR001, CR002, CR017]
  - calloutType: recommendation
    title: Thesis-break trigger
    body: A regulator or major customer restricting deployment, a material safety or security event, or repeated failure to convert pilots into contracted recurring use would materially weaken the investment case.
    claimRefs: [CR019, CR020, CR021]
