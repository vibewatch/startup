schemaVersion: "report-v2"
artifact: risks
slug: field-ai
runDate: 2026-10-23
company:
  name: Field AI
chapter:
  number: 7
  title: Risks
  summary: Field AI's core risk is not a demonstrated incident but the difficulty of proving safe, reliable autonomy as deployments move through dynamic industrial environments. Public evidence supports material regulatory, product-liability, operational, dependency, and financing risks, while incident history, insurance, controls, and customer concentration remain incompletely disclosed.
sections:
  - id: risk-ranking
    title: Ranked risk profile
    body: >-
      Field AI's risk profile is dominated by the gap between a safety-oriented product
      narrative and the public evidence needed to underwrite safe operation at scale. The
      company says its models are designed for dynamic, unstructured environments and are
      already deployed across construction, energy, manufacturing, delivery, and inspection
      sites, but those descriptions do not disclose incident rates, near misses, false
      negatives, rollback performance, insurance coverage, or the denominator of successful
      missions. The International AI Safety Report states that general-purpose AI failures
      can create physical harm, financial loss, reputational damage, and legal liability,
      and that no combination of current methods eliminates failures entirely. For Field
      AI, the investment-relevant risk is therefore operational proof: whether bounded
      operating domains, human override, safe shutdown, testing, and monitoring are
      sufficient for each customer environment. The heatmap below treats the residual
      exposure as high where public evidence is thin, not as proof that a harmful incident
      has occurred.
    claimRefs: [CR001, CR002, CR003]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal and regulatory exposure
    body: >-
      The legal surface is expanding in parallel with the company's physical deployments.
      K&L Gates describes a shift toward treating AI functionality as a product, with
      plaintiffs targeting architecture, guardrails, warnings, escalation pathways, and
      foreseeable misuse rather than only individual outputs. It also identifies potential
      liability up and down the supply chain, which matters to a software company that
      integrates with robot manufacturers and customer workflows. The firm's March 2026
      analysis says the EU Product Liability Directive treats software, including AI
      systems, as products and covers substantial modifications, while member states must
      transpose it by December 2026. Baker Botts separately reports 2026 state laws that
      impose risk-framework, incident-reporting, impact-assessment, disclosure, or
      discrimination obligations in relevant AI contexts. These sources are not evidence
      of a Field AI violation. They establish a changing compliance and litigation
      perimeter, making product definition, version history, testing records, safety
      claims, data governance, export controls, and customer allocation of responsibility
      material diligence items.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, partner, and financial dependencies
    body: >-
      Deployment execution creates several linked risks. Field AI's commercial model
      combines software with hardware integration and deployment services, so delivery
      quality depends on sensor-compute payloads, compatible robot platforms, site data,
      customer operators, and reliable support. A job posting describes on-device
      autonomy, customer project-tool integration, and commercial deployment services,
      while public descriptions emphasize operation without maps, GPS, or predefined
      routes. That breadth can accelerate adoption but also expands integration,
      calibration, cybersecurity, and support obligations across different robots and
      jurisdictions. Construction Dive reports that positive evaluations of construction
      robotics increased while the share of firms reporting active use fell from 65% to
      46%, a warning that enthusiasm does not equal durable utilization. Funding and
      valuation signals also do not establish a settled current mark: PrivateMarketView
      carries forward the $2 billion last priced event, while SetterVC labels a possible
      $700 million raise at a $10 billion valuation as an unclosed, unverified signal.
      Without audited financials,
      customer-level concentration, renewal data, or unit economics, capital intensity,
      procurement friction, and the ability to convert pilots into repeatable revenue
      remain material open risks.
    claimRefs: [CR011, CR012, CR013, CR015]
    tableRefs: [TR003]
  - id: mitigations-and-triggers
    title: Mitigations, monitoring, and thesis breaks
    body: >-
      The most credible mitigation path is evidence-backed operational discipline rather
      than a broader marketing claim. Field AI's public materials describe risk-aware
      architectures, edge processing, and uncertainty-aware control, but the public record
      does not quantify how those controls perform by robot type, operating design domain,
      customer site, or software version. The SRES safety analysis argues that separation
      and very slow operation can reduce harm but limit utility, while safe shutdown and
      safety-of-intended-function testing are needed for robots operating around people.
      A practical diligence program should require a site-by-site hazard analysis, defined
      operating envelope, test and incident logs, override and shutdown demonstrations,
      cybersecurity and privacy controls, insurance and indemnity terms, and customer
      renewal or expansion evidence. Thesis-break indicators are a recordable safety
      event, a regulator or customer suspension, inability to reproduce safe behavior
      after model updates, a material outage or breach, repeated pilot non-conversion,
      or financing terms that expose a large gap between the latest priced round and
      current marks. Until these are measured, risk should remain high and the
      recommendation should not rely on an assumption of incident-free operation.
    claimRefs: [CR017, CR019, CR020, CR021]
    tableRefs: []
tables:
  - id: TR001
    title: Severity-ranked risk register
    columns: [Risk, Likelihood, Impact, Mitigation maturity, Residual exposure, Investment implication]
    rows:
      - ["Unsafe behavior or missed hazard in a dynamic site", "Medium", "Critical", "Partially evidenced; risk-aware design is described but incident and test denominators are not public", "High", "Require site-level safety evidence before scaling exposure"]
      - ["Product-liability or supply-chain claim", "Medium", "High", "Emerging legal controls and documentation practices are identifiable; Field AI-specific allocation is undisclosed", "High", "Review contracts, warnings, version history, and insurance"]
      - ["Pilot-to-production or utilization failure", "Medium", "High", "Deployment footprint is reported, but customer retention and active-use denominators are not public", "High", "Underwrite renewals and utilization, not logos or pilots"]
      - ["Integration, platform, or partner dependency failure", "Medium", "High", "Hardware-agnostic positioning reduces single-platform dependence but increases integration surface", "Medium-high", "Test supported hardware, service levels, and fallback procedures"]
      - ["Capital, valuation, or margin compression", "Medium", "High", "Public funding and valuation signals exist; cash, burn, margins, and terms are unavailable", "High", "Avoid valuation precision until financial diligence closes gaps"]
    notes: Risk ratings are analytical judgments anchored to the cited evidence and disclosed gaps; “medium-high” is a residual-exposure label, not a probability estimate.
    claimRefs: [CR001, CR006, CR011, CR013, CR015]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or legal theory, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Software and AI product-liability theories", "EU / US", "Active legal development and early cases", "Medium", "High", "Define deployed product, warnings, testing, and change history", "High", "Obtain product-liability map and insurance/indemnity schedule"]
      - ["EU Product Liability Directive treatment of software and substantial modifications", "EU", "Member-state transposition due December 2026", "Medium", "High", "Map model, firmware, integrations, and substantial modifications by party", "High", "Obtain EU compliance plan and target-country applicability analysis"]
      - ["State AI risk, incident, impact-assessment, and discrimination duties", "US states", "Multiple 2026 laws and effective dates reported", "Medium", "Medium-high", "Maintain jurisdiction inventory and documented controls", "Medium-high", "Review customer use cases, notices, assessments, and incident reporting"]
      - ["Privacy, export-control, and site-data obligations", "Multi-jurisdictional", "Applicability not publicly confirmed", "Medium", "High", "Use data governance, access controls, and customer allocation terms", "High", "Request DPA, retention map, export-control review, and audit results"]
    enumerationScope:
      coverage: partial
      basis: Publicly reported legal frameworks and theories relevant to Field AI's software, robot integrations, and multinational industrial deployments as of 2026-10-23.
    notes: This register identifies exposure and diligence paths, not a finding that Field AI has violated a rule or lost a case.
    claimRefs: [CR006, CR007, CR008, CR009]
  - id: TR003
    title: Operational, quality, security, and dependency register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Model failure under novel conditions", "Medium", "Critical", "Physics-first and uncertainty-aware design is company-described; independent performance data is absent", "High", "No public failure-rate, near-miss, or ODD test data"]
      - ["Unsafe interaction with people or property", "Medium", "Critical", "Separation, slow operation, shutdown, and SOTIF-like controls are industry recommendations", "High", "No Field AI-specific human-interaction safety case is public"]
      - ["Robot, sensor, cloud, or project-tool integration failure", "Medium", "High", "Edge processing and hardware-agnostic integration are described", "Medium-high", "Supported configurations, service levels, and rollback evidence are undisclosed"]
      - ["Cybersecurity, privacy, or data leakage event", "Medium", "High", "On-device processing and customer workflow integration may reduce some exposure", "High", "No public independent security assessment or incident history"]
      - ["Customer utilization and procurement friction", "Medium", "High", "Reported deployments and customer demand support traction; sector utilization data is mixed", "High", "Renewal, expansion, and payback by customer are unavailable"]
    notes: Rows are ordered by severity and reflect public evidence plus explicitly unresolved diligence questions; absence of a recorded incident is not evidence that no incident occurred.
    claimRefs: [CR002, CR003, CR011, CR012, CR017, CR018]
figures:
