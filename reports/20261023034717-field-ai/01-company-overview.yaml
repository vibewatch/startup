company:
  name: Field AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Field AI is a private, Irvine-based robotics software company founded in 2023 that
    licenses hardware-agnostic autonomy software for third-party robots. The strongest
    public financing evidence supports $405 million raised and a $2 billion valuation
    in August 2025; a reported October 2026 term sheet for roughly $700 million at a
    $10 billion valuation had not formally closed, while revenue, contracts, customer,
    and headcount disclosures remain unaudited or internally inconsistent.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Field AI was founded in 2023 and is consistently described by third-party profiles
      as a private robotics-intelligence company headquartered in Irvine, California.
      Its business is the intelligence layer rather than a proprietary robot body: the
      company licenses autonomy software and related integration for robots made by
      other vendors. Public descriptions call the core product a hardware-agnostic,
      physics-first Field Foundation Model intended to operate across quadrupeds,
      wheeled platforms, drones, and other embodiments in dynamic environments without
      relying on GPS or pre-built maps. That positioning reduces direct hardware
      manufacturing exposure but makes commercial scale dependent on integrations,
      partner hardware, and independently unverified model performance. The snapshot
      below separates closed financing from a pending term sheet and labels combined
      revenue-and-contract figures as exactly that, rather than converting them into
      revenue, ARR, cash, or backlog.
    claimRefs: [CO001, CO002, CO003, CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder-market fit, and governance
    body: >-
      The publicly identified founder group combines autonomy research and operating
      leadership. Ali Agha is identified as founder and CEO; Shayegan Omidshafiei as
      co-founder, president, and chief scientific officer; David Fan as co-founder and
      chief technology officer; and Duncan McIntyre as chief financial officer. Agha's
      NASA Jet Propulsion Laboratory and DARPA autonomy work gives the company direct
      founder-market fit for robots operating in uncertain, GPS-denied environments.
      Public profiles also identify Justin Saeheng as a co-founder and former COO,
      which is the only leadership-role change visible in the assigned evidence.
      However, the evidence does not establish a complete current executive roster,
      board composition, voting control, observer rights, founder vesting, or succession
      plans. This creates material key-person and governance diligence needs despite
      the technical pedigree.
    claimRefs: [CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, operating scale, and milestone interpretation
    body: >-
      The defensible closed-financing baseline is $405 million raised across rounds,
      including a $314 million August 2025 round associated with a $2 billion valuation.
      Later reporting says Field AI signed a term sheet to raise roughly $700 million
      at about a $10 billion valuation, but the financing had not formally closed and
      no lead investor was named; it therefore is neither closed funding nor cash
      available. Public operating indicators are directional rather than audited:
      sources report more than $135 million of combined revenue and customer contracts,
      more than 30 customers as of June 2026, and deployments across hundreds of sites
      or environments. Headcount is directly conflicting, with one profile showing
      200–225 employees and another showing 346 in October 2026. The timeline treats
      publication-backed milestones as evidence events, not proof of audited performance.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
  - id: stakeholders-and-diligence
    title: Stakeholder map and diligence priorities
    body: >-
      The disclosed financing syndicate includes financial investors, strategic
      technology investors, and industrial investors. Bezos Expeditions, Prysm Capital,
      and Temasek were reported as co-leads of the August 2025 financing, while Khosla
      Ventures, Canaan Partners, Gates Frontier, Intel Capital, NVentures, BHP Ventures,
      Samsung, and others appear in public investor lists. Their participation validates
      access to capital and relevant ecosystems, but it does not disclose ownership,
      liquidation preferences, protective provisions, board rights, or commercial
      dependencies. Customer and deployment claims indicate early commercial reach,
      yet an industry benchmark cited by Construction Dive found active construction
      robotics use fell from 65% to 46% even as positive evaluations increased. The
      central diligence task is therefore to reconcile headline traction with signed,
      recognized, and renewable economics at customer and contract level.
    claimRefs: [CO008, CO009, CO010, CO011, CO014, CO015, CO016]
    tableRefs: [TO003]
