      yAxis: "Public deployment evidence (analyst ordinal score: 1 low, 5 high)"
      points:
        - {label: Field AI, x: 5, y: 4, note: "Multiple robot forms and more than 30 customers reported; reuse economics are unverified"}
        - {label: Physical Intelligence, x: 5, y: 2, note: "Generalist abstraction reported; commercial production evidence remains limited"}
        - {label: Skild AI, x: 5, y: 3, note: "Generalist model and commercial revenue reported; comparable deployment detail is limited"}
        - {label: Google Intrinsic and Fanuc, x: 4, y: 5, note: "Multi-vendor software plus 1.1M installed Fanuc robots reported"}
        - {label: Gecko Robotics, x: 2, y: 4, note: "Navy inspection contract reported; mission scope is narrower"}
        - {label: Internal build, x: 3, y: 1, note: "Potentially broad but no common public deployment record"}
    approximationNotes: "Scores are a transparent analyst synthesis of the cited evidence, not market share, measured performance, or an independent benchmark."
    claimRefs: [CP003, CP006, CP008, CP009, CP010, CP011, CP013]
callouts:
  - calloutType: risk
    title: Installed-base distribution can compress the moat
    body: Fanuc and Google can route new intelligence through an existing industrial footprint, while Field AI must prove that cross-vendor portability offsets additional procurement and integration friction.
    claimRefs: [CP011, CP012, CP015]
  - calloutType: recommendation
    title: Underwrite deployment reuse
    body: Advance competitive diligence only if reference deployments quantify commissioning time, robot-specific engineering, intervention rates, software-versus-services mix, renewals, and expansion across sites.
    claimRefs: [CP004, CP005, CP015]
