company:
  name: Field AI
chapter:
  number: 3
  title: Competitors
  summary: Field AI competes across generalist robot models, industrial software platforms, specialist inspection systems, internal development, and manual or fixed-automation workflows. Its cross-hardware autonomy and field deployments are differentiating, but durability depends on reusable integration while incumbents bring installed-base distribution and specialists bring workflow depth.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Field AI does not compete in a single product category. A buyer can choose a
      robot maker's native autonomy, a specialist mapping or inspection system, a
      general robot-foundation-model provider, a multi-vendor industrial platform,
      an internal development program, or continued manual and fixed automation.
      Independent landscape sources name Physical Intelligence and Skild AI as
      model peers; Google Intrinsic, Fanuc, and Boston Dynamics as incumbent or
      platform alternatives; and Brain Corp, Exyn, and Gecko Robotics as narrower
      operating competitors. These lists are illustrative rather than exhaustive.
      The relevant boundary is therefore the full industrial workflow budget, not
      merely the market for one robot body or one autonomy model.
    claimRefs: [CP001, CP002]
    tableRefs: [TP001]
  - id: differentiation
    title: Capability, trust, and deployment comparison
    body: >-
      Field AI's strongest positioning is the combination of cross-robot
      portability, local operation, physics-based probabilistic reasoning, and
      experience in unstructured industrial environments. Business Insider
      reported that its software spans humanoids, robot dogs, drones, and
      industrial rovers, while the company said it had more than 30 customers.
      That is meaningful commercial evidence, but it is not a task-matched
      benchmark. Physical Intelligence is a well-funded direct model peer with a
      hardware-abstraction approach, yet one refreshed source said it still lacked
      a commercial product or disclosed revenue. Field AI's own portability claim
      also remains conditional: adapters, tuning, testing, safety validation, and
      site-specific integration can prevent a common model from producing common
      deployment economics.
    claimRefs: [CP003, CP004, CP006, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics-distribution
    title: Pricing, packaging, and distribution power
    body: >-
      Public evidence does not provide comparable list or realized pricing for
      Field AI and its principal alternatives. Field AI appears to combine pilots,
      integration, software licensing, hardware or sensor payloads, and ongoing
      support, so its reported revenue-plus-contracts milestone cannot be treated
      as ARR or divided into a representative unit price. Competing capital is
      abundant: Physical Intelligence raised a reported $600 million Series B,
      while Skild AI was reported at $30 million of revenue and a $14 billion
      valuation. Distribution may matter more than financing. Fanuc's reported
      1.1 million installed robots and Google's Intrinsic platform create an
      incumbent route to upgrade existing factory fleets without introducing a
      standalone autonomy vendor.
    claimRefs: [CP005, CP006, CP008, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: durability
    title: Switching costs, displacement risk, and verdict
    body: >-
      Field AI's moat will be durable only if deployments create reusable assets:
      validated robot adapters, mission configurations, customer integrations,
      operating data, safety cases, and trusted support procedures. Those assets
      can raise switching costs, but they can also reveal a services-heavy model
      if each new site requires extensive engineering. Incumbent platforms can
      compress the opportunity through installed hardware and established
      procurement channels. Specialists can displace a general platform by
      delivering a complete workflow, as illustrated by Gecko Robotics' reported
      Navy inspection contract. Adoption is not automatic: Construction Dive
      cited industry research showing active construction-robotics use declining
      even as favorable evaluations increased. Field AI's humanoid-manipulation
      hiring signals a broader roadmap, but public, independent production
      benchmarks remain the decisive gap.
    claimRefs: [CP007, CP013, CP014, CP015, CP016]
