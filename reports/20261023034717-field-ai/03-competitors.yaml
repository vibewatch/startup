    columns: [Buying criterion, Field AI, Physical Intelligence, Google Intrinsic and Fanuc, Gecko Robotics]
    rows:
      - [Cross-hardware portability, "Designed for multiple robot forms; adapters and validation still required", "Robot-specific joint commands through a hardware abstraction layer reported", "Intrinsic supports multiple manufacturers; Fanuc adds a large native base", "Cross-vendor breadth not established in assigned evidence"]
      - [Unstructured-environment focus, "Construction, mining, and other changing environments reported", "Generalist physical tasks reported", "Factory automation is the visible focus; comparable field-site performance is unknown", "Rugged industrial and naval inspection is the visible focus"]
      - [Commercial deployment signal, "More than 30 customers reported by the company through Business Insider", "Research and model progress reported; commercial product evidence disputed", "Fanuc installed base and more than 1,000 physical-AI-equipped shipments reported", "Five-year Navy inspection contract reported"]
      - [Workflow integration, "Mission software, mapping, digital twins, and customer-system integration described", "Model runtime and robot-command layer described", "Flowstate orchestration plus Gemini and Fanuc integration described", "Sensors, inspection robots, and cloud digital twin packaged together"]
      - [Pricing transparency, "No public rate card; enterprise quotation required", "Unknown in assigned evidence", "Unknown in assigned evidence", "IDIQ values disclosed, but product unit pricing unknown"]
      - [Trust and safety evidence, "Risk-aware behavior described; certification and incident-rate evidence unavailable", "Force and speed limits described; independent production safety evidence unavailable", "Industrial installed base is material, but partnership-specific safety evidence is unavailable", "Defense procurement is a trust signal, not an independent safety benchmark"]
    notes: "The matrix records source-backed capabilities and explicit unknowns. Vendor and competitor descriptions are not treated as independent comparative benchmarks."
    claimRefs: [CP003, CP004, CP005, CP006, CP008, CP009, CP011, CP012, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Public price or contract signal, Package indicated by evidence, Realization or discount unknown, Competitive implication]
    rows:
      - [Field AI, "No public list price", "Pilot, deployment integration, software license, edge hardware or sensors, and support", "Revenue versus customer contracts and software versus services mix are undisclosed", "Repeatable deployment matters more than a headline contract total"]
      - [Physical Intelligence, "No public customer price", "Model runtime, partnerships, and deployment support are implied", "Commercial package, discounts, and recurring revenue are unknown", "Large funding supports development but does not establish buyer economics"]
      - [Skild AI, "No public customer price in assigned evidence", "Commercial model deployments and partner-led factory use are reported", "Reported revenue lacks mix, margin, and customer-concentration detail", "Commercialization may generate data earlier than a research-first strategy"]
      - [Google Intrinsic and Fanuc, "No comparable public package price", "Robot hardware, Flowstate software, Gemini services, and integration", "Bundle allocation and platform fees are unknown", "Installed-base upgrades may lower procurement friction"]
      - [Gecko Robotics, "$54M initial Navy award and $71M IDIQ ceiling reported", "Inspection robots, sensor suites, cloud digital twin, and services", "Ceiling is not realized revenue or a per-robot price", "A focused workflow can win a large budget without general-purpose autonomy"]
      - [Internal build or status quo, "Organization-specific labor and engineering budget", "Existing labor, fixed automation, or an internal autonomy stack", "Downtime, maintenance, staffing, and opportunity cost require a site baseline", "Retention can be rational where portability has little incremental value"]
    notes: "No assigned source establishes comparable realized prices. Funding, valuation, revenue, contract value, and IDIQ ceilings are retained under their original metric names and periods."
    claimRefs: [CP005, CP006, CP008, CP010, CP011, CP013, CP016]
