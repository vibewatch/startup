schemaVersion: "report-v2"
artifact: financials
slug: field-ai
runDate: 2026-10-23
company:
  name: Field AI
chapter:
  number: 4
  title: Financials
  summary: Field AI has disclosed substantial financing and reported commercial-contract momentum, but public evidence does not separate recognized revenue from contracts, establish recurring revenue, or show profitability. The underwriting case therefore rests more on capital access and deployment signals than on auditable unit economics.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Public descriptions point to a B2B monetization model combining software licensing with hardware-integration services. Sacra describes sensor-compute payloads that retrofit existing robots and software designed to run on edge devices. This supports a mixed software and integration model rather than a pure subscription assumption, but it does not establish realized pricing or revenue recognition. A Silicon Valley Investclub profile reports more than 30 customers and combined revenue plus customer contracts above $100 million in June 2026, rising above $135 million by October; the same profile says those totals derive from CEO comments and that GAAP revenue and profitability are undisclosed. Field AI's own site emphasizes thousands of missions across hundreds of sites and three continents, which is useful evidence of activity but not evidence of recognized revenue, gross margin, or customer retention.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI015]
    tableRefs: [TI001]
  - id: pricing-and-sales-efficiency
    title: Pricing, sales motion, and efficiency proxies
    body: >-
      No public list price, contract rate card, realized price, CAC, payback period, sales-cycle distribution, or renewal data was found in the assigned evidence. The available operating descriptions imply enterprise sales into construction, industrial, energy, security, and related safety-critical settings, with deployments requiring a compatible robot, sensor-compute payload, site onboarding, and operator workflow. That configuration can support higher contract values than commodity software, but it also creates implementation and support costs that could pressure gross margin. Construction Dive reports deployments across hundreds of industrial environments and says the company planned to use its 2025 financing for global growth, product development, and hiring; this is a growth investment signal, not a sales-efficiency measure. Underwriting should treat any implied revenue-per-customer or recurring-revenue conversion as unavailable until contracts and invoice-level revenue are provided.
    claimRefs: [CI005, CI006, CI007]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure and capital adequacy
    body: >-
      The cost base is likely shaped by robotics research, edge-compute integration, field deployment, cloud analytics, safety validation, and a growing technical team, but public sources do not disclose expense categories or gross margin. Construction Dive reports that Field AI intended to accelerate global growth, continue locomotion and manipulation development, and double headcount by year-end after its 2025 financing. SetterVC lists 200–225 employees, while Silicon Valley Investclub lists 346 as of October 2026; the discrepancy reinforces that headcount is a signal rather than a settled input. Capital availability appears strong relative to the disclosed $405 million 2025 financing, but current cash, burn, debt, runway, use-of-funds detail, and financing covenants remain undisclosed. A reported October 2026 term sheet for approximately $700 million at a $10 billion valuation is not a closed financing and cannot be treated as cash on hand.
    claimRefs: [CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial profile is promising on financing momentum and deployment breadth, but weakly underwritten on revenue quality. A $2 billion 2025 valuation was reported alongside the $405 million raise, while later coverage describes a proposed or reported $10 billion valuation that had not formally closed; without recognized revenue, the implied revenue multiple cannot be calculated responsibly. The most material blocker is the absence of a public bridge from customer contracts and missions to recognized revenue, contribution margin, renewal behavior, and cash generation. A second blocker is operating leverage: the payload-and-services model may produce durable software economics, but it may also require labor-intensive integration and field support. The practical verdict is track rather than commit on headline financing signals: obtain the general ledger revenue split, backlog definition, gross-margin bridge, deployment cost per site, customer concentration, receivables aging, cash balance, burn, debt terms, and financing-close evidence before underwriting valuation or runway.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Software licensing, "Robot autonomy software deployed on compatible hardware", "Publicly described; price and recurring share unavailable", "Company/third-party description, not audited", "Obtain contract terms, license metric, renewal and recognized-revenue policy"]
      - [Hardware integration, "Sensor-compute payloads retrofit existing robots", "Publicly described; realized price unavailable", "Third-party operating description", "Separate hardware pass-through, integration labor, and software revenue"]
      - [Field deployment and services, "Site onboarding, mission setup, and operational support", "Implied by deployment model; amount unavailable", "Inferred from operating workflow", "Measure implementation hours, support burden, and contribution margin by site"]
      - [Customer contracts, "Commercial commitments reported together with revenue", "$100M+ by Jun 2026 and $135M+ by Oct 2026, combined with contracts", "Third-party/company-commentary-derived; not GAAP revenue", "Reconcile signed backlog, recognized revenue, deferred revenue, and cancellations"]
    notes: Revenue-plus-contract figures are not interchangeable with recognized revenue or ARR; public sources do not provide a stream-level mix or denominators.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
  - id: TI002
    title: Pricing and monetization transparency
    columns: [Metric, Public evidence, Status, Why it matters, Diligence ask]
    rows:
      - [List price, "No public rate card identified in assigned sources", null, "Cannot estimate contract value or price discipline", "Obtain standard and negotiated price schedules"]
      - [Realized price, "No invoice or contract sample disclosed", null, "List pricing would not establish collected revenue", "Sample signed orders and invoices by deployment type"]
      - [Sales cycle, "Enterprise industrial deployment model described; cycle length unavailable", null, "Long cycles increase working-capital needs", "Provide opportunity aging and median time to production"]
      - [CAC/payback, "No CAC, payback, retention, or channel-fee disclosure", null, "Growth cannot be translated into efficient acquisition", "Provide cohort CAC, gross-margin payback, and renewal cohorts"]
    notes: Null cells mean no quantified public evidence was retained, not zero; qualitative deployment evidence does not substitute for realized pricing or sales-efficiency data.
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recognized revenue, null, low, "Revenue-plus-contracts disclosures do not establish GAAP revenue", "Audited or management revenue bridge by stream and period"]
      - [Gross margin, null, low, "Payload integration and field support could materially affect margin", "Gross-margin bridge separating hardware, services, cloud, and software"]
      - [Cash and runway, null, low, "Funding raised is not cash available and cannot establish runway", "Latest cash balance, monthly burn, debt, covenants, and runway case"]
      - [Headcount, "200–225 in one profile; 346 in Oct 2026 update", medium, "Hiring scale is a cost signal but sources conflict", "Current payroll roster, contractor count, and hiring plan"]
      - [Next financing, "Approx. $700M at $10B reported as term sheet/in talks; not confirmed closed", low, "Potential capital is not current liquidity", "Executed closing documents, proceeds, dilution, and use of funds"]
    notes: Values are deliberately null where public evidence is insufficient; the October financing item is a reported prospective transaction, not cash on hand.
    claimRefs: [CI008, CI009, CI010, CI011, CI015]
