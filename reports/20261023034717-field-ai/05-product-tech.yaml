callouts:
  - calloutType: strength
    title: Hardware-agnostic wedge
    body: Field AI's strongest product claim is that one autonomy stack can operate across multiple robot embodiments, reducing dependence on a single hardware winner.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Verification is behind the narrative
    body: The public record supports deployments and architecture descriptions but not standardized, independent safety, reliability, security, or cross-embodiment benchmarks.
    claimRefs: [CE012, CE013, CE014, CE015]
