      diligencePath: Request embodiment-specific benchmark reports, test protocols, failure taxonomies, and raw or auditor-reviewed evaluation results.
      relatedQuestionRefs: [QE005, QE006, QE008]
    - type: private-evidence-only
      severity: material
      topic: trust
      missingEvidence: Security, privacy, safety-certification, incident-response, and data-retention documentation for customer deployments.
      whyItMatters: The product operates in industrial and potentially hazardous environments where cyber or physical failures can create material customer exposure.
      diligencePath: Obtain current security attestations, architecture diagrams, penetration-test summaries, safety cases, insurance coverage, and customer data-processing terms.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public releases, issue history, package activity, or other inspectable developer artifacts.
      whyItMatters: Lack of public code is not a product defect, but it limits external verification of release maturity and practitioner adoption.
      diligencePath: Request private release cadence, customer integration references, SDK documentation, and deployment-support metrics.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Realized software, payload, integration, and recurring subscription pricing by robot or deployment.
      whyItMatters: Product value and implementation burden cannot be translated into unit economics or customer payback from public evidence.
      diligencePath: Request representative contracts, implementation timelines, renewal terms, and gross-margin attribution by product component.
      relatedQuestionRefs: [QE001, QE004]
