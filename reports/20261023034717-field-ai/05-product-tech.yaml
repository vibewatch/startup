company:
  name: Field AI
chapter:
  number: 5
  title: Product & Technology
  summary: Field AI sells a hardware-agnostic autonomy layer for robots operating in unstructured, GPS-denied environments. Public evidence describes physics-first foundation models, edge execution, and real construction deployments, but independent benchmarking, security evidence, and public developer artifacts remain limited.
sections:
  - id: product-definition
    title: Product and operating model
    body: >-
      Field AI is positioned as a software company that supplies the “brain” for
      third-party robots rather than manufacturing a robot platform. Its Field
      Foundation Models (FFMs) are described as physics-first, risk-aware models
      that combine sensor inputs and physical reasoning for robots working without
      prior maps, GPS, or predefined paths. Intel Capital describes deployment on
      any robot embodiment or vehicle and any sensor, while Sacra describes a
      sensor-compute payload attached to compatible robots and edge execution. This
      makes the product definition a control and autonomy layer, with integration
      work and software licensing as the likely delivery mechanism rather than a
      vertically integrated hardware sale. The public record does not disclose
      realized pricing, service-level commitments, or a standard implementation
      package.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-and-workflow
    title: Architecture and customer workflow
    body: >-
      The disclosed architecture has three functional layers: a physics- and
      uncertainty-oriented model layer, a multi-sensor and robot-adaptation layer,
      and an edge runtime that makes decisions on the vehicle. Sacra identifies
      Dynamics and Multi-Agent Foundation Models plus a Safety and Risk Awareness
      layer; the same source says camera, LiDAR, radar, and IMU data are combined
      and that processing occurs on-device with latency under 100 milliseconds.
      Intel Capital independently describes no prior map training, no GPS, and
      edge operation. In a typical workflow, an operator mounts the payload,
      positions the robot, starts the system through a tablet, and receives
      inspection or mapping outputs. These are source-described mechanisms, not
      proof that every supported embodiment has equivalent reliability or latency.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-and-proof
    title: Maturity, deployment, and differentiation
    body: >-
      Maturity is strongest where Field AI has disclosed field deployment rather
      than laboratory architecture. Construction Dive reports deployments in the
      United States, Japan, and Europe across hundreds of industrial environments,
      while the company-issued release says robots operate daily across multiple
      industries and embodiments. The public construction proof is still
      concentrated: Field AI's reported DPR case study lists 45,000-plus photos,
      more than 100 miles walked, and 500,000 square feet of interiors scanned.
      TechCrunch reports contracts across construction, energy, and urban delivery
      but says the company declined to name customers. The resulting differentiation
      is a credible hardware-agnostic and risk-aware thesis plus deployment data,
      not independently verified benchmark superiority against competing autonomy
      stacks.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: trust-and-gaps
    title: Trust, safety, and diligence limits
    body: >-
      Risk awareness is central to the product narrative: Field AI says the models
      reason about uncertainty and physical constraints instead of retrofitting
      language or vision models after the fact. That approach is relevant to
      hazardous, remote, or connectivity-constrained sites, but the assigned
      evidence does not establish a formal safety case, certification, incident
      history, cybersecurity controls, privacy policy for collected site data, or
      customer-validated failure rates. The company’s GitHub organization states
      that it has no public repositories, limiting direct inspection of code,
      releases, issue history, and developer adoption. Product diligence should
      therefore prioritize embodiment-specific reliability distributions,
      rollback and human-override procedures, security attestations, data
      retention and model-training terms, and evidence that field performance
      generalizes beyond selected construction deployments. The company's
      August 2025 roadmap statement directed new capital toward locomotion and
      manipulation, but it did not provide delivery dates or acceptance criteria.
    claimRefs: [CE013, CE014, CE015, CE016]
