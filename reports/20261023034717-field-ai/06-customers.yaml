chapter:
  number: 6
  title: Customers
  summary: Public evidence shows Field AI has moved beyond isolated demonstrations into recurring construction-site workflows and partner-led expansion, but public customer evidence remains concentrated in a small number of named deployments and company-reported scale claims. The strongest adoption proof is operational detail from DPR and a Boston Dynamics partnership; retention, revenue concentration, and contract durability remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and segment structure
    body: >-
      Field AI's observable customer motion is enterprise and operational rather than self-serve. Construction is the clearest documented wedge: DPR's superintendent describes the system as supporting photography and routine documentation, while the solution is positioned for safety, progress tracking, scanning, and defect workflows. The buyer and daily user are not necessarily the same person: contractors or project owners procure the capability, superintendents and safety teams review outputs, and robot or platform partners can provide deployment leverage. Company material also names energy, manufacturing, urban delivery, inspection, mining, logistics, and federal applications, but those references do not establish paid production use for each vertical. The resulting segmentation supports a land-and-expand thesis, while leaving procurement owner, pricing, and revenue contribution by vertical open.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and deployment proof
    body: The best public adoption evidence is specific to work performed, not logo count. A DPR deployment is described as having run for approximately a year and a half, with 45,000-plus photos, more than 100 miles walked, four floors mapped, 125,000 square feet of roofing documented, and 500,000 square feet of interiors scanned. Boston Dynamics separately says Spot equipped with Field Foundation Models has been deployed across numerous construction sites and reports inspection and documentation time reductions of more than 90 percent versus manual processes. These are meaningful workflow and utilization signals, but they are not a cohort, active-account count, renewal rate, or independently audited outcome. Field AI's 2025 announcement reports deployments across hundreds of complex industrial environments and multiple countries; because that statement is company-issued, it should be treated as directional rather than a verified customer denominator.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named proof, expansion, and durability limits
    body: >-
      Named evidence spans DPR Construction, Big-D Construction, Ryan Companies, Boston Dynamics, Certis, and a McLaren Construction trial, but the evidence quality differs. DPR has the most concrete operating detail and a named superintendent quote; the Boston Dynamics release provides a partner-confirmed construction deployment and enterprise-scale expansion language; Robots in Construction lists additional organizations and a UK trial but is a secondary product directory. Certis is evidence of a strategic partnership and intended multi-site orchestration, not proof of contracted recurring revenue. Public sources do not disclose churn, GRR, NRR, renewal terms, contract length, customer concentration, or expansion revenue. Construction-market evidence also cautions that positive sentiment can coexist with selective adoption: active robotics use fell from 65% to 46% in BuiltWorlds data while repeated use became more selective. This makes customer durability the central unresolved underwriting issue.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-gaps
    title: Commercial implications and diligence gaps
    body: Field AI appears to be selling a workflow product whose value is realized through integration into live site operations, human review, and repeat capture rather than through a one-time robot sale alone. That model can support expansion from one project to multiple projects, fleets, or adjacent inspection and security use cases, but it also creates implementation and procurement friction. Customers must validate safety, integrate outputs with BIM or command systems, train teams, and decide who owns remediation. The available sources show partner ecosystem activity and concrete site work, yet do not establish gross retention, net expansion, average contract value, deployment payback, or the share of deployments that converted from pilot to production. Investors should require a customer cohort schedule, contract and renewal evidence, and project-level unit economics before treating deployment breadth as durable recurring demand.
    claimRefs: [CU013, CU014, CU015]
