      - [Industrial environments, "Hundreds of complex real-world environments", "August 2025", "Field AI company announcement", "Directional scale claim; active-account, paid-conversion, and cohort definitions are absent."]
    notes: "Values retain source qualifiers and are not converted into customer counts, ARR, retention, or a funnel because populations and denominators differ."
    claimRefs: [CU005, CU006, CU007, CU008]
