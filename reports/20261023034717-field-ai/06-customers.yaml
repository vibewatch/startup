      - ["Certis", "Security operations partner", "Orchestration of robots, command systems, workflows, and human teams", "Strategic partnership; future deployment scope described", "Intended multi-site patrol and incident-response operating model", "Partnership announcement does not prove paid production rollout."]
      - ["McLaren Construction", "Construction", "Spot quadruped trial for site capture at an LSE refurbishment", "Trial ahead of wider UK rollout", "Evidence of a named evaluation and possible expansion path", "Trial is not evidence of conversion, renewal, or recurring revenue."]
      - ["Big-D Construction and Ryan Companies", "Construction", "Listed as organizations on record for construction site autonomy", "Deployment status not detailed", "Supports existence of additional named organizations", "Directory evidence lacks contract, outcome, and timing detail."]
    enumerationScope:
      coverage: partial
      basis: "Named organizations found in successful assigned sources fetched for this 2026-10-23 customer chapter; not a full customer census."
    notes: "Enumeration is partial and mixes partner, production-use, trial, and directory references; each row is retained with its status limitation rather than treated as equivalent proof."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
