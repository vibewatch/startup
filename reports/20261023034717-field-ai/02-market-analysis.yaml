callouts:
  - calloutType: insight
    title: The wedge is more credible than the headline TAM
    body: >-
      Field AI's strongest market case is repeatable autonomy for hazardous, variable, data-rich industrial workflows. The public record supports demand drivers and broad market growth, but does not support a precise company-specific SAM, SOM, recurring-revenue mix, or customer payback profile.
    claimRefs: [CM001, CM005, CM009, CM012, CM016]
  - calloutType: risk
    title: Interest is not deployment
    body: >-
      Construction Dive reports a sharp gap between positive robotics evaluations and active use, reinforcing that integration, maintenance, safety and ROI can delay conversion even when market enthusiasm and funding are strong.
    claimRefs: [CM013, CM015]
localEvidence:
  evidenceGaps:
    - type: missing-source
      severity: material
      topic: serviceable-market
      missingEvidence: A Field AI-specific SAM and SOM by vertical, geography, pricing model, and deployment type.
      whyItMatters: Broad industrial-AI and robotics estimates overlap and cannot establish the revenue pool that Field AI can actually serve.
      diligencePath: Obtain management's bottom-up market model with customer counts, annual contract values, attach rates, implementation revenue, and exclusion rules by vertical.
      relatedQuestionRefs: [QM003]
    - type: missing-source
      severity: material
      topic: adoption-economics
      missingEvidence: Cohort-level deployment, renewal, expansion, uptime, intervention, and customer-payback data.
      whyItMatters: Public evidence shows interest and deployments but does not prove repeatable conversion or software-like economics.
      diligencePath: Request anonymized customer cohorts and signed-contract evidence separating pilots, production deployments, services, and recurring software.
      relatedQuestionRefs: [QM004, QM007]
    - type: conflicting-data
      severity: minor
      topic: market-estimates
      missingEvidence: A reconciled definition and methodology bridge across industrial AI, industrial robots, embodied AI, inspection robotics, and oil-and-gas automation.
      whyItMatters: Reported values range from sub-billion inspection niches to tens-of-billions automation markets, and cannot be added without double counting.
      diligencePath: Reconcile vendor definitions, geography, revenue inclusion, hardware/software mix, base year, and forecast period before using any market number in an operating plan.
      relatedQuestionRefs: [QM002]
