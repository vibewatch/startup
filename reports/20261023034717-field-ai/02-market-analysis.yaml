company:
  name: Field AI
chapter:
  number: 2
  title: Market Analysis
  summary: Field AI sits at the intersection of industrial AI, adaptive robotics software, and safety-critical inspection and mapping workflows. Public market estimates are large but use materially different boundaries; the investable opportunity is better framed as a set of vertical entry wedges whose adoption depends on measurable uptime, safety, integration, and data outcomes.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Field AI's relevant market is software and integrated autonomy that lets existing or purpose-built robots perceive, navigate, inspect, map, and move through unstructured industrial environments. The company describes applications including site mapping, facility and equipment inspection, anomaly detection, large-scale data capture, unmanned material transport, security, telepresence, and search; that breadth is a product surface, not proof that all adjacent spending is immediately addressable. The boundary should therefore include edge autonomy software, sensor-compute payloads, integration, and recurring analytics tied to industrial workflows. It should exclude robot hardware, general factory automation that depends on fixed repeatable motion, broad enterprise AI services, and the full revenue of construction, mining, energy, or manufacturing customers. The status quo is a mix of human inspection and documentation, fixed automation, specialist robot vendors, system integrators, and manual or semi-automated workflows. This boundary preserves the strategic upside of a hardware-agnostic layer without treating every robotics or AI dollar as Field AI revenue.
    claimRefs: [CM001, CM002, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: >-
      Public estimates support a growing demand environment but not a single defensible TAM, SAM, or SOM for Field AI. The Business Research Company defines industrial AI broadly across hardware, software, platforms, and solutions and forecasts $13.69 billion in 2026 and $73.54 billion in 2030; that includes sectors and offerings well outside autonomous robots. GMI estimates the AI-powered industrial robot market at $9.9 billion in 2026 and $27.9 billion in 2035, while Mordor estimates the oil and gas automation market at $46.16 billion in 2026 and $63.19 billion in 2031. Fortune's narrower inspection-robotics-in-oil-and-gas estimate is $0.93 billion in 2026 and $1.51 billion in 2034. These figures are complementary lenses, not additive pools: they overlap in geography, software, hardware, and end markets, and some use proprietary estimation frameworks. The most decision-useful reading is that Field AI can enter large industrial budgets through narrower, safety- and uptime-linked workflows; public evidence does not isolate its serviceable share or support a precise SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyers, users, and adoption path
    body: >-
      The initial buyer is likely an industrial operator or asset owner with a costly inspection, mapping, safety, or material-movement problem; the user is an operations, reliability, construction, mining, energy, or safety team; and the economic payer may be a site, business unit, or capital-project owner. Field AI's published applications span facilities and equipment inspection, mapping, anomaly detection, transport, and security, while market sources identify hazardous access, workforce safety, remote monitoring, and data quality as adoption drivers. The adoption path is consequently workflow-first rather than robot-first: prove a defined mission, integrate sensors and site processes, demonstrate reliable operation and usable data, then expand across fleets, sites, or adjacent missions. Construction Dive reports deployments across hundreds of industrial environments and cites use in the U.S., Japan, and Europe, but it also reports active robotics use among surveyed firms falling from 65% to 46% even as positive evaluations rose above 95%. That divergence makes paid deployment, repeat usage, and outcome evidence more important than enthusiasm or funding alone.
    claimRefs: [CM010, CM011, CM012, CM013]
  - id: drivers-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand drivers include labor scarcity, hazardous or inaccessible work, the need for remote inspection, asset uptime, and the ability to turn field activity into structured operational data. GMI describes a shift from fixed repeatable motion toward perception- and data-led execution, while Fortune identifies remote inspection and workforce safety as drivers. Constraints are equally material: Fortune cites extensive capital and maintenance requirements and a shortage of skilled personnel; Mordor highlights cybersecurity and safety-system economics in operational technology; and Construction Dive's usage data suggests conversion from positive evaluations to sustained deployment remains unresolved. Field AI's hardware-agnostic, risk-aware positioning could reduce dependence on a single robot form factor and widen the number of workflows it can address, but it does not remove site integration, certification, liability, change-management, or ROI hurdles. For valuation, the upside case requires evidence that deployments convert into recurring software or repeatable multi-site contracts; the downside case is that revenue remains project- or integration-led inside a capital-intensive adoption cycle. Public sources do not disclose enough gross margin, retention, cohort, or contract detail to resolve that mix.
    claimRefs: [CM003, CM014, CM015, CM016]
    tableRefs: [TM003]
