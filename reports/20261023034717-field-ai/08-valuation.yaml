company:
  name: Field AI
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a technically differentiated, well-funded robotics platform, but it does not yet support underwriting a current price with confidence because the reported $10 billion financing context is unclosed and GAAP revenue, profitability, and cap-table terms are undisclosed.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Field AI has a credible software-first investment case. CNBC reports $405 million raised across two rounds and a $2 billion latest-round valuation, while Construction Dive describes deployments across hundreds of industrial environments and a physics-first autonomy stack intended for unstructured sites. The platform thesis is attractive because hardware-agnostic software could scale across robot form factors without requiring Field AI to own factories. The anti-thesis is equally material: current public evidence does not establish audited recurring revenue, gross margin, profitability, customer concentration, or conversion of deployments into durable contracts. The company therefore has strategic momentum but limited public underwriting visibility.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      The observable financing anchor is the August 2025 $2 billion valuation reported by CNBC, not a completed 2026 transaction. SetterVC and the Silicon Valley Investclub tear sheet describe an approximately $700 million round at a $10 billion valuation as reported, in talks, or not confirmed closed. Those marks should be treated as indications rather than a settled price. The implied step-up from $2 billion to $10 billion is fivefold, but no public revenue denominator supports a defensible valuation multiple. Entry discipline should therefore require confirmed closing terms, primary financials, preference rights, and an independently verified revenue bridge.
    claimRefs: [CV006, CV007, CV009, CV010]
    tableRefs: [TV003]
  - id: scenarios-and-comps
    title: Scenarios, comparables, and downside
    body: >-
      A scenario framework is more decision-useful than a point estimate. The bull case requires Field AI to convert multi-site deployments into repeatable, high-margin software contracts and to preserve differentiation as NVIDIA, Physical Intelligence, Skild AI, and other robotics platforms compete for the same layer. The base case assumes meaningful technical and customer progress but continued opacity, making a track decision more defensible than a buy. The bear case combines a financing reset with slower construction adoption, weak customer ROI, or a market multiple contraction. Public comparables in the tear sheet show wide historical price-to-sales ranges for autonomy and AI names, but those IPO-era yardsticks are not directly comparable without Field AI revenue and margin disclosure.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV004]
  - id: decision-and-diligence
    title: Recommendation and thesis-break triggers
    body: >-
      The evidence supports track rather than buy. A buy would require a verified price, a GAAP-to-contract-revenue reconciliation, customer-level retention and concentration data, gross-margin evidence, and cap-table terms showing that preference and dilution risk are acceptable. The thesis should be upgraded if a closed financing or secondary transaction confirms a price near the reported mark while audited operating metrics demonstrate durable software economics. It should be downgraded if the reported round fails to close, if revenue is primarily nonrecurring services or hardware integration, if deployments do not convert into paid expansion, or if safety and commercialization costs prevent attractive margins. The immediate diligence path is to obtain the data room and independently verify the round, contracts, unit economics, and governance rights.
    claimRefs: [CV015, CV016, CV017]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Track pending price verification
    body: Field AI merits continued diligence, but the public record does not justify a buy at a reported $10 billion mark without a closed transaction and audited operating evidence.
    claimRefs: [CV006, CV009, CV015]
  - calloutType: risk
    title: Valuation is more certain than the denominator
    body: The market narrative supplies financing and valuation headlines, while the revenue, margin, retention, preference, and dilution denominators needed to price the risk remain largely private.
    claimRefs: [CV009, CV010, CV014]
