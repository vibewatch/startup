      - [Technical differentiation, "Physics-first and risk-aware models are positioned for unstructured environments.", "Independent benchmark results and customer ROI across multiple sites."]
      - [Capital validation, "$405M and a reported $2B 2025 valuation were covered by CNBC.", "A closed 2026 round with disclosed terms and a clean cap-table analysis."]
      - [Adoption risk, "Construction robotics use fell to 46% of surveyed firms in the cited benchmarking discussion.", "Paid expansion, retention, and repeatable procurement evidence."]
    notes: "The adoption statistic is an industry benchmark cited by Construction Dive, not a Field AI-specific utilization rate."
    claimRefs: [CV001, CV002, CV003, CV011, CV012]
  - id: TV003
    title: Financing and entry discipline
    columns: [Item, Public evidence, Underwriting treatment]
    rows:
      - [2025 financing, "$405M raised; latest round reported at $2B.", "Use as the last completed valuation anchor."]
      - [2026 reported financing, "$700M at $10B, described as in talks or not confirmed closed.", "Do not treat as settled price until closing is verified."]
      - [Revenue denominator, "No GAAP revenue or profitability disclosure is identified in the retained profile.", "Require audited revenue, gross margin, and cash-flow bridge."]
      - [Ownership terms, "Full shareholder register and preference stack are not public.", "Require cap table, liquidation preferences, and dilution schedule."]
    notes: "Amounts and valuations are source-attributed and retain their reported, estimated, or unconfirmed status; no valuation multiple is calculated."
    claimRefs: [CV001, CV006, CV007, CV009, CV010, CV016]
  - id: TV004
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Closed financing; deployments convert to recurring software contracts; multi-robot expansion works.", "Premium software-like outcome could support the reported mark or higher value if revenue scales.", "Competition, safety validation, and procurement cycle.", "Low-to-medium; requires several unverified conditions."]
      - [Base, "Technical progress continues, but revenue, margin, and contract quality remain only partly disclosed.", "Track and wait for price and operating disclosure rather than underwrite a multiple.", "Opaque denominator and execution costs.", "Medium; closest to current evidence."]
      - [Bear, "Round does not close or reprices; adoption and customer ROI lag; capital intensity persists.", "Down-round, dilution, or multiple compression becomes possible.", "Commercialization failure and preference overhang.", "Material; adverse market evidence supports this risk."]
    notes: "Scenarios are analytical decision cases, not forecasts. No numeric valuation range is asserted because the public revenue denominator is unavailable."
    claimRefs: [CV006, CV009, CV010, CV011, CV012, CV014, CV017]
