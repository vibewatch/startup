      - number: '1.2'
        title: Leadership, founder-market fit, and governance
        blocks:
          - type: paragraph
            body: >-
              The publicly identified founder group combines autonomy research and operating leadership. Ali Agha is
              identified as founder and CEO; Shayegan Omidshafiei as co-founder, president, and chief scientific
              officer; David Fan as co-founder and chief technology officer; and Duncan McIntyre as chief financial
              officer. Agha's NASA Jet Propulsion Laboratory and DARPA autonomy work gives the company direct
              founder-market fit for robots operating in uncertain, GPS-denied environments. Public profiles also
              identify Justin Saeheng as a co-founder and former COO, which is the only leadership-role change visible
              in the assigned evidence. However, the evidence does not establish a complete current executive roster,
              board composition, voting control, observer rights, founder vesting, or succession plans. This creates
              material key-person and governance diligence needs despite the technical pedigree.
