chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Field AI was founded in 2023 and is consistently described by third-party profiles as a private
              robotics-intelligence company headquartered in Irvine, California. Its business is the intelligence layer
              rather than a proprietary robot body: the company licenses autonomy software and related integration for
              robots made by other vendors. Public descriptions call the core product a hardware-agnostic, physics-first
              Field Foundation Model intended to operate across quadrupeds, wheeled platforms, drones, and other
              embodiments in dynamic environments without relying on GPS or pre-built maps. That positioning reduces
              direct hardware manufacturing exposure but makes commercial scale dependent on integrations, partner
              hardware, and independently unverified model performance. The snapshot below separates closed financing
              from a pending term sheet and labels combined revenue-and-contract figures as exactly that, rather than
              converting them into revenue, ARR, cash, or backlog.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
