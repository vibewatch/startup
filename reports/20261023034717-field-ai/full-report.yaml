  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Field AI's relevant market is software and integrated autonomy that lets existing or purpose-built robots
              perceive, navigate, inspect, map, and move through unstructured industrial environments. The company
              describes applications including site mapping, facility and equipment inspection, anomaly detection,
              large-scale data capture, unmanned material transport, security, telepresence, and search; that breadth is
              a product surface, not proof that all adjacent spending is immediately addressable. The boundary should
              therefore include edge autonomy software, sensor-compute payloads, integration, and recurring analytics
              tied to industrial workflows. It should exclude robot hardware, general factory automation that depends on
              fixed repeatable motion, broad enterprise AI services, and the full revenue of construction, mining,
              energy, or manufacturing customers. The status quo is a mix of human inspection and documentation, fixed
              automation, specialist robot vendors, system integrators, and manual or semi-automated workflows. This
              boundary preserves the strategic upside of a hardware-agnostic layer without treating every robotics or AI
              dollar as Field AI revenue.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              Public estimates support a growing demand environment but not a single defensible TAM, SAM, or SOM for
              Field AI. The Business Research Company defines industrial AI broadly across hardware, software,
              platforms, and solutions and forecasts $13.69 billion in 2026 and $73.54 billion in 2030; that includes
              sectors and offerings well outside autonomous robots. GMI estimates the AI-powered industrial robot market
              at $9.9 billion in 2026 and $27.9 billion in 2035, while Mordor estimates the oil and gas automation
              market at $46.16 billion in 2026 and $63.19 billion in 2031. Fortune's narrower
              inspection-robotics-in-oil-and-gas estimate is $0.93 billion in 2026 and $1.51 billion in 2034. These
              figures are complementary lenses, not additive pools: they overlap in geography, software, hardware, and
              end markets, and some use proprietary estimation frameworks. The most decision-useful reading is that
              Field AI can enter large industrial budgets through narrower, safety- and uptime-linked workflows; public
              evidence does not isolate its serviceable share or support a precise SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The initial buyer is likely an industrial operator or asset owner with a costly inspection, mapping,
              safety, or material-movement problem; the user is an operations, reliability, construction, mining,
              energy, or safety team; and the economic payer may be a site, business unit, or capital-project owner.
              Field AI's published applications span facilities and equipment inspection, mapping, anomaly detection,
              transport, and security, while market sources identify hazardous access, workforce safety, remote
              monitoring, and data quality as adoption drivers. The adoption path is consequently workflow-first rather
              than robot-first: prove a defined mission, integrate sensors and site processes, demonstrate reliable
              operation and usable data, then expand across fleets, sites, or adjacent missions. Construction Dive
              reports deployments across hundreds of industrial environments and cites use in the U.S., Japan, and
              Europe, but it also reports active robotics use among surveyed firms falling from 65% to 46% even as
              positive evaluations rose above 95%. That divergence makes paid deployment, repeat usage, and outcome
              evidence more important than enthusiasm or funding alone.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include labor scarcity, hazardous or inaccessible work, the need for remote inspection,
              asset uptime, and the ability to turn field activity into structured operational data. GMI describes a
              shift from fixed repeatable motion toward perception- and data-led execution, while Fortune identifies
              remote inspection and workforce safety as drivers. Constraints are equally material: Fortune cites
              extensive capital and maintenance requirements and a shortage of skilled personnel; Mordor highlights
              cybersecurity and safety-system economics in operational technology; and Construction Dive's usage data
              suggests conversion from positive evaluations to sustained deployment remains unresolved. Field AI's
              hardware-agnostic, risk-aware positioning could reduce dependence on a single robot form factor and widen
              the number of workflows it can address, but it does not remove site integration, certification, liability,
              change-management, or ROI hurdles. For valuation, the upside case requires evidence that deployments
              convert into recurring software or repeatable multi-site contracts; the downside case is that revenue
              remains project- or integration-led inside a capital-intensive adoption cycle. Public sources do not
              disclose enough gross margin, retention, cohort, or contract detail to resolve that mix.
            claimRefs:
              - CM003
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The wedge is more credible than the headline TAM
            body: >-
              Field AI's strongest market case is repeatable autonomy for hazardous, variable, data-rich industrial
              workflows. The public record supports demand drivers and broad market growth, but does not support a
              precise company-specific SAM, SOM, recurring-revenue mix, or customer payback profile.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM012
              - CM016
          - type: callout
            title: Interest is not deployment
            body: >-
              Construction Dive reports a sharp gap between positive robotics evaluations and active use, reinforcing
              that integration, maintenance, safety and ROI can delay conversion even when market enthusiasm and funding
              are strong.
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Field AI does not compete in a single product category. A buyer can choose a robot maker's native
              autonomy, a specialist mapping or inspection system, a general robot-foundation-model provider, a
              multi-vendor industrial platform, an internal development program, or continued manual and fixed
              automation. Independent landscape sources name Physical Intelligence and Skild AI as model peers; Google
              Intrinsic, Fanuc, and Boston Dynamics as incumbent or platform alternatives; and Brain Corp, Exyn, and
              Gecko Robotics as narrower operating competitors. These lists are illustrative rather than exhaustive. The
              relevant boundary is therefore the full industrial workflow budget, not merely the market for one robot
              body or one autonomy model.
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.2'
        title: Capability, trust, and deployment comparison
        blocks:
          - type: paragraph
            body: >-
              Field AI's strongest positioning is the combination of cross-robot portability, local operation,
              physics-based probabilistic reasoning, and experience in unstructured industrial environments. Business
              Insider reported that its software spans humanoids, robot dogs, drones, and industrial rovers, while the
              company said it had more than 30 customers. That is meaningful commercial evidence, but it is not a
              task-matched benchmark. Physical Intelligence is a well-funded direct model peer with a
              hardware-abstraction approach, yet one refreshed source said it still lacked a commercial product or
              disclosed revenue. Field AI's own portability claim also remains conditional: adapters, tuning, testing,
              safety validation, and site-specific integration can prevent a common model from producing common
              deployment economics.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not provide comparable list or realized pricing for Field AI and its principal
              alternatives. Field AI appears to combine pilots, integration, software licensing, hardware or sensor
              payloads, and ongoing support, so its reported revenue-plus-contracts milestone cannot be treated as ARR
              or divided into a representative unit price. Competing capital is abundant: Physical Intelligence raised a
              reported $600 million Series B, while Skild AI was reported at $30 million of revenue and a $14 billion
              valuation. Distribution may matter more than financing. Fanuc's reported 1.1 million installed robots and
              Google's Intrinsic platform create an incumbent route to upgrade existing factory fleets without
              introducing a standalone autonomy vendor.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.4'
        title: Switching costs, displacement risk, and verdict
        blocks:
          - type: paragraph
            body: >-
              Field AI's moat will be durable only if deployments create reusable assets: validated robot adapters,
              mission configurations, customer integrations, operating data, safety cases, and trusted support
              procedures. Those assets can raise switching costs, but they can also reveal a services-heavy model if
              each new site requires extensive engineering. Incumbent platforms can compress the opportunity through
              installed hardware and established procurement channels. Specialists can displace a general platform by
              delivering a complete workflow, as illustrated by Gecko Robotics' reported Navy inspection contract.
              Adoption is not automatic: Construction Dive cited industry research showing active construction-robotics
              use declining even as favorable evaluations increased. Field AI's humanoid-manipulation hiring signals a
              broader roadmap, but public, independent production benchmarks remain the decisive gap.
            claimRefs:
              - CP007
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base distribution can compress the moat
            body: >-
              Fanuc and Google can route new intelligence through an existing industrial footprint, while Field AI must
              prove that cross-vendor portability offsets additional procurement and integration friction.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP015
          - type: callout
            title: Underwrite deployment reuse
            body: >-
              Advance competitive diligence only if reference deployments quantify commissioning time, robot-specific
              engineering, intervention rates, software-versus-services mix, renewals, and expansion across sites.
            calloutType: recommendation
            claimRefs:
              - CP004
              - CP005
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Public descriptions point to a B2B monetization model combining software licensing with
              hardware-integration services. Sacra describes sensor-compute payloads that retrofit existing robots and
              software designed to run on edge devices. This supports a mixed software and integration model rather than
              a pure subscription assumption, but it does not establish realized pricing or revenue recognition. A
              Silicon Valley Investclub profile reports more than 30 customers and combined revenue plus customer
              contracts above $100 million in June 2026, rising above $135 million by October; the same profile says
              those totals derive from CEO comments and that GAAP revenue and profitability are undisclosed. Field AI's
              own site emphasizes thousands of missions across hundreds of sites and three continents, which is useful
              evidence of activity but not evidence of recognized revenue, gross margin, or customer retention.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
      - number: '4.2'
        title: Pricing, sales motion, and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              No public list price, contract rate card, realized price, CAC, payback period, sales-cycle distribution,
              or renewal data was found in the assigned evidence. The available operating descriptions imply enterprise
              sales into construction, industrial, energy, security, and related safety-critical settings, with
              deployments requiring a compatible robot, sensor-compute payload, site onboarding, and operator workflow.
              That configuration can support higher contract values than commodity software, but it also creates
              implementation and support costs that could pressure gross margin. Construction Dive reports deployments
              across hundreds of industrial environments and says the company planned to use its 2025 financing for
              global growth, product development, and hiring; this is a growth investment signal, not a sales-efficiency
              measure. Underwriting should treat any implied revenue-per-customer or recurring-revenue conversion as
              unavailable until contracts and invoice-level revenue are provided.
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The cost base is likely shaped by robotics research, edge-compute integration, field deployment, cloud
              analytics, safety validation, and a growing technical team, but public sources do not disclose expense
              categories or gross margin. Construction Dive reports that Field AI intended to accelerate global growth,
              continue locomotion and manipulation development, and double headcount by year-end after its 2025
              financing. SetterVC lists 200–225 employees, while Silicon Valley Investclub lists 346 as of October 2026;
              the discrepancy reinforces that headcount is a signal rather than a settled input. Capital availability
              appears strong relative to the disclosed $405 million 2025 financing, but current cash, burn, debt,
              runway, use-of-funds detail, and financing covenants remain undisclosed. A reported October 2026 term
              sheet for approximately $700 million at a $10 billion valuation is not a closed financing and cannot be
              treated as cash on hand.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI015
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is promising on financing momentum and deployment breadth, but weakly underwritten
              on revenue quality. A $2 billion 2025 valuation was reported alongside the $405 million raise, while later
              coverage describes a proposed or reported $10 billion valuation that had not formally closed; without
              recognized revenue, the implied revenue multiple cannot be calculated responsibly. The most material
              blocker is the absence of a public bridge from customer contracts and missions to recognized revenue,
              contribution margin, renewal behavior, and cash generation. A second blocker is operating leverage: the
              payload-and-services model may produce durable software economics, but it may also require labor-intensive
              integration and field support. The practical verdict is track rather than commit on headline financing
              signals: obtain the general ledger revenue split, backlog definition, gross-margin bridge, deployment cost
              per site, customer concentration, receivables aging, cash balance, burn, debt terms, and financing-close
              evidence before underwriting valuation or runway.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and operating model
        blocks:
          - type: paragraph
            body: >-
              Field AI is positioned as a software company that supplies the “brain” for third-party robots rather than
              manufacturing a robot platform. Its Field Foundation Models (FFMs) are described as physics-first,
              risk-aware models that combine sensor inputs and physical reasoning for robots working without prior maps,
              GPS, or predefined paths. Intel Capital describes deployment on any robot embodiment or vehicle and any
              sensor, while Sacra describes a sensor-compute payload attached to compatible robots and edge execution.
              This makes the product definition a control and autonomy layer, with integration work and software
              licensing as the likely delivery mechanism rather than a vertically integrated hardware sale. The public
              record does not disclose realized pricing, service-level commitments, or a standard implementation
              package.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE009
      - number: '5.2'
        title: Architecture and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture has three functional layers: a physics- and uncertainty-oriented model layer, a
              multi-sensor and robot-adaptation layer, and an edge runtime that makes decisions on the vehicle. Sacra
              identifies Dynamics and Multi-Agent Foundation Models plus a Safety and Risk Awareness layer; the same
              source says camera, LiDAR, radar, and IMU data are combined and that processing occurs on-device with
              latency under 100 milliseconds. Intel Capital independently describes no prior map training, no GPS, and
              edge operation. In a typical workflow, an operator mounts the payload, positions the robot, starts the
              system through a tablet, and receives inspection or mapping outputs. These are source-described
              mechanisms, not proof that every supported embodiment has equivalent reliability or latency.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Maturity, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Maturity is strongest where Field AI has disclosed field deployment rather than laboratory architecture.
              Construction Dive reports deployments in the United States, Japan, and Europe across hundreds of
              industrial environments, while the company-issued release says robots operate daily across multiple
              industries and embodiments. The public construction proof is still concentrated: Field AI's reported DPR
              case study lists 45,000-plus photos, more than 100 miles walked, and 500,000 square feet of interiors
              scanned. TechCrunch reports contracts across construction, energy, and urban delivery but says the company
              declined to name customers. The resulting differentiation is a credible hardware-agnostic and risk-aware
              thesis plus deployment data, not independently verified benchmark superiority against competing autonomy
              stacks.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.4'
        title: Trust, safety, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Risk awareness is central to the product narrative: Field AI says the models reason about uncertainty and
              physical constraints instead of retrofitting language or vision models after the fact. That approach is
              relevant to hazardous, remote, or connectivity-constrained sites, but the assigned evidence does not
              establish a formal safety case, certification, incident history, cybersecurity controls, privacy policy
              for collected site data, or customer-validated failure rates. The company’s GitHub organization states
              that it has no public repositories, limiting direct inspection of code, releases, issue history, and
              developer adoption. Product diligence should therefore prioritize embodiment-specific reliability
              distributions, rollback and human-override procedures, security attestations, data retention and
              model-training terms, and evidence that field performance generalizes beyond selected construction
              deployments. The company's August 2025 roadmap statement directed new capital toward locomotion and
              manipulation, but it did not provide delivery dates or acceptance criteria.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware-agnostic wedge
            body: >-
              Field AI's strongest product claim is that one autonomy stack can operate across multiple robot
              embodiments, reducing dependence on a single hardware winner.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Verification is behind the narrative
            body: >-
              The public record supports deployments and architecture descriptions but not standardized, independent
              safety, reliability, security, or cross-embodiment benchmarks.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and segment structure
        blocks:
          - type: paragraph
            body: >-
              Field AI's observable customer motion is enterprise and operational rather than self-serve. Construction
              is the clearest documented wedge: DPR's superintendent describes the system as supporting photography and
              routine documentation, while the solution is positioned for safety, progress tracking, scanning, and
              defect workflows. The buyer and daily user are not necessarily the same person: contractors or project
              owners procure the capability, superintendents and safety teams review outputs, and robot or platform
              partners can provide deployment leverage. Company material also names energy, manufacturing, urban
              delivery, inspection, mining, logistics, and federal applications, but those references do not establish
              paid production use for each vertical. The resulting segmentation supports a land-and-expand thesis, while
              leaving procurement owner, pricing, and revenue contribution by vertical open.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and deployment proof
        blocks:
          - type: paragraph
            body: >-
              The best public adoption evidence is specific to work performed, not logo count. A DPR deployment is
              described as having run for approximately a year and a half, with 45,000-plus photos, more than 100 miles
              walked, four floors mapped, 125,000 square feet of roofing documented, and 500,000 square feet of
              interiors scanned. Boston Dynamics separately says Spot equipped with Field Foundation Models has been
              deployed across numerous construction sites and reports inspection and documentation time reductions of
              more than 90 percent versus manual processes. These are meaningful workflow and utilization signals, but
              they are not a cohort, active-account count, renewal rate, or independently audited outcome. Field AI's
              2025 announcement reports deployments across hundreds of complex industrial environments and multiple
              countries; because that statement is company-issued, it should be treated as directional rather than a
              verified customer denominator.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU013
              - CU014
      - number: '6.3'
        title: Named proof, expansion, and durability limits
        blocks:
          - type: paragraph
            body: >-
              Named evidence spans DPR Construction, Big-D Construction, Ryan Companies, Boston Dynamics, Certis, and a
              McLaren Construction trial, but the evidence quality differs. DPR has the most concrete operating detail
              and a named superintendent quote; the Boston Dynamics release provides a partner-confirmed construction
              deployment and enterprise-scale expansion language; Robots in Construction lists additional organizations
              and a UK trial but is a secondary product directory. Certis is evidence of a strategic partnership and
              intended multi-site orchestration, not proof of contracted recurring revenue. Public sources do not
              disclose churn, GRR, NRR, renewal terms, contract length, customer concentration, or expansion revenue.
              Construction-market evidence also cautions that positive sentiment can coexist with selective adoption:
              active robotics use fell from 65% to 46% in BuiltWorlds data while repeated use became more selective.
              This makes customer durability the central unresolved underwriting issue.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Commercial implications and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Field AI appears to be selling a workflow product whose value is realized through integration into live
              site operations, human review, and repeat capture rather than through a one-time robot sale alone. That
              model can support expansion from one project to multiple projects, fleets, or adjacent inspection and
              security use cases, but it also creates implementation and procurement friction. Customers must validate
              safety, integrate outputs with BIM or command systems, train teams, and decide who owns remediation. The
              available sources show partner ecosystem activity and concrete site work, yet do not establish gross
              retention, net expansion, average contract value, deployment payback, or the share of deployments that
              converted from pilot to production. Investors should require a customer cohort schedule, contract and
              renewal evidence, and project-level unit economics before treating deployment breadth as durable recurring
              demand.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete workflow evidence
            body: >-
              DPR-related reporting supplies named users, a long-running deployment, and quantified site activity rather
              than relying on logos alone.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Durability remains unpriced
            body: >-
              No public source in the assigned pool discloses churn, GRR, NRR, renewal terms, customer concentration, or
              customer-level expansion revenue.
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              Field AI's risk profile is dominated by the gap between a safety-oriented product narrative and the public
              evidence needed to underwrite safe operation at scale. The company says its models are designed for
              dynamic, unstructured environments and are already deployed across construction, energy, manufacturing,
              delivery, and inspection sites, but those descriptions do not disclose incident rates, near misses, false
              negatives, rollback performance, insurance coverage, or the denominator of successful missions. The
              International AI Safety Report states that general-purpose AI failures can create physical harm, financial
              loss, reputational damage, and legal liability, and that no combination of current methods eliminates
              failures entirely. For Field AI, the investment-relevant risk is therefore operational proof: whether
              bounded operating domains, human override, safe shutdown, testing, and monitoring are sufficient for each
              customer environment. The heatmap below treats the residual exposure as high where public evidence is
              thin, not as proof that a harmful incident has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR006
              - CR011
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR013
              - CR015
              - CR019
      - number: '7.2'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The legal surface is expanding in parallel with the company's physical deployments. K&L Gates describes a
              shift toward treating AI functionality as a product, with plaintiffs targeting architecture, guardrails,
              warnings, escalation pathways, and foreseeable misuse rather than only individual outputs. It also
              identifies potential liability up and down the supply chain, which matters to a software company that
              integrates with robot manufacturers and customer workflows. The firm's March 2026 analysis says the EU
              Product Liability Directive treats software, including AI systems, as products and covers substantial
              modifications, while member states must transpose it by December 2026. Baker Botts separately reports 2026
              state laws that impose risk-framework, incident-reporting, impact-assessment, disclosure, or
              discrimination obligations in relevant AI contexts. These sources are not evidence of a Field AI
              violation. They establish a changing compliance and litigation perimeter, making product definition,
              version history, testing records, safety claims, data governance, export controls, and customer allocation
              of responsibility material diligence items.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Deployment execution creates several linked risks. Field AI's commercial model combines software with
              hardware integration and deployment services, so delivery quality depends on sensor-compute payloads,
              compatible robot platforms, site data, customer operators, and reliable support. A job posting describes
              on-device autonomy, customer project-tool integration, and commercial deployment services, while public
              descriptions emphasize operation without maps, GPS, or predefined routes. That breadth can accelerate
              adoption but also expands integration, calibration, cybersecurity, and support obligations across
              different robots and jurisdictions. Construction Dive reports that positive evaluations of construction
              robotics increased while the share of firms reporting active use fell from 65% to 46%, a warning that
              enthusiasm does not equal durable utilization. Funding and valuation signals also do not establish a
              settled current mark: PrivateMarketView carries forward the $2 billion last priced event, while SetterVC
              labels a possible $700 million raise at a $10 billion valuation as an unclosed, unverified signal. Without
              audited financials, customer-level concentration, renewal data, or unit economics, capital intensity,
              procurement friction, and the ability to convert pilots into repeatable revenue remain material open
              risks.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
              - CR017
              - CR018
      - number: '7.4'
        title: Mitigations, monitoring, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The most credible mitigation path is evidence-backed operational discipline rather than a broader
              marketing claim. Field AI's public materials describe risk-aware architectures, edge processing, and
              uncertainty-aware control, but the public record does not quantify how those controls perform by robot
              type, operating design domain, customer site, or software version. The SRES safety analysis argues that
              separation and very slow operation can reduce harm but limit utility, while safe shutdown and
              safety-of-intended-function testing are needed for robots operating around people. A practical diligence
              program should require a site-by-site hazard analysis, defined operating envelope, test and incident logs,
              override and shutdown demonstrations, cybersecurity and privacy controls, insurance and indemnity terms,
              and customer renewal or expansion evidence. Thesis-break indicators are a recordable safety event, a
              regulator or customer suspension, inability to reproduce safe behavior after model updates, a material
              outage or breach, repeated pilot non-conversion, or financing terms that expose a large gap between the
              latest priced round and current marks. Until these are measured, risk should remain high and the
              recommendation should not rely on an assumption of incident-free operation.
            claimRefs:
              - CR017
              - CR019
              - CR020
              - CR021
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              The decisive question is whether Field AI can demonstrate safe, repeatable operation by defined operating
              domain and software version, with customer-level utilization and incident evidence. Public claims of
              risk-aware design are not a substitute for those denominators.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR017
          - type: callout
            title: Thesis-break trigger
            body: >-
              A regulator or major customer restricting deployment, a material safety or security event, or repeated
              failure to convert pilots into contracted recurring use would materially weaken the investment case.
            calloutType: recommendation
            claimRefs:
              - CR019
              - CR020
              - CR021
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Field AI has a credible software-first investment case. CNBC reports $405 million raised across two rounds
              and a $2 billion latest-round valuation, while Construction Dive describes deployments across hundreds of
              industrial environments and a physics-first autonomy stack intended for unstructured sites. The platform
              thesis is attractive because hardware-agnostic software could scale across robot form factors without
              requiring Field AI to own factories. The anti-thesis is equally material: current public evidence does not
              establish audited recurring revenue, gross margin, profitability, customer concentration, or conversion of
              deployments into durable contracts. The company therefore has strategic momentum but limited public
              underwriting visibility.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The observable financing anchor is the August 2025 $2 billion valuation reported by CNBC, not a completed
              2026 transaction. SetterVC and the Silicon Valley Investclub tear sheet describe an approximately $700
              million round at a $10 billion valuation as reported, in talks, or not confirmed closed. Those marks
              should be treated as indications rather than a settled price. The implied step-up from $2 billion to $10
              billion is fivefold, but no public revenue denominator supports a defensible valuation multiple. Entry
              discipline should therefore require confirmed closing terms, primary financials, preference rights, and an
              independently verified revenue bridge.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Scenarios, comparables, and downside
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more decision-useful than a point estimate. The bull case requires Field AI to
              convert multi-site deployments into repeatable, high-margin software contracts and to preserve
              differentiation as NVIDIA, Physical Intelligence, Skild AI, and other robotics platforms compete for the
              same layer. The base case assumes meaningful technical and customer progress but continued opacity, making
              a track decision more defensible than a buy. The bear case combines a financing reset with slower
              construction adoption, weak customer ROI, or a market multiple contraction. Public comparables in the tear
              sheet show wide historical price-to-sales ranges for autonomy and AI names, but those IPO-era yardsticks
              are not directly comparable without Field AI revenue and margin disclosure.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV004
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV017
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports track rather than buy. A buy would require a verified price, a
              GAAP-to-contract-revenue reconciliation, customer-level retention and concentration data, gross-margin
              evidence, and cap-table terms showing that preference and dilution risk are acceptable. The thesis should
              be upgraded if a closed financing or secondary transaction confirms a price near the reported mark while
              audited operating metrics demonstrate durable software economics. It should be downgraded if the reported
              round fails to close, if revenue is primarily nonrecurring services or hardware integration, if
              deployments do not convert into paid expansion, or if safety and commercialization costs prevent
              attractive margins. The immediate diligence path is to obtain the data room and independently verify the
              round, contracts, unit economics, and governance rights.
            claimRefs:
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price verification
            body: >-
              Field AI merits continued diligence, but the public record does not justify a buy at a reported $10
              billion mark without a closed transaction and audited operating evidence.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV015
          - type: callout
            title: Valuation is more certain than the denominator
            body: >-
              The market narrative supplies financing and valuation headlines, while the revenue, margin, retention,
              preference, and dilution denominators needed to price the risk remain largely private.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV014
