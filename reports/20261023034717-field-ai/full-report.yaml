      - number: '1.4'
        title: Stakeholder map and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing syndicate includes financial investors, strategic technology investors, and
              industrial investors. Bezos Expeditions, Prysm Capital, and Temasek were reported as co-leads of the
              August 2025 financing, while Khosla Ventures, Canaan Partners, Gates Frontier, Intel Capital, NVentures,
              BHP Ventures, Samsung, and others appear in public investor lists. Their participation validates access to
              capital and relevant ecosystems, but it does not disclose ownership, liquidation preferences, protective
              provisions, board rights, or commercial dependencies. Customer and deployment claims indicate early
              commercial reach, yet an industry benchmark cited by Construction Dive found active construction robotics
              use fell from 65% to 46% even as positive evaluations increased. The central diligence task is therefore
              to reconcile headline traction with signed, recognized, and renewable economics at customer and contract
              level.
