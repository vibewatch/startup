  - id: FU001
    title: Customer journey from site deployment to expansion
    type: journey-map
    summary: >-
      Public evidence traces a workflow from site capture through human review and potential multi-site expansion, while
      commercial conversion points remain unverified.
    data:
      items:
        - label: Select a live site
          description: Construction or industrial operator identifies a documentation, inspection, safety, or monitoring workflow.
          touchpoints:
            - Named construction use cases are the clearest public wedge.
        - label: Deploy robot and autonomy
          description: Field AI autonomy is paired with compatible hardware and configured for the site.
          touchpoints:
            - Spot plus Field Foundation Models is documented in construction.
        - label: Capture and map
          description: The system records photos, scans, and site-state data during repeated walkthroughs.
          touchpoints:
            - DPR evidence includes 45,000+ photos, 100+ miles, and four floors.
        - label: Review operational outputs
          description: Superintendents and safety teams review progress, hazards, defects, or BIM comparisons.
          touchpoints:
            - Human teams retain interpretation and corrective-action responsibility.
        - label: Repeat on project
          description: Scheduled or on-demand passes can create an ongoing site record.
          touchpoints:
            - DPR use over approximately 1.5 years is a durability signal.
        - label: Expand across sites or workflows
          description: >-
            Partners and enterprise customers may extend fleets across projects or into security and industrial
            operations.
          touchpoints:
            - Expansion contracts and enterprise-scale language are reported, but conversion data is not public.
    claimRefs:
      - CU005
      - CU009
      - CU013
      - CU014
