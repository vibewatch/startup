        - Track and wait for price and operating disclosure rather than underwrite a multiple.
        - Opaque denominator and execution costs.
        - Medium; closest to current evidence.
      - - Bear
        - Round does not close or reprices; adoption and customer ROI lag; capital intensity persists.
        - Down-round, dilution, or multiple compression becomes possible.
        - Commercialization failure and preference overhang.
        - Material; adverse market evidence supports this risk.
    notes: >-
      Scenarios are analytical decision cases, not forecasts. No numeric valuation range is asserted because the public
      revenue denominator is unavailable.
    claimRefs:
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV017
