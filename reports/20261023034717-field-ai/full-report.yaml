      - number: '1.3'
        title: Financing, operating scale, and milestone interpretation
        blocks:
          - type: paragraph
            body: >-
              The defensible closed-financing baseline is $405 million raised across rounds, including a $314 million
              August 2025 round associated with a $2 billion valuation. Later reporting says Field AI signed a term
              sheet to raise roughly $700 million at about a $10 billion valuation, but the financing had not formally
              closed and no lead investor was named; it therefore is neither closed funding nor cash available. Public
              operating indicators are directional rather than audited: sources report more than $135 million of
              combined revenue and customer contracts, more than 30 customers as of June 2026, and deployments across
              hundreds of sites or environments. Headcount is directly conflicting, with one profile showing 200–225
              employees and another showing 346 in October 2026. The timeline treats publication-backed milestones as
              evidence events, not proof of audited performance.
