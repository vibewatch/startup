      for the operating group, are not publicly available from the reviewed sources.
    whyItMatters: >
      Without consolidated financial statements, the underwriting case relies on press coverage, app metrics, and
      pricing pages rather than audited revenue quality, margin, and cash usage.
    diligencePath: >
