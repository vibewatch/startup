    severity: minor
    topic: peer-b2b-channel-benchmarking
    missingEvidence: >-
      Most direct peers do not publish comparable partner or enterprise channel metrics, which limits apples-to-apples
      benchmarking of Airalo’s distribution lead.
    whyItMatters: >-
      Airalo may be ahead on partner distribution, but the lead could be disclosure-driven rather than structurally
      unique if peers have meaningful hidden B2B volume.
    diligencePath: >-
