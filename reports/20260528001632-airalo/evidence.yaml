evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-bench
    missingEvidence: >-
      A current official executive roster with named functional leaders, reporting lines, and succession coverage beyond
      the founders.
    whyItMatters: Public leadership evidence is founder-centric, making it hard to assess bench depth and operational redundancy.
    diligencePath: Request the current org chart, executive bios, and a management-prepared leadership responsibilities matrix.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer list, ownership summary, and financing-rights overview.
    whyItMatters: The public record supports financing amounts and lead investors but not governance rights or control dynamics.
    diligencePath: Request the board list, cap table, investor-rights summary, and the latest financing close memo.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A precise 2026 employee count with geography and function breakouts.
    whyItMatters: >-
      Public snapshots show growth, but staffing scale and operating leverage cannot be underwritten from outdated
      rounded figures alone.
    diligencePath: >-
      Request current employee count, hiring plan, attrition history, and geographic headcount mix from management or HR
      systems.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, burn, cash, and retention metrics with management or audited support.
    whyItMatters: >-
      The company overview can support funding and app traction, but investment judgment depends on real operating
      economics.
    diligencePath: >-
      Request board materials or management financials covering revenue, gross margin, burn, runway, and customer
      economics.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public milestone coverage
    missingEvidence: >-
      A fuller chronology of internal product launches, partnership signings, and material service incidents after the
      public press-release trail.
    whyItMatters: >-
      The milestone table is intentionally public-facing and omits internal events that could change how operating
      cadence or execution risk is interpreted.
    diligencePath: >-
      Request a management timeline covering major launches, partnerships, service incidents, and governance changes
      from 2019 onward.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: >-
      Public split of Airalo users, GMV, or revenue across self-serve leisure, business, airline, and operator partner
      channels.
    whyItMatters: >-
      Without a channel mix, the market cannot be translated from headline travel-eSIM demand into Airalo's true SAM or
      SOM.
    diligencePath: >-
      Request internal GMV, active-user, and customer-count mix by channel and by region; reconcile with partner
      contract counts.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: repeat-usage-economics
    missingEvidence: >-
      Cohort retention, repeat purchase frequency, CAC, and gross margin by corridor or segment for travel-eSIM
      purchases.
    whyItMatters: >-
      Category growth can coexist with poor unit economics; repeat behavior and margin durability determine whether
      Airalo captures value or only volume.
    diligencePath: >-
      Request cohort tables, repeat-purchase curves, blended and fully loaded gross margin by corridor, and
      operator-pass-through economics.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A public travel-eSIM revenue dataset that separates travel connectivity from the broader eSIM, IoT, and
      connectivity-services stack.
    whyItMatters: >-
      The public TAM record mixes revenue, users, and units, making clean external benchmarking difficult and increasing
      the risk of valuation error.
    diligencePath: >-
      Build a management sizing model using Airalo internal bookings, corridor mix, and partner attach rates, then
      benchmark it against Juniper and Counterpoint travel-specific proxies.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: partner-channel-economics
    missingEvidence: >-
      Public sources do not disclose what share of Airalo revenue, gross bookings, or gross profit now comes through
      partners, APIs, or white-label channels.
    whyItMatters: >-
      Partner distribution is one of the strongest public moat claims in this chapter, but without channel mix data it
      is impossible to tell whether it is a true economic moat or mostly a top-of-funnel story.
    diligencePath: >-
      Request channel mix by bookings, gross margin, and renewal rate for Airalo Partners, API, reseller, and
      white-label programs.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: repeat-purchase-retention
    missingEvidence: >-
      No retained public source discloses Airalo’s repeat-purchase rate, churn to competitor apps, or retention lift
      from loyalty credits, unlimited bundles, or Discover+ upgrades.
    whyItMatters: >-
      Consumer switching friction is low, so repeat use and re-buy behavior are the real test of moat durability for a
      travel-eSIM leader.
    diligencePath: >-
      Request 12-month cohort retention, repeat-trip re-buy rates, and cross-sell attachment for unlimited and
      voice/text products.
