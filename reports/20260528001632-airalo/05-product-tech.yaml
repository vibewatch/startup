schemaVersion: report-v2
artifact: product-tech
slug: airalo
runDate: '2026-05-28'
company:
  name: Airalo
chapter:
  number: 5
  title: Product & Technology
  summary: "Airalo now operates as a multi-surface travel-connectivity product: a consumer marketplace for local,\
    \ regional, and global eSIM plans plus business, reseller, SDK, and REST API surfaces for partners. Public documentation\
    \ shows a fairly mature install and post-sale stack\u2014direct, QR, and manual activation flows; top-ups; low-data\
    \ and expiry alerts; replacement/refund tooling; and 24/7 support promises\u2014backed by strong mobile distribution\
    \ signals from iOS and Android. The main product risks are opaque underlying carrier/payment/hosting dependencies,\
    \ no public uptime SLA or incident surface, and recurring third-party complaints about activation, connectivity,\
    \ and support escalation."
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Airalo sells digital roaming replacement rather than physical connectivity hardware. Its consumer proposition
    is a prepaid eSIM marketplace covering more than 200 countries and regions, with local, regional, and global
    packages plus Discover+ plans that add voice and text on top of data. The company describes itself in legal
    terms as an aggregator and marketplace of connectivity services, which matters because the customer relationship,
    purchase flow, and installation experience are controlled by Airalo while the underlying network layer is sourced
    from third parties. The same catalog logic is extended into adjacent B2B products: Airalo for Business for managed
    employee travel, Partner Integrations for API/SDK/plugin distribution, and a reseller surface for white-label
    or branded resale. Public partner pages repeatedly anchor the product family on the same 20M+ user, 200+ destination
    footprint, which suggests one shared supply and order-management backbone across retail and partner channels.
    The practical implication for diligence is that Airalo has product breadth and distribution leverage, but it
    also inherits the coordination risk of a marketplace that sits between travelers, enterprises, resellers, app
    stores, and local mobile operators.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE013
  - CE014
  - CE015
  - CE016
  tableRefs:
  - TE001
- id: consumer-workflow-installation-and-support
  title: Consumer workflow, installation, and support operations
  body: 'The observable retail workflow is simple but operationally non-trivial. A user chooses a destination package
    on the website or in the app, pays, opens My eSIMs, then follows install and connection instructions inside
    the app. Public help flows show that the real operating model depends on device readiness: the phone must support
    eSIM, must be network-unlocked, and the Airalo app may not work on rooted or jailbroken devices. On both iOS
    and Android, Airalo supports direct installation from the app where available, plus QR-code and manual SM-DP+/activation-code
    paths. After install, users may still need APN edits, data-roaming changes, manual network selection, default-line
    changes, or switching away from another active SIM before the eSIM becomes usable. Airalo has added explicit
    operational states such as Installed versus In Use and now exposes self-service remediation flows including
    automated replacement, automated refund, and support escalation when direct install fails. That is more sophisticated
    than pure checkout-only travel eSIM storefronts, but it also shows that Airalo must own a large support and
    edge-case burden around handset settings, destination timing, and network attach behavior.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: partner-platform-and-technical-architecture
  title: Partner platform and technical architecture
  body: "Airalo has gone beyond a consumer app into a partner platform with distinct technical surfaces. Official\
    \ partner materials show three primary integration modes\u2014REST API, SDK, and WooCommerce plugin\u2014plus\
    \ separate business and reseller experiences for organizations that do not want to build a full custom storefront.\
    \ The developer stack is materially richer than a marketing-only partner portal: public docs enumerate authentication,\
    \ package browsing, order submission, installation-instruction retrieval, top-up flows, order and eSIM management,\
    \ compatible-device lists, balance checks, notifications, and webhooks. Airalo also documents a unified sandbox/production\
    \ model instead of a separate test base URL, and its Node.js SDK adds client-side caching, rate-limit handling,\
    \ and simplified order helpers. At the same time, the public architecture disclosure stops well short of a full\
    \ stack diagram. Airalo confirms in privacy/legal materials that third parties handle hosting, payments, and\
    \ network connectivity, but the consumer-facing product does not name the specific payment processor, hosting\
    \ vendor, or carrier-by-carrier routing partners on the surfaces reviewed for this chapter. That makes the public\
    \ partner stack look mature at the API layer while leaving the infrastructure and supply layer comparatively\
    \ opaque."
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE024
  - CE038
  - CE039
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003
- id: trust-privacy-compliance-and-quality-controls
  title: Trust, privacy, compliance, and quality controls
  body: "Airalo\u2019s public trust posture is split across consumer legal pages and partner sales pages. The privacy\
    \ policy discloses broad collection of account, contact, device, location, usage, communications, review-platform,\
    \ and in some cases eKYC/compliance data, and it explicitly notes global storage and sharing with providers\
    \ involved in network connectivity, hosting, payments, and distribution. Partner pages add stronger commercial\
    \ trust language by claiming GDPR, SOC 2 Type II, and PCI DSS alignment, state-of-the-art encryption, regular\
    \ audits, and SSO features. Consumer help pages show a practical quality-control layer as well: 24/7 chat support,\
    \ troubleshooting playbooks, and automated replacement/refund paths. Observable storefront signals are also\
    \ strong\u2014high iOS and Android ratings with large review bases and 10M+ Android downloads. The caveat is\
    \ that legal terms still disclaim guaranteed availability and quality of the underlying connections, and independent\
    \ issue trackers/review summaries continue to surface activation failures, login errors, poor rural coverage,\
    \ refund friction, and chatbot-heavy support experiences. In other words, Airalo shows evidence of process maturity,\
    \ but public evidence does not yet prove service-level consistency."
  claimRefs:
  - CE011
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE033
  - CE034
  tableRefs:
  - TE004
- id: differentiation-maturity-and-product-risks
  title: Differentiation, maturity, and product risks
  body: "Airalo\u2019s most defensible product differentiator is not a proprietary radio network but an orchestration\
    \ layer that spans consumer travel purchase, enterprise management, white-label resale, and developer-led distribution.\
    \ Few travel eSIM brands expose all of those surfaces publicly at once, and Airalo reinforces that breadth with\
    \ a public SDK, a formal REST API, install-instruction delivery options, top-ups, partner alerts, and large\
    \ mobile distribution channels. Product maturity looks strongest in the core catalog, installation, and partner-ordering\
    \ workflows. The main risks are structural. eSIM functionality still depends on OEM hardware decisions, carrier\
    \ unlock status, country-specific model variants, and local network behavior that Airalo does not fully control.\
    \ Airalo also does not publicly expose a status page, uptime target, named carrier matrix, or named infrastructure\
    \ vendors across the reviewed surfaces, making it hard to underwrite reliability ex ante. The 2026 release evidence\
    \ that is visible is largely shipping evidence\u2014current app versions, current partner capabilities, and\
    \ current automation features\u2014not dated forward roadmap commitments. Investors should therefore read Airalo\
    \ as a mature distribution-and-orchestration product with lingering vendor-opacity and service-level diligence\
    \ gaps."
  claimRefs:
  - CE014
  - CE015
  - CE017
  - CE019
  - CE028
