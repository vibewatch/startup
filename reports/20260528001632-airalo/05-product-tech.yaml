  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla-visibility
    missingEvidence: A public uptime target, status page, or incident archive for consumer and partner services.
    whyItMatters: Without public service-level disclosures, reliability must be inferred from complaints and legal
      disclaimers rather than monitored directly.
    diligencePath: Request internal uptime reports, incident postmortems, and any customer SLA schedules for business
      or API accounts.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap-visibility
    missingEvidence: A dated forward roadmap with owned milestones for app, business, and partner products beyond
      current shipping features.
    whyItMatters: Public evidence today is release-state evidence; it does not prove what the company is prioritizing
      next or which dependencies remain.
    diligencePath: Ask product leadership for the current roadmap, release calendar, and module-level maturity rubric
      used internally.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: vendor-opacity
    missingEvidence: Named payment, hosting, and destination-carrier vendors plus the rules that map packages to
      those suppliers.
    whyItMatters: Carrier and infrastructure concentration directly affect service quality, economics, and incident
      blast radius.
    diligencePath: Request the live supplier matrix, major network-partner contracts, payment-stack architecture,
      and any destination-level fallback logic.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: support-metrics
    missingEvidence: Measured response-time, resolution-rate, and CSAT data for consumer chat support and partner
      support queues.
    whyItMatters: Public 24/7 support promises are meaningful only if the company can resolve activation and connectivity
      issues quickly at scale.
    diligencePath: Request support SLA policies, ticket-volume trends, median first-response time, escalation rate,
      and refund or replacement conversion metrics.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: product-catalog
    missingEvidence: A public breakdown of package counts, Discover+ share, top-up availability, and module adoption
      by geography or buyer segment.
    whyItMatters: The visible product family is broad, but product mix and attach-rate data are needed to understand
      which modules drive economics and support load.
    diligencePath: Request SKU-level catalog exports, package-count snapshots by region, and channel-level adoption
      or order-mix data.
    relatedQuestionRefs:
    - QE001
    - QE009
    relatedTableRefs:
    - TE001
