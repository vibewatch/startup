callouts:
- title: Breadth across retail, enterprise, reseller, and API channels is the main product moat
  body: Airalo is no longer just a consumer travel eSIM storefront. Public evidence shows one shared product family
    spanning direct retail, Airalo for Business, a reseller layer, and a developer-facing API/SDK/plugin stack.
    That breadth matters because it can compound distribution without forcing the company to build a different supply
    catalog for every channel.
  calloutType: strength
  claimRefs:
  - CE001
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
- title: Service-level underwriting is limited by public vendor opacity and recurring support complaints
  body: Airalo publishes detailed install and troubleshooting guidance, but it does not publicly name the specific
    payment processor, hosting vendor, or carrier matrix behind each plan, nor does it expose a public uptime target
    or incident history. Independent issue and review sources continue to surface activation, connectivity, and
    support handoff problems, which makes operational diligence more important than the polished checkout experience
    suggests.
  calloutType: risk
  claimRefs:
  - CE026
  - CE033
  - CE034
  - CE035
  - CE039
  - CE040
