    "number": 1,
    "title": "Company Overview",
    "summary": "Airalo is a 2019-founded travel eSIM marketplace that says it serves 20M+ users across 200+ destinations and now spans both consumer and business connectivity. Public evidence supports a funding ladder from seed through a $220M 2025 CVC-led round at a valuation above $1B, but governance, precise 2026 headcount, and current revenue remain materially opaque."
  },
  "sections": [
    {
      "id": "identity-product-and-scale",
      "title": "Identity, product model, and visible scale",
      "body": "Airalo’s retained official materials present a consistent company identity: it was founded in 2019 to attack roaming friction with digital eSIMs rather than physical SIM cards, and it now positions itself as the world’s first eSIM store or marketplace. The product surface is broader than a single prepaid tourist data SKU. Airalo explains local, regional, and global plans across 200+ countries and regions, while current app-store listings emphasize instant activation, no roaming fees, and plans that can include data, calls, and texts. The company also increasingly frames itself as both a consumer app and a business platform. Airalo Partners markets enterprise, reseller, API, and white-label use cases and says more than 5,000 companies trust the platform. Visible scale is meaningful but still largely company-claimed: official pages and 2025 press materials cite 20M+ users, while AppBrain shows 10M+ public Play downloads and about 12M lifetime Android downloads as of May 2026. What remains missing is audited revenue, margin, and cash disclosure, so scale is easier to verify than monetization quality.",
