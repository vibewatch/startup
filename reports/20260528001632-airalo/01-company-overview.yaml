    {
      "id": "capital-base-and-stakeholders",
      "title": "Funding history, valuation, and stakeholder map",
      "body": "Airalo’s financing history is well enough documented to anchor the rest of the report. Official and independent sources support a $1.9M 2019 seed, a $5.4M Series A in 2021 led by Rakuten Ventures, a $60M Series B in 2023 led by e& capital, and a $220M Series C in July 2025 led by CVC that valued the company above $1B and made it the sector’s first unicorn. The 2025 press kit says Airalo has raised more than $287M, and disclosed round math lands at roughly $287.3M. The investor mix matters because it is not just generic venture capital: the stack includes private equity, VCs, and strategic telecom investors such as e&, Rakuten, Singtel Innov8, Orange Ventures, KPN Ventures, and Telefónica’s Wayra. That mix is consistent with Airalo’s product logic, which depends on carrier relationships, app distribution, and enterprise channels as much as pure consumer branding. Public financing evidence is therefore strong on round size, valuation, and lead investors, but still weak on exact ownership percentages, board rights, liquidation preferences, and secondaries.",
