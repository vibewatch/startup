summary:
  headline: Airalo 是真实有规模的旅行 eSIM 领导者，消费者触达和渠道触达都很宽，但当前收入质量、利润率和下行保护条款的公开证据仍太薄；按 2025 年独角兽估值看，最多只能继续观察。
