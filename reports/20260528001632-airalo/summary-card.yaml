summary:
  headline: >-
    Airalo is a real, scaled leader in travel eSIMs with broad consumer and channel reach, but public evidence remains
    too thin on current revenue quality, margins, and downside terms to justify more than a track posture at the 2025
    unicorn valuation.
  overallScore: 6.4
  recommendation: track
