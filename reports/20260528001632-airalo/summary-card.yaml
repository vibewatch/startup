  topStrengths:
    - >-
      Airalo has genuine category scale: retained sources support 20 million-plus users, coverage across 200-plus
      destinations, strong app-store distribution, and meaningful partner breadth rather than a purely narrative market
      position.
    - >-
      The product has widened beyond self-serve tourist data packs into Airalo Partners, enterprise tooling, APIs,
      white-label storefronts, and higher-value bundle types, increasing channel optionality and potential monetization
      surfaces.
    - >-
      The July 2025 $220 million CVC-led round plus a telecom-heavy investor base gives Airalo both capital and
      strategic backing to keep improving product, support, and business-channel distribution.
  topRisks:
    - >-
      The central underwriting gap is economic opacity: current revenue, gross margin after carrier costs, CAC/payback,
      refund leakage, burn, and runway are not publicly disclosed even though valuation has already crossed $1 billion.
    - >-
      Competition is intensifying as carrier-native roaming and rival travel-eSIM providers push pricing, unlimited
      bundles, and comparison-friendly offers harder, raising real margin-compression risk in a low-friction category.
    - >-
      Public complaint evidence around activation failures, support responsiveness, and refund handling is too frequent
      to dismiss, especially in a travel product where service quality issues can immediately damage trust and repeat
      use.
  unresolvedGaps:
    - >-
      Current 2024-2026 revenue, gross profit, burn, runway, and carrier-cost waterfalls are still private, leaving the
      valuation anchored to a stale 2023 revenue datapoint.
    - >-
      Public evidence does not show customer concentration, enterprise-account quality, repeat-purchase rates, or
      retention cohorts strongly enough to underwrite durability.
    - >-
      The cap table, liquidation preferences, board rights, and other downside-protection terms from the 2025 round are
      undisclosed.
    - >-
      Carrier contract economics, refund incidence, security/compliance detail beyond marketing claims, and the true
      cost of support remediation all need management diligence.
