  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: partner-channel-economics
    missingEvidence: Public sources do not disclose what share of Airalo revenue, gross bookings, or gross profit now comes through partners, APIs, or white-label channels.
    whyItMatters: Partner distribution is one of the strongest public moat claims in this chapter, but without channel mix data it is impossible to tell whether it is a true economic moat or mostly a top-of-funnel story.
    diligencePath: Request channel mix by bookings, gross margin, and renewal rate for Airalo Partners, API, reseller, and white-label programs.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: repeat-purchase-retention
    missingEvidence: No retained public source discloses Airalo’s repeat-purchase rate, churn to competitor apps, or retention lift from loyalty credits, unlimited bundles, or Discover+ upgrades.
    whyItMatters: Consumer switching friction is low, so repeat use and re-buy behavior are the real test of moat durability for a travel-eSIM leader.
    diligencePath: Request 12-month cohort retention, repeat-trip re-buy rates, and cross-sell attachment for unlimited and voice/text products.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: peer-b2b-channel-benchmarking
    missingEvidence: Most direct peers do not publish comparable partner or enterprise channel metrics, which limits apples-to-apples benchmarking of Airalo’s distribution lead.
    whyItMatters: Airalo may be ahead on partner distribution, but the lead could be disclosure-driven rather than structurally unique if peers have meaningful hidden B2B volume.
    diligencePath: Gather peer partner case studies, management commentary, or customer references on B2B/API adoption before drawing strong conclusions on channel exclusivity.
    relatedTableRefs:
    - TP001
