chapter:
  number: 3
  title: Competitors
  summary: 'Airalo leads the travel-eSIM field on disclosed scale, partner distribution, and breadth of coverage, but its moat is softer than its size implies. Direct peers attack from different angles: Holafly and Maya on unlimited-data simplicity, Nomad and Roamless on flexible trip economics, Jetpac on perks and voice, and GigSky or Ubigi on reliability and multi-device use. The strongest substitute pressure still comes from carrier-native roaming bundles, while Juniper’s 2025 market data shows travel-eSIM pricing is already commoditizing as more vendors enter and push margins down.'
sections:
- id: competitive-landscape
  title: Direct peers, incumbents, and substitutes all solve the same travel-connectivity job
  body: 'Airalo no longer competes in a narrow “buy a travel SIM” niche; by 2026 the buyer can solve the same travel-connectivity job through several classes of alternatives. Direct peers include Holafly, Nomad, GigSky, Jetpac, Ubigi, Roamless, Maya, and newer branded apps such as Saily. Those products all sell instant digital connectivity, but they emphasize different wedges: Holafly and Maya push unlimited usage, Nomad and Roamless push flexible economics, Jetpac adds voice and airport-delay perks, and GigSky or Ubigi lean into reliability and multi-device breadth. Airalo still enters this comparison from a position of disclosed leadership: its own materials and company releases cite 20M+ users, 200+ destinations, and a much broader partner footprint than most direct peers. That matters because many of the rival homepages disclose compelling features but far less evidence of scaled distribution. The competitive set also extends beyond startup peers. Carrier-native roaming products from
    Google Fi, AT&T, T-Mobile, and Verizon let existing subscribers stay on their domestic billing relationship and phone number, which is a meaningful substitute even when the per-trip economics are weaker. The result is a layered landscape in which Airalo is the scale leader among travel-eSIM specialists, but not the only credible option for heavy-data travelers, budget-seekers, or customers who prioritize bundled telecom convenience.'
