- id: TP003
  title: Pricing / packaging comparison
  enumerationScope:
    coverage: partial
    basis: Rows focus on the main direct-peer and incumbent options a traveler is most likely to compare against Airalo when deciding whether to buy an app-based eSIM or roam on a carrier plan.
  columns:
