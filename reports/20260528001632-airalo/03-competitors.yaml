- id: distribution-and-switching-costs
  title: Distribution power favors carriers and partners, while user switching friction stays low
  body: Airalo’s strongest structural edge versus startup peers is not hidden technology; it is distribution. The company’s partner site advertises 5,000+ business relationships across enterprise, reseller, white-label, API, and voucher programs, and that is materially broader than the public go-to-market footprint visible on most direct-peer sites. For investors, that matters more than one-off promo prices because partner channels can lower customer-acquisition cost and embed Airalo into other travel or fintech surfaces. Still, the consumer-level switching cost between travel-eSIM apps is low. Airalo itself tells users they can store multiple eSIMs on one device, top up digitally, and switch plans on the go. GSMA’s standardization materials reinforce that the underlying eSIM stack is an industry standard rather than a proprietary system owned by one vendor. That means a traveler who used Airalo on the last trip can easily test Nomad, Jetpac, or Roamless on the next one if a promo, perk,
    or support experience looks better. Carrier substitutes complicate the picture further. For AT&T, T-Mobile, Verizon, or Google Fi customers, roaming works on the existing number and existing bill, which removes the extra-app onboarding step that all travel-eSIM specialists still require. Airalo therefore benefits from strong top-of-funnel reach and partner optionality, but repeat-purchase durability still depends on support quality, pricing discipline, and breadth of bundle value rather than hard technical lock-in.
