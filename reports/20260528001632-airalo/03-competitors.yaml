  rows:
  - - Airalo
    - $4.50 for 1GB starter plan
    - Prepaid capped bundles with top-ups
    - Local/regional/global eSIMs; some voice/text via Discover+
    - Light or moderate travelers who want flexibility
    - Heavy users can hit top-up friction; many packs remain data-first
  - - Holafly
    - $19 for 5 days unlimited in US example; $49.90 monthly global plan
    - Day-based or monthly unlimited plans
    - Unlimited data, 24/7 support, refund window
    - Heavy-data trips and remote work travel
    - Premium cost for light users
  - - Nomad
    - Examples from roughly $0.62-$1.75/GB; 1GB in some regions from $1.30 per TechRadar
    - Capped local/regional plans with add-ons
    - App-based top-ups and hotspot support
    - Price-sensitive corridor travel
    - Country-level pricing swings widely
  - - Jetpac
    - From $1 in some destinations
    - Low-cost prepaid plans with voice add-ons
    - Essential apps after cap, hotspot, voice packs, reusable eSIM
    - Short trips or backup eSIM use
    - Less disclosed scale than Airalo
  - - Roamless
    - Wallet top-up; credits do not expire
    - Pay-as-you-go credits plus fixed plans
    - Calls, SMS, numbers, and data in one app
    - Irregular repeat travelers who hate wasted leftovers
    - App-based calling and lighter public brand equity
  - - Google Fi
    - $10/GB on Flexible or included on Unlimited Premium
    - Home-plan roaming bundle
    - Native number, texts, calls, and data in 200+ countries
    - US residents already paying for Fi
    - US activation and majority-abroad restrictions narrow addressable audience
  - - AT&T International Day Pass
    - $12/day on land; $20/day on cruises
    - Per-day roaming add-on
    - Domestic number, talk, text, and high-speed data
    - AT&T customers prioritizing convenience
    - Expensive for multi-day leisure travel
  - - T-Mobile International Pass
    - $10 for 1 day/2GB; $35 for 10 days/5GB; $50 for 30 days/15GB
    - Included roaming on premium plans plus optional passes
    - Native number and existing bill
    - Frequent US travelers on premium postpaid
    - Tied to qualifying plans and home-carrier relationship
  - - Verizon TravelPass
    - $12/day globally; $6/day in Canada/Mexico
    - Per-day roaming add-on
    - Domestic number and unlimited talk/text/data with 5GB high-speed cap
    - Verizon subscribers on short trips
    - Background data can trigger charges and economics worsen with trip length
  notes: All prices are retained public list prices or plan examples, not realized net pricing; corridor-specific promos and enterprise discounts are intentionally excluded.
