- id: TP004
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Rows isolate the main public moat claims and countervailing risks that matter for investor underwriting of a travel-eSIM leader in 2026.
  columns:
  - moat-claim
  - threat
  - severity
  - evidence
  - mitigation-or-diligence-ask
  rows:
  - - Airalo has category-leading scale and brand
    - Juniper says travel-eSIM pricing is compressing as more vendors enter and compete on price
    - High
    - 20M+ users and unicorn funding, but Juniper reports falling revenue per GB and intensifying competition
    - Request cohort retention, CAC, and repeat-purchase economics before underwriting scale as durable pricing power
  - - Partner/API distribution is a defensible edge
    - Peers or carriers can still copy channel strategy or win the same partners
    - Medium
    - Airalo discloses 5,000+ partners; most peers disclose much less about B2B distribution
    - Request partner-sourced bookings, gross margin, and renewal rates by channel
  - - Low-entry pricing wins leisure travelers
    - Unlimited-data peers and premium-carrier bundles can win heavy users and frequent travelers
    - High
    - Holafly and Maya lead with unlimited usage; T-Mobile and Google Fi embed international data in home plans
    - Segment product strategy by traveler type instead of assuming one bundle stack fits all
  - - Product breadth creates differentiation
    - Roamless, Jetpac, Saily, and other entrants are bundling credits, voice, security, and lounge-like perks
    - Medium
    - Peers increasingly compete beyond raw GB pricing
    - Track attach rates for Airalo unlimited, voice/text, and loyalty features
  - - Existing app trust supports repeat usage
    - Review and rating surfaces make support failures highly visible and easy to compare across apps
    - Medium
    - App Store and Trustpilot create transparent service-comparison channels
    - Request support SLA, refund rate, and app-store review trend data
  - - Underlying eSIM technology is a moat
    - GSMA standardisation and multi-eSIM device behavior make technical switching friction low
    - High
    - GSMA describes eSIM as a standard secure download architecture and Airalo itself says multiple eSIMs can be stored and switched
    - Underwrite moat on brand, channel, and service, not on exclusivity of the technology stack
  notes: Severity scores are analytical judgments based on retained public evidence; they are not company-disclosed risk labels.
