      - number: '8.2'
        title: Thesis, anti-thesis, and comparable set
        blocks:
          - type: paragraph
            body: >-
              The positive case for Airalo is straightforward and evidence-backed. By 2025 the company was disclosing
              more than 20 million travelers across 200-plus destinations, and both the company and its investors framed
              the model as digitally distributed, low-CAC, and increasingly relevant to business users as well as
              leisure travelers. Juniper- and GSMA-linked evidence also supports a category with real tailwinds: travel
              eSIM revenue is growing quickly, investor funding stayed strong in 2025, and more operators now treat
              travel eSIM as a core roaming-defense product rather than a fringe add-on. The anti-thesis is just as
              real. The same Juniper reporting says carriers must launch their own offers in 2026 to stop losing roaming
              revenue to third parties, which means category growth also draws aggressive supply. Competitor reviews and
              alternatives reinforce that point: Airalo wins on breadth and convenience, but users can compare it
              against unlimited-data rivals, local SIMs, and cheaper regional options, while strict refunds or support
              friction can quickly change the purchase decision. On comparable screens, Airalo looks less extreme than a
              simplistic “unicorn equals bubble” take would imply. Using the 2023 revenue anchor, Airalo sits around
              Airbnb-like public sales multiples and above Booking or Expedia. Private travel-tech funding also remained
              available in 2025, but direct private eSIM comps remain thin, so the comparable set necessarily blends
              travel marketplaces with adjacent private platforms and explicitly notes the limitation.
            claimRefs:
              - CV004
