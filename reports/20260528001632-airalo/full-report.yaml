      - number: '3.4'
        title: The moat is real at the brand layer, but adverse evidence points to commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is straightforward: this is no longer a market where being early guarantees durable
              pricing power. Juniper Research says average revenue per gigabyte for travel eSIM data fell from $3.20 in
              2023 to $2.78 in 2025 because more vendors entered the market and pushed prices down to win or retain
              customers. Juniper goes further, arguing that niche providers can outperform larger players when they
              bundle travel essentials or loyalty-style benefits beyond raw data. That maps closely to the competitive
              behavior visible in the retained source set: Jetpac bundles SmartDelay and essential-app continuity,
              Roamless bundles credits, calling, and numbers, Saily layers security and business tools, while carrier
              bundles keep the native phone number and billing relationship. Airalo’s size still matters. It is better
              capitalized than most direct peers, has broader partner distribution, and is clearly investing in
              unlimited bundles, voice/text packages, and product refreshes. But those are defensive moves inside a
              standardised ecosystem, not proof of a proprietary moat. The best investor framing is therefore
              “moderately durable leader in a fast-crowding category,” not “winner-take-all network effect.” Airalo
              should outperform smaller D2C apps on brand and channel depth, but the main risk over the next 12-24
              months is margin pressure if heavy-data users, repeat travelers, or partner channels keep finding
              equal-enough alternatives with sharper bundle economics.
