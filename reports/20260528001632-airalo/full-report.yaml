      - number: '7.4'
        title: People, governance, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Airalo's people and financial risks are mostly about opacity rather than immediate distress. Public
              evidence is strong on funding and brand scale — including a $220M 2025 round at a unicorn valuation and
              consumer surfaces with large download and ratings counts — but weak on the numbers that actually determine
              downside resilience. Retained public sources do not disclose audited revenue, gross margin, burn, runway,
              refund reserve, or retention. At the same time, Juniper's 2025 travel-eSIM work shows revenue per gigabyte
              falling as competition intensifies, which means Airalo must prove that scale, distribution, and product
              breadth can offset category commoditization. The organization is also still publicly founder-centric.
              Craft and The Org provide only a thin visible bench, while the 2025 press kit points to a 350+ team across
              50+ countries, implying a large coordination burden for support, compliance, and enterprise execution.
              Public board and ownership visibility is still limited, so investors are being asked to underwrite
              substantial execution demands with incomplete governance and unit-economics disclosure.
