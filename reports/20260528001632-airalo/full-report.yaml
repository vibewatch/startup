      - number: '5.5'
        title: Differentiation, maturity, and product risks
        blocks:
          - type: paragraph
            body: >-
              Airalo’s most defensible product differentiator is not a proprietary radio network but an orchestration
              layer that spans consumer travel purchase, enterprise management, white-label resale, and developer-led
              distribution. Few travel eSIM brands expose all of those surfaces publicly at once, and Airalo reinforces
              that breadth with a public SDK, a formal REST API, install-instruction delivery options, top-ups, partner
              alerts, and large mobile distribution channels. Product maturity looks strongest in the core catalog,
              installation, and partner-ordering workflows. The main risks are structural. eSIM functionality still
              depends on OEM hardware decisions, carrier unlock status, country-specific model variants, and local
              network behavior that Airalo does not fully control. Airalo also does not publicly expose a status page,
              uptime target, named carrier matrix, or named infrastructure vendors across the reviewed surfaces, making
              it hard to underwrite reliability ex ante. The 2026 release evidence that is visible is largely shipping
              evidence—current app versions, current partner capabilities, and current automation features—not dated
              forward roadmap commitments. Investors should therefore read Airalo as a mature
