          - type: callout
            title: Partner channels matter more than generic traveler demand
            body: >-
              Airalo’s airline, enterprise, and operator pages imply that the first customer touchpoint is strategically
              important. If those partner-led channels grow faster than direct app installs, Airalo’s actual SAM will be
              shaped by workflow ownership and distribution leverage more than by the broad eSIM TAM headline.
