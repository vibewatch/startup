      - number: '7.5'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigation case for Airalo is not empty. The company has capital, a visible legal and privacy surface,
              a trust center, device-support documentation, and partner-facing support/compliance claims that are better
              than what many smaller travel-eSIM vendors disclose publicly. Those surfaces matter because they suggest
              management understands the main failure modes: onboarding friction, regulatory scrutiny, and counterparty
              complexity. But the public record still supports a cautious underwriting stance. The strongest mitigations
              are process and disclosure signals, not hard proof that refund rates are low, activation success is high,
              carrier concentration is manageable, or unit economics are resilient. That makes kill criteria especially
              important. Investors should watch for consumer or privacy enforcement, review-surface deterioration,
              provider or platform disruption, founder-bench slippage, and any private KPI disclosure showing that
              growth or gross margin is materially below what a $1B+ financing story implies. Airalo can remain a
              category leader and still be a weak risk-adjusted investment if those thresholds move the wrong way.
