      - - Airbnb
        - May 2026 market cap $78.4B; 2025 revenue $12.24B
        - ~6.4x sales
        - Shows what a scaled travel platform with strong consumer brand can command publicly
        - Far more mature, audited, and diversified than Airalo
      - - Booking Holdings
        - May 2026 market cap $130.46B; 2025 revenue $26.91B
        - ~4.8x sales
        - Useful public travel incumbent benchmark for a highly profitable marketplace
