            title: Category growth does not guarantee reseller economics
            body: >-
              Travel eSIM adoption can expand while reseller economics deteriorate. Juniper’s declining revenue-per-GB
              data and Counterpoint’s warning on fragmentation, price wars, and MNO retaliation suggest Airalo must
              scale distribution and trust, not just rely on a widening traveler pool.
            calloutType: risk
            claimRefs:
