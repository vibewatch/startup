      - number: '4.3'
        title: Cost structure, gross margin drivers, and public unit-economics gaps
        blocks:
          - type: paragraph
            body: >
              Airalo's cost structure looks structurally attractive in theory and stubbornly opaque in practice.
              Industry sources provide the mechanism: travel eSIM providers can price well below traditional roaming
              because they avoid physical SIM distribution, rely on digital acquisition and activation, and buy or
              aggregate connectivity through direct local partnerships and wholesale-style arrangements. TechCrunch adds
              an important Airalo-specific detail here: behind the scenes, the company combines direct wholesale
              capacity purchases with resold roaming plans already structured by carriers. That hybrid supply model can
              be margin-positive if Airalo captures demand carriers would otherwise lose, but it also means realized
              gross margin depends on contract terms by geography, carrier, and package type. Regulatory and industry
              benchmarks help bound the economics. Juniper says travel eSIMs can save customers 35% per GB versus
              roaming in 2024 and could save around 75% per GB by 2029; GSMA says travel eSIM is becoming a successful
              use case, with 28% of travel eSIM users already buying from global providers like Airalo. EU and ITU
              materials further show that wholesale roaming charges and inter-operator tariffs remain key cost drivers
              in the legacy roaming stack, supporting the case that Airalo's value proposition rests on bypassing or
              compressing those legacy markups. What is missing is the actual waterfall from package list price to
              carrier cost, support cost, refunds, and net contribution margin. Recent Google Play complaints and
              independent reviewer caveats are a reminder that support, installation failures, fair-use restrictions,
              and inconsistent local number availability can all leak margin even in a digital model.
            claimRefs:
