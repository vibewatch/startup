  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: wide
    summary: >-
      How travel pain, the eSIM marketplace, app distribution, and the partner platform combine into Airalo’s current
      company shape.
    data:
      nodes:
        - id: n1
          label: Roaming pain
          description: High roaming bills and travel connectivity friction create the core user problem.
        - id: n2
          label: eSIM marketplace
          description: Airalo sells digital local, regional, and global eSIM plans across 200+ destinations.
        - id: n3
          label: App-led self-service
          description: Users buy, install, top up, and manage plans through iOS, Android, and web flows.
