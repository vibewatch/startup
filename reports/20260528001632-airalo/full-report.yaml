      - number: '1.2'
        title: Founders, leadership, and organizational footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest public leadership evidence remains tightly centered on the founders. Official releases
              consistently name Ahmet Bahadir Ozdemir and Abraham Burak as the core founding pair, with Ozdemir serving
              as CEO and Burak operating publicly as COO. Their founder-market-fit story is unusually concrete: the
              press kit traces the idea to Ozdemir’s shipping-supply work, where repeated requests for local SIM cards
              exposed the traveler-connectivity problem, while Antler’s interview with Burak adds lived travel
              experience and telecom-sector exposure. Public footprint data is directionally clear but not perfectly
              tidy. TechCrunch described Airalo as founded in Singapore and officially headquartered in Delaware, while
              Craft lists Delaware as headquarters and Toronto, Singapore, and Istanbul as office locations; official
              pages separately stress a remote-first organization spread across many countries. What is thin is the
              broader executive and governance picture. The Org describes a three-person leadership team built around
              the co-founders and a VP of People, and retained public sources do not expose a detailed current board
              roster, ownership structure, or cap-table rights. That makes key-person dependence and governance opacity
              real diligence themes, not editorial filler.
