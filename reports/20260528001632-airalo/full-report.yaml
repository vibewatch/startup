  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Airalo sells digital roaming replacement rather than physical connectivity hardware. Its consumer
              proposition is a prepaid eSIM marketplace covering more than 200 countries and regions, with local,
              regional, and global packages plus Discover+ plans that add voice and text on top of data. The company
              describes itself in legal terms as an aggregator and marketplace of connectivity services, which matters
              because the customer relationship, purchase flow, and installation experience are controlled by Airalo
              while the underlying network layer is sourced from third parties. The same catalog logic is extended into
              adjacent B2B products: Airalo for Business for managed employee travel, Partner Integrations for
              API/SDK/plugin distribution, and a reseller surface for white-label or branded resale. Public partner
              pages repeatedly anchor the product family on the same 20M+ user, 200+ destination footprint, which
              suggests one shared supply and order-management backbone across retail and partner channels. The practical
              implication for diligence is that Airalo has product breadth and distribution leverage, but it also
              inherits the coordination risk of a marketplace that sits between travelers, enterprises, resellers, app
              stores, and local mobile operators.
