      - number: '8.3'
        title: Scenario range and exit path
        blocks:
          - type: paragraph
            body: >-
              Because current revenue is undisclosed, the scenario work has to be explicit about what is assumption and
              what is evidence. The disclosed revenue anchor is 2023 at $150 million; the disclosed scale anchor is 20
              million travelers by 2025; and the public comparable anchors are roughly 1.8x sales for Expedia, 4.8x for
              Booking, and 6.4x for Airbnb in May 2026. Those anchors make it possible to frame a valuation range
              without pretending to know exact 2026 revenue. In the bear case, Airalo is a good product in a
              commoditizing market where operator retaliation and price shopping force the business toward a lower
              travel-platform multiple and only modest topline growth. In the base case, Airalo keeps scaling from the
              2023 base and deserves a mid-single-digit sales multiple that lands near the current mark. In the bull
              case, the company turns enterprise distribution, unlimited bundles, and higher-value products into a more
              durable marketplace premium. The exit implications are just as important as the multiple. Public evidence
              supports a strategic sale or sponsor-backed transaction more than a near-term IPO because Airalo does not
              disclose revenue quarterly, has no audited public reporting cadence, and still relies on private-company
              opacity on the most important economic questions. That does not break the investment case, but it limits
              what kind of return underwriting is credible at the current price.
            claimRefs:
              - CV013
              - CV017
              - CV018
              - CV019
              - CV020
              - CV034
              - CV035
              - CV036
              - CV037
