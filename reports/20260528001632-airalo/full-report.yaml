        title: Trust, privacy, compliance, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Airalo’s public trust posture is split across consumer legal pages and partner sales pages. The privacy
              policy discloses broad collection of account, contact, device, location, usage, communications,
              review-platform, and in some cases eKYC/compliance data, and it explicitly notes global storage and
              sharing with providers involved in network connectivity, hosting, payments, and distribution. Partner
              pages add stronger commercial trust language by claiming GDPR, SOC 2 Type II, and PCI DSS alignment,
              state-of-the-art encryption, regular audits, and SSO features. Consumer help pages show a practical
              quality-control layer as well: 24/7 chat support, troubleshooting playbooks, and automated
              replacement/refund paths. Observable storefront signals are also strong—high iOS and Android ratings with
              large review bases and 10M+ Android downloads. The caveat is that legal terms still disclaim guaranteed
              availability and quality of the underlying connections, and independent issue trackers/review summaries
              continue to surface activation failures, login errors, poor rural coverage, refund friction, and
              chatbot-heavy support experiences. In other words, Airalo shows evidence of process maturity, but public
