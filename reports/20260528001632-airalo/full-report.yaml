        title: Exhibits
        blocks:
          - type: callout
            title: The cleanest public market lens is not the biggest one
            body: >-
              Broad eSIM TAMs help frame technical adjacency, but they overstate Airalo’s directly relevant opportunity
              because much of the value sits in connectivity services, M2M, and automotive use cases. Travel-specific
              user growth and corridor economics are more decision-useful than the largest headline TAM.
