  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and consumer-protection risk
        blocks:
          - type: paragraph
            body: >-
              Airalo's legal surface is more complicated than the product's simple traveler pitch suggests. The
              company's own terms describe Airalo as an aggregator and marketplace of connectivity services rather than
              a single-network operator, which means the business inherits consumer-rights, privacy, and
              telecom-compliance exposure from both its own contracting layer and the underlying provider stack. The
              sharpest public legal issue is not an identified headline lawsuit; it is the combination of strict
              activation-linked refund rules, complaint-heavy support surfaces, and limited public disclosure on how
              carrier or licensing responsibilities are allocated market by market. Airalo's March 2026 privacy policy
              also broadens the regulatory envelope by acknowledging possible biometric and eKYC processing,
              international transfers, and multiple supervisory routes. Airalo does have visible mitigation surfaces — a
              legal center, privacy policy, trust center, and enterprise compliance claims — but the retained public
              record still does not provide a jurisdiction-by-jurisdiction carrier, license, or approval map. That makes
              legal diligence less about whether rules exist and more about whether management can document compliance
              market by market before a regulator, partner, or consumer complaint forces the issue.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
