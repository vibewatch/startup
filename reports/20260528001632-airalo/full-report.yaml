  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Airalo enters valuation work with one unusually strong public fact and one unusually important omission.
              The strong fact is that the company disclosed a $220 million 2025 financing above a $1 billion valuation,
              with CVC contributing $185 million and the prior syndicate still participating. That is not a rumor or
              database mark; it is supported by company, investor, and independent reporting. The omission is that the
              best public revenue anchor remains Forbes' citation of $150 million in 2023 revenue, while reviewed
              sources still do not disclose current revenue, gross margin, or preference terms. That combination
              matters. If 2024 and 2025 revenue scaled materially from the 2023 base, the unicorn price may already
              screen close to public travel-platform multiples. If growth slowed or economics are thinner than the
              product story suggests, the same headline price becomes much harder to defend. The right posture is
              therefore price discipline rather than reflexive skepticism: public evidence is good enough to say the
              round was not obviously absurd, but not good enough to underwrite the current mark without a data room.
              Entry discipline should focus on three questions before anything else: what current revenue and gross
              profit actually are, whether the 2025 round used standard downside protection, and how much repeat or
              enterprise behavior supports the topline beyond one-off tourist demand.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV026
              - CV042
