      - number: '5.2'
        title: Consumer workflow, installation, and support operations
        blocks:
          - type: paragraph
            body: >-
              The observable retail workflow is simple but operationally non-trivial. A user chooses a destination
              package on the website or in the app, pays, opens My eSIMs, then follows install and connection
              instructions inside the app. Public help flows show that the real operating model depends on device
              readiness: the phone must support eSIM, must be network-unlocked, and the Airalo app may not work on
              rooted or jailbroken devices. On both iOS and Android, Airalo supports direct installation from the app
              where available, plus QR-code and manual SM-DP+/activation-code paths. After install, users may still need
              APN edits, data-roaming changes, manual network selection, default-line changes, or switching away from
              another active SIM before the eSIM becomes usable. Airalo has added explicit operational states such as
              Installed versus In Use and now exposes self-service remediation flows including automated replacement,
              automated refund, and support escalation when direct install fails. That is more sophisticated than pure
              checkout-only travel eSIM storefronts, but it also shows that Airalo must own a large support and
              edge-case burden around handset settings, destination timing, and network attach behavior.
