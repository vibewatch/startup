      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Airalo's market is segmented less by geography than by who controls the purchase moment. In self-serve
              leisure travel, the buyer, user, and payer often collapse into one person who wants a cheap digital
              roaming substitute before or during a trip. In managed business travel, the user is the traveling
              employee, but the buyer and payer may sit with a travel manager, finance controller, or IT admin using
              centralized assignment, prepaid credits, postpaid invoices, and spend caps. Airalo's airline and
              travel-distribution products shift the buyer to a digital product, ancillary revenue, or loyalty team,
              while the end user remains the passenger and the payer may be either the passenger or a sponsoring brand.
              Its MNO/MVNO product creates a different workflow again: the buyer is a roaming or product team trying to
              protect roaming revenue, while the end payer is still the subscriber. This matters because each segment
              has a different adoption trigger: traveler convenience for leisure users, policy and billing control for
              employers, ancillary conversion for airlines, and silent-roamer monetization for operators. Airalo's
              enterprise-grade controls also suggest that trust, compliance, and reporting are part of the market, not
              mere product garnish.
            claimRefs:
