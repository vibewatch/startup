      - number: '4.4'
        title: Capital adequacy, financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >
              Public capital evidence is much clearer than public operating economics. Airalo's 2023 Series B added $60
              million and brought disclosed cumulative funding to $67.3 million, while TechCrunch placed that round at a
              $280 million post-money valuation. In July 2025, CVC and Forbes reported a much larger inflection: $220
              million of fresh capital at a valuation above $1 billion, including $185 million from CVC and
              participation from Peak XV and Antler Elevate. On disclosed rounds alone, cumulative funding reaches at
              least $287.3 million. That materially reduces near-term financing dependency and suggests the company
              raised for acceleration, not rescue. The planned uses of funds also fit that view: better customer
              experience, new products, better value for money, and expanded enterprise and partner connectivity. Even
              so, the public evidence set still cannot answer the core capital questions an investor would need for
              underwriting. No reviewed source disclosed cash on hand, monthly burn, runway, realized gross margin, CAC,
              payback, or direct-versus-partner revenue mix. Public registry evidence is also incomplete rather than
              consolidated: a UK entity formerly named Airalo Esim Ltd has no filed accounts yet, its first accounts are
              not due until October 2026, and registry/legal records show entity-level changes rather than a group P&L.
              The financial verdict is therefore nuanced: Airalo appears to have real revenue, strong demand, and
              adequate growth capital, but it remains a private company whose margin path and cash efficiency cannot be
              underwritten from public evidence alone.
