        title: Customer segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              Airalo serves two overlapping customer universes. The first is a self-serve travel customer base: leisure
              travelers, business travelers, digital nomads, and crew members who buy prepaid data packages trip by trip
              through the app or website. The second is a partner-managed base sold through Airalo Partners, where the
              buyers are enterprise admins, SMB owners, airlines, travel businesses, and telecom operators that want to
              distribute connectivity to employees, passengers, or subscribers. Public materials are explicit about the
              segmentation breadth: airline pages emphasize ancillary revenue and loyalty tie-ins; enterprise pages
              emphasize SSO, branch structures, and invoicing; SMB pages emphasize budget controls and team assignment;
              MNO/MVNO pages emphasize white-label roaming retention. That breadth is strategically attractive because
              it reduces dependence on a single user persona. The gap is that Airalo publicly names verticals and
              features far more readily than it names accounts, so segmentation breadth is well evidenced while
