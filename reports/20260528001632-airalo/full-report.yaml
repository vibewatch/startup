      - number: '2.2'
        title: Sizing Lenses and Contradictory Public Estimates
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is abundant but not internally consistent, which matters for valuation. Grand View
              Research describes a broad global eSIM market worth USD 11.87 billion in 2025, while Fortune Business
              Insights places the category at USD 2.12 billion in 2026 and Business Research Insights puts 2026 at just
              USD 0.82 billion. Mordor uses yet another lens, measuring embedded SIM shipments rather than revenue and
              forecasting 0.65 billion units in 2026. These figures are all directionally useful, but they cannot be
              blended into one canonical TAM because they combine revenue and unit methods and include M2M, automotive,
              and other use cases far outside Airalo's direct travel wedge. The tighter travel-specific signals are more
              relevant: Juniper sees travel eSIM users rising from 40 million in 2024 to more than 215 million by 2028,
              and Counterpoint expects third-party travel eSIM downloads to grow nearly threefold between 2025 and 2030.
              Airalo's own disclosed footprint of 20 million-plus users and 5,000-plus partners confirms category
              traction, but public data still does not support a clean Airalo SOM because channel mix, repeat-rate, and
              segment economics are undisclosed.
