  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and public traction
        blocks:
          - type: paragraph
            body: >
              Airalo monetizes global connectivity through an unusually transparent public storefront, but not through
              public financial statements. The company sells local, regional, and global eSIM packages in more than 200
              destinations, with list pricing displayed on country and regional product pages and package mechanics
              described on its website, help center, and app-store listings. Public pricing shows that the consumer
              product is fundamentally prepaid: a traveler chooses a destination, prepays for a fixed data allowance and
              validity window, installs the eSIM, and can often top up or renew later. That matters financially because
              it implies cash is collected before or at service activation rather than through classic postpaid roaming
              billing. Public list prices also show clear merchandising logic: country plans can start as low as $4 for
              1GB/3 days in the US or Japan, Asia regional plans start at $4, Europe regional starts at $5, and Airalo's
              global Discover products start at $8.50. The company also markets higher-value products such as Discover+
              plans with calls and texts, unlimited data options, and wider-duration bundles. Public traction around
              this price architecture is meaningful: Airalo says it serves more than 20 million users across 200-plus
              destinations, while Apple, Google Play, and AppBrain corroborate large-scale app adoption with 95K iOS
              ratings, 162K Google Play reviews, 10M+ Play downloads, and AppBrain's 12M Android download estimate.
              These are strong public demand signals, but they are not a substitute for disclosed realized revenue,
              revenue recognition policy, repeat purchase rates, or take rate after carrier settlements and refunds.
