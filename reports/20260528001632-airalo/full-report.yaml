companyProfile:
  summary: >-
    Airalo is a 2019-founded travel eSIM marketplace that sells local, regional, and global connectivity plans to
    cross-border travelers and increasingly to business and distribution partners. Official and independent sources
    support its evolution from a consumer app into a broader connectivity platform spanning Airalo Partners, reseller
    and white-label tools, APIs, and enterprise account-management capabilities. Public traction is meaningful: Airalo
    says it serves 20 million-plus users across more than 200 destinations, has 5,000-plus partner companies, and raised
    a $220 million Series C in July 2025 at a valuation above $1 billion. The core underwriting problem is not whether
    the company has scale, but whether current revenue, margin, repeat behavior, partner economics, and investor terms
    are strong enough to justify aggressive entry at the unicorn mark.
