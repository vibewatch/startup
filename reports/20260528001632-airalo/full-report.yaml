        - Direct leader
        - 20M+ users; 5,000+ partners; 200+ destinations
        - Leisure and business travelers plus partner-led distribution
        - Prepaid local, regional, and global bundles; starts at $4.50 for 1GB
        - Broadest disclosed scale in retained set; partner/API/white-label channel; some voice/text via Discover+
        - Mostly data-first and often capped; unlimited-data peers and carrier bundles pressure heavy-user economics
      - - Holafly
        - Direct peer
        - 160 destinations; 24/7 support; refund window
        - Heavy-data travelers and digital nomads who want simplicity
        - Unlimited day-based plans and monthly/global plans from $49.90/month
