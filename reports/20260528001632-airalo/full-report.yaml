  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Relevance
        blocks:
          - type: paragraph
            body: >-
              Airalo's directly relevant market is the cross-border connectivity layer that sits between mobile network
              infrastructure and traveler purchase decisions. The company sells travel eSIMs to individual travelers,
              but its partner surfaces show a wider boundary that also includes managed business travel, airline and
              travel-brand distribution, and MNO/MVNO white-label roaming retention. That makes the right market
              definition narrower than the generic eSIM industry and broader than a pure leisure-travel app category.
              Included spend is temporary international data access, whether bought directly by a traveler, billed to an
              employer, bundled into an airline journey, or resold by an operator trying to keep roaming revenue
              in-network. Excluded spend includes domestic postpaid plans, industrial IoT and automotive eSIM
              deployments, and other broad connectivity-services revenue that appears in analyst eSIM TAMs but does not
              map to Airalo's buyer workflow. A further boundary constraint is geographic: the EU's roam-like-home rules
              remove incremental roaming charges inside the bloc, meaning a meaningful subset of short-haul European
              trips already has a low-friction substitute for third-party travel eSIMs.
            claimRefs:
