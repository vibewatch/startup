  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Airalo serves both self-serve travelers and partner-managed accounts; the journey starts with trip discovery and
      can loop into top-ups, loyalty, and B2B expansion.
    data:
      items:
        - id: discovery
          label: Discovery
          actor: Leisure traveler / digital nomad / business traveler / partner admin
          description: >-
            Customers typically discover Airalo before a trip through app stores, search, partner distribution, or
            travel planning. Public positioning emphasizes 200+ destinations and no-roaming convenience.
          channels:
            - App Store / Google Play
            - Search / travel planning
            - Partner API / white-label
            - Word of mouth
        - id: purchase
          label: Purchase
          actor: Individual traveler or company admin
          description: >-
            Individuals buy prepaid local, regional, or global plans; partner admins buy or distribute eSIMs for
            employees or end users.
          channels:
            - Airalo app
            - Airalo website
            - Partner Platform
            - Voucher / white-label store
        - id: activation
          label: Activation
          actor: Traveler or employee
          description: >-
            Activation happens on arrival or just before travel; Airalo now tracks pending activations for business and
            partner accounts to reduce drop-off.
          channels:
            - Direct install
            - QR / manual install
            - Pending activation filter
            - Support / help center
        - id: usage
          label: Usage / top-up
          actor: Traveler / team user
          description: >-
            Successful users consume data abroad, top up in-app when needed, and may use loyalty cashback or
            business-mode payments for follow-on purchases.
          channels:
            - In-app top-up
            - Airmoney cashback
            - Usage tracking
            - Business mode checkout
        - id: repeat-expand
          label: Repeat / expand
          actor: Frequent traveler / business admin / channel partner
          description: >-
            Repeat use can come from another trip, loyalty cashback, automated renewals, or company-wide expansion
            through reporting, billing, and white-label/API distribution.
          channels:
            - Loyalty tiers
            - Automated renewals
            - Monthly usage reports
            - White-label / API / vouchers
