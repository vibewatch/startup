      - number: '4.2'
        title: GTM motion and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Airalo does not publish CAC, payback, or channel mix, so the underwriting task is to infer sales
              efficiency from public distribution evidence. The strongest public signal is that growth appears to be
              driven by a mix of organic consumer discovery and partner-led distribution rather than obvious paid demand
              generation. CVC explicitly described the company as a highly scalable digital model grown primarily
              through organic channels, and TechCrunch reported nearly one million downloads per month around the 2023
              Series B. App stores and AppBrain show the product ranks strongly in travel categories, while the official
              consumer site highlights 53-language support and low-friction install flows. On the indirect side, Airalo
              has leaned hard into distribution: the 2023 Series B press release and TechCrunch both positioned Airalo
              Partners as a new business line, while the current partner site says more than 5,000 companies use Airalo
              Partners across enterprise, airline, fintech, travel, and telecom use cases. That matters because
              partner-led and B2B2C sales can lower acquisition costs, increase enterprise contract value, and turn
              Airalo into a network monetization tool for airlines, financial institutions, and even MNO/MVNO partners.
              The catch is that none of the reviewed public sources break out how much GMV or revenue comes from direct
              consumer app sales versus partners, nor do they show contract durations, reseller rev-share terms, or
              enterprise retention. Sales efficiency therefore screens promising but not yet measurable.
