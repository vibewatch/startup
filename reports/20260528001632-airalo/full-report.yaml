              Airalo gives many structural reasons to expect repeat usage, but very little disclosed cohort math. The
              loyalty page awards 5%-10% Airmoney cashback on every paid eSIM or top-up purchase, which is a direct
              incentive to come back for the next trip. The App Store copy says users can top up in-app, and the
              partner-platform updates show activation tracking, monthly usage reporting, and recurring admin workflows
              for business accounts. Public satisfaction proxies are broadly positive: 4.6/5 from 95K iOS ratings, 4/5
              from 14,398 Trustpilot reviews, about 4.45/5 from roughly 158 thousand AppBrain-tracked Android reviews,
              and a small US-Reviews sample where 58% said they would buy again. Independent reviewers also add
              repeat-use anecdotes, including one who says they used Airalo across 40+ countries over multiple years.
              Still, none of these sources disclose actual repeat purchase, churn, NRR, or corridor-level retention, so
              the retention case remains proxy-heavy rather than underwriteable.
