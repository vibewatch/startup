      - number: '1.4'
        title: Milestones, expansion path, and adverse trust signals
        blocks:
          - type: paragraph
            body: >-
              The milestone trail shows a company moving from consumer travel utility toward a broader connectivity
              platform. The press kit dates the first Airalo sale to July 2019, then the record steps through Series A
              and Series B financing, a May 2024 announcement that Airalo had crossed 10M users and launched Airalo
              Partners, a June 2024 loyalty-program launch, an April 2025 milestone at 20M users, and the July 2025
              unicorn round. The 2025 financing coverage also ties new capital to an expanded product set: a new app
              experience, unlimited data bundles, and data-text-voice offerings in select destinations. That trajectory
              is strategically positive, but the public adverse picture is not empty. Airalo’s own terms narrow
              withdrawal and refund rights once a user activates or uses an eSIM, and complaint platforms in 2025-2026
              show recurring claims about activation failures, duplicate charges, outages, login errors, support delays,
              and disputes over refunds or Air Money credits. Those public complaints are not enough to prove systemic
              failure, but they are enough to make trust, support quality, and operational reliability relevant
              diligence questions rather than edge cases.
