- id: adoption-trajectory-and-scale-proxies
  title: Adoption trajectory and scale proxies
  body: 'Customer adoption looks real at the top of the funnel. TechCrunch reported 5.1 million customers and nearly 1 million monthly downloads in mid-2023; Airalo then said it crossed 10 million users in May 2024 and 20 million users by April 2025. The public app surfaces support the idea of very broad reach: Google Play showed 10M+ downloads and 162K reviews, the App Store showed 95K ratings, and AppBrain estimated 12 million Android downloads with roughly 158 thousand reviews. The combination implies a mass-market consumer product rather than a boutique travel utility. What it does not prove is retention quality. Nearly every public figure is cumulative or platform-level: cumulative users, installs, ratings, and partners. None of the reviewed sources disclose active users, repeat purchasers, or the split between direct app acquisition and partner-sourced demand. The net result is a strong adoption narrative with a weak denominator narrative.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-public-customer-proof
  title: Named public customer proof
  body: 'The strongest named public customer proof in the retained evidence comes from traveler reviews rather than from logo-level enterprise case studies. AppBrain surfaces named Android reviewer comments: Louis D described easy installation and fair pricing across Europe and North America, while Faisal Basheer reported two successful Japan eSIMs with strong performance. US-Reviews adds named consumer proof in the form of Emelia Franecki’s successful Colombia trip and a repeat-use reviewer who explicitly said it was their second time using Airalo. These examples are valuable because they describe live, production usage rather than a marketing logo carousel. The problem is that public B2B proof is much weaker. Airalo’s partner pages describe airlines, enterprises, and telecom operators as customer groups, but none of the reviewed official pages name a specific airline, fintech, OTA, or enterprise account. For diligence purposes, the named proof set supports real consumer use but does not
    yet establish partner concentration or enterprise durability.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU030
  - CU037
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-repeat-usage-and-satisfaction
  title: Retention, repeat usage, and satisfaction
  body: 'Airalo gives many structural reasons to expect repeat usage, but very little disclosed cohort math. The loyalty page awards 5%-10% Airmoney cashback on every paid eSIM or top-up purchase, which is a direct incentive to come back for the next trip. The App Store copy says users can top up in-app, and the partner-platform updates show activation tracking, monthly usage reporting, and recurring admin workflows for business accounts. Public satisfaction proxies are broadly positive: 4.6/5 from 95K iOS ratings, 4/5 from 14,398 Trustpilot reviews, about 4.45/5 from roughly 158 thousand AppBrain-tracked Android reviews, and a small US-Reviews sample where 58% said they would buy again. Independent reviewers also add repeat-use anecdotes, including one who says they used Airalo across 40+ countries over multiple years. Still, none of these sources disclose actual repeat purchase, churn, NRR, or corridor-level retention, so the retention case remains proxy-heavy rather than underwriteable.'
  claimRefs:
  - CU012
  - CU014
  - CU015
  - CU016
