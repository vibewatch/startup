  - CU041
- calloutType: risk
  title: Customer quality is harder to underwrite than customer reach
  body: 'Airalo has plenty of public reach metrics, but they are mostly cumulative: users, installs, ratings, and claimed partner counts. The company does not publicly disclose repeat purchase, active-user ratios, business renewals, or top-customer concentration, while complaints about activation failures and Air Money credits after failed trips show how customer-experience issues could impair both repeat use and partner trust.'
