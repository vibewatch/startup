callouts:
- calloutType: strength
  title: Airalo already has a broad cross-segment surface, not a single-channel travel app
  body: 'Public evidence supports a genuinely diversified customer surface: a large direct-travel funnel, clear segment fit for leisure and frequent travelers, and a parallel business platform that sells to enterprises, SMBs, airlines, and telecom operators. The breadth matters because it gives Airalo multiple ways to grow beyond one-off tourist purchases, especially via partner-led distribution and business-account expansion workflows.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
  - CU009
  - CU035
