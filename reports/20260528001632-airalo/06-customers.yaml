    - Used two Airalo eSIMs in Japan
    - Production / live trip use
    - Reported perfect connectivity and excellent rate / data quality
    - One short public comment in a strong corridor
  - - Emelia Franecki (US-Reviews, 2024)
    - Leisure traveler
    - Bought Colombia eSIM and used it through the app
    - Production / live trip use
    - Said setup and connection were smooth and reliable
