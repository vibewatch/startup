schemaVersion: report-v2
artifact: customers
slug: airalo
runDate: '2026-05-28'
company:
  name: Airalo
chapter:
  number: 6
  title: Customers
  summary: 'Airalo clearly has real customer reach across both self-serve travelers and business / channel partners: public evidence supports a path from 5.1 million customers in 2023 to 10 million users in 2024 and 20 million users by 2025, plus 5,000+ claimed partners. Customer quality is less transparent than customer reach. Ratings, loyalty mechanics, and repeat-use anecdotes are constructive, but public named B2B customer proof, repeat-purchase cohorts, and concentration disclosure remain thin while activation and refund complaints are frequent enough to matter.'
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'Airalo serves two overlapping customer universes. The first is a self-serve travel customer base: leisure travelers, business travelers, digital nomads, and crew members who buy prepaid data packages trip by trip through the app or website. The second is a partner-managed base sold through Airalo Partners, where the buyers are enterprise admins, SMB owners, airlines, travel businesses, and telecom operators that want to distribute connectivity to employees, passengers, or subscribers. Public materials are explicit about the segmentation breadth: airline pages emphasize ancillary revenue and loyalty tie-ins; enterprise pages emphasize SSO, branch structures, and invoicing; SMB pages emphasize budget controls and team assignment; MNO/MVNO pages emphasize white-label roaming retention. That breadth is strategically attractive because it reduces dependence on a single user persona. The gap is that Airalo publicly names verticals and features far more readily than it names accounts,
    so segmentation breadth is well evidenced while segment-level revenue mix is still opaque.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU009
  - CU010
  - CU011
