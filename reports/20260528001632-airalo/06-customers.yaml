tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Self-serve leisure travelers
    - Buyer=user=payer; prepaid app or web purchaser
    - Single-country or regional trip connectivity without roaming
    - Consumer app and site for 200+ countries; 20M+ cumulative users claimed
    - Core volume driver for local/regional plans and app-store scale
    - No public split between one-time tourists and repeat travelers
  - - Digital nomads
    - Buyer=user=payer
    - Cross-border work connectivity and multi-country movement
    - App Store explicitly names digital nomads; independent reviewers describe repeat use across 40+ countries
    - Higher repeat potential and larger plans than one-off tourists
    - No disclosed cohort retention or ARPU by nomad segment
  - - Crew members
    - Buyer=user; employer may reimburse
    - Always-on travel connectivity for flight or maritime staff
    - App Store explicitly names crew members as target users
    - Repeat corridor usage and recurring top-up potential
    - No disclosed share of volume from aviation or maritime crews
  - - Enterprise travel teams
    - Buyer=travel admin / finance; users=employees; payer=company or employee card
    - Managed business travel connectivity with compliance and centralized billing
    - Enterprise and Business pages market SSO, branch structures, monthly invoices, and usage reporting
    - Can convert ad hoc travel spend into recurring account relationships
    - No named enterprise logos or contract sizes disclosed
  - - SMBs
    - Buyer=owner / admin; users=employees
    - Budget-controlled business travel for smaller teams
    - SMB page stresses usage tracking, limits, and low setup friction
    - Broadens account base below enterprise and may reduce concentration
    - No public active-account count by company size
  - - Airline / reseller / telecom partners
    - Buyer=partner admin; users=partner's passengers, customers, or subscribers
    - Embed eSIMs as ancillary revenue, loyalty perk, or roaming-retention product
    - Airlines, MNO/MVNO, white-label, API, and voucher flows documented on partner pages
    - B2B2C channel can scale distribution faster than direct app acquisition
    - No named airline, fintech, travel, or MNO accounts disclosed publicly
  notes: Mixes explicit official segmentation with inferred economic roles; null public account counts are genuine gaps, not omitted work.
