- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Enterprise travel admin workflow
    - Named enterprise accounts and contract sizes are undisclosed
    - Could support sticky recurring spend if admins standardize on Airalo; cannot size today
    - Request top 20 business accounts, seat counts, active employees, and renewal history
  - - Airline ancillary / loyalty integration
    - No named airline customers are public in retained sources
    - Airline wins could scale distribution quickly but concentration could rise if one partner dominates
    - Request airline logo list, passenger attach rates, and GMV share by airline
  - - MNO / MVNO roaming retention
    - No public telecom account list or volume mix
    - White-label and API channels can be sticky, but silent-roamer conversion economics are unproven
    - Request top partner list and subscriber activation rates by telecom client
  - - Reseller vouchers and Airmoney vouchers
    - Voucher flows add redemption friction if customers do not activate
    - Good for B2B2C distribution and rewards programs, but can inflate issued-not-activated volumes
    - Request issued vs redeemed voucher rates and time-to-activation by channel
  - - Business-mode payments and automated reporting
    - Public features show better admin UX, but no public logo evidence
    - Should improve expansion inside existing accounts if employees can self-purchase under policy controls
    - Request account-level monthly active admins, active employees, and spend expansion curves
  - - Consumer repeat purchase via loyalty and top-up
    - No public repeat-trip or top-up frequency disclosure
    - Could lift LTV materially if users return across trips; still unproven in public evidence
    - Request repeat purchase curves by first corridor and traveler type
  - - Activation / refund complaints and restrictive refund timing
    - Failed activations, delayed support, and Air Money credits can trigger churn and reputational drag
    - Customer-experience issues can undermine both direct repeat use and partner trust
    - Request destination-level activation success, refund cash-out rates, and support SLA performance
  notes: Expansion logic is visible in product mechanics, but partner concentration and repeat-purchase economics remain largely private.
