- id: expansion-motion-and-concentration-risk
  title: Expansion motion and concentration risk
  body: 'Airalo’s expansion motion is credible in product terms. Public pages describe a ladder from direct traveler purchases into top-ups, loyalty, business-mode payments, automated reporting, API integrations, white-label storefronts, reseller vouchers, and airline or telecom distribution. That should enable both account expansion inside existing business customers and broader B2B2C reach. The risk is that the public evidence stops before the critical concentration questions. Airalo says more than 5,000 partners trust the platform, but it does not disclose named accounts, top-customer revenue share, active-partner counts, or partner churn. On the consumer side, the biggest adverse signal is not weak demand but service failure at critical travel moments: Sikayetvar/Xolvie, Trustpilot, and review blogs repeatedly mention failed activations, refund friction, and slow support. The terms of use reinforce the complaint pattern by cutting off withdrawal rights once the eSIM is activated. Expansion
    therefore looks structurally plausible, but concentration and durability still require private evidence.'
