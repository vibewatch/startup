  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-partner-proof
    missingEvidence: Publicly named airline, travel, fintech, and enterprise customer logos with deployment dates, use cases, and current status.
    whyItMatters: The chapter can prove real traveler usage, but it cannot size concentration, validate logo quality, or distinguish pilots from scaled B2B accounts.
    diligencePath: Request a current top-customer / partner list with launch dates, product used, deployment geography, and annual GMV or revenue contribution.
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Repeat purchase curves, top-up frequency, churn, and any NRR / GRR equivalent for consumer and business segments.
    whyItMatters: Public proxies suggest repeat behavior, but they do not establish customer durability or lifetime value under stress.
    diligencePath: Request cohort tables by first purchase month, corridor, traveler type, and business-account vintage plus refund and support-contact rates.
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: active-user-denominator
    missingEvidence: A bridge from cumulative users and installs to active customers, active business accounts, and partner-driven volume.
    whyItMatters: Top-of-funnel scale is visible, but without active denominators the adoption story can overstate present customer quality.
    diligencePath: Request MAU, monthly transacting users, active accounts, and direct-vs-partner order mix for the last 12 months.
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-customer / top-partner revenue share, active-account counts, and renewal history by segment.
    whyItMatters: The 5,000+ partner claim is impressive, but the absence of concentration data leaves both upside and dependency risk under-specified.
    diligencePath: Request top-10 and top-50 customer concentration tables, plus partner churn and expansion by account cohort.
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: support-sla
    missingEvidence: Destination-level activation-success rates, cash-refund rates, and support-response SLAs.
    whyItMatters: Complaint surfaces show recurring pain points, but public review platforms cannot establish incidence rate or root-cause distribution.
    diligencePath: Request internal support dashboards split by country, carrier partner, device type, and refund outcome.
    relatedTableRefs:
    - TU004
    - TU005
