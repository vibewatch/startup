tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Airalo
  rows:
  - - Self-serve travel eSIM retail
    - Trip-based international mobile data packages bought in-app or on the web
    - Domestic postpaid service, voice-centric home plans, physical SIM replacement
    - Traveler buys, uses, and pays
    - Core consumer wedge and the clearest Airalo use case
  - - Managed business travel connectivity
    - Employee travel data budgets, centralized assignment, reimbursable travel connectivity
    - Full corporate mobility management or permanent employee phone plans
    - Travel admin / finance pays; employee uses
    - Core B2B wedge where procurement and controls matter
  - - Airline / travel-brand ancillary distribution
    - Connectivity sold or bundled at booking, check-in, loyalty, or arrival touchpoints
    - In-flight Wi-Fi, travel insurance, generic app marketing
    - Airline or travel platform buys integration; passenger often pays
    - Important first-touchpoint channel rather than direct telecom ownership
  - - MNO / MVNO roaming-retention programs
    - White-label or API travel eSIM packages sold to existing subscribers
    - Domestic subscriber ARPU, core SIM issuance, fixed broadband
    - Operator product/roaming team buys; subscriber pays
    - Lets Airalo address roaming spend indirectly through partners
  - - Broad eSIM technology market
    - Consumer electronics, connectivity services, automotive, industrial and IoT eSIM value
    - Non-travel spend is not directly monetized by Airalo
    - Mixed buyers across OEMs, operators, and enterprises
    - Useful adjacency lens but too broad for Airalo SAM
  - - Intra-EU roaming substitute
    - Domestic-rate roaming inside the EU under roam-like-home rules
    - Non-EU corridors still exposed to roaming pain
    - Home carrier contract holder pays domestic rate
    - Real substitute that compresses demand for third-party eSIMs on some routes
  notes: Included/excluded spend is defined from buyer workflow, not from the silicon-level eSIM stack. The final row is a substitute rather than a revenue pool, but it materially changes Airalo demand on EU corridors.
