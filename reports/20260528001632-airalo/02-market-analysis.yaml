- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and What Could Break the Thesis
  body: 'The core drivers are visible and multi-layered. Travel volumes are growing again: IATA reported March 2026 year-to-date RPK growth of 4.0%, with international traffic up 3.9%, and its long-term model still shows global air travel compounding through 2050 with Asia Pacific, Africa, and the Middle East as the fastest-growing regions. Device readiness is also improving as Apple and Google normalize eSIM workflows and Counterpoint expects more than 80% of smartphones to be eSIM or iSIM capable by 2030. Economics remain compelling: Juniper estimates a 35% per-GB saving for travel eSIMs versus roaming in 2024 and roughly 75% savings by 2029, while ecosystem partnerships with airlines, hotels, OTAs, and OEMs expand distribution. But the constraints are equally material. Counterpoint and Juniper both describe a market where low entry barriers, price wars, and declining revenue per gigabyte are compressing margins. MNOs are already countering with new roaming packs and their own travel eSIM
    apps, and Counterpoint still expects most travelers to buy roaming from home operators by 2030 because of trust and number retention. EU roam-like-home rules remove pain on some corridors, while enterprise adoption depends on SSO, compliance, and billing controls in addition to simple price savings.'
