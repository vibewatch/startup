callouts:
- calloutType: insight
  title: The cleanest public market lens is not the biggest one
  body: Broad eSIM TAMs help frame technical adjacency, but they overstate Airalo’s directly relevant opportunity because much of the value sits in connectivity services, M2M, and automotive use cases. Travel-specific user growth and corridor economics are more decision-useful than the largest headline TAM.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM039
  - CM040
- calloutType: risk
  title: Category growth does not guarantee reseller economics
  body: Travel eSIM adoption can expand while reseller economics deteriorate. Juniper’s declining revenue-per-GB data and Counterpoint’s warning on fragmentation, price wars, and MNO retaliation suggest Airalo must scale distribution and trust, not just rely on a widening traveler pool.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
  - CM041
- calloutType: assumption
  title: Partner channels matter more than generic traveler demand
  body: Airalo’s airline, enterprise, and operator pages imply that the first customer touchpoint is strategically important. If those partner-led channels grow faster than direct app installs, Airalo’s actual SAM will be shaped by workflow ownership and distribution leverage more than by the broad eSIM TAM headline.
  claimRefs:
  - CM002
  - CM025
  - CM027
  - CM028
  - CM032
  - CM038
