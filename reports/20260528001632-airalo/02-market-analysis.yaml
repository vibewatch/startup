  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Public split of Airalo users, GMV, or revenue across self-serve leisure, business, airline, and operator partner channels.
    whyItMatters: Without a channel mix, the market cannot be translated from headline travel-eSIM demand into Airalo's true SAM or SOM.
    diligencePath: Request internal GMV, active-user, and customer-count mix by channel and by region; reconcile with partner contract counts.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: repeat-usage-economics
    missingEvidence: Cohort retention, repeat purchase frequency, CAC, and gross margin by corridor or segment for travel-eSIM purchases.
    whyItMatters: Category growth can coexist with poor unit economics; repeat behavior and margin durability determine whether Airalo captures value or only volume.
    diligencePath: Request cohort tables, repeat-purchase curves, blended and fully loaded gross margin by corridor, and operator-pass-through economics.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A public travel-eSIM revenue dataset that separates travel connectivity from the broader eSIM, IoT, and connectivity-services stack.
    whyItMatters: The public TAM record mixes revenue, users, and units, making clean external benchmarking difficult and increasing the risk of valuation error.
    diligencePath: Build a management sizing model using Airalo internal bookings, corridor mix, and partner attach rates, then benchmark it against Juniper and Counterpoint travel-specific proxies.
