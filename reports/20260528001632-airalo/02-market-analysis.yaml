company:
  name: Airalo
chapter:
  number: 2
  title: Market Analysis
  summary: 'Airalo''s relevant market is not the entire eSIM stack but the narrower cross-border connectivity layer spanning self-serve travelers, business travel programs, airline/travel distribution, and operator white-label roaming alternatives. Public market evidence is directionally strong but numerically inconsistent: broad eSIM analyst estimates range from sub-$1B to nearly $12B, while travel-specific sources point to 40M travel eSIM users in 2024 growing to over 215M by 2028 and nearly 3x third-party download growth by 2030. The category has real tailwinds from travel demand, device readiness, and roaming savings, but adoption and margin durability remain constrained by low entry barriers, MNO retaliation, EU roam-like-home substitutes, and missing public data on Airalo''s channel mix and repeat economics.'
sections:
- id: market-boundary
  title: Market Boundary and Relevance
  body: 'Airalo''s directly relevant market is the cross-border connectivity layer that sits between mobile network infrastructure and traveler purchase decisions. The company sells travel eSIMs to individual travelers, but its partner surfaces show a wider boundary that also includes managed business travel, airline and travel-brand distribution, and MNO/MVNO white-label roaming retention. That makes the right market definition narrower than the generic eSIM industry and broader than a pure leisure-travel app category. Included spend is temporary international data access, whether bought directly by a traveler, billed to an employer, bundled into an airline journey, or resold by an operator trying to keep roaming revenue in-network. Excluded spend includes domestic postpaid plans, industrial IoT and automotive eSIM deployments, and other broad connectivity-services revenue that appears in analyst eSIM TAMs but does not map to Airalo''s buyer workflow. A further boundary constraint is geographic:
    the EU''s roam-like-home rules remove incremental roaming charges inside the bloc, meaning a meaningful subset of short-haul European trips already has a low-friction substitute for third-party travel eSIMs.'
