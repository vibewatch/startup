- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Airalo
  - Diligence ask
  rows:
  - - Travel demand recovery and long-term air traffic growth
    - Driver
    - Current + long-term
    - More cross-border trips create more moments where roaming pain can be monetized
    - Break Airalo demand by corridor and trip purpose to see where air-travel growth maps to purchases
  - - Rising eSIM-capable device penetration
    - Driver
    - Current + medium-term
    - Wider installed base reduces technical friction and expands reachable traveler pool
    - Request share of Airalo purchases from eSIM-only or dual-eSIM capable devices
  - - Material per-GB savings versus roaming
    - Driver
    - Current
    - Clear price delta supports traveler adoption and partner distribution economics
    - Test attach rates by corridor where roaming is most expensive
  - - Digital-first partnerships with airlines, OTAs, OEMs, and operators
    - Driver
    - Current + medium-term
    - Partnerships can move Airalo closer to the first customer touchpoint and lower CAC
    - Quantify partner-sourced GMV versus direct app GMV
  - - Low entry barriers and market fragmentation
    - Constraint
    - Current
    - More resellers and API enablers create price wars and weaker retention
    - Measure Airalo payback and churn against newer travel-eSIM brands
  - - MNO response and home-operator trust advantages
    - Constraint
    - Current + medium-term
    - Incumbents can blunt Airalo adoption with roaming packs, tourist eSIMs, and brand trust
    - Track conversion by corridor before and after major operator roaming-price changes
  - - EU roam-like-home and other corridor-specific substitutes
    - Constraint
    - Current
    - Some high-volume routes already have low-pain substitutes, reducing attach opportunity
    - Separate EU intra-bloc demand from non-EU travel demand in the model
  - - Enterprise compliance, billing, and identity requirements
    - Constraint
    - Current
    - B2B growth depends on procurement, SSO, and reporting maturity, not just package price
    - Ask for sales-cycle length, security reviews, and invoice adoption by customer segment
  notes: Rows mix market demand drivers with go-to-market constraints because Airalo participates through several channels rather than one single retail motion. Timing is qualitative and intended to frame diligence sequencing.
