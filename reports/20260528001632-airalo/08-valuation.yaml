tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  rows:
  - - Recommendation
    - TRACK — pursue only with full private-data diligence at or below disciplined entry terms
    - Public evidence makes the unicorn mark plausible, but not auditable enough for a buy call at face value
  - - Confidence
    - Medium
    - Funding, scale, and comparable data are real, but current revenue and margin remain undisclosed
  - - Risk rating
    - High
    - Category growth is strong, yet pricing pressure, support friction, and economic opacity can quickly compress the multiple
  - - Valuation stance
    - Fair to stretched on public evidence
    - ~6.7x trailing 2023 sales is roughly Airbnb-like, above Booking and Expedia, and very sensitive to missing 2024-2026 economics
  - - Decision implication
    - Require revenue bridge, margin waterfall, and cap-table terms before advancing
    - Without those files the downside case can be far wider than the headline mark suggests
  notes: Public evidence supports a watchlist posture rather than a decisive buy or avoid call because the key underwriting variables are still private.
