  evidenceGaps:
  - type: stale
    severity: material
    topic: current-revenue
    missingEvidence: Audited or board-approved 2024 and 2025 revenue, gross profit, and year-to-date 2026 run rate.
    whyItMatters: The best public revenue anchor is 2023, so valuation work still rests on a stale denominator at the current price.
    diligencePath: Request monthly revenue bridge from 2023 actuals through April 2026, split by consumer, partner, and business channels.
    relatedQuestionRefs:
    - QV005
    - QV030
  - type: private-evidence-only
    severity: material
    topic: preferences
    missingEvidence: Cap table by share class, liquidation preferences, anti-dilution rights, and any investor side letters from the 2025 round.
    whyItMatters: Without downside-protection terms it is impossible to know whether the unicorn mark is clean common-equity value or preference-heavy headline value.
    diligencePath: Request the latest cap table, financing documents, and a management memo summarizing liquidation stack and any participating features.
    relatedQuestionRefs:
    - QV021
    - QV030
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Realized gross margin after carrier settlements, refunds, payment costs, and support expenses by product family and geography.
    whyItMatters: A travel eSIM marketplace can look software-like on the surface but still have thin economics if carrier costs and service leakage absorb the gross profit pool.
    diligencePath: Request a margin waterfall for local, regional, global, unlimited, and business products, including top-up and refund rates.
    relatedQuestionRefs:
    - QV023
    - QV026
  - type: private-evidence-only
    severity: material
    topic: retention-enterprise-mix
    missingEvidence: Cohort repurchase rates, enterprise contract metrics, and the split between direct app sales, partner distribution, and business accounts.
    whyItMatters: The bull case depends on repeat behavior and higher-value channels rather than one-off tourist transactions alone.
    diligencePath: Request customer cohort tables, enterprise customer counts and ACV, partner GMV mix, and any net revenue retention proxy management uses internally.
    relatedQuestionRefs:
    - QV007
    - QV026
    - QV030
  - type: conflicting-data
    severity: minor
    topic: data-vendor-lag
    missingEvidence: A reconciled funding history across official releases and third-party databases.
    whyItMatters: Public trackers already lag disclosed funding totals, which lowers confidence in any outsourced valuation database without direct reconciliation.
    diligencePath: Create a source-of-truth financing timeline using signed closing docs and management-certified cap-table snapshots.
    relatedQuestionRefs:
    - QV021
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A fuller list of private eSIM and travel-connectivity transactions with revenue and margin context.
    whyItMatters: The comparable set necessarily leans on adjacent travel platforms because most direct private eSIM peers do not disclose enough economics to price cleanly.
    diligencePath: Ask management and banker materials for direct private comparable decks, secondary marks, and any recent strategic or sponsor term sheets.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV004
