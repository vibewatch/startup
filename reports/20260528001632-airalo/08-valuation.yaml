- id: recommendation-kill-triggers-and-diligence
  title: Recommendation, kill triggers, and final diligence asks
  body: 'The evidence supports a TRACK recommendation with medium confidence, high risk, and a fair-to-stretched valuation stance. That may sound cautious relative to a visibly scaled category leader, but it is intentionally price-sensitive. Public facts are good enough to avoid an automatic pass: Airalo has real scale, a large financing cushion, and a category still taking share from legacy roaming. They are not good enough to justify a buy recommendation at the unicorn price. The gap is not narrative quality; it is missing underwriting evidence. The public record still cannot answer what current revenue is, what contribution margin looks like after carrier costs and refunds, how repeat behavior compares with first-trip demand, or whether the latest round embeds ordinary or unusually protective investor terms. Those are not footnotes. They are the variables that determine whether the current price is merely full or actually fragile. The practical implication is simple. A buyer should proceed
    only on a diligence path that can verify topline progression beyond the stale 2023 base, show that economics stay healthy under heavier competition, and confirm that the cap table does not hide downside asymmetry. If those checks clear, the current valuation could still be workable. If they do not, the thesis should be broken quickly rather than rationalized.'
