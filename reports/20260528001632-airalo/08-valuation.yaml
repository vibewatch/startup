- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Airalo has real scale and category leadership'
    - 20M+ travelers, 200+ destinations, and first disclosed unicorn financing in the category
    - A revised view would follow if user growth no longer translated into revenue growth or repeat usage
  - - 'THESIS: The model can widen from consumer resale into business and bundled connectivity'
    - 2025 financing explicitly funded unlimited bundles, voice/text packages, and enterprise tools
    - Need proof that these products lift ARPU and margin rather than just adding support complexity
  - - 'THESIS: The current price is not obviously detached from travel-platform public comps'
    - Using the 2023 revenue anchor implies ~6.7x sales, close to Airbnb and below many venture software outliers
    - Would improve if 2024-2026 revenue disclosure proves the actual multiple is already lower
  - - 'ANTI-THESIS: Travel eSIM competition is intensifying fast'
    - Juniper-linked reporting says MNOs must launch their own offers in 2026 to retain roaming revenue
    - Would ease if Airalo shows stable pricing, take rate, and support cost despite operator retaliation
  - - 'ANTI-THESIS: Review-led friction can matter in a price-comparison category'
    - Competitor and review content cites strict refunds, limited unlimited coverage, and support concerns
    - Would ease if independent satisfaction evidence improves and refund leakage remains low
  - - 'ANTI-THESIS: The public denominator is stale'
    - The best public revenue anchor is still 2023, while funding and product claims are much newer
    - Would improve sharply if management opens a current revenue and margin data room
  notes: This table separates the parts of the case that are evidence-backed today from the parts that still need private diligence to move the recommendation.
