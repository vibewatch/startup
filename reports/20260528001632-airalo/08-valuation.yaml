- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers public travel marketplaces and adjacent private travel platforms with retained valuation or revenue evidence; direct private travel-eSIM comps remain under-disclosed.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Airalo
    - '>$1.0B valuation vs $150M 2023 revenue anchor'
    - ~6.7x trailing sales implied by public anchors
    - Direct company underwrite object with category-leading scale and 2025 financing support
    - Uses a stale public revenue denominator and unknown preference stack
  - - Airbnb
    - May 2026 market cap $78.4B; 2025 revenue $12.24B
    - ~6.4x sales
    - Shows what a scaled travel platform with strong consumer brand can command publicly
    - Far more mature, audited, and diversified than Airalo
  - - Booking Holdings
    - May 2026 market cap $130.46B; 2025 revenue $26.91B
    - ~4.8x sales
    - Useful public travel incumbent benchmark for a highly profitable marketplace
    - Much larger, more profitable, and less category-volatile
  - - Expedia Group
    - May 2026 market cap $27.19B; 2025 revenue $14.73B
    - ~1.8x sales
    - Provides lower-bound public travel multiple for a scaled but less premium platform
    - Different margin structure and lower growth profile
  - - TravelPerk
    - 2025 Series E at $2.7B valuation
    - Private valuation only; no clean current public multiple in retained sources
    - Shows private capital still paid up for scaled travel platforms in 2025
    - Current revenue and mix are not disclosed cleanly enough for a like-for-like multiple
  - - Klook
    - 2025 $100M round; unicorn status retained
    - Private valuation >$1B; profitability disclosed for 2023
    - Useful adjacent private travel-tech signal for investor appetite after travel recovery
    - No retained current-revenue figure, and model differs from connectivity marketplace economics
  notes: The comparable set mixes public travel marketplaces with adjacent private travel-tech names because most direct private eSIM peers do not disclose enough economics to price cleanly.
