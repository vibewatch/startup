- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current revenue bridge disappoints
    - 2025 or 2026 revenue lands materially below a ~$180M low end of reasonable base expectations
    - The public scale narrative would no longer support marketplace-premium pricing
    - Stop underwriting at the unicorn mark and reset the valuation toward bear-case levels
  - - Carrier competition compresses monetization
    - Management cannot show stable pricing or gross-profit dollars after new MNO travel-eSIM launches
    - The category-leader thesis shifts from scale advantage to commoditized resale exposure
    - Treat Airalo as a lower-multiple travel distributor rather than a premium connectivity platform
  - - Support and refund friction persists
    - Refund leakage or support burden rises despite the 2025 capital injection and product investment
    - Operating leverage would weaken and customer acquisition economics could deteriorate
    - Downgrade confidence and require evidence of operational remediation before re-engaging
  - - Round terms are investor-protective
    - Cap table reveals unusual liquidation preference or participation terms in the 2025 financing
    - Headline valuation would overstate common-equity value and narrow upside for new money
    - Recut entry price from common-equity economics, not the headline post-money mark
  - - Exit path remains too opaque
    - Management cannot show a credible strategic-sale or sponsor path within a reasonable holding period
    - The hold-return profile becomes highly dependent on a future funding round rather than cash generation or exit execution
    - Keep the name on track status rather than advancing to investment committee approval
  notes: Triggers mix public signals with private-diligence checks because the current recommendation is blocked mainly by economics and term-sheet opacity, not by lack of market demand.
  claimRefs:
  - CV016
  - CV026
  - CV037
  - CV041
  - CV044
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financials
    - Audited or board-approved 2024 and 2025 revenue, gross profit, and 2026 run-rate bridge
    - Without a current denominator the public valuation screen is too stale to support a buy call
    - Management finance pack plus monthly board deck
  - - Cap table and downside protection
    - Latest cap table, share classes, liquidation preferences, and any side letters from Series C
    - The unicorn headline is not enough if common-equity economics are materially worse than the post-money implies
    - Lead counsel plus finance ops
  - - Gross-margin durability
    - Margin waterfall after carrier settlements, payment fees, refunds, and support by product family
    - A capital-light resale model can still fail to earn premium multiples if variable costs consume gross profit
    - FP&A and partnerships teams
  - - Demand quality
    - Repeat purchase, cohort repurchase, geography mix, and enterprise / partner contribution
    - Scale is more valuable if it reflects recurring behavior instead of one-off travel purchases
    - Growth analytics and commercial operations
  - - Competitive resilience
    - Pricing response playbook against MNO travel-eSIM launches and unlimited-data competitors
    - The anti-thesis is mostly about commoditization and discounting rather than pure category demand
    - Commercial strategy lead
  - - Exit readiness
    - Strategic buyer map, sponsor interest, and evidence for any eventual public-market readiness
    - The current public record supports a strategic or sponsor exit more than a near-term IPO
    - CEO, board materials, and banker references
  notes: Every ask is tied directly to a decision-variable that could change the recommendation or the acceptable entry price.
