- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Multiple logic
  - Indicative value range
  - Probability signal
  - Main downside / upside trigger
  rows:
  - - Bear
    - ~$150M-$180M revenue base
    - 1.8x-3.0x sales, closer to Expedia-like travel-platform valuation under heavy price pressure
    - $270M-$540M
    - '~25%: plausible if MNO competition and support costs weaken economics'
    - Growth stalls, discounting rises, or diligence reveals thin post-carrier margins
  - - Base
    - ~$190M-$220M revenue base
    - 4.5x-6.0x sales, around Booking-to-Airbnb public travel multiples
    - $855M-$1.32B
    - '~50%: most consistent with scale proof plus continued but not explosive expansion'
    - Needs evidence that revenue kept compounding from the 2023 base without hidden preference overhang
  - - Bull
    - ~$230M-$280M revenue base
    - 6.0x-8.0x sales, reflecting marketplace premium plus successful new-product monetization
    - $1.38B-$2.24B
    - '~25%: requires strong revenue progression, healthy margins, and successful business / bundled products'
    - Enterprise mix, unlimited plans, and product ladder raise monetization faster than support costs
  notes: Ranges are indicative because current revenue is private; the scenarios deliberately anchor on a stale disclosed base and observed public-market travel multiples.
