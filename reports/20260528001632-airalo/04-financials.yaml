  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "financial-disclosure"
      missingEvidence: >
        Consolidated audited financial statements, or at minimum management P&L, balance sheet,
        and cash-flow statements for the operating group, are not publicly available from the
        reviewed sources.
      whyItMatters: >
        Without consolidated financial statements, the underwriting case relies on press coverage,
        app metrics, and pricing pages rather than audited revenue quality, margin, and cash usage.
      diligencePath: >
        Request FY2023-FY2025 audited statements or monthly management accounts, plus a group-wide
        legal-entity map tying operating entities to the cap table.
      relatedQuestionRefs:
        - QI017
        - QI022
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: "gross-margin"
      missingEvidence: >
        Realized gross margin by product line, carrier, and geography, including the waterfall
        from package price to carrier settlement, payment processing, support, and refunds.
      whyItMatters: >
        Airalo's biggest financial promise is that a digital travel eSIM marketplace can keep a
        structurally attractive margin versus roaming. That promise cannot be verified from public
        sources alone.
      diligencePath: >
        Request gross margin bridge by top 20 destinations and by local / regional / global /
        business products, plus the underlying supplier contract structure.
      relatedQuestionRefs:
        - QI014
        - QI018
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: "cac-payback"
      missingEvidence: >
        CAC, paid-versus-organic mix, payback period, and repeat purchase or renewal cohorts are
        not publicly disclosed.
      whyItMatters: >
        Organic-growth claims and strong app metrics are directionally positive, but they do not
        prove durable unit economics or scalable paid acquisition economics.
      diligencePath: >
        Request channel-level CAC, contribution margin, 3/6/12-month payback, and retention by
        traveler cohort, destination type, and acquisition source.
      relatedQuestionRefs:
        - QI006
        - QI019
        - QI020
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: "cash-burn-runway"
      missingEvidence: >
        Current cash balance, monthly burn, runway, and any carrier prepayment or working-capital
        commitments are not publicly disclosed.
      whyItMatters: >
        The 2025 Series C clearly reduced financing risk, but the size of the remaining runway is
        impossible to estimate responsibly without burn and balance-sheet data.
      diligencePath: >
        Request monthly cash balances, historical burn for the last 12 months, and management's
        base / bear / bull runway scenarios after the 2025 raise.
      relatedQuestionRefs:
        - QI017
        - QI028
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: "revenue-mix"
      missingEvidence: >
        Direct consumer GMV and revenue, partner or reseller revenue, enterprise contract revenue,
        and rev-share terms are not broken out publicly.
      whyItMatters: >
        Channel mix affects seasonality, concentration risk, gross margin, and how dependable the
        business is outside peak travel periods.
      diligencePath: >
        Request direct-versus-partner revenue split, enterprise ACV, partner concentration, and
        reseller rev-share schedules.
      relatedQuestionRefs:
        - QI001
        - QI021
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: "support-refunds"
      missingEvidence: >
        Refund rates, install failure rates, support ticket intensity, and carrier- or device-level
        service quality by destination are not disclosed publicly.
      whyItMatters: >
        Travel eSIM economics can look strong at list price but degrade quickly if a material share
        of customers require human support or refunds when activation fails.
      diligencePath: >
        Request support tickets per 1,000 orders, refund rate, install-failure rate, and root-cause
        analysis by device OS, carrier, and destination.
      relatedQuestionRefs:
        - QI023
        - QI024
      relatedTableRefs:
        - TI003
        - TI005
