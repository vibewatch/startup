figures:
  - id: FI001
    title: "Revenue Model Bridge: Public Demand to Airalo Net Revenue"
    type: flow
    layout: wide
    summary: >
      Qualitative bridge showing how publicly observable Airalo demand converts into net
      revenue. The company drives demand through a consumer storefront and partner channels,
      collects prepaid package revenue upfront, then absorbs carrier access costs plus support /
      refund leakage before realized gross profit. Public sources expose demand and list pricing,
      but not the internal net-revenue waterfall.
    approximationNotes: >
      Numeric anchors are limited to public scale signals (20M+ users, 200+ destinations,
      5,000+ partners). Nodes beyond those anchors are qualitative because Airalo does not
      publicly disclose package-level revenue, carrier settlement costs, or gross profit.
    data:
      nodes:
        - id: users
          label: "20M+ users / travelers"
          value: 20000000
          unit: users
        - id: destinations
          label: "200+ destinations and package catalog"
          value: 200
          unit: destinations
        - id: direct-sales
          label: "Direct app / web prepaid package sales"
        - id: partner-sales
          label: "5,000+ partner / business distribution paths"
          value: 5000
          unit: partners
        - id: carrier-access
          label: "Carrier access cost via wholesale or resale agreements"
        - id: support-refunds
          label: "Top-ups, renewals, support, and refund leakage"
        - id: realized-margin
          label: "Realized net revenue / gross profit (undisclosed)"
      edges:
        - from: users
          to: direct-sales
          label: "Consumer demand"
        - from: destinations
          to: direct-sales
          label: "Visible list pricing"
        - from: partner-sales
          to: direct-sales
          label: "B2B / B2B2C distribution"
        - from: direct-sales
          to: carrier-access
          label: "Prepaid cash funds network access"
        - from: direct-sales
          to: support-refunds
          label: "Activation, top-ups, retention, refunds"
        - from: carrier-access
          to: realized-margin
          label: "Net after supplier costs"
        - from: support-refunds
          to: realized-margin
          label: "Net after service leakage"
    claimRefs:
      - CI001
      - CI008
      - CI009
      - CI020
      - CI047

