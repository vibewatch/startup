  - id: cost-structure-and-margin-drivers
    title: Cost structure, gross margin drivers, and public unit-economics gaps
    body: >
      Airalo's cost structure looks structurally attractive in theory and stubbornly opaque in
      practice. Industry sources provide the mechanism: travel eSIM providers can price well
      below traditional roaming because they avoid physical SIM distribution, rely on digital
      acquisition and activation, and buy or aggregate connectivity through direct local
      partnerships and wholesale-style arrangements. TechCrunch adds an important Airalo-specific
      detail here: behind the scenes, the company combines direct wholesale capacity purchases
      with resold roaming plans already structured by carriers. That hybrid supply model can be
      margin-positive if Airalo captures demand carriers would otherwise lose, but it also means
      realized gross margin depends on contract terms by geography, carrier, and package type.
      Regulatory and industry benchmarks help bound the economics. Juniper says travel eSIMs can
      save customers 35% per GB versus roaming in 2024 and could save around 75% per GB by 2029;
      GSMA says travel eSIM is becoming a successful use case, with 28% of travel eSIM users
      already buying from global providers like Airalo. EU and ITU materials further show that
      wholesale roaming charges and inter-operator tariffs remain key cost drivers in the legacy
      roaming stack, supporting the case that Airalo's value proposition rests on bypassing or
      compressing those legacy markups. What is missing is the actual waterfall from package list
      price to carrier cost, support cost, refunds, and net contribution margin. Recent Google
      Play complaints and independent reviewer caveats are a reminder that support, installation
      failures, fair-use restrictions, and inconsistent local number availability can all leak
      margin even in a digital model.
    claimRefs:
      - CI020
      - CI021
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI042
      - CI044
      - CI045
    tableRefs:
      - TI005

  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy, financing dependency, and verdict
    body: >
      Public capital evidence is much clearer than public operating economics. Airalo's 2023
      Series B added $60 million and brought disclosed cumulative funding to $67.3 million,
      while TechCrunch placed that round at a $280 million post-money valuation. In July 2025,
      CVC and Forbes reported a much larger inflection: $220 million of fresh capital at a
      valuation above $1 billion, including $185 million from CVC and participation from Peak XV
      and Antler Elevate. On disclosed rounds alone, cumulative funding reaches at least
      $287.3 million. That materially reduces near-term financing dependency and suggests the
      company raised for acceleration, not rescue. The planned uses of funds also fit that view:
      better customer experience, new products, better value for money, and expanded enterprise
      and partner connectivity. Even so, the public evidence set still cannot answer the core
      capital questions an investor would need for underwriting. No reviewed source disclosed cash
      on hand, monthly burn, runway, realized gross margin, CAC, payback, or direct-versus-partner
      revenue mix. Public registry evidence is also incomplete rather than consolidated: a UK
      entity formerly named Airalo Esim Ltd has no filed accounts yet, its first accounts are not
      due until October 2026, and registry/legal records show entity-level changes rather than a
      group P&L. The financial verdict is therefore nuanced: Airalo appears to have real revenue,
      strong demand, and adequate growth capital, but it remains a private company whose margin
      path and cash efficiency cannot be underwritten from public evidence alone.
    claimRefs:
      - CI015
      - CI016
      - CI023
      - CI024
      - CI025
