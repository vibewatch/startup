        title: 身份、产品模式与可见规模
        blocks:
          - type: paragraph
            body: >-
              本报告保留的官方材料给出了一致的公司身份：Airalo 2019 年创立，用数字 eSIM 而不是实体 SIM 卡解决漫游摩擦，如今把自己定位成全球首个 eSIM
              商店或市场平台。产品形态已经不止一个面向游客的预付费数据 SKU。Airalo 覆盖 200+
              个国家和地区，提供本地、区域和全球套餐；当前应用商店页面强调即时激活、无漫游费，套餐可包含数据、通话和短信。公司也越来越把自己同时定义为消费者 App 和商业平台。Airalo Partners
              推广企业、经销商、API 和白标用例，并称 5,000 多家公司信任其平台。可见规模有意义，但仍主要来自公司自称：官方页面和 2025 年新闻材料引用 20M+ 用户，AppBrain 则显示截至 May
