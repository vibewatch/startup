      - number: '3.4'
        title: 品牌层护城河真实存在，但反向证据指向商品化风险
        blocks:
          - type: paragraph
            body: >-
              反向证据很直接：这个市场不再是早进入就能保证持久定价权。Juniper Research 称，旅行 eSIM 数据每 GB 平均收入从 2023 年的 $3.20 降至 2025 年的
              $2.78，因为更多供应商入场并压低价格以赢得或留住客户。Juniper
              进一步认为，利基供应商如果在原始数据之外打包旅行必需品或忠诚度式权益，就能跑赢更大玩家。这与保留来源集中可见的竞争行为高度对应：Jetpac 打包 SmartDelay 和基础应用连续可用，Roamless
              打包额度、通话和号码，Saily 叠加安全和商业工具，运营商套餐则保留原生电话号码和账单关系。Airalo 的规模仍然重要。它资本实力强于多数直接同行，合作伙伴分发更宽，也明显在投入无限套餐、语音 /
              短信包和产品刷新。但这些是在标准化生态里的防御动作，不是专有护城河的证明。因此，最合适的投资人表述是“快速拥挤品类中的中等耐久领导者”，而不是“赢者通吃的网络效应”。Airalo
              应该能在品牌和渠道深度上跑赢较小的 D2C App，但未来 12-24 个月的主要风险是毛利率压力：重度数据用户、复购旅客或合作伙伴渠道如果持续找到套餐经济性更好的、体验足够接近的替代品，利润率就会被挤压。
