    rows:
      - - Airalo 拥有品类领先的规模和品牌
        - Juniper 称，随着更多供应商进入并打价格战，旅行 eSIM 定价正在被压缩
        - 高
        - 20M+ 用户和独角兽融资，但 Juniper 报告每 GB 收入下降、竞争加剧
        - 在把规模视为可持续定价权之前，要求披露队列留存、CAC 和重复购买经济性
      - - 合作伙伴 / API 分发是一道可防守边界
        - 同业或运营商仍可复制渠道策略，或争夺同一批合作伙伴
        - 中
        - Airalo 披露 5,000+ 合作伙伴；大多数同业对 B2B 分发披露少得多
        - 要求按渠道披露合作伙伴来源预订、毛利率和续约率
      - - 低门槛定价赢得休闲旅客
        - 不限流量同业和高端运营商套餐可能抢走重度用户与高频旅行者
        - 高
        - Holafly 和 Maya 以不限流量领先；T-Mobile 和 Google Fi 把国际流量纳入本土套餐
        - 按旅行者类型拆分产品策略，不要假设一套套餐栈能覆盖所有人
      - - 产品宽度带来差异化
        - Roamless、Jetpac、Saily 等新进入者正在打包积分、语音、安全和类似休息室的权益
        - 中
        - 同业竞争越来越不只看单纯 GB 定价
        - 跟踪 Airalo 不限量、语音 / 短信和会员功能的附加率
      - - 现有应用信任度支撑复购
        - 评论和评分界面让支持故障非常显眼，也便于跨应用比较
        - 中
        - App Store 和 Trustpilot 形成透明的服务对比渠道
        - 索取支持 SLA、退款率和应用商店评论趋势数据
      - - 底层 eSIM 技术构成护城河
