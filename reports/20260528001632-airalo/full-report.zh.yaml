  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Airalo 销售的是数字漫游替代品，而不是实体连接硬件。它面向消费者的主张，是一个覆盖 200 多个国家和地区的预付费 eSIM 市场平台，提供本地、区域和全球套餐，并用 Discover+
              套餐在数据之上增加语音和短信。公司在法律文件中把自己描述为连接服务的聚合商和市场平台；这一点重要，因为客户关系、购买流程和安装体验由 Airalo 控制，底层网络层则来自第三方。同一套目录逻辑被延伸到相邻 B2B
              产品：Airalo for Business 服务托管员工出行，Partner Integrations 支持 API/SDK/plugin
              分发，经销商界面用于白标或品牌化转售。公开合作伙伴页面反复把产品家族锚定在同一个 20M+ 用户、200+ 目的地足迹上，这说明零售和合作伙伴渠道可能共用一套供给和订单管理底座。对尽调的实际含义是，Airalo
              有产品广度和分发杠杆，但它也继承了市场平台的协调风险：公司夹在旅客、企业、经销商、应用商店和本地移动运营商之间。
