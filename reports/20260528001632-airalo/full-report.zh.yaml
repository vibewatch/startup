  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相关性
        blocks:
          - type: paragraph
            body: >-
              Airalo 直接相关的市场，是夹在移动网络基础设施和旅行者购买决策之间的跨境连接层。公司向个人旅客销售旅行 eSIM，但合作伙伴页面显示边界更宽，还包括托管商务旅行、航空公司和旅行品牌分发，以及
              MNO/MVNO 的白标漫游留存。因此，合适的市场定义比泛 eSIM 行业更窄，又比纯休闲旅行 App
              类别更宽。纳入的支出是临时国际数据接入：可以由旅客直接购买、记入雇主账单、打包进航空旅程，也可以由试图把漫游收入留在自家网络内的运营商转售。排除项包括国内后付费套餐、工业 IoT 和汽车 eSIM
              部署，以及其他广义连接服务收入；这些收入会出现在分析师的 eSIM TAM 里，却不对应 Airalo 的买方工作流。还有一道地理边界：欧盟的 roam-like-home
              规则取消了区域内增量漫游费，意味着相当一部分欧洲短途旅行里，第三方旅行 eSIM 已经有了低摩擦替代方案。
