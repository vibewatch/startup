  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers public travel marketplaces and adjacent private travel platforms with retained valuation or revenue
        evidence; direct private travel-eSIM comps remain under-disclosed.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Airalo
        - '>$1.0B 估值，对照 2023 年 $150M 收入锚点'
        - 公开锚点隐含约 6.7x 往绩销售额
        - 直接投资测算对象，具备品类领先规模，并有 2025 年融资背书
        - 收入分母来自滞后的公开数据，优先权结构未知
      - - Airbnb
        - 2026 年 5 月市值 $78.4B；2025 年收入 $12.24B
        - ~6.4x 销售额
        - 显示成熟旅行平台凭强消费者品牌在公开市场可获得的定价
        - 比 Airalo 成熟得多，已审计且业务更多元
      - - Booking Holdings
        - 2026 年 5 月市值 $130.46B；2025 年收入 $26.91B
        - ~4.8x 销售额
        - 可作为高盈利旅行平台在位者的公开市场基准
        - 规模大得多、盈利能力更强，品类波动也更小
      - - Expedia Group
        - 2026 年 5 月市值 $27.19B；2025 年收入 $14.73B
        - ~1.8x 销售额
        - 为规模化但溢价较低的平台提供公开旅行公司倍数下限
        - 利润率结构不同，增长曲线也更低
      - - TravelPerk
        - 2025 年 Series E 轮估值 $2.7B
        - 仅有私有估值；已保留来源中没有清晰的当前公开倍数
        - 显示 2025 年私募资本仍愿意为规模化旅行平台支付高价
        - 当前收入和结构披露不足，无法做同口径倍数对比
      - - Klook
        - 2025 年 $100M 轮融资；仍保持独角兽状态
        - 私有估值 >$1B；已披露 2023 年盈利
        - 是旅行复苏后投资者风险偏好的相邻私营旅行科技信号
        - 没有保留的当前收入数据，且模式不同于连接服务市场的经济模型
    notes: 可比组混合了公开旅行市场平台和相邻私营旅行科技公司，因为多数直接的私营 eSIM 对手没有披露足够经济数据，难以清晰定价。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 投资假设失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 当前收入桥低于预期
        - 2025 或 2026 年收入落在合理基准预期低端（~$180M）之下且差距明显
        - 公开规模叙事将不再支撑平台溢价定价
        - 停止按独角兽估值测算，将估值重置到熊市情景水平
      - - 运营商竞争压缩变现
        - 新 MNO 旅行 eSIM 推出后，管理层无法证明定价或毛利美元额稳定
        - 品类领先者假设会从规模优势转向商品化转售风险
        - 将 Airalo 视为低倍数旅行分销商，而非高溢价连接平台
      - - 支持与退款摩擦持续
        - 即使有 2025 年资本注入和产品投入，退款漏损或支持负担仍上升
        - 经营杠杆会变弱，获客经济性可能恶化
        - 下调信心；再次推进前，要求运营修复证据
      - - 轮次条款偏保护投资人
        - 股权结构表显示 2025 年融资中存在异常清算优先权或参与分配条款
        - 名义估值会夸大普通股价值，并压缩新资金上行空间
        - 按普通股经济性重切入场价格，而不是按投后名义估值
      - - 退出路径仍过于不透明
        - 管理层无法在合理持有期内给出可信的战略出售或财务买方路径
        - 持有期回报画像将高度依赖未来融资轮，而不是现金生成或退出执行
        - 将项目维持在跟踪状态，而非推进到投委会批准
    notes: 触发项同时包含公开信号和私下尽调检查，因为当前建议主要被经济性和条款单不透明卡住，而不是市场需求不足。
    claimRefs:
      - CV016
      - CV026
      - CV037
      - CV041
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前财务数据
        - 经审计或董事会批准的 2024 和 2025 年收入、毛利，以及 2026 年运行率桥
        - 没有当前分母，公开估值筛查就太滞后，无法支撑买入建议
        - 管理层财务包和月度董事会材料
      - - 股权结构与下行保护
        - 最新股权结构表、股份类别、清算优先权，以及 Series C 以来任何附函
        - 如果普通股经济性明显差于投后估值暗示，独角兽标题本身不够
        - 首席法律顾问和财务运营
      - - 毛利率韧性
        - 按产品家族拆分的毛利率瀑布，覆盖运营商结算、支付费用、退款和支持成本
        - 即使是轻资产转售模式，只要可变成本吃掉毛利，也拿不到高溢价倍数
        - FP&A 和合作伙伴团队
      - - 需求质量
        - 复购、队列复购、地域结构，以及企业 / 伙伴贡献
        - 如果规模来自复发行为，而不是一次性旅行购买，价值更高
        - 增长分析和商业运营
      - - 竞争韧性
        - 应对 MNO 旅行 eSIM 上线和无限流量对手的定价响应手册
        - 反向假设主要关乎商品化和折扣，而不是纯品类需求
        - 商业策略负责人
      - - 退出准备度
        - 战略买家地图、财务买方兴趣，以及任何未来公开市场准备度的证据
        - 当前公开记录更支持战略或财务买方退出，而不是近期 IPO
        - CEO、董事会材料和投行参考
    notes: 每个问题都直接绑定一个决策变量；这些变量可能改变建议或可接受入场价格。
    claimRefs:
      - CV026
      - CV033
      - CV037
      - CV042
      - CV043
      - CV045
