              Airalo 的融资历史已经足够清楚，可以锚定报告后文。官方和独立资料支持这些轮次：2019 年 $1.9M 种子轮；2021 年由 Rakuten Ventures 领投的 $5.4M Series
              A；2023 年由 e& capital 领投的 $60M Series B；以及 July 2025 由 CVC 领投、估值超过 $1B 的 $220M Series
              C，后者让公司成为该赛道首个独角兽。2025 年新闻资料包称 Airalo 已融资超过 $287M，按已披露轮次计算约为
              $287.3M。投资人组合重要，因为它不只是普通风险资本：投资方组合里有私募股权、VC，以及 e&、Rakuten、Singtel Innov8、Orange Ventures、KPN Ventures 和
              Telefónica’s Wayra 等战略电信投资方。这种组合符合 Airalo 的产品逻辑：公司既依赖运营商关系、App
              分发和企业渠道，也依赖纯消费者品牌。因此，公开融资证据在轮次规模、估值和领投方上很强，但在准确持股比例、董事会权利、清算优先权和老股交易上仍弱。
