  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与公开牵引力
        blocks:
          - type: paragraph
            body: >
              Airalo 通过异常透明的公开货架变现全球连接，但没有公开财务报表。公司在 200 多个目的地销售本地、区域和全球 eSIM
              套餐，国家和区域产品页展示标价，官网、帮助中心和应用商店页面说明套餐机制。公开定价显示，消费者产品本质上是预付费：旅客选择目的地，为固定数据额度和有效期窗口预付费，安装
              eSIM，之后通常可以充值或续订。这在财务上重要，因为它意味着现金在服务激活前或激活时收取，而不是通过传统后付费漫游账单回款。公开标价也显示出清晰的商品陈列逻辑：美国或日本的国家套餐最低 $4 可买 1GB/3
              天，亚洲区域套餐 $4 起，欧洲区域套餐 $5 起，Airalo 全球 Discover 产品 $8.50 起。公司还销售更高价值产品，例如带通话和短信的 Discover+
              套餐、无限数据选项和更长时长套餐。围绕这一价格架构的公开牵引力有意义：Airalo 称其在 200-plus 个目的地服务超过 20 million 用户；Apple、Google Play 和 AppBrain
              则用 95K 个 iOS 评分、162K 条 Google Play 评论、10M+ Play 下载量，以及 AppBrain 估计的 12M Android 下载量，交叉印证大规模 App
              采用。这些是强公开需求信号，但不能替代已披露的已实现收入、收入确认政策、复购率，或扣除运营商结算和退款后的抽成率。
