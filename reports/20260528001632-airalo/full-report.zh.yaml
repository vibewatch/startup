  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 仅用公开可支撑证据，把 Airalo 剩余风险按发生可能性和影响摆位。
    data:
      columns:
        - 严重影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: 退款 / 支持纠纷和激活摩擦
            - tone: negative
              label: 供应商依赖和 EU 替代压力
            - tone: neutral
              label: 公开评论可见度 / 声誉波动
        - label: 中等可能性
          values:
            - tone: negative
              label: 电信 / 牌照不透明，可能在后期尽调爆雷
            - tone: negative
              label: 安全 / 隐私事件或处理方故障
            - tone: neutral
              label: 创始团队梯队或治理滑坡
        - label: 低可能性
          values:
            - tone: negative
              label: 核心市场发生重大执法事件
            - tone: negative
              label: 支撑估值的经济性明显低于预期
            - tone: neutral
              label: 信任中心控制弱于企业买方要求
    claimRefs:
      - CR005
      - CR007
      - CR011
      - CR016
      - CR019
      - CR031
      - CR032
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: Airalo 已观察风险如何传导到服务信任、利润率、增长和估值。
    data:
      nodes:
        - id: n1
          label: 退款 / 消费者法摩擦
          description: 与激活绑定的撤回限制，以及投诉密集的挽回流程
        - id: n2
          label: 隐私 / eKYC 合规负担
          description: 生物识别、数据传输和监管风险面
        - id: n3
          label: 供应商 / 平台依赖
          description: 运营商、应用商店、Apple / OS 流程、处理方
        - id: n4
          label: 服务质量投诉
          description: 激活失败、加购问题、支持延迟
        - id: n5
          label: 留存 / 转化压力
          description: 信任下降，复购或企业成交更难
        - id: n6
          label: 利润率压缩
          description: 退款成本、支持成本和竞争性价格压力
        - id: n7
          label: 增长 / 估值不及预期
          description: 独角兽预期撞上更薄的经济性
        - id: n8
          label: 投资逻辑破裂
          description: 公开信号或私有 KPI 推翻投资承保依据
      edges:
