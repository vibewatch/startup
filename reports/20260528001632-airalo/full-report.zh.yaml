  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和入场纪律
        blocks:
          - type: paragraph
            body: >-
              Airalo 进入估值分析时，带着一个异常强的公开事实，也带着一个异常重要的缺口。强事实是，公司披露了 2025 年一轮 $220 million 融资，估值超过 $1 billion，其中 CVC 出资
              $185 million，原有投资财团仍继续参与。这不是传闻或数据库标记；公司、投资方和独立报道都能支撑。缺口是，最好的公开收入锚点仍是 Forbes 引用的 2023 年 $150 million
              收入，而已审阅来源仍未披露当前收入、毛利率或优先权条款。这个组合很关键。如果 2024 和 2025 年收入较 2023
              年基数显著放大，独角兽价格可能已经接近公开旅行平台倍数。如果增长放慢，或经济性比产品故事更薄，同一个头条价格就难以自圆其说。因此，正确姿态是价格纪律，而不是条件反射式怀疑：公开证据足以说明该轮融资并非明显荒唐，但不足以在没有数据室的情况下支撑当前估值。入场纪律应先盯住三个问题：当前收入和毛利到底是多少，2025
              年融资是否使用标准下行保护，以及除一次性游客需求外，有多少复购或企业行为支撑收入。
