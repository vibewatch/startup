            body: >-
              由于当前收入未披露，情景分析必须把假设和证据讲清楚。已披露的收入锚点是 2023 年 $150 million；已披露的规模锚点是到 2025 年 20 million 旅行者；公开可比锚点则是 2026 年 5
              月 Expedia 约 1.8x 销售额、Booking 4.8x、Airbnb 6.4x。这些锚点让我们可以框出估值区间，而无需假装知道精确的 2026 年收入。悲观情景下，Airalo
              是一个好产品，但处在商品化市场，运营商反击和比价行为把业务压向更低的旅行平台倍数，收入也只温和增长。基准情景下，Airalo 从 2023
              年基数继续扩张，理应拿到中个位数销售倍数，落点接近当前估值。乐观情景下，公司把企业分销、无限流量包和更高价值产品做成更耐久的市场平台溢价。退出含义和倍数同样重要。公开证据更支持战略出售或赞助方支持的交易，而不是近期
              IPO，因为 Airalo 不按季度披露收入，没有经审计的公开报告节奏，并且在最重要的经济问题上仍依赖私人公司不透明性。这不会打破投资案例，但会限制当前价格下可信的回报测算类型。
