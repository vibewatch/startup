      - number: '2.2'
        title: 规模测算口径与相互矛盾的公开估计
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据很多，但内部并不一致；这会影响估值。Grand View Research 描述的是广义全球 eSIM 市场，2025 年价值 USD 11.87 billion；Fortune Business
              Insights 把该类别 2026 年规模放在 USD 2.12 billion；Business Research Insights 则只给出 USD 0.82 billion。Mordor
              又换了一个口径，衡量嵌入式 SIM 出货量而非收入，并预测 2026 年为 0.65 billion 部。这些数字在方向上都有用，但不能混成一个标准总可用市场（TAM），因为它们混合了收入和出货量方法，还包含
              M2M、汽车和其他远离 Airalo 直接旅行切口的用例。更贴近旅行的信号更相关：Juniper 预计旅行 eSIM 用户将从 2024 年的 40 million 增至 2028 年超过 215
              million，Counterpoint 预计第三方旅行 eSIM 下载量将在 2025 至 2030 年间接近增长三倍。Airalo 自身披露的 20 million 以上用户和 5,000
              多家合作伙伴，确认了品类牵引力；但公开数据仍不足以支持一个干净的 Airalo 可获取市场（SOM），因为渠道结构、复购率和分层经济性都未披露。
