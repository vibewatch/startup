      - number: '3.3'
        title: 分发权力偏向运营商和合作伙伴，用户切换摩擦仍低
        blocks:
          - type: paragraph
            body: >-
              相比初创同行，Airalo 最强的结构性优势不是隐藏技术，而是分发。公司合作伙伴网站宣传 5,000+ 个商业关系，横跨企业、经销商、白标、API
              和兑换券项目；这比多数直接同行网站上可见的公开获客足迹宽得多。对投资人来说，这比一次性促销价更重要，因为合作伙伴渠道可以降低获客成本，并把 Airalo 嵌入其他旅行或金融科技触点。尽管如此，旅行 eSIM
              App 之间的消费者层面切换成本很低。Airalo 自己告诉用户，一台设备可以存多张 eSIM，可以数字充值，也可以在路上切换套餐。GSMA 的标准化材料进一步说明，底层 eSIM
              栈是行业标准，不是某个供应商拥有的专有系统。这意味着旅客上次用了 Airalo，下次如果促销、权益或支持体验更好，很容易测试 Nomad、Jetpac 或 Roamless。运营商替代品让图景更复杂。对
              AT&T、T-Mobile、Verizon 或 Google Fi 客户来说，漫游沿用现有号码和现有账单，省掉了所有旅行 eSIM 专家仍然需要的额外 App 入门步骤。因此，Airalo
              受益于强漏斗顶端触达和合作伙伴可选性，但复购耐久性仍取决于支持质量、定价纪律和套餐价值广度，而不是硬技术锁定效应。
