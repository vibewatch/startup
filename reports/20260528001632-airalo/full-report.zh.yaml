      - number: '5.5'
        title: 差异化、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 最可防守的产品差异点不是专有无线网络，而是一层编排能力，横跨消费者旅行购买、企业管理、白标转售和开发者驱动分发。很少有旅行 eSIM 品牌一次性公开所有这些界面；Airalo 又用公开 SDK、正式
              REST API、安装指引交付选项、充值、合作伙伴提醒和大型移动分发渠道强化了这种广度。产品成熟度在核心目录、安装和合作伙伴下单工作流上最强。主要风险是结构性的。eSIM 功能仍取决于 OEM
              硬件决策、运营商解锁状态、各国具体机型变体，以及 Airalo 不能完全控制的本地网络行为。Airalo
              也没有在审阅界面上公开状态页、正常运行时间目标、具名运营商矩阵或具名基础设施供应商，使事前承销可靠性变得困难。可见的 2026 年发布证据主要是交付证据——当前 App
              版本、当前合作伙伴能力和当前自动化功能——而不是带日期的前瞻路线图承诺。因此，投资人应把 Airalo 视为成熟的分发和编排型产品，但供应商不透明和服务水平尽调缺口仍未消失。
