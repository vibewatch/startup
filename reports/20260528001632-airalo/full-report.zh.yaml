      - number: '3.2'
        title: 价格和功能切口碎片化，并未由单一赢家主导
        blocks:
          - type: paragraph
            body: >-
              Airalo 最清晰的产品优势，是低端价格带的灵活性：它销售本地、区域和全球套餐，支持充值，1GB 入门价从 $4.50
              起。这很适合轻度或中度旅客，他们想要一条简单的备用数据线，又不愿过度购买。但直接同行如今比几年前更激进地切分市场。Holafly 和 Maya
              都把主张放在无限用量上，对不喜欢盯着有限流量包的远程工作者或重度流媒体旅客更有吸引力。Nomad 用走廊特定低价和同一 eSIM 加购竞争；Roamless 则用不过期额度消除剩余流量浪费。Jetpac
              值得注意，因为它不只靠价格：它叠加语音包、基础应用常久在线、SmartDelay 贵宾厅权益和不受限热点使用。Ubigi 和 GigSky 不总是最便宜，但对多设备或复杂行程旅客的诉求更强。TechRadar 的
              2026 年独立评测证据很重要，因为它把多个供应商列为可行推荐，而不是边缘选项。这与一个 App 独占决策集合的市场正相反。Airalo 的回应，是用 Discover+
