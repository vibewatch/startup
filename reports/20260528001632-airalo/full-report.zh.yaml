  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 规模证明、品类顺风、竞争、披露不透明与价格纪律如何共同把结论推向「观察」。
    data:
      nodes:
        - id: scale
          label: 规模证明：20M+ 旅行者、200+ 目的地、独角兽融资
          type: input
        - id: market
          label: 市场顺风：2025 年旅行 eSIM 收入增长 85%
          type: input
        - id: product
          label: 上行选项：企业业务、无限流量、语音 / 短信套餐
          type: input
        - id: competition
          label: 压力：MNO 下场、无限流量对手、客服摩擦
          type: input
        - id: opacity
          label: 不透明：当前收入、利润率与优先权条款仍未披露
          type: input
        - id: valuation
          label: 价格筛查：以 2023 年历史销售额计约 6.7x，接近 Airbnb 式公开市场倍数
          type: process
        - id: recommendation
          label: 观察：中等信心、高风险
          type: output
        - id: upgrade
          label: 只有尽调资料库证明当前收入延续增长且条款干净，才上调
          type: output
      edges:
        - from: scale
          to: valuation
        - from: market
          to: valuation
        - from: product
          to: valuation
        - from: competition
          to: valuation
        - from: opacity
          to: valuation
        - from: valuation
          to: recommendation
        - from: recommendation
          to: upgrade
    approximationNotes: 流程图呈现决策逻辑，不是确定性模型；重点标出当前价格下会改变建议的具体因素。
    claimRefs:
      - CV016
      - CV020
      - CV026
      - CV040
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以公开披露的 2023 年收入 $150 million 为锚，测算不同销售额倍数下 Airalo 的企业价值。
    data:
      items:
        - label: 2.0x 销售额
          value: 300
          note: 旅行分销商 / 严苛悲观情景
        - label: 3.0x 销售额
          value: 450
          note: 旅行平台低端情景
        - label: 4.8x 销售额
          value: 720
          note: Booking 式公开市场倍数
        - label: 6.4x 销售额
          value: 960
          note: Airbnb 式公开市场倍数
        - label: 6.7x 销售额
          value: 1005
          note: 按 2023 年收入粗算的 Airalo 当前隐含倍数
        - label: 8.0x 销售额
          value: 1200
          note: 偏乐观的私募市场溢价
    approximationNotes: 图中刻意把收入固定在已过时但公开的 2023 年锚点上，用来拆分争议：有多少来自分母不确定，有多少来自倍数选择。
    claimRefs:
      - CV005
      - CV006
      - CV017
      - CV018
      - CV020
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 用明确的收入假设和公开可比公司倍数，搭出悲观、基准、乐观三档估值区间。
    data:
      items:
        - label: 悲观情景
          low: 270
          mid: 405
          high: 540
          note: $150M-$180M 收入基数，1.8x-3.0x 销售额倍数
        - label: 基准情景
          low: 855
          mid: 1087.5
          high: 1320
          note: $190M-$220M 收入基数，4.5x-6.0x 销售额倍数
        - label: 乐观情景
          low: 1380
          mid: 1810
          high: 2240
          note: $230M-$280M 收入基数，6.0x-8.0x 销售额倍数
    approximationNotes: 区间受证据约束，但仍高度依赖假设；公开记录没有披露 2024-2026 年实际收入或利润率。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 从市场、验证、护城河、经济性可见度、融资、退出路径和证据质量几个维度，对 Airalo 机会做投委会式评分。
    data:
      items:
        - label: 市场增长
          value: 4
          note: 旅行 eSIM 需求增长很快，仍在从漫游业务拿份额
        - label: 规模证明
          value: 4.5
          note: 20M+ 旅行者与广泛目的地覆盖已具备分量
        - label: 产品 / 渠道扩张
          value: 4
          note: 企业工具和打包套餐可能拓宽变现面
        - label: 竞争耐久性
          value: 2.5
          note: MNO 反击和激进替代方案压住护城河信心
        - label: 经济性可见度
          value: 1.5
          note: 当前收入、利润率与优先股堆叠仍未披露
        - label: 退出准备度
          value: 2.5
          note: 战略买家或财务投资人接盘，比近期 IPO 更可信
        - label: 估值纪律
          value: 3
          note: 价格能过初筛，但需要更严尽调或进场安全垫
    approximationNotes: 评分只是方向性判断辅助，不是机械模型；低分反映披露缺口，不等于否认其真实的品类领先地位。
    claimRefs:
      - CV016
      - CV025
      - CV026
      - CV031
      - CV037
      - CV041
      - CV042
