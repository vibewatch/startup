companyProfile:
  summary: >-
    Airalo 是一家 2019 年创立的旅行 eSIM 市场平台，向跨境旅行者销售本地、区域和全球连接套餐，也越来越多地服务企业和分销合作伙伴。官方与独立资料都显示，它已经从消费者 App 延展为更宽的连接平台，覆盖 Airalo
    Partners、经销和白标工具、API 以及企业账户管理能力。公开牵引力不弱：Airalo 称其覆盖 200 多个目的地、服务 20 million 以上用户、拥有 5,000 多家合作企业，并在 July 2025 以超过 $1
    billion 的估值完成 $220 million Series C。核心承销问题不是公司有没有规模，而是当前收入、利润率、复购行为、合作伙伴经济性和投资人条款，是否足以支撑在独角兽估值上激进入场。
