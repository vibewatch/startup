  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和消费者保护风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 的法律面比「简单旅行者产品」的叙事更复杂。公司自己的条款把 Airalo
              描述为通信连接服务的聚合器和市场，而不是单一网络运营商；这意味着业务同时承接自身合同层和底层供应商栈带来的消费者权利、隐私和电信合规暴露。公开法律风险中最尖锐的问题，不是某一起已确认的头条诉讼，而是三件事叠加：严格的激活后退款规则、投诉密集的客服界面，以及对各市场运营商或牌照责任如何划分披露有限。Airalo
              2026 年 3 月隐私政策也扩大了监管边界，承认可能处理生物识别和 eKYC 数据、进行国际传输，并面临多条监管路径。Airalo
              确实有可见的缓释界面——法律中心、隐私政策、信任中心和企业合规声明——但保留下来的公开记录仍未给出逐司法辖区的运营商、牌照或批准地图。因此，法律尽调的重点不是规则是否存在，而是管理层能否在监管机构、合作伙伴或消费者投诉把问题推到台前之前，逐市场拿出合规文件。
