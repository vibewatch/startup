            body: >-
              Airalo 的正向案例很直接，也有证据支撑。到 2025 年，公司披露已覆盖 200+ 个目的地的 20 million+ 旅行者；公司和投资者都把模型描述为数字化分销、低
              CAC，并且对商务用户和休闲旅行者都越来越相关。Juniper 和 GSMA 相关证据也支持一个有真实顺风的品类：旅行 eSIM 收入快速增长，2025 年投资资金仍然充足，更多运营商开始把旅行 eSIM
              视为核心的漫游防御产品，而不是边缘附加项。反向逻辑同样真实。Juniper 的同一报道说，运营商必须在 2026
              年推出自有产品，才能阻止漫游收入流向第三方；这意味着品类增长也会吸引激进供给。竞品评测和替代方案也强化了这一点：Airalo 胜在覆盖广和便利，但用户可以把它同无限流量对手、本地 SIM
              和更便宜的区域方案比较；严格退款或客服摩擦也会迅速改变购买决策。从可比筛选看，Airalo 并没有「独角兽等于泡沫」这种简单说法暗示得那么极端。用 2023 年收入锚点测算，Airalo 大致落在类似
              Airbnb 的公开收入倍数附近，高于 Booking 或 Expedia。2025 年私人旅行科技融资也仍可获得，但直接的私人 eSIM
              可比公司很少，因此可比组必须混合旅行市场平台和相邻私人平台，并明确写出这个限制。
