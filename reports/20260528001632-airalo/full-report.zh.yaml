  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动
      - 集中度 / 耐久性风险
      - 影响
      - 尽调路径
    rows:
      - - 企业差旅管理工作流
        - 具名企业账户和合同规模未披露
        - 如果管理员把 Airalo 标准化为默认工具，可能撑起粘性的经常性支出；目前无法量化
        - 索取前 20 大商务账户、席位数、活跃员工数和续约历史
      - - 航司辅营 / 忠诚度集成
        - 留存资料中没有公开具名航司客户
        - 拿下航司可快速放大分销，但若单一伙伴主导，集中度也会上升
        - 索取航司客户标识清单、乘客挂载率和按航司拆分的 GMV 占比
      - - MNO / MVNO 漫游留存
        - 没有公开电信账户清单或量级结构
        - 白标和 API 渠道可能有粘性，但静默漫游用户转化的经济性尚未验证
        - 索取头部合作伙伴清单，并按电信客户拆分订阅者激活率
      - - 分销商券码和 Airmoney 券
        - 如果客户不激活，券码流程会增加核销摩擦
        - 适合 B2B2C 分销和奖励计划，但可能抬高已发放未激活量
        - 按渠道索取发放与核销券码比例、激活所需时间
      - - 商务模式支付和自动化报告
        - 公开功能显示管理员 UX 更好，但没有公开客户标识证据
        - 如果员工能在政策控制下自行购买，应能提升存量账户扩张
        - 索取账户级月活管理员、活跃员工数和支出扩张曲线
