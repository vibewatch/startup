  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Airalo 服务两个彼此重叠的客户群。第一类是自助式旅行客户：休闲旅客、商务旅客、数字游民和机组人员，他们通过 App 或网站按行程购买预付费数据套餐。第二类是通过 Airalo Partners
              销售、由合作伙伴管理的客户群；买方包括企业管理员、SMB 业主、航空公司、旅行企业和电信运营商，他们希望向员工、乘客或订户分发连接。公开材料明确展示分层广度：航空公司页面强调辅营收入和忠诚度绑定；企业页面强调
              SSO、分支结构和开票；SMB 页面强调预算控制和团队分配；MNO/MVNO 页面强调白标漫游留存。这种广度在战略上有吸引力，因为它降低了对单一用户画像的依赖。缺口在于，Airalo
              公开点名垂直行业和功能远比点名具体客户更容易，因此分层广度证据充分，分层收入结构仍不透明。
