      - number: '2.3'
        title: 购买者、使用者与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Airalo
              的市场分层，与其说按地理划分，不如说按谁控制购买时刻划分。自助式休闲旅行中，购买者、使用者和付款方往往合并成一个人：他在出发前或旅行中想要便宜的数字漫游替代品。托管商务旅行中，使用者是出差员工，但购买者和付款方可能是差旅经理、财务控制人或
              IT 管理员，他们用集中分配、预付额度、后付发票和支出上限来管理。Airalo
              的航空公司和旅行分销产品把购买者转移到数字产品、辅营收入或忠诚度团队；终端用户仍是乘客，付款方可能是乘客，也可能是赞助品牌。MNO/MVNO
              产品又创造了另一套工作流：购买者是想保护漫游收入的漫游或产品团队，最终付款方仍是订户。这一点重要，因为每个分层的采用触发器不同：休闲用户看重旅行便利性，雇主看重政策和账单控制，航空公司看重辅营转化，运营商看重静默漫游用户变现。Airalo
              的企业级控制也说明，信任、合规和报告本身就是市场的一部分，不只是产品点缀。
