  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 哪些因素会改变判断
    rows:
      - - 投资逻辑：Airalo 已有真实规模和品类领导力
        - 20M+ 旅行者、200+ 个目的地，以及该品类首个披露的独角兽融资
        - 如果用户增长不再转化为收入增长或重复使用，就需要修正判断
      - - 投资逻辑：模型可从消费者转售扩展到商务和捆绑连接
        - 2025 年融资明确投向无限量捆绑、语音 / 短信套餐和企业工具
        - 需要证明这些产品抬升 ARPU 和利润率，而不是只增加支持复杂度
      - - 投资逻辑：当前价格并未明显脱离旅游平台公开可比公司
        - 以 2023 年收入为锚，隐含约 6.7x 销售倍数，接近 Airbnb，低于许多 VC 软件异常高估值案例
        - 如果 2024-2026 年收入披露证明实际倍数已经更低，判断会改善
      - - 反向逻辑：旅行 eSIM 竞争正在快速加剧
        - 与 Juniper 相关的报道称，MNO 必须在 2026 年推出自有产品以留住漫游收入
        - 如果 Airalo 在运营商反击下仍能保持定价、抽成率和支持成本稳定，担忧会缓和
      - - 反向逻辑：评论驱动的摩擦会影响价格比较品类
        - 竞品和评论内容提到退款严格、无限量覆盖有限和支持担忧
        - 如果独立满意度证据改善且退款流失保持低位，担忧会缓和
      - - 反向逻辑：公开分母已经陈旧
        - 最好的公开收入锚点仍停在 2023 年，而融资和产品主张新得多
        - 如果管理层开放当前收入和利润率数据室，判断会明显改善
    notes: 该表把今天已有证据支撑的部分，与仍需私有尽调才能推动建议变化的部分分开。
