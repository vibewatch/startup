      - number: '5.4'
        title: 信任、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              Airalo 的公开信任姿态分散在消费者法律页面和合作伙伴销售页面。隐私政策披露，公司广泛收集账户、联系方式、设备、位置、使用、通信、评论平台，以及部分 eKYC /
              合规数据，并明确说明会在全球存储，也会与参与网络连接、托管、支付和分发的提供商共享。合作伙伴页面加入更强的商业信任表述，声称符合 GDPR、SOC 2 Type II 和 PCI
              DSS，采用先进加密、定期审计并提供 SSO 功能。消费者帮助页面也显示了实际质量控制层：24/7 聊天支持、故障排查手册，以及自动更换 / 退款路径。可观察货架信号也很强——iOS 和 Android
              评分高、评论基数大，Android 下载量 10M+。但限制在于，法律条款仍排除对底层连接可用性和质量的保证；独立问题追踪器 /
              评测摘要也继续出现激活失败、登录错误、乡村覆盖差、退款摩擦和聊天机器人主导的支持体验。换句话说，Airalo 展示了流程成熟的证据，但公开证据尚未证明服务水平一致性。
