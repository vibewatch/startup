  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Airalo 的相关性
    rows:
      - - 自助式旅行 eSIM 零售
        - 在 app 或网页购买、按行程使用的国际移动数据包
        - 国内后付费服务、以语音为核心的本地套餐、实体 SIM 替换
        - 旅行者购买、使用并付款
        - 核心消费者切入点，也是最清晰的 Airalo 使用场景
      - - 托管式商务旅行通信连接
        - 员工差旅数据预算、集中分配、可报销旅行通信连接
        - 完整企业移动管理或长期员工电话套餐
        - 差旅管理 / 财务付款，员工使用
        - 核心 B2B 切入点，采购和控制机制在这里更重要
      - - 航空公司 / 旅行品牌附加销售分销
        - 在预订、值机、忠诚度或抵达触点销售或打包通信连接
        - 机上 Wi-Fi、旅行保险、泛 app 营销
        - 航空公司或旅行平台购买集成，乘客通常付款
        - 重要的首触点渠道，而非直接拥有电信资产
      - - MNO / MVNO 漫游留存项目
        - 向现有订户销售的白标或 API 旅行 eSIM 套餐
        - 国内订户 ARPU、核心 SIM 发放、固定宽带
        - 运营商产品 / 漫游团队购买，订户付款
        - 让 Airalo 借合作伙伴间接触达漫游支出
      - - 广义 eSIM 技术市场
        - 消费电子、通信连接服务、汽车、工业和 IoT eSIM 价值
        - 非旅行支出不能被 Airalo 直接货币化
        - OEM、运营商和企业等混合买方
        - 是有用的邻近视角，但对 Airalo SAM 来说过宽
      - - 欧盟内部漫游替代品
        - 在 roam-like-home 规则下，欧盟内部按国内费率漫游
        - 非欧盟线路仍有漫游痛点
        - 本国运营商合同持有人按国内费率付款
        - 真实替代品，会压缩部分线路对第三方 eSIM 的需求
    notes: 纳入 / 排除支出按买方工作流界定，而不是按硅片层面的 eSIM 技术栈。最后一行是替代品，不是收入池，但会实质改变欧盟线路上的 Airalo 需求。
