  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、既有运营商和替代品都在解决同一件旅行连接任务
        blocks:
          - type: paragraph
            body: >-
              Airalo 已经不再只竞争于“买一张旅行 SIM”的狭窄利基；到 2026 年，买方可以通过几类替代方案完成同一件旅行连接任务。直接同行包括
              Holafly、Nomad、GigSky、Jetpac、Ubigi、Roamless、Maya，以及 Saily 等更新的品牌 App。这些产品都销售即时数字连接，但切入点不同：Holafly 和 Maya
              主推无限用量，Nomad 和 Roamless 主推灵活经济性，Jetpac 增加语音和机场延误权益，GigSky 或 Ubigi 则强调可靠性和多设备覆盖。Airalo
              进入这组比较时，仍站在已披露领先位置：其自身材料和公司发布引用 20M+ 用户、200+
              目的地，以及比多数直接同行更宽的合作伙伴足迹。这很重要，因为许多竞争对手主页展示了有吸引力的功能，但规模化分发证据少得多。竞争集合也超出初创同行。Google Fi、AT&T、T-Mobile 和 Verizon
              的运营商原生漫游产品，让现有订户保留本国账单关系和电话号码；即使单次旅行经济性更弱，它们仍是有意义的替代品。结果是一个分层格局：Airalo 是旅行 eSIM
              专家中的规模领导者，但对重度数据旅客、追求低价者，或优先看重电信打包便利性的客户来说，它不是唯一可信选项。
