      - number: '2.4'
        title: 增长驱动、采用约束和可能打破投资逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              核心驱动因素清晰且多层。旅行量重新增长：IATA 报告 March 2026 年初至今 RPK 增长 4.0%，国际客运量增长 3.9%；其长期模型仍显示全球航空旅行将一路复合增长到 2050
              年，亚太、非洲和中东是增速最快的地区。设备准备度也在提升，Apple 和 Google 正让 eSIM 工作流常态化，Counterpoint 预计到 2030 年超过 80% 的智能手机将支持 eSIM 或
              iSIM。经济性仍有吸引力：Juniper 估计，2024 年旅行 eSIM 相比漫游可节省 35% 的每 GB 成本，到 2029 年大约可节省 75%；同时，与航空公司、酒店、OTA 和 OEM
              的生态合作正在扩大分发。但约束同样实质。Counterpoint 和 Juniper 都描述了一个低进入门槛、价格战和每 GB 收入下降正在挤压利润率的市场。MNO 已经用新的漫游包和自有旅行 eSIM App
              反击；Counterpoint 仍预计，到 2030 年，多数旅客会因为信任和保留号码，从归属运营商购买漫游。欧盟 roam-like-home 规则消除了部分走廊上的痛点，而企业采用除了简单省钱，还取决于
              SSO、合规和账单控制。
