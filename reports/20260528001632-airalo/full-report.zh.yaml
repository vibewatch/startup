      - number: '4.4'
        title: 资本充足性、融资依赖和结论
        blocks:
          - type: paragraph
            body: >
              公开资本证据远比公开经营经济性清楚。Airalo 的 2023 年 Series B 增加了 $60 million 融资，使已披露累计融资达到 $67.3 million；TechCrunch
              把该轮投后估值放在 $280 million。July 2025，CVC 和 Forbes 报道了一个更大的拐点：公司以超过 $1 billion 的估值获得 $220 million 新资本，其中包括 CVC
              的 $185 million，以及 Peak XV 和 Antler Elevate 参与。仅按已披露轮次，累计融资至少达到 $287.3
              million。这实质性降低了近期融资依赖，也说明公司融资是为了加速，不是救急。计划资金用途也符合这一判断：改善客户体验、推出新产品、提升性价比，并扩展企业和合作伙伴连接。不过，公开证据集仍无法回答投资人承销所需的核心资本问题。没有审阅来源披露手头现金、月度烧钱速度、现金跑道、实现毛利率、获客成本（CAC）、回本周期，或直接渠道与合作伙伴渠道的收入结构。公开注册资料也只是零散而非合并：一家曾名为
              Airalo Esim Ltd 的英国实体尚未提交账目，首份账目到 October 2026 才到期，注册 / 法律记录显示的是实体层面变化，而不是集团损益表（P&L）。因此，财务结论需要保留层次：Airalo
              看起来有真实收入、强需求和充足增长资本，但它仍是一家私营公司，仅凭公开证据无法承销其利润率路径和现金效率。
