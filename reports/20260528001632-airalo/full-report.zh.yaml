        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 的运营风险先从入门摩擦开始。公司自己的条款和帮助材料说得很清楚：客户需要未锁网、支持 eSIM、未 root 的设备；Apple
              也单独说明，运营商支持和激活路径会按国家和供应商变化。这意味着相当一部分失效模式发生在设备设置、本地运营商支持和旅行者预期的交界处，而不是某个完全由 Airalo
              控制的系统。公开投诉与这个风险模式方向一致：Sikayetvar、US-Reviews 和 Smart Customer
              都出现了激活失败、充值功能丢失、退款纠纷和服务补救差的案例。公开评论足迹已经足够大，即便总体评分仍算不错，这些问题也会带来昂贵的声誉成本。安全风险更难精确打分，因为保留下来的信任中心文本很浅；但隐私政策确认了跨境数据处理和可能的
              eKYC 处理，这意味着任何供应商、处理方或账户被攻破的事件，都会同时打击客户信任和合规姿态。
