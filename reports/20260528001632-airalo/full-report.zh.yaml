      - number: '5.2'
        title: 消费者工作流、安装与支持运营
        blocks:
          - type: paragraph
            body: >-
              可观察的零售工作流很简单，但运营上并不轻。用户在网站或 App 里选择目的地套餐、付款、打开 My eSIMs，然后按 App 内的安装和连接指引操作。公开帮助流程显示，真实运营模型依赖设备准备度：手机必须支持
              eSIM、必须已解锁网络，Airalo App 也可能无法在 root 或越狱设备上运行。在 iOS 和 Android 上，Airalo 在可用时支持从 App 直接安装，也支持二维码和手动 SM-DP+ /
              激活码路径。安装后，用户可能仍要修改 APN、调整数据漫游、手动选网、更改默认线路，或先切离另一张活跃 SIM，eSIM 才能使用。Airalo 已增加 Installed 与 In Use
              等明确运营状态，并在直接安装失败时开放自助补救流程，包括自动更换、自动退款和支持升级。这比纯结账型旅行 eSIM 货架更成熟，但也说明 Airalo
              必须承担大量围绕手机设置、目的地时点和网络附着行为的支持与边缘场景负担。
