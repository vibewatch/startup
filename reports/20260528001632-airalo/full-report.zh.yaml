            body: >-
              Airalo 的人员和财务风险主要来自不透明，而不是眼前的困境。公开证据在融资和品牌规模上很强——包括 2025 年一轮
              $220M、独角兽估值的融资，以及拥有大量下载和评分的消费者界面——但在真正决定下行韧性的数字上很弱。保留下来的公开来源没有披露经审计收入、毛利率、烧钱速度、现金跑道、退款准备金或留存。与此同时，Juniper
              2025 年的旅行 eSIM 研究显示，随着竞争加剧，每 GB 收入在下降；这意味着 Airalo 必须证明规模、分销和产品广度足以抵消品类商品化。组织层面也仍然公开地以创始人为中心。Craft 和 The
              Org 只能看到很薄的管理梯队，而 2025 年新闻资料包提到 50+ 个国家的 350+
              人团队，意味着支持、合规和企业执行存在很大的协同负担。董事会和所有权的公开可见度仍然有限，因此投资者需要在治理和单位经济披露不完整的情况下，承受相当高的执行要求。
