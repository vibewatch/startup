        - 阻断
      - - 获客成本（CAC）、渠道组合和回本周期
        - 无法验证自然流量规模是在支撑增长，还是掩盖获客成本上升
        - 索取付费 / 自然占比、按渠道拆分的获客成本（CAC），以及按队列拆分的回本周期
        - 自然增长说法、应用商店排名和大下载量
        - 重大
      - - 复购、充值和留存队列
