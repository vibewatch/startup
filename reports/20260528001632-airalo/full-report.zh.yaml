        title: 获客路径与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Airalo 不公布获客成本（CAC）、回本周期或渠道结构，因此承销任务只能从公开分发证据推断销售效率。最强公开信号是，增长看起来由自然消费者发现和合作伙伴主导分发共同驱动，而不是明显的付费需求生成。CVC
              明确把公司描述为一个高度可扩展的数字模型，主要通过自然渠道增长；TechCrunch 报道称，2023 年 Series B 前后每月下载量接近 1 million。应用商店和 AppBrain
              显示产品在旅行类别排名靠前，官方消费者网站强调 53 种语言支持和低摩擦安装流程。间接渠道上，Airalo 明显押注分发：2023 年 Series B 新闻稿和 TechCrunch 都把 Airalo
              Partners 定位为新业务线，当前合作伙伴网站称 5,000 多家公司在企业、航空、金融科技、旅行和电信用例中使用 Airalo Partners。这很重要，因为合作伙伴主导和 B2B2C
              销售可以降低获客成本、提高企业合同价值，并把 Airalo 变成航空公司、金融机构乃至 MNO/MVNO 合作伙伴的网络变现工具。问题是，审阅过的公开资料没有拆分直接消费者 App
              销售与合作伙伴各自贡献多少商品交易总额（GMV）或收入，也没有显示合同期限、经销商分成条款或企业留存。因此，销售效率看起来有希望，但还不能衡量。
