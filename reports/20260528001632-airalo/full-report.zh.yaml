            - 支持 / 帮助中心
        - id: usage
          label: 使用 / 加购流量
          actor: 旅行者 / 团队用户
          description: 连接成功后，用户在境外消耗数据，按需在应用内加购，也可能用忠诚度返现或企业模式支付完成后续购买。
          channels:
            - 应用内加购
            - Airmoney 返现
            - 用量跟踪
            - 企业模式结账
        - id: repeat-expand
          label: 复购 / 扩张
          actor: 高频旅行者 / 企业管理员 / 渠道伙伴
          description: 复购可能来自下一次行程、忠诚度返现、自动续购，或公司范围扩张；后者靠报表、计费和白标 / API 分发推进。
          channels:
            - 忠诚度等级
            - 自动续购
            - 月度用量报告
            - 白标 / API / 兑换券
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU015
      - CU016
      - CU028
      - CU035
      - CU040
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开漏斗在顶部认知和广泛用户声量上最强；最大盲点是累计用户与复购客户或活跃合作伙伴客户之间缺失的那一步。
    data:
      items:
        - label: 公开累计触达
          value: 100
          description: 以 2025 年宣称的 20M 用户 / 旅行者里程碑为指数基准。
        - label: 应用安装足迹
          value: 60
          description: 10M+ Google Play 安装量，加上 95K iOS 评分和 AppBrain 估算的 12M Android 下载量。
        - label: 实际使用里程碑
          value: 26
          description: 2023 年中报告 5.1M 客户，早于 10M 和 20M 里程碑。
        - label: 复购 / 加购潜力
          value: 14
          description: 忠诚度返现、加购流量和重复旅行者评论指向一个重要但未披露的复购层。
        - label: 企业 / 合作伙伴部署
          value: 5
          description: 宣称有 5,000+ 合作伙伴账户，但没有公开活跃账户或具名客户披露。
    claimRefs:
      - CU006
      - CU008
      - CU009
      - CU013
      - CU014
      - CU028
      - CU034
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 具名公开证据在个人旅行者轶事上最强，在具名客户级 B2B 账户上最弱；后者大多仍未披露。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 复购信号
        - 生产成熟度
      rows:
        - label: Louis D (AppBrain)
          values:
            - 中 — 具名公开应用评论
            - 中 — 安装和价格反馈为正，但一个线路有保留
            - 中 — 暗示有跨境复用
            - 高 — 真实行程使用，不是试点
        - label: Faisal Basheer (AppBrain)
          values:
            - 中 — 具名公开应用评论
            - 高 — 明确称在日本使用两张 eSIM 成功
            - 低 — 只有一次成功行程
            - 高 — 真实行程使用
        - label: Emelia Franecki (US-Reviews)
          values:
            - 中 — 具名公开评论网站帖子
            - 中 — 描述了哥伦比亚设置和可靠性
            - 低 — 未披露复购指标
            - 高 — 已完成真实行程
        - label: Damla (Sikayetvar)
          values:
            - 中 — 具名投诉帖
            - 高 — 具体提到埃及激活和退款额度问题
            - 低 — 负面结果提示流失风险
            - 中 — 已购买但激活失败
        - label: 公开 B2B 账户证据
          values:
            - 低 — 有垂直行业名称，缺少具名客户
            - 低 — 未披露客户级结果
            - 未知 — 没有具名客户级留存证据
            - 中 — 平台功能看起来已可生产使用
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU037
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 基于公开忠诚度机制、复用轶事和企业账户工具搭建的示意性代理队列；Airalo 未发布实际留存曲线。
    approximationNotes: 仅为估算的留存代理。数值不是公司披露的队列，只能作为尽调方向性占位，不能作为可用于投资判断的 KPI。
    data:
      columns:
        - 第 1 次行程后留到下一次
        - 第 2 次行程后留到第三次
        - 半年活跃
        - 第 1 年活跃
      rows:
