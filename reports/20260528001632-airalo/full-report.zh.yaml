      - number: '5.3'
        title: 合作伙伴平台与技术架构
        blocks:
          - type: paragraph
            body: >-
              Airalo 已经越过消费者 App，进入带有明确技术界面的合作伙伴平台。官方合作伙伴材料展示三种主要集成模式——REST API、SDK 和 WooCommerce
              plugin——并为不想搭建完整自定义货架的组织提供单独的企业和经销商体验。开发者栈明显比纯营销型合作伙伴门户更丰富：公开文档列出认证、套餐浏览、订单提交、安装指引获取、充值流程、订单和 eSIM
              管理、兼容设备列表、余额查询、通知和 webhook。Airalo 还记录了统一沙盒 / 生产模型，而不是单独测试 base URL；其 Node.js SDK
              增加了客户端缓存、限速处理和简化订单助手。与此同时，公开架构披露远不到完整栈图。Airalo 在隐私 /
              法律材料中确认，第三方处理托管、支付和网络连接；但在本章审阅的界面上，面向消费者的产品没有点名具体支付处理商、托管供应商，或逐运营商的路由合作伙伴。因此，公开合作伙伴栈在 API
              层看起来成熟，基础设施和供给层则相对不透明。
