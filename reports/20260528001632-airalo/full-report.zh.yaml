      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              从产品看，Airalo 的扩张打法站得住。公开页面展示了一条清晰阶梯：从旅行者直接购买，延伸到充值、忠诚度、企业模式付款、自动化报表、API
              集成、白标店铺、经销商券码，以及航空公司或电信渠道分销。这个组合应当能带来两类增长：存量企业客户内的账户扩张，以及更广的 B2B2C 触达。风险在于，公开证据没有回答关键的集中度问题。Airalo 称超过
              5,000
              家合作伙伴信任其平台，但没有披露具名客户、前几大客户收入占比、活跃合作伙伴数量或合作伙伴流失。消费者端最大的反向信号不是需求弱，而是关键旅行时刻的服务失效：Sikayetvar/Xolvie、Trustpilot
              和评测博客反复提到激活失败、退款摩擦和支持响应慢。使用条款又强化了这种投诉模式：eSIM 一旦激活，撤回权即被切断。因此，扩张在结构上可行，但集中度和耐久性仍需要私下证据支撑。
