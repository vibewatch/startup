      - number: '4.3'
        title: 成本结构、毛利率驱动和公开单位经济性缺口
        blocks:
          - type: paragraph
            body: >
              Airalo 的成本结构理论上有结构性吸引力，实践中却仍顽固不透明。行业资料给出了机制：旅行 eSIM 提供商可以把价格压到传统漫游之下，因为它们避开实体 SIM
              分发，依靠数字获客和激活，并通过直接本地合作和批发式安排购买或聚合连接。TechCrunch 在这里补充了一个 Airalo 特有的重要细节：幕后，公司把直接批发容量采购与运营商已打包的转售漫游套餐结合起来。如果
              Airalo 拿到的是运营商本会失去的需求，这种混合供给模式可以利好毛利；但它也意味着实现毛利率取决于不同地理、运营商和套餐类型下的合同条款。监管和行业基准有助于给经济性划边界。Juniper 称，旅行 eSIM
              相比漫游在 2024 年可为客户节省 35% 的每 GB 成本，到 2029 年可能节省约 75%；GSMA 称旅行 eSIM 正成为成功用例，28% 的旅行 eSIM 用户已经从 Airalo
              等全球供应商购买。欧盟和 ITU 材料进一步显示，批发漫游费和运营商间资费仍是传统漫游链条的关键成本驱动，这支持了一个判断：Airalo
              的价值主张建立在绕过或压缩传统加价之上。缺口是从套餐标价到运营商成本、支持成本、退款和净贡献毛利率的真实瀑布分解。近期 Google Play
              投诉和独立评测者提醒也说明，即使是数字模型，支持、安装失败、公平使用限制和本地号码可用性不一致，都可能侵蚀利润率。
