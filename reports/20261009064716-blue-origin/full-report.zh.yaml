      - number: '7.2'
        title: 监管审批、空域许可与法律风险
        blocks:
          - type: paragraph
            body: >-
              将 New Glenn 从开发演示扩展到商业可行，需要在多机构联邦监管下取得大量批准（CR007, CR008）。FAA 车辆运营许可证 VOL 24-133 将 36 号复合体的 New Glenn
              运营限制为每年最多 12 次发射和下行着陆（CR007）。2026 年 9 月，FAA 发布环境评估草案，审查 Blue Origin 修改 VOL 24-133 的申请，拟把年发射上限提高四倍以上至 50
              次；该行动还须接受国家环境政策法审查，并与空军部、NASA 和美国海岸警卫队协调（CR007）。FAA
              明确指出，完成环境审查并不保证许可证修改，也不保证批准国家空域系统中的临时空域关闭；大西洋发射和着陆危险区会影响数十条商业航线（CR007）。在联邦采购法下，Blue Origin 针对 NASA 将
              Option A 人类着陆系统授予 SpaceX 的 2021
              年法律抗议，凸显固定价格联邦太空项目的预算约束：机构资金上限决定授标结构，并要求承包商承担显著开发成本风险（CR008）。此外，佛罗里达和得州的大规模实体扩张带来特殊财产损坏、环境责任和灾难损失风险，挑战传统航天保险承保能力（CR005,
              CR006）。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
