      - number: '8.2'
        title: 融资背景、入场估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 2026 年年中的资本事件标志着公司从创始人资助转向机构私募股权治理（CV001, CV006）。$10B 融资由 Coatue Management 作为主锚投资者承诺 $4B，Jeff
              Bezos 用个人资金出资 $2B 维护持股，机构资产管理者联合提供剩余 $4B（CV001, CV003, CV006, CV009, CV010）。这一定价基准直接受到主要竞争对手 SpaceX 2026 年
              6 月 IPO 的催化；SpaceX 以接近 $1.75T 至 $2.0T 的估值融资超过 $85B，促使寻求主权级航天基础设施敞口的全球配置者加快行动（CV001, CV006）。Bezos 累计注资增至约
              $32B，其个人持股从 100% 小幅稀释至约 94%，完全分配口径下外部投资者持有公司约 6%（CV003, CV004, CV010）。


              对非战略性财务投资者而言，当前 $130B 投前估值下的入场纪律十分脆弱（CV004, CV006）。虽然新增 $10B 一级流动性注入按当前消耗率可提供数年资金续航，但以 100x
              远期倍数入场，对运营挫折没有安全边际（CV003, CV004）。历史联邦采购记录显示，Blue Origin 曾根据 B-419783 招标向美国政府问责办公室（GAO）抗议 NASA
              将单一来源人类着陆系统演示合同授予 SpaceX；由于国会拨款仅 $850M，低于更高报价方案，机构偏向 SpaceX（CV008）。Blue Origin 随后获得 $3.4B Artemis V
              合同，但航天采购中的固定价格合同经济性意味着测试异常发生时，承包商会承受利润率压缩和成本吸收（CV004, CV008）。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
