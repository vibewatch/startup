figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Blue Origin 从成立、轨道发射到外部融资的按时间顺序发展历程。
    data:
      items:
        - label: '2000-09: 公司成立'
          detail: Jeff Bezos 在华盛顿州 Kent 创立 Blue Origin，启动自筹资金的航天开发。
          tone: positive
        - label: '2006-11: Goddard 测试飞行'
          detail: 首架低空开发验证飞行器在西德州 Launch Site One 发射。
          tone: neutral
        - label: '2015-11: New Shepard 首次着陆'
          detail: New Shepard 实现垂直起飞，并从亚轨道空间完成无人动力助推器着陆。
          tone: positive
        - label: '2021-07: 亚轨道载人飞行'
          detail: NS-16 飞行将 Jeff Bezos、Mark Bezos 和乘客送过卡门线。
          tone: positive
        - label: '2023-05: NASA Artemis V 选定'
          detail: NASA 授予 Blue Origin $3.4 billion 合同，开发 Blue Moon 载人月球着陆器。
          tone: positive
        - label: '2023-09: 高管领导层交接'
          detail: Amazon 高管 Dave Limp 被任命为 CEO，加快生产扩张和飞行运营。
          tone: neutral
        - label: '2025-01: New Glenn 首次轨道飞行'
          detail: 重型运载火箭 New Glenn 执行 NG-1 飞行，从 Cape Canaveral 成功进入轨道。
          tone: positive
        - label: '2025-11: ESCAPADE 火星任务'
          detail: New Glenn 发射两颗 NASA 火星轨道器，并成功在海上回收一级助推器。
          tone: positive
        - label: '2026-01: New Shepard 旅游暂停'
          detail: 公司暂停亚轨道旅游飞行，将工程资源转向 Artemis 着陆器。
          tone: warning
        - label: '2026-05: Launch Complex 36 爆炸'
          detail: BE-4 氧阀故障引发灾难性静态点火爆炸，损坏 Cape Canaveral 发射台。
          tone: adverse
        - label: '2026-07: 外部融资计划'
          detail: 报道披露由 Coatue 领投的一轮 $10 billion 融资，投前估值为 $130 billion。
          tone: positive
    approximationNotes: 日期和项目描述来自 NASA、公司及信誉良好的财经媒体官方或公开记录。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO008
