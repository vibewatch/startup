            body: >-
              最有力的公开架构证据来自具体子系统。NASA 论文描述了一套以四核 ARM A53 MPSoC 为核心、配备独立 FPGA 接口板，并运行导航、地形相对导航和制导 cFS 应用的下降着陆计算机。论文还记录
              Blue Origin 为 Blue Moon 研究辐射容错 FPGA 中的 RISC-V 软处理器，因此计算试验是有记录的差异化能力，而非已定型生产设计的主张。BlueGPT 则增加企业层：AWS
              报告了模型访问、检索、数据库、容器化运行时、无服务器自动化和智能体编排。整体看，这些组件暗示一种纵向整合的工程模式，让任务算法、计算权衡、专有知识、仿真和实体设计相互协作；公开证据尚未显示跨项目统一的生产架构。
