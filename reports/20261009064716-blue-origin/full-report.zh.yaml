        title: 展示
        blocks:
          - type: callout
            title: 关键人物与资本结构转型风险
            body: >-
              25 年来，Blue Origin 一直靠 Jeff Bezos 的个人资金和长期愿景庇护运营，能够消化开发延期而不受外部股东牵制。转向 $130B
              机构估值并引入外部股权后，公司将面对合同交付审查、回报里程碑和运营问责，同时仍极度依赖 Bezos 的控制与战略投入（CO001, CO003, CO005）。
            calloutType: risk
            claimRefs:
              - CO001
              - CO003
              - CO005
          - type: callout
            title: 双重推进与重型运载业务护城河
            body: >-
              Blue Origin 在政府与商业航天领域都占据不可或缺的产业位置：它运营着美国仅有的两个获认证、可承载国家安全有效载荷的现役重型轨道发射系统之一，同时还是主要竞争对手 United Launch
              Alliance 的唯一单一来源发动机供应商（通过 BE-4）（CO001, CO004, CO008）。
            calloutType: strength
            claimRefs:
              - CO001
              - CO004
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：多项业务，而非单一 TAM
        blocks:
          - type: paragraph
            body: >-
              不应拿单一、宽泛的“太空经济”估算来给 Blue Origin
              估值。其可触达业务涵盖可重复使用轨道发射、火箭发动机供应、月球运输、在轨物流与空间站、卫星连接；每项业务的买方、采购周期、竞争格局和收入单位都不同。短期市场分析的核心边界包括 New Glenn
              发射服务、BE-4 推进供应、NASA 月球运输以及 TeraWave 企业 /
              政府连接。太空旅游、轨道数据中心、资源开采和商业空间站属于相邻方向，尚非已验证的可服务市场。现状替代方案包括地面光纤、现有卫星星座、在役发射服务商以及政府内部采购项目。划定这一边界，可避免把发射积压、连接用户、政府拨款和私募估值当作共享同一分母的指标相加。
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM012
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持 Blue Origin 的收入 TAM、SAM 或 SOM。证据只给出有边界的需求指标：TeraWave 据称目标客户约 100,000 家；一名 McKinsey 参与者估计，全球约有
              100,000 家场外企业和最多 300 million 家小企业可能受益于更好的连接。这些群体不是收入、签约客户，也不能相互相加。发射需求更具体但仍属间接证据：Payload 报道已售出超过 70 次
              Vulcan 发射，其中包括 38 次 Amazon Kuiper 任务；GAO 记录显示，公共月球采购受年度拨款和里程碑付款能力约束。因此，该图展示的是从机会到兑现的阶梯，而非按比例的市场漏斗或管理层预测。
            claimRefs:
