        title: 收入架构多元，但依赖里程碑
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 有四条得到证据支持的变现路径，而非单一同质化收入引擎：向 United Launch Alliance 供应 BE-4 发动机、运营 New Glenn 执行轨道任务、用 New
              Shepard 搭载乘客和有效载荷，以及持有 NASA $3.4B 固定价 Blue Moon 合同（CI001, CI002, CI003,
              CI005）。这些收入流的单位和确认触发条件不同：发动机交付不是发射，发射不是开发里程碑，合同授予也不是已确认收入。New Shepard
              旅游暂停两年或更久，还会移除此前活跃的乘客渠道，资源转向月球工作（CI004）。组合可能分散需求，但现有证据没有披露分部收入、积压转化、取消条款或会计政策；收入质量取决于已验收里程碑、可靠飞行节奏和制造交付，而不只是合同
              headline 金额。
