      - number: '1.3'
        title: 运营项目、合同组合与不利事件
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 的技术组合覆盖亚轨道飞行、重型轨道发射、火箭发动机推进、在轨机动和月球基础设施（CO001, CO004）。其亚轨道 New Shepard 飞行器于 2021 年 7 月搭载 Bezos
              完成商业载人航天，此后完成数十次亚轨道任务；管理层于 2026 年 1 月暂停太空旅游，将工程资源转向 NASA Artemis 计划下的月球着陆器开发（CO004, CO008）。重型 New Glenn
              火箭于 2025 年 1 月完成首次轨道飞行，并于 2025 年 11 月发射 NASA 的 ESCAPADE 火星任务，在海上平台 Jacklyn 上回收一级助推器（CO001,
              CO004）。除自有飞行器外，Blue Origin 还生产液化天然气 BE-4 火箭发动机，为 United Launch Alliance 的 Vulcan Centaur
              重型运载火箭供货，使其成为行业竞争对手的关键推进供应商（CO001, CO003, CO004）。在国家安全与探索领域，公司获得 NSSL 第 3 阶段第 2 航道合同，约值 $2.4B、涵盖 7
              次发射；同时获得 NASA $3.4B 的 Artemis V 月球着陆器合同（CO001, CO008）。尽管运营版图扩大，公司仍于 2026 年 5 月 28 日遭遇重大基础设施挫折：New Glenn
              一级在卡纳维拉尔角 36 号发射复合体进行静态点火测试时，BE-4 发动机主氧阀故障引发爆炸，严重损坏发射台基础设施，并迫使公司全面检修复飞工程方案（CO001, CO004, CO008）。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
