      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 36 号太空发射复合体的关键基础设施脆弱性
            body: >-
              2026 年 5 月 28 日静态点火灾难证明，发射台基础设施是 Blue Origin 最严重的单点故障风险（CR001, CR002）。不同于在多个航天港运营多个轨道发射台的成熟竞争者，New Glenn
              近期飞行计划完全依赖卡纳维拉尔角 SLC-36（CR001, CR007）。任何未来静态点火或发射异常，只要损坏运输架设机或脐带塔，就会直接冻结商业发射、发动机测试和客户卫星部署数个季度（CR002,
              CR004）。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
          - type: callout
            title: 外部资本注入重塑公司治理与执行纪律
            body: >-
              以 $130B 投前估值启动 $10B 外部融资，打破 Jeff Bezos 持续 26 年的创始人单独股权融资传统（CR009）。机构投资者如 Coatue Management
              为吸收发射台维修成本、扩大卫星星座提供必要资本缓冲，但也带来严格回报门槛、里程碑监督和公开市场基准，削弱管理层在缺乏商业可见性的情况下推进开放式多年研发计划的历史自由度（CR009, CR010）。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与核心反论点
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 的核心投资论点在于其战略地位：它是唯一具备资本规模、发动机推进制造能力和飞行器架构、能够成为 SpaceX 可信重型运载制衡者的西方商业实体（CV001, CV002）。在 Jeff
              Bezos 累计 $28B 至 $32B、持续二十多年的创始人独家融资后，公司于 2026 年向机构资本开放股权结构，由 Coatue Management 牵头以 $130B 投前估值融资
              $10B（CV001, CV003, CV004, CV009）。商业模式从定制开发转向多层航天基础设施，覆盖 New Glenn 商业重型轨道发射、通过 BE-4 为 United Launch
              Alliance 供应商业发动机，以及由 NASA $3.4B Artemis V 人类着陆系统合同支撑的深空月球物流（CV001, CV004, CV005, CV013）。此外，机构投资者正押注计划中的
              5,400 颗卫星 TeraWave 企业星座和 Project Sunrise 等长期轨道数据中心架构，将航天基础设施视为缓解地面电力与散热约束的出口（CV002, CV006, CV011）。


              反论点则指出估值倍数与短期财务基本面严重脱节，并伴随灾难性的执行脆弱性（CV004, CV007）。以 $140B 投后估值对比预计 2025 年收入 $800M 和 2026 年预测收入 $1.4B，Blue
              Origin 的追踪收入倍数高达 175x，远期收入倍数为 100x（CV004, CV006）。2026 年资本开支预计单年达到 $4.8B，主要用于修复 2026 年 5 月 28 日 New Glenn
              在卡纳维拉尔角 36 号发射复合体静态点火爆炸造成的损毁；事故由 BE-4 主氧阀故障引发（CV003, CV005, CV007）。New Shepard 旅游运营暂停至少两年以重新调配工程资源，Blue
              Origin 因此面临多年负自由现金流；尽管亚轨道和轨道任务历史上成功飞行 39 次，发射延期仍会直接威胁数十亿美元积压订单兑现（CV004, CV005, CV012）。
            claimRefs:
