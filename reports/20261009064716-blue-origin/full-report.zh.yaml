      - number: '8.3'
        title: 情景分析、可比倍数与退出准备度
        blocks:
          - type: paragraph
            body: >-
              评估 Blue Origin，首先要把发射频次、商业订单变现和巨型星座部署拆成明确的运营情景（CV002, CV004）。乐观情景下，Blue Origin 会迅速修复 Launch Complex 36，利用
              NASA Stennis 的 B-2 试车台进行二级发动机热试车，在 2026 年底前让 New Glenn 达到飞行就绪，并把运营发射频次逐步推向每年 100 次，争取在 2030 年实现其每年 $30B
              的收入目标 （CV003, CV004, CV014）。在这一情景中，商业发射利润率、ULA 采购 BE-4 发动机带来的授权费，以及 TeraWave 企业连接业务， 将支撑 Blue Origin 在
              2028-2029 年成功 IPO 后，把公开市场企业估值推向 $300B 至 $400B （CV001, CV003, CV004, CV011, CV013）。基准情景下，New Glenn 会在 2026
              年末或 2027 年恢复试飞，初期发射频次温和， 同时完成 NASA Artemis 登月里程碑，并每年带来稳定的 $2B 至 $4B 联邦收入；但高资本强度会让股权估值维持在 $130B 至 $160B
              区间（CV001, CV004, CV005）。


              悲观情景下，发动机阀门或低温系统反复出现异常，导致发射台停摆时间延长，商业发射积压订单大量取消，固定价格的 Blue Moon Artemis 合同超支，资本消耗持续加快（CV003, CV007,
              CV008）。如果私人资本市场把 Blue Origin 从基础设施平台重新定价为 重资产工业制造商，估值可能收缩至 $60B 至 $80B，意味着倍数严重压缩（CV004, CV007）。综合这些因素，我们建议
              “跟踪”，置信度为中等：公司执行风险高，当前估值偏高，必须先拿出 New Glenn 可复用性和发射频次的实证，才值得投入新增风险资本 （CV001, CV004）。 
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV013
              - CV014
