  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营、质量与发射基础设施脆弱性
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 的主要运营脆弱性在于其位于卡纳维拉尔角太空军基地 36 号太空发射复合体的重型轨道发射基础设施脆弱且集中于单一地点（CR001, CR002）。2026 年 5 月 28 日，New
              Glenn 综合静态热试车发生灾难性故障并爆炸；行业观察者称其为发射器历史上最大的爆炸之一，摧毁或严重损坏主运输架设机架、避雷塔和液压缸等核心发射台设施（CR001,
              CR002）。后续工程调查认定，故障源于一级七台 BE-4 发动机之一的主氧阀，暴露部件级质量保证风险，迫使公司重新设计阀门硬件，并将上面级热试车转移至密西西比州 NASA Stennis Space
              Center B-2 试验台（CR001, CR002）。发射台停摆直接传导至商业和机构客户日程，说明单点发射基础设施瓶颈会冻结收入兑现，并在 AST SpaceMobile
              等依赖型卫星星座部署中叠加资本消耗（CR003, CR004）。即使得州 Hutto 的 1.3-million-square-foot Constellation Park 扩建卫星制造能力、佛罗里达
              Rocket Park 计划扩建 $600M 制造设施，实体发射台吞吐量仍是轨道发射节奏的绝对闸门（CR005, CR006）。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
