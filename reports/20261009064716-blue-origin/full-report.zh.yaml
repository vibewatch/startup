              - CV007
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 投资立场：等待飞行验证的可复用性，暂予跟踪
            body: >-
              按 $140B 投后估值计算，Blue Origin 的定价约为 2026 年预期收入 $1.4B 的 100 倍。非战略投资者不应追逐当前轮次， 而应继续跟踪；在公司证明 New Glenn 能稳定复用、修复
              Launch Complex 36 并建立持续发射频次前，不宜投入资本。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: callout
            title: 下行风险：固定价格合同与发射台脆弱性
            body: >-
              2026 年 5 月测试爆炸摧毁了 Launch Complex 36 的核心地面设施，暴露出极端的单点运营风险。再叠加 $4.8B 的资本开支预测 以及 NASA Artemis
              项下的固定价格承诺，技术异常可能迅速耗尽流动性。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
