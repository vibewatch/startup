      - number: '3.3'
        title: 护城河持续性与运营瓶颈
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 的竞争护城河主要靠长期客户多供应商策略和联邦战略采购要求支撑，而不是单纯依靠成本领先。商业星座运营商（包括已预订最多 27 次 New Glenn 发射的 Amazon Kuiper
              项目）以及美国太空军，都在主动引入多个供应商，以降低过度依赖 SpaceX 所带来的灾难性单点故障风险（CP013）。此外，Blue Origin 的资本护城河也在加深：创始人累计投入股权超过 $28B，另有一轮
              $10B 的里程碑式外部股权融资，估值为 $130B 至 $140B。这为公司多年持续投入月球着陆器、空间站和通信星座等高资本开支项目提供了资产负债表韧性（CP014）。


              但 Blue Origin 仍面临严重的运营瓶颈和执行风险，客户切换成本可能因此被削弱。公司的发射节奏依然严重受限：截至 2026 年 5 月 28 日卡纳维拉尔角发射场 36
              号综合体（LC-36）发生灾难性静态点火爆炸前，New Glenn 只飞行过 3 次。事故摧毁了 NG-4 助推器，并损坏了运输起竖架、避雷塔和液压缸等关键地面设施（CP015）。故障源于 BE-4
              发动机的主氧阀，Blue Origin 因此在发射台 改造和组件重新设计完成前，Blue Origin 都没有在役轨道发射场，这给核心卫星星座和 Artemis 开发里程碑带来严重的发射排期风险（CP016）。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 多供应商防御：政府和商业客户对第二家供应商的需求
            body: >-
              Blue Origin 最持久的竞争优势不是当前发射节奏，而是市场为对冲 SpaceX 垄断而产生的结构性需求。NASA 通过多供应商 Artemis 月球架构，以及 Amazon Kuiper
              等商业星座建设者，都在主动分配数十亿美元合同，确保有韧性的第二家重型供应商能够存续并扩大规模。
            calloutType: insight
            claimRefs:
              - CP006
