  - id: FU001
    title: 客户验证与扩张路径
    type: journey-map
    summary: 公开验证从采购或预订推进到开发和飞行，但基础设施、资金和项目组合优先级仍可能限制复用。
    data:
      items:
        - label: 需求或预订
          detail: 政府任务需求、工业集成需求、载荷目标或私人参与者需求，都会开启这段关系。
          touchpoints:
            - 政府征集
            - 发动机选型
            - 载荷清单
            - 乘客预订
        - label: 评估与融资
          detail: 技术评估、可用资金、价格和合同结构决定需求能否转化为有资金支持的工作。
          touchpoints:
            - 提案评估
            - 拨款
            - 里程碑谈判
        - label: 开发或集成
          detail: 在发动机、着陆器、载荷或任务系统完成开发和集成前，客户验证仍停留在量产前阶段。
          touchpoints:
            - 发动机集成
            - 着陆器开发
            - 云与任务系统
        - label: 演示或飞行
          detail: 已完成的飞行和载荷任务比客户标识或已宣布计划更能证明采用，但不会披露经济性。
          touchpoints:
            - 载人任务
            - 载荷飞行
            - 车辆演示
        - label: 重复使用或扩张
          detail: 重复任务、生产交付和后续授标可以证明持久性，但公开的客户群和续约指标缺失。
          touchpoints:
            - 后续授标
            - 重复载荷清单
            - 生产节奏
        - label: 中断或重新排序
          detail: 发射场损坏、车辆可用性和项目组合调整可能中断服务，也可能推迟原本可见的需求。
          touchpoints:
            - 旅游业务暂停
            - 发射场停运
            - 项目优先级调整
    approximationNotes: 基于公开关系里程碑的概念性流程；不是经过测量的转化漏斗，也不代表任何转化率或共同样本。
