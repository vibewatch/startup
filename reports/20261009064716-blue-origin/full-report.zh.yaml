              称其共同开发了标准化数据采集与控制硬件，以单一软件接口覆盖硬件在环、系统集成实验室和设计验证用途。该合作方叙述支持一种具体集成模式，但没有独立量化可靠性提升。Blue Origin 2024
              年采购订单要求增加了正式控制：供应商须维护接受买方审查的质量体系，将相关要求传递给下级供应商，并至少保存 10
