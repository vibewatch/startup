chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Blue Origin Enterprises, L.P. 是一家总部位于华盛顿州肯特市的私营航天制造与空间技术企业（CO001, CO004）。公司由 Amazon 创始人 Jeff Bezos 于 2000
              年 9 月创立，遵循拉丁格言 Gradatim Ferociter 所代表的渐进式工程开发理念（CO001, CO003）。约 25 年来，Blue Origin 没有采用传统风险资本或外部股权联合融资，而是由
              Bezos 直接通过每年平均出售约 $1B 的 Amazon 股权提供资金（CO001, CO003）。2023 年 9 月，Bezos 任命前 Amazon 高管 Dave Limp 为首席执行官，接替 Bob
              Smith，推动 Blue Origin 从长期研发状态转向大批量制造、发射运营和轨道发射节奏（CO002, CO003）。管理层还在 Tory Bruno 任职 United Launch Alliance
              后，将这位行业资深人士招入国家安全领导岗位（CO003）。Bezos 作为控股所有者继续牢牢掌握公司治理，运营权集中在 Limp 手中；公司因此高度依赖关键人物，同时免受公开市场季度业绩压力（CO002,
              CO003）。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: 资本结构、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              2000 至 2025 年间，Blue Origin 的资本结构本质上是创始人单一资金来源的股权，辅以 NASA 和美国太空军的联邦开发合同（CO003, CO005, CO007）。2026
              年年中，在主要发射竞争对手 SpaceX 高估值上市后，Blue Origin 首次向外部机构投资者开放资本结构（CO001, CO005, CO006）。公司启动一轮 $10B 融资，市场据报投前估值为
              $130B；资产管理公司 Coatue Management 承诺 $4B，Bezos 同期注资 $2B，其余 $4B 分配给机构参与者（CO001, CO005,
              CO006）。私募市场资料显示，公司历史累计融资约达 $10.2B（CO007）。企业在美国各地拥有约 14,000
              名员工，分布于华盛顿、佛罗里达、得州、阿拉巴马州等地的生产园区、测试场和区域办公室（CO007）。由于 Blue Origin
              仍由少数股东紧密控制且不披露经审计财务报表，商业发射利润率、年度经常性收入和合同积压等关键运营指标仍是未获确认的私有数据（CO001, CO003）。
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO007
