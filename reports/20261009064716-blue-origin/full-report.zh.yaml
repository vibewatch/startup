      - number: '2.3'
        title: 买方、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              连接业务切入点比大众宽带更窄：分析师将 TeraWave
              定义为面向企业、政府、云区域和偏远工业站点的中程或骨干基础设施，而非消费者最后一公里接入。因此，网络、云基础设施和公共采购预算将决定采用，韧性、路径多样性、地面覆盖缺口和自动化则是触发因素。发射买方是卫星运营商和政府任务负责人；推进系统买方是主承包商；月球运输由
              NASA
              项目拨款提供资金。各细分市场都要经过技术认证、终端可用、发射节奏、服务水平验证和采购批准，采用才会推进。买方图刻意区分用户、付款方和预算负责人，因为数据中心运营商、任务用户和政府采购办公室不会作出同一个购买决策。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              增长可能来自韧性企业连接、主权需求、AI 驱动的数据传输、远程工业自动化，以及发射与网络运营之间的纵向整合。但证据不支持短期外推。一名分析师称，非地球同步轨道总容量甚至超过乐观需求预测；另一名分析师预计本十年内
              TeraWave 不会大规模发射；参与者则指出 Q/V 波段终端供应、雨衰、光链路成熟度和高资本强度都是门槛。轨道数据中心的上行空间主要在 2030
              年以后，距离商业成熟还很远。公开报道的私募估值也因时间和融资基础不同而异，因此 $130B 和约 $140B
              都不是市场规模数据点。估值应奖励已验证的积压订单和部署里程碑，而不是把宽泛的受益群体或私募轮定价转换成收入。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 不要把受益群体资本化
            body: >-
              300 million 家小企业是宽泛的暴露估算，约 100,000 家场外企业和 TeraWave 客户则采用不同定义。没有定价、签约需求、终端经济性和部署时间表，这些数字都不能构成可辩护的收入 TAM 或
              SOM。
            calloutType: risk
            claimRefs:
