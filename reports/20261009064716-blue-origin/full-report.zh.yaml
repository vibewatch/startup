      - number: '7.3'
        title: 合作伙伴依赖、客户瓶颈与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Blue Origin 的商业模式具有交易对手高度集中、供应商相互依赖复杂和多年资本吸收量大的特点（CR009, CR010）。公司于 2026 年 7 月启动首轮私募外部股权融资，以隐含 $130B
              投前估值筹集 $10B，降低对 Jeff Bezos 历史个人股权出售的依赖（CR009）。该轮由 Coatue Management 承诺 $4B、创始人兜底 $2B、机构联合融资
              $4B，为发射台维修、TeraWave 星座开发和月球着陆器工程提供流动性，但也在未来上市前引入外部治理预期和里程碑问责（CR009）。客户方面，轨道延迟会让商业星座运营商承担严重财务后果：AST
              SpaceMobile 直连设备星座需要足够轨道密度才能商业变现，发射延期会为关键商业伙伴造成闲置资本、收入递延和持续消耗（CR003, CR004）。同样，Blue Origin 既是自有发射竞争者，又是
              United Launch Alliance 的商业发动机供应商，为 Vulcan Centaur 交付 BE-4，因此内部 New Glenn 分配与合同交付义务之间存在运营张力（CR001,
              CR008）。兑现这些雄心勃勃的运营承诺，还需在激烈航天人才竞争中招募数千名推进和系统集成工程师，从而提高整个制造网络的人力资本执行风险（CR011, CR012）。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
