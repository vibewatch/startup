  - id: FV001
    title: 投资判断逻辑流程
    type: flow
    summary: 从战略资产出发，经由执行摩擦和估值倍数，推导至最终投资立场。
    data:
      nodes:
        - id: step-1
          label: 战略基础
          detail: Bezos 的累计投入（$32B）和 NASA $3.4B 的 Artemis V 月球合同，构成战略性主权业务根基。
        - id: step-2
          label: 商业拐点
          detail: New Glenn 首次入轨和 BE-4 推进系统供应，推动收入从 $800M（2025）增长至 $1.4B（2026）。
        - id: step-3
          label: 资本化事件
          detail: Coatue 领投的 $10B 股权融资轮，为外部定价锚定 $130B 投前估值 / $140B 投后估值。
        - id: step-4
          label: 运营挫折
          detail: 2026 年 5 月的静态点火爆炸摧毁 LC-36 发射台基础设施，迫使公司承担 $4.8B 年度资本开支，并暂停 New Shepard 飞行。
        - id: step-5
          label: 倍数脱钩
          detail: 100x 远期收入倍数已按完美表现定价，但运营节奏和自由现金流生成尚未得到证明。
        - id: step-6
          label: 投资建议
          detail: 评级为跟踪，估值立场偏高；在投入新资本前，要求 New Glenn 以飞行结果证明业务扭转。
    approximationNotes: 表示将事实证据串联至投资委员会决策的顺序性分析综合。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
