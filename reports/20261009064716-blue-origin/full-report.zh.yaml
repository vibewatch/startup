            body: >-
              成熟度证据不均衡且有时间边界。NASA 论文可信地证明了集成测试与仪器工作，但其结果和路线图已属历史信息。2021 年 GAO 决定保留 NASA 对 Blue Origin
              人类着陆系统方案的同期疑虑：被动地形相对导航依赖月面照明，低温流体管理依赖不成熟技术，多数所需通信链路按当时设计无法闭合。这些发现不应被表述为当前缺陷，但指出了现有项目应测试的关键事项。与此同时，AWS
              和个人从业者作品集重复平台规模和生产力主张，却没有独立审计或明确测量日期。因此投资判断是：Blue Origin 展现了广泛且技术细节明确的能力，但当前认证、运营可靠性、网络安全保障和路线图闭环仍需大量私有证据。
