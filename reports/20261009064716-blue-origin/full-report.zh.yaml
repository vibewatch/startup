  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              商业航天与轨道发射行业资本壁垒高、纵向整合深，快速高频的在役企业与新兴重型进入者分化明显。Blue Origin
              的竞争横跨商业及国家安全重型轨道发射、深空探索与月球基础设施、商业推进供应、亚轨道载人航天四个领域（CP001）。SpaceX 是轨道发射和载人月球探索的主要直接竞争者，Falcon 9 年发射超过 100
              次，并推动 Starship 走向全面运营（CP002）。传统航天承包商，尤其是 Boeing 与 Lockheed Martin 合资的 United Launch Alliance（ULA）及
              Northrop Grumman，直接争夺美国太空军 NSSL 第 3 阶段合同和 NASA 探索预算（CP003）。Rocket Lab 正开发 Neutron 等中型运载替代方案；Virgin
              Galactic 则在 New Shepard 多年暂停期间争夺私人宇航员需求（CP004）。Arianespace 等传统政府任务架构和国际运载火箭构成现状替代方案。Blue Origin 的独特位置在于既是
              ULA 防务有效载荷的直接发射对手，又是其关键推进供应商，生产驱动 Vulcan Centaur 的双台甲烷 BE-4 发动机（CP005, CP006）。


              In adjacent and specialized segments, emerging providers such as Rocket Lab are developing medium-lift
              alternatives like Neutron to contest satellite constellation deployment, while suborbital tourism
              alternatives such as Virgin Galactic target private astronaut demand during Blue Origin's multi-year
              operational pause on New Shepard flights (CP004). Status-quo government mission architectures and
              international launch vehicles, including Arianespace, represent traditional alternatives that commercial
              reusability has increasingly displaced (CP005). Blue Origin's unique positioning rests on operating as
              both a direct launch rival to ULA for defense payloads and its mission-critical propulsion supplier,
              manufacturing the dual BE-4 methane-fueled engines that power ULA's Vulcan Centaur booster (CP006).
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
      - number: '3.2'
        title: 能力差异化与定价动态
        blocks:
          - type: paragraph
            body: >-
              能力权衡显示，Blue Origin 的 New Glenn 与竞争性重型架构存在明确技术差异。New Glenn 7 米整流罩的可用容积超过 SpaceX 标准 5.2 米 Falcon
              整流罩的两倍，可在不采用复杂折叠机构的情况下部署超大单体有效载荷、高容量卫星堆栈和大直径月球着陆器级段（CP007）。SpaceX 与 Blue Origin
              都高度纵向整合，在内部开发专有分级燃烧发动机、航电、结构和自动回收船舶（CP008）。但 SpaceX 的运营飞行历史优势压倒性明显：其轨道助推器重复使用超过 300 次；New Glenn 于 2025 年 1
              月首次轨道发射，2025 年 11 月在 Jacklyn 上首次驳船回收助推器，2026 年 4 月又发生上面级任务异常（CP009）。Falcon 9 单次专用发射估计 $65M 至
              $70M，形成激进的每公斤价格基准；NASA 初始 Option A 竞争中，SpaceX 报价 $2.94B，Blue Origin National Team 报价 $5.99B，Dynetics 报价
              $9.08B。Blue Origin 后来以固定价 $3.4B 获得 Artemis V 合同（CP010–CP012）。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
