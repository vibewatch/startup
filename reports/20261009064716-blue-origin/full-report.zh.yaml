          - type: callout
            title: 地面基础设施单点故障脆弱性
            body: >-
              2026 年 5 月 28 日静态点火测试摧毁 36 号发射复合体，暴露出严重运营瓶颈。不同于拥有多个在役发射台的竞争者，Blue Origin
              完全依赖单一轨道发射台；在场地全面重建和阀门重新设计完成前，飞行器测试与收入创造都会停滞。
            calloutType: risk
