callouts:
  - calloutType: "insight"
    title: "The Multi-Homing Defense: Government and Commercial Demand for a Second Provider"
    body: "Blue Origin's most durable competitive advantage is not current launch cadence, but structural market demand for a hedge against SpaceX monopoly. Both NASA through its multi-vendor Artemis lunar architecture and commercial constellation builders such as Amazon Kuiper actively allocate multi-billion-dollar awards to ensure a resilient second heavy-lift provider survives and scales."
    claimRefs:
      - "CP006"
      - "CP012"
      - "CP013"
  - calloutType: "risk"
    title: "Ground Infrastructure Single-Point Failure Vulnerability"
    body: "The destruction of Launch Complex 36 during the May 28, 2026 static fire test exposed an acute operational bottleneck. Unlike competitors with multiple active launch pads, Blue Origin's total dependence on a single orbital pad halts vehicle flight testing and revenue generation until full site reconstruction and valve redesigns are completed."
    claimRefs:
      - "CP009"
      - "CP015"
      - "CP016"
