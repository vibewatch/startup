callouts:
  - calloutType: "risk"
    title: "Key-Person and Capital Structure Transition Risk"
    body: "For a quarter-century, Blue Origin operated under the protective shelter of Jeff Bezos's personal checkbook and long-term vision, absorbing development delays without outside shareholder friction. The transition toward a $130 billion institutional valuation and outside equity introduces contractual delivery scrutiny, return milestones, and operational accountability alongside extreme continuing key-person dependency on Bezos's control and strategic commitment (CO001, CO003, CO005)."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO005"
  - calloutType: "strength"
    title: "Dual Propulsion and Heavy-Lift Franchise Moat"
    body: "Blue Origin occupies an indispensable industrial position across both government and commercial space sectors: it operates one of only two active U.S. heavy-lift orbital launch systems certified for national security payloads, while serving as the exclusive sole-source engine provider (via the BE-4) to its primary competitor, United Launch Alliance (CO001, CO004, CO008)."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO008"
