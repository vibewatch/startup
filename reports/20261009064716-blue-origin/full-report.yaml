      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence is event based. New Shepard progressed from its first crewed flight in 2021
              to an April 2025 mission that an academic source described as the program's eleventh human flight and
              fifty-eight people carried in total. Separately, NASA funded Blue Origin in the Human Landing System base
              period, and later public summaries describe a Blue Moon development contract; ULA is the clearest
              industrial counterparty because BE-4 was selected for Vulcan. None of these facts establishes recurring
              revenue or a common adoption denominator. The named-proof table therefore labels development, integration,
              and flown use separately, and treats the listed set as a sample rather than a complete customer roster.
            claimRefs:
              - CU002
