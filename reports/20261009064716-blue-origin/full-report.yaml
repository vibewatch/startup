      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Durability is the central unresolved customer question. Blue Origin reportedly paused New Shepard tourism
              flights for at least two years in January 2026 to prioritize lunar work, while ARK Invest estimated that
              damage from a New Glenn test-fire explosion could delay the next flight by at least a year. Those
              developments do not prove churn, but they show that customer access and expansion depend on vehicle
              availability, launch infrastructure, and portfolio prioritization. The 2021 GAO record also demonstrates
              that government demand does not guarantee award conversion: funding availability, proposal price, and
              evaluation results shaped NASA's selection. No assigned source provides NRR, GRR, renewals, contract
              duration, top-customer share, or segment revenue. Investors should therefore underwrite the visible
              relationships as milestone-dependent proof, not as a measured recurring cohort.
            claimRefs:
              - CU004
