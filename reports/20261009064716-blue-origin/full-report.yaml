      - number: '5.4'
        title: Maturity, technical risk, and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Maturity evidence is uneven and time-bounded. The NASA paper is credible proof of integrated test and
              instrumentation work, but its results and roadmap are historical. The 2021 GAO decision preserves NASA's
              contemporaneous evaluation concerns about Blue Origin's Human Landing System proposal: passive
              terrain-relative navigation depended on lunar illumination, cryogenic-fluid management relied on immature
              technology, and most required communications links did not close as then designed. Those findings should
              not be presented as current defects, yet they identify the right diligence tests for present programs.
              Meanwhile, AWS and an individual practitioner portfolio repeat platform-scale and productivity claims
              without an independent audit or clear measurement date. The underwriting verdict is therefore that Blue
              Origin demonstrates broad, technically specific capability, while current qualification, operational
              reliability, cybersecurity assurance, and roadmap closure remain material private-evidence requests.
            claimRefs:
              - CE001
              - CE005
