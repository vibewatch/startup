  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Blue Origin does not have one homogeneous customer base. NASA and other government agencies procure
              development and mission capability; United Launch Alliance represents an industrial engine relationship;
              research institutions use payload capacity; and New Shepard has served private spaceflight participants.
              These segments have different buyers, users, procurement cycles, and definitions of adoption. A funded
              development award is not equivalent to production revenue, and a flown passenger is not evidence of
              renewal. Public sources also describe Blue Origin as a buyer of AWS and enterprise software; those reverse
              vendor relationships are excluded from customer proof. The resulting segmentation is therefore useful for
              diligence scoping, but it cannot be converted into a customer count or revenue mix without company
              records.
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU016
