figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological development timeline of Blue Origin from founding through orbital launch and external
      capitalization.
    data:
      items:
        - label: '2000-09: Corporate Founding'
          detail: Jeff Bezos establishes Blue Origin in Kent, Washington, initiating self-funded aerospace development.
          tone: positive
        - label: '2006-11: Goddard Test Flight'
          detail: First low-altitude developmental flight demonstrator launches at Launch Site One in West Texas.
          tone: neutral
        - label: '2015-11: First New Shepard Landing'
          detail: New Shepard achieves vertical takeoff and uncrewed powered booster landing from suborbital space.
          tone: positive
        - label: '2021-07: Crewed Suborbital Flight'
          detail: Flight NS-16 transports Jeff Bezos, Mark Bezos, and passengers past the Karman line.
          tone: positive
        - label: '2023-05: NASA Artemis V Selection'
          detail: NASA awards Blue Origin a $3.4 billion contract to develop the Blue Moon human lunar lander.
          tone: positive
        - label: '2023-09: Executive Leadership Transition'
          detail: Amazon executive Dave Limp is appointed CEO, accelerating production scaling and flight operations.
          tone: neutral
        - label: '2025-01: New Glenn Orbital Maiden Flight'
          detail: Heavy-lift New Glenn achieves orbital insertion on flight NG-1 from Cape Canaveral.
          tone: positive
        - label: '2025-11: ESCAPADE Mars Mission'
          detail: New Glenn launches twin NASA Mars orbiters and successfully recovers first-stage booster at sea.
          tone: positive
        - label: '2026-01: New Shepard Tourism Pause'
          detail: Company suspends suborbital tourism flights to redirect engineering resources to Artemis landers.
          tone: warning
        - label: '2026-05: Launch Complex 36 Explosion'
          detail: BE-4 oxygen valve failure triggers catastrophic static-fire blast damaging Cape Canaveral pad.
          tone: adverse
        - label: '2026-07: External Financing Initiative'
          detail: Reports disclose $10 billion financing round at $130 billion pre-money valuation led by Coatue.
          tone: positive
    approximationNotes: Dates and program descriptions reflect official NASA, company, and reputable financial press documentation.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO008
