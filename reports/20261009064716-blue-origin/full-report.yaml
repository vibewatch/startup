      - number: '5.2'
        title: Technical architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest public architecture evidence is subsystem-specific. The NASA paper describes a
              descent-and-landing computer built around a four-core ARM A53 MPSoC, a separate FPGA interface board, and
              cFS applications for navigation, terrain-relative navigation, and guidance. It also records Blue Origin's
              investigation of a RISC-V soft processor in radiation-tolerant FPGA fabric for Blue Moon, making compute
              experimentation a documented differentiator rather than a claim of a finalized production design. BlueGPT
              adds a separate enterprise layer: AWS reports model access, retrieval, databases, containerized runtime,
              serverless automation, and agent orchestration. Together these components suggest a vertically integrated
              engineering model in which mission algorithms, compute trades, proprietary knowledge, simulation, and
              physical design can interact; public evidence does not show a unified production architecture across
              programs.
            claimRefs:
