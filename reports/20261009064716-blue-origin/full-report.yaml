  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational, Quality, and Launch Infrastructure Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Blue Origin's primary operational vulnerability lies in the fragility and single-site concentration of its
              heavy-lift orbital launch infrastructure at Cape Canaveral Space Force Station Space Launch Complex 36
              (CR001, CR002). On May 28, 2026, an integrated static hot-fire test of the New Glenn launch vehicle
              resulted in a catastrophic failure that generated an explosion described by industry observers as among
              the largest in launch vehicle history, destroying or severely crippling core pad infrastructure including
              the primary transporter-erector gantry, lightning tower, and hydraulic cylinders (CR001, CR002).
              Subsequent engineering investigations determined that the failure originated at the main oxygen valve on
              one of the first stage's seven BE-4 engines, exposing component-level quality assurance risks and forcing
              the company to redesign valve hardware and shift upper-stage hot-fire testing to NASA's Stennis Space
              Center B-2 test stand in Mississippi (CR001, CR002). This launchpad downtime directly cascaded into
              commercial and institutional customer schedules, illustrating how single-point launch infrastructure
              bottlenecks freeze revenue realization and compound capital burn across dependent satellite constellation
              deployments such as AST SpaceMobile (CR003, CR004). Even with expansion of satellite manufacturing at the
              1.3-million-square-foot Constellation Park in Hutto, Texas, and a planned $600 million manufacturing
              facility expansion at Rocket Park in Florida, physical launch pad throughput remains the absolute
              gatekeeper for orbital cadence (CR005, CR006).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
      - number: '7.2'
        title: Regulatory Approvals, Airspace Licensing, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Scaling New Glenn operations from developmental demonstrations to commercial viability requires extensive
              regulatory approvals under multi-agency federal oversight (CR007, CR008). Blue Origin's current operations
              at Space Launch Complex 36 are governed by FAA vehicle operator license VOL 24-133, which limits New Glenn
              operations to a maximum of 12 launches and downrange landings per year (CR007). In September 2026, the FAA
              published a Draft Environmental Assessment evaluating Blue Origin's formal application to modify license
              VOL 24-133 to expand allowable annual launch operations by more than fourfold to 50 launches annually, an
              action subject to National Environmental Policy Act review alongside the Department of the Air Force,
              NASA, and the U.S. Coast Guard (CR007). The FAA explicitly noted that completion of the environmental
              review does not guarantee license modification or approval of temporary airspace closures across the
              National Airspace System, where dozens of commercial aircraft routes are affected by Atlantic Ocean launch
              and landing hazard areas (CR007). In federal procurement law, Blue Origin's prior legal protests—such as
              its unsuccessful 2021 GAO protest against NASA's Option A Human Landing System award to SpaceX—highlight
              the firm-fixed-price budget constraints of federal space programs, where agency funding limits dictate
              award structures and require contractors to absorb significant development cost risk (CR008). Furthermore,
              massive physical expansions across Florida and Texas introduce specialized property damage, environmental
              liability, and catastrophic loss exposures that challenge conventional aerospace insurance capacity
              (CR005, CR006).
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
