      - number: '5.3'
        title: Deployment, validation, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Blue Origin's deployment model depends on test infrastructure and supplier governance as much as on
              vehicle design. UEI says it co-developed standardized data-acquisition and control hardware with a single
              software interface spanning hardware-in-the-loop, system-integration-lab, and design-validation uses. That
              partner account supports a concrete integration pattern, though it does not independently quantify
              reliability improvement. Blue Origin's 2024 purchase-order requirements add formal controls: suppliers
              must maintain quality systems subject to purchaser review, flow relevant requirements to sub-tier
              suppliers, and retain conformance records for at least ten years. These documents establish process
              design, not process effectiveness. No assigned source provides defect rates, escape rates, uptime,
              launch-success denominators, support service levels, or audit outcomes across the current product
              portfolio.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE016
