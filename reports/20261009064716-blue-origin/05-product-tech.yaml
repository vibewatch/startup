chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Blue Origin's public technical footprint spans flight-tested precision-landing
    workloads, lunar-compute trade studies, internal AI-assisted engineering, test
    infrastructure, supplier controls, and announced satellite-communications
    manufacturing. The evidence demonstrates real engineering systems and process
    controls, but it does not establish current fleet-wide reliability, qualification
    status, or the production maturity of several newer platforms.
sections:
  - id: "product-surfaces"
    title: "Product surfaces and customer workflow"
    body: >-
      The assigned evidence does not describe a single product; it shows a portfolio
      of mission hardware, enabling software, validation systems, and manufacturing
      programs. NASA's collaborative work places New Shepard in the workflow as a
      host for integrated precision-landing and hazard-avoidance testing, while the
      same work links compute trade studies to Blue Moon. Internally, AWS describes
      BlueGPT as an agent platform used to organize proprietary engineering knowledge
      and tools, and TEAREx as a hardware-design application of that platform. At the
      production edge, an October 2026 announcement relayed by KBTX positions the
      planned Constellation Park campus around satellite and communications programs.
      These are materially different maturity classes: flight-test host, architecture
      study, internal platform, engineering application, and announced capacity should
      not be collapsed into one generalized product-readiness claim.
    claimRefs: ["CE001", "CE002", "CE004", "CE008", "CE009", "CE010", "CE014", "CE015"]
    tableRefs: ["TE001"]
  - id: "technical-architecture"
    title: "Technical architecture and differentiation"
    body: >-
      The strongest public architecture evidence is subsystem-specific. The NASA
      paper describes a descent-and-landing computer built around a four-core ARM A53
      MPSoC, a separate FPGA interface board, and cFS applications for navigation,
      terrain-relative navigation, and guidance. It also records Blue Origin's
      investigation of a RISC-V soft processor in radiation-tolerant FPGA fabric for
      Blue Moon, making compute experimentation a documented differentiator rather
      than a claim of a finalized production design. BlueGPT adds a separate enterprise
      layer: AWS reports model access, retrieval, databases, containerized runtime,
      serverless automation, and agent orchestration. Together these components suggest
      a vertically integrated engineering model in which mission algorithms, compute
      trades, proprietary knowledge, simulation, and physical design can interact;
      public evidence does not show a unified production architecture across programs.
    claimRefs: ["CE002", "CE003", "CE004", "CE008", "CE010"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "deployment-validation-quality"
    title: "Deployment, validation, and quality controls"
    body: >-
      Blue Origin's deployment model depends on test infrastructure and supplier
      governance as much as on vehicle design. UEI says it co-developed standardized
      data-acquisition and control hardware with a single software interface spanning
      hardware-in-the-loop, system-integration-lab, and design-validation uses. That
      partner account supports a concrete integration pattern, though it does not
      independently quantify reliability improvement. Blue Origin's 2024 purchase-order
      requirements add formal controls: suppliers must maintain quality systems subject
      to purchaser review, flow relevant requirements to sub-tier suppliers, and retain
      conformance records for at least ten years. These documents establish process
      design, not process effectiveness. No assigned source provides defect rates,
      escape rates, uptime, launch-success denominators, support service levels, or
      audit outcomes across the current product portfolio.
    claimRefs: ["CE011", "CE012", "CE013", "CE016"]
    tableRefs: ["TE002"]
  - id: "maturity-risk-verdict"
    title: "Maturity, technical risk, and diligence verdict"
    body: >-
      Maturity evidence is uneven and time-bounded. The NASA paper is credible proof
      of integrated test and instrumentation work, but its results and roadmap are
      historical. The 2021 GAO decision preserves NASA's contemporaneous evaluation
      concerns about Blue Origin's Human Landing System proposal: passive
      terrain-relative navigation depended on lunar illumination, cryogenic-fluid
      management relied on immature technology, and most required communications links
      did not close as then designed. Those findings should not be presented as current
      defects, yet they identify the right diligence tests for present programs.
      Meanwhile, AWS and an individual practitioner portfolio repeat platform-scale
      and productivity claims without an independent audit or clear measurement date.
      The underwriting verdict is therefore that Blue Origin demonstrates broad,
      technically specific capability, while current qualification, operational
      reliability, cybersecurity assurance, and roadmap closure remain material
      private-evidence requests.
    claimRefs: ["CE001", "CE005", "CE006", "CE007", "CE009", "CE016"]
