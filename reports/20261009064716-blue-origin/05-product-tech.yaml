      - ["BlueGPT platform", "Provides model access, retrieval, agent orchestration, runtime, and workflow automation", "AWS services, proprietary knowledge bases, and internal tools", "Security, export-control, model-risk, and vendor-dependency evidence is not audited"]
      - ["Validation infrastructure", "Connects HIL, SIL, data acquisition, and control workflows", "UEI standardized hardware and one software API", "Partner-only outcome evidence and integration concentration"]
      - ["Supplier quality layer", "Defines conformance, review, traceability, and records controls", "Supplier and sub-tier implementation", "Control effectiveness and escape-rate data are private"]
    notes: >-
      This is a component map assembled from separate cited systems, not evidence that
      every layer is integrated into one production stack.
    claimRefs: ["CE003", "CE004", "CE008", "CE011", "CE012", "CE013"]
