callouts:
  - calloutType: "risk"
    title: "Current qualification evidence is the gating diligence item"
    body: >-
      Historical NASA and GAO records provide unusually specific technical evidence,
      but they cannot establish the present design baseline. Require current
      configuration-controlled architecture, qualification results, reliability
      denominators, security audits, and roadmap closure by program.
    claimRefs: ["CE005", "CE006", "CE007", "CE016"]
