company:
  name: "Blue Origin"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Blue Origin addresses several distinct markets rather than one defensible aggregate TAM:
    launch and propulsion, lunar transport, in-space infrastructure, and enterprise/government
    connectivity. The clearest current sizing evidence is operational rather than monetary,
    while TeraWave adoption remains constrained by technology maturity, terminal economics,
    weather resilience, deployment timing, and uncertain demand absorption.
sections:
  - id: "market-boundary"
    title: "Market boundary: several businesses, not one TAM"
    body: >-
      Blue Origin should not be valued against a single broad "space economy" estimate. Its
      addressable activity spans reusable orbital launch, rocket-engine supply, lunar transport,
      in-space logistics and stations, and satellite connectivity; each has a different buyer,
      procurement cycle, competitive set, and revenue unit. For near-term market analysis, the
      core boundary includes New Glenn launch services, BE-4 propulsion supply, NASA lunar
      transport, and TeraWave enterprise/government connectivity. Space tourism, orbital data
      centers, resource extraction, and commercial stations are adjacencies rather than proven
      serviceable markets. Status-quo substitutes include terrestrial fiber, existing satellite
      constellations, incumbent launch providers, and internally procured government programs.
      This boundary prevents launch backlog, connectivity users, government appropriations, and
      private valuation from being added as if they shared a denominator.
    claimRefs: [CM001, CM002, CM005]
    tableRefs: [TM001]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The assigned evidence does not support a revenue TAM, SAM, or SOM for Blue Origin. It
      instead supplies bounded demand indicators: TeraWave is described as targeting roughly
      100,000 customers, while a McKinsey participant estimated roughly 100,000 off-site
      enterprises and up to 300 million small businesses globally that could benefit from better
      connectivity. Those populations are not revenue, contracted customers, or mutually
      additive. Launch demand is more concrete but still indirect: Payload reported more than 70
      Vulcan launches sold, including 38 Amazon Kuiper missions, while GAO records show that
      public lunar procurement is constrained by annual appropriations and milestone-payment
      capacity. The figure therefore presents an opportunity-to-realization ladder, not a
      proportional market funnel or management forecast.
    claimRefs: [CM003, CM006, CM012, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption"
    title: "Buyers, budget owners, and adoption path"
    body: >-
      The connectivity wedge is narrower than mass-market broadband: analysts characterize
      TeraWave as middle-mile or backbone infrastructure for enterprises, governments, cloud
      regions, and remote industrial sites rather than consumer last-mile access. Network,
      cloud-infrastructure, and public-procurement budgets would therefore govern adoption, with
      resilience, path diversity, terrestrial coverage gaps, and automation as triggers. Launch
      buyers are satellite operators and government mission owners; propulsion buyers are launch
      primes; lunar transport is funded through NASA program appropriations. Across these
      segments, adoption is staged through technical qualification, terminal availability,
      launch cadence, service-level proof, and procurement approval. The buyer map deliberately
      keeps user, payer, and budget owner separate because a data-center operator, mission user,
      and government contracting office do not make the same purchase decision.
    claimRefs: [CM005, CM006, CM007, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, constraints, and valuation relevance"
    body: >-
      Growth could come from resilient enterprise connectivity, sovereign demand, AI-driven data
      movement, remote industrial automation, and vertical integration between launch and network
      operations. Evidence also argues against near-term extrapolation. One analyst said aggregate
      non-geostationary capacity exceeds even optimistic demand projections, another did not
      expect material TeraWave launches this decade, and participants identified Q/V-band terminal
      supply, rain fade, optical-link maturity, and high capital intensity as gating factors.
      Orbital data-center upside was described as mainly post-2030 and far from commercial
      maturity. Reported private valuations also differ by timing and financing basis, so neither
      $130 billion nor approximately $140 billion is a market-size datapoint. Valuation should
      therefore reward verified backlog and deployment milestones, not convert broad beneficiary
      populations or private-round pricing into revenue.
    claimRefs: [CM008, CM009, CM010, CM011, CM015, CM016]
