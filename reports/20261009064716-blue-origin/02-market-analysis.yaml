      - ["NASA lunar exploration", "NASA program and contracting office", "Astronaut, science, and mission teams", "U.S. government", "Develop, demonstrate, and operate lunar transport", "Congressional appropriation and program allocation", "Technical value, milestone affordability, and available annual funds"]
      - ["Launch-prime propulsion", "Launch vehicle prime contractor", "Vehicle engineering and production teams", "Prime contractor", "Integrate and procure flight-qualified engines", "Vehicle development and production budget", "Engine qualification, delivery cadence, and total system economics"]
    notes: "Buyer roles are analytical mappings from the cited procurement, launch-backlog, and connectivity evidence; private contract terms and segment spending are not public."
    claimRefs: [CM005, CM006, CM007, CM012, CM013, CM014]
figures:
  - id: "FM001"
    title: "Opportunity-to-realization sizing ladder"
    type: "pyramid"
    summary: "Broad beneficiary populations narrow through target customers, deployment readiness, and disclosed economics before becoming a serviceable market."
    data:
      items:
        - label: "Broad connectivity exposure"
          value: 300000000
          unit: "small businesses, up to"
          detail: "A broad analyst estimate of potential beneficiaries, not addressable spend."
        - label: "Remote-enterprise proxy"
          value: 100000
          unit: "off-site enterprises, roughly"
          detail: "Potential industrial and remote-site users; geography and affordability are not resolved."
        - label: "TeraWave stated target"
          value: 100000
          unit: "customers, around"
          detail: "A service-positioning target, not contracted customers or revenue."
        - label: "Technically reachable customers"
          value: "Not disclosed"
          unit: "customers"
          detail: "Depends on terminal availability, Q/V-band resilience, optical-link maturity, and coverage."
        - label: "Commercially serviceable market"
          value: "Not disclosed"
          unit: "annual spend"
          detail: "Pricing, contract value, churn, and customer deployment timing are unavailable."
        - label: "Realized near-term revenue"
          value: "Not disclosed"
          unit: "revenue"
          detail: "Analysts question demand absorption and expect appreciable deployment no earlier than the 2030s."
    approximationNotes: "The first three values retain source populations; lower layers are explicit gaps, so widths must not be read as conversion rates or additive market value."
    claimRefs: [CM003, CM006, CM008, CM009, CM010, CM011]
callouts:
  - calloutType: "risk"
    title: "Do not capitalize the beneficiary pool"
    body: >-
      The 300 million small-business figure is a broad exposure estimate, while the roughly
      100,000 off-site-enterprise and TeraWave-customer figures use different definitions.
      Without pricing, contracted demand, terminal economics, and deployment timing, none is a
      defensible revenue TAM or SOM.
    claimRefs: [CM003, CM006, CM007, CM008]
