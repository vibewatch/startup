schemaVersion: "report-v2"
artifact: customers
slug: blue-origin
runDate: 2026-10-09
company:
  name: Blue Origin
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows several distinct customer surfaces: government-funded development,
    launch and engine relationships, research payloads, and private spaceflight participants.
    The evidence is strongest for named counterparties and completed missions, but it does not
    disclose retention, segment revenue, pricing, or customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      Blue Origin does not have one homogeneous customer base. NASA and other government
      agencies procure development and mission capability; United Launch Alliance represents
      an industrial engine relationship; research institutions use payload capacity; and New
      Shepard has served private spaceflight participants. These segments have different buyers,
      users, procurement cycles, and definitions of adoption. A funded development award is not
      equivalent to production revenue, and a flown passenger is not evidence of renewal. Public
      sources also describe Blue Origin as a buyer of AWS and enterprise software; those reverse
      vendor relationships are excluded from customer proof. The resulting segmentation is
      therefore useful for diligence scoping, but it cannot be converted into a customer count or
      revenue mix without company records.
    claimRefs: [CU001, CU005, CU007, CU008, CU009, CU010, CU016]
    tableRefs: [TU001]
  - id: adoption-and-named-proof
    title: Adoption trajectory and named proof
    body: >-
      The clearest adoption evidence is event based. New Shepard progressed from its first crewed
      flight in 2021 to an April 2025 mission that an academic source described as the program's
      eleventh human flight and fifty-eight people carried in total. Separately, NASA funded Blue
      Origin in the Human Landing System base period, and later public summaries describe a
      Blue Moon development contract; ULA is the clearest industrial counterparty because BE-4
      was selected for Vulcan. None of these facts establishes recurring revenue or a common
      adoption denominator. The named-proof table therefore labels development, integration, and
      flown use separately, and treats the listed set as a sample rather than a complete customer
      roster.
    claimRefs: [CU002, CU003, CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration risk
    body: >-
      Durability is the central unresolved customer question. Blue Origin reportedly paused New
      Shepard tourism flights for at least two years in January 2026 to prioritize lunar work,
      while ARK Invest estimated that damage from a New Glenn test-fire explosion could delay the
      next flight by at least a year. Those developments do not prove churn, but they show that
      customer access and expansion depend on vehicle availability, launch infrastructure, and
      portfolio prioritization. The 2021 GAO record also demonstrates that government demand does
      not guarantee award conversion: funding availability, proposal price, and evaluation results
      shaped NASA's selection. No assigned source provides NRR, GRR, renewals, contract duration,
      top-customer share, or segment revenue. Investors should therefore underwrite the visible
      relationships as milestone-dependent proof, not as a measured recurring cohort.
    claimRefs: [CU004, CU006, CU011, CU012, CU013, CU014, CU015]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale evidence
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - Civil government
        - NASA procurement officials; astronauts and science programs as users; U.S. government as payer
        - Human landing systems, science missions, and technology development
        - Funded HLS base-period work and later public Blue Moon contract reporting
        - Large strategic programs, but milestone and appropriation dependent
        - Blue Origin-specific recognized revenue, backlog quality, and termination rights are undisclosed
      - - Industrial launch systems
        - ULA as buyer and integrator; launch customers as downstream users
        - BE-4 engines for Vulcan
        - Independent trade coverage says BE-4 was selected for Vulcan
        - Production relationship and channel leverage beyond Blue Origin vehicles
        - Unit deliveries, pricing, warranty exposure, and renewal terms are undisclosed
      - - Private spaceflight
        - Individual participants or sponsors as payers; passengers as users
        - Short-duration suborbital human spaceflight
        - Eleven human flights and fifty-eight people reported through April 2025
        - Brand, flight revenue, and demand discovery
        - Pricing, paid-versus-sponsored mix, waitlist conversion, and post-pause demand are undisclosed
      - - Research and payload users
        - Universities, laboratories, NASA centers, and commercial payload owners
        - Microgravity, lunar-gravity simulation, and technology payload missions
        - Public mission history names multiple institutions and payload flights
        - Diversifies utilization beyond passengers
        - Paid status, repeat usage, payload revenue, and capacity utilization are undisclosed
    notes: >-
      Segment labels combine distinct public relationships; no source provides a common customer,
      revenue, or time denominator, so scale descriptions must not be summed.
    claimRefs: [CU001, CU002, CU005, CU007, CU008, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - First crewed New Shepard flight
        - One completed crewed mission
        - "2021-07-20"
        - Wikipedia summary
        - Medium
        - Establishes transition from testing to human use
        - No passenger revenue, bookings, or repeat-use denominator
      - - New Shepard human-flight activity
        - Eleventh human flight; fifty-eight people carried
        - "2025-04-14"
        - Springer academic article
        - Medium
        - Demonstrates repeated execution through the stated date
        - People carried is not paying-customer count, retention, or utilization
      - - Tourism availability
        - Paused for two years or more
        - 2026-01
        - Wikipedia summary
        - Low
        - Reduces near-term access for the private-passenger segment
        - No affected-booking count, refunds, or backlog value
      - - NASA HLS base-period awards
        - $967 million cumulative across Blue Origin, Dynetics, and SpaceX
        - 2020
        - U.S. GAO decision
        - High
        - Confirms funded development participation, not Blue Origin-only revenue
        - Blue Origin share and recognized revenue are not stated in this record
    notes: >-
      Values retain each source's period and denominator; the $967 million amount is cumulative
      across three contractors and must not be attributed to Blue Origin alone.
    claimRefs: [CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment or use case
      - Production vs pilot
      - Public outcome
      - Limitation
    rows:
      - - NASA
        - Civil government
        - Human Landing System base-period design and development
        - Funded development
        - Blue Origin received one of three base-period awards
        - GAO later upheld Blue Origin's non-selection for the 2021 Option A award
      - - NASA
        - Civil government
        - Blue Moon landing system for Artemis V
        - Development with an uncrewed test planned before a crewed mission
        - Public summary reports a $3.4 billion contract and a 2029 crewed landing plan
        - Current milestone completion and recognized revenue are not disclosed here
      - - United Launch Alliance
        - Industrial launch systems
        - BE-4 engines for Vulcan
        - Production and vehicle integration relationship
        - Independent trade coverage identifies BE-4 as Vulcan's selected engine
        - Delivery cadence, unit economics, and contract duration are not public in the assigned evidence
      - - Purdue University, JPL, and NASA Glenn Research Center
        - Research and payload users
        - Payloads on the New Shepard NS-29 cargo flight
        - Flown payload use
        - Public mission history lists the institutions among payload providers
        - Paid customer status, payload value, and repeat usage are not disclosed
    notes: >-
      Sample of named public relationships in assigned sources, not an exhaustive customer list;
      development awards, counterparties, and payload users are not treated as equivalent revenue customers.
    enumerationScope:
      coverage: sample
      basis: >-
        Named relationships visible in the eight assigned prefetched sources through the 2026-10-09 run date.
    claimRefs: [CU001, CU005, CU006, CU007, CU008]
figures:
  - id: FU001
    title: Customer proof and expansion journey
    type: journey-map
    summary: >-
      Public proof advances from procurement or booking through development and flight, but repeat
      use remains exposed to infrastructure, funding, and portfolio-priority constraints.
    data:
      items:
        - label: Requirement or booking
          detail: >-
            Government mission requirements, industrial integration needs, payload objectives, or
            private-participant demand initiate the relationship.
          touchpoints:
            - Government solicitations
            - Engine selection
            - Payload manifests
            - Passenger bookings
        - label: Evaluation and funding
          detail: >-
            Technical evaluation, available funding, price, and contract structure determine whether
            demand converts into funded work.
          touchpoints:
            - Proposal evaluation
            - Appropriations
            - Milestone negotiation
        - label: Development or integration
          detail: >-
            Customer proof remains pre-production until engines, landers, payloads, or mission systems
            complete development and integration.
          touchpoints:
            - Engine integration
            - Lander development
            - Cloud and mission systems
        - label: Demonstration or flight
          detail: >-
            Completed flights and payload missions are stronger adoption proof than logos or announced
            plans, but do not disclose economics.
          touchpoints:
            - Crewed mission
            - Payload flight
            - Vehicle demonstration
        - label: Repeat use or expansion
          detail: >-
            Repeat missions, production deliveries, and follow-on awards would evidence durability,
            but public cohort and renewal metrics are absent.
          touchpoints:
            - Follow-on award
            - Repeat manifest
            - Production cadence
        - label: Disruption or reprioritization
          detail: >-
            Launch-site damage, vehicle availability, and portfolio shifts can interrupt service and
            defer otherwise visible demand.
          touchpoints:
            - Tourism pause
            - Launch-site outage
            - Program reprioritization
    approximationNotes: >-
      Conceptual sequence based on public relationship milestones; it is not a measured conversion
      funnel and implies no conversion rate or shared population.
    claimRefs: [CU009, CU014, CU015]
callouts:
  - calloutType: risk
    title: Adoption is visible, retention is not
    body: >-
      Named contracts, counterparties, passengers, and payloads establish real use, but the assigned
      evidence does not disclose NRR, GRR, churn, renewals, segment revenue, or concentration.
    claimRefs: [CU011, CU012]
