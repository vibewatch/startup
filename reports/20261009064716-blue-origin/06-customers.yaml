  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Segment-level NRR, GRR, churn, renewal rates, contract length, repeat-purchase behavior,
        passenger backlog conversion, and payload reflight cohorts.
      whyItMatters: >-
        Named missions and awards demonstrate activity but cannot establish recurring demand or
        relationship durability without comparable cohorts.
      diligencePath: >-
        Obtain CRM exports, contract schedules, renewal histories, passenger booking and refund
        records, and payload manifests segmented by payer and product.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A complete customer and counterparty roster with payer status, contract value, deployment
        stage, recognized revenue, and latest activity date.
      whyItMatters: >-
        Publicly named relationships mix customers, partners, users, and funded development programs,
        preventing a defensible customer count or concentration analysis.
      diligencePath: >-
        Reconcile signed contracts, invoices, backlog, mission manifests, and partner agreements to a
        single account-level customer ledger.
      relatedQuestionRefs: [QU003, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-one, top-five, and top-ten customer revenue shares by segment, together with government
        versus commercial revenue and backlog concentration.
      whyItMatters: >-
        Dependence on milestone-funded government programs or a small number of industrial
        counterparties could make reported demand less diversified than the visible relationship set.
      diligencePath: >-
        Request audited segment revenue, customer-level billings, backlog aging, cancellation rights,
        and scenario analysis for loss or delay of each major counterparty.
      relatedQuestionRefs: [QU005]
