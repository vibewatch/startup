evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-market-sizing
    missingEvidence: >-
      Segment-level pricing, contracted units, revenue, backlog conversion, renewal rates, and geographic serviceability
      needed to calculate revenue TAM, SAM, and SOM.
    whyItMatters: Population and launch-count proxies cannot establish recurring revenue potential or an achievable market share.
    diligencePath: >-
      Obtain management's segment model, customer pipeline, signed backlog, price books, deployment schedule, and cohort
      assumptions; reconcile each to contracts and invoices.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: TeraWave-unit-economics
    missingEvidence: >-
      TeraWave terminal pricing, service pricing, capacity utilization, customer commitments, and cost per delivered
      bit.
    whyItMatters: >-
      Demand can only be converted into serviceable spend after affordability, reliability, and capacity economics are
      known.
    diligencePath: >-
      Request customer LOIs, terminal BOM and production yields, network-capacity model, service-level targets, and
      price-volume scenarios.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: minor
    topic: valuation-basis
    missingEvidence: >-
      Final financing documents defining pre-money versus post-money valuation, round close date, and fully diluted
      capitalization.
    whyItMatters: >-
      Public reports cite $130 billion and approximately $140 billion on different apparent bases, neither of which
      measures market demand.
    diligencePath: Review the executed financing documents and capitalization table rather than relying on secondary articles.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash and restricted cash, monthly burn, runway, committed capital expenditure, and next-round trigger.
    whyItMatters: A funding headline cannot establish spendable liquidity or survival through program delays.
    diligencePath: Review bank statements, treasury reports, board-approved budgets, downside forecasts, and financing covenants.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: program-unit-economics
    missingEvidence: >-
      Gross margin and contribution margin by New Glenn launch, BE-4 engine, Blue Moon milestone, and New Shepard
      flight.
    whyItMatters: Top-line growth does not show whether any program generates gross profit or operating cash.
    diligencePath: >-
      Obtain program P&Ls, bill-of-materials cost, labor absorption, refurbishment cost, warranty reserves, and
      cost-to-complete schedules.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Audited 2025 revenue, 2026 year-to-date revenue, segment mix, accounting policies, bookings, backlog, and cash
      collections.
    whyItMatters: The reported revenue figures cannot be reconciled to milestones, launches, deliveries, or cash.
    diligencePath: >-
      Review audited statements, revenue footnotes, customer invoices, deferred revenue, and remaining performance
      obligations.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
