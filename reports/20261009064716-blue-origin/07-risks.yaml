callouts:
  - calloutType: "risk"
    title: "Critical Infrastructure Vulnerability at Space Launch Complex 36"
    body: "The May 28, 2026 static-fire catastrophic failure demonstrated that launchpad infrastructure represents Blue Origin's most acute single point of failure (CR001, CR002). Unlike established competitors operating multiple orbital pads across multiple spaceports, New Glenn's near-term flight manifest relies exclusively on SLC-36 at Cape Canaveral (CR001, CR007). Any future static-fire or launch anomaly that inflicts structural damage on the transporter-erector or umbilical towers directly enforces a multi-quarter freeze on commercial launch operations, engine testing, and customer satellite deployments (CR002, CR004)."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR007"
  - calloutType: "insight"
    title: "External Capital Infusion Reshapes Corporate Governance and Execution Discipline"
    body: "Initiating a $10 billion external funding round at a $130 billion pre-money valuation breaks Jeff Bezos' 26-year tradition of sole founder equity financing (CR009). While providing necessary capital insulation to absorb launchpad repairs and scale satellite constellations, institutional investors such as Coatue Management introduce strict return hurdles, milestone oversight, and public market benchmarks that diminish management's historical freedom to pursue open-ended multi-decade R&D timelines without commercial visibility (CR009, CR010)."
    claimRefs:
      - "CR009"
      - "CR010"
