  topStrengths:
    - Strategic position across heavy-lift launch, lunar logistics, and national-security access.
    - New Glenn, BE-4, and Blue Moon create a differentiated full-stack space platform.
    - A large 2026 capital infusion and Bezos backing reduce near-term funding risk.
  topRisks:
    - Execution and capex intensity remain extreme relative to current operating scale.
    - Launchpad and vehicle reliability setbacks can delay cadence and compress milestones.
    - The valuation already discounts major future success, leaving little margin for error.
  unresolvedGaps:
    - Audited cap-table waterfall, liquidation preferences, and exact protective voting provisions negotiated in the $10B round.
    - Audited gross margins on commercial New Glenn launches and unit manufacturing economics of BE-4 production engines.
