companyProfile:
  summary: Blue Origin is a private U.S. aerospace manufacturer and spaceflight services provider founded by Jeff Bezos in 2000. The company builds reusable launch vehicles, rocket engines, and lunar infrastructure, serving government and commercial customers while scaling toward heavier lift cadence and broader space-program participation.
