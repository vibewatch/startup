callouts:
  - calloutType: "risk"
    title: "Financing is not runway"
    body: "The reported outside round expands the funding base, but proceeds received, restrictions, committed uses, burn, and debt are unknown. Treating the headline raise as cash available would overstate capital adequacy."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
  - calloutType: "recommendation"
    title: "Gate underwriting on program-level economics"
    body: "Require audited revenue reconciliation, gross margin by program, backlog conversion, launch and engine contribution margins, and a downside liquidity case before assigning value to the 2030 revenue projection."
