company:
  name: "Blue Origin"
chapter:
  number: 4
  title: "Financials"
  summary: "Third-party reporting puts 2025 revenue at $800 million, a 2026 expectation of $1.4 billion, and an internal 2030 ambition above $30 billion. A reported roughly $10 billion first outside financing strengthens the capital base, but audited revenue, margins, cash, burn, runway, debt, and program-level economics remain unavailable in the assigned public evidence."
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is diversified but milestone-dependent"
    body: >-
      Blue Origin has four evidenced monetization paths rather than one homogeneous revenue
      engine. It supplies BE-4 engines to United Launch Alliance, operates New Glenn for orbital
      missions, has flown passengers and payloads on New Shepard, and holds a $3.4 billion
      firm-fixed-price NASA Blue Moon contract (CI001, CI002, CI003, CI005). These streams have
      different units and recognition triggers: an engine delivery is not a launch, a launch is
      not a development milestone, and a contract award is not recognized revenue. New Shepard's
      tourism pause for two years or more also removes a previously active passenger channel while
      resources shift toward lunar work (CI004). The resulting mix could diversify demand, but the
      assigned evidence does not disclose segment revenue, backlog conversion, cancellation terms,
      or accounting policy. Revenue quality therefore depends on accepted milestones, reliable
      flight cadence, and manufacturing delivery rather than headline contract value alone.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "traction-and-pricing"
    title: "Reported growth is substantial, but pricing evidence is thin"
    body: >-
      A syndicated financial report says Blue Origin generated $800 million of revenue in 2025,
      expects $1.4 billion in 2026, and internally projects more than $30 billion of annual revenue
      by 2030 (CI006, CI007, CI008). These are revenue measures, not ARR, bookings, cash receipts,
      or gross profit. The 2030 figure is an internal projection and the assigned evidence provides
      no bridge from current launch cadence, engine output, or contract milestones to that target.
      Public pricing is similarly sparse. The clearest disclosed monetization term is the
      $3.4 billion firm-fixed-price Blue Moon contract; a historical GAO record also shows Blue
      Origin's unsuccessful 2021 HLS Option A proposal at $5.995 billion versus SpaceX at
      $2.941 billion (CI005, CI015). Those government figures are useful contracting benchmarks,
      not evidence of present realized pricing for New Glenn, BE-4, or New Shepard.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI015"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy"
    title: "Outside funding reduces founder dependence without proving runway"
    body: >-
      CNBC reported in July 2026 that Blue Origin was raising about $10 billion in its first
      outside round at a $130 billion valuation, including $2 billion from Jeff Bezos and about
      $4 billion from Coatue Management (CI009, CI012). The closing status evolved across the
      assigned evidence: Forge said in August that the round apparently had not closed, while
      Bloomberg reporting syndicated by Moneyweb said in October that the company had recently
      raised $10 billion (CI010, CI011). That sequencing is consistent with progress toward a
      close, but final financing documents, proceeds received, dilution, preferences, and use of
      funds are not public in this pool. Funding raised must not be treated as cash available or
      runway. Cash on hand, monthly burn, debt, project-finance obligations, restricted cash, and
      committed capital expenditure are all still underwriting gaps.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "economics-and-verdict"
    title: "Financial verdict: credible scale signals, insufficient unit economics"
    body: >-
      The public record supports commercial activity and access to capital, but not a defensible
      margin or cash-flow model. The May 2026 New Glenn static-fire explosion damaged launchpad
      infrastructure, illustrating how a technical failure can interrupt delivery while adding
      repair capital needs (CI013). A low-reputation Quora discussion characterizes Blue Origin's
      development style as infrastructure-heavy and slower-cadence; it is useful only as an
      adverse hypothesis, not an independent operating benchmark (CI014). Craft's comparison page
      lists Blue Origin revenue as N/A even while publishing peer estimates, which demonstrates
      the limits of aggregator coverage rather than contradicting the separately reported
      $800 million figure (CI016). The investable conclusion is therefore conditional: revenue
      scale may be emerging, but gross margin, contribution margin by program, cash conversion,
      working capital, and capital intensity must be verified directly before revenue quality or
      financing sufficiency can be underwritten.
    claimRefs:
      - "CI006"
      - "CI009"
      - "CI013"
      - "CI014"
      - "CI016"
