      "id": "competitive-landscape-overview",
      "title": "Competitive landscape: direct, incumbent, adjacent, and substitute alternatives",
      "body": "Proof's competitive environment spans four distinct competitor classes that a diligence analyst must disaggregate carefully. The first class is direct RON peers: OneNotary, NotaryCam, SIGNiX, BlueNotary, and Pavaso all offer remote online notarization products aimed at the same transaction. Each competes on price, notary-network depth, or vertical focus, but none has disclosed a GMV figure approaching Proof's publicly cited cumulative real-estate volume. The second class is the dominant eSignature incumbent: DocuSign. As a public company with 1.7 million paying customers and adoption by 95% of Fortune 500 companies, DocuSign has the distribution, brand, and enterprise integration depth to compete for any agreement-workflow budget. DocuSign offers Electronic Notarization as a listed product capability alongside eSignature, and its 2021 acquisition of LiveOak Technologies gave it a live-video collaboration layer for signing sessions. DocuSign's pricing includes an ID-verification add-on at $2.50 per attempt, directly competing with Proof's Identify product. The third class is identity-only substitutes: Socure and Jumio. These platforms have built large-scale identity and fraud decisioning stacks serving thousands of enterprise customers in financial services, gaming, healthcare, and other sectors. An enterprise could theoretically layer Socure's Predictive DocV and Digital Intelligence on top of DocuSign eSignature without purchasing Proof's notarization layer. The fourth class is the status quo and internal build alternative: most notarization transactions in the United States are still conducted with ink-and-paper notaries, and large institutions with compliance teams sometimes build proprietary identity or signing workflows rather than purchasing a vendor solution. The addressable notary market covers more than one billion transactions annually in the US according to SIGNiX's own homepage messaging, suggesting that pen-and-ink incumbent notarization remains the largest competitive force overall. Likely entrants include Adobe, which already offers Adobe Acrobat Sign and has access to a large enterprise customer base, and large financial infrastructure providers that could acquire an RON vendor to add RON capability.",
