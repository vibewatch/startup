      "id": "switching-costs-lock-in-and-moat-durability",
      "title": "Switching costs, lock-in, moat durability, and displacement risk",
      "body": "Proof's competitive durability rests on several interacting lock-in forces. The first is the qualified-notary network, where Proof's years of notary recruitment, training, and commissioning management create a supply asset that competitors must replicate from scratch. BlueNotary's 20,000-plus notary claim shows that notary supply is contestable at consumer price points, but enterprise-grade on-demand availability at scale with defensible quality and fraud monitoring is harder to replicate. The second is title-underwriter and lender integration: real-estate closings require underwriter acceptance of the RON platform used, and each underwriter approval is an operational relationship that takes time to establish. Proof's $640 billion in cumulative real-estate transactions and sustained use by title agencies gives it underwriter trust that newer entrants must earn. The third is the identity and fraud data flywheel: each identity verification, notarization session, and fraud-defense outcome contributes to Proof's fraud-detection models. The IDEMIA biometrics partnership and Visa fraud-intelligence relationship add external data enrichment that compounds the data advantage. The fourth is enterprise workflow integration: API relationships, SSO provisioning, and SLA-backed enterprise contracts create multi-year stickiness. Adverse competitive evidence worth noting includes: Proof itself cut 25% of staff in 2022 during the housing market downturn, signaling real-estate concentration risk and operational fragility under volume stress. DocuSign laid off approximately 10% of its workforce in 2024, illustrating that even the dominant player faces profitability pressure in the eSignature category, and is now accelerating feature consolidation under its IAM platform umbrella—a strategic move that compresses the space available for Proof to grow as a separate signing and identity vendor. Commoditization risk is real at the transaction layer: $25 flat-rate notarization is available from OneNotary, which matches Proof's Notarize entry price and signals that per-transaction RON pricing is already commoditized. Proof's platform pivot toward recurring identity-assurance revenue is therefore strategically necessary, not optional, to escape transaction-price erosion. Multi-homing is relatively easy in the identity layer: an enterprise can run Socure for onboarding, DocuSign for contract signing, and Proof for high-assurance notarization independently, which limits Proof's ability to grow wallet share unless it delivers clear cost or risk savings that outweigh integration overhead.",
