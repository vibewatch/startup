    "title": "Competitors",
    "summary": "Proof competes across three distinct layers: a core RON layer where it leads by volume and compliance depth; a broader secure-agreement layer where DocuSign is the dominant incumbent; and an emerging identity-assurance layer where Socure and Jumio are purpose-built challengers. Specialty RON vendors OneNotary, NotaryCam, BlueNotary, Pavaso, and SIGNiX collectively confirm the market exists but none has matched Proof's GMV scale or breadth. Proof's strongest moat is the combination of notary network, real-estate distribution integrations, fraud-intelligence partnerships, and an emerging reusable-identity layer that no single RON peer replicates. The primary displacement risk is DocuSign deepening its notary and identity features using its 1.7 million customer base and deep enterprise relationships."
