    {
      "id": "competitor-profiles-scale-and-strategy",
      "title": "Competitor profiles: scale, funding, pricing, and strategic direction",
      "body": "DocuSign (DOCU, Nasdaq) is the most consequential competitor. It is publicly traded, has disclosed annual revenue exceeding $2.7 billion in fiscal 2024, and its IAM platform now packages eSignature, Contract Lifecycle Management, Agreement Manager, Iris AI, Workflow Builder, Web Forms, and Electronic Notarization into one subscription suite. DocuSign's standard eSignature plans are priced at $15 to $40 per user per month for annual subscriptions, with identity-verification available as a pay-per-use add-on at $2.50 per attempt. The company serves 1.7 million customers and has stated that 95% of Fortune 500 companies use Docusign. Its compliance posture is strong, covering ISO 27001, FedRAMP, APEC PPP, PCI DSS, and SSAE 18. DocuSign's strategic direction in 2024 to 2026 has been to unify agreement workflows under an AI-powered IAM platform rather than selling eSignature alone, which means its product scope is expanding toward, not away from, the trust and automation layers where Proof competes. OneNotary is a consumer-grade RON vendor with a $25 per-session flat price, no enterprise pricing published, and a three-step ID process combining KBA, credential analysis, and notary verification. NotaryCam prices at $175 per document with a $50 surcharge per additional signer, operates in all US states, and markets a white-label licensing model for enterprises and title companies that want to build RON into their own workflows. NotaryCam's enterprise page highlights NIST IAL2 compliance and overflow coverage. SIGNiX, based in Chattanooga Tennessee, provides eNotaryDoX as a remote electronic notarization service; its homepage states that more than one billion notary transactions occur in the US annually, framing the market opportunity but the company discloses no customer, revenue, or funding data publicly. BlueNotary claims 20,000-plus certified online notaries on its platform, offers 24/7 on-demand notarization, and cites $450 or more in cost savings per eClosing transaction. BlueNotary's pricing page shows two notary-side models: no-brand sessions at $5 to $10 per session and branded sessions at $10 to $150-plus. Pavaso is a 10-plus year eClosing platform focused entirely on real estate, supporting lenders, title companies, and attorneys through collaborative full-digital, hybrid, or in-person eClosing workflows; it supports RON, IPEN, and RIN depending on jurisdiction. Socure serves 3,000-plus enterprise customers with a vertically integrated identity and risk platform anchored by Predictive DocV, Digital Intelligence, SNA and OTP, eCBSV, and Socure Verify; it was named to the CNBC Disruptor 50 and is backed by institutional investors. Jumio offers identity verification, biometric liveness detection, and AML-KYC compliance across financial services, gaming, crypto, healthcare, and other sectors; its platform is PCI-DSS Level 1 compliant and uses AES 256-bit encryption.",
