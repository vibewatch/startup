      - number: '6.4'
        title: Concentration risk and open gaps
        blocks:
          - type: paragraph
            body: >-
              The concentration picture is directionally clear even though the numbers are not. Nearly every
              high-quality public deployment proof points to title, mortgage, or another high-stakes document workflow
              where real-estate-style trust and identity controls matter. That makes strategic sense because Proof’s
              biggest published volume milestones, most detailed ROI claims, and deepest references all come from the
              closing ecosystem. It also means the business could still be more exposed to housing, title, and lending
              cycles than the broader Proof branding suggests. Expansion vectors do exist — credit unions, estate
              planning, public notices, vital records, and vehicle-title or equipment-finance documentation — but the
              company has not publicly broken out account counts, revenue mix, or top-customer share by vertical. The
              biggest diligence gap is therefore not whether customers use the product; they do. The gap is whether
              those deployments are durable, diversified, and economically concentrated in a handful of large lenders,
              title firms, or partners. Management should be asked to provide active deployed-account counts, renewal
              metrics, top-10 customer concentration, vertical revenue mix, and a fuller ledger separating logo-only
              references from scaled production customers.
