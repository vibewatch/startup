      - number: '8.2'
        title: Comparable set and public-market lens
        blocks:
          - type: paragraph
            body: >-
              A public comp lens is imperfect but still useful because Proof is now pitching a blend of agreement
              workflow, identity assurance, fraud control, and regulated financial-document execution. Docusign is the
              clearest workflow anchor. Okta provides the identity-premium edge of the range. nCino captures regulated
              financial-workflow software, and Blend adds a mortgage-oriented workflow comp with a much weaker market
              rating. Current valuation data show a meaningful gap between those names and a unicorn-style private price
              for Proof. StockAnalysis puts Docusign, Okta, Blend, and nCino at EV / sales multiples of roughly 2.78x,
              4.82x, 2.81x, and 3.21x respectively, while current revenue and market-cap sources put those businesses on
              very different scales. That gives a rough public comp band of about 2.8x to 4.8x EV / sales, with a
              midpoint near 3.4x. On Sacra's $80 million revenue estimate, that band supports an enterprise value of
              only about $222 million to $386 million. The gap matters because the best supportable near-$1B public
              marker located in this run is a later 2025 market-data print, not a corroborated priced round from Nov
              2024. In other words, the market is not currently paying anything close to a 12x-plus revenue multiple for
              the public peers used here.
