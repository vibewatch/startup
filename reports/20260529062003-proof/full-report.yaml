            body: >-
              The capital picture is strongest where the record is old and weakest where investors care most today.
              Official and top-tier reporting firmly support a $35 million Series C in 2020 and a $130 million Series D
              in 2021, with the latter valuing Notarize at roughly $760 million after 600% year-over-year revenue
              growth. The company’s own post said 2021 margins would exceed 60% for the month and that the business had
              improved from -110% margins in 2019 to positive territory before the pandemic surge, which implies
              meaningful operating leverage at that moment in time. But the forward-looking adequacy question is harder.
              TechCrunch’s 2022 layoffs show that 110 employees, or 25% of staff, were cut as mortgage demand cooled and
              management cited a tougher fundraising environment. Third-party databases now estimate total funding
              anywhere from $225 million to $259 million and headcount around 415 employees, yet those figures are not
              reconciled by current official disclosures. The safest read is that Proof is not obviously
