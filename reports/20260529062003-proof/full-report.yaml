companyProfile:
  summary: >
    Proof (formerly Notarize) is a Boston-based identity authorization platform founded by Pat Kinsel in 2015 after a
    failed personal notarization experience. The company pioneered remote online notarization (RON) and has since
    expanded into a multi-product identity and authorization suite: Notarize, Verify (human-in-loop verification),
    Defend (fraud prevention), Sign, Identify, Close, Certify, and AI-agent identity standards. Proof claims 7,000+
    customers, 200+ employees, and $200 billion in annual transactions secured across real estate, financial services,
    legal, and government verticals. The company raised a $130 million Series D in 2021 at approximately $760 million
    valuation, rebranded from Notarize to Proof in 2023 following a 2022 restructuring, and has since added partnerships
    with Visa, IDEMIA, and the FIDO Alliance. A Forge secondary market marker from October 2025 indicates a
    market-implied valuation of approximately $987 million.
  foundedDate: '2015-01-01'
  founders:
    - name: Pat Kinsel
      role: Founder & CEO
      background: >-
        Founded Notarize in 2015 after encountering friction during a personal real-estate notarization; previously a
        venture investor and entrepreneur.
      claimRefs:
        - CO002
  foundingLocation: Boston, MA
  headquarters: Boston, MA (remote-first)
  productSummary: >
    Multi-product identity platform: Notarize (RON, available in 47+ states), Verify (human-in-loop remote identity
    verification at IAL2+), Defend (AI-powered fraud prevention), Sign (e-signature), Identify (identity proofing),
    Close (real-estate closing workflow), Certify (digital credentialing), and an emerging AI-agent identity standard
    (Certify) for autonomous-agent authorization. All products share a common identity-graph infrastructure and
    notary/verifier network available 24/7.
  customerFocus: >-
    Mortgage lenders, title companies, credit unions, estate planners, equipment finance firms, public-sector agencies,
    and enterprises requiring high-assurance remote identity authorization.
  businessModel: >-
    SaaS subscription and per-transaction fees for identity authorization services; enterprise contract and
    platform-licensing tiers; API/workflow embedding via developer platform.
  stage: growth-stage venture
  fundingStatus: >-
    Series D (2021, $130M, ~$760M valuation); total raised ~$213M; Forge secondary marker Oct 2025 at ~$987M. No
    confirmed primary round since Series D.
