      - number: '1.2'
        title: Founder, leadership, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The company remains visibly founder-led. Pat Kinsel is still presented as chief executive, president, and
              founder, and both official and independent sources tie the original company formation to his frustration
              with a failed notarization during the sale of his prior startup. Public executive depth is better than a
              pure founder-centric startup but still incomplete relative to the diligence ideal. Proof names a current
              operating bench that spans revenue, technology, legal, product, strategy, and privacy, and the addition of
              Gary Weingarden as chief privacy officer in late 2025 reinforces a growing compliance posture. At the same
              time, public materials do not give a full board roster or detailed governance map. Footprint evidence is
              also directionally strong rather than perfect: independent reporting consistently describes the company as
              Boston-based, while official careers materials describe a fully distributed, remote-first workforce of
              more than 200 employees across 37 states. That combination supports a credible scaled-operating-company
              profile, but management-room confirmation is still needed on exact headcount, office footprint, and
              reporting lines.
