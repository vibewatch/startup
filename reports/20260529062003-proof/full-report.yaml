            notaries can remain in the workflow.
        - label: Initial deployment
          description: >-
            The customer launches a specific workflow such as closings, POAs, wills, or affidavit handling rather than a
            company-wide rip-and-replace.
        - label: Repeat operational use
          description: >-
            Teams move from one-off sessions to repeat transactional use once wait time, support, and completion quality
            prove acceptable.
        - label: Overflow / flexibility
          description: >-
            Customers blend in-house notaries with the Notarize Network when volume spikes, off-hours demand appears, or
            geographic coverage matters.
        - label: Expansion into trust platform
          description: >-
            Accounts add witnesses, identity verification, or eSign to turn notarization into a broader
            trusted-transaction workflow.
  - id: FU002
    title: Adoption / deployment flow — logo to scaled production
    type: flow
    layout: wide
    summary: >-
      Public evidence distinguishes logos, pilot proofs, and truly scaled deployments by how much workflow detail and
      outcome data are disclosed.
    claimRefs:
      - CU010
      - CU024
      - CU025
      - CU033
      - CU042
      - CU045
    approximationNotes: This figure is qualitative; it maps the public evidence ladder rather than an audited sales funnel.
    data:
      nodes:
        - id: logo
          label: Logo / relationship mention
          description: A brand appears on CB Insights or in a PR without operating detail.
        - id: pain
          label: Workflow pain defined
          description: Customer case study explains the paper, notary, shipping, or fraud problem being solved.
        - id: pilot
          label: Pilot or narrow launch
          description: Customer runs a targeted workflow such as a POA pilot or first online closing.
        - id: production
          label: Production deployment
          description: Customer standardizes Proof in a live workflow across teams, regions, or document types.
        - id: scale
          label: Quantified scale
          description: Customer discloses transactions, completion rate, session time, or savings.
        - id: expand
          label: Expansion / cross-sell
          description: Customer adds more departments, witness services, identity verification, or overflow notary coverage.
      edges:
        - from: logo
          to: pain
          label: needs proof
        - from: pain
          to: pilot
          label: initial use case
        - from: pilot
          to: production
          label: operational fit
        - from: production
          to: scale
          label: measured outcomes
        - from: scale
          to: expand
          label: department / workflow growth
        - from: logo
          to: production
          label: possible but unverified in public data
