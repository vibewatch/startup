      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Proof looks like a late-stage, volume-sensitive platform rather than a pure-play software
              company. The quality of revenue is better than a one-off consumer notarization tool because the company
              sells into repeat workflows, can bill by transaction, can shift payer responsibility inside Title Pro, and
              is beginning to introduce subscription layers such as Business Pro+. Yet its economic profile likely sits
              below the cleanest software comparables because human notaries, trusted-referee escalations, compliance
              logic, and real-estate workflow support add service intensity that public peers such as Docusign do not
              fully share. The underwriting blocker is therefore disclosure quality, not absence of a business.
              Investors need current cash, monthly burn, actual gross margin, realized enterprise pricing, renewal
              behavior, sector mix, and debt or preferred-term visibility. Until management supplies those items, the
              company can be framed as commercially credible and probably still well funded, but not as a fully modeled
