      - number: '1.1'
        title: Identity platform, product scope, and current scale
        blocks:
          - type: paragraph
            body: >-
              Proof now presents itself as a trust and identity-authorization platform rather than only an online
              notarization utility. The homepage, Why Proof narrative, and product pages all position the business
              around securing high-stakes digital agreements by combining identity verification, live-agent review,
              notarization, cryptographic evidence, and fraud detection. That positioning is materially broader than
              legacy Notarize messaging even though the Notarize product still anchors the company's online-notary
              franchise. Public scale signals are meaningful but mixed between company-claimed and independently
              reported figures: careers materials cite more than 7,000 customers and 3 million-plus digital
              transactions, the homepage says the network secures more than $200 billion in transactions annually with
              millions of verified users, and the 2026 real-estate announcement pushes cumulative real-estate volume
              beyond $643 billion. The strongest read is that Proof has real operating scale across regulated workflows,
              but exact current revenue, retention, and monetization remain private.
