        title: Exhibits
        blocks:
          - type: callout
            title: Public comps do not clear a ~$1B price on current revenue evidence
            body: >-
              Even giving Proof a healthy premium over Blend and Docusign, the public comp band still sits well below a
              unicorn-like valuation unless current revenue is materially above the best public estimate.
