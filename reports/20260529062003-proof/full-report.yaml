      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The last step for investors is not to pick a number from a range but to identify what evidence would
              invalidate it. Proof becomes more attractive if management can show current revenue well north of the
              Sacra figure, a software-like or improving margin path, diversified vertical mix beyond real estate, and a
              preference stack that does not destroy downside protection. It becomes less attractive if real-estate
              concentration is dominant, if the 2022 layoff episode proved more structural than cyclical, or if the
              latest private valuation was effectively a flat or inside round supported by limited external demand.
              Forge's IPO reference hints that secondary-market interest exists, but it is not the same thing as
              demonstrated exit readiness. And if the oft-cited Nov 2024 ~$1B Series E cannot be papered with actual
              financing documents, investors should treat the near-$1B market-data print as indicative rather than
              decisive. Until those missing inputs are closed, the disciplined stance is clear: treat Proof as a
              high-quality, medium-confidence opportunity whose price can still be wrong even if the strategy is right.
            claimRefs:
