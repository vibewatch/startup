  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Proof’s pricing surfaces make the core revenue model unusually legible for a private workflow company. The
              self-serve layer is plainly usage-based: Business Pro starts at $25 for an online notarization meeting, $4
              per identity verification, and per-transaction pricing for eSignature, while Title Pro starts at $99 for a
              closing with the Notarize Network and $45 for a closing using in-house notaries. Title Pro’s FAQ
              explicitly says there are no setup costs, platform fees, or monthly minimums, and it even allows the
              platform owner to choose whether the business or the end recipient pays transaction fees. That matters
              because it implies that the company can monetize both low-friction SMB usage and larger enterprise
              workflows without requiring a seat-based SaaS purchase on day one. The April 2026 Business Pro+ release
              adds a second layer to this model: a $199 monthly subscription for advanced forms, branding, and IHN
              support. In other words, Proof is no longer just a pay-per-use RON vendor; it is trying to layer recurring
              software ARPU on top of regulated transaction revenue.
