      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Proof's use cases make the buyer model unusually clear. End users are borrowers, students, members,
              customers, candidates, or signers, but buyers and payers are usually institutions trying to reduce fraud,
              compliance risk, or process cost. In real estate, title agencies, lenders, and closing teams care about
              underwriter acceptance, cost savings, and time saved. In account recovery, the economic owner is more
              likely a security, fraud, or support function that wants to prevent account takeover while limiting PII
              exposure. In FAFSA and education, the buyer is an administrator bound by federal assurance and audit
              requirements. In equipment finance and POA workflows, operations, legal, and risk teams care about
              turnaround time, verified authorization, and audit trails. Proof's packaging supports this segmentation:
              self-serve and SMB motions are transaction-priced, while higher tiers add APIs, integrations, SSO,
              retention controls, and SLAs. The adoption path is therefore workflow led rather than brand led: define a
              risky step, insert identity checks, return a decision, and then reuse that identity later.
