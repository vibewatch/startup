      - number: '5.2'
        title: Identity verification pipeline and fraud controls
        blocks:
          - type: paragraph
            body: >-
              The best-substantiated part of Proof’s product-tech stack is its identity pipeline. Across product pages
              and help-center documentation, the public flow is consistent: the recipient is routed into a browser or
              link-based experience, uploads or captures government ID evidence, answers knowledge-based questions where
              required, completes biometric comparison and liveness checks, and then either proceeds automatically or
              gets routed to a human reviewer or notary. That sequence lines up closely with NIST IAL2 remote-proofing
              guidance, which explicitly expects camera-captured evidence, tamper validation, issuing-source checks,
              biometric or physical comparison, and liveness controls. Proof’s own surfaces then add a second layer of
              fraud decisioning: Verify handles live video escalation with deepfake analysis and risk scoring, while
              Defend and OmniTrust use broader network, credential, biometric, and payment signals to hold suspicious
              authorizations for review. The gap is not that the stack looks thin; it is that public materials do not
              disclose model accuracy, false-positive rates, or the exact threshold logic connecting automated review to
              human escalation.
