        blocks:
          - type: paragraph
            body: >-
              The company's chronology shows both genuine category creation and meaningful execution risk. On the
              positive side, retained sources show a sequence from 2015 founding, pandemic-era acceleration, a large
              2021 financing, the 2023 launch of the Proof brand, California legislative expansion, and 2025-2026
              partnerships spanning payments, privacy-preserving credentials, and AI-agent standards. The narrative
              shift is deliberate: Pat Kinsel now describes notarization as the proof of concept for a broader identity
              network. But there are adverse signals investors should not ignore. Kinsel acknowledges a financing crisis
              and layoffs in 2019, and TechCrunch reported another 25% workforce reduction in 2022 as housing and
              venture conditions tightened. Forbes also reports a dismissed litigation dispute involving the founder's
              brother. None of these issues appear existential from retained evidence, yet together they show that Proof
              is still a private company with meaningful execution, financing, and governance opacity despite a
              compelling top-line strategic story.
