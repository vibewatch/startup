      - number: '6.3'
        title: Retention, satisfaction, and expansion
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is mixed. On the positive side, the current Close page markets a 4.7-out-of-5
              experience from more than 20,000 verified reviews, Trustpilot’s archived review page summarizes 24,000
              reviews with strong themes of speed and convenience, and TrustRadius contains enterprise users who say
              they rely on Notarize for 100% of their mortgage closings or for legal and finance document validation.
              Several case studies also show repeat-use and expansion behavior: Baxter says internal usage tripled and
              is spreading to more departments, while Proof’s product pages emphasize that existing customers can
              overflow from in-house notaries to the network during high-volume periods and add identity verification,
              eSign, or witness services over time. But none of that is a substitute for true retention disclosure.
              Public sources do not reveal NRR, GRR, churn, renewal rates, average contract length, or customer cohort
              behavior by segment. Review evidence also shows real friction. Trustpilot and JustUseApp contain
              complaints about dropped video sessions, repeated verification, browser and document-upload problems,
              multi-signer limitations, and support channels that were slower or less responsive than advertised. The
              right reading is not that customers are fleeing the product; it is that Proof has clear workflow value,
              but service reliability and deployment smoothness still matter materially to retention and
              referenceability.
            claimRefs:
