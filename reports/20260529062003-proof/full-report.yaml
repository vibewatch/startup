  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Proof operates at the intersection of multiple regulatory regimes without a single federal preemptive
              framework. Remote online notarization legality rests on a patchwork of state statutes: as of mid-2026 more
              than 44 states have enacted permanent RON authorization, but several still lack it. The federal SECURE
              Notarization Act (H.R. 1059, 118th Congress) sought a national standard but was not enacted. The ESIGN Act
              (15 U.S.C. 7001) explicitly does not preempt state RON statutes, making Proof's legal exposure structural.
              For mortgage workflows, Fannie Mae's eNote acceptance policies add a GSE layer: any policy reversal would
              shut Proof out of the conforming mortgage channel. California SB 696, effective January 2024, expanded the
              market but added state-specific credential-analysis and tamper-evident-technology mandates. Privacy risk
              is the most legally active dimension. Proof's IAL2 workflow collects facial biometric data, government-ID
              images, and KBA responses — all categories attracting regulatory scrutiny. The CPPA requires documented
              purpose limitation for biometric data, and the California AG may impose 7500 dollars per intentional CCPA
              violation. FinCEN's 2024 deepfake alert and FBI IC3's 12.5 billion dollar 2024 internet crime figure frame
              the adversarial threat context.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
