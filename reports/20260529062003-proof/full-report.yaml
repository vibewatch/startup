  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Why strong company-quality evidence still results in a cautious recommendation at the latest visible price.
    data:
      nodes:
        - id: scale
          label: Scale proof
          description: 7,000+ customers, 3M+ transactions, 640B+ real-estate volume
        - id: product
          label: Product / customer quality
          description: Multi-product platform plus named customer proof across regulated workflows
        - id: latest
          label: Latest visible private mark
          description: >-
            Public sources did not corroborate a ~$1B Nov 2024 round; best supportable near-$1B marker is Forge's
            late-2025 Series E print
        - id: comp
          label: Public comp gap
          description: Public EV / sales range ~2.8x-4.8x versus implied ~12x+ on public revenue estimate
        - id: opacity
          label: Disclosure gap
          description: No current ARR, NRR, gross margin, or cap-table detail
        - id: decision
          label: Decision
          description: Track / research-more until price or evidence improves
      edges:
        - source: scale
          target: latest
        - source: product
          target: latest
        - source: latest
          target: comp
        - source: comp
          target: decision
        - source: opacity
          target: decision
        - source: product
          target: decision
    approximationNotes: This is a logical recommendation chain rather than a mathematical model.
    claimRefs:
      - CV001
      - CV002
      - CV015
      - CV016
      - CV022
      - CV040
      - CV041
