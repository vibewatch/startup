              launch release cited more than 2,200 companies and millions of transactions, while the current Close page
              claims $640 billion in real-estate transactions. Still, the logo surface is wider than the
              deployment-proof surface. CB Insights lists customers such as First American, Transamerica,
              Zillow/dotloop, Snapdocs, and Westcor, but most of those logos lack fresh public outcome data, so they
