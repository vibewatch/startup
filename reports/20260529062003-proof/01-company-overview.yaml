  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Proof, formerly Notarize, is a Boston-anchored and remote-first private company using online notarization as the foundation for a broader identity-authorization platform. Retained sources support a 2015 founding by Pat Kinsel, roughly $212 million of disclosed funding through a 2021 Series D, a 2023 rebrand to Proof, and a 2024-2026 strategy shift toward fraud-resistant digital identity, payments, and AI-agent authorizations. The main diligence caveats are private-company opacity around current financials, incomplete public governance disclosure, and the company's history of repeated layoffs during financing or housing-market shocks."
  },
  "sections": [
    {
      "id": "identity-platform-and-current-scale",
      "title": "Identity platform, product scope, and current scale",
      "body": "Proof now presents itself as a trust and identity-authorization platform rather than only an online notarization utility. The homepage, Why Proof narrative, and product pages all position the business around securing high-stakes digital agreements by combining identity verification, live-agent review, notarization, cryptographic evidence, and fraud detection. That positioning is materially broader than legacy Notarize messaging even though the Notarize product still anchors the company's online-notary franchise. Public scale signals are meaningful but mixed between company-claimed and independently reported figures: careers materials cite more than 7,000 customers and 3 million-plus digital transactions, the homepage says the network secures more than $200 billion in transactions annually with millions of verified users, and the 2026 real-estate announcement pushes cumulative real-estate volume beyond $643 billion. The strongest read is that Proof has real operating scale across regulated workflows, but exact current revenue, retention, and monetization remain private.",
