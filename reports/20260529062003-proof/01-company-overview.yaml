    {
      "id": "capital-history-and-stakeholder-map",
      "title": "Capital history and stakeholder map",
      "body": "Proof's public funding history is coherent enough to anchor stage and capital intensity even though the full cap table is not public. Official and independent sources support a $35 million Series C in March 2020 and a $130 million Series D in 2021 led by Canapi Ventures, with CapitalG, Citi Ventures, Wells Fargo, and existing backers participating. Using only disclosed totals from retained sources implies roughly $212 million of capital raised through the Series D. That is enough to frame the company as a late-stage private platform rather than an early venture bet. The stakeholder picture is broader than investors alone. Real-estate distribution partners, fraud-intelligence relationships such as Visa, policy and identity standards bodies such as FIDO, and ecosystem partners such as IDEMIA and Curql all reinforce the thesis that Proof is trying to become infrastructure rather than a point solution. The open diligence issue is economics: public sources still do not reveal ownership concentration, liquidation terms, debt, or board-control rights.",
