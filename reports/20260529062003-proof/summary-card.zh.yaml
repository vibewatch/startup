summary:
  headline: >
    Proof 已建成领先的 RON 和身份授权平台，拥有 7,000+ 客户，年交易规模超过 $200B；但财务不透明、住房周期集中、2022 年重组，以及 Forge 老股标记（约
    $987M）共同拉高尽调难度。该标记相对公开可比公司隐含两位数收入倍数，却没有披露 ARR、利润率或 NRR 来验证溢价。
