    (human-in-loop remote identity verification at IAL2+), Defend (AI-powered fraud
    prevention), Sign (e-signature), Identify (identity proofing), Close (real-estate
    closing workflow), Certify (digital credentialing), and an emerging AI-agent identity
    standard (Certify) for autonomous-agent authorization. All products share a common
    identity-graph infrastructure and notary/verifier network available 24/7.
  customerFocus: "Mortgage lenders, title companies, credit unions, estate planners, equipment finance firms, public-sector agencies, and enterprises requiring high-assurance remote identity authorization."
  businessModel: "SaaS subscription and per-transaction fees for identity authorization services; enterprise contract and platform-licensing tiers; API/workflow embedding via developer platform."
