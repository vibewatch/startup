summary:
  headline: >
    Proof has built the leading RON and identity-authorization platform with 7,000+ customers
    and real transaction scale ($200B+ annually), but the investment case is complicated by
    financial opacity, housing-cycle concentration, a 2022 restructuring, and a Forge secondary
    mark (~$987M) that implies double-digit revenue multiples versus public comps—without
    disclosed ARR, margin, or NRR evidence to validate the premium.
