companyProfile:
  summary: >
    Proof (formerly Notarize) is a Boston-based identity authorization platform founded by
    Pat Kinsel in 2015 after a failed personal notarization experience. The company pioneered
    remote online notarization (RON) and has since expanded into a multi-product identity
    and authorization suite: Notarize, Verify (human-in-loop verification), Defend (fraud
    prevention), Sign, Identify, Close, Certify, and AI-agent identity standards. Proof
    claims 7,000+ customers, 200+ employees, and $200 billion in annual transactions secured
    across real estate, financial services, legal, and government verticals. The company
    raised a $130 million Series D in 2021 at approximately $760 million valuation,
    rebranded from Notarize to Proof in 2023 following a 2022 restructuring, and has since
    added partnerships with Visa, IDEMIA, and the FIDO Alliance. A Forge secondary market
    marker from October 2025 indicates a market-implied valuation of approximately $987 million.
  foundedDate: "2015-01-01"
  founders:
