  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Proof 处在多个监管制度交汇处，却没有单一联邦预占框架。远程在线公证的合法性建立在州法拼图上： 截至 2026 年中，已有超过 44 个州通过永久性 RON 授权，但仍有若干州没有授权。联邦 SECURE
              Notarization Act（H.R. 1059，第 118 届国会）曾试图建立全国标准，但未获通过。ESIGN Act （15 U.S.C. 7001）明确不预占州 RON 法规，因此 Proof
              的法律暴露是结构性的。抵押贷款工作流还 叠加了 Fannie Mae 的 eNote 接受政策这一 GSE 层：任何政策逆转都会把 Proof 挡在合格抵押贷款渠道 之外。California SB 696 自
              2024 年 1 月生效，扩大了市场，但也新增了加州特定的凭证分析和防篡改 技术要求。隐私风险是法律层面最活跃的一块。Proof 的 IAL2 工作流收集面部生物识别数据、政府 ID 图像和 KBA
              回答——这些类别都受到监管审视。CPPA 要求为生物识别数据记录目的限制，California AG 可对每次故意 CCPA 违规处以 7500 美元罚款。FinCEN 的 2024 深度伪造警报和 FBI
              IC3 的 2024 年 12.5 billion 美元互联网犯罪数据，勾勒出对抗性威胁背景。
            claimRefs:
