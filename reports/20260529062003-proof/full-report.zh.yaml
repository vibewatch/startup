      - number: '2.2'
        title: 规模测算视角与细分吸引力
        blocks:
          - type: paragraph
            body: >-
              已发布的市场规模数据用数字说明同一件事。以狭义 RON 为导向的 Verified Market Research 只把 2024 年远程在线公证服务市场估为 $1.77 billion，即便它预计到 2032
              年快速增长至 $6.65 billion。相比之下，更宽口径的身份验证发布方把 2026 年品类放在 十几 billion 的中高段，并随着方法和周期不同继续增长到二十多 billion 高段或四十多
              billion 低段。这些矛盾不是噪声， 而是边界不同的直接结果。有些发布方只计算公证服务，有些计算 ID 验证平台，还有一些把欺诈、开户和合规工具也算进去。对 Proof 而言，
              有吸引力的细分，是那些法律意义、欺诈损失、可审计性和重复客户交互能够支撑溢价定价的场景：产权和抵押贷款、安全牵头的账户找回、 受监管教育工作流、设备融资和高风险招聘。市场足够大，值得关注，但前提是 Proof
              能从狭义公证品类之外拿到预算。
