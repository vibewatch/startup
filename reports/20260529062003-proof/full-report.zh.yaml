  productSummary: >
    多产品身份平台：Notarize（RON，覆盖 47+ 州）、Verify（IAL2+ 的人工介入远程身份验证）、Defend（AI 驱动的欺诈防控）、Sign（电子签名）、
    Identify（身份核验）、Close（房地产交割工作流）、Certify（数字凭证），以及面向自治智能体授权的新兴 AI 智能体身份标准（Certify）。 所有产品共用一套身份图谱基础设施，以及 24/7 可用的公证员 /
    验证员网络。
  customerFocus: 抵押贷款机构、产权公司、信用合作社、遗产规划机构、设备融资公司、公共部门机构，以及需要高保障远程身份授权的企业。
