        - 卖方、再融资、购房、HELOC 及附属交割文件包
        - Close 页面披露 $640B 房地产里程碑，另有 Home Services、Homestead、Canyon、Champion 和 Florida Agency Network 证据
        - 核心生产垂直，也是公开参考最强的一组
        - 没有公开拆分产权 vs 贷款方收入，也没有披露头部账户敞口
      - - 房贷机构 / 经纪人网络
        - 买方：贷款运营；用户：经纪人、交割专员、借款人；付款方：贷款方或产权合作方
        - 数字化房贷交割、再融资、eClosing 和放款流程
        - UWM 2025 年 30,000+ 笔交割；Thrive 第一年 100+ 笔在线交割；JB&B 3,100+ 笔交易
