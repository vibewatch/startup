      - 目标细分市场
      - 主要差异化
      - 相对 Proof 的主要短板
    rows:
      - - DocuSign (DOCU)
        - 既有巨头 / 电子签名 + RON
        - 上市公司；FY2024 收入约 $2.7B；1.7M 客户
        - 所有需要协议管理的企业和 SMB 细分市场
        - 市场领先的渠道、品牌、IAM 平台；1B+ 用户已签署；FedRAMP
        - RON 只是附加项；缺少 Proof 的公证员网络深度、反欺诈能力和可复用身份栈
      - - OneNotary
        - RON 直接同业
        - 私营；未披露融资；消费级
        - 需要单份文件公证的消费者和 SMB
        - $25 统一价；简单 KBA + 凭证分析 + 公证员工作流
        - 没有企业 API、欺诈情报或身份生命周期管理
      - - NotaryCam
        - RON 直接同业（企业授权模式）
        - 私营；被 Stewart Title 收购；锚定产权行业
        - 企业级产权公司、信用合作社、损失缓释团队
        - 符合 NIST IAL2；白标授权；溢出公证员覆盖
        - 产品范围更窄；没有反欺诈能力；价格为 Proof 入门价 7x
      - - SIGNiX
        - RON 直接同业
        - 私营；田纳西州 Chattanooga；未披露融资
        - 需要永久数字签名的受监管行业
        - eNotaryDoX 提供永久、独立的数字签名
        - 公开规模信号很少；没有身份平台；没有企业集成
      - - BlueNotary
        - RON 直接同业（供给侧平台）
        - 私营；未披露融资；平台上有 20,000+ 名公证员
        - 需要 24/7 按需 RON 的个人公证员和企业
        - 按需供给深度；公证员收入模型；45+ 州批准
        - 消费级定价（每次 $5–$10）；没有企业 API 或反欺诈工具
      - - Pavaso
        - 相邻电子交割（仅房地产）
        - 私营；运营 10+ 年；未披露融资
        - 房地产贷款机构、产权公司、律师
        - 全数字与混合电子交割；实时多方协作
        - 仅限房地产；没有身份层；没有反欺诈能力；房地产以外没有 RON 工作流
      - - Socure
        - 身份替代方案（身份 + 欺诈决策）
        - 私营；入选 CNBC Disruptor 50；3,000+ 客户；融资充足
        - 金融科技、金融服务、政府、零工平台
        - 垂直整合的身份 / 风险平台；Predictive DocV；规模化 AI 决策
        - 没有公证；没有受监管文件工作流；RON 法律合规不适用
      - - Jumio
        - 身份替代方案（聚焦 KYC/AML 的 IDV）
        - 私营；聚焦企业 KYC/AML；PCI-DSS Level 1
        - 金融服务、游戏、加密货币、医疗健康
        - AML/KYC 级身份验证；生物识别活体检测；GDPR/CCPA 合规
        - 没有公证；没有审计视频记录；没有房地产或 RON 工作流
      - - 内部自建 / 维持现状
        - 替代方案（纸笔或 DIY）
        - 不适用
        - 有合规团队、或公证需求低频的大型机构
        - 完全控制；没有供应商依赖；无许可费
        - 慢，规模化成本高；面临监管审查；没有审计自动化或反欺诈能力
