  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              第一项分析任务，是先把市场边界划准。Proof 已不只是远程在线公证供应商，尽管公证仍是重要的商业切入口。它的定价、产品和用例页面显示，
              更宽的技术栈已经包括身份验证、安全电子签名、欺诈监控、数字交割工作流和可复用数字凭证。这个差别很关键：狭义 RON 市场远小于更广义的数字身份验证市场， 而 Proof
              目标中的许多工作流——例如账户找回或候选人欺诈——并不总需要公证行为。实际看，Proof 的可触达支出分层存在： 核心 RON
              层，法律效力和公证员重要；更宽的安全协议层，签署和可审计性重要；再往外是身份与欺诈层，可复用凭证和全生命周期再认证重要。
              因此，市场边界纪律非常重要；否则同一家公司会因分析师选择的镜头不同，看起来被人为缩小或人为放大。
