      - number: '8.4'
        title: 最终尽调问题与破坏投资逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              投资人的最后一步不是从区间里挑一个数字，而是明确哪些证据会推翻它。如果管理层能证明当前收入远高于 Sacra 数字、利润率路径具备软件特征或正在改善、房地产之外的垂直行业组合更分散、优先股堆叠不会摧毁
              下行保护，Proof 会更有吸引力。如果房地产集中度占主导，2022 年裁员事件证明更结构性而非周期性，或 最新私募估值实质上是在外部需求有限支撑下完成的平轮或内轮，吸引力就会下降。Forge 的 IPO
              引用暗示 老股市场存在兴趣，但这不等于已经证明具备退出准备。如果频繁被引用的 2024 年 11 月约 $1B Series E 不能拿出实际融资文件，投资人应把接近 $1B
              的市场数据点视为指示性而非决定性。缺失输入补齐之前， 纪律性立场很清楚：把 Proof 视为一家高质量、中等信心的机会；即便战略正确，价格仍可能错。
