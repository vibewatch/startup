      - number: '8.2'
        title: 可比公司与公开市场视角
        blocks:
          - type: paragraph
            body: >-
              公开可比公司视角并不完美，但仍有用，因为 Proof 现在讲的是协议工作流、身份保证、欺诈控制和受监管 金融文件执行的组合。Docusign 是最清晰的工作流锚点。Okta 提供区间上身份溢价的一端。nCino
              捕捉 受监管金融工作流软件，Blend 则提供以抵押贷款为导向、市场评级弱得多的工作流可比对象。当前估值数据 显示，这些公司与 Proof 的独角兽式私募价格之间存在明显缺口。StockAnalysis 显示
              Docusign、Okta、 Blend 和 nCino 的 EV / sales 倍数分别约为 2.78x、4.82x、2.81x 和 3.21x；当前收入和市值来源也
              显示这些企业处在非常不同的规模层级。这给出约 2.8x 至 4.8x EV / sales 的粗略公开可比区间，中点 接近 3.4x。按 Sacra $80 million 收入估计，该区间只支持约 $222
              million 至 $386 million 的企业价值。 缺口重要，因为本次找到的最可支撑接近 $1B 的公开标记，是 2025 年较晚的市场数据点，而不是 2024 年 11
              月有互证的定价轮。换句话说，市场目前并没有为这里使用的公开同行支付接近 12x 以上的收入倍数。
