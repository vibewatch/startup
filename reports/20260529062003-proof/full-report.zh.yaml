      - number: '3.2'
        title: 竞争者画像：规模、融资、定价与战略方向
        blocks:
          - type: paragraph
            body: >-
              DocuSign（DOCU，Nasdaq）是最重要的竞争者。它已上市，披露 2024 财年收入超过 $2.7 billion；其 IAM 平台现在把 eSignature、 Contract Lifecycle
              Management、Agreement Manager、Iris AI、Workflow Builder、Web Forms 和 Electronic Notarization
              打包进一个订阅套件。DocuSign 的标准 eSignature 年付方案定价为每用户每月 $15 到 $40，身份验证可作为按次付费附加项，每次 $2.50。 公司服务 1.7 million 客户，并表示
              95% 的 Fortune 500 公司使用 Docusign。其合规姿态很强，覆盖 ISO 27001、FedRAMP、 APEC PPP、PCI DSS 和 SSAE 18。DocuSign 在 2024 到
              2026 年的战略方向，是在 AI 驱动的 IAM 平台下统一协议工作流， 而不是单卖 eSignature；这意味着它的产品范围正朝 Proof 竞争的信任和自动化层扩张，而不是远离这些层。OneNotary
              是面向消费者的 RON 供应商，单次会话平价 $25，没有公布企业定价；其三步 ID 流程结合 KBA、证件分析和公证员验证。NotaryCam 每份文件定价 $175， 每增加一名签署人加收
              $50，覆盖美国所有州，并向希望把 RON 嵌入自有工作流的企业和产权公司推广白标授权模式。NotaryCam 的企业页面强调 NIST IAL2 合规和溢出覆盖。SIGNiX 位于 Tennessee 的
              Chattanooga，提供 eNotaryDoX 作为远程电子公证服务； 其首页称美国每年发生超过 10 亿笔公证交易，用来框定市场机会，但公司没有公开披露客户、收入或融资数据。BlueNotary 称平台上有
              20,000+ 认证在线公证员，提供 24/7 按需公证，并称每笔 eClosing 交易可节省 $450 或更多成本。BlueNotary 定价页显示两种公证员侧模型：无品牌会话每次 $5 到
              $10，品牌会话每次 $10 到 $150+。Pavaso 是一家 10+ 年 eClosing 平台， 完全集中在房地产，通过协作式全数字、混合或线下 eClosing
              工作流支持贷款机构、产权公司和律师；它按辖区支持 RON、IPEN 和 RIN。 Socure 服务 3,000+ 企业客户，拥有垂直整合的身份与风险平台，以 Predictive DocV、Digital
              Intelligence、SNA and OTP、 eCBSV 和 Socure Verify 为核心；它入选 CNBC Disruptor 50，并获得机构投资人支持。Jumio
              在金融服务、游戏、加密、医疗和其他行业提供身份验证、 生物识别活体检测和 AML-KYC 合规；平台符合 PCI-DSS Level 1，并使用 AES 256-bit 加密。
