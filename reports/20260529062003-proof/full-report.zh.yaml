      私营竞争对手的规模和融资数字来自公司网站、媒体报道和独立新闻；未独立审计其私人财务数据。DocuSign FY2024 收入来自新闻报道；准确的当前数据见 SEC 文件。NotaryCam 归 Stewart Title
      所有的状态来自新闻来源；确切收购条款未公开披露。
