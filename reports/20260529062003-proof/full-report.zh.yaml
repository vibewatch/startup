      - number: '6.3'
        title: 留存、满意度与扩张
        blocks:
          - type: paragraph
            body: >-
              公开可验证的持久性证据并不一致。积极面是，当前 Close 页面宣称，在超过 20,000 条已验证评价中获得 4.7/5 的体验评分；Trustpilot 的归档评价页汇总了 24,000
              条评价，速度和便利性是强主题； TrustRadius 上也有企业用户称，他们 100% 的抵押贷款交割或法律、财务文件验证都依赖 Notarize。若干案例研究也显示重复使用和扩张：Baxter
              称内部使用量增加到三倍，并正在扩散到更多 部门；Proof 的产品页则强调，现有客户在高峰期可从自有公证员溢出到网络，并逐步叠加身份验证、 eSign 或见证服务。但这些都不能替代真正的留存披露。公开来源没有披露
              NRR、GRR、流失、续约率、 平均合同期限，或按细分市场划分的客户队列表现。评价证据也显示真实摩擦。Trustpilot 和 JustUseApp
              上有投诉，涉及视频会话中断、重复验证、浏览器和文件上传问题、多签署人限制，以及 响应速度或服务质量低于宣传的支持渠道。正确解读不是客户正在逃离产品；而是 Proof 的工作流价值明确，
              但服务可靠性和部署顺滑度仍会实质影响留存和客户背书。
