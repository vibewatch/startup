  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分群
        blocks:
          - type: paragraph
            body: >-
              Proof 的公开客户地图足够宽，能够显示真实的多垂直业务；但也足够窄，让公司的重心仍很清楚。Notarize-for-business 和产品页把平台定位给贷款机构、
              产权代理、银行、保险公司、律所、信用合作社和其他文件密集型企业，这些客户需要在同一工作流中完成安全签名、公证、见证和身份验证。
              最强的公开部署证据聚集在房地产及相邻借贷运营：产权机构、抵押贷款机构、设备和汽车融资提供商，以及处理授权书或产权文件的企业。 法律和政府相邻用例有证据支撑，但更浅。NetLaw 和 Hargrove Firm
              展示了遗产规划执行；Column 和 Vital Records Online 展示了服务法院、 机构或受监管记录保管方的宣誓书和认证记录工作流。Proof
              自己的材料也称平台支持教育，但保留证据集中没有单独的具名教育部署。 公司发布的规模信号仍有意义：2023 年发布稿称有超过 2,200 家公司和数百万笔交易，当前 Close 页面称房地产交易额为 $640
              billion。 不过，logo 面比部署证明面更宽。CB Insights 列出 First American、Transamerica、Zillow/dotloop、Snapdocs 和 Westcor
              等客户，但其中多数 logo 缺少新的公开结果数据；在管理层提供运营细节前，应把它们视为认知或关系信号。
