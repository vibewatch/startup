        - 无身份或合规要求的低风险文件共享
        - 运营、法务、业务流程负责人
        - 重要相邻场景，因为许多工作流不需要公证但需要信任
      - - 数字身份验证 / 可复用凭证
        - 注册、生物识别检查、活体检测、重新认证、身份报告
