  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接、既有、相邻与替代方案
        blocks:
          - type: paragraph
            body: >-
              Proof 的竞争环境横跨四类竞争者，尽调分析师必须仔细拆开。第一类是直接 RON 同业：OneNotary、NotaryCam、SIGNiX、BlueNotary 和 Pavaso
              都提供面向同一交易的远程在线公证产品。它们各自在价格、公证员网络深度或垂直聚焦上竞争，但没有一家披露过接近 Proof 公开引用累计房地产交易额的
              GMV。第二类是占主导地位的电子签名既有玩家：DocuSign。作为上市公司，DocuSign 拥有 1.7 million 付费客户，并被 95% 的 Fortune 500
              公司采用；它有分销、品牌和企业集成深度，可以争夺任何协议工作流预算。DocuSign 把 Electronic Notarization 列为与 eSignature 并列的产品能力，2021 年收购
              LiveOak Technologies 又为签署会话增加了实时视频协作层。 DocuSign 的定价包含每次 $2.50 的 ID 验证附加项，直接与 Proof 的 Identify
              产品竞争。第三类是仅做身份的替代者：Socure 和 Jumio。 这些平台已搭建大规模身份和欺诈决策栈，服务金融服务、游戏、医疗和其他行业的数千家企业客户。企业理论上可以把 Socure 的
              Predictive DocV 和 Digital Intelligence 叠加到 DocuSign eSignature 之上，而不购买 Proof 的公证层。第四类是现状和内部自建替代：
              美国多数公证交易仍由纸笔公证员完成，拥有合规团队的大型机构有时会自建身份或签署工作流，而不是采购供应商方案。按 SIGNiX 自己首页的说法，美国可触达公证市场每年覆盖超过 10
              亿笔交易，这意味着纸笔既有公证仍是总体上最大的竞争力量。 可能进入者包括 Adobe；它已经提供 Adobe Acrobat Sign，并触达庞大的企业客户群；也包括可能收购 RON 供应商来补齐 RON
              能力的大型金融基础设施提供商。
