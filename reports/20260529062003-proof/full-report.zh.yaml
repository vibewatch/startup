      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Proof 更像后期、对交易量敏感的平台，而不是纯软件公司。收入质量好于一次性消费者公证工具，因为公司卖进重复工作流， 可以按交易收费，可以在 Title Pro 中转移付款方责任，并开始引入
              Business Pro+ 等订阅层。不过，它的经济画像很可能低于最干净的软件可比公司： 真人公证员、可信裁判升级、合规逻辑和房地产工作流支持，都带来 DocuSign
              等公开同业不完全承担的服务强度。因此承销阻碍是披露质量， 不是没有业务。投资人需要当前现金、月度烧钱、实际毛利率、已实现企业定价、续约行为、行业结构，以及债务或优先股条款可见度。
              在管理层提供这些项目之前，公司可以被描述为商业上可信、且很可能仍资金充足，但还不能被建成完整财务模型。
