companyProfile:
  summary: >
    Proof（前身为 Notarize）是位于 Boston 的身份授权平台，由 Pat Kinsel 在一次个人公证受阻后于 2015 年创立。公司开创了远程在线公证（RON），
    此后扩展成多产品身份与授权套件：Notarize、Verify（人工介入验证）、Defend（欺诈防控）、Sign、Identify、Close、Certify， 以及 AI 智能体身份标准。Proof 称拥有 7,000+
    客户、200+ 员工，每年在房地产、金融服务、法律和政府等垂直行业保护 $200 billion 交易。公司 2021 年以约 $760 million 估值完成 $130 million Series D；2022
    年重组后，2023 年从 Notarize 更名为 Proof， 之后又与 Visa、IDEMIA 和 FIDO Alliance 建立合作。Forge 在 Oct 2025 的二级市场标记显示，市场隐含估值约为 $987
    million。
  foundedDate: '2015-01-01'
  founders:
    - name: Pat Kinsel
      role: 创始人兼 CEO
      background: 2015 年因个人房地产公证受阻而创立 Notarize；此前曾是风险投资人和创业者。
      claimRefs:
        - CO002
  foundingLocation: Boston, MA
