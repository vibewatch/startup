  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 公开收入估计大方向仍成立；集中度和不透明度意味着相对公开可比公司几乎不该给溢价
        - 用约 3x-5x 乘以约 $80M 收入，价值约 $250M-$400M
        - 抵押贷款集中、倍数压缩、降价融资风险
        - 如果增长放缓且透明度仍差，该情景合理
      - - 基准
        - Proof 因产品广度和客户验证值得一定溢价，但没有最新经济数据就不该给风险投资式倍数
        - 用 6x-10x 乘以当前或略高收入，价值约 $500M-$800M
        - 留存、利润率质量和资本结构未知
        - 公开数据下最符合证据的区间
      - - 乐观
        - 当前收入明显高于公开估计，且护城河 / 经济性足以支撑高溢价私募倍数
        - 对 $100M+ 收入或类似基数用 9x-12x，价值约 $900M-$1.2B+
        - 需要证明多元化增长和强单位经济性
        - 可能成立，但取决于尚未公开的私人事实
    notes: 情景逻辑刻意保持简单，并对公开信息缺口高度敏感；它不能替代管理层数据。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV005
    title: 论点失效与放弃触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入支撑失效
        - 当前收入仍接近或低于公开 2023 年估计，且没有强增长桥接证据
        - 溢价倍数逻辑坍塌
        - 在类独角兽价格下转为放弃
      - - 客户集中度极端
        - 房地产或头部账户占 ARR 的比例远高于公开证据显示
        - 下行风险变成特定行业风险，而不是整个平台风险
        - 给更高折价，并要求缓释集中度
      - - 利润率质量不及预期
        - 服务成本强度或反欺诈运营显著压低毛利率
        - 公开可比公司溢价更难成立
        - 下调估值区间并延长尽调
      - - 资本结构下行不吸引人
        - 优先权、债务或二级标记导致下行保护偏弱
        - 即便运营业务扎实，入场纪律也会恶化
        - 回避，或要求更低价格
      - - 退出准备弱于暗示
        - 尽管市场有兴趣，仍没有真实 IPO 或 M&A 路径
        - 回报时间和流动性恶化
        - 从增长押注改写为长期私募持有
    notes: 触发项旨在改变建议，而不只是改变叙事语气。
    claimRefs:
      - CV022
      - CV030
      - CV033
      - CV036
      - CV039
      - CV040
