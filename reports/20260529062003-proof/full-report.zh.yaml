      - number: '3.3'
        title: 切换成本、锁定效应、护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Proof 的竞争耐久性来自几股相互作用的锁定力量。第一是合格公证员网络：Proof 多年来招募、培训并管理公证员委任，形成了竞争者必须从零复制的供给资产。 BlueNotary 声称拥有 20,000+
              公证员，说明公证员供给在消费者价位上可以被争夺；但在规模化企业级按需可用性、可防守质量和欺诈监控上，复制难度更高。 第二是产权承保人和贷款机构集成：房地产交割需要承保人接受所使用的 RON
              平台，每一次承保人批准都是一段需要时间建立的运营关系。 Proof 累计 $640 billion 房地产交易额，以及产权机构持续使用，给了它后来者必须重新赢得的承保人信任。第三是身份和欺诈数据飞轮：
              每一次身份验证、公证会话和欺诈防御结果，都会贡献给 Proof 的欺诈检测模型。IDEMIA 生物识别合作和 Visa 欺诈情报关系增加外部数据富集， 让数据优势复利化。第四是企业工作流集成：API 关系、SSO
              配置和有 SLA 支持的企业合同，形成多年粘性。值得注意的反向竞争证据包括： Proof 自身在 2022 年住房市场下行时裁员 25%，显示房地产集中风险，以及在交易量压力下的运营脆弱性。DocuSign 在
              2024 年裁员约 10%， 说明即便主导玩家也在 eSignature 品类中面对盈利压力；它现在又在 IAM 平台伞下加速功能整合，这一战略动作压缩了 Proof 作为独立签署与身份供应商的成长空间。
              交易层商品化风险真实存在：OneNotary 提供 $25 平价公证，与 Proof 的 Notarize 入门价一致，说明按交易计费的 RON 定价已经商品化。 因此，Proof
              转向经常性身份保障收入的平台策略，是摆脱交易价格侵蚀的战略必需，而不是可有可无。身份层的多供应商并用相对容易： 企业可以分别用 Socure 做开户、DocuSign 做合同签署、Proof
              做高保障公证；这限制了 Proof 扩大钱包份额的能力，除非它交付清晰的成本或风险节省，足以抵消集成开销。
