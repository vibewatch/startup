      - number: '7.4'
        title: 人员、执行与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              Proof 面临两条执行风险：一边管理从公证即服务转向身份授权平台的复杂度，一边维持核心 RON 业务； 同时，公司披露的组织信息有限，领导层厚度仍需验证。从公证即服务转向身份授权平台，扩大了产品面
              （Identify、Verify、Defend、Digital ID），也提高了资本和人员需求。如果住房交易量继续低迷，而新的身份用例在现金跑道收窄前没有产生足够收入， 执行风险就会变成资本风险。2019
              年内部融资危机、2022 年裁员，以及 2021 年以来没有披露新的资本 事件，合在一起说明融资风险并非假设。关键人依赖集中在 Pat Kinsel 身上，他同时是创始人、CEO 和 总裁。2025
              年新增首席隐私官和首席营收官，增强了管理层厚度，但没有消除创始人依赖。完整董事会构成、 清算优先权和投票权未公开披露。Proof 的技术合规姿态较强（SOC 2 Type II、IAL2、Kantara
              认证），但没有数据室访问权限，财务、运营和治理控制仍无法验证。TR005 中的缓释成熟度评估总结了公开证据在哪些风险控制上支持信心、哪些地方无法支撑。
