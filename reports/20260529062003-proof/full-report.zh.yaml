  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重度
      - 证据基础
      - 缓释措施 / 尽调问题
    rows:
      - - 公证员网络深度和供给侧管理
        - BlueNotary 和 OneNotary 搭建消费者供给侧公证员市场；DocuSign 为签署增加了视频协作
        - 中
        - BlueNotary 称拥有 20,000+ 名公证员；DocuSign 收购 LiveOak 以补上视频层
        - 核实 Proof 公证员满意度、留存和质量指标；向管理层索取公证员供给 SLA
      - - 产权承保方接受度和房地产工作流集成
        - Pavaso 在同一贷款 / 产权工作流中竞争；新进入者也可寻求承保方批准
        - 中
        - Pavaso 是该细分市场 10+ 年在位者；Proof 的 $640B GMV 提供了既有履约记录
        - 确认有多少产权承保方已正式批准 Proof，而非竞争对手；核实分销协议中的排他或优先条款
      - - 反欺诈情报数据飞轮（IDEMIA、Visa）
        - Socure 覆盖 3,000+ 客户的数据网络明显更广；Jumio 处理全球 KYC 流量
        - 高
        - Socure 入选 CNBC Disruptor 50；Jumio 达到 PCI-DSS Level 1；相较规模化 IDV 在位者，Proof 的反欺诈合作仍处早期
        - 量化 Proof 反欺诈模型的准确率、误报率和相对 Socure/Jumio 基准的数据量；索取反欺诈防护成效指标
      - - 可复用数字身份和 FIDO AI 智能体授权
        - 目前没有竞争对手复制该能力；但 DocuSign 拥有 AI（Iris）和接近 FIDO 的标准入口
        - 低（短期）；中（3–5 年）
        - Proof 的 FIDO Alliance 会员身份已确认；没有 RON 同行具备同等能力；DocuSign 路线图未公开
        - 监测 DocuSign IAM 路线图中的身份生命周期功能；跟踪 FIDO 标准采纳节奏
      - - 收入对房地产的集中度
        - 房地产市场下行会带来交易量风险；Proof 已在 2022 年下行期裁员 25%
        - 高
        - 已确认：Proof 2022 年裁员 25%（TechCrunch）；RON 交易量与抵押贷款发放量相关
        - 索取收入多元化指标：2025 年收入中，房地产、身份和其他垂直分别占多少？
      - - DocuSign 既有客户基础带来的企业切换成本
        - DocuSign 的 1.7M 客户基础造成巨大转化阻力；身份附加项会把用户留在 DocuSign 生态内
        - 高
        - DocuSign 身份附加项（$2.50/次尝试）已上线；IAM 平台捆绑更多能力
        - 对标企业交易中对 DocuSign 的胜率数据；索取同时使用 DocuSign 的客户流失率
    notes: 严重度评级是基于本次运行所收集竞争证据的分析师判断，应与管理层数据室资料交叉压力测试。高严重度意味着若不处理，该威胁可能实质限制 Proof 的增长轨迹或利润率。
