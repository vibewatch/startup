      - number: '7.3'
        title: 合作伙伴、依赖与资本风险
        blocks:
          - type: paragraph
            body: >-
              Proof 有三类主要依赖集中：住房市场周期、GSE 和集成伙伴基础设施，以及资本基础。2022 年 11 月， 住房市场收缩后裁员 25%，HousingWire、National Mortgage News
              和 TechCrunch 均有记录，这说明 Proof 的成本结构与住房交易量挂钩。CEO Pat Kinsel 明确提到住房市场恶化和未来投资受限——这两个
              风险相互关联，因为市场驱动的收入缺口会同时削弱内部现金生成和投资者对新融资的兴趣。Proof 的 eMortgage 工作流需要持续符合 Fannie Mae eNote 资格标准。ICE Encompass
              集成是进入抵押贷款机构 的关键分销路径。资本风险最不透明，却是后果最重的财务风险：Proof 自 2021 年 Series D 以来没有 披露任何新的一级融资。公司披露的累计资本为 212 million
              美元，在四年多没有宣布外部融资的情况下， 以未知烧钱速度运营。缺少经审计财务，公开来源无法评估烧钱、现金跑道或净收入留存。
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
