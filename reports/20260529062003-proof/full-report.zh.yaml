      - number: '7.2'
        title: 运营、质量与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              Proof 的运营风险由四个相互依赖的脆弱点塑造：按需公证员供给、会话可靠性、身份核验准确性和 网络安全。Notarize Network 是一支零工式队伍，由持证公证员组成，全年无休 24/7/365 可用。
              房地产交割旺季的供给中断会直接影响企业 SLA。Trustpilot 的 24,000 条评价和 JustUseApp 都记录
              了反复出现的投诉，包括等待数小时、视频会话中断、重复验证循环和浏览器兼容错误。这些失败会直接 转化为借款人流失和客户流失风险。身份核验准确性有双向风险。NIST 的 FRVT 测试发现，商业呈现攻击
              检测系统存在可衡量的误拒和误受率。NIST IR 8584 记录了人脸变形攻击可用来攻破人脸比对系统。 由于 Proof 数据资产高度敏感，网络安全风险被放大：生物识别人脸图像、政府 ID 扫描件和金融文件。
              一旦泄露，会触发 CCPA 通知义务、潜在 FTC 执法，以及金融机构客户层面的声誉损害。Proof 披露了 SOC 2 Type II 认证和 IAL2 合规，但控制范围和保证期间未公开细化。
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
