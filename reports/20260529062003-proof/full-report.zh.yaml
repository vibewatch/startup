      - number: '6.4'
        title: 集中度风险和未决缺口
        blocks:
          - type: paragraph
            body: >-
              集中度图景方向明确，只是数字缺失。几乎所有高质量公开部署证据都指向产权、抵押贷款或其他高风险 文件工作流，在这些场景里，类房地产的信任和身份控制至关重要。战略上说得通：Proof 已发布的最大
              交易量里程碑、最详细的 ROI 主张和最深的客户背书，几乎都来自交割生态。问题是，这也意味着公司 对住房、产权和信贷周期的暴露，可能仍高于 Proof 更宽泛的品牌叙事。扩张方向确实存在——信用合作社、
              遗产规划、公告、生命记录，以及车辆产权或设备融资文件——但公司没有公开按垂直行业拆分账户数、 收入结构或头部客户占比。因此，最大的尽调缺口不是客户是否使用产品；他们确实在用。缺口在于这些
              部署是否持久、足够多元，经济上是否集中在少数大型贷款机构、产权公司或合作伙伴手中。应要求管理层 提供活跃已部署账户数、续约指标、前十大客户集中度、垂直行业收入结构，以及一份更完整的清单，区分
              仅出现在客户标识页的客户和已规模化生产的客户。
