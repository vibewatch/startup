  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Proof 的产品线确实够宽，也在多个受监管流程里拿到了客户验证。
        - 如果当前收入、留存和利润率明显强于公开估计，估值支撑会改善。
      - - 身份、公证和反欺诈控制打通后，相比窄流程同业，Proof 可能值得溢价。
        - 如果 Proof 证明不了产品营销之外的持久护城河，溢价倍数逻辑会削弱。
      - - UWM、BCU、Column 等客户案例支撑公司质量论点。
        - 如果这些标杆账户相对披露客户数量来说规模很小或 ARR 很低，溢价论点会削弱。
      - - 当前公开可比公司倍数明显低于约 $1B 私募标记隐含的倍数。
        - 如果公开市场倍数上修，或 Proof 的收入基数远高于假设，估值差距会收窄。
      - - 风险和披露不透明仍主导投资决策。
        - 如果管理层提供 ARR、毛利率、NRR 和资本结构明细，建议可能转向建设性。
