      - number: '3.4'
        title: 竞争总结与差异化耐久性评估
        blocks:
          - type: paragraph
            body: >-
              Proof 在平台级 RON 供应商中拥有可防守的先发位置，并通过在公证核心之上叠加身份验证、欺诈监控和 AI 智能体授权，明显区别于纯公证同业。 本次评估的五家 RON-only
              竞争者——OneNotary、NotaryCam、SIGNiX、BlueNotary 和 Pavaso——都缺少 Proof 现在提供的全栈组合： 受监管公证、身份生命周期管理和欺诈情报。DocuSign
              是最可信的长期威胁，因为它有企业分销、大规模工程投入和 IAM 路线图动能；不过， DocuSign 的 Electronic Notarization 附加项目前还不能复制 Proof
              的公证员网络深度、真人公证会话质量、欺诈防御或可复用凭证基础设施。 仅做身份的替代者 Socure 和 Jumio 今天更多服务互补而非直接重叠的工作流：它们不提供公证、受监管文件审计轨迹或 RON
              法律合规基础设施； 要补上这些能力，需要大量监管和供应链投入。纸笔公证现状仍是绝对交易量中最大的竞争力量，但正在被州级 RON 立法和机构数字化侵蚀。 近端（一到两年）差异化耐久性评估为中高；如果
              DocuSign 充分产品化其公证和身份路线图，并且身份验证商品化加速，三到五年维度会降至中等。 Proof 的战略要务，是在 DocuSign 补齐功能缺口之前，把更多已装客户转化为多产品身份保障合同。
