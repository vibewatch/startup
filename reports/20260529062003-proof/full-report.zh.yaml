chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份平台、产品范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              Proof 现在不再只把自己定义成在线公证工具，而是信任与身份授权平台。首页、Why Proof 叙事和产品页都围绕高风险数字协议的安全展开：
              把身份验证、真人审核、公证、加密证据和欺诈检测组合起来。这一定位明显比早期 Notarize 叙事更宽，即便 Notarize 产品仍是公司在线公证业务的核心。
              公开规模信号有意义，但公司自称数据和独立报道混在一起：招聘材料称客户超过 7,000 家、数字交易超过 3 million 笔；首页称网络每年保护超过 $200 billion
              交易，并覆盖数百万已验证用户；2026 年房地产公告则把累计房地产交易额推到 $643 billion 以上。最稳妥的判断是， Proof
              已在受监管工作流中跑出真实运营规模，但当前收入、留存和变现的精确数字仍未公开。
