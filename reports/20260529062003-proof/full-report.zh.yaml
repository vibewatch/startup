      - number: '8.3'
        title: 情景区间与影响判断的因素
        blocks:
          - type: paragraph
            body: >-
              悲观、基准和乐观情景的分歧，不在于 Proof 是否是真业务，而在于什么条件才能支撑价格。悲观情景假设 最佳公开收入估计仍大体正确，抵押贷款集中度和欺诈模型不透明性足以让估值低于公开可比区间上沿，且
              下一轮私募融资可能低于此前预期完成。基准情景假设 Proof 明显强于 Blend，应该相对成熟工作流可比公司 获得一定溢价，但在留存和利润率证据更清晰前，不应拿到风险投资式 12x
              以上倍数。乐观情景需要满足两个 条件之一：要么当前收入已经远高于 $80 million 公开估计，要么公司经济性和战略护城河足以支撑公共可比
              公司尚无法捕捉的私募市场溢价。换句话说，公开证据能支撑这门业务落在健康估值区间内，但不能有把握地 支撑最高可见私募标记。能改变判断的不是又一次产品发布或又一个客户标识，而是更新后的收入、利润率、
