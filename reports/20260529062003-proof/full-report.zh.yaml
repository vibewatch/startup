        - 公开来源没有显示续约率或合同条款
      - - 银行 / 信用社 / 保险公司
        - 买方：运营 / 合规；用户：会员、借款人、保单持有人；付款方：机构
        - POA、账户文件、贷款材料、结算或保险表单
        - Baxter Credit Union 案例研究，以及 BusinessWire 对大型银行、USAA、TIAA 和 Transamerica 的引用
        - 身份保障可嵌入受监管的服务流程，潜在粘性较强
        - 多数公开证据来自引语，而不是分群级采用数据
      - - 汽车 / 设备融资
        - 买方：产权 / 运营；用户：借款人和服务人员；付款方：贷款方 / 融资公司
        - 车辆产权 POA、再融资或设备产权文件
        - Alliance Funding Group、Auto Approve，以及 BusinessWire 的销售单据表述
        - 相邻场景把 Proof 从房屋交割拓展到有担保贷款管理
        - 案例研究之外的当前交易量未披露
      - - 法律 / 遗产规划
        - 买方：律所或平台；用户：客户和律师；付款方：律所或终端客户
        - 遗嘱、信托、授权委托书、宣誓书和需要见证人的文件
        - NetLaw / Hargrove 部署，加上产品页的法律场景定位
        - 高价值信任工作流，可从公证交叉销售到见证人和身份服务
        - 没有公开律所客户数或续约数据
      - - 公告 / 民事登记记录 / 准政府场景
        - 买方：平台运营方或记录中介；用户：出版方、机构、公民；付款方：企业账户
        - 刊登宣誓书、认证记录订购，以及受监管记录处理
