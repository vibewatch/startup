      - number: '2.3'
        title: 买方、预算负责人和采纳路径
        blocks:
          - type: paragraph
            body: >-
              Proof 的用例让买方模型异常清晰。终端用户是借款人、学生、会员、客户、候选人或签署人，但买方和付款方通常是试图降低欺诈、合规风险或流程成本的机构。
              在房地产中，产权机构、贷款机构和交割团队关注承保人接受度、成本节省和时间节约。在账户找回中，经济负责人更可能是安全、欺诈或支持职能， 他们既想防止账户接管，又想限制 PII 暴露。在 FAFSA
              和教育场景中，买方是受联邦保障和审计要求约束的管理员。在设备融资和 POA 工作流中， 运营、法务和风险团队关注周转时间、已验证授权和审计轨迹。Proof 的包装支持这种细分：自助和 SMB
              销售动作按交易计费，更高层级则加入 API、 集成、SSO、留存控制和 SLA。因此采纳路径由工作流牵引，而不是由品牌牵引：定义一个高风险步骤，插入身份检查，返回决策，然后在之后复用该身份。
