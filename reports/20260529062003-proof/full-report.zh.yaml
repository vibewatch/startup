      - number: '5.2'
        title: 身份验证流水线与欺诈控制
        blocks:
          - type: paragraph
            body: >-
              Proof 产品技术栈中证据最扎实的部分，是它的身份流水线。横跨产品页和帮助中心文档，公开流程保持一致：接收方进入浏览器或链接式体验， 上传或捕获政府 ID
              证据，在需要时回答知识型问题，完成生物识别比对和活体检测，然后自动继续，或被路由给真人审核员或公证员。 这一序列与 NIST IAL2
              远程核验指引高度一致；该指引明确要求通过摄像头捕获证据、防篡改验证、签发来源检查、生物识别或物理比对，以及活体控制。 Proof 自己的页面随后加入第二层欺诈决策：Verify 通过 deepfake
              分析和风险评分处理实时视频升级，Defend 和 OmniTrust 则利用更广的网络、
              凭证、生物识别和支付信号，把可疑授权拦下复核。缺口不在于栈看起来单薄；问题是公开材料没有披露模型准确率、误报率，或连接自动审核与人工升级的精确阈值逻辑。
