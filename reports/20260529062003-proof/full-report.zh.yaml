  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 主要用户
      - 当前公开状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - Notarize
        - 签署人 + 公证员 + 企业运营
        - 已上线核心产品，公开产品面成熟
        - 24/7 公证员接入、见证人支持、即时数字文件交付
        - 需要公证完成率、按行业附加率，以及自有公证员与网络公证员使用之间的利润率拆分
      - - Identify
        - 风险、反欺诈、入驻和交易团队
        - 已上线核心产品
        - 入口身份验证，包含证明报告；IAL2 尝试失败时升级给反欺诈专员
        - 需要按证件类型拆分的转化率、失败率和签发来源覆盖
      - - Verify
        - 反欺诈团队和高风险运营
        - 已上线升级验证层
        - 人在回路的安全视频，结合深度伪造分析和风险评分
        - 需要平均升级率、专员利用率和 SLA 指标
      - - Sign
        - 协议和授权负责人
        - 已上线相邻产品面
        - 身份担保电子签名，而非单纯签名工作流
        - 需要公开合同 API 文档、模板自动化细节和企业附加率数据
      - - Close
        - 贷款机构、产权代理和房地产运营
        - 已上线核心垂直工作流
        - 数百万条规则、多种交割类型、即时文件包交付、二级市场定位
        - 需要 eVault 或 MERS 托管架构的直接证据，以及具名投资人的互操作性
      - - Defend
        - 反欺诈和风险团队
        - 已上线叠加层
        - 跨签名、公证和授权的实时拦截与复核决策
        - 需要损失率下降、误报和分析师工作量指标
      - - Command Center
        - 管理员、安全和合规
        - 已上线企业控制平面
        - 集中控制、SSO、配置开通、韧性控制
        - 需要公开角色矩阵、审计事件 schema 和策略导出细节
      - - Certify
        - 合规、记录和信任团队
        - 较新，但已有公开 GA 式营销页面
        - 面向文档、媒体和结构化数据的加密签名可验证记录
        - 需要客户证明、验证方生态细节，以及留存 / 撤销模型
      - - OmniTrust
        - 反欺诈分析和授权团队
        - 较新，但与 Defend 深度绑定
        - 专为冒充场景构建的模型，结合支付网络和网络情报信号
        - 需要精确率 / 召回率、再训练节奏和可解释性细节
      - - Digital ID
        - 跨产品复用用户
        - 已上线可复用凭证层
        - 一次验证，通过生物识别升级和加密审计轨迹复用身份
        - 需要 Proof 控制流程之外的可携带性细节和凭证生命周期控制
    notes: 状态反映公开产品证据，而非经审计采用情况。较新的凭证和反欺诈产品面已有明显市场宣传，但独立部署证据比 Notarize 和 Close 更薄。
