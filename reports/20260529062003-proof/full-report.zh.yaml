  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台模块与技术定位
        blocks:
          - type: paragraph
            body: >-
              Proof 当前的公开产品故事，已经明显宽于最初的 Notarize-only 身份。平台级页面现在把远程在线公证、可复用数字身份、真人验证、
              eSignature、房地产交割工作流、欺诈决策、管理控制和加密签名记录打包成一个身份授权栈。这个广度很重要，因为承销问题从“这是否只是 RON 供应商？” 变成“在签署事件之前、期间和之后，Proof
              能控制多少数字交易生命周期？”最强证据支持核心工作流主干：Notarize 处理签署仪式和见证人 / 公证员供给， Identify 处理交易前核验，Verify 增加真人升级，Sign
              把身份嵌入协议，Close 打包房地产操作，Defend 和 OmniTrust 增加风险评分， Digital ID 加 Certify 创建可复用凭证和加密记录。仍不够公开的是精确底层软件架构、开放 API
              表面，以及公司更新的凭证产品是已经深度采纳，还是仍在商业化阶段。
