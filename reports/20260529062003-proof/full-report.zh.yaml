      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR / 收入
        - 最新收入、ARR 定义和月度桥接
        - 估值支撑的最大单一驱动
        - CFO / 财务资料室
      - - 毛利率和服务强度
        - 产品级毛利率和实时服务成本结构
        - 决定公开可比公司溢价是否合理
        - 财务 + 运营
      - - 留存和扩张
        - NRR、GRR、续约、扩张 ARR 和头部客户集中度
        - 区分 logo 数量和持久价值
        - 收入运营 / 董事会材料
      - - 资本结构表和优先权
        - 当前优先股层级、债务、二级标记和清算条款
        - 晚期交易里，下行保护和收入规模同样重要
        - 法务 + 财务
      - - 垂直行业组合
        - 房地产、金融服务、法律和其他垂直行业的 ARR
        - 检验集中度和多元化主张
        - FP&A + 客户成功
      - - 退出路径
        - 实际 IPO / M&A 准备度、流动性意愿和时间表
        - 决定回报时间和倍数耐久性
        - CEO / 董事会 / 银行家尽调
    notes: 要把基于公开证据的判断变成可投资的承销视角，这些问题是最低数据集。
