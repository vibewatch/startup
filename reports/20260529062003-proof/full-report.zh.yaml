  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              Proof 的公司质量评分本质上为正，但以独角兽式价格买入并不清晰。乐观情景很直接：公司从远程公证 扩展到更宽的身份与授权栈，在抵押贷款、产权、信用合作社、公告、遗产规划和设备融资等场景保留了
              有意义的客户证据，并持续增加 Certify、AI-agent 身份标准等新的信任层。问题在于估值纪律。本次 梳理的公开证据不能干净支撑据称 2024 年 11 月约 $1B 的 Series
              E。最新完全互证的官方公开估值仍是 2021 年 Series D，约 $760 million；Forge 显示较晚的 10/27/2025 Series E 标记约 $986.7 million，
              Moderne 的 2024 年投资公告则未披露估值条款。对照 Sacra 对 2023 年收入 $80 million 的估计，这些 估值意味着两位数收入倍数，明显高于当前公开可比公司区间。如果 Proof
              此后收入已大幅超过 Sacra 基准， 同时保持有吸引力的利润率和留存，这一溢价可能合理。可是公开证据没有证明这些条件。因此，正确建议
              应对价格敏感：在当前私募标记下应观察或继续研究；只有管理层能补上数据缺口，或进入价格大幅下修时， 才更适合偏建设性。
