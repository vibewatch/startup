              笔数字交割和再融资，签署人几乎遍布所有州，且超过 20% 的 Proof 驱动交割来自 California。 产权和结算证据也很扎实。Home Services Title
              称，过去需要数天邮寄和协调的会话，现在不到 15 分钟就能完成；Homestead Title 报告 700+ 笔交易、2025 年平均会话 19 分钟、完成率 96.2%；Canyon Title 称自
              2022 年初起完成 1,500+ 笔交易， 每笔节省 20–30 分钟。在相邻金融工作流中，JB&B Capital 报告覆盖 50 个州的 3,100+ 笔交易，远程会话约 3 分钟；Alliance
              Funding Group 称一个月约 40 份授权书的试点，在周转时间从一周以上降至数小时、每份 POA 运输成本下降约 $40 后，扩展到每月 70–120 笔交易。
