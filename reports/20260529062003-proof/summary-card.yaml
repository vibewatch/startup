  topStrengths:
    - >-
      Pioneer and category leader in remote online notarization (RON), now expanded into a multi-product identity
      authorization suite (Notarize, Verify, Defend, Certify) with genuine network effects from a 24/7 notary network
      and 7,000+ enterprise customer relationships.
    - >-
      Secular tailwind from digital transaction adoption, federal and state RON legislation, and AI-agent
      proliferation—all of which drive demand for high-assurance identity and authorization infrastructure, validating
      Proof's expanded Certify/AI-identity mandate.
    - >-
      Tier-1 strategic partnerships with Visa (Oct 2025) and IDEMIA (Mar 2026) and FIDO Alliance membership signal
      institutional validation of the identity-authorization platform beyond the original real-estate vertical.
  topRisks:
    - >-
      Regulatory fragility: RON is enabled by state-by-state legislation (47 states as of 2025) with no federal
      preemption; a single adverse state ruling or reversal could reduce addressable revenue; federal eNotary
      legislation remains stalled.
    - >-
      Financial opacity and housing-cycle concentration: the company disclosed no primary financing round since 2021,
      laid off 25% of staff in 2022 during the mortgage downturn, and has not publicly confirmed ARR, gross margin, or
      NRR—leaving investors unable to independently validate the ~$987M Forge secondary mark.
    - >-
      AI deepfake and identity-fraud arms race: while deepfake risk validates Proof's Defend product, adversarial AI
      capabilities are advancing faster than detection methods, creating existential product risk if Proof's
      fraud-detection models fall behind.
  unresolvedGaps:
    - >-
      Current ARR, revenue growth rate, gross margin, and net revenue retention—the key inputs for validating the ~$987M
      Forge secondary mark against public SaaS comps.
    - >-
      Whether a reported Nov 2024 ~$1B Series E was a primary financing event or a secondary transaction, and its
      liquidation-preference and anti-dilution terms.
    - >-
      Vertical revenue mix and real-estate concentration: extent to which mortgage/title revenue remains >50% of total,
      creating cyclical risk.
    - >-
      AI-agent identity standard (Certify) adoption pipeline and revenue-contribution timeline beyond early partnership
      announcements.
