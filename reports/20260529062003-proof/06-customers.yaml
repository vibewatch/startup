tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Title agencies / underwriters
    - 'Buyer: title ops; user: closers / escrow; payer: enterprise account'
    - Seller-side, refinance, purchase, HELOC, and ancillary closing packages
    - $640B real-estate milestone on Close page plus Home Services, Homestead, Canyon, Champion, and Florida Agency Network evidence
    - Core production vertical and strongest public reference set
    - No public split of title vs lender revenue or top-account exposure
  - - Mortgage lenders / broker networks
    - 'Buyer: lending ops; user: brokers, closers, borrowers; payer: lender or title partner'
    - Digital mortgage closings, refinances, eClosings, and funding workflows
    - UWM 30,000+ closings in 2025; Thrive 100+ online closings in first year; JB&B 3,100+ transactions
    - Large-volume workflows validate production scale and compliance depth
    - Public sources do not show renewal rates or contract terms
  - - Banks / credit unions / insurers
    - 'Buyer: operations / compliance; user: members, borrowers, policyholders; payer: institution'
    - POAs, account documents, lending paperwork, settlement or insurance forms
    - Baxter Credit Union case study plus BusinessWire references to large banks, USAA, TIAA, and Transamerica
    - Potentially sticky because identity assurance can sit inside regulated servicing flows
    - Most public evidence is quote-based rather than segment-level adoption data
  - - Auto / equipment finance
    - 'Buyer: title / operations; user: borrowers and servicing staff; payer: lender / finance company'
    - Vehicle-title POAs, refinance or equipment-title paperwork
    - Alliance Funding Group, Auto Approve, and BusinessWire bill-of-sale language
    - Adjacency broadens Proof beyond home closings into secured-lending admin
    - Current volume outside case-study examples is undisclosed
  - - Legal / estate planning
    - 'Buyer: law firm or platform; user: clients and attorneys; payer: firm or end customer'
    - Wills, trusts, powers of attorney, affidavits, and witness-required documents
    - NetLaw / Hargrove deployment plus product-page legal positioning
    - High-value trust workflow with cross-sell from notarization into witnesses and identity
    - No public law-firm customer count or renewal data
  - - Public notice / vital records / government-adjacent
    - 'Buyer: platform operator or records intermediary; user: publishers, agencies, citizens; payer: enterprise account'
    - Affidavits of publication, certified-record ordering, and regulated record handling
    - Column 11,800+ notarized transactions since 2022; Vital Records Online 94%+ completion and <5-minute sessions
    - Shows Proof can serve compliance-heavy document ecosystems beyond lending
    - No retained direct government or education customer case study
  notes: Rows reflect publicly documented segments and named examples; current customer counts by segment are mostly undisclosed.
