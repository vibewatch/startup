- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'Proof’s named customer proof is strongest where the company publishes concrete workflow and outcome data rather than just logos. UWM is the clearest mortgage production example: brokers completed more than 30,000 digital closings and refinancings on Proof in 2025, with signers in almost every state and more than 20% of Proof-powered closings originating in California. Title and settlement evidence is also substantial. Home Services Title says sessions that once took days of mailing and coordination now close in under 15 minutes; Homestead Title reports 700+ transactions, a 19-minute average session in 2025, and a 96.2% completion rate; Canyon Title cites 1,500+ transactions since early 2022 plus 20–30 minutes saved per transaction. In adjacent finance workflows, JB&B Capital reports more than 3,100 transactions across all 50 states with roughly 3-minute remote sessions, while Alliance Funding Group says a one-month pilot of about 40 powers of attorney scaled into 70–120 transactions per month after turnaround fell from more than a week to a few hours and shipping costs dropped about $40 per POA. Credit-union and legal evidence is also operational rather than conceptual: Baxter Credit Union cut a days-long paper process to an average of 15 minutes and says usage tripled, while NetLaw says most estate-planning signings now finish in under 20 minutes with on-demand witnesses and a 4.95-star satisfaction rating. The important diligence distinction is that these are production-case-study signals, not passive logos, whereas First American and Florida Agency Network are better read as narrower quote-based corroboration.'
