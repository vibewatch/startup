figures:
- id: FU001
  title: Customer journey map — Proof enterprise adoption loop
  type: journey-map
  layout: wide
  summary: How document-heavy customers discover Proof, deploy it, and then expand into deeper trust workflows.
  claimRefs:
  - CU001
  - CU002
  - CU013
  - CU016
  - CU048
  - CU049
  data:
    items:
    - label: Workflow pain appears
      description: A lender, title team, law firm, or credit union hits mailing delays, in-person notary bottlenecks, or witness / identity friction.
    - label: Compliance review
      description: Security, legal, and ops teams evaluate nationwide validity, NIST IAL2 identity checks, and whether in-house notaries can remain in the workflow.
    - label: Initial deployment
      description: The customer launches a specific workflow such as closings, POAs, wills, or affidavit handling rather than a company-wide rip-and-replace.
    - label: Repeat operational use
      description: Teams move from one-off sessions to repeat transactional use once wait time, support, and completion quality prove acceptable.
    - label: Overflow / flexibility
      description: Customers blend in-house notaries with the Notarize Network when volume spikes, off-hours demand appears, or geographic coverage matters.
    - label: Expansion into trust platform
      description: Accounts add witnesses, identity verification, or eSign to turn notarization into a broader trusted-transaction workflow.
