chapter:
  number: 6
  title: Customers
  summary: Proof has credible production adoption proof in title, mortgage, credit-union, legal, and government-adjacent document workflows, with named case studies showing 30,000+ UWM closings in 2025, 1,500+ Canyon Title transactions since 2022, 700+ Homestead sessions with a 96.2% completion rate, 3,100+ JB&B transactions across all 50 states, and sub-20-minute signing experiences for Baxter Credit Union, NetLaw, and Vital Records Online. The evidence base is strongest for real-estate and document-intensive regulated verticals, while durability and concentration remain under-disclosed because public sources do not reveal renewal, churn, NRR/GRR, or top-customer mix. Adverse review sources show real service-quality friction around wait times, glitches, repeated verification, and support responsiveness, so the customer story is strong on deployment proof but weaker on measured retention.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Proof’s public customer map is broad enough to show a real multi-vertical business, but narrow enough that the company’s center of gravity is still obvious. The Notarize-for-business and product pages position the platform for lenders, title agents, banks, insurers, law firms, credit unions, and other document-heavy enterprises that need secure signatures, notarization, witnesses, and identity verification in one workflow. The strongest public deployment evidence clusters in real-estate and adjacent lending operations: title agencies, mortgage lenders, equipment and auto finance providers, and businesses processing powers of attorney or title paperwork. Legal and government-adjacent use cases are supportable but shallower. NetLaw and Hargrove Firm show estate-planning execution; Column and Vital Records Online show affidavit and certified-record workflows that serve courts, agencies, or regulated record-keepers. Proof’s own materials also say the platform supports education, but the retained evidence set does not contain a standalone named education deployment. Company-issued scale signals remain meaningful: the 2023 launch release cited more than 2,200 companies and millions of transactions, while the current Close page claims $640 billion in real-estate transactions. Still, the logo surface is wider than the deployment-proof surface. CB Insights lists customers such as First American, Transamerica, Zillow/dotloop, Snapdocs, and Westcor, but most of those logos lack fresh public outcome data, so they should be treated as awareness or relationship signals until management provides operating detail.'
