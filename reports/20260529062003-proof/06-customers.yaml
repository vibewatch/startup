  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-sector customer proof
    missingEvidence: A named government or education customer case study with workflow, deployment scope, and measured outcome.
    whyItMatters: Public-sector adjacency appears in product copy and government-adjacent cases, but not enough to underwrite that segment as a real growth engine.
    diligencePath: Request procurement references, named public-sector customers, or agency-approved case studies with transaction counts and renewal detail.
    relatedQuestionRefs:
    - QU007
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, renewal rate, and contract-term data by title, lender, financial-institution, legal, and other customer cohorts.
    whyItMatters: Case studies and reviews show adoption, but they do not prove that revenue is durable or that customers renew at attractive levels.
    diligencePath: Ask management for cohort tables, annual renewal schedules, logo churn, and transaction-frequency cohorts for the top customer segments.
    relatedQuestionRefs:
    - QU019
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Revenue or transaction share for the top 10 customers, top verticals, and major partner channels.
    whyItMatters: Public proof is real but heavily real-estate weighted, so a small number of large title or lender accounts could still dominate economics.
    diligencePath: Request a concentration schedule showing top accounts, top vertical mix, partner-channel exposure, and any minimum-volume commitments.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage
    missingEvidence: A complete public ledger of named Proof customers tagged as logo-only, pilot, production, expanded, or churned.
    whyItMatters: The retained sample is skewed toward the references that Proof chose to publish and may overstate deployment depth or customer quality.
    diligencePath: Rebuild the customer ledger from CRM reference lists, press releases, partner stories, procurement records, and archive snapshots; attach a status tag to each logo.
    relatedQuestionRefs:
    - QU002
    - QU023
    relatedTableRefs:
    - TU003
  - type: stale
    severity: material
    topic: current customer count
    missingEvidence: A fresh 2026 disclosed count of active customer accounts and deployed accounts by segment.
    whyItMatters: The public record contains strong case studies but lacks a current denominator that would show whether overall customer adoption is accelerating or flattening.
    diligencePath: Ask management for active-account counts, newly deployed accounts, and year-over-year net adds across title, lending, legal, and financial-institution segments.
    relatedQuestionRefs:
    - QU005
    - QU006
