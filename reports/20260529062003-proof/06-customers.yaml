- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / deployment risk
  - Impact
  - Diligence path
  rows:
  - - In-house notary + network overflow model
    - Accounts may depend on Proof only for overflow or off-hours rather than full workflow ownership
    - Good land-and-expand wedge, but shallow wallet share is possible
    - Request volume split between in-house and on-demand notary usage by top accounts
  - - Cross-sell into identity verification, eSign, and witnesses
    - Attach rates are undisclosed, so upsell durability is unproven
    - Could raise ARPU and switching costs if attach rates are high
    - Request attach-rate and expansion-revenue data for IDV, witnesses, and eSign
  - - Credit-union and legal expansion
    - Evidence comes from a few named references rather than a disclosed installed base
    - Shows Proof can move beyond title, but breadth may be overstated
    - Request active account counts and pipeline conversion for financial institutions and law firms
  - - Real-estate weighted customer proof
    - Most quantified public outcomes come from title and mortgage customers
    - Housing or title slowdown could disproportionately hit visible traction
    - Request revenue and transaction mix by real estate vs non-real-estate segments
  - - Logo breadth exceeds deployment depth
    - CB Insights and PR quotes list many logos without usage depth, dates, or outcomes
    - May mask a smaller set of truly scaled production customers
    - Provide customer ledger tagging each logo as pilot, production, churned, or partner-only
  - - Public-sector / education adjacency
    - Product pages mention education, but no retained direct public-sector or education case study exists
    - Could be an upside path, but today it remains unproven in public evidence
    - Ask for procurement references, agency logos, or education customer references with named outcomes
  notes: This table separates visible expansion mechanics from the public-data blind spots that still limit concentration underwriting.
