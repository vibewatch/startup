    {
      "id": "sizing-lenses-and-segment-attractiveness",
      "title": "Sizing lenses and segment attractiveness",
      "body": "Published sizing data makes the same point in numbers. A narrow RON-oriented source, Verified Market Research, values remote online notary services at only $1.77 billion in 2024, even if it forecasts rapid growth to $6.65 billion by 2032. By contrast, broader identity-verification publishers place the category in the mid-to-high teens of billions in 2026, with further growth into the high twenties or low forties depending on methodology and horizon. These contradictions are not noise; they are a direct consequence of different boundaries. Some publishers count only notarization services, others count ID verification platforms, and still others include fraud, onboarding, and compliance tooling. For Proof, the attractive segments are the ones where legal significance, fraud loss, auditability, and repeated customer interactions justify premium pricing: title and mortgage, security-led account recovery, regulated education workflows, equipment finance, and high-risk hiring. The market is large enough to matter, but only if Proof captures budgets outside the narrow notary category.",
