  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Proof participates in a layered market. The narrow remote-online-notary submarket is measured in low single-digit billions, while broader digital identity verification and fraud-prevention markets are already in the mid-to-high teens of billions in 2026 and forecast materially higher by 2030-2033. The commercial implication is that Proof's long-run upside depends less on one-off notarizations and more on whether it can convert regulated workflows such as closings, account recovery, FAFSA, equipment finance, POA, and candidate fraud into recurring identity-assurance spend."
  },
  "sections": [
    {
      "id": "market-boundary-and-category-logic",
      "title": "Market boundary and category logic",
      "body": "The first analytical task is to define the market boundary correctly. Proof is not only a remote-online-notary vendor anymore, even though notarization remains an important commercial wedge. Its pricing, product, and use-case pages show a broader stack that includes identity verification, secure e-signatures, fraud monitoring, digital closing workflows, and reusable digital credentials. That matters because the narrow RON market is much smaller than the broader digital identity verification market, and many workflows Proof targets—such as account recovery or candidate fraud—do not always require a notarial act. In practice, Proof's addressable spend sits in layers: a core RON layer where legality and notaries matter, a broader secure-agreement layer where signing and auditability matter, and an even broader identity-and-fraud layer where reusable credentials and lifecycle reauthentication matter. Market boundary discipline is therefore essential; otherwise the company can look artificially tiny or artificially huge depending on which lens an analyst chooses.",
