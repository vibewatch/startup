company:
  name: Proof
chapter:
  number: 5
  title: Product & Technology
  summary: 'Proof’s public product stack has moved well beyond classic remote online notarization. The company now exposes a layered platform across notarization, reusable identity, live video verification, fraud decisioning, enterprise administration, and cryptographically signed records, with especially strong evidence around the ID-proofing pipeline and real-estate closing workflow. The largest diligence gaps are not feature absence but transparency: public sources still do not prove a distinct eVault-style custody layer, disclose deepfake / OmniTrust model performance, or expose enough open API detail to underwrite implementation complexity with high confidence.'
sections:
- id: platform-architecture
  title: Platform modules and technical positioning
  body: 'Proof’s current public product story is materially broader than its original Notarize-only identity. The platform-level surfaces now bundle remote online notarization, reusable digital identity, live-agent verification, eSignature, real-estate closing workflow, fraud decisioning, administrative controls, and cryptographically signed records into one identity-authorization stack. That breadth matters because it changes the underwriting question from “is this just a RON vendor?” to “how much of the digital transaction lifecycle can Proof control before, during, and after a signed event?” The strongest evidence supports the core workflow spine: Notarize handles the signing ceremony and witness/notary supply, Identify handles pre-transaction proofing, Verify adds live escalation, Sign embeds identity into agreements, Close packages real-estate operations, Defend and OmniTrust add risk scoring, and Digital ID plus Certify create reusable credentials and cryptographic records. What remains
    less public is the precise underlying software architecture, open API surface, and whether the company’s newer credential products are already deeply adopted or still in commercialization mode.'
