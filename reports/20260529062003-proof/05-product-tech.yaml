  evidenceGaps:
  - type: missing-source
    severity: material
    topic: evault-custody
    missingEvidence: A current public document or customer architecture note proving whether Proof operates a distinct eVault or MERS-style eNote custody layer for mortgage workflows.
    whyItMatters: Immediate package delivery and secondary-market framing are useful, but investors still need to know whether custody, control, and investor handoff rely on a separate vault product or partner.
    diligencePath: Request product architecture diagrams, MERS / investor interoperability docs, named lender references, and any eVault or eNote custody certifications.
    relatedQuestionRefs:
    - QE010
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: fraud-model-governance
    missingEvidence: Model-governance evidence for OmniTrust and deepfake detection, including benchmark methodology, false-positive / false-negative rates, bias testing, drift monitoring, and escalation thresholds.
    whyItMatters: Fraud-prevention economics and operational burden depend on model quality, not just feature marketing. Without these metrics it is hard to size customer ROI or review-headcount needs.
    diligencePath: Request model cards, performance dashboards, governance policies, and customer case studies quantifying fraud reduction versus analyst workload.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: material
    topic: public-api-detail
    missingEvidence: Current public API reference, webhook schemas, auth model, and integration setup docs beyond workflow marketing and release-note snippets.
    whyItMatters: Proof clearly exposes workflow triggers and partner-fit claims, but enterprise implementation risk still depends on how opinionated the APIs, embeds, and eventing surfaces actually are.
    diligencePath: Request sandbox access, API reference exports, webhook payload examples, auth / rate-limit docs, and implementation guides for ATS, LOS, CRM, and admissions deployments.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
