- id: controls-standards-and-maturity
  title: Control plane, standards dependencies, and remaining technical gaps
  body: 'Public trust and control signals are credible, but they are unevenly distributed. Command Center gives the cleanest administrative view: centralized settings, SAML-based SSO, domain verification, provisioning hooks, and resilience language such as cross-region disaster recovery, DDoS prevention, and 24/7 security response. Outside the admin plane, Proof’s standards posture rests on a dense web of dependencies and external frameworks: NIST IAL2 guidance shapes the identity stack, FIDO provides a formal doc-auth and face-verification lens, Kantara is used in Proof’s public assurance language, MISMO governs remote-online-notarization process requirements for mortgage flows, and Fannie Mae now ties RON closings to MISMO-style audit-trail retention. The company is also extending the stack outward through Visa and IDEMIA partnerships and by presenting Know Your Agent plus PKI certificate issuance as a future-facing control for agentic transactions. Even so, two technical diligence gaps
    remain material: public sources do not prove a distinct eVault or MERS-style custody layer, and they do not expose enough detail on model governance, fraud thresholds, or open API schemas to underwrite implementation depth with high confidence.'
