tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Current public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Notarize
    - Signer + notary + enterprise ops
    - Core shipped product with mature public surface
    - 24/7 notary access, witness support, immediate digital document delivery
    - Need notarization completion rates, attach rates by industry, and margin split between own-notary and network-notary usage
  - - Identify
    - Risk, fraud, onboarding, and transaction teams
    - Core shipped product
    - Front-door identity verification with proof report and fraud-agent escalation on failed IAL2 attempts
    - Need conversion, fail-rate, and issuing-source coverage by document type
  - - Verify
    - Fraud teams and high-risk operations
    - Shipped step-up layer
    - Human-in-the-loop secure video with deepfake analysis and risk scoring
    - Need average escalation rate, agent utilization, and SLA metrics
  - - Sign
    - Agreement and authorization owners
    - Shipped adjacent surface
    - Identity-assured eSignature rather than signature-only workflow
    - Need public contract API docs, template automation details, and enterprise attach-rate data
  - - Close
    - Lenders, title agents, real-estate ops
    - Core shipped vertical workflow
    - Millions of rules, multiple closing types, immediate package delivery, secondary-market framing
    - Need direct proof of eVault or MERS custody architecture and named investor interoperability
  - - Defend
    - Fraud and risk teams
    - Shipped overlay
    - Real-time hold-and-review decisioning across signatures, notarizations, and authorizations
    - Need loss-rate reduction, false-positive, and analyst workload metrics
  - - Command Center
    - Admins, security, compliance
    - Shipped enterprise control plane
    - Centralized controls, SSO, provisioning, resilience controls
    - Need public role matrix, audit-event schema, and policy-export detail
  - - Certify
    - Compliance, records, and trust teams
    - Newer but public GA-style marketing surface
    - Cryptographically signed verifiable records for docs, media, and structured data
    - Need customer proof, verifier ecosystem detail, and retention / revocation model
  - - OmniTrust
    - Fraud analytics and authorization teams
    - Newer but deeply tied to Defend
    - Purpose-built impersonation model with payment-network and network-intelligence signals
    - Need precision / recall, retraining cadence, and explainability detail
  - - Digital ID
    - Repeat users across products
    - Shipped reusable-credential layer
    - Verify once, reuse identity with biometric step-up and cryptographic audit trail
    - Need portability detail outside Proof-controlled flows and credential lifecycle controls
  notes: Statuses reflect public-product evidence, not audited adoption. Newer credential and fraud surfaces are visibly marketed but have thinner independent deployment proof than Notarize and Close.
