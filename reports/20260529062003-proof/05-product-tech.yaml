- id: closing-delivery-and-operations
  title: Real-estate closing delivery, recipient UX, and notary operations
  body: 'Proof’s real-estate workflow is publicly described in more operational detail than its generic developer surface. Close says the platform enforces underwriter and notarial requirements through millions of rules, supports a broad set of closing types, and delivers completed packages immediately after the session. Separate mortgage-lender and title-agent resource hubs explain the transaction lifecycle from preparation through notarization, notifications, and completed-file access, which suggests the product is packaged as an operating workflow rather than a single document-signing screen. Recipient UX is intentionally lightweight: several use-case pages describe embedded flows, secure links, or browser-based identity steps that work without rip-and-replace implementation or mandatory native-app installs. Operationally, the Notary Network remains a core moat. Proof says it can provide its own notaries or let enterprises use in-house supply, requires NNA training and background checks
    for network admission, and tunes notary panels for specific use cases. Those claims support maturity in service operations, but they also imply ongoing human-operations dependence for edge cases, regulated closings, and high-assurance escalations.'
