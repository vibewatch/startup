- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Remote notarization for estate plans or general forms
    - Recipient meets notary online, can request witness if needed, and receives digital document immediately
    - Notarize + Notary Network + witness support
    - Eliminates in-person scheduling and wet-ink delays
    - Public materials do not disclose completion-time distribution or failure reasons by state
  - - Mortgage or title closing
    - Teams prepare docs, coordinate signing, notarize, and distribute completed package
    - Close + Notarize + title/mortgage workflow resources
    - Shorter closing timelines and immediate digital package delivery
    - No public proof of separate eVault custody or investor-specific connector list
  - - Account recovery
    - Institution routes locked-out user into Proof and receives yes/no decision
    - Identify / Verify recovery flow
    - Stops imposters while reducing PII exposure to support teams
    - No public API spec for decision webhooks or payload schemas
  - - Candidate fraud screening
    - Recruiter sends EasyLink or ATS-triggered verification, escalates risky cases to live video
    - Identify + Verify + Defend in hiring workflow
    - Filters bots, deepfakes, and impersonators before offer or onboarding
    - Public docs emphasize workflow outcomes more than endpoint-level integration detail
  - - Equipment-finance release or POA execution
    - Documents must be signed, notarized, and tied to the right person before asset handoff or authority transfer
    - Identify + Notarize + integration into LOS/CRM/workflow stack
    - Cuts release delays while adding audit trail and identity checks
    - Named integration roster is not public
  - - FAFSA or admissions identity review
    - Applicant is routed into embedded verification from aid or admissions process and flagged cases go to expert review
    - Identify + expert review aligned to audit outcomes
    - Creates documented verification outcomes and blocks fraudulent disbursements
    - Public pages do not disclose federal-program volumes or review turnaround statistics
  notes: Use-case rows summarize public workflow descriptions; measurable benefits are directional unless the company publishes a numeric SLA or savings metric.
