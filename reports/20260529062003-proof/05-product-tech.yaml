- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Key dependency or input
  - Publicly visible control
  - Risk
  rows:
  - - Link-based / embedded entry surface
    - Starts the transaction in browser, email, ATS, LOS, admissions, or support flow
    - Customer application or workflow trigger
    - EasyLinks, embedded verification, shared-inbox recipient-group activation updates
    - Open API documentation remains thin
  - - Identity evidence capture
    - Collects government ID images and identity attributes
    - Camera-enabled device, public-record data, issuing-source validation
    - Credential analysis, KBA, accepted-ID rules
    - Coverage gaps by document type or weak public-record footprint can create manual fallbacks
  - - Biometric and liveness stage
    - Confirms the applicant is present and matches evidence
    - Live selfie or video capture
    - Face match plus liveness detection aligned to IAL2-style controls
    - No public accuracy, bias, or spoof-bypass metrics
  - - Human escalation
    - Resolves failed automation or high-risk events
    - Fraud agent, live reviewer, or notary
    - Verify secure video, on-demand fraud agents, notary comparison of signer to credential
    - Human review adds service intensity and potential queue risk
  - - Fraud decisioning
    - Scores whether the transaction should pass, hold, or escalate
    - OmniTrust, network data, payment-network signals, human-agent feedback
    - Defend holds suspicious transactions and surfaces risk clues
    - No public threshold logic or false-positive statistics
  - - Execution and ceremony layer
    - Collects signature, witness, notarization, or closing completion
    - Notary, witness, signer, title workflow
    - Notarize, Sign, Close, mixed-signer workflows
    - Regulatory state-by-state complexity and edge-case ceremony handling
  - - Reusable credential and evidence layer
    - Carries identity forward and creates verifiable records
    - Digital ID, Certify, PKI concepts, cryptographic binding
    - Digital ID audit trail, verifiable records, KYA / certificate-authority narrative
    - Public custody, revocation, portability, and eVault detail remain incomplete
  - - Enterprise administration layer
    - Controls who can access the platform and under what rules
    - Customer IdP and admin policy owners
    - SAML SSO, domain verification, provisioning, centralized settings
    - Public role-permission schema and audit export detail are limited
  notes: This table combines marketed modules with standards-backed steps. It maps visible process layers, not an audited software bill of materials or endpoint inventory.
