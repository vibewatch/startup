- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality signal
  - Status
  - Scope
  - Why it matters
  - Public gap
  rows:
  - - NIST IAL2-aligned remote proofing controls
    - Supported by official workflow descriptions plus NIST reference standard
    - ID evidence capture, tamper checks, biometric or physical comparison, liveness
    - Frames the minimum assurance bar for regulated remote identity proofing
    - No public assessment report showing exact control mapping by product
  - - Kantara assurance language
    - Publicly cited on Command Center and reinforced by Kantara commentary
    - Identity assurance / trustmark posture
    - Adds independent credibility beyond first-party marketing
    - Fetched evidence does not include a clean certificate artifact or certificate number
  - - FIDO identity-verification framework
    - Independent public certification framework exists for doc auth and face verification
    - Document authentication and selfie match claims
    - Useful external lens on whether Proof’s IDV narrative matches recognized testing categories
    - No public proof in this run of Proof-specific FIDO certification listing
  - - AICPA SOC 2 and enterprise controls
    - Publicly cited on Command Center and trust-oriented use-case pages
    - Security program and enterprise procurement posture
    - Important for selling into finance, title, and other regulated buyers
    - No public report, exception summary, or control scope detail
  - - Notary network training and quality metrics
    - Publicly visible
    - Background checks, NNA training, curated panels, customer ratings, answer speed
    - Shows service-quality controls around the human part of RON
    - No public churn, utilization, or error-rate disclosure
  - - MISMO / Fannie Mae RON alignment
    - Supported by MISMO and Fannie Mae documentation plus Close positioning
    - Mortgage-closing process, audit trails, electronic loan file handoff
    - Important for secondary-market-ready digital closings
    - Still no public eVault or MERS-specific custody documentation
  - - Fraud-model governance transparency
    - Not publicly disclosed
    - Deepfake detection, OmniTrust scoring, escalation thresholds
    - Critical for implementation risk and false-positive economics
    - Need accuracy, drift, bias, and retraining evidence from management
  notes: Statuses combine first-party product statements with standards and ecosystem documents. Missing public reports remain genuine diligence gaps, not formatting omissions.
