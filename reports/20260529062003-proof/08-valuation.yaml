- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - DocuSign
    - EV / Sales + scale
    - ~2.78x EV / sales; ~$9.63B market cap; ~$3.22B revenue
    - Best public agreement-workflow comp
    - More mature and broader than Proof, with lower growth and less notary specificity
  - - Okta
    - EV / Sales + identity premium
    - ~4.82x EV / sales; ~$16.61B market cap; ~$3.00B revenue
    - Useful upper-end identity / security comp
    - Identity pure-play with different customer motion and scale
  - - nCino
    - EV / Sales + regulated financial workflow
    - ~3.21x EV / sales; ~$1.74B market cap; ~$610M revenue
    - Captures regulated workflow software in financial services
    - Not a notarization or consumer-identity company
  - - Blend Labs
    - EV / Sales + mortgage workflow
    - ~2.81x EV / sales; ~$416M market cap; ~$127.6M revenue
    - Useful mortgage-tech comp for sector cyclicality
    - Weaker business quality and narrower workflow scope than Proof
  - - Proof historical private mark
    - 2021 valuation
    - ~$760M after $130M Series D and 600% YoY revenue growth
    - Last fully corroborated official/major-media private valuation marker
    - Stale and tied to pandemic-era growth conditions
  - - Proof late-2025 market-data mark
    - Series E / secondary-style marker
    - ~$986.7M on Forge, 10/27/2025
    - Best supportable near-$1B public marker located in this run
    - Third-party marketplace-style source; the 2024 Moderne investment announcement did not disclose valuation terms
  notes: Comp set is intentionally a sample of workflow, identity, and mortgage-adjacent public companies plus Proof’s own private valuation markers.
