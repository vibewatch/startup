chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports the quality of the company more than the quality of the current price. Public sources reviewed here do not cleanly corroborate a reported ~$1B Nov 2024 Series E; the strongest supportable late-stage public marker is a later 10/27/2025 Forge Series E print around $986.7 million, while the last fully corroborated official / major-media mark remains the 2021 Series D around $760 million. Using Sacra''s $80 million 2023 revenue estimate and current public comp EV / sales ranges for Docusign, Okta, Blend, and nCino, a public-market lens points to a valuation band well below a ~$1.0 billion private mark unless Proof''s growth, margin profile, and retention quality improved materially after 2023. Because those forward inputs remain undisclosed, the evidence-based call is price-sensitive and cautious: track the company, but do not underwrite a bullish entry at or above the latest visible unicorn-level mark without private data.'
sections:
- id: recommendation-and-price-sensitivity
  title: Recommendation and price sensitivity
  body: 'Proof earns a fundamentally positive company-quality score but not a clear go-ahead at a unicorn-like price. The bull case is straightforward: the company expanded from remote notarization into a broader identity and authorization stack, retained meaningful customer proof across mortgage, title, credit unions, public notice, estate planning, and equipment finance, and keeps adding new trust layers such as Certify and AI-agent identity standards. The problem is valuation discipline. The public evidence reviewed in this run does not cleanly support a reported ~$1B Nov 2024 Series E. The latest fully corroborated official public mark is still the 2021 Series D at roughly $760 million, while Forge shows a later 10/27/2025 Series E marker of about $986.7 million and Moderne''s 2024 investment announcement disclosed no valuation terms. Against Sacra''s $80 million 2023 revenue estimate, those values imply double-digit revenue multiples that sit well above today''s public comp band. That premium might be deserved if Proof has since grown well past the Sacra revenue base while holding attractive margins and retention. Public evidence, however, does not prove those conditions. So the correct recommendation is price-sensitive: track or research-more at the current private mark, and only lean constructive if management can close the data gap or if the entry price resets materially lower.'
