  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-arr-and-revenue
    missingEvidence: Latest ARR, revenue, and growth bridge after 2023.
    whyItMatters: Valuation sensitivity changes radically depending on whether current revenue is near $80M or far above it.
    diligencePath: Request audited revenue by year, current ARR definition, and monthly bridge.
    relatedQuestionRefs:
    - QV003
    - QV022
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-retention
    missingEvidence: Gross margin, contribution margin, NRR, GRR, churn, and contract duration.
    whyItMatters: These are the core variables that determine whether Proof should trade near Blend, Docusign, Okta, or above them.
    diligencePath: Request cohort retention deck and product-level gross-margin waterfall.
    relatedQuestionRefs:
    - QV017
    - QV026
    relatedTableRefs:
    - TV002
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Preferred stack, debt, secondary marks, liquidation preferences, and any structured terms.
    whyItMatters: Downside protection can be poor even when topline looks strong.
    diligencePath: Request current cap table, debt schedule, and financing documents.
    relatedQuestionRefs:
    - QV017
