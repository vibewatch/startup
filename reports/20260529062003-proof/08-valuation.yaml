- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue support fails
    - Current revenue remains near or below public 2023 estimate without strong growth bridge
    - Premium multiple case collapses
    - Move to pass at unicorn-like price
  - - Customer concentration is extreme
    - Real estate or top accounts dominate ARR far more than public evidence suggests
    - Downside becomes sector-specific rather than platform-wide
    - Apply higher discount and require concentration mitigation
  - - Margin quality disappoints
    - Service-cost intensity or fraud operations suppress gross margin materially
    - Public-comp premium becomes harder to justify
    - Cut valuation range and extend diligence
  - - Cap-table downside is unattractive
    - Preferences, debt, or secondary marks create weak downside protection
    - Entry discipline worsens even if operating business is solid
    - Avoid or demand lower price
  - - Exit readiness is weaker than implied
    - No real IPO or M&A path despite marketplace interest
    - Return timing and liquidity degrade
    - Reframe from growth bet to long-duration private hold
  notes: Triggers are designed to change the recommendation, not just the narrative tone.
  claimRefs:
  - CV022
  - CV030
  - CV033
  - CV036
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR / revenue
    - Latest revenue, ARR definition, and monthly bridge
    - Single biggest driver of valuation support
    - CFO / finance data room
  - - Gross margin and service intensity
    - Product-level gross margin and live-service cost structure
    - Determines whether public comp premium is justified
    - Finance + operations
  - - Retention and expansion
    - NRR, GRR, renewals, expansion ARR, and top-customer concentration
    - Separates logo count from durable value
    - Revenue operations / board pack
  - - Cap table and preferences
    - Current preferred stack, debt, secondary marks, and liquidation terms
    - Downside protection matters as much as topline in late-stage deals
    - Legal + finance
  - - Vertical mix
    - ARR by real estate, financial services, legal, and other verticals
    - Tests concentration and diversification claims
    - FP&A + customer success
  - - Exit path
    - Actual IPO / M&A readiness, liquidity appetite, and timeline
    - Determines return timing and multiple durability
    - CEO / board / banker diligence
  notes: These asks are the minimum data set needed to turn a public-evidence view into an investment-ready underwriting view.
