- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Proof has real product breadth and customer proof across multiple regulated workflows.
    - If current revenue, retention, and margins are materially stronger than public estimates, valuation support improves.
  - - Identity plus notarization plus fraud-control integration may deserve a premium over narrow workflow peers.
    - If Proof cannot prove a durable moat beyond product marketing, premium-multiple logic weakens.
  - - Customer proof in UWM, BCU, Column, and other cases supports the company-quality thesis.
    - If those reference accounts are small or low-ARR relative to the reported customer count, the premium case weakens.
  - - Current public comp multiples are materially below the implied multiple at a ~$1B private mark.
    - If public-market multiples rerate higher or Proof’s revenue base is much larger than assumed, the valuation gap narrows.
  - - Risk and disclosure opacity still dominate the investment decision.
    - If management provides ARR, gross margin, NRR, and cap-table detail, the recommendation could move constructive.
  notes: The anti-thesis is primarily about price and missing evidence, not about whether Proof is a real company.
