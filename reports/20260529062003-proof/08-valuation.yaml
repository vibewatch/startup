- id: scenario-ranges-and-what-moves-the-call
  title: Scenario ranges and what moves the call
  body: 'The bear, base, and bull scenarios differ less on whether Proof is a real business and more on what has to be true for the price. The bear case assumes that the best public revenue estimate is still directionally right, that mortgage concentration and fraud-model opacity justify a discount to the upper public comp range, and that the next private round could clear below prior expectations. The base case assumes Proof is materially stronger than Blend and should deserve some premium over mature workflow comps, but not a venture-style 12x-plus multiple without clearer retention and margin proof. The bull case requires one of two things: either current revenue is already much higher than the $80 million public estimate, or the company’s economics and strategic moat justify a private-market premium that public comps cannot yet capture. Said differently, public evidence clears the business at a healthy valuation range, but it does not clear the highest visible private mark with confidence. What moves the call is not another product launch or another customer logo—it is updated revenue, margin, retention, and cap-table evidence.'
