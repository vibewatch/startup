- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Public revenue estimate remains directionally right; concentration and opacity warrant little or no premium to public comps
    - ~$250M-$400M value using ~3x-5x on ~$80M revenue
    - Mortgage concentration, multiple compression, down-round risk
    - Plausible if growth slowed and transparency remains poor
  - - Base
    - Proof deserves some premium for product breadth and customer proof, but not a venture-style multiple without fresh economics
    - ~$500M-$800M value using ~6x-10x on current or somewhat higher revenue
    - Retention, margin quality, and cap-table unknowns
    - Most evidence-consistent range from public data
  - - Bull
    - Current revenue is materially above public estimate and moat / economics justify premium private multiple
    - ~$900M-$1.2B+ value through 9x-12x on $100M+ revenue or similar
    - Requires proving diversified growth and strong unit economics
    - Possible, but dependent on private facts not yet public
  notes: Scenario logic is deliberately simple and sensitive to public-information gaps; it is not a substitute for management data.
