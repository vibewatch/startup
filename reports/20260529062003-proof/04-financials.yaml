- id: traction-and-public-unit-economics
  title: Traction and public unit-economics evidence
  body: 'Public traction evidence is real even if company-level P&L disclosure is not. Proof said in March 2026 that it had secured more than $643 billion in real-estate transactions, including $151 billion in 2025 alone, and cited named customers such as First American and UWM. HousingWire separately reported that the platform had already facilitated $374 billion of real-estate sales by January 2024, which supports the direction of the later official milestone even if the precise counters differ by date. Historical operating momentum was dramatic during the pandemic: Business Wire said Notarize surpassed 100,000 digital real-estate closings after 400% growth in ninety days, and both TechCrunch and the company’s own Series D announcement said revenue grew 600% year over year into the 2021 financing. Sacra’s later estimate of roughly $80 million of 2023 revenue provides a useful anchor but should still be treated as an external estimate, not a disclosed company metric. The unit-economics
    read is therefore mixed: transaction volume and list pricing are visible, but realized take rate, gross margin by product, CAC, and net revenue retention remain private.'
