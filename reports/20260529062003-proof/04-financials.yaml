  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and base/upside/downside runway after the last financing event.
    whyItMatters: Without cash and burn visibility, investors cannot test whether Proof can absorb another mortgage slowdown without raising capital.
    diligencePath: Request CFO cash bridge, trailing 12-month burn, and 24-month operating plan.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-by-product
    missingEvidence: Gross margin or contribution margin split for notarization, title, identity verification, and eSignature.
    whyItMatters: The key open question is whether Proof behaves like software, a marketplace, or a tech-enabled service.
    diligencePath: Request product-level gross-profit waterfall including notary network and trusted-referee costs.
    relatedQuestionRefs:
    - QI016
    - QI018
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: realized-enterprise-pricing
    missingEvidence: Average contract value, discounting, minimums, implementation fees, and expansion economics for Premium and Enterprise accounts.
    whyItMatters: List pricing for Pro plans does not reveal actual monetization quality in the enterprise base that likely drives most value.
    diligencePath: Review sample customer contracts, pricing approval policies, and realized price cohorts.
    relatedQuestionRefs:
    - QI002
    - QI005
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: conflicting-data
    severity: medium
    topic: total-funding-today
    missingEvidence: Reconciled total capital raised after 2021, including any later preferred financings, extensions, or secondary transactions.
    whyItMatters: Third-party trackers disagree on today’s total funding, which distorts dilution and valuation interpretation.
    diligencePath: Request official financing ledger, cap table, and investor rights schedule.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: sector-concentration
