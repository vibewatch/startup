- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current ARR / revenue run-rate
    - Cannot size valuation multiple or growth durability
    - Request audited 2023-2026 revenue by month and ARR definition
  - - Gross margin by product line
    - Cannot tell whether Proof behaves like software, marketplace, or tech-enabled service
    - Request gross profit waterfall for notarization, IDV, eSign, and title
  - - Burn and runway
    - Capital adequacy remains narrative rather than modeled
    - Request board cash bridge, burn trend, and 24-month scenario forecast
  - - Realized enterprise pricing / discounting
    - List prices may overstate monetization quality
    - Request sample enterprise contracts, price realization, and implementation fees
  - - Sector concentration / customer concentration
    - Mortgage dependence could amplify cyclicality and concentration risk
