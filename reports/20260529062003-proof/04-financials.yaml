callouts:
- calloutType: insight
  title: Proof is evolving from pure usage pricing toward hybrid SaaS monetization
  body: The Business Pro+ launch matters because it shows Proof testing recurring software revenue on top of transaction fees. That should improve revenue quality if adoption is material, but the company has not disclosed conversion or churn.
  claimRefs:
  - CI006
  - CI007
  - CI032
- calloutType: risk
  title: Real-estate concentration remains the clearest financial risk
  body: The company’s largest public volume disclosures and most detailed pricing surfaces are still tied to title and mortgage workflows, while the 2022 layoffs directly followed a housing slowdown. That suggests a cyclical revenue base even after the broader platform rebrand.
  claimRefs:
  - CI013
  - CI018
  - CI041
  - CI042
- calloutType: assumption
  title: Proof should not be benchmarked as cleanly as horizontal eSignature SaaS
  body: Docusign’s filings show what a scaled agreement platform can look like at maturity, but Proof’s notary network, trusted-referee sessions, and real-estate workflow support probably keep near-term service intensity higher than public-software peers.
  claimRefs:
  - CI026
  - CI027
  - CI029
  - CI045
