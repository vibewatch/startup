  rows:
  - - Online notarization
    - Usage-based transaction fee using Proof’s on-demand notary network
    - Per meeting / per seal / per witness
    - Business Pro starts at $25 per meeting with add-on charges for extra seals, witnesses, and signers
    - High for list pricing; low for realized margin
    - Request monthly notarization volume, blended take rate, and network cost of fulfillment
  - - Identity verification
    - Standalone verification and step-up trusted-referee sessions
    - Per signer / per referee meeting
    - Identify starts at $4 per signer; trusted-referee meeting listed at $25
    - High for list pricing; low for attach-rate data
    - Request verification volume, attach rate to non-notary transactions, and fraud-loss savings evidence
  - - eSignature
    - Identity-assured signature workflow sold alongside notarization and title flows
    - Per transaction
    - Listed as per-transaction pricing on public pricing pages; exact realized enterprise contract value undisclosed
    - Medium
    - Request list price, realized price, and attach rate inside multi-product contracts
  - - Title closings with Notarize Network
    - Real-estate transaction fee including compliant online notarization supply
    - Per closing / ancillary meeting
    - Starts at $99 per closing and $35 for ancillary documents or loan mods
    - High for list pricing
    - Request mix of purchase, seller-side, HELOC, refinance, and ancillary transactions
  - - Title closings with in-house notaries
    - Software and workflow fee when customer provides notary labor
    - Per closing / ancillary meeting
    - Starts at $45 per closing and $25 for ancillary documents or loan mods
    - High for list pricing
    - Request margin difference vs Notarize Network closings and customer migration mix
  - - Business Pro+ subscription
    - Recurring subscription overlay on top of usage fees
    - Per account / month
    - Self-serve upgrade launched in April 2026 at $199 per month
    - Medium-high
    - Request paid-seat count, churn, and whether subscription replaces or complements transaction fees
  notes: Rows describe publicly visible monetization surfaces rather than audited revenue mix; the company does not disclose ARR split or segment gross margin.
