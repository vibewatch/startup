  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Financial metrics and capital runway
    missingEvidence: Proof has not disclosed audited financial statements, NRR, ARR, gross margin, or cash runway. No primary
      raise since 2021 Series D is confirmed but burn rate is unknown.
    whyItMatters: Without verified financial data, cash runway cannot be assessed. A hidden liquidity shortfall would be a
      thesis-breaking event.
    diligencePath: Request data room with audited financials, monthly ARR cohort, gross margin by product line, burn rate
      history, and current cash balance.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: California RON activation timeline
    missingEvidence: California SoS technology project for native RON has no confirmed completion date beyond the January
      2030 statutory backstop. SoS project progress is not public.
    whyItMatters: California is strategically critical for Proof's title and mortgage expansion. Any multi-year delay directly
      defers the California-native RON revenue opportunity.
    diligencePath: Monitor SoS technology procurement announcements; engage ALTA advocacy network for timeline intelligence;
      request Proof's California market-activation roadmap.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: Cyber and E&O insurance coverage
    missingEvidence: Proof has not publicly disclosed insurance coverage for errors and omissions, cyber liability, or identity-fraud-related
      claims.
    whyItMatters: A significant identity-fraud or data-breach event without adequate insurance would directly impair financial
      position and create uninsured liability exposure.
    diligencePath: Request certificate of insurance and policy limits for E&O, cyber, and professional liability; confirm
      biometric-data-breach and fraud-facilitated-closing coverage.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: Incident response and fraud history
    missingEvidence: Proof's incident response plan for identity-fraud events is not publicly documented. No historical breach
      or fraud disclosure is on record from public sources.
    whyItMatters: Platform risk materializes as a discrete event. Without knowing historical incident frequency and response
      capability, fraud platform risk cannot be calibrated.
    diligencePath: Request incident response plan, historical security incident log, and client notification records; ask
      for deepfake detection false-accept rate from production.
    relatedQuestionRefs:
    - QR031
  - type: private-evidence-only
    severity: material
    topic: ICE Encompass integration terms
    missingEvidence: ICE Encompass integration agreement terms, exclusivity provisions, fee structure, and termination rights
      are not publicly disclosed.
    whyItMatters: The Encompass integration is a key distribution path for Proof's mortgage-lender sales. Integration disruption
      or ICE competitive action would materially impair mortgage channel.
    diligencePath: Request the ICE Encompass integration agreement; review exclusivity and termination clauses; assess whether
      integration fees affect unit economics at scale.
    relatedQuestionRefs:
    - QR032
  - type: private-evidence-only
    severity: material
    topic: Capital structure and governance
    missingEvidence: Board composition, liquidation preferences, anti-dilution provisions, voting rights, and founder vesting
      schedules are not publicly disclosed.
    whyItMatters: For any new investor, understanding the existing capital structure is essential to assess return scenarios
      in down-round, acquisition, or IPO exits.
    diligencePath: Request cap table, Series D term sheet, board composition, and drag-along and tag-along provisions; confirm
      right of first refusal on new rounds.
    relatedQuestionRefs:
    - QR033
