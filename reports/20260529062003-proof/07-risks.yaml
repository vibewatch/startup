- id: section-operational-security
  title: Operational, Quality, and Cybersecurity Risk
  body: 'Proof''s operational risk profile is shaped by four interdependent vulnerabilities: on-demand notary supply, session
    reliability, identity-proofing accuracy, and cybersecurity. The Notarize Network is a gig-style workforce of commissioned
    notaries available 24/7/365. Supply disruptions during peak real-estate closing seasons directly affect enterprise SLAs.
    Trustpilot''s 24,000 reviews and JustUseApp document recurring complaints about multi-hour wait times, dropped video sessions,
    repeated verification loops, and browser incompatibility errors. These failures translate directly into borrower fallout
    and client churn risk. Identity-proofing accuracy carries dual-sided risk. NIST''s FRVT testing finds measurable false-reject
    and false-accept rates across commercial presentation-attack-detection systems. NIST IR 8584 documents face morphing attacks
    as a viable method to defeat face-comparison systems. Cybersecurity risk is heightened by the sensitivity of Proof''s
    data assets: biometric face images, government-ID scans, and financial documents. A breach would trigger CCPA notification
    obligations, potential FTC enforcement, and reputational damage with financial-institution customers. Proof discloses
    SOC 2 Type II certification and IAL2 compliance, but the scope of controls and assurance period are not publicly detailed.'
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: section-partner-capital
  title: Partner, Dependency, and Capital Risk
  body: 'Proof has three primary dependency concentrations: the housing-market cycle, GSE and integration-partner infrastructure,
    and its capital base. The November 2022 layoff of 25 percent of staff following housing market contraction, documented
    by HousingWire, National Mortgage News, and TechCrunch, demonstrates that Proof''s cost structure was indexed to housing
    volumes. CEO Pat Kinsel explicitly cited housing market deterioration and restricted access to future investment — the
    two risks are linked because a market-driven revenue shortfall simultaneously reduces internal cash generation and investor
    appetite for a new raise. Proof''s eMortgage workflows require ongoing conformance with Fannie Mae eNote eligibility standards.
    The ICE Encompass integration represents a key distribution path into mortgage lenders. Capital risk is the least visible
    but most consequential financial risk: Proof has not disclosed any new primary fundraise since the 2021 Series D. With
    212 million dollars in disclosed lifetime capital, the company has operated at an unknown burn rate for more than four
    years without an announced external capital raise. Without audited financials, no assessment of burn, cash runway, or
    net revenue retention is possible from public sources.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: section-people-execution
  title: People, Execution, and Thesis-Break Risk
  body: 'Proof faces execution risk on two fronts: managing the complexity of its identity-platform pivot while sustaining
    its core RON business, and maintaining leadership depth in a company that discloses limited organizational information.
    The strategic pivot from notarization-as-a-service to an identity-authorization platform broadens the product surface
    (Identify, Verify, Defend, Digital ID) and increases capital and headcount requirements. If housing volumes remain subdued
    and new identity use cases do not achieve sufficient revenue before cash runway narrows, execution risk becomes capital
    risk. The 2019 internal financing crisis, the 2022 workforce reduction, and the absence of a disclosed new capital event
    since 2021 collectively signal this financing risk is not hypothetical. Key-person dependency is concentrated in Pat Kinsel,
    who is simultaneously founder, CEO, and president. The 2025 additions of a Chief Privacy Officer and Chief Revenue Officer
    strengthen the bench but do not eliminate founder-dependency risk. Full board composition, liquidation preferences, and
    voting rights are not publicly disclosed. Proof''s technical compliance posture is strong (SOC 2 Type II, IAL2, Kantara
    certification), but financial, operational, and governance controls remain unverifiable without data-room access. The
    mitigation maturity assessment in TR005 summarizes where public evidence supports or cannot support confidence in Proof''s
    risk controls.'
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  tableRefs:
  - TR004
  - TR005
