runDate: '2026-05-29'
company:
  name: Proof
chapter:
  number: 7
  title: Risk Assessment
  letter: R
  summary: 'Proof''s risk profile is anchored by three compounding axes: regulatory fragility across a state-law-dependent
    RON framework that lacks federal preemption; operational and partner concentration in a housing-market-sensitive customer
    base demonstrated by the November 2022 25-percent workforce reduction; and financial opacity with no disclosed primary
    raise since the 2021 130M dollar Series D. Deepfake-facilitated identity fraud, documented by FBI IC3 and FinCEN, simultaneously
    validates Proof''s mission and raises the stakes of any identity-proofing failure. The thesis survives if Proof maintains
    SOC 2 and IAL2 certification, diversifies revenue beyond housing, and secures additional capital on favorable terms. It
    breaks if RON regulation regresses, a data breach or fraud event reaches scale, or housing contraction forces a second
    restructuring before a capital raise.'
sections:
- id: section-regulatory-legal
  title: Regulatory and Legal Risk
  body: 'Proof operates at the intersection of multiple regulatory regimes without a single federal preemptive framework.
    Remote online notarization legality rests on a patchwork of state statutes: as of mid-2026 more than 44 states have enacted
    permanent RON authorization, but several still lack it. The federal SECURE Notarization Act (H.R. 1059, 118th Congress)
    sought a national standard but was not enacted. The ESIGN Act (15 U.S.C. 7001) explicitly does not preempt state RON statutes,
    making Proof''s legal exposure structural. For mortgage workflows, Fannie Mae''s eNote acceptance policies add a GSE layer:
    any policy reversal would shut Proof out of the conforming mortgage channel. California SB 696, effective January 2024,
    expanded the market but added state-specific credential-analysis and tamper-evident-technology mandates. Privacy risk
    is the most legally active dimension. Proof''s IAL2 workflow collects facial biometric data, government-ID images, and
    KBA responses — all categories attracting regulatory scrutiny. The CPPA requires documented purpose limitation for biometric
    data, and the California AG may impose 7500 dollars per intentional CCPA violation. FinCEN''s 2024 deepfake alert and
    FBI IC3''s 12.5 billion dollar 2024 internet crime figure frame the adversarial threat context.'
  claimRefs:
  - CR001
  - CR002
