  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: footprint
      missingEvidence: A management-verified current facility list that distinguishes production factories from headquarters or prototyping sites.
      whyItMatters: The footprint is a core scale signal for underwriting manufacturing capacity and acquisition integration progress.
      diligencePath: Request the current facility roster, addresses, functions, and square footage by site, then reconcile six-facility versus seven-factory wording.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Audited revenue or run-rate, verified headcount, customer concentration, and exact active-customer count.
      whyItMatters: These are cover metrics that materially affect valuation support, operating leverage, and concentration risk.
      diligencePath: Request the latest board deck or data room exports covering monthly revenue, gross margin, headcount by site and function, and top-customer exposure.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: TO002 leadership roster completeness
      missingEvidence: Public or diligence-only documentation naming Amca's board members, independent directors, and wider executive bench.
      whyItMatters: Founder depth is part of the underwriting case, and the current public record is too narrow to assess succession, oversight, or functional redundancy.
      diligencePath: Request the current board list, executive org chart, and any leadership biographies not published on the website.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: TO003 stakeholder economics
      missingEvidence: A current cap table, board-rights summary, and customer concentration view covering major primes and strategic accounts.
      whyItMatters: Public syndicate lists do not reveal ownership concentration, investor control rights, or whether a named customer drives outsized revenue exposure.
      diligencePath: Request the post-Series-B cap table, investor rights summary, and top-customer revenue mix before treating the stakeholder map as economically complete.
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO003]
