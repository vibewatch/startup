artifact: company-overview
slug: amca
runDate: '2026-10-15'
company:
  name: Amca
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Amca is an El Segundo aerospace-and-defense component platform founded in 2024 that combines
    engineering, qualification, and acquired certified factories into one operating model. Public
    sources support $376.5 million of disclosed equity funding through a May 2026 $300 million
    Series B at a valuation above $1 billion, but they still leave material gaps on revenue,
    headcount, customer concentration, and even whether the footprint should be described as six
    facilities or seven factories.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Amca presents itself as the Advanced Manufacturing Company of America, headquartered in El
      Segundo and founded in 2024 to rebuild capacity in critical aerospace and defense components.
      The official company materials consistently describe an integrated model that combines rapid
      prototyping, qualification, and an AS9100D-certified factory network so components can move
      from requirements into production faster than legacy suppliers. Company-issued materials also
      position Amca in the layer between standardized parts and full systems, with example products
      spanning sensors, power units, flight-control computers, and human-machine interfaces.
    claimRefs: [CO001, CO002, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership concentration and governance visibility
    body: >-
      The assigned source set makes the founder pair, not a broader executive bench or board, the
      visible center of the company narrative. Jai Malik appears as the principal spokesperson in
      launch, financing, and acquisition materials, while Eli Giovanetti is the operating
      co-founder with disclosed production and engineering experience from SpaceX. That supports a
      clear founder-market-fit story, but it also means governance depth remains a diligence item:
      the reviewed sources do not identify independent directors, board committees, or a wider C
      suite beyond the founders.
    claimRefs: [CO003, CO014]
    tableRefs: [TO002]
  - id: capital-base-and-scale
    title: Capital base, valuation, and current public scale
    body: >-
      Public disclosures show a fast financing cadence: an initial $76.5 million launch round in
      April 2025 and a $300 million Series B in May 2026. Independent coverage ties the later
      round to a valuation above $1 billion and names Caffeinated Capital as lead, with
      participation from Lightspeed, Andreessen Horowitz, Lux, Construct, and House Capital.
      Public scale is directionally meaningful but not perfectly clean: independent reporting
      described six facilities across California, Iowa, and New York totaling more than 123,000
      square feet, while a later market-data profile summarized operations as seven factories
      across the same states.
    claimRefs: [CO006, CO007, CO008, CO009, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Platform milestones and remaining diligence gaps
    body: >-
      The operating thesis is acquisition-led from the start. Assigned sources tie the platform to
      Electro-Mech Components at launch, then to Cal-Draulics, BC Systems, and later Aerospace
      Control Products, expanding coverage from human-machine interfaces into hydraulics and
      pressure measurement. The evidence also supports real customer and program exposure, including
      Boeing at launch, F-35-related component work, and company claims of deliveries to nearly
      every aerospace-and-defense prime. What the public record still does not provide are audited
      revenue, customer concentration, or verified headcount figures, so later judgment calls still
      depend on management diligence rather than public artifacts alone.
    claimRefs: [CO010, CO013, CO015, CO016]
    figureRefs: [FO001]
