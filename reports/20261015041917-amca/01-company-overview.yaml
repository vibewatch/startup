    title: Company milestone timeline
    type: timeline
    summary: Public sources support a rapid build from 2024 founding to 2026 Series B scale, but
      the exact current footprint still has conflicting public descriptions.
    data:
      items:
        - year: 2024
          label: Founded by Jai Malik and Eli Giovanetti
          detail: Amca was founded in 2024 to build a faster domestic supply base for critical aerospace and defense components.
          tone: positive
        - date: '2025-04-09'
          label: Public launch and initial $76.5M financing
          detail: The company launched publicly with $76.5 million in initial funding and announced the Electro-Mech Components acquisition.
          tone: positive
        - period: 'Aug 2025'
          label: Cal-Draulics acquisition reported
          detail: Manufacturing Dive said Amca acquired Cal-Draulics in August 2025, extending the acquisition-led manufacturing platform into hydraulic products.
          tone: positive
        - period: 'By May 2026'
          label: BC Systems added before the growth round
          detail: Independent coverage said BC Systems had already been acquired by the time of the Series B announcement.
          tone: positive
        - date: '2026-05-20'
          label: $300M Series B at >$1B valuation
          detail: Multiple independent sources tied Amca's Series B to a valuation above $1 billion and a broader expansion plan.
          tone: positive
        - date: '2026-05-26'
          label: Six-facility footprint publicized
          detail: Thomasnet described six facilities across California, Iowa, and New York totaling more than 123,000 square feet.
          tone: warning
        - date: '2026-07-25'
          label: Later profile summarizes seven factories
          detail: Venture Capital Tracker later summarized operations as seven factories across the same states, creating a public-record wording conflict.
          tone: warning
        - year: 2026
          label: ACPI acquisition expands pressure-switch and hydraulics scope
          detail: Amca said the Aerospace Control Products acquisition added custom pressure measurement and deepened its fluid-systems coverage.
          tone: positive
    claimRefs: [CO010, CO011, CO012, CO016]
