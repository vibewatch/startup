      - ['Lux Capital', 'Continuing investor', 'Named in both launch and Series B syndicates, implying continuity through early scaling', 'Confirm ownership, reserves strategy, and whether Lux anchors any technical diligence or talent access']
      - ['Boeing', 'Publicly named customer / demand signal', 'Cited at launch and in later coverage as evidence the company already serves large aerospace programs', 'Quantify revenue exposure, program criticality, qualification status, and concentration risk']
    notes: >-
      This is a public-facing stakeholder map, not a cap table; importance reflects disclosed round
      roles and customer signaling, not verified ownership percentages or contractual control.
    enumerationScope:
