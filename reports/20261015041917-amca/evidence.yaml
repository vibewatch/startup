evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: footprint
    missingEvidence: >-
      A management-verified current facility list that distinguishes production factories from headquarters or
      prototyping sites.
    whyItMatters: The footprint is a core scale signal for underwriting manufacturing capacity and acquisition integration progress.
    diligencePath: >-
      Request the current facility roster, addresses, functions, and square footage by site, then reconcile six-facility
      versus seven-factory wording.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue or run-rate, verified headcount, customer concentration, and exact active-customer count.
    whyItMatters: These are cover metrics that materially affect valuation support, operating leverage, and concentration risk.
    diligencePath: >-
      Request the latest board deck or data room exports covering monthly revenue, gross margin, headcount by site and
      function, and top-customer exposure.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: TO002 leadership roster completeness
    missingEvidence: >-
      Public or diligence-only documentation naming Amca's board members, independent directors, and wider executive
      bench.
    whyItMatters: >-
      Founder depth is part of the underwriting case, and the current public record is too narrow to assess succession,
      oversight, or functional redundancy.
    diligencePath: Request the current board list, executive org chart, and any leadership biographies not published on the website.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 stakeholder economics
    missingEvidence: >-
      A current cap table, board-rights summary, and customer concentration view covering major primes and strategic
      accounts.
    whyItMatters: >-
      Public syndicate lists do not reveal ownership concentration, investor control rights, or whether a named customer
      drives outsized revenue exposure.
    diligencePath: >-
      Request the post-Series-B cap table, investor rights summary, and top-customer revenue mix before treating the
      stakeholder map as economically complete.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent dollar market sizing for the exact layer between commodity aerospace parts and full systems, including
      a defensible SAM and SOM.
    whyItMatters: >-
      Without a precise external sizing benchmark, the chapter can justify urgency and buyer relevance but cannot
      tightly quantify long-run upside or compare penetration assumptions across valuation cases.
    diligencePath: >-
      Obtain analyst, public-company, or procurement datasets that isolate spend on critical sub-tier aerospace and
      defense components by category and customer segment.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: Contract-weighted customer mix, budget ownership, and concentration by platform, program, or named account.
    whyItMatters: >-
      Buyer logos alone do not show whether demand is broad-based or concentrated in a small number of programs with
      lumpy procurement timing.
    diligencePath: >-
      Request pipeline, bookings, and customer-concentration data in management diligence and reconcile it with any
      public procurement records or program references.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Public price sheets, sample quotes, or contract structures for Amca and comparable alternatives.
    whyItMatters: Pricing and packaging are a required comparison dimension, and public evidence does not yet support it.
    diligencePath: Request sample customer proposals, contract minimums, or procurement-side references for equivalent programs.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-discovery
    missingEvidence: Official product or customer proof from named adjacent peers that establishes component-level overlap with Amca.
    whyItMatters: >-
      The fetched pool names possible peers, but it does not yet prove whether they solve the same job at the same layer
      of the stack.
    diligencePath: >-
      Pull official competitor product, compliance, and customer materials for the named comps before treating them as
      direct rivals.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-economics
    missingEvidence: >-
      Requalification timelines, approved-vendor status changes, and customer win-loss or multisourcing data for
      migrated programs.
    whyItMatters: Those facts determine whether certification and installed base create real lock-in or merely slow-moving inertia.
    diligencePath: >-
      Ask management for program-level migration case studies and corroborate them with customer or procurement
      references.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: missing-financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, and cash-burn history by quarter.
    whyItMatters: >-
      These are the core inputs needed to test valuation support, operating leverage, and whether faster delivery
      creates real profit rather than just activity.
    diligencePath: Request historical financial statements plus a bridge from bookings to revenue and gross profit.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Quarter-end cash, debt, covenant package, and monthly burn or cash-use forecast.
    whyItMatters: >-
      Funding raised is not the same as current liquidity, so next-round dependency cannot be underwritten from public
      sources alone.
    diligencePath: Request latest board package, debt agreements, and a 12- to 24-month liquidity forecast.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-opacity
