    whyItMatters: >-
      The gap is small numerically but matters because footprint scale and capability density are central to Amca's
      industrial-thesis narrative.
    diligencePath: >-
      Request a current operating-site schedule with square footage, certifications, headcount, and product
      responsibility by location.
