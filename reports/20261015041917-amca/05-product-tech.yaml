- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Replace sole-source critical components
    - Aging suppliers, long lead times, and shrinking qualified capacity can hold up larger platforms
    - Acquire the supplier, keep the legacy know-how, and expand engineering/manufacturing capacity inside the Amca network
    - Public sources repeatedly frame the benefit as lower supply-chain risk and faster delivery
    - No independent before/after lead-time dataset by product family
  - - Modernize legacy component designs for new programs
    - Technical data and qualification effort sit between obsolete part designs and new system requirements
    - Use in-house engineering plus acquired supplier expertise to redesign, qualify, and produce updated variants
    - Manufacturing Dive says Rapid can compress design-to-qualified-workflow timelines into weeks or a few months in some cases
    - Speed claims are still management-reported rather than benchmarked by customers
  - - Source specialized power electronics and magnetics
    - Programs need small, lightweight high-performance power components with trusted heritage
    - Payne Magnetics adds premium magnetics design and manufacturing under the Amca umbrella
    - Public evidence ties the business to Boeing aircraft and multiple military platforms
    - No public evidence on share of spend, redesign wins, or reliability metrics
  - - Source hydraulic and pressure-switch components
    - Legacy fluid-system components can be hard to procure and qualify
    - ACPI plus Cal-Draulics give Amca a stated fluid-systems capability with certified manufacturing support
    - Public releases say the network now covers most critical fluid-systems components
    - No public field-failure, MTBF, or qualification-yield data
  notes: Benefits are described from retained public sources and should be treated as directional until customer-side operating metrics are disclosed.
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE008
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Supplier acquisition and continuity
    - Acquire niche certified suppliers before owner retirement or capacity loss
    - Requires access to target companies with durable customer approvals and transferable know-how
    - Integration can fail if tacit knowledge leaves with sellers or senior operators
  - - Engineering and technical-data-package development
    - Translate customer need into redesigned or updated component definitions
    - Depends on experienced aerospace engineers and legacy design records
    - Public evidence does not expose revision-control, simulation, or software-tooling detail
  - - Qualification and test workflow
    - Validate redesigned parts and prepare them for customer acceptance
    - Depends on internal test capacity, customer qualification cycles, and documented processes
    - Timeline compression claims are not independently benchmarked in the retained pool
  - - Certified manufacturing network
    - Produce low-volume, high-reliability components inside AS9100-oriented sites
    - Depends on site certifications, tooling availability, and workforce continuity across plants
    - Current site count and site-by-site capabilities are not fully reconciled publicly
  - - RAPID AI-enabled orchestration
    - Coordinate design, qualification, and production handoffs across the network
    - Depends on proprietary workflow software being reliable enough to sit in the delivery path
    - No public evidence on system uptime, model controls, cyber posture, or customer-facing integrations
  notes: This table describes the operating stack implied by retained evidence; it is not a public system architecture diagram or a claim that every layer is fully software-integrated today.
