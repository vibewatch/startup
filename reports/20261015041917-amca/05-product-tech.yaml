company:
  name: Amca
chapter:
  number: 5
  title: Product & Technology
  summary: Amca is publicly described as an acquisition-led aerospace component platform that combines engineering, qualification, and certified manufacturing across acquired specialist suppliers rather than selling a standalone software product. Evidence is strongest on component categories and workflow compression, while public proof on security, reliability, and exact facility count remains incomplete.
sections:
- id: product-scope-and-customer-job
  title: Product scope and the customer job
  body: Amca is positioned around the customer problem of replacing fragile single-source component suppliers with a faster path from engineering to qualified production. Company-authored launch materials describe the target layer as the products between standardized parts and full systems, naming sensors, power units, and flight-control computers, while the current website frames the mission as expanding competition and capacity for critical components. In workflow terms, the company is not selling a generic factory automation pitch; it is trying to help primes and sustainment programs source hard-to-procure aerospace parts from suppliers that can inherit legacy know-how and then modernize it.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE002
- id: capability-map-and-operating-architecture
  title: Capability map and operating architecture
  body: The retained evidence points to an operating model built from acquired component specialists plus a shared engineering and qualification layer. Public sources tie Electro-Mech to human-machine-interface hardware, Payne Magnetics to power magnetics and related electronics, and ACPI to pressure and liquid-level switching, with third-party summaries extending the component list to electromechanical systems, hydraulics, sensors, and avionics subsystems. Independent coverage also describes Rapid as an AI-enabled workflow for engineering, qualification, and production, which suggests that software is a process accelerator inside the industrial stack rather than a separately monetized product surface. That architecture makes the industrial thesis legible, but most details remain described at the category level rather than in public technical documentation.
  claimRefs:
  - CE002
  - CE005
  - CE006
  - CE007
  - CE008
  - CE011
  tableRefs:
  - TE001
  - TE003
  figureRefs:
  - FE001
- id: maturity-deployment-and-differentiation
  title: Maturity, deployment, and differentiation
  body: 'Public deployment evidence is better than for many private industrial startups, but it is still uneven. The launch release tied the first supplier to Boeing programs, the Payne acquisition referenced use on the 737MAX, F-16, and F-18, and Manufacturing Dive reported that Rapid had been deployed for the F-35 as well as commercial widebody and narrowbody aircraft. Across those sources, Amca differentiates itself less through a novel component SKU than through speed: it claims to combine supplier acquisition, technical data-package work, qualification testing, and certified production so that legacy components can be modernized and delivered faster than the incumbent supply chain. That is a credible positioning wedge, although the public record does not yet provide program-by-program conversion, uptime, or field-failure data that would prove repeatability at scale.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE008
  - CE011
- id: control-surface-and-technical-risks
  title: Control surface and technical risks
  body: 'The biggest product-technology risk is that the public record is materially stronger on aspiration and acquired capability categories than on operational control evidence. Sources point to qualification testing and AS9100-certified manufacturing capacity, but the retained pool does not include a public status page, security center, API or developer documentation, or a practitioner-community proxy that would show external technical engagement. A second risk is basic operating-footprint ambiguity: one retained independent summary says six facilities, while another says seven factories, which is manageable analytically but still means the current network description is not fully settled in public. For diligence, that pushes the burden onto direct data-room proof around site-level certifications, throughput, scrap, on-time delivery, and which parts of Rapid are actually production-critical.'
  claimRefs:
  - CE009
  - CE010
  - CE012
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Electro-Mech human-machine-interface products
    - Aircraft and defense OEM program teams
    - Legacy supplier acquired at launch; publicly tied to Boeing customer line
    - Immediate installed-base product line inside the Amca network
    - No public SKU list, revenue mix, or production volumes
  - - Payne Magnetics power magnetics and related power-electronics components
    - Aerospace electronics and defense power-system programs
    - Acquired February 2026; legacy platform exposure cited across 737MAX, F-16, and F-18 programs
    - Adds magnetics depth and extends Amca toward one of the broader publicly claimed power-solution ranges
    - No public data on qualification backlog, lead times, or attach rate to Rapid
  - - ACPI pressure and liquid-level switches plus fluid-system components
    - Hydraulic and fluid-system buyers on commercial and defense aircraft
    - Acquired December 2025 with follow-on manufacturing investment planned
    - Extends the portfolio into flight-critical sensing and hydraulic adjacencies
    - No public evidence on current program count, defect rates, or new-product pipeline
  - - RAPID engineering and qualification workflow
    - Internal engineering teams and prime/OEM customers needing faster part qualification
    - Publicly described as deployed on F-35 and commercial aircraft programs
    - Potential differentiator is workflow compression across design, qualification, and production
    - No public architecture, model-governance, or reliability documentation
  - - El Segundo prototyping and testing plus certified factory network
    - Program managers needing engineering-to-production continuity
    - Operational footprint exists, but current facility count is inconsistent across retained sources
    - Combines prototyping, testing, and certified manufacturing rather than outsourcing each step
    - Need site-by-site certification list, tooling capacity, and throughput by plant
  notes: Rows mix company-issued and third-party descriptions; they capture publicly evidenced product surfaces and operating assets, not audited output or margin contribution.
