    rows:
      - - Export-control and defense-program compliance drift
        - US defense/aerospace programs tied to F-35, F-16, F-18, and other mission-critical platforms
        - Public sources show defense-program exposure but not a current export-control or controlled-data framework
        - Medium
        - High
        - Legacy qualified suppliers plus certified manufacturing infrastructure
        - High
        - Review DDTC/ITAR-EAR scope, CMMC-NIST controls, and site-level restricted-program handling
      - - Product-liability and airworthiness quality escapes
        - Flight-critical switches, liquid-level components, and power electronics on commercial and defense aircraft
        - Sources cite long operating histories and reliability claims, but no public recall or warranty-loss data
        - Medium
        - High
        - Inherited qualifications, engineering support, and investment in manufacturing footprint
        - Medium-high
        - Request quality-escape logs, warranty reserves, corrective-action history, and customer scorecards
      - - Post-acquisition contract, IP, and transaction disputes
        - Serial acquisitions across legacy suppliers and knowledge transfer from retiring owners
        - No retained source reports litigation, but the acquisition cadence raises integration and transfer risk
        - Medium
        - Medium-high
        - Public releases emphasize founder/owner continuity and engineering support
        - Medium
        - Review purchase agreements, retention packages, IP assignments, and post-close claims history
    notes: >-
      Qualitative register compiled from retained public sources; absence of a
      disclosed case or enforcement action is not proof of absence.
