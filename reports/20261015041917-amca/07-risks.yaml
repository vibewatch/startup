        - Official releases emphasize decades-old supplier know-how and owner continuity as part of the thesis
        - Medium
        - High
        - Medium
        - Medium-high
        - No disclosed retention metrics for key engineers, inspectors, or operators
      - - Throughput shortfall versus claimed speed gains
        - Manufacturing Dive attributes 67%-70% faster delivery ambitions to RAPID and integrated manufacturing
        - Medium
