  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Customer and program concentration
        - Boeing at launch; later named primes include BAE Systems, Airbus, Textron, Bombardier, Honeywell, and GE Aerospace
        - Revenue demand and qualification pull-through
        - Publicly disclosed customer list is still narrow relative to valuation
        - A top program slows, reprices, or insources and growth evidence stalls
        - High
        - Broader named-customer set by May 2026 than at launch
        - High until customer mix and contract depth are disclosed
      - - Acquisition target pipeline
        - Legacy supplier owners, brokers, and distressed or retiring industrial assets
        - Raw material for roll-up and capacity build-out
        - Core to Amca's operating model
        - Attractive targets are scarce, expensive, or hard to integrate at the required speed
        - High
        - Sector narrative and recent financing improve sourcing credibility
        - Medium-high
      - - Capital-market support
        - Existing venture backers and prospective next-round or liquidity investors
        - Funds working capital, acquisitions, and greenfield expansion
        - Elevated after a $1B-plus Series B
        - The next financing round reprices the company before operating proof catches up
        - High
        - Large recent round and continued investor participation
        - Medium-high
    notes: >-
      Counterparty risk here mixes customers, acquisition suppliers, and
      capital providers because all three are explicit dependencies in the
