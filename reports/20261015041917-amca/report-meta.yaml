companyProfile:
  summary: >-
    Amca is a 2024-founded aerospace and defense manufacturing platform that acquires qualified legacy suppliers,
    modernizes their engineering and qualification workflows, and sells critical components into commercial aerospace
    and defense programs. Public evidence shows the company pairing rapid prototyping and software-enabled manufacturing
    with a multi-site factory network, but the same record still leaves core diligence gaps around audited economics,
    concentration, and retention.
  headquarters: El Segundo, California, USA
  foundingLocation: El Segundo, California, USA
  founders:
    - name: Jai Malik
      role: Co-founder and CEO
      background: Serial investor and entrepreneur focused on aerospace and defense.
      claimRefs:
        - CO003
    - name: Eli Giovanetti
      role: Co-founder and COO
      background: Former senior production and engineering leader at SpaceX.
      claimRefs:
        - CO014
  productSummary: >-
    Amca acquires and modernizes certified aerospace and defense component suppliers, combining rapid prototyping,
    qualification, and multi-site manufacturing to produce critical components such as sensors, power units,
    hydraulics-related products, flight-control computers, and human-machine interfaces.
  customerFocus: Commercial aerospace OEMs, defense primes, and prime-linked program customers
  businessModel: Product sales plus bundled engineering and qualification work across acquired manufacturing platforms
  stage: Series B
