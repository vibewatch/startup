              下一步不是争论 Amca 是否有野心；留存来源已经证明了这一点。真正的尽调任务，是把野心转化为可纳入投资判断的价格。最能改变立场的三个要求是：按被收购平台核实收入和利润率、客户集中度与重复订单质量，以及围绕超过
              $1B-plus 估值的资本结构表条款。公开记录还存在一个基本足迹不一致：B 轮公告同时描述了 6 家关键零部件工厂和包括总部在内的 7
              家工厂，这提醒我们披露精度仍不成熟。在这些问题解决前，投资逻辑更适合被视为押注未来证明的期权，而不是价格清晰的复利资产。
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV015
