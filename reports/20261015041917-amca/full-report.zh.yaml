  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据表明，收入要靠收购来的合格产能和更快工程周期，转成已交付的关键部件项目。
    data:
      nodes:
        - id: acquire
          label: 收购合格的传统供应商
          detail: 收购经认证的部件制造商，保留其现有产品线、工装和客户资质。
        - id: modernize
          label: 投资布局和工程能力
          detail: 在被收购站点增加工程、资质测试、原型开发和制造投资。
        - id: rapid
          label: 部署 RAPID 工作流
          detail: 使用工程到生产平台，缩短设计、资质认证和制造之间的交接。
        - id: produce
          label: 交付关键部件
          detail: 交付开关、液压相关产品、电力电子产品，以及其他飞行或任务关键部件。
        - id: customers
          label: 服务主承包商和大型 OEM 项目
          detail: 公司发布时的公开来源点名 Boeing，后续来源还提到 Lockheed、BAE Systems、Airbus、Textron、Bombardier、 Honeywell 和 GE Aerospace。
        - id: economics
          label: 真实经营数据仍未公开
          detail: 公开证据没有披露收入结构、毛利率、定价兑现或现金续航期，因此从经营活动走到利润的最后一段仍未得到验证。
      edges:
        - from: acquire
          to: modernize
          label: 历史产能加资本开支
        - from: modernize
          to: rapid
          label: 工程与认证流程
        - from: rapid
          to: produce
          label: 更快交付周期
        - from: produce
          to: customers
          label: 零部件发货
        - from: customers
          to: economics
          label: 收入只能间接看见
    approximationNotes: 由于留存来源没有披露收入或毛利各环节的数值，这是一张机制图，而不是量化瀑布图。
