  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - RAPID 部署、收购和工厂利用率转化为已披露的增长及重复项目胜利
        - 只有在经审计的经济性支持后，上一轮价格的溢价才具备投资判断依据
        - 整合被收购供应商的执行压力仍然存在
        - 披露经验证的收入质量、利润率和客户多元化
      - - 基准
        - Amca 持续赢得项目并扩张产能，但短期内公开经济性仍然稀少
        - 在更有力的证据出现前，当前价格只能大致按上一轮估值来辩护
        - 披露稀薄，使退出选择权和下一轮定价充满不确定性
        - 增量披露，但没有完整的基本面重估
      - - 悲观
        - 在披露改善前，竞争、利用率缺口或弱于预期的经济性浮现
        - 由于当前价格锚缺乏公开基本面支撑，下一轮价格持平至下跌变得可能
        - 倍数压缩、集中度或整合滑坡
        - 里程碑延迟、客户多元化不足或股权结构表形成悬垂
    notes: 公开来源没有披露经审计的收入、利润率、现金消耗或优先权条款，因此情景区间是围绕已披露的 $1B-plus 融资锚点给出的方向性范围，而非精确的 DCF 或倍数输出。
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV013
      - CV014
