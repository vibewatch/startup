      layers:
        - label: 任务需求
          detail: 客户需求集中在关键航空航天和国防零部件上；这些零部件的现有供应商正在老化，或只有单一来源。
          outputs:
            - 难以采购的零部件
            - 项目维持压力
        - label: 收购的专业供应商
          detail: Amca 靠收购拥有既有技术积累和认证资质的老牌业务来扩充能力。
          modules:
            - Electro-Mech HMI 产品
            - Payne Magnetics 电源组件
            - ACPI 压力和液位开关
        - label: 工程与现代化改造
          detail: 内部团队会重新设计或更新老旧零部件，而不只是撮合第三方生产。
          modules:
            - 零部件设计更新
            - 技术数据包
            - 新产品变体
        - label: 认证与测试
          detail: 认证测试被呈现为一项内部能力，可以缩短通往获认可生产的路径。
          modules:
            - 认证流程
            - 原型制作与测试
            - 客户审批支持
        - label: 合规制造
          detail: 生产依托的是一组面向航空航天的工厂网络，而不是单一原型车间。
          modules:
            - 面向 AS9100 的流程
            - 专用工装
            - 小批量高可靠产出
        - label: 加快交付
          detail: RAPID 被描述为连接工程、认证和制造的流程层，目的是加快交付。
          outputs:
            - 更快完成从设计到生产的交接
            - 覆盖更多主承包商的零部件
    approximationNotes: 这是一套公开证据支持的能力栈，不是内部系统图；它只反映留存来源所支持的类别层信息，未包含未披露的落地细节。
