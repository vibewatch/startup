  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，Amca 从单一供应来源的痛点切入，接手既有客户，再靠工程和认证吞吐扩张，而不是依赖客户自助采用。
    data:
      items:
        - label: 单一来源零部件痛点浮现
          actor: OEM、主承包商和维保团队
          touchpoints:
            - 关键零部件的脆弱供应变得紧迫
            - 买方寻找具备本土产能的合格替代供应商
          tone: risk
        - label: 收购供应商带来客户入口
          actor: 老牌供应商所有者和既有客户
          touchpoints:
            - Amca 收购一家拥有既有客户关系的合规供应商
            - 接手的项目带来最初的需求可见性
          tone: neutral
        - label: 工程与认证重塑交付路径
          actor: 客户工程和采购团队
          touchpoints:
            - Rapid 压缩从设计到合格生产的流程
            - 评估时，AS9100 式制造纪律很重要
          tone: opportunity
        - label: 在已点名平台上部署生产
          actor: 项目经理和工厂运营人员
          touchpoints:
            - 公开记录将 Amca 的工作与 A320、737MAX、F-35、F-16 和 F-18 相关场景联系起来
            - 对主承包商的点名不再局限于一家被收购工厂，扩大了信任基础
          tone: opportunity
        - label: 多地点网络推动扩张
          actor: 现有和新客户项目
          touchpoints:
            - 六家工厂加上 El Segundo 设施，扩大了可用产能
            - 继续收购或新建厂址，也是扩张逻辑的一部分
          tone: opportunity
        - label: 持续性仍需尽调
          actor: 投资者和财务团队
          touchpoints:
            - 没有公开 NRR、GRR、流失率或客户集中度指标
            - 扩张逻辑依赖复购订单和多元化，但这些信息尚未披露
          tone: risk
    approximationNotes: 这张旅程图综合了来源支持的客户证明和风险披露，呈现的是分析者归纳的流程，而非公司发布的真实漏斗。
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险集中在整合、集中度和估值压力，而不是某一项已披露的法律事件。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 整合被收购供应商
          note: 连续收购和网络铺开是执行层面的核心负担。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 中
              tone: medium
            - label: 高
              tone: critical
        - label: 客户与项目集中度
          note: 启动阶段的证据首先点名 Boeing；后续证据增加了客户名称，但没有说明收入结构。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: 中低
              tone: warning
            - label: 高
              tone: critical
        - label: 合规与产品责任控制
          note: 合规制造是一个缓释信号，但公开合规细节很少。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 估值与下一轮重置
          note: 公开估值的增长速度快于已披露经营指标。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: 低
              tone: warning
            - label: 高
              tone: critical
        - label: 设施数量与披露歧义
          note: 公开来源对六处设施还是七家工厂说法不一。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低
              tone: warning
            - label: 中
              tone: medium
        - label: 新建工厂执行
          note: 新建厂址除了带来并购整合风险，还会增加资本开支和产能利用率风险。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 低
              tone: warning
            - label: 中高
              tone: high
    claimRefs:
      - CR003
      - CR009
      - CR010
      - CR011
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐仍然谨慎：融资和实体规模是真实的，但用于投资判断的数据仍落后于公开价格锚点。
    data:
      nodes:
        - id: financing
          label: 融资锚点
          value: $300M Series B; $1B+ disclosed valuation threshold
          note: 近期价格信号很强，但它仍然只是一个融资定价标记。
        - id: scale
          label: 早期规模证明
          value: 6 facilities and 123,000+ square feet disclosed
          note: 有真实的工业化建设，也有已点名的客户和平台参考。
        - id: gap
          label: 投资判断缺口
          value: No audited revenue, margin, burn, or concentration disclosure
          note: 公开来源没有展示足以支撑当前价格的经营数据。
        - id: pressure
          label: 下行压力
          value: Competition, workforce limits, and supply-chain execution risk
          note: 独立来源对下行空间的评论仍然不可忽视。
        - id: decision
          label: 推荐
          value: Research-more; high risk; stretched
          note: 没有价格支撑，就不能把战略质量直接转化为买入建议。
        - id: asks
          label: 尽调触发项
          value: Revenue quality, utilization, customer mix, and cap-table terms
          note: 这些是最有杠杆、最可能改变当前判断的事实。
      edges:
        - from: financing
          to: scale
          label: 支持
        - from: scale
          to: gap
          label: 受到制约
        - from: gap
          to: pressure
          label: 放大
        - from: pressure
          to: decision
          label: 导致
        - from: decision
          to: asks
          label: 聚焦
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV011
      - CV012
      - CV013
