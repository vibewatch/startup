            body: >-
              留存公开记录说明了 Amca 为什么能够进入高可靠性航空航天与国防项目，但并未消除法律和合规尽调负担。Amca 自己的收购公告描述了 AS9100 认证制造能力、飞行关键型压力和液位开关，以及从
              A320、737MAX 到 F-16 和 F-18
              的平台；因此，若整合失误，质量逃逸、出口管制、供应商资格偏移和产品责任问题都可能造成超出比例的后果。继承来的认证和认证基础设施部分抵消了这一运营现实，但本次来源池没有任何留存来源展示当前诉讼案卷、召回历史、出口管制框架或逐站点合规登记。正确解读不是监管风险不存在，而是证据仍不完整；在公司拿出认证、质量逃逸、保修准备金和受控项目处理文件之前，该风险应留在风险清单前列。
