    title: 公司里程碑时间线
    type: timeline
    summary: 公开来源支持公司从 2024 年成立快速发展到 2026 年 B 轮规模，但当前确切布局在公开描述中仍存在冲突。
    data:
      items:
        - year: 2024
          label: Jai Malik 和 Eli Giovanetti 创立公司
          detail: Amca 于 2024 年创立，旨在为关键航空和防务部件建立更快的国内供应基础。
          tone: positive
        - date: '2025-04-09'
          label: 公开发布并完成首轮 $76.5M 融资
          detail: 公司以 $76.5M 初始资金公开发布，并宣布收购 Electro-Mech Components。
          tone: positive
        - period: Aug 2025
          label: Cal-Draulics 收购获报道
          detail: Manufacturing Dive 称 Amca 于 2025 年 8 月收购 Cal-Draulics，将收购驱动的制造平台延伸至液压产品。
          tone: positive
        - period: By May 2026
          label: 增长轮前已加入 BC Systems
          detail: 独立报道称，在 B 轮公告时 BC Systems 已被收购。
          tone: positive
        - date: '2026-05-20'
          label: $300M B 轮，估值超过 $1B
          detail: 多家独立来源将 Amca 的 B 轮融资与超过 $1B 的估值及更广泛的扩张计划联系起来。
          tone: positive
        - date: '2026-05-26'
          label: 公开披露六厂布局
          detail: Thomasnet 称，公司在加利福尼亚州、爱荷华州和纽约州拥有 6 家工厂，总面积超过 123,000 平方英尺。
          tone: warning
        - date: '2026-07-25'
          label: 后续简介概括为七家工厂
          detail: Venture Capital Tracker 后来将公司概括为在同样三个州运营 7 家工厂，造成公开记录措辞冲突。
          tone: warning
        - year: 2026
          label: ACPI 收购扩大压力开关和液压业务范围
          detail: Amca 表示，收购 Aerospace Control Products 增加了定制压力测量能力，并深化了流体系统覆盖。
          tone: positive
