  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Flight-critical electronics and avionics
        - Aerospace primes and subsystem OEMs
        - Design, qualification, and manufacturing engineers
        - Program or procurement budgets
        - >-
            Design-to-qualified-production for replacement parts and new
            components.
        - Supply-chain and program leadership
        - Lead-time compression for constrained platforms.
      - - Hydraulics and fluid systems
        - Aircraft OEMs and aircraft-system manufacturers
        - Platform engineering and sustainment teams
        - Sustainment and parts-procurement budgets
        - Qualification and production of hard-to-procure fluid-system parts
        - Operations and sustainment owners
        - Declining-source or quality issues in legacy supply.
      - - Mid-layer sensors, power units, and controls
        - Prime contractors and defense integrators
        - Hardware engineering and test teams
        - Platform program budgets
        - Engineering, testing, technical data, and certified production
        - Program management office or equivalent
        - Need for a qualified second source or higher throughput.
      - - Direct sustainment support
        - Government-linked sustainment programs
        - Maintainers and readiness teams
        - Public-sector sustainment funding
        - Shortage remediation for readiness-related component gaps
        - Sustainment program office
        - Mission readiness pressure and production bottlenecks.
    notes: >-
      Buyer and payer roles synthesize disclosed customers, program references,
      and workflow descriptions; exact contract owners remain partially
      inferred and need customer diligence.
    claimRefs: [CM003, CM004, CM007, CM010, CM012]
