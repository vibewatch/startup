callouts:
- calloutType: risk
  title: Funding strength does not answer the runway question
  body: Amca clearly has fundraising access, but none of the retained sources disclose cash on hand, burn, debt, or covenant headroom, so capital adequacy for the next 12-24 months is still a diligence item rather than a solved fact.
  claimRefs:
  - CI003
  - CI004
  - CI009
  - CI011
  - CI013
- calloutType: insight
  title: The core economic bet is utilization of acquired certified capacity
  body: If Amca really can compress qualification and delivery cycles while filling acquired factories with durable prime-program demand, margin can improve quickly; if not, the model risks becoming an expensive portfolio of underutilized specialized sites.
  claimRefs:
  - CI005
  - CI008
  - CI011
  - CI012
