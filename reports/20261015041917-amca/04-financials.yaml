figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  summary: Public evidence suggests revenue depends on converting acquired qualified capacity plus faster engineering cycles into shipped critical-component programs.
  data:
    nodes:
    - id: acquire
      label: Acquire qualified legacy suppliers
      detail: Buy certified component manufacturers and keep their existing product lines, tooling, and customer approvals.
    - id: modernize
      label: Invest in footprint and engineering
      detail: Add engineering, qualification testing, prototyping, and manufacturing investment across acquired sites.
    - id: rapid
      label: Deploy RAPID workflow
      detail: Use the engineering-to-production platform to shorten design, qualification, and manufacturing handoffs.
    - id: produce
      label: Deliver critical components
      detail: Ship switches, hydraulics-related products, power electronics, and other flight- or mission-critical parts.
    - id: customers
      label: Serve prime and major OEM programs
      detail: Public sources name Boeing at launch and later mention Lockheed, BAE Systems, Airbus, Textron, Bombardier, Honeywell, and GE Aerospace.
    - id: economics
      label: Real economics remain private
      detail: Public evidence does not disclose revenue mix, gross margin, pricing realization, or runway, so the final bridge to profit is unverified.
    edges:
    - from: acquire
      to: modernize
      label: legacy capacity plus capex
    - from: modernize
      to: rapid
      label: engineering and qualification workflow
    - from: rapid
      to: produce
      label: faster lead times
    - from: produce
      to: customers
      label: component shipments
    - from: customers
      to: economics
      label: revenue visible only indirectly
  approximationNotes: This is a mechanism diagram rather than a quantified waterfall because retained sources do not disclose revenue or gross-profit step values.
