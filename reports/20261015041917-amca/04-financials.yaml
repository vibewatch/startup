- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed current revenue / ARR
    - null
    - Low
    - Without revenue scale, valuation and capital efficiency cannot be normalized
    - Provide audited revenue, bookings, and any recurring-service share
  - - Gross margin by facility / product family
    - null
    - Low
    - Margin path determines whether faster qualification translates into durable profitability
    - Provide gross margin bridge by acquired site, product family, and customer program
  - - Cash balance / burn / runway
    - null
    - Low
    - Funding raised is not cash available; runway drives dependence on another round
    - Provide quarter-end cash, monthly burn, debt obligations, and minimum liquidity covenants
  - - Delivery-speed proxy
    - 67% faster delivery to major customers; some components reportedly up to 70% faster lead times
    - Medium
    - Speed can improve working-capital turns and win-rate if it is repeatable and margin-accretive
    - Show cohort data linking lead-time gains to pricing, repeat orders, and margin
  - - Operating footprint proxy
    - Manufacturing Dive says six facilities and 123,000+ sq ft; another tracker says seven factories
    - Medium
    - Facility count and utilization affect capex, fixed-cost absorption, and integration complexity
    - Reconcile site count, owned vs leased footprint, utilization, and capex per site
  notes: Unavailable fields are public-evidence gaps, not zeros; the only usable proxies in retained sources are throughput and footprint disclosures.
