figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence suggests Amca enters through single-source pain, inherits installed-base accounts, then expands via engineering and qualification throughput rather than self-serve adoption.
    data:
      items:
        - label: Single-source component pain surfaces
          actor: OEMs, primes, and sustainment teams
          touchpoints:
            - Fragile supply for critical components becomes urgent
            - Buyers look for qualified alternatives with domestic capacity
          tone: risk
        - label: Supplier acquisition creates account access
          actor: Legacy supplier owners and installed-base customers
          touchpoints:
            - Amca buys a certified supplier with existing customer relationships
            - Inherited programs provide initial demand visibility
          tone: neutral
        - label: Engineering and qualification reset delivery path
          actor: Customer engineering and procurement
          touchpoints:
            - Rapid compresses design-to-qualified-production workflow
            - AS9100-style manufacturing discipline matters in evaluation
          tone: opportunity
        - label: Production deployment on named platforms
          actor: Program managers and factory operators
          touchpoints:
            - Public record ties Amca work to A320, 737MAX, F-35, F-16, and F-18 contexts
            - Named-prime references broaden trust beyond one acquired site
          tone: opportunity
        - label: Multi-site network enables expansion
          actor: Existing and new customer programs
          touchpoints:
            - Six factories plus El Segundo facility expand available capacity
            - Additional acquisitions or greenfield sites are part of the expansion logic
          tone: opportunity
        - label: Durability still needs diligence
          actor: Investors and finance teams
          touchpoints:
            - No public NRR, GRR, churn, or concentration metrics
            - Expansion case depends on repeat orders and diversification not yet disclosed
          tone: risk
    approximationNotes: The journey map is a synthesized workflow from source-backed customer proof and risk disclosures, not a literal company-published funnel.
    claimRefs: [CU001, CU007, CU008, CU010, CU011, CU012]
