  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Public or primary customer-retention evidence such as NRR, GRR, churn, renewal rates, contract length, or cohort data.
      whyItMatters: Without durability metrics, the chapter can verify named adoption but cannot underwrite stickiness or land-and-expand quality.
      diligencePath: Request board or lender materials with retention and renewal metrics by customer cohort and by acquired-supplier line.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer concentration by revenue, by program, and by plant-level dependency.
      whyItMatters: A few large aerospace or defense accounts could dominate revenue and create procurement or cancellation risk that public logo lists obscure.
      diligencePath: Request a trailing-12-month customer concentration table and any contractual minimums or termination rights for the top ten accounts.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: named-customer-outcomes
      missingEvidence: Referenceable customer case studies with production volumes, delivery improvement, qualification cycle reduction, or repeat-order evidence.
      whyItMatters: Current proof is stronger on named relationships and program fit than on measured customer outcomes or repeat expansion.
      diligencePath: Ask management for two to three customer references and program-level before/after metrics tied to RAPID or factory modernization.
      relatedQuestionRefs: [QU002, QU007]
      relatedTableRefs: [TU003]
