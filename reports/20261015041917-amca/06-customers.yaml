company:
  name: Amca
chapter:
  number: 6
  title: Customers
  summary: Amca has credible public proof that its inherited and newly expanded customer base reaches large commercial-aerospace and defense programs, but the evidence is still stronger on named logos and installed-base platforms than on retention, account count, or concentration. Independent 2026 coverage shows a wider set of primes and programs than the 2025 launch materials, while leaving durability and customer-level economics largely undisclosed.
sections:
  - id: customer-segments-and-buyer-problem
    title: Customer segments and the buying problem
    body: Amca's customer thesis is oriented around aerospace and defense buyers that need qualified component supply where legacy single-source vendors have become bottlenecks. The official site frames the problem as fragile supply for critical components, while the launch release ties that thesis to an actual Boeing customer relationship inherited through Electro-Mech. By May 2026, independent coverage expanded the visible customer set to a mix of commercial-aerospace OEMs, defense primes, and program-level work, suggesting Amca is selling into procurement environments that care about qualification, throughput, and continuity of supply more than consumer-style adoption metrics.
    claimRefs: [CU001, CU002, CU003, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-signals-and-named-proof
    title: Adoption signals and named customer proof
    body: Public adoption proof is imperfect but meaningful. The strongest evidence is not a disclosed customer count; it is a sequence of named customers, platforms, and program deployments attached to acquired suppliers and Amca's engineering platform. Tectonic and Manufacturing Dive both describe work with major aerospace and defense customers, and Manufacturing Dive adds that Rapid had recently been deployed for Lockheed Martin's F-35 and for commercial aircraft programs. Amca also publicly ties acquired businesses to installed-base programs such as the A320, 737MAX, F-16, and F-18, which supports real end-market usage but still stops short of customer-by-customer contract scale, renewal, or expansion economics.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-gaps
    title: Durability, expansion, and concentration gaps
    body: The main customer diligence gap is durability rather than existence. Tectonic reported that Jai Malik claimed the company had grown top line 10x versus the prior year's book of revenue, and both Tectonic and Manufacturing Dive described a six-factory footprint plus the El Segundo prototyping and testing site. That shows visible expansion capacity, but the reviewed public sources still do not disclose active-customer count, retention, renewal cadence, contract length, or customer concentration. Independent risk framing also notes that incumbents, workforce shortages, and long qualification cycles can still limit capture and expansion even with fresh capital and broader factory coverage. The result is a credible demand story with a still-unproven repeatability story.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
callouts:
  - calloutType: risk
    title: Public traction proof is breadth-heavy, durability-light
    body: Named customers and platform references are sufficient to show real commercial activity, but the public record still lacks the metrics needed to underwrite renewal quality or top-customer dependence.
    claimRefs: [CU003, CU009, CU010, CU012]
