    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays cautious because financing and physical scale are
      real, but underwriting data still lags the public price anchor.
    data:
      nodes:
        - id: financing
          label: Financing anchor
          value: "$300M Series B; $1B+ disclosed valuation threshold"
          note: Strong recent price signal, but still just a financing mark.
        - id: scale
