  evidenceGaps:
    - type: missing-source
      severity: material
      topic: audited-financials
      missingEvidence: Audited revenue, gross margin, EBITDA or contribution-margin, and cash-burn disclosure for the consolidated business and major acquired platforms.
      whyItMatters: Without operating economics, the $1B-plus financing mark cannot be tested against scale, quality, or durability of earnings.
      diligencePath: Request audited or board-level financial statements plus a bridge from acquired entities into consolidated results.
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-terms
      missingEvidence: Liquidation preferences, seniority, anti-dilution terms, and any project-finance or debt obligations attached to the latest round.
      whyItMatters: Entry price without term context can overstate common-equity upside and understate downside protection asymmetry.
      diligencePath: Obtain the latest financing documents, cap table, and any side letters affecting control or economics.
    - type: missing-source
      severity: material
      topic: customer-quality
      missingEvidence: Customer concentration, repeat-order quality, backlog mix, and program-level revenue exposure by platform or prime.
      whyItMatters: Named logos show relevance, but valuation depends on revenue durability rather than anecdotal customer references.
      diligencePath: Request customer cohort data, concentration schedules, and evidence of repeat or multi-program production revenue.
