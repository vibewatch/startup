      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The main customer diligence gap is durability rather than existence. Tectonic reported that Jai Malik
              claimed the company had grown top line 10x versus the prior year's book of revenue, and both Tectonic and
              Manufacturing Dive described a six-factory footprint plus the El Segundo prototyping and testing site.
              That shows visible expansion capacity, but the reviewed public sources still do not disclose
              active-customer count, retention, renewal cadence, contract length, or customer concentration. Independent
              risk framing also notes that incumbents, workforce shortages, and long qualification cycles can still
              limit capture and expansion even with fresh capital and broader factory coverage. The result is a credible
              demand story with a still-unproven repeatability story.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public traction proof is breadth-heavy, durability-light
            body: >-
              Named customers and platform references are sufficient to show real commercial activity, but the public
              record still lacks the metrics needed to underwrite renewal quality or top-customer dependence.
            calloutType: risk
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and liability exposure is partly mitigated by certified manufacturing, but still under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The retained public record shows why Amca can sell into high-reliability aerospace and defense programs,
              but it does not clear the legal and compliance diligence burden. Amca's own acquisition releases describe
              AS9100-certified manufacturing capacity, flight-critical pressure and liquid-level switches, and platforms
              ranging from the A320 and 737MAX to the F-16 and F-18, which means quality escapes, export controls,
              supplier qualification drift, and product-liability issues could all have outsized consequences if
              integration slips. That operating reality is partially offset by inherited certifications and
              qualification infrastructure, yet no retained source in this worker pool surfaces a current litigation
              docket, recall history, export-control framework, or site-by-site compliance register. The right
              interpretation is not that regulatory risk is absent, but that it remains incompletely evidenced and
              therefore should stay near the top of the risk register until the company produces documentation on
              certifications, quality escapes, warranty reserves, and controlled-program handling.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR010
              - CR015
      - number: '7.2'
        title: Integration, quality, and throughput execution remain the central operational risk
        blocks:
          - type: paragraph
            body: >-
              Amca's strategy only works if acquired legacy suppliers become a more resilient network without losing the
              know-how, certifications, or customer trust that made them attractive in the first place. The company's
              own messaging repeatedly frames the industry problem as fragile single-source supply for critical
              components, and later reporting says Amca now combines engineering, qualification, certified
              manufacturing, and RAPID software across multiple facilities. That creates a high-upside operating model,
              but it also means any failure in knowledge transfer, process control, qualification maintenance, or
              promised cycle-time compression hits the core thesis directly. The risk picture intensified rather than
              relaxed as the company scaled from launch to a $300 million Series B: new sites, broader product scope,
              and references to creating factories from scratch all increase the amount of execution that has to go
              right before the valuation can be defended on operating evidence rather than narrative.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR010
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.3'
        title: Dependency, concentration, and capital expectations set clear kill criteria
        blocks:
          - type: paragraph
            body: >-
              Dependency risk now spans customers, acquisition targets, and capital markets. Early launch materials
              named Boeing as the only disclosed customer, while later reporting broadens the named-customer set to
              large aerospace and defense primes; that is directionally positive, but public evidence still does not
              show customer-level revenue mix, contract length, or program concentration. Public sources also disagree
              on whether the operating footprint should be described as six facilities or seven factories, which is a
              manageable inconsistency on its own but a useful signal that external disclosure still lags the pace of
              expansion. The financing profile adds another dependency layer: AInvest's critique of the Series A
              valuation and the later $1B-plus Series B step both suggest the next round or liquidity event will be
              judged against real integration, throughput, and customer-diversification evidence. For underwriting, the
              clearest thesis-break triggers are failure to diversify beyond a small named-customer set, weak
              post-acquisition quality metrics, or a financing reset before public operating metrics mature.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to monitor before underwriting growth at the current valuation
            body: >-
              Treat the thesis as impaired if Amca cannot show customer diversification beyond a small named-prime set,
              if post-acquisition quality or throughput data deteriorates, or if the next financing resets the price
              before audited operating metrics appear.
            calloutType: risk
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the current price anchor
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation fact is the May 2026 financing event itself: Amca announced a $300 million
              Series B and said the company was valued at more than $1 billion. Independent trackers broadly corroborate
              the two-round, roughly $376.5 million to $377 million funding history, which confirms capital access and
              investor appetite. What the same public record does not provide is equally important for valuation:
              Venture Capital Tracker still labels the latest known valuation as not publicly disclosed, and none of the
              retained market-data sources provide audited revenue, margin, burn, or concentration metrics that would
              let an outside investor test whether the financing mark is cheap, fair, or expensive on operating
              fundamentals.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is straightforward: Amca is attacking a genuine aerospace and defense supply-chain
              bottleneck, it has raised unusually large capital for an industrial company at its age, and both company
              and third-party coverage point to a real factory footprint, named customers, and an integrated
              engineering-to-manufacturing workflow. The anti-thesis is that almost every performance and
              customer-quality signal remains filtered through company disclosures or derivative tracker pages. Public
              evidence supports momentum and strategic relevance, but not enough independently verified operating detail
              to justify treating the last round as fully de-risked. That makes the recommendation price-sensitive:
              research-more is more defensible than buy at the current public mark.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because public sources do not disclose revenue, gross margin, retention, cash burn, or
              liquidation-preference terms, the scenario work has to stay directional rather than falsely precise. The
              bull case requires Amca to translate its financing lead and factory build-out into disclosed economic
              proof, such as revenue quality, utilization, and repeat program wins that can support a premium to the
              last round. The base case is that the business may merit defending the current mark only after that proof
              appears. The bear case is not technological failure alone; it is that competition, scaling complexity, and
              thin disclosure force multiple compression or a flat-to-down next mark before public evidence catches up.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The right next step is not to debate whether Amca has ambition; the retained sources already show that.
              The real diligence task is to convert ambition into an underwritable price. Three asks would move the
              stance most: verified revenue and margin by acquired platform, customer concentration and repeat-order
              quality, and cap-table terms around the $1B-plus mark. The public record also still contains a basic
              footprint inconsistency, with the Series B release describing both six critical component factories and
              seven factories including headquarters, which is a reminder that disclosure precision is still immature.
              Until those points clear, the investment case is better treated as an option on future proof than as a
              cleanly priced compounding asset.
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV015
