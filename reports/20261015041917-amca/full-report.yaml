  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays cautious because financing and physical scale are real, but underwriting data still lags
      the public price anchor.
    data:
      nodes:
        - id: financing
          label: Financing anchor
          value: $300M Series B; $1B+ disclosed valuation threshold
          note: Strong recent price signal, but still just a financing mark.
        - id: scale
          label: Early proof of scale
          value: 6 facilities and 123,000+ square feet disclosed
          note: Real industrial build-out and named customer/platform references.
        - id: gap
          label: Underwriting gap
          value: No audited revenue, margin, burn, or concentration disclosure
          note: Public sources do not show the economics needed to defend price.
        - id: pressure
          label: Downside pressure
          value: Competition, workforce limits, and supply-chain execution risk
          note: Independent downside commentary remains material.
        - id: decision
          label: Recommendation
          value: Research-more; high risk; stretched
          note: Do not convert strategy quality into a buy without price support.
        - id: asks
          label: Diligence triggers
          value: Revenue quality, utilization, customer mix, and cap-table terms
          note: These are the highest-leverage facts for moving the stance.
      edges:
        - from: financing
          to: scale
          label: supports
        - from: scale
          to: gap
          label: tempered by
        - from: gap
          to: pressure
          label: magnifies
        - from: pressure
          to: decision
          label: leads to
        - from: decision
          to: asks
          label: focuses
    approximationNotes: null
