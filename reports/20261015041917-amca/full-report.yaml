      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case in the retained evidence is real but still incomplete. Amca appears better capitalized than
              many owner-operated supplier targets and has a stronger public integration story than a single-site
              specialist, which helps explain the roll-up strategy. The counterpoint is that both Citybiz and Venture
              Capital Tracker point to a broader field of defense-adjacent capital and incumbent distribution power.
              Without public win-loss data, customer migration case studies, or verified list pricing, the market can
              underwrite Amca's strategic direction more easily than it can underwrite exactly how durable that
              advantage is versus adjacent entrants or powerful incumbent channels.
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated, qualified capacity is the clearest public differentiator
            body: >-
              The most defensible edge in the assigned evidence is not cheaper public pricing; it is the combination of
              engineering, qualification, technical data, certified manufacturing, and acquired specialist product lines
              under one platform.
            calloutType: strength
            claimRefs:
              - CP003
              - CP010
              - CP016
          - type: callout
            title: The peer map is still partly inferred
            body: >-
              Direct rival pricing, product overlap, and win-loss data are not public in the retained pool, so some
              adjacent and incumbent peers are still discovery signals rather than verified substitutes.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Retained sources consistently describe Amca as a product-sales manufacturing business rather than a
              software or subscription company. The company and syndicated launch coverage say Amca acquires legacy
              aerospace suppliers, keeps their qualified product lines, and layers in engineering and qualification
              capability to produce critical components such as switches, hydraulics-related products, sensors, power
              units, and flight-control computers. What the public record does not provide is the revenue mix across
              acquired product lines, new internally developed programs, or bundled engineering work. No retained source
              discloses list pricing, realized contract pricing, discounting, or revenue-recognition policies, so the
              monetization model is visible only at the mechanism level, not at the underwriting level.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI009
              - CI010
          - type: table
