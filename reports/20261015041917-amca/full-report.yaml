              - CI006
              - CI008
              - CI011
              - CI013
      - number: '4.2'
        title: Efficiency proxies without full unit economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strongest on operational proxies rather than income-statement outputs. Manufacturing
              Dive reports that Rapid is used to engineer, qualify, and produce components and that management claims
              the integrated workflow can shorten lead times by up to 70% and deliver parts to named customers 67%
              faster than the existing supply chain. Those are directionally useful efficiency signals because they
              suggest better asset utilization and faster conversion of engineering work into shipped hardware. But CAC,
              payback, gross margin, scrap, warranty cost, and working-capital turns are all absent from the retained
              record, so investors can observe throughput claims without being able to verify whether they translate
              into attractive incremental contribution margin.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI013
      - number: '4.3'
        title: Capital intensity and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The visible financial story is capital deployment, not self-funded scale. Public trackers and news sources
              place Amca at roughly $377 million of disclosed equity funding after a $300 million Series B at about a $1
              billion valuation. At the same time, the company is buying suppliers, investing in acquired manufacturing
              footprints, opening prototyping and testing capacity, and, according to Manufacturing Dive, planning to
              create new factories when existing sites are insufficient. That profile implies a capital-intensive model
              with meaningful fixed-cost absorption risk. The public record supports access to capital today, but it
              does not disclose cash on hand, burn, debt, or runway, so forward capital adequacy still hinges on private
              financial statements rather than on public proof.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Amca looks more like a fast-funded industrial roll-up with engineering upside than a software
              company with transparent recurring revenue. The strategic logic is understandable: buy certified capacity,
              modernize it, and use speed-to-qualification as the wedge with primes. The blocker is that nearly every
              underwriting variable that matters after the financing headline remains private: revenue by program, gross
              margin by facility, backlog quality, customer concentration, inventory turns, capex per new site, and
              explicit runway. Public sources also disagree on whether the operating footprint is six facilities or
              seven factories, which is a small but telling sign that the external picture remains noisy. The chapter
              verdict is therefore cautious: funding strength is real, but revenue quality and margin path are still
              unproven from public evidence.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding strength does not answer the runway question
            body: >-
              Amca clearly has fundraising access, but none of the retained sources disclose cash on hand, burn, debt,
              or covenant headroom, so capital adequacy for the next 12-24 months is still a diligence item rather than
              a solved fact.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI011
              - CI013
          - type: callout
            title: The core economic bet is utilization of acquired certified capacity
            body: >-
              If Amca really can compress qualification and delivery cycles while filling acquired factories with
              durable prime-program demand, margin can improve quickly; if not, the model risks becoming an expensive
              portfolio of underutilized specialized sites.
            calloutType: insight
            claimRefs:
              - CI005
              - CI008
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and the customer job
        blocks:
          - type: paragraph
            body: >-
              Amca is positioned around the customer problem of replacing fragile single-source component suppliers with
              a faster path from engineering to qualified production. Company-authored launch materials describe the
              target layer as the products between standardized parts and full systems, naming sensors, power units, and
              flight-control computers, while the current website frames the mission as expanding competition and
              capacity for critical components. In workflow terms, the company is not selling a generic factory
              automation pitch; it is trying to help primes and sustainment programs source hard-to-procure aerospace
              parts from suppliers that can inherit legacy know-how and then modernize it.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE008
      - number: '5.2'
        title: Capability map and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to an operating model built from acquired component specialists plus a shared
              engineering and qualification layer. Public sources tie Electro-Mech to human-machine-interface hardware,
              Payne Magnetics to power magnetics and related electronics, and ACPI to pressure and liquid-level
              switching, with third-party summaries extending the component list to electromechanical systems,
              hydraulics, sensors, and avionics subsystems. Independent coverage also describes Rapid as an AI-enabled
              workflow for engineering, qualification, and production, which suggests that software is a process
              accelerator inside the industrial stack rather than a separately monetized product surface. That
              architecture makes the industrial thesis legible, but most details remain described at the category level
              rather than in public technical documentation.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE008
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Public deployment evidence is better than for many private industrial startups, but it is still uneven.
              The launch release tied the first supplier to Boeing programs, the Payne acquisition referenced use on the
              737MAX, F-16, and F-18, and Manufacturing Dive reported that Rapid had been deployed for the F-35 as well
              as commercial widebody and narrowbody aircraft. Across those sources, Amca differentiates itself less
              through a novel component SKU than through speed: it claims to combine supplier acquisition, technical
              data-package work, qualification testing, and certified production so that legacy components can be
              modernized and delivered faster than the incumbent supply chain. That is a credible positioning wedge,
              although the public record does not yet provide program-by-program conversion, uptime, or field-failure
              data that would prove repeatability at scale.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE011
      - number: '5.4'
        title: Control surface and technical risks
        blocks:
          - type: paragraph
            body: >-
              The biggest product-technology risk is that the public record is materially stronger on aspiration and
              acquired capability categories than on operational control evidence. Sources point to qualification
              testing and AS9100-certified manufacturing capacity, but the retained pool does not include a public
              status page, security center, API or developer documentation, or a practitioner-community proxy that would
              show external technical engagement. A second risk is basic operating-footprint ambiguity: one retained
              independent summary says six facilities, while another says seven factories, which is manageable
              analytically but still means the current network description is not fully settled in public. For
              diligence, that pushes the burden onto direct data-room proof around site-level certifications,
              throughput, scrap, on-time delivery, and which parts of Rapid are actually production-critical.
            claimRefs:
              - CE009
              - CE010
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capability breadth is acquisition-led, not single-SKU-led
            body: >-
              The clearest product proof is the accumulation of specialist component businesses across HMI hardware,
              magnetics, hydraulics, and sensing rather than one flagship standalone product.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Control evidence lags the breadth narrative
            body: >-
              Public sources support qualification and certified manufacturing claims, but they do not yet expose
              site-level controls, reliability metrics, security posture, or a reconciled current facility map.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the buying problem
        blocks:
          - type: paragraph
            body: >-
              Amca's customer thesis is oriented around aerospace and defense buyers that need qualified component
              supply where legacy single-source vendors have become bottlenecks. The official site frames the problem as
              fragile supply for critical components, while the launch release ties that thesis to an actual Boeing
              customer relationship inherited through Electro-Mech. By May 2026, independent coverage expanded the
              visible customer set to a mix of commercial-aerospace OEMs, defense primes, and program-level work,
              suggesting Amca is selling into procurement environments that care about qualification, throughput, and
              continuity of supply more than consumer-style adoption metrics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption signals and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption proof is imperfect but meaningful. The strongest evidence is not a disclosed customer
              count; it is a sequence of named customers, platforms, and program deployments attached to acquired
              suppliers and Amca's engineering platform. Tectonic and Manufacturing Dive both describe work with major
              aerospace and defense customers, and Manufacturing Dive adds that Rapid had recently been deployed for
              Lockheed Martin's F-35 and for commercial aircraft programs. Amca also publicly ties acquired businesses
              to installed-base programs such as the A320, 737MAX, F-16, and F-18, which supports real end-market usage
              but still stops short of customer-by-customer contract scale, renewal, or expansion economics.
            claimRefs:
              - CU002
              - CU003
