      - number: '3.2'
        title: Capability stack and buying criteria
        blocks:
          - type: paragraph
            body: >-
              Amca's clearest public differentiation is capability stacking. Company-issued releases describe one
              workflow that joins engineering, qualification testing, technical data, and certified manufacturing, then
              expands scope further through acquisitions such as Electro-Mech, ACPI, and Payne Magnetics. That supports
              a buyer narrative built around faster qualification and broader category coverage instead of one narrow
              approved part family. The same sources also imply meaningful switching friction: approved programs value
              AS9100-qualified capacity, proven part performance, and installed supplier relationships. What public
              evidence still does not show is customer-facing pricing or contract structure, so procurement economics
              cannot yet be compared with confidence.
