chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Amca presents itself as the Advanced Manufacturing Company of America, headquartered in El Segundo and
              founded in 2024 to rebuild capacity in critical aerospace and defense components. The official company
              materials consistently describe an integrated model that combines rapid prototyping, qualification, and an
              AS9100D-certified factory network so components can move from requirements into production faster than
              legacy suppliers. Company-issued materials also position Amca in the layer between standardized parts and
              full systems, with example products spanning sensors, power units, flight-control computers, and
              human-machine interfaces.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership concentration and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned source set makes the founder pair, not a broader executive bench or board, the visible center
              of the company narrative. Jai Malik appears as the principal spokesperson in launch, financing, and
              acquisition materials, while Eli Giovanetti is the operating co-founder with disclosed production and
              engineering experience from SpaceX. That supports a clear founder-market-fit story, but it also means
              governance depth remains a diligence item: the reviewed sources do not identify independent directors,
              board committees, or a wider C suite beyond the founders.
            claimRefs:
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO014
      - number: '1.3'
        title: Capital base, valuation, and current public scale
        blocks:
          - type: paragraph
            body: >-
              Public disclosures show a fast financing cadence: an initial $76.5 million launch round in April 2025 and
              a $300 million Series B in May 2026. Independent coverage ties the later round to a valuation above $1
              billion and names Caffeinated Capital as lead, with participation from Lightspeed, Andreessen Horowitz,
              Lux, Construct, and House Capital. Public scale is directionally meaningful but not perfectly clean:
              independent reporting described six facilities across California, Iowa, and New York totaling more than
              123,000 square feet, while a later market-data profile summarized operations as seven factories across the
              same states.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO013
      - number: '1.4'
        title: Platform milestones and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The operating thesis is acquisition-led from the start. Assigned sources tie the platform to Electro-Mech
              Components at launch, then to Cal-Draulics, BC Systems, and later Aerospace Control Products, expanding
              coverage from human-machine interfaces into hydraulics and pressure measurement. The evidence also
              supports real customer and program exposure, including Boeing at launch, F-35-related component work, and
              company claims of deliveries to nearly every aerospace-and-defense prime. What the public record still
              does not provide are audited revenue, customer concentration, or verified headcount figures, so later
              judgment calls still depend on management diligence rather than public artifacts alone.
            claimRefs:
              - CO010
              - CO013
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained sources define Amca's market around critical aerospace and defense components that sit
              between standardized inputs and full systems. That boundary includes engineering, qualification testing,
              technical data, and certified manufacturing for categories such as sensors, power units, flight-control
              computers, hydraulics, avionics, and power electronics. It explicitly excludes full aircraft or
              weapon-system primes, as well as software-only defense tools that do not own qualified production
              capacity. The most relevant substitute is the legacy network of aging certified suppliers that still hold
              part qualifications but often operate with slower procurement, validation, and production cycles.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM012
      - number: '2.2'
        title: Sizing lenses and buyer path
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain an independent market report that isolates spend for this exact
              mid-layer component niche, so the sizing case has to be built from operational lenses rather than a broad
              TAM headline. The strongest available lenses are Amca's disclosed footprint and qualified capacity, the
              named customer set and program exposure, and the reported reduction in lead times from design through
              qualified production. Public coverage points to a buyer set that spans aerospace primes, subsystem OEMs,
              and government-linked sustainment workflows, which means the purchasing path is enterprise and
              programmatic rather than consumer or self-serve.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
