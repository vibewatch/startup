  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests revenue depends on converting acquired qualified capacity plus faster engineering cycles
      into shipped critical-component programs.
    data:
      nodes:
        - id: acquire
          label: Acquire qualified legacy suppliers
          detail: >-
            Buy certified component manufacturers and keep their existing product lines, tooling, and customer
            approvals.
        - id: modernize
          label: Invest in footprint and engineering
          detail: Add engineering, qualification testing, prototyping, and manufacturing investment across acquired sites.
        - id: rapid
          label: Deploy RAPID workflow
          detail: Use the engineering-to-production platform to shorten design, qualification, and manufacturing handoffs.
        - id: produce
          label: Deliver critical components
          detail: Ship switches, hydraulics-related products, power electronics, and other flight- or mission-critical parts.
        - id: customers
          label: Serve prime and major OEM programs
          detail: >-
            Public sources name Boeing at launch and later mention Lockheed, BAE Systems, Airbus, Textron, Bombardier,
            Honeywell, and GE Aerospace.
        - id: economics
          label: Real economics remain private
          detail: >-
            Public evidence does not disclose revenue mix, gross margin, pricing realization, or runway, so the final
            bridge to profit is unverified.
      edges:
        - from: acquire
          to: modernize
          label: legacy capacity plus capex
        - from: modernize
          to: rapid
          label: engineering and qualification workflow
        - from: rapid
          to: produce
          label: faster lead times
        - from: produce
          to: customers
          label: component shipments
        - from: customers
          to: economics
          label: revenue visible only indirectly
    approximationNotes: >-
      This is a mechanism diagram rather than a quantified waterfall because retained sources do not disclose revenue or
      gross-profit step values.
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI008
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered industrial stack from acquired niche suppliers through engineering,
      qualification, and certified production.
    data:
      layers:
        - label: Mission demand
          detail: >-
            Customer demand centers on critical aerospace and defense components whose incumbent suppliers are aging or
            sole-source.
          outputs:
            - Hard-to-procure components
            - Program sustainment pressure
        - label: Acquired specialist suppliers
          detail: Amca expands capability by acquiring legacy businesses with installed know-how and approvals.
          modules:
            - Electro-Mech HMI products
            - Payne Magnetics power components
            - ACPI pressure and liquid-level switches
        - label: Engineering and modernization
          detail: Internal teams redesign or update legacy components rather than only brokering third-party production.
          modules:
            - Component design updates
            - Technical data packages
            - New product variants
        - label: Qualification and test
          detail: Qualification testing is presented as an internal capability that shortens the path to accepted production.
          modules:
            - Qualification workflow
            - Prototyping and testing
            - Customer approval support
        - label: Certified manufacturing
          detail: Production sits inside a network of aerospace-oriented factories rather than a single prototype shop.
          modules:
            - AS9100-oriented processes
            - Specialized tooling
            - Low-volume high-reliability output
        - label: Delivery acceleration
          detail: >-
            RAPID is described as the workflow layer that connects engineering, qualification, and manufacturing for
            faster delivery.
          outputs:
            - Faster design-to-production handoff
            - Broader component coverage across primes
    approximationNotes: >-
      This is a public-evidence stack, not an internal system diagram; it reflects retained sources at category level
      and omits undisclosed implementation detail.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests Amca enters through single-source pain, inherits installed-base accounts, then expands
      via engineering and qualification throughput rather than self-serve adoption.
    data:
      items:
        - label: Single-source component pain surfaces
          actor: OEMs, primes, and sustainment teams
          touchpoints:
            - Fragile supply for critical components becomes urgent
            - Buyers look for qualified alternatives with domestic capacity
          tone: risk
        - label: Supplier acquisition creates account access
          actor: Legacy supplier owners and installed-base customers
          touchpoints:
            - Amca buys a certified supplier with existing customer relationships
            - Inherited programs provide initial demand visibility
          tone: neutral
        - label: Engineering and qualification reset delivery path
          actor: Customer engineering and procurement
          touchpoints:
            - Rapid compresses design-to-qualified-production workflow
            - AS9100-style manufacturing discipline matters in evaluation
          tone: opportunity
        - label: Production deployment on named platforms
          actor: Program managers and factory operators
          touchpoints:
            - Public record ties Amca work to A320, 737MAX, F-35, F-16, and F-18 contexts
            - Named-prime references broaden trust beyond one acquired site
          tone: opportunity
        - label: Multi-site network enables expansion
          actor: Existing and new customer programs
          touchpoints:
            - Six factories plus El Segundo facility expand available capacity
            - Additional acquisitions or greenfield sites are part of the expansion logic
          tone: opportunity
        - label: Durability still needs diligence
          actor: Investors and finance teams
          touchpoints:
            - No public NRR, GRR, churn, or concentration metrics
            - Expansion case depends on repeat orders and diversification not yet disclosed
          tone: risk
    approximationNotes: >-
      The journey map is a synthesized workflow from source-backed customer proof and risk disclosures, not a literal
      company-published funnel.
