              - CM007
              - CM010
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Growth drivers, constraints, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by geopolitical instability, defense modernization, and a broader policy push to
              rebuild domestic industrial resilience. Those drivers matter because the disclosed pain points are
              qualification delays, declining supplier capacity, workforce aging, and single-source dependencies that
              can halt larger production programs. Even so, this is not a frictionless market: AS9100-class processes,
              testing, procurement hurdles, and incumbent supplier relationships slow supplier switching. Public
              reporting also supports investor enthusiasm for defense-adjacent manufacturing infrastructure, but the
              chapter still lacks verified spend by segment, contract concentration, and a defensible SAM or SOM for
              Amca's precise niche. That makes the adoption case easier to underwrite than the eventual penetration
              ceiling or share assumptions.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Supply-fragility is the market wedge
            body: >-
              The core market case is not generic defense-tech software spend; it is the bottleneck created by fragile,
              aging, and often single-source component supply for regulated aerospace and defense programs.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
          - type: callout
            title: The market thesis is directionally strong but numerically underbuilt
            body: >-
              The retained evidence supports demand urgency and buyer relevance, yet it still falls short of a
              source-backed dollar TAM, SAM, or SOM for the exact layer Amca serves, which limits valuation precision.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Solution-set landscape
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence suggests buyers are usually comparing Amca against a class of legacy certified
              component suppliers and internal capacity options, not against a tidy group of disclosed startup peers.
              Company materials repeatedly frame the problem as brittle single-source supply for critical components,
              while Manufacturing Dive quotes CEO Jai Malik describing categories where only one or two U.S. suppliers
              remain. That makes the most credible status quo alternative a narrow, approved incumbent supplier with
              embedded trust and limited breadth. Database-style profiles do surface adjacent or incumbent names, but
              the fetched excerpts do not prove product-level overlap with Amca's component-focused scope, so they are
              discovery signals rather than benchmark-quality peer proof.
            claimRefs:
              - CP001
