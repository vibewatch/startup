        title: 资本密集度、IPO 准备与主权产业政策
        blocks:
          - type: paragraph
            body: >-
              Rebellions 加快资本消耗，用于先进节点流片、高密度服务器集成和全球扩张；在总计 $850 million 的累计股权资本中，2025 年末和 2026 年初筹集了 $650 million。虽然 IPO
              前轮融资确立了 $2.34 billion 估值，但这一估值能否维持，取决于公司在计划中的韩国 KOSPI 上市及潜在海外上市前的执行表现。Korea National Growth Fund
              等国家支持实体在韩国 K-Nvidia 主权计划下大量参与，引入了地缘政治和监管风险。国家产业政策、公共采购指引或先进 AI
              算力硬件出口管制的变化，可能限制面向中东等目标地区的国际许可或销售。此外，历史经审计收入和毛利率报表仍未披露；一旦商业采用停滞，长期现金消耗的可持续性也会更加模糊。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对 Samsung Foundry 和 HBM3E 供应的关键依赖
            body: >-
              Rebellions 的差异化建立在与 HBM3E 和 Samsung 5nm 制程节点紧密结合、以存储为中心的架构之上。与采用 TSMC 成熟 CoWoS 生态的无晶圆厂竞争者不同，Rebellions 暴露于
              Samsung 的封装良率曲线和内存配额优先级。先进封装出现任何中断或良率拖累，都会直接威胁 Rebel100 和 REBEL-Quad 平台的批量交付。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 估值与独立商业规模脱节
            body: >-
              Rebellions 累计融资 $850 million，IPO 前估值达到 $2.34 billion，但已确认的商业收入版图仍集中在 SK Telecom 和 KT Cloud
              等区域电信试点。若没有公开审计财务披露，且没有确认赢得一级国际超大规模云客户，公开股票市场可能会在计划中的 KOSPI 上市期间审视其利润率可持续性。
            calloutType: insight
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与主权支持下的估值背景
        blocks:
          - type: paragraph
            body: >-
              Rebellions 在 2026 年 3 月完成由 Mirae Asset Financial Group 和 Korea National Growth Fund 领投的 $400 million IPO
              前融资后，估值达到 $2.34 billion。多轮私募融资使累计股权融资达到约 $850 million 至 $858 million，其中仅此前六个月就筹集了 $650 million；这包括 2025 年
              9 月以 $1.4 billion 估值完成的 $250 million Series C。估值快速上升的核心催化因素是国家直接介入：韩国金融服务委员会顾问委员会批准由国家主导的 National Growth
              Fund 直接投入 250 billion won（$166 million）股权，这是国家“K-Nvidia”政策计划下的首次直接配置，旨在培育能够挑战外国 AI
              算力主导地位的本土半导体冠军。国家支持降低了韩国政府和电信采购渠道的风险，但也使经审计商业规模化之前的私募市场估值偏高。私募市场追踪数据库披露的收入显示，截至 2025 年 9 月公司收入仅为 $23
              million，与 2024 年 1 月指标相比没有增长。以此收入基数计算，$1.4 billion 的 Series C 估值对应 60.9x 倍数；之后 $2.34 billion 的 IPO 前估值对应远超
              100x 的远期收入倍数，除非 Rebel100 架构以及 RebelRack、RebelPOD 交钥匙系统在 2025 年末至 2026 年初量产推出期间实现了突然且未经验证的收入加速。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV015
      - number: '8.2'
        title: 可比公司与定价倍数纪律
        blocks:
          - type: paragraph
            body: >-
              将 Rebellions 与私募半导体架构和专用算力运营商比较，会发现其相对于运营成熟度存在严重倍数扩张。在私募市场同行中，Tenstorrent（估值 $2.7B）、EVAS Intelligence（估值
              $2.2B）、Photonic（估值 $2.0B）和 Upscale AI（估值 $2.0B）等专用 AI 芯片项目尽管收入披露模糊，仍获得数十亿美元企业估值。在上市可比公司中，Core Scientific
              等高性能基础设施运营商的交易倍数约为收入的 13.1x（收入 $319M，企业价值 $5.3B）；D-Wave Quantum 等投机性算力供应商则在经营严重亏损的情况下，以收入的 143.7x 交易（收入
              $25M，估值 $6.0B）。Rebellions 在 Series C 时隐含的 60.9x 倍数，以及 IPO
              前定价时更高的倍数，使其更接近早期软件公司的估值，而不是需要承担流片、封装和晶圆制造投入的资产密集型无晶圆厂半导体开发商。此外，EquityZen
              等二级平台已经出现现有股东的流动性机制，早期员工和股东可在正式上市前向合格投资者出售股票。二级挂牌显示出投资人希望获得 IPO
              前配额，但如果计划上市时间表遭遇韩国监管审查或市场波动，这也凸显了潜在股权结构悬置和流动性压力。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
