      - number: '5.2'
        title: 系统交付：卡、机架与 Pod 级基础设施
        blocks:
          - type: paragraph
            body: >-
              为弥合无晶圆厂芯片与企业数据中心运营之间的落差，Rebellions 依据 Rebellions Scalable
              Design（RSD）框架，以多种封装形态交付硬件。面向超大规模云厂商和电信运营商的基础交付单元是 RebelCard，这是一块集成 Rebel100 处理器的 PCIe Gen5 加速器板卡。PCIe Gen5
              x16 接口提供 64 GB/s 的双向全双工带宽，支持卡间张量并行和 Neural Engine 之间的设备间参数共享，而不产生主机 CPU 延迟惩罚。


              在机架级别，Rebellions 提供容纳 8 张 RebelCard 的 5U RebelServer，以及工厂集成式 RebelRack 单元和多机架 RebelPOD 集群。RebelPOD 面向主权 AI
              安装和企业 AI 工厂，采用 Credo ZeroFlap 有源电缆（AEC）构建后端网络结构，以消除间歇性链路中断，并缩短分布式集群的首 token 时间。此外，Rebellions 与 Arm、SK
              Telecom 合作开发主权 AI 服务器平台，将基于 Neoverse CSS V3 的 Arm AGI 数据中心 CPU 与 RebelCard 配对，实现算力、内存和网络域之间的协同编排。
