          description: 扣除研发烧钱前的净运营贡献
        - id: net-cash-operating-burn
          label: 运营现金消耗
          description: 扣除研发及销售与管理人员薪资后的净现金消耗
      edges:
        - from: customer-inference-demand
          to: commercial-channel-mix
        - from: commercial-channel-mix
          to: gross-revenue-generation
        - from: gross-revenue-generation
          to: cost-of-goods-sold
        - from: cost-of-goods-sold
          to: retained-gross-profit
        - from: retained-gross-profit
          to: net-cash-operating-burn
    approximationNotes: 展示运营利润率机制；百分比转换节点待经审计财务数据发布后补充。
    claimRefs:
      - CI001
      - CI005
      - CI006
  - id: FE001
    title: Rebellions 全栈 AI 推理架构
    type: stack
    summary: 分层架构图详述芯片、封装、互连、编译器与框架服务组件。
    approximationNotes: 体现技术文档披露的标准软件栈整合与硬件模块化。
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE009
      - CE013
      - CE015
    data:
      layers:
        - label: 应用与框架服务
          detail: 云原生编排与高层服务端点
          modules:
            - vLLM 与 LiteLLM 统一路由器
            - Triton Inference Server 插件
            - Kubernetes 设备插件与 SR-IOV 虚拟化
        - label: 编译与图优化
          detail: 自动化模型图降级与并行调度
          modules:
            - RBLN Compiler 多设备张量拆分器
            - 集合通信优化器（广播、规约）
            - 动态层流水线引擎
        - label: 系统互连与集群
          detail: 机架级与集群级低延迟数据传输
          modules:
            - PCIe Gen5 x16 卡间直连互连（64 GB/s）
            - Credo ZeroFlap 有源电缆（AEC）
            - Arm AGI CPU（Neoverse CSS V3）主机协调
        - label: 芯片与先进封装
          detail: 数据流加速核心与以内存为中心的基板
          modules:
            - 经 UCIe-Advanced 连接的 4 芯粒 Rebel100 SoC
            - 高带宽内存（HBM3E / HBM4e，最高 144 GB）
            - 定制多级 DMA 与张量片上网络
        - label: 系统参考平台
          detail: 交钥匙企业服务器与多机架数据中心基础设施
          modules:
            - RebelServer 5U 8 卡机箱
            - RebelRack 生产计算单元
            - RebelPOD 多机架主权 AI 集群
        - label: 物理设施与供电
          detail: 数据中心功率范围与热管理
          modules:
            - 每卡 300W 热设计功耗
            - 2.5 kW 至 3.2 kW 的服务器级功率预算
            - 直接液冷与高密度风冷集成
  - id: FU001
    title: 企业客户采用与扩张路径
    type: journey-map
    summary: 展示客户从评估到完整交钥匙基础设施部署的四阶段生命周期。
    data:
      items:
        - label: 阶段 1：评估与基准测试
          stage: 评估
          actor: 企业 AI 工程师 / 云架构师
          touchpoints:
            - 在 ATOM PCIe 卡上测试模型延迟
            - 集成 vLLM 与 Triton 软件栈
            - 与 Nvidia GPU 比较每瓦性能
        - label: 阶段 2：工作负载试点
          stage: 试点
          actor: 基础设施运营负责人
          touchpoints:
            - 针对具体应用开展专门试点（例如通话摘要）
            - 借助 Kubernetes 和 OpenShift 部署容器
            - 验证热约束下 24/7 推理可靠性
        - label: 阶段 3：生产部署
          stage: 生产
          actor: 首席技术官 / 云业务负责人
          touchpoints:
            - 在云实例或运营商服务中商业化上线
            - 在 KT Cloud 上公开列出 NPU 服务
            - 相较旧硬件，性价比提升 5-7 倍
        - label: 阶段 4：交钥匙规模扩张
          stage: 扩张
          actor: 数据中心副总裁 / 采购委员会
          touchpoints:
            - 采购多机架 RebelPOD 集群
            - 集成进大规模主权 AI 基础设施
            - 持续提供企业维护与编译器软件支持
        - label: 阶段 5：全球多云集成
          stage: 多云
          actor: 全球基础设施副总裁
          touchpoints:
            - 在美国、日本和台湾的海外子公司中评估
            - 与区域主权 AI 框架集成
            - 与下一代推理架构进行基准测试
        - label: 阶段 6：长期企业维护
          stage: 生命周期支持
          actor: 企业站点可靠性工程师
          touchpoints:
            - 持续优化固件与编译器
            - 自动故障转移与服务器集群监控
            - 多年期软件支持与硬件维护合同
    approximationNotes: 基于 Rebellions 商业策略，展示从单一工作负载测试到多机架数据中心部署的结构化推进路径。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU010
      - CU011
      - CU015
