      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              AI 推理芯片的采购可分为四类买方：电信运营商和国家级运营商、云服务商及新兴 neocloud、主权政府项目，以及大型企业基础设施团队。在 SK Telecom、KT
              等电信运营商内部，基础设施采购由网络运营和数字服务平台高管主导，他们寻求以更低成本实现实时语音处理、通话摘要和客服自动化。相比之下，云服务商和 neocloud 运营商会从多租户虚拟化、API
              服务单位成本，以及对 vLLM、PyTorch、Triton 等主流开源框架的支持来评估加速器硬件。主权基础设施买家，尤其是 Korea National Growth Fund
              和政府支持的发展项目，会在技术自主和国内半导体供应链韧性的要求下配置资本。采用路径通常从小规模试点实例或托管式 NPU-as-a-service 节点开始，再推进到多机架 RebelRack 或 RebelPOD
              集群部署。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: 结构性增长驱动与市场采用约束
        blocks:
          - type: paragraph
            body: >-
              Rebellions 的 NPU 平台受三大驱动因素推动：数据中心电力和制冷约束极强、现有 GPU 集群的运营成本高得惊人，以及寻求摆脱外国技术垄断替代方案的国家主权 AI
              项目。随着主要都市市场的供电上限压缩数据中心容量，基础设施运营商会优先看每瓦性能，而不是峰值算力。反过来，采用也面临明显的结构性阻力：开发者对 Nvidia 专有 CUDA
              生态的依赖、不同模型家族缺少广泛公开的基准复现，以及多厂商硬件集成的运营风险。此外，虽然与 vLLM
              等开源运行时的认证兼容性降低了软件工程师的迁移成本，但生产环境企业买家在替换既有架构前，仍要求多年硬件可靠性记录、成熟的供应链交付和广泛的本地化现场支持。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 训练经济性与推理经济性的关键区别
            body: >-
              AI 芯片的市场格局正在快速分化。前沿基础模型训练仍依赖大规模通用 GPU 集群，CUDA 的主导地位难以撼动；而高吞吐生产推理更看重能耗、热约束和每百万 token 成本。这一分化为支持 vLLM
              等开源服务栈的专用 NPU 打开了可服务市场空间。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: callout
            title: 地域与供给瓶颈限制近期 SOM
            body: >-
              尽管 Rebellions 已融资 $850 million，并推出机架级 RebelRack 和 RebelPOD
              系统，但其在韩国以外的商业可用性仍主要停留在概念验证阶段。在国际云服务商和企业渠道能够提供自助式容量之前，公司在北美和 EMEA 的可服务市场获取将落后于战略估值。
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Rebellions 是众多瞄准推理工作负载的挑战者之一，并非试图替代通用加速器的所有用途。CNBC 将 Nvidia、Groq 和 Cerebras 列为相关竞争者，TechCrunch 则将 AWS、Meta
              和 Google 的定制芯片加入威胁集合。因此，对买方而言，现实替代方案包括现有 GPU 平台、专用加速器、超大规模云厂商控制的芯片、继续采购现有基础设施，或内部自研。Rebellions
              进入这一市场的路径比表面上的竞争版图更窄：管理层称目标客户是大型 AI 实验室，并已在美国开展概念验证，但没有披露由此产生的销售。画像表将已记录事实与保留证据无法确认的字段分开。
