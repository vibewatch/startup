              - CV015
      - number: '8.3'
        title: 情景分析、论点破坏触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              鉴于经验证的历史收入与受主权资本抬高的估值之间差距很大，基于证据的投资立场应给出继续研究建议，并将风险评为高、估值评为偏高。投资论点的核心，是 Rebellions 能否成功商业化第二代 Rebel100
              芯粒平台以及 RebelRack、RebelPOD 交钥匙基础设施，并在亚洲、中东和北美的超大规模 neocloud、电信运营商和主权 AI 部署中落地。反方论点则强调严重的商业脆弱性：依赖 Samsung
              Foundry 的封装管线，而整个行业都受先进封装产能约束；在美国面对 Nvidia 根深蒂固的 CUDA 软件生态，销售管线仍未经证明；以及 2024 年 12 月 Sapeon Korea
              合并后，客户高度集中于 SK Group 和 KT 生态。为平衡这些因素，情景分析框架模拟乐观、基准和悲观结果。乐观情景下，韩国和沙特阿拉伯快速采用主权 AI，Rebel100 成功商业化，支持公司上市时达到
              $3.5B 至 $4.5B 估值。基准情景下，韩国国内电信采用趋稳，但美国超大规模云厂商进展滞后，IPO 估值倍数压缩至 $1.8B 至 $2.2B。悲观情景下，Samsung Foundry
              制造延迟且外部客户多元化停滞，触发 IPO 下轮融资或延迟上市，企业价值压缩至 $0.8B 至 $1.2B。关键论点破坏触发因素包括计划中的 2026 年 KOSPI
              上市取消或延迟、未能获得非韩国超大规模云厂商的生产采购订单，或持续负经营现金流在批量出货达到商业规模前耗尽 $400M IPO 前现金缓冲。
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 主权 AI 补贴造成估值分化
            body: >-
              韩国 National Growth Fund 直接投入 $166 million，证明 Rebellions 在“K-Nvidia”战略下被视为国家 AI
              半导体冠军。但政府补贴并不能保证国际商业可行性，因此韩国国内主权预期与全球企业定价现实之间形成明显估值差距。
            calloutType: insight
            claimRefs:
              - CV003
              - CV014
          - type: callout
            title: 极高收入倍数限制 IPO 前风险调整后回报
            body: >-
              在仅有 $23 million 已披露历史收入的情况下，$2.34 billion 估值意味着 IPO 前轮投资人承担较大下行风险：如果 2026
              年公开上市无法在开放市场获得半导体成长股的溢价倍数，投资回报将受到显著冲击。
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV016
