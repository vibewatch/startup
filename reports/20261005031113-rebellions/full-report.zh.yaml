  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 推理优先芯片与数据流架构
        blocks:
          - type: paragraph
            body: >-
              Rebellions 通过专注推理工作负载，而不是改造通用 GPU 训练芯片，切入数据中心 AI
              加速。其核心架构判断是：现代大语言模型、混合专家架构和多模态推理系统在实时服务时，本质上受内存带宽和数据流约束，而不是受原始算力约束。芯片核心采用专有数据流架构和去中心化指令集架构（ISA），绕过传统的宽
              SIMD 执行和繁重运行时线程调度开销，将指令级并行性直接暴露给编译器和运行时引擎。


              硬件执行模型将神经网络图映射成细粒度执行流，由片上网络和多级直接内存访问（DMA）引擎协调。与使用专有计算 tile 配合 GDDR6 内存、以 25W 至 75W 功耗服务量化模型的第一代 ATOM
              加速器不同，旗舰 REBEL 平台可扩展到超过 100 billion 参数的前沿工作负载。REBEL 采用基于 UCIe-Advanced 互连的模块化芯粒封装，将四个计算芯粒与高带宽内存堆栈结合，在
              300-watt 功耗范围内提供拍级低精度计算吞吐。
            claimRefs:
