      - number: '5.3'
        title: 软件工具链、生态集成与战略局限
        blocks:
          - type: paragraph
            body: >-
              AI 推理的硬件效率与编译器成熟度和开发者体验密不可分。Rebellions 的全栈软件环境以专有 RBLN Compiler
              为核心，可自动完成多设备张量切分、集合通信调度（广播、规约、部分和）和层流水线处理，无需开发者手动分区。为实现机架部署的线性扩展，RSD 纳入了专用路由服务器框架，可将多个 vLLM
              服务实例打包，并在物理节点之间动态均衡负载。


              Rebellions 没有把客户锁进专有封闭生态，而是接入 PyTorch、vLLM、Triton Inference Server、Hugging Face、Kubernetes 和 Red Hat
              OpenShift 等主流开源框架。SR-IOV 虚拟化和 Kubernetes 设备插件支持将 RebelCard 调度为多租户云环境中的虚拟功能。尽管完成了这些集成，开发者社区心智仍是关键门槛：与
              Nvidia CUDA 或 AMD ROCm 相比，Rebellions 的公开代码库信号很少，因此需要专门的客户工程支持，长尾模型运营商也容易受编译器转换瓶颈影响。
            claimRefs:
