  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策流程图追踪主权支持和商业指标，最终导向“继续研究”建议。
    data:
      nodes:
        - id: sovereign-backing
          label: 主权支持：K-Nvidia 旗下 FSC 国家增长基金 $166M
        - id: capital-raised
          label: 资本状况：$400M IPO 前轮；累计融资 $850M
        - id: commercial-scale
          label: 商业规模：$23M 滚动收入（2025 年 9 月）；客户高度集中
        - id: valuation-multiple
          label: 估值倍数：$2.34B 估值对应滚动收入的 >100 倍
        - id: execution-risks
          label: 执行风险：Samsung Foundry 产能受限，美国市场采用尚未验证
        - id: recommendation-stance
          label: 决策立场：高风险、估值偏高，评级为继续研究
      edges:
        - from: sovereign-backing
          to: capital-raised
        - from: capital-raised
          to: commercial-scale
        - from: commercial-scale
          to: valuation-multiple
        - from: valuation-multiple
          to: execution-risks
        - from: execution-risks
          to: recommendation-stance
    approximationNotes: 流程展示将财务输入连接至投资建议的定性门控顺序。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV014
      - CV015
