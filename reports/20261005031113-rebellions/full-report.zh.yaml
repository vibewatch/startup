    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rebellions 于 2020 年成立，负责设计 AI 推理用神经处理单元，但把制造环节外包，因此是无晶圆厂半导体公司，而非一体化制造商。公司总部在韩国；据公司截至 2026 年 3
              月的披露，美国、日本、沙特阿拉伯和台湾均已设有运营实体。公司的商业方案也不止于单颗加速器：公司材料所称的集成式推理层，覆盖芯片、运行时与模型优化、服务软件、服务器、机架和多机架系统。换言之，公司卖的是硬件加系统；但本证据集没有披露定价、收入结构、毛利率，也没有说明硬件、软件和服务各自的经济性。
