  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、系统变现与定价动态
        blocks:
          - type: paragraph
            body: >-
              Rebellions 通过分化式模式变现定制 AI 推理算力，覆盖独立 PCIe 加速器卡、交钥匙数据中心基础设施系统和软件赋能的生态部署。公司历史上主要向企业和电信运营商销售 ATOM 与 ATOM-Max
              NPU PCIe 卡；2026 年 3 月发布 RebelRack 和 RebelPOD 后，商业范围进一步扩大。RebelRack 提供一套可用于生产的推理算力单元，RebelPOD
              则扩展为面向超大规模云厂商和大型企业部署的多机架集群。不过，Rebellions 没有公布芯片或机架单元的标准目录价，而是在定制化企业和主权采购协议下协商实际价格。第三方行业分析声称，该架构相较竞争 GPU
              架构可实现 5x 至 7x 的价格效率优势，但合同层面实际兑现、批量折扣和软件许可附着率仍属于未经验证的私有数据。
