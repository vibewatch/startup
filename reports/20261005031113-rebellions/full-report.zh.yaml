      - number: '3.3'
        title: 切换成本、供应获取与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Rebellions 的开放技术栈路线是一项双刃剑式的竞争选择。兼容广泛使用的运行时可以减少迁移工作并支持多云部署，但通用工具也意味着单靠软件形成的锁定更弱；HostingJournalist
              明确警告，当厂商共享同一开放技术栈时，差异化可能收窄，利润率也可能被压缩。硬件可用性是另一道门槛。CEO 称内存难以获得，并另行主张 Samsung 和 SK Hynix 的投资改善了 Rebellions
              的地位，但这属于管理层说法，并非已披露的供货承诺。定价同样是重要缺口：保留来源没有提供可比目录价、实际合同条款、折扣或按工作负载归一化的总成本。因此，护城河目前依靠集成能力和潜在效率；切换经济性或分销能力尚未得到独立证明。
