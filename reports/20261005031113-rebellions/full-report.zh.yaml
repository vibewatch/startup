      - number: '3.2'
        title: 能力、封装与市场进入取舍
        blocks:
          - type: paragraph
            body: >-
              现有证据能确认的 Rebellions 能力，是面向推理的芯片与部署封装。官方 ATOM 页面给出的指标为 FP16 下 32 TFLOPS、INT8 下 128 TOPS，卡级功耗范围为 60-130
              W；较新的 Rebel100 则以服务器系统销售。RebelRack 和 RebelPOD 又把产品从芯片扩展到生产单元和多机架集群。软件方案同样走集成路线，已有报告列出
              Kubernetes、vLLM、PyTorch、Triton、Hugging Face 和 OpenShift。这种覆盖面可能降低采用阻力，但不能证明其在具体工作负载上更强。现有资料中唯一的量化对比来自
              Rebellions 自己的 ATOM 与 A100 测试，而且公司把 ATOM 结果标为预测值。因此，同行数据缺失的字段就保持未知，不用行业常识补齐。
