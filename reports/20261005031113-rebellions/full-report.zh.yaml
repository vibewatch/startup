  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载分类与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Rebellions 瞄准的是企业和超大规模数据中心的专用 AI 推理加速器，不包括前沿模型预训练集群和边缘消费设备。在当前算力格局下，数据中心运营商的大部分资本开支仍投向通用图形处理单元（GPU），市场由
              Nvidia 的 H100、H200 和 Blackwell 等架构主导。生成式 AI 从训练转入生产推理后，运营经济性看的不再只是原始浮点吞吐，还包括能源效率、每瓦每秒生成 token
              数（TPS/W），以及严格数据中心热设计约束下的总拥有成本（TCO）。Rebellions 将目标工作负载限定为生产环境 LLM 服务、多模态处理和分布式推理，同时排除基础模型训练，因为大规模多节点 GPU
              集群仍是这一领域的既定标准。眼下的替代方案，仍是向超大规模云厂商租用配置过量的通用 GPU 实例；按服务 token 计算，这类实例价格溢价高、耗电也大。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: 市场规模口径与受限 TAM/SAM/SOM 估算
        blocks:
          - type: paragraph
            body: >-
              评估 Rebellions 的市场机会，必须把宽泛的半导体行业总量预测拆成受约束的推理专属层级。管理层引用的自上而下行业预测称，全球 AI 推理硬件和系统市场到 2030 年将接近 $475
              billion，这代表未受约束的总可寻址市场（TAM）。但可服务可寻址市场（SAM）严格限定为非前沿训练的数据中心推理加速器、服务器卡和集成式机架系统，部署对象包括商业云服务商、主权 AI
              基础设施项目和企业私有数据中心。Rebellions 的近期可服务可获得市场（SOM）还受当前制造配额、区域分销覆盖和合格软件集成能力限制。虽然累计融资 $850 million、估值 $2.34 billion
              为国际扩张提供支持，但当前商业收入仍与韩国公共云和电信部署绑定，近期现实 SOM 更可能体现为数千万美元规模的硬件出货。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
