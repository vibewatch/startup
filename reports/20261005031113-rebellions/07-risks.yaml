callouts:
  - calloutType: "risk"
    title: "Critical Dependency on Samsung Foundry and HBM3E Sourcing"
    body: "Rebellions' differentiation rests upon a memory-centric architecture tightly integrated with HBM3E and Samsung's 5nm process node. Unlike fabless competitors utilizing TSMC's proven CoWoS ecosystem, Rebellions is exposed to Samsung's packaging yield curves and memory allocation priorities. Any disruption or yield drag in advanced packaging directly threatens volume delivery of the Rebel100 and REBEL-Quad platforms."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "The Valuation vs. Independent Commercial Scale Disconnect"
    body: "While Rebellions has secured $850 million in lifetime funding and achieved a $2.34 billion pre-IPO valuation, its confirmed commercial revenue footprint remains concentrated in regional telecom pilots like SK Telecom and KT Cloud. Without publicly audited financial disclosures or confirmed tier-one international hyperscale customer wins, public equity markets may scrutinize margin sustainability during its planned KOSPI listing."
    claimRefs:
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR010"
