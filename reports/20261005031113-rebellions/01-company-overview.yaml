company:
  name: "Rebellions"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Rebellions is a South Korea-headquartered, fabless AI-inference infrastructure
    company founded in 2020. Its March 2026 pre-IPO financing brought company-reported
    total funding to $850 million at an approximately $2.34 billion valuation, but the
    assigned public evidence does not disclose audited revenue, customer count, headcount,
    board composition, or investor-control terms.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Rebellions was founded in 2020 and designs neural processing units for AI
      inference while outsourcing fabrication, making it a fabless semiconductor
      company rather than an integrated manufacturer. The company is headquartered
      in South Korea and, by March 2026, reported operating entities in the United
      States, Japan, Saudi Arabia, and Taiwan. Its commercial proposition has expanded
      beyond individual accelerators: company materials describe an integrated
      inference layer spanning chips, runtime and model optimization, serving software,
      servers, racks, and multi-rack systems. That scope suggests a hardware-plus-systems
      business model, but the assigned evidence does not disclose pricing, revenue mix,
      gross margin, or the economics of hardware versus software and services.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Sunghyun Park is consistently identified as co-founder and chief executive,
      concentrating the public strategic narrative around a founder-CEO. Marshall
      Choy was described in March 2026 as a recently appointed chief business officer
      leading global expansion, particularly the United States push. These two named
      leaders cover technology strategy and commercialization, but the assigned source
      set does not identify a chief financial officer, operating chief, independent
      directors, board observers, voting arrangements, or succession planning. The
      resulting governance picture is therefore partial: founder continuity is visible,
      while oversight and control are not. Investor diligence should treat key-person
      dependence and the absence of a public board map as unresolved, not as evidence
      that no broader leadership or board exists.
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capital-and-stakeholders"
    title: "Capital position and strategic stakeholders"
    body: >-
      The financing record shows rapid capital accumulation but not cash availability.
      TechCrunch reports a $124 million Series B in 2024. For the subsequent $250
      million Series C, the company's March 2026 release says September 2025, while
      TechCrunch and Dealroom report November 2025; the month conflict is preserved
      rather than harmonized. On March 30, 2026, Rebellions announced a $400 million
      pre-IPO round led by Mirae Asset Financial Group and the Korea National Growth
      Fund, taking company-reported cumulative funding to $850 million and valuation
      to approximately $2.34 billion. Separately, Reuters reported approval of a KRW
      250 billion ($166 million) direct state investment. The sources do not establish
      whether every announced amount had funded, the cash remaining, preference terms,
      secondaries, debt, or dilution.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "milestones-and-diligence-implications"
    title: "Milestones and diligence implications"
    body: >-
      The timeline moves from a 2020 founding through successive financings, Arm
      ecosystem participation, state-backed investment, and the March 2026 launch of
      RebelRack and RebelPOD. It shows a company moving from chip design toward
      deployable infrastructure while preparing for a future public offering. The same
      record also exposes concentration risks. Dealroom argues that Rebellions must
      overcome Nvidia's entrenched software-and-compute position, proprietary chips
      from hyperscalers, and fabrication dependencies outside its direct control.
      No assigned source documents a lawsuit, outage, breach, sanction, or recall;
      that bounded absence is not proof that no incident occurred. Commercial scale,
      audited economics, governance rights, and delivery conversion therefore remain
      the principal company-level diligence gaps.
    claimRefs:
      - "CO001"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
