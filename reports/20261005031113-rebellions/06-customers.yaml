figures:
  - id: FU001
    title: Enterprise Customer Adoption and Expansion Journey
    type: journey-map
    summary: Four-stage customer lifecycle illustrating progression from evaluation to full turnkey infrastructure deployment.
    data:
      items:
        - label: 'Phase 1: Evaluation & Benchmarking'
          stage: Evaluation
          actor: Enterprise AI Engineer / Cloud Architect
          touchpoints:
            - Testing model latency on ATOM PCIe cards
            - vLLM and Triton software stack integration
            - Performance-per-watt evaluation vs Nvidia GPUs
        - label: 'Phase 2: Workload Pilot'
          stage: Pilot
          actor: Infrastructure Operations Lead
          touchpoints:
            - Dedicated pilot in specific application (e.g. call summarization)
            - Containerized deployment via Kubernetes and OpenShift
            - Validation of 24/7 inference reliability under thermal constraints
        - label: 'Phase 3: Production Deployment'
          stage: Production
          actor: Chief Technology Officer / Cloud Director
          touchpoints:
            - Commercial rollout in cloud instance or carrier service
            - Public NPU service listing on KT Cloud
            - Demonstrated 5-7x price-performance improvement over legacy hardware
        - label: 'Phase 4: Turnkey Scale Expansion'
          stage: Expansion
          actor: Data Center VP / Procurement Committee
          touchpoints:
            - Procurement of multi-rack RebelPOD clusters
            - Integration into large-scale sovereign AI infrastructure
            - Ongoing enterprise maintenance and compiler software support
        - label: 'Phase 5: Global Multi-Cloud Integration'
          stage: Multi-Cloud
          actor: Global Infrastructure VP
          touchpoints:
            - Evaluation across international subsidiaries in US, Japan, and Taiwan
            - Integration with regional sovereign AI frameworks
            - Benchmarking against next-generation inference architectures
        - label: 'Phase 6: Long-Term Enterprise Maintenance'
          stage: Lifecycle Support
          actor: Enterprise Site Reliability Engineer
          touchpoints:
            - Continuous firmware and compiler compiler optimization
            - Automated failover and server cluster monitoring
            - Multi-year software support and hardware maintenance contracts
    approximationNotes: Illustrates the structured progression from single-workload testing to multi-rack data center deployment based on Rebellions commercial strategy.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU010
      - CU011
      - CU015
callouts:
  - calloutType: risk
    title: Captive Commercial Concentration
    body: |
      Rebellions' commercial revenue remains heavily dependent on its strategic investors SK Telecom and KT. While these partnerships validate silicon viability at telecom scale, they do not establish that Rebellions can win arms-length enterprise deals against Nvidia in competitive global markets.
    claimRefs:
      - CU002
      - CU005
      - CU014
  - calloutType: insight
    title: Shift to Turnkey Infrastructure Platforms
    body: |
      The launch of RebelRack and RebelPOD represents an intentional commercial evolution. By delivering pre-integrated rack-scale compute rather than standalone PCIe boards, Rebellions seeks to lower integration friction for global cloud operators and sovereign AI clients.
    claimRefs:
      - CU009
      - CU010
      - CU011
