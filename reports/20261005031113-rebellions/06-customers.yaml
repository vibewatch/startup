company:
  name: Rebellions
chapter:
  number: 6
  title: Customers
  summary: Rebellions exhibits confirmed domestic deployment of its ATOM NPUs across Korean telecom and sovereign cloud infrastructures, notably with KT Cloud and SK Telecom. However, commercial adoption remains heavily anchored in strategic shareholder ecosystems, while international production contracts and U.S. hyperscaler deployments remain unproven pre-IPO.
sections:
  - id: customer-segmentation-and-commercial-structure
    title: Customer Base Segmentation and Buyer Economics
    body: |
      Commercial adoption of Rebellions neural processing units (NPUs) divides into four distinct buyer segments: domestic telecommunications operators, sovereign and regional cloud service providers, government-backed public computing initiatives, and prospective global hyperscalers [CU001]. Domestically, adoption has been catalyzed by strategic corporate investors seeking energy-efficient infrastructure alternatives to Nvidia GPUs for large-scale AI inference [CU002]. Telecommunications carriers deploy Rebellions hardware to power high-volume, latency-sensitive end-user workloads such as call summarization and natural language processing at reduced operational expenditures [CU004]. Public cloud operators provide NPU-based instances to public-sector and enterprise tenants under sovereign AI mandates [CU003]. Nevertheless, direct sales to independent commercial enterprises outside the domestic telecommunications and sovereign ecosystem remain limited, creating a pronounced bifurcation between captive shareholder deployments and open-market enterprise accounts [CU005, CU006].
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: named-production-proof-and-telecom-deployments
    title: Named Deployments and Commercial Reference Quality
    body: |
      Concrete evidence of real-world production deployment centers primarily on KT Cloud, SK Telecom, and LG Electronics [CU003, CU004, CU007]. KT Cloud became the first domestic cloud provider to commercialize public NPU instances leveraging Rebellions first-generation ATOM processors, targeting public-sector data centers and domestic enterprise workloads [CU003]. Following the December 2024 merger with SAPEON Korea, SK Telecom integrated Rebellions silicon into its commercial infrastructure, running AI call recording summarization on its consumer-facing 'A.' service and evaluating the processors within its dedicated NPU cluster [CU004, CU005]. Additionally, LG Electronics evaluated Korean NPUs for always-on edge and security applications to bypass high GPU operational costs [CU007]. Beyond South Korea, customer engagements with entities such as Saudi Aramco remain framed as strategic partnership explorations and sovereign AI MoUs rather than disclosed volume purchase agreements [CU008].
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU007
      - CU008
    tableRefs:
      - TU003
  - id: adoption-trajectory-and-infrastructure-expansion
    title: Adoption Trajectory, Full-Stack Platforms, and Retention Durability
    body: |
      To broaden customer adoption from component-level PCIe accelerator cards to full data-center clusters, Rebellions introduced its turnkey RebelRack and RebelPOD infrastructure platforms in March 2026 alongside its $400 million pre-IPO financing round [CU009, CU010]. These systems package multi-rack clusters powered by the next-generation Rebel100 NPU and integrate with open-source software stacks including vLLM, PyTorch, and Triton to minimize customer migration friction [CU010, CU011]. Commercial traction has expanded as Rebellions established operating entities across the United States, Japan, Saudi Arabia, and Taiwan under Chief Business Officer Marshall Choy [CU012]. However, net revenue retention rates, customer renewal metrics, and total active account counts remain undisclosed private data, obscuring the underlying commercial velocity [CU013].
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU002
  - id: customer-concentration-and-procurement-risks
    title: Customer Concentration, Shareholder Dependence, and Global Friction
    body: |
      A critical diligence vulnerability in Rebellions' commercial profile is customer concentration risk and dependence on corporate backers [CU014]. Key anchor clients KT and SK Telecom represent substantial equity owners and strategic sponsors who spearheaded the company's Series B and SAPEON merger [CU002, CU005]. As highlighted by independent market assessments, the startup faces intense execution risk because no binding volume supply contracts have been publicly disclosed for the upcoming Rebel100 chip, and penetration into Western hyperscalers such as Meta or xAI remains entirely unproven against Nvidia's entrenched CUDA ecosystem [CU014, CU015]. Furthermore, pre-IPO cash burn coupled with customer concentration creates revenue vulnerability if commercial deployment ramps lag expectations [CU014, CU016].
    claimRefs:
      - CU002
      - CU005
      - CU014
      - CU015
      - CU016
