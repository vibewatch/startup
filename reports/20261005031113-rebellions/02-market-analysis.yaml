callouts:
  - calloutType: "insight"
    title: "The Critical Distinction Between Training and Inference Economics"
    body: "Market dynamics in AI silicon are bifurcating rapidly. While frontier foundation model training remains bound to large clusters of general-purpose GPUs where CUDA dominance is unassailable, high-volume production inference prioritizes energy consumption, thermal limits, and cost per million tokens. This divergence creates an addressable opening for specialized NPUs that support open-source serving stacks like vLLM."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM014"
  - calloutType: "risk"
    title: "Geographic and Availability Choke Points Limit Near-Term SOM"
    body: "Despite raising $850 million and launching rack-scale RebelRack and RebelPOD systems, Rebellions' commercial availability outside South Korea remains largely confined to proof-of-concept evaluations. Until international cloud providers and enterprise channels offer self-serve capacity, addressable market capture in North America and EMEA will lag strategic valuation."
    claimRefs:
      - "CM008"
      - "CM012"
      - "CM016"
