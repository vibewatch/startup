evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board roster, ownership, voting rights, investor preferences, board-observer rights, and
      succession plan.
    whyItMatters: Control rights and founder dependence cannot be assessed from the two publicly named executives.
    diligencePath: >-
      Request the current cap table, charter, shareholder agreements, board minutes, organization chart, and executive
      biographies.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited FY2024 and FY2025 revenue, revenue run-rate, gross margin, cash balance, cash burn, customer count,
      concentration, headcount, debt, and secondary-sale details.
    whyItMatters: Funding raised and private valuation do not establish commercial traction, profitability, liquidity, or dilution.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, bank statements, customer schedules, HR roster,
      debt register, and financing documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      Definitive closing date for the $250 million Series C, reported as September 2025 by the company and November 2025
      by independent sources.
    whyItMatters: The date affects financing chronology and the stated six-month capital-raising window.
    diligencePath: Review the executed Series C closing documents and regulatory corporate filings.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable list prices, realized contract terms, discounts, and workload-normalized TCO for Rebellions and named
      alternatives.
    whyItMatters: >-
      Without contract economics, the analysis cannot test whether claimed efficiency offsets migration, integration,
      and supply risk.
    diligencePath: >-
      Request bid sheets and redacted customer proposals for matched models, utilization, power, support, and contract
      duration.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark
    missingEvidence: >-
      Independent standardized benchmarks comparing Rebel100 or ATOM with current Nvidia, Groq, Cerebras, and
      hyperscaler alternatives.
    whyItMatters: >-
      The retained quantitative comparison is company-issued and uses projected ATOM data, so it cannot establish
      durable workload-level advantage.
    diligencePath: >-
      Commission or obtain third-party tests on identical models, precision, batch size, latency SLO, power boundary,
      and software versions.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements for FY2024 and FY2025 disclosing revenue, cost of goods sold, gross margin, and
      operating cash burn.
    whyItMatters: >-
      Without audited financial disclosures, underwriting commercial revenue scale, software attach rate, and hardware
      unit margins relies entirely on unverified management commentary.
    diligencePath: >-
      Obtain Korea Financial Supervisory Service (DART) statutory audit reports or audited pre-IPO registration
      prospectus statements.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Bill of materials cost breakdown for RebelRack and RebelPOD, including Samsung Foundry wafer costs and HBM memory
      pricing.
    whyItMatters: >-
      Determines whether Rebellions can sustain claimed 5-7x price advantages over Nvidia while retaining positive
      hardware gross margins.
    diligencePath: Request confidential bill of materials breakdown and foundry supply agreements during pre-IPO financial diligence.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Standardized third-party MLPerf Inference benchmarks comparing Rebel100 directly against Nvidia H100/H200 and AMD
      Instinct MI300X across LLM generation workloads.
    whyItMatters: >-
      Without vendor-neutral MLPerf audit results, throughput per dollar and TPS/Watt claims remain based on selective
      company disclosures.
    diligencePath: >-
      Request unredacted MLPerf Inference test logs or third-party validation reports for Llama 3 70B/405B serving on
      RebelServer.
    relatedQuestionRefs:
      - QE003
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: minor
    topic: packaging-yields
    missingEvidence: >-
      Packaging yield data and die-to-die interconnect test logs for the 4-chiplet UCIe-Advanced integration at Samsung
      Foundry.
    whyItMatters: >-
      Advanced 2.5D/3D packaging yields directly govern unit manufacturing cost, gross margins, and volume delivery
      schedules.
    diligencePath: Review foundry supply agreements, wafer test summaries, and packaging qualification data under commercial NDA.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited figures for Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual contract values (ACV), and
      cohort renewal rates across KT Cloud and SK Telecom.
    whyItMatters: >-
      Without retention and recurring contract renewal disclosures, it is impossible to evaluate whether telecom NPU
      deployments represent sustainable recurring revenue or one-off hardware sales.
    diligencePath: >-
      Review confidential IPO prospectus filing disclosures and underwriter data room exhibits covering multi-year
      commercial contract renewals.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: customer-enumeration
    missingEvidence: >-
      Full customer accounting roster detailing non-shareholder enterprise logos, server node quantities, and annual
      hardware deployment volumes.
    whyItMatters: >-
      Identifies whether commercial adoption extends beyond strategic equity investors to authentic arm's-length
      enterprise customers.
    diligencePath: Request audited revenue breakdown by customer and customer concentration disclosures during management diligence.
    relatedQuestionRefs:
      - QU001
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-burn-auditing
    missingEvidence: >-
      Audited financial statements for FY2024 and FY2025 detailing gross margin, net loss, cash burn rate, and balance
