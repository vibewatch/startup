callouts:
  - calloutType: "risk"
    title: "Sovereign Capital Subsidization vs Commercial Market Viability"
    body: "Rebellions' rapid $650M funding acceleration across six months reflects South Korea's sovereign push to cultivate domestic AI semiconductor champions via the National Growth Fund and telecom leaders KT and SK Telecom. While this backing provides exceptional runway and strategic insulation, it risks masking underlying commercial traction challenges. Operating successfully on global enterprise stages requires proving non-subsidized economic adoption against Nvidia's mature software ecosystem."
    claimRefs:
      - "CI009"
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Single-Foundry Concentration and Supply-Chain Margin Sensitivity"
    body: "Unlike fabless peers utilizing multi-sourcing, Rebellions' roadmap for Rebel100 relies heavily on Samsung Foundry's advanced processing and packaging capabilities. Given multi-year advanced packaging and HBM allocation constraints across the semiconductor sector, any delay in production yields directly impacts hardware shipment schedules, gross margin profiles, and cash-burn velocity ahead of planned IPO listing."
    claimRefs:
      - "CI005"
      - "CI008"
      - "CI010"
