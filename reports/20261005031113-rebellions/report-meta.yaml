companyProfile:
  summary: >-
    Rebellions is a South Korea-headquartered fabless AI inference infrastructure company founded in 2020. It designs
    neural processing units and integrated inference systems while outsourcing fabrication, with a product roadmap
    spanning Rebel100 chips, RebelRack, and RebelPOD deployments. Public evidence shows real domestic traction and
    strong sovereign backing, but the company still does not disclose audited revenue, customer count, headcount, or
    detailed governance terms.
