      - number: '4.2'
        title: Cost Architecture, Foundry Dependency, and Margin Dynamics
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Rebellions exhibits extreme sensitivity to advanced semiconductor fabrication,
              high-bandwidth memory (HBM) procurement, and multi-die chiplet packaging. Unlike incumbents with
              diversified multi-foundry allocation, Rebellions relies on Samsung Foundry for mass manufacturing its
              next-generation Rebel100 processors. This creates structural cost exposure to wafer pricing, foundry yield
              ramps, and interposer allocation across advanced fabrication nodes. While the company's fabless
              operational model avoids direct semiconductor fabrication capex, gross margin realization is constrained
              by bill-of-materials costs from Samsung and SK Hynix memory subsystems. Although management asserts
              superior power efficiency that lowers total cost of ownership (TCO) for data center operators, audited
              gross margins, bill-of-materials pass-through shares, and customer acquisition payback cycles remain
              completely withheld from the public domain.
