  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Taxonomy, and Incumbent Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Rebellions centers on specialized enterprise and hyperscale data-center
              artificial intelligence inference accelerators, distinctly separate from frontier model pre-training
              clusters and edge consumer devices. In the current compute landscape, data-center operators spend the vast
              majority of capital expenditure on general-purpose graphic processing units (GPUs) dominated by Nvidia
              architectures such as H100, H200, and Blackwell systems. However, as generative AI models transition from
              training into production inference, the operational unit economics shift from raw floating-point
              throughput to energy efficiency, tokens per second per watt (TPS/W), and total cost of ownership (TCO)
              under strict data-center thermal envelopes. Rebellions delineates its addressable workload boundaries
              around production LLM serving, multimodal processing, and distributed inference, while excluding
              foundational model training where massive multi-node GPU clusters remain the entrenched standard. The
              status-quo substitute remains over-provisioned general-purpose GPU instances rented through hyperscalers,
              which carry significant pricing premiums and high electrical draw per served token.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: Market Sizing Lenses and Constrained TAM/SAM/SOM Estimation
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for Rebellions requires decomposing broad aggregate semiconductor
              forecasts into constrained inference-specific layers. Top-down industry projections cited by leadership
              frame the global AI inference hardware and systems market expanding toward $475 billion by 2030,
              representing the unconstrained Total Addressable Market (TAM). However, the Serviceable Addressable Market
              (SAM) is tightly constrained to non-frontier-training data-center inference accelerators, server cards,
              and integrated rack systems deployed across commercial cloud service providers, sovereign AI
              infrastructure programs, and enterprise private data centers. Rebellions' near-term Serviceable Obtainable
              Market (SOM) is further delimited by current manufacturing allocation, regional distribution footprints,
              and qualified software integration. While cumulative funding of $850 million and a $2.34 billion valuation
              support international expansion, current commercial revenue generation remains tied to South Korean public
              cloud and telecommunications deployments, establishing a realistic near-term SOM measured in tens of
              millions of dollars of hardware shipments.
