      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics for AI inference silicon divide into four distinct buyer classes: telecommunications
              operators and national carriers, cloud service providers and emerging neoclouds, sovereign government
              initiatives, and large enterprise infrastructure teams. Within telecom operators such as SK Telecom and
              KT, infrastructure purchasing is governed by network operations and digital service platform executives
              seeking cost-efficient inference for real-time speech processing, call summarization, and customer service
              automation. In contrast, cloud providers and neocloud operators evaluate accelerator hardware through
              multi-tenant virtualization, API serving unit costs, and standard open-source framework support including
              vLLM, PyTorch, and Triton. Sovereign infrastructure buyers, notably the Korea National Growth Fund and
              state-backed development programs, allocate capital under technological independence and domestic
              semiconductor supply-chain resilience mandates. Adoption pathways typically begin with small-scale pilot
              instances or managed NPU-as-a-service nodes before advancing to multi-rack RebelRack or RebelPOD cluster
              deployments.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
