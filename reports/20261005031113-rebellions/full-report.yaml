              - CM015
      - number: '2.4'
        title: Structural Growth Drivers and Market Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market demand for Rebellions' NPU platforms is propelled by three primary drivers: extreme data-center
              power and cooling constraints, astronomical operating costs associated with incumbent GPU clusters, and
              national sovereign AI initiatives seeking alternatives to foreign technology monopolies. As power delivery
              caps constrain data-center capacity in major metro markets, infrastructure operators prioritize
              performance-per-watt metrics over raw peak compute. Conversely, adoption faces formidable structural
              friction: developer entrenchment in Nvidia's proprietary CUDA ecosystem, lack of widespread public
              benchmark reproduction across varied model families, and the operational risk of multi-vendor hardware
              integration. Furthermore, while certified compatibility with open-source runtimes like vLLM lowers
              switching costs for software engineers, production enterprise buyers demand proven multi-year hardware
              reliability, mature supply-chain delivery, and extensive localized field support before displacing
              entrenched incumbent architectures.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Critical Distinction Between Training and Inference Economics
            body: >-
              Market dynamics in AI silicon are bifurcating rapidly. While frontier foundation model training remains
              bound to large clusters of general-purpose GPUs where CUDA dominance is unassailable, high-volume
              production inference prioritizes energy consumption, thermal limits, and cost per million tokens. This
              divergence creates an addressable opening for specialized NPUs that support open-source serving stacks
              like vLLM.
            calloutType: insight
            claimRefs:
