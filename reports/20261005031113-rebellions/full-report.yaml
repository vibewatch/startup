      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Rebellions was founded in 2020 and designs neural processing units for AI inference while outsourcing
              fabrication, making it a fabless semiconductor company rather than an integrated manufacturer. The company
              is headquartered in South Korea and, by March 2026, reported operating entities in the United States,
              Japan, Saudi Arabia, and Taiwan. Its commercial proposition has expanded beyond individual accelerators:
              company materials describe an integrated inference layer spanning chips, runtime and model optimization,
              serving software, servers, racks, and multi-rack systems. That scope suggests a hardware-plus-systems
              business model, but the assigned evidence does not disclose pricing, revenue mix, gross margin, or the
              economics of hardware versus software and services.
