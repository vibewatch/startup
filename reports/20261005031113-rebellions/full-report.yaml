  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Inference-First Silicon and Dataflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Rebellions approaches datacenter AI acceleration by specializing exclusively in inference workloads rather
              than adapting general-purpose GPU training silicon. Its core architectural thesis posits that modern large
              language models, mixture-of-experts architectures, and multimodal reasoning systems are fundamentally
              memory-bandwidth and dataflow bound during real-time serving, rather than raw compute bound. At the heart
              of its silicon is a proprietary dataflow architecture and decentralized instruction set architecture (ISA)
              that bypasses traditional wide-SIMD execution and heavy runtime thread scheduling overhead, exposing
              instruction-level parallelism directly to the compiler and runtime engine.


              The hardware execution model maps neural network graphs into fine-grained execution streams coordinated by
              on-chip networks-on-chip and multi-level direct memory access (DMA) engines. Unlike first-generation ATOM
              accelerators that paired proprietary compute tiles with GDDR6 memory to serve quantized models at 25W to
              75W power envelopes, the flagship REBEL platform scales up to frontier workloads exceeding 100 billion
              parameters. REBEL adopts a modular chiplet packaging strategy using UCIe-Advanced interconnect to combine
              four compute chiplets with high-bandwidth memory stacks, delivering peta-scale low-precision compute
              throughput within a 300-watt power envelope.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
