              - CE007
              - CE009
              - CE011
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Memory-Centric Chiplet Bet Differentiates Rebellions from SRAM Pure-Plays
            body: >-
              While competitive inference startups like Groq and Cerebras anchored their architectures on massive
              on-chip SRAM to achieve ultra-low token latency, Rebellions has strategically partnered with Korean
              semiconductor leaders Samsung and SK Hynix to pursue a 3D DRAM and HBM-centric roadmap. This design allows
              Rebellions to support frontier models exceeding 100 billion parameters within standard datacenter thermal
              envelopes, providing superior total cost of ownership for memory-capacity-intensive inference.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Software Toolchain Fragility and Developer Community Deficit
            body: >-
              Despite native integration with vLLM, PyTorch, and Triton, Rebellions operates with an extreme
              developer-signal deficit relative to Nvidia's CUDA ecosystem. Lacking broad grassroots adoption, the
              company relies heavily on high-touch enterprise deployment engineering. Any friction in the RBLN Compiler
              when compiling novel, non-standard transformer architectures poses an adoption blocker for mainstream
              cloud customers.
            calloutType: risk
            claimRefs:
              - CE013
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >
              Commercial adoption of Rebellions neural processing units (NPUs) divides into four distinct buyer
              segments: domestic telecommunications operators, sovereign and regional cloud service providers,
              government-backed public computing initiatives, and prospective global hyperscalers [CU001]. Domestically,
              adoption has been catalyzed by strategic corporate investors seeking energy-efficient infrastructure
              alternatives to Nvidia GPUs for large-scale AI inference [CU002]. Telecommunications carriers deploy
              Rebellions hardware to power high-volume, latency-sensitive end-user workloads such as call summarization
              and natural language processing at reduced operational expenditures [CU004]. Public cloud operators
              provide NPU-based instances to public-sector and enterprise tenants under sovereign AI mandates [CU003].
              Nevertheless, direct sales to independent commercial enterprises outside the domestic telecommunications
              and sovereign ecosystem remain limited, creating a pronounced bifurcation between captive shareholder
              deployments and open-market enterprise accounts [CU005, CU006].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
