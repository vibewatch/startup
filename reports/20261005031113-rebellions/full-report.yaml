        title: Switching Costs, Supply Access, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Rebellions' open-stack approach is a double-edged competitive choice. Compatibility with widely used
              runtimes can lower migration work and support multi-homing, yet common tools also make software alone a
              weaker lock-in mechanism; HostingJournalist explicitly warns that differentiation can narrow and margins
              can compress when vendors share the same open stack. Hardware availability is another gating factor. The
              CEO described memory as difficult to secure and separately argued that Samsung and SK Hynix investment
