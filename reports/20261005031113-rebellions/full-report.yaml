      - number: '5.2'
        title: 'Systems Delivery: Cards, Racks, and Pod-Scale Infrastructure'
        blocks:
          - type: paragraph
            body: >-
              To bridge the gap between fabless silicon and enterprise datacenter operations, Rebellions delivers its
              hardware through multiple packaging form factors governed by the Rebellions Scalable Design (RSD)
              framework. The base delivery unit for hyperscalers and telecommunications operators is the RebelCard, a
              PCIe Gen5 accelerator board integrating the Rebel100 processor. The PCIe Gen5 x16 interface provides 64
              GB/s of bidirectional full-duplex bandwidth, supporting direct card-to-card tensor parallelism and
              inter-device parameter sharing across Neural Engines without incurring host CPU latency penalties.


              At rack scale, Rebellions offers the 5U RebelServer housing 8 RebelCards, as well as factory-integrated
              RebelRack units and multi-rack RebelPOD clusters. Designed to support sovereign AI installations and
              enterprise AI factories, RebelPOD incorporates Credo ZeroFlap active electrical cables (AECs) across its
              backend network fabric to eliminate intermittent link disruptions and reduce time to first token in
              distributed clusters. Furthermore, Rebellions collaborates with Arm and SK Telecom on sovereign AI server
              platforms pairing Arm AGI datacenter CPUs (built on Neoverse CSS V3) with RebelCards, enabling coordinated
              orchestration across compute, memory, and networking domains.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE010
              - CE012
              - CE014
      - number: '5.3'
        title: Software Toolchain, Ecosystem Integration, and Strategic Limitations
        blocks:
          - type: paragraph
            body: >-
              Hardware efficiency in AI inference is inextricably linked to compiler maturity and developer ergonomics.
              Rebellions' full-stack software environment centers around the proprietary RBLN Compiler, which performs
              automated multi-device tensor splitting, collective communication scheduling (broadcast, reduce, partial
              sums), and layer pipelining without manual developer partitioning. To achieve linear scalability across
              rack deployments, RSD incorporates a dedicated router server framework that bundles and dynamically
              load-balances multiple vLLM serving instances across physical nodes.


              Rather than forcing customers into a proprietary walled garden, Rebellions integrates with mainstream
              open-source frameworks including PyTorch, vLLM, Triton Inference Server, Hugging Face, Kubernetes, and Red
              Hat OpenShift. Support for SR-IOV virtualization and Kubernetes device plugins allows RebelCards to be
              scheduled as virtual functions in multi-tenant cloud environments. Despite these integrations, developer
              community mindshare remains a critical gating factor: Rebellions maintains minimal public code repository
              signal compared to Nvidia CUDA or AMD ROCm, requiring dedicated customer engineering support and leaving
              long-tail model operator support vulnerable to compiler translation bottlenecks.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
