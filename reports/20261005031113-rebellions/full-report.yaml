      - Valuation / Return Logic
      - Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - >-
          Rebel100 scales smoothly via Samsung Foundry; domestic sovereign deployments expand; U.S. neoclouds adopt
          RebelRack; 2026 revenue reaches $120M+
        - >-
          $3.5B to $4.5B target valuation at 2026 KOSPI listing (30x-38x forward revenue), delivering 1.5x-1.9x upside
          from current round
        - Production bottlenecks on HBM3E packaging; slower enterprise conversion from Nvidia CUDA architecture
      - - Base Case
        - 50%
        - >-
          Steady deployment across SK Telecom and KT Cloud; modest pilot traction in U.S. and Saudi Arabia; 2026 revenue
          grows to $50M-$65M
        - >-
          $1.8B to $2.2B valuation at public listing (28x-35x revenue), implying 5% to 25% multiple compression from
          $2.34B pre-IPO mark
        - Delays in KOSPI IPO timetable pushing listing into 2027; persistent operating burn requiring extension capital
      - - Bear Case
        - 25%
        - >-
          Commercial adoption stalls outside captive Korean telecom partners; U.S. expansion fails to yield tier-1
          clients; burn exceeds $150M/yr
        - >-
          $0.8B to $1.2B valuation (12x-18x revenue), representing a 50% to 65% down-round correction or distressed
          strategic sale
        - >-
          Cancellation of KOSPI IPO; foundry yield failures; key customer defecting to alternative ASIC or custom
          silicon
    notes: Valuation projections based on comparable semiconductor multiples and required pre-IPO liquidity timelines.
