              - CU003
              - CU004
              - CU007
              - CU010
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU010
              - CU011
              - CU015
      - number: '6.2'
        title: Named Deployments and Commercial Reference Quality
        blocks:
          - type: paragraph
            body: >
              Concrete evidence of real-world production deployment centers primarily on KT Cloud, SK Telecom, and LG
              Electronics [CU003, CU004, CU007]. KT Cloud became the first domestic cloud provider to commercialize
              public NPU instances leveraging Rebellions first-generation ATOM processors, targeting public-sector data
              centers and domestic enterprise workloads [CU003]. Following the December 2024 merger with SAPEON Korea,
              SK Telecom integrated Rebellions silicon into its commercial infrastructure, running AI call recording
              summarization on its consumer-facing 'A.' service and evaluating the processors within its dedicated NPU
              cluster [CU004, CU005]. Additionally, LG Electronics evaluated Korean NPUs for always-on edge and security
              applications to bypass high GPU operational costs [CU007]. Beyond South Korea, customer engagements with
              entities such as Saudi Aramco remain framed as strategic partnership explorations and sovereign AI MoUs
              rather than disclosed volume purchase agreements [CU008].
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU014
      - number: '6.3'
        title: Adoption Trajectory, Full-Stack Platforms, and Retention Durability
        blocks:
          - type: paragraph
            body: >
              To broaden customer adoption from component-level PCIe accelerator cards to full data-center clusters,
              Rebellions introduced its turnkey RebelRack and RebelPOD infrastructure platforms in March 2026 alongside
              its $400 million pre-IPO financing round [CU009, CU010]. These systems package multi-rack clusters powered
              by the next-generation Rebel100 NPU and integrate with open-source software stacks including vLLM,
              PyTorch, and Triton to minimize customer migration friction [CU010, CU011]. Commercial traction has
              expanded as Rebellions established operating entities across the United States, Japan, Saudi Arabia, and
              Taiwan under Chief Business Officer Marshall Choy [CU012]. However, net revenue retention rates, customer
              renewal metrics, and total active account counts remain undisclosed private data, obscuring the underlying
              commercial velocity [CU013].
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Customer Concentration, Shareholder Dependence, and Global Friction
        blocks:
          - type: paragraph
            body: >
              A critical diligence vulnerability in Rebellions' commercial profile is customer concentration risk and
              dependence on corporate backers [CU014]. Key anchor clients KT and SK Telecom represent substantial equity
              owners and strategic sponsors who spearheaded the company's Series B and SAPEON merger [CU002, CU005]. As
              highlighted by independent market assessments, the startup faces intense execution risk because no binding
              volume supply contracts have been publicly disclosed for the upcoming Rebel100 chip, and penetration into
              Western hyperscalers such as Meta or xAI remains entirely unproven against Nvidia's entrenched CUDA
              ecosystem [CU014, CU015]. Furthermore, pre-IPO cash burn coupled with customer concentration creates
              revenue vulnerability if commercial deployment ramps lag expectations [CU014, CU016].
            claimRefs:
              - CU002
              - CU005
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Captive Commercial Concentration
            body: >
              Rebellions' commercial revenue remains heavily dependent on its strategic investors SK Telecom and KT.
              While these partnerships validate silicon viability at telecom scale, they do not establish that
              Rebellions can win arms-length enterprise deals against Nvidia in competitive global markets.
            calloutType: risk
            claimRefs:
              - CU002
              - CU005
              - CU014
          - type: callout
            title: Shift to Turnkey Infrastructure Platforms
            body: >
              The launch of RebelRack and RebelPOD represents an intentional commercial evolution. By delivering
              pre-integrated rack-scale compute rather than standalone PCIe boards, Rebellions seeks to lower
              integration friction for global cloud operators and sovereign AI clients.
            calloutType: insight
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational and Advanced Packaging Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Rebellions operates as a pure-play fabless semiconductor design firm, introducing structural operational
              exposure to its manufacturing partners. Unlike competitors utilizing TSMC ecosystem pipelines, Rebellions
              fabricates its ATOM accelerators on Samsung Electronics' 5nm process node and relies on Samsung and SK
              Hynix for high-bandwidth memory (HBM3E) co-design and UCIe-Advanced chiplet packaging for the REBEL-Quad
              SoC. This reliance subjects the firm to Samsung foundry capacity constraints and packaging yield
              variability across multi-die configurations. In advanced packaging, any supply bottleneck in HBM3E or
              multi-die substrate integration directly delays high-density cluster platforms such as RebelRack and
              RebelPOD. The complex software-hardware verification loop, while accelerated through emulation
              partnerships with EDA providers like Synopsys, leaves residual risks in firmware integration across
              large-scale distributed inference clusters.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
              - CR010
              - CR012
      - number: '7.2'
        title: Ecosystem Concentration and Market Expansion Barriers
        blocks:
          - type: paragraph
            body: >-
              Following its December 2024 merger with SK Telecom's AI chip division SAPEON Korea, Rebellions secured
              dominant positioning within the domestic South Korean telecom ecosystem. However, this structure creates
              acute customer and shareholder concentration. While domestic deployments such as SK Telecom call-recording
              summarization and KT Cloud infrastructure validate initial workload viability, broader production
              deployments outside South Korea remain unproven. Disclosed expansion plans into the United States, Japan,
              Saudi Arabia, and Taiwan face an entrenched Nvidia software and developer ecosystem. In enterprise and
              hyperscale environments, switching costs away from Nvidia CUDA and established GPU clusters remain high.
              Winning tier-one cloud providers and international sovereign AI accounts requires Rebellions to
              demonstrate robust open-source software maturity across vLLM, PyTorch, and Triton without performance
              regression.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
      - number: '7.3'
        title: Financial Intensity, IPO Readiness, and Sovereign Industrial Policy
        blocks:
          - type: paragraph
            body: >-
              Rebellions has accelerated its capital consumption to fund advanced node taping, high-density server
              integration, and global expansion, raising $650 million across late 2025 and early 2026 out of $850
              million in total lifetime equity capital. While its pre-IPO round established a $2.34 billion valuation,
              maintaining this mark hinges on execution ahead of a planned domestic KOSPI listing and potential foreign
              listing. The significant participation of state-backed entities like the Korea National Growth Fund under
              South Korea's K-Nvidia sovereign initiative introduces geopolitical and regulatory exposure. Changes in
              national industrial policy, public procurement guidelines, or export controls on advanced AI compute
              hardware could restrict international licensing or sales to target regions such as the Middle East.
              Furthermore, audited historical revenue and gross margin statements remain undisclosed, clouding long-term
              cash burn sustainability if commercial adoption stalls.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Dependency on Samsung Foundry and HBM3E Sourcing
            body: >-
              Rebellions' differentiation rests upon a memory-centric architecture tightly integrated with HBM3E and
              Samsung's 5nm process node. Unlike fabless competitors utilizing TSMC's proven CoWoS ecosystem, Rebellions
              is exposed to Samsung's packaging yield curves and memory allocation priorities. Any disruption or yield
              drag in advanced packaging directly threatens volume delivery of the Rebel100 and REBEL-Quad platforms.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: The Valuation vs. Independent Commercial Scale Disconnect
            body: >-
              While Rebellions has secured $850 million in lifetime funding and achieved a $2.34 billion pre-IPO
              valuation, its confirmed commercial revenue footprint remains concentrated in regional telecom pilots like
              SK Telecom and KT Cloud. Without publicly audited financial disclosures or confirmed tier-one
              international hyperscale customer wins, public equity markets may scrutinize margin sustainability during
              its planned KOSPI listing.
            calloutType: insight
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Sovereign-Backed Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Rebellions reached a $2.34 billion valuation in March 2026 after closing a $400 million pre-IPO financing
              round led by Mirae Asset Financial Group and the Korea National Growth Fund. This capital infusion brought
              total lifetime equity financing to approximately $850 million to $858 million across multiple private
              rounds, with $650 million secured in the preceding six months alone following a $250 million Series C
              closed in September 2025 at a $1.4 billion valuation. A core catalyst behind the sharp valuation surge is
              direct state intervention: South Korea's Financial Services Commission advisory board authorized a direct
              250 billion won ($166 million) equity commitment from the state-led National Growth Fund, representing the
              inaugural direct allocation under the national 'K-Nvidia' policy initiative designed to foster domestic
              semiconductor champions capable of challenging foreign dominance in AI compute. While state sponsorship
              de-risks domestic government and telecom procurement channels, it inflates private market marks ahead of
              audited commercial scaling. Disclosed revenue figures published by private market tracking databases
              record company revenue at only $23 million as of September 2025, which remained flat compared to January
              2024 indicators. On that revenue base, the $1.4 billion Series C valuation implied a 60.9x multiple, and
              the subsequent $2.34 billion pre-IPO mark implies a forward revenue multiple well in excess of 100x unless
              the ongoing mass production rollout of the Rebel100 architecture and turnkey RebelRack and RebelPOD
              systems generated sudden, unverified top-line acceleration during late 2025 and early 2026.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV015
      - number: '8.2'
        title: Comparable Set and Pricing Multiple Discipline
        blocks:
          - type: paragraph
            body: >-
              Evaluating Rebellions against peer private semiconductor architectures and specialized compute operators
              reveals severe multiple expansion relative to operating maturity. In the private market peer group,
              specialized AI chip ventures such as Tenstorrent ($2.7B valuation), EVAS Intelligence ($2.2B valuation),
              Photonic ($2.0B valuation), and Upscale AI ($2.0B valuation) command multi-billion-dollar enterprise marks
              despite opaque revenue disclosure. Among publicly traded comparables, high-performance infrastructure
              operators such as Core Scientific trade at approximately 13.1x trailing revenue ($319M revenue, $5.3B
              enterprise value), while speculative compute vendors like D-Wave Quantum trade at 143.7x revenue ($25M
              revenue, $6.0B valuation) amidst heavy operating deficits. Rebellions' implied multiple of 60.9x at Series
              C and substantially higher at pre-IPO pricing positions the company closer to early-stage software
              multiples than asset-intensive fabless semiconductor developers that carry high tape-out, packaging, and
              wafer manufacturing commitments. Furthermore, liquidity mechanisms for existing shareholders have emerged
              on secondary platforms such as EquityZen, where early employee and shareholder stock is offered to
              accredited investors prior to any formal listing event. Although secondary listings demonstrate investor
              interest in accessing pre-IPO allocations, they highlight potential cap-table overhang and liquidity
              pressure if the scheduled public offering timeline encounters domestic regulatory scrutiny or market
              volatility.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario Analysis, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Given the wide dispersion between verified trailing revenue and sovereign-inflated valuation marks, an
              evidence-based investment stance requires a research-more recommendation with high risk and a stretched
              valuation rating. The investment thesis centers on Rebellions successfully commercializing its
              second-generation Rebel100 chiplet platform and turnkey RebelRack and RebelPOD infrastructure across
              hyperscale neoclouds, regional telecom operators, and sovereign AI deployments in Asia, the Middle East,
              and North America. Conversely, the anti-thesis underscores severe commercial vulnerabilities: reliance on
              Samsung Foundry's packaging pipeline amid industry-wide advanced packaging capacity constraints, an
              unproven sales pipeline in the United States against Nvidia's entrenched CUDA software ecosystem, and
              heavy customer concentration within the SK Group and KT ecosystems following the December 2024 Sapeon
              Korea merger. To reconcile these dynamics, a scenario analysis framework models bull, base, and bear
              outcomes. In the bull case, rapid sovereign adoption across South Korea and Saudi Arabia plus successful
              commercialization of Rebel100 justifies a $3.5B to $4.5B valuation upon public listing. In the base case,
              domestic telecom adoption stabilizes but U.S. hyperscaler traction lags, resulting in multiple compression
              to $1.8B to $2.2B at IPO. In the bear case, manufacturing delays at Samsung Foundry and stagnant external
              customer diversification trigger an IPO down-round or delayed listing, compressing enterprise value to
              $0.8B to $1.2B. Key thesis-break triggers include any cancellation or delay of the planned 2026 KOSPI
              listing, failure to secure non-Korean hyperscaler production purchase orders, or persistent negative
              operating cash flow that depletes the $400M pre-IPO cash buffer before volume shipments reach commercial
              scale.
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign AI Subsidies Create Valuation Bifurcation
            body: >-
              South Korea's $166 million direct commitment from the National Growth Fund validates Rebellions as the
              national AI semiconductor champion under the 'K-Nvidia' strategy. However, government subsidies do not
              guarantee international commercial viability, creating a distinct valuation gap between domestic sovereign
              expectations and global enterprise pricing realities.
            calloutType: insight
            claimRefs:
              - CV003
              - CV014
          - type: callout
            title: Extreme Revenue Multiple Limits Pre-IPO Risk-Adjusted Returns
            body: >-
              At a $2.34 billion valuation on only $23 million in reported trailing revenue, investors entering at the
              pre-IPO round bear significant downside exposure if the 2026 public listing fails to command premium
              semiconductor growth multiples in open public markets.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV016
