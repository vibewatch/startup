chapter:
  number: 5
  title: "Product & Technology"
  summary: "Rebellions designs domain-specific AI inference accelerators spanning silicon chiplets, PCIe boards, and integrated datacenter clusters. Built on proprietary dataflow architecture and high-bandwidth memory integration, its flagship Rebel100 platform targets large language model serving while balancing significant software ecosystem dependencies against hyperscale GPU incumbency."
sections:
  - id: "product-architecture-overview"
    title: "Inference-First Silicon and Dataflow Architecture"
    body: "Rebellions approaches datacenter AI acceleration by specializing exclusively in inference workloads rather than adapting general-purpose GPU training silicon. Its core architectural thesis posits that modern large language models, mixture-of-experts architectures, and multimodal reasoning systems are fundamentally memory-bandwidth and dataflow bound during real-time serving, rather than raw compute bound. At the heart of its silicon is a proprietary dataflow architecture and decentralized instruction set architecture (ISA) that bypasses traditional wide-SIMD execution and heavy runtime thread scheduling overhead, exposing instruction-level parallelism directly to the compiler and runtime engine.\n\nThe hardware execution model maps neural network graphs into fine-grained execution streams coordinated by on-chip networks-on-chip and multi-level direct memory access (DMA) engines. Unlike first-generation ATOM accelerators that paired proprietary compute tiles with GDDR6 memory to serve quantized models at 25W to 75W power envelopes, the flagship REBEL platform scales up to frontier workloads exceeding 100 billion parameters. REBEL adopts a modular chiplet packaging strategy using UCIe-Advanced interconnect to combine four compute chiplets with high-bandwidth memory stacks, delivering peta-scale low-precision compute throughput within a 300-watt power envelope."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "system-scale-platforms"
    title: "Systems Delivery: Cards, Racks, and Pod-Scale Infrastructure"
    body: "To bridge the gap between fabless silicon and enterprise datacenter operations, Rebellions delivers its hardware through multiple packaging form factors governed by the Rebellions Scalable Design (RSD) framework. The base delivery unit for hyperscalers and telecommunications operators is the RebelCard, a PCIe Gen5 accelerator board integrating the Rebel100 processor. The PCIe Gen5 x16 interface provides 64 GB/s of bidirectional full-duplex bandwidth, supporting direct card-to-card tensor parallelism and inter-device parameter sharing across Neural Engines without incurring host CPU latency penalties.\n\nAt rack scale, Rebellions offers the 5U RebelServer housing 8 RebelCards, as well as factory-integrated RebelRack units and multi-rack RebelPOD clusters. Designed to support sovereign AI installations and enterprise AI factories, RebelPOD incorporates Credo ZeroFlap active electrical cables (AECs) across its backend network fabric to eliminate intermittent link disruptions and reduce time to first token in distributed clusters. Furthermore, Rebellions collaborates with Arm and SK Telecom on sovereign AI server platforms pairing Arm AGI datacenter CPUs (built on Neoverse CSS V3) with RebelCards, enabling coordinated orchestration across compute, memory, and networking domains."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "software-ecosystem-dependencies"
    title: "Software Toolchain, Ecosystem Integration, and Strategic Limitations"
    body: "Hardware efficiency in AI inference is inextricably linked to compiler maturity and developer ergonomics. Rebellions' full-stack software environment centers around the proprietary RBLN Compiler, which performs automated multi-device tensor splitting, collective communication scheduling (broadcast, reduce, partial sums), and layer pipelining without manual developer partitioning. To achieve linear scalability across rack deployments, RSD incorporates a dedicated router server framework that bundles and dynamically load-balances multiple vLLM serving instances across physical nodes.\n\nRather than forcing customers into a proprietary walled garden, Rebellions integrates with mainstream open-source frameworks including PyTorch, vLLM, Triton Inference Server, Hugging Face, Kubernetes, and Red Hat OpenShift. Support for SR-IOV virtualization and Kubernetes device plugins allows RebelCards to be scheduled as virtual functions in multi-tenant cloud environments. Despite these integrations, developer community mindshare remains a critical gating factor: Rebellions maintains minimal public code repository signal compared to Nvidia CUDA or AMD ROCm, requiring dedicated customer engineering support and leaving long-tail model operator support vulnerable to compiler translation bottlenecks."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
