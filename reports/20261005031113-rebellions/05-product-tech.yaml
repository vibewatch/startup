callouts:
  - calloutType: "insight"
    title: "Memory-Centric Chiplet Bet Differentiates Rebellions from SRAM Pure-Plays"
    body: "While competitive inference startups like Groq and Cerebras anchored their architectures on massive on-chip SRAM to achieve ultra-low token latency, Rebellions has strategically partnered with Korean semiconductor leaders Samsung and SK Hynix to pursue a 3D DRAM and HBM-centric roadmap. This design allows Rebellions to support frontier models exceeding 100 billion parameters within standard datacenter thermal envelopes, providing superior total cost of ownership for memory-capacity-intensive inference."
    claimRefs:
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Software Toolchain Fragility and Developer Community Deficit"
    body: "Despite native integration with vLLM, PyTorch, and Triton, Rebellions operates with an extreme developer-signal deficit relative to Nvidia's CUDA ecosystem. Lacking broad grassroots adoption, the company relies heavily on high-touch enterprise deployment engineering. Any friction in the RBLN Compiler when compiling novel, non-standard transformer architectures poses an adoption blocker for mainstream cloud customers."
    claimRefs:
      - "CE013"
      - "CE015"
