    body: "South Korea's $166 million direct commitment from the National Growth Fund validates Rebellions as the national AI semiconductor champion under the 'K-Nvidia' strategy. However, government subsidies do not guarantee international commercial viability, creating a distinct valuation gap between domestic sovereign expectations and global enterprise pricing realities."
