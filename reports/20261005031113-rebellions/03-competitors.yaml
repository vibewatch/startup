chapter:
  number: 3
  title: "Competitors"
  summary: "Rebellions competes in AI inference against Nvidia, named startup peers Groq and Cerebras, hyperscaler custom silicon, and the status quo of continued GPU procurement or internal development. Its strongest documented differentiators are open-source serving compatibility and rack-scale packaging, but peer pricing, standardized independent benchmarks, and converted U.S. sales remain undisclosed."
sections:
  - id: "competitive-landscape"
    title: "Competitive Landscape and Buyer Alternatives"
    body: >-
      Rebellions is one of several challengers pursuing inference workloads rather than trying
      to displace every general-purpose accelerator use case. CNBC identifies Nvidia, Groq,
      and Cerebras as relevant competitors, while TechCrunch adds custom chips from AWS, Meta,
      and Google to the threat set. For a buyer, the practical alternatives therefore include
      an incumbent GPU platform, a specialized accelerator, a hyperscaler-controlled chip,
      continued procurement of existing infrastructure, or an internal build. Rebellions'
      current route into that market is narrower than the headline landscape: management says
      it is targeting large AI labs and has active U.S. proofs of concept, but it has not
      disclosed resulting sales. The profile table separates documented facts from fields the
      retained evidence does not establish.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP013"
      - "CP015"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-packaging"
    title: "Capability, Packaging, and Go-to-Market Tradeoffs"
    body: >-
      Rebellions' evidence-backed capability case combines inference-focused silicon with
      deployment packaging. Its official ATOM page specifies 32 TFLOPS at FP16, 128 TOPS at
      INT8, and a 60-130 W card envelope, while the newer Rebel100 is sold in server systems.
      RebelRack and RebelPOD extend the offer from chips into production units and multi-rack
      clusters. The software pitch is similarly integrative: retained reports name Kubernetes,
      vLLM, PyTorch, Triton, Hugging Face, and OpenShift. That breadth may reduce adoption
      friction, but it does not prove workload-level superiority. The only quantitative
      comparison in the pool is Rebellions' own ATOM-versus-A100 test, and the company labels
      the ATOM result as projected. Unknown peer cells are therefore left unknown rather than
      filled from general industry assumptions.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
    tableRefs:
      - "TP002"
  - id: "durability-and-displacement-risk"
    title: "Switching Costs, Supply Access, and Moat Durability"
    body: >-
      Rebellions' open-stack approach is a double-edged competitive choice. Compatibility with
      widely used runtimes can lower migration work and support multi-homing, yet common tools
      also make software alone a weaker lock-in mechanism; HostingJournalist explicitly warns
      that differentiation can narrow and margins can compress when vendors share the same
      open stack. Hardware availability is another gating factor. The CEO described memory as
      difficult to secure and separately argued that Samsung and SK Hynix investment improves
      Rebellions' position, but this is a management claim rather than a disclosed supply
      commitment. Pricing is an equally important gap: none of the retained sources provides
      comparable list prices, realized contract terms, discounts, or workload-normalized total
      cost. Consequently, the moat case rests on integration and prospective efficiency, not
      yet on independently demonstrated switching economics or distribution power.
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP014"
    tableRefs:
      - "TP003"
