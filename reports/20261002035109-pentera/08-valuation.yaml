callouts:
  - calloutType: "insight"
    title: "The Valuation Dilemma of the $100M Centaur"
    body: >
      Pentera's milestone of surpassing $100M ARR firmly establishes it as the category winner in automated security validation.
      However, the lack of an announced valuation step-up in its $60M Series D led by Evolution Equity Partners suggests that private market investors repriced its revenue multiple from approximately 25x ARR in 2021 down to 10x ARR in 2025.
      While this multiple compression reflects broader macro software re-benchmarking rather than operational deterioration, incoming investors must ensure they do not purchase shares subject to senior liquidation preference overhang from earlier unicorn rounds.
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
      - "CV011"
