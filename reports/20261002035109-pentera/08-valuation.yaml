  - id: "diligence-and-decision-framework"
    title: "Exit Readiness, Diligence Asks, and Thesis-Break Triggers"
    body: >
      While Pentera previously signaled initial public offering intentions for the United States public markets, its capital path has evolved toward private resilience with cumulative equity financing reaching $250M following its Series D injection.
      Before committing growth capital at or above a $1.0B enterprise valuation, institutional investors must resolve critical private information gaps.
      Primary diligence priorities include obtaining audited cohort net revenue retention figures, gross margin and sales efficiency profiles, and senior liquidation preferences attached to the Series C and Series D shares.
      Thesis-break triggers that would compel an immediate downgrade to avoid include any emergence of verified down-round secondary clearing marks below $700M, annualized core customer logo churn exceeding 15%, or sustained R&D dislocation in its primary development facilities.
      Given the balance of exceptional product-market fit against undisclosed unit economics, the prudent stance remains research-more at a fair valuation assessment.
