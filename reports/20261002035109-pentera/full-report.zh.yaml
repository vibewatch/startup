  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险等级排序与整体态势
        blocks:
          - type: paragraph
            body: >-
              最严重的潜在后果来自运营维度：Pentera
              称其平台在真实生产环境中执行真刀真枪的对抗活动，而第三方评测则提到了审计日志、请求限流、影响范围限制与紧急刹车控制。这些安全控制固然重要，但指定证据并未披露事故发生频率、客户损失、保险理赔或控制措施实测结果。财务不透明则是另一大核心残留风险。CEO
              披露 ARR 达到 $100 million，历史融资记录也证实了充裕的资金实力与 $1 billion 估值，但 ARR
              并不等同于营业收入，累计融资金额也不等同于在手可用现金，证据池中未见关于毛利率、烧钱速度、现金跑道或留存情况的公开数据。因此，热力图依据危害后果严重程度与有据可查的合理性排定优先级，而非凭空测算经验层面的事故发生概率。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR015
              - CR016
