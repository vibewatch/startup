      - number: '2.2'
        title: 目标市场规模、品类渗透率与扩张动能
        blocks:
          - type: paragraph
            body: >-
              评估自动化安全验证的市场潜力，需要结合三个产业视角交叉测算：传统漏洞管理现代化升级、自动化渗透测试软件采纳，以及新兴的持续威胁暴露管理平台。尽管广义的网络安全暴露与漏洞管理支出构成数百亿美元的企业级潜在市场，但自动化渗透测试（APPT）与入侵验证的核心软件板块仍是一个高度集中、高增长的细分领域。Pentera
              凭借先发优势确立了品类定义者地位，年经常性收入快速突破 $100M，全球企业及政企客户超 1,100 家。PeerSpot 独立行业基准显示，Pentera 在 AI 驱动渗透测试软件品类中占据约 29.6%
              的关注度份额，与 Horizon3.ai NodeZero 平台（29.0%）不相上下。市场容量受到企业运维成熟度与人工审计合规刚性双重约束，直接可服务的市场空间仍局限于成熟的企业安全运营中心（SOC）预算与
              MSSP 交付渠道之内。
            claimRefs:
