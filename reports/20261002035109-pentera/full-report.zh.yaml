        - Pentera 称其支持 ICT 测试与第三方风险工作流；评测指出该平台并不颁发合规认证。
        - 营销宣传与合同履约存在潜在合规风险
        - 在受监管客户中为高
        - 框架映射已公开；最终责任仍在客户自身
        - 重大
        - 审查受监管客户合同及相关宣传主张的佐证依据；若无法恪守“仅提供支持而非合规认证”的边界，即构成一票否决标准。
