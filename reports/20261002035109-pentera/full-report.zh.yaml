          label: 修复与复测评估
          stage: Value realization
          detail: 官方宣传材料将核心价值归结为降低风险、压缩测试成本与提升 MTTR。
          touchpoints:
            - Risk reduction
            - Retesting
        - id: advocacy
          label: 同行口碑推荐
          stage: Reference
          detail: 公司官方通稿提及 4.8/5 分的评分与 94% 的推荐意愿。
          touchpoints:
            - Gartner Peer Insights
    approximationNotes: 此为根据公司官方材料梳理的定性流转序列；并不蕴含转化率、时间跨度、续约或扩张概率。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU010
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 按后果与证据支持概率划分的风险热力图
    type: matrix
    summary: 高后果风险集中在损失、集中度及非公开财务数据缺失的领域；单元格表达分析定位而非实证概率。
    data:
      columns:
        - label: 高影响
          detail: 可能损害客户信任、受监管市场准入或融资能力。
        - label: 中等影响
          detail: 可能拖慢增长或推高运营成本，但不会单独威胁公司生存。
        - label: 有限影响
          detail: 基于当前公开证据，主要造成日常执行阻力。
      rows:
        - label: 有证据支持的敞口
          note: 运营现状或依赖项在保留的证据源中有直接记载。
          values:
            - label: 生产环境实网测试安全性
              detail: 实战对抗测试是产品核心；独立的事故发生频率不可得。
              tone: critical
            - label: 分布式团队扩张
              detail: CEO 将维系全球组织的凝聚力列为最大管理挑战。
              tone: warning
            - label: 公开定价不透明
              detail: 测评报告指出其定价未公开，且随业务规模而变化。
              tone: neutral
        - label: 合理的依赖关系
          note: 依赖确实存在，但集中度或具体表现尚未量化。
          values:
            - label: 非公开财务韧性
              detail: ARR 与历史融资已公开，但毛利率、烧钱速度、留存率及跑道均未披露。
              tone: critical
            - label: 渠道拓展执行
              detail: 渠道优先覆盖面广，但伙伴贡献收入及集中度均未披露。
              tone: warning
            - label: Recorded Future 集成
              detail: 集成已公开宣布，但缺乏公开采用率或服务水平协议证据。
              tone: neutral
        - label: 未验证的不利历史
          note: 未从指定证据池中得出“不存在”的确定性结论。
          values:
            - label: 监管或诉讼事件
              detail: 指定材料未包含监管机构或法院记录；需直接检索并获取管理层披露。
              tone: critical
            - label: 影响客户的事故
              detail: 指定材料未包含独立的事故或中断记录；需获取完整损失历史。
              tone: warning
            - label: 营销指标偏差
              detail: 官方宣传的成效百分比缺乏公开分母、客户队列及独立审计细节。
              tone: neutral
        - label: 宣称的缓释措施
          note: 管控措施有公开自述，但指定证据池未做独立检验。
          values:
            - label: 默认安全管控
              detail: Pentera 称其攻击设计在生产环境中安全无虞，测评亦列出限流与紧急停止功能。
              tone: high
            - label: 合规工作流支持
              detail: DORA 映射支持客户合规流程，但不转移客户自身的合规主体责任。
              tone: medium
            - label: 引导式价值验证
              detail: 合作伙伴与测评材料提及上线培训与 PoV 支持，以辅助企业级采用。
              tone: low
        - label: 规模化扩张执行
          note: 官方与二手信源证实了运营变动，但无法确证落地成果质量。
          values:
            - label: 并购整合
              detail: 2025 年的两起并购带来了产品、人员及运营层面的整合工作。
              tone: high
            - label: 全球团队凝聚力
              detail: CEO 将融合分散的本土文化列为最大管理挑战。
              tone: medium
            - label: 历史 IPO 规划
              detail: 2022 年融资通稿描摹了上市蓝图，但并未确立当前就绪度。
              tone: low
        - label: 监控触发条件
          note: 每个单元格列出若出现将实质性改变当前风险评估的证据。
          values:
            - label: 事故与损失历史
              detail: 影响客户的事故、索赔主张、测试异常中止及保险公司记录决定运营残余风险。
              tone: critical
            - label: 伙伴集中度
              detail: 伙伴贡献 ARR 及头部伙伴占比决定渠道依赖的严峻程度。
              tone: warning
            - label: 集成遥测数据
              detail: 采用率、正常运行时间、缺陷率与降级容灾测试决定第三方集成敞口。
              tone: neutral
    approximationNotes: 仅作定性排布；未从缺失的公开数据中推断事故概率、损失规模、客户集中度或现金跑道预估。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR009
      - CR010
      - CR011
      - CR015
      - CR016
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 将已验证的商业化规模与估值压制因素相串联、推导得出最终“继续研究”立场的决策流。
    data:
      nodes:
        - id: node-scale
          label: $100M ARR 与 1,100+ 客户
        - id: node-valuation
          label: $1B 历史估值标杆与 $60M D 轮融资
        - id: node-opacity
          label: 未验证的 NRR 与股权结构表压制
        - id: node-secondary
          label: 流动性匮乏的私募老股市场
        - id: node-multiple
          label: SaaS 估值倍数收缩至约 10x
        - id: node-recommendation
          label: 投资建议：在“合理”估值立场下继续研究
      edges:
        - from: node-scale
          to: node-valuation
        - from: node-valuation
          to: node-opacity
        - from: node-opacity
          to: node-secondary
        - from: node-secondary
          to: node-multiple
        - from: node-multiple
          to: node-recommendation
    approximationNotes: 将运营里程碑与私募市场风险映射至投资立场的定性决策逻辑。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV015
      - CV016
