            body: >-
              公开证据勾勒出一条合乎逻辑的客户旅程：由 CISO 主导需求调研，经方案工程师支持的概念验证（PoC）与单日价值验证（PoV），再到日常实操验证、漏洞排查与同行推荐背书。Pentera
              官网以自述口径展示了成效卡片，宣称降低了网络风险、削减了第三方渗透测试成本并缩短了平均修复时间，但手头文本并未提供分母基数、样本量、测算周期或独立审计依据。反向证据仅见于竞争对手撰写的对比材料，该材料指称在固定范围内反复测试后收益递减，且公开评价中有人反映支持体验繁琐。这些主张可作为有价值的尽调线索，但不能当作独立基准。手头保留的材料均未披露净留存率（NRR）、总留存率（GRR）、Logo
              流失率、续约率、合同年限、队列扩张情况或头部客户收入集中度，因而无法就客户留存韧性或集中度风险得出站得住脚的结论。
