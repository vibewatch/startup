              - CV015
              - CV016
      - number: '8.3'
        title: 退出就绪度、尽调诉求与否决条件触发点
        blocks:
          - type: paragraph
            body: >
              虽然 Pentera 先前曾流露出赴美公开市场首次公开募股（IPO）的意向，但随着注入 Series D 轮融资、累计股权融资规模达到 $250M，其资本路径已转向在非公开市场积蓄韧性。在按 $1.0B
              或更高的企业估值下注成长期资本前，机构投资者必须补齐关键的非公开信息缺口。核心尽调优先级包括：获取经审计的客户队列净留存率（NRR）数据、毛利率与销售效率画像，以及附着于 Series C 和 Series D
              优先股之上的优先清算优先权条款。迫使评级直接下调至“回避”（avoid）的否决触发条件包括：经证实的老股交易出现低于 $700M 的流血轮清算价格、核心客户年化 Logo 流失率突破
              15%，或其核心研发中心遭遇持续性的运营中断。鉴于其突出的产品市场匹配度（PMF）与尚未披露的单元经济模型相互交织，在合理估值判断下，审慎态度仍是“继续研究”（research-more）。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
              - CV016
      - number: '8.4'
        title: 核心图表
        blocks:
          - type: callout
            title: $100M Centaur 企业面临的估值困境
            body: >
              Pentera 突破 $100M ARR 的里程碑，牢固确立了其作为自动化安全验证品类赢家的地位。然而，由 Evolution Equity Partners 领投的 $60M Series D
              轮融资未宣布估值上调，反映出非公开市场投资者已将其市销率估值倍数由 2021 年的约 25x ARR 重新定价至 2025 年的 10x
              ARR。尽管这种估值倍数回落更多折射了宏观软件市场的整体重估而非基本面恶化，但新进投资者仍须警惕，避免购入承受前期独角兽轮次高级清算优先权挤压的次级股份。
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
