      - number: '7.3'
        title: 运营执行与外部依赖
        blocks:
          - type: paragraph
            body: >-
              从公司自述中清晰可见其扩张风险。Pentera 披露其在 20 个国家拥有 450 名员工，CEO 直言打通分布式团队与各地本土文化是其最大的管理挑战。行业报道亦记录了 2025 年完成的 2
              起并购，在内生增长之外叠加了整合负担。商业层面，覆盖 50 多个国家的渠道优先模式拓宽了销售触达，但也引入了对渠道赋能、激励机制及执行力的高度依赖。与 Recorded Future
              的集成有助于提升威胁相关度，但相关公告并未提供采纳率、在线率或集中度指标。此外，第三方评测指出该产品未公开标价，且最适合配备专职安全团队的组织，这也暗示其采购阻力更大，且相较轻量级扫描工具而言，目标客户画像更为逼仄。
