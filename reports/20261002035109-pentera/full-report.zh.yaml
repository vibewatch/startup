      - number: '1.2'
        title: 创始人、高管团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              Pentera 于 2015 年由 Arik Liberzon 博士联合创立，他担任首席技术官（CTO）并主导核心研究与产品架构。2018 年，Amitai Ratzon
              加入并出任首席执行官（CEO），带领公司从隐形研发走向国际化商业扩张。为支撑跨区域市场开拓与业务扩张，管理团队战略性引入了多位企业级软件资深高管。核心成员包括首席营销与企业战略官 Aviv Cohen、首席财务官
              Hagit Ynon、首席人力官 Tzurit Golan、研发高级副总裁 Omer Gafni、首席客户官 Bart Hammond 以及美洲区销售副总裁 Scott Merkle。2025 年，Peter
              Rodriguez 出任渠道管理副总裁，进一步夯实了治理与渠道执行力，他力推合作伙伴优先策略，带动渠道签约额创下历史新高。尽管职能领导层覆盖了技术架构、产品落地与合作伙伴销售，公司在自研攻击模拟设计上仍高度依赖
              Liberzon 博士，在企业战略与中后期资本配置上也实质性依赖 CEO Amitai Ratzon，存在显著的关键人物风险。
            claimRefs:
