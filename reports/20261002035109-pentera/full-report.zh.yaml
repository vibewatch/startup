      - CR009
      - CR011
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 优先级
      - 依赖项
      - 交易对手或角色
      - 集中度证据
      - 失效场景
      - 严重程度
      - 缓释措施
      - 残余敞口
    rows:
      - - 1
        - 渠道主导的分销模式
        - 覆盖 50 多个国家的多层级合作伙伴生态
        - 未披露收入或商机管线集中度
        - 赋能不足、渠道冲突或伙伴流失拖慢订单签约与续约
        - 若存在集中则为高
        - 披露有培训、报备保护、价格保护、演示环境及价值验证许可证支持
        - 在伙伴贡献 ARR 与头部伙伴占比明确前，敞口重大
      - - 2
        - 威胁情报集成
        - Recorded Future
        - 未披露采用率、排他性、正常运行时间或依赖占比
        - 数据源、API、商业条款或路线图调整削弱威胁驱动的验证价值
        - 中
        - 已宣布战略集成与联合运营工作流
        - 在架构与业务连续性审查完成前，敞口中等
      - - 3
        - 广泛的安全工具集成资产
        - 涵盖云原生、端点、身份、代码、工作流及安全厂商
        - 测评报告提及超 100 项集成；具体使用分布未披露
        - API 变更或维护积压侵蚀工作流价值
        - 中
        - 广泛的生态降低了单点厂商依赖，但推高维护负担
        - 在集成使用情况与缺陷指标明确前，敞口中等
      - - 4
        - 私募资本与流动性路径
        - 风投机构与未来融资市场
        - 历史融资与估值已公开；当前现金储备、清算优先权及现金跑道未披露
        - 资金需求或 IPO 延期导致股权稀释或制约业务投入
        - 高
        - $150M C 轮及后续报道融资提供历史资金证据
        - 敞口重大，因融资总额并不等同于账面可用现金
    notes: 在证据池缺乏分母的情况下，集中度字段统一标注为未知；公开披露仅能证实合作关系与方案设计，无法佐证经济依赖度、服务水平或业务连续性表现。
    claimRefs:
