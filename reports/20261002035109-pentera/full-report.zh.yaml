        - 中等
        - 按客群分层获取销售周期、价值验证转化率、续约率、折扣水平及队列扩张数据。
    notes: 风险评级结合了已记录的运营模式与明确识别的证据缺口；并非声称已实际发生业务中断、质量故障或销售恶化。
