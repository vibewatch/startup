      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 经营假设
      - 估值与回报逻辑
      - 核心风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观情景
        - 借助并购与国际渠道扩张，ARR 加速突破 $200M；NRR > 120%。
        - 在公开 IPO 窗口期按 12.0x - 14.0x ARR 倍数计算，企业价值达 $2.4B - $2.8B。
        - 国际渠道执行受挫或并购整合失败。
        - 25%（在竞争激烈的 CTEM 市场实现 ARR 翻倍面临极高执行门槛）
      - - 基准情景
        - ARR 扩张至 $130M - $145M（同比增速 25-30%）；毛利率稳定在 75% 附近。
        - 按 8.5x - 9.5x ARR 倍数计算，企业价值达 $1.1B - $1.3B；资本增值适中。
        - 企业级 SaaS 估值倍数普遍收缩；非合规强制的渗透测试销售周期拉长。
        - 55%（反映当前增长轨迹与更广泛的网络安全支出企稳趋势）
      - - 悲观情景
        - 增速放缓至 15% 以下；客户流失加剧；面临来自 BAS 与 VM 厂商的定价压力。
        - 按 5.0x - 6.0x 倍数计算，企业价值为 $500M - $650M；存在降轮清算优先权压制。
        - 以色列核心工程运营受扰；渠道合作伙伴积极性受挫。
        - 20%（下行风险主要与宏观逆风及平台同质化挂钩）
    notes: 基于 2025/2026 年 $100M ARR 基准的前瞻性情景测算。
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
