    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与市场辨识度
        blocks:
          - type: paragraph
            body: >-
              Pentera（2015 年注册成立时名为
              Pcysys）是一家自动化网络安全验证平台，总部位于马萨诸塞州伯灵顿，核心管理与研发办公室设在以色列特拉维夫，并在得克萨斯州奥斯汀和阿姆斯特丹设有国际业务中心。公司开创了对手方暴露验证（AEV）品类，跳出纸面漏洞管理与静态态势评估的局限，对内部网络、外部边界、云基础设施和业务应用执行安全受控的自动化渗透测试。Pentera
              平台不依赖终端 Agent 或理论风险评分，直接在生产环境中模拟真实攻击者的杀伤链，以实证检验可疑暴露点是否真正可被利用。2026 年 1 月，Pentera 宣布年经常性收入（ARR）突破 $100
              million，成为自动化安全验证领域首家迈入 Centaur 门槛的企业，服务覆盖全球 60 多个国家的 1,200 多家企业客户。不过，独立进攻型安全分析指出，Pentera
              过去立足于自动化网络渗透测试的优势正在遭遇架构摩擦：现代企业攻击面大幅转向复杂的面向客户 Web 应用和分布式 API，而这类资产目前通常按季度评估，尚未能无缝接入日常部署流水线。
