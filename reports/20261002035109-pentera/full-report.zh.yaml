      - number: '7.2'
        title: 监管合规、法律边界与安全约束
        blocks:
          - type: paragraph
            body: >-
              Pentera 对外宣称其测试能力契合欧盟 DORA
              韧性框架要求，涵盖信息通信技术（ICT）测试与第三方风险管理。第三方评测亦指出其具备多项安全与隐私认证，但同时警告该产品仅辅助实证收集工作流，并非直接为客户自身的合规性背书。这一区分至关重要，因为受监管客户仍须对测试范围界定、授权流程、事故上报及合规最终结论自行负责。公开描述的内生安全实践降低了破坏性测试风险，但这终归属于公司口径，而非独立的损失历史档案。指定材料池中未见监管机构裁决、法庭卷宗、正式事故调查报告或原始认证文件，缺少引证记录绝不能直接视为风险不存在的凭据。
            claimRefs:
              - CR001
