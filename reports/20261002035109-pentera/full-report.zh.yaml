        - 一份评测报告提及 SOC 与 ISO 认证资质、符合 GDPR 与 CCPA、具备 DPA 及次级处理方清单；但原始认证文件并未收录在本次材料中。
        - Unknown
        - 高
        - 据报告存在控制措施，但原始审计范围与豁免例外事项未经验证
        - 重大
        - 投资前核查最新报告、审计范围、豁免项、数据流向、次级处理方、数据驻留承诺及 ISO 42001 控制措施。
