      - CR007
      - CR010
      - CR011
      - CR015
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 指标 / 维度
      - 评估
      - 置信度
      - 影响 / 战略意义
    rows:
      - - 投资建议
        - 继续研究
        - 高
        - 在经审计的单位经济模型、NRR 及 D 轮清算条款得到证实前，暂不给出买入建议。
      - - 估值立场
        - 合理
        - 中
        - 名义 $1.0B 估值对应 $100M ARR 的 10.0x 倍数，与成熟高增长网络安全同业水平基本一致。
      - - 风险评级
        - 高
        - 中
        - 研发团队地域集中以及客户留存动态未公开，推高了运营风险。
      - - 目标回报预期
        - 1.5x - 2.5x 总 MOIC
        - 低
        - 需要推动 ARR 迈向 $200M 目标，并在公开市场实现 12x 以上的估值倍数扩张。
      - - 决策周期
        - 12 至 18 个月
        - 中
        - 持续跟踪 pre-IPO 递表进展、老股交易定价及渠道驱动的收入增长。
    notes: 基于截至 2026 年 10 月的快速概况研究约束所评估的综合投资建议与风险摘要。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV016
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 核心支柱
      - 投资逻辑论据
      - 反向逻辑反驳
      - 观点转变触发条件
    rows:
      - - 产品与市场
        - 自动化安全验证（ASV）品类开拓者，以持续验证替代人工渗透测试。
        - 竞争对手与 BAS 厂商正在补充验证模块，功能面临同质化威胁。
        - 第三方实测对比数据证实利用仿真逼真度，且胜率保持在 70% 以上。
      - - 商业化表现
        - 规模迅速突破 $100M ARR 与 1,100 多家企业客户，渠道伙伴势头强劲。
        - 管理层始终未披露客户扩张效率与净留存率（NRR）。
        - 经审计的队列数据证实净留存率持续维持在 115% 以上。
      - - 资本与估值
        - 累计从 K1、Evolution Equity 及 Insight 等顶尖机构融资 $250M。
        - D 轮融资 $60M 且未宣布估值跃升，表明 2021 年后估值倍数出现收缩。
        - Forge 或 EquityZen 等老股市场成交价确立 $1.2B 以上的清算估值标杆。
      - - 退出就绪度
        - 依托机构银团支持与业务规模，已宣布赴美 IPO 意向。
        - IPO 时间表较最初 2024 年指引推迟，需通过私募过桥轮维持增长。
        - 秘密提交 S-1 注册声明草案或聘请 pre-IPO 审计顾问。
    notes: 投资逻辑与反向逻辑的对比综合，将市场机遇与信息披露缺口相对照。
    claimRefs:
