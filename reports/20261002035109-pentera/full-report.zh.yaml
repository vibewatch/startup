          modules:
            - Pentera Resolve 工作流引擎
            - 自动化修复验证复测
        - label: 安全与风险遏制引擎
          detail: 默认安全（Safe-by-design）策略引擎，强制执行无业务中断边界以防止生产环境停机。
          modules:
