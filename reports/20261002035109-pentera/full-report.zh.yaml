      - number: '2.3'
        title: 买方画像、采购渠道与预算再分配
        blocks:
          - type: paragraph
            body: >-
              安全验证的采购逻辑发生了结构性转变：预算正从偶发性安全咨询开支，转向按年订阅的专用软件支出。企业买方主要分为三类：追求持续安全态势实证与管理层汇报的企业 CISO
              及威胁与漏洞管理负责人；需要自动化凭据破解与根因排查路径的安全运营中心（SOC）和红队主管；以及借助快速价值验证（PoV）评估交付周期性测试服务的受管安全服务商（MSSP）与渠道合作伙伴。采购效率正加速向超大规模云厂商生态迁移；Pentera
              上架 AWS
              Marketplace，支持企业客户直接抵扣预付云消费额度，绕过了旷日持久的多方采购审批。但在非云渠道中，采纳门槛依然受制于采购摩擦，初始高额软件许可投入必须证明能有效摊薄常态化第三方咨询开支的总拥有成本。
            claimRefs:
