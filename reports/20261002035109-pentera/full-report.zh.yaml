      - number: '2.4'
        title: 采纳顺风、技术约束与审计现实
        blocks:
          - type: paragraph
            body: >-
              推动自动化安全验证市场采纳的是深层运维痛点：传统漏洞管理工具抛出成千上万个纸面漏洞却无法排定修复优先级，由此造成严重的告警疲劳；监管对持续测试的要求日益严格；进攻型网络安全专业人才极度短缺。安全团队反映，部署自动化验证后网络安全风险最高降低
              80%，第三方渗透测试成本降低 60%。尽管有这些顺风助推，实质性约束仍限制了市场扩张速度。首要问题在于以网络为核心的自动化工具存在架构局限：Pentera 等平台依赖外网边界枚举与内网 Active
              Directory 横向移动，缺乏业务逻辑上下文，无法识别现代微服务中需登录鉴权的 Web
              应用缺陷、多租户隔离失效及越权访问（BOLA/IDOR）。此外，主流合规与监管标准依然要求提供由人工签字的年度渗透测试报告，迫使企业不得不维持双重预算，兼顾自动化持续监控与传统的人工渗透测试即服务（PTaaS）。
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 核心图表
        blocks:
          - type: callout
            title: 以实证验证取代威胁排查中的主观推测
            body: >-
              企业安全运营饱受告警疲劳困扰，漏洞扫描器动辄生成 10,000
              条以上的理论告警。自动化安全验证借助在生产环境中执行的内生安全算法攻击链，将数以千计的潜在暴露收敛至少数经实测验证的根因，帮助安全团队精准阻断已跑通的攻击路径。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 应用层暴露构成结构性市场边界
            body: >-
              Pentera 的核心架构优势在于内网渗透测试、凭据破解与边界资产发现。然而，企业风险暴露正加速向现代 Web 应用与 API 迁移，BOLA/IDOR 等业务逻辑缺陷往往没有对应的 CVE
              编号。自动化网络验证工具无法检查鉴权后的应用运行状态，留下了一处关键暴露敞口，仍须依赖独立工具或人工审计予以覆盖。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方替代方案涵盖直面竞品、相邻工具与既有现状
        blocks:
          - type: paragraph
            body: >-
              买方解决同样的安全保障诉求，有几条可选路径：直接采购自主化平台、采购相邻的漏洞管理或入侵与攻击模拟（BAS）工具、采购外部人工测试，或由内部安全团队使用手工及单点工具。Pentera
              将自身定位为覆盖内网、外网资产、云及混合环境的统一暴露验证平台。保留的对比材料将 NodeZero 描述为覆盖广泛的自主渗透测试引擎，将 XBOW 描述为专注 Web 应用与 API 的 AI
              智能体专家。在需要深度理解业务上下文或第三方独立性的场景下，人工测试仍是不可替代的方案。漏洞管理与 BAS 属于邻近品类而非同类产品：Pentera
              官方对比指出，这两类工具仅做漏洞清点或预设技术模拟，无法证实完整的实操攻击推进过程。内部自研也是现实中的常规选项，但手头资料并未提供关于自研成本、覆盖面或成效的可比数据。
            claimRefs:
