      - number: '1.3'
        title: 资本结构、投资者阵营与发展里程碑
        blocks:
          - type: paragraph
            body: >-
              Pentera 的融资历程展现了强劲的机构支持，历次风险投资与成长期股权融资累计超过 $350 million。2022 年 1 月，Pentera 完成由 K1 Investment Management
              领投的 $150 million Series C 轮融资，投后估值达 $1.0 billion，晋升独角兽，Evolution Equity Partners、Insight Partners、Awz
              Ventures 和 Blackstone Innovations Investments 参投。随后，公司于 2025 年初完成 $60 million Series D
              轮融资，为两次战略并购及新产品线落地提供扩张资金，新方案包括面向 AI 驱动修复工作流的 Pentera Resolve，以及针对专业红队验证的 Pentera Offensive Security
              Services。头部老股交易平台 EquityZen 和 Forge Global 显示 Pentera
              股权存在有限的非公开市场交易，但私募交易结算价格、优先股堆叠清算优先权以及确切的董事会席位治理权，仍由机构投资团牢牢掌控。运营里程碑方面，Pentera 自 2015
              年成立后迅速走向成熟并确立品类领先地位，全球员工数从 2021 年的 150 人扩张至 2026 年覆盖美国、EMEA 和亚太地区的 350 多人。
