      - - 入侵与攻击模拟（BAS）
        - 合成安全控制验证、检测剧本评估、使用预定义脚本测试 EDR/SIEM/WAF 规则
        - 生产环境真实漏洞利用、自主攻击推进、非模拟的主机入侵突破
        - 安全运营中心（SOC）负责人、紫队
        - 相邻竞争市场；验证检测响应能力，而非证明根本原因的可利用性
      - - 外部攻击面管理（EASM）
        - 面向互联网的资产发现、DNS/证书测绘、开放端口枚举、外围可见性
        - 内部横向移动、深度漏洞利用验证、企业网络内的凭据撞库
        - 安全架构团队、安全运营（SecOps）
        - 已纳入 Pentera Surface 模块的能力，提供外围攻击路径
      - - 渗透测试即服务（PTaaS）与咨询
        - 人工主导的定制化进攻性测试、合规认证审计报告、复杂业务逻辑分析
        - 持续自动化执行、按需每日重新验证、实时修复效果验证
        - 合规总监、CISO、内部审计部门
