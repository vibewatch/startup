  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资逻辑、反向逻辑与资本结构背景
        blocks:
          - type: paragraph
            body: >
              Pentera 开创了自动化渗透测试与对手方暴露验证（AEV）赛道，自 2018 年结束隐身状态后迅速扩张，并在 2025 年突破 $100M ARR，成为该品类首家迈入 Centaur
              门槛的企业。核心投资逻辑立足于品类的结构性变革：企业预算正从传统漏洞管理与静态入侵与攻击模拟（BAS），大举转向持续、内生安全的生产环境验证，用实际利用实证取代纸面的常见漏洞与暴露（CVE）风险推演。强劲的商业拉力得到了金融、零售及酒店等行业
              1,100 多家企业客户的印证，同时渠道采纳进展迅速，合作伙伴主导的推进贡献了大部分新商机。与之相对，反向逻辑则直指严重的财务与估值不透明。Pentera 在 2022 年 1 月由 K1 Investment
              Management 领投的 $150M Series C 轮融资中，投后估值达到标志性的 $1B；但其后在 2025 年 3 月由 Evolution Equity Partners 领投的 $60M
              Series D 轮融资中，却显眼地未公开最新估值。这种持平乃至未予披露的估值结构反映出，尽管从 2021 年底到 2025 年 ARR 增长了 300% 以上，但风投估值倍数较 2021
              年高点的大幅收缩，已基本抵消了底层企业价值的扩张。此外，包括 Forge Global 和 EquityZen
              在内的非公开老股交易平台显示，其股价、撮合成交量以及详细的股权结构表清算优先权与优先股堆叠均不可见或处于锁定状态，致使外界无法对普通股价值进行独立核验。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
