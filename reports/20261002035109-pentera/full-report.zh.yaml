        title: 护城河立足于执行力且尚未得到独立证实
        blocks:
          - type: paragraph
            body: >-
              Pentera 具备可信的规模信号，但数据出处值得推敲。CEO 称公司 ARR 突破 $100 million，在 20 个国家拥有 450 名员工；这些都属于公司口径，并非经审计披露。公司 2022
              年的新闻稿提及拥有 400 多家企业客户，而《耶路撒冷邮报》在 2025 年 3 月撰文称，公司表示已有超过 1,100
              家企业使用其平台。业务规模、长期积累的安全工程经验、专职研发运作以及全球合作伙伴网络，有助于强化客户信任与分销壁垒。与之相对，Built In 明确由 LLM
              生成的总结指出，该品类正趋于同质化且缺乏充分的审计披露；对比资料也显示挑战者正从更广的基础设施与更深的应用切入发起攻势。因此，站得住脚的结论是有前提的：Pentera
              目前看似具备差异化，但能否持久，还需看独立基准测试结果、赢单/输单数据、续约队列、实际成交价以及量化测算的切换成本。
