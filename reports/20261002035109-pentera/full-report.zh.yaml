      - number: '7.4'
        title: 监控跟踪、否决条件与尽调清单
        blocks:
          - type: paragraph
            body: >-
              投资决策必须要求获取能将公司自述控制转化为可衡量损失与持久性数据的实证。核心运营资料包应当包含过去 5
              年的一级与二级测试事故记录、客户索赔、紧急刹车事件、测试中断率以及网络安全保险除外责任条款，并与客户支持及法务档案做交叉核对。监管尽调应当调取最新认证报告、数据子处理方清单、数据处理协议条款、客户授权文本，并检索相关法庭与监管机构数据库。财务尽调应当将合同
              ARR
              与已确认收入、毛利率、留存率、现金烧钱速度及现金跑道进行对账。核心投资逻辑失效的触发条件包括：发生对客户产生重大实质影响的测试事故、安全认证无法提供实质证据支撑、留存率持续下滑、合作伙伴集中度过高且无业务连续性预案，或在实现可靠退出前出现对现有投资人产生大幅稀释的资金渴求。
