      - number: '3.2'
        title: 能力边界比品类标签更关键
        blocks:
          - type: paragraph
            body: >-
              在手头证据中，最清晰的产品差异在于攻击面覆盖。Pentera 侧重于真实生产基础设施、身份、凭据、勒索软件以及攻击路径验证；其 CEO
              还强调，严密的安全控制与自建研究团队是深思熟虑的架构设计。对比资料显示，NodeZero 横跨内网、外网、云、Kubernetes、身份体系和 Web 环境，而 XBOW 则把自适应智能体集中在 Web 应用与
              API
              上。在涉及业务逻辑和定制上下文以判断漏洞是否可利用的环节，人工测试依然占优。上述描述有助于做初步筛选，但不足以证明技术优越性：证据池中没有受控的第三方实测对比来量化利用保真度、安全事故率、覆盖范围、误报率或修复成效。因此，矩阵中缺乏支撑的单元格均标注为“未知”或“视范围而定”，而非按品类名称主观推断。
