      - - 漏洞管理（VM / RBVM）
        - 被动资产发现、凭据化软件资产清单扫描、CVE 库匹配、基于 CVSS 的静态评分
        - 真实漏洞利用执行、多步攻击链组合、生产环境安全影响演示
