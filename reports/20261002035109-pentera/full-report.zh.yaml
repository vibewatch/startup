            body: >-
              最具说服力的公开规模标志，是 Pentera 宣布其年经常性收入在 2025 年突破 $100M。ARR 是一项经常性运行率指标，既非会计准则下的营业收入，也非现金收款或毛利。因此，GetLatka 对其
              2025 年年度收入单独给出的 $117.4M 预估值，不能用作印证 ARR 金额的依据，更不能与 ARR 混为一谈。公司在 2022 年发布的新闻稿中还声称过去 24 个月收入实现六倍以上增长、企业客户超过
              400 家，但两份披露均未提供当下的收入确认政策、产品与服务组合、合同期限、客户集中度、流失率或净扩张拆解。公开证据支持其商业规模，但该规模的持续性与会计成色仍未获验证。
