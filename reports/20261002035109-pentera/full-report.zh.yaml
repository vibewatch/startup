  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与企业级运行模型
        blocks:
          - type: paragraph
            body: >-
              Pentera 将自身软件定位为自动化安全验证平台，旨在用可利用性的实证检验替代主观假设驱动的漏洞管理。Pentera
              不仅基于软件版本比对或常见漏洞与暴露（CVE）清单生成理论漏洞列表，而是在企业环境中执行多步骤自动化攻击战役。其核心引擎采用无 Agent 架构，无需安装主机端 Agent
              或对终端做侵入式改造，完全利用原生网络协议与凭据探测目标系统。该测试模型遵循严苛的内生安全运行标准，确保模拟利用、凭据验证及横向移动序列在真实生产环境中安全跑通，既不造成业务中断，也不引发关键基础设施宕机。借助
              Autonomous Attack Orchestrator，系统能全自动识别易受攻击的目标资产，评估潜在利用路径，并在整条攻击杀伤链中确定下一步最佳攻击动作，全程无需渗透测试人员人工介入。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
