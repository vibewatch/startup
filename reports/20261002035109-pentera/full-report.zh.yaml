  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界范围与攻击验证范式
        blocks:
          - type: paragraph
            body: >-
              企业进攻型安全与漏洞评估市场传统上被划分为两派：非利用性扫描工具与合成控制模拟。Pentera 开创了自动化安全验证（ASV）品类——Gartner
              持续威胁暴露管理（CTEM）框架中正式定名为对手方暴露验证（AEV）——以此弥合静态漏洞扫描与单点式人工渗透测试之间的断层。ASV
              技术涵盖自动化渗透测试、外部攻击面管理（EASM）和主动云安全验证，直接在生产环境中执行内在安全的算法攻击。该业务边界明确包括网络基础设施渗透测试、横向移动分析、凭据暴露评估以及外部边界攻击面发现。相对而言，核心
              ASV 架构排除了应用业务逻辑漏洞测试、深度 API 鉴权分析（如
              BOLA/IDOR）、针对特定企业定制手法的纯人工红队测试，以及非利用性静态配置审计。安全验证借由在真实生产网络中证实实际可利用性，而非报告理论上的常见漏洞与暴露（CVE），从成千上万条扫描原始告警中精准剥离出根本攻击路径。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
