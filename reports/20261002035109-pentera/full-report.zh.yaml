      - number: '5.2'
        title: 模块全景与混合技术架构
        blocks:
          - type: paragraph
            body: >-
              其商业化平台将多个功能模块整合进统一的暴露管理控制台。Pentera Core 针对 Active Directory 和本地子网，提供自主内网渗透测试、横向移动分析与凭据暴露核验。Pentera Surface
              负责外部攻击面管理（EASM），无需配置部署凭据，即可持续识别边界资产、影子 IT、暴露服务以及面向公网的漏洞。专属验证模块包括防范勒索软件横向扩散行为（如数据外发与文件加密操作）的
              RansomwareReady，以及针对 Log4Shell 的专项测试套件。为填补暴露发现与风险处置之间的执行断层，Pentera Resolve
              作为内置修复引擎，可去除重复发现项，依据经验证的攻击路径关键度排定根本原因优先级，并对接第三方 IT
              工单系统编排修复工作流。架构上，该平台正将确定性攻击执行与基于大语言模型（LLM）的概率性场景相融合，让安全团队清晰掌握哪些测试阶段遵循严密的确定性逻辑，哪些阶段属于启发式概率探索。
            claimRefs:
              - CE006
