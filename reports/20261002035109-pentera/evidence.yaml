evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming gross margin, net revenue retention (NRR), customer acquisition cost (CAC)
      payback, and cash burn rate for the current $100M ARR cohort.
    whyItMatters: >-
      Without audited retention and operating margin metrics, private market valuation multiples cannot be fundamentally
      reconciled against public SaaS benchmarks.
    diligencePath: >-
      Request confidential management financial package and GAAP revenue breakdown under non-disclosure agreement during
      formal investor diligence.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: minor
    topic: leadership-and-governance
    missingEvidence: Comprehensive directory of secondary board observers, advisory committee delegates, and regional sales directors.
    whyItMatters: >-
      Partial enumeration leaves operational depth and regional succession coverage unverified outside the senior
      executive committee.
    diligencePath: Review internal organizational chart and management presentation during confirmatory diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Complete capitalization table detailing exact ownership percentages, liquidation preference seniority, and
      secondary transaction share transfers.
    whyItMatters: >-
      Essential for evaluating waterfall return distributions and potential dilution for late-stage or pre-IPO equity
      participants.
    diligencePath: Obtain fully diluted capitalization table and investor rights agreement from company legal counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sizing
    missingEvidence: >-
      Third-party consensus TAM dollar valuation isolating automated penetration testing software from broad legacy
      vulnerability management.
    whyItMatters: >-
      Without an independent dollar TAM estimate, addressable market sizing must rely on relative segment mindshare and
      vendor revenue scale.
    diligencePath: >-
      Request Gartner or IDC market share reports detailing spending figures for Continuous Threat Exposure Management
      and Automated Security Validation.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - id: gap-gaap-revenue
    type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited GAAP revenue, gross margin, net revenue retention (NRR), and geographic revenue breakdown.
    whyItMatters: >-
      Headline ARR disclosures ($100M) do not disclose cash collection, contract duration, customer churn, or
      professional service mix.
    diligencePath: >-
      Review confidential private financial disclosure statements and investor presentation decks under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-economics
    missingEvidence: >-
      Matched renewal cohorts, implementation effort, data portability, multi-homing behavior, partner-sourced bookings,
      and direct competitive win/loss records.
    whyItMatters: >-
      Without these data, neither channel power nor buyer lock-in can be separated from sales execution and product
      performance.
    diligencePath: >-
      Request anonymized renewal cohorts, lost-deal notes, partner attribution, implementation logs, and matched-scope
      replacement case studies.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A controlled independent comparison of exploit fidelity, coverage, false positives, production safety, remediation
      outcomes, and external assurance posture.
    whyItMatters: Vendor descriptions and a competitor-authored comparison cannot establish technical superiority or durable trust.
    diligencePath: >-
      Commission a time-boxed bake-off on the same network, identity, cloud, and application estate with independently
      defined success and safety criteria.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Current matched-scope vendor quotes, realized ACV, discounting, services attach, and module-level renewal data.
    whyItMatters: Directional public pricing cannot prove price pressure, revenue quality, or economic substitutability.
    diligencePath: >-
      Collect current proposals for an identical estate and reconcile them to Pentera CPQ, billing, renewal, and
      partner-discount records.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: private-unit-economics
    missingEvidence: >-
      Audited revenue, recognition policy, gross margin, NRR, gross retention, churn, CAC, CAC payback, and
      service-delivery cost.
    whyItMatters: These inputs determine whether reported recurring scale converts into durable, profitable growth.
    diligencePath: >-
      Request audited statements, ARR-to-revenue bridges, cohort retention schedules, and direct-versus-channel unit
      economics from the CFO.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway, debt and covenant schedule, working-capital profile, capex plan, use of funds,
      and next-round trigger.
    whyItMatters: Historical funding raised cannot establish liquidity, financing dependency, or downside survival.
    diligencePath: >-
      Obtain bank statements, a current balance sheet, monthly cash-flow history, debt documents, and a board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      List-price architecture, realized ACV distribution, contract duration, discounting, partner share, PoV conversion,
      and revenue concentration.
    whyItMatters: >-
      Without contract evidence, pricing power, channel efficiency, concentration, and revenue quality cannot be
      measured.
    diligencePath: Sample executed customer and partner contracts and reconcile them to bookings, billings, and recognized revenue.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: application-business-logic
    missingEvidence: >-
      Empirical benchmark data demonstrating automated detection rates for authenticated business logic flaws (e.g.,
      multi-tenant authorization bypasses, BOLA, IDOR) within Pentera Core and Surface.
    whyItMatters: >-
      Enterprises with high application exposure may require redundant testing solutions if automated validation cannot
      assess authenticated application business logic.
    diligencePath: >-
      Request customer win/loss technical bakeoff reports evaluating application-layer vs. network-layer finding
      distributions.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - id: null
    type: missing-source
    severity: minor
    topic: ai-probabilistic-architecture
    missingEvidence: >-
      Technical documentation detailing the exact model architecture, prompting constraints, and guardrails governing
      LLM-driven probabilistic attack generation.
    whyItMatters: >-
      Determines whether generative AI features introduce non-deterministic execution risks into live enterprise
      networks.
    diligencePath: Review technical whitepapers and patent filings regarding Pentera's AI orchestrator safety guardrails.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: NRR, GRR, logo churn, renewal rate, contract duration, cohort expansion, and module-level retention.
    whyItMatters: >-
      Public adoption and advocacy indicators cannot establish recurring-revenue durability or land-and-expand
      performance.
    diligencePath: >-
      Request audited cohort schedules, renewal waterfalls, contract-term distributions, and module expansion by
      customer vintage.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-1, top-5, top-10, and top-25 customer shares of ARR and revenue, including investor-customer overlap.
    whyItMatters: >-
      The loss or repricing of a large account could materially affect ARR even if the total environment count remains
      high.
    diligencePath: >-
      Inspect customer-level ARR and revenue schedules, related-party flags, and concentration trends for the last eight
      quarters.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer register with deployment status, contract value, start date, renewal history, and
      reference permission.
    whyItMatters: >-
      The named examples are a vendor-selected sample and cannot establish the breadth, recency, or retention of the
      installed base.
    diligencePath: >-
      Reconcile the customer master file to billing records and sample reference calls across verticals, vintages, and
      contract sizes.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      Direct regulator, court, enforcement, sanctions, and material-litigation records across Pentera's operating
      jurisdictions.
    whyItMatters: >-
      Company and secondary sources cannot establish the absence, scope, or financial significance of legal and
      regulatory matters.
    diligencePath: >-
      Run entity and subsidiary searches in relevant regulator and court databases, then reconcile results to
      management's litigation schedule and legal letters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: >-
      Five-year customer-impacting incident, outage, test-abort, emergency-stop, insurance-claim, and remediation record
      with severity and denominator data.
    whyItMatters: >-
      Live-production adversarial testing creates potentially high-consequence operational exposure that public safety
      claims cannot quantify.
    diligencePath: >-
      Reconcile support, engineering, legal, insurer, and customer-success records; independently sample material events
      and control-test results.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: >-
      Current primary SOC and ISO reports, scopes, exceptions, bridge letters, subprocessor list, DPA, data-residency
      commitments, and AI governance control evidence.
    whyItMatters: >-
      A third-party review reports these controls, but certification scope and exceptions determine whether they
      mitigate regulated-customer risk.
    diligencePath: >-
      Inspect current reports in the trust portal under NDA and map every exception and subprocessor to product data
      flows and customer commitments.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-durability
    missingEvidence: >-
      Audited revenue reconciliation, gross margin, net revenue retention, churn, cash balance, burn, runway, debt,
      preferences, and customer concentration.
    whyItMatters: >-
      ARR and funding announcements do not establish recognized revenue quality, cash availability, or financing
      resilience.
    diligencePath: >-
      Obtain audited statements, ARR bridge, cohort retention, cap table, preference stack, monthly cash flow, and
      board-approved operating plan.
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Partner-sourced ARR, pipeline, top-partner shares, Recorded Future adoption, integration uptime, exclusivity,
      termination rights, and continuity plans.
    whyItMatters: Public program and partnership announcements establish relationships but not economic or operational dependence.
    diligencePath: >-
      Review partner-level bookings and renewals, contracts, API architecture, service levels, churn, and tested
      fallback procedures.
    relatedTableRefs:
      - TR003
