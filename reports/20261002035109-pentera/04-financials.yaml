company:
  name: "Pentera"
chapter:
  number: 4
  title: "Financials"
  summary: "Pentera says it crossed $100M in ARR in 2025, establishing meaningful recurring-revenue scale, while an independent database separately estimates $117.4M of 2025 annual revenue. Those measures are not interchangeable, and the assigned public evidence does not disclose realized pricing, revenue mix, gross margin, retention, burn, cash, or runway, so the business remains financially underwriteable only through private diligence."
sections:
  - id: "revenue-scale-and-quality"
    title: "Revenue scale is visible; revenue quality is not"
    body: >-
      The strongest public scale marker is Pentera's statement that it crossed
      $100M in Annual Recurring Revenue in 2025. ARR is a recurring run-rate
      metric, not accounting revenue, cash receipts, or gross profit. GetLatka's
      separate $117.4M estimate of 2025 annual revenue therefore should not be
      used as corroboration of the ARR amount or blended into one metric. A
      company-issued 2022 release also claimed more than sixfold revenue growth
      over the preceding 24 months and more than 400 enterprise customers, but
      neither disclosure provides a current revenue-recognition policy, product
      mix, services mix, contract duration, concentration, churn, or expansion
      bridge. Public evidence supports commercial scale, while the durability
      and accounting quality of that scale remain unverified.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
      - "CI008"
      - "CI014"
    tableRefs:
      - "TI001"
  - id: "pricing-and-go-to-market"
    title: "Proof-led enterprise selling and channel distribution"
    body: >-
      The reviewed commercial surfaces point to a guided enterprise sale rather
      than transparent self-service pricing. Pentera's homepage routes prospects
      to a personalized demo, while its company-issued partner announcement
      describes a channel-first model, a one-day Proof of Value intended to
      shorten traditional sales cycles, and Associate, Premier, and Elite tiers
      with financial incentives and discount structures. These disclosures
      support a proof-led direct-and-partner funnel, but they do not reveal list
      price, realized ACV, PoV conversion, sales-cycle distribution, partner
      contribution, commissions, or discount percentages. The partner release
      remains company-issued despite its PR Newswire host, so it is evidence of
      the designed motion rather than independent proof of sales efficiency.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-capital-adequacy"
    title: "Capital adequacy and unit economics remain private"
    body: >-
      Tracxn reports $250M of cumulative funding across five rounds, including a
      $60M Series D in March 2025. That is financing history, not evidence of
      current cash, burn, runway, debt capacity, or availability of the proceeds
      today. Pentera's CEO also described roughly 450 employees across 20
      countries when discussing the ARR milestone, which indicates an
      internationally distributed operating base but does not establish payroll
      cost or revenue productivity. Public secondary-market visibility is weak:
      Forge showed limited activity and no available Forge Price, while EquityZen
      put current valuation and financial information behind registration. The
      financial verdict is therefore mixed: recurring scale is credible as a
      company-reported milestone, but pricing realization, gross margin, NRR,
      CAC payback, operating loss, cash burn, working capital, capex, debt, and
      runway must be obtained directly before margin quality or capital
      efficiency can be underwritten.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
