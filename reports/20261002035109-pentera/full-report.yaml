      - number: '7.4'
        title: Monitoring, kill criteria, and diligence
        blocks:
          - type: paragraph
            body: >-
              Investment underwriting should require evidence that converts company-described controls into measurable
              loss and durability data. The key operating package is five years of severity-one and severity-two testing
              incidents, customer claims, emergency-stop events, test-abort rates, and cyber-insurance exclusions,
              reconciled to support and legal records. Regulatory diligence should include the current certification
              reports, subprocessor list, data-processing terms, customer authorization language, and searches in
              relevant court and regulator systems. Financial diligence should reconcile contracted ARR to recognized
              revenue, gross margin, retention, cash burn, and runway. Thesis breaks include a material
              customer-impacting testing incident, inability to substantiate security attestations, a sustained
              retention decline, partner concentration without continuity plans, or cash needs that materially dilute
              investors before a credible liquidity event.
            claimRefs:
