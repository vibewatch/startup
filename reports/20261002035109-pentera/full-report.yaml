chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Market Positioning
        blocks:
          - type: paragraph
            body: >-
              Pentera (originally incorporated as Pcysys in 2015) is an automated cybersecurity validation platform
              headquartered in Burlington, Massachusetts, with primary corporate and engineering offices in Tel Aviv,
              Israel, and international hubs in Austin, Texas, and Amsterdam. The company pioneered the Adversarial
              Exposure Validation (AEV) category, moving beyond theoretical vulnerability management and static posture
              assessment to conduct safe, automated penetration testing across internal networks, external perimeters,
              cloud infrastructure, and business applications. Rather than relying on installed endpoint agents or
              theoretical risk scoring, Pentera platform emulates real-world adversary kill-chains in production
              environments to validate whether suspected exposures are genuinely exploitable. By January 2026, Pentera
              announced that it surpassed $100 million in Annual Recurring Revenue (ARR), becoming the first company in
              the automated security validation sector to achieve centaur status, while serving more than 1,200
              enterprise customers across more than 60 countries. However, independent offensive security analyses note
              that Pentera historical strength in automated network penetration testing faces emerging architectural
              friction as modern enterprise attack surfaces shift heavily toward complex customer-facing web
              applications and distributed APIs, which are typically evaluated quarterly rather than continuously
              integrated with daily deployment pipelines.
