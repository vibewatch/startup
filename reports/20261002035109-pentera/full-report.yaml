      edges:
        - from: node-scale
          to: node-valuation
        - from: node-valuation
          to: node-opacity
        - from: node-opacity
          to: node-secondary
        - from: node-secondary
          to: node-multiple
        - from: node-multiple
          to: node-recommendation
    approximationNotes: Qualitative decision logic mapping operational milestones and private market risks to investment stance.
    claimRefs:
