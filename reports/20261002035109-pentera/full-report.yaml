        title: Operational execution and dependencies
        blocks:
          - type: paragraph
            body: >-
              Scaling risk is visible in the company's own narrative. Pentera reports 450 employees across 20 countries,
              and its CEO identifies connecting distributed teams and local cultures as his largest management
              challenge. Secondary reporting also records two 2025 acquisitions, adding integration work alongside
              organic growth. Commercially, a channel-first model across more than 50 countries creates reach but also
              introduces enablement, incentive, and execution dependencies. The Recorded Future integration can improve
              threat relevance, although the announcement provides no adoption, uptime, or concentration metrics.
              Finally, a review says public pricing is unavailable and the product is best suited to organizations with
