  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Enterprise Operating Model
        blocks:
          - type: paragraph
            body: >-
              Pentera positions its software as an automated security validation platform engineered to replace
              assumption-driven vulnerability management with empirical proof of exploitability. Rather than producing
              theoretical vulnerability lists based solely on software version matching or Common Vulnerabilities and
              Exposures (CVE) inventories, Pentera executes automated, multi-step attack campaigns across enterprise
              environments. The core engine is built on an agentless architecture that operates without requiring
              host-based agents or invasive endpoint modifications, utilizing native network protocols and credentials
              to probe systems. The testing model incorporates a strict safe-by-design operational standard, ensuring
              that emulated exploits, credential validation, and lateral movement sequences run safely within live
              production environments without causing service disruption or crashing critical business infrastructure.
              Through its Autonomous Attack Orchestrator, the system autonomously identifies vulnerable target assets,
              evaluates potential exploit paths, and determines the optimal next-attack step across the full attack kill
              chain without requiring manual pentester intervention.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE013
      - number: '5.2'
        title: Module Map and Hybrid Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              The commercial platform integrates several operational modules into a unified exposure management console.
              Pentera Core provides autonomous internal network penetration testing, lateral movement analysis, and
              credential exposure verification across Active Directory and on-premises subnets. Pentera Surface delivers
              external attack surface management (EASM), continuously identifying perimeter assets, shadow IT, exposed
              services, and internet-facing vulnerabilities without requiring deployment credentials. Specialized
              validation modules include RansomwareReady, which validates defenses against ransomware propagation
              tactics such as data exfiltration and file-encryption behaviors, and Log4Shell testing frameworks. To
              close the operational gap between exposure discovery and mitigation, Pentera Resolve serves as an
              integrated remediation engine that deduplicates findings, prioritizes root causes based on proven attack
              path criticality, and orchestrates remediation workflows across third-party IT ticketing systems.
              Architecturally, the platform is evolving to blend deterministic attack execution with probabilistic large
              language model (LLM) scenarios, giving security teams visibility into which testing phases adhere to
              strict deterministic logic versus guided probabilistic exploration.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
