      - number: '6.3'
        title: The journey is visible through evaluation and advocacy; durability is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence outlines a plausible customer journey from CISO-led discovery through
              sales-engineer-supported proofs of concept, a one-day proof-of-value motion, operational validation,
              remediation, and peer advocacy. Pentera's homepage presents claimed outcome cards for cyber-risk
              reduction, third-party pentesting cost reduction, and faster mean time to remediation, but supplies no
              denominators, sample sizes, measurement periods, or independent audit in the retained text. Adverse
              evidence is limited to a competitor-authored comparison, which alleges diminishing returns after repeated
              runs in a fixed scope and cumbersome support reported in public reviews. Those assertions are useful
              diligence prompts rather than independent benchmarks. No retained source reports NRR, GRR, logo churn,
              renewal rates, contract length, cohort expansion, or top-customer revenue share, preventing a defensible
              conclusion on durability or concentration.
