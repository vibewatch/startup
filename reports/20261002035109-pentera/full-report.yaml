      - number: '2.2'
        title: Addressable Market Sizing, Category Penetration, and Expansion Dynamics
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market potential for automated security validation requires triangulating across distinct
              industry lenses: legacy vulnerability management modernization, automated penetration testing software
              adoption, and emerging continuous threat exposure management platforms. While broad cybersecurity exposure
              and vulnerability management spending represents a multi-billion dollar enterprise addressable market, the
              core software segment for Automated Penetration Testing (APPT) and breach validation operates as a
              concentrated, high-growth subset. Pentera captured an early category-defining footprint, scaling rapidly
              past $100M in annual recurring revenue across more than 1,100 enterprise and government customers
              globally. Independent industry benchmarks from PeerSpot indicate that Pentera commands approximately 29.6%
              mindshare in the AI-powered penetration testing software category, closely matched with Horizon3.ai
              NodeZero platform at 29.0%. Market sizing is constrained by enterprise operational readiness and the dual
              necessity of human-attested audits, creating an immediate serviceable addressable market bounded by mature
              enterprise security operations center (SOC) budgets and MSSP delivery channels.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
