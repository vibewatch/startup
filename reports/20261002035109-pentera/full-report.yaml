        title: Adoption indicators are strong, but most proof is vendor-selected
        blocks:
          - type: paragraph
            body: >-
              Pentera's disclosed adoption markers progress from more than 400 enterprise customers in January 2022 to a
              CEO-reported $100 million ARR milestone in 2025 and more than 1,000 tested enterprise environments cited
              in a 2026 company release. These measures are not interchangeable: customer accounts, tested environments,
              and ARR use different denominators. The same 2026 syndicated release reports a 4.8 out of 5 Gartner Peer
              Insights rating and 94% willingness to recommend over an 18-month consideration period ending June 30,
              2026. Named official stories describe Lulu Exchange reducing testing cycles from months to hours and
              Emeria gaining actionable risk visibility. Pentera's CEO also identifies Blackstone as both a customer and
              investor, but the retained sources do not disclose Blackstone's deployment, contract value, or current
              customer status. This is credible evidence of use, not a census of active or retained customers.
