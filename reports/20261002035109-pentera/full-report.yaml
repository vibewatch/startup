        - Withhold buy recommendation until audited unit economics, NRR, and Series D liquidation terms are verified.
      - - Valuation Stance
        - fair
        - medium
        - >-
          Headline $1.0B mark reflects a 10.0x multiple on $100M ARR, in line with mature high-growth cybersecurity
          peers.
      - - Risk Rating
        - high
        - medium
        - Elevated operational risk from geographic R&D concentration and undisclosed customer retention dynamics.
      - - Target Return Expectation
        - 1.5x - 2.5x MOIC
        - low
        - Requires scaling ARR toward $200M target and achieving public market multiple expansion above 12x.
      - - Decision Horizon
        - 12 to 18 months
        - medium
        - Monitor pre-IPO filing progress, secondary transaction prints, and channel-driven revenue growth.
    notes: >-
      Composite investment recommendation and risk summary evaluated under fast profile research constraints as of
      October 2026.
