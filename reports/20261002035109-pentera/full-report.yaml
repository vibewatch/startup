  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary Scope, and Attack Validation Paradigms
        blocks:
          - type: paragraph
            body: >-
              The enterprise offensive security and vulnerability assessment market has historically been divided
              between non-exploitative scanning tools and synthetic control simulations. Pentera established the
              Automated Security Validation (ASV) category—formally recognized within Gartner Continuous Threat Exposure
              Management (CTEM) frameworks as Adversarial Exposure Validation (AEV)—to bridge the gap between static
              vulnerability scanning and point-in-time manual penetration testing. ASV technology spans automated
              penetration testing, external attack surface management (EASM), and proactive cloud security validation,
              executing safe-by-design algorithmic attacks in live production environments. This operational boundary
              explicitly includes network infrastructure penetration testing, lateral movement analysis, credential
              exposure assessment, and external perimeter attack surface discovery. Conversely, the core ASV
              architecture excludes application business logic vulnerability testing, deep API authorization analysis
              (such as BOLA/IDOR), manual red teaming for bespoke organizational tradecraft, and non-exploitative static
              configuration audits. By proving actual exploitability across live production networks rather than
              reporting theoretical common vulnerabilities and exposures (CVEs), security validation isolates root-cause
              attack paths from tens of thousands of raw scanner alerts.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
