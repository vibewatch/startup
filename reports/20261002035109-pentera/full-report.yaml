            title: Absence of adverse records is not a clean bill of health
            body: >-
              The assigned pool contains no regulator decision, court docket, independent outage report, or complete
              customer-loss history. Underwriting should treat those as open diligence items, not as evidence that
              Pentera has had no legal, safety, or availability event.
            calloutType: risk
