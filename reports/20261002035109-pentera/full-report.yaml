  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence exposure is operational: Pentera says its platform executes real adversarial
              activity in live production, while a third-party review describes audit logs, throttling, impact limits,
              and emergency-stop controls. Those controls are relevant, but the assigned evidence does not disclose
              incident frequency, customer losses, insurance claims, or control-test results. Financial opacity is the
              other top residual risk. The CEO reports $100 million in ARR, and historical financing evidence confirms
              substantial capital and a $1 billion valuation, yet ARR is not revenue, funding raised is not cash
              available, and no gross margin, burn, runway, or retention data appears in the pool. The heatmap therefore
              ranks consequence and evidence-supported plausibility rather than pretending to estimate empirical
              incident probabilities.
