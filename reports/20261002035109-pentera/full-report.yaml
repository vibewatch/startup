  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis Argument
      - Anti-Thesis Counter-Argument
      - What Would Change The View
    rows:
      - - Product & Market
        - Category creator in Automated Security Validation replacing manual pen-testing with continuous proof.
        - Competitors and BAS vendors are adding validation modules, threatening feature commoditization.
        - Third-party bake-off data proving exploit emulation fidelity and win rates above 70%.
      - - Commercial Traction
        - Scaled rapidly to $100M ARR and 1,100+ enterprise accounts with strong partner channel momentum.
        - Customer expansion efficiency and net revenue retention remain undisclosed by management.
        - Audited cohort data confirming net revenue retention sustained above 115%.
      - - Capital & Valuation
        - Raised $250M total funding from top-tier sponsors including K1, Evolution Equity, and Insight.
        - Series D raised $60M without an announced valuation step-up, indicating post-2021 multiple compression.
        - Secondary market trade execution on Forge or EquityZen establishing a cleared mark above $1.2B.
      - - Exit Readiness
        - Announced IPO aspirations in the US with institutional syndicate backing and corporate scale.
        - IPO timeline delayed from initial 2024 guidance, requiring private bridge rounds to sustain growth.
        - Confidential S-1 draft registration submission or hiring of pre-IPO audit advisors.
    notes: Comparative thesis and anti-thesis synthesis contrasting market opportunities against disclosure gaps.
