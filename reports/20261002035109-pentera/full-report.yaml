      - number: '7.2'
        title: Regulatory, legal, and security boundaries
        blocks:
          - type: paragraph
            body: >-
              Pentera markets its testing as useful for DORA-aligned resilience programs, including ICT testing and
              third-party risk management. A review also reports multiple security and privacy certifications while
              warning that the product supports evidence workflows rather than certifying customer compliance. That
              distinction matters because regulated customers remain responsible for scoping, authorization, incident
              reporting, and compliance conclusions. Publicly described safe-by-design practices mitigate the risk of
              disruptive testing, but they are company assertions rather than an independent loss-history record. No
              regulator, court, formal incident report, or primary certification document was present in the assigned
              pool, so absence of a cited proceeding must not be read as proof that none exists.
