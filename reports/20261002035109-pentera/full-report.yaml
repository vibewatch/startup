  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR accelerates past $200M via M&A and international channel expansion; NRR > 120%.
        - Enterprise Value $2.4B - $2.8B based on 12.0x - 14.0x ARR multiple in public IPO window.
        - Execution stumble in international channels or M&A integration failure.
        - 25% (High execution bar for doubling ARR in competitive CTEM market)
      - - Base Case
        - ARR expands to $130M - $145M (25-30% YoY growth); stable gross margin near 75%.
        - Enterprise Value $1.1B - $1.3B based on 8.5x - 9.5x ARR multiple; modest capital appreciation.
        - Multiple compression across enterprise SaaS; elongated sales cycles for non-mandated pen-testing.
        - 55% (Reflects current growth trajectory and broader cybersecurity spending stabilization)
      - - Bear Case
        - Growth decelerates below 15%; customer churn rises; pricing pressure from BAS and VM vendors.
        - Enterprise Value $500M - $650M based on 5.0x - 6.0x multiple; down-round preference overhang.
        - Core Israeli engineering operations disrupted; loss of channel partner engagement.
        - 20% (Downside risks tied to macro headwinds and platform commoditization)
    notes: Forward-looking scenario projections assuming $100M ARR baseline as of 2025/2026.
    claimRefs:
      - CV001
