callouts:
  - calloutType: insight
    title: Centaur Scale Validates Exposure Prioritization Paradigm
    body: Pentera achievement of $100M ARR proves substantial commercial appetite for agentless, deterministic attack emulation over legacy vulnerability scanners that generate unmanageable alert volumes. Enterprise CISOs increasingly prioritize automated validation that proves actual exploitability before committing remediation resources.
    claimRefs:
      - CO002
      - CO004
      - CO005
  - calloutType: risk
    title: Evolving Attack Surface Demands Broader Application Layer Coverage
    body: While Pentera dominates automated network and infrastructure validation, the acceleration of agile cloud-native development and API-first architectures presents an operational risk. Security teams face architectural gaps if validation platforms cannot seamlessly evaluate rapidly shifting web applications and microservice endpoints.
    claimRefs:
      - CO006
      - CO007
