company:
  name: "Pentera"
chapter:
  number: 6
  title: "Customers"
  summary: "Pentera discloses meaningful but company-controlled customer proof: more than 400 enterprise customers in 2022, more than 1,000 enterprise environments in a 2026 release, and named use cases at Lulu Exchange, Emeria, and Blackstone. A company-issued release also reports a 4.8/5 Gartner Peer Insights rating and 94% willingness to recommend, while NRR, GRR, churn, contract duration, and customer concentration remain undisclosed."
sections:
  - id: "segments-and-buyers"
    title: "Enterprise buyers span direct accounts, regulated verticals, and service providers"
    body: >-
      Pentera's direct sales motion targets CISOs and security leaders and includes
      discovery, demonstrations, and proofs of concept with sales engineers before
      negotiation and closing. Company materials identify finance, manufacturing,
      government, and services teams among users, while a 2022 company release also
      describes opportunity across both enterprise and security-service-provider
      accounts. The available evidence therefore supports segmentation by buyer and
      use case, but not by current account count, geography, revenue band, or annual
      contract value. The 2026 statement that validation spans more than 1,000
      enterprise environments must not be treated as a customer count because one
      account may contain multiple environments. Public evidence also does not
      disclose which party pays when a service provider operates the platform for
      end clients, so channel economics and end-customer duplication remain open.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption indicators are strong, but most proof is vendor-selected"
    body: >-
      Pentera's disclosed adoption markers progress from more than 400 enterprise
      customers in January 2022 to a CEO-reported $100 million ARR milestone in
      2025 and more than 1,000 tested enterprise environments cited in a 2026
      company release. These measures are not interchangeable: customer accounts,
      tested environments, and ARR use different denominators. The same 2026
      syndicated release reports a 4.8 out of 5 Gartner Peer Insights rating and
      94% willingness to recommend over an 18-month consideration period ending
      June 30, 2026. Named official stories describe Lulu Exchange reducing testing
      cycles from months to hours and Emeria gaining actionable risk visibility.
      Pentera's CEO also identifies Blackstone as both a customer and investor, but
      the retained sources do not disclose Blackstone's deployment, contract value,
      or current customer status. This is credible evidence of use, not a census of
      active or retained customers.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "journey-durability-and-friction"
    title: "The journey is visible through evaluation and advocacy; durability is not"
    body: >-
      Public evidence outlines a plausible customer journey from CISO-led discovery
      through sales-engineer-supported proofs of concept, a one-day proof-of-value
      motion, operational validation, remediation, and peer advocacy. Pentera's
      homepage presents claimed outcome cards for cyber-risk reduction, third-party
      pentesting cost reduction, and faster mean time to remediation, but supplies
      no denominators, sample sizes, measurement periods, or independent audit in
      the retained text. Adverse evidence is limited to a competitor-authored
      comparison, which alleges diminishing returns after repeated runs in a fixed
      scope and cumbersome support reported in public reviews. Those assertions are
      useful diligence prompts rather than independent benchmarks. No retained
      source reports NRR, GRR, logo churn, renewal rates, contract length, cohort
      expansion, or top-customer revenue share, preventing a defensible conclusion
      on durability or concentration.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
