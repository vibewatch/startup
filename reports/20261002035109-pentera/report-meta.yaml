  topStrengths:
    - Category-leading adversarial exposure validation platform with company-reported $100M+ ARR.
    - Broad enterprise adoption across named customers and multiple regulated or high-security segments.
    - Strong investor backing and a recognizable private-market valuation mark.
  topRisks:
    - Retention, gross margin, burn, and CAC payback remain undisclosed.
    - Customer concentration, contract length, and renewal durability are still opaque.
    - Secondary pricing and liquidation preference stack remain private, limiting valuation confidence.
