companyProfile:
  summary: >-
    Pentera is a private cybersecurity platform focused on adversarial exposure validation: it emulates attacker
    kill-chains in production-like environments to prove exploitability and prioritize remediation for enterprise
    security teams. The company traces back to Pcysys, was founded in 2015, and now sells through a proof-led direct and
    partner motion into CISOs, regulated verticals, and service providers. Public evidence supports category leadership,
    more than $100M in ARR, more than 1,200 enterprise customers, and a $1.0B private valuation mark, while retention,
    margin, concentration, and secondary pricing remain mostly undisclosed.
