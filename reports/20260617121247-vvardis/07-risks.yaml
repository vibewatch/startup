  - id: regulatory-ip-clinical-scope-risk
    title: Regulatory, IP, and Clinical Scope Risk
    body: >
      Curodont Repair Fluoride Plus is FDA-cleared under Section 510(k) for remineralization and
      early-stage non-cavitated carious lesion management (ICDAS 1–2 white spot lesions) only. This
      regulatory clearance boundary explicitly excludes cavitated lesions, dentin caries, and
      advanced decay—limiting the addressable patient population to the early, visible-but-not-yet-
      cavitated portion of the caries disease spectrum. While the majority of patients presenting in
      hygiene appointments have some degree of early lesion activity, the clinical decision to treat
      versus "watch and wait" involves professional judgment that varies by practitioner, practice
      philosophy, and diagnostic equipment (ICDAS scoring, laser fluorescence, radiographs). Expanded
      indication claims—such as application to interproximal subsurface lesions not yet radiographically
      visible—carry documentation and potential off-label risk that conservative practices may
      avoid. The CE marking from 2012 covers the EU/Switzerland market under similar non-cavitated
      indications; no substantive post-market safety issues have been publicly reported.

      The intellectual property foundation underlying Curodont is the P11-4 self-assembling peptide
      technology originated by Credentis AG (now wholly absorbed into vVardis through the 2020
      acquisition). Publicly available patent records show vVardis AG holds at least one granted
      US patent (US11154470B2, granted October 26, 2021) on dental care formulations incorporating
      P11-4 alongside plant extracts. The foundational P11-4 composition-of-matter patents—whose
      priority dates trace to the mid-2000s Leeds University research—are subject to standard 20-year
      patent term from earliest priority dates, placing some core filings at risk of expiry around
      2025–2027 absent supplementary protection certificates or continuation filings. While vVardis
      likely holds a portfolio of subsequent filings (formulation improvements, application methods,
      combination products) that extend exclusivity beyond any single expiry, the exact scope,
      jurisdictional coverage, and remaining life of the full IP portfolio are not publicly disclosed.
      This creates an unquantifiable but material patent-cliff risk, particularly if third-party
      peptide synthesizers begin validating generic P11-4 manufacturing capabilities after core
      composition-of-matter protection lapses.

      A 2023 JADA-published systematic review and meta-analysis by Keeper et al. confirmed that
      Curodont Repair (CR) likely results in a large increase in caries arrest (RR 1.82, NNT 2.8)
      and likely decreases lesion size by 32%. However, the same systematic review identified that
      two of the six included trials had non-masked assessors and all trials had elevated risk of
      bias. Crucially, no clinical trials of Curodont Repair Fluoride Plus (the current US-marketed
      product containing fluoride) were included—the evidence base is for the prior Curodont Repair
      formulation. A 2025 pediatric dentistry in vitro study (LSU Health Sciences / VCU) found
      Curodont is more cytotoxic to human gingival fibroblasts than fluoride varnish, with
      significant cell survival reductions at 1% concentration and morphological changes at 2%—
      an adverse signal that could generate future regulatory scrutiny or adverse case reporting if
      gingival tissue contact occurs in clinical practice.
