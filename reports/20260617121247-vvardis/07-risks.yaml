  claims:
    - id: CR001
      statement: >
        As of early 2026, more than 55% of US dentists in the ADA Health Policy Institute Q4 2025
        survey cited low insurance reimbursement as the leading practice challenge heading into 2026,
        surpassing staffing shortages for the first time.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR004, SR005]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR001, QR004]

    - id: CR002
      statement: >
        Curodont Repair Fluoride Plus does not have a universally recognized dedicated CDT
        procedure code; practices bill it under generic codes (D9910, D9999, or D4381) with
        reimbursement acceptance varying from partial to outright denial depending on payer and
        clinical framing.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR004, SR005, SR017]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR002, QR003]

    - id: CR003
      statement: >
        Multiple US payers classify Curodont as investigational or experimental for certain
        populations or tooth surfaces, limiting coverage to specific cases such as anterior
        teeth or pediatric patients, while leaving adult posterior lesion treatments unreimbursed.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR005, SR017, SR022]
      confidence: medium
      freshness: current

    - id: CR004
      statement: >
        Approximately 35% of US dental practice owners surveyed by the ADA HPI in Q4 2025
        said they were likely to drop participation in certain insurance networks in 2026,
        a partial indirect tailwind for premium non-covered product adoption but not sufficient
        to resolve the reimbursement gap for Curodont.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR005]
      confidence: medium
      freshness: current

    - id: CR005
      statement: >
        The dentistry.co.uk sponsored article (May 2026) notes that early clinical hesitance
        about Curodont was largely attributable to uncertainty about visible and symptomatic
        benefit for asymptomatic early lesions, creating a patient communication barrier that
        compounds the reimbursement adoption obstacle.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR023]
      confidence: medium
      freshness: current

    - id: CR006
      statement: >
        Retail pricing for Curodont Repair Fluoride Plus in the US is approximately $349.98–$388.87
        per box of 10 single-use applicators ($35–$39 per application), representing a significant
        premium over fluoride varnish (~$2–3 per dose) and SDF (~$0.40–$0.60 per application).
      type: observed
      topic: reimbursement
      sourceRefs: [SR022, SR024]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR031]

    - id: CR007
      statement: >
        Dental Products Hopper (2023) reported a growing trend of insurance companies beginning to
        reimburse for Curodont based on clinical evidence, but as of 2026 no universal or
        standardized CDT code specific to hydroxyapatite regeneration treatments has been formally
        adopted, leaving the reimbursement environment variable and dependent on individual payer
        policy updates.
      type: third-party-reported
      topic: reimbursement
      sourceRefs: [SR022, SR024, SR004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR022]

    - id: CR008
      statement: >
        Curodont Repair Fluoride Plus has received FDA 510(k) clearance for remineralization and
        early non-cavitated carious lesion management (ICDAS 1–2, white spot lesions); the
        clearance explicitly covers non-cavitated enamel lesions only and does not extend to
        cavitated lesions, dentin caries, or advanced decay requiring mechanical restoration.
      type: observed
      topic: regulatory
      sourceRefs: [SR025, SR026, SR029]
      confidence: high
      freshness: historical
      answersQuestionRefs: [QR005]

    - id: CR009
      statement: >
        The foundational P11-4 self-assembling peptide technology was developed at the University
        of Leeds in the mid-2000s; the earliest priority dates for Credentis/vVardis composition-
        of-matter patents tracing to this research likely fall in the 2004–2007 range, implying a
        standard 20-year patent term expiry between 2024 and 2027 absent supplementary protection
        certificates or continuation filings.
      type: inferred
      topic: ip-risk
      sourceRefs: [SR013, SR020]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR006]

    - id: CR010
      statement: >
        Justia Patents records confirm vVardis AG holds at least one granted US patent
        (US11154470B2, granted October 26, 2021, filed July 31, 2020) covering a dental care
        product incorporating P11-4 and plant extracts (Rhododendron, Edelweiss); this patent's
        20-year term extends to approximately 2040, but it covers a consumer formulation
        rather than the core Curodont professional clinical product.
      type: observed
      topic: ip-risk
      sourceRefs: [SR020]
      confidence: medium
      freshness: historical
      answersQuestionRefs: [QR007]

    - id: CR011
      statement: >
        vVardis has not publicly disclosed a complete patent portfolio schedule, remaining patent
        life by jurisdiction, or the specific patents protecting the Curodont Repair Fluoride Plus
        professional formulation, creating an unquantifiable patent-cliff risk for investors and
        diligence counterparties.
      type: inferred
      topic: ip-risk
      sourceRefs: [SR020, SR013]
      confidence: medium
      freshness: current

    - id: CR012
      statement: >
        The 2023 JADA systematic review and meta-analysis by Keeper et al. identified that all six
        included trials of Curodont Repair had elevated risks of bias, two trials had non-masked
        assessors, and no clinical trials of Curodont Repair Fluoride Plus (the current US product)
