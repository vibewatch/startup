callouts:
  - calloutType: risk
    title: Reimbursement Is the Dominant Near-Term Kill Criterion
    body: >
      Without a universally recognized US CDT procedure code and at least one major national
      insurer covering Curodont, the product remains structurally constrained to fee-for-service,
      out-of-pocket, and premium DSO markets. The ADA Q4 2025 survey showed 55%+ of dentists
      cite low insurance reimbursement as their top concern heading into 2026, and 35% plan to
      drop some insurance networks—creating a slow-moving and uneven potential tailwind but no
      guaranteed near-term expansion of covered access. Until reimbursement resolves, the growth
      thesis depends on premium positioning sustaining a $1B+ IPO valuation against modest
      absolute revenues.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004

  - calloutType: risk
    title: IP Patent Cliff Represents the Most Under-Analyzed Structural Risk
    body: >
      The foundational P11-4 composition-of-matter patents derived from mid-2000s Leeds University
      research are approaching or entering their standard 20-year term expiry window (2025–2027).
      vVardis has not publicly disclosed the full scope, remaining life, or jurisdictional coverage
      of its patent portfolio. If core composition patents expire before vVardis completes the IPO
      and establishes brand-based moats, contract manufacturers could enter the market with
      equivalent peptide formulations, potentially eroding Curodont's premium pricing power.
      This risk is not adequately surfaced in vVardis's public-facing communications.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012

  - calloutType: risk
    title: Valuation Premium Requires Exceptional IPO Execution
    body: >
      A $1B+ valuation at estimated sub-$5M revenues implies a revenue multiple (200x–600x+)
      that is defensible only if investors believe in a multi-hundred-million-dollar revenue
      trajectory within 3–5 years—contingent on reimbursement coverage, international expansion,
      and multiple product pipeline approvals. The 2026 medtech IPO market has moved to "Rational
      Exuberance," demanding high gross margins and near-term profitability visibility. Any
      adverse S-1 disclosure—including below-50% gross margins, high burn, or Henry Schein
      dependency clauses—could compress the IPO valuation materially below the April 2026 benchmark.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029

