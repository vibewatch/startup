  - id: named-customer-proof
    title: Named Customer Proof and DSO Relationships
    body: >-
      The strongest evidence of production-grade adoption comes from named DSO endorsements.
      Heartland Dental — the largest US DSO by practice count — provides a direct, on-the-record
      production endorsement from its Senior VP of Clinical Operations, Dr. Timothy Quirt, who
      stated "Curodont represents a transformative step forward in dentistry. At Heartland Dental,
      we've seen firsthand how this innovation empowers clinicians to treat early-stage caries
      non-invasively, improving outcomes and deepening patient trust." Aspen Dental, one of the
      largest US DSO brands, and PDS Health (formerly Pacific Dental Services) are both cited by
      vVardis founders in a Dental Tribune interview as active DSO customers alongside Heartland
      Dental. In the UK, mydentist formalized an industry-leading partnership to deploy Curodont
      Repair across all ~500 practices by 2026, priced from £140 per treatment course, with Chief
      Clinical Officer Nyree Whitley on the record endorsing the product. vVardis's clinical case
      reports PDF from October 2024 provides six documented cases from US dental practices showing
      lesion regression at 6-month follow-up after treatment — including post-orthodontic
      interproximal lesions — with no monetary compensation to the contributing dentists.
      An independent panel of 15 dental professionals evaluated by Dental Products Hopper awarded
      Curodont Repair Fluoride Plus a 4.5/5 rating, with patient acceptance at 60–100% of treated
      patients. Harvard School of Dental Medicine Chair Dr. German O. Gallucci and Temple
      University's Dean of Dentistry Prof. Amid Ismail have publicly endorsed clinical efficacy.
      However, practice-level contract details, purchase volumes, and longer-term retention or
      rebuy rates for any named DSO remain undisclosed by vVardis.
    claimRefs:
