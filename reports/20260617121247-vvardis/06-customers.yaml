  - id: retention-and-workflow
    title: Retention, Repeat Usage, and Practice Workflow Integration
    body: >-
      Published NRR, GRR, cohort retention, or churn data for vVardis are not publicly available;
      the company is pre-IPO and has not disclosed formal account-level retention metrics. Several
      proxy signals suggest durable adoption once a practice integrates Curodont. The product
      integrates into routine hygiene appointments without adding scheduling complexity — clinicians
      apply it in 3–10 minutes, it requires no follow-up appointment, and hygienists can apply it
      independently once certified. This frictionless workflow reduces switching costs and supports
      habitual re-ordering. The Certified Curodontist program and the branded "Curodontist" identity
      create practice-level commitment and community ties. One evaluator practice at Dental Products
      Hopper treated approximately 150 patients over ~5 months, reporting continuing use with
      radiographic evidence of effectiveness at 2 months post-treatment. The Henry Schein CEO
      publicly stated he sees Curodont as a potential "top consumable product," implying meaningful
      repeat order activity. AI diagnostic partnerships — Pearl (May 2025) and VideaHealth (June
      2024) — create detect-then-treat workflow loops that further embed Curodont in practice
      protocols and make switching more disruptive. Heartland Dental's public endorsement also
      implies ongoing institutional commitment at scale. Patient acceptance rates of 60–100% per
      evaluator survey represent pre-treatment intent, not confirmed rebuy or six-month outcome
      data at scale, and the absence of formal NRR or renewal figures is a material gap for
      diligence purposes.
    claimRefs:
      - CU024
      - CU025
      - CU026
