chapter:
  number: 6
  title: Customers
  summary: >-
    vVardis's Curodont Repair Fluoride Plus has achieved exceptional penetration in the US dental
    market — reaching nearly 20% of general dental practices and treating approximately 3 million
    teeth since its January 2024 commercial launch, as of April 2026. The primary customers are
    dental professionals (dentists and hygienists) at independent practices and DSOs, served
    exclusively through Henry Schein across all US segments since January 2026 and through
    mydentist (~500 practices) in the UK. Named DSO customers include Aspen Dental, Heartland
    Dental, and PDS Health, with strong production-grade endorsements; however, published
    retention rates, active practice account counts, reimbursement coverage data, and customer
    concentration figures remain undisclosed, representing material diligence gaps.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation and Buyer-User-Payer Path
    body: >-
      vVardis's direct customer is the dental practice — whether an independent general dentistry
      office, a specialist practice (orthodontics, pediatric dentistry), or a Dental Service
      Organization (DSO). The buyer is the practice or its procurement function; the clinical
      user is the dentist or trained dental hygienist applying Curodont Repair Fluoride Plus
      to the tooth; and the payer is the patient (out-of-pocket) or the patient's dental insurer
      (if covered). In the US market, all purchasing routes through Henry Schein as exclusive
      distributor effective January 1, 2026, covering general dentistry, orthodontics, pediatric
      dentistry, and DSOs. Prior to this expansion, Henry Schein held DSO-only exclusivity from
      September 2024. Henry Schein, the world's largest dental supply company with more than
      1 million customers globally, gives vVardis immediate access to the full practitioner
      universe at scale. In the UK, Henry Schein also holds exclusive distribution rights, while
      mydentist — the UK's largest dental provider with roughly 500 practices and over 4 million
      patients — acts as the primary DSO partner. vVardis's customer base is fundamentally B2B
      (practice-facing), with a secondary B2C layer via the "Find a Curodontist" patient portal
      on vvardis.com that creates consumer pull and partially reduces pure distributor dependency.
      Curodont treats only early-stage (non-cavitated) carious lesions, scoping the addressable
      patient population to approximately 80% of dental patients who present with early decay
      yet leave the office untreated under a traditional watch-and-wait approach.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU007
      - CU039
      - CU046
    tableRefs:
      - TU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Market Penetration
    body: >-
      Curodont's adoption trajectory has been exceptional by dental consumable standards. Launched
      commercially in the US in January 2024, the product reached over 10% of US dental offices
      and 500,000+ patients by the December 2025 Henry Schein all-segment expansion announcement,
      then approximately 12% of offices by the January 2026 J.P. Morgan Healthcare Conference,
      and nearly 20% of US general dental practices as of the April 2026 Apollo investment
      announcement. Total teeth treated in the US crossed 1 million by July 2025 (18 months post
      launch), 2 million by January 2026 (24 months), and approximately 3 million across the US
      and Europe by April 2026. SDM Northcoast proprietary data cited by vVardis confirms it
      ranked first in US growth rate among dental manufacturers with more than $1M in sales
      across the all-merchandise and preventive categories for 2024 vs. 2023 and YTD June 2025.
      These metrics are all company-reported or from a proprietary dataset; the denominator for
      "20% of general dental practices" is internally held data on file with vVardis and has not
      been independently audited. In the UK, mydentist began deploying Curodont Repair across
      an initial 100 practices from late 2025 and across the full ~500-practice network by 2026.
      The pace of adoption is driven by workflow simplicity (3–10 minute application, no
      separate appointment required), strong patient acceptance (60–100% in evaluator surveys),
      and the absence of any competing non-invasive category alternative.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
