callouts:
  - calloutType: strength
    title: "Fastest-Growing Dental Consumable: Rapid DSO Adoption Validates Product-Market Fit"
    body: >-
      vVardis's journey from zero to nearly 20% of US general dental practices in under 2.5 years
      — with named production commitments from Heartland Dental, Aspen Dental, and PDS Health —
      represents exceptional product-market fit for a new-category dental consumable. The SDM
      Northcoast ranking as the #1 growth-rate manufacturer among dental products with more than
      $1M in US sales provides a rare third-party benchmark validating the adoption trajectory.
    claimRefs:
      - CU009
      - CU013
      - CU016
      - CU017

  - calloutType: risk
    title: "Single-Channel Distributor Risk: Henry Schein Dependency in Both Primary Markets"
    body: >-
      Henry Schein holds exclusive US distribution rights across all dental segments (effective
      January 2026) and exclusive UK rights, concentrating vVardis's channel risk in a single
      partner in its two largest markets. While the partnership has delivered strong growth, the
      absence of alternative distribution channels or multi-distributor optionality represents a
      structural vulnerability as the company approaches a potential IPO. Henry Schein's incentive
      to prioritize Curodont over competing products in its catalogue has not been publicly
      quantified.
    claimRefs:
      - CU005
      - CU035
      - CU036

  - calloutType: risk
    title: "Reimbursement Uncertainty Caps Accessible Market and Disproportionately Affects Underserved Patients"
    body: >-
      The absence of a dedicated ADA CDT code for Curodont, combined with insurance company
      tendencies to treat D1354 as equivalent to silver diamine fluoride (SDF) with corresponding
      posterior tooth denials, creates an economic barrier that limits adoption among
      price-sensitive patients and practices outside early-adopter DSOs. Out-of-pocket costs
      when not covered constrain Curodont's stated mission to serve underserved populations,
      including Medicaid-covered children. European markets face further structural reimbursement
      barriers that explain slower geographic penetration outside the US.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU041

