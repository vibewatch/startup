summary:
  headline: >-
    vVardis has created a genuinely novel dental therapeutic category with rapid US institutional
    adoption and unicorn-level backing, but the complete absence of disclosed financials and
    persistent insurance reimbursement gaps support only a research-more stance until an S-1
    filing provides the evidence needed to underwrite the $1B+ private-market valuation.
