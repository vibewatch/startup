companyProfile:
  summary: >-
    vVardis (legal entity: vVARDIS Holding AG) is a Swiss dental medtech company founded in
    August 2019 by dentist-entrepreneur sisters Dr. Haleh (Haley) Abivardi and Dr. Golnar (Goly)
    Abivardi, both University of Zurich-trained dentists headquartered in Zug, Switzerland. The
    company commercializes the Curodont™ platform—built on the P11-4 biomimetic self-assembling
    peptide technology acquired with Credentis AG in 2020—which represents the first and only
    commercially available non-invasive peptide-based treatment for early-stage, non-cavitated
    tooth decay (ICDAS 1–2 lesions). Launched in the US in January 2024 via an exclusive Henry
    Schein distribution agreement, Curodont Repair Fluoride Plus had reached approximately 20%
    of US general dental practices and treated roughly 3 million teeth by April 2026. An April
    2026 strategic minority investment from Apollo Global Management at a $1B+ post-money
    valuation conferred unicorn status; by June 2026 vVardis was exploring a US IPO with
    JPMorgan and Goldman Sachs mandated. Revenue, gross margins, and unit economics remain
    undisclosed, creating a material financial-underwriting gap ahead of the IPO.
