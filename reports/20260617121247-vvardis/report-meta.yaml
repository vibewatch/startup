  productSummary: >-
    Curodont Repair Fluoride Plus (in-office, single-use peptide applicator for non-invasive
    remineralization of early non-cavitated carious lesions, ~3-minute application) and Curodont
    Protect (anti-cavity/anti-sensitivity prophylaxis gel) for dental professionals, plus a
    direct-to-consumer premium oral care line (toothpastes, remineralizing serums, whitening
    products) leveraging the same hydroxyapatite technology.
  customerFocus: >-
    Dental professionals (dentists and hygienists) at independent general dental practices,
    specialist practices (orthodontics, pediatrics), and Dental Service Organizations (DSOs)
    in the US and UK; secondary consumer channel via the "Find a Curodontist" patient portal.
  businessModel: >-
    B2B professional consumable model: dental practices purchase Curodont single-use applicators
    on a replenishment basis through Henry Schein (exclusive US and UK distributor); practices
    charge patients $80–$160 per tooth as an out-of-pocket procedure or insurance claim.
    Secondary DTC oral care revenue from the consumer brand line.
  stage: Late-stage private company (unicorn, pre-IPO)
