      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Curodont is an in-office professional product that requires licensed dental clinician application; it is
              not available over the counter. This means the purchasing decision is made by the dental practice or
              dental professional—the buyer—not the patient. The user is the patient receiving the treatment. The payer
              is typically the dental insurance carrier (covering basic or preventive services) or the patient paying
              out-of-pocket when insurance does not cover the procedure.

              The US dental market in 2026 has approximately 178,000–190,000 practices and approximately 202,000–203,000
              professionally active dentists. Three core buyer segments are relevant to vVARDIS: independent general
              practices (the majority by count), pediatric and orthodontic specialty practices (high whitе-spot lesion
              incidence), and dental service organizations (DSOs). DSOs, which now manage approximately 35% of US dental
              practices in 2026 (up from ~8.8% in 2017), represent a disproportionately important channel because of
              centralized procurement and protocol standardization. Henry Schein's 2024 DSO-exclusivity agreement with
              vVARDIS was expanded to the full US dental market effective January 1, 2026.

              Budget ownership sits with the practice for the product purchase and with the payer or patient for the
              clinical treatment fee. As of 2026, about 27% of US adults—approximately 72 million people—lacked dental
              insurance, representing both a structural coverage gap and a potential underserved market for accessible
              early intervention tools. Insurance non-coverage for non-invasive early caries therapies remains a
              meaningful adoption constraint, particularly in the independent practice segment where out-of-pocket
              pricing sensitivity is highest.
            claimRefs:
              - CM011
              - CM012
              - CM013
