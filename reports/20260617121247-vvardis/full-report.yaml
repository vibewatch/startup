      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Several structural forces are driving the dental caries treatment market above historical baselines.
              First, AI-powered caries detection tools are now achieving up to 98% lesion-detection accuracy, expanding
              the number of lesions identified at early non-cavitated stages that are amenable to non-invasive
              therapy—directly expanding the addressable market for products like Curodont. Second, DSO consolidation
              compresses the sales cycle: a single DSO decision to standardize on Curodont can deploy the product across
              hundreds of affiliated locations, which is why Henry Schein's January 2026 expansion to cover the full US
              dental market matters so significantly to vVARDIS's scaling trajectory. Third, the preventive dental
              treatment segment is among the fastest-growing in the broader dental market, fueled by expanded payer
              coverage of preventive protocols and consumer preference for non-invasive care.

              Constraints are also material. Insurance non-coverage is the leading friction point: CDT codes D1354
              (silver diamine fluoride) and D2990 (resin infiltration) are frequently denied by commercial plans or
              classified as investigational, and Curodont does not yet have a widely adopted dedicated CDT code, forcing
              practices to navigate billing and patient-consent protocols without guaranteed reimbursement.
              Manufacturing and regulatory complexity for peptide-based products adds cost: the P11-4 peptide synthesis
              process is expensive, and the self-assembly is sensitive to pH, temperature, and salivary ion
              conditions—potential barriers to consistent patient outcomes in lower-resourced settings. Additionally,
              approximately 27% of US adults lack dental insurance, concentrating the accessible population in insured
              or high-disposable-income demographics. Switching cost from existing protocols is low in theory
              (single-visit application), but clinical workflow integration and patient education requirements add
              adoption latency in practices with entrenched watchful-waiting culture.
            claimRefs:
