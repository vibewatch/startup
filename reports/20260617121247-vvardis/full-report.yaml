      - number: '2.2'
        title: Market Sizing – TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              Analyst estimates for the global dental caries treatment market differ materially in 2025–2026, reflecting
              divergent scope definitions. Mordor Intelligence sizes the market at USD 7.58 billion in 2025 with a
              conservative 3.12% CAGR to USD 8.83 billion by 2031, focusing on primary treatment product revenues. GII
              Research (SkyQuest) estimates the market at USD 8.9 billion in 2024 and USD 9.39 billion in 2025, growing
              to USD 14.42 billion by 2033 at a 5.5% CAGR, using a broader scope that includes restorative
              sub-categories. A third estimate from Research and Markets places the 2026 market at USD 9.35 billion with
              a 7.4% CAGR toward USD 14.55 billion by 2032. These contradictory estimates are preserved as evidence of
              genuine scope ambiguity in the analyst community.

              North America accounts for approximately 37–38% of global dental caries treatment market revenue, making
              the US the single largest country market. The broader US dental services market—which encompasses
              preventive, restorative, cosmetic, and specialty services—is valued at USD 174.91 billion in 2025 and
              projected to reach USD 185.39 billion in 2026. The dental caries treatment segment is a sub-set of this
              figure. vVARDIS's SAM is narrower still: the US early-stage non-invasive caries treatment category, for
              which no independent analyst carve-out exists. A bottom-up proxy can be constructed from the >178,000 US
              dental practices, each treating patients where up to 80% present early-stage lesions, at an estimated
              single-digit-dollar per-treatment consumable price point.
