      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              vVARDIS was co-founded by Dr. Haleh (Haley) Abivardi and Dr. Golnar (Goly) Abivardi, who serve as co-Chief
              Executive Officers. Both are University of Zurich-trained dentists and serial entrepreneurs with more than
              two decades of dental industry experience. Dr. Haley completed her DMD dissertation in 1998 and Dr. Goly
              in 2001. Before founding vVARDIS, the sisters co-founded Swiss Smile in 2002—Switzerland's first dental
              service organization and Europe's first "fear-free" dental clinic group. The first Swiss Smile clinic
              opened in 2003 at the ShopVille mall in Zurich Hauptbahnhof. Swedish private equity firm EQT AB acquired a
              minority stake in Swiss Smile in 2013; in 2017, Swiss Jacobs Holding acquired a controlling interest from
              EQT and the Abivardis. The founders exited their shareholdings in Swiss Smile and its parent, Colosseum
              Dental, in 2020, freeing them to focus exclusively on vVARDIS.

              In 2007, the Abivardi sisters received the Veuve Clicquot Businesswoman of the Year award for Switzerland.
              Their Swiss Smile background—running clinics, a hygienist school, and global premium oral care
              brands—provides deep domain expertise and an established professional network in dentistry. Following the
              April 2026 Apollo investment, the Abivardi sisters retain an approximately 70% majority shareholding in
              vVARDIS, preserving operational control. The company's governance includes an external board, with key
              executive functions handled by the co-CEOs and a CFO (identity and headcount not publicly disclosed beyond
              search-based data). No material leadership departures were identified during the research window.
