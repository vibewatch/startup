  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reimbursement and Adoption Risk
        blocks:
          - type: paragraph
            body: >
              The most material near-term risk to vVardis's growth trajectory is the absence of reliable US insurance
              reimbursement for Curodont Repair Fluoride Plus. Despite FDA clearance since 2019 and rapid adoption in
              approximately 20% of US general dental practices as of April 2026, the product lacks a dedicated Current
              Dental Terminology (CDT) procedure code universally recognized by US payers. Dental practices currently
              bill Curodont under generic prophylaxis or caries management codes (D9910, D9999, or D4381 variants
              depending on the payer and clinical framing), and reimbursement varies from full coverage at select
              private plans to outright denial at others that classify the treatment as investigational or experimental.
              Several US payers restrict coverage to specific tooth surfaces or patient populations (for example,
              anterior teeth or pediatric patients only), leaving adult posterior lesion treatments unreimbursed.

              The ADA Health Policy Institute's Q4 2025 "Economic Outlook and Emerging Issues in Dentistry" survey found
              that more than 55% of US dentists cited low insurance reimbursement as the leading challenge heading into
              2026—the first time this concern ranked above staffing shortages. ADA data from the same period showed
              reimbursement rates are not keeping pace with inflation and rising practice overhead. For a
              premium-priced, novel consumable like Curodont (retail ~$349–$389 per box of 10 applications),
              reimbursement uncertainty functions as a structural brake on mainstream adoption because: (a) practices
              with predominantly PPO-insured patient panels face pressure to limit non-covered procedures; (b) patient
              out-of-pocket responsibility at $30–$60+ per application creates an affordability barrier in
              price-sensitive markets; and (c) dental hygienists and associates who apply the treatment require time
              allocation that must generate sufficient revenue to justify the workflow. An estimated 35% of dental
              practices surveyed by the ADA in Q4 2025 indicated they are likely to drop participation in certain
              insurance networks in 2026, which may create a partial tailwind for adoption of non-covered premium
              treatments, but this shift is slow and uneven. Without broader payer coverage, Curodont faces a
              structurally bounded addressable market limited primarily to fee-for-service, DSO fee-schedule, and
              self-pay segments.
