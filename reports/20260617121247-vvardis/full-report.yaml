  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Channel Economics
        blocks:
          - type: paragraph
            body: >
              vVARDIS generates revenue through two principal channels: a B2B professional consumables business selling
              Curodont products to dental practices, and a direct-to-consumer (DTC) oral care line. The professional
              channel is by far the primary revenue driver, centred on repeated replenishment purchases of Curodont
              Repair Fluoride Plus by dental practices. As of January 1, 2026, Henry Schein holds exclusive US
              distribution rights across all dental market segments— general dentistry, orthodontics, pediatric
              dentistry, and Dental Service Organizations (DSOs)— having expanded from an initial DSO-only exclusivity
              agreed in September 2024. Henry Schein also serves as exclusive distributor in the United Kingdom and
              holds non-exclusive rights elsewhere internationally. This single-distributor model concentrates US
              revenue through one channel partner, creating channel concentration risk while delivering Henry Schein's
              network of access to more than 1 million dental professional customers globally.

              Curodont Repair Fluoride Plus is priced to dental practices at approximately $349.98 to $388.87 per box of
              10 single-use applicators through US dental supply channels. At the practice level, this translates to a
              wholesale per-application cost of approximately $35–$39. Dental practices typically charge patients
              $80–$160 per tooth treated as an out-of-pocket procedure, given the absence of broad insurance coverage.
              There is no dedicated ADA Current Dental Terminology (CDT) code for Curodont; practices bill using
              existing codes such as D1354 (interim caries-arresting medicament application). Insurance reimbursement
              under these codes is highly variable and inconsistent: some payers classify Curodont as experimental and
              deny coverage entirely, others limit coverage by tooth surface or patient age, and frequency limits from
              SDF-era code interpretations apply. This reimbursement uncertainty creates a meaningful adoption barrier
              affecting the size of the addressable patient population that can be funded through insurance.

              vVARDIS's DTC consumer line—comprising toothpastes, remineralizing serums, and whitening products—provides
              a secondary and currently smaller revenue stream. The DTC brand benefits from halo effects created by
              clinical credibility of the professional Curodont line, but specific DTC revenue contribution is not
              publicly disclosed.
