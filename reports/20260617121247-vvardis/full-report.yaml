              The Apollo investment established a post-money valuation exceeding $1 billion, conferring unicorn status.
              Apollo's specific investment quantum was not disclosed. vVARDIS co-founders Drs. Haley and Goly Abivardi
              retain an approximately 70% majority shareholding post-Apollo, indicating the founder dilution from all
              institutional rounds combined is approximately 30%. Early backers include David Wertheimer (heir to the
