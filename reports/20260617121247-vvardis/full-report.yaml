          - type: callout
            title: DSO Consolidation is a Force-Multiplier for vVARDIS
            body: >
              DSOs now manage approximately 35% of US dental practices in 2026, up from just 8.8% in 2017. When Henry
              Schein secures Curodont adoption within a major DSO, standardized procurement protocols deploy the product
              across potentially hundreds of locations simultaneously. Henry Schein's CEO explicitly cited Curodont as
              having "the potential to be one of our top consumable products," signaling serious commercial commitment.
              The DSO channel is vVARDIS's most capital-efficient scaling lever in the near term.
