      - number: '2.5'
        title: Contradictory Sizing Estimates and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Three categories of evidence ambiguity affect this market analysis. First, analyst sizing estimates for
              the global dental caries treatment market differ by USD 1–2 billion for comparable base years, because
              different analysts draw the boundary differently—some include the full restorative materials category
              (composites, amalgams, endodontic sealers) while others narrow the scope to preventive and
              early-intervention products. This creates a TAM range of approximately USD 7.6 billion (narrow preventive
              scope) to USD 9.4 billion (broad treatment scope) for 2025–2026. Second, no independent analyst carve-out
              exists for the non-invasive peptide-based early caries treatment sub-segment, making SAM and SOM
              estimation for vVARDIS inferential rather than directly sourced. Third, insurance payer acceptance data
              for Curodont specifically is not publicly available—it is unknown what share of commercial plans and
              Medicaid programs in the US will reimburse the procedure as of mid-2026, which is a material gap for
              revenue projection.

              The 2025 randomized controlled trial (RCT) showing Curodont Repair Fluoride Plus achieves significantly
              higher odds of caries arrest than Duraphat fluoride varnish (AOR=6.46) provides robust clinical evidence,
              but clinical efficacy and market adoption are distinct drivers. The clinical evidence base for P11-4
              remineralization now exceeds 230 peer-reviewed publications, including a long-term real-world evidence
              study showing a 90%+ success rate, yet the majority of US dentists are still in early-awareness or trial
              stage rather than routine adoption as of 2026.
