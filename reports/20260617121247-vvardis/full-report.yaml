              impossible. The only proxy for commercial scale are company-asserted claims: approximately 3 million teeth
              treated in the US since the January 2024 launch, presence in approximately 20% of general US dental
              practices as of April 2026, and ranking as the fastest-growing dental manufacturer (by growth rate) in its
