      - number: '8.3'
        title: Comparable Valuation Analysis — Public Dental Medtech Peers
        blocks:
          - type: paragraph
            body: >
              Absent disclosed financial statements, the most tractable anchors are listed comparables in the dental
              equipment and consumables sector. Four US-listed companies offer direct or adjacent read-through: Align
              Technology (ALGN), Dentsply Sirona (XRAY), Envista Holdings (NVST), and Henry Schein (HSIC). The
              Swiss-listed Straumann Holding AG (SAUHY) provides the premium-implant benchmark. These companies span the
              full valuation spectrum: Straumann commands a near-7x EV/Revenue multiple on the back of strong implant
              brand and consistent growth, while distressed Dentsply Sirona trades below 1x revenue after multi-year
              operational deterioration and goodwill impairments.

              Align Technology (ALGN) generated $4.035 billion in FY2025 revenue with 67.2% gross margin and a market
              cap of approximately $13 billion, implying roughly 3.2–3.3x EV/Revenue. ALGN's P/E of ~30x and forward P/E
              of ~14.7x signals the market expects significant earnings recovery. Dentsply Sirona (XRAY) posted $3.68
              billion in FY2025 revenue but an operating loss of $422 million, resulting in a beaten-down market cap of
              ~$3.1 billion (P/S ~0.84x) — illustrating how dental equipment companies can collapse in multiple when
              profitability falters. Envista Holdings (NVST) achieved $2.72 billion in FY2025 revenue with 8.3% growth
              and a recovering margin profile. Henry Schein (HSIC), the exclusive US distributor for Curodont, carries a
              market cap of approximately $9.3 billion on ~$12.7 billion in revenue.

              Applying the comparable multiples to an implied vVardis revenue range illustrates the opacity problem: if
              vVardis revenue is near $50 million, the $1B+ Apollo mark implies a 20x EV/Revenue — a heroic multiple
              justified only by elite growth rates. At $150 million in estimated revenue, the implied multiple of ~6.7x
              aligns with the Straumann premium. At $300 million, a 3.3x ALGN-comparable multiple applies. None of these
              revenue estimates can be confirmed without disclosure.
