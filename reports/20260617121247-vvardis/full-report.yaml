      - number: '6.1'
        title: Customer Base Segmentation and Buyer-User-Payer Path
        blocks:
          - type: paragraph
            body: >-
              vVardis's direct customer is the dental practice — whether an independent general dentistry office, a
              specialist practice (orthodontics, pediatric dentistry), or a Dental Service Organization (DSO). The buyer
              is the practice or its procurement function; the clinical user is the dentist or trained dental hygienist
              applying Curodont Repair Fluoride Plus to the tooth; and the payer is the patient (out-of-pocket) or the
              patient's dental insurer (if covered). In the US market, all purchasing routes through Henry Schein as
              exclusive distributor effective January 1, 2026, covering general dentistry, orthodontics, pediatric
              dentistry, and DSOs. Prior to this expansion, Henry Schein held DSO-only exclusivity from September 2024.
              Henry Schein, the world's largest dental supply company with more than 1 million customers globally, gives
              vVardis immediate access to the full practitioner universe at scale. In the UK, Henry Schein also holds
              exclusive distribution rights, while mydentist — the UK's largest dental provider with roughly 500
              practices and over 4 million patients — acts as the primary DSO partner. vVardis's customer base is
              fundamentally B2B (practice-facing), with a secondary B2C layer via the "Find a Curodontist" patient
              portal on vvardis.com that creates consumer pull and partially reduces pure distributor dependency.
              Curodont treats only early-stage (non-cavitated) carious lesions, scoping the addressable patient
              population to approximately 80% of dental patients who present with early decay yet leave the office
              untreated under a traditional watch-and-wait approach.
