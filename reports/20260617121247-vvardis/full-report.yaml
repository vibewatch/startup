      - number: '3.4'
        title: Distribution Moats, Lock-In, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >
              vVardis's single most durable near-term competitive moat is Henry Schein's exclusive US distribution of
              Curodont across all dental segments—general dentistry, orthodontics, and pediatrics—effective January 1,
              2026. Henry Schein's national sales infrastructure reaches every US dental practice through its dominant
              distribution position; no competitor for early-stage in-office caries treatment has equivalent access to
              the same channel for a comparable product. Before full market expansion, vVardis reported Curodont as
              present in approximately 20% of US general dental practices, with more than three million teeth treated
              globally since market introduction. In its growth-rate category, Curodont ranked first among dental
              manufacturers with more than $1 million in annual sales for 2024 versus 2023 and year-to-date 2025 per SDM
              Northcoast data.


              This distribution moat has nuances: Henry Schein simultaneously distributes competing fluoride varnish
              brands such as NUPRO and Clinpro, so exclusivity is product-specific rather than category-wide.
              Multi-homing is common at the practice level—Curodont for ICDAS 1-2 lesion management and fluoride varnish
              for routine preventive application at the same visit are typically complementary rather than mutually
              exclusive, which moderates head-to-head substitution pressure in the near term. Switching from fluoride
              varnish to Curodont requires hygienist workflow adaptation, CDT code adoption, patient education, and
              price-premium acceptance; these behavioral transition costs create friction for initial adoption but do
              not sustain lock-in after a practice has adopted the protocol.


              P11-4 patent exclusivity via Credent creates a technological barrier against direct replication; no other
              commercially available self-assembling peptide for in-office early caries treatment exists as of June
              2026. Solventum (formerly 3M) rebranded its dental division from 3M to Solventum in 2024 but retained the
              Clinpro product line, indicating no structural change in the competitive set. The combination of exclusive
              distribution, patent protection, 250-plus scientific publications, WHO guideline alignment for
              non-invasive dentistry, and a single-visit no-staining protocol provides a defense-in-depth competitive
              position that incumbent fluoride varnish manufacturers cannot quickly replicate.
