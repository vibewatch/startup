      - number: '1.4'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >
              vVARDIS has raised approximately $85 million in institutional financing before its April 2026 milestone
              round. In February 2025, OrbiMed—a leading New York-based healthcare investment firm with approximately
              $17 billion in AUM—closed a $35 million growth financing round. In July 2025, OrbiMed closed a follow-on
              $50 million round, bringing total OrbiMed commitment to $85 million and supporting US commercial
              expansion. William Blair & Company served as exclusive financial advisor to vVARDIS for the OrbiMed
              rounds.

              On April 27, 2026, vVARDIS announced a strategic minority investment from Apollo-managed funds, valuing
              the company at over $1 billion and conferring unicorn status—making it one of Europe's few privately owned
              billion-dollar-plus healthcare companies. The financial terms of the transaction were not disclosed. Among
              earlier backers: David Wertheimer (heir to the Chanel fortune, head of 1686 Partners) and Duxebridge
              Capital (a European multi-family office serving as adviser to the founders). Apollo partners Jeremy Honeth
              (Partner) and Andrea Vanni (Managing Director) led the investment thesis. As of June 2026, vVARDIS is
              exploring a US IPO with JPMorgan Chase and Goldman Sachs mandated as advisors; the company was valued at
              more than $1 billion at the April 2026 round and will likely seek a higher valuation in an IPO. No final
              IPO decision has been made and timing remains subject to change.
