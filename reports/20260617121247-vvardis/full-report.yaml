      - number: '8.5'
        title: Exit Readiness, Recommendation, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              vVardis shows several markers of IPO readiness: banker selection (JPMorgan, Goldman Sachs), a named CFO
              (Thomas Rondot, per OrbiMed press release) who manages investor relations, a freshly set unicorn
              valuation, and founders with a demonstrated exit track record from Swiss Smile. The company is targeting
              the US market for its IPO — likely an F-1 or S-1 registration — which will require full IFRS or US GAAP
              audited financials, cap-table disclosure, and risk factor elaboration. The 2026 IPO window follows a
              broadly supportive healthcare capital markets environment, with multiple medtech deals pricing in H1 2026.

              The primary diligence asks before forming a conviction buy recommendation are: (1) disclosure of audited
              revenue and gross margin for FY2025 and FY2024 to compute actual multiples; (2) cap-table detail including
              Apollo deal structure (equity vs. debt-equity hybrid, preference stack, liquidation preferences); (3)
              reorder rate and retention data from dental practices beyond the headline 20% penetration figure; (4) ADA
              code D1354 reimbursement rate trends; and (5) EBITDA or operating cash flow to understand the burn rate
              and the capital need the IPO is designed to satisfy. Until those disclosures are available through an S-1
              filing, the appropriate posture is to monitor and prepare due diligence capacity, not to deploy capital at
              the $1B+ private mark.
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV019
              - CV020
              - CV043
              - CV049
          - type: table
            tableRef: TV006
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV013
              - CV021
              - CV043
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Research More — Await S-1 for Financial Validation'
            body: >
              vVardis has assembled the markers of a compelling dental medtech growth story: Apollo and OrbiMed backing,
              JPMorgan/Goldman IPO mandate, 20% US dental penetration within two years, and a proprietary peptide
              platform with 250+ clinical publications. However, the $1B+ private valuation is entirely unverifiable
              without disclosed financials. The implied EV/Revenue multiple is estimated at 5–20x depending on the
              (undisclosed) revenue base — a span so wide that it precludes confident positive conviction. The
              recommendation is to monitor the IPO process, prepare financial due diligence capacity for the S-1 filing,
              and withhold capital commitment until audited revenue, gross margin, and deal terms are public.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV042
              - CV043
              - CV047
          - type: callout
            title: 'Adverse Precedent: SmileDirectClub and the Dental-Tech IPO Graveyard'
            body: >
              SmileDirectClub (SDC) IPO'd in 2019 at a multi-billion-dollar valuation on compelling growth metrics and a
              novel dental-tech model, only to file for bankruptcy in 2023 — just four years later. Its assets were
              subsequently acquired by SmileSet. This is not an analogical argument that vVardis will fail, but it is a
              direct benchmark for how rapidly dental-tech growth stories can decompensate when unit economics and
              reimbursement fail to compound at the pace the valuation implies. The absence of vVardis financial
              disclosure makes it impossible to rule out a similar execution mismatch. IPO investors should demand full
              financial diligence before committing capital.
            calloutType: risk
            claimRefs:
              - CV047
              - CV048
          - type: callout
            title: 'The ''Strategic Minority'' Signal: Apollo''s Positioning Matters'
            body: >
              Apollo's characterization of its investment as a "strategic minority" stake — and the explicit
              confirmation that founders retain a substantial majority — is a material signal for IPO structuring. This
              suggests the Apollo deal did not significantly dilute the founders, preserving founder-control voting
              ahead of an IPO. However, it also means the Apollo term structure is opaque: strategic minority investors
              in private rounds frequently negotiate downside protections (liquidation preferences, information rights,
              anti-dilution) that can affect the economics available to public-market investors. These terms will only
              be disclosed in the S-1.
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV046
