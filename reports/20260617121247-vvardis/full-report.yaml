      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 80% Patient Prevalence Creates an Enormous Untapped Opportunity
            body: >
              Up to 80% of dental patients present with early-stage cavities at any given visit, yet the majority
              historically left the dental office without treatment. This is not a niche clinical gap—it is the dominant
              patient population. With Henry Schein's full US market exclusivity beginning January 1, 2026, vVARDIS now
              has distribution access to the channel needed to convert this clinical opportunity into commercial revenue
              across all practice types.
            calloutType: strength
            claimRefs:
              - CM014
              - CM015
              - CM016
          - type: callout
            title: Insurance Reimbursement Uncertainty is a Material Adoption Constraint
            body: >
              As of 2026, insurance reimbursement for non-invasive early caries treatments is inconsistent across US
              commercial payers. CDT codes for these procedures are frequently denied or classified as investigational,
              and Curodont lacks a universally accepted billing code. This creates friction at the practice level:
              dentists who cannot confidently bill for the procedure face a revenue model mismatch. The ~72 million US
              adults without dental insurance compound this risk by shrinking the reimbursable patient pool.
            calloutType: risk
            claimRefs:
              - CM025
