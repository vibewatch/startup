      - number: '4.3'
        title: Cost Structure, Gross Margin, and Financial Opacity
        blocks:
          - type: paragraph
            body: >
              vVARDIS has not publicly disclosed its cost structure, gross margin, EBITDA, operating expenses, or any
              equivalent financial metrics as of June 2026. As a private Swiss company that has not filed with the SEC,
              there is no public registration statement or annual report from which financial performance can be
              derived. The company's disclosures are limited to commercially framed press releases and adoption metrics
              (teeth treated, dental practice penetration).

              Third-party revenue intelligence providers estimate vVARDIS annual revenue at approximately $1.7 million.
              This figure, if accurate, would imply a price-to-revenue multiple exceeding 600x at the April 2026 $1
              billion-plus valuation—an extreme multiple even by the standards of pre-revenue biotech or high-growth
              SaaS companies. Such a multiple can only be reconciled with a $1 billion valuation through a thesis
              centred on future revenue from a very large addressable market ($30 billion+ in the US alone for
              early-stage caries treatment), rather than current financial performance. vVARDIS's
              fastest-growing-manufacturer-in-category status (SDM Northcoast data) suggests the $1.7 million figure is
              likely to be dated or significantly understated given the aggressive 2025–2026 commercial build-out, but
              without disclosed financials, no precise figure can be confirmed.

              The manufacture of Curodont is a pharmaceutical-grade production process (peptide synthesis and
              formulation) based in Europe, with supply chain complexity that likely implies meaningful COGS relative to
              peer dental consumables. No COGS or gross margin figure has been publicly shared. General dental
              pharmaceutical consumables typically carry manufacturer gross margins of 50–75%. vVARDIS's specific gross
              margin depends critically on the scale of peptide manufacturing, which is not disclosed. Working capital
              requirements are driven by practice inventory and Henry Schein's distribution cycle; no working capital or
              capex disclosures exist.
