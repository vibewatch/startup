            body: >
              Without a universally recognized US CDT procedure code and at least one major national insurer covering
              Curodont, the product remains structurally constrained to fee-for-service, out-of-pocket, and premium DSO
              markets. The ADA Q4 2025 survey showed 55%+ of dentists cite low insurance reimbursement as their top
              concern heading into 2026, and 35% plan to drop some insurance networks—creating a slow-moving and uneven
              potential tailwind but no guaranteed near-term expansion of covered access. Until reimbursement resolves,
