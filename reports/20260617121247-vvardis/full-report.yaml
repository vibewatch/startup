  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              The dental caries treatment market spans products and procedures used to diagnose, prevent, arrest, or
              restore teeth damaged by tooth decay, the world's most prevalent non-communicable disease. For analytical
              purposes, this market can be divided into three treatment categories: (1) preventive products—fluoride
              varnishes, sealants, and antimicrobial agents applied before cavitation occurs; (2) early non-invasive
              interventions—biomimetic remineralization agents, silver diamine fluoride (SDF), and resin infiltration
              that treat non-cavitated or early-cavitated lesions without drilling; and (3) restorative and endodontic
              procedures—fillings, crowns, root canals, and extractions that address advanced or cavitated disease.
              Restorative materials lead the overall market by revenue, at approximately 38% of global spend, while the
              non-invasive early-intervention category that vVARDIS targets remains a nascent but fast-growing
              sub-segment.

              The included spend in vVARDIS's addressable market is in-office professional treatment products for early
              caries lesions applied by a licensed dental clinician; excluded spend includes over-the-counter consumer
              oral care, orthodontic appliances, cosmetic procedures, and advanced restorative work. Key adjacencies
              include diagnostic imaging (AI-assisted caries detection) and preventive prophylaxis. The status-quo
              substitute for most patients is watchful waiting—monitoring the lesion without active treatment—a common
              practice that vVARDIS's Curodont is explicitly designed to displace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM023
              - CM024
              - CM042
