      - number: '5.5'
        title: Technology Limitations, Risks, and Strategic Roadmap
        blocks:
          - type: paragraph
            body: >-
              Despite strong clinical differentiation, Curodont has well-defined scope limitations. The product is
              indicated only for non-cavitated, early-stage enamel caries; once a lesion has cavitated (dentin exposed),
              Curodont is not effective and conventional drilling and restoration remain mandatory. The mechanism
              depends on adequate salivary calcium and phosphate levels; patients with severe xerostomia may require
              adjunctive mineral supplementation for full benefit. The application protocol requires a sodium
              hypochlorite conditioning step before peptide diffusion, adding preparation steps and an incremental
              training requirement relative to simpler alternatives such as silver diamine fluoride (SDF) or fluoride
              varnish. A "Curodontist" professional certification program via e-learning exists, but application quality
              is clinician-dependent and training is not state-mandated in the US. At the commercial level, exclusive
              single-distributor reliance on Henry Schein for all US sales is the dominant structural risk. On the
              technology platform side, vVARDIS has no public GitHub presence, no developer API, and its competitive
              advantage resides in biomedical innovation—proprietary peptide chemistry, regulatory clearances, and 25+
              years of clinical evidence—not software. A GitHub search in June 2026 returned only five results for
              "vvardis" or "curodont," none of which represent company-sponsored technical development. Looking ahead,
              vVARDIS was reported in June 2026 to be exploring a US IPO with JPMorgan Chase and Goldman Sachs mandated
              as underwriters, which would provide capital for new market entry (Middle East, additional European
              markets), R&D, and marketing expansion. The company has entered the Middle East and is reportedly
              expanding rapidly there as of April 2026.
