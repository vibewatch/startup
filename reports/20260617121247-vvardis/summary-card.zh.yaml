summary:
  headline: vVardis 确实开出了新的牙科治疗品类，美国机构端采用很快，独角兽级资本也已入场；但财务完全未披露、保险报销缺口仍在， 只有等 S-1 给出足够证据后，才足以承销 $1B+ 私募估值，因此现阶段只能继续研究。
