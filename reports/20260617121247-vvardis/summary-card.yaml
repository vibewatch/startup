  topStrengths:
    - >-
      First-to-market non-invasive peptide dental treatment with 250+ peer-reviewed publications and a documented
      clinical success rate above 90% for early non-cavitated carious lesions, providing durable scientific
      differentiation.
    - >-
      Exceptional US commercial adoption: ~20% of US general dental practices reached and ~3 million teeth treated
      within approximately two years of the January 2024 US launch, ranking as the fastest-growing dental manufacturer
      in its category per SDM Northcoast data.
    - >-
      Tier-1 institutional backing from Apollo Global Management ($1B+ valuation, April 2026) and OrbiMed ($85M across
      two 2025 tranches), with JPMorgan and Goldman Sachs mandated for a potential 2026 US IPO.
    - >-
      Exclusive US distribution through Henry Schein—the dominant dental supply company with 1M+ professional customers
      globally—providing immediate full-market coverage across general dentistry, orthodontics, pediatrics, and DSOs
      since January 2026.
    - >-
      Co-founders (Abivardi sisters) bring >20 years of dental industry operating experience, demonstrated exit track
      record (Swiss Smile to EQT/Jacobs Holding), and retained ~70% majority shareholder control post-Apollo.
  topRisks:
    - >-
      No public financial disclosure (revenue, gross margin, burn rate, cash) makes valuation verification impossible;
      third-party revenue estimates imply extreme multiples against the $1B+ mark, and dental-tech IPOs have a poor
      track record (SmileDirectClub bankruptcy 2023).
    - >-
      US insurance reimbursement for Curodont remains inconsistent, with no dedicated ADA CDT code universally
      recognized by payers, creating a structural adoption ceiling for price-sensitive practices and patients.
    - >-
      Single-channel US revenue dependency on Henry Schein with undisclosed distribution agreement terms (duration,
      minimums, termination), while Henry Schein simultaneously carries competing fluoride-varnish brands.
    - >-
      Core P11-4 peptide composition-of-matter patents tracing to mid-2000s Leeds University research face potential
      expiry around 2025–2027, with the full supplementary-protection and continuation portfolio not publicly disclosed.
    - >-
      IPO execution risk: S-1 disclosure will expose revenue, margins, Henry Schein terms, and patent-cliff details for
      the first time, and any adverse revelation could trigger material valuation compression in a public market
      demanding 60–80% gross margins and a clear profitability path.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, operating cash flow, burn rate, and cash position for FY2024 and FY2025—the
      foundational inputs for any financial underwrite of the $1B+ mark.
    - >-
      Apollo deal structure (equity vs. structured instrument, preference stack, liquidation waterfall, ratchets) and
      the total capital raised to date including the Apollo quantum.
    - >-
      Henry Schein distribution agreement terms: duration, minimum purchase commitments, exclusivity scope, renewal
      mechanics, and termination provisions.
    - >-
      Practice-level retention and reorder rates, active account count, and revenue-per-practice data beyond the
      headline ~20% penetration figure.
    - >-
      Full IP portfolio scope, remaining patent life across jurisdictions, and status of supplementary protection
      certificates for the core P11-4 technology.
