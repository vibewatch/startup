  - id: funding-history-cap-structure
    title: "Funding History, Cap-Table Signals, and Financial Opacity"
    body: >
      Before Apollo, vVardis's principal institutional capital came from OrbiMed, a healthcare
      specialist fund with approximately $17 billion in AUM. OrbiMed invested $35 million in a
      Series B in February 2025 and a follow-on $50 million in July 2025, totalling $85 million
      across the two tranches. William Blair & Company served as exclusive financial advisor for
      vVardis in the OrbiMed process. Prior to OrbiMed, earlier backers included David Wertheimer
      — heir to the Chanel fortune — through 1686 Partners, and Duxebridge Capital, a European
      multi-family office. InforCapital's private-market ledger records three disclosed rounds;
      the Apollo round amount is listed as "undisclosed" with only the $1B valuation floor as
      publicly confirmed.

      The Abivardi sisters have an established exit track record: their prior company Swiss Smile
      was backed by EQT AB and eventually sold to Jacobs Holding in 2017. vVardis does not
      publicly disclose revenue, EBITDA, gross margin, cash burn, or customer economics, making
      independent multiple-based valuation verification impossible. The only proxy for commercial
      scale are company-asserted claims: approximately 3 million teeth treated in the US since
      the January 2024 launch, presence in approximately 20% of general US dental practices as
      of April 2026, and ranking as the fastest-growing dental manufacturer (by growth rate) in
      its category per SDM Northcoast data for 2024 vs. 2023 and YTD June 2025.
