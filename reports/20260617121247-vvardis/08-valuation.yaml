  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial opacity
      missingEvidence: >
        Audited annual revenue, gross margin, EBITDA, and free cash flow for FY2024 and FY2025 from vVardis.
        These are necessary to compute actual EV/Revenue multiples and to validate the $1B+ Apollo mark.
      whyItMatters: >
        Without audited financials, the valuation multiple implied by the Apollo deal spans from ~5x
        (if revenue is ~$200M) to >20x (if revenue is ~$50M) — an unacceptably wide range for investment
        conviction. The multiple is the primary variable in the buy/avoid decision.
      diligencePath: >
        Await the S-1 or F-1 registration statement with the SEC, which will contain IFRS or US GAAP
        audited financials. Alternatively, request a management-level data room as a pre-IPO institutional
        investor through the JPMorgan or Goldman Sachs banker process.
      relatedQuestionRefs: [QV002, QV027]

    - type: private-evidence-only
      severity: material
      topic: Apollo investment structure
      missingEvidence: >
        Deal terms for the Apollo strategic minority investment: equity stake percentage, deal amount,
        liquidation preference stack, anti-dilution provisions, and board representation rights.
      whyItMatters: >
        Apollo deal structure could include downside protections (liquidation preferences, ratchets)
        that make the $1B+ nominal valuation misleading for public investors who will rank below Apollo
        in the capital structure.
      diligencePath: >
        Review S-1 cap table and investor rights sections. Engage independent counsel to review term sheet
        if accessible through pre-IPO investor process.
      relatedQuestionRefs: [QV015, QV029]

    - type: private-evidence-only
      severity: material
      topic: practice retention and utilization
      missingEvidence: >
        Reorder rate and practice-level utilization depth beyond the headline 20% penetration figure.
        Cohort analysis showing whether practices that adopted Curodont continue to reorder at scale.
      whyItMatters: >
        20% penetration is a compelling headline metric, but without reorder rate or revenue per practice,
        it is impossible to assess whether adoption is converting into durable recurring revenue or
        represents one-time trial orders.
      diligencePath: >
        Request cohort analysis from management or investor relations (Thomas Rondot, CFO). Look for
        cohort data in S-1 risk factors or business section.
      relatedQuestionRefs: [QV016]

    - type: private-evidence-only
      severity: minor
