chapter:
  number: 8
  title: Valuation
  summary: >
    Apollo invested in vVardis at a $1B+ valuation in April 2026, and the company is preparing a US
    IPO with JPMorgan and Goldman Sachs at a likely higher mark — yet no revenue, EBITDA, or cap-table
    detail has been publicly disclosed. Public dental medtech peers trade at 0.8x–7x EV/Revenue
    depending on growth and profitability, placing vVardis's implied multiple in an unverifiable range
    absent audited financials; the most plausible base scenario is a "research more" stance until an
    S-1 or equivalent discloses the financial foundation.

sections:
  - id: apollo-valuation-context
    title: "Apollo Investment, Unicorn Status, and IPO Trajectory"
    body: >
      In April 2026 vVardis became one of Europe's rare billion-dollar-plus private healthcare
      companies when Apollo-managed funds made a strategic minority investment that valued the
      company at "more than $1 billion." The financial terms of the transaction were not disclosed
      by either party. Founders Drs. Haley and Goly Abivardi retained approximately a 70% majority
      shareholding following the deal, preserving founder-control governance typical of growth-stage
      medtech companies seeking an eventual public offering. Apollo — one of the world's largest
      alternative asset managers with approximately $938 billion in AUM as of December 31, 2025 —
      described the deal as a "strategic" investment supporting Curodont's continued global expansion
      in the US and Europe.

      Less than six weeks later, Bloomberg reported on June 1, 2026 that vVardis is working with
      JPMorgan Chase and Goldman Sachs on a US IPO that could come in 2026. According to sources
      familiar with the matter, the company will likely seek a higher valuation at IPO than the
      $1B+ Apollo mark. Representatives for vVardis, JPMorgan, and Goldman Sachs declined to
      comment. No S-1 or F-1 has been filed with the SEC as of the June 17, 2026 run date, meaning
      all valuation signals remain from private-market transactions and third-party reports. The
      speed from Apollo close to reported IPO banker selection — roughly seven weeks — is unusual
      and may reflect either extraordinary investor demand or founders capitalizing on momentum.
