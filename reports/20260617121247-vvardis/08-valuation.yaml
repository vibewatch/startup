  - id: exit-readiness-diligence-asks
    title: "Exit Readiness, Recommendation, and Final Diligence Asks"
    body: >
      vVardis shows several markers of IPO readiness: banker selection (JPMorgan, Goldman Sachs),
      a named CFO (Thomas Rondot, per OrbiMed press release) who manages investor relations, a
      freshly set unicorn valuation, and founders with a demonstrated exit track record from
      Swiss Smile. The company is targeting the US market for its IPO — likely an F-1 or S-1
      registration — which will require full IFRS or US GAAP audited financials, cap-table
      disclosure, and risk factor elaboration. The 2026 IPO window follows a broadly supportive
      healthcare capital markets environment, with multiple medtech deals pricing in H1 2026.

      The primary diligence asks before forming a conviction buy recommendation are: (1)
      disclosure of audited revenue and gross margin for FY2025 and FY2024 to compute actual
      multiples; (2) cap-table detail including Apollo deal structure (equity vs. debt-equity
      hybrid, preference stack, liquidation preferences); (3) reorder rate and retention data
      from dental practices beyond the headline 20% penetration figure; (4) ADA code D1354
      reimbursement rate trends; and (5) EBITDA or operating cash flow to understand the burn
      rate and the capital need the IPO is designed to satisfy. Until those disclosures are
      available through an S-1 filing, the appropriate posture is to monitor and prepare due
      diligence capacity, not to deploy capital at the $1B+ private mark.
