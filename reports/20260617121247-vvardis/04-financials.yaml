  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "revenue"
      missingEvidence: "Audited annual revenue, ARR, and gross margin figures for vVARDIS for fiscal years 2024 and 2025."
      whyItMatters: "Without revenue and margin data, the $1 billion-plus valuation cannot be benchmarked, and the business's path to profitability is entirely opaque to external underwriters."
      diligencePath: "Request audited financial statements from vVARDIS management; alternatively, await the S-1 IPO filing with the SEC which will require disclosure of at least three years of audited financials."
      relatedQuestionRefs: [QI003, QI004]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: blocking
      topic: "capital-adequacy"
      missingEvidence: "Monthly cash burn rate, cash on hand, and confirmed runway for vVARDIS as of Q2 2026."
      whyItMatters: "Without burn and runway data, the urgency of the IPO and the risk of a dilutive bridge round cannot be assessed."
      diligencePath: "Request CFO-level cash management data; examine the IPO S-1 risk factors section when filed for going concern or liquidity language."
      relatedQuestionRefs: [QI010, QI016]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: material
      topic: "channel-distribution"
      missingEvidence: "Henry Schein distributor margin, minimum purchase commitments, and net revenue per unit to vVARDIS under the exclusive distribution agreement."
      whyItMatters: "The distributor margin directly determines vVARDIS's actual net revenue per product unit. If the margin is 30%+, effective vVARDIS revenue per application could be well below $30, further compressing revenue potential."
      diligencePath: "Obtain the exclusivity agreement between vVARDIS and Henry Schein; request vVARDIS net revenue disclosure in due diligence."
      relatedQuestionRefs: [QI012]

    - type: private-evidence-only
      severity: material
      topic: "capital-structure"
      missingEvidence: "The specific quantum of the Apollo investment and the resulting fully diluted cap table post-April 2026."
