  - id: capital-adequacy-and-financing
    title: Capital Adequacy, Financing History, and IPO Trajectory
    body: >
      vVARDIS has raised a total of $85 million through two OrbiMed rounds in 2025—an initial
      $35 million in February and a follow-on $50 million in July—plus an undisclosed amount from
      Apollo Global Management in April 2026. The stated use of the $85 million OrbiMed proceeds
      was "to refinance existing facilities and support the company's growth initiatives and
      continued global commercial expansion," which explicitly confirms the existence of prior
      debt obligations being retired. No breakdown of the amount used for refinancing versus
      growth investment has been disclosed.

      The Apollo investment established a post-money valuation exceeding $1 billion, conferring
      unicorn status. Apollo's specific investment quantum was not disclosed. vVARDIS co-founders
      Drs. Haley and Goly Abivardi retain an approximately 70% majority shareholding post-Apollo,
      indicating the founder dilution from all institutional rounds combined is approximately 30%.
      Early backers include David Wertheimer (heir to the Chanel fortune, via 1686 Partners) and
      Duxebridge Capital (European multi-family office advising the founders).

      By June 2026, vVARDIS was exploring a US IPO, having engaged JPMorgan Chase and Goldman
      Sachs as advisors. Bloomberg reported in early June 2026 that the IPO could occur within
      the year at a valuation higher than the April 2026 $1 billion threshold. No final IPO
      decision has been made; timing is subject to market conditions. The IPO preparation began
      approximately two months after the Apollo investment, coinciding with the maturation of
      Curodont commercialization data and a period of heightened investor interest following
      JPMorgan CEO Jamie Dimon's endorsement at the bank's 2025 San Francisco healthcare
      conference.

      Monthly cash burn rate and runway are not publicly disclosed. Given total institutional
      capital raised of at least $85 million across 2025 and the undisclosed Apollo amount, the
      company has at least several quarters of operational runway assuming the burn rate is
      consistent with a commercial-stage medtech company of 54–144 employees. The CFO is Thomas
      Rondot, who handles investor relations. William Blair & Company served as financial advisor
      on the OrbiMed rounds; McGuireWoods LLP and Rüd Winkler Partner AG served as legal counsel.
