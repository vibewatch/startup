  - id: unit-economics-and-channel
    title: Unit Economics and Practice-Level Channel Dynamics
    body: >
      At the practice level, Curodont presents an attractive unit economics profile for dental
      professionals. With a wholesale cost of approximately $35–$39 per application and typical
      patient charges of $80–$160 per tooth treated, gross margin per application at the practice
      level is estimated at 50–80%. A practice applying Curodont to 50 teeth per month could
      generate approximately $4,000–$8,000 in additional monthly revenue, predominantly as a
      cash-pay or supplemental insurance claim, without requiring major capital investment or
      extended chair time—applications take under 10 minutes, typically delegated to hygienists.

      vVARDIS ranked first in growth rate among dental manufacturers with more than $1 million in
      sales in both the all-merchandise and preventive categories in the US for the 2024 vs. 2023
      and YTD June 2025 periods, according to independent distributor data from SDM Northcoast LLC.
      As of April 2026, approximately 3 million teeth have been treated with Curodont Repair
      Fluoride Plus in the US since the product's early 2024 launch, with presence in nearly 20%
      of US general dental practices.

      The medRxiv/CareQuest cost-effectiveness simulation showed scenarios combining Curodont with
      silver diamine fluoride (SDF) and glass-ionomer sealants produced mutually beneficial
      results for payors (cost savings) and clinics (higher profit margins) relative to current
      practice. However, that study disclosed that all authors were funded by CareQuest Innovation
      Partners, which has a financial relationship with vVARDIS, creating a potential conflict of
      interest that must be weighed when relying on those financial projections. Independently
      validated unit economics data for the US roll-out period remain limited.

      Henry Schein's distribution economics are not publicly disclosed. As the exclusive US
      channel partner, Henry Schein captures a distributor margin that compresses vVARDIS's
      effective net revenue per unit below the listed wholesale price. Distribution cost structures
      for premium dental consumables typically imply distributor margins of 15–35%, though
      vVARDIS-specific terms have not been made public.
