callouts:
  - calloutType: strength
    title: 80% Patient Prevalence Creates an Enormous Untapped Opportunity
    body: >
      Up to 80% of dental patients present with early-stage cavities at any given visit,
      yet the majority historically left the dental office without treatment. This is not a
      niche clinical gap—it is the dominant patient population. With Henry Schein's full
      US market exclusivity beginning January 1, 2026, vVARDIS now has distribution access
      to the channel needed to convert this clinical opportunity into commercial revenue
      across all practice types.
    claimRefs:
      - CM014
      - CM015
      - CM016

  - calloutType: risk
    title: Insurance Reimbursement Uncertainty is a Material Adoption Constraint
    body: >
      As of 2026, insurance reimbursement for non-invasive early caries treatments is
      inconsistent across US commercial payers. CDT codes for these procedures are
      frequently denied or classified as investigational, and Curodont lacks a universally
      accepted billing code. This creates friction at the practice level: dentists who
      cannot confidently bill for the procedure face a revenue model mismatch. The ~72
      million US adults without dental insurance compound this risk by shrinking the
      reimbursable patient pool.
    claimRefs:
      - CM025
      - CM026
      - CM036

  - calloutType: insight
    title: DSO Consolidation is a Force-Multiplier for vVARDIS
    body: >
      DSOs now manage approximately 35% of US dental practices in 2026, up from just 8.8%
      in 2017. When Henry Schein secures Curodont adoption within a major DSO, standardized
      procurement protocols deploy the product across potentially hundreds of locations
      simultaneously. Henry Schein's CEO explicitly cited Curodont as having "the potential
      to be one of our top consumable products," signaling serious commercial commitment.
      The DSO channel is vVARDIS's most capital-efficient scaling lever in the near term.
    claimRefs:
      - CM013
      - CM017
      - CM035

