  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      Curodont is an in-office professional product that requires licensed dental clinician
      application; it is not available over the counter. This means the purchasing decision
      is made by the dental practice or dental professional—the buyer—not the patient.
      The user is the patient receiving the treatment. The payer is typically the dental
      insurance carrier (covering basic or preventive services) or the patient paying
      out-of-pocket when insurance does not cover the procedure.

      The US dental market in 2026 has approximately 178,000–190,000 practices and
      approximately 202,000–203,000 professionally active dentists. Three core buyer
      segments are relevant to vVARDIS: independent general practices (the majority by
      count), pediatric and orthodontic specialty practices (high whitе-spot lesion
      incidence), and dental service organizations (DSOs). DSOs, which now manage
      approximately 35% of US dental practices in 2026 (up from ~8.8% in 2017), represent
      a disproportionately important channel because of centralized procurement and
      protocol standardization. Henry Schein's 2024 DSO-exclusivity agreement with
      vVARDIS was expanded to the full US dental market effective January 1, 2026.

      Budget ownership sits with the practice for the product purchase and with the
      payer or patient for the clinical treatment fee. As of 2026, about 27% of US
      adults—approximately 72 million people—lacked dental insurance, representing both
      a structural coverage gap and a potential underserved market for accessible early
      intervention tools. Insurance non-coverage for non-invasive early caries therapies
      remains a meaningful adoption constraint, particularly in the independent practice
      segment where out-of-pocket pricing sensitivity is highest.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM015
      - CM016
      - CM036
      - CM037
      - CM039
    tableRefs:
      - TM003
    figureRefs:
      - FM003

  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      Several structural forces are driving the dental caries treatment market above
      historical baselines. First, AI-powered caries detection tools are now achieving
      up to 98% lesion-detection accuracy, expanding the number of lesions identified
      at early non-cavitated stages that are amenable to non-invasive therapy—directly
      expanding the addressable market for products like Curodont. Second, DSO
      consolidation compresses the sales cycle: a single DSO decision to standardize
      on Curodont can deploy the product across hundreds of affiliated locations, which
      is why Henry Schein's January 2026 expansion to cover the full US dental market
      matters so significantly to vVARDIS's scaling trajectory. Third, the preventive
      dental treatment segment is among the fastest-growing in the broader dental market,
      fueled by expanded payer coverage of preventive protocols and consumer preference
      for non-invasive care.

      Constraints are also material. Insurance non-coverage is the leading friction
      point: CDT codes D1354 (silver diamine fluoride) and D2990 (resin infiltration)
      are frequently denied by commercial plans or classified as investigational, and
      Curodont does not yet have a widely adopted dedicated CDT code, forcing practices
      to navigate billing and patient-consent protocols without guaranteed reimbursement.
      Manufacturing and regulatory complexity for peptide-based products adds cost: the
      P11-4 peptide synthesis process is expensive, and the self-assembly is sensitive
      to pH, temperature, and salivary ion conditions—potential barriers to consistent
      patient outcomes in lower-resourced settings. Additionally, approximately 27% of
      US adults lack dental insurance, concentrating the accessible population in insured
      or high-disposable-income demographics. Switching cost from existing protocols is
      low in theory (single-visit application), but clinical workflow integration and
      patient education requirements add adoption latency in practices with entrenched
      watchful-waiting culture.
    claimRefs:
      - CM017
      - CM025
      - CM026
      - CM030
      - CM031
      - CM033
      - CM034
      - CM035
      - CM041
    tableRefs:
      - TM004
    figureRefs:
      - FM004

  - id: contradictory-estimates-gaps
    title: Contradictory Sizing Estimates and Evidence Gaps
    body: >
      Three categories of evidence ambiguity affect this market analysis. First, analyst
      sizing estimates for the global dental caries treatment market differ by USD 1–2
      billion for comparable base years, because different analysts draw the boundary
      differently—some include the full restorative materials category (composites,
      amalgams, endodontic sealers) while others narrow the scope to preventive and
      early-intervention products. This creates a TAM range of approximately USD 7.6
      billion (narrow preventive scope) to USD 9.4 billion (broad treatment scope) for
      2025–2026. Second, no independent analyst carve-out exists for the non-invasive
      peptide-based early caries treatment sub-segment, making SAM and SOM estimation
      for vVARDIS inferential rather than directly sourced. Third, insurance payer
      acceptance data for Curodont specifically is not publicly available—it is unknown
      what share of commercial plans and Medicaid programs in the US will reimburse
      the procedure as of mid-2026, which is a material gap for revenue projection.

      The 2025 randomized controlled trial (RCT) showing Curodont Repair Fluoride Plus
      achieves significantly higher odds of caries arrest than Duraphat fluoride varnish
      (AOR=6.46) provides robust clinical evidence, but clinical efficacy and market
      adoption are distinct drivers. The clinical evidence base for P11-4 remineralization
      now exceeds 230 peer-reviewed publications, including a long-term real-world evidence
      study showing a 90%+ success rate, yet the majority of US dentists are still in
      early-awareness or trial stage rather than routine adoption as of 2026.
    claimRefs:
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
      - CM029
      - CM040
      - CM043
      - CM045

