chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global dental caries treatment market is estimated at USD 7.6–9.4 billion in
    2025–2026 across competing analyst methodologies, with North America representing
    ~37–38% of global spend. vVARDIS targets the early-stage non-invasive caries
    sub-segment—a category where up to 80% of dental patients present with treatable
    lesions yet the majority have historically left offices untreated. The immediate buyer
    is the dental practice; payers are private dental insurance and patient out-of-pocket.
    Insurance reimbursement for non-invasive early caries treatments remains inconsistent
    in 2026. DSO consolidation (~35% of US practices) and Henry Schein's full-market
    distribution exclusivity effective January 1, 2026 are the two structural levers
    governing near-term adoption trajectory.

sections:
  - id: market-boundary
    title: Market Boundary and Scope
    body: >
      The dental caries treatment market spans products and procedures used to diagnose,
      prevent, arrest, or restore teeth damaged by tooth decay, the world's most
      prevalent non-communicable disease. For analytical purposes, this market can be
      divided into three treatment categories: (1) preventive products—fluoride varnishes,
      sealants, and antimicrobial agents applied before cavitation occurs; (2) early
      non-invasive interventions—biomimetic remineralization agents, silver diamine
      fluoride (SDF), and resin infiltration that treat non-cavitated or early-cavitated
      lesions without drilling; and (3) restorative and endodontic procedures—fillings,
      crowns, root canals, and extractions that address advanced or cavitated disease.
      Restorative materials lead the overall market by revenue, at approximately 38% of
      global spend, while the non-invasive early-intervention category that vVARDIS
      targets remains a nascent but fast-growing sub-segment.

      The included spend in vVARDIS's addressable market is in-office professional
      treatment products for early caries lesions applied by a licensed dental clinician;
      excluded spend includes over-the-counter consumer oral care, orthodontic appliances,
      cosmetic procedures, and advanced restorative work. Key adjacencies include
      diagnostic imaging (AI-assisted caries detection) and preventive prophylaxis.
      The status-quo substitute for most patients is watchful waiting—monitoring the
      lesion without active treatment—a common practice that vVARDIS's Curodont is
      explicitly designed to displace.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM023
      - CM024
      - CM042
    tableRefs:
      - TM001

  - id: market-sizing
    title: Market Sizing – TAM, SAM, and SOM
    body: >
      Analyst estimates for the global dental caries treatment market differ materially
      in 2025–2026, reflecting divergent scope definitions. Mordor Intelligence sizes the
      market at USD 7.58 billion in 2025 with a conservative 3.12% CAGR to USD 8.83
      billion by 2031, focusing on primary treatment product revenues. GII Research
      (SkyQuest) estimates the market at USD 8.9 billion in 2024 and USD 9.39 billion in
      2025, growing to USD 14.42 billion by 2033 at a 5.5% CAGR, using a broader scope
      that includes restorative sub-categories. A third estimate from Research and
      Markets places the 2026 market at USD 9.35 billion with a 7.4% CAGR toward USD
      14.55 billion by 2032. These contradictory estimates are preserved as evidence
      of genuine scope ambiguity in the analyst community.

      North America accounts for approximately 37–38% of global dental caries treatment
      market revenue, making the US the single largest country market. The broader US
      dental services market—which encompasses preventive, restorative, cosmetic, and
      specialty services—is valued at USD 174.91 billion in 2025 and projected to reach
      USD 185.39 billion in 2026. The dental caries treatment segment is a sub-set of
      this figure. vVARDIS's SAM is narrower still: the US early-stage non-invasive
      caries treatment category, for which no independent analyst carve-out exists.
      A bottom-up proxy can be constructed from the >178,000 US dental practices, each
      treating patients where up to 80% present early-stage lesions, at an estimated
      single-digit-dollar per-treatment consumable price point.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM032
      - CM038
      - CM044
