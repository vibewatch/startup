  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent analyst report segmenting the global or US market specifically
        for non-invasive peptide-based early caries treatments and providing a
        standalone revenue estimate for this sub-category.
      whyItMatters: >-
        Without a direct SAM estimate, vVARDIS's market sizing relies entirely on
        patient-prevalence proxies and company assertions; this makes it difficult to
        benchmark valuation multiples or validate the USD 1B+ unicorn valuation
        against addressable-market norms.
      diligencePath: >-
        Commission a custom market analysis from Mordor, IQVIA, or a dental trade
        association with practitioner survey data on treatment economics; alternatively,
        triangulate from Henry Schein sell-through data under a commercial due-diligence
        agreement.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: material
      topic: reimbursement
      missingEvidence: >-
        Systematic data on payer-specific coverage and reimbursement acceptance rates
        for Curodont treatment in 2026, including which CDT codes are being used,
        denial rates, and any emerging payer policy updates.
      whyItMatters: >-
        If most commercial plans deny reimbursement for Curodont, growth is constrained
        to cash-pay patients and practices willing to self-fund the product cost from
        existing reimbursable protocols—a materially different revenue model than a
        fully reimbursed preventive procedure.
      diligencePath: >-
        Request vVARDIS or Henry Schein payer-relations data under NDA; review ADA CDT
        code guidance and individual Delta Dental / Cigna / Aetna policy bulletins for
        D2991 and any Curodont-specific coverage decisions.
      relatedQuestionRefs:
        - QM021

    - type: conflicting-data
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        The analyst methodology papers underlying the USD 7.58B vs USD 9.39B divergence
        for the same market in 2025 are not publicly available; the scope definition
        (preventive-only vs. full restorative inclusion) cannot be independently
        verified without access to the full proprietary reports.
      whyItMatters: >-
        The lower estimate implies a TAM roughly 20% smaller and would lower the
        percentage of the total market that vVARDIS can credibly claim as addressable,
        affecting the denominator used in penetration analysis.
      diligencePath: >-
        Obtain full versions of both reports under research licenses; cross-reference
        their product taxonomy with the ICDAS-II caries classification to determine
        whether each analyst's "preventive treatment" boundary includes non-invasive
        remineralization products.
      relatedQuestionRefs:
        - QM006
      relatedTableRefs:
        - TM002
