  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for vVARDIS
      - Diligence Ask
    rows:
      - - AI-assisted caries detection (98% accuracy)
        - Tailwind
        - Now (2026)
        - Expands early-lesion detection funnel; more patients eligible for non-invasive treatment
        - Track AI platform partnerships and co-promotion opportunities
      - - DSO consolidation (~35% of US practices in 2026)
        - Tailwind
        - Now / near-term
        - Centralized procurement accelerates vVARDIS penetration; DSO standardization locks in protocols
        - Confirm contractual DSO adoption rates vs. general-practice rates
      - - "Henry Schein full-market exclusivity (Jan 2026)"
        - Tailwind
        - Immediate
        - Extends Curodont's distribution reach from DSOs to all dental segments
        - Validate sell-in vs. sell-through; track reorder rates
      - - Shift toward minimally invasive / preventive dentistry
        - Tailwind
        - Medium-term
        - Clinical guideline evolution supports non-invasive early intervention as standard of care
        - Monitor ADA and AAPD guideline updates for explicit Curodont endorsement
      - - Insurance non-coverage for early caries therapies
        - Headwind
        - Now / persistent
        - Practices must collect OOP or navigate reimbursement uncertainty; slows adoption in price-sensitive segments
        - Track CDT code adoption and commercial payer policy updates for Curodont billing codes
      - - Peptide manufacturing cost and scalability
        - Headwind
        - Medium-term
        - High synthesis cost may constrain margin expansion or require premium pricing vs. fluoride varnish
        - Request gross margin and COGS breakdown in diligence
      - - Patients lacking dental insurance (~72M US adults in 2025)
        - Headwind
        - Structural
        - Reduces addressable paying-patient pool; underinsured segments are less accessible through dental office channel
        - Assess vVARDIS pricing strategy and any community clinic / public health channel plans
    notes: >
      Directions are relative to vVARDIS near-term growth trajectory. Timing categories:
      'Now' = already influencing 2026 outcomes; 'Near-term' = 1–2 years; 'Medium-term'
      = 3–5 years; 'Structural' = persistent systemic factor. Insurance headwind applies
      to in-office fee reimbursement, not to product purchase by the practice.
