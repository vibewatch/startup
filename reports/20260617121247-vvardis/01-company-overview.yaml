  - id: milestones-growth
    title: Milestones, Growth, and Adverse Context
    body: >
      vVARDIS has achieved rapid commercial adoption since launching Curodont Repair Fluoride Plus
      in the US in early 2024. By January 2026, over 2 million teeth had been treated in the US in
      24 months; by April 2026, that figure exceeded 3 million. The product is cited as the fastest-
      growing dental product in its category in 2024 vs. 2023 and YTD June 2025 (per SDM
      Northcoast). Key distribution milestones include: Henry Schein becoming exclusive distributor
      for DSOs in September 2024; Henry Schein expanding exclusivity to all US dental segments
      (general, orthodontic, pediatric) effective January 1, 2026. Major DSO partnerships include
      Aspen Dental and Heartland Dental as early adopters. In June 2024, vVARDIS and VideaHealth
      announced an AI-integration partnership to link early caries detection with Curodont
      treatment; in May 2025, Pearl AI announced a global collaboration with vVARDIS. In January
      2026, the founders presented at the J.P. Morgan Healthcare Conference—returning after JPMorgan
      CEO Jamie Dimon personally praised vVARDIS at the bank's 2025 San Francisco conference.

      An important adverse context: Curodont lacks routine insurance reimbursement in the US as of
      2026. The American Dental Association documented in January 2026 that more than half of
      dentists cited low insurance reimbursement as a top concern, and new non-covered treatments
      face structural barriers to mainstream adoption. vVARDIS does not publicly disclose revenue
      or financial metrics beyond commercial milestones, limiting independent verification of
      growth claims. No regulatory enforcement actions, product recalls, or legal proceedings
      involving vVARDIS were identified during research.
