  - id: technology-products
    title: Technology and Products
    body: >
      Curodont™ is the core product platform of vVARDIS, representing the first and only
      commercially available non-invasive peptide-containing formulations clinically proven to
      treat early-stage tooth decay. The technology is anchored in the P11-4 biomimetic peptide,
      which self-assembles into a scaffold that attracts calcium and phosphate ions from saliva,
      guiding hydroxyapatite crystal regeneration throughout the depth of early carious lesions.
      This "Guided Enamel Remineralization" approach is contrasted with conventional fluoride
      varnishes, which primarily act on the tooth surface and do not penetrate to the lesion depth.
      The underlying science spans more than 25 years of research and is supported by over 250
      scientific publications, including meta-analyses and long-term peer-reviewed clinical studies
      demonstrating a documented success rate above 90%.

      The current Curodont™ product line includes two main products for dental professionals:
      Curodont Repair Fluoride Plus (the flagship in-office treatment for early non-cavitated
      carious lesions, applied in as little as 3 minutes) and Curodont Protect (an anti-cavity and
      anti-sensitivity gel for prophylaxis). Curodont Repair Fluoride Plus received CE marking
      approval for the EU and Switzerland in 2012, entered international markets beginning in 2016,
      and received US FDA clearance in 2019. The product is indicated only for early-stage,
      non-cavitated caries; cavitated lesions still require conventional drilling and restoration.
      vVARDIS also markets a direct-to-consumer premium oral care line enriched with its
      hydroxyapatite technology. vVARDIS technology is referenced in lectures at leading dental
      universities worldwide as a standard of care for early decay management.
