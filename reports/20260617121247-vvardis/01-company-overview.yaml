chapter:
  number: 1
  title: Company Overview
  summary: >
    vVARDIS Holding AG is a Swiss dental medtech company headquartered in Zug, Switzerland,
    founded in August 2019 by sisters Dr. Haley (Haleh) and Dr. Goly (Golnar) Abivardi, both
    University of Zurich-trained dentists. Its flagship Curodont™ platform—the first commercially
    available non-invasive peptide-based treatment for early-stage tooth decay—is distributed
    exclusively in the US by Henry Schein and is present in nearly 20% of US dental practices
    after treating approximately 3 million teeth since its US launch in early 2024. An April 2026
    strategic minority investment from Apollo Global Management at a $1 billion-plus valuation
    conferred unicorn status, and as of June 2026 vVARDIS is exploring a US IPO with JPMorgan
    and Goldman Sachs mandated.

sections:
  - id: identity-founding
    title: Identity, Headquarters, and Founding
    body: >
      vVARDIS Holding AG is a high-growth dental medtech company legally registered in Zug,
      Switzerland. The entity was founded in August 2019 by dentist-entrepreneur sisters
      Dr. Haleh Abivardi (known as Haley) and Dr. Golnar Abivardi (known as Goly), both graduates
      of the University of Zurich's dental program. In 2020, vVARDIS acquired Credentis AG,
      the Swiss biotech that had developed the P11-4 biomimetic peptide technology underlying the
      Curodont™ product line, effectively completing the company's identity as a dental therapeutics
      firm. The company also publicly launched its direct-to-consumer oral care brand in November
      2020. vVARDIS is classified as a dental medtech company by industry databases and positions
      itself at the intersection of biomimetic science and preventive dentistry.

      The company is headquartered in Zug, Switzerland, a prominent Swiss financial and corporate
      center. Dr. Haley Abivardi is based in Zug; Dr. Goly Abivardi is based in Zurich, the two
      cities being approximately 25 km apart. The company has commercial operations in the US
      (the primary near-term growth market), European markets, and the Middle East. Its legal
      entity name as referenced in the April 2026 Apollo press release is vVARDIS Holding AG. The
      company describes its mission as "creating a world where caries treatment is pain-free,
      regenerative and accessible to all," with the public health tagline "Save Teeth, Save Lives."
      vVARDIS is a member of the World Economic Forum Innovator Communities and was awarded
      the 2026 Innovative Company of the Year by Dental Advisor.
