company:
  name: vVardis
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    vVARDIS's Curodont platform, built on the self-assembling peptide P11-4, is the first and only commercially
    available non-invasive treatment for early enamel caries, backed by over 250 peer-reviewed publications and a
    documented 80–93% clinical success rate in randomized controlled trials. Since the US commercial launch in early
    2024, Curodont Repair Fluoride Plus has treated approximately 3 million teeth and is present in roughly 20% of
    US dental practices, with Henry Schein as exclusive national distributor across all segments effective January 2026.
    Core biomedical IP is described as patented but expiry timelines are undisclosed, and the platform depends on a
    single US distributor as the company approaches a potential IPO.
sections:
  - id: product-portfolio-mechanism
    title: Product Portfolio and P11-4 Clinical Mechanism
    body: >-
      vVARDIS's commercial product portfolio centers on the Curodont brand of self-assembling peptide P11-4 formulations.
      The flagship product, Curodont Repair Fluoride Plus, is a low-viscosity, proprietary liquid that dental professionals
      apply to early non-cavitated carious lesions in approximately 3–5 minutes without drilling or anesthesia. The P11-4
      peptide is composed of naturally occurring amino acids that, when introduced into an acidic enamel lesion
      environment, self-assemble into a fiber-like biomatrix within the porous enamel structure. This biomatrix then
      attracts calcium and phosphate ions from the patient's own saliva, nucleating and growing new hydroxyapatite
      crystals throughout the full depth of the lesion—a process the company calls Guided Enamel Regeneration (GER).
      This in-depth mineral regeneration differentiates Curodont from surface-acting fluoride varnishes, which typically
      penetrate only approximately 25 microns into the lesion; Curodont Repair FP reaches up to 2,500 microns on
      occlusal surfaces and up to 1,500 microns on interproximal surfaces. The product is non-staining, tasteless, and
      suitable for patients of all ages (children under 6 should consult a dentist). In addition to Curodont Repair FP,
      vVARDIS markets Curodont Protect, a stabilized stannous fluoride gel for adjunctive in-office and at-home cavity
      prevention and sensitivity reduction, suitable for patients aged 6 and older. A consumer-facing Daily Oral Care
      product line based on the patented WX Formula (hydroxyapatite-based whitening and protective gel) completes the
      portfolio; this line predates the professional Curodont products and was the company's original brand launch in
      November 2020. All products are stated to be sustainably produced in Switzerland.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
