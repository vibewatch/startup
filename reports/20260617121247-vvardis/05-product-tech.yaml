  - id: distribution-workflow-integrations
    title: Distribution Architecture and Digital Workflow Integration
    body: >-
      vVARDIS's US commercialization is built on a single exclusive distributor: Henry Schein, the world's largest
      dental supply company with over $12.7 billion in 2024 revenue. An initial DSO-only exclusivity arrangement
      announced in September 2024 was expanded effective January 1, 2026 to cover all US dental market segments—general
      dentistry, orthodontics, and pediatric dentistry in addition to DSOs. Henry Schein also holds exclusive UK
      distribution rights and non-exclusive international rights in select markets. This concentrated distribution
      structure accelerates market penetration but creates a single-channel dependency risk. Beyond direct distribution,
      vVARDIS has formed two AI-powered detect-and-treat workflow integrations. In June 2024, vVARDIS and VideaHealth
      (Videa) announced a partnership enabling Videa's dental AI platform—used daily by over 30,000 clinicians across
      major DSOs—to identify early caries lesions suitable for Curodont treatment; both companies operate through
      Henry Schein. In May 2025, vVARDIS and Pearl announced a global collaboration leveraging Pearl's AI radiograph
      analysis to surface early caries that Curodont can treat non-invasively. Named DSO customers publicly referencing
      Curodont adoption include Aspen Dental and Heartland Dental, as cited in the January 2026 JP Morgan Healthcare
      Conference press release. These integrations position Curodont within AI-enhanced preventive workflows but the
      depth of data-sharing agreements and contractual terms are not publicly disclosed.
