  - id: clinical-evidence-regulatory
    title: Clinical Evidence and Regulatory Status
    body: >-
      The P11-4/Curodont platform is supported by over 250 peer-reviewed scientific publications, including multiple
      randomized controlled trials and a long-term real-world evidence study. In the pivotal Alkilzy et al. RCT
      published in the Journal of Dental Research (2018), P11-4 combined with fluoride varnish was clinically and
      statistically superior to fluoride varnish alone for treating early occlusal caries in children at 3 and 6
      months, with an odds ratio of 12.2 (p<0.0001) for conversion from active to inactive lesions per Nyvad criteria
      and no adverse events in any participant. A 2026 prospective triple-blind RCT (Jablonski-Momeni et al., BMC Oral
      Health) in adolescents undergoing orthodontic treatment found that home use of P11-4 gel with fluoride reduced
      enamel demineralization to 7.2% of surfaces versus 14.5% in the placebo group (p<0.0001) over 18 months, with no
      adverse effects observed. A long-term clinical follow-up study (Godenzi et al., JADA, October 2023) documented
      a 93% success rate—defined as arrest and regression of early proximal caries—with up to 6 years of clinical
      observation. An in vitro microCT study (vVARDIS data on file, 2025) showed a statistically significant 15.7%
      average increase in relative mineral density 14 days post-application. A 2025 study (Danisman et al., Sci Rep)
      compared P11-4 with CPP-ACPF for white spot lesion management during orthodontic treatment, finding both agents
      highly effective for remineralization, with P11-4 demonstrating comparable performance to the established
      alternative. On the regulatory side, Curodont received CE marking for Europe and Switzerland in 2012, and FDA
      clearance in the United States in 2019, validating it as a licensed medical device in both major markets. The
      US commercial version, Curodont Repair Fluoride Plus, launched commercially in early 2024.
    claimRefs:
      - CE008
      - CE009
