  - id: manufacturing-ip-quality
    title: Manufacturing, IP, and Quality Foundations
    body: >-
      vVARDIS is incorporated as vVARDIS Holding AG in Zug, Switzerland, and states that all Curodont products are
      manufactured in Switzerland according to Swiss quality standards. The company has not published an ISO 13485
      certification or disclosed its manufacturing organization publicly, which represents a diligence gap for institutional
      investors. The founders, Drs. Haley and Goly Abivardi, are dentists who previously built and sold the Swiss Smile
      dental clinic chain (backed by EQT, subsequently sold to Jacobs Holding in 2017); upon founding vVARDIS they
      acquired the core P11-4 intellectual property rather than developing it from scratch. vVARDIS describes the Curodont
      technology as patented, and Apollo's April 2026 press release characterizes it as "the first and only non-invasive
      peptide-containing formulations designed to treat tooth decay drill-free throughout the depth of the lesion,"
      implying strong IP positioning. However, the specific patent numbers, scope of claims, and expiration dates are not
      publicly disclosed, which is a material gap for assessing long-term competitive moat. The company has received
      independent recognition: Dental Advisor awarded vVARDIS the 2026 Innovative Company of the Year award and Curodont
      Repair Fluoride Plus the 2026 Research Award. vVARDIS is also a member of the World Economic Forum Innovator
      Communities, reflecting recognition of its innovation approach beyond dental industry circles.
    claimRefs:
