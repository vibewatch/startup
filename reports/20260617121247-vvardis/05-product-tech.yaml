  - id: TE003
    title: vVARDIS Technology and Operating Architecture
    columns:
      - Layer/Component
      - Role
      - Dependency
      - Risk
    rows:
      - - P11-4 self-assembling peptide (core active)
        - Biomatrix scaffold enabling guided hydroxyapatite regeneration throughout lesion depth
        - Academic IP acquired by founders; Swiss peptide synthesis/manufacturing
        - Patent expiry timeline undisclosed; post-expiry competitor replication risk
      - - Low-viscosity liquid formulation (single-use applicator)
        - Delivery vehicle; capillary diffusion through enamel pores to 2,500µm depth
        - Swiss manufacturing; clean-room production assumed but not confirmed publicly
        - No independent CMO disclosed; single-source supply concentration risk
      - - Sodium hypochlorite surface conditioning step
        - Removes acquired pellicle to enable P11-4 diffusion into lesion
        - In-office training requirement; dental clinic supply chain
        - Extra protocol step vs. simpler competitors (SDF, fluoride varnish); incremental training burden
      - - Saliva calcium/phosphate mineral reservoir
        - Essential co-reactants for hydroxyapatite crystal formation in situ
        - Patient's own biology; adequate salivary flow required
        - Ineffective in xerostomia; adjunctive mineral supplementation needed for compromised patients
      - - Henry Schein US/UK exclusive distribution
        - US and UK commercialization, logistics, dental sales force
        - Contractual exclusivity; effective January 2026 for all US segments
        - Single-channel dependency; disruption to relationship would halt US revenue
      - - AI detection partnerships (Pearl, VideaHealth)
        - Surface treatable early lesions via radiograph analysis to drive Curodont adoption
        - Third-party AI platform contracts; co-partnership through Henry Schein
        - Integration depth not contractually disclosed; AI detection accuracy affects treatment conversion rates
      - - vVARDIS e-learning / Curodontist certification
        - Ensures clinician application quality and protocol adherence; drives professional adoption
        - vVARDIS-operated digital training platform
        - Training not state-mandated; protocol deviations possible; no public completion rate data
    notes: >-
      Architecture derived from public product pages, press releases, and professional portal. Manufacturing details
      and CMO relationships are not publicly disclosed; assumptions noted accordingly.
