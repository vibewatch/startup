callouts:
  - calloutType: strength
    title: Best-in-Class Clinical Evidence Base for Early Caries Treatment
    body: >-
      Curodont Repair Fluoride Plus is backed by an unusually deep clinical evidence base for a dental medtech
      product: over 250 peer-reviewed publications, a 2018 J Dent Res RCT showing a 12.2× odds ratio of caries
      inactivation versus fluoride alone (p<0.0001), a 6-year real-world study with 93% success rate, a 2026 triple-blind
      RCT confirming enamel protection superiority in orthodontic patients (p<0.0001), and zero adverse events across
      all published trials. This breadth of controlled trial evidence is without precedent for a non-invasive caries
      treatment and constitutes the core technology moat.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE012
      - CE013
      - CE019

  - calloutType: risk
    title: Single-Channel US Distribution and Undisclosed IP Expiry Create Structural Risks
    body: >-
      vVARDIS's entire US revenue pipeline flows through a single exclusive distributor (Henry Schein), creating a
      structural single-channel dependency that could materially impair US business if the relationship deteriorates.
      Simultaneously, the expiry dates and breadth of the core P11-4 patent are not publicly disclosed, leaving the
      long-term competitive moat unverifiable. If IP protection expires within the IPO window or is narrower than
      implied, the barrier to generic peptide competition narrows materially.
    claimRefs:
      - CE018
      - CE031
      - CE036

  - calloutType: insight
    title: No Developer Ecosystem — Competitive Moat Is Biomedical, Not Software
    body: >-
      A GitHub search for "vvardis" or "curodont" in June 2026 returned only five irrelevant repositories, confirming
      that vVARDIS has no developer community, no public API, and no software platform moat. Its defensibility is
      entirely biomedical: proprietary peptide chemistry, multi-market regulatory clearances, accumulated clinical
      evidence, and distribution exclusivity. This is structurally different from software-driven healthcare companies
      and demands biomedical IP and regulatory expertise for investor due diligence rather than technology platform analysis.
    claimRefs:
      - CE032
      - CE033

