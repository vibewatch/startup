  - id: TE002
    title: Curodont Workflow and Use-Case Table
    columns:
      - User Job
      - Previous Workflow
      - vVARDIS Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - GP dentist treating early enamel caries
        - Watch and wait or refer for drilling when prevention fails
        - Apply Curodont Repair FP in-office in 3–5 min; no drilling or anesthesia
        - 80% caries inactivation vs. 34% fluoride alone (Alkilzy RCT 2018, 6 months); no separate appointment needed
        - Effective only for non-cavitated early lesions; cannot replace restorations for advanced decay
      - - Dental hygienist managing early "watch areas"
        - Fluoride varnish or observation; no active therapeutic option
        - AI detection (Pearl/VideaHealth) then same-visit Curodont Repair FP application
        - Treat at detection rather than monitoring; expands hygienist scope of practice
        - AI integration requires platform adoption; protocol training required; not state-mandated
      - - Pediatric patient with early caries
        - Invasive drilling appointment (often under sedation for young children)
        - Drill-free, needle-free, tasteless, 3-min treatment; no separate appointment needed
        - 93% arrest/regression at up to 6 years follow-up (Godenzi JADA 2023); zero adverse events in trials
        - Not suitable for cavitated lesions; children under 6 require dentist/doctor consultation
      - - Orthodontist managing white spot lesions during treatment
        - Fluoride varnish (surface-only) or referral; no in-depth remineralization option
        - Curodont Protect at-home gel during orthodontic treatment; Curodont Repair FP for established WSLs
        - 7.2% vs. 14.5% WSL incidence at 18 months (Jablonski-Momeni RCT 2026; p<0.0001)
        - Evidence based on small RCT (n=25); at-home compliance required
      - - DSO practice growing per-visit preventive revenue
        - No billable early-caries treatment; most patients leave office untreated
        - Curodont as billable add-on preventive treatment (applicable CDT codes); 3-min chair time add-on
        - 60–100% patient acceptance rate per Dental Products Hopper evaluators; grows practice word-of-mouth
        - Insurance reimbursement not standardized across all payers; pricing and margin data private
    notes: >-
      Clinical outcome data sourced from cited peer-reviewed publications. DSO revenue and practice economics are
      illustrative; actual per-practice realized revenue not disclosed. Patient acceptance rates from Dental Products
      Hopper independent evaluator study.
