  - id: evidence-gaps-and-adverse
    title: Evidence Gaps, Limitations, and Adverse Signals
    body: |
      Several competitive dimensions carry material evidence gaps as of June 2026. DMG is privately held and discloses no revenue, unit sales, or market share data for Icon, making it impossible to accurately size the resin infiltration segment or benchmark Curodont's relative market position against its closest in-office direct competitor. Formal quantification of practice-level switching costs—the time, training investment, billing-code transition burden, and price-premium tolerance required to shift from fluoride varnish protocols to Curodont—is absent from public literature. Without this data, adoption-rate modeling and customer lifetime value projections remain qualitative.

      Adverse and cautionary evidence for vVardis includes: a 2023 systematic review noting that despite broad positive in-vitro evidence for peptide-based caries management, more randomized controlled clinical trials are needed before the evidence base is considered definitive; Curodont's higher upfront cost versus commodity fluoride varnish (~$2.20/dose) or SDF, creating adoption resistance among cost-sensitive general practices; and the absence of published head-to-head trials directly comparing Curodont to DMG Icon in the same lesion population—the comparison most relevant to in-office clinical decision-making. The broader SDF evidence base (627-plus studies) and Icon evidence base (400-plus studies) are both numerically larger than vVardis's 250-plus publications. vVardis's evidence base is nonetheless substantively strong: a 2024 randomized controlled clinical trial in Clinical Oral Investigations found P11-4 plus fluoride significantly outperforms fluoride varnish alone, and the PMC systematic review confirmed broad in-vitro evidence for P11-4 remineralization. The Henry Schein exclusivity agreement's exact terms—duration, renewal mechanics, and non-compete scope—are not publicly disclosed, limiting independent moat durability assessment.
