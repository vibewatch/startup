chapter:
  number: 3
  title: Competitors
  summary: >-
    vVardis Curodont faces a competitive landscape spanning DMG Icon (resin infiltration),
    silver diamine fluoride products from Elevate Oral Care and SDI, and an incumbent
    fluoride varnish segment led by Dentsply Sirona, Solventum/3M, GC America, Colgate, and
    Ivoclar Vivadent. Curodont's core differentiators—staining-free single-visit biomimetic
    regeneration via P11-4 peptide technology and Henry Schein's full-US exclusive
    distribution from January 2026—create defensible moats, yet premium pricing against
    ~$2/dose commodity fluoride varnish and SDF's lower-cost caries arrest represent material
    adoption headwinds in the cost-sensitive general practice segment.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: |
      The competitive landscape for vVardis Curodont spans four distinct categories of alternatives available to dental professionals managing early caries. First, direct minimally invasive in-office alternatives: DMG's Icon resin infiltration treats the same ICDAS 1-2 enamel lesions that Curodont targets, doing so without drilling but through an acid-etch and resin barrier mechanism rather than biomimetic regeneration. Second, silver diamine fluoride (SDF) products—principally Elevate Oral Care's Advantage Arrest 38% and SDI's Riva Star Aqua—arrest rather than regenerate carious lesions and have established clinical use in pediatric and special-needs adult populations. Third, the incumbent fluoride varnish segment represents the largest substituent by volume: Dentsply Sirona, Solventum/3M, GC America, Colgate, Ivoclar Vivadent, and Ultradent collectively dominate the in-office preventive workflow with well-reimbursed, approximately $2-per-dose products that are deeply embedded in hygiene visit protocols. Fourth, biomimetic toothpaste products such as BioMin Technologies' BioMin F compete in the home-care remineralization segment through a different channel entirely. Underlying all these categories is the implicit status quo substitute: the "watch and wait" approach, where a large proportion of patients with early caries leave US dental offices without active treatment, representing the largest substitute class Curodont must overcome to achieve mainstream adoption.
    claimRefs:
      - CP001
      - CP013
      - CP014
      - CP037
      - CP044
    tableRefs: []
