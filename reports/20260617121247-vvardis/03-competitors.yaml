      topic: switching-costs
      missingEvidence: "No published survey or cost-benefit analysis quantifying the time cost, training investment, CDT billing transition burden, and price-premium tolerance required for a dental practice to shift from fluoride varnish protocols to Curodont."
      whyItMatters: "Switching cost magnitude is central to adoption curve modeling and customer lifetime value projections. Without this data, the pace of practice conversion and long-term market share growth cannot be accurately estimated."
      diligencePath: "Commission practice-level survey via dental hygiene association channels or Dental Economics reader panel; request vVardis customer success data on average practice adoption timeline and cost of change management."
