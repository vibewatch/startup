  - id: incumbent-substitutes
    title: Incumbent Fluoride Varnish Market and Substitutes
    body: |
      Fluoride varnish is the most deeply entrenched substitute in Curodont's indication space. Globally, the dental fluoride varnish market is estimated at approximately $207–412 million in 2026, with more than 74% of professional dental practices applying varnish as a standard component of preventive care visits. Several major brands compete primarily on formulation differentiation, flavoring, and price. Dentsply Sirona's NUPRO White Varnish—a market-standard 5% sodium fluoride varnish—lists at approximately $1,098 per 500-dose box, roughly $2.20 per dose. Solventum's Clinpro Vanish differentiates with functionalized tricalcium phosphate (fTCP) alongside 5% NaF, enabling 24-hour sustained fluoride and calcium release versus standard varnish contact time. GC America's MI Varnish combines 5% NaF with Recaldent (CPP-ACP) casein phosphopeptide to deliver bioavailable calcium and phosphate beyond fluoride alone; the related MI Paste Plus cream lists at approximately $184.55 per 10-tube professional pack. Ivoclar Vivadent's Fluor Protector S uses ammonium fluoride in an ethanol-based solution, achieving up to 3% local fluoride concentration on the tooth surface after solvent evaporation via its thin-film chemistry. Colgate Duraphat, the original fluoride varnish launched in 1964, holds the unique regulatory distinction of being licensed as a medicine for caries control in the UK rather than a medical device, making it the guideline-preferred product in NHS-aligned protocols.

      None of these fluoride varnish products addresses early demineralized enamel through a regenerative biomimetic mechanism; all rely on fluoride-driven surface remineralization. This is Curodont's primary product-level differentiation: subsurface hydroxyapatite-regenerating biomimetic treatment in a single visit versus repeated fluoride applications every 3-6 months. GC America's MI Paste Plus is derived from casein, a milk protein, and is contraindicated for patients with milk protein allergy—a clinical workflow consideration in practices with diverse patient populations.
