    title: "Henry Schein Exclusive US Distribution Lock-In"
    body: "Effective January 1, 2026, Henry Schein became the exclusive US distributor of Curodont across all dental segments. This agreement provides vVardis with unmatched access to every US dental practice through the dominant national dental supply infrastructure, preventing any direct competitor from obtaining the same channel for a comparable peptide-based product in the near term."
    claimRefs:
      - CP026
      - CP027

  - calloutType: risk
    title: "Fluoride Varnish Commodity Pricing Creates Adoption Friction"
    body: "Commodity fluoride varnishes at approximately $2.20 per dose are deeply embedded in hygiene visit protocols and Medicaid/private insurance reimbursement workflows. Curodont's unlisted but premium pricing requires practices to accept higher per-case cost and change established workflows, creating material friction in the cost-sensitive general practice segment and raising the adoption bar for each additional practice."
    claimRefs:
      - CP015
      - CP045

  - calloutType: insight
    title: "Staining-Free Profile Is a Structural Differentiator Against SDF"
    body: "Silver diamine fluoride's permanent black staining of treated carious lesions fundamentally limits its deployment on visible adult permanent teeth. Curodont's staining-free profile—combined with single-visit completion versus SDF's six-to-twelve month reapplication cycle—creates a strong patient-preference differentiator in adult esthetic dentistry and general practice contexts where appearance matters."
    claimRefs:
      - CP023
      - CP025
      - CP032

