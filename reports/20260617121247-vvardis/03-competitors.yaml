  - id: direct-competitors
    title: Direct Competitors and Adjacent Substitutes
    body: |
      DMG's Icon represents the most directly comparable in-office minimally invasive alternative to Curodont. Icon infiltrates demineralized enamel with a low-viscosity resin to create a physical diffusion barrier against acid, treating lesions up to the first third of dentin (D1) without drilling or anesthesia. FDA-approved and used in over 70 countries, Icon is backed by more than 400 clinical studies. DMG updated its clinical protocols in 2026 with a downloadable decision-tree resource for clinicians. Unlike Curodont, Icon does not regenerate mineral tissue; it arrests lesion progression through an artificial barrier, preserving rather than restoring natural enamel structure. DMG is a Germany-based dental materials company with a broad product portfolio and no publicly disclosed revenue or market share data for Icon specifically.

      Silver diamine fluoride products serve a distinct clinical niche: rapid caries arrest at low cost through silver's antimicrobial action and fluoride-driven remineralization. Elevate Oral Care's Advantage Arrest 38% SDF received FDA clearance in the US in 2014 as the first SDF product cleared by the agency and is backed by more than 627 indexed scientific studies. In July 2025, Elevate launched a gel-based multi-use syringe format delivering up to 100 applications per 2.8ml unit, improving handling and cost efficiency. SDI's Riva Star Aqua adds a potassium iodide whitening step that converts the otherwise permanent black silver staining to a creamy white or clear result, partially addressing SDF's primary cosmetic drawback and making it more suitable for adult esthetic cases.

      BioMin Technologies' BioMin F toothpaste deploys bioactive glass particles engineered to be 60% smaller than NovaMin-based products, enabling slower dissolution in saliva over 8-12 hours to release calcium, phosphate, and fluoride ions that form acid-resistant fluorapatite. BioMin F holds FDA 510(k) clearance as a sensitivity treatment and has been shown in studies to reduce dentinal fluid flow by up to 90%. It competes in the home-care remineralization segment rather than as an in-office professional treatment, targeting a different patient touchpoint from Curodont's clinical appointment protocol.
