      - - FDA 510(k) 许可 — K191834（Curodont Repair Fluoride Plus）
        - 美国
        - 已获许可；限于非龋洞 ICDAS 1-2 病损
        - 1（稳定）
        - 3（范围约束限制收入）
        - 营销和推广材料受限于获批适应证；HCP 教育项目
        - 如果诊所用于龋洞病损，存在标签外使用责任；还承担不良事件报告义务
        - 向 vVardis 要求上市后监测数据；在 FDA Access 数据库查看 510(k) 摘要
      - - CE 标志 — EU MDR 过渡合规（Curodont）
        - 欧盟 / 瑞士
        - CE 标志最初于 2012 年按 MDD 签发；EU MDR 2017/745 要求到 2027 年完成全面过渡；合规状态未公开披露
        - 3（可能失效）
        - 4（欧盟市场准入有风险）
        - 公司可能正在更新 EU MDR 技术文件；未公开披露公告机构接触情况
        - 如果 EU MDR 认证失效，Curodont 将失去欧盟市场准入；这会实质影响国际扩张论点
        - 向 vVardis 管理层索取 EU MDR 路线图和公告机构沟通文件
      - - 美国专利 US11154470B2 —— 含植物提取物的 P11-4 牙科配方
        - 美国
        - 2021 年 10 月 26 日获授权；20 年期限，按申请日推算约至 2041 年
        - 1（已授权并维持）
        - 2（覆盖一种配方变体）
        - 有效专利仍在；USPTO 记录中 vVardis 为受让人
        - 覆盖特定组合产品；基础物质组成（核心肽）可能处在更早到期窗口
        - 向 vVardis 索取完整的美国 / 欧盟专利组合清单；在 Espacenet 检索 vVardis AG 和 Credentis AG 的全部申请
      - - 核心 P11-4 物质组成专利到期 —— 源自 University of Leeds
        - 多地（美国、欧盟、瑞士）
        - 基础专利优先权日在 2000 年代中期；标准 20 年期限意味着若无 SPC 或延续案，到期风险约在 2025–2027 年
        - 3（到期窗口已进入）
        - 5（为仿制进入打开空间；摧毁定价护城河）
        - vVardis 可能持有延续专利和改良专利；确切组合寿命未披露
        - 如果核心物质组成专利已经到期或即将到期，仿制 P11-4 合成方可能在 3–5 年内进入市场
        - 开展完整 IP 尽调：索取 Credentis IP 转让记录，以及带到期时间表的完整专利组合
      - - AAPD 体外牙龈细胞毒性研究 —— 潜在负面监管信号
        - 美国（FDA、儿童安全）
        - 2025 年 LSU Health / VCU 研究已发表；不是 FDA 执法行动；vVardis 尚未公开回应
        - 2（目前为非正式信号；并非正式行动）
        - 3（可能触发 FDA 安全通报，或限制儿童适应标签）
        - vVardis 未公开回应；截至 2026 年 6 月没有 FDA 执法行动
        - 该研究仍是负面临床信号；如果后续出现更多体内数据，FDA 可能要求更新儿童安全标签
        - 监控 FDA MAUDE 数据库中的不良事件报告；向 vVardis 索取针对细胞毒性数据的临床风险评估
      - - Henry Schein 排他协议 —— 合同可执行性和期限不确定
        - 美国（合同法）
        - 截至 2026 年 6 月仍有效并执行；条款、期限和终止条款未公开披露
        - 2（交易对手信用稳定）
        - 4（终止或重谈会消除主要美国分销渠道）
        - 排他协议仍在生效；Henry Schein 被公开提及为独家分销商
        - 最低采购承诺、竞业限制范围、退出条款等完整合同条款未披露；双边锁定带来谈判筹码风险
        - 在 NDA 下索取完整商业分销协议；评估终止情景和备用分销选项
    notes: >
      本监管与法律风险登记表覆盖截至 2026 年 6 月识别出的六个主要法律、监管和合同风险领域。 发生概率和严重性评分为定性估计（1=最低，5=最高）。EU MDR 合规状态根据公开时间线推断—— 截至报告日期，vVardis
      尚未发布公开 EU MDR 合规声明。所有尽调路径都假设投资者 / 收购方可在 适当 NDA 下获取非公开公司信息。
