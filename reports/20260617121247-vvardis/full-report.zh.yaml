              vVARDIS 的全部美国收入管线都流经一个独家分销商（Henry Schein），形成结构性单一渠道依赖；若双方关系恶化，美国业务可能受到实质性损害。同时，核心 P11-4
              专利的到期日和覆盖广度未公开，长期竞争护城河无法验证。如果 IP 保护在 IPO 窗口内到期，或范围窄于公司暗示，通用肽竞争的门槛会大幅降低。
