      - number: '3.5'
        title: 证据缺口、局限与不利信号
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，多个竞争维度存在实质性证据缺口。DMG 是私有公司，不披露 Icon 的收入、单位销量或市场份额数据，因此无法准确测算树脂渗透细分规模，或将 Curodont
              相对其最接近的诊所内直接竞争者进行市场地位基准比较。公开文献缺少对诊所层面转换成本的正式量化——从氟化物涂漆方案转向 Curodont
              所需的时间、培训投入、账单代码转换负担和溢价容忍度。没有这些数据，采用率模型和客户终身价值预测仍是定性判断。


              vVardis 的不利和警示证据包括：2023 年一项系统综述指出，尽管基于肽的龋齿管理拥有广泛正向体外证据，但在证据基础被视为定论前，还需要更多随机对照临床试验；Curodont
              前期成本高于商品化氟化物涂漆（约 $2.20 / 剂）或 SDF，会在成本敏感的普通诊所中形成采用阻力；以及缺少直接比较 Curodont 与 DMG Icon
              在同一病损人群中的已发表头对头试验——这才是诊所内临床决策最相关的比较。更宽泛的 SDF 证据基础（627 多项研究）和 Icon 证据基础（400 多项研究）在数量上都大于 vVardis 的 250
              多篇出版物。尽管如此，vVardis 的证据基础实质上很强：Clinical Oral Investigations 2024 年一项随机对照临床试验发现，P11-4 加氟显著优于单独氟化物涂漆；PMC
              系统综述也确认 P11-4 再矿化拥有广泛体外证据。Henry Schein 独家协议的精确条款——期限、续约机制和竞业范围——未公开披露，限制了外部对护城河耐久性的独立评估。
