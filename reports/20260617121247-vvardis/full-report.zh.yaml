      - number: '5.3'
        title: 制造、知识产权与质量基础
        blocks:
          - type: paragraph
            body: >-
              vVARDIS 以 vVARDIS Holding AG 名义在瑞士楚格注册，并称所有 Curodont 产品均按瑞士质量标准在瑞士制造。公司未公开 ISO 13485
              认证，也未披露制造组织，这对机构投资者构成尽调缺口。创始人 Haley 和 Goly Abivardi 博士均为牙医，此前创建并出售 Swiss Smile 牙科诊所连锁（由 EQT 支持，后于 2017
              年出售给 Jacobs Holding）；创立 vVARDIS 时，他们收购了核心 P11-4 知识产权，而非从零研发。vVARDIS 将 Curodont 技术描述为已获专利，Apollo 2026 年 4
              月新闻稿称其为「首个且唯一含有非侵入性肽的配方，可在不钻牙的情况下治疗龋齿并覆盖龋损全深度」，暗示强知识产权定位。但具体专利号、权利要求范围和到期日并未公开，这是评估长期竞争护城河的重大缺口。公司获得了独立认可：Dental
              Advisor 授予 vVARDIS 2026 Innovative Company of the Year 奖，并授予 Curodont Repair Fluoride Plus 2026 Research
              Award。vVARDIS 还是 World Economic Forum Innovator Communities 成员，显示其创新路径获得牙科行业以外认可。
