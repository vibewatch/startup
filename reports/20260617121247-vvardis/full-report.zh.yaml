  - id: TV005
    title: 打破论点与止损触发器
    columns:
      - 风险 / 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - S-1 披露收入显著低于 $50M
        - 年收入披露 < $50M，而定价为 $1B+
        - 隐含倍数 >20x；同业比较显示牙科耗材无法支撑该水平
        - 回避 IPO；等待 IPO 后倍数压缩
      - - Apollo 交易被披露为结构化债务或带棘轮优先股，而非普通股权
        - 条款清单或 S-1 股本表显示清算优先权 >2x，或存在棘轮机制
        - 公众投资者排在最后；股权独角兽叙事失真
        - 立即退出，或不进入
      - - Henry Schein 分销协议终止或不利重谈
        - 公开宣布协议终止，或经济条款发生重大变化
        - 失去主要美国分销渠道，扰动近期收入增长
        - 下调至回避；监控渠道替代策略
      - - vVardis 提交 S-1 前，牙科科技 IPO 窗口关闭
        - 市场环境恶化；IPO 计划正式撤回，或推迟至 2027 年以后
        - 增长故事延后；Apollo 退出受压；二级市场价值可能跌破 $1B
        - 降低优先级；IPO 窗口重开时重估
      - - ADA D1354（Curodont）没有保险报销或报销极少
        - ADA 代码 D1354 报销率停滞在低于 30% 覆盖
        - 诊所经济性恶化；患者自费意愿卡住采用
        - 标记为 IPO 风险因素审查项；在 S-1 中监控
    notes: 触发器均为假设；截至 2026-06-17 尚未发生。阈值为作者估计；实际阈值应在 S-1 披露后重新校准。
    claimRefs:
      - CV009
      - CV013
      - CV021
      - CV033
      - CV042
      - CV043
      - CV047
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入和毛利率（FY2024–FY2025）
        - 无公开财务；所有收入估算均由代理指标推断
        - 需要它来计算实际 EV/Revenue，并与可比公司相比评估估值依据
        - 向 SEC 提交的 S-1 / F-1；联系投资者关系联系人 Thomas Rondot
      - - 股本表和优先权结构
        - Apollo 交易金额和条款结构未披露；OrbiMed 分批金额已披露，但条款未披露
        - 清算优先权和结构化下行保护可能使公众投资者明显吃亏
        - S-1 股本表；对披露条款清单开展独立法律审查
      - - 诊所层面复购率和队列留存
        - 仅引用 20% 渗透率和 3M 颗已治疗牙齿的标题数字；没有留存或重复购买数据
        - 没有留存的渗透可能代表试用而非使用；这是评估 LTV/CAC 的关键
        - 向管理层或 IPO 路演材料索取；寻找 S-1 队列分析
      - - ADA D1354 报销覆盖广度
        - 保险覆盖零散；vVardis 未披露系统性费率
        - 报销缺口是进一步渗透和经常性收入的首要障碍
        - ADA 和付款方政策审查；牙科保险研究
      - - Apollo 投资条款和治理权
        - 条款未披露；董事会席位、反稀释权或信息权范围未知
        - 治理结构影响 IPO 准备度和 IPO 后创始人控制权
        - S-1 治理章节；申报时审查未退出股本表
      - - 竞争响应和管线风险
        - 未披露详细的竞争管线响应策略
        - BioMin、SDF 和再矿化竞争者可能侵蚀 Curodont 护城河
        - 管理层问答；竞争者跟踪；S-1 风险因素章节
    notes: 优先级按形成投资判断的重要性从高到低排序。预计最终 S-1 / F-1 申报会部分回应所有项目； 申报后应聘请法律和财务顾问开展独立审查。
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV013
      - CV021
      - CV043
