      - number: '8.3'
        title: 可比估值分析——上市牙科医疗技术同行
        blocks:
          - type: paragraph
            body: >
              在缺少已披露财务报表的情况下，最可操作的锚点是牙科设备与耗材板块的上市可比公司。四家美国上市公司提供直接或相邻参照：Align Technology（ALGN）、Dentsply
              Sirona（XRAY）、Envista Holdings（NVST）和 Henry Schein（HSIC）。瑞士上市的 Straumann Holding
              AG（SAUHY）则给出高端种植体基准。这些公司覆盖完整估值区间：Straumann 凭借强种植体品牌和稳定增长，EV/Revenue 接近 7x；陷入困境的 Dentsply Sirona
              在多年经营恶化和商誉减值后，收入倍数低于 1x。

              Align Technology（ALGN）FY2025 收入 $40.35 亿，毛利率 67.2%，市值约 $130 亿，对应约 3.2–3.3x EV/Revenue。ALGN 约 30x 的 P/E 和约
              14.7x 的远期 P/E 表明市场预期盈利会显著修复。Dentsply Sirona（XRAY）FY2025 收入 $36.8 亿，但经营亏损 $4.22 亿，市值被压到约 $31 亿（P/S 约
              0.84x）——说明牙科设备公司一旦盈利失速，倍数可以迅速坍塌。Envista Holdings（NVST）FY2025 收入 $27.2 亿，增长 8.3%，利润率正在修复。Henry
              Schein（HSIC）是 Curodont 的美国独家分销商，收入约 $127 亿，市值约 $93 亿。

              把可比倍数套到 vVardis 的隐含收入区间，可以看出不透明问题：如果 vVardis 收入接近 $5000 万，Apollo 的 $1B+ 标记意味着 20x
              EV/Revenue——只有顶级增长率才能支撑的激进倍数。如果估计收入为 $1.5 亿，隐含倍数约 6.7x，与 Straumann 溢价相当。如果收入为 $3 亿，则适用与 ALGN 相近的 3.3x
              倍数。没有披露，任何收入估计都无法确认。
