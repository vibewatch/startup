  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 P11-4 临床机制
        blocks:
          - type: paragraph
            body: >-
              vVARDIS 的商业化产品组合以 Curodont 品牌的自组装肽 P11-4 配方为核心。旗舰产品 Curodont Repair Fluoride Plus 是一种低黏度专有液体，由牙科专业人员在约 3–5
              分钟内涂布到早期未成洞龋损，无需钻牙或麻醉。P11-4
              肽由天然氨基酸组成；进入酸性釉质龋损环境后，会在多孔釉质结构内自组装成纤维状生物基质。随后，该生物基质从患者自身唾液中吸引钙离子和磷酸根离子，在整个龋损深度内成核并生长新的羟基磷灰石晶体——公司称这一过程为
              Guided Enamel Regeneration（GER）。这种深层矿物再生让 Curodont 区别于只作用于表面的氟化物清漆；后者通常仅渗入龋损约 25 微米，而 Curodont Repair FP
              在咬合面可达 2,500 微米，在邻面可达 1,500 微米。产品不染色、无味，适用于所有年龄段患者（6 岁以下儿童应咨询牙医）。除 Curodont Repair FP 外，vVARDIS 还销售
              Curodont Protect，这是一种稳定化氟化亚锡凝胶，用于诊室内和居家的辅助防龋与降低敏感，适合 6 岁及以上患者。面向消费者、基于专利 WX Formula（羟基磷灰石美白与保护凝胶）的 Daily
              Oral Care 产品线补齐了组合；该线早于专业 Curodont 产品，是公司 2020 年 11 月最初推出的品牌。公司称所有产品均在瑞士可持续生产。
