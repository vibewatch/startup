      - number: '7.3'
        title: 渠道集中与运营风险
        blocks:
          - type: paragraph
            body: >
              vVardis 在美国面临异常集中的单一渠道分销依赖：Henry Schein 自 2026 年 1 月 1 日起成为 Curodont Repair Fluoride Plus
              在全部牙科市场细分（普通牙科、正畸、儿童牙科）的美国独家分销商，此前则是 2024 年 9 月建立的 DSO-only 独家协议。Henry Schein 同时分销 Dentsply Sirona NUPRO 和
              Solventum Clinpro 等竞争性氟化物清漆品牌，意味着其销售团队没有合同义务在更广泛预防类别中优先推广 Curodont
              而非替代产品。独家协议条款——期限、续约机制、最低采购承诺、竞业限制范围和终止条款——均未公开。这种信息不对称，使外部无法独立评估 Henry Schein 是否有结构性激励最大化 Curodont
              sell-through，或在 Curodont 商业重要性上升后是否会受益于重谈条款。

              制造是第二项运营集中风险。Curodont 活性成分为合成 P11-4 自组装肽，属于需要先进肽合成、受控纯化和无菌配方流程的特种药品级产品。vVardis
              未公开肽制造伙伴，也未说明是否存在冗余制造基地。如果生产集中在单一合同制造商，供应链中断（设施故障、监管停产、影响瑞士药品供应链的地缘政治限制、特定氨基酸前体原料短缺）可能中断全球产品供应，且短期内没有替代方案。对接近新型生物制品的产品而言，单一来源制造风险尤其尖锐，因为更换合同制造商需要监管重新验证。

              vVardis–Henry Schein 关系形成双向依赖：Henry Schein 是 vVardis 美国收入增长的主要杠杆，但 Henry Schein 自身正在 2025–2026 年经历多年领导层交接和
              KKR 支持的运营重组。来自 SimplyWallSt 驱动媒体（Sahm Capital，2025 年 12 月）的分析师评论认为，Henry Schein CEO 交接和 KKR
              成本计划执行是该分销商最大近期风险——分销商层面执行失误可能在不取决于 vVardis 自身表现的情况下，负面影响 Curodont 在美国的商业势头。在英国，Henry Schein 也拥有 Curodont
              独家分销权，意味着两个最大英语市场均通过同一第三方伙伴输送全部 vVardis 收入。在欧洲大陆和其他国际市场，分销安排尚未公开说明。
