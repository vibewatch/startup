      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              vVARDIS 由 Dr. Haleh（Haley）Abivardi 与 Dr. Golnar（Goly）Abivardi 联合创立，两人担任联席首席执行官。两人均在 University of Zurich
              接受牙科训练，是连续创业者，拥有二十多年牙科行业经验。Dr. Haley 于 1998 年完成 DMD 论文，Dr. Goly 于 2001 年完成。创立 vVARDIS 前，姐妹二人在 2002 年联合创立
              Swiss Smile——瑞士首家牙科服务组织，也是欧洲首个「无恐惧」牙科诊所集团。第一家 Swiss Smile 诊所于 2003 年在 Zurich Hauptbahnhof 的 ShopVille
              商场开业。瑞典私募股权公司 EQT AB 于 2013 年收购 Swiss Smile 少数股权；2017 年，瑞士 Jacobs Holding 从 EQT 和 Abivardi 姐妹手中收购控股权。2020
              年，创始人退出 Swiss Smile 及其母公司 Colosseum Dental 的持股，从而完全专注于 vVARDIS。

              2007 年，Abivardi 姐妹获得瑞士 Veuve Clicquot Businesswoman of the Year 奖。Swiss Smile
              的经历——运营诊所、洁牙师学校和全球高端口腔护理品牌——让她们拥有深厚领域经验和成熟的牙科专业网络。2026 年 4 月 Apollo 投资后，Abivardi 姐妹仍持有 vVARDIS 约 70%
              多数股权，保留运营控制权。公司治理包括外部董事会，关键执行职能由联席 CEO 和一名 CFO 承担（除搜索型数据外，身份和团队规模未公开披露）。研究窗口内未发现重大领导层离任。
