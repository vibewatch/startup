      - number: '4.5'
        title: 财务缺口、证据透明度与尽调结论
        blocks:
          - type: paragraph
            body: >
              vVARDIS 体现了私营、IPO
              前医疗科技独角兽典型的财务不透明。收入、毛利率、现金消耗率和现金头寸均无公开数据，投资者若无法特权访问公司账簿，就无法做传统财务承销。这形成了信息不对称的尽调格局：投资者必须把采用指标、背书、轮次估值、分销商质量等定性信号当作财务健康的代理变量。

              公司处于私营状态，因此不存在强制性的瑞士、美国 SEC 或同等财务监管申报。公共领域仅有的财务数据点包括：机构资本总额（OrbiMed $85 million，加 Apollo 未披露金额）；投后估值基准（超过
              $1 billion）；采用指标（300 万颗牙齿、20% 牙科诊所渗透率）；以及增长率排名（品类中增长最快制造商）。这些都不能替代收入、利润率或盈利能力数据。

              关键承销阻碍包括：(1) 没有收入或利润率披露；(2) 保险报销不确定，限制患者可及性并压缩牙医采用经济性；(3) 主要已发表成本效益研究存在潜在利益冲突；(4) 唯一渠道依赖 Henry
              Schein，而其分销利润条款不透明；(5) 第三方收入估计与超过 $1 billion 估值所隐含的收入倍数过高。若 IPO 完成，公司必须提交
              S-1，披露审计财务、收入、成本结构和风险因素——对需要财务透明度的投资者而言，IPO 是实质性的降风险事件。
