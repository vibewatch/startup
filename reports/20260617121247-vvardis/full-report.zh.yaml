  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 报销与采用风险
        blocks:
          - type: paragraph
            body: >
              vVardis 增长轨迹面临的最重大近期风险，是 Curodont Repair Fluoride Plus 在美国缺乏可靠保险报销。尽管产品自 2019 年起获得 FDA clearance，并截至 2026
              年 4 月已被约 20% 美国普通牙科诊所快速采用，但它没有美国付款方普遍认可的专属 Current Dental Terminology（CDT）程序代码。牙科诊所目前在通用预防或龋齿管理代码下为
              Curodont 计费（D9910、D9999 或 D4381
              变体，取决于付款方和临床表述），报销结果从部分私人计划全额覆盖到另一些计划以研究性或实验性治疗为由直接拒付不等。若干美国付款方将覆盖限制在特定牙面或患者群体（例如仅前牙或儿童患者），导致成人后牙龋损治疗无法报销。

              ADA Health Policy Institute 2025 年第四季度「Economic Outlook and Emerging Issues in Dentistry」调查发现，超过 55%
              美国牙医将低保险报销列为进入 2026 年的首要挑战——这是该问题首次超过人员短缺。ADA 同期数据显示，报销率没有跟上通胀和诊所管理成本上升。对 Curodont 这样高端定价的新型耗材（零售价约每盒 10
              次用量 $349–$389）而言，报销不确定构成主流采用的结构性刹车，原因包括：(a) 患者以 PPO 保险为主的诊所承压，需要限制未覆盖程序；(b) 每次施用 $30–$60+
              的患者自付责任，在价格敏感市场形成可负担性壁垒；(c) 施用治疗的牙科洁牙师和助理需要分配时间，而该流程必须产生足够收入才能合理化。ADA 2025 年第四季度调查中，估计 35% 牙科诊所表示 2026
              年可能退出部分保险网络，这或许为未覆盖高端治疗的采用带来部分顺风，但转变缓慢且不均衡。若付款方覆盖不扩大，Curodont 的可服务市场将被结构性限定，主要局限于按服务收费、DSO 费率表和自费人群。
