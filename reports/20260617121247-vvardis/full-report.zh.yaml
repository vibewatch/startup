      - number: '1.5'
        title: 里程碑、增长与不利背景
        blocks:
          - type: paragraph
            body: >
              Curodont Repair Fluoride Plus 于 2024 年初在美国上市后，vVARDIS 获得了快速商业采用。到 2026 年 1 月，美国 24 个月内已治疗超过 200 万颗牙；到 2026
              年 4 月，该数字超过 300 万。该产品被称为 2024 年相较 2023 年以及截至 2025 年 6 月 YTD 同品类增长最快牙科产品（据 SDM Northcoast）。关键分销里程碑包括：2024 年
              9 月，Henry Schein 成为 DSOs 独家分销商；自 2026 年 1 月 1 日起，Henry Schein 将独家范围扩展至所有美国牙科细分（普通、正畸、儿科）。主要 DSO 合作包括 Aspen
              Dental 和 Heartland Dental 等早期采用者。2024 年 6 月，vVARDIS 与 VideaHealth 宣布 AI 集成合作，将早期龋齿检测与 Curodont 治疗连接起来；2025
              年 5 月，Pearl AI 宣布与 vVARDIS 展开全球合作。2026 年 1 月，创始人在 J.P. Morgan Healthcare Conference 演讲——此前 JPMorgan CEO
              Jamie Dimon 曾在该行 2025 年 San Francisco 会议上亲自称赞 vVARDIS。

              一个重要不利背景是：截至 2026 年，Curodont 在美国缺乏常规保险报销。American Dental Association 于 2026 年 1
              月记录，超过半数牙医将低保险报销列为首要担忧；新的未覆盖治疗在走向主流采用时面临结构性障碍。除商业里程碑外，vVARDIS 不公开披露收入或财务指标，限制了外部对增长主张的独立验证。研究期间未发现涉及
              vVARDIS 的监管执法、产品召回或法律诉讼。
