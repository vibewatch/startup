  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与买方—使用者—付款方路径
        blocks:
          - type: paragraph
            body: >-
              vVardis 的直接客户是牙科诊所——无论是独立普通牙科诊所、专科诊所（正畸、儿童牙科），还是 Dental Service Organization（DSO）。买方是诊所或其采购职能；临床使用者是把
              Curodont Repair Fluoride Plus 涂到牙齿上的牙医或受训牙科洁牙师；付款方则是患者（自费）或患者的牙科保险公司（若覆盖）。在美国市场，自 2026 年 1 月 1
              日起，所有采购路径均通过独家分销商 Henry Schein，覆盖普通牙科、正畸、儿童牙科和 DSO。在这次扩张之前，Henry Schein 自 2024 年 9 月起仅拥有 DSO 独家权。Henry
              Schein 是全球最大牙科供应公司，全球客户超过 100 万，立即让 vVardis 以规模化方式触达完整执业者群体。在英国，Henry Schein 也拥有独家分销权；mydentist
              是英国最大牙科服务商，拥有约 500 家诊所和 400 多万患者，担任主要 DSO 合作伙伴。vVardis 的客户基础本质上是 B2B（面向诊所），同时通过 vvardis.com 上的「Find a
              Curodontist」患者门户叠加一层 B2C，制造消费者拉动，并部分降低纯分销商依赖。Curodont 仅治疗早期（未成洞）龋损，因此可服务患者范围限定在约 80%
              有早期龋坏却在传统「观察等待」路径下离开诊所、未获治疗的牙科患者。
