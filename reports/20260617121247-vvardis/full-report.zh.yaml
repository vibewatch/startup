      - number: '2.5'
        title: 相互矛盾的规模估算与证据缺口
        blocks:
          - type: paragraph
            body: >
              三类证据歧义影响本市场分析。第一，全球牙龋治疗市场的分析师规模估算在可比基准年相差 USD 1–2
              billion，因为不同分析师划定边界不同——有的纳入完整修复材料类别（复合树脂、汞合金、牙髓封闭剂），有的则把范围收窄到预防和早期干预产品。这让 2025–2026 年 TAM 区间落在约 USD 7.6
              billion（窄预防口径）到 USD 9.4 billion（宽治疗口径）。第二，非侵入式、基于肽的早期龋齿治疗子细分没有独立分析师拆分，vVARDIS 的 SAM 和 SOM
              估算因此是推断而非直接来源。第三，Curodont 专属的保险支付方接受数据未公开——截至 2026 年中，美国商业保险和 Medicaid 项目中有多少比例会报销该程序仍未知，这是收入预测的实质缺口。

              2025 年随机对照试验（RCT）显示，Curodont Repair Fluoride Plus 实现龋损阻止的几率显著高于 Duraphat
              氟化物涂漆（AOR=6.46），提供了扎实临床证据；但临床疗效和市场采用是不同驱动因素。P11-4 再矿化的临床证据基础如今已超过 230 篇同行评审出版物，包括一项长期真实世界证据研究显示成功率
              90%+；但截至 2026 年，多数美国牙医仍处于早期认知或试用阶段，而非日常采用。
