      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >
              Curodont 是诊所内专业产品，必须由持证牙科临床人员施用；它不能 OTC
              购买。因此采购决策由牙科诊所或牙科专业人士作出——他们是买方，而不是患者。用户是接受治疗的患者。支付方通常是牙科保险承保人（覆盖基础或预防服务），或在保险不覆盖程序时自费的患者。

              2026 年，美国牙科市场约有 178,000–190,000 家诊所、约 202,000–203,000 名专业执业牙医。vVARDIS
              相关的三类核心买方是：独立普通牙科诊所（按数量占多数）、儿科和正畸专科诊所（白斑病损发生率高），以及 dental service organizations（DSOs）。DSOs 在 2026 年已管理约
              35% 美国牙科诊所（2017 年约 8.8%），由于集中采购和方案标准化，成为重要性不成比例的渠道。Henry Schein 与 vVARDIS 于 2024 年签署的 DSO 独家协议，自 2026 年 1
              月 1 日起扩展至整个美国牙科市场。

              产品采购预算由诊所承担，临床治疗费用由支付方或患者承担。截至 2026 年，约 27% 美国成年人——约 7200
              万人——没有牙科保险，既代表结构性覆盖缺口，也可能是可及早期干预工具的潜在未充分服务市场。非侵入式早期龋齿疗法未获保险覆盖，仍是有意义的采用约束；在自费价格敏感度最高的独立诊所细分中尤其如此。
