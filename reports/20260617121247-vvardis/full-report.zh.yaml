  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Apollo 投资、独角兽身份与 IPO 路径
        blocks:
          - type: paragraph
            body: >
              2026 年 4 月，Apollo 管理的基金进行战略性少数股权投资，把 vVardis 估值定在「超过 $10 亿」；vVardis
              因而成为欧洲少数估值超过十亿美元的私营医疗健康公司之一。交易双方均未披露财务条款。交易后，创始人 Dr. Haley 和 Dr. Goly Abivardi 仍保留约 70%
              的多数股权，延续了寻求最终上市的成长型医疗技术公司常见的创始人控制治理。Apollo 是全球最大另类资产管理机构之一，截至 2025 年 12 月 31 日 AUM 约 $9380
              亿；其称该交易为「战略」投资，用于支持 Curodont 在美国和欧洲继续全球扩张。

              不到六周后，Bloomberg 于 2026 年 6 月 1 日报道称，vVardis 正与 JPMorgan Chase 和 Goldman Sachs 合作推进可能在 2026 年完成的美国
              IPO。据知情人士称，公司 IPO 估值很可能高于 Apollo 给出的 $1B+ 标记。vVardis、JPMorgan 和 Goldman Sachs 代表均拒绝置评。截至 2026 年 6 月 17
              日运行日，公司尚未向 SEC 提交 S-1 或 F-1，因此所有估值信号仍来自私募市场交易和第三方报道。从 Apollo 交割到被报道选择 IPO
              银行仅约七周，这一速度并不寻常，可能反映了异常强的投资者需求，也可能是创始人借势推进资本化。
