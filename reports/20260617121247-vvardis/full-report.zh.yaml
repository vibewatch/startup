        - 支付方覆盖有限；诊所承担成本或通过 D9999 计费
        - 400+ 项临床研究；FDA 批准
        - 每次治疗约 $40–80（估计）
        - ICDAS 1–2 诊室治疗最接近的直接竞争者；酸蚀步骤让机制不同；尚无已发表的与 Curodont 直接比较 RCT
      - - CPP-ACP 产品（MI Paste Plus）
        - GC America
        - 有限；OTC / Rx 居家使用
        - 研究充分的 Recaldent 技术；可用于诊室和居家护理
        - 每管约 $18–19（居家）
        - 更像辅助产品而非诊室治疗；酪蛋白过敏禁用；临床场景中的直接竞争压力较低
      - - 观察等待（不治疗）
        - 现状临床不作为
        - 患者零成本
        - 无需证据；数十年的临床标准
        - $0
        - 按数量计是最大替代风险；只有靠诊所教育、临床流程整合和患者需求才能跨过去
      - - 下一代肽配方
        - 学术衍生公司（Leeds、ETH Zurich 等）
        - 截至 2026 年 6 月尚未商业化或获批
        - 早期出现；RCT 处于商业化前阶段
        - Unknown
        - 如果基础 Credentis IP 到期，3–5 年视角下存在实质风险；取决于学术成果转商业化的时间表
    notes: >
