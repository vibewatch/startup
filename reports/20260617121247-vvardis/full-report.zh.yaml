  - id: TE003
    title: vVARDIS 技术与运营架构
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - P11-4 自组装肽（核心活性成分）
        - 生物基质支架，使羟基磷灰石在整个病损深度内定向再生
        - 创始人收购的学术 IP；瑞士肽合成 / 制造
        - 专利到期时间未披露；到期后竞争对手复制风险
      - - 低黏度液体配方（一次性涂布器）
        - 递送载体；通过釉质孔隙毛细扩散至 2,500µm 深度
        - 瑞士制造；假定为洁净室生产，但公开信息未确认
        - 未披露独立 CMO；单一来源供应集中风险
      - - 次氯酸钠表面处理步骤
        - 去除获得性膜，使 P11-4 扩散进入病损
        - 诊室内培训要求；牙科诊所供应链
        - 相比更简单的竞争品（SDF、氟化物清漆）多一道方案步骤；增加培训负担
      - - 唾液钙 / 磷酸盐矿物储库
        - 羟基磷灰石晶体原位形成所必需的共反应物
        - 患者自身生物条件；需要足够唾液流量
        - 口干症患者效果不佳；受损患者需要辅助矿物补充
      - - Henry Schein 美国 / 英国独家分销
        - 美国和英国商业化、物流、牙科销售队伍
        - 合同排他；2026 年 1 月起覆盖美国所有细分市场
        - 单一渠道依赖；一旦合作关系受扰，美国收入会停摆
      - - AI 检测合作伙伴（Pearl、VideaHealth）
        - 借助牙片分析发现可治疗的早期病灶，推动 Curodont 采用
        - 第三方 AI 平台合同；通过 Henry Schein 共同合作
        - 集成深度未按合同披露；AI 检测准确率会影响治疗转化率
      - - vVARDIS e-learning / Curodontist 认证
        - 保证临床医生施用质量和流程执行，推动专业端采用
        - vVARDIS 运营的数字培训平台
        - 培训并非州政府强制；流程可能偏离；没有公开完成率数据
    notes: 架构来自公开产品页面、新闻稿和专业门户。制造细节和 CMO 关系未公开披露；相关假设已相应标注。
