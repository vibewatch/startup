            body: >-
              2026 年 6 月对「vvardis」或「curodont」的 GitHub 搜索仅返回五个无关仓库，确认 vVARDIS 没有开发者社区、没有公开
              API，也没有软件平台护城河。其防御性完全来自生物医学：专有肽化学、多市场监管 clearance、积累的临床证据和分销独家性。它与软件驱动型医疗公司在结构上不同，投资者尽调需要生物医学 IP
              和监管专业能力，而不是技术平台分析。
