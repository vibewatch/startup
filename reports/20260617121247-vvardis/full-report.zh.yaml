chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与创立
        blocks:
          - type: paragraph
            body: >
              vVARDIS Holding AG 是一家高增长牙科医疗科技公司，法律注册地在瑞士 Zug。实体由牙医创业者姐妹 Dr. Haleh Abivardi（Haley）与 Dr. Golnar
              Abivardi（Goly）于 2019 年 8 月创立，两人均毕业于 University of Zurich 牙科项目。2020 年，vVARDIS 收购 Credentis AG；这家瑞士生物科技公司开发了
              Curodont™ 产品线背后的 P11-4 仿生肽技术，也让 vVARDIS 的公司身份基本落定为牙科治疗公司。公司还在 2020 年 11 月公开推出面向消费者的口腔护理品牌。行业数据库将 vVARDIS
              归类为牙科医疗科技公司；公司把自身定位在仿生科学与预防牙科的交叉点。

              公司总部位于瑞士 Zug，这里是瑞士重要的金融和企业中心。Dr. Haley Abivardi 常驻 Zug；Dr. Goly Abivardi 常驻 Zurich，两座城市相距约 25
              km。公司在美国（近期主要增长市场）、欧洲市场和中东开展商业运营。2026 年 4 月 Apollo 新闻稿引用的法律实体名称为 vVARDIS Holding
              AG。公司将使命描述为「创造一个龋齿治疗无痛、可再生且人人可及的世界」，公共健康口号是「Save Teeth, Save Lives」。vVARDIS 是 World Economic Forum
              Innovator Communities 成员，并获 Dental Advisor 评为 2026 Innovative Company of the Year。
