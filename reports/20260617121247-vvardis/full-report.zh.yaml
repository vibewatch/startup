          - type: callout
            title: 无染色特征是相对 SDF 的结构性差异
            body: >-
              Silver diamine fluoride 会让处理过的龋损永久变黑，根本限制了它在可见成人恒牙上的部署。Curodont 的无染色特征，加上单次就诊完成、无需像 SDF 那样每 6 至 12
              个月重新应用，在重视外观的成人美学牙科和普通诊所场景中形成强患者偏好差异。
