  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与渠道经济性
        blocks:
          - type: paragraph
            body: >
              vVARDIS 通过两条主要渠道产生收入：向牙科诊所销售 Curodont 产品的 B2B 专业耗材业务，以及 DTC 口腔护理线。专业渠道是目前最主要的收入驱动，核心是牙科诊所反复补货采购 Curodont
              Repair Fluoride Plus。截至 2026 年 1 月 1 日，Henry Schein 持有美国所有牙科市场细分——普通牙科、正畸、儿科牙科和 Dental Service
              Organizations（DSOs）——的独家分销权；该范围由 2024 年 9 月最初约定的 DSO-only 独家扩展而来。Henry Schein
              也担任英国独家分销商，并在其他国际市场持有非独家权利。单一分销商模式让美国收入集中在一个渠道伙伴，带来渠道集中风险，同时也让公司接入 Henry Schein 全球超过 100 万名牙科专业客户的网络。

              Curodont Repair Fluoride Plus 通过美国牙科供应渠道向牙科诊所的定价约为每盒 10 支一次性敷器 $349.98 至 $388.87。落到诊所层面，批发单次应用成本约为
              $35–$39。由于缺乏广泛保险覆盖，牙科诊所通常按每颗治疗牙 $80–$160 向患者收费，作为自费程序。Curodont 没有专用 ADA Current Dental
              Terminology（CDT）code；诊所使用 D1354（interim caries-arresting medicament
              application）等既有码计费。这些代码下的保险报销高度可变且不一致：有些支付方将 Curodont 归为实验性并完全拒付，另一些按牙面或患者年龄限制覆盖，且 SDF
              时代代码解释下的频次限制也会适用。这种报销不确定性构成有意义的采用障碍，影响可通过保险支付的可服务患者人群规模。

              vVARDIS 的 DTC 消费者线——包括牙膏、再矿化精华和美白产品——提供次级且目前更小的收入来源。DTC 品牌受益于专业 Curodont 产品线临床可信度带来的光环效应，但具体 DTC
              收入贡献未公开披露。
