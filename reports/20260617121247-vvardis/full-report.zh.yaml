  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              牙龋治疗市场涵盖用于诊断、预防、阻止或修复龋齿损伤的产品和程序；龋齿是全球最普遍的非传染性疾病。分析上，该市场可分为三类治疗：（1）预防产品——在成洞前使用的氟化物涂漆、封闭剂和抗菌剂；（2）早期非侵入式干预——仿生再矿化剂、silver
              diamine fluoride（SDF）和树脂渗透，在不钻牙的情况下治疗非成洞或早期成洞病损；（3）修复和牙髓程序——补牙、牙冠、根管和拔牙，用于处理晚期或成洞疾病。修复材料按收入主导整体市场，约占全球支出的
              38%；vVARDIS 所瞄准的非侵入式早期干预类别仍是新兴但快速增长的子细分。

              vVARDIS 可服务市场纳入的支出，是由持证牙科临床人员在诊所内施用、用于早期龋损的专业治疗产品；排除支出包括 OTC 消费者口腔护理、正畸器械、美容程序和高级修复工作。关键邻近领域包括诊断影像（AI
              辅助龋齿检测）和预防性洁治。多数患者的现状替代方案是观察等待——监测病损但不主动治疗——这也是 vVARDIS 的 Curodont 明确要替代的常见做法。
            claimRefs:
