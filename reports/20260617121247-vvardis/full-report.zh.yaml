      - number: '4.4'
        title: 资本充足性、融资历史与 IPO 轨迹
        blocks:
          - type: paragraph
            body: >
              vVARDIS 在 2025 年通过 OrbiMed 两轮融资合计募集 $85 million——2 月首轮 $35 million，7 月追加 $50 million——并在 2026 年 4 月获得
              Apollo Global Management 一笔未披露金额投资。OrbiMed $85 million
              募资用途被表述为「为现有融资安排再融资，并支持公司的增长举措和持续全球商业扩张」，这明确确认了此前存在需要偿还的债务义务。公司未披露用于再融资与增长投入的金额拆分。

              Apollo 投资将投后估值推高至超过 $1 billion，赋予公司独角兽地位。Apollo 的具体投资金额未披露。Apollo 之后，vVARDIS 联合创始人 Haley 和 Goly Abivardi
              博士仍持有约 70% 多数股权，说明所有机构轮次合计带来的创始人稀释约为 30%。早期支持者包括 David Wertheimer（Chanel 财富继承人，通过 1686 Partners）和
              Duxebridge Capital（为创始人提供顾问服务的欧洲多家族办公室）。

              到 2026 年 6 月，vVARDIS 正在探索美国 IPO，并已聘请 JPMorgan Chase 和 Goldman Sachs 担任顾问。Bloomberg 于 2026 年 6 月初报道称，IPO
              可能在年内发生，估值高于 2026 年 4 月 $1 billion 门槛。最终 IPO 决定尚未作出；时间取决于市场条件。IPO 准备在 Apollo 投资约两个月后启动，时点上与 Curodont
              商业化数据成熟相重合，也赶上 JPMorgan CEO Jamie Dimon 在该行 2025 年旧金山医疗健康会议上背书后投资者兴趣升温。

              公司未公开月度现金消耗率和现金跑道。鉴于 2025 年机构资本募集总额至少为 $85 million，另有 Apollo 未披露金额，如果消耗率符合一家拥有 54–144
              名员工、处于商业化阶段的医疗科技公司，公司至少拥有数个季度运营跑道。CFO 为 Thomas Rondot，负责投资者关系。William Blair & Company 担任 OrbiMed
              轮次财务顾问；McGuireWoods LLP 与 Rüd Winkler Partner AG 担任法律顾问。
