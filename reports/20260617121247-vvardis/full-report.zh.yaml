              2026 年，DSOs 管理约 35% 美国牙科诊所，高于 2017 年的 8.8%。Henry Schein 一旦在大型 DSO 内推动 Curodont
              采用，标准化采购方案就能同时把产品部署到潜在数百个网点。Henry Schein CEO 明确称 Curodont「有潜力成为我们最重要的耗材产品之一」，显示出认真的商业承诺。短期内，DSO 渠道是
