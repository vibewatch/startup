      - number: '3.4'
        title: 分销护城河、锁定与转换动态
        blocks:
          - type: paragraph
            body: >
              vVardis 近期最耐久的单一竞争护城河，是 Henry Schein 自 2026 年 1 月 1 日起在美国所有牙科细分——普通牙科、正畸和儿科——独家分销 Curodont。Henry Schein
              的全国销售基础设施通过其主导分销地位触达每一家美国牙科诊所；早期诊所内龋齿治疗竞争者中，没有哪家能让可比产品获得同等渠道。在全面市场扩展前，vVardis 报告 Curodont 已进入约 20%
              美国普通牙科诊所，自上市以来全球治疗超过 300 万颗牙。据 SDM Northcoast 数据，在其增长率类别中，Curodont 在 2024 年相较 2023 年及 2025 年 YTD 的年销售额超过
              $1 million 牙科制造商中排名第一。


              这条分销护城河也有细节差异：Henry Schein 同时分销 NUPRO、Clinpro 等竞争性氟化物涂漆品牌，因此独家是产品层面，而非品类层面。诊所层面的多归属很常见——同一次就诊中，Curodont 用于
              ICDAS 1-2 病损管理，氟化物涂漆用于常规预防应用，两者通常互补而非互斥，这缓和了近期正面对替代压力。从氟化物涂漆切换到 Curodont，需要洁牙师工作流适配、CDT code
              采用、患者教育和溢价接受；这些行为转换成本会给初始采用制造摩擦，但诊所采用方案后并不能维持锁定。


              通过 Credent 获得的 P11-4 专利独占权形成直接复制的技术壁垒；截至 2026 年 6 月，尚无其他商业化自组装肽用于诊所内早期龋齿治疗。Solventum（原 3M）于 2024 年将牙科部门从
              3M 更名为 Solventum，但保留 Clinpro 产品线，说明竞争集合没有结构性变化。独家分销、专利保护、250 多篇科学出版物、WHO
              非侵入式牙科指南对齐，以及单次就诊、无染色方案，共同构成纵深防御竞争地位，既有氟化物涂漆制造商无法快速复制。
