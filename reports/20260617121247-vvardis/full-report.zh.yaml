      - number: '5.4'
        title: 分销架构与数字工作流集成
        blocks:
          - type: paragraph
            body: >-
              vVARDIS 在美国的商业化建立在单一独家分销商之上：Henry Schein，这家全球最大牙科供应公司 2024 年收入超过 $12.7 billion。2024 年 9 月宣布的初始 DSO-only
              独家安排，自 2026 年 1 月 1 日起扩大到覆盖美国全部牙科市场细分——除 DSO 外，还包括普通牙科、正畸和儿童牙科。Henry Schein
              还拥有英国独家分销权，并在部分市场拥有非独家国际权利。集中分销结构加速市场渗透，但也带来单一渠道依赖风险。除直接分销外，vVARDIS 还形成了两项 AI 驱动的「检测—治疗」工作流集成。2024 年 6
              月，vVARDIS 与 VideaHealth（Videa）宣布合作，使 Videa 的牙科 AI 平台能够识别适合 Curodont 治疗的早期龋损；该平台每天被主要 DSO 中超过 30,000
              名临床医生使用，两家公司均通过 Henry Schein 运营。2025 年 5 月，vVARDIS 与 Pearl 宣布全球合作，借助 Pearl 的 AI 放射影像分析发现可由 Curodont
              非侵入性治疗的早期龋齿。公开提及采用 Curodont 的具名 DSO 客户包括 Aspen Dental 和 Heartland Dental，见 2026 年 1 月 JP Morgan Healthcare
              Conference 新闻稿。这些集成把 Curodont 放入 AI 增强预防工作流，但数据共享协议深度和合同条款并未公开。
