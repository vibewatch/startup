      - number: '5.5'
        title: 技术限制、风险与战略路线图
        blocks:
          - type: paragraph
            body: >-
              尽管临床差异化明显，Curodont 的适用边界很清楚。产品仅适用于未成洞、早期釉质龋；一旦龋损成洞（牙本质暴露），Curodont
              便无效，仍必须采用传统钻磨和修复。其机制依赖足够唾液钙和磷酸盐水平；严重口干患者可能需要辅助矿物补充才能获得完整收益。施用流程要求在肽扩散前进行次氯酸钠预处理，相比银二胺氟（SDF）或氟化物清漆等更简单替代方案，增加了准备步骤和额外培训要求。公司通过
              e-learning 提供「Curodontist」专业认证项目，但施用质量取决于临床医生，美国各州并未强制培训。商业层面，全部美国销售独家依赖 Henry Schein
              这一单一分销商，是主导性结构风险。技术平台层面，vVARDIS 没有公开 GitHub 存在、没有开发者 API，竞争优势在于生物医学创新——专有肽化学、监管 clearance 和 25
              年以上临床证据——而非软件。2026 年 6 月 GitHub 搜索「vvardis」或「curodont」仅返回五个结果，且均不代表公司赞助的技术开发。展望未来，据 2026 年 6 月报道，vVARDIS
              正在探索美国 IPO，并已委任 JPMorgan Chase 和 Goldman Sachs 担任承销商；IPO 将为进入新市场（中东、更多欧洲市场）、研发和营销扩张提供资本。公司已进入中东，并据称截至 2026
              年 4 月正在当地快速扩张。
