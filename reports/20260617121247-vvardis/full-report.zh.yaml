      - number: '7.2'
        title: 监管、IP 与临床范围风险
        blocks:
          - type: paragraph
            body: >
              Curodont Repair Fluoride Plus 仅在 Section 510(k) 下获得 FDA clearance，用于再矿化和早期未成洞龋损管理（ICDAS 1–2 白斑病损）。这一监管
              clearance
              边界明确排除成洞龋损、牙本质龋和晚期龋坏——把可服务患者人群限制在龋病谱中早期、可见但尚未成洞的部分。尽管多数到洁牙预约就诊的患者都有某种程度早期龋损活动，治疗还是「观察等待」的临床决策取决于专业判断，并随执业者、诊所理念和诊断设备（ICDAS
              评分、激光荧光、放射影像）而变化。扩展适应证主张——例如用于尚未在放射影像上可见的邻面下层病损——会带来文档要求和潜在 off-label 风险，保守诊所可能因此回避。2012 年 CE 标志覆盖
              EU/瑞士市场下类似未成洞适应证；未有实质性上市后安全问题被公开报告。

              Curodont 背后的知识产权基础是 P11-4 自组装肽技术，源自 Credentis AG（现已通过 2020 年收购完全并入 vVardis）。公开专利记录显示，vVardis AG
              至少持有一项已授权美国专利（US11154470B2，2021 年 10 月 26 日授权），覆盖结合 P11-4 与植物提取物的牙科护理配方。基础 P11-4 物质组成专利的优先权日期可追溯到 2000
              年代中期 Leeds University 研究；按最早优先权日起标准 20 年专利期限，部分核心申请若没有补充保护证书或继续申请，可能在 2025–2027 年前后到期。vVardis
              可能持有一组后续申请（配方改进、施用方法、组合产品），把排他期延伸到单一到期之外，但完整 IP
              组合的确切范围、司法辖区覆盖和剩余寿命均未公开。这形成无法量化但重大的专利悬崖风险，尤其是核心物质组成保护失效后，第三方肽合成商若开始验证通用 P11-4 制造能力，风险会更突出。

              Keeper 等人在 2023 年发表于 JADA 的系统综述与荟萃分析确认，Curodont Repair（CR）可能显著提高龋齿停止率（RR 1.82，NNT 2.8），并可能让病损面积减少
              32%。但同一系统综述也指出，纳入的六项试验中有两项评估者未盲法，且所有试验均存在较高偏倚风险。关键在于，Curodont Repair Fluoride
              Plus（当前美国上市、含氟产品）的临床试验没有被纳入——证据基础来自此前的 Curodont Repair 配方。2025 年一项儿童牙科体外研究（LSU Health Sciences /
              VCU）发现，Curodont 对人牙龈成纤维细胞的细胞毒性高于氟化物清漆，1% 浓度下细胞存活显著降低，2% 下出现形态变化——若临床实践中接触牙龈组织，这一不利信号可能引发未来监管审查或不良病例报告。
