  - id: TE002
    title: Curodont 工作流与用例表
    columns:
      - 用户任务
      - 过去工作流
      - vVARDIS 方案
      - 可衡量收益
      - 限制
    rows:
      - - 治疗早期釉质龋的 GP 牙医
        - 观察等待，或预防失败后转向钻牙
        - 在诊室内 3–5 min 应用 Curodont Repair FP；无需钻牙或麻醉
        - 龋齿失活率 80%，单用氟化物为 34%（Alkilzy RCT 2018，6 个月）；无需另约就诊
        - 仅对无龋洞的早期病损有效；不能替代晚期龋坏修复
      - - 管理早期“观察区”的洁牙师
        - 氟化物清漆或观察；没有主动治疗选项
        - AI 检测（Pearl/VideaHealth）后，同次就诊应用 Curodont Repair FP
        - 检测后直接治疗，而不是继续监测；扩大洁牙师执业范围
        - AI 集成需要采用平台；需要方案培训；并非州强制要求
      - - 有早期龋齿的儿童患者
        - 侵入式钻牙预约（幼儿往往需要镇静）
        - 不钻牙、无针、无味、3 min 治疗；无需另约就诊
        - 最长 6 年随访中阻断 / 逆转率 93%（Godenzi JADA 2023）；试验中零不良事件
        - 不适合龋洞病损；6 岁以下儿童需咨询牙医 / 医生
      - - 治疗中管理白斑病损的正畸医生
        - 氟化物清漆（仅表面）或转诊；没有深层再矿化选项
        - 正畸治疗期间使用 Curodont Protect 居家凝胶；对已形成 WSL 使用 Curodont Repair FP
        - 18 个月 WSL 发生率 7.2% vs. 14.5%（Jablonski-Momeni RCT 2026；p<0.0001）
        - 证据来自小型 RCT（n=25）；需要居家依从性
      - - 提高每次就诊预防收入的 DSO 诊所
        - 没有可计费的早期龋齿治疗；多数患者离开诊所时未获治疗
        - Curodont 作为可计费附加预防治疗（适用 CDT 代码）；增加 3 min 椅旁时间
        - Dental Products Hopper 评估者报告患者接受率 60–100%；带动诊所口碑
        - 保险报销未在所有付款方中标准化；定价和利润数据不公开
    notes: 临床结果数据来自引用的同行评议出版物。DSO 收入和诊所经济性仅为说明；实际单诊所实现收入未披露。患者接受率来自 Dental Products Hopper 独立评估者研究。
