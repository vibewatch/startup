companyProfile:
  summary: >-
    vVardis（法律实体：vVARDIS Holding AG）是一家瑞士牙科医疗科技公司，2019 年 8 月由牙医创业者姐妹 Dr. Haleh（Haley）Abivardi 与 Dr. Golnar（Goly）Abivardi
    创立；两人均在 University of Zurich 接受牙科训练，公司总部位于瑞士 Zug。公司商业化 Curodont™ 平台，该平台基于 2020 年收购 Credentis AG 时取得的 P11-4
    仿生自组装肽技术，是首个也是唯一商业化的非侵入式、基于肽的早期非成洞龋齿（ICDAS 1–2 病损）治疗方案。Curodont Repair Fluoride Plus 于 2024 年 1 月通过 Henry Schein
    独家分销协议在美国上市；到 2026 年 4 月，已覆盖约 20% 美国普通牙科诊所，并治疗约 300 万颗牙。2026 年 4 月，Apollo Global Management 以 $1B+
    投后估值进行战略少数股权投资，使公司进入独角兽行列；到 2026 年 6 月，vVardis 正在探索美国 IPO，并已委任 JPMorgan 与 Goldman Sachs。收入、毛利率和单位经济性仍未披露，IPO
    前存在实质性财务承销缺口。
