      - number: '7.5'
        title: 治理、关键人物、竞争替代与缓释措施
        blocks:
          - type: paragraph
            body: >
              对一家 IPO 前公司而言，vVardis 的关键人风险偏高。两位联席 CEO Dr. Haley（Haleh）Abivardi 和 Dr. Goly（Golnar）Abivardi
              既是姐妹、联合创始人，也是大股东。双 CEO 架构在商业化医疗技术公司里并不常见；两位创始人同时承担首席执行官、大股东（Apollo 交易后约 70%）、临床可信度代言人和对外大使几重角色。公司没有公开任命
              CFO 或机构背景的独立高管，经营权又集中在两位有亲属关系的人手中；一旦创始人的健康、关系或战略优先级变化，商业执行、财务管理、IPO 准备和利益相关方信心都可能同时受冲击。Apollo 投资后的董事会结构纳入了
              Apollo 代表（Jeremy Honeth 和 Andrea Vanni），提供了一定外部治理支点，但创始人的多数股权使任何非自愿治理干预都难以发生。

              竞争替代层面，最重要的新风险是 Curodont「唯一已商业化、基于肽的诊室龋齿治疗」定位可能被削弱。2023 年 Springer 系统综述（Zalizniak
              等）认为，基于肽的龋齿管理证据正在积累，但还需要更多随机对照临床试验，证据基础才能算最终确立。学术实验室——尤其是 University of Leeds（P11-4 最初开发地）、ETH Zurich
              和其他欧洲牙科研究中心——仍在发表下一代肽配方研究。核心专利到期后，如果基础 Credentis IP 进入公共领域，合同制造商可能以更低成本推出竞品，侵蚀先发溢价。SDF 的证据基础更大（627+
              项研究，Advantage Arrest 自 2014 年获 FDA 准入），树脂渗透的证据基础（Icon，400+ 项研究）也在数量上超过 Curodont 的 250+ 篇发表物；Curodont
              的证据并不薄，但如果支付方和 Dental Benefit Plans 偏好成熟、可报销的替代方案，临床采用速度仍有风险。

              缓释因素和论点破裂标准包括：Henry Schein 渠道护城河（没有竞争性分销协议，任何对手都难复制）、25 年 P11-4 研发投入壁垒、新肽类进入者需满足 ISO/FDA 质量体系要求，以及 ADA
              针对仿生治疗不断扩展的 CDT 编码框架。主要论点破裂条件是：（1）到 2027 年末仍无法取得美国支付方覆盖，导致纯自费市场不足以支撑 IPO 估值；（2）IPO S-1 披露毛利率低于 50%
              或经营现金流为负，需要持续外部融资；（3）Henry Schein 关系终止、重谈为非独家，或因 Henry Schein 自身战略优先级被迫重构独家安排。
