        - IPO 取消或大幅推迟（相对当前时间表超过 12 个月）；S-1 收入低于 $5M 且毛利率为负
        - 每月（Bloomberg；IPO 跟踪器；EDGAR）
        - 获取 CFO 级别财务简报；要求提供管理账；建模推导可支撑 IPO 时 $1B+ 估值的隐含收入轨迹
      - - 关键人物
        - Abivardi 创始人持续在位；高管团队扩充（CFO、COO 招聘）；董事会构成
        - 任一 co-CEO 离任或丧失履职能力，且关键运营角色没有指定继任者
        - 半年一次（新闻稿；LinkedIn 监测）
        - 将关键人物保险、指定继任计划和独立董事席位列为投资条件
      - - 临床
        - 不良事件报告（FDA MedWatch MDR）；新临床试验结果；支付方临床政策更新
        - FDA 对 Curodont 发出警告信、522 上市后研究令，或启动 Class II 召回
