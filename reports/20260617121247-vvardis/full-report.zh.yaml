            body: >-
              单剂约 $2.20 的商品化氟化物涂漆，已深嵌洁牙就诊方案和 Medicaid / 私营保险报销工作流。Curodont
              标价未列出但属于高端定价，要求诊所接受更高单病例成本并改变既有工作流，在成本敏感的普通诊所细分中制造实质摩擦，也抬高每新增一家诊所的采用门槛。
            calloutType: risk
