            title: 80% 患者患病率创造巨大未开发机会
            body: >
              任意一次就诊中，多达 80% 牙科患者出现早期龋洞，但历史上大多数人在离开诊所时没有接受治疗。这不是小众临床缺口，而是主导性患者人群。Henry Schein 自 2026 年 1 月 1
