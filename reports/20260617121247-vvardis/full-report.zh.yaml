  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 论点
      - 支撑证据
      - 何种情况会改变判断
    rows:
      - - 论点：品类开创者，没有直接的非侵入式竞争对手
        - Curodont 已获 FDA 许可，250+ 篇发表文献，2 年内渗透约 20% 美国牙科诊所
        - 出现疗效相当或更好的仿生肽产品；市场碎片化
      - - 论点：Apollo 和 OrbiMed 提供强机构背书
        - 两家一线医疗投资者参与，包含 OrbiMed 的 $85M 和 Apollo 的 $1B+ 轮次
        - Apollo 投资被披露为带下行保护的结构化债务或 SAFE，而不是 $1B+ 估值的股权
      - - 论点：借 Henry Schein 排他权撬动分销
        - Henry Schein 是美国主导牙科供应商；排他协议于 2025 年 12 月扩大
        - Henry Schein 分销协议终止，或以不利方式重组
      - - 论点：AI 顺风借早筛放大 Curodont 需求
        - 已建立 Videa AI 和 Pearl 合作；AI 龋齿检测扩大早期诊断
        - AI 检测采用停滞，或被用来支持「观察等待」流程而非治疗
      - - 反论点：没有公开财务，倍数不可核验
        - 收入 / EBITDA / 利润率零披露；截至 2026-06-17 尚未提交 IPO S-1
        - S-1 显示收入或利润率显著低于 $1B+ 估值隐含指标
      - - 反论点：牙科科技 IPO 过往表现差
        - SmileDirectClub IPO 后于 2023 年破产；Dentsply Sirona P/S 从 2x 跌至 <1x
        - vVardis 展示 IPO 后持续 3–5 年的盈利增长
      - - 反论点：20% 诊所渗透率可能高估使用深度
        - 公司自行披露的数字；没有审计、复购率或单诊所收入披露
        - 公司披露队列留存和复购率，显示诊所层面收入在增长
    notes: |
      论点和反论点均由公开证据构建；财务反论点尤其关键，因为它们直接决定 $1B+ 估值是否站得住。 这些论点反映作者截至 2026-06-17 的综合判断，应在 S-1 提交后重新审视。
