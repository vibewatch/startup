          - type: paragraph
            body: >-
              生产级采用最强证据来自具名 DSO 背书。按诊所数量计，美国最大 DSO Heartland Dental 提供了直接、公开署名的生产背书；其 Clinical Operations 高级副总裁 Timothy
              Quirt 博士表示：「Curodont 代表牙科向前迈出的变革性一步。在 Heartland Dental，我们亲眼看到这项创新如何赋能临床医生以非侵入方式治疗早期龋齿，改善疗效并加深患者信任。」Aspen
              Dental 是美国最大 DSO 品牌之一，PDS Health（前 Pacific Dental Services）也是；vVardis 创始人在 Dental Tribune 采访中将二者与
              Heartland Dental 一并列为活跃 DSO 客户。在英国，mydentist 正式建立了行业领先合作关系，计划到 2026 年在全部约 500 家诊所部署 Curodont Repair，单疗程起价
              £140；首席临床官 Nyree Whitley 也公开背书该产品。vVardis 2024 年 10 月临床病例报告 PDF 提供了来自美国牙科诊所的六个记录病例，显示治疗后 6
              个月随访时龋损回退——包括正畸后邻面龋损——且参与贡献的牙医没有获得金钱补偿。Dental Products Hopper 评估的 15 名牙科专业人士独立小组给 Curodont Repair Fluoride
              Plus 打出 4.5/5 分，患者接受度为已治疗患者的 60–100%。Harvard School of Dental Medicine 主任 German O. Gallucci 博士和 Temple
              University 牙科学院院长 Amid Ismail 教授公开背书其临床疗效。不过，任何具名 DSO 的诊所级合同细节、采购量以及更长期留存或复购率，vVardis 均未披露。
