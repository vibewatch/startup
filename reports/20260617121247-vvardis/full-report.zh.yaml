      - - 截至 2026 年初美国诊所渗透率约 20%，Henry Schein 继续铺开
        - 行为改变采用壁垒；洁牙师工作流惯性；剩余 80% 诊所对 CDT 代码计费不熟悉
        - M
        - 跟踪 Henry Schein 季度销售速度和诊所转化率；监测 DSO 账户中的洁牙方案采用数据
      - - 相较 SDF 不染色的美观优势；单次就诊对比 SDF 反复涂布
