  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              vVardis Curodont 的竞争格局覆盖牙科专业人士管理早期龋齿时可用的四类替代方案。第一，直接的诊所内微创替代品：DMG 的 Icon resin infiltration 治疗 Curodont
              所瞄准的同类 ICDAS 1-2 釉质病损，同样不钻牙，但机制是酸蚀和树脂屏障，而不是仿生再生。第二，silver diamine fluoride（SDF）产品——主要是 Elevate Oral Care 的
              Advantage Arrest 38% 和 SDI 的 Riva Star
              Aqua——阻止而非再生龋损，已在儿科和有特殊需求的成人群体中建立临床使用。第三，既有氟化物涂漆细分按用量是最大的替代品：Dentsply Sirona、Solventum/3M、GC
              America、Colgate、Ivoclar Vivadent 和 Ultradent 共同主导诊所内预防工作流，产品报销成熟、单剂约 $2，并深嵌洁牙就诊方案。第四，BioMin Technologies 的
              BioMin F 等仿生牙膏产品通过完全不同的渠道竞争家庭护理再矿化细分。所有这些类别之下，还有一个隐性现状替代品：「观察等待」做法，即大量早期龋齿患者离开美国牙科诊所时没有接受主动治疗；这是 Curodont
              要实现主流采用时必须跨过的最大替代类别。
            claimRefs:
              - CP001
              - CP013
              - CP014
              - CP037
              - CP044
      - number: '3.2'
        title: 直接竞争者与邻近替代品
        blocks:
          - type: paragraph
            body: >
              DMG 的 Icon 是与 Curodont 最直接可比的诊所内微创替代品。Icon 用低黏度树脂渗透脱矿釉质，形成抵御酸的物理扩散屏障，可在不钻牙、不麻醉的情况下治疗深至牙本质前 1/3（D1）的病损。Icon
              已获 FDA 批准，并在 70 多个国家使用，背后有 400 多项临床研究。DMG 于 2026 年更新临床方案，并为临床医生提供可下载决策树资源。与 Curodont 不同，Icon
              不再生矿化组织；它通过人工屏障阻止病损进展，保留而非恢复天然釉质结构。DMG 是总部位于德国的牙科材料公司，产品组合广泛，但未公开披露 Icon 的收入或市场份额数据。


              Silver diamine fluoride 产品服务于不同临床细分：用银的抗菌作用和氟驱动再矿化，以低成本快速阻止龋齿。Elevate Oral Care 的 Advantage Arrest 38% SDF
              于 2014 年在美国获得 FDA clearance，是该机构批准的首个 SDF 产品，并由 627 多项索引科学研究支持。2025 年 7 月，Elevate 推出凝胶型多次使用注射器规格，每个 2.8ml
              单元最多可提供 100 次应用，改善操作便利性和成本效率。SDI 的 Riva Star Aqua 增加碘化钾美白步骤，把原本永久性的黑色银染转化为乳白或透明效果，部分解决 SDF
              的主要美容短板，使其更适合成人美学病例。


              BioMin Technologies 的 BioMin F 牙膏使用生物活性玻璃颗粒，工程设计上比 NovaMin 产品小 60%，可在唾液中 8-12
              小时缓慢溶解，释放钙、磷酸盐和氟离子，形成耐酸氟磷灰石。BioMin F 作为敏感治疗获得 FDA 510(k) clearance，研究显示其可将牙本质液流降低最多
              90%。它竞争的是家庭护理再矿化细分，而不是诊所内专业治疗；相较 Curodont 的临床预约方案，它瞄准的是不同患者触点。
