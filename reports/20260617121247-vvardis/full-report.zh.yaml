      - number: '6.5'
        title: 扩张、集中风险与报销壁垒
        blocks:
          - type: paragraph
            body: >-
              客户侧，vVardis 面临两项相互牵连的结构性风险：分销商集中与报销不确定。集中度方面，Henry Schein 是美国所有牙科细分市场的独家分销商，也是英国独家分销商，vVardis
              两个最大市场都依赖单一渠道。Henry Schein 关系若因竞争性优先级调整、价格摩擦或合同重谈而恶化，vVardis 的市场触达可能受到实质性损害。创始人在 2025 年 12
              月扩展合作时称「信任基础、共同目标和已交付增长都清楚表明 Henry Schein 是合适伙伴」，这反映的是关系驱动护城河，而非结构性竞争护城河。报销方面，Curodont 没有专属 ADA CDT
              代码；诊所最常使用 D1354（临时龋齿阻断药物施用），保险公司常将其视为等同银二胺氟（SDF）的代码，导致后牙拒付，并出现不同年龄或频次限制。vVardis 的消费者 Trustpilot 页面显示评分为
              2.9/5（74 条评论），但本次研究访问时被拦截（损坏 URL）；这些评论据信覆盖更广泛 B2C 产品线，而非专业 Curodont
              临床产品。美国诊所级定价未公开。扩张目标是当前市场之外的美洲和中东；在欧洲，公司正在发展区域合作伙伴（意大利 Curodont Training Academy、英国 Dental Beauty
              Partners），并指出欧洲采用慢于美国，原因在于报销结构和临床教育要求。DSO 层面的集中风险无法量化；前三大 DSO 客户（Heartland Dental、Aspen Dental、PDS
              Health）占美国收入份额未知。
