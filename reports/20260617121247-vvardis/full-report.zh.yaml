      - number: '1.3'
        title: 技术与产品
        blocks:
          - type: paragraph
            body: >
              Curodont™ 是 vVARDIS 的核心产品平台，也是首个且唯一商业化、临床证明可治疗早期龋齿的非侵入式含肽配方。技术锚点是 P11-4
              仿生肽，它会自组装成支架，吸引唾液中的钙离子和磷酸根离子，引导羟基磷灰石晶体在早期龋损深处再生。公司将这种「Guided Enamel
              Remineralization」方法与传统氟化物涂漆区分开来：后者主要作用于牙齿表面，无法渗透到病损深度。底层科学积累超过 25 年研究，由 250
              多篇科学出版物支撑，包括荟萃分析和长期同行评审临床研究，显示记录成功率超过 90%。

              当前 Curodont™ 产品线包括两款面向牙科专业人士的主产品：Curodont Repair Fluoride Plus（旗舰款诊所内治疗，用于早期非成洞龋损，最快 3 分钟完成）和 Curodont
              Protect（用于预防的防龋、抗敏凝胶）。Curodont Repair Fluoride Plus 于 2012 年获得欧盟和瑞士 CE 标志批准，2016 年开始进入国际市场，并于 2019 年获得美国
              FDA clearance。产品仅适用于早期非成洞龋齿；成洞病损仍需传统钻磨和修复。vVARDIS 还销售加入其羟基磷灰石技术的高端 DTC 口腔护理线。全球领先牙科大学在课程中将 vVARDIS
              技术作为早期龋齿管理的标准护理引用。
