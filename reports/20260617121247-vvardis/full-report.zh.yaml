              尚未公开披露其专利组合的完整范围、剩余寿命或司法辖区覆盖。如果核心组成专利在 vVardis 完成 IPO 并建立品牌护城河前到期，合同制造商可能用等效肽配方进入市场，进而侵蚀 Curodont
