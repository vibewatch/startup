      - number: '5.2'
        title: 临床证据与监管状态
        blocks:
          - type: paragraph
            body: >-
              P11-4/Curodont 平台拥有超过 250 篇同行评审科学出版物支持，其中包括多项随机对照试验和一项长期真实世界证据研究。在发表于 Journal of Dental Research（2018）的关键
              Alkilzy 等 RCT 中，P11-4 联合氟化物清漆治疗儿童早期咬合龋，在 3 个月和 6 个月时的临床与统计表现均优于单用氟化物清漆；按 Nyvad 标准，龋损由活动性转为非活动性的 odds ratio
              为 12.2（p<0.0001），且所有受试者均无不良事件。2026 年一项前瞻性三盲 RCT（Jablonski-Momeni 等，BMC Oral Health）针对接受正畸治疗的青少年，发现居家使用含氟
              P11-4 凝胶 18 个月后，釉质脱矿降至 7.2% 牙面，而安慰剂组为 14.5%（p<0.0001），且未观察到不良反应。一项长期临床随访研究（Godenzi 等，JADA，2023 年 10 月）记录了
              93% 成功率，定义为早期邻面龋停止并回退，临床观察最长达 6 年。一项体外 microCT 研究（vVARDIS 存档数据，2025 年）显示，施用后 14 天平均相对矿物密度统计显著提升 15.7%。2025
              年一项研究（Danisman 等，Sci Rep）将 P11-4 与 CPP-ACPF 用于正畸治疗期间白斑病损管理进行比较，发现两种制剂均高度有效促进再矿化，P11-4
              表现与成熟替代方案相当。监管层面，Curodont 于 2012 年获得欧洲和瑞士 CE 标志，并于 2019 年获得美国 FDA clearance，作为持证医疗器械进入两大主要市场。美国商业版本
              Curodont Repair Fluoride Plus 于 2024 年初商业化推出。
