      - 临床证据基础
      - 每次应用价格
      - 关键替代威胁
    rows:
      - - 氟化物涂漆（5% NaF）
        - Dentsply Sirona、Solventum/3M、GC America、Colgate 与 Ultradent
        - 报销充分；标准预防性 CDT 代码（D1206、D1208）
        - 数十年 RCT 证据；74%+ 诊所采用率
        - 每剂约 $2–3
        - 深嵌洁治流程；可报销；除非 Curodont 获得 CDT 覆盖，否则不会被替代
      - - 氟化二胺银（SDF）
        - Elevate Oral Care（Advantage Arrest）与 SDI（Riva Star Aqua）
        - 许多州的 Medicaid 覆盖；CDT 代码 D1354
        - 627+ 篇索引研究；2014 年起获 FDA 许可；新凝胶形态（2025）
        - 每次应用约 $0.40–$0.60
        - 成本极低；Medicaid 报销让它成为安全网场景的优选；黑色染色限制成人美学用途
      - - 树脂渗透（Icon）
