          - type: callout
            title: 极端估值倍数，对应未披露且可能很小的收入基础
            body: >
              第三方来源估计年收入约为 $1.7 million，而 2026 年 4 月估值超过 $1 billion，隐含市销率超过 600x。即便真实收入高出 10 倍、达到 $17 million，隐含倍数也约为
              60x——仍明显高于典型医疗科技或牙科器械公司基准。在 IPO S-1 提交且审计财务披露之前，这一错配是重大承销阻碍。今天给公司定价的投资者只能完全依赖增长叙事和市场潜力，而非任何财务指标。
            calloutType: risk
            claimRefs:
              - CI031
              - CI032
              - CI030
          - type: callout
            title: 保险报销缺口形成结构性采用上限
            body: >
              截至 2026 年，Curodont 缺乏美国牙科保险的普遍覆盖，也没有专属 CDT 账单代码。使用 D1354 计费的诊所面临不稳定拒赔率，后牙牙面尤其明显，部分保险公司还将 Curodont
              归为实验性治疗。这意味着多数依赖保险的患者能否采用 Curodont，取决于自费意愿——在 Medicaid 和 PPO 占比较高的诊所中，采用速度会受限。解决报销缺口，是 vVARDIS
              达到支撑当前估值所需收入规模的关键条件。
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI006
          - type: callout
            title: OrbiMed 再融资表述暗示 2025 年前已有债务义务
            body: >
              2025 年 7 月 OrbiMed 新闻稿明确称，$85 million 募资将用于「为现有融资安排再融资，并支持公司的增长举措」。这句话确认了 OrbiMed
              轮次之前已有债务或授信义务。相关义务的金额和条款未知，但其存在意味着，$85M OrbiMed 募资中真正可用于增长的净资本低于标题金额。任何完整财务尽调都应审查这一点。
            calloutType: insight
            claimRefs:
