            body: >-
              自 2026 年 1 月 1 日起，Henry Schein 成为 Curodont 在美国所有牙科细分的独家分销商。该协议让 vVardis
              借助占主导地位的全国牙科供应基础设施，获得触达每一家美国牙科诊所的无可比拟渠道，并阻止任何直接竞争者在近期为可比的基于肽产品拿到同样渠道。
