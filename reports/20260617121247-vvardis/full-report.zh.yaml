      - number: '6.4'
        title: 留存、重复使用与诊所工作流集成
        blocks:
          - type: paragraph
            body: >-
              vVardis 未公开已发表的 NRR、GRR、队列留存或流失数据；公司仍处于 IPO 前，未披露正式账户级留存指标。若干代理信号显示，一旦诊所把 Curodont
              纳入流程，采用可能具备耐久性。产品可嵌入常规洁牙预约，不增加排期复杂度——临床人员 3–10
              分钟即可施用，无需后续预约，洁牙师认证后可独立操作。这种低摩擦工作流降低切换成本，并支持习惯性重复订货。Certified Curodontist
              项目和品牌化「Curodontist」身份，在诊所层面制造承诺和社区连接。Dental Products Hopper 的一家评估诊所在约 5 个月内治疗约 150 名患者，并报告持续使用，治疗后 2
              个月影像证据显示有效。Henry Schein CEO 公开表示，他认为 Curodont 有潜力成为「顶级耗材产品」，暗示存在有意义的重复订单活动。AI 诊断合作——Pearl（2025 年 5 月）和
              VideaHealth（2024 年 6 月）——形成先检测再治疗的工作流闭环，进一步把 Curodont 嵌入诊所方案，也让切换更具破坏性。Heartland Dental
              的公开背书同样暗示大规模持续机构承诺。评估者调查中 60–100% 的患者接受率代表治疗前意向，而非已确认复购或规模化 6 个月结果数据；正式 NRR 或续约数字缺失，是尽调中的重大缺口。
