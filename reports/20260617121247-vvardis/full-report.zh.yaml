      - number: '4.2'
        title: 单位经济性与诊所层面渠道动态
        blocks:
          - type: paragraph
            body: >
              在诊所层面，Curodont 给牙科专业人士呈现出有吸引力的单位经济性。批发成本约 $35–$39 / 次应用，患者通常按每颗治疗牙 $80–$160 付费，因此诊所层面的单次应用毛利率估计为
              50–80%。一家诊所每月为 50 颗牙应用 Curodont，可产生约 $4,000–$8,000 额外月收入，主要来自现金支付或补充保险理赔，而且无需重大资本投入或延长椅旁时间——应用耗时不到 10
              分钟，通常可委派给洁牙师。

              根据 SDM Northcoast LLC 独立分销商数据，vVARDIS 在美国所有商品和预防品类中，2024 年相较 2023 年及截至 2025 年 6 月 YTD，均在年销售额超过 $1 million
              的牙科制造商增长率排名第一。截至 2026 年 4 月，自 2024 年初上市以来，美国约 300 万颗牙已用 Curodont Repair Fluoride Plus 治疗，产品进入近 20%
              美国普通牙科诊所。

              medRxiv/CareQuest 成本效益模拟显示，相比当前实践，把 Curodont 与 silver diamine fluoride（SDF）和 glass-ionomer sealants
              组合的情景，对支付方（节省成本）和诊所（更高利润率）都产生互利结果。不过，该研究披露所有作者均由 CareQuest Innovation Partners 资助，而该机构与 vVARDIS
              存在财务关系；引用这些财务预测时必须衡量潜在利益冲突。美国推出期的独立验证单位经济性数据仍然有限。

              Henry Schein 的分销经济性未公开披露。作为美国独家渠道伙伴，Henry Schein 获取分销商利润率，使 vVARDIS
              的有效单位净收入低于列示批发价。高端牙科耗材的分销成本结构通常意味着分销商利润率为 15–35%，但 vVARDIS 专属条款尚未公开。
