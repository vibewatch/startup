      - number: '1.4'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              在 2026 年 4 月里程碑轮融资前，vVARDIS 已获得约 $85 million 机构融资。2025 年 2 月，OrbiMed——一家总部位于纽约、AUM 约 $17 billion
              的领先医疗投资机构——完成 $35 million 成长融资。2025 年 7 月，OrbiMed 完成 $50 million 跟投，使 OrbiMed 总承诺额达到 $85
              million，并支持美国商业扩张。William Blair & Company 担任 vVARDIS 在 OrbiMed 轮次中的独家财务顾问。

              2026 年 4 月 27 日，vVARDIS 宣布 Apollo 管理基金进行战略少数股权投资，公司估值超过 $1
              billion，并获得独角兽身份——成为欧洲少数私有、估值十亿美元以上的医疗公司之一。交易财务条款未披露。更早的支持者包括：David Wertheimer（Chanel 财富继承人、1686 Partners
              负责人）和 Duxebridge Capital（一家欧洲多家族办公室，担任创始人顾问）。Apollo 合伙人 Jeremy Honeth（Partner）与 Andrea Vanni（Managing
              Director）主导投资逻辑。截至 2026 年 6 月，vVARDIS 正在探索美国 IPO，并已委任 JPMorgan Chase 和 Goldman Sachs 为顾问；公司在 2026 年 4
              月轮次中估值超过 $1 billion，IPO 时可能寻求更高估值。最终 IPO 决定尚未作出，时间仍可能变化。
