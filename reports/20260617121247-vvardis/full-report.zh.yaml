            body: >-
              按牙科耗材标准看，Curodont 的采用轨迹异常突出。产品于 2024 年 1 月在美国商业化推出；到 2025 年 12 月 Henry Schein 宣布扩展至全部细分市场时，已覆盖美国超过 10%
              牙科诊所和 500,000+ 患者；到 2026 年 1 月 J.P. Morgan Healthcare Conference 时覆盖约 12% 诊所；截至 2026 年 4 月 Apollo
              投资公告，已接近美国普通牙科诊所 20%。美国治疗牙齿总数在 2025 年 7 月（上市后 18 个月）突破 100 万颗，2026 年 1 月（24 个月）突破 200 万颗，到 2026 年 4
              月美国和欧洲合计约 300 万颗。vVardis 引用的 SDM Northcoast 专有数据确认，在 2024 年对比 2023 年及 2025 年截至 6 月期间，vVardis 在美国销售额超过 $1M
              的牙科制造商中，全商品和预防类别增长率均排名第一。这些指标全部来自公司报告或专有数据集；「20% 普通牙科诊所」的分母是 vVardis 内部存档数据，尚未经过独立审计。在英国，mydentist 自 2025
              年末起先在 100 家诊所部署 Curodont Repair，并于 2026 年覆盖完整约 500 家诊所网络。采用速度由工作流简单（3–10 分钟施用、无需单独预约）、强患者接受度（评估者调查为
