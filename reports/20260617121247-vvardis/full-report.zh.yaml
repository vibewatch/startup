      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              多股结构性力量正在把牙龋治疗市场推高到历史基线之上。第一，AI 驱动的龋齿检测工具如今最高可达到 98% 病损检测准确率，扩大了在早期非成洞阶段被识别、可用非侵入式疗法处理的病损数量——也直接扩大
              Curodont 这类产品的可服务市场。第二，DSO 整合压缩销售周期：一家 DSO 决定把 Curodont 标准化，就能把产品部署到数百个附属网点；这也是 Henry Schein 2026 年 1
              月扩展至覆盖整个美国牙科市场之所以对 vVARDIS 规模化路径如此重要的原因。第三，预防性牙科治疗细分是更广泛牙科市场中增长最快的领域之一，受支付方扩大预防方案覆盖和消费者偏好非侵入式护理推动。

              约束同样实质。保险未覆盖是首要摩擦点：CDT codes D1354（silver diamine fluoride）和 D2990（resin infiltration）经常被商业保险拒付或归类为研究性项目，而
              Curodont 尚未拥有广泛采用的专用 CDT code，迫使诊所在没有保证报销的情况下处理账单和患者同意流程。基于肽的产品制造和监管复杂度增加成本：P11-4 肽合成过程昂贵，自组装又对
              pH、温度和唾液离子条件敏感——在资源较少的环境中，可能成为患者结果稳定性的障碍。此外，约 27%
              美国成年人没有牙科保险，使可触达人群集中在有保险或可支配收入较高的人群中。现有方案的转换成本理论上较低（单次就诊即可施用），但临床工作流集成和患者教育要求会在观察等待文化根深蒂固的诊所里拉长采用时间。
