      - number: '8.5'
        title: 退出准备度、建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              vVardis 已具备若干 IPO 准备度标志：已选择银行（JPMorgan、Goldman Sachs）、有具名 CFO（Thomas Rondot，据 OrbiMed
              新闻稿）负责投资者关系、刚确定独角兽估值，创始人也有 Swiss Smile 的退出记录。公司瞄准美国市场 IPO——可能提交 F-1 或 S-1 注册文件——这将要求完整 IFRS 或 US GAAP
              经审计财务、股权结构披露和风险因素展开。2026 年 IPO 窗口处在整体支持性的医疗健康资本市场环境中，上半年已有多笔医疗技术交易定价。

              在形成确信买入建议前，核心尽调问题是：（1）披露 FY2025 和 FY2024 经审计收入与毛利率，以计算真实倍数；（2）股权结构细节，包括 Apollo 交易结构（股权 vs.
              债权-股权混合、优先级栈、清算优先权）；（3）牙科诊所在 20% 渗透率头部数字之外的复购率和留存数据；（4）ADA 代码 D1354 报销率趋势；（5）EBITDA 或经营现金流，用于理解烧钱速度以及 IPO
              要满足的资本需求。在 S-1 文件披露这些信息前，合适姿态是跟踪并准备尽调资源，而不是按 $1B+ 私募标记部署资本。
