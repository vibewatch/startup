      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              2025–2026 年全球牙龋治疗市场的分析师估算差异显著，反映出范围定义不同。Mordor Intelligence 将 2025 年市场规模估为 USD 7.58 billion，并以保守 3.12%
              CAGR 增至 2031 年 USD 8.83 billion，重点放在主要治疗产品收入。GII Research（SkyQuest）估计 2024 年市场为 USD 8.9 billion、2025 年为
              USD 9.39 billion，并以 5.5% CAGR 增至 2033 年 USD 14.42 billion，采用更宽口径，纳入修复子类别。Research and Markets 的第三个估算将 2026
              年市场定为 USD 9.35 billion，并以 7.4% CAGR 迈向 2032 年 USD 14.55 billion。这些相互矛盾的估算被保留，用作分析师群体真实范围歧义的证据。

              北美约占全球牙龋治疗市场收入的 37–38%，使美国成为单一最大国家市场。更宽泛的美国牙科服务市场——涵盖预防、修复、美容和专科服务——2025 年价值 USD 174.91 billion，预计 2026
              年达到 USD 185.39 billion。牙龋治疗细分只是该数字的子集。vVARDIS 的 SAM 更窄：美国早期非侵入式龋齿治疗类别，目前没有独立分析师拆分。可用自下而上的代理测算：美国 >178,000
              家牙科诊所，每家都治疗患者，其中多达 80% 出现早期病损，单次治疗耗材价格点估计为个位数美元。
