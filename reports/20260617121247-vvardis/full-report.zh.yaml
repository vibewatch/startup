            body: >
              Apollo 之前，vVardis 的主要机构资本来自医疗健康专业基金 OrbiMed，其 AUM 约 $170 亿。OrbiMed 于 2025 年 2 月投资 $3500 万 Series B，并在 2025
              年 7 月跟投 $5000 万，两笔合计 $8500 万。William Blair & Company 在 OrbiMed 流程中担任 vVardis 独家财务顾问。OrbiMed 之前，早期支持者包括
              Chanel 财富继承人 David Wertheimer（通过 1686 Partners）以及欧洲多家族办公室 Duxebridge Capital。InforCapital
              私募市场账本记录了三轮已披露融资；Apollo 轮金额列为「未披露」，公开确认的只有 $1B 估值下限。

              Abivardi 姐妹已有退出记录：她们此前创办的 Swiss Smile 曾获 EQT AB 支持，并最终于 2017 年售予 Jacobs Holding。vVardis
              不公开披露收入、EBITDA、毛利率、现金消耗或客户经济性，外部无法用倍数独立验证估值。商业规模只能借助公司主张做代理：自 2024 年 1 月美国上市以来，美国约 300 万颗牙齿接受治疗；截至 2026 年
              4 月，约 20% 的美国普通牙科诊所已覆盖；按 SDM Northcoast 2024 年相对 2023 年以及 2025 年截至 6 月 YTD 数据，公司是其品类中增长率最快的牙科制造商。
