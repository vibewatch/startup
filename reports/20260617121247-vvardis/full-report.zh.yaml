      - number: '3.3'
        title: 既有氟化物涂漆市场与替代品
        blocks:
          - type: paragraph
            body: >
              氟化物涂漆是 Curodont 适应症空间中嵌入最深的替代方案。全球牙科氟化物涂漆市场 2026 年估计约为 $207–412 million，超过 74%
              专业牙科诊所把涂漆作为预防护理就诊的标准组成部分。多家主要品牌主要围绕配方差异、口味和价格竞争。Dentsply Sirona 的 NUPRO White Varnish——市场标准 5% sodium
              fluoride 涂漆——500 剂盒装标价约 $1,098，约 $2.20 / 剂。Solventum 的 Clinpro Vanish 用 functionalized tricalcium
              phosphate（fTCP）搭配 5% NaF 做差异化，相比标准涂漆接触时间，可实现 24 小时持续释放氟和钙。GC America 的 MI Varnish 将 5% NaF 与
              Recaldent（CPP-ACP）casein phosphopeptide 结合，在氟之外提供生物可利用的钙和磷酸盐；相关 MI Paste Plus 膏剂 10 支专业装标价约
              $184.55。Ivoclar Vivadent 的 Fluor Protector S 使用乙醇基溶液中的 ammonium fluoride，凭借薄膜化学在溶剂蒸发后让牙面局部氟浓度最高达到
              3%。Colgate Duraphat 是 1964 年推出的原始氟化物涂漆，在英国拥有独特监管身份：作为龋齿控制药品而非医疗器械获许可，因此成为 NHS 对齐方案中指南优先产品。


              这些氟化物涂漆产品都不通过再生性仿生机制处理早期脱矿釉质；它们都依赖氟驱动的表面再矿化。这是 Curodont 在产品层面的主要差异：单次就诊完成的、再生表层下羟基磷灰石的仿生治疗，对比每 3-6
              个月重复一次的氟化物应用。GC America 的 MI Paste Plus 源自酪蛋白（一种乳蛋白），禁用于乳蛋白过敏患者——在患者群体多样的诊所中，这是临床工作流需要考虑的因素。
