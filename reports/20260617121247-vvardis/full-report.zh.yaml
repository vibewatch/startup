            title: 建议：继续研究——等待 S-1 验证财务
            body: >
              vVardis 已拼出一个有吸引力的牙科医疗技术增长故事：Apollo 和 OrbiMed 背书、JPMorgan/Goldman IPO 委任、两年内 20% 美国牙科渗透率，以及拥有 250+
              篇临床发表物的专有肽平台。但如果没有已披露财务，$1B+ 私募估值完全无法验证。隐含 EV/Revenue 倍数估计在 5–20x 之间，取决于未披露收入基数；区间太宽，无法形成有把握的正向确信。建议是跟踪
              IPO 流程，为 S-1 文件准备财务尽调能力，并在经审计收入、毛利率和交易条款公开前暂缓投入资本。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV042
              - CV043
              - CV047
          - type: callout
            title: 反面先例：SmileDirectClub 与牙科科技 IPO 坟场
            body: >
              SmileDirectClub（SDC）2019 年凭借亮眼增长指标和新型牙科科技模式，以数十亿美元估值 IPO，却在 2023 年申请破产——前后仅四年。其资产随后被 SmileSet 收购。这不是类比式断言
              vVardis 会失败，而是一个直接基准：当单位经济性和报销无法按估值暗示的速度复合时，牙科科技增长故事可以多快失衡。vVardis 没有财务披露，外部无法排除类似执行错配。IPO
              投资者在投入资本前应要求完整财务尽调。
            calloutType: risk
            claimRefs:
              - CV047
              - CV048
          - type: callout
            title: 「战略少数股权」信号：Apollo 的定位很重要
            body: >
              Apollo 将其投资描述为「战略少数股权」，并明确确认创始人保留实质多数股权；这对 IPO 结构是重要信号。它说明 Apollo 交易没有显著稀释创始人，IPO 前仍保留创始人控制投票权。但这也意味着
              Apollo 条款结构不透明：私募轮中的战略少数投资者经常谈判下行保护（清算优先权、信息权、反稀释），这些条款会影响公开市场投资者可获得的经济权益。相关条款只会在 S-1 中披露。
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV046
