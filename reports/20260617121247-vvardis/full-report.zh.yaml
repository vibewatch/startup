      - number: '4.3'
        title: 成本结构、毛利率与财务不透明
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，vVARDIS 尚未公开成本结构、毛利率、EBITDA、运营费用或任何等同财务指标。它是一家未向 SEC
              申报的瑞士私营公司，市场上没有可用于推导财务表现的公开注册声明或年报。公司披露仅限于商业口径新闻稿和采用指标（治疗牙齿数量、牙科诊所渗透率）。

              第三方收入情报机构估计，vVARDIS 年收入约为 $1.7 million。若该数字准确，按 2026 年 4 月超过 $1 billion 的估值计算，市销率将超过 600x——即便放在收入前生物科技或高增长
              SaaS 公司里也极端。这样的倍数只能靠一个论点来解释：估值看的是庞大可服务市场未来收入（仅美国早期龋齿治疗就超过 $30 billion），而非当前财务表现。vVARDIS 在品类中成为增长最快制造商（SDM
              Northcoast 数据），说明在 2025–2026 年激进商业化扩张之后，$1.7 million 很可能已经过时或被大幅低估；但公司未披露财务数据，精确数字无法确认。

              Curodont 的制造是欧洲基地的药品级生产流程（肽合成与配方），供应链复杂度可能让其 COGS 相对同业牙科耗材更高。公司未公开任何 COGS 或毛利率数字。一般牙科药品耗材的制造商毛利率通常为
              50–75%。vVARDIS 的实际毛利率高度取决于肽制造规模，而公司未披露该规模。营运资本需求由诊所库存和 Henry Schein 分销周期驱动；公司也未披露营运资本或资本开支。
