        - M
        - 监测学术牙科实验室（如 University of Leeds、ETH Zurich）的 IP 申请；跟踪牙科生物技术初创公司的融资
      - - Henry Schein 覆盖美国所有牙科细分市场的独家分销（2026 年 1 月）
        - Henry Schein 也分销竞品氟漆品牌；协议条款和竞业范围未公开披露；Henry Schein 在谈判中拥有杠杆
        - H
        - 尽调中审查独家协议条款、续约触发条件、最低采购承诺，以及任何品类竞业条款
      - - 250+ 篇发表文献证据基础，并声称成功率 >90%
        - 竞争对手总研究数量更大（SDF 627+、Icon 400+）；缺乏与 Icon 的直接头对头 RCT，可能放慢重证据市场的临床医生采用
        - M
