            title: 报销是近期最关键的否决条件
            body: >
              如果没有美国通用认可的 CDT 操作代码，也没有至少一家全国性大型保险公司覆盖 Curodont，产品就会被结构性限制在按服务收费、自费和高端 DSO 市场。ADA 2025 年第四季度调查显示，55%
              以上牙医把保险报销偏低列为进入 2026 年的首要担忧，35% 计划退出部分保险网络——这可能带来缓慢且不均衡的顺风，但不能保证覆盖范围短期扩张。报销问题解决前，增长论点取决于高端定位能否用有限的绝对收入撑住
