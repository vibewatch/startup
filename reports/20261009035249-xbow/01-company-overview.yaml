chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in January 2024 by GitHub Copilot creator Oege de Moor, XBOW develops an autonomous offensive security platform that simulates adversary attack chains with validated exploits. The company attained unicorn status following a $120M Series C round in March 2026 led by DFJ Growth and Northzone, extended by a $35M strategic tranche in May 2026, though commercial depth remains constrained by quote-only pricing and opaque revenue fundamentals."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Founding Context, and Operating Model"
    body: "XBOW is an autonomous offensive security software company founded in January 2024 by Oege de Moor, the computer scientist renowned for creating GitHub Copilot and GitHub Advanced Security. Headquartered legally in Seattle, Washington, XBOW maintains a remote-first operating model with more than 250 distributed employees across the United States, Europe, and Asia, while listing its corporate domicile at a Pioneer Square coworking facility. The company's core mission centers on transforming enterprise vulnerability identification from periodic, point-in-time penetration tests into continuous, autonomous exploit validation. Unlike traditional vulnerability scanners that flood security teams with theoretical alerts, XBOW deploys autonomous AI agents that chain software vulnerabilities into reproducible attack paths. The platform operates across web applications and exposed APIs to prove exploitability with zero-noise proof-of-concept demonstrations before surfacing prioritized remediation guidance to defenders."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Risk"
    body: "XBOW's technical foundation and operational execution are tightly coupled to a specialized cohort of compiler specialists, AI researchers, and veteran offensive security operatives. Alongside founder and Chief Executive Officer Oege de Moor, the initial engineering team was recruited from Microsoft and GitHub's original Copilot group. Chief Information Security Officer Nico Waisman, formerly CISO at Lyft, joined at inception to construct safety guardrails and direct a proprietary cadre of human security researchers who train XBOW's autonomous agents against real-world adversarial tactics. Corporate governance expanded significantly in 2026 following institutional capital injections: Ramin Sayar, Venture Partner at DFJ Growth and former CEO of Sumo Logic, joined the Board of Directors alongside early director Ron Gabrisko. Operational scaling is overseen by Chief Marketing Officer Jonaki Egenolf, Chief Revenue Officer Niro Rajadurai, General Counsel Dean Breda, and South Korea General Manager WonLae Lee. Key-person dependency on de Moor remains acute given his dual role as technological visionary and primary fundraising magnet."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-structure"
    title: "Capitalization History, Valuation Progression, and Stakeholders"
    body: "Between its founding in January 2024 and May 2026, XBOW raised a cumulative $272 million in venture and strategic equity capital across five discrete financing transactions. After an initial $20 million seed round in July 2024 and a $22 million Series A in January 2025 led by Sequoia Capital and Nat Friedman, XBOW closed a $75 million Series B in June 2025 led by Altimeter Capital. In March 2026, the company completed a $120 million Series C financing co-led by DFJ Growth and Northzone with participation from Sofina, Alkeon Capital, Altimeter, NFDG Ventures, and Sequoia Capital, establishing a post-money valuation exceeding $1.0 billion. In May 2026, XBOW extended the Series C with an additional $35 million strategic tranche backed by NVentures, Samsung Ventures, SentinelOne S Ventures, Accenture Ventures, DNX Ventures, and Liberty Global Tech Ventures. While institutional and strategic backing validates XBOW's technical standing, concrete financial disclosures regarding annual recurring revenue, gross margins, cash burn, and net revenue retention remain undisclosed."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "commercial-traction-and-operational-critique"
    title: "Commercial Traction, Go-to-Market Shift, and Critical Tradeoffs"
    body: "XBOW serves more than 150 enterprise security organizations globally, including reference accounts such as Moderna, PuppyGraph, and Superhuman. However, the company executed a significant commercial pivot in mid-July 2026 by removing its transparent, self-serve list pricing—which had previously offered Lightspeed Plus at $4,000 per test and Lightspeed Premium at $8,000 per test—in favor of custom, sales-negotiated usage-based contracts. Independent security analyst reviews highlight that this opacity introduces budgeting friction for prospective buyers, as contracts scale unpredictably with external attack surface expansion while technical coverage remains bounded strictly to web applications and APIs. Furthermore, independent private market comparables illustrate the risk of informational conflation between XBOW's cybersecurity software business and unrelated aerospace defense contractors carrying the same corporate acronym."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs: []
