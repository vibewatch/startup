callouts:
  - calloutType: "insight"
    title: "Operating Domicile vs. Remote Reality"
    body: "While XBOW is tracked as a premier Seattle tech unicorn in Pacific Northwest venture statistics, its physical presence in Washington state is confined to a Pioneer Square coworking mailbox. Founder and CEO Oege de Moor resides in Malta, while the company's 250+ employees operate on a globally distributed basis across North America, Europe, and Asia. This geographic dispersal presents distinct advantages for round-the-clock adversarial research but increases operational overhead for unified engineering alignment."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO012"
  - calloutType: "risk"
    title: "Strategic Friction in Enterprise Repricing"
    body: "The mid-2026 withdrawal of published $4,000 and $8,000 per-test Lightspeed tiers signals a shift toward upmarket enterprise annual contract values. However, transitioning from transparent self-service pricing to opaque usage-based sales negotiations creates friction among mid-market security buyers and lengthens sales cycles, particularly when prospective clients cannot run self-service trials without high-touch vendor engagement."
    claimRefs:
      - "CO015"
