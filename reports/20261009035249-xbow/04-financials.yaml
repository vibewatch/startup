company:
  name: "XBOW"
chapter:
  number: 4
  title: "Financials"
  summary: "XBOW has clear evidence of enterprise adoption and more than $270 million of reported financing, but neither customer counts nor funding establish revenue quality or liquidity. Current realized pricing, revenue, gross margin, burn, runway, and retention remain unavailable in the reviewed public evidence, so financial underwriting requires private data."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing"
    body: "XBOW sells an autonomous offensive-security outcome: continuous testing that produces validated exploit evidence and remediation material. The current public homepage describes the activity and cites more than 150 security teams, but it does not disclose a price or an accounting unit. A July 2026 comparison published by competitor CodeAnt AI reports that XBOW moved from public per-test prices to quote-based, usage-based pricing tied to coverage. That report is useful directional evidence, not an independent benchmark. It does not reveal realized discounts, minimum commitments, contract duration, revenue recognition, or the split between recurring coverage and one-off assessments. Accordingly, the flow below stops at undisclosed recognized revenue and gross profit rather than converting activity into unsupported financial estimates."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "go-to-market-and-traction"
    title: "Go-to-Market and Traction"
    body: "The available evidence points to an enterprise, sales-assisted motion. CodeAnt AI reports request-pricing and demo calls to action plus procurement through major cloud marketplaces; no reviewed source discloses sales-cycle length, channel fees, or customer-acquisition cost. Commercial adoption is more visible than monetization: TAMradar and GeekWire reported more than 100 customers in March-May 2026, while XBOW's current homepage claims more than 150 security teams. These are different vintages and potentially different denominators, so they support adoption momentum but not a precise customer-growth rate. They also do not establish paid-seat counts, deployment breadth, contract value, collections, renewal behavior, or revenue."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI013"
  - id: "unit-economics-and-cost-base"
    title: "Unit Economics and Cost Base"
    body: "Public evidence is insufficient to calculate software unit economics. None of the eight reviewed pages discloses ARR, recognized revenue, revenue mix, gross margin, customer acquisition cost, payback, sales efficiency, or net retention. Delivery likely combines automated testing infrastructure with specialized personnel, but neither the model-compute burden nor the human-service component is quantified. GeekWire reported more than 250 employees in May 2026, while Tracxn reported 303 as of August; this dated progression is only a labor-intensity proxy and is not payroll or burn. The diligence priority is a reconciled revenue cohort, cost-of-revenue schedule, and fully burdened acquisition-cost analysis rather than a synthetic SaaS benchmark."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "Financing capacity is demonstrated, but capital adequacy is not. Independent reports describe a $120 million Series C at a valuation above $1 billion and a later $35 million extension that brought the round to $155 million. Aggregate funding databases disagree slightly: Tracxn reports $270 million across five rounds, while Multiples reports $272 million. More importantly, funding raised is not cash available. The reviewed sources provide no cash balance, cash-flow statement, burn rate, debt schedule, project-finance obligation, runway, or next-round trigger. EquityZen's listing concerns sales by existing shareholders and therefore does not evidence cash entering XBOW. The financial verdict is promising demand and strong financing access, offset by a complete public-data block on revenue quality, margins, and forward liquidity."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI014"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: "Reported equity raised cannot be treated as current cash. Without cash, burn, debt, and committed-spend data, no defensible runway or next-financing date can be calculated."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI014"
      - "CI016"
