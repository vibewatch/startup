      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 架构分野：攻击引擎与持续工作流
            body: >-
              AI 渗透测试的核心竞争张力，不在于自主智能体能否利用应用，而在于测试闭环在哪里结束。XBOW 优先追求最大化的对抗式漏洞利用串联，用可运行的漏洞利用证明漏洞确实存在；但 Escape 和 CodeAnt AI
              等对手抓住未被路由的漏洞利用所带来的运营摩擦，在 CI/CD 流水线中生成自动化代码修复和回归测试套件 [CP003, CP004, CP009]。
