              2026 年中撤下公开的 $4,000 和 $8,000 单次测试 Lightspeed
              档位，说明公司正转向更高端的企业年度合同价值。但从透明的自助定价转向不透明的按用量销售谈判，会让中端市场安全买方感到摩擦并拉长销售周期；尤其是潜在客户无法在没有高接触式供应商介入的情况下自行试用。
