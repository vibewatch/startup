          value: Broad static and dynamic scanners producing high-volume alert catalogs without proving exploitability
        - label: 企业安全预算与基础设施
          value: Foundational SIEM, data lake telemetry, and enterprise defense spend across global technology stacks
        - label: 企业 IT 与云运营总支出
