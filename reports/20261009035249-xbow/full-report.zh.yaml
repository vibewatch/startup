      - number: '3.2'
        title: 能力分析、开发者交接与平台范围
        blocks:
          - type: paragraph
            body: >-
              对竞争对手画像的比较，凸显了纯粹的对抗深度与开发者工作流摩擦之间的尖锐取舍。XBOW 的主要差异化在于自主漏洞利用生成和验证引擎；该引擎声称在真实世界基准评估中零误报，并展示了最多 48 步的自主漏洞利用链
              [CP001, CP007]。但独立分析指出了明显的运营边界：XBOW 严格将范围限定在运行中的 Web 应用和 API，不提供静态应用安全测试（SAST）、软件成分分析（SCA）或直接代码仓扫描 [CP003,
              CP008]。


              相比之下，替代方案更强调修复速度和资产覆盖广度。Escape 可直接接入 CI/CD 流水线，生成针对技术栈的代码修复，并根据过往渗透测试自动化回归测试；XBOW
              虽然交付概念验证漏洞利用，却把代码修复完全留给客户工程团队 [CP004, CP009]。Terra Security 等专业平台强调结合业务背景的风险评分和人工参与验证，Hadrian
              则面向由基础设施变更触发的广泛攻击面管理（ASM）[CP010, CP011]。此外，XBOW 的前沿研究显示，自主模型在长期行动中的执行效果可能退化，偶尔需要人工引导去探索替代漏洞利用原语 [CP012]。
            claimRefs:
