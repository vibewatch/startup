      - number: '5.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 外部前沿模型与自研引擎之间的取舍
            body: >-
              XBOW 选择把推理路由到外部商业前沿模型，因此能立即获得尖端认知能力，运行 Microsoft Bing RCE 等复杂多步漏洞利用链。但这一架构押注也使公司持续暴露于外部 API
              定价、延迟波动、供应商安全过滤器和企业数据驻留问题。拥有专用自研攻防模型的竞争对手，则牺牲通用推理广度，以换取可预测定价、本地隔离，以及不受外部供应商政策变化影响的确定性。
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
          - type: callout
            title: 自动化与完整运营自主之间的现实差距
            body: >-
              XBOW
              将测试宣传为完全自主，但独立学术分析和竞争对手拆解强调，攻击扫描时不需要人工敲键盘，并不等于安全生命周期不需要人工监督。人工专家仍需负责初始范围界定、解读细微业务逻辑、划定破坏性测试边界，并在发现进入公开报告项目之前进行二次验证。
            calloutType: risk
