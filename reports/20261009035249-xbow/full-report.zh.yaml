      - number: '3.3'
        title: 商业模式、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              攻防安全的商业包装正在发生结构性变化。直到 2026 年 7 月中旬，XBOW 还为 Lightspeed 按需渗透测试公开自助价格（Plus $4,000、Premium
              $8,000），随后撤下公开数字，改为按环境划定范围的私有按用量定价 [CP013, CP014]。从业者反馈显示，按 token 和 credit
              消耗的模式会让持续扫描的预算变得不可预测，部分企业团队因此把测试限制在季度节奏，而不是随持续部署运行 [CP015]。


              在测试层，自主攻防安全的切换成本仍处于中低水平，因为黑盒工具除加入允许名单和提供 URL 外，几乎不需要与基础设施耦合 [CP002, CP016]。但当平台深度接入企业治理、SIEM/SOAR 基础设施，以及
              Microsoft Sentinel 或 Vanta 等合规态势引擎后，锁定效应会增强 [CP002, CP016]。XBOW 的护城河很大程度依赖其专有智能体编排和前沿 AI 模型评估流水线 [CP007,
              CP017]；然而，随着前沿基础模型开箱即具备越来越强的攻防能力，要守住差异化，就必须抵御快速商品化。
