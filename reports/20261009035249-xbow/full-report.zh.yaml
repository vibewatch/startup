      - number: '7.4'
        title: 供应商经济性、集成、扩张与未披露现金跑道相互关联
        blocks:
          - type: paragraph
            body: >-
              XBOW 承认服务可用性可能依赖第三方集成，撤回权限也可能中断服务。其赞助的 Mythos 分析还报告称，某模型价格可能是 Opus
              的五倍，并指出该模型在按估算成本归一化的基准中并非同类最佳，说明维护多模型系统需要权衡成本和供应商。独立报道证实了估值超过 $1B 的 $120M Series C，而一页质量较低的市场数据网页报告了后续
              $35M 扩展轮和 $272M
              累计融资。这些是融资事件，不是收入、可用现金或现金跑道。公开定价据报道只接受报价，客户集中度也未披露；因此，终止条件包括模型经济性恶化、无法记录安全授权、反复出现重大服务故障，或现金跑道计划无法支撑已宣布的扩张。
