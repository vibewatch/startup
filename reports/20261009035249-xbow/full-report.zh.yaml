      - number: '5.2'
        title: 多智能体系统架构与前沿模型依赖
        blocks:
          - type: paragraph
            body: >-
              XBOW 平台的技术核心是多智能体编排架构，而不是单一的单体大语言模型。目标评估从协调智能体开始，由它开展初步侦察、梳理可达攻击面并解析应用入口。随后，协调智能体 将专项测试任务分派给并行执行智能体，每个智能体
              聚焦命令注入、认证绕过或业务逻辑滥用等特定漏洞类别。另一个关键架构组件是独立验证层，它会独立尝试在目标系统上执行推导出的漏洞利用链。在任何线索升级为客户发现前，验证器都会确认漏洞确实可以主动利用。


              XBOW 依赖通过云路由调用外部商业前沿模型，并根据任务要求动态选择模型。这种设计让平台能够使用前沿推理能力和可容纳复杂多阶段攻击链的大上下文窗口，但也带来运营和商业依赖。平台每个扫描周期消耗数量不固定的 API
              token，测试频率上升会让客户承担按用量扩张的成本。此外，把应用流量和测试上下文经由外部 LLM
              供应商边界传输，会给受监管企业带来数据驻留和合规考量，也使扫描运营受制于上游模型供应商的可用性和运行时安全过滤器。
            claimRefs:
