  - id: TV003
    title: 情景估值分析（乐观 / 基准 / 悲观）
    columns:
      - 情景
      - 运营与收入假设
      - 估值倍数与目标区间
      - 主要脆弱点与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 增长超过 $60M；毛利率超过 80%；持续渗透测试合同扩展至《财富》500 强企业。
        - 通过科技 IPO 或战略收购实现 $3.0B–$5.0B 估值（ARR 倍数 35x–50x）。
        - LLM 推理成本飙升；竞争对手的开源攻击工具使发现结果商品化。
        - 25% — 取决于企业客户能否顺利落地并扩张，以及技术领先地位能否保持。
      - - 基准情景
        - ARR 达到 $25M–$40M；150+ 个客户 logo 按 $150k–$250k 平均合同金额转化；毛利率稳定在 70% 附近。
        - $1.0B–$1.5B 估值（ARR 倍数 25x–35x），支持稳定增长或估值持平的后续融资。
        - 定制定价下销售周期拉长；企业采购方反对自主漏洞利用。
        - 50% — 与观察到的市场采用情况和高层级风险投资支持一致。
      - - 悲观情景
        - ARR 长期低于 $15M；算力消耗大；客户在一次性审计验证后流失。
        - $300M–$500M 估值（10x–15x 倍数），迫使公司折价融资或进行结构化资本重组。
        - 意外宕机或未经授权的漏洞利用触发；责任排除导致客户离开。
        - 25% — $1B 估值跑在已核实收入证据前面，风险因此升高。
    notes: 鉴于财务数据未披露，这些情景是作者把典型网络安全风险投资倍数套入估计 ARR 区间后的建模结果。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV011
      - CV014
      - CV015
      - CV016
