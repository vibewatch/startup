      - number: '2.2'
        title: 市场规模视角与可寻址机会
        blocks:
          - type: paragraph
            body: >-
              评估自主攻防安全的可寻址市场，关键是剥离企业真实的付费意愿，而不是依赖自上而下的网络安全行业汇总。传统渗透测试属于老牌专业服务和红队市场，通常按年收取六位数咨询服务费；拥有 50 至 5,000
              个外部应用的企业，受人工能力限制和交易成本影响，每年只安排一到两次评估，成熟企业平均每笔成本约
              $100,000。自主执行压低单次测试的边际成本后，可服务市场会大幅扩张：平台能覆盖完整数字资产，而不只是抽样审计。过去商业渗透测试在已停用的基准模式下，每次通常需 $4,000 至
              $8,000；如今云、金融科技和关键基础设施买方越来越愿意为能把暴露发现与实时漏洞利用证明统一起来的平台，配置每年六位数的经常性预算。不过，市场规模估算仍受采购阻力约束：评估自主平台的企业必须在持续软件订阅与传统外包测试合同之间权衡，因此灵活的数字企业和高度监管机构会形成不同的采用层级。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
