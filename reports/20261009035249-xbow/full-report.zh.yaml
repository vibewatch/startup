      - number: '1.3'
        title: 资本化历程、估值演进与利益相关方
        blocks:
          - type: paragraph
            body: >-
              从 2024 年 1 月成立到 2026 年 5 月，XBOW 通过五笔独立融资交易累计筹得 $272M 风投和战略股权资金。2024 年 7 月完成首轮 $20M 种子轮后，公司于 2025 年 1 月完成由
              Sequoia Capital 和 Nat Friedman 领投的 $22M Series A；2025 年 6 月又完成由 Altimeter Capital 领投的 $75M Series B。2026 年
              3 月，公司完成由 DFJ Growth 和 Northzone 共同领投的 $120M Series C，Sofina、Alkeon Capital、Altimeter、NFDG Ventures 和
              Sequoia Capital 参投，投后估值超过 $1.0B。2026 年 5 月，XBOW 又在 Series C 上增加 $35M 战略增资，投资方包括 NVentures、Samsung
              Ventures、SentinelOne S Ventures、Accenture Ventures、DNX Ventures 和 Liberty Global Tech
              Ventures。机构和战略投资者的支持验证了 XBOW 的技术地位，但关于 ARR、毛利率、现金消耗和净收入留存率的具体财务披露仍然缺失。
