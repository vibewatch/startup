            body: >-
              XBOW 面向运营复杂 Web 应用资产和云服务、同时面临不断增加的合规要求与激烈对抗威胁的组织。客户群分为三档：高合规企业（如生物科技公司 Moderna 和美国前五大商业银行）、成长阶段和数字原生科技平台（如
