  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与自主测试工作流
        blocks:
          - type: paragraph
            body: >-
              XBOW 将其产品定义为自主攻防安全平台，能够开展渗透测试和持续漏洞验证，不需要人工操作员逐步指挥战术测试。主要交付界面围绕攻击面入口流程设计：企业安全团队指定目标 URL、域名和测试参数。目标确定后，XBOW
              软件会自主梳理暴露端点、发现漏洞并尝试主动利用，以证明弱点是否构成可行动的入侵路径。公司将这一模式定位为从一年一到两次的一次性评估，转向跟随现代软件部署速度运行的持续覆盖。


              端到端测试工作流依次经过自动侦察、多向探测和实时漏洞利用执行。XBOW
              不输出数千条未经验证的静态告警，而是强调经过验证的可利用性证明。交付给安全团队的发现包括完整攻击路径、可复现的漏洞利用材料、决策日志和结合上下文的修复指令。过去的商业交付模式包括 Pentest
              On-Demand 和 Lightspeed 等自助交易式评估，但平台在 2026 年中转向定制按用量合同和企业云市场部署。企业部署接入组织治理结构，使安全团队能够限定测试范围、安排评估，并针对 SOC
              2、ISO 27001 和 PCI DSS 等标准生成合规报告材料。
            claimRefs:
              - CE001
