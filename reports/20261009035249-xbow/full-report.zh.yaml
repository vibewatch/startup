chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              XBOW 是一家自主攻防安全软件公司，由以创建 GitHub Copilot 和 GitHub Advanced Security 闻名的计算机科学家 Oege de Moor 于 2024 年 1
              月创立。XBOW 的法定总部位于华盛顿州西雅图，采用远程优先模式，在美国、欧洲和亚洲分布着 250 多名员工，同时将公司住所登记在 Pioneer Square
              的联合办公场所。公司的核心使命，是把企业漏洞识别从周期性、一次性的渗透测试，转变为持续、自主的漏洞利用验证。传统漏洞扫描器会向安全团队倾倒大量理论告警，而 XBOW 部署自主 AI
              智能体，将软件漏洞串成可复现的攻击路径。平台覆盖 Web 应用和暴露 API，先用无噪声的概念验证演示证明漏洞可利用，再向防守方给出按优先级排列的修复指导。
