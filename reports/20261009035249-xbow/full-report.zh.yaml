        - 资本密集度高（已募资 $270M+），估值在 26 个月内快速升至 $1B+，且按使用量定价不透明。
      - - 估值立场
        - 偏高
        - $1.0B+ 的 Series C 估值超过公开证据支持范围；在 ARR 未披露的情况下，隐含倍数高于可比网络安全公司。
      - - 入场纪律
        - 持有 / 重新评估
        - 在尽调中获得审计级 ARR、毛利率和净收入留存指标前，不应承诺股权投资。
    notes: 建议与立场综合了已核实的 2026 年 Series C 资本化、投资人质量、客户数量和公开定价下线情况。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV014
  - id: TV002
    title: 投资论点与反论点矩阵
    columns:
      - 支柱
      - 论点
      - 反论点风险
      - 哪些信息会改变判断
    rows:
      - - 技术与产品
        - 自主 AI 代理能串联真实漏洞且零误报，达到 HackerOne 排名首位。
        - 密集的 LLM 推理和对抗性算力可能带来高昂的运营服务成本。
        - 独立审计基础设施单位经济性及每次渗透测试的推理成本。
      - - 市场与商业化
        - 已部署至 150+ 个企业团队；借助与 Accenture、SentinelOne 的合作进行战略分销。
        - 2026 年 7 月取消 $4k/$8k 自助定价，造成摩擦并拉长企业销售周期。
        - 核实新使用量定价企业模式下的扩张速度和客户续约率。
      - - 领导层与投资人联合体
        - 由 Copilot 创始人 Oege de Moor 和顶尖黑客带领；获 DFJ Growth、Northzone 和 Sequoia 支持。
        - 若后续非上市公司增长停滞，高估值会带来沉重的清算优先权负担。
        - 经审计的资本化表，确认普通股权益平等和稀释约束。
      - - 财务透明度
        - 2026 年 Series C 轮累计融资 $155M 后，资产负债表缓冲充足。
        - ARR、现金消耗、毛利率和净收入留存完全未披露。
        - 提供经审计财务报表，证明 ARR 超过 $30M 且毛利率 >75%。
    notes: 论据已与独立报道、厂商伙伴发布内容和技术文档交叉评估。
    claimRefs:
