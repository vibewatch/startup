  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 攻防安全版图与替代范式
        blocks:
          - type: paragraph
            body: >-
              攻防安全领域包含多种不同范式：自主对抗式漏洞利用引擎、持续聚焦 API 的动态扫描器、人工参与的渗透测试即服务（PTaaS），以及面向开发者的应用安全（AppSec）平台。XBOW
              代表自主对抗式漏洞利用这一类别，专注于在真实运行的 Web 应用和 API 上发现、串联并证明漏洞，执行过程中无需人工介入 [CP001, CP002]。但竞争对手转向 XBOW
              聚焦范围之外的企业关键需求，借此挑战这一方法，例如持续 CI/CD 集成、原生 API schema 测试和自动化代码修复 [CP003, CP004]。


              Escape 等直接替代方案聚焦现代架构（包括 GraphQL 和 REST API）的持续测试，与 XBOW 偏周期性的评估方式形成对比 [CP004]。Cobalt.io 等混合 PTaaS
              平台则把人工渗透测试人员的创造力与软件加速结合起来，服务需要合规认证和人工监督的企业 [CP005]。手工渗透测试公司以及 PortSwigger Burp Suite
              等传统工具属于维持现状的替代方案，在需要大量人工定制的专业红队中仍有很强的采用度 [CP006]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
