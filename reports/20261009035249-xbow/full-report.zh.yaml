        title: 展示材料
        blocks:
          - type: callout
            title: 在企业 AppSec 中，漏洞利用证明胜过告警数量
            body: 传统漏洞扫描器把理论风险大量塞进队列，导致企业安全团队出现严重的验证瘫痪。自主攻防安全把可运行的漏洞利用验证和攻击路径串联置于原始发现数量之上，因此经济价值从“发现得多”转向“修复优先级经验证”。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM005
          - type: callout
            title: 定价不透明与商业条款变化
            body: 透明的按需测试价格档位（每次 $4,000 至 $8,000）被不透明的定制按用量合同取代，给中端市场采购增加了摩擦。定制定价虽然能匹配企业资产规模，却迫使买方经历漫长销售周期，并加剧预算不确定性。
            calloutType: risk
            claimRefs:
              - CM011
