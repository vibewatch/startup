      - number: '7.3'
        title: 自主能力仍依赖判断、线上系统控制与服务可靠性
        blocks:
          - type: paragraph
            body: >-
              最强的运营警示来自 XBOW 自己的赞助评估，而不是外部事故记录。评估称，被测试模型需要精确提示、明确威胁模型和验证基础设施；其报告的命令安全准确率为 77.8%，低于引用的 Opus 4.6 和 Haiku
              4.5 结果。同一评估还称，移除线上站点访问对基准表现的伤害大于移除源代码访问，这进一步说明编排和安全交互是结果的核心。该结论与 XBOW 的产品战略一致，但也把失败风险集中到测试编排框架
              质量、范围执行、行动日志和客户配置上。合同免责声明，加上已分配证据中没有公开固定 SLA 或事故历史，使剩余可靠性风险仍高于低位。
            claimRefs:
              - CR005
              - CR006
