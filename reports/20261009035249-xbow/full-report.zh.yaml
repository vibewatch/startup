      - number: '7.2'
        title: 合同责任分配留下实质性的法律与数据尽调缺口
        blocks:
          - type: paragraph
            body: >-
              XBOW
              的公开条款可以构成一份可用的初步法律地图，但不足以按司法辖区逐一清除风险。客户必须合法使用服务，控制获授权用户和凭证，并对由此产生的结论与行动负责。敏感数据明确不属于设计用途；安全、可用性和支持则以商业上合理的努力和所选支持套餐为基础。条款还允许在安全、法律、付款和权利相关触发条件下暂停服务，并在列明的例外情况下限制救济。这些规定减少了责任分配歧义，却没有消除暴露。投资尽调应取得当前
              DPA、订单表、使用规则、保险、子处理方清单和独立保障报告，之后再把隐私、授权或平台安全风险视为已缓释。
            claimRefs:
