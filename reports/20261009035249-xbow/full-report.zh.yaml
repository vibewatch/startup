      - number: '1.2'
        title: 管理层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              XBOW 的技术基础和运营执行高度依赖一支专业团队，成员包括编译器专家、AI 研究人员和资深攻防安全人员。创始人兼 CEO Oege de Moor 之外，初始工程团队来自 Microsoft 和 GitHub
              最早的 Copilot 团队。曾任 Lyft CISO 的首席信息安全官 Nico Waisman 在公司成立时加入，负责搭建安全护栏，并带领一支内部安全研究员队伍，用真实世界的对抗战术训练 XBOW 的自主
              智能体。机构资金注入后，公司治理在 2026 年明显扩充：DFJ Growth 风投合伙人、前 Sumo Logic CEO Ramin Sayar 加入董事会，与早期董事 Ron Gabrisko 共事。CMO
              Jonaki Egenolf、CRO Niro Rajadurai、总法律顾问 Dean Breda 和韩国区总经理 WonLae Lee 负责运营扩张。de Moor
              同时担任技术愿景核心和主要融资吸引力来源，对他的关键人物依赖仍然突出。
