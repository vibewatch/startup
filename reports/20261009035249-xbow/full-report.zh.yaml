  - id: FE001
    title: XBOW 多代理自主攻击性安全架构
    type: stack
    summary: 分层展示 XBOW 的多代理攻击性架构，呈现目标范围界定、代理编排、验证和交付。
    data:
      layers:
        - label: 任务接入与范围界定层
          detail: 输入目标 URL、界定获授权测试边界、明确合规交战规则，并接入云市场平台。
        - label: 自主协调器层
          detail: 自动爬取、资产映射、攻击面拆解和动态并行任务分配。
        - label: 专业攻击代理集群
          detail: 由路由至前沿模型的调用驱动并行执行代理，探测不同漏洞向量（注入、认证、逻辑）。
        - label: 独立漏洞利用验证层
          detail: 执行沙箱验证实时可利用性、确认 root/SYSTEM 访问权限，并排除误报。
        - label: 企业修复与交付层
          detail: 可供审计的报告、逐步复现步骤、合规映射（SOC 2、ISO 27001）和重新测试接口。
        - label: 生态与平台集成层
          detail: 云市场采购（AWS、Azure、GCP、OCI）、AWS Security Competency 接口和内部 GTM 赋能系统。
    approximationNotes: 代表根据技术披露、安全评测和竞争对手拆解综合出的功能架构。
    claimRefs:
