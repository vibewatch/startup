      - number: '6.4'
        title: 留存、商业摩擦与集中度脆弱性
        blocks:
          - type: paragraph
            body: >-
              客户对检测深度和验证质量的反馈非常积极，但客户稳定性、采购摩擦和收入集中度仍有显著结构性风险。2026 年 7 月中旬，XBOW 停止公开自助 Lightspeed 入门价格（Plus 每次测试
              $4,000，Premium 每次测试 $8,000），改为只接受报价的按用量企业合同，取消透明的前期预算，并迫使买方进入辅助销售周期。标准客户条款要求按年预付开票，排除间接损害赔偿，将责任上限设为过去 12
              个月已支付的费用，并保留单方面暂停服务的权利；付款违约超过 10 天即可触发该权利。此外，SSO、API
              访问和欧盟数据驻留等关键企业能力被放在定制企业协议之后，中端市场账户的采购摩擦因此上升；可变用量计量下，长期 cohort 的续约稳定性尚未得到证明。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 漏洞利用证明消除误报并加速修复
            body: >-
              Moderna 和 Superhuman 企业负责人提供的客户证言表明，XBOW 的主要竞争护城河是可行动的漏洞利用验证。XBOW
              不把理论扫描告警倾倒给安全团队，而是将漏洞串成可运行的概念验证，因此切实降低了开发者的修复摩擦。
            calloutType: strength
            claimRefs:
              - CU011
              - CU014
          - type: callout
            title: 转向不透明的按用量定价，客户预算可能反弹
            body: >-
              2026 年中撤下公开的 $4,000 和 $8,000 Lightspeed
              定价档位，改为未公开的按用量报价，迫使买方进行不透明的企业谈判。随着应用范围扩大，潜在买方会面临不可预测的续约成本，这可能加剧其与采用透明按席位或固定费用定价的竞争对手之间的摩擦。
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 剩余风险集中在验证、授权与透明度
        blocks:
          - type: paragraph
            body: >-
              尽管有可信的缓释主张，证据仍支持较高的剩余风险态势。XBOW
              称客户定义范围、每项行动都有日志记录、部署可以符合企业合规要求，但这些是公司自述，不是独立控制测试。公司自有的赞助模型评估显示，判断能力参差不齐，命令安全表现明显弱于引用的两个对比结果。条款还把重要的授权、凭证、数据和下游决策责任转给客户。因此，热力图按证据强度对法律授权、模型判断、依赖、服务保障和财务透明度风险排序，而不是假设存在某种事故历史。没有任何已分配来源证明发生过数据泄露、宕机、诉讼或执法行动；也不会把这一缺失当作这些事件不存在的证明。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR009
              - CR010
              - CR016
