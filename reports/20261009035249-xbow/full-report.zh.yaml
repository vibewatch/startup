  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与支出边界
        blocks:
          - type: paragraph
            body: >-
              自主攻防安全市场位于更广泛企业网络安全领域的专业细分中，连接应用安全（AppSec）与安全运营（SecOps）。过去，企业安全验证在自动化的表层扫描器与周期性人工第三方渗透测试之间割裂：前者包括静态应用安全测试（SAST）和动态应用安全测试（DAST），会产生海量未经验证的告警和理论风险，却无法确认可利用性；后者验证深入，但成本高昂且只是一次性快照，代码持续上线后很快过时。自主攻防安全平台通过
              agentic AI 模拟外部应用资产上的对抗行为，串联多步漏洞利用路径，并在告警到达工程团队前证明漏洞影响，从而重新划定这一边界。企业在这一类别的支出，会替代或补充年度咨询
              年度咨询服务合同、外部攻击面管理（EASM）工具和漏洞赏金项目。但该类别明确不包括自动化运行时修复补丁、传统代码扫描 SAST
              套件、网络防火墙运营，以及一般性的安全信息与事件管理（SIEM）数据仓储，形成一个专门用于持续对抗验证的支出类别。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
