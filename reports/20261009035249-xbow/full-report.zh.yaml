  - id: FV001
    title: XBOW 投资决策与估值综合逻辑
    type: flow
    summary: 这套决策逻辑串起 XBOW 的技术验证、资本规模和财务信息缺失，最终建议“继续研究”。
    data:
      nodes:
        - id: tech-proof
          label: 卓越的技术验证
          role: Top HackerOne rank; 150+ enterprise security customers; autonomous exploitation proof
          tone: positive
        - id: capital-scale
          label: 激进的 $1.0B+ 资本规模
          role: $120M Series C + $35M strategic extension; backing from DFJ Growth, Northzone, Sequoia
          tone: neutral
        - id: pricing-shift
          label: 不透明的按用量计价
          role: Retirement of transparent $4,000/$8,000 Lightspeed tiers in July 2026
          tone: risk
        - id: financial-gap
          label: 零审计财务披露
          role: ARR, recognized revenue, cash burn, and net retention remain unverified
          tone: risk
        - id: valuation-verdict
          label: 估值判断：偏高
          role: $1B+ price tag discounts aggressive future growth without current financial support
          tone: risk
        - id: final-recommendation
          label: 建议：继续研究
          role: Withhold equity allocation until verifiable ARR and retention data are confirmed
          tone: neutral
      edges:
        - from: tech-proof
          to: capital-scale
          label: 推动估值
        - from: capital-scale
          to: pricing-shift
          label: 伴随
        - from: pricing-shift
          to: financial-gap
          label: 叠加
        - from: financial-gap
          to: valuation-verdict
          label: 导致
        - from: valuation-verdict
          to: final-recommendation
          label: 决定
