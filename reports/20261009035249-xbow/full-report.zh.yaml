  - id: FU001
    title: 企业客户旅程与扩张动态
    type: journey-map
    summary: 展示企业安全团队从渠道进入到深度持续暴露管理的多阶段推进过程。
    data:
      items:
        - label: 发现与评估
          stage: 发现与进入
          persona: CISO / Head of Security
          touchpoints:
            - Vanta 平台集成
            - HackerOne 排行榜声誉
            - 销售协助演示与环境范围界定
          friction: No free tier or public self-serve sandbox
        - label: 范围界定与验证
          stage: 范围界定与验证
          persona: Deputy CISO / AppSec Lead
          touchpoints:
            - URL 与 API 端点接入
            - 自动化多步骤漏洞串联
            - 生成带可运行漏洞利用证明的可审计报告
          friction: Scoping restricted strictly to web applications and APIs
        - label: 运营集成
          stage: 运营集成
          persona: DevSecOps / Remediation Engineers
          touchpoints:
            - Jira 集成，自动创建工单
            - 借助公开 API 接入企业 SIEM
            - 代码修复即时重新测试
          friction: Enterprise-tier gating required for API and SSO access
        - label: 持续扩张
          stage: 扩张与治理
          persona: Security Leadership & Compliance Officers
          touchpoints:
            - 覆盖全部资产部署自主暴露管理（AEM）
            - 部署欧盟数据驻留以满足区域合规要求
            - 年度合同续约与云市场平台消耗（AWS/Azure/GCP）
          friction: Unpublished usage-based rates make multi-year budgeting unpredictable
        - label: 多团队推广
          stage: 企业规模化
          persona: VP of Engineering & Product Security
          touchpoints:
            - 跨组织开发者修复 SLA
            - 多云目标范围界定与覆盖扩展
            - 整合企业漏洞仪表盘
          friction: High commercial commitment required for portfolio-wide scanning
        - label: 治理与生态防御
          stage: 高管监督
          persona: Board of Directors & Audit Committee
          touchpoints:
            - 董事会层面的合规核验与 SOC 2 审计准备
            - 生态联合销售与分销渠道验证
            - 持续替代人工渗透测试公司
          friction: Lack of public financial disclosures complicates long-term vendor stability audits
    approximationNotes: 根据官方平台文档、GTM 战略岗位要求和技术产品功能分析综合得出。
    claimRefs:
