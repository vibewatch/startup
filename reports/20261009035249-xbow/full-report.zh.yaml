      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格敏感度与估值结论
            body: >-
              XBOW 是 AI 网络安全领域最具吸引力的技术资产之一，但严谨的投资者不能把技术能力等同于估值安全。在 $1.0B+ 估值下，公司的交易逻辑依赖叙事驱动的倍数扩张，而不是经验证的财务基本面。建议密切跟踪
              XBOW，但任何一级或二级市场的资金配置，都应以审计确认的 ARR、清晰的毛利率和客户留存指标为前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
          - type: callout
            title: 二级市场与潜在压顶风险提示
            body: >-
              EquityZen 等二级市场上的 IPO 前股份要约，表明早期员工存在流动性需求。公司在 C 轮融资中筹得 $155M，
              并带有优先权压力；如果公开市场倍数压缩，迫使公司平轮融资或采用结构化后续融资，那么在没有审计经营结果的情况下买入的二级市场投资者，将面临大幅减值风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV013
              - CV014
