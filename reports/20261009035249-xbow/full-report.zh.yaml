            claimRefs:
              - CP003
              - CP004
              - CP009
          - type: callout
            title: 持续交付环境中的定价模式摩擦
            body: >-
              XBOW 从公开标价（每次按需测试 $4,000 至 $8,000）转向私有按用量定价，反映了企业采用中的持续矛盾。当一次自主渗透测试消耗 30 至 50 个 credit
              时，客户反馈称会把测试配额限制在季度节奏，而不是每次构建都持续测试，自动化平台的速度优势因而被削弱 [CP014, CP015]。
            calloutType: risk
            claimRefs:
