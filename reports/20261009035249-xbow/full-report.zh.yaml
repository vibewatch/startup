      - number: '1.4'
        title: 商业进展、市场进入策略转向与关键取舍
        blocks:
          - type: paragraph
            body: >-
              XBOW 服务全球 150 多家企业安全组织，参考客户包括 Moderna、PuppyGraph 和 Superhuman。然而，2026 年 7 月中旬，公司取消了透明的自助标价：此前 Lightspeed
              Plus 为每次测试 $4,000，Lightspeed Premium 为每次测试
              $8,000；之后改为定制、由销售协商的按用量合同。独立安全分析师指出，这种不透明会增加潜在买方的预算摩擦，因为合同金额会随外部攻击面扩张而不可预测地上升，而技术覆盖范围仍严格限定在 Web 应用和
              API。独立私募市场可比案例还显示，XBOW 的网络安全软件业务可能被误与使用同一企业缩写的无关航空航天防务承包商混为一谈。
            claimRefs:
              - CO014
              - CO015
              - CO016
