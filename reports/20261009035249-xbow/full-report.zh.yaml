      - number: '2.3'
        title: 买方画像、增长驱动因素与运营约束
        blocks:
          - type: paragraph
            body: >-
              企业采用自主攻防安全平台，源于一个根本性的结构错配：攻击者借助生成式模型和自动化工具链，以机器速度行动；防守团队却仍被人工分流和验证积压卡住。经济决策者通常是掌管渗透测试和漏洞管理预算的 CISO
              或安全副总裁，AppSec 负责人和安全运营中心（SecOps）经理则负责执行修复。接入 Microsoft Security Copilot、Microsoft Sentinel 数据湖和 Jira
              工单追踪等主要企业生态，可以把已确认的漏洞转成工程团队立刻可处理的工作项，降低上线摩擦。此外，战略生态合作和大规模部署也验证了企业需求，例如 Accenture 将其接入 Cyber.AI
              服务，以及一线风投机构的投资。尽管有这些顺风因素，采用约束仍然明显：买方要面对治理难题、严格监管要求、欧盟数据驻留等数据主权要求，也不愿在没有人在回路监督或可预测、稳定定价的情况下，授予自主智能体
              主动攻防测试权限。
