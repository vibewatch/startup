callouts:
  - calloutType: insight
    title: "The Architectural Divide: Attack Engine vs Continuous Workflow"
    body: "The core competitive tension in AI pentesting is not whether autonomous agents can exploit applications, but where the testing loop terminates. XBOW has prioritized maximal adversarial exploit chaining, proving vulnerability reality with working exploits. However, rival platforms like Escape and CodeAnt AI capitalize on the operational friction of unrouted exploits by generating automated code fixes and regression suites inside CI/CD pipelines [CP003, CP004, CP009]."
    claimRefs:
      - CP003
      - CP004
      - CP009
  - calloutType: risk
    title: "Pricing Model Friction in Continuous Delivery Environments"
    body: "XBOW's transition from published list prices ($4,000 to $8,000 per on-demand test) to private, usage-based pricing reflects an ongoing tension in enterprise adoption. When autonomous pentesting consumes 30 to 50 credits per scan, customers report rationing tests to quarterly cadences rather than running continuous tests on every build, blunting the speed advantages of an automated platform [CP014, CP015]."
    claimRefs:
      - CP014
      - CP015
