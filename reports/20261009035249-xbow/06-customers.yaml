      - "CU014"
  - calloutType: "risk"
    title: "Transition to Opaque Usage Pricing Risks Customer Budget Backlash"
    body: "Retiring published $4,000 and $8,000 Lightspeed pricing tiers in mid-2026 in favor of unpublished usage-based quotes forces buyers into opaque enterprise negotiations. Prospective buyers face unpredictable renewal costs as application scope expands, creating potential friction against competitors with transparent per-seat or flat-fee rates."
