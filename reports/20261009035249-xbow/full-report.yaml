      - number: '6.3'
        title: Production Deployments and Reference Evidence
        blocks:
          - type: paragraph
            body: >-
              Enterprise proof points validate that XBOW's autonomous penetration testing system operates directly
              against live production web applications and APIs, distinguishing it from traditional theoretical
              vulnerability scanners. At Moderna, the security team utilizes XBOW to chain multi-step attack paths
              across their digital surface, validating real exploitability and eliminating noise so engineers can
              prioritize critical remediation. At PuppyGraph, leadership reported transitioning away from traditional
              pentesting providers whose surface-level findings created a false sense of security, adopting XBOW to
              achieve deep, real-world attack simulation. European internet portal Seznam integrates autonomous agents
              into active application security workflows, treating them as virtual team members. However, reference
              evidence is largely confined to web application surfaces, with cloud network, source code, and mobile
              layer testing remaining unverified in reviewed deployments.
