      - number: '3.2'
        title: Capability Analysis, Developer Handoff, and Platform Scope
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor profiles highlights sharp tradeoffs between pure adversarial depth and developer
              workflow friction. XBOW's primary differentiation is its autonomous exploit generation and validation
              engine, which claims zero false positives across real-world benchmark evaluations and demonstrates
              autonomous exploit chains reaching up to 48 steps [CP001, CP007]. However, independent analyses identify
              significant operational boundaries: XBOW restricts its scope strictly to running web applications and
              APIs, offering no static application security testing (SAST), software composition analysis (SCA), or
              direct repository scanning [CP003, CP008].


              In contrast, alternative solutions emphasize remediation velocity and estate breadth. Escape integrates
              directly with CI/CD pipelines to generate stack-specific code fixes and automate regression testing from
              prior pentests, whereas XBOW delivers proof-of-concept exploits but leaves code remediation entirely to
              customer engineering teams [CP004, CP009]. Specialized platforms like Terra Security emphasize
              business-context risk scoring paired with human-in-the-loop validation, while Hadrian targets broad attack
              surface management (ASM) triggered by infrastructure changes [CP010, CP011]. Furthermore, XBOW's frontier
              research shows that autonomous model execution can experience degradation during extended campaigns,
              occasionally requiring human direction to explore alternative exploit primitives [CP012].
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
