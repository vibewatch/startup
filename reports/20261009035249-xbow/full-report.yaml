              - CE007
              - CE010
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Tradeoff Between External Frontier Models and In-House Engines
            body: >-
              XBOW's strategic choice to route reasoning to external commercial frontier models grants it immediate
              access to cutting-edge cognitive capabilities, enabling sophisticated multi-step exploit chains such as
              the Microsoft Bing RCE. However, this architectural bet creates permanent operational exposure to external
              API pricing, latency variations, provider safety filters, and enterprise data residency concerns.
              Competitors with dedicated, in-house offensive models sacrifice generic reasoning breadth to achieve
              predictable pricing, on-premises isolation, and guaranteed immunity from external provider policy shifts.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
          - type: callout
            title: The Reality Gap Between Automation and Full Operational Autonomy
            body: >-
              While XBOW markets fully autonomous testing, independent academic analysis and competitor teardowns
              emphasize that eliminating human keyboard input during an attack scan is not equivalent to eliminating
              human oversight from the security lifecycle. Human experts remain essential for initial scoping,
              interpreting nuanced business logic, resolving destructive testing boundaries, and conducting secondary
              verification before findings enter public reporting programs.
            calloutType: risk
            claimRefs:
              - CE010
              - CE013
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              XBOW targets organizations running complex web application estates and cloud services that face expanding
              compliance demands and aggressive adversarial threats. The customer base segments across three primary
              tiers: high-compliance enterprises (such as Moderna in biotechnology and top-5 US commercial banks),
              growth-stage and digital-native tech platforms (such as Superhuman, PuppyGraph, and Seznam), and
              compliance-driven early-stage startups accessing the engine via partner ecosystems like Vanta. The primary
              economic buyer is typically the Chief Information Security Officer (CISO) or Deputy CISO, while the
              day-to-day users comprise internal application security leads, DevSecOps teams, and security advisors.
              Budget ownership centers within dedicated cybersecurity and compliance operational budgets, where buyers
              seek to replace or augment slow, intermittent annual manual penetration tests with continuous,
              exploit-validated testing cycles.
            claimRefs:
