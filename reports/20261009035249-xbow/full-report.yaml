      - number: '7.2'
        title: Contractual allocation leaves material legal and data diligence
        blocks:
          - type: paragraph
            body: >-
              XBOW's published terms create a usable first-pass legal map but not a jurisdiction-by- jurisdiction
              clearance. Customers must use the service lawfully, control authorized users and credentials, and accept
              responsibility for resulting conclusions and actions. Sensitive data is expressly outside the designed use
              case, while security, uptime, and support are framed around commercially reasonable efforts and the
              selected support package. The terms also permit suspension for security, legal, payment, and
              rights-related triggers and limit remedies subject to stated exceptions. These provisions reduce ambiguity
              about allocation, not exposure. Investment diligence should obtain the current DPA, order form, rules of
              engagement, insurance, subprocessor list, and independent assurance reports before treating privacy,
              authorization, or platform-security risk as mitigated.
