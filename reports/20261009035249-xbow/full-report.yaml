  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure / monitor
    rows:
      - - Unsafe or overly literal model action
        - Sponsored evaluation reports 77.8% command-safety accuracy and mixed judgment
        - Medium
        - High
        - Developing
        - Monitor prevented unsafe actions, human overrides, boundary-test failures, and policy exceptions
      - - Missed or mis-prioritized vulnerability
        - >-
          Sponsored evaluation says strong reasoning is not self-sufficient and requires explicit threat models and
          validation
        - Medium
        - High
        - Developing
        - Require customer-blind validation, false-negative sampling, and reproducibility metrics by target class
      - - Live-target orchestration failure
        - Removing live-site access hurt the cited benchmark more than removing source access
        - Medium
        - High
        - Core product control
        - Review scope enforcement, rate limits, kill switch, evidence logs, and production-safe test protocols
      - - Service interruption or unsupported assurance
        - >-
          Support and uptime use commercially reasonable efforts; secure, uninterrupted, and error-free operation is not
          warranted
        - Medium
        - High
        - Contractual
        - Obtain SLA history, incident record, disaster-recovery results, RTO/RPO, and customer credits
    notes: >-
      No incident-rate denominator was available; likelihood and severity are qualitative judgments based on the
      disclosed benchmark limitations, official controls, and contract terms.
