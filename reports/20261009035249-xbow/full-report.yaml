  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Third-party integrations
        - Unspecified integrated platforms and open-source components
        - No supplier shares disclosed
        - Permission loss or provider failure suspends part of the service
        - High
        - Contract acknowledges dependency; obtain critical-vendor map, substitutes, and outage history
      - - Foundation-model capability and cost
        - Anthropic Mythos Preview is one tested engine; XBOW says it maintains a cadre of models
        - Provider allocation not disclosed
        - Price/performance changes increase test cost or reduce detection quality
        - High
        - Multi-model posture helps, but require routing economics, fallback tests, and provider concentration
      - - Growth capital and expansion
        - DFJ Growth, Northzone, and other Series C investors fund product and international scaling
        - Funding disclosed; cash availability and burn undisclosed
        - Expansion commitments outrun liquidity or execution capacity
        - High
        - Board should review cash, monthly burn, hiring plan, and milestone-linked runway quarterly
      - - Customer concentration and procurement
        - XBOW claims 150+ security teams; competitor review says pricing is quote-only
        - No customer revenue distribution disclosed
        - A few large renewals or enterprise terms drive revenue volatility
        - High
        - Request top-10 revenue shares, renewal cohorts, pipeline conversion, concessions, and marketplace exposure
    notes: >-
