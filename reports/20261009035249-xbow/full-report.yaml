      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              XBOW's technical foundation and operational execution are tightly coupled to a specialized cohort of
              compiler specialists, AI researchers, and veteran offensive security operatives. Alongside founder and
              Chief Executive Officer Oege de Moor, the initial engineering team was recruited from Microsoft and
              GitHub's original Copilot group. Chief Information Security Officer Nico Waisman, formerly CISO at Lyft,
              joined at inception to construct safety guardrails and direct a proprietary cadre of human security
              researchers who train XBOW's autonomous agents against real-world adversarial tactics. Corporate
              governance expanded significantly in 2026 following institutional capital injections: Ramin Sayar, Venture
              Partner at DFJ Growth and former CEO of Sumo Logic, joined the Board of Directors alongside early director
              Ron Gabrisko. Operational scaling is overseen by Chief Marketing Officer Jonaki Egenolf, Chief Revenue
              Officer Niro Rajadurai, General Counsel Dean Breda, and South Korea General Manager WonLae Lee. Key-person
              dependency on de Moor remains acute given his dual role as technological visionary and primary fundraising
              magnet.
