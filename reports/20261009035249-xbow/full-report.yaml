      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Exploit Proof Eliminates False Positives and Accelerates Remediation
            body: >-
              Customer testimony from enterprise leaders at Moderna and Superhuman underscores that XBOW's primary
              competitive moat is actionable exploit validation. By chaining vulnerabilities into working
              proofs-of-concept rather than inundating security teams with theoretical scanner alerts, XBOW measurably
              reduces developer remediation friction.
            calloutType: strength
            claimRefs:
              - CU011
              - CU014
          - type: callout
            title: Transition to Opaque Usage Pricing Risks Customer Budget Backlash
            body: >-
              Retiring published $4,000 and $8,000 Lightspeed pricing tiers in mid-2026 in favor of unpublished
              usage-based quotes forces buyers into opaque enterprise negotiations. Prospective buyers face
              unpredictable renewal costs as application scope expands, creating potential friction against competitors
              with transparent per-seat or flat-fee rates.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk is concentrated in validation, authorization, and transparency
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high residual-risk posture despite credible mitigation claims. XBOW says customers
              define scope, every action is logged, and deployment can align with enterprise compliance requirements,
              but those are company claims rather than independent control tests. Its own sponsored model evaluation
              describes mixed judgment and materially weaker command-safety performance than two cited comparison
              results. The terms also shift important authorization, credential, data, and downstream-decision
              responsibilities to the customer. The heatmap therefore ranks legal authorization, model judgment,
              dependency, service-assurance, and financial-transparency risks by evidence strength rather than by an
              assumed incident history. No allocated source establishes that a breach, outage, lawsuit, or enforcement
              action occurred, and that absence is not treated as proof that none exists.
            claimRefs:
