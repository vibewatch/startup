  - id: TV003
    title: Scenario Valuation Analysis (Bull / Base / Bear)
    columns:
      - Scenario
      - Operating & Revenue Assumptions
      - Valuation Multiples & Target Range
      - Key Vulnerabilities & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR scales past $60M; gross margins exceed 80%; continuous pentest contracts expand across Fortune 500.
        - $3.0B–$5.0B valuation (35x–50x ARR multiple) via tech IPO or strategic acquisition.
        - LLM inference cost spikes; competitor open-source offensive tools commoditize findings.
        - 25% — Dependent on flawless enterprise land-and-expand and dominant technical lead.
      - - Base Case
        - >-
          ARR reaches $25M–$40M; 150+ logos convert at $150k–$250k average contract value; gross margins stabilize near
          70%.
        - $1.0B–$1.5B valuation (25x–35x ARR multiple) supporting steady growth or flat follow-on.
        - Extended sales cycles under custom pricing; enterprise procurement pushback on autonomous exploits.
        - 50% — Consistent with observed market adoption and high-tier venture sponsorship.
      - - Bear Case
        - ARR languishes below $15M; high compute burn; customer churn after one-off audit validations.
        - $300M–$500M valuation (10x–15x multiple), forcing a down-round or structured recapitalization.
        - Accidental outage or unauthorized exploit trigger; liability exclusion causes customer defections.
        - 25% — Elevated risk due to $1B valuation outrunning verified revenue evidence.
    notes: >-
      Scenarios represent author modeling based on typical cybersecurity venture multiples applied to estimated ARR
      bands given lack of disclosed financial data.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
