chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Context, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              XBOW is an autonomous offensive security software company founded in January 2024 by Oege de Moor, the
              computer scientist renowned for creating GitHub Copilot and GitHub Advanced Security. Headquartered
              legally in Seattle, Washington, XBOW maintains a remote-first operating model with more than 250
              distributed employees across the United States, Europe, and Asia, while listing its corporate domicile at
              a Pioneer Square coworking facility. The company's core mission centers on transforming enterprise
              vulnerability identification from periodic, point-in-time penetration tests into continuous, autonomous
              exploit validation. Unlike traditional vulnerability scanners that flood security teams with theoretical
              alerts, XBOW deploys autonomous AI agents that chain software vulnerabilities into reproducible attack
              paths. The platform operates across web applications and exposed APIs to prove exploitability with
              zero-noise proof-of-concept demonstrations before surfacing prioritized remediation guidance to defenders.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
