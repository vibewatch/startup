  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Autonomous Testing Workflow
        blocks:
          - type: paragraph
            body: >-
              XBOW defines its product offering as an autonomous offensive security platform engineered to conduct
              penetration testing and continuous vulnerability validation without requiring human operators to steer
              tactical testing steps. The primary delivery interface is designed around an attack-surface entry workflow
              where enterprise security teams specify target URLs, domains, and testing parameters. Once targeted,
              XBOW's software autonomously maps exposed endpoints, discovers vulnerabilities, and attempts active
              exploitation to prove whether weaknesses represent actionable breach paths. The company frames this model
              as a shift from point-in-time assessments, which occur once or twice annually, to continuous coverage that
              executes at the velocity of modern software deployment.


              The end-to-end testing workflow proceeds through automated reconnaissance, multi-vector probing, and live
              exploit execution. Rather than outputting thousands of unverified static alerts, XBOW emphasizes verified
              proof of exploitability. Findings delivered to security teams include full attack paths, reproducible
              exploit artifacts, decision logs, and context-specific remediation instructions. Commercial delivery
              models historically included self-serve transactional assessments such as Pentest On-Demand and Lightspeed
              packages, but the platform transitioned in mid-2026 toward custom usage-based contracts and enterprise
              cloud marketplace deployments. Enterprise deployments integrate into organizational governance structures,
              allowing security teams to bound the testing scope, schedule assessments, and produce compliance-aligned
              reporting artifacts for standards such as SOC 2, ISO 27001, and PCI DSS.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE014
      - number: '5.2'
        title: Multi-Agent System Architecture and Frontier Model Dependencies
        blocks:
          - type: paragraph
            body: >-
              The technical core of XBOW's platform is organized as a multi-agent orchestration architecture rather than
              a single monolithic large language model. Target assessments begin with a coordinator agent that conducts
              initial reconnaissance, maps the reachable attack surface, and parses application entry points. The
              coordinator then delegates specialized testing tasks to parallel execution agents, each focusing on
              specific vulnerability categories such as command injection, authentication bypass, or business logic
              abuse. A critical architectural element is the separate validation layer, which independently attempts to
              execute the derived exploit chain against the target system. This validator confirms that the
              vulnerability is actively exploitable before any lead is promoted into a customer finding.


              XBOW relies on cloud-routed inference across external commercial frontier models, selecting models
              dynamically based on task requirements. While this design grants the platform access to cutting-edge
              reasoning capabilities and large context windows capable of holding complex multi-stage attack chains, it
              introduces operational and commercial dependencies. The platform consumes variable API tokens for each
              scan cycle, exposing customers to usage-based cost scaling as testing frequency rises. Furthermore,
              routing application traffic and testing context through external LLM provider boundaries presents data
              residency and compliance considerations for regulated enterprises, and leaves scanning operations subject
              to upstream model provider availability and runtime safety filters.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
