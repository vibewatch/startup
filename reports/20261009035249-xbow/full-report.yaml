        title: Autonomy still depends on judgment, live-system controls, and service reliability
        blocks:
          - type: paragraph
            body: >-
              The strongest operational warning comes from XBOW's own sponsored evaluation rather than an external
              incident record. It says the tested model needs precise prompts, explicit threat models, and validation
              infrastructure; its reported command-safety accuracy was 77.8%, below the cited Opus 4.6 and Haiku 4.5
              results. The same evaluation says removing live-site access hurt benchmark performance more than removing
              source-code access, reinforcing that orchestration and safe interaction are core to outcomes. That is
              strategically coherent with XBOW's product, but it concentrates failure risk in harness quality, scope
              enforcement, action logging, and customer configuration. Contractual disclaimers and the lack of a public
              fixed SLA or incident history in the allocated evidence keep residual reliability risk above low.
