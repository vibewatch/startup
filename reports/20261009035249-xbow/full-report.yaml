      - number: '6.4'
        title: Retention, Commercial Friction, and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              While customer feedback on detection depth and verification quality is strongly favorable, significant
              structural risks surround customer durability, procurement friction, and revenue concentration. In
              mid-July 2026, XBOW retired its published self-serve Lightspeed entry pricing ($4,000 for Plus and $8,000
              for Premium per test) in favor of quote-only usage-based enterprise contracts, eliminating transparent
              upfront budgeting and forcing buyers into assisted sales cycles. Standard customer terms mandate annual
              upfront invoicing, disclaim consequential damages, cap liability at fees paid over the trailing 12 months,
              and reserve unilateral suspension rights for payment defaults exceeding 10 days. Furthermore, with
              essential enterprise capabilities such as SSO, API access, and EU data residency gated behind custom
              enterprise agreements, procurement friction has increased for mid-market accounts, and long-term cohort
              renewal durability under variable usage meters remains unproven.
            claimRefs:
              - CU012
