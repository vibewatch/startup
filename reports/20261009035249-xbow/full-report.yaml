      - number: '6.2'
        title: Commercial Adoption Trajectory and Scale Dynamics
        blocks:
          - type: paragraph
            body: >-
              XBOW's commercial adoption trajectory has expanded rapidly since its founding in January 2024, supported
              by $272M in total venture financing and achieving unicorn valuation. Public disclosures indicate that
              XBOW's client base expanded to over 100 enterprise clients by March 2026 and grew to exceed 150 security
              teams globally by late 2026. The commercial footprint spans North America, Europe (supported by dedicated
              EU Data Residency infrastructure), and South Korea following strategic partner and venture participation
              from Samsung Ventures and DNX Ventures. Deployment velocity is further accelerated by an exclusive
              distribution partnership with Vanta, allowing startup customers to initiate automated penetration testing
              directly within their existing compliance workflows. Despite this headline account growth, detailed
              metrics such as annual recurring revenue, customer acquisition cost, net revenue retention, and logo churn
              remain strictly undisclosed private metrics.
