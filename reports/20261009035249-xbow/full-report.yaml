        title: Exhibits
        blocks:
          - type: callout
            title: Price Sensitivity and Valuation Verdict
            body: >-
              XBOW represents one of the most compelling technical assets in AI cybersecurity, but disciplined investors
              cannot conflate technical capability with valuation safety. At $1.0B+, the company trades on narrative
              multiple expansion rather than verified financial fundamentals. We advise tracking XBOW closely while
              conditioning any primary or secondary capital allocation on audited ARR, gross margin clarity, and
              customer retention metrics.
            calloutType: recommendation
