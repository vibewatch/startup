        title: Capitalization History, Valuation Progression, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Between its founding in January 2024 and May 2026, XBOW raised a cumulative $272 million in venture and
              strategic equity capital across five discrete financing transactions. After an initial $20 million seed
              round in July 2024 and a $22 million Series A in January 2025 led by Sequoia Capital and Nat Friedman,
              XBOW closed a $75 million Series B in June 2025 led by Altimeter Capital. In March 2026, the company
              completed a $120 million Series C financing co-led by DFJ Growth and Northzone with participation from
              Sofina, Alkeon Capital, Altimeter, NFDG Ventures, and Sequoia Capital, establishing a post-money valuation
              exceeding $1.0 billion. In May 2026, XBOW extended the Series C with an additional $35 million strategic
              tranche backed by NVentures, Samsung Ventures, SentinelOne S Ventures, Accenture Ventures, DNX Ventures,
              and Liberty Global Tech Ventures. While institutional and strategic backing validates XBOW's technical
              standing, concrete financial disclosures regarding annual recurring revenue, gross margins, cash burn, and
              net revenue retention remain undisclosed.
