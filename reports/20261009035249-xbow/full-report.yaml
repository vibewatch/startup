        title: Provider economics, integrations, expansion, and undisclosed runway are linked risks
        blocks:
          - type: paragraph
            body: >-
              XBOW acknowledges that service availability can depend on third-party integrations and that withdrawn
              permissions can interrupt service. Its sponsored Mythos analysis also reports a potential five-times-Opus
              model price and says that model was not best-in-class on estimated cost-normalized benchmarks,
              illustrating the cost and supplier trade-offs in maintaining a multi-model system. Independent reports
              corroborate a $120 million Series C at a valuation above $1 billion, while a lower-quality market-data
              page reports a later $35 million extension and $272 million cumulative funding. Those are financing
              events, not revenue, cash availability, or runway. With public pricing reported as quote-only and customer
              concentration undisclosed, the kill criteria are deteriorating model economics, inability to document safe
              authorization, repeated material service failures, or a runway plan that cannot support the announced
              expansion.
