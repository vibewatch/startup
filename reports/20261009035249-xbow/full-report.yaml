      - number: '3.3'
        title: Commercial Models, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in offensive security is undergoing a structural shift. Until mid-July 2026, XBOW
              published self-serve list prices for its Lightspeed on-demand pentests ($4,000 for Plus and $8,000 for
              Premium), but subsequently retired public figures in favor of private, environment-scoped usage-based
              pricing [CP013, CP014]. Practitioner feedback reveals that token- and credit-based consumption models can
              introduce budget unpredictability for continuous scans, leading some enterprise teams to restrict testing
              to quarterly cadences rather than continuous deployment runs [CP015].


              Switching costs in autonomous offensive security remain moderate to low at the testing layer, as blackbox
              tools require minimal infrastructure coupling beyond allowlisting and URL provisioning [CP002, CP016].
              However, lock-in increases when platforms deeply integrate with enterprise governance, SIEM/SOAR
              infrastructure, and compliance posture engines like Microsoft Sentinel or Vanta [CP002, CP016]. XBOW's
              moat relies heavily on its proprietary agent orchestration and frontier AI model evaluation pipeline
              [CP007, CP017], but sustaining differentiation requires defending against rapid commoditization as
              frontier foundation models become progressively more capable offensive actors out of the box.
            claimRefs:
