      - number: '1.4'
        title: Commercial Traction, Go-to-Market Shift, and Critical Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              XBOW serves more than 150 enterprise security organizations globally, including reference accounts such as
              Moderna, PuppyGraph, and Superhuman. However, the company executed a significant commercial pivot in
              mid-July 2026 by removing its transparent, self-serve list pricing—which had previously offered Lightspeed
              Plus at $4,000 per test and Lightspeed Premium at $8,000 per test—in favor of custom, sales-negotiated
              usage-based contracts. Independent security analyst reviews highlight that this opacity introduces
              budgeting friction for prospective buyers, as contracts scale unpredictably with external attack surface
              expansion while technical coverage remains bounded strictly to web applications and APIs. Furthermore,
              independent private market comparables illustrate the risk of informational conflation between XBOW's
              cybersecurity software business and unrelated aerospace defense contractors carrying the same corporate
              acronym.
            claimRefs:
              - CO014
              - CO015
