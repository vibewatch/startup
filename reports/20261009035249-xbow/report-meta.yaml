companyProfile:
  summary: >-
    XBOW is a Series C autonomous offensive security company founded in 2024 by Oege de Moor. It replaces periodic
    manual penetration tests with continuous exploit validation across web applications and exposed APIs, and it has
    visible enterprise adoption and tier-one investor backing. Public evidence still does not disclose ARR, gross
    margin, cash burn, or runway, so commercial underwriting remains constrained by opaque economics.
