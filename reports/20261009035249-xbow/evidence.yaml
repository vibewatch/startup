evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements or verified disclosures detailing ARR, revenue growth, gross margins, cash burn rate,
      and net retention.
    whyItMatters: >-
      XBOW's $1B+ unicorn valuation is anchored almost entirely on forward technological expectations and private
      financing rounds rather than public financial proof.
    diligencePath: >-
      Request confidential management financial packages, GAAP revenue schedules, customer ARR cohort data, and gross
      margin breakdowns during confirmatory diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: addressable-market-sizing
    missingEvidence: >-
      Audited TAM, SAM, and SOM financial breakdowns and total annual contract value (ACV) distributions across
      autonomous offensive security vendors.
    whyItMatters: >-
      Without segmented financial filings, sizing the serviceable addressable market relies on proxy pricing and
      estimates from legacy consulting replacements.
    diligencePath: >-
      Review vendor investor presentation materials, customer cohort ACV metrics, and contract renewal data during
      private diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Recognized revenue, ARR, revenue mix, realized price, contract duration, discounting, collections, and
      revenue-recognition policy.
    whyItMatters: >-
      Without these inputs, customer activity cannot be translated into recurring revenue quality or a defensible
      revenue multiple.
    diligencePath: >-
      Request audited statements, monthly bookings-to-revenue bridges, executed order forms, invoice samples, and
      product-level revenue cohorts under NDA.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Cost of revenue, gross margin, compute consumption, security-labor allocation, CAC, payback, sales cycle,
      retention, and churn.
    whyItMatters: >-
      These inputs determine whether autonomous testing scales as software or remains materially dependent on variable
      compute and expert services.
    diligencePath: >-
      Obtain a gross-margin bridge, infrastructure bills, labor allocation, sales funnel, and logo and dollar retention
      by quarterly cohort.
    relatedQuestionRefs:
      - QI004
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, debt and lease obligations, cloud commitments, downside budget, runway, and next-round
      trigger.
    whyItMatters: >-
      Funding raised cannot establish remaining liquidity, financing dependency, or the timing and terms of a future
      capital need.
    diligencePath: >-
      Request the latest balance sheet, monthly cash-flow history, board-approved operating plan, obligation schedule,
      and downside runway case.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - id: GU001
    type: private-evidence-only
    severity: material
    topic: customer-retention-nrr
    missingEvidence: >-
      Audited figures for Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn rates across
      historical cohorts.
    whyItMatters: >-
      Without retention and expansion data, it is impossible to evaluate whether accounts expand testing scope
      sustainably or churn after resolving initial compliance audits.
    diligencePath: Request confidential SaaS cohort retention tables and renewal rate metrics during institutional diligence.
    relatedQuestionRefs:
      - QU002
  - id: GU002
    type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Percentage of ARR accounted for by top 5 and top 10 enterprise accounts.
    whyItMatters: >-
      High revenue concentration in a few large accounts or heavy reliance on the Vanta partnership would present
      revenue vulnerability.
    diligencePath: Obtain management revenue breakdown and partner attribution schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QU001
      - QU006
  - id: GU003
    type: enumeration-incomplete
    severity: minor
    topic: named-deployments-enumeration
    missingEvidence: >-
      Comprehensive roster of all enterprise production deployments beyond the public reference accounts Moderna,
      PuppyGraph, Seznam, and Superhuman.
    whyItMatters: >-
      Public testimonials reflect selection bias toward satisfied technology-forward accounts and may not reflect
      typical enterprise renewal satisfaction.
    diligencePath: Conduct blind customer reference calls across enterprise and mid-market accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-record
    missingEvidence: >-
      Primary regulator, court, patent, export-control, and licensing records tied to XBOW and each operating
      jurisdiction.
    whyItMatters: >-
      Contract terms do not establish that autonomous offensive testing is cleared for every target, data type, or
      jurisdiction.
    diligencePath: >-
      Run entity and founder searches in federal and state court dockets, regulator databases, export-control lists,
      patent offices, and each target-market licensing regime; obtain outside-counsel memoranda.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      A complete jurisdiction-by-jurisdiction register of licenses, approvals, litigation, enforcement, privacy
      obligations, and IP disputes.
    whyItMatters: >-
      TR001 is limited to allocated public contract and packaging evidence and cannot establish exhaustive legal
      coverage.
    diligencePath: >-
      Obtain the company's legal register, claims history, insurance schedule, privacy assessments, rules of engagement,
      and counsel confirmations, then reconcile each item to primary records.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-service-levels
    missingEvidence: >-
      Independent outage and incident history, SLA attainment, recovery testing, unsafe-action logs, false-negative
      rates, and customer control-test results.
    whyItMatters: Company claims and contract limitations cannot quantify the frequency or consequence of operational failures.
    diligencePath: >-
      Review 24 months of status and incident records, SOC reports, penetration tests, disaster-recovery exercises,
      customer escalation logs, model safety evaluations, and SLA credits.
    relatedQuestionRefs:
      - QR004
      - QR006
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: >-
      Cash balance, restricted cash, monthly net burn, gross margin, model-inference cost, working capital, debt, and
      board-approved operating plan.
    whyItMatters: >-
      Funding raised does not establish cash available or the runway to fund international expansion and product
      scaling.
    diligencePath: >-
      Reconcile bank statements and the cap table to audited financials, monthly management accounts, cloud/model
      invoices, hiring commitments, and a downside cash forecast.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue shares, renewal cohorts, contract duration, pipeline conversion, marketplace concentration,
      and concessions by customer.
    whyItMatters: A count of security teams does not show revenue durability or exposure to a small set of enterprise renewals.
    diligencePath: >-
      Inspect customer-level ARR and recognized revenue, signed contracts, renewal history, cohort retention,
      marketplace billings, and the top-10 account plan.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: access-blocked
    severity: minor
