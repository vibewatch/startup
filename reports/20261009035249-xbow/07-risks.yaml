company:
  name: "XBOW"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    XBOW's largest diligence risks are not a documented enforcement action or incident, but the
    combination of autonomous live-system testing, model-judgment limitations, third-party
    dependencies, contractual warranty and remedy limits, and undisclosed operating economics.
    The public record supports concrete controls and funding events, but not a conclusion that
    these residual exposures are fully mitigated.
sections:
  - id: "ranked-risk-view"
    title: "Residual risk is concentrated in validation, authorization, and transparency"
    body: >-
      The evidence supports a high residual-risk posture despite credible mitigation claims.
      XBOW says customers define scope, every action is logged, and deployment can align with
      enterprise compliance requirements, but those are company claims rather than independent
      control tests. Its own sponsored model evaluation describes mixed judgment and materially
      weaker command-safety performance than two cited comparison results. The terms also shift
      important authorization, credential, data, and downstream-decision responsibilities to the
      customer. The heatmap therefore ranks legal authorization, model judgment, dependency,
      service-assurance, and financial-transparency risks by evidence strength rather than by an
      assumed incident history. No allocated source establishes that a breach, outage, lawsuit, or
      enforcement action occurred, and that absence is not treated as proof that none exists.
    claimRefs: [CR002, CR004, CR006, CR007, CR009, CR010, CR016]
    figureRefs: [FR001]
  - id: "legal-regulatory"
    title: "Contractual allocation leaves material legal and data diligence"
    body: >-
      XBOW's published terms create a usable first-pass legal map but not a jurisdiction-by-
      jurisdiction clearance. Customers must use the service lawfully, control authorized users
      and credentials, and accept responsibility for resulting conclusions and actions. Sensitive
      data is expressly outside the designed use case, while security, uptime, and support are
      framed around commercially reasonable efforts and the selected support package. The terms
      also permit suspension for security, legal, payment, and rights-related triggers and limit
      remedies subject to stated exceptions. These provisions reduce ambiguity about allocation,
      not exposure. Investment diligence should obtain the current DPA, order form, rules of
      engagement, insurance, subprocessor list, and independent assurance reports before treating
      privacy, authorization, or platform-security risk as mitigated.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR013]
    tableRefs: [TR001]
  - id: "operational-model-security"
    title: "Autonomy still depends on judgment, live-system controls, and service reliability"
    body: >-
      The strongest operational warning comes from XBOW's own sponsored evaluation rather than an
      external incident record. It says the tested model needs precise prompts, explicit threat
      models, and validation infrastructure; its reported command-safety accuracy was 77.8%,
      below the cited Opus 4.6 and Haiku 4.5 results. The same evaluation says removing live-site
      access hurt benchmark performance more than removing source-code access, reinforcing that
      orchestration and safe interaction are core to outcomes. That is strategically coherent
      with XBOW's product, but it concentrates failure risk in harness quality, scope enforcement,
      action logging, and customer configuration. Contractual disclaimers and the lack of a public
      fixed SLA or incident history in the allocated evidence keep residual reliability risk
      above low.
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR011, CR013]
    tableRefs: [TR002]
  - id: "dependencies-financial-execution"
    title: "Provider economics, integrations, expansion, and undisclosed runway are linked risks"
    body: >-
      XBOW acknowledges that service availability can depend on third-party integrations and that
      withdrawn permissions can interrupt service. Its sponsored Mythos analysis also reports a
      potential five-times-Opus model price and says that model was not best-in-class on estimated
      cost-normalized benchmarks, illustrating the cost and supplier trade-offs in maintaining a
      multi-model system. Independent reports corroborate a $120 million Series C at a valuation
      above $1 billion, while a lower-quality market-data page reports a later $35 million
      extension and $272 million cumulative funding. Those are financing events, not revenue,
      cash availability, or runway. With public pricing reported as quote-only and customer
      concentration undisclosed, the kill criteria are deteriorating model economics, inability
      to document safe authorization, repeated material service failures, or a runway plan that
      cannot support the announced expansion.
    claimRefs: [CR001, CR008, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
tables:
  - id: "TR001"
    title: "Regulatory / legal risk register"
    columns: ["Risk / rule", "Public status and jurisdiction", "Likelihood", "Impact", "Mitigation maturity", "Residual exposure and diligence path"]
    rows:
      - ["Authorized offensive testing, export, and third-party rights", "XBOW contract; customer must comply with applicable law and control authorized use; jurisdiction-specific clearance not public", "Medium", "High", "Contractual", "High until counsel reviews rules of engagement, target authorization, export exposure, and customer indemnities"]
      - ["Privacy and sensitive-data handling", "Global contractual posture; service is not designed to store Sensitive Data and incorporates a DPA where applicable", "Medium", "High", "Partial", "High until DPA, data flows, retention, subprocessors, residency, and deletion controls are verified"]
      - ["Service security, warranty, and liability", "Delaware-law terms disclaim secure or error-free operation and cap aggregate direct liability subject to enumerated exceptions", "Medium", "High", "Contractual", "High for mission-critical use until cyber insurance, negotiated caps, warranty exceptions, and assurance reports are reviewed"]
      - ["Suspension and enterprise-governance access", "Terms allow suspension for security, legal, rights, payment, and insolvency triggers; a competitor reports governance features can be custom-tier gated", "Low-Medium", "High", "Partial", "Medium-High until order-form protections, notice/cure rights, SSO/API terms, and continuity procedures are confirmed"]
    notes: "Partial public-document register as of 2026-10-09; likelihood and residual labels are analyst judgments tied to the cited contractual and packaging evidence, not incident frequencies."
    enumerationScope:
      coverage: "partial"
      basis: "Public XBOW terms, company governance claims, and one competitor-issued packaging review allocated to this chapter; no court or regulator docket was available in the pool."
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR013]
  - id: "TR002"
    title: "Operational / quality / security risk register"
    columns: ["Failure mode", "Evidence signal", "Likelihood", "Severity", "Mitigation maturity", "Residual exposure / monitor"]
    rows:
      - ["Unsafe or overly literal model action", "Sponsored evaluation reports 77.8% command-safety accuracy and mixed judgment", "Medium", "High", "Developing", "Monitor prevented unsafe actions, human overrides, boundary-test failures, and policy exceptions"]
      - ["Missed or mis-prioritized vulnerability", "Sponsored evaluation says strong reasoning is not self-sufficient and requires explicit threat models and validation", "Medium", "High", "Developing", "Require customer-blind validation, false-negative sampling, and reproducibility metrics by target class"]
      - ["Live-target orchestration failure", "Removing live-site access hurt the cited benchmark more than removing source access", "Medium", "High", "Core product control", "Review scope enforcement, rate limits, kill switch, evidence logs, and production-safe test protocols"]
      - ["Service interruption or unsupported assurance", "Support and uptime use commercially reasonable efforts; secure, uninterrupted, and error-free operation is not warranted", "Medium", "High", "Contractual", "Obtain SLA history, incident record, disaster-recovery results, RTO/RPO, and customer credits"]
    notes: "No incident-rate denominator was available; likelihood and severity are qualitative judgments based on the disclosed benchmark limitations, official controls, and contract terms."
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR011]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns: ["Dependency", "Counterparty / role", "Concentration evidence", "Failure scenario", "Severity", "Mitigation and residual exposure"]
    rows:
      - ["Third-party integrations", "Unspecified integrated platforms and open-source components", "No supplier shares disclosed", "Permission loss or provider failure suspends part of the service", "High", "Contract acknowledges dependency; obtain critical-vendor map, substitutes, and outage history"]
      - ["Foundation-model capability and cost", "Anthropic Mythos Preview is one tested engine; XBOW says it maintains a cadre of models", "Provider allocation not disclosed", "Price/performance changes increase test cost or reduce detection quality", "High", "Multi-model posture helps, but require routing economics, fallback tests, and provider concentration"]
      - ["Growth capital and expansion", "DFJ Growth, Northzone, and other Series C investors fund product and international scaling", "Funding disclosed; cash availability and burn undisclosed", "Expansion commitments outrun liquidity or execution capacity", "High", "Board should review cash, monthly burn, hiring plan, and milestone-linked runway quarterly"]
      - ["Customer concentration and procurement", "XBOW claims 150+ security teams; competitor review says pricing is quote-only", "No customer revenue distribution disclosed", "A few large renewals or enterprise terms drive revenue volatility", "High", "Request top-10 revenue shares, renewal cohorts, pipeline conversion, concessions, and marketplace exposure"]
    notes: "Funding raised is not cash available, and a customer-count claim is not a revenue-concentration denominator; null concentration fields remain explicit diligence gaps."
    claimRefs: [CR001, CR008, CR012, CR013, CR014, CR015, CR016]
