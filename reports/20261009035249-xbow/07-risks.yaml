    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR009, CR010, CR011, CR012, CR016]
callouts:
  - calloutType: "risk"
    title: "Thesis-break trigger"
    body: >-
      Pause investment if customer-authorized testing controls cannot be independently validated,
      if material unsafe actions or outages recur without auditable remediation, or if verified
      cash and burn show that expansion cannot be funded through the next operating milestones.
    claimRefs: [CR002, CR004, CR007, CR009, CR016]
  - calloutType: "recommendation"
    title: "Diligence priority"
    body: >-
      Obtain independent control evidence, incident and SLA history, model-routing economics,
      customer concentration, and a cash-to-runway bridge before converting public technical proof
      or financing headlines into a lower residual-risk rating.
    claimRefs: [CR005, CR006, CR008, CR012, CR014, CR015, CR016]
