callouts:
  - calloutType: "insight"
    title: "Exploit Proof Supersedes Alert Volume in Enterprise AppSec"
    body: "Enterprise security teams are experiencing severe validation paralysis due to traditional vulnerability scanners flooding queues with theoretical risks. By prioritizing working exploit validation and attack path chaining over raw finding counts, autonomous offensive security shifts the economic value proposition from discovery volume to verified remediation priority."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM005"
  - calloutType: "risk"
    title: "Pricing Opacity and Shifting Commercial Terms"
    body: "The retirement of transparent on-demand testing price tiers ($4,000 to $8,000 per test) in favor of opaque, custom usage-based contracts introduces friction during mid-market procurement. While custom pricing aligns with enterprise estate volume, it forces buyers through lengthy sales cycles and heightens budget uncertainty."
