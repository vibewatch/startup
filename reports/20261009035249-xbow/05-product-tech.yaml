callouts:
  - calloutType: "insight"
    title: "The Tradeoff Between External Frontier Models and In-House Engines"
    body: >-
      XBOW's strategic choice to route reasoning to external commercial frontier models grants it immediate access to cutting-edge cognitive capabilities, enabling sophisticated multi-step exploit chains such as the Microsoft Bing RCE. However, this architectural bet creates permanent operational exposure to external API pricing, latency variations, provider safety filters, and enterprise data residency concerns. Competitors with dedicated, in-house offensive models sacrifice generic reasoning breadth to achieve predictable pricing, on-premises isolation, and guaranteed immunity from external provider policy shifts.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE013"
  - calloutType: "risk"
    title: "The Reality Gap Between Automation and Full Operational Autonomy"
    body: >-
      While XBOW markets fully autonomous testing, independent academic analysis and competitor teardowns emphasize that eliminating human keyboard input during an attack scan is not equivalent to eliminating human oversight from the security lifecycle. Human experts remain essential for initial scoping, interpreting nuanced business logic, resolving destructive testing boundaries, and conducting secondary verification before findings enter public reporting programs.
    claimRefs:
      - "CE010"
      - "CE013"
      - "CE015"
