  topStrengths:
    - Proprietary CO2 electrochemistry with a clear path to aviation fuel and chemical products.
    - Deep capital backing from strategic and institutional investors, including project finance.
    - Named-partner and customer proof exists, even if the current commercial scale is still opaque.
  topRisks:
    - AirPlant One execution and undisclosed unit economics remain the central diligence blocker.
    - Capital intensity and project-finance seniority create dilution and downside risk.
    - Current customer scale, retention, and concentration remain opaque in public disclosures.
  unresolvedGaps:
