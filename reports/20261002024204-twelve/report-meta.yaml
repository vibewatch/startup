companyProfile:
  summary: >-
    Twelve is a private industrial carbon transformation company founded in 2015 that uses electrochemical CO2 reduction
    and renewable electricity to make sustainable aviation fuel, eChemicals, and CO2Made materials. The company is led
    by its Stanford-founded technical team, operates across Berkeley, Alameda, and Moses Lake, and has raised more than
    $900 million to build AirPlant One as its first commercial-scale manufacturing node.
  founders:
