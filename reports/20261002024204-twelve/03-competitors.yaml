callouts:
  - calloutType: "insight"
    title: "Electrochemical Integration Creates Architecture Moats at High Capital Expense"
    body: "Twelve's core competitive advantage against other Power-to-Liquid developers is its proprietary Leaf MEA, which produces syngas directly from CO2 and water in a single reactor train, eliminating the need for standalone reverse water-gas shift (RWGS) thermal units. However, because the technology operates as a capital-intensive first-of-a-kind (FOAK) industrial plant, execution at AirPlant One in Moses Lake is critical to establishing durable cost leadership before competing eFuel developers achieve commercial scale."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP010"
