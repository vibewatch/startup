callouts:
  - calloutType: "insight"
    title: "Bifurcated Revenue Architecture Bridges Fossil Price Parity"
    body: "Because conventional commercial airlines operate with tight cash operating margins and cannot absorb multi-fold synthetic fuel price premiums alone, Twelve's commercial model relies on decoupling the physical commodity fuel from its environmental attributes. Corporate customers purchasing Scope 3 SAF certificates (SAFc) through SABA and IATA absorb the green premium, effectively subsidizing physical airline offtake."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI008"
  - calloutType: "risk"
    title: "Extreme Power Input Sensitivity Threatens Unit Contribution Margins"
    body: "Power-to-Liquid synthesis is fundamentally an electrochemical conversion process where electricity represents the single largest variable operating expense. If regional industrial renewable electricity rates escalate or transmission constraints limit utilization at AirPlant One, facility-level unit economics will suffer sharp margin degradation regardless of top-line subsidy incentives."
    claimRefs:
      - "CI001"
      - "CI011"
      - "CI013"
