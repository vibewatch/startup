callouts:
  - calloutType: "insight"
    title: "The Book-and-Claim SAFc Mechanism as a Capital Bridge"
    body: "Because airlines face razor-thin operating margins and cannot absorb high PtL green premiums alone, the book-and-claim SAFc credit market (partnered with SABA and IATA) functions as an essential co-funding mechanism. Corporate travelers subsidize the green attribute premium, enabling physical fuel delivery to airlines while Twelve secures diversified revenue streams."
    claimRefs:
      - "CM011"
      - "CM012"
  - calloutType: "risk"
    title: "Power Availability and Capital Intensity as Scaling Bottlenecks"
    body: "PtL manufacturing is intensely energy-demanding. Scaling from AirPlant One to an industrial network requires hundreds of megawatts of continuous clean electricity and substantial project finance. Grid bottlenecks or escalation in renewable electricity costs directly threaten unit economics and delay commercial deployment."
    claimRefs:
      - "CM008"
      - "CM014"
      - "CM015"
