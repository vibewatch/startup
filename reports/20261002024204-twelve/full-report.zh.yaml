            title: 作为资本过渡机制的 SAFc 簿记与声明模式
            body: >-
              鉴于航空公司营业利润率微薄，难以独自承担 PtL 燃料高昂的绿色溢价，与 SABA 及 IATA 合作的 SAFc
              簿记与声明信用机制成为关键的联合出资渠道。企业差旅买方承担绿色环境溢价，促成燃料向航司物理交付，同时也为 Twelve 锁定了多元化收入。
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: 电力供应与资本强度成为规模扩张瓶颈
            body: >-
              PtL 制造属于极度依赖能源的重工业流程。从 AirPlant One
              扩张至工业级生产网络，需要数百兆瓦不间断的清洁电力以及巨额项目融资支持。电网接入瓶颈或绿电采购成本上涨，将直接侵蚀单位经济模型并推迟商业化投产进度。
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
