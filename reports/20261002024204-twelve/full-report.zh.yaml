chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业沿革、创立背景与核心平台
        blocks:
          - type: paragraph
            body: >-
              Twelve（前身为 Opus 12）成立于 2015 年，是一家新一代工业碳转化公司，总部横跨加利福尼亚州 Berkeley 与 Alameda [CO001]。公司由 Stanford 研究员 Dr.
              Etosha Cave、Dr. Kendra Kuhl 以及 MBA 创业者 Nicholas Flanders 共同创立，旨在利用空气、水和可再生电力替代化石原料
              [CO002]。与将二氧化碳捕集用于地下永久封存（CCUS/CDR）或提高石油采收率（EOR）不同，Twelve 的电化学平台将 CO2
              作为工业化工原料，把碳排放直接转化为合成气（syngas）与直接替代型碳氢化合物 [CO003]。公司技术栈依托自研 Leaf 膜电极组件（MEA），在工业级 CO2 电解槽内运行，生产名为 E-Jet
              的电转液（Power-to-Liquid）合成航空燃料，以及 E-Naphtha 等石化原料 [CO004]。商业化部署以分布式 AirPlant 模块化架构为核心，首座实体制造工厂 AirPlant One
              落地华盛顿州 Moses Lake [CO005]。
