companyProfile:
  summary: >-
    Twelve 成立于 2015 年，是一家专注工业碳转化的非上市公司，利用电化学 CO2 还原技术与可再生电力生产可持续航空燃料（SAF）、eChemicals 以及 CO2Made 材料。公司由 Stanford
    创始技术团队掌舵，在 Berkeley、Alameda 与 Moses Lake 均有业务布局，累计融资超过 $900M，用于建设首个商业级制造基地 AirPlant One。
