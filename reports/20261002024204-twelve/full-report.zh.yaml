      - number: '7.2'
        title: 合规监管、政策依赖与环保舆情审视
        blocks:
          - type: paragraph
            body: >-
              Twelve 的长期商业模式与承购吸引力，高度依附于环境监管法规、碳核算标准与清洁燃料扶持政策。在航空领域，E-Jet 燃料的需求增长主要受 ReFuelEU Aviation
              等强制配额政策，以及基于科学碳目标倡议（SBTi）框架的企业范围三（Scope 3）脱碳承诺所拉动。但对政策补贴的高度依赖潜藏着巨大的监管政策风险：包括《通胀削减法案》（IRA）第 45Z
              条款税收抵免在内的联邦清洁燃料补贴政策，面临立法重审、细则调整及全生命周期碳强度（CI）核算标准变更等多重变数。此外，随着企业买家面临日益严苛的“洗绿”（greenwashing）监管审查，环保营销宣传必须保持绝对严谨。在垂直
              B2B
              市场中，商业信任极其脆弱：缺乏数据支撑或误导性的环保声明会迅速侵蚀多年累积的品牌声誉，进而招致监管调查与客户合同解约。与此同时，在零售或机构渠道开展的未上市前私募股权转让及二级交易，亦在该公司保持私有化状态的背景下，为投资者关系维护与信息披露带来复杂的合规挑战。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: 现场运营执行、原料供应稳定性与技术工程放大
        blocks:
          - type: paragraph
            body: >-
              Twelve 的工业化可行性取决于三大基础物理要素的持续稳定供应：生物源二氧化碳、工业工艺用水以及充裕低廉的可再生电力。利用水制备绿氢并通过 Twelve 自研 Leaf 膜电极组件驱动 CO2
              电化学还原，需要电网以极高在线率输入海量电力。当地输电电网扩容瓶颈、并网延迟或区域绿电价格剧烈波动，都将直接侵蚀毛利空间并破坏单厂经济模型。采购生物源点源 CO2
              原料带来了高度集中的区域供应链依赖风险：任何上游工厂停机检修、原料气杂质污染或物流运输受阻，都会导致全厂降负荷或停产。在工程放大维度，将电化学反应单胞放大为数兆瓦级商业化电解槽堆，面临着催化剂中毒、膜降解、热管理失衡以及计划外维护停机等工程隐患，上述问题均可能延误商业交付排期并触发承购协议违约索赔。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 对手方集中度、承购依赖与项目终止触发条件
        blocks:
          - type: paragraph
            body: >-
              Twelve 的商业化策略高度依仗关键战略合作方，涵盖基石股权投资方、建设贷款提供方、工业技术伙伴及航司消纳方。AirPlant One 及后续工厂的资金筹措依赖结构化项目融资，包括 TPG Rise
              Climate 高达 $400 million 的项目股权承诺、Fundamental Renewables 与 Sumitomo Mitsui Banking Corporation 提供的 $45
              million 首期授信额度，以及追加的 $85 million Series C 股权与建设贷款扩额。商业消纳端的对手方依赖同样高度集中：Alaska Airlines 与 International
              Airlines Group（IAG）等核心航司伙伴的承购承诺，直接决定了早期收入规模。消纳协议普遍约定了严格的交付节点、燃料规格标准（如 ASTM D7566 Annex A1
              认证）及供货量门槛；工厂调试若有延误，或技术上未能达到认证燃料规格，均可能触发合同约定的违约赔偿金、惩罚条款乃至协议终止。这些运营与财务依赖，为潜在投资机构划定了明确的逻辑破坏触发点与一票否决指标。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 重点展品
        blocks:
          - type: callout
            title: AirPlant One 投产调试：决定成败的二元里程碑
            body: >-
              Twelve 面临的核心风险，在于 AirPlant One 能否在运营与经济性上跑通。作为首座（FOAK）商业化 Power-to-Liquid
              生产设施，任何严重的工程瓶颈——无论是电解槽膜连续工作寿命、法拉第效率还是合成气升级提纯——都会动摇整个技术平台的投资逻辑。在 AirPlant One
              以预估单位成本跑通连续生产之前，商业化放量及后续项目融资都将持续暴露在执行风险之中。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR013
          - type: callout
            title: 核心尽调要求与监测指标
            body: >-
              机构投资方必须优先核实三项尽调要件：（1）详述 Twelve 自研 Leaf 膜电极组件（MEA）衰减曲线与累计运行工时的独立工程报告；（2）与 Alaska Airlines 及 IAG
              签署的有约束力消纳合同条款，重点关注供货量豁免机制、交付截止日及违约金条款；（3）Moses Lake 当地的长期购电协议（PPA），以此锁定电价稳定性。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR010
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Twelve 的核心投资逻辑建立在自研电化学二氧化碳还原平台之上：利用捕集的 CO2、水与可再生电力直接合成替代性碳氢化合物，彻底摆脱生物质土地与原料供给约束。在可持续航空燃料（SAF）赛道，ReFuelEU
              Aviation 等监管法规与企业 Scope 3 减碳承诺催生出数十亿美元级的结构性需求；Twelve 不仅手握航司长期采购承诺，还拥有 TPG Rise Climate、Capricorn
              Investment Group、Pulse Fund 与 United Airlines Ventures 等全球交通及气候领军机构的战略注资。反向逻辑则集中于极高的资本开支强度、华盛顿州 Moses Lake
              AirPlant One
              严峻的工程交付风险，以及商业模式对电价和联邦税收抵免政策的长期脆弱性。电化学燃料合成高度依赖持续的低成本绿电，单座工厂资本开支极其沉重，调试进度稍有拖延或实际产量不及设计标称产能，股权投资方就会面临估值倍数严重压缩与股权稀释风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
      - number: '8.2'
        title: 融资历史、估值判断与资本悬顶
        blocks:
          - type: paragraph
            body: >-
              Twelve 累计融资超过 $934 million，采用了一套复杂的多层级资本架构，统筹兼顾母公司技术研发与重资产项目建设的资金需求。2024 年 9 月，Twelve 公布了一笔总额达 $645
              million 的标志性综合融资：包含由 TPG Rise Climate 领投的 $200 million Series C 股权融资、专门投向未来 AirPlant 工厂的高达 $400 million
              项目股权，以及来自 Fundamental Renewables 与 Sumitomo Mitsui Banking Corporation 的 $45 million 债权授信。2025 年初，公司又追加获得
              $85 million 战略 Series C 股权与项目资金，并拿到美国能源部（Department of Energy）$6 million
              的拨款资助。这种混合资本架构虽然避免了母公司股权独自承担整座工厂的建设负债，但上一轮融资隐含的企业价值已高达约 $2.75
              billion，以尚未实现商业化的工业科技项目来衡量，这一估值倍数明显偏高（stretched）。未经证实的二手份额挂牌以及不相干实体的融资信息，更印证了严守入场估值纪律的必要性——一旦商业化产出未达预期，资本结构的悬顶效应与项目股权层级优先回报要求，将大幅挤压普通股的上行空间。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
