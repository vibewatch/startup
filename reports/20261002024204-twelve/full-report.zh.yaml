      - number: '8.3'
        title: 乐观、基准与悲观情景推演框架
        blocks:
          - type: paragraph
            body: >-
              评估 Twelve 的价值，必须紧扣实体工程里程碑节点与单位生产经济模型展开情景化推演，而不能套用通用的成长型软件估值倍数。在乐观情景下，AirPlant One 顺利完成调试并实现 50,000
              加仑的生产目标，同时跑出具备竞争力的单位生产成本；由此解锁 TPG $400 million 的项目股权额度，依托航司长期消纳协议启动多工厂规模化建设。在基准情景下，AirPlant One
              实现技术运转，但产能爬坡滞后、耗电量超标且出现小幅成本超支，迫使公司募集具有稀释性的过桥资金，估值倍数保持在合理区间（fair）但上行受限。在悲观情景下，调试瓶颈、工业电价上调或清洁燃料税收抵免政策变动重创工厂盈利能力，触发低估值轮次重组（down-round
              restructuring），后期股权投资人遭遇严重稀释。
