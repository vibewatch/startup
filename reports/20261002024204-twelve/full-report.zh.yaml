      - number: '4.2'
        title: GTM 路径、采购复杂性与销售效率推算
        blocks:
          - type: paragraph
            body: >-
              Twelve 的市场拓展（GTM）路径与高周转的软件或模块化硬件模式截然不同，更接近重资产工业基础设施开发，具有多方参与评估、采购决策周期极长等特征。在新兴垂直的 B2B
              清洁技术市场，销售周期极其冗长繁复：技术负责人评估材料的直接兼容性，合规团队核验碳核算监管标准，首席财务官则严格审视单位成本溢价与投资回报率。业内对新兴工业 B2B
              定位的独立观察显示，若无法明确量化经济效益与运营指标，往往会导致客户评估期拖延并面临商机流失风险。在 Twelve 与商业客运航司及企业机队的承购谈判中，核心阻力在于传统石油航油与合成 PtL
              燃油之间巨大的成本鸿沟。为减轻航司资产负债表压力，Twelve 引入企业端 SAFc
              簿记与声明机制，将获客成本与绿色溢价分摊给企业可持续发展预算。鉴于客户获取成本（CAC）、以天计算的销售周期、客户终身价值（LTV）及实际回本周期均未公开披露，投资分析只能将工厂项目融资里程碑与已签署的具有法律约束力的承购协议，作为衡量商业落地进展的替代指标。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: 成本驱动要素、资本开支与运营放量瓶颈
        blocks:
          - type: paragraph
            body: >-
              Twelve 的成本结构受制于严格的物理原料依赖、固定资产折旧以及电化学转化本身的经济性规律。借助 PtL 路径利用环境空气或点源 CO2
              及水合成碳氢化合物，本质上是高耗能的工业过程。核心运营支出驱动项包括持续低价的可再生电力、绿氢制备、捕集 CO2 原料采购以及 Opus 电解槽系统的维护。自研 Leaf
              膜电极组件（MEA）采用新型催化剂将二氧化碳还原为合成气（一氧化碳与氢气），随后进一步提纯转化为煤油与石脑油组分。电力成本在合成燃料生产中占据最高的可变运营支出，因此 Twelve
              利润率的改善空间直接取决于能否以具备竞争力的工业电价锁定长期购电协议（PPA）。在资本开支上，建设首台套（FOAK）商业化生产设施需要消耗巨额现金。建于华盛顿州 Moses Lake 的 AirPlant One
              是 Twelve
              分布式电子制造战略的首个实体基地，需要配套专项项目贷款、专业工程总承包（EPC）管理以及长达数年的调试周期。从宏观视角来看，高资本开支强度与复杂的供应链要求带来了极高的运营风险；工厂调试延迟或电价意外上涨，都将迅速压缩单厂经济模型的边际贡献率。
            claimRefs:
