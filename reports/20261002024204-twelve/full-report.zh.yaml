      - number: '2.3'
        title: 买方画像、预算归属与采购链路
        blocks:
          - type: paragraph
            body: >-
              在 Twelve 的目标市场中，客户采纳路径因三类买方而异，各自具备不同的决策人、预算来源与合同结构。在商业航空领域，核心买方是机队运营商与航油采购团队（如 United Airlines 与
              IAG），其关注的核心指标为每加仑成本，以及 ReFuelEU Aviation 或 CORSIA
              强制法规下的合规达标。与此同时，企业大客户构成了第二条采购链路，借助“簿记与声明”（book-and-claim）机制购买可持续航空燃料证书（SAFc），以抵消商务差旅产生的范围三排放。企业买方直接通过可持续航空买家联盟（SABA）或
              IATA 等登记平台采购 SAFc；航空公司负责实际加注燃油，企业买方则核销关联的环境权益。第三类买方来自服装、美妆及汽车内饰领域的消费品牌（如 Pangaia 与 Mercedes-Benz），采购
              CO2Made 直接替代材料以兑现企业 ESG 承诺。在 B2B 市场拓展中，若要在大规模商业化之前撬动早期客群，产品价值必须紧密贴合买方的核心痛点与政策合规诉求。
