  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、商业化架构与定价机制
        blocks:
          - type: paragraph
            body: >-
              Twelve 基于自研 Opus 电化学碳转化平台构建了三大核心收入支柱：电转液电燃料（eFuels）、直接替代型石化原料（eChemicals）以及品牌消费材料（CO2Made）。近期最核心的商业放量引擎为
              E-Jet 可持续航空燃料（SAF），该产品符合 ASTM D7566 Annex A1 标准，相较传统化石 Jet-A 航油最高可减少 90%
              的全生命周期温室气体排放。在航空领域，商业变现依托两种互补机制：一是与商业航司签署的实体燃料长期承购合同；二是向寻求减少范围三（Scope
              3）商务差旅排放的企业大客户销售解耦的“簿记与声明”可持续航空燃油证书（SAFc）。企业客户通过 SABA 和 IATA
              等核查登记平台核销环境属性，形成现金流双轨结构，将大宗实体燃油销售收入与绿色环境溢价彻底解耦。除航空业务外，Twelve 将 E-Naphtha 作为基础化工原料推向工业市场，并与 Mercedes-Benz 及
              Procter & Gamble 等消费品牌签署专项供应协议，交付 CO2Made
              材料。但官方挂牌价、实际按出货量加权的平均售价（ASP）以及合同违约赔偿条款均属于未公开的商业机密，外部投资者无法获知每单位化学产出的实际营业收入与综合回报率。
