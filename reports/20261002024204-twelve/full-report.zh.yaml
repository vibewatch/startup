  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 碳转化平台：电化学还原与 Opus 系统架构
        blocks:
          - type: paragraph
            body: >-
              Twelve 核心平台是一条电转 X（Power-to-X）电化学路线：以二氧化碳、水和可再生电力为原料，替代传统石油炼制 CE001, CE002。Opus
              是这套平台核心电化学反应器，像工业化光合作用一样直接把 CO2 转成合成气 CE003, CE008。合成气由一氧化碳（CO）和绿氢（H2）按特定比例组成，是下游碳氢化合物合成基础中间体 CE003。Opus
              的关键突破是自研 Leaf 膜电极组件（MEA）：专有电催化剂让它能够高选择性、高能效地还原 CO2 CE003。不同于需要大量农地和耕地的生物碳利用或生物质燃料，Twelve 在模块化电解槽里直接完成电化学转化
              CE002, CE003。核心电化学研究和催化剂开发在加州 Berkeley 总部及研发实验室进行，CO2 电解槽的中试制造与系统工程则位于 Alameda CE009。真正的技术瓶颈，是 Leaf MEA
              在工业连续工况下能用多久、法拉第效率能否守住；催化剂衰减和单胞电压漂移是主要工程风险 CE015。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
