            body: >-
              相较于其他 PtL 路线开发商，Twelve 的核心竞争优势在于自研 Leaf MEA：在单套反应装置内直接利用 CO2
              和水制备合成气，省去了独立的高温逆水煤气变换（RWGS）反应器。但由于该技术落地为重资本的首台套（FOAK）工业设施，在 Moses Lake 的 AirPlant One
