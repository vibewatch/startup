      - number: '2.2'
        title: 市场规模测算视角：从全球石化 TAM 到可触达 PtL SAF SAM
        blocks:
          - type: paragraph
            body: >-
              评估 Twelve 的市场潜力需要采用多重视角，而非单一无约束的自上而下测算。放眼全球宏观经济，大背景是体量庞大的化石燃料体系：Twelve 瞄准的是产生大量全球碳排放的化石原料替代；根据合作伙伴引用的 SIPA
              研究，若在化学品、材料和燃料领域用可再生碳替代化石原料，有望减少近 10% 的全球温室气体排放。在交通运输领域，全球航空业每年产生超过 10 亿吨 CO2 排放，年消耗航空燃油超 1,000
              亿加仑，构成一个数千亿美元规模的大宗燃料市场。然而，Twelve
              的可服务市场（SAM）严格受制于航空脱碳政策法规、企业净零承诺以及电转液（PtL）实际产能。在商业化初期，公司的可获取市场（SOM）直接取决于其位于华盛顿州 Moses Lake 的首座工业级工厂
              AirPlant One 的近期产能，该厂也是其分布式电子制造（eManufacturing）平台的首个节点。鉴于全球商业化 PtL 航空燃油供应仍处于早期阶段，自上而下的 TAM
              测算必须结合一线的实际投产节奏与资本约束加以审视。
