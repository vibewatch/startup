  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代技术路径
        blocks:
          - type: paragraph
            body: >-
              看 Twelve 的竞争位置，关键是先看航空燃料买家如何满足液态碳氢化合物需求。传统石油基航空煤油仍占商业航空能源消耗的 99% 以上，背后有已经摊薄的重资产、成熟炼厂和完善的配送网络。随着 ReFuelEU
              Aviation 等强制法规落地、美国 IRA 第 45Z 条税收激励推出，商业航司被迫加快转向可持续航空燃料（SAF）。SAF
              目前的商业主流是氢化酯与脂肪酸（HEFA）：它用废弃油脂（FOGs）生产可直接掺混的链烷烃煤油，但全球农业副产品供给有限，粮油价格波动也会放大成本风险。Twelve 则用点源生物质
              CO2、水和可再生电力驱动电化学电转液（PtL），绕开生物质原料约束。因此，它既要与其他合成 eFuel 开发商竞争，也要面对成熟的生物质气化费托（FT）路线；最终胜负取决于电解槽资本效率和整体转化收率。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
      - number: '3.2'
        title: 主要竞对画像与电化学技术架构差异
        blocks:
          - type: paragraph
            body: >-
              为满足 ASTM D7566 标准中关于合成煤油的直接替代兼容要求，替代航空燃料竞对采用了截然不同的转化架构。传统生物燃料依托 HEFA 炼化工艺，Neste 和 World Energy
              等巨头主导了当前的商业供货量。在 PtL 电燃料领域，Infinium 与 NxtGen 等同行采用两步费托合成路线，将独立的绿氢电解槽与逆水煤气变换（RWGS）或合成气制备反应器相串联。Twelve
              的差异化优势在于，借助自研 Leaf 膜电极组件（MEA），在单个低温电化学反应器内同时实现水电解与 CO2 还原。该工艺直接以 CO2 和水为原料生成合成气，完全省去了高温 RWGS
              设备环节。但这种工艺路线每加仑燃料耗电极高，且要求电解堆在连续工业负荷下具备极高寿命与稳定性。              商业化验证上，Twelve 累计完成超过 $900M 融资，其中包括来自 TPG Rise
              Climate 用于建设华盛顿州 Moses Lake 工厂 AirPlant One 的 $400M 项目股权投资，并获得 Alaska Airlines 和 International Airlines
              Group（IAG）等大型航司的商业承购与合作意向。
