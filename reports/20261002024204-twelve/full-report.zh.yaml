      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 投资建议与估值立场总结
    columns:
      - 维度
      - 评估结论
      - 底层证据与核心驱动因素
      - 决策启示
    rows:
      - - 投资建议
        - 观察 / 继续研究
        - 技术验证虽已确立，但 AirPlant One 的商业化单体经济模型尚未验证
        - 保持密切跟踪；待实际生产运行数据核实后再行动用股权投资款
      - - 置信度
        - 中
        - 虽有大量一级市场融资披露与合作伙伴背书，但实际运营指标仍属非公开，降低了可见度
        - 在将任何一级新股或二级老股额度计入投资决策前，须要求开展排他的保密工厂运行绩效审计
      - - 风险评级
        - 高
        - 极高的资本开支强度、首座量产工厂工程落地挑战，以及对项目债权与分期股权的重度依赖
        - 设置下行保护条款、清算优先权，或争取项目层面的出资参与权
      - - 估值立场
        - 偏高
        - 前一轮估值隐含的 $2.75B 定价，在尚未产生实质收入前就已提前计入了激进的多工厂扩张预期
        - 切勿追高二级市场溢价；围绕工厂调试投产里程碑谈判结构化的估值调整机制（ratchets）
    notes: 综合提炼战略投资逻辑、资本结构披露与商业运营里程碑。估值立场反映经风险调整后的回报预期。
