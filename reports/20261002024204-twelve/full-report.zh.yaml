      - number: '2.4'
        title: 增长驱动力、规模化瓶颈与尽调现实
        blocks:
          - type: paragraph
            body: >-
              市场采纳由三股力量共同推动：严苛监管合规要求、企业可持续发展目标，以及现有替代方案物理极限。传统农作物 HEFA 生物燃料受废弃油脂等原料供应上限约束，因此，用 CO2 和水合成的 PtL
              燃料具备长期发展的必要性。但现实瓶颈也在拖慢 Twelve 扩张。首先是可再生电力：Opus 这类工业级电化学电解槽需要海量、低成本且持续稳定的绿电，才能制取绿氢并还原
              CO2。模块化化工厂的高资本开支、中试到全规模连续商业运行的放大风险、长期承购方的履约信用风险，以及对《通胀削减法案》（IRA）第 45Z 条清洁燃料生产税收抵免等政策激励依赖，也都构成约束。新兴垂直 B2B
              行业销售周期长、决策参与方多，客户又普遍谨慎观望，采纳自然更慢，企业必须守住资金管理和资本纪律。
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM001
      - number: '2.5'
        title: 图表
        blocks:
