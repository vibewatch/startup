      - number: '5.3'
        title: AirPlant One 工业级落地：工程放量、公用工程与技术风险
        blocks:
          - type: paragraph
            body: >-
              Twelve 的碳转化技术正从撬装式示范设备走向华盛顿州 Moses Lake 的 AirPlant One 数兆瓦级工业生产 CE008, CE011。AirPlant One
              是分布式电子制造平台的首个运营节点，计划把模块化电化学电解槽与下游费托（Fischer-Tropsch）气转液（GTL）燃料合成装置放在同一基地 CE001, CE008。工厂已经敲定多笔项目融资，包括
              Fundamental Advisors 扩增的建设信贷额度和战略 C 轮项目资金 CE011。但数兆瓦级 PtL 仍要过技术放大和工程运维两道关
              CE014。电化学反应器必须获得稳定、持续且极低成本的零碳电力，电价波动或区域输电受限都会打击连续生产和单体经济模型 CE014。Leaf MEA
              虽可模块化扩展，辅助系统（BOP）——水脱盐去离子、热能回收、CO2 脱杂提纯和下游催化升级——也必须足够可靠，不能承受突发压力变化或热瞬态冲击 CE014。单程 CO2
              转化率、法拉第效率以及实际循环中的电解槽衰减率仍未公开；商业运营成本能否达到平价，只能等工厂投产后用实测数据验证 CE015。
