  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 核心风险架构与严重度分级
        blocks:
          - type: paragraph
            body: >-
              评估 Twelve 的风险全貌，必须在法律合规、产业政策、现场运营、合作伙伴、财务状况及市场执行等多个维度展开审慎且有实据支撑的深度研判。将电化学碳转化技术商业化——即利用二氧化碳、水和可再生电力生产 E-Jet
              可持续航空燃料与 E-Naphtha 等直接替代型碳氢化合物——面临着与传统软件或一般制造业根本不同的重资产工业风险。Twelve 近期核心的运营瓶颈集中在华盛顿州 Moses Lake 的 AirPlant
              One
              基地，该厂是其首个工业级电转液（PtL）落地节点。从实验室台架及中试电解槽放大至连续工业化运转，引入了包含膜电极组件（MEA）耐用性、法拉第效率及合成气提纯升级系统整合在内的多变量工程不确定性。与此同时，重资产属性带来高昂的资本开支压力：建设高成本化工基地需要搭建由项目股权、企业风投资金及专项信贷设施构成的多层复合资本架构，这使企业高度受制于偿债契约条款、再融资窗口以及资本市场的宏观波动。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
