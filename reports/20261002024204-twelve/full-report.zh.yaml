      - number: '3.3'
        title: 转换成本、分销壁垒与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              在商业航空与基础化工领域，燃料采购方的切换成本完全由“直接替代”认证与供应链兼容性决定。Twelve 的 E-Jet 燃油符合 ASTM D7566 Annex A1
              合成煤油规范，无需改造机体、涡轮发动机或机场输油管网，即可与传统 Jet A/A-1 燃油实现最高 50% 比例掺混。这种直接兼容特性消除了 Alaska Airlines 和 IAG
              等航司客户的工程改造门槛，但也使产品面临与同类合成燃油陷入大宗商品同质化竞争的巨大风险。因此，Twelve
              的竞争壁垒并不来源于品牌忠诚度，而是取决于资金结构设计、自研催化剂抗衰减寿命，以及特定区域的低价绿电资源锁定。Twelve 将 AirPlant One 建于华盛顿州 Moses
              Lake，直接锁定了当地廉价的水电资源，对冲了电燃料合成中占比最高的一项营业支出。长期承购协议与登记平台上 SAFc 证书的直销提供了初步的收入可见度，但 Twelve
              仍面临传统炼厂的规模碾压、基地调试交付延期，以及外购电力现货价格波动等多重风险。
