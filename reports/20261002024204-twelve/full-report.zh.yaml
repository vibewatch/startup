      - CV007
      - CV008
      - CV011
  - id: TV002
    title: 核心投资逻辑与反向逻辑矩阵
    columns:
      - 视角
      - 核心逻辑论点
      - 支撑证据与催化剂
      - 何种变化会推翻判断
    rows:
      - - 投资逻辑（乐观催化）
        - 自研 Opus CO2 电解技术无需占用土地，即可制备减排 90% 的即插即用型 SAF
        - 经核验的 ASTM D7566 Annex A1 兼容器质、航司消纳意向以及一线气候基金背书
        - 出现可证实的电解池耐久度衰减，或法拉第效率未达商业化预期
      - - 投资逻辑（商业拉动）
        - 监管强制配额与航司企业 Scope 3 采购需求巨大，为产品消纳筑起防线
        - 欧盟强制指令以及 IAG、Alaska Airlines 与 United Airlines Ventures 的采购承诺
        - 监管端 SAF 强制掺混配额松动，或主要航司合同发生取消
      - - 反向逻辑（资本开支强度）
        - 建设商用化工设施需源源不断的资金活水与巨额项目债务支撑
        - AirPlant One 需拼装多源资金包（$400M 项目股权、$45M 信贷额度、$85M Series C 轮追加）
        - 早期生产节点即跑通自造血单体经济模型并满足偿债备付要求
      - - 反向逻辑（工程落地风险）
        - 从实验室电解池跨越至 50,000 gal/yr 工厂属首台套放大，工程调试风险极高
        - Moses Lake 工厂作为首个工业化节点，每加仑单位成本尚未公开披露
        - 工厂按期无瑕调试投产，按预期现金毛利率达成经审计的铭牌燃料产量
    notes: 将结构性市场与技术优势，同化工厂工程建设与财务落地风险展开对标权衡。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
  - id: TV003
    title: 乐观、基准与悲观估值情景推演
    columns:
      - 情景
      - 核心运营假设
      - 估值与回报逻辑
      - 核心风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观情景
        - AirPlant One 达到 50,000 gal/yr 铭牌产能；单位现金成本优于目标；TPG 投放 $400M 项目股权
        - 随着多工厂复制落地消除分布式电子制造（eManufacturing）模型风险，估值重估跃升至 $4.0B+ 以上
        - 电网并网延误，或区域 CO2 管道运输遭遇监管阻力
        - 低至中（25%）
      - - 基准情景
        - AirPlant One 调试轻微滞后；成本温和超支；建设 AirPlant Two 需追加股权融资
        - 估值稳定在 $2.5B-$2.75B 区间；由多年平稳产能扩张支撑投资回报
        - 产能爬坡期拉长，以及运营电价上涨压缩投产初期毛利率
        - 中至高（55%）
      - - 悲观情景
        - AirPlant One 遭遇重大技术瓶颈；单位成本大幅偏离化石平价；触发项目债务违约条款
        - 面临流血轮重组或项目股权清算；估值大幅承压跌破 $1.0B
        - 核心设备故障、电解槽严重衰减，或航司长协消纳客户流失
        - 中（20%）
    notes: 情景推演模型基于 Moses Lake 工厂不同运营执行里程碑，评估经风险调整后的股权回报。
    claimRefs:
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 梳理 Twelve 在公司治理、技术突破、股权融资与基础设施建设层面的核心里程碑。
    data:
      items:
        - label: 2015：走出高校创立
          date: '2015-06-01'
          detail: Etosha Cave、Kendra Kuhl 与 Nicholas Flanders 依托 Stanford University 实验室创办 Opus 12。
          tone: positive
        - label: 2016：首笔种子轮融资
          date: '2016-02-24'
          detail: 完成首轮机构风险投资，用于研发初代电化学 CO2 还原实验台原型机。
          tone: positive
        - label: 2018：DCVC 领投种子轮
          date: '2018-06-01'
          detail: DCVC 领投种子轮融资，推动实验室催化剂研究走向可规模化电解池开发。
          tone: positive
        - label: 2021：更名为 Twelve
          date: '2021-08-17'
          detail: Opus 12 正式更名为 Twelve（寓意碳-12），并推出商用 E-Jet SAF 品牌。
          tone: neutral
        - label: 2022：$130M Series B 轮融资
          date: '2022-06-29'
          detail: DCVC 领投 $130M Series B 轮融资，跟投方包括 Capricorn、Carbon Direct、Microsoft Climate Innovation Fund 以及 CZI。
          tone: positive
        - label: 2022：高管领导层扩充
          date: '2022-06-29'
          detail: 引入 Anne Roby（董事会）、David Frank（产品化）与 Ram Ramprasad（商业化），加速推进工业化落地。
          tone: positive
        - label: 2024：TPG 领投 $645M 融资
          date: '2024-09-19'
          detail: 斩获 $645M 出资承诺与建设债务，在华盛顿州 Moses Lake 投建首个工业化 AirPlant One 工厂。
          tone: positive
        - label: 2025：$85M Series C 轮与追加项目融资
          date: '2025-02-14'
          detail: 完成 $85M 追加融资，投资方包括 Amazon Climate Pledge Fund、日本战略投资机构以及追加信贷额度的 Fundamental Advisors。
          tone: positive
    approximationNotes: 日期均取自公开新闻稿、官方博客文章与机构跟踪数据库记录。
