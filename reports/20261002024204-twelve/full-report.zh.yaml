        title: 图表
        blocks:
          - type: callout
            title: 直接合成气制备构建关键能效优势
            body: >-
              传统电转液路线依赖两个高耗能工序：先通过独立电解水装置制取绿氢，再利用高温逆水煤气变换（RWGS）反应器将 CO2 转化为 CO。Twelve 的 Opus
              反应器在单一电化学工序内一步完成该过程，既压降了初期设备资本开支，又减少了系统热能转化损失。
            calloutType: insight
            claimRefs:
              - CE003
              - CE008
          - type: callout
            title: 辅助系统与电力供应构成工程放量核心瓶颈
            body: >-
              尽管模块化电解槽堆易于复制并联，但将 AirPlant One
              推升至满负荷商业产能，将面临严峻的工厂辅助系统（BOP）匹配与公用工程电力负荷制约。持续运行数兆瓦级电化学工厂需要不间断的低价绿电供给；当地电网输电瓶颈或电价飙升将直接侵蚀产品生产边际利润。
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE014
              - CE015
