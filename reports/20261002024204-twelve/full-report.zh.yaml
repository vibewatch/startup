              - CV012
              - CV013
      - number: '8.4'
        title: 退出就绪度、尽调关注项与逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              Twelve 可行的退出路径分为两类：作为工业脱碳旗舰平台最终走向公开上市（IPO），或被全球综合能源巨头及工业气体跨国集团战略收购。但就目前而言，由于缺乏经核实的商业化收入、工厂级单位毛利以及经审计的 GAAP
              财务报表，公司尚不具备登陆公开市场的条件。意向投资方的首要尽调任务包括：核查 AirPlant One 详尽的 EPC 调试进度表与实际运行指标、审阅航司采购协议中的违约罚则，以及确认 $45 million
              授信额度中优先级债权人的限制性条款（covenants）。直接触发“回避（avoid）”建议的核心逻辑破坏点包括：Opus 反应器电解池持续衰减、未经对冲的供电价格剧烈冲击，或核心客户消纳合同遭到取消。
            claimRefs:
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 重点展品
        blocks:
          - type: callout
            title: 严守资本纪律：当前宜保持“观察”而非过早“买入”
            body: >-
              尽管 Twelve 的电化学碳转化技术具备巨大的脱碳潜力，并获得了一线机构的全力支持，但上一轮隐含的 $2.75 billion 估值已经将工厂交付的完美预期完全计入。在 AirPlant One
              公布经审计的实际产量与运营成本基准之前，投资人应当保持“观察（track）”态度。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV011
          - type: callout
            title: 优先项目股权悬顶加剧普通股稀释风险
            body: >-
              Twelve 在 2024 年 9 月达成的融资结构——将专用于项目的 $400 million 股权与 $45 million
              建设信贷额度捆绑——在母公司股权投资人之上构筑了优先级更高的权益结构。工厂层面的任何运营不及预期，都会不成比例地下挫母公司股权的估值空间。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV013
