  - id: FE001
    title: AirPlant 电能制液体生产架构分层堆叠图
    type: stack
    summary: 分层展示 Twelve 工业化电能制液体（PtL）碳转化平台从初始原料到合格即插即用型燃料的技术架构全流程。
    data:
      layers:
        - label: 第 1 层：可再生原料与初始投入
          detail: 点源 CO2 捕集、市政去离子水，以及来自专用水电与风电资源的可持续绿电直供。
          modules:
            - CO2 气体洗涤器
            - 水去离子装置
            - 高压供电进线
        - label: 第 2 层：原料预处理与压缩
          detail: 气体调质、压缩机组与电力整流系统，将电网交流电整流为供给电解堆的大电流直流电。
          modules:
            - 气体除湿与过滤装置
            - 增压压缩机
            - 交流转直流整流柜组
        - label: 第 3 层：Opus 电化学一步法制备合成气
          detail: 电化学反应核心，内置 Leaf 膜电极组件（MEA），单步完成 CO2 还原与水裂解反应，生成合成气（CO + H2）。
          modules:
            - Leaf MEA 电解堆
            - 阴极 CO2 流道
            - 阳极脱氧剂系统
        - label: 第 4 层：催化燃料合成与提质升级
          detail: 热化学费托（Fischer-Tropsch）反应循环回路，集成余热回收系统，将合成气提质转化为烷烃类同步原油。
          modules:
            - 固定床费托反应器
            - 加氢裂化与异构化装置
            - 分馏塔
        - label: 第 5 层：认证级即插即用商业化产品
          detail: 产出符合航空（ASTM D7566 Annex A1）、航运（ISO 8217 DMA）及石化石脑油严苛规格的烃类成品。
          modules:
            - E-Jet SAF 调和终端
            - E-Marine 消纳储运设施
            - E-Naphtha 储罐区
        - label: 第 6 层：监控调度与安全保障系统
          detail: 全厂分布式 SCADA、自动化超压与超温跳闸联锁，以及支撑数字化碳核算与登记簿核验的遥测日志记录系统。
          modules:
            - 全厂 SCADA 网络
            - 紧急跳闸联锁装置
            - 数字化登记簿遥测记录
    approximationNotes: 展示 AirPlant One 部署架构的功能系统层级；各子系统详细运行压力与流量数据属于商业专有信息未对外公开。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE008
      - CE014
  - id: FU001
    title: 企业 SAF 减排凭证采购与划转链路
    type: journey-map
    summary: Twelve 公开的企业 SAF 凭证路径将采购、实体燃料使用、凭证划转及登记簿溯源拆分为独立环节。
    data:
      items:
        - label: 1. 企业减排目标
          detail: 企业买家寻求解决运营或差旅产生的碳排放。
          touchpoints:
            - 直接接洽 Twelve
          note: 未披露客户数量或采购规模。
        - label: 2. 凭证直购路径
          detail: 企业可直接向 Twelve 购买可持续航空燃料凭证。
          touchpoints:
            - 采购 SAF 凭证
          note: 未披露价格及合同期限。
        - label: 3. 航司联采路径
          detail: 企业亦可选择与指定航空公司联合采购 E-Jet。
          touchpoints:
            - 企业买家
            - 航空公司
          note: 所获取的常见问答未披露具名现有参与方。
        - label: 4. 实体燃料加注使用
          detail: 航空公司实际消耗与所购凭证挂钩的 E-Jet。
          touchpoints:
            - 航司燃料消耗
          note: 未披露实际交付燃料体量。
        - label: 5. 凭证划转
          detail: 挂钩 E-Jet 消耗完毕后，凭证划转至企业客户名下。
          touchpoints:
            - 使用后凭证划转
          note: 未披露划转时间节点与违约救济条款。
        - label: 6. 登记簿溯源
          detail: Twelve 称正与 SABA 及 IATA 合作，实现具备全生命周期可追溯性的凭证划转。
          touchpoints:
            - Sustainable Aviation Buyers Alliance
            - International Air Transport Association
          note: 公开文本未提供客户层面的登记簿详细记录。
    approximationNotes: 此图仅为依据 Twelve 常见问答梳理的机制图谱，不可作为已完成交易、转化率或客户留存率的凭据。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
