      - number: '5.2'
        title: 产品矩阵、直接替代规格与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Twelve 的产品矩阵覆盖三大核心层级，均设计为分子级直接替代型（drop-in）产品，客户无需改造下游既有分销管网与储运设施 CE002。在交通燃料领域，Twelve 的旗舰产品为 E-Jet
              可持续航空燃料（SAF），已通过 ASTM D7566 Annex A1 认证，作为商业航空合成煤油调和组分 CE004。此外，Twelve 还开发了符合 ISO 8217 DMA 船用馏分油标准的
              E-Marine 航运燃料，以及面向重型陆运与备用发电的 Electrol 电柴油 CE004。在基础化学品领域，Twelve 开发了完全由 CO2、水和绿电制成的同质替代品
              E-Naphtha，作为下游塑料与合成聚合物的基础构件原料 CE005。在品牌消费品业务中，Twelve 推进 CO2Made 计划与 eMade 平台，与 Mercedes-Benz、Procter &
              Gamble 及 PANGAIA 等品牌合作，利用净零增量排放材料替代消费品中的化石原料成分 CE006, CE007,
              CE010。分子级完全相同的物理特性，使客户无需牺牲机械强度与材料性能，即可直接从现有制造与供应链中剔除化石碳基底 CE002, CE007。
