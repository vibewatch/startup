        title: 资金充裕度、资本结构依赖与尽调承保结论
        blocks:
          - type: paragraph
            body: >-
              相较早期气候科技同行，Twelve 展现了更强的机构募资能力，在股权与专项项目融资中累计筹集超过 $900M 资本。继早期 A 轮与 B 轮融资（包括 2022 年由 DCVC
              领投、Capricorn、Carbon Direct 及 Chan Zuckerberg Initiative 参投的 $130M B 轮融资）之后，Twelve 宣布了由 TPG 领投的 $645M
              综合融资方案，随后又追加了 $85M 战略 C 轮与项目资本。该资本结构特意将来自风投和产业资本（包括 TPG、DCVC、Amazon 旗下 Climate Pledge Fund、Mitsui & Co. 以及
              Development Bank of Japan）的母公司股权，与 Fundamental Advisors 以及 SMBC、CSC Leasing
              等银团伙伴提供的资产端建设信贷额度结合在一起。这种双轨融资设计在利用债务覆盖工厂资本开支的同时，为母公司资产负债表股权构建了防火墙。但从投资承保角度来看，Twelve
              仍处于商业化前期的烧钱阶段，未来的资金充裕度完全维系于 AirPlant One 的投产表现。包括净烧钱率、现金跑道周期、按年加仑计的铭牌设计产能以及每加仑生产成本在内的关键运营指标，仍属于未公开的非公开数据。在
              Moses Lake 基地实现商业化连续稳定运行并验证单厂经济性与偿债备付率（DSCR）之前，Twelve 的财务画像仍属于高风险、重资本开支的基础设施投资标的，高度依赖政策扶持与后续资金输血。
