  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品分类与传统原料替代逻辑
        blocks:
          - type: paragraph
            body: >-
              Twelve 的核心目标市场是工业级碳转化：基于 Power-to-X 和 Power-to-Liquid 路径，利用 CO2、水与可再生电力合成直接替代型碳氢化合物。现有工业制造几乎普遍依赖化石碳氢原料：当前约
              95% 的工业制成品在物理溯源上均来自石油原料。Twelve 的市场边界涵盖三大类产品：电燃料 eFuels（包括 E-Jet 可持续航空燃料、E-Marine 航运用油以及 Electrol eDiesel
              电合成柴油）、电催化化学品 eChemicals（如 E-Naphtha）以及 CO2Made 消费品材料。其直接可触达的支出领域包括民航航油采购、企业差旅与物流的范围三（Scope
              3）减排预算、工业化工原料采购以及消费品牌材料采购。明确排除在外的支出包括不含化学品利用的燃烧后碳捕集与封存（CCS/CDR）、提高石油采收率（EOR），以及需要占用耕地或消耗粮食作物的生物质农作物燃料。在所有细分品类中，最核心的传统替代品仍是传统化石石油制品；在航空领域，现有方案还辅以氢化酯和脂肪酸（HEFA）生物燃料，但后者面临严格的原料供应上限。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
