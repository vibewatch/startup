        title: 资本结构、融资历程与战略合作
        blocks:
          - type: paragraph
            body: >-
              Twelve 搭建了涵盖风险股权、企业战略投资、商业债务以及专项项目融资的多元多层资本结构，累计承诺资本超过 $900M [CO009]。早期融资主要由风投机构领投，包括领投 2018 年种子轮及 2022 年
              B 轮（$130M）的 DCVC，以及 Capricorn Technology Impact Fund、Carbon Direct Capital Management 与 Chan Zuckerberg
              Initiative [CO010]。2024 年底至 2025 年，Twelve 扩充了 C 轮与项目融资：先由 TPG 领投 $645M 融资，随后又追加了 $85M 的 C 轮及项目资本
              [CO011]。新加入的战略与企业投资者包括 Amazon 旗下 Climate Pledge Fund、Mitsui & Co.、Development Bank of Japan、Japan Hydrogen
              Fund 以及 MOL Switch；项目建设贷款则由 Fundamental Advisors 与 SMBC 提供 [CO012]。尽管累计融资金额庞大，但 Tracxn
              等公开数据库记录的风险股权金额存在出入（显示为 23 轮共计 $472M），主要原因在于其统计排除了非稀释性项目信贷额度与分期基础设施贷款 [CO013]。在下游合作端，公司已与多家民航客运公司、U.S. Air
              Force、NASA，以及包括 Mercedes-Benz 和 Procter & Gamble 在内的消费品牌建立了承购意向或客户测试协议 [CO014]。
