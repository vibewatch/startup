  - id: TR001
    title: 监管与法律风险清单
    columns:
      - 风险编号与类别
      - 监管规则 / 管辖区
      - 当前状态
      - 发生概率
      - 严重程度
      - 缓释策略
      - 残留风险敞口
      - 尽调验证路径
    rows:
      - - REG-01：清洁燃料补贴到期
        - 美国《通胀削减法案》（IRA）第 45Z 条清洁燃料生产税收抵免与第 45V 条氢能税收抵免
        - 法定有效期截至 2027 年；2027 年后能否延续存在不确定性
        - 高
        - 极高
        - 优化工厂碳强度（CI）得分以顶格获取基准税收抵免；同时拓展欧洲 ReFuelEU 消纳渠道以分散市场
        - 若联邦税收抵免到期导致绿电燃料相对化石航空煤油的绿色溢价走阔，现金流将面临高残留敞口
        - 审查工厂税收抵免变现假设与立法政策情景推演模型
      - - REG-02：燃料规格与认证风险
        - ASTM D7566 Annex A1 合成煤油规范（全球航空）
        - 最高 50% 比例的商业 drop-in 掺混认证需先完成工艺资质评定
        - 中
        - 极高
        - 协同 OEM 发动机制造商、FAA 与航司测试联盟，全面推进燃料测试与资质评定
        - 首批试产若需追加精炼或异构体分馏以达标 ASTM 标准，将引发交付延期
        - 查验 ASTM D7566 Annex A1 测试数据、批次认证报告以及航司燃料技术验收签署文件
      - - REG-03：环境与 ESG 营销合规审查
        - 美国 FTC《绿色指南》（Green Guides）与欧洲《绿色声明指令》（EU Green Claims Directive）
        - 监管机构对误导性脱碳声明的执法力度持续收紧
        - 中
        - 高
        - 借助 SABA 与 IATA 保持透明的“预订与声明”（book-and-claim）登记簿追踪，全生命周期排放经第三方审计
        - 生物基 CO2 原料来源或电力额外性若未通过严苛审计，将招致声誉受损与法律风险
        - 审计第三方全生命周期评估（LCA）文件以及经核验的预订与声明登记簿注销记录
      - - REG-04：私募证券与老股二级流动性
        - 美国 SEC 私募发行法规与二级交易市场监管
        - 未经公司官方背书，股权已挂牌 Pre-IPO 二级交易平台（EquityZen）
        - 低
        - 中
        - 严格执行股权转让限制条款、第一优先购买权（ROFR）约定并核查合格投资者资质
        - 二级投资辛迪加可能引发估值失真，并带来未经背调的股权结构表转让诉求
        - 调阅公司章程中关于股权转让限制的规定，以及股权结构表老股转让审批记录
    notes: 列举规约 Twelve 电能制液体（PtL）合成燃料落地的监管与合规风险。覆盖范围属部分列举，重点聚焦经核实的联邦政策、ASTM 燃料标准、ESG 披露以及私募资本监管框架。
    enumerationScope:
      coverage: partial
      basis: >-
        Comprehensive audit of federal clean fuel credit rules, ASTM international fuel certification requirements, and
        regulatory disclosures.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR002
    title: 运营、质量与安全风险清单
    columns:
      - 失效模式与子系统
      - 运营根因
      - 发生概率
      - 严重程度
      - 缓释成熟度
      - 残留风险敞口
      - 待解信息缺口
    rows:
      - - OPS-01：商用电解槽性能衰减
        - 连续运行工况下，膜电极组件（Leaf）催化剂中毒、质子膜减薄或电解池机械失效
        - 中
        - 极高
        - 研发推进中：在 Berkeley / Alameda 完成大量实验室规模与中试测试；数兆瓦级商业电解堆运行寿命尚未验证
        - 高：电解池过早更换将大幅抬升工厂运营支出并迫使产线停机
        - AirPlant One 在商业连续工况下每 1,000 运行小时的电解池衰减率
      - - OPS-02：清洁电力并网接入与用电成本
        - 华盛顿州区域输电网拥堵、弃电弃风限制或可再生能源批发 PPA 协议电价上涨
        - 中
        - 高
        - 已建立：选址落户 Grant County PUD 供电区，充分利用当地水电与可再生能源
        - 中等：长期电价上涨或电网过网费抬升压缩毛利率
        - 长期保供购电协议（PPA）定价条款、阶梯调价机制与保底供电量
      - - OPS-03：生物基 CO2 原料供应中断
        - 供应商工厂停工、原料捕集系统故障或槽车/管道运输中 CO2 发生杂质污染
        - 中
        - 高
        - 推进中：多供应商采购策略与现场缓冲储运设施
        - 中等：局部原料断供迫使电解槽降负荷运行
        - 具体的生物基 CO2 供应商名单、合同年限、纯度技术指标与管网连通情况
      - - OPS-04：调试与工程建设延期
        - 模块化设备制造延期、厂务辅助系统（BOP）EPC 交付瓶颈或系统联合调试受阻
        - 高
        - 高
        - 执行中：在 Moses Lake 配备专职工程领导团队与经验丰富的 EPC 承包商
        - 重大：工期延误导致商业量产推迟至 2025 年目标之后，增加投产前现金消耗
        - 最新调试时间表、机械完工百分比与首批商用燃料下线日期
    notes: 评估 Twelve 工业碳转化平台的物理与运营风险，重点剖析工厂工程落地与原料供应依赖。
    claimRefs:
      - CR002
      - CR009
      - CR010
      - CR011
  - id: TR003
    title: 合作伙伴与依赖风险清单
    columns:
      - 依赖类别
      - 交易对手与结构
      - 角色与战略敞口
      - 集中度
      - 违约/失效情景
      - 严重程度
      - 缓释策略
      - 残留风险敞口
    rows:
      - - 项目股权融资
        - TPG Rise Climate（$400M 承诺出资额度）
        - 未来商业化 AirPlants 的领投项目股权出资方
        - 极高
        - 若 AirPlant One 未达成既定运营里程碑目标，TPG 将暂缓分期出资拨付
        - 极高
        - 达成经核实的工厂调试里程碑；向联合投资人辛迪加分销项目股权
        - 若后续工厂开发需重新谈判股权条款，将引发大额资本锁定
      - - 债务信贷约束条款
        - Fundamental Renewables 与 SMBC（$45M+ 贷款）
        - 为工厂基础设施提供高级建设债与绿色定期贷款融资
        - 高
        - 成本超支或工期延误触发偿债备付率（DSCR）违约或里程碑完工条款违约
        - 高
        - 扩充信贷规模（$85M 追加轮次）并由战略发起方提供股权储备缓冲垫
        - 若调试严重滞后，可能导致债务加速到期或强制实施贷款重组
      - - 商业长协消纳交付
        - Alaska Airlines 与 IAG（British Airways 母公司）
        - 签约采购 E-Jet 商业化产量的锚定航司消纳方
        - 高
        - 未能交付合同约定体量，触发照付不议（take-or-pay）违约罚金条款或导致合同解除
        - 极高
        - 确立清晰的不可抗力条款、分阶段交付爬坡节奏与灵活的 SAFc 凭证交割选项
        - 痛失基石商业客户，并在航空业蒙受声誉损失
      - - 二级市场估值信号
        - Pre-IPO 二级交易平台（EquityZen）
        - 早期员工与天使投资人老股的外部流动性交易场所
        - 低
        - 二级折价交易价格在 Series D 轮或 IPO 前释放负面估值信号
        - 中
        - 公司拒绝配合未经批准的老股转让；依托实力雄厚的一级直投辛迪加撑盘
        - 对企业整体风险有限，但可能拖累员工士气并削弱招聘股权激励吸引力
    notes: 依据经核实的融资披露，梳理 Twelve 资本结构与商业消纳组合中的核心金融与商业交易对手。
