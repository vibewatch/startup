      - number: '1.2'
        title: 管理团队、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Twelve 的高管治理结构兼具深厚的学术电化学专长与老牌工业化工运营经验 [CO006]。创始团队由技术联创 Dr. Etosha Cave、Dr. Kendra Kuhl 与首席执行官 Nicholas
              Flanders 共同组成 [CO002]。为推动工业规模化并完成从实验室研发到重资本工程落地的转型，Twelve 引入多位化工制造与商业化资深高管，包括出任独立董事的前 Linde 高管 Anne
              Roby、出任首席产品化官的前 Cummins 总监 David Frank，以及出任首席商务官的前 Linde 高管 Ram Ramprasad [CO007]。公司运营涵盖 Berkeley
              的研发中心、Alameda 的电解槽工程制造基地，以及华盛顿州的工厂运营，跟踪统计员工数约 262 人 [CO008]。但公司的核心技术壁垒高度集中于自研 MEA
              催化剂耐久性与电化学反应器性能，存在显著的关键人员与工程执行依赖 [CO006]。
