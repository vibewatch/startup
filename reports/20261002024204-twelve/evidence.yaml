    keyQuote: >-
      The core of this technology is the Leaf™, our proprietary membrane electrode assembly (MEA) with a novel catalyst
      that reduces CO2. Installed inside our CO2 electrolyzers, the Leaf™ drives the conversion of CO2 and water into
      syngas, a mixture of carbon monoxide and hydrogen. This syngas is then upgraded into fuels and chemicals like
      E-Jet® SAF and E-Naphtha through a process known as Power-to-Liquid, part of the broader Power-to-X pathway.
    canonical: SO002
