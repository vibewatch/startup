    keyQuote: >-
      Today, approximately 95% of the world's manufactured goods trace their origins to a single feedstock: petroleum.
      This should strike us as one of the defining technological asymmetries of our time. Twelve proposes a new
      paradigm: one where advanced industrial technologies produce hydrocarbons from air and electricity.
    canonical: SO001
  - id: SP004
    publisher: Twelve
    title: 'Twelve FAQ: Meet The Carbon Transformation Company'
    url: https://www.twelve.co/post/twelve-faq-meet-the-carbon-transformation-company
