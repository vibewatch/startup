evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: airplant-one-production-data
    missingEvidence: >-
      Audited continuous production volume, Faradaic efficiency, and verified cost per gallon of E-Jet synthetic
      aviation fuel at AirPlant One.
    whyItMatters: >-
      Twelve's commercial and economic thesis depends on achieving competitive levelized production costs against fossil
      jet fuel and incumbent biofuels.
    diligencePath: >-
      Request plant engineering commissioning reports and independent third-party lifecycle assessment verification
      audits from Twelve management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Actual commercial production volume targets, unit economics ($/gallon), and capital expenditure per annual ton of
      capacity for AirPlant One.
    whyItMatters: >-
      Without unit production cost and volume disclosures, calculating Twelve's near-term obtainable revenue and
      contribution margin is speculative.
    diligencePath: >-
      Review confidential information memorandum (CIM), project finance underwriting documents, and commercial offtake
      pricing schedules.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
