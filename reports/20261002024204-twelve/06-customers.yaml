company:
  name: "Twelve"
chapter:
  number: 6
  title: "Customers"
  summary: "Twelve discloses a multi-segment commercial model spanning corporate SAF-credit buyers, airlines, brands, and public-sector organizations, but the strongest named-partner evidence in the assigned pool dates to 2022. The available sources explain purchase mechanics and historical partner activity, yet do not provide a current customer count, retention metrics, customer-level revenue, or production-versus-pilot status."
sections:
  - id: "customer-segments"
    title: "Customer Segments and Buying Routes"
    body: "Twelve's public materials point to several distinct commercial roles rather than one homogeneous customer base. Corporate buyers can purchase sustainable aviation fuel credits directly to address operational or travel emissions, while another route allows a corporation to purchase E-Jet jointly with an airline and retire the associated credits. Airlines are therefore both potential fuel users and transaction partners. Separate materials and chemicals use cases address brands seeking alternatives to petroleum-derived inputs, while a 2022 partner announcement also identified government and technology organizations. Public evidence does not quantify the relative revenue or strategic value of these segments."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "named-proof"
    title: "Named Partner Proof Is Real but Mostly Historical"
    body: "The clearest named proof is a June 2022 Chan Zuckerberg Initiative announcement identifying Mercedes-Benz, Procter & Gamble, Shopify, NASA, and the U.S. Air Force as Twelve partners using its carbon-transformation technology. That release also described a PANGAIA sunglasses line among Twelve's first commercial products and said Twelve was taking pre-orders for CO2Made materials and E-Jet. These disclosures establish relationship and productization signals, not current production deployment, recurring revenue, or retention. The assigned evidence contains no customer-specific volume or outcome denominator for the named organizations, so each relationship should be treated as historical proof with unresolved present status."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "adoption-trajectory"
    title: "Adoption Evidence Stops Short of a Comparable Growth Series"
    body: "The public record provides milestones but not a comparable adoption series. In 2022, CZI reported named partners, first commercial products, and pre-orders. In September 2024, ESG Today reported that Twelve was developing AirPlant One and that production was then anticipated to begin in 2025. Current company pages describe AirPlant One as the first node in a distributed manufacturing platform, and a later company post ties additional Series C and project funding to that facility. None of these facts is a customer-count, utilization, repeat-purchase, or delivered-volume metric; financing raised and plant positioning should not be presented as customer adoption."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "durability-and-concentration"
    title: "Durability, Expansion, and Concentration Remain Diligence Gaps"
    body: "Twelve explains a plausible expansion mechanism for corporate SAF buyers: a direct credit purchase can broaden into a joint airline transaction, followed by credit transfer after the associated fuel is used and registry-based traceability. That mechanism is not evidence of realized expansion. Across the retained sources, Twelve does not disclose a current customer total, active paid deployments, NRR, GRR, churn, renewal rate, contract length, repeat-purchase behavior, or customer revenue concentration. The 2022 named-partner list is also too stale to establish current production status. Diligence therefore requires contract, invoice, delivery, and cohort evidence rather than extrapolation from logos, pre-orders, financing, or facility plans."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    calloutRefs: []
