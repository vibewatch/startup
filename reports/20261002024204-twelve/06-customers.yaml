figures:
  - id: "FU001"
    title: "Corporate SAF-Credit Purchase and Transfer Journey"
    type: "journey-map"
    summary: "Twelve's disclosed corporate SAF-credit path separates purchase, physical fuel use, credit transfer, and registry traceability."
    data:
      items:
        - label: "1. Corporate emissions objective"
          detail: "A corporate buyer seeks to address operational or travel emissions."
          touchpoints:
            - "Direct contact with Twelve"
          note: "No customer count or purchase volume is disclosed."
        - label: "2. Direct credit route"
          detail: "The corporation can purchase sustainable aviation fuel credits directly from Twelve."
          touchpoints:
            - "SAF-credit purchase"
          note: "Price and contract duration are not disclosed."
        - label: "3. Joint airline route"
          detail: "Alternatively, the corporation can purchase E-Jet jointly with an airline of its choice."
          touchpoints:
            - "Corporate buyer"
            - "Airline"
          note: "Named current participants are not disclosed in the fetched FAQ."
        - label: "4. Physical fuel use"
          detail: "The airline uses the E-Jet associated with the credit purchase."
          touchpoints:
            - "Airline fuel use"
          note: "Delivered fuel volumes are not disclosed."
        - label: "5. Credit transfer"
          detail: "Credits transfer to the corporate customer after the associated E-Jet has been used."
          touchpoints:
            - "Post-use credit transfer"
          note: "Transfer timing and contractual remedies are not disclosed."
        - label: "6. Registry traceability"
          detail: "Twelve says it works with SABA and IATA to transfer credits with lifecycle traceability."
          touchpoints:
            - "Sustainable Aviation Buyers Alliance"
            - "International Air Transport Association"
          note: "The public text does not provide customer-level registry records."
    approximationNotes: "This is a mechanism map from Twelve's FAQ, not evidence of completed transactions, conversion rates, or customer retention."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
