callouts:
  - calloutType: "recommendation"
    title: "Capital Discipline Mandates a Track Stance Over Premature Buy"
    body: "Although Twelve's electrochemical carbon transformation technology possesses extraordinary decarbonization potential and tier-one institutional backing, the prior implied valuation mark of $2.75 billion embeds perfection in plant execution. Investors should maintain a track stance until AirPlant One publishes audited production volume and operating cost benchmarks."
    claimRefs:
      - "CV006"
      - "CV008"
      - "CV011"
  - calloutType: "risk"
    title: "Preferred Project Equity Overhang Threatens Common Dilution"
    body: "The structure of Twelve's September 2024 financing package—combining $400 million in dedicated project equity alongside $45 million in construction credit facilities—creates structural seniority ahead of corporate equity holders. Any operational underperformance at facility level will disproportionately impair corporate equity valuation."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV013"
