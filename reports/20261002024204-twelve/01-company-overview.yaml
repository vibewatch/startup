callouts:
  - calloutType: "insight"
    title: "Infrastructure Capital vs Venture Discrepancies"
    body: "Independent venture databases capture $472 million in equity across 23 rounds, whereas Twelve discloses total capital commitments exceeding $900 million. This delta highlights Twelve's capital structure evolution from pure venture-backed technology development to hybrid project finance, incorporating construction loans from Fundamental Advisors and credit lines from SMBC alongside equity [CO009, CO013]."
    claimRefs:
      - "CO009"
      - "CO013"
  - calloutType: "risk"
    title: "AirPlant One Commercial Performance Bottleneck"
    body: "While Twelve has demonstrated laboratory-scale CO2 electrolysis and closed large financing rounds, commercial viability hinges entirely on the operating efficiency, catalyst longevity, and production cost of AirPlant One. Actual unit production cost per gallon and Faradaic efficiency under continuous industrial operation remain unverified private metrics [CO005, CO015]."
    claimRefs:
      - "CO005"
      - "CO015"
