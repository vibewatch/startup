chapter:
  number: 1
  title: "Company Overview"
  summary: "Twelve is an industrial-scale carbon transformation company founded in 2015 that produces synthetic aviation fuels (E-Jet) and petrochemical replacements from CO2, water, and renewable electricity using its proprietary electrochemical Leaf membrane electrode assembly and AirPlant platform. The company has raised over $900 million in cumulative equity, debt, and project financing through 2025 across multiple Series C tranches, with its commercialization and production scale centered on the AirPlant One facility in Moses Lake, Washington."
sections:
  - id: "identity-and-core-platform"
    title: "Corporate Identity, Foundation, and Core Platform"
    body: "Twelve (formerly Opus 12) is a next-generation industrial carbon transformation company incorporated in 2015 and headquartered across Berkeley and Alameda, California [CO001]. Founded by Stanford researchers Dr. Etosha Cave and Dr. Kendra Kuhl alongside MBA entrepreneur Nicholas Flanders, Twelve was established to replace fossil fuel feedstocks with air, water, and renewable power [CO002]. Rather than capturing carbon dioxide for permanent subterranean sequestration (CCUS/CDR) or enhanced oil recovery, Twelve's electrochemical platform utilizes CO2 as an industrial chemical feedstock, converting emissions into syngas and drop-in hydrocarbon replacements [CO003]. The company's technology stack relies on its proprietary Leaf membrane electrode assembly (MEA) operating inside industrial CO2 electrolyzers to produce Power-to-Liquid synthetic aviation fuels branded as E-Jet, alongside petrochemical feedstocks like E-Naphtha [CO004]. Commercial deployment centers on its distributed AirPlant modular architecture, anchored by the first physical manufacturing facility, AirPlant One, constructed in Moses Lake, Washington [CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "governance-and-leadership"
    title: "Executive Leadership, Governance, and Key-Person Structure"
    body: "Twelve's executive governance structure bridges deep academic electrochemistry specialization and veteran industrial chemical operations [CO006]. The founding team combines technical co-founders Dr. Etosha Cave and Dr. Kendra Kuhl with Chief Executive Officer Nicholas Flanders [CO002]. To support industrial scaleup and transition from laboratory development to capital project execution, Twelve recruited senior chemical manufacturing and commercialization executives, including former Linde executive Anne Roby as Independent Board Director, former Cummins director David Frank as Chief Productization Officer, and former Linde executive Ram Ramprasad as Chief Commercial Officer [CO007]. Corporate operations span research and development in Berkeley, electrolyzer engineering and manufacturing in Alameda, and plant operations in Washington state, supporting a tracked headcount of approximately 262 employees [CO008]. However, the organization's technological differentiation remains heavily concentrated in proprietary MEA catalyst durability and electrochemical reactor performance, creating material key-person and engineering execution dependencies [CO006]."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capital Structure, Funding Milestones, and Strategic Alliances"
    body: "Twelve has assembled a diversified multi-tier capital structure consisting of venture equity, corporate strategic investments, commercial debt, and dedicated project financing exceeding $900 million in total commitments [CO009]. Early funding was anchored by venture firms including DCVC, which led the 2018 seed round and 2022 Series B ($130M), alongside Capricorn Technology Impact Fund, Carbon Direct Capital Management, and the Chan Zuckerberg Initiative [CO010]. In late 2024 and 2025, Twelve expanded its Series C and project financing with a $645 million tranche led by TPG, supplemented by an additional $85 million in Series C and project capital [CO011]. New strategic and corporate participants include Amazon's Climate Pledge Fund, Mitsui & Co., Development Bank of Japan, Japan Hydrogen Fund, and MOL Switch, alongside project construction lending from Fundamental Advisors and SMBC [CO012]. Despite substantial cumulative funding, public databases like Tracxn report disparate venture equity figures ($472M over 23 rounds) due to the exclusion of non-dilutive project credit facilities and phased infrastructure loans [CO013]. Offtake relationships and customer testing agreements have been established with commercial airlines, the U.S. Air Force, NASA, and consumer brands including Mercedes-Benz and Procter & Gamble [CO014]."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
