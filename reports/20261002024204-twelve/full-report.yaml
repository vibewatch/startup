      - number: '5.3'
        title: 'Industrial Deployment at AirPlant One: Scaling, Utilities, and Technical Risks'
        blocks:
          - type: paragraph
            body: >-
              Commercial deployment of Twelve's carbon transformation technology transitions from skid-mounted
              demonstration hardware to multi-megawatt industrial production at AirPlant One in Moses Lake, Washington
              CE008, CE011. AirPlant One represents the first operational node of Twelve's planned distributed
              eManufacturing platform, designed to co-locate modular electrochemical electrolyzers with downstream
              Fischer-Tropsch gas-to-liquids (GTL) fuel synthesis units CE001, CE008. The facility has secured
              multi-tranche project financing, including an upsized construction facility from Fundamental Advisors
              alongside strategic Series C project investments CE011. However, multi-megawatt PtL deployment introduces
              severe technical and operational scaling hurdles CE014. First, Twelve's electrochemical reactors require
              continuous, ultra-low-cost zero-carbon electricity to maintain economic syngas production; fluctuating
              power prices or local grid transmission constraints directly undermine operational continuity and unit
              economics CE014. Second, while the electrochemical Leaf MEA operates modularly, balance-of-plant (BOP)
              systems—including water deionization, thermal integration, CO2 gas purification, and downstream catalytic
              upgrading—must achieve high reliability without unexpected pressure or thermal transients CE014. Finally,
              critical commercial metrics—including single-pass CO2 conversion rates, Faradaic efficiency, and stack
              degradation rates under real-world cycling—remain confidential, leaving commercial operating cost parity
              subject to direct facility commissioning proof CE015.
            claimRefs:
              - CE001
              - CE008
              - CE011
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
