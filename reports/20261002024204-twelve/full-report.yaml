              - CP005
              - CP006
              - CP007
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Electrochemical Integration Creates Architecture Moats at High Capital Expense
            body: >-
              Twelve's core competitive advantage against other Power-to-Liquid developers is its proprietary Leaf MEA,
              which produces syngas directly from CO2 and water in a single reactor train, eliminating the need for
              standalone reverse water-gas shift (RWGS) thermal units. However, because the technology operates as a
              capital-intensive first-of-a-kind (FOAK) industrial plant, execution at AirPlant One in Moses Lake is
              critical to establishing durable cost leadership before competing eFuel developers achieve commercial
              scale.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Monetization Architecture, and Commercial Pricing Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Twelve's commercial business model is structured around three core revenue streams derived from its
              proprietary Opus electrochemical carbon transformation platform: Power-to-Liquid electrofuels (eFuels),
              drop-in petrochemical replacements (eChemicals), and branded consumer materials (CO2Made). The principal
              near-term commercial volume driver is E-Jet sustainable aviation fuel (SAF), which satisfies ASTM D7566
              Annex A1 standards and provides up to 90% lifecycle greenhouse gas emissions reductions compared to
              conventional fossil Jet-A. Monetization in aviation occurs via two complementary commercial structures:
              physical long-term offtake contracts executed with commercial airlines, and the sale of unbundled
              book-and-claim sustainable aviation fuel certificates (SAFc) to corporate enterprise clients seeking Scope
              3 business travel emissions abatement. Corporate clients retire environmental attributes tracked through
              verification registries such as the Sustainable Aviation Buyers Alliance (SABA) and the International Air
              Transport Association (IATA), creating a bifurcated cash-flow model where physical commodity fuel revenue
              is decoupled from green attribute premiums. Beyond aviation, Twelve monetizes platform eChemicals through
              E-Naphtha as an industrial chemical building block and partners with consumer brands (such as
              Mercedes-Benz and Procter & Gamble) to supply CO2Made materials on specialized supply agreements. However,
              list pricing, realized volume-weighted average selling prices, and contractual penalty terms remain
              confidential commercial secrets, preventing outside investors from observing realized gross revenue yield
              per unit of chemical output.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
