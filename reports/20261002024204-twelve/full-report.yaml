chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Core Platform
        blocks:
          - type: paragraph
            body: >-
              Twelve (formerly Opus 12) is a next-generation industrial carbon transformation company incorporated in
              2015 and headquartered across Berkeley and Alameda, California [CO001]. Founded by Stanford researchers
              Dr. Etosha Cave and Dr. Kendra Kuhl alongside MBA entrepreneur Nicholas Flanders, Twelve was established
              to replace fossil fuel feedstocks with air, water, and renewable power [CO002]. Rather than capturing
              carbon dioxide for permanent subterranean sequestration (CCUS/CDR) or enhanced oil recovery, Twelve's
              electrochemical platform utilizes CO2 as an industrial chemical feedstock, converting emissions into
              syngas and drop-in hydrocarbon replacements [CO003]. The company's technology stack relies on its
              proprietary Leaf membrane electrode assembly (MEA) operating inside industrial CO2 electrolyzers to
              produce Power-to-Liquid synthetic aviation fuels branded as E-Jet, alongside petrochemical feedstocks like
              E-Naphtha [CO004]. Commercial deployment centers on its distributed AirPlant modular architecture,
              anchored by the first physical manufacturing facility, AirPlant One, constructed in Moses Lake, Washington
              [CO005].
