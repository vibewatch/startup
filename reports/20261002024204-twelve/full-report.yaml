  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Incumbent Replacement Logic
        blocks:
          - type: paragraph
            body: >-
              The core addressable market for Twelve is industrial carbon transformation: the synthesis of CO2, water,
              and renewable electricity into drop-in hydrocarbons via Power-to-X and Power-to-Liquid pathways. Incumbent
              manufacturing relies almost universally on fossil hydrocarbons: today, approximately 95% of manufactured
              goods trace their physical origin to petroleum feedstocks. Twelve's market boundaries encompass three
              distinct product categories: eFuels (specifically E-Jet sustainable aviation fuel, E-Marine shipping fuel,
              and Electrol eDiesel), eChemicals (such as E-Naphtha), and CO2Made consumer materials. The direct
              addressable spend includes airline commercial jet fuel procurement, corporate travel and logistics Scope 3
              emissions budgets, industrial chemical feedstocks, and consumer brand material procurement. Explicitly
              excluded spend comprises post-combustion carbon capture and sequestration (CCS/CDR) without chemical
              utilization, enhanced oil recovery (EOR), and biogenic crop-based biofuels that require dedicated
              agricultural land or food-crop feedstocks. The status-quo substitute across all segments remains
              conventional fossil-derived petroleum products, complemented in aviation by HEFA (hydroprocessed esters
              and fatty acids) biofuels that face strict feedstock supply ceilings.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
      - number: '2.2'
        title: 'Market Sizing Lenses: Global Petrochemical TAM to Addressable PtL SAF SAM'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Twelve's market potential requires multiple analytical lenses rather than a single unbounded
              top-down estimate. At the global macroeconomic level, the broader market context reflects the overarching
              fossil fuel economy: Twelve targets the displacement of fossil feedstocks responsible for a significant
              share of global emissions, where replacing fossil feedstocks in chemicals, materials, and fuels with
              renewable carbon could avoid nearly 10 percent of global greenhouse gas emissions according to SIPA
              research cited by partners. Within transportation, global aviation accounts for over 1 billion metric tons
              of annual CO2 emissions and burns over 100 billion gallons of jet fuel annually, representing a
              multi-hundred-billion-dollar commodity fuel market. However, Twelve's serviceable addressable market (SAM)
              is strictly bounded by aviation decarbonization mandates, corporate net-zero commitments, and
              Power-to-Liquid (PtL) production capacity. For early commercialization, Twelve's serviceable obtainable
              market (SOM) is defined by near-term production from its first industrial-scale facility, AirPlant One in
              Moses Lake, Washington, which represents the initial node of its distributed eManufacturing platform.
              Because commercial PtL aviation volumes remain at early development stages globally, top-down TAM
              projections must be tempered with ground-level production realities and capital constraints.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
