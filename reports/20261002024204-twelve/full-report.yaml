  - id: FE001
    title: AirPlant Power-to-Liquid Production Architecture Stack
    type: stack
    summary: >-
      Layered technical architecture showing the sequential stages of Twelve's industrial Power-to-Liquid carbon
      transformation platform from raw inputs to certified drop-in fuels.
    data:
      layers:
        - label: 'Layer 1: Renewable Feedstocks & Primary Inputs'
          detail: >-
            Point-source CO2 capture, municipal deionized water, and continuous renewable electricity from dedicated
            hydro and wind resources.
          modules:
            - CO2 Gas Scrubbers
            - Water Deionization Units
            - High-Voltage Power Feeds
        - label: 'Layer 2: Feedstock Pre-Treatment & Compression'
          detail: >-
            Gas conditioning, compression trains, and power rectification converting AC grid power into high-amperage DC
            for electrolyzer cell stacks.
          modules:
            - Gas Dehumidifiers & Filters
            - Booster Compressors
            - AC-to-DC Rectifier Banks
        - label: 'Layer 3: Opus Electrochemical Syngas Generation'
          detail: >-
            Electrochemical core containing Leaf membrane electrode assemblies reducing CO2 and splitting water into
            syngas (CO + H2) in a single step.
          modules:
            - Leaf MEA Stacks
            - Cathode CO2 Flow Channels
            - Anode Oxygen Scavengers
        - label: 'Layer 4: Catalytic Fuel Synthesis & Upgrading'
          detail: >-
            Thermochemical Fischer-Tropsch reactor loops upgrading syngas into paraffinic syncrude with integrated waste
            heat recovery.
          modules:
            - Fixed-Bed FT Reactors
            - Hydrocracker & Isomerizer
            - Fractionation Distillation Column
        - label: 'Layer 5: Certified Drop-In Commercial Products'
          detail: >-
            Finished hydrocarbon products meeting stringent aviation (ASTM D7566 Annex A1), marine (ISO 8217 DMA), and
            petrochemical naphtha specifications.
          modules:
            - E-Jet SAF Blending Terminal
            - E-Marine Offtake Storage
            - E-Naphtha Tankage
        - label: 'Layer 6: Supervisory Control & Safety Systems'
          detail: >-
            Distributed plant SCADA, automated pressure/thermal trip interlocks, and telemetry logging for digital
            carbon accounting and registry verification.
          modules:
            - Plant SCADA Network
            - Emergency Trip Interlocks
            - Digital Registry Telemetry
    approximationNotes: >-
      Represents the functional systems hierarchy of the AirPlant One deployment architecture; detailed subsystem
      operating pressures and flow rates remain proprietary.
