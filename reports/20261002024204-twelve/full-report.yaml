      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Twelve's executive governance structure bridges deep academic electrochemistry specialization and veteran
              industrial chemical operations [CO006]. The founding team combines technical co-founders Dr. Etosha Cave
              and Dr. Kendra Kuhl with Chief Executive Officer Nicholas Flanders [CO002]. To support industrial scaleup
              and transition from laboratory development to capital project execution, Twelve recruited senior chemical
              manufacturing and commercialization executives, including former Linde executive Anne Roby as Independent
              Board Director, former Cummins director David Frank as Chief Productization Officer, and former Linde
              executive Ram Ramprasad as Chief Commercial Officer [CO007]. Corporate operations span research and
              development in Berkeley, electrolyzer engineering and manufacturing in Alameda, and plant operations in
              Washington state, supporting a tracked headcount of approximately 262 employees [CO008]. However, the
              organization's technological differentiation remains heavily concentrated in proprietary MEA catalyst
              durability and electrochemical reactor performance, creating material key-person and engineering execution
              dependencies [CO006].
