              - CE003
              - CE004
              - CE005
              - CE008
              - CE014
              - CE015
      - number: '5.4'
        title: Systems Architecture, Developer Signals, and Technical Governance
        blocks:
          - type: paragraph
            body: >-
              As an industrial hardware and advanced electrochemistry enterprise, Twelve does not maintain an
              open-source developer SDK, GitHub repository surface, or public API registry CE012. Instead, Twelve's
              software and digital systems governance is focused on industrial process control, supervisory control and
              data acquisition (SCADA), and rigorous plant telemetry monitoring across its distributed eManufacturing
              facilities CE012. In modern enterprise architecture, technical practitioners evaluate infrastructure
              reliability, stateless process isolation, and cloud deployment parity using foundational industry
              benchmarks such as the Twelve-Factor App methodology CE012, CE013. AWS architectural frameworks emphasize
              operational excellence and security pillars through unified deployment pipelines, environment parity, and
              strict separation of build, release, and runtime states CE013. For Twelve's plant automation stack,
              establishing rigorous continuous monitoring, telemetry isolation, and automated failover across
              electrolyzer modules is critical to preventing single-point balance-of-plant shutdowns CE012, CE013.
              Comprehensive third-party technical certifications, stack degradation logs, and detailed life-cycle
              analysis (LCA) audits remain crucial technical governance milestones required by airline buyers and
              project financiers prior to full commercial acceptance CE014, CE015.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Syngas Generation as the Decisive Efficiency Advantage
            body: >-
              Conventional Power-to-Liquid concepts rely on two energy-intensive stages: first running separate water
              electrolyzers to make green hydrogen, then using a high-temperature reverse water-gas shift (RWGS) reactor
              to convert CO2 into CO. Twelve's Opus reactor combines these reactions in a single electrochemical step,
              cutting capital expenditure and reducing thermal efficiency losses.
            calloutType: insight
            claimRefs:
              - CE003
              - CE008
          - type: callout
            title: Balance-of-Plant and Power Availability Scaling Bottlenecks
            body: >-
              While modular electrolyzer stacks can be replicated, scaling AirPlant One to full commercial capacity
              introduces major balance-of-plant and electrical utility dependencies. Operating multi-megawatt
              electrochemical facilities continuously requires uninterrupted low-cost renewable power; local grid
              bottlenecks or spikes in electricity tariffs directly impair production margins.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE014
              - CE015
  - number: 6
    title: Customers
