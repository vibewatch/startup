      - number: '5.2'
        title: Product Portfolio, Drop-In Specifications, and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Twelve's product line spans three primary output tiers engineered as molecular drop-in replacements for
              standard petrochemical products without requiring retrofits to downstream distribution infrastructure
              CE002. In transportation fuels, Twelve's flagship offering is E-Jet sustainable aviation fuel (SAF),
              certified under ASTM D7566 Annex A1 as a synthetic kerosene blending component for commercial aviation
              CE004. Twelve also designs E-Marine shipping fuel conforming to ISO 8217 DMA marine distillate
              specifications, alongside Electrol eDiesel for heavy ground transport and backup generation CE004. In
              platform chemicals, Twelve develops E-Naphtha, a chemically identical drop-in petrochemical substitute
              derived entirely from CO2, water, and renewable power, serving as the foundational building block for
              downstream plastics and synthetic polymers CE005. At the branded consumer level, Twelve operates the
              CO2Made Project and eMade platform, partnering with brands such as Mercedes-Benz, Procter & Gamble, and
              PANGAIA to replace fossil-derived ingredients in consumer products with zero net-new emissions materials
              CE006, CE007, CE010. By delivering molecularly identical outputs, Twelve enables customers to eliminate
              fossil carbon from existing manufacturing and supply chains without trade-offs in physical performance or
              mechanical integrity CE002, CE007.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE010
