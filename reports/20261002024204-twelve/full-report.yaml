              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bifurcated Revenue Architecture Bridges Fossil Price Parity
            body: >-
              Because conventional commercial airlines operate with tight cash operating margins and cannot absorb
              multi-fold synthetic fuel price premiums alone, Twelve's commercial model relies on decoupling the
              physical commodity fuel from its environmental attributes. Corporate customers purchasing Scope 3 SAF
              certificates (SAFc) through SABA and IATA absorb the green premium, effectively subsidizing physical
              airline offtake.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI008
          - type: callout
            title: Extreme Power Input Sensitivity Threatens Unit Contribution Margins
            body: >-
              Power-to-Liquid synthesis is fundamentally an electrochemical conversion process where electricity
              represents the single largest variable operating expense. If regional industrial renewable electricity
              rates escalate or transmission constraints limit utilization at AirPlant One, facility-level unit
              economics will suffer sharp margin degradation regardless of top-line subsidy incentives.
            calloutType: risk
            claimRefs:
              - CI001
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Carbon Transformation Platform: Electrochemical Reduction and the Opus Architecture'
        blocks:
          - type: paragraph
            body: >-
              Twelve defines its core technical platform as carbon transformation—an electrochemical Power-to-X pathway
              that replaces conventional petroleum refining by utilizing carbon dioxide, water, and renewable
              electricity as feedstocks CE001, CE002. At the core of Twelve's technical differentiation is the Opus
              system, an electrochemical reactor designed to operate like industrial photosynthesis by directly
              converting CO2 into syngas CE003, CE008. Syngas—a tailored mixture of carbon monoxide (CO) and green
              hydrogen (H2)—serves as the foundational intermediate for downstream hydrocarbon synthesis CE003. The
              proprietary breakthrough enabling Opus is the Leaf, Twelve's novel membrane electrode assembly (MEA)
              incorporating specialized electrocatalysts engineered specifically to reduce CO2 at high selectivity and
              energy efficiency CE003. Unlike biological carbon utilization or biomass-derived biofuels that require
              extensive agricultural land and arable soil, Twelve's electrochemical architecture conducts direct
              conversion in modular electrolyzers CE002, CE003. Twelve conducts core electrochemical research and
              catalyst development at its headquarters and R&D laboratory in Berkeley, California, while pilot
              manufacturing and system engineering for the CO2 electrolyzers take place in Alameda, California CE009.
              The primary technical bottleneck in this architecture is the operational lifetime and Faradaic efficiency
              of the Leaf MEA under sustained industrial operating conditions, where catalyst degradation and cell
              voltage drift represent primary engineering risks CE015.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
              - CE015
