      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption pathways in Twelve's target markets diverge across three distinct buyer categories with differing
              decision-makers, budget sources, and contract structures. In commercial aviation, the primary buyers are
              airline fleet operators and fuel procurement teams (such as United Airlines and IAG), where the key metric
              is cost per gallon and regulatory compliance under ReFuelEU Aviation or CORSIA mandates. Concurrently,
              corporate enterprise customers represent a secondary procurement pathway through book-and-claim
              sustainable aviation fuel credits (SAFc) to abate Scope 3 business travel emissions. Corporate buyers
              purchase SAFc directly through registries such as the Sustainable Aviation Buyers Alliance (SABA) or IATA,
              allowing airlines to physically uplift fuel while corporate buyers retire the environmental attributes.
              The third buyer segment consists of consumer brand manufacturers in apparel, cosmetics, and automotive
              interiors (such as Pangaia and Mercedes-Benz) that procure CO2Made drop-in materials to fulfill corporate
              ESG pledges. In B2B markets, aligning messaging with high-priority buyer pain points and regulatory
              compliance is essential for driving traction across early adopters before mainstream scaling occurs.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth Drivers, Adoption Bottlenecks, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Adoption of Power-to-Liquid fuels and eChemicals is propelled by stringent regulatory compliance drivers,
              corporate sustainability mandates, and the physical limits of alternative solutions. Conventional
              crop-based HEFA biofuels face structural limits on waste fat and oil feedstocks, creating a long-term
              structural imperative for synthetic PtL fuels made from CO2 and water. However, severe adoption
              bottlenecks constrain Twelve's expansion rate. Primary among these is renewable electricity availability:
              operating industrial electrochemical cells like the Opus system requires massive quantities of low-cost,
              continuous renewable power to generate green hydrogen and reduce CO2. Additional constraints include the
              massive capital intensity of constructing modular chemical plants, technology scale-up risk from pilot to
              full commercial continuous operation, offtake counterparty risk, and policy dependency on tax incentives
              such as the Inflation Reduction Act Section 45Z clean fuel production credit. Furthermore, in niche and
              emerging B2B sectors, long sales cycles, complex multi-stakeholder evaluations, and customer skepticism
              create extended adoption lead times that demand rigorous capital discipline.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM001
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Book-and-Claim SAFc Mechanism as a Capital Bridge
            body: >-
              Because airlines face razor-thin operating margins and cannot absorb high PtL green premiums alone, the
              book-and-claim SAFc credit market (partnered with SABA and IATA) functions as an essential co-funding
              mechanism. Corporate travelers subsidize the green attribute premium, enabling physical fuel delivery to
              airlines while Twelve secures diversified revenue streams.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: Power Availability and Capital Intensity as Scaling Bottlenecks
            body: >-
              PtL manufacturing is intensely energy-demanding. Scaling from AirPlant One to an industrial network
              requires hundreds of megawatts of continuous clean electricity and substantial project finance. Grid
              bottlenecks or escalation in renewable electricity costs directly threaten unit economics and delay
              commercial deployment.
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Substitute Pathways
        blocks:
          - type: paragraph
            body: >-
              Evaluating Twelve's competitive positioning requires analyzing how aviation fuel buyers address liquid
              hydrocarbon needs. The status quo is dominated by conventional petroleum jet fuel, which supplies over 99%
              of commercial aviation energy. While petroleum jet fuel benefits from deep capital amortization, mature
              refining infrastructure, and established distribution logistics, emerging regulatory mandates such as
              ReFuelEU Aviation and US IRA Section 45Z incentives force commercial airlines toward sustainable aviation
              fuels (SAF). Within SAF, the dominant commercial incumbent is Hydroprocessed Esters and Fatty Acids
              (HEFA). HEFA fuels utilize waste lipids, fats, oils, and greases (FOGs) to produce drop-in paraffinic
              kerosene. However, HEFA scaling is constrained by finite global agricultural feedstock supplies and severe
              food-versus-fuel price volatility. Twelve bypasses biological feedstock constraints entirely by utilizing
              point-source biogenic CO2, water, and renewable electricity in an electrochemical Power-to-Liquid (PtL)
              architecture. This positions Twelve against direct synthetic eFuel developers as well as established
              biomass gasification-FT pathways, where differentiation depends on electrolyzer capital efficiency and
              total conversion yields.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
      - number: '3.2'
        title: Competitor Profiles and Electrochemical Architecture Differentiation
        blocks:
          - type: paragraph
            body: >-
              Alternative aviation fuel competitors deploy diverging conversion architectures to achieve drop-in ASTM
              D7566 kerosene compatibility. Conventional biofuels rely on HEFA refining, where firms like Neste and
              World Energy dominate present-day commercial volumes. In the Power-to-Liquid (PtL) eFuels domain, peers
              such as Infinium and NxtGen utilize two-step Fischer-Tropsch routes pairing separate green hydrogen
              electrolyzers with reverse water-gas shift (RWGS) or syngas generation reactors. Twelve differentiates by
              integrating water electrolysis and CO2 reduction into a single low-temperature electrochemical reactor
              utilizing its proprietary Leaf membrane electrode assembly (MEA). Twelve's process produces syngas
              directly from CO2 and water input streams, bypassing high-temperature RWGS equipment. Nevertheless,
              Twelve's approach demands intensive power consumption per gallon produced and requires high stack
              manufacturing durability under continuous duty cycles. Twelve has validated this positioning commercially
              by securing over $900 million in total financing, including $400 million in project equity from TPG Rise
              Climate to construct AirPlant One in Moses Lake, Washington, alongside commercial offtake and partnership
              commitments from major carriers including Alaska Airlines and International Airlines Group (IAG).
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP009
              - CP012
      - number: '3.3'
        title: Switching Costs, Distribution Barriers, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              In commercial aviation and industrial chemicals, switching costs for fuel buyers are governed strictly by
              drop-in chemical certification and supply chain interoperability. Twelve's E-Jet fuel complies with ASTM
              D7566 Annex A1 synthetic kerosene specifications, ensuring blending up to 50% with conventional Jet A/A-1
              without modifications to airframes, turbine engines, or airport hydrant fueling systems. This drop-in
              compatibility eliminates mechanical switching costs for airline customers such as Alaska Airlines and IAG,
              but creates high product commoditization risks against identical synthetic fuels. Consequently, Twelve's
              defensibility hinges on capital stack structuring, proprietary catalyst degradation barriers, and
              location-specific energy access rather than brand loyalty. By establishing AirPlant One in Moses Lake,
              Washington, Twelve leverages low-cost regional hydroelectric power, addressing the single largest
              operational expenditure in electrofuel synthesis. Offtake agreements and direct sales of Sustainable
              Aviation Fuel credits (SAFc) through registry platforms provide initial revenue visibility, but Twelve
              remains exposed to incumbent refining scale, execution delays in facility commissioning, and potential
              merchant power price volatility.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
