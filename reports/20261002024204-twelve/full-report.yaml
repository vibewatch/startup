  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Architecture and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Evaluating Twelve's risk architecture requires a rigorous, evidence-grounded assessment across legal,
              regulatory, operational, partner, financial, and market execution dimensions. Commercializing
              electrochemical carbon transformation—converting carbon dioxide, water, and renewable electricity into
              drop-in hydrocarbons such as E-Jet sustainable aviation fuel and E-Naphtha—presents industrial risks
              fundamentally distinct from software or traditional manufacturing. Twelve's primary near-term operational
              bottleneck centers on AirPlant One in Moses Lake, Washington, which represents the company's inaugural
              commercial-scale Power-to-Liquid deployment. Technological scale-up from laboratory bench and pilot
              electrolyzers to full continuous industrial operations introduces multi-variable engineering uncertainties
              involving membrane electrode assembly durability, Faradaic efficiency, and syngas upgrading integration.
              Concurrently, capital intensity remains acute: constructing capital-intensive chemical facilities requires
              complex layered capital stacks comprising project equity, corporate venture rounds, and specialized debt
              facilities, leaving the enterprise exposed to debt-service covenants, refinancing conditions, and capital
              market volatility.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
