      - number: '1.3'
        title: Capital Structure, Funding Milestones, and Strategic Alliances
        blocks:
          - type: paragraph
            body: >-
              Twelve has assembled a diversified multi-tier capital structure consisting of venture equity, corporate
              strategic investments, commercial debt, and dedicated project financing exceeding $900 million in total
              commitments [CO009]. Early funding was anchored by venture firms including DCVC, which led the 2018 seed
              round and 2022 Series B ($130M), alongside Capricorn Technology Impact Fund, Carbon Direct Capital
              Management, and the Chan Zuckerberg Initiative [CO010]. In late 2024 and 2025, Twelve expanded its Series
              C and project financing with a $645 million tranche led by TPG, supplemented by an additional $85 million
              in Series C and project capital [CO011]. New strategic and corporate participants include Amazon's Climate
              Pledge Fund, Mitsui & Co., Development Bank of Japan, Japan Hydrogen Fund, and MOL Switch, alongside
              project construction lending from Fundamental Advisors and SMBC [CO012]. Despite substantial cumulative
              funding, public databases like Tracxn report disparate venture equity figures ($472M over 23 rounds) due
              to the exclusion of non-dilutive project credit facilities and phased infrastructure loans [CO013].
              Offtake relationships and customer testing agreements have been established with commercial airlines, the
              U.S. Air Force, NASA, and consumer brands including Mercedes-Benz and Procter & Gamble [CO014].
