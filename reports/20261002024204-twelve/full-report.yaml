            body: >-
              Twelve's public materials point to several distinct commercial roles rather than one homogeneous customer
              base. Corporate buyers can purchase sustainable aviation fuel credits directly to address operational or
              travel emissions, while another route allows a corporation to purchase E-Jet jointly with an airline and
              retire the associated credits. Airlines are therefore both potential fuel users and transaction partners.
              Separate materials and chemicals use cases address brands seeking alternatives to petroleum-derived
