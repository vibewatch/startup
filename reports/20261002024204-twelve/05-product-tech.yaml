callouts:
  - calloutType: "insight"
    title: "Direct Syngas Generation as the Decisive Efficiency Advantage"
    body: "Conventional Power-to-Liquid concepts rely on two energy-intensive stages: first running separate water electrolyzers to make green hydrogen, then using a high-temperature reverse water-gas shift (RWGS) reactor to convert CO2 into CO. Twelve's Opus reactor combines these reactions in a single electrochemical step, cutting capital expenditure and reducing thermal efficiency losses."
    claimRefs:
      - "CE003"
      - "CE008"
  - calloutType: "risk"
    title: "Balance-of-Plant and Power Availability Scaling Bottlenecks"
    body: "While modular electrolyzer stacks can be replicated, scaling AirPlant One to full commercial capacity introduces major balance-of-plant and electrical utility dependencies. Operating multi-megawatt electrochemical facilities continuously requires uninterrupted low-cost renewable power; local grid bottlenecks or spikes in electricity tariffs directly impair production margins."
    claimRefs:
      - "CE008"
      - "CE011"
      - "CE014"
      - "CE015"
