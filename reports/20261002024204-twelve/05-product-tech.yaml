        - label: "Layer 6: Supervisory Control & Safety Systems"
          detail: "Distributed plant SCADA, automated pressure/thermal trip interlocks, and telemetry logging for digital carbon accounting and registry verification."
          modules:
            - "Plant SCADA Network"
            - "Emergency Trip Interlocks"
            - "Digital Registry Telemetry"
