callouts:
  - calloutType: "risk"
    title: "AirPlant One Commissioning as the Definitive Binary Milestone"
    body: "The overarching risk facing Twelve is the operational and economic validation of AirPlant One. As a first-of-a-kind (FOAK) commercial Power-to-Liquid production facility, any severe engineering bottleneck—whether in continuous electrolyzer membrane life, Faradaic efficiency, or syngas upgrading—threatens the entire platform thesis. Until AirPlant One proves continuous production at projected unit costs, commercial scaling and subsequent project financing remain exposed to execution risk."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR013"
  - calloutType: "recommendation"
    title: "Core Diligence Requirements and Monitoring Indicators"
    body: "Institutional investors must prioritize three primary diligence verifications: (1) independent engineering reports detailing the degradation curve and operating hours of Twelve's Leaf membrane electrode assemblies; (2) binding offtake contract terms with Alaska Airlines and IAG, focusing on volume relief, delivery deadlines, and liquidated damage provisions; and (3) long-term power purchase agreements in Moses Lake to confirm electricity price stability."
    claimRefs:
      - "CR004"
      - "CR010"
      - "CR014"
