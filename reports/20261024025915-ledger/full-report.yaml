        title: Traction, cost structure, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Crypto Briefing attributes triple-digit millions of 2025 revenue to Ledger's CEO; two lower-reputation
              sources use comparable nine-figure or hundreds-of-millions language. These reports likely share underlying
              company commentary, so they corroborate wording rather than independently audit the metric. Revenue is not
              ARR, and none of the sources supplies recognized segment revenue, gross margin, inventory turns, warranty
