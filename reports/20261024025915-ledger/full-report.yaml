      - number: '4.3'
        title: Capital adequacy, downside exposure, and verdict
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $575 million raised across seven rounds, including a $109 million Series C in March 2023.
              That history demonstrates financing access, not current liquidity: funding raised is not cash available,
              and no assigned source reports cash, burn, runway, debt, covenants, working-capital needs, or a next-round
              trigger. Crypto Briefing reports preparations for a possible U.S. IPO above $4 billion, but contingent
              proceeds cannot be treated as financing already secured. Financial downside is also unquantified. Yahoo
              Finance reported compromised-device concerns across four retailers in three countries and an investigator
              loss estimate that Ledger had not verified. The underwriting verdict is therefore research-more: reported
              scale is encouraging, but margin, cash conversion, incident cost, and capital sufficiency remain
              private-evidence blockers.
