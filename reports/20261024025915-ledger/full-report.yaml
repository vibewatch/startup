          x: 4
          'y': 2
          note: Broad multi-chain, mobile and DApp ecosystem; proprietary-firmware tradeoff noted
        - label: Trezor
          x: 3
          'y': 4
          note: Open-source-focused with WalletConnect and Trezor Suite
        - label: BitBox02
