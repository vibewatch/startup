  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Ledger's documented path runs from a 2014 Paris founding through venture financing, product-security positioning,
      incident exposure, and a possible 2026 US IPO.
    data:
      items:
        - date: '2014'
          label: Founded; Paris headquarters reported
          details: TheStreet and Tracxn report a 2014 founding, while Tracxn separately reports Paris as headquarters.
          tone: neutral
          claimRefs:
            - CO001
            - CO016
        - date: '2020'
          label: Customer-data leak
          details: >-
            CNC Intel reports a 2020 attack on Ledger's e-commerce partner that exposed customer contact and address
            data.
          tone: risk
          claimRefs:
            - CO010
        - date: '2021'
          label: Unicorn milestone
          details: Tracxn states that Ledger became a unicorn in 2021.
          tone: positive
          claimRefs:
            - CO006
        - date: 2021-06
          label: $380M Series C record
          details: Tracxn lists a June 2021 $380M Series C round and a $1.5B post-money valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: 2023-03
          label: $109M Series C record
          details: Tracxn lists a March 2023 $109M Series C round and a $1.41B post-money valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: 2023-12
          label: Connect Kit compromise
          details: >-
            CNC Intel reports a malicious Ledger Connect Kit version that redirected some DApp interactions and was
            patched within 40 minutes.
          tone: risk
          claimRefs:
            - CO010
        - date: '2025'
          label: Record revenue and signers positioning
          details: >-
            Assigned reporting describes triple-digit-million 2025 revenue and a shift from hardware wallets toward
            signers.
          tone: positive
          claimRefs:
            - CO003
            - CO007
        - date: '2026'
          label: Possible US IPO
          details: Crypto Briefing and Decrypt report a potential US IPO above $4B, subject to change and market conditions.
          tone: neutral
          claimRefs:
            - CO014
            - CO015
