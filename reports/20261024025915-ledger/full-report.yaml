      - number: '1.2'
        title: Scale, funding, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence indicates meaningful scale but not a single reconciled operating KPI. CoinLaw
              reports more than 7 million devices sold and 7–8 million customers across 160-plus countries, while Tracxn
              reports $575 million of total funding across seven rounds and identifies a March 2023 $109 million round.
              These figures have different definitions and publication contexts, so they should not be combined into a
              customer-to-device conversion rate or treated as audited company data. TheStreet and Crypto Briefing
              report that Ledger generated triple-digit millions of revenue in 2025, but neither assigned source
              supplies audited statements, a period-end denominator, or a segment split. The funding and investor table
              therefore preserves the reported rounds and named investors while flagging the need for cap-table,
              preference, debt, and proceeds verification. Leadership evidence is thinner than financing evidence:
              Pascal Gauthier is identified as CEO, but the assigned pool does not establish a complete founder, board,
              or executive roster.
