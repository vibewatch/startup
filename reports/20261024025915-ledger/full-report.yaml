      - number: '1.3'
        title: Milestones and material risk signals
        blocks:
          - type: paragraph
            body: >-
              Ledger's trajectory includes the 2014 founding, major 2021 funding and unicorn milestone reported by
              Tracxn, a 2023 financing event, and a 2025–2026 push toward broader institutional and public-market
              relevance. At the same time, the evidence documents a recurring distinction between device-level key
              security and ecosystem risk. CNC Intel says there is no publicly confirmed remote extraction of private
              keys from Ledger devices, while also describing the 2020 customer-data leak, the 2023 Connect Kit
              compromise, and a reported January 2026 Global-e exposure. Freemindtronic presents a more adverse
              interpretation, grouping hardware, software, customer-data, and third-party incidents into a systemic
              supply-chain risk. The result is not proof that private keys were compromised, but a material diligence
              issue around customer targeting, software dependencies, incident response, and trust retention. A
              potential US IPO is also not a completed financing or valuation: the assigned reporting describes a
              possible listing above $4 billion, subject to change and market conditions.
