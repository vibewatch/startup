  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer jobs
        blocks:
          - type: paragraph
            body: >-
              Ledger addresses two related workflows: individuals keep private keys off a general-purpose computer while
              approving transactions on a dedicated device, and institutions apply similar self-custody principles
              through an enterprise platform. Public reporting and market profiles identify Nano devices, Stax, Flex,
              Ledger Wallet or its earlier Ledger Live name, Recover, and enterprise custody products, but the evidence
              vintages differ and should not be read as a current SKU catalog. A January 2026 AllUnity announcement is
              concrete customer-issued evidence that Ledger Enterprise was selected for EURAU custody. It proves a named
              deployment decision, not production uptime, transaction volume, service levels, or independent security
              performance.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
