chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Ledger was founded in 2014 and is described in the assigned sources as a blockchain hardware-wallet
              company offering products such as Nano devices and a multi-authorization vault. Tracxn records Paris,
              France as its headquarters and classifies the company as Series C, while TheStreet describes Ledger as a
              French crypto hardware-wallet provider. The operating model visible in this evidence combines one-time or
              device-led hardware sales with Ledger Live and institutional custody or vault services; the evidence does
              not provide audited segment revenue, recurring-revenue mix, or a complete current product catalogue.
              Ledger's 2025 “signers” positioning and BIP32 path-isolation discussion indicate that security and
              transaction signing, rather than generic asset storage, are central to the value proposition. These facts
              establish a useful identity baseline, but later underwriting should distinguish company statements,
              third-party estimates, and independently verified financials.
