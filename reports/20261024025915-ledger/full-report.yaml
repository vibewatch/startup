  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Ledger's measurable core market is hardware used to keep private keys offline and authorize transactions,
              spanning individual buyers and institutional or enterprise users. The adjacent software and services layer
              includes the companion wallet, recovery, transaction, staking, swap, and governance workflows attached to
              a device, but generic exchange, brokerage, and custody revenue should not be counted unless Ledger
              participates economically. Institutional tokenization is a relevant demand adjacency because it raises the
              need for wallet custody, governance, and signing controls; the value of tokenized transactions or assets
              under management is not Ledger revenue. Substitutes include exchange custody, software wallets, competing
              hardware devices, managed custodians, and internal multi-signature workflows. This boundary avoids
              converting broad crypto activity into a hardware-wallet TAM.
            claimRefs:
              - CM006
              - CM010
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Research and Markets estimates the hardware-wallet market at USD 0.54 billion in 2025, USD 0.72 billion in
              2026, and USD 2.25 billion in 2031, with a stated 25.6% CAGR over 2026-2031. It also reports cold wallets
              at 63.19% of 2025 sales and North America at 38.95% of 2025 revenue. These are publisher estimates with
              methodology largely outside the fetched summary, so they are useful as a directional sizing lens rather
              than an audited market ledger. A separate report's claim that hardware wallet penetration remains below
              15% lacks a visible denominator and methodology. Institutional DLT volumes show a larger adjacent need for
              secure authorization, but cannot be added to device-market revenue. No retained evidence isolates Ledger's
              serviceable share, product mix, average selling price, or obtainable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
              - CM016
