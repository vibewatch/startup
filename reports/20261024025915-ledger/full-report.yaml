      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Retail users buy devices directly and bear the cost themselves, with adoption typically triggered by
              concern about exchange or online-wallet exposure. PYMNTS reported roughly USD 2.2 billion of crypto stolen
              in the first half of 2025, already above all of 2024, while Ledger's chief executive linked a demand
              increase to more aggressive hacking. Institutional buyers instead require security, compliance,
              auditability, integration, and policy controls; budget ownership can sit with security, treasury, custody,
              or digital-asset operations. Trade-association evidence indicates that institutional DLT has moved from
              pilots toward live use cases, but adoption still depends on interoperability, custody standards, and
              integration with existing controls. Ledger's own claim of more than eight million devices shipped is
              evidence of reach, not a count of active users or recurring customers.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM013
              - CM014
      - number: '2.4'
        title: Constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Security incidents can both stimulate category demand and damage vendor trust. Independent and
              competitor-issued reviews distinguish device-key security from phishing, software-integration, commerce,
              and supply-chain exposure; this means a secure element does not eliminate the broader customer journey's
              attack surface. Consumer friction also remains material: seed-phrase backup, firmware maintenance, address
              verification, incompatible recovery standards, and counterfeit-device risk can delay mainstream adoption.
              Ledger's shift from "hardware wallet" to "signer" seeks to make the use case broader and easier to
              understand, but it is a company positioning claim rather than independent proof of category expansion.
              Valuation should therefore be anchored to verified revenue mix, recurring-service attachment,
              active-device cohorts, enterprise pipeline, and gross margin, none of which the retained market evidence
              discloses.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite revenue evidence, not crypto value secured
            body: >-
              Treat hardware-market revenue as the measurable base and institutional DLT activity as a demand adjacency.
              Require Ledger segment revenue, active-device cohorts, recurring-service attachment, enterprise pipeline,
              and gross margin before assigning a company-specific SAM, SOM, or software-like multiple.
            calloutType: recommendation
            claimRefs:
              - CM001
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Ledger competes across several jobs rather than one homogeneous wallet category. Tracxn describes Ledger
              as a blockchain-based hardware wallet with Nano X, Nano S, Blue, OTG Kit and a multi-authorization vault,
              and lists Blockstream, CertiK and MetaMask among its competitors. The same source ranks Ledger first among
              486 active competitors, but that ranking is a platform score rather than a market-share measure. Direct
              hardware peers include Trezor, BitBox02 and Coldcard; software interfaces such as MetaMask are substitutes
              for some users but do not provide the same hardware isolation. Internal build and status quo are also real
              alternatives: a user can retain assets on an exchange, use a browser/mobile wallet, or combine an
              open-source signer with a separate coordinator. The buying decision therefore turns on threat model,
              supported assets, signing workflow, recovery model and trust in the vendor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.2'
        title: Capability, distribution and switching
        blocks:
          - type: paragraph
            body: >-
              Ledger's strongest competitive position is an ecosystem tradeoff. The assigned comparative review says
              Ledger combines Secure Element hardware, Ledger OS, Ledger Wallet and device confirmation, while Trezor
              emphasizes open-source transparency and SafePal, ELLIPAL, NGRAVE and Cypherock target budget air-gapped,
              touchscreen air-gapped, premium isolation and seed-sharding use cases respectively. The Ledger review also
              says its touchscreen models improve transaction review for users who approve DApps, NFTs, swaps or staking
              actions frequently, while Nano S Plus is better suited to simple cold storage. That creates a meaningful
              segmentation moat, but not a universal one: Coldcard's official surface emphasizes dual secure elements,
              reproducible firmware and air-gap workflows, and BitBox02 emphasizes open-source firmware, dual-chip
              security and microSD backup. Switching costs arise from recovery procedures, supported chains, wallet
              integrations and user habits; multi-homing is feasible because users can separate long-term storage from
              active DeFi signing.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Pricing and packaging
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence supports a device-level comparison, not realized revenue or margin. The Ledger
              review dated June 24, 2026 places the current lineup roughly between $79 and $399 and identifies $79 for
              Nano S Plus, $149 for Nano X and $179 for Nano Gen5. These are stated as approximate storefront prices
              subject to promotions, taxes, shipping and region. Competitors in the pool do not expose a comparable
              complete price list in the fetched text, so the matrix marks those cells unknown rather than guessing. The
              implication is that Ledger can price by workflow tier: low-cost USB cold storage, Bluetooth mobile use and
              higher-priced touchscreen review. That packaging helps monetize convenience, but it also leaves room for
              cheaper or more specialized alternatives to win users whose priority is Bitcoin-only isolation,
              open-source verification, or avoiding a required companion application.
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Trust, displacement and moat durability
        blocks:
          - type: paragraph
            body: >-
              Ledger's moat is exposed to operational trust events that competitors can use as differentiation. The
              Yahoo Finance report says Ledger confirmed devices sold through CryptoBilis contained unauthorized
              electronic implants capable of stealing recovery phrases, while also reporting that Ledger had not
              confirmed how many devices were compromised or whether thefts occurred outside CryptoBilis. The same
              report says rival Trezor was reducing its reseller network despite reporting no compromise of its own
              products. Freemindtronic's chronology describes threats spanning seed-phrase and firmware attacks, PCB
              modification, the 2020 database leak, the 2023 Connect Kit compromise and a 2026 data leak, but these are
              claims by that publisher and should not be treated as independently verified incident counts. The
              competitive conclusion is narrower: supply-chain assurance, transparent recovery design and incident
              response are buying criteria, and Ledger cannot assume hardware isolation alone resolves them.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ledger wins the integrated middle
            body: >-
              Ledger is best positioned where buyers want multi-chain breadth, mobile access and a mature app layer, but
              specialist rivals can win when transparency, air-gapping, Bitcoin-only scope or recovery design dominates
              the brief.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned pool does not provide audited competitor revenue, comparable market shares, realized pricing,
              customer retention or independently verified security-test results; those remain diligence gaps rather
              than implied parity.
            calloutType: assumption
            claimRefs:
