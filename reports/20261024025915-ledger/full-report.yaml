            body: >-
              Ledger's company-issued Wallet 4.0 announcement describes an intended shift from hardware into a recurring
              trading and services model, built on more than 8 million devices sold. The disclosed architecture combines
              upfront signer sales with wallet activity, third-party buy and swap services, optional Recover
