  - id: FI001
    title: Revenue model bridge and missing conversion inputs
    type: flow
    summary: >-
      The public evidence identifies monetization paths from signer distribution to services, but it does not disclose
      the conversions, take rates, costs, or gross profit needed to quantify the bridge.
    data:
      nodes:
        - id: acquisition
          label: Customer acquisition
          detail: Channel mix, CAC, sales cycle and discounts are undisclosed.
        - id: device-sale
          label: Signer sale
          value: Upfront
          detail: Model-level units, ASP, returns and warranty expense are undisclosed.
        - id: installed-base
          label: Installed base
          value: '>8M devices sold'
          detail: Company-issued lifetime scale; active devices are undisclosed.
        - id: wallet-activity
          label: Wallet activity
          value: Undisclosed
          detail: Active users, transaction frequency and service attach are unavailable.
        - id: partner-services
          label: Partner transactions
          value: Undisclosed
          detail: Buy, swap and rewards activity may monetize through providers; take rate is unavailable.
        - id: recover
          label: Recover subscription
          value: $9.99/month proxy
          detail: Affiliate-review list price; subscribers, churn and contribution are unavailable.
        - id: enterprise
          label: Enterprise contracts
          value: Undisclosed
          detail: ACV, renewal, implementation cost and concentration are unavailable.
        - id: gross-profit
          label: Gross profit
          value: Undisclosed
          detail: No current segment gross-margin bridge is public in the assigned evidence.
      edges:
        - from: acquisition
          to: device-sale
          label: Conversion unavailable
        - from: device-sale
          to: installed-base
          label: Device activation unavailable
        - from: installed-base
          to: wallet-activity
          label: Active rate unavailable
        - from: wallet-activity
          to: partner-services
          label: Transaction attach unavailable
        - from: wallet-activity
          to: recover
          label: Subscription attach unavailable
        - from: acquisition
          to: enterprise
          label: Enterprise sales cycle unavailable
        - from: partner-services
          to: gross-profit
          label: Take rate and cost unavailable
        - from: recover
          to: gross-profit
          label: Contribution unavailable
        - from: enterprise
          to: gross-profit
          label: Contract margin unavailable
    approximationNotes: >-
      Qualitative flow only. Values retain their stated denominators; no conversion rate, revenue allocation, or
      gross-profit amount is estimated.
    claimRefs:
      - CI014
  - id: FE001
    title: Product security and operating stack
    type: stack
    summary: >-
      Ledger's product value and risk accumulate across user intent, host software, device controls, recovery services,
      enterprise operations, and distribution.
    data:
      layers:
        - label: User intent and verification
          detail: The user selects an action and checks the destination, amount, and policy.
          items:
            - Transaction review
            - Physical approval
        - label: Wallet and integration surface
          detail: Ledger Wallet, Wallet API, and external applications prepare and route actions.
          items:
            - Ledger Wallet
            - Wallet API and integrations
        - label: Device application layer
          detail: Device OS and chain applications interpret requests before signing.
          items:
            - BOLOS
            - Chain applications
        - label: Hardware trust anchor
          detail: Secure element and trusted display isolate keys and expose approval details.
          items:
            - Secure element
            - Device display and controls
        - label: Recovery and enterprise services
          detail: Optional recovery providers and enterprise policy systems extend the workflow.
          items:
            - Ledger Recover providers
            - Ledger Enterprise policy
        - label: Commerce and supply chain
          detail: E-commerce, logistics, and resellers affect privacy and physical authenticity.
          items:
            - Order-data processors
            - Distribution and resellers
    approximationNotes: >-
      The stack is a qualitative dependency map; layer order does not represent measured security strength, latency,
      ownership, or value contribution.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE008
      - CE010
      - CE011
      - CE012
      - CE016
  - id: FU001
    title: Customer journey from secure signing to expansion
    type: journey-map
    summary: >-
      Ledger's evidenced customer path moves from self-custody signing into wallet transactions, institutional
      governance, and partner-enabled financial services, with retention metrics remaining unobserved.
    data:
      nodes:
        - id: secure-signing
          label: Secure signing
          detail: Consumer or institutional user controls keys through a Ledger signer.
          touchpoints:
            - Hardware signer
            - Self-custody
          claimRefs:
            - CU001
            - CU003
        - id: wallet-management
          label: Wallet management
          detail: Ledger Wallet supports portfolio and transaction workflows; exact active usage is not disclosed.
          touchpoints:
            - Buy/sell/swap
            - Asset management
          claimRefs:
            - CU002
            - CU005
        - id: market-access
          label: Market access
          detail: Payward integration is intended to connect Ledger users to exchange and payment rails.
          touchpoints:
            - Kraken
            - Payward Services
          claimRefs:
            - CU005
        - id: institutional-governance
          label: Institutional governance
          detail: Ledger Enterprise is described with policy controls, approvals, and audit trails.
          touchpoints:
            - Custody
            - Governance
          claimRefs:
            - CU006
        - id: staking-yield
          label: Staking and yield
          detail: Named integrations extend use into staking and stablecoin yield surfaces.
          touchpoints:
            - Chorus One
            - Kiln
          claimRefs:
            - CU006
            - CU007
