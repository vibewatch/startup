  - id: FP001
    title: Competitive positioning by workflow emphasis
    type: quadrant
    summary: >-
      An ordinal evidence-backed map separates ecosystem breadth from isolation or transparency emphasis; positions are
      analytical approximations, not market-share measurements.
    data:
      xAxis: Workflow breadth and ecosystem integration (ordinal)
      yAxis: Isolation and transparency emphasis (ordinal)
      points:
